  text: לֹא יִהְיֶ֨ה שָׁ֜ם אַרְיֵ֗ה וּ/פְרִ֤יץ חַיּוֹת֙ בַּֽל יַעֲלֶ֔/נָּה לֹ֥א תִמָּצֵ֖א שָׁ֑ם וְ/הָלְכ֖וּ גְּאוּלִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/035/009.yaml
  text: No lion will be there[a], and no ravenous beast will go up on it; it will not be found there[c][b], but the redeemed will walk there.
translation:
  language: zh_hans
  text: 那里必没有狮子，凶暴的野兽[a]也必不上那条路[b]；在那里也找不到这种野兽，蒙救赎的人[c]必行走在那里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“凶猛的野兽”、“残暴的野兽”或“掠食的野兽”。
    reason: lexical_alternative
  - marker: b
    text: “那条路”原文为阴性代词，最可能指上一节所说的大道。
    reason: cross_reference
  - marker: c
    text: 或译“蒙赎回的人”。本节使用“救赎”这一希伯来词根，与下一节所用、通常译作“赎回”的另一个希伯来词根不同。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַרְיֵה
  choice: 狮子
  rationale: 这是常见的动物名称；希伯来文用单数作泛指，中文“狮子”也可自然地泛指此类猛兽。
- source_word: פְרִיץ חַיּוֹת
  choice: 凶猛的野兽
  rationale: פְרִיץ 含有凶暴、残酷或强横之意，与 חַיּוֹת 连用，指构成威胁的凶猛野兽；此译既保留暴烈含义，也符合现代中文表达。
- source_word: בַּל
  choice: 也必不
  rationale: 这是诗歌体否定词，在此加强否定；用“也必不”自然承接前句，并表达确定不会发生。
- source_word: יַעֲלֶנָּה
  choice: 上那条路
  rationale: עלה 的基本义是“上去”；阴性单数后缀最自然地回指上一节的“路／大道”。中文若只说“上它”不自然，因此在正文中明确为“那条路”，并以脚注说明所指。
- source_word: תִמָּצֵא
  choice: 必找不到它
  rationale: מצא 的尼法勒形式通常意为“被找到、出现”。阴性单数形式很可能回指刚提到的凶猛野兽；中文用“找不到它”保留单数指代和被发现之意。
- source_word: גְּאוּלִים
  choice: 蒙救赎的人
  rationale: 这是 גאל 的被动分词，指被赎回或蒙救赎的人。“蒙救赎的人”自然清楚，并保留其被动含义及救赎意涵。
- source_word: וְהָלְכוּ
  choice: 要行走其上
  rationale: הלך 是“走、行走”。“行走其上”既保持原词的普通动作含义，也将行走地点自然地连到前文的大道。
- source_word: שָׁם
  choice: 那里
  rationale: 原文重复使用地点副词，强调那地方的安全；中文保留两次“那里”。
theological_decisions:
- issue: גְּאוּלִים 的救赎术语
  choice: 蒙救赎的人
  alternative: 蒙赎回的人／被赎的人
  rationale: 本节使用词根 גאל，而下一节使用不同的词根 פדה。译作“蒙救赎的人”，可在上下文中保留两种希伯来语救赎词汇之间的区别，不把二者无说明地统一。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留原文两次“那里”的诗性强调；以“只有”表达危险野兽与蒙救赎者之间的转折对照。正文中的每个脚注标记均紧跟其所说明的词语。
