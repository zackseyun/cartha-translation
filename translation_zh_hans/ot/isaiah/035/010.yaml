id: ISA.35.10
reference: Isaiah 35:10
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וּ/פְדוּיֵ֨י יְהוָ֜ה יְשֻׁב֗וּ/ן וּ/בָ֤אוּ צִיּוֹן֙ בְּ/רִנָּ֔ה וְ/שִׂמְחַ֥ת עוֹלָ֖ם עַל רֹאשָׁ֑/ם שָׂשׂ֤וֹן וְ/שִׂמְחָה֙ יַשִּׂ֔יגוּ וְ/נָ֖סוּ יָג֥וֹן וַ/אֲנָחָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/035/010.yaml
  text: And the redeemed of Yahweh will return and come to Zion with singing; everlasting joy will be upon their heads. Gladness and joy will overtake them[a], and sorrow and sighing will flee away.
translation:
  language: zh_hans
  text: 蒙雅威救赎的人[a]必归回，欢呼着来到锡安；永远的喜乐必在他们头上。欢欣和喜乐必追上他们，忧愁和叹息都必逃去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“蒙雅威赎回的人”。希伯来语这个词可指蒙救赎或赎回的人。
    reason: 保留פדה在“救赎”与“赎回”之间的词义幅度。
lexical_decisions:
- source_word: וּפְדוּיֵי יְהוָה
  choice: 蒙雅威救赎的人
  rationale: פְדוּיֵי是פדה的被动分词，指蒙救赎或赎回的人。“蒙……救赎的人”既自然，也保留其救赎含义；神名יְהוָה音译为“雅威”。
- source_word: יְשֻׁבוּן
  choice: 必归回
  rationale: שוב表示返回、归回；“必归回”符合先知诗歌的语体，也表达这里所宣告的将来行动。
- source_word: וּבָאוּ צִיּוֹן
  choice: 来到锡安
  rationale: בוא可表示来或进入；原文在“锡安”前没有介词，“来到锡安”在中文中自然且不过度限定。
- source_word: בְּרִנָּה
  choice: 欢呼着
  rationale: רִנָּה指响亮的喜乐呼声，也可包括歌唱；“欢呼着”保留其范围，不把含义缩窄为唱歌。
- source_word: וְשִׂמְחַת עוֹלָם
  choice: 永远的喜乐
  rationale: 该结构直指持续到永远的喜乐；译文简洁地保留עוֹלָם的长久意味。
- source_word: עַל רֹאשָׁם
  choice: 在他们头上
  rationale: 按原文保留喜乐在头上的鲜明诗歌意象，不另行解释为冠冕或装饰。
- source_word: שָׂשׂוֹן וְשִׂמְחָה
  choice: 欢欣和喜乐
  rationale: 两个近义名词并列，译为两个彼此相关而有区别的中文词，以保留希伯来文的加强效果。
- source_word: יַשִּׂיגוּ
  choice: 必追上他们
  rationale: נשׂג可指达到、赶上或追上；以欢欣和喜乐为主语时，“追上”保留了拟人化的生动意象。
- source_word: וְנָסוּ
  choice: 都必逃去
  rationale: נוס本义为逃跑；忧愁和叹息在此被拟人化，因此保留“逃去”比抽象的“消失”更贴近原文。
- source_word: יָגוֹן וַאֲנָחָה
  choice: 忧愁和叹息
  rationale: יָגוֹן表示忧愁、悲伤，אֲנָחָה表示叹息或呻吟；此译兼顾内在痛苦及其外在声音。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”以现代汉语音译较直接地呈现这一立约之名，而不以称号替代。
- issue: פְדוּיֵי译作“救赎”还是“赎回”
  choice: 蒙雅威救赎的人
  alternative: 蒙雅威赎回的人
  rationale: 两者均在词义范围内。“救赎”自然表达本节宏大的拯救语境，但“赎回”更直接显出פדה的赎取色彩，故列入脚注，不把原文的意象限定为某一种机制。
translation_notes:
  register: 采用现代、庄重而易懂的先知诗歌语体。保留“喜乐在头上”“欢欣和喜乐追上他们”“忧愁和叹息逃去”等拟人化和具象表达，并以分号呈现本节前后两组平行意象。
