  text: וְ/הָיָ֤ה הַ/שָּׁרָב֙ לַ/אֲגַ֔ם וְ/צִמָּא֖וֹן לְ/מַבּ֣וּעֵי מָ֑יִם בִּ/נְוֵ֤ה תַנִּים֙ רִבְצָ֔/הּ חָצִ֖יר לְ/קָנֶ֥ה וָ/גֹֽמֶא׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/035/007.yaml
  text: The burning sand will become a pool[a], and the thirsty ground springs of water; in the haunt of jackals, where they lie down, there will be grass, reeds[c][b], and rushes.
translation:
  language: zh_hans
  text: 灼热的沙地必变成水池[a]，干渴之地必有泉水涌出；在豺狼栖息、躺卧之处[b]，必有青草、芦苇和蒲草[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“海市蜃楼必变成水池”。希伯来语 שָׁרָב 可指灼热，也可指炎热荒漠中闪烁如水的景象。
    reason: lexical_alternative
  - marker: b
    text: 本句也可译作“在豺狼的栖息之地，就是它的躺卧之处”。希伯来语句式紧缩，“豺狼”“栖息之地”和“躺卧之处”之间的关系可有不同理解。
    reason: syntactic_ambiguity
  - marker: c
    text: “蒲草”也可译作“纸莎草”；希伯来语 גֹמֶא 可指这类水生植物。末句的压缩结构也可理解为该处适于芦苇和蒲草生长。
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: הַשָּׁרָב
  choice: 灼热的沙地
  rationale: 该词可指灼人的热气，也可指炎热中闪烁、仿佛有水的荒漠景象。“灼热的沙地”使地貌转变的意象具体清楚，同时不把它仅仅理解为虚幻景象。
- source_word: לַאֲגַם
  choice: 水池
  rationale: אֲגַם 可指水池或沼泽；“水池”自然简明，且与荒地得水的图景相合。
- source_word: צִמָּאוֹן
  choice: 干渴之地
  rationale: 该名词既可表示“干渴”，也可表示干旱之处。平行结构指向地貌，译为“干渴之地”既保留拟人意象，也避免误解为人的口渴。
- source_word: לְמַבּוּעֵי מָיִם
  choice: 涌出泉水
  rationale: מַבּוּעַ 指泉源，原文为复数。汉语用“涌出泉水”自然表达多处水泉出现的丰盛景象。
- source_word: בִּנְוֵה תַנִּים
  choice: 豺狼栖息……之处
  rationale: נָוֶה 表示居所或栖息地；先知书荒野语境中的 תַנִּים 宜译为“豺狼”，不采用古旧且容易误导的“龙”。
- source_word: רִבְצָהּ
  choice: 躺卧之处
  rationale: 该词源于“躺卧、伏卧”，带阴性单数后缀。译文按语境把它与豺狼的栖息处相连，但以脚注说明原文关系紧缩而有歧义。
- source_word: חָצִיר
  choice: 青草
  rationale: חָצִיר 通常指草或草木；“青草”清楚呈现荒野恢复生机的画面。
- source_word: לְקָנֶה וָגֹמֶא
  choice: 变成芦苇和蒲草
  rationale: קָנֶה 指芦苇，גֹמֶא 指蒲草或纸莎草。介词 לְ 在此可表达结果或转变；译作“变成”较直接地反映“青草—芦苇和蒲草”的希伯来语结构。
theological_decisions:
- issue: 末句是植物并列，还是青草转变为湿地植物
  choice: 青草必变成芦苇和蒲草
  alternative: 必长出青草、芦苇和蒲草
  rationale: 原文 חָצִיר לְקָנֶה וָגֹמֶא 中芦苇和蒲草前有 לְ，较自然地表达结果或转变，而非单纯三项并列；这样也强化全节从干旱到水泽的转变意象，但脚注保留并列理解的可能。
translation_notes:
  register: 采用现代、庄重而通顺的普通话，保留希伯来诗歌中干旱之地转为水泽的鲜明对比。主文以“必”表达预告语气；末句依原文介词结构译为“青草必变成芦苇和蒲草”，并用脚注保留压缩句法所容许的其他理解。
