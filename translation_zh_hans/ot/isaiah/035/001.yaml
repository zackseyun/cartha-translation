  text: The wilderness and the dry land will rejoice[a]; the desert plain will be glad and blossom like the crocus.
translation:
  language: zh_hans
  text: 旷野和旱地必欢喜[a]；荒原必欢腾，像番红花[b]一样开花。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语词形也可能理解为“因他们而欢喜”；其中“他们”所指不明，且本句句法困难。正文将“旷野和旱地”理解为欢喜的主体。
    reason: textual_syntactical_ambiguity
  - marker: b
    text: 或译“百合花”“日光兰”，也可能是另一种球茎花卉；חֲבַצָּלֶת 所指的确切植物无法确定。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְשֻׂשׂוּם
  choice: 必欢喜
  rationale: 词根 שׂוּשׂ 表达强烈、洋溢的喜悦；未完成式在预言语境中表达将要发生之事，因此译作“必欢喜”。词尾可能含第三人称阳性复数宾语后缀，另见脚注。
- source_word: מִדְבָּר
  choice: 旷野
  rationale: 指未开垦、荒凉的地带，不必限定为多沙的沙漠；“旷野”符合先知诗歌的语域。
- source_word: צִיָּה
  choice: 旱地
  rationale: 突出土地干燥缺水的特征，与“旷野”并列自然且简洁。
- source_word: תָגֵל
  choice: 必快乐
  rationale: 源自 גיל，表示喜乐、欢腾；用“快乐”与前句“欢喜”形成自然变化，同时保留两词语义上的呼应。
- source_word: עֲרָבָה
  choice: 荒原
  rationale: 此处宜按普通名词理解，指干旱的平原或草原地带，而非专名“亚拉巴”；“荒原”既清楚又适合诗歌意象。
- source_word: תִפְרַח
  choice: 绽放
  rationale: פרח 描写植物发芽、开花；在“像……花”的结构中，“绽放”自然地呈现荒地繁花盛开的图景。
- source_word: חֲבַצָּלֶת
  choice: 番红花
  rationale: 所指花种无法确定；“番红花”是较常见的现代对应词，但以脚注保留百合、日光兰等可能。
