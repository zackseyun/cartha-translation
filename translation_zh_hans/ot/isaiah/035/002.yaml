id: ISA.35.2
reference: Isaiah 35:2
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: פָּרֹ֨חַ תִּפְרַ֜ח וְ/תָגֵ֗ל אַ֚ף גִּילַ֣ת וְ/רַנֵּ֔ן כְּב֤וֹד הַ/לְּבָנוֹן֙ נִתַּן לָ֔/הּ הֲדַ֥ר הַ/כַּרְמֶ֖ל וְ/הַ/שָּׁר֑וֹן הֵ֛מָּה יִרְא֥וּ כְבוֹד יְהוָ֖ה הֲדַ֥ר אֱלֹהֵֽי/נוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/035/002.yaml
  text: It will blossom abundantly and rejoice—yes[a], with rejoicing and a shout of joy. The glory of Lebanon will be given to it, the majesty of Carmel and Sharon. They will see the glory of Yahweh[c][b], the majesty of our God.
translation:
  language: zh_hans
  text: 它必盛开，繁花似锦；必欢腾，欢喜地欢呼。黎巴嫩的荣耀必赐给它；迦密和沙仑的荣美也必赐给它。他们必看见雅威的荣耀，我们上帝的荣美。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פָּרֹחַ תִּפְרַח
  choice: 必繁花盛开
  rationale: 不定式绝对式与未完成式同用，加强“开花”的语意；“繁花盛开”以自然中文表达丰盛而确定的绽放。
- source_word: וְתָגֵל
  choice: 并且欢腾
  rationale: גיל 表示强烈、外显的喜乐；“欢腾”既保留诗意，也与后面的欢呼相配。
- source_word: אַף גִּילַת וְרַנֵּן
  choice: 是的，它要欢腾，并发出欢呼
  rationale: אַף 在此加强语气；同根的 גילַת 延续并强化前面的喜乐，רנן 则表达可听见的欢唱或欢呼。
- source_word: כְּבוֹד הַלְּבָנוֹן
  choice: 黎巴嫩的荣耀
  rationale: 将 כבוד 译为“荣耀”，保留它与后文“雅威的荣耀”之间有意的词语呼应。
- source_word: נִתַּן לָהּ
  choice: 必赐给它
  rationale: 虽为完成式被动形态，但在本段预告复兴的语境中具有将来意义；阴性单数“它”承接旷野之地。
- source_word: הֲדַר הַכַּרְמֶל וְהַשָּׁרוֹן
  choice: 迦密和沙仑的华美
  rationale: הדר 可指威荣、光彩或美丽；用于肥美地区时，“华美”自然贴切，并可在下句继续表达上帝的庄严光彩。
- source_word: הֵמָּה יִרְאוּ
  choice: 他们必看见
  rationale: 保留希伯来文明确的阳性复数代词和动词，不把其所指对象武断改成土地，也不以被动句消除原文的指称张力。
- source_word: כְבוֹד יְהוָה
  choice: 雅威的荣耀
  rationale: 以“雅威”音译四字神名，并保留 כבוד 与“黎巴嫩的荣耀”的词汇呼应。
- source_word: הֲדַר אֱלֹהֵינוּ
  choice: 我们上帝的华美
  rationale: 继续以“华美”对应 הדר，保存上下两处用词的平行，同时表达上帝显现的荣美。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；“雅威”较贴近学界通常重构的读音，并借脚注说明传统译法，不把专名改写为称号。
- issue: הֵמָּה（他们）的所指
  choice: 保留“他们”
  alternative: 把复兴之地拟人化为“它们”；改写为“在那里必看见”
  rationale: 希伯来文从阴性单数的土地转为阳性复数主语，所指可能是与复兴之地相关的人。直译复数代词可保留这一真实歧义，避免过度解释。
- issue: 以 הדר 同时描写地区和上帝
  choice: 两处均译“华美”
  alternative: 前处译“秀美”，后处译“威荣”
  rationale: 一致译法保留原诗的平行和词汇纽带，不预先拆分自然之美与神圣威荣之间的关联。
translation_notes:
  register: 采用现代、庄重而清楚的普通话诗体。“繁花盛开”“欢腾”“欢呼”体现递进的喜乐；保留“他们”造成的指称转换，以忠实呈现原文的语法张力。
