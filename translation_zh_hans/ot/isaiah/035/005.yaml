  text: אָ֥ז תִּפָּקַ֖חְנָה עֵינֵ֣י עִוְרִ֑ים וְ/אָזְנֵ֥י חֵרְשִׁ֖ים תִּפָּתַֽחְנָה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/035/005.yaml
  text: Then the eyes of the blind will be opened[a], and the ears of the deaf will be opened.
translation:
  language: zh_hans
  text: 那时，盲人的眼睛必睁开；聋人的耳朵必得开启[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “开启”或译“打开”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: 那时
  rationale: 表示先知性叙述中随之来到的时刻；“那时”自然简洁，也保留其前瞻意味。
- source_word: תִּפָּקַחְנָה
  choice: 必睁开
  rationale: פקח的尼法勒未完成式，主语为“眼睛”；“睁开”符合现代汉语对眼睛恢复视力的表达，并保留被开启的意象。
- source_word: עֵינֵי עִוְרִים
  choice: 盲人的眼睛
  rationale: 忠实表达构词关系；“盲人”比“瞎子”更符合现代、庄重且尊重人的用语。
- source_word: וְאָזְנֵי חֵרְשִׁים
  choice: 聋人的耳朵
  rationale: 保留原文与前半句平行的结构；“聋人”是现代而尊重人的表达。
- source_word: תִּפָּתַחְנָה
  choice: 必开启
  rationale: פתח的尼法勒未完成式，字面为“被打开”；用于耳朵时，“开启”既保留原文意象，也自然传达听觉恢复。
theological_decisions:
- issue: 复兴图景的性质
  choice: 按具体的身体恢复图景直译，不限定为纯粹肉身医治或纯粹属灵领悟。
  alternative: 仅指神迹性的身体医治；或仅指属灵知觉的恢复。
  rationale: 经文本身以眼睛和耳朵的恢复来描写将来的复兴；译文应保留这一具体意象，不替读者裁定其应验是身体性的、属灵性的，还是兼而有之。
translation_notes:
  register: 采用现代标准普通话，语气庄重而通俗。两分句维持希伯来诗歌的平行结构；以“必”表达未完成式在先知语境中的将来确定性。
