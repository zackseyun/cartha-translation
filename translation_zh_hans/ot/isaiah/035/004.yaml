source:
  edition: WLC
  text: אִמְרוּ֙ לְ/נִמְהֲרֵי לֵ֔ב חִזְק֖וּ אַל תִּירָ֑אוּ הִנֵּ֤ה אֱלֹֽהֵי/כֶם֙ נָקָ֣ם יָב֔וֹא גְּמ֣וּל אֱלֹהִ֔ים ה֥וּא יָב֖וֹא וְ/יֹשַׁעֲ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/035/004.yaml
  text: Say to those with an anxious heart[a], “Be strong; do not fear. Look, your God will come with vengeance, with the recompense of God[b]; he himself will come and save you.”
translation:
  language: zh_hans
  text: '要对心里慌乱的人说[a]：

    “你们要刚强，不要惧怕！

    看哪，你们的上帝必来施行报应，

    带着上帝的报偿[b]而来；

    他必亲自来拯救你们。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “心里慌乱”直译为“心中急促”，可指内心躁动、惊慌失措的人。
    reason: lexical_alternative
  - marker: b
    text: “上帝的报偿”也可译作“神圣的报偿”或“上帝所施的报应”。
    reason: lexical_alternative
lexical_decisions:
- source_word: נִמְהֲרֵי לֵב
  choice: 心里慌乱的人
  rationale: 该短语字面近于“心中急促的人”，在本语境中指内心躁动、惊慌不安的人。“心里慌乱”既传达这种内在状态，也避免与下句“不要惧怕”完全重复。
- source_word: חִזְקוּ
  choice: 你们要刚强
  rationale: 直接保留复数命令语气；“刚强”庄重、清楚，并与经文的劝勉语体相称。
- source_word: אַל תִּירָאוּ
  choice: 不要惧怕
  rationale: 准确表达否定命令，语言简洁，保留经文庄重语域。
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留引人注意和强调即将宣告之事的功能；“看哪”在现代中文中仍是可理解的庄重经文用语。
- source_word: אֱלֹהֵיכֶם
  choice: 你们的上帝
  rationale: 准确保留第二人称复数所属关系及其关系性意味。
- source_word: נָקָם
  choice: 施行报应
  rationale: 该名词表示报仇、惩治或报应。结合动词“来”，译作“来施行报应”较自然，也明确这是上帝针对恶者的惩治行动，而不弱化为泛泛的公正。
- source_word: גְּמוּל אֱלֹהִים
  choice: 上帝的报偿
  rationale: 紧贴原文属格结构，不预先限定这是主语属格还是强调其神圣性质；“报偿”可涵盖按行为偿还、报应之义。
- source_word: הוּא
  choice: 他必亲自
  rationale: 独立代词带有强调作用；“亲自”自然传达上帝自己前来行动的语气。
- source_word: וְיֹשַׁעֲכֶם
  choice: 来拯救你们
  rationale: 使役词形表达施救、搭救；“拯救”既适合眼前的解救语境，也保留较广的神学内涵。
theological_decisions:
- issue: 上帝的报应与拯救之间的关系
  choice: 同时直译两方面：上帝来施行报应，也亲自拯救他的子民。
  alternative: 把“报应”弱化为一般的公义，或把“拯救”仅解释为属灵救恩。
  rationale: 希伯来文本把报应、报偿与拯救并列呈现。译文保留这种张力，不限定报应的对象，也不缩窄拯救的范围。
- issue: גְּמוּל אֱלֹהִים 的属格关系
  choice: 上帝的报偿
  alternative: 神圣的报偿；上帝所给予的报偿
  rationale: 原文结构本身简练，可能强调报偿属于上帝、来自上帝或具有上帝施行的性质。“上帝的报偿”保留这种开放性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“看哪”“刚强”“惧怕”保留先知宣告的经文语气；分行呈现原文的诗体节奏和平行结构。
