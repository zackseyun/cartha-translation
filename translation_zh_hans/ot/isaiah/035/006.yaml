base_translation:
  language: en
  yaml_path: translation/ot/isaiah/035/006.yaml
  text: Then the lame will leap like a deer[a], and the tongue of the mute will sing for joy; for waters have burst forth in the wilderness[b], and streams in the desert plain.
translation:
  language: zh_hans
  text: 那时，瘸腿的人必像鹿一样跳跃；不能说话之人的舌头必欢唱[a]，因为旷野必涌出水来，荒原必有溪流[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “欢唱”也可译作“欢呼”。
    reason: lexical_alternative
  - marker: b
    text: “荒原”也可译作地名“亚拉巴”。
    reason: alternative_reading
lexical_decisions:
- source_word: יְדַלֵּג
  choice: 必……跳跃
  rationale: 该词为加强语态未完成式，描绘有力而欢快的跳跃；“跳跃”自然、鲜明，也适合身体复原的语境。
- source_word: כָּאַיָּל
  choice: 像鹿一样
  rationale: אַיָּל可指雄鹿或鹿；“鹿”是现代汉语中最自然、易懂的统称，并保留原文比喻。
- source_word: פִּסֵּחַ
  choice: 瘸腿的
  rationale: 该形容词在此作名词用，单数而具泛指意义；“瘸腿的”贴近原文，又避免增添原文没有的性别限定。
- source_word: וְתָרֹן
  choice: 必欢呼
  rationale: רנן表示因喜乐而发出响亮呼声，也可含歌唱意味；“欢呼”与“舌头”搭配自然，并保留声音恢复及喜乐迸发的意象。
- source_word: לְשׁוֹן אִלֵּם
  choice: 哑巴的舌头
  rationale: 依照原文保留“舌头”这一具体身体意象，突出说话能力得到恢复；“哑巴”简明易懂。
- source_word: נִבְקְעוּ
  choice: 必涌出……来
  rationale: 该动词被动词干含裂开、迸出的意思；以水为主语时，“涌出”最符合现代汉语习惯，也呈现水突然出现的力度。
- source_word: בַמִּדְבָּר
  choice: 旷野
  rationale: מִדְבָּר指荒凉、未经耕作之地；“旷野”保留其宽广荒芜的圣经语域，并与下句“荒原”形成对应。
- source_word: מַיִם
  choice: 水
  rationale: 希伯来语使用复数形式，但现代汉语通常以不可数的“水”表达，若译作“众水”反而不自然。
- source_word: וּנְחָלִים
  choice: 溪流
  rationale: נְחָלִים可指溪流、河谷水道；此处强调荒地中出现流动的水，“溪流”清楚而自然。
- source_word: בָּעֲרָבָה
  choice: 荒原
  rationale: עֲרָבָה可作普通名词，指干旱的平原或荒漠地带，也可作地名“亚拉巴”；正文采用与“旷野”平行的普通名词义，同时以脚注保留地名可能。
theological_decisions:
- issue: 复原景象的性质
  choice: 按经文直接呈现身体得医治与荒地得水滋润的具体图景，不限定其应验方式。
  alternative: 将全节仅解释为属灵复兴的隐喻，或限定为某一特定末世阶段的字面事件。
  rationale: 原文并列描写身体残障逆转与自然环境更新；译文应保留这完整的先知性张力，不替经文预先裁定其神学应验框架。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“那时……必……”保留先知诗歌的未来指向和节奏；两组平行句尽量简洁对称。
