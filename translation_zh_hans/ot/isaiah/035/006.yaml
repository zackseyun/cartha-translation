revisions:
- from: 那时，瘸腿的必像鹿一样跳跃，哑巴的舌头必欢呼[a]；因为旷野必涌出水来，荒原必有溪流[b]。
  to: 那时，瘸腿的人必像鹿一样跳跃；不能说话之人的舌头必欢唱[a]，因为旷野必涌出水来，荒原必有溪流[b]。
  rationale: 修订仅处理当代汉语中对残障者的合宜称谓，并调整 רנן 的正文与脚注次序。其余措辞保留原译，以维持原文的诗性平行、具体医治和荒地得水的图景，以及“亚拉巴”可作地名的歧义。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T07:21:15Z'
review_pass:
  verdict: revise
  source_fidelity: 整体准确地呈现了两组复兴图景及其平行结构。“必”可恰当地传达本节先知性语境中的未来结果；“旷野／荒原”和“水／溪流”也保留了原文的地貌与水源意象。惟“欢呼”虽属可行词义，正文宜采用更贴合与“舌头”搭配、也与英文审校主文一致的“欢唱”，并把“欢呼”保留为脚注替代译法。
  naturalness: “哑巴的舌头”在当代普通话中带有较明显的口语和可能贬抑色彩，不适合本段庄重的经文语体。改为“不能说话之人的舌头”既自然尊重，也保留原文以“舌头”突显言语能力恢复的表达。
  terminology: “瘸腿的人”“鹿”“旷野”“荒原”“溪流”均适当。“不能说话之人”避免以带污名色彩的名词标签指称人；“欢唱”表达 רנן 所含的喜乐歌唱，脚注保留“欢呼”的合理词义范围。
  issues:
  - severity: medium
    issue: “哑巴的舌头”的当代语体与指称不够妥当。
    rationale: “哑巴”在现代普通话里常带口语化及可能贬抑的色彩；原文只是指不能说话的人，并无贬义。应以较庄重、尊重的表达呈现，同时保留“舌头”这一身体意象。
  - severity: low
    issue: 正文“欢呼”与英文审校主文的“sing for joy”取向不一致，且“欢唱”与“舌头”搭配更凝练。
    rationale: רנן可以指欢呼或欢唱，故不涉及实质误译；但采用“欢唱”为正文，并将“欢呼”置于脚注，能更好反映英文审校轨迹及汉语诗歌表达。
  revised_text: 那时，瘸腿的人必像鹿一样跳跃；不能说话之人的舌头必欢唱[a]，因为旷野必涌出水来，荒原必有溪流[b]。
  revised_footnotes:
