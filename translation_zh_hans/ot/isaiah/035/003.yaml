base_translation:
  language: en
  yaml_path: translation/ot/isaiah/035/003.yaml
  text: Strengthen weak hands[a], and make firm feeble knees.
translation:
  language: zh_hans
  text: 你们要使无力的手强壮，使站立不稳的膝盖[a]稳固。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“摇晃的膝盖”或“发软的膝盖”。希伯来语分词所描绘的是膝盖踉跄、摇摆、支撑不住的样子。
    reason: lexical_alternative
lexical_decisions:
- source_word: חַזְּקוּ
  choice: 要使……强壮
  rationale: 这是חזק的Piel复数命令式，以“手”为宾语，表示使之强壮；加“要”自然传达汉语中的劝勉、命令语气。
- source_word: יָדַיִם
  choice: 手
  rationale: 保留原文具体的身体意象；希伯来语双数形式在现代汉语中自然译作“手”。
- source_word: רָפוֹת
  choice: 无力的
  rationale: רפה在这里描写手松软、缺乏力量；“无力的”清楚自然，又保留身体软弱的比喻。
- source_word: וּבִרְכַּיִם
  choice: 使……膝盖
  rationale: “膝盖”直译原词；连接词וּ所表达的并列关系通过两个连续的“使”结构自然呈现，不机械增添“并且”。
- source_word: כֹּשְׁלוֹת
  choice: 站立不稳的
  rationale: כשל的Qal主动分词描绘踉跄、摇晃、几乎支撑不住的状态；“站立不稳”比单纯“软弱”更能保留原文动态意象，同时符合现代汉语表达。
- source_word: אַמֵּצוּ
  choice: 使……稳固
  rationale: אמץ的Piel复数命令式表示使之坚固有力；“稳固”既与膝盖的意象自然搭配，也保留它与前句“强壮”之间的诗意变化。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的劝勉语体。保留“手”和“膝盖”的平行身体意象，并用“强壮／稳固”呈现两个近义命令动词的诗意变化。脚注标在其实际说明的“膝盖”短语之后。
