  text: חַֽסְדֵ֨י יְהוָ֤ה אַזְכִּיר֙ תְּהִלֹּ֣ת יְהוָ֔ה כְּ/עַ֕ל כֹּ֥ל אֲשֶׁר גְּמָלָ֖/נוּ יְהוָ֑ה וְ/רַב טוּב֙ לְ/בֵ֣ית יִשְׂרָאֵ֔ל אֲשֶׁר גְּמָלָ֥/ם כְּֽ/רַחֲמָ֖י/ו וּ/כְ/רֹ֥ב חֲסָדָֽי/ו׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/063/007.yaml
  text: I will recount the steadfast love of Yahweh[a], the praises of Yahweh, according to all that Yahweh has bestowed on us[c][b], and the great goodness to the house of Israel that he has bestowed on them according to his compassion and according to the abundance of his steadfast love.
translation:
  language: zh_hans
  text: 我要述说耶和华[a]的慈爱和耶和华的可颂赞作为：照着耶和华厚待我们的一切，以及他向以色列家所施的丰盛恩惠；他是照着自己的怜悯和丰盛的慈爱厚待他们的[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “耶和华”译自神名 YHWH；也常按另一种拟音译作“雅威”。
    reason: 说明神名的音译选择及古代读音的不确定性。
  - marker: b
    text: “厚待他们”译自希伯来文 גמל；同词在前文也指耶和华“厚待我们”。此词可指施予、报偿或以某种方式对待；此处语境表明为恩惠的对待。
    reason: 说明 גמל 的语义范围，并使脚注同时明确适用于本节两次出现的该词。
lexical_decisions:
- source_word: חַסְדֵי / חֲסָדָיו
  choice: 慈爱
  rationale: חסד兼有仁慈、忠贞和持久之爱的内涵。“慈爱”是现代中文圣经语体中自然庄重的表达；同节两处保持一致，并由“丰盛”传达末处的数量意味。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 直接呈现四字神名在现代标准普通话中的通行音译，区别于以“主”这一称号替代神名。
- source_word: אַזְכִּיר
  choice: 我要述说
  rationale: 此处使役形在赞美语境中指把事情提起并公开讲述，不只是内心记念；“述说”自然地体现宣告意味。
- source_word: תְּהִלֹּת
  choice: 可颂赞的作为
  rationale: 复数名词既可指赞美，也可指引发赞美的事迹。上下文随即列举耶和华的恩惠，因此译作“可颂赞的作为”，同时保留与赞美的联系。
- source_word: כְּעַל כֹּל אֲשֶׁר
  choice: 这一切，都是
  rationale: 该结构较为少见，可表示与前述颂赞相称的根据或范围。中文以承接句表达“照着／因着他所做的一切”的关系，避免生硬直译。
- source_word: גְּמָלָנוּ / גְּמָלָם
  choice: 厚赐给我们的／厚赐给他们的
  rationale: גמל本可泛指对待、报偿或施予；本节明确处于恩惠语境，“厚赐”传达善待和丰厚施予，并保留原文由“我们”转为“他们”的人称变化。
- source_word: וְרַב טוּב
  choice: 丰盛恩惠
  rationale: טוב可指美善或所赐的福惠；这里是向以色列家所施的善，译作“丰盛恩惠”比抽象的“极大良善”更符合中文搭配。
- source_word: לְבֵית יִשְׂרָאֵל
  choice: 向以色列家
  rationale: 保留“以色列家”这一群体称谓，并以“向……所施”表达介词的受益、指向关系。
- source_word: כְּרַחֲמָיו
  choice: 照着自己的怜悯
  rationale: רחמים表示深切的怜恤。“怜悯”保留其情感与施恩意味；反身代词使中文所指清楚。
- source_word: וּכְרֹב חֲסָדָיו
  choice: 和丰盛的慈爱
  rationale: רֹב强调众多或丰厚；“丰盛的慈爱”自然呈现其丰富程度，又与句首的 חסד 呼应。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 原文直接使用四字神名。中文正文采用读者最熟悉的专名音译“耶和华”，不以称号“上主”取代；脚注注明另一常见拟音“雅威”，承认古代读音不能完全确定。
- issue: חסד 的神学内涵
  choice: 慈爱
  alternative: 信实之爱；怜爱；忠贞的爱
  rationale: 该词包含慈善、忠诚和关系中的恒久之爱，但单凭本节不宜把“盟约”作为明说内容加入正文。“慈爱”保持宽广内涵，避免将其缩窄为单一教义概念。
- issue: תְּהִלּוֹת 指赞美言辞还是可赞美的事迹
  choice: 可颂赞的作为
  alternative: 颂赞；美德
  rationale: 复数形式存在语义张力；后文列举神的厚赐和恩惠，语境更偏向值得颂赞的作为。该译法没有把它仅限于人的赞美言辞。
translation_notes:
  register: 采用现代、庄重而可朗读的普通话。以分号和补述句梳理希伯来语较长的并列结构；保留“以色列家”及原文从“我们”转为“他们”的变化。所有脚注标记均置于正文相应位置。
