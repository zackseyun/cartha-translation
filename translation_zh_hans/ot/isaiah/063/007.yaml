    rationale: 原文此处连同后面的“向以色列家所施的丰盛恩惠”，是“述说／称颂”的根据或范围；原译将其独立为判断句，又重复加入“我要述说”，虽不致严重失义，却稍改变了并列结构和修辞推进。
  - severity: low
