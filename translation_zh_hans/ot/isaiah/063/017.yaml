source:
  edition: WLC
  text: לָ֣/מָּה תַתְעֵ֤/נוּ יְהוָה֙ מִ/דְּרָכֶ֔י/ךָ תַּקְשִׁ֥יחַ לִבֵּ֖/נוּ מִ/יִּרְאָתֶ֑/ךָ שׁ֚וּב לְמַ֣עַן עֲבָדֶ֔י/ךָ שִׁבְטֵ֖י נַחֲלָתֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/063/017.yaml
  text: Why[a], Yahweh, do you make us wander from your ways and harden our hearts from fearing you? Return for the sake of your servants[c][b], the tribes of your inheritance.
translation:
  language: zh_hans
  text: 耶和华啊，你为什么使我们偏离[a]你的道路，使我们的心[b]刚硬，不再敬畏你？求你为你仆人的缘故回转；他们是你产业的众支派[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“使我们迷失”或“任我们偏离”。希伯来文动词是使役式，直接说神使百姓走偏；本句以哀祷的语言保留神主权与百姓偏离之间的张力。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译为“我们的心”，其中“心”是单数，把百姓作为一个整体来表达。
    reason: lexical_alternative
  - marker: c
    text: 也可译作“转回来”。这里祈求神重新转向他的百姓、眷顾他们。
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָּה
  choice: 为什么
  rationale: 直接表达哀歌中的质问，不额外加强语气。
- source_word: תַתְעֵנוּ
  choice: 使我们偏离
  rationale: 该词是תעה的使役式，直指耶和华使百姓离开他的道路；“偏离”在现代汉语中自然，也避免“引入歧途”可能带出的蓄意欺骗意味。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经传统中对神圣四字名的通行音译，以专名而非头衔表达原文。
- source_word: מִדְּרָכֶיךָ
  choice: 你的道路
  rationale: מן表示离开；汉语“偏离你的道路”已自然包含这一分离方向。
- source_word: תַּקְשִׁיחַ
  choice: 使……刚硬
  rationale: 保留קשׁח使役式的直接因果表达，也符合“心刚硬”的现代宗教汉语习惯。
- source_word: לִבֵּנוּ
  choice: 我们的心
  rationale: 保留希伯来文单数的集体表达，将百姓呈现为共同体。
- source_word: מִיִּרְאָתֶךָ
  choice: 不再敬畏你
  rationale: 自然表达因心刚硬而与敬畏神相隔的意思；比直译为“远离你的敬畏”更符合现代汉语。
- source_word: שׁוּב
  choice: 回转
  rationale: 保留“转回、返回”的基本意象，并适合向神发出的圣约性恳求。
- source_word: לְמַעַן
  choice: 为……的缘故
  rationale: 准确表达祈求所依据的对象或缘由。
- source_word: עֲבָדֶיךָ
  choice: 你仆人
  rationale: 此处指属于神、事奉神的立约群体；“仆人”比“奴隶”更切合语境。
- source_word: שִׁבְטֵי נַחֲלָתֶךָ
  choice: 你产业的众支派
  rationale: שׁבט在此指以色列各支派；“产业”保留נחלה的圣约含义。破折号显明该短语与“你仆人”的同位关系。
theological_decisions:
- issue: 百姓偏离和心硬是否直接归因于耶和华
  choice: 保留“使我们偏离”“使我们的心刚硬”的直接使役表达
  alternative: 弱化为“任凭我们偏离”或“容许我们的心刚硬”
  rationale: 原文两个动词都以使役式直接对耶和华发问。译文保留哀祷中关于神主权的张力，不以许可性措辞替原文作神学解释。
- issue: “我们的心”的群体单数
  choice: 译作“我们的心”
  alternative: 译作“我们的心灵”或按个体复数理解
  rationale: 原文“心”为单数，表达全体百姓共同的内在状态；现代汉语可以自然承载这种集体用法。
- issue: שׁוּב用于向神祈求
  choice: 译作“回转”
  alternative: 译作“转回来”或解释为“重新施恩”
  rationale: “回转”保留原词的动作意象和一定开放性；不把圣约眷顾的语境含义直接写入正文。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。正文保留希伯来诗歌直率的质问、两个使役表达及群体单数“心”；以破折号清楚呈现“你仆人”与“你产业的众支派”的同位关系。
