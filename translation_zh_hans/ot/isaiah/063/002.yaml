  yaml_path: translation/ot/isaiah/063/002.yaml
  text: Why is your clothing red[b][a], and your garments like one who treads in the winepress?
translation:
  language: zh_hans
  text: 你的衣服为何是红色的[a]？你的衣裳为何像在酒榨中踩踏葡萄之人所穿的衣裳[b]？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“染红的”或“绯红的”；希伯来文只说“红的”，其成因留待上下文说明。
    reason: lexical_alternative
  - marker: b
    text: 这里是以在酒榨中踩葡萄的人作比；踩踏时，红色的葡萄汁会溅染衣裳。
    reason: cultural_note
lexical_decisions:
- source_word: מַדּוּעַ
  choice: 为何
  rationale: 这是直接询问原因的疑问词；“为何”简洁、庄重，也符合诗歌语体。
- source_word: אָדֹם
  choice: 红的
  rationale: 原文只陈述颜色是红的，并未在本节明确说明是血染或其他原因；直译可保留上下文随后揭示的张力。
- source_word: לִלְבוּשֶׁךָ
  choice: 你的衣服
  rationale: לְבוּשׁ泛指衣着；“衣服”是自然、清楚的现代汉语，不将其限缩为某一种袍服。
- source_word: וּבְגָדֶיךָ
  choice: 你的衣裳
  rationale: בֶּגֶד指衣物；“衣裳”既保持与“衣服”的诗意平行，也不过分古奥。
- source_word: כְּדֹרֵךְ
  choice: 像那……踩踏之人的衣裳
  rationale: כְּ表示比较，דֹרֵךְ是表示正在踩踏者的分词。汉语补出比较中省略的“衣裳”，使句意完整，同时不改变意象。
- source_word: בְּגַת
  choice: 在榨酒池中
  rationale: גַּת指用脚踩压葡萄的酒榨或榨酒池；“榨酒池”在现代汉语中较易理解，并保留古代酿酒场景。
theological_decisions:
- issue: 是否在红衣意象中明说鲜血与审判
  choice: 正文仅译为“红的”，不添加“血染的”等解释。
  alternative: 译为“血染的”或“血红的”。
  rationale: 本节原文只描述衣服的颜色，并以榨酒池中的踩踏者作比；鲜血与审判的意义在下文才更加明确。保留字面意象可避免提前消除经文的文学和神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“衣服／衣裳”保留原文的诗意平行；两个问句使汉语结构清楚自然。脚注解释榨酒池的文化图景，但正文不提前加入“葡萄”或“血染”等解释性内容。
