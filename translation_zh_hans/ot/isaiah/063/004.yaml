  text: כִּ֛י י֥וֹם נָקָ֖ם בְּ/לִבִּ֑/י וּ/שְׁנַ֥ת גְּאוּלַ֖/י בָּֽאָה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/063/004.yaml
  text: For the day of vengeance was in my heart[a], and the year of my redeemed had come.
translation:
  language: zh_hans
  text: 因为报仇之日在我心中；我所救赎之民的年已经来到。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 引出说话者采取前述行动的原因；“因为”自然保留希伯来文的解释性连接。
- source_word: יוֹם נָקָם
  choice: 报仇之日
  rationale: 保留“日”这一时间意象；“报仇”表达 נָקָם 所含的惩罚、伸冤与追讨之意，而不将其弱化为笼统的审判。
- source_word: בְּלִבִּי
  choice: 在我心中
  rationale: 贴近希伯来文的身体—内心表达，既可指意念，也可指决意，不窄化为单纯的思想活动。
- source_word: וּשְׁנַת
  choice: 年期
  rationale: שָׁנָה 本义为“年”；在此指所定的一年或时期。“年期”既保留“年”，也符合现代汉语表达。
- source_word: גְּאוּלַי
  choice: 我所救赎之人
  rationale: 按马所拉读音，最直接理解为带第一人称单数所属后缀的复数被动分词，即“我的蒙救赎者／我所救赎的人”。正文采用自然、清楚的现代汉语，同时以脚注保留其可被理解为说话者施行救赎之时期的可能性。
- source_word: בָּאָה
  choice: 已经来到
  rationale: 阴性单数完成式与“年”呼应；“已经来到”表达指定的年期现已临到。
theological_decisions:
- issue: גְּאוּלַי 在审判与拯救并列结构中的所指
  choice: 正文译作“我所救赎之人”，突出该词按马所拉读音所指的蒙救赎者。
  alternative: “我施行救赎的年期”，将重点放在说话者的救赎行动。
  rationale: “报仇之日”与“我所救赎之人的年期”并列，使惩罚与拯救同时呈现。正文遵循词形的较直接含义，脚注则保留事件性理解，不把经文的神学张力化约为单一方面。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“报仇之日”“在我心中”保留原文鲜明意象；“我所救赎之人”比“我的赎民”略为展开，以避免后者可能带来的固定宗教术语色彩。
