  source_fidelity: 正文将 גְּאוּלַי 译为“我所救赎之民”，较准确地表达其可作“我的蒙救赎者／我所救赎的人”的理解；脚注保留其可指说话者救赎行动的另一理解。“已经来到”恰当地传达完成式在此语境中所表示的既已临到。
  naturalness: 原文“我所救赎之人的年期”中，“年期”在现代汉语通常指年限或期限，不适合 כאן 所指已定的“年”；“我所救赎之人”后接“年期”也较生硬。改为“我所救赎之民的年已经来到”，保留原文的诗性所属关系，同时更合乎庄重、自然的现代汉语经文语体。
  terminology: “报仇之日”保留 נָקָם 的报应、伸冤意味，并与经文传统用语相连；“在我心中”保留内在决意的意象。“救赎之民”避免将 גְּאוּלַי 武断地抽象化为单纯的救赎行动。
