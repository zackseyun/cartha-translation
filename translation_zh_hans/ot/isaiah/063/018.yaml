base_translation:
  language: en
  yaml_path: translation/ot/isaiah/063/018.yaml
  text: Your holy people possessed it for a little while[b][a]; our adversaries have trampled your sanctuary.
translation:
  language: zh_hans
  text: 你的圣民占有之时不过片刻[a][b]；我们的敌人践踏了你的圣所。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“只有短短一段时间”，也可能指“仅在很小的程度上”；希伯来语可表示时间短暂或程度很小。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文“承受、占有”没有明说宾语；按上下文，所指可能是土地或基业，不一定是下一句的圣所。
    reason: alternative_reading
lexical_decisions:
- source_word: לַמִּצְעָר
  choice: 不过片刻
  rationale: מִצְעָר表示少、小或短暂；前加ל后在此作状语，最自然地表达时间短暂。“不过片刻”既符合哀歌语气，也不把具体时长说死。
- source_word: יָרְשׁוּ
  choice: 承受产业
  rationale: ירשׁ可指继承、占有或取得产业。希伯来文没有明说宾语；中文用“承受产业”自然地指向上下文中的土地或基业，同时以脚注说明原文的省略。
- source_word: עַם קָדְשֶׁךָ
  choice: 你的圣民
  rationale: 该构造短语直译为“你圣洁的百姓”或“你分别为圣的百姓”。“你的圣民”简洁、庄重，并保留其归属于上帝和分别为圣两层含义。
- source_word: צָרֵינוּ
  choice: 我们的敌人
  rationale: צַר指敌对者、仇敌。“敌人”是现代汉语中清楚自然的对应词，语义并未超出原文。
- source_word: בּוֹסְסוּ
  choice: 践踏了
  rationale: בוסס表示踩踏、蹂躏。“践踏”既保留实际破坏的动作，也传达亵渎圣地的严重意味。
- source_word: מִקְדָּשֶׁךָ
  choice: 你的圣所
  rationale: מִקְדָּשׁ指神圣之处或圣所；“圣所”保留空间称谓的广度，不武断地缩窄为某一建筑部分，尽管上下文很可能指耶路撒冷圣殿。
theological_decisions:
- issue: יָרְשׁוּ所省略的宾语
  choice: 正文译作“承受产业”，按上下文指土地或基业，并用脚注说明原文没有明说宾语。
  alternative: 译作“占有它”，或把“你的圣所”视为其宾语。
  rationale: 希伯来文确实省略宾语。上下文支持土地或基业，而下一分句另行提到“你的圣所”；因此不宜断定圣所就是前一动词的宾语。“产业”使中文完整，却仍借脚注保留原文的含混。
- issue: לַמִּצְעָר的语义
  choice: 按时间义译为“不过片刻”。
  alternative: 译为“少许”“在很小的程度上”，保留数量或程度义。
  rationale: 该词本可表示小量或短暂；本节哀叹圣民享有基业时间短促，随后圣所便遭敌人践踏，时间义最切合语境，但脚注保留程度义的可能。
translation_notes:
  register: 采用现代、庄重而易懂的经文语体。“圣民”“圣所”保留宗教文本所需的凝练感；“不过片刻”自然表达哀叹。分号对应原文两个紧密相连、彼此映照的分句。
