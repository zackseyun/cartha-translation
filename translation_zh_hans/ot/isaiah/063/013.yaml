    rationale: “带领他们穿过深渊；他们如同马行在旷野”以分号分开后，比较语看似独立补述。改为以“像马在旷野行走一样”连接至“不失足”，更清楚地表达诗歌比喻，同时不添加目的或结果连词。
  - severity: low
