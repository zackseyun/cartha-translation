  text: leading them through the depths like a horse in the wilderness[a]; they did not stumble.
translation:
  language: zh_hans
  text: 带领他们穿过深处[a]；他们像马在旷野行走一样，并不失足。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“深水。”希伯来文为“深处”（复数），常含深水的意象；这里呼应出埃及过海。
    reason: 说明“深水”为可选译法，并保留原文“深处”的较宽泛表达及上下文的出埃及呼应。
lexical_decisions:
- source_word: מוֹלִיכָם
  choice: 带领他们
  rationale: 这是הלך的使役主动分词，带第三人称阳性复数宾语后缀；译为“带领他们”既保留持续描写的分词意味，也自然承接上文。
- source_word: בַּתְּהֹמוֹת
  choice: 穿过深渊
  rationale: תְּהֹמוֹת是“深处、深渊”的复数形式，常指水的深处；介词ב在移动语境中可表达“在……中穿行”。“穿过深渊”保留原文较宽泛而富有诗意的意象，并由上下文唤起出埃及过海的背景。
- source_word: כַּסּוּס
  choice: 如同马
  rationale: 比较介词כ加单数名词סוּס，直译为“像马”；现代汉语用“如同马”自然地保留单数比喻。
- source_word: בַּמִּדְבָּר
  choice: 行在旷野
  rationale: מִדְבָּר通常指旷野或荒野；“旷野”符合圣经语境，又不把地貌过度限定为沙漠。结合比喻补出“行”字，使中文顺畅。
- source_word: לֹא יִכָּשֵׁלוּ
  choice: 并不绊跌
  rationale: כשל的未完成式表示绊跌、踉跄或失足；“并不绊跌”直接保留否定陈述，没有加入原文未明说的目的或结果连接词。
theological_decisions:
- issue: 出埃及过海意象的明确程度
  choice: 正文译作“穿过深渊”，不直接增添“海”字
  alternative: 穿过海；穿过深水
  rationale: 上下文显然呼应出埃及过海，但תְּהֹמוֹת本身比“海”含义更宽。正文保留“深渊”的诗歌意象，让上下文提供历史指向；脚注说明水域含义及其呼应。
- issue: 末句与前文的逻辑关系
  choice: 用分号并列为“并不绊跌”
  alternative: 使他们不致绊跌；所以他们没有绊跌
  rationale: 希伯来文没有明确的目的或结果连词。保持直接陈述，可避免替原文判定逻辑关系。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“如同马行在旷野”保留诗歌比喻；用分号呈现原文两个紧密相连但没有明示逻辑连词的分句。
