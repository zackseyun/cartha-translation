base_translation:
  language: en
  yaml_path: translation/ot/isaiah/063/005.yaml
  text: I looked[a], but there was no one to help; I was appalled, but there was no one to support. So my own arm brought me salvation[b], and my wrath—it upheld me.
translation:
  language: zh_hans
  text: 我察看，却没有人帮助；我惊愕[a]，却没有人扶持。于是，我的膀臂为我施行拯救[b]；我的烈怒支撑了我。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我惊异。”这个希伯来语动词可表示震惊、骇异，也可带有面对荒凉景象而愕然的意味。
    reason: lexical_alternative
  - marker: b
    text: 或译：“为我赢得了胜利。”这里的希伯来语动词词根常译为“拯救”或“解救”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַבִּיט
  choice: 我观看
  rationale: נבט的使役词干表示定意观看、察看；“我观看”简洁庄重，也符合上下文中寻找帮助者的情境。
- source_word: עֹזֵר
  choice: 无人帮助
  rationale: עזר的分词指帮助者；译成“无人帮助”符合现代汉语表达，并保留“没有帮助者”的意义。
- source_word: וְאֶשְׁתּוֹמֵם
  choice: 我惊愕
  rationale: שמם在此词形可表达震惊、骇异，也可能带有因荒凉或可怕景象而愕然的意味；“惊愕”保留其强烈感受，又不把含义过度限定为恐惧或憎恶。
- source_word: סוֹמֵךְ
  choice: 无人扶持
  rationale: סמך表示扶持、支撑；此处用“扶持”与前句“帮助”形成自然平行，同时与末句同一词根的“支撑”保持可辨认的联系。
- source_word: וַתּוֹשַׁע לִי זְרֹעִי
  choice: 我自己的膀臂为我施行了拯救
  rationale: ישע表示拯救、解救，也可依语境指取得胜利；לִי保留为“为我”。加“自己的”显明上下文中没有他人相助、唯有说话者自身能力行动的强调。
- source_word: חֲמָתִי
  choice: 我的烈怒
  rationale: חֵמָה表示炽烈的怒气；“烈怒”符合先知审判语境的力度，不淡化原文。
- source_word: הִיא סְמָכָתְנִי
  choice: 支撑了我
  rationale: 阴性代词הִיא回指阴性名词“烈怒”；汉语无需另译代词。“支撑”直接呈现סמך所表达的支持、托住之意。
theological_decisions:
- issue: 神以自身膀臂为自己施行拯救的拟人化表达
  choice: 我自己的膀臂为我施行了拯救
  alternative: 我的膀臂为我赢得了胜利
  rationale: 原文把说话者的膀臂描写为在无人相助时施行拯救的力量。译文保留这种具有张力的拟人表达，不将“拯救”改释为某种特定教义命题。
- issue: 烈怒作为支撑说话者的力量
  choice: 我的烈怒支撑了我
  alternative: 我的愤怒扶持了我
  rationale: 原文直接把烈怒写成支撑说话者的力量；译文保留这一审判意象及其神学张力，不作弱化。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“膀臂”保留先知文学中常见的力量意象；“施行拯救”保持原文词汇的神学分量。“惊愕”处放置脚注标记，以准确对应其词汇歧义。
