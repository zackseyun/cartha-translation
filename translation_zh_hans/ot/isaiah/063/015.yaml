  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: הַבֵּ֤ט מִ/שָּׁמַ֨יִם֙ וּ/רְאֵ֔ה מִ/זְּבֻ֥ל קָדְשְׁ/ךָ֖ וְ/תִפְאַרְתֶּ֑/ךָ אַיֵּ֤ה קִנְאָֽתְ/ךָ֙ וּ/גְב֣וּרֹתֶ֔/ךָ הֲמ֥וֹן מֵעֶ֛י/ךָ וְֽ/רַחֲמֶ֖י/ךָ אֵלַ֥/י הִתְאַפָּֽקוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/063/015.yaml
  text: Look down from heaven and see[a], from your holy and glorious dwelling[c][b]. Where are your zeal and your mighty deeds? The stirring of your inward parts and your compassions are withheld from me.
translation:
  language: zh_hans
  text: 求你从天上俯视，从你圣洁、荣美的居所察看。你的热忱[a]和大能作为在哪里？你肺腑的涌动[b]和怜悯，都向我止住了[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “热忱”所译的希伯来词也可表示“忌邪的热情”或“嫉妒”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译近于“你内脏的翻腾”，是描写深切情感或怜悯的身体性说法。
    reason: cultural_note
  - marker: c
    text: “都向我止住了”也可译作“都向我抑制不发”或“不向我发出”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבֵּט מִשָּׁמַיִם וּרְאֵה
  choice: 从天上俯视……察看
  rationale: 两个祈使动词分别译出；“俯视”自然表达从天上向下看的空间视角，“察看”保留第二个动词的呼求语气。
- source_word: מִזְּבֻל קָדְשְׁךָ וְתִפְאַרְתֶּךָ
  choice: 从你圣洁、荣美的居所
  rationale: זְבֻל指高处的居所；将“你的圣洁和你的荣美”自然地转为修饰“居所”的形容表达，同时保留两项属性。
- source_word: קִנְאָתְךָ
  choice: 你的热忱
  rationale: 此处指上帝积极介入的强烈热情；“热忱”比现代汉语中的“嫉妒”更少引起卑琐情绪的误解，同时脚注保留“忌邪的热情”这一词义层面。
- source_word: גְבוּרוֹתֶיךָ
  choice: 你的大能作为
  rationale: 复数形式在此主要指力量彰显于行动，不仅是抽象能力；“大能作为”兼顾力量与事迹。
- source_word: הֲמוֹן מֵעֶיךָ
  choice: 你肺腑的涌动
  rationale: הֲמוֹן可表达喧动、翻腾，מֵעִים指内脏或肺腑；译文保留身体性的情感意象，又以现代汉语可理解的方式表达深处情感的激荡。
- source_word: רַחֲמֶיךָ
  choice: 你的怜悯
  rationale: 希伯来语为复数形态，可表示丰富、强烈或多次显出的怜悯；现代汉语用集合性单数“怜悯”更自然。
- source_word: אֵלַי הִתְאַפָּקוּ
  choice: 都向我收敛了
  rationale: התאפק的反身词形表达自我克制、忍住或不发出；“收敛”保留主动自制的色彩，也与אֵלַי“向我”自然衔接。
theological_decisions:
- issue: 以身体部位描写上帝深处的情感
  choice: 保留为“你肺腑的涌动”
  alternative: 你内心的激动；你的深情
  rationale: 原文刻意采用内脏翻腾的具身意象来表达深切情感。保留这一比喻可维持经文的情感力度，但不据此推论上帝具有物质身体。
- issue: 上帝的קִנְאָה如何表达
  choice: 正文译作“热忱”
  alternative: 忌妒；忌邪的热情
  rationale: 上下文是在呼求上帝凭强烈的盟约热情施行拯救。“热忱”在现代汉语中较准确地传达此处积极、强烈的介入之意；脚注提示该词亦含忌邪或嫉妒的语义。
- issue: 末句的克制是主动还是被动
  choice: 译作“向我收敛了”
  alternative: 不向我发出；被扣留不给我
  rationale: 反身词形较自然地指向自我抑制。译文不另行说明造成这种克制的外在原因，从而保留哀诉中上帝似乎自行按住怜悯的张力。
translation_notes:
  register: 采用现代、庄重而可朗读的普通话。“俯视……察看”保持祷告式呼求；“圣洁、荣美的居所”和“大能作为”保留诗歌的尊严感。“肺腑的涌动”有意保存原文强烈而具身的情感意象，并以脚注帮助普通读者理解。
