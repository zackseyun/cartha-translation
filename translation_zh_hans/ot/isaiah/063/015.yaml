  terminology: “热忱”适当地表达קנאה在此处的积极热心，脚注保留“忌邪的热情／嫉妒”的词义可能。“大能作为”、“圣洁、荣美的居所”均妥当。“肺腑”保留מֵעֶיךָ的身体意象，避免将其教义化或抽象化。
