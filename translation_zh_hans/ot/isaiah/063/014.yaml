source:
  edition: WLC
  text: כַּ/בְּהֵמָה֙ בַּ/בִּקְעָ֣ה תֵרֵ֔ד ר֥וּחַ יְהוָ֖ה תְּנִיחֶ֑/נּוּ כֵּ֚ן נִהַ֣גְתָּ עַמְּ/ךָ֔ לַ/עֲשׂ֥וֹת לְ/ךָ֖ שֵׁ֥ם תִּפְאָֽרֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/063/014.yaml
  text: Like livestock going down into the valley[a], the Spirit of Yahweh gave them rest; so you led your people[c][b], to make for yourself a glorious name.
translation:
  language: zh_hans
  text: 如同牲畜下到谷地，耶和华的灵[a]使他[b]安歇；你也照样引领你的百姓，为自己成就荣耀之名[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “灵”也可译作“风”或“气息”；这里的语境较支持“灵”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译为“使他安歇”。这个单数“他”很可能把以色列民视为一个整体；也可按其集合意义译作“使他们安歇”。
    reason: alternative_reading
  - marker: c
    text: 也可译作“荣耀的名声”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּבְּהֵמָה
  choice: 如同牲畜
  rationale: בְּהֵמָה在此为集合名词，指家畜；“牲畜”既自然，也不误导为野兽。
- source_word: בַּבִּקְעָה תֵרֵד
  choice: 下到谷地
  rationale: בִּקְעָה可指宽阔的谷地或谷中平原；与“下去”搭配时，“下到谷地”准确表达移动方向。
- source_word: רוּחַ יְהוָה
  choice: 耶和华的灵
  rationale: רוּחַ可指灵、风或气息；本节回顾上帝引领并赐安歇的作为，译作“灵”最符合语境，同时以脚注保留“风”的可能。
- source_word: תְּנִיחֶנּוּ
  choice: 使他安歇
  rationale: נוח的使役式表示“使……安歇”；宾语后缀为明确的第三人称阳性单数，因此正文保留“他”，理解为把以色列民视作一个整体。
- source_word: נִהַגְתָּ עַמְּךָ
  choice: 你引领你的百姓
  rationale: נהג在此表示带领、引导；“引领”符合出埃及与旷野行程的语境，又不额外带入强迫驱赶之意。
- source_word: לַעֲשׂוֹת לְךָ שֵׁם תִּפְאָרֶת
  choice: 为自己建立荣耀的名
  rationale: 不定式结构表达目的或结果；“建立……的名”保留希伯来文“造就名声”的表达，“荣耀的名”自然呈现שֵׁם תִּפְאָרֶת。
theological_decisions:
- issue: תְּנִיחֶנּוּ中单数宾语后缀的所指
  choice: 正文译作“使他安歇”，把“他”理解为作为整体的以色列民。
  alternative: 按汉语集合意义译作“使他们安歇”。
  rationale: 希伯来文后缀明确为单数，而上下文所指是上帝的百姓。保留单数可呈现原文以单数统称群体的张力，脚注则帮助普通读者理解。
- issue: רוּחַ יְהוָה的含义
  choice: 耶和华的灵
  alternative: 耶和华的风
  rationale: רוּחַ本身具有多义性，但本段叙述耶和华亲自引领百姓、使其安歇，“灵”较符合上下文；脚注保留词义上的另一可能，不将其抹去。
- issue: לַעֲשׂוֹת所表达的目的或结果
  choice: 采用“为自己建立”，自然地表达目的导向。
  alternative: 译作“结果为自己成就了”，突出结果。
  rationale: 希伯来文不定式可带目的或结果色彩；中文正文采用不排斥结果含义的简洁表达，不作过度限定。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“如同……；你也照样……”清楚呈现诗句的比喻与对应关系；保留“他”的群体单数，以脚注解释，避免在正文中消解原文形式。
