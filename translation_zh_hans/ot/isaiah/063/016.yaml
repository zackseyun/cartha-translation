source:
  edition: WLC
  text: כִּֽי אַתָּ֣ה אָבִ֔י/נוּ כִּ֤י אַבְרָהָם֙ לֹ֣א יְדָעָ֔/נוּ וְ/יִשְׂרָאֵ֖ל לֹ֣א יַכִּירָ֑/נוּ אַתָּ֤ה יְהוָה֙ אָבִ֔י/נוּ גֹּאֲלֵ֥/נוּ מֵֽ/עוֹלָ֖ם שְׁמֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/063/016.yaml
  text: For you are our Father[a], though Abraham does not know us and Israel does not acknowledge us; you, O Yahweh, are our Father[b]; our Redeemer from of old is your name.
translation:
  language: zh_hans
  text: 因为你是我们的父；亚伯拉罕虽不认识我们，以色列[b]也不认得我们，但你，雅威，是我们的父；你的名自古以来[a]就是我们的救赎主。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你的名从永远以来就是我们的救赎主。”
    reason: מֵעוֹלָם既可表示“自古以来”，也可理解为“从永远以来”。
  - marker: b
    text: 这里的“以色列”很可能指族长雅各，与前面的亚伯拉罕相对应。
    reason: 说明专名在本节平行结构中的可能所指。
lexical_decisions:
- source_word: כִּי
  choice: 因为／虽
  rationale: 第一个כִּי说明祈求的根据，译作“因为”；第二个在语境中带让步意味，结合否定分句自然译作“虽”，避免生硬重复。
- source_word: אָבִינוּ
  choice: 我们的父
  rationale: 这里是对上帝的直接称呼，表达关系与立约意涵；“父”比“祖先”更准确。
- source_word: יְדָעָנוּ
  choice: 不认识我们
  rationale: ידע的基本义是“知道、认识”；此处指亚伯拉罕并不与当代祈求者有直接的认识关系。
- source_word: יַכִּירָנוּ
  choice: 不认得我们
  rationale: נכר的使役形在此表示辨认、承认。译作“不认得”既保留与前句的平行，也略微体现两个希伯来动词的差别。
- source_word: יְהוָה
  choice: 雅威
  rationale: 采用对四字神名的现代汉语音译，以保留经文中的专名，而不以称号代替。
- source_word: גֹּאֲלֵנוּ
  choice: 我们的救赎主
  rationale: גאל指履行赎回、解救之责的人，可带亲属责任背景；正文用简明自然的“救赎主”，不把未明说的亲属含义扩写进去。
- source_word: מֵעוֹלָם
  choice: 自古以来
  rationale: עוֹלָם可指久远的过去，也可表达永恒。正文采用不强行作形而上限定的“自古以来”，并在脚注保留“从永远以来”的可能。
- source_word: שְׁמֶךָ
  choice: 你的名……就是
  rationale: 原文是无系词的名词句。汉语用“就是”自然呈现其谓语关系，并保留“名”所表达的身份与声誉。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华／主
  rationale: 原文直接使用四字神名。音译“雅威”保留其专名性质，避免以“主”这一称号取代；“耶和华”则是传统但较不贴近通行重构读音的形式。
- issue: מֵעוֹלָם的时间范围
  choice: 自古以来
  alternative: 从永远以来
  rationale: 该词既可表示遥远古时，也可能含永恒意味。正文保留较宽的历史时间感，脚注列出永恒性译法，不把原文的张力静默消解。
- issue: “以色列”的所指
  choice: 保留“以色列”，脚注说明可能指族长雅各
  alternative: 将正文直接译作“雅各”
  rationale: 原文写的是“以色列”。其与亚伯拉罕平行，极可能指族长雅各，但正文不应以解释替换原称。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“虽……但……”清楚呈现祷告中的让步转折；末句调整为汉语自然语序，同时保留“名”与“救赎主”的判断关系。引号用于标明作为名号的“我们的救赎主”。
