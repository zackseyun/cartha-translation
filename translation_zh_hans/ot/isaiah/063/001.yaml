source:
  edition: WLC
  text: מִי זֶ֣ה בָּ֣א מֵ/אֱד֗וֹם חֲמ֤וּץ בְּגָדִים֙ מִ/בָּצְרָ֔ה זֶ֚ה הָד֣וּר בִּ/לְבוּשׁ֔/וֹ צֹעֶ֖ה בְּ/רֹ֣ב כֹּח֑/וֹ אֲנִ֛י מְדַבֵּ֥ר בִּ/צְדָקָ֖ה רַ֥ב לְ/הוֹשִֽׁיעַ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/063/001.yaml
  text: Who is this coming from Edom[a], with crimson garments from Bozrah—this one splendid in his clothing, marching in the greatness of his strength? It is I, speaking in righteousness[c][b], mighty to save.
translation:
  language: zh_hans
  text: 这位从以东而来、从波斯拉而来，衣服染红的，是谁？这位衣着华美、凭着强大力量大步前行的，是谁？“是我，凭公义说话[a]，大有能力施行拯救。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “凭公义说话”也可译作“秉公正说话”。
    reason: צְדָקָה 同时具有公义、公正和正义等语义色彩。
lexical_decisions:
- source_word: מֵאֱדוֹם
  choice: 从以东而来
  rationale: 保留地名及来向；以东在本节既是实际地域，也可能带有象征意味，不在译文中加以解释。
- source_word: חֲמוּץ בְּגָדִים
  choice: 衣服染红
  rationale: חֲמוּץ 在此描述衣服呈红色或被染红。结合下一节的榨酒池意象，“染红”自然且保留成因尚未明说的张力。
- source_word: מִבָּצְרָה
  choice: 从波斯拉而来
  rationale: 按现代汉语通行形式音译以东城名，并保留第二个出发地点。
- source_word: הָדוּר בִּלְבוּשׁוֹ
  choice: 衣着华美
  rationale: 表达服饰所呈现的庄严、华美之感，避免直接加入“荣耀”等较强神学色彩。
- source_word: צֹעֶה
  choice: 昂首迈步
  rationale: 该词词义较难确定，可能指大步行进、昂然迈步，甚至俯身前行；主文采用能传达威势而又自然的“昂首迈步”。
- source_word: בְּרֹב כֹּחוֹ
  choice: 凭着强大力量
  rationale: 保留 רֹב 的丰盛、强大程度与 כֹּחַ 的力量含义，同时符合现代汉语表达。
- source_word: מְדַבֵּר בִּצְדָקָה
  choice: 凭公义说话
  rationale: 保留介词 בְּ 与 צְדָקָה 的宽广道德及司法含义；“凭公义”比单纯“说真话”更贴近原文。
- source_word: רַב לְהוֹשִׁיעַ
  choice: 大有能力施行拯救
  rationale: רַב 表示强大、充足，לְהוֹשִׁיעַ 表示拯救或解救；此译自然表达施救的充分能力。
theological_decisions:
- issue: 回答者的身份
  choice: 不在正文中指明身份，仅保留第一人称回答
  alternative: 明确译作耶和华、神圣战士或弥赛亚
  rationale: 希伯来文本以戏剧性问答呈现，却未在本节直接点明回答者；译文不应提前消除这一身份张力。
- issue: צְדָקָה 的语义
  choice: 公义
  alternative: 正义；公正
  rationale: “公义”可涵盖说话者的正直、合宜与司法层面；脚注保留“公正”这一可能语感。
- issue: הוֹשִׁיעַ 的对象与性质
  choice: 施行拯救，不补出拯救对象
  alternative: 救我方；拯救百姓；得胜
  rationale: 原文本节没有明说拯救谁，故不补入对象，也不把“拯救”缩窄为军事得胜。
translation_notes:
  register: 采用现代、庄重而可朗读的先知文学语体。以重复“是谁”再现希伯来问句的戏剧性；直接引语清楚区分提问与回答。未以专名或称号识别回答者。
