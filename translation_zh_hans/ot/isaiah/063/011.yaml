source:
  edition: WLC
  text: וַ/יִּזְכֹּ֥ר יְמֵֽי עוֹלָ֖ם מֹשֶׁ֣ה עַמּ֑/וֹ אַיֵּ֣ה הַֽ/מַּעֲלֵ֣/ם מִ/יָּ֗ם אֵ֚ת רֹעֵ֣י צֹאנ֔/וֹ אַיֵּ֛ה הַ/שָּׂ֥ם בְּ/קִרְבּ֖/וֹ אֶת ר֥וּחַ קָדְשֽׁ/וֹ־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/063/011.yaml
  text: 'Then he remembered the ancient days[b][a], Moses and his people: “Where is the one who brought them up out of the sea with the shepherds of his flock? Where is the one who put his Holy Spirit within him?”'
translation:
  language: zh_hans
  text: 于是，他想起古时的岁月，想起摩西和他自己的百姓：“那位领他们连同他羊群的众牧人[a]从海中上来的，在哪里？那位将自己的圣灵置于他里面[b]的，在哪里？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文作“他羊群的众牧人”；有些译法按单数理解为“他羊群的牧人”，可能特指摩西。
    reason: alternative_reading
  - marker: b
    text: 也可译作“在他们里面”或“在他们中间”。希伯来文后缀是单数（“在他里面”），但它具体指谁，尚有争议。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּזְכֹּר
  choice: 于是，他想起
  rationale: 该叙事形式通常承接并推进上下文；“于是”自然表达次序，“想起”准确传达זכר。希伯来文动词为阳性单数，正文保留单数主语“他”。
- source_word: יְמֵי עוֹלָם
  choice: 古时的岁月
  rationale: 此惯用语指往昔，尤其指上帝从前的拯救作为；“古时的岁月”现代、庄重，又不把עוֹלָם误解为“永恒”。
- source_word: מֹשֶׁה עַמּוֹ
  choice: 摩西和他的百姓
  rationale: 原文结构紧缩，句法存在困难；译文将摩西与百姓一并视为所追忆的出埃及世代，同时不进一步限定代词“他的”所指。
- source_word: אַיֵּה
  choice: 在哪里
  rationale: 两次保留原文的反问及重复，以现在时态的追问表现哀叹和寻求的语气。
- source_word: הַמַּעֲלֵם מִיָּם
  choice: 使他们……从海里上来
  rationale: עלה在出埃及语境中可指使人上来；复数宾语后缀译作“他们”，“从海里”保留拯救出海的图景。
- source_word: אֵת רֹעֵי צֹאנוֹ
  choice: 连同他羊群的众牧人
  rationale: 马所拉读音将“牧人”标为复数，故正文用“众牧人”；אֵת在此按伴随关系译为“连同”。上下文可能支持单数理解，另列脚注。
- source_word: הַשָּׂם
  choice: 那位……放在
  rationale: 该分词与前面的“那位使……上来”形成平行；“放在”直接传达שים的基本意义。
- source_word: בְּקִרְבּוֹ
  choice: 在他里面
  rationale: 马所拉文本的后缀为阳性单数。虽然中文略显紧缩，正文仍保留单数，以免擅自判定其指摩西、作为集合体的百姓，还是百姓中间。
- source_word: רוּחַ קָדְשׁוֹ
  choice: 自己的圣灵
  rationale: 该短语在以赛亚书63章具有明确的神圣指向；“圣灵”符合现代中文宗教语域。“自己的”使其与反问中“那位”自然关联。
theological_decisions:
- issue: “他想起”的主语所指
  choice: 正文保留阳性单数“他”，依上下文理解为上主
  alternative: 理解为“他的百姓想起”
  rationale: 希伯来文动词是阳性单数，紧邻上下文以上主为主要行动者；但原句“摩西和他的百姓”的紧缩结构使部分译法改以百姓为主语。正文不增添“上主”这一名词，以免过度消除原文衔接上的张力。
- issue: “在他里面”的所指及圣灵与群体的关系
  choice: 正文严格保留单数“在他里面”
  alternative: “在他们里面”或“在他们中间”
  rationale: 原文后缀确为单数，但可指摩西，也可能以单数集合概念指百姓或百姓中间。该差异具有神学意义，因此不在正文中武断解决，而以脚注保存其他可能。
translation_notes:
  register: 采用现代、庄重而可朗读的普通话。两个“在哪里”保留原文平行反问；“那位……的”使长定语在中文中清楚自然。正文保留“众牧人”和“在他里面”等原文形式，并用脚注交代真实的文本与指代歧义。
