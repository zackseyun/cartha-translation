id: ISA.63.10
reference: Isaiah 63:10
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/הֵ֛מָּה מָר֥וּ וְ/עִצְּב֖וּ אֶת ר֣וּחַ קָדְשׁ֑/וֹ וַ/יֵּהָפֵ֥ךְ לָ/הֶ֛ם לְ/אוֹיֵ֖ב ה֥וּא נִלְחַם בָּֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/063/010.yaml
  text: But they rebelled and grieved his Holy Spirit[a]; so he turned against them as an enemy; he himself fought against them.
translation:
  language: zh_hans
  text: 但他们悖逆，使他的圣灵忧伤[a]；因此，他转而与他们为敌，亲自与他们争战。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他圣洁的灵”；更直译为：“他圣洁之灵”。
    reason: 保留 רוּחַ קָדְשׁוֹ 的形容性及构词上更贴近原文的译法，避免正文译法消除原有表达空间。
lexical_decisions:
- source_word: וְהֵמָּה
  choice: 但他们
  rationale: 连词与独立代词在这里承接上文神的拯救作为并形成鲜明转折；“但他们”自然保留这一对比和明确主语。
- source_word: מָרוּ
  choice: 悖逆
  rationale: מרה 常指人对神的反叛与抗拒；“悖逆”准确、凝练，也符合庄重而通俗的经文语体。
- source_word: וְעִצְּבוּ
  choice: 使……忧伤
  rationale: עצב 的强化词干表示使人痛苦或忧伤；“使……忧伤”保留其使役和关系性的情感力度。
- source_word: אֶת רוּחַ קָדְשׁוֹ
  choice: 他的圣灵
  rationale: 该组合可直译为“他圣洁的灵”或“他圣洁之灵”。正文采用现代汉语中自然且具经文辨识度的“他的圣灵”，而在脚注保留较贴近构词的译法。
- source_word: וַיֵּהָפֵךְ לָהֶם לְאוֹיֵב
  choice: 因此，他转而与他们为敌
  rationale: וַיֵּהָפֵךְ 表达立场的转变，לָהֶם לְאוֹיֵב 直指“对他们成为仇敌”。“转而与他们为敌”在现代汉语中自然，并保留关系逆转的力度。
- source_word: הוּא
  choice: 亲自
  rationale: 原文显式代词带有强调作用；“亲自”简洁传达是神自己采取争战行动。
- source_word: נִלְחַם בָּם
  choice: 与他们争战
  rationale: לחם 与介词 ב 连用在此意为对抗、攻打。“与他们争战”在汉语中明确表示敌对交战，并与经文语体协调。
theological_decisions:
- issue: רוּחַ קָדְשׁוֹ 的所指与表达
  choice: 他的圣灵
  alternative: 他圣洁的灵；他圣洁之灵
  rationale: 原文的属格结构本身允许更贴近字面的表达，而“使……忧伤”的人格性语言支持正文采用“他的圣灵”。此译法保留文本的神学分量，但不在经文本身之外进一步界定其教义含义；字面备选译法列入脚注。
- issue: 神由拯救者转为仇敌的张力
  choice: 他转而与他们为敌
  alternative: 他就成了他们的仇敌
  rationale: 原文直陈神因百姓悖逆而改变对待他们的立场。正文保留这一严峻关系逆转，不以较弱措辞淡化，也不把它解释成神本质或品格发生改变。
translation_notes:
  register: 采用现代、庄重且便于普通读者理解的书面汉语。“悖逆”“忧伤”“争战”保留先知书的严肃力度；句式紧凑，并以“亲自”体现原文显式代词的强调。
