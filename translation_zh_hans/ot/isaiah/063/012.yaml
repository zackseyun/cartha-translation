reference: Isaiah 63:12
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: מוֹלִיךְ֙ לִ/ימִ֣ין מֹשֶׁ֔ה זְר֖וֹעַ תִּפְאַרְתּ֑/וֹ בּ֤וֹקֵֽעַ מַ֨יִם֙ מִ/פְּנֵי/הֶ֔ם לַ/עֲשׂ֥וֹת ל֖/וֹ שֵׁ֥ם עוֹלָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/063/012.yaml
  text: who led his glorious arm at the right hand of Moses, who split the waters before them to make for himself an everlasting name,
translation:
  language: zh_hans
  text: 他使自己荣耀的膀臂行在摩西右边，在他们面前劈开水，为自己赢得永远的名。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מוֹלִיךְ
  choice: 使……行
  rationale: 希菲勒分词表示使某者行进或引导；译作“使……行”既保留使役意味，也避免把动作主体与“荣耀的膀臂”之间的关系过度解释。
- source_word: זְרוֹעַ תִּפְאַרְתּוֹ
  choice: 自己荣耀的膀臂
  rationale: 直译该构造短语，保留“膀臂”作为能力与施行拯救之象征的诗歌意象。
- source_word: לִימִין מֹשֶׁה
  choice: 在摩西右边
  rationale: 按空间性表达直译，不擅自改成“借着摩西”或“扶持摩西”，从而保留原文意象及其可能的多重含义。
- source_word: בּוֹקֵעַ מַיִם
  choice: 劈开水
  rationale: בקע表示劈开、裂开；“劈开”自然有力，并呼应出埃及过海的叙事。
- source_word: לַעֲשׂוֹת לוֹ שֵׁם עוֹלָם
  choice: 为自己赢得永远的名
  rationale: עשה שם是“成就/建立名声”的习语；“赢得……的名”在现代汉语中自然，同时保留目的含义和永久声名的观念。
theological_decisions:
- issue: “荣耀的膀臂”与摩西的关系
  choice: 在摩西右边
  alternative: 借摩西施展他荣耀的膀臂／扶持摩西的右手
  rationale: 原文介词短语可形成空间性意象，但具体所指并未明说；正文不把它解释为摩西的手，也不将“膀臂”降格为单纯工具。
- issue: “为自己赢得永远的名”的主体
  choice: 为自己
  alternative: 为他
  rationale: 上下文所指是上帝；汉语反身代词清楚表达 לוֹ回指施行这些行动的主体，而不增添专名。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“膀臂”略带经文诗歌色彩，用来保存原文拟人化意象；句式维持两个连续行动的节奏。
