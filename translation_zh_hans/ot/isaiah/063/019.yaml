source:
  edition: WLC
  text: הָיִ֗ינוּ מֵֽ/עוֹלָם֙ לֹֽא מָשַׁ֣לְתָּ בָּ֔/ם לֹֽא נִקְרָ֥א שִׁמְ/ךָ֖ עֲלֵי/הֶ֑ם לוּא קָרַ֤עְתָּ שָׁמַ֨יִם֙ יָרַ֔דְתָּ מִ/פָּנֶ֖י/ךָ הָרִ֥ים נָזֹֽלּוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/063/019.yaml
  text: We have become like those over whom you have never ruled[a], those who were never called by your name. If only you would tear open the heavens and come down[b]; before you the mountains would quake.
translation:
  language: zh_hans
  text: 我们竟成了像那些你从未治理过、从未归在你名下的人一样。但愿你撕裂诸天，降临下来；群山都要在你面前[a]消融[b]！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在你面前”也可译作“因你的临在”；直译为“从你面前（或面容）”。
    reason: lexical_alternative
  - marker: b
    text: “消融”原文意为“流动”；也可译作“熔化”或按神显的效果译作“震动”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הָיִינוּ
  choice: 我们成了
  rationale: 该完成式可表达先前情势所造成的当前状态；“成了”自然传达哀歌中如今沦落至此的意味。
- source_word: מֵעוֹלָם לֹא מָשַׁלְתָּ בָּם
  choice: 你从未治理过的人
  rationale: 这一压缩表达句法较难；结合上下文，将时间意味与否定合译为“从未”，并以“治理”表达 משל ב 的管辖含义。
- source_word: לֹא נִקְרָא שִׁמְךָ עֲלֵיהֶם
  choice: 从未归在你名下的人
  rationale: 希伯来语被动惯用语表示归属和身份认同；此译清楚自然，同时保留圣约归属的含义。
- source_word: לוּא
  choice: 但愿
  rationale: 表达强烈而未实现的愿望，符合祈求和哀歌语气。
- source_word: קָרַעְתָּ שָׁמַיִם
  choice: 你撕裂诸天
  rationale: קרע 的基本义是撕裂；“诸天”保留诗歌的庄严气息和复数形式。
- source_word: יָרַדְתָּ
  choice: 降临下来
  rationale: 在 לוּא 引导的愿望句中，该完成式具有祈愿语气；“降临下来”自然表达神显中的下降。
- source_word: מִפָּנֶיךָ
  choice: 在你面前
  rationale: 贴近“从你面前／从你的面容（临在）”这一表达，并呈现受造界面对神显的反应。
- source_word: הָרִים נָזֹלּוּ
  choice: 群山都要消融
  rationale: נזל 的基本意象是流动；用于群山时，“消融”比“流淌”自然，也保留山岳仿佛熔化流下的神显图像。
theological_decisions:
- issue: “你的名被称在他们身上”所表达的身份
  choice: 从未归在你名下的人
  alternative: 你的名从未称在他们身上的人
  rationale: 该惯用语侧重属于神、以神的名为身份标志，而不只是口头呼求；译文传达这一归属含义，却不额外限定其教义范围。
- issue: 神临到时群山的反应
  choice: 群山都要消融
  alternative: 群山都要震动
  rationale: 原词首先带有“流动”的意象；“消融”既适合中文诗体，又保留山岳在神面前熔化流动的图景。“震动”虽能表达神显效果，却较远离原词的具体形象。
- issue: 愿望句与末句的逻辑关系
  choice: 以感叹号和独立分句并列，不补入“以致”
  alternative: 以致群山在你面前震动
  rationale: 原文没有明确的目的或结果连词；并列处理保留“群山消融”究竟是愿望内容、预期结果还是神显描写之间的张力。
translation_notes:
  register: 采用现代、庄重而易懂的祈祷诗体。“但愿……！”保留强烈愿望；两个“成了”强化哀歌的平行结构。末句不加入原文没有的因果连接词，以保存其诗意和句法张力。
