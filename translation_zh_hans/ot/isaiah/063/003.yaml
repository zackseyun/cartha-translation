base_translation:
  language: en
  yaml_path: translation/ot/isaiah/063/003.yaml
  text: I have trodden the winepress alone[a], and from the peoples no man was with me; I trod them in my anger and trampled them in my wrath; their lifeblood spattered on my garments[b], and I stained all my clothing.
translation:
  language: zh_hans
  text: “我独自踹酒榨[a]；万民中没有一人和我同在。我在怒气中踹他们，在烈怒中践踏他们；他们的血[b]溅在我的衣服上，我染污了自己所有的衣裳。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “酒榨”是用脚踩压葡萄、榨出汁液之处；本节以踹酒榨的画面比喻审判万民。
    reason: cultural_context
  - marker: b
    text: 或可译“他们的汁液”。原文用词在酒榨画面中可指流出的汁液，也可在审判语境中指受审判者的血。
    reason: lexical_alternative
lexical_decisions:
- source_word: פּוּרָה
  choice: 酒榨
  rationale: 指供人踩踏葡萄、榨取汁液的设施；“酒榨”在现代汉语中简明地保留了全节的葡萄榨意象。
- source_word: דָּרַכְתִּי
  choice: 踹了
  rationale: 此动词在酒榨语境中指用脚踩压；“踹”比泛泛的“践踏”更能呈现踩榨葡萄的具体动作。
- source_word: לְבַדִּי
  choice: 独自
  rationale: 自然而准确地突出说话者无人协助、单独施行行动。
- source_word: וּמֵעַמִּים
  choice: 万民中
  rationale: מִן在此与否定存在句连用，可自然理解为“在……之中”；“万民”保留复数群体和国际性的范围，不必机械译作“从众民中”。
- source_word: אֵין אִישׁ אִתִּי
  choice: 没有一人和我在一起
  rationale: אִישׁ在否定句中可表达“没有任何人”；此译法符合现代汉语，同时没有把性别含义不必要地强化为“男人”。
- source_word: וְאֶדְרְכֵם
  choice: 踹踏他们
  rationale: 保留与前句דָּרַךְ相同的踩榨动作，使“踹酒榨”与“踹踏万民”的隐喻对应清楚。
- source_word: בְּאַפִּי
  choice: 在怒气中
  rationale: אַף在这里是“愤怒”的惯用义；“怒气”自然清楚，并与后面的“烈怒”构成层递。
- source_word: וְאֶרְמְסֵם
  choice: 践踏他们
  rationale: רמס表示踩踏、蹂躏；“践踏”既与前一动词有区别，也保留平行句的加强效果。
- source_word: בַּחֲמָתִי
  choice: 在烈怒中
  rationale: חֵמָה带有炽烈愤怒之意；“烈怒”体现其强度，并区别于אַף的“怒气”。
- source_word: וְיֵז
  choice: 溅
  rationale: 描述液体飞溅到衣物上；“溅”在现代汉语中简洁有力，符合酒汁与血双重意象。
- source_word: נִצְחָם
  choice: 他们的血
  rationale: 该罕见词在酒榨意象中可令人联想到流出的葡萄汁，但本节所踩踏的对象是万民，语境指向他们流出的血；脚注保留其意象上的词义张力。
- source_word: בְּגָדַי / מַלְבּוּשַׁי
  choice: 我的衣服 / 自己所有的衣裳
  rationale: 用两个近义词反映原文词汇变化；“衣服”“衣裳”自然庄重，也避免误加“袍服”等原文未明说的细节。
- source_word: אֶגְאָלְתִּי
  choice: 我染污了
  rationale: גאל在此形态和语境中意为使衣物被液体沾染、玷污，并非“救赎”；“染污”准确传达结果。
theological_decisions:
- issue: 神圣战士施行审判的暴烈意象
  choice: 保留第一人称发言、怒气以及踩踏万民的酒榨隐喻
  alternative: 将其弱化为抽象的胜利或非人格化的司法行动
  rationale: 希伯来文本以强烈而具体的画面表现说话者独自施行审判。译文不淡化神的烈怒与流血意象，也不额外加入基督论或宗派性解释。
- issue: אִישׁ在否定存在句中的表达
  choice: 译为“没有一人”
  alternative: 译为“没有一个男人”
  rationale: אִישׁ虽为阳性单数名词，但在אֵין אִישׁ结构中惯常表示“无人”。现代汉语的“一人”忠实保留单数形式和全然孤独之意，又不制造原文语境未着重强调的生理性别对比。
- issue: נִצְחָם的血与葡萄汁意象
  choice: 正文译“他们的血”，脚注说明酒榨画面中的汁液联想
  alternative: 正文译“他们的生命之血”或“他们的汁液”
  rationale: 受审判者是万民，故所流的是血；但该词与酒榨隐喻形成有意重叠，不应完全消除，因此以脚注保留词义和诗歌意象的张力。
translation_notes:
  register: 采用现代、庄重而可朗读的诗体汉语。通过“踹了酒榨—踹踏他们—践踏他们”保留原文动词的呼应和递进；两个“在……中”维持平行结构。标点按中文直接引语处理，未添加经文编号。
