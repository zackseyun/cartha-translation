base_translation:
  language: en
  yaml_path: translation/ot/isaiah/063/006.yaml
  text: I trampled peoples in my anger[a]; I made them drunk in my wrath[b], and I brought their lifeblood down to the earth.
translation:
  language: zh_hans
  text: 我在怒气中践踏万民[a]，在烈怒中使他们喝醉，又使他们的生命之血[b]流到地上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“列国”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文此词含义不确定；也可能指被践踏后流出的“汁液”或“血”，另有人理解为“力量”或“荣华”。这里的译法保留榨酒与流血相互交叠的意象。
    reason: lexical_alternative
lexical_decisions:
- source_word: אָבוּס
  choice: 践踏
  rationale: בוס 表示踩踏、践踏；此译保留榨酒池意象及审判的强烈画面。
- source_word: עַמִּים
  choice: 万民
  rationale: עַם 的复数可指多个民族或列国；“万民”自然庄重，也避免让人只联想到现代民族国家。
- source_word: בְּאַפִּי
  choice: 在怒气中
  rationale: אַף 字面与鼻孔有关，在此是表示发怒的惯用语，应按其语义译出。
- source_word: וַאֲשַׁכְּרֵם
  choice: 使他们喝醉
  rationale: שׁכר 的使役强化形式意为使人醉；直译可保留本节醉酒与榨酒意象之间的联系。
- source_word: בַּחֲמָתִי
  choice: 在烈怒中
  rationale: חֵמָה 表示烈怒、震怒；以“烈怒”与前面的“怒气”略作区分，并保留庄严强烈的语气。
- source_word: וְאוֹרִיד
  choice: 又使……流到
  rationale: ירד 的使役形式本义是“使……下去”；因宾语在语境中被理解为血液，“使……流到”在中文中自然，同时保留向地面降下的方向。
- source_word: לָאָרֶץ
  choice: 到地上
  rationale: 介词 ל 表示趋向，אָרֶץ 在此可指地面；“到地上”贴近原文的方向性。
- source_word: נִצְחָם
  choice: 他们的生命之血
  rationale: 此词含义困难，在榨酒与杀戮交叠的语境中可指从被践踏者流出的液体或血。“生命之血”传达血流尽而丧命的审判画面，但以脚注保留其他可能。
theological_decisions:
- issue: 如何呈现神施行审判的暴烈榨酒意象
  choice: 保留“践踏”“使他们喝醉”和血流到地上的连贯画面
  alternative: 把醉酒明确译为“使他们因我的烈怒而踉跄”，或把末句译作“使他们的汁液落到地上”
  rationale: 原文有意将践踏、醉酒及液体流下并置。正文不淡化审判，也不把隐喻完全解释成单一的字面场景。
- issue: נִצְחָם 的含义
  choice: 生命之血
  alternative: 汁液、血、力量或荣华
  rationale: 上下文中的榨酒池与流血意象支持“生命之血”，但原词罕见且意义有争议，因此不把此理解表述为毫无歧义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“怒气／烈怒”对应两个不同的希伯来词；短句并列保留原文强劲的审判语势。脚注标记紧随各自所说明的词语。
