  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ אַךְ עַמִּ֣/י הֵ֔מָּה בָּנִ֖ים לֹ֣א יְשַׁקֵּ֑רוּ וַ/יְהִ֥י לָ/הֶ֖ם לְ/מוֹשִֽׁיעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/063/008.yaml
  text: For he said[a], “Surely they are my people, children who will not deal falsely”; so he became their Savior.
translation:
  language: zh_hans
  text: 他说：“他们确实是我的子民，是不行诡诈的儿女。”于是，他作了他们的拯救者。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 他说
  rationale: 承接前文叙述并引出直接引语；希伯来语连接词在此无需机械译出，现代汉语用“他说”自然推进语意。
- source_word: אַךְ
  choice: 确实
  rationale: 此处表达强烈肯定，而非限制；“确实”庄重自然，也保留说话者确信的语气。
- source_word: עַמִּי הֵמָּה
  choice: 他们确实是我的子民
  rationale: “我的子民”保留群体及圣约关系含义；明译独立代词所带的强调。
- source_word: בָּנִים
  choice: 儿女
  rationale: 此处指整个子民与上帝之间的亲子关系，并非只指男性后代；“儿女”在现代汉语中准确而自然。
- source_word: לֹא יְשַׁקֵּרוּ
  choice: 不会行虚假
  rationale: שׁקר 的加强词干可指说谎、欺骗或行为不忠；“行虚假”保留其宽泛的伦理与关系含义，不局限于言语。
- source_word: וַיְהִי לָהֶם
  choice: 于是，他成了他们的
  rationale: 表达前述认定所引出的叙事结果；“于是”比机械的“并且”更符合现代汉语。
- source_word: לְמוֹשִׁיעַ
  choice: 拯救者
  rationale: 该词指施行拯救、解救的一位；“拯救者”忠实保留行动者和神学分量，同时避免加入本节未明说的后期教义。
theological_decisions:
- issue: לְמוֹשִׁיעַ 对上帝的称谓
  choice: 拯救者
  alternative: 救主；解救者
  rationale: 经文强调上帝成为其子民施行拯救的一位。“拯救者”既保留称谓性质，也紧扣希伯来词根的行动意义。
- issue: בָּנִים 的性别与关系含义
  choice: 儿女
  alternative: 儿子；孩子
  rationale: 阳性复数在此代表整个子民。“儿女”明确表达全体与上帝的亲子关系，避免不必要地限定为男性。
- issue: לֹא יְשַׁקֵּרוּ 的含义范围
  choice: 不会行虚假
  alternative: 不会说谎；不会背信
  rationale: 原文可涵盖言语上的谎言、行为上的虚假，或在关系中证明自己不忠。正文保留较宽含义，不把张力单一化。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“子民”“儿女”“拯救者”保留经文的关系性与神学分量；正文不刻意仿古，也不把原文中“虚假／背信”的语义张力静默消解。
