source:
  edition: WLC
  text: בְּֽ/כָל צָרָתָ֣/ם לא צָ֗ר וּ/מַלְאַ֤ךְ פָּנָי/ו֙ הֽוֹשִׁיעָ֔/ם בְּ/אַהֲבָת֥/וֹ וּ/בְ/חֶמְלָת֖/וֹ ה֣וּא גְאָלָ֑/ם וַֽ/יְנַטְּלֵ֥/ם וַֽ/יְנַשְּׂאֵ֖/ם כָּל יְמֵ֥י עוֹלָֽם־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/063/009.yaml
  text: In all their distress[a], he was distressed, and the angel of his presence saved them; in his love and in his compassion he redeemed them, and he lifted them up and carried them all the days of old.
translation:
  language: zh_hans
  text: 他们在一切苦难中，他并不受困[a]；他临在的使者拯救了他们。他因自己的慈爱和怜悯救赎他们；在往昔的一切日子，他扶起他们，背负他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 古代译本所反映的另一读法作：“他们在一切苦难中，他也一同受苦。”
    reason: alternative_reading
lexical_decisions:
- source_word: בְּכָל צָרָתָם
  choice: 他们在一切苦难中
  rationale: 保留介词与“所有”的全面范围；“苦难”自然涵盖困苦、患难与压迫处境。
- source_word: לֹא צָר
  choice: 他并不受苦
  rationale: 按WLC马所拉文本的לֹא（“不”）翻译，不将其改读为לוֹ；צָר在此理解为“受苦、陷于困厄”。
- source_word: וּמַלְאַךְ פָּנָיו
  choice: 在他面前的使者
  rationale: מַלְאָךְ可指使者或天使；פָּנָיו字面为“他的面”，在此表达侍立于他面前或来自他临在的使者。正文采用不预先限定其本体的“使者”。
- source_word: הוֹשִׁיעָם
  choice: 拯救了他们
  rationale: 准确表达ישע使役式的救助、解救含义，并保留其神学分量。
- source_word: בְּאַהֲבָתוֹ וּבְחֶמְלָתוֹ
  choice: 以自己的慈爱和怜悯
  rationale: 介词ב可表示凭借、伴随或动因；“以”在中文中兼顾这些层面。慈爱与怜悯分别保留两个近义而不相同的词。
- source_word: הוּא גְאָלָם
  choice: 救赎他们
  rationale: גאל是亲属赎回及救赎语汇，“救赎”保留其核心含义与经文关联。
- source_word: וַיְנַטְּלֵם
  choice: 又扶起他们
  rationale: 该动词表达举起、承担；“扶起”自然传达将受苦者托起的图景，并与下句区分。
- source_word: וַיְנַשְּׂאֵם
  choice: 怀抱他们
  rationale: נשא表示背负、承载；结合上下文，以“怀抱”呈现温柔承载的意象，同时不与前一动词重复。
- source_word: כָּל יְמֵי עוֹלָם
  choice: 贯穿往昔的岁月
  rationale: 这里的עוֹלָם在历史回顾语境中指遥远的过去；此译保留“所有日子”的延续意味。
theological_decisions:
- issue: לֹא צָר的文本与解释
  choice: 正文按马所拉文本译为“他并不受苦”
  alternative: 按古代见证所反映的另一读法译为“他也一同受苦”
  rationale: 所给WLC正文明确为לֹא（“不”），故正文不作改读；但另一读法古老且影响重大，应以脚注保存，不静默消除经文的文本张力。
- issue: מַלְאַךְ פָּנָיו的身份与关系
  choice: 译为“在他面前的使者”
  alternative: “他临在的天使”或“他的面前使者”
  rationale: 原文可表达属于神临在的使者，也可理解为侍立在他面前的使者；不把该使者直接等同于某一特定位格，以免加入原文未明说的教义判断。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。正文紧贴WLC，保留首句的否定读法，并以脚注交代重要的古代异读。分号与短句呈现希伯来诗句的推进。
