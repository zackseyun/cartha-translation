  text: וְ/שַׂמְתִּ֤י מִשְׁפָּט֙ לְ/קָ֔ו וּ/צְדָקָ֖ה לְ/מִשְׁקָ֑לֶת וְ/יָעָ֤ה בָרָד֙ מַחְסֵ֣ה כָזָ֔ב וְ/סֵ֥תֶר מַ֖יִם יִשְׁטֹֽפוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/017.yaml
  text: And I will make justice the measuring line[a], and righteousness the plumb line; hail will sweep away the refuge of lies[c][b], and waters will flood the shelter.
translation:
  language: zh_hans
  text: 我要以公平[a]为准绳，以公义为线锤[b]；冰雹必扫去谎言的避难所，大水必冲没藏身之处[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “公平”或译“审判”。
    reason: lexical_alternative
  - marker: b
    text: “线锤”指悬挂重物、用来校正垂直的测量工具；也可译“铅锤”。
    reason: lexical_alternative
  - marker: c
    text: “藏身之处”也可译“隐蔽之所”；原词可指供人隐藏或得到保护的地方。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתִּי
  choice: 我要以……为……
  rationale: שׂוּם在此表示设立、使之成为标准；中文用“以……为……”自然呈现两个平行的建筑测量比喻。
- source_word: מִשְׁפָּט
  choice: 公平
  rationale: 此处指上帝施行公正判断与秩序的标准。“公平”在现代汉语中清楚自然，同时与“公义”保持区别。
- source_word: לְקָו
  choice: 为准绳
  rationale: קָו是建筑测量所用的线或绳。“准绳”既保留测量意象，也能表达衡量标准的引申义。
- source_word: וּצְדָקָה
  choice: 以公义
  rationale: צְדָקָה表达合乎正直、公正的品格与行为；译作“公义”可保留它与מִשְׁפָּט并列而不完全等同的含义。
- source_word: לְמִשְׁקָלֶת
  choice: 为线锤
  rationale: מִשְׁקָלֶת指建筑中凭重物校正垂直的工具；“线锤”是准确而易懂的现代名称。
- source_word: וְיָעָה
  choice: 必扫去
  rationale: יעה含扫除、清除之意；以冰雹为主语时，“扫去”鲜明地传达摧毁性的动作。
- source_word: בָרָד
  choice: 冰雹
  rationale: 直接对应原文天气现象，并保留审判风暴的图像。
- source_word: מַחְסֵה כָזָב
  choice: 谎言的避难所
  rationale: 保留原文构造关系，指建立在虚假之上的庇护，亦呼应本章上文所说的虚假保障。
- source_word: וְסֵתֶר
  choice: 藏身之处
  rationale: סֵתֶר可指隐蔽或受保护之处；“藏身之处”保留隐匿含义，并与“避难所”形成诗歌平行。
- source_word: מַיִם
  choice: 大水
  rationale: 原文为复数“众水”；中文“大水”自然呈现汹涌、泛滥的诗歌意象，而不把它限定为某一种洪灾。
- source_word: יִשְׁטֹפוּ
  choice: 必冲没
  rationale: שׁטף表示泛滥、冲过或淹没；“冲没”兼顾水势的冲击和彻底淹覆的结果。
theological_decisions:
- issue: מִשְׁפָּט与צְדָקָה这一伦理词组的译法
  choice: 公平／公义
  alternative: 审判／正义；公平／正义
  rationale: 原文以两个相近但不完全相同的词描述上帝衡量的标准。分别译作“公平”和“公义”，既保留公正判断与道德正直之间的张力，也避免把二者合并为同一个概念。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。前半句保留建筑测量的平行比喻，后半句以“扫去／冲没”呈现冰雹与大水的递进性毁灭图像；不把“大水”过度解释为特定历史事件。
