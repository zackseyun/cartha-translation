  text: כִּ֣י לֹ֤א בֶֽ/חָרוּץ֙ י֣וּדַשׁ קֶ֔צַח וְ/אוֹפַ֣ן עֲגָלָ֔ה עַל כַּמֹּ֖ן יוּסָּ֑ב כִּ֧י בַ/מַּטֶּ֛ה יֵחָ֥בֶט קֶ֖צַח וְ/כַמֹּ֥ן בַּ/שָּֽׁבֶט־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/027.yaml
  text: For black cumin is not threshed with a sledge[a], nor is a cart wheel rolled over cumin; rather, black cumin is beaten out with a staff[b], and cumin with a rod.
translation:
  language: zh_hans
  text: 原来，黑种草[a]不是用碾谷橇来碾，车轮也不会从孜然[b]上滚过；黑种草是用杖打出来的，孜然则用棍打。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “黑种草”所译的希伯来语是qetsaḥ，通常认为指黑种草（Nigella sativa），也有译作莳萝的。
    reason: lexical_alternative
  - marker: b
    text: “孜然”所译的希伯来语是kammon，也可能指葛缕子。
    reason: lexical_alternative
lexical_decisions:
- source_word: חָרוּץ
  choice: 碾谷橇
  rationale: 此处指带锋利齿刃的脱粒农具；“碾谷橇”既保留具体农耕形象，也比泛称“碾谷器具”更准确。
- source_word: יוּדַשׁ
  choice: 碾
  rationale: דוש的Hophal形式表示被脱粒或践踏；结合碾谷橇，用“碾”自然呈现其脱粒动作，并与后半句较轻柔的敲打形成对比。
- source_word: קֶצַח
  choice: 黑种草
  rationale: 通常鉴定为Nigella sativa；现代汉语植物名“黑种草”较准确，相关俗称及鉴定的不确定性收入脚注。
- source_word: אוֹפַן עֲגָלָה
  choice: 车轮
  rationale: 原文直译为“车的轮子”；上下文已清楚说明农耕动作，“车轮”简洁自然。
- source_word: יוּסָּב
  choice: 从……上滚过
  rationale: סבב的使役被动形式在此描写轮子被驱动着从香料作物上经过；译法保留具体动作。
- source_word: כַּמֹּן
  choice: 孜然
  rationale: 通常指孜然；也可能指葛缕子，故在脚注保留植物鉴定的另一可能。
- source_word: מַטֶּה
  choice: 杖
  rationale: 指用于击打的木杖；“杖”与下文“棍”形成可感知但不过度强化的区别。
- source_word: יֵחָבֶט
  choice: 打出来
  rationale: חבט在收获语境中指敲打使籽粒脱出；“打出来”自然表达动作及其结果。
- source_word: שֵׁבֶט
  choice: 棍
  rationale: 此处指较轻的击打器具；“棍”与“杖”构成自然平行，也避免赋予其管教或权柄等非本句重点的含义。
- source_word: כִּי ... כִּי
  choice: 原来……；……是……
  rationale: 首个כִּי承接上下文作解释，用“原来”自然引出理由；第二个כִּי带出相反的正确做法，通过分号和“是……则……”表达对照，避免机械重复连接词。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留古代农耕工具和两种香料作物之间的对比；以“碾”对“打”突出不同作物须用不同脱粒方式。所有脚注标记均置于正文相关词后。
