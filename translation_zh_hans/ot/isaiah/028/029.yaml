source:
  edition: WLC
  text: גַּם זֹ֕את מֵ/עִ֛ם יְהוָ֥ה צְבָא֖וֹת יָצָ֑אָה הִפְלִ֣יא עֵצָ֔ה הִגְדִּ֖יל תּוּשִׁיָּֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/029.yaml
  text: This also has come from Yahweh of hosts[a]; he is wonderful in counsel and great in wisdom.
translation:
  language: zh_hans
  text: 这也出于万军之耶和华；他的谋略奇妙，他的智慧高超[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “智慧”也可译作“真知灼见”或“卓越的才略”。
    reason: תּוּשִׁיָּה的含义不止抽象智慧，也可侧重健全、实用而有效的谋略或能力。
lexical_decisions:
- source_word: גַּם זֹאת
  choice: 这也
  rationale: 承接上文关于农耕方法的比喻，保留“也、同样”的递进和总结作用。
- source_word: מֵעִם יְהוָה צְבָאוֹת יָצָאָה
  choice: 出于万军之耶和华
  rationale: “出于”自然表达 יָצָאָה 与 מֵעִם 所指的来源；“万军之耶和华”保留神名及“众军”的称号意象。
- source_word: הִפְלִיא עֵצָה
  choice: 他的谋略奇妙
  rationale: 希伯来语结构简练，可指使谋略奇妙或在谋略上行奇事；此译保留对谋略非凡卓越的赞叹，同时符合汉语诗体。
- source_word: הִגְדִּיל תּוּשִׁיָּה
  choice: 他的智慧高超
  rationale: הִגְדִּיל 表达使之大、彰显其伟大；תּוּשִׁיָּה 涵盖健全智慧、实效才略或谋略。“智慧高超”自然地传达其卓越性，脚注保留较具体的词义范围。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 采用现代中文圣经读者最熟悉且庄重的专名“耶和华”，不以“主”替代原文神名；“雅威”是较贴近学术重构发音的另一译法。
- issue: הִפְלִיא 与 הִגְדִּיל 的使役形态
  choice: 译为性质陈述“谋略奇妙、智慧高超”
  alternative: 译为行动陈述“使谋略奇妙、使智慧大显”
  rationale: 原文两句高度凝练，使役动词可表达施行非凡之事或彰显卓越；性质陈述在中文中更自然，并与上下文对上帝教导农夫的智慧之总结相合，但不将其限定为某一具体教义命题。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语，保留经文的诗性平行结构。主句简洁承接上文，两个分句以“谋略奇妙／智慧高超”形成自然对仗。
source_grounding:
  english_pob_role: consult_only
