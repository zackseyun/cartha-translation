  yaml_path: translation/ot/isaiah/028/023.yaml
  text: Give ear and hear my voice[a]; pay attention and hear my word.
translation:
  language: zh_hans
  text: 你们要侧耳，听我的声音；要留心，听我的话语。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作：“你们要倾听我的声音；要专心听我的言语。”
    reason: 原文两组命令都可在汉语中合并成较流畅的表达；正文则较明确地保留了两个“听”字及其平行结构。
lexical_decisions:
- source_word: הַאֲזִינוּ
  choice: 要侧耳
  rationale: 这是 אזן 的使役式复数命令，表达专心倾听的召唤。“侧耳”既保留原文形象和庄重语气，也符合现代汉语表达。
- source_word: וְשִׁמְעוּ
  choice: 听
  rationale: שמע 的复数命令式在两处重复出现。两处都译为“听”，以保留原文刻意的重复和诗歌平行结构。
- source_word: קוֹלִי
  choice: 我的声音
  rationale: קול 在直接讲话的语境中通常指“声音”；这一译法简明自然，并与后半句的“我的话语”形成对应。
- source_word: הַקְשִׁיבוּ
  choice: 要留心
  rationale: קשב 的使役式复数命令强调集中注意。“留心”清楚传达其力度，同时与前面的“侧耳”有所区别。
- source_word: אִמְרָתִי
  choice: 我的话语
  rationale: אמרה 可指话、言语或发言。“话语”保留单数整体概念，并以庄重而自然的方式与“声音”构成平行。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的劝告语体。“侧耳……留心……”保留希伯来诗句的递进和平行；逗号使两组命令中的动作关系清晰，又不把它们合并为单一动词。
