  text: וְ/גַם אֵ֨לֶּה֙ בַּ/יַּ֣יִן שָׁג֔וּ וּ/בַ/שֵּׁכָ֖ר תָּע֑וּ כֹּהֵ֣ן וְ/נָבִיא֩ שָׁג֨וּ בַ/שֵּׁכָ֜ר נִבְלְע֣וּ מִן הַ/יַּ֗יִן תָּעוּ֙ מִן הַ/שֵּׁכָ֔ר שָׁגוּ֙ בָּֽ/רֹאֶ֔ה פָּק֖וּ פְּלִילִיָּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/007.yaml
  text: 'And even these reel with wine and stagger from strong drink: priest and prophet reel with strong drink[a], they are swallowed up by wine, they stagger from strong drink; they reel in vision[b], they totter in judgment.'
translation:
  language: zh_hans
  text: 连这些人也因酒踉跄，因浓酒摇晃；祭司和先知因浓酒踉跄，被酒吞没，因浓酒摇晃；他们在异象中失误[a]，在裁决时失足[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在异象中失误”也可译作“看见时踉跄”或“在异象中踉跄”；希伯来语既可指一般的看见，也可能特指先知所见的异象。
    reason: lexical_alternative
  - marker: b
    text: “在裁决时失足”也可译作“作判断时绊跌”或“在司法裁决上出错”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם אֵלֶּה
  choice: 连这些人也
  rationale: 保留 וְגַם 的递进和强调作用，并以“这些人”自然指向上下文中如今也受到谴责的群体。
- source_word: בַּיַּיִן
  choice: 因酒
  rationale: 此处介词 ב 表示导致醉态的原因；“因酒”在中文中简洁自然。
- source_word: שָׁגוּ
  choice: 踉跄／迷失
  rationale: 该动词既可指身体摇晃，也可指偏离、犯错。前半节在醉酒语境中译作“踉跄”，末句涉及异象时译作“迷失”，借此保留由身体失稳转向职分失误的语义张力。
- source_word: שֵׁכָר
  choice: 浓酒
  rationale: 指葡萄酒以外能使人醉的饮料；“浓酒”范围较宽，也避免把古代饮品过度具体化为现代蒸馏烈酒。
- source_word: תָּעוּ
  choice: 摇晃
  rationale: 该词可指游荡、迷失；醉酒语境突出步态不稳。“摇晃”与“踉跄”形成平行而不完全重复。
- source_word: כֹּהֵן וְנָבִיא
  choice: 祭司和先知
  rationale: 两个单数名词在此具有集合意义，泛指这两类宗教领袖。
- source_word: נִבְלְעוּ מִן הַיַּיִן
  choice: 被酒吞没
  rationale: 保留 נִבְלְעוּ“被吞下、被吞没”的强烈隐喻，表达他们完全受酒控制。
- source_word: בָּרֹאֶה
  choice: 在异象中
  rationale: רֹאֶה 可指看见，也可指先知性的异象；结合“先知”的语境，正文采用自然的“异象”，脚注保留较宽的可能性。
- source_word: פָּקוּ
  choice: 失足
  rationale: 该动词表达绊跌或站立不稳；“失足”既延续醉态意象，也可自然引申为判断上的失误。
- source_word: פְּלִילִיָּה
  choice: 判决
  rationale: 该词涉及司法判断或裁决；“判决”比宽泛的“判断”更明确地保留其司法色彩。
theological_decisions:
- issue: 末尾两句是否明确解释为先知异象与司法裁决中的失误
  choice: 译作“他们在异象中迷失，在判决上失足”
  alternative: “他们看见时踉跄，判断时摇晃”
  rationale: 经文谴责祭司和先知因醉酒而无法履行其职分。所选译文呈现异象与判决的职分语境，同时以“迷失／失足”保留希伯来文兼具身体失稳和判断错误的张力，不进一步限定具体制度或教义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“被酒吞没”有意保留原文鲜明隐喻；分号呈现希伯来诗句层层重复、加重谴责的节奏。脚注标记已在正文中对应出现。
