- from: 做饼的谷物要碾碎[a]，但人不会不停地碾打它；即使车轮和拉车的马从它上面轧过[b]，也不会把它轧成粉末。
  to: 做饼的谷物要被压碎[a]，但人不会不断地打谷；即使他的车轮和马在上面轰隆而过[b]，也不会把它压成粉末。
  rationale: 修订车轮与马经过谷物的表述，使其符合现代汉语搭配，并以“轰隆而过”对应原文在此农业画面中可表达的响动／驱行意味。删除“拉车的”这一超出原文字面的限定，恢复“他的”所有格；同时重写脚注a，避免将“饼”字面义误解为成品饼。
