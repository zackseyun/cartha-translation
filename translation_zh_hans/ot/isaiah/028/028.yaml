  text: לֶ֣חֶם יוּדָ֔ק כִּ֛י לֹ֥א לָ/נֶ֖צַח אָד֣וֹשׁ יְדוּשֶׁ֑/נּוּ וְ֠/הָמַם גִּלְגַּ֧ל עֶגְלָת֛/וֹ וּ/פָרָשָׁ֖י/ו לֹֽא יְדֻקֶּֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/028.yaml
  text: Bread grain is crushed[a], but not forever does one keep threshing it; though the wheel of his cart and his horses rumble over it[b], he does not crush it fine.
translation:
  language: zh_hans
  text: 做饼的谷物要被压碎[a]，但人不会不断地打谷；即使他的车轮和马在上面轰隆而过[b]，也不会把它压成粉末。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译可作“饼要被压碎”；这里“饼”借指用来做饼的谷物。
    reason: lexical_alternative
  - marker: b
    text: “他的马”或译“他的骑手”。原词在不同语境中可指骑手；这里译作“马”更符合打谷的图景。
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶחֶם
  choice: 做饼的谷物
  rationale: לֶחֶם通常指“饼、食物”，这里借指预备制成饼的谷物；此译法在现代汉语中自然，也保留农业语境。
- source_word: יוּדָק
  choice: 要碾碎
  rationale: דקק表示压碎、使之细碎；“碾碎”符合谷物加工的图景，并与句末同根动词形成呼应。
- source_word: כִּי
  choice: 但
  rationale: 这里承接前句并形成限制性转折：谷物固然要碾碎，却不会无休止地碾打。
- source_word: לֹא לָנֶצַח
  choice: 不会不停地
  rationale: 字面义为“不至永远”；在此具体表示打谷不会持续不止，译文采用自然的现代汉语表达。
- source_word: אָדוֹשׁ יְדוּשֶׁנּוּ
  choice: 人不会不停地碾打它
  rationale: 同根不定式绝对形与未完成式连用，加强动作或表示持续；“不停地碾打”传达这种语势，主语用泛指的“人”。
- source_word: וְהָמַם
  choice: 即使……从它上面轧过
  rationale: המם可表示发出轰响、使骚动；在车轮碾谷的图景中，译出带声响的碾轧动作更自然。“即使”体现此分句与末句之间的让步关系。
- source_word: גִּלְגַּל עֶגְלָתוֹ
  choice: 车轮
  rationale: 原文直译为“他的车的轮子”；中文正文简化为“车轮”，避免生硬而不损失农业器具的图景。
- source_word: וּפָרָשָׁיו
  choice: 拉车的马
  rationale: פָרָשׁ可指马或骑手；与车轮和打谷场景相配时，“马”更合适。“拉车的”是由语境补出的最小限度说明。
- source_word: לֹא יְדֻקֶּנּוּ
  choice: 不会把它轧成粉末
  rationale: 重复דקק，指出碾打虽会使谷物脱壳、破碎，却不会把它彻底粉碎；“轧成粉末”清楚表达动作的限度。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“碾打”保留打谷动作，“轧成粉末”明确说明并非将谷物彻底压碎。正文中的[a]、[b]均与脚注对应。
