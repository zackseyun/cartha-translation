  text: וְ/הָיָ֨ה לָ/הֶ֜ם דְּבַר יְהוָ֗ה צַ֣ו לָ/צָ֞ו צַ֤ו לָ/צָו֙ קַ֤ו לָ/קָו֙ קַ֣ו לָ/קָ֔ו זְעֵ֥יר שָׁ֖ם זְעֵ֣יר שָׁ֑ם לְמַ֨עַן יֵלְכ֜וּ וְ/כָשְׁל֤וּ אָחוֹר֙ וְ/נִשְׁבָּ֔רוּ וְ/נוֹקְשׁ֖וּ וְ/נִלְכָּֽדוּ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/013.yaml
  text: So the word of Yahweh will be to them[a], “Order on order, order on order, line on line, line on line, a little here, a little there,” so that they may go, and stumble backward, and be broken, and snared, and captured.
translation:
  language: zh_hans
  text: 因此，耶和华的话对他们将是：“命令加命令，命令加命令；准绳加准绳，准绳加准绳；这里一点，那里一点。”[a]以致他们去而向后绊跌，破碎，陷入网罗，被捉住。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “命令加命令”也可译作“训令加训令”；传统常译作“训诲上加训诲”。这些希伯来语短句极其简短，含义和语调均有争议，可能模仿嘲弄或儿童般的重复话语。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: 所以……必是
  rationale: 结合上文，将连接词和完成式理解为所导致的情形；用“所以……必是”自然表达后果意味，同时不作过度解释。
- source_word: דְּבַר יְהוָה
  choice: 耶和华的话
  rationale: 保留先知书中“话”的惯用表达；将四字神名音译为现代汉语通行形式“耶和华”，以保留其专名性质。
- source_word: צַו לָצָו צַו לָצָו
  choice: 命令加命令，命令加命令
  rationale: 该短语含义困难，可能模拟嘲弄、幼稚或断续重复的口吻。“命令”符合其与צוה的词源关联，“加”保留层叠反复的节奏；另种理解在脚注说明。
- source_word: קַו לָקָו קַו לָקָו
  choice: 准绳加准绳，准绳加准绳
  rationale: קַו通常指测量用的绳或线；“准绳”兼顾具体意象和简短重复的声音效果。
- source_word: זְעֵיר שָׁם זְעֵיר שָׁם
  choice: 这里一点，那里一点
  rationale: זְעֵיר意为“小、少”；重复结构具有分散、零碎之意，汉语如此表达自然，并保留嘲讽式节奏。
- source_word: לְמַעַן
  choice: 好使
  rationale: 保留目的与结果之间的张力，不把司法性后果弱化为单纯描述。
- source_word: יֵלְכוּ וְכָשְׁלוּ אָחוֹר
  choice: 他们前行时向后跌倒
  rationale: 将“去、行”与“向后绊跌”的连续动作译成自然汉语；“前行时”并未改变动作，只使句法关系清晰。
- source_word: וְנִשְׁבָּרוּ
  choice: 摔碎
  rationale: נשבר是שבר的尼法勒式，表达被打破、破碎；“摔碎”承接跌倒意象，并保留受审判的强烈后果。
- source_word: וְנוֹקְשׁוּ
  choice: 被网罗缠住
  rationale: 该词表达落入圈套、被诱捕；加入“网罗”使汉语中的被动捕捉意象明确。
- source_word: וְנִלְכָּדוּ
  choice: 被捉拿
  rationale: לכד意为捕获、捉住；“被捉拿”与前面的落入网罗有所区分，并呈现后果递进。
theological_decisions:
- issue: 末句中的司法性目的或结果
  choice: 保留“好使”，使耶和华的话成为他们跌倒并被捕获的审判性媒介
  alternative: 仅把末句理解为对他们嘲弄先知话语之后果的中性描述
  rationale: לְמַעַן连同随后一连串动词显示目的和结果意味。译文不回避这种神学张力，也不额外解释神的主权、人的责任或定罪机制。
translation_notes:
  register: 采用现代、庄重而可诵读的普通话。“命令加命令……准绳加准绳”刻意保留原文生硬、断续、反复的声音效果；脚注标记[a]置于整段引语之后，涵盖这一疑难措辞。
