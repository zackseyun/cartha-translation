  rationale: 修订仅处理现代汉语的清晰度和脚注功能：“冰雹的暴风雨”及“毁灭性的暴风”更明确保留两组风暴比较；“摔到地上”表达落地的方向。未改变未具名行动者、末句隐含受事或其与主之间关系的歧义。
