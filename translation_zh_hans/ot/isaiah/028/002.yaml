source:
  edition: WLC
  text: הִנֵּ֨ה חָזָ֤ק וְ/אַמִּץ֙ לַֽ/אדֹנָ֔/י כְּ/זֶ֥רֶם בָּרָ֖ד שַׂ֣עַר קָ֑טֶב כְּ֠/זֶרֶם מַ֣יִם כַּבִּירִ֥ים שֹׁטְפִ֛ים הִנִּ֥יחַ לָ/אָ֖רֶץ בְּ/יָֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/002.yaml
  text: Behold[a], the Lord has one who is mighty and strong; like a storm of hail, a destroying tempest, like a storm of mighty, overflowing waters[b], he casts it down to the earth with his hand.
translation:
  language: zh_hans
  text: 看哪，主有一位强大有力者[a]；他如冰雹的暴风雨，如毁灭性的暴风，又如汹涌泛滥的大水；他要亲手把它摔到地上[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“看哪，有一位强大有力者为主所用。”这里的希伯来语也可理解为这位行动者属于主，或随时供主差遣。
    reason: lexical_alternative
  - marker: b
    text: “摔到地上”也可译作“按倒在地”；原词本可有较缓和的“放下”之意，但本节的风暴意象倾向于较强烈的表达。
    reason: alternative_reading
lexical_decisions:
- source_word: הִנֵּה
  choice: 看哪
  rationale: 作为先知宣告中的提示语，既保留庄重、唤起注意的语气，也符合现代汉语圣经文体。
- source_word: חָזָק וְאַמִּץ
  choice: 强而有力者
  rationale: 保留两个近义形容词叠加所产生的强调，并自然地指称一位未具名的行动者。
- source_word: לַאדֹנָי
  choice: 主有一位
  rationale: 介词短语可表达此人属于主、为主所用或已由主预备；正文以汉语所有结构自然传达这种关系，脚注保留较贴近形式的另一译法。
- source_word: כְּזֶרֶם בָּרָד
  choice: 如冰雹暴雨
  rationale: זֶרֶם 指猛烈的骤雨或暴雨；与“冰雹”结合，译作“冰雹暴雨”简洁而有冲击力。
- source_word: שַׂעַר קָטֶב
  choice: 如毁灭的狂风
  rationale: 保留风暴及毁灭性灾害的意象，不把它弱化为一般的大风。
- source_word: כְּזֶרֶם מַיִם כַּבִּירִים שֹׁטְפִים
  choice: 又如汹涌泛滥的大水
  rationale: “汹涌”表达 כַּבִּירִים 的强大声势，“泛滥”表达 שֹׁטְפִים 的冲淹动作，同时避免生硬逐词对应。
- source_word: הִנִּיחַ
  choice: 摔在
  rationale: 该使役形在审判和风暴语境中表示使之猛烈落地；“摔在地上”保留力度，同时不强行确定未明说的受事。
- source_word: בְּיָד
  choice: 亲手
  rationale: 以自然汉语保留“用手”的直接施力意象；不抽象化为“凭能力”。
theological_decisions:
- issue: “强而有力者”的身份
  choice: 保持为未具名的“一位强而有力者”
  alternative: 明确译为亚述、亚述王，或主自己
  rationale: 希伯来文本本节没有明说其身份；上下文暗示这是主施行审判的工具，但译文不替文本作进一步认定。
- issue: 末句主语的延续
  choice: 以“他”承接“一位强而有力者”
  alternative: 把末句直接处理为主亲自施行的动作
  rationale: 单数动词自然承接前述行动者，同时“主有一位”表明其行动受主支配；这样保留行动者与主之间的张力。
- issue: 末句受事未明说
  choice: 用“它”作最低限度补足
  alternative: 明确为“以法莲的冠冕”“城”或“他们”
  rationale: 汉语需要较明确的宾语，但原文没有在本节点明受事；用“它”承接上下文而不作过度解释。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“看哪”保留先知宣告的高昂语气；排比结构尽量重现原文连续风暴比喻。正文不指明审判工具的具体历史身份，也不补出末句受事的具体所指。
