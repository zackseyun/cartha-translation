  text: כִּ֚י כָּל שֻׁלְחָנ֔וֹת מָלְא֖וּ קִ֣יא צֹאָ֑ה בְּלִ֖י מָקֽוֹם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/008.yaml
  text: For all the tables are full of vomit and filth, with no place left.
translation:
  language: zh_hans
  text: 因为所有的桌子都满是呕吐物和污秽，连一点空处也没有。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שֻׁלְחָנוֹת
  choice: 桌子
  rationale: 该词通常指供饮食使用的桌子；这里用现代汉语常用词，保留宴饮场景。
- source_word: קִיא
  choice: 呕吐物
  rationale: 准确传达名词“呕吐物、吐出来的东西”，并保留原文强烈而粗粝的意象。
- source_word: צֹאָה
  choice: 污秽
  rationale: 该词可指粪污、秽物；与“呕吐物”并列时译作“污秽”，既保留令人厌恶的含义，也不把词义不必要地限定为单一物质。
- source_word: בְּלִי מָקוֹם
  choice: 无处不有
  rationale: 字面为“没有地方”；结合前句桌子已被秽物充满，表达没有一处空净之地。中文采用自然的结果性说法，同时保留其简短有力的语气。
theological_decisions:
- issue: 污秽意象的具体程度
  choice: 保留“污秽”这一较宽泛表达
  alternative: 译作“粪便”或“粪污”
  rationale: צֹאָה具有排泄物、污物的语义范围，但本节无需以更具体的译法消除词汇范围；“污秽”与上下文醉酒者呕吐的画面相合，也保持原文的厌恶感。
translation_notes:
  register: 采用现代、直白而庄重的普通话。保留原文令人不适的身体性意象，不作委婉淡化；末句处理为自然汉语“无处不有”，表达没有一处未被沾污。
