source:
  edition: WLC
  text: מִ/דֵּ֤י עָבְר/וֹ֙ יִקַּ֣ח אֶתְ/כֶ֔ם כִּֽי בַ/בֹּ֧קֶר בַּ/בֹּ֛קֶר יַעֲבֹ֖ר בַּ/יּ֣וֹם וּ/בַ/לָּ֑יְלָה וְ/הָיָ֥ה רַק זְוָעָ֖ה הָבִ֥ין שְׁמוּעָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/019.yaml
  text: As often as it passes through[a], it will seize you; for morning by morning it will pass through, by day and by night[b]; and it will be sheer terror to understand the message.
translation:
  language: zh_hans
  text: 每逢它经过[a]，它必将你们带走；因为它每天清早都要经过，昼夜不停；明白这消息，只会带来惊恐[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“每当它经过，就必将你们带走。”
    reason: 说明 מִדֵּי 所表达的反复条件关系也可自然译为“每当……就……”。
  - marker: b
    text: 本句也可译：“明白这报告，无非令人恐惧。”有人将“明白”与所听见的内容紧密相连，译作：“仅仅听见这消息，就令人惊恐。”
    reason: 原文末句句法压缩；שְׁמוּעָה可译为“消息”或“报告”，而 הָבִין 与所听内容的关系存在不同理解。
lexical_decisions:
- source_word: מִדֵּי עָבְרוֹ
  choice: 每逢它经过
  rationale: מִדֵּי与动词结构表达反复发生，译作“每逢”兼顾“每当”和“屡次”的意味；“经过”承接上文席卷而来的灾祸意象。
- source_word: יִקַּח אֶתְכֶם
  choice: 都必将你们掳去
  rationale: לקח基本义为“拿走、带走”；在审判语境中，“掳去”比单纯“带走”更能表达敌意和不可抗拒的力量，同时未具体化为某一种灾难。
- source_word: בַבֹּקֶר בַבֹּקֶר
  choice: 早晨又早晨
  rationale: 保留希伯来文的重复和分配意味，即“一个早晨接着一个早晨”，并保存原句节奏。
- source_word: בַיּוֹם וּבַלָּיְלָה
  choice: 白昼黑夜皆是如此
  rationale: 表达昼夜不断的整体范围；“皆是如此”自然承接前面的“经过”。
- source_word: רַק זְוָעָה
  choice: 只会令人惊恐
  rationale: רַק具有排他、强化作用；זְוָעָה表示惊恐、恐怖。“只会令人惊恐”在现代汉语中自然，并保留“无非是恐怖”的强烈语气。
- source_word: הָבִין שְׁמוּעָה
  choice: 明白这消息
  rationale: הָבִין直译为“明白、理解”；שְׁמוּעָה可指所听见的消息、报告。译作“这消息”清楚自然，同时保留“理解”而不改写为单纯“听见”。
theological_decisions:
- issue: 阳性单数动词的指代对象
  choice: 用“它”承接上文的灾祸，而不在本节补出名称
  alternative: 明确译作“那横扫的灾祸”或“那鞭子”
  rationale: 指代对象来自以赛亚书28:18的上下文。本节原文本身只用代词性形式，采用“它”可维持篇章衔接，又避免把上文措辞重复加入本节。
- issue: 末句“רַק זְוָעָה הָבִין שְׁמוּעָה”的压缩句法
  choice: 译作“明白这消息，只会令人惊恐”
  alternative: “仅仅听见这消息，就令人惊恐”或“这消息本身只会带来恐惧”
  rationale: 原文明确使用“明白”而非“听见”，句法则简短突兀。正文保留理解消息与惊恐之间的关系，不把它平滑改写成仅仅听闻；脚注说明另一种自然理解。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“早晨又早晨”有意保留原文反复节奏；“白昼黑夜皆是如此”避免生硬直译。“掳去”体现审判语境中的强制性，但不额外指定灾祸形式。所有脚注标记均已置于正文。
