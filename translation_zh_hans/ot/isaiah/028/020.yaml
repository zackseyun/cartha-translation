  yaml_path: translation/ot/isaiah/028/020.yaml
  text: For the bed is too short to stretch oneself out on[a], and the covering too narrow to wrap oneself in.
translation:
  language: zh_hans
  text: 因为床太短，不能舒展身体；被子[a]太窄，不能裹身。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“覆盖物”。这里的希伯来语名词按上下文指床上的覆盖物；相关词形在别处也可指铸造的偶像。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，说明前述处境的缘由；“因为”自然保留了解释或因果意味。
- source_word: קָצַר הַמַּצָּע
  choice: 床太短
  rationale: מַצָּע 指铺设供人躺卧之物；译作“床”符合现代汉语。קָצַר 在这里强调不足以供人使用，故译“太短”。
- source_word: מֵהִשְׂתָּרֵעַ
  choice: 不能让人舒展身体
  rationale: 该反身式不定词表示伸展、舒展身体；结合前面的床太短，以“不能让人……”表达因尺寸不足而无法完成这一动作。
- source_word: וְהַמַּסֵּכָה
  choice: 被子
  rationale: 上下文连续使用寝具意象，此处指用来遮盖身体的床上覆盖物；“被子”比抽象的“覆盖物”更自然，但以脚注保留该词的词义问题。
- source_word: צָרָה
  choice: 太窄
  rationale: 形容宽度不足；与上句“太短”构成平行，准确呈现寝具不合用的意象。
- source_word: כְּהִתְכַּנֵּס
  choice: 不能把人裹住
  rationale: 此处描写人把覆盖物收拢在自己身上、裹住身体；译文采用自然汉语，并保留覆盖物不足以裹身的含义。
