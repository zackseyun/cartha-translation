  text: כִּ֚י בְּ/לַעֲגֵ֣י שָׂפָ֔ה וּ/בְ/לָשׁ֖וֹן אַחֶ֑רֶת יְדַבֵּ֖ר אֶל הָ/עָ֥ם הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/011.yaml
  text: For with mocking lips and with another tongue he will speak to this people[b][a],
translation:
  language: zh_hans
  text: 因为他要用讥诮的嘴唇[a]和另一种语言[b]对这百姓说话。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“结结巴巴的嘴唇”；有些译本认为这句话着重表示难以听懂的言语，而不是讥诮的话。
    reason: lexical_alternative
  - marker: b
    text: “另一种语言”指外国语言；这句话很可能表示神借说外语的入侵者，在审判中向这百姓说话。
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 此处承接上文，引出原因或解释；“因为”自然保留经文的逻辑联系。
- source_word: בְּלַעֲגֵי שָׂפָה
  choice: 借嘲弄的嘴唇
  rationale: לַעַג主要表示嘲弄、讥诮。“嘲弄的嘴唇”保留希伯来文的身体隐喻，也不排除外国话在听者耳中像讥诮之声的语境效果。
- source_word: וּבְלָשׁוֹן אַחֶרֶת
  choice: 和别样的舌头
  rationale: לָשׁוֹן既可指舌头，也可转指语言；此译保留原文隐喻，脚注说明这里所指的是外国语言。
- source_word: יְדַבֵּר
  choice: 他要……说话
  rationale: 未完成式在此预言语境中适合表达将来的行动。希伯来文未明说主语；中文以“他”保留单数主语的含蓄性。
- source_word: אֶל הָעָם הַזֶּה
  choice: 对这百姓
  rationale: “百姓”自然对应עָם，并保留指示词“这”和先知宣告的语气。
theological_decisions:
- issue: 嘲弄之声与外国语言的关系
  choice: 正文译作“借嘲弄的嘴唇和别样的舌头”，并以脚注指出外国语言及审判语境。
  alternative: 将בְּלַעֲגֵי שָׂפָה理解为“结巴的嘴唇”，强调难以听懂的言语。
  rationale: לַעַג较直接地支持嘲弄、讥诮之义，而“别样的舌头”指向外来语言。译文不在正文中明确补入外敌，使神借外国入侵者施行审判的语境含义得到说明，却不被写成原文未明说的内容。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“借……说话”自然表达介词בְּ的工具意味；保留“嘴唇”“舌头”的希伯来文平行意象，并用脚注澄清词义与历史语境。
