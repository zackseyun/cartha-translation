  naturalness: “必被践踏在脚下”是庄重、自然的现代汉语，也准确传达原文受践踏的意象；“骄傲之冠”比“那骄傲的冠冕”更凝练清晰。
  terminology: 保留“以法莲”“醉汉”“冠”等既有圣经语汇。以“骄傲之冠”处理 עֲטֶרֶת גֵּאוּת，既不把隐喻解释成实际的政治实体，也保留原文贬抑性的“骄傲”。
