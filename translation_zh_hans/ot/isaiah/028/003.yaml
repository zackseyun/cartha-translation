base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/003.yaml
  text: The proud crown of the drunkards of Ephraim will be trampled underfoot[a].
translation:
  language: zh_hans
  text: 以法莲醉汉的骄傲之冠，必被践踏在脚下[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译：“以法莲醉汉的骄傲之冠，必被双脚践踏。”
    reason: 说明原文 בְּרַגְלַיִם（“以脚／双脚”）所保留的践踏意象。
lexical_decisions:
- source_word: בְּרַגְלַיִם
  choice: 踩在脚下
  rationale: 介词 בְּ 加双数名词“脚”在此表示践踏所用的方式，并形成“在脚下”的具体意象；“踩在脚下”符合现代汉语表达。
- source_word: תֵּרָמַסְנָה
  choice: 必被踩
  rationale: 该词是 רמס 的尼法勒未完成式，表达被动的践踏；结合“在脚下”译为“必被踩在脚下”，既自然又保留原文意象。
- source_word: עֲטֶרֶת
  choice: 冠冕
  rationale: 该名词可指冠冕、花冠或华冠；上下文以此比喻撒马利亚引以为傲的显赫地位，“冠冕”能保留这一比喻。
- source_word: גֵּאוּת
  choice: 骄傲的
  rationale: 原文是名词“骄傲、狂傲”，与“冠冕”构成属格结构；汉语用形容词“骄傲的”较自然，同时保留负面的狂傲意味。
- source_word: שִׁכּוֹרֵי
  choice: 醉汉
  rationale: 该复数形式指以醉酒为特征的人；“醉汉”简洁、直接，并保留原文的贬义。
- source_word: אֶפְרָיִם
  choice: 以法莲
  rationale: 按现代中文圣经人名惯例音译；此处虽可代表北国，原文仍直接使用“以法莲”，故不作解释性替换。
theological_decisions:
- issue: עֲטֶרֶת גֵּאוּת 的隐喻性属格
  choice: 译作“骄傲的冠冕”
  alternative: “骄傲之冠”或“以骄傲为冠冕”
  rationale: 原文可理解为“骄傲的冠冕／骄傲之冠”。采用形容词结构使现代汉语流畅，但不把隐喻扩展为“以骄傲为冠冕”，以免过度解释其语法关系。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“醉汉”保留先知话语的尖锐语气；“冠冕”维持诗歌隐喻；“必被踩在脚下”自然呈现审判和彻底羞辱的意象。
