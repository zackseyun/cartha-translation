base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/006.yaml
  text: and a spirit of justice to the one who sits in judgment[c][b][a], and strength to those who turn back the battle at the gate.
translation:
  language: zh_hans
  text: 又赐公正之灵给主持审判者[b][a]，赐力量给在城门口击退战事者[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “公正之灵”或译“审判之灵”。
    reason: lexical_alternative
  - marker: b
    text: “主持审判者”或译“坐在审判席上的人”。
    reason: lexical_alternative
  - marker: c
    text: “击退战事者”或译“抵御战事的人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְרוּחַ מִשְׁפָּט
  choice: 又使……有公正之灵
  rationale: 本句承接上一节“耶和华必成为”的句法关系；“公正”表达 מִשְׁפָּט 在此作为灵之特质的含义，“审判”则保留于脚注。
- source_word: לַיֹּשֵׁב עַל הַמִּשְׁפָּט
  choice: 使主持审判的
  rationale: 保留单数分词所指的履行司法职能者，并以现代汉语自然表达 עַל הַמִּשְׁפָּט 的司法语境；原文也可能较具体地指坐在审判席上。
- source_word: וְלִגְבוּרָה
  choice: 使……有力量
  rationale: גְּבוּרָה 可指力量、勇力或英勇；此处与“公正之灵”平行，译作“力量”简明自然，并保留军事语境。
- source_word: מְשִׁיבֵי מִלְחָמָה
  choice: 击退战事的人
  rationale: 使役意义的 מְשִׁיבֵי 表示使战斗退回、将其击退；“战事”既可指战斗，也保留 מִלְחָמָה 可指战争的宽度。
- source_word: שָׁעְרָה
  choice: 在城门口
  rationale: 带方向或处所词尾的“门”在此指战斗发生的城门区域；依上下文译作处所表达最自然。
theological_decisions:
- issue: 本节与上一节主语的关系
  choice: 以“又使……有……”承接上一节，表明这些是耶和华给予其子民的恩助。
  alternative: 可较隐含地列出“公正之灵”和“力量”，不在本节补出给予关系。
  rationale: 希伯来文本由带 לְ 的短语构成，句法依附上一节；中文需要补足关系才能通顺，但不在本节重复“耶和华”，以免过度明说。
- issue: מִשְׁפָּט 的双重出现
  choice: 前者译“公正”，后者译“审判”。
  alternative: 两处均译“审判”，形成“审判之灵……坐着审判”的重复。
  rationale: 同一词在此分别侧重司法品格与司法活动；采用不同但相连的汉语词，既自然又保留语义关联。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“城门口”呈现古代城门作为防御与交战地点的具体场景；全句以两个“使……有……”体现原文平行结构及其对上一节的依附。
