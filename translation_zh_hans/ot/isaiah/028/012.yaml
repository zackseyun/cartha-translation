  text: אֲשֶׁ֣ר אָמַ֣ר אֲלֵי/הֶ֗ם זֹ֤את הַ/מְּנוּחָה֙ הָנִ֣יחוּ לֶֽ/עָיֵ֔ף וְ/זֹ֖את הַ/מַּרְגֵּעָ֑ה וְ/לֹ֥א אָב֖וּא שְׁמֽוֹעַ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/012.yaml
  text: to whom he said, “This is rest; give rest to the weary, and this is repose,” yet they were not willing to hear.
translation:
  language: zh_hans
  text: 他曾对他们说：“这是安歇：让疲乏的人得安歇；这就是舒缓。”可是他们不肯听。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַמְּנוּחָה
  choice: 安歇
  rationale: 既可指休息的状态，也可指使人安顿、恢复的境况；“安歇”自然庄重，并保留本节反复强调的语气。
- source_word: הָנִיחוּ לֶעָיֵף
  choice: 要使疲乏的人得安歇
  rationale: הָנִיחוּ为复数祈使式，含“使……休息、让……安歇”之意；明确保留对听众的命令语气及לֶעָיֵף所指的疲乏者。
- source_word: הַמַּרְגֵּעָה
  choice: 舒缓
  rationale: 此词与安息、缓解和恢复相关；译作“舒缓”可与前面的“安歇”区分，同时避免过度限定为某种特定制度或地点。
- source_word: וְלֹא אָבוּא שְׁמוֹעַ
  choice: 可是他们不肯听
  rationale: אָבוּ表达意愿上的拒绝，不只是没有听见；“不肯听”准确体现主动抗拒。
theological_decisions:
- issue: “安歇”是现实命令还是属灵隐喻
  choice: 不在正文中限定，保留“使疲乏的人得安歇”的直接命令语义
  alternative: 解释为专指属灵救恩、安息日或政治平安
  rationale: 希伯来文本本身未在本节明确限定其神学所指；上下文的审判与安息张力应由读者从篇章中把握，不宜在翻译中预先消解。
- issue: 说话者身份
  choice: 沿用上下文，以“他”表达
  alternative: 在本节补明为“耶和华”或“先知”
  rationale: 原文为关系结构אֲשֶׁר אָמַר אֲלֵיהֶם，主语承接上下文；本节不另行明说，译文也保留这一衔接。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“这才是”体现指示语זֹאת的强调作用；分号保存两个平行分句，末句以“可是”自然呈现וְ的转折效果。
