id: ISA.28.15
reference: Isaiah 28:15
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּ֣י אֲמַרְתֶּ֗ם כָּרַ֤תְנֽוּ בְרִית֙ אֶת מָ֔וֶת וְ/עִם שְׁא֖וֹל עָשִׂ֣ינוּ חֹזֶ֑ה שיט שׁוֹטֵ֤ף כִּֽי עבר לֹ֣א יְבוֹאֵ֔/נוּ כִּ֣י שַׂ֧מְנוּ כָזָ֛ב מַחְסֵ֖/נוּ וּ/בַ/שֶּׁ֥קֶר נִסְתָּֽרְנוּ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/015.yaml
  text: Because you have said[a], “We have made a covenant with death, and with Sheol we have made an agreement. When the overwhelming scourge passes through, it will not come to us[c][b], because we have made falsehood our refuge and have hidden ourselves in deceit.”
translation:
  language: zh_hans
  text: 因为你们说：“我们已经与死亡立约，与阴间[a]订立协定[b]。横扫的灾鞭[c]经过时，必不会临到我们；因为我们以虚假为避难所，藏身于谎言之中。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文为“Sheol”，指死者所在之境；不一定等同于后世所说的地狱。
    reason: cultural_note
  - marker: b
    text: 或译“与阴间订立盟约（条约）”。此处的希伯来词较难确定；有人将它理解为“异象”，但按本句上下文，它最可能指与前面的“约”平行的一种协定。
    reason: lexical_alternative
  - marker: c
    text: 或译“漫溢的灾鞭”或“如洪水横扫的鞭子”。希伯来原文的表达较难确定，似乎把洪水席卷和鞭子击打的意象结合起来。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 在上下文中引出审判的缘由，保留因果关系。
- source_word: אֲמַרְתֶּם
  choice: 你们说
  rationale: 希伯来语完成式在此指向已经作出的宣言；现代汉语用“说”即可自然表达，后文的“已经”体现其完成意味。
- source_word: כָּרַתְנוּ בְרִית
  choice: 我们已经……立约
  rationale: 原文直译为“切约”，是订立盟约的希伯来惯用语；“立约”既自然又保留盟约意味。
- source_word: מָוֶת
  choice: 死亡
  rationale: 直接保留原文，并让“死亡”继续作为立约对象呈现拟人化修辞。
- source_word: שְׁאוֹל
  choice: 阴间
  rationale: 在现代中文圣经语境中，“阴间”可指死者所在之境；脚注进一步限定其含义，避免将其等同于后来的“地狱”观念。
- source_word: עָשִׂינוּ חֹזֶה
  choice: 订立协定
  rationale: חֹזֶה 在此含义有困难，但与前句“立约”平行，最可能指协定或盟约；“协定”保留平行关系又避免机械重复。
- source_word: שיט שׁוֹטֵף
  choice: 横扫的灾鞭
  rationale: 这个难解词组融合鞭打与洪流席卷的意象；“横扫的灾鞭”以简洁中文保留两方面的破坏力，同时用脚注说明其他可能译法。
- source_word: כִּי עבר
  choice: 经过时
  rationale: 表达这股毁灭力量穿行而过，符合上下文及现代中文表达。
- source_word: לֹא יְבוֹאֵנוּ
  choice: 必临不到我们
  rationale: “临到”适合灾祸作为主语，并保留说话者自信断言的语气。
- source_word: כָזָב
  choice: 虚假
  rationale: 保留抽象名词形式，与“避难所”构成刻意而尖锐的搭配。
- source_word: מַחְסֵנוּ
  choice: 避难所
  rationale: 准确表达庇护之处，并保留原文的安全隐喻。
- source_word: וּבַשֶּׁקֶר נִסְתָּרְנוּ
  choice: 藏身于谎言之中
  rationale: 保留动词的藏匿意味，也与前句“以虚假为避难所”形成平行；“谎言”避免中文中过度重复而不改变语义。
theological_decisions:
- issue: שְׁאוֹל 的译法
  choice: 阴间
  alternative: 示奥勒；坟墓；死者之境
  rationale: 原词指死者所在之境，并不必然等同于后世神学中的地狱。“阴间”较便于普通中文读者理解，脚注则明确其语义边界。
- issue: 死亡和阴间的拟人化
  choice: 保留为立约和订立协定的对象
  alternative: 将其解释性改写为“与死亡势力结盟”
  rationale: 原文让说话者夸称自己同死亡和阴间结盟，带有鲜明讽刺和拟人色彩；直保留这种张力，不把修辞化约为解释。
- issue: חֹזֶה 的难解含义
  choice: 按与“约”平行的“协定”理解
  alternative: 异象；盟约；条约
  rationale: 该词通常可与“异象”相关，但本句的平行结构强烈支持“协定”一类含义；脚注保留词义上的真实困难。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“立约”“阴间”“避难所”保留经文语体及核心意象；“订立协定”“临不到我们”则确保普通读者易于理解。脚注标记均紧随其所说明的词语。
