source:
  edition: WLC
  text: ה֗וֹי עֲטֶ֤רֶת גֵּאוּת֙ שִׁכֹּרֵ֣י אֶפְרַ֔יִם וְ/צִ֥יץ נֹבֵ֖ל צְבִ֣י תִפְאַרְתּ֑/וֹ אֲשֶׁ֛ר עַל רֹ֥אשׁ גֵּֽיא שְׁמָנִ֖ים הֲל֥וּמֵי יָֽיִן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/001.yaml
  text: Woe to the proud crown of the drunkards of Ephraim[a], and to the fading flower of his glorious beauty, which is on the head of the fertile valley[c][b], those overcome by wine.
translation:
  language: zh_hans
  text: 以法莲酒徒骄傲的冠冕[a]有祸了！那位于肥沃谷地[b]之巅、作为他们华美荣耀的凋残花朵也有祸了——他们是被酒击倒的人[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “冠冕”也可理解为戴在头上的花冠或花环；它与下文“花朵”的意象彼此呼应。
    reason: lexical_alternative
  - marker: b
    text: “肥沃谷地”直译为“肥美之谷”或“丰腴之谷”，指土地富饶、草木繁茂。
    reason: cultural_note
  - marker: c
    text: “被酒击倒”也可译作“被酒制服”或“被酒压倒”。原文用词形象地描写人如同被击打、打倒一样受酒支配。
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹי
  choice: 有祸了
  rationale: 该词引出哀叹与审判性的先知宣告；“有祸了”既保留警告力度，也符合现代汉语的庄重语体。
- source_word: עֲטֶרֶת גֵּאוּת
  choice: 骄傲的冠冕
  rationale: 保留“冠冕”意象，并以“骄傲的”自然表达属格结构所含的高傲意味。
- source_word: שִׁכֹּרֵי אֶפְרַיִם
  choice: 以法莲酒徒
  rationale: 表达这些醉酒者属于以法莲群体；“酒徒”简洁而明确，并保留责备语气。
- source_word: וְצִיץ נֹבֵל
  choice: 那日渐凋谢……的花朵
  rationale: צִיץ 是花朵，נֹבֵל 表示正在衰残、凋谢；“日渐凋谢”呈现其持续过程。
- source_word: צְבִי תִפְאַרְתּוֹ
  choice: 曾是它华美荣耀的
  rationale: 两个近义的华美词形成诗性叠加；“华美荣耀”保留其浓缩而隆重的表达。“曾是”在汉语中点明花朵正在失去昔日荣美，但不改变审判图景。
- source_word: אֲשֶׁר עַל רֹאשׁ גֵּיא שְׁמָנִים
  choice: 它位于肥沃谷地之巅
  rationale: רֹאשׁ 取空间义“顶端、之巅”；“肥沃”自然传达“肥美、丰腴”的土地惯用意。
- source_word: הֲלוּמֵי יָיִן
  choice: 被酒击倒了
  rationale: 保留 הלם“击打、击倒”的强烈被动意象，而不弱化成一般的“醉酒”。
theological_decisions:
- issue: 冠冕与花朵所指对象的关系
  choice: 保留两个并列而相互呼应的意象，不在正文中明确解释为撒马利亚城
  alternative: 译作“冠冕，也就是那凋谢的花朵”，或直接补明“撒马利亚”
  rationale: 本节希伯来诗歌以冠冕和花朵描绘同一受审判的荣美对象，但没有在本节直接点名撒马利亚；保留意象间的诗性张力，避免把上下文推断写进正文。
- issue: 末句“被酒击倒的人”与前文的句法关系
  choice: 以独立分句“那些人都被酒击倒了”承接“以法莲酒徒”
  alternative: 将其并入“肥沃谷地”，译作“被酒击倒之人的肥沃谷地”
  rationale: 希伯来语的修饰关系较为压缩；独立分句既保持“那些人”的回指，又避免在汉语中造成谷地本身被酒击倒的误读。
translation_notes:
  register: 采用现代、庄重而易懂的普通话，保留先知宣告的力度和希伯来诗歌的双重意象。以两个“有祸了”形成清晰的平行结构；末句稍作汉语分句处理，以保存原文生动的“击倒”比喻和句法上的开放性。
