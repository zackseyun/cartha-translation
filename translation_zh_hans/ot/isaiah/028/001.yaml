revisions:
- from: 以法莲酒徒那骄傲的冠冕[a]有祸了！那日渐凋谢、曾是它华美荣耀的花朵也有祸了！它位于肥沃谷地[b]之巅；那些人都被酒击倒了[c]。
  to: 以法莲酒徒骄傲的冠冕[a]有祸了！那位于肥沃谷地[b]之巅、作为他们华美荣耀的凋残花朵也有祸了——他们是被酒击倒的人[c]。
  rationale: 修订删除无原文根据的“曾是”和“都”，并重组后半句，使“被酒击倒的人”明确回指以法莲的酒徒，同时以破折号保留希伯来诗歌压缩而带补充说明性质的句法。冠冕与凋残花朵仍维持并列、呼应的意象，未将其直接解释为特定地点或实体。
