id: ISA.28.16
reference: Isaiah 28:16
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה הִנְ/נִ֛י יִסַּ֥ד בְּ/צִיּ֖וֹן אָ֑בֶן אֶ֣בֶן בֹּ֜חַן פִּנַּ֤ת יִקְרַת֙ מוּסָ֣ד מוּסָּ֔ד הַֽ/מַּאֲמִ֖ין לֹ֥א יָחִֽישׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/016.yaml
  text: 'Therefore thus says the Lord GOD: Behold[a], I am laying in Zion a stone, a tested stone, a precious cornerstone, a sure foundation[c][b]; the one who believes will not be in haste.'
translation:
  language: zh_hans
  text: '所以，主耶和华如此说：


    “看哪，我要在锡安安放一块石头，


    一块经过检验的石头，


    一块宝贵的房角石[a]，


    一个稳固的根基；


    信靠的人[b]必不急忙[c]。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 新约在《罗马书》9:33和《彼得前书》2:6中把这“石头”应用于基督。
    reason: cross_reference
  - marker: b
    text: 或译“相信的人”。这里的希伯来语也含有倚赖、信任的意思。
    reason: lexical_alternative
  - marker: c
    text: 或译“必不仓促”；也有人按语境理解为“必不惊慌”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: 采用现代中文圣经语体中自然且庄重的组合称谓，既保留主权称号，也保留神的专名，避免译成生硬重复的“主主”。
- source_word: הִנְנִי
  choice: 看哪，我要
  rationale: “看哪”保留先知宣告中强调、引人注意的语气；结合后面的奠基行动，以“我要”自然表达郑重而即将施行的宣告。
- source_word: יִסַּד בְּצִיּוֹן אָבֶן
  choice: 在锡安安放一块石头
  rationale: “安放”清楚表达把石头置于奠基位置的动作，同时让后续建筑意象自然展开。
- source_word: אָבֶן אֶבֶן בֹּחַן
  choice: 一块石头，一块经过检验的石头
  rationale: 保留原文“石头”的重复强调；“经过检验”传达这块石头已经受试验、证明可靠的含义。
- source_word: פִּנַּת יִקְרַת
  choice: 一块宝贵的房角石
  rationale: “房角石”保留建筑术语，“宝贵”兼顾价值重大、受尊重的语义，不把其身份解释直接写入正文。
- source_word: מוּסָד מוּסָּד
  choice: 一个稳固的根基
  rationale: 原文同根词叠用强调根基已经牢固奠定；中文用“稳固的根基”自然传达强化效果，避免生硬重复。
- source_word: הַמַּאֲמִין
  choice: 信靠的人
  rationale: 该分词表示以信赖、倚靠为特征的人；“信靠”在现代中文中兼顾相信与依赖，且不增添原文未明说的宾语。
- source_word: לֹא יָחִישׁ
  choice: 必不仓促行事
  rationale: 动词核心义为赶快、急促；“不仓促行事”在中文中语意完整，并保留因信靠而不轻率急迫的含义，不在正文中强化为“惊慌”。
theological_decisions:
- issue: 锡安之石的弥赛亚解释
  choice: 正文保留石头、房角石和根基的建筑意象，不直接注明这石头就是弥赛亚。
  alternative: 在正文中将石头明确译解为弥赛亚或基督。
  rationale: 希伯来文本本身宣告耶和华在锡安设立奠基之石；新约后来作出基督论应用，但译文不应提前消除原文意象的开放性，故以脚注提供经文互证。
- issue: הַמַּאֲמִין所表达的信心性质
  choice: 译作“信靠的人”。
  alternative: 译作“相信的人”。
  rationale: אמן在此既可指相信，也可指倚赖、信靠。正文采用能体现关系性倚靠的“信靠”，脚注保留“相信”这一可能译法，不把二者对立起来。
- issue: לֹא יָחִישׁ是否包含惊慌之意
  choice: 译作“必不仓促行事”。
  alternative: 译作“必不惊慌”或“必不急忙”。
  rationale: 原词直接表示急速、匆忙；“惊慌”可能是语境所暗示的心理状态，但并非必须写入词义，因此正文保留动作层面的表达，脚注说明其他理解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。诗行排列保留宣告的节奏和逐层同位说明；“看哪”“房角石”等词保持先知文本的庄严与建筑意象，同时避免古奥或宗派化措辞。
