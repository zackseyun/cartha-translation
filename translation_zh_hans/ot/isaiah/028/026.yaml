  text: For his God instructs him in justice[a]; he teaches him.
translation:
  language: zh_hans
  text: 因为他的上帝教导他按合宜的准则行事[a]，又指教他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为他受到合宜的教导；他的上帝指教他。”希伯来语“按合宜的准则”也可作副词理解为“合宜地”或“按正确的准则”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִסְּרוֹ
  choice: 教导他
  rationale: יסר 的 Piel 形在此农业语境中指训练、教导，而非惩戒；译为“教导他”自然且符合上下文。
- source_word: לַמִּשְׁפָּט
  choice: 按正确的方法行事
  rationale: מִשְׁפָּט 常指审判、公正或准则；在耕作智慧的语境中，更具体地指合宜的规则、方法或程序。此译法保留“按准则”的含义，并适合现代汉语。
- source_word: אֱלֹהָיו
  choice: 他的上帝
  rationale: 保留第三人称单数所属关系，明确农夫的技巧与知识来自他的上帝。
- source_word: יוֹרֶנּוּ
  choice: 指教他
  rationale: ירה 的 Hiphil 形表示教导、指示；“指教”保留教育与引导的意味，也避免与前句机械重复。
theological_decisions:
- issue: 农业智慧的来源
  choice: 本节明确把农夫掌握正确耕作方法归因于上帝的教导。
  alternative: 也可较宽泛地理解为上帝借护理引导人的实践技能。
  rationale: 原文以“他的上帝”为明确主语，并连续使用两个表示教导的动词；译文不超出这一直接陈述。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“按正确的方法行事”契合农业操作语境，同时以脚注保留 לַמִּשְׁפָּט 在句法和词义上的歧义。
