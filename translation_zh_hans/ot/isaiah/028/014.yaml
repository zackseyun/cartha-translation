  text: לָ/כֵ֛ן שִׁמְע֥וּ דְבַר יְהוָ֖ה אַנְשֵׁ֣י לָצ֑וֹן מֹֽשְׁלֵי֙ הָ/עָ֣ם הַ/זֶּ֔ה אֲשֶׁ֖ר בִּ/ירוּשָׁלִָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/014.yaml
  text: Therefore hear the word of Yahweh[a], you scoffing men, rulers of this people who are in Jerusalem.
translation:
  language: zh_hans
  text: 所以，你们这些讥诮之人，就是统治在耶路撒冷的这百姓的，要听雅威的话！
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָכֵן
  choice: 所以
  rationale: 承接上文并引出结论或回应，保留先知论述的推进关系，同时符合现代汉语表达。
- source_word: שִׁמְעוּ
  choice: 要听
  rationale: 保留复数命令式的召唤语气，也保留“听见”与“留心听从”之间的语义张力，不直接译成较强的“服从”。
- source_word: דְבַר יְהוָה
  choice: 雅威的话
  rationale: “话”对应 דְבַר，并保留先知宣告的固定表达；“雅威”按希伯来文四字神名 יְהוָה 的通常学术拟音处理，不以称号代替专名。
- source_word: אַנְשֵׁי לָצוֹן
  choice: 好讥诮的人
  rationale: 该结构直指以讥诮为特征的一群人；“好讥诮的人”既体现 אַנְשֵׁי 的人物指称和 לָצוֹן 的持续性特征，又比生硬的“讥诮之人”更符合现代汉语。
- source_word: מֹשְׁלֵי הָעָם הַזֶּה
  choice: 统治这百姓的
  rationale: מֹשְׁלֵי 是 משל“统治、掌权”的主动分词复数；译文以关系结构自然表达其为“这百姓”的统治者。
- source_word: אֲשֶׁר בִּירוּשָׁלִָם
  choice: 在耶路撒冷
  rationale: 将地点短语自然地连接到掌权者，表达这些统治者身处耶路撒冷；不额外说明其官职或政治机构。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用以色列上帝的四字神名。译作“雅威”较贴近 Yahweh 的拟音，并保留专名性质；不以“上主”这一称号替代。
- issue: אַנְשֵׁי לָצוֹן 的性别与修辞色彩
  choice: 好讥诮的人
  alternative: 讥诮者；讥诮之徒
  rationale: 上下文所指是耶路撒冷的掌权者。汉语“人”无需另加“男人”即可准确指称这群具体人物，同时保留责备性的修辞，避免加入原文没有的更强贬称。
- issue: 地点关系从属范围
  choice: 在耶路撒冷统治这百姓的
  alternative: 统治这在耶路撒冷的百姓的
  rationale: אֲשֶׁר 的语法指向存在一定表面歧义；结合语序与语境，最自然的是指在耶路撒冷的掌权者。译文采用此理解，但不扩展为更具体的政权身份。
translation_notes:
  register: 采用现代、庄重而可朗读的先知性语体。“所以”承接上文，“要听”保留命令力度；用“就是”标明“好讥诮的人”与“统治这百姓的”是同一群受话者。句末用感叹号体现直接斥责与宣告语气，但不增添原文内容。
