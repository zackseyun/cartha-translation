revisions:
- from: 所以，你们这些好讥诮的人[a]，就是在耶路撒冷统治这百姓的，要听雅威的话！
  to: 所以，你们这些讥诮之人，就是统治在耶路撒冷的这百姓的，要听雅威的话！
  rationale: 修订地点短语的句法归属，使之修饰紧邻的“这百姓”，避免把原文没有明说的地点限定加在统治者身上；同时以更凝练、庄重的“讥诮之人”替换“好讥诮的人”。其余关键术语和命令语气均予保留。
