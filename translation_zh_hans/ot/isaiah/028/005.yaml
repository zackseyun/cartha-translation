base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/005.yaml
  text: In that day Yahweh of Armies will be a crown of beauty and a diadem of splendor for the remnant of his people[a].
translation:
  language: zh_hans
  text: 到那日，万军之耶和华必作他余民的华美冠冕和荣耀华冠。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “耶和华”也常按另一种音译作“雅威”。希伯来文称号 יְהוָה צְבָאוֹת 传统上译作“万军之主”。
    reason: 说明神名的另一常见中文音译及该复合称号的传统译法，避免加入原文未明说的解释。
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: 到那日
  rationale: 这是先知书常见的时间表达；“到那日”自然、庄重，也保留了指向将来之日的先知性语气。
- source_word: יְהוָה צְבָאוֹת
  choice: 万军之耶和华
  rationale: “耶和华”在现代汉语圣经语境中是神名四字母的通行音译；“万军”准确传达 צְבָאוֹת 所指的众军或天上军旅，并保留这一复合称号的庄严感。
- source_word: יִהְיֶה
  choice: 必作
  rationale: 未完成式在此表达将来的状态；“必作”符合汉语先知性宣告的语体，也清楚表达确定的将来意义。
- source_word: לַעֲטֶרֶת צְבִי
  choice: 华美冠冕
  rationale: עֲטֶרֶת 是“冠冕”，צְבִי 在此指美丽、荣美或华美；“华美冠冕”凝练自然，并与后半句保持诗歌平行。
- source_word: וְלִצְפִירַת תִּפְאָרָה
  choice: 荣耀华冠
  rationale: צְפִירָה 在此是环形头饰、华冠；תִּפְאָרָה 表示荣耀、辉煌。“华冠”与“冠冕”略作区分，保留希伯来诗句同义而不完全重复的平行结构。
- source_word: לִשְׁאָר עַמּוֹ
  choice: 他余民的
  rationale: שְׁאָר 在以赛亚书中常指经历审判后存留的群体，译作“余民”可保留其先知书中的主题意味；关系词 לְ 在汉语中自然转化为所属兼受益关系。
theological_decisions:
- issue: 神圣称号 יְהוָה צְבָאוֹת 的译法
  choice: 万军之耶和华
  alternative: 雅威万军之神；万军之主
  rationale: 采用中文圣经传统中广为人知的“耶和华”来音译神名，并用“万军”直译 צְבָאוֹת；这既不以普通称号取代专名，也避免为音译形式作过度确定的语音重构。
- issue: שְׁאָר 的含义
  choice: 余民
  alternative: 剩下的人；剩余者
  rationale: 上下文涉及审判与存留，“余民”既表达剩余群体，也保留以赛亚书中重要而未被过度解释的神学张力。
translation_notes:
  register: 采用现代、庄重而简洁的书面普通话。句式保留希伯来诗歌中“冠冕／华冠”和“华美／荣耀”的平行，同时避免两组词完全合并。脚注标记已置于正文相关句末。
