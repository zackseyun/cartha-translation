  text: Does the plowman plow all day to sow? Does he keep opening and harrowing his ground?[a]
translation:
  language: zh_hans
  text: 耕地的人岂会整天耕地，为的是撒种吗？他岂会一直翻开、耙平自己的土地吗？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他岂会一直破土、整平自己的土壤吗？”希伯来文中的农耕动词也可作较宽泛的翻译；正文按其很可能表示的整地次序译出。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲכֹל הַיּוֹם
  choice: 岂会整天不停地
  rationale: 疑问词引出反问；“整天不停地”自然表达持续不断之意，也符合上下文所强调的农事工序并非无休止地进行。
- source_word: יַחֲרֹשׁ / הַחֹרֵשׁ
  choice: 耕地的人……耕
  rationale: 保留希伯来文动词与分词的同根呼应，同时使用现代汉语中自然易懂的表达。
- source_word: לִזְרֹעַ
  choice: 为要撒种
  rationale: 不定式表示目的；“为要撒种”明确保留耕地的目的。
- source_word: יְפַתַּח
  choice: 一直翻开
  rationale: פתח本义为“打开”；在农耕语境中指把土翻开。“翻开”既保留原词意象，又符合汉语农业表述。
- source_word: וִישַׂדֵּד
  choice: 耙平
  rationale: 此处是农业术语，可能指耙土、碎土块或平整土地；“耙平”较好呈现翻土之后的整地工序。
- source_word: אַדְמָתוֹ
  choice: 自己的土地
  rationale: 此处指供耕种的土壤或土地；“自己的土地”自然表达第三人称所有关系，并保持农业场景。
