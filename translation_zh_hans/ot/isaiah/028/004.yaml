  text: וְֽ/הָ֨יְתָ֜ה צִיצַ֤ת נֹבֵל֙ צְבִ֣י תִפְאַרְתּ֔/וֹ אֲשֶׁ֥ר עַל רֹ֖אשׁ גֵּ֣יא שְׁמָנִ֑ים כְּ/בִכּוּרָהּ֙ בְּ/טֶ֣רֶם קַ֔יִץ אֲשֶׁ֨ר יִרְאֶ֤ה הָֽ/רֹאֶה֙ אוֹתָ֔/הּ בְּ/עוֹדָ֥/הּ בְּ/כַפּ֖/וֹ יִבְלָעֶֽ/נָּה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/004.yaml
  text: 'And the fading flower of his glorious beauty[a], which is on the head of the fertile valley, will be like an early fig before summer: whoever sees it, while it is still in his palm[b], swallows it down.'
translation:
  language: zh_hans
  text: 那在肥沃山谷之巅、他荣美冠饰的凋残之花，必像夏季以前初熟的无花果[a]：人一看见它，趁它还在自己掌中，就把它吞下。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “初熟的无花果”也可译作“初熟的果子”。原文 בִּכּוּרָה 可泛指初熟之果，但这里通常理解为早熟的无花果。
    reason: lexical_alternative
lexical_decisions:
- source_word: צִיצַת נֹבֵל
  choice: 凋残之花
  rationale: 保留“花”这一意象，并以“凋残”表达分词所描写的正在衰败、枯萎状态。
- source_word: צְבִי תִפְאַרְתּוֹ
  choice: 他荣美的冠饰
  rationale: צְבִי 与 תִפְאֶרֶת 形成华美、荣耀的叠加强调；结合上文冠冕意象，译作“荣美的冠饰”，同时保留第三人称单数后缀“他”。
- source_word: גֵּיא שְׁמָנִים
  choice: 肥沃山谷
  rationale: 字面为“肥美之谷”，在此是表示土地丰饶的习语；“肥沃山谷”符合现代汉语。
- source_word: כְּבִכּוּרָהּ בְּטֶרֶם קַיִץ
  choice: 像夏季以前初熟的无花果
  rationale: בִּכּוּרָה 指初熟果实，在本处通常理解为早熟无花果；正文采用具体且合乎农业背景的意象，并以脚注保留较宽泛的词义。
- source_word: אֲשֶׁר יִרְאֶה הָרֹאֶה אוֹתָהּ
  choice: 人一看见
  rationale: 将希伯来语同根重复自然地译为汉语，突出看见后立即行动的意味。
- source_word: בְּעוֹדָהּ בְּכַפּוֹ
  choice: 还在掌中
  rationale: כַּף 具体指手掌；简洁保留果子尚在掌中便被吞食的鲜明画面。
- source_word: יִבְלָעֶנָּה
  choice: 就把它吞下
  rationale: 准确表达 בלע 的具体动作，并以“就”呈现迅速、立即吞食的语势。
- source_word: וְהָיְתָה
  choice: 必像
  rationale: 本句以将来状态引出明喻；汉语用“必像”既表达预告语气，也自然连接比喻。
theological_decisions:
- issue: “荣美”所指及其冠饰意象
  choice: 保留第三人称“他”，并译作“他荣美的冠饰”
  alternative: 省略代词，译作“荣美的花冠”
  rationale: 原文 תִפְאַרְתּוֹ 明有第三人称单数后缀，不宜在译文中消除；同时上下文的冠冕意象支持“冠饰”，但不进一步明定其神学指涉。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。语序略作调整，使“在肥沃山谷之巅”清楚修饰“凋残之花”；保留花朵、山谷、初熟果子、掌中吞食等连续意象。英文咨询层的脚注标记与内容存在错配，故按希伯来原文重新配置：果实名称的词义余地列为脚注，而“肥沃山谷”直接采用习语等值表达。
