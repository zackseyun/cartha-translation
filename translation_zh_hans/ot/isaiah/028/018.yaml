base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/018.yaml
  text: And your covenant with death will be annulled[a], and your agreement with Sheol will not stand; when the overwhelming scourge passes through[b], you will become a trampling place for it.
translation:
  language: zh_hans
  text: 你们与死亡所立的约必被废除；你们与阴间所订的协议也不能成立。当那洪水般横扫的鞭子经过时[a]，你们必成为被它践踏之地。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “洪水般横扫的鞭子”也可译作“泛滥的刑杖”。希伯来文把鞭打与洪水般横扫的力量结合在一起。
    reason: lexical_alternative
lexical_decisions:
- source_word: כֻפַּר
  choice: 必被废除
  rationale: 此处与“约”连用，语境要求表达盟约失效；译作“被废除”保留被动和法律意味，也避免引入祭祀赎罪含义。
- source_word: בְּרִיתְכֶם אֶת־מָוֶת
  choice: 你们与死亡所立的约
  rationale: “约”保留正式关系用语；“死亡”按希伯来文保留拟人化力量的修辞。
- source_word: חָזוּתְכֶם אֶת־שְׁאוֹל
  choice: 你们与阴间所订的协议
  rationale: חָזוּת 在此与“约”平行，指协议而非异象；“阴间”表达 שְׁאוֹל 所指的死人领域，不窄化为单个坟墓。
- source_word: לֹא תָקוּם
  choice: 不能成立
  rationale: 在协议语境中，קום 表示站立得住、保持效力；“不能成立”是自然的现代汉语法律性表达。
- source_word: שׁוֹט שׁוֹטֵף
  choice: 如洪水横扫的鞭子
  rationale: 兼顾 שׁוֹט 的鞭打意象与 שׁוֹטֵף 的泛滥、横扫之力，避免只译出其中一面。
- source_word: יַעֲבֹר
  choice: 经过
  rationale: 表达灾祸横穿而来，不采用可能含有“越过而饶过”意味的说法。
- source_word: לְמִרְמָס
  choice: 践踏的对象
  rationale: 自然表达成为被踩踏之物的结果，同时保留受辱和毁灭的具体意象。
theological_decisions:
- issue: 死亡和阴间的拟人化
  choice: 保留“死亡”与“阴间”作为盟约对象的拟人修辞
  alternative: 将二者弱化为一般意义的死亡与坟墓
  rationale: 希伯来文借此讽刺犹大自以为可靠的保障；保留拟人化能忠实呈现修辞张力，却不对其本体作额外教义判断。
- issue: שְׁאוֹל 的译法
  choice: 阴间
  alternative: 坟墓；音译“示奥尔”；死人之境
  rationale: “阴间”在现代中文圣经语域中可指死人所在之境，并与拟人化的“死亡”形成平行；“坟墓”范围过窄，音译则对普通读者不够直观。
- issue: כֻפַּר 是否带赎罪含义
  choice: 按盟约法律语境译为“被废除”
  alternative: 被遮盖；被洁除；被赎清
  rationale: 此处重点是虚假的盟约不再有效，而非祭祀赎罪；不把该词根在其他语境中的神学含义强加于本句。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“所立的约／所订的协议”保留平行结构；“如洪水横扫的鞭子”有意维持原文混合意象。脚注标记置于相关短语之后。
