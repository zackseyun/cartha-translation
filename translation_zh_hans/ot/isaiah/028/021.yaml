source:
  edition: WLC
  text: כִּ֤י כְ/הַר פְּרָצִים֙ יָק֣וּם יְהוָ֔ה כְּ/עֵ֖מֶק בְּ/גִבְע֣וֹן יִרְגָּ֑ז לַ/עֲשׂ֤וֹת מַעֲשֵׂ֨/הוּ֙ זָ֣ר מַעֲשֵׂ֔/הוּ וְ/לַֽ/עֲבֹד֙ עֲבֹ֣דָת֔/וֹ נָכְרִיָּ֖ה עֲבֹדָתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/021.yaml
  text: For Yahweh will rise up as at Mount Perazim[a]; he will be stirred up as in the Valley of Gibeon[c][b], to do his work—his strange work—and to perform his task—his foreign task.
translation:
  language: zh_hans
  text: 因为雅威必兴起，像在毗拉心山一样[a]；他必激动起来，像在基遍谷一样[b]，为要成就他的作为——他奇异的作为，并完成他的工作——他陌生的工作。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 毗拉心山使人想起雅威如决口般冲击大卫仇敌的事（撒母耳记下5:20；历代志上14:11）。
    reason: cross_reference
  - marker: b
    text: 基遍谷很可能使人想起雅威在基遍战役中的介入（约书亚记10:10–14）。
    reason: cross_reference
  - marker: c
    text: “奇异的作为……陌生的工作”也可译为“陌生的作为……奇异的工作”。这两个形容词彼此呼应，强调这次行动显得异乎寻常，仿佛是外来的。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，说明前述警告的缘由，保留原文的因果关系。
- source_word: כְהַר פְּרָצִים
  choice: 像在毗拉心山一样
  rationale: כְּ表示比较；此处重在唤起与该地点相关的历史事件，而非仅把雅威比作一座山。
- source_word: יָקוּם
  choice: 必兴起
  rationale: קום在此描写雅威果断介入；“兴起”简洁庄重，也保留先知话语的力度。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文直接呈现上帝的专名，而不以“主”这一称号替代。
- source_word: כְעֵמֶק בְּגִבְעוֹן
  choice: 像在基遍谷一样
  rationale: 保留地点及其历史典故；“基遍谷”在现代汉语中自然简明，并不过度限定该谷与基遍的精确地理关系。
- source_word: יִרְגָּז
  choice: 必激动起来
  rationale: רגז可表示震动、激动或被激起而行动；此译保留其语义张力，不径直增补原文没有明说的“发怒”或“震怒”。
- source_word: לַעֲשׂוֹת מַעֲשֵׂהוּ
  choice: 为要成就他的作为
  rationale: “成就”自然表达施行、做成之意；“作为”对应מַעֲשֶׂה，并适合指雅威所行的事。
- source_word: זָר
  choice: 奇异的
  rationale: 既可指陌生、外来的，也可指异乎寻常的；“奇异”保留此行动出人意外的性质而不解释其原因。
- source_word: וְלַעֲבֹד עֲבֹדָתוֹ
  choice: 并完成他的工作
  rationale: 原文使用动词与同根名词；汉语若机械复制会显得累赘，因此以“完成他的工作”自然传达执行、做成之意。
- source_word: נָכְרִיָּה
  choice: 陌生的
  rationale: 表达外来、不熟悉、异乎寻常之意，并与前句“奇异的”形成近义而不完全相同的平行。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文使用四字神名；音译为“雅威”可保留其作为专名的性质，不以称号取代。
- issue: 雅威之作为被称为“奇异／陌生”
  choice: 在正文保留“奇异的作为”和“陌生的工作”
  alternative: 释义为“不同寻常的审判”或“意外的惩罚”
  rationale: 原文刻意以זָר与נָכְרִיָּה形成平行，呈现此行动仿佛异乎寻常的神学张力；正文不把它直接解释成审判或惩罚。
- issue: יִרְגָּז是否明确译为发怒
  choice: 译作“激动起来”
  alternative: 震怒；发怒；奋然行动
  rationale: 该动词可以涉及激动、震动或被激起，但本节未明说“怒”；采用较宽的译法以避免过度阐释。
translation_notes:
  register: 采用现代、庄重且易懂的书面普通话。以分号和破折号呈现希伯来诗句的平行与同位强调；保留“作为／工作”和“奇异／陌生”的词汇变化，避免把两组近义表达压平。
