  yaml_path: translation/ot/isaiah/028/010.yaml
  text: For it is[a], “Command on command, command on command, line on line, line on line, a little here, a little there.”
translation:
  language: zh_hans
  text: 因为是[a]：“命令加命令，命令加命令；准绳加准绳，准绳加准绳；这里一点，那里一点。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较直译：“命令对命令，命令对命令；准绳对准绳，准绳对准绳；那里一点，那里一点。”希伯来原文高度重复，可能是在模仿讥诮式、儿语般的说话方式。
    reason: 保留介词 ל 的较字面译法、שָׁם 两次均为“那里”的形式，以及原文可能具有的讥诮性重复语气。
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，说明受讥诮者所说的话；“因为”自然表达这里的解释或原因关系，同时不把语气强化为断言。
- source_word: צַו
  choice: 命令
  rationale: 若按 צוה 的相关词理解，指命令或训令。“命令”是现代汉语中自然、简洁的表达，也能保留原文短促而反复的节奏。
- source_word: לָצָו
  choice: 加命令
  rationale: 这里的 ל 构成高度重复的短语。译为“加”可用自然汉语表达层层叠加的形式，同时保留含义与节奏上的一定含混性。
- source_word: קַו
  choice: 准绳
  rationale: 该词通常指测量用的绳或线。“准绳”既保留测量工具的具体意象，也可在汉语中表达规范、尺度；比单译“线”更清楚。
- source_word: לָקָו
  choice: 加准绳
  rationale: 与“命令加命令”保持平行，重现原文反复、近乎儿语或讥诮式的节奏。
- source_word: זְעֵיר
  choice: 一点
  rationale: 意为少量或微小。“一点”简洁自然，适合本节的短促韵律。
- source_word: שָׁם
  choice: 那里
  rationale: 字面意为“那里”。第二处照字义译为“那里”，第一处则按汉语分配式惯用语译作“这里”，并在脚注保留原文两次均为“那里”的信息。
- source_word: זְעֵיר שָׁם ... זְעֵיר שָׁם
  choice: 这里一点，那里一点
  rationale: 采用现代汉语自然的分配式说法，以传达零碎、反复的语感；原文较直译的“那里一点，那里一点”列入脚注。
theological_decisions:
- issue: 本节是正面描述循序教导，还是模仿领袖讥诮先知的儿语式话语
  choice: 用引号和刻意重复的节奏呈现为被转述的讥诮式话语
  alternative: 不加引号，视为对教导方式的直接陈述
  rationale: 以赛亚书28:9–13的上下文支持这是对先知教导的嘲弄或模仿；译文不加入“胡言乱语”等解释性措辞，以保留原文的张力与可能的歧义。
translation_notes:
  register: 采用庄重而通俗的现代标准汉语。以“命令加命令、准绳加准绳”保留原文整齐、短促、反复的节奏；用分号显示两组平行结构。引号体现上下文中的转述，但不在正文中明说讥诮者身份。
