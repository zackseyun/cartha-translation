  text: אֶת מִי֙ יוֹרֶ֣ה דֵעָ֔ה וְ/אֶת מִ֖י יָבִ֣ין שְׁמוּעָ֑ה גְּמוּלֵי֙ מֵֽ/חָלָ֔ב עַתִּיקֵ֖י מִ/שָּׁדָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/009.yaml
  text: Whom will he teach knowledge[a], and to whom will he explain the message? Those weaned from milk[b], those taken from the breasts?
translation:
  language: zh_hans
  text: 他[b]要把知识教给谁？又要使谁明白这信息[a]呢？那些断了奶、离开乳房的吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “信息”也可译作“消息”、“传闻”或“所听见的内容”。
    reason: lexical_alternative
  - marker: b
    text: 原文没有明说“他”是谁；按上下文，这句话可能是在讥讽以赛亚。
    reason: alternative_reading
lexical_decisions:
- source_word: יוֹרֶה
  choice: 要把……教给
  rationale: 该词是 ירה 的使役形，常指“教导、指教”；此处以“要把知识教给谁”自然表达修辞问句。
- source_word: דֵעָה
  choice: 知识
  rationale: 直接保留“知识、认识”的基本含义，并与下句“明白”形成平行。
- source_word: יָבִין
  choice: 使……明白
  rationale: 该词是 בין 的使役形，直指使人理解；译文保留其使役意义。
- source_word: שְׁמוּעָה
  choice: 信息
  rationale: 该词可指信息、消息、传闻或所听见的内容；“信息”在本段教导语境中自然，同时不把含义限于某一种报告。
- source_word: גְּמוּלֵי מֵחָלָב
  choice: 那些刚断奶的婴孩
  rationale: 保留“从奶中断开、已经断奶”的意象；“婴孩”使汉语问句完整自然。“刚”表达所描绘的幼小阶段，并非另加精确时间限定。
- source_word: עַתִּיקֵי מִשָּׁדָיִם
  choice: 刚离开乳房的婴孩
  rationale: עתק 表示被移开或离开，מִשָּׁדָיִם 指乳房；译文与前半句保持近义平行。
- source_word: אֶת מִי ... וְאֶת מִי
  choice: 给谁……又使谁
  rationale: 以两个“谁”保留原文并列的修辞问句结构；“又”使现代汉语衔接自然。
theological_decisions:
- issue: 两个第三人称单数动词的主语所指
  choice: 正文用“他”，但不指明此人是谁，并加注说明原文没有明说主语。
  alternative: 明确译为“以赛亚”、耶和华，或完全省略主语。
  rationale: 希伯来语动词显示阳性单数主语，却未在本节点名。上下文可能是祭司和先知讥讽以赛亚，但正文不应替原文消除这一歧义。中文用“他”保留单数人物所指，脚注则说明其身份未定。
translation_notes:
  register: 采用现代、庄重而口语可懂的问句。“难道……吗”传达末句的讥讽性反问；保留“断奶”和“离开乳房”的具体意象及两行平行结构。所有脚注标记均置于正文相应位置。
