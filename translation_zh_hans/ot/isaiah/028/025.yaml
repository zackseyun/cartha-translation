base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/025.yaml
  text: Does he not[a], when he has leveled its surface, scatter black cumin and sow cumin, and put wheat in rows, and barley in its appointed place[c][b], and spelt at its border?
translation:
  language: zh_hans
  text: 他把地面整平以后，岂不是撒下黑种草[a]，播下孜然，把小麦成行地种下[b]，把大麦种在指定的地方，又把粗麦[c]种在田边吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “黑种草”所指的具体植物不能完全确定，也可能是黑葛缕子；较早的译法有“茴香”。
    reason: lexical_alternative
  - marker: b
    text: “成行地种下”：希伯来语这个词含义不确定，也可能指“种在最好的地方”或“作为主要作物”。
    reason: lexical_alternative
  - marker: c
    text: “粗麦”所指的具体谷物不能完全确定，可能是斯佩耳特小麦或二粒小麦。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלוֹא אִם
  choice: ……以后，岂不是……吗
  rationale: 这一组合引出带有时间或条件意味的反问；按上下文译为“……以后，岂不是……吗”，既保留反问语气，也符合现代汉语表达。
- source_word: שִׁוָּה פָנֶיהָ
  choice: 把地面整平
  rationale: שִׁוָּה 在此指弄平，פָנֶיהָ 字面为“它的表面”，所指是田地的地面。
- source_word: הֵפִיץ קֶצַח
  choice: 撒下黑种草
  rationale: הֵפִיץ 表示撒播；קֶצַח 常被认作黑种草，但具体植物仍有争议，因此加注说明。
- source_word: כַמֹּן יִזְרֹק
  choice: 播下孜然
  rationale: כַמֹּן 可确定为孜然；יִזְרֹק 本义为抛撒，在农耕语境中自然译为“播下”。
- source_word: חִטָּה שׂוֹרָה
  choice: 把小麦种成行
  rationale: חִטָּה 是小麦；罕见词 שׂוֹרָה 含义不确定，“成行”符合有序安排各种作物的语境，但其他解释收入脚注。
- source_word: שְׂעֹרָה נִסְמָן
  choice: 把大麦种在指定的地方
  rationale: שְׂעֹרָה 是大麦；נִסְמָן 很可能与标记、指定有关，译文表达田间预先划定的位置。
- source_word: כֻסֶּמֶת גְּבֻלָתוֹ
  choice: 把粗麦种在田界
  rationale: כֻסֶּמֶת 指一种小麦类谷物，但具体品种难定，正文采用较宽泛的“粗麦”；גְּבֻלָתוֹ 表示边界，依农业语境译为“田界”。
