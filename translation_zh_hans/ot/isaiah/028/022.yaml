source:
  edition: WLC
  text: וְ/עַתָּה֙ אַל תִּתְלוֹצָ֔צוּ פֶּֽן יֶחְזְק֖וּ מֽוֹסְרֵי/כֶ֑ם כִּֽי כָלָ֨ה וְ/נֶחֱרָצָ֜ה שָׁמַ֗עְתִּי מֵ/אֵ֨ת אֲדֹנָ֧/י יְהוִ֛ה צְבָא֖וֹת עַל כָּל הָ/אָֽרֶץ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/022.yaml
  text: So now[a], do not scoff, lest your bonds be made stronger[b]; for I have heard from the Lord GOD of Armies a complete destruction decreed against the whole land.
translation:
  language: zh_hans
  text: 所以，现在不要讥诮，免得你们的捆绑越发加重；因为我从主雅威——万军之主[a]那里听见，一场彻底而已定的毁灭，针对全地[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “万军之主”直译可作“众军的统帅”；这里的“军”也可包括天上的众军。
    reason: 说明צְבָאוֹת的字面意义及称号范围。
  - marker: b
    text: “全地”或译“全世界”。希伯来语可指一地的疆土，也可指整个大地。
    reason: 保留הָאָרֶץ在地域范围上的真实歧义。
lexical_decisions:
- source_word: וְעַתָּה
  choice: 所以现在
  rationale: 既保留连接前文的推论语气，也表达当前警告的紧迫性。
- source_word: תִּתְלוֹצָצוּ
  choice: 讥诮
  rationale: 该词表示带着轻蔑的嘲弄；“讥诮”符合先知责备的庄重语体。
- source_word: יֶחְזְקוּ מוֹסְרֵיכֶם
  choice: 你们的捆索越发牢固
  rationale: 按希伯来语句法，以“捆索”为主语，保留受捆绑这一审判意象；“越发牢固”自然表达捆绑加重的结果。
- source_word: כָלָה וְנֶחֱרָצָה
  choice: 毁灭已经定下
  rationale: כָלָה在审判语境中指彻底的终结或毁灭，נֶחֱרָצָה表示已经决定、判定；译文兼顾严重性和裁定已成的意味。
- source_word: אֲדֹנָי יְהוִה צְבָאוֹת
  choice: 主耶和华——万军之主
  rationale: 保留אֲדֹנָי与神名יהוה，并以现代中文可理解的称号表达צְבָאוֹת所指的众军。
- source_word: עַל כָּל הָאָרֶץ
  choice: 临到全地
  rationale: עַל在这里表示审判所针对、临到的范围；הָאָרֶץ可指本地国土，也可指全世界，正文依语境取“全地”并以脚注保留歧义。
theological_decisions:
- issue: 神圣称号 אֲדֹנָי יְהוִה 的译法
  choice: 主耶和华
  alternative: 主雅威
  rationale: 正文采用现代中文读者熟悉且庄重的“主耶和华”，同时明确保留“主”与神名两个组成部分，不把二者合并或省略。
- issue: צְבָאוֹת 的称号含义
  choice: 万军之主
  alternative: 众军的统帅；万军之耶和华
  rationale: 该复数名词本义涉及军队或众军，在神的称号中表达他统管一切军旅；正文采用中文传统中清楚而庄重的表达，脚注说明其字面依据。
- issue: הָאָרֶץ 的范围
  choice: 全地
  alternative: 全世界
  rationale: 上下文主要针对犹大和耶路撒冷，故正文保留可指当地疆土的“全地”；但希伯来词也可指整个大地或世界，因此不排除更广范围，并在脚注标明。
translation_notes:
  register: 采用现代、庄重而易懂的先知性警告语体。“免得”保留警戒关系；分号和冒号呈现原句由禁令转入理由及神谕内容的结构。所有脚注标记均置于正文相应词语之后。
