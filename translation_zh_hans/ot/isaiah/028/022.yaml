  to: 所以，现在不要讥诮，免得你们的捆绑越发加重；因为我从主雅威——万军之主[a]那里听见，一场彻底而已定的毁灭，针对全地[b]。
  rationale: 修订采用“主雅威”以保留אֲדֹנָי与יהוה两个组成部分并遵循项目神名处理；将“捆索越发牢固”调整为更自然的“捆绑越发加重”；并以“彻底而已定的毁灭”对应כָלָה וְנֶחֱרָצָה的双重限定。“针对全地”保留了原文范围表达，脚注继续避免在“土地／大地”之间武断定论。
