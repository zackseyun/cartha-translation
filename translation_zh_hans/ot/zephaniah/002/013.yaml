base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/002/013.yaml
  text: And he will stretch out his hand against the north and destroy Assyria[a], and he will make Nineveh a desolation, dry like the wilderness.
translation:
  language: zh_hans
  text: 他必伸手攻击北方，毁灭亚述；他必使尼尼微一片荒凉，干涸如旷野[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“干涸如沙漠”。希伯来语“米德巴尔”可指旷野、牧地，也可按语境指沙漠般的荒地。
    reason: 保留מִדְבָּר的词义范围及“沙漠”这一语境上可能的译法。
lexical_decisions:
- source_word: וְיֵט יָדוֹ
  choice: 他必伸手
  rationale: 保留原文“伸出手”的具体拟人意象；נטה与“手”连用时表示伸出或展开。
- source_word: עַל צָפוֹן
  choice: 攻击北方
  rationale: 鉴于下文毁灭亚述的审判语境，עַל在此含敌对指向；“攻击”比单纯“向着”更清楚地传达语势。
- source_word: וִיאַבֵּד אֶת אַשּׁוּר
  choice: 毁灭亚述
  rationale: אבד的使役式表示使之灭亡或遭毁坏；“亚述”在此指亚述国或帝国。
- source_word: וְיָשֵׂם אֶת נִינְוֵה לִשְׁמָמָה
  choice: 他必使尼尼微一片荒凉
  rationale: שׂים配合结果成分可译为“使……成为”；“一片荒凉”自然地保留שׁממה所表达的荒废景象。
- source_word: צִיָּה
  choice: 干旱
  rationale: 该词表示干燥、焦旱的状态；用“干旱”可自然修饰尼尼微荒废后的景况。
- source_word: כַּמִּדְבָּר
  choice: 如旷野
  rationale: מִדְבָּר可指无人居住的旷野，也可依语境指沙漠般的荒地；正文采用范围较宽的“旷野”，并以脚注保留“沙漠”这一可能译法。
theological_decisions:
- issue: 以拟人方式描写上帝的审判行动
  choice: 保留“他必伸手”的具体形象
  alternative: 他必采取行动攻击北方
  rationale: 原文明确使用身体意象来描写上帝施行审判；保留这一表达可维持先知话语的力度，而不将其抽象化。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“一片荒凉”使中文自然，同时保留原文名词性结果表达；分号呈现两个并列的审判行动。脚注标记置于其实际解释的“旷野”之后。
