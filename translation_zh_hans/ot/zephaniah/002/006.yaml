  text: 沿海地带必成为牧场，有牧人用的井[a]和羊圈。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “井”：原文词义不确定，也可能指蓄水坑、洞穴或棚屋。
    reason: כְּרֹת是罕见形式；其具体所指在词典和译本传统中存在分歧。正文依英语审计轨迹采用“井”，脚注保留其他可能，避免消除原文歧义。
lexical_decisions:
- source_word: חֶבֶל הַיָּם
  choice: 沿海之地
  rationale: חֶבֶל在此指一片地域，הַיָּם限定其为海边地区；译为“沿海之地”自然且准确。
- source_word: נְוֹת
  choice: 牧场
  rationale: 该词在此表示供牲畜放牧、栖息的草场。
- source_word: כְּרֹת
  choice: 井
  rationale: 这是罕见且词义不确定的形式，可理解为挖掘而成的井或蓄水坑；结合牧人所需设施，正文采用“井”，同时以脚注保留其他可能。
- source_word: גִדְרוֹת צֹאן
  choice: 羊群的圈
  rationale: 字面为供羊群使用的围栏或圈舍；“羊群的圈”简明并保留原文关系。
theological_decisions:
- issue: 是否把预言的语气处理为确定的将来结果
  choice: 必变为
  alternative: 将成为
  rationale: וְהָיְתָה在预言语境中陈述必将发生的转变；“必”传达其确定性，而不增添宗派性解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“沿海之地”“牧场”“羊群的圈”保持先知诗歌的简洁；用脚注处理罕见词，不在正文中武断消除歧义。
