source:
  edition: WLC
  text: נוֹרָ֤א יְהוָה֙ עֲלֵי/הֶ֔ם כִּ֣י רָזָ֔ה אֵ֖ת כָּל אֱלֹהֵ֣י הָ/אָ֑רֶץ וְ/יִשְׁתַּֽחֲווּ ל/וֹ֙ אִ֣ישׁ מִ/מְּקוֹמ֔/וֹ כֹּ֖ל אִיֵּ֥י הַ/גּוֹיִֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/002/011.yaml
  text: Yahweh will be fearsome against them[a], for he will make all the gods of the earth waste away; and they will bow down to him, each from his own place[b], all the coastlands of the nations.
translation:
  language: zh_hans
  text: 耶和华必向他们显为可畏，因为他必使地上所有的神明消瘦[a]；列国所有的沿海地区[b]，各人都必从自己的地方向他下拜。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“使地上所有的神明挨饿。”希伯来文动词的字面意思是变得瘦弱、消瘦。
    reason: lexical_alternative
  - marker: b
    text: 或译：“列国所有的岛屿。”这里的“沿海地区”是先知书中常见的说法，可泛指遥远的海岛、海岸及其居民。
    reason: lexical_alternative
lexical_decisions:
- source_word: נוֹרָא
  choice: 显为可畏
  rationale: 该谓语形容词表示耶和华令人敬畏、惧怕；“显为可畏”既保留主动引发畏惧的意味，也符合现代庄重汉语。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文中通行的专名形式音译四字神名，不以称号代替。
- source_word: עֲלֵיהֶם
  choice: 向他们
  rationale: 结合列国受审判的语境，表达带有敌对、针对意味的关系；与“显为可畏”搭配自然。
- source_word: רָזָה
  choice: 使……消瘦
  rationale: 保留该动词“变瘦、衰瘦”的具体意象及此处罕见的使动性用法，不直接解释为消灭偶像或废除宗教。
- source_word: אֵת כָּל אֱלֹהֵי הָאָרֶץ
  choice: 地上所有的神明
  rationale: 直译复数“神”，保留经文对列国诸神的论战性表述；“地上”体现本节的普世范围。
- source_word: וְיִשְׁתַּחֲווּ לוֹ
  choice: 向他下拜
  rationale: 兼顾俯伏动作和敬拜含义，避免只保留抽象宗教意义。
- source_word: אִישׁ מִמְּקוֹמוֹ
  choice: 各自在本地
  rationale: 表达分配性的“各自”及介词“从”的地点起点含义，在中文中自然呈现各地就地敬拜的图景。
- source_word: כֹּל אִיֵּי הַגּוֹיִם
  choice: 列国所有的沿海地区
  rationale: אִיִּים既可指岛屿，也可指海岸地带，并常在先知文学中代表遥远的海洋区域；正文采用较宽的“沿海地区”。
theological_decisions:
- issue: 如何表达耶和华对“地上所有的神明”的审判
  choice: 保留“神明”以及“使……消瘦”的比喻性说法
  alternative: 解释为“消灭所有偶像”或“废除一切虚假宗教”
  rationale: 希伯来文明确使用“神”并描写其消瘦；直译可保留经文对列国神祇的论战和耶和华至高权能的宣告，而不加入经文本身未明说的形上解释。
- issue: 末句描绘集中朝圣还是各地敬拜
  choice: 译作“各自在本地向他下拜”
  alternative: 解释为列国前往锡安集中敬拜
  rationale: מִן通常表示“从”，本句自然描绘列国从各自所在之地敬拜；译文不额外限定敬拜必须集中于某处。
- issue: 末句复数动词与句末主语的关系
  choice: 以“列国所有的沿海地区”为前置主语，保留地区的拟人化表达
  alternative: 增补为“沿海地区的人”或使用指代不明的“他们”
  rationale: 希伯来文在复数动词后以“列国所有的沿海地区”作句末主语；中文调整为前置主语更清楚，同时不擅自增补“人”。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“可畏”“下拜”保留先知文学的肃穆语气；“使……消瘦”刻意保留原文醒目的具体比喻，并以脚注说明。句序按现代汉语调整，将希伯来文句末的主语提前，以避免代词歧义。
