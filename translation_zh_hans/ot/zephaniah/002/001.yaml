  text: הִֽתְקוֹשְׁשׁ֖וּ וָ/ק֑וֹשּׁוּ הַ/גּ֖וֹי לֹ֥א נִכְסָֽף׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/002/001.yaml
  text: Gather yourselves together[a], yes, gather, O shameless nation,
translation:
  language: zh_hans
  text: '不知羞耻的国民啊，

    你们要聚集，聚集起来！[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本句所用动词也可按其字面词根理解为“收集禾秸”。末句希伯来语含义较难，也可较直译为“不被渴望的国民”或“没有渴望的国民”。
    reason: 保留两个希伯来语难点的字面可能性，避免正文的语境性译法掩盖原文歧义。
lexical_decisions:
- source_word: הִתְקוֹשְׁשׁוּ
  choice: 你们要聚集
  rationale: 该词是复数反身式命令语气；词根本可指收集禾秸，但此处与紧接的重复命令相配，较自然地表达召集众人、聚集自身。
- source_word: וָקֹושּׁוּ
  choice: 聚集起来
  rationale: 第二个命令重复并强化第一个命令。中文用重复结构保留先知话语急迫而有力的修辞效果。
- source_word: הַגּוֹי
  choice: 国民
  rationale: גּוֹי可指国家、民族或人民；这里是对一个群体的直接呼告，“国民”既保留集体含义，也比单说“国”更适合受呼告者。
- source_word: לֹא נִכְסָף
  choice: 不知羞耻的
  rationale: 这一希伯来语短语含义困难；按上下文可理解为对该民道德状态的责备，译作“不知羞耻的”较自然，但属于解释性翻译，因此脚注保留更贴近字面的可能译法。
