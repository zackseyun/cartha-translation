  yaml_path: translation/ot/zephaniah/002/012.yaml
  text: You Cushites also will be slain by my sword[a][b].
translation:
  language: zh_hans
  text: 古实人哪，你们也必被我的刀所杀。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 更贴近字面可译：“古实人哪，你们也——是我刀下的被杀者。”原文为无动词句，句末另有“他们”这一独立代词，带有断言或强调意味；时间需由上下文判断。
    reason: lexical_alternative
  - marker: b
    text: “古实人”也可译作“埃塞俄比亚人”，指古实地区的居民，并不一定等同于现代埃塞俄比亚国民。
    reason: alternative_reading
lexical_decisions:
- source_word: גַּם
  choice: 也
  rationale: 保留附加意味，表明古实人也列在周围受审判的民族之中。
- source_word: אַתֶּם
  choice: 你们
  rationale: 对应第二人称阳性复数，保留直接称呼。
- source_word: כּוּשִׁים
  choice: 古实人
  rationale: 采用传统且较准确的族名音译，避免译作“埃塞俄比亚人”而使读者误以为与现代国家疆域和民族完全相同。
- source_word: חַֽלְלֵי
  choice: 被……所杀
  rationale: 该名词指遭暴力杀死的人；转化为汉语被动谓语，使表达自然，同时保留死亡结果。
- source_word: חַרְבִּי
  choice: 我的刀
  rationale: 保留第一人称所属关系及具体的兵器意象；“刀”在现代汉语经文语体中可自然表达古代用于杀戮的 חרב。
- source_word: הֵמָּה
  choice: 必被
  rationale: 原文为无系词名词句，并以独立代词构成断言；结合审判预言的语境，用“必”表达将来的确定性，但在脚注中保留更贴近形式的读法。
theological_decisions:
- issue: 无动词句的时间指向
  choice: 按预言语境译为将来的确定事件：“必被……所杀”
  alternative: 按字面句式译为“他们是被我的刀所杀的人”
  rationale: 希伯来语本句没有明示时态；上下文指向即将临到的审判。正文采用自然汉语表达该语境意义，脚注则保留原句在形式上的歧义。
- issue: “我的刀”中第一人称的指涉
  choice: 保留“我的”，不在正文中补明说话者
  alternative: 解释性译作“耶和华的刀”
  rationale: 原文只有第一人称后缀；保留代词可避免把上下文信息直接写入本节，并维持原有修辞张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“古实人哪”保留先知直接呼告的力度；“必被我的刀所杀”比照搬希伯来语名词句更符合现代汉语，同时以脚注说明原文结构与可能读法。
