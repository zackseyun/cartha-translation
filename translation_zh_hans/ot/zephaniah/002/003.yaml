  naturalness: “地上所有谦卑的人，就是……的人，你们要……”句式较重，呼语位置也不够顺畅。改为“这地上一切谦卑、遵行他典章的人哪”更符合庄重而自然的现代汉语。
  terminology: “耶和华”“公义”“谦卑”均恰当。“典章”用于 מִשְׁפָּט 较“公正法则”简洁，且避免把该词限定为抽象的法律规则。“或许……会被隐藏”保留或然性，不将其解释为确定的庇护。
