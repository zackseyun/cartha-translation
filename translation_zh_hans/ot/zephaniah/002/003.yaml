  rationale: 修订使呼语和关系从句更合乎现代汉语，同时以“典章”较审慎地表达 מִשְׁפָּטוֹ 的语义范围。保留“寻求”的三次重复、神名、对“这地／全地”的开放可能性，以及“或许”与被动“被隐藏”所呈现的非保证性。
