source:
  edition: WLC
  text: בַּקְּשׁ֤וּ אֶת יְהוָה֙ כָּל עַנְוֵ֣י הָ/אָ֔רֶץ אֲשֶׁ֥ר מִשְׁפָּט֖/וֹ פָּעָ֑לוּ בַּקְּשׁוּ צֶ֨דֶק֙ בַּקְּשׁ֣וּ עֲנָוָ֔ה אוּלַי֙ תִּסָּ֣תְר֔וּ בְּ/י֖וֹם אַף יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/002/003.yaml
  text: Seek Yahweh[a], all you humble of the land, who have carried out his justice; seek righteousness, seek humility[d][c][b]; perhaps you will be hidden in the day of Yahweh’s anger.
translation:
  language: zh_hans
  text: 这地上一切谦卑、遵行他典章的人哪，你们要寻求耶和华；要寻求公义，寻求谦卑。或许在耶和华发怒的日子，你们会被隐藏[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: c
    text: “被隐藏”也可译作“被遮蔽”或“蒙庇护”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּקְּשׁוּ
  choice: 寻求
  rationale: 复数祈使式，表示直接呼召；三次重复译出，以保留原文的修辞力量。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代简体中文读者熟悉的专名形式译出四字神名，而不以普通称号替代。
- source_word: עַנְוֵי הָאָרֶץ
  choice: 地上所有谦卑的人
  rationale: עַנְוֵי 表示谦卑、温柔或卑微的人；הָאָרֶץ 可指本地或大地，此处保留较宽泛的“地上”。
- source_word: אֲשֶׁר מִשְׁפָּטוֹ פָּעָלוּ
  choice: 就是遵行他公正法则的人
  rationale: פָּעָלוּ 表示实行、行出；מִשְׁפָּטוֹ 可指他的判决、公正或法则。“遵行他公正法则”兼顾规范性和实践性。
- source_word: צֶדֶק
  choice: 公义
  rationale: 可指公义、公正或正直；与“谦卑”并列时，“公义”自然且保留其伦理和关系层面的广度。
- source_word: עֲנָוָה
  choice: 谦卑
  rationale: 与前文“谦卑的人”形成词根和语义上的呼应。
- source_word: אוּלַי
  choice: 或许
  rationale: 明确保留可能性，不把劝告改写为必然得救的保证。
- source_word: תִּסָּתְרוּ
  choice: 你们可以被隐藏
  rationale: 尼法勒式表达被隐藏、被遮蔽；结合“或许”，译文保留被动意义和不确定性。
- source_word: בְּיוֹם אַף יְהוָה
  choice: 在耶和华发怒的日子
  rationale: אַף 在此表示怒气；用“发怒的日子”形成自然、庄重的现代汉语。
theological_decisions:
- issue: 本节是否保证谦卑者必然蒙保护
  choice: 译为“或许……可以被隐藏”，表达可能而非确定保证。
  alternative: 将其理解为义民余民必然在审判中蒙拯救。
  rationale: אוּלַי 明确带有不确定语气；译文不消除原文留下的神学张力。
- issue: “被隐藏”是否应解释为蒙庇护或得拯救
  choice: 正文保留“被隐藏”的意象。
  alternative: 译为“蒙庇护”或“得以逃脱”。
  rationale: סתר 的被动形式首先是被藏起、被遮蔽；“蒙庇护”虽合语境，却增加了解释性，应列为脚注可能译法。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准普通话。保留三次“寻求”的重复、神名“耶和华”、被动意象及“或许”所表达的不确定性。
