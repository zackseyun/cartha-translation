base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/002/014.yaml
  text: Herds will lie down in her midst[a], every beast of the nations; both the desert owl and the hedgehog will spend the night among her capitals. A voice will sing in the window; devastation will be on the threshold[c][b], for her cedarwork has been laid bare.
translation:
  language: zh_hans
  text: 各类野兽[a]必成群地躺卧在城中；鹈鹕[b]和刺猬[c]也必在柱头间过夜。歌声从窗户传出，门槛上一片荒凉；因为香柏木板已被剥露。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语此短语直译近于“一个民族的一切野兽”，但语法和含义困难；也可理解为“各类野兽”。
    reason: alternative_reading
  - marker: b
    text: “鹈鹕”所译的希伯来语动物名称不能确定，也可译作“荒漠鸮”。
    reason: lexical_alternative
  - marker: c
    text: “刺猬”所译的希伯来语动物名称不能确定，也可译作“豪猪”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָבְצוּ בְתוֹכָהּ עֲדָרִים
  choice: 成群的走兽必躺卧在城中
  rationale: רבץ常指动物伏卧、歇息；עֲדָרִים指成群的动物。将阴性代词所指的城市明说为“城”，在中文中自然清楚。
- source_word: כָּל חַיְתוֹ גוֹי
  choice: 各类野兽都在那里
  rationale: 原文短语语法和含义困难，字面近似“一个民族的每只野兽”。正文采用符合废城图景的常见理解“各类野兽”，脚注保留字面读法。
- source_word: קָאַת
  choice: 鹈鹕
  rationale: 所指鸟类不能确定；“鹈鹕”是有古老译本支持的传统识别，同时以脚注列出“荒漠鸮”等可能。
- source_word: קִפֹּד
  choice: 刺猬
  rationale: 动物种类不能确定；“刺猬”是常见译法，脚注保留“豪猪”等异译。
- source_word: בְּכַפְתֹּרֶיהָ יָלִינוּ
  choice: 必在柱头间过夜
  rationale: כפתור在此最可能指柱子的装饰性柱头；לין意为过夜、住宿。
- source_word: קוֹל יְשׁוֹרֵר בַּחַלּוֹן
  choice: 窗户里传出鸣叫声
  rationale: קוֹל可指声音，ישׁורר通常与歌唱有关。鉴于语境可能是废墟中动物发声，用“鸣叫声”保留声音意象，也避免硬译成无人之城里有人歌唱。
- source_word: חֹרֶב בַּסַּף
  choice: 门槛上一片荒凉
  rationale: חֹרֶב在废城语境中表示荒凉、毁坏；סף是门槛。
- source_word: כִּי אַרְזָה עֵרָה
  choice: 因为香柏木板已被剥露
  rationale: אַרְזָה与香柏木有关，עֵרָה表示使裸露、剥开；译文呈现建筑内昂贵木饰被暴露的景象。
