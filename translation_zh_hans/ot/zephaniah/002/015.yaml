  to: '这就是那座欢腾的城，安然居住，心里说：


    “唯有我，除我以外再没有别的。”


    她竟成了荒凉之地[a]，


    成了野兽躺卧之处！


    凡从她旁边经过的，都必发出嘘声[b]，摇手。'
  rationale: 修订仅处理三处：以“再没有别的”保留原文排他语句的宽泛范围；以“荒凉之地”提升现代汉语清晰度；将末句改为“摇手”，除去原文未明确说明的“表示鄙弃”。脚注锚点仍分别紧随“荒凉之地”和“发出嘘声”，并与脚注内容一致。
