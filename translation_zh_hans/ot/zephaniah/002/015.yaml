base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/002/015.yaml
  text: This is the exultant city that lived securely[a], that said in her heart, ‘I am, and there is none besides me.’ How she has become a desolation[b], a resting place for wild animals! Everyone who passes by her will hiss and wave his hand.
translation:
  language: zh_hans
  text: '这就是那座欢腾的城，安然居住，心里说：


    “唯有我，除我以外再没有别的。”


    她竟成了荒凉之地[a]，


    成了野兽躺卧之处！


    凡从她旁边经过的，都必发出嘘声[b]，摇手。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “荒凉之地”或译“令人惊骇之地”。希伯来语原词不仅可指实际的荒废，也可包含其惨状令人震骇之意。
    reason: lexical_alternative
  - marker: b
    text: “发出嘘声”或译“吹口哨”。希伯来语动词可指因惊讶或嘲弄而发出的尖锐声音。
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעִיר הָעַלִּיזָה
  choice: 那座欢腾的城
  rationale: “欢腾”保留该形容词所表达的欢喜、得意之意，在上下文中也能显出城的骄傲自满。
- source_word: הַיּוֹשֶׁבֶת לָבֶטַח
  choice: 安然居住
  rationale: 分词结构描写持续处于安稳无忧的状态；“安然居住”自然、庄重，并贴近希伯来语表达。
- source_word: הָאֹמְרָה בִּלְבָבָהּ
  choice: 心里说
  rationale: 保留希伯来语“在心里说”的内在自语意象，同时延续对城的拟人化。
- source_word: אֲנִי וְאַפְסִי עוֹד
  choice: 唯有我，除我以外再没有谁
  rationale: 表达排他的自我尊崇，并保留与耶和华宣告独一性之措辞形成的刻意呼应；“谁”与拟人化的城市相称。
- source_word: לְשַׁמָּה
  choice: 荒场
  rationale: 概括城遭彻底毁坏、荒废的景象；该词亦可带有令人惊骇之义，另列脚注。
- source_word: מַרְבֵּץ לַחַיָּה
  choice: 野兽躺卧之处
  rationale: 直接表达动物躺卧栖息的地方，既具体又不把动物限定为猛兽。
- source_word: יִשְׁרֹק
  choice: 发出嘘声
  rationale: 该动词可指吹哨或发出嘘声；审判语境中“嘘声”较能传达惊讶与讥诮，但保留另一可能于脚注。
- source_word: יָנִיעַ יָדוֹ
  choice: 挥手表示鄙弃
  rationale: 原文是手部动作，其具体形式及含义略有弹性；结合废墟旁观者的反应，以自然中文说明这是轻蔑、鄙弃的姿态。
theological_decisions:
- issue: 城市自夸 אֲנִי וְאַפְסִי עוֹד 的排他性措辞
  choice: 唯有我，除我以外再没有谁
  alternative: 我是，此外再没有什么
  rationale: 所选译法保留这座城僭越式的自我高举，也保留它与别处上帝独一性宣告之间醒目的文学和神学张力，而不在正文中替读者解释。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。诗行保留先知讥讽与惊叹的推进；“她”延续原文对城市的阴性拟人化。正文中的脚注标记均与脚注对应。
