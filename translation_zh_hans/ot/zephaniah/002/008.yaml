base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/002/008.yaml
  text: I have heard the reproach of Moab and the insults of the sons of Ammon[b][a], with which they reproached my people and magnified themselves against their border.
translation:
  language: zh_hans
  text: “我听见了摩押的辱骂和亚扪人的侮辱[a]；他们辱骂我的百姓，又向着他们的疆界自夸[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “亚扪人”原文直译为“亚扪之子”。
    reason: lexical_alternative
  - marker: b
    text: “他们的疆界”很可能指“我的百姓”的疆界或领土；原文也可译作“在他们的疆界上自夸”或“向着他们的疆界夸大自己”。
    reason: referential_and_lexical_ambiguity
lexical_decisions:
- source_word: שָׁמַעְתִּי
  choice: 我听见了
  rationale: 第一人称单数完成式表示耶和华已经听见这些敌对言语；“听见了”在现代汉语中自然，也保留行动已经发生并具有当前意义的语气。
- source_word: חֶרְפַּת
  choice: 辱骂
  rationale: 该词在此指以言语施加的羞辱和讥诮；“辱骂”比单纯的“羞辱”更清楚地表现言语攻击，并与下文动词呼应。
- source_word: גִדּוּפֵי
  choice: 侮辱
  rationale: 该词表示毁谤、谩骂一类的恶言；“侮辱”保留其攻击性，又不把对象限定为对上帝的亵渎。
- source_word: בְּנֵי עַמּוֹן
  choice: 亚扪人
  rationale: 希伯来语直译为“亚扪之子”，实际是常见的族群称呼；现代汉语用“亚扪人”最自然准确，直译形式列入脚注。
- source_word: אֲשֶׁר חֵרְפוּ אֶת עַמִּי
  choice: 他们辱骂我的百姓
  rationale: 关系从句承接前面的辱骂和侮辱；汉语改用分句可避免生硬，同时保持施事者和对象清楚。
- source_word: וַיַּגְדִּילוּ
  choice: 自高自大
  rationale: גדל 的使役形在这里表达自我抬高和狂妄；“自高自大”保留自我尊大的意象，也符合庄重而通顺的现代汉语。
- source_word: עַל גְּבוּלָם
  choice: 对着他们的疆界
  rationale: עַל 在敌对语境中可表“针对、对着”；“疆界”保留边界与领土的双重含义，第三人称复数后缀也不在正文中过度消解。
theological_decisions:
- issue: גְּבוּלָם 中第三人称复数后缀的所指
  choice: 正文保留“他们的疆界”，最可能指刚提到的“我的百姓”的疆界或领土
  alternative: 也可能被理解为摩押人和亚扪人自己的疆界，或笼统指有关领土
  rationale: “我的百姓”是最近的复数意义先行对象，且上下文涉及摩押和亚扪对犹大领土的敌意；但希伯来语代词本身简略，因此正文不直接改成“我百姓的疆界”，而在脚注说明。
- issue: וַיַּגְדִּילוּ עַל 的具体语义
  choice: 自高自大，表现针对边界或领土的狂妄
  alternative: 向疆界夸口；侵犯或越过疆界
  rationale: 动词的核心是“使自己为大”，即自我高举。语境可能含领土上的挑衅，但“侵犯”会把隐含意义写得过实，因此保留较宽的表达。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。以“辱骂／侮辱”保持希伯来语平行结构，以“自高自大”传达自我抬高的意象；对疆界所属和介词关系的歧义不在正文中强行确定。
