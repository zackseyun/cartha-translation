  yaml_path: translation/ot/zephaniah/002/004.yaml
  text: For Gaza will be abandoned[a], and Ashkelon a desolation; Ashdod—they will drive her out at noon[b], and Ekron will be uprooted.
translation:
  language: zh_hans
  text: 因为迦萨必被遗弃[a]，亚实基伦必成为荒场；正午时分，他们必赶走亚实突[b]；以革伦必被连根拔起。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “迦萨”（希伯来语音近“阿扎”）与“被遗弃”（希伯来语音近“阿祖瓦”）在原文中可能构成谐音双关。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“他们必在正午赶走她”；“她”指亚实突城，把城市拟人化。“正午”强调驱逐将在光天化日之下发生。
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，说明先前呼吁的根据，保留因果关系。
- source_word: עַזָּה
  choice: 迦萨
  rationale: 采用现代中文圣经读者熟悉的标准地名译法。
- source_word: עֲזוּבָה תִהְיֶה
  choice: 必被遗弃
  rationale: 准确表达被撇下、成为荒弃之地的结果状态；希伯来语与“迦萨”之间的谐音无法自然移入中文，交由脚注说明。
- source_word: אַשְׁקְלוֹן לִשְׁמָמָה
  choice: 亚实基伦必成为荒场
  rationale: 补出中文所需的谓语，“荒场”保留先知审判语境中荒凉毁坏的意味。
- source_word: בַּצָּהֳרַיִם
  choice: 正午时分
  rationale: 直译时间表达，并凸显事情在光天化日之下发生。
- source_word: יְגָרְשׁוּהָ
  choice: 人必赶走亚实突的居民
  rationale: 原文直译为“他们必赶走她”，阴性宾语指城市；中文以城市居民作转喻更自然，同时用脚注保留原文拟人表达。
- source_word: תֵּעָקֵר
  choice: 必被连根拔起
  rationale: 保留עקר的拔根意象，并表达城市遭彻底除去的审判。
