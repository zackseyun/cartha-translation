reference: Zephaniah 2:9
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: לָ/כֵ֣ן חַי אָ֡נִי נְאֻם֩ יְהוָ֨ה צְבָא֜וֹת אֱלֹהֵ֣י יִשְׂרָאֵ֗ל כִּֽי מוֹאָ֞ב כִּ/סְדֹ֤ם תִּֽהְיֶה֙ וּ/בְנֵ֤י עַמּוֹן֙ כַּֽ/עֲמֹרָ֔ה מִמְשַׁ֥ק חָר֛וּל וּ/מִכְרֵה מֶ֥לַח וּ/שְׁמָמָ֖ה עַד עוֹלָ֑ם שְׁאֵרִ֤ית עַמִּ/י֙ יְבָזּ֔וּ/ם וְ/יֶ֥תֶר גוי יִנְחָלֽוּ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/002/009.yaml
  text: Therefore[a], as I live, declares Yahweh of hosts, the God of Israel, Moab will surely become like Sodom, and the sons of Ammon like Gomorrah—a place overgrown with weeds, a salt pit, and a perpetual desolation. The remnant of my people will plunder them[b], and the remainder of my nation will inherit them.
translation:
  language: zh_hans
  text: 因此，万军之雅威、以色列的上帝宣告说：“我凭我的永生起誓：摩押必像所多玛，亚扪人必像蛾摩拉，成为荆棘丛生之地[a]、盐坑和永远荒凉之处。我子民的余民必掳掠他们，我民族其余的人必承受他们[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “荆棘丛生之地”所对应的希伯来语短语含义不易确定，也可较直译为“荨麻所占之地”；这里描绘荒废土地被带刺或类似荨麻的野草覆盖。
    reason: 说明疑难希伯来短语 מִמְשַׁק חָרוּל 的词义范围和译法取舍。
  - marker: b
    text: “承受他们”：原文直译为“承受他们／取得他们为业”。“他们”可指摩押和亚扪，亦可能连带指其土地或产业；译文保留这一指代范围。
    reason: 保留原文代词及“承受”为业用语的指代歧义，避免将宾语限定为土地。
lexical_decisions:
- source_word: לָכֵן
  choice: 因此
  rationale: 承接上文的指控并引出审判结论，保留先知话语的推论关系。
- source_word: חַי אָנִי
  choice: 我指着我的永生起誓
  rationale: 这是上帝以自己的生命起誓的固定誓言格式；这样译成现代汉语既自然，也保留其庄严和强调语气。
- source_word: נְאֻם יְהוָה צְבָאוֹת אֱלֹהֵי יִשְׂרָאֵל
  choice: 万军之雅威、以色列的上帝宣告说
  rationale: נְאֻם采用先知书中自然的宣告公式；יהוה音译为“雅威”，并保留“万军之”及“以色列的上帝”两个称号。
- source_word: כִּי
  choice: 必
  rationale: 此处引出誓言内容并带强调意味，用“必”自然表达判决的确定性。
- source_word: מוֹאָב כִּסְדֹם תִּהְיֶה
  choice: 摩押必像所多玛
  rationale: 忠实保留国家名称、比较结构和将来的审判结果；汉语中无需补入“成为”也能清楚表达。
- source_word: וּבְנֵי עַמּוֹן
  choice: 亚扪人
  rationale: 字面为“亚扪之子”，实际指亚扪民族；“亚扪人”是现代汉语中准确而自然的族称。
- source_word: כַּעֲמֹרָה
  choice: 像蛾摩拉
  rationale: 直接保留与典型受审判城市蛾摩拉的比较。
- source_word: מִמְשַׁק חָרוּל
  choice: 荆棘丛生之地
  rationale: 该短语语义困难；חָרוּל指带刺或类似荨麻的野生植物，מִמְשַׁק的确切含义不明。译文传达荒地被带刺杂草占据的图景，同时以脚注保留字面解释的不确定性。
- source_word: וּמִכְרֵה מֶלַח
  choice: 盐坑
  rationale: מִכְרֵה可指坑穴或开采之处；“盐坑”兼顾词义和盐碱荒芜的审判意象，避免现代工业化色彩过强的“盐矿”。
- source_word: וּשְׁמָמָה עַד עוֹלָם
  choice: 永远荒凉之处
  rationale: 保留荒废状态及עַד עוֹלָם所表达的持续性，中文简洁庄重。
- source_word: שְׁאֵרִית עַמִּי
  choice: 我子民的余民
  rationale: 保留先知文学中重要的“余民”概念，不将其弱化为一般的“剩下的人”。
- source_word: יְבָזּוּם
  choice: 必掳掠他们
  rationale: בזז表示从战败者那里夺取财物；“掳掠”符合先知审判语境，也较为凝练。
- source_word: וְיֶתֶר גוי יִנְחָלוּם
  choice: 我国中剩余的人必占有他们的土地
  rationale: יִנְחָלוּם字面可理解为“承受/占有他们”；在领土审判语境中补出“土地”，使现代汉语所指清楚，但以脚注说明原文仅有代词。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。采用“雅威”保留其作为专名的性质，不以称号“主”代替，也不引入较晚形成的混合读音。
- issue: עַד עוֹלָם 所表达的审判持续性
  choice: 永远荒凉
  alternative: 长久荒凉
  rationale: 直译其持续、无明确终点的修辞力度，不预先用系统神学限制或扩张该词在本节中的时间范围。
- issue: יִנְחָלוּם 的对象
  choice: 占有他们的土地
  alternative: 承受他们；占有他们
  rationale: 动词常用于取得产业，语境也涉及摩押和亚扪之地；中文补出“土地”使意义通顺，但脚注明示原文代词字面指“他们”，以保留解释空间。
translation_notes:
  register: 采用现代、庄重而易懂的先知宣告语体。神谕公式置于引语之前，使中文句法自然；保留“余民”等具有经文互文意义的术语。族称使用自然的“亚扪人”，不拘泥于字面的“亚扪之子”。所有解释性补充均尽量少量，并借脚注交代原文的词义困难与代词歧义。
