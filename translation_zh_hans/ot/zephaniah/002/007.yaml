source:
  edition: WLC
  text: וְ/הָ֣יָה חֶ֗בֶל לִ/שְׁאֵרִ֛ית בֵּ֥ית יְהוּדָ֖ה עֲלֵי/הֶ֣ם יִרְע֑וּ/ן בְּ/בָתֵּ֣י אַשְׁקְל֗וֹן בָּ/עֶ֨רֶב֙ יִרְבָּצ֔וּ/ן כִּ֧י יִפְקְדֵ֛/ם יְהוָ֥ה אֱלֹהֵי/הֶ֖ם וְ/שָׁ֥ב שבות/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/002/007.yaml
  text: And the coastland shall belong to the remnant of the house of Judah; on it they shall pasture. In the houses of Ashkelon they shall lie down at evening, for Yahweh their God will attend to them and restore their fortunes.
translation:
  language: zh_hans
  text: 这沿海之地必归犹大家的余民所有；他们要在那里放牧。傍晚，他们必躺卧在亚实基伦的房屋中，因为雅威他们的上帝必眷顾他们[a]，扭转他们的境况[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “眷顾”也可译作“察看他们”或“临到他们”。原文动词可指上帝关注并介入，结果既可能是赐福，也可能是审判；此处上下文表明是施恩复兴。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“使他们被掳的人归回”。这个希伯来惯用语常表示扭转一个民族的困境、恢复其景况，不一定只指被掳者实际归回。
    reason: alternative_reading
lexical_decisions:
- source_word: חֶבֶל
  choice: 沿海之地
  rationale: 该词本指一片地域或地带；结合2:5–6非利士沿海地区的语境，译为“沿海之地”既体现地理背景，也不把词义缩窄为海岸线本身。
- source_word: שְׁאֵרִית
  choice: 余民
  rationale: “余民”保留先知书中蒙存留群体的神学意味，同时是现代中文圣经语体中清楚而凝练的表达。
- source_word: עֲלֵיהֶם
  choice: 在那里
  rationale: 原文形式为复数，所指可能是前文涉及的地域或其中各处；中文以“在那里”自然承接整体地域，也保留所指范围的弹性。
- source_word: יִרְעוּן
  choice: 放牧
  rationale: רעה可指牧养或使牲畜吃草；此处描写余民使用该地，译为“放牧”可呈现田园景象，又不把余民直接说成吃草的主体。
- source_word: בְּבָתֵּי אַשְׁקְלוֹן
  choice: 在亚实基伦的房屋中
  rationale: 按其地点意义直译，呈现余民在受审判的非利士城中重新安居的图景。
- source_word: בָּעֶרֶב
  choice: 晚上
  rationale: 自然、简洁地表达傍晚或晚间这一时间背景。
- source_word: יִרְבָּצוּן
  choice: 躺卧
  rationale: 该动词常用于牲畜安然卧下；“躺卧”保留具体的田园意象和安歇意味。
- source_word: יִפְקְדֵם
  choice: 眷顾他们
  rationale: פקד可表示察看、关注、介入、惩罚或照料；在本节复兴语境中，“眷顾”自然表达上帝施恩介入，同时以脚注说明其较宽的词义。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以“雅威”音译四字神名，保留原文使用的专名，不以称号替代。
- source_word: וְשָׁב שבותם
  choice: 扭转他们的境况
  rationale: 这一希伯来惯用语常指使一个群体摆脱困境、恢复原有景况，不一定只指被掳者归回；该译法符合本节土地、安居与复兴的整体语境。
theological_decisions:
- issue: 如何翻译复兴惯用语 וְשָׁב שְׁבוּתָם
  choice: 扭转他们的境况
  alternative: 使他们被掳的人归回
  rationale: 原文可按字面关联“被掳”或“俘虏”，但该惯用语在先知性语境中常泛指逆转困境。正文采用较宽的复兴含义，脚注保留较字面的另一种理解。
- issue: 如何翻译神名 יְהוָה
  choice: 雅威
  alternative: 耶和华／主
  rationale: 原文直接使用四字神名，故正文采用常见的现代汉语音译“雅威”，以区别于“主”这一称号；不据此加入任何宗派性解释。
- issue: פקד在本节中的介入性质
  choice: 眷顾
  alternative: 察看／临到
  rationale: 该动词本身可指带来福分或审判的关注与介入；本节随后说扭转境况，因此上下文倾向施恩性的眷顾，但脚注仍说明原词的宽泛语义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“沿海之地”“余民”“躺卧”保留先知书的地理、群体与田园意象；句式适度正式但避免古奥。“他们要在那里放牧”消除中文中把人误读为吃草的可能，同时不额外指定牲畜种类。所有脚注标记均已置于正文相应词语之后。
