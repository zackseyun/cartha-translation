  text: ה֗וֹי יֹֽשְׁבֵ֛י חֶ֥בֶל הַ/יָּ֖ם גּ֣וֹי כְּרֵתִ֑ים דְּבַר יְהוָ֣ה עֲלֵי/כֶ֗ם כְּנַ֨עַן֙ אֶ֣רֶץ פְּלִשְׁתִּ֔ים וְ/הַאֲבַדְתִּ֖י/ךְ מֵ/אֵ֥ין יוֹשֵֽׁב־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/002/005.yaml
  text: Woe[a], inhabitants of the seacoast, nation of the Cherethites! The word of Yahweh is against you, Canaan, land of the Philistines; and I will destroy you until no inhabitant remains.
translation:
  language: zh_hans
  text: 海滨地区的居民、基利提族[a]啊，你们有祸了！雅威的话是针对你们的。迦南——非利士人的土地啊，我要毁灭你，以致无人居住。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “基利提族”是希伯来语כְּרֵתִים的族名音译，也可译作“基利提人”。
    reason: 说明族名的音译性质及常见中文表达。
lexical_decisions:
- source_word: הוֹי
  choice: 有祸了
  rationale: 这是先知宣告审判时使用的感叹词；“有祸了”既保留警告和定罪的力度，也符合现代汉语表达。
- source_word: יֹשְׁבֵי חֶבֶל הַיָּם
  choice: 海滨地区的居民
  rationale: חֶבֶל הַיָּם指沿海地带；译作“海滨地区”自然清楚，并保留其地理含义。
- source_word: גּוֹי כְּרֵתִים
  choice: 基利提族
  rationale: גּוֹי指民族或国族，כְּרֵתִים是族名；采用常见的希伯来语音译“基利提”，并以“族”表达集体称呼。
- source_word: דְּבַר יְהוָה עֲלֵיכֶם
  choice: 雅威的话针对你们而来
  rationale: 在审判语境中，עַל表示敌对、针对的方向；此译避免把它弱化为单纯“临到”，同时保持汉语自然。
- source_word: כְּנַעַן אֶרֶץ פְּלִשְׁתִּים
  choice: 迦南——非利士人的土地
  rationale: 保留“迦南”及其同位说明“非利士人的土地”，不把两者合并或消解，从而保存原文的地理与修辞张力。
- source_word: וְהַאֲבַדְתִּיךְ
  choice: 我要毁灭你
  rationale: אבד的使役形表达使对象灭亡；第二人称阴性单数指向作为土地或地区而被人格化的迦南。
- source_word: מֵאֵין יוֹשֵׁב
  choice: 使你无人居住
  rationale: 该短语描述毁灭所造成的彻底荒凉和人口断绝；“无人居住”简明地传达结果。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；“雅威”较直接地呈现其专名性质，不以称号替代，也不引入特定宗派解释。
- issue: 审判对象中第二人称阴性单数的所指
  choice: 将“你”理解为被人格化的迦南之地
  alternative: 将“你”泛指非利士民族
  rationale: וְהַאֲבַדְתִּיךְ的阴性单数后缀在紧邻的“迦南／土地”之后，最自然地呼应该地；译文保留“你”，不额外限定其范围。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“有祸了”保留先知性审判宣告的力度；破折号呈现“迦南”与“非利士人的土地”的同位关系。
