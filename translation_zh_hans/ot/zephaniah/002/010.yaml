revisions:
- from: 这是他们因自己的骄傲所得的报应，因为他们嘲讽万军之耶和华的子民，妄自尊大，凌驾于他们之上。
  to: 这是他们为自己的骄傲所受的报应；因为他们辱骂万军之耶和华的子民，又在他们之上自高自大。
  rationale: 修订维持“这／他们／报偿”的判决结构，并以“为……所受的报应”清楚表达 תַּחַת 的报偿关系。后半句按原文并列关系译出“辱骂”与“在……之上自高自大”，避免将自我高举具体化为原文未明说的支配行为。
