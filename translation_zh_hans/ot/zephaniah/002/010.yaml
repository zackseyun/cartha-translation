  text: זֹ֥את לָ/הֶ֖ם תַּ֣חַת גְּאוֹנָ֑/ם כִּ֤י חֵֽרְפוּ֙ וַ/יַּגְדִּ֔לוּ עַל עַ֖ם יְהוָ֥ה צְבָאֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/002/010.yaml
  text: This will be their lot in return for their pride[a], because they taunted and magnified themselves against the people of Yahweh of Armies.
translation:
  language: zh_hans
  text: 这是他们为自己的骄傲所受的报应；因为他们辱骂万军之耶和华的子民，又在他们之上自高自大。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זֹאת לָהֶם
  choice: 这是他们……所得的报应
  rationale: 希伯来文直译近于“这对他们”，结合 תַּחַת 所表达的报偿关系，以现代汉语明确呈现所宣告的惩罚结果。
- source_word: תַּחַת גְּאוֹנָם
  choice: 因自己的骄傲所得的报应
  rationale: תַּחַת 在此表示相应的报偿或代价；גָּאוֹן 在审判语境中指高傲、骄傲。
- source_word: חֵרְפוּ
  choice: 嘲讽
  rationale: 该动词表示带着轻蔑的辱骂或讥诮；“嘲讽”自然易懂，并保留敌意。
- source_word: וַיַּגְדִּלוּ עַל
  choice: 妄自尊大，凌驾于……之上
  rationale: 使役形态结合 עַל 表达抬高自己、对他人逞大或凌驾其上的意思；此译法保留自我高举和敌对压迫两层含义。
- source_word: עַם
  choice: 子民
  rationale: 与耶和华的名号连用时，指归属于他的群体；“子民”比一般的“人民”更自然地表达这种关系。
- source_word: יְהוָה צְבָאוֹת
  choice: 万军之耶和华
  rationale: 保留神的专名“耶和华”，并以现代中文圣经语域中清楚而庄重的“万军”表达 צְבָאוֹת。
theological_decisions:
- issue: 神圣名号 יְהוָה צְבָאוֹת 的译法
  choice: 万军之耶和华
  alternative: 雅威—万军之主；万军之主
  rationale: 原文直接使用四字神名并加 צְבָאוֹת。“万军之耶和华”既不把专名完全替换成头衔，也能自然传达统领天上与地上众军的称号。
- issue: וַיַּגְדִּילוּ עַל 所指的姿态
  choice: 妄自尊大，凌驾于他们之上
  alternative: 向他们夸大其词；向他们说狂妄的话
  rationale: 原文可涵盖自我高举、狂妄夸口以及敌对地逞强；正文保留其自高并针对神子民的核心张力，不限定为单纯言语行为。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“报应”明确表现审判作为骄傲行为的相应后果；后半句用“妄自尊大，凌驾于他们之上”呈现希伯来语的形象和方向性。
