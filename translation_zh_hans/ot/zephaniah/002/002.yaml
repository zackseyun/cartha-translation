  text: בְּ/טֶ֨רֶם֙ לֶ֣דֶת חֹ֔ק כְּ/מֹ֖ץ עָ֣בַר י֑וֹם בְּ/טֶ֣רֶם לֹא יָב֣וֹא עֲלֵי/כֶ֗ם חֲרוֹן֙ אַף יְהוָ֔ה בְּ/טֶ֨רֶם֙ לֹא יָב֣וֹא עֲלֵי/כֶ֔ם י֖וֹם אַף יְהוָֽה׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/002/002.yaml
  text: before the decree gives birth—before the day passes away like chaff—before the burning anger of Yahweh comes upon you[c][b][a], before the day of Yahweh’s anger comes upon you.
translation:
  language: zh_hans
  text: 在谕令生出以前[a]——在日子如糠秕般飞逝以前[b]——在耶和华的烈怒[c]临到你们以前，在耶和华发怒的日子临到你们以前。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“在谕令生产以前”或“在谕令生出以前”。也可理解为“在谕令生效以前”或“在判决执行以前”。原文使用生育的比喻，表达谕令所定之事出现或实现。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“在日子像糠秕一样过去以前”。原文十分紧缩，“日子”与“如糠秕般”的关系可有略微不同的理解。
    reason: alternative_reading
  - marker: c
    text: 原文在本节先说“耶和华的烈怒”，后说“耶和华发怒的日子”，两者彼此呼应。
    reason: cross_reference
lexical_decisions:
- source_word: בְּטֶרֶם
  choice: 在……以前
  rationale: 这是反复三次的时间标记；中文采用同一结构，保留先知警告的排比和紧迫感。
- source_word: לֶדֶת חֹק
  choice: 谕令生出结果
  rationale: לֶדֶת 是“生产、生出”，חֹק 在此指已经定下的谕令或判定。译文保留生产意象，并补出中文理解所需的“结果”，避免“谕令生产”造成主体不明。
- source_word: כְּמֹץ
  choice: 如糠秕般
  rationale: 保留原文轻飘、迅速消逝的农业比喻；“糠秕”符合现代中文圣经语体，也易于理解。
- source_word: עָבַר יוֹם
  choice: 日子……飞逝
  rationale: עָבַר 表示经过、消逝；结合糠秕意象译作“飞逝”，传达迅速被带走的诗意画面。
- source_word: חֲרוֹן אַף
  choice: 烈怒
  rationale: 这是表达怒火炽烈的希伯来语复合说法；“烈怒”自然凝练，并保留强烈程度。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文读者最熟悉的神名音译，不以“主”这一称号代替专名。
- source_word: יָבוֹא עֲלֵיכֶם
  choice: 临到你们
  rationale: 准确表达审判降临在对象身上的方向性，也是自然、庄重的现代中文措辞。
- source_word: יוֹם אַף יְהוָה
  choice: 耶和华发怒的日子
  rationale: 直接呈现属格关系，同时不擅自扩展为措辞并不完全相同的固定术语“耶和华的日子”。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 两者都是神名的音译；正文采用中文读者广泛熟悉的“耶和华”，明确保留专名而不改译为称号“主”。
- issue: חֹק לֶדֶת 的生产隐喻
  choice: 保留为“谕令生出结果”
  alternative: 谕令生效／判决得到执行
  rationale: 原文明用生产意象。正文保留这一先知性画面，不把它完全抽象化为法律术语；脚注说明直译和可能含义。
- issue: כְּמֹץ עָבַר יוֹם 的紧缩诗句
  choice: 理解为日子如糠秕般飞逝
  alternative: 糠秕般的日子过去
  rationale: 原文语序紧凑，糠秕比喻与“日子”的确切句法关系存在一定含混；正文采用最直接通顺的理解，脚注保留另一种表达可能。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。四次“在……以前”形成连续催促，其中前三次对应原文反复出现的 בְּטֶרֶם；保留“生产”和“糠秕”的诗歌意象，同时以脚注交代原文的紧缩与歧义。
