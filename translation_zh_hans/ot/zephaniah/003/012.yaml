  text: וְ/הִשְׁאַרְתִּ֣י בְ/קִרְבֵּ֔/ךְ עַ֥ם עָנִ֖י וָ/דָ֑ל וְ/חָס֖וּ בְּ/שֵׁ֥ם יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/003/012.yaml
  text: But I will leave in your midst a people humble and lowly[a], and they will take refuge in the name of Yahweh.
translation:
  language: zh_hans
  text: 但我必在你中间留下困苦贫寒的百姓[a]；他们必投靠耶和华的名。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“谦卑低微的百姓”，又或“贫穷困乏的百姓”。原文两个词既可强调受苦和贫穷的处境，也可强调谦卑、低微。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִשְׁאַרְתִּי
  choice: 但我必……留下
  rationale: 使役式表达使某些人存留、被留下；“但”按上下文体现与先前审判的转折，而原文连接词本身也可作“并且”。
- source_word: בְקִרְבֵּךְ
  choice: 在你中间
  rationale: 指在以阴性单数称呼的锡安或耶路撒冷之中，保留群体性称呼。
- source_word: עַם
  choice: 百姓
  rationale: 这里指留在城中的群体；“百姓”比政治意味较强的“国家”更贴切。
- source_word: עָנִי וָדָל
  choice: 困苦贫寒的
  rationale: 两个词可涵盖受苦、贫穷、卑微和弱小。正文选用自然且保留社会处境的表达，脚注说明也可能着重谦卑低微。
- source_word: וְחָסוּ
  choice: 他们必投靠
  rationale: חסה含寻求庇护、以某者为避难所的意象；“投靠”自然地保留倚赖和寻求保护之意。
- source_word: בְּשֵׁם
  choice: ……的名
  rationale: 表示倚靠上帝所启示的身份、品格和权能；与“投靠”连用符合现代汉语。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用简体中文圣经语境中对四字神名的通行音译，不以“主”这一称号替代专名。
theological_decisions:
- issue: עָנִי וָדָל对余民的描述
  choice: 困苦贫寒的
  alternative: 谦卑低微的；贫穷困乏的
  rationale: 原词既可指实际的受苦与贫穷，也可由此表达卑微、谦卑和依赖。正文不把意义只限于内在属灵品格，脚注保留另一侧重。
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 使用现代中文读者最熟悉的专名形式，保留其为神圣专名而非普通称号。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“困苦贫寒”保留希伯来词组的社会处境含义，并以脚注呈现谦卑低微的可能侧重；分号清楚连接余民的处境与他们投靠耶和华之名的行动。
