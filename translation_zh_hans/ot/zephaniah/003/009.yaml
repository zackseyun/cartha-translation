base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/003/009.yaml
  text: For then I will change the speech of the peoples to a pure speech[c][b][a], so that all of them may call on the name of Yahweh and serve him with one accord.
translation:
  language: zh_hans
  text: 因为那时，我必使万民的言语得以洁净[a]，好让他们都求告耶和华[b]的名，同心[c]事奉他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文按字面意象可译为“我必使万民的嘴唇成为纯洁”。“嘴唇”可指洁净的言语，也可能指更新后的纯洁语言。
    reason: lexical_alternative
  - marker: b
    text: “耶和华”译自希伯来文神名יהוה（YHWH）；也有人拟音为“雅威”。
    reason: alternative_reading
  - marker: c
    text: 希伯来文直译为“以一个肩膀”，形容众人同心事奉或并肩行动。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶהְפֹּךְ
  choice: 使……变为
  rationale: הפך有“转变、改变”之意。这里表达上帝使万民的言语进入纯洁的新状态，不宜译成带有毁灭意味的“倾覆”，也不额外解释为内心归信。
- source_word: עַמִּים
  choice: 万民
  rationale: 复数עַמִּים指众多族群。“万民”自然表达其复数和普世范围，又比现代政治意义较强的“各国”更贴近原文。
- source_word: שָׂפָה בְרוּרָה
  choice: 纯洁的言语
  rationale: שָׂפָה字面为“嘴唇”，可转喻言语或语言；בְרוּרָה表示纯净、洁净。译作“纯洁的言语”既通顺，又保留敬拜言语得到洁净的重点；字面和其他可能理解收入脚注。
- source_word: לִקְרֹא ... בְּשֵׁם יְהוָה
  choice: 求告耶和华的名
  rationale: קרא与“名”连用，在此指在敬拜中呼求、求告。采用汉语圣经语体中自然且含义明确的“求告……的名”。
- source_word: לְעָבְדוֹ
  choice: 事奉他
  rationale: עבד既可泛指服事，也可在宗教语境中指敬拜、事奉。这里的“事奉”保留了敬拜和忠诚服事两方面，不把含义缩窄为礼仪行为。
- source_word: שְׁכֶם אֶחָד
  choice: 齐心协力
  rationale: 原文直译“一个肩膀”，是共同承担、联合行动的形象。“齐心协力”在现代汉语中自然表达一致事奉；原文意象保留在脚注。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 耶和华
  alternative: 雅威（Yahweh）
  rationale: 原文直接使用四字神名יהוה。正文采用现代中文读者熟悉的专名“耶和华”，不以“主”替代；脚注说明其原文形式及另一常见拟音。
- issue: 所应许之转变的性质
  choice: 使万民的言语变为纯洁
  alternative: 赐给万民纯洁的嘴唇；使万民改用纯洁的语言
  rationale: 希伯来文既可侧重嘴唇或言语的洁净，也可能被理解为语言得到更新。正文不把它限定为恢复某一种历史语言，并借脚注保留原文的具体形象和语义幅度。
- issue: 万民合一事奉的表达
  choice: 齐心协力地事奉他
  alternative: 并肩事奉他；同心事奉他
  rationale: “一个肩膀”强调共同承担和一致行动。正文表达群体合一，却不把这种合一进一步解释为制度或组织上的统一。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“万民”“求告……的名”“事奉”保留必要的圣经语域，但整句结构现代自然。三个脚注标记均置于正文对应词语之后。
