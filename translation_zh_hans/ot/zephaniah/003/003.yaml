  yaml_path: translation/ot/zephaniah/003/003.yaml
  text: Her officials within her are roaring lions[a]; her judges are evening wolves that leave nothing for the morning.
translation:
  language: zh_hans
  text: 她中间的首领是咆哮的狮子；她的审判官是傍晚出没的狼，到了早晨什么也不剩。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“它们到早晨连骨头也不啃。”这句希伯来语习语的精确字面意义难以确定；它以狼的贪食图景表示吞噬得一无所剩。
    reason: 末句לֹא גָרְמוּ לַבֹּקֶר的动词与“骨头”或“啃咬”有关，但具体句法解释有争议；脚注保留较字面的可能译法，正文表达其清楚的语境含义。
lexical_decisions:
- source_word: שָׂרֶיהָ
  choice: 她城中的首领
  rationale: שַׂר可指首领、统治者或官长。“首领”既保留其掌权者的含义，也不限定为王室成员；结合בקרבה表达这些人就在城中。
- source_word: אֲרָיוֹת שֹׁאֲגִים
  choice: 咆哮的狮子
  rationale: 名词与主动分词共同描绘正在吼叫、具有掠食威胁的狮子；“咆哮的狮子”简洁而有力。
- source_word: שֹׁפְטֶיהָ
  choice: 她的审判官
  rationale: 该词直接指负责司法裁断的人。“审判官”比单说“法官”略具古代公共权力语境，同时仍为现代读者所理解。
- source_word: זְאֵבֵי עֶרֶב
  choice: 傍晚出没的豺狼
  rationale: 原文直译为“傍晚的豺狼”。加入“出没”使汉语自然，并保留猛兽在暮色中出来猎食的图景。
- source_word: לֹא גָרְמוּ לַבֹּקֶר
  choice: 连一根骨头也不留到早晨
  rationale: גרם与骨头、啃咬或咬碎有关；此处描绘豺狼吞噬净尽。“连一根骨头也不留”保留骨头意象，并清楚传达贪婪而彻底的掠夺。
theological_decisions: []
