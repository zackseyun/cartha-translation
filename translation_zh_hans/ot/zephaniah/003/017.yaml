base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/003/017.yaml
  text: Yahweh your God is in your midst[a], a mighty one who saves; he will rejoice over you with gladness; he will be quiet in his love; he will exult over you with singing.
translation:
  language: zh_hans
  text: 雅威——你的上帝——在你中间；他是大能者，必施行拯救。他必因你欢喜快乐；他必在他的爱中静默[a]；他必因你欢呼歌唱。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他必用他的爱使你安静。”另一种可能性较小的解释是：“他必在他的爱中使你更新。”
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 采用神圣四字名的常见现代汉语音译，保留其作为以色列之上帝专名的性质，不以称号替代。
- source_word: אֱלֹהַיִךְ
  choice: 你的上帝
  rationale: 第二人称阴性单数后缀承接锡安女子这一群体性称呼；汉语不标示第二人称的性别，“你的上帝”自然保留圣约关系。
- source_word: בְּקִרְבֵּךְ
  choice: 在你中间
  rationale: 表达雅威临在于锡安及其群体之中，比“在你里面”更符合此处群体性的空间意义。
- source_word: גִּבּוֹר
  choice: 大能者
  rationale: 保留该词作名词使用以及强健有力的含义，同时不把本句的军事色彩限定得过强。
- source_word: יוֹשִׁיעַ
  choice: 必施行拯救
  rationale: 未完成式在此指向雅威拯救的行动；这一译法保留动词意义，并与前面的“大能者”顺畅衔接。
- source_word: יָשִׂישׂ עָלַיִךְ בְּשִׂמְחָה
  choice: 他必因你欢喜快乐
  rationale: עַל在此表达以受词为欢喜的缘由或对象；以“因你”呈现，既自然又保留上帝以锡安为乐的含义。
- source_word: יַחֲרִישׁ בְּאַהֲבָתוֹ
  choice: 他必在爱中静默
  rationale: חרש最直接的意思是沉默、安静，原文没有明示受词；本译文不擅自补入“使你安静”，从而保留原文的凝练与张力。
- source_word: יָגִיל עָלַיִךְ בְּרִנָּה
  choice: 他必因你欢呼歌唱
  rationale: גיל表达雀跃欢腾，רנה可指欢呼、喜乐的喊声或歌唱；合译为“欢呼歌唱”可自然呈现末句高昂的庆贺色彩。
theological_decisions:
- issue: יַחֲרִישׁ בְּאַהֲבָתוֹ 的含义
  choice: 他必在爱中静默
  alternative: 他必用他的爱使你安静；另有较不可能的解释作：他必在爱中使你更新
  rationale: 马所拉文本的动词没有明示受词，最直接的句法是“他静默”。“使你安静”虽是历史悠久且富有意义的解释，却需要补出原文未写明的受词；“使你更新”则依赖另一种文本或释读传统。因此正文保留较直接且有张力的读法，其他读法列入脚注。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“雅威”保留神名；分号呈现希伯来诗句的平行层次。原文第二人称为阴性单数，所指是人格化的锡安／耶路撒冷；现代汉语正文无须另加性别标记。
