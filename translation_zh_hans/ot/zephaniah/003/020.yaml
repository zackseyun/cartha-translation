  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: בָּ/עֵ֤ת הַ/הִיא֙ אָבִ֣יא אֶתְ/כֶ֔ם וּ/בָ/עֵ֖ת קַבְּצִ֣/י אֶתְ/כֶ֑ם כִּֽי אֶתֵּ֨ן אֶתְ/כֶ֜ם לְ/שֵׁ֣ם וְ/לִ/תְהִלָּ֗ה בְּ/כֹל֙ עַמֵּ֣י הָ/אָ֔רֶץ בְּ/שׁוּבִ֧/י אֶת שְׁבוּתֵי/כֶ֛ם לְ/עֵינֵי/כֶ֖ם אָמַ֥ר יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/003/020.yaml
  text: At that time I will bring you in[a], and at that time I will gather you; for I will make you a name and a praise among all the peoples of the earth, when I restore your fortunes before your eyes, says Yahweh.
translation:
  language: zh_hans
  text: 到那时，我必带领你们归来；到那时，我必聚集你们。因为当我在你们眼前恢复你们的境况[a]时，我必使你们在地上万民中得名声、受赞誉；雅威说。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“带回你们被掳的人”，较直译可作“恢复你们被掳的境况”。这个希伯来语惯用语广泛指从流亡或灾祸中得到恢复。
    reason: 保留 שׁוּב שְׁבוּת 在整体境况恢复、被掳状态恢复和被掳者归回之间的语义幅度。
lexical_decisions:
- source_word: בָּעֵת הַהִיא
  choice: 到那时候
  rationale: 保留先知话语中的未来时间公式，也自然对应本节重复的时间表达。
- source_word: אָבִיא אֶתְכֶם
  choice: 我必领你们归来
  rationale: 使役形表示“带领、领来”；上下文是流亡者得恢复，因此“领你们归来”自然表达隐含的归回目的地，同时不增添具体地点。
- source_word: וּבָעֵת קַבְּצִי אֶתְכֶם
  choice: 到那时候，我必聚集你们
  rationale: 希伯来语不定式结构表达上帝聚集他们之时；中文重复“到那时候”可保留平行结构并使行文顺畅。
- source_word: כִּי
  choice: 因为
  rationale: 在这里引出前述应许的根据或说明。
- source_word: אֶתֵּן אֶתְכֶם לְשֵׁם וְלִתְהִלָּה
  choice: 我要使你们……得名声、受赞誉
  rationale: 原文直译近于“使你们成为名声和赞美”；采用自然中文表达其获得声誉和称赞之意，同时保留两个并列概念。
- source_word: בְּכֹל עַמֵּי הָאָרֶץ
  choice: 在地上万民中
  rationale: “万民”保留 עַמֵּי 的复数群体含义；此处 הָאָרֶץ 在普世性的复兴宣告中译作“地上”。
- source_word: בְּשׁוּבִי אֶת שְׁבוּתֵיכֶם
  choice: 我使你们……复兴
  rationale: שׁוּב שְׁבוּת 是指从流亡或灾祸中得到全面恢复的惯用表达；“复兴”在正文中简洁自然，脚注保留“被掳者归回”等可能的具体理解。
- source_word: לְעֵינֵיכֶם
  choice: 在你们眼前
  rationale: 保留原文鲜明的视觉习语，强调他们会亲眼见证恢复。
- source_word: אָמַר יְהוָה
  choice: 雅威如此说
  rationale: 按原文保留圣名，并用现代中文常见的先知宣告公式表达。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；音译“雅威”保留其作为立约圣名的性质，不以称号代替。
- issue: שׁוּב שְׁבוּת 的恢复范围
  choice: 使你们复兴
  alternative: 使你们被掳的人归回；扭转你们的境遇
  rationale: 该惯用语可泛指从流亡或灾难中恢复，也可能具体涉及被掳者归回。正文采用较宽广的表达，脚注呈现原文的字面及具体可能性，避免将含义收窄。
- issue: אָבִיא אֶתְכֶם 中隐含的方向
  choice: 领你们归来
  alternative: 领你们来；领你们进入
  rationale: 复兴与聚集的语境支持归回之意，但原文未明说目的地；“归来”表达语境方向而不指定地点。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“必”保留应许和先知宣告的确定语气；两次“到那时候”呈现原文的平行结构。正文仅设置一个脚注标记，并已在相应词语后标明。
