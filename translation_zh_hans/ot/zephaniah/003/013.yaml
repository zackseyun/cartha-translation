  text: שְׁאֵרִ֨ית יִשְׂרָאֵ֜ל לֹֽא יַעֲשׂ֤וּ עַוְלָה֙ וְ/לֹא יְדַבְּר֣וּ כָזָ֔ב וְ/לֹֽא יִמָּצֵ֥א בְּ/פִי/הֶ֖ם לְשׁ֣וֹן תַּרְמִ֑ית כִּֽי הֵ֛מָּה יִרְע֥וּ וְ/רָבְצ֖וּ וְ/אֵ֥ין מַחֲרִֽיד־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/003/013.yaml
  text: The remnant of Israel will do no wrong and speak no lies[a], and no deceitful tongue will be found in their mouth; for they will graze and lie down[b], with no one to make them afraid.
translation:
  language: zh_hans
  text: 以色列的余民必不行不义，也不说谎话；他们口中也必没有诡诈的言语[a]。因为他们必吃草、躺卧[b]，无人惊吓他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译作“诡诈的舌头”；这里指诡诈的言语。
    reason: lexical_alternative
  - marker: b
    text: 这里采用牧羊的画面：“吃草、躺卧”描写羊群安然生活。
    reason: cultural_note
lexical_decisions:
- source_word: שְׁאֵרִית יִשְׂרָאֵל
  choice: 以色列的余民
  rationale: “余民”准确表达灾后或审判后存留下来的一群人，也保留先知文学中的神学意涵，而不额外解释其身份。
- source_word: יַעֲשׂוּ עַוְלָה
  choice: 必不行不义
  rationale: עַוְלָה涵盖不义、邪恶和不公；“行不义”既贴近原文，也保留其较宽的道德含义。
- source_word: יְדַבְּרוּ כָזָב
  choice: 也不说谎话
  rationale: כָזָב指虚假或谎言；“说谎话”是自然、直接的现代汉语。
- source_word: יִמָּצֵא בְּפִיהֶם
  choice: 他们口中必找不到
  rationale: 保留原文“在口中被找到”的表达结构，同时用自然汉语呈现集体性的单数意象。
- source_word: לְשׁוֹן תַּרְמִית
  choice: 诡诈的舌头
  rationale: 直译具体的“舌头”意象，并传达欺骗、奸诈言语之意；脚注另列较抽象的自然表达。
- source_word: כִּי
  choice: 因为
  rationale: 此处连接前述描述与随后关于安稳生活的说明；“因为”保留原文的解释性关系，不把逻辑关系改写得更强。
- source_word: יִרְעוּ
  choice: 必吃草
  rationale: 该动词描写牲畜放牧吃草；此译保留羊群的田园意象，并与下文“躺卧”呼应。
- source_word: וְרָבְצוּ
  choice: 躺卧
  rationale: רבץ常指牲畜伏卧；“躺卧”保留具体画面，没有将其抽象化为“安居”或“休息”。
- source_word: אֵין מַחֲרִיד
  choice: 无人惊吓他们
  rationale: מַחֲרִיד指使人或牲畜害怕者；此译简洁保留施事者不复存在的含义。
theological_decisions:
- issue: 末句的牧养意象
  choice: 保留“吃草、躺卧”的羊群画面
  alternative: 译为“得饱足、安然歇息”或“安然居住”
  rationale: 原文连续使用牲畜吃草和伏卧的具体词语，借羊群安歇表达平安。保留意象可维持先知话语的质感，也不增添原文未明说的教义解释。
- issue: “余民”的术语选择
  choice: 将שְׁאֵרִית译为“余民”
  alternative: 译为“剩下的人”或“幸存者”
  rationale: “余民”在中文圣经语境中清楚而凝练，能表达以色列中存留下来的群体；它源于原词本身，没有进一步界定其构成或救恩身份。
- issue: 三个否定分句的关系
  choice: 分别保留“不行不义”“不说谎话”“口中找不到诡诈的舌头”
  alternative: 合并为概括性的“他们不再作恶说谎”
  rationale: 原文用三个平行否定句逐层描写行为与言语。分别翻译可避免把“谎话”与“诡诈的舌头”视为完全相同而删去其一。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“必不……必……”呈现先知性将来陈述；保留“诡诈的舌头”和“吃草、躺卧”等具体希伯来意象，并以脚注帮助普通读者理解。
