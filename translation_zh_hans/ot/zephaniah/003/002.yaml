base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/003/002.yaml
  text: She did not obey the voice[a]; she did not accept correction. She did not trust in Yahweh[d][c][b]; she did not draw near to her God.
translation:
  language: zh_hans
  text: 她不听从那声音[a]，不接受管教[b]；她不信靠耶和华[c]，也不亲近她的上帝[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“没有听那声音”或“没有留心听那声音”。希伯来语这一表达常含有听从、服从的意思。
    reason: lexical_alternative
  - marker: b
    text: 或译“训诲”“责备”。原词可指使人改正的管教、纠正或教导。
    reason: lexical_alternative
  - marker: c
    text: “耶和华”原文为יהוה（YHWH），也常音译为“雅威”。
    reason: source_term
  - marker: d
    text: 或译“走近她的上帝”。“亲近”可能同时含有关系上归向和前来敬拜的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמְעָה בְּקוֹל
  choice: 听从那声音
  rationale: שׁמע בְּקוֹל不只是听见，通常也包含听命、服从之意。“听从”在现代汉语中自然地表达这种带有顺服意味的聆听，同时保留原文未明说声音属于谁的含蓄。
- source_word: קוֹל
  choice: 那声音
  rationale: קוֹל可指声音、呼声；此处带有权威性的个人声音。“那声音”既贴近原文字面，也不擅自补出说话者。
- source_word: לָקְחָה מוּסָר
  choice: 接受管教
  rationale: 该搭配指领受或接受使人改正的训诲。“接受管教”兼顾纪律、纠正和教导的语义，并符合先知责备的语境。
- source_word: בַּיהוָה ... בָטָחָה
  choice: 信靠耶和华
  rationale: בטח表示信赖、倚靠，ב标示信靠的对象。“信靠耶和华”简洁自然，也保留关系与盟约层面的意味。
- source_word: אֱלֹהֶיהָ
  choice: 她的上帝
  rationale: אֱלֹהִים虽为复数形态，此处有单数所属关系，并与耶和华平行，按希伯来语惯用法指独一的上帝。
- source_word: קָרֵבָה אֶל
  choice: 亲近
  rationale: קרב אל可表示靠近、走近；用于上帝时可能兼有关系性与敬拜性的意味。“亲近”能自然保留这两层可能性。
theological_decisions:
- issue: 阴性单数主语的所指
  choice: 用“她”，不在本节补出所指
  alternative: 译作“耶路撒冷”或“这城”
  rationale: 原文各动词均为阴性单数，承接上文对城的拟人化称呼。本节保留“她”，既反映语法和文学表达，也不加入原文在本节没有明说的名词。
- issue: 神名יהוה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。正文采用现代中文圣经读者较熟悉的“耶和华”，脚注交代其希伯来文形式及另一种音译，以保留源语信息而不将某种重构读音绝对化。
- issue: “亲近上帝”的含义范围
  choice: 保留关系性与敬拜性兼有的表达
  alternative: 明确译为“到她的上帝面前敬拜”或仅译“走近”
  rationale: 原文קרב没有明确限定为礼仪行动，也不只是空间移动；“亲近”避免过早消解这种张力。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。四个否定分句保持原文的平行与递进；用分号区分前两项拒绝听从与受教、后两项拒绝信靠与亲近。避免古奥表达，也不补明“声音”的发出者。
