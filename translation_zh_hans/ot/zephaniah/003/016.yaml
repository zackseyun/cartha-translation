  text: בַּ/יּ֣וֹם הַ/ה֔וּא יֵאָמֵ֥ר לִ/ירֽוּשָׁלִַ֖ם אַל תִּירָ֑אִי צִיּ֖וֹן אַל יִרְפּ֥וּ יָדָֽיִ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/003/016.yaml
  text: On that day it will be said to Jerusalem[a], “Do not fear”; to Zion, “Do not let your hands grow weak.”
translation:
  language: zh_hans
  text: 在那日，必有人对耶路撒冷说：“不要惧怕！”又对锡安说：“不要让你的双手发软[a]！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“不要让你的双手垂下”或“不要让你的双手无力”。这个希伯来语惯用表达可指失去力量、决心或勇气。
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: 到那日
  rationale: 这是先知书中常见的时间表达；“到那日”自然庄重，也保留了指向将来特定时刻的意味。
- source_word: יֵאָמֵר
  choice: 必有话……说
  rationale: 尼法勒未完成式在此为无人称被动。此译不补出说话者，同时比生硬的“必被说”更符合现代汉语。
- source_word: לִירוּשָׁלַם
  choice: 对耶路撒冷
  rationale: 介词 ל 在这里标明言语的对象，直译为“对耶路撒冷”。
- source_word: אַל תִּירָאִי
  choice: 不要惧怕
  rationale: 否定式命令，指向阴性单数受话者；“不要惧怕”简洁、自然，并保留其劝勉力度。
- source_word: צִיּוֹן
  choice: 又对锡安说
  rationale: 原文在“锡安”前没有介词，但句法上可视为继续直接称呼；补出“又对……说”使汉语并列关系清楚，同时把耶路撒冷与锡安作为同一受话城市的两个称谓来呈现。
- source_word: אַל יִרְפּוּ יָדָיִךְ
  choice: 不要让你的双手发软
  rationale: רפה 与“手”连用，描写双手失去力量，也可暗指丧失勇气或决心。“双手发软”既保留身体意象，又是自然的现代汉语。
theological_decisions:
- issue: 耶路撒冷／锡安被拟人化为阴性单数受话者
  choice: 保留对城市的直接称呼，并使用单数“你”
  alternative: 扩展为“耶路撒冷／锡安的居民”
  rationale: 希伯来文直接称呼耶路撒冷和锡安，阴性单数动词及代词与拟人化城市相应。保留这一诗性形象，避免加入原文未明说的“居民”。
- issue: “双手发软”的意义范围
  choice: 正文保留手失去力量的形象，不直接改写为“不要灰心”
  alternative: 意译为“不要灰心／不要丧胆”
  rationale: 该惯用语包含失去力量、勇气或决心的意味，但原文明确保留“手”的意象；正文不把其含义限缩为单一心理状态。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“必有话……说”保留无人称被动而避免欧化表达；“双手发软”保留原文意象及其惯用含义。
