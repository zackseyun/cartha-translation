  text: Sing for joy[a], daughter Zion; shout aloud, Israel! Rejoice and exult with all your heart, daughter Jerusalem!
translation:
  language: zh_hans
  text: 锡安女子[a]啊，要欢呼歌唱；以色列啊，要高声欢呼！耶路撒冷女子啊，要全心欢喜，欢欣雀跃！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
