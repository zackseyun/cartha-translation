    reason: lexical_alternative
lexical_decisions:
- source_word: רָנִּי
  choice: 欢呼歌唱
  rationale: 该阴性单数命令式兼有出声歌唱和喜乐欢呼之意；“欢呼歌唱”自然地保留这两层含义。
- source_word: בַּת צִיּוֹן
  choice: 锡安女子
  rationale: 保留希伯来文将锡安拟人化为女子的先知性表达，同时比直译“锡安的女儿”更不易被理解为某个具体人物。
- source_word: הָרִיעוּ
  choice: 高声欢呼
  rationale: 该命令式指响亮、公开而喜庆的呼喊；“高声欢呼”体现其音量与欢乐色彩。
- source_word: יִשְׂרָאֵל
  choice: 以色列
  rationale: 采用现代中文通行专名；此处作呼语。
- source_word: שִׂמְחִי
  choice: 欢喜
  rationale: 准确表达喜乐，并保持庄重而易懂的现代汉语语体。
- source_word: וְעָלְזִי
  choice: 欢欣雀跃
  rationale: 该词表达强烈、洋溢的喜悦；“欢欣雀跃”与前面的“欢喜”有所区分，保留递进和诗意。
- source_word: בְּכָל לֵב
  choice: 全心
  rationale: 简洁自然地表达“以全部的心”，即毫无保留、由衷地喜乐。
- source_word: בַּת יְרוּשָׁלִָם
  choice: 耶路撒冷女子
  rationale: 与“锡安女子”保持平行，保留城市被拟人化并直接受呼唤的表达。
