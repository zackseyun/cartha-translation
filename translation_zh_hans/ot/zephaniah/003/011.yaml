language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: בַּ/יּ֣וֹם הַ/ה֗וּא לֹ֤א תֵב֨וֹשִׁי֙ מִ/כֹּ֣ל עֲלִילֹתַ֔יִ/ךְ אֲשֶׁ֥ר פָּשַׁ֖עַתְּ בִּ֑/י כִּי אָ֣ז אָסִ֣יר מִ/קִּרְבֵּ֗/ךְ עַלִּיזֵי֙ גַּאֲוָתֵ֔/ךְ וְ/לֹֽא תוֹסִ֧פִי לְ/גָבְהָ֛ה ע֖וֹד בְּ/הַ֥ר קָדְשִֽׁ/י־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/003/011.yaml
  text: On that day you will not be put to shame because of all your deeds by which you rebelled against me[a], for then I will remove from your midst those who exult in your pride[b], and you will no longer be haughty on my holy mountain.
translation:
  language: zh_hans
  text: 到那日，你必不因你所行的一切悖逆我的事而蒙羞[a]；因为那时，我必从你中间除掉你那些骄傲自得、欢腾的人[b]，你也必不再在我的圣山上高傲自大。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“感到羞愧”。希伯来语动词既可表示内心羞愧，也可表示蒙羞、受辱的处境。
    reason: lexical_alternative
  - marker: b
    text: 或译：“那些因你的骄傲而欢腾的人”。原文短语的构词关系可指以高傲、欢腾为特征的人，也可指以“你”的骄傲为乐的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵבֹושִׁי
  choice: 蒙羞
  rationale: בושׁ可指羞愧或受辱、蒙羞。“蒙羞”自然地表达羞耻这一处境和结果，同时不把含义缩减为主观的尴尬感。
- source_word: מִכֹּל עֲלִילֹתַיִךְ
  choice: 因你一切……的行为
  rationale: בושׁ后的מִן在这里表示羞耻的缘由；עֲלִילָה泛指行为、作为，并由后面的“悖逆”赋予明确的道德色彩。
- source_word: פָּשַׁעַתְּ בִּי
  choice: 悖逆我
  rationale: פשע突出反叛和破坏关系，不只是泛指犯罪；“悖逆我”保留了其关系性和盟约语境中的力度。
- source_word: אָסִיר
  choice: 除掉
  rationale: 该使役形式表示使之离开，即移除；用于从群体中清除某些人时，“除掉”简洁自然。
- source_word: מִקִּרְבֵּךְ
  choice: 从你中间
  rationale: 保留群体或城中间的空间与共同体含义，避免把拟人化的锡安理解成单个个体的内心。
- source_word: עַלִּיזֵי גַּאֲוָתֵךְ
  choice: 那些因你的骄傲而欢腾的人
  rationale: עַלִּיזֵי指欢腾、得意的人；גַּאֲוָה在本句谴责高傲的语境中取负面义。“因你的骄傲而欢腾”保留构词关系及阴性单数后缀，同时用脚注提示另一种顺畅理解。
- source_word: וְלֹא תוֹסִפִי לְגָבְהָה עוֹד
  choice: 你也必不再……高傲自大
  rationale: “不再增添/继续做”这一希伯来语结构自然译作“不再”；גבה在此不是身体位置高，而是态度骄傲。
- source_word: בְּהַר קָדְשִׁי
  choice: 在我的圣山上
  rationale: 指耶和华的圣山锡安；“在……山上”符合现代汉语的地点表达，并保留原文意象。
theological_decisions:
- issue: 开头的应许是说百姓不再有羞耻感，还是说他们不再因从前的悖逆处于蒙羞受辱的境地。
  choice: 译作“不因……而蒙羞”，表明过去的悖逆真实存在，却因上帝随后的洁净行动而不再继续承受与之相连的羞辱。
  alternative: 译作“不因……感到羞愧”，侧重主观感受。
  rationale: 经文并未否认那些行为有罪；“因为那时，我必……除掉”说明蒙羞状态的终止与上帝洁净群体的行动相连。这样的译法同时保留罪责与复兴之间的张力。
- issue: 第二人称阴性单数所指为何。
  choice: 保留“你”的拟人化称呼，让上下文呈现锡安或耶路撒冷作为一个共同体被直接讲话。
  alternative: 直接明说“锡安”或改为复数“你们”。
  rationale: 原文持续使用阴性单数形式，直译为“你”既保留拟人化修辞，也不越过本节替读者限定其所指。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“悖逆”“蒙羞”“圣山”保留经文的道德与礼仪语域；句式适合公开诵读。主语“你”保持原文对锡安共同体的阴性单数拟人化称呼。
