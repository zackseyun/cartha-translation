source:
  edition: WLC
  text: הִכְרַ֣תִּי גוֹיִ֗ם נָשַׁ֨מּוּ֙ פִּנּוֹתָ֔/ם הֶחֱרַ֥בְתִּי חֽוּצוֹתָ֖/ם מִ/בְּלִ֣י עוֹבֵ֑ר נִצְדּ֧וּ עָרֵי/הֶ֛ם מִ/בְּלִי אִ֖ישׁ מֵ/אֵ֥ין יוֹשֵֽׁב־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/003/006.yaml
  text: I have cut off nations[a]; their corner towers are laid waste. I have made their streets desolate, with no one passing through. Their cities are devastated, without a man[c][b], with no inhabitant.
translation:
  language: zh_hans
  text: '“我剪除了列国；

    他们的角楼[a]荒废了。

    我使他们的街道[b]荒凉，

    无人经过；

    他们的城邑尽都毁坏，

    空无一人[c]，

    也没有居民。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “角楼”原文直译为“角落”；也可能指城墙转角处的防御工事。
    reason: lexical_alternative
  - marker: b
    text: “街道”也可译作“广场”或“公共空地”。
    reason: lexical_alternative
  - marker: c
    text: 原文直译为“没有一个男人”；这里是指完全没有人烟。
    reason: lexical_alternative
lexical_decisions:
- source_word: הִכְרַתִּי
  choice: 我剪除了
  rationale: 使役形完成式表示耶和华施行剪除、毁灭；“剪除”保留希伯来语的具体意象，也符合先知审判宣告的语体。
- source_word: גוֹיִם
  choice: 列国
  rationale: 指受审判的各民族或政治实体；“列国”在现代中文圣经语体中简洁庄重。
- source_word: נָשַׁמּוּ
  choice: 荒废了
  rationale: 该词表示变得荒凉、遭到毁坏；这里着重描述毁灭后的状态。
- source_word: פִּנּוֹתָם
  choice: 他们的角楼
  rationale: 字面为“他们的角落”，在城邑遭毁的语境中很可能指城墙转角处的防御建筑；正文采用自然且符合语境的“角楼”，脚注保留字面及其他可能。
- source_word: הֶחֱרַבְתִּי
  choice: 我使……荒凉
  rationale: 使役形表示使某处荒芜、废弃；与街道无人经过的结果相配。
- source_word: חוּצוֹתָם
  choice: 他们的街道
  rationale: 复数形式可指城中的街道、广场或公共空地；“街道”最符合下文“无人经过”。
- source_word: מִבְּלִי עוֹבֵר
  choice: 无人经过
  rationale: 简明保留分词所表达的经过、通行之意，并突出彻底荒弃。
- source_word: נִצְדּוּ
  choice: 尽都毁坏
  rationale: 这是较罕见且含义不完全确定的动词；上下文明确指城邑遭破坏，译文避免对具体毁坏方式作过度限定。
- source_word: עָרֵיהֶם
  choice: 他们的城邑
  rationale: עִיר 可指城市或城镇；“城邑”能概括两者，并与先知书语体协调。
- source_word: מִבְּלִי אִישׁ
  choice: 空无一人
  rationale: 希伯来语字面是“没有一个男人”，但在此为彻底无人烟的固定式表达；现代汉语用“空无一人”自然传达其语用意义，字面形式在脚注说明。
- source_word: מֵאֵין יוֹשֵׁב
  choice: 也没有居民
  rationale: 直陈无人居住，强化上一句所描绘的彻底荒无人烟。
theological_decisions:
- issue: אִישׁ 的阳性单数形式与全城无人这一语境意义
  choice: 正文译作“空无一人”，脚注说明字面为“没有一个男人”
  alternative: 没有一个男人
  rationale: 该短语与随后“没有居民”构成彻底荒无人烟的平行表达。现代汉语若正文译为“男人”，容易误导读者以为妇女仍在；脚注则保留原文的阳性单数形式，既不掩盖形式，也不曲解语境。
translation_notes:
  register: 采用现代、庄重而清楚的先知宣告语体；以短行保留希伯来诗体的平行结构和层层加强的荒凉景象。正文避免生硬直译，同时借脚注保留“角落／角楼”、“街道／广场”及 אִישׁ 的形式与语境张力。
