id: ZEP.3.19
reference: Zephaniah 3:19
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: הִנְ/נִ֥י עֹשֶׂ֛ה אֶת כָּל מְעַנַּ֖יִ/ךְ בָּ/עֵ֣ת הַ/הִ֑יא וְ/הוֹשַׁעְתִּ֣י אֶת הַ/צֹּלֵעָ֗ה וְ/הַ/נִּדָּחָה֙ אֲקַבֵּ֔ץ וְ/שַׂמְתִּי/ם֙ לִ/תְהִלָּ֣ה וּ/לְ/שֵׁ֔ם בְּ/כָל הָ/אָ֖רֶץ בָּשְׁתָּֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/003/019.yaml
  text: Behold[a], at that time I will deal with all your oppressors, and I will save the lame and gather the outcast[d][c][b], and I will make them a praise and a name in every land where they were put to shame.
translation:
  language: zh_hans
  text: 看哪[a]，到那时，我必对付所有欺压你的人；我必拯救瘸腿的，聚集被赶散的[b]。我要使他们在曾受羞辱的各地[c][d]得着称赞和名声。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “看哪”引出庄严的宣告，也可译作“你看”。
    reason: lexical_alternative
  - marker: b
    text: “瘸腿的”和“被赶散的”在希伯来文中都是阴性单数形式，可能把受苦的群体人格化；也可较直译为“那瘸腿的”和“那被赶走的”。
    reason: lexical_alternative
  - marker: c
    text: “各地”也可译作“全地”或“全世界”。
    reason: lexical_alternative
  - marker: d
    text: 本节末尾的希伯来文较难理解，较直译可作“在他们的羞耻中”；正文依上下文译作“在曾受羞辱的各地”。
    reason: textual_difficulty
lexical_decisions:
- source_word: הִנְנִי
  choice: 看哪
  rationale: 保留先知宣告中庄严、引人注意的语气，又符合现代中文圣经文体。
- source_word: עֹשֶׂה אֶת כָּל מְעַנַּיִךְ
  choice: 我必对付所有欺压你的人
  rationale: עֹשֶׂה 字面为“做”，在此与敌对者作宾语，表达上帝将采取决定性行动；“对付”保留行动的审判意味，却不额外限定具体方式。
- source_word: בָּעֵת הַהִיא
  choice: 到那时
  rationale: 自然表达该先知性时间短语，且不误作另一常见公式“到那日”。
- source_word: וְהוֹשַׁעְתִּי
  choice: 我必拯救
  rationale: 准确传达 ישׁע 的拯救、解救含义，并保留其神学分量。
- source_word: הַצֹּלֵעָה
  choice: 瘸腿的
  rationale: 保留“行走跛瘸者”的具体形象；原文阴性单数可能集体指受苦群体，中文形式可兼容个体化与集体化理解。
- source_word: הַנִּדָּחָה אֲקַבֵּץ
  choice: 聚集被赶散的
  rationale: נדח 强调遭驱赶、离散，קבץ 表示重新聚集；此译保留流散与复兴的图景。
- source_word: וְשַׂמְתִּים לִתְהִלָּה וּלְשֵׁם
  choice: 我要使他们……得着称赞和名声
  rationale: 将“使他们成为称赞和名”的希伯来表达转成自然中文，同时分别保留 תְהִלָּה 与 שֵׁם 的语义。
- source_word: בְּכָל הָאָרֶץ
  choice: 各地
  rationale: הָאָרֶץ 可指“全地、全世界”或不同地域；上下文涉及被赶散者，因此正文采用自然的地域性表达，并以脚注保留另一可能。
- source_word: בָּשְׁתָּם
  choice: 曾受羞辱的
  rationale: 末语句法和意义较难；正文依上下文理解为他们先前蒙羞之处，不把困难的字面结构直接强加给中文。
theological_decisions:
- issue: 瘸腿者与被赶散者是否指个体还是受苦群体
  choice: 瘸腿的……被赶散的
  alternative: 那瘸腿的女子……那被赶走的女子
  rationale: 原文用阴性单数形式，可能将锡安或受苦群体人格化，也可能作集合性称呼。正文保留具体形象和集合性开放空间，不明确限定为某一解释。
- issue: 复兴的地域范围
  choice: 在曾受羞辱的各地
  alternative: 在全地／全世界，在他们的羞耻中
  rationale: הָאָרֶץ 与末尾 בָּשְׁתָּם 均有解释空间。正文按流散—聚集的语境呈现为各地的名誉翻转，脚注保留更字面的全球性和“在他们的羞耻中”读法。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“看哪”“我必”等保留先知性宣告的力度；避免生硬照搬“成为称赞和名字”，改用普通读者易懂的“得着称赞和名声”。所有实质性的原文歧义均在脚注中保留。
