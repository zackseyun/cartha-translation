  text: נוּגֵ֧י מִ/מּוֹעֵ֛ד אָסַ֖פְתִּי מִמֵּ֣/ךְ הָי֑וּ מַשְׂאֵ֥ת עָלֶ֖י/הָ חֶרְפָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/003/018.yaml
  text: I have gathered those grieving over the appointed festival from you[a]; they were a reproach upon her[c][b], a burden.
translation:
  language: zh_hans
  text: 那些因不能参加节期而悲伤的人，我要从你那里聚集起来[a][b]；他们曾是她[c]身上的羞辱和重担。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“那些因节期而受苦的人”或“那些从节期集会中被除去的人”。希伯来文含义困难，可能指因不能参加节期而悲伤的人，也可能指被排除在节期集会之外的人。
    reason: alternative_reading
  - marker: b
    text: “我要……聚集起来”也可译作“我聚集了”或“我已经聚集起来”。原文动词形式上是完成式，但在先知语境中也可表达确定的将来。
    reason: lexical_alternative
  - marker: c
    text: “她”很可能指锡安或耶路撒冷。
    reason: cross_reference
lexical_decisions:
- source_word: נוּגֵי
  choice: 悲伤的人
  rationale: 该词指处于悲伤或受苦状态的人；译作“悲伤的人”保留其人物指向和情感色彩，不把原因直接写入词义。
- source_word: מִמּוֹעֵד
  choice: 因不能参加节期
  rationale: מוֹעֵד在此处很可能指规定的节期或节期集会；介词结构含义困难，正文采用因失去节期聚会而悲伤的理解，并以脚注保留其他可能。
- source_word: אָסַפְתִּי
  choice: 我要……聚集起来
  rationale: 形式上是第一人称单数完成式，但在先知性的复兴语境中可表达确定的将来行动；中文用将来表达更自然，脚注注明过去或完成意义的可能。
- source_word: מִמֵּךְ
  choice: 从你那里
  rationale: 直接体现介词和阴性第二人称单数后缀；“你”在上下文中应指锡安或耶路撒冷。
- source_word: הָיוּ
  choice: 他们曾
  rationale: 保留系词的过去时态含义，并与后面的述语自然衔接。
- source_word: מַשְׂאֵת
  choice: 重担
  rationale: 此处较适合按负荷、重担理解，而非“默示”；这一译法保留社会羞辱所造成的沉重含义。
- source_word: עָלֶיהָ
  choice: 使她蒙受
  rationale: 原文直译为“在她身上”；中文结合“羞辱”译作“使她蒙受”，仍保留阴性所指，并在脚注说明其很可能指锡安或耶路撒冷。
- source_word: חֶרְפָּה
  choice: 羞辱
  rationale: 该词可指责辱、耻辱或公开的羞耻；“羞辱”在现代汉语中兼具社会贬抑和受辱意味。
theological_decisions:
- issue: 本节压缩句法及人物关系的歧义
  choice: 理解为耶和华将因不能参加节期而悲伤的人从锡安那里聚集起来；这些人曾使锡安蒙羞并成为她的重担。
  alternative: 也可理解为从锡安除去那些被排除在节期集会之外之人所牵连的羞辱；末句也可能表示“她所受的羞辱成为他们的重担”。
  rationale: 希伯来文句法异常凝练，所指和各名词之间的关系并不完全明确。正文选择能连贯体现复兴主题的读法，同时用脚注保存介词、时态和所指的真实歧义，不以教义性解释强行消除张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“节期”符合圣经礼仪语境，又为普通读者所能理解。因原文极为困难，正文适度补出“不能参加”以形成可读句子，并借脚注明确这属于解释性选择。所有脚注标记均置于相关正文位置。
