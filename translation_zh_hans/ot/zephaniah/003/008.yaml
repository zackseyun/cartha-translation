  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: לָ/כֵ֤ן חַכּוּ לִ/י֙ נְאֻם יְהוָ֔ה לְ/י֖וֹם קוּמִ֣/י לְ/עַ֑ד כִּ֣י מִשְׁפָּטִ/י֩ לֶ/אֱסֹ֨ף גּוֹיִ֜ם לְ/קָבְצִ֣/י מַמְלָכ֗וֹת לִ/שְׁפֹּ֨ךְ עֲלֵי/הֶ֤ם זַעְמִ/י֙ כֹּ֚ל חֲר֣וֹן אַפִּ֔/י כִּ֚י בְּ/אֵ֣שׁ קִנְאָתִ֔/י תֵּאָכֵ֖ל כָּל הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/003/008.yaml
  text: Therefore wait for me[a], declares Yahweh, for the day when I rise up for plunder; for my judgment is to gather nations, to assemble kingdoms, to pour out on them my indignation, all my burning anger[c][b]; for in the fire of my jealousy all the earth will be consumed.
translation:
  language: zh_hans
  text: 所以，你们要等候我——雅威宣告——直到我起来掠取之日[a]。因为我的判决是：招聚列国，集合万邦，把我的愤怒，就是我所有炽烈的怒气，倾倒在它们身上。全地[c]都必被我忌邪的火焰[b]吞灭。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “掠取”所译的希伯来语含义不确定，也可理解为“作证”或“见证”。
    reason: alternative_reading
  - marker: b
    text: “忌邪”也可译作“热忱”。
    reason: lexical_alternative
  - marker: c
    text: “全地”也可译作“全境”；上下文提到列国和万邦，因此正文采用范围较广的表达。
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: 所以
  rationale: 承接上文并引出结论，符合现代汉语先知宣告的语气。
- source_word: חַכּוּ לִי
  choice: 你们要等候我
  rationale: 保留复数命令和以雅威为等候对象的关系含义。
- source_word: נְאֻם יְהוָה
  choice: 雅威宣告
  rationale: 以庄重自然的先知公式表达，并音译神名。
- source_word: לְיוֹם קוּמִי
  choice: 等到我起来……的日子
  rationale: 明确表达所等候的未来时点，同时保留“起来”的行动意象。
- source_word: לְעַד
  choice: 夺取猎物
  rationale: 此处希伯来词义有争议；结合列国受审和烈怒倾倒的语境，正文采用“猎物／掠物”义，但以脚注保留“作证”的司法性理解。
- source_word: מִשְׁפָּטִי
  choice: 我已经判定
  rationale: 此处表示雅威所作的司法决定；汉语用动词式表达，更自然地统领后面的三个不定式行动。
- source_word: לֶאֱסֹף גּוֹיִם / לְקָבְצִי מַמְלָכוֹת
  choice: 招聚列国，集合万邦
  rationale: 保留近义平行结构，并避免机械重复；“万邦”在此指诸王国。
- source_word: לִשְׁפֹּךְ עֲלֵיהֶם זַעְמִי
  choice: 把我的愤怒……倾倒在它们身上
  rationale: 保留“倾倒”的原文隐喻；代词按“列国／王国”处理。
- source_word: כֹּל חֲרוֹן אַפִּי
  choice: 我全部的烈怒
  rationale: 表达原文怒气炽烈及完整倾出的强化含义。
- source_word: בְּאֵשׁ קִנְאָתִי
  choice: 我忌邪的烈火
  rationale: קִנְאָה兼有忌邪与热忱之意；在神施行审判的语境中，“忌邪”较能保留关系排他性，并保留火的意象。
- source_word: כָּל הָאָרֶץ
  choice: 全地
  rationale: 保留 אֶרֶץ 可指“大地”或“土地”的词义幅度；列国与万邦的上下文倾向较广范围。
- source_word: תֵּאָכֵל
  choice: 吞灭
  rationale: 保留火将对象吞吃、烧尽的强烈拟人意象。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华／主
  rationale: 采用较直接反映四字神名的现代汉语音译，不以称号替代专名。
- issue: לְעַד 的含义
  choice: 夺取猎物
  alternative: 起来作证
  rationale: 该短语意义困难；“猎物／掠物”可与接下来对列国施行毁灭性审判相合，而“作证”则与司法语境相合。正文选前者，脚注保留后者，不消除原文歧义。
- issue: קִנְאָה 的神学语义
  choice: 忌邪
  alternative: 热忱
  rationale: “忌邪”保留神对关系忠贞与排他性的要求；“热忱”也是该词可有的含义，故列入脚注。
- issue: כָּל הָאָרֶץ 的范围
  choice: 全地
  alternative: 全世界／全境
  rationale: 希伯来词既可指大地，也可指特定土地；上下文提到列国和万邦，较支持广义，但译文与脚注保留词义张力。
translation_notes:
  register: 采用现代、庄重而可朗读的先知性汉语。破折号标出“雅威宣告”的插入语；第二句以“我已经判定”自然统领连续行动。正文中的脚注标记均紧随对应短语：[a]用于争议词 לְעַד，[b]用于“忌邪”，[c]用于“全地”。
