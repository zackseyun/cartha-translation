base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/003/004.yaml
  text: Her prophets are reckless[a], treacherous men; her priests have profaned the holy[b]; they have done violence to the law.
translation:
  language: zh_hans
  text: 她的先知轻浮鲁莽，是诡诈之人；她的祭司亵渎圣洁之物[a]，践踏律法[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“圣所”或“圣物”。
    reason: lexical_alternative
  - marker: b
    text: “律法”原文也可译作“训诲”。
    reason: lexical_alternative
lexical_decisions:
- source_word: נְבִיאֶיהָ
  choice: 她的先知
  rationale: 复数名词带第三人称阴性单数后缀，指属于这座被拟人化之城的先知；直译为“她的先知”自然且保留指代关系。
- source_word: פֹּחֲזִים
  choice: 鲁莽
  rationale: 该词描述轻率、放纵而不受约束的行为或品格；“鲁莽”是现代汉语中清楚自然的对应词，也不把含义限缩为“自夸”或“轻浮”。
- source_word: אַנְשֵׁי בֹּגְדוֹת
  choice: 背信弃义的人
  rationale: 原文直译近于“行背叛之事的人”，用复数抽象名词强化其惯常的背叛品格；“背信弃义的人”以自然汉语保留这一道德指控。
- source_word: כֹּהֲנֶיהָ
  choice: 她的祭司
  rationale: 复数名词带第三人称阴性单数后缀，与“她的先知”平行；“她的祭司”准确保留所属关系。
- source_word: חִלְּלוּ
  choice: 亵渎
  rationale: 该动词的加强语态在祭祀语境中表示使神圣者成为俗物、加以亵渎；“亵渎”准确表达其礼仪和盟约层面的严重性。
- source_word: קֹדֶשׁ
  choice: 神圣之物
  rationale: 该名词可指神圣性质、圣物或圣所。这里不明确限定对象；“神圣之物”比单指“圣所”更能保留原文的宽泛性，并可在现代汉语中自然充当“亵渎”的宾语。
- source_word: חָמְסוּ
  choice: 践踏
  rationale: 该动词含暴力侵害、亏负或违害之意。以“践踏律法”表达对律法的粗暴侵害，保留原文鲜明的暴力隐喻，而不弱化成一般的“不遵守”。
- source_word: תּוֹרָה
  choice: 律法
  rationale: 在祭司职责和先知谴责的语境中，该词可指上帝的教导，也可指盟约律法；“律法”最能传达此处的制度与盟约背景，同时以脚注保留“训诲”这一较宽泛译法。
theological_decisions:
- issue: 祭司所亵渎之קֹדֶשׁ的范围
  choice: 采用较宽泛的“神圣之物”，不限定为圣所建筑
  alternative: 圣所；圣物
  rationale: 希伯来文没有明确指定圣殿建筑，也可能泛指归为神圣的一切。宽泛译法保留原文的语义开放性，避免把对祭司的指控过早限定。
- issue: תּוֹרָה在本节中的范围
  choice: 正文译为“律法”
  alternative: 训诲
  rationale: 祭司语境支持盟约律法的含义，但该词本身也可泛指教导或训诲；正文采用读者熟悉的“律法”，脚注保留较宽的可能性。
translation_notes:
  register: 采用现代、庄重而易懂的书面语。两个并列分句保留原文对“先知”与“祭司”的平行谴责；“鲁莽”避免古旧表达，“践踏律法”则保留原文强烈的暴力意象。脚注标记依其实际所释词语置于“神圣之物”和“律法”之后。
