language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: הֵסִ֤יר יְהוָה֙ מִשְׁפָּטַ֔יִ/ךְ פִּנָּ֖ה אֹֽיְבֵ֑/ךְ מֶ֣לֶךְ יִשְׂרָאֵ֤ל יְהוָה֙ בְּ/קִרְבֵּ֔/ךְ לֹא תִֽירְאִ֥י רָ֖ע עֽוֹד׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/003/015.yaml
  text: Yahweh has taken away your judgments[a]; he has turned away your enemy. The King of Israel, Yahweh, is in your midst[b]; you will fear evil no more.
translation:
  language: zh_hans
  text: 耶和华已经除去对你的判决[a]，赶走你的仇敌。以色列的王耶和华在你中间；你必不再惧怕祸患[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你的刑罚”。原文也可较直译为“你的判决”。
    reason: lexical_alternative
  - marker: b
    text: 译作“祸患”的希伯来词也可指“邪恶”“灾难”或“恶事”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵסִיר
  choice: 已经除去
  rationale: 使役词形在此表示除去、移走；“已经”传达拯救宣告中行动已成就的语气。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的专名形式，保留四字神名作为名字，而不以“主”这一称号替代。
- source_word: מִשְׁפָּטַיִךְ
  choice: 对你的判决
  rationale: מִשְׁפָּט可指审判、司法裁决或刑罚；上下文所指是临到锡安的不利判决。“对你的”明确其指向，同时脚注保留其他可能表达。
- source_word: פִּנָּה
  choice: 赶走
  rationale: 此动词可表示清除、移开或使转离；以“仇敌”为宾语时，“赶走”符合语境且是自然的现代汉语。
- source_word: אֹיְבֵךְ
  choice: 你的仇敌
  rationale: 原文为单数，译文保留单数；它也可能具有集合意义。
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: 以色列的王
  rationale: 按原文领属结构直译，并保留其作为耶和华称号的作用。
- source_word: בְּקִרְבֵּךְ
  choice: 在你中间
  rationale: 既表达空间上的同在，也保留圣约同在的含义；第二人称阴性单数所指为锡安。
- source_word: לֹא תִירְאִי
  choice: 你必不再惧怕
  rationale: 未完成体在救恩宣告之后自然表达将来的确定结果；“必”体现确定性，不译成命令。
- source_word: רָע
  choice: 祸患
  rationale: רָע既可指道德上的邪恶，也可指人所遭遇的灾祸；复兴语境偏向后者。“祸患”在中文中自然，脚注保留原词较宽的语义范围。
- source_word: עוֹד
  choice: 不再
  rationale: 该词与否定词连用，惯常表示“不再”或“不再有”。
theological_decisions:
- issue: 四字神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威；主
  rationale: 正文保留神的专名而不以称号“主”替代；“耶和华”是普通中文读者最熟悉的专名形式。
- issue: מִשְׁפָּטַיִךְ在救恩宣告中的含义
  choice: 对你的判决
  alternative: 你的判决；你的刑罚
  rationale: 本词本身比“刑罚”宽，但语境表明是针对锡安的不利司法裁决。正文既保留“判决”的司法色彩，又用“对你的”说明关系。
- issue: רָע在末句中的含义
  choice: 祸患
  alternative: 邪恶；灾难；恶事
  rationale: 上下文主要谈仇敌被赶走及灾难止息，因此正文采用“祸患”；脚注说明该希伯来词也可指邪恶，以免消除其词义张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。以“对你的判决”避免生硬且可能误解为由锡安作出的“你的判决”；末句以“祸患”贴合复兴语境，并借脚注保留רָע的语义宽度。标点按现代中文处理，以分号呈现神同在与不再惧怕之间的紧密关系。
