  text: מֵ/עֵ֖בֶר לְ/נַֽהֲרֵי כ֑וּשׁ עֲתָרַ/י֙ בַּת פוּצַ֔/י יוֹבִל֖וּ/ן מִנְחָתִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/003/010.yaml
  text: From beyond the rivers of Cush, my worshipers, the daughter of my dispersed ones, will bring my offering.
translation:
  language: zh_hans
  text: 从古实众河的那边[c]，向我祈求的人[a]，我四散之民的女儿[b]，必把我的供物带来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“敬拜我的人”。原词主要指向上帝祈求、恳求的人，进而也可指敬拜者。
    reason: lexical_alternative
  - marker: b
    text: “我四散之民的女儿”是凝练的诗歌表达，可能是对一个流散群体的人格化称呼；也可理解为“我分散之人的女儿”。
    reason: alternative_reading
  - marker: c
    text: “古实”指古代埃及以南的地区，与现代埃塞俄比亚并不完全相同。
    reason: cultural_note
lexical_decisions:
- source_word: מֵעֵבֶר
  choice: 从……的另一边
  rationale: 表示从某一边界或地理区域的彼岸而来；此译保留空间关系，不额外强调距离。
- source_word: לְנַהֲרֵי כוּשׁ
  choice: 古实众河
  rationale: 保留古代地名“古实”，避免与现代国家埃塞俄比亚直接等同；复数“众河”对应原文。
- source_word: עֲתָרַי
  choice: 向我祈求的人
  rationale: 该词源于表示恳求、祈求的词根；此译比宽泛的“敬拜我的人”更贴近词义，同时在上下文中仍可包含敬拜含义。
- source_word: בַּת
  choice: 女儿
  rationale: 保留希伯来诗歌中把群体人格化为“女儿”的意象，不将其平化为普通的群体称谓。
- source_word: פוּצַי
  choice: 我四散之民
  rationale: 表达被分散、四散的一群人，并保留第一人称所属关系；不明确断定是上帝使其分散，还是他们仅仅属于上帝。
- source_word: יוֹבִלוּן
  choice: 必把……带来
  rationale: 使役词形在供物作宾语时自然表示带来或送来；“必”体现未完成式在预言语境中的将来指向。
- source_word: מִנְחָתִי
  choice: 我的供物
  rationale: 可指献给上帝的供物，也可指献给尊长的礼物或贡物；“供物”保留宗教献呈意味而不过度限定祭物种类。
theological_decisions:
- issue: עֲתָרַי בַּת פוּצַי 的句法关系
  choice: 把“我四散之民的女儿”理解为“向我祈求的人”的诗性同位语，以“就是”标明。
  alternative: 可把两者理解为两个并列群体，或把“女儿”理解为代表我四散之民的群体称号。
  rationale: 原文结构高度凝练，关系并不完全明确。正文保留人格化的“女儿”意象，并用同位结构呈现主要读法；脚注说明其集体性及句法上的余地。
- issue: “我的供物”所表达的归属
  choice: 按第一人称后缀直译为“我的供物”。
  alternative: 可意译为“献给我的供物”或“给我的贡物”。
  rationale: 直译既可理解为归给上帝的供物，也不排除礼物或贡物的语义，避免把礼仪性质限定得过窄。
translation_notes:
  register: 采用庄重而可理解的现代标准汉语。“众河”略带诗体色彩，以对应原文复数；“女儿”刻意保留先知书中的群体人格化意象，脚注帮助普通读者理解。
