  to: 雅威在她中间，是公义的[a]；他不行不义。每天清晨，他使自己的公正显明；这从不缺席。然而，不义的人不知羞耻。
  rationale: 修订仅改善现代汉语的句法、搭配和指代清晰度，未改变原文的时态、持续性、拟人化指代或公义与不义之间的对照。保留脚注 a 以说明阴性指代；脚注 b 仍保留 מִשְׁפָּט 可译为“审判”的词汇可能性。
