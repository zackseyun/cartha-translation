source:
  edition: WLC
  text: יְהוָ֤ה צַדִּיק֙ בְּ/קִרְבָּ֔/הּ לֹ֥א יַעֲשֶׂ֖ה עַוְלָ֑ה בַּ/בֹּ֨קֶר בַּ/בֹּ֜קֶר מִשְׁפָּט֨/וֹ יִתֵּ֤ן לָ/אוֹר֙ לֹ֣א נֶעְדָּ֔ר וְ/לֹֽא יוֹדֵ֥עַ עַוָּ֖ל בֹּֽשֶׁת־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/003/005.yaml
  text: Yahweh is righteous in her midst; he does no injustice[a]. Morning by morning he brings his justice to light; it does not fail. But the unjust knows no shame.
translation:
  language: zh_hans
  text: 雅威在她中间，是公义的[a]；他不行不义。每天清晨，他使自己的公正显明；这从不缺席。然而，不义的人不知羞耻。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “她”指拟人化的耶路撒冷城。
    reason: referent_clarification
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来语四字神名的通行学术读音音译，保留这是上帝的专名，而不以“主”等称号替代。
- source_word: צַדִּיק
  choice: 公义的
  rationale: 此处作表语，描述雅威的道德与司法品格；“公义”兼顾正直和秉公的含义。
- source_word: בְּקִרְבָּהּ
  choice: 在她中间
  rationale: 保留第三人称阴性单数后缀及其对耶路撒冷城的拟人表达；脚注说明所指，以免孤立阅读时产生误解。
- source_word: לֹא יַעֲשֶׂה עַוְלָה
  choice: 他绝不行不义的事
  rationale: 直接表达雅威不实施任何不公不义之事；“绝不”自然传达希伯来语否定陈述的明确力度。
- source_word: בַּבֹּקֶר בַּבֹּקֶר
  choice: 清晨又清晨
  rationale: 保留原文的重复形式及其周而复始、天天如此的分配意义。
- source_word: מִשְׁפָּטוֹ
  choice: 自己的公正
  rationale: 上下文以雅威的公义对照不义，故正文采用“公正”，侧重他持续彰显的公正作为；“审判”这一可行含义保留在脚注。
- source_word: יִתֵּן לָאוֹר
  choice: 使……显明
  rationale: 原文直译为“交给光”，是使之进入光明、公开显现的意象；“使……显明”以自然汉语表达该意。
- source_word: לֹא נֶעְדָּר
  choice: 从不缺失
  rationale: 保留尼法勒式所表达的“不缺少、不缺席”；在这里指雅威的公正每天都必显现。
- source_word: וְלֹא יוֹדֵעַ עַוָּל בֹּשֶׁת
  choice: 然而，不义的人却不知羞耻
  rationale: “不义的人”体现 עַוָּל 的实体化用法；“不知羞耻”自然保留希伯来语习语。“然而……却”凸显其与雅威公义作为的反差。
theological_decisions:
- issue: בְּקִרְבָּהּ 中阴性后缀的指代和性别
  choice: 译作“在她中间”，理解为拟人化的耶路撒冷城。
  alternative: 译作“在城中”或“在其中”。
  rationale: 上下文把耶路撒冷视为阴性对象；保留“她”可呈现原文拟人化，而脚注补明指代，以兼顾可懂度。
- issue: מִשְׁפָּטוֹ 在本节中的含义
  choice: 正文译为“自己的公正”。
  alternative: “自己的审判”或“他的判决”。
  rationale: 本节围绕“公义—不义”的鲜明对照，“公正”较能表达雅威持续施行并彰显的正义；原词也可指司法审判，因此以脚注保留，不将歧义静默消除。
- issue: 连接词 וְ 在末句中的关系
  choice: 采用转折性的“然而……却”。
  alternative: 直译为“并且”。
  rationale: 希伯来语 וְ 可依语境表达多种衔接关系；此处公义的雅威与不知羞耻的不义者形成明显对照，转折译法最能传达语篇功能。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。“清晨又清晨”略带诗性，以保留希伯来文的重复节奏；“从不缺失”承接“公正显明”，避免擅自把原文限定为某一种具体司法事件。
