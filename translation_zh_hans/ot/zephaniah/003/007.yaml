  source_fidelity: 正文总体忠实保留了上帝第一人称发言、对阴性单数“她”的称呼及结尾转为复数“他们”的变化，也恰当保留了“早起”和“剪除”的形象。惟“你总该敬畏我”在汉语中主要表达应然义务（‘你理当’），弱化了אַךְ与未完成式在此表达的确信期待；改为“你必会敬畏我”更贴近原文。
  naturalness: “她的居所就不至照……”略显生硬，补足“于”并以“按……而”连接，句法更完整而不改变其刻意保留的歧义。“败坏自己的一切行为”可用完成体“败坏了”使叙事动作更自然清楚。
  terminology: “敬畏”“接受管教”“居所”“剪除”均符合庄重现代汉语及先知书语域。保留“她／他们”的转换，不以解释性词语抹平原文的指代变化。
