  text: אָמַ֜רְתִּי אַךְ תִּירְאִ֤י אוֹתִ/י֙ תִּקְחִ֣י מוּסָ֔ר וְ/לֹֽא יִכָּרֵ֣ת מְעוֹנָ֔/הּ כֹּ֥ל אֲשֶׁר פָּקַ֖דְתִּי עָלֶ֑י/הָ אָכֵן֙ הִשְׁכִּ֣ימוּ הִשְׁחִ֔יתוּ כֹּ֖ל עֲלִילוֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/003/007.yaml
  text: I said[a], ‘Surely you will fear me; you will accept correction. Then her dwelling would not be cut off, according to all that I had appointed against her.’ But instead, they rose early[b]; they corrupted all their deeds.
translation:
  language: zh_hans
  text: 我曾说：“你必会敬畏我，接受管教；这样，她的居所就不至于按我向她所定的一切而被剪除。[a]”然而，他们一早起来[b]，就败坏了自己的一切行为。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本句也可能译作：“这样，尽管我向她定了这一切，她的居所仍不至被剪除。”
    reason: alternative_reading
  - marker: b
    text: “一早起来”是希伯来语表达，可暗示急切地或一再地去做某事。
    reason: cultural_note
lexical_decisions:
- source_word: אָמַרְתִּי
  choice: 我曾说
  rationale: 按第一人称完成式直译，保留上帝直接发言的框架；不采用较间接的“我想”。
- source_word: אַךְ תִּירְאִי אוֹתִי
  choice: 你总该敬畏我
  rationale: אַךְ表达强烈期待；“总该”在现代汉语中自然地传达“至少必会如此”的语气。ירא用于对上帝的态度，兼有惧怕与尊崇之意，故译“敬畏”。
- source_word: תִּקְחִי מוּסָר
  choice: 接受管教
  rationale: לקח与מוּסָר连用，指接受纠正、训诫或纪律；“接受管教”兼顾道德纠正和惩戒意味。
- source_word: וְלֹא יִכָּרֵת מְעוֹנָהּ
  choice: 她的居所就不至……被剪除
  rationale: 保留城市人格化所用的阴性代词，也保留כרת“剪除”的审判意味；“不至”表达语境中的条件性结果。
- source_word: כֹּל אֲשֶׁר פָּקַדְתִּי עָלֶיהָ
  choice: 照我向她所定的一切
  rationale: פקד在此可涉及命定、降罚或追讨。译作“所定”保留上帝所定审判的含义，而不武断地说审判已经执行。
- source_word: אָכֵן
  choice: 然而
  rationale: 此处构成上帝所期待的回应与百姓实际行为之间的强烈转折。
- source_word: הִשְׁכִּימוּ
  choice: 一早起来
  rationale: 保留希伯来语“早起”的具体说法，其暗含的急切或一再如此由脚注说明。
- source_word: הִשְׁחִיתוּ כֹּל עֲלִילוֹתָם
  choice: 败坏自己的一切行为
  rationale: הִשְׁחִיתוּ为使役形，可表示使之败坏；“自己的一切行为”准确呈现其宾语和道德意味。
theological_decisions:
- issue: 阴性单数称谓与随后复数动词的指向
  choice: 以“她”指人格化的耶路撒冷，以“他们”指城中的居民
  alternative: 阴性单数也可较宽泛地指整个国家或城邦
  rationale: 原文先用阴性单数动词和后缀，末尾突然改用复数。译文保留这一转换，不将城市与居民强行统一为同一语法数。
- issue: “我向她所定的一切”与“不被剪除”的逻辑关系
  choice: 理解为：她若敬畏并受教，其居所就不至按照所定的审判被剪除
  alternative: 也可能是让步关系：尽管我向她定了这一切，她的居所仍不至被剪除
  rationale: 原文句法紧缩，关系存在争议。正文采用较符合前后期待与拒绝之对比的理解，同时在脚注保留让步式解释。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“敬畏”“管教”“剪除”保留先知审判话语的力度；正文保留城市“她”与居民“他们”之间的语法转换。所有脚注标记均已置于正文对应位置。
