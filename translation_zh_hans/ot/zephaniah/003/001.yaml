  text: ה֥וֹי מֹרְאָ֖ה וְ/נִגְאָלָ֑ה הָ/עִ֖יר הַ/יּוֹנָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/003/001.yaml
  text: Woe to the rebellious and defiled city[b][a], the oppressing one!
translation:
  language: zh_hans
  text: 祸哉，这悖逆、污秽[a]、欺压人的城[b]！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“受了玷污”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语此词也可按字面理解为“鸽子”；但按本节的谴责语境，通常理解为形容这城欺压人。
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹי
  choice: 祸哉
  rationale: 这是先知宣告审判并带有哀叹意味的感叹词；“祸哉”既保留其强烈语气，也符合现代中文庄重的先知话语风格。
- source_word: מֹרְאָה
  choice: 悖逆
  rationale: 按马所拉文本的读法，此词与“悖逆、抗拒”相关，指这城拒绝管教和权威；“悖逆”比“污秽”更直接反映该词根，并与下一词形成不同而互补的指控。
- source_word: וְנִגְאָלָה
  choice: 污秽
  rationale: 这里的被动形式在谴责语境中表示受到玷污或污染；“污秽”能自然表达道德与礼仪层面的败坏，同时以脚注保留“受了玷污”这一较贴近被动形态的译法。
- source_word: הָעִיר
  choice: 城
  rationale: עִיר在此指耶路撒冷这座城；中文诗性谴责句中用“城”简洁自然，无须在正文补出专名。
- source_word: הַיּוֹנָה
  choice: 欺压人的
  rationale: 在本节谴责性的并列结构中，将此词理解为与“欺压”有关的描述最为连贯；译作“欺压人的”使其修饰“城”的功能在中文中清楚自然，同时以脚注保留字形上可能的“鸽子”读法。
theological_decisions:
- issue: הַיּוֹנָה的歧义
  choice: 正文译作“欺压人的”
  alternative: “鸽子般的”或“那鸽子”
  rationale: 上下文连续列举这城的罪恶，且下一节具体描述官长和审判官的掠夺行为，因此“欺压人的”更符合谴责性的并列关系；不过，希伯来词形也可直接理解为“鸽子”，故不消除这一真实的词汇歧义，而在脚注注明。
translation_notes:
  register: 采用庄重而清楚的现代标准普通话。“祸哉”保留先知宣告的审判力度；三个并列定语紧凑有力，并避免加入原文未明说的城名。
