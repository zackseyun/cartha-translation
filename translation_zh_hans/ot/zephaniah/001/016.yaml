  text: a day of trumpet and battle cry against the fortified cities and against the high battlements[a][b].
translation:
  language: zh_hans
  text: 是吹角呐喊的日子，攻击坚固的城，攻击高耸的城角[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “呐喊”也可译作“警报声”或“战斗的呼喊”。希伯来语此词可指大声呼喊、警报信号或战争中的呐喊；这里因提到攻击坚固城邑，军事含义较为突出。
    reason: lexical_alternative
  - marker: b
    text: “城角”直译为“角”。这里很可能指城墙高处的角部防御工事，也可能包括角楼。
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹם
  choice: ……的日子
  rationale: 承接上下文对耶和华之日的一连串同位描述，保留希伯来文简洁的列举结构。
- source_word: שׁוֹפָר
  choice: 吹角
  rationale: 此处指以号角发出军事或警报信号；“吹角”自然凝练，也不必过度限定为羊角。
- source_word: תְרוּעָה
  choice: 呐喊
  rationale: 该词可指呼喊、警报或战斗呐喊；在攻击设防城市的语境中带有鲜明军事色彩，但正文用“呐喊”保留其词义幅度。
- source_word: עַל
  choice: 攻击
  rationale: 军事审判语境使介词具有敌对方向；译作“攻击”比“临到”或“在……之上”更清楚自然。
- source_word: הֶעָרִים הַבְּצֻרוֹת
  choice: 坚固的城
  rationale: 准确表达有防御工事、经过设防的城市；“坚固的城”符合现代中文圣经语体且易懂。
- source_word: הַפִּנּוֹת הַגְּבֹהוֹת
  choice: 高耸的城角
  rationale: 原文直译为“高的角”；在围城语境中很可能指城墙突出的角部防御工事，但正文不将其过度具体化为角楼。
theological_decisions: []
