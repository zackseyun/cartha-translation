source:
  edition: WLC
  text: וְ/נָטִ֤יתִי יָדִ/י֙ עַל יְהוּדָ֔ה וְ/עַ֖ל כָּל יוֹשְׁבֵ֣י יְרוּשָׁלִָ֑ם וְ/הִכְרַתִּ֞י מִן הַ/מָּק֤וֹם הַ/זֶּה֙ אֶת שְׁאָ֣ר הַ/בַּ֔עַל אֶת שֵׁ֥ם הַ/כְּמָרִ֖ים עִם הַ/כֹּהֲנִֽים־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/001/004.yaml
  text: And I will stretch out my hand against Judah and against all the inhabitants of Jerusalem[a], and I will cut off from this place the remnant of Baal, the name of the idolatrous priests along with the priests[b],
translation:
  language: zh_hans
  text: “我要伸手攻击犹大和耶路撒冷所有的居民；我要从这地方剪除巴力的残余，也剪除拜偶像的祭司[a]之名[b]，连同众祭司。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “拜偶像的祭司”译自希伯来语 כְּמָרִים，指异教或混合宗教体系中的祭司；原文以另一个通常表示“祭司”的词称呼本节末尾的祭司。
    reason: 文化与词义说明
  - marker: b
    text: “之名”也可意译为“连他们的记忆也除掉”。在这里，除掉某人的名表示彻底抹除，甚至不再留下对他们的记念。
    reason: 希伯来习语说明
lexical_decisions:
- source_word: וְנָטִיתִי יָדִי
  choice: 我要伸手攻击
  rationale: 保留希伯来文“伸手”的审判意象；介词 עַל 在敌对语境中表示“攻击”。未采用单纯的“惩罚”，以免抹去原文形象。
- source_word: עַל יְהוּדָה וְעַל כָּל יוֹשְׁבֵי יְרוּשָׁלָם
  choice: 攻击犹大和耶路撒冷所有的居民
  rationale: 准确表达敌对方向，并以现代汉语自然地译出 יוֹשְׁבֵי 的群体含义。
- source_word: וְהִכְרַתִּי
  choice: 我要……剪除
  rationale: כרת 的使役形在审判语境中指彻底除灭；“剪除”既保留原文动作色彩，也带有司法性和彻底性。
- source_word: מִן הַמָּקוֹם הַזֶּה
  choice: 从这地方
  rationale: 保留原文的指示性，不擅自把所指范围限定为耶路撒冷或全地。
- source_word: שְׁאָר הַבַּעַל
  choice: 巴力的残余
  rationale: 紧贴原文压缩的表达，保留“残余”究竟指巴力崇拜、相关设施或势力的开放性。
- source_word: שֵׁם הַכְּמָרִים
  choice: 拜偶像的祭司之名
  rationale: כְּמָרִים 指异教或混合宗教体系中的祭司；保留“名”这一希伯来意象，并用脚注说明其彻底抹除记忆的习语含义。
- source_word: עִם הַכֹּהֲנִים
  choice: 连同众祭司
  rationale: 以“连同”表达 עִם，并用通常的“祭司”译 כֹּהֲנִים，以维持其与 כְּמָרִים 的词汇区别。
theological_decisions:
- issue: כְּמָרִים 与 כֹּהֲנִים 两类祭司的区别
  choice: 分别译作“拜偶像的祭司”和“众祭司”
  alternative: 两者都译作“祭司”，或将 כְּמָרִים 音译
  rationale: 原文有意使用两个不同名词。区别翻译既让普通读者看见对比，又不把第二类祭司擅自界定为忠信、合法或某一特定宗派的祭司。
- issue: “名”（שֵׁם）的表达力度
  choice: 正文保留“之名”，脚注解释其习语含义
  alternative: 正文直接意译为“记忆”或“踪迹”
  rationale: 保留原文关于彻底审判的具体意象，同时通过脚注避免现代读者误解为只删除称号或名称。
- issue: “巴力的残余”所指范围
  choice: 保留压缩而含混的“巴力的残余”
  alternative: 明确译成“残余的巴力崇拜”或“巴力崇拜的一切遗迹”
  rationale: 上下文很可能涉及巴力崇拜，但原文没有明说其残余具体是人员、器物、制度还是崇拜活动，因此不在正文中缩窄。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“伸手攻击”“剪除”保留先知审判宣告的力度和原文意象；避免古奥音译，也避免将“巴力的残余”和两类祭司的身份解释得超过原文。
