  text: י֥וֹם עֶבְרָ֖ה הַ/יּ֣וֹם הַ/ה֑וּא י֧וֹם צָרָ֣ה וּ/מְצוּקָ֗ה י֤וֹם שֹׁאָה֙ וּ/מְשׁוֹאָ֔ה י֥וֹם חֹ֨שֶׁךְ֙ וַ/אֲפֵלָ֔ה י֥וֹם עָנָ֖ן וַ/עֲרָפֶֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/001/015.yaml
  text: That day is a day of wrath[a], a day of distress and anguish, a day of ruin and devastation, a day of darkness and gloom[c][b], a day of clouds and thick darkness.
translation:
  language: zh_hans
  text: 那日是烈怒的日子[a]，是患难和困苦的日子，是毁坏和荒凉的日子[b]，是黑暗和幽暗的日子，是云和浓重的黑暗的日子[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “烈怒”也可译作“震怒”或“愤怒”。
    reason: lexical_alternative
  - marker: b
    text: “毁坏和荒凉”也可译作“荒废和毁灭”；原文用两个近义词叠加灾难的程度。
    reason: lexical_alternative
  - marker: c
    text: “浓重的黑暗”也可译作“幽暗”；原词也可指暗云。原文在这一诗性序列中使用单数名词。
    reason: lexical_ambiguity
lexical_decisions:
- source_word: י֥וֹם עֶבְרָ֖ה
  choice: 烈怒的日子
  rationale: עֶבְרָה表示强烈、迸发的怒气；“烈怒”既保留先知审判语境的力度，也没有在正文中明说怒气的主体。
- source_word: הַ/יּ֣וֹם הַ/ה֑וּא
  choice: 那日
  rationale: 双重限定结构强调前文所指的特定日子；“那日”简洁自然，并符合先知文学的庄重语体。
- source_word: צָרָ֣ה וּ/מְצוּקָ֗ה
  choice: 患难和困苦
  rationale: צָרָה指患难、危难，מְצוּקָה带有受压、陷入窘境之意；用两个相近而有区别的词保留希伯来文的并列累加。
- source_word: שֹׁאָה֙ וּ/מְשׁוֹאָ֔ה
  choice: 毁坏和荒凉
  rationale: 这两个近义词共同描绘灾难造成的毁灭与荒废；译文保留成对表达，而不合并为单一概念。
- source_word: חֹ֨שֶׁךְ֙ וַ/אֲפֵלָ֔ה
  choice: 黑暗和幽暗
  rationale: חֹשֶׁךְ是一般的黑暗，אֲפֵלָה是更深沉的昏暗；“黑暗和幽暗”保留近义叠加和逐步加重的诗意。
- source_word: עָנָ֖ן וַ/עֲרָפֶֽל
  choice: 密云和浓暗
  rationale: עָנָן指云，עֲרָפֶל可指浓厚的黑暗或暗云；“密云和浓暗”维持两个单数意象及末句沉重、朦胧的气氛。
theological_decisions:
- issue: 先知审判语言中“那日”的所指
  choice: 保留反复的“……的日子”结构，不限定为某一次历史事件或仅指末后的审判。
  alternative: 明确译成犹大受审判之日，或明确译成末日最终审判。
  rationale: 本节以诗性意象描述耶和华之日，却没有在这一句内界定其仅为近期历史事件还是终末事件；译文应保留这种范围上的张力。
- issue: “烈怒”的主体
  choice: 按希伯来文译为不明说主体的“烈怒”。
  alternative: 增译为“耶和华烈怒的日子”。
  rationale: 上下文表明审判与耶和华有关，但本句的名词短语本身没有明说所属关系；正文不补入主体，以免把上下文解释写进本节措辞。
translation_notes:
  register: 采用现代、庄重而易懂的普通话，按原文五次重复“是……的日子”，保留先知诗歌的节奏和逐层累加。成对名词均以“和”连接，避免古奥措辞；“幽暗”在此仅指深沉昏暗，不取“阴间”之义。
