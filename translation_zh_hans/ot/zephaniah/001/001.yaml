base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/001/001.yaml
  text: 'The word of Yahweh that came to Zephaniah son of Cushi[a], son of Gedaliah, son of Amariah, son of Hezekiah, in the days of Josiah son of Amon[b], king of Judah:'
translation:
  language: zh_hans
  text: 当亚们的儿子约西亚作犹大王的时候，雅威的话临到西番雅；西番雅是古示[a]的儿子，古示是基大利的儿子，基大利是亚玛利雅的儿子，亚玛利雅是希西家[b]的儿子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “古示”也可理解为“古实人”；这里按家谱中的人名翻译。
    reason: lexical_alternative
  - marker: b
    text: 这里的“希西家”可能指希西家王；若是如此，西番雅便有王室血统。不过，原文并未明确称他为王。
    reason: cross_reference
lexical_decisions:
- source_word: דְּבַר יְהוָה
  choice: 雅威的话
  rationale: 保留先知书标题中“雅威的话”这一固定表达，并将四字神名作为上帝的专名译出，而不以称号替代。
- source_word: אֲשֶׁר הָיָה אֶל
  choice: 临到
  rationale: “话临到某人”是希伯来先知文献的惯用表达；现代中文自然、庄重，也保留了启示主动临及先知的语气。
- source_word: צְפַנְיָה
  choice: 西番雅
  rationale: 采用现代中文圣经读者熟悉的人名音译。
- source_word: בֶּן
  choice: 是……的儿子
  rationale: 逐层保留原文反复出现的父子谱系关系，不把它泛化为“后裔”。
- source_word: כּוּשִׁי
  choice: 古示
  rationale: 此词处在家谱的人名位置，正文按专名音译；它也可能被理解为“古实人”，故以脚注保留词义上的可能性。
- source_word: גְּדַלְיָה
  choice: 基大利
  rationale: 采用通行中文音译。
- source_word: אֲמַרְיָה
  choice: 亚玛利雅
  rationale: 采用通行中文音译。
- source_word: חִזְקִיָּה
  choice: 希西家
  rationale: 采用通行中文音译；原文未称此人为王，因此正文不加“王”。
- source_word: בִּימֵי
  choice: 那时
  rationale: 在本句王朝纪年语境中，以自然中文表达“在……的日子”；后接“作犹大王”清楚交代历史时期。
- source_word: יֹאשִׁיָּהוּ
  choice: 约西亚
  rationale: 采用通行中文音译。
- source_word: אָמֹון
  choice: 亚们
  rationale: 采用通行中文音译。
- source_word: מֶלֶךְ יְהוּדָה
  choice: 作犹大王
  rationale: 将原文同位语转换为自然中文谓语，准确说明约西亚在所述时期的身份。
theological_decisions:
- issue: 希西家是否就是犹大王希西家
  choice: 正文仅译作“希西家”，不加“王”
  alternative: 明确译作“希西家王”，从而表明西番雅具有王室血统
  rationale: 这位祖先可能是犹大王希西家，但希伯来文只记姓名，并未给他“王”的称号。正文不替原文作出历史身份认定，脚注则保留这一可能性。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。“雅威的话临到”保留先知书开篇的公式化色彩；家谱拆分为两个句子，以免连续多层所属关系造成中文理解困难。脚注标记均紧随相关姓名，且修正了咨询层中脚注内容与正文标记位置不相符的问题。
