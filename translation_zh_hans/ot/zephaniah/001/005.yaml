  text: וְ/אֶת הַ/מִּשְׁתַּחֲוִ֥ים עַל הַ/גַּגּ֖וֹת לִ/צְבָ֣א הַ/שָּׁמָ֑יִם וְ/אֶת הַ/מִּֽשְׁתַּחֲוִים֙ הַ/נִּשְׁבָּעִ֣ים לַֽ/יהוָ֔ה וְ/הַ/נִּשְׁבָּעִ֖ים בְּ/מַלְכָּֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/001/005.yaml
  text: those who bow down on the rooftops to the host of heaven[a], and those who bow down, who swear by Yahweh and swear by Milcom.
translation:
  language: zh_hans
  text: 还有那些在屋顶上向天上的万象跪拜的人，以及那些敬拜的人，就是向耶和华起誓，又指着米勒公[a]起誓的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“他们的王”；有人认为这里所指的是“摩洛”。
    reason: 希伯来语מַלְכָּם可理解为神名“米勒公”，也可分析为“他们的王”；另有将其与摩洛相联系的解释。
lexical_decisions:
- source_word: הַמִּשְׁתַּחֲוִים
  choice: 跪拜的人
  rationale: 该分词表示俯伏、下拜的动作，在本节语境中具有敬拜含义；“跪拜”既保留身体动作，也自然传达宗教敬拜。
- source_word: עַל הַגַּגּוֹת
  choice: 在屋顶上
  rationale: 按地点直译；古代平顶屋可用作敬拜场所，现代汉语“在屋顶上”清楚自然。
- source_word: לִצְבָא הַשָּׁמַיִם
  choice: 向天上万象
  rationale: צְבָא הַשָּׁמַיִם指天空中的众多天体，在这里是受敬拜的对象。“天上万象”比“天军”更能避免现代读者误解为天使军队，也不把范围缩窄为星辰。
- source_word: הַנִּשְׁבָּעִים לַיהוָה
  choice: 向耶和华起誓
  rationale: נשׁבע与ל连用可表达向某位起誓、以誓言表示效忠；译作“向耶和华起誓”保留介词方向性，并与下句形成有意的不完全对称。
- source_word: לַיהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名形式表达四字神名יהוה。
- source_word: בְּמַלְכָּם
  choice: 指着米勒公起誓
  rationale: ב与“起誓”连用通常表示凭某对象起誓。主文本按外邦神名Milcom理解，符合本节谴责混合敬拜的语境；原文也可能理解为“他们的王”，另有人联系摩洛，因此以脚注保留。
theological_decisions:
- issue: מַלְכָּם的身份
  choice: 主文本译作外邦神“米勒公”
  alternative: “他们的王”；另有人理解为“摩洛”
  rationale: 把该词理解为米勒公，最能说明经文中一面向耶和华起誓、一面又凭另一敬拜对象起誓的对照。不过希伯来文字形确实容许“他们的王”这一分析，也有将其与摩洛相联的传统，故不在正文中掩盖歧义。
- issue: 向耶和华及米勒公起誓的关系
  choice: 以“却又”显出同一群体的双重效忠
  alternative: 仅用并列连词“又……又……”
  rationale: 原文连续描述同一群跪拜者向耶和华起誓并指着米勒公起誓；“却又”自然表达先知谴责的冲突，但没有增添具体教派解释。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。正文延续上一节的宾语列举结构，以“还有”承接；使用“屋顶”“跪拜”“起誓”等普通读者易懂的词语。脚注标记紧随存在歧义的“米勒公”，而不置于无关的“天上万象”之后。
