revisions:
- from: 还有那些在屋顶上向天上万象跪拜的人，以及那些跪拜、向耶和华起誓，却又指着米勒公[a]起誓的人。
  to: 还有那些在屋顶上向天上的万象跪拜的人，以及那些敬拜的人，就是向耶和华起誓，又指着米勒公[a]起誓的人。
  rationale: 修订仅改善现代汉语的属格表达和分词串联的句法，并将带有解释色彩的“却又”还原为中性的“又”。米勒公的主文本读法及其文本歧义的脚注均予保留。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T08:16:42Z'
review_pass:
  verdict: revise
  source_fidelity: 译文准确保留了原文所列的两类对象、屋顶敬拜天上万象，以及向耶和华和米勒公起誓的并列关系。将“天上万象”调整为“天上的万象”，更清楚地表达希伯来语属格结构。保留米勒公的主文本读法，并以脚注保存“他们的王”和“摩洛”的替代理解。
  naturalness: 原文“那些跪拜、向耶和华起誓……的人”中，“跪拜”后直接接另一动作，汉语句法略显悬空。改为“那些敬拜的人，就是……”可自然表达原文以分词进一步界定同一群人的结构，且不增加意义。
  terminology: “耶和华”“天上的万象”“米勒公”均适合庄重、现代的中文圣经语体。“敬拜”在此处既传达下拜的宗教意义，也避免“跪拜”在第二处缺少明确宾语所造成的不顺。
  issues:
  - severity: low
    issue: “天上万象”的定语关系可更明确。
    rationale: “天上的万象”更自然、明确地对应“天之军／天上众象”（צְבָא הַשָּׁמַיִם），且不将所指限缩为星辰或误作天使军队。
  - severity: medium
    issue: 第二个“那些跪拜、向耶和华起誓……”的动作衔接不够自然。
    rationale: 希伯来语以“敬拜者”及后续分词描述同一群人；汉语宜用“那些敬拜的人，就是……”使后面的起誓行为作为对该群体的说明。
  - severity: low
    issue: “却又”比原文的并列连词略强。
    rationale: 原文以连词并列两项起誓；先知语境确有冲突，但正文用“又”可更直接保留原文句法，谴责意味由上下文自然呈现。
  revised_text: 还有那些在屋顶上向天上的万象跪拜的人，以及那些敬拜的人，就是向耶和华起誓，又指着米勒公[a]起誓的人。
