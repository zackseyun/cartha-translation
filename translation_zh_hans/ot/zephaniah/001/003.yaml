id: ZEP.1.3
reference: Zephaniah 1:3
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אָסֵ֨ף אָדָ֜ם וּ/בְהֵמָ֗ה אָסֵ֤ף עוֹף הַ/שָּׁמַ֨יִם֙ וּ/דְגֵ֣י הַ/יָּ֔ם וְ/הַ/מַּכְשֵׁל֖וֹת אֶת הָ/רְשָׁעִ֑ים וְ/הִכְרַתִּ֣י אֶת הָ/אָדָ֗ם מֵ/עַ֛ל פְּנֵ֥י הָ/אֲדָמָ֖ה נְאֻם יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/001/003.yaml
  text: I will sweep away man and beast[a]; I will sweep away the birds of the heavens and the fish of the sea, and the stumbling blocks with the wicked[d][c][b]. And I will cut off man from the face of the ground,” declares Yahweh.
translation:
  language: zh_hans
  text: '“我要扫除人和走兽[a]；

    我要扫除空中的飞鸟、海里的鱼，

    也要扫除使人跌倒之物和恶人[b]。

    我要从地面上剪除人类[c]。”

    这是雅威的宣告。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “人”在这里是集合用法，指全人类；“走兽”也可译作“牲畜”或“动物”。
    reason: 说明两个集合名词的范围。
  - marker: b
    text: “使人跌倒之物”也可译作“绊脚石”或“导致败亡之物”。它与“恶人”的确切关系在原文中并不明确，也可理解为“连同恶人”。
    reason: 保留词义及紧缩句法的歧义。
  - marker: c
    text: “地面”也可译作“大地的表面”；原文用词可能有意呼应人从土地而来的审判语言。
    reason: 说明词义选择及可能的文学呼应。
lexical_decisions:
- source_word: אָסֵף
  choice: 扫除
  rationale: 此处使役形用于审判语境，表示彻底移除，而不是中性的“聚集”。“扫除”既保留强烈、全面的意味，也能在两次重复中形成原文的节奏。
- source_word: אָדָם
  choice: 人／人类
  rationale: 该词在本节是集合用法，指全体人类。首次与“走兽”并列时译作“人”，末句为避免误解为某个个体，译作“人类”。
- source_word: בְהֵמָה
  choice: 走兽
  rationale: 这里列举受造物的各大类别，并非专指家畜；“走兽”与飞鸟、鱼相配，适合庄重的创造与审判语境。
- source_word: עוֹף הַשָּׁמַיִם
  choice: 空中的飞鸟
  rationale: 自然表达希伯来语“诸天之鸟”，保留受造秩序的意象；脚注列出较形式对应的译法。
- source_word: דְגֵי הַיָּם
  choice: 海里的鱼
  rationale: 直接、自然地表达该组合词，并保留陆地、天空、海洋的排列。
- source_word: הַמַּכְשֵׁלוֹת
  choice: 使人跌倒之物
  rationale: 该复数名词通常指造成绊跌、失败或犯罪的事物。此处具体所指不明确，因此采用不强行限定为偶像或废墟的表达。
- source_word: אֶת הָרְשָׁעִים
  choice: 和恶人
  rationale: 原文在“使人跌倒之物”之后的结构紧缩，二者关系存在歧义。“和”保留并列或伴随的可能，不把恶人解释为前一名词的同位语。
- source_word: וְהִכְרַתִּי
  choice: 我要……剪除
  rationale: 使役形 כרת 在审判语境中有“剪除、使不复存在”之意；“剪除”保留其惯用而庄重的力度。
- source_word: מֵעַל פְּנֵי הָאֲדָמָה
  choice: 从地面上
  rationale: 以自然现代汉语表达“从土地的表面”，同时保留 אֲדָמָה 与 אָדָם 之间关于人和土地的语义呼应。
- source_word: נְאֻם יְהוָה
  choice: 这是雅威的宣告
  rationale: נְאֻם 是庄严的先知宣告公式；יְהוָה 按其专名译为“雅威”，而不以称号取代。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华／上主
  rationale: 原文直接使用四字神名。音译“雅威”保留其专名性质，避免以称号代替，也不把传统的另一种音译无说明地带入正文。
- issue: אָדָם 的集合意义
  choice: 人／人类
  alternative: 男人
  rationale: 这里不是专指男性，而是集合性地指全人类；译文依上下文分别采用自然的“人”和明确的“人类”。
- issue: “使人跌倒之物”与“恶人”的关系
  choice: 以“和”连接，保留压缩结构
  alternative: 使恶人跌倒之物／恶人连同他们的偶像
  rationale: 原文 אֶת הָרְשָׁעִים 与前项的句法关系不够明确。正文不把它解释成所有格、同位语或特定偶像崇拜关系，以保留真实的歧义。
translation_notes:
  register: 采用现代、庄重而易懂的先知性语言。“我要扫除”重复两次，以重现原文的审判节奏；分行呈现平行结构。避免古奥的“飞禽、海鱼”组合，也避免把不明确的“使人跌倒之物”具体化为某一类偶像或废墟。
