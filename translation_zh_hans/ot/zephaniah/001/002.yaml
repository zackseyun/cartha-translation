  text: אָסֹ֨ף אָסֵ֜ף כֹּ֗ל מֵ/עַ֛ל פְּנֵ֥י הָ/אֲדָמָ֖ה נְאֻם יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/001/002.yaml
  text: I will utterly sweep away everything from the face of the earth[a], declares Yahweh.
translation:
  language: zh_hans
  text: “我要从地面上彻底除去一切[a]。”雅威宣告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “地面”也可译作“大地”或“土地”。希伯来文以同一词根的不定式绝对形与未完成式动词并用加强语气，直译近似“收聚，我必收去”，表示彻底除去。
    reason: 说明אֲדָמָה的词义范围，以及אָסֹף אָסֵף的强调结构。
lexical_decisions:
- source_word: אָסֹף אָסֵף
  choice: 彻底除去
  rationale: 这是不定式绝对形与同词根限定动词并用的强调结构，表达行动的确定性和彻底性。在审判语境中，“彻底除去”比字面的“收聚”更自然，并保留全面移除的含义。
- source_word: כֹּל
  choice: 一切
  rationale: 此处为绝对用法，范围全面；“一切”简洁自然，也与下一节对人和动物的具体列举衔接。
- source_word: מֵעַל פְּנֵי הָאֲדָמָה
  choice: 从地面上
  rationale: 保留希伯来语“从……表面上”的空间意象；אֲדָמָה 可指地面、土地或大地，正文采用不预先限定为地方性或全球性的“地面”。
- source_word: נְאֻם יְהוָה
  choice: 雅威宣告说
  rationale: נְאֻם 是庄严的先知宣告公式；“宣告说”体现其权威语气，并以“雅威”音译神名 יְהוָה。
- source_word: יְהוָה
  choice: 雅威
  rationale: 直接音译四字神名，保留其作为以色列之神专名的性质，而不以称号替代。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；“雅威”是现代汉语中较贴近通常学术重构读音的音译，且不把专名改成称号。
- issue: 审判范围中 הָאֲדָמָה 的理解
  choice: 地面
  alternative: 大地；土地
  rationale: 该词本身可指地面、土地或大地。正文保留其词义张力，不仅凭 כֹּל 就明确限定为全球范围，也不把它缩小为某一地区。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“彻底除去”传达审判语境中的强烈语气；“雅威宣告说”保留先知公式的权威感。
