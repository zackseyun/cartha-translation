id: ZEP.1.6
reference: Zephaniah 1:6
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/אֶת הַ/נְּסוֹגִ֖ים מֵ/אַחֲרֵ֣י יְהוָ֑ה וַ/אֲשֶׁ֛ר לֹֽא בִקְשׁ֥וּ אֶת יְהוָ֖ה וְ/לֹ֥א דְרָשֻֽׁ/הוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/001/006.yaml
  text: and those who turn back from following Yahweh[c][b][a], and who do not seek Yahweh or inquire of him.
translation:
  language: zh_hans
  text: 以及那些退后、不再跟从雅威[a]的人[b]，还有那些不寻求雅威、也不求问他的人[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威”音译自希伯来文的神名יהוה（YHWH）；传统上也译作“耶和华”，或以“上主”代称。
    reason: alternative_reading
  - marker: b
    text: “退后、不再跟从雅威”也可译作“离弃雅威、不再跟从他”。
    reason: lexical_alternative
  - marker: c
    text: “求问他”也可译作“寻求他”；这里的希伯来动词含有寻求、查问的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנְּסוֹגִים
  choice: 退后
  rationale: 该词表示后退、退缩或转身离开；“退后”保留原文的动作意象，并在下文“不再跟从”中自然显明其背离之意。
- source_word: מֵאַחֲרֵי יְהוָה
  choice: 不再跟从雅威
  rationale: 希伯来语字面为“从雅威后面退开”，是停止跟从他的惯用表达；此译清楚自然，同时保留“跟从”的意象。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语中常见的音译呈现四字神名，保留其作为以色列之上帝专名的性质，而不以称号取代。
- source_word: בִקְשׁוּ
  choice: 寻求
  rationale: בקש在此表示寻求雅威；“寻求”既准确，也保留先知书中的圣约语境。
- source_word: דְרָשֻׁהוּ
  choice: 求问他
  rationale: דרש可指寻求、查问或求问。前面已有“寻求”，此处用“求问”既体现两个相关动词的修辞并列，也避免不必要的重复。
- source_word: וַאֲשֶׁר לֹא... וְלֹא
  choice: 还有那些不……也不……的人
  rationale: 明确表达原文并列的关系从句，并以现代汉语自然的“不……也不……”保留两项否定。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。正文采用音译“雅威”，使读者看见这是上帝向以色列启示的专名；脚注说明其希伯来文字形，避免将音译误当作普通称号。
- issue: “寻求”与“求问”的关系
  choice: 以两个相关但不同的汉语动词分别翻译 בקש 和 דרש
  alternative: 两处均译作“寻求”
  rationale: 原文使用两个意义重叠的动词，强调百姓对雅威的全然漠视。分别译为“寻求”和“求问”可保留修辞层次，但不把二者解释成截然不同的神学行为。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“退后、不再跟从”既保留希伯来文的后退意象，也清楚表达停止跟从；两个并列分句以“以及……还有……”衔接，适合本节作为上一节审判对象清单的延续。
