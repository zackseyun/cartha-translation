  text: וְ/הָיָה֙ בָּ/עֵ֣ת הַ/הִ֔יא אֲחַפֵּ֥שׂ אֶת יְרוּשָׁלִַ֖ם בַּ/נֵּר֑וֹת וּ/פָקַדְתִּ֣י עַל הָ/אֲנָשִׁ֗ים הַ/קֹּֽפְאִים֙ עַל שִׁמְרֵי/הֶ֔ם הָ/אֹֽמְרִים֙ בִּ/לְבָבָ֔/ם לֹֽא יֵיטִ֥יב יְהוָ֖ה וְ/לֹ֥א יָרֵֽעַ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/001/012.yaml
  text: 'And it will happen at that time: I will search Jerusalem with lamps, and I will punish the men who have grown thick on their dregs, who say in their hearts, ''The LORD will not do good, nor will he do harm.'''
translation:
  language: zh_hans
  text: 到那时，我必提着灯搜查耶路撒冷；我必惩罚那些凝滞在酒渣上的人[a]。他们心里说：“耶和华不会赐福，也不会降祸。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “凝滞在酒渣上”原文描写酒长期不被倒换，停留在酒渣上而变得浓稠；比喻这些人安逸自满、麻木不动。
    reason: 保留原文酿酒意象及其“凝滞”的动作，避免误解为人实际坐在酒渣上，同时简要说明其隐喻含义。
lexical_decisions:
- source_word: אֲחַפֵּשׂ ... בַּנֵּרוֹת
  choice: 提着灯搜查
  rationale: 保留“以灯搜寻”的具体意象，同时用现代汉语自然表达彻底查察之意。
- source_word: וּפָקַדְתִּי עַל
  choice: 我必惩罚
  rationale: פקד על 在审判语境中表示追究、惩处；此处译作“惩罚”清楚自然。
- source_word: הַקֹּפְאִים עַל שִׁמְרֵיהֶם
  choice: 安坐在酒渣上的人
  rationale: 直译并保留酿酒比喻；קפא 表示凝结、停滞，意象指长期安逸而麻木的人，具体含义由脚注说明。
- source_word: יֵיטִיב
  choice: 赐福
  rationale: 此处使役词义为“使之得好处、施惠”；“赐福”在耶和华施行善待的语境中简洁自然。
- source_word: יָרֵעַ
  choice: 降祸
  rationale: 此处使役词义为“使遭祸患”；译作“降祸”与“赐福”对举，并避免被理解为道德上作恶。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的专名形式，区别于普通称号“主”。
theological_decisions:
- issue: 百姓否认耶和华介入世事
  choice: “不会赐福，也不会降祸”
  alternative: “既不行善，也不作恶”
  rationale: 原文对举的是神带来福祉或灾祸的行动，并非质疑神的道德品格；此译保留他们否认神施行赏罚的神学张力。
- issue: 酒渣意象的解释程度
  choice: 正文保留比喻，脚注解释
  alternative: 正文释义为“安逸麻木的人”
  rationale: 原文意象鲜明且可能同时包含停滞、安逸、自满等意味，不宜在正文中只固定为一种解释。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“到那时”承接先知审判语境；分号和句号使神的行动与被审判者的内心言论层次清楚。
