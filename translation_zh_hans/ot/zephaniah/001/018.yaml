source:
  edition: WLC
  text: גַּם כַּסְפָּ֨/ם גַּם זְהָבָ֜/ם לֹֽא יוּכַ֣ל לְ/הַצִּילָ֗/ם בְּ/יוֹם֙ עֶבְרַ֣ת יְהוָ֔ה וּ/בְ/אֵשׁ֙ קִנְאָת֔/וֹ תֵּאָכֵ֖ל כָּל הָ/אָ֑רֶץ כִּֽי כָלָ֤ה אַךְ נִבְהָלָה֙ יַֽעֲשֶׂ֔ה אֵ֥ת כָּל יֹשְׁבֵ֖י הָ/אָֽרֶץ־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/001/018.yaml
  text: Neither their silver nor their gold will be able to deliver them on the day of Yahweh’s wrath[a], and in the fire of his jealousy all the earth will be consumed; for he will make a complete, indeed sudden[c][b], end of all the inhabitants of the earth.
translation:
  language: zh_hans
  text: 他们的金银都不能在雅威愤怒的日子救他们。全地[b]必被他嫉妒之火[a]吞噬；因为他必使全地所有的居民彻底灭绝，而且这毁灭必骤然而至[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “嫉妒”也可译作“热忱”或“热心”。
    reason: 保留 קִנְאָה 的词义可能；正文保留其在盟约语境中的排他性意味。
  - marker: b
    text: “全地”也可理解为“全境”。希伯来语 אֶרֶץ 可指一片土地，也可指整个大地；本节两处“全地”均有此范围歧义。
    reason: 保留 אֶרֶץ 的地域性与普世性范围歧义。
  - marker: c
    text: “彻底灭绝，而且这毁灭必骤然而至”所译的希伯来语较难确定；也可理解为“施行彻底而可怕的毁灭”或“施行完全、令人惊恐的终局”。
    reason: 说明 כָּלָה אַךְ נִבְהָלָה 的句法和词义不确定性，同时避免在正文中过度确定其细微含义。
lexical_decisions:
- source_word: גַּם כַּסְפָּם גַּם זְהָבָם לֹא
  choice: 他们的金银都不能
  rationale: 否定词与“也……也……”配合，表示金和银无一能够施救；汉语用“金银都不能”自然且保留强调。
- source_word: יוּכַל לְהַצִּילָם
  choice: 能……救他们
  rationale: 该结构表达能力上的否定；“救”简洁地传达从迫近灾祸中搭救之意。
- source_word: בְּיוֹם עֶבְרַת יְהוָה
  choice: 在雅威发怒的日子
  rationale: עֶבְרָה指盛怒、烈怒；译作“发怒”符合现代汉语。神名 יְהוָה 音译为“雅威”，不以称号替代。
- source_word: וּבְאֵשׁ קִנְאָתוֹ
  choice: 被他嫉妒的烈火
  rationale: קִנְאָה兼有“嫉妒”和“热忱”之意；正文采用“嫉妒”，保留盟约关系中排他的情感力度。“烈火”使汉语火焰意象自然。
- source_word: תֵּאָכֵל כָּל הָאָרֶץ
  choice: 全地都必被……吞噬
  rationale: Niphal形态表达被动结果；“吞噬”保留火的生动意象。הָאָרֶץ可指地或大地，正文用“全地”以保留汉语中的范围弹性。
- source_word: כָּלָה אַךְ נִבְהָלָה
  choice: 彻底灭亡，而且骤然临到
  rationale: 这是难解短语。כָּלָה表达完全的终结，אַךְ加强语气，נִבְהָלָה可指仓促、突然，也可能带有可怕之意；正文采用“骤然”并以脚注保存另一理解。
- source_word: כָּל יֹשְׁבֵי הָאָרֶץ
  choice: 全地所有的居民
  rationale: 紧贴希伯来语，同时让“地”保有地区或普世范围的语义可能。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；音译“雅威”保留其作为以色列之神专名的功能。
- issue: הָאָרֶץ 的范围
  choice: 全地
  alternative: 整个大地；全境
  rationale: 该词既可指一片土地，也可指全地。采用“全地”而不另加“世界”，避免将先知话语的范围过早限定为地域性或普世性。
- issue: 神的 קִנְאָה
  choice: 嫉妒
  alternative: 热忱
  rationale: “嫉妒”保留盟约关系中要求专一的意味；脚注说明“热忱”也是词义可能。
- issue: כָּלָה אַךְ נִבְהָלָה 的性质
  choice: 彻底灭亡，而且骤然临到
  alternative: 彻底而可怕地灭亡
  rationale: 希伯来语表达艰深，可强调突然而迅速，也可带有惊恐、可怕的色彩；正文不把次要可能完全排除，并以脚注说明。
translation_notes:
  register: 采用庄重而清楚的现代标准普通话。以短句呈现审判宣告的力度；保留“全地”的范围弹性，并通过脚注呈现关键词的真实歧义。
