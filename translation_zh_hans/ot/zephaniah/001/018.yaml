  terminology: “雅威”“金银”“全地”“嫉妒”“吞噬”均可保留。“嫉妒之火”忠实对应“他嫉妒的火”；脚注保留“热忱”这一可行替代。“全地”恰当地保留了אֶרֶץ可指土地或大地的范围歧义。
