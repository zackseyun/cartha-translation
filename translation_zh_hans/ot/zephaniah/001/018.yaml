revisions:
- from: 他们的金银都不能在雅威发怒的日子救他们。全地都必被他嫉妒的烈火吞噬[a]；因为他必使全地所有的居民彻底灭亡，而且骤然临到[b]。
  to: 他们的金银都不能在雅威愤怒的日子救他们。全地[b]必被他嫉妒之火[a]吞噬；因为他必使全地所有的居民彻底灭绝，而且这毁灭必骤然而至[c]。
  rationale: 修订仅澄清末句的句法与所指，并将词义范围脚注分别锚定于“嫉妒之火”和“全地”。“嫉妒之火”比“嫉妒的烈火”更自然，仍忠实保留原文的火与嫉妒之间的属格关系。末句以“这毁灭必骤然而至”呈现英文审计轨迹所采纳的“sudden”，同时以脚注保留“可怕／令人惊恐”等有根据的替代理解。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T08:16:19Z'
