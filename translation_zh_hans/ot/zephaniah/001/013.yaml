base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/001/013.yaml
  text: Their wealth will become plunder[a], and their houses a desolation; they will build houses but not inhabit them[b], and plant vineyards but not drink their wine.
translation:
  language: zh_hans
  text: 他们的财物必成掠物[a]；他们的房屋必荒废[b]。他们必建造房屋，却不得居住；必栽种葡萄园，却不得喝所产的酒。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “财物”也可译作“资财”；原词还可指“力量”或“军队”，但在本节语境中后两种理解可能性较小。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“他们的房屋归于荒凉”，指房屋将被毁坏、荒废，且无人居住。
    reason: lexical_clarification
lexical_decisions:
- source_word: חֵילָם
  choice: 他们的财物
  rationale: חַיִל 可指力量、财富、资财或军队；这里与房屋、葡萄园等产业并列，又将成为抢掠之物，因此译为“财物”最贴合语境，同时以脚注保留其他可能。
- source_word: לִמְשִׁסָּה
  choice: 必遭抢掠
  rationale: מְשִׁסָּה 指被劫掠之物；译作“遭抢掠”以自然中文表达结果关系，并保留审判语境。
- source_word: וּבָתֵּיהֶם לִשְׁמָמָה
  choice: 他们的房屋必成荒场
  rationale: 介词 לְ 表示结果；“必成荒场”保留名词 שְׁמָמָה 所表达的荒废、无人景象，也传达原文简峻的预言语气。
- source_word: וּבָנוּ בָתִּים וְלֹא יֵשֵׁבוּ
  choice: 他们建造房屋，却不得居住
  rationale: 在预言性上下文中，连接式完成时具有将来指向；中文用“却不得”自然表达他们不能享用自己所建之物。原文未明说“在其中”，中文可由“房屋”直接领会。
- source_word: וְנָטְעוּ כְרָמִים
  choice: 栽种葡萄园
  rationale: 直接保留农业定居与兴盛的意象，并与随后不能享用出产形成反差。
- source_word: וְלֹא יִשְׁתּוּ אֶת יֵינָם
  choice: 却喝不到自己的酒
  rationale: יֵינָם 直译为“他们的酒”；“自己的酒”在中文中自然表达本应属于并由他们享用的葡萄酒，保留原文的讽刺反差。
