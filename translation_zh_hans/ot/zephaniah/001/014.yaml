revisions:
- from: 雅威那伟大的日子临近了——临近了，来得极快。雅威之日的声响[a]！勇士在那里凄厉地呼喊。[b]
  to: 雅威伟大的日子临近了——临近了，来得极快。雅威之日的声响[a]：勇士在那里悲痛地呼喊。[b]
  rationale: 删去原文未明示且使中文略显生硬的“那”；将“凄厉地”改为“悲痛地”，以准确表达 מַר 的悲苦意味；并以冒号连接“雅威之日的声响”和勇士的呼喊，较好地保留原文突兀而关联的结构。脚注 b 随正文用词同步更新。
