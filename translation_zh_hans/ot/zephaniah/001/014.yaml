base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/001/014.yaml
  text: 'The great day of Yahweh is near—near and coming very quickly. The sound of the day of Yahweh: there the warrior cries out bitterly.'
translation:
  language: zh_hans
  text: 雅威伟大的日子临近了——临近了，来得极快。雅威之日的声响[a]：勇士在那里悲痛地呼喊。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“雅威之日的声音”；希伯来词“科勒”（qol）可指“声响”“声音”或“响声”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“强者在那里悲痛地呼喊。”
    reason: alternative_reading
lexical_decisions:
- source_word: קָרוֹב
  choice: 临近了
  rationale: 作谓语形容词，表示迫近；重复译出，以保留原文强调。
- source_word: יוֹם יְהוָה
  choice: 雅威之日
  rationale: 保留先知文学中表示上帝施行审判的固定表达及其属格关系。首句为使现代汉语自然，展开为“雅威那伟大的日子”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文四字神名的常用现代汉语音译处理，保留其专名性质，不以称号代替。
- source_word: הַגָּדוֹל
  choice: 伟大的
  rationale: 对应“伟大、重大”，不从其他经文增添“可怕”等原文没有的限定。
- source_word: וּמַהֵר מְאֹד
  choice: 来得极快
  rationale: 在自然汉语中表达迅速来到的时间意义，并保留 מְאֹד 的强烈程度。
- source_word: קוֹל
  choice: 声响
  rationale: 该词可指声音、嗓音或响声；“声响”较宽泛，不预先指定发声者。
- source_word: מַר
  choice: 凄厉地
  rationale: 与“呼喊”搭配作方式状语，传达痛苦、悲苦而尖锐的呼声。
- source_word: צֹרֵחַ
  choice: 呼喊
  rationale: 表达大声喊叫，语体庄重而不过度渲染。
- source_word: שָׁם
  choice: 在那里
  rationale: 按其通常的地点副词意义翻译，指向审判发生的场景。
- source_word: גִּבּוֹר
  choice: 勇士
  rationale: 在审判语境中指强壮善战之人；“勇士”简洁保留其军事形象。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名，因此采用现代汉语音译“雅威”，保留其作为以色列之上帝专名的性质。
- issue: 末句 גִּבּוֹר 的所指
  choice: 勇士在那里凄厉地呼喊
  alternative: 强者在那里凄厉地呼喊
  rationale: “勇士”符合该词常见的战士含义，也显出审判临到时连勇猛之人也哀号；同时不把这一形象扩展成原文未明说的神学论断。
- issue: קוֹל יוֹם יְהוָה 的突兀结构
  choice: 雅威之日的声响！
  alternative: 雅威之日的声音；雅威之日响起声音
  rationale: 保留原文名词短语的突兀和戏剧性，不擅自补出发声主体或完整谓语。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。首句以破折号保留重复所形成的紧迫感；第二句用感叹号再现希伯来文短促、突兀的警报效果。
