base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/001/011.yaml
  text: Wail[a], inhabitants of the Mortar, for all the merchant people are destroyed[b]; all who weigh out silver are cut off.
translation:
  language: zh_hans
  text: 玛革提施[a]的居民哪，你们要哀号！因为所有商人[b]都灭亡了；所有称量银子的人都被剪除了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语为“玛革提施”（Maktesh），字面意思是“臼”。这很可能是耶路撒冷一处地区、或市场区的名称，或许因其低洼如臼的地势或商业活动而得名。
    reason: alternative_reading
  - marker: b
    text: 或译：“所有迦南人”。“迦南”在这里很可能指“商人”；希伯来语在商业语境中可有这种用法。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵילִילוּ
  choice: 要哀号
  rationale: 这是动词 ילל 的复数命令式，指灾祸临到时发出的悲痛呼号；“哀号”既鲜明又符合现代汉语的先知审判语体。
- source_word: יֹשְׁבֵי
  choice: 住在……的居民
  rationale: ישב 的分词构造式在此作名词用，集体称呼当地居住者；此译法自然保留了直接呼告。
- source_word: הַמַּכְתֵּשׁ
  choice: 臼谷
  rationale: 原词字面指捣物用的“臼”，在这里很可能是耶路撒冷一处低洼商业区的名称。“臼谷”既体现其字面形象，也让中文读者明确这是地名；不确定性留在脚注说明。
- source_word: כִּי
  choice: 因为
  rationale: 引出居民应当哀号的原因，现代汉语用“因为”清楚自然。
- source_word: נִדְמָה
  choice: 都灭亡了
  rationale: דמה 的尼法勒式在此语境中表达被毁、归于无有。主语虽为集合性单数，中文可自然地用“都”表达群体整体遭毁灭，并与下句“被剪除”形成平行。
- source_word: כָּל עַם כְּנַעַן
  choice: 所有商民
  rationale: כְּנַעַן 字面可指“迦南”，也可在商业语境中指商人；下句提到称量银子，支持商贸含义。“商民”保留 עַם 的群体色彩，同时脚注保存字面读法。
- source_word: נִכְרְתוּ
  choice: 被剪除了
  rationale: כרת 的尼法勒式常指“被剪除”，是先知审判语言中的固定而有力的表达。
- source_word: כָּל נְטִילֵי כָסֶף
  choice: 凡称量银子的
  rationale: 在商业语境中，此语最可能指称量银子以进行交易的人，而非仅仅搬运银子者；“称量银子”也反映古代银子按重量交易的背景。
theological_decisions: []
