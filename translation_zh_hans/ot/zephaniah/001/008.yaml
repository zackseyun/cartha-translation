source:
  edition: WLC
  text: וְ/הָיָ֗ה בְּ/יוֹם֙ זֶ֣בַח יְהוָ֔ה וּ/פָקַדְתִּ֥י עַל הַ/שָּׂרִ֖ים וְ/עַל בְּנֵ֣י הַ/מֶּ֑לֶךְ וְ/עַ֥ל כָּל הַ/לֹּבְשִׁ֖ים מַלְבּ֥וּשׁ נָכְרִֽי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/001/008.yaml
  text: And on the day of Yahweh’s sacrifice[a], I will punish the officials, the king’s sons[c][b], and all who wear foreign clothing.
translation:
  language: zh_hans
  text: 到了雅威的祭[a]那一天，我必惩罚众首领[b]、王的众子，以及所有穿外邦服装的人[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“献给雅威的祭”。结合1:7，这句话也可能令人想到雅威在审判中预备的一场献祭筵席。
    reason: 保留希伯来语属格关系及上下文审判意象的歧义。
  - marker: b
    text: “首领”也可译作“官长”或“统治者”。
    reason: 说明שׂרים在政治和社会地位方面的语义范围。
  - marker: c
    text: 指与外邦人有关的服装；这表达可能暗示接受外邦习俗或效忠外邦势力，不一定只是在说衣料或产地。
    reason: 补充古代文化语境，并避免把经文缩减为对服装来源的批评。
lexical_decisions:
- source_word: וְהָיָה בְּיוֹם
  choice: 到了……那一天
  rationale: 这一表达引出将来发生之事；“到了……那一天”既保留先知话语的未来时间指向，也符合现代汉语习惯。
- source_word: זֶבַח יְהוָה
  choice: 雅威的祭
  rationale: 直译属格结构，不武断判定雅威是献祭者、祭物的主人，还是设摆审判筵席者；上下文中的献祭与审判意象由脚注说明。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，保留其作为专名的性质，而不以称号替代。
- source_word: וּפָקַדְתִּי עַל
  choice: 我必惩罚
  rationale: פקד与עַל连用，在此审判语境中表示追讨罪责、施行惩罚；“我必惩罚”清楚传达其司法意味。
- source_word: הַשָּׂרִים
  choice: 众首领
  rationale: שׂרים指居高位的统治者或官员；“首领”保留其领导和权势意味，同时不与后面的王室成员混同。
- source_word: בְּנֵי הַמֶּלֶךְ
  choice: 王的众子
  rationale: 按原文保留亲属关系和复数，不把它仅仅处理成可能带有固定爵位意味的“王子”。
- source_word: כָּל הַלֹּבְשִׁים
  choice: 所有穿……的人
  rationale: 以自然的现代汉语关系结构表达希伯来语分词短语。
- source_word: מַלְבּוּשׁ נָכְרִי
  choice: 外邦服装
  rationale: נָכְרִי表示属于外族或异邦的；“外邦服装”比“奇装异服”更准确，避免把重点误解为衣着怪异。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。正文采用“雅威”，以专名而非称号呈现，并避免将较晚形成的混合读音当作原始发音。
- issue: “雅威的祭”中属格关系与审判意象
  choice: 正文保留“雅威的祭”的简洁属格表达
  alternative: 雅威所献的祭；献给雅威的祭；雅威摆设的祭筵
  rationale: 希伯来语构词本身没有完全说明属格关系；结合1:7可见雅威预备祭物的审判筵席意象，但正文不应把这一解释写死。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“到了……那一天”使预言的时间推进清楚；“王的众子”略带经文语体，但准确保留原文亲属称谓。所有脚注标记均紧随其所解释的词语。
