  text: וְ/הָיָה֩ בַ/יּ֨וֹם הַ/ה֜וּא נְאֻם יְהוָ֗ה ק֤וֹל צְעָקָה֙ מִ/שַּׁ֣עַר הַ/דָּגִ֔ים וִֽ/ילָלָ֖ה מִן הַ/מִּשְׁנֶ֑ה וְ/שֶׁ֥בֶר גָּד֖וֹל מֵ/הַ/גְּבָעֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/001/010.yaml
  text: And on that day[a], declares Yahweh, there will be the sound of a cry from the Fish Gate, and a wail from the Second Quarter[c][b], and a great crash from the hills.
translation:
  language: zh_hans
  text: 到那日，雅威宣告：必有呼喊声从鱼门传来，有哀号声从第二城区传来，又有巨大的崩裂声从山冈传来。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “第二城区”原文为“米示拿”，可能指耶路撒冷的一个城区。
    reason: cultural_note
  - marker: b
    text: “崩裂声”也可译作“大毁灭”或“巨大的破碎”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה בַיּוֹם הַהוּא
  choice: 到那日……必传来
  rationale: 先用自然的现代汉语保留先知书的时间公式，再以“必传来”统摄随后三个并列的声音意象。
- source_word: נְאֻם יְהוָה
  choice: 雅威宣告
  rationale: 保留先知宣告公式，并按项目惯例以“雅威”呈现神的专名。
- source_word: קוֹל צְעָקָה
  choice: 呼喊声
  rationale: 兼顾 קוֹל 的声音含义和 צְעָקָה 的呼喊、求救或惊叫之意；不在正文中限定呼喊的具体性质。
- source_word: מִשַּׁעַר הַדָּגִים
  choice: 从鱼门
  rationale: 将已知的耶路撒冷城门名称译为简洁自然的专名“鱼门”。
- source_word: וִילָלָה
  choice: 哀号声
  rationale: 表达痛苦、灾难中的高声哀哭，并与本节的听觉意象协调。
- source_word: מִן הַמִּשְׁנֶה
  choice: 从新城区
  rationale: הַמִּשְׁנֶה 在此很可能是耶路撒冷一个称为“第二”或“新区”的城区；正文采用较自然的地名式译法，并以脚注保留原词及另一译法。
- source_word: וְשֶׁבֶר גָּדוֹל
  choice: 巨大的崩裂声
  rationale: שֶׁבֶר 可指破裂、崩毁或毁灭；上下文连续描写所听见的声音，因此译入“声”，同时保留破坏性含义。
- source_word: מֵהַגְּבָעוֹת
  choice: 从众山冈
  rationale: 按 גְּבָעוֹת 的通常意义译作复数“山冈”，不武断认定是城内高地还是周边地形。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；“雅威”较直接地呈现其专名性质，也符合项目给定惯例。
- issue: שֶׁבֶר 的声音或毁灭含义
  choice: 崩裂声
  alternative: 大毁灭；巨大的破碎
  rationale: 三个并列分句形成“呼喊声—哀号声—崩裂声”的听觉序列，但该词本身也可强调毁灭，故以脚注保存语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的先知书语体。破折号突出插入的神谕公式；三个“必传来”形成平行节奏，并保留原文由不同地点接连传出灾难声响的推进感。
