revisions:
- from: 我必使世人陷入困苦[a]；他们必像盲人一样行走，因为他们得罪了雅威。他们的血必如尘土般倾倒，他们的血肉[b]必如粪土。
  to: 我必使世人陷入困苦[a]；他们必像盲人一样行走，因为他们得罪了雅威。他们的血必被倾倒，如尘土一般；他们的肉体[b]必如粪土。
  rationale: 将“血肉”改为“肉体”，使“血”与第二身体物质的并列关系在汉语中清晰可见，同时保留罕见词的语义不确定性于脚注。微调血被倾倒的语序，以更直接呈现原文的被动式和“如尘土”的比较。其余措辞准确、自然，神名及脚注锚点均予保留。
