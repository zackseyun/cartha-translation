  text: וַ/הֲצֵרֹ֣תִי לָ/אָדָ֗ם וְ/הָֽלְכוּ֙ כַּֽ/עִוְרִ֔ים כִּ֥י לַֽ/יהוָ֖ה חָטָ֑אוּ וְ/שֻׁפַּ֤ךְ דָּמָ/ם֙ כֶּֽ/עָפָ֔ר וּ/לְחֻמָ֖/ם כַּ/גְּלָלִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/001/017.yaml
  text: And I will bring distress on mankind[a], and they will walk like the blind, because they have sinned against Yahweh; their blood will be poured out like dust[b], and their flesh like dung.
translation:
  language: zh_hans
  text: 我必使世人陷入困苦[a]；他们必像盲人一样行走，因为他们得罪了雅威。他们的血必被倾倒，如尘土一般；他们的肉体[b]必如粪土。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “世人”：原文“人”为单数形式，但在这里具有集合意义，也可译作“人类”。
    reason: 说明希伯来文单数集合名词的语法形式及语义范围。
  - marker: b
    text: “肉体”：原文词义不确定，也可能更具体地指“内脏”或“肠子”。
    reason: 保留罕见希伯来词的词义歧义，避免正文作过度确定的解释。
lexical_decisions:
- source_word: וַהֲצֵרֹתִי
  choice: 我必使……陷入困苦
  rationale: 该词为צרר的使役形式，表达使人受困、遭受苦难；此译保留上帝主动施行审判的语气，同时符合现代汉语表达。
- source_word: לָאָדָם
  choice: 世人
  rationale: אָדָם虽为单数形式，此处却具有集合意义，泛指人类；“世人”自然、庄重，也能与后面的复数代词相衔接。
- source_word: וְהָלְכוּ כַּעִוְרִים
  choice: 他们必像盲人一样行走
  rationale: 直译并保留人在审判中失去方向、无助摸索的具体意象。
- source_word: כִּי לַיהוָה חָטָאוּ
  choice: 因为他们得罪了雅威
  rationale: כִּי说明审判的原因；חטא与ל连用表示冒犯、得罪某一对象。“得罪了雅威”在汉语中准确而自然。
- source_word: לַיהוָה
  choice: 雅威
  rationale: 原文直接使用四字神名יהוה；采用“雅威”音译，以保留其专名性质。
- source_word: וְשֻׁפַּךְ דָּמָם כֶּעָפָר
  choice: 他们的血必如尘土般倾倒
  rationale: 保留被动式、血被倾倒的暴力审判意象，以及“如尘土”所表达的遍地散落和毫无珍惜。
- source_word: וּלְחֻמָם
  choice: 他们的血肉
  rationale: 此处名词罕见且词义有争议，可理解为肉体，也可更具体地理解为内脏。“血肉”与上句“血”形成自然的身体意象，同时在脚注中保留较具体的可能译法。
- source_word: כַּגְּלָלִים
  choice: 如粪土
  rationale: גְּלָלִים指粪便；“粪土”直接保留令人厌恶、遭弃置践踏的审判图景，并具有庄重的书面语色彩。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文使用上帝的专名，而非称号；音译“雅威”保留专名性质，不以“主”替代，也不额外引入解释。
- issue: אָדָם的集合意义
  choice: 世人
  alternative: 人／人类
  rationale: 希伯来文为单数集合名词，后续动词却用复数，表明所指是整体人群。“世人”既传达集合意义，又不把经文限定为某一个人或仅男性。
- issue: וּלְחֻמָם所指的身体部分
  choice: 血肉
  alternative: 内脏／肠子
  rationale: 该词的具体所指并不确定。正文采用较宽泛的“血肉”，不武断限定其解剖学含义；脚注明确保留“内脏”的可能解释。
translation_notes:
  register: 采用现代、庄重而清晰的标准普通话。“陷入困苦”传达使役性的审判行动；两个“如……”结构保留原文鲜明而严厉的平行意象。正文不过度淡化血、粪土等措辞，也不把罕见词וּלְחֻמָם的歧义悄然消除。
