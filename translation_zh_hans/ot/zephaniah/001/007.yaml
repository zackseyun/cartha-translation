id: ZEP.1.7
reference: Zephaniah 1:7
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: הַ֕ס מִ/פְּנֵ֖י אֲדֹנָ֣/י יְהוִ֑ה כִּ֤י קָרוֹב֙ י֣וֹם יְהוָ֔ה כִּֽי הֵכִ֧ין יְהוָ֛ה זֶ֖בַח הִקְדִּ֥ישׁ קְרֻאָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/001/007.yaml
  text: Be silent before the Lord GOD[a], for the day of Yahweh is near; for Yahweh has prepared a sacrifice; he has consecrated his invited ones.
translation:
  language: zh_hans
  text: 在主雅威面前要肃静！因为雅威的日子近了；雅威已经预备祭牲，把他所召的人[a]分别为圣。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他所召的人”也可译作“他邀请的人”“他的宾客”或“蒙他呼召的人”。在本节的献祭意象中，这可能指雅威召来参与这场审判的人，但原文没有明说他们的身份。
    reason: 说明 קְרֻאָיו 的词义范围，并保留献祭审判意象中人物身份的歧义。
lexical_decisions:
- source_word: הַס
  choice: 要肃静
  rationale: 这是要求安静的感叹词或命令语。“肃静”既保留简短有力的命令语气，也符合面对神时庄严肃穆的语境。
- source_word: מִפְּנֵי
  choice: 在……面前
  rationale: 在要求静默并以神为对象的语境中，这一介词短语表示“在……面前”或“在……临在中”；所选译法自然简洁。
- source_word: אֲדֹנָי יְהוִה
  choice: 主雅威
  rationale: 保留 אֲדֹנָי 的“主”与神名 יְהוָה 的区别，并用“雅威”音译神名，避免译成重复的“主主”。
- source_word: כִּי
  choice: 因为
  rationale: 第一个 כִּי 说明为何应当肃静；第二个 כִּי 进一步说明雅威之日临近的背景。中文用一次“因为”引出整组理由，并以分号自然衔接后句，避免重复而不损失逻辑。
- source_word: קָרוֹב
  choice: 近了
  rationale: 表达该日迫近，保留先知话语中的紧迫感。
- source_word: יוֹם יְהוָה
  choice: 雅威的日子
  rationale: 按原文保留“雅威的日子”这一先知性表达，不在正文中展开解释其审判含义。
- source_word: הֵכִין
  choice: 已经预备
  rationale: 完成式将行动呈现为已经成就、确定无疑；“已经预备”也直接配合献祭意象。
- source_word: זֶבַח
  choice: 祭牲
  rationale: 该词指献上的祭物或祭献；“祭牲”保留献祭语域及本节隐含的宰杀意象，同时不直接把比喻解释为某一群人的死亡。
- source_word: הִקְדִּישׁ
  choice: 分别为圣
  rationale: 该使役动词意为使之成为圣洁、为神圣用途分别出来；“分别为圣”保留献祭语境中的礼仪色彩。
- source_word: קְרֻאָיו
  choice: 他所召的人
  rationale: 该被动分词可指被呼召、召来或邀请的人。“所召的人”在中文中保留其身份和角色的开放性，不预先断定他们是宾客、行刑者还是祭牲。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威；复合称号译作“主雅威”
  alternative: 耶和华；主耶和华；以“上主”代替神名
  rationale: 原文明确使用四字神名。音译“雅威”保留其作为专名的性质；在 אֲדֹנָי יְהוִה 中同时保留“主”这一称号。
- issue: 献祭意象的所指
  choice: 正文保留雅威预备祭牲、把所召之人分别为圣的意象，不明确指定各方身份
  alternative: 把祭牲明确解释为犹大居民，或把所召的人明确解释为外邦军队、宾客或受审判者
  rationale: 希伯来文本刻意简洁，既有献祭也有宴席和审判的联想。正文保留这种张力，脚注仅提示词义与语境中的可能理解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“肃静”“祭牲”“分别为圣”维持先知宣告与礼仪意象的庄严语域；句式简洁有力。脚注标记置于其实际说明的“他所召的人”之后。
