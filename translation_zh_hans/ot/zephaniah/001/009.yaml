  text: וּ/פָקַדְתִּ֗י עַ֧ל כָּל הַ/דּוֹלֵ֛ג עַל הַ/מִּפְתָּ֖ן בַּ/יּ֣וֹם הַ/ה֑וּא הַֽ/מְמַלְאִ֛ים בֵּ֥ית אֲדֹנֵי/הֶ֖ם חָמָ֥ס וּ/מִרְמָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/001/009.yaml
  text: And on that day I will punish all who leap over the threshold[b][a], who fill their masters’ house with violence and deceit.
translation:
  language: zh_hans
  text: 到那日，我必惩罚所有跃过门槛的人[a]；他们以暴力和诡诈充满他们主人的家[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “跃过门槛”也可译作“跳过门槛”。这句话可能指某种已知的仪式或迷信习俗，或与《撒母耳记上》5:5所述的门槛禁忌相呼应；也有人认为，这是形容人强行闯入。
    reason: 保留原文短语的文化含混性及主要解释可能。
  - marker: b
    text: 原文直译作“他们主人的家”；也有译本作“他们的主的家”。
    reason: 说明所属关系及其可能的词汇解释，不在正文中暗示神圣所指。
lexical_decisions:
- source_word: וּפָקַדְתִּי
  choice: 我必惩罚
  rationale: 在先知宣告审判的语境中，פקד表示追究罪责、施行惩罚；此译清楚传达司法性的审判。
- source_word: הַדּוֹלֵג עַל הַמִּפְתָּן
  choice: 跳过门槛的人
  rationale: דָּלַג指跳跃、跃过。保留具体而含义未尽明的动作，不在正文中断定它是某种仪式、迷信或闯入行为。
- source_word: הַמִּפְתָּן
  choice: 门槛
  rationale: מִפְתָּן指门口的门槛；“门槛”是现代汉语中准确、自然的对应词。
- source_word: בַּיּוֹם הַהוּא
  choice: 到那日
  rationale: 保留先知书常见的审判时间公式，同时符合庄重而自然的现代汉语表达。
- source_word: הַמְמַלְאִים
  choice: 他们……充满
  rationale: 该分词描述前述那群人的特征或惯常行为；用承接分句表达，可避免生硬重复“那些人”，并保留指称关系。
- source_word: בֵּית אֲדֹנֵיהֶם
  choice: 自己主人的家
  rationale: אֲדֹנֵיהֶם在形式上带第三人称阳性复数后缀，按分配关系可自然理解为这些人各自的主人；不将其神学化为“主的殿”。
- source_word: חָמָס
  choice: 暴力
  rationale: חָמָס常指暴力、不公和残暴恶行；“暴力”保留其直接而强烈的道德含义。
- source_word: מִרְמָה
  choice: 欺诈
  rationale: מִרְמָה可指欺骗、欺诈或诡诈；此处与借暴力使主人家中充满财物的图景相配，“欺诈”较能表达以不正当手段攫取利益。
theological_decisions:
- issue: “跳过门槛”的含义
  choice: 正文保留字面的具体动作，不断定其所指。
  alternative: 可理解为某种门槛禁忌或宗教习俗，也可理解为强行闯入、掠夺的形象说法。
  rationale: 希伯来文本没有解释这一行为；直译能够保留其文化上的含混性和可能的多重指向。
- issue: “自己主人的家”的所指
  choice: 按社会关系理解为作恶者各自主人的家。
  alternative: “他们的主的家”或将其理解为神的殿。
  rationale: 原文形式自然支持复数所属关系，且没有明示神圣称谓；译文不应擅自引入神的殿这一解释。
translation_notes:
  register: 采用现代、庄重且易懂的简体中文。“到那日”保留先知审判宣告的语体；分号连接受罚者与其惯常恶行。脚注标记均置于正文相应短语之后。
