  text: תּוֹחֶ֣לֶת מְ֭מֻשָּׁכָה מַחֲלָה לֵ֑ב וְ/עֵ֥ץ חַ֝יִּ֗ים תַּאֲוָ֥ה בָאָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/013/012.yaml
  text: Hope deferred makes the heart sick[a], but a desire fulfilled is a tree of life.
translation:
  language: zh_hans
  text: 盼望迟延，使人心中成疾；愿望实现，犹如生命树。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较直译：“被延迟的盼望是心的疾病；来到的愿望是生命树。”
    reason: 说明希伯来文两个分句均为无系词的名词性表达；“迟延”字面为“被拉长／延宕”，“实现”字面为“来到”。
lexical_decisions:
- source_word: תּוֹחֶלֶת
  choice: 盼望
  rationale: 该词指带着期待的盼望；“盼望”在现代汉语中自然，也与下半句实现的愿望形成对应。
- source_word: מְמֻשָּׁכָה
  choice: 迟迟不实现
  rationale: 该词本义为“被拉长、拖延”；结合“盼望”，译作“迟迟不实现”清楚表达等待被延长的处境。
- source_word: מַחֲלָה לֵב
  choice: 使人心痛
  rationale: 希伯来文是无系词结构，直译为“心的病痛”。“使人心痛”保留心受损的身体性隐喻，同时符合现代汉语表达。
- source_word: וְעֵץ חַיִּים
  choice: 但……就是生命树
  rationale: ו形式上可译为“和”，但两句构成鲜明对照，汉语用“但”能自然呈现反义平行；“生命树”保留原文重要的智慧文学意象。
- source_word: תַּאֲוָה
  choice: 愿望
  rationale: 该词可指愿望、渴望；此处没有必要赋予负面含义，“愿望”宽泛、中性，并适合本节语境。
- source_word: בָאָה
  choice: 实现
  rationale: 字面意思是“来到”；在愿望的语境中，指所盼之事来到、成为现实，译作“实现”自然且不额外限定其方式。
theological_decisions:
- issue: ו在“生命树”前的关系
  choice: 译为“但”，表达上下两句的对照
  alternative: 译为“和”或“而”
  rationale: 希伯来语常以简单并列连接反义平行句；“但”明确传达原有对照，不引入额外神学解释。
- issue: “生命树”意象的处理
  choice: 保留“生命树”
  alternative: 意译为“带来生命”或“使人振奋”
  rationale: “生命树”是《箴言》及圣经整体中具有文学和神学分量的意象；意译会削弱原文形象及其互文空间。
translation_notes:
  register: 采用简洁、对称而有箴言感的现代标准汉语。“迟迟不实现”传达等待被拖长，“心痛”保留原文的身体性隐喻；分号呈现两行反义平行结构。
