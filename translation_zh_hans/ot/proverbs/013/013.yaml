  text: בָּ֣ז לְ֭/דָבָר יֵחָ֣בֶל ל֑/וֹ וִ/ירֵ֥א מִ֝צְוָ֗ה ה֣וּא יְשֻׁלָּֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/013/013.yaml
  text: Whoever despises a word will be ruined by it[c][b][a], but he who fears the commandment will be rewarded.
translation:
  language: zh_hans
  text: 藐视话语[a]的人，必因它败亡[b]；敬畏诫命的人，必得报偿[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“某件事”。希伯来语 דָבָר 可指“话、事情”或“事物”。
    reason: lexical_alternative
  - marker: b
    text: 或译“必因此受损”或“必自招败亡”。
    reason: lexical_alternative
  - marker: c
    text: 或译“必得奖赏”。希伯来语较直译为“必获偿还／报偿”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּז
  choice: 藐视
  rationale: 该分词指以轻蔑态度看待某事物的人。“藐视”自然、庄重，并保留原文强烈的道德意味。
- source_word: לְדָבָר
  choice: 一句话
  rationale: דָבָר 可指“话、事情、事物”。本句很可能泛指劝言或训诲，但原文没有明说；“一句话”保留其基本词义和箴言式的开放性。
- source_word: יֵחָבֶל לוֹ
  choice: 必因它败亡
  rationale: חבל 的尼法勒形在此表达遭受损害、陷入败亡；“因它”将 לוֹ 与前半句所藐视的话联系起来，同时不把受损的具体方式说死。
- source_word: וִירֵא
  choice: 敬畏
  rationale: ירא 在此不只是一般害怕，也包含郑重、尊崇地对待。“敬畏”保留智慧文学中的核心语义。
- source_word: מִצְוָה
  choice: 诫命
  rationale: מִצְוָה 最直接指命令或诫命。“诫命”保留其伦理和盟约语境中的分量，又与宽泛的“一句话”形成对照。
- source_word: הוּא
  choice: 这人
  rationale: 独立代词 הוּא 带有强调作用。“这人”在中文中显明强调，而不生硬复制希伯来语的性别形式。
- source_word: יְשֻׁלָּם
  choice: 必得报偿
  rationale: שלם 的普阿勒形表示得到偿还或报偿；上下文显示结果为正面。“得报偿”比“得奖赏”更贴近原词，也保留报偿内容未明的宽度。
theological_decisions:
- issue: 第二分句报偿的正面性质
  choice: 译作“必得报偿”
  alternative: “必得奖赏”或“必得偿还”
  rationale: 上下平行对比表明这里的报偿是正面的，但原文并未限定为何种福分。“报偿”既表达正面结果，也避免引入特定的物质兴盛观。
- issue: 智慧箴言中的阳性单数表达
  choice: 以“这人”表现 הוּא 的强调，不在中文中额外标明男性
  alternative: 译作“他”
  rationale: 希伯来语阳性单数在此具有代表性、泛指功能。现代汉语“这人”既可忠实传达强调，也不会把适用范围误限于男性。
translation_notes:
  register: 采用现代、庄重而简洁的箴言体。“藐视—敬畏”和“败亡—得报偿”形成清楚对仗；“这人”承接原文独立代词的强调。脚注保留 דָבָר、חבל 和 שלם 的真实词义幅度，正文不将“话”特定化为某一类启示或劝告。
