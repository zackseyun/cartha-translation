base_translation:
  language: en
  yaml_path: translation/ot/proverbs/013/003.yaml
  text: Whoever guards his mouth preserves his life[b][a]; whoever opens wide his lips comes to ruin.
translation:
  language: zh_hans
  text: 谨守自己口的，保全自己的性命[a]；嘴唇大张的，必遭毁灭[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “性命”原文为“נֶפֶשׁ”（生命、性命、自身；在其他语境也可译作“灵魂”）；此处最自然地指一个人的生命。
    reason: lexical_alternative
  - marker: b
    text: 原文短语凝练，也可译作“毁灭临到他”、“这对他是毁灭”或“他自招毁灭”。
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹצֵר פִּיו
  choice: 谨守口舌
  rationale: נֹצֵר表示看守、谨守；原文直译为“守住自己的口”。中文以“谨守口舌”自然表达谨慎约束言语，同时保留身体意象。
- source_word: שֹׁמֵר נַפְשׁוֹ
  choice: 保全自己的性命
  rationale: שֹׁמֵר在此说明谨守口舌所带来的结果；נֶפֶשׁ在本箴言中最自然地指人的性命或生命，而非狭义的非物质“灵魂”。
- source_word: פֹּשֵׂק שְׂפָתָיו
  choice: 大张嘴唇
  rationale: פֹּשֵׂק含张开、敞开之意。译文保留原文具体而夸张的身体意象，以及“口舌／嘴唇”的平行结构，不直接释为“信口开河”。
- source_word: מְחִתָּה לוֹ
  choice: 必自招毁灭
  rationale: מְחִתָּה可指毁灭、败亡或惊恐；希伯来语短句十分凝练，字面近于“毁灭临到他／对他是毁灭”。“自招毁灭”在中文中表达不受约束的言语给本人带来灾祸。
theological_decisions:
- issue: נַפְשׁוֹ是否译作“灵魂”
  choice: 自己的性命
  alternative: 自己的灵魂／自己
  rationale: 上下文谈言语谨慎所保全的生命与处境，并未明确讨论灵魂与身体的区分；译作“性命”避免引入原文没有明说的人论立场。
- issue: מְחִתָּה לוֹ所表达的施受关系
  choice: 必自招毁灭
  alternative: 毁灭临到他／这对他是毁灭
  rationale: 原文省略而紧凑，可容许数种相近理解。正文采用自然的因果表达，脚注保留其形式与语义上的开放性。
translation_notes:
  register: 采用现代、庄重而易懂的箴言体。前后两句保持鲜明对仗；“谨守口舌／大张嘴唇”保留希伯来语的具体身体意象，“保全／自招毁灭”呈现其结果对比。所有脚注标记均置于相关正文之后。
