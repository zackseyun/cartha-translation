  yaml_path: translation/ot/proverbs/013/023.yaml
  text: The fallow ground of the poor[b][a] yields abundant food, but some are swept away for lack of justice.
translation:
  language: zh_hans
  text: '穷人的耕地[a]有丰富的粮食；却有人因缺乏公正而被毁灭。[b]


    [a] “耕地”也可译作“刚犁过的土地”或“待耕的地”。


    [b] 后半句的希伯来文十分简洁，也可较非人格化地译作：“却有被毁灭的，是因缺乏公正。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “耕地”也可译作“刚犁过的土地”或“待耕的地”。
    reason: lexical_alternative
  - marker: b
    text: 后半句的希伯来文十分简洁，也可较非人格化地译作：“却有被毁灭的，是因缺乏公正。”
    reason: alternative_reading
lexical_decisions:
- source_word: רָב
  choice: 丰富的
  rationale: 表示数量很多；与“粮食”搭配自然，并保留原文强调丰盛的意思。
- source_word: אֹכֶל
  choice: 粮食
  rationale: 本词指食物或可食用的出产；农业语境下译作“粮食”既清楚，也不过度限定具体作物。
- source_word: נִיר
  choice: 新垦地
  rationale: 指可耕作、刚开垦或刚犁过的土地。“新垦地”能传达农业意象，同时以脚注保留“耕地”等可能译法。
- source_word: רָאשִׁים
  choice: 穷人
  rationale: 此处词形虽不常见，传统上和语境中都最自然地理解为贫穷的人。
- source_word: וְיֵשׁ
  choice: 但有人
  rationale: יֵשׁ引出一个不特定的存在者，后接阳性单数分词；“有人”保留单数结构，“但”表达两句之间的反差。
- source_word: נִסְפֶּה
  choice: 遭毁灭
  rationale: 该尼法勒分词有被除灭、被毁掉或消亡之意；“遭毁灭”保留被动含义，而不指定毁灭的具体方式。
- source_word: בְּלֹא מִשְׁפָּט
  choice: 因缺乏公正
  rationale: מִשְׁפָּט可指公正、审判或正当秩序；本句最自然地表达公正缺失导致毁灭，同时不把含义缩限为某一种司法程序。
theological_decisions:
- issue: 后半句所指的对象及其社会伦理含义
  choice: 译作“但有人因缺乏公正而遭毁灭”，理解为人在公正缺失之下遭受毁灭。
  alternative: 可作非人格化理解，指某物在没有公正或正当处置的情况下被毁掉；也有人将其联系于出产因管理不当而损失。
  rationale: נִסְפֶּה为阳性单数形式，配合יֵשׁ可自然指一个不特定的人；בְּלֹא מִשְׁפָּט通常具有公正或审判层面的含义。不过，原文没有明说被毁灭者是谁，因此用脚注保留较非人格化的可能译法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“出产丰富的粮食”使第一分句在中文中自然流畅；分号呈现两分句的鲜明对照。正文保留原文的农业意象、被动语态和公正主题，脚注则交代关键词及后半句指称不明确之处。
