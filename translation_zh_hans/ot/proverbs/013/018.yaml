  text: רֵ֣ישׁ וְ֭/קָלוֹן פּוֹרֵ֣עַ מוּסָ֑ר וְ/שׁוֹמֵ֖ר תּוֹכַ֣חַת יְכֻבָּֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/013/018.yaml
  text: Poverty and disgrace come to one who ignores discipline[b][a], but whoever heeds reproof will be honored.
translation:
  language: zh_hans
  text: 弃绝管教的[a]，必贫穷受辱；听从责备的[b]，必得尊荣。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弃绝”也可译作“忽视”或“撇弃”。希伯来语在这里含有不顾、摆脱管教之意。
    reason: lexical_alternative
  - marker: b
    text: “听从”直译为“守住”或“看守”，意思是认真留意责备，并把它存记在心。
    reason: lexical_alternative
lexical_decisions:
- source_word: רֵישׁ
  choice: 贫穷
  rationale: 该名词表示贫困、匮乏；“贫穷”是现代汉语中清楚自然的对应词。
- source_word: קָלוֹן
  choice: 受辱
  rationale: 该词指羞耻、耻辱或社会性的失荣；与“贫穷”并列时，“受辱”自然表达落入羞辱的处境。
- source_word: פּוֹרֵעַ
  choice: 弃绝
  rationale: 此处分词表示撇弃、放任不顾或拒绝约束；“弃绝”保留主动排斥管教的力度，同时以脚注注明较弱的“忽视”译法。
- source_word: מוּסָר
  choice: 管教
  rationale: 在《箴言》中常指带有纠正和训练作用的教导；“管教”比单纯的“教导”更能体现这一层意思。
- source_word: שׁוֹמֵר
  choice: 听从
  rationale: 字面义为“守住、看守”，在此指认真看待并接受责备；“听从”符合现代汉语表达，字面意象由脚注保留。
- source_word: תּוֹכַחַת
  choice: 责备
  rationale: 该名词指以言语指出错误、加以纠正；“责备”既准确，又与前句的“管教”有所区别。
- source_word: יְכֻבָּד
  choice: 必得尊荣
  rationale: 该动词为被动式，表示受到尊重或尊崇；“必得尊荣”自然表达箴言所陈明的结果，并保留被人尊重的社会性含义。
theological_decisions:
- issue: 箴言结果陈述的表达力度
  choice: 用“必……；必……”表达格言中的典型因果结果
  alternative: 直译为“贫穷和羞辱归于……；……将被尊重”
  rationale: 希伯来文前半句是省略系词的名词结构，后半句使用未完成式；汉语用对称的“必”使格言自然有力，但不把它扩展为关于每一个个案和时间点的绝对教义命题。
translation_notes:
  register: 采用现代、庄重而易懂的箴言体，以“弃绝……的／听从……的”和“必……／必……”构成鲜明对仗。“贫穷受辱”与“得尊荣”简洁有力，适合公开诵读。
