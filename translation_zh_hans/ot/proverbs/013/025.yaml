base_translation:
  language: en
  yaml_path: translation/ot/proverbs/013/025.yaml
  text: A righteous man eats to the satisfaction of his soul[a], but the belly of the wicked lacks.
translation:
  language: zh_hans
  text: 义人吃得饱足[a]；恶人的肚腹却常有缺乏。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“吃到自己饱足。”希伯来语 נֶפֶשׁ（内费什）可按语境指自己、生命、内在之人或食欲；此处也可理解为“吃得胃口满足”。
    reason: lexical_alternative
lexical_decisions:
- source_word: צַדִּיק
  choice: 义人
  rationale: 单数形容词在此作名词使用，表示一位义人，也具有箴言中代表一类人的普遍意义；“义人”简洁、庄重且符合中文智慧文学用语。
- source_word: אֹכֵל
  choice: 吃喝
  rationale: 分词表达恒常、概括性的行为。原词本义是“吃”，但现代汉语“吃喝”在此更自然地概括饮食和饱足，不改变核心含义。
- source_word: לְשֹׂבַע
  choice: 满意足
  rationale: 表示达到充足、饱足的程度；与“心”组合成现代汉语成语“心满意足”，自然传达充分满足而非过量。
- source_word: נַפְשׁוֹ
  choice: 心
  rationale: נֶפֶשׁ 可指生命、自我、内在之人或食欲；饮食语境容许“胃口”，但与 שׂבע 连用也可表达整个人得到满足。“心”在正文中保留较宽的内在满足之义，具体的食欲义收入脚注。
- source_word: וּבֶטֶן
  choice: 肚腹却
  rationale: בֶּטֶן 在此指腹部，并转指身体的需要或食欲；“肚腹”较“肚子”庄重，也保留原文与前半句内在生命用语的对照。上下文呈反义对比，故将连接词译为“却”。
- source_word: רְשָׁעִים
  choice: 恶人的
  rationale: 复数名词化形容词表示恶人这一类；中文用“恶人”可自然表达集合性类别，不必机械标出复数。
- source_word: תֶּחְסָר
  choice: 总有所缺
  rationale: 该动词表示缺乏、不足。阴性单数形式以“肚腹”为主语；加入“总”体现箴言的一般性陈述，“有所缺”则保留缺乏的开放范围及未得饱足之意。
theological_decisions:
- issue: 义人得饱足与恶人缺乏之间的箴言性陈述
  choice: 按一般性智慧原则表达，不增添绝对、即时或机械报应的限定
  alternative: 译成明确的未来应许或无例外的因果保证
  rationale: 原文以分词和未完成体构成凝练对比，陈述智慧文学中的典型规律；译文不应额外把它系统化为对每一个处境都即时兑现的承诺。
- issue: נֶפֶשׁ 的人观含义
  choice: 正文译“心”，脚注保留“胃口”的语境性可能
  alternative: 固定译为独立于身体的“灵魂”
  rationale: 该词语义范围包括生命、自我、内在之人和食欲；此处不可据此建立灵魂与身体二分的特定教义。
translation_notes:
  register: 采用现代、庄重而易懂的箴言体。分号突出两行对比；“心满意足”使前半句自然流畅，同时用脚注保存 נֶפֶשׁ 在饮食语境中可指食欲的歧义。“肚腹”保留原文具体意象，避免将后半句过度抽象化。
