base_translation:
  language: en
  yaml_path: translation/ot/proverbs/013/014.yaml
  text: The instruction of a wise man is a fountain of life[b][a], to turn one away from the snares of death.
translation:
  language: zh_hans
  text: 智慧人的教导是生命的泉源，使人避开死亡的网罗。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תּוֹרַת
  choice: 教导
  rationale: 这里的 תּוֹרָה 泛指智慧传统中的训诲、教导，并非特指成文律法；“教导”在现代汉语中自然清楚。
- source_word: חָכָם
  choice: 智慧人
  rationale: 保留希伯来文阳性单数的代表性表达；“智慧人”符合《箴言》的文体，也可泛指具有智慧的人。
- source_word: מְקוֹר
  choice: 泉源
  rationale: 该词指涌出水的源头；“泉源”既保留水源意象，也自然承接“生命”。
- source_word: חַיִּים
  choice: 生命
  rationale: 虽为复数形态，此处按希伯来语惯用法表达抽象意义“生命”。
- source_word: לָסוּר
  choice: 使人避开
  rationale: 不定式可表示目的或结果；结合语境译作“使人避开”，自然表达教导使领受者远离危险的作用。
- source_word: מִמֹּקְשֵׁי
  choice: 避开……的网罗
  rationale: מוֹקֵשׁ 指捕捉猎物的圈套或网罗；“网罗”保留智慧诗歌中的危险意象。
- source_word: מָוֶת
  choice: 死亡
  rationale: 直接传达原文名词，并与“生命”形成鲜明对照。
theological_decisions:
- issue: לָסוּר 与前半句的关系
  choice: 译为“使人避开”，理解为教导所产生的作用或目的
  alternative: 译为“为要避开”或“离开”
  rationale: 希伯来语不定式容许目的或结果两种侧重；正文采用自然汉语呈现其功能，但不增添救赎论或道德能力方面的特定教义判断。
translation_notes:
  register: 采用现代、庄重而易懂的箴言体。句式简洁，保留“生命的泉源”与“死亡的网罗”两组核心诗歌意象及其对照。
