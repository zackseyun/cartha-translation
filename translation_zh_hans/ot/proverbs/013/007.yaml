  text: יֵ֣שׁ מִ֭תְעַשֵּׁר וְ/אֵ֣ין כֹּ֑ל מִ֝תְרוֹשֵׁ֗שׁ וְ/ה֣וֹן רָֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/013/007.yaml
  text: There is one who pretends to be rich[a], yet has nothing; another pretends to be poor, yet has great wealth.
translation:
  language: zh_hans
  text: 有人装作富有[a]，其实一无所有；有人装作贫穷，却拥有许多财富。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“有人使自己富有，却一无所有；有人使自己贫穷，却拥有许多财富。”希伯来语的反身动词既可指把自己表现成富有或贫穷，也可指实际使自己变得富有或贫穷。正文根据本箴言鲜明的反讽，采用表示外在表现的译法。
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵשׁ
  choice: 有人
  rationale: 这是存在句式，用来引出普遍观察；译作“有人”简洁自然，符合汉语箴言体。
- source_word: מִתְעַשֵּׁר
  choice: 装作富有
  rationale: עשר 的 Hitpael 形式既可表示把自己变得富有，也可表示使自己显得富有。与“一无所有”的反差使“装作富有”更能体现本节的尖锐反讽。
- source_word: וְאֵין כֹּל
  choice: 其实一无所有
  rationale: אֵין 与 כֹּל 连用表示全然没有；“其实”明确呈现外表与实情的转折，“一无所有”保留其绝对语气。
- source_word: מִתְרוֹשֵׁשׁ
  choice: 装作贫穷
  rationale: 该反身形式可指使自己显得贫穷，也可指使自己陷入贫穷。它与前半句构成严整对应；正文采用外在表现之意，同时以脚注保留另一可能。
- source_word: וְהוֹן רָב
  choice: 却拥有许多财富
  rationale: הוֹן 指财富、资财，רָב 指多、丰厚；此译自然地表达实际拥有大量财富，并与“装作贫穷”形成转折。
theological_decisions: []
translation_notes:
  register: 采用现代、凝练而庄重的普通话，保持希伯来诗句前后对称的箴言风格。“装作”突出外表与实情的反差，但脚注保留反身动词可能表示实际致富或致贫的歧义。
