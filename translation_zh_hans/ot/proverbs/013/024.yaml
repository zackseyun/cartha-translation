base_translation:
  language: en
  yaml_path: translation/ot/proverbs/013/024.yaml
  text: Whoever withholds his rod hates his son[b][a], but whoever loves him diligently seeks discipline.
translation:
  language: zh_hans
  text: 不肯用自己的杖[a]的，是恨自己的儿子；疼爱自己儿子的，却殷勤地管教他[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“保留自己的杖不用”。原文动词有“扣住、保留而不使用”之意。
    reason: lexical_alternative
  - marker: b
    text: “殷勤地管教他”所对应的原文表达，也可理解为“及早管教他”；其中“管教”包括训诲、纠正和纪律训练。
    reason: lexical_alternative
lexical_decisions:
- source_word: חוֹשֵׂךְ
  choice: 不用
  rationale: 该分词表示扣住、保留而不使用。现代汉语用“不用”自然地表达主动不用杖的意思，同时避免“爱惜”可能产生的正面含义。
- source_word: שִׁבְטוֹ
  choice: 自己的杖
  rationale: שֵׁבֶט在此指用于管教的杖。保留具体意象，不泛化为“劝诫”或“引导”；“自己的”对应第三人称单数所属后缀。
- source_word: שׂוֹנֵא
  choice: 恨
  rationale: 原文使用强烈而直接的“恨”，与下半句的“爱”构成鲜明对照，不宜弱化。
- source_word: בְנוֹ
  choice: 自己的儿子
  rationale: 原文明确为“他的儿子”，不是泛指儿童；译文保留其性别和亲属关系。
- source_word: וְאֹהֲבוֹ
  choice: 爱儿子的
  rationale: 将希伯来语分词结构自然转为汉语，并明确宾语仍是上文所说的儿子。
- source_word: שִׁחֲרוֹ
  choice: 殷勤……他
  rationale: שׁחר的加强词干可含“早早寻求”或“切切寻求”之意；在本句中译作“殷勤”，表达认真、主动而持续的行动。宾语后缀“他”在汉语中与“管教”合译。
- source_word: מוּסָר
  choice: 管教
  rationale: מוּסָר在《箴言》中兼有训诲、纠正和纪律训练之意；本节与“杖”并列，译作“管教”既保留纠正意味，也不把含义缩减为体罚。
theological_decisions:
- issue: 是否淡化杖所代表的身体管教意象
  choice: 保留“杖”的具体意象，并直译爱与恨的强烈对照
  alternative: 将“杖”泛化为“纠正”“教导”或“引导”
  rationale: 原文明确使用שֵׁבֶט，并以尖锐的智慧文学对偶说明管教与爱之间的关系。译文不应因后来的伦理争议而删去意象；但将מוּסָר译为范围较广的“管教”，也避免把整节经文限定为单一的身体惩罚方式。
- issue: שִׁחֲרוֹ是否译出“早早”
  choice: 译为“殷勤管教他”
  alternative: 译为“及早管教他”
  rationale: 该动词的词源意象与“早早寻求”有关，也常引申为热切、殷勤地寻求。此处两种理解均有根据；正文采用较符合语境和现代汉语的“殷勤”，脚注保留“及早”的可能。
translation_notes:
  register: 采用简洁、对称的现代标准汉语，保留箴言警句式的力度。“就是”呈现上半句直截了当的判断；“却”标明上下两句的对照。所有代词指向清楚，措辞庄重而适合普通读者。
