  text: דְּבַר שֶׁ֭קֶר יִשְׂנָ֣א צַדִּ֑יק וְ֝/רָשָׁ֗ע יַבְאִ֥ישׁ וְ/יַחְפִּֽיר־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/013/005.yaml
  text: A righteous man hates a lying word[b][a], but a wicked man acts shamefully and disgracefully.
translation:
  language: zh_hans
  text: 义人恨恶虚假的话[a]；恶人却令人厌恶，并且蒙羞[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“义人恨恶虚假。”希伯来语直译为“虚假之言”。
    reason: lexical_alternative
  - marker: b
    text: 末尾两个动词也可理解为：“恶人行为可憎，行事可耻。”第一个动词本有发臭、令人厌恶之意；这两个动词可描述恶人的行为，也可描述他落得可憎、蒙羞的境地。
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּבַר שֶׁקֶר
  choice: 虚假的话
  rationale: 该组合结构直译为“虚假之言”。译作“虚假的话”既保留 דָּבָר 所指的具体言语，也符合现代汉语表达；脚注说明也可概括译为“虚假”。
- source_word: יִשְׂנָא
  choice: 恨恶
  rationale: שׂנא 的 Qal 形式表达强烈厌弃。“恨恶”直接而庄重，适合智慧文学中的道德对比。
- source_word: צַדִּיק
  choice: 义人
  rationale: 阳性单数形容词作名词使用，表示箴言中的典型人物。“义人”简洁自然，并与下句“恶人”形成传统而清楚的对偶。
- source_word: רָשָׁע
  choice: 恶人
  rationale: 阳性单数形容词作名词使用，与 צַדִּיק 对举。“恶人”保留单数代表性人物和鲜明的道德对比。
- source_word: יַבְאִישׁ
  choice: 行为可憎
  rationale: באש 的 Hiphil 形式以发臭、使人厌恶为基本意象；在此按道德含义译为“行为可憎”，避免汉语中直译“发臭”可能造成的不当字面理解，同时保留令人厌恶的力度。
- source_word: וְיַחְפִּיר
  choice: 行事可耻
  rationale: 该动词可涉及羞耻、受辱或使人蒙羞。主文采用描述恶人可耻行为的理解，与前一动词构成自然并列；其他可能理解在脚注中保留。
theological_decisions:
- issue: 末句两个动词描述恶人的行为，还是描述他所陷入的可憎与羞辱状态
  choice: 主文译作“行为可憎，行事可耻”，理解为对恶人表现的描述
  alternative: “变得令人厌恶，并且蒙羞”
  rationale: 希伯来语两个动词容许行为性或结果性理解。主文选择较自然的行为性表达，但不把语义张力定死，借脚注明示结果性读法。
translation_notes:
  register: 采用现代、庄重而易懂的箴言体。以“义人／恶人”保持简洁对偶；分号呈现两类人的鲜明反差。
