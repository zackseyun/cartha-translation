  yaml_path: translation/ot/proverbs/013/011.yaml
  text: Wealth from vanity dwindles[b][a], but whoever gathers little by little increases it.
translation:
  language: zh_hans
  text: 虚浮得来的财富会减少；一个一点一点积攒的人会使财富增多。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הוֹן
  choice: 财富
  rationale: 指物质财富或财产；“财富”在现代汉语中自然、宽泛，也适合箴言体。
- source_word: מֵהֶבֶל
  choice: 虚浮得来的
  rationale: הֶבֶל本义为“气息、雾气”，引申为“虚空、虚浮”；这里修饰财富的来源，表示所得缺乏根基、转瞬即逝或来路不可靠。“虚浮得来的”保留原文意象及其开放性，不把它限定为“迅速”或“不诚实”。
- source_word: יִמְעָט
  choice: 必会减少
  rationale: 该动词意为“变少、减少”；“必会减少”清楚表达箴言所陈述的一般结果。
- source_word: וְקֹבֵץ
  choice: 积攒的
  rationale: 分词在这里泛指任何这样做的人；汉语以“……的”表达概括性人物，简洁自然。
- source_word: עַל יָד
  choice: 一点一点
  rationale: 字面与“手”有关，但此处惯用含义很可能是按小份、逐步积累；“一点一点”自然呈现与前半句的对比，字面形式另见脚注。
- source_word: יַרְבֶּה
  choice: 财富必会增多
  rationale: 使役形式表示“使之增多”；重复“财富”可在汉语中明确所增多的对象，避免把主语误解为积攒的人本身。
theological_decisions: []
translation_notes:
  register: 采用简洁、对称的现代箴言体。“虚浮得来的”有意保留希伯来语“气息／虚空”的意象和含义张力，不将其窄化为“仓促得来的”或“以欺诈得来的”；“一点一点”则以自然汉语表达原文惯用语的渐进含义。
