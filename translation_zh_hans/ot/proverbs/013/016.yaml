  text: כָּל עָ֭רוּם יַעֲשֶׂ֣ה בְ/דָ֑עַת וּ֝/כְסִ֗יל יִפְרֹ֥שׂ אִוֶּֽלֶת־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/013/016.yaml
  text: Every prudent man acts with knowledge[a], but a fool displays folly.
translation:
  language: zh_hans
  text: 凡精明人都凭知识行事，愚昧人却显露愚妄。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “显露”也可译作“铺开”或“摊开”。希伯来语动词有把某物展开、使其公开可见的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל
  choice: 凡……都
  rationale: 表达智慧文学格言中的周遍、分配意义，指这一类人无不如此；现代汉语中比逐字译作“每一个”更自然。
- source_word: עָרוּם
  choice: 精明人
  rationale: 本词在《箴言》中通常指有见识、能审慎预见的人，而非贬义的“狡猾人”；“精明人”简洁地保留其实践智慧色彩。
- source_word: יַעֲשֶׂה
  choice: 行事
  rationale: 希伯来语动词意义宽泛，此处描述一贯的行为方式；“行事”符合汉语格言体，也能自然搭配“凭知识”。
- source_word: בְדָעַת
  choice: 凭知识
  rationale: 介词 בְּ 在这里可表依据或方式，意思是精明人以知识为行动根据；“凭知识”既贴近原文，又符合现代汉语。
- source_word: וּכְסִיל
  choice: 愚昧人却
  rationale: 连接词字面为“和”，但上下句构成鲜明对比；用“却”自然呈现这种转折关系。
- source_word: יִפְרֹשׂ
  choice: 显露
  rationale: 该动词基本意象是铺开、展开，从而使事物公开可见；在本句中“显露”准确表达愚昧人把自己的愚妄表现出来，同时脚注保留更具象的可能译法。
- source_word: אִוֶּלֶת
  choice: 愚妄
  rationale: 这是《箴言》中的典型智慧文学术语，不仅指智力不足，也包含错误、悖谬的态度和行为；“愚妄”比“愚蠢”更庄重并适合经文语体。
theological_decisions: []
translation_notes:
  register: 采用简洁、对称的现代汉语格言体。“凡……都……，……却……”清楚呈现两分句的普遍陈述与对比。“精明人”与“愚昧人”庄重而易懂；避免把 עָרוּם 误解为贬义的“狡猾”。脚注标记置于相关分句之后。
