  yaml_path: translation/ot/proverbs/013/010.yaml
  text: Only by arrogance comes strife[a], but wisdom is with those who take counsel.
translation:
  language: zh_hans
  text: 纷争只因骄傲而起[a]；听取劝告的人却有智慧。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“纷争只因狂傲而起；受劝告的人却有智慧。”
    reason: 保留זָדוֹן可译为“狂傲”，并反映נוֹעָצִים可理解为“受劝告的人”的词义可能。
lexical_decisions:
- source_word: רַק
  choice: 只会
  rationale: 保留限制和强调作用，表明本句所聚焦的纷争源头是骄傲；与“引起”连用也符合现代汉语箴言式表达。
- source_word: בְּזָדוֹן
  choice: 骄傲
  rationale: זָדוֹן表示僭越、自负、狂傲或傲慢；“骄傲”在此取贬义，语言自然，并能表达导致冲突的自高心态。介词ב所含的原因或凭借关系由整句“骄傲只会引起”体现。
- source_word: יִתֵּן
  choice: 引起
  rationale: 字面义为“给予”，在此表示造成或产生；译作“引起”可自然表达骄傲导致纷争的关系。
- source_word: מַצָּה
  choice: 纷争
  rationale: 该词指争执、冲突或争竞；“纷争”简洁庄重，适合智慧文学语体。
- source_word: וְאֶת
  choice: 却
  rationale: 第二分句与第一分句形成对照；用“却”明确体现希伯来诗歌中的转折关系。
- source_word: נוֹעָצִים
  choice: 听取劝告的人
  rationale: 该词是יעץ的Niphal分词，可指受劝告、接受意见的人，也可能指彼此商议的人。“听取劝告的人”保留接受劝告的核心意义，并符合箴言的智慧语境。
- source_word: חָכְמָה
  choice: 智慧
  rationale: 这是《箴言》中标准的智慧术语，应保持一致，不弱化为单纯的技巧或谨慎。
