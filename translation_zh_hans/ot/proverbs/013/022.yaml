  text: ט֗וֹב יַנְחִ֥יל בְּנֵֽי בָנִ֑ים וְ/צָפ֥וּן לַ֝/צַּדִּ֗יק חֵ֣יל חוֹטֵֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/013/022.yaml
  text: A good man leaves an inheritance to his grandchildren[b][a], but the wealth of a sinner is stored up for the righteous.
translation:
  language: zh_hans
  text: 善人给孙辈留下产业[a]；罪人的财富却为义人积存[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “孙辈”原文直译为“儿女的儿女”。
    reason: lexical_alternative
  - marker: b
    text: “积存”也可译作“藏起”或“保留”。
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: 善人
  rationale: 形容词在此作名词用，指良善的人；“善人”简洁、庄重，也保留箴言中代表一类人的表达。
- source_word: יַנְחִיל
  choice: 留下产业
  rationale: 该使役式有“使承受产业、赐作产业”之意；结合跨代传承的语境，“留下产业”是自然且准确的现代汉语。
- source_word: בְּנֵי בָנִים
  choice: 子孙
  rationale: 字面为“儿女的儿女”，即孙辈；“子孙”符合汉语箴言体，并可自然表达后代承受产业的意思。
- source_word: וְצָפוּן
  choice: 却……积存
  rationale: 该被动分词可指“被藏起、被储存、被保留”；“积存”与财富搭配自然，“却”呈现两分句间的反衬关系。
- source_word: לַצַּדִּיק
  choice: 为义人
  rationale: 介词表明财富最终保留给谁；“义人”保留了希伯来文单数名词化形容词所代表的一类人。
- source_word: חֵיל
  choice: 财富
  rationale: 此词可指财富、资财或实力；在产业传承的语境中，“财富”最清楚。
- source_word: חוֹטֵא
  choice: 罪人
  rationale: 分词在此作名词用，泛指犯罪作恶之人；“罪人”简明并符合智慧文学语体。
theological_decisions:
- issue: 箴言中阳性单数的类指表达
  choice: 善人／义人／罪人
  alternative: 良善的人／行义的人／犯罪的人
  rationale: 原文以阳性单数形式代表某一类人。汉语的“善人、义人、罪人”并不必然限定为男性，既保留类指性质，也避免额外加入性别限定。
- issue: 罪人财富归义人的表述力度
  choice: 为义人积存
  alternative: 被隐藏起来，留给义人
  rationale: 原文可表达被储藏、隐藏或保留，未说明具体转移方式或时间；译文保留这种概括性，不把箴言扩展成必然即时发生的机制。
translation_notes:
  register: 采用现代、凝练、庄重的箴言体。两句以分号和“却”显明反衬。脚注标记均置于相关词语之后；不把本节概括性的智慧陈述解释为机械性的财富转移定律。
