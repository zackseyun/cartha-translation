base_translation:
  language: en
  yaml_path: translation/ot/proverbs/013/021.yaml
  text: Disaster pursues sinners, but good repays the righteous.
translation:
  language: zh_hans
  text: 祸患追赶罪人，义人必得善报。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רָעָה
  choice: 祸患
  rationale: 此处作主语并与“追赶”搭配，指临到罪人的灾祸、患难；“祸患”既保留其负面广度，也符合汉语箴言体。
- source_word: תְּרַדֵּף
  choice: 追赶
  rationale: 保留动词的主动形象：祸患如同追逐者紧随罪人，而不弱化为笼统的“临到”。
- source_word: חַטָּאִים
  choice: 罪人
  rationale: 直接对应复数名词，指惯于犯罪或处于罪中之人。
- source_word: יְשַׁלֶּם
  choice: 回报
  rationale: 该词可表达偿还、报偿；以“回报”保留善对义人的报偿意味，并避免预先指定施行报偿者。
- source_word: טוֹב
  choice: 善福
  rationale: 原词可指善、美好或福祉；此处作为后置主语，“善福”兼顾善与福的语义，并使“回报义人”的汉语表达自然。
- source_word: צַדִּיקִים
  choice: 义人
  rationale: 采用智慧文学中稳定而庄重的对应语，指行为正直、合乎公义的人。
theological_decisions:
- issue: 末句中报偿者的身份
  choice: 保留“善福”作主语：善福回报义人
  alternative: 他必以福回报义人／上帝必回报义人
  rationale: 希伯来文本没有明示上帝为主语；将主语改为“他”或“上帝”会补入原文未直接表达的信息。
- issue: יְשַׁלֶּם 的报偿方向
  choice: 译为“回报”
  alternative: 奖赏／偿还
  rationale: “回报”保留报偿和相称结果的含义，同时不过度限定为制度性的奖赏，也不造成义人欠债后被偿还的误解。
translation_notes:
  register: 采用简洁、对称的现代箴言体。“祸患追赶罪人”与“善福却回报义人”形成鲜明平行；“却”明确转折。未加脚注，因此正文无脚注标记。
