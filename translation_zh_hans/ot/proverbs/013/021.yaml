  source_fidelity: 上半句“祸患追赶罪人”准确保留了רָעָה作主语、תְּרַדֵּף的追逐意象及复数泛指。下半句希伯来文以带宾格标记的“义人”为受事，יְשַׁלֶּם与טוֹב表达义人所得的善/福报；“善福却回报义人”虽可勉强理解，却在汉语中把“善福”拟作施行回报的主体，未能清楚表达义人得到善报。
