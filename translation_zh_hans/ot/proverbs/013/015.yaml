base_translation:
  language: en
  yaml_path: translation/ot/proverbs/013/015.yaml
  text: Good sense gives favor[b][a], but the way of the treacherous is hard.
translation:
  language: zh_hans
  text: 良好的见识带来好感[a]，背信者的道路崎岖难行[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“良好的见识使人获得好感。”希伯来语动词直译为“给予”；在这里可指带来或使人获得好感。
    reason: lexical_alternative
  - marker: b
    text: 或译：“背信者的道路坚硬。”末尾的希伯来词可表示坚硬、粗糙、严酷或难以通行；在其他语境中也可表示稳固或持久。
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׂכֶל טוֹב
  choice: 明智
  rationale: 该词组指良好的理解力、判断力和处世智慧。“明智”在现代汉语中自然简洁，也保留箴言所强调的实际判断。
- source_word: יִתֶּן
  choice: 带来
  rationale: 原义为“给予”，在此可表达产生某种结果。“带来”既符合汉语习惯，也不限定恩宠具体来自谁。
- source_word: חֵן
  choice: 恩宠
  rationale: 这里指受到善意看待、接纳或喜爱，不必专指神学意义上的恩典。“恩宠”保留了原词的关系性和一定的来源开放性。
- source_word: דֶרֶךְ
  choice: 道路
  rationale: 既可指实际道路，也常在智慧文学中喻指生活方式或人生历程；“道路”保留了这一双重意象。
- source_word: בֹּגְדִים
  choice: 奸诈者
  rationale: 该分词指行事诡诈、背信的人。“奸诈者”是简洁的类型称谓，适合箴言体。
- source_word: אֵיתָן
  choice: 崎岖难行
  rationale: 此处与前半句的正面结果形成对照，可能表示坚硬、粗粝、严酷或难以通行。“崎岖难行”在现代汉语中清楚呈现道路意象，同时脚注保留其词义幅度。
theological_decisions:
- issue: “恩宠”的施予者是否特指上帝
  choice: 不明说施予者
  alternative: 译作“得人的喜爱”或“蒙上帝恩宠”
  rationale: 希伯来文本没有明示恩宠来自人还是上帝；正文保留这一开放性，避免加入原文未说明的主体。
translation_notes:
  register: 采用简洁、对称的现代箴言体。“明智”通俗而庄重；“崎岖难行”延续“道路”的具体意象，并传达负面的艰难含义。正文中的脚注标记与脚注逐一对应。
