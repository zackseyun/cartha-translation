- from: 公义护卫行为纯全的人；邪恶却倾覆罪[a]。
  to: 公义护卫行事纯全的人；邪恶却倾覆罪人[a]。
  rationale: 根据希伯来语的句内对比，义保护行事纯全的人，恶则毁坏罪人；这是最能反映本节平行结构和实际语义的正文译法。脚注保留חַטָּאת的抽象名词读法，承认其词面歧义，但不让中文正文承受不自然且误导性的“倾覆罪”。
