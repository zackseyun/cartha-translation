base_translation:
  language: en
  yaml_path: translation/ot/proverbs/013/006.yaml
  text: Righteousness guards the blameless in the way[a], but wickedness overturns sin.
translation:
  language: zh_hans
  text: 公义护卫行事纯全的人；邪恶却倾覆罪人[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“邪恶却倾覆罪。”希伯来语“罪”在这里也可按词面理解为抽象的罪，而非指犯罪的人。
    reason: alternative_reading
lexical_decisions:
- source_word: צְדָקָה
  choice: 公义
  rationale: 这里指保护人的正直、公正这一道德品质；“公义”符合箴言的智慧文学语境，也保留其神学词汇色彩。
- source_word: תִּצֹּר
  choice: 护卫
  rationale: נצר意为守护、看守、保全；“护卫”简洁自然，并凸显保护作用。
- source_word: תָּם דָּרֶךְ
  choice: 行为纯全的人
  rationale: 希伯来语结构紧凑，可理解为“道路纯全的人”。中文用“行为纯全的人”自然表达其品格和生活方式，且不暗示绝对无罪。
- source_word: וְרִשְׁעָה
  choice: 邪恶却
  rationale: רִשְׁעָה指邪恶、恶行；连接词在上下句对照中具有转折意味，故译“却”。
- source_word: תְּסַלֵּף
  choice: 倾覆
  rationale: סלף的加强词干有扭曲、颠覆、毁坏之意；“倾覆”保留原文强烈而略显突兀的毁坏意象。
- source_word: חַטָּאת
  choice: 罪
  rationale: 该词通常可指“罪”，某些语境也可指“罪人”。正文采用词形上更直接的“罪”，不把原文的困难和张力静默化解。
theological_decisions:
- issue: 末词חַטָּאת应理解为抽象的“罪”还是指“罪人”
  choice: 正文译作“罪”：“邪恶却倾覆罪”。
  alternative: 也可理解为“罪人”，译作“邪恶却倾覆罪人”或“邪恶却使犯罪的人败亡”。
  rationale: 原文高度凝练，若译“罪”，下半句语义较为反常；但该名词的直接意义确可为“罪”。对偶关系则可能支持指被罪刻画的人。正文保留较贴近词面的困难读法，脚注交代常见的人称读法，以保存原文的神学张力。
translation_notes:
  register: 采用现代、庄重而简洁的普通话。“行为纯全的人”将希伯来语压缩结构展开为自然中文；“倾覆罪”刻意保留原文的突兀与歧义，并以脚注说明另一种读法。
