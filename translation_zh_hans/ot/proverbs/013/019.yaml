  text: תַּאֲוָ֣ה נִ֭הְיָה תֶּעֱרַ֣ב לְ/נָ֑פֶשׁ וְ/תוֹעֲבַ֥ת כְּ֝סִילִ֗ים ס֣וּר מֵ/רָֽע׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/013/019.yaml
  text: A desire fulfilled is sweet to the soul[a], but to turn away from evil is an abomination to fools.
translation:
  language: zh_hans
  text: 愿望实现，使人心里甘甜[a]；但离开恶事，是愚昧人所憎恶的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“愿望成真，使人心里愉快。”
    reason: 词汇替代译法：נִהְיָה 可译为“成真”，תֶּעֱרַב 可译为“愉快”。
lexical_decisions:
- source_word: תַּאֲוָה
  choice: 愿望
  rationale: 指愿望、渴望；“愿望”宽泛自然，不把语气强化为难以抑制的欲望。
- source_word: נִהְיָה
  choice: 实现
  rationale: 这是 היה 的尼发勒分词，表示愿望已经成为现实；与中文“愿望实现”搭配自然。
- source_word: תֶּעֱרַב
  choice: 甘甜
  rationale: 该词有“悦人、甘甜”之意；“甘甜”保留希伯来文的感官隐喻，同时表达内心的愉悦。
- source_word: לְנָפֶשׁ
  choice: 使人心里
  rationale: נפש 此处指人的内在感受或整个人；译作“使人心里”符合现代汉语，也避免把它过度限定为独立的灵魂实体。
- source_word: וְתוֹעֲבַת
  choice: 但……厌恶
  rationale: 连接词在两分句之间构成转折；תועבה 表示强烈憎恶。中文以主谓结构表达“对愚昧人而言是可憎之事”，更为自然。
- source_word: כְּסִילִים
  choice: 愚昧人
  rationale: 《箴言》中指在道德和认知上顽梗的人；“愚昧人”保留智慧文学中的伦理含义。
- source_word: סוּר
  choice: 离开
  rationale: 不定式表示远离、转离某事；“离开恶事”简洁表达主动弃绝邪恶。
- source_word: מֵרָע
  choice: 恶事
  rationale: רע 在此主要具有道德意义；“恶事”比单独的“恶”更适合与“离开”搭配。
theological_decisions:
- issue: 两分句之间的逻辑关系
  choice: 保留并列对照，不补明隐含推论
  alternative: 解释为愚昧人因执意满足邪恶愿望而不肯离恶
  rationale: 原文只并置“愿望实现的甘甜”与“愚昧人厌恶离恶”，没有明确说明二者之间更具体的因果关系，因此不在正文中加以释义。
translation_notes:
  register: 采用现代、庄重而易懂的智慧文学语体。前句保留“甘甜”的形象表达；后句调整为自然中文主谓语序，同时保存 תועבה 的强烈厌恶意味。
