  text: כֹּ֣פֶר נֶֽפֶשׁ אִ֣ישׁ עָשְׁר֑/וֹ וְ֝/רָ֗שׁ לֹא שָׁמַ֥ע גְּעָרָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/013/008.yaml
  text: A man's wealth is the ransom of his life[a], but a poor man does not hear a rebuke.
translation:
  language: zh_hans
  text: 人的财富是他性命的赎价；穷人却听不到责备[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “责备”也可译为“呵斥”或“威吓”。这句话可能是指，富人可能因其财富而受到威吓或被索取赎价；穷人无财可取，便不必听见这样的威吓或责备。
    reason: 说明גְּעָרָה可指严厉责备或带有威吓意味的话，并保留本句社会含义的解释性与不确定性，不将背景限定为绑架。
lexical_decisions:
- source_word: כֹּפֶר
  choice: 赎价
  rationale: 该词指为挽回性命、免受损失或刑罚而付出的代价。“赎价”保留了本句具体的经济和法律意味，又不把它过度限定为“贿赂”。
- source_word: נֶפֶשׁ
  choice: 性命
  rationale: 此处指一个人的生命，而非特指与身体相对的非物质“灵魂”。“性命”也切合遭遇危险、需要付赎价的语境。
- source_word: אִישׁ
  choice: 人
  rationale: 希伯来语为阳性单数，但在箴言中具有代表性。现代汉语以“人”表达自然、简洁，并未改变其泛指意义。
- source_word: עָשְׁרוֹ
  choice: 他的财富
  rationale: 该词指财物、富足。“财富”与下半句的“穷人”形成清楚的反义平行。
- source_word: רָשׁ
  choice: 穷人
  rationale: 该词指贫穷或缺乏的人；“穷人”准确保留其单数实体用法，并与上半句的“人”相呼应。
- source_word: לֹא שָׁמַע
  choice: 听不到
  rationale: 原文直译为“不听见”。“听不到”保留听觉意象，并自然表达穷人不成为这类斥责或威吓对象的可能含义。
- source_word: גְּעָרָה
  choice: 斥责
  rationale: 该词通常指严厉的责备、呵斥，也可能在此带有威吓意味。正文采用直接对应的“斥责”，较具体的社会语境留在脚注说明。
