- from: 懒惰人心里贪求，却一无所得；勤奋人的心愿必大得满足[a]。
  to: 懒惰人心有渴求，却一无所有；勤奋人的心愿必得丰足[a]。
  rationale: 修订以“心有渴求”自然表达首句 נַפְשׁוֹ 所指的欲求，不将其技术化为“灵魂”。将“必大得满足”改为“必得丰足”，更符合现代普通话，并更准确传达 דשׁן 的丰裕意象。脚注相应改正为被动式直译。
