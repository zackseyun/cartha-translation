base_translation:
  language: en
  yaml_path: translation/ot/proverbs/013/004.yaml
  text: The sluggard craves[a], but has nothing; but the appetite of the diligent will be richly satisfied.
translation:
  language: zh_hans
  text: 懒惰人心有渴求，却一无所有；勤奋人的心愿必得丰足[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “必得丰足”直译为“必被使肥润”；希伯来语以肥润比喻丰盛和充分满足。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִתְאַוָּה
  choice: 贪求
  rationale: 该词是 אוה 的 Hitpael 分词，表示持续、反复地想要。“贪求”比一般的“想要”更能体现强烈而惯常的欲求，也符合箴言对懒惰人的刻画。
- source_word: וָאַיִן
  choice: 却一无所得
  rationale: 存在否定词 אַיִן 表示“没有、毫无”，连接词在上下文中构成反差。译作“却一无所得”自然表达其欲求落空，同时不限定所缺之物。
- source_word: נַפְשׁוֹ
  choice: 心里
  rationale: נֶפֶשׁ 在此指人的欲求、胃口或内在愿望，并非专指神学意义上的“灵魂”。“心里”与“贪求”结合，能以现代汉语自然表达这种内在欲望。
- source_word: עָצֵל
  choice: 懒惰人
  rationale: 这是箴言中常见的智慧文学用语，指惯常懒散的人。“懒惰人”简洁明白，并保留人物类型的箴言风格。
- source_word: וְנֶפֶשׁ חָרֻצִים
  choice: 勤奋人的心愿
  rationale: חָרֻצִים 是复数形容词名词化，指勤勉的人；נֶפֶשׁ 在平行句中仍指欲求或心愿。“勤奋人的心愿”既保留平行关系，又符合现代汉语表达。
- source_word: תְּדֻשָּׁן
  choice: 必大得满足
  rationale: 这是 דשׁן 的 Pual 未完成式，字面意象是“被使得肥润”，引申为丰足并充分满足。“必大得满足”传达结果的充盈感，并以脚注保留原文意象。
theological_decisions: []
translation_notes:
  register: 采用简洁、对称的现代箴言体。“心里贪求”与“心愿必大得满足”自然呈现两分句的平行和反差；避免把 נֶפֶשׁ 技术化为“灵魂”，也不把后半句缩窄为单纯的物质富足。
