  terminology: “懒惰人”“勤奋人”合乎现代汉语的箴言体。“心愿”可表达 נֶפֶשׁ 在本节的欲求，避免误译为技术性的“灵魂”。脚注应将 Pual 的被动“被使肥润”表达得更准确。
