  yaml_path: translation/ot/proverbs/013/002.yaml
  text: From the fruit of a man's mouth he eats good[b][a], but the soul of the treacherous feeds on violence.
translation:
  language: zh_hans
  text: 人因口中所结的果子得享美福；背信之人的欲望却在于暴行。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本句希伯来文十分简略。“欲望”直译可作“生命”或“心魂”。第二分句没有明示动词；也可理解为承接上半句的“吃”，即“背信之人以暴行为食”。
    reason: lexical_alternative_and_alternative_reading
lexical_decisions:
- source_word: מִפְּרִי פִי אִישׁ
  choice: 人因口中所结的果子
  rationale: 保留“口”与“果子”的具体比喻，同时用“所结的”使现代汉语自然；אִישׁ在箴言中作泛指，译为“人”。מִן在此表达来源或凭借，译作“因”。
- source_word: יֹאכַל טוֹב
  choice: 得享美福
  rationale: יֹאכַל字面为“吃”，与前面的“果子”构成意象；但汉语直译“吃好”含混且不够庄重。“得享”保留享用所得成果之意，“美福”则维持טוֹב所指好处、福祉的宽泛性。
- source_word: וְנֶפֶשׁ
  choice: 欲望却
  rationale: נֶפֶשׁ可指生命、自我、心愿或欲求；在这个省略谓语、以“强暴”为补足成分的分句中，“欲望”较符合语境。וְ在两分句间具有对比作用，译为“却”。
- source_word: בֹּגְדִים
  choice: 奸诈之人
  rationale: 该分词描述惯于背信、行事诡诈的人；“奸诈之人”在现代汉语中自然，并保留其品格性描述。
- source_word: חָמָס
  choice: 强暴
  rationale: חָמָס常指暴力、残暴及暴力恶行。“强暴”是凝练而庄重的对应词，不把意义缩窄为某一种具体罪行。
theological_decisions:
- issue: 第二分句的省略结构
  choice: 正文保留“欲望……是强暴”的简练名词性表达，并以脚注说明也可补出“吞吃”
  alternative: 奸诈之人以强暴为食／奸诈之人的心欲吞吃强暴
  rationale: 希伯来文第二分句没有明示动词。第一分句的יֹאכַל“吃”可能延续到第二分句，也可能由נֶפֶשׁ表达“欲望、胃口”。正文不强行补入明确动作，脚注呈现另一种语法理解，以保存原文的简约和歧义。
translation_notes:
  register: 采用现代、凝练而庄重的箴言体。“口中所结的果子”保留原文意象；“得享美福”避免生硬的“吃好”。脚注标记[a]置于相关整句之后，兼顾נֶפֶשׁ的词义范围和第二分句的省略结构。
