  text: A wicked messenger falls into trouble[b][a], but a faithful envoy brings healing.
translation:
  language: zh_hans
  text: 邪恶的信使陷入祸患[a]；忠信的使者带来医治[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“邪恶的信使落在恶（或祸害）之中。”希伯来语较直译为“落在恶中”；这里可能指临到他的祸患。
    reason: lexical_alternative
  - marker: b
    text: “医治”也可译为“痊愈”或“良药”；在这里可指使受损的处境得到恢复。
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאָךְ
  choice: 信使
  rationale: 在箴言的社会语境中指传递信息的人，而非天使；“信使”自然且涵盖面较广。
- source_word: רָשָׁע
  choice: 邪恶的
  rationale: 作定语描述信使的道德品格，保留原文鲜明的伦理含义。
- source_word: יִפֹּל
  choice: 陷入
  rationale: 未完成式在箴言中表达一般规律；“陷入”既保留坠落意象，也能与“祸患”自然搭配。
- source_word: בְּרָע
  choice: 祸患
  rationale: 此处的 רָע 较可能指临到人的灾祸或有害后果，而非其所行的道德之恶；措辞仍在脚注中保留原文的多义性。
- source_word: צִיר
  choice: 使者
  rationale: 可指受差派执行任务的人。与前句“信使”略作区分，同时保持两类传讯者之间的平行。
- source_word: אֱמוּנִים
  choice: 忠信的
  rationale: 表达可靠、可信和忠于使命的品质；“忠信”简洁庄重，并保留其伦理分量。
- source_word: מַרְפֵּא
  choice: 医治
  rationale: 该名词可指医治、康复或补救；“带来医治”在现代汉语中自然，也能涵盖关系与处境的恢复。
theological_decisions: []
