  yaml_path: translation/ot/proverbs/013/001.yaml
  text: A wise son accepts a father's discipline[b][a], but a scoffer does not listen to rebuke.
translation:
  language: zh_hans
  text: 智慧的儿子接受父亲的管教[a]；嘲讽者却不听责备[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“智慧的儿子听从父亲的管教。”原文上句省略了动词，可由下句的“听”补出；“听”也可含接受、听从之意。
    reason: lexical_alternative
  - marker: b
    text: “嘲讽者”或译“讥诮者”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּן
  choice: 儿子
  rationale: 原文为阳性单数“儿子”，箴言以此作为典型人物；保留其具体称谓，不泛化为“孩子”。
- source_word: חָכָם
  choice: 智慧的
  rationale: 在智慧文学中指具有实际智慧和道德辨别力；“智慧的”自然且符合本书语境。
- source_word: מוּסַר
  choice: 管教
  rationale: 此词在《箴言》中常含塑造、训导和纠正之意，并非单指知识传授；“管教”也与下句的“责备”形成恰当对应。
- source_word: אָב
  choice: 父亲的
  rationale: 原文是无显明所有格后缀的属格结构，译作“父亲的”避免增添“他父亲的”这一限定。
- source_word: לֵץ
  choice: 嘲讽者
  rationale: 此词在《箴言》中指傲慢讥诮并拒绝纠正的人；“嘲讽者”能表达这种稳定的道德姿态。
- source_word: שָׁמַע
  choice: 接受／不听
  rationale: 本词可指听见、听从或接受。上句的动词由诗歌省略，按对句关系补作“接受”，表达听从管教；下句明载此动词，译作“不听”，保留拒绝听从的含义。
- source_word: גְּעָרָה
  choice: 责备
  rationale: 指言语上的斥责或谴责；“责备”是清楚、自然的现代汉语表达。
theological_decisions: []
