  yaml_path: translation/ot/proverbs/013/009.yaml
  text: The light of the righteous rejoices[a], but the lamp of the wicked goes out.
translation:
  language: zh_hans
  text: 义人的光欢喜[a]，恶人的灯却熄灭。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“喜乐”。希伯来语动词通常意为“欢喜”或“喜乐”；因本句以“光”为主语，也有人按语境理解为“照得明亮”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹר
  choice: 光
  rationale: 通常指“光、亮光”；这里与下半句的“灯”构成诗意对应。
- source_word: צַדִּיקִים
  choice: 义人
  rationale: 复数形容词作名词用，指行为正直、公义的人；“义人”简洁且符合智慧文学的庄重语体。
- source_word: יִשְׂמָח
  choice: 欢然照耀
  rationale: 该动词本义是“欢喜、喜乐”。因主语为“光”，译作“欢然照耀”既保留拟人化的喜乐意象，也使现代汉语表达自然；脚注说明更直译的可能。
- source_word: נֵר
  choice: 灯
  rationale: 指灯，通常为油灯，并非特指蜡烛；“灯”也保留下半句可熄灭的具体意象。
- source_word: רְשָׁעִים
  choice: 恶人
  rationale: 复数形容词作名词用，表示邪恶之人；与“义人”形成智慧文学中常见的道德对举。
- source_word: יִדְעָךְ
  choice: 熄灭
  rationale: 该词用于灯火时表示熄灭；中文“熄灭”准确保留这一意象，且不额外指定施事者。
- source_word: וְ
  choice: 却
  rationale: 字面可作“和”，但在反义平行句中具有转折作用；“却”自然传达上下两句的鲜明对照。
