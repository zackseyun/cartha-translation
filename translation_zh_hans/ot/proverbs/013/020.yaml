  yaml_path: translation/ot/proverbs/013/020.yaml
  text: Whoever walks with the wise will become wise[a], but a companion of fools will suffer harm.
translation:
  language: zh_hans
  text: 与智慧人同行的，必变得有智慧；与愚昧人为伴的，必受损害。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“必遭祸患”“必没有好下场”或“必走向败亡”。希伯来语动词可指受到伤害或遭遇不利的结果。
    reason: lexical_alternative
lexical_decisions:
- source_word: הָלוֹךְ אֶת חֲכָמִים
  choice: 与智慧人同行的
  rationale: 将不定词绝对式按箴言式的泛指人物表达处理；“同行”既保留行走意象，也自然传达长期交往之意。אֶת在此表示陪伴，译作“与”。
- source_word: וַחֲכָם
  choice: 必有智慧
  rationale: 该形式表达与智慧人同行所产生的结果。“必有智慧”在现代汉语中自然、庄重，也不把经文的结果含义收窄为单纯获得知识。
- source_word: וְרֹעֶה כְסִילִים
  choice: 与愚昧人为伴的
  rationale: רֹעֶה在此按结交、相伴理解，与上句“同行”形成平行；若直译为“牧养愚昧人”会在汉语中造成误导。כְסִילִים采用箴言中的道德—认知类别“愚昧人”。
- source_word: יֵרוֹעַ
  choice: 必受损害
  rationale: רעע的尼法勒式可指遭受伤害或落入不利境况。“受损害”保留较宽的后果范围，不夸大为必然彻底毁灭。
