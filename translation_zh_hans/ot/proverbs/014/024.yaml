base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/024.yaml
  text: The crown of the wise is their wealth[a], but the folly of fools is folly.
translation:
  language: zh_hans
  text: 智慧人的冠冕是他们的财富；愚昧人的愚妄是愚妄。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译（依照一些古代译本及解经传统）：“愚昧人的财富是愚妄。”马所拉文本作：“愚昧人的愚妄是愚妄。”
    reason: alternative_reading
lexical_decisions:
- source_word: עֲטֶרֶת
  choice: 冠冕
  rationale: 此词指冠冕或花冠，常象征尊荣；“冠冕”保留了原文以显明尊荣为喻的表达。
- source_word: חֲכָמִים
  choice: 智慧人
  rationale: 复数形式泛指有智慧的人；“智慧人”符合《箴言》的文体，也不额外限定性别。
- source_word: עָשְׁרָם
  choice: 他们的财富
  rationale: עֹשֶׁר意为财富、财物，词尾表示“他们的”；此译准确且为现代读者所熟悉。
- source_word: אִוֶּלֶת
  choice: 愚妄
  rationale: 此词不只指欠缺知识，也指智慧文学中道德与判断上的愚昧；“愚妄”简洁庄重，并适合格言体。
- source_word: כְּסִילִים
  choice: 愚昧人
  rationale: 此词指智慧文学意义上在道德和认知方面顽钝的人；“愚昧人”是自然、清楚且不失庄重的译法。
- source_word: אִוֶּלֶת כְּסִילִים אִוֶּלֶת
  choice: 愚昧人的愚妄终究是愚妄
  rationale: 马所拉文本有意重复“愚妄”，形成强调性的同语反复；加入“终究”使现代汉语通顺，同时保留其尖锐的格言效果，没有改成古译本所反映的“愚昧人的财富”。
theological_decisions:
- issue: 财富与智慧之间的关系
  choice: 保留“智慧人的冠冕是他们的财富”这一陈述，不补充财富必然源于智慧或必然证明属灵美德等解释。
  alternative: 将本句解释性地译为智慧带来财富，或财富证明人有智慧。
  rationale: 希伯来文本只建立“冠冕”与“财富”的关系，具体是智慧善用财富、财富彰显智慧，还是财富成为智慧人的尊荣标志，仍有一定语义张力，不宜在译文中替读者决定。
translation_notes:
  register: 采用现代、庄重而易懂的箴言体。“冠冕”保留原文意象；“终究”使希伯来语的同语反复在汉语中自然有力。脚注标记置于相关分句之后。
