base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/005.yaml
  text: A faithful witness does not lie[a], but a false witness breathes out lies.
translation:
  language: zh_hans
  text: 忠实的证人不说谎；作假见证的人却吐出谎言。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “吐出谎言”也可译作“说出虚假之言”。希伯来语动词把虚假的证词描绘成从口中呼出或吐出的东西。
    reason: 词义替代译法
lexical_decisions:
- source_word: עֵד
  choice: 证人
  rationale: 该名词指作证的人；“证人”是现代汉语中自然、准确的法律及道德用语，也适用于本节两个分句。
- source_word: אֱמוּנִים
  choice: 忠实的
  rationale: 这里修饰“证人”，表达可靠、可信并忠于事实的品格；“忠实的”简洁自然，也保留箴言所强调的道德意味。
- source_word: לֹא יְכַזֵּב
  choice: 不说谎
  rationale: כזב 的 Piel 形式在作证语境中指说虚假的话；“不说谎”是清楚、自然的现代汉语表达。
- source_word: וְיָפִיחַ
  choice: 却喷吐
  rationale: 连接词按两个分句之间的对比关系译为“却”。פוח 的 Hiphil 形式带有呼出、吐出言语的形象，“喷吐”保留了原文鲜明的隐喻。
- source_word: כְּזָבִים
  choice: 谎言
  rationale: 该词为复数，表示虚假的话；汉语集合性名词“谎言”无需显式标出复数，并与“喷吐”自然搭配，传达不断说出虚假话语的意味。
- source_word: עֵד שָׁקֶר
  choice: 假证人
  rationale: 这是指所作证词虚假的人；“假证人”是简洁、自然且具有经文互文辨识度的汉语表达。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的箴言体。两个分句结构紧凑对称，以“却”明确其反义平行关系；保留“喷吐”的原文意象，同时用脚注提供较平实的译法。
