id: PRO.14.9
reference: Proverbs 14:9
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אֱ֭וִלִים יָלִ֣יץ אָשָׁ֑ם וּ/בֵ֖ין יְשָׁרִ֣ים רָצֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/009.yaml
  text: Fools mock guilt[b][a], but among the upright there is favor.
translation:
  language: zh_hans
  text: 愚妄人嘲笑罪责[a]，正直人中却有恩惠[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“愚妄人嘲笑赎愆祭。”希伯来语 אָשָׁם 既可指“罪责”，在祭祀语境中也可指“赎愆祭”。
    reason: alternative_reading
  - marker: b
    text: “恩惠”也可译为“悦纳”或“善意”；希伯来文没有说明这恩惠出自谁。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱוִלִים
  choice: 愚妄人
  rationale: 这是《箴言》中常见的道德智慧类别，不只是智力不足；“愚妄人”简洁庄重，并保留其伦理含义。
- source_word: יָלִיץ
  choice: 嘲笑
  rationale: לוץ 的使役形在此表达讥诮、轻蔑或不当回事；“嘲笑”自然地传达愚妄人轻看罪责的态度。
- source_word: אָשָׁם
  choice: 罪责
  rationale: 该词可指犯罪所招致的罪咎、责任，也可在祭祀语境中指赎愆祭。本节属于智慧伦理语境，“罪责”较贴合上下句的道德对比，同时以脚注保留祭祀含义。
- source_word: וּבֵין
  choice: 中却有
  rationale: 介词表示“在……中间”，连接词在对偶中形成反差；“却”清楚呈现上下两句的对比。
- source_word: יְשָׁרִים
  choice: 正直人
  rationale: 这是智慧文学中指道德正直之人的常用称谓；现代汉语清楚自然。
- source_word: רָצוֹן
  choice: 恩惠
  rationale: 该词可表示悦纳、恩宠或善意；“恩惠”保持较宽的语义，不限定其来源是上帝还是人。
theological_decisions:
- issue: אָשָׁם 在非祭祀性智慧语境中的含义
  choice: 正文译为抽象意义的“罪责”
  alternative: 赎愆祭
  rationale: 本节着重愚妄人与正直人的伦理对比，并未明确描述献祭程序，因此正文采用“罪责”；但原词确实也可指赎愆祭，故在脚注中保留这一可能。
- issue: רָצוֹן 的来源或主体
  choice: 以“恩惠”保持宽泛
  alternative: 上帝的恩宠；人的善意；悦纳
  rationale: 希伯来文没有说明是谁施予恩惠，也没有明确限定为神人关系或人际关系，因此不在正文中缩窄所指。
translation_notes:
  register: 采用现代标准普通话和简体中文，句式简洁，符合《箴言》的对偶风格。“愚妄人”“罪责”“正直人”保留智慧文学的庄重伦理语域；“恩惠”有意保留原文所指的开放性。
