base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/035.yaml
  text: A king’s favor is toward a servant who acts wisely[b][a], but his wrath is against one who brings shame.
translation:
  language: zh_hans
  text: 君王喜悦行事明智的臣仆[a]；他的烈怒却临到使人蒙羞的人[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “行事明智的”也可译作“处事审慎的”或“办事能干的”。
    reason: lexical_alternative
  - marker: b
    text: 原文仅作：“他的烈怒将是使人蒙羞者的。”怒气与此人的具体关系未明说；可理解为怒气临到或针对这样的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: רְצוֹן
  choice: 喜悦
  rationale: 该词表示有利的态度、悦纳或欢心；在君王与臣仆的宫廷语境中，“喜悦”自然地表达君王对人的赞许。
- source_word: מֶלֶךְ
  choice: 君王
  rationale: 准确表达男性君主，并与箴言的庄重语体相称。
- source_word: לְעֶבֶד
  choice: 臣仆
  rationale: לְ标示君王喜悦所指向的对象；此处着眼于为王办事的角色与表现，“臣仆”比泛称“奴隶”更切合宫廷语境，同时不否认原词可指从属身份。
- source_word: מַשְׂכִּיל
  choice: 行事明智的
  rationale: שׂכל的使役分词可指有洞见、处事审慎或办事有成；“行事明智”保留其动态和实践性。
- source_word: וְעֶבְרָתוֹ
  choice: 却……发怒
  rationale: עֶבְרָה指强烈的怒气；现代汉语中“发怒”比名词式“烈怒”更自然，并由“却”清楚呈现上下句的对比。
- source_word: תִּהְיֶה
  choice: 向……发
  rationale: 希伯来文直译为“他的怒气必/会是……”，关系需由语境补足；汉语用“向……发怒”自然表达怒气所针对的对象，而不额外强调时间。
- source_word: מֵבִישׁ
  choice: 贻羞的人
  rationale: בוש的使役分词在此指使人蒙羞、带来耻辱的人；“贻羞”简洁保留其致使含义。
theological_decisions:
- issue: 君王怒气与מֵבִישׁ之间关系的省略
  choice: 译作“向贻羞的人发怒”
  alternative: “他的怒气必临到贻羞的人”或较直译的“他的怒气必是为着贻羞的人”
  rationale: 原文只用系词表达怒气与对象的关系，介词关系含蓄；正文采用自然汉语表达通常理解，同时用脚注保留其形式上的不明确性。
translation_notes:
  register: 采用现代、庄重而易懂的箴言体。上下句以“喜悦……却……发怒”构成鲜明对偶；“臣仆”体现宫廷服务语境，“贻羞”凝练表达导致羞耻或败坏名声。
