  yaml_path: translation/ot/proverbs/014/017.yaml
  text: A short-tempered man acts foolishly[b][a], and a man of schemes is hated.
translation:
  language: zh_hans
  text: 易怒的人[a]做出愚妄的事；有图谋的人[b]被人憎恨。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “易怒”也可译作“性情急躁”。原文是一个表示很快动怒的希伯来语习语。
    reason: lexical_alternative
  - marker: b
    text: “图谋”也可译作“谋划”或“计谋”。原词本身可指计划或谋略，在这里很可能带贬义。
    reason: lexical_alternative
lexical_decisions:
- source_word: קְצַר אַפַּיִם
  choice: 易怒的人
  rationale: 这是希伯来语习语，字面为“怒气短”或“鼻息短”，指很快动怒的人。“易怒”在现代汉语中自然、准确，并保留其性情特征。
- source_word: יַעֲשֶׂה
  choice: 做出
  rationale: 该动词通常表示“做、行”。与后面的抽象名词“愚妄”结合时，译作“做出愚妄的事”符合现代汉语表达，也贴近原文。
- source_word: אִוֶּלֶת
  choice: 愚妄的事
  rationale: 该名词表示愚昧、愚妄或愚妄之举；这里译成具体行为，清楚表达易怒所导致的愚妄行动。
- source_word: אִישׁ
  choice: 人
  rationale: 原文为阳性单数“男人、某人”，在箴言中用来描写一种代表性的人物类型；汉语用“人”既自然，也不改变其泛指功能。
- source_word: מְזִמּוֹת
  choice: 图谋
  rationale: 该词可指计划、谋划或计谋，在智慧文学中常带贬义。“图谋”保留策划、盘算之意及此处很可能具有的负面色彩，同时不直接增添原文没有明说的“恶”。
- source_word: יִשָּׂנֵא
  choice: 招人恨恶
  rationale: 原文是被动式，直译为“被恨恶”。“招人恨恶”是自然的现代汉语表达，仍然保留此人受到他人憎恶的被动意义；一般现在时体现箴言的普遍陈述。
