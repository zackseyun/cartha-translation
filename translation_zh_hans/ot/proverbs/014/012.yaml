  text: יֵ֤שׁ דֶּ֣רֶךְ יָ֭שָׁר לִ/פְנֵי אִ֑ישׁ וְ֝/אַחֲרִיתָ֗/הּ דַּרְכֵי מָֽוֶת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/012.yaml
  text: There is a way that seems right to a man[a], but its end is the ways of death.
translation:
  language: zh_hans
  text: 有一条路，人看为正[a]；但它的结局却是死亡的道路。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译是“在一个人面前为正”，意思是在他自己看来是正的。
    reason: 说明希伯来语 לִפְנֵי אִישׁ 的字面形式及其惯用意义。
lexical_decisions:
- source_word: יֵשׁ
  choice: 有
  rationale: 存在句引出一项普遍真理；“有”简洁自然，符合汉语箴言体。
- source_word: דֶּרֶךְ
  choice: 一条路
  rationale: 既保留道路的字面意象，也承载智慧文学中人生道路、行事方式的比喻意义。
- source_word: יָשָׁר לִפְנֵי אִישׁ
  choice: 人看为正
  rationale: לִפְנֵי字面为“在……面前”，此处表达在某人看来；“人看为正”自然地保留主观判断，并未把它解释成客观正确。
- source_word: וְאַחֲרִיתָהּ
  choice: 但最终却
  rationale: וְ在语义上形成转折；אַחֲרִיתָהּ指这条路的结局或最终归宿。“最终”简明且有箴言的力度。
- source_word: דַּרְכֵי מָוֶת
  choice: 通向死亡的道路
  rationale: 保留דֶּרֶךְ与דַּרְכֵי之间“路／道路”的词根呼应，并尽量体现后者的复数；“通向”明确表达这些道路以死亡为结局，而不把死亡弱化为一般灾祸。
theological_decisions:
- issue: אִישׁ的泛指阳性
  choice: 人
  alternative: 男人；一个人
  rationale: 此处אִישׁ在箴言中具有代表性、泛指作用。现代汉语“人”不增添性别限制，也不消除其个体性的警戒作用。
- issue: “死亡”的性质
  choice: 死亡
  alternative: 毁灭；败亡
  rationale: 原文明确使用מָוֶת。译文保留“死亡”，不擅自限定为肉身死亡、属灵死亡或泛化的灾祸。
- issue: 单数“路”与复数“道路”的张力
  choice: 一条路……通向死亡的道路
  alternative: 一条路……结局却是死亡
  rationale: 保留原文从单数דֶּרֶךְ转为复数דַּרְכֵי的显著形式变化，虽汉语略显反常，却传达结局所呈现的死亡之路，并避免抹平原文张力。
translation_notes:
  register: 采用现代、庄重而简洁的箴言体。“人看为正”比“在人面前是正的”更符合现代汉语，同时脚注保留原文意象。主句用“一条路”，后句用“道路”体现希伯来语的单复数变化。
