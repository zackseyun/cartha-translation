  terminology: “路／道路”保留同一意象及原文单复数变化；“正”适切表达“看似正确”；“死亡”忠实保留 מָוֶת，未作教义性扩展。脚注正确说明 לִפְנֵי אִישׁ 的字面形式和惯用含义。
