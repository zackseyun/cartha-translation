  text: Even in laughter the heart may ache[b][a], and the end of joy is grief.
translation:
  language: zh_hans
  text: 即使在欢笑中，心也可能痛苦[a]；喜乐的结局是忧愁[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“即使在欢笑中，心也会痛苦。”希伯来语未完成式在箴言中也可表示一般性的现在事实。
    reason: lexical_alternative
  - marker: b
    text: “结局”也可译为“结果”；整句也可理解为“喜乐过后便是忧愁”。
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: 即使
  rationale: 在此带有让步和强调意味，表达虽有欢笑，内心仍可能痛苦。
- source_word: בִּשְׂחוֹק
  choice: 在欢笑中
  rationale: 保留介词结构和“欢笑”的具体意象，现代汉语也自然。
- source_word: יִכְאַב
  choice: 可能痛苦
  rationale: 未完成式在箴言中可表达一般事实或可能情形；“可能”保留其语义开放性，不把它限定为每次必然如此。
- source_word: לֵב
  choice: 心
  rationale: 智慧文学中常指人的内在情感与自我；直译为“心”清楚而自然。
- source_word: וְאַחֲרִיתָהּ
  choice: 结局
  rationale: אַחֲרִית可指终局、结果或后来；阴性单数后缀最自然地回指“喜乐”。“结局”保留终末结果的意象。
- source_word: שִׂמְחָה
  choice: 喜乐
  rationale: 与“忧愁”形成鲜明对照，语体庄重而仍为现代读者熟悉。
- source_word: תוּגָה
  choice: 忧愁
  rationale: 该词表示悲伤、愁苦；“忧愁”准确、自然，并与“喜乐”构成对比。
