base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/026.yaml
  text: In the fear of Yahweh there is strong confidence[a], and for his children there will be a refuge.
translation:
  language: zh_hans
  text: 敬畏耶和华的人，大有倚靠；他的儿女[a]也有避难所。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他的儿女”也可能指“耶和华的儿女”，即把“他的”理解为指耶和华；不过这种理解可能性较小。
    reason: alternative_reading
lexical_decisions:
- source_word: בְּ/יִרְאַת
  choice: 敬畏……，就
  rationale: בְּ加构词形名词יִרְאָה表达处于敬畏耶和华的境况中。汉语用“敬畏……，就”自然呈现这种关联，同时避免把敬畏弱化为单纯手段。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经传统中对四字神名的通行音译“耶和华”，以专名而非称号呈现。
- source_word: מִבְטַח עֹז
  choice: 坚固的倚靠
  rationale: מִבְטַח可指信赖、把握或安全，עֹז表示力量、坚固；合起来译作“坚固的倚靠”，兼顾内在信心与可靠保障，且符合箴言的凝练语体。
- source_word: וּ/לְ/בָנָי/ו
  choice: 他的儿女也
  rationale: בָּנִים在泛指后代时可译“儿女”；三单阳性后缀按上下文主要理解为敬畏耶和华的人。介词לְ所表达的受益关系通过“也必有”自然体现，避免生硬直译“为他的儿女”。
- source_word: יִהְיֶה
  choice: 必有
  rationale: היה在此表示存在或拥有；“必有”简洁表达未来性的应许语气，又不额外指定主语。
- source_word: מַחְסֶה
  choice: 避难所
  rationale: 该词指躲避危险的庇护处；“避难所”保留具体的保护意象，并与前半句的抽象“倚靠”形成平行。
theological_decisions:
- issue: “他的儿女”中代词后缀的所指
  choice: 正文将“他的”理解为指敬畏耶和华的人。
  alternative: 也可理解为指耶和华，即“耶和华的儿女”。
  rationale: 就近文意与箴言的表达推进而言，后缀较自然地回指敬畏耶和华的人，说明其儿女也蒙庇护；但希伯来语语法并未完全排除回指耶和华，因此在脚注保留另一理解。
translation_notes:
  register: 采用简洁、庄重而自然的现代普通话，保留希伯来箴言两分句的平行结构。正文选择较可能的代词所指，并以脚注保存真实歧义。
