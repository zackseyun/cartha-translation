  text: The house of the wicked will be destroyed[a], but the tent of the upright will flourish.
translation:
  language: zh_hans
  text: 恶人的房屋必被毁灭；正直人的帐篷却必兴旺[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“发芽”或“开花”；希伯来语动词带有植物萌发、生长的意象。
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּית
  choice: 房屋
  rationale: 该词为构造形式，与后面的“恶人”构成所属关系。“房屋”保留了与“帐棚”的具体居所对照，同时也可让人联想到其中的家室。
- source_word: רְשָׁעִים
  choice: 恶人
  rationale: 这里是形容词作名词的复数用法，指道德上邪恶的人；“恶人”简洁自然，并与“正直人”形成鲜明对照。
- source_word: יִשָּׁמֵד
  choice: 必被毁灭
  rationale: שׁמד 的尼法勒未完成式表达遭毁坏、被除灭；“必被毁灭”既传达箴言所宣告的结局，也不额外强化为彻底绝迹。
- source_word: אֹהֶל
  choice: 帐棚
  rationale: 按字面保留“帐棚”，不泛化为“住处”或“家”，从而呈现原文刻意的反差：恶人的房屋遭毁，正直人看似简陋的帐棚却兴盛。
- source_word: יְשָׁרִים
  choice: 正直人
  rationale: 指在道德上正直、行为端正的人；“正直人”准确保留此词与其他“义”类词汇之间的细微区别。
- source_word: יַפְרִיחַ
  choice: 必繁茂
  rationale: פרח 的使役形在这里唤起发芽、开花和生长的图景。“繁茂”既保留植物生长的比喻，又自然传达兴盛之意。
