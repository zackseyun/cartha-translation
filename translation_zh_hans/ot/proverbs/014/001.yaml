  yaml_path: translation/ot/proverbs/014/001.yaml
  text: The wisest of women builds her house[b][a], but a foolish woman tears it down with her own hands.
translation:
  language: zh_hans
  text: 最有智慧的妇人建造自己的家[a][b]；愚昧的妇人却亲手把它拆毁。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“凡有智慧的妇人都建造自己的家。”希伯来文句首也可理解为对一类人的泛指，而不是最高级表达。
    reason: lexical_alternative
  - marker: b
    text: “家”也可包括家庭、家业的意思，不仅指实际的房屋。
    reason: lexical_alternative
lexical_decisions:
- source_word: חַכְמוֹת נָשִׁים
  choice: 最有智慧的妇人
  rationale: 这个复数形式与“妇人”连用，在希伯来智慧文学中可表达最高程度；下接阴性单数动词，也与下半句单数的“愚昧的妇人”形成鲜明对照。译文保留最高级理解，同时以脚注说明也可能是泛指。
- source_word: בָּנְתָה
  choice: 建造
  rationale: 其形态虽为完成式，但箴言常以这种形式陈述普遍真理；现代汉语用一般现在意义的“建造”最自然，也保留与“拆毁”的具体对照。
- source_word: בֵיתָהּ
  choice: 自己的家
  rationale: בַּיִת既可指房屋，也可涵盖家庭或家业。“家”能保留原文意象及其宽广含义；“自己的”自然表达阴性所属后缀。
- source_word: אִוֶּלֶת
  choice: 愚昧的妇人
  rationale: 结合阴性单数动词和上下句的平行结构，此处宜按人物理解，而不是译作抽象的“愚昧”。
- source_word: בְּיָדֶיהָ
  choice: 亲手
  rationale: 该短语表示工具或施事，并强调她本人的责任；“亲手”是自然、简洁的现代汉语表达。
- source_word: תֶהֶרְסֶנּוּ
  choice: 把它拆毁
  rationale: הרס指拆除、毁坏；“拆毁”与上句“建造”构成具体而有力的反义对照。“它”回指前面的“家”。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。以“建造—拆毁”保留原文鲜明的具体意象和对偶结构；“亲手”突出行为者自身的责任。两个脚注分别保留句首结构及“家”的真实语义幅度。
