  text: הוֹלֵ֣ךְ בְּ֭/יָשְׁר/וֹ יְרֵ֣א יְהוָ֑ה וּ/נְל֖וֹז דְּרָכָ֣י/ו בּוֹזֵֽ/הוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/002.yaml
  text: Whoever walks in uprightness fears Yahweh[b][a], but the one whose ways are crooked despises him.
translation:
  language: zh_hans
  text: 行为正直的，敬畏耶和华；行径偏邪的，却藐视他。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他”最自然是指耶和华；也有人作较宽泛的理解，或认为是指正直的人。
    reason: alternative_reading
lexical_decisions:
- source_word: הוֹלֵךְ בְּיָשְׁרוֹ
  choice: 行为正直的
  rationale: הלך在智慧文学中常以“行走”比喻人的生活与行事方式；现代汉语用“行为正直”自然传达这一含义，同时保留道德正直的核心。
- source_word: יְרֵא יְהוָה
  choice: 敬畏耶和华
  rationale: “敬畏”是箴言中ירא与神名连用时准确而通行的译法，兼具畏惧、尊崇与顺服之意；יהוה按现代中文圣经传统译作“耶和华”。
- source_word: וּנְלוֹז דְּרָכָיו
  choice: 行径偏邪的
  rationale: נלוז表示扭曲、偏斜或乖谬，דרכים指一贯的行为道路；“行径偏邪”保留道路意象，也符合现代汉语表达。
- source_word: בּוֹזֵהוּ
  choice: 却藐视他
  rationale: בזה意为轻看、蔑视；三单阳性后缀最自然地回指前句的耶和华。“却”明确呈现两分句的反义对照。
theological_decisions:
- issue: בּוֹזֵהוּ中代词后缀的所指
  choice: 译作“藐视他”，正文按最自然的句法与对偶关系理解为藐视耶和华。
  alternative: 也有人把“他”作较宽泛的理解，或认为它指正直的人。
  rationale: 耶和华是最近且最连贯的先行词；“敬畏耶和华”与“藐视他”构成鲜明对照。但希伯来语代词本身不重复所指名词，因此将较次要的理解保留在脚注中。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语，保持箴言式的平行与对照。正文不机械照译“行走”，而以“行为”表达生活方式；“行径偏邪”保留希伯来文关于道路扭曲的形象。
