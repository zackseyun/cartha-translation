  text: נָחֲל֣וּ פְתָאיִ֣ם אִוֶּ֑לֶת וַֽ֝/עֲרוּמִ֗ים יַכְתִּ֥רוּ דָֽעַת׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/018.yaml
  text: The simple inherit folly[a], but the prudent are crowned with knowledge.
translation:
  language: zh_hans
  text: 愚蒙人承受愚妄，精明人却以知识为冠[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“精明人以知识装饰自己。”希伯来语动词可表示“加冠”或“环绕、装饰”，这里也可着重于他们以知识为装饰、如同戴上冠冕的状态。
    reason: 词义存在合理的翻译选择，原文既容许主动加冠的理解，也可突出被知识装饰、加冠后的状态。
lexical_decisions:
- source_word: נָחֲלוּ
  choice: 承受
  rationale: 该词表示承受产业或取得为业。“承受”保留了把“愚妄”比作所得产业的反讽意味，也比单说“得到”更能体现原文意象。
- source_word: פְתָאיִם
  choice: 愚蒙人
  rationale: 在《箴言》中指缺乏经验、心思开放而容易受诱导的人。“愚蒙人”是现代中文圣经智慧文学中清楚而庄重的类别用语，不把他们简单等同于智力低下的人。
- source_word: אִוֶּלֶת
  choice: 愚妄
  rationale: 这是智慧文学中的核心词，兼有道德、判断和行为上的愚昧。“愚妄”简洁地保留了这种综合含义。
- source_word: עֲרוּמִים
  choice: 精明人
  rationale: 此词可指机敏、审慎或精明；本节与“愚蒙人”对举，语境取正面意义。“精明人”既体现洞察力，也不额外加入特定神学含义。
- source_word: יַכְתִּרוּ
  choice: 以……为冠
  rationale: 该使役词形可表达环绕、加冠或以某物装饰。“以知识为冠”保留冠冕意象，并自然呈现精明人与知识之间的主动关系及所得状态，而不强行消除原文在语态表达上的张力。
- source_word: דָעַת
  choice: 知识
  rationale: 该词是《箴言》的核心智慧用语，指带有辨识力的认识；“知识”是最直接且一致的译法。
theological_decisions: []
