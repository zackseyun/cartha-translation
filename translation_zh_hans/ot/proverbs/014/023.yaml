  text: In all labor there is profit[a], but mere talk leads only to lack.
translation:
  language: zh_hans
  text: 凡辛劳都有益处；嘴上空谈只会导致缺乏[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“贫穷”。希伯来语 מַחְסוֹר 可指缺乏、匮乏或贫穷。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּ/כָל עֶצֶב
  choice: 凡辛勤劳作
  rationale: בְּכָל在箴言式概括中表达普遍原则；עֶצֶב在此指带着辛苦和付出的劳作，而非单指情绪上的忧伤。“凡辛勤劳作”自然传达其概括性和劳苦意味。
- source_word: יִהְיֶה
  choice: 都有
  rationale: 未完成式在箴言中表达恒常的一般规律，汉语用现在时态的“都有”最自然。
- source_word: מוֹתָר
  choice: 收益
  rationale: מוֹתָר本义涉及剩余、盈余，进而可指益处或所得；“收益”既保留实际所得的意味，也不把范围限定为金钱利润。
- source_word: וּ/דְבַר שְׂפָתַיִם
  choice: 光动嘴
  rationale: 字面为“嘴唇的话”，在此与实际劳作形成对比，指只有言语而无相应行动。“光动嘴”是现代汉语中自然、简明的表达，并与אַךְ的限制语气相呼应。
- source_word: אַךְ לְ/מַחְסוֹר
  choice: 只会导致缺乏
  rationale: אַךְ强调结果仅止于此；לְ表示趋向或结果。מַחְסוֹר可指缺少、匮乏或贫穷，“缺乏”保留了希伯来词较宽的语义范围。
theological_decisions: []
