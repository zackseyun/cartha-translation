  rationale: 修订仅精确化后半句：以“明辨的人”对应נָבוֹן，并以“轻而易得”直接呈现נָקָל。首句及其脚注保留原译对原文省略宾语和存在式表述的处理，未增添寻求失败的原因或任何神学解释。
