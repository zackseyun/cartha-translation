  text: בִּקֶּשׁ לֵ֣ץ חָכְמָ֣ה וָ/אָ֑יִן וְ/דַ֖עַת לְ/נָב֣וֹן נָקָֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/006.yaml
  text: A scoffer seeks wisdom and there is none[b][a], but knowledge comes easily to one who has understanding.
translation:
  language: zh_hans
  text: 嘲讽者寻求智慧，却一无所得[a]；知识对明辨的人来说轻而易得。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译：“却没有。”也可译作“却找不到”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּקֶּשׁ
  choice: 寻求
  rationale: 完成式在箴言的格言语体中可表达普遍事实；汉语用“寻求”自然呈现持续有效的一般性陈述。
- source_word: לֵץ
  choice: 嘲讽者
  rationale: 指以傲慢态度讥诮智慧、拒绝劝诫的人；“嘲讽者”既保留道德色彩，也符合现代汉语。
- source_word: חָכְמָה
  choice: 智慧
  rationale: 这是箴言中的核心用语，不只指聪明，也包括合乎正道、善于处世的明智。
- source_word: וָאָיִן
  choice: 却一无所得
  rationale: 希伯来文直译为“却没有”；结合“寻求”，译作“一无所得”自然地表达其寻求落空，同时以脚注保留原文的存在式措辞。
- source_word: וְדַעַת
  choice: 知识
  rationale: 保留דַּעַת与“智慧”之间相关但不完全相同的概念，指已经领会的认识。
- source_word: לְנָבוֹן
  choice: 明哲人
  rationale: נָבוֹן指有辨别力、能领悟的人。“明哲人”简洁而庄重，并保留箴言中代表性的阳性单数表达。
- source_word: נָקָל
  choice: 轻易获得
  rationale: 该词表示容易、毫不费难；与“知识”搭配时，“轻易获得”清楚呈现与前句徒劳寻求的对比。
theological_decisions:
- issue: 智慧文学中的代表性阳性单数
  choice: 明哲人
  alternative: 有悟性的人／明辨的人
  rationale: 原文为语法上的阳性单数，在格言中泛指具有明辨力的人。“明哲人”保留其单数人物形象，但不把适用范围限定为男性。
- issue: 嘲讽者寻求智慧却失败的表述
  choice: 却一无所得
  alternative: 却没有智慧／却找不到
  rationale: 原文只说“却没有”，并未明说失败的机制或神学原因；译文呈现寻求落空，但不额外解释他为何得不到智慧。
translation_notes:
  register: 采用简洁、对称的现代书面汉语，保留箴言格言体的凝练与庄重。“嘲讽者”与“明哲人”形成鲜明对照；分号呈现两个平行而转折的分句。
