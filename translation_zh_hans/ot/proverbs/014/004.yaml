base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/004.yaml
  text: Where there are no oxen[a], the manger is clean[b], but abundant crops come by the strength of an ox.
translation:
  language: zh_hans
  text: 没有牛，食槽倒是干净[a]；但靠牛的力气，收成丰盛[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “干净”也可理解为“空空的”。
    reason: lexical_alternative
  - marker: b
    text: “收成”也可译为“出产”“收获”或“产量”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאֵין אֲלָפִים
  choice: 没有牛
  rationale: בְּאֵין 表示缺少或不存在某物；אֲלָפִים 是牛的复数，在农耕语境中尤指可用于劳作的牛。“没有牛”简洁自然，也与后半句单数的 שׁוֹר 相呼应。
- source_word: אֵבוּס
  choice: 食槽
  rationale: 该词指牲畜进食的槽或喂食处。“食槽”是现代汉语中准确、通俗的对应词。
- source_word: בָּר
  choice: 干净
  rationale: 该词基本含义可涉及洁净、纯净；在这里形容没有牛时的食槽，语境上可理解为干净，也可能暗含空无饲料或没有牲畜造成的杂乱，因此以脚注保留另一种理解。
- source_word: וְרָב תְּבוּאוֹת
  choice: 但……收成丰盛
  rationale: וְ 在两幅景象之间具有明显转折作用，译为“但”；רָב 表示多、丰盛，תְּבוּאוֹת 指农作物的出产、收获或收益。“收成丰盛”自然呈现农业语境。
- source_word: בְּכֹחַ שׁוֹר
  choice: 靠牛的力气
  rationale: בְּ 表示手段或凭借，כֹחַ 是力量；שׁוֹר 为泛指的单数牛。“靠牛的力气”既保留工具性关系，也符合现代汉语表达。
theological_decisions: []
translation_notes:
  register: 采用简洁、对称的箴言体。“倒是”凸显前半句表面上的好处，“但”带出生产力与整洁之间的反差；措辞现代、通俗而保持庄重。
