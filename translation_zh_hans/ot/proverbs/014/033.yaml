base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/033.yaml
  text: Wisdom rests in the heart of a discerning man[a], but in the midst of fools it makes itself known.
translation:
  language: zh_hans
  text: '智慧安歇在明辨人的心中；

    在愚昧人当中却显露出来。[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “显露出来”也可译作“为人所知”或“被认出来”。本句后半句可能指智慧在愚昧人当中变得明显；原文没有说明它以何种方式显现。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּלֵב
  choice: 在……的心里
  rationale: 保留希伯来语“心”的具体意象；在希伯来思想中，这也涵盖人的思想、意志和内在生命。
- source_word: נָבוֹן
  choice: 明辨人
  rationale: 该词指有理解力和辨别力的人。“明辨人”简洁地传达智慧文学中的人物类型，也避免在中文中不必要地突出男性性别。
- source_word: תָּנוּחַ
  choice: 安居
  rationale: 该动词来自 נוח，表示停歇、安顿。“安居”既保留智慧安稳停驻的形象，也比单说“休息”更适合描述智慧在人心中的持久状态。
- source_word: חָכְמָה
  choice: 智慧
  rationale: 按普通抽象名词处理；中文无需借助大写来暗示额外的人格化。
- source_word: וּבְקֶרֶב
  choice: 但在……中间
  rationale: ו 在此处按上下文表达对比，译作“但”；קֶרֶב 的空间意象则由“中间”保留。
- source_word: כְּסִילִים
  choice: 愚昧人
  rationale: 这是箴言中常见的道德与认知类别，所指不只是智力不足，也包括拒绝智慧；“愚昧人”比“笨人”更庄重准确。
- source_word: תִּוָּדֵעַ
  choice: 也会显露出来
  rationale: ידע 的 Niphal 形式可理解为“被人知道”“变得为人所知”或带反身意味的“显露自己”。“显露出来”保留其语态弹性；“也”顺应中文，突出前后两种不同的显现方式，但不判定智慧为何在愚昧人中显露。
theological_decisions:
- issue: 智慧在愚昧人中“显露”的含义
  choice: 不补明智慧是因缺席、遭夸耀还是借对照而显露
  alternative: 译成“连愚昧人也张扬智慧”或“愚昧人中没有智慧，这一点显而易见”
  rationale: 原文只说智慧在愚昧人中 תִּוָּדֵעַ，具体机制具有真实歧义；正文不应替读者消解这层张力。
translation_notes:
  register: 采用现代、凝练而庄重的箴言体。以“安居”对“显露出来”，再现内在安稳与外在可见之间的对照；保留“心里”和“中间”的希伯来空间意象。
