  text: צְדָקָ֥ה תְרֽוֹמֵֽם גּ֑וֹי וְ/חֶ֖סֶד לְאֻמִּ֣ים חַטָּֽאת־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/034.yaml
  text: Righteousness exalts a nation[a], but sin is a disgrace to peoples.
translation:
  language: zh_hans
  text: 公义使邦国得尊荣；罪恶却使万民蒙羞。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节下半句的希伯来文较难解释。传统上通常理解为：罪恶使万民蒙受羞辱。该句中有一个词通常意为“慈爱”或“忠诚”，但在此处可能取罕见的“羞辱、耻辱”义；也有人按其通常含义理解为“对万民的慈爱是罪”。
    reason: alternative_reading
lexical_decisions:
- source_word: צְדָקָה
  choice: 公义
  rationale: 该词涵盖道德与社会层面的正直、公正；“公义”既保留其宽广的伦理含义，也符合智慧文学的庄重语体。
- source_word: תְרוֹמֵם
  choice: 使……尊荣
  rationale: 动词רום本义为“使升高”。此处比喻邦国因公义而地位提升、受人敬重；“使……尊荣”在现代汉语中自然，并保留升高所表达的荣耀意味。
- source_word: גּוֹי
  choice: 邦国
  rationale: 此处泛指一个政治或民族共同体，并非特指外邦人。“邦国”简洁庄重，也适合箴言的诗体表达。
- source_word: חֶסֶד
  choice: 使……蒙羞
  rationale: 该词通常意为“慈爱、忠诚”，但本节语境及反义平行结构要求负面含义。这里按罕见的“羞辱、耻辱”义理解为谓语，与后置的“罪恶”合成“罪恶使……蒙羞”。
- source_word: לְאֻמִּים
  choice: 万民
  rationale: 原文为复数的民族或人民群体。“万民”自然保留复数和概括性，并与单数“邦国”形成诗体对应。
- source_word: חַטָּאת
  choice: 罪恶
  rationale: 该名词通常指“罪”或“罪行”。译作“罪恶”可清楚表达与“公义”的对立，并在汉语中自然充当后半句的主语。
theological_decisions:
- issue: 第二行 וְחֶסֶד לְאֻמִּים חַטָּאת 的解释
  choice: 译为“罪恶却使万民蒙羞”
  alternative: “对万民的慈爱竟是罪”或“耻辱对万民而言是罪”
  rationale: 原文第二行语义和句法困难，尤其חֶסֶד通常具有正面意义。主译文依据上下行的反义平行，将חַטָּאת视为后置主语，并把חֶסֶד按罕见的负面意义理解为“羞辱、耻辱”。这形成“公义使邦国尊荣”与“罪恶使万民蒙羞”的清晰对照；脚注同时保留原文可能产生的其他理解。
translation_notes:
  register: 采用现代、庄重而简洁的箴言体。“尊荣／蒙羞”形成自然对照；“邦国／万民”保留原文单数与复数之间的诗体变化。脚注明示第二行的真实歧义，不在正文中强行展开。
