  text: לֵ֗ב י֭וֹדֵעַ מָרַּ֣ת נַפְשׁ֑/וֹ וּ֝/בְ/שִׂמְחָת֗/וֹ לֹא יִתְעָ֥רַב זָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/010.yaml
  text: The heart knows the bitterness of its soul[b][a], and no stranger shares in its joy.
translation:
  language: zh_hans
  text: 人心知道自己内心的苦楚[a]；它的喜乐，外人不能分享[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“自己生命（或心灵）的苦涩”。这里的“生命／心灵”指人的内在自我，并不一定是在对人的构成作专门说明。
    reason: lexical_alternative
  - marker: b
    text: 或译：“外人不能参与它的喜乐”，也可译作“外人不能介入它的喜乐”。原文动词可表示介入某事或在其中有分。
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵב
  choice: 人心
  rationale: 这里指人的内在自我，是思想和感受之所在。“人心”既保留希伯来文的心之意象，也符合现代汉语表达。
- source_word: יֹדֵעַ
  choice: 自知
  rationale: 此处强调亲身而内在的知晓；“自知”自然地表达唯有自己内心知道的意味。
- source_word: מָרַת נַפְשׁוֹ
  choice: 其中的苦楚
  rationale: 原文直译为“其生命／心灵的苦涩”。“苦楚”保留情感与经历上的苦涩含义，“其中”则自然表达这苦楚属于内在生命，而不把 נֶפֶשׁ 技术化为关于人构成的“灵魂”。
- source_word: וּבְשִׂמְחָתוֹ
  choice: 它的喜乐
  rationale: שִׂמְחָה 表示喜乐；代词仍以“人心”为语法上的指向，保存上下两句的对应。
- source_word: יִתְעָרַב
  choice: 分享
  rationale: 该词的反身词干在这里可指介入、参与或一同有分；“分享”能清楚表达外人不能进入当事人内在喜乐的意思。
- source_word: זָר
  choice: 外人
  rationale: 这里不是强调族群意义上的外国人，而是指处于他人内在经历之外的人；“外人”比“陌生人”更准确体现这种关系距离。
theological_decisions: []
translation_notes:
  register: 采用现代、凝练而庄重的箴言体。分号呈现两个彼此对应的观察；“人心—外人”突显个人内在经历难以由他人完全进入。
