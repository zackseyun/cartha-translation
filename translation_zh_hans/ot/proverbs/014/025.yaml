base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/025.yaml
  text: A truthful witness rescues lives[c][b][a], but one who breathes out lies is deceitful.
translation:
  language: zh_hans
  text: 诚实的见证人救人性命[a]；吐出[b]谎言的，却满是诡诈[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “性命”也可译作“人”。这里的希伯来词可指人或人的生命，并非特指与身体分离的灵魂。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“吐出谎言”，以呼气、吹气的形象描写说出虚假的话。
    reason: lexical_alternative
  - marker: c
    text: 后半句也可更直译为“吐出谎言的，就是诡诈”，或理解为“诡诈地吐出谎言”。
    reason: alternative_reading
lexical_decisions:
- source_word: מַצִּיל
  choice: 救
  rationale: 该词是 נצל 的使役分词，表示使人脱离危险、获得解救。“救”简洁自然，也符合见证使人免遭伤害或死亡的实际语境。
- source_word: נְפָשׁוֹת
  choice: 人性命
  rationale: נֶפֶשׁ 的复数在此指人或人的生命，并非特指与身体分离的“灵魂”。“人性命”既保留生命受拯救的含义，也明确所指是人。
- source_word: עֵד אֱמֶת
  choice: 诚实的见证人
  rationale: 这个短语指以真实可靠为特征的见证人。“诚实的见证人”是现代汉语中自然、清楚的表达。
- source_word: וְיָפִחַ
  choice: 吐出
  rationale: פוח 原有吹气、呼出之意，在此形象地描写说出虚假之言。“吐出”保留了希伯来文生动的言语意象。
- source_word: כְּזָבִים
  choice: 谎言
  rationale: 该复数名词指虚假的话。“谎言”是现代汉语最直接自然的对应词。
- source_word: מִרְמָה
  choice: 行诡诈
  rationale: 原文以名词“诡诈”简洁收束，句法可作对说谎者的刻画，也可带有方式意味。“行诡诈”在中文中通顺，并保留其欺骗性质；脚注说明更贴近原文形式的译法。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的箴言体。两分句保持鲜明对照；“吐出”保留原文的生动意象，“行诡诈”使结句在汉语中自然，同时用脚注保留原文名词性结尾的句法张力。
