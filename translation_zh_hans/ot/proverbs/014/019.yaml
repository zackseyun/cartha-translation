  text: שַׁח֣וּ רָ֭עִים לִ/פְנֵ֣י טוֹבִ֑ים וּ֝/רְשָׁעִ֗ים עַֽל שַׁעֲרֵ֥י צַדִּֽיק־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/019.yaml
  text: The evil bow down before the good[b][a], and the wicked at the gates of the righteous.
translation:
  language: zh_hans
  text: 坏人在好人面前俯伏[a]；恶人在义人的门前俯伏[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “俯伏”也可译作“俯身下拜”。原文动词可指深深弯腰，甚至伏在地上。
    reason: lexical_alternative
  - marker: b
    text: “在义人的门前”可能暗示恶人前来求助、恳求，或承认义人的地位；原文没有明确说明。
    reason: cultural_note
lexical_decisions:
- source_word: שַׁחוּ
  choice: 俯伏
  rationale: 该动词表示俯身下拜，甚至俯伏在地。“俯伏”保留动作的深度，也不武断说明这是自愿敬服还是被迫降卑。后半句承接同一动词，补出“屈身”，使中文句意完整。
- source_word: רָעִים
  choice: 坏人
  rationale: 这是形容词作名词的复数用法，泛指作恶的人。“坏人”通俗自然，并与“好人”构成原文直接的反义对应。
- source_word: לִפְנֵי
  choice: 在……面前
  rationale: 准确表达在某人面前或当着某人的面，并适合俯伏的场景。
- source_word: טוֹבִים
  choice: 好人
  rationale: 这是形容词作名词的复数用法。“好人”保留其宽泛含义，避免把它收窄为原文未明确使用的“正直人”。
- source_word: וּרְשָׁעִים
  choice: 恶人
  rationale: 这是智慧文学中对邪恶之人的常见称呼；“恶人”简洁庄重，也与“义人”形成惯常对照。
- source_word: עַל
  choice: 在……前
  rationale: 与“门”连用时表示所在位置，即来到或停在门口；中文用“门前”最自然。
- source_word: שַׁעֲרֵי
  choice: 门前
  rationale: 原文为复数构造形式“……的众门/门口”。汉语泛指某人的门口时通常用单数形式“门前”，既自然又保留入口处的空间意象。
- source_word: צַדִּיק
  choice: 义人
  rationale: 原文是单数形容词作名词，指一个具有代表性的公义之人。“义人”是简洁、庄重且符合智慧文学语域的译法。
theological_decisions:
- issue: 恶人俯伏的性质
  choice: 不说明是自愿敬服还是被迫降服
  alternative: 译成“降服”或“求告”
  rationale: 原文只描写俯伏和身处义人门前，并未明确动作的动机；保留这种张力可避免加入原文没有明说的末世审判、社会逆转或求助情境。
- issue: “在义人的门前”的含义
  choice: 保留具体的门前意象
  alternative: 解释为“向义人求助”或“承认义人的地位”
  rationale: 门前可能暗示依赖、恳求或承认其地位，但这些是语境推论，不宜直接写入正文。
translation_notes:
  register: 采用现代、凝练而庄重的箴言体。首句以“坏人／好人”保留原文 רָעִים／טוֹבִים 的直接反义，次句以“恶人／义人”呈现智慧文学中的道德类别。中文后半句补出“屈身”，承接原文首句动词，避免形成不完整句，同时不增加具体动机。
