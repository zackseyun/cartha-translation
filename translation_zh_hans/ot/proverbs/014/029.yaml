  yaml_path: translation/ot/proverbs/014/029.yaml
  text: One who is slow to anger has great understanding[a], but one who is quick-tempered exalts folly.
translation:
  language: zh_hans
  text: 不轻易发怒的人大有聪明；性情急躁的人[a]却高举愚妄。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “性情急躁”原文直译为“灵短”，即缺乏耐性、容易动怒。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶרֶךְ אַפַּיִם
  choice: 不轻易发怒的人
  rationale: 这个希伯来语习语直译为“鼻孔长”，表示有耐性、迟迟才动怒。“不轻易发怒”既自然清楚，也保留了原文所强调的克制。
- source_word: רַב תְּבוּנָה
  choice: 大有聪明
  rationale: רַב 在此表示丰盛、充足，תְּבוּנָה 指理解力、洞察力。“大有聪明”简洁地表达“富有理解力”，并符合箴言体的凝练风格。
- source_word: קְצַר רוּחַ
  choice: 性情急躁的人
  rationale: 该短语直译为“灵短”，在此与“不轻易发怒”相对，指缺乏耐性、容易动怒的人。“性情急躁”是现代汉语中自然且准确的对应表达，原文字面意象见脚注。
- source_word: מֵרִים
  choice: 高举
  rationale: 这是 רום 的使役分词，基本义为“举起、抬高”。“高举”保留原文的提升隐喻，没有把它过早解释为仅仅“显露”或“张扬”。
- source_word: אִוֶּלֶת
  choice: 愚妄
  rationale: 此词在《箴言》中常指兼具道德与理智偏差的愚昧。“愚妄”比单纯的“无知”更能表达这一智慧文学范畴。
theological_decisions: []
translation_notes:
  register: 采用简洁、对称的箴言体。“不轻易发怒”与“性情急躁”形成清楚对比；“高举愚妄”刻意保留希伯来文的隐喻及其可能包含的“抬高、张扬、使之显眼”等含义。
