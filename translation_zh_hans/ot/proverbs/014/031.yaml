base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/031.yaml
  text: Whoever oppresses the poor insults his Maker[a], but whoever is gracious to the needy honors him.
translation:
  language: zh_hans
  text: 欺压贫寒人的，是侮辱他的造物主；恩待穷乏人的，是尊崇他[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“尊重贫寒人的，就是恩待穷乏人。”原文“尊崇他”中的“他”既可指贫寒人，也可指他的造物主；正文依据上下半句的对偶关系，理解为指神。
    reason: alternative_reading
lexical_decisions:
- source_word: עֹשֵׁק
  choice: 欺压
  rationale: Qal主动分词在此泛指一类人；“欺压”自然表达以权势压迫、剥削弱者的含义。
- source_word: דָּל
  choice: 贫寒人
  rationale: 该词可指贫穷、软弱或社会地位低下的人；“贫寒人”既突出经济困境，也保留其弱势处境。
- source_word: חֵרֵף
  choice: 侮辱
  rationale: 该动词表示辱骂、蔑视或使受羞辱；此处指欺压穷人就是对其创造主的冒犯。
- source_word: עֹשֵׂהוּ
  choice: 造他的主
  rationale: 后缀最自然地回指贫寒人；“造他的主”清楚保留原文“制造者”的意象，并表明穷人的创造主受到侮辱。
- source_word: וּמְכַבְּדוֹ
  choice: 是尊荣他
  rationale: “尊荣”准确表达כבד的使役性尊重含义；代词所指在希伯来文中存在歧义，正文依对偶关系理解为创造主，并以脚注说明另一读法。
- source_word: חֹנֵן
  choice: 恩待
  rationale: 该分词表示施恩、眷顾或慷慨相助；“恩待”简洁、庄重，并保留恩惠的语义。
- source_word: אֶבְיוֹן
  choice: 穷乏人
  rationale: 该词特别强调匮乏和有需要的状态；“穷乏人”与前半句“贫寒人”有所区分，同时符合箴言文体。
theological_decisions:
- issue: וּמְכַבְּדוֹ中第三人称后缀的所指
  choice: 理解为指创造主：恩待穷乏人就是尊荣神。
  alternative: 理解为指贫寒人：尊重贫寒人的，就是恩待穷乏人。
  rationale: 反义对偶更支持前半句“侮辱造他的主”与后半句“尊荣他”相对应；不过希伯来文代词本身并未明确排除以贫寒人为所指，因此在脚注中保留另一读法。
translation_notes:
  register: 采用现代、庄重而易懂的箴言体；以两个“……的，是……”构成平衡对偶。“贫寒人”与“穷乏人”分别对应דָּל与אֶבְיוֹן，以保留原文近义词之间的细微差别。
