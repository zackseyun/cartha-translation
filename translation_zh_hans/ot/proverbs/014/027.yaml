  text: יִרְאַ֣ת יְ֭הוָה מְק֣וֹר חַיִּ֑ים לָ֝/ס֗וּר מִ/מֹּ֥קְשֵׁי מָֽוֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/027.yaml
  text: The fear of Yahweh is a fountain of life[b][a], to turn one away from the snares of death.
translation:
  language: zh_hans
  text: 敬畏雅威是生命的泉源[a]，使人避开[b]死亡的网罗。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“生命之泉”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“离开”；原文此处可表达目的或结果。
    reason: syntactical_alternative
lexical_decisions:
- source_word: יִרְאַת
  choice: 敬畏
  rationale: 保留箴言中这一核心智慧主题所包含的惧怕、崇敬和顺服意味；现代汉语“敬畏”比单说“尊敬”更能承载原文的张力，也比“惧怕”更不易被误解为单纯恐怖。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常用音译呈现上帝向以色列启示的专名，而不以称号替代。
- source_word: מְקוֹר
  choice: 泉源
  rationale: 该词指涌出水的泉或源头；“泉源”既保留具体、生动的水源意象，也自然表达赐予生命的来源。
- source_word: חַיִּים
  choice: 生命
  rationale: 原文虽为复数形式，在此按希伯来语惯用法表达抽象而整体的“生命”。
- source_word: לָסוּר
  choice: 为使人避开
  rationale: 介词 ל 加不定式可表达目的或结果；正文以自然汉语呈现其功能，同时用脚注保留另一种关系表达。
- source_word: מִמֹּקְשֵׁי
  choice: 避开……的网罗
  rationale: מֹקֵשׁ 指捕捉猎物的圈套或网罗；“网罗”适合箴言的庄重语体，并保留隐蔽、致命陷阱的比喻。
- source_word: מָוֶת
  choice: 死亡
  rationale: 直接保留该词的广度，不把它限定为肉身死亡或道德、属灵的毁灭。
theological_decisions:
- issue: “敬畏雅威”在智慧文学中的含义
  choice: 译作“敬畏雅威”
  alternative: “惧怕雅威”或“尊崇雅威”
  rationale: “敬畏”在现代汉语中兼有畏惧与崇敬，能保留原文的神学张力；“尊崇”会淡化“畏”的成分，而单用“惧怕”又容易缩窄为恐怖感。
- issue: לָסוּר 所表达的逻辑关系
  choice: 正文译为目的式“为使人避开”
  alternative: 结果式“使人避开”或较直译的“为要避开”
  rationale: 原文不定式可表达目的或结果，且未明说其主语。正文采用自然且符合上下文的目的式表达，脚注保留结果式理解，避免把语法张力悄然消除。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“生命的泉源”和“死亡的网罗”保留箴言鲜明的对偶意象；“雅威”作为专名处理。所有脚注标记均置于正文相应位置。
