  text: הֲֽ/לוֹא יִ֭תְעוּ חֹ֣רְשֵׁי רָ֑ע וְ/חֶ֥סֶד וֶ֝/אֱמֶ֗ת חֹ֣רְשֵׁי טֽוֹב־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/022.yaml
  text: Will not those who devise evil go astray? But steadfast love and faithfulness belong to those who devise good[a].
translation:
  language: zh_hans
  text: 谋划恶事的人岂不是走入歧途吗？慈爱和信实必归于谋划善事的人[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “慈爱和信实”也可译作“仁爱和真理”或“怜悯和忠信”。原文没有明说慈爱和信实具体如何归于谋划善事的人。
    reason: 说明 חֶסֶד וֶאֱמֶת 的词义选择，并保留原文省略谓语所造成的关系开放性。
lexical_decisions:
- source_word: הֲלוֹא
  choice: 岂不是……吗
  rationale: 引出预期肯定回答的反问，既保留疑问形式，也符合现代汉语表达。
- source_word: יִתְעוּ
  choice: 走入歧途
  rationale: 表达偏离正道、犯错的意象，并保留智慧文学中的道德含义。
- source_word: חֹרְשֵׁי רָע
  choice: 谋划恶事的人
  rationale: חרשׁ 的分词形式在此指有意筹划；“谋划”体现主动策划，并与后半句形成对应。
- source_word: רָע
  choice: 恶事
  rationale: 在与 טוֹב 的对照中具有明确的伦理意义；汉语用“恶事”自然地表示所谋划的恶。
- source_word: חֶסֶד
  choice: 慈爱
  rationale: 兼顾仁慈、忠贞之爱的丰富含义；与“信实”连用时庄重而自然。
- source_word: אֱמֶת
  choice: 信实
  rationale: 在 חֶסֶד וֶאֱמֶת 这一常见词组中，侧重可靠、忠诚，而不仅是抽象的“真理”。
- source_word: חֹרְשֵׁי טוֹב
  choice: 谋划善事的人
  rationale: 重复“谋划”以反映原文同一分词的复现，并保持恶与善的鲜明对称。
- source_word: טוֹב
  choice: 善事
  rationale: 作为名词性用法与“恶事”构成简洁、清楚的伦理对照。
theological_decisions:
- issue: “慈爱和信实”与“谋划善事的人”之间省略谓语的关系
  choice: 译作“谋划善事的人却有慈爱和信实”
  alternative: “慈爱和信实必临到谋划善事的人”；“谋划善事的人以慈爱和信实待人”
  rationale: 希伯来文没有明示谓语，可能描述这些人所具有的品格，也可能指他们所蒙受的慈爱与信实。“有”保持简练，并避免明确限定施予方向；脚注提示这种开放性。
translation_notes:
  register: 采用现代、端庄而易懂的普通话。“谋划恶事／谋划善事”保留原文结构上的反复与对照；反问句保留原文语气。
