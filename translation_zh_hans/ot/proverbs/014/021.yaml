  text: בָּז לְ/רֵעֵ֥/הוּ חוֹטֵ֑א וּ/מְחוֹנֵ֖ן עניים אַשְׁרָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/021.yaml
  text: Whoever despises his neighbor sins[a], but blessed is he who is gracious to the poor.
translation:
  language: zh_hans
  text: 藐视邻舍的，就是犯罪；恩待贫穷人的人有福。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “有福”也可译作“得享福乐”。希伯来语所表达的是蒙福、兴盛的状态，不只是快乐的情绪。
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּז
  choice: 藐视
  rationale: 该分词指以轻蔑态度对待他人。“藐视”简洁自然，也保留了原文明确的道德力度。
- source_word: לְרֵעֵהוּ
  choice: 邻舍
  rationale: רֵעַ 指社会关系范围中的同伴或他人；“邻舍”既符合智慧文学语境，也保留第三人称单数后缀所表达的关系。
- source_word: חוֹטֵא
  choice: 是犯罪
  rationale: 该分词在此作谓语，明确把藐视邻舍定性为罪；“是犯罪”保留原文的道德与神学范畴，不弱化为一般的“做错事”。
- source_word: וּמְחוֹנֵן
  choice: 恩待
  rationale: חנן 在此表示施恩、厚待。“恩待”自然凝练，并保留主动给予恩惠的含义，不把词义限缩为怜悯情绪。
- source_word: עניים
  choice: 贫穷人
  rationale: 该词可指贫穷、困苦或受压之人；本节伦理对比突出其社会经济上的弱势，因此译作“贫穷人”。
- source_word: אַשְׁרָיו
  choice: 这人有福
  rationale: אַשְׁרֵי 及其带后缀形式表示蒙福、昌盛的客观状态，而不只是主观快乐。“这人有福”符合现代汉语，同时保留智慧文学的庄重语气。
theological_decisions:
- issue: 智慧文学用语 אַשְׁרָיו 的译法
  choice: 这人有福
  alternative: 这人快乐
  rationale: 原文宣告的是一种蒙福、兴盛的状态，并非仅指情绪上的快乐；“有福”更能保留其伦理与神学分量。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“藐视邻舍”与“恩待贫穷人”形成清楚对照；以“这人”自然承接希伯来语阳性单数形式，并保留其代表性含义。
