  text: גַּם לְ֭/רֵעֵ/הוּ יִשָּׂ֣נֵא רָ֑שׁ וְ/אֹהֲבֵ֖י עָשִׁ֣יר רַבִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/020.yaml
  text: A poor person is hated even by his neighbor[a], but those who love the rich are many.
translation:
  language: zh_hans
  text: 穷人甚至被自己的邻舍[a]厌恶；爱富人的却很多。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“朋友”或“同伴”；希伯来语这个词可指邻舍、同伴或朋友。
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: 连……也
  rationale: 该语气词在这里加强令人痛心的结果：穷人甚至遭到身边邻舍的厌恶；“连……也”在现代汉语中自然传达这种强调。
- source_word: לְרֵעֵהוּ
  choice: 邻舍
  rationale: 介词在被动动词后标示施事者；רֵעַ可指邻舍、同伴或朋友，正文采用范围较广且有尊严的“邻舍”，并以脚注保留其他可能。
- source_word: יִשָּׂנֵא
  choice: 厌恶他
  rationale: 该词为尼法勒式，表达被动意义。汉语用“邻舍也厌恶他”的主动句式更自然，同时保持穷人是承受厌恶的一方，没有倒置原文语义。
- source_word: רָשׁ
  choice: 穷人
  rationale: 指贫困的人；“穷人”简洁自然，适合格言中的泛指用法。
- source_word: וְאֹהֲבֵי
  choice: 爱……人的
  rationale: 分词保留动词含义，使后半句的“爱”与前半句的“厌恶”形成鲜明对应，避免解释成较窄的“朋友”。
- source_word: עָשִׁיר
  choice: 富人
  rationale: 与前半句“穷人”构成清楚、对称的社会处境对比。
- source_word: רַבִּים
  choice: 很多
  rationale: 直接表达人数众多；放在句末符合现代汉语习惯，也保留格言的简练。
theological_decisions: []
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。前半句虽以汉语自然的主动结构表达，却严格保留希伯来语被动式的语义角色：穷人是被厌恶者。后半句保留“爱”的动词性，以呈现原文两小句之间“厌恶／爱”的对照。
