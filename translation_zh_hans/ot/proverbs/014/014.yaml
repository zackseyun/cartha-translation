base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/014.yaml
  text: The one who turns away in heart will be filled with his own ways[b][a], and a good man with what comes from himself.
translation:
  language: zh_hans
  text: 心中背离者，必从自己的道路得饱足；善人也必从自身而得饱足。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节下半句的希伯来文较难理解，直译近于“善人从他自身（或：从他上面）”。按与上句的平行关系，可能是指善人从自身所行及其结果得饱足。
    reason: alternative_reading
lexical_decisions:
- source_word: מִדְּרָכָיו
  choice: 从自己的道路
  rationale: 介词 מִן 表示来源；“道路”在箴言中常指人的行事为人。保留原文意象及“从……得饱足”的结构，不在正文中增添“果子”。
- source_word: יִשְׂבַּע
  choice: 必……得饱足
  rationale: 该动词有“吃饱、满足”之意；“得饱足”既保留具体意象，也能统摄两个平行分句。
- source_word: סוּג לֵב
  choice: 心里背离的人
  rationale: סוּג 表示退后、转离；לֵב 指内在意向。“心里背离”比带有特定宗教术语色彩的译法更透明，同时保留其道德含义。
- source_word: וּמֵעָלָיו
  choice: 也必从自己的所为
  rationale: 此短语语义困难，字面近似“从他自己之上/由他自己那里”。依据与上句的平行关系，理解为善人从自身所产生的行为结果得满足；“所为”明确最可能的语境含义，并以脚注保留原文的困难。
- source_word: אִישׁ טוֹב
  choice: 善人
  rationale: 这是汉语智慧文学中自然、凝练的表达，准确传达“良善的人”，且不必机械保留希伯来语的阳性形式。
theological_decisions:
- issue: 善人所得饱足的来源
  choice: 译为“从自己的所为得饱足”
  alternative: 从自己得饱足／从他上面得饱足
  rationale: 原文第二分句省略谓语，且 וּמֵעָלָיו 难解。依诗句平行关系，最可能是指善人从自己的品行及其结果得着回报；此处不将其扩展为关于功德或救恩的教义陈述。
translation_notes:
  register: 采用现代、凝练而庄重的箴言体。“心里背离”保留内在道德取向；分号呈现两句对照。正文不添加原文没有的“果子”，但在难解的第二分句中用“所为”表达最可能的省略含义，并以脚注说明。
