    rationale: 原词可指话语、事情或事物；正文译“凡事都信”可保留其宽度，脚注再列“什么话都信”。
  - severity: low
    issue: “精明人”在现代汉语中可能带有世故、善于算计的联想。
    rationale: עָרוּם在本节是正面的审慎与明辨；“谨慎人”较少引入不必要的含义。
  - severity: low
    issue: “慎思自己的脚步”略显抽象。
    rationale: יַבִין加上“自己的脚步”表达对自身行径的辨察；“留心自己的脚步”更贴近原文意象及中文搭配。
  revised_text: 愚蒙人凡事都信[a]；谨慎人却留心自己的脚步。
