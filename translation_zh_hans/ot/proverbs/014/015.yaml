  yaml_path: translation/ot/proverbs/014/015.yaml
  text: A simple man believes every word[a], but a prudent man considers his steps.
translation:
  language: zh_hans
  text: 愚蒙人凡事都信[a]；谨慎人却留心自己的脚步。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“什么话都信”或“每件事都信”。
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּתִי
  choice: 愚蒙人
  rationale: 在《箴言》中指缺乏阅历、容易受人影响的人，并非单指智力低下；“愚蒙人”保留了智慧文学中的典型称谓。
- source_word: יַאֲמִין
  choice: 信
  rationale: 此处使役式表达把某话当真或视为可信；“信”简洁自然，并能与“什么话”顺畅搭配。
- source_word: לְכָל דָּבָר
  choice: 什么话都
  rationale: דָּבָר 可指“话、事情、事物”；正文按语境表达轻信别人所说的一切，同时用脚注保留较宽泛的理解。
- source_word: עָרוּם
  choice: 精明人
  rationale: 该词在《箴言》的正面智慧语境中表示审慎、敏锐而有辨别力，并无欺诈的贬义；“精明人”能与“愚蒙人”形成鲜明对照。
- source_word: יָבִין
  choice: 慎思
  rationale: בין 表示理解、辨明；结合后面的“脚步”，这里强调经过辨别的实际思量，“慎思”兼顾审慎与思考。
- source_word: לַאֲשֻׁרוֹ
  choice: 自己的脚步
  rationale: 原词可指脚步、步态或行程，此处比喻人的行为和人生方向；保留“脚步”的具体意象。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“愚蒙人”保留《箴言》的智慧文学范畴；“慎思自己的脚步”保留希伯来文的行动意象及两分句之间的对照。
