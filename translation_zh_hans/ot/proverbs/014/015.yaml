- from: 愚蒙人什么话都信[a]；精明人却慎思自己的脚步。
  to: 愚蒙人凡事都信[a]；谨慎人却留心自己的脚步。
  rationale: 修订扩大“凡事”的涵盖范围，以对应דָּבָר可指话语或事情；以“谨慎人”表达正面的עָרוּם，避免“精明”潜在的世故色彩；以“留心自己的脚步”更直接地呈现对自身行径的审察，同时保留原文脚步的比喻意象。
