base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/030.yaml
  text: A tranquil heart is life to the body[b][a], but jealousy is rottenness to the bones.
translation:
  language: zh_hans
  text: 平静的心是身体的生命[a]；嫉妒却使骨头朽烂。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“有医治作用的心，是肉身的生命。”原文译作“平静”的词，本义与医治或健康有关。
    reason: lexical_alternative
  - marker: b
    text: “嫉妒”也可译作“妒忌”；原词按语境还可表示“热忱”。
    reason: lexical_alternative
lexical_decisions:
- source_word: חַיֵּי
  choice: 使……有生气
  rationale: 该词是“生命”的复数构造形式，在此无动词格言句中表达“是……的生命”。译为“使……有生气”可用自然汉语传达其赋予生命、活力的作用。
- source_word: בְשָׂרִים
  choice: 身体
  rationale: 字面为“肉体”，此处指人的整个身体。现代汉语用“身体”更自然，也避免“肉体”可能带来的非本文神学联想。
- source_word: לֵב
  choice: 心
  rationale: 保留希伯来语的人体隐喻；这里指人的内在性情和情绪中心。
- source_word: מַרְפֵּא
  choice: 平静
  rationale: 该词本义涉及医治、健康或疗效；结合与“嫉妒”的对比，此处译为内心安宁、健全的状态。“医治”这一较贴近字面的可能译法在脚注中保留。
- source_word: וּרְקַב
  choice: 却使……朽烂
  rationale: 连接词按上下句鲜明对比译为“却”。רֶקֶב表示腐朽、腐烂；动词化为“使……朽烂”符合汉语表达，并保留生动意象。
- source_word: עֲצָמוֹת
  choice: 骨头
  rationale: 按原文保留具体意象，指身体深处的骨架，也可暗示人的根本活力。
- source_word: קִנְאָה
  choice: 嫉妒
  rationale: 该词依语境可表示嫉妒、妒忌或热忱。此处与“骨头朽烂”并列，显然取负面意义；“嫉妒”在现代汉语中自然且涵盖较广。
