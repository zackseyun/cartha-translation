base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/016.yaml
  text: A wise man fears and turns away from evil[a], but a fool is reckless and confident.
translation:
  language: zh_hans
  text: '智慧人有所畏惧，远离恶事；

    愚昧人却鲁莽妄为[a]，自以为安稳。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“发怒”或“越过界限”。此处希伯来语动词含义较难确定；按上下文，很可能是形容人冒失冲动、不受约束地行事。
    reason: lexical_alternative
lexical_decisions:
- source_word: חָכָם
  choice: 智慧人
  rationale: 该形容词在此作名词，指一个有智慧的人；“智慧人”符合《箴言》的用语，也自然适用于格言中的一般情形。
- source_word: יָרֵא
  choice: 有所畏惧
  rationale: 保留“惧怕”的基本词义，同时不擅自补出惧怕的对象；在本节语境中也含谨慎戒惧之意。
- source_word: וְסָר
  choice: 远离
  rationale: סור表示转离、离开；“远离恶事”是自然、庄重的现代汉语表达。
- source_word: מֵרָע
  choice: 恶事
  rationale: רַע可指邪恶，也可指有害之事；“恶事”在此突出道德含义，同时未完全排除其招致祸患的实际后果。
- source_word: כְסִיל
  choice: 愚昧人
  rationale: 这是《箴言》中常见的智慧文学术语，不仅指智力不足，也指在道德和判断上顽愚的人。
- source_word: מִתְעַבֵּר
  choice: 鲁莽妄为
  rationale: 该词在此含义较难确定；上下文将它与智慧人的戒惧和远离恶事对照，故正文采用“鲁莽妄为”，表达不受约束、越界行事的意思，并以脚注保留其他可能解释。
- source_word: וּבוֹטֵחַ
  choice: 自以为安稳
  rationale: בטח表示信赖、笃定或感到安全；原文未说明信赖的对象。在负面语境中，“自以为安稳”既表达错误的安全感，也避免把宾语明确补成“自己”。
