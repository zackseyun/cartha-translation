  yaml_path: translation/ot/proverbs/014/003.yaml
  text: In the mouth of a fool is a rod of pride[b][a], but the lips of the wise will guard them.
translation:
  language: zh_hans
  text: 愚昧人的口中有骄傲的杖[a]；智慧人的嘴唇却保护他们[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “杖”也可译作“嫩枝”或“枝条”。此处采用“杖”，较符合本节对骄傲言语的警戒意象。
    reason: lexical_alternative
  - marker: b
    text: “他们”很可能指智慧人，也就是说，智慧人的嘴唇保护他们自己。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּפִי
  choice: 口中有
  rationale: 将介词 בְּ 按处所义处理，保留“在……口中”的希伯来意象，同时用自然汉语句式表达。
- source_word: אֱוִיל
  choice: 愚昧人
  rationale: 这是箴言中常见的智慧文学用语，主要指在道德和属灵判断上顽梗的人，并非单指智力不足。
- source_word: חֹטֶר
  choice: 杖
  rationale: 该词也可指嫩枝或枝条；此处“杖”较能保留骄傲言语带有伤害或招致管教的紧凑比喻，但在脚注中注明另一可能。
- source_word: גַּאֲוָה
  choice: 骄傲
  rationale: 直接表达高傲、自大的含义，并保留“骄傲的杖”这一简洁而略带张力的属格结构。
- source_word: וְשִׂפְתֵי
  choice: 却……嘴唇
  rationale: וְ 在两行对照中具有转折作用；保留“嘴唇”意象，与上句的“口”形成诗歌平行。
- source_word: חֲכָמִים
  choice: 智慧人
  rationale: 以现代汉语中自然的类称表达该复数名词化形容词，并符合箴言的智慧文学语域。
- source_word: תִּשְׁמוּרֵם
  choice: 保护他们
  rationale: 动词表示看守、保全或保护，宾语后缀为第三人称阳性复数。译文保留“他们”，不在正文中过度明确其所指。
theological_decisions:
- issue: “他们”的所指
  choice: 保留第三人称复数“他们”
  alternative: 译作“保护智慧人自己”或“保护其主人”
  rationale: 希伯来文的宾语后缀明确是复数，但先行词被省略；按语意很可能指智慧人。正文保留原文的压缩与一定歧义，脚注说明较可能的理解。
translation_notes:
  register: 采用简洁、庄重而易懂的现代标准汉语，保留“口—嘴唇”的平行结构及原文紧凑的比喻。脚注标记按正文出现顺序排列。
