  yaml_path: translation/ot/proverbs/014/007.yaml
  text: Go from the presence of a foolish man[a], for you do not perceive lips of knowledge.
translation:
  language: zh_hans
  text: 离开愚昧人，因为你不会从他口中听见有知识的话。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“离开愚昧人；你不会在他那里找到有知识的话。”
    reason: 原文后半句可按结果或说明来连接；“知识的嘴唇”是以嘴唇指有知识的言语。
lexical_decisions:
- source_word: לֵךְ מִנֶּגֶד
  choice: 离开……面前
  rationale: לֵךְ是阳性单数命令式；מִנֶּגֶד表示从某人面前离去。此译保留空间意象和直接劝诫的语气。
- source_word: לְאִישׁ כְּסִיל
  choice: 愚昧人
  rationale: כְּסִיל是箴言中的固定智慧术语，指拒绝智慧、行事愚顽的人；现代汉语用“愚昧人”自然简洁，无须机械译出אִישׁ。
- source_word: וּבַל יָדַעְתָּ
  choice: 因为你不会……听到
  rationale: בַּל是否定词，完成式יָדַעְתָּ在箴言语境中可表达一般结果。结合后面的“嘴唇”，译为“不会……听到”表达无法从其言语中发现知识的意思，同时不把话说成对其全部言语的绝对判断。
- source_word: שִׂפְתֵי דָעַת
  choice: 从他的嘴唇听到有知识的话
  rationale: 原文直译为“知识的嘴唇”，以嘴唇转指言语。中文保留“嘴唇”意象，并补出“话”使表达自然清楚。
theological_decisions: []
translation_notes:
  register: 采用现代、凝练而庄重的箴言体。保留“面前”和“嘴唇”的希伯来空间及身体意象，同时通过“听到有知识的话”使中文通顺。脚注标记已置于正文。
