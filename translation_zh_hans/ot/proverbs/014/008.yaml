  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: חָכְמַ֣ת עָ֭רוּם הָבִ֣ין דַּרְכּ֑/וֹ וְ/אִוֶּ֖לֶת כְּסִילִ֣ים מִרְמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/008.yaml
  text: The wisdom of the prudent is to understand his way[b][a], but the folly of fools is deceit.
translation:
  language: zh_hans
  text: 谨慎人的智慧，在于辨明自己所走的路[a]；愚昧人的愚妄，却是诡诈[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “辨明自己所走的路”也可译作“看清自己的道路”；这里的“路”也可指行事方式或人生方向。
    reason: lexical_alternative
  - marker: b
    text: “诡诈”既可能指欺骗别人的行为，也可能指愚昧人的自欺；原文没有明确限定。
    reason: lexical_alternative
lexical_decisions:
- source_word: חָכְמַת
  choice: ……的智慧
  rationale: 这是“智慧”的构造形式，与后面的“谨慎人”构成所属关系；译为“谨慎人的智慧”自然且忠实。
- source_word: עָרוּם
  choice: 谨慎人
  rationale: 该词在箴言中通常有正面的审慎、精明之意。这里与愚昧人形成对比，因此采用褒义的“谨慎人”，避免“狡猾人”的负面含义。
- source_word: הָבִין
  choice: 在于辨明
  rationale: 此处说明谨慎人的智慧体现在哪里，具有界定性质；“在于辨明”既保留这一句法功能，也表达理解、辨察之意。
- source_word: דַּרְכּוֹ
  choice: 自己所走的路
  rationale: “道路”可指实际路径，也常比喻人的行事方式或人生方向。反身表达与“谨慎人”相呼应，并保留单数个体的自我省察意味。
- source_word: וְאִוֶּלֶת
  choice: 却是……愚妄
  rationale: 连接词在上下两句之间表示对照，译作“却”清楚呈现反义平行结构。
- source_word: כְּסִילִים
  choice: 愚昧人
  rationale: 采用智慧文学中自然、稳定的称呼，并保留原文复数所指的一类人。
- source_word: מִרְמָה
  choice: 诡诈
  rationale: 该词表示欺骗、虚假或诡诈。简洁的“诡诈”保留原句的警句风格，也不限定究竟是欺骗别人还是自欺。
theological_decisions:
- issue: דַּרְכּוֹ 的阳性单数后缀
  choice: 自己所走的路
  alternative: 他所走的路
  rationale: 希伯来语用阳性单数代表一个谨慎的人。现代汉语以与主语照应的“自己”自然表达同一单数关系，不将所指扩展为复数，也不额外强调生理性别。
- issue: עָרוּם 的道德色彩
  choice: 谨慎人
  alternative: 精明人；狡猾人
  rationale: 本节把此人的智慧与愚昧人的愚妄相对照，语境要求正面的审慎之义；“狡猾人”会错误地赋予负面评价。
- issue: מִרְמָה 所指的欺骗类型
  choice: 保留为“诡诈”，不限定对象
  alternative: 欺骗人；自欺
  rationale: 原文没有说明这是对他人的欺骗还是愚昧人的自我蒙蔽。正文保留两种理解的张力，脚注予以说明。
translation_notes:
  register: 采用现代、庄重而易懂的警句体。两分句以“在于”与“却是”形成清晰对照；保留“智慧—愚妄”和“谨慎人—愚昧人”的平行关系，同时不消解末词“诡诈”的真实歧义。
