  yaml_path: translation/ot/proverbs/014/028.yaml
  text: In a multitude of people is a king’s splendor[a], but without people, a ruler’s ruin.
translation:
  language: zh_hans
  text: 人民众多，是君王的荣耀；没有民众，统治者便会败落[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “败落”或译“惊恐”“毁灭”；希伯来语此词可表示惧怕、惊惶，也可表示毁灭性的崩溃。正文按本节与“荣耀”的对照译为“败落”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרָב עָם
  choice: 人民众多
  rationale: בְּרָב 表示数量上的众多，עָם 指作为整体的人民或民众。译作“人民众多”简洁自然，也保留格言式的平行结构。
- source_word: הַדְרַת
  choice: 荣耀
  rationale: 该词可指荣美、尊荣或威仪；此处表达众多人民给君王带来的显赫与尊荣。“荣耀”既凝练，也能涵盖这种公开可见的王者尊荣。
- source_word: מֶלֶךְ
  choice: 君王
  rationale: 该词通常指王。“君王”符合智慧文学庄重而通俗的语体，并与下句较宽泛的“统治者”形成对应。
- source_word: וּבְאֶפֶס לְאֹם
  choice: 没有百姓，却
  rationale: אֶפֶס 在此表示缺失或不存在，לְאֹם 指民众、族群。译作“没有百姓”避免把它现代化为正式的民族国家概念；“却”清楚呈现上下句的反义对照。
- source_word: מְחִתַּת
  choice: 败亡
  rationale: 该词可表示惊恐、灾祸或毁灭性的崩溃。上下句把君王因人民众多所得的荣耀，与统治者因没有百姓而遭遇的结局相对照，因此正文采用“败亡”，同时用脚注保留词义上的歧义。
- source_word: רָזוֹן
  choice: 统治者
  rationale: 该词指掌权者、首领或贵胄。“统治者”范围较宽，不强行限定为王子或贵族，也与前句“君王”自然对应。
theological_decisions: []
translation_notes:
  register: 采用简洁、对称的现代标准汉语，保留希伯来智慧格言的两分结构。“人民”与“百姓”适度避免机械重复，同时都保持集体民众的政治社会含义；不把 לְאֹם 收窄为现代意义的“国家”。
