  text: בְּֽ֭/רָעָת/וֹ יִדָּחֶ֣ה רָשָׁ֑ע וְ/חֹסֶ֖ה בְ/מוֹת֣/וֹ צַדִּֽיק׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/032.yaml
  text: By his evil the wicked is driven away[c][b][a], but the righteous finds refuge in his death.
translation:
  language: zh_hans
  text: 恶人因自己的恶而被推倒[a]；义人在死亡中[c]却得着庇护[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “因自己的恶”也可译作“遭遇灾祸时”。希伯来语רָעָה可指道德上的“恶”，也可指“灾祸、患难”。
    reason: lexical_alternative
  - marker: b
    text: “得着庇护”也可译作“投靠避难”或“寻求庇护”。
    reason: lexical_alternative
  - marker: c
    text: 直译“在他的死亡中”；也可译作“在他死亡时”或“当他死时”。有些译本意译为“临死仍有盼望”，但希伯来原文并未直接说“盼望”。
    reason: alternative_reading
lexical_decisions:
- source_word: בְּרָעָתוֹ
  choice: 因自己的恶
  rationale: רָעָה既可指道德上的“恶”，也可指“灾祸”。本节把恶人与义人对举，主文采用道德义，并将介词בְּ理解为原因或手段；“遭遇灾祸时”保留在脚注中。
- source_word: יִדָּחֶה
  choice: 被推倒
  rationale: 该被动形式可表示被推开、赶逐或推倒、倾覆。“被推倒”保留被动语态，也自然表达恶人的败亡而不过度限定其具体方式。
- source_word: רָשָׁע
  choice: 恶人
  rationale: 单数形容词在此作名词，代表箴言中的一类人；现代汉语用“恶人”简洁自然。
- source_word: וְחֹסֶה
  choice: 却得着庇护
  rationale: חסה可表示投靠、寻求或得到庇护。此处未明说投靠的对象，“得着庇护”能自然表达与恶人败亡相反的结果；较强调主动行为的“投靠避难所”列入脚注。
- source_word: בְמוֹתוֹ
  choice: 在死亡中
  rationale: 直译为“在他的死亡中”。主文保留希伯来语紧凑而难解的表达，不把它明确改写成“临死时”或加入原文未明说的“盼望”。
- source_word: צַדִּיק
  choice: 义人
  rationale: 单数形容词作名词，与“恶人”构成箴言式对照；“义人”是自然、庄重且准确的现代汉语表达。
theological_decisions:
- issue: 本节是否明确教导死后的盼望，还是只描述死亡之际的安稳
  choice: 在死亡中却得着庇护
  alternative: 临死时仍有盼望；死的时候仍安稳
  rationale: 希伯来文没有明说“盼望”，也没有说明庇护的性质或持续时间。主文保留“在死亡中”的张力，既不否定超越死亡的含义，也不把这种含义明确写入经文。
translation_notes:
  register: 采用简洁、对称的箴言体，以分号呈现恶人与义人的鲜明对照。“被推倒”“得着庇护”是普通现代读者易懂而仍庄重的表达；主文刻意保留末句有关死亡与庇护的歧义。
