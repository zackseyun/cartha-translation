  text: גַּם אֵ֥לֶּה לַֽ/חֲכָמִ֑ים הַֽכֵּר פָּנִ֖ים בְּ/מִשְׁפָּ֣ט בַּל טֽוֹב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/023.yaml
  text: 'These also are sayings of the wise: to show partiality in judgment is not good[a][b].'
translation:
  language: zh_hans
  text: '以下也是智慧人的箴言：[a]

    审判时偏袒人，是不好的。[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“这些也给／属智慧人”。这里很可能是一个小标题，意思是“以下也是智慧人的箴言”。
    reason: lexical_alternative
  - marker: b
    text: “偏袒人”原文直译为“认脸”，是指审判时徇私、偏待某人。
    reason: cultural_note
lexical_decisions:
- source_word: גַּם אֵלֶּה
  choice: 以下也是
  rationale: 保留“也”的承接作用，并用“以下”自然指向随后开始的一组箴言。
- source_word: לַחֲכָמִים
  choice: 智慧人的箴言
  rationale: 希伯来文直译为“给／属智慧人”，在此很可能是省略式小标题；补出“箴言”可清楚表达其篇章功能，同时以脚注保留原文的简略和歧义。
- source_word: הַכֵּר פָּנִים
  choice: 偏袒人
  rationale: 原文直译为“认脸”，是按人的身份或关系区别对待、徇私偏袒的惯用语；“偏袒人”在现代汉语中简明自然。
- source_word: בְּמִשְׁפָּט
  choice: 审判时
  rationale: 此处指司法判断或裁决的场景；译作“审判时”比抽象的“在公义中”更准确、自然。
- source_word: בַּל טוֹב
  choice: 是不好的
  rationale: 保留原文宽泛的道德评价“不是好事／不好”，不把含义收窄为仅仅“不合法”或“不合宜”。
theological_decisions:
- issue: לַחֲכָמִים 的省略式标题功能
  choice: 译作“智慧人的箴言”，视为引入另一组智慧言语的小标题。
  alternative: “以下也是给智慧人的”或“以下也属于智慧人”。
  rationale: 上下文显示本节开启新的箴言组，因此标题性理解最为可能；不过原文仅有“给／属智慧人”，故用脚注说明直译，以保留其语法歧义。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“以下也是智慧人的箴言”作为标题式首句，与后半句分行，以呈现原文的篇章转换；“审判时偏袒人，是不好的”保持简洁的箴言体和原文宽泛的伦理判断。
