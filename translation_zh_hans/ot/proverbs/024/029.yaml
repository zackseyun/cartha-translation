base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/029.yaml
  text: Do not say[a], “As he has done to me, so I will do to him; I will repay the man according to his deed.”
translation:
  language: zh_hans
  text: 不要说：“他怎样待我，我也要怎样待他；我要照那人所做的还报他。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我要按他的行为报还他。”
    reason: “报还”是אָשִׁיב在此报复语境中的另一种自然译法；相较“回报”，更少正面报答的联想。
lexical_decisions:
- source_word: אַל תֹּאמַר
  choice: 不要说
  rationale: אַל与未完成式连用表示禁止；“不要说”自然、直接，并保留本节针对报复性言语与意念的劝诫。
- source_word: כַּאֲשֶׁר עָשָׂה לִי
  choice: 他怎样待我
  rationale: עָשָׂה לִי直译为“他对我怎样做”；现代汉语以“怎样待我”更自然，也保留对方先前行为指向说话者的含义。
- source_word: כֵּן אֶעֱשֶׂה לּוֹ
  choice: 我也要怎样待他
  rationale: כַּאֲשֶׁר…כֵּן构成对应结构，表达以同样方式报复；“也要怎样待他”保留这种对称关系。
- source_word: אָשִׁיב
  choice: 还报
  rationale: 这是שׁוּב的使役式，在此表示把对方的行为回还给他，即报还、偿报。“还报”既保留“归还”的词义背景，也清楚表达个人报复。
- source_word: לָאִישׁ
  choice: 那人
  rationale: אִישׁ为阳性单数，指前述得罪说话者的人；“那人”比泛称“人”更明确，又不额外强化其性别。
- source_word: כְּפָעֳלוֹ
  choice: 照那人所做的
  rationale: פֹּעַל可指行为、作为或所做之事；此处用从句表达，符合现代汉语习惯，并保留按其行为相应偿报的意思。
theological_decisions:
- issue: 本节对报复的伦理约束范围
  choice: 译文禁止个人抱持并宣告以牙还牙、按对方所行亲自还报的意图。
  alternative: 把本节扩展为对一切报应性司法的全面禁止，或弱化为仅仅不要说出气话。
  rationale: 经文本身直接禁止“不要说”，而引语明确表达对等报复和亲自偿报；译文应保留这一伦理力度，但不把它扩展成经文未明说的完整司法教义。
- issue: אָשִׁיב的施事者与报偿性质
  choice: 保留第一人称“我要……还报他”，突出说话者自行施行报复。
  alternative: 改译为上帝或司法机关将施行报应。
  rationale: 希伯来文本的主语是第一人称单数，没有明说上帝或公共权力；因此不应在译文中补入这些主体。
translation_notes:
  register: 采用现代、庄重而易懂的箴言体。“他怎样待我，我也要怎样待他”保持原文整齐的对应结构；“还报”略带书面色彩，但在语境中清楚传达报复性偿还。脚注标记置于所涉及的第二分句之后。
