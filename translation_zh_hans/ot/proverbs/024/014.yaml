base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/014.yaml
  text: 'Know that wisdom is thus for your soul: if you find it[a], then there is a future[b], and your hope will not be cut off.'
translation:
  language: zh_hans
  text: 你要知道，智慧对你的生命[a]也是如此：你若寻得智慧，就有前途[b]，你的希望必不致断绝。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “生命”或译“心灵”、“自己”；希伯来语נֶפֶשׁ可按语境指生命、自我或内在的人。
    reason: lexical_alternative
  - marker: b
    text: “前途”或译“结局”、“末后的景况”；希伯来语אַחֲרִית可指人的最终结局、结果或未来前景。
    reason: lexical_alternative
lexical_decisions:
- source_word: כֵּן
  choice: 也是如此
  rationale: 承接上一节蜂蜜的比喻，保留“正如……同样……”的类比作用，同时避免把原文未明说的“有益”直接补入正文。
- source_word: דְּעֶה
  choice: 你要知道
  rationale: 准确表达ידע的阳性单数祈使形式；现代汉语中自然、庄重。
- source_word: חָכְמָה
  choice: 智慧
  rationale: 这是《箴言》的核心词汇，采用通行且稳定的译法。
- source_word: לְנַפְשֶׁךָ
  choice: 对你的生命
  rationale: נֶפֶשׁ可指生命、自我或心灵；此处表达智慧给整个人带来的益处。“生命”既自然，又保留原词较丰富的含义。
- source_word: אִם מָצָאתָ
  choice: 你若寻得智慧
  rationale: 保留אִם的条件意味；根据前文补明宾语“智慧”，使汉语表达清楚而不改变指向。
- source_word: וְיֵשׁ אַחֲרִית
  choice: 就有前途
  rationale: אַחֲרִית可指结局、末后或未来的前景；“前途”与下句“希望”相呼应，也符合此处劝勉性的语境。
- source_word: וְתִקְוָתְךָ
  choice: 你的希望
  rationale: תִּקְוָה通常表示希望或期待；“希望”简明自然，并与“前途”构成平行。
- source_word: לֹא תִכָּרֵת
  choice: 必不致断绝
  rationale: 保留כרת“被截断、断绝”的意象；“不致断绝”在现代汉语中清楚且庄重。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。正文保留与上一节蜂蜜比喻之间的类比，也保留“若”的条件结构；对נֶפֶשׁ和אַחֲרִית的多义性用脚注说明，不在正文中将其含义收窄为单一神学解释。
