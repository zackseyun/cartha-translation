  text: יְרָֽא אֶת יְהוָ֣ה בְּנִ֣/י וָ/מֶ֑לֶךְ עִם שׁ֝וֹנִ֗ים אַל תִּתְעָרָֽב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/021.yaml
  text: Fear Yahweh[a], my son, and the king; do not associate with those who are given to change.
translation:
  language: zh_hans
  text: 我儿，要敬畏雅威和君王；不要与那些喜好变动的人交往[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不要与叛逆者相交。”希伯来原文直译为“那些改变的人”，可能指倾向于变乱或不忠地改变现状的人。
    reason: 词义存在多种可能；脚注保留“叛逆者”这一符合语境、但解释性较强的译法，并说明原文的字面含义。
lexical_decisions:
- source_word: יְרָא
  choice: 敬畏
  rationale: 该命令在智慧文学中兼有畏惧、尊崇和忠诚顺服之意。“敬畏”是现代中文圣经语境中自然且准确的表达，也保留了原词的严肃分量。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常用音译呈现四字神名，保留其作为以色列上帝之专名的性质，不以称号替代。
- source_word: בְּנִי
  choice: 我儿
  rationale: 原文为明确的阳性单数称呼，也是《箴言》中父亲训诲儿子的典型文学措辞；“我儿”简洁、庄重而自然。
- source_word: וָמֶלֶךְ
  choice: 和君王
  rationale: 原文将“君王”作为同一命令的第二个宾语。“君王”比日常口语的“国王”更适合智慧文学的政治语境，同时不额外指定某一位君王。
- source_word: עִם
  choice: 跟
  rationale: 与反身词形 תִּתְעָרָב 连用时，表示同某些人混在一起或有所交往；“跟……交往”符合自然的现代汉语。
- source_word: שׁוֹנִים
  choice: 那些好变动的人
  rationale: 该分词字面涉及“改变”，所指可能是倾向变乱、反叛或不忠的人。“好变动的人”在正文中保留词义及一定歧义，避免直接断定为“叛逆者”。
- source_word: אַל תִּתְעָרָב
  choice: 不要……交往
  rationale: 该词的反身词形在此表示使自己掺入某一群体、与之结交或卷入其中。“不要……交往”清楚传达劝诫含义，又不把意思扩大为一般性的干预。
theological_decisions:
- issue: 敬畏雅威与敬畏君王之间的关系
  choice: 让“雅威”和“君王”同作“敬畏”的宾语，不在译文中说明二者权威是否同等。
  alternative: 将后半句弱化为“尊敬君王”，或补明君王的权威从属于雅威。
  rationale: 希伯来文以一个命令统摄两个宾语。直保留此结构，可呈现经文本身的张力，同时不暗示雅威与君王具有同等地位，也不加入本节未明说的神学层级。
translation_notes:
  register: 采用现代、庄重且易懂的训诲语体。“我儿”保留《箴言》的父子教导框架；分号呈现两项彼此相关的命令。正文刻意使用较直译的“好变动的人”，并以脚注说明其可能具有政治或社会层面的叛逆含义。
