  text: הִ֭תְרַפִּיתָ בְּ/י֥וֹם צָרָ֗ה צַ֣ר כֹּחֶֽ/כָה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/010.yaml
  text: If you falter in a day of distress[a], your strength is small.
translation:
  language: zh_hans
  text: 你在患难之日若灰心丧志，你的力量就不大。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你在遭难之日若显得软弱，你的力量就有限。”
    reason: הִתְרַפִּיתָ可指松懈、变弱或显得软弱；צַר可指狭小、有限或不足。
lexical_decisions:
- source_word: הִתְרַפִּיתָ
  choice: 软弱退缩
  rationale: 该词为רפה的Hitpael完成式，可表达松懈、变得软弱或失去意志。“软弱退缩”兼顾力量不足与意志动摇的意味，也符合箴言简练而带评断性的语气。
- source_word: בְּיוֹם
  choice: 在……之日
  rationale: 介词בְּ与“日”构成时间表达；“在患难之日”自然、庄重，并保留原文的格言体结构。
- source_word: צָרָה
  choice: 患难
  rationale: 该词可指困苦、危难或逆境。“患难”是现代中文圣经语体中清楚而庄重的常用词，既涵盖外在处境，也保留受压迫的体验。
- source_word: צַר
  choice: 微小
  rationale: 该形容词本义为狭窄、受限，此处谓述“力量”，表达力量有限或不足。“微小”保留原文简短的尺度意象，避免扩展为解释性译文。
- source_word: כֹּחֶךָ
  choice: 你的力量
  rationale: כֹּחַ通常指力量、能力或精力；“力量”最直接，并能涵盖面对患难时内在与实际的承受力。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的箴言体。保留原文两个分句之间紧凑的条件—评断关系；正文用“软弱退缩”呈现רפה兼具软弱与失去意志的语义，并以脚注保留“松懈／有限”的词汇可能性。
