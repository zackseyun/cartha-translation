  text: וָֽ/אֶחֱזֶ֣ה אָ֭נֹכִֽי אָשִׁ֣ית לִבִּ֑/י רָ֝אִ֗יתִי לָקַ֥חְתִּי מוּסָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/032.yaml
  text: Then I saw and took it to heart[b][a]; I looked and received instruction.
translation:
  language: zh_hans
  text: 我察看了，便留心思想；我看了，就领受了训诲。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “训诲”也可译作“管教”或“教训”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶחֱזֶה
  choice: 我察看了
  rationale: חזה在此表示观看、观察；“察看”既保留主动观察的意味，也符合智慧文学中从所见得教训的语境。句首的ו可自然融入汉语叙述，不必机械译作“然后”。
- source_word: אָנֹכִי
  choice: 我
  rationale: 独立人称代词带有一定强调，但现代汉语用“我”已足够自然；译成“我自己”会使强调显得过重。
- source_word: אָשִׁית לִבִּי
  choice: 便留心思想
  rationale: 希伯来语字面为“我安置我的心”，在此指专心留意并加以思考。“留心思想”自然表达其内在反思，同时不把“心”误解为单指情感。
- source_word: רָאִיתִי
  choice: 我看了
  rationale: 保留ראה的基本视觉意义，也维持原文“察看—留心—看—领受”的推进与近义重复。
- source_word: לָקַחְתִּי מוּסָר
  choice: 领受了训诲
  rationale: לקח意为拿取、接受；מוּסָר在智慧文学中涵盖训诲、管教和纠正。“领受训诲”保留主动接受教导的意味，又不过度限定为惩罚性的管教。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。保留原文两个观看动词的递进与重复，并用“留心思想”传达希伯来语“安置我的心”的反思意味。
