  text: אַל תֶּאֱרֹ֣ב רָ֭שָׁע לִ/נְוֵ֣ה צַדִּ֑יק אַֽל תְּשַׁדֵּ֥ד רִבְצ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/015.yaml
  text: Do not lie in wait[a], O wicked man, against the dwelling of the righteous[b]; do not devastate his resting place.
translation:
  language: zh_hans
  text: 恶人哪，不要在义人的家旁埋伏[a]；不要毁坏他安歇之处[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不要窥伺义人的家。”
    reason: lexical_alternative
  - marker: b
    text: 希伯来语也可理解为“他躺卧的地方”或“他安歇的地方”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל
  choice: 不要
  rationale: 希伯来语否定祈使词，在此引出直接禁令；“不要”符合现代汉语表达。
- source_word: תֶּאֱרֹב
  choice: 埋伏攻击
  rationale: 词根 ארב 表示潜伏、伺机袭击；“埋伏攻击”既保留暗中等候的意象，也在汉语中清楚表达其敌对目的。
- source_word: רָשָׁע
  choice: 恶人哪
  rationale: 此处是阳性单数的直接称呼；“恶人哪”保留呼语语气和道德评价，同时庄重自然。
- source_word: לִנְוֵה
  choice: 义人的家
  rationale: נָוֶה 可指居所、住处；介词 ל 在这里带有敌对指向。“攻击……的家”以自然汉语传达这种关系。
- source_word: צַדִּיק
  choice: 义人
  rationale: 指行为正直、公义的人；单数“义人”保留原文对某一类人的代表性称谓。
- source_word: תְּשַׁדֵּד
  choice: 毁坏
  rationale: 词根 שדד 可表示劫掠、摧毁或蹂躏；此处对象是安歇之处，“毁坏”涵盖暴力破坏而不把含义限于抢夺财物。
- source_word: רִבְצוֹ
  choice: 他安歇之处
  rationale: 源于 רבץ，指躺卧、安歇的地方；“安歇之处”保留安稳栖息的意象，又避免“巢穴”等词在汉语中过强的动物色彩。
