base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/008.yaml
  text: Whoever plans to do evil—to him they will call, “master of schemes.”
translation:
  language: zh_hans
  text: 图谋作恶的人，人必称他为“诡计之主”。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מְחַשֵּׁב
  choice: 图谋
  rationale: 该分词表示筹划、盘算；“图谋”自然传达持续谋划且带有负面意图。
- source_word: לְהָרֵעַ
  choice: 作恶
  rationale: 希伯来语不定式意为行恶、造成祸害；此处概括性地译为“作恶”。
- source_word: בַּעַל מְזִמּוֹת
  choice: 诡计之主
  rationale: 保留“בעל（主人、拥有者）+ מזמות（计谋、谋略）”的鲜明称号结构；在作恶语境中，“诡计”体现其贬义。
- source_word: יִקְרָאוּ־לוֹ
  choice: 必被称为
  rationale: 原文直译为“他们要称他”；未说明主语是谁，汉语用无施事被动可自然保留这种泛指。
theological_decisions:
- issue: “计谋”一词在智慧文学中可有中性或正面意义，但本节语境明确为贬义
  choice: 译作“诡计”
  alternative: 阴谋；奸计
  rationale: “诡计”与前句“作恶”相应，又不过度增添暴力、政治性或具体罪名。
translation_notes:
  register: 采用简洁、格言式的现代书面语。“诡计之主”保留原文略显突出的称号感，不将其释义化为“阴谋家”。
