review_pass:
  verdict: revise
  source_fidelity: 首句“正被带去送死”把被动受害者的处境说成“送死”，在现代汉语中容易带出自愿赴死或被迫牺牲的含义；改为“正被带往死亡”较准确地保留לְקֻחִים לַמָּוֶת的被动、趋向性。第二分句正文可按英语审校轨迹所采用的劝勉性理解译为明确的命令，但脚注须更准确说明אִם תַּחְשׂוֹךְ的未定句法及其可与下一节连接的可能。
  naturalness: “要救出……；要拉住……”在现代标准汉语中自然、庄重，两个祈使分句也更平行。“杀戮”比“屠杀”范围更适中；“屠杀”通常暗示大规模杀害，而הֶרֶג本身不必限定为此。
  terminology: “救出”适切表达הַצֵּל。“带往死亡”避免对死亡性质作未明示的限定。“踉跄着走向杀戮”保留מָטִים的摇晃、濒危意象；“拉住”在正文中传达依上下文作出的“阻止其走向杀戮”的劝勉性理解。
  issues:
  - severity: medium
    issue: “正被带去送死”含有可能误导的“送死”语感。
    rationale: 原文是“被带往死亡”，并未表明这些人自愿赴死，也未限定为为某目标而牺牲。
  - severity: low
    issue: “屠杀”可能将הֶרֶג过度具体化为大规模杀害。
    rationale: “杀戮”保留暴力死亡的强度，同时不额外限定人数或事件性质。
  - severity: medium
    issue: 现有脚注把תַּחְשׂוֹךְ说成“扣留／阻止”，未清楚反映其通常的“克制、扣住、保留（行动或援助）”语义及与下一节相连的句法可能。
    rationale: 脚注应保存马所拉文本末语的真正歧义，不应将正文的上下文性处理倒投为原文唯一语义。
