- from: 要救出那些正被带去送死的人；那些踉跄走向屠杀的人，你要拦住他们。[a]
  to: 要救出那些正被带往死亡的人；要拉住那些踉跄着走向杀戮的人。[a]
  rationale: 修订避免“送死”和“屠杀”在汉语中可能增加的语义，同时以两个平行祈使句清楚表达英语审校轨迹所采取的上下文性读法。脚注保留节末אִם תַּחְשׂוֹךְ的句法困难、可跨入下一节的可能，以及禁令式理解，未把争议消解为单一读法。
