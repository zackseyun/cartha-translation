base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/011.yaml
  text: Rescue those being taken away to death[a], and those staggering to the slaughter, hold them back.
translation:
  language: zh_hans
  text: 要救出那些正被带往死亡的人；要拉住那些踉跄着走向杀戮的人。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文末句近直译为：“那些踉跄着走向杀戮的人，若你克制／不施援手……”末几个词句法较难确定，也可能与下一节相连；也可理解为“不可袖手不管”。正文按上下句的平行关系译出较可能的劝勉之意。
    reason: alternative_reading
lexical_decisions:
- source_word: הַצֵּל
  choice: 要救出
  rationale: 这是נצל的祈使式，要求立即介入、使人脱离危险。“救出”既保留具体的营救意味，也符合现代汉语表达。
- source_word: לְקֻחִים
  choice: 那些正被带去的人
  rationale: לקח的被动分词表示“被带走、被抓去”的人；“正被带去”体现动作正在进行，又不把这些人过度限定为俘虏。
- source_word: לַמָּוֶת
  choice: 送死
  rationale: 介词ל在此表示趋向或结局。“被带去送死”用自然汉语表达被带向死亡的意思，同时保留迫近的危险。
- source_word: וּמָטִים
  choice: 那些踉跄走向……的人
  rationale: 该分词描写摇晃、蹒跚、将要倒下的状态。“踉跄走向”传达身体不稳和危在旦夕的画面。
- source_word: לַהֶרֶג
  choice: 走向屠杀
  rationale: הרג表示杀害、屠杀；“屠杀”保留原文暴力而严峻的色彩，避免弱化为一般的“死亡”。
- source_word: אִם תַּחְשׂוֹךְ
  choice: 你要拦住他们
  rationale: 马所拉文本直译近于“若你扣留／阻止”，句法突兀。正文依上下句的劝诫性平行关系，将其表达为要求介入的命令；脚注保留原文结构及其他可能理解。
theological_decisions:
- issue: 节末אִם תַּחְשׂוֹךְ的句法功能
  choice: 按劝诫性续句理解为“你要拦住他们”
  alternative: 直译为“若你袖手不管／若你拦阻”，并与下一节衔接；或理解为禁令“不可袖手不管”
  rationale: 这是原文句法歧义，不应转化为教义判断。作为独立经节，正文按两行平行的道德劝勉表达，使意思完整自然；脚注明示马所拉文本的困难和其他读法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“正被带去送死”呈现持续而紧迫的危险；“踉跄走向屠杀”刻意保留原文强烈的暴力意象。分号体现两个平行分句，句末命令使中文完整，同时由脚注保存原文歧义。
