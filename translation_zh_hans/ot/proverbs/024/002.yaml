  text: כִּי שֹׁ֭ד יֶהְגֶּ֣ה לִבָּ֑/ם וְ֝/עָמָ֗ל שִׂפְתֵי/הֶ֥ם תְּדַבֵּֽרְנָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/002.yaml
  text: For their heart meditates on destruction[b][a], and their lips speak trouble.
translation:
  language: zh_hans
  text: 因为他们心里思量的是暴行[a]，他们的嘴唇谈论的是祸害[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “暴行”也可译作“毁灭”“残害”或“劫掠”；原词既可强调暴力恶行，也可强调它造成的毁坏。
    reason: lexical_alternative
  - marker: b
    text: “祸害”也可译作“奸恶”“伤害”或“患难”；这里侧重恶人言语中的恶意及其有害后果。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接第1节，说明不可羡慕恶人、不可与他们来往的原因，保留原文的解释关系。
- source_word: שֹׁד
  choice: 暴行
  rationale: 该词可指暴力、毁坏、劫掠或由暴力造成的灾毁；此处描述恶人内心所思，译作“暴行”既体现道德性质，也保留破坏性的含义。
- source_word: יֶהְגֶּה
  choice: 思量
  rationale: הגה可指低声念叨、默想或反复思想；以“心”为主语时，重点在内在持续思索。“思量”不把上下文暗含的图谋意味过度明说。
- source_word: לִבָּם
  choice: 他们心里
  rationale: “心”在希伯来语中指思想和意志的内在领域；汉语用“心里”自然表达这一含义，并妥善处理原文集合性的单数形式。
- source_word: וְעָמָל
  choice: 祸害
  rationale: עָמָל可指劳苦、患难、奸恶或造成伤害的恶事；在与“暴行”平行的语境中，“祸害”同时涵盖恶意和有害后果。
- source_word: שִׂפְתֵיהֶם
  choice: 他们的嘴唇
  rationale: 保留原文“心”与“嘴唇”之间内外相对的诗歌意象。
- source_word: תְּדַבֵּרְנָה
  choice: 谈论
  rationale: 原文未必只指一次发言，而是概括恶人一贯所说的内容；“谈论”符合箴言式陈述，也与复数主语“嘴唇”自然搭配。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“心里思量”保留内在反复思想的含义，不直接强化为“图谋”；“嘴唇”保留希伯来诗句中内心与外在言语的对应。
