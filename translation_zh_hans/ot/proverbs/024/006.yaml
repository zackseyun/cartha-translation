  text: כִּ֣י בְ֭/תַחְבֻּלוֹת תַּעֲשֶׂה לְּ/ךָ֣ מִלְחָמָ֑ה וּ֝/תְשׁוּעָ֗ה בְּ/רֹ֣ב יוֹעֵֽץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/006.yaml
  text: For by wise guidance you will wage war[b][a], and victory is in an abundance of counselors.
translation:
  language: zh_hans
  text: 因为你要凭谋略作战[a]；谋士众多，便有胜利[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “谋略”也可译作“周密的谋划”或“明智的指导”；希伯来语原词兼有策略和审慎引导的意味。
    reason: lexical_alternative
  - marker: b
    text: “胜利”也可译作“解救”或“拯救”；在这里的作战语境中，“胜利”较为具体。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，为前面的劝诫提供理由；现代汉语中“因为”自然体现这种因果关系。
- source_word: בְתַחְבֻּלוֹת
  choice: 凭谋略
  rationale: 该词可指掌舵式的引导、周密谋划或战略部署；“凭谋略”既保留介词的工具意义，也贴合作战语境。
- source_word: תַּעֲשֶׂה לְּךָ מִלְחָמָה
  choice: 你要作战
  rationale: עשה מלחמה是“作战、进行战争”的惯用表达；לְךָ在此带有关涉自身的意味，汉语不必生硬译作“为自己”。未把未完成体强限定为单纯将来，而按箴言劝诫语境译作“要”。
- source_word: וּתְשׁוּעָה
  choice: 便有胜利
  rationale: תְּשׁוּעָה本可指拯救或解救，但在战争语境中更具体地指获胜；“胜利”最贴合上下文。
- source_word: בְּרֹב יוֹעֵץ
  choice: 谋士众多
  rationale: רֹב表示数量众多；יוֹעֵץ虽为单数形式，在此组合中具有集合意义。“谋士”与上半句的战争和谋略语境相称。
theological_decisions:
- issue: תְּשׁוּעָה的语义范围
  choice: 正文译为“胜利”
  alternative: “解救”或“拯救”
  rationale: 本节明确谈到作战，因此采用军事语境中的具体含义，同时以脚注保留该词较宽的语义范围，避免把它在其他语境中的神学含义一概缩窄。
translation_notes:
  register: 采用现代、凝练而庄重的箴言体。分号呈现两个彼此呼应的判断；“凭谋略”“谋士众多”保持军事语境和格言式节奏。脚注标记均紧随相关词语。
