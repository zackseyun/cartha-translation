  text: Do not be a witness against your neighbor without cause[b][a], and do not deceive with your lips.
translation:
  language: zh_hans
  text: 不要无故作证，指控你的邻舍；也不要用嘴唇欺骗人。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “欺骗人”也可译作“误导人”。后半句也可按反问理解：“难道你要用嘴唇欺骗人吗？”
    reason: textual_ambiguity
lexical_decisions:
- source_word: אַל תְּהִי
  choice: 不要作
  rationale: 否定词 אַל 加未完成式在此构成直接禁令；汉语用“不要”自然表达，“作证”也比逐字的“成为证人”更符合现代汉语。
- source_word: עֵד חִנָּם
  choice: 无故作证
  rationale: עֵד 指法律或准法律语境中的证人；חִנָּם 表示无缘无故、没有正当理由。合译为“无故作证”简洁而保留伦理和司法意味。
- source_word: בְּרֵעֶךָ
  choice: 指控你的邻舍
  rationale: 介词 בְּ 在证人语境中可表达针对某人；“指控”使作证的不利指向在汉语中清楚。“邻舍”保留 רֵעַ 的社会关系色彩。
- source_word: וַהֲפִתִּיתָ
  choice: 也不要……欺骗人
  rationale: פתה 在此可指欺骗、误导；与嘴唇连用时，“欺骗人”最自然。连接词 וְ 按并列禁令的语用译作“也不要”，而不是叙事性的“并且”。
- source_word: בִּשְׂפָתֶיךָ
  choice: 用嘴唇
  rationale: 保留希伯来文以嘴唇代指言语的具体意象，在现代汉语中仍可理解。
theological_decisions: []
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“邻舍”延续圣经语体且不局限于住在附近的人；“用嘴唇”保留原文意象。正文将后半句理解为与前句并列的禁令，同时以脚注保留其可能的反问句法。
