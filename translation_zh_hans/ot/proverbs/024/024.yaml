  text: אֹ֤מֵ֨ר לְ/רָשָׁע֮ צַדִּ֪יק אָ֥תָּה יִקְּבֻ֥/הוּ עַמִּ֑ים יִזְעָמ֥וּ/הוּ לְאֻמִּֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/024.yaml
  text: Whoever says to the wicked[a], “You are righteous,” peoples will curse him; nations will denounce him.
translation:
  language: zh_hans
  text: 对恶人说：“你是义人”的人，万民必咒诅他；列国必向他发怒。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “你是义人”也可译作“你是对的”或“你是正当的”。整句也可译作：“对恶人说：‘你是对的’的人，万民必咒诅他；列国必向他发怒。”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹמֵר
  choice: ……的
  rationale: 希伯来语阳性单数分词在箴言中作泛指；用现代汉语“……的”构成泛指主体，自然且不把范围限于某一特定男子。
- source_word: לְרָשָׁע
  choice: 对恶人
  rationale: רָשָׁע在此主要表示道德意义上的恶人，与צַדִּיק形成鲜明对照；“恶人”比单纯法律意义的“有罪者”更贴合智慧文学语境。
- source_word: צַדִּיק אָתָּה
  choice: 你是义人
  rationale: 保留显明的第二人称代词及“恶人／义人”的伦理对照；同时脚注说明该词也可在司法性语境中表达“你是对的／你无罪”。
- source_word: יִקְּבֻהוּ
  choice: 必咒诅他
  rationale: נקב在此有咒诅、出言诅咒之意；“咒诅”保留原文强烈的敌对和咒骂意味。
- source_word: עַמִּים
  choice: 万民
  rationale: 表达复数群体的广泛范围，并与下句“列国”形成自然的汉语诗体平行。
- source_word: יִזְעָמֻהוּ
  choice: 必向他发怒
  rationale: זעם表示愤怒、义愤或斥责；“向他发怒”直接保留情绪和对象关系，不把意义过度限定为公开谴责。
- source_word: לְאֻמִּים
  choice: 列国
  rationale: 与“万民”构成同义平行，同时保留两个希伯来群体名词之间的词汇区别。
theological_decisions:
- issue: צַדִּיק在本节是道德称义还是司法判定
  choice: 正文译作“你是义人”
  alternative: “你是对的”或“你无罪”
  rationale: 正文保留智慧文学中“恶人／义人”的核心伦理对照；但原句也可能描绘把恶人判为正当或无罪的司法性宣告，因此在脚注保留这一真实歧义，不将其神学化为特定的称义教义。
translation_notes:
  register: 采用简洁、庄重而通顺的现代标准汉语，保持箴言的两行平行结构。“万民／列国”和“咒诅／发怒”既呈现对应，也避免把原文两个不同词语完全合并。脚注标记置于与歧义相关的整句末尾。
