  text: Prepare your work outside[a]; make it ready for yourself in the field; afterward[b], build your house.
translation:
  language: zh_hans
  text: 你要在外面预备好你的工作，在田间为自己把它安排妥当；然后建造你的房屋[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “房屋”在智慧文学中也可泛指家庭或家室；但本节把它与“外面”和“田间”对照，正文因此保留具体的“房屋”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הָכֵן
  choice: 预备好
  rationale: 该命令式在这里表示使事物准备就绪、安排稳妥；“预备好”自然清楚，也与后半句的近义动词形成呼应。
- source_word: בַּחוּץ
  choice: 在外面
  rationale: 该词指户外、外面的地方，与句末“房屋”形成明确的空间对照。
- source_word: מְלַאכְתֶּךָ
  choice: 你的工作
  rationale: מְלָאכָה 可泛指工作、劳作或事务；“你的工作”保留其宽泛意义，不把它缩限为某一项任务。
- source_word: וְעַתְּדָהּ
  choice: 把它安排妥当
  rationale: עתד 的强意词干表示使之预备妥当；阴性单数后缀自然回指阴性名词“工作”。“安排妥当”既传达预备，也避免中文中连续重复“预备”。
- source_word: בַּשָּׂדֶה
  choice: 在田间
  rationale: “田间”准确表达农业劳作所在的田地，也符合现代汉语的箴言体表达。
- source_word: לָךְ
  choice: 隐含于“你的工作”及整体表达中
  rationale: 此处与格可表示为自己、为自身利益。若逐字另译“为自己”，中文略显累赘；所属语“你的”以及“把它安排妥当”在语境中已自然传达这一关联。
- source_word: אַחַר
  choice: 然后
  rationale: 该副词标示先后次序；“然后”简洁自然，清楚保留先安排生产性劳作、后建房的顺序。
- source_word: וּבָנִיתָ בֵיתֶךָ
  choice: 建造你的房屋
  rationale: 直译为“建造你的房屋”。בַּיִת 虽可引申为家室或家族，但本节与“外面”“田间”的对照支持具体建筑意义；不在正文中提前消解其潜在宽义。
theological_decisions:
- issue: “房屋”是否应解释为建立家庭或家室
  choice: 正文保留具体的“房屋”
  alternative: 建立你的家庭／家室
  rationale: 原词确有较宽的语义范围，但上下文的空间对照首先支持住宅之义。保留“房屋”既忠于直接语境，也不排除智慧文学中的延伸应用。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。句式保留原文的三步推进及优先次序；“预备好／安排妥当”反映两个近义动词而不过度机械重复。
