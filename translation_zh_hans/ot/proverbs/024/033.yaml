base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/033.yaml
  text: A little sleep[a], a little slumber, a little folding of the hands to lie down—
translation:
  language: zh_hans
  text: 再睡一会儿，再打个盹儿，再抱着双手躺一会儿——
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מְעַט
  choice: 一会儿
  rationale: 原文三次重复，表示每次只多做一点；重复“一会儿”既保留递进式的修辞，也符合现代汉语节奏。
- source_word: שֵׁנוֹת
  choice: 睡
  rationale: 该词虽为复数形式，但在此指睡眠行为；汉语用“睡一会儿”自然，并能与后句构成谚语式排比。
- source_word: תְּנוּמוֹת
  choice: 打个盹儿
  rationale: 表达浅睡、打盹，与“睡”近义而不完全相同，保留希伯来诗句的同义平行。
- source_word: חִבֻּק יָדַיִם
  choice: 抱着双手
  rationale: 较贴近字面的“环抱双手”，同时在汉语中可理解为收拢双手、无所作为的姿态；避免使用可能带有其他固定含义的“抱手”。
- source_word: לִשְׁכָּב
  choice: 躺
  rationale: 该不定式基本义为“躺下”，范围比“睡觉”更宽；如此不把隐含结果限定为睡眠。
theological_decisions: []
translation_notes:
  register: 采用自然、简洁而有谚语韵律的现代标准汉语。三次“再……一会儿”保留原文反复与逐步纵容自己的语气；末尾破折号承接下一节所述后果。
