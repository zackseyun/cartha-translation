source:
  edition: WLC
  text: פֶּן יִרְאֶ֣ה יְ֭הוָה וְ/רַ֣ע בְּ/עֵינָ֑י/ו וְ/הֵשִׁ֖יב מֵ/עָלָ֣י/ו אַפּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/018.yaml
  text: lest Yahweh see it[a], and it be evil in his eyes, and he turn his anger away from him.
translation:
  language: zh_hans
  text: 免得雅威看见这事，认为这事不好，就收回向他所发的怒气。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פֶּן
  choice: 免得
  rationale: 在警告句中引出应当避免的后果；“免得”既准确表达否定目的或忧虑后果，也符合现代汉语表达。
- source_word: יִרְאֶה
  choice: 看见
  rationale: 保留 ראה 的基本视觉含义；所看见的内容由上文语境补足。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常用音译呈现神的专名，而不以称号替代。
- source_word: וְרַע בְּעֵינָיו
  choice: 认为这事不好
  rationale: 这是希伯来语评价性惯用语，直译为“在他眼中是恶的”；此处用自然汉语表达其判断含义，同时在脚注保留更贴近原文意象的译法。
- source_word: וְהֵשִׁיב
  choice: 便收回
  rationale: 使役形在此表示使怒气转回、撤去；“收回”自然表达停止施加怒气的动作。
- source_word: מֵעָלָיו
  choice: 向他所发的
  rationale: 原短语表示怒气从那人身上撤离；汉语将其自然转换为怒气所针对的对象。
- source_word: אַפּוֹ
  choice: 他的怒气
  rationale: אַף 字面与“鼻”有关，但此处是表示愤怒的固定用法，应按实际语义译为“怒气”。
theological_decisions:
- issue: 如何翻译神名 יְהוָה
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；译作“雅威”以保留其专名性质，不用“主”等称号替代。
- issue: 雅威收回怒气的对象
  choice: 明确怒气是向“他”所发
  alternative: 把怒气理解为转向幸灾乐祸者
  rationale: מֵעָלָיו 明说怒气从“他”身上撤去；本节没有明说怒气随后转向谁，因此不在正文中补入这一推论。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“认为这事不好”避免生硬照搬希伯来语习语；“收回向他所发的怒气”清楚保留怒气从该人身上撤去的方向。
