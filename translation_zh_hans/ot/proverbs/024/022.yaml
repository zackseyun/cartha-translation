  text: כִּֽי פִ֭תְאֹם יָק֣וּם אֵידָ֑/ם וּ/פִ֥יד שְׁ֝נֵי/הֶ֗ם מִ֣י יוֹדֵֽעַ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/022.yaml
  text: For their disaster will rise suddenly[b][a], and who knows the ruin of them both?
translation:
  language: zh_hans
  text: 因为他们的灾祸必骤然兴起[a]；他们二者的毁灭[b]，谁能知道呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为他们的灾难必突然发生。”
    reason: 说明אֵיד与קום这一搭配也可用较自然、较少意象化的汉语表达。
  - marker: b
    text: “他们二者”很可能指上一节的耶和华和君王；这句话也可能是指他们二者所带来的毁灭。另有人把“二者”理解为上下文中其他两方。
    reason: 原文既没有明说“二者”的所指，也没有完全限定“毁灭”与二者之间的关系，需保留不同理解。
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上一节的劝诫并说明理由；“因为”在现代汉语中自然地表达因果关系。
- source_word: פִתְאֹם
  choice: 骤然
  rationale: 表达事情突发而难以预料，保留原文警告的急迫感。
- source_word: יָקוּם
  choice: 兴起
  rationale: קום的基本意象是“起来、兴起”；此处保留该意象，同时使“灾祸兴起”保持庄重的智慧文学语体。
- source_word: אֵידָם
  choice: 他们的灾祸
  rationale: אֵיד指灾祸、灾难，带第三人称阳性复数后缀；直译代词，不在正文中预先限定其所指。
- source_word: וּפִיד
  choice: 毁灭
  rationale: פִיד表示毁灭性的灾难；以“毁灭”对应，既与“灾祸”形成近义平行，又避免机械重复。
- source_word: שְׁנֵיהֶם
  choice: 他们二者的
  rationale: 原文明确指“二者”，但该短语可被理解为二者所有或二者所带来的毁灭；中文正文保留这种关系上的含混。
- source_word: מִי יוֹדֵעַ
  choice: 谁能知道呢
  rationale: 以反问表达世人无法预知或测度，符合现代汉语习惯和原文语气。
theological_decisions:
- issue: “他们二者”（שְׁנֵיהֶם）的所指及其与“毁灭”的关系
  choice: 正文保留“他们二者的毁灭”的含混表达，不明确指定所指或因果关系。
  alternative: 按紧邻上文，将“二者”明确解释为耶和华与君王，并将短语译成“他们二者所降的毁灭”。
  rationale: 上一节明确提到耶和华和君王，因此“二者”很可能指他们，意思可能是无人知道这两位能给悖逆者带来怎样的毁灭；但希伯来语构造本身也容许理解为属于二者或临到二者的灾祸。正文不应消除这种真实的解释张力。
translation_notes:
  register: 采用现代、庄重而简洁的智慧文学语体。“骤然兴起”略带文学色彩，以保留原文קום的动态意象；其余措辞力求普通读者易懂。所有脚注标记均已置入正文。
