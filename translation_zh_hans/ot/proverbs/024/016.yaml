  text: כִּ֤י שֶׁ֨בַע יִפּ֣וֹל צַדִּ֣יק וָ/קָ֑ם וּ֝/רְשָׁעִ֗ים יִכָּשְׁל֥וּ בְ/רָעָֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/016.yaml
  text: For the righteous falls seven times and rises again[c][b][a], but the wicked stumble in calamity.
translation:
  language: zh_hans
  text: 因为义人七次跌倒，仍会起来[a][b]；恶人却在灾祸中绊倒[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “义人”原文为阳性单数，在这则箴言中代表义人这一类人，也可译作“一个义人”。
    reason: lexical_alternative
  - marker: b
    text: “七次”很可能是惯用说法，表示一再发生或达到完全之数：义人虽多次跌倒，仍会起来。
    reason: cultural_note
  - marker: c
    text: “在灾祸中绊倒”也可译作“因灾难而倾覆”或“在患难中跌倒”。这里的原文词更可能指逆境或灾难，而非道德意义上的邪恶。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 此处承接上文，为前面的劝诫说明理由；“因为”自然保留其逻辑关系。
- source_word: שֶׁבַע
  choice: 七次
  rationale: 保留希伯来的数字意象；在箴言语境中，“七”也可表达反复多次或完全之数。
- source_word: יִפּוֹל
  choice: 跌倒
  rationale: 未完成式在此陈述一般性的箴言真理；“跌倒”既保留动作意象，也容纳遭遇挫折或患难的含义。
- source_word: צַדִּיק
  choice: 义人
  rationale: 该词为阳性单数的名词化用法，在箴言中代表一类人；现代汉语“义人”简洁、庄重，且不必另加原文没有的“男人”。
- source_word: וָקָם
  choice: 仍会起来
  rationale: קום意为起来、站起；“仍会”体现与反复跌倒形成的转折和恢复之意，但不限定恢复的具体方式。
- source_word: וּרְשָׁעִים
  choice: 恶人却
  rationale: 复数名词化形容词指邪恶之人；连接词在上下文中具有对比作用，译作“却”自然鲜明。
- source_word: יִכָּשְׁלוּ
  choice: 绊倒
  rationale: כשל的尼法勒式可指踉跄、绊倒或倾覆；“绊倒”保留原文与前半句“跌倒—起来”相呼应的形象。
- source_word: בְרָעָה
  choice: 在灾祸中
  rationale: רָעָה在此更可能指逆境、灾难，而非道德意义上的邪恶；介词ב译为“在……中”，保留灾祸作为处境的表达。
theological_decisions:
- issue: צַדִּיק的代表性阳性单数
  choice: 义人
  alternative: 一个义人／义人男子
  rationale: 希伯来语虽为阳性单数，但在箴言中代表一类人。汉语“义人”不标示语法性别，也没有必要添加原文未明说的“男子”；脚注说明其单数代表性。
- issue: 箴言中“跌倒”的含义
  choice: 保留“跌倒—起来”的宽泛比喻，侧重人在挫折或患难中的复起
  alternative: 特指屡次犯罪后悔改／仅指身体摔倒
  rationale: 原文没有明确把“跌倒”限定为犯罪，也不只是身体动作；与后半句“灾祸”及“绊倒”的对照更支持在逆境中受挫与复起的理解，因此不把特定教义解释写入正文。
- issue: רָעָה的语义
  choice: 灾祸
  alternative: 邪恶／患难
  rationale: 此处上下文强调恶人遭遇灾难时的倾覆，“灾祸”比道德意义的“邪恶”更贴切；同时以脚注保留“患难、灾难”等可能表达。
translation_notes:
  register: 采用现代、庄重而通俗的箴言体。“义人／恶人”保持圣经智慧文学中的对称称谓；分号突出两类人的鲜明对照。“仍会起来”自然表达恢复，却不把跌倒限定为犯罪、肉体摔倒或某一种具体患难。
