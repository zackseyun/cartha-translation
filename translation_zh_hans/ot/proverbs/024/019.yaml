  text: אַל תִּתְחַ֥ר בַּ/מְּרֵעִ֑ים אַל תְּ֝קַנֵּ֗א בָּ/רְשָׁעִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/019.yaml
  text: Do not be agitated because of evildoers[a]; do not envy the wicked.
translation:
  language: zh_hans
  text: 不要因作恶的人而心中烦躁[a]，也不要嫉妒恶人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不要因作恶的人而发怒。”
    reason: 词义可能涵盖因情绪激动而发怒；正文采用较宽泛的“心中烦躁”，以保留内在受扰之意。
lexical_decisions:
- source_word: תִּתְחַר
  choice: 心中烦躁
  rationale: 该词在此表示内心发热、激动或不安；“心中烦躁”自然表达这种受搅扰的状态，同时不把含义仅限于愤怒。
- source_word: בַּמְּרֵעִים
  choice: 因作恶的人
  rationale: 介词 בְּ 在此与动词连用，可理解为原因或所针对的对象；“因作恶的人”体现因他们而情绪受扰。מְרֵעִים 是分词，指持续或实际作恶的人。
- source_word: תְּקַנֵּא
  choice: 嫉妒
  rationale: קנא 与 בְּ 连用，在智慧文学中通常指因别人而生嫉妒；这里与上句禁令平行，“嫉妒”简洁明确。
- source_word: בָּרְשָׁעִים
  choice: 恶人
  rationale: רְשָׁעִים 是《箴言》中常见的道德类别用语，指邪恶或有罪的人；“恶人”保留了箴言简练的表达。
- source_word: אַל
  choice: 不要
  rationale: אַל 与未完成式连用构成直接禁令，现代汉语用“不要”最自然准确。
