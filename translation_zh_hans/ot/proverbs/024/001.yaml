  text: אַל תְּ֭קַנֵּא בְּ/אַנְשֵׁ֣י רָעָ֑ה וְ/אַל תתאו לִ/הְי֥וֹת אִתָּֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/001.yaml
  text: Do not envy evil men[b][a], and do not desire to be with them.
translation:
  language: zh_hans
  text: 不要嫉妒作恶的人，也不要渴望与他们为伍。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“想要和他们在一起。”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תְּקַנֵּא
  choice: 不要嫉妒
  rationale: אַל与未完成式构成禁止语气；קנא在此指因恶人看似拥有的处境或成就而心生羡慕、嫉妒。
- source_word: בְּאַנְשֵׁי רָעָה
  choice: 作恶的人
  rationale: 该短语直译为“邪恶之人”，即以恶为特征的人；“作恶的人”在现代汉语中自然、明确，也无需用带有不自然性别色彩的“男人”。
- source_word: וְאַל תתאו
  choice: 也不要渴望
  rationale: 第二个אַל引出与前句平行的禁止；תתאו表示欲求、向往，“渴望”保留了较强的内在愿望意味。
- source_word: לִהְיוֹת אִתָּם
  choice: 与他们为伍
  rationale: 字面义为“和他们在一起”，语境着重陪伴和结交；“与他们为伍”自然传达这种关联，同时不把含义扩大为认同他们的一切行为。
theological_decisions: []
translation_notes:
  register: 采用现代、简洁而庄重的箴言体。保留两个平行的禁止句；“与他们为伍”传达社交和结伴含义，并以脚注注明较为字面的译法。
