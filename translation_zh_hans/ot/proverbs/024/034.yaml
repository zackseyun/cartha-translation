  text: and your poverty will come like a prowler[a], and your need like an armed man.
translation:
  language: zh_hans
  text: 你的贫穷必像游荡者一样临到；你的匮乏也必像武装者[a]一样临到。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“像拿盾牌的人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָא
  choice: 就会……来到
  rationale: בוא的完成式在箴言警告的结果句中表达必然将临的后果；“就会……来到”承接上文并符合现代汉语。
- source_word: מִתְהַלֵּךְ
  choice: 游荡而来
  rationale: הלך的Hitpael分词表示来回走动、四处行走；此处作伴随方式，描绘贫穷仿佛会行走而来。译作“游荡而来”保留拟人化图像，不把它直接实体化为原文未明说的“盗贼”。
- source_word: רֵישֶׁךָ
  choice: 你的贫穷
  rationale: רֵישׁ表示贫穷、穷困；“贫穷”简明自然，并与下半句的“缺乏”平行。
- source_word: וּמַחְסֹרֶיךָ
  choice: 你的缺乏
  rationale: מַחְסוֹר表示所缺之物、匮乏或需要；原文虽采用复数形式，但在此具有集合意义，汉语用“缺乏”较自然。
- source_word: כְּאִישׁ מָגֵן
  choice: 像武装的人一样
  rationale: 字面为“像有盾牌的人”，在语境中描写装备好、难以抵挡的人。“武装的人”传达其威逼力量，字面意象收入脚注。
theological_decisions: []
translation_notes:
  register: 采用现代、凝练而庄重的箴言体。保留“贫穷”游荡而来的拟人手法及两行平行结构；不将מִתְהַלֵּךְ擅自具体化为“盗贼”或“强盗”。脚注标记置于其实际所说明的“武装的人”之后。
