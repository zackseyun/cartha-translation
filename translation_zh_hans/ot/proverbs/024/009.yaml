  text: זִמַּ֣ת אִוֶּ֣לֶת חַטָּ֑את וְ/תוֹעֲבַ֖ת לְ/אָדָ֣ם לֵֽץ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/009.yaml
  text: The scheme of folly is sin[b][a], and a scoffer is an abomination to mankind.
translation:
  language: zh_hans
  text: 愚妄的图谋[a]就是罪；讥诮者[b]为众人所憎恶。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “图谋”也可译作“谋划”或“意念”。
    reason: lexical_alternative
  - marker: b
    text: “讥诮者”也可译作“嘲弄者”。
    reason: lexical_alternative
lexical_decisions:
- source_word: זִמַּת
  choice: 图谋
  rationale: 该词指经过构想、筹划的意图；“图谋”保留其蓄意谋划的意味，也符合本节的负面语境，同时不把它限定为具体阴谋。
- source_word: אִוֶּלֶת
  choice: 愚妄
  rationale: 这是抽象名词，指违背智慧、道德败坏的愚昧状态；“愚妄”符合《箴言》的智慧文学语体。
- source_word: חַטָּאת
  choice: 罪
  rationale: 原文名词在此作表语，直陈愚妄的图谋“就是罪”；保留名词形式可避免弱化其道德判断。
- source_word: לֵץ
  choice: 讥诮者
  rationale: 该词在《箴言》中指傲慢嘲讽并拒绝管教的人；“讥诮者”既表达嘲弄行为，也保留其持续的品格姿态。
- source_word: תוֹעֲבַת
  choice: 所憎恶
  rationale: 该词表达强烈厌恶。汉语“为众人所憎恶”自然地传达这一强度，并保留原句对讥诮者的严厉评价。
- source_word: לְאָדָם
  choice: 为众人
  rationale: אָדָם在这里泛指人、人类；“众人”在现代汉语中自然表达其普遍、非性别限定的含义。
theological_decisions:
- issue: “愚妄的图谋”与“罪”的关系
  choice: 译作“就是罪”
  alternative: 译作“是有罪的”或“是一种过犯”
  rationale: 原文以名词חַטָּאת作表语，直接把这种图谋判定为罪；“就是罪”保留了原文简洁而有力的道德断言。
- issue: 泛指的אָדָם
  choice: 译作“众人”
  alternative: 译作“人”或“世人”
  rationale: 此处并非特指某个男性，而是泛指人类社会。“众人”既准确表达泛指意义，也使现代汉语句子自然。
translation_notes:
  register: 采用简洁、凝练的现代书面汉语，保留箴言式的对称结构和强烈道德判断；“愚妄”“讥诮者”具有庄重的智慧文学色彩，但普通现代读者仍易理解。
