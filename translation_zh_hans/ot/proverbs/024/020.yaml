  text: כִּ֤י לֹֽא תִהְיֶ֣ה אַחֲרִ֣ית לָ/רָ֑ע נֵ֖ר רְשָׁעִ֣ים יִדְעָֽךְ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/020.yaml
  text: For there will be no future for the evil[b][a]; the lamp of the wicked will be put out.
translation:
  language: zh_hans
  text: 因为作恶的人没有将来[a]；恶人的灯必熄灭[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “将来”也可译作“后来”或“结局”。希伯来语 אַחֲרִית 可指一个人后来的光景、最终结局或未来前景。
    reason: lexical_alternative
  - marker: b
    text: “灯必熄灭”也可译作“灯必被熄灭”。灯的意象可表示生命、昌盛或长久的地位、前景不再存留。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文的劝诫并说明理由，保留原文的因果关系。
- source_word: לֹא תִהְיֶה
  choice: 没有
  rationale: 按现代汉语自然表达存在句的否定将来含义；与“将来”连用时无需另加“将会”。
- source_word: אַחֲרִית
  choice: 将来
  rationale: 此词可指后来、结局或未来前景；“将来”与下句灯熄灭的意象相呼应，表达恶人没有可持续的前景，同时不把含义局限为后代。
- source_word: לָרָע
  choice: 作恶的人
  rationale: 原文是带定冠词的阳性单数实体化形容词，指一个恶人而非抽象的恶。“作恶的人”在现代汉语中自然，也避免“恶者”可能引发的特殊神学联想。
- source_word: נֵר
  choice: 灯
  rationale: 保留原文具体的灯之意象，不抽象化为“光”；这一意象可涵盖生命、昌盛和延续。
- source_word: רְשָׁעִים
  choice: 恶人
  rationale: 原文为复数类别称谓；汉语“恶人”可自然表示这一群体，并与上句较个体化的“作恶的人”保持细微区别。
- source_word: יִדְעָךְ
  choice: 必熄灭
  rationale: 该动词描述灯熄灭；“熄灭”准确保留意象，“必”表达未完成式在箴言断言中的将来确定性，而不额外指定使灯熄灭的施事者。
theological_decisions:
- issue: 单数 לָרָע 与复数 רְשָׁעִים 的转换
  choice: 首句译作“作恶的人”，次句译作集合性的“恶人”。
  alternative: 两处都译作“恶人”；或将单数译作“那恶者”。
  rationale: 这样尽可能保留原文由单数转为复数类别称谓的质感，同时不把单数表达误解为某个特定的超自然“恶者”。
- issue: אַחֲרִית 的范围
  choice: 译作“将来”，并以脚注保留“结局、后来”的可能性。
  alternative: 结局；后来；后代
  rationale: 本节强调作恶者没有长久的前景，与灯熄灭的平行意象相合。“后代”过于狭窄，“结局”虽可能，却会更强地限定为最终结局。
- issue: 灯熄灭意象的所指
  choice: 正文保留“灯必熄灭”，不在正文中明确解释为死亡、衰败或断绝后代。
  alternative: 意译为“生命必终止”或“兴旺必消失”。
  rationale: 原文意象本身容许生命、昌盛、家系或持久地位等相关含义；保留意象可避免武断地只确定其中一种。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“作恶的人”避免生硬的“恶者”，分号保留两句平行关系；正文简洁，脚注说明词义范围和意象的开放性。
