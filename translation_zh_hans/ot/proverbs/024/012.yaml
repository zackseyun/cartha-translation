  text: כִּֽי תֹאמַ֗ר הֵן֮ לֹא יָדַ֪עְנ֫וּ זֶ֥ה הֲֽ/לֹא תֹ֘כֵ֤ן לִבּ֨וֹת הֽוּא יָבִ֗ין וְ/נֹצֵ֣ר נַ֭פְשְׁ/ךָ ה֣וּא יֵדָ֑ע וְ/הֵשִׁ֖יב לְ/אָדָ֣ם כְּ/פָעֳלֽ/וֹ־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/012.yaml
  text: If you say[a], “Look, we did not know this,” does not he who weighs hearts understand, and he who keeps your soul know[e][d][c][b], and will he not repay a man according to his work?
translation:
  language: zh_hans
  text: 你若说：“看哪，这事我们不知道。”那衡量人心的，岂不明白吗？那看守你性命的，岂不知道吗？他岂不按各人所行的报应他们吗？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי תֹאמַר
  choice: 你若说
  rationale: כִּי 在此引出假设情形，配合未完成式 תֹאמַר，译为“若”自然且准确。
- source_word: הֵן
  choice: 看哪
  rationale: 保留引语中提示、强调的语气；“看哪”庄重且为现代读者所能理解。
- source_word: לֹא יָדַעְנוּ זֶה
  choice: 这事我们不知道
  rationale: 保留第一人称复数和指示对象“这事”，呈现推卸责任的托辞。
- source_word: תֹכֵן לִבּוֹת
  choice: 衡量人心的
  rationale: 保留 תכן“衡量、称量”的意象；לִבּוֹת 指内心，包括意念与动机。
- source_word: יָבִין
  choice: 明白
  rationale: 与衡量内心的意象相配，表达上帝洞察人的真实动机。
- source_word: וְנֹצֵר נַפְשְׁךָ
  choice: 那看守你性命的
  rationale: נצר 表示看守、护卫；נֶפֶשׁ 在此可指性命、生命或自身。“性命”既自然，也保留上帝保全人的语境含义。
- source_word: יֵדָע
  choice: 知道
  rationale: 直接对应 ידע，并与前文人所声称的“不知道”形成鲜明呼应。
- source_word: וְהֵשִׁיב לְאָדָם כְּפָעֳלוֹ
  choice: 他岂不照各人所行的报应各人吗
  rationale: הֵשִׁיב 在此有按行为回报之意；אָדָם 是泛指的人，汉语以“各人”自然表达代表性单数；פֹּעַל 可指行为或所做之事。
theological_decisions:
- issue: נֶפֶשׁ 的人论含义
  choice: 性命
  alternative: 灵魂；生命；你本人
  rationale: 此处重点是上帝看守人的存在与生命，并非界定灵魂与身体的系统关系。“性命”符合上下文，同时不排除 נֶפֶשׁ 较宽的语义范围。
- issue: 上帝按行为施行回报
  choice: 照各人所行的报应各人
  alternative: 按他所做的回报他
  rationale: 保留经文的道德审判张力，只陈述上帝鉴察内心并按行为回报，不额外引入有关得救机制的教义解释。
- issue: אָדָם 的泛指范围
  choice: 各人
  alternative: 一个人；世人
  rationale: 原文单数 אָדָם 在此具有普遍、代表性意义。“各人”在现代汉语中清楚涵盖每一个人，又不把经文限制为男性。
translation_notes:
  register: 采用现代、庄重而通顺的标准普通话。保留两个连续反问所期待的肯定答案，并保留“衡量人心”的希伯来意象；末句补出“岂不”，使原文 הֲלֹא 所统摄的并列反问在汉语中清晰自然。
