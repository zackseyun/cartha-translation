  text: בְּ֭/חָכְמָה יִבָּ֣נֶה בָּ֑יִת וּ֝/בִ/תְבוּנָ֗ה יִתְכּוֹנָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/003.yaml
  text: By wisdom a house is built[b][a], and by understanding it is established.
translation:
  language: zh_hans
  text: 房屋[a]靠智慧建造，又凭聪明得以坚立[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “房屋”也可指“家室”或“家庭”；原词既可指实体建筑，也可延伸指其中的家庭共同体。
    reason: lexical_alternative
  - marker: b
    text: 或译：“得以稳固”或“得以确立”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּחָכְמָה
  choice: 靠智慧
  rationale: 介词 בְּ 在此表示手段；“靠智慧”自然简洁，表达智慧是建造所凭借的途径。
- source_word: יִבָּנֶה
  choice: 建造
  rationale: 这是 בנה 的尼法勒未完成式，在箴言中具有普遍真理的意味；中文用“建造”配合“靠”字结构，可自然表达被动而不必机械加入“被”。
- source_word: בָּיִת
  choice: 房屋
  rationale: בַּיִת 可指实体房屋，也可延伸指家室或家庭；正文保留具体的建筑意象，并以脚注说明其延伸含义。
- source_word: וּבִתְבוּנָה
  choice: 又凭聪明
  rationale: תְּבוּנָה 指理解力、明辨或聪明；“聪明”符合现代汉语智慧文学的庄重表达，并与“智慧”形成自然平行。
- source_word: יִתְכּוֹנָן
  choice: 得以坚立
  rationale: 该词源于 כון 的反身/结果性词形，含建立稳固、坚立之意；“得以坚立”保留结果与稳固性，也与上句形成对应。
theological_decisions: []
translation_notes:
  register: 采用现代、凝练而庄重的箴言体。以“靠……又凭……”呈现希伯来文平行结构；正文保留“房屋”的具体意象，同时不排除家庭或家室的比喻义。
