  text: רָאמ֣וֹת לֶֽ/אֱוִ֣יל חָכְמ֑וֹת בַּ֝/שַּׁ֗עַר לֹ֣א יִפְתַּח פִּֽי/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/007.yaml
  text: Wisdom is too high for a fool[b][a]; in the gate he does not open his mouth.
translation:
  language: zh_hans
  text: 智慧对愚昧人来说高不可及[a]；在城门口[b]，他不开口。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“智慧对愚昧人来说太崇高了。”原文“智慧”采用复数形式，可能表达抽象或加强的意义。
    reason: lexical_alternative
  - marker: b
    text: 古代以色列城镇的城门口是公开议事、审判和处理公共事务的场所。
    reason: cultural_note
lexical_decisions:
- source_word: רָאמוֹת
  choice: 高不可及
  rationale: 该词源于“高、被高举”的词根，在这里作谓语，表达智慧高到愚昧人无法企及；“高不可及”既保留高度隐喻，也符合现代汉语。
- source_word: לֶאֱוִיל
  choice: 对愚昧人来说
  rationale: 介词 ל 在此表示关联或就某人而言；“对……来说”自然传达智慧超出愚昧人所能企及的意思。אֱוִיל 依《箴言》的智慧文学语境译为“愚昧人”。
- source_word: חָכְמוֹת
  choice: 智慧
  rationale: 原文虽为复数形态，但在智慧文学中可作抽象或加强意义；汉语单数集合概念“智慧”最自然，同时不把它具体化为若干智慧之事。
- source_word: בַּשַּׁעַר
  choice: 在城门口
  rationale: “城门口”在古代以色列城镇中是公开议事、审判和处理公共事务的场所；此译保留具体社会场景，并用脚注说明其文化含义。
- source_word: לֹא יִפְתַּח פִּיהוּ
  choice: 他不开口
  rationale: 直译原文习语，保留其开放性：经文没有明确说明他是因无知、羞愧、无能力或无发言地位而沉默。
theological_decisions:
- issue: 愚昧人在城门口沉默的原因
  choice: 不说明原因，仅译作“他不开口”
  alternative: “他无话可说”或“他不能开口”
  rationale: 希伯来文只陈述他不张口，没有明确交代能力或动机；保留这一张力可避免加入原文未明说的解释。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“高不可及”保留原文的高度隐喻；“他不开口”简洁地保存原文对沉默原因的含混。脚注标记按相关词语就近安放。
