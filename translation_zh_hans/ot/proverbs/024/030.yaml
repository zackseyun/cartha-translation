  text: עַל שְׂדֵ֣ה אִישׁ עָצֵ֣ל עָבַ֑רְתִּי וְ/עַל כֶּ֝֗רֶם אָדָ֥ם חֲסַר לֵֽב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/030.yaml
  text: I passed by the field of a sluggard[a], and by the vineyard of a man lacking sense.
translation:
  language: zh_hans
  text: 我经过懒汉的田地，又经过缺乏判断力之人的葡萄园[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “缺乏判断力之人”或译“无知之人”；原文直译为“缺少心的人”。
    reason: 保留 חֲסַר לֵב 的字面意象，并说明其在箴言中指缺乏理解或判断力的惯用含义。
lexical_decisions:
- source_word: עַל ... עָבַרְתִּי
  choice: 从……边经过／从……旁走过
  rationale: 介词 עַל 与“经过”连用，在这里表示从某处旁边经过；按现代汉语习惯译出空间关系，并用轻微变化避免行文僵硬。
- source_word: שְׂדֵה אִישׁ עָצֵל
  choice: 懒汉的田
  rationale: שְׂדֵה 指耕种的田地；אִישׁ עָצֵל 是箴言中受道德批评的懒惰之人。“懒汉”简洁自然，并保留原文的男性单数形象。
- source_word: כֶּרֶם
  choice: 葡萄园
  rationale: 这是该词在农业语境中的通常含义，也与上半句的“田”构成平行。
- source_word: אָדָם חֲסַר לֵב
  choice: 无知之人
  rationale: חֲסַר לֵב 直译是“缺少心”，在箴言中指缺乏判断力、见识或明辨能力的人。“无知之人”以简洁、庄重的现代汉语传达这一智慧文学惯用语。
theological_decisions:
- issue: חֲסַר לֵב 中“心”的含义
  choice: 正文译为“无知之人”，脚注保留直译及语义范围
  alternative: 缺乏心的人／缺乏判断力的人／不明事理的人
  rationale: 希伯来语的“心”可指思考、判断和领悟的内在能力。正文采用自然汉语，但不把它缩窄为单纯的智力不足；脚注保存原文意象与可能语义。
- issue: אִישׁ 与 אָדָם 的男性表达
  choice: 分别译作“懒汉”和“……之人”
  alternative: 懒惰的人／缺乏见识的人
  rationale: 原文以阳性单数的代表人物构成平行。“懒汉”明确保留第一行的男性形象；第二行的“之人”在汉语中不否认其男性所指，同时避免重复累赘。
translation_notes:
  register: 采用现代、凝练而庄重的箴言体。两行以“田”和“葡萄园”、“懒汉”和“无知之人”形成平行；用“经过／走过”作轻微措辞变化，使普通读者易懂而不损害原文结构。
