  yaml_path: translation/ot/proverbs/024/013.yaml
  text: Eat honey[a], my son, for it is good[b], and honey from the comb is sweet to your taste.
translation:
  language: zh_hans
  text: 我儿，你要吃蜜，因为蜜是好的；蜂巢滴下的蜜[a]在你口中[b]甘甜。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “蜂巢滴下的蜜”所译的希伯来词可指蜂巢蜜，也可指从蜂巢滴流的蜜。
    reason: lexical_alternative
  - marker: b
    text: 直译“在你的上腭上”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱכָל
  choice: 你要吃
  rationale: 这是阳性单数的命令式。用“你要吃”保留直接劝诫的语气，也符合现代汉语智慧教导的表达。
- source_word: בְּנִי
  choice: 我儿
  rationale: 这是智慧文学中父辈对儿子的呼语；“我儿”简洁庄重，并保留原文的阳性单数和教导场景。
- source_word: דְבַשׁ
  choice: 蜜
  rationale: 该词通常指蜂蜜；在上下文明确时用“蜜”自然凝练。
- source_word: כִּי טוֹב
  choice: 因为蜜是好的
  rationale: כִּי说明命令的理由，טוֹב保留广义的“好”，不缩窄为仅仅“可口”。补出“蜜”使汉语指代清楚。
- source_word: וְנֹפֶת
  choice: 蜂房流出的蜜
  rationale: נֹפֶת可指蜂房中的蜜或滴流的蜜。“蜂房流出的蜜”既呈现其与前一个“蜜”的词汇区别，也在现代汉语中清楚自然。
- source_word: מָתוֹק
  choice: 甘甜
  rationale: 该形容词在这里描述味觉上的甜美；“甘甜”准确且具有适合箴言的庄重感。
- source_word: עַל חִכֶּךָ
  choice: 入口
  rationale: 原文直译为“在你的上膛上”。“入口”以自然现代汉语传达味觉体验，同时由脚注保留具体身体意象。
theological_decisions: []
translation_notes:
  register: 采用现代、简洁而庄重的劝诫语体。“我儿”保留智慧文学的家庭教导场景；分号呈现两句彼此对应而又递进的结构。
