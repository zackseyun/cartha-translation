  yaml_path: translation/ot/proverbs/024/031.yaml
  text: and behold[a], it was all overgrown with thorns; nettles covered its surface[c][b], and its stone wall was broken down.
translation:
  language: zh_hans
  text: 看哪，田地长满了荆棘[a]，荨麻[b]遮盖了地面[c]，田地的石墙也倒塌了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “荆棘”所译的希伯来词具体指哪一种植物，不能确定；也可译作“蓟草”，泛指有刺、有害的杂生植物。
    reason: lexical_alternative
  - marker: b
    text: “荨麻”所译的希伯来词具体指哪一种植物，不能确定；也可译作“荆棘丛”或“杂草”，指不受欢迎的野生植物。
    reason: lexical_alternative
  - marker: c
    text: 希伯来文直译为“它的脸”，在这里指田地的表面。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留希伯来语提示读者注意眼前景象的指示和感叹语气；“看哪”庄重而简洁，适合智慧文学。
- source_word: עָלָה כֻלּוֹ
  choice: 田地长满了
  rationale: עָלָה本义为“长上来”，与כֻלּוֹ合用描写野生植物遍及整块产业。结合上一节的田地与葡萄园，以“田地”为承接性补足，使现代汉语自然清楚。
- source_word: קִמְּשֹׂנִים
  choice: 荆棘
  rationale: 具体植物种类不能确定，但显然指有刺、有害的野生植物；“荆棘”保留传统意象，又不过度限定植物学身份。
- source_word: כָּסּוּ
  choice: 遮盖了
  rationale: 直接表达这些野生植物覆盖地表的状态，符合动词的普通含义。
- source_word: פָנָיו
  choice: 地面
  rationale: 原文直译为“它的脸”，在此是指田地可见的表面；译作“地面”符合现代汉语习惯。
- source_word: חֲרֻלִּים
  choice: 蒺藜
  rationale: 该词所指植物不确定，传统上可理解为荨麻或其他有害野草。“蒺藜”可表达带刺荒草，并与前一植物词“荆棘”保持区别，但以脚注说明不确定性。
- source_word: וְגֶדֶר אֲבָנָיו
  choice: 石墙也
  rationale: 指产业周围用石头砌成的界墙；“石墙”简洁自然，“也”延续所见的第三项荒废景象。
- source_word: נֶהֱרָסָה
  choice: 倒塌了
  rationale: Niphal形态描述墙已被毁坏、坍塌的状态；“倒塌了”比人为色彩较强的“拆毁了”更适合无人照管的语境。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。“看哪”保留观察现场的鲜明感；两个植物词分别译作“荆棘”和“蒺藜”，并用脚注保存植物辨识上的不确定性。为使本节脱离上文时仍清楚，以“田地”承接24:30的语境。
