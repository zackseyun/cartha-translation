  yaml_path: translation/ot/proverbs/024/025.yaml
  text: But for those who rebuke[a], it will be pleasant[b], and a good blessing will come upon them.
translation:
  language: zh_hans
  text: 但责备人的，必有喜悦[a]；美好的福分必临到他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “责备”也可译为“劝诫”或“纠正”。希伯来文此处的动词可表达愉悦、可喜或甘美；原文没有说明是谁感到愉悦，也没有说明所指为何事。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלַמּוֹכִיחִים
  choice: 但责备人的
  rationale: 分词 מוֹכִיחִים 指提出必要责备、劝诫或纠正的人；结合上一节偏袒恶人的情形，前缀 וְ 在此表达转折，用“但”。
- source_word: יִנְעָם
  choice: 必得喜悦
  rationale: 动词 נעם 表示愉悦、甘美或令人喜悦。希伯来文未明说主语；译作“必得喜悦”保留简洁和一定的开放性，同时在中文中比“必是愉快的”自然。
- source_word: וַעֲלֵיהֶם תָּבוֹא
  choice: 必临到他们
  rationale: 直译为“必来到他们身上”；“临到他们”自然保留福分降临于人的意象。
- source_word: בִרְכַּת טוֹב
  choice: 美好的福分
  rationale: 构词短语字面为“美好／福祉的祝福”。“美好的福分”既保留 טוב 的正面含义，也避免中文“好的祝福”的生硬重复。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的箴言体。两个分句以分号连接，保持希伯来诗句的紧凑和平行感；不补出“众人”或“上帝”为喜悦的主体，以保存原文的含混性。
