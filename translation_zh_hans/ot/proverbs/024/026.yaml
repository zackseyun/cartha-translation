  yaml_path: translation/ot/proverbs/024/026.yaml
  text: He kisses the lips who gives upright words[a][b].
translation:
  language: zh_hans
  text: 以正直的话作答的人，亲吻嘴唇[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可理解为：“诚实的回答如同亲吻嘴唇。”希伯来语动词是主动形式（“他亲吻”），但这句箴言也可能以形象的说法，把恰当的回答比作亲吻所表达的亲近或真诚。
    reason: alternative_reading
  - marker: b
    text: “正直的话”也可译为“正确的话”、“坦率的话”或“诚实的话”。
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂפָתַיִם
  choice: 嘴唇
  rationale: 该双数名词直指双唇；保留具体意象，不将亲吻的画面抽象化。
- source_word: יִשָּׁק
  choice: 亲吻
  rationale: 这是נשׁק的Qal未完成时第三人称阳性单数，形式为主动；以箴言式的一般现在意义译出，不改成被动。
- source_word: מֵשִׁיב
  choice: 说……的人
  rationale: 该使役分词在与“话”连用时表示作答或回应；正文用自然汉语表达其发言者含义，脚注说明“回答”的可能译法。
- source_word: דְּבָרִים
  choice: 话
  rationale: 保留希伯来语复数所指的言语内容；现代汉语通常不必显式标示复数。
- source_word: נְכֹחִים
  choice: 正直
  rationale: 该词有正、直、合宜、坦率之意；“正直”兼顾道德色彩和“直”的词义，同时在脚注列出其他合理表达。
theological_decisions:
- issue: 亲吻与正直回应之间的句法及比喻关系
  choice: 按希伯来语主动句式译为“说正直话的人，亲吻人的嘴唇”
  alternative: “诚实的回答如同亲吻嘴唇”或“诚实回答的人必蒙亲吻”
  rationale: 原文动词形态明确为主动，但语序简练，主宾关系及谚语性的比喻功能可能引发不同理解。正文保留主动形式和张力，不擅自改为被动或明喻；脚注交代惯用性理解。
translation_notes:
  register: 采用现代、凝练而庄重的箴言体。正文尽量贴近希伯来语的主动句法与具体意象；因直译在汉语中略显突兀，借脚注保留其可能的惯用性、比喻性解释和词义范围。
