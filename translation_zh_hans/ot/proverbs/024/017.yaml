  text: Do not rejoice when your enemy falls[a], and do not let your heart exult when he stumbles,
translation:
  language: zh_hans
  text: 你的仇敌跌倒时，不要欢喜；他绊倒时，不要让你的心雀跃[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你的仇敌跌倒时，不要高兴；他绊倒时，不要让你的心欢喜。”希伯来文用了两个相关而有区别的喜乐词：שׂמח（“欢喜／高兴”）和 גיל（“雀跃／欢腾”）。
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּנְפֹל
  choice: ……跌倒时
  rationale: 介词 בְּ 与不定式连用，在此表达时间关系；译为“……时”自然准确，并保留 נפל“跌倒”的事件含义。
- source_word: אֹיְבֶיךָ
  choice: 你的仇敌
  rationale: 虽然该形式在字形上可能被理解为复数，但下一分句的第三人称单数后缀支持这里指单数的仇敌；“仇敌”符合箴言的庄重语体。
- source_word: אַל
  choice: 不要
  rationale: אַל 与未完成式连用表示禁止；现代汉语以“不要”表达最自然。
- source_word: תִּשְׂמָח
  choice: 欢喜
  rationale: שׂמח 表示高兴、欢喜；“欢喜”自然庄重，也与下一分句语气更强的“雀跃”形成区别。
- source_word: וּבִכָּשְׁלוֹ
  choice: 他失足时
  rationale: בְּ 在此同样表示时间；כשל 可指绊倒、失足。译作“失足”可保留其与前句 נפל“跌倒”的词义区别。
- source_word: יָגֵל
  choice: 雀跃
  rationale: גיל 常表达强烈、外显的欣喜；“雀跃”比一般的“欢喜”更有强化色彩，并避免将两个喜乐词扁平化为同一译法。
- source_word: לִבֶּךָ
  choice: 你的心
  rationale: לֵב 在智慧文学中指人的内在思想与情感；“你的心”保留希伯来语的人观意象，同时符合现代汉语表达。
