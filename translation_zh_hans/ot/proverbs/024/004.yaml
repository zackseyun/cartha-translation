  yaml_path: translation/ot/proverbs/024/004.yaml
  text: and by knowledge rooms are filled with all precious and pleasant wealth[a][b][c].
translation:
  language: zh_hans
  text: 又借着知识，各房间都充满各样宝贵、悦人的财物[a][b][c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “房间”或译“内室”。
    reason: lexical_alternative
  - marker: b
    text: “充满”或译“将充满”；希伯来语未完成式可以指将来，不过这里按箴言所陈述的一般真理来翻译。
    reason: lexical_alternative
  - marker: c
    text: 希伯来文直译为“一切财物，宝贵而悦人的”；正文按自然汉语译为“各样宝贵、悦人的财物”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְדַעַת
  choice: 又因知识
  rationale: 保留连接词 וּ 和介词 בְ 的工具性含义；“因知识”承接上一节，表达建造、坚立房屋所凭借的智慧与认识。
- source_word: חֲדָרִים
  choice: 各房间
  rationale: 该词指房屋中的房间或内室；“房间”是现代汉语中自然、清楚的表达。“各”依汉语语境补出复数含义。
- source_word: יִמָּלְאוּ
  choice: 充满
  rationale: 这是 מלא 的尼法勒未完成式。在箴言的普遍真理语境中，以一般现在意义译为“充满”，同时在脚注保留将来意义的可能。
- source_word: כָּל הוֹן
  choice: 各样……财物
  rationale: הוֹן 可指财富、资财或财物；房间被其充满的具体图景中，“财物”较自然。כָּל 与单数集合名词连用，译作“各样”能自然表达其涵盖性。
- source_word: יָקָר
  choice: 宝贵
  rationale: 准确表达价值高、珍贵之意，并保持智慧文学端庄凝练的语体。
- source_word: וְנָעִים
  choice: 悦人的
  rationale: 保留 נָעִים 所含令人愉悦、可喜爱的意义，不把它局限为金钱价值，也不强化为特定审美判断。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“又”使本节与上一节的房屋意象自然衔接；整体尽量保留希伯来文的工具性结构和房间被财物充满的具体画面。
