base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/005.yaml
  text: A wise man is strong[b][a], and a man of knowledge strengthens his might.
translation:
  language: zh_hans
  text: 有智慧的人大有力量[a]；有知识的人增添力量[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“有智慧的强者”或“有智慧的人处于力量之中”。希伯来语中“智慧的人”与“在力量中”的结构简练，可理解为修饰性或表语性表达；正文采用较清楚的表语性译法。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“使力量坚固”或“增加力量”。
    reason: lexical_alternative
lexical_decisions:
- source_word: גֶּבֶר
  choice: 人
  rationale: 该词可带有强健男子的意味，但本节由“智慧”界定此人；汉语箴言用“人”自然，也保留泛指作用。
- source_word: חָכָם
  choice: 智慧
  rationale: 在《箴言》中通常指道德与实践层面的智慧；与“人”组合为自然的“智慧人”。
- source_word: בַּעֹז
  choice: 大有力量
  rationale: 介词בְּ与名词עֹז构成简练而有歧义的表达，可作表语理解为“有力量”，也可能理解为修饰“人”；正文以自然的表语译法表达，同时以“大有”体现介词结构所强调的处境或特征。
- source_word: אִישׁ
  choice: 人
  rationale: 希伯来语为阳性单数的箴言式泛指；现代汉语以“人”表达最自然，不必额外加入性别信息。
- source_word: דַּעַת
  choice: 知识
  rationale: 直接对应智慧文学中有关认识、辨识的含义，并与“智慧”保持词义区别。
- source_word: מְאַמֶּץ
  choice: 增强
  rationale: 使役性动词分词表示使之强壮、加固或增加；“增强”既保留动态意义，也适合与“能力”搭配。
- source_word: כֹּחַ
  choice: 能力
  rationale: 可指力量、能力或实力；“能力”与前句的“力量”有所区分，同时保留个人行动资源与效能的广义。
theological_decisions:
- issue: 智慧与力量的关系
  choice: 不增补因果连词，只陈述智慧人与力量之间的对应关系
  alternative: 译成“智慧使人有力量”
  rationale: 原文是紧凑的名词性结构，并未明说因果；直陈可保留箴言本身的张力。
- issue: 第二分句的动词对象与主语关系
  choice: 译为“有知识的人增强能力”，不添加“自己的”
  alternative: “有知识的人增强自己的能力”或“知识使人力量增长”
  rationale: 原文כֹּחַ没有显式所有格，且מְאַמֵּץ可理解为“增强”或“不住增长”；不补所有格可避免过度限定。
translation_notes:
  register: 采用现代、庄重而简洁的箴言体。两个分句保持平行，以“力量／能力”区分עֹז与כֹּחַ；脚注保留第一分句句法以及第二分句动词理解上的真实歧义。
