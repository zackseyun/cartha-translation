base_translation:
  language: en
  yaml_path: translation/ot/proverbs/009/009.yaml
  text: Give to a wise man[a], and he will become wiser still; teach a righteous man[b], and he will add learning.
translation:
  language: zh_hans
  text: 把教诲给智慧人[a]，他会更有智慧；教导正直的人[b]，他的学识会增长。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“给智慧人”，没有说明所给的具体内容；译文按智慧训诲的语境补作“教诲”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文这里使用阳性单数形式；在《箴言》中，这种单数常用来代表某一类人。
    reason: cultural_note
lexical_decisions:
- source_word: תֵּן
  choice: 要给
  rationale: 保留נתן“给”的基本意义，也保留希伯来文未说明所给之物的简练表达；汉语用“要”体现命令或劝勉语气。
- source_word: לְחָכָם
  choice: 给有智慧的人
  rationale: חָכָם指有智慧的人；采用现代、自然的普通话表达，并保留箴言中代表一类人的单数形式。
- source_word: וְיֶחְכַּם עוֹד
  choice: 他就会更加有智慧
  rationale: חכם在此表示变得更有智慧，עוֹד表示进一步、更加；译文传达智慧继续增长的含义。
- source_word: הוֹדַע
  choice: 要教导
  rationale: ידע的使役命令式本义为“使知道”，在智慧训诲的语境中译作“教导”最自然。
- source_word: לְצַדִּיק
  choice: 义人
  rationale: צַדִּיק指行事正直、合乎公义的人；“义人”简洁庄重，也符合智慧文学用语。
- source_word: וְיוֹסֶף לֶקַח
  choice: 他就会增长学识
  rationale: יסף表示增加，לֶקַח在箴言中指所领受的教导、学问或学习所得；“增长学识”是自然汉语，并保留增益之意。
theological_decisions:
- issue: “有智慧的人”与“义人”的关系
  choice: 按平行句分别译出，不将两者解释为完全相同或彼此排斥的类别
  alternative: 将两者统一改写成同一种属灵身份
  rationale: 原文以平行结构并列智慧与公义，却没有明确界定两者的逻辑关系；译文应保留这种张力。
translation_notes:
  register: 采用现代、自然而庄重的普通话。“要给”有意保留原文省略宾语的简练结构，因此略带悬置感，并以脚注说明；两个分句保持整齐的训诲式平行。
