lexical_decisions:
- source_word: מַיִם
  choice: 水
  rationale: 该词虽为复数形态，却常作物质名词使用；现代汉语自然译为“水”。
- source_word: גְּנוּבִים
  choice: 偷来的
  rationale: 这是动词 גנב 的被动分词，指以偷窃方式取得；“偷来的”直接而自然。
- source_word: יִמְתָּקוּ
  choice: 甘甜
  rationale: 源自动词 מתק，意为“甘甜”；这里是一般性的状态陈述，不必按未完成式机械译成将来时。
- source_word: לֶחֶם
  choice: 饼
  rationale: לֶחֶם 可泛指食物，但此处保留具体食物意象，并与“水”构成平行；“饼”也符合古代近东主食的语境。
- source_word: סְתָרִים
  choice: 暗中吃的
  rationale: 该复数名词表达隐秘、暗处的观念。希伯来语结构高度凝练；结合“饼”的语境，译作“暗中吃的”能自然传达其惯用含义，但将较直译的可能性列入脚注。
- source_word: יִנְעָם
  choice: 可口
  rationale: 源自动词 נעם，意为“令人愉悦、可喜”；用于食物时，“可口”自然地保留感官享受之意，并与“甘甜”呼应。
theological_decisions:
- issue: “偷来的水”和“暗中吃的饼”所指的罪中诱惑
  choice: 保留箴言中愚昧妇人的比喻性诱语，不在正文中明确限定为奸淫或其他特定罪行。
  alternative: 把意象解释性译成“偷情”或“禁果”等明确所指。
  rationale: 本节本身使用水和饼的隐喻，其具体所指要由上下文推知；直陈某一种解释会消除原文的形象与张力。
translation_notes:
  register: 采用简洁、对称的箴言体。“甘甜／可口”形成自然平行；“偷来的／暗中吃的”保留禁忌事物因隐秘而显得诱人的修辞张力。
