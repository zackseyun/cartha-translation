  text: תְּחִלַּ֣ת חָ֭כְמָה יִרְאַ֣ת יְהוָ֑ה וְ/דַ֖עַת קְדֹשִׁ֣ים בִּינָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/009/010.yaml
  text: The beginning of wisdom is the fear of Yahweh[a], and the knowledge of the Holy One is understanding.
translation:
  language: zh_hans
  text: 敬畏雅威，是智慧的开端；认识至圣者[a]，就是明辨。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文作复数，可直译为“众圣者”。这里通常理解为以复数形式指上帝，因此正文译作“至圣者”。
    reason: 保留原文复数形式及其可能造成的不同理解。
lexical_decisions:
- source_word: תְּחִלַּת
  choice: 开端
  rationale: 该词为构造形式，在这里指智慧的起点或根基。“开端”既贴近原文，又不把其含义过度解释为“首要原则”。
- source_word: חָכְמָה
  choice: 智慧
  rationale: 这是《箴言》中贯穿全书的核心用语，包括道德、实践和属灵层面的智慧；“智慧”是现代汉语中最自然且涵盖面合宜的对应词。
- source_word: יִרְאַת
  choice: 敬畏
  rationale: “敬畏”同时保留尊崇与畏惧的意味，适合表达该智慧传统中的关键短语；单译为“尊敬”会削弱原文的张力。
- source_word: יְהוָה
  choice: 雅威
  rationale: 采用上帝圣名四字母词的音译，不以“主”这一称号代替其专名。
- source_word: וְדַעַת
  choice: 认识
  rationale: 这里的名词表示对随后对象的认识或知识。“认识”比“知识”更自然地表达对圣者的认知，并与前半句构成平行。
- source_word: קְדֹשִׁים
  choice: 圣者
  rationale: 希伯来文在形态上是复数，但上下文与“雅威”形成同义平行，通常指向上帝。汉语主文译作“圣者”，并以脚注保留原文复数这一真实歧义。
- source_word: בִּינָה
  choice: 明辨
  rationale: 该词在《箴言》中表示理解、洞察和辨别能力。“明辨”能体现其智慧语境中的辨识意味，并保留后半句的名词判断结构。
theological_decisions:
- issue: קְדֹשִׁים 的所指
  choice: 按单数的神圣所指译为“圣者”
  alternative: 按形态复数译为“众圣者”或“圣者们”
  rationale: 本节两行呈平行结构，“敬畏雅威”与“认识圣者”彼此对应，因此第二行最可能仍指上帝。不过，原词确为复数形式，可能产生其他理解，故不在脚注中抹去这一张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“敬畏”保留尊崇与畏惧并存的语义；用分号呈现希伯来诗歌的两行平行结构。脚注标记置于实际涉及歧义的“圣者”之后。
