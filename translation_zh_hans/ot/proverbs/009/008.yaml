  yaml_path: translation/ot/proverbs/009/008.yaml
  text: Do not rebuke a scoffer[a], lest he hate you; rebuke a wise man[b], and he will love you.
translation:
  language: zh_hans
  text: 不要责备嘲讽者[a]，免得他恨你；要责备智慧人[b]，他必爱你。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“讥诮者”。希伯来语לֵץ指以傲慢、轻蔑的态度嘲弄别人的人。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语为阳性单数“智慧人”，在《箴言》中代表这一类人。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל
  choice: 不要
  rationale: אַל与未完成式连用构成禁令；“不要”自然准确，不额外加强语气。
- source_word: תּוֹכַח / הוֹכַח（יכח）
  choice: 责备
  rationale: יכח在智慧文学中指以言语指出错误、加以规劝；“责备”保留了原文较强的劝诫力度，并适合两处平行用法。
- source_word: לֵץ
  choice: 嘲讽者
  rationale: לֵץ在《箴言》中不是偶尔开玩笑的人，而是以傲慢、轻蔑态度讥诮他人的人；“嘲讽者”在现代汉语中较自然，也保留其道德特征。
- source_word: פֶּן
  choice: 免得
  rationale: פֶּן引出应当避免的负面后果；“免得”简洁地表达警戒关系。
- source_word: יִשְׂנָאֶךָּ
  choice: 他恨你
  rationale: פֶּן之后的未完成式表示可能出现、应当避免的后果；汉语“免得他恨你”自然体现这一关系。
- source_word: לְחָכָם
  choice: 智慧人
  rationale: 原文为阳性单数，描写一种代表性人物类型。“智慧人”是现代中文圣经智慧文学中自然、庄重的类型称谓，且不必在正文中额外加入原文没有的性别限定。
- source_word: וְיֶאֱהָבֶךָּ
  choice: 他必爱你
  rationale: 未完成式在命令之后表示预期结果；“必”自然传达与前句相对的结果性，但不是把它解释成无条件的神学应许。
theological_decisions:
- issue: 智慧教训中的阳性单数
  choice: 智慧人
  alternative: 有智慧的男人；有智慧的人
  rationale: 希伯来语采用阳性单数作为箴言中代表性的人物类型。中文不必机械加入“男人”；“智慧人”既保留单数类型称谓，也让上下文的普遍适用性自然呈现。
- issue: “他必爱你”的结果力度
  choice: 保留为预期而鲜明的箴言式结果
  alternative: 他就会爱你；他可能会爱你
  rationale: 原文未完成式与连接词构成对命令的预期回应。译作“必”保留箴言对比的力度，同时不将格言体误读为排除一切例外的绝对应许。
translation_notes:
  register: 采用现代、庄重而易懂的箴言体。两次重复“责备”，以保留希伯来文的平行和鲜明对比；分号划分相反的两种回应。
