  yaml_path: translation/ot/proverbs/009/016.yaml
  text: Whoever is simple[a], let him turn in here! And to him who lacks sense she says,
translation:
  language: zh_hans
  text: “谁是愚蒙人，就转到这里来吧！”她对缺乏见识的人[a]说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“缺少心”。在《箴言》中，“心”常指理解力、判断力或内在的明辨能力。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי פֶתִי
  choice: 谁是愚蒙人
  rationale: מִי与פֶתִי连用，在此引出面向某一类人的普遍呼召。“愚蒙人”保留《箴言》中易受诱惑、尚未形成明辨能力之人的智慧文学范畴，并不单指智力低下。
- source_word: יָסֻר הֵנָּה
  choice: 就转到这里来吧
  rationale: יָסֻר在这里具有劝令或招呼语气，הֵנָּה指说话者所在之处。“转到这里来吧”既保留“转向、转入”的方向感，也自然表达邀请。
- source_word: חֲסַר לֵב
  choice: 缺乏见识的人
  rationale: 该希伯来语习语字面为“缺少心”，其中“心”指理解力、判断力和内在明辨能力。“缺乏见识”传达其语境含义，同时以脚注保留原文意象。
- source_word: וְאָמְרָה לוֹ
  choice: 她又对……说
  rationale: 阴性动词承接上下文中的愚昧妇人；“又”体现连接成分וְ，句末用冒号承接下一节的直接引语。
theological_decisions: []
