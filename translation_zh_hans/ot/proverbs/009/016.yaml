  register: 采用现代、庄重而易懂的普通话。“愚蒙人”保留《箴言》的传统智慧文学用语；后半句采用较自然的“缺乏见识”，并用脚注说明希伯来语“心”的意象。句末冒号保留本节作为下一节引语导语的未完结构。
