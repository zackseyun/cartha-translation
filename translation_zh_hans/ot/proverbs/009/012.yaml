  text: אִם חָ֭כַמְתָּ חָכַ֣מְתָּ לָּ֑/ךְ וְ֝/לַ֗צְתָּ לְֽ/בַדְּ/ךָ֥ תִשָּֽׂא־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/009/012.yaml
  text: If you are wise[a], you are wise for yourself; if you scoff, you alone will bear it.
translation:
  language: zh_hans
  text: 你若有智慧，是你自己受益；你若讥诮，必独自承担。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “承担”原文没有说明所承担的是什么；也可译作“必独自承担后果”。
    reason: 说明原文省略了承担的对象，并提供较明确的译法。
lexical_decisions:
- source_word: אִם
  choice: 若
  rationale: 保留希伯来语的条件意味，不将其强化为必然发生的“当……时”。
- source_word: חָכַמְתָּ חָכַמְתָּ לָּךְ
  choice: 你若有智慧，是你自己受益
  rationale: 前一个“有智慧”表达原文的状态，后半句把 לָּךְ 所含的个人受益之意自然地传达出来；中文若机械重复“有智慧”，会显得生硬。
- source_word: וְלַצְתָּ
  choice: 你若讥诮
  rationale: “讥诮”表达 לוץ 所指带有傲慢意味的嘲弄，也符合《箴言》的庄重语体，并保留动词形式。
- source_word: לְבַדְּךָ
  choice: 独自
  rationale: 准确表达“单独、只有你自己”的意思，突出个人独自承受的责任。
- source_word: תִשָּׂא
  choice: 承担
  rationale: 原词意为背负、承担，且原文没有明说宾语；中文可用不带宾语的“承担”保留这种省略和含蓄。
theological_decisions:
- issue: 智慧与讥诮行为所带来的个人结果
  choice: 译为“是你自己受益”与“必独自承担”，强调结果落在行为者本人身上
  alternative: 将后半句明确译为“必独自承担后果”
  rationale: 原文形成个人受益与个人承担的对照，但没有明说承担的对象；正文不补出“后果”，以免消除原文的含蓄。
translation_notes:
  register: 采用现代、简洁而庄重的箴言语体。“讥诮”比口语化的“嘲笑”更能传达智慧文学中傲慢轻蔑的意味；“承担”有意不补宾语，以保存原文的开放性。
