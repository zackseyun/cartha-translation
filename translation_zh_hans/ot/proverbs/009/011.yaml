  text: For by me your days will be multiplied[a], and years of life will be added to you.
translation:
  language: zh_hans
  text: 因为借着我[a]，你的日子必增多；你的生命年数也必增添。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“在我里面”或“因我”；这里的希伯来语介词可表达几种彼此相近的关系，但上下文较支持凭借、途径之意，即智慧使人的寿数得以延长。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 引出本节对前文劝诫所作的理由说明；现代汉语用“因为”自然清楚。
- source_word: בִי
  choice: 借着我
  rationale: בְּ 加第一人称单数后缀在此最可能表示凭借或途径，智慧仍以人格化的第一人称说话；“借着我”既自然，也保留工具性含义。
- source_word: יִרְבּוּ
  choice: 必增多
  rationale: רבה 表示变多、增加；以“你的日子”为主语译作“必增多”，保留希伯来文以日子指寿数的意象。
- source_word: יָמֶיךָ
  choice: 你的日子
  rationale: 直译并保留希伯来文用“日子”表达一生年日或寿数的惯用意象，在中文中也可理解。
- source_word: וְיוֹסִיפוּ לְךָ
  choice: 也必给你加添
  rationale: 希伯来文为第三人称复数使役形，未明说施事者；中文省略主语可自然保留这种不确定性，并表达年岁加给受益者。
- source_word: שְׁנוֹת חַיִּים
  choice: 生命的年岁
  rationale: 对应“生命之年”，兼顾原文结构与庄重自然的中文表达，指人在世生活的年数。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留“日子”与“生命的年岁”的平行表达，并以“必”体现箴言式的确定语气；不补出原文未明说的施事者。
