  text: and sits at the doorway of her house[a], on a seat at the heights of the city,
translation:
  language: zh_hans
  text: 她坐在自家门口，在城中高处的座位[a]上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “座位”或译“宝座”。希伯来语 כִּסֵּא 可指普通座位，也可指宝座；本段上下文不一定含有王权意味，所以正文采用“座位”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָשְׁבָה
  choice: 她坐
  rationale: 此处是对“愚昧妇人”持续而鲜明的描写；用现代汉语现在时态的“坐”自然表达这种场景，不必拘泥于希伯来语完成式的形式。
- source_word: לְפֶתַח
  choice: 在……门口
  rationale: פֶּתַח指入口或门洞；“门口”具体、自然，符合现代汉语习惯。
- source_word: בֵּיתָהּ
  choice: 自家
  rationale: 指她自己的房屋；“自家门口”比“她的房屋的入口”更自然，同时保留所属关系和实体地点。
- source_word: כִּסֵּא
  choice: 座位
  rationale: כִּסֵּא可指座位、椅子或宝座。上下文强调她公开坐在那里，并未明确要求王权意象，因此正文采用中性的“座位”。
- source_word: מְרֹמֵי
  choice: 高处
  rationale: 该复数构造形式表示高地或高处；“城中高处”既保留空间高度，也传达醒目、公开的位置。
- source_word: קָרֶת
  choice: 城中
  rationale: קָרֶת意为城或城邑；译作“城中”可自然地与“高处”组合，并呈现公共城市空间。
