revisions:
- from: 你们要离开愚蒙人[a]，就得以存活；要在明智的道路上前行。
  to: 离开愚蒙[a]，就能存活；要走在明辨的道路上。
  rationale: 修订正文以避免“离开愚蒙人”在现代汉语中的误导性，同时以脚注保留原文的字面宾语与可争议的语境范围。将“明智”改为“明辨”，更贴近 בִּינָה 的智慧文学含义。保留“就能存活”所表达的连贯结果关系；这不把“存活”限定为任何特定神学意义。
