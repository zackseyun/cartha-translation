base_translation:
  language: en
  yaml_path: translation/ot/proverbs/009/006.yaml
  text: Leave the simple[a], and live; and walk in the way of understanding.
translation:
  language: zh_hans
  text: 离开愚蒙[a]，就能存活；要走在明辨的道路上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译“离开愚蒙人”。此处也可指离开愚蒙人的圈子，或摆脱愚蒙的状态。
    reason: 说明原文复数名词的字面意义及其在上下文中的语境歧义，避免将命令误解为单纯抛弃某些人。
lexical_decisions:
- source_word: עִזְבוּ
  choice: 离开
  rationale: 这是复数命令式，要求听众作出明确的离弃；“离开”自然、直接，也能与其宾语“愚蒙人”搭配。
- source_word: פְתָאיִם
  choice: 愚蒙人
  rationale: 原文是复数名词，直指缺乏判断、容易受诱惑的人。“愚蒙人”保留《箴言》中的智慧文学色彩；正文不擅自补出“行为”或“生活方式”，脚注则说明语境中可能包含离开愚蒙状态或群体的含义。
- source_word: וִחְיוּ
  choice: 就得以存活
  rationale: 原文为与前句并列的复数命令式“并且活”；汉语用“就得以存活”自然表达离开愚蒙与获得生命之间的结果关系，同时保留简洁的劝诫力度。
- source_word: וְאִשְׁרוּ
  choice: 要……前行
  rationale: 该动词在路径语境中有径直行进、向前迈进之意。“前行”既保留道路意象，也可自然指人的生活与行为方向。
- source_word: בְּדֶרֶךְ
  choice: 在……道路上
  rationale: 保留原文的道路隐喻，既可理解为空间路径，也可指生活方式。
- source_word: בִּינָה
  choice: 明智
  rationale: 该词在《箴言》中表示具有辨别力的理解或洞察。“明智的道路”是自然现代汉语，并保留其智慧文学含义。
theological_decisions:
- issue: “存活”是第二个命令，还是离开愚蒙的结果
  choice: 译作“就得以存活”，表达自然的结果关联
  alternative: “并且要活着”
  rationale: 希伯来文形式上是并列命令式，但连续命令式可带结果意味。译文承认这种语境关系，却不把“生命”进一步限定为肉身长寿或属灵永生。
- issue: פְתָאיִם 指人还是愚蒙状态
  choice: 正文保留字面的“愚蒙人”
  alternative: “愚蒙”或“愚蒙的生活方式”
  rationale: 马所拉文本直接使用复数名词“愚蒙人”。虽然上下文可能意指离开愚蒙人的群体或摆脱自身的愚蒙状态，但正文不应无标记地添加原文没有的“方式”。
translation_notes:
  register: 采用现代、庄重而易懂的劝诫语气。“愚蒙人”承接《箴言》的核心人物类型；分号呈现两组紧密相关的命令。“前行”比单纯“行走”更能体现原动词径直向前的动态含义。
