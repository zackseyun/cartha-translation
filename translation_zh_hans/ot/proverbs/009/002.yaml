  yaml_path: translation/ot/proverbs/009/002.yaml
  text: She has slaughtered her meat[a]; she has mixed her wine[b]; she has also set her table.
translation:
  language: zh_hans
  text: 她宰杀了她的牲畜[a]，调好了她的酒[b]，也布置好了她的桌子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“她所宰杀的动物”。希伯来语名词指为宴席宰杀的动物，亦可指由此预备的肉食。
    reason: lexical_alternative
  - marker: b
    text: 指按当时宴饮习俗调制酒，可能掺水或加入香料。
    reason: cultural_note
lexical_decisions:
- source_word: טָבְחָה טִבְחָהּ
  choice: 宰杀了牲畜，备好肉食
  rationale: 动词טבח具体指为宴席宰杀牲畜，名词טבח指宰杀后所得的肉食或宴席食材。此译保留宰杀这一具体动作，同时以“备好肉食”自然表达其结果，避免把名词泛化为整个宴席。
- source_word: מָסְכָה יֵינָהּ
  choice: 调好了酒
  rationale: מסך在此指按宴饮习俗把酒调制好，可能掺水或加入香料。“调好了酒”既反映混调之意，也符合现代汉语表达。
- source_word: אַף
  choice: 也
  rationale: 此词在这里累加第三项已经完成的宴席准备工作，用“也”简洁自然。
- source_word: עָרְכָה שֻׁלְחָנָהּ
  choice: 摆好了筵席
  rationale: ערך表示排列、布置；שֻׁלְחָן字面是桌子，但在此宴饮语境中指摆设食物的席面。“摆好了筵席”比“摆好了桌子”更自然，并保留宴席已经布置妥当的具体图景。
theological_decisions:
- issue: 智慧诗中阴性单数主语的拟人表达
  choice: 以“她”直接承接上下文中的拟人化智慧，不在本节重复添加“智慧”作为解释
  alternative: 译作“智慧宰杀了牲畜……”
  rationale: 希伯来语动词和附着代词均为阴性单数，直接用“她”可保存拟人手法；其所指由紧邻上下文清楚界定，无须在正文中加入解释性称谓，也不作超出文本的神学认定。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。三个并列分句以“宰杀／调好／摆好”呈现宴席准备的递进；首句略作结果性展开，以避免现代读者误解为只强调屠宰而未涉及备餐。所有脚注标记均已置于正文相应位置。
