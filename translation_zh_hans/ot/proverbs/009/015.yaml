  yaml_path: translation/ot/proverbs/009/015.yaml
  text: 'to call to those passing by on the road[a], who are going straight on their paths:'
translation:
  language: zh_hans
  text: 向路上经过的人呼喊，就是那些径直走在自己路上的人[a]：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“使自己的道路平直的人。”希伯来语分词既可侧重径直前行，也可表示使自己的道路平直。
    reason: lexical_alternative
lexical_decisions:
- source_word: לִקְרֹא
  choice: 招呼
  rationale: 该不定式承接上下文，表示目的；“招呼”保留公开向路人发声的含义，又不强化为正式的“召集”或“传唤”。
- source_word: לְעֹבְרֵי דָרֶךְ
  choice: 路过的行人
  rationale: 保留עבר分词所表达的正在经过之意，也自然呈现道路上的行旅图景。
- source_word: דָרֶךְ
  choice: 路（体现在“路过”中）
  rationale: 此处指行人经过的道路；汉语用“路过的行人”可简洁而自然地表达整个短语。
- source_word: הַמְיַשְּׁרִים
  choice: 径直走
  rationale: 该分词与“自己的道路”连用，既可描述径直前行，也可能表示使道路正直；正文采用自然的行进义，并以脚注保留另一种理解。
- source_word: אֹרְחוֹתָם
  choice: 自己的道路
  rationale: 该词可指实际路径，也可带有智慧文学中人生道路的隐喻意味；“自己的道路”同时保留这两层可能。
theological_decisions:
- issue: הַמְיַשְּׁרִים אֹרְחוֹתָם 的语义指向
  choice: 正文译作“径直走自己道路的人”
  alternative: “修直自己道路的人”
  rationale: 希伯来语分词可着重于径直前行，也可理解为使自己的路径正直。正文不把这里明确道德化，脚注则保留使役性的可能。
translation_notes:
  register: 采用现代、庄重而自然的普通话。“路过的行人”避免生硬直译，“径直走自己道路”保留旅行图景及其可能的人生道路隐喻；冒号承接下一节的呼语。
