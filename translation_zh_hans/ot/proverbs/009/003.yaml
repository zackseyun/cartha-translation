  yaml_path: translation/ot/proverbs/009/003.yaml
  text: 'She has sent out her young women[b][a]; she calls from the heights of the city:'
translation:
  language: zh_hans
  text: 她已派出她的年轻女子[a]；她在城的高处[b]呼喊：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“她的侍女”。希伯来语指年轻女子；在此上下文中可能指智慧所差遣的女侍从，但该词本身并未明确其社会身份。
    reason: lexical_alternative
  - marker: b
    text: 直译可作“在城的高处上”。原文连续使用两个相关的“高处”词，强调位置的高峻和显眼。
    reason: literal_rendering
lexical_decisions:
- source_word: שָׁלְחָה
  choice: 已差遣……出去
  rationale: 这是Qal完成式第三人称阴性单数，以拟人化的智慧为主语；“已……出去”表达邀请前已经完成的差派行动。
- source_word: נַעֲרֹתֶיהָ
  choice: 自己的少女
  rationale: 该词首先表示年轻女性；“少女”保留年龄和性别含义，不把上下文可能暗示的侍女身份写死。“自己的”自然表达第三人称阴性单数所属后缀。
- source_word: תִקְרָא
  choice: 呼喊
  rationale: 该动词在此表示公开出声召唤；“呼喊”比单纯的“呼叫”更自然地呈现从高处向公众发声的场景，同时不额外赋予宣告等专门含义。
- source_word: עַל
  choice: 在……上
  rationale: 保留介词表示所在位置的基本意义，而不是将其解释性地译作“从”。
- source_word: גַּפֵּי מְרֹמֵי
  choice: 高处的顶上
  rationale: 两个相连的高度词均予体现：גַּפֵּי指高处的顶端或极处，מְרֹמֵי指城中的高处；这样避免把二者压缩成一个“高处”。
- source_word: קָרֶת
  choice: 城中
  rationale: 这是“城”的诗体词；结合汉语地点表达译为“城中”，表示这些高处属于城内或城市范围。
