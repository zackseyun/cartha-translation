id: PRO.9.18
reference: Proverbs 9:18
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְֽ/לֹא יָ֭דַע כִּֽי רְפָאִ֣ים שָׁ֑ם בְּ/עִמְקֵ֖י שְׁא֣וֹל קְרֻאֶֽי/הָ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/009/018.yaml
  text: But he does not know that the dead are there[a], that her guests are in the depths of Sheol.
translation:
  language: zh_hans
  text: 但他不知道，死人[a]就在那里；她的宾客在阴间的深处。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“亡魂”。希伯来语רְפָאִים在这里指阴间里的死者。
    reason: 词义备选
lexical_decisions:
- source_word: וְלֹא
  choice: 但……不
  rationale: 这里与上文受诱惑者所见的表象形成鲜明转折；“但”自然体现逆接语气。
- source_word: יָדַע
  choice: 他不知道
  rationale: 此处完成式描述当前的无知状态，现代汉语用“他不知道”最自然。
- source_word: כִּי
  choice: （引出“不知道”的内容）
  rationale: 作为内容连接词，汉语无需逐字另译，可直接接宾语分句。
- source_word: רְפָאִים
  choice: 死人
  rationale: 在智慧文学语境中指身处阴间的死者，并非利乏音族；“死人”清楚易懂，脚注保留“亡魂”这一词义色彩。
- source_word: שָׁם
  choice: 就在那里
  rationale: 指向愚昧妇人的所在及其背后真实的死亡归宿；“就”加强揭露真相的语气，但不改变方位意义。
- source_word: בְּעִמְקֵי
  choice: 在……的深处
  rationale: 保留原文向下、幽深之地的空间意象，同时符合现代汉语表达。
- source_word: שְׁאוֹל
  choice: 阴间
  rationale: 指死者所在之境；“阴间”是简体中文圣经语境中清楚而庄重的对应词，也避免译成“地狱”而加入后期教义上的特定含义。
- source_word: קְרֻאֶיהָ
  choice: 她的宾客
  rationale: 该词本义为“她所邀请的人”；结合宴席邀请的上下文，“宾客”简洁自然，并保留受邀者的意象。
theological_decisions:
- issue: שְׁאוֹל 的译法
  choice: 阴间
  alternative: 坟墓／死人之境／地狱
  rationale: 原词表示死者所在的幽冥之境。“阴间”既保留这一概念，又不把它窄化为坟墓，也不等同于带有更具体末世刑罚含义的“地狱”。
- issue: רְפָאִים 的所指
  choice: 死人
  alternative: 亡魂／阴魂／利乏音人
  rationale: 此处平行于“阴间的深处”，所指是已经死去的人，而不是古代族群。正文采用通俗明确的“死人”，脚注提示原词也可表达为“亡魂”，以保留其幽冥色彩。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“但”呈现与上文的强烈反差；分号保留两个内容分句的平行关系。“阴间”沿用中文中对死者之境的自然称呼，不译为神学含义更特定的“地狱”。
