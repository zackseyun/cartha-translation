base_translation:
  language: en
  yaml_path: translation/ot/proverbs/009/013.yaml
  text: The woman Folly is loud[a]; she is simple and knows nothing.
translation:
  language: zh_hans
  text: 愚昧妇人喧嚷不休；她愚蒙，什么也不懂。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文更直译为“她不知道什么”。
    reason: 保留原文 יָדְעָה מָּה 的字面措辞及其略显突兀的表达。
lexical_decisions:
- source_word: אֵשֶׁת כְּסִילוּת
  choice: 愚昧妇人
  rationale: 原文是“愚昧的妇人”这一结构；在箴言第9章中，愚昧被拟人化为妇人。译作“愚昧妇人”既保留女性拟人，也与现代汉语表达相合，而不额外加入原文没有的尊称。
- source_word: הֹמִיָּה
  choice: 喧嚷不休
  rationale: 该词表示喧闹、骚动或吵嚷。“喧嚷不休”自然地表现她招摇而嘈杂的特征，同时避免仅以“声音大”弱化其贬义色彩。
- source_word: פְּתַיּוּת
  choice: 蒙昧无知
  rationale: 此处为表示单纯、轻信、缺乏判断力的抽象名词，用来断言这妇人的性质。译为“蒙昧无知”可在自然汉语中表达其缺乏见识和判断的状态；其后一句进一步强调她一无所知。
- source_word: וּבַל
  choice: ，
  rationale: 原文的连接词加否定词承接下一个谓语。汉语以分句间的顺接标点自然呈现这种累加关系，无需强加“却”或“然而”的转折。
- source_word: יָדְעָה מָּה
  choice: 什么也不懂
  rationale: 原文直译为“不知道什么”，在此构成强调无知的说法。“什么也不懂”是自然、清楚的现代汉语；脚注保留原文较突兀的字面形式。
