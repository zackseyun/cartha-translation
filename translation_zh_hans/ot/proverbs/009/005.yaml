  text: לְ֭כוּ לַחֲמ֣וּ בְֽ/לַחֲמִ֑/י וּ֝/שְׁת֗וּ בְּ/יַ֣יִן מָסָֽכְתִּי׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/009/005.yaml
  text: Come[a], eat of my bread[b], and drink of the wine I have mixed.
translation:
  language: zh_hans
  text: “来[a]，吃我的饼，喝我调和的酒[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “来”直译为“去”或“走”；在这里的邀请语境中，意思是招呼人前来赴席。
    reason: lexical_alternative
  - marker: b
    text: 或译“我调制的酒”。原文动词指把酒调和，可能掺入水或香料。
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכוּ
  choice: 来
  rationale: 该动词字面义为“去、行走”，但在智慧设宴并向人发出邀请的语境中，用现代汉语“来”最自然地传达召唤语气；脚注保留其字面方向含义。
- source_word: לַחֲמוּ
  choice: 吃
  rationale: 此处 לחם 为“吃”，与后面的“喝”平行，并以“我的饼”为对象。
- source_word: בְלַחֲמִי
  choice: 我的饼
  rationale: 介词 ב 在此随“吃”表示取食的对象；现代汉语直接说“吃我的饼”自然明确，也保留智慧所备食物的具体意象。
- source_word: וּשְׁתוּ
  choice: 喝
  rationale: 译作简明的命令式，与前面的“吃”形成整齐平行。
- source_word: בְּיַיִן
  choice: 酒
  rationale: 介词 ב 随“喝”表示饮用的对象，汉语无需另译介词。
- source_word: מָסָכְתִּי
  choice: 我调和的
  rationale: 该动词特指将酒调制、混合，可能掺水或香料；“调和”比宽泛的“预备”更贴近词义，又不武断限定具体配料。
theological_decisions:
- issue: 智慧邀请中的筵席意象
  choice: 保留饼和调和之酒的具体筵席意象，不在正文中加以寓意化。
  alternative: 将饼和酒明确解释为圣礼象征，或直接改写成对教训、知识的泛指。
  rationale: 希伯来文本把智慧人格化为设宴邀请人的主人。译文应呈现文本明说的具体图景，同时不把可能的神学联想固定为某一教义解释。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。以“来，吃……喝……”保留邀请语气和两分句的诗歌平行；“饼”和“酒”保持具体筵席意象。
