  yaml_path: translation/ot/proverbs/009/001.yaml
  text: Wisdom has built her house[a]; she has hewn out her seven pillars.
translation:
  language: zh_hans
  text: 智慧建造了她的房屋[a]，凿出了七根柱子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “智慧”所对应的希伯来词在形式上是复数，但这里搭配阴性单数动词，作为拟人化的单数使用。
    reason: lexical_alternative
lexical_decisions:
- source_word: חָכְמוֹת
  choice: 智慧
  rationale: 该词虽为复数形式，但本节搭配阴性单数动词，并以拟人化的单数主体出现；汉语用“智慧”可自然保留这一拟人意象，不必增添“智慧女士”等解释性称谓。
- source_word: בָּנְתָה
  choice: 建造了
  rationale: 完成式表明建造行动已经完成；“建造了”在现代汉语中准确、自然。
- source_word: בֵיתָהּ
  choice: 自己的房屋
  rationale: 原词首先指实体房屋，且后文的“柱子”延续建筑意象。汉语用“自己的”清楚回指拟人化的“智慧”，避免使用性别代词时可能造成的突兀。
- source_word: חָצְבָה
  choice: 凿出了
  rationale: 该动词常指凿石或从石中开凿；“凿出了”保留具体而有力度的建筑图景。
- source_word: עַמּוּדֶיהָ
  choice: 柱子
  rationale: “柱子”是现代汉语中自然、明确的建筑用语；所属关系在同一句的连续动作中已清楚，无须机械重复“自己的”。
- source_word: שִׁבְעָה
  choice: 七根
  rationale: 直译数词，并按汉语习惯为柱子配量词“根”；不在正文中额外解释七可能具有的完整象征意义。
theological_decisions:
- issue: 智慧的拟人化
  choice: 将חָכְמוֹת译作单数、拟人化的“智慧”，并用“自己的”表达阴性所属关系。
  alternative: 译作“智慧女士”或“智慧妇人”。
  rationale: 希伯来文借阴性单数动词和后缀将智慧人格化，但本节没有明说“女士”或“妇人”。正文保留拟人化而不增添身份称谓，可避免导入额外解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。句式简洁，保留希伯来诗句中连续的建筑意象；用“凿出了”体现石材加工的具体动作。
