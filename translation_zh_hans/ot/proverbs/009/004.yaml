  yaml_path: translation/ot/proverbs/009/004.yaml
  text: Whoever is simple[a], let him turn in here! To him who lacks sense she says,
translation:
  language: zh_hans
  text: “凡是愚蒙人，都转到这里来！”她对缺乏判断力的人[a]说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译为“缺少心”。在希伯来语习语中，“心”常指理解力或判断力。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי
  choice: 谁是
  rationale: 与后面的身份描述连用，引出泛指的受邀者；中文“谁是……的”既自然，也保留原文的问句式邀请。
- source_word: פֶתִי
  choice: 无知的
  rationale: 在《箴言》中指缺乏阅历、容易受诱导的人，并非单指智力低下；“无知的”是现代中文智慧文学中较自然且不过度释义的表达。
- source_word: יָסֻר
  choice: 可以转到
  rationale: 该形式在这里表达邀请或劝请；“转到”保留从原来路径转向说话者所在之处的方向意味。
- source_word: הֵנָּה
  choice: 这里来
  rationale: 直接指向说话者所在之处；与“转到”组合成自然的现代汉语邀请。
- source_word: חֲסַר לֵב
  choice: 缺少判断力的人
  rationale: 该希伯来语习语直译为“缺少心”，其中“心”指理解、辨别和判断的能力；正文采用意译以避免现代中文读者误解为情感或器官上的缺失。
- source_word: אָמְרָה
  choice: 她……说
  rationale: 阴性单数形式承接拟人化的智慧；采用中文叙事中自然的“说”，不强行标示希伯来语完成式的时态。
- source_word: לּוֹ
  choice: 对那……的人
  rationale: 回指前面的泛指单数对象；中文以“那……的人”自然表达间接宾语关系，而不额外强化性别。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而清楚的普通话。保留智慧发出的直接邀请及两行之间的承接关系；“无知”按《箴言》的智慧文学范畴理解，不译成带智力贬损意味的称呼。末尾冒号表明本节引出下一节的直接话语。
