  yaml_path: translation/ot/proverbs/009/007.yaml
  text: Whoever corrects a scoffer gets dishonor for himself[c][b][a], and whoever rebukes a wicked man gets a blemish for himself.
translation:
  language: zh_hans
  text: 纠正嘲讽者的，自取羞辱；责备恶人的，招来污点。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “污点”原文为“他的污点”；代词的所指可理解为责备者，也可能与恶人有关。整句也可能指责备者因此遭受恶人的辱骂或给自己招来污名。
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹסֵר
  choice: 纠正……的
  rationale: 该分词表达普遍原则；“纠正”适合此处与言语劝诫有关的智慧文学语境，又不过度强调惩戒。
- source_word: לֵץ
  choice: 嘲讽者
  rationale: 该词在《箴言》中指傲慢、轻蔑并拒绝智慧的人；“嘲讽者”保留其讥诮意味，也符合现代汉语。
- source_word: לֹקֵחַ לוֹ
  choice: 自取
  rationale: 简洁表达“为自己招致、承受”的反身含义，并与箴言凝练的句式相称。
- source_word: קָלוֹן
  choice: 羞辱
  rationale: 该词侧重公开蒙羞、受辱，不仅是内心羞愧；“羞辱”在此自然明确。
- source_word: וּמוֹכִיחַ
  choice: 责备……的
  rationale: 该使役分词常指指出过错、斥责；“责备”比前句“纠正”语气更强，保留平行中的细微变化。
- source_word: לְרָשָׁע
  choice: 恶人
  rationale: 阳性单数在这里作泛称；现代汉语“恶人”自然保留单数类别称谓，无须另加性别说明。
- source_word: מוּמוֹ
  choice: 他的污点
  rationale: מוּם本义为瑕疵、污点，且第三人称单数后缀最自然地可指紧邻的“恶人”。正文保留这种紧凑且真实存在歧义的表达，不擅自改写成单义的“自取污名”；脚注说明其他可能理解。
theological_decisions:
- issue: מוּמוֹ中代词后缀的所指及隐喻意义
  choice: 正文译作“他的污点”，保留后缀可能回指恶人的理解
  alternative: “给自己招来污名”或“遭受他的辱骂”
  rationale: 希伯来文结构紧凑，既可能指责备者沾染恶人的“污点”，也可能隐喻从恶人那里受到辱骂或污名。此处不是需要教义性消解的问题，应保留语义张力并以脚注交代。
translation_notes:
  register: 采用凝练、对称的现代书面汉语，贴合箴言体裁。“纠正／责备”、“嘲讽者／恶人”、“羞辱／污点”形成平行而不机械重复。脚注标记紧接相关短语。
