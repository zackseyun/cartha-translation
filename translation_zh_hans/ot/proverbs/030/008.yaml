  text: שָׁ֤וְא וּֽ/דְבַר כָּזָ֡ב הַרְחֵ֬ק מִמֶּ֗/נִּי רֵ֣אשׁ וָ֭/עֹשֶׁר אַל תִּֽתֶּן לִ֑/י הַ֝טְרִיפֵ֗/נִי לֶ֣חֶם חֻקִּֽ/י׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/008.yaml
  text: Keep falsehood and lying words far from me[a]; give me neither poverty nor riches[b]; feed me with the bread allotted to me.
translation:
  language: zh_hans
  text: 求你使虚假和谎言远离我；不要使我贫穷，也不要使我富足；求你用分给我的食物[a]养活我。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “分给我的食物”直译为“我份额的饼”；也可译作“我当得的那份食物”或“我每日的食物”。
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁוְא
  choice: 虚假
  rationale: 在“谎言”的并列语境中，这里主要指虚妄不实之事；“虚假”保留其道德含义，也不局限于言语。
- source_word: דְבַר כָּזָב
  choice: 谎言
  rationale: 原文直译为“虚谎的话”；现代汉语用“谎言”简洁自然，并与“虚假”形成有力的并列。
- source_word: הַרְחֵק מִמֶּנִּי
  choice: 求你使……远离我
  rationale: 准确体现使役式命令语气“使之远离”，并以“求你”自然表达祷告口吻。
- source_word: רֵאשׁ וָעֹשֶׁר
  choice: 贫穷……富足
  rationale: 保留原文对称的经济处境；“富足”较“财富”更适合与“使我”搭配。
- source_word: אַל תִּתֶּן לִי
  choice: 不要使我
  rationale: 原文是“不要给我贫穷和财富”；汉语若说“不要给我贫穷”不够自然，因此按语义译为“不要使我贫穷，也不要使我富足”。
- source_word: הַטְרִיפֵנִי
  choice: 求你用……食物养活我
  rationale: 该使役式在此指供应食物；“养活我”既体现持续供养，也比单说“喂养我”更符合成人祷告的语境。
- source_word: לֶחֶם חֻקִּי
  choice: 分给我的食物
  rationale: לֶחֶם 可泛指食物，חֻקִּי 指规定或分定给我的份额；此译自然表达适量供应，同时不引入新约“日用的饮食”的固定措辞。
theological_decisions:
- issue: לֶחֶם חֻקִּי 所表达的供应
  choice: 分给我的食物，即适合或分定给祈求者的份额
  alternative: 我每日的食物
  rationale: 上下文明确拒绝贫穷和富足两个极端，重点是足量而不过量的供应。“分给我的”保留“定额、份额”的含义，也避免把“每日”这一原文未明说的时间概念写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。三个分句保持原文的平衡结构；正文避免生硬直译“给我贫穷”，并以“食物”传达 לֶחֶם 在此处泛指生活所需的食粮。
