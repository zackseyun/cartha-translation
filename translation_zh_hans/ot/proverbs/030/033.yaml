- source_word: חֶמְאָה
  choice: 奶油
  rationale: 泛指经搅动或凝结形成的乳制品；“奶油”沿袭常见译法，但“凝乳”也可能，故列脚注。
- source_word: אַף
  choice: 鼻子
  rationale: 本处因其结果是出血，采用具体的身体部位义。
- source_word: דָם
  choice: 血
  rationale: 直接对应原词，符合现代汉语表达。
- source_word: אַפַּיִם
  choice: 怒气
  rationale: 该形式字面与“鼻孔”相关，却常用作愤怒的习语；译作“怒气”传达语境中的实际含义。
- source_word: רִיב
  choice: 争端
  rationale: 表达争执、纷争；“争端”简洁，并适合箴言体。
