  yaml_path: translation/ot/proverbs/030/029.yaml
  text: 'There are three that are stately in stride[a], even four that are stately in walking:'
translation:
  language: zh_hans
  text: 步态优美的有三样，连行走姿态优美的有四样：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׁלֹשָׁה הֵמָּה
  choice: 有三样
  rationale: 按智慧文学常见的数字递进格式译为自然汉语；הֵמָּה 在这里用于引出所列的一组事物。
- source_word: מֵיטִיבֵי צָעַד
  choice: 步态矫健
  rationale: מֵיטִיבֵי 表示动作出色，并非道德上的“良善”；与 צָעַד 结合，描写迈步姿态出众、有力而令人赞叹。
- source_word: וְאַרְבָּעָה
  choice: 连四样
  rationale: 保留“三样……四样”的递进数字格言形式；“连”自然表达希伯来语连接词在此处的推进作用。
- source_word: מֵיטִבֵי לָכֶת
  choice: 行走威武
  rationale: לָכֶת 是“行走、前行”，מֵיטִבֵי 指行走得出色；结合下文所列之物，“威武”传达其引人注目的气势，同时与上句形成变化中的平行。
theological_decisions: []
