    text: “给！给！”可能是两个女儿不断索取的呼声；也可较意译为“还要！还要！”。
    reason: lexical_alternative
  - marker: b
    text: “够了”所译的希伯来词通常可指“财富”，这里更可能是表示已经充足的说法，也可译作“已经够了”。
    reason: lexical_alternative
lexical_decisions:
- source_word: לַעֲלוּקָה
  choice: 水蛭有
  rationale: עֲלוּקָה指水蛭；前缀ל在这里可作话题标记。中文用“水蛭有”自然表达希伯来文无系词结构，同时保留具体意象。
- source_word: שְׁתֵּי בָנוֹת
  choice: 两个女儿
  rationale: 直译“两个女儿”，保留箴言的拟人化意象，不解释为后代、吸盘或呼声。
- source_word: הַב הַב
  choice: 给啊，给啊
  rationale: 重复的命令式呼求表达不断索取；“给啊”既保留“给”的字面意义，也以语气词传达急切反复的呼声。
- source_word: שָׁלוֹשׁ הֵנָּה לֹא תִשְׂבַּעְנָה
  choice: 有三样从不满足
  rationale: 采用箴言数字格言的自然中文句式；补出量词“样”，并以“从不满足”表达其持续不知足。
- source_word: אַרְבַּע לֹא אָמְרוּ הוֹן
  choice: 有四样从不说：“够了”
  rationale: הוֹן在此按表示充足的感叹语理解，而不取通常的“财富”义；“够了”简洁自然，并与上句“不满足”呼应。
