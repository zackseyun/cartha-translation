  text: אַל תּ֥וֹסְףְּ עַל דְּבָרָ֑י/ו פֶּן יוֹכִ֖יחַ בְּ/ךָ֣ וְ/נִכְזָֽבְתָּ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/006.yaml
  text: Do not add to his words[a], lest he rebuke you and you be proved a liar.
translation:
  language: zh_hans
  text: 不可在他的话上加添，免得他责备你，你就会显为说谎的人。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你被显明为虚谎的人”，或“你被证明说了假话”。
    reason: כזב的被动形式可指人被显明为说谎者，也可侧重其所说的话被证明为虚假。
lexical_decisions:
- source_word: אַל תּוֹסְףְּ
  choice: 不可……加添
  rationale: אַל与未完成式构成禁止语气；“不可”简洁庄重。יסף在使役词干中表示增加，结合介词עַל及“话”，自然译为“在……上加添”。
- source_word: דְּבָרָיו
  choice: 他的话
  rationale: דבר在此指言语；第三人称单数后缀直译为“他的”。上文30:5表明所指是神，但正文保留原文代词及其上下文衔接。
- source_word: פֶּן
  choice: 免得
  rationale: פֶּן引出应当避免的后果，“免得”准确保留警戒语气，也符合现代汉语表达。
- source_word: יוֹכִיחַ בְּךָ
  choice: 他责备你
  rationale: יכח使役词干在此可表示责备、指出错误；与בְּ所标示的对象连用，译作“责备你”自然明确。
- source_word: וְנִכְזָבְתָּ
  choice: 显出你是说谎的
  rationale: כזב的被动词干表达被显明为虚假或说谎者的结果。“显出你是说谎的”保留被揭露、证实为假的意味，同时比生硬的被动结构更符合汉语。
theological_decisions:
- issue: “他的话”中“他”的所指
  choice: 保留“他”，由上文指向神
  alternative: 直接译为“神的话”；或泛指某位说话者的话
  rationale: 箴言30:5紧接着谈到神的每一句话，因此本节代词最自然地指神。正文不将代词明说为“神”，以忠实保留希伯来文本的表达及上下文联系。
- issue: 末句强调说谎者还是虚假
  choice: 正文译作“显出你是说谎的”
  alternative: “显出你是虚假的”或“证实你说的是假话”
  rationale: 原词可涵盖被证明虚假及被显明为说谎者两层含义。正文保留其道德指向，脚注提示较宽的语义可能。
translation_notes:
  register: 采用现代、庄重而易懂的箴言体。“在他的话上加添”略带经文语体，但汉语清楚自然；“免得”简洁地传达警告和后果。
