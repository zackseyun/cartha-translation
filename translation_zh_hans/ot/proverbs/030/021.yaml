  yaml_path: translation/ot/proverbs/030/021.yaml
  text: 'Under three things the earth trembles[a], and under four it cannot bear up:'
translation:
  language: zh_hans
  text: 有三件事使大地震动；有四件事是大地承受不住的[a]：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “承受不住”也可译作“无法忍受”。希伯来语נָשָׂא在这里可表示承担、负载或忍受。
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּחַת
  choice: 使／因
  rationale: 此处引出导致大地震动的情形。汉语若直译为“在……之下”较生硬，因此按因由关系自然表达为“使”，同时保留原句所描绘的承压意象。
- source_word: שָׁלוֹשׁ
  choice: 三件事
  rationale: 希伯来文只说“三”，汉语补出“件事”，使数目格言的表达清楚自然。
- source_word: רָגְזָה
  choice: 震动
  rationale: 该动词可表示震颤、动荡或不安；“震动”既适合“大地”这一主语，也不必限定为实际的地震。
- source_word: אֶרֶץ
  choice: 大地
  rationale: 此处是拟人化的广义用法；“大地”比“土地”更符合格言的宏阔语气。
- source_word: וְתַחַת אַרְבַּע
  choice: 甚至有四件
  rationale: 采用现代汉语常见的“三样……四样……”递进格式，体现希伯来智慧文学的数字格言结构。
- source_word: לֹא תוּכַל שְׂאֵת
  choice: 是它承受不住的
  rationale: תוּכַל与阴性单数主语“大地”呼应；נָשָׂא的形式在此可指承担、忍受。“承受不住”兼顾负重和无法忍耐两层意味。
theological_decisions: []
