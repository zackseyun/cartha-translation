  yaml_path: translation/ot/proverbs/030/026.yaml
  text: Rock badgers are a people not mighty[a], yet they make their home in the crag.
translation:
  language: zh_hans
  text: 岩蹄兔这一族并不强壮，却把家安在岩石中。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“石獾”；传统译作“沙番”。“岩蹄兔”属于蹄兔类，并非真正的獾。
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁפַנִּים
  choice: 石獾
  rationale: 该词所指最可能是蹄兔；“石獾”是中文圣经传统中较熟悉的名称，也能呼应其栖居岩石的习性。脚注补明现代动物学名称，以免误认为真正的獾。
- source_word: עַם
  choice: 一族
  rationale: 原义为“民、族群”，这里拟人化地用于一群动物。“一族”既保留希伯来语的分类表达，也比“一国”自然。
- source_word: לֹא עָצוּם
  choice: 并不强壮
  rationale: עָצוּם在此表示强大、有力量；“并不强壮”自然地呈现其体弱，并与后半句的明智避难形成对照。
- source_word: וַיָּשִׂימוּ
  choice: 却把……安在
  rationale: 动词字面义为“放置、设立”。与“家”搭配时译作“把家安在”符合现代汉语，也保留主动选择居所的意味；“却”表达两分句间原文联词在语境中的转折关系。
- source_word: בַסֶּלַע
  choice: 在岩石中
  rationale: סֶלַע可指岩石、岩壁或峭岩。原文为单数并带介词，译作“在岩石中”保留其坚固藏身处的意象，不擅自改成复数。
- source_word: בֵּיתָם
  choice: 家
  rationale: 字面为“他们的房屋”。用于动物栖所时，“家”简洁自然，又保留箴言中的拟人色彩。
