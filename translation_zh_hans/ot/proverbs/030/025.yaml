base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/025.yaml
  text: The ants are a people not strong[a], yet they prepare their food in the summer.
translation:
  language: zh_hans
  text: 蚂蚁是一族，虽不强壮，却在夏天预备自己的食物[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“它们的饼”；这里“饼”泛指食物或口粮。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנְּמָלִים
  choice: 蚂蚁
  rationale: 定冠词加复数名词，泛指蚂蚁这一类；现代汉语用“蚂蚁”即可自然表达类指，无须另加指示词。
- source_word: עַם
  choice: 一族
  rationale: 该词通常指群体、民族或百姓，此处拟人化地用于蚂蚁。“一族”既保留群体隐喻，又比“民族”用于动物时更自然。
- source_word: לֹא עָז
  choice: 并不强壮
  rationale: 按原文保留对“强壮”的否定，而不直接译成评价色彩更强的“软弱”；“并不”与后句转折自然衔接。
- source_word: וַיָּכִינוּ
  choice: 却……预备
  rationale: 使役词干在此表示使之就绪、预备；“预备”忠实于基本词义，避免用“储存”过度明确具体行动。连词依语境译作“却”，突出体弱与审慎预备之间的对照。
- source_word: בַקַּיִץ
  choice: 在夏天
  rationale: 介词与定冠词标示行动发生的时节；“在夏天”是自然、清楚的现代汉语。
- source_word: לַחְמָם
  choice: 食物
  rationale: לֶחֶם可指字面的饼，也可广义指食物；蚂蚁语境中译为“食物”自然且符合其语义范围，所属关系在汉语中可由语境表达。
theological_decisions: []
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。以“一族”保留原文将蚂蚁称作עַם的拟人化群体意象；句式保留“并不强壮……却……”的智慧文学对照。脚注标记置于所解释的“食物”之后。
