  text: under a hated woman when she is married[a], and a female slave when she inherits from her mistress.
translation:
  language: zh_hans
  text: 在被憎恶的女子出嫁之下，在婢女承继她主母的地位之下。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תַּחַת
  choice: 因
  rationale: 本节承接第21节“大地震动”的句式，表示使大地难以承受的情形。汉语用“因”自然衔接上文，同时保留其引出情境的功能。
- source_word: שְׂנוּאָה
  choice: 被人憎恶的女子
  rationale: 该被动分词指遭人憎恨、厌弃的女子；“被人憎恶”保留原文较强的语气，不弱化为仅仅“不受宠爱”。
- source_word: כִּי
  choice: 当……时（以“出嫁”“取代”的情境表达）
  rationale: 两处כִּי都引出发生身份变化的时刻或情形；汉语无需逐字译出“当……时”，以动词结构即可自然表达。
- source_word: תִבָּעֵל
  choice: 出嫁
  rationale: בעל的尼法勒式在此表示女子成为有夫之妇、进入婚姻；“出嫁”简洁自然，并体现身份变化。
- source_word: שִׁפְחָה
  choice: 婢女
  rationale: 该词指处于从属地位的女性奴仆。“婢女”在现代汉语中既简明，也能传达古代家内的依附身份。
- source_word: תִירַשׁ
  choice: 取代
  rationale: ירש通常表示承受、占有或取得产业；以“主母”为直接宾语时，很可能指婢女取得或接替主母的地位。“取代”适合上下文中的社会地位逆转，同时用脚注保留字面语义的开放性。
- source_word: גְּבִרְתָּהּ
  choice: 她的主母
  rationale: 该名词指婢女所属家庭中地位高于她的女主人；“主母”准确而简洁地表达这种关系。
theological_decisions:
- issue: 婢女“承受/占有主母”的具体含义
  choice: 正文译为“取代她的主母”，理解为接替主母的地位
  alternative: “承受主母的产业”或“占有她的主母”
  rationale: 原文动词的基本义包括承受、占有，但以“主母”为宾语时语义不寻常。上下文列举难以承受的身份逆转，因此正文采用语境明确的“取代”，脚注说明词义范围，不把具体方式定死。
translation_notes:
  register: 采用简洁、庄重的现代书面汉语，并让本节作为第21节句式的延续自然成立。“被人憎恶”保留原文力度；“婢女”“主母”体现古代家内身份关系而不过度古雅。
