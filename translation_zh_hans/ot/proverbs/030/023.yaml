  naturalness: 原文译文可理解，但“因被人憎恶的女子出嫁，也因婢女……”在现代汉语中略显生硬，也容易让读者误以为这些事项是直接的因果。改为“在……之下”可自然呼应上文的成语式列举。
  terminology: “婢女”“主母”适合古代家庭的身份语境；“被人憎恶”忠实但可简化为“被憎恶”，不减弱原文力度。
