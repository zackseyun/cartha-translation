  yaml_path: translation/ot/proverbs/030/032.yaml
  text: If you have acted foolishly by exalting yourself[a], or if you have plotted[b], put your hand over your mouth.
translation:
  language: zh_hans
  text: 你若因自高而行事愚妄，或是有所图谋[a]，就当用手捂住嘴[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “图谋”也可译作“谋划”或“筹算”；原文没有说明所图谋的是什么，动词在此语境中常带负面意味。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“手向着嘴”，是要求自己住口、保持克制的形象说法。
    reason: idiom_clarification
lexical_decisions:
- source_word: נָבַלְתָּ
  choice: 做了愚妄的事
  rationale: 该动词表示行事愚昧、失当，甚至可含可耻之意；译作“做了愚妄的事”既保留道德与实践层面的责备，也避免仅理解为智力不足。
- source_word: בְהִתְנַשֵּׂא
  choice: 因抬高自己
  rationale: התפעל式不定词表达把自己抬高、自我高举；介词 בְּ 在此自然地说明愚妄行为所体现的方式或缘由。
- source_word: זַמּוֹתָ
  choice: 有所图谋
  rationale: זמם 指筹划、谋算，在智慧文学中常带负面意味；原文没有明说所图谋的对象，因此不补入“恶事”，用汉语本身略含贬义的“图谋”保留语境色彩与原文省略。
- source_word: יָד לְפֶה
  choice: 用手捂住嘴
  rationale: 字面意象是“手向着嘴”，作为惯用表达要求人停止说话并约束自己；此译保留具体动作，也让现代读者容易领会。
- source_word: אִם ... וְאִם
  choice: 若……或若……
  rationale: 成对的条件句列出两个相关情形；用“或若”比机械地译成“并且若”更符合现代汉语，同时保留两项并列条件。
theological_decisions:
- issue: 是否给“图谋”补出道德宾语
  choice: 不补“恶事”
  alternative: 图谋恶事
  rationale: 该动词在此很可能含负面意味，但希伯来文本未出现宾语；不明说“恶事”可避免把语境暗示提升为原文明言。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“抬高自己”清楚传达自我高举；“做了愚妄的事”保持箴言的道德劝诫语气；末句保留希伯来文鲜明的肢体意象。
