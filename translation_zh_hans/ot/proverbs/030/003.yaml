  text: וְ/לֹֽא לָמַ֥דְתִּי חָכְמָ֑ה וְ/דַ֖עַת קְדֹשִׁ֣ים אֵדָֽע־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/003.yaml
  text: And I have not learned wisdom[a], nor do I know the knowledge of the Holy One.
translation:
  language: zh_hans
  text: 我没有学得智慧，也没有对至圣者[a]的认识。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“圣者们”。希伯来语此词的词形为复数；但在《箴言》中，它也可能作为尊称或强化复数，指神这位“至圣者”。
    reason: 保留原文复数形态与智慧文学中可能单数指神的用法之间的真实歧义。
lexical_decisions:
- source_word: לָמַדְתִּי
  choice: 学得
  rationale: 完成式第一人称单数表示说话者没有获得这种教导或学识；“没有学得”自然传达既往未曾习得及其当前结果。
- source_word: חָכְמָה
  choice: 智慧
  rationale: 这是《箴言》中该词的常规译法，涵盖实际、道德与敬虔生活方面的智慧。
- source_word: דַעַת
  choice: 知识
  rationale: 保留名词的基本意义，并与随后源自 ידע（知道、认识）的动词形成词义呼应。
- source_word: קְדֹשִׁים
  choice: 圣者
  rationale: 原文形态为复数，但在智慧文学中可能以尊称或强化复数指神；“圣者”在中文中既可按单数理解为神，也不完全遮蔽原文形式上的张力，复数读法另见脚注。
- source_word: אֵדָע
  choice: 具备认识……的知识
  rationale: 未完成式第一人称单数在此与前句并列，表达当前并不知道；依照希伯来语结构整合为自然中文，同时保留 דַעַת 与 ידע 的词义联系。
theological_decisions:
- issue: קְדֹשִׁים 是单数地指神，还是复数地指圣者
  choice: 正文按智慧文学惯用语理解为指神的“圣者”
  alternative: “圣者们”或“众圣者”
  rationale: 《箴言》9:10的相近表达支持以此称呼神，但原文表面形态确为复数，因此不将另一读法排除，而在脚注中明确保留。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“学得”比单纯“学习”更能表达获得成果；后半句稍作整合，以避免生硬的“我不知道……的知识”，同时保留“知识／认识”的词根呼应。
