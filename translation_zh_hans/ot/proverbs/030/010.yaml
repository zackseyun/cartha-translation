  terminology: “奴仆”可保留原词在“奴隶/仆人”之间的语义宽度；脚注恰当说明替代译法。“罪责”可表达 אָשָׁם 所指的负罪状态；“自取罪责”在中文中清楚表达招致罪责，且不指定审判主体或咒诅生效机制。
