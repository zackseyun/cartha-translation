  yaml_path: translation/ot/proverbs/030/010.yaml
  text: Do not slander a slave to his master[a], lest he curse you and you become guilty.
translation:
  language: zh_hans
  text: 不要向奴仆的主人毁谤他，免得那奴仆咒诅你，你便自取罪责。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “奴仆”也可译作“奴隶”。希伯来文 עֶבֶד 指处于主人权下的从属者，在不同语境中可涵盖奴隶或仆人。
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּלְשֵׁן
  choice: 诬告
  rationale: 该动词源于“舌头”一词，表示用言语攻击或恶意控告某人。“诬告”既体现向主人告发的具体语境，也保留其不实或恶意言说所含的道德过错。
- source_word: עֶבֶד
  choice: 奴仆
  rationale: 该词可指奴隶或仆人，核心是处于主人权下的从属者。“奴仆”在现代中文中既能反映其受辖制的社会身份，也比单用“奴隶”稍能保留原词可能涵盖不同程度隶属关系的宽度。
- source_word: אֶל אדניו
  choice: 向主人
  rationale: 介词 אֶל 加“他的主人”表示把针对奴仆的话带到其主人那里；中文用“向主人”自然、简洁，也避免在此采用可能引发神学联想的“主”。
- source_word: פֶּן
  choice: 免得
  rationale: פֶּן 引出应当避免的不良后果。“免得”符合中文劝诫句式，并保持箴言简洁的警告语气。
- source_word: יְקַלֶּלְךָ
  choice: 他咒诅你
  rationale: קלל 的加强词干在此表示咒诅，而不只是辱骂；“咒诅”保留了言语求祸于人的严肃含义。
- source_word: וְאָשָׁמְתָּ
  choice: 你就担当罪责
  rationale: אשם 可表达陷入有罪或承担罪责的状态。“担当罪责”保留了罪咎及相应责任的双重意味，并未限定究竟是道德定罪、法律责任，还是咒诅应验所显明的罪责。
theological_decisions:
- issue: 奴仆的咒诅与诬告者有罪之间的关系
  choice: 用“免得……你就担当罪责”保留结果次序，不具体说明咒诅如何导致或显明罪责
  alternative: 译成“否则他会咒诅你，使你获罪”或“你便会被定罪”
  rationale: 原文仅并列警告“他咒诅你”和“你成为有罪/负罪”，没有明确说明因果机制或审判主体，因此不宜补入“使”或明确的神圣、司法判决。
translation_notes:
  register: 采用简洁、庄重的现代标准汉语，保持箴言直接劝诫的语气。“诬告”比泛泛的“说坏话”更贴合向主人恶意控告的场景；“担当罪责”比“成为有罪”更符合自然中文，同时保留原文的罪咎张力。
