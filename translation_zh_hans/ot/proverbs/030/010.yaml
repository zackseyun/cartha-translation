  to: 不要向奴仆的主人毁谤他，免得那奴仆咒诅你，你便自取罪责。[a]
  rationale: 修订明确咒诅者是被毁谤的奴仆，消除中文代词可能误指主人的问题；以“毁谤”对应“以舌攻击/中伤”的动词而不将其限缩为法律意义的控告；“自取罪责”保留原文招致罪咎的结果性，未增添罪责的判定者或咒诅与罪责之间的机制。脚注保留原有词义范围说明。
