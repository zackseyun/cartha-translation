  text: מִ֤י עָלָֽה שָׁמַ֨יִם וַ/יֵּרַ֡ד מִ֤י אָֽסַף ר֨וּחַ בְּ/חָפְנָ֡י/ו מִ֤י צָֽרַר מַ֨יִם בַּ/שִּׂמְלָ֗ה מִ֭י הֵקִ֣ים כָּל אַפְסֵי אָ֑רֶץ מַה שְּׁמ֥/וֹ וּ/מַֽה שֶּׁם בְּ֝נ֗/וֹ כִּ֣י תֵדָֽע־׀־׀־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/004.yaml
  text: Who has gone up to heaven and come down? Who has gathered the wind in his hands? Who has wrapped the waters in a garment? Who has established all the ends of the earth? What is his name[a], and what is his son's name[c][b], surely you know!
translation:
  language: zh_hans
  text: 谁升上天[a]，又降下来？谁把风聚在掌中？谁把水包在外袍里？谁立定大地的四极？他叫什么名字？他的儿子[b]叫什么名字？你若知道。 [c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “天”也可译作“诸天”或“天空”；希伯来语 שָׁמַיִם 在形式上是复数。
    reason: lexical_alternative
  - marker: b
    text: 基督教传统常认为“他的儿子”具有基督论意义，但希伯来文本本身没有明确说明这位儿子是谁。
    reason: theological_ambiguity
  - marker: c
    text: 末句也可理解为带反讽的“你一定知道吧！”希伯来语 כִּי תֵדָע 在这里既可表达条件性的挑战，也可能带有断言或讥讽的语气。
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלָה שָׁמַיִם וַיֵּרַד
  choice: 升上天，又降下来
  rationale: 保留上升与下降的对称意象；“天”是现代汉语对 שָׁמַיִם 在此处最自然的表达，不以形态上的复数强行译成“诸天”。
- source_word: אָסַף רוּחַ בְּחָפְנָיו
  choice: 把风聚在掌中
  rationale: 宇宙创造的语境表明 רוּחַ 在这里以“风”为宜；חָפְנָיו 指合拢或捧起之手的掌中空间，“掌中”既准确又保留鲜明意象。
- source_word: צָרַר מַיִם בַּשִּׂמְלָה
  choice: 把水包在衣服里
  rationale: צָרַר 表示捆起、包住，שִׂמְלָה 指衣服或外袍；译文保留以衣裹水这一不寻常的诗性图景。
- source_word: הֵקִים כָּל אַפְסֵי אָרֶץ
  choice: 立定大地的四极
  rationale: הֵקִים 表示使之确立、稳固；“四极”自然概括 כָּל אַפְסֵי אָרֶץ 所指大地所有极远之处，并保持庄重的宇宙性语体。
- source_word: מַה שְּׁמוֹ וּמַה שֶּׁם בְּנוֹ
  choice: 他叫什么名字？他的儿子叫什么名字？
  rationale: 直接保留两个追问及“儿子”的明确男性亲属称谓，不替经文确认其身份。
- source_word: כִּי תֵדָע
  choice: 你若知道，就说吧！
  rationale: 此处 כִּי 可在反诘中表达条件性的挑战。“你若知道，就说吧”是自然汉语，传达其激将语气；脚注同时保留另一种可能的断言式理解。
theological_decisions:
- issue: “他的儿子”的身份
  choice: 正文保留“他的儿子”，不进一步指明身份
  alternative: 基督教传统常从基督论角度理解此语；也可首先视为反诘的一部分，凸显人无法指出这样一位掌管宇宙者及其儿子
  rationale: 希伯来文本提出问题，却没有明说儿子是谁。译文不消除这一神学张力，也不把后来的解释直接写入正文。
- issue: 末句 כִּי תֵדָע 的语气
  choice: 按条件性挑战译为“你若知道，就说吧！”
  alternative: 可理解为带讽刺意味的“你一定知道吧！”
  rationale: 两种读法都能配合整节的反诘。正文采用在汉语中更连贯的条件式挑战，脚注保留断言式反讽的可能。
translation_notes:
  register: 采用现代、庄重而可懂的汉语，以连续反问形成有力节奏。“聚在掌中”“包在衣服里”“大地的四极”保留原文的具体诗性意象；末句使用自然汉语补出挑战中隐含的“就说吧”，并以脚注交代原文语气的歧义。
