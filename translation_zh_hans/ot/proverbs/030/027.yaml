source:
  edition: WLC
  text: מֶ֭לֶךְ אֵ֣ין לָ/אַרְבֶּ֑ה וַ/יֵּצֵ֖א חֹצֵ֣ץ כֻּלּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/027.yaml
  text: The locusts have no king[a], yet all of them march out in ranks.
translation:
  language: zh_hans
  text: 蝗虫没有君王，却都列队而出。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “列队而出”也可译作“分队而出”，即按群、按队出动。
    reason: lexical_alternative
lexical_decisions:
- source_word: מֶלֶךְ
  choice: 君王
  rationale: 该词通常指君王；“君王”准确、庄重，也适合箴言的文体。
- source_word: אֵין לָאַרְבֶּה
  choice: 蝗虫没有
  rationale: 希伯来语存在句配合介词 ל 表达领有，现代汉语自然译作“蝗虫没有君王”。
- source_word: אַרְבֶּה
  choice: 蝗虫
  rationale: 原文虽为形态上的单数，此处却是集合名词，泛指成群的蝗虫；汉语“蝗虫”本身可作集合性表达，无须另加复数标记。
- source_word: וַיֵּצֵא
  choice: 却……而出
  rationale: 原文直译为“并且出去”，但上下文形成明显反差：虽无君王，仍有秩序地行动；用“却”自然呈现这种语用上的让步关系，而“而出”保持简洁庄重。
- source_word: חֹצֵץ
  choice: 列队
  rationale: 该分词在此表示分列、编组或按队伍排列；“列队”能自然传达蝗虫有秩序地成群出动，同时不必断定为严格的军事阵形。
- source_word: כֻּלּוֹ
  choice: 都
  rationale: 后缀与集合名词呼应，意为整体无一例外；汉语用“都”最自然地表达“全体”。
theological_decisions: []
translation_notes:
  register: 采用现代、简洁而庄重的箴言体。“蝗虫”保留集合意义，“没有君王……却……”清楚呈现原句的反差；脚注保留 חֹצֵץ 可理解为分组、分队的词义空间。
