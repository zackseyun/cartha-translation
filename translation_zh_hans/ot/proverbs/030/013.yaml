  yaml_path: translation/ot/proverbs/030/013.yaml
  text: There is a generation—how lofty are its eyes[a], and its eyelids are raised high.
translation:
  language: zh_hans
  text: 有一种人——他们的眼目何其高，眼皮也抬得高高的！
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דּוֹר
  choice: 有一种人
  rationale: 该词本义为“世代”，在箴言30:11–14反复用于引出某一类人。现代汉语译作“有一种人”能自然表达此处的群体分类作用，又不局限为某个年代的人。
- source_word: מָה
  choice: 何其
  rationale: 此处是感叹用法，不是疑问；“何其”以庄重而通顺的现代汉语表达程度感叹。
- source_word: רָמוּ
  choice: 高傲
  rationale: 该动词本义为“高、升高”。与“眼目”搭配时既保留高举的形象，也自然传达傲慢之意；脚注另列较直译的“高”。
- source_word: עֵינָיו
  choice: 他们的眼目
  rationale: 希伯来语为阳性单数后缀，与集合性的“世代／一类人”一致。汉语按实际所指用复数“他们”，比“它的”自然；“眼目”保留诗体的身体意象。
- source_word: וְעַפְעַפָּיו
  choice: 眼皮也
  rationale: עַפְעַף具体指眼皮。保留身体部位意象，不抽象改译为“神态”；וְ在平行句中自然处理为“也”。
- source_word: יִנָּשֵׂאוּ
  choice: 抬得高高的
  rationale: 该词为נשׂא的尼法勒式，表示被抬起或扬起。此译保留眼皮上抬的具体姿态，并与前句的高傲形象呼应。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重且易懂的箴言体。“有一种人”承接本段反复描述不同人群的结构；破折号引出感叹，句末叹号体现מָה的感叹语气。正文以“高傲”自然传达语境含义，同时借脚注保存“高”的字面歧义。
