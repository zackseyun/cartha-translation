base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/017.yaml
  text: The eye that mocks a father and despises obedience to a mother—the ravens of the valley will peck it out[c][b][a], and the young of the eagle will eat it.
translation:
  language: zh_hans
  text: 嘲笑父亲、藐视对母亲应有的顺从[a]的眼睛，谷中的乌鸦[b]必把它啄出来，鹰[c]的雏鸟必把它吃掉。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“藐视母亲的训诲（或吩咐）”。这里的希伯来词十分罕见，可能指人对母亲应有的顺从，也可能指母亲所发的训诲或命令。
    reason: lexical_alternative
  - marker: b
    text: “谷中”所译的希伯来词也可指溪谷、干河谷或河床。
    reason: lexical_alternative
  - marker: c
    text: 这里的希伯来词可指鹰，也可指秃鹫一类的大型猛禽。
    reason: lexical_alternative
lexical_decisions:
- source_word: עַיִן
  choice: 眼睛
  rationale: 保留希伯来文单数，以身体部位代指轻慢父母的人，并与后文“把它啄出来”形成鲜明意象。
- source_word: תִּלְעַג
  choice: 嘲笑
  rationale: 准确表达 לעג 所含的讥嘲、戏弄和轻蔑意味，现代汉语自然易懂。
- source_word: לְאָב
  choice: 父亲
  rationale: 原文没有明确的物主后缀；不添加“自己的”，保留格言的泛指性质。
- source_word: וְתָבוּז
  choice: 藐视
  rationale: 体现 בוז 的鄙视、轻看之意，语体庄重且符合伦理语境。
- source_word: לִיקֲּהַת אֵם
  choice: 对母亲的顺从
  rationale: יקהת 是罕见且有争议的词；结合语境，表达儿女理当给予母亲的听从，同时以脚注保留“训诲／吩咐”的可能理解。
- source_word: יִקְּרוּהָ
  choice: 必把它啄出来
  rationale: נקר 在鸟与眼睛的语境中指啄出或剜出；“啄出来”既具体又符合乌鸦的动作。
- source_word: עֹרְבֵי נַחַל
  choice: 谷中的乌鸦
  rationale: נחל 可指溪谷、干河谷或河床；正文采用自然的“谷中”，脚注说明其地貌含义。
- source_word: וְיֹאכְלוּהָ
  choice: 必把它吃掉
  rationale: 按 אכל 的普通意义直译为“吃”，保留原文冷峻直接的表达。
- source_word: בְנֵי נָשֶׁר
  choice: 鹰鹫的雏鸟
  rationale: נשר 可指鹰类或秃鹫类猛禽；“鹰鹫”保留物种辨认的不确定性，“雏鸟”自然表达字面上的“子”。
