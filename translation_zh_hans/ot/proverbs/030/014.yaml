base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/014.yaml
  text: a generation whose teeth are swords[a], and whose fangs are knives[b], to devour the poor from the earth and the needy from among mankind.
translation:
  language: zh_hans
  text: 有一类人，牙齿如剑，利齿如刀；为要从世上吞吃困苦人，从人间吞吃穷乏人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דּוֹר
  choice: 有一类人
  rationale: 该词通常指“世代”，也可在本段排比中指具有某种共同特征的一类人。译为“有一类人”自然呈现希伯来文的类型辨认语气，避免让现代读者误解为单指某个年代。
- source_word: חֲרָבוֹת שִׁנָּיו
  choice: 牙齿如剑
  rationale: 原文是名词性隐喻，直为“他的牙齿是剑”；中文用“如剑”清楚保留锋利、暴力的意象。
- source_word: מַאֲכָלוֹת מְתַלְּעֹתָיו
  choice: 臼齿如刀
  rationale: מְתַלְּעֹתָיו 指颌部的牙齿或臼齿；מַאֲכָלוֹת 在此指切割用具。译作“臼齿如刀”既与上句平行，也保留捕食般的形象。
- source_word: לֶאֱכֹל
  choice: 吞灭
  rationale: 该动词本义为“吃”，此处比喻残酷压榨并消灭弱者；“吞灭”保留吃食意象及其毁灭力度。
- source_word: עֲנִיִּים
  choice: 困苦人
  rationale: 该词可兼指贫穷、受苦或受压迫者。“困苦人”保留其不只限于经济贫困的语义范围。
- source_word: מֵאֶרֶץ
  choice: 从世上
  rationale: אֶרֶץ 可指地、国土或全地；与下句“从人间”平行时，“世上”最自然地表达广义范围。
- source_word: אֶבְיוֹנִים
  choice: 穷乏人
  rationale: 该词突出缺乏资源、需要援助的人；“穷乏人”与“困苦人”相区别，同时保持诗句的同义平行。
- source_word: מֵאָדָם
  choice: 从人间
  rationale: אָדָם 在这里泛指人类社会，而非某一男性。“人间”自然表达“从人类当中”的意思，并与“世上”形成简洁平行。
theological_decisions:
- issue: אָדָם 是否指特定男性
  choice: 按泛指人类社会译为“人间”
  alternative: 直译为“从人当中”或“从人类中”
  rationale: 上下文谈论弱者被从社会中吞灭，אָדָם 是集合性的泛称。译文不限定性别，也不把它解释为专名亚当。
- issue: לֶאֱכֹל 所表达的伤害程度
  choice: 译为“吞灭”，保留捕食与毁灭的隐喻
  alternative: 译为“吞吃”或解释为“压榨”
  rationale: “吞灭”不把经文缩减为纯经济压迫，也不额外限定具体手段，因而保留原文的神学与伦理张力。
translation_notes:
  register: 采用现代、凝练而庄重的箴言体。两组“牙齿如剑／臼齿如刀”和“从世上／从人间”保持平行；“困苦人／穷乏人”保留两个希伯来词的细微差别。原文不存在必须以脚注标示才能保留的异文或关键歧义，因此不设脚注。
