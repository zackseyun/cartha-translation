revisions:
- from: 有一类人，牙齿如剑，臼齿如刀，要从世上吞灭困苦人，从人间吞灭穷乏人。
  to: 有一类人，牙齿如剑，利齿如刀；为要从世上吞吃困苦人，从人间吞吃穷乏人。
  rationale: 仅作两项安全而有限的调整：以“利齿”避免把颚齿限定为臼齿；以“吞吃”更贴近原文“吃”的掠夺性隐喻。保留原译的类型性开头、两组武器意象、弱势群体的词汇区别，以及“世上／人间”的平行。
