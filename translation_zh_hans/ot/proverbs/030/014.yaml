  naturalness: 原译简洁、庄重，符合现代汉语箴言体。“有一类人”自然。“从世上吞灭……从人间吞灭……”虽可理解，但“为要从……吞吃……”更直接对应不定式 לֶאֱכֹל，同时保持原文的残酷吞噬意象。
  terminology: “困苦人／穷乏人”恰当地保留 עֲנִיִּים 与 אֶבְיוֹנִים 的细微区别；“世上／人间”也适当地表达 אֶרֶץ 与泛指人类的 אָדָם。无需脚注。
