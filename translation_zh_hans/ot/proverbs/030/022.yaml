  text: under a slave when he becomes king[a], and a fool when he is filled with bread[b],
translation:
  language: zh_hans
  text: 奴仆作王[a]，愚顽人吃饼吃饱了[b]；
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “作王”也可译作“掌权”或“统治”。
