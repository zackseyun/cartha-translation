    reason: lexical_alternative
lexical_decisions:
- source_word: תַּחַת
  choice: （由上文“因……而震动”统摄）
  rationale: 本节承接30:21，תַּחַת引出使大地震动的情形。中文分条列举时无需在每项重复译出，否则不够自然。
- source_word: עֶבֶד
  choice: 奴仆
  rationale: 该词指处于从属身份的仆役或奴隶；此处重点是社会地位的倒置。“奴仆”既保留从属意味，又符合现代中文箴言体。
- source_word: כִּי
  choice: （当……时，以无标记分句表达）
  rationale: 这里引出发生该情形的时刻。中文用“奴仆作王”“愚顽人吃饱”即可自然表达“当……时”，不必机械译出“当”。
- source_word: יִמְלֹךְ
  choice: 作王
  rationale: 该动词可指作王、掌权或统治。“作王”简洁保留王权意象，也不强行判定侧重开始作王还是正在执政。
- source_word: נָבָל
  choice: 愚顽人
  rationale: 此词在智慧文学中不仅表示智力不足，也含道德与社会行为上的乖谬。“愚顽人”比单纯“愚人”更能传达这一层面。
- source_word: יִשְׂבַּע
  choice: 吃饱了
  rationale: 该词表示饱足。与“饼”搭配译作“吃饱了”自然具体，并保留达到饱足状态的含义。
- source_word: לָחֶם
  choice: 饼
  rationale: 原词直指饼或粮食，也可泛指食物。正文保留具体食物意象，脚注说明其宽泛用法。
theological_decisions: []
