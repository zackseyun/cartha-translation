  text: כֵּ֤ן דֶּ֥רֶךְ אִשָּׁ֗ה מְנָ֫אָ֥פֶת אָ֭כְלָה וּ/מָ֣חֲתָה פִ֑י/הָ וְ֝/אָמְרָ֗ה לֹֽא פָעַ֥לְתִּי אָֽוֶן׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/020.yaml
  text: 'So is the way of an adulterous woman: she eats and wipes her mouth and says[b][a], “I have done no wrong.”'
translation:
  language: zh_hans
  text: 这就是犯奸淫的妇人的行径：她吃了，擦擦嘴[b]，然后说：“我没有作恶[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “作恶”也可译作“行不义”或“犯下罪孽”。
    reason: lexical_alternative
  - marker: b
    text: “吃了，擦擦嘴”的画面表现她若无其事地掩去痕迹，仿佛所做的事没有留下任何道德上的污点。
    reason: cultural_note
lexical_decisions:
- source_word: כֵּן
  choice: 也是这样
  rationale: 承接上一节的比喻，并把其难以捉摸、不留痕迹的特点应用于奸淫妇人的行径；“也是这样”自然保留比较和总结作用。
- source_word: דֶּרֶךְ
  choice: 行径
  rationale: 此处指一贯的行为方式。“行径”保留“道路／方式”的智慧文学意象，同时在现代汉语中清楚指向行为模式。
- source_word: אִשָּׁה מְנָאָפֶת
  choice: 奸淫妇人
  rationale: 分词描述犯奸淫的女子。“奸淫妇人”简洁、庄重，保留婚约不忠的道德含义，而不扩展为泛指性方面的不道德。
- source_word: אָכְלָה
  choice: 她吃了
  rationale: 希伯来语完成式在格言中生动描写典型动作；汉语用“吃了”既呈现动作完成，也自然引出随后擦嘴的动作。
- source_word: וּמָחֲתָה פִיהָ
  choice: 擦擦嘴
  rationale: 直译为“擦她的口”。“擦擦嘴”是自然现代汉语，保留饭后抹去痕迹的鲜明画面。
- source_word: וְאָמְרָה
  choice: 说
  rationale: 与前面一连串动作并列；汉语无需重复主语，表达简洁而连贯。
- source_word: לֹא פָעַלְתִּי אָוֶן
  choice: 我没有做坏事
  rationale: פָעַלְתִּי 表示“我做了”，אָוֶן 可指恶事、罪孽或不义。“没有做坏事”符合现代口语中的自我辩解，同时保留道德否认；较直译的选择见脚注。
theological_decisions:
- issue: 吃与擦嘴的意象是否应在正文中明说为奸淫的隐喻
  choice: 保留原文意象，不在正文中解释
  alternative: 意译为“她犯了奸淫，掩去痕迹”
  rationale: 原文以含蓄而尖锐的饭食意象描绘行为及其掩饰。直接解释会消除诗性张力，并把隐喻的具体意义说得过满；故正文保留意象，脚注说明其修辞作用。
translation_notes:
  register: 采用现代、庄重而易懂的格言体。“奸淫妇人”明确表达婚约不忠；“擦擦嘴”保留原文具体而略带讽刺的日常画面。脚注标记依正文所涉词语和意象的顺序排列。
