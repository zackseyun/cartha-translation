  text: Every word of God is proven; he is a shield to those who take refuge in him.
translation:
  language: zh_hans
  text: 神的每一句话都经得起考验；他是向他投靠之人的盾牌。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל אִמְרַת אֱלוֹהַּ
  choice: 神的每一句话
  rationale: כָּל 配合单数集合性表达 אִמְרַת，可自然译为“每一句话”；אֱלוֹהַּ 在此指神。
- source_word: צְרוּפָה
  choice: 都经得起考验
  rationale: 该词源于 צרף，基本意象是金属经过熬炼、检验而显为纯净可靠。这里采用“经得起考验”，既表达受试验后证明可靠，也避免把含义仅限于道德或成分上的“纯净”。
- source_word: מָגֵן
  choice: 盾牌
  rationale: 保留诗歌中的具体保护意象。
- source_word: לַחֹסִים בּוֹ
  choice: 投靠之人
  rationale: חסה 表示寻求庇护、投靠；“投靠”简洁保留了主动信赖并寻求保护的含义，בּוֹ 所指的“他”由汉语语境自然承接。
theological_decisions:
- issue: צְרוּפָה 强调“纯净”还是“经过验证而可靠”
  choice: 经得起考验
  alternative: 纯净无瑕／经过熬炼
  rationale: 希伯来词同时带有熬炼、净化和验证的语义。“经得起考验”在现代汉语中自然，并保留神的话经过检验而可信可靠的重点，而不否认其纯净含义。
- issue: “他”与“神的话”之间的指代
  choice: 他是投靠之人的盾牌
  alternative: 神是投靠他之人的盾牌
  rationale: 原文使用阳性单数代词 הוּא，最自然回指神。译文保留代词和诗句的紧凑结构，不额外解释。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“经得起考验”比“经过验证”更具诗性，也更贴近 צְרוּפָה 所含的熬炼意象；分号保留两个平行宣告之间的紧密联系。
