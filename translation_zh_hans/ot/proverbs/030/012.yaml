base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/012.yaml
  text: There is a generation that is pure in its own eyes[b][a], yet is not washed from its filth.
translation:
  language: zh_hans
  text: 有一类人，自以为纯洁[a]，自己的污秽[b]却还没有洗净。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在自己眼中是洁净的。”
    reason: lexical_alternative
  - marker: b
    text: 译作“污秽”的希伯来词也可指“粪便”或“排泄物”；原文的意象刻意鲜明而强烈。
    reason: lexical_alternative
lexical_decisions:
- source_word: דּוֹר
  choice: 一类人
  rationale: 该词本义可指“一代”，在30:11–14的排比中则用来概括具有某种特征的一群人；译作“一类人”既传达集合意义，也符合现代汉语表达。
- source_word: טָהוֹר
  choice: 纯洁
  rationale: 该词兼有礼仪上洁净和道德上纯洁的含义；“纯洁”保留道德意味，同时脚注注明“洁净”这一更贴近洗涤意象的译法。
- source_word: בְּעֵינָיו
  choice: 自以为
  rationale: 希伯来语直译为“在自己眼中”，是表示自我判断的习语；“自以为”自然传达其主观自评，但不额外说明其动机。
- source_word: וּמִצֹּאָתוֹ
  choice: 自己的污秽
  rationale: צֹאָה可指污物、粪便或排泄物，意象强烈；正文用“污秽”兼顾身体与道德层面的比喻力量，脚注保留原词粗粝、鲜明的具体含义。
- source_word: לֹא רֻחָץ
  choice: 没有洗净
  rationale: 被动形式表示尚未被洗去或洗净的状态；汉语这样表达自然，也不补出希伯来文未说明的施事者。
theological_decisions:
- issue: 洁净语言的性质
  choice: 呈现自认纯洁与实际污秽之间的反差，不限定为纯粹的礼仪或道德范畴。
  alternative: 将其明确解释为礼仪不洁，或明确解释为道德败坏。
  rationale: 经文的洁净与洗涤语言可同时唤起礼仪和道德联想；上下文偏向道德批判，但原文并未把意象限制在单一范畴，因此保留其张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“一类人”适合本段连续刻画不同人群的排比；“自以为”简洁表达希伯来习语，“污秽”则保留身体洁净与道德不洁之间的双重意象。
