base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/024.yaml
  text: 'Four are small on the earth[a], yet they are exceedingly wise:'
translation:
  language: zh_hans
  text: 地上有四样微小之物，它们却极有智慧[a]：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“有智慧，是被赋予智慧的”，这是强调说法，意思是“非常有智慧”或“极有智慧”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַרְבָּעָה
  choice: 四样
  rationale: 保留数字箴言以“四”开篇的简洁结构；量词“样”使现代汉语自然，并与下文列举的四类小动物衔接。
- source_word: קְטַנֵּי אָרֶץ
  choice: 地上……微小之物
  rationale: 该结构直指“地上微小者”。译作“微小之物”既保留形容性的重点，也不在本节中过早明说原文未出现的“动物”或“生物”。
- source_word: וְהֵמָּה
  choice: 它们却
  rationale: 独立代词带有强调作用，连接词在这里呈现微小与智慧之间的对比，因此用“却”自然传达修辞转折。
- source_word: חֲכָמִים
  choice: 有智慧
  rationale: חכם是智慧文学中的常用词；“有智慧”比单说“聪明”更贴近箴言的智慧主题，也适合描述下文各物的生存本领。
- source_word: מְחֻכָּמִים
  choice: 极有智慧
  rationale: 该Pual分词紧接חֲכָמִים，构成强调表达。“极”以自然现代汉语传达这种强化，同时脚注保留其较直译的形式。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“微小之物”保留原文的概括性，“它们却”凸显小与智之间的张力；句末冒号承接30:25—28的四项列举。
