  text: the lion[a], mighty among beasts, and does not turn back before any.
translation:
  language: zh_hans
  text: 狮子[a]，兽类中勇猛的，在任何面前都不转身退去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “狮子”在原文中是一个富有诗意的称呼。末句也可较直译为：“在一切面前都不转回。”原文没有说明它所面对的是人、动物或其他对象。
    reason: 说明 לַיִשׁ 的诗歌性用法，并保留 מִפְּנֵי כֹל 所指对象的宽泛性。
lexical_decisions:
- source_word: לַיִשׁ
  choice: 狮子
  rationale: 这是“狮子”的诗歌性称呼。希伯来语没有明示定冠词；汉语用无量词的“狮子”既可作类指，也符合箴言列举中的典型形象。
- source_word: גִּבּוֹר
  choice: 勇士
  rationale: 该词表示强健、有勇力者，也常指勇士。这里用作狮子的同位描述；“勇士”保留其人格化和高昂的诗意，比单说“强壮”更贴近名词形式。
- source_word: בַּבְּהֵמָה
  choice: 百兽中的
  rationale: 介词 ב 在此表示所属或比较的范围，בְּהֵמָה 广义指动物。“百兽中的”是自然凝练的现代汉语，并适合狮子的语境；“百兽”并非精确数目。
- source_word: וְלֹא יָשׁוּב
  choice: 都不退缩
  rationale: שׁוּב 的基本义是“转回、返回”，此处在面对对手的情境中指不向后退。译作“不退缩”自然表达无所畏惧，同时避免赋予过强的军事色彩。
- source_word: מִפְּנֵי כֹל
  choice: 面对任何敌手
  rationale: מִפְּנֵי 表示“在……面前／因面对……”，כֹל 可指任何一个或一切。原文没有明说对象类别；正文补出“敌手”使汉语意思完整，并由脚注保留更宽泛的可能。
theological_decisions: []
translation_notes:
  register: 采用凝练、庄重而易懂的箴言体。“百兽中的勇士”保留原文的同位结构和人格化色彩；“面对任何敌手都不退缩”以自然现代汉语传达其无畏形象，脚注则交代原文更字面的开放表达。
