base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/007.yaml
  text: 'Two things I have asked of you[a]; do not withhold them from me before I die:'
translation:
  language: zh_hans
  text: 我向你求两件事[a]；求你在我死以前，不要把这两件事扣留不给我：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“我向你求二”；“事”是按上下文补出的。
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁתַּיִם
  choice: 两件事
  rationale: 希伯来文只用阴性数词“二”，所指事项由上下文补足。现代汉语需加量词和中心词，“两件事”自然表达下文将列出的两个请求。
- source_word: שָׁאַלְתִּי מֵאִתָּךְ
  choice: 我向你求
  rationale: שאל 的完成式表示说话者已经提出并仍然持守的请求；“向你求”既符合祷告语境，也自然表达 מֵאִתָּךְ 所标明的对象。
- source_word: אַל תִּמְנַע מִמֶּנִּי
  choice: 求你不要不赐给我
  rationale: מנע 的基本意思是扣住、不让人得到。这里没有明说宾语，中文以“不赐给我”承接前面的“两件事”；加“求你”体现 אַל 加未完成式在此是恳求而非生硬命令。
- source_word: בְּטֶרֶם אָמוּת
  choice: 在我死以前
  rationale: בְּטֶרֶם 表示某事发生之前，אָמוּת 是第一人称“我死”；此译准确而符合现代汉语。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的祈求语气。保留原文第二分句的否定结构，以贴近“不要扣住不给我”的含义；句末用冒号，引出下一节所列的两个请求。
