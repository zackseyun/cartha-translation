  text: a strutting rooster[a], a he-goat[b], and a king against whom there is no rising up.
translation:
  language: zh_hans
  text: 昂首阔步的公鸡[a]，或公山羊，以及无人能起来反抗的君王[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “公鸡”所译的希伯来词十分罕见，含义不能确定；原短语直译近似“腰胯束紧的”。也有人理解为“灵缇犬”“战马”或泛指“腰胯矫健者”。
    reason: lexical_alternative
  - marker: b
    text: 这句希伯来文十分难解。也可按另一种分析译作“有军队随行的君王”。
    reason: alternative_reading
lexical_decisions:
- source_word: זַרְזִיר מָתְנַיִם
  choice: 昂首阔步的公鸡
  rationale: זַרְזִיר 是罕见词，所指动物不能确定；מָתְנַיִם 直译为“腰胯”。结合上下文所描绘的威武步态，正文采用现代较常见的“公鸡”理解，并以“昂首阔步”自然表达腰胯紧实、步态庄严的形象，同时用脚注保留其他可能。
- source_word: אוֹ
  choice: 或
  rationale: 马所拉文本明确使用通常表示选择关系的连词“或”；虽然列举语境可能促使某些译本按并列关系处理，正文仍保留原文表层形式。
- source_word: תָיִשׁ
  choice: 公山羊
  rationale: 该词特指雄性的山羊；“公山羊”既准确又符合现代汉语。
- source_word: מֶלֶךְ
  choice: 君王
  rationale: 准确表达统治者之意，并保持智慧文学庄重的语体。
- source_word: אַלְקוּם עִמּוֹ
  choice: 无人能起来反抗的
  rationale: 此短语的词形和句法都十分困难。正文采用把 אַל 与“起来”相关词根 קום 联系起来的传统理解，并将 עִמּוֹ 按敌对语境自然译为“反抗他”；不确定性及另一主要解释在脚注中说明。
theological_decisions:
- issue: 末句是否表示君王不可抗拒，还是表示军队随行
  choice: 无人能起来反抗的君王
  alternative: 有军队随行的君王
  rationale: 原文允许多种分析，无法仅凭语法彻底定论。正文采用与“威武行进、步态庄严”相容且历史悠久的“不受反抗”理解，但不将其绝对化，在脚注中保留“军队随行”的解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“昂首阔步”呼应本段“步态威武”的主题；“君王”比口语化的“国王”更适合箴言诗体。正文保留原文的“或”，不因列举结构而擅自改成单纯并列。
