  text: There is a generation that curses its father and does not bless its mother[a][b].
translation:
  language: zh_hans
  text: 有一类人咒骂父亲，又不祝福母亲。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语直译为“他的父亲……他的母亲”；这里的单数代词泛指这一类人中的个人。
    reason: lexical_alternative
  - marker: b
    text: “不祝福母亲”在这里也可含有“不说好话”或“不尊敬”的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: דּוֹר
  choice: 一类人
  rationale: 该词通常指“世代”，也可指具有共同特征的一群人。此处30:11—14反复描写某一类人；译作“一类人”既符合现代汉语，也保留群体性概括。
- source_word: אָבִיו / אִמּוֹ
  choice: 父亲 / 母亲
  rationale: 希伯来语使用第三人称阳性单数后缀，直译为“他的父亲/他的母亲”。汉语在泛指某类人的格言中自然省略代词，亲属关系仍然明确；脚注说明单数形式。
- source_word: יְקַלֵּל
  choice: 咒骂
  rationale: קלל的Piel形式在此表示咒诅或以轻蔑言语辱骂。“咒骂”既保留言语行为及其严重性，也符合现代汉语表达。
- source_word: לֹא יְבָרֵךְ
  choice: 不给……祝福
  rationale: ברך的Piel通常意为“祝福”。保留“祝福”可维持与“咒骂”的鲜明对照，同时不排除在语境中“说好话、尊敬”的含义。
- source_word: וְאֶת
  choice: 也
  rationale: אֶת是确定直接宾语标记，在汉语中不单独翻译；וְ在本句并列结构中译作“也”，表达另一项相应行为。
