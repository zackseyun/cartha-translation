  text: דֶּ֤רֶךְ הַ/נֶּ֨שֶׁר בַּ/שָּׁמַיִם֮ דֶּ֥רֶךְ נָחָ֗שׁ עֲלֵ֫י צ֥וּר דֶּֽרֶךְ אֳנִיָּ֥ה בְ/לֶב יָ֑ם וְ/דֶ֖רֶךְ גֶּ֣בֶר בְּ/עַלְמָֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/019.yaml
  text: the way of an eagle in the sky[a], the way of a snake on a rock, the way of a ship in the heart of the sea[c][b], and the way of a man with a young woman.
translation:
  language: zh_hans
  text: 鹰[a]在天空飞翔的道，蛇在磐石上爬行的道，船在海中央[b]航行的道，以及男子与年轻女子[c]之间的道。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “鹰”所译的希伯来词也可较广泛地指大型猛禽。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译为“在海的心中”，意思是海中央。
    reason: cultural_note
  - marker: c
    text: “年轻女子”也可译作“少女”。这个希伯来词本身并不必然表示“处女”。
    reason: lexical_alternative
lexical_decisions:
- source_word: דֶּרֶךְ
  choice: 道
  rationale: 原文四次重复这个词，统摄全句；“道”既可指行进的路线，也可指行为或相处的方式，能保留各分句之间的呼应及末句的含蓄。
- source_word: הַנֶּשֶׁר
  choice: 鹰
  rationale: 这是该希伯来词传统而自然的对应词；此词也可能泛指大型猛禽，因此加注说明。
- source_word: בַּשָּׁמַיִם
  choice: 在天空中
  rationale: 此处指飞鸟活动的可见天空，用“天空”比“诸天”更具体自然。
- source_word: נָחָשׁ
  choice: 蛇
  rationale: 采用现代汉语中清楚、常用的名称，不额外引入“古蛇”等宗教联想。
- source_word: עֲלֵי צוּר
  choice: 在磐石上
  rationale: 准确呈现蛇在岩石表面移动的图景；“磐石”保持智慧文学庄重而简洁的语体。
- source_word: אֳנִיָּה
  choice: 船
  rationale: 泛指海上航行的船只；中文“船”自然且不武断限定其大小。
- source_word: בְלֶב יָם
  choice: 在海心
  rationale: 保留原文“在海的心中”这一鲜明意象；中文“海心”可理解为海中央，并以脚注说明。
- source_word: גֶּבֶר
  choice: 男人
  rationale: 原词明确指成年男性，“男人”在现代汉语中直接、自然。
- source_word: בְּעַלְמָה
  choice: 与年轻女子之间
  rationale: עַלְמָה指适婚年龄的年轻女子，本词本身并不必然明确其为处女；介词关系保持含蓄，以“之间”避免把原文限定为求爱、性关系或其他某一种具体情形。
theological_decisions:
- issue: 末句 וְדֶרֶךְ גֶּבֶר בְּעַלְמָה 的含义
  choice: 男人与年轻女子之间的道
  alternative: 男人与处女之间的道；男人在少女身上的道
  rationale: 末句可能涉及男女吸引、交往或更亲密的关系，但希伯来文本表达含蓄。“之间的道”保留这种开放性，不把它明确解释为求爱或性行为，也不把 עַלְמָה 过度限定为“处女”。
translation_notes:
  register: 采用简洁、庄重的现代标准汉语。四次保留“道”，重现原文的排比结构，并让该词同时涵盖飞行路线、爬行轨迹、航程及男女之间难以捉摸的相处情形。所有脚注标记均放在所注释词语之后。
