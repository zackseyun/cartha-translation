base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/018.yaml
  text: 'Three things are too wonderful for me[a]; four I do not understand:'
translation:
  language: zh_hans
  text: '有三样事太奇妙，超过我的理解；

    有四样我也不明白：'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׁלֹשָׁה הֵמָּה
  choice: 有三样事
  rationale: 这是智慧文学中“三……四……”的数字格言句式。中文补出量词“样”和泛指的“事”，表达自然，也为下一节列举的内容作铺垫；代词 הֵמָּה 的强调作用由“有……事”的句式承载。
- source_word: נִפְלְאוּ מִמֶּנִּי
  choice: 对我太奇妙
  rationale: נפלא 表示奇妙、非凡，也可含超出理解范围之意；与 מִמֶּנִּי 连用时，兼具令说话者惊奇和难以参透的意味。“对我太奇妙”保留这种语义张力，并由下句“不能明白”进一步显明。
- source_word: וְאַרְבַּע
  choice: 还有四样
  rationale: 保留连接词 וְ 所表达的递进关系，以自然中文呈现希伯来数字格言常见的 x／x+1 结构。
- source_word: לֹא יְדַעְתִּים
  choice: 是我不能明白的
  rationale: ידע 在这里指认知和领会，而非单纯未曾听闻；宾语后缀 ם 指前述“四样”，在中文关系分句中自然体现，无须另译“它们”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重且口语可懂的表达。保留“三……四……”的平行递进结构，并以冒号引出下一节的具体列举。未加脚注，因为译文已同时保留“奇妙”与“难以理解”两层含义，没有需要另列的实质性异译。
