  naturalness: 原句“这人向以铁所作的宣告，向以铁，向以铁和乌甲”既重复次数有误，也形成不完整、拗口的并列片段。改为“那人向以铁、向以铁和乌甲所作的宣告”可保留原文重复和句法难点，同时使中文句法完整。
