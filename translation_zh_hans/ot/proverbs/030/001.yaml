revisions:
- from: 雅基之子亚古珥的话，就是默示[a]；这人向以铁所作的宣告，向以铁，向以铁和乌甲[b]。
  to: 雅基之子亚古珥的话，是神谕[a]：那人向以铁、向以铁和乌甲所作的宣告[b]。
  rationale: 修正“以铁”的重复次数，使之与马所拉文本的两次出现一致；重组为完整自然的现代书面汉语，同时不消解原文中重复受话对象的困难。将“默示”改为“神谕”，以准确反映所采纳的“oracle”读法；两个有实质影响的替代读法均继续保留于脚注。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T06:59:20Z'
