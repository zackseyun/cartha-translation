base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/001.yaml
  text: 'The words of Agur son of Jakeh[a], the oracle: the declaration of the man to Ithiel[b], to Ithiel and Ucal.'
translation:
  language: zh_hans
  text: 雅基之子亚古珥的话，是神谕[a]：那人向以铁、向以铁和乌甲所作的宣告[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“雅基之子、玛撒人亚古珥的话”，把 הַמַּשָּׂא 看作地方或族群名称“玛撒”，而不是“神谕”。
    reason: alternative_reading
  - marker: b
    text: 末句若采用另一种断词和标音，也可能译作：“我疲乏了，上帝啊；我疲乏了，上帝啊，已经耗尽。”而不是把“以铁”和“乌甲”读作人名。
    reason: alternative_reading
lexical_decisions:
- source_word: דִּבְרֵי
  choice: 话
  rationale: 这是 דָּבָר 的复数构造式，在此引出一组言辞；“话”直接、自然，也不把它过度限定为格言。
- source_word: אָגוּר
  choice: 亚古珥
  rationale: 按现代中文圣经人名的惯常音译处理。
- source_word: בִּן יָקֶה
  choice: 雅基之子
  rationale: בִּן 是标准的亲属称谓；中文采用简洁庄重的“……之子”。
- source_word: הַמַּשָּׂא
  choice: 默示
  rationale: מַשָּׂא 可指郑重的神谕或宣告；“默示”符合中文圣经标题语体。将其视为地名“玛撒”也有可能，故收入脚注。
- source_word: נְאֻם
  choice: 宣告
  rationale: 该词常用于郑重的发言公式；“宣告”保留正式语气而不过分古雅。
- source_word: הַגֶּבֶר
  choice: 这人
  rationale: גֶּבֶר 在这里指发言的人；“这人”能自然承接前面的亚古珥，且不额外强调强壮之意。
- source_word: לְאִיתִיאֵל
  choice: 向以铁
  rationale: 按马所拉元音将 אִיתִיאֵל 视为人名，介词 לְ 取受话对象之意“向”。
- source_word: לְאִיתִיאֵל וְאֻכָל
  choice: 向以铁和乌甲
  rationale: 保留希伯来文本中“以铁”的重复，并按马所拉读法将 וְאֻכָל 视为人名“乌甲”；另一种重新断词、标音的读法置于脚注。
theological_decisions:
- issue: הַמַּשָּׂא 是普通名词还是专名
  choice: 正文译作“默示”
  alternative: 把它理解为地方或族群名称“玛撒”
  rationale: 带冠词的形式及标题语境支持普通名词“默示”，但专名读法由来已久且在语法上仍有可能，因此不在正文中强行排除。
- issue: 末句应读作人名还是陈述疲乏的动词句
  choice: 正文依马所拉元音读作“向以铁，向以铁和乌甲”
  alternative: 重新标音，读作“我疲乏了，上帝啊；我疲乏了，上帝啊，已经耗尽”一类的陈述
  rationale: 正文优先遵循所给 WLC 的马所拉标音，同时以脚注保留会显著改变句义的古老替代分析，避免消除原文的真实难点。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“雅基之子”保留标题式凝练语气；正文保留原文中“向以铁”的重复，不作顺句删减。人名采用中文圣经中较通行的译形：亚古珥、雅基、以铁、乌甲。
