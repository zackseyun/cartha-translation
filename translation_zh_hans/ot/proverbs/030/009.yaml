source:
  edition: WLC
  text: פֶּ֥ן אֶשְׂבַּ֨ע וְ/כִחַשְׁתִּי֮ וְ/אָמַ֗רְתִּי מִ֥י יְה֫וָ֥ה וּ/פֶֽן אִוָּרֵ֥שׁ וְ/גָנַ֑בְתִּי וְ֝/תָפַ֗שְׂתִּי שֵׁ֣ם אֱלֹהָֽ/י׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/009.yaml
  text: lest I become full and deny you and say[b][a], “Who is Yahweh?” or lest I become poor and steal and profane the name of my God.
translation:
  language: zh_hans
  text: '免得我吃饱了，就否认你，说：“雅威是谁？”[a]

    又免得我穷困了，就去偷窃，玷辱我的上帝的名。[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威”对应希伯来文的上帝之名 יהוה（YHWH）；这句话也可理解为傲慢地说：“雅威算谁？”
    reason: 说明神名，并保留反问语气可能具有的轻蔑意味。
  - marker: b
    text: 原文按字面近于“抓住（或攫取）我上帝的名”，含义不完全确定；也可译作“妄用我上帝的名”。这里可能指偷窃使上帝的名蒙受羞辱。
    reason: 保留罕见希伯来表达的词义不确定性及主要译法。
lexical_decisions:
- source_word: פֶּן
  choice: 免得
  rationale: 引出祷告者所担忧并求避免的后果；“免得”自然地保留了希伯来语的警戒语气。
- source_word: אֶשְׂבַּע
  choice: 我吃饱了
  rationale: 保留 שבע 所表达的饱足意象；在上下文中也含生活富足之意，但不在正文中将其抽象化。
- source_word: וְכִחַשְׁתִּי
  choice: 就否认你
  rationale: 该动词可指否认、背弃或虚假对待；结合随后“耶和华是谁”，这里表达因富足而不承认上帝。“你”虽未在此动词后明说，却由祷告语境自然补出。
- source_word: מִי יְהוָה
  choice: 耶和华是谁？
  rationale: 直译其反问形式，保留因自满而轻蔑、不承认上帝的语气，不改写成解释性陈述。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的专名形式呈现四字神名，并在脚注说明其希伯来文性质。
- source_word: אִוָּרֵשׁ
  choice: 我穷困了
  rationale: 该词在此指陷入贫穷或匮乏；“穷困”比单纯“穷”更能表达生活窘迫，同时与前句的饱足形成对照。
- source_word: וְגָנַבְתִּי
  choice: 就去偷窃
  rationale: 直接表达因贫困而可能实施偷盗的结果；“去”使现代汉语的动作衔接更自然。
- source_word: וְתָפַשְׂתִּי שֵׁם אֱלֹהָי
  choice: 玷辱我上帝的名
  rationale: 希伯来文按字面近于“抓住/攫取我上帝的名”，具体习语含义不完全确定。上下文很可能指偷窃使上帝之名蒙羞；正文用“玷辱”传达此意，脚注保留字面形式及“妄用”的可能。
- source_word: אֱלֹהָי
  choice: 我上帝
  rationale: 保留第一人称所属关系，表达祷告者与上帝的直接关系。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 正文采用普通中文读者较熟悉的专名“耶和华”，既不把神名化为称号，也不要求读者接受某一重构读音；脚注说明原文为四字神名。
- issue: ותפשתי שם אלהי 的含义
  choice: 玷辱我上帝的名
  alternative: 妄用我上帝的名；抓住我上帝的名
  rationale: 此罕见表达的字面意义与具体所指并不完全清楚。结合“偷窃”，它很可能指行为使上帝之名受辱；正文作自然中文意译，脚注明确保留字面表达和另一可能译法，避免把含义过度限定为言语上的妄称。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“吃饱”保留具体意象，“穷困”与之构成清楚对照；两个“免得”维持原文平行结构。正文避免生硬直译罕见习语，同时借脚注保留其真实歧义。
