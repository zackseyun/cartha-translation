  yaml_path: translation/ot/proverbs/030/028.yaml
  text: A lizard you can catch with your hands[a], yet it is in kings’ palaces.
translation:
  language: zh_hans
  text: '蜥蜴[a]，你用手就能捉住；

    它却在王宫中。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“蜘蛛”。希伯来语 שְׂמָמִית 是罕见词，含义不能确定；许多传统译本译作“蜘蛛”，另一些则理解为某种蜥蜴或壁虎。
    reason: alternative_reading
lexical_decisions:
- source_word: שְׂמָמִית
  choice: 蜥蜴
  rationale: 这个希伯来词罕见，所指动物不能确定。按本节描写一种能出现在宫殿中的小动物，译作泛称“蜥蜴”较自然，也避免用更具体的“壁虎”过度限定；传统译法“蜘蛛”保留在脚注中。
- source_word: בְּיָדַיִם
  choice: 用手
  rationale: 介词 בְּ 在这里表示手段；“用手”是自然、具体的现代汉语表达。
- source_word: תְּתַפֵּשׂ
  choice: 你……就能捉住
  rationale: 动词为第二人称阳性单数，直译是“你抓住”；这里以泛指的“你”呈现，并用“就能捉住”自然表达这种小动物容易被人抓住的意味。
- source_word: וְהִיא
  choice: 它却
  rationale: 连词与代词在上下句之间形成反差：这种动物虽微小、可被人捉住，却能身处王宫；“却”自然传达这一转折。
- source_word: בְּהֵיכְלֵי מֶלֶךְ
  choice: 住在君王的宫殿里
  rationale: 原文直译近于“在王的宫殿中”。“君王的宫殿”保留王室场景；补出“住”使汉语完整自然，同时没有把所指限定为某一位具体君王。
theological_decisions: []
translation_notes:
  register: 采用简洁、对称的箴言体。首行以话题前置“蜥蜴”保留原文的突出效果；“你”是泛指，并非特定对象。“君王的宫殿”庄重而通俗。
