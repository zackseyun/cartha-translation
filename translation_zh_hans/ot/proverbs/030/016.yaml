base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/016.yaml
  text: Sheol[a], and a barren womb; earth, never satisfied with water; and fire, which never says[c][b], “Enough.”
translation:
  language: zh_hans
  text: 阴间[a]，不生育的子宫[b]；永远喝不饱水的土地；从不说“够了”[c]的火。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “阴间”也可译作“坟墓”或“死人之境”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译近于“子宫被关闭／受阻”，意思是子宫不能生育。
    reason: lexical_alternative
  - marker: c
    text: 原文末尾的希伯来语表达较难确定；许多人理解为“够了！”，也有人认为其含义与“财富”或“财物”有关。
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁאוֹל
  choice: 阴间
  rationale: 此词所指不只是埋葬遗体的坟墓，也可指死人所在的领域；“阴间”简洁保留了这一古代希伯来观念，并避免把含义缩窄为墓穴。
- source_word: עֹצֶר רָחַם
  choice: 不生育的子宫
  rationale: 原文直译近于“子宫的闭锁／抑制”，在此是不能生育的委婉说法；译为“不生育的子宫”既传达惯用含义，又保留原文以子宫为主体的意象。
- source_word: אֶרֶץ
  choice: 土地
  rationale: 这里描写土地不断吸收水的自然景象；“土地”比“地球”具体，也不把词义限定为某一国土。
- source_word: לֹא שָׂבְעָה מַּיִם
  choice: 喝不饱水
  rationale: שׂבע意为“饱足、满足”；用拟人化的“喝不饱水”自然呈现土地永不满足的诗性意象，并与全节列举的无餍之物相合。
- source_word: אֵשׁ
  choice: 火
  rationale: 直接对应原词，并保留火不断吞噬燃料的元素性意象。
- source_word: לֹא אָמְרָה הוֹן
  choice: 从不说“够了”
  rationale: 末词 הוֹן 的解释有困难；按本节“永不满足”的平行结构，“够了”最为连贯，但以脚注保留“财富／财物”等其他可能。
