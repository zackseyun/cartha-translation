id: PRO.30.2
reference: Proverbs 30:2
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּ֤י בַ֣עַר אָנֹכִ֣י מֵ/אִ֑ישׁ וְ/לֹֽא בִינַ֖ת אָדָ֣ם לִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/002.yaml
  text: For I am more brutish than anyone[a], and I do not have human understanding.
translation:
  language: zh_hans
  text: 因为我比人更愚钝[a]，也没有人的悟性。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我愚钝得不配称为人，也没有人的悟性。”
    reason: 原文 מֵאִישׁ 既可按比较结构理解为“比人更”，也可理解为程度过甚，以致“不配称为人”。
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 保留其承接上文、引出解释的连接作用；在现代汉语中自然清楚。
- source_word: בַעַר
  choice: 愚钝
  rationale: 该词表示缺乏理性、近乎兽性的蒙昧；“愚钝”既保留强烈的自谦语气，又比“愚蠢”更庄重。
- source_word: אָנֹכִי
  choice: 我
  rationale: 保留原文明确而略带强调的第一人称代词；汉语无需另加系词。
- source_word: מֵאִישׁ
  choice: 比人更
  rationale: 按 מִן 的比较用法直译，保留单数名词的泛指意义；不擅自加强为“比任何人都”。另一种把它理解为过度程度或不配为人的译法列入脚注。
- source_word: וְלֹא
  choice: 也没有
  rationale: 结合前一分句，使用“也没有”自然表达并列与否定。
- source_word: בִינַת
  choice: 悟性
  rationale: 该名词指理解、辨识和洞察的能力；“悟性”适合智慧文学语境，也能与一般知识相区别。
- source_word: אָדָם
  choice: 人
  rationale: 此处泛指人类，不专指男性；“人的悟性”准确保留构造关系及普遍的人类意义。
- source_word: לִי
  choice: 我……没有
  rationale: 原文以介词结构表达所属，汉语用领有句“我没有”最自然。
theological_decisions:
- issue: אָדָם 是否指男性
  choice: 人的悟性
  alternative: 男人的悟性
  rationale: 此处 אָדָם 具有普遍的人类学意义，并非专指男性；译为“人”既准确又不缩窄所指。
- issue: מֵאִישׁ 的比较结构
  choice: 比人更愚钝
  alternative: 愚钝得不配称为人
  rationale: 正文保留 מִן 最直接的比较意义，不消解说话者强烈的自我贬抑；另一种把结构理解为“太……而不能成为人”的读法在脚注中说明。
translation_notes:
  register: 采用现代、庄重而易懂的智慧文学语体。“比人更愚钝”刻意保留原文略显尖锐的比较表达；脚注呈现另一种有根据的句法理解。
