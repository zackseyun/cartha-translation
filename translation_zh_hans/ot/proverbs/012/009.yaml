  yaml_path: translation/ot/proverbs/012/009.yaml
  text: Better is one who is lightly esteemed and has a servant than one who honors himself and lacks bread[a].
translation:
  language: zh_hans
  text: 被人轻看、却有仆人的，胜过自抬身价、却缺少食物的。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “自抬身价”或译“装作有身份”。原文可指使自己显得尊贵或重要。
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: 宁可……也不要……
  rationale: 该词在这句无系词的比较格言中表达“前者胜于后者”；用现代汉语的“宁可……也不要……”自然、清楚地保留比较意味。
- source_word: נִקְלֶה
  choice: 被人轻看
  rationale: 这个尼法勒分词表示在社会评价中被视为低微、不受重视；“被人轻看”保留被动和荣誉地位的意味，又不至于强化为“被藐视”。
- source_word: וְעֶבֶד לוֹ
  choice: 却有仆人
  rationale: 原文直译为“有一个仆人归他”，表明此人虽地位不高，却有实际家资。“仆人”适合本节的家户语境；“却”凸显外在评价与真实处境的反差。
- source_word: מִמְּתַכַּבֵּד
  choice: 自抬身价
  rationale: כבד 的 Hitpael 分词带反身意味，可指使自己显得尊贵、重要。“自抬身价”既可表达自我尊崇，也可暗含装腔作势，保留原文可能具有的贬义和多义性。
- source_word: וַחֲסַר לָחֶם
  choice: 却缺少食物
  rationale: לֶחֶם 可具体指饼，也常泛指食物；此处与虚假的体面形成对照，重点是连基本生活所需都不足，因此译作现代汉语自然的“缺少食物”。
