  text: אָדָ֣ם עָ֭רוּם כֹּ֣סֶה דָּ֑עַת וְ/לֵ֥ב כְּ֝סִילִ֗ים יִקְרָ֥א אִוֶּֽלֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/023.yaml
  text: A prudent man conceals knowledge[b][a], but the heart of fools proclaims folly.
translation:
  language: zh_hans
  text: 精明人不显露知识[a]；愚昧人的心却宣扬愚妄[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“把知识隐藏起来。”原文动词直译为“遮盖”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“却把愚妄呼喊出来。”
    reason: lexical_alternative
lexical_decisions:
- source_word: אָדָם
  choice: 人
  rationale: 此处单数名词指智慧格言中的个体；现代汉语用“人”自然、准确，无须标明男性。
- source_word: עָרוּם
  choice: 精明
  rationale: 该词可指审慎、精明，也可按语境带有狡猾之意；这里与愚昧人形成对照，宜取正面的“精明”，同时保留善于把握时机、不轻率外露的意味。
- source_word: כֹּסֶה
  choice: 不显露
  rationale: 该分词本义为“遮盖”，在此表示克制地不把知识公开显露；“不显露”比字面的“遮盖”更符合现代汉语，又不暗示不诚实地隐瞒。
- source_word: דָּעַת
  choice: 知识
  rationale: 这是《箴言》中常见的智慧词汇，直译为“知识”，并与下半句的“愚妄”构成鲜明对比。
- source_word: לֵב
  choice: 心
  rationale: 保留希伯来语“心”的意象；此处所指包括人的思想、意向和内在品性。
- source_word: כְּסִילִים
  choice: 愚昧人
  rationale: 这是《箴言》中的典型智慧类别，不仅指智力不足，也涉及道德与属灵上的顽愚；“愚昧人”比口语化的贬称更庄重准确。
- source_word: יִקְרָא
  choice: 宣扬
  rationale: 该动词基本义为“呼喊、叫出”，在本语境中表示公开表露、传播；“宣扬”自然呈现这种外显性。
- source_word: אִוֶּלֶת
  choice: 愚妄
  rationale: “愚妄”是简洁而庄重的智慧文学用语，兼顾错误思想与悖逆行为的含义。
theological_decisions: []
translation_notes:
  register: 采用现代、简洁而庄重的箴言体。上半句用“不显露”表达审慎克制，下半句用“却宣扬”形成公开张扬的鲜明对照；保留“心”这一希伯来语的人观意象。
