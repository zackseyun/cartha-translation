  yaml_path: translation/ot/proverbs/012/025.yaml
  text: Anxiety in a man's heart weighs it down[b][a], but a good word makes it glad.
translation:
  language: zh_hans
  text: 人心中的忧虑使人心低沉[a]；一句好话却使人心欢喜。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“使人心俯伏”或“把人心压低”。希伯来语动词描绘使之被压低、弯下或下沉。
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּאָגָה
  choice: 忧虑
  rationale: 该词指令人不安的挂虑、焦虑；“忧虑”是现代汉语中自然且庄重的对应，也保留其内在心理意味。
- source_word: בְלֶב אִישׁ
  choice: 人心里的
  rationale: 原文直译为“在一个人的心里”。“人心里的”自然表达代表性单数，并保留希伯来语“心”所指向的内在生命。
- source_word: יַשְׁחֶנָּה
  choice: 使心低沉
  rationale: 该使役动词描绘使之降低、俯伏或下沉。“使心低沉”保留被压低的意象，又符合现代汉语表达；原文阴性后缀的所指在语法上存在一定张力，译文依平行结构明确为“心”。
- source_word: וְדָבָר טוֹב
  choice: 美善的话却
  rationale: דָבָר可指话、事情或消息；此处译作“话”保留其宽泛性。“美善”比单纯“好”更庄重而不限定为“亲切”；“却”呈现箴言上下句的反向对照。
- source_word: יְשַׂמְּחֶנָּה
  choice: 使心喜乐
  rationale: 该动词为使役意义，即“使……欢喜”。“使心喜乐”清楚、自然，并与上句“使心低沉”形成平衡。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“人”表达原文代表性单数，不额外突出性别；两句均明说“心”，使中文指代清楚并保留原文的内在生命意象。
