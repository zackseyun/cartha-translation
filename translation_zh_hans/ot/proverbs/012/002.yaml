  yaml_path: translation/ot/proverbs/012/002.yaml
  text: A good man obtains favor from Yahweh[b][a], but a man of schemes he condemns.
translation:
  language: zh_hans
  text: '善人蒙雅威恩宠；

    心怀诡计的人，雅威定罪。[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译可作“计谋之人”。“计谋”一词本身可有中性含义；但在此与“善人”对举，并为雅威所定罪，故这里带有诡诈或邪恶的意味。
    reason: lexical_alternative_and_contextual_clarification
lexical_decisions:
- source_word: טוֹב
  choice: 善人
  rationale: 形容词在此作名词使用，指品格良善的人；“善人”简洁自然，并保留箴言中的广义道德含义。
- source_word: יָפִיק
  choice: 蒙
  rationale: 该动词与“恩宠”连用，表达从雅威获得悦纳或善意；汉语以“蒙……恩宠”最自然，也能体现所得来自雅威。
- source_word: רָצוֹן
  choice: 恩宠
  rationale: 此处指雅威的悦纳、善意或眷顾；“恩宠”兼具神的认可与施恩之意，适合庄重的智慧文学语体。
- source_word: מֵיְהוָה
  choice: 蒙雅威
  rationale: 介词 מִן 表明来源；专名 יהוה 音译为“雅威”，保留经文中的圣名。汉语“蒙雅威恩宠”自然表达恩宠来自雅威。
- source_word: אִישׁ מְזִמּוֹת
  choice: 图谋恶事的人
  rationale: מְזִמּוֹת 本可泛指谋划，但与“善人”形成对比，又是被定罪的对象，语境明显偏负面；“图谋恶事的人”传达邪恶、诡诈谋划，同时以“人”自然表达代表性单数。
- source_word: יַרְשִׁיעַ
  choice: 他必定罪
  rationale: רשע 的使役式常指宣告有罪或定罪；主语承接上句的雅威。“他必定罪”既保留隐含代词，也在汉语中清楚表达司法性的判定。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名，音译“雅威”较贴近学界通常的拟音，也保留其作为专名的性质，不以称号替代。
- issue: 第二分句 יַרְשִׁיעַ 的隐含主语
  choice: 以“他”承接上句的雅威
  alternative: 明说“雅威必定罪”；译成被动式“必被定罪”
  rationale: 希伯来文没有重复主语，最自然的句法理解是承接前句的雅威。使用“他”保留原文的简练和指代结构，而脚注澄清其所指。
- issue: מְזִמּוֹת 的道德色彩
  choice: 按语境译为“图谋恶事”
  alternative: 较中性地译为“谋划”或“计谋”
  rationale: 该词本身可有中性或正面用法，但本节与“善人”对举，并以“定罪”为结局，支持负面理解；译文明确其语境意义，但不进一步限定恶谋的具体内容。
translation_notes:
  register: 采用简洁、对称的现代书面汉语，保持箴言格言式的庄重与力度。“蒙……恩宠”自然体现来源关系；第二句保留原文隐含主语的简练结构，并用脚注消除指代歧义。
