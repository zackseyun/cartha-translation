  yaml_path: translation/ot/proverbs/012/016.yaml
  text: A fool’s anger is known at once[b][a], but a prudent man covers shame.
translation:
  language: zh_hans
  text: 愚人的怒气立刻显露[a]；谨慎人却掩盖羞辱[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“愚人的怒气当天就显露。”希伯来文直译为“在当天”。
    reason: lexical_alternative
  - marker: b
    text: “羞辱”也可指“耻辱、蒙羞的事”或“所受的侮辱”。本句也可译：“谨慎人却不显露所受的侮辱。”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱוִיל
  choice: 愚人
  rationale: 在《箴言》中指道德和行事上愚昧的人，并非仅指智力不足；“愚人”简洁自然，也符合智慧文学的固定人物类型。
- source_word: בַּיּוֹם
  choice: 立刻
  rationale: 字面为“在当天”，在此格言语境中表达怒气立即显露；正文用自然汉语“立刻”，脚注保留较为直译的可能。
- source_word: יִוָּדַע
  choice: 显露
  rationale: 该词为ידע的Nifal形式，表示“被知道、变得明显”；“显露”在汉语中自然传达怒气为人所知的被动结果。
- source_word: כַּעְסוֹ
  choice: 怒气
  rationale: 可指愤怒、恼怒或烦恼；“怒气”最贴合上下文中愚人缺乏克制的表现。
- source_word: וְכֹסֶה
  choice: 却遮掩
  rationale: כסה意为遮盖、隐藏；“遮掩”保留原文比喻，而连接词按上下句对照译为“却”。
- source_word: קָלוֹן
  choice: 羞辱
  rationale: 该词语义包括羞耻、耻辱、羞辱或冒犯；此处既可指临到人的侮辱，也可指使人蒙羞的事，正文采用“羞辱”并以脚注保留歧义。
- source_word: עָרוּם
  choice: 精明人
  rationale: 在《箴言》中通常正面表示谨慎、机敏而有辨别力的人；“精明人”简洁地与“愚人”构成对照，且不引入欺诈含义。
