  yaml_path: translation/ot/proverbs/012/010.yaml
  text: A righteous man knows the life of his animal[a], but the compassion of the wicked is cruel.
translation:
  language: zh_hans
  text: 义人了解自己牲畜的需要[a]；恶人的怜悯却是残忍。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“义人知道自己牲畜的生命。”希伯来文直译为“知道自己牲畜的生命”，表达他留意这活物的生存状况和福祉。
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹדֵעַ
  choice: 留心
  rationale: 该词的词义核心是“知道、了解”；在本句中指因了解牲畜的生命状况而对其福祉有所顾念。“留心”在现代汉语中既保留认知含义，也自然传达专注照料的语境意味，而不直接增译为“照顾”或“爱护”。
- source_word: צַדִּיק
  choice: 义人
  rationale: 这是智慧文学中对正直之人的常用称谓，简洁庄重；希伯来文为阳性单数，但汉语“义人”本身不标示性别，仍保留单数类称的箴言表达。
- source_word: נֶפֶשׁ
  choice: 生命
  rationale: נֶפֶשׁ可指生命、性命、自我或生存状态。用于牲畜时，“生命”最贴近字面，又能涵盖其生活状况与需要，避免“灵魂”在现代汉语中可能引起的误解。
- source_word: בְּהֶמְתּוֹ
  choice: 自己的牲畜
  rationale: בְּהֵמָה可泛指兽类、家畜或牲畜；这里带第三人称单数所属后缀。“自己的牲畜”自然表达所属关系，也不把范围缩限为牛。
- source_word: רַחֲמֵי
  choice: 怜悯
  rationale: 该复数构造形式可指怜悯之情或怜悯的表现。汉语“怜悯”简明自然，并保留其情感与伦理色彩。
- source_word: רְשָׁעִים
  choice: 恶人
  rationale: 这是箴言中对邪恶之人的惯用类称，与前半句单数“义人”形成概念上的对照；汉语无需机械标出原文复数。
- source_word: אַכְזָרִי
  choice: 残忍
  rationale: 该词意为残酷、无情。“残忍”直接有力，保留原句中“怜悯”竟为“残忍”的尖锐反讽。
theological_decisions:
- issue: 箴言主体的阳性单数形式
  choice: 义人
  alternative: 正直的人／一个义人男子
  rationale: 希伯来文צַדִּיק为阳性单数，并在智慧文学中作典型人物类称。现代汉语“义人”自然、庄重且不强行加入原文没有明说的“男子”，同时也不把单数表达改写为复数。
- issue: 恶人之“怜悯”与“残忍”的关系
  choice: 恶人的怜悯却是残忍
  alternative: 恶人最怜悯的行为也是残忍的／恶人的内心是残忍的
  rationale: 原文有意形成悖论式对照，可理解为恶人所谓的怜悯本身仍属残忍。译文保留这一神学与伦理张力，不将其解释性改写为行为程度或内心状态。
translation_notes:
  register: 采用现代、庄重而易懂的箴言体。前后两分句以分号和“却”强化义人与恶人的对照；保留“生命”的源语意象，并用脚注说明语境中“需要、福祉”的含义。
