base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/018.yaml
  text: There is one who speaks rashly like the thrusts of a sword[b][a], but the tongue of the wise brings healing.
translation:
  language: zh_hans
  text: 有人说话轻率，如刀剑的刺击；智慧人的舌头却带来医治。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “带来医治”或译“是良药”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵשׁ בּוֹטֶה
  choice: 有人说话轻率
  rationale: יֵשׁ引出某一类人的存在，分词בּוֹטֶה描写不加约束、轻率冒失的言语；合译为“有人说话轻率”，自然且保留道德含义。
- source_word: כְּמַדְקְרוֹת חָרֶב
  choice: 如刀剑刺人
  rationale: מַדְקְרוֹת为复数，指刺击或刺伤；中文以“如刀剑刺人”传达言语造成伤害的鲜明比喻，而不生硬复制复数形式。
- source_word: וּלְשׁוֹן חֲכָמִים
  choice: 智慧人的舌头却
  rationale: 保留“舌头”这一希伯来语的转喻，并以“却”表达上下句之间的强烈对比；חֲכָמִים泛指有智慧的人。
- source_word: מַרְפֵּא
  choice: 是良药
  rationale: 该词可指医治、疗效或药物；“是良药”保留原文名词性判断句和恢复、医治的意象，同时符合中文箴言体。
theological_decisions:
- issue: מַרְפֵּא的语法与语义
  choice: 是良药
  alternative: 带来医治
  rationale: 原文无明示系词，可理解为“舌头是医治/良药”。采用名词性表达，不把原文的结果或身份关系限定为单一的使动含义。
translation_notes:
  register: 采用现代、凝练而庄重的箴言体。“轻率”准确表达不受约束的言语；“刀剑刺人”形象易懂；“智慧人的舌头”保留原文意象。脚注标记置于相关分句末。
