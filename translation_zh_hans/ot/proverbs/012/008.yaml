  text: לְֽ/פִי שִׂ֭כְל/וֹ יְהֻלַּל אִ֑ישׁ וְ/נַעֲוֵה לֵ֝֗ב יִהְיֶ֥ה לָ/בֽוּז־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/008.yaml
  text: A man is praised according to his insight[b][a], but one with a twisted heart will be despised.
translation:
  language: zh_hans
  text: 人按自己的聪慧受称赞，心地乖僻的却被藐视。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“心乖僻的”，指人的内在思想、意志和品性偏离正直。
    reason: cultural_note
lexical_decisions:
- source_word: לְפִי
  choice: 按
  rationale: 此短语本义近于“照着……”，在本节表示衡量或相称的标准；“按”简洁自然，并保留称赞与聪慧程度相应的含义。
- source_word: שִׂכְלוֹ
  choice: 自己的聪慧
  rationale: שֵׂכֶל兼有理解力、明智和审慎之意。“聪慧”符合智慧文学语境，也保留认知与处世判断两方面的色彩。
- source_word: יְהֻלַּל
  choice: 受称赞
  rationale: Pual形态表达被动意义。汉语一般现在式适合格言所陈述的普遍情形，无须明确译成将来时。
- source_word: אִישׁ
  choice: 人
  rationale: 原文为阳性单数，但在箴言中作泛指；现代汉语“人”自然涵盖一般的人，同时不增添原文没有的性别对比。
- source_word: נַעֲוֵה
  choice: 乖僻
  rationale: 该词描写偏离正直、扭曲的状态，在这里具有道德意味。“乖僻”与“心地”搭配自然，并传达内在品性不正。
- source_word: לֵב
  choice: 心地
  rationale: 希伯来语לֵב涵盖思想、意志与品格，不只指情感。此处译作“心地”能自然表达人的内在道德倾向；脚注说明其字面表达。
- source_word: יִהְיֶה לָבוּז
  choice: 却被藐视
  rationale: 这一结构直译近于“成为藐视的对象”。“被藐视”准确表达结果；“却”呈现两分句的对照。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的箴言体。两分句结构紧凑、对称；“聪慧”避免把שֵׂכֶל缩窄为纯粹智力，“心地乖僻”则保留原文的道德性内在隐喻。脚注标记置于相关分句之后。
