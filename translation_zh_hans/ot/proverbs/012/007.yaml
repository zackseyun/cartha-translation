  yaml_path: translation/ot/proverbs/012/007.yaml
  text: The wicked are overthrown and are no more[b][a], but the house of the righteous will stand.
translation:
  language: zh_hans
  text: 恶人被倾覆，便不复存在[a]；义人的家却必站立[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“他们就不在了。”
    reason: lexical_alternative
  - marker: b
    text: “家”也可指“家庭”或“家族”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הָפוֹךְ
  choice: 一被倾覆
  rationale: 该形式在箴言中作省略式、结果性表达；译作“一被倾覆”既体现被动倾覆，也自然衔接下句“不复存在”，而不把希伯来语硬译成名词式表达。
- source_word: רְשָׁעִים
  choice: 恶人
  rationale: 复数形容词名词化，指道德上邪恶的人；“恶人”简洁自然，也符合现代汉语箴言体。
- source_word: וְאֵינָם
  choice: 就不复存在
  rationale: 字面为“他们不在了／他们不存在”；“不复存在”保留灭亡、消失的结果，却不额外说明其方式。
- source_word: וּבֵית
  choice: 义人的家却
  rationale: בַּיִת 可指房屋，也可指家庭、家族或家业。正文保留宽泛的“家”，以维持原文的多义性；连接词按上下句对照关系译为“却”。
- source_word: צַדִּיקִים
  choice: 义人
  rationale: 复数形容词名词化，表示合乎正义的人；“义人”是清楚、凝练且适合智慧文学语境的译法。
- source_word: יַעֲמֹד
  choice: 必站立得稳
  rationale: 动词本义为“站立”；此处与恶人被倾覆形成对照，并含稳固、长存之意。“站立得稳”兼顾具体意象和语境含义。
