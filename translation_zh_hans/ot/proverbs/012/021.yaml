  text: לֹא יְאֻנֶּ֣ה לַ/צַּדִּ֣יק כָּל אָ֑וֶן וּ֝/רְשָׁעִ֗ים מָ֣לְאוּ רָֽע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/021.yaml
  text: No harm will happen to the righteous, but the wicked are filled with trouble.
translation:
  language: zh_hans
  text: 任何祸患都不会临到义人；恶人却祸患满身。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “祸患”所译的两个希伯来词都可涉及“邪恶”或“灾祸、患难”；这里的平行结构更侧重邪恶所带来的祸患。
    reason: 保留 אָוֶן 与 רָע 在道德之恶和灾祸之间的语义张力。
lexical_decisions:
- source_word: יְאֻנֶּה
  choice: 临到
  rationale: 该动词在此表示某事发生在某人身上；“临到”自然地保留“遭遇、落到身上”的含义。
- source_word: צַּדִּיק
  choice: 义人
  rationale: 这是智慧文学中对行事正直、符合公义之人的常用称呼。
- source_word: אָוֶן
  choice: 祸患
  rationale: 该词可指邪恶、罪孽，也可指由此而来的患难或灾害；本句与“临到”搭配时，“祸患”最合乎汉语语境。
- source_word: רְשָׁעִים
  choice: 恶人
  rationale: 保留箴言中“义人—恶人”的典型对照。
- source_word: מָלְאוּ רָע
  choice: 祸患满身
  rationale: 既传达“充满”的强烈程度，也以自然汉语表达恶人被灾祸包围；避免将原文的 רָע 仅限于道德邪恶。
theological_decisions:
- issue: 义人是否绝不会经历任何苦难
  choice: 按原文保留绝对式的箴言表达“任何祸患都不会临到义人”
  alternative: 弱化为“义人通常不会遭遇祸患”或解释为“最终不会受害”
  rationale: 希伯来原文使用否定词与“任何/一切”形成强烈断言；箴言的格言体性质不应通过增添“通常”或“最终”而被正文预先解释。
- issue: רָע 指道德邪恶还是灾祸
  choice: 正文译为“祸患”，脚注说明其语义范围
  alternative: 译为“邪恶”，表示恶人里面充满罪恶
  rationale: 与上半句的 אָוֶן 及“临到”形成的平行关系更倾向于患难、灾祸，但原词仍具有“恶”的道德含义，因此不完全消除歧义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“祸患满身”比直译“充满祸患”更自然，同时保留下半句“充满”的形象和上下句的鲜明对照。
