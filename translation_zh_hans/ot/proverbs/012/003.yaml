  text: לֹא יִכּ֣וֹן אָדָ֣ם בְּ/רֶ֑שַׁע וְ/שֹׁ֥רֶשׁ צַ֝דִּיקִ֗ים בַּל יִמּֽוֹט־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/003.yaml
  text: A man is not established by wickedness[b][a], but the root of the righteous will not be moved.
translation:
  language: zh_hans
  text: 人不能因邪恶而得以稳固；义人的根必不动摇。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִכּוֹן
  choice: 立稳
  rationale: 该词是כון的尼法勒式，表示被建立、变得稳固。中文“立稳”简洁保留结果状态，也适合箴言的一般性陈述。
- source_word: אָדָם
  choice: 人
  rationale: 此处单数泛指具有代表性的个体。现代汉语用“人”自然涵盖泛指意义，无须添加性别含义。
- source_word: בְּרֶשַׁע
  choice: 靠邪恶
  rationale: 介词ב在此最自然地表示手段或凭借；“靠邪恶”清楚表达邪恶不能成为持久稳固的基础。
- source_word: שֹׁרֶשׁ
  choice: 根
  rationale: 保留具体的植物隐喻，表达生命、扎根和稳固，并与上半句“立稳”相呼应。
- source_word: צַדִּיקִים
  choice: 义人
  rationale: 复数形容词名词化，指义人这一类人；中文“义人”简练且符合智慧文学语体。
- source_word: בַּל
  choice: 不
  rationale: 这是诗体否定词，在此加强否定；结合箴言的确定语气译为“必不”，但不把它扩展成绝对时间副词“永不”。
- source_word: יִמּוֹט
  choice: 动摇
  rationale: מוט表示移动、摇动或倾覆。“动摇”自然传达失去稳固的意象，并适合修饰比喻性的“根”。
theological_decisions:
- issue: 箴言中אָדָם的泛指单数
  choice: 译作“人”
  alternative: 译作“一个人”或“男人”
  rationale: 希伯来语在此泛指任何个体，并非强调男性。现代汉语“人”既保留单数泛指功能，也避免无根据地限定性别。
- issue: 义人稳固性的表达
  choice: “义人的根必不动摇”
  alternative: “义人的根不被挪动”或“义人的根永不摇动”
  rationale: 保留原文“根”的隐喻及强烈否定，同时不把箴言的道德概括扩展为超出文本的系统性保证。
translation_notes:
  register: 采用简洁、对称的现代书面汉语，保留希伯来诗句中“立稳／动摇”的稳定性对照和“根”的具体意象。句式庄重但不古奥，适合普通现代读者。
