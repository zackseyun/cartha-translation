base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/012.yaml
  text: A wicked man desires the prey of evil men[b][a], but the root of the righteous yields fruit.
translation:
  language: zh_hans
  text: 恶人贪图作恶之人所得的猎物[a]；义人的根却结出果实[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“恶人贪图作恶之人的网罗。”希伯来语 מְצוֹד 的含义难以确定，可指网、陷阱、猎物，或掠夺物；正文采用“猎物”这一可能的理解。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“义人的根给出”；这里把可能隐含的植物意象译明为“结出果实”。
    reason: lexical_alternative
lexical_decisions:
- source_word: חָמַד
  choice: 贪图
  rationale: 该动词表示强烈欲求；结合主语“恶人”和所欲之物，用“贪图”自然体现上下文中的负面意味，同时不必另加道德评断。
- source_word: רָשָׁע
  choice: 恶人
  rationale: 这是单数形容词的名词化用法，泛指一个邪恶的人；“恶人”简洁、自然，并符合箴言的格言体。
- source_word: מְצוֹד
  choice: 猎物
  rationale: 此词词义困难，可指网罗、陷阱、猎物或掠物。正文采用“猎物”，既保留捕捉所得之物的意象，也能与下句义人之根的产出形成对照；其他可能性收入脚注。
- source_word: רָעִים
  choice: 作恶者
  rationale: 复数形容词名词化，指行恶的人。“作恶者”能与前面的“恶人”有所区分，并自然表达复数类别意义。
- source_word: שֹׁרֶשׁ
  choice: 根
  rationale: 原文使用植物意象；直译为“根”可保留与结果、生命力及稳固性相关的诗性画面。
- source_word: צַדִּיקִים
  choice: 义人
  rationale: 复数形容词名词化，泛指正直公义的一类人；现代中文通常用“义人”表达这一智慧文学术语。
- source_word: יִתֵּן
  choice: 结出果实
  rationale: 该动词字面义为“给出”。以“根”为主语时，原文很可能省略了植物所产之物；译作“结出果实”使中文完整自然，同时保留农业意象。
