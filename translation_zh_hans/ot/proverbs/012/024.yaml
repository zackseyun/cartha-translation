  text: יַד חָרוּצִ֥ים תִּמְשׁ֑וֹל ו֝/רְמִיָּ֗ה תִּהְיֶ֥ה לָ/מַֽס־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/024.yaml
  text: The hand of the diligent will rule[b][a], but the slack will be put to forced labor.
translation:
  language: zh_hans
  text: 勤劳的人必作管理者；懒散的人却要服劳役。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “劳役”指强制性的服役或劳动，也可译作“苦役”。
    reason: cultural_note
lexical_decisions:
- source_word: יַד
  choice: 手
  rationale: 保留希伯来文具体意象；“手”在此转指人的行动能力，现代汉语也能自然理解。
- source_word: חָרוּצִים
  choice: 勤劳人
  rationale: 表达殷勤、勤奋做事的人，并与下句的懒散形成鲜明对照。
- source_word: תִּמְשׁוֹל
  choice: 必掌权
  rationale: 该动词意为统治、管辖；“掌权”简洁自然，也保留由勤劳而居于管理地位的含义。
- source_word: רְמִיָּה
  choice: 懒散的人
  rationale: 该词可指松懈、懒惰，也可在其他语境表示诡诈；本节与“勤劳人”相对，语境支持人的懒散或怠惰。
- source_word: תִּהְיֶה
  choice: 要
  rationale: 结合后面的介词短语译出将来的处境，避免生硬直译“成为”。
- source_word: לָמַס
  choice: 服劳役
  rationale: מַס在此指受支配者承担的强制性劳役，而非单指金钱税赋；“服劳役”清楚表达其受役使的处境。
