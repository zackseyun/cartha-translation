base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/020.yaml
  text: Deceit is in the heart of those who devise evil[b][a], but joy belongs to those who counsel peace.
translation:
  language: zh_hans
  text: 图谋恶事的人，心中有诡诈；为和平[b]献策的人，却有喜乐[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“喜乐归于为和平献策的人。”
    reason: lexical_alternative
  - marker: b
    text: “和平”（shalom）也可包含平安、福祉或完整健全的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִרְמָה
  choice: 诡诈
  rationale: 该名词指欺骗、奸诈的意图或品性。“诡诈”简洁庄重，也能自然表达藏在内心的恶意。
- source_word: בְּלֶב
  choice: 心中有
  rationale: “心”在此指思想、意图和内在品格的中心；希伯来语无明示系词，汉语补出“有”使句子自然。
- source_word: חֹרְשֵׁי רָע
  choice: 图谋恶事的人
  rationale: 分词 חֹרְשֵׁי 在此有策划、谋算之意；“图谋恶事”保留蓄意筹划的意味，不弱化为一般的作恶。
- source_word: וּלְיֹעֲצֵי שָׁלוֹם
  choice: 为和平出谋的人
  rationale: יֹעֲצֵי 指提供谋议、筹策的人。“为和平出谋”既保留其主动谋划和劝策的含义，也与上句“图谋恶事”形成鲜明对照。
- source_word: שָׁלוֹם
  choice: 和平
  rationale: “和平”符合本节与恶事相对的语境；脚注说明该词也可涵盖平安、福祉与完整健全。
- source_word: שִׂמְחָה
  choice: 有喜乐
  rationale: 原文是无系词的名词句，直陈喜乐归于这一类人。“有喜乐”在现代汉语中自然，并保留其简洁断言。
theological_decisions:
- issue: 后半句 לְ 所表达的关系
  choice: 译作“为和平出谋的人，却有喜乐”
  alternative: “喜乐归于为和平出谋的人”
  rationale: 原文只用介词 לְ 加名词“喜乐”，可以理解为这类人有喜乐或喜乐归给他们；正文采用自然汉语表达，脚注保留另一种关系表述，避免把它细化为未经明说的奖赏机制。
translation_notes:
  register: 采用简洁、对称、适合箴言体的现代标准汉语。“图谋恶事”与“为和平出谋”尽量呈现原文两组分词结构的对照；整体庄重但避免古奥措辞。
