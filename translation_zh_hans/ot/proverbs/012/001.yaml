id: PRO.12.1
reference: Proverbs 12:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אֹהֵ֣ב מ֭וּסָר אֹ֣הֵֽב דָּ֑עַת וְ/שֹׂנֵ֖א תוֹכַ֣חַת בָּֽעַר׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/001.yaml
  text: Whoever loves discipline loves knowledge[a], but he who hates reproof is stupid.
translation:
  language: zh_hans
  text: 喜爱管教的，就是喜爱知识；恨恶责备的，却是愚顽人。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“像牲畜一样愚钝”。希伯来语形容词 בָּעַר 可指迟钝、无知或近乎兽性的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹהֵב
  choice: 喜爱……的
  rationale: 希伯来语分词在箴言中表达泛指，译为“喜爱……的”自然地涵盖任何这样的人，不刻意保留阳性单数形式。
- source_word: מוּסָר
  choice: 管教
  rationale: 该词在《箴言》中兼有教导、训练和纠正之意；“管教”能体现其塑造性与纠正性。
- source_word: דָּעַת
  choice: 知识
  rationale: 这是该词在智慧文学中的常见对应，也保留了本节关于借管教获得知识的主题。
- source_word: וְשֹׂנֵא
  choice: 却恨恶
  rationale: 连接词在对偶结构中表示鲜明转折，因此用“却”而非简单的“和”。
- source_word: תוֹכַחַת
  choice: 责备
  rationale: 该词指以言语指出错误、加以纠正；“责备”简洁自然，符合现代汉语的箴言语体。
- source_word: בָּעַר
  choice: 愚顽人
  rationale: 该形容词描述迟钝、无知、近乎兽性的人。“愚顽人”保留尖锐的道德评价，同时比“蠢人”更庄重，适合经文语体。
theological_decisions: []
translation_notes:
  register: 采用现代、简洁而庄重的箴言语体。前后两句保持反义对偶，以“就是……；……却是……”呈现判断的力度；末句用“愚顽人”避免过度口语化，同时脚注保留原词“兽性、愚钝”的语义幅度。
