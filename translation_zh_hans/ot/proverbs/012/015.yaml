  yaml_path: translation/ot/proverbs/012/015.yaml
  text: The way of a fool is right in his own eyes[b][a], but he who listens to counsel is wise.
translation:
  language: zh_hans
  text: 愚昧人所行的路，在自己眼中是对的[a]；听从劝告的，却是智慧人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在自己眼中”是希伯来语惯用说法，指按自己的判断；全句也可意译为“愚昧人自以为所行的路是对的”。
    reason: cultural_note_and_lexical_alternative
lexical_decisions:
- source_word: דֶּרֶךְ
  choice: 所行的路
  rationale: 保留箴言中“道路”指人生行径或处世方式的比喻，同时使现代汉语表达自然。
- source_word: אֱוִיל
  choice: 愚昧人
  rationale: 该词在箴言中兼有道德与认知上的缺乏智慧之意；“愚昧人”符合智慧文学的庄重语域。
- source_word: יָשָׁר
  choice: 是正的
  rationale: 此处表示按本人判断为正确，并非断言其行径客观正直；与“在自己眼中”连用可保留原文的反讽张力。
- source_word: בְּעֵינָיו
  choice: 在自己眼中
  rationale: 直译并保留希伯来语惯用表达，意为按自己的判断或自我评估。
- source_word: וְשֹׁמֵעַ
  choice: 听从……的
  rationale: 分词表示一类以听取意见为特征的人；汉语用“……的”自然表达泛指。连接词按上下句对照关系处理为分号后的转折性对举。
- source_word: לְעֵצָה
  choice: 劝告
  rationale: עֵצָה 在此指可供采纳的意见或忠告；“劝告”比“谋略”更贴合听从他人指教的语境。
- source_word: חָכָם
  choice: 才是智慧人
  rationale: 保留名词性对举，使“愚昧人”与“智慧人”结构相称；“才”凸显原句的反差，但不增添新的命题内容。
theological_decisions:
- issue: 阳性单数形式在泛指箴言中的表达
  choice: 采用“愚昧人……自己……听从劝告的”这一不标明生理性别的泛指结构
  alternative: 译作“他自己……听从劝告的人”
  rationale: 希伯来语阳性单数在此具有代表性、泛指功能；现代汉语无需借助性别代词即可准确保留单数人物类型的对照，也不改变适用范围。
- issue: יָשָׁר 是客观正直还是主观自以为正确
  choice: 译作“在自己眼中是正的”
  alternative: 译作“自以为正确”或“在他看来是正直的”
  rationale: 原文借“在自己眼中”限定评价视角，既揭示主观判断，又未明说“似乎”或“自以为”；直译可保留这种语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的箴言体。上下句以“愚昧人／智慧人”形成鲜明对举；保留“道路”和“在自己眼中”的希伯来智慧文学意象，并用脚注说明其惯用含义。
