  text: תּוֹעֲבַ֣ת יְ֭הוָה שִׂפְתֵי שָׁ֑קֶר וְ/עֹשֵׂ֖י אֱמוּנָ֣ה רְצוֹנֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/022.yaml
  text: Lying lips are an abomination to Yahweh[a], but those who act faithfully are his delight.
translation:
  language: zh_hans
  text: 说谎的嘴唇是雅威所憎恶的；行事忠信[a]的人却是他所喜悦的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“行事信实”、“按诚实而行”或“为人可靠”。
    reason: 原词 אֱמוּנָה 可表示忠实、真实、可信或可靠；在“行事”的结构中存在数种相近译法。
lexical_decisions:
- source_word: תּוֹעֲבַת
  choice: 所憎恶的
  rationale: 该词表示在道德或宗教意义上极其可憎之物。译为“所憎恶的”在现代汉语中自然有力，并保留原文强烈的伦理评价。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文四字神名作音译，保留其作为以色列之上帝专名的性质，而不以“主”这一称号替代。
- source_word: שִׂפְתֵי שָׁקֶר
  choice: 说谎的嘴唇
  rationale: 原文直译为“虚假的嘴唇”。“说谎的嘴唇”保留身体部位的喻说，同时符合现代汉语表达。
- source_word: וְעֹשֵׂי
  choice: 却是……行事的人
  rationale: 分词指持续从事或实行某事的人。上下句构成反义平行，因此将连接词按语境译为“却”，清楚呈现对比。
- source_word: אֱמוּנָה
  choice: 忠信
  rationale: 该名词可指忠实、真实、可靠或可信。与“行事”连用时，“行事忠信”既自然，又保留行为中诚实可靠与忠诚守信的复合含义。
- source_word: רְצוֹנוֹ
  choice: 他所喜悦的
  rationale: 该词可表示喜悦、悦纳或恩宠。这里与“所憎恶的”相对，“他所喜悦的”自然地保留鲜明的关系性对照。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。译作“雅威”旨在以现代汉语音译呈现此专名，不以称号“主”取代；“耶和华”则是汉语传统中沿用的另一种形式。
- issue: אֱמוּנָה 在本节中的含义
  choice: 忠信
  alternative: 诚实；信实；可靠
  rationale: 该词的语义范围同时涉及真实、忠实和可靠。译文不把它限缩为单纯不说谎，而以“忠信”保留较宽的品格与行为含义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。保留“嘴唇”的希伯来诗歌意象，并用“所憎恶的／所喜悦的”呈现两行之间的反义平行。
