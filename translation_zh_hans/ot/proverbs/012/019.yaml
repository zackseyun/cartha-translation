  text: A truthful lip is established forever[b][a], but a lying tongue lasts only a moment.
translation:
  language: zh_hans
  text: 诚实的嘴唇永远坚立[a]；说谎的舌头只存留片刻[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较直译：“真实的嘴唇永远坚立。”
    reason: lexical_alternative
  - marker: b
    text: “只存留片刻”所对应的希伯来语表达较难确定；从它与“永远”的对照来看，意思是虚假言语只能短暂存在。
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂפַת אֱמֶת
  choice: 诚实的嘴唇
  rationale: 该短语直译为“真理／真实的嘴唇”。译作“诚实的嘴唇”既保留希伯来文以身体部位代指言语的具体意象，也符合现代汉语表达。
- source_word: תִּכּוֹן
  choice: 坚立
  rationale: כון的Nifal形式表示被确立、稳固或长久站立；“坚立”兼顾稳固和持久之意，也适合箴言的凝练语体。
- source_word: לָעַד
  choice: 永远
  rationale: 表示长久、恒常，与下半句的短暂形成鲜明对照。
- source_word: וְעַד
  choice: ；
  rationale: 连接词字面可作“而／直到”，但这里构成对偶性的反义平行；以分号呈现转折对比，避免添加原文没有的过强逻辑词。
- source_word: אַרְגִּיעָה
  choice: 只存片刻
  rationale: 该形式释义有困难；在上下文中通常理解为极短的时间。“只存片刻”补出汉语所需的谓语，并保留它与“永远”的时间对照。
- source_word: לְשׁוֹן שָׁקֶר
  choice: 说谎的舌头
  rationale: 直译近于“虚假的舌头”。“说谎的舌头”在现代汉语中自然，同时保留“舌头”作为言语的具体隐喻。
