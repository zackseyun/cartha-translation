  text: בְּ/אֹֽרַח צְדָקָ֥ה חַיִּ֑ים וְ/דֶ֖רֶךְ נְתִיבָ֣ה אַל מָֽוֶת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/028.yaml
  text: In the path of righteousness is life[a], and in its pathway there is no death.
translation:
  language: zh_hans
  text: 公义之路有生命[a]；其路径上没有死亡。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“其路径是不死（或不朽）。”希伯来语下半句含义难定。
    reason: alternative_reading
lexical_decisions:
- source_word: בְּאֹרַח
  choice: 在……路上
  rationale: אֹרַח指道路、路径，也可比喻人生或道德取向；前缀בְּ保留为处所性的“在……上”。
- source_word: צְדָקָה
  choice: 公义
  rationale: צְדָקָה可指正直、公正或合乎正道；在智慧文学的道德语境中，“公义”既简洁庄重，也保留其伦理与关系层面的广度。
- source_word: חַיִּים
  choice: 生命
  rationale: 该词形式上为复数，但在希伯来语中通常作为表示“生命”的惯用名词；中文用单数概念“生命”自然准确。
- source_word: וְדֶרֶךְ נְתִיבָה
  choice: 它的路径上
  rationale: 原文由两个意义相近的道路词构成，句法高度凝练。译文以“它的路径”回指前半句的公义之路，并补出方位词“上”，使平行关系在中文中清楚而不过度解释。
- source_word: אַל
  choice: 没有
  rationale: אַל通常是否定或禁止词；此处结合诗句对仗，按否定意义处理，以“没有”表达公义之路与死亡相排斥。
- source_word: מָוֶת
  choice: 死亡
  rationale: מָוֶת直接指死亡；保留这一明确用词，与前句“生命”形成鲜明对照。
theological_decisions:
- issue: 难解的下半句 וְדֶרֶךְ נְתִיבָה אַל־מָוֶת 如何理解
  choice: 正文译为“它的路径上没有死亡”，将אַל按否定词理解。
  alternative: “它的路径通向不死（或不朽）。”
  rationale: 马所拉文本句法凝练且含义有争议。正文采用最直接保留“生命—死亡”对照的理解，不以推测性校勘改动经文；脚注列出“不死／不朽”的传统理解，以保存原文的解释张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“公义的路上有生命”保留希伯来诗歌的道路隐喻和存在句结构；下半句略作中文句法补足，但不消除原文的歧义。
