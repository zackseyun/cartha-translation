base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/013.yaml
  text: In the transgression of the lips there is a snare for an evil man[b][a], but the righteous comes out of trouble.
translation:
  language: zh_hans
  text: 口舌[a]的过犯，是恶人的网罗[b]；义人却脱离患难。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “口舌”字面为“嘴唇”，在这里指人所说的话。
    reason: lexical_alternative
  - marker: b
    text: 或译：“恶人因口舌的过犯陷入网罗。”希伯来文十分紧凑，“口舌的过犯”与“网罗”之间既可理解为所在的范围，也可理解为导致陷入网罗的手段或原因。
    reason: alternative_reading
lexical_decisions:
- source_word: בְּפֶשַׁע
  choice: 在“过犯”名词结构中译作“……的过犯”
  rationale: פֶשַׁע指越界、悖逆或过犯；此处与“嘴唇”构成紧凑短语。介词בְּ可表示范围，也可表示手段或原因，正文采用自然的汉语判断句，具体关系另以脚注保留。
- source_word: שְׂפָתַיִם
  choice: 嘴唇
  rationale: 保留希伯来的身体部位意象；在本节中是指嘴唇所发出的言语，脚注予以说明。
- source_word: מוֹקֵשׁ
  choice: 网罗
  rationale: מוֹקֵשׁ指捕捉猎物的套索或陷阱。“网罗”既保留智慧文学中的捕捉意象，也符合庄重的现代汉语表达。
- source_word: רָע
  choice: 恶人
  rationale: 此处形容词作名词，指邪恶的人，并与后半句的“义人”形成鲜明对照。
- source_word: וַיֵּצֵא
  choice: 脱离
  rationale: 字面义为“出来、走出”。在“患难”这一搭配中，“脱离”是自然的现代汉语，同时表达从困境中出来的结果。
- source_word: מִצָּרָה
  choice: 患难
  rationale: צָרָה可指困苦、危难或灾祸；“患难”适合箴言的语域，并能涵盖一般性的困境。
- source_word: צַדִּיק
  choice: 义人
  rationale: 该词作名词，指行为正直、公义的人；“义人”与“恶人”构成简洁而传统清晰的对偶。
theological_decisions:
- issue: “嘴唇的过犯”与“网罗”的句法关系
  choice: 嘴唇的过犯，是恶人的网罗
  alternative: 恶人因嘴唇的过犯陷入网罗
  rationale: 希伯来文极其紧凑，介词בְּ既可表示所在范围，也可表示手段或原因。正文用判断句保留意象和简洁对偶，脚注列出因果性较强的可能译法，不把歧义默默消除。
- issue: 智慧文学中单数人物类型的表达
  choice: 恶人……义人
  alternative: 邪恶的人……正直的人
  rationale: 希伯来文以单数人物代表两类人。现代汉语“恶人”“义人”自然、简洁，并保留箴言中的类型对照；此处并非限定某一具体性别。
translation_notes:
  register: 采用简洁、对称、庄重而易懂的现代标准汉语。保留“嘴唇—网罗—脱离”的具体意象；用分号呈现两类人的对比，并以“却”明确转折。
