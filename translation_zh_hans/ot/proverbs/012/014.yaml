  text: מִ/פְּרִ֣י פִי אִ֭ישׁ יִשְׂבַּע ט֑וֹב וּ/גְמ֥וּל יְדֵי אָ֝דָ֗ם ישוב לֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/014.yaml
  text: From the fruit of a man's mouth he is satisfied with good[b][a], and the recompense of a man's hands returns to him.
translation:
  language: zh_hans
  text: 人因口中所结的果子，得以饱享美福；人手所作的回报[a]，也必归到他身上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “回报”也可译为“报偿”或“结果”，指人手所作之事所带来的回返。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִפְּרִי פִי אִישׁ
  choice: 人因口中所结的果子
  rationale: 保留“口中的果子”这一比喻，以“因”表达 מִן 在此可表示来源或途径；“人”自然表达希伯来文单数名词的泛指用法。
- source_word: יִשְׂבַּע טוֹב
  choice: 得以饱享美福
  rationale: שׂבע 表示饱足、满足，טוֹב 含义宽泛，可指美善、益处或福分；“饱享美福”既保留饱足意象，也不把含义限定为物质兴旺。
- source_word: וּגְמוּל יְדֵי אָדָם
  choice: 人手所作所得的报偿
  rationale: גְמוּל 可指行为所得的报偿、回报或行为带来的结果；此译保留手所作之事与其回报之间的因果关系，并与上句言语所结的果子形成平行。
- source_word: יָשׁוּב לוֹ
  choice: 也必归给他
  rationale: שׁוב 的基本意义是返回、归回；这里表达人的行为后果回到本人身上的箴言性常理。“必”自然传达希伯来文未完成式在箴言中的普遍规律语气。
theological_decisions:
- issue: אִישׁ 与 אָדָם 的单数阳性泛指
  choice: 均译为泛指的“人”，后半句以“他”承接
  alternative: 男人；一个人；世人
  rationale: 原文用单数阳性名词陈述适用于人的普遍规律。现代汉语“人”本身不限定性别，既忠实表达泛指范围，也避免误读为只适用于男性。
- issue: גְמוּל 指行为本身还是行为所得的回报
  choice: 译作“所作所得的报偿”，并以脚注保留语义幅度
  alternative: 所作的；成果；回报
  rationale: 该词可着重于行为带来的报偿或结果。上下句都呈现言行及其后果，因此正文采用“报偿”，但不将其狭义化为奖赏或惩罚。
translation_notes:
  register: 采用简洁、对称的箴言体。“口中所结的果子”保留原文形象；“饱享美福”与“归给他”使用现代而庄重的表达。正文中的脚注标记[a]与脚注完全对应。
