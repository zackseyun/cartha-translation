  text: דִּבְרֵ֣י רְשָׁעִ֣ים אֱרָב דָּ֑ם וּ/פִ֥י יְ֝שָׁרִ֗ים יַצִּילֵֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/006.yaml
  text: The words of the wicked are an ambush for blood[b][a], but the mouth of the upright delivers them.
translation:
  language: zh_hans
  text: 恶人的话是使人流血的埋伏[a]；正直人的口却救他们[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“恶人的话埋伏着要使人流血”。原文把恶人的话描绘成致命的埋伏。
    reason: lexical_alternative
  - marker: b
    text: “他们”泛指受到这种暴力威胁的人；也有人把这里理解为“正直人的口救自己”，或只译作“施行拯救”。
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּבְרֵי
  choice: ……的话
  rationale: 该词为复数构造式，在这里指说出来的话；译作“话”自然简洁，并与下半句的“口”形成对应。
- source_word: רְשָׁעִים
  choice: 恶人
  rationale: 这是形容词名词化用法，指道德上邪恶的人；“恶人”保留了《箴言》中与“正直人”的伦理对比。
- source_word: אֱרָב
  choice: 是……的埋伏
  rationale: 保留原文把恶人的话描绘成致命埋伏的意象，而不完全化为“图谋”或“等待”的抽象表述。
- source_word: דָּם
  choice: 使人流血
  rationale: 原文直译为“血”，在此借指暴力伤害或死亡；汉语用“使人流血”既传达其含义，也保留血的具体意象。
- source_word: וּפִי
  choice: ……的口却
  rationale: 保留“口”的身体意象，并以“却”清楚表达两句之间的对比。
- source_word: יְשָׁרִים
  choice: 正直人
  rationale: 该词指品行端正的人；“正直人”是现代汉语中清楚、庄重的表达，也与“恶人”相对。
- source_word: יַצִּילֵם
  choice: 救他们
  rationale: 使役词干表达搭救、解救；三复数后缀译为“他们”，同时不在正文中强行限定其具体所指。
theological_decisions:
- issue: יַצִּילֵם中“他们”的所指
  choice: 保留为“他们”，理解上可泛指受到暴力威胁的人
  alternative: 译作“救自己”或省略宾语，只说“施行拯救”
  rationale: 希伯来语明确带有第三人称阳性复数宾语后缀，但其先行对象没有明说。保留代词可维护原文的语法形式与指代张力，脚注再说明可能的反身理解。
translation_notes:
  register: 采用现代、简洁而庄重的箴言体。上半句保留“话—埋伏—流血”的鲜明意象，下半句保留“口”的转喻；用分号呈现希伯来诗句的对照平行。
