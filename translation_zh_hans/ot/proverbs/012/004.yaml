  yaml_path: translation/ot/proverbs/012/004.yaml
  text: A wife of noble character is her husband's crown[b][a], but one who brings shame is like rot in his bones.
translation:
  language: zh_hans
  text: 有才德的妻子[a]是丈夫的冠冕；带来羞耻的妻子，却如同他骨中的腐烂[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“贤能的妻子”“刚强的妻子”或“卓越的妻子”。希伯来语חַיִל含义宽广，可指力量、价值、才干和卓越。
    reason: lexical_alternative
  - marker: b
    text: 直译“如同他骨中的腐烂”，比喻深入内里的败坏或不断侵蚀人的羞辱。
    reason: cultural_note
lexical_decisions:
- source_word: אֵשֶׁת חַיִל
  choice: 有才德的妻子
  rationale: אֵשֶׁת在本节因下文提到“丈夫”而明确指妻子；חַיִל语义宽广，包括力量、才干、价值与卓越。“有才德”在现代中文中兼顾品格与能力，又不把词义局限于勇武或财富。
- source_word: עֲטֶרֶת
  choice: 冠冕
  rationale: 该词指冠冕或花冠，在此象征尊荣；“冠冕”既保留原文意象，也符合庄重而自然的中文表达。
- source_word: בַּעְלָהּ
  choice: 丈夫的
  rationale: 依附属形式和阴性单数所有格译出所属关系；中文以“丈夫的冠冕”自然表达。
- source_word: מְבִישָׁה
  choice: 带来羞耻的妻子
  rationale: 这是阴性使役分词，表示“使人羞愧、带来羞耻”。采用主动含义，避免弱化为仅仅描述她自身“可耻”；补出“妻子”以清楚承接上半句的女性主体。
- source_word: וּכְרָקָב
  choice: 却如同……腐烂
  rationale: ו在对照结构中自然译为“却”；כְּ保留明喻，“腐烂”传达רָקָב的腐朽、败坏之意。
- source_word: בְּעַצְמוֹתָיו
  choice: 他骨中的
  rationale: 直译“在他的骨头中”，保留希伯来文以骨中腐烂描写深层、内在败坏的强烈意象；“他”指前句的丈夫。
