  text: עֹבֵ֣ד אַ֭דְמָת/וֹ יִֽשְׂבַּֽע לָ֑חֶם וּ/מְרַדֵּ֖ף רֵיקִ֣ים חֲסַר לֵֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/011.yaml
  text: Whoever works his land will have plenty of bread[a], but he who pursues empty things lacks sense.
translation:
  language: zh_hans
  text: 耕种自己田地的人，必有充足的粮食；追逐虚妄之事的[a]，却缺乏见识。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“追逐无用之人”。原文“空的（复数）”既可指虚妄、无价值的事物，也可指无用之人。
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹבֵד
  choice: 耕种
  rationale: 此处指在农田上劳作；“耕种”自然、明确，也符合农业语境。
- source_word: אַדְמָתוֹ
  choice: 自己的田地
  rationale: אַדָמָה可指土地、土壤；在本节农业语境中，“自己的田地”最符合现代汉语表达。
- source_word: יִשְׂבַּע לָחֶם
  choice: 必有充足的食物
  rationale: 原文直译为“必因饼得饱足”。这里用“充足的食物”表达劳作带来的饱足供应；“食物”也比字面的“饼”更符合现代汉语中该词在此处的泛指意义。
- source_word: וּמְרַדֵּף
  choice: 追逐……的，却
  rationale: 分词表示持续追求某种对象；并列连词在对偶中构成鲜明反差，因此以“却”体现转折。
- source_word: רֵיקִים
  choice: 虚空之物
  rationale: 该词字面为“空的（复数）”，既可非人格化地指虚妄、无价值之事物，也可能指无用之人。正文保留略显开放的“虚空之物”，另以脚注说明人格化理解。
- source_word: חֲסַר לֵב
  choice: 无知
  rationale: 原文惯用语字面为“缺少心”，其中“心”指理解力和判断力。“无知”简洁地表达智慧文学中缺乏明辨的意思，而非缺乏情感。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的智慧文学语体，以前后对偶和“却”呈现勤劳与徒然追逐之间的反差；保留“虚空之物”的语义张力，并在脚注交代可能的人格化理解。
