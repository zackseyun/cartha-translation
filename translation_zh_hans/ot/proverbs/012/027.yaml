  yaml_path: translation/ot/proverbs/012/027.yaml
  text: A lazy man does not roast his game[b][a], but diligence is a man’s precious wealth.
translation:
  language: zh_hans
  text: 懒人不烤自己的猎物[a]；勤劳是人宝贵的财富。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “烤”也可较宽泛地理解为“料理”；另有人译作“不捕获自己的猎物”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחֲרֹךְ
  choice: 烤
  rationale: חרך通常指用火烧烤或烤焦；与“猎物”搭配时，“烤”保留了具体形象：懒惰人即使有所获，也不加以料理利用。
- source_word: רְמִיָּה
  choice: 懒惰人
  rationale: 该词虽可涉及诡诈，但在本节与חָרוּץ形成箴言式对照，较可能指懈怠、懒惰的人。
- source_word: צֵידוֹ
  choice: 自己的猎物
  rationale: צֵיד指狩猎所得的猎物；后缀为第三人称阳性单数。现代汉语用“自己的”自然表达这种所属关系。
- source_word: הוֹן
  choice: 财富
  rationale: הוֹן通常指财富、资财；在本句中保留其经济意象。
- source_word: אָדָם
  choice: 人
  rationale: אָדָם在此泛指人；现代汉语“人”既忠实又无需额外标示语法性别。
- source_word: יָקָר
  choice: 宝贵
  rationale: יָקָר表达珍贵、有价值；“宝贵”可自然修饰“财富”。
- source_word: חָרוּץ
  choice: 勤劳
  rationale: 该词可指勤奋的人，也可表示勤勉这一品格。希伯来语下半句高度凝练；译作抽象名词“勤劳”可与上半句的“懒惰”构成清楚对照，同时保留“勤劳本身是宝贵财富”的理解。
theological_decisions:
- issue: 下半句压缩结构中חָרוּץ的语法理解
  choice: 人的宝贵财富是勤劳
  alternative: 勤劳的人拥有宝贵的财富
  rationale: 原文语序和名词性表达容许不止一种句法分析。正文采用将“勤劳”视为人之宝贵财富的理解，因为它最直接保留下半句中的הוֹן（财富）和יָקָר（宝贵），也与上半句的懒惰形成品格上的对照；不把经文扩展成必然获得物质财富的承诺。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语，保持箴言上下两句的对照。正文保留“烤猎物”的具体意象，并以脚注说明动词的其他理解。希伯来语אָדָם在此为泛称，汉语译作“人”即可，无需另加性别脚注。
