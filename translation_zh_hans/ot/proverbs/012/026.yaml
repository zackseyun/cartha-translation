base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/026.yaml
  text: The righteous person is a guide to his neighbor[b][a], but the way of the wicked leads them astray.
translation:
  language: zh_hans
  text: 义人指引[a]邻舍[b]，恶人的道路却使他们迷失方向。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本句希伯来文含义难定。也可译作“义人胜过他的邻舍”；这是传统译法。另有人理解为“义人谨慎选择同伴”。
    reason: alternative_reading
  - marker: b
    text: “邻舍”也可译作“朋友”或“同伴”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יָתֵר
  choice: 给……指引
  rationale: 此词在本节中的词形和含义素来难解。结合下半句“使他们走迷”的反义平行，“给……指引”能自然表达义人与恶人道路所产生的相反作用，同时以脚注保留传统比较式译法。
- source_word: מֵרֵעֵהוּ
  choice: 邻舍
  rationale: רֵעַ可指朋友、同伴或邻舍；“邻舍”范围较广，适合智慧文学中的社会关系语境。前缀מ־与前面难解的יָתֵר一并理解，不生硬地单译为“从”。
- source_word: צַדִּיק
  choice: 义人
  rationale: 形容词在此作名词使用，指具有公义品格的人；“义人”简洁庄重，也是中文圣经智慧文学中自然的称谓。
- source_word: וְדֶרֶךְ
  choice: 却……道路
  rationale: וְ字面可译“而/和”，但本节为反义平行，译作“却”更清楚地体现义人与恶人的对照。
- source_word: רְשָׁעִים
  choice: 恶人
  rationale: 这是智慧文学中常见的复数实体用法，泛指行恶的人；汉语“恶人”可作集合性称谓。
- source_word: תַּתְעֵם
  choice: 使他们走迷
  rationale: 源自动词תעה的使役形式，并带第三人称阳性复数后缀，意为“使他们游荡、走入歧途”。“使他们走迷”保留使役意味，也与“指引”形成鲜明对照。
theological_decisions:
- issue: 义人与邻舍之间的关系
  choice: 译为义人“给邻舍指引”
  alternative: “义人胜过他的邻舍”或“义人谨慎选择朋友”
  rationale: 希伯来文首句语义确有困难，不能据此建立特定教义。正文采用与下半句反义平行较协调的理解，脚注同时保留重要传统译法及审慎选择同伴的可能性。
translation_notes:
  register: 采用现代、简洁而庄重的普通话。“给……指引”通俗自然；“使他们走迷”保留原文使役结构及“道路”意象。脚注标记紧随各自所说明的词语或短语。
