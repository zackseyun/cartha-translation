  yaml_path: translation/ot/proverbs/012/005.yaml
  text: The thoughts of the righteous are justice[b][a]; the counsels of the wicked are deceit.
translation:
  language: zh_hans
  text: 义人的意念是公正[a]；恶人的谋略是诡诈[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “意念”也可译作“思想”或“计划”；“公正”也可译作“正义”或“正确的判断”。
    reason: lexical_alternative
  - marker: b
    text: “谋略”也可译作“计策”或“策略”；“诡诈”也可译作“欺骗”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מַחְשְׁבוֹת
  choice: 谋念
  rationale: 该词可指思想、意图或计划。“谋念”兼顾内在意念与筹划之意，并与下半句的“谋略”形成自然对应。
- source_word: צַדִּיקִים
  choice: 义人
  rationale: 这是形容词名词化的复数用法，泛指秉行正义的人；“义人”简洁庄重，也保留箴言中的道德对照。
- source_word: מִשְׁפָּט
  choice: 公正
  rationale: 原文使用名词，可指公正、正义或判断。译作名词性谓语“公正”，既贴近希伯来语形式，也与下句的“诡诈”平行。
- source_word: תַּחְבֻּלוֹת
  choice: 谋略
  rationale: 该词可表示谋划、计策、策略或指导；“谋略”本身不预先加入邪恶含义，让谓语“诡诈”说明其道德性质。
- source_word: רְשָׁעִים
  choice: 恶人
  rationale: 这是形容词名词化的复数用法，泛指邪恶的人；“恶人”与“义人”构成清楚而传统的对比。
- source_word: מִרְמָה
  choice: 诡诈
  rationale: 该名词表示欺骗、虚假或奸诈；“诡诈”自然概括恶人谋略的性质，并保持名词性平行。
