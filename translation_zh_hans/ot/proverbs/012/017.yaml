  yaml_path: translation/ot/proverbs/012/017.yaml
  text: He who breathes out truth declares righteousness[a], but a false witness[b], deceit.
translation:
  language: zh_hans
  text: 吐露真话的人，陈明公正；作假见证的人，却吐露诡诈。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יָפִיחַ
  choice: 吐露
  rationale: 该词使役形本有“吹出、呼出”之意，在此用于言语。“吐露”既保留从口中发出的生动意象，也符合现代汉语表达。
- source_word: אֱמוּנָה
  choice: 真实
  rationale: 在见证与假话的对照中，指可靠、可信而真实的言语；“真实”简洁地呈现这一层意思，同时以脚注保留“忠信”的可能。
- source_word: יַגִּיד
  choice: 宣告
  rationale: 该使役形常指使人知道、陈明或宣告；“宣告”适合本节近似司法见证的语境。
- source_word: צֶדֶק
  choice: 公正
  rationale: 此处可涵盖正义、正直以及合乎事实与公理之事。“公正”适合见证语境，又不把含义局限为个人品德。
- source_word: עֵד שְׁקָרִים
  choice: 虚假的见证人
  rationale: 字面近于“谎言的见证人”，是指以虚假为特征、作不实见证的人；采用自然的现代汉语表达。
- source_word: מִרְמָה
  choice: 诡诈
  rationale: 该词指欺骗、诡诈。后半句无明示动词，译文承接上半句补出“吐露”，并用脚注说明原文的简练结构。
