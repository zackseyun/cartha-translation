  text: כָּֽל דֶּרֶךְ אִ֭ישׁ יָשָׁ֣ר בְּ/עֵינָ֑י/ו וְ/תֹכֵ֖ן לִבּ֣וֹת יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/002.yaml
  text: Every man's way is right in his own eyes[a], but Yahweh weighs hearts.
translation:
  language: zh_hans
  text: 人人所行的道路，在自己眼中都正确；但耶和华衡量人心。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל דֶּרֶךְ אִישׁ
  choice: 人所行的一切
  rationale: כָּל具有周遍、分配意味，דֶּרֶךְ在智慧文学中常比喻人的行为和人生道路；合译为“人所行的一切”，在现代汉语中自然，并保留对每个人自我判断的概括。
- source_word: יָשָׁר
  choice: 正直
  rationale: 该词本义为“直、正”，在这里指人在自己看来其行为正确、无可指摘。“正直”既保留原文的道路隐喻余韵，也表达道德评价。
- source_word: בְּעֵינָיו
  choice: 在自己眼中
  rationale: 直译并保留希伯来语以“眼中”表示主观判断的习语；“自己”明确其反身意味。
- source_word: וְתֹכֵן
  choice: 但……衡量
  rationale: 连接词在此形成对比，译为“但”；תכן表示称量、测定或评估，“衡量”保留称重意象，同时符合现代汉语。
- source_word: לִבּוֹת
  choice: 人心
  rationale: 复数“众心”在汉语中不自然；“人心”可作集合表达，涵盖希伯来语“心”所指的思想、意向和动机，而不将含义窄化为情感。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名“耶和华”呈现四字神名，保留其作为以色列之神专名的功能，而不以称号替代。
theological_decisions:
- issue: 人的自我评价与耶和华对内心的评判
  choice: 保留“在自己眼中”与“衡量人心”的对照
  alternative: 意译为“人总以为自己的行为正确，但上帝审察人的动机”
  rationale: 原文没有明说人的判断必然虚假，也没有把“心”仅限定为“动机”。正文保留人的主观判断与神的深入评估之间的张力，不额外断定评估结果。
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: “耶和华”是简体中文现代圣经语境中广为识别的专名形式，既与普通称号“主”区分，也避免正文采用中文读者较不熟悉且学界拟音性质更明显的“雅威”。
translation_notes:
  register: 采用简洁、对称的箴言体。前后分句以分号连接，并用“但”凸显人的自我判断与耶和华衡量内心之间的反差；措辞庄重而为普通现代读者所懂。
