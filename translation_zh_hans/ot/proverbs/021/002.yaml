review_pass:
  verdict: revise
  source_fidelity: 原文“כָּל דֶּרֶךְ אִישׁ”直指“每个人的道路／行事之道”，而非严格意义上的“人所行的一切”。草稿虽传达了概括性和行为含义，但将“道路”改为“一切所行之事”，略弱化了箴言中持续的“道路”隐喻。将其恢复为“人人所行的道路”可更贴近原文，同时仍是自然中文。“衡量人心”准确保留了תכן的称量意象及“心”的广义内在含义。
  naturalness: 草稿整体简洁、庄重、通顺。“人人所行的道路，在自己眼中都正确”在现代标准汉语中自然，也比“人所行的一切”更明确地维持本节的道路／行事比喻。“正确”在此更直接表达“在本人看来是对的”的评价；“正直”也可成立，但较容易偏向人格品行的固有道德正直。
  terminology: “耶和华”恰当地对应יהוה，是中文圣经语境中通行的专名译法；不需要脚注。“人心”可自然地表达复数לִבּוֹת所指的人的内心、心思与意向，未不当窄化为单指情感或动机。
  issues:
  - severity: low
    issue: “人所行的一切”未充分保留“道路”意象。
    rationale: דֶּרֶךְ在本节既可指行事方式，也保有智慧文学中“道路／人生路径”的隐喻。“一切”更像逐项行为的总和；改作“人人所行的道路”更贴近原文的单数、分配性表达。
  - severity: low
    issue: “正直”略可能偏向道德品格描述。
    rationale: יָשָׁר在此重点是当事人自认为其道路“是对的”。“正确”更直接再现该主观评价，且不预先将其定性为真正道德正直。
  revised_text: 人人所行的道路，在自己眼中都正确；但耶和华衡量人心。
