base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/022.yaml
  text: A wise man goes up against the city of mighty men and brings down the stronghold in which they trust[a].
translation:
  language: zh_hans
  text: 智慧人攻上勇士的城，瓦解他们所倚仗的力量。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“智慧人登上勇士的城，使其所信赖的力量降下。”原文“力量”也可在攻城意象中理解为坚固的防御力量；末词可指信赖、倚仗或安全感。
    reason: lexical_alternative
lexical_decisions:
- source_word: עִיר
  choice: 城
  rationale: 基本义为城市；本节处于军事意象中，“城”简洁自然，也可包含设防城邑。
- source_word: גִּבֹּרִים
  choice: 勇士
  rationale: 该词指强壮、英勇之人，常带军事色彩；“勇士”保留复数人物意象而不过度解释。
- source_word: עָלָה
  choice: 登上
  rationale: 直译为“上去、登上”；在攻城语境中含进军攻城之意。正文保留希伯来语的登临意象，由下句“攻下”显明对抗语境。
- source_word: חָכָם
  choice: 智慧人
  rationale: 阳性单数形容词在此名词化，表达箴言中的代表性人物；“智慧人”庄重且符合全书常用措辞。
- source_word: וַיֹּרֶד
  choice: 攻下
  rationale: 使役义为“使之降下、推倒”。结合城防语境，“攻下”自然表达智慧人瓦解防御力量的结果。
- source_word: עֹז
  choice: 坚固防线
  rationale: 基本义为“力量、坚固”；在攻城语境中可具体指赖以防守的坚固力量。“坚固防线”兼顾抽象力量与具体防御意象。
- source_word: מִבְטֶחָה
  choice: 他们所倚仗的
  rationale: 该词表示信赖、把握或安全保障；阴性单数后缀形式上可回指“城”，但语义上的信赖者自然是城中的勇士。译为关系短语，使现代汉语清楚流畅，同时不把对象限定为单一建筑物。
theological_decisions:
- issue: 智慧与武力的对照
  choice: 保留智慧人攻克勇士之城的反常对比
  alternative: 将经文释义为智慧必然胜过一切军事力量
  rationale: 原文以凝练的军事图像凸显智慧的能力，却没有明说绝对性教义；译文不扩大其命题范围。
translation_notes:
  register: 采用现代、庄重而简洁的箴言体。“登上……攻下”保留原文上下运动的修辞呼应；“坚固防线”使军事图景在现代汉语中清楚，同时用脚注保存“力量”的直译可能。
