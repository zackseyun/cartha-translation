base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/026.yaml
  text: All day long he craves greedily[b][a], but the righteous gives and does not hold back.
translation:
  language: zh_hans
  text: 他终日不断渴求[a]；义人[b]却施予，并不扣留。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文用同根的动词和名词加强语气，直译近似“他渴求渴求”；也可较平顺地译作“他终日不断渴求”。原文没有说明他所渴求的对象。
    reason: lexical_alternative
  - marker: b
    text: “义人”在希伯来文中为阳性单数，在这里是代表性单数，泛指具有这种品格的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַיּוֹם
  choice: 终日
  rationale: 简洁自然地表达“整天、一天到晚”的持续时间意义，适合箴言体。
- source_word: הִתְאַוָּה תַאֲוָה
  choice: 渴求不已
  rationale: 原文以同根动词和名词相连来加强语气，直译在现代汉语中十分生硬；“渴求不已”既保留强烈、持续的欲求，也不擅自补出欲求的具体对象。脚注说明其原文形式。
- source_word: צַדִּיק
  choice: 义人
  rationale: 这是阳性单数、名词化使用的形容词；“义人”是现代中文圣经语体中自然且庄重的对应词，并保留箴言中代表性单数的用法。
- source_word: יִתֵּן
  choice: 施予
  rationale: 未完成式在这里表达惯常、概括性的行为。“施予”比单独的“给”更适合无明示宾语的中文句式，又未额外加入“慷慨地”等原文没有的修饰。
- source_word: וְלֹא יַחְשֹׂךְ
  choice: 毫不保留
  rationale: 表达“不扣留、不留住”的意义，与前面的施予构成自然搭配；“毫不”体现否定的完整性，而不限定所给予的具体事物。
theological_decisions:
- issue: 义人的性别与代表范围
  choice: 正文译作“义人”，脚注说明原文为阳性单数并具有代表性
  alternative: 译作“义人男子”或“公义的人”
  rationale: 希伯来语采用阳性单数，但箴言是在概括一种人格与行为。中文“义人”可保留单数人物形象，又不会把教训不必要地局限于男性。
- issue: 欲求的对象
  choice: 不补明具体对象
  alternative: 补作“贪求财物”或“贪图别人的东西”
  rationale: 原文只用同根词强化“欲求”，并未指明财物或其他对象；保持宽泛可避免把经文的伦理张力缩窄。
translation_notes:
  register: 采用简洁、对称的现代箴言体。“渴求不已”与“施予，毫不保留”形成欲取与愿给的鲜明对照；分号突出两种品格。用语庄重但不古奥，保留原文未说明欲求对象及施予对象的概括性。
