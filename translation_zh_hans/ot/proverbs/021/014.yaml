base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/014.yaml
  text: A gift in secret subdues anger[a], and a bribe in the bosom, fierce wrath.
translation:
  language: zh_hans
  text: 暗中送的礼物能平息怒气；藏在怀中[a]的贿赂能压下烈怒。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“衣襟里”。原文指胸前或怀里的位置，可能是衣服的褶襟，强调贿赂被隐蔽地递送。
    reason: lexical_alternative
lexical_decisions:
- source_word: מַתָּן
  choice: 礼物
  rationale: 该词指礼物或赠礼；译作“礼物”自然通顺，也与下半句明确带贬义的“贿赂”相区别。
- source_word: בַּסֵּתֶר
  choice: 暗中
  rationale: 原文意为在隐秘处或秘密地；“暗中”简洁地保留了隐蔽给予的含义。
- source_word: יִכְפֶּה
  choice: 平息
  rationale: 此处表示遮盖、抑制或制伏怒气；“平息”符合现代汉语习惯，又表达使怒气受抑的效果。
- source_word: אָף
  choice: 怒气
  rationale: 该词字面与“鼻子”有关，但在此是希伯来语表达愤怒的常用说法。
- source_word: שֹׁחַד
  choice: 贿赂
  rationale: 该词通常指为影响他人而送的财物，具有明确的负面色彩；“贿赂”保留了它与“礼物”的词义对比。
- source_word: בַּחֵק
  choice: 藏在怀中
  rationale: 原文意象是在胸前、衣襟或怀里，指将东西隐蔽地递送；补出“藏”可使这一具体意象及其秘密性在现代汉语中清楚可见。
- source_word: חֵמָה עַזָּה
  choice: 烈怒
  rationale: 名词与形容词组合表达强烈的愤怒；“烈怒”简洁保留下半句相较“怒气”的程度递进。
theological_decisions:
- issue: 箴言是否在道德上认可送礼或行贿
  choice: 按原文陈述其平息愤怒的实际效果，不增添赞许或谴责用语
  alternative: 加译为“竟能”或明确说明这是谴责性的陈述
  rationale: 本节以观察式箴言描述隐秘赠礼和贿赂产生的作用，原文本身没有明说这是道德认可，也没有在句内直接定罪；译文应保留这种伦理张力。
translation_notes:
  register: 采用简洁、对称的现代书面汉语，保留箴言的两行平行结构。“平息”与“压下”避免机械重复，同时都传达原文动词抑制怒气的作用；“怒气”到“烈怒”保留语势递进。
