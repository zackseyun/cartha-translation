  yaml_path: translation/ot/proverbs/021/003.yaml
  text: To do righteousness and justice is more acceptable to Yahweh than sacrifice[a].
translation:
  language: zh_hans
  text: 行公义和公平，比献祭更蒙雅威悦纳[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“更为雅威所看重。”希伯来语字面为“被雅威拣选”，在这里表示雅威更偏爱或更认可前者。
    reason: 说明נִבְחָר的字面意义及其在比较结构中的语义。
lexical_decisions:
- source_word: עֲשֹׂה
  choice: 行
  rationale: 该不定式在此名词化，指实行某种行为；“行”简洁自然，也符合智慧文学谈论道德实践的语体。
- source_word: צְדָקָה
  choice: 公义
  rationale: 指正直、合宜的行为；译作“公义”可与后面的“公平”保持相关而不完全重合的概念。
- source_word: וּמִשְׁפָּט
  choice: 和公平
  rationale: מִשְׁפָּט在此指公正的判断与处事原则；“公平”是现代汉语中清楚、自然的对应表达。
- source_word: נִבְחָר
  choice: 更蒙……悦纳
  rationale: 该词字面为“被拣选”，在与献祭比较的结构中表达雅威的偏爱或认可；“更蒙……悦纳”自然传达其比较和接纳之意，同时以脚注保留字面信息。
- source_word: לַיהוָה
  choice: 蒙雅威
  rationale: 介词ל标明评价或偏好的主体；结合被动表达译为“蒙雅威”，并直接音译圣名יהוה。
- source_word: מִזָּבַח
  choice: 比献祭
  rationale: 介词מִן表示比较；זֶבַח在此为泛指，译作“献祭”符合箴言的一般性陈述。
theological_decisions:
- issue: 神圣名称יהוה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名יהוה；“雅威”较贴近学界通常重构的读音，也明确保留其专名性质，不以称号替代。
- issue: 公义、公平与献祭的关系
  choice: 保留“更蒙……悦纳”的比较表达
  alternative: 将本句解释为雅威完全拒绝献祭
  rationale: 原文表达两者之间的优先次序，并未在本句中断言献祭本身毫无价值；译文因此不把比较强化为绝对否定。
translation_notes:
  register: 采用简洁、庄重的现代标准汉语，保留箴言的对称比较结构。“公义和公平”延续原文两个相近但不完全相同的伦理概念；“献祭”按泛指处理。
