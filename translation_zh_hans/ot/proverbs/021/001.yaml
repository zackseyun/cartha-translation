  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: פַּלְגֵי מַ֣יִם לֶב מֶ֭לֶךְ בְּ/יַד יְהוָ֑ה עַֽל כָּל אֲשֶׁ֖ר יַחְפֹּ֣ץ יַטֶּֽ/נּוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/001.yaml
  text: A king’s heart is like channels of water in the hand of Yahweh[b][a]; he turns it wherever he desires.
translation:
  language: zh_hans
  text: 王的心在耶和华手中，如同水渠[a]；他把它导向自己所愿的任何方向[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“溪流”或“水道”。希伯来语描绘的是可以分流、导向的水道。
    reason: lexical_alternative
  - marker: b
    text: “自己所愿的”也可译作“自己所喜悦的”或“自己所愿意的”。
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּלְגֵי מַיִם
  choice: 水渠
  rationale: 该词组指分流的水道、溪流或灌溉渠道。“水渠”既保留水流可被导向的意象，也与后面的“引向”自然呼应。
- source_word: לֶב מֶלֶךְ
  choice: 王的心
  rationale: 这是表示“一个王的心”的属格结构；汉语“王的心”符合箴言概括普遍事实的表达，并不限定某一位特定君王。
- source_word: בְּיַד יְהוָה
  choice: 在耶和华手中
  rationale: 保留“在……手中”的希伯来语意象，表达掌管和支配，同时不把这种掌管解释成某一种特定的哲学模式。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代汉语圣经传统中广为人知的神名译法，明确这是以色列上帝的专名，而非一般称号。
- source_word: עַל כָּל אֲשֶׁר
  choice: 向任何地方
  rationale: 该短语直译近于“向着一切……之处”；结合“引向”这一动词，用“向任何地方”自然表达方向范围。
- source_word: יַחְפֹּץ
  choice: 随自己的意愿
  rationale: חפץ可表示喜悦、愿意或想要；此译文保留意愿之义，不额外赋予更强的哲学含义。
- source_word: יַטֶּנּוּ
  choice: 把它引向
  rationale: 这是נטה的使役形式，可表示使转向、使倾向或引导；“引向”贴合水渠中水流被导向的比喻。“它”明确回指王的心。
theological_decisions:
- issue: 上帝对统治者内心的主权
  choice: 译文表明耶和华确实掌管并能引导王的内心，如同人把水流引向所要的方向。
  alternative: 可将本节理解为彻底决定王的一切内在活动，或较弱地理解为仅仅影响、劝导王。
  rationale: 原文有力宣告王的心在耶和华手中，并由他引向所愿之处；译文保留这一力度，却不加入原文未说明的决定论或自由意志理论。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“王的心”保持箴言式的普遍陈述；“如同水渠”与“引向”共同保存原文连贯的水流意象。代词“他”承接紧邻的“耶和华”，而“它”回指“王的心”。
