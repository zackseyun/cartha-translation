  text: זֶ֣בַח רְ֭שָׁעִים תּוֹעֵבָ֑ה אַ֝֗ף כִּֽי בְ/זִמָּ֥ה יְבִיאֶֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/027.yaml
  text: The sacrifice of the wicked is an abomination[a]; how much more when he brings it with evil intent.
translation:
  language: zh_hans
  text: 恶人的祭物是可憎之物；何况他怀着邪恶的意图献上它！[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “怀着邪恶的意图”也可译作“带着邪恶的计划”。希伯来语可指败坏的意图，也可指邪恶的计划。
    reason: 保留בְּזִמָּה在内在败坏意图与具体邪恶筹谋之间的词义幅度。
lexical_decisions:
- source_word: זֶבַח
  choice: 祭物
  rationale: 指献祭之物，常尤指宰杀献上的祭牲；“祭物”在此自然简洁，也保留礼仪语境。
- source_word: רְשָׁעִים
  choice: 恶人
  rationale: 复数名词化形容词，泛指道德上邪恶、负罪的人；汉语箴言体用“恶人”概括自然。
- source_word: תּוֹעֵבָה
  choice: 可憎的
  rationale: 表达在道德和宗教意义上令人厌恶、为上帝所憎恶；“可憎的”保留强烈评价，又符合现代庄重汉语。
- source_word: אַף כִּי
  choice: 何况
  rationale: 这里由基本情形推进到更严重的情形，具有递进加强作用；“何况”准确呈现这种论证关系。
- source_word: בְּזִמָּה
  choice: 怀着恶意
  rationale: זִמָּה可指邪恶、恶谋或败坏意图；在献祭语境中重点更可能是献祭者的恶意或恶谋，而非性方面的含义。正文采用自然的“怀着恶意”，脚注保留“为施行恶谋”的可能。
- source_word: יְבִיאֶנּוּ
  choice: 献上它
  rationale: 使役式意为带来、呈上，宾语后缀最自然地回指祭物；结合祭祀语境译作“献上它”，比直译“带来它”更符合现代汉语。
theological_decisions:
- issue: 恶人所献祭物的道德评价
  choice: 本箴言说恶人所献的祭物已是可憎，若献祭时又怀有恶意，就更为可憎。
  alternative: 第二句也可理解为“何况他为施行恶谋而献上它”，突出祭物服务于一个邪恶计划。
  rationale: 译文批判的不是献祭制度本身，而是献祭者的邪恶及其败坏意图；同时不把含义限定为某一种具体的伪善行为。
translation_notes:
  register: 采用简洁、对称的现代箴言体。“可憎的”保持原文强烈的道德与敬拜评价；句末感叹号体现אַף כִּי所带出的递进力度。
