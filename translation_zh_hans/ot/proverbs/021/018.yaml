  text: כֹּ֣פֶר לַ/צַּדִּ֣יק רָשָׁ֑ע וְ/תַ֖חַת יְשָׁרִ֣ים בּוֹגֵֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/018.yaml
  text: The wicked is a ransom for the righteous[a], and the treacherous one in place of the upright.
translation:
  language: zh_hans
  text: 恶人作义人的赎价[a]；奸诈的人代替正直的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“恶人替代义人，奸诈的人替代正直的人。”
    reason: 词义上的另一种译法；כֹּפֶר 在本句中可侧重代替、补偿的作用。
lexical_decisions:
- source_word: כֹּפֶר
  choice: 赎价
  rationale: 该词通常指为赎回或免除刑罚而付出的代价；此处用作简练的替代性比喻。“赎价”既保留原文意象，也不把具体机制解释得过满。
- source_word: לַצַּדִּיק
  choice: 义人的
  rationale: 介词 ל 在此表示对象或受益关系，即恶人成为“为义人而付的”赎价；中文用“义人的赎价”自然地表达这一关系，并保留箴言中泛指的一类人。
- source_word: רָשָׁע
  choice: 恶人
  rationale: 阳性单数在智慧文学中作类别性泛指；“恶人”简洁自然，并与“义人”形成鲜明对照。
- source_word: וְתַחַת
  choice: 代替
  rationale: תַחַת 在这里表达替代关系，而非空间意义的“在……下面”；“代替”清楚呈现其与上半句“赎价”的平行。
- source_word: יְשָׁרִים
  choice: 正直的人
  rationale: 该词在箴言中指道德上正直的人。原文为复数，中文类别性表达不强制标明数，但“正直的人”自然且准确。
- source_word: בּוֹגֵד
  choice: 奸诈的人
  rationale: 分词作名词，指行事诡诈、不忠信的人。“奸诈的人”保留广泛的道德含义，不把它缩窄为政治上的叛徒。
theological_decisions:
- issue: 恶人作为义人的“赎价”所表达的替代关系
  choice: 保留“赎价”的比喻，并以脚注提示可理解为“替代”
  alternative: 直接译为“恶人代替义人”
  rationale: 原文 כֹּפֶר 具有赎价、补偿代价的词义色彩，但本节没有说明这种替代如何发生。正文保留其张力，脚注提供较直白的理解，避免把它系统化为特定赎罪教义。
translation_notes:
  register: 采用现代、凝练而庄重的箴言体。上下两句尽量保持平行：“恶人／奸诈的人”对应“义人／正直的人”，“作……赎价／代替……”呈现原文的替代关系，同时保留首句较强的比喻。
