base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/030.yaml
  text: There is no wisdom[a], no understanding, and no counsel against Yahweh.
translation:
  language: zh_hans
  text: 没有智慧，没有聪明，也没有谋略能与耶和华抗衡[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “能与耶和华抗衡”也可译作“在耶和华面前”。希伯来语可以表示摆在某人面前，但此处更可能含有与他对立、同他抗衡的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין
  choice: 没有
  rationale: 原文三次使用存在否定词；中文以三次“没有”保留排比和强调。
- source_word: חָכְמָה
  choice: 智慧
  rationale: 这是《箴言》中该词的常用译法，涵盖明智而有技巧的处世能力。
- source_word: תְּבוּנָה
  choice: 聪明
  rationale: 指理解、洞察和辨别的能力；“聪明”与“智慧”搭配自然，同时仍保持二者的概念区别。
- source_word: עֵצָה
  choice: 谋略
  rationale: 该词可指劝告、计谋或筹划；本句的对抗语境中，“谋略”自然体现经过筹划的计策。
- source_word: לְנֶגֶד
  choice: 能敌挡
  rationale: 该介词可表示“在……面前”或“与……相对”；此处结合全句，主要表达无法与耶和华对抗。补出“能”使汉语完整，并表达任何智慧、聪明或谋略都不能与他抗衡。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神名音译“耶和华”，而不以称号替代专名。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。中文采用广为人知且庄重的专名“耶和华”，保留其作为名字而非称号的性质。
- issue: לְנֶגֶד יְהוָה 的语义
  choice: 能敌挡耶和华
  alternative: 在耶和华面前
  rationale: 该表达本可指位于某人面前，但在此箴言的语境中更可能具有对立、抗衡之意；正文采用这一理解，脚注保留空间性译法所体现的真实歧义。
translation_notes:
  register: 采用简洁、庄重的现代标准汉语，保留原文三重否定的排比。为免“没有谋略敌挡……”产生生硬或歧义，补出情态词“能”，使三个并列主语共同受“能敌挡耶和华”支配。
