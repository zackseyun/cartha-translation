  text: אִ֣ישׁ מַ֭חְסוֹר אֹהֵ֣ב שִׂמְחָ֑ה אֹהֵ֥ב יַֽיִן וָ֝/שֶׁ֗מֶן לֹ֣א יַעֲשִֽׁיר־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/017.yaml
  text: A man who loves pleasure will become poor[b][a]; whoever loves wine and oil will not become rich.
translation:
  language: zh_hans
  text: 爱好享乐[a]的人，必陷入贫困；爱好酒和油[b]的人，必不能富足。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “享乐”原文也可译作“喜乐”或“宴乐”；这里可能指沉迷宴饮享受的生活方式。
    reason: lexical_alternative
  - marker: b
    text: “油”通常指橄榄油；在这里可能让人联想到丰盛饮食、香膏或奢华享受，而不只是日常食用油。
    reason: cultural_note
lexical_decisions:
- source_word: אִישׁ מַחְסוֹר
  choice: 必陷入贫困
  rationale: 原文是“缺乏之人”一类的名词性表达，在箴言的因果语境中表示最终落入穷困；译为“必陷入贫困”既传达结果，也符合现代汉语。
- source_word: אֹהֵב שִׂמְחָה
  choice: 贪爱享乐的
  rationale: שִׂמְחָה可指喜乐、欢庆或宴乐；此处与贫困以及酒、油并列，语境所责备的是沉迷享受，而非喜乐本身。“贪爱”体现反复嗜好的意味。
- source_word: אֹהֵב יַיִן וָשֶׁמֶן
  choice: 贪爱酒和油的
  rationale: 直译保留“酒和油”的具体意象；油通常指橄榄油，在此组合中可能暗示宴饮、香膏或奢华生活。
- source_word: לֹא יַעֲשִׁיר
  choice: 必不能富足
  rationale: עשר的使役词干在无宾语时可表“成为富有”；“不能富足”准确限定于财富，并保留格言式后果。
- source_word: אִישׁ
  choice: ……的
  rationale: 希伯来语用阳性单数“人”引出具有代表性的个体；汉语以“……的”作泛指，既自然，也不增加原文没有强调的性别信息。
theological_decisions:
- issue: 本节是否谴责一切喜乐、饮酒或用油
  choice: 译文以“贪爱享乐”表达所警戒的是沉迷享受的生活方式
  alternative: 直译为“喜爱喜乐的人”
  rationale: שִׂמְחָה本身可以是正面的“喜乐”，但本节的贫困后果及“酒和油”的并列指向奢靡享受。译文不把物品本身定为罪，也不把经文扩大为对一切喜乐的否定。
translation_notes:
  register: 采用简洁、对称的现代箴言体。“贪爱……的”对应两次אֹהֵב，突出持续嗜好；“必……；必……”增强格言的平行感。所有脚注标记均置于相关正文之后。
