  yaml_path: translation/ot/proverbs/021/011.yaml
  text: When a scoffer is punished[a], the simple become wise; and when a wise man is instructed[b], he gains knowledge.
translation:
  language: zh_hans
  text: 惩罚嘲讽者时[a]，愚蒙人就变得有智慧；智慧人受教时[b]，他就获得知识。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因惩罚嘲讽者，愚蒙人就变得有智慧。”希伯来语的介词结构可表达发生的时机，也可带有凭借或原因的意味。
    reason: lexical_alternative
  - marker: b
    text: 原文直译近于“使智慧人明达时”。这里的使役式可指使智慧人明达，即教导或给予洞见；“智慧人”在希伯来语中为阳性单数形式，在箴言中用作代表性人物。
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּעְנָשׁ
  choice: 惩罚……时
  rationale: 介词 בְּ 加 ענשׁ 的不定式附属形表示事情发生的情境或时机；译为“惩罚……时”既保留时间—情境关系，也符合现代汉语表达。
- source_word: לֵץ
  choice: 嘲讽者
  rationale: לֵץ 指以轻蔑讥诮的态度拒绝劝诫的人；“嘲讽者”兼顾其言语行为和道德倾向。
- source_word: יֶחְכַּם
  choice: 变得有智慧
  rationale: חכם 的 Qal 形式在这里表示进入有智慧的状态，而不只是已经拥有智慧。
- source_word: פֶּתִי
  choice: 愚蒙人
  rationale: 箴言中的 פֶּתִי 指尚未定型、容易受影响、缺乏判断力的人，并非单指智力低下；“愚蒙人”保留了智慧文学中的类别含义。
- source_word: וּבְהַשְׂכִּיל
  choice: 使……明达时
  rationale: שׂכל 的 Hiphil 不定式可表示使人明白、使人审慎或给予洞见；“使……明达”比单纯“教导”更直接保留使役含义。
- source_word: לְחָכָם
  choice: 智慧人
  rationale: 阳性单数形在箴言体裁中用作代表性人物类型；汉语“智慧人”既保留单数类型，也无需添加原文没有明说的性别词。
- source_word: יִקַּח
  choice: 获得
  rationale: לקח 本义为“拿、取”，与 דָּעַת 搭配时表示取得或领受知识；“获得”是自然且准确的汉语。
- source_word: דָּעַת
  choice: 知识
  rationale: דָּעַת 是箴言中表示知识的常用词，与智慧等相关概念有所区别；译作“知识”可保留该词汇区分。
theological_decisions:
- issue: 箴言中阳性单数的代表性主体
  choice: 智慧人
  alternative: 有智慧的男人
  rationale: 原文 חָכָם 为阳性单数，但在箴言中作为代表性类型使用。现代汉语“智慧人”不改变单数人物形象，也不额外强化自然性别；脚注说明其语法形式，以保存原文信息。
- issue: 第二分句的使役含义
  choice: 使智慧人明达时
  alternative: 智慧人受教时
  rationale: הַשְׂכִּיל 是 Hiphil 形式，允许理解为“使人明达、给予洞见”；正文保留使役力度，脚注列出较自然的被动理解，避免把语义范围缩窄为普通教学。
translation_notes:
  register: 采用现代、庄重而易懂的箴言体。两分句保持平行结构；“愚蒙人”沿用汉语智慧文学中较成熟的类别词，“嘲讽者”则用现代词语表达轻蔑并拒绝劝诫的人。
