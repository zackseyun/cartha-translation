  text: עֵד כְּזָבִ֥ים יֹאבֵ֑ד וְ/אִ֥ישׁ שׁ֝וֹמֵ֗עַ לָ/נֶ֥צַח יְדַבֵּֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/028.yaml
  text: A false witness will perish[a], but a man who listens will speak forever.
translation:
  language: zh_hans
  text: 作假见证的人必灭亡；听的人却会长久说话[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “长久说话”也可理解为“不断说话”或“所说的话长久有效”。希伯来语在这里可能着重表达话语持久、可信，而不一定指抽象意义上的永无止境。
    reason: 说明 לָנֶצַח 的词义范围，并保留其修饰“说话”时的语义含混。
lexical_decisions:
- source_word: עֵד כְּזָבִים
  choice: 作假见证的
  rationale: עֵד 指作证的人，כְּזָבִים 是“谎言、虚假”的复数，在此修饰见证人。译为“作假见证的”符合现代汉语习惯，也保留司法语境。
- source_word: יֹאבֵד
  choice: 必灭亡
  rationale: אבד 表示灭亡、消失或遭毁灭。“必灭亡”简洁地表达未完成式在箴言中的确定后果，又不具体限定灭亡的方式。
- source_word: וְאִישׁ שׁוֹמֵעַ
  choice: 留心听的人却
  rationale: שׁמע 在此可指听见、聆听或听从；与假见证形成对照时，重点很可能是先认真听取事实。“留心听”传达审慎可靠之意，但不把它收窄为“顺服”。וְ 在平行对比中译作“却”。אִישׁ 在这里可作泛指，现代汉语用“人”自然且不损失意义。
- source_word: לָנֶצַח יְדַבֵּר
  choice: 能长久说话
  rationale: נֶצַח 可表示永久、持续或长久有效；יְדַבֵּר 是“说话”。正文保留“长久说话”这一较为开放的表达，不直接断定是不断发言，还是话语具有持久效力。助动词“能”在汉语中表达其发言得以持续，与前句“灭亡”形成自然对照。
theological_decisions:
- issue: “长久说话”所指的是持续发言还是话语持久有效
  choice: 正文保留“能长久说话”的开放表达，并用脚注说明可能含义
  alternative: 明确译为“他的话长久有效”或“他必不断说话”
  rationale: 希伯来语 לָנֶצַח 修饰 יְדַבֵּר，既可强调持续说话，也可在语境中暗示可靠见证具有长久效力。直接选定其中一种会消除原文的真实含混。
translation_notes:
  register: 采用简洁、对称的箴言体。“作假见证的”具有清楚的法律语感；“留心听”是当代标准汉语，体现先听后说的审慎；全句庄重而易懂。
