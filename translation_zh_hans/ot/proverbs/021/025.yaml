  text: תַּאֲוַ֣ת עָצֵ֣ל תְּמִיתֶ֑/נּוּ כִּֽי מֵאֲנ֖וּ יָדָ֣י/ו לַ/עֲשֽׂוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/025.yaml
  text: The craving of a lazy man puts him to death, because his hands refuse to work.
translation:
  language: zh_hans
  text: 懒惰人的欲望使他丧命，因为他的手不肯做工。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תַּאֲוַת
  choice: 欲望
  rationale: 该词指强烈的愿望或欲求；此处不必限定为某一种具体贪欲。“欲望”既保留原文宽度，也能表达它反过来吞噬懒惰人的张力。
- source_word: עָצֵל
  choice: 懒惰人
  rationale: 箴言中常用的人物类型称谓，译作“懒惰人”自然、明确，并与智慧文学的格言体相称。
- source_word: תְּמִיתֶנּוּ
  choice: 使他丧命
  rationale: 使役结构直译为“使他死亡”；“使他丧命”保留致死力度，同时符合现代汉语表达。
- source_word: מֵאֲנוּ
  choice: 不肯
  rationale: 原词表示拒绝，而非仅仅未能行动；“不肯”准确体现意志上的抗拒。
- source_word: יָדָיו לַעֲשׂוֹת
  choice: 他的手……做工
  rationale: 保留原文以“手”代行动能力的具体意象；“做工”在此泛指劳动或干活。
theological_decisions:
- issue: 懒惰人的欲望如何导致死亡
  choice: 保留直接表述“欲望使他丧命”
  alternative: 解释为因贫困、饥饿或愿望落空而死亡
  rationale: 原文没有明说致死机制；不在正文中补入因果细节，以保留格言的浓缩性及其可能包含的现实与道德张力。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语；保留原文前后两分句的因果结构和“手不肯做工”的拟人化表达。
