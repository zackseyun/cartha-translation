  text: אוֹצָ֤ר נֶחְמָ֣ד וָ֭/שֶׁמֶן בִּ/נְוֵ֣ה חָכָ֑ם וּ/כְסִ֖יל אָדָ֣ם יְבַלְּעֶֽ/נּוּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/020.yaml
  text: Precious treasure and oil are in the dwelling of a wise man[a], but a foolish man swallows them up.
translation:
  language: zh_hans
  text: 智慧人的居所中有珍贵的财宝和油；愚昧人却把这一切吞尽。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语直译为“吞下它”。这里用鲜明的形象描写愚昧人耗尽所存的财物；也可译作“耗尽”或“挥霍一空”。
    reason: 说明希伯来语בלע的字面意象、语境含义，以及单数宾语可集合性地指向前述储备整体。
lexical_decisions:
- source_word: אוֹצָר נֶחְמָד
  choice: 珍贵的财宝
  rationale: אוֹצָר指储存的财富或贵重物品，נֶחְמָד表示可珍爱、可喜爱或宝贵；合译为“珍贵的财宝”，自然表达其价值，并保留与愚昧挥霍之间的对比。
- source_word: וָשֶׁמֶן
  choice: 和油
  rationale: שֶׁמֶן通常指油，文化语境中常为橄榄油，但原文未进一步限定，因此不增译“橄榄”。
- source_word: בִּנְוֵה חָכָם
  choice: 智慧人的居所中
  rationale: נָוֶה表示住处、居所；חָכָם在此作名词用。“智慧人”保留箴言中人物类型的称谓，也比“一个有智慧的男人”更符合现代汉语。
- source_word: וּכְסִיל אָדָם
  choice: 愚昧人却
  rationale: כְּסִיל是智慧文学中惯用的“愚昧人”；אָדָם在此加强其人物类型，并不要求汉语重复译作“人类”或“男人”。“愚昧人”与“智慧人”形成清楚对照。
- source_word: יְבַלְּעֶנּוּ
  choice: 把这一切吞尽
  rationale: 动词בלע本义为“吞下”，在此以鲜明比喻描写毫无节制地耗尽积存。“吞尽”保留原文意象；代词为阳性单数，可能统指前述财宝与油，故用“这一切”自然承接而不强行消除其集合性。
theological_decisions:
- issue: חָכָם与כְסִיל אָדָם的阳性单数及其普遍适用性
  choice: 译为“智慧人……愚昧人”
  alternative: “智慧的男人……愚昧的男人”
  rationale: 希伯来语使用阳性单数来描绘具有代表性的人物类型。现代汉语“智慧人／愚昧人”既不改变人物类型，也无需额外突出生理性别；本箴言的教训仍适用于一般人。
- issue: יְבַלְּעֶנּוּ的单数宾语所指
  choice: 译为“把这一切吞尽”
  alternative: “把它吞尽”或“将其耗尽”
  rationale: 原文后缀为阳性单数，可集合性地回指所存的财宝和油，也可能着眼于储备整体。“这一切”保留整体指涉并使汉语清楚；“吞尽”则保留原文的强烈比喻。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语，保持箴言的对偶结构。分号突出智慧人的储存与愚昧人的耗尽之间的反差；脚注标记置于相关分句之后。
