base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/005.yaml
  text: The plans of the diligent surely lead to abundance[c][b][a], but everyone who is hasty surely comes to want.
translation:
  language: zh_hans
  text: 勤勉人的谋划必带来富足[a]；凡急躁行事的，必致缺乏[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “富足”或译“有余”或“获益”；希伯来语 מוֹתָר 可指盈余、优势或收益。
    reason: lexical_alternative
  - marker: b
    text: “缺乏”或译“贫困”；希伯来语 מַחְסוֹר 可泛指缺少、匮乏或贫困。
    reason: lexical_alternative
lexical_decisions:
- source_word: מַחְשְׁבוֹת
  choice: 谋划
  rationale: 此词在箴言的实践智慧语境中指有意筹划，而非仅指心中的想法；“谋划”简洁自然，并能表达筹算与计划。
- source_word: חָרוּץ
  choice: 勤勉的人
  rationale: 该词在这里指勤奋、殷勤做事的人；“勤勉的人”庄重而通俗，也与下半句的人物类型形成对照。
- source_word: אַךְ
  choice: 必
  rationale: 两次出现的 אַךְ 在本节强调结果的确定性；译作“必”能保持箴言式的断言力度，同时避免生硬重复“确实”。
- source_word: לְמוֹתָר
  choice: 使人富足
  rationale: מוֹתָר 可指余裕、盈余、益处或收益；在与“缺乏”的反义平行中，“富足”最自然地表达有余的结果。“使人”补出希伯来语介词结构所隐含的结果关系。
- source_word: וְכָל
  choice: 凡……的
  rationale: וְ 在明显的反义平行中承担转折对照功能，中文以分号即可呈现，无须硬译“而”；כָל 与分词结合，译为“凡……的”可表达周遍意义。
- source_word: אָץ
  choice: 急躁行事
  rationale: 该分词指匆促、急进的人，既可侧重一贯性情，也可侧重行动方式；“急躁行事”保留这两方面，并避免只理解为速度快。
- source_word: לְמַחְסוֹר
  choice: 致缺乏
  rationale: מַחְסוֹר 可指缺少、匮乏、贫困；“缺乏”保留较宽的语义范围，与上句“富足”形成清楚对照。
theological_decisions: []
