base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/031.yaml
  text: A horse is prepared for the day of battle[a], but victory belongs to Yahweh.
translation:
  language: zh_hans
  text: 马是为争战之日预备的，得胜却在于雅威[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“拯救”或“解救”。这个希伯来词可泛指救援；在这里的争战语境中，译作“得胜”较为贴切。
    reason: lexical_alternative
lexical_decisions:
- source_word: סוּס
  choice: 马
  rationale: 原词泛指马；军事用途已由“争战之日”表明，因此不增译为“战马”。
- source_word: מוּכָן
  choice: 是……预备的
  rationale: 保留被动分词所表达的预备状态，同时符合现代汉语表达。
- source_word: לְיוֹם מִלְחָמָה
  choice: 为争战之日
  rationale: לְ 表示目的或所针对的情境；“争战之日”保留原文简洁而庄重的军事意象。
- source_word: וְלַיהוָה
  choice: 却在于雅威
  rationale: וְ 在上下两句间具有转折作用；“却”明确呈现人的备战与最终结果由神决定之间的对照。“在于”自然表达希伯来语归属结构。
- source_word: הַתְּשׁוּעָה
  choice: 得胜
  rationale: 该词可指拯救、解救或胜利；本节以争战为直接语境，“得胜”最贴切，同时不排除其更广的拯救含义。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；音译“雅威”保留其专名性质，而不以称号“主”代替。
- issue: תְּשׁוּעָה 在军事语境中的含义
  choice: 得胜
  alternative: 拯救；解救
  rationale: “争战之日”使军事意义居于前景，因此正文采用“得胜”；脚注保留原词也可表示拯救或解救的语义范围，避免将其含义收窄为唯一可能。
translation_notes:
  register: 采用简洁、对称的箴言体。“是为……预备的”与“却在于……”形成清楚对照，语言庄重而适合现代普通读者。
