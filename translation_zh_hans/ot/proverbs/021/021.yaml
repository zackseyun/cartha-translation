base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/021.yaml
  text: Whoever pursues righteousness and steadfast love will find life[a], righteousness[c][b], and honor.
translation:
  language: zh_hans
  text: 追求公义[a]和忠诚的爱[b]的人，必寻得生命、公义[c]和尊荣。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “公义”也可译作“正义”或“正直”；希伯来语原词既可指个人品格正直，也可指行事公正。本节两处“公义”都可能包含这些含义。
    reason: lexical_alternative
  - marker: b
    text: “忠诚的爱”所译的希伯来语词也可译作“慈爱”、“仁慈”、“怜悯”或“忠爱”。
    reason: lexical_alternative
  - marker: c
    text: 这里第二个“公义”也可能指“正义得以伸张”或“被证为正”。
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹדֵף
  choice: 追求
  rationale: 该分词表达持续而积极的追逐；“追求”在现代汉语中自然，并保留这种主动意味。用“……的”表达箴言所指的泛称主体。
- source_word: צְדָקָה
  choice: 公义
  rationale: 此词兼有正直、公正及合乎正道的含义。“公义”能较完整地保留其道德广度，也便于在本节两处保持原文的重复。
- source_word: חֶסֶד
  choice: 忠贞之爱
  rationale: חֶסֶד不只是一般的仁慈，也包含坚定、忠诚而持续的爱。“忠贞之爱”保留了这种丰富含义，同时避免把它局限为怜悯或善意。
- source_word: יִמְצָא
  choice: 必寻得
  rationale: 未完成式在这里表达箴言式的一般结果；“必寻得”既呼应前面的“追求”，也清楚传达结果。
- source_word: חַיִּים
  choice: 生命
  rationale: 原词虽为复数形式，却常整体指“生命”；汉语用单数概念“生命”最自然。
- source_word: צְדָקָה（第二处）
  choice: 公义
  rationale: 保留与第一处相同的译法，以再现原文刻意的重复；此处也可能含有“得以伸张正义”或“被证为正”的意味，另以脚注说明。
- source_word: כָבוֹד
  choice: 尊荣
  rationale: 在智慧文学语境中，此词可指荣耀、尊贵或社会上的敬重。“尊荣”适合与“生命、公义”并列，又不把它过度解释为物质财富。
theological_decisions:
- issue: 本节两处צְדָקָה的意义及重复
  choice: 两处均译为“公义”
  alternative: 一处或两处译为“正义/正直”；第二处译为“正义得以伸张”或“昭雪”
  rationale: 两处采用同一译词，可保留希伯来文紧凑的重复和箴言的道德对称，同时不在正文中武断地把第二处限定为品格、社会正义或裁判性的昭雪。
- issue: חֶסֶד所表达的关系性内涵
  choice: 忠贞之爱
  alternative: 慈爱、仁慈、怜悯或忠爱
  rationale: 该词具有仁爱与忠诚交织的语义密度；“忠贞之爱”不预设某一宗派性的圣约解释，却保留坚定、忠诚之爱的意味。
translation_notes:
  register: 采用现代、庄重而简洁的箴言体。“……的，必……”自然表达泛称主体与一般性结果；“寻得”与“追求”形成语义呼应。正文保留צְדָקָה的重复及第二处的歧义，并通过脚注呈现主要词义选择。
