  text: נֶ֣פֶשׁ רָ֭שָׁע אִוְּתָה רָ֑ע לֹא יֻחַ֖ן בְּ/עֵינָ֣י/ו רֵעֵֽ/הוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/010.yaml
  text: The soul of the wicked desires evil[b][a]; his neighbor finds no favor in his eyes.
translation:
  language: zh_hans
  text: 恶人的心渴求恶事；他的邻舍[a]在他眼中得不到恩待。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “邻舍”也可译作“同伴”或“朋友”。
    reason: lexical_alternative
  - marker: b
    text: “在他眼中得不到恩待”是希伯来语表达，意思是他不肯善待、怜悯或认可对方。
    reason: cultural_note
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: 心
  rationale: 这里指人的内在生命和欲望中心。译作“心”符合现代汉语表达，也保留了经文对恶人内在欲求的强调。
- source_word: רָשָׁע
  choice: 恶人
  rationale: 原文形容词作名词使用，代表具有邪恶品格的人；“恶人”简洁自然，并保留代表性单数。
- source_word: אִוְּתָה
  choice: 渴求
  rationale: 该动词表示强烈愿望或贪恋；“渴求”比一般的“想要”更能传达欲望的力度，同时不过度发挥。
- source_word: רָע
  choice: 恶事
  rationale: 此处既可指邪恶，也可能含有加害之意；结合智慧文学的伦理语境，译作“恶事”保留其道德性质，并适合汉语句法。
- source_word: יֻחַן
  choice: 得不到恩待
  rationale: 这是 חנן 的使役被动式，表示被施恩、蒙优待或受怜悯。“得不到恩待”保留被动意义，并涵盖善意与仁慈的语义。
- source_word: בְּעֵינָיו
  choice: 在他眼中
  rationale: 直译并保留希伯来语以“眼中”表达个人看法、态度和评价的形象说法。
- source_word: רֵעֵהוּ
  choice: 他的邻舍
  rationale: 该词可指邻舍、同伴或朋友。“邻舍”最能呈现此处人与身边之人的伦理关系，同时在脚注中保留其他可能。
theological_decisions: []
translation_notes:
  register: 采用简洁、对称的箴言体。“心渴求恶事”突出内在欲望；第二分句保留“在他眼中”的原文意象，同时用“得不到恩待”使被动结构在现代汉语中自然清楚。
