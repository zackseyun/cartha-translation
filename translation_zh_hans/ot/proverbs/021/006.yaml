  text: פֹּ֣עַל א֭וֹצָרוֹת בִּ/לְשׁ֣וֹן שָׁ֑קֶר הֶ֥בֶל נִ֝דָּ֗ף מְבַקְשֵׁי מָֽוֶת־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/006.yaml
  text: The getting of treasures by a lying tongue is a fleeting vapor[c][b][a], a snare of those who seek death.
translation:
  language: zh_hans
  text: 用说谎的舌头[a]获取财宝，只是被吹散的气息[b]；这样的人是在寻死[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“用虚假的舌头”；也可译“靠欺骗的话”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译“被吹散的气息”；形容虚浮、短暂、迅速消逝之物。
    reason: lexical_alternative
  - marker: c
    text: 原文末语直译“寻求死亡的人”或“寻死者”，与前句的句法关系较难。正文按一种理解译为“这样的人是在寻死”。也可理解为“取得这种财富的人是在寻死”。一些受古代译本影响的译法作“死亡的网罗”，但马所拉文本没有“网罗”一词。
    reason: alternative_reading
lexical_decisions:
- source_word: פֹּעַל אֹצָרוֹת
  choice: 获取财宝
  rationale: פֹּעַל可指行为、劳作或所得；与“财宝”连用时，重点在取得财富的行为。“获取财宝”符合现代汉语，也不把 אֹצָרוֹת 误解为具体的库房。
- source_word: בִּלְשׁוֹן שָׁקֶר
  choice: 用说谎的舌头
  rationale: 直译为“用虚假的舌头”。此处保留“舌头”的具体意象，并以“说谎”自然表达 שֶׁקֶר 所指的虚假和欺骗。
- source_word: הֶבֶל נִדָּף
  choice: 被吹散的雾气
  rationale: הֶבֶל指气息、雾气般虚空短暂之物，נִדָּף意为被驱散、被吹走。合译为“被吹散的雾气”，同时传达其虚浮与转瞬消逝。
- source_word: מְבַקְשֵׁי מָוֶת
  choice: 这样做的人是在寻死
  rationale: 原文末语直译为“寻求死亡的人”，但与前文的句法关系简约而不明确。正文将其理解为：以谎言获取财富的人其实是在自取灭亡；脚注保留其他可能解释。
theological_decisions:
- issue: 末语 מְבַקְשֵׁי מָוֶת 与前文的关系
  choice: 将它理解为对以谎言获取财宝之人的评断：“这样做的人是在寻死。”
  alternative: 可理解为“寻求死亡之人的虚空之举”；受古代译本影响的译法则作“死亡的网罗”。
  rationale: 马所拉文本明确写的是“寻求死亡的人”，并没有“网罗”一词。正文保留“寻死”这一严厉的智慧文学判断，同时用脚注说明原文句法上的难点，不把古代译本的解释直接写入正文。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“说谎的舌头”保留希伯来诗歌的身体意象；“被吹散的雾气”保留原文比喻；末句以普通读者易懂的“是在寻死”表达其警告，并借脚注呈现原文的句法歧义。
