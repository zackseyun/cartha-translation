  text: מַשְׂכִּ֣יל צַ֭דִּיק לְ/בֵ֣ית רָשָׁ֑ע מְסַלֵּ֖ף רְשָׁעִ֣ים לָ/רָֽע׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/012.yaml
  text: The righteous one considers the house of the wicked[a], bringing the wicked to ruin.
translation:
  language: zh_hans
  text: 义人[a]留心察看恶人的家，使恶人倾覆、陷入灾祸。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“那位公义者察看恶人的家，使恶人倾覆、陷入灾祸。”这里把主语理解为上帝，而不是一般的义人。
    reason: alternative_reading
lexical_decisions:
- source_word: מַשְׂכִּיל
  choice: 留心察看
  rationale: 该词为שׂכל的使役词干分词，可表达明智地行事、洞察或审慎考虑。结合介词短语“恶人的家”，译作“留心察看”既体现审慎关注，也符合现代汉语表达。
- source_word: צַדִּיק
  choice: 义人
  rationale: 阳性单数形容词在此作名词使用。“义人”保留单数及箴言中典型人物的代表性，并不在正文中强行指定为上帝。
- source_word: לְבֵית רָשָׁע
  choice: 恶人的家
  rationale: בַּיִת既可指房屋，也可指家庭、家业；这里直译为“家”，在汉语中同样可以涵盖住所、家庭和家业。רָשָׁע为单数，故译作“恶人”。
- source_word: מְסַלֵּף
  choice: 使……倾覆
  rationale: סלף可表示推翻、颠覆或使败亡。“使……倾覆”保留其强烈的翻转、毁灭意味，又能与后面的结果短语自然衔接。
- source_word: רְשָׁעִים
  choice: 恶人
  rationale: 该词为阳性复数的名词性形容词；现代汉语中的集合性“恶人”无需另加复数标记，表达简洁而符合箴言体。
- source_word: לָרָע
  choice: 陷入灾祸
  rationale: רַע虽常指“恶”，在这里配合表示趋向或结果的介词，更可能指灾难、祸患或败亡。“陷入灾祸”明确表达恶人所遭遇的结局，避免误解为使他们在道德上变得邪恶。
theological_decisions:
- issue: 压缩句法中主语的身份
  choice: 正文把“义人”理解为一般意义上的义人，并让他作为两处分词所述行动的主语。
  alternative: 把“那位公义者”理解为上帝：他察看恶人的家，并使恶人倾覆。
  rationale: 希伯来文没有明说上帝的名号，按表层句法，צַדִּיק最自然地可作一般义人的称谓，后一个分词延续同一主语。不过，将其理解为上帝这位“公义者”也是传统上可成立的解释，因此在脚注中保留，避免把经文本身未明确的身份绝对化。
translation_notes:
  register: 采用简洁、庄重的现代标准汉语，保持箴言的凝练句式。“留心察看”传达审慎洞察，“倾覆，陷入灾祸”保留原文动作与结果的递进。正文不以“大写”等汉语中不存在的方式暗示神圣称号，而由脚注说明主语身份的真实歧义。
