  yaml_path: translation/ot/proverbs/021/013.yaml
  text: Whoever shuts his ear to the cry of the poor will also call out and not be answered[a].
translation:
  language: zh_hans
  text: 凡堵住耳朵、不听穷人[a]呼求的人，自己呼求时，也必得不到回应。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “穷人”也可译作“弱小的人”或“困苦的人”。希伯来语דָּל可指贫穷、软弱或在社会上处于弱势的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹטֵם
  choice: 堵住
  rationale: 该词为主动分词，表示有意封闭、堵塞；“堵住耳朵”既保留具体意象，也体现故意拒听。
- source_word: אָזְנוֹ
  choice: 耳朵
  rationale: 希伯来文为单数并带第三人称阳性单数后缀；中文在“堵住耳朵”这一表达中不必另译所有格，也可自然保留其代表性的单数人物。
- source_word: מִזַּעֲקַת
  choice: 不听……的呼求
  rationale: 介词在“堵住耳朵”的搭配中标明拒绝听取的对象；中文补出“不听”，使关系清楚自然，而不改变原意。
- source_word: דָּל
  choice: 贫穷人
  rationale: 该词可指贫穷、弱小或处于社会弱势的人；正文采用此处最直接、常见的“贫穷人”，并以脚注保留词义范围。
- source_word: גַּם הוּא
  choice: 他自己……也
  rationale: 这一组合带有强调和对等报应意味；“他自己……也”保留其强调性，并使前后行为的对应清楚。
- source_word: יִקְרָא
  choice: 呼求
  rationale: 该动词可表示呼叫或呼求；“呼求”与前半句的“呼求”形成刻意对应，同时不指明呼求对象。
- source_word: וְלֹא יֵעָנֶה
  choice: 必无人回应
  rationale: 原文为尼法勒未完成式，表达“得不到回应”；中文用“无人回应”自然传达被动结果，但不限定究竟是谁不回应。
theological_decisions:
- issue: 呼求得不到回应时，未明说的回应者是谁
  choice: 正文不指明回应者，以“无人回应”保留施事者未明的状态。
  alternative: 明确译为“上帝也不回应他”或“别人也不回应他”。
  rationale: 希伯来文使用被动形式，却没有明说谁不回应。箴言语境可能使人联想到上帝的公义报应，但译文不应把这一含义明确化到超过原文。
- issue: 阳性单数的代表性表达
  choice: 以“他自己”保留单数代表性人物。
  alternative: 完全改写为不带代词的中性复数表达。
  rationale: 原文采用阳性单数作一般性陈述；现代中文的“他”在此可自然指代前述任何这样做的人，并保留原文形式。
translation_notes:
  register: 采用现代、庄重而易懂的箴言体中文。前后两次使用“呼求”，突出原文的对称和报应关系；不补出上帝或他人作为回应者，以保留原文的含蓄。
