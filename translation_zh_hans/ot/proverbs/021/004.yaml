base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/004.yaml
  text: Haughty eyes and a proud heart— the lamp of the wicked— are sin[a].
translation:
  language: zh_hans
  text: 高傲的眼目，骄傲的心——恶人的灯——都是罪[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“恶人的耕作是罪”；也可理解为“恶人的耕地是罪”。译作“灯”的希伯来词也可按农业意义理解。
    reason: alternative_reading
lexical_decisions:
- source_word: רוּם עֵינַיִם
  choice: 高傲的眼
  rationale: 原文直译近于“高举的眼”，是表示傲慢的惯用说法。“高傲的眼”既保留身体意象，也符合现代汉语表达。
- source_word: וּרְחַב לֵב
  choice: 狂妄的心
  rationale: 字面为“宽阔的心”，在此智慧文学语境中指自高和傲慢，而非宽宏大量；“狂妄的心”清楚传达其负面道德含义。
- source_word: נִר
  choice: 灯
  rationale: 此词的理解存在古老分歧，可作“灯”，也可按农业意义理解为“耕作、开垦的田地”。正文采用“灯”，并以脚注保留另一种合理读法。
- source_word: רְשָׁעִים
  choice: 恶人
  rationale: 这是箴言中常见的道德类别称谓；“恶人”简洁、庄重，也符合现代中文圣经语体。
- source_word: חַטָּאת
  choice: 都是罪
  rationale: 原文使用名词“罪”，而非单纯形容词“有罪的”。中文以“都是罪”承接前列的“高傲的眼、狂妄的心”和插入成分“恶人的灯”，尽量保留原句凝练而张力充足的判断。
theological_decisions:
- issue: נִר רְשָׁעִים 的解释
  choice: 恶人的灯
  alternative: 恶人的耕作／恶人开垦的田地
  rationale: 这是词义及上下文判断，而非教义定论。“灯”的读法有坚实的翻译传统，也可指恶人赖以引导自己或彰显兴盛之物；农业读法同样古老且可成立，因此不在正文中混合两义，而在脚注中明确保留。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“高傲的眼，狂妄的心”保留希伯来诗句的身体意象和简洁并列；破折号保留“恶人的灯”与前后成分之间可能存在的同位或概括关系，不强行消除原文句法张力。
