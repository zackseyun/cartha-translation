base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/029.yaml
  text: A wicked man puts on a bold face[a], but an upright man makes his way sure.
translation:
  language: zh_hans
  text: 恶人厚颜无耻[a]，正直人却使自己的道路稳妥[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“恶人使自己的脸强硬。”
    reason: 前半句的希伯来语是面部习语；此处给出较直译的表达。
  - marker: b
    text: 或按另一文本传统译作：“正直人却察明自己的道路。”
    reason: 后半句存在可影响动词译法的文本传统；正文依所给马所拉文本译为“使……稳妥”。
lexical_decisions:
- source_word: הֵעֵז ... בְּפָנָיו
  choice: 厚颜无耻
  rationale: הֵעֵז为עזז的使役形，跟“脸”连用，表示使自己的脸强硬、表现得悍然无忌。现代汉语“厚颜无耻”自然保留了面部意象及其贬义；脚注列出较直译的表达。
- source_word: אִישׁ רָשָׁע
  choice: 恶人
  rationale: 箴言中的概括性阳性单数在汉语中自然译为“恶人”；既保留智慧文学的伦理类别，也无需生硬补出“男人”。
- source_word: וְיָשָׁר הוּא
  choice: 正直人却
  rationale: יָשָׁר与רָשָׁע形成伦理对照；“却”表达隐含的转折关系。原文没有冠词，因此不增添特指定冠意味。
- source_word: יכין
  choice: 使……稳妥
  rationale: 按马所拉文本读作כין的使役未完成式，核心义为使坚定、建立、安排妥当。“使……稳妥”兼顾坚定与审慎安排的含义。
- source_word: דרכיו
  choice: 自己的道路
  rationale: 原文为复数“他的道路”，可统指一个人的行事方式和人生道路；汉语单数“道路”更自然，同时保留伦理生活进路的比喻。
theological_decisions:
- issue: 正直人的道路是由他主动建立，还是他谨慎辨明
  choice: 按马所拉文本译为“使自己的道路稳妥”
  alternative: “察明自己的道路”或“留意自己的道路”
  rationale: WLC正文的יכין支持כין使役形“使坚定、建立”；另有古译本及可能的异读传统支持“辨明/留意”。正文遵循所给马所拉文本，不把异读静默并入正文。
translation_notes:
  register: 采用现代、凝练而庄重的箴言体。“厚颜无耻”通俗易懂，并保留希伯来语“脸”的惯用意象；后半句避免解释为神学上无误或必然成功，只表达正直人使其行路坚定、妥当。
