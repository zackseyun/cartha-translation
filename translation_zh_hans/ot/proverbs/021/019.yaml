base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/019.yaml
  text: It is better to live in a desert land than with a quarrelsome and angry wife[a].
translation:
  language: zh_hans
  text: 宁可住在荒野之地，也不愿与好争吵、易发怒的妻子同住。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “易发怒”或译“惹人烦恼”。原文最后一词既可描述她本人的性情，也可描述她给别人造成的影响。
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: 宁可……也不愿……
  rationale: 此处是比较结构；用现代汉语的“宁可……也不愿……”自然表达两种处境之间的取舍。
- source_word: שֶׁבֶת
  choice: 住
  rationale: ישׁב 的不定式在这里指居住，而非短暂地坐下；“住”简明自然。
- source_word: בְּאֶרֶץ מִדְבָּר
  choice: 在荒野之地
  rationale: 同时保留 אֶרֶץ“地”和 מִדְבָּר“荒野、旷野”的含义，指荒凉少人居住之地。
- source_word: מֵאֵשֶׁת
  choice: 与……妻子同住
  rationale: 介词 מִן 引出比较对象；根据 שֶׁבֶת 的语境，汉语自然补出“同住”。
- source_word: מדונים
  choice: 好争吵
  rationale: 复数抽象名词 מדונים 表示争端、纷争，在这里修饰妻子，指惯于争吵、挑起纷争。
- source_word: וָכָעַס
  choice: 易发怒
  rationale: כעס 可指怒气，也可指令人烦恼或激怒；正文采用描述其性情的“易发怒”，并以脚注保留另一种理解。
