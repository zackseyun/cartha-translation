  text: “Proud[a], arrogant, a scoffer” is his name—one who acts in the fury of presumption.
translation:
  language: zh_hans
  text: 人称他为“狂傲、自大、好讥讽的人”；他以狂妄的怒气行事。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זֵד
  choice: 狂傲
  rationale: 指以傲慢、僭越为特征的人；“狂傲”既是自然的现代汉语，也保留了放肆自高的意味。
- source_word: יָהִיר
  choice: 自大
  rationale: 强调自我抬高，与“狂傲”意义相近却不完全重合，保留原文连续刻画的修辞力量。
- source_word: לֵץ
  choice: 好讥讽
  rationale: 在《箴言》中常指惯于嘲弄、拒绝劝诫的人；“好讥讽”能表达其稳定的性格特征。
- source_word: שְׁמוֹ
  choice: 就是他的名号
  rationale: 保留“他的名”这一希伯来语定性公式；“名号”在中文中自然地表达对其人格的称谓。
- source_word: עֹשֶׂה
  choice: 他行事
  rationale: 分词表达惯常行为；“他行事”在箴言式陈述中简洁自然，并由整句传达其性格性的、反复的行动。
- source_word: בְּעֶבְרַת
  choice: 带着……烈怒
  rationale: עֶבְרָה可指迸发、满溢的愤怒；“烈怒”保留其强度，“带着”自然表达行动的方式。
- source_word: זָדוֹן
  choice: 狂妄的
  rationale: 该词表示傲慢、僭越或狂妄，与זֵד同源；修饰“烈怒”既保留语义联系，也形成自然中文。
