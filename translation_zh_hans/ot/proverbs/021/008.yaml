base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/008.yaml
  text: The way of a guilty man is crooked and strange[a], but the conduct of the pure is upright.
translation:
  language: zh_hans
  text: 有罪之人的道路弯曲[a]；纯洁之人的行为正直。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“人的道路弯曲而奇异。”此处译作“有罪”的希伯来词含义较难确定，也可表示“奇异的”“外来的”或“疏离的”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲפַכְפַּךְ
  choice: 弯曲
  rationale: 该词指翻转、扭曲的状态；“弯曲”保留道路隐喻，并与后半句“正直”形成鲜明对照。
- source_word: דֶּרֶךְ
  choice: 道路
  rationale: 这是箴言中常见的生活道路隐喻，指人的生活方式或人生行程；“道路”既自然又保留原文意象。
- source_word: אִישׁ
  choice: 人
  rationale: 原文为阳性单数，但此处是概括性箴言；现代汉语用“人”即可准确自然地表达泛指。
- source_word: וָזָר
  choice: 负罪的
  rationale: 此词语义和文本解释均较困难，可与“陌生、外来的、疏离的”有关；结合与“纯洁的人”的伦理对比，正文采用“负罪的”，但以脚注保留较直译的其他可能。
- source_word: זַךְ
  choice: 纯洁的
  rationale: 该形容词表示洁净、纯正；在箴言的伦理语境中，“纯洁”能自然表达道德层面的洁净。
- source_word: יָשָׁר
  choice: 正直
  rationale: 该词既可指笔直，也可指道德正直；这里与“弯曲”构成道路和伦理上的双重对照。
- source_word: פָּעֳלוֹ
  choice: 所行的
  rationale: 原词可指工作、行为或作为；“所行的”在汉语中简洁地涵盖一个人的行动与品行，并与前句的“道路”相呼应。
theological_decisions:
- issue: וָזָר 的伦理含义是否应在正文中明确
  choice: 译作“负罪的”，同时加注说明原词疑难
  alternative: 译作“陌生的”“外来的”或把“诡异”仅与该词对应
  rationale: 上下两句将此人同“纯洁的人”对比，支持伦理性的理解；但希伯来词本身通常与陌生、外来或疏离相关，故不能把“负罪”当作毫无疑义的唯一含义。脚注保留这一张力。
translation_notes:
  register: 采用现代、庄重而易懂的箴言体。分号突出上下两句对照；“道路—所行的”保留生活方式与具体行为之间的平行关系，“弯曲—正直”则保留原文的核心反义结构。
