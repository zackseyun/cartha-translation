  text: Better to live on a corner of the roof than with a quarrelsome wife in a shared house[a].
translation:
  language: zh_hans
  text: 宁可住在屋顶的一角，也不愿跟好争吵的妻子住在与人合住的房子里[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “与人合住的房子”所译的希伯来语短语，字面可理解为“结伴之屋”或“共有的房屋”；其具体所指不完全确定，也可译作“有同伴的房屋”。
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: 宁可……也不……
  rationale: 此处形容词在智慧文学的比较句式中表达取舍；汉语用“宁可……也不……”自然地呈现两种居住处境的强烈对比。
- source_word: לָשֶׁבֶת
  choice: 住
  rationale: ישב 字面可指“坐”，但在居所语境中常指居住；“住”简洁、自然。
- source_word: עַל פִּנַּת גָּג
  choice: 在屋顶的一角
  rationale: פִּנָּה 是“一角”，גָּג 指古代房屋的平顶；此译保留身处狭小、暴露之地的具体意象。
- source_word: מֵאֵשֶׁת מִדְיָנִים
  choice: 跟好争吵的妻子
  rationale: 比较词缀 מִן 在此相当于“胜过/不如与……”，מִדְיָנִים 指争端、争吵；“好争吵的”自然表达其描述性含义。
- source_word: וּבֵית חָבֶר
  choice: 同住一屋
  rationale: 该短语字面近于“结伴/共有之屋”，具体句法和所指略有含混；正文用自然汉语表达共同住在一所房子里的核心意义，并以脚注保留词义上的其他可能。
