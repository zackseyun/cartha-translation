base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/015.yaml
  text: Doing justice is a joy to the righteous[a], but destruction to evildoers.
translation:
  language: zh_hans
  text: 秉行公正，是义人的喜乐，却是作恶之人的恐惧[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “恐惧”也可译作“惊惶”“毁灭”或“败亡”。希伯来语 מְחִתָּה 可表示恐惧、惊惶，也可表示毁灭、败亡。全句也可译作：“秉行公正，是义人的喜乐，却是作恶之人的毁灭（或败亡）。”
    reason: 保留 מְחִתָּה 在心理上的恐惧、惊惶与毁灭性结局之间的词义范围；并将锚点置于所注释的译词后。
lexical_decisions:
- source_word: שִׂמְחָה
  choice: 喜乐
  rationale: 该名词表示喜悦、欢欣；“喜乐”简洁庄重，并保留希伯来文无系词名词句的力度。
- source_word: לַצַּדִּיק
  choice: 是义人的
  rationale: לְ在此表示关系或感受对象；צַדִּיק为表类别的单数实体词。“义人”是自然且符合智慧文学语体的表达。
- source_word: עֲשׂוֹת
  choice: 秉行
  rationale: 该不定式在句中名词化，表示一般性的实践。“秉行”既体现持续实行，也与“公正”自然搭配。
- source_word: מִשְׁפָּט
  choice: 公正
  rationale: 此词在智慧文学中指合乎正义的判断和行为准则；“公正”涵盖道德与司法含义，现代汉语也较自然。
- source_word: וּמְחִתָּה
  choice: 却是……恐惧
  rationale: מְחִתָּה可指恐惧、惊惶，也可指毁灭或败亡。正文采用“恐惧”，使它与“喜乐”构成感受上的鲜明对照；用“却”表达希伯来语并列结构在语义上的反衬。脚注保留“毁灭”的可能。
- source_word: לְפֹעֲלֵי אָוֶן
  choice: 作恶之人的
  rationale: 该短语直译为“行作邪恶者”；“作恶之人”自然凝练，并保留其主动、惯常行恶的含义。
- source_word: אָוֶן
  choice: 恶
  rationale: 在“行作者”这一搭配中，此词主要指道德上的邪恶或罪孽，而非一般的患难。
