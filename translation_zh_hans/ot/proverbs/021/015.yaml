  register: 采用现代、庄重而易懂的智慧文学语体。“秉行公正”比“做公义”更符合现代标准汉语，也传达持续实践正义的含义。正文保留简洁、对称的箴言结构；脚注呈现 מְחִתָּה 的真实词义张力。
