  text: שֹׁמֵ֣ר פִּ֭י/ו וּ/לְשׁוֹנ֑/וֹ שֹׁמֵ֖ר מִ/צָּר֣וֹת נַפְשֽׁ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/023.yaml
  text: Whoever guards his mouth and his tongue guards his life from troubles[a].
translation:
  language: zh_hans
  text: 谨守口舌的，保守自己免遭患难。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“保守自己的性命脱离困境。”希伯来文直译：“保守他的נֶפֶשׁ脱离患难”；נֶפֶשׁ可指“自己”或“性命”。
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁמֵר
  choice: 谨守／保守
  rationale: 希伯来文两次使用同一分词。中文按宾语自然搭配分别译作“谨守”和“保守”，既体现重复的语义联系，也避免生硬。
- source_word: פִּיו וּלְשׁוֹנוֹ
  choice: 口舌
  rationale: 原文直译为“他的口和他的舌头”，二者均转指言语；合译“口舌”简洁自然，并保留身体器官所构成的言语意象。
- source_word: מִצָּרוֹת
  choice: 免遭患难
  rationale: 复数名词表示困境、苦难或麻烦。“患难”庄重而易懂；介词 מִן 与“保守”连用，在中文中自然表达为“免遭”。
- source_word: נַפְשׁוֹ
  choice: 自己
  rationale: נֶפֶשׁ 在此最可能指整个人或自身，而非专指非物质的“灵魂”。“自己”符合箴言所说谨慎言语可使本人避祸的实际语境。
theological_decisions:
- issue: נַפְשׁוֹ 的理解
  choice: 自己
  alternative: 性命／灵魂
  rationale: 上下文谈言语约束使人避开患难，并非在界定人的构成。“自己”保留整体性含义，避免把经文不必要地理解为专论肉身生命或非物质灵魂。
translation_notes:
  register: 采用简洁、对称的现代书面语，适合智慧文学格言。“谨守口舌”自然表达约束言语；主句“保守自己免遭患难”清楚呈现结果。脚注保留 נֶפֶשׁ 在“自己”与“性命”之间的词义张力。
