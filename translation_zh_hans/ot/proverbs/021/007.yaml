  text: שֹׁד רְשָׁעִ֥ים יְגוֹרֵ֑/ם כִּ֥י מֵ֝אֲנ֗וּ לַ/עֲשׂ֥וֹת מִשְׁפָּֽט־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/007.yaml
  text: The violence of the wicked will drag them away[a], because they refuse to do justice.
translation:
  language: zh_hans
  text: 恶人的暴行必把他们拖走[a]，因为他们拒绝秉行公义。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“恶人的劫掠必把他们卷走。”这里的希伯来语动词含义较难确定；也有人理解为“使他们惊恐”。全句的重点可能落在暴行、劫掠、惊恐，或恶人被自己的恶行带走。
    reason: 词义有歧义，且原文动词的解释存在分歧。
lexical_decisions:
- source_word: שֹׁד
  choice: 暴行
  rationale: 该词可指暴力毁坏、劫掠或蹂躏。此处与“恶人”及拒绝行公义相连，“暴行”既能表达破坏性的恶，又不把含义局限于抢劫。
- source_word: רְשָׁעִים
  choice: 恶人
  rationale: 这是希伯来智慧文学中对道德上作恶之人的常见称谓；“恶人”简洁、庄重，也符合汉语箴言体。
- source_word: יְגוֹרֵם
  choice: 必把他们拖走
  rationale: 该动词形式意义困难。结合宾语后缀和报应语境，译作恶人自己的暴行将他们强行带走，保留其被自身恶行毁灭的形象；其他可能理解列入脚注。
- source_word: כִּי
  choice: 因为
  rationale: 引出前句结果的原因，现代汉语中“因为”清楚自然。
- source_word: מֵאֲנוּ
  choice: 拒绝
  rationale: 原词明确表示不肯或拒绝；以现在时表达恶人的一贯特征，符合箴言的普遍性陈述。
- source_word: לַעֲשׂוֹת
  choice: 秉行
  rationale: 与“公义”搭配时，“秉行”比直译“做”更符合自然、庄重的现代汉语，同时保留付诸行动的含义。
- source_word: מִשְׁפָּט
  choice: 公义
  rationale: 此处指公正、正直的行为，而不只是司法判决。“秉行公义”准确表达伦理与司法层面的正当行为。
theological_decisions:
- issue: 恶行与恶人结局之间的关系
  choice: 保留“恶人的暴行”作为把“他们”拖走的主语
  alternative: 意译为恶人因暴行而灭亡
  rationale: 原文以恶人的暴行或劫掠为施事者，形成其恶行反过来毁掉自己的鲜明报应意象；不把这一关系解释成更具体的神学机制。
translation_notes:
  register: 采用简洁、对称的现代汉语箴言体。“暴行”与“秉行公义”形成清楚的伦理对照；“拖走”保留原句强制带离、遭报应的动态意象。脚注明示希伯来语的真实困难，不在正文中武断消除歧义。
