  text: אָדָ֗ם תּ֭וֹעֶה מִ/דֶּ֣רֶךְ הַשְׂכֵּ֑ל בִּ/קְהַ֖ל רְפָאִ֣ים יָנֽוּחַ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/016.yaml
  text: A man who wanders from the way of understanding will come to rest in the assembly of the dead[a].
translation:
  language: zh_hans
  text: 偏离明智之道的人，必在亡者的群体中安息[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “亡者”或译“幽魂”。希伯来语为“利乏音”（Rephaim），在智慧文学中指已逝的死者。
    reason: lexical_alternative
lexical_decisions:
- source_word: אָדָם
  choice: 人
  rationale: 这里的单数名词指箴言中具有代表性的个人；现代汉语用“人”既保留单数概括性，也不额外强化原文并未着重表达的性别。
- source_word: תּוֹעֶה
  choice: 偏离
  rationale: 该分词描写持续走迷、离开正路的人；“偏离”与“道”自然搭配，并保留人生道路的比喻。
- source_word: מִדֶּרֶךְ
  choice: 之道
  rationale: “道”能简洁保留《箴言》中道路作为生活方式和行为方向的核心意象。
- source_word: הַשְׂכֵּל
  choice: 明智
  rationale: 此词指洞察力、审慎和通达；“明智”在现代汉语中自然，也适合修饰人生之道。
- source_word: בִּקְהַל
  choice: 在……的会众中
  rationale: קהל 指聚集成群的人；“会众”保留集合体意象，且上下文明确这并非特指宗教礼仪群体。
- source_word: רְפָאִים
  choice: 亡者
  rationale: 在智慧文学语境中，此词指阴间已经死去的人，而非利乏音族；“亡者”清楚且保留庄重语体，脚注说明其“幽魂”含义。
- source_word: יָנוּחַ
  choice: 必安息
  rationale: 该动词意为歇息、停留；“必安息”保留原文措辞所带的反讽张力，而语境表明其归宿是在亡者之中，并非单纯描写平安休憩。
theological_decisions:
- issue: רְפָאִים 在智慧文学中的所指
  choice: 亡者
  alternative: 幽魂；利乏音人
  rationale: 本节警告离开明智之道的人最终归入死者之中。直接音译或译作族名会误导普通读者；“幽魂”较贴近古代阴间意象，但作为正文不如“亡者”清楚，因此置于脚注。
- issue: יָנוּחַ 的语义张力
  choice: 必安息
  alternative: 必停留；终必落在
  rationale: “安息”保留动词“歇息、落脚”的本义及其在死亡语境中的含蓄反讽，不把经文直接解释成更明确的“死亡”，从而避免消解原文张力。
translation_notes:
  register: 采用现代、庄重而简洁的箴言体。句式保留“道路—归宿”的比喻结构；“必安息”有意维持原文在歇息与死亡之间的含蓄张力。
