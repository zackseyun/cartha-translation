  text: The sluggard buries his hand in the dish[b][a]; he will not even bring it back to his mouth.
translation:
  language: zh_hans
  text: 懒汉把手埋在盘子里[a][b]，连把手从盘中拿回到嘴边也不肯。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“把手藏在盘子里。”希伯来语动词可指“藏”或“埋”；正文采用“埋”，以保留这句箴言夸张的画面。
    reason: lexical_alternative
  - marker: b
    text: “盘子”也可译作“碗”或“浅盘”。
    reason: lexical_alternative
lexical_decisions:
- source_word: טָמַן
  choice: 埋
  rationale: 该动词可指“藏、掩埋”。这里采用“埋”，保留箴言夸张而荒诞的鲜明画面；“藏”则作为脚注中的可能译法。
- source_word: עָצֵל
  choice: 懒汉
  rationale: 这是智慧文学中指惯常懒惰之人的固定称谓。“懒汉”简洁自然，也保留人物类型化的箴言语气。
- source_word: יָדוֹ
  choice: 手
  rationale: 保留希伯来文的单数身体部位，并由语境清楚表达其所属关系。
- source_word: בַּצַּלָּחַת
  choice: 在盘子里
  rationale: 该名词指盛食物的盘、碗或浅盘；“盘子”在现代汉语进食场景中自然，又不过度限定器皿形状。
- source_word: גַּם
  choice: 连……也
  rationale: 此处不是单纯并列的“也”，而是加强荒谬程度，表示连最微小的后续动作都不肯做。
- source_word: אֶל־פִּיהוּ
  choice: 嘴边
  rationale: 原文直指“他的口”。汉语说把手或食物“送回嘴边”较自然，同时保留具体的进食画面。
- source_word: לֹא יְשִׁיבֶנָּה
  choice: 把手送回……也不肯
  rationale: 使役形表达“使之返回、带回”，阴性宾语后缀回指“手”。“不肯”自然传达此处因懒惰而不愿完成动作，并不解释为身体上不能。
theological_decisions: []
translation_notes:
  register: 采用现代、简洁而有箴言力度的普通话。“懒汉”呈现智慧文学中的典型人物；“把手埋在盘子里”保留原文的夸张，“连……也不肯”自然再现后半句递进的讽刺。脚注标记依正文相关词语的出现顺序排列。
