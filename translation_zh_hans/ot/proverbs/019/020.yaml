base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/020.yaml
  text: Listen to counsel and accept discipline[a], so that you may become wise in the end.
translation:
  language: zh_hans
  text: 要听劝告，接受管教，好叫你在日后[a]成为有智慧的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “日后”也可译作“到最终”或“为你的将来”。希伯来语 אַחֲרִית 可指人的后期、最终结局或未来。
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמַע
  choice: 要听
  rationale: 该词是第二人称阳性单数命令式；“要听”在现代汉语中自然表达留心听从，而不只是听见声音。
- source_word: עֵצָה
  choice: 劝告
  rationale: 指经过思量、能够引导人的意见；“劝告”既有分量，也符合箴言劝诫语境。
- source_word: וְקַבֵּל
  choice: 接受
  rationale: 命令式表示主动而甘愿地领受；“接受”比单纯的“领受”更通俗自然。
- source_word: מוּסָר
  choice: 管教
  rationale: 在箴言中兼有教导、纠正和训练之意；“管教”保留其塑造与纠正的力度。
- source_word: לְמַעַן
  choice: 好使
  rationale: 明确表达目的或预期结果，同时保持格言式的庄重与简洁。
- source_word: תֶּחְכַּם
  choice: 成为有智慧的人
  rationale: 此处动词表达因听从劝告和管教而达到智慧；该译法比静态的“有智慧”更能体现成长或获得智慧的过程。
- source_word: בְּאַחֲרִיתֶךָ
  choice: 日后
  rationale: אַחֲרִית可指后期、结局或未来；“日后”自然保留时间指向，又不把含义限定为临终或最终结局。
theological_decisions:
- issue: בְּאַחֲרִיתֶךָ所指的时间或结果范围
  choice: 正文译作“日后”，脚注说明“最终”或“将来”的可能性
  alternative: 到最终；为你的将来；在晚年
  rationale: 希伯来语可涵盖人的后来、最终结果或未来。正文采用自然且较宽泛的表达，脚注保留原文的语义张力，不将其限定为晚年、死亡或末世意义。
translation_notes:
  register: 采用现代、庄重而通俗的箴言体。“要听……接受……”保持两个命令的并列；“好使”清楚连接目的。“有智慧的人”符合现代汉语习惯。脚注标记置于相关时间短语之后。
