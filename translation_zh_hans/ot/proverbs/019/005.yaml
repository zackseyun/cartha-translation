  text: עֵ֣ד שְׁ֭קָרִים לֹ֣א יִנָּקֶ֑ה וְ/יָפִ֥יחַ כְּ֝זָבִ֗ים לֹ֣א יִמָּלֵֽט׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/005.yaml
  text: A false witness will not go unpunished[b][a], and one who breathes out lies will not escape.
translation:
  language: zh_hans
  text: 作假见证的，必不免受罚[a]；口吐谎言的，也必不能逃脱。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“必不能脱罪”，或“必不被判为无罪”。
    reason: lexical_alternative
  - marker: b
    text: “口吐谎言”直译为“吹出谎言”，形容不断或随意地说谎；也可译为“说谎言”。
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵד שְׁקָרִים
  choice: 作假见证的
  rationale: 保留见证与作证的司法语境，同时用现代汉语自然表达其以虚假为特征。
- source_word: יִנָּקֶה
  choice: 必不免受罚
  rationale: נקה 的尼斐尔式可指免于刑罚或被判无罪；此处与下半句“不能逃脱”平行，“不免受罚”自然传达无法逃避惩处之意。
- source_word: וְיָפִיחַ כְּזָבִים
  choice: 口吐谎言的
  rationale: פוח 原有吹出、呼出之意，用于言语时形成“吐出谎言”的形象；“口吐”既保留意象，又符合庄重的现代汉语。
- source_word: כְּזָבִים
  choice: 谎言
  rationale: 直接表达复数虚假言辞；汉语集合性名词无需显式标出复数。
- source_word: יִמָּלֵט
  choice: 必不能逃脱
  rationale: מלט 的尼斐尔式表示逃脱或获救；在本句的审判语境中，“不能逃脱”最直接，并与上半句形成平行。
theological_decisions:
- issue: 惩罚或宣告无罪的司法含义
  choice: 正文采用“不免受罚”
  alternative: “不被判为无罪”或“不能脱罪”
  rationale: 原词允许免受惩罚与被判无罪两种相近理解；正文采用较自然且符合箴言结果性陈述的表达，并以脚注保留司法性替代译法。
translation_notes:
  register: 采用简洁、对称、庄重的箴言体。“作假见证的”保持法律与道德双重语境；“口吐谎言”保存希伯来语的生动意象。脚注标记均置于相关正文之后。
