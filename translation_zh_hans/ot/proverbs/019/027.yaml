base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/027.yaml
  text: Cease[a], my son, to hear instruction and to stray from the words of knowledge.
translation:
  language: zh_hans
  text: 我儿，不要再听[a]那使你偏离知识之言的训诲。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我儿，若不再听训诲，你就会偏离知识之言。”希伯来语的句法十分简略；本节既可理解为警告人不要听使人偏离知识之言的训诲，也可理解为反讽地责备停止听取正确训诲的人。
    reason: alternative_reading
lexical_decisions:
- source_word: חַדַל
  choice: 不要再
  rationale: 这是阳性单数命令式，表示停止、不要继续；与“听”连用时，“不要再听”符合现代汉语，也保留直接劝诫的语气。
- source_word: בְּנִי
  choice: 我儿
  rationale: 保留智慧文学中父亲对儿子的阳性单数称呼；“我儿”简洁庄重。
- source_word: לִשְׁמֹעַ
  choice: 听
  rationale: שמע在此可指听见并接受教导；“听”在上下文中自然包含听从、领受之意。
- source_word: מוּסָר
  choice: 训诲
  rationale: מוּסָר兼有管教、纠正和教导的含义；“训诲”既适合箴言体裁，也能体现塑造品格的教导。
- source_word: לִשְׁגוֹת
  choice: 使你偏离
  rationale: 该不定式表示走迷、犯错。主译将其理解为前述训诲所导致的结果，以自然汉语显明希伯来语中压缩的关系，同时在脚注保留另一种句法理解。
- source_word: מֵאִמְרֵי
  choice: 偏离……之言
  rationale: 介词מִן表示离开、远离，אֲמָרִים为言语、话语；“偏离……之言”保留其分离关系。
- source_word: דָעַת
  choice: 知识
  rationale: דעת在箴言中常指智慧意义上的知识；直译为“知识”可保持全书用语的一致性。
theological_decisions:
- issue: 两组不定式之间的句法关系
  choice: 把“使你偏离知识之言”理解为限定“训诲”的结果性表达，即警告不要听误导人的训诲。
  alternative: 把后半句理解为停止听取训诲的结果：“我儿，若不再听训诲，你就会偏离知识之言。”
  rationale: 希伯来语句法高度压缩，两种理解在语法和解释传统中均有依据。主译采用较顺畅的限定性读法，但不把另一读法排除，故以脚注明确保存歧义。
translation_notes:
  register: 采用现代、庄重而易懂的箴言式劝诫。“我儿”和“训诲”保留智慧文学语域；脚注说明原文真实存在的句法歧义，不替读者作过度裁断。
