base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/003.yaml
  text: A man's folly ruins his way[b][a], and his heart rages against Yahweh.
translation:
  language: zh_hans
  text: 人的[a]愚昧使自己的道路变得弯曲[b]，他的心却向雅威[c]发怒。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的“人”是单数泛称，指一般的人。
    reason: 说明希伯来文 אָדָם 在本节中的泛指用法。
  - marker: b
    text: 或译“败坏自己的道路”或“使自己的路扭曲”。
    reason: 保留 תְּסַלֵּף 所涵盖的败坏、扭曲和使之弯曲等词义可能。
  - marker: c
    text: “雅威”是希伯来文所记神的专名；传统上也译作“耶和华”。
    reason: 说明四字神名 יְהוָה 的性质及读者较熟悉的另一译名。
lexical_decisions:
- source_word: אִוֶּלֶת
  choice: 愚昧
  rationale: 指缺乏智慧、行事愚妄的状态；“愚昧”符合《箴言》的智慧文学语汇，也比“无知”更能表达道德与判断上的偏差。
- source_word: אָדָם
  choice: 人
  rationale: 此处为单数泛称，指任何一个人；现代汉语用“人”即可自然保留其普遍适用性，不必强加男性限定。
- source_word: תְּסַלֵּף
  choice: 使……扭曲
  rationale: 该动词的使役强化形式表达使之弯曲、败坏或偏离正道；“使……扭曲”保留道路意象，也避免只译结果而失去原文形象。
- source_word: דַּרְכּוֹ
  choice: 自己的道路
  rationale: “道路”在智慧文学中可指人的行事方式与人生进程；用“自己的”清楚呈现第三人称单数所属关系及行为后果的自致性。
- source_word: וְעַל
  choice: 却向
  rationale: 原文以连接词和介词引出敌对情绪的对象；“却”自然表达两分句间的反讽转折，即人因自己的愚昧走偏，反而向神发怒。
- source_word: יְהוָה
  choice: 雅威
  rationale: 这是以色列神的专名四字神名；“雅威”按其通行学术重构音译，区别于称号“主”。
- source_word: יִזְעַף
  choice: 发怒
  rationale: 该动词表示恼怒、愤慨；“发怒”自然明确，并由“向”保留怒气针对雅威的含义。
- source_word: לִבּוֹ
  choice: 他的心
  rationale: 希伯来文以“心”指人的内在思想、意志和情感；直译可保留原文的人观与强调。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用神的专名，而非称号；译作“雅威”既保留专名性质，也采用较接近现有语言学重构的汉语音译。
- issue: 人的愚昧与对神发怒之间的关系
  choice: 以“却”呈现反讽性对照，不补入明确的因果解释
  alternative: 译作“所以迁怒于雅威”
  rationale: 原文并未明说此人是在归咎或迁怒，只并列其道路因愚昧而扭曲与其心向雅威发怒；正文保留这种张力，不把隐含逻辑写成明确因果。
- issue: אָדָם 的单数泛称
  choice: 人
  alternative: 男人；世人
  rationale: 该词在此代表一般个体，并非特指男性；汉语“人”既能表达单数泛称，也不改变箴言普遍适用的范围。
translation_notes:
  register: 采用现代、凝练的箴言体。保留“道路”和“心”两个核心希伯来意象；“自己的道路”与“他的心”维持单数个体视角。“却”使汉语关系清楚，但不把原文的并列关系过度解释为明确的归咎或迁怒。
