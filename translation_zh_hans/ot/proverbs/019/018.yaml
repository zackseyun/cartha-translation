  yaml_path: translation/ot/proverbs/019/018.yaml
  text: Discipline your son[a], for there is hope[b]; do not set your heart on putting him to death.
translation:
  language: zh_hans
  text: 要管教你的儿子，因为还有希望[a]；不可一心想置他于死地[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“趁还有希望。”希伯来语 כִּי 在这里可表示原因（“因为还有希望”），也可能带有时间意味（“趁还有希望”）。
    reason: lexical_alternative
  - marker: b
    text: 直译：“不要把你的心魂举向使他死亡。”这是希伯来语表达，指不要使自己的愿望或决意以致他死亡为目标。
    reason: lexical_alternative
lexical_decisions:
- source_word: יַסֵּר
  choice: 管教
  rationale: 该词为 יסר 的皮勒命令式，表示带有纠正目的的责罚与教导。“管教”在现代汉语中自然、庄重，也能体现父母为纠正儿子而施行纪律。
- source_word: בִּנְךָ
  choice: 你的儿子
  rationale: 希伯来文明确指“你的儿子”，故保留其性别和亲属关系，不泛化为“你的孩子”。
- source_word: כִּי יֵשׁ תִּקְוָה
  choice: 因为还有希望
  rationale: כִּי 在此最自然地引出管教的理由；“还有希望”也传达 יֵשׁ תִּקְוָה 所表达的希望仍然存在。时间性的“趁还有希望”同样可能，故收入脚注。
- source_word: הֲמִיתוֹ
  choice: 置他于死地
  rationale: 该使役式不定词表示“使他死亡”。“置他于死地”准确保留致死结果，并与整句庄重的箴言体相称。
- source_word: אַל תִּשָּׂא נַפְשֶׁךָ
  choice: 不要一心要
  rationale: 字面为“不要举起你的性命/心魂”，在这里表示把内心的愿望或意志指向某个目标。“不要一心要”用现代汉语自然表达这种欲望和决意，同时避免把字面意象误当作具体动作。
theological_decisions:
- issue: 后半句警告的含义
  choice: 禁止父亲怀着致儿子于死地的意愿施行毁灭性的严厉管教；管教应以仍有希望为前提和目标。
  alternative: 不要因不管教儿子而任凭他走向死亡；或不要严厉到意外导致他死亡。
  rationale: 希伯来文最直接地禁止把自己的 נֶפֶשׁ（心愿、意向）指向“使他死亡”。这与前半句形成张力：应当管教，却不可把管教变成致命的严酷。其他理解可能反映句子的实际含意，但比原文措辞加入了更多解释。
translation_notes:
  register: 采用现代、庄重而易懂的箴言体。“要管教”保留命令语气；“一心要”传达内在愿望和决意。正文保留因果读法，脚注说明可能的时间读法；后半句不把警告改写成“不可不管教”，以免消除原文对管教与致命严酷之间的张力。
