  text: טֽוֹב רָ֭שׁ הוֹלֵ֣ךְ בְּ/תֻמּ֑/וֹ מֵ/עִקֵּ֥שׁ שְׂ֝פָתָ֗י/ו וְ/ה֣וּא כְסִֽיל־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/001.yaml
  text: Better is a poor man who walks in his integrity than one who is crooked in his speech and is a fool[a][b].
translation:
  language: zh_hans
  text: 行为纯正的穷人，胜过言语乖谬且愚昧的人。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“胜过言语乖谬的愚昧人。”希伯来语末句“而他是愚昧人”也可更紧凑地用来说明所对比的那个人。
    reason: alternative_reading
  - marker: b
    text: “行为纯正”直译为“在自己的纯正中行走”。“行走”是希伯来语表示生活方式或为人处世的比喻。
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: 胜过
  rationale: 这是箴言中常见的比较句式，表示前一种处境或品格优于后一种。
- source_word: רָשׁ
  choice: 穷人
  rationale: 指贫穷的人；中文用“穷人”自然简洁，也不必额外强化性别。
- source_word: הוֹלֵךְ בְּתֻמּוֹ
  choice: 行为纯正
  rationale: “行走”是希伯来语描述生活方式的伦理隐喻；“行为纯正”在现代中文中自然，并表达 תֹּם 所指人格完整、正直，而非绝对无罪。
- source_word: מֵעִקֵּשׁ שְׂפָתָיו
  choice: 言语乖谬的人
  rationale: 原文直译为“嘴唇弯曲的人”，指言语歪曲、不正；“言语乖谬”保留其道德含义，并符合中文智慧文学语体。
- source_word: וְהוּא כְסִיל
  choice: 又是愚昧人的人
  rationale: 按表层句法将末句与“言语乖谬”并列，用“又是”避免替原文增添转折关系；此处“愚昧人”具有智慧文学中的道德意味。
theological_decisions:
- issue: וְהוּא כְסִיל 与对比人物的句法关系
  choice: 理解为进一步描述同一个对比人物：“言语乖谬、又是愚昧人的人”
  alternative: 理解为更紧凑的同位表达：“言语乖谬的愚昧人”
  rationale: 希伯来语表层形式是“而他是愚昧人”，主译保留并列结构，但以脚注注明可更紧凑地理解为同位关系，不消除句法上的余地。
translation_notes:
  register: 采用现代、庄重而易懂的箴言体。主句保持简洁的“甲胜过乙”结构；“纯正”表达正直完整而不暗示绝对无罪，“乖谬”保留言语歪曲的智慧文学色彩。
