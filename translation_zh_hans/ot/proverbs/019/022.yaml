base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/022.yaml
  text: What is desired in a man is his steadfast love[b][a], and a poor man is better than a liar.
translation:
  language: zh_hans
  text: 一个人身上可贵的，是他的忠诚之爱[a][b]；穷人胜过说谎的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“人的愿望，是他的忠诚之爱。”希伯来文首句十分简约，既可理解为一个人身上可贵的品质，也可理解为把人的愿望与他的慈爱或忠诚联系起来。
    reason: alternative_reading
  - marker: b
    text: “忠诚之爱”所译的希伯来词也可译为“慈爱”“仁厚”或“忠诚”，具体含义随语境而定。
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּאֲוַת
  choice: 所看重的
  rationale: 该名词既可指“愿望、渴望”，也可指“所渴望、所看重的事物”。此处采用述谓式理解，使首句自然表达一个人身上可贵的品质，同时以脚注保留原文简约结构所容许的另一读法。
- source_word: אָדָם
  choice: 人
  rationale: 这里泛指个体的人；现代汉语用“人”既自然，也无需把希伯来语代表性阳性单数机械译成带性别限定的措辞。
- source_word: חַסְדּוֹ
  choice: 他的忠诚之爱
  rationale: חֶסֶד兼有慈爱、仁厚、忠诚和持久可靠之爱的含义。“忠诚之爱”保留其关系性与恒常性，又不把本节过度限定为专门的盟约术语。
- source_word: וְטוֹב
  choice: 胜过
  rationale: 与后面的מִן共同构成比较句。汉语用“胜过”简洁地表达“更好”的比较关系，并使上下两行衔接自然。
- source_word: רָשׁ
  choice: 穷人
  rationale: 该词指贫穷的人。译作“穷人”符合现代汉语智慧格言的凝练风格，也保留其与后文人物类型的对比。
- source_word: מֵאִישׁ
  choice: 胜过……的人
  rationale: 介词מִן标示比较标准，אִישׁ与后面的כָּזָב合起来指具有虚假品格的人；汉语将其自然整合进“胜过说谎的人”。
- source_word: כָּזָב
  choice: 说谎的人
  rationale: 该词可指虚假、欺骗；在אִישׁ כָּזָב这一结构中用于刻画一个人。译作“说谎的人”清楚、自然，并保留品格上的对比。
theological_decisions:
- issue: 首句的句法歧义
  choice: 人所看重的，是他的忠诚之爱
  alternative: 人的愿望就是他的慈爱／忠诚
  rationale: 希伯来文首句极为简约，תַּאֲוַת אָדָם可理解为“人所渴望、所看重的”，也可理解为“人的愿望”。正文采用较可能且与第二句品格对比相称的述谓读法，但不把另一读法排除，故列入脚注。
- issue: חֶסֶד在人际语境中的神学分量
  choice: 忠诚之爱
  alternative: 慈爱／仁慈／盟约信实
  rationale: 本节谈人的品格。“忠诚之爱”兼顾爱、仁厚和可靠忠诚，不将词义削弱为一时的善意，也不额外引入仅限于正式盟约关系的解释。
translation_notes:
  register: 采用现代、凝练而庄重的箴言体。“人”“穷人”“说谎的人”均为普通读者易懂的现代汉语；“忠诚之爱”略带文学庄重感，用以承载חֶסֶד较丰富的关系性含义。脚注标记按[a][b]紧随相关词语。
