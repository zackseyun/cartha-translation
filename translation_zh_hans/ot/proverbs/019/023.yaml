base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/023.yaml
  text: The fear of Yahweh leads to life[a], and whoever has it will rest satisfied[c][b]; he will not be visited by harm.
translation:
  language: zh_hans
  text: 敬畏耶和华使人得生命[a]；这样的人必饱足地安然过夜[b]，灾祸必不临到他[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“敬畏耶和华是为生命。”原文的表达十分简练，也可理解为“通向生命”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译可作“饱足地过夜”或“满足地度过夜晚”。“安然过夜”表达其在此处安稳无忧的意象。
    reason: lexical_alternative
  - marker: c
    text: 也可译：“他必不遭灾祸。”这里的“恶”指灾难或伤害，并非道德上的邪恶。
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְאַת יְהוָה
  choice: 敬畏耶和华
  rationale: “敬畏”兼具畏惧、尊崇与虔敬之意，保留原词的分量；“耶和华”以中文惯用音译呈现上帝的专名。
- source_word: לְחַיִּים
  choice: 使人得生命
  rationale: 介词לְ与“生命”构成极简表达，可表示趋向或结果；此译自然传达敬畏耶和华导向生命的含义，同时不把“生命”局限为长寿、今世福乐或永生中的任何一种。
- source_word: וְשָׂבֵעַ
  choice: 饱足
  rationale: 原词可指吃饱，也可泛指满足、知足；“饱足”保留其具体意象及较宽含义。
- source_word: יָלִין
  choice: 安睡
  rationale: 该动词本义为过夜、住宿；在此描绘夜间安稳无忧的状态。“安睡”符合现代汉语，又保留安然度夜的图景。
- source_word: בַּל יִפָּקֶד רָע
  choice: 不遭灾祸
  rationale: יִפָּקֶד为פקד的未完成式被动形态，可表达被临到、被眷顾或受处置；与רָע连用时指不利之事临到。“不遭灾祸”以自然汉语传达该习语，且将רָע理解为灾害而非道德之恶。
theological_decisions:
- issue: “生命”是专指属灵生命、永生，还是广义的兴盛与福祉
  choice: 保留“生命”这一宽广的智慧文学用语，不加限定
  alternative: 译成“长寿”“幸福生活”或明确解释为“永生”
  rationale: 《箴言》中的“生命”常涵盖活着、兴盛和在上帝秩序下的福祉；原文没有把它限定为单一层面。
- issue: 末句是否承诺敬虔者绝不会经历任何逆境
  choice: 按箴言式概括译为“不遭灾祸”，不在正文中将其系统化为绝对免受一切苦难的教义
  alternative: 弱化为“较少遭遇灾祸”，或解释成“不因罪受罚”
  rationale: 原文陈述直接而简练，应保留其力度；同时，它属于智慧文学的格言表达，不宜加入原文没有的限定，也不宜把רָע窄化为道德之恶或刑罚。
- issue: 第二分句省略的主语与前句之间的关系
  choice: 用“这样的人”承接“敬畏耶和华”的人
  alternative: 直译为“饱足的人必过夜”，不明确其所指
  rationale: 希伯来诗句以形容词性表达“饱足的（人）”承接前句；中文补出“这样的人”能清楚表达篇章关系，但不额外规定性别或身份。
translation_notes:
  register: 采用简洁、对称的现代书面汉语，保留箴言的凝练节奏。“饱足安睡”略带庄重的经文语感，但普通读者仍易理解；正文不展开解释，将原文的简约性与神学张力留在脚注中说明。
