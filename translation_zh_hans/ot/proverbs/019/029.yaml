base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/029.yaml
  text: Judgments are prepared for scoffers[a], and beatings for the back of fools.
translation:
  language: zh_hans
  text: 刑罚已为讥诮者备妥[a]；重击也已为愚昧人的背备妥。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“判决已为讥诮者备妥，重击也已为愚昧人的背备妥。”
    reason: “刑罚”按上下文表达שפטים的惩罚性含义；“判决”保留其较一般的司法／裁断含义。原文后半句省略“已备妥”，由前半句的谓语统摄。
lexical_decisions:
- source_word: נָכ֣וֹנוּ
  choice: 预备的
  rationale: 该词是כון的尼法勒完成式复数，可表达“已经备妥、设定、确立”。这里译作“预备的”，自然表达刑罚已经为相应对象备下，同时不排除“随时待用”的意味。
- source_word: לַ/לֵּצִים
  choice: 为讥诮者
  rationale: לץ指以傲慢轻蔑态度嘲弄的人。“讥诮者”保留《箴言》中这一类人的道德色彩，比一般的“嘲笑者”更庄重有力。
- source_word: שְׁפָטִים
  choice: 刑罚
  rationale: משפטים本可指“判决、审判”，但与下半句的“鞭打”平行时，重在判决所带来的惩罚。译作“刑罚”使现代读者能直接把握语境中的惩戒含义；脚注保留较形式对应的译法。
- source_word: וּ֝/מַהֲלֻמ֗וֹת
  choice: 鞭打
  rationale: 该复数名词表示击打、重击。语境是施于背部的体罚，“鞭打”在现代汉语中具体自然，并能传达反复击打的复数意味。
- source_word: לְ/גֵ֣ו
  choice: 为……的背
  rationale: גֵּו可指背部或躯干；在“击打”的语境中，“背”最具体自然。原文为单数集合性表达，中文也可用单数“背”概括一类人的背部。
- source_word: כְּסִילִֽים
  choice: 愚昧人
  rationale: כסיל是《箴言》的典型智慧术语，主要指在道德上顽梗、不受教的人，而不只是智力不足者。“愚昧人”能保留这一稳定的智慧文学类别。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的智慧文学语体。正文以“刑罚／鞭打”清楚呈现两句的惩戒平行；重复“预备的”使中文句法完整，并显明原文同一谓语统摄两半句。
