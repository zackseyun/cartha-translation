  yaml_path: translation/ot/proverbs/019/013.yaml
  text: A foolish son is ruin to his father[a], and a wife’s quarrels are a continual dripping.
translation:
  language: zh_hans
  text: 愚昧的儿子是父亲的祸患[a]；妻子的争吵是不停滴落的漏水。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“愚昧的儿子使父亲遭受灾祸。”
    reason: 说明הַוּוֹת与关系介词לְ合起来也可较动态地译为儿子给父亲带来灾祸。
lexical_decisions:
- source_word: הַוּוֹת
  choice: 祸患
  rationale: 该复数形式可作抽象或加强表达，指灾祸、毁灭性的祸害；“祸患”自然凝练，也保留格言的力度。
- source_word: לְאָבִיו
  choice: 父亲的
  rationale: 介词לְ标示受影响者；汉语用“是父亲的祸患”自然表达儿子给父亲带来的灾害。
- source_word: בֵּן כְּסִיל
  choice: 愚昧的儿子
  rationale: 箴言中的כְּסִיל主要指道德和属灵层面的愚顽，并非单指智力不足；“愚昧”可保留这一伦理意味。
- source_word: דֶּלֶף
  choice: 漏水
  rationale: 该词指屋顶等处渗漏而滴下的水；“漏水”在现代汉语中比单说“滴水”更清楚地呈现这一生活图景。
- source_word: טֹרֵד
  choice: 滴个不停
  rationale: 该分词描述持续不断的滴落；此译法口吻自然，并突出反复、令人烦扰的性质。
- source_word: מִדְיְנֵי
  choice: 争吵
  rationale: 该复数构造形式指争执、纷争；“争吵”符合家庭语境，也是普通读者易懂的现代用语。
- source_word: אִשָּׁה
  choice: 妻子的
  rationale: 虽然אִשָּׁה也可泛指女人，但此处家庭格言的语境以及与“父亲”相呼应的结构，使“妻子”更贴切。
theological_decisions: []
