base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/015.yaml
  text: Laziness brings on deep sleep[b][a], and a slack person will go hungry.
translation:
  language: zh_hans
  text: 懒惰使人陷入沉睡；懈怠的人[a][b]必挨饿。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文用 נֶפֶשׁ，常译“性命”或“灵魂”，在这里可指整个人。
    reason: lexical_alternative
  - marker: b
    text: “懈怠的”所译的希伯来词 רְמִיָּה 在这里指疏懒、不尽责；该词在别处也可意为“诡诈的”。
    reason: lexical_alternative
lexical_decisions:
- source_word: עַצְלָה
  choice: 懒惰
  rationale: 该名词指懒散、怠惰；“懒惰”是现代汉语中自然清楚且保留箴言道德力度的表达。
- source_word: תַּפִּיל
  choice: 使人陷入
  rationale: 这是 נפל 的使役形式，意为“使……落入”。与“沉睡”搭配时，“使人陷入”既体现使役意义，也符合现代汉语习惯。
- source_word: תַּרְדֵּמָה
  choice: 沉睡
  rationale: 该词指深沉、酣沉的睡眠，强度高于一般的睡意；“沉睡”简洁地保留这一含义。
- source_word: נֶפֶשׁ
  choice: 人
  rationale: נֶפֶשׁ 在这里以“性命、自我”转指整个人；译作“人”可避免现代读者误解为与身体截然分开的形而上“灵魂”。
- source_word: רְמִיָּה
  choice: 懈怠的
  rationale: 该词在本节与懒惰、饥饿相连，适合按疏懒、失职之意理解。“懈怠的”保留其与前句“懒惰”的呼应，又不把两个词完全等同。
- source_word: תִרְעָב
  choice: 必挨饿
  rationale: 该动词意为饥饿、遭受饥饿；“挨饿”是自然的现代汉语，并未夸大为“饿死”。“必”传达箴言所陈述的典型结果。
theological_decisions:
- issue: נֶפֶשׁ 是否应译作“灵魂”
  choice: 正文按语境译作“人”
  alternative: “懈怠的性命必饥饿”或“懒惰的灵魂必饥饿”
  rationale: 此处讨论懈怠导致现实饥饿的智慧原则，נֶפֶשׁ 是对整个人的指称，而非特别论述灵魂与身体的区分；脚注保留原词的字面表达。
- issue: רְמִיָּה 的语义取向
  choice: 按“懈怠、疏懒”理解
  alternative: “诡诈的”
  rationale: רְמִיָּה 在别处可指欺诈，但本节与“懒惰”和“挨饿”构成平行的因果关系，语境更支持懈怠之意；脚注保留另一可能义，避免掩盖词义张力。
translation_notes:
  register: 采用简洁、对称的现代箴言体。“陷入沉睡”保留原文使役结构的力度；“必挨饿”通俗而庄重。正文流畅易懂，脚注则保留 נֶפֶשׁ 与 רְמִיָּה 的词义范围及原文歧义。
