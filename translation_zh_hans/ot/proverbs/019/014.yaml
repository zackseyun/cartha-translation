  yaml_path: translation/ot/proverbs/019/014.yaml
  text: A house and wealth are an inheritance from fathers[a], but a prudent wife is from Yahweh.
translation:
  language: zh_hans
  text: 房屋和财富是从父辈承受的产业；贤明的妻子却来自雅威。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “妻子”或译“女人”。希伯来语 אִשָּׁה 两义皆可；本节把她与从父辈承受的家产相对照，因此正文采用“妻子”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיִת
  choice: 房屋
  rationale: 与“财富”并列，指可承受的具体家产；“房屋”比偏重关系与生活空间的“家”更贴近原词在此处的物质含义。
- source_word: הוֹן
  choice: 财富
  rationale: 在智慧文学中常指财物、资财；“财富”是清楚自然的现代汉语表达。
- source_word: נַחֲלַת אָבוֹת
  choice: 从父辈承受的产业
  rationale: 保留“产业、继承物”的名词意义，并以“从……承受”自然表达来源关系；“父辈”既反映阳性复数，也符合古代父系传承的语境。
- source_word: מֵיְהוָה
  choice: 来自雅威
  rationale: 介词 מִן 表明来源；以“雅威”音译四字神名，保留经文对上帝圣约之名的直接使用。
- source_word: אִשָּׁה
  choice: 妻子
  rationale: 该词可指“女人”或“妻子”；本节将可继承的家产与婚配所得相对照，婚姻义更符合语境。
- source_word: מַשְׂכָּלֶת
  choice: 贤明的
  rationale: 该分词源于 שכל，包含明辨、通达和行事得当之意；“贤明”在修饰妻子时自然庄重，并保留实践智慧的意味。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；“雅威”较贴近学界通常重构的读音，也不以称号代替专名。
- issue: 箴言中人间承继与神赐之间的对照
  choice: 房屋财富可从父辈承受，贤明的妻子却来自雅威
  alternative: 贤明的女人来自雅威
  rationale: 保留原文由 וּמֵיְהוָה 所突出的来源对照，不进一步界定神护理的方式；אִשָּׁה 的婚姻义由上下文支持，但其词义歧义以脚注说明。
translation_notes:
  register: 采用现代、庄重而易懂的箴言体。以分号和“却”呈现两行之间的对照；“从父辈承受的产业”避免生硬直译，同时保留继承与来源的含义。
