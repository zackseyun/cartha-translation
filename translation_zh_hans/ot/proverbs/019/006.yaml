base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/006.yaml
  text: Many seek the favor of a noble man[b][a], and everyone is a friend to a man who gives gifts.
translation:
  language: zh_hans
  text: 许多人求慷慨的人[a]施恩；人人都是赠礼的人[b]的朋友。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “慷慨的人”也可译作“尊贵的人”或“贵族”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“人人都是礼物之人的朋友”。
    reason: lexical_alternative
lexical_decisions:
- source_word: רַבִּים
  choice: 许多人
  rationale: 保留复数数量词的概括性，符合箴言的简洁表达。
- source_word: יְחַלּוּ פְנֵי
  choice: 求……施恩
  rationale: 这是“恳求某人的面／求取某人恩宠”的惯用语；译为“求……施恩”既自然，也保留主动恳求的意味。
- source_word: נָדִיב
  choice: 慷慨的人
  rationale: 该词可指尊贵者、贵族，也可指慷慨大方的人；下半句谈到送礼者，语境更支持“慷慨的人”，同时以脚注保留身份意义的可能性。
- source_word: וְכָל
  choice: 人人都
  rationale: 自然表达原文“所有人／每个人”的普遍范围。
- source_word: הָרֵעַ
  choice: 愿……为友
  rationale: 原文形式简练，可理解为“是朋友／作朋友”；中文用“愿与……为友”体现人们趋附送礼者的关系倾向，但不把这种友谊评价为真诚。
- source_word: לְאִישׁ מַתָּן
  choice: 与送礼的人
  rationale: 字面为“对一个礼物之人”，即以赠送礼物为特征的人；译成“送礼的人”简洁通顺。
theological_decisions: []
translation_notes:
  register: 采用现代、凝练而庄重的箴言体。分号呈现希伯来诗句上下两行的对应关系；避免使用文言色彩过重的“求其颜面”，改用普通读者易懂的惯用表达。
