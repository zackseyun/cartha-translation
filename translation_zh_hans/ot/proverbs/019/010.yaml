  text: לֹֽא נָאוֶ֣ה לִ/כְסִ֣יל תַּעֲנ֑וּג אַ֝֗ף כִּֽי לְ/עֶ֤בֶד מְשֹׁ֬ל בְּ/שָׂרִֽים־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/010.yaml
  text: Luxury is not fitting for a fool[c][b][a], much less for a slave to rule over princes.
translation:
  language: zh_hans
  text: 奢华[a]不适合愚昧人，何况奴隶[b]统治王公[c]呢！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “奢华”或译“享乐”或“愉悦”。希伯来语可以泛指享受，但这里较可能指优裕安逸或纵情享受。
    reason: lexical_alternative
  - marker: b
    text: “奴隶”或译“仆人”。希伯来语 עֶבֶד 可指不同程度的服役身份；此处采用“奴隶”，以保留本句所强调的强烈社会身份倒置。
    reason: lexical_alternative
  - marker: c
    text: “王公”或译“贵族”或“官长”。
    reason: lexical_alternative
lexical_decisions:
- source_word: נָאוֶה
  choice: 相宜
  rationale: 表达“合宜、相称”的评价意味；“相宜”简洁庄重，也符合箴言体。
- source_word: כְסִיל
  choice: 愚昧人
  rationale: 在《箴言》中，这个词主要指在道德和属灵判断上愚顽的人，并非单指智力低下；“愚昧人”可保留智慧文学中的固定内涵。
- source_word: תַּעֲנוּג
  choice: 享受奢华
  rationale: 该词可泛指享乐或愉悦，但本节的社会处境较可能指优裕、奢华的享受；译作“享受奢华”既自然，也保留其名词性内容。
- source_word: אַף כִּי
  choice: 何况
  rationale: 该结构在这里引出更不相宜的情形，形成由轻到重的递进；汉语否定句后的“何况……呢”自然表达“更不用说”的意思。
- source_word: עֶבֶד
  choice: 奴隶
  rationale: 该词可涵盖多种服役或受辖制的身份；本句的力度来自低下身份与统治高位者之间的强烈倒置，因此采用“奴隶”。
- source_word: מְשֹׁל
  choice: 辖管
  rationale: 表示行使统治权或管辖权；“辖管”凝练，并能清楚表达对人的权柄。
- source_word: שָׂרִים
  choice: 王公
  rationale: 指身居高位的领袖、贵族或官长；“王公”能保留其高贵身份以及与奴隶之间的社会反差。
