  text: קֹֽנֶה לֵּ֭ב אֹהֵ֣ב נַפְשׁ֑/וֹ שֹׁמֵ֥ר תְּ֝בוּנָ֗ה לִ/מְצֹא טֽוֹב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/008.yaml
  text: Whoever gains sense loves his own life[b][a]; whoever keeps understanding will find good.
translation:
  language: zh_hans
  text: 获得明辨之心的人，爱惜自己的生命[a][b]；持守悟性的，必得益处。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “明辨之心”中的“心”直译为“心”。在希伯来智慧文学中，“心”常指人的思想、判断和辨别能力。
    reason: lexical_alternative
  - marker: b
    text: “爱惜自己的生命”也可译为“爱自己”或“爱惜自己的性命”。原词可指本人或生命，并不只指狭义的“灵魂”。
    reason: lexical_alternative
lexical_decisions:
- source_word: קֹנֶה
  choice: 获得
  rationale: 该词在此意为取得、获得；宾语是抽象的“心”，译作“获得”自然，也不误导为商业上的“购买”。
- source_word: לֵּב
  choice: 明辨之心
  rationale: 字面为“心”，但在希伯来智慧文学中常指思考、判断和辨别的内在能力。“明辨之心”兼顾原文意象与语境中的认知含义。
- source_word: אֹהֵב נַפְשׁוֹ
  choice: 爱惜自己的生命
  rationale: נֶפֶשׁ在这里可指本人、性命或生命，不宜局限为与身体相对的“灵魂”；“爱惜自己的生命”符合箴言所表达的明智自爱。
- source_word: שֹׁמֵר
  choice: 持守
  rationale: 该分词含谨慎守护、保存并坚持之意；“持守”适合与抽象名词“悟性”搭配。
- source_word: תְּבוּנָה
  choice: 悟性
  rationale: 这是智慧文学中表示理解力、洞察力和辨别力的常用词；“悟性”简洁而庄重，并与前句“明辨之心”形成自然对应。
- source_word: לִמְצֹא טוֹב
  choice: 必寻得福祉
  rationale: 原文直译为“寻得好处／美善”。这里的טוֹב可指所得的好处、福乐或福祉；“福祉”保留其宽泛的正面含义，“必”表达箴言句式所指向的结果。
theological_decisions:
- issue: נַפְשׁוֹ所指是“灵魂”、自我还是生命
  choice: 生命
  alternative: 自己；灵魂
  rationale: 此处语境谈明智行为给本人带来的益处，נֶפֶשׁ不必指狭义的非物质灵魂。正文采用“生命”，脚注保留“自己”等可能理解。
- issue: טוֹב是道德上的善还是所得的好处
  choice: 福祉
  alternative: 美善；好处
  rationale: 原词存在宽泛含义，可能涵盖福乐、益处及美善结果。“福祉”避免把它仅限定为道德品质或物质利益。
translation_notes:
  register: 采用现代、庄重而易懂的箴言体。前后两句保持平行结构；“明辨之心”保留希伯来文“心”的意象，同时用“明辨”说明其智慧语境中的含义。脚注标记按相关词语的出现次序排列。
