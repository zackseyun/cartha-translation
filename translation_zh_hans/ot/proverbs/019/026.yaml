  yaml_path: translation/ot/proverbs/019/026.yaml
  text: He who devastates his father and drives away his mother is a son who brings shame and reproach[a].
translation:
  language: zh_hans
  text: 侵害[a]父亲、赶走母亲的，是使人蒙羞受辱的儿子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “侵害”或译“掠夺”。原文用词可指抢掠、毁坏或严重损害。
    reason: lexical_alternative
lexical_decisions:
- source_word: מְשַׁדֶּד
  choice: 侵害
  rationale: 该分词源自 שׁדד，可表示抢掠、毁坏或施以严重破坏。以父亲为宾语时，“侵害”在现代汉语中自然，并保留其行为可能涉及财物掠夺或更广泛恶待的空间；另以脚注列出较具体的译法。
- source_word: אָב
  choice: 父亲
  rationale: 按亲属关系直接翻译；汉语无需另加物主代词，也自然可理解为行为者自己的父亲。
- source_word: יַבְרִיחַ
  choice: 赶走
  rationale: 这是 ברח 的使役形，表示使母亲逃离或迫使她离开；“赶走”准确保留使役意味，也符合现代汉语表达。
- source_word: אֵם
  choice: 母亲
  rationale: 按平行结构直接翻译，与“父亲”相称。
- source_word: בֵּן
  choice: 儿子
  rationale: 此处作表语，用来界定前述行为者；“是……的儿子”保留格言式判断。
- source_word: מֵבִישׁ
  choice: 使人蒙羞
  rationale: 该使役分词表达造成羞耻；“使人蒙羞”保留主动、使役意义，而不把它弱化为行为者自身仅仅觉得羞愧。
- source_word: וּמַחְפִּיר
  choice: 令人受辱
  rationale: 与前一分词平行，表达造成耻辱或羞辱。“令人受辱”既保留使役性质，也在汉语中形成自然的递进平行。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的格言体。前半句以两个并列动作为主题，后半句作身份和品格判断；末尾两个使役表达保持希伯来文的平行结构，不额外限定究竟是谁蒙羞受辱。
