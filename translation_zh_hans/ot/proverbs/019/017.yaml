id: PRO.19.17
reference: Proverbs 19:17
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: מַלְוֵ֣ה יְ֭הוָה ח֣וֹנֵֽן דָּ֑ל וּ֝/גְמֻל֗/וֹ יְשַׁלֶּם לֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/017.yaml
  text: Whoever is gracious to the poor lends to Yahweh[a], and he will repay him for his deed.
translation:
  language: zh_hans
  text: 恩待贫穷人的，就是借给耶和华；他所行的，耶和华必偿还他。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“耶和华必把他的回报偿还给他。”
    reason: 原文וּגְמֻלוֹ יְשַׁלֶּם לוֹ较直译为“他的回报，他必偿还给他”；“回报”也可能指他所行之事或所施的恩惠。
lexical_decisions:
- source_word: מַלְוֵה
  choice: 借给
  rationale: 该词是לוה的使役分词，意为“借给”。保留借贷比喻，不弱化为一般的“给予”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的专名“耶和华”呈现四字神名，而不以“主”这一称号替代。
- source_word: חֹנֵן
  choice: 恩待
  rationale: חנן的分词表示施恩、厚待；“恩待”既自然庄重，也保留恩惠之意。
- source_word: דָּל
  choice: 贫穷人
  rationale: 此处主要指贫寒、处境卑微的人；“贫穷人”清楚保留其社会经济含义。
- source_word: וּגְמֻלוֹ
  choice: 他所行的
  rationale: גמול可指行为、回报或所施之惠。结合后面的“偿还”，译为“他所行的”较自然，同时在脚注保留更贴近词序的可能译法。
- source_word: יְשַׁלֶּם
  choice: 必偿还
  rationale: שלם的加强词干在此表示偿还、报答，与前句“借给”的比喻相呼应；“必”体现未完成式在箴言断言中的将来或确定意味。
- source_word: לוֹ
  choice: 他
  rationale: 代词最自然地回指恩待贫穷人的人；中文在“偿还他”中可直接作宾语。
theological_decisions:
- issue: 慷慨对待贫穷人与上帝之间的借贷比喻
  choice: 保留“借给耶和华”的直接表述，并明确由耶和华偿还施惠者。
  alternative: 释义为上帝看见并奖赏人的善行。
  rationale: 希伯来文明确把恩待贫穷人描述为借给耶和华；保留这一张力，可表达上帝与贫穷人的紧密认同，却不额外引入回报形式或功德交换等教义判断。
- issue: 末句主语的表达
  choice: 在中文中重复“耶和华”，译作“耶和华必偿还他”。
  alternative: 仅用“他必偿还他”，保留原文代词形式。
  rationale: 希伯来文动词主语承接耶和华，而宾语代词指施惠者。中文若连续使用两个“他”容易产生歧义，因此重复神名以澄清语法关系，不改变所指。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“恩待”保留施恩的词义，“借给—偿还”维持原文鲜明的财务比喻。脚注标记置于相关末句之后。
