  yaml_path: translation/ot/proverbs/019/019.yaml
  text: A hot-tempered man bears the penalty[a], for if you rescue him, you will only have to do it again.
translation:
  language: zh_hans
  text: 暴怒的人必承受惩罚[a]；你若救他，还得再救。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “暴怒的人”原文是紧凑的说法，可直译为“盛怒之人”或“拥有烈怒的人”；末句直译近于“你还要再加一次”，所加的事在原文中没有明说，通常理解为再次搭救他。
    reason: lexical_alternative
lexical_decisions:
- source_word: גרל חֵמָה
  choice: 暴怒的人
  rationale: גרל（马所拉文本通常作 גְּדָל）与 חֵמָה 构成紧凑表达，指被烈怒所支配、脾气暴烈的人。“暴怒的人”在现代汉语中自然，并保留 חֵמָה 所含的强烈怒气，而非泛指偶尔生气。
- source_word: נֹשֵׂא עֹנֶשׁ
  choice: 必承受惩罚
  rationale: נֹשֵׂא 是“承担、承受”的分词，具有箴言式的一般陈述色彩；עֹנֶשׁ 可指惩罚、处罚或罚责。“承受惩罚”贴近原文，且不限定惩罚的具体形式。加入“必”自然表达格言中的确定后果，并非将分词强行改作特定时态。
- source_word: כִּי אִם תַּצִּיל
  choice: 你若救他
  rationale: כִּי אִם 在此引出解释性的条件句；תַּצִּיל 是 נצל 的使役式，意为“搭救、解救”。宾语在希伯来文中省略，汉语为清楚起见按上下文补出“他”。
- source_word: וְעוֹד תּוֹסִף
  choice: 还得再救
  rationale: 原文直译近于“还要再加一次”，没有明说重复的动作。上下文最自然地指还要再次搭救同一个人。“还得再救”保留反复介入的警告，并以脚注说明原文的省略性，避免掩盖其表达张力。
