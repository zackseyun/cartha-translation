    rationale: 原文构式描写以强烈怒气为特征的人；“性情暴烈的人”更清楚地传达这种恒常性，且仍保留怒气强度。
  - severity: low
    issue: 原脚注把末句说成“再加一次”，略显过度具体。
    rationale: וְעוֹד תּוֹסִף 的字面核心是“还要加上/继续”；动作和次数均有省略。应说明上下文通常理解为再一次搭救，但不将其当成明说。
