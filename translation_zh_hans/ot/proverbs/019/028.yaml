  text: עֵ֣ד בְּ֭לִיַּעַל יָלִ֣יץ מִשְׁפָּ֑ט וּ/פִ֥י רְ֝שָׁעִ֗ים יְבַלַּע אָֽוֶן־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/028.yaml
  text: A worthless witness mocks justice[c][b][a], and the mouth of the wicked swallows iniquity.
translation:
  language: zh_hans
  text: '卑劣的[a]证人嘲弄公正[b]；

    恶人的口吞下罪恶[c]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “卑劣的”原文为 beliyyaʿal，意为卑劣、败坏或毫无价值。也可直译为“彼列的”，但这里更可能不是专名。
    reason: lexical_alternative
  - marker: b
    text: “嘲弄公正”也可译作“嗤笑审判”或“蔑视公断”。
    reason: lexical_alternative
  - marker: c
    text: “罪恶”也可译作“邪恶”“祸患”或“虚假”；“吞下”也可译作“吞吃”。原文保留了恶人口中吞食邪恶的强烈意象。
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵד
  choice: 证人
  rationale: 该词指作证的人；本节具有司法语境，“证人”准确、自然，并与“公正”相呼应。
- source_word: בְּלִיַּעַל
  choice: 卑劣的
  rationale: 这里修饰“证人”，描述其道德上的败坏和不堪，而非采用后期作为专名的“彼列”。“卑劣的”在现代汉语中自然，也保留了强烈的贬义。
- source_word: יָלִיץ
  choice: 嘲弄
  rationale: 此处表达轻蔑、嗤笑的态度；“嘲弄”简洁地传达证人对司法公正的蔑视。
- source_word: מִשְׁפָּט
  choice: 公正
  rationale: 该词可指审判、判决或正义。这里着重于卑劣证人所蔑视的司法正道，译作“公正”兼顾法律和伦理含义。
- source_word: פִי
  choice: 口
  rationale: 保留原文具体的身体意象，并与后面的“吞下”形成鲜明而连贯的比喻。
- source_word: רְשָׁעִים
  choice: 恶人
  rationale: 原文为复数实体化形容词，泛指邪恶之人。汉语“恶人的口”可自然表达这一群体性概念。
- source_word: יְבַלַּע
  choice: 吞下
  rationale: 该动词本义为吞咽、吞吃；“吞下”保留原文与“口”相配的生动比喻，同时不额外限定是贪食还是毁灭。
- source_word: אָוֶן
  choice: 罪恶
  rationale: 该词语义包括罪恶、祸患、虚妄或欺诈。此处与卑劣证人及恶人平行，“罪恶”最能概括其道德含义，同时用脚注保留其他可能。
theological_decisions:
- issue: בְּלִיַּעַל 是普通名词性描述还是专名
  choice: 按普通形容性用法译为“卑劣的”
  alternative: 译为“彼列的”
  rationale: 在本节的智慧文学语境中，该词直接修饰“证人”，最自然地表示其卑劣败坏；采用后期人格化专名会把较晚的观念带入本节。
translation_notes:
  register: 采用简洁、对称的箴言体，以分号和分行呈现希伯来诗歌的平行结构。措辞庄重但通俗；保留“口—吞下”的具体比喻，不将其解释性改写为“说出谎言”或“喜爱作恶”。
