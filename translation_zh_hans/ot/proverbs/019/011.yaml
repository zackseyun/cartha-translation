  text: שֵׂ֣כֶל אָ֭דָם הֶאֱרִ֣יךְ אַפּ֑/וֹ וְ֝/תִפאַרְתּ֗/וֹ עֲבֹ֣ר עַל פָּֽשַׁע־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/011.yaml
  text: A man's insight makes him slow to anger[b][a], and it is his glory to overlook an offense.
translation:
  language: zh_hans
  text: 人的明智使他不轻易发怒[a]；宽容过犯[b]，是他的荣耀。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语直译为“使他的鼻子变长”，是“不轻易发怒、耐心忍让”的惯用说法。
    reason: idiom
  - marker: b
    text: “宽容过犯”也可译为“越过过犯”或“不追究过犯”。
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׂכֶל
  choice: 明智
  rationale: 此词指实际的洞察力、通达和健全判断。“明智”自然简洁，也清楚表达这种智慧带来的克制。
- source_word: אָדָם
  choice: 人
  rationale: 这里泛指个体的人，并非专指男性；现代汉语用“人”即可自然保留其普遍意义。
- source_word: הֶאֱרִיךְ אַפּוֹ
  choice: 使他不轻易发怒
  rationale: 希伯来语直译为“使他的鼻子变长”，是延缓动怒、保持忍耐的惯用语；译文传达其实际含义，并保留明智促成克制的因果关系。
- source_word: וְתִפְאַרְתּוֹ
  choice: 是他的荣耀
  rationale: תִפְאֶרֶת 可表示荣美、尊荣或荣耀；此处指一件使人可敬、值得称许的事。“荣耀”保留了原词较强的褒义。
- source_word: עֲבֹר עַל
  choice: 宽容
  rationale: 该短语本义为“越过、不追究”，语境中指不因所受冒犯而执意追究或报复。“宽容”符合现代汉语表达，又不像“饶恕”那样把含义限定得过强。
- source_word: פָּשַׁע
  choice: 过犯
  rationale: 此词可指悖逆、违法或冒犯；在人际语境中，“过犯”既保留行为的严重性，也不把它局限为技术性的神学术语。
theological_decisions:
- issue: “越过过犯”是否等同于完全赦免
  choice: 译作“宽容过犯”，表示不追究、不报复
  alternative: 译作“饶恕过犯”
  rationale: 原文强调从过犯之上越过，可能包含饶恕，却未明确界定完整的赦免过程；因此避免用更强、更专门的措辞消除其语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的箴言体。前后两分句简洁对称；“不轻易发怒”传达希伯来语习语，“宽容过犯”则保留人际冒犯语境及“不予追究”的开放含义。
