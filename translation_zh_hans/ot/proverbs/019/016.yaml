  text: שֹׁמֵ֣ר מִ֭צְוָה שֹׁמֵ֣ר נַפְשׁ֑/וֹ בּוֹזֵ֖ה דְרָכָ֣י/ו יומת׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/016.yaml
  text: Whoever keeps the commandment keeps his life[b][a]; he who despises his ways will die.
translation:
  language: zh_hans
  text: 谨守诫命的，保全自己的性命[a]；藐视自己行事为人的[b]，必被处死[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “性命”所译的希伯来语也可按语境指“自己”或“灵魂”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“藐视他的道路”；也可译为“藐视自己的行为”。也有人把“他的道路”理解为上帝的道路。
    reason: alternative_reading
  - marker: c
    text: 原文采用被动形式；也可译为“必死”。经文没有说明使他死亡的施事者；“被处死”不必限定为具体的司法程序。
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: שֹׁמֵר
  choice: 谨守／保全
  rationale: 同一希伯来语分词在两处分别以合乎汉语搭配的“谨守”和“保全”表达，既保留持续留意、守护的意味，也清楚呈现“遵守诫命”和“保全性命”的平行关系。
- source_word: מִצְוָה
  choice: 诫命
  rationale: 保留希伯来语单数形式及其箴言式的泛指意义，指当守的命令，并不限定为某一条具体诫命。
- source_word: נַפְשׁוֹ
  choice: 自己的性命
  rationale: נֶפֶשׁ在此与下半句的死亡结局相对，主要指人的生命，而非后期神学意义上的非物质“灵魂”。
- source_word: בּוֹזֵה
  choice: 轻忽
  rationale: 该词含轻蔑、不重视之意；在“自己的道路”这一语境中，“轻忽”自然表达不把自身行为及其后果当回事，避免“藐视自己的道路”在现代汉语中的生硬感。
- source_word: דְרָכָיו
  choice: 自己所行的道路
  rationale: “道路”保留智慧文学常用的行为与生活方式意象；第三人称单数词尾按最自然的句法理解为回指该分句的主体。
- source_word: יומת
  choice: 必被置于死地
  rationale: 该词为Hophal被动式；此译保留被动色彩和确定的死亡结局，又比“必被处死”较少暗示具体司法程序或明确施事者。
theological_decisions:
- issue: “他的道路”（דְרָכָיו）的所指
  choice: 理解为该人的自身道路或行为
  alternative: 可理解为上帝的道路，或泛指诫命所指示的道路
  rationale: 第三人称单数词尾最自然地回指本分句的主体，且原文没有明说“上帝”或“耶和华”；正文不增添未明示的神学对象，脚注则保留其他可能理解。
- issue: נֶפֶשׁ的含义
  choice: 性命
  alternative: 自己；灵魂
  rationale: 上下两句形成生命与死亡的对照，因此语境首先指今生性命；这样也避免把后期较专门的灵魂观念带入经文。
- issue: יומת的被动形式与施事者
  choice: 必被置于死地
  alternative: 必死；必被处死
  rationale: 保留原文被动形式，却不指定是谁或什么使其死亡；既不将其窄化为司法处决，也不完全抹去原文的被动语态。
translation_notes:
  register: 采用现代、庄重而易懂的箴言体。“谨守—保全”使重复词根在汉语中搭配自然；“道路”保留智慧文学意象。“必被置于死地”兼顾原文被动形式与箴言所表达的必然结局。
