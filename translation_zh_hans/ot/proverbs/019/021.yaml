  yaml_path: translation/ot/proverbs/019/021.yaml
  text: Many are the plans in a man's heart[a], but the counsel of Yahweh will stand.
translation:
  language: zh_hans
  text: 人心里有许多计划[a]，但耶和华的筹算必立得住。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “计划”也可译作“意念”或“打算”。
    reason: lexical_alternative
lexical_decisions:
- source_word: רַבּוֹת
  choice: 有许多
  rationale: 保留原文所强调的数量众多，同时采用自然的现代汉语句式。
- source_word: מַחֲשָׁבוֹת
  choice: 谋算
  rationale: 此词不仅可指思想，也可指筹划或意图；“谋算”兼具内心思量与计划之意，并与下句形成恰当对照。
- source_word: בְּלֶב אִישׁ
  choice: 人心里
  rationale: “心”保留希伯来语中思考和意志中心的意象；אִישׁ在此具有泛指作用，现代汉语用“人”自然且不改变所指范围。
- source_word: וַעֲצַת
  choice: 但……旨意
  rationale: 连接词在对偶结构中表达转折，译作“但”；עֵצָה在此指确定的筹划或意旨，“旨意”能自然表达其与人的谋算之间的对照。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经传统中对四字神名的通行音译，明确保留专名。
- source_word: הִיא
  choice: 由句法重心体现
  rationale: 阴性代词回指“旨意”并带强调作用；汉语若直译“它”较生硬，因此借“但”和主语位置体现强调。
- source_word: תָקוּם
  choice: 必立定
  rationale: קום在本语境指站立得住、确立并持续有效；“立定”保留站立与确立的意象，“必”表达未完成式在箴言断言中的确定性。
theological_decisions:
- issue: 人的筹划与耶和华旨意的关系
  choice: 人的谋算虽多，耶和华的旨意却必立定。
  alternative: 只有上帝的计划会发生，人的计划全都无效。
  rationale: 原文强调二者的对照以及耶和华旨意的稳固有效，但没有进一步说明一切事件的因果机制，因此不作更强的决定论式扩写。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语，保持箴言式对偶。“人心里”保留原文的心灵意象；“耶和华”保留神名；不以解释性措辞消解人的筹划与神旨意之间的张力。
