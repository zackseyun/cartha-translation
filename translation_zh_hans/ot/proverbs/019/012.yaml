base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/012.yaml
  text: A king’s wrath is like the growling of a young lion[b][a], but his favor is like dew on the grass.
translation:
  language: zh_hans
  text: 王的震怒如少壮狮子的吼声[a]；他的恩宠[b]却如草上的露水。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“少壮狮子的低吼”。
    reason: lexical_alternative
  - marker: b
    text: “恩宠”也可译作“善意”、“喜悦”或“悦纳”。
    reason: lexical_alternative
lexical_decisions:
- source_word: נַהַם
  choice: 吼声
  rationale: 该词指狮子的低吼或咆哮；“吼声”在现代汉语中自然凝练，也保留原文声音所带来的威慑感。
- source_word: כְּפִיר
  choice: 少壮狮子
  rationale: 该词通常指年轻而已有力量的狮子，并非幼小无害的狮崽；“少壮狮子”兼顾年龄和危险性。
- source_word: זַעַף
  choice: 震怒
  rationale: 该词表达强烈的愤怒；“震怒”既符合君王语境，也保留箴言庄重有力的语气。
- source_word: מֶלֶךְ
  choice: 王
  rationale: 直接对应原文，在智慧文学的君王语境中简洁自然。
- source_word: וּכְטַל
  choice: 却如……露水
  rationale: 希伯来语连接词可作并列，但两句意象形成鲜明对照，因此用“却”自然呈现语义上的转折；露水意象按原文保留。
- source_word: עַל
  choice: 在……上
  rationale: 按现代汉语习惯与“草上的露水”组合表达。
- source_word: עֵשֶׂב
  choice: 草
  rationale: 该词可泛指草本植物或青草；此处译作“草”最简洁鲜明。
- source_word: רְצוֹנוֹ
  choice: 他的恩宠
  rationale: 该词可指喜悦、善意、悦纳或恩惠；在与王的震怒相对的语境中，“恩宠”自然表达君王给予的好意，同时保留其语义幅度。
