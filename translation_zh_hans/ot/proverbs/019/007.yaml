  text: כָּ֥ל אֲחֵי רָ֨שׁ שְֽׂנֵאֻ֗/הוּ אַ֤ף כִּ֣י מְ֭רֵעֵ/הוּ רָחֲק֣וּ מִמֶּ֑/נּוּ מְרַדֵּ֖ף אֲמָרִ֣ים לא הֵֽמָּה־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/007.yaml
  text: All the brothers of a poor man hate him[a]; how much more do his friends keep far from him! He pursues words[b], but they are not there.
translation:
  language: zh_hans
  text: 穷人的兄弟全都恨他[a]；何况他的朋友更远离他！他追逐言语，却得不着。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“兄弟”，语法上为阳性复数；在本箴言的社会背景中，也可泛指家庭成员。
    reason: cultural_note
  - marker: b
    text: 本节末句的希伯来文本在句法和文本上都很难解释。也可译作：“他追逐的不过是空话”，或“他追逐承诺，那些承诺却不见了。”
    reason: alternative_reading
lexical_decisions:
- source_word: רָשׁ
  choice: 穷人
  rationale: 指贫穷、困乏的人。希伯来文虽为阳性单数，但汉语“穷人”自然地保留单数所指，不必另加“男人”。
- source_word: אֲחֵי
  choice: 兄弟
  rationale: 该词为“兄弟”的复数构造式，直接保留家庭关系；在本箴言的社会背景中也可涵盖同族男性亲属。
- source_word: שְׂנֵאֻהוּ
  choice: 恨他
  rationale: שׂנא通常意为“恨”，译作“厌弃”会减弱原文的强烈程度。
- source_word: אַף כִּי
  choice: 何况……更是
  rationale: 表达由强到更强的递进推论：连兄弟都恨他，朋友就更会疏远他。
- source_word: מְרֵעֵהוּ
  choice: 他的朋友
  rationale: 该词指朋友、伙伴；此处与“兄弟”相对，“朋友”最自然。
- source_word: רָחֲקוּ מִמֶּנּוּ
  choice: 远离他
  rationale: 保留“变得遥远、保持距离”的关系性含义，现代汉语简洁自然。
- source_word: מְרַדֵּף
  choice: 他追逐
  rationale: 该分词在句法上较难确定；按上下文将其视为继续描述穷人，以动词句表达其持续追寻。
- source_word: אֲמָרִים
  choice: 言语
  rationale: 基本义为“话、言语、说法”。上下文或指承诺、安慰之言，但正文保留原文较宽泛的措辞。
- source_word: לֹא הֵמָּה
  choice: 那些话却并不存在
  rationale: 原文末句极其简略，直译近于“它们不是／它们不在”。此译保留其所追之言落空、无从寻得的含义，同时不把“言语”明确限定为“承诺”。
theological_decisions:
- issue: 末句所追逐的“言语”具体指什么
  choice: 正文不明确解释，只译为“言语”
  alternative: 译为“承诺”或“空话”
  rationale: 希伯来文本没有明说这些话是承诺、请求还是空话；保留含混可避免加入原文未确定的社会或道德判断。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“何况……更是”呈现原文的递进力度；末句刻意保留原文的突兀和含混，并以脚注交代主要替代解释。
