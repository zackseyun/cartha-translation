  yaml_path: translation/ot/proverbs/019/004.yaml
  text: Wealth adds many friends[a], but a poor man is separated from his friend.
translation:
  language: zh_hans
  text: 财富使朋友增多，穷人却与朋友疏远[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“被朋友离弃。”希伯来语动词表示分离，并未明确说明是穷人主动疏远，还是朋友离弃他；上下文较倾向于后者。
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹן
  choice: 财富
  rationale: 指物质财富或产业；“财富”自然、庄重，也不局限于现金。
- source_word: יֹסִיף
  choice: 使……增多
  rationale: 使役形表达“增加、增添”；这里指财富使交往之人的数目增加。
- source_word: רֵעִים רַבִּים
  choice: 朋友增多
  rationale: רֵעִים可指朋友、同伴或邻舍；本句着眼于社会关系，“朋友”最贴切，“增多”已体现רַבִּים的数量含义。
- source_word: דָל
  choice: 穷人
  rationale: 指贫穷、弱势或地位低微的人；“穷人”保留单数泛指，并与前句的财富形成鲜明对照。
- source_word: מֵרֵעֵהוּ
  choice: 与朋友
  rationale: 介词מִן本义为“从、离开”，与יִפָּרֵד合译为“与朋友疏远”，保留关系分离的意思；单数在箴言中可作泛指。
- source_word: יִפָּרֵד
  choice: 疏远
  rationale: פרד的尼法勒式可表示分开、被分开或隔绝；“疏远”符合人际语境，同时不明确断定是穷人主动离开，还是朋友抛弃他。
theological_decisions: []
translation_notes:
  register: 采用现代、凝练而庄重的箴言体。“财富使朋友增多”比逐字译作“财富增添许多朋友”更符合现代汉语；后半句保留原文关于分离责任主体的含混性。
