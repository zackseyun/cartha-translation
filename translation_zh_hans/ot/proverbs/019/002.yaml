base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/002.yaml
  text: Also[a], without knowledge, desire is not good, and whoever hurries with his feet sins.
translation:
  language: zh_hans
  text: 再者，缺乏知识的欲望并非好事[a]；脚步匆忙的人犯罪。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“人没有知识，并非好事。”希伯来语“נֶפֶשׁ”在这里可理解为人的欲望、胃口，也可指人本身。
    reason: 词义和句法存在多种可能
lexical_decisions:
- source_word: גַּם
  choice: 再者
  rationale: 保留承接、增补的语气，又符合现代汉语箴言体的表达。
- source_word: בְּלֹא דַעַת
  choice: 没有知识
  rationale: 直接表达“缺少知识”的意思，并保留箴言中兼具认知与道德判断的宽广含义。
- source_word: נֶפֶשׁ
  choice: 欲望
  rationale: 此处可指人的欲求、胃口或生命主体；正文按与下半句“匆忙”相呼应的内在冲动理解为“欲望”，同时以脚注保留“人”的句法可能。
- source_word: לֹא טוֹב
  choice: 并非好事
  rationale: 自然地保留希伯来文简洁的否定判断和箴言语气。
- source_word: וְאָץ
  choice: 匆忙的
  rationale: 表达分词所指的一般性、习惯性急躁行为。
- source_word: בְּרַגְלַיִם
  choice: 脚步
  rationale: 保留原文具体的身体意象，同时使汉语表达自然。
- source_word: חוֹטֵא
  choice: 难免犯罪
  rationale: 保留 חטא 的道德分量；“难免”在汉语中自然传达此分词所作的一般性警告，而不是把它限定为某一次行为。
theological_decisions:
- issue: נֶפֶשׁ 在上半句中的所指
  choice: 正文译为“欲望”
  alternative: “人没有知识，并非好事”
  rationale: 原文结构容许把 נֶפֶשׁ 理解为欲求或作为“人”本身。正文采用“欲望”，使上下两句共同警戒无知而冲动的行动；脚注保留另一种真实可能，不把歧义作教义化处理。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“脚步匆忙”保留原文形象；“难免犯罪”延续箴言式的一般警告。
