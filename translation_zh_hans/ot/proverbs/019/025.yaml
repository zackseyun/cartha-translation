base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/025.yaml
  text: Strike a scoffer[a], and the simple will become shrewd; rebuke one who has understanding[c][b], and he will gain knowledge.
translation:
  language: zh_hans
  text: 责打嘲讽者[a]，愚蒙人便会变得精明[b]；责备明达的人[c]，他便会获得知识。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “嘲讽者”也可译作“讥诮者”。
    reason: lexical_alternative
  - marker: b
    text: “变得精明”也可译作“学会谨慎”。
    reason: lexical_alternative
  - marker: c
    text: 原文为单数，指“明达的人”，即有辨识力的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵץ
  choice: 嘲讽者
  rationale: 该词在《箴言》中指以轻蔑态度讥诮智慧和管教的人。“嘲讽者”保留其道德贬义，也比“戏弄人的”更准确。
- source_word: תַּכֶּה
  choice: 责打
  rationale: 此处表示施以惩戒性的击打；“责打”既体现身体惩罚，也表明其管教性质。
- source_word: פֶתִי
  choice: 愚蒙人
  rationale: 这是智慧文学中的固定人物类型，指缺乏判断、容易受诱惑、尚未定型的人；“愚蒙人”沿用清楚而庄重的中文智慧文学用语。
- source_word: יַעְרִם
  choice: 变得精明
  rationale: 该动词在此为不及物意义，表示获得实际判断力或处世的机敏；“变得精明”准确呈现状态改变。
- source_word: וְהוֹכִיחַ
  choice: 责备
  rationale: 此处指以言语指出错误、加以纠正；“责备”简洁自然，并与前半句身体性的“责打”形成区别。
- source_word: לְנָבוֹן
  choice: 明达的人
  rationale: 该词指有辨识力、能理解事理的人。“明达的人”保留单数人物类型，又符合《箴言》的庄重语体。
- source_word: יָבִין
  choice: 领悟
  rationale: בין 的基本意义是理解、辨明；与“知识”搭配时，“领悟知识”既忠于原文，也避免把动词过度解释为单纯的获得。
- source_word: דָּעַת
  choice: 知识
  rationale: 这是《箴言》的核心智慧词汇，指对真理与正当生活的认识；直译为“知识”可保留其与“明达”的概念区别。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的箴言体。两个分句以“要……，使……”和“要……，他就……”形成对照：愚蒙人从旁观惩罚中受教，明达的人则从直接责备中继续学习。保留原文单数人物类型及“责打”与“责备”的力度差别。
