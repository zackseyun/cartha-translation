    reason: lexical_alternative
  - marker: c
    text: 原文为单数，指“明达的人”，即有辨识力的人。
    reason: lexical_alternative
  revision_rationale: The revision retains the draft's sound lexical choices and footnote anchors, while making the proverb read as a concise generalizing statement rather than an overt command. It also replaces the less idiomatic “领悟知识” with “获得知识,” which better conveys the resultative force in context.
