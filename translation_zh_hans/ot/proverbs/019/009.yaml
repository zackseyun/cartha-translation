  yaml_path: translation/ot/proverbs/019/009.yaml
  text: A false witness will not go unpunished[b][a], and one who breathes out lies will perish.
translation:
  language: zh_hans
  text: 作假见证的人，必不能逃脱惩罚[a]；吐露谎言的人，必灭亡[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“必不被判为无罪”或“必不免受惩罚”。原文动词可强调不被视为无罪，也可强调必受惩罚。
    reason: lexical_alternative
  - marker: b
    text: “吐露谎言”原文直译为“呼出谎言”；这表达描绘谎言像呼吸一样从人口中发出。
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵד שְׁקָרִים
  choice: 作假见证的
  rationale: 该词组直指提供虚假证言的人；此译法既保留司法和见证语境，也比名词式“假见证人”更符合现代汉语表达。
- source_word: לֹא יִנָּקֶה
  choice: 必不能逃脱惩罚
  rationale: נקה 的尼法勒式可表示无罪、免罪或免受惩罚；结合智慧文学中的警告语气，此译法传达其绝不会安然脱罪的含义，同时以脚注保留“不能算为无罪”的词义可能。
- source_word: וְיָפִיחַ
  choice: 吐出
  rationale: פוח 的使役式在这里描绘像呼气一样不断说出虚假之言；“吐出”保留原文鲜明意象，又是自然可懂的现代汉语。
- source_word: כְּזָבִים
  choice: 谎言
  rationale: 该复数名词指虚假之言或欺骗性陈述；“谎言”简洁、自然，并与“吐出”搭配。
- source_word: יֹאבֵד
  choice: 必灭亡
  rationale: אבד 的基本义为灭亡、毁灭或消失；“必灭亡”保留原文严厉而简洁的结局宣告，不将其弱化为一般性的受挫。
theological_decisions: []
translation_notes:
  register: 采用庄重、凝练的现代标准汉语，保持箴言上下两句的平行结构。用两个“必”体现希伯来语未完成体在格言语境中的确定结果；保留“吐出”的呼吸意象，并用脚注说明其修辞效果。
