base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/028.yaml
  text: When the wicked rise[a], a man hides himself, but when they perish[b], the righteous increase.
translation:
  language: zh_hans
  text: 恶人兴起时，人就躲藏[a]；他们灭亡时，义人便增多。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“人就被藏起来”。希伯来语动词既可理解为被动，也可理解为反身或中间意义，即“人就躲藏”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּקוּם
  choice: 兴起时
  rationale: 介词 בְּ 加 קום 的不定式构造在此表示时间；“兴起时”自然简洁，也保留恶人取得势力或地位这一未完全限定的含义。
- source_word: רְשָׁעִים
  choice: 恶人
  rationale: 复数形容词作名词，指邪恶之人；“恶人”是《箴言》中自然、庄重的道德类别用语。
- source_word: יִסָּתֵר
  choice: 就躲藏
  rationale: סתר 的尼法勒形态可有被动或反身、中间意义；上下文较可能指人在恶人兴起时避而藏身，故正文采用“躲藏”，并用脚注保留“被藏起来”的可能。
- source_word: אָדָם
  choice: 人
  rationale: אָדָם 在箴言中可泛指一个人或一般人类；汉语“人”既保留单数代表性，也不额外加入性别限定。
- source_word: וּבְאָבְדָם
  choice: 他们灭亡时
  rationale: וּ 加 בְּ 与带第三人称阳性复数后缀的不定式构造形成对照性的时间分句；汉语借分号清楚呈现转折平行，无须硬译连接词。
- source_word: יִרְבּוּ
  choice: 便增多
  rationale: רבה 表示数量增多，也可能含公开出现或兴盛之意；“增多”保留这种简练而未过度限定的表达。
- source_word: צַדִּיקִים
  choice: 义人
  rationale: 复数形容词作名词，指以公义为特征的人；“义人”是现代中文圣经智慧文学中清楚而庄重的常用表达。
theological_decisions:
- issue: “义人增多”的含义
  choice: 保留为“义人便增多”
  alternative: 义人便兴盛／义人纷纷出现
  rationale: 希伯来语 יִרְבּוּ 可指人数增加，也可能在此社会语境中指义人重新公开活动或影响扩大。正文不替经文决定具体机制，以保留箴言的概括性和张力。
translation_notes:
  register: 采用简洁、对称的现代标准汉语箴言体。“恶人—义人”“兴起—灭亡”“躲藏—增多”构成鲜明对照；不补入“掌权”等原文未明说的政治限定。
