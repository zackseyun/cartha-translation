base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/007.yaml
  text: Whoever keeps the law is a discerning son[b][a], but he who associates with gluttons shames his father.
translation:
  language: zh_hans
  text: 谨守训诲的，是明达的儿子；与贪食无度之徒[b]为伍的[a]，却使自己的父亲蒙羞。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “为伍”原文直译为“牧养”或“放牧”，这里是与某类人结交、相伴的惯用说法。
    reason: lexical_alternative
  - marker: b
    text: “贪食无度之徒”也可泛指挥霍无度、放纵败家的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: נוֹצֵר
  choice: 谨守
  rationale: 该分词有守护、遵行之意；“谨守”既保留忠实持守的意味，也能自然搭配“训诲”。
- source_word: תּוֹרָה
  choice: 训诲
  rationale: 在《箴言》的智慧文学语境中，此词可指具有权威性的教导或训诲，不必在此限定为摩西律法；“训诲”保留了这一语境中的宽度。
- source_word: בֵּן מֵבִין
  choice: 明达的儿子
  rationale: 保留“儿子”的阳性单数，并以“明达”表达具有理解力和辨别力的人。
- source_word: וְרֹעֶה
  choice: 与……为伍
  rationale: 动词本义是“牧养、放牧”，在此与人连用，惯用义是同他们交往、结伴；“为伍”符合现代汉语箴言体。
- source_word: זֹלְלִים
  choice: 贪食无度之徒
  rationale: 该词直接指贪食者，同时含纵欲挥霍、生活放荡的色彩；正文采用其核心义，较广含义留在脚注。
- source_word: יַכְלִים
  choice: 使……蒙羞
  rationale: 使役形式表示使人受羞辱或蒙羞；这一表达清楚保留其使役意义。
- source_word: אָבִיו
  choice: 父亲
  rationale: 按原文直译；中文语境已可由“儿子”及分句关系明确领属关系，无须重复“他的”。
theological_decisions:
- issue: תּוֹרָה在本节是泛指训诲还是特指律法
  choice: 正文译作“训诲”
  alternative: “律法”或“妥拉”
  rationale: 《箴言》中תּוֹרָה常指父母或智慧传统的权威教导；原文本身未明确限定为成文的摩西律法，因此不宜在正文中收窄其指向。
translation_notes:
  register: 采用简洁、对仗的现代箴言体。“谨守—为伍”“明达—蒙羞”形成鲜明对照；语言庄重但不古奥。
