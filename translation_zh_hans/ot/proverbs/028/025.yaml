  text: רְחַב נֶ֭פֶשׁ יְגָרֶ֣ה מָד֑וֹן וּ/בוֹטֵ֖חַ עַל יְהוָ֣ה יְדֻשָּֽׁן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/025.yaml
  text: A greedy person stirs up strife[b][a], but the one who trusts in Yahweh will be enriched.
translation:
  language: zh_hans
  text: 贪得无厌的人[a]挑起纷争；信靠耶和华的人却必丰足[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“心灵宽阔的人”；这是一个可指欲望膨胀、贪求无厌之人的惯用说法。也有人理解为“骄傲的人”或“胃口很大的人”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“必被使肥美”或“必变得肥美”；这是希伯来语表示丰盛、兴旺或福祉的形象说法。
    reason: lexical_alternative
lexical_decisions:
- source_word: רְחַב נֶפֶשׁ
  choice: 贪得无厌的人
  rationale: 字面为“心欲宽大的人”，是指欲望膨胀、贪求不止的人；此译自然表达其负面的道德含义，同时不限定性别。
- source_word: יְגָרֶה
  choice: 挑起
  rationale: 使役形表示引发、煽动；“挑起纷争”是现代汉语中简洁自然的搭配。
- source_word: מָדוֹן
  choice: 纷争
  rationale: 指人与人之间的争执、冲突；“纷争”符合箴言凝练而庄重的语体。
- source_word: וּבֹטֵחַ
  choice: 却……信靠的人
  rationale: 分句之间构成反义平行，因此将连接词按转折关系译为“却”；分词表达持续的品格特征。
- source_word: עַל יְהוָה
  choice: 信靠耶和华
  rationale: 希伯来语字面为“倚靠在耶和华之上”，现代汉语自然表达为“信靠耶和华”；专名按音译处理。
- source_word: יְדֻשָּׁן
  choice: 必丰足
  rationale: 该被动式字面为“必得肥美”，以肥润象征丰盛、兴旺和福祉；“必丰足”保留结果与被赐予的意味，又避免仅理解为发胖或物质致富。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 采用现代简体中文读者最熟悉的圣经专名“耶和华”，明确保留经文中的神圣专名，而不以“主”替代。
- issue: יְדֻשָּׁן 所指的丰盛
  choice: 必丰足
  alternative: 必兴旺／必得肥美
  rationale: 原文采用“得肥美”的福祉意象，但没有限定为金钱财富；“丰足”保留广义的丰盛，不把经文收窄为物质成功的保证。
- issue: 箴言中阳性单数主体的表达
  choice: 人
  alternative: 男人
  rationale: 此处阳性单数具有一般性的代表功能，并非专指男性；译作“人”可自然传达普遍适用的智慧陈述。
translation_notes:
  register: 采用凝练、对称的现代书面汉语，保持箴言的警句感。以分号呈现两分句的反义平行；“贪得无厌”明确首句的负面欲求，“丰足”则保留末句意象的广义福祉和一定被动色彩。
