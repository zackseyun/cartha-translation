base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/002.yaml
  text: Because of a land's transgression[a], its rulers are many, but by a man of understanding and knowledge[b], stability endures.
translation:
  language: zh_hans
  text: 一国因悖逆，首领就多；但借着一个明辨而有知识的人[b]，安定便得以长久[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节后半句的希伯来文较难确定。“安定”是按上下文所作的解释性表达。也可较直译为：“但借着一个明辨而有知识的人，这样（或：其状况）得以延长。”这里可能是说，明智的治理使国家安定得以延续。
    reason: alternative_reading
  - marker: b
    text: “人”所译的希伯来词 אָדָם 在这里是单数泛称，可代表一位明智的领袖或谋士，并非专指某一性别。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּפֶשַׁע
  choice: 因悖逆
  rationale: 介词 בְּ 在此按因果关系理解；“悖逆”保留 פֶשַׁע 所含反叛既定权威、违犯正道的道德与法律意味。
- source_word: אֶרֶץ
  choice: 一国
  rationale: 此处指作为政治共同体的地域或国家；“一国”符合箴言的泛指语气，也比“土地”更贴合上下文。
- source_word: רַבִּים שָׂרֶיהָ
  choice: 首领就多
  rationale: שָׂרִים 可指首领、官长或统治者。“首领”简洁而范围适当；原文只明说人数增多，可能暗含政权频繁更替，但正文不将这一推论明说。
- source_word: וּבְאָדָם
  choice: 但因有……的人
  rationale: וּ 在反义平行中译为“但”；בְּ 表示使相反结果得以出现的凭借或条件，汉语用“因有”较自然。
- source_word: אָדָם
  choice: 人
  rationale: אָדָם 在这里是单数泛称，代表能为国带来稳定的明智之人，并非专指某一性别。
- source_word: מֵבִין יֹדֵעַ
  choice: 有明辨、有知识
  rationale: 分别保留两个分词的意义：בין 强调辨别与洞察，ידע 强调知识与认识，不把二者合并为一个笼统形容词。
- source_word: כֵּן
  choice: 安定
  rationale: 本节后半句希伯来文简约且含义困难。כֵּן 通常可作“这样、如此”，此处也可能指已经确立、井然有序的状态；正文采用“安定”表达最可能的语境意义，同时以脚注保留更形式对应的译法。
- source_word: יַאֲרִיךְ
  choice: 便能长久
  rationale: ארך 的使役式表示使之延长；原文未明说受延长的对象，正文结合政治语境理解为国家的安定得以持久。
theological_decisions:
- issue: 后半句未明说被延长的对象
  choice: 将隐含对象译为“安定”
  alternative: 译作“它就长久”或“这样，他必延长”
  rationale: 上下文对照一国因悖逆而有许多首领与明智者所带来的相反结果，因此“安定”较清楚地传达句意；但因希伯来文语法和指代并不完全明确，脚注保留较直译的可能。
translation_notes:
  register: 采用现代、庄重而易懂的箴言体。分号呈现两行的反义平行；“首领就多”刻意保留原文表层措辞，不直接扩写为“统治者频繁更替”。后半句以自然汉语表达最可能的政治语境意义，并用脚注说明原文的语法与指代歧义。
