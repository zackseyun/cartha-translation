  text: A poor man who oppresses the lowly is like a sweeping rain that leaves no food[a].
translation:
  language: zh_hans
  text: '一个穷人欺压贫弱者，

    就像一场横扫而过、使人无粮可吃的暴雨[a]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“而没有饼。”这里的“饼”可泛指食物或维生所需的供应。
    reason: lexical_alternative
lexical_decisions:
- source_word: גֶּבֶר רָשׁ
  choice: 穷人
  rationale: גֶּבֶר指男性个体，但汉语“穷人”可自然表达本句作为箴言所举的代表人物；רָשׁ明确表示贫穷、缺乏资源的人。
- source_word: עֹשֵׁק
  choice: 欺压
  rationale: 该分词表示持续施行压迫、剥削或侵夺；“欺压”简洁自然，并保留其主动意味。
- source_word: דַּלִּים
  choice: 贫弱的人
  rationale: דַּלִּים可指贫穷、卑微或弱势者。“贫弱的人”既体现经济困乏与社会弱势，也与前面的רָשׁ“穷人”保持词义区别。
- source_word: מָטָר סֹחֵף
  choice: 暴雨冲刷
  rationale: מָטָר是雨，סֹחֵף表示冲刷、席卷或带走。译为“暴雨冲刷”自然呈现具有毁坏力的雨势，而不把比喻解释得过满。
- source_word: וְאֵין לָחֶם
  choice: 导致无粮
  rationale: 原文直译为“而没有饼/食物”。“粮”保留生计口粮的含义，也能自然表达暴雨冲毁收成、使人无食可得的结果；直译信息收入脚注。
theological_decisions: []
translation_notes:
  register: 采用现代、凝练的箴言体。“穷人”与“贫弱的人”保留原文两个近义词之间的区别；第二行保留原文突转为自然灾害意象的简洁张力，不额外说明两者相似之处。
