  text: בּוֹטֵ֣חַ בְּ֭/לִבּ/וֹ ה֣וּא כְסִ֑יל וְ/הוֹלֵ֥ךְ בְּ֝/חָכְמָ֗ה ה֣וּא יִמָּלֵֽט׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/026.yaml
  text: Whoever trusts in his own heart is a fool[b][a], but he who walks in wisdom will escape.
translation:
  language: zh_hans
  text: 倚靠自己的心[a]的人，是愚昧人；凭智慧行事的人，必能逃脱[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语的“心”常指人的内在，包括思想、判断和意志，并不只指情感。
    reason: cultural_note
  - marker: b
    text: 或译：“必蒙解救。”
    reason: lexical_alternative
lexical_decisions:
- source_word: בּוֹטֵחַ
  choice: 倚靠
  rationale: 该分词表示把信心放在某人或某物上；“倚靠”自然地传达依赖、信赖之意，并切合本节对自恃的警告。
- source_word: בְּלִבּוֹ
  choice: 自己内心
  rationale: לֵב 在希伯来语中涵盖思想、判断、意志和情感；“内心”保留原文意象，“自己”则明确表达第三人称单数后缀在此处的自我指向。
- source_word: כְסִיל
  choice: 愚昧人
  rationale: 这是箴言中的典型智慧文学术语，指在道德和判断上愚顽的人；“愚昧人”比单纯的“愚蠢”更能保留其人物类别。
- source_word: וְהוֹלֵךְ
  choice: 行事
  rationale: הלך 在智慧文学中常比喻人的生活方式和行为。“行事”在现代汉语中自然清楚，同时表达这一行为取向。
- source_word: בְּחָכְמָה
  choice: 凭智慧
  rationale: 介词短语说明其行事所依据或遵循的是智慧；“凭智慧”兼顾原文结构与现代汉语表达。
- source_word: יִמָּלֵט
  choice: 必能逃脱
  rationale: מלט 的尼法勒式可指逃脱或蒙解救。“必能逃脱”保持简洁的箴言语气，也不擅自说明所逃脱的具体危险；被动意义另列脚注。
- source_word: הוּא ... הוּא
  choice: 是……必能……
  rationale: 两个显式代词在希伯来语中具有强调作用。汉语不宜逐字重复“他”，故以判断句和“必能”自然呈现两句的断定与强调。
theological_decisions:
- issue: “心”的人观含义
  choice: 译作“内心”，不缩减为“思想”或“情感”
  alternative: 自己；自己的思想
  rationale: 希伯来语的“心”指向完整的内在人，包括思想、判断、意志和情感。保留“内心”可避免把原文的人观缩减为单一心理功能。
- issue: 阳性单数的泛指表达
  choice: 采用汉语泛指结构“……的”，不添加性别限定
  alternative: 倚靠他自己内心的，他是……；他凭智慧行事，就……
  rationale: 原文阳性单数在此具有代表性、泛指作用。现代汉语的“……的”结构无需标明性别即可准确表达泛指，也避免生硬重复代词，并未改变所指范围。
- issue: יִמָּלֵט 的主动结果与被动蒙救张力
  choice: 正文译“必能逃脱”，脚注保留“必蒙解救”
  alternative: 必蒙解救
  rationale: 尼法勒式容许“逃脱”和“被解救”两种侧重。正文采用符合语境的结果表达，同时以脚注保留可能的被动含义，不把救援主体或方式强加给原文。
translation_notes:
  register: 采用现代、庄重而简洁的箴言体。“倚靠自己内心”保留原文的“心”意象；“凭智慧行事”避免“行在智慧中”的翻译腔，同时传达智慧文学中“行走”所指的生活方式。两个分句结构平衡，适合公开诵读。
