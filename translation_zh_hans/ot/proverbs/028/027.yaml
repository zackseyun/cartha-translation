base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/027.yaml
  text: Whoever gives to the poor will have no lack[a], but he who hides his eyes will have many curses.
translation:
  language: zh_hans
  text: '周济穷人的，必不缺乏；

    但对穷人视而不见的[a]，必有许多咒诅。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“遮掩眼目”；也可译为“闭眼不看”。这是指故意忽视穷人的困境。
    reason: lexical_alternative
lexical_decisions:
- source_word: נוֹתֵן
  choice: 周济
  rationale: 该词是נתן的Qal主动分词，在箴言中表达一般、惯常的行为。“周济”自然涵盖给予穷人财物或所需帮助的意思，又不限定具体施予之物。
- source_word: לָרָשׁ
  choice: 穷人
  rationale: רָשׁ指贫穷、困乏的人；单数在此作泛指，汉语以“穷人”自然表达。
- source_word: אֵין מַחְסוֹר
  choice: 必不缺乏
  rationale: 原文是“没有缺乏”的无动词结构。在箴言的结果性对句中译为“必不缺乏”，保留应许性质，也不擅自限定不会缺少什么。
- source_word: וּמַעְלִים עֵינָיו
  choice: 但对穷人视而不见的
  rationale: עלם的Hiphil分词与“眼睛”连用，描绘故意不看、刻意忽视。译文采用现代汉语成语“视而不见”，并依上下文补出“对穷人”，使所指清楚；脚注保留其字面意象。
- source_word: רַב מְאֵרוֹת
  choice: 必多受咒诅
  rationale: 原文直陈“许多咒诅”，未明说动词。汉语补出“受”以形成自然的结果分句；“咒诅”保留מְאֵרוֹת的复数和严肃力度。
theological_decisions:
- issue: “不缺乏”所指的范围
  choice: 不限定为物质富足或今生必然获利
  alternative: 解释为施舍者必定得到物质回报
  rationale: 希伯来文只说“没有缺乏”，并未说明回报的形式或范围；译文保留这一开放性，避免加入报偿机制。
- issue: “咒诅”的施行者与方式
  choice: 保留未明说的施行者
  alternative: 明确译成“必被上帝多多咒诅”或“必受众人咒骂”
  rationale: 原文没有指出咒诅来自上帝、穷人或众人，因此不在正文中替其定解。
translation_notes:
  register: 采用简洁、庄重而通俗的现代标准汉语，维持箴言两行对照。“周济”较“给”更自然地表达向穷人提供帮助；“视而不见”传达希伯来语习语，脚注补足字面图像。
