  rationale: 修订以“常常惧怕”直接对应 מְפַחֵד תָּמִיד，避免“敬畏”所可能引入的明确宗教对象或正面诠释，同时通过脚注保留原文对象未明的特点。“使自己心里刚硬”恢复使役结构；“陷在灾祸中”保留落入灾难性处境的意象。脚注标记已分别移至相应词语之后。
