  text: אַשְׁרֵ֣י אָ֭דָם מְפַחֵ֣ד תָּמִ֑יד וּ/מַקְשֶׁ֥ה לִ֝בּ֗/וֹ יִפּ֥וֹל בְּ/רָעָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/014.yaml
  text: Blessed is the man who is always fearful[b][a], but whoever hardens his heart will fall into calamity.
translation:
  language: zh_hans
  text: 常常惧怕[a]的人有福了；使自己心里刚硬的人必陷在灾祸[b]中。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“常存惧怕。”原文没有明说所惧怕的对象。
    reason: lexical_alternative
  - marker: b
    text: “灾祸”也可译作“邪恶”或“患难”；原词可指邪恶、伤害、困苦或灾难。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: 有福了
  rationale: 这是智慧文学中的称福格式，表示一种值得羡慕的蒙福景况；“有福了”既庄重又符合现代汉语圣经语体。
- source_word: אָדָם
  choice: 人
  rationale: 此处是单数泛指，在汉语中用“人”自然涵盖一般人，不必机械标示阳性。
- source_word: מְפַחֵד תָּמִיד
  choice: 常存敬畏
  rationale: פחד 表示惧怕、畏惧，תמיד 表示持续不断。译作“常存敬畏”保留“惧怕”的核心语义，也能传达智慧语境中的警醒意味，同时不补出原文未明说的对象。
- source_word: וּמַקְשֶׁה לִבּוֹ
  choice: 但内心刚硬的人
  rationale: 使役式 מקשה 与“心”连用，表示使自己的心刚硬、顽梗。“内心刚硬”在现代汉语中自然清楚，并保留道德意志层面的含义。
- source_word: יִפּוֹל
  choice: 必落入
  rationale: 未完成式在箴言的因果陈述中表达必然结果；“必落入”自然呈现这一警告。
- source_word: בְּרָעָה
  choice: 灾祸
  rationale: רָעָה 可指邪恶、祸患、困苦或灾难；这里作为刚硬之心的后果，译作“灾祸”最符合语境，同时以脚注保留其他可能。
theological_decisions:
- issue: 上半句所敬畏的对象
  choice: 不补出具体对象，以“常存敬畏”表达
  alternative: 常常敬畏耶和华；常常谨慎
  rationale: 希伯来文没有明说敬畏的对象。补入“耶和华”虽与箴言整体神学相符，却超出本节明文；仅译作“谨慎”又会削弱 פחד 的惧怕语义。因此正文保留对象未明的张力。
- issue: רָעָה 指道德之恶还是遭遇的祸患
  choice: 按结果义译作“灾祸”
  alternative: 邪恶；患难
  rationale: 本句描述刚硬之心所导致的落入之境，“灾祸”较自然地表达灾难性后果，但脚注保留原词的语义宽度。
translation_notes:
  register: 采用现代、庄重而易懂的箴言体。“常存敬畏”避免把值得称许的态度误解为胆怯，同时不擅自补出敬畏对象；两个脚注标记均置于正文相应概念之后。
