  text: Whoever turns his ear away from hearing the law—even his prayer is an abomination[a].
translation:
  language: zh_hans
  text: '谁把耳朵转开，不肯听从律法[a]，

    连他的祷告也是可憎之物。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “律法”也可译作“训诲”或“教导”。希伯来语 torah 在这里可泛指上帝具有权威的教导，不仅指法律条文。
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵסִיר
  choice: 转……不听
  rationale: 该词是סור的使役形分词，描写一种惯常或典型的主动拒绝；“转耳不听”既保留动作意象，也符合现代汉语表达。
- source_word: אָזְנוֹ
  choice: 耳
  rationale: 保留原文“耳朵”的身体意象，表达有意拒绝聆听，而不抽象化为“听觉”。
- source_word: מִשְּׁמֹעַ
  choice: 不听
  rationale: 原文表示使耳朵离开“听”的行为；汉语用“转耳不听”自然地传达这种回避和拒绝。
- source_word: תּוֹרָה
  choice: 律法
  rationale: “律法”保留该词所含的神圣权威与圣约分量；鉴于תּוֹרָה在智慧文学中也可广指权威性的训诲或教导，脚注列出这一语义范围。
- source_word: גַּם
  choice: 连……也
  rationale: “连……也”表达递进和强调：此人不但拒绝律法，就连他的祷告也成为可憎的。
- source_word: תְּפִלָּתוֹ
  choice: 他的祷告
  rationale: 直译名词及第三人称单数所属后缀；“祷告”是该词在此处最自然、准确的对应。
- source_word: תּוֹעֵבָה
  choice: 可憎的
  rationale: 该词在希伯来圣经中语气强烈，指令人厌恶、不可接受之物；“可憎的”保留其道德与宗教分量，且在现代汉语中通顺。
theological_decisions:
- issue: 智慧文学语境中תּוֹרָה的范围
  choice: 正文译作“律法”，同时以脚注说明也可译作“训诲”或“教导”
  alternative: 正文译作“训诲”或“教导”
  rationale: “律法”体现其权威性及圣约背景，但不应把原词限缩为法律条文；脚注保留其较宽泛的神圣教导之义。
- issue: “可憎”所隐含的关系对象
  choice: 不补出“在上帝眼中”或“为上帝所憎恶”
  alternative: 明确补译为“在上帝眼中也是可憎的”
  rationale: 原文只用名词תּוֹעֵבָה作表语，并未明说行为主体；不补出对象可保留箴言简练的措辞和原文含蓄之处。
translation_notes:
  register: 采用简洁、对称的箴言体。“谁……，连……也……”符合现代标准汉语，又保留原文的概括性和强调语气；用“转耳”保存鲜明意象，用“可憎”维持原文的强烈程度。
