  text: נָגִ֗יד חֲסַ֣ר תְּ֭בוּנוֹת וְ/רַ֥ב מַעֲשַׁקּ֑וֹת שנאי בֶ֝֗צַע יַאֲרִ֥יךְ יָמִֽים׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/016.yaml
  text: A ruler lacking understanding is great in acts of oppression[b][a], but one who hates unjust gain will prolong his days.
translation:
  language: zh_hans
  text: 缺乏明辨的统治者多行欺压[a]；恨恶不义之财[b]的，必延年益寿。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“多有压榨人的行为”。原文直译近于“在欺压之事上众多”。
    reason: lexical_alternative
  - marker: b
    text: “不义之财”也可译作“贪图的利益”或“非分之财”。
    reason: lexical_alternative
lexical_decisions:
- source_word: נָגִיד
  choice: 统治者
  rationale: 该词指掌权、治理的人；“统治者”既保留权柄含义，也不把所指限于君王或王子。
- source_word: חֲסַר תְּבוּנוֹת
  choice: 缺乏明辨
  rationale: תְּבוּנוֹת在智慧文学中侧重理解力、洞察力和正确判断；“明辨”比单纯“知识”更能表达这种实践性的判断能力。
- source_word: וְרַב מַעֲשַׁקּוֹת
  choice: 多行欺压
  rationale: 原文直译近于“在欺压之事上众多”；汉语以“多行欺压”自然表达反复或大量施行压迫、剥削的行为。
- source_word: שׂנֵא בֶצַע
  choice: 恨恶不义之财
  rationale: בֶצַע在此带有贪婪、不正当获利的道德色彩；“不义之财”自然传达由不正当手段所得的利益，同时保留其可能泛指贪利的空间。
- source_word: יַאֲרִיךְ יָמִים
  choice: 必延年益寿
  rationale: 这是表示寿命长久的希伯来语惯用语；“延年益寿”保留“延长日子”的意象，又符合庄重自然的现代汉语。
theological_decisions:
- issue: 两分句之间的逻辑关系
  choice: 以分号并列，不明加“但”或“却”
  alternative: “但恨恶不义之财的，必延年益寿”
  rationale: 原文第二分句前没有显式转折连词，反差由并置产生；分号既让对照清楚，也避免把隐含关系说得过满。
- issue: 长寿陈述的表达力度
  choice: 必延年益寿
  alternative: 会活得长久
  rationale: 未把箴言改写为无条件的个人应许，也未另加神学限定；按智慧文学的格言语气保留明确断言。
translation_notes:
  register: 采用简洁、对称的箴言体。用“统治者”保持普遍适用性；“缺乏明辨”“多行欺压”“恨恶不义之财”均为现代读者易懂而仍庄重的表达。
