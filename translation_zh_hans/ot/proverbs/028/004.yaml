  text: עֹזְבֵ֣י ת֭וֹרָה יְהַֽלְל֣וּ רָשָׁ֑ע וְ/שֹׁמְרֵ֥י ת֝וֹרָ֗ה יִתְגָּ֥רוּ בָֽ/ם׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/004.yaml
  text: Those who forsake the law praise the wicked[b][a], but those who keep the law contend with them.
translation:
  language: zh_hans
  text: 离弃教导[a]的，称赞恶人；遵守教导的，却与他们抗争[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “教导”也可译作“律法”或“训诲”。在智慧文学中，原词可泛指具有权威的教训，也可能带有上帝律法的背景。
    reason: lexical_alternative
  - marker: b
    text: “与他们抗争”也可译作“反对他们”或“同他们争竞”。原文动词含有奋起与人争斗、抗衡的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹזְבֵי
  choice: 离弃……的
  rationale: 该词为复数主动分词，描写一类以离弃为特征的人。“离弃”比“离开”更能保留其道德分量，也符合庄重的箴言语体。
- source_word: תּוֹרָה
  choice: 教导
  rationale: תורה 在智慧文学中常指具有权威的训诲或教导，未必仅限于成文律法；“教导”在本节语境中自然，也保留其较宽的意义。
- source_word: יְהַלְלוּ
  choice: 称赞
  rationale: 该 Piel 动词在此表示赞扬、推许；“称赞”直接呈现离弃教导者竟认可恶人的反讽。
- source_word: רָשָׁע
  choice: 恶人
  rationale: 原文虽为单数，但可作代表性、类别性的实体形容词；现代汉语“恶人”同样可泛指这一类人，无须增添量词。
- source_word: שֹׁמְרֵי
  choice: 遵守……的
  rationale: 该复数主动分词有守护、持守、遵行之意；与“教导”搭配时，“遵守”自然地表达认真听从并实行。
- source_word: יִתְגָּרוּ
  choice: 抗争
  rationale: 该 Hitpael 动词表示激起自己与人争斗、同人争竞或反抗。“抗争”保留明确的对立性，又不将其过度解释为肢体暴力。
- source_word: בָם
  choice: 与他们
  rationale: 介词 בּ 与此动词连用，可表示争斗所针对的对象；“与他们抗争”在汉语中自然，同时保留“同……争斗”和“反对……”之间的语义张力。
theological_decisions:
- issue: 后半句“他们”的所指
  choice: 保留复数代词“他们”，不明确限定其仅指哪一组人。
  alternative: 明确译作“与恶人抗争”或“反对那些离弃教导的人”。
  rationale: 原文先用单数“恶人”作代表性称呼，后接复数代词；其所指可能是恶人这一类，也可能更广地包括前半句所描写的离弃教导者。直译为“他们”可保存原文紧凑而略有弹性的指涉。
translation_notes:
  register: 采用现代、简洁而庄重的箴言语体，以“离弃／遵守”和“称赞／抗争”形成鲜明对照。分号保留希伯来诗句两行之间的反义平行；“却”使转折在现代汉语中清晰，但不增加新的神学限定。
