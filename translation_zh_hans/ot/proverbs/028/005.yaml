  text: אַנְשֵׁי רָ֭ע לֹא יָבִ֣ינוּ מִשְׁפָּ֑ט וּ/מְבַקְשֵׁ֥י יְ֝הוָ֗ה יָבִ֥ינוּ כֹֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/005.yaml
  text: Evil men do not understand justice[a], but those who seek Yahweh understand all things.
translation:
  language: zh_hans
  text: 恶人不明白公正；寻求雅威的人却明白万事[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “万事”也可译作“一切”。按上下文，这主要指广泛的道德辨别力，尤其是明辨公正，并非无限地知晓一切。
    reason: 说明 כֹל 的译法及其在箴言语境中的范围，既保留原文的概括性，也避免误读为人的全知。
lexical_decisions:
- source_word: אַנְשֵׁי רָע
  choice: 恶人
  rationale: 该结构直译为“邪恶之人”。“恶人”简洁自然，也符合汉语智慧文学的庄重表达；在复数语境中泛指邪恶的人。
- source_word: יָבִינוּ
  choice: 明白
  rationale: בין 表示理解、辨明或领悟。两小句均用“明白”，保留原文的词语重复和鲜明对照。
- source_word: מִשְׁפָּט
  choice: 公正
  rationale: 此词在智慧文学中可指审判、正当秩序或公正原则。这里与“恶人”形成伦理对照，“公正”最能自然表达其含义，同时不把范围限于法庭判决。
- source_word: מְבַקְשֵׁי יְהוָה
  choice: 寻求雅威的人
  rationale: 分词结构描述以持续寻求雅威为特征的一类人；“寻求……的人”在现代汉语中自然，并保留其持续性和群体性。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译保留上帝在原文中的专名，而不以“主”这一称号替代。
- source_word: כֹל
  choice: 万事
  rationale: 绝对用法的 כֹל 意为“一切、万事”。“明白万事”保留箴言的概括力度；脚注说明其语境范围，避免把原文静默改写成较窄的释义。
theological_decisions:
- issue: “明白万事”的范围
  choice: 保留“万事”这一概括性说法，并以脚注说明其在上下文中的智慧文学含义。
  alternative: 直接译为“明白一切正道”或“凡事都能明辨”。
  rationale: 原文只说 כֹל（“一切”），没有明说“正道”或其他限定。正文保留其力度和一定的开放性；上下文则表明重点是广泛的道德辨别力，尤其是对公正的辨明，而不是宣称人具有无限的全知。
translation_notes:
  register: 采用简洁、对称的箴言体。“恶人……；寻求雅威的人却……”清楚呈现两组人的对照；“明白”在两小句中重复，以对应希伯来原文。用“公正”而非较法律化的“判决”，使普通现代读者易懂，同时保持庄重。
