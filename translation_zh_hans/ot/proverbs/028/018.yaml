  yaml_path: translation/ot/proverbs/028/018.yaml
  text: Whoever walks in integrity will be delivered[b][a], but one crooked in his ways will fall at once.
translation:
  language: zh_hans
  text: 为人纯全的人，必蒙解救[a]；行事乖僻的人，必立刻跌倒[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“必得保全”或“必得救”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译：“在一（件／条）中”。通常理解为“突然”或“一下子”；也可能与前面的“道路”相连，意为“在其中一条路上”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹלֵךְ תָּמִים
  choice: 行为纯全的人
  rationale: הֹלֵךְ在智慧文学中常以“行走”比喻生活行事；תָּמִים表示完整、无可指摘或正直。“行为纯全”保留道德完整之意，又不暗示绝对无罪。
- source_word: יִוָּשֵׁעַ
  choice: 必蒙解救
  rationale: ישׁע的尼法勒式表示被救出、获保全。“蒙解救”保留被动含义，并避免把智慧箴言中的现实性保全限定为特定的教义性救恩。
- source_word: נֶעְקַשׁ דְּרָכַיִם
  choice: 道路弯曲的人
  rationale: עקשׁ表示扭曲、乖僻；דְּרָכַיִם以道路意象指人的行径。“道路弯曲”在现代汉语中自然，并保留原文的形象。
- source_word: יִפּוֹל
  choice: 必……跌倒
  rationale: נפל的基本义是跌倒，在箴言中也可暗示败落。直译“跌倒”保留具象性，不把结果过度解释为毁灭。
- source_word: בְּאֶחָת
  choice: 立刻
  rationale: 该短语字面为“在一个／一件／一条中”，此处通常理解为突然、一下子。正文采用自然的副词“立刻”，并以脚注保留原文字面及另一种可能关联。
theological_decisions:
- issue: יִוָּשֵׁעַ在智慧箴言中的范围
  choice: 译作“蒙解救”，表达一般性的脱险或保全
  alternative: “得救”或“得保全”
  rationale: 上下文首先陈述人生智慧中的保护与败落，并未要求将该词专门解释为终末或教义意义上的救恩；“蒙解救”仍保留更广泛的神学回响。
- issue: תָּמִים所表达的道德状态
  choice: 译作“纯全”
  alternative: “正直”或“无可指摘”
  rationale: “纯全”强调人格与行为的完整，不等同于绝对无罪，也保留原词“完整、健全”的语义张力。
- issue: בְּאֶחָת与复数／双数דְּרָכַיִם的关系
  choice: 正文按副词义译作“立刻”
  alternative: 按字面译作“在其中一条路上跌倒”
  rationale: 多数语境理解支持“突然、一下子”，但希伯来文也可能与前面的“道路”形成关联，因此在脚注中保留这一歧义。
translation_notes:
  register: 采用庄重而通俗的现代标准汉语。两分句结构简洁对称；“行为纯全／道路弯曲”和“蒙解救／跌倒”分别呈现原文的道德与道路意象。脚注标记均置于所解释的词语之后。
