  text: אָ֭דָם עָשֻׁ֣ק בְּ/דַם נָפֶשׁ עַד בּ֥וֹר יָ֝נ֗וּס אַל יִתְמְכוּ בֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/017.yaml
  text: A man burdened with the blood of a life will flee as far as the pit[b][a]; let no one support him.
translation:
  language: zh_hans
  text: 背负人命血债的人[a]，必逃奔到坑中[b]；谁也不要扶助他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“被一条生命的血压住的人”，指因夺取生命而负有血债的人。
    reason: lexical_alternative
  - marker: b
    text: “坑”也可理解为“坟墓”；这个词在此可能暗示死亡的结局。
    reason: lexical_alternative
lexical_decisions:
- source_word: אָדָם
  choice: 人
  rationale: 这里是泛指一个具体的人；现代汉语用“人”自然、准确，无须额外标明性别。
- source_word: עָשֻׁק בְּדַם נָפֶשׁ
  choice: 背负人命血债
  rationale: עָשֻׁק 有受压、被重担压住之意；与“生命之血”连用时指因夺取生命而承担的血债。“背负”保留沉重压迫感，“人命血债”则以自然汉语传达原文具体的血与生命意象。
- source_word: עַד בּוֹר
  choice: 到坑中
  rationale: בּוֹר 可指坑、井、牢坑，也可暗示坟墓或死亡。“坑”保留原文意象，不把所指限定为坟墓；“到”表达 עַד 的终点含义。
- source_word: יָנוּס
  choice: 必逃奔
  rationale: 该动词表示逃跑；“逃奔”兼具逃亡和朝某终点奔去的动态，“必”在箴言式陈述中自然表达未完成式的确定后果。
- source_word: אַל יִתְמְכוּ בוֹ
  choice: 谁也不要扶助他
  rationale: 复数祈使否定的对象未明确，汉语以“谁也不要”自然表达对任何人的禁止；“扶助”保留 תמך 所含扶持、支撑和援助之意。
theological_decisions:
- issue: 血债者逃向坑的含义
  choice: 保留为“逃奔到坑中”，不明确说明这是司法惩罚、神的审判、自我毁灭或死亡
  alternative: 译作“逃向坟墓”或“逃到灭亡之地”
  rationale: 原文的 בּוֹר 可以暗示死亡，却没有明确解释因果机制；保留意象可避免替文本消解其神学与诗性张力。
- issue: 禁止扶助的范围
  choice: 直译为“谁也不要扶助他”
  alternative: 解释为“不要帮助他逃避惩罚”
  rationale: 经文没有明说所禁止的是窝藏、救援还是其他形式的支持，因此不在正文中加以限定。
translation_notes:
  register: 采用凝练、庄重而易懂的现代标准汉语，保持箴言的警策语气。正文用“人命血债”使希伯来习语在汉语中清楚可解，同时以脚注交代较直译的表达；“坑”则保留原文多义性。
