  text: אִ֣ישׁ אֱ֭מוּנוֹת רַב בְּרָכ֑וֹת וְ/אָ֥ץ לְ֝/הַעֲשִׁ֗יר לֹ֣א יִנָּקֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/020.yaml
  text: A faithful man will abound with blessings[a], but one who hastens to become rich will not go unpunished.
translation:
  language: zh_hans
  text: 忠信的人必多得福分；急于发财的人必不免受惩罚[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“必不被判为无罪”或“必不得开释”。
    reason: לֹא יִנָּקֶה也可表达不被判为无罪或不得开释；脚注保留其司法色彩。
lexical_decisions:
- source_word: אִישׁ אֱמוּנוֹת
  choice: 忠信的人
  rationale: 希伯来语直译近似“有诸般忠信的人”；复数抽象名词在此表达品格特征。“忠信”兼顾可靠、诚实和持守信用之意，且“人”自然保留箴言中代表性个体的表达。
- source_word: רַב בְּרָכוֹת
  choice: 必多得福分
  rationale: 无动词分句以“多”述说“福分”的丰盛；“必多得”用现代汉语自然表达箴言的一般规律，同时保留复数所强调的丰盛。
- source_word: וְאָץ
  choice: 急于
  rationale: אָץ表示急切、仓促；结合下文，译为“急于”准确传达不耐烦地追逐财富的意味。
- source_word: לְהַעֲשִׁיר
  choice: 发财
  rationale: 使役词形在此可指变得富有或取得财富；“发财”是现代汉语中自然简洁的对应表达，并与“急于”搭配顺畅。
- source_word: לֹא יִנָּקֶה
  choice: 必不能免受惩罚
  rationale: נקה的被动词形可表示被算为无罪、获释或免受惩罚；正文采用符合智慧文学警告语境的结果性表达，并在脚注保留司法意义的其他译法。
theological_decisions:
- issue: “福分”的来源是否明说为上帝直接赐予
  choice: 不在正文增添明确施事者，只译作“多得福分”
  alternative: “必蒙上帝多多赐福”
  rationale: 原文只说福分丰盛，并未明说施事者；避免把隐含的神学理解扩写成原文未明言的内容。
- issue: 急于致富者所面对的后果
  choice: 译作“不能免受惩罚”，同时以脚注保留“不能算为无罪／不能脱罪”
  alternative: 只译作“必被定罪”
  rationale: 原词兼有司法上的无罪与后果上的免罚含义；正文传达箴言中的实际警告，但不把含义收窄为某种特定审判程序。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语；以分号呈现两句对照。“忠信”比单纯“诚实”涵盖更广的可靠与守信含义；“急于发财”简洁自然，不把经文误解为一概谴责富足本身。
