  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: עֹבֵ֣ד אַ֭דְמָת/וֹ יִֽשְׂבַּֽע לָ֑חֶם וּ/מְרַדֵּ֥ף רֵ֝קִ֗ים יִֽשְׂבַּֽע רִֽישׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/019.yaml
  text: Whoever works his land will have plenty of bread[a], but he who pursues worthless things will have his fill of poverty.
translation:
  language: zh_hans
  text: 耕种自己土地的，必有充足的粮食；追逐虚空之事的，必饱受贫穷。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “虚空之事”或译“空虚无益的事”；原文也可能指空虚无用的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹבֵד
  choice: 耕种
  rationale: 此处 עבד 指在土地上劳作；“耕种”自然地表达农业语境，又不局限于某一道具体耕作工序。
- source_word: אַדְמָתוֹ
  choice: 自己的土地
  rationale: אַדָמָה 可指土地、地面或土壤；在农业勤劳的语境中，“自己的土地”最自然，并保留所属关系。
- source_word: יִשְׂבַּע לָחֶם
  choice: 必有充足的粮食
  rationale: שׂבע 表示饱足，לֶחֶם 可指饼、食物或粮食。“有充足的粮食”以现代汉语表达供应充裕，并保留具体的食粮意象。
- source_word: וּמְרַדֵּף
  choice: 追逐……的
  rationale: 分词表达持续或惯常的追求；并列结构在语义上与前句构成鲜明对照，汉语用分号即可自然呈现，无须另加“但”。
- source_word: רֵקִים
  choice: 虚空之事
  rationale: רֵקִים 字面为“空的”，形式上可能指空虚、无益的事，也可能指空虚无用的人。“虚空之事”适合与生产性劳动形成对照，同时以脚注保留指人的可能。
- source_word: יִשְׂבַּע רִישׁ
  choice: 必饱受贫穷
  rationale: “饱受”既重现 שׂבע 与前半句“充足”的反讽呼应，也以自然汉语表达贫穷充斥其生活的结果。
theological_decisions: []
translation_notes:
  register: 采用简洁、对称的箴言体。前后两句以“……的，必……”形成平行结构；措辞现代而庄重。“粮食”较“饼”更符合普通现代汉语，又保留农业收成与食物供应的具体意象。
