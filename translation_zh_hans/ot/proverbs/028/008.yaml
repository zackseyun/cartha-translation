base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/008.yaml
  text: Whoever increases his wealth by interest and profit gathers it for one who is gracious to the poor[a][b].
translation:
  language: zh_hans
  text: 靠利息和额外收益[a]增加财富的人，是为恩待穷人的人[b]积蓄的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “利息和额外收益”也可译为“高利和增益”。这两个希伯来词都可指借贷所收的额外款项，常带盘剥意味。
    reason: lexical_alternative
  - marker: b
    text: “恩待穷人的人”也可译为“慷慨帮助穷人的人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מַרְבֶּה הוֹנוֹ
  choice: 敛财
  rationale: 该短语直指使自己的财富增多；“敛财”在现代汉语中简洁自然，并切合本句对借贷获利方式的负面语境。
- source_word: בְּנֶשֶׁךְ
  choice: 靠利息
  rationale: נֶשֶׁךְ指贷款所收的利息，常含盘剥意味；正文用现代通行的“利息”，脚注说明其可能具有高利盘剥色彩。
- source_word: וּבְתַרְבִּית
  choice: 和加利
  rationale: תַּרְבִּית指借贷时额外收取的增益或加价；“加利”既与“利息”形成相关而不完全重复的表达，也保留借贷获利的语境。
- source_word: לְחוֹנֵן
  choice: 为怜悯……的人
  rationale: חנן表示施恩、恩待或怜恤；“怜悯”自然地表达向贫穷者施恩的行动，同时脚注保留“恩待”的译法。
- source_word: דַּלִּים
  choice: 穷人
  rationale: דלים可指贫穷、卑微或弱势的人；在借贷与财富的经济语境中，“穷人”最直接。
- source_word: יִקְבְּצֶנּוּ
  choice: 积攒
  rationale: קבץ意为聚集、收集，宾语后缀回指财富；汉语无需重复宾语，“积攒”保留了讽刺意味：敛财者实际是在替另一人聚财。
theological_decisions:
- issue: 财富最终归谁使用
  choice: 保留“为……的人积攒”的目的或受益关系
  alternative: 明确译成“最终必归给怜悯穷人的人”
  rationale: 介词לְ可表达为了或归于某人，但经文本身未明说转移财富的具体机制，因此不把它扩展成明确的神圣报应过程。
translation_notes:
  register: 采用简洁、警策的箴言体。“靠……敛财”符合现代普通话表达；“加利”略具书面色彩，借此保留两个希伯来借贷术语之间的区别。所有脚注标记均已置于正文。
