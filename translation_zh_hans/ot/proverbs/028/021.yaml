  text: הַֽכֵּר פָּנִ֥ים לֹא ט֑וֹב וְ/עַל פַּת לֶ֝֗חֶם יִפְשַׁע גָּֽבֶר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/021.yaml
  text: To show partiality is not good[c][b][a], yet for a piece of bread a man will transgress.
translation:
  language: zh_hans
  text: 偏袒人并不好[a]；人却会为一小块饼而犯罪[b][c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“认面孔”，是指按人的身份、情面而偏袒。
    reason: lexical_alternative
  - marker: b
    text: “一小块饼”也可译作“一口饼”或“一点饼”；重点是人可能为极小的利益而犯罪。
    reason: lexical_alternative
  - marker: c
    text: “人”原文使用阳性单数称谓，在这里具有箴言式的代表性。
    reason: cultural_note
lexical_decisions:
- source_word: הַכֵּר פָּנִים
  choice: 偏袒人
  rationale: 该短语直译为“认脸”，是按人的身份或情面区别对待、徇私偏袒的习语。“偏袒人”以自然现代汉语表达其伦理含义。
- source_word: לֹא טוֹב
  choice: 并不好
  rationale: 保留原文宽泛而直接的道德评价；“并”使汉语语气自然，但不把含义收窄为司法上的“不合法”。
- source_word: וְעַל
  choice: 但……为
  rationale: וְ可作普通连接，也可在此体现上下句之间的反差。“但”传达这种箴言式转折；“为”表达行为的诱因。
- source_word: פַּת לֶחֶם
  choice: 一块饼
  rationale: פַּת指一小块食物，לֶחֶם指饼或食物；“一块饼”自然简洁，并保留所得微薄却足以诱人犯错的意象。
- source_word: יִפְשַׁע
  choice: 违犯正道
  rationale: פשע含违犯、悖逆或犯罪之意。“违犯正道”保留其较强的道德分量，同时避免现代汉语“犯罪”可能造成的纯法律化理解。
- source_word: גָּבֶר
  choice: 一个人
  rationale: 该词为阳性单数，通常指男子，但在这条箴言中作为代表性个体使用。正文译作自然的泛指“一个人”，并以脚注说明原文形式。
theological_decisions:
- issue: 箴言中阳性单数 גָּבֶר 的指称范围
  choice: 正文译为“一个人”，脚注说明原文为阳性称谓
  alternative: 译为“一个男子”
  rationale: 原文采用阳性单数，但箴言所陈述的是普遍的人性倾向。译作“一个人”可自然传达泛指功能；脚注则保留原文的性别形式，避免掩盖文本细节。
- issue: יִפְשַׁע 的道德与法律色彩
  choice: 违犯正道
  alternative: 犯罪；作恶；犯过
  rationale: 该动词可带有违犯或悖逆的较强意味，但本节没有明说所违犯的是哪一条法律。“违犯正道”保留道德张力而不把含义限定为现代刑法意义。
translation_notes:
  register: 采用现代、清楚而庄重的普通话。“偏袒人”直接表达习语含义；“一块饼”保留具体而微小的利益意象；句式简洁，符合希伯来箴言两分句的节奏。
