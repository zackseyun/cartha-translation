  naturalness: 原句“急于追求财富的，是个……”带有不必要的倒装，且“眼光恶毒”不自然也易误解。调整为主谓顺序后更符合现代汉语，同时保持箴言体的凝练庄重。
  terminology: “急于求财”对应 נבהל להון，简洁自然；“眼目邪恶”保留 רַע עָיִן 的字面习语，不预先限定为“吝啬”或“贪婪”。“贫乏将临到他”可对应 חֶסֶר יבואנו，保留“缺乏／贫困”的范围。
