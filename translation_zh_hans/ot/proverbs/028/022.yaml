  text: A man with an evil eye hastens after wealth[a], and does not know that poverty will come upon him.
translation:
  language: zh_hans
  text: 眼目邪恶的人急于求财；他却不知道贫乏将临到他。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “眼目邪恶”直译为“有恶眼”；这是希伯来习语，可指自私、吝啬、嫉妒或贪婪的态度。
    reason: lexical_alternative
lexical_decisions:
- source_word: נִבֳהָל לַהוֹן
  choice: 急于追求财富
  rationale: נִבֳהָל 表示处于匆忙、急切的状态，לַהוֹן 指以财富为目标；译文自然表达鲁莽逐利的意味。
- source_word: אִישׁ רַע עָיִן
  choice: 是个眼光恶毒的人
  rationale: 原文直译为“眼目邪恶的人”。主文保留“眼光恶毒”这一具象表达，以免将其丰富含义限缩为单一的“吝啬”或“贪婪”，并用脚注说明希伯来习语。
- source_word: וְלֹא יֵדַע
  choice: 他不知道
  rationale: 直接保留原文的并列陈述及未察觉后果的意味。
- source_word: חֶסֶר
  choice: 贫乏
  rationale: חֶסֶר 的基本意义是缺乏、不足；“贫乏”既适合逐利语境，也比“贫穷”更能保留词义范围。
- source_word: יְבֹאֶנּוּ
  choice: 必临到他
  rationale: 表达“来到他那里、临到他”的意思；“必”体现箴言警告中未完成式所指向的确定后果。
