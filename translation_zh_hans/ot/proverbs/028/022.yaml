- from: 急于追求财富的，是个眼光恶毒的人[a]；他不知道贫乏必临到他。
  to: 眼目邪恶的人急于求财；他却不知道贫乏将临到他。[a]
  rationale: 修订以“眼目邪恶”替换“眼光恶毒”，保留原文“恶眼”习语的形象和未限定的语义范围，避免将其误译为凶恶的目光。重组语序为自然的现代汉语，并以脚注说明习语可涵盖的含义；“急于求财”“贫乏将临到他”则保留原文的急切逐利与未察觉后果。
