base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/010.yaml
  text: Whoever leads the upright astray in an evil way will himself fall into his own pit[a], but the blameless will inherit good.
translation:
  language: zh_hans
  text: 使正直人走上恶道的，自己必掉进自己的坑里[a]；纯全人却必承受美好之物。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“必陷入自己的毁灭”，或“必自取败亡”。希伯来语这个词既可指“坑”，也可指毁灭、败亡；正文保留陷阱的意象。
    reason: lexical_alternative
lexical_decisions:
- source_word: מַשְׁגֶּה
  choice: 使……迷失
  rationale: 这是动词 שׁגה 的使役分词，表示使人偏离正道。“使……迷失”保留使役含义，并以泛指结构表达箴言的一般性。
- source_word: יְשָׁרִים
  choice: 正直人
  rationale: 该词指品行正直、在道德上端正的人；“正直人”自然且符合智慧文学语境。
- source_word: בְּדֶרֶךְ רָע
  choice: 在恶道上
  rationale: דֶּרֶךְ 既可指道路，也常比喻人的行为方式；“恶道”保留道路意象及伦理含义，而介词“在”对应 בְּ 的基本关系。
- source_word: בִּשְׁחוּתוֹ
  choice: 进自己的坑里
  rationale: שְׁחוּת 可指坑，也可表示毁灭或败亡。正文采用具体的“坑”，保留恶人反落入自己陷阱的鲜明意象；所属后缀由“自己的”体现。
- source_word: הוּא יִפּוֹל
  choice: 自己必掉进
  rationale: 原文显式使用代词 הוּא，带有强调和对比意味；汉语用“自己”自然地传达害人者反受其害。
- source_word: וּתְמִימִים
  choice: 纯全人却
  rationale: תָּמִים 在智慧文学中指品格完整、无可指摘的人。“纯全人”兼顾完整与正直的伦理意味；“却”呈现两分句之间的鲜明反差。
- source_word: יִנְחֲלוּ
  choice: 必承受
  rationale: נחל 表示继承或作为产业而得着。“承受”保留继承所得的意味，也符合庄重而自然的现代汉语表达。
- source_word: טוֹב
  choice: 美福
  rationale: 原文只说广义的“好处、美好之物”，没有限定为物质兴盛。“美福”使“承受”在汉语中搭配自然，同时保持所指的宽泛性。
theological_decisions:
- issue: בִּשְׁחוּתוֹ 所表达的道德报应意象
  choice: 正文保留“自己的坑”这一具体意象
  alternative: 自己的毁灭；自己的败亡
  rationale: 经文表达害人者反受其害的诗性公义，却没有具体界定审判发生的方式。保留“坑”的意象可避免把智慧文学的比喻压平为单一的抽象教义陈述。
translation_notes:
  register: 采用现代、庄重而易懂的箴言体。前半句用“使……的”构成泛指主语，以表达希伯来语分词的一般性；“自己……自己的”有意保留原文的强调和自食其果的修辞效果。
