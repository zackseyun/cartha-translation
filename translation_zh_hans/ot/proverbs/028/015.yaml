  text: Like a roaring lion and a charging bear is a wicked ruler over a poor people[a].
translation:
  language: zh_hans
  text: '邪恶的统治者辖制贫弱的百姓，

    如同咆哮的狮子和猛扑的熊。[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “猛扑的熊”或译“急冲而来的熊”或“饥饿觅食的熊”；这里形容熊的希伯来语分词表达强烈的攻击性威胁，可能侧重其凶猛的冲势，也可能侧重其捕食时的饥饿。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲרִי נֹהֵם
  choice: 咆哮的狮子
  rationale: 保留希伯来文的动物意象和分词所描写的吼声；“咆哮的狮子”自然、鲜明。
- source_word: דֹב שׁוֹקֵק
  choice: 猛扑的熊
  rationale: שׁוֹקֵק 在此传达具有攻击性的迅猛动作；“猛扑”既体现动态威胁，也与“咆哮”形成有力的平行。其确切侧重仍有词义上的不确定性，故加脚注说明。
- source_word: מֹשֵׁל רָשָׁע
  choice: 恶人统治
  rationale: מֹשֵׁל 是实词化分词，可指统治者，也可保留“统治”这一动作。译作“恶人统治”使中文比喻句自然，并准确表达邪恶之人掌权的情形。
- source_word: עַל עַם דָּל
  choice: 贫弱的百姓
  rationale: עַל 在统治语境中表示对百姓行使权力；דָּל 可指贫穷，也可指弱小、卑微。“贫弱”保留其经济与社会脆弱性的语义幅度。
