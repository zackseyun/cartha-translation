  text: טֽוֹב רָ֭שׁ הוֹלֵ֣ךְ בְּ/תֻמּ֑/וֹ מֵ/עִקֵּ֥שׁ דְּ֝רָכַ֗יִם וְ/ה֣וּא עָשִֽׁיר־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/006.yaml
  text: Better is a poor man who walks in his integrity than one who is crooked in his ways[a], though he is rich.
translation:
  language: zh_hans
  text: 行为正直的穷人，胜过道路弯曲的富人。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文更直译为：“行为正直的穷人，胜过道路弯曲的人，而他是富有的。”末句“而他是富有的”指道路弯曲的人。
    reason: 保留希伯来文末句的字面形式，并说明代词所指。
lexical_decisions:
- source_word: טוֹב
  choice: 胜过
  rationale: 句首的טוֹב与比较介词מִן构成箴言常见的“甲胜过乙”结构；汉语用“胜过”简洁自然。
- source_word: רָשׁ
  choice: 穷人
  rationale: 指贫穷、困乏的人；单数阳性在此代表一类人，现代汉语以“穷人”表达即可。
- source_word: הוֹלֵךְ בְּתֻמּוֹ
  choice: 行为正直的
  rationale: הוֹלֵךְ保留“行走”的生活行为含义，בְּתֻמּוֹ指完整、纯正、无可指摘的品格；合译为“行为正直”自然且不暗示绝对无罪。
- source_word: מֵעִקֵּשׁ דְּרָכַיִם
  choice: 道路弯曲的
  rationale: עִקֵּשׁ表示扭曲、不正；דְּרָכַיִם字面为“道路”，在智慧文学中喻指行事为人。保留“道路弯曲”的意象，与前半句的行为形成对照。
- source_word: וְהוּא עָשִׁיר
  choice: 富人
  rationale: 字面为“而他富有”，所指最自然地是道路弯曲者。正文将其整合为“富人”，清楚呈现比较双方；脚注保留原文较生硬而可能具有强调作用的句法。
theological_decisions:
- issue: 财富与正直的价值次序
  choice: 译文表达正直的贫穷胜过邪曲的富有
  alternative: 把经文理解为对财富本身的否定
  rationale: 原文谴责的是富人的道路弯曲，并非财富本身；比较的核心是品格高于经济地位。
translation_notes:
  register: 采用简洁、对称的现代箴言体。“行为正直”通俗庄重；“道路弯曲”保留希伯来智慧文学的道路隐喻。
