base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/023.yaml
  text: Whoever rebukes a man will afterward find favor[a], more than one who flatters with the tongue.
translation:
  language: zh_hans
  text: 责备人的，后来必比用花言巧语谄媚的人更蒙喜爱。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“责备人的，后来所得的好感，多过用花言巧语谄媚的人所得的。”
    reason: 原文的比较结构表示责备者后来所得的好感，多于以奉承言语待人的人所得的好感。
lexical_decisions:
- source_word: מוֹכִיחַ
  choice: 责备
  rationale: 该词是יכח的使役分词，在此表示指出过错、加以劝诫；“责备”既保留与谄媚相对的直率力度，也符合箴言语体。
- source_word: אָדָם
  choice: 人
  rationale: 此处指受到责备的个体，现代汉语用“人”即可自然表达单数泛指，无须添加性别。
- source_word: אַחֲרַי
  choice: 后来
  rationale: 按上下文取时间副词义，说明责备者所得的好感往往在事后才显明；这比直译为“在我之后”更符合本句语境。
- source_word: חֵן
  choice: 喜爱
  rationale: חֵן可指好感、恩宠或悦纳；此处谈人与人之间对责备者和谄媚者的态度，“蒙喜爱”自然表达赢得好感，同时避免引入不必要的神学含义。
- source_word: יִמְצָא
  choice: 必蒙
  rationale: 未完成式在箴言中表达通常可预期的结果；汉语“必蒙”简洁呈现这种结果，并与“喜爱”自然搭配。
- source_word: מִמַּחֲלִיק לָשׁוֹן
  choice: 胜过用舌头谄媚人的
  rationale: 比较介词מִן表达“胜过”；מַחֲלִיק字面有“使光滑”之意，在此指说讨好话、谄媚。保留“舌头”的希伯来意象，同时采用自然汉语句式。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的箴言体。上下两行保留原文的行为与结果、责备与谄媚之间的鲜明对照；“后来”突出好感并非必然即时出现。
