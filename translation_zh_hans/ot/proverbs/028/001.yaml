base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/001.yaml
  text: The wicked flee when no one is pursuing[a], but the righteous are confident like a young lion.
translation:
  language: zh_hans
  text: '恶人无人追赶也逃跑；

    义人却像少壮的狮子一样坦然无惧。[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“恶人无人追赶也逃跑；义人却像少壮的狮子一样勇敢。”希伯来文两句都容许略有不同的语气；“少壮的狮子”反映כְּפִיר比一般“狮子”更具体的含义。
    reason: 词义与语气的可选译法
lexical_decisions:
- source_word: נָסוּ
  choice: 逃跑
  rationale: 该词表示逃离、逃跑；这里是箴言所陈述的一般事实，汉语用无时态标记的“逃跑”自然贴切。
- source_word: וְאֵין רֹדֵף
  choice: 虽无人追赶
  rationale: אֵין加分词表示追赶者不存在；“虽”自然呈现无人追赶却仍逃跑的反常对照，同时保留其伴随情境。
- source_word: רָשָׁע
  choice: 恶人
  rationale: 希伯来文虽为单数，却在箴言中泛指一类人；“恶人”在现代汉语中可作泛称，也与下句复数的“义人”形成清楚对比。
- source_word: וְצַדִּיקִים
  choice: 义人
  rationale: 复数形容词名词化，指行为正直的一类人；“义人”是简洁、庄重且自然的汉语表达。
- source_word: כִּכְפִיר
  choice: 像少壮狮子一样
  rationale: כְּפִיר较一般的“狮子”更具体，通常指年轻而强健的狮子；“少壮狮子”兼顾其年龄与力量意象，又避免“幼狮”可能带来的弱小联想。
- source_word: יִבְטָח
  choice: 坦然无惧
  rationale: בטח可表示信靠、安稳或有把握；在与狮子的比喻及上句惊逃的对照中，重点是安然自信、毫不畏惧。“坦然无惧”保留这种语境含义，而不限定其信靠对象。
theological_decisions:
- issue: 箴言中单数与复数所代表的道德类型
  choice: 将רָשָׁע和צַדִּיקִים译为泛指类别的“恶人”与“义人”
  alternative: 译为个体化的“一个恶人……一些义人”或带性别色彩的表达
  rationale: 本节对比的是两类人的道德处境，并非特定个人，也不强调性别；汉语“恶人／义人”能自然保留这种代表性。
- issue: יִבְטָח在本节中的含义
  choice: 译为“坦然无惧”
  alternative: 译为“信靠”“安稳”或“勇敢”
  rationale: 原词兼有信靠、安稳和有把握的语义空间。狮子比喻与恶人逃跑的对照使无惧、自信的意味突出；译文不补出未明说的信靠对象，也不把含义缩减为单纯勇敢。
translation_notes:
  register: 采用现代、庄重而易懂的箴言体。两句结构紧凑，对比鲜明；“虽……却……”明示原文语境中的反差。“坦然无惧”传达בטח在此处的安稳自信，同时避免引入原文未明确说明的神学对象。
