  text: מְכַסֶּ֣ה פְ֭שָׁעָי/ו לֹ֣א יַצְלִ֑יחַ וּ/מוֹדֶ֖ה וְ/עֹזֵ֣ב יְרֻחָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/013.yaml
  text: Whoever covers his transgressions will not prosper[b][a], but he who confesses and forsakes them will be shown mercy.
translation:
  language: zh_hans
  text: 遮掩[a]自己过犯的，必不亨通；承认并离弃过犯的，必蒙怜悯[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“隐藏”。
    reason: lexical_alternative
  - marker: b
    text: 直译“必被怜悯”；原文没有明说施怜悯者。
    reason: lexical_alternative
lexical_decisions:
- source_word: מְכַסֶּה
  choice: 遮掩
  rationale: 保留“覆盖”所形成的具体意象，同时在现代汉语中自然表达隐瞒过犯、不肯公开承认的意思。
- source_word: פְשָׁעָיו
  choice: 自己的过犯
  rationale: “过犯”比泛指的“罪”更能体现פשע所含越界、悖逆的道德意味；“自己”对应第三人称单数所属关系，并使中文表意自然。
- source_word: לֹא יַצְלִיחַ
  choice: 必不亨通
  rationale: יַצְלִיחַ表示成功、顺遂或兴旺；“亨通”符合箴言的庄重文体，也保留其范围较广的含义，不局限于物质富足。
- source_word: וּמוֹדֶה
  choice: 承认
  rationale: 在过犯的语境中，该词表示承认或坦白；“承认”是现代汉语中清楚自然的表达，也避免把原文未明说的礼仪性认罪方式带入正文。
- source_word: וְעֹזֵב
  choice: 离弃
  rationale: 准确表达עֹזֵב的离开、弃绝之意，并清楚传达不只承认过犯，也停止并抛弃过犯。
- source_word: implicit object after וּמוֹדֶה וְעֹזֵב
  choice: 过犯
  rationale: 希伯来文承接上半句的“过犯”而省略宾语；中文补出“过犯”，可避免“承认并离弃的”所指含混。
- source_word: יְרֻחָם
  choice: 必蒙怜悯
  rationale: “蒙怜悯”保留希伯来文被动语态，不明说施怜悯者；“怜悯”也准确传达רחם的慈悲、怜恤含义。
- source_word: masculine singular participles/pronouns
  choice: ……的
  rationale: 希伯来文阳性单数在此具有泛指作用；汉语“……的”自然涵盖任何这样行事的人，无须额外引入性别或复数形式。
theological_decisions:
- issue: 怜悯的施行者在被动式中没有明说
  choice: 保留“必蒙怜悯”的被动表达，不在正文中补出上帝为主语
  alternative: 上帝必怜悯他；必得怜悯
  rationale: 语境可能暗示上帝施怜悯，但希伯来文没有明确说出施事者。保留被动式可维持原文的神学含蓄，不擅自消除这一张力。
translation_notes:
  register: 采用简洁、对称、庄重而易懂的现代标准汉语，保留箴言上下两句的鲜明对照。“亨通”“离弃”“蒙怜悯”略具经文语体色彩，但仍为普通读者易懂；正文不把隐含的施怜悯者明确化。
