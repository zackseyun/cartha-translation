base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/012.yaml
  text: When the righteous rejoice[a], there is great glory, but when the wicked rise, people hide themselves.
translation:
  language: zh_hans
  text: '义人欢欣时，大有荣耀；

    恶人兴起时，人便被藏匿起来。[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “人”是单数泛指，也可指“一般人”或“众人”。“被藏匿起来”对应原文的被动形式；该动词也有被理解为“被搜寻”的可能，但在这里通常按上下文理解为隐藏。
    reason: 说明 אָדָם 的单数泛指，保留 יְחֻפַּשׂ 的被动语态，并审慎标示其词义分析上的可能性。
lexical_decisions:
- source_word: בַּעֲלֹץ
  choice: 欢欣时
  rationale: 介词 בְּ 加不定词在这里表示时间；“欢欣”既保留 עלץ 的喜悦、雀跃意味，也符合箴言的庄重语体。
- source_word: צַדִּיקִים
  choice: 义人
  rationale: 这是形容词复数的名词化用法，指行事正直的人；“义人”是简明、自然的智慧文学用语。
- source_word: רַבָּה תִפְאָרֶת
  choice: 大有荣耀
  rationale: רַבָּה 表示众多、盛大，תִפְאָרֶת 可指荣耀、光彩或尊荣；“大有荣耀”保留其公共尊荣与兴盛的宽泛意味。
- source_word: וּבְקוּם
  choice: 恶人兴起时
  rationale: 介词加不定词表示时间，连接词在上下句之间形成对比；“兴起”保留 קום 的基本意象，也容纳掌权或势力上升的语境含义，而不将其明说。
- source_word: רְשָׁעִים
  choice: 恶人
  rationale: 指道德上邪恶的人；采用箴言中自然且传统的对应表达。
- source_word: יְחֻפַּשׂ
  choice: 隐匿不见
  rationale: 该 Pual 形式在本语境中可理解为“被隐藏、隐没”，汉语以“隐匿不见”自然表达人在恶人兴起时退出公众视野的结果；其也可能按另一语义理解为“被搜寻”，故以脚注保留。
- source_word: אָדָם
  choice: 人
  rationale: 单数名词在此作泛指，代表一般人；汉语“人”既保留单数形式，又自然传达普遍意义。
theological_decisions:
- issue: אָדָם 的单数泛指范围
  choice: 人
  alternative: 世人／众人
  rationale: 原文使用单数泛指，并未限定性别或某一群体；“人”不把它扩写成复数集体，也能自然涵盖一般人。
- issue: יְחֻפַּשׂ 的语义与语态
  choice: 人就隐匿不见
  alternative: 人就被搜寻／人被隐藏起来
  rationale: 上下文与箴言28:28的近似表达支持“隐匿”这一语境意义；但原形式为被动，并存在“被搜寻”的词义分析，因此不把另一读法静默排除，而在脚注说明。
translation_notes:
  register: 采用现代、凝练而庄重的箴言体。两行保持原文的平行与对比结构；“荣耀”和“兴起”避免过度解释为特定政治制度或神学结论。
