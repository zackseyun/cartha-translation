base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/024.yaml
  text: Whoever robs his father and his mother and says[a], “It is no transgression,” is a companion of a destructive man.
translation:
  language: zh_hans
  text: 抢夺父亲和母亲财物，又说“这不是过犯”的人，是毁灭者[a]的同伙。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “毁灭者”也可译作“造成毁灭的人”或“施行毁坏的人”。
    reason: 原文 מַשְׁחִית 是使役主动分词，可名词化译为“毁灭者”，也可展开译出其施事含义。
lexical_decisions:
- source_word: גּוֹזֵל
  choice: 抢夺
  rationale: 该词指以强力或不正当手段夺取；“抢夺”保留其严重性，比一般的“偷拿”更贴近原文。
- source_word: אָבִיו וְאִמּוֹ
  choice: 父亲和母亲
  rationale: 原文分别点明父亲与母亲，译文不概括为“父母”，以保留其表达形式和强调作用。
- source_word: וְאֹמֵר
  choice: 却说
  rationale: 原文用并列连词连接两个分词；汉语用“却”自然呈现行为与自我辩解之间的反差。
- source_word: אֵין פָּשַׁע
  choice: 这不算过犯
  rationale: פָּשַׁע可指过犯、悖逆或罪责；“过犯”保留道德分量，又不把含义局限于世俗法律上的犯罪。“这不算”自然表达说话者否认其行为构成过犯。
- source_word: חָבֵר
  choice: 同伙
  rationale: 该词表示与另一人联合或结伴；此处语境带有共同恶行的负面意味，“同伙”比“朋友”更准确，也比“伙伴”更有道德警示力。
- source_word: לְאִישׁ מַשְׁחִית
  choice: 毁灭者的
  rationale: מַשְׁחִית是使役主动分词，指造成毁灭或败坏的人；结合חָבֵר后的לְ，译作“毁灭者的同伙”自然表达关联关系。
- source_word: הוּא
  choice: 是
  rationale: 此代词在名词句中起强调或系词作用，现代汉语以“是”自然呈现。
theological_decisions: []
