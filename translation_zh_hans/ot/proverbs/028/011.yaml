  yaml_path: translation/ot/proverbs/028/011.yaml
  text: A rich man is wise in his own eyes[a], but a poor man who has understanding searches him out.
translation:
  language: zh_hans
  text: 富人自以为有智慧；贫穷而有见识的人却能查究他[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“考察他”“探究他”。希伯来语动词可表示搜寻、考察或探究。
    reason: lexical_alternative
lexical_decisions:
- source_word: חָכָם בְּעֵינָיו
  choice: 自以为有智慧
  rationale: “在自己眼中有智慧”是希伯来语对自我评价的表达；译为“自以为有智慧”既自然，也保留了富足者主观自负的意味。
- source_word: אִישׁ עָשִׁיר
  choice: 富足的人
  rationale: 准确表达拥有财富的人；现代汉语中“富足的人”自然庄重，也不额外强化贬义。
- source_word: וְדַל
  choice: 贫穷而……的人，却
  rationale: דַל 指经济困乏、地位低微者。连接词 וְ 在两分句间形成鲜明反差，因此用“却”体现转折。
- source_word: מֵבִין
  choice: 有悟性
  rationale: 该分词表示具有理解力、辨别力；“有悟性”简洁地保留其持续特质，并与“有智慧”形成对应。
- source_word: יַחְקְרֶנּוּ
  choice: 能查透他
  rationale: חקר 可指搜寻、考察、探究到底；“查透他”在此传达辨明或洞察那富足者真实情形的含义，同时由脚注保留其他可能译法。
theological_decisions: []
translation_notes:
