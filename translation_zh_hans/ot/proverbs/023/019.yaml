base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/019.yaml
  text: Listen[a], my son, and be wise, and direct your heart in the way.
translation:
  language: zh_hans
  text: 我儿，你要听，要有智慧；要使你的心走在正路上。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׁמַע
  choice: 你要听
  rationale: 这是阳性单数命令式；“听”在箴言的训诲语境中自然包含留心听从之意，同时保留原词简洁直接的表达。
- source_word: בְנִי
  choice: 我儿
  rationale: 原文是带第一人称单数后缀的阳性单数呼语，明确为父辈式智慧训诲中的“我儿”，不作性别中和。
- source_word: וַחֲכָם
  choice: 从而有智慧
  rationale: 原文命令式可表达“要有智慧”或“成为有智慧的人”。加“从而”使“听”与“有智慧”的关系符合自然汉语，但不把智慧仅解释为结果。
- source_word: וְאַשֵּׁר
  choice: 要引导
  rationale: Piel命令式在此有使之径直、导向之意；“引导”与“你的心”和道路意象搭配自然，也避免生硬的“使……笔直”。
- source_word: בַּדֶּרֶךְ
  choice: 走在正道上
  rationale: דֶּרֶךְ既可指道路，也常比喻行为方式。汉语中“引导你的心走在……道上”自然保留道路隐喻；“正”体现使之走直、走对的语境含义。
- source_word: לִבֶּךָ
  choice: 你的心
  rationale: 保留希伯来文“心”的具体意象；这里涵盖思想、意志和愿望，不缩减为单纯的“头脑”或“情感”。
theological_decisions:
- issue: 智慧训诲中的性别化称呼
  choice: 我儿
  alternative: 我的孩子
  rationale: 原文明确使用阳性单数“儿子”，应如实保留，虽然箴言中的训诲可具有更广泛的代表性。
- issue: “道路”是否特指正道
  choice: 正道
  alternative: 这条路／道路
  rationale: 原文定冠词形式直译为“这道路／道路”，而动词有使之走直、导正的语义。“正道”在汉语中凝练呈现其伦理指向，但并不把道路具体等同于某一后出的教义体系。
translation_notes:
  register: 采用现代、庄重而易懂的训诲体。“我儿”保留父辈智慧教师对男性受教者的直接称呼；后半句保留“心—道路”的希伯来诗性隐喻。
