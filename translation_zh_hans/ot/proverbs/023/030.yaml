  yaml_path: translation/ot/proverbs/023/030.yaml
  text: For those who linger over wine[a], for those who come to search out mixed wine.
translation:
  language: zh_hans
  text: '就是那些流连饮酒的人，

    那些来寻觅混合酒[a]的人。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“香料酒”或“混合饮料”。希伯来语指经过混合、调配的酒，可能加入香料或其他成分，以增强风味或酒力。
    reason: lexical_alternative
lexical_decisions:
- source_word: מְאַחֲרִים
  choice: 流连
  rationale: 该分词在此指久久停留、迟迟不离开；“流连”自然地表达长时间沉溺于饮酒，同时避免古奥措辞。
- source_word: עַל הַיָּיִן
  choice: 于酒
  rationale: 介词 עַל 在此表示围绕酒而停留、专注于酒；与“流连”搭配，译作“流连于酒”简洁自然。
- source_word: בָּאִים
  choice: 来
  rationale: 保留动词“来”的基本方向含义，并与后面的目的性不定式连用，呈现主动前来寻找这种酒的人。
- source_word: לַחְקֹר
  choice: 寻觅
  rationale: 该动词有查寻、探求之意；“寻觅”既表达主动而刻意的寻找，也符合本节诗歌语体。
- source_word: מִמְסָךְ
  choice: 调和酒
  rationale: 该名词指经过混合或调配的酒，可能加入香料或其他成分；“调和酒”保留其核心词义，而不把具体配料说死。
