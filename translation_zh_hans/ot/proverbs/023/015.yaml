  text: בְּ֭נִ/י אִם חָכַ֣ם לִבֶּ֑/ךָ יִשְׂמַ֖ח לִבִּ֣/י גַם אָֽנִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/015.yaml
  text: My son[a], if your heart is wise, my heart also will rejoice.
translation:
  language: zh_hans
  text: 我儿，你心里若有智慧，我的心也会欢喜。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我的心——连我自己——也会欢喜。”这样可更明显地表达希伯来语“也／连我”的强调语气。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנִי
  choice: 我儿
  rationale: 这是阳性单数的亲切称呼，直译为“我儿”；既保留箴言中父亲教导儿子的语境，也符合庄重自然的现代汉语。
- source_word: אִם
  choice: 若
  rationale: 该词引出条件句；“若”准确保留条件意味，且适合智慧文学的凝练语体。
- source_word: חָכַם
  choice: 有智慧
  rationale: 该动词在此表达处于智慧的状态；“有智慧”比生硬的“是智慧的”更自然，又不额外强调获得智慧的过程。
- source_word: לִבֶּךָ
  choice: 你心里
  rationale: 希伯来语“心”涵盖思想、意志和内在生命。“心里”保留原文意象，并与下句“我的心”形成对应。
- source_word: יִשְׂמַח
  choice: 会欢喜
  rationale: 未完成式在条件句结果部分自然表达随之而来的反应；“会欢喜”清楚自然，并保留喜乐的情感力度。
- source_word: לִבִּי
  choice: 我的心
  rationale: 原文明确说“我的心”，与“你心里”构成诗意呼应，不宜简化为“我”。
- source_word: גַם אֲנִי
  choice: 也
  rationale: 该组合带有“我也／连我也”的强调意味。正文用自然的“也”，脚注说明更强的强调译法，以保留原文可能的语气。
theological_decisions: []
translation_notes:
  register: 采用现代、凝练而庄重的普通话。“我儿”保留原文男性单数称呼；“你心里／我的心”保存希伯来诗句的平行结构和心灵意象。
