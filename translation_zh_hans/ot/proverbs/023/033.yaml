  yaml_path: translation/ot/proverbs/023/033.yaml
  text: Your eyes will see strange things[b][a], and your heart will speak perverse things.
translation:
  language: zh_hans
  text: 你的眼睛会看见异样的事物[a]，你的心会说出乖谬的话[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“陌生的女子”或“外族女子”。希伯来语 זָרוֹת 在某些语境中可指外来或不正当的女子；在这里也可较广义地指醉酒所见的异样事物。
    reason: alternative_reading
  - marker: b
    text: 或译“颠倒的话”或“歪曲的话”。希伯来语 תַּהְפֻּכוֹת 指乖谬、扭曲或歪曲之事；在这里因与“说”相连，尤其指言语。
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵינֶיךָ
  choice: 你的眼睛
  rationale: 原文为带第二人称阳性单数后缀的双数形式；现代汉语自然译作“你的眼睛”。
- source_word: יִרְאוּ
  choice: 会看见
  rationale: Qal未完成式在醉酒后果的语境中表达将出现的结果；“会看见”自然清楚。
- source_word: זָרוֹת
  choice: 怪异的景象
  rationale: 该阴性复数形式可指陌生、异常之物，也可能指陌生或不正当的女人。上下文描写醉酒造成的异常知觉，因此正文采用较宽泛且符合汉语表达的“怪异的景象”，并以脚注保留另一种理解。
- source_word: וְלִבְּךָ
  choice: 你的心
  rationale: 希伯来语“心”涵盖思想、意志和内在之人；保留“心”以贴近原文，不窄化为“头脑”。
- source_word: יְדַבֵּר
  choice: 会说出
  rationale: Piel未完成式与前句平行，表示醉酒所导致的结果；“说出”在现代汉语中能自然连接其宾语。
- source_word: תַּהְפֻּכוֹת
  choice: 颠倒的话
  rationale: 该词指歪曲、悖谬或颠倒之事，在“心说”的搭配中主要关乎言语；“颠倒的话”既体现扭曲之意，也自然易懂。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“怪异的景象”传达醉酒引起的异常视觉，同时不在正文中过度限定含义；“颠倒的话”保留原文的道德与言语张力。脚注标记按正文出现顺序排列。
