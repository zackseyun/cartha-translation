  text: בְּ/אָזְנֵ֣י כְ֭סִיל אַל תְּדַבֵּ֑ר כִּֽי יָ֝ב֗וּז לְ/שֵׂ֣כֶל מִלֶּֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/009.yaml
  text: Do not speak in the hearing of a fool[b][a], for he will despise the wisdom of your words.
translation:
  language: zh_hans
  text: 不要说给愚昧人听[a]，因为他会藐视你话语中的见识[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“不要在愚昧人的耳中说话。”
    reason: lexical_alternative
  - marker: b
    text: “见识”也可译作“明智之处”或“明辨力”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּ/אָזְנֵי
  choice: 说给……听
  rationale: 希伯来语直译为“在……耳中”，是指让某人听见的惯用表达；此译自然，并保留话语指向听者的含义。
- source_word: כְסִיל
  choice: 愚昧人
  rationale: 这是《箴言》的典型智慧文学用语，指在道德和认知上顽梗的人，并非单指智力不足。
- source_word: אַל תְּדַבֵּר
  choice: 不要说
  rationale: 准确表达 אַל 加未完成式构成的禁止语气，也保持箴言的简洁。
- source_word: כִּי
  choice: 因为
  rationale: 引出前述禁令的理由，现代汉语中清楚自然。
- source_word: יָב֗וּז
  choice: 会藐视
  rationale: 该动词表示带着轻蔑而拒绝；“藐视”简洁且力度恰当。
- source_word: לְ/שֵׂכֶל
  choice: 明智
  rationale: שֵׂכֶל 可指洞见、明辨或良好的判断力；“明智”在此既自然，又避免将含义扩大为完整的“智慧”概念。前缀 ל־ 按 בזה 所支配的受事理解。
- source_word: מִלֶּֽי/ךָ
  choice: 你话中的
  rationale: 原文是“你的话语”的复数属格关系；汉语用“你话中的明智”自然表达这些话所具有的明辨与道理。
