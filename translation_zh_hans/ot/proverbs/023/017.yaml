  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אַל יְקַנֵּ֣א לִ֭בְּ/ךָ בַּֽ/חַטָּאִ֑ים כִּ֥י אִם בְּ/יִרְאַת יְ֝הוָ֗ה כָּל הַ/יּֽוֹם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/017.yaml
  text: Do not let your heart envy sinners[a], but be in the fear of Yahweh all day long.
translation:
  language: zh_hans
  text: 不要让你的心羡慕罪人，却要终日敬畏耶和华。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不要让你的心嫉妒罪人，却要让你的心终日敬畏耶和华。”
    reason: 词义及省略结构的另一种表达：קנא也可译为“嫉妒”，后半句也可理解为继续以“你的心”为主体。
lexical_decisions:
- source_word: אַל יְקַנֵּא
  choice: 不要……羡慕
  rationale: אַל与未完成式动词构成禁止语；קנא在此指因罪人表面的境况而心生羡慕。现代汉语用“不要……羡慕”自然直接。
- source_word: לִבְּךָ
  choice: 你的心
  rationale: 保留希伯来语“心”的意象，指人的内在意愿、欲望和态度，不将其窄化为单纯的思想。
- source_word: בַּחַטָּאִים
  choice: 罪人
  rationale: 该词指以犯罪为特征的人；“罪人”简洁地保留原文的道德类别。
- source_word: כִּי אִם
  choice: 却要
  rationale: 这一组合在否定句后引出纠正性的对比，即“不要甲，却要乙”；“却要”既清楚又符合汉语箴言体。
- source_word: בְּיִרְאַת יְהוָה
  choice: 敬畏耶和华
  rationale: יִרְאָה兼有畏惧与尊崇之意，“敬畏”保留这一重要的智慧文学用语；介词结构在汉语中自然转为动词表达。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名“耶和华”呈现四字神名，而不以称号替代。
- source_word: כָּל הַיּוֹם
  choice: 终日
  rationale: 表示整日、始终持续；“终日”凝练、庄重，并符合箴言的诗体语域。
theological_decisions:
- issue: 第二分句没有明说谓语，应如何在汉语中表达
  choice: 补出“要”，并把“在耶和华的敬畏中”自然表达为“敬畏耶和华”
  alternative: 却要终日在对耶和华的敬畏中；或：却要让你的心终日敬畏耶和华
  rationale: 原文第二分句是省略结构，与前面的禁令形成对照。汉语需要补足劝诫语气；“却要终日敬畏耶和华”不额外加入“持守、继续”等原文未明说的含义。是否由“你的心”继续作逻辑主体，在句法上仍有一定余地，故列入脚注。
translation_notes:
  register: 采用现代、凝练而庄重的箴言体。“羡慕”比“嫉妒”更贴合此处对罪人境况产生向往的语境；保留“心”和“敬畏”等核心圣经意象。
