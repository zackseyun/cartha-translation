base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/027.yaml
  text: For a prostitute is a deep pit[a], and a foreign woman is a narrow well.
translation:
  language: zh_hans
  text: 因为妓女是深坑，外来的女子[a]是狭窄的井。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“陌生女子”；有些译本按本书的警戒语境意译为“淫妇”。
    reason: 保留 נָכְרִיָּה 在“外来的／陌生的”基本词义与《箴言》语境中的解释性理解之间的张力。
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上一节的劝诫，说明不可沉迷于酒宴淫乐的缘由；“因为”保留原文的解释关系。
- source_word: שׁוּחָה עֲמֻקָּה
  choice: 深坑
  rationale: 按字面呈现“坑”与“深”的危险意象，简洁自然，不在正文中提前解释为“陷阱”。
- source_word: זוֹנָה
  choice: 妓女
  rationale: 该词在此指以性交易为业或以淫乱著称的女子；“妓女”是现代汉语中直接、清楚而不过分粗俗的对应词。
- source_word: וּבְאֵר צָרָה
  choice: 是窄井
  rationale: בְּאֵר通常指“井”，צָרָה表示狭窄、逼仄；“窄井”保留与“深坑”平行的具体图像及难以脱身的暗示。
- source_word: נָכְרִיָּה
  choice: 外族女子
  rationale: 保留该词“外来的、异族的女子”这一基本词义，同时避免在正文中直接把它限定为“淫妇”；其在《箴言》中的道德语境另以脚注说明。
theological_decisions:
- issue: 智慧文学警戒语境中 נָכְרִיָּה 的含义
  choice: 外族女子
  alternative: 陌生女子；按语境意译为“淫妇”
  rationale: 原词既可突出社会或群体意义上的“外来”，在《箴言》的固定警戒语境中又常指引诱人发生不正当性关系的女子。正文保留较直接的词义，脚注交代更宽泛和更具解释性的译法，以免把族属意义或婚姻状态绝对化。
translation_notes:
  register: 采用简洁、对称的箴言体：“深坑”与“窄井”形成鲜明平行。语言现代而庄重，不使用古旧的“娼妓”“淫娃”等词，也不把井坑意象明说成陷阱。
