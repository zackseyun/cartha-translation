  text: Listen to your father[a], who fathered you[b], and do not despise your mother when she is old.
translation:
  language: zh_hans
  text: 你要听从你的父亲[a]，就是生你的人；当你母亲年老时[b]，不可藐视她。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译作“听从你的父亲，这位生你的”。希伯来语在“你的父亲”之后用指示词，带有回指和强调；正文按汉语习惯译作“就是生你的人”。
    reason: lexical_alternative
  - marker: b
    text: 或译“因为你母亲年老”。希伯来语 כִּי 可表示原因，也可引出时间或相关处境；“年老”所用完成式可指已经进入年老的状态。
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמַע לְאָבִיךָ
  choice: 听从……父亲
  rationale: שׁמע 与介词 ל 连用，在此不仅指听见，更指留心听并顺从劝诫；“听从”符合现代汉语的训诫语境。
- source_word: זֶה יְלָדֶךָ
  choice: 生你的
  rationale: זֶה 回指前述父亲并带强调、说明作用；汉语用关系结构“生你的父亲”自然表达。ילד 的主语为父亲，指他使儿子出生；“生你的”简洁而不采用古雅的“生了你”。
- source_word: וְאַל תָּבוּז
  choice: 不可……藐视
  rationale: בוז 指轻看、蔑视或以鄙夷相待；“藐视”保留其强烈程度，也适合智慧文学的庄重语体。
- source_word: כִּי זָקְנָה אִמֶּךָ
  choice: 因母亲年老
  rationale: כִּי 可按因由或处境理解；这里译作“因……年老”，自然地表达警告：不可把母亲的衰老当作轻视她的缘由。זָקְנָה 的完成式突出已进入年老状态。
theological_decisions: []
