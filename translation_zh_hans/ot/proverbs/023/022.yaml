review_pass:
  verdict: revise
  source_fidelity: 建议修订。草案将“这位生你的”融入“生你的父亲”，大体传达了父亲为生父，却弱化了希伯来语 זֶה 对前述“父亲”的指示／强调。更重要的是，主文“不可因母亲年老就藐视她”把 כִּי 较明确地限定为“因为”，而该词在此可自然地引出时间或相关处境；采用“当……时”能避免将母亲年老误作轻视她的理由，同时仍符合原文。
  naturalness: “你要听从你的父亲，就是生你的人；当你母亲年老时，不可藐视她”在现代标准汉语中庄重、清楚，也适合箴言的训诫语体。“就是生你的人”自然保留说明性强调，避免“生你的父亲”可能产生的轻微结构黏连。
  terminology: “听从”恰当表达 שׁמע 在训诫中的留心并接受；“藐视”准确对应 בוז 的轻蔑、轻看。“生你的人”在父亲语境中明确为使其出生者，不引入“养育”的额外含义。
  issues:
  - severity: medium
    issue: 主文将 כִּי 固定译为“因”。
    rationale: 此处 כִּי 可表原因，但也可引出“当／在……时”的处境。主文使用“因”会令读者较容易理解为“母亲年老”被直接陈述为轻视她的理由；“当……时”较稳妥地保留训诫所指的处境。
  - severity: low
    issue: 未显出 זֶה 对“父亲”的说明性强调。
    rationale: “生你的父亲”表达了基本意义，但未明显体现“你的父亲，这位生你的”的回指与强调。用“就是生你的人”可在自然汉语中表达这一层次。
  - severity: low
    issue: 脚注锚点只置于句末，且未说明父亲后的指示词。
    rationale: 将脚注分别锚定在相关短语后，能使词汇替代说明对应明确，并完整反映原文中值得注释的两个表达。
