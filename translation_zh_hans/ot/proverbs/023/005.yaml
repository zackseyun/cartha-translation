  text: ה/תעוף עֵינֶ֥י/ךָ בּ֗/וֹ וְֽ/אֵ֫ינֶ֥/נּוּ כִּ֤י עָשֹׂ֣ה יַעֲשֶׂה לּ֣/וֹ כְנָפַ֑יִם כְּ֝/נֶ֗שֶׁר ו/עיף הַ/שָּׁמָֽיִם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/005.yaml
  text: Will you let your eyes fly to it[a], and it is gone? For it surely makes wings for itself; like an eagle, it flies to the heavens.
translation:
  language: zh_hans
  text: '你岂能使眼目飞向财富，

    它就不见了？


    因为财富必为自己长出翅膀，

    如鹰[a]飞向天空。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“如秃鹫”；希伯来语 נֶשֶׁר 可较宽泛地指大型猛禽。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתָעוּף
  choice: 岂要让……飞向
  rationale: 保留使役形态和希伯来文“飞”的鲜明意象，同时用现代汉语反问句表达。
- source_word: עֵינֶיךָ
  choice: 眼目
  rationale: 直译身体意象；“眼目”比“目光”更贴近原文，也保持智慧文学的庄重语体。
- source_word: בּוֹ
  choice: 向财富
  rationale: 代词所指承接上文的财富；汉语若仅作“向它”较生硬，因此明确所指而不改变语义。
- source_word: וְאֵינֶנּוּ
  choice: 它却不见了
  rationale: 原意为“它不存在了”；“不见了”自然传达财富突然消失，并以“却”表现反问中的转折。
- source_word: כִּי
  choice: 因为
  rationale: 引出财富消失的原因。
- source_word: עָשֹׂה יַעֲשֶׂה
  choice: 必……长出
  rationale: 不定式绝对形加未完成式具有强调作用；“必”体现确定而强烈的语气。“长出”在翅膀的比喻中比字面“制造”更自然。
- source_word: לּוֹ
  choice: 为自己
  rationale: 表达与格结构所含的自身受益或反身意味。
- source_word: כְנָפַיִם
  choice: 翅膀
  rationale: 直接对应原词。
- source_word: כְנֶשֶׁר
  choice: 如鹰
  rationale: נֶשֶׁר泛指大型猛禽，传统且易懂的对应为“鹰”；动物种类的不确定性保留在脚注。
- source_word: וְעָף
  choice: 飞向
  rationale: 以现在式般的生动画面表达诗歌序列中的结果，不额外加入“逃走”等解释。
- source_word: הַשָּׁמָיִם
  choice: 天空
  rationale: 此处指鸟飞翔的天际；“天空”在现代汉语中自然，也避免将其误解为神学意义上的天堂。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的智慧文学语体；保留“眼目飞向”和财富生翅飞去的连续比喻。分行呈现诗歌平行结构。
