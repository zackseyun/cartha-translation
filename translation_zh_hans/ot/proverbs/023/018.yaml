  yaml_path: translation/ot/proverbs/023/018.yaml
  text: For surely there is a future[a], and your hope will not be cut off.
translation:
  language: zh_hans
  text: 因为确有将来[a]，你的盼望必不致断绝。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“确有结局”或“确有结果”。希伯来语“אַחֲרִית”可指末后、结局、结果或将来；这里因上下文表达积极的期待，译作“将来”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: 因为……确有
  rationale: 承接上一节的劝勉，并表达强调性的肯定；避免译成条件句“如果”，以免误导。
- source_word: יֵשׁ
  choice: 有
  rationale: 自然表达希伯来语的存在句。
- source_word: אַחֲרִית
  choice: 将来
  rationale: 该词可指结局、终局或将来；本节与“指望”并列，在积极期待的语境中译为“将来”最自然，同时以脚注保留其词义幅度。
- source_word: וְתִקְוָתְךָ
  choice: 你的指望
  rationale: תִּקְוָה表示盼望或期待；“指望”在现代汉语中自然，并能与前半句的未来前景相呼应。
- source_word: לֹא תִכָּרֵת
  choice: 必不致断绝
  rationale: 保留כרת“被切断”的意象，同时用庄重而通顺的现代汉语表达其否定结果。
theological_decisions: []
