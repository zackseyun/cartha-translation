base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/023.yaml
  text: Buy truth[a], and do not sell wisdom, instruction[c][b], and understanding.
translation:
  language: zh_hans
  text: 要买真理，不可卖智慧、训诲和悟性。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “买”也可译为“取得”或“获得”，但“买”与“卖”的商业意象形成对照。“训诲”也可译为“管教”或“纠正”；“悟性”也可译为“洞察力”或“辨别力”。原文措辞凝练；后三项直接跟在“不可卖”之后。
    reason: 说明词汇替代，并准确反映原文的句法关系。
lexical_decisions:
- source_word: אֱמֶת
  choice: 真理
  rationale: 此处指应当获得并持守的真实、可靠之道；“真理”在智慧劝诫的语境中自然简洁，也保留认知与道德两方面的含义。
- source_word: קְנֵה
  choice: 买
  rationale: 该命令式可指“买”或较广义的“取得”。因下句明确说“卖掉”，译作“买”可保留原文刻意使用的商业意象和鲜明对照。
- source_word: וְאַל תִּמְכֹּר
  choice: 不可卖掉
  rationale: 保留否定命令及其与“买”的对应关系；“卖掉”比单说“卖”更自然地表达将已经拥有之物放弃。
- source_word: חָכְמָה
  choice: 智慧
  rationale: 这是《箴言》中该词的标准对应，涵盖合宜生活所需的实践、道德和敬神智慧。
- source_word: מוּסָר
  choice: 训诲
  rationale: 该词兼有管教、纠正和教导之意。“训诲”既适合庄重的智慧文学语体，也不把意义局限于惩罚。
- source_word: בִינָה
  choice: 悟性
  rationale: 该词表示理解、洞察和辨别能力。“悟性”与“智慧、训诲”并列自然，并突显理解与分辨的能力。
theological_decisions:
- issue: “不可卖掉”的管辖范围
  choice: 用“也是如此”明确表示“不可卖掉”同样适用于智慧、训诲和悟性
  alternative: 译作“要买真理，不可卖智慧、训诲和悟性”或将四项都直接列为“买”的宾语
  rationale: 希伯来语先说“买真理，不可卖”，随后无连接词列出“智慧、训诲和悟性”，句法极其凝练。这里最自然的理解是整组珍宝都应取得而不可放弃；补出“也是如此”使现代汉语清楚，同时避免误读为只买真理、却只不可卖后三项。
translation_notes:
  register: 采用现代、庄重而易懂的箴言式表达。“要买……不可卖掉”保留原文简短有力的商业比喻；分号和“也是如此”使省略式希伯来语在现代汉语中清晰可读。
