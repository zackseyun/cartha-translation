  text: and put a knife to your throat if you are a man of appetite[a].
translation:
  language: zh_hans
  text: 你若食欲旺盛，就要把刀放在自己的喉咙前。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你若容易受食欲支配”，或“你若是个贪吃的人”。希伯来语习语字面近似“欲望的拥有者”；在这里指食欲强烈、容易受食欲支配的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/שַׂמְתָּ
  choice: 就要把……架在
  rationale: 连接上一节的训诲，在条件句中自然表达为带命令意味的后续行动；“架在”符合现代汉语搭配。
- source_word: שַׂכִּין
  choice: 刀
  rationale: 直译该名词，并保留原文鲜明而夸张的警戒形象。
- source_word: בְּ/לֹעֶךָ
  choice: 在喉咙上
  rationale: לֹעַ指喉咙或咽喉；结合“把刀架……”的汉语表达，译作“在喉咙上”自然清楚。
- source_word: אִם
  choice: 若
  rationale: 保留原文的条件关系，同时采用简洁庄重的现代书面语。
- source_word: בַּעַל נֶפֶשׁ
  choice: 贪食的人
  rationale: 该习语直译近似“欲望之主/有胃口的人”；在赴统治者筵席的语境中，指受强烈食欲支配的人。“贪食的人”传达语境含义，但不将其强化为固定身份称谓。
- source_word: אָתָּה
  choice: 你……是
  rationale: 独立人称代词明确指向受训诲的第二人称，在汉语条件句中以“你若是……”表达。
