  yaml_path: translation/ot/proverbs/023/016.yaml
  text: and my inmost being will rejoice when your lips speak what is upright[a][b].
translation:
  language: zh_hans
  text: 当你的嘴唇说正直的话[b]时，我的内心[a]必欢喜。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“我的肾脏”；在希伯来语中，这是指内在自我或深层情感的表达。
    reason: cultural_note
  - marker: b
    text: “正直的话”也可译为“正确的话”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְתַעְלֹזְנָה
  choice: 也必欢喜
  rationale: 动词 עלז 表达强烈的喜悦；“欢喜”自然庄重，“必”体现此处未完成式在语境中的将来意味，“也”承接上节父亲心里的欢喜。
- source_word: כִלְיוֹתָי
  choice: 我的内心
  rationale: 字面为“我的肾脏”，在希伯来语中指人的内在自我或深层情感。“我的内心”在现代汉语中清楚自然，又避免将其过窄地解释为单一情感或思想器官。
- source_word: בְּדַבֵּר
  choice: 当……说……时
  rationale: 介词 בְּ 与不定式连用，在此自然表达时间关系；译作“当……时”准确而流畅。
- source_word: שְׂפָתֶיךָ
  choice: 你的嘴唇
  rationale: 保留原文具体的身体意象和诗歌表达，在现代汉语中仍可理解。
- source_word: מֵישָׁרִים
  choice: 正直的话
  rationale: 该复数名词含“正直、正当之事”之意，在此作“说”的内容。“正直的话”既保留伦理意味，也符合汉语搭配；亦可译作“正确的话”。
theological_decisions: []
translation_notes:
  register: 采用现代、自然而庄重的标准普通话。保留“嘴唇”的诗歌意象，以“内心”传达希伯来语身体隐喻的实际含义；句式与上一节可能存在的“也”之承接关系相协调。
