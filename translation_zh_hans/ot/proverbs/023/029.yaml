base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/029.yaml
  text: Who has woe? Who has sorrow? Who has strife? Who has complaining? Who has wounds for nothing? Who has redness of eyes?[a][b][c]
translation:
  language: zh_hans
  text: 谁有祸患？谁有哀愁？谁有争吵？谁有怨言？谁无故受伤？谁双眼发红？[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “哀愁”或译“悲叹”，以突出אֲבוֹי近似哀号的语气。
    reason: lexical_alternative
  - marker: b
    text: “无故”或译“白白地”或“徒然”。
    reason: lexical_alternative
  - marker: c
    text: “双眼发红”或译“眼睛布满血丝”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹי
  choice: 祸患
  rationale: 该词表示痛苦、灾祸或哀叹；“祸患”保留简短而有力的智慧文学语气，并能自然接在“谁有”之后。
- source_word: אֲבוֹי
  choice: 哀愁
  rationale: 这是近似哀号的表达；译作“哀愁”既与前面的“祸患”有别，也保留平行句中的悲苦意味。
- source_word: מדונים
  choice: 争吵
  rationale: 复数形式指纷争、争竞；“争吵”在现代汉语中自然，也能传达反复发生的人际冲突。
- source_word: שִׂיחַ
  choice: 怨言
  rationale: 该词可指言谈、抱怨或忧苦的沉思；此处译作“怨言”，保留语义弹性，又符合上下文所列的醉酒后果。
- source_word: פְּצָעִים
  choice: 受伤
  rationale: 原词指伤口或创伤；在“谁有……”的连续问句中译作“谁……受伤”，比名词式表达更符合现代汉语。
- source_word: חִנָּם
  choice: 无故
  rationale: 该副词可表示无缘无故、白白地或徒然；“无故受伤”简洁自然，同时保留伤害没有正当缘由的含义。
- source_word: חַכְלִלוּת עֵינָיִם
  choice: 双眼发红
  rationale: 该短语描述眼睛呈现异常颜色；“双眼发红”贴近字面，也避免直接把含义限定为更具解释性的“布满血丝”。
- source_word: לְמִי
  choice: 谁有／谁……
  rationale: 字面为“对谁／谁那里有”；按汉语习惯以反复的“谁有”起句，并在“谁无故受伤”“谁双眼发红”处采用自然谓语结构，保留连续反问的节奏。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话，以六个连续问句重现希伯来文的排比和反问节奏。对שִׂיחַ与חַכְלִלוּת עֵינָיִם保留适度语义空间，不把前者过度限定为醉后胡言，也不把后者完全解释为某一种具体眼部症状。
