  yaml_path: translation/ot/proverbs/023/011.yaml
  text: for their Redeemer is strong[a]; he will plead their case against you.
translation:
  language: zh_hans
  text: 因为他们的救赎者大有能力[a]；他必为他们的案件与你争讼。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“他们的近亲救赎者”或“他们的维护者”。希伯来语 גֹאֵל 指为亲属施行赎回、保护或伸冤的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上一节的禁令并说明理由；“因为”自然保留因果关系。
- source_word: גֹאֲלָם
  choice: 他们的救赎者
  rationale: גאל 指承担亲属责任、施行赎回、保护或伸冤的人。“救赎者”简洁保留其法律、亲属与神学分量，其他可能含义见脚注。
- source_word: חָזָק
  choice: 大有能力
  rationale: 强调这位救赎者有力量并有能力采取行动；比单用“强壮”更符合保护和诉讼语境。
- source_word: הוּא
  choice: 他
  rationale: 保留独立代词所带的主语强调，同时符合现代汉语表达。
- source_word: יָרִיב אֶת רִיבָם
  choice: 为他们申诉
  rationale: 动词与同根名词构成强调性的法律表达，意为为他们争讼、维护其案件；“为他们申诉”自然呈现司法性含义。
- source_word: אִתָּךְ
  choice: 与你争辩
  rationale: 在争讼语境中表示以“你”为对手；“与你争辩”保留原文“同你争讼”的直接对抗意味。
theological_decisions:
- issue: 智慧文学语境中 גֹאֵל 的译法
  choice: 救赎者
  alternative: 至近亲属救赎者；维护者；伸冤者
  rationale: “救赎者”保留该词赎回、亲属义务、保护及伸冤等重叠内涵，也保留其可能具有的神学回响，却不武断限定所指身份。脚注说明其较宽的语义范围。
- issue: 救赎者身份是否明确指上帝
  choice: 不在正文中补明“上帝”
  alternative: 他们的救赎者上帝
  rationale: 原文只说“他们的救赎者”，虽语境很可能让读者理解为上帝，却未明说；译文保留这种含蓄与神学张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“大有能力”传达 חָזָק 的行动能力；分号保留因由陈述与后续司法行动之间的紧密关系。正文中的[a]与脚注对应。
