  text: אַל תִּמְנַ֣ע מִ/נַּ֣עַר מוּסָ֑ר כִּֽי תַכֶּ֥/נּוּ בַ֝/שֵּׁ֗בֶט לֹ֣א יָמֽוּת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/013.yaml
  text: Do not withhold discipline from a boy[a], for if you strike him with the rod[b], he will not die.
translation:
  language: zh_hans
  text: 不可停止管教男孩[a]；你若用杖责打他[b]，他必不至于死。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “男孩”也可译作“孩子”或“少年”。希伯来语名词为阳性单数，可指男孩，也可较广地指孩子或年轻人。
    reason: lexical_alternative
  - marker: b
    text: 这是箴言式的说法；不可把它理解为认可虐待性暴力，或视为适用于每一种情形的绝对保证。
    reason: cultural_note
lexical_decisions:
- source_word: אַל תִּמְנַע
  choice: 不可不管教
  rationale: אַל配合未完成式表达禁止；מנע意为“扣留、不予”。中文用“不可不……”既保留禁令语气，也自然表达不得不给予管教。
- source_word: מִנַּעַר
  choice: 孩子
  rationale: נַעַר可指男孩、少年或较广义的孩子；本节虽用阳性单数，现代汉语“孩子”自然且不排除原文所指的男孩，具体词义范围以脚注说明。
- source_word: מוּסָר
  choice: 管教
  rationale: 在《箴言》中常兼有训诲、纠正与训练之意；结合下句用杖责打的语境，“管教”最贴切。
- source_word: כִּי
  choice: 你若
  rationale: 此处可在语境中引出带条件意味的理由说明。译为“你若”使中文衔接自然，同时保留“责打而不死”的论证关系。
- source_word: תַכֶּנּוּ
  choice: 责打他
  rationale: נכה指击打、打击；“责打”保留具体动作，也交代其管教语境，不把它弱化为抽象的“纠正”。
- source_word: בַשֵּׁבֶט
  choice: 用杖
  rationale: שֵׁבֶט在此指用于管教的杖；“用杖”准确而简洁。
- source_word: לֹא יָמוּת
  choice: 他不至于死
  rationale: 直译否定的“死亡”。“不至于死”符合汉语箴言体，并未在正文中添加绝对保证或其他限定。
theological_decisions:
- issue: נַעַר的性别与年龄范围
  choice: 正文译作“孩子”并加脚注
  alternative: 男孩；少年
  rationale: 原词为阳性单数，可能特指男孩，也可较广地指孩子或年轻人。中文“孩子”在单数代表性格言中自然，脚注保留原文可能更明确的男性指向及年龄弹性。
- issue: 关于杖责与死亡的箴言式断言
  choice: 正文直译“他不至于死”，脚注说明其体裁和伦理边界
  alternative: 这不会把他打死；他不会因此死亡
  rationale: 原文作直接的箴言式陈述，不宜在正文中擅加软化限定；但也不应让现代读者误以为经文认可虐待，或把格言当作任何情形下的绝对保证。
translation_notes:
  register: 采用现代、庄重而通俗的箴言体。“不可不管教”保持原文禁令的力度；分号呈现两分句间的理由与条件关系。所有解释性限定均置于脚注，正文保留原文直接而带张力的表达。
