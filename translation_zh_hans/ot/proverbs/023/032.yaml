base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/032.yaml
  text: In the end it bites like a snake[c][b][a], and it stings like a viper.
translation:
  language: zh_hans
  text: 到头来，酒像蛇一样咬你[a]，又像毒蛇一样伤你[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“它的结局像蛇一样咬”；“它”指上下文所说的酒，“结局”即饮酒最终带来的后果。
    reason: lexical_alternative
  - marker: b
    text: “伤你”所译的希伯来语动词词义较难确定，传统上也译作“刺你”；另有“袭击”或“喷出毒液”等解释。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרִיתוֹ
  choice: 到头来
  rationale: 该词指事物最终的结局或后果；结合上文所说的酒，用“到头来”自然地表达其迟来的后果，同时保留原文“它的结局”的语义。
- source_word: כְּנָחָשׁ
  choice: 像蛇一样
  rationale: נָחָשׁ是“蛇”的普通用词；“蛇”符合现代汉语习惯，也避免加入原文未必具有的额外联想。
- source_word: יִשָּׁךְ
  choice: 咬你
  rationale: 该动词来自נשׁך，意为“咬”。原文未明说受事，但汉语补出“你”可自然承接上下文对饮酒者的第二人称劝诫。
- source_word: וּכְצִפְעֹנִי
  choice: 又像毒蛇一样
  rationale: צִפְעֹנִי指有毒的蛇；“毒蛇”在现代汉语中清楚自然，又不武断指定难以确定的蛇种。
- source_word: יַפְרִשׁ
  choice: 伤你
  rationale: 此动词词义疑难，语境表明是毒蛇造成伤害的动作。“伤你”保留基本意象及与“咬你”的平行关系，却不把有争议的具体动作限定为“刺”“袭击”或“喷出毒液”。
theological_decisions: []
translation_notes:
  register: 采用庄重而通俗的现代标准汉语。“到头来”传达箴言所强调的最终后果；两句保留蛇与毒蛇的平行意象。为使汉语顺畅并衔接上下文，补出“酒”和“你”；第二个动词则采用较宽泛的“伤”，以保存原文的词义不确定性。
