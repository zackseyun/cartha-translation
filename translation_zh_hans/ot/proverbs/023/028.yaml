base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/028.yaml
  text: Indeed[a], she lies in wait like a robber[b], and she increases the treacherous among men.
translation:
  language: zh_hans
  text: 她确实像强盗一样埋伏[a]，使世上的背信者增多[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“匪徒”。希伯来文 חֶתֶף 罕见且词义难定；也有人理解为暴力的攫取或突如其来的袭击。
    reason: lexical_alternative
  - marker: b
    text: 原文作“在人（אָדָם）中”；“人”在此为泛指，指人类。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף
  choice: 也
  rationale: 此处承接上一节并加强论述；在汉语中用“也”自然表达递进或附加关系，同时避免把强调程度说得过满。
- source_word: הִיא
  choice: 她
  rationale: 保留阴性单数代词，指向上文所说的淫妇或外女。
- source_word: כְּחֶתֶף
  choice: 像强盗一样
  rationale: חֶתֶף罕见且词义困难；结合“埋伏”的语境，具体指掠夺者或强盗较为合适，也保留捕猎般的危险意象。
- source_word: תֶּאֱרֹב
  choice: 埋伏
  rationale: ארב表示潜伏等候、伺机袭击；“埋伏”简洁而准确。
- source_word: וּבוֹגְדִים
  choice: 奸诈的人
  rationale: בוגדים泛指行事诡诈、背信不忠的人；“奸诈的人”适合智慧文学的广泛道德语境，不局限于政治叛徒。
- source_word: בְּאָדָם
  choice: 人间
  rationale: אָדָם在此为集合性、泛指全人类；“人间”自然表达“在人类当中”，不误限定为男性。
- source_word: תּוֹסִף
  choice: 使……增多
  rationale: יסף的使役形表示增加或使数目增长；这一表达清楚呈现该女子造成更多人变得奸诈的因果意味。
theological_decisions:
- issue: “奸诈的人增多”是否特指婚姻不忠
  choice: 保留广义的“奸诈的人”
  alternative: 使不忠的人增多
  rationale: בוגדים可包括不忠，却不限于婚姻范畴；采用广义译法，保留原文在当前语境中的道德张力。
translation_notes:
  register: 采用现代、简洁而庄重的智慧文学语体。“她也像强盗一样埋伏”保留原文的掠夺和伏击意象；后半句用“人间”自然传达אָדָם的泛指意义。
