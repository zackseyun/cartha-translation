  text: Do not eat the bread of a man with an evil eye[a], and do not crave his delicacies.
translation:
  language: zh_hans
  text: 不要吃吝啬人的饭[a]，也不要贪恋他的美味佳肴。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语直译为“恶眼之人的饼”。“恶眼”在这里是习语，指吝啬、舍不得给人，或待客时心有不甘的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּלְחַם
  choice: 吃
  rationale: 这里的动词与“饭食”连用，表示进食，而不是同形词所表达的“争战”。“吃”最自然、直接。
- source_word: לֶחֶם
  choice: 饭
  rationale: 该词本义为“饼、面包”，此处借指一顿饭或一般食物。现代汉语用“饭”既符合语境，也保留了受邀进食的场景。
- source_word: רַע עָיִן
  choice: 吝啬人
  rationale: 希伯来语直译为“眼目邪恶的人”，在智慧文学语境中指吝啬、舍不得给人或待客不真诚的人。正文采用自然明确的汉语表达，原文意象在脚注中保留。
- source_word: תתאו
  choice: 贪恋
  rationale: 该词表达强烈的欲望。“贪恋”既传达内心渴求，也符合本节劝诫的语气。
- source_word: לְמַטְעַמֹּתָיו
  choice: 他的美味
  rationale: 该名词指可口、诱人的食物或佳肴。“美味”简洁自然，并保留食物具有吸引力的含义。
