base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/004.yaml
  text: Do not wear yourself out to get rich[a]; stop relying on your own understanding.
translation:
  language: zh_hans
  text: 不要为发财累坏自己；不要再倚仗自己的聪明。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 下半句也可较贴近原文译为：“停止凭你自己的见识（行事）。”希伯来文措辞简练；也可理解为劝人凭自己的见识罢手，不再追逐财富。
    reason: 保留חֲדָל מִבִּינָתְךָ的压缩句法及其解释空间。
lexical_decisions:
- source_word: אַל
  choice: 不要
  rationale: 与未完成式动词连用，表达禁止；“不要”是现代汉语中自然、准确的禁令形式。
- source_word: תִּיגַע
  choice: 累坏自己
  rationale: יגע表示因辛劳而疲倦、耗损；“累坏自己”既保留劳苦至疲惫的力度，也符合本句劝戒性的口吻。
- source_word: לְהַעֲשִׁיר
  choice: 为发财
  rationale: עשר的使役式在这里表示劳苦追求的目标，即变得富有；“为发财”简洁而自然。
- source_word: מִבִּינָתְךָ
  choice: 倚仗自己的聪明
  rationale: בינה指理解力、见识或聪明；与חדל及介词מִן构成压缩的表达。正文采用“倚仗”来表达停止以个人见识为凭据的语用含义，同时以脚注保留较直译的可能。
- source_word: חֲדָל
  choice: 不要再
  rationale: חדל是“停止、罢休”的命令式；“不要再”在现代汉语中自然传达停止现有做法的命令语气。
theological_decisions:
- issue: 下半句是否明确指停止倚靠自己的聪明
  choice: 译作“不要再倚仗自己的聪明”
  alternative: 较直译为“停止你自己的聪明／见识”或理解为“凭你的见识，要罢手”
  rationale: 希伯来文表达简练，מִן与חדל的关系可产生不止一种理解。正文采用语境中较自然的意思，即不要靠自己的精明追逐财富；但不把它扩展成反对智慧本身，并在脚注中保留原文措辞的含混。
translation_notes:
  register: 采用现代、简洁而庄重的劝戒语气。“发财”通俗但不轻佻；“累坏自己”传达יגע所含的耗损感。上下两句以分号连接，保持希伯来诗句的平行结构。
