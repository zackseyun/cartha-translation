base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/034.yaml
  text: And you will be like one lying down in the heart of the sea[a], like one lying down on the top of the mast.
translation:
  language: zh_hans
  text: 你就会像躺在海中央的人，又像躺在桅杆顶端的人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיִיתָ
  choice: 你就会
  rationale: 该形式在警告语境中带有将来及结果意味；“你就会”保留第二人称直述和后果关系。
- source_word: כְּשֹׁכֵב / וּכְשֹׁכֵב
  choice: 像躺……的人／又像躺……的人
  rationale: 分词描述躺卧的状态，并不必然表示睡着；重复译出，以保留希伯来语的平行结构。
- source_word: בְּלֶב יָם
  choice: 在海心
  rationale: לֵב 字面为“心”，在此指海的中央；“海心”既保留原文的鲜明意象，也能为现代汉语读者理解。
- source_word: בְּרֹאשׁ
  choice: 顶端
  rationale: רֹאשׁ 可指“头”或“顶部”；在航海图景中，“顶端”自然表达高处的危险位置。
- source_word: חִבֵּל
  choice: 桅杆
  rationale: 此词在本处词义不确定，与绳索、船上索具或相关航海设备有关；结合“顶端”以及传统语境理解，正文采用自然明确的“桅杆”，并以脚注保留其他可能。
