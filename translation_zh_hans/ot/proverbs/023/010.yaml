  yaml_path: translation/ot/proverbs/023/010.yaml
  text: Do not move an ancient boundary marker[a], and do not enter the fields of orphans,
translation:
  language: zh_hans
  text: 不可挪移古老的地界[a]，也不可进入孤儿的田地。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不可挪移古老的界碑，也不可进入失父者的田地。”
    reason: 词义与表达方式的另一种可能：גְּבוּל 可具体指界碑，יְתוֹמִים 可较直译为“失父者”。
lexical_decisions:
- source_word: תַּסֵּג
  choice: 挪动
  rationale: 该动词在此指挪移既有地界，从而侵占他人产业；“挪动”自然简洁，并保留具体行为。
- source_word: גְּבוּל
  choice: 地界标志
  rationale: 该词本可泛指边界，但在产业与土地的语境中具体指划定地界的标志；译为“地界标志”可清楚表达原文所隐含的实物。
- source_word: עוֹלָם
  choice: 古时的
  rationale: 此处表示从久远年代传下来的，并非形而上的“永恒”；“古时的”符合土地界线的语境。
- source_word: וּ/בִ/שְׂדֵי
  choice: 也不可闯入……的田地
  rationale: 介词 ב 与表示移动的动词连用，表达进入田地；结合禁令语境，“闯入”自然传达未经许可进入并可能侵占的意味。
- source_word: יְתוֹמִים
  choice: 孤儿
  rationale: 该名词尤指失去父亲、缺乏家庭保护的孩子；现代汉语以“孤儿”最简明自然。
- source_word: תָּבֹא
  choice: 闯入
  rationale: 字面义为“来、进入”；在禁止进入弱势者田地的语境中，“闯入”表达非法侵入的语用含义，同时未把具体侵占方式说得过细。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的箴言体。两句以“不可”并列，保留原文禁令的简洁力度；“孤儿”符合当代常用表达。
