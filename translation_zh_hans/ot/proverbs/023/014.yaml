base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/014.yaml
  text: You shall strike him with the rod[b][a], and you will deliver his life from Sheol.
translation:
  language: zh_hans
  text: '你要用杖打他；

    你必救他的性命[a]脱离阴间[b]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“他的魂”。希伯来语“尼非希”可按语境指生命、自我或魂。
    reason: lexical_alternative
  - marker: b
    text: “阴间”是希伯来语对死者所在之处的称呼；也可译“坟墓”或“死者之境”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּשֵּׁבֶט
  choice: 用杖
  rationale: שֵׁבֶט可指杖、棍或权杖；在管教孩子的语境中，“杖”既保留具体器具，也符合庄重的箴言文体。
- source_word: תַּכֶּנּוּ
  choice: 打他
  rationale: נכה的使役式在此直接表示击打；“打”是现代汉语中自然、准确的表达，没有用较抽象的“管教”取代原文所说的动作。
- source_word: נַפְשׁוֹ
  choice: 他的性命
  rationale: נֶפֶשׁ可指生命、自我或魂；与“脱离阴间”相连时，“性命”自然表达免于死亡的意思，同时用脚注保留“魂”的可能译法。
- source_word: מִשְּׁאוֹל
  choice: 脱离阴间
  rationale: שְׁאוֹל指死者所在之处；“阴间”是中文圣经语境中简洁且较能保留希伯来概念的表达，不把它缩减为单指坟墓。
- source_word: תַּצִּיל
  choice: 就能救……脱离
  rationale: נצל的使役式意为解救、搭救；“救……脱离”准确呈现其结构，并使上下两行之间的箴言性结果关系自然清楚。
theological_decisions:
- issue: נֶפֶשׁ与阴间的关系
  choice: 他的性命
  alternative: 他的魂
  rationale: 本节以箴言方式说，管教能使孩子免于通向死亡或毁灭的道路。“性命”保留这一语境意义，又不据此强行确定身心或灵魂的教义；脚注保留“魂”这一词义可能。
- issue: שְׁאוֹל的所指
  choice: 阴间
  alternative: 坟墓／死者之境
  rationale: 保留死者所在领域这一较宽的希伯来概念，避免把它限定为实体坟墓，也不把经文本身未明说的末世论细节加进译文。
translation_notes:
  register: 采用现代、庄重而易懂的箴言体，两行对应清楚。以“你要……就能……”表达希伯来语未完成式在劝诫语境中的指令与结果；不将“杖”抽象化为一般管教，也不把“阴间”解释成某一特定宗派的死后世界观。
