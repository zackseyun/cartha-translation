  text: כִּי סֹבֵ֣א וְ֭/זוֹלֵל יִוָּרֵ֑שׁ וּ֝/קְרָעִ֗ים תַּלְבִּ֥ישׁ נוּמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/021.yaml
  text: For the drunkard and the glutton will come to poverty[a], and drowsiness will clothe one with rags.
translation:
  language: zh_hans
  text: 因为嗜酒者和贪食者必陷入贫穷，困倦[a]会使人衣衫褴褛。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“沉睡会使人衣衫褴褛”。希伯来词“נוּמָה”既可指“困倦”，也可指“沉睡”。
    reason: lexical_alternative
lexical_decisions:
- source_word: סֹבֵא
  choice: 嗜酒者
  rationale: 该名词指惯于过量饮酒的人，而不只是暂时喝醉的人；“嗜酒者”简洁自然，也保留其习惯性特征。
- source_word: זוֹלֵל
  choice: 贪食者
  rationale: 在此智慧文学语境中，该词指放纵食欲、挥霍无度的人；与“嗜酒者”并列时，“贪食者”最贴合上下文。
- source_word: יִוָּרֵשׁ
  choice: 必陷入贫穷
  rationale: 此处是ירש的尼法勒形态，表达变得贫穷的结果，并非特指土地被夺；“陷入贫穷”自然地传达这一后果。
- source_word: קְרָעִים
  choice: 衣衫褴褛
  rationale: 该复数名词指破衣或碎布；“衣衫褴褛”既形象又符合现代汉语，表现贫困所造成的窘迫。
- source_word: תַּלְבִּישׁ
  choice: 会使人衣衫……
  rationale: 该使役形态意为“使穿上、给……穿上”；译文保留“困倦使人穿上破衣”的拟人化因果意象，同时使汉语表达自然。
- source_word: נוּמָה
  choice: 困倦
  rationale: 该名词可指困倦、睡意或沉睡；正文采用“困倦”，突出导致疏懒与贫穷的状态，同时以脚注保留“沉睡”的可能译法。
theological_decisions: []
