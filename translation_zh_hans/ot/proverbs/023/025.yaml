  yaml_path: translation/ot/proverbs/023/025.yaml
  text: Let your father and your mother be glad[a], and let her who gave birth to you rejoice.
translation:
  language: zh_hans
  text: 愿你的父亲和母亲欢喜，愿生你的母亲欢欣。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִשְׂמַח
  choice: 愿……欢喜
  rationale: 该词为שׂמח的Qal未完成式，在此表达祝愿或劝勉；“愿……欢喜”既准确又符合现代汉语表达。
- source_word: אָבִיךָ וְאִמֶּךָ
  choice: 你的父亲和母亲
  rationale: 保留原文并列结构及第二人称单数所属关系，不简缩为“父母”，以维持诗句的节奏和对父母双方的明确指称。
- source_word: וְתָגֵל
  choice: 愿……欢欣
  rationale: גיל常表示洋溢、跃动的喜悦；“欢欣”与前句“欢喜”形成词汇区别，并传达较强的喜乐色彩。
- source_word: יוֹלַדְתֶּךָ
  choice: 生你的母亲
  rationale: 该阴性单数形式指生育受话者的女性，即其母亲；译为“生你的母亲”自然清楚，也保留原文对母亲的重复强调。
