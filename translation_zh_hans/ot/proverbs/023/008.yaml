    issue: “悦耳的话”语义稍偏向听觉效果。
    rationale: נְעִימִים用于言语时可指可喜、和气或讨人喜欢的话；“好听的话”在现代汉语中覆盖面更接近，且不预设说话者虚伪。
  - severity: low
    issue: “也都白说了”在形式上像既成结果。
    rationale: 上下文的动词链表达预期的后果；“也都会白费”更明确地与“必会吐出来”并列，同时保留徒然耗费言辞的意思。
  revised_text: 你吃下的那一口，必会吐出来；你那些好听的话，也都会白费。[a]
