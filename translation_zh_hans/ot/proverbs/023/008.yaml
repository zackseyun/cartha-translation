  text: You will vomit up the morsel you have eaten[a], and you will waste your pleasant words.
translation:
  language: zh_hans
  text: 你吃下的那一口，必会吐出来；你那些好听的话，也都会白费。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “好听的话”也可译作“悦耳的话”或“和气的话”。
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּתְּךָ
  choice: 你吃下的那一口
  rationale: פַּת 指一小块或一口食物；结合第二人称单数后缀和紧接的 אָכַלְתָּ，译为“你吃下的那一口”自然、简洁，也不限定为饼。
- source_word: אָכַלְתָּ
  choice: 吃下的
  rationale: 这是“吃”的 Qal 完成式第二人称阳性单数，表示已经吃下的食物；汉语定语结构“吃下的”自然体现动作已经完成。
- source_word: תְקִיאֶנָּה
  choice: 终必吐出来
  rationale: קיא 在此明确指呕吐，阴性宾语后缀回指 פַּת。“吐出来”保留原文强烈而具体的意象；“终必”在箴言的结果陈述中自然表达未然结果。
- source_word: וְשִׁחַתָּ
  choice: 也都白说了
  rationale: שׁחת 在这里表达先前所说的话归于徒然、毫无益处。直译为“毁坏你的话”在现代汉语中生硬；“白说了”准确传达枉费言语的实际结果。
- source_word: דְּבָרֶיךָ
  choice: 你那些……话
  rationale: 保留第二人称所属关系和复数语意，并以现代汉语自然表达。
- source_word: הַנְּעִימִים
  choice: 悦耳的
  rationale: נעים 表示令人愉悦、可喜、合意；修饰言语时，“悦耳”自然保留其正面而略带讨好意味的语感。脚注列出“甜言美语／和气的话”等可行理解。
theological_decisions: []
translation_notes:
  register: 采用简洁有力的现代标准汉语，保留箴言中“吃下—吐出”与“说话—白说”的因果和讽刺力度。为避免脚注误附于“吐出来”，标记置于全句末尾；脚注所释对象明确写出。
