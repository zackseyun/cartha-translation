- from: 你吃下的那一口，终必吐出来；你那些悦耳的话，也都白说了。[a]
  to: 你吃下的那一口，必会吐出来；你那些好听的话，也都会白费。[a]
  rationale: 小幅调整用语，使言语的‘可喜、讨人喜欢’之意更自然，并使两分句的未来结果关系更清晰；未改变原文的食物被吐出和言语徒然耗费的讽刺性平行。
