  text: The father of a righteous man will greatly rejoice[b][a]; he who fathers a wise son will be glad in him.
translation:
  language: zh_hans
  text: 义人的父亲必大大喜乐[a]；生有智慧儿子的父亲必因他欢喜[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“义人的父亲，喜乐，他必喜乐”。动词的重复形式加强喜乐的语气。
    reason: lexical_alternative
  - marker: b
    text: 或译“生智慧者的父亲必因他欢喜”。本行原文没有明说“儿子”，但上下文的亲子关系强烈暗示其意。
    reason: lexical_alternative
lexical_decisions:
- source_word: גול יגול
  choice: 必大大喜乐
  rationale: 原文以不定式绝对形配合未完成式加强语气；“必大大喜乐”在现代汉语中自然地表达这种强调。
- source_word: אֲבִי צַדִּיק
  choice: 义人的父亲
  rationale: 保留原文的属格结构和阳性单数所指；下半句的亲子语境表明这里指一个义人之父。
- source_word: צַדִּיק
  choice: 义人
  rationale: “义人”是圣经汉语中自然且明确的道德类别用语，也保留单数个人所指。
- source_word: יולד
  choice: 生养……的人
  rationale: 该阳性分词在此指为父、生育者；“生养”比“生出”更自然庄重，也符合父子语境。
- source_word: חָכָם
  choice: 智慧之子
  rationale: 原文只明说“智慧者”，未重复“儿子”；结合父亲与生育语境，正文补出“子”以求清楚，同时用脚注保存原文的省略。
- source_word: וישמח בו
  choice: 必因他欢喜
  rationale: 既表达 שמח 的喜乐，也自然呈现 בּוֹ 可表示因他而欢喜的关系；避免生硬的“在他里面欢喜”。
