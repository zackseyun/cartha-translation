base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/026.yaml
  text: My son[a], give me your heart, and let your eyes delight in my ways.
translation:
  language: zh_hans
  text: 我儿，把你的心交给我；愿你的眼睛喜爱我的道路。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“愿你的眼睛留心我的道路。”这里的希伯来语动词可表示带着认同的关注，也可强调喜爱、悦纳。
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּנָה
  choice: 交给
  rationale: 这是 נתן 的祈使式，意为“给”。结合宾语“心”和接受者“我”，现代汉语用“把……交给我”自然、直接，也保留郑重托付之意。
- source_word: בְנִי
  choice: 我儿
  rationale: 保留希伯来文阳性单数呼语及第一人称所属关系；“我儿”简洁、庄重，符合智慧文学中父亲教导儿子的语境。
- source_word: לִבְּךָ
  choice: 你的心
  rationale: “心”在希伯来语中可指人的内在自我、意志与情感。直译既符合现代汉语习惯，也保留原文意象。
- source_word: לִי
  choice: 给我
  rationale: 介词 לְ 标示给予的对象；在“把你的心交给我”中以“给我”自然表达。
- source_word: וְעֵינֶיךָ
  choice: 愿你的眼睛
  rationale: 后接意愿式动词；“愿”表达劝勉、期盼的语气，同时保留“眼睛”这一具体意象。
- source_word: דְּרָכַי
  choice: 我的道路
  rationale: דֶּרֶךְ 在智慧文学中常指道路，也引申为生活方式或行为准则；“道路”保留原文比喻及其多层含义。
- source_word: תרצנה
  choice: 喜爱
  rationale: 按马所拉文本读作 רצה 的形式，可表达悦纳、喜爱或乐意。“喜爱”兼具关注、认同和欣然接受之意，且与主语“眼睛”在汉语中仍可自然理解为看重并倾心于某种道路。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的父子劝诫语体。“我儿”保留原文性别明确的称呼；分号呈现两个彼此紧密相连的劝勉。脚注保留末句动词在“喜爱、悦纳”与“留心、关注”之间的词义张力。
