  text: אַל תֵּ֥רֶא יַיִן֮ כִּ֪י יִתְאַ֫דָּ֥ם כִּֽי יִתֵּ֣ן ב/כיס עֵינ֑/וֹ יִ֝תְהַלֵּ֗ךְ בְּ/מֵישָׁרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/031.yaml
  text: Do not look at wine when it is red[a], when it sparkles in the cup[b], when it goes down smoothly.
translation:
  language: zh_hans
  text: 不要注视那泛着红色、在杯中闪耀[a]、又顺畅地下咽[b]的葡萄酒。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“在杯中给出它的眼睛”，是形容酒在杯中显得诱人的希伯来语说法。
    reason: lexical_alternative
  - marker: b
    text: 或译“沿着平直之处行走”；这里指酒容易而顺滑地喝下去。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תֵּרֶא
  choice: 不要盯着
  rationale: אַל加未完成式表达禁止；在这里，ראה不只是被动地“看见”，而是有意注视酒诱人的外观，因此译为“不要盯着”。
- source_word: יַיִן
  choice: 葡萄酒
  rationale: 这是希伯来语中表示酒的常用词；“葡萄酒”在现代汉语中明确、自然。
- source_word: כִּי יִתְאַדָּם
  choice: 看它怎样发红
  rationale: התפעל形式在此表示呈现红色；连续的כִּי从句描绘酒吸引人的样子，译作“怎样”可自然衔接“不要盯着……看”，同时保留情境性。
- source_word: כִּי יִתֵּן בַּכּוֹס עֵינוֹ
  choice: 怎样在杯中显出光彩
  rationale: 字面为“在杯中显出它的眼睛”，是描写酒视觉吸引力的诗性说法；“显出光彩”传达其观感，又由脚注保留原文意象。
- source_word: יִתְהַלֵּךְ בְּמֵישָׁרִים
  choice: 又怎样顺畅地下咽
  rationale: 字面意象是“按平直之处行走”；在饮酒语境中，指酒入口后容易、顺滑地流下。“顺畅地下咽”是自然的现代汉语表达，脚注说明其字面可能性。
theological_decisions: []
