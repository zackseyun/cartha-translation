base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/020.yaml
  text: Do not be among heavy drinkers of wine[a], among gluttonous eaters of meat,
translation:
  language: zh_hans
  text: 不要与酗酒的人为伍，也不要与贪吃肉的人为伍。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 句末的希伯来语“לָמוֹ”句法较难确定。也可能译作：“与那些为自己大吃肉食的人为伍”；这个词也可能只是加强语气，并未增添独立的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תְּהִי
  choice: 不要……为伍
  rationale: אַל加未完成式/祈使式表达禁止；这里的“是/处于”结合介词בְ，语境上指置身某类人的圈子、与之交往。译作“不要……为伍”自然传达这一关联含义。
- source_word: בְסֹבְאֵי יָיִן
  choice: 与酗酒的人
  rationale: בְ表示同处或交往；סֹבְאֵי为复数分词，指惯常过量饮酒者；יַיִן明确所饮的是酒。“酗酒的人”保留过量和习惯性的含义。
- source_word: בְזֹלֲלֵי בָשָׂר
  choice: 与贪吃肉的人
  rationale: זֹלֲלֵי是复数分词，表示挥霍无度、过量进食；בָשָׂר在此指作为食物的肉。“贪吃肉的人”既明确对象，也保留其惯常行为的色彩。
- source_word: לָמוֹ
  choice: 不在正文中单独译出
  rationale: 句末לָמוֹ的句法困难，可能是与前语连用或起强调作用。正文采用通顺而不额外释义的表达，并在脚注中保留“为自己”的可能性。
