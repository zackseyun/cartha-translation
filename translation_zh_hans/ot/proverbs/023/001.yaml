  yaml_path: translation/ot/proverbs/023/001.yaml
  text: When you sit down to dine with a ruler[a], carefully consider what is before you.
translation:
  language: zh_hans
  text: 你若与掌权者同席而食，就要仔细辨明你面前的是什么。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或可特指“摆在你面前的食物”。原文也可能指你眼前更广泛的处境。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 若
  rationale: 此处引出智慧训诲中的情境或条件，不是表示原因；“若”自然保留条件意味。
- source_word: תֵשֵׁב לִלְחוֹם
  choice: 一同坐席
  rationale: 原文直指坐下吃饭；中文“坐席”自然、庄重地表达正式赴宴的场景，并与后面的掌权者相配。
- source_word: אֶת־מוֹשֵׁל
  choice: 与掌权者
  rationale: מוֹשֵׁל指行使权柄的人；“掌权者”比特定官职更宽泛，也符合原词。此处אֶת在吃饭语境中表达共同参与。
- source_word: בִּין תָּבִין
  choice: 要仔细留意
  rationale: 不定式绝对形与限定动词连用，加强分辨、理解的语气；“仔细留意”既传达强调，也适合宴席中审慎观察的语境。
- source_word: אֶת אֲשֶׁר לְפָנֶיךָ
  choice: 摆在你面前的是什么
  rationale: 此表达可直接指面前陈设的食物，也可暗含眼前整个处境；该译法首先保留餐桌意象，同时不完全排除较宽的含义。
theological_decisions: []
