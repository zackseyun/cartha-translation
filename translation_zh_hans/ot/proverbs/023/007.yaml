  text: כִּ֤י כְּמוֹ שָׁעַ֥ר בְּ/נַפְשׁ֗/וֹ כֶּ֫ן ה֥וּא אֱכֹ֣ל וּ֭/שְׁתֵה יֹ֣אמַר לָ֑/ךְ וְ֝/לִבּ֗/וֹ בַּל עִמָּֽ/ךְ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/007.yaml
  text: 'For as he calculates within himself[a], so he is: “Eat and drink,” he says to you, but his heart is not with you.'
translation:
  language: zh_hans
  text: 因为他心里怎样盘算，他就是怎样的人[a]。他对你说：“吃吧，喝吧！”他的心却不在你这边。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为他心里怎样思想，他就是怎样的人。”希伯来语动词可指“思想”，但更具体地带有计算、估量或盘算的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文对吝啬之人的警告，说明不可贪吃其食物的缘由。
- source_word: כְּמוֹ...כֶּן
  choice: 怎样……就是怎样
  rationale: 保留希伯来文的比较对应结构，同时使现代汉语自然流畅。
- source_word: שָׁעַר
  choice: 盘算
  rationale: 该动词带有计算、估量之意；此处指主人暗自在心中计较花费，比泛指“思想”更贴合语境。
- source_word: בְּנַפְשׁוֹ
  choice: 心里
  rationale: 这里的 נֶפֶשׁ 指人的内在自我；“心里”自然表达其隐秘的内在盘算，不赋予技术性的灵魂含义。
- source_word: כֶּן הוּא
  choice: 他就是怎样的人
  rationale: 表达其内在盘算显明真实为人的意思，也保留原文简洁的箴言式判断。
- source_word: אֱכֹל וּשְׁתֵה
  choice: 请吃，请喝
  rationale: 保留两个命令式邀请；加入“请”符合汉语待客话语，也突显表面热情与内心态度的反差。
- source_word: יֹאמַר לָךְ
  choice: 他对你说
  rationale: 采用箴言体常用的一般现在表达，直接引出主人所说的话。
- source_word: וְלִבּוֹ
  choice: 他的心却
  rationale: 连词在此具有转折作用，反衬口头邀请与真实内心并不一致。
- source_word: בַּל
  choice: 不
  rationale: 以现代汉语常用否定词简洁传达原文否定。
- source_word: עִמָּךְ
  choice: 与你相契
  rationale: 原文直译为“与你同在”；此处表示内心并不真诚地与你一致或亲近。“相契”保留关系性含义，并避免误解为仅仅不在场。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的箴言体。以“盘算”呈现主人暗中计较的语境；“与你相契”表达其内心并非真诚向着客人，同时避免把“心”处理为专门的神学术语。
