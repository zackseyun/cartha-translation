  text: הָבִ֣יאָ/ה לַ/מּוּסָ֣ר לִבֶּ֑/ךָ וְ֝/אָזְנֶ֗/ךָ לְ/אִמְרֵי דָֽעַת־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/012.yaml
  text: Apply your heart to instruction[a], and your ear to words of knowledge.
translation:
  language: zh_hans
  text: 要专心领受管教，侧耳听知识的言语。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“把你的心带到管教中，把你的耳朵转向知识的言语。”
    reason: 保留 הָבִיאָה“带来、使来到”的字面意象，以及“你的心”和“你的耳朵”的平行结构。
lexical_decisions:
- source_word: הָבִיאָה
  choice: 要……领受
  rationale: 该使役命令式字面为“带来、使来到”，在这里要求人主动使内心转向某事。现代汉语用“要专心领受”自然地表达这种有意识的投入，同时保留劝诫语气。
- source_word: לַמּוּסָר
  choice: 管教
  rationale: מוּסָר兼有教导、训诫、纠正和纪律塑造之意。箴言中“管教”较能保留其塑造与纠正的力度，而不只表示知识传授。
- source_word: לִבֶּךָ
  choice: 专心
  rationale: 希伯来文直译为“你的心”，所指包括思想、意志与内在取向。主句采用汉语惯用的“专心”表达把心投入其中的意思；脚注保留原文意象。
- source_word: וְאָזְנֶךָ
  choice: 侧耳听
  rationale: 原文为单数“你的耳朵”。“侧耳听”是自然、庄重的现代汉语说法，保留主动倾听的身体意象。
- source_word: לְאִמְרֵי
  choice: ……的言语
  rationale: אִמְרֵי为“话语、言说”的复数构造形式。“言语”符合智慧文学语体，也准确反映其复数集合意义。
- source_word: דָעַת
  choice: 知识
  rationale: דַּעַת最直接的对应是“知识”；在智慧文学中也含认识和明辨之意，但此处不宜以“悟性”等词缩窄或改释。
theological_decisions: []
translation_notes:
  register: 采用现代、简洁而庄重的劝诫语体。“专心领受……侧耳听……”形成自然的汉语平行句，同时由脚注呈现希伯来文较具体的身体意象和可保留的直译。
