  text: הִכּ֥וּ/נִי בַל חָלִיתִי֮ הֲלָמ֗וּ/נִי בַּל יָ֫דָ֥עְתִּי מָתַ֥י אָקִ֑יץ א֝וֹסִ֗יף אֲבַקְשֶׁ֥/נּוּ עֽוֹד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/035.yaml
  text: “They struck me[a], but I was not hurt; they beat me, but I did not know it[b]. When shall I awake? I will seek it again.”
translation:
  language: zh_hans
  text: “他们打我，我却没有受伤；他们揍我，我也毫无察觉。[a]什么时候我才会醒来？我还要再找它。[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本句也可译作：“他们打我，我却不觉得疼；他们揍我，我也没有察觉。”希伯来文在“受伤、疼痛”和“知道、察觉”之间容许不同的语感。
    reason: lexical_alternative
  - marker: b
    text: “它”按上下文最可能指酒或烈酒。
    reason: cross_reference
lexical_decisions:
- source_word: הִכּוּנִי
  choice: 他们打我
  rationale: נכה表示击打；译作“打我”自然直接，也与下句较强的“揍我”形成用词变化。
- source_word: בַל חָלִיתִי
  choice: 我却没有受伤
  rationale: חלה可指患病、衰弱、受伤或感到疼痛；在遭受击打的语境中，“没有受伤”保留身体受损的含义，其他可能语感在脚注说明。
- source_word: הֲלָמֻנִי
  choice: 他们揍我
  rationale: הלם指重击、击打；“揍我”比前句“打我”略强，既保留平行结构，也反映希伯来文动词的变化。
- source_word: בַל יָדָעְתִּי
  choice: 我竟毫无知觉
  rationale: ידע基本义为知道；此处醉酒者对所受击打毫无察觉。“毫无知觉”以自然中文表达这种因醉酒而不知情的状态。
- source_word: מָתַי אָקִיץ
  choice: 我什么时候才会醒来
  rationale: קיץ在此指醒来；保留字面的睡醒意象，不解释为“清醒过来”或“恢复理智”。“才会”自然传达问句中对醒来时刻的追问。
- source_word: אוֹסִיף אֲבַקְשֶׁנּוּ עוֹד
  choice: 我还要再去找它
  rationale: יסף与עוד共同表达继续或再次，בקש表示寻找；第三人称阳性单数后缀按上下文译作“它”，最可能指酒或烈酒，但不在正文中明说。
theological_decisions: []
translation_notes:
  register: 采用现代、自然而庄重的口语引述，表现醉酒者对殴打麻木无觉、醒后仍要寻酒的自述。正文保留“它”的指代，不把上下文推断直接写入经文。
