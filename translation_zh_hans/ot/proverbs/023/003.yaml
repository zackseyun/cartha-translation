  text: אַל תִּ֭תְאָו לְ/מַטְעַמּוֹתָ֑י/ו וְ֝/ה֗וּא לֶ֣חֶם כְּזָבִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/003.yaml
  text: Do not crave his delicacies[a], for they are deceptive food.
translation:
  language: zh_hans
  text: 不要贪恋他的美味，因为那是骗人的食物。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译：“谎言的饼（或食物）”。
    reason: 保留לֶחֶם כְּזָבִים的字面表达及“饼/食物”的词义范围。
lexical_decisions:
- source_word: אַל תִּתְאָו
  choice: 不要贪恋
  rationale: אַל与未完成式构成禁令；“不要贪恋”既表达禁止，也保留תִּתְאָו所含强烈欲望的意味。
- source_word: לְמַטְעַמּוֹתָיו
  choice: 他的美味
  rationale: מַטְעַמּוֹת指可口的佳肴或珍馐美味；“美味”自然简洁，并能涵盖席上的各种佳肴。
- source_word: וְהוּא
  choice: 因为那是
  rationale: 原文形式为单数“而它/那是”，回指前面的美味；上下文中后句说明禁戒的理由，因此将连词按因果关系译为“因为”。
- source_word: לֶחֶם כְּזָבִים
  choice: 骗人的食物
  rationale: לֶחֶם可泛指食物，כְּזָבִים字面为“谎言/虚假”，合起来指带有欺骗性、并非表面所显的食物；正文采用自然现代汉语，同时以脚注保留原文意象。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而通俗的劝诫语气。“贪恋”比普通的“想吃”更能体现内心强烈欲望；“骗人的食物”保留警戒中的含混性，不擅自断定欺骗的具体方式。
