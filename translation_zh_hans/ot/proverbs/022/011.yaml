base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/011.yaml
  text: He who loves purity of heart[b][a], and whose speech is gracious—the king is his friend.
translation:
  language: zh_hans
  text: 喜爱内心纯洁、言语温雅[a]的人，君王[b]是他的朋友。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 更直译：“他的嘴唇有恩惠。”
    reason: 保留שְׂפָתָיו的“嘴唇”意象及חֵן的名词表达。
  - marker: b
    text: 或译：“一位君王是他的朋友。”
    reason: 原文“君王”无冠词，也可作不定、泛指理解。
lexical_decisions:
- source_word: אֹהֵב
  choice: 喜爱……的人
  rationale: Qal主动分词在此作名词用，泛指具有这种品格的人；中文用“喜爱……的人”自然表达其箴言式普遍意义。
- source_word: טהור לֵב
  choice: 内心纯洁
  rationale: 直译近于“心纯洁”；这里描述人内在的纯正状态。“内心纯洁”既贴近原文，又符合现代汉语表达。
- source_word: חֵן שְׂפָתָיו
  choice: 言语温雅
  rationale: 原文直译为“他的嘴唇有恩泽／可喜之处”，以“嘴唇”转指言语。正文用“言语温雅”传达话语亲切、可喜、得体的性质，并在脚注保留原文意象。
- source_word: רֵעֵהוּ
  choice: 是他的朋友
  rationale: רֵעַ可指朋友、同伴；无动词名词句在中文中自然补出“是”。代词所指为前述具有纯洁内心和温雅言语的人。
- source_word: מֶלֶךְ
  choice: 君王
  rationale: 原文名词无冠词，可理解为特指或泛指。正文采用自然且庄重的“君王”，不额外添加量词；脚注说明也可明确译作“一位君王”。
theological_decisions:
- issue: מֶלֶךְ的确定性
  choice: 君王
  alternative: 一位君王
  rationale: 希伯来语无冠词，箴言体中既可泛指王者，也可在语境中理解为“那君王”。中文裸名词“君王”适度保留这种开放性，脚注列出明确的不定读法。
translation_notes:
  register: 采用现代、简洁而庄重的箴言体。“内心纯洁”表达内在品格，“言语温雅”使普通读者易懂；脚注保留希伯来语较具体的“嘴唇”意象及“君王”定指与不定指之间的含混。
