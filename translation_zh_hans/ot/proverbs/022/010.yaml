  yaml_path: translation/ot/proverbs/022/010.yaml
  text: Drive out a scoffer[a], and strife will go out[b]; judgment and disgrace will cease.
translation:
  language: zh_hans
  text: 赶走嘲讽者[a]，纷争就会离去；争执[b]和羞辱也会止息。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“讥诮者”。希伯来语 לֵץ 是智慧文学中的常用称谓，指狂傲地嘲讽并抗拒劝诫和智慧的人。
    reason: lexical_alternative
  - marker: b
    text: “争执”所译的希伯来语 דִּין 在这里可指争执或纠纷；在别处也可指“审判”或“案件”。
    reason: lexical_alternative
lexical_decisions:
- source_word: גָּרֵשׁ
  choice: 赶走
  rationale: 这是阳性单数祈使式，表示强行使人离开。“赶走”在现代汉语中自然有力，保留了驱逐之意。
- source_word: לֵץ
  choice: 好讥诮的人
  rationale: 这是《箴言》的典型智慧文学用语，指狂傲地嘲讽并抗拒劝诫和智慧的人。“好讥诮的人”既表达其惯常特征，也避免仅理解为偶尔开玩笑的人。
- source_word: מָדוֹן
  choice: 纷争
  rationale: 该词指争吵、冲突或不和。“纷争”简洁自然，并适合与“离去”搭配。
- source_word: וְיֵצֵא
  choice: 就会离去
  rationale: 虽在形式上是未完成式，但在祈使句之后表达预期结果；“就会”清楚呈现这种因果关系。
- source_word: דִּין
  choice: 争讼
  rationale: 该词可指审判、案件或争执；本节与“纷争”平行，语境较支持争执或诉讼纠纷之意。“争讼”保留了人际冲突及可能的司法色彩。
- source_word: וְיִשְׁבֹּת
  choice: 也会止息
  rationale: 源自动词 שׁבת，意为停止、止息。“止息”简洁庄重，并与本句的格言体相称。
- source_word: קָלוֹן
  choice: 羞辱
  rationale: 该词表示羞耻、耻辱或不光彩。“羞辱”在此可指纷争所带来的社会性耻辱，与“争讼”构成自然并列。
theological_decisions: []
