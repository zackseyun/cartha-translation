  text: He who has a generous eye will be blessed[a], for he gives some of his bread to the poor.
translation:
  language: zh_hans
  text: 慷慨的人必蒙福[a]，因为他把自己的食物分给穷人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“有好眼的人”或“眼目良善的人”；这是表示慷慨、乐于施与的习语。
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב עַיִן
  choice: 眼目仁厚的人
  rationale: 希伯来语直译为“眼目良善”，是表示慷慨、乐于施与的习语。译作“眼目仁厚的人”既保留“眼目”的原文意象，也使现代读者能从“仁厚”领会其慷慨之意。
- source_word: יְבֹרָךְ
  choice: 必蒙福
  rationale: 原文是被动式，表示此人将蒙受福分；“必蒙福”符合汉语箴言的凝练语气，同时不明确限定赐福者。
- source_word: כִּי
  choice: 因为
  rationale: 此处引出前句蒙福的理由；“因为”在现代汉语中清楚自然。
- source_word: נָתַן
  choice: 分给
  rationale: 原文虽采用完成式，但在箴言语境中描写这类人的典型行为。“分给”以现在性的概括表达经常或特有的慷慨行动。
- source_word: מִלַּחְמוֹ
  choice: 把自己的食物分给
  rationale: לֶחֶם本义为“饼、食物”，此处指个人赖以生活的供应；介词מִן带有从其中取出一部分的意味。“把自己的食物分给”自然表达从本人所有中拿出一部分，但不额外断定数量。
- source_word: לַדָּל
  choice: 穷人
  rationale: דַּל可指贫穷、卑微或势弱者；此处接受食物的语境突出经济贫困，译作“穷人”最直接。
