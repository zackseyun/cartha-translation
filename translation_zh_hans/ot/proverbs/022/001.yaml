  text: נִבְחָ֣ר שֵׁ֭ם מֵ/עֹ֣שֶׁר רָ֑ב מִ/כֶּ֥סֶף וּ֝/מִ/זָּהָ֗ב חֵ֣ן טֽוֹב׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/001.yaml
  text: A name is to be chosen rather than great wealth[c][b][a], and favor is better than silver and gold.
translation:
  language: zh_hans
  text: 名声[a]比丰厚的财富更值得选择；得人恩宠[b]胜过金银。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “名声”原文直译为“名”，在这里含有声誉、名誉的意思。
    reason: cultural_note
  - marker: b
    text: “恩宠”也可译作“好感”或“青睐”；原词也可表示恩惠、优雅或讨人喜爱。
    reason: lexical_alternative
lexical_decisions:
- source_word: נִבְחָר
  choice: 更值得选择
  rationale: 该词是 בחר 的尼法勒分词，在这里作谓语，表达价值上的取舍与优先，而不只是陈述“被选择”的状态。
- source_word: שֵׁם
  choice: 名声
  rationale: 原义为“名”，在智慧文学语境中指一个人的社会声誉或名誉。“名声”在现代汉语中自然，并保留了原文的核心意象。
- source_word: מֵעֹשֶׁר רָב
  choice: 比丰厚的财富
  rationale: 介词 מִן 表示比较；רָב 修饰“财富”，可指多量或丰厚。“丰厚的财富”既体现数量与价值，也符合现代汉语表达。
- source_word: חֵן
  choice: 得人恩宠
  rationale: 此处与“名声”平行，较可能指从别人得到的好感、青睐或优待。“得人恩宠”表达所受的有利看待，同时不把该词限定为专门的神学术语。
- source_word: טוֹב
  choice: 胜过
  rationale: 该词字面为“好”，但在省略的比较结构中表示相较之下更好；汉语用“胜过”可清楚补出这一比较关系。
- source_word: מִכֶּסֶף וּמִזָּהָב
  choice: 胜过金银
  rationale: 原文直指银与金，并以 מִן 构成比较。译作“金银”简洁自然，也保留贵重财富的具体形象。
theological_decisions: []
translation_notes:
  register: 采用简洁、对称的箴言体。“更值得选择”保留首句关于取舍的语气，“胜过”则使次句省略的比较关系在现代汉语中清楚自然；分号呈现希伯来诗歌的平行结构。
