  text: עָר֤וּם רָאָ֣ה רָעָ֣ה ו/יסתר וּ֝/פְתָיִ֗ים עָבְר֥וּ וְֽ/נֶעֱנָֽשׁוּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/003.yaml
  text: A prudent man sees danger and hides himself[b][a], but the simple pass on and suffer for it.
translation:
  language: zh_hans
  text: 精明人看见祸患，就躲藏起来[a]；愚蒙人却径直前行，因而受罚[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “祸患”也可译作“恶事”“灾祸”或“危险”。原文既可指道德上的恶，也可指带来伤害的灾难；这里着重于精明人察觉到的威胁。
    reason: lexical_alternative
  - marker: b
    text: “受罚”也可译作“遭受苦果”，指承受自己所走道路带来的后果。
    reason: lexical_alternative
lexical_decisions:
- source_word: עָרוּם
  choice: 精明人
  rationale: 在《箴言》的智慧语境中，此词通常褒指有见识、能审慎判断的人；“精明人”自然地保留了这种积极含义。
- source_word: רָאָה
  choice: 看见
  rationale: 完成式在格言中陈述普遍事实，汉语用“看见”自然，也保留了察觉前方情势的具体意象。
- source_word: רָעָה
  choice: 祸患
  rationale: 此名词既可指道德上的恶，也可指灾祸或伤害；本节重在精明人察觉并避开的威胁性处境。“祸患”保留了原词较宽的灾害含义。
- source_word: ו/יסתר
  choice: 躲藏起来
  rationale: 该动词表达为了自保而隐蔽、退避；“躲藏起来”既贴近原文，又符合现代汉语表达。
- source_word: פְתָיִם
  choice: 愚蒙人
  rationale: 这是《箴言》中指缺乏经验和辨识力之人的典型智慧术语；“愚蒙人”能与“精明人”形成清楚对照。
- source_word: עָבְרוּ
  choice: 径直前行
  rationale: 这里指不采取规避行动而继续往前；“径直前行”明确传达其无视祸患、继续行进的意思。
- source_word: וְנֶעֱנָשׁוּ
  choice: 受罚
  rationale: ענש 的被动式可表示被处罚或承担代价；正文采用较直接的“受罚”，脚注保留“遭受苦果”这一可能，避免抹平词义张力。
theological_decisions:
- issue: וְנֶעֱנָשׁוּ所指是外在惩罚还是行为后果
  choice: 正文译作“受罚”
  alternative: “遭受苦果”或“吃了苦头”
  rationale: 希伯来词可强调处罚，也可在智慧文学语境中指因自己的道路而承受后果。正文保留较正式、直接的处罚含义，脚注说明较宽的结果含义，不断定惩罚的具体施行者。
translation_notes:
  register: 采用现代、庄重而通俗的格言体；两分句结构对称。“精明人”与“愚蒙人”保留《箴言》的智慧人物类型。“祸患”较“危险”更贴近 רָעָה 的宽广语义，脚注交代其歧义；“受罚”与“遭受后果”之间的张力也通过脚注保留。
