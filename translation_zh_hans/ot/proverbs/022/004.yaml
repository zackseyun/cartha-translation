base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/004.yaml
  text: The reward of humility and the fear of Yahweh is wealth and honor and life[a].
translation:
  language: zh_hans
  text: 谦卑和敬畏耶和华所得的赏赐，是财富、尊荣和生命。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“谦卑所得的赏赐，是敬畏耶和华、财富、尊荣和生命。”此译法可能性较小。
    reason: alternative_reading
lexical_decisions:
- source_word: עֵקֶב
  choice: 所得的赏赐
  rationale: 该词可表示结果、后果或报偿；这里引出谦卑与敬畏耶和华所带来的福益。译作“所得的赏赐”既自然，也保留其结果和报偿的意味。
- source_word: עֲנָוָה
  choice: 谦卑
  rationale: 该名词表示谦卑、卑微；“谦卑”是现代汉语中清楚、庄重且符合智慧文学伦理语境的表达。
- source_word: יִרְאַת יְהוָה
  choice: 敬畏耶和华
  rationale: 这是智慧文学的固定观念，兼有畏惧、尊崇与顺服之意；“敬畏”保留了希伯来语的神学分量，而不弱化为单纯的“尊敬”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神名形式“耶和华”，明确其为以色列上帝的专名，而非一般称号。
- source_word: עֹשֶׁר
  choice: 财富
  rationale: 该词指物质上的富足；“财富”是自然、简洁的现代汉语。
- source_word: כָבוֹד
  choice: 尊荣
  rationale: 此处主要指人所获得的尊重、地位和荣誉；“尊荣”比“荣耀”更贴合箴言中的社会语境。
- source_word: חַיִּים
  choice: 生命
  rationale: 该词虽为复数形式，却常作抽象名词表示生命；原文没有明确说“长寿”，因此不加以引申。
theological_decisions:
- issue: “谦卑”与“敬畏耶和华”的句法关系
  choice: 将二者并列，视为带来财富、尊荣和生命的两种品格。
  alternative: 将“敬畏耶和华”与“谦卑”之后的结果并列：谦卑的赏赐是敬畏耶和华、财富、尊荣和生命。
  rationale: 希伯来文高度凝练，两种分析在语法上均有可能。并列理解更符合本句末尾三项福益的结构和箴言常见表达，但替代读法是真实存在的歧义，故收入脚注。
translation_notes:
  register: 采用简洁、庄重、易懂的现代标准汉语，保持箴言式的凝练。主句保留“赏赐”的报偿意味，并用脚注呈现原文中未宜消除的句法歧义。
