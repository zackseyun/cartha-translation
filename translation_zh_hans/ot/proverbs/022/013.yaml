  yaml_path: translation/ot/proverbs/022/013.yaml
  text: The sluggard says[b][a], “There is a lion outside! I will be killed in the streets!”
translation:
  language: zh_hans
  text: 懒惰人说：“外面有狮子！我会在大街上[a]被杀[b]！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“在广场上”或“在宽阔的公共空地上”；希伯来词可指宽阔的公共场所，不只指街道。
    reason: lexical_alternative
  - marker: b
    text: 或译“被谋杀”或“被杀死”；希伯来动词可含遭暴力杀害之意，此处正文采用较自然的“被杀”。
    reason: lexical_alternative
lexical_decisions:
- source_word: עָצֵל
  choice: 懒惰人
  rationale: 该名词在《箴言》中指惯常懒惰的一类人；“懒惰人”自然、简明，并保留格言中典型人物的意味。
- source_word: אֲרִי
  choice: 狮子
  rationale: 按其直接词义翻译；上下文没有要求将其解作隐喻，重点在懒惰人以危险为借口。
- source_word: בַחוּץ
  choice: 外面
  rationale: 指屋外或外边的区域；“外面”与下一分句的公共空间自然衔接。
- source_word: בְּתוֹךְ רְחֹבוֹת
  choice: 在大街上
  rationale: רְחֹבוֹת可指宽阔的街道、公共空地或广场；“在大街上”符合现代汉语表达，也保留身处公共通道中的画面。
- source_word: אֵרָצֵחַ
  choice: 我会被杀
  rationale: רצח的尼法勒未完成式在此具有被动意味，可指遭暴力杀害；“被杀”自然且不额外限定法律意义上的谋杀。
- source_word: אָמַר עָצֵל
  choice: 懒惰人说
  rationale: 希伯来文虽无冠词，但格言体常以单数人物代表一类人；汉语“懒惰人说”可自然表达这种泛指。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的格言体。两个感叹句保留懒惰人夸张推托的语气；不将其借口是否真实在译文中明说。
