  text: lest you learn his ways and take a snare for yourself[a][b].
translation:
  language: zh_hans
  text: 免得你学他的道路，给自己招来网罗[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他的行径”或“他的生活方式”。原文用单数，可指一个人惯常的行为。
    reason: lexical_alternative
  - marker: b
    text: 或译：“给自己的性命招来网罗”或“给自己的灵魂招来网罗”。这里的“性命”很可能指人自身，并非专门论述灵魂。
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּן
  choice: 免得
  rationale: 引出所警戒的负面结果，既贴近希伯来文的劝诫语气，也符合现代汉语表达。
- source_word: תֶּאֱלַף
  choice: 学会
  rationale: 该动词在此指学习并逐渐习惯某种行为模式；“学会”自然简洁，也能体现交往所产生的影响。
- source_word: אָרְחֹתוֹ
  choice: 他的行径
  rationale: 原文为单数，可指一个人惯常走的道路或一贯的行为方式；“行径”保留行为模式之意，并避免机械译作实际道路。
- source_word: וְלָקַחְתָּ
  choice: 给自己套上
  rationale: 原义为“拿、取”，与“网罗”连用时，汉语用“套上”能保留捕捉的意象，也自然表达自招危险。
- source_word: מוֹקֵשׁ
  choice: 网罗
  rationale: 指捕捉用的圈套，并常比喻道德或人生危险；“网罗”具有庄重的智慧文学色彩。
- source_word: לְנַפְשֶׁךָ
  choice: 给自己
  rationale: נֶפֶשׁ在本句主要指整个人或自身，而非对“灵魂”作技术性陈述；“给自己”准确传达反身含义。
