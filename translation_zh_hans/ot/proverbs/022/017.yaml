  text: Incline your ear and hear the words of the wise[a], and set your heart on my knowledge.
translation:
  language: zh_hans
  text: 你要侧耳，听智慧人的话；也要将心专注于我的知识[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“也要专心领受我的教导”。希伯来原文直译为“向着我的知识”，既可能指说话者所拥有的知识，也可能引申为这种知识所传达的教导。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַט אָזְנְךָ
  choice: 你要侧耳
  rationale: הַט是使役形命令式，含有“使……倾斜、转向”之意；与单数的“耳”连用，描绘主动留心聆听的动作。中文“侧耳”自然保留了这一比喻。
- source_word: וּשְׁמַע
  choice: 听
  rationale: שׁמע既可指听见，也常含认真听从之意。译作“听”既保留与“侧耳”的递进关系，也不把两个动作合并为一个。
- source_word: דִּבְרֵי חֲכָמִים
  choice: 智慧人的话
  rationale: דִּבְרֵי是“话、言语”的复数构造形，חֲכָמִים指“有智慧的人”。“智慧人”符合箴言的文体，也不额外限定性别。
- source_word: וְלִבְּךָ תָּשִׁית
  choice: 也要将心专注于
  rationale: לֵב指人的思想、意志与内在倾向；תָּשִׁית意为“放置、安放”。“将心专注于”保留“心”的意象和有意识定向的意味，同时符合现代汉语表达。
- source_word: לְדַעְתִּי
  choice: 我的知识
  rationale: 该词由介词לְ、名词“知识”及第一人称单数后缀组成，字面为“向着/为了我的知识”。正文保留“我的知识”，不把它直接解释为“教导”；较动态的理解置于脚注。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“侧耳”保留希伯来语的身体意象；“将心专注于”兼顾原文“安放内心”的表达与现代汉语的自然度。脚注标记置于实际存在词义歧义的“我的知识”之后。
