  text: זוֹרֵ֣עַ עַ֭וְלָה יקצור אָ֑וֶן וְ/שֵׁ֖בֶט עֶבְרָת֣/וֹ יִכְלֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/008.yaml
  text: Whoever sows injustice will reap trouble[b][a], and the rod of his fury will come to an end.
translation:
  language: zh_hans
  text: 播种不义的，必收割祸患[a]；他暴怒的杖必归于无有[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “祸患”或译“灾祸”、“苦楚”。希伯来语 אָוֶן 在这里可指不义所带来的有害后果或痛苦。
    reason: lexical_alternative
  - marker: b
    text: “他暴怒的杖必归于无有”也可译作“他忿怒的杖必止息”。这句话可能是说，作恶者凭怒气施行压迫的力量终必消逝。
    reason: alternative_reading
lexical_decisions:
- source_word: זוֹרֵעַ
  choice: 播种……的
  rationale: 阳性单数主动分词在箴言中作泛指；保留播种与收割的农业比喻，并自然表达一类人的行为。
- source_word: עַוְלָה
  choice: 不义
  rationale: 此词指不公、不正或恶行；“不义”简洁庄重，既有道德分量，也不把含义缩窄为某一种具体罪行。
- source_word: יקצור
  choice: 必收割
  rationale: 未完成体在箴言的因果陈述中表达必然结果；“必”体现格言式后果，同时保留“收割”意象。
- source_word: אָוֶן
  choice: 祸患
  rationale: 此词可指祸害、灾难、愁苦，也可带有恶的意味；这里作为不义的收成，“祸患”自然地表达有害后果而不过度限定。
- source_word: וְשֵׁבֶט
  choice: 杖
  rationale: שֵׁבֶט 可指杖、棍或权杖；在此象征施打、压迫或支配的力量，“杖”保留原文开放的形象。
- source_word: עֶבְרָתוֹ
  choice: 他暴怒的
  rationale: עֶבְרָה 通常表示烈怒、暴怒；属格结构直译为“他暴怒的杖”，保留其可指由怒气驱动之暴力或权势的张力。
- source_word: יִכְלֶה
  choice: 必归于无有
  rationale: כלה 可表示完结、耗尽或消逝；“归于无有”自然表达这杖及其力量最终消失，同时不明确指定行动者。
theological_decisions:
- issue: 末句 וְשֵׁבֶט עֶבְרָתוֹ יִכְלֶה 的指向
  choice: “他暴怒的杖必归于无有”指作恶者凭怒气施行暴力或压迫的工具与力量终必消逝。
  alternative: 也可理解为“他忿怒的杖必止息”或“他傲慢的杖必消失”。
  rationale: 马所拉文本最自然地把 עֶבְרָתוֹ 理解为“他的暴怒／忿怒”，而 יִכְלֶה 表示完结或耗尽。译文保留“杖”的隐喻，不把它进一步解释为某种特定政权、刑罚或神学机制。
translation_notes:
  register: 采用现代、凝练而庄重的箴言体。“播种—收割”与“杖”两个原文意象均予保留；用“必”呈现格言所宣告的确定后果。脚注标记按所解释词句的位置排列。
