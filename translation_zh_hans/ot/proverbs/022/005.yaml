base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/005.yaml
  text: Thorns and snares are in the way of the crooked[c][b][a]; he who guards his life keeps far from them.
translation:
  language: zh_hans
  text: 乖僻之人[b]的路上有荆棘和网罗[a]；守护自己性命的人[c]，必远离它们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “网罗”或译“陷阱”。
    reason: lexical_alternative
  - marker: b
    text: “乖僻之人”也可译作“邪曲的人”或“诡诈的人”。
    reason: lexical_alternative
  - marker: c
    text: 原文直译为“守护他的性命”；这里的“性命”也可指“自己”。
    reason: lexical_alternative
lexical_decisions:
- source_word: צִנִּים
  choice: 荆棘
  rationale: 该词指尖锐的刺或带刺植物；与“网罗”并列时，形象地表现人生道路上的危险。“荆棘”既保留具体意象，也符合现代汉语表达。
- source_word: פַּחִים
  choice: 网罗
  rationale: 该词可指捕捉猎物的罗网或圈套。“网罗”保留智慧文学中隐蔽危险的比喻色彩；“陷阱”也是可行译法，列入脚注。
- source_word: בְּדֶרֶךְ
  choice: 路上
  rationale: דֶּרֶךְ既可指实际道路，也可指人的行径或人生道路。这里用“路上”保留原文具体而又可引申的双重意象。
- source_word: עִקֵּשׁ
  choice: 乖僻之人
  rationale: 该形容词描述扭曲、不正或乖谬的人。“乖僻”表达道德与行为上的偏曲，又不把含义收窄为单纯的欺诈。
- source_word: שׁוֹמֵר נַפְשׁוֹ
  choice: 守护自己性命的人
  rationale: 分词结构表达普遍原则；נֶפֶשׁ在此可指性命、自身或生命。“性命”切合避开危险、保全自身的语境，同时脚注保留原文表达的语义幅度。
- source_word: יִרְחַק
  choice: 必远离
  rationale: 未完成式在箴言中表达通常或必然的结果。“必远离”简洁地传达谨慎者持续与危险保持距离的意思。
- source_word: מֵהֶם
  choice: 远离它们
  rationale: 复数代词自然回指前面的“荆棘和网罗”，而不是单数的“路”；“它们”保留这一语法照应。
theological_decisions:
- issue: 智慧文学中的阳性单数泛指表达
  choice: 守护自己性命的人
  alternative: 守护自己性命的男子／他若守护自己的性命
  rationale: 希伯来语以阳性单数分词表达具有代表性的普遍人物，并非把箴言限制于男性。现代汉语“……的人”能自然保留单数、概括性的格言语气，无需添加原文未强调的性别。
- issue: נֶפֶשׁ在本节中的含义
  choice: 性命
  alternative: 灵魂／自己
  rationale: 上下文谈到避开道路上的危险，因此此处主要是保全自身或性命，而非专指与身体相对的“灵魂”。脚注说明原文表达，避免把该词的语义范围绝对化。
translation_notes:
  register: 采用现代、庄重而简洁的箴言体。“乖僻”略带书面色彩，但在此比“弯曲的人”更自然，也比“坏人”更准确；分号保留原文两半句之间的对照与因果张力。
