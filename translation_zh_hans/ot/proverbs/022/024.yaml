  yaml_path: translation/ot/proverbs/022/024.yaml
  text: Do not befriend a man given to anger[b][a], and do not go with a man of wrath.
translation:
  language: zh_hans
  text: 不要与易怒的人结交[a]，也不要和暴怒的人来往[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “结交”也可译作“与……亲近交往”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“来”；这里指与对方相伴、同行或交往。
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּתְרַע
  choice: 结交
  rationale: 该词为 רעה 的 Hitpael 形式，在此表示与人亲近、成为伙伴或朋友。“结交”自然传达建立并保持亲密交往的关系含义。
- source_word: בַּעַל אָף
  choice: 易怒的人
  rationale: בעל 加名词常指具有某种显著特征的人；אָף 字面为“鼻子”，引申为怒气。“易怒的人”准确表达受怒气支配、惯常发怒的性情。
- source_word: אִישׁ חֵמוֹת
  choice: 暴怒的人
  rationale: חֵמוֹת 是“烈怒、暴怒”的复数形式，在此描写一个以强烈怒气或怒气爆发为特征的人。“暴怒的人”保留第二分句较强的语气，并与上句形成平行。
- source_word: תָבֽוֹא
  choice: 来往
  rationale: בוא 本义为“来、进入”，但在本节与“结交”平行，语境指加入其圈子、与其相伴。“来往”符合现代汉语习惯，也保留社交关联之意。
- source_word: אַל ... לֹא
  choice: 不要……也不要……
  rationale: 原文以两个否定禁令构成平行句；重复“不要”保留劝诫的结构和力度。
- source_word: אִישׁ
  choice: 人
  rationale: 希伯来语使用阳性单数作箴言中的代表性个体。现代汉语“人”不标示语法性别，既自然，也未改变原文所指的一般性人物。
theological_decisions: []
translation_notes:
  register: 采用简洁、对称的现代标准汉语，保持箴言劝诫体的庄重与可懂性。“易怒”与“暴怒”体现两行近义平行，同时让第二行保留 חֵמוֹת 较强的情绪力度。所有脚注标记均置于相应正文词语之后。
