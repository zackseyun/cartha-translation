base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/021.yaml
  text: to make known to you the certainty of words of truth[b][a], so that you may return words of truth to those who sent you.
translation:
  language: zh_hans
  text: 使你知道真理之言确实可靠[a]，好让你用真实的话答复那些差遣你的人。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “确实可靠”也可译作“真实”“正确”或“可信”；原词קֹשְׁט的含义包括真实性、正确性和可靠性。
    reason: lexical_alternative
  - marker: b
    text: 本句也可译作：“好让你把真实的话带回给那些差遣你的人。”
    reason: alternative_reading
lexical_decisions:
- source_word: לְהוֹדִיעֲךָ
  choice: 使你知道
  rationale: 保留ידע使役式不定词的使役含义，表达“使你得知”，同时符合现代汉语习惯。
- source_word: קֹשְׁט
  choice: 确实可靠
  rationale: 该词可指真实、正确或可靠；这里译作“确实可靠”，既体现真确可信之意，也避免与本节两次出现的אֱמֶת完全混同。
- source_word: אִמְרֵי אֱמֶת
  choice: 真理之言
  rationale: 保留原文“真理/真实的话语”这一属格结构，并采用庄重而易懂的汉语表达。
- source_word: לְהָשִׁיב
  choice: 答复
  rationale: שוב的使役式可表达“带回、返回”，在言语语境中自然引申为“回答、答复”；“答复”清楚呈现其回应功能。
- source_word: אֲמָרִים אֱמֶת
  choice: 真实的话
  rationale: 按原文保留“话”与“真实”的搭配，指真实可信的言辞，而不把它抽象化为一般的“真理”。
- source_word: לְשֹׁלְחֶיךָ
  choice: 那些差你来的人
  rationale: 保留复数分词所指的多人，以及“差遣你”的关系；补出“来”使汉语语境自然。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而通顺的书面汉语。“真理之言”保留智慧文学的凝练感；“答复”则使后半句在现代汉语中清楚自然。所有代词均按原文第二人称阳性单数处理，但汉语不显性标注性别。
