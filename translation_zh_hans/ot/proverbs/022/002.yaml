  text: עָשִׁ֣יר וָ/רָ֣שׁ נִפְגָּ֑שׁוּ עֹשֵׂ֖ה כֻלָּ֣/ם יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/002.yaml
  text: The rich and the poor meet together[a]; Yahweh is the maker of them all.
translation:
  language: zh_hans
  text: 富人与穷人相遇[a]；他们都是耶和华所造的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较具解释性地译作：“富人与穷人有这一共同点：他们都是耶和华所造的。”
    reason: 词义及句意的另一种解释
lexical_decisions:
- source_word: עָשִׁיר
  choice: 富足人
  rationale: 此处是形容词作名词，泛指富有的人或这一类人；“富足人”简洁庄重，并与下文形成社会处境上的对照。
- source_word: וָרָשׁ
  choice: 与贫穷人
  rationale: רָשׁ 指贫穷、穷困的人，与 עָשִׁיר 构成鲜明对举；译作“贫穷人”保留原文的泛指意味。
- source_word: נִפְגָּשׁוּ
  choice: 彼此相遇
  rationale: פגשׁ 的尼法勒式在此最直接表示相遇、碰面，且带有相互意味；“彼此相遇”保留具体意象，不把潜在的寓意直接写入正文。
- source_word: עֹשֵׂה
  choice: 所造的
  rationale: 这是 עשה 的主动分词，表达“造他们的那一位”。汉语以“都是耶和华所造的”自然地传达持续有效的造物者关系，而不必生硬直译为“制造者”。
- source_word: כֻלָּם
  choice: 他们全都
  rationale: 指回富足人与贫穷人双方，强调无一例外；“他们全都”清楚保留其总括范围。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神名“耶和华”，以专名而非称号来对应四字神名。
theological_decisions:
- issue: 上半句“彼此相遇”的解释力度
  choice: 正文保留具体的“彼此相遇”，同时让下半句显出双方同为耶和华所造。
  alternative: 较具解释性地译为“富足人与贫穷人有一点相同：他们全都是耶和华所造的”。
  rationale: נִפְגָּשׁוּ 的通常词义是“相遇”，但箴言语境可能借此暗示双方共有的处境或共同点。正文不消除这层张力，脚注则交代较具解释性的理解。
translation_notes:
  register: 采用简洁、对称、庄重的现代标准汉语，保持箴言的凝练风格。正文以分号呈现两分句之间紧密而未被过度说明的逻辑关系；脚注标记[a]已置于对应词组之后。
