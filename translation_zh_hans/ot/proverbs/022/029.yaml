  yaml_path: translation/ot/proverbs/022/029.yaml
  text: Do you see a man skillful in his work? He will stand before kings[b][a]; he will not stand before obscure men.
translation:
  language: zh_hans
  text: 你见过在工作上娴熟的人吗？他必站在君王面前；不站在无名之辈[b]面前。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “娴熟”也可译为“敏捷”或“勤奋”。这个希伯来词可强调迅速、准备就绪，并引申指熟练能干。
    reason: lexical_alternative
  - marker: b
    text: 直译为“隐暗的人”，指没有名望、不显要的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: חָזִיתָ
  choice: 你看见……吗
  rationale: 该词是 חזה 的 Qal 完成式第二人称阳性单数，在这里以反问引出可观察的箴言智慧。汉语用现在性的“你看见……吗”自然保留其修辞作用。
- source_word: אִישׁ
  choice: 人
  rationale: 希伯来文为阳性单数“人、男人”，在此是代表性个体。现代汉语的“人”无需标明性别，也没有改变原文的单数观察对象。
- source_word: מָהִיר
  choice: 娴熟
  rationale: 该形容词本义涉及迅速、敏捷或准备就绪；与“工作”连用时，语境侧重办事干练、能力纯熟，而不只是速度快。“娴熟”保留赞许意味。
- source_word: בִּמְלַאכְתּוֹ
  choice: 办事
  rationale: מְלָאכָה 可指工作、职业或所承担的事务。译作“办事”与“娴熟”搭配自然，也不把范围限制为手艺或体力劳动。
- source_word: לִפְנֵי מְלָכִים
  choice: 在君王面前
  rationale: 直译并保留宫廷或权贵面前任职、侍立、陈事的社会提升意象。
- source_word: יִתְיַצָּב
  choice: 必站
  rationale: יצב 的 Hitpael 形式表示站定、就位或呈身于某人面前。“站”保留原文重复的具体意象；“必”表达未完成式在箴言中的预期结果。
- source_word: בַּל
  choice: 不会
  rationale: 诗歌性否定词，与前句的预期结果形成鲜明对照；“不会”在现代汉语中自然表达这种否定。
- source_word: חֲשֻׁכִּים
  choice: 无名之辈
  rationale: 该词字面与“昏暗、隐晦”有关，在此比喻没有声望、不显要的人。“无名之辈”传达社会地位上的不显达，避免误解为道德黑暗。
theological_decisions: []
