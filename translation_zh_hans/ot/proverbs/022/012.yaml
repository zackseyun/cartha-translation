base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/012.yaml
  text: The eyes of Yahweh preserve knowledge[c][b][a], but he overturns the words of the treacherous.
translation:
  language: zh_hans
  text: 耶和华的眼目守护知识[a]，却挫败奸诈之人的言语[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “守护知识”也可译作“保守知识”或“保存知识”。希伯来语动词可表示守卫、持守或保存。
    reason: lexical_alternative
  - marker: b
    text: “挫败”也可译作“颠覆”或“使……歪曲”。希伯来语动词含有使之弯曲、败坏或推翻的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵינֵי יְהוָה
  choice: 耶和华的眼目
  rationale: 保留希伯来文关于上帝鉴察、看顾的拟人意象；以现代中文圣经语体常用的“耶和华”音译神名。
- source_word: נָצְרוּ
  choice: 守护
  rationale: נצר可指守卫、保守或保存；“守护”既保留主动看守之意，也与下半句的破坏性行动形成对照。
- source_word: דָעַת
  choice: 知识
  rationale: 在《箴言》的智慧语境中，דעת通常指知识；不扩译为“真理”或“有知识的人”，以保存原文的简洁与可能的含义张力。
- source_word: וַיְסַלֵּף
  choice: 使……落空
  rationale: סלף可表示使弯曲、败坏、颠覆；以“使……落空”自然表达耶和华挫败奸诈言语的语境意义，同时在脚注保留较贴近词形的替代译法。
- source_word: דִּבְרֵי
  choice: ……的话
  rationale: דבר既可指话语也可指事情；此处与奸诈者相连，直译为“话”最简明，并避免把它扩展成计划或行为。
- source_word: בֹגֵד
  choice: 奸诈之人
  rationale: בוגד指行事诡诈、不忠的人；“奸诈之人”自然且不限定其不忠是盟约、关系或一般道德层面的。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文明确使用四字神名；正文保留专名而不以“主”替代。“耶和华”是现代简体中文读者最熟悉且庄重的传统音译，而“雅威”更接近常见学术拟音。
- issue: “守护知识”的所指
  choice: 保持原文抽象表达，不明确补出知识的拥有者或内容
  alternative: 保护有知识的人／保全真知识
  rationale: 原文以“知识”为直接宾语，可能强调上帝保存知识、护卫真知，或看顾认识；不在正文中补足隐含对象，以免消除原有含义张力。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“眼目”略带经文语体色彩，可保留原文拟人意象；全句保持箴言式的简洁对照。脚注标记均置于相应正文之后。
