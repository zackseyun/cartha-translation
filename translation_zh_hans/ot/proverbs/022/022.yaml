  yaml_path: translation/ot/proverbs/022/022.yaml
  text: Do not rob the poor because he is poor[b][a], and do not crush the afflicted at the gate.
translation:
  language: zh_hans
  text: 不可因人贫穷就抢夺他[b]；也不可在城门口[a]欺压困苦的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 古代城门口通常是审理案件和作出公开裁决的地方。
    reason: cultural_note
  - marker: b
    text: 也可译为：“不可抢夺穷人，因为他贫穷。”整句也可按司法语境意译为：“不可欺压穷人……也不可在法庭上压迫困苦的人。”
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּגְזָל
  choice: 抢夺
  rationale: 该词常指以强力或不义手段夺取；“抢夺”比泛指暗中取走的“偷窃”更贴合原文力度。
- source_word: דָּל
  choice: 穷人／贫穷
  rationale: 此词可指贫穷、弱小或社会地位低下的人；此处译作“穷人”，并在后半分句用“贫穷”保留原文词根的重复。
- source_word: כִּי דַל הוּא
  choice: 因穷人贫穷
  rationale: 将כִּי理解为原因，指出对方的贫穷竟成为被抢夺的缘由；这一表达保留原文刻意的重复和讽刺张力。
- source_word: תְּדַכֵּא
  choice: 欺压
  rationale: 原词在加强词干中可表示压碎、压迫；结合城门口的司法场景，“欺压”自然表达借审判权势压垮弱者的含义。
- source_word: עָנִי
  choice: 困苦人
  rationale: 该词兼有贫穷、受苦和受压之意；“困苦人”既区别于前面的דָּל，又保留其受苦和脆弱的色彩。
- source_word: בַשָּׁעַר
  choice: 在城门口
  rationale: 原文直译为“在门口”；古代城门是处理诉讼和公开裁决的场所，正文用自然的“城门口”，司法背景由脚注说明。
theological_decisions:
- issue: כִּי דַל הוּא所表达的逻辑关系
  choice: 译作“因穷人贫穷就”，理解为恶人利用贫穷者的弱势而抢夺他
  alternative: 可理解为“不要抢夺穷人，因为他贫穷”，即以其贫穷作为保护他的理由
  rationale: כִּי的因果关系本身清楚，但在劝诫中的修辞指向可有不同理解。正文采用较符合社会欺压语境的“利用其贫穷”的理解，并用脚注保留另一种可能。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“抢夺”保留גזל的不义强取力度；“欺压”在司法语境中比字面“压碎”更自然。脚注标记均紧邻所解释的词句。
