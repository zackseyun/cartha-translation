  yaml_path: translation/ot/proverbs/022/028.yaml
  text: Do not move an ancient boundary marker that your fathers made[a][b].
translation:
  language: zh_hans
  text: 不可挪动你祖先所立的古老地界。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不可迁移你祖先所设的古界标。”
    reason: lexical_alternative
  - marker: b
    text: “你祖先”原文直译为“你的父辈”，也可译作“你的先祖”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל
  choice: 不可
  rationale: 与未完成式连用构成禁令；“不可”简洁庄重，也符合箴言的劝诫语气。
- source_word: תַּסֵּג
  choice: 挪动
  rationale: 在地界语境中指移动或迁移原有界线；“挪动”既自然，也不额外限定为彻底拆除。
- source_word: גְּבוּל
  choice: 地界
  rationale: 该词本义为边界、疆界；在土地划界的语境中，“地界”可自然涵盖界线及标示界线的界标。
- source_word: עוֹלָם
  choice: 古老
  rationale: 此处表示久远以来既已存在，而非形而上的永恒；“古老”保留其年代久远之意。
- source_word: אֲשֶׁר
  choice: 所
  rationale: 以“所立的”自然引出修饰“地界”的关系从句。
- source_word: עָשׂוּ
  choice: 立
  rationale: עָשׂוּ字面可指“做、造”，但用于地界时是设立、确定之意；汉语惯用“立地界”，准确而简练。
- source_word: אֲבוֹתֶיךָ
  choice: 你祖先
  rationale: 原词为“你的父辈/父亲们”，在此可广指前代先人；“你祖先”在现代汉语中自然，并避免被误解为多位亲生父亲。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而简明的箴言体。“地界”是普通读者可理解的传统法律与土地用语；正文保留“挪动”与“古老”的基本意象，并用脚注说明“界标”和“父辈”等形式较贴近原文的译法。
