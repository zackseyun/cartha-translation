  source_fidelity: 原文以箴言体陈述一般现实：富者支配贫者，借入者从属于出借者。正文的“奴仆”准确保留了 עֶבֶד 所突出的强烈依附关系；“放贷者”也恰当对应 מַלְוֶה。
  naturalness: “借贷的是”在现代汉语中不够自然，且“借贷”可笼统指借与贷两方的金融活动，未能清楚限定 לֹוֶה（借入者）。改为“借钱的人”可自然、明确地表达借入的一方。
