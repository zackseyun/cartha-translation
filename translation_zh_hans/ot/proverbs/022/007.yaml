  yaml_path: translation/ot/proverbs/022/007.yaml
  text: The rich rules over the poor[a], and the borrower is a slave to the lender.
translation:
  language: zh_hans
  text: 富人管辖穷人；借钱的人是放贷者的奴仆。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“借钱的人是一个放贷之人的奴仆。”
    reason: 保留 לְאִישׁ מַלְוֶה（“向／属于一个放贷之人”）中较完整的字面结构；正文以“放贷者”作自然简洁的表达。
lexical_decisions:
- source_word: עָשִׁיר
  choice: 富人
  rationale: 形容词作名词，泛指富有的人；“富人”简洁自然，并与“穷人”形成鲜明对照。
- source_word: בְּרָשִׁים
  choice: 穷人
  rationale: 介词 ב 与“管辖”连用时标示管辖的对象；汉语“管辖穷人”已自然表达原文关系，无须另译介词。
- source_word: יִמְשׁוֹל
  choice: 管辖
  rationale: 未完成式在箴言中表达一般性现实，并非特指将来；“管辖”保留社会权力关系，语体庄重而易懂。
- source_word: וְעֶבֶד
  choice: 是……的奴仆
  rationale: עֶבֶד 可指奴隶或仆人；此处强调借贷造成的从属关系。“奴仆”既保留原文的强烈意味，也符合箴言的庄重语体；汉语补出判断词“是”。
- source_word: לֹוֶה
  choice: 借贷的
  rationale: Qal 主动分词名词化，指借入钱财的人。“借贷的”保持与后面的“放贷者”之间的动词对应；“借款人”虽更常见，但略偏现代金融术语。
- source_word: לְאִישׁ מַלְוֶה
  choice: 放贷者的
  rationale: 字面为“属于一个放贷的人”；属格式“放贷者的奴仆”自然传达 ל 所表示的从属关系，也保留借贷双方的词根呼应。
theological_decisions:
- issue: 本句是一般性观察还是绝对的道德命令
  choice: 以无时态标记的箴言式陈述表达一般现实
  alternative: 译成将来时或规范性命令
  rationale: 原文未完成式在智慧文学语境中通常陈述一般规律；译文不把它强化为无例外的预言或对社会秩序的认可。
translation_notes:
  register: 采用现代、庄重而通俗的箴言体。分号呈现两句并列的社会观察；正文保留“奴仆”的强烈从属意象，同时避免使用过于技术化的金融词汇。
