  text: חֲנֹ֣ךְ לַ֭/נַּעַר עַל פִּ֣י דַרְכּ֑/וֹ גַּ֥ם כִּֽי יַ֝זְקִ֗ין לֹֽא יָס֥וּר מִמֶּֽ/נָּה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/006.yaml
  text: Train up a boy according to his way[b][a]; even when he grows old he will not turn from it.
translation:
  language: zh_hans
  text: 教养少年人，要按着他的道路[a]；到他年老时，也不会偏离那条路。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较具解释性地译作：“照着他当行的道。”希伯来文更直译为“按着他的道路”。
    reason: alternative_reading
  - marker: b
    text: “少年人”所译的希伯来词是阳性单数，此处用一个年轻男性作一般性表述。这句箴言陈述的是通常成立的智慧原则，并非保证每个个案都绝无例外。
    reason: cultural_note
lexical_decisions:
- source_word: חֲנֹךְ
  choice: 教养
  rationale: 该命令式可指献上、启蒙或开始训练；在智慧文学的劝诫语境中，“教养”自然表达从年幼时塑造、训练之意，同时不把含义收窄为单纯课堂教导。
- source_word: לַנַּעַר
  choice: 少年人
  rationale: נַעַר 是阳性单数，可指男孩或年轻人。“少年人”保留年龄和语法上的男性指向，也比“孩子”更贴近该词的通常范围；此处是以单数个体陈述一般原则。
- source_word: עַל פִּי
  choice: 照着
  rationale: 该习语通常表示“按照、依照”。“照着”是简洁自然的现代汉语表达，避免生硬直译为“按……的口”。
- source_word: דַרְכּוֹ
  choice: 他的道路
  rationale: 希伯来文直译为“他的道路”。不在正文中增添“当行的”，以保留原文可能指合宜之道、适合其特点的道路，或其自身道路的开放性。
- source_word: גַּם כִּי
  choice: 即使
  rationale: 此处带有让步兼时间意味。“即使”能自然表达到了年老阶段仍然如此；“当……时”也可能，但让步色彩较弱。
- source_word: יַזְקִין
  choice: 他年老
  rationale: 该动词表示进入或达到老年。“他年老”在“即使”结构中简洁自然，并保留年龄变化的时间指向。
- source_word: לֹא יָסוּר
  choice: 也不会偏离
  rationale: סור 可指转离、离开或偏离。“不会偏离”准确表达不离开先前所说道路的意思，且符合现代汉语箴言体。
- source_word: מִמֶּנָּה
  choice: 那条路
  rationale: 阴性代词后缀回指阴性名词 דֶּרֶךְ（道路）。汉语不用语法性别代词，明说“那条路”可清楚交代所指，避免“偏离它”的生硬表达。
theological_decisions:
- issue: “他的道路”的含义
  choice: 正文保留较为直译的“照着他的道路”
  alternative: “照着他当行的道”或“按着适合他的道路”
  rationale: 原文只说“他的道路”，可被理解为他应走的正道，也可强调与其性情、处境或人生阶段相称的方式。正文不补入原文未明说的规范性成分，以保留真实的解释张力；常见解释置于脚注。
- issue: 箴言陈述的效力
  choice: 按一般智慧原则译为“不会偏离”，并以脚注说明其文类性质
  alternative: 把它改写成无例外的保证，或弱化成“可能不会偏离”
  rationale: 原文采用明确的否定陈述，不宜在正文中加入“可能”；但箴言通常概括人生的一般规律，而非就每一个案作无例外的契约式应许。脚注说明这一点，既保存句法力度，也避免文类误读。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语，保留箴言对称而凝练的句式。“教养”兼具训练与品格塑造意味；“道路”保留智慧文学中的人生道路意象。正文中的脚注标记按所说明内容依次置于“道路”和全句结尾。
