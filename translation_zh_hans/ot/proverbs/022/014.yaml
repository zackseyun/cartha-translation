  yaml_path: translation/ot/proverbs/022/014.yaml
  text: The mouth of forbidden women is a deep pit[a]; he who is under Yahweh’s wrath will fall there.
translation:
  language: zh_hans
  text: 不该亲近的女子的口是深坑[a]；雅威所震怒的人必跌入其中。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “不该亲近的女子”也可译作“陌生女子”“外族女子”或“淫妇”。《箴言》中这个希伯来词通常指处在正当婚约与性关系界限之外的女人。
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוּחָה עֲמֻקָּה
  choice: 深坑
  rationale: שׁוּחָה指坑穴，עֲמֻקָּה意为“深的”；合译为“深坑”，保留具体而有危险、陷阱意味的比喻。
- source_word: פִּי
  choice: 口
  rationale: 原文直译为“口”，语境中暗示诱惑性的言语；保留“口”可避免把这一含义解释得过窄。
- source_word: זָרוֹת
  choice: 不该亲近的女人
  rationale: 该词为阴性复数，在《箴言》中通常不只表示外族或陌生的女人，而指在正当婚约和性关系界限之外、不可与之发生亲密关系的女人。此译法自然明确，同时用脚注保留其他可能译法。
- source_word: זְעוּם יְהוָה
  choice: 遭雅威震怒的人
  rationale: זְעוּם是被动分词，表示成为愤怒或谴责对象的人；“遭……震怒”保留其状态和强烈语气。יְהוָה按专名音译为“雅威”。
- source_word: יפול שָׁם
  choice: 必掉在其中
  rationale: 未完成体在格言语境中表达通常会发生的结果；שָׁם字面为“那里”，所指是前面的深坑，汉语用“其中”衔接更自然。
theological_decisions:
- issue: זָרוֹת在智慧文学语境中的所指
  choice: 不该亲近的女人
  alternative: 陌生女子、外族女子或淫妇
  rationale: 原词具有“外来的、陌生的”基本义，但《箴言》的相关语境通常突出越出正当婚约与性关系界限的危险。正文不把范围缩限为已婚的淫妇，也不把重点误置于族裔身份；脚注保留词义张力。
- issue: זְעוּם יְהוָה的力度与神学含义
  choice: 遭雅威震怒的人
  alternative: 被雅威咒诅的人；雅威所憎恶的人
  rationale: 被动分词表明此人是神愤怒的对象，但原词本身不必限定为正式的“咒诅”，也不宜径直等同于“憎恶”；所选译法保留神审判与人坠入危险之间的张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“她们的口”明确承接复数的זָרוֹת，同时保留希伯来文“口是深坑”的鲜明比喻；分号呈现两分句之间的危险与结果关系。
