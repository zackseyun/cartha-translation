  yaml_path: translation/ot/proverbs/022/020.yaml
  text: Have I not written for you thirty sayings of counsel and knowledge?[a][b]
translation:
  language: zh_hans
  text: 我岂没有为你写下三十则关于劝诫和知识的箴言吗？[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我岂没有早先为你写下关于劝诫和知识的话吗？”传统上译作“从前”的希伯来词在这里含义不易确定；许多人将它理解为“三十”，可能指一组由三十则箴言组成的文集。
    reason: alternative_reading
  - marker: b
    text: 一些传统译本将这个艰涩的希伯来表达译作“美好的事”或“卓越的事”，而不是“三十则箴言”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: 岂没有……吗
  rationale: 引出预期肯定回答的反问；这一表达既保留希伯来文的疑问语气，也符合现代汉语习惯。
- source_word: כָתַבְתִּי
  choice: 写下
  rationale: 该词是כתב的Qal完成式第一人称单数，表示已经完成且与当前教诲相关的书写行动。
- source_word: לְךָ
  choice: 为你
  rationale: 介词ל可表示对象或受益者；在训诲语境中，“为你”突出这些内容是为受教者而写。
- source_word: שלשום
  choice: 三十则……箴言
  rationale: 此处词形艰涩。结合本段结构，许多学者将其理解为与“三十”有关，指一组约三十则教诲；为使中文完整自然，补出量词和“箴言”。“从前”的传统理解保留在脚注中。
- source_word: בְּמוֹעֵצוֹת
  choice: 有关谋略
  rationale: מוֹעֵצוֹת源于עֵצָה，意为谋略、劝告或计策。介词ב在此关系不易确定；“有关谋略”自然表达这些箴言的内容，同时不把它改释为“美好的事”。
- source_word: וָדָעַת
  choice: 和知识
  rationale: דעת通常指“知识”，与“谋略”并列，符合智慧文学用语。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“我岂没有……吗”保留反问力度；正文选择具有较强上下文支持的“三十则”，并以双脚注完整呈现“从前”和“美好的事”等真实的词义与句法歧义。
