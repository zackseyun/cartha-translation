  text: לִ/הְי֣וֹת בַּ֭/יהוָה מִבְטַחֶ֑/ךָ הוֹדַעְתִּ֖י/ךָ הַ/יּ֣וֹם אַף אָֽתָּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/019.yaml
  text: So that your trust may be in Yahweh[a], I have made known to you today, even to you.
translation:
  language: zh_hans
  text: 好叫你信靠雅威；今天我把这些话[a]告诉了你——尤其是你。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文没有明说“告诉”的内容；“这些话”是根据上下文补出的。原文直译可作：“今天我使你知道，尤其是你。”末尾的“尤其是你”保留原文对受话者的强调。
    reason: 说明正文为符合汉语表达而补出的隐含受词，并保留原文末尾强调性独立代词的语气。
lexical_decisions:
- source_word: לִהְיוֹת
  choice: 为使
  rationale: 带 לְ 的不定式在此表达目的；“为使”简洁自然地保留这一目的关系。
- source_word: בַּיהוָה
  choice: 信靠雅威
  rationale: 介词 בְ 标明信靠的对象；יהוה 按其专名译作“雅威”。
- source_word: מִבְטַחֶךָ
  choice: 你信靠
  rationale: מִבְטָח 表示信赖、倚靠；转化为现代汉语动词结构，使“信靠雅威”自然清楚，同时保留第二人称单数。
- source_word: הוֹדַעְתִּיךָ
  choice: 我……把这些话指教你
  rationale: ידע 的使役式意为“使知道、告知”；汉语需补出由上下文所指的内容“这些话”，而“指教”符合智慧训言的语境。补出内容一事以脚注说明。
- source_word: הַיּוֹם
  choice: 今天
  rationale: 直接保留原文的时间强调，表达现代自然。
- source_word: אַף אָתָּה
  choice: 是的，就是你
  rationale: אַף 与独立代词共同强调受教者本人；此译法保留突出的语气，又避免汉语中生硬重复“给你”。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；音译“雅威”保留其作为神圣专名的性质，不以称号替代。
- issue: הוֹדַעְתִּיךָ 未明说所告知的内容
  choice: 正文依上下文补出“这些话”，并加脚注
  alternative: 直译为“我今天使你知道”
  rationale: 原文的受词内容可由上下文中的智慧言语理解，但并未明说。现代汉语若完全不补出会显得悬空；补译并明确注出，既求通顺，也不掩盖原文形式。
translation_notes:
  register: 采用现代、庄重而易懂的智慧文学语体。“为使”保留目的关系；破折号凸显“是的，就是你”的强调。脚注标记 [a] 已置于正文相关补译之后。
