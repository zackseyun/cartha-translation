  text: If you have nothing with which to pay[a], why should he take your bed from under you?
translation:
  language: zh_hans
  text: 你若没有什么可用来偿还，他为什么要把你身下的床铺[a]拿走呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“卧榻”或“躺卧之处”。希伯来文具体说的是被拿走的物件，而不只是泛称“抵押品”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: 若
  rationale: 引出真实可能的条件，现代汉语中“若”简洁庄重，也保留警戒语气。
- source_word: אֵין לְךָ
  choice: 你没有什么
  rationale: 希伯来语以“没有……归你”表达缺乏或不拥有；译为“你没有什么”符合现代汉语习惯。
- source_word: לְשַׁלֵּם
  choice: 可以偿还
  rationale: 此处指偿付债务；“偿还”比泛指的“支付”更切合借贷语境，而“可以”自然连接前面的“没有什么”。
- source_word: לָמָּה
  choice: 为什么
  rationale: 保留原文反问形式及其劝诫力量，不把问题改写为直接陈述。
- source_word: יִקַּח
  choice: 他……拿走
  rationale: 保留第三人称阳性单数形式；“他”在上下文中自然指债权人，但不在译文中额外明说其身份。
- source_word: מִשְׁכָּבְךָ
  choice: 你的床铺
  rationale: 该词具体指躺卧之处，在此是床或寝具；“床铺”自然清楚，并保留被拿走之物的具体形象，不抽象译成“抵押品”。
- source_word: מִתַּחְתֶּיךָ
  choice: 你身下的
  rationale: 保留“从你下面”这一鲜明图像，表达连正在躺卧的床铺也可能被取走。
