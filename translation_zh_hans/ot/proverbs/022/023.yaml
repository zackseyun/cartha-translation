  text: כִּֽי יְ֭הוָה יָרִ֣יב רִיבָ֑/ם וְ/קָבַ֖ע אֶת קֹבְעֵי/הֶ֣ם נָֽפֶשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/023.yaml
  text: For Yahweh will plead their case and rob of life those who rob them[a].
translation:
  language: zh_hans
  text: 因为耶和华必为他们申辩，夺去抢夺他们者的性命。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为耶和华必为他们争讼，并夺去那些掠夺他们之人的性命。”
    reason: 原文“必争讼他们的案件”带有诉讼和维护其案件的意味；“夺去”与“掠夺”对应同一希伯来词根，表现对掠夺者的报应。
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上一节的禁令，说明不可欺压贫弱者的原因，保留原文的因果关系。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名译出四字神名，不以泛称“主”取代。
- source_word: יָרִיב רִיבָם
  choice: 必为他们申辩
  rationale: 动词与同根名词构成法律语境，意为替他们出面处理诉讼、维护其案件；“为他们申辩”在现代汉语中自然地保留司法意象。
- source_word: וְקָבַע
  choice: 并夺取……的性命
  rationale: קבע有抢夺、掠取之意；与נָפֶשׁ连用，在此表示剥夺生命，并体现相称的报应。
- source_word: קֹבְעֵיהֶם
  choice: 那些掠夺他们之人
  rationale: 这是同一词根קבע的分词形式。“夺取／掠夺”的对应尽量保留原文的重复和反讽：掠夺者反被夺去性命。
- source_word: נָפֶשׁ
  choice: 性命
  rationale: 此处指人的生命，而非与身体相对的非物质“灵魂”；“性命”符合中文惩罚语境。
theological_decisions:
- issue: 四字神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: “耶和华”是现代中文圣经传统中最广为人知的专名形式，明确表明经文主语是以色列之神的盟约之名，同时避免用称号完全取代专名。
- issue: 神为受欺压者“申辩”的法律意象
  choice: 保留神亲自为他们申辩并向掠夺者追讨性命的表述
  alternative: 意译为“主持公道、惩罚恶人”
  rationale: 原文既有诉讼意象，也有以掠夺还报掠夺的强烈张力；不将其弱化为笼统的道德报应。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“申辩”保留法庭语境；“夺取……性命”清楚表达נָפֶשׁ在此指生命。主句以“夺取／掠夺”呼应同一希伯来词根所形成的报应性文字效果。
