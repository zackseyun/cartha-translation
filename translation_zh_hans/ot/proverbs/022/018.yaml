  text: כִּֽי נָ֭עִים כִּֽי תִשְׁמְרֵ֣/ם בְּ/בִטְנֶ֑/ךָ יִכֹּ֥נוּ יַ֝חְדָּ֗ו עַל שְׂפָתֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/018.yaml
  text: For it is pleasant if you keep them within you[b][a], if they are established together on your lips.
translation:
  language: zh_hans
  text: 因为你若把这些话存记在心[a]，并使它们都稳妥地留在你唇上[b]，这便是美好的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“在你的腹中”；这是希伯来语指人的内在或内心的一种说法。
    reason: cultural_note
  - marker: b
    text: 也可译作“使它们都预备在你唇上”。这里的动词可强调稳固、确立，也可强调准备妥当、随时可以说出。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 句首的כִּי承接上文，说明听取并保存智慧之言的理由；“因为”自然保留了解释作用。
- source_word: נָעִים
  choice: 令人喜悦的
  rationale: 该词表示可喜、愉悦、令人感到美好；这样表达既符合智慧文学的语气，也比生硬的“是愉快的”更自然。
- source_word: כִּי
  choice: 若
  rationale: 第二个כִּי在此引出相关情形，可按条件理解；“若”保留这种可能性，而不把它强化为必然的时间关系。
- source_word: תִשְׁמְרֵם
  choice: 把这些话存留
  rationale: שׁמר可指守护、保存或持守；在本节语境中，重点是把前述智慧之言保存在里面。“这些话”明确了代词所指。
- source_word: בְּבִטְנֶךָ
  choice: 在内心
  rationale: 字面为“在你的腹中”，在希伯来表达中指人的内部或内在之人；“内心”以现代汉语自然传达此意，并以脚注保留身体意象。
- source_word: יִכֹּנוּ
  choice: 稳稳地
  rationale: כון的Nifal形态可表示被确立、稳固，也可引申为准备妥当。正文用“稳稳地”保留稳固之意，脚注说明“随时可说”的另一种理解。
- source_word: יַחְדָּו
  choice: 一同
  rationale: 保留复数对象整体聚集、共同具备的含义。
- source_word: עַל שְׂפָתֶיךָ
  choice: 在你唇边
  rationale: 既保留“在嘴唇上”的原文意象，也自然表达这些话已可诉诸言语。
theological_decisions:
- issue: יִכֹּנוּ所表达的是稳固还是随时可说
  choice: 正文表达为“一同稳稳地在你唇边”
  alternative: “一同备在你唇边，随时可以说出”
  rationale: 该动词首先可表达确立、稳固，但与“唇边”连用时也可能强调言语上的准备。正文不完全消解两者间的张力，脚注列出另一理解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“存留在内心”传达智慧之言被内化；“稳稳地在你唇边”保留原文的嘴唇意象和动词的稳固色彩，同时借脚注呈现“准备妥当”的词义可能。
