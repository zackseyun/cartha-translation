  text: אִ֭וֶּלֶת קְשׁוּרָ֣ה בְ/לֶב נָ֑עַר שֵׁ֥בֶט מ֝וּסָ֗ר יַרְחִיקֶ֥/נָּה מִמֶּֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/015.yaml
  text: Folly is bound up in the heart of a boy[a]; the rod of discipline will drive it far from him.
translation:
  language: zh_hans
  text: 愚昧缠在少年人的心中[a]；管教的杖必使愚昧远离他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“愚昧系在男孩的心里。”
    reason: 保留 קְשׁוּרָה“系住”这一较直译的表达，并呈现 נָעַר 可译为“男孩”的词义选择。
lexical_decisions:
- source_word: אִוֶּלֶת
  choice: 愚昧
  rationale: 在智慧文学中，此词不只是智力不足，更指道德与属灵判断上的愚妄；“愚昧”简洁自然，也符合《箴言》的惯用语域。
- source_word: קְשׁוּרָה
  choice: 缠在
  rationale: 该被动分词表示被系住、紧密相连；“缠在”保留紧密附着、难以摆脱的形象，同时符合现代汉语表达。
- source_word: בְלֶב
  choice: 心中
  rationale: 希伯来语的“心”涵盖思想、意志和欲望；译作“心中”既保留原文的人论意象，又自然易懂。
- source_word: נָעַר
  choice: 少年人
  rationale: 此词可指儿童、少年或青年，范围较宽；“少年人”保留男性单数语境，又避免把年龄过度限定为年幼男童。
- source_word: שֵׁבֶט
  choice: 杖
  rationale: 原词明确呈现用于权柄或纠正的杖；保留具体意象，不将其抽象化为泛指的管教。
- source_word: מוּסָר
  choice: 管教
  rationale: 此词兼有教导、纠正和训练的含义；“管教”在此能自然表达带有纠正作用的塑造。
- source_word: יַרְחִיקֶנָּה
  choice: 必使愚昧远离
  rationale: 使役词形表达“使之远去”；汉语重复“愚昧”可明确阴性宾语所指，并保留使其远离的力度。
- source_word: מִמֶּנּוּ
  choice: 他
  rationale: 介词与第三人称阳性单数后缀表示与少年人分离；在“远离他”中自然体现这一关系。
theological_decisions:
- issue: 是否将体罚色彩明显的“管教的杖”淡化为纯抽象的管教
  choice: 在正文中保留“管教的杖”这一具体表达。
  alternative: 只译作“管教”或“纠正”，省略“杖”。
  rationale: 希伯来文明确使用 שֵׁבֶט（杖）。译文应保留原文具体而具有张力的意象，同时以“管教”说明其在智慧文学中的纠正和塑造语境，不把本节扩展为超出文本范围的伦理或教义论断。
- issue: נָעַר 的年龄与性别表达
  choice: 译作“少年人”。
  alternative: 译作“男孩”“孩子”或“青年”。
  rationale: 原文为阳性单数，但该词年龄范围较宽。“少年人”既可体现男性指向，也保留儿童至青年之间的词义弹性，避免不必要地缩窄所指。
translation_notes:
  register: 采用现代、庄重而通俗的智慧文学语体。正文保留“心”“杖”等原文意象；用“缠在”表达根深蒂固的紧密附着，用重复名词“愚昧”消除汉语代词可能造成的指代含混。
