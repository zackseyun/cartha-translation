  text: אַל תְּהִ֥י בְ/תֹֽקְעֵי כָ֑ף בַּ֝/עֹרְבִ֗ים מַשָּׁאֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/026.yaml
  text: Do not be among those who strike hands[a], among those who become surety for debts.
translation:
  language: zh_hans
  text: 不要与击掌作保的人为伍[a]，也不要与为债务担保的人为伍。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“击掌的人”；“击掌”在这里是确认担保或承诺的动作。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תְּהִי
  choice: 不要……为伍
  rationale: אַל加未完成式在此表达劝诫性的禁止；结合介词ב所表示的群体关联，译为“不要与……为伍”既自然，也保留“不要置身于这类人之中”的含义。
- source_word: בְתֹקְעֵי כָף
  choice: 与击掌作保的人
  rationale: תקע כף字面指“击掌”，在此是以击掌确认担保或承诺的习语。正文补出“作保”以便现代读者理解，同时由脚注保留较直译的表达。
- source_word: בַּעֹרְבִים
  choice: 与……担保的人
  rationale: ערב在此指为他人的义务作保、承担保证责任；译作“担保”准确而符合现代汉语金融语境。
- source_word: מַשָּׁאוֹת
  choice: 债务
  rationale: 该词在本节指由人作保的财务负担或债务。“债务”简洁清楚，并保留其范围，不限于特定形式的借款。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的劝诫语体。“为伍”自然表达希伯来文两处介词所表示的与某类人为伴或置身其中；第二分句补出“也不要”，使汉语并列结构清晰，但不改变原文的平行关系。
