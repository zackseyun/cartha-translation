base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/016.yaml
  text: One who oppresses the poor to increase his own wealth[a], or gives to the rich[b], will come only to poverty.
translation:
  language: zh_hans
  text: 欺压穷人、使自己富足的[a]，或给富人送礼的，终必穷乏[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文也可理解为：“欺压穷人、使自己富足，又给富人送礼的，终必穷乏。”原文可列举两种行为，也可描述同一个人的两项行为。
    reason: alternative_reading
  - marker: b
    text: “穷乏”也可译为“缺乏”或“贫困”。
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹשֵׁק
  choice: 欺压……的
  rationale: 这是动词 עשׁק 的 Qal 主动分词，在句中名词化，泛指惯于压榨、欺凌别人的人；“欺压……的”既保留其概括性，也符合现代汉语表达。
- source_word: דָּל
  choice: 穷人
  rationale: דָּל 可指贫穷、卑微或处境弱势的人；本节围绕财富与贫困展开，因此采用经济含义明确的“穷人”。
- source_word: לְהַרְבּוֹת לוֹ
  choice: 来为自己增添财富
  rationale: רבה 的使役式不定词与介词 לְ 表目的或结果，לוֹ 表明所得归于行为者自己。原文未明说所增添的是“财富”，但经济语境清楚；译文补出“财富”，使汉语自然，同时不改变句意。
- source_word: נֹתֵן לְעָשִׁיר
  choice: 向富人赠送财物的
  rationale: נֹתֵן 是与前一分词平行的 Qal 主动分词；לְעָשִׁיר 指接受者“富人”。汉语中的“赠送”通常需要宾语，故按上下文补出“财物”。
- source_word: אַךְ
  choice: 只会
  rationale: אַךְ 在此具有强调和限定作用，表明这种行为的结局无非是贫困；“只会”自然地传达这一排他性结果。
- source_word: לְמַחְסוֹר
  choice: 陷入贫困
  rationale: מַחְסוֹר 表示缺乏、匮乏或贫困。介词 לְ 指向结果；译作“陷入贫困”符合汉语习惯，也清楚表达经济上的结局。
theological_decisions:
- issue: 两个分词结构之间的句法关系
  choice: 将其译为两个可并列选择的自取贫困之举：欺压穷人以自肥，或赠送财物给富人。
  alternative: 将两项行为合并理解为同一个人的一贯做法：他既欺压穷人以自肥，又赠送财物给富人，结果只有贫困。
  rationale: 希伯来文高度凝练，没有明示连接词，因此既可理解为两个相提并论的行为，也可理解为一个人的两项连贯行为。正文用“或”提供较自然的箴言式警告，脚注保留合并理解，避免消除原文的真实歧义。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“增添财富”明确原文在经济语境中省略的宾语；“向富人赠送财物”则以自然汉语表达 נֹתֵן לְעָשִׁיר。正文保持箴言简洁有力，脚注保存句法和词义上的开放性。
