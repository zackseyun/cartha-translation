  text: אַל תִּ֭ירָא מִ/פַּ֣חַד פִּתְאֹ֑ם וּ/מִ/שֹּׁאַ֥ת רְ֝שָׁעִ֗ים כִּ֣י תָבֹֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/025.yaml
  text: Do not fear sudden terror[a], or the ruin of the wicked when it comes[b],
translation:
  language: zh_hans
  text: 不要惧怕突如其来的惊恐，也不要惧怕恶人的毁灭[a]，当它来到时[b]；
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “毁灭”也可译作“灾祸”或“荒凉”。
    reason: lexical_alternative
  - marker: b
    text: “恶人的毁灭”既可能指临到恶人的灾祸，也可能指与恶人有关或由恶人带来的灾祸；希伯来语没有明确说明两者的关系。
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תִּירָא
  choice: 不要惧怕
  rationale: 否定词 אַל 与未完成式动词组合，表达禁止；“不要惧怕”简洁、庄重，并自然引出两个由 מִן 标示的恐惧对象。
- source_word: מִפַּחַד פִּתְאֹם
  choice: 突如其来的惊恐
  rationale: פַּחַד 指惊恐、恐惧，פִּתְאֹם 表示突然或出乎意料；译作“突如其来的惊恐”符合现代汉语，也保留事件骤然发生的意味。
- source_word: וּמִשֹּׁאַת
  choice: 也不要惧怕……毁灭
  rationale: שֹׁאָה 可指毁灭、灾祸或荒废。补出与前句共用的“不要惧怕”，使汉语结构清楚；选“毁灭”保留其强烈的破坏性语义。
- source_word: רְשָׁעִים
  choice: 恶人的
  rationale: 该词为复数，指邪恶之人。属格结构保持简洁，不擅自判定这毁灭是临到恶人，还是由恶人带来。
- source_word: כִּי תָבֹא
  choice: 当它来到时
  rationale: כִּי 在此适宜按时间关系理解；阴性单数 תָבֹא 回指阴性名词 שֹׁאָה。“当它来到时”保留原文的照应和事件临到之意。
theological_decisions:
- issue: “恶人的毁灭”的关系歧义
  choice: 保留属格表达“恶人的毁灭”
  alternative: “临到恶人的毁灭”或“恶人带来的毁灭”
  rationale: 希伯来语结构紧凑，既可能指恶人所遭受的灾祸，也可能指与恶人有关或由其造成的灾祸；正文不应替原文消除这一歧义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“突如其来的惊恐”比生硬的“突然的恐惧”自然；重复“不要惧怕”增强汉语可读性。正文用分号承接下一节语意，同时保留本节未完的句法张力。
