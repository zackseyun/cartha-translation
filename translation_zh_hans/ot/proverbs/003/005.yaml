  text: בְּטַ֣ח אֶל יְ֭הוָה בְּ/כָל לִבֶּ֑/ךָ וְ/אֶל בִּֽ֝ינָתְ/ךָ֗ אַל תִּשָּׁעֵֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/005.yaml
  text: Trust in Yahweh with all your heart[a], and do not lean on your own understanding.
translation:
  language: zh_hans
  text: 你要全心信靠雅威，不可倚靠自己的聪明。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “倚靠”也可译作“依赖”。希伯来语动词的本义是“靠着”或“以……支撑自己”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּטַח
  choice: 信靠
  rationale: 该词是阳性单数第二人称祈使式；“信靠”既保留直接命令的语气，也表达把自己交托、依赖于对方的关系含义。
- source_word: אֶל־יְהוָה
  choice: 信靠雅威
  rationale: 介词 אֶל 与 בטח 连用时表示信赖所指向的对象；现代汉语用“信靠雅威”自然准确。神名 יְהוָה 音译为“雅威”，不以称号代替专名。
- source_word: בְּכָל לִבֶּךָ
  choice: 全心
  rationale: “全心”自然表达 בְּכָל 的整体性。לֵב 在希伯来语中涵盖思想、意志和情感等内在生命，并非仅指感情；“心”保留了原文广阔而凝练的意象。
- source_word: בִּינָתְךָ
  choice: 自己的聪明
  rationale: בִּינָה 可指理解力、洞察力或聪明才智；此处“自己的聪明”符合现代汉语智慧文学语体，并清楚呈现与信靠雅威之间的对照。
- source_word: אַל תִּשָּׁעֵן
  choice: 不可倚靠
  rationale: אַל 加未完成式表达禁止。“倚靠”保留 שׁען 的身体性比喻，即把自己支撑在某物之上，同时在现代汉语中也自然表示依赖。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。采用“雅威”作为其现代常见音译，保留专名性质，不用称号取代；“耶和华”是传统形式，“上主”则属于替代性称号。
- issue: “全心”的范围
  choice: 保留“心”的综合含义
  alternative: 全意；用你全部的思想和意志
  rationale: 希伯来语 לֵב 可包含理智、意志和情感。译作“全心”保留原文简洁的整体性，避免把命令窄化为情绪上的热诚，也不通过扩译消除其丰富含义。
- issue: 信靠与人的理解力之间的张力
  choice: 不可倚靠自己的聪明
  alternative: 不要使用自己的理解力
  rationale: 原文禁止的是把自身理解当作支撑，并非否定理解力本身。保留“倚靠”的比喻，避免将经文解释为反对思考。
translation_notes:
  register: 采用现代、庄重而易懂的箴言式表达。“你要……不可……”呈现正反相接的命令结构；“全心”简洁自然，“倚靠”保留原文比喻。脚注标记置于相关分句之后。
