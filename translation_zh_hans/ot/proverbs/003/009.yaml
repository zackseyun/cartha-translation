  text: כַּבֵּ֣ד אֶת יְ֭הוָה מֵ/הוֹנֶ֑/ךָ וּ֝/מֵ/רֵאשִׁ֗ית כָּל תְּבוּאָתֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/009.yaml
  text: Honor Yahweh with your wealth and with the firstfruits of all your produce[a][b].
translation:
  language: zh_hans
  text: 要以你的财富[a]和你一切出产的初熟之物[b]尊荣雅威。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“从你的财富中”；“尊荣”之后的希伯来语介词既可表示所用的资源，也可表示从中取出一部分。
    reason: lexical_alternative
  - marker: b
    text: “初熟之物”指收成中最先取得、献给神以表示尊荣的部分；它也代表人把出产优先归给神。
    reason: cultural_note
lexical_decisions:
- source_word: כַּבֵּד
  choice: 尊荣
  rationale: 该词是כבד的皮耶勒命令式，表示给予某人应有的分量、敬重或尊崇。“尊荣”既保留其庄重含义，也适合本节以财物表达敬神的劝诫。
- source_word: יְהוָה
  choice: 雅威
  rationale: 这是四字神名יהוה；“雅威”按其通常重建读音音译，保留专名性质，而不以“主”等称号替代。
- source_word: מֵהוֹנֶךָ
  choice: 以你的财富
  rationale: הוֹן指财富、资财或物质资源。介词מִן在“尊荣”之后可表达凭借或取自某物；正文用自然汉语“以”表达手段，同时在脚注保留“从……中”的可能译法。
- source_word: וּמֵרֵאשִׁית
  choice: 和……初熟之物
  rationale: רֵאשִׁית本义为起初、最先的部分；与农业出产连用时，指首先收获并献出的部分。“初熟之物”准确保留这一语境。
- source_word: כָּל
  choice: 一切
  rationale: כָּל在此修饰“出产”，表示全部、各样，译作“一切”简洁自然。
- source_word: תְּבוּאָתֶךָ
  choice: 你一切出产
  rationale: תְּבוּאָה指土地的出产、收成或农产。“出产”保留农业含义，又比“增益”等传统说法更易懂。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名，而非“主”这一称号。“雅威”较直接地反映通常重建的YHWH读音；“耶和华”虽是汉语传统译名，但其语音形式源于较晚的混合读法。
- issue: 财富与尊荣神之间的关系
  choice: 以财富尊荣
  alternative: 从财富中尊荣
  rationale: 介词מִן在此既可理解为表达手段，也可强调从财富中取出一部分。正文采用自然的工具性表达“以”，脚注保留来源性的另一种理解，不把经文扩展成特定奉献比例或制度。
- issue: “初熟之物”的含义
  choice: 首先收获并献给神以表示尊荣的部分
  alternative: 泛指最好的部分
  rationale: רֵאשִׁית首先强调次序上的“最先部分”，在献祭文化中也常含优先献给神的意义。注释说明其文化功能，但不把“最好的”设为唯一词义。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“以……尊荣……”保留智慧文学劝诫的简洁力度；“财富”涵盖各类物质资财，“出产”则保留本节明确的农业背景。两个脚注标记均置于正文相应词组之后。
