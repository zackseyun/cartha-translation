  text: בְּ/כָל דְּרָכֶ֥י/ךָ דָעֵ֑/הוּ וְ֝/ה֗וּא יְיַשֵּׁ֥ר אֹֽרְחֹתֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/006.yaml
  text: In all your ways acknowledge him[a], and he will make your paths straight.
translation:
  language: zh_hans
  text: 在你一切所行的事上，都要认定他；他必使你的路径平直。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他必指引你的道路。”希伯来文更直译为“他必使你的路径平直”。
    reason: 词义与传统译法的替代选择
lexical_decisions:
- source_word: בְּכָל
  choice: 在……一切……上
  rationale: 介词 בְּ 与 כָל 合用，表示涵盖人生各个方面；这一表达既保留全面性的含义，也符合现代汉语习惯。
- source_word: דְּרָכֶיךָ
  choice: 你一切所行的路
  rationale: דֶּרֶךְ 既可指实际道路，也可喻指人的行为和生活方式。译作“所行的路”保留道路意象，同时自然传达生活实践的含义，并与后文“路径”有所区别。
- source_word: דָעֵהוּ
  choice: 认定他
  rationale: 该命令式字面可作“认识他”，但在本语境中不只是知道有关他的事，而是在一切行动中承认、顾念并信靠他。“认定他”简洁地表达这种关系性和实践性的认识，又不把含义限定为单纯的理智认知。
- source_word: וְהוּא
  choice: 他必
  rationale: 独立代词明确突出上帝是随后行动的主体；结合箴言式应许的语气，用“他必”自然表达其确定性。
- source_word: יְיַשֵּׁר
  choice: 使……平直
  rationale: יָשַׁר 的加强词干表示使之笔直、平坦或顺直。译作“使……平直”直接保留希伯来文的道路图像，避免在正文中将其缩窄为仅仅提供方向。
- source_word: אֹרְחֹתֶיךָ
  choice: 你的路径
  rationale: אֹרַח 指道路、路径，也可比喻人生历程。译作“路径”保留比喻，并与前面的 דֶּרֶךְ 所译“所行的路”形成细微的词汇区别。
theological_decisions:
- issue: 上帝使人的路径平直这一应许的性质
  choice: 他必使你的路径平直
  alternative: 他必指引你的道路
  rationale: 希伯来文首先描绘上帝使道路变得平直或顺直，而不只是给予方向。“使……平直”保留这一较宽广的图像，不将应许限定为内在引导；“指引”作为常见的解释性译法列入脚注。
- issue: “认定他”所表达的认识
  choice: 认定他
  alternative: 认识他
  rationale: 原文动词是“知道、认识”，在这里具有关系性和实践性的力度。“认定”能表达在一切行为中承认并顾念上帝，同时不额外加入特定宗派的顺服观念。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“所行的路”与“路径”保留原文两个近义道路词之间的变化；分号呈现命令与应许之间紧密而有层次的关系。
