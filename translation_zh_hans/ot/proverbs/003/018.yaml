  yaml_path: translation/ot/proverbs/003/018.yaml
  text: She is a tree of life to those who take hold of her[b][a], and those who hold her fast are blessed.
translation:
  language: zh_hans
  text: 她[b]是那些紧紧抓住她的人的生命树；凡持定她的，都是有福的。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “持定她”也可译作“扶持她”或“拥护她”。希伯来语动词可表示扶持、托住或牢牢持守。
    reason: lexical_alternative
  - marker: b
    text: 本节的“她”指上下文中被人格化的智慧。
    reason: cultural_note
lexical_decisions:
- source_word: עֵץ חַיִּים
  choice: 生命树
  rationale: 直译为“生命之树”。中文“生命树”自然保留原文意象；不加“那棵”，以免将其过度限定为伊甸园中独一的生命树。
- source_word: הִיא
  choice: 她是
  rationale: 阴性单数代词回指上下文中被人格化的智慧；用“她”保留这一文学手法。
- source_word: לַמַּחֲזִיקִים בָּהּ
  choice: 赐给那些紧紧抓住她的人
  rationale: 原意是“对于／给那些抓住她的人”。“抓住她”保留具体动作意象；“紧紧”传达 חזק 所含的牢牢把持之意，“赐给”使中文关系清楚，但不把隐喻改写为抽象概念。
- source_word: וְתֹמְכֶיהָ
  choice: 凡持守她的
  rationale: תמך 可指扶持、托住或牢牢持守。此处与前句“抓住她”平行，“持守她”既自然，又保留持续坚守智慧的可能含义。
- source_word: מְאֻשָּׁר
  choice: 都是有福的
  rationale: 该词表示蒙福、处于可羡慕的兴盛状态。“有福”比“快乐”更宽广，也避免“幸运”所暗示的偶然性。
theological_decisions:
- issue: 智慧的人格化
  choice: 以阴性人称“她”指智慧
  alternative: 以非人格化的“它”指智慧
  rationale: 希伯来文明确使用阴性单数形式，上下文也把智慧人格化；保留“她”忠实呈现文学表达，而不额外作本体论判断。
- issue: “生命树”是否特指伊甸园的生命树
  choice: 保留不带特指标记的“生命树”意象
  alternative: 译作“那棵生命树”或解释为“赐生命的树”
  rationale: 原文构词本身未要求把此处等同于创世记中某一棵特定的树；保留意象及其可能关联，不将关联定死。
- issue: תמך 的动作方向
  choice: 正文译为“持守她”
  alternative: 译为“扶持她”或“拥护她”
  rationale: 该动词语义容许“扶持／托住”和“牢牢持守”。上下平行更支持“持守”，但原有歧义值得在脚注中保留。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“紧紧抓住”与“持守”形成递进式平行，保留智慧文学的具体意象。脚注标记均置于正文相关陈述之后。
