base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/035.yaml
  text: The wise will inherit honor, but fools lift up disgrace.
translation:
  language: zh_hans
  text: 智慧人必承受尊荣，愚昧人却高举羞辱。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “高举羞辱”按希伯来文本直译；本句含义较难确定。也有人依据古译本或不同的词形理解，译作“愚昧人所得的是羞辱”或“愚昧人自取羞辱”。
    reason: 说明马所拉文本中 מֵרִים קָלוֹן 的异常搭配，并保留真实的文本与释义不确定性。
lexical_decisions:
- source_word: כָּבוֹד
  choice: 尊荣
  rationale: 既保留“荣耀、尊贵”的语义，也自然表达智慧人所得的社会与道德尊荣。
- source_word: חֲכָמִים
  choice: 智慧人
  rationale: 箴言中的常用人物类型，指按智慧生活的人。
- source_word: יִנְחָלוּ
  choice: 必承受
  rationale: 保留动词“继承、得为产业”的意象，并以“必”表达未完成式在格言中的确定性。
- source_word: כְסִילִים
  choice: 愚昧人
  rationale: 对应箴言中顽梗、拒绝智慧的人，而不只是智力不足者。
- source_word: מֵרִים
  choice: 高举
  rationale: 按马所拉文本取其主动分词“举起、抬高”的通常意义，不改写为较顺畅但解释性更强的“承受”或“招致”。
- source_word: קָלוֹן
  choice: 羞辱
  rationale: 表达耻辱、不名誉，与前半句的“尊荣”形成鲜明对照。
theological_decisions:
- issue: “愚昧人高举羞辱”这一反常搭配的处理
  choice: 保留“高举羞辱”
  alternative: 愚昧人只得羞辱／承受羞辱
  rationale: 希伯来文本的表层读法是主动的“高举羞辱”；虽语义突兀，却可能有讽刺意味或存在文本难点，不宜在正文中默默消解。
translation_notes:
  register: 采用现代、庄重而易懂的箴言体。上下句以“智慧人／愚昧人”和“尊荣／羞辱”构成平行对照；正文保留原文末句的突兀意象，并用脚注交代歧义。
