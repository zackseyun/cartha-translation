translation:
  language: zh_hans
  text: 因为它们必使你日子长久，生命的年岁增多，并加给你平安[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “平安”也可译作“福祉”或“完整”；原文 שָׁלוֹם 不仅指没有冲突，也包含健全、福祉和兴盛。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上一节的劝勉，引出遵守教诲的结果和理由；现代汉语用“因为”自然清楚。
- source_word: אֹרֶךְ יָמִים
  choice: 日子长久
  rationale: 保留希伯来语“日子的长度”这一诗性表达，同时符合现代汉语习惯。
- source_word: וּשְׁנוֹת חַיִּים
  choice: 寿年增多
  rationale: 表达“生命的年岁”，并与前句构成自然的诗歌平行；“寿年”在箴言语体中庄重而易懂。
- source_word: וְשָׁלוֹם
  choice: 平安
  rationale: “平安”是 שָׁלוֹם 的简明常用对应词；其含义还可包括安康、完满和整体福祉，故以脚注说明。
- source_word: יוֹסִיפוּ
  choice: 必使……长久，……增多，并赐
  rationale: 希伯来语意为“增添”；为使汉语自然，根据三个宾语分别表达其结果，同时保留复数主语“它们”的施事作用。
- source_word: לָךְ
  choice: 使你……赐你
  rationale: לָךְ 标示受益者或间接宾语；汉语按搭配分别用“使你”和“赐你”表达。
