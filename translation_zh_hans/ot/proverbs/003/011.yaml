  text: מוּסַ֣ר יְ֭הוָה בְּנִ֣/י אַל תִּמְאָ֑ס וְ/אַל תָּ֝קֹ֗ץ בְּ/תוֹכַחְתּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/011.yaml
  text: My son[a], do not despise Yahweh’s discipline, and do not loathe his reproof.
translation:
  language: zh_hans
  text: 我儿，不可轻看耶和华的管教，也不可厌烦[a]他的责备。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “厌烦”也可译作“厌恶”。原文动词既可表示反感、厌恶，也可表示变得不耐烦或疲倦。
    reason: lexical_alternative
lexical_decisions:
- source_word: מוּסַר
  choice: 管教
  rationale: 在智慧文学中指带有纠正和塑造作用的训练；“管教”既保留纠正性，也比单纯的“教导”更贴合语境。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的专名“耶和华”表达希伯来文四字神名，而不以称号替代。
- source_word: בְּנִי
  choice: 我儿
  rationale: 原文是阳性单数的亲切直接称呼；“我儿”保留智慧教师如父亲训诲儿子的文学语境。
- source_word: אַל תִּמְאָס
  choice: 不可轻看
  rationale: מָאַס含拒斥、蔑视之意；“轻看”自然地表达不重视乃至蔑弃管教的态度。
- source_word: תָּקֹץ
  choice: 不可厌烦
  rationale: קוּץ可表示厌恶、烦躁或疲倦；“厌烦”保留这种语义幅度，不把它限定为强烈憎恶。
- source_word: בְּתוֹכַחְתּוֹ
  choice: 他的责备
  rationale: תּוֹכַחַת指指出过错的言语纠正；“责备”通顺庄重，并与范围较广的“管教”有所区分。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用以色列之神的专名。中文正文采用广为人知且作为专名使用的“耶和华”，不以“主”等称号代替；“雅威”是另一种较接近学术重构读音的译法。
- issue: קוּץ 的情感强度
  choice: 厌烦
  alternative: 厌恶
  rationale: 该动词既可指反感厌恶，也可指因不耐而厌烦。正文选“厌烦”以保留可能的疲倦、不耐之意，脚注说明较强的理解。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“我儿”保留箴言中父亲式训诲的语气；两个“不可”再现希伯来文平行句式。
