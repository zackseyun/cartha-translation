id: PRO.3.34
reference: Proverbs 3:34
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אִם לַ/לֵּצִ֥ים הֽוּא יָלִ֑יץ ו/ל/עניים יִתֶּן חֵֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/034.yaml
  text: Surely he scoffs at scoffers[a], but gives favor[b] to the humble[c].
translation:
  language: zh_hans
  text: 他确实讥诮那些讥诮人的[a]，却赐恩惠[b]给谦卑的人[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“嘲弄那些嘲弄人的”。希伯来文在“讥诮人的”和“讥诮”中重复使用同一词根。
    reason: lexical_alternative
  - marker: b
    text: 或译“恩典”。
    reason: lexical_alternative
  - marker: c
    text: 或译“贫穷的人”“困苦的人”或“卑微的人”。这个词可指社会地位或处境低微的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: 确实
  rationale: 此处 אִם 表示强调、确认，而非引出条件句；“确实”自然表达箴言对上帝一贯作为的断言。
- source_word: לַלֵּצִים / יָלִיץ
  choice: 讥诮那些讥诮人的
  rationale: 用同一汉语词根复现希伯来文 לוץ 的刻意重复，并保留以其人之道回应讥诮者的对称意味。
- source_word: הוּא
  choice: 他
  rationale: 保留原文明确的代词，不擅自补出“耶和华”或“上帝”；所指由上下文确定。
- source_word: וְלַעֲנִיִּים
  choice: 却……给谦卑的人
  rationale: 在与讥诮者的对照中，“谦卑的人”最能表达此处品格与处境兼具的低微含义；“贫穷的人”“受苦的人”等可能含义收入脚注。
- source_word: יִתֶּן
  choice: 赐
  rationale: 未完成式在箴言中表达惯常、恒常的作为；汉语用不标时态的“赐”即可自然呈现。
- source_word: חֵן
  choice: 恩惠
  rationale: “恩惠”兼顾 חֵן 的善意、眷顾之义，适合智慧文学语境，也不必将其限定为后来的专门神学术语。
theological_decisions:
- issue: 代词 הוּא 的所指
  choice: 正文保留“他”，由上下文理解为上帝。
  alternative: 在正文明确译作“耶和华”或“上帝”。
  rationale: 原文此节使用代词而非神名；保留代词既忠于措辞，也避免增添原文没有的词。
- issue: עֲנִיִּים 在本节的含义
  choice: 译作“谦卑的人”。
  alternative: “贫穷的人”“困苦的人”“卑微的人”。
  rationale: 与“讥诮人的”相对时，语境主要凸显谦卑的姿态；但该词也可指社会地位低下或身处困苦者，因此在脚注保留语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“讥诮那些讥诮人的”略带修辞重复，是为保留希伯来文的词根呼应；“却”清楚呈现两分句的反向对照。
