  yaml_path: translation/ot/proverbs/003/031.yaml
  text: Do not envy a violent man[a], and do not choose any of his ways.
translation:
  language: zh_hans
  text: 不要嫉妒行强暴的人[a]，也不要选择他所走的任何道路。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不要羡慕行强暴的人。”希伯来语动词在这里可表示“嫉妒”或“羡慕”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תְּקַנֵּא
  choice: 不要嫉妒
  rationale: אַל与未完成式构成禁令；“不要”是自然的现代汉语表达。קנא在此表示因他人境况而产生嫉妒或羡慕，“嫉妒”保留了其可能带有敌意或不满的语义范围。
- source_word: בְּאִישׁ חָמָס
  choice: 强暴的人
  rationale: אִישׁ指“人、男人”，חָמָס涵盖暴力、残害和不义；“强暴的人”简洁地表达以暴力和不义为特征的人，同时保持智慧文学的庄重语体。
- source_word: וְאַל תִּבְחַר
  choice: 也不要选择
  rationale: 第二个אַל继续表达禁止，וְ连接两个平行劝诫；בחר的基本义为“选择”。
- source_word: בְּכָל דְּרָכָיו
  choice: 他的任何道路
  rationale: דרך在智慧文学中常以“道路”比喻人的行为方式或生活道路。否定语境中的כָל自然译为“任何”，表明他的道路一条也不可选择。
theological_decisions: []
