  text: Her ways are ways of pleasantness[a], and all her paths are peace.
translation:
  language: zh_hans
  text: 她的道路是怡人的道路；她的一切路径都平安[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “平安”也可译为“安好”“福祉”或“完整”；希伯来语 שָׁלוֹם 所指不只是没有冲突。
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּרָכֶיהָ
  choice: 她的道路
  rationale: דֶּרֶךְ既可指实际道路，也可比喻生活方式或行事道路；保留“道路”意象，并以阴性代词“她”承接上文的智慧。
- source_word: דַרְכֵי
  choice: 是愉悦的道路
  rationale: 原文重复“道路”，形成“她的道路是……的道路”的强调结构；译文保留这一重复及其诗歌节奏。
- source_word: נֹעַם
  choice: 愉悦
  rationale: נֹעַם表示悦人、宜人、可喜；“愉悦”在此能表达道路令人欣然的性质，又不把含义局限为短暂的感官享受。
- source_word: וְכָל
  choice: 她的一切……尽都
  rationale: 用“一切”保留כָל的周遍意义，并以“尽都”使汉语诗句流畅，突出无一例外。
- source_word: נְתִיבוֹתֶיהָ
  choice: 路径
  rationale: נְתִיבָה指路径、轨迹，与דֶּרֶךְ构成诗歌平行；译作“路径”既区分两个近义词，也保留行路意象。
- source_word: שָׁלוֹם
  choice: 平安
  rationale: שָׁלוֹם可涵盖和平、安好、福祉与完整；“平安”是自然且传统的核心译法，较宽的语义范围用脚注说明。
