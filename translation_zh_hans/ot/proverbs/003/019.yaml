  text: יְֽהוָ֗ה בְּ/חָכְמָ֥ה יָֽסַד אָ֑רֶץ כּוֹנֵ֥ן שָׁ֝מַ֗יִם בִּ/תְבוּנָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/019.yaml
  text: Yahweh founded the earth by wisdom[a]; he established the heavens by understanding.
translation:
  language: zh_hans
  text: 耶和华以智慧奠定大地[a]，以聪明立定诸天。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“带着智慧……带着聪明。”希伯来语介词既可表示所凭借的手段，也可表示伴随；这里正文按创造所凭借的方式来译。
    reason: 保留介词 בְּ־ 在工具义与伴随义之间的词义可能。
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经语境中通行的神名音译“耶和华”，使之区别于“主”这一称号，并保留原文专名的功能。
- source_word: בְּחָכְמָה
  choice: 以智慧
  rationale: 介词 בְּ־ 在这里最自然地表示凭借的手段；“以智慧”既简洁庄重，也与下半句“以聪明”形成平行。
- source_word: יָסַד
  choice: 奠定
  rationale: 该动词有奠基、建立之意；“奠定大地”保留原文的建造或奠基意象，同时符合现代书面汉语。
- source_word: אָרֶץ
  choice: 大地
  rationale: 本节处于宇宙创造语境，所指是与诸天相对的大地，而非某一特定地域。
- source_word: כּוֹנֵן
  choice: 立定
  rationale: 该词表达稳固设立之意；“立定”保留其坚定、安置的意味，并避免与前句“奠定”完全同词。
- source_word: שָׁמַיִם
  choice: 诸天
  rationale: “诸天”体现希伯来语的复数形式，并与“大地”构成庄重而自然的宇宙性对应。
- source_word: בִּתְבוּנָה
  choice: 以聪明
  rationale: תְּבוּנָה 指理解力、洞察力或明辨；在箴言的智慧词汇中，“聪明”自然易懂，也与“智慧”保持相关而不完全等同。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用四字神名而非“主”的称号。中文采用广为人知的专名“耶和华”，既保留专名性质，也便于普通现代读者识别。
- issue: 智慧在创造中的语法关系
  choice: 理解为上帝创造时所凭借的方式或手段
  alternative: 理解为与智慧相伴而创造
  rationale: 介词 בְּ־ 可表示手段，也可表示伴随；本节上下两行的平行结构及创造语境较支持工具性译法，但脚注保留伴随义的可能。
translation_notes:
  register: 采用简洁、庄重而通顺的现代标准汉语；以“奠定／立定”和“大地／诸天”保存希伯来诗歌的平行结构与建造意象。
