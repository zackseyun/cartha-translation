base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/023.yaml
  text: Then you will walk securely on your way[a], and your foot will not stumble.
translation:
  language: zh_hans
  text: 那时，你必安然走你的路[a]，你的脚也不会绊倒。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“平安地走你的路。”希伯来语可表示“安稳地”或“安全地”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: 那时
  rationale: 表示承接上文而来的时间或结果；“那时”简洁自然，也保留经文的推进关系。
- source_word: תֵּלֵךְ
  choice: 你必……走
  rationale: הלך可指“行走”或“前往”；此处与“路”和“脚”相呼应，也延续《箴言》的道路意象。
- source_word: לָבֶטַח
  choice: 安然
  rationale: 表达安全、稳妥的状态，侧重客观上的平安无虞，而非仅仅主观自信。
- source_word: דַּרְכֶּךָ
  choice: 你的路
  rationale: דֶּרֶךְ既可指实际道路，也可指人生道路；此译保留两层可能。
- source_word: וְרַגְלְךָ
  choice: 你的脚也
  rationale: 保留希伯来文单数“脚”，并用“也”自然连接平行分句。
- source_word: לֹא תִגּוֹף
  choice: 不会绊倒
  rationale: נגף在此描写脚碰撞而失足；“绊倒”符合现代汉语表达，并保持安全行路的意象。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“安然走你的路”兼顾字面行路与智慧文学中人生道路的隐喻；“必……不会……”自然表达希伯来语未完成式在此语境中的结果或应许意味。
