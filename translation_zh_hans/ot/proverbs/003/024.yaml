  text: If you lie down[a], you will not be afraid; when you lie down, your sleep will be pleasant.
translation:
  language: zh_hans
  text: 你若躺下，必不惧怕；你躺下，必睡得香甜。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你的睡眠必香甜。”
    reason: “睡得香甜”是较自然的汉语表达；此译法较直接保留原文“你的睡眠”作主语及“甘甜”的意象。
lexical_decisions:
- source_word: אִם
  choice: 若
  rationale: 保留条件或情境意味；在智慧文学的普遍劝勉中，也自然涵盖“当……时”的语感。
- source_word: תִּשְׁכַּב
  choice: 躺下
  rationale: 贴近 שׁכב 的基本含义，并在本节语境中自然指躺下睡觉。
- source_word: לֹא תִפְחָד
  choice: 必不惧怕
  rationale: 否定式未完成体在这里表达结果性的确信，而非命令；“必不惧怕”简洁而庄重。
- source_word: וְשָׁכַבְתָּ
  choice: 你躺下
  rationale: 保留原文重复“躺下”所形成的平行和强调；汉语分句已能传达承接关系，无须把连接词解释得过强。
- source_word: וְעָרְבָה
  choice: 必……香甜
  rationale: ערב 在此表示甘美、愉悦；与“睡”搭配时，“睡得香甜”是现代汉语自然说法，同时保留原文的感官意象。
- source_word: שְׁנָתֶךָ
  choice: 睡得
  rationale: 原文直指“你的睡眠”；汉语用“睡得香甜”比“你的睡眠必香甜”更自然，意义不变。
theological_decisions: []
translation_notes:
