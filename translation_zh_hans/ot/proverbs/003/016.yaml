  text: אֹ֣רֶךְ יָ֭מִים בִּֽ/ימִינָ֑/הּ בִּ֝/שְׂמֹאולָ֗/הּ עֹ֣שֶׁר וְ/כָבֽוֹד׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/016.yaml
  text: Length of days is in her right hand[a]; in her left hand are riches and honor.
translation:
  language: zh_hans
  text: '她右手握着长寿，

    左手握着财富和尊荣。'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֹרֶךְ יָמִים
  choice: 长寿
  rationale: 此构造短语直译为“日子的长久”，实际表达寿命长久；现代汉语用“长寿”自然、准确，也适合箴言的凝练诗体。
- source_word: בִּימִינָהּ
  choice: 她右手握着
  rationale: 介词 בְּ 描绘智慧人格化地把福益持在手中。译作“握着”比生硬的“在她右手中”更符合现代汉语，同时保留持有的意象及阴性指代。
- source_word: בִּשְׂמֹאולָהּ
  choice: 左手握着
  rationale: 与“右手握着”构成整齐的诗歌平行；主语“她”可由上句承接，避免汉语中不必要的重复。
- source_word: עֹשֶׁר
  choice: 财富
  rationale: 指物质上的富足；“财富”是自然、庄重的现代汉语，并能与“尊荣”顺畅并列。
- source_word: כָבוֹד
  choice: 尊荣
  rationale: 在此智慧文学语境中主要指受人敬重的地位或荣誉，而非神学意义较强的“荣耀”；“尊荣”保持了诗体的庄重感。
theological_decisions:
- issue: 阴性后缀的所指
  choice: 用“她”指代上下文中人格化的智慧
  alternative: 把阴性表达弱化为无性别的“它”或省去全部指代
  rationale: 希伯来语阴性后缀承接上下文中人格化的“智慧”。保留“她”呈现这一文学手法，但不将其解释为关于女性神祇的教义陈述。
translation_notes:
  register: 采用凝练、对称而自然的现代标准汉语。“右手……左手……”保留原文的平行结构；“握着”明确呈现人格化智慧手持福益的诗歌图景。原文短语 אֹרֶךְ יָמִים 的惯用意义可直接由“长寿”充分表达，因此无需脚注。
