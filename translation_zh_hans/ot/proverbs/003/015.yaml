  text: יְקָ֣רָה הִ֭יא מ/פניים וְ/כָל חֲ֝פָצֶ֗י/ךָ לֹ֣א יִֽשְׁווּ בָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/015.yaml
  text: She is more precious than jewels[a], and none of your delights can compare with her.
translation:
  language: zh_hans
  text: 她比珠宝[a]更宝贵；你所喜爱的一切，都不能与她相比。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“红宝石”“珍珠”或“珊瑚”；希伯来词所指的具体贵重物品不能确定。
    reason: 词义所指不确定，需保留传统译法及其他可能。
lexical_decisions:
- source_word: יְקָרָה
  choice: 更宝贵
  rationale: 该形容词表示珍贵、价值高；与比较介词 מִן 连用，译作“更宝贵”准确而自然。
- source_word: הִיא
  choice: 她
  rationale: 阴性单数代词承接上文拟人化的“智慧”，用“她”保留原文的人格化表达。
- source_word: מִפְּנִינִים
  choice: 比珠宝
  rationale: פְּנִינִים 指贵重宝石或珠宝，但具体种类不能确定；“珠宝”既传达价值，也避免武断限定为红宝石、珍珠或珊瑚。
- source_word: וְכָל חֲפָצֶיךָ
  choice: 你所喜爱的一切
  rationale: חֵפֶץ 可指人所喜爱、渴望的事物；此译法保留“你”和“全部”的范围，又避免仅译成主观的欲望。
- source_word: לֹא יִשְׁווּ בָּהּ
  choice: 都不能与她相比
  rationale: שוה 在此表示相等、匹敌；结合否定词，现代汉语用“都不能与她相比”自然地表达没有一样能及得上她。
theological_decisions:
- issue: 智慧的阴性拟人化
  choice: 以“她”指智慧
  alternative: 以“它”指智慧
  rationale: 原文采用阴性单数代词，语境又将智慧人格化；“她”保留这种文学和神学张力，但不进一步把智慧等同于某一特定人物。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“你所喜爱的一切”兼顾原文 כָל 的整体范围和 חֲפָצֶיךָ 所指的可喜爱之物；分号呈现两个平行比较分句。
