  text: וּ/מְצָא חֵ֖ן וְ/שֵֽׂכֶל ט֑וֹב בְּ/עֵינֵ֖י אֱלֹהִ֣ים וְ/אָדָֽם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/004.yaml
  text: Then you will find favor and good sense in the eyes of God and man[a].
translation:
  language: zh_hans
  text: 这样，你必在上帝和世人[a]眼中蒙恩宠，显为明智。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文作“人”（אָדָם），这里泛指人类，与上帝相对。
    reason: 说明希伯来语单数集合名词的广义所指。
lexical_decisions:
- source_word: וּמְצָא
  choice: 这样，你必……蒙
  rationale: מְצָא在形态上是阳性单数祈使式，与前文一连串劝勉相接；在本节语境中，它表达遵行前述教导所带来的结果。译作“这样，你必……”既保留与上文的衔接，也以自然汉语表达结果意味。
- source_word: חֵן
  choice: 恩宠
  rationale: חֵן指蒙悦纳、得好感；“恩宠”适合“在……眼中”这一评价语境，也避免把它限定为某种特定的系统神学术语。
- source_word: וְשֵׂכֶל טוֹב
  choice: 被看为明智
  rationale: שֵׂכֶל可指见识、悟性、审慎，也可能在此语境中带有良好评价或美誉的意味。“被看为明智”保留其认知与品格层面的含义，同时使它与“在……眼中”在现代汉语中自然衔接；不采用偏向外在成果的“成功”。
- source_word: בְּעֵינֵי
  choice: 在……眼中
  rationale: 保留希伯来语以“眼中”表示评价和看法的惯用意象；这一表达在现代汉语中同样自然。
- source_word: אֱלֹהִים
  choice: 上帝
  rationale: 此处指独一的上帝，与人类一方并列对照。
- source_word: וְאָדָם
  choice: 和世人
  rationale: אָדָם在这里不是专指某一男性，而是与上帝相对的人类一方。“世人”准确表达其集合性、普遍性含义，并保持简洁。
theological_decisions:
- issue: אָדָם作为代表全人类的用法
  choice: 世人
  alternative: 人／人类
  rationale: 本句对照的是上帝的评价与人间的评价，并非强调男性身份。“世人”在现代汉语中既准确又自然；脚注说明原文用词及其范围。
- issue: שֵׂכֶל טוֹב的含义
  choice: 被看为明智
  alternative: 有美好的见识／得美誉／获得成功
  rationale: 该词组容许“良好见识、明智”以及由此而来的良好评价等理解。正文采用能兼顾智慧语境和“在……眼中”结构的译法，不把它收窄为物质或处境上的成功。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“蒙恩宠”保留智慧文学的凝练语气；“被看为明智”使希伯来语的评价结构在汉语中清楚自然。
