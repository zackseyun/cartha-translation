source:
  edition: WLC
  text: חֶ֥סֶד וֶ/אֱמֶ֗ת אַֽל יַעַ֫זְבֻ֥/ךָ קָשְׁרֵ֥/ם עַל גַּרְגְּרוֹתֶ֑י/ךָ כָּ֝תְבֵ֗/ם עַל ל֥וּחַ לִבֶּֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/003.yaml
  text: Let steadfast love and faithfulness not forsake you[a]; bind them around your neck; write them on the tablet of your heart.
translation:
  language: zh_hans
  text: 不可让慈爱和信实离开你[a]；要把它们系在你的颈项上，写在你的心版上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“怜悯和真实”。这对希伯来词常表达忠贞的爱与可靠、可信的品格。
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶסֶד
  choice: 慈爱
  rationale: 该词常指以忠诚和恩慈表现出来的坚定之爱。“慈爱”在现代中文中自然庄重，也能保留爱与恩慈的关系性内涵；其忠贞维度由并列的“信实”及脚注说明补足。
- source_word: אֱמֶת
  choice: 信实
  rationale: 在 חֶסֶד וֶאֱמֶת 这一固定搭配中，本词侧重可靠、忠诚，而非仅指抽象的事实真理；“信实”最能切合这里的伦理劝诫。
- source_word: אַל יַעַזְבֻךָ
  choice: 不可让……离开你
  rationale: 保留原文以“慈爱和信实”为拟人化主语的表达，同时用现代汉语清楚传达 אַל 加未完成式所具有的禁戒、劝诫语气。
- source_word: קָשְׁרֵם
  choice: 把它们系在
  rationale: “系”保留具体动作和刻意持守的隐喻，也与颈项上佩戴物件的图像自然搭配。
- source_word: גַּרְגְּרוֹתֶיךָ
  choice: 你的颈项上
  rationale: 该词指喉咙或颈部；在这里是把训诲如饰物般系于颈项的图像。“颈项”庄重而易懂，并比“喉咙”更符合语境。
- source_word: כָּתְבֵם
  choice: 写
  rationale: 直接保留命令式及书写隐喻；现代中文清楚自然，无须提升为较生僻的“铭刻”。
- source_word: לוּחַ לִבֶּךָ
  choice: 你的心版
  rationale: “版”保留 לוּחַ 作为书写板面的具体形象，“心版”则凝练表达将这些品格内化于内心，避免将隐喻淡化为单纯的记忆。
theological_decisions:
- issue: 如何译出 חֶסֶד וֶאֱמֶת 这一成对表达
  choice: 慈爱和信实
  alternative: 怜悯和真理；忠贞之爱和真实
  rationale: 这一词对兼具关系性和伦理性，常表达坚定的爱与可靠忠诚。“慈爱和信实”既符合本节劝诫语境，也不把词义限缩为对困苦者的“怜悯”或抽象命题意义上的“真理”；脚注保留其他可能译法及盟约忠诚的语义背景。
translation_notes:
  register: 采用现代、庄重而通顺的劝诫语体。以“不可……；要……”体现前后命令结构；保留颈项和心版两个相互呼应的具体隐喻，并保留原文中慈爱、信实仿佛能离开人的拟人表达。
