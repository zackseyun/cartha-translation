  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: מְאֵרַ֣ת יְ֭הוָה בְּ/בֵ֣ית רָשָׁ֑ע וּ/נְוֵ֖ה צַדִּיקִ֣ים יְבָרֵֽךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/033.yaml
  text: Yahweh’s curse is on the house of the wicked[b][a], but he blesses the dwelling of the righteous.
translation:
  language: zh_hans
  text: 雅威的咒诅临到恶人的家[a]，他却赐福给义人的居所[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在恶人的家中。”希伯来文介词可如此直译；正文“临到”更自然地表达咒诅落在其家之上的意思。
    reason: lexical_alternative
  - marker: b
    text: “居所”也可译作“住处”或“家园”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מְאֵרַת
  choice: 咒诅
  rationale: 该名词指咒诅或受咒诅的状态；“咒诅”直接而自然，也保留了本句严肃的审判意味。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文四字神名的通行学术拟音译出其专名，不以“主”这一称号替代。
- source_word: בְּבֵית
  choice: 临到……的家
  rationale: 介词 ב 可直译为“在……中”，但与“咒诅”搭配时，“临到……的家”更自然地表达咒诅落在并停留于一个家之上的含义，同时以脚注保留较直译的可能。
- source_word: רָשָׁע
  choice: 恶人
  rationale: 原文虽为单数，却在智慧文学中作泛指，代表恶人这一类人；汉语“恶人”同样可以作类称。
- source_word: וּנְוֵה
  choice: 却……居所
  rationale: נָוֶה 指住处、居所或家园；“居所”保留具体空间意象。连接词在两分句的对照关系中自然译为“却”。
- source_word: צַדִּיקִים
  choice: 义人
  rationale: 复数形容词在此作名词使用，指行义的一类人；汉语“义人”可自然表达集合性的类别。
- source_word: יְבָרֵךְ
  choice: 赐福
  rationale: 未完成式在箴言中表达恒常、普遍的事实，不必限定为将来；“赐福”符合现代汉语宗教语境，也与前句“咒诅”形成清楚对照。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用以色列上帝的专名。译作“雅威”旨在按较通行的拟音保留专名，而不以称号“主”代替；“耶和华”是汉语传统中常见的另一种音译。
- issue: רָשָׁע 的单数形式是否指特定男性
  choice: 恶人（泛指）
  alternative: 一个恶人；邪恶的男人
  rationale: 本节是概括性的智慧格言，单数具有代表性，并非强调某一特定男子；“恶人”既保留单数形式的简洁，也能在汉语中泛指这一类人。
- issue: 祝福所指向的是建筑还是家庭
  choice: 保留“家／居所”的空间意象
  alternative: 家人；家庭
  rationale: 原文使用 בַּיִת 与 נָוֶה 两个住所词，可能连带包含住在其中的家庭，但并未明说仅指家人；因此不把含义缩窄为家庭成员。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。两分句以“却”突出箴言式对照；“临到”与“赐福”使谓语关系清楚，同时保留“家／居所”的平行意象。
