revisions:
- from: 因为从她所得的收益，胜过从银子所得的收益；她所结的果实，胜过精金。[a]
  to: 因为她的收益胜过银子交易的收益；她的出产胜过精金。[a]
  rationale: 修订直接呈现智慧人格化“她”的收益和出产，分别保留原文前半的商业意象与后半的出产意象；“银子交易的收益”明确译出比较对象，而“精金”及其脚注保留 חָרוּץ 的词义范围。
