  yaml_path: translation/ot/proverbs/003/014.yaml
  text: for her profit is better than the profit of silver[b][a], and her yield than gold.
translation:
  language: zh_hans
  text: 因为她的收益胜过银子交易的收益；她的出产胜过精金。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “精金”也可译作“黄金”；原文所用的词可指格外贵重或经过精炼的金子。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文对智慧之人的称许，说明其有福的缘由。
- source_word: טוֹב
  choice: 胜过
  rationale: 该词与比较介词 מִן 连用，表达“比……更好”，译为“胜过”自然凝练。
- source_word: סַחְרָהּ
  choice: 从她所得的收益
  rationale: 保留商业获益的比喻，并以阴性代词“她”呼应上文人格化的智慧。
- source_word: מִסְּחַר כָּסֶף
  choice: 从银子所得的收益
  rationale: 原文并非仅说“银子”，而是将智慧带来的收益与银子交易所带来的收益相比较；重复“收益”可保留平行结构和商业意象。
- source_word: כָּסֶף
  choice: 银子
  rationale: 按其在贵重金属比较语境中的通常含义翻译。
- source_word: וּמֵחָרוּץ
  choice: 胜过精金
  rationale: חָרוּץ 在智慧文学中指贵重的金子，并可含精选或精炼之意；“精金”简洁保留这一语义色彩。
- source_word: תְּבוּאָתָהּ
  choice: 她所结的果实
  rationale: 保留原词关于出产、收成的意象，同时在现代汉语中自然表达智慧所带来的成果。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。以“收益”保留前半句的商业意象，以“所结的果实”保留后半句的出产意象；“她”承接上下文中人格化的智慧。
