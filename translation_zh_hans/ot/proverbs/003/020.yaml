  text: בְּ֭/דַעְתּ/וֹ תְּהוֹמ֣וֹת נִבְקָ֑עוּ וּ֝/שְׁחָקִ֗ים יִרְעֲפוּ טָֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/020.yaml
  text: By his knowledge the depths were split open[b][a], and the clouds drip dew.
translation:
  language: zh_hans
  text: 他以知识使深渊[a]裂开；云层[b]滴下露水。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“深水”或“深处的水域”。
    reason: lexical_alternative
  - marker: b
    text: 或译“天空”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּדַעְתּוֹ
  choice: 因他的知识
  rationale: 介词 בְּ 在这里表示凭借或手段；“因他的知识”简洁自然，并保留工具性含义。
- source_word: תְּהוֹמוֹת
  choice: 深渊
  rationale: 该复数名词指深处的水域或原初深水；“深渊”保留宏大的宇宙意象，又符合现代汉语表达。
- source_word: נִבְקָעוּ
  choice: 裂开
  rationale: Nifal 词形表达被动或自发裂开的景象；汉语“裂开”无需另加被动标记，也能传达鲜明意象。
- source_word: וּשְׁחָקִים
  choice: 云层
  rationale: 该词可指天空或云；下文说滴下露水，因此正文采用“云层”，同时以脚注保留“天空”的可能。
- source_word: יִרְעֲפוּ
  choice: 滴下
  rationale: 该动词表示滴落、滴注；“滴下”与露水相配，保留轻柔而非倾盆而下的意味。
- source_word: טָל
  choice: 露水
  rationale: 这是 טָל 在本语境中的标准、清楚译法。
theological_decisions:
- issue: 创造与护理的宇宙意象
  choice: 保留神以知识使深渊裂开、使云层滴露的诗性描述
  alternative: 将本节仅理解为创造之初，或仅理解为持续掌管天气
  rationale: 箴言3:19–20的语境将智慧和知识与世界秩序相连；直译诗性意象，既不把它限定为一次性的创造事件，也不排除神持续的护理。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“深渊裂开，云层滴下露水”保持希伯来诗歌的平行结构与宇宙图景；代词“他”承接上文的耶和华，不在本节额外补明，以免超出原文。
