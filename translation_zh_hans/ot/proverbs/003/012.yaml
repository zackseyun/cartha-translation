base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/012.yaml
  text: For Yahweh reproves the one he loves[b][a], as a father the son in whom he delights.
translation:
  language: zh_hans
  text: 因为雅威责备他所爱的人[a]，正如父亲责备自己所喜爱的儿子[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “责备”也可译作“纠正”。这个希伯来语动词侧重指出过错并加以纠正；结合上下文，也包含管教的意味。
    reason: lexical_alternative
  - marker: b
    text: 或译：“又如父亲对自己所喜爱的儿子那样。”原文后半句为比较结构；正文按前句承接“责备”。“所喜爱的”也可理解为“所悦纳的”或“所恩待的”。
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上一节，说明不可厌弃雅威管教的理由；“因为”清楚呈现因果关系。
- source_word: אֶת אֲשֶׁר יֶאֱהַב
  choice: 他所爱的人
  rationale: 保留关系结构和单数个人指向，以自然现代汉语表达雅威对受责备者的爱。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来语四字神名的通行现代汉语音译处理，保留其专名性质，而不以称号代替。
- source_word: יוֹכִיחַ
  choice: 责备
  rationale: 该词使役式的核心含义是指出过错、加以纠正；“责备”保留直接的规劝意味，较“管教”更贴近本词的具体词义。
- source_word: וּכְאָב
  choice: 如同父亲
  rationale: 将连接词与比较前缀自然译为比喻结构，同时保留原文明确的父亲形象。
- source_word: בֵּן
  choice: 儿子
  rationale: 原文明确使用阳性单数“儿子”，故不泛化为“孩子”。
- source_word: יִרְצֶה
  choice: 所喜爱的
  rationale: 此处表示悦纳、喜爱或恩待；“所喜爱的”与前半句的爱相呼应，又自然表达父亲对儿子的悦纳。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文使用神的专名；“雅威”较直接地音译该名，并避免用称号替代。
- issue: 父子性别意象
  choice: 父亲……儿子
  alternative: 父母……孩子
  rationale: 保留原文明确的男性单数亲属用语，不将具体比喻中性化。
- issue: 神圣纠正的具体含义
  choice: 责备
  alternative: 纠正；管教
  rationale: 本节动词直接强调指出过错并纠正；上下文虽涉及更广义的管教，本节仍不把较宽泛概念直接代入该动词。
- issue: 后半句省略成分
  choice: 补出“责备”
  alternative: 又像父亲待他所喜爱的儿子
  rationale: 希伯来语后半句省略谓语，通常由前句承接“责备”；正文补出可使汉语完整，脚注保留不明确补出谓语的读法。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。句式保留箴言的因果论证和父子比喻；正文为汉语通顺而补出后半句省略的“责备”，并以脚注保存原文的句法与词义张力。
