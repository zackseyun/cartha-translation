  text: then your barns will be filled with abundance[a], and your vats will burst with new wine.
translation:
  language: zh_hans
  text: '这样，你的仓房必充满丰裕的粮食；

    你的酒池必因新酒盈溢。[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “盈溢”直译可作“冲破而出”或“迸出”，强调新酒多得满溢。
    reason: lexical_alternative
lexical_decisions:
- source_word: יִמָּלְאוּ
  choice: 必充满
  rationale: 该词为מלא的未完成式尼法勒形态，表达仓房将达到被装满的结果；“必充满”既保留结果意味，也符合箴言应许式语气。
- source_word: אֲסָמֶיךָ
  choice: 你的仓房
  rationale: אֹסֶם指储存粮食或农产的建筑；“仓房”自然、具体，并保留农业图景。
- source_word: שָׂבָע
  choice: 丰盛
  rationale: 该名词可表达饱足、充裕；在“仓房必充满”之后译作“丰盛”，传达物产充足而不拘泥于生硬的“饱足”。
- source_word: תִירוֹשׁ
  choice: 新酒
  rationale: תִּירוֹשׁ通常指新酿或新鲜的葡萄酒；“新酒”保留它与一般“酒”的词义区别及收获季节的意象。
- source_word: יְקָבֶיךָ
  choice: 你的酒池
  rationale: יֶקֶב指压榨葡萄及承接汁液所用的池槽；“酒池”比泛称“池子”更清楚，也与新酒的语境相合。
- source_word: יִפְרֹצוּ
  choice: 涌流
  rationale: פרץ基本意象是冲破、迸出；在酒池的语境中，“涌流”自然地表达因极其充盈而向外溢出的强烈动态。
theological_decisions:
- issue: 丰收应许的性质
  choice: 按原文保留仓房和酒池充盈的具体农业丰收图景
  alternative: 将其概括解释为非物质性的普遍祝福
  rationale: 原文直接描绘粮仓与新酒的丰盛；译文不预先判定这一智慧应许是否是无条件、机械化地适用于每个个体，也不将其淡化为纯粹比喻。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“这样”承接上一节的条件与结果关系；两行平行结构保留希伯来诗歌的对称感。
