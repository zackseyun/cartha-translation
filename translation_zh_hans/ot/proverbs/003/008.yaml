base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/008.yaml
  text: It will be healing to your body and refreshment to your bones[a][b].
translation:
  language: zh_hans
  text: 这必成为你身体[a]的医治，你骨头的滋润[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“成为你肚脐的医治。”这里的希伯来词可特指肚脐，但在本句中也可能较广泛地指整个身体的健康。
    reason: lexical_alternative
  - marker: b
    text: 或译：“你骨头的水分”或“你骨头的滋养”。
    reason: lexical_alternative
lexical_decisions:
- source_word: רִפְאוּת
  choice: 得医治
  rationale: 该名词表示医治、康复或健康恢复；译作“得医治”既体现结果，也保留原文具体的身体意象。
- source_word: תְּהִי
  choice: 这必使
  rationale: 此处为与阴性名词 רִפְאוּת 呼应的未完成式，也可带祈愿色彩；结合上文劝诫，主要表达随之而来的结果，因此译作“这必使”。
- source_word: לְשָׁרֶּךָ
  choice: 你的身体
  rationale: שֹׁר 传统上可指“肚脐”，但此处很可能以身体中心代指整体身体状况；正文采用自然清楚的“身体”，并以脚注保留较具体的词义。
- source_word: וְשִׁקּוּי
  choice: 得滋润
  rationale: 该词源于给水喝、使湿润的概念，与“骨头”搭配时描绘恢复活力；“得滋润”保留水分意象，同时符合现代汉语表达。
- source_word: לְעַצְמוֹתֶיךָ
  choice: 你的骨头
  rationale: 直译为“你的骨头”；骨头在希伯来表达中也可代表人的内在体魄和生命力，正文保留这一具体意象。
theological_decisions:
- issue: 应许语气的力度
  choice: 译作“必使”，表达劝诫之后通常而确定的结果
  alternative: 译作“愿……成为”或“会使”
  rationale: תְּהִי 在形式上可能带祈愿色彩，但箴言语境更自然地将本节理解为前述敬畏耶和华、远离恶事所产生的结果；本译法不将智慧格言扩展为脱离语境的无条件医疗保证。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“得医治”与“得滋润”形成平行结构；正文以“身体”传达上下文中的整体含义，同时用脚注保留“肚脐”这一真实的词义可能。
