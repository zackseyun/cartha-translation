  yaml_path: translation/ot/proverbs/003/027.yaml
  text: Do not withhold good from those to whom it is due when it is in your power to do it[a][b].
translation:
  language: zh_hans
  text: 不可扣留应给人的好处；当你有能力这样做时。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “应给人的好处”原文直译为“从它的主人”；“当你有能力这样做时”直译为“当你的手有能力去做时”。
    reason: 保留בְּעָלָיו“主人／有权者”的字面意象，以及לְאֵל יָדֶךָ中“手”表示能力的隐喻。
lexical_decisions:
- source_word: אַל תִּמְנַע
  choice: 不可推辞
  rationale: 希伯来语否定词与动词构成禁令；“不可推辞”自然表达不应扣留或拒绝给予之意。
- source_word: טוֹב
  choice: 行善
  rationale: טוֹב含义宽泛，可指好处、善行或益处；结合לַעֲשׂוֹת（去做），译作“行善”在现代汉语中自然，同时不把范围局限于财物或某一种善举。
- source_word: מִבְּעָלָיו
  choice: 帮助那当得的人
  rationale: בעל字面指主人或拥有者，在此可指对这份“善”有正当要求的人；“那当得的人”传达这一习语含义，而“帮助”使中文句法完整。
- source_word: בִּהְיוֹת לְאֵל יָדֶךָ
  choice: 你若有能力
  rationale: 原文意象近于“当你的手有能力时”，表示能力或掌控范围；译作“你若有能力”简洁自然，并保留条件情境。
- source_word: לַעֲשׂוֹת
  choice: 行善
  rationale: עשה是“做、施行”；其隐含宾语承接“善”，合译为“行善”符合汉语表达。
theological_decisions:
- issue: “善的主人”所指为何
  choice: 那当得的人
  alternative: 善的主人／拥有这善的人
  rationale: 原文בְּעָלָיו保留“主人、拥有者、具有权利者”的语义张力；正文采用可理解的关系性表达，但不把经文限定为偿债、施舍或其他特定伦理场景。
translation_notes:
  register: 采用现代、庄重而易懂的箴言式表达。前置条件句使汉语流畅；“行善”保持טוֹב的广泛伦理含义。
