  text: כִּ֤י תוֹעֲבַ֣ת יְהוָ֣ה נָל֑וֹז וְֽ/אֶת יְשָׁרִ֥ים סוֹדֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/032.yaml
  text: For the crooked person is an abomination to Yahweh[a], but his counsel is with the upright.
translation:
  language: zh_hans
  text: 因为乖僻的人为雅威所憎恶；他却与正直人亲密相交[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “亲密相交”所译的希伯来语词也可指“密议”或“秘密”；直译可作“他的密议（或秘密）与正直人同在”。
    reason: 保留 סוֹד 可指隐密商议、秘密或亲密关系的词义幅度，并说明该词在原文中属于雅威。
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，为不可嫉妒强暴之人的劝诫说明理由；“因为”在现代汉语中自然明确。
- source_word: תוֹעֲבַת
  choice: 所憎恶的
  rationale: 表达某人在雅威眼中可憎、令他厌恶；既保留强烈的道德判断，也避免生硬地把人称为“可憎之物”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以常见的现代汉语音译呈现神的专名四字母词 YHWH，而非用称号替代。
- source_word: נָלוֹז
  choice: 乖僻的人
  rationale: 指偏离正直道路、品性扭曲的人；“乖僻”保留与下半句“正直人”的路径及形态对比。
- source_word: וְאֶת
  choice: 却与
  rationale: 希伯来语连词在这则对偶箴言中形成鲜明反义关系，汉语用“却”自然传达转折。
- source_word: יְשָׁרִים
  choice: 正直人
  rationale: 保留智慧文学中“弯曲”与“正直”的道德及道路意象。
- source_word: סוֹדוֹ
  choice: 推心置腹
  rationale: סוֹד兼有秘密商议、亲密圈子和知己相交等含义；“推心置腹”在自然汉语中同时传达亲近关系和隐密交流，但以脚注保留其词义范围。
theological_decisions:
- issue: סוֹד所表达的雅威与正直人之间的关系
  choice: 雅威与正直人推心置腹
  alternative: 他的密议与正直人同在；他与正直人亲密相交
  rationale: 原文既可能侧重雅威向正直人开放隐密的商议，也可能侧重他们获准进入他的亲密相交。“推心置腹”不把意思限定为单纯的信息启示或单纯的关系亲近，脚注进一步明示其真实歧义。
translation_notes:
  register: 采用现代、庄重而易懂的箴言体。“乖僻”与“正直”形成鲜明对照；“推心置腹”使原文较难直译的关系性表达在汉语中自然，同时由脚注保留其歧义。
