  text: אַשְׁרֵ֣י אָ֭דָם מָצָ֣א חָכְמָ֑ה וְ֝/אָדָ֗ם יָפִ֥יק תְּבוּנָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/013.yaml
  text: Blessed is the man who finds wisdom[a], and the man who obtains understanding.
translation:
  language: zh_hans
  text: 得着智慧的人有福了，获得聪明的人有福了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: 有福了
  rationale: 这是智慧文学中典型的称福用语，表达一种值得羡慕的蒙福状态；“有福了”既庄重，又符合现代中文圣经语体。
- source_word: אָדָם
  choice: 人
  rationale: 此处单数名词泛指任何人。现代汉语的“人”自然保留其普遍适用的含义，不必加入原文没有明确表达的男性限定。
- source_word: מָצָא
  choice: 得着
  rationale: 完成式在称福和箴言语境中表达一般性事实。“得着”既可涵盖找到，也强调实际获得，与智慧这一抽象对象搭配自然。
- source_word: חָכְמָה
  choice: 智慧
  rationale: 这是《箴言》的核心术语，标准且准确地表达明智生活与判断的能力。
- source_word: יָפִיק
  choice: 获得
  rationale: 该动词可指使之产生、汲取或取得；在与“得着智慧”平行的语境中，“获得”最自然地表达成功取得聪明。
- source_word: תְּבוּנָה
  choice: 聪明
  rationale: 此词指理解力、洞察力和辨别力。“聪明”是传统而自然的对应词，并与“智慧”形成诗歌平行。
theological_decisions:
- issue: אָדָם在称福句中的代表性所指
  choice: 译作泛指的“人”
  alternative: 译作“男子”或“这人”
  rationale: 希伯来语אָדָם在此代表一般的人，并非特指男性。现代汉语“人”本身不标示性别，能准确传达原文的普遍适用范围，同时保留两行重复结构。
translation_notes:
  register: 采用庄重、简洁的现代标准汉语，保留原文两行中“人”的重复和平行关系。两分句都补出“有福了”，使中文称福句完整自然，并清楚呈现希伯来诗歌的平衡。
