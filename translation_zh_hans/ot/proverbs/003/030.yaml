  text: אַל תרוב עִם אָדָ֣ם חִנָּ֑ם אִם לֹ֖א גְמָלְ/ךָ֣ רָעָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/030.yaml
  text: Do not contend with a man without cause[b][a], if he has done you no harm.
translation:
  language: zh_hans
  text: 不要无故与人争执；他若没有伤害你，就不可这样做。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “伤害你”也可译作“亏负你”或“以恶待你”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תרוב
  choice: 不要……争执
  rationale: אַל与未完成式构成禁止语气；ריב可指争吵、争讼或一般性的争执。“争执”在现代汉语中自然，也保留了原词较宽的语义范围。
- source_word: עִם אָדָם
  choice: 与人
  rationale: עִם表示“与”；אָדָם在此为泛指的单数个体，并不限于男性，因此译作自然且包容的“人”。
- source_word: חִנָּם
  choice: 无故
  rationale: 表示“没有缘由、无正当理由”。“无故”简洁、庄重，适合智慧文学的劝诫语体。
- source_word: אִם לֹא
  choice: 若没有
  rationale: 直译为“如果没有”，在此引出限制争执行为的条件；保留条件表达，不改写成更强的绝对命令。
- source_word: גְמָלְךָ רָעָה
  choice: 伤害你
  rationale: גמל与רעה连用，表示向某人施加坏事或伤害。“伤害你”是清楚自然的现代汉语；脚注补充“亏负你”这一较偏向不当对待的可能译法。
theological_decisions:
- issue: 本句是否绝对禁止一切争执
  choice: 保留“若没有”所引出的条件：不可无故争执，尤其当对方未加害于你时。
  alternative: 将后半句理解为“除非他伤害了你”，从而明确许可受害者争辩。
  rationale: 希伯来文条件结构可被理解为对“无故”的进一步说明，但经文本身并未系统规定何种争辩必然正当；译文不把条件扩大为明确许可，以保留智慧格言的张力。
translation_notes:
  register: 采用简洁、庄重而通俗的现代标准汉语。“与人争执”兼顾日常争吵与较正式争讼的可能含义；分号使后半句的条件关系清楚。
