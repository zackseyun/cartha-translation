source:
  edition: WLC
  text: בְּ֭נִ/י אַל יָלֻ֣זוּ מֵ/עֵינֶ֑י/ךָ נְצֹ֥ר תֻּ֝שִׁיָּ֗ה וּ/מְזִמָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/021.yaml
  text: My son[a], do not let them depart from your eyes[b]; guard sound wisdom and discretion.
translation:
  language: zh_hans
  text: 我儿，不要让它们离开你的眼前[a]；要持守健全的智慧[b]和明辨力。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “它们”在原文中是未明说所指的复数，可理解为上下文所讲的教训或各种智慧品格；“离开你的眼前”也可译作“从你的视线中溜走”。
    reason: 说明代词所指的歧义及习语的译法。
  - marker: b
    text: “健全的智慧”也可译作“可靠的判断力”或“应变才智”。
    reason: 说明 תֻּשִׁיָּה 的语义范围。
lexical_decisions:
- source_word: בְּנִי
  choice: 我儿
  rationale: 保留希伯来文阳性单数的父亲或师长对儿子的呼语；“我儿”简洁、庄重，也符合《箴言》的训诲语体。
- source_word: אַל יָלֻזוּ
  choice: 不要让它们离开
  rationale: 以禁止式表达希伯来文否定词加祈使语气动词；动词为第三人称阳性复数，因此保留复数代词“它们”，不擅自确定所指。
- source_word: מֵעֵינֶיךָ
  choice: 你的眼前
  rationale: 保留“从眼睛前离开”的具体意象，同时采用现代汉语自然的表达，指持续留意、不使之脱离视线。
- source_word: נְצֹר
  choice: 持守
  rationale: 该命令式含谨慎保守、看护之意；“持守”兼顾主动保存和持续遵行，适合智慧训诲的语境。
- source_word: תֻּשִׁיָּה
  choice: 健全的智慧
  rationale: 此词在智慧文学中可指可靠、切实有效的智慧、判断力或应变才智；“健全的智慧”保留其正确可靠及实际功用，不限缩为单纯知识。
- source_word: וּמְזִמָּה
  choice: 和明辨力
  rationale: מְזִמָּה 可随语境表示谋划、审慎或计谋；此处与正面的智慧并列，取审慎分辨的正面含义，同时避免译成带贬义的“诡计”。
theological_decisions:
- issue: 带性别的亲子称呼
  choice: 我儿
  alternative: 我的孩子
  rationale: 原文明确为阳性单数，并处于《箴言》父亲或师长对儿子的训诲框架中；保留男性称呼，不作泛化。
- issue: 复数代词“它们”的所指
  choice: 保留未明确指称的复数代词
  alternative: 明确译为“智慧和明辨力”或“这些教训”
  rationale: 原文动词带复数主语，但本节没有明说其所指；它可能回指上下文中的教训或品格，也可能与后面的“智慧和明辨力”相关。正文保留这一开放性，避免替原文消除歧义。
translation_notes:
  register: 采用现代、庄重而易懂的训诲语体。“我儿”呼应《箴言》的父子教导框架；“眼前”保留原文意象；“持守”与“明辨力”兼顾经文风格和现代可读性。
