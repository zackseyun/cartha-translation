source:
  edition: WLC
  text: אַל תְּהִ֣י חָכָ֣ם בְּ/עֵינֶ֑י/ךָ יְרָ֥א אֶת יְ֝הוָ֗ה וְ/ס֣וּר מֵ/רָֽע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/007.yaml
  text: Do not be wise in your own eyes[c][b][a]; fear Yahweh and turn away from evil.
translation:
  language: zh_hans
  text: 不要自以为有智慧；要敬畏雅威，远离邪恶。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַל תְּהִי
  choice: 不要……
  rationale: אַל加未完成时/祈使意义的动词构成禁令；现代汉语用“不要”自然表达。系词在“自以为有智慧”的结构中无需另译。
- source_word: חָכָם בְּעֵינֶיךָ
  choice: 自以为有智慧
  rationale: 直译为“在自己眼中有智慧”，其习语意义是按自己的判断认定自己有智慧。“自以为有智慧”自然、准确，同时保留对自负判断的警戒。
- source_word: יְרָא
  choice: 敬畏
  rationale: 该命令式在智慧文学中兼具畏惧、尊崇和肃然敬重之意；“敬畏”是现代中文圣经语境中自然且含义较完整的对应词。
- source_word: יְהוָה
  choice: 雅威
  rationale: 原文直接使用四字神名；音译为“雅威”，以保留其作为以色列之神专名的性质，而不以称号替代。
- source_word: וְסוּר
  choice: 远离
  rationale: סור的命令式表示转身离开、避开；“远离”在中文中简洁自然地表达主动脱离的要求。
- source_word: מֵרָע
  choice: 邪恶
  rationale: רָע在此与敬畏雅威相连，主要指道德上的恶；“邪恶”保留其广泛伦理含义，不局限于某一种恶行。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文使用神的专名而非普通称号。采用较贴近学界通常重构读音的“雅威”，既保留专名，也避免用“上主”遮蔽原文形式。
- issue: יְרָא所表达的态度
  choice: 敬畏
  alternative: 惧怕；尊崇
  rationale: 此词在智慧传统中同时包含对神的畏惧、尊崇与顺服。“敬畏”不把它弱化为一般尊敬，也不缩减为单纯害怕。
translation_notes:
  register: 采用简洁、对称的智慧训诲语体。“不要……；要……，……”符合现代标准汉语，庄重而易懂。未添加原文没有的解释性内容。
