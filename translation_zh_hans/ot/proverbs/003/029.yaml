  text: אַל תַּחֲרֹ֣שׁ עַל רֵעֲ/ךָ֣ רָעָ֑ה וְ/הֽוּא יוֹשֵׁ֖ב לָ/בֶ֣טַח אִתָּֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/029.yaml
  text: Do not devise harm against your neighbor while he dwells securely with you[a].
translation:
  language: zh_hans
  text: 不可图谋害你的邻舍；他安然与你同住。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不可图谋害你邻舍的恶事；他安然在你身边居住。”
    reason: “恶事”较直接对应 רָעָה；“在你身边”体现 אִתָּךְ 所表达的与说话者相近、相处，避免把其限定为必定同住一处。
lexical_decisions:
- source_word: תַּחֲרֹשׁ
  choice: 图谋
  rationale: חרשׁ与“恶事”连用时指筹划、设计，而非字面的“耕作”；“图谋”既表达蓄意策划，也保留其负面意味。
- source_word: עַל
  choice: 加害他
  rationale: 此处介词标明恶意所针对的对象；汉语用“加害”自然表达这种敌对指向，并避免生硬直译介词。
- source_word: רֵעֲךָ
  choice: 你的邻舍
  rationale: רֵעַ可指邻舍、同伴或朋友；在伦理训诫中，“邻舍”保留较广的社会关系范围，不限定为亲密朋友。
- source_word: רָעָה
  choice: 加害
  rationale: רָעָה在这里指企图施于他人的祸害或恶事；“加害”比抽象的“邪恶”更准确地传达实际伤害意图。
- source_word: יוֹשֵׁב
  choice: 居住
  rationale: ישׁב的分词在此表示持续居住、安顿；“居住”自然且贴近原文。
- source_word: לָבֶטַח
  choice: 安然
  rationale: בֶּטַח表示安全、安稳；“安然”既可描述客观安全，也不排除当事人放心信赖的意味。
- source_word: אִתָּךְ
  choice: 在你身边
  rationale: 该词表示与你同在或相近；“在你身边”兼顾空间上的邻近和关系上的相处，同时不强行限定为同一住所。
theological_decisions:
- issue: 邻舍安居与禁令之间的关系
  choice: 用“当……时”表达伴随情境
  alternative: 译作“因为他……”，明确表达因果关系
  rationale: 希伯来语以וְהוּא引出邻舍安然居住的情境，并未明确使用因果连接词；“当……时”保留伴随意义，避免把潜在理由解释成明说的因果关系。
translation_notes:
  register: 采用现代、庄重而通顺的训诫语体。“图谋加害”清楚传达蓄意策划伤害的含义；句首的时间从句使汉语自然，同时保持原文中邻舍安然居住这一伴随处境。
