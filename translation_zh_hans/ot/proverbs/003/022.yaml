  text: and they will be life to your soul and grace to your neck[a][b].
translation:
  language: zh_hans
  text: 它们必成为你的生命[a]，也成为你颈项的华美[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “生命”对应希伯来语 חַיִּים，常作为抽象名词使用；“你的”所含的希伯来语 נֶפֶשׁ 也可指“性命”、“自己”或“内在之人”。
    reason: lexical_alternative
  - marker: b
    text: “华美”所译的希伯来语 חֵן 也可译作“恩惠”或“悦人之处”，侧重使人喜爱、受人看重的特质。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִהְיוּ
  choice: 它们必成为
  rationale: 这是带连接词的 היה Qal 未完成式第三人称阳性复数；“它们”承接上文的智慧与明辨，按语境表达将有的结果，而非命令或愿望。
- source_word: חַיִּים
  choice: 生命
  rationale: 该词虽为复数形式，却常作抽象名词，表示“生命”；用中文单数概念最自然。
- source_word: לְנַפְשֶׁךָ
  choice: 你的生命
  rationale: נֶפֶשׁ 可指生命、自我、性命或内在之人。正文采用自然的“你的生命”，同时用脚注保留其较宽的语义范围。
- source_word: וְחֵן
  choice: 也……华美
  rationale: חֵן 可表示恩惠、悦人之处或美感；本节与“颈项”的装饰意象相连，“华美”在中文中能自然传达其道德与审美色彩，“也”则体现两分句的并列。
- source_word: לְגַרְגְּרֹתֶיךָ
  choice: 你颈项的
  rationale: 该词指喉咙或颈部；箴言中常用于佩戴装饰的意象，因此译作“颈项”既准确又庄重。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“它们”保留原文复数，承接上文的两个概念；“颈项”保留智慧文学中如同饰物佩戴于颈部的意象。
