base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/028.yaml
  text: Do not say to your neighbor[a], “Go, and come back[b], and tomorrow I will give,” when you have it with you.
translation:
  language: zh_hans
  text: 你手头明明有可给的东西[b]，不可对邻舍[a]说：“你去吧，明天再来，我就给你。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “邻舍”也可译作“同伴”或“朋友”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“有在你这里”，意思是所需之物已经在你那里，可以当下给出，不应拖延。
    reason: cultural_note
lexical_decisions:
- source_word: רֵעַ
  choice: 邻舍
  rationale: 此词在《箴言》中通常指社会关系中与自己相近的人，并不限定为亲密朋友；“邻舍”保留了对身边之人的伦理责任。
- source_word: לֵךְ
  choice: 你先走
  rationale: 保留直接命令的语气；加入“先”使其与后面的“回头再来”在现代汉语对话中自然衔接，并体现推托之意。
- source_word: שׁוּב
  choice: 回头再来
  rationale: שׁוּב可指返回；在此直接引语中，“回头再来”比生硬的“返回”更符合现代汉语，同时不限定具体返回时间。
- source_word: מָחָר
  choice: 明天
  rationale: 按其通常时间意义直译，不作扩展。
- source_word: אֶתֵּן
  choice: 我再给你
  rationale: “给”对应原文动词；中文补出语境中明确的接受者“你”，但仍不明说所给之物。“再”自然承接先离开、后给予的推托话语。
- source_word: יֵשׁ אִתָּךְ
  choice: 你明明有现成的
  rationale: 原文直义为“有在你这里”；此译表达所需之物当下就在说话者那里、可以立即给出，又不把它过度解释为泛指经济能力。
- source_word: אַל
  choice: 不可
  rationale: 表达带劝诫性质的否定禁令，符合《箴言》的庄重语体，也不额外加强为“绝不可”。
theological_decisions:
- issue: 不可拖延给予的伦理依据
  choice: 保留“所需之物当下已有”的具体依据
  alternative: 泛化为“只要你有能力帮助”
  rationale: 原文说的是东西“在你那里”，重点是明明可以当下给出却故意拖延；不将其扩大为原文未明说的一般能力原则。
translation_notes:
  register: 采用现代、庄重而口语可懂的劝诫语体。将表示现有资源的从句前置，以符合汉语表达并突出“明明可以立即给予”的反差；直接引语仍保留原文先打发对方离开、再许诺明日给予的结构。
