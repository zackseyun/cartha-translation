  yaml_path: translation/ot/proverbs/003/026.yaml
  text: For Yahweh will be your confidence[a], and he will keep your foot from being caught.
translation:
  language: zh_hans
  text: 因为雅威必成为你的倚靠[a]，保守你的脚不被捕获。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或按较字面的空间性理解译：“雅威必在你身旁。”这里的希伯来语也可引申指倚靠、保障或安全；本节语境较支持这种引申义。
    reason: 保留בְּכִסְלֶךָ可能的空间性理解，同时说明主译采用其在本节更合语境的引申义。
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，为前面的劝勉与应许说明根据；“因为”清楚保留了原文的解释关系。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文四字神名作现代汉语音译，保留其作为专名的性质，而不以称号代替。
- source_word: יִהְיֶה בְכִסְלֶךָ
  choice: 必作你的倚靠
  rationale: כֶּסֶל可指腰胁、身旁，也可引申为信心、保障或倚靠；本节与免于被套住的保护相连，采用引申义较符合语境，同时以脚注保留较直译的可能。
- source_word: וְשָׁמַר
  choice: 保守
  rationale: 该动词表示看守、护卫；“保守”既简洁庄重，也能自然接续后面的避免受害结构。
- source_word: רַגְלְךָ
  choice: 你的脚
  rationale: 保留希伯来文单数及捕捉脚部的具体意象。
- source_word: מִלָּכֶד
  choice: 不被套住
  rationale: 该形式源于“捕获、抓住”；与“脚”搭配时，“被套住”以自然汉语传达陷阱捕捉的意象，又没有明确增添原文未出现的网罗名词。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。译作“雅威”旨在保留神名而非改用称号；“耶和华”是传统汉译音形，“主”则会把专名处理为称号。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“必作你的倚靠”保留智慧文学的凝练语气；“脚不被套住”维持原文具体意象。脚注标记[a]已置于正文相应位置。
