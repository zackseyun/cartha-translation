  text: בְּ֭נִ/י תּוֹרָתִ֣/י אַל תִּשְׁכָּ֑ח וּ֝/מִצְוֺתַ֗/י יִצֹּ֥ר לִבֶּֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/001.yaml
  text: My son[a], do not forget my instruction[b], and let your heart keep my commandments.
translation:
  language: zh_hans
  text: 我儿，不要忘记我的教导[a]；你的心要谨守我的诫命[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “教导”也可译作“训诲”。这里的希伯来语 תּוֹרָה 指教导或指引，不一定是狭义的律法。
    reason: lexical_alternative
  - marker: b
    text: “谨守”含有“小心看守、守护”的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנִי
  choice: 我儿
  rationale: 这是带第一人称后缀的阳性单数呼语，符合《箴言》中父亲对儿子的训诲语境；“我儿”简洁、庄重，也保留原文的性别指向。
- source_word: תּוֹרָתִי
  choice: 我的教导
  rationale: 此处 תּוֹרָה 指智慧传统中的训诲、教导，并非狭义的成文律法；“教导”在现代汉语中自然，并保留其指导性。
- source_word: אַל תִּשְׁכָּח
  choice: 不要忘记
  rationale: 准确表达否定祈使或禁令的语气，直接而自然。
- source_word: וּמִצְוֺתַי
  choice: 我的诫命
  rationale: מִצְוֹת 表示具有权威性的命令；“诫命”保留其郑重和道德分量。
- source_word: יִצֹּר
  choice: 谨守
  rationale: נצר 不只是一般的遵行，也含看守、守护和留心持守之意；“谨守”既符合汉语经文语体，也体现这种审慎守护的意味。
- source_word: לִבֶּךָ
  choice: 你的心
  rationale: 希伯来语“心”涵盖思想、意志和情感，是人的内在中心；直译为“心”可避免把含义缩减为单纯的理智活动。
theological_decisions:
- issue: 智慧训诲中的性别称呼
  choice: 保留阳性单数呼语“我儿”
  alternative: “我的孩子”
  rationale: 原文明确使用阳性单数形式，也符合父亲向儿子施教的文学框架；不以中性称谓消解原文的具体表达。
- issue: “心”作为顺服主体
  choice: 保留“你的心要谨守”这一拟人化表达
  alternative: “你要把我的诫命牢记在心”
  rationale: 原文以“心”为动词的主语，强调人的内在中心主动守护诫命；保留这一结构，可避免只解释为记忆，也不把顺服的范围限缩。
translation_notes:
  register: 采用现代、庄重而易懂的智慧文学语体。“我儿”保留父子训诲框架；分号呈现两个平行劝诫。“谨守”较“遵守”更能传达 נצר 的守护意味，同时仍为普通读者所熟悉。
