base_translation:
  language: en
  yaml_path: translation/ot/proverbs/031/019.yaml
  text: She stretches out her hands to the distaff[a], and her palms hold the spindle.
translation:
  language: zh_hans
  text: 她的双手伸向纺线杆[a]，双掌握住纺锤。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“她把双手放在纺线杆上，双掌抓住纺锤。”
    reason: 原文的动词和介词组合可理解为双手伸向纺线工具，也可较宽泛地表示把手放在工具上、着手操作；תמך也可译作“抓住”。
lexical_decisions:
- source_word: יָדֶיהָ
  choice: 她伸手
  rationale: 原文是带第三人称阴性单数后缀的双数“她的双手”；汉语以“她伸手”自然表达其主动用手操作的动作，第二分句再用“双掌”保留成对意象。
- source_word: שִׁלְּחָה
  choice: 伸手拿起
  rationale: שׁלח基本义为“伸出、发出”；结合介词短语和纺织劳动场景，译作“伸手拿起”既保留伸手这一具体动作，也自然表达她着手使用工具。
- source_word: בַכִּישׁוֹר
  choice: 纺线杆
  rationale: כִּישׁוֹר指一种纺线工具，通常理解为绕放纤维、配合纺锤使用的杆（distaff）。译作“纺线杆”比音译或生僻术语更便于现代读者理解，并与下句“纺锤”区分。
- source_word: וְכַפֶּיהָ
  choice: 双掌
  rationale: כַּף特指手掌；其复数带第三人称阴性单数后缀。译作“双掌”保留其较“手”更具体的身体意象及与上句的诗意平行。
- source_word: תָּמְכוּ
  choice: 握住
  rationale: תמך可指支撑、扶持或抓持；在操持纺锤的语境中，“握住”自然具体，同时不对纺线动作作过细推断。
- source_word: פָלֶךְ
  choice: 纺锤
  rationale: פֶּלֶךְ在此指纺纱所用的纺锤；“纺锤”是现代汉语中准确且可理解的对应词，也与“纺线杆”构成两件工具的平行意象。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙述。保留两行之间“手／掌”和两种纺线工具的平行结构；因“纺线杆”对普通读者可能陌生，以脚注呈现动作表达上的合理替代译法。
