  yaml_path: translation/ot/proverbs/031/004.yaml
  text: It is not for kings[a], O Lemuel, it is not for kings to drink wine, nor for rulers to desire strong drink,
translation:
  language: zh_hans
  text: 利慕伊勒啊，君王不该如此；君王不宜喝葡萄酒，掌权者也不宜寻求烈酒[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或更直译为：“掌权者也不可问：‘烈酒在哪里？’”希伯来文的表达很简略，可能描绘掌权者寻找使人醉的饮品。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל לַמְלָכִים
  choice: 君王不宜
  rationale: אַל在这里带有劝诫、禁止意味，与介词短语“对君王”连用，重点在于此事不合君王的身份。“不宜”既表达规劝，也保留原文关于是否合宜的语气；开头的省略句照原文保留，以加强重复效果。
- source_word: לְמוֹאֵל
  choice: 利慕伊勒啊
  rationale: 这是对利慕伊勒的直接呼唤；“啊”自然体现现代汉语的呼格语气。
- source_word: שְׁתוֹ יָיִן
  choice: 喝葡萄酒
  rationale: שְׁתוֹ在句中承接前面的否定合宜表达，יָיִן通常指葡萄酒。
- source_word: וּלְרוֹזְנִים
  choice: 掌权者也不宜
  rationale: רוֹזְנִים指有权势的高级官员、首领或统治者。“掌权者”是清楚自然的现代汉语，并与“君王”构成平行。
- source_word: או שֵׁכָר
  choice: 贪求烈酒
  rationale: 原文表达极其简略，可能描绘掌权者寻找或渴求使人醉的饮品。“贪求”传达主动寻求的意味；שֵׁכָר泛指葡萄酒以外的致醉饮料，译作“烈酒”简明易懂，同时在脚注保留更直译的可能。
