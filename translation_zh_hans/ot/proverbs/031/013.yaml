  text: She seeks wool and flax[a], and works with willing hands.
translation:
  language: zh_hans
  text: 她寻找羊毛和亚麻，甘心亲手劳作。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“她愉快地用双手工作”，或“她热心地用双手工作”。
    reason: “甘心亲手”所对应的希伯来语短语可表达她以喜悦、乐意或热切的态度用双手工作；原文的词组关系有一定歧义。
lexical_decisions:
- source_word: דָּרְשָׁה
  choice: 寻找
  rationale: 该动词有寻找、寻求之意；此处表现她主动寻找或取得纺织材料，同时不限定具体采购方式。
- source_word: צֶמֶר
  choice: 羊毛
  rationale: 准确对应作为纺织原料的羊毛。
- source_word: וּפִשְׁתִּים
  choice: 亚麻
  rationale: 原文所指是亚麻这种植物或原料，而非加工后的麻布；与“羊毛”并列自然。
- source_word: וַתַּעַשׂ
  choice: 劳作
  rationale: עשה本义宽泛，可指做、制作；结合纺织劳动的语境，“劳作”自然表达她亲手从事生产性工作，又不把含义限于某一成品。
- source_word: בְּחֵפֶץ
  choice: 甘心
  rationale: חֵפֶץ可表达喜悦、意愿或乐意；“甘心”保留积极、自愿的意味，不把原文过度限定为情绪上的快乐或动作上的急切。
- source_word: כַּפֶּיהָ
  choice: 亲手
  rationale: כף字面可指手掌，此处以双手代指亲自进行的手工劳动；现代汉语用“亲手”较自然。
theological_decisions: []
