  yaml_path: translation/ot/proverbs/031/009.yaml
  text: Open your mouth[a], judge righteously, and plead the cause of the poor and needy.
translation:
  language: zh_hans
  text: 你要开口，按公义判断，为困苦和穷乏的人申辩。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你要挺身发言，秉公判断，为困苦和穷乏的人伸张正义。”
    reason: 原文的“开口”是呼吁发言的习语；דין在这里也可侧重为弱势者主持公道、伸张正义。
lexical_decisions:
- source_word: פְּתַח פִּיךָ
  choice: 你要开口
  rationale: 保留希伯来文“张开你的口”的形象，同时用现代汉语自然表达公开发言、挺身说话的命令语气。
- source_word: שְׁפָט
  choice: 判断
  rationale: 该命令式动词具有审理、判断或施行裁断的司法含义；“判断”简洁，并保留原文对掌权者履行审判职责的要求。
- source_word: צֶדֶק
  choice: 按公义
  rationale: 该名词在此修饰“判断”；“按公义”既符合汉语习惯，也保留其与“公义”这一核心词汇的联系。
- source_word: וְדִין
  choice: 为……申诉
  rationale: דין可指审理、争讼或为案件辩护；此处与司法判断平行，“为……申诉”表达替弱势者维护其案件和权益，同时不把含义限定为单纯判决。
- source_word: עָנִי
  choice: 困苦的人
  rationale: עָנִי可指贫穷、受苦或受压的人；译作“困苦的人”保留其范围，不与后面的“贫穷”完全重复。
- source_word: אֶבְיוֹן
  choice: 贫穷的人
  rationale: אֶבְיוֹן突出匮乏、贫困和有需要的处境；“贫穷的人”清楚自然，并与“困苦的人”构成相近而不完全相同的并列。
