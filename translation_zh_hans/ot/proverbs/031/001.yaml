base_translation:
  language: en
  yaml_path: translation/ot/proverbs/031/001.yaml
  text: 'The words of King Lemuel[b][a], an oracle that his mother taught him:'
translation:
  language: zh_hans
  text: 利慕伊勒王的话，是他母亲所教导[b]他的默示[a]：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“玛撒的利慕伊勒王的话，是他母亲所教导他的。”希伯来语“玛撒”也可理解为“默示”。
    reason: alternative_reading
  - marker: b
    text: “教导”也可译为“管教”或“训诫”。
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּבְרֵי
  choice: 言语
  rationale: 这是דָּבָר的复数构造形式，用作篇章标题；“言语”既直接又庄重，也比“箴言”少一层解释。
- source_word: לְמוּאֵל
  choice: 利慕伊勒
  rationale: 作为人名按希伯来语音译，并采用现代中文圣经语境中易辨认的形式。
- source_word: מֶלֶךְ
  choice: 王
  rationale: 作为利慕伊勒的称号或同位语，直接译为“王”。
- source_word: מַשָּׂא
  choice: 默示
  rationale: 按马所拉元音及该词表示神谕、宣告的常见用法，正文译为“默示”；“玛撒”地名解法保留于脚注。
- source_word: אֲשֶׁר
  choice: 就是……的
  rationale: 以自然中文关系结构连接“默示”和后面的母亲教导之内容。
- source_word: יִסְּרַתּוּ
  choice: 教导他
  rationale: יסר可指教导、管教或训诫；在母亲传授智慧的语境中，“教导”自然且不过度缩窄词义，其他可能性列于脚注。
- source_word: אִמּוֹ
  choice: 他母亲
  rationale: 直接表达名词及第三人称阳性单数后缀。
theological_decisions:
- issue: מַשָּׂא是体裁名称还是地名
  choice: 正文理解为“默示”
  alternative: “玛撒王利慕伊勒的言语，就是他母亲教导他的”
  rationale: 马所拉读法和该词的常见词义支持“默示”，但辅音文本也容许将其理解为地名“玛撒”，故不排除另一读法。
translation_notes:
  register: 采用现代、庄重而易懂的标题句式。“默示”保留智慧言论可能带有神谕性质的张力；两个脚注标记均置于正文相关句末，并按正文出现顺序排列。
