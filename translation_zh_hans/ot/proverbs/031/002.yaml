  text: מַה בְּ֭רִ/י וּ/מַֽה בַּר בִּטְנִ֑/י וּ֝/מֶה בַּר נְדָרָֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/031/002.yaml
  text: What[a], my son? And what, son of my womb? And what, son of my vows?
translation:
  language: zh_hans
  text: 什么，我儿？什么，我腹中所生的儿啊？什么，我所许之愿的儿子啊？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译作“什么，我儿？什么，我腹中的儿？什么，我誓愿的儿？”原文三次只说“什么”，没有明说谓语；“我誓愿的儿”与誓愿的具体关系未说明。
    reason: 说明原文省略式疑问，并保留“儿子”与“誓愿”之间未明确的关系，避免译为因许愿而得子或奉献之子。
lexical_decisions:
- source_word: מַה
  choice: 什么
  rationale: 保留原文三次突兀而省略的疑问词，传达母亲急切、充满感情的呼唤；不在正文中补入原文未明说的谓语。
- source_word: בְּרִי
  choice: 我儿
  rationale: בַּר 加第一人称单数后缀，意为“我的儿子”；“我儿”自然、凝练，也符合诗歌语体。
- source_word: בַּר
  choice: ……的儿
  rationale: 重复采用“儿”，保留原文阳性亲属称谓以及三重排比。
- source_word: בִּטְנִי
  choice: 我腹中所生的
  rationale: בֶּטֶן 可指腹部或子宫；这里是母亲对儿子的称呼，用“我腹中所生的”既体现母体意象，也比直译“我子宫的儿子”更符合现代汉语。
- source_word: נְדָרָי
  choice: 我许愿所得的
  rationale: נֶדֶר 意为“誓愿、许的愿”。此处保留儿子与母亲所许之愿的关联，但不进一步断定这些愿的具体内容或性质。
theological_decisions:
- issue: 三次疑问的修辞作用
  choice: 保留三个省略式的“什么……？”
  alternative: 译作“我该对你说什么……？”或“怎么了……？”
  rationale: 原文只重复 מַה，没有明示谓语。保留省略可呈现其急切和诗性，并避免把某一种补足解释写入正文。
- issue: 儿子与“誓愿”的关系
  choice: “我许愿所得的儿”
  alternative: “我所许愿献上的儿”或“我为之许愿的儿”
  rationale: 原文仅说“我誓愿的儿”，没有说明是因许愿而得、为他许愿，还是将他奉献。正文采用自然但较概括的表达，脚注说明原文的开放性，避免确立特定的奉献观。
- issue: 性别明确的亲属称谓
  choice: “我儿”及“……的儿”
  alternative: “我的孩子”及“……的孩子”
  rationale: 原文反复使用阳性名词 בַּר，译文保留“儿”，不将其性别中性化。
translation_notes:
  register: 采用现代、庄重而富有诗性的普通话。“我儿”较“我的儿子”凝练，适合三重呼语；后两句加“啊”使汉语呼语自然，并维持母亲语气的情感强度。脚注标记[a]已置于正文。
