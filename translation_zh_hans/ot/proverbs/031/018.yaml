  yaml_path: translation/ot/proverbs/031/018.yaml
  text: She perceives that her merchandise is good[b][a]; her lamp does not go out at night.
translation:
  language: zh_hans
  text: 她看出自己的买卖很好[a][b]；她的灯夜间不熄灭。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “看出”原文直译为“尝出”，这里指通过亲身经验加以辨别。
    reason: lexical_alternative
  - marker: b
    text: “自己的买卖”也可译作“自己的货物很好”或“自己的收益良好”。
    reason: lexical_alternative
lexical_decisions:
- source_word: טָעֲמָה
  choice: 她看出
  rationale: 该动词本义为“品尝”，此处引申为根据实际经验作出判断。“看出”在现代汉语中自然地表达这种经验性的辨识，同时以脚注保留原文的具体意象。
- source_word: כִּי
  choice: （引出“自己的经营有成效”）
  rationale: 此处引出她所辨识的内容，汉语无需另译连接词即可自然表达。
- source_word: טוֹב
  choice: 有成效
  rationale: 原词意义宽泛，指良好、可取；在经营语境中含有收益良好的意味。“有成效”既体现商业成果，又不把含义收窄为纯粹利润。
- source_word: סַחְרָהּ
  choice: 自己的经营
  rationale: 该名词可指商品、贸易或经营所得。“经营”适合上下文所描写的商业活动，也能保留贸易与收益之间的语义空间。
- source_word: לֹא יִכְבֶּה
  choice: 不熄
  rationale: 准确、简洁地描写灯没有熄灭，并符合现代汉语表达。
- source_word: בַלַּיְלָה
  choice: 夜间
  rationale: 自然地表达原文的时间范围，不额外限定为整夜。
- source_word: נֵרָהּ
  choice: 她的灯
  rationale: 保留原文具体的“灯”这一家居及勤劳意象，不抽象化为“光”。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“看出”与“有成效”便于普通读者理解；脚注保留“品尝”的原始意象以及商业名词在货物、经营和收益之间的多义性。后半句保持简洁，不把灯明确解释成实际劳作或象征意义，以保留原文张力。
