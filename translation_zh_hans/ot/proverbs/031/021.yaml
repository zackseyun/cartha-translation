  yaml_path: translation/ot/proverbs/031/021.yaml
  text: She does not fear snow for her household[a], for all her household are clothed in scarlet.
translation:
  language: zh_hans
  text: '她不因下雪而为家人忧虑，

    因为她全家都穿着朱红色衣服。[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为她全家都穿着双层衣服。”有些人认为，这里的希伯来语 שָׁנִים 指衣服是双层的，而不是朱红色的衣服。
    reason: lexical_alternative
lexical_decisions:
- source_word: תִירָא
  choice: 担心
  rationale: 该词为 ירא 的 Qal 未完成式第三人称阴性单数，在这里表达面对下雪时持续不惧怕、不忧虑；现代汉语中“为家里人担心”自然地传达其语义。
- source_word: לְבֵיתָהּ
  choice: 为家里人
  rationale: בַּיִת 既可指房屋，也可指家人或全家；此处所关切的是她照料的人，因此译作“家里人”。
- source_word: מִשָּׁלֶג
  choice: 因下雪
  rationale: 介词 מִן 在此标明引发忧虑的情形；译作“因下雪”符合现代汉语表达。
- source_word: כִּי
  choice: 因为
  rationale: 引出她不担心的原因，保留原文明确的因果关系。
- source_word: לָבֻשׁ
  choice: 都穿着
  rationale: 形式上是阳性单数，但与“全家”这一集合性主语搭配；汉语以“都穿着”自然呈现全体成员的状态。
- source_word: שָׁנִים
  choice: 朱红衣服
  rationale: 通常理解为“朱红色、朱红布料”，这是较直接的词义；另有“双层衣服”的解释，因与雪天保暖更直接相关，故在脚注保留。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的汉语。“家里人”比“家”更清楚地指向家庭成员；“朱红衣服”保留传统且词义依据较强的理解，同时用脚注呈现原文真实存在的词义歧义。
