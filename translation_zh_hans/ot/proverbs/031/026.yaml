  yaml_path: translation/ot/proverbs/031/026.yaml
  text: She opens her mouth with wisdom[b][a], and the instruction of kindness is on her tongue.
translation:
  language: zh_hans
  text: 她开口说话有智慧；仁慈的训诲[a][b]在她舌头上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “仁慈的训诲”也可译作“仁慈的法则”或“关于仁慈的训诲”。希伯来语 תּוֹרָה 可指律法，也可泛指训诲、教导。
    reason: lexical_alternative
  - marker: b
    text: “仁慈”所译的希伯来语 חֶסֶד 也可表示“慈爱”、“怜悯”或“忠贞之爱”等；具体侧重由语境决定。
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּיהָ
  choice: 她开口
  rationale: 保留“口”的具体意象，并与动词“开”自然结合；现代汉语可自然理解为她开始说话。
- source_word: פָּתְחָה
  choice: 开
  rationale: 此处完成式在箴言诗歌中描写人物一贯的特征，汉语无需标明过去时；“开口”既贴近原文，也比直接意译为“说话”更保留意象。
- source_word: בְחָכְמָה
  choice: 就有智慧
  rationale: 介词 בְ 可表达伴随或方式；“开口就有智慧”在现代汉语中自然、凝练，并保留她言语以智慧为特征的意思。
- source_word: וְתוֹרַת
  choice: 教导
  rationale: תּוֹרָה 在智慧文学语境中可泛指训诲或教导，不必限定为成文律法；“教导”通俗而庄重。
- source_word: חֶסֶד
  choice: 仁慈
  rationale: 此处描述人际言语中的善意与恩慈；“仁慈”能表达 חֶסֶד 的慈爱面向，同时避免在本句中过度限定为盟约术语。
- source_word: תּוֹרַת חֶסֶד
  choice: 仁慈的教导
  rationale: 该属格结构既可能指以仁慈为内容或特征的教导，也可能指关于仁慈的训诲。“仁慈的教导”保留一定语义张力，且符合现代汉语表达。
- source_word: עַל לְשׁוֹנָהּ
  choice: 在她舌上
  rationale: 贴近希伯来语的具体意象，表达这种教导随时出现在她的话语中；不直接抽象化为“她的话语”。
theological_decisions:
- issue: תּוֹרַת חֶסֶד 的语义关系
  choice: 仁慈的教导
  alternative: 仁慈的法则／关于仁慈的教导
  rationale: 原文的名词连属结构没有明说 חֶסֶד 是教导的内容、性质还是方式，因此正文采用可保留多重理解的表达，不将其收窄为单一神学含义。
- issue: חֶסֶד 是否特指盟约之爱
  choice: 仁慈
  alternative: 忠贞之爱／慈爱／怜悯
  rationale: 本节直接语境是贤德妇人的言语品格，并未明确要求盟约意义；采用一般而宽广的“仁慈”，同时以脚注保留其他可能译法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“开口”“舌上”保留原文平行结构和身体意象；“就有智慧”使上半句符合自然汉语节奏。脚注标记按对应短语排列为[a][b]。
