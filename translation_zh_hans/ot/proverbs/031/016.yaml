  text: She considers a field and acquires it[b][a]; from the fruit of her hands she plants a vineyard.
translation:
  language: zh_hans
  text: 她仔细考虑一块田地，就把它买下[a]；她以自己劳作所得的收益[b]栽种葡萄园。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可直译为“她筹划一块田地，便取得它”。希伯来语动词可指“谋划”和“取得”；“买下”是根据田地交易的语境所作的自然表达，并不限定具体的取得方式。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语直译为“从她双手的果实”，指她劳动所产出的成果或收益。
    reason: cultural_note
lexical_decisions:
- source_word: זָמְמָה
  choice: 审慎考察
  rationale: 该动词在此表示有目的的思量和筹划；“审慎考察”既符合置地语境，也不把含义限定为已经形成完整计划。
- source_word: שָׂדֶה
  choice: 一块田地
  rationale: שָׂדֶה通常指田地或可耕种的土地；量词“一块”使现代汉语表达自然。
- source_word: וַתִּקָּחֵהוּ
  choice: 就把它置下
  rationale: לקח本义较宽，可指拿取或取得；在置地的经济语境中，“置下”自然表达取得产业，又不像“买下”那样明确加入原文未直说的交易方式。
- source_word: מִפְּרִי כַפֶּיהָ
  choice: 用双手劳作所得的收益
  rationale: 字面为“从她双手的果实”。这里“果实”比喻劳动的产出或收益；译出习语所指，同时以脚注保留原文意象。
- source_word: נטע
  choice: 栽种
  rationale: 马所拉文本辅音为נטע，按本节持续谈论这位女子的上下文，以她为主语最合适；“栽种”准确表达动词含义。
- source_word: כָּרֶם
  choice: 葡萄园
  rationale: 这是כָּרֶם标准而自然的汉语对应词。
