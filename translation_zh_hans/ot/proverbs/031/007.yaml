  text: Let him drink and forget his poverty[a], and remember his trouble no more.
translation:
  language: zh_hans
  text: 让他喝吧，忘记自己的贫穷，不再记得他的苦难。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “苦难”也可译作“劳苦”或“困苦”；希伯来词可指劳碌、艰难或悲惨的处境。
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׁתֶּה
  choice: 让他喝了
  rationale: 此处未完成式承接上文的准许或劝请语气；“让他喝了”在现代汉语中自然表达这一意涵，而非单纯预告未来。
- source_word: וְיִשְׁכַּח
  choice: 忘记
  rationale: 连接词加未完成式延续并列而略带结果意味的动词链；译作“忘记”保持简洁，不把目的关系规定得过死。
- source_word: רִישׁוֹ
  choice: 自己的贫穷
  rationale: רִישׁ指贫穷、穷困的处境；“贫穷”直接、通俗，也与原词的社会经济含义相符。
- source_word: וַעֲמָלוֹ
  choice: 自己的苦难
  rationale: עָמָל可指劳苦、艰难、祸患或痛苦；本句着眼于困苦者想暂时忘却的重担，“苦难”保留较宽的经验性含义。
- source_word: לֹא יִזְכָּר עוֹד
  choice: 不再记得
  rationale: 否定词与עוֹד合用表示停止或不再发生；“不再记得”准确而符合现代汉语表达。
theological_decisions:
- issue: 本句对饮酒行为的语用功能
  choice: 保留原文承接上文的准许／劝请语气，不增添道德评断
  alternative: 把本句直译为未来陈述，或加入赞同、谴责等解释
  rationale: 经文本身在此以智慧训言的修辞描述让困苦者饮用并暂忘愁苦；译文应保留这一张力，不替原文解决其伦理应用。
translation_notes:
  register: 采用现代、庄重而通俗的普通话。“让他喝了”承接上下文的劝请语气；后半句用“不再记得”保持希伯来诗句的简洁和平行感。
