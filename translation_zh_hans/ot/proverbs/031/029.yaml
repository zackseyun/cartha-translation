  text: Many daughters have done nobly[b][a], but you surpass them all.
translation:
  language: zh_hans
  text: 许多女子行事卓越[a][b]，而你超越她们众人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “女子”原文直译为“女儿们”；在这里可泛指女子或年轻女子。
    reason: lexical_alternative
  - marker: b
    text: “行事卓越”也可译为“表现非凡”。原文相关词可含力量、英勇、才干或卓越等意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: רַבּוֹת
  choice: 许多
  rationale: 作形容词表示数量众多；“许多”是自然、简洁的现代汉语表达。
- source_word: בָּנוֹת
  choice: 女子
  rationale: 字面义为“女儿们”，但在此诗歌和智慧文学语境中泛指女子；正文译作“女子”更符合现代汉语称赞妻子的语境，同时以脚注保留字面形式。
- source_word: עָשׂוּ חָיִל
  choice: 都行事卓越
  rationale: עָשׂוּ 表示“做、行”，חָיִל 语义丰富，可指力量、才干、英勇或卓越；“行事卓越”既保留动词结构，也不把含义局限为军事勇武。
- source_word: וְאַתְּ
  choice: 惟独你
  rationale: 连词与独立代词在此形成鲜明对比；“惟独你”自然传达强调和转折。
- source_word: עָלִית עַל כֻּלָּנָה
  choice: 超越了她们所有人
  rationale: 字面为“升到她们众人之上”，在比较语境中意为超过；“超越了她们所有人”保留完成体意味及全称比较。
