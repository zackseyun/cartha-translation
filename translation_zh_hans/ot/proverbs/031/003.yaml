base_translation:
  language: en
  yaml_path: translation/ot/proverbs/031/003.yaml
  text: Do not give your strength to women[b][a], or your ways to that which destroys kings.
translation:
  language: zh_hans
  text: 不要把你的力量[a]给女人；也不要走那毁灭君王的道路[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “力量”也可包括精力、能力、资源或财富，不只是身体的力气。
    reason: lexical_alternative
  - marker: b
    text: 原文此处的表达可较抽象地指“毁灭”或“败坏君王”的事、行径或过程；直译可作“也不要把你的道路交给毁灭君王之事”。原文未明确指出施行毁灭的是何人或何物。
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: אַל תִּתֵּן
  choice: 不要……给
  rationale: 保留否定劝诫和“给予”的基本比喻，不将其强化为“彻底交出”或“挥霍”。
- source_word: לַנָּשִׁים
  choice: 给女人
  rationale: 原文为复数“女人”，并未限定为妻妾或外邦女子；直译可避免无根据地缩小范围。
- source_word: חֵילֶךָ
  choice: 你的力量
  rationale: חַיִל 可涵盖体力、精力、能力和资财。“力量”既自然，又保留其宽广语义；脚注提示其不限于身体力量。
- source_word: וּדְרָכֶיךָ
  choice: 也不要把你的道路交给
  rationale: דֶּרֶךְ 的复数既可指道路，也可指行为方式和人生方向。补出前半句省略的“交给”，使汉语句法完整，同时维持两分句的平行。
- source_word: לַמְחוֹת מְלָכִין
  choice: 给那毁灭君王的事
  rationale: מחה 表示抹去、消灭或毁灭；这里的形式可作较抽象的动作表达。译作“那毁灭君王的事”避免擅自指定某类人，并保留原文所说的毁灭性后果。
- source_word: מְלָכִין
  choice: 君王
  rationale: 准确传达“王”的复数含义，并契合本章对王者的训诲语境。
theological_decisions:
- issue: 关于“女人”的警告范围
  choice: 按原文译为复数“女人”，理解为对会耗损王者力量的性关系或情欲纠葛所作的智慧劝诫
  alternative: 特指外邦妻妾、王室多妻制，或把本句理解为对所有女人的一般性贬斥
  rationale: 原文没有“外邦”或“妻妾”等限定，也没有就女性本性作教义判断。译文保留其概括措辞，但不额外引入贬斥女性的解释。
- issue: חֵילֶךָ 的范围
  choice: 采用宽泛的“力量”，包括精力、能力和资源
  alternative: 专指财富或性能力
  rationale: 该词语义范围较宽；若只译作财富或性能力，会把原文可能有意保留的多重含义过早收窄。
- issue: לַמְחוֹת מְלָכִין 的句法关系
  choice: 译为抽象的“那毁灭君王的事”
  alternative: “毁灭君王的人”或“走上毁灭君王的道路”
  rationale: 马所拉文本可表达毁灭或败坏君王的事物、行为或过程。抽象译法不强行增添明确的人称主体，脚注同时保留另一种自然理解。
translation_notes:
  register: 采用现代、庄重而易懂的劝诫语体。“把……给……”保留原文鲜明的给予意象；“道路”保留智慧文学中行为方式与人生方向的双重意味。
