  text: She girds her waist with strength and makes her arms strong[a].
translation:
  language: zh_hans
  text: 她以力量束腰[a]，使自己的双臂强健。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“她以力量束紧腰身。”希伯来文保留了一个具体的身体意象，表现她预备行动、充满干劲。
    reason: lexical_alternative
lexical_decisions:
- source_word: חָגְרָה
  choice: 束
  rationale: 该动词具体指系上、束紧，常与腰部相连；“束腰”保留希伯来文关于预备行动的身体意象，也符合箴言格言体的现在时表达。
- source_word: בְעֹז
  choice: 以力量
  rationale: עֹז 表示力量、能力；介词 בְּ 在此可表达凭借或装备，“以力量”既保留工具意味，也保持语句庄重。
- source_word: מָתְנֶיהָ
  choice: 腰
  rationale: 该词指腰或腰胯部；现代汉语以“腰”最自然清楚，并与“束腰”的固定搭配相合。
- source_word: וַתְּאַמֵּץ
  choice: 使……强健
  rationale: Piel 形式表达使之有力、坚固；“使……强健”保留使动含义，并自然表现劳动能力。
- source_word: זְרֹעוֹתֶיהָ
  choice: 自己的双臂
  rationale: 复数名词指两臂；“双臂”在现代汉语中自然，并突出她身体上的力量与劳作能力。
theological_decisions: []
