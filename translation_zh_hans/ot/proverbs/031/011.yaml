  yaml_path: translation/ot/proverbs/031/011.yaml
  text: The heart of her husband trusts in her, and he will lack no gain.
translation:
  language: zh_hans
  text: 她丈夫的心信赖她；他必不缺少收益。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּטַח
  choice: 信赖
  rationale: 表达安心倚靠、确信可靠之意；在夫妻关系语境中比单纯“相信”更贴切。
- source_word: לֵב בַּעְלָהּ
  choice: 她丈夫心里
  rationale: 保留希伯来文以“心”指内在思想、信任与确信的表达，同时采用自然的现代汉语语序。
- source_word: שָׁלָל
  choice: 所得
  rationale: 该词本义可指战利品或掠物，此处用于家庭兴旺的语境，指由妻子的才干带来的收获或利益；“所得”既自然，也保留其宽泛的收益含义。
- source_word: לֹא יֶחְסָר
  choice: 必不缺少
  rationale: 准确表达否定与未完成体所呈现的持续或将来结果；“必”体现丈夫信赖她所带来的可靠结果。
theological_decisions: []
