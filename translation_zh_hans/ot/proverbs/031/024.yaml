  text: She makes linen garments and sells them[c][b][a], and supplies belts to the merchant.
translation:
  language: zh_hans
  text: 她制作细麻衣服[a]出售，把腰带[b]供应给商人[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “细麻衣服”或译“细麻布”。
    reason: lexical_alternative
  - marker: b
    text: “腰带”或译“腰巾”或“束带”。
    reason: lexical_alternative
  - marker: c
    text: “商人”希伯来文直译为“迦南人”；这里很可能指商人或行商。
    reason: lexical_alternative
lexical_decisions:
- source_word: סָדִין
  choice: 细麻衣服
  rationale: 该词可指细麻布，也可指用这种布制成的衣物；商业语境表明这里说的是可出售的成品，但原文在布匹与衣物之间仍有词义空间，故以脚注保留另一种译法。
- source_word: עָשְׂתָה
  choice: 做
  rationale: 完成式在这首人物画像诗中描述惯常活动，现代汉语用无时态标记的“做”自然表达持续或经常性的行为。
- source_word: וַתִּמְכֹּר
  choice: 拿去卖
  rationale: 原文意为“并卖”；“拿去卖”符合现代汉语表达，并自然承接前面的制成品，不必另加代词。
- source_word: חֲגוֹר
  choice: 腰带
  rationale: 该名词指束在腰间的物件；“腰带”清楚、现代而中性，“腰巾”或“束带”也有可能，故在脚注说明。
- source_word: נָתְנָה
  choice: 供应给
  rationale: 字面为“给”，但上下文是生产和交易；“供应给”表达商业交付之意，同时不过度具体化交易方式。
- source_word: לַכְּנַעֲנִי
  choice: 给商人
  rationale: 字面是“给迦南人”，但“迦南人”在此商业语境中很可能引申为商人或行商；正文采用语境义，并以脚注保留字面形式。
