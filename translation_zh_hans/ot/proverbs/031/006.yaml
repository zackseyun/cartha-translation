  text: תְּנוּ שֵׁכָ֣ר לְ/אוֹבֵ֑ד וְ֝/יַיִן לְ/מָ֣רֵי נָֽפֶשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/031/006.yaml
  text: Give strong drink to one who is perishing[b][a], and wine to those bitter in soul.
translation:
  language: zh_hans
  text: 要把浓酒给将要灭亡的人[a]，把葡萄酒给心里愁苦的人[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“将死的人”。希伯来语分词的含义较宽，可指正在灭亡、遭毁坏或濒临死亡的人。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“心里苦的人”，是形容内心深受痛苦或处境悲惨的说法。
    reason: cultural_note
lexical_decisions:
- source_word: תְּנוּ
  choice: 要把……给……
  rationale: 这是נתן的复数祈使式。中文用“要把……给……”自然表达直接命令，并适合本节两个并列受词。
- source_word: שֵׁכָר
  choice: 浓酒
  rationale: 泛指葡萄酒以外、能使人醉的酒类。“浓酒”沿用易懂的圣经用语，同时避免用“烈酒”令人误以为特指蒸馏酒。
- source_word: לְאוֹבֵד
  choice: 给将要灭亡的人
  rationale: אבד的分词可指正在走向毁灭、濒临死亡或败亡的人。“将要灭亡”保留其较宽的语义范围；另以脚注说明也可理解为“将死的人”。
- source_word: וְיַיִן
  choice: 把葡萄酒
  rationale: יַיִן是通常表示葡萄酒的词；中文补出第二个“把”，使并列句自然清楚。
- source_word: לְמָרֵי נָפֶשׁ
  choice: 给心里愁苦的人
  rationale: 原文是“心（נפש）苦的人”这一表达，指内心深受痛苦、困顿悲惨的人。“心里愁苦”既保留苦楚的意象，也符合现代汉语。
- source_word: נָפֶשׁ
  choice: 心里
  rationale: 此处指人的内在生命与感受，而不是与身体相对的抽象“灵魂”；在该习语中译作“心里”最自然。
theological_decisions:
- issue: 本节是否应弱化为仅限医疗用途，或改译成讽刺语气，以免被理解为普遍赞同醉酒
  choice: 按希伯来文本保留直接命令的语气，不在正文中加入用途限制或讽刺意味。
  alternative: 意译为有限度的药用；或把命令改写成反讽。
  rationale: 本节的希伯来文使用直接的祈使式，本身没有明说医疗限制，也没有明确标示反讽。相关伦理与上下文关系应留给经文语境和解释处理，不应由译文擅自补入。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“浓酒”与“葡萄酒”形成原文中的词语对举；“将要灭亡”保留אבד的语义宽度，“心里愁苦”则以自然汉语传达“苦于נפש”的惯用表达。两个脚注标记均紧跟各自所解释的短语。
