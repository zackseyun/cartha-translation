base_translation:
  language: en
  yaml_path: translation/ot/proverbs/031/025.yaml
  text: Strength and dignity are her clothing[a], and she laughs at the days to come.
translation:
  language: zh_hans
  text: 力量和尊荣是她的衣裳；她笑对将来。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“她笑对未来”；直译：“她向着后来的（或末后的）日子欢笑。”
    reason: 保留 לְיוֹם אַחֲרוֹן 的字面词义空间；在本段智慧文学语境中，正文按“将来／未来”理解，同时不排除“后来／末后”的较直译表达。
lexical_decisions:
- source_word: עֹז
  choice: 能力
  rationale: 此词表示力量、能力；在这里指她内在坚强、足以担当的品格。“能力”与下文“尊荣”搭配自然，也避免只让人联想到体力。
- source_word: הָדָר
  choice: 尊荣
  rationale: 此词可指荣美、威严、尊贵。这里描写女子可敬的品格和仪态，“尊荣”既保留其荣耀感，又不刻意引入王室意味。
- source_word: לְבוּשָׁהּ
  choice: 是她的衣裳
  rationale: 保留希伯来文以衣裳比喻品格的表达：能力和尊荣如同她穿在身上的衣服，为人所见。
- source_word: וַתִּשְׂחַק
  choice: 坦然欢笑
  rationale: שׂחק的基本意义是“笑”。加“坦然”以自然表达这里面对未来毫不畏惧的语用含义，同时保留“欢笑”的鲜明意象，而不弱化为“微笑”。
- source_word: לְיוֹם אַחֲרוֹן
  choice: 面对将来的日子
  rationale: 字面可作“对着后来／末后的日子”。在智慧文学语境中主要指未来；“面对将来的日子”在现代汉语中自然，并保留介词所表达的面向关系。单数集合性地译为“日子”，避免误读为特定的末日。
theological_decisions:
- issue: אַחֲרוֹן是否具有末世论意义
  choice: 按智慧文学语境译为普通意义的未来，即“将来的日子”
  alternative: “末后的日子”或“最后一日”，可能带有末世论含义
  rationale: 本节强调这位女子因能力和尊荣而能无惧未来，并未明确论述最后审判。不过，אַחֲרוֹן确可表示“末后的／最后的”，因此在脚注中保留其较直译的可能性，不把词义张力完全消除。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“衣裳”保留诗性比喻；“坦然欢笑”传达面对未来的无惧信心。脚注标记[a]已置于正文相关句末。
