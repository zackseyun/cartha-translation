  text: She makes coverings for herself[a]; fine linen and purple are her clothing.
translation:
  language: zh_hans
  text: 她为自己制作铺盖[a]；她的衣服是用细麻布和紫色布料制成的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“床罩”“床上的铺盖”，也可能指“挂毯”。希伯来语泛指铺展开来的纺织覆盖物，可能是贵重的家用织品。
    reason: lexical_alternative
lexical_decisions:
- source_word: מַרְבַדִּים
  choice: 各样的铺盖
  rationale: 该复数名词泛指铺展开来的织物，很可能是家用或床用的覆盖物。“铺盖”在现代汉语中自然地保留了这一范围；加“各样的”体现复数，同时不限定为某一种织物。
- source_word: עָשְׂתָה
  choice: 制作
  rationale: 希伯来语完成式在这首智慧诗的描写中可表达惯常、典型的行为；汉语用无时态标记的“制作”，自然呈现她一贯的作为。
- source_word: לָּהּ
  choice: 为自己
  rationale: 介词加第三人称阴性单数后缀可表示受益者或归属；“为自己”符合本节所描写的自用铺盖。
- source_word: שֵׁשׁ
  choice: 细麻
  rationale: 该词通常指质地优良的麻织物；“细麻”既简洁，又保留其品质与贵重感。
- source_word: אַרְגָּמָן
  choice: 紫色布料
  rationale: 该名词指昂贵的紫色染料或紫染织物。此处与衣服相关，译作“紫色布料”可避免把颜色误读为抽象概念。
- source_word: לְבוּשָׁהּ
  choice: 她的衣服
  rationale: 该单数名词可作集合意义，泛指她的衣着；现代汉语“她的衣服”自然且不暗示只有一件衣裳。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而通俗的汉语。“铺盖”保留原词的宽泛含义，并以脚注列出较窄或传统的可能译法；后半句稍作显化，用“做的”自然说明衣服的材质。
