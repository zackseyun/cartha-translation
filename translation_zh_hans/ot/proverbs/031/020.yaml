  text: She opens her palm to the poor[b][a], and extends her hands to the needy.
translation:
  language: zh_hans
  text: 她向贫困者摊开手掌[a]，向穷乏者伸出双手[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “摊开手掌”或译“展开手掌”“敞开手掌”。
    reason: lexical_alternative
  - marker: b
    text: “伸出”也可译“伸展”或“伸向”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּפָּהּ
  choice: 她的手掌
  rationale: כַּף具体指手掌或手的掌面；译作“手掌”保留原文形象，并与“敞开”自然搭配。
- source_word: פָּרְשָׂה
  choice: 敞开
  rationale: פרשׂ有铺开、展开、伸展之意；以“手掌”为宾语时，“敞开”在现代汉语中自然地表现慷慨施予的开放姿态，同时脚注保留“摊开”的可能。
- source_word: לֶעָנִי
  choice: 向贫困的人
  rationale: עָנִי可指贫穷、受苦或处境卑微的人；本节描写实际援助，“贫困的人”最符合语境，又不抹去其社会弱势意味。
- source_word: יָדֶיהָ
  choice: 双手
  rationale: 该形式在这里自然指她的两只手；“双手”既准确，也保留与前半句单数“手掌”的诗意变化。
- source_word: שִׁלְּחָה
  choice: 伸出
  rationale: שלח的加强词干可表达伸展或送出；与“双手”和受助对象连用时，“伸出”忠实、自然，并保留实际援助的动作形象。
- source_word: לָאֶבְיוֹן
  choice: 向穷乏的人
  rationale: אֶבְיוֹן指缺乏生活所需、处于穷困中的人；“穷乏的人”与前句“贫困的人”形成近义平行，同时保留两个希伯来词的细微区别。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“向……敞开手掌／伸出双手”保留希伯来诗歌的身体意象和同义平行；不将动作抽象化为单纯的“周济”，以避免缩窄原文含义。
