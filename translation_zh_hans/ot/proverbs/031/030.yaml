  text: שֶׁ֣קֶר הַ֭/חֵן וְ/הֶ֣בֶל הַ/יֹּ֑פִי אִשָּׁ֥ה יִרְאַת יְ֝הוָ֗ה הִ֣יא תִתְהַלָּֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/031/030.yaml
  text: Charm is deceitful[a], and beauty is fleeting[c][b], but a woman who fears Yahweh shall be praised.
translation:
  language: zh_hans
  text: 魅力是骗人的，美貌不过是雾气[a]；敬畏雅威的女子[b]，她必受称赞[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雾气”也可译作“虚空”或“转瞬即逝之物”；希伯来语既可强调短暂，也可强调空幻。
    reason: lexical_alternative
  - marker: b
    text: “女子”也可译作“妻子”；希伯来语 אִשָּׁה 可按上下文表示二者。
    reason: alternative_reading
  - marker: c
    text: “必受称赞”也可能理解为“可夸耀自己”或“必自夸”；不过本章结尾的语境更支持“受称赞”。
    reason: alternative_reading
lexical_decisions:
- source_word: שֶׁקֶר
  choice: 虚假的
  rationale: 该名词表示虚假、谎言或欺骗。用“虚假的”作“魅力”的表语，既保留原文直陈式判断，也表达外在魅力并不可靠、可能使人受骗的含义。
- source_word: הַחֵן
  choice: 魅力
  rationale: 此处指令人喜爱、吸引人的外在风采；“魅力”比神学语境中的“恩典”或人际语境中的“恩宠”更切合上下文。
- source_word: הֶבֶל
  choice: 不过是雾气
  rationale: 原词的基本意象是气息、蒸气或雾气，并可引申为短暂、空幻。正文保留具体意象，同时以“不过是”传达其价值判断。
- source_word: הַיֹּפִי
  choice: 美貌
  rationale: 该词表示美丽；在本段对女子的描写中，“美貌”自然地指向外表之美。
- source_word: אִשָּׁה
  choice: 女子
  rationale: 该词可指女人或妻子。这里采用不预先限定婚姻身份的“女子”，并以脚注保留“妻子”的可能。
- source_word: יִרְאַת יְהוָה
  choice: 敬畏雅威的
  rationale: 原文为“敬畏雅威”的名词性结构，用定语结构修饰“女子”，在现代汉语中清楚自然，也保留智慧文学的核心主题。
- source_word: יְהוָה
  choice: 雅威
  rationale: 直接音译四字神名，以区别于作为称号的“主”，并保留原文的盟约之名。
- source_word: הִיא
  choice: 她
  rationale: 原文独立代词带有强调作用；显明译出“她”，突出真正配受称赞的是这位敬畏雅威的女子。
- source_word: תִתְהַלָּל
  choice: 必受称赞
  rationale: 该形式可有反身义“夸耀自己”，也可有近似被动义“受称赞”。全诗结尾正在公开称赞贤德女子，因此正文采用“必受称赞”，同时在脚注保留反身读法。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华／上主
  rationale: 原文直接使用四字神名。采用“雅威”以音译其专名，不将其改写为称号，同时避免把特定宗派传统的形式当作唯一读法。
- issue: תִתְהַלָּל 的语态和意义
  choice: 近似被动义“必受称赞”
  alternative: 反身义“可夸耀自己／必自夸”
  rationale: Hitpael 形式容许反身理解，但本章结尾的语境是众人称赞这位女子，因而近似被动义更合适；脚注保留其真实的词义张力。
- issue: אִשָּׁה 的身份范围
  choice: 女子
  alternative: 妻子
  rationale: 该词本身兼有“女人”和“妻子”两义。正文不把婚姻身份强加于单句，但脚注说明本诗上下文也容许译作“妻子”。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“魅力是虚假的”保留箴言式的直接判断；“美貌不过是雾气”保留希伯来语的具体意象，而不只给出抽象释义。分号呈现前后价值对照，显明外在吸引力与敬畏雅威之间的张力。
