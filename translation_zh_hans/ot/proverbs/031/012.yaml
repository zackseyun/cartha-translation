  text: She does him good[a], and not harm, all the days of her life.
translation:
  language: zh_hans
  text: 她一生都善待丈夫[a]，不伤害他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“她以善回报他，不以伤害待他。”希伯来语动词也可表示“对待”或“报偿、回报”某人。
    reason: lexical_alternative
lexical_decisions:
- source_word: גְּמָלַתְהוּ
  choice: 使丈夫得益
  rationale: גמל可表示对待、报答或回报某人；与“好处”和“不受损”相配时，这里表达她持续以有益的方式待丈夫。中文用“使丈夫得益”自然地传达这一关系意义，同时不把它限定为对既往行为的报答。
- source_word: טוֹב
  choice: 得益
  rationale: טוֹב在这里作名词性用法，指好处、益处；结合中文动词结构译为“得益”，简洁而自然。
- source_word: וְלֹא רָע
  choice: 不使他受损
  rationale: רָע在此关系语境中主要指伤害、损害，而非抽象的道德邪恶；“受损”与“得益”形成清楚、凝练的对照。
- source_word: כֹּל יְמֵי
  choice: 一生都
  rationale: 该希伯来语时间短语表示贯穿全部日子；现代汉语以“一生都”自然表达持续且无例外的时间范围。
- source_word: חַיֶּיהָ
  choice: 一生
  rationale: חַיִּים虽为复数形式，通常指一个人的生命或一生；译作“一生”符合现代汉语习惯。
