  text: A wife of noble character—who can find? Her value is far beyond jewels[a][b][c].
translation:
  language: zh_hans
  text: 才德兼备的妻子，谁能寻得？她的价值远胜珠宝[a][b][c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“才德兼备的女子”；希伯来语也可泛指女子，但本段的家庭语境较支持“妻子”。
    reason: lexical_alternative
  - marker: b
    text: “珠宝”所译的希伯来词也可能指“珍珠”，传统上也常译作“红宝石”；具体为何种珍宝并不确定。
    reason: lexical_alternative
  - marker: c
    text: “她的价值远胜珠宝”或译：“她的身价远高于珠宝。”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵשֶׁת
  choice: 妻子
  rationale: 这是אִשָּׁה的构造形式；本段以家庭生活为背景，译作“妻子”比泛指的“女子”更贴切，同时脚注保留后者。
- source_word: חַיִל
  choice: 才德兼备
  rationale: חַיִל可表达力量、能力、卓越和品格等复合含义；“才德兼备”自然概括其能干、有力量且品格高尚的意义，不把它局限为军事性的“勇武”。
- source_word: מִי יִמְצָא
  choice: 谁能寻得？
  rationale: 未完成式在这里构成反问，强调这样的人难得；“谁能寻得”既保留形式，也符合庄重而自然的现代汉语。
- source_word: וְרָחֹק
  choice: 远胜
  rationale: 原义为“遥远”，在价值比较中表示远远超过；“远胜”简洁地传达这种超越关系。
- source_word: פְּנִינִים
  choice: 珠宝
  rationale: 所指的具体宝石不确定，可能指珍珠、红宝石、珊瑚或贵重饰物；“珠宝”避免过度具体化。
- source_word: מִכְרָהּ
  choice: 她的价值
  rationale: 该词指价格或估值；“价值”保留比较之意，又避免把人贬缩为商品。
