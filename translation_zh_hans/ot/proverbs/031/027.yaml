  text: צ֭וֹפִיָּה הֲלִיכ֣וֹת בֵּיתָ֑/הּ וְ/לֶ֥חֶם עַ֝צְל֗וּת לֹ֣א תֹאכֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/031/027.yaml
  text: She watches over the ways of her household[b][a], and does not eat the bread of idleness.
translation:
  language: zh_hans
  text: 她留心察看家中的事务[a]，不吃懒惰的饭[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“她察看她家的行事（或动向）。”这里指她留心家庭的日常运作；也可译作“她留心照管家中的事务”。
    reason: lexical_alternative
  - marker: b
    text: “懒惰的饭”是希伯来语的形象说法，指以懒散、怠惰为生活方式。
    reason: cultural_note
lexical_decisions:
- source_word: צוֹפִיָּה
  choice: 留心照管
  rationale: 该词是צפה的阴性单数主动分词，表示持续、警醒地察看；“留心照管”既体现经常性的关注，也自然表达家庭管理语境中的监督与照料。
- source_word: הֲלִיכוֹת
  choice: 一切事务
  rationale: 该复数名词字面指“行走、动向”，在此语境中指家里的运行情况和日常事务；正文采用自然汉语表达，脚注保留其字面意象。
- source_word: בֵּיתָהּ
  choice: 家中
  rationale: בַּיִת既可指房屋，也可指家庭或家里的人与事务；此处着眼于家庭生活的运作，“家中”能保留一定范围上的开放性。
- source_word: לֶחֶם
  choice: 饭
  rationale: 该词字面为“饼、食物”，也是日常食粮的泛称；汉语“吃……的饭”能自然保留以食物比喻生活方式或所得的表达。
- source_word: עַצְלוּת
  choice: 懒惰
  rationale: 该名词指怠惰、懒散；“懒惰”是现代汉语中清楚、庄重且无古奥色彩的对应词。
- source_word: לֹא תֹאכֵל
  choice: 不吃
  rationale: 未完成式在箴言体中描述一贯的特征，而非单纯将来动作；“不吃”简洁表达其惯常不以懒惰为生。
theological_decisions: []
translation_notes:
  register: 采用现代、自然而庄重的普通话。“留心照管”呈现持续主动的关注；“家中的一切事务”使希伯来语“家里的动向”在中文中清楚可懂，同时由脚注保存原文意象。“懒惰的饭”保留原文食物隐喻，并避免使用较古雅的“惰食”。
