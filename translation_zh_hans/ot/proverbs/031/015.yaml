  yaml_path: translation/ot/proverbs/031/015.yaml
  text: She rises while it is still night and gives food to her household and portions to her servant girls[a].
translation:
  language: zh_hans
  text: 夜还未尽，她就起身，把食物分给家里的人，也把定额分给婢女们。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “定额”或译“应得的一份”“指定的份额”。希伯来语可指规定的应得份额或固定配给。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּקָם
  choice: 她就起来
  rationale: קום的Qal连续式在箴言诗歌的描写中表达鲜明而惯常的行动；中文用“就起来”自然承接时间状语。
- source_word: בְּעוֹד לַיְלָה
  choice: 天还没亮
  rationale: 原短语直指仍在夜间；“天还没亮”是现代汉语自然表达，保留早起之意，又不限定精确时刻。
- source_word: וַתִּתֵּן
  choice: 分给
  rationale: נתן基本义为“给”；结合食物和份额的语境，译作“分给”更符合中文搭配，并保持供应、分配的动作。
- source_word: טֶרֶף
  choice: 食物
  rationale: 该词虽可指“猎物”，但在家庭供养的语境中指食物或口粮；“食物”清楚且不致误解。
- source_word: לְבֵיתָהּ
  choice: 家里的人
  rationale: בַּיִת在此指家庭共同体而非仅指房屋；“家里的人”是普通现代读者易懂的表达。
- source_word: וְחֹק
  choice: 规定的份
  rationale: חֹק可指规定、定额或应得的份；此处与食物形成平行，译作“规定的份”既保留固定配额之意，也不把含义收窄为工作任务。
- source_word: לְנַעֲרֹתֶיהָ
  choice: 婢女们
  rationale: נַעֲרוֹת指在她家中服侍的年轻女子或女仆；“婢女们”简洁、庄重，并清楚表达其家庭服役身份。
theological_decisions: []
