base_translation:
  language: en
  yaml_path: translation/ot/proverbs/031/005.yaml
  text: lest he drink and forget what has been decreed[b][a], and pervert the justice due to all the afflicted.
translation:
  language: zh_hans
  text: 免得他喝了酒，忘记所颁定的[a]，并屈枉所有受苦之人的案件[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“法令”或“所规定的”。
    reason: alternative_reading
  - marker: b
    text: “受苦之人”原文直译为“困苦之子”，指遭受苦难、贫困或压迫的人。“案件”也可译为“判决”或“他们应得的公正”。
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּן
  choice: 免得
  rationale: 引出应当防止的后果，保留原文简洁的警戒语气。
- source_word: יִשְׁתֶּה וְיִשְׁכַּח
  choice: 他喝了酒，就忘记
  rationale: 以现代汉语自然表达饮酒及其后果；“酒”由上节语境补明。
- source_word: מְחֻקָּק
  choice: 所颁定的
  rationale: 该词是חקק的被动分词，可指已经规定或颁定之事；保留其开放性，不将其限缩为某一条“法律”。
- source_word: וִישַׁנֶּה
  choice: 歪曲
  rationale: 此处处于司法语境，所指不是中性的改变，而是不当改变、扭曲判决。
- source_word: דִּין
  choice: 公正判决
  rationale: דִּין可指审判、案件或应有的公正；这里结合君王的司法职责，译为“公正判决”，兼顾司法行为与公义结果。
- source_word: כָּל בְּנֵי עֹנִי
  choice: 所有受苦之人
  rationale: בְּנֵי עֹנִי直译为“困苦之子”，是指以困苦、受压或患难为处境的人；采用自然且涵盖面较广的现代汉语。
theological_decisions:
- issue: מְחֻקָּק所指的范围
  choice: 所颁定的
  alternative: 法令／所规定的
  rationale: 原文没有明确限定为某一具体法典或单一法令，因此保留概括性。
- issue: דִּין与受苦者的关系
  choice: 所有受苦之人的公正判决
  alternative: 所有受苦之人的权益／案件
  rationale: 原文可侧重判决、案件或司法公正；正文保留司法语境，脚注提示其他可能表达，避免把意义只收窄为抽象“权益”。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“免得……就……”清楚呈现警戒与后果；避免生硬直译“困苦之子”，同时用脚注保留希伯来习语及דִּין的语义张力。
