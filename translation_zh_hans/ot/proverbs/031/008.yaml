  yaml_path: translation/ot/proverbs/031/008.yaml
  text: Open your mouth for the mute[a], for the cause of all the passing away.
translation:
  language: zh_hans
  text: 你要为不能说话的人开口，为一切行将消逝之人的案件申辩[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “为一切行将消逝之人的案件”：此希伯来语短语较难确定，尤其是罕见词“חֲלוֹף”。也可理解为“为一切穷困无助之人的案件申辩”或“为一切正在消逝之人的案件申辩”；较直译可作“为一切属短暂无常之人的案件申辩”。
    reason: 保留罕见词חֲלוֹף的词义不确定性，以及אֶל־דִּין与后续短语之间可能的句法和语义关系。
lexical_decisions:
- source_word: פְּתַח פִּיךָ
  choice: 开口
  rationale: 直译为“张开你的口”，但现代汉语用“开口”既保留口的意象，也自然表达出声发言的劝勉语气。
- source_word: לְאִלֵּם
  choice: 为不能说话的人
  rationale: אִלֵּם指哑者或无法说话的人。“不能说话的人”比“哑巴”更庄重自然，也保留原词的基本意义，不预先把它泛化为所有无力申辩者。
- source_word: אֶל־דִּין
  choice: 为……的案件发言
  rationale: דִּין在这里具有审判、诉讼或案情方面的含义；结合“开口”，译文表达为他人的案件代言，避免仅译成较抽象的“正义”或过度确定为现代法律术语“权利”。
- source_word: כָּל בְּנֵי חֲלוֹף
  choice: 一切行将消逝之人
  rationale: בְּנֵי是表示某类人的习语；罕见词חֲלוֹף可能与“经过、消逝”相关。“行将消逝之人”保留其动态意象和语义的不确定性，并用脚注列出其他可能理解。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“开口”保留希伯来语的具体意象；“案件发言”呈现司法性语境，但不把原文收窄为某一种现代法律制度。
