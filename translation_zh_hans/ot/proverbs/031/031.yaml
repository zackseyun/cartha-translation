  yaml_path: translation/ot/proverbs/031/031.yaml
  text: Give her of the fruit of her hands[b][a], and let her works praise her in the gates.
translation:
  language: zh_hans
  text: '要把她双手劳作的成果给她；

    愿她所做的在城门口[a]称赞她[b]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “城门口”是古代以色列社会处理公共事务、施行审判和给予荣誉认可的重要场所。
    reason: cultural_note
  - marker: b
    text: 原文把她所做的拟人化，描写这些成果在公众面前为她的价值作见证。也可译作：“愿她的事迹使她得着称赞。”
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּנוּ לָהּ
  choice: 要……给她
  rationale: תְּנוּ是复数命令式，לָהּ是间接受词“给她”。译文保留直接劝令的语气，同时使用现代汉语自然句式。
- source_word: מִפְּרִי יָדֶיהָ
  choice: 她双手劳作的成果
  rationale: 原文直译为“她双手的果实”。“成果”保留“果实”所表达的劳动所得之意，“双手劳作”则保留具体的手之意象，又避免生硬。介词מִן可表示从中取出或所得来源；译文不进一步限定究竟是让她享用成果、获得回报，还是得到应有认可。
- source_word: וִיהַלְלוּהָ
  choice: 愿……称赞她
  rationale: 该形式在前一句命令之后带有祈愿、吩咐性质。“愿”体现其意愿语气，并让“她所做的”作为主语来称赞她。
- source_word: בַשְּׁעָרִים
  choice: 在城门口
  rationale: 复数“城门”在古代以色列语境中指公共事务、审判和荣誉认可发生的地方。“城门口”是现代中文自然且保留历史场景的表达。
- source_word: מַעֲשֶׂיהָ
  choice: 她所做的
  rationale: מַעֲשֶׂה可指行为、工作或成就。“她所做的”简洁自然，并保留原文将其拟人化、让它们公开为她作见证的表达。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“双手劳作的成果”既传达希伯来文“她双手的果实”的具体意象，又便于普通读者理解；下半句保留原文鲜明的拟人表达和城门这一公共场景。
