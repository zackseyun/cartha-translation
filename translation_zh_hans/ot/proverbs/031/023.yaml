base_translation:
  language: en
  yaml_path: translation/ot/proverbs/031/023.yaml
  text: Her husband is known in the gates[b][a], when he sits among the elders of the land.
translation:
  language: zh_hans
  text: 她的丈夫与本地的长老同坐时，在城门口[a]为人所知[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 古代城门口是人们处理公共、司法和社群事务的地方。
    reason: cultural_note
  - marker: b
    text: 或译“受人尊重”或“为人认可”；希伯来语直译为“为人所知”。
    reason: lexical_alternative
lexical_decisions:
- source_word: נוֹדָע
  choice: 为人所知
  rationale: 希伯来语是 ידע 的尼法勒分词，表达“被人知道、为人认识”。译作“为人所知”保留其被动、状态性的含义，不把上下文所暗示的尊重直接写入正文。
- source_word: בַּשְּׁעָרִים
  choice: 在城门口
  rationale: 原文直译为“在众门中/在城门处”，在古代城市中指处理公共、司法和社群事务的场所。“城门口”既保留原有意象，也符合现代汉语表达。
- source_word: בַּעְלָהּ
  choice: 她的丈夫
  rationale: בעל 可指主人、拥有者或丈夫；本段描写贤能妻子的家庭生活，语境明确指丈夫，无须加入更强的支配意味。
- source_word: בְּשִׁבְתּוֹ
  choice: 同坐
  rationale: 原结构为介词 בְּ 加带后缀的不定式，字面义是“当他坐着时”。结合 עִם 译为“与……同坐”，自然表达他置身长老群体中的公开参与。
- source_word: עִם
  choice: 与
  rationale: 基本义为“和、与”。在“与当地的长老同坐”中，既忠实于原词，也自然呈现其参与长老群体的意思。
- source_word: זִקְנֵי אָרֶץ
  choice: 当地的长老
  rationale: 字面为“地之长老”。此处 אֶרֶץ 无定冠词，更自然地指本地、当地，而非特定的“那地”；“当地的长老”保留地域含义，并符合城门公共场景。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“为人所知”保留原文的词义开放性；“城门口”以脚注说明其古代公共功能；“当地的长老”避免把无定冠词的 אֶרֶץ 过度特定化为“全国”或擅自缩小为“城中的”长老。
