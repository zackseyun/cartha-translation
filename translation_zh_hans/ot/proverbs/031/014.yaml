base_translation:
  language: en
  yaml_path: translation/ot/proverbs/031/014.yaml
  text: She is like merchant ships[a]; from far away she brings her food.
translation:
  language: zh_hans
  text: 她像商船一样，从远方运来她的食物。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“她的饼”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הָיְתָה
  choice: 她如同
  rationale: 虽为完成式，但在箴言诗歌中描述惯常特征，汉语不必标明过去时；与比较结构合译为“她如同”。
- source_word: כָּאֳנִיּוֹת סוֹחֵר
  choice: 商船
  rationale: כְּ表示比拟；אֳנִיּוֹת为“船”的复数，סוֹחֵר限定其贸易性质。现代汉语用集合性的“商船”自然地表达原文。
- source_word: מִמֶּרְחָק
  choice: 从远方
  rationale: 保留מִן所表示的来源和מֶרְחָק所表示的距离；“从远方”简洁、自然，也符合诗体。
- source_word: תָּבִיא
  choice: 运来
  rationale: בוא的使役式意为“带来、使之来到”；与商船意象相连时，“运来”既自然又保留物资从远方而来的动态。
- source_word: לַחְמָהּ
  choice: 食物
  rationale: לֶחֶם字面为“饼、食粮”，也常泛指食物；本节谈从远方取得家庭所需，用“食物”更符合语境，并以脚注保留字面译法。
