  text: קָ֣מוּ בָ֭נֶי/הָ וַֽ/יְאַשְּׁר֑וּ/הָ בַּ֝עְלָ֗/הּ וַֽ/יְהַֽלְלָ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/031/028.yaml
  text: 'Her children rise up and call her blessed[a]; her husband also[b], and he praises her:'
translation:
  language: zh_hans
  text: 她的儿女起来，称她有福[a]；她的丈夫也赞美她：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“她的儿子们起来。”希伯来语בָנֶיהָ既可特指儿子，也可泛指儿女。
    reason: lexical_alternative
lexical_decisions:
- source_word: קָמוּ
  choice: 起来
  rationale: 保留קום的具体动作，也可自然表达儿女起身公开尊荣母亲的意味。
- source_word: בָנֶיהָ
  choice: 她的儿女
  rationale: בנים既可特指“儿子”，也可泛指“儿女、孩子”；此处家庭整体称颂的语境适合译作“儿女”，同时用脚注保留较窄的词义。
- source_word: וַיְאַשְּׁרוּהָ
  choice: 称她有福
  rationale: Piel形态的אשר表示宣称某人有福、幸运；“称她有福”直接、庄重，并保留公开肯定的含义。
- source_word: בַּעְלָהּ
  choice: 她的丈夫
  rationale: בעל虽可指主人或拥有者，但在本段家庭语境中明确指丈夫。
- source_word: וַיְהַלְלָהּ
  choice: 并且赞美她
  rationale: הלל的基本义为赞美、称颂；此处单数主语承接“她的丈夫”。
- source_word: וְ… בַּעְלָהּ
  choice: 她的丈夫也这样
  rationale: 希伯来文在“她的丈夫”后直接接“并且赞美她”，结构有所省略。“也这样”自然表达丈夫同样参与称颂，又不强行断定省略的是“起来”还是“称她有福”。
theological_decisions:
- issue: 丈夫所重复的动作
  choice: 以“也这样”保留省略结构的开放性
  alternative: 明确译为“她的丈夫也起来称她有福”或仅译“她的丈夫也称她有福”
  rationale: 原文没有重复动词，只写“她的丈夫，并且他赞美她”。明确补出某一动作会消除原文可能指向前面整组行动或其中一个行动的含混。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“称她有福”延续智慧文学的称颂语气；末尾保留冒号，因为下一节接续丈夫赞美的内容。
