  text: it prepares its food in summer[b][a]; it gathers its provisions at harvest.
translation:
  language: zh_hans
  text: 它在夏天预备食物[a]，在收割时收集食物[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“它的饼”，这里泛指维生的食物。
    reason: lexical_alternative
  - marker: b
    text: “收集食物”也可译为“储存食物”。
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּכִין
  choice: 预备
  rationale: 使役式在这里表示使某物准备妥当；“预备”自然体现蚂蚁为将来作准备的行动。
- source_word: בַּקַּיִץ
  choice: 在夏天
  rationale: 介词与定冠词名词共同标明行动发生的时节，直译为“在夏天”准确自然。
- source_word: לַחְמָהּ
  choice: 食物
  rationale: לֶחֶם虽常指“饼”或“粮食”，这里用于蚂蚁，泛指赖以维生的食物；译作“食物”避免不合语境的面饼意象。
- source_word: אָגְרָה
  choice: 聚敛
  rationale: אגר表示收集并积存；“聚敛”既保留收集动作，也带有积存备用的含义。
- source_word: בַקָּצִיר
  choice: 在收割时
  rationale: 该词指收割或收获的时期；“在收割时”保留原文的农业场景和时间意义。
- source_word: מַאֲכָלָהּ
  choice: 粮食
  rationale: מַאֲכָל指供食用之物；译作“粮食”与上句“食物”形成轻微词汇变化，也切合收割时聚集储粮的语境。
theological_decisions: []
translation_notes:
  register: 采用现代、凝练而庄重的箴言体表达；两分句保持平行结构，并以“食物／粮食”反映原文两个近义名词的变化。
