  yaml_path: translation/ot/proverbs/006/009.yaml
  text: How long[a], sluggard, will you lie there? When will you rise from your sleep?
translation:
  language: zh_hans
  text: 懒惰人[a]哪，你要躺到几时？你什么时候才从睡梦中起来？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“懒人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד מָתַי
  choice: 到几时
  rationale: 这是询问持续时间的惯用表达；“到几时”简洁自然，并保留责问的语气。
- source_word: עָצֵל
  choice: 懒惰人
  rationale: 这是《箴言》中指惯常懒散之人的智慧文学用语。“懒惰人”既保留其典型人物称谓的意味，也符合现代汉语的庄重语体；原文为阳性单数，在此具有代表性。
- source_word: תִּשְׁכָּב
  choice: 你要躺
  rationale: 原词意为“躺、躺卧”；此处指一直躺着不起来。译作“躺”比直接译成“睡”更贴近原文动作。
- source_word: מָתַי
  choice: 什么时候
  rationale: 直接表达第二个问句中的时间疑问，现代汉语自然清楚。
- source_word: תָּקוּם
  choice: 才……起来
  rationale: 动词意为“起来、起身”。“才”体现上下文中的催促和责问意味，但没有把动作改译为单纯“醒来”。
- source_word: מִשְּׁנָתֶךָ
  choice: 从睡梦中
  rationale: 原文是“从你的睡眠中”。“从睡梦中起来”在现代汉语中自然，同时保留“从……中”的源点关系。
