  text: and your poverty will come like a prowler[b][a], and your lack like an armed man.
translation:
  language: zh_hans
  text: 你的贫穷就会像游荡者一样临到[a]，你的缺乏也会像手持盾牌的人一样逼近[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “游荡者”更直译为“像一个四处行走的人”；也可理解为“行路的人”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“像武装的人一样逼近。”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָא
  choice: 就会……临到／也会……来到
  rationale: 完成式在这段警戒性的箴言中表达随之而来的结果；用“会”自然传达未来、必然后果的语气。
- source_word: כִמְהַלֵּךְ
  choice: 像游荡者一样
  rationale: 该词是הלך的使役反身式分词，基本意象是四处行走的人。“游荡者”保留其行走不定及逼近的威胁感，又不把原文明确化为“盗贼”。
- source_word: רֵאשֶׁךָ
  choice: 你的贫穷
  rationale: 此处רֵאשׁ意为贫困、穷乏；“贫穷”是现代汉语中清楚自然的对应词。
- source_word: וּמַחְסֹרְךָ
  choice: 你的缺乏
  rationale: מַחְסוֹר指欠缺、匮乏；译作“缺乏”可保留它与“贫穷”的同义平行，而不增添原文未说明的对象。
- source_word: כְּאִישׁ מָגֵן
  choice: 像手持盾牌的人一样
  rationale: מָגֵן通常指盾牌；直译保留具体而有威慑力的军事形象，避免仅译作“武装的人”而隐去盾牌。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的箴言体。两句以“临到／来到”形成自然平行；保留“贫穷／缺乏”的同义递进，并以脚注呈现两个比喻中真实存在的词义选择。
