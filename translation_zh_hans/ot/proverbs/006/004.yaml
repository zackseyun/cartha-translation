  text: Do not give sleep to your eyes[a], nor slumber to your eyelids.
translation:
  language: zh_hans
  text: 不要让你的眼睛睡觉；也不要让你的眼皮打盹[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语词也可指“瞌睡”或“昏昏欲睡”，表示浅睡或打盹的状态。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּתֵּן
  choice: 不要让
  rationale: אַל与未完成式构成否定禁令；“不要让”既自然，也保留נתן“给、让”的使动意味，符合“不给眼睛睡眠”这一希伯来语表达。
- source_word: שֵׁנָה
  choice: 睡觉
  rationale: 此词通常指睡眠；在现代汉语句式“让眼睛睡觉”中用动词形式更自然，同时保留原文具体意象。
- source_word: לְעֵינֶיךָ
  choice: 你的眼睛
  rationale: לְ在此标示间接对象；译入“让……睡觉”的汉语结构，无须另译“给”，并保留身体部位意象。
- source_word: וּתְנוּמָה
  choice: 也不要……打盹
  rationale: תְּנוּמָה表示浅睡、瞌睡或打盹；“打盹”与前句“睡觉”有所区分，也适合诗句的平行结构。
- source_word: לְעַפְעַפֶּיךָ
  choice: 你的眼皮
  rationale: עַפְעַף直接指眼皮；此译保留“眼睛／眼皮”的身体部位平行。
