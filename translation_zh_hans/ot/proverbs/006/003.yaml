base_translation:
  language: en
  yaml_path: translation/ot/proverbs/006/003.yaml
  text: 'Do this[a], then, my son, and deliver yourself, for you have come into the palm of your neighbor: go, humble yourself[c][b], and press your plea with your neighbors.'
translation:
  language: zh_hans
  text: 那么，我儿，你要这样做，救自己脱身，因为你已经落在邻舍掌中[a]：去，谦卑自己[b]，极力恳求你的邻舍们[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “落在邻舍掌中”是说落入邻舍的掌握或控制之下。
    reason: lexical_alternative
  - marker: b
    text: “谦卑自己”所译的希伯来词十分罕见，也可理解为“使自己卑微”“伏下身来”或“顺服下来”。
    reason: lexical_alternative
  - marker: c
    text: 希伯来文本这里是复数“邻舍们”，但本节前面是单数“邻舍”；有些人因此按单数含义理解为“你的邻舍”或“你的朋友”。
    reason: textual_difficulty
lexical_decisions:
- source_word: עֲשֵׂה זֹאת אֵפוֹא
  choice: 那么，你要这样做
  rationale: 将命令“要这样做”与表示推论和紧迫感的语气词 אֵפוֹא 结合；“那么”自然承接上文，又不额外加入时间含义。
- source_word: בְּנִי
  choice: 我儿
  rationale: 忠实保留智慧文学中阳性单数的亲子称呼，同时符合现代汉语庄重的劝诫语体。
- source_word: וְהִנָּצֵל
  choice: 救自己脱身
  rationale: 该尼法勒命令式在此表达使自己逃脱、获救；“救自己脱身”兼顾反身意味与处境中的紧迫性。
- source_word: כִּי בָאתָ בְכַף רֵעֶךָ
  choice: 因为你已经落在邻舍的手掌中
  rationale: כִּי 表明前述命令的理由；完成式表示已经陷入的现状。“手掌”保留 כַּף 的具体意象，中文“落在……手掌中”也能传达受人辖制的含义。
- source_word: לֵךְ
  choice: 去
  rationale: 保留简明有力的命令，带出随后两个紧急行动。
- source_word: הִתְרַפֵּס
  choice: 俯伏自谦
  rationale: 这是罕见词形，可能指使自己卑微，也可能包含俯身或伏地的动作；此译同时保留身体姿态和自我降卑两方面的可能性。
- source_word: וּרְהַב
  choice: 极力恳求
  rationale: רהב 在本处语义不常见，大意是急切、强烈地向对方施加请求；“极力恳求”符合脱身求情的语境，但不把具体请求内容写入正文。
- source_word: רֵעֶיךָ
  choice: 你的邻舍们
  rationale: 马所拉文本为阳性复数，正文照实保留；它与本节前面的单数“邻舍”形成张力，因此另加脚注说明。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的劝诫语体。“我儿”保留箴言的师父—儿子式称呼；冒号呈现由处境说明转向具体行动的结构。正文保留“手掌”的具体意象、罕见动词的语义张力，以及末尾复数形式，不借解释消除原文的困难。
