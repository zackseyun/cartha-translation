  text: כִּ֤י בְעַד אִשָּׁ֥ה זוֹנָ֗ה עַֽד כִּכַּ֫ר לָ֥חֶם וְ/אֵ֥שֶׁת אִ֑ישׁ נֶ֖פֶשׁ יְקָרָ֣ה תָצֽוּד־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/006/026.yaml
  text: For because of a prostitute one is reduced to a loaf of bread[c][b][a], but a married woman hunts a precious life.
translation:
  language: zh_hans
  text: 因妓女，人会穷到只剩一块饼[a]；而有夫之妇猎取宝贵的性命[b][c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文十分简练，较直译可作：“因妓女，至于一块饼。”多数译者理解为：与妓女来往会使人穷到只剩一块饼；也有人理解为：妓女的代价不过是一块饼。
    reason: lexical_alternative
  - marker: b
    text: “有夫之妇”原文直译为“一个男人的妻子”；在这里按上下文指别人的妻子，即奸淫情境中的已婚女子。
    reason: lexical_alternative
  - marker: c
    text: “性命”所译的希伯来词也可指“自己”或“灵魂”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文的警告，引出理由；现代汉语用“因为”自然表达其因果作用。
- source_word: בְעַד
  choice: 能使人
  rationale: 此处与后面的“只剩一块饼”构成高度省略的表达，语境指因与妓女交往而陷入贫困；补出结果关系以使汉语可懂，同时用脚注保留原文的压缩性。
- source_word: אִשָּׁה זוֹנָה
  choice: 妓女
  rationale: זוֹנָה在此指卖淫或淫乱的女子；“妓女”清楚、现代，并符合本节与有夫之妇的对照。
- source_word: עַד כִּכַּר לָחֶם
  choice: 只剩一块饼
  rationale: 字面为“直到一圆饼”，句法省略，通常理解为穷到仅剩基本口粮；“只剩一块饼”既保留意象，也传达贫困结果。
- source_word: וְאֵשֶׁת אִישׁ
  choice: 而有夫之妇
  rationale: 字面为“一个男人的妻子”。“有夫之妇”保留婚姻身份及与前句的对比，却不直接把她定义为“淫妇”。
- source_word: נֶפֶשׁ יְקָרָה
  choice: 宝贵的性命
  rationale: נֶפֶשׁ可指生命、自我或魂；警告语境中“性命”最贴切，同时保留“宝贵”所表达的价值。
- source_word: תָצוּד
  choice: 猎取
  rationale: 保留狩猎、捕捉猎物的鲜明比喻，并对应阴性单数主语“有夫之妇”。
theological_decisions:
- issue: נֶפֶשׁ是否译作“灵魂”
  choice: 宝贵的性命
  alternative: 宝贵的灵魂
  rationale: 该词语义范围包括生命、自我和魂；本段强调奸淫可能导致整个人及生命遭毁灭，译作“性命”更符合直接语境，也避免把希伯来语义过早限定为特定灵魂观。
- issue: 首句是否明确为付给妓女的价钱
  choice: 理解为因妓女而穷到只剩一块饼，但以脚注说明歧义
  alternative: 妓女的代价不过是一块饼
  rationale: 希伯来文极为压缩，既可引出贫困结果，也有译法将饼理解为妓女的价格；正文采用与警告语境相合的传统理解，但不把另一理解静默排除。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“只剩一块饼”自然呈现贫困意象；“猎取”保留原文的捕猎隐喻。正文不补出原文未明说的“男人”，并用脚注交代首句的句法压缩和主要歧义。
