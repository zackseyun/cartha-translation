  yaml_path: translation/ot/proverbs/006/010.yaml
  text: A little sleep[a], a little slumber, a little folding of the hands to lie down—
translation:
  language: zh_hans
  text: 睡一小会儿[a]，打个小盹，抱着双手躺一小会儿——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译：“少许睡眠，少许打盹，少许抱手躺卧。”原文三次重复“少许”。
    reason: 说明原文的名词性短语和三重重复；正文按现代汉语改为动作表达，同时保留“少许”的反复。
lexical_decisions:
- source_word: מְעַט
  choice: 一会儿
  rationale: 原文三次重复，表示少量或短暂时间；译文以三次“一会儿”保留反复的修辞节奏，并符合现代汉语表达。
- source_word: שֵׁנוֹת
  choice: 睡
  rationale: 该词形式上是复数，但在此泛指睡眠；汉语用动词“睡”自然简洁，也与后文动作并列。
- source_word: תְּנוּמוֹת
  choice: 打个盹
  rationale: 指较短、较浅的睡眠；“打个盹”是现代汉语常用表达，并与“睡”形成近义平行。
- source_word: חִבֻּק יָדַיִם
  choice: 抱着双手
  rationale: 原文字面为“双手的环抱”，在语境中描绘双手相抱、安闲不动的姿态；此译保留身体意象，避免直接释义为“懒散”。
- source_word: לִשְׁכָּב
  choice: 躺
  rationale: 该不定式意为“躺下、躺卧”；译作“躺”不与前面的睡眠词汇混同，并自然表达抱手而卧的姿态。
