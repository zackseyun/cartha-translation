  text: a heart that devises wicked plans[a], feet that hurry to run to evil,
translation:
  language: zh_hans
  text: 图谋恶计的心，急忙奔向恶事的脚，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֵב
  choice: 心
  rationale: 保留希伯来文以身体部位指内在思想和意图的表达，也与本段列举身体部位的形式相称。
- source_word: חֹרֵשׁ
  choice: 图谋
  rationale: 此处是比喻义，指筹划、谋划；“图谋”既自然，又能体现蓄意筹划的意味。
- source_word: מַחְשְׁבוֹת
  choice: （含于“图谋”）
  rationale: 该词指思想、谋划或计策。中文“图谋邪恶”已自然包含“谋划”这一名词概念，避免生硬地译作“图谋邪恶的计谋”。
- source_word: אָוֶן
  choice: 邪恶
  rationale: 在此表示道德上的恶或不义；“邪恶”准确表达其性质，并适合作“图谋”的内容。
- source_word: רַגְלַיִם
  choice: 脚
  rationale: 保留原文的身体部位意象；本节将心与脚并列，描绘内在谋划和外在行动。
- source_word: מְמַהֲרוֹת
  choice: 急忙
  rationale: 表达分词所含迅速、迫不及待的动态意味。
- source_word: לָרוּץ
  choice: 奔向
  rationale: “奔”保留“跑”的强烈动作感；与方向补语合译为“奔向”，符合现代汉语习惯。
- source_word: לָרָעָה
  choice: 恶事
  rationale: 希伯来文直译为“向着恶”。中文用“恶事”使行动所趋向的对象清楚，又不增添“去做”等原文未明说的动词。
theological_decisions: []
