  text: you have been snared by the words of your mouth[a]; you have been caught by the words of your mouth.
translation:
  language: zh_hans
  text: 你被自己口中的话套住了[a]；你被自己口中的话捉住了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你正被自己口中的话困住。”希伯来语的完成式在这里可以强调已经形成、目前仍持续的结果。
    reason: 说明希伯来语完成式可能具有当前结果的语气，并提供较不具比喻色彩的译法。
lexical_decisions:
- source_word: נוֹקַשְׁתָּ
  choice: 你被……套住了
  rationale: 该词是 יקש 的尼法勒式，表示落入罗网或圈套。“套住”保留了捕捉的比喻，也符合现代汉语表达。句末“了”体现希伯来语完成式所表达的既成状态。
- source_word: בְאִמְרֵי
  choice: 被……话
  rationale: 介词 ב 在此表示手段，即人是因自己的言语而陷入困境；אִמְרֵי 译为“话”，在箴言语境中自然明白。
- source_word: פִיךָ
  choice: 自己口中的
  rationale: 原文直译为“你的口”。译作“自己口中的”既保留“口”的具体意象，也清楚表明使人受困的是本人所说的话。
- source_word: נִלְכַּדְתָּ
  choice: 你被……捉住了
  rationale: 该词是 לכד 的尼法勒式，意为被捉住或被捕获。“捉住”与前句“套住”构成近义平行，并保留递进般的捕捉意象。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的汉语。“自己口中的话”保留原文“口”的意象；两个分句使用“套住／捉住”呈现希伯来诗歌的近义平行。
