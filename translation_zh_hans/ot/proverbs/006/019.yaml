  yaml_path: translation/ot/proverbs/006/019.yaml
  text: a false witness who breathes out lies[b][a], and one who sends out strife among brothers.
translation:
  language: zh_hans
  text: 吐出谎言[a]的假见证人，以及在弟兄之间散布纷争的人[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “吐出”也可译为“说出”；原文以呼气为喻，生动描写说出谎言。
    reason: lexical_alternative
  - marker: b
    text: 原文直译“在弟兄之间”；既可指亲兄弟，也可泛指关系密切的群体成员。
    reason: cultural_note
lexical_decisions:
- source_word: יָפִיחַ
  choice: 吐出
  rationale: 使役形在这里以呼气为意象，惯用于说出话语；“吐出”保留了希伯来文生动的表达，同时现代汉语也能自然理解。
- source_word: כְּזָבִים
  choice: 谎言
  rationale: 该复数名词指虚假之言；汉语“谎言”简洁自然，并保留其明确的道德含义。
- source_word: עֵד שָׁקֶר
  choice: 假见证人
  rationale: 原文直译为“虚假的见证人”，具有作证场景中的法律和道德意味；“假见证人”是清楚而凝练的现代汉语表达。
- source_word: וּמְשַׁלֵּחַ
  choice: 以及……散布……的人
  rationale: 该分词字面含义是“发出、放出”；与“纷争”搭配时表示使冲突扩散。“散布”既保留动作的传播意味，也比机械地译为“发出纷争”更自然。
- source_word: מְדָנִים
  choice: 纷争
  rationale: 该词指争执、冲突或争竞；“纷争”用语庄重简洁，适合智慧文学语体。
- source_word: בֵּין אַחִים
  choice: 在弟兄之间
  rationale: 按原文保留阳性复数关系词及“在……之间”的结构；这里既可能指亲兄弟，也可能泛指关系密切的群体成员。
theological_decisions:
- issue: אַחִים所指的性别和关系范围
  choice: 弟兄
  alternative: 兄弟姐妹；同胞；群体成员
  rationale: 希伯来文为阳性复数，字面是“兄弟”。译文保留原文的性别形式和社会关系色彩，同时用脚注说明它在语境中可以有较广的群体含义，不把这种范围直接固定在正文中。
- issue: “发出纷争”的动作含义
  choice: 散布纷争
  alternative: 挑起纷争；发出纷争
  rationale: 原文动词保留“发送、放出”的动态意象，但在汉语中直译为“发出纷争”不够自然。“散布”表达使纷争在人群中扩展开来的动作，又不把意思收窄为仅仅开始一场争端。
translation_notes:
  register: 采用现代、庄重而易懂的智慧文学语体。以“吐出谎言”保存原文意象，以“散布纷争”兼顾原文字义和自然汉语；两个并列的“……的人”结构与本段所列举的人相衔接。
