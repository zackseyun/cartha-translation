  yaml_path: translation/ot/proverbs/006/025.yaml
  text: Do not desire her beauty in your heart[b][a], and do not let yourself be captured by her eyelashes.
translation:
  language: zh_hans
  text: '不要在心里贪恋她的美貌，

    也不要被她的眼睑迷住。[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “眼睑”原文也可指“眼睫”；这里描绘以眼目传情、诱惑人的姿态。
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּחְמֹד
  choice: 贪恋
  rationale: 该词表示强烈地渴求、贪求；在本节的情色诱惑语境中，“贪恋”既保留内在欲念和不当觊觎的意味，又比“垂涎”庄重自然。
- source_word: יָפְיָהּ
  choice: 她的美貌
  rationale: 直接对应“她的美丽/美貌”；“美貌”在现代汉语中自然地指女性外在容貌之美。
- source_word: בִּלְבָבֶךָ
  choice: 在心里
  rationale: 保留希伯来语以“心”指内在欲望、思想和意向的表达，同时符合现代汉语习惯。
- source_word: תִּקָּחֲךָ
  choice: 被……勾住
  rationale: 原义是“让她取走/捉住你”。结合媚眼的诱惑意象，“勾住”自然表达被吸引并受其控制，但不把含义收窄为单纯观看。
- source_word: בְּעַפְעַפֶּיהָ
  choice: 她的媚眼
  rationale: עַפְעַף字面指眼睑，也可在此构成以眼目传情诱惑的具体意象。汉语“媚眼”比“眼睑”更准确传达语境功能，并保留眼部诱惑的画面。
theological_decisions: []
translation_notes:
  register: 采用简洁、对称的智慧文学劝诫句式。“贪恋”庄重而通俗；“媚眼勾住”是现代标准汉语中的自然搭配，具体呈现诱惑的画面。主句不加原文没有的性别泛化或道德解释。
