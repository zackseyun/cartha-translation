  text: בְּ/הִתְהַלֶּכְ/ךָ֨ תַּנְחֶ֬ה אֹתָ֗/ךְ בְּֽ֭/שָׁכְבְּ/ךָ תִּשְׁמֹ֣ר עָלֶ֑י/ךָ וַ֝/הֲקִיצ֗וֹתָ הִ֣יא תְשִׂיחֶֽ/ךָ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/006/022.yaml
  text: When you walk[a], it will guide you; when you lie down, it will watch over you; and when you awake, it will speak with you.
translation:
  language: zh_hans
  text: 你行走时，它必引导你；你躺下时，它必看顾你；你醒来时，它必与你交谈。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“她必与你交谈。”希伯来语用阴性代词，回指紧接上文的“诫命／教导”，也与《箴言》中把智慧人格化为女性的表达相呼应。
    reason: 保留阴性代词及人格化表达的翻译选择。
lexical_decisions:
- source_word: בְּהִתְהַלֶּכְךָ
  choice: 你行走时
  rationale: 介词 בְּ 加 הלך 的 Hitpael 不定词及第二人称阳性单数词尾，在此表示时间。该词也可指日常行事为人，但与“躺下”“醒来”并列时，“行走时”既保留具体意象，也涵盖生活行动。
- source_word: תַּנְחֶה אֹתָךְ
  choice: 它必引导你
  rationale: נחה 的 Hiphil 形式表示带领、引导；“引导”自然体现诫命和教导为人的道路指明方向。
- source_word: בְּשָׁכְבְּךָ
  choice: 你躺下时
  rationale: 介词 בְּ 加 שכב 的不定词及第二人称词尾表示“在你躺下时”。译作“躺下”比“睡觉”更贴近原词，并与全节的日常活动序列相称。
- source_word: תִּשְׁמֹר עָלֶיךָ
  choice: 它必看顾你
  rationale: שׁמר 与 עַל 连用表达守护、照看之意；“看顾”保留保护意味，语言庄重而通顺。
- source_word: וַהֲקִיצוֹתָ
  choice: 你醒来时
  rationale: 该形式源自 קיץ／יקץ，意为醒来；在并列结构中具有时间意义。“醒来时”是自然的现代汉语表达。
- source_word: הִיא
  choice: 它
  rationale: 阴性单数代词回指上文阴性名词“诫命／教导”。汉语通常以“它”指抽象事物；原文的阴性形式及可能的人格化意味在脚注中说明。
- source_word: תְשִׂיחֶךָ
  choice: 必与你交谈
  rationale: שׂיח 可表示说话、交谈、默想。这里以阴性主语配第二人称宾语，语境强调教导持续相伴并向人说话；“与你交谈”比单向的“教导你”更能保留互动意味。
theological_decisions:
- issue: 阴性主语所体现的诫命／教导人格化
  choice: 正文以“它”回指上文的诫命或教导，并用“交谈”保留人格化动作
  alternative: 译为“她必与你交谈”，更明确呈现女性人格化形象
  rationale: 希伯来语 הִיא 为阴性，首先是与其阴性先行词在语法上呼应，同时也可能与《箴言》中智慧的女性人格化相映。现代汉语对抽象教导通常称“它”；脚注保留“她”的可能译法，以免消除原文张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。三个“……时”保持原文从行走、躺下到醒来的平行节奏；三个“必”呈现未完成体在智慧教导语境中的持续或预期作用。正文中的脚注标记置于相关人格化表述之后。
