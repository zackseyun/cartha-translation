  text: כִּ֤י נֵ֣ר מִ֭צְוָה וְ/ת֣וֹרָה א֑וֹר וְ/דֶ֥רֶךְ חַ֝יִּ֗ים תּוֹכְח֥וֹת מוּסָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/006/023.yaml
  text: For the commandment is a lamp[a], and the instruction is light[b], and the reproofs of discipline are the way of life.
translation:
  language: zh_hans
  text: 因为诫命是灯，教导是光，管教的责备是生命之道。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文并说明劝勉的理由；现代汉语用“因为”自然表达这一解释关系。
- source_word: נֵר
  choice: 灯
  rationale: 指具体的灯，与下句抽象的“光”形成平行而有区别的意象。
- source_word: מִצְוָה
  choice: 诫命
  rationale: 保留权威命令及约束力，也符合本段父母训诲的语境。
- source_word: תּוֹרָה
  choice: 教导
  rationale: 在《箴言》的智慧和家庭训诲语境中，通常指具有规范性的教诲，不必特指摩西律法。
- source_word: אוֹר
  choice: 光
  rationale: 直接保留照明和引导的比喻，并与“灯”构成工整平行。
- source_word: דֶרֶךְ חַיִּים
  choice: 生命之道
  rationale: 既可指通往生命的道路，也可指体现生命的生活道路；此译保留原文可能具有的双重意味。
- source_word: תּוֹכְחוֹת מוּסָר
  choice: 管教的责备
  rationale: “责备”体现言语纠正，“管教”体现塑造和训练；属格结构保留二者关系，而不将其简化为单一概念。
theological_decisions:
- issue: תּוֹרָה 在智慧文学中的含义
  choice: 教导
  alternative: 律法
  rationale: 上下文是父母对儿子的权威训诲；译作“教导”避免无根据地将其限定为摩西律法，同时不削弱其规范性。
- issue: דֶרֶךְ חַיִּים 的方向或性质
  choice: 生命之道
  alternative: 通往生命的道路
  rationale: 希伯来语可表达通向生命之路，也可表达属于生命、体现生命的道路；“生命之道”不强行排除其中任何一面。
translation_notes:
  register: 采用现代、庄重、简明的智慧文学语体；三分句结构紧凑，保留“灯—光—道”的比喻推进和原文的平行关系。
