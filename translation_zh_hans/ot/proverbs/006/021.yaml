  yaml_path: translation/ot/proverbs/006/021.yaml
  text: Bind them on your heart continually[b][a]; tie them around your neck.
translation:
  language: zh_hans
  text: 要时刻把它们系在心上[a]，挂在你的颈项上[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “时刻”或译“常常”。
    reason: lexical_alternative
  - marker: b
    text: “挂在”或译“系在”或“佩戴”。
    reason: lexical_alternative
lexical_decisions:
- source_word: קָשְׁרֵם
  choice: 把它们……系在
  rationale: 该词是קשר的Qal命令式，带第三人称阳性复数宾语后缀，表达把前文所指的训诲牢牢系住；“系在”保留了具体的捆系意象。
- source_word: לִבְּךָ
  choice: 心上
  rationale: לֵב在此指人的内在思想、意志与情感；“心”既保留希伯来语的人体意象，也符合现代汉语表达。
- source_word: תָמִיד
  choice: 时刻
  rationale: 该副词表示持续、经常不间断的状态；“时刻”简洁自然，突出了恒常谨守。
- source_word: עָנְדֵם
  choice: 佩戴
  rationale: ענד表示把饰物系上或戴上；结合后面的“颈项”，“佩戴”自然呈现将训诲如饰物戴在身上的比喻，同时避免与前一句机械重复。
- source_word: גַּרְגְּרֹתֶךָ
  choice: 颈项
  rationale: 该词可指喉颈部位；在佩戴饰物的语境中指颈部。“颈项”庄重清楚，并保留身体意象。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“系在心上”保留具体隐喻，“佩戴在颈项上”呈现如饰物般随身持守训诲的平行意象；两个脚注标记均置于对应词语之后。
