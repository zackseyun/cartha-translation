  text: כֵּ֗ן הַ֭/בָּא אֶל אֵ֣שֶׁת רֵעֵ֑/הוּ לֹ֥א יִ֝נָּקֶ֗ה כָּֽל הַ/נֹּגֵ֥עַ בָּֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/006/029.yaml
  text: So is the one who goes in to his neighbor’s wife[b][a]; everyone who touches her will not go unpunished.
translation:
  language: zh_hans
  text: 与邻舍之妻苟合的人也是如此；凡触碰她[b]的人，必不免受惩罚[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“必不被判为无罪”或“必不算为无罪”。
    reason: lexical_alternative
  - marker: b
    text: 这里的“触碰她”很可能指不正当的性接触，而不只是偶然的身体接触。
    reason: cultural_note
lexical_decisions:
- source_word: כֵּן
  choice: 也是这样
  rationale: 承接上一节的比喻并作出对应结论；现代汉语中自然，也保留经文间的紧密联系。
- source_word: הַבָּא אֶל
  choice: 亲近……的人
  rationale: בוא אל 在此奸淫语境中不只是空间上的“来到”，而含有接近并发生不正当关系的意味；“亲近”保持含蓄，又比直译“进去到”更符合现代汉语。
- source_word: אֵשֶׁת רֵעֵהוּ
  choice: 邻舍之妻
  rationale: 保留 רֵעַ 的关系性和伦理色彩；“邻舍”是庄重而易懂的圣经语汇，“之妻”使整句简洁凝练。
- source_word: לֹא יִנָּקֶה
  choice: 不能免受惩罚
  rationale: נקה 的尼法勒式在此可指不获免罪或不能逃脱刑罚；正文采用自然且符合语境的结果性表达，并以脚注保留司法性的另一种理解。
- source_word: כָּל הַנֹּגֵעַ בָּהּ
  choice: 凡触碰她的
  rationale: כָּל 与分词连用表示普遍范围，译作“凡……的”；נגע 直义为“触碰”，正文保留原文含蓄而宽泛的措辞，不直接释为性交。
theological_decisions:
- issue: “触碰”所指行为的范围
  choice: 正文保留“触碰她”这一含蓄表达
  alternative: 直接译作“与她发生不正当性关系”
  rationale: 原文使用较宽泛的 נגע，语境很可能指不正当的性接触，但不宜在正文中把隐喻完全解释化；脚注说明其语境含义。
- issue: לֹא יִנָּקֶה 的司法与惩罚含义
  choice: 正文译为“不能免受惩罚”
  alternative: “必不被判为无罪”或“必不算为无罪”
  rationale: 该动词可兼具不能逃脱惩罚与不获宣告无罪的意味；正文采用现代汉语较自然的表达，脚注保存词义张力。
translation_notes:
  register: 采用现代、庄重而易懂的箴言体。以分号呈现前后两小句的解释关系；正文保留原文对性行为的含蓄说法，并用脚注交代词义与语境。
