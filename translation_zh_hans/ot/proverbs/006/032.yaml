  yaml_path: translation/ot/proverbs/006/032.yaml
  text: He who commits adultery with a woman lacks sense[a]; he who does it destroys himself.
translation:
  language: zh_hans
  text: 与妇人通奸的人，缺乏判断力[a]；行这事的，毁灭自己。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “妇人”也可译作“妻子”；“缺乏判断力”原文直译为“缺少心”，也可译作“缺乏悟性”。
    reason: 保留אִשָּׁה的“女人／妻子”歧义，并说明חֲסַר לֵב这一希伯来语智慧文学惯用语。
lexical_decisions:
- source_word: נֹאֵף
  choice: 通奸
  rationale: 该分词指实施奸淫行为的人；“通奸”在现代汉语中自然、明确，也保留了行为本身的道德与法律性质。
- source_word: אִשָּׁה
  choice: 与妇人
  rationale: אִשָּׁה既可指“女人”，也可指“妻子”。正文采用较宽泛的“妇人”，而“通奸”本身已表明这是违背婚姻关系的性行为；另一可能译法收入脚注。
- source_word: חֲסַר לֵב
  choice: 缺乏判断力
  rationale: 原文直译为“缺少心”。在《箴言》的智慧语境中，“心”涉及理解、判断和明辨，并非主要指情感；“缺乏判断力”以现代汉语传达这一含义。
- source_word: מַשְׁחִית
  choice: 毁灭
  rationale: 使役词形表示使之败坏、毁掉；“毁灭”保留了原文严厉而简洁的力度。
- source_word: נַפְשׁוֹ
  choice: 自己
  rationale: נֶפֶשׁ在这里指当事人自身或其生命，不宜限定为与身体分离的“灵魂”；“自己”也自然呈现原句的反身意义。
- source_word: הוּא יַעֲשֶׂנָּה
  choice: 行这事的人
  rationale: 阴性宾语后缀回指通奸这件事，独立代词הוּא带有强调意味；译文用“行这事的人，是在……”保留这种强调并符合现代汉语表达。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的箴言体。以“判断力”表达“心”在希伯来智慧传统中的认知和道德判断功能；后半句保留原文对行为者的强调与严重后果。
