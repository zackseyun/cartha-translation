base_translation:
  language: en
  yaml_path: translation/ot/proverbs/006/024.yaml
  text: to keep you from the evil woman[b][a], from the smooth tongue of the foreign woman.
translation:
  language: zh_hans
  text: 为要保护你，远离邪恶的女人，远离外族女子[b]油滑的舌头[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“奉承的话”；直译“油滑的舌头”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“陌生女子”；有人更具体地理解为“淫妇”。
    reason: alternative_reading
lexical_decisions:
- source_word: לִשְׁמָרְךָ
  choice: 为要保护你
  rationale: 该词是带介词ל的动词不定式，与上一节衔接，表达目的或结果。“保护你”自然地传达שׁמר在此处使人免受危险的含义。
- source_word: מֵאֵשֶׁת רָע
  choice: 远离邪恶的女人
  rationale: אֵשֶׁת可指“女人”或“妻子”；此处用“女人”避免无根据地限定其婚姻身份。רָע作性质描述，译为“邪恶”，保留原文强烈的道德判断。
- source_word: מֵחֶלְקַת לָשׁוֹן
  choice: 远离……油滑的舌头
  rationale: חֶלְקַת含平滑、滑溜之意，与“舌头”连用，指诱惑性或谄媚的话语。“油滑的舌头”既保留身体意象，也符合现代汉语表达；“奉承的话”列作较解释性的备选。
- source_word: נָכְרִיָּה
  choice: 外族女子
  rationale: 该词的核心意义是外来的、异族的女子。在箴言中可能兼有道德或婚约层面的危险意味，但正文不把它直接收窄为“淫妇”。“外族女子”比“陌生女子”更准确地表达词汇本义，也较自然。
theological_decisions:
- issue: 智慧文学中נָכְרִיָּה的解释
  choice: 正文按核心词义译为“外族女子”
  alternative: 陌生女子；淫妇
  rationale: 该词本义为外来的或异族的女子；上下文确有不正当诱惑的意味，但单凭此词不足以把身份明确限定为“淫妇”。因此正文保留词义与语境之间的张力，并在脚注列出其他理解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。句首“为要”明确承接上一节的目的关系；保留“舌头”的希伯来语意象，同时用“油滑”表达诱惑、谄媚和不可靠的言语。脚注标记均置于正文相关词语之后。
