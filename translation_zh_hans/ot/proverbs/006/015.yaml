id: PRO.6.15
reference: Proverbs 6:15
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: עַל כֵּ֗ן פִּ֭תְאֹם יָב֣וֹא אֵיד֑/וֹ פֶּ֥תַע יִ֝שָּׁבֵ֗ר וְ/אֵ֣ין מַרְפֵּֽא־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/006/015.yaml
  text: Therefore his disaster will come suddenly[a]; in an instant he will be broken[b], and there will be no healing.
translation:
  language: zh_hans
  text: 所以，灾祸必突然临到他[a]；顷刻间，他必被摧毁，且无可医治[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “灾祸”也可译作“灾难”或“毁灭”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“无法挽救。”
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: 所以
  rationale: 承接上文对恶人的描述，明确表达由此而来的后果；“所以”自然、清楚，并保留推论关系。
- source_word: פִּתְאֹם
  choice: 突然
  rationale: 直接表达事情出乎意料、骤然发生，符合原词所强调的突发性。
- source_word: יָבֹוא אֵידוֹ
  choice: 灾祸必临到他
  rationale: אֵידוֹ直译为“他的灾祸”，此处汉语用“灾祸临到他”更自然，同时保留灾难或毁灭性厄运的宽泛含义。
- source_word: פֶּתַע
  choice: 顷刻间
  rationale: 与前面的“突然”近义而不完全重复；“顷刻间”保留诗句对迅疾性的递进强调。
- source_word: יִשָּׁבֵר
  choice: 他必被摧毁
  rationale: 该词是שׁבר的尼法勒式，表达“被打破、破碎、毁坏”的被动结果；“被摧毁”在现代汉语中适用于人的彻底败亡，同时保留意象的力度。
- source_word: וְאֵין מַרְפֵּא
  choice: 且无可医治
  rationale: מַרְפֵּא可指医治、疗救或补救；“无可医治”保留原文的医疗隐喻，并表达这种毁灭无法逆转。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而简洁的箴言体。以“突然／顷刻间”呈现两个近义副词的诗性强化；“被摧毁／无可医治”保留从破碎转向医治的原文意象张力。
