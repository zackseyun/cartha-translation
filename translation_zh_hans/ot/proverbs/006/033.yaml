  text: He will find injury and disgrace[b][a], and his reproach will not be wiped away.
translation:
  language: zh_hans
  text: 他必遭受伤害和羞辱[a]；他的耻辱不会被抹去[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“创伤和耻辱。”希伯来语也可较具体地指身体所受的伤害和公开蒙受的羞耻。
    reason: lexical_alternative
  - marker: b
    text: 或译：“他的羞耻不会被擦去。”
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶגַע
  choice: 创伤
  rationale: 该词可指击打、伤口或伤害；结合奸淫所招致的后果，“创伤”既保留具体的身体伤害意味，也不排除更广泛的损害。
- source_word: קָלוֹן
  choice: 羞辱
  rationale: 该词指公开蒙受的羞耻和不光彩；“羞辱”在现代汉语中自然地表达其社会性和道德性。
- source_word: יִמְצָא
  choice: 必遭受
  rationale: מצא字面为“找到”，但此处是后果临到人的惯用表达；译作“遭受”符合现代汉语，同时保留被这些后果所及的意思。
- source_word: חֶרְפָּתוֹ
  choice: 他的耻辱
  rationale: חֶרְפָּה可指责辱、嘲弄及在人前持久的羞耻；“耻辱”兼顾公开性和持续性，并以“他的”保留希伯来文所属关系。
- source_word: לֹא תִמָּחֶה
  choice: 永远无法抹去
  rationale: מחה的被动式表示被擦掉、涂抹或消除；“无法抹去”保留原文鲜明意象。“永远”在汉语中自然体现未完成式在此语境所表达的持续、不可消除之意。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的箴言体。前半句以“遭受”自然传达希伯来语“找到”在此处表示后果临到的用法；后半句保留“抹去”的原文意象。标点体现两分句的递进关系。
