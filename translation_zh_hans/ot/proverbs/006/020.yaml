  text: נְצֹ֣ר בְּ֭נִ/י מִצְוַ֣ת אָבִ֑י/ךָ וְ/אַל תִּ֝טֹּ֗שׁ תּוֹרַ֥ת אִמֶּֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/006/020.yaml
  text: Keep[a], my son, your father's commandment, and do not forsake your mother's instruction.
translation:
  language: zh_hans
  text: 我儿，要谨守你父亲的诫命，不可离弃你母亲的教导。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我儿，要守护你父亲的命令，不可抛弃你母亲的训诲。”
    reason: 词义有可保留的替代表达：נצר 可强调“守护”，מִצְוָה 可译“命令”，נטש 可译“抛弃”，תּוֹרָה 可译“训诲”。
lexical_decisions:
- source_word: נְצֹר
  choice: 谨守
  rationale: 该命令式有守护、持守并遵行之意；“谨守”既保留小心守护的意味，也自然适用于父母的训命。
- source_word: בְּנִי
  choice: 我儿
  rationale: 希伯来文明确为阳性单数，并带第一人称单数后缀；“我儿”保留原文形式及箴言中父辈训诲的语境。
- source_word: מִצְוַת
  choice: 诫命
  rationale: מִצְוָה 指命令或诫命；“诫命”保留其郑重和规范性，同时与智慧文学的语体相称。
- source_word: אָבִיךָ
  choice: 你父亲的
  rationale: 自然表达希伯来文构词结构及第二人称阳性单数所属关系。
- source_word: תִּטֹּשׁ
  choice: 不可离弃
  rationale: נטש 表示离开、抛弃；“离弃”保留原文严肃的道德分量，并与“谨守”形成鲜明对照。
- source_word: תּוֹרַת
  choice: 教导
  rationale: תּוֹרָה 在父母智慧训诲的语境中主要指塑造人的教诲，而非成文法典；“教导”自然清楚，也保留与父亲诫命之间的平行关系。
- source_word: אִמֶּךָ
  choice: 你母亲的
  rationale: 自然表达希伯来文构词结构及第二人称阳性单数所属关系。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“我儿”保留原文男性单数称呼；“谨守／离弃”再现希伯来诗句的正反平行。“教导”避免把此处家庭智慧语境中的 תּוֹרָה 误限为成文律法。
