revisions:
- from: 人不会藐视一个贼，因为他是在饥饿时偷东西填饱自己[a][b]。
  to: 人不轻看小偷；若他因饥饿[b]偷窃，为要填饱肚子[a]。
  rationale: 修订以“若……偷窃”保留第一个 כִּי 的条件性，以“因饥饿”呈现末句的动机性理解，并在脚注保留其时间性理解。“填饱肚子”是对饥饿语境中“填满他的 נפesh”的自然中文表达，脚注则保存该词的语义弹性。
