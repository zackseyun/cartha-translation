  source_fidelity: 草稿基本传达了“不藐视窃贼”和饥饿驱动的偷窃，但把两个 כִּי 都固定为“因为／在……时”的串联因果，弱化了前一个 כִּי 可表条件（“若/如果”）的句法关系。
  naturalness: “填饱自己”在现代汉语中不自然；通常说“填饱肚子”或“满足食欲”。“一个贼”虽可懂，但“小偷”更合乎现代汉语泛指用法。
  terminology: “轻看”准确对应 בוז 的社会性轻蔑，且比“藐视”更自然。以“填饱肚子”表达饥饿语境中的 נַפְשׁוֹ 是安全的语境化翻译；脚注保留“自己／生命”的字面语义范围。
