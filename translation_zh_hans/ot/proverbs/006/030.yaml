  text: לֹא יָב֣וּזוּ לַ֭/גַּנָּב כִּ֣י יִגְנ֑וֹב לְ/מַלֵּ֥א נַ֝פְשׁ֗/וֹ כִּ֣י יִרְעָֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/006/030.yaml
  text: People do not despise a thief if he steals to satisfy himself when he is hungry[a][b].
translation:
  language: zh_hans
  text: 人不轻看小偷；若他因饥饿[b]偷窃，为要填饱肚子[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“满足自己的食欲”。原文直译为“填满他自己”；“自己”也可指生命或食欲。
    reason: lexical_alternative
  - marker: b
    text: 或译：“在他饥饿时”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יָב֣וּזוּ
  choice: 藐视
  rationale: בוז表示轻蔑、看不起；“藐视”既准确又符合庄重的现代汉语表达。
- source_word: לַגַּנָּב
  choice: 一个贼
  rationale: 希伯来语虽有定冠词，但这里是箴言中的泛指个案；汉语用“一个贼”自然传达代表性含义。
- source_word: כִּי יִגְנ֑וֹב
  choice: 因为他……偷东西
  rationale: כִּי可引出行为发生的情境或原因。结合全句，译作“因为他是在……时偷东西”能自然说明人不藐视他的缘由，同时保留其情境性。
- source_word: לְמַלֵּ֥א נַפְשׁוֹ
  choice: 填饱自己
  rationale: 原文直译为“使他的נפש饱足”。在饥饿语境中，“填饱自己”自然表达满足身体需要，又未把נפש限定为抽象的“灵魂”。
- source_word: נַפְשׁוֹ
  choice: 自己
  rationale: נפש可指自己、生命或食欲；此处“自己”保留其宽泛性，脚注补出“食欲”的可能译法。
- source_word: כִּי יִרְעָֽב
  choice: 在饥饿时
  rationale: 末句说明偷窃发生的处境；“在饥饿时”保留时间或情境意义，而“因为饥饿”的因果理解列入脚注。
theological_decisions:
- issue: 经文是否认可因饥饿而偷窃
  choice: 按原文陈述社会对饥饿窃贼的态度，不增添道德许可的措辞
  alternative: 译成“人不会责怪”或明确说这种偷窃情有可原
  rationale: בוז是“藐视”，并非宣告无罪；上下文下一节仍说窃贼被抓后必须偿还，因此不应把本节扩译成道德上的认可。
translation_notes:
  register: 采用现代、庄重而通俗的箴言体。“贼”比“盗贼”更贴近日常现代汉语；“填饱自己”呼应饥饿语境。正文中的[a][b]均与脚注对应。
