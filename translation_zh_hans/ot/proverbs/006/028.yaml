  text: Can a man walk on coals and his feet not be scorched?[a]
translation:
  language: zh_hans
  text: 人岂能在火炭上行走，双脚却不被烧伤？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“人若在火炭上行走，双脚岂会不被烧伤？”希伯来文以“如果”开头，但这里与上一节平行，构成反问。
    reason: 保留אִם的常见条件义及原文句式的另一种理解。
lexical_decisions:
- source_word: אִם
  choice: 岂能
  rationale: אִם通常意为“如果”，但本节与上一节并列构成反问；译作“岂能”自然传达其反问语气，同时在脚注保留条件句形式。
- source_word: יְהַלֵּךְ
  choice: 行走
  rationale: 此处הלך表示走动；“行走”准确、自然，也符合箴言庄重简洁的文体。
- source_word: אִישׁ
  choice: 人
  rationale: 希伯来文为阳性单数，但此处在智慧文学中泛指一个人；现代汉语用“人”既保留单数泛指意义，也不额外引入性别限定。
- source_word: עַל הַגֶּחָלִים
  choice: 在火炭上
  rationale: עַל表示脚与炭接触；גֶּחָלִים指灼热的炭或余烬。“火炭”简洁地表达其正在燃热的性质。
- source_word: וְרַגְלָיו
  choice: 双脚却
  rationale: 原文直译为“而他的脚”；汉语以“双脚”自然表达复数，加入“却”明确反问中违背常理的结果关系。
- source_word: לֹא תִכָּוֶינָה
  choice: 不被烫伤
  rationale: כוה的尼法勒词形表示被烧伤或灼伤；对脚接触火炭的场景而言，“被烫伤”是准确自然的现代汉语表达，且不过度强化伤势。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“岂能……却不……”保留箴言的凝练反问语气；“火炭”比单说“炭”更清楚地表明炭是灼热的。
