  language: zh_hans
  text: 他用眼睛递暗号，用脚示意[a]，用手指指点[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“用脚摩擦／拖动”，也可泛指“用脚打暗号”。希伯来语动词 מֹלֵל 很少见，确切动作不能确定，但上下文清楚表明这是一种隐秘的身体信号。
    reason: lexical_alternative
  - marker: b
    text: 或译“用手指指示／引导”。该词也可表示“教导”，但这里所列的是身体动作。
    reason: lexical_alternative
lexical_decisions:
- source_word: קֹרֵץ בְּעֵינָיו
  choice: 用眼睛递暗号
  rationale: קֹרֵץ表示以眼部动作暗中传意；译作“递暗号”既保留隐秘示意的含义，也不把具体动作过度限定为单眼眨动。
- source_word: מֹלֵל בְּרַגְלוֹ
  choice: 用脚示意
  rationale: מֹלֵל罕见，具体动作不确定；上下文列举身体动作，故采用较宽泛的“示意”，并按希伯来语单数保留“脚”。
- source_word: מֹרֶה בְּאֶצְבְּעֹתָיו
  choice: 用手指指点
  rationale: מֹרֶה可表示指示、引导或教导；与“手指”连用且处于身体信号的并列结构中，“指点”最自然，同时保留一定语义宽度。
