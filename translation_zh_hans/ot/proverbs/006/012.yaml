base_translation:
  language: en
  yaml_path: translation/ot/proverbs/006/012.yaml
  text: A worthless man[a], a man of wickedness, walks with a perverse mouth.
translation:
  language: zh_hans
  text: 无赖之徒，邪恶之人，行事时口出乖谬之言[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “口出乖谬之言”直译为“以乖谬的口行走”；也可译作“说话乖谬”或“用弯曲的口说话”。
    reason: 保留 עִקְּשׁוּת פֶּה 的“乖谬／弯曲”词义幅度，以及“口”这一具体意象；同时说明希伯来语“行走”可表达惯常的行事方式。
lexical_decisions:
- source_word: אָדָם
  choice: 人（体现在“无赖之徒”中）
  rationale: 这里指智慧文学中作为反面典型的单个人，并非泛指全人类；与后面的 אִישׁ 构成同义平行。
- source_word: בְּלִיַּעַל
  choice: 无赖
  rationale: 此处形容一个卑劣、毫无善用的人，并非后期人格化的专名“彼列”；“无赖之徒”在现代汉语中自然地表达其道德贬义。
- source_word: אִישׁ
  choice: 人
  rationale: 保留单数人物的指称，并与前半句形成平行。
- source_word: אָוֶן
  choice: 邪恶
  rationale: 本节着重刻画道德败坏，而非单指灾祸或麻烦；“邪恶之人”准确而自然。
- source_word: הוֹלֵךְ
  choice: 走到哪里都
  rationale: 该分词可表示行走、来往，也可延伸指一贯的行为方式；此译既保留行走意象，又自然连接其惯常的邪僻言语。
- source_word: עִקְּשׁוּת
  choice: 歪话
  rationale: 该词表示弯曲、乖僻或悖谬；结合“口”，指歪曲乖谬的言语。“歪话”简明地保留其形象和道德色彩。
- source_word: פֶּה
  choice: 满口
  rationale: 希伯来文直说“口”；汉语“满口歪话”保留口的具体意象，同时明确这里所指的是言语。
theological_decisions: []
translation_notes:
  register: 采用现代、凝练而庄重的箴言体。“无赖之徒，邪恶之人”保留原文的同义平行；“走到哪里都满口歪话”使希伯来语的行走表达和“口中弯曲”在现代汉语中自然连贯。
