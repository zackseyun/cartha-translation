base_translation:
  language: en
  yaml_path: translation/ot/proverbs/006/034.yaml
  text: For jealousy is a man's fury, and he will show no mercy on the day of vengeance.
translation:
  language: zh_hans
  text: 因为嫉妒是男人的烈怒；在报仇之日，他绝不留情。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קִנְאָה
  choice: 嫉妒
  rationale: 在奸淫及受辱男子的语境中，指因伴侣不忠而产生的嫉妒，直译为“嫉妒”准确自然。
- source_word: חֲמַת גָּבֶר
  choice: 使男人满腔烈怒
  rationale: 希伯来语名词结构直义近于“男人的烈怒”；汉语若译作“嫉妒是男人的烈怒”较生硬，因此用使动表达传达嫉妒引发强烈怒火之意。גָּבֶר 本义为“男人”，上下文虽可能具体指受害的丈夫，正文保留较宽泛的“男人”。
- source_word: יַחְמוֹל
  choice: 留情
  rationale: 该动词表示怜惜、宽免；否定形式在报仇语境中译为“绝不留情”简洁有力。
- source_word: בְּיוֹם נָקָם
  choice: 到了报仇之日
  rationale: 保留“日子”的时间表达和 נָקָם 的报复、复仇含义，不将其扩大解释为制度性的审判。
theological_decisions:
- issue: “报仇”是描述还是认可
  choice: 按原文保留受辱男子报仇且不留情的陈述
  alternative: 改译为带道德裁断色彩的“施行公义审判”
  rationale: 本节属于对奸淫后果的智慧警告，描述嫉妒与报复的现实，并未明确把男子的行动界定为神圣审判；译文不额外赋予道德认可。
translation_notes:
  register: 采用现代、庄重而易懂的汉语。“满腔烈怒”既保留原文怒气的强度，也避免僵硬的名词判断句；分号呈现两分句之间由怒而报仇的推进关系。
