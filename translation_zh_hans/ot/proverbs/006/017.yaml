  text: 高傲的眼睛，撒谎的舌头，流无辜人之血的手，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֵינַיִם רָמוֹת
  choice: 高傲的眼
  rationale: 保留“眼”的身体部位意象及全句的排比；“高傲”表达 רָמוֹת 在此所指的骄傲自大，而非物理高度。
- source_word: לְשׁוֹן שָׁקֶר
  choice: 撒谎的舌
  rationale: 保留“舌”的希伯来语转喻，以身体部位指说话；“撒谎的”自然表达主动说假话的含义。
- source_word: יָדַיִם
  choice: 手
  rationale: 保留身体部位意象，与“眼”“舌”构成诗性排比；现代汉语中集合性的“手”无需机械体现希伯来语双数形式。
- source_word: שֹׁפְכוֹת דָּם נָקִי
  choice: 流无辜人之血的
  rationale: שֹׁפְכוֹת 是分词，描写这种手所具有的行为特征；“流……之血”保留原文的流血意象，נָקִי 表明受害者在相关事情上无罪。
