translation_notes:
  register: 采用现代、庄重而易懂的训诲语体。“作保”准确传达财务担保含义；“击掌立约”保留希伯来语的具体动作，并由脚注说明其文化背景。原文条件句尚未结束，故本节末用逗号承接下文。
