  yaml_path: translation/ot/proverbs/006/001.yaml
  text: My son[a], if you have gone surety for your neighbor, if you have struck your hands in pledge to a stranger[b],
translation:
  language: zh_hans
  text: 我儿，你若为邻舍作保，向陌生人以击掌作出承诺[a]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“向陌生人击掌”；这是以击掌确认承诺或担保的做法。
    reason: cultural_note
lexical_decisions:
- source_word: בְּנִי
  choice: 我儿
  rationale: 保留父亲或智慧导师对男性晚辈的单数呼语；“我儿”简洁、庄重，也符合《箴言》的训诲语体。
- source_word: אִם
  choice: 若
  rationale: 原文引出条件从句；本节句意延续至后文，因此用“若”并以逗号收束。
- source_word: עָרַבְתָּ
  choice: 作保
  rationale: 该动词在此指为别人的债务或义务承担担保责任；“作保”是现代汉语中自然且准确的法律、财务用语。
- source_word: לְרֵעֶךָ
  choice: 为邻舍
  rationale: רֵעַ可指朋友、同伴或邻舍；“邻舍”保留其较宽泛的人际含义，不限定为亲密朋友。
- source_word: תָּקַעְתָּ ... כַּפֶּיךָ
  choice: 击掌立约
  rationale: 直译为“击（你的）掌”，指以击掌或握手确认承诺的古代动作；“击掌立约”保留具体意象，并自然表达其立约含义。
- source_word: לַזָּר
  choice: 向陌生人
  rationale: זָר指陌生人或外人；“向陌生人”贴近原文介词结构，同时保留此人身份与前述“邻舍”之间可能存在的张力。
