  text: אֲשֶׁ֖ר אֵֽין לָ֥/הּ קָצִ֗ין שֹׁטֵ֥ר וּ/מֹשֵֽׁל־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/006/007.yaml
  text: which has no chief[a], officer, or ruler,
translation:
  language: zh_hans
  text: 它没有首领、官员和统治者[a]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作：“领袖、官长和掌权者”。
    reason: 这三个表示权威人物的希伯来词语义范围有所重叠，但侧重点分别在带领、行政监督和治理；备选译法保留这种词汇弹性。
lexical_decisions:
- source_word: אֲשֶׁר
  choice: 它
  rationale: 本节是承接上节“蚂蚁”的关系分句。现代汉语不宜机械译出关系代词，直接用“它”承接，清楚自然。
- source_word: אֵין לָהּ
  choice: 没有
  rationale: 希伯来语存在句配合介词ל及阴性单数后缀，表达“它没有……”；汉语用“没有”最自然，并保留对蚂蚁的指称。
- source_word: קָצִין
  choice: 首领
  rationale: 该词指居首位、带领他人的人物；“首领”简洁准确，也与后面的“统治者”保持区别。
- source_word: שֹׁטֵר
  choice: 官员
  rationale: 该词常指承担行政或监督职责的人。“官员”是宽泛而自然的现代汉语对应，不把具体职能限定为书记、督工或执法人员。
- source_word: וּמֹשֵׁל
  choice: 或统治者
  rationale: מֹשֵׁל指治理、掌权的人。在否定列举中，连接词ו译作“或”符合现代汉语习惯，表示上述任何一种权威人物都没有。
theological_decisions: []
translation_notes:
  register: 采用简洁、庄重的现代标准汉语，保留原文三个并列权威称谓及其细微区别。句末逗号表明本节在句法上承接下一节。
