  text: לֵֽךְ אֶל נְמָלָ֥ה עָצֵ֑ל רְאֵ֖ה דְרָכֶ֣י/הָ וַ/חֲכָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/006/006.yaml
  text: Go to the ant[a], you sluggard[b]; consider her ways and become wise.
translation:
  language: zh_hans
  text: 懒惰人哪，到蚂蚁那里去；察看它的行事方式，要有智慧。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֵךְ אֶל
  choice: 到……那里去
  rationale: 保留第二人称阳性单数命令的直接劝诫语气，也自然表达朝向蚂蚁而去的意思。
- source_word: נְמָלָה
  choice: 蚂蚁
  rationale: 此处以单数泛指蚂蚁这一类，作为智慧训诲中的观察对象；现代汉语无需添加冠词。
- source_word: עָצֵל
  choice: 懒惰人哪
  rationale: 作为呼格，直接责备懒惰者；“哪”清楚标示称呼，并保持箴言式的庄重语气。
- source_word: רְאֵה
  choice: 察看
  rationale: 原义为“看”，此处要求留心观察并从中学习；“察看”兼顾视觉动作和审慎考察的语境含义。
- source_word: דְרָכֶיהָ
  choice: 它的行径
  rationale: “道路”在智慧文学中可指行为方式或生活模式；“行径”在此较自然地表达蚂蚁一贯的行动方式。希伯来语阴性代词后缀与阴性名词“蚂蚁”一致，汉语用中性的“它”。
- source_word: וַחֲכָם
  choice: 要有智慧
  rationale: 保留命令语气和“成为／表现为有智慧”的含义，不把连接词擅自解释为明确的结果条件。
theological_decisions: []
translation_notes:
  register: 采用现代、简洁而庄重的智慧训诲语体。分号呈现两个连续命令之间的紧密关系；末句保留原文的命令性，不扩写为“就可得智慧”，以免把原文未明说的逻辑关系固定为结果句。
