  yaml_path: translation/ot/proverbs/006/014.yaml
  text: Perversity is in his heart[a]; he devises evil at all times; he sends out strife.
translation:
  language: zh_hans
  text: 他心中尽是乖谬，时刻图谋恶事，散布纷争。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“挑起纷争”。希伯来文直译“放出纷争”，是指引发或传播冲突。
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּהְפֻּכוֹת
  choice: 乖谬
  rationale: 该复数抽象名词指扭曲、悖逆的心性；“乖谬”保留其道德上的歪曲意味，也符合箴言的庄重语体。
- source_word: בְּלִבּוֹ
  choice: 他心中尽是
  rationale: 原文是无动词句，介词短语作表语；中文补出“尽是”，自然表达这种内在品性的持续状态。
- source_word: חֹרֵשׁ רָע
  choice: 图谋恶事
  rationale: חֹרֵשׁ本义与耕作有关，在此按智慧文学中的惯用义表示筹划、谋算；“图谋”体现蓄意策划的意味。
- source_word: בְּכָל עֵת
  choice: 时刻
  rationale: 该短语表示一贯、持续的行为；“时刻”简洁自然，并保留“在一切时候”的强度。
- source_word: מְדָנִים
  choice: 纷争
  rationale: 该复数名词泛指争执、冲突；“纷争”能概括反复发生或扩散的冲突。
- source_word: יְשַׁלֵּחַ
  choice: 散布
  rationale: 该词在此有发送、放出之意；与“纷争”搭配时，“散布”既保留向外传播的意象，也符合现代汉语表达。
