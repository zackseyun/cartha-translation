  yaml_path: translation/ot/proverbs/006/031.yaml
  text: Yet if he is found[a], he must repay sevenfold; he must give all the wealth of his house.
translation:
  language: zh_hans
  text: 但他若被发现，就必须偿还七倍[a]；他要交出家中所有的财物。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“七次”。希伯来语这一表达可指七倍的赔偿，也可指数额为七的偿还。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִמְצָא
  choice: 但他若被抓住
  rationale: וְ在上下文中表示转折；נִמְצָא是מצא的尼法勒式，指窃贼被发现或被抓获。用“若”自然表达此处隐含的条件关系。
- source_word: יְשַׁלֵּם
  choice: 就必须偿还
  rationale: שלם的皮勒式在此指赔偿、偿还；“必须”传达语境中的义务性，而非单纯将来时。
- source_word: שִׁבְעָתָיִם
  choice: 七倍
  rationale: 该数词作副词使用，表示按七倍赔偿；也可理解为偿还七次，故以脚注保留词义幅度。
- source_word: אֶת כָּל הוֹן בֵּיתוֹ
  choice: 家里全部的财物
  rationale: הוֹן指财富、资财或产业；这里指其家中所有可用于赔偿的财物。
- source_word: יִתֵּן
  choice: 即使交出
  rationale: נתן本义为“给出、交付”。结合“全部财物”及前句的赔偿义务，用“即使交出”自然表达为履行七倍赔偿而付尽家产的结果，同时不把后半句误解为另一项独立刑罚。
