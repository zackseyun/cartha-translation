base_translation:
  language: en
  yaml_path: translation/ot/proverbs/006/027.yaml
  text: Can a man carry fire in his bosom and his clothes not be burned?[a]
translation:
  language: zh_hans
  text: 人岂能把火揣在怀里，衣服却不被烧着呢？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “怀里”也可译作“膝上”或“胸前”；希伯来语指胸前或膝上贴身的位置，可能包括可用来兜东西的衣襟。
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחְתֶּה
  choice: 揣
  rationale: 该动词可指取起、扒拢火炭；在本句中，重点是把火取来并贴身带着。“揣”自然传达将其置于怀中的动作及随之而来的危险。
- source_word: אִישׁ
  choice: 人
  rationale: 希伯来语为阳性单数，在智慧格言中作泛指。现代汉语以“人”表达这种泛指，既准确又自然。
- source_word: אֵשׁ
  choice: 火
  rationale: 直接、自然地对应原词。
- source_word: בְּחֵיקוֹ
  choice: 在怀里
  rationale: חֵיק 指胸前或膝上可贴身放置东西的区域，也可涉及衣襟形成的兜处。“在怀里”保留了贴身携带的形象，且符合现代汉语习惯。
- source_word: וּבְגָדָיו
  choice: 衣服
  rationale: 自然对应复数名词 בְּגָדִים；“衣服”比“衣裳”或“衣袍”更通行，不额外限定服饰样式。
- source_word: לֹא תִשָּׂרַפְנָה
  choice: 不被烧着
  rationale: 原文为被动意义，指衣服遭火焚烧。“不被烧着”既保留语态，也适合汉语反问句。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而口语自然的反问句式。“揣在怀里”生动呈现贴身藏带火的危险；“却”突出行为与不受损后果之间不可能成立的张力。
