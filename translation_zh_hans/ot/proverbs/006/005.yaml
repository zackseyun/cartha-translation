  yaml_path: translation/ot/proverbs/006/005.yaml
  text: Rescue yourself like a gazelle from the hand[c][b][a], and like a bird from the hand of the fowler.
translation:
  language: zh_hans
  text: 你要自救[a]，如羚羊[b]从手中逃脱；又如鸟从捕鸟人的手中逃脱[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“救自己脱身”或“逃脱”。希伯来语尼法勒命令式带有急切地使自己脱身的意思。
    reason: lexical_alternative
  - marker: b
    text: “羚羊”也可译作“鹿”；传统译法有“母鹿”。
    reason: lexical_alternative
  - marker: c
    text: “捕鸟人”也可译作“设网捕捉者”或“捕猎者”。原文指设置陷阱捕捉的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנָּצֵל
  choice: 你要挣脱
  rationale: 这是 נצל 的尼法勒命令式第二人称阳性单数，在本处带有反身和急切劝告的意味，要求听者设法脱身。“你要挣脱”既保留命令语气，也比单说“逃跑”更能表现摆脱控制的含义。
- source_word: כִּצְבִי
  choice: 像羚羊
  rationale: צְבִי 通常指羚羊；前缀 כ 表示比较。“羚羊”既较准确，也保留迅速逃脱的狩猎图景。
- source_word: מִיָּד
  choice: 逃出……的手
  rationale: יָד 的字面义是“手”，也可指权势或掌控。这里处于捕猎意象中，保留“手”既呈现具体画面，也传达摆脱控制之意。
- source_word: וּכְצִפּוֹר
  choice: 又像飞鸟
  rationale: צִפּוֹר 是鸟类的通称，并不足以限定为麻雀。“飞鸟”在现代汉语中自然，并强化从捕捉中逃脱的动态画面，而不指定鸟种。
- source_word: מִיַּד יָקוּשׁ
  choice: 逃出捕鸟人的手
  rationale: יָקוּשׁ 指设下罗网捕捉者；在“鸟”的语境中译为“捕鸟人”最贴切。保留“……的手”也再现原文两行的平行结构。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。以“挣脱”表达急切脱身的命令，以“逃出……的手”保留希伯来语具体的狩猎意象和两行平行结构。首行“捕猎者”是依据下半句补明的隐含施事者，已用脚注标示，避免掩盖原文省略所留下的含混。
