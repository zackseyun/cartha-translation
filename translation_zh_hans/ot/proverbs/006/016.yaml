  text: שֶׁשׁ הֵ֭נָּה שָׂנֵ֣א יְהוָ֑ה וְ֝/שֶׁ֗בַע תועבות נַפְשֽׁ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/006/016.yaml
  text: 'There are six things that Yahweh hates[a], seven that are an abomination to him:'
translation:
  language: zh_hans
  text: 雅威所恨恶的有六样；有七样是他所憎恶的事[a]：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文的字面措辞可译为“七样是他心灵所憎恶的事”；“心灵”在这里惯用地指他自己。
    reason: 保留 נַפְשׁוֹ 的字面表达及其惯用含义，并呈现 תועבות“可憎之事”的名词性。
lexical_decisions:
- source_word: שֶׁשׁ הֵנָּה
  choice: 有六样
  rationale: 这是数字格言的起句；“有六样”既保留数目，也符合现代汉语表达。
- source_word: שָׂנֵא
  choice: 恨恶
  rationale: 该动词表示强烈的憎恨与排斥；“恨恶”保留原文力度，并适合庄重的智慧文学语体。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常用音译呈现四字神名，保留其专名性质，不用称号代替。
- source_word: וְשֶׁבַע
  choice: 有七样
  rationale: 保留希伯来数字格言“六……七……”的递进格式，不把它解释性改写为单一数字。
- source_word: תועבות
  choice: 所憎恶的
  rationale: 该复数名词指令人极度厌恶、可憎之物；结合 נַפְשׁוֹ 用关系结构表达，在现代汉语中自然且保持强烈语气。
- source_word: נַפְשׁוֹ
  choice: 他所
  rationale: נֶפֶשׁ 在这里以“本人、自身”的惯用意义指雅威自己；正文用“他所憎恶的”自然传意，字面表达另见脚注。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；采用“雅威”音译，以专名呈现，而非用“主”等称号替代。
- issue: “他生命所憎恶的”这一拟人化表达
  choice: 他所憎恶的
  alternative: 他心里所憎恶的／他生命所憎恶的
  rationale: נֶפֶשׁ 此处惯用地指本人。正文不据此引入特定的身心构成观，也不把它缩窄为情绪意义上的“心里”；脚注保留字面信息。
- issue: “六……七……”数字格言的关系
  choice: 保留“六样……七样”
  alternative: 解释为“七样”或“六样，甚至七样”
  rationale: 原文使用 x／x+1 的诗体数字格式。直保其张力，避免在正文中替读者判定它只是强调、递增或精确计数。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“六样……七样”保留智慧文学的数字递进和节奏；冒号承接下文清单。
