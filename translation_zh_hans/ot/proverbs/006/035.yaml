  text: He will accept no ransom[a] and will not be persuaded, no matter how large the bribe.
translation:
  language: zh_hans
  text: 他不接受任何赎金[a]；即使你不断增加贿赂，他也不会被说动。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“补偿金”。希伯来语直译为“不抬任何赎金的脸”，是指拒绝因收取钱财而通融或施恩的习语。
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא יִשָּׂא פְּנֵי
  choice: 不接受
  rationale: 希伯来语直译为“不抬……的脸”，在此是拒绝因付款而施恩或通融的习语；译作“不接受”自然地表达其语境功能。
- source_word: כָל כֹּפֶר
  choice: 任何赎金
  rationale: כֹּפֶר 指为免除后果而付出的赎价或补偿款；“赎金”保留其核心力度，“补偿金”作为脚注中的词义备选。
- source_word: לֹא יֹאבֶה
  choice: 不肯答应
  rationale: יֹאבֶה 表示意愿或同意，而非情绪上的满意；“不肯答应”保留其意志性，并符合拒绝金钱调解的语境。
- source_word: כִּי תַרְבֶּה שֹׁחַד
  choice: 无论你把贿赂加到多大
  rationale: 该分句具有让步意味，且“贿赂”为单数；此译法既体现数额增加，也保留第二人称所指。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。前后两个分句分别保留“拒收款项”与“不愿答应”的区别，避免把意志性动词误译为“并不满意”。
