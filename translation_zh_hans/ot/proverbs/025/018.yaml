  yaml_path: translation/ot/proverbs/025/018.yaml
  text: A club[a], a sword, and a sharp arrow is a man who bears false witness against his neighbor.
translation:
  language: zh_hans
  text: 大锤[a]、剑和利箭，就是作假见证指控邻舍的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “大锤”或译“战锤”。希伯来语מֵפִיץ指一种用于猛烈击打、砸碎的武器，具体形制不能完全确定。
    reason: 希伯来语מֵפִיץ的词义及具体武器形制存在不确定性；保留可行的词汇替代。
lexical_decisions:
- source_word: מֵפִיץ
  choice: 大锤
  rationale: 该词指用于击碎、砸毁的武器。“大锤”在现代汉语中清楚自然，也保留了强力击打的形象。
- source_word: חֶרֶב
  choice: 刀剑
  rationale: 这是该希伯来语常用词的标准汉语表达；“刀剑”既自然，也明确呈现致命武器的意象。
- source_word: חֵץ שָׁנוּן
  choice: 利箭
  rationale: שָׁנוּן意为锋利、磨尖；“利箭”简洁地保留了原文中锐利箭矢的具体形象。
- source_word: אִישׁ
  choice: 人
  rationale: 原文为阳性单数，但在箴言中泛指具有这种行为的人；汉语用“人”自然且不增添原文没有的性别强调。
- source_word: עֹנֶה
  choice: 作……见证
  rationale: 该分词本义为回答、回应，在见证语境中指作证；结合עֵד שָׁקֶר译为“作假见证”最符合现代汉语法律与伦理语境。
- source_word: בְּרֵעֵהוּ
  choice: 陷害邻舍
  rationale: 介词在此语境中表示针对某人；“邻舍”保留רֵעַ的传统伦理内涵，“陷害”自然表达虚假证言对邻舍的敌对与伤害作用。
- source_word: עֵד שָׁקֶר
  choice: 假见证
  rationale: 该短语可指虚假的证言或虚假见证；与עֹנֶה合译为“作假见证”，准确而自然。
theological_decisions:
- issue: 虚假见证与三种武器之间的比喻关系
  choice: 保留原文的名词性比喻：“大锤、刀剑和利箭，就是……的人”
  alternative: 译为明喻：“……的人就像大锤、刀剑和利箭”
  rationale: 原文直接把作假见证者等同于伤人武器，表达强烈；汉语用“就是”既保留这一力度，也使句法清楚，不把比喻所指仅限于言语或后果。
translation_notes:
  register: 采用现代、凝练而庄重的箴言体。按原文顺序先列出三种武器，再点明作假见证的人；“大锤、刀剑、利箭”形成清晰有力的递进意象。
