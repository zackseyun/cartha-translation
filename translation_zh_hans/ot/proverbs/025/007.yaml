  text: כִּ֤י ט֥וֹב אֲמָר לְ/ךָ֗ עֲֽלֵ֫ה הֵ֥נָּה מֵֽ֭/הַשְׁפִּ֣ילְ/ךָ לִ/פְנֵ֣י נָדִ֑יב אֲשֶׁ֖ר רָא֣וּ עֵינֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/025/007.yaml
  text: For it is better that it be said to you[b][a], “Come up here,” than that you be humbled before a nobleman whom your eyes have seen.
translation:
  language: zh_hans
  text: 因为有人对你说：“请上到这里来”，总比你在一位你亲眼见过的显贵面前被降到低位好。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “被降到低位”也可译作“被贬低”。原文既可强调座位或等级被降低，也含有当众受辱的意味。
    reason: lexical_alternative
  - marker: b
    text: “亲眼见过”直译是“你的眼睛看见过”，是希伯来语的生动说法。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文劝诫，说明不要自居高位的理由。
- source_word: טוֹב ... מִן
  choice: 总比……好
  rationale: 准确表达希伯来语的比较结构，并使现代汉语自然流畅。
- source_word: אֲמָר לְךָ
  choice: 人对你说
  rationale: 原文未指明说话者；用泛指的“人”保留这一点，避免擅自补出主人或君王。
- source_word: עֲלֵה הֵנָּה
  choice: 请上到这里来
  rationale: 既保留向较高位置移动的空间意象，也传达被邀升到尊位的社交含义；“请”符合汉语邀请语气。
- source_word: מֵהַשְׁפִּילְךָ
  choice: 你……被降到低位
  rationale: 保留使役性的“被降低”及席位、身份下降的双重含义，不只译成主观感受上的羞辱。
- source_word: לִפְנֵי נָדִיב
  choice: 在亲贵面前
  rationale: נָדִיב在这里指有身份地位的显贵；“亲贵”庄重简洁，又不把其职衔限定为王子或统治者。
- source_word: אֲשֶׁר רָאוּ עֵינֶיךָ
  choice: 这位亲贵是你亲眼见过的
  rationale: 保留“你的眼睛看见”的生动强调，同时以自然汉语表达；关系从句最自然地回指紧邻的“亲贵”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“亲贵”体现宫廷或上层社会场景；正文保留“上”“低”的空间对照，以呈现席位与社会地位相互映照的箴言修辞。
