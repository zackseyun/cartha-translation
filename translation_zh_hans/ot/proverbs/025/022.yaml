  text: for you will heap burning coals on his head[b][a], and Yahweh will repay you.
translation:
  language: zh_hans
  text: 因为你把炭火堆在他头上[a]；耶和华必报答你[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“把炭火收集、铲取或拨拢在他头上”。这里保留希伯来语的比喻；它究竟表示使仇敌羞愧而悔改，还是加重他的审判，解释者看法不一。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“耶和华必奖赏你”。原文动词可表示偿还或回报；在这里，对行义的人具有正面的含义。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上一节，说明善待仇敌的意义和结果；中文用“因为”自然地保留解释关系。
- source_word: גֶחָלִים
  choice: 炭火
  rationale: 指仍在燃烧的火炭；“炭火”简洁而清楚地呈现活炭的意象。
- source_word: חֹתֶה
  choice: 堆
  rationale: 该动词本义涉及收拢、铲取火炭；在“头上”的搭配中译作“堆”能自然表达累积的结果，同时保留原文比喻。
- source_word: עַל רֹאשׁוֹ
  choice: 在他头上
  rationale: 直接保留原文介词短语和未加解释的习语意象。
- source_word: וַיהוָה
  choice: 耶和华
  rationale: 以现代中文常见的专名形式呈现四字神名，区别于称号“主”。
- source_word: יְשַׁלֶּם לָךְ
  choice: 必报答你
  rationale: שלם 的加强词干在此表示偿还、回报；上下文对行善者而言含正面的报偿意味，“报答”兼顾词义和语境。
theological_decisions:
- issue: “把炭火堆在他头上”的含义
  choice: 正文保留比喻，不断定它具体表示使仇敌羞愧悔改、加重其审判，还是兼有二者。
  alternative: 直接释为“使他羞愧悔改”或“使他受到更重的审判”。
  rationale: 希伯来文本只陈述这一意象，并未明说其作用；保留原有张力可避免把某一种解释写入正文。
- issue: 耶和华的“报答”是正面还是中性偿还
  choice: 采用在本语境中自然带有正面意味的“报答”。
  alternative: 译作较中性的“偿还”或更明确的“奖赏”。
  rationale: 动词本身可指偿付或回报，而上一节所述善待仇敌的行为使这里明显趋向正面；“报答”既符合语境，又不把回报的具体形式说死。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“因为你这样做”补明与上一节行为的承接关系；正文保留“炭火堆在他头上”这一陌生但重要的希伯来意象，并用脚注交代词义与解释上的开放性。
