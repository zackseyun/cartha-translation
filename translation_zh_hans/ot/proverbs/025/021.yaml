  text: אִם רָעֵ֣ב שֹׂ֭נַאֲ/ךָ הַאֲכִלֵ֣/הוּ לָ֑חֶם וְ/אִם צָ֝מֵ֗א הַשְׁקֵ֥/הוּ מָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/025/021.yaml
  text: If your enemy is hungry[a], feed him bread, and if he is thirsty, give him water to drink.
translation:
  language: zh_hans
  text: 如果恨你的人[a]饿了，就给他饼吃；如果他渴了，就给他水喝。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你的仇敌”。原文直译为“恨你的人”。
    reason: 说明主动分词的字面意义，并提供较惯用的关系性译法。
lexical_decisions:
- source_word: אִם
  choice: 如果
  rationale: 直接表达希伯来语的条件关系；不译作“当……时”，以免把条件说成预期必然发生的情形。
- source_word: רָעֵב
  choice: 饿了
  rationale: 自然表达述语形容词所描述的饥饿状态，又不夸大为“饿极了”。
- source_word: שֹׂנַאֲךָ
  choice: 恨你的人
  rationale: 该词是“恨”的主动分词加第二人称单数后缀，直指“恨你的人”。此译比“仇敌”更贴近词形，并保留其关系性的含义。
- source_word: הַאֲכִלֵהוּ
  choice: 给他……吃
  rationale: 使役命令式本义为“使他吃”；结合宾语“饼”，译作“给他饼吃”准确而自然。
- source_word: לָחֶם
  choice: 饼
  rationale: 保留原文具体的主食意象，不泛化为“食物”；“饼”也比现代汉语中常特指西式面包的“面包”更适合古代语境。
- source_word: וְאִם
  choice: 如果
  rationale: 第二个并列条件句在汉语中无需机械添加“并且”；重复“如果”即可清楚保留平行结构。
- source_word: צָמֵא
  choice: 他渴了
  rationale: 补出汉语自然表达所需的主语，准确呈现与“饿了”平行的状态。
- source_word: הַשְׁקֵהוּ
  choice: 给他……喝
  rationale: 使役命令式表示给人饮用；与明确宾语“水”组合为“给他水喝”，简洁自然。
- source_word: מָיִם
  choice: 水
  rationale: 按原文直译，保留具体对象，不泛化为“饮料”。
theological_decisions:
- issue: 箴言中阳性单数形式的代表性用法
  choice: 保留单数关系与男性代词：“恨你的人……给他……如果他……”
  alternative: 使用复数或无性别表达，如“那些恨你的人……给他们……”
  rationale: 希伯来文连续使用阳性单数形式，具有代表性和普遍适用性。中文“他”既保留原文语法形式，也维持这句箴言对具体个人的道德要求，不将对象改成复数群体。
- issue: שֹׂנַאֲךָ所指关系的表达
  choice: 正文译作“恨你的人”
  alternative: 译作“你的仇敌”
  rationale: 原词首先描述一个对读者怀有憎恨的人，不必进一步界定为公开敌对关系。“恨你的人”保留这一范围；脚注提供惯用的“仇敌”译法。
translation_notes:
  register: 采用现代、庄重而易懂的汉语。两个“如果”保留原文平行的条件结构；“给他饼吃／给他水喝”形成简洁对称。正文脚注标记[a]已与脚注对应。
