  text: Argue your case with your neighbor himself[b][a], and do not reveal another person's secret.
translation:
  language: zh_hans
  text: 你要与邻舍争辩自己的事[a]，不可泄露别人的秘密[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你要与邻舍处理你的争端”，或“你要向邻舍申诉你的案情”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译“另一个人的秘密”；也可指关于他人的机密之事。
    reason: lexical_alternative
lexical_decisions:
- source_word: רִיבְךָ
  choice: 你的案件
  rationale: רִיב可指争端、争讼或案件；“案件”保留一定的司法色彩，同时不把语境限定为正式诉讼。
- source_word: רִיב
  choice: 争辩
  rationale: 命令式רִיב表示提出、处理或争论争端；“争辩”在现代汉语中自然，也保留原文与同根名词相连的表达。
- source_word: אֶת רֵעֶךָ
  choice: 与邻舍
  rationale: רֵעַ可指邻舍、同伴或朋友；“邻舍”范围较广，适合箴言语境。此处אֶת标示争辩的另一方，译作“与”比“反对”更自然。
- source_word: וְסוֹד
  choice: 却……秘密
  rationale: סוֹד可指秘密、私下谈话或密议；这里与“泄露”搭配，“秘密”最清楚。“却”表达两分句之间的对照关系。
- source_word: אַחֵר
  choice: 别人的
  rationale: אַחֵר修饰סוֹד，字面为“另一个人的秘密”；“别人的”简洁自然，并保留所属关系。
- source_word: אַל תְּגָל
  choice: 不可泄露
  rationale: גלה在此表示揭开、披露；“泄露”适用于不应公开的秘密，准确传达禁令。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的箴言体。“邻舍”保留智慧文学中的广义人际称谓；正文未加入原文没有明说的“本人”或“单独”，而将“直接处理”的语用含义置于脚注，以免消除原文的含蓄性。
