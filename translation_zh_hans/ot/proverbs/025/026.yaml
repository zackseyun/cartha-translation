  text: מַעְיָ֣ן נִ֭רְפָּשׂ וּ/מָק֣וֹר מָשְׁחָ֑ת צַ֝דִּ֗יק מָ֣ט לִ/פְנֵֽי רָשָֽׁע־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/025/026.yaml
  text: Like a muddied spring and a polluted fountain is a righteous man who gives way before the wicked[a].
translation:
  language: zh_hans
  text: 义人在恶人面前动摇[a]，就像被搅浑的泉水和受污染的水源。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “动摇”也可译作“退让”或“失足”；“被搅浑”可能含有泉被践踏而变浑的意思。
    reason: 原文 מָט 可指摇晃、失足或让步，נִרְפָּשׂ 则可指因扰动或践踏而变浑；脚注保留这些词义上的可能性。
lexical_decisions:
- source_word: מַעְיָן
  choice: 泉
  rationale: 指天然涌出的水泉；“泉”简洁自然，并与下句近义的 מָקוֹר 构成诗歌平行。
- source_word: נִרְפָּשׂ
  choice: 被搅浑的
  rationale: 该被动分词表示泉水受扰而浑浊，可能因踩踏或搅动所致；“被搅浑”清楚保留水体变浑的意象。
- source_word: מָקוֹר
  choice: 水源
  rationale: 本词与 מַעְיָן 平行，表示水的源头；译作“水源”既与“泉”有所区别，也不误导为人工喷泉。
- source_word: מָשְׁחָת
  choice: 遭污染的
  rationale: 该词表示败坏、损坏或腐坏；用于水源时，“遭污染”最自然地表达水质受到败坏。
- source_word: צַדִּיק
  choice: 义人
  rationale: 阳性单数形容词名词化使用；“义人”是现代汉语圣经语体中自然、凝练且具有代表性的表达。
- source_word: מָט
  choice: 动摇
  rationale: 动词可表示摇晃、站立不稳、失足或屈服；“动摇”既可表达不稳，也可包含面对恶人时意志或立场不坚定的含义，而不把歧义完全限定为主动退让。
- source_word: לִפְנֵי
  choice: 在……面前
  rationale: 直接表达“在某人面前”或“面对某人”的关系，符合本句语境。
- source_word: רָשָׁע
  choice: 恶人
  rationale: 阳性单数形容词名词化，具有箴言式的代表意义；“恶人”准确而自然。
theological_decisions:
- issue: צַדִּיק 的性别与代表性
  choice: 义人
  alternative: 正直的人／一个义人
  rationale: 原文为阳性单数，但汉语“义人”本身不必额外标明男性，仍保留单数人物形象及其箴言式代表作用，不引入特定性别解释。
- issue: מָט 所表达的是失足、动摇还是向恶人屈服
  choice: 动摇
  alternative: 退让／屈服／失足
  rationale: 原词具有身体站立不稳和比喻性动摇的语义范围；上下文可能暗示道德或社会压力下的退让，但原文没有明说其动机，因此正文采用较宽的“动摇”，并以脚注列出其他可能译法。
translation_notes:
  register: 采用现代、庄重而易懂的箴言语体。先陈述义人的处境，再以“就像”引出双重水源意象，符合自然汉语信息顺序；“泉／水源”和“被搅浑／遭污染”保留原文的近义平行与细微差别。
