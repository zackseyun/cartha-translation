translation:
  language: zh_hans
  text: 免得听见这事的人羞辱你[a]，你的恶名便挥之不去[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “羞辱你”也可译作“使你蒙羞”或“责备你”；此处的希伯来语动词罕见，具体含义难以确定。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“有关你的恶评不会消退”或“不会被收回”。原文可能指有关你的坏话会持续流传，也可能指由此造成的羞耻或恶名无法消除。
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּן
  choice: 免得
  rationale: 引出应当避免的不良后果，符合希伯来语警戒语气，也适合汉语箴言体。
- source_word: יְחַסֶּדְךָ
  choice: 羞辱你
  rationale: 该动词在此罕见且词义难定；结合公开私事后所招致的社会性后果，“羞辱你”保留了责难与使人蒙羞两方面的可能。
- source_word: שֹׁמֵעַ
  choice: 听见这事的人
  rationale: 分词在此作不定指名词使用；“这事”由上文语境补足，使现代汉语表达自然清楚。
- source_word: דִבָּתְךָ
  choice: 你的恶名
  rationale: דִּבָּה可指不利的传闻、恶评或诋毁之言；本句语境侧重这些话给当事人造成并持续流传的坏名声。
- source_word: לֹא תָשׁוּב
  choice: 再也无法挽回
  rationale: 直译为“不返回”；与“恶名”搭配时，“无法挽回”自然表达损害不能逆转，同时由脚注保留原文“返回”的意象及另一种理解。
