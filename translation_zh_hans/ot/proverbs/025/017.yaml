  yaml_path: translation/ot/proverbs/025/017.yaml
  text: Let your foot be seldom in your neighbor’s house[b][a], lest he have his fill of you and hate you.
translation:
  language: zh_hans
  text: '你要少去邻舍家里[a][b]，

    免得他对你生厌，继而恨你。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译：“使你的脚从邻舍的家中稀少。”这是一种习语，意思是不要频繁登门。
    reason: lexical_alternative
  - marker: b
    text: “邻舍”也可译作“朋友”或“同伴”。
    reason: alternative_reading
lexical_decisions:
- source_word: הֹקַר
  choice: 要少去
  rationale: 这是יקר的使役式命令，字面为“使……稀少”；结合“脚”和“家”的语境，指减少登门的次数。“要少去”以自然现代汉语保留劝诫语气。
- source_word: רַגְלְךָ
  choice: 去
  rationale: 希伯来文直译为“你的脚”，以脚代指到访。正文按现代汉语习惯将这一具体意象转化为“去”，字面表达则在脚注说明。
- source_word: מִבֵּית
  choice: 邻舍家里
  rationale: 介词מִן字面是“从”，但“使脚从某人的家稀少”是希伯来语习语；汉语用“少去……家里”准确表达少在该处出现之意。
- source_word: רֵעֶךָ
  choice: 邻舍
  rationale: רֵעַ可指邻舍、朋友或同伴。“邻舍”保留较宽泛的社会关系含义；其他可能义项列入脚注。
- source_word: פֶּן
  choice: 免得
  rationale: 引出应当避免的后果；“免得”简洁地保留警戒关系和箴言语气。
- source_word: יִשְׂבָּעֲךָ
  choice: 他对你厌足
  rationale: שׂבע本义是“吃饱、满足、饱足”，此处以饱足比喻因来访过多而生厌。“厌足”兼顾原文饱足意象与上下文的负面意味，避免直接改写成较平的“厌烦”。
- source_word: וּשְׂנֵאֶךָ
  choice: 便恨你
  rationale: שׂנא的基本义是“恨”。“便”自然承接前一结果，不弱化原文强烈措辞。
