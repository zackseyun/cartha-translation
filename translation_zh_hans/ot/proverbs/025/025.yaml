  text: Like cold water to a weary soul[a], so is good news from a distant land.
translation:
  language: zh_hans
  text: '凉水之于疲乏的人，

    正如从远方传来的好消息[a]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “好消息”也可译作“佳音”或“好报告”。希伯来语 שְׁמוּעָה 可指消息、音讯或报告。
    reason: lexical_alternative
lexical_decisions:
- source_word: מַיִם קָרִים
  choice: 凉水
  rationale: 希伯来语直指冷的水；现代汉语“凉水”在此自然地表达使疲乏者舒畅的水，同时保留鲜明的感官意象。
- source_word: עַל נֶפֶשׁ עֲיֵפָה
  choice: 疲乏的人喝到
  rationale: נֶפֶשׁ在这里可指有生命、感受疲乏的人，也可能带有喉咙或内在生命的意象。译作“疲乏的人喝到”使水与人的关系在汉语中自然清楚，却不把נֶפֶשׁ拘限为抽象的“灵魂”。
- source_word: וּשְׁמוּעָה טוֹבָה
  choice: 好消息……也是如此
  rationale: שְׁמוּעָה可指消息、传闻或报告；“好消息”最符合本节与凉水相并列的欣喜、舒畅之意。“也是如此”明示原文省略而由并列结构表达的比较关系。
- source_word: מֵאֶרֶץ מֶרְחָק
  choice: 从远方传来
  rationale: 原文意为“来自遥远之地”。“从远方传来”是自然的现代汉语，也清楚表达消息的来源；“远方”保留地理距离而不必限定为现代政治意义的国家。
theological_decisions: []
translation_notes:
  register: 采用简洁、对称的箴言体。前半句将希伯来语介词结构转化为自然汉语的饮水情景，后半句保留远方消息带来慰藉的比喻。正文中的脚注标记置于整节末尾，对应“好消息”的词义选择。
