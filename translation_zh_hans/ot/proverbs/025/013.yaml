  text: כְּ/צִנַּת שֶׁ֨לֶג בְּ/י֬וֹם קָצִ֗יר צִ֣יר נֶ֭אֱמָן לְ/שֹׁלְחָ֑י/ו וְ/נֶ֖פֶשׁ אֲדֹנָ֣י/ו יָשִֽׁיב־׀׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/025/013.yaml
  text: Like the coolness of snow on a harvest day is a faithful messenger to those who send him[b][a], for he refreshes the life of his masters.
translation:
  language: zh_hans
  text: 对于差遣他的人，忠信的使者就像收割之日雪带来的清凉[a]；他使主人的心神重新振作[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“像收割时节雪的寒气。”这里的图景很可能是雪所带来的清凉，而不是降雪损害庄稼。
    reason: lexical_alternative
  - marker: b
    text: 或译：“他使主人的生命恢复。”原文词可指“生命”“性命”“自我”或“内在生命”，也可直译为“魂”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּצִנַּת שֶׁלֶג
  choice: 像……雪带来的清凉
  rationale: צִנָּה指寒冷或凉意；本句以收割时的暑热为背景，语意重在雪所带来的清凉与舒爽，而不是降雪本身。译作“清凉”既保留意象，也符合比喻的正面作用。
- source_word: בְּיוֹם קָצִיר
  choice: 收割之日
  rationale: 保留原文具体的时间图景，比笼统的“收割时节”更贴近单数“日”的表达，同时在现代汉语中自然凝练。
- source_word: צִיר נֶאֱמָן
  choice: 忠信的使者
  rationale: צִיר在此指奉差传递信息的人；נֶאֱמָן兼有可靠、忠诚之意。“忠信的使者”保留其道德分量，并符合智慧文学的庄重语体。
- source_word: לְשֹׁלְחָיו
  choice: 对差遣他的人
  rationale: 原文为复数“差遣他的人”。汉语中的“人”在此可作集合性表达，无须生硬添加复数标记。
- source_word: וְנֶפֶשׁ אֲדֹנָיו יָשִׁיב
  choice: 他使主人的心神重新振作
  rationale: נֶפֶשׁ可指生命、自我或内在精神；שׁוב的使役式表示使之恢复、回转。结合清凉使人恢复活力的比喻，译为“使……心神重新振作”自然传达其作用，同时用脚注保留较直译的可能。
- source_word: אֲדֹנָיו
  choice: 主人
  rationale: 希伯来语形式为复数，但现代汉语裸名词本身可不标明单复数；“主人”避免“主人们”的生硬，也不把关系过度限定为奴隶所有权。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的箴言体。为使汉语比喻关系清楚，将“忠信的使者”前置为主语，但保留原文“收割之日—雪的清凉—忠信使者—使主人恢复”的意象与逻辑。分号承接末句的解释作用，同时不过度强化原文连接词的因果含义。
