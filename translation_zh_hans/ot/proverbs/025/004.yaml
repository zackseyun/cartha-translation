  yaml_path: translation/ot/proverbs/025/004.yaml
  text: Remove the dross from the silver[a], and a vessel comes out for the refiner.
translation:
  language: zh_hans
  text: 除去银的渣滓，炼银的人就有器皿可用。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָגוֹ
  choice: 除去
  rationale: 此处是命令式，表示移走、清除；“除去”自然简洁，符合箴言的劝诫语气。
- source_word: סִיגִים
  choice: 渣滓
  rationale: 指炼净金属时分离出来的杂质或废渣；“渣滓”准确保留冶炼意象，也为现代读者所理解。
- source_word: מִכָּסֶף
  choice: 银中的
  rationale: 介词表示从银里分离；译作“银中的”符合现代汉语表达，并清楚呈现渣滓与银的关系。
- source_word: וַיֵּצֵא
  choice: 就能制成
  rationale: 该动词在箴言的连续结构中表达除去渣滓后产生的结果。结合中文句法与炼匠、器皿的关系，译作“就能制成”自然呈现结果，而不误作一次性的过去事件。
- source_word: לַצֹּרֵף
  choice: 炼银匠
  rationale: צֹרֵף泛指熔炼、精炼金属的人；本节明确谈到银，因此“炼银匠”最贴合眼前语境，同时以脚注保留较宽泛的词义。
- source_word: כֶּלִי
  choice: 器皿
  rationale: 该词可泛指器具、物件或容器；“器皿”保留具体而开放的成品意象，符合箴言简练的表达。
theological_decisions: []
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。为避免生硬直译“器皿为炼匠出来”，按希伯来语所表达的结果关系重组语序，同时保留除渣、炼匠和器皿三个核心意象。
