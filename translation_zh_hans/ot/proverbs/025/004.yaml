revisions:
- from: 除去银中的渣滓，炼银匠[a]就能制成器皿。
  to: 除去银的渣滓，炼银的人就有器皿可用。
  rationale: 修订使结果句不额外指定器皿是如何“制成”的，同时以自然的现代汉语表达器皿归炼银者所得或使用的关系。保留原有的冶炼意象、箴言式简洁语气和职业名词的词义范围。
