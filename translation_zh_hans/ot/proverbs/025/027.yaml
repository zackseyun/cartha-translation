  yaml_path: translation/ot/proverbs/025/027.yaml
  text: To eat much honey is not good[a], and to search out their glory is glory.
translation:
  language: zh_hans
  text: 蜂蜜吃得太多，不好；探究他们的荣耀，就是荣耀。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文本作：“探究他们的荣耀，就是荣耀。”第二行很难理解。它可能是说，为自己寻求荣耀并不光荣；也可能是说，探究重大之事是光荣的。这里贴近马所拉文本翻译。
    reason: alternative_reading
lexical_decisions:
- source_word: אָכֹל
  choice: 吃
  rationale: 不定式在此具有名词性和箴言式概括功能；汉语用“吃”自然表达这一泛指行为。
- source_word: דְּבַשׁ
  choice: 蜜
  rationale: 保留原文具体意象；“蜜”简洁、庄重，也符合箴言语体。
- source_word: הַרְבּוֹת
  choice: 得多
  rationale: 表达数量过多或过量，同时避免把原文直接解释成只关乎健康的“吃过量”。
- source_word: לֹא טוֹב
  choice: 不好
  rationale: 贴近原文简洁的评价，不额外限定为身体有害或道德错误。
- source_word: וְחֵקֶר
  choice: 探究
  rationale: 该词表示查考、探究；以名词化动词承接前句，保留凝练的平行结构。
- source_word: כְּבֹדָם
  choice: 他们的荣耀
  rationale: 按马所拉文本保留第三人称阳性复数后缀，不擅自改作“自己的荣耀”或“重大之事”。
- source_word: כָּבוֹד
  choice: 就是荣耀
  rationale: 保留原文重复 כבד 词根所形成的回响和名词谓语，也不消解第二行本有的难解性。
theological_decisions:
- issue: 第二行的意义难以确定
  choice: 按马所拉文本直译为“探究他们的荣耀，就是荣耀”
  alternative: “寻求自己的荣耀并不光荣”或“探究重大之事是光荣的”
  rationale: 原文措辞和指代均有困难；直译能保存真实的歧义及“荣耀”一词的重复，避免引入未经文本明确支持的伦理或神学解释。
translation_notes:
  register: 采用现代、凝练的箴言体。“蜜吃得多不好”自然易懂；第二分句刻意保持原文的简峻和歧义，并以脚注说明主要理解方向。
