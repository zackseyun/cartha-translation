  yaml_path: translation/ot/proverbs/025/023.yaml
  text: The north wind brings forth rain[a], and an angry face[b], a slanderous tongue.
translation:
  language: zh_hans
  text: 北风带来雨[a]；背后中伤的舌头也招来怒容[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“北风驱散雨；背后中伤的舌头招来怒容。”希伯来文动词可有不同理解；有人认为这里是说北风驱散雨，而不是带来雨。
    reason: alternative_reading
  - marker: b
    text: “背后中伤的舌头”直译为“隐秘的舌头”或“暗中的舌头”，指背后中伤、毁谤一类隐蔽的言语。
    reason: lexical_alternative
lexical_decisions:
- source_word: ר֣וּחַ צָ֭פוֹן
  choice: 北风
  rationale: 该结构指从北方来的风；“北风”是现代汉语中自然、简洁的表达。
- source_word: תְּח֣וֹלֵֽל
  choice: 带来
  rationale: 该动词可表示产生、催生或造成。“带来”既符合汉语习惯，又保留北风导致降雨这一因果意象，同时不过度限定具体气象过程。
- source_word: גָּ֑שֶׁם
  choice: 雨水
  rationale: 原词泛指雨或降雨；“雨水”在本句中自然，也能与“带来”顺畅搭配。
- source_word: וּ/פָנִ֥ים נִ֝זְעָמִ֗ים
  choice: 也招来怒容
  rationale: פנים 形式上为复数，却常作为集合或惯用形式表示人的脸色、面容；נזעמים 表示恼怒、愤慨。“怒容”凝练地呈现愤怒的脸色。动词“招来”按两句的因果平行关系在汉语中补出。
- source_word: לְשׁ֣וֹן
  choice: 舌头
  rationale: 保留希伯来文以身体器官代指言语的具体意象，而不抽象化为“言论”。
- source_word: סָֽתֶר
  choice: 暗中毁谤的
  rationale: 该词本义为隐秘、隐藏；与“舌头”结合时，指背后或暗地里的言语。“暗中毁谤”表达其语境中的负面含义，同时在脚注中保留较直译的可能。
theological_decisions: []
translation_notes:
  register: 采用简洁、对称的箴言体。“带来……招来……”显明两分句的因果平行；用“怒容”保持庄重凝练。脚注保留希伯来动词在“产生雨水”与“驱散雨水”之间的真实歧义，并说明“隐秘的舌头”的字面意象。
