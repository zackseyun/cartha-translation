  text: Like clouds and wind without rain is a man who boasts of a false gift[a].
translation:
  language: zh_hans
  text: 有云有风，却没有雨；夸口要送礼却不兑现的人，也是如此。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“有云有风，却没有雨；夸耀虚假的馈赠的人，也是如此。”
    reason: 原文可直译为“夸耀虚假的馈赠”；在此语境中通常指夸口馈赠而未兑现。
lexical_decisions:
- source_word: נְשִׂיאִים
  choice: 云
  rationale: 这里与风和雨构成天气图景，指预示降雨的云；“云”是现代汉语中最自然的对应词。
- source_word: רוּחַ
  choice: 风
  rationale: 受云雨语境限定，此处显然是气象意义的“风”，不是“灵”或“气息”。
- source_word: גֶשֶׁם
  choice: 雨
  rationale: 采用该词在本句天气比喻中的通常含义。
- source_word: אָיִן
  choice: 没有
  rationale: 将希伯来语表示不存在的词自然译为“没有雨”，并以“却”显明云风带来的期待与实际结果之间的反差。
- source_word: אִישׁ
  choice: 人
  rationale: 希伯来语用阳性单数作代表性表达；现代汉语以“人”自然传达泛指，不额外限定性别。
- source_word: מִתְהַלֵּל
  choice: 夸耀
  rationale: 该词在此表示自我炫耀、夸口；“夸耀”既保留贬义，也符合箴言庄重简洁的语体。
- source_word: בְּמַתַּת
  choice: 礼物
  rationale: 介词短语说明夸耀的内容；汉语用“夸耀……礼物”自然表达。
- source_word: שָׁקֶר
  choice: 虚假
  rationale: 保留原文简练而宽泛的“虚假”概念，不在正文中直接限定为未曾送出的礼物；脚注交代语境中很可能包含许诺送礼却不兑现之意。
