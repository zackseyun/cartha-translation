  text: It is better to live on a corner of the roof than with a quarrelsome wife in a shared house[a].
translation:
  language: zh_hans
  text: 宁可住在屋顶的一角，也不愿与好争吵的妻子同住一屋[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“……也不愿有好争吵的妻子和一所共同居住的房屋。”希伯来文最后一语十分简略，可能着重表示共处同一家庭或住处，而不一定强调相伴之乐。
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: 宁可……也不……
  rationale: 这是智慧文学中表达比较取舍的惯用结构；用“宁可……也不……”自然呈现“前者胜过后者”的语气。
- source_word: שֶׁבֶת
  choice: 住
  rationale: 该词本义可指“坐”，但与地点连用时表示居住；“住”在现代汉语中简洁自然。
- source_word: עַל פִּנַּת גָּג
  choice: 住在屋顶的一角
  rationale: 保留平顶房屋上一处狭小、暴露角落的具体意象，不在正文中额外解释。
- source_word: מֵאֵשֶׁת מִדְיָנִים
  choice: 也不跟好争吵的妻子
  rationale: 前缀מ־在טוֹב之后标示比较；מִדְיָנִים是“争端、争吵”的复数形式，在此描述妻子惯常引发争执，译作“好争吵的”清楚而不过度强化。
- source_word: וּבֵית חָבֶר
  choice: 同住一屋
  rationale: 原文末语高度凝练，חָבֶר可涉及共同、相伴或共享；“同住一屋”在汉语中既通顺，又突出共处同一家庭空间的含义。
