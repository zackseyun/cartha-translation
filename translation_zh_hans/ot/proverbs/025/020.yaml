  text: מַ֥עֲדֶה בֶּ֨גֶד בְּ/י֣וֹם קָ֭רָה חֹ֣מֶץ עַל נָ֑תֶר וְ/שָׁ֥ר בַּ֝/שִּׁרִ֗ים עַ֣ל לֶב רָֽע׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/025/020.yaml
  text: Like one who takes off a garment on a cold day[a], and like vinegar on soda[b], is one who sings songs to a troubled heart.
translation:
  language: zh_hans
  text: 在寒冷的日子脱去衣服、把醋倒在泡碱[a]上，正如向忧伤的人[b]唱歌。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “泡碱”指一种矿物碱（天然碱），不是特指现代的小苏打；醋倒在其上会发生反应。
    reason: 说明נָתֶר的古代物质名称，避免将其误解为现代小苏打。
  - marker: b
    text: 原文直译为“在不好的心上／向不好的心”；这里指内心痛苦、忧伤的状态，并不一定指道德上的邪恶。
    reason: 保留רָע的词义范围，并说明此处按语境的情绪含义。
lexical_decisions:
- source_word: מַעֲדֶה בֶּגֶד
  choice: 脱掉衣服
  rationale: מַעֲדֶה在这里取“除去、脱下”之意；与“冷天”连用，描绘撤去御寒衣物的不合宜之举。“脱掉衣服”是自然、具体的现代汉语。
- source_word: בְּיוֹם קָרָה
  choice: 冷天
  rationale: 简洁表达“在寒冷的日子”，保留箴言凝练的语气。
- source_word: חֹמֶץ
  choice: 醋
  rationale: 这是该词通常且明确的词义。
- source_word: נָתֶר
  choice: 天然碱
  rationale: 指古代使用的矿物碱，通常称为泡碱或天然碱，并非特指现代小苏打；“天然碱”兼顾准确性与可懂度。
- source_word: וְשָׁר בַּשִּׁרִים
  choice: 唱歌
  rationale: 希伯来文为分词加复数“歌曲”，表达向人歌唱这一行为；汉语用“唱歌”即可自然涵盖，不必生硬保留复数。
- source_word: עַל לֶב רָע
  choice: 向心里忧伤的人
  rationale: 字面为“对着／在不好的心之上”；此处的רָע描述内心痛苦、悲伤的状态，不必理解为道德邪恶。以“心里忧伤的人”自然传达所指对象。
- source_word: '[并列的三个短语]'
  choice: 都是同样不合宜
  rationale: 马所拉文本以三个并列意象构成无明示谓语的名词句。汉语补出比较关系，使句意完整；“不合宜”概括这些行为与处境不相称的共同点，但不进一步限定其具体效果。
theological_decisions:
- issue: לֵב רָע中的“坏／恶”是否指道德邪恶
  choice: 理解为忧伤、痛苦的内心状态
  alternative: 理解为邪恶的心
  rationale: 上下文谈的是不合时宜地唱歌所造成的不协调，情绪困苦的含义最符合这一比喻；因此不把经文转化为对邪恶之人的道德评断。
translation_notes:
  register: 采用现代、简洁而庄重的箴言体。原文是三个并列、没有明示谓语的意象；译文补出“都是同样不合宜”，使现代汉语完整通顺，同时保留三者并列比较的结构。
