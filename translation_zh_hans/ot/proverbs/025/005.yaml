base_translation:
  language: en
  yaml_path: translation/ot/proverbs/025/005.yaml
  text: Remove the wicked from before the king[b][a], and his throne will be established in righteousness.
translation:
  language: zh_hans
  text: 从王面前除掉恶人[a]，他的宝座就必在公义中得以坚立[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“把恶人从王面前移走”。这里很可能是指清除王身边败坏的影响。
    reason: lexical_alternative
  - marker: b
    text: “在公义中”也可译作“因公义而”“借着公义”或“按公正”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הָגוֹ
  choice: 除掉
  rationale: 此处是命令式，与上一节“除去”杂质的意象相连，表示清除、移走；“除掉”简洁自然，又不具体限定清除的方式。
- source_word: רָשָׁע
  choice: 恶人
  rationale: 希伯来语以单数形容词作名词，指一个作恶者，也可作为某一类人的典型；现代汉语“恶人”自然保留这种概括性，不额外标明性别。
- source_word: לִפְנֵי מֶלֶךְ
  choice: 从王面前
  rationale: 直译并保留宫廷场景，意思是把恶人从王的面前或王的近旁清除。
- source_word: וְיִכּוֹן
  choice: 就必……坚立
  rationale: Nifal未完成式表达王位由此得到确立、稳固；“就必”体现前后两句的结果关系，“坚立”兼顾被建立和保持稳固的含义。
- source_word: בַּצֶּדֶק
  choice: 因公义
  rationale: 介词ב可表达凭借的手段，也可表达所处的领域；正文采用自然的“因公义”，脚注保留“在公义中／按公正”的可能性。
- source_word: כִּסְאוֹ
  choice: 他的宝座
  rationale: 第三人称阳性单数后缀回指王；“宝座”既对应字面意象，也可指王权或统治。
theological_decisions:
- issue: 公义与王权稳固之间的关系
  choice: 因公义而坚立
  alternative: 在公义中坚立／按公正得以稳固
  rationale: 原文介词既可能表示手段或原因，也可能表示领域或准则；正文不把它扩展为特定政治或神学体系，并以脚注保留歧义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“从王面前”保留原文的宫廷表达；“恶人”不额外加入原文没有明说的性别信息；句式简洁，适合作为箴言格言。
