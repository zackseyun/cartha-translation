  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: גַּם אֵ֭לֶּה מִשְׁלֵ֣י שְׁלֹמֹ֑ה אֲשֶׁ֥ר הֶ֝עְתִּ֗יקוּ אַנְשֵׁ֤י חִזְקִיָּ֬ה מֶֽלֶךְ יְהוּדָֽה־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/025/001.yaml
  text: These also are proverbs of Solomon[b][a], which the men of Hezekiah king of Judah copied.
translation:
  language: zh_hans
  text: 以下也是所罗门的箴言，是犹大王希西家的人[b]所抄录[a]的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “抄录”也可译为“誊写”或“汇编”。这里的希伯来语动词很可能指将这些箴言抄录成一部汇集。
    reason: lexical_alternative
  - marker: b
    text: “希西家的人”可能指希西家王廷中的官员或书记。
    reason: cultural_note
lexical_decisions:
- source_word: גַּם אֵלֶּה
  choice: 以下也是
  rationale: גַּם 表示在前一集之外的追加，אֵלֶּה 指向接下来的箴言；“以下也是”在现代汉语中自然，并清楚标示新段落的延续性。
- source_word: מִשְׁלֵי שְׁלֹמֹה
  choice: 所罗门的箴言
  rationale: “箴言”符合 מָשָׁל 在本书及此类智慧格言语境中的常用译法；人名采用通行译名“所罗门”。
- source_word: הֶעְתִּיקוּ
  choice: 抄录
  rationale: 此处使役形动词表示将这些箴言转抄、誊录到一个汇集文本中；“抄录”既保留文本复制之意，也不过度断定具体编辑过程。
- source_word: אַנְשֵׁי חִזְקִיָּה
  choice: 希西家的人
  rationale: 直译保留“属于或隶属希西家的人”这一关系，也保留原文对人员身份的含混；脚注说明他们可能是王廷官员或书记。
- source_word: מֶלֶךְ יְהוּדָה
  choice: 犹大王
  rationale: 准确表达希西家的王职；“犹大王”是简洁、自然且庄重的现代汉语。
theological_decisions:
- issue: אַנְשֵׁי חִזְקִיָּה 所指人员的身份
  choice: 希西家的人
  alternative: 希西家的官员／希西家的书记
  rationale: 原文只明说他们是与希西家相关联的“人”，并未明确其具体职衔。正文不把历史上很可能的王廷或书记职能提升为原文明说的身份。
- issue: הֶעְתִּיקוּ 所表达的整理方式
  choice: 抄录
  alternative: 誊写／汇编
  rationale: 该词在此可能涉及转抄并收入文集，但原文没有详述编辑程序；“抄录”保留核心意义，同时避免断言只是机械誊写或完整的编辑汇编。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“以下也是”承担标题式引介功能；“希西家的人”刻意保留原文的关系表达和身份含混。脚注标记均置于正文相关句末，避免打断主句。
