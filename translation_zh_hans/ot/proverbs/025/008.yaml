base_translation:
  language: en
  yaml_path: translation/ot/proverbs/025/008.yaml
  text: Do not go out hastily to a dispute[a], lest in the end, when your neighbor puts you to shame[b], you not know what to do.
translation:
  language: zh_hans
  text: 不要急着去争讼[a]，免得到了最后，邻舍使你蒙羞时，你竟不知该怎么办[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “争讼”也可译作“争执”或“诉诸法庭”。原词既可指一般争端，也可带有法律诉讼的意味。
    reason: alternative_reading
  - marker: b
    text: 希伯来文采用省略式说法，直译近于：“免得……到末了，当你的邻舍使你蒙羞时，你将怎么办？”正文将隐含的意思译为“你不知该怎么办”。
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵּצֵא לָרִיב
  choice: 出去争讼
  rationale: 保留יצא“出去”的动作意象；ריב兼有争执与法律争讼的含义。“争讼”较“争吵”正式，又不必限定为已经上法庭。
- source_word: מַהֵר
  choice: 急着
  rationale: 表达行动迅速且欠审慎，符合箴言的劝诫语气，也比“迅速地”更自然。
- source_word: פֶּן
  choice: 免得
  rationale: 准确承载引出不良后果的警戒意味。
- source_word: בְּאַחֲרִיתָהּ
  choice: 最终
  rationale: 指这场争讼最后的结局；采用简洁说法，避免强行明确阴性后缀所指。
- source_word: בְּהַכְלִים אֹתְךָ
  choice: 使你蒙羞时
  rationale: 将ב加不定式结构译作时间情形，并保留כלם所含的羞辱、颜面受损之意。
- source_word: רֵעֶךָ
  choice: 你的邻舍
  rationale: רֵעַ指社会关系中的他人，未必是亲密朋友；“邻舍”保留其广义伦理和法律语境。
- source_word: מַה תַּעֲשֶׂה
  choice: 你不知该怎么办
  rationale: 希伯来文为省略式反问，直译近于“你将怎么办？”正文补出语境隐含的无计可施之意，同时以脚注保留原文形式。
