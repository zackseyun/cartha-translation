  text: שֵׁ֣ן רֹ֭עָה וְ/רֶ֣גֶל מוּעָ֑דֶת מִבְטָ֥ח בּ֝וֹגֵ֗ד בְּ/י֣וֹם צָרָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/025/019.yaml
  text: Confidence in a treacherous man in a day of trouble is like a bad tooth and a slipping foot[a][b].
translation:
  language: zh_hans
  text: 患难之日倚靠背信的人，好比坏牙和不稳的脚。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “倚靠背信的人”也可译作“信赖诡诈的人”。
    reason: lexical_alternative
  - marker: b
    text: “不稳的脚”也可理解为“打滑的脚”或“踉跄的脚”。
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׁן רֹעָה
  choice: 坏牙
  rationale: 直译为“坏的牙齿”，保留具体而鲜明的身体意象，指不能可靠使用、反会造成伤害的牙齿；不抽象化为“牙痛”。
- source_word: רֶגֶל מוּעָדֶת
  choice: 打滑的脚
  rationale: רֶגֶל通常指“脚”；מוּעָדֶת表示滑动、踉跄或不稳。“打滑的脚”在现代汉语中自然，并突出无法承重的意象。
- source_word: מִבְטָח
  choice: 倚靠
  rationale: 该名词表示信赖、信心或所倚靠之事。这里用动词性表达“倚靠”，使汉语句法自然，同时保留依赖某人的核心含义。
- source_word: בּוֹגֵד
  choice: 不忠的人
  rationale: 该阳性单数分词指行事诡诈、背信或不忠的人。“不忠的人”简明易懂，也保留其泛指性质；“奸诈的人”是可取的另一译法。
- source_word: בְּיוֹם צָרָה
  choice: 患难之日
  rationale: 保留“日”的时间意象，以庄重而通行的现代汉语表达困苦、危急的时刻。
theological_decisions:
- issue: בּוֹגֵד的阳性单数形式与泛指意义
  choice: 译为“不忠的人”
  alternative: “不忠的男人”或“奸诈者”
  rationale: 希伯来语形式为阳性单数，但箴言在此具有普遍代表作用。汉语“人”既不增添性别限定，也不消除其单数代表性，避免把普遍告诫误解为只针对男性。
- issue: 原文省略明示比较词和动作
  choice: 补出“就像用……咀嚼，用……行走”
  alternative: “是坏牙和打滑的脚”
  rationale: 原文以并置形成比喻：患难中倚靠不忠者，如同依靠坏牙或不稳的脚。汉语若仅作名词等同容易生硬且关系不清，因此补出意象自然蕴含的动作，但不改变两幅图像的要点。
translation_notes:
  register: 采用现代、简洁而略带箴言体庄重感的表达。“患难之日”保留原文凝练节奏；通过“用……咀嚼／用……行走”的平行结构，使两项身体意象在普通话中清楚自然。
