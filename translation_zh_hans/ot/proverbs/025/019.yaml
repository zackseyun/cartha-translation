review_pass:
  verdict: revise
  source_fidelity: 草稿准确传达了患难时信赖背信者的危险，以及坏牙和不稳之脚这两项意象。但正文补入“用……咀嚼／用……行走”，将原文的名词性并置比喻具体化为两种动作；这些动作虽可由意象联想，却非原文所明示。宜保留原文简洁的比较结构。
  naturalness: “患难之日……好比坏牙和不稳的脚”自然、简洁，并保有现代汉语可读性及箴言体的凝练。“打滑的脚”可懂，但“脚打滑”在汉语中较常描述动作或地面状况；“不稳的脚”更适合这里指不可靠的肢体意象。
  terminology: “不忠的人”在现代汉语中容易首先联想到婚姻不忠，未充分体现בּוֹגֵד的背信、诡诈和不可靠。改为“背信的人”较贴合语境，且不将原文泛指的阳性单数不必要地限为男性。
  issues:
  - severity: medium
    issue: 正文补入“用坏牙咀嚼，用打滑的脚行走”。
    rationale: 希伯来文本是“信赖背信者……〔如〕坏牙和不稳的脚”的名词性比较，并未明确说咀嚼或行走。补出的动作会缩窄原本较开放的意象，宜删除。
  - severity: medium
    issue: “不忠的人”对בּוֹגֵד的语义覆盖不足。
    rationale: 该词指背信、行事诡诈或不忠实者；汉语“不忠”常偏向婚姻或效忠关系。“背信的人”在此更清楚地表达不可依赖和违信的含义。
  - severity: low
    issue: “打滑的脚”略不如“不稳的脚”贴合汉语身体意象。
    rationale: 原词可指滑、踉跄或不稳；以“不稳的脚”为正文可保留其不可靠、不能承重的核心，其他可能性置于脚注。
  revised_text: 患难之日倚靠背信的人，好比坏牙和不稳的脚。[a][b]
