revisions:
- from: 患难之日倚靠不忠的人，就像用坏牙咀嚼，用打滑的脚行走。[a][b]
  to: 患难之日倚靠背信的人，好比坏牙和不稳的脚。[a][b]
  rationale: 修订删除原文未明示的“咀嚼”和“行走”，恢复希伯来箴言以两个名词意象构成的简洁比较；以“背信的人”更准确表达בּוֹגֵד，并以“不稳的脚”作为现代汉语中自然且语义宽度适当的主译。脚注保留可成立的词汇替代译法，且标记均有对应锚点。
