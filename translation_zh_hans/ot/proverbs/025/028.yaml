  text: עִ֣יר פְּ֭רוּצָה אֵ֣ין חוֹמָ֑ה אִ֝֗ישׁ אֲשֶׁ֤ר אֵ֖ין מַעְצָ֣ר לְ/רוּחֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/025/028.yaml
  text: A man who has no restraint over his spirit is like a city broken into[a], without a wall.
translation:
  language: zh_hans
  text: 人若不能约束自己的心[a]，就像一座被攻破、没有城墙的城。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“他的灵”，可指一个人的内在性情或脾气；也可译作“不能控制自己的脾气”或“不能自制”。
    reason: 说明 רוּחַ 的词义范围，并保留较直译及较解释性的译法。
lexical_decisions:
- source_word: עִיר
  choice: 城
  rationale: 指有防御设施的聚居城邑；“城”简洁自然，也与下文“城墙”的意象协调。
- source_word: פְּרוּצָה
  choice: 被攻破
  rationale: 该词源于“冲破、破口而入”，在这里描写城的防线已被突破；“被攻破”以现代汉语清楚呈现其失守状态。
- source_word: אֵין חוֹמָה
  choice: 没有城墙
  rationale: 直接表达城墙的缺失，保留原文所强调的毫无防护之意。
- source_word: אִישׁ
  choice: 人
  rationale: 此处虽为阳性单数，却是箴言中泛指任何人的代表性用法；现代汉语用“人”自然涵盖这一普遍意义。
- source_word: מַעְצָר
  choice: 约束
  rationale: 此名词表示抑制、管束或控制；“约束”既贴近词义，又能自然地与人的内在状态搭配。
- source_word: לְרוּחוֹ
  choice: 自己的心
  rationale: רוּחַ在此指人的内在倾向、情绪或脾气。主文用“自己的心”保持一定语义宽度，并使现代汉语表达自然；其较直译形式和可能含义在脚注中说明。
theological_decisions:
- issue: 箴言中阳性单数 אִישׁ 的代表性用法
  choice: 人
  alternative: 男人
  rationale: 原文形式为阳性单数，但此格言陈述适用于所有人的普遍原则。汉语“人”无需改变命题范围，也不会把经文误解为只针对男性。
- issue: רוּחַ 所指的内在层面
  choice: 自己的心
  alternative: 自己的灵／自己的脾气
  rationale: 此处可能侧重人的内在性情、冲动或脾气，而不是专门论述灵魂的本体。“心”在汉语中能自然承载内在意念和情绪的含义，同时脚注保留原文字面及其他可能解释。
translation_notes:
  register: 采用简洁、庄重而口语可懂的现代标准汉语。句式保留原文由无防御之城映照缺乏内在约束之人的鲜明比喻；“被攻破、没有城墙”以并列结构呈现双重失守意象。
