  text: דְּבַ֣שׁ מָ֭צָאתָ אֱכֹ֣ל דַּיֶּ֑/ךָּ פֶּן תִּ֝שְׂבָּעֶ֗/נּוּ וַ/הֲקֵֽאתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/025/016.yaml
  text: If you find honey[a], eat only enough for you, lest you become full of it and vomit it.
translation:
  language: zh_hans
  text: 你若找到蜂蜜，就只吃够你所需的[a]，免得你因吃得过饱而把它呕吐出来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“吃足够你所需的量。”
    reason: 说明 דַּיֶּךָ 可直译为“你的足量／对你足够的分量”。
lexical_decisions:
- source_word: דְּבַשׁ
  choice: 蜂蜜
  rationale: 该名词在这里直接指蜂蜜；经文本身没有明确赋予它比喻义，因此保留具体意象。
- source_word: מָצָאתָ
  choice: 你若找到
  rationale: 原文虽为第二人称阳性单数完成式，但在智慧训诲的普遍条件句中，用“若找到”自然表达一般情形。
- source_word: אֱכֹל
  choice: 吃
  rationale: 第二人称阳性单数命令式；宾语承接前文的“蜂蜜”，中文不必重复。
- source_word: דַּיֶּךָ
  choice: 只可吃适量
  rationale: 原词表示“你的足量、对你足够的分量”。“适量”以自然现代汉语传达分量上的节制，“只可”保留劝诫和限制意味。
- source_word: פֶּן
  choice: 免得
  rationale: 该连词引出应当避免的负面后果；“免得”简明地保留警戒关系。
- source_word: תִּשְׂבָּעֶנּוּ
  choice: 吃得过饱
  rationale: 该动词表示因它而饱足，代词指蜂蜜。结合上下文译为“吃得过饱”，既保留身体饱足的图像，也表达过量。
- source_word: וַהֲקֵאתוֹ
  choice: 把它吐出来
  rationale: 使役形动词在此指呕吐；“吐出来”是现代汉语中直接自然的表达，不弱化原文强烈的生理后果。
theological_decisions: []
translation_notes:
  register: 采用现代、简洁而庄重的箴言体。以“只可……免得……”呈现命令与警告之间的逻辑；不把蜂蜜解释成经文未明说的属灵或道德象征。
