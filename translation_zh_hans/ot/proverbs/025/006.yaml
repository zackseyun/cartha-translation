source:
  edition: WLC
  text: אַל תִּתְהַדַּ֥ר לִ/פְנֵי מֶ֑לֶךְ וּ/בִ/מְק֥וֹם גְּ֝דֹלִ֗ים אַֽל תַּעֲמֹֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/025/006.yaml
  text: Do not exalt yourself before a king[a], and do not stand in the place of great men.
translation:
  language: zh_hans
  text: 不要在君王面前抬高自己，也不要站在显贵的位置上。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“也不要站在显贵中间。”
    reason: 希伯来语 בִּמְקוֹם גְּדֹלִים 可指显贵所处的位置，也可理解为显贵中间。
lexical_decisions:
- source_word: תִּתְהַדַּר
  choice: 抬高自己
  rationale: 该词在此为反身意义，指使自己显得尊荣、显要，即自我抬举。“抬高自己”自然传达在君王面前自我尊崇、争取高位的警戒。
- source_word: לִפְנֵי מֶלֶךְ
  choice: 在君王面前
  rationale: לִפְנֵי 表示“在……面前、在……面前的场合”；“在君王面前”简洁自然，并保留宫廷语境。
- source_word: בִּמְקוֹם גְּדֹלִים
  choice: 在显贵的位置上
  rationale: מָקוֹם 是“地方、位置”，גְּדֹלִים 在此指社会地位高的人。“显贵的位置上”既保留位置意象，也表达身份尊崇之人的座次或地位；原文也可理解为“在显贵中间”。
- source_word: תַּעֲמֹד
  choice: 站
  rationale: עמד 的基本义为“站立”；在本语境中亦有占据、选定某一位置之意，中文保留“站”可与“位置”自然搭配，并维持原文形象。
theological_decisions:
- issue: גְּדֹלִים 的性别与社会身份表达
  choice: 显贵
  alternative: 大人物；有地位的人；显贵中间
  rationale: 希伯来语为阳性复数，但这里的重点是社会地位，并不明确限定只有男性。“显贵”在现代汉语中自然、庄重，能表达身份尊崇而不额外加入性别限定，也避免将其过度具体化为正式爵位。
translation_notes:
  register: 采用现代、庄重而易懂的箴言体。“君王”保留宫廷色彩；“抬高自己”直接表达自我尊崇；后半句保留“站”与“位置”的空间意象。
