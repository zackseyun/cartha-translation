language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כְּבֹ֣ד אֱ֭לֹהִים הַסְתֵּ֣ר דָּבָ֑ר וּ/כְבֹ֥ד מְ֝לָכִ֗ים חֲקֹ֣ר דָּבָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/025/002.yaml
  text: It is the glory of God to conceal a matter[b][a], and the glory of kings to search out a matter.
translation:
  language: zh_hans
  text: 把事情隐藏[b]，是神的荣耀[a]；把事情查明[b]，是君王的荣耀[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “荣耀”也可译作“尊荣”；上下两处相同。
    reason: lexical_alternative
  - marker: b
    text: “把事情隐藏”也可译作“掩藏一事”；“把事情查明”也可译作“探究一事”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּבֹד
  choice: 荣耀
  rationale: כָּבוֹד在两行中指与身份相称的尊贵、荣光；“荣耀”保持格言庄重的语气，也保留神与君王之间整齐的平行结构。
- source_word: אֱלֹהִים
  choice: 神
  rationale: 在以色列智慧文学的语境中，此处指独一的神；用单数的“神”准确表达上下文含义。
- source_word: הַסְתֵּר
  choice: 把事情隐藏
  rationale: 该不定式表示与神的荣耀相联的行动；“隐藏”自然、清楚，并保留有意使事不显明的含义。
- source_word: דָּבָר
  choice: 事情
  rationale: 此处可指有待处理或探究的事，而不只是言语；“事情”能自然贯通上下两行。
- source_word: וּ/כְבֹד
  choice: ；……是……的荣耀
  rationale: 希伯来语连接词并列两个诗行。中文用分号呈现协调关系，不强行译成转折。
- source_word: מְלָכִים
  choice: 君王
  rationale: 原文明确指众王；“君王”比泛称“统治者”更贴近词义，并保持庄重语体。
- source_word: חֲקֹר
  choice: 把事情查明
  rationale: 该动词表示深入查考、探究。“查明”既自然，又突出调查直到弄清的结果。
- source_word: דָּבָר
  choice: 事情
  rationale: 重复同一译词，以保留原文两行的形式平行和语义呼应。
theological_decisions:
- issue: 神的隐藏与君王的查明之间是何种关系
  choice: 将两行作为并列而有张力的陈述直译，不说明二者在道德上对立，也不声称君王所查明的必定就是神所隐藏的同一件事。
  alternative: 可理解为神圣奥秘与人间治理的对比，或理解为君王借探究揭开神所隐藏之事。
  rationale: 原文只陈述神以隐藏为荣耀、君王以查明为荣耀；译文应保留这种张力，不加入原文未明说的启示论或政治神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“把事情……，是……”的句式自然清晰；两行结构对称，用分号呈现希伯来诗歌的平行关系。
