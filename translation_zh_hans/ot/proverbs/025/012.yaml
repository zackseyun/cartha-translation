  text: Like a gold ring and an ornament of fine gold is a wise reprover to a listening ear[a].
translation:
  language: zh_hans
  text: 智慧的责备者，对肯听的耳朵来说，犹如金环和精金的饰物[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“智慧的责备者对于听见的耳朵，犹如金鼻环和精金首饰。”原文所用的两种饰物名称较为宽泛；“听见的耳朵”强调的不是单有听觉，而是乐意听取并接受劝戒。
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶזֶם
  choice: 金环
  rationale: 该词指环形饰物，可戴于鼻或耳；原文未明确佩戴部位，因此用较宽泛的“金环”，避免过度具体化。
- source_word: זָהָב
  choice: 金
  rationale: 直接表达饰环的材质，并与“环”自然组合为“金环”。
- source_word: וַחֲלִי
  choice: 和……饰物
  rationale: חֲלִי泛指装饰品或珠宝，译作“饰物”既自然，也不把它局限为项链等特定种类。
- source_word: כָתֶם
  choice: 精金
  rationale: 该词表示贵重、优质或炼净的黄金；“精金”简洁而庄重，保留其价值意味。
- source_word: מוֹכִיחַ
  choice: 责备
  rationale: 此分词指施行劝戒、纠正的人。中文以“智慧人的责备”表达其行为及来源，比生硬的“责备者”更符合现代汉语，同时保留建设性纠正的含义。
- source_word: חָכָם
  choice: 智慧人
  rationale: 在《箴言》中，“智慧人”是自然且稳定的称谓；这里修饰施行责备者。
- source_word: עַל
  choice: 落在……中
  rationale: 原义为“在……之上”，描述智慧责备与听者耳朵的关系。译作“落在肯听的耳中”保留形象，并使中文比喻自然。
- source_word: אֹזֶן שֹׁמָעַת
  choice: 肯听的耳
  rationale: 该短语不只指生理听觉，更强调愿意听取、接受劝戒。“肯听的耳”保留耳的隐喻，也明确其 receptive 含义。
