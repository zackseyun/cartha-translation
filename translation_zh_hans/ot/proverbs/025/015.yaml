  yaml_path: translation/ot/proverbs/025/015.yaml
  text: By patience a ruler may be persuaded[b][a], and a gentle tongue breaks a bone.
translation:
  language: zh_hans
  text: 以忍耐能劝服首领；柔和的舌头能折断骨头。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “柔和的舌头能折断骨头”是鲜明的比喻，表示柔和的话语能够克服刚硬或抗拒。
    reason: cultural_note
lexical_decisions:
- source_word: בְּאֹרֶךְ אַפַּיִם
  choice: 恒久忍耐
  rationale: 该希伯来语习语字面与“怒气延长”有关，表示不轻易发怒、耐心和克制。“恒久忍耐”既体现持续性，也符合现代汉语表达。
- source_word: יְפֻתֶּה
  choice: 能劝服
  rationale: 此处为被动形态，表示被说动、被争取过来。汉语采用主动式“能劝服”更自然，同时避免“诱骗”所带来的负面含义。
- source_word: קָצִין
  choice: 掌权者
  rationale: 该词泛指有权柄的首领、官长或统治者。“掌权者”保留其广义，不将所指限于某种特定职位。
- source_word: לָשׁוֹן רַכָּה
  choice: 温和的舌头
  rationale: 保留“舌头”的具体意象，同时让读者自然理解为温和的言语。
- source_word: תִּשְׁבָּר גָּרֶם
  choice: 能折断骨头
  rationale: 保留原文反常而有力的比喻：柔和言语竟能胜过坚硬的阻力；“骨头”对应原文单数集合意象。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。前后两句以“恒久忍耐”与“温和的舌头”并列，保留箴言中柔能克刚的张力和“折断骨头”的具体意象。
