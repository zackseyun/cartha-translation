  yaml_path: translation/ot/proverbs/025/011.yaml
  text: Like apples of gold in settings of silver is a word spoken at the right time[a][b][c].
translation:
  language: zh_hans
  text: 一句说得合宜[c]的话，如同银质雕饰[b]中的金苹果[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的希伯来词传统上译作“苹果”，但它所指的古代果实未必与现代苹果完全相同。
    reason: cultural_note
  - marker: b
    text: “银质雕饰”也可译作“银质镂饰”“银质精工饰物”或“银质雕刻工艺”。原词所指的具体形制不能确定。
    reason: lexical_alternative
  - marker: c
    text: “说得合宜”所译的希伯来语字面为“说在它的轮子上”，可能指话说得恰当、切合场合或正逢其时。
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּפּוּחֵי
  choice: 苹果
  rationale: תַּפּוּחַ通常指一种芳香果实，传统上译作“苹果”；古代所指的具体果种不能完全确定，因此正文采用最易识别的“苹果”，并以脚注保留不确定性。
- source_word: זָהָב
  choice: 金
  rationale: זָהָב明确指黄金；与“苹果”组合为“金苹果”，保留原文鲜明的工艺品意象。
- source_word: בְּמַשְׂכִּיּוֹת כָּסֶף
  choice: 嵌在银饰中
  rationale: מַשְׂכִּיּוֹת指精制的装饰性工艺，确切形态不明，可能是雕饰、镂空细工或承托金果的银质构件。“嵌在银饰中”以自然汉语表达金与银相配的图像，同时用脚注保留其他可能。
- source_word: דָּבָר דָּבֻר
  choice: 一句说得……的话
  rationale: דָּבָר在此语境中指所说的话，דָּבֻר为被动形式。“一句说得……的话”既体现言语行为，也保持箴言的简洁。
- source_word: עַל אָפְנָיו
  choice: 合宜
  rationale: 该罕见表达字面近于“在它的轮子上”，具体习语含义有争议，通常表达话语与场合、时机或方式相称。“合宜”能涵盖适切与适时，避免只限定为时间意义。
theological_decisions: []
translation_notes:
  register: 采用现代、凝练而庄重的箴言体。依照希伯来语次序先呈现金银工艺的比喻，再点明合宜言语；“正如”使汉语比较关系清楚。“合宜”刻意保留方式、场合和时机之间的语义张力。
