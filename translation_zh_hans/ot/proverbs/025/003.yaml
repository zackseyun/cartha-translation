id: PRO.25.3
reference: Proverbs 25:3
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: שָׁמַ֣יִם לָ֭/רוּם וָ/אָ֣רֶץ לָ/עֹ֑מֶק וְ/לֵ֥ב מְ֝לָכִ֗ים אֵ֣ין חֵֽקֶר׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/025/003.yaml
  text: The heavens for height[a], and the earth for depth, and the heart of kings—there is no searching out.
translation:
  language: zh_hans
  text: 天有多高，地有多深，君王的心也同样无法测透。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“无从考究”或“无法穷究”。希伯来文直译为“没有查究”。
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַיִם לָרוּם
  choice: 天有多高
  rationale: שָׁמַיִם在此与“地”构成宇宙性的对举；לָרוּם表示就高度而言。译作“天有多高”既自然，也保留原文对高度难以穷尽的表达。
- source_word: וָאָרֶץ לָעֹמֶק
  choice: 地有多深
  rationale: אֶרֶץ在此指“大地”，不是局部的“土地”；לָעֹמֶק与前句לָרוּם平行，表示就深度而言。
- source_word: לֵב מְלָכִים
  choice: 君王的心
  rationale: לֵב涵盖思想、意图和内在倾向；保留“心”的意象，不缩窄为单纯的理智。מְלָכִים特指众君王，汉语类称可自然译作“君王的心”。
- source_word: אֵין חֵקֶר
  choice: 无法测透
  rationale: 该短语直指不能查究、探测到底。现代汉语“无法测透”简洁传达不可穷究之意，并与前面的高、深意象相呼应。
- source_word: וְ־
  choice: 也同样
  rationale: 原文以连接词把君王之心与天之高、地之深并列。汉语补出“也同样”，使隐含的比较关系清楚而不改变命题。
theological_decisions:
- issue: “无法测透”主要修饰的范围
  choice: 在正文中直接落在“君王的心”上，同时借“也同样”使其呼应天的高度和地的深度
  alternative: 把“无法测透”明确同时用于天、地和君王之心三者
  rationale: 希伯来语אֵין חֵקֶר在句法上紧接末项“君王的心”，但全句的平行结构使前两项也带有不可穷测的意味。译文保留这种主次关系，不将范围绝对化。
translation_notes:
  register: 采用现代、凝练而庄重的箴言体。“天有多高，地有多深”比机械的“天之高、地之深”更符合当代普通话；“君王”保留王室语境，“测透”兼具探究与深度意象。
