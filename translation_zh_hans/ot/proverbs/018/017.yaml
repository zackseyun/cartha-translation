  text: צַדִּ֣יק הָ/רִאשׁ֣וֹן בְּ/רִיב֑/וֹ יבא רֵ֝עֵ֗/הוּ וַ/חֲקָרֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/018/017.yaml
  text: The first to present his case seems right[a], until his neighbor comes and examines him.
translation:
  language: zh_hans
  text: 先陈述案情的，看似有理[a]；等到另一方来，就会查问他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“争讼中先发言的，显得有理；直到对方来查问他。”
    reason: 保留צַדִּיק可表达“有理”，以及בְּרִיבוֹ较直译为“在争讼中”的可能性，并显明“看似”是由后半句语境所表达。
lexical_decisions:
- source_word: צַדִּיק
  choice: 看似有理
  rationale: 该词通常表示“公义、正直”或“有理”；在争讼语境中，首位发言者是在受到查问前显得占理。“看似有理”自然表达箴言所强调的初步印象，同时不把最终裁断提前确定。
- source_word: הָרִאשׁוֹן
  choice: 先……的
  rationale: 指争议中首先出面或首先发言的一方。汉语用“先陈述案情的”简洁呈现双方先后次序。
- source_word: בְּרִיבוֹ
  choice: 陈述案情
  rationale: רִיב可指争执、争讼或案件。结合上下文，“陈述案情”体现司法或争议陈说的语境，又不局限于正式诉讼。
- source_word: יבא
  choice: 来
  rationale: 该动词直义为“来”。首句在汉语中融入“先陈述案情的”，次句明确保留“来”，呈现另一方随后到场的动作。
- source_word: רֵעֵהוּ
  choice: 另一方
  rationale: רֵעַ通常可指同伴、邻舍或对方；此处处于争讼语境，“另一方”最自然，也避免把对立当事人误解为朋友或普通邻居。
- source_word: וַחֲקָרוֹ
  choice: 查问他
  rationale: חקר表示查究、审察、探查。“查问他”既包含对其说法作深入检验，也保留希伯来文以人物为受词的表达；比现代法庭术语“盘问”更宽泛。
theological_decisions: []
translation_notes:
  register: 采用现代、简洁而庄重的箴言体。分号突出前后转折；“案情”“另一方”“查问”使争讼场景清楚，同时避免过度技术化的法庭用语。
