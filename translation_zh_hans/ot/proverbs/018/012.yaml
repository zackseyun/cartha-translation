  text: לִ/פְנֵי שֶׁ֭בֶר יִגְבַּ֣הּ לֵב אִ֑ישׁ וְ/לִ/פְנֵ֖י כָב֣וֹד עֲנָוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/018/012.yaml
  text: Before destruction a man's heart is haughty[a], and before honor comes humility.
translation:
  language: zh_hans
  text: 败亡之前，人心高傲；谦卑在尊荣之前。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִפְנֵי
  choice: 以先
  rationale: 此处是时间性用法，表示某事发生之前；两分句同样译为“以先”，保留原文整齐的平行结构和箴言语体。
- source_word: שֶׁבֶר
  choice: 败亡
  rationale: 该词在智慧文学中可指崩溃、毁灭或败落，而非字面的断裂。“败亡”自然地表达严重的倾覆，也与下句的“尊荣”形成鲜明对照。
- source_word: יִגְבַּהּ
  choice: 高傲
  rationale: 动词本义为“高”，与“心”连用时表达自高、骄傲。“高傲”保留其空间隐喻，同时准确传达伦理含义。
- source_word: לֵב אִישׁ
  choice: 人心
  rationale: 原文直译为“一个男人的心”，但在箴言中 אִישׁ 为泛指单数。现代汉语“人心”可自然表达普遍适用于人的心态，不额外限定男性。
- source_word: כָבוֹד
  choice: 尊荣
  rationale: 此处指受人尊重、地位提升的荣誉，而非专指神圣荣耀。“尊荣”庄重且适合与“败亡”对举。
- source_word: עֲנָוָה
  choice: 谦卑
  rationale: 该名词表示低微、谦逊的状态或品格。“谦卑”是现代中文圣经及一般宗教伦理语境中清楚自然的表达。
theological_decisions:
- issue: אִישׁ 在箴言中的泛指阳性单数
  choice: 人心
  alternative: 男人的心
  rationale: 这里陈述普遍的人生规律，并非只论男性。汉语通常不靠阳性形式表达泛指，因此译作“人心”既忠于所指范围，也避免误导为仅限男性。
- issue: 第二分句是否补出结果关系
  choice: 必有谦卑
  alternative: 谦卑在先
  rationale: 原文为省略系词的名词结构，字面近于“尊荣之前是谦卑”。补入“必有”使现代汉语完整自然，并表达谦卑先于尊荣的箴言性规律，但不把它扩展成机械的因果保证。
translation_notes:
  register: 采用凝练、庄重而易懂的现代标准汉语，以分号呈现希伯来诗歌的两分句对照，并以重复的“以先”保留原文平行。未设脚注，因为泛指阳性在汉语中用“人心”即可无损而自然地传达。
