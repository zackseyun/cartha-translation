  text: A fool does not delight in understanding[a], but only in revealing his heart.
translation:
  language: zh_hans
  text: 愚昧人不喜爱明悟，只喜爱显露自己的心思。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“却只喜爱显露自己内心的想法。”这里的“心”指人的内在思想、意向和倾向，不只是情感。
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחְפֹּץ
  choice: 喜爱
  rationale: 该词可表示喜悦、乐意或渴望；“喜爱”既保留意愿和乐在其中的含义，也符合现代汉语箴言式表达。
- source_word: כְּסִיל
  choice: 愚昧人
  rationale: 《箴言》中这是固定的智慧文学用语，指在道德和认识上顽梗的人，并非单指智力不足；“愚昧人”比“笨人”更准确、庄重。
- source_word: תְבוּנָה
  choice: 明悟
  rationale: 该词指理解力、洞察力和辨别力；“明悟”在此兼顾理解与洞察，也与下半句的自我显露形成自然对照。
- source_word: כִּי אִם
  choice: 只
  rationale: 这一结构在否定句后引出排他性的强烈对比；“不……，只……”简洁地传达“不是前者，而唯独是后者”的语气。
- source_word: בְּהִתְגַּלּוֹת
  choice: 显露
  rationale: 源自动词 גלה，含揭开、披露之意；“显露”保留其使内在之物显明出来的意象，同时不预先判定是主动表达还是自我暴露。
- source_word: לִבּוֹ
  choice: 自己的心思
  rationale: 希伯来语“心”常涵盖思想、意向和欲望，不仅指情感；正文用“心思”使现代读者自然理解其内在思想的含义。
