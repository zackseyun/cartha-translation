base_translation:
  language: en
  yaml_path: translation/ot/proverbs/018/013.yaml
  text: He who answers a matter before he hears it[a], it is folly and shame to him.
translation:
  language: zh_hans
  text: 人若还未听取事情就作答，这就是他的愚昧和羞耻。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מֵשִׁיב
  choice: 回答
  rationale: 此处是 שוב 的使役分词，按习用义表示“回答、回应”；“回答”简洁自然，适合箴言语体。
- source_word: דָּבָר
  choice: 事情
  rationale: דָּבָר 语义宽泛，可指话、事情或案件；正文用“事情”保留其普遍适用性，不局限于一句话。
- source_word: בְּטֶרֶם יִשְׁמָע
  choice: 未听完就
  rationale: 希伯来文直义为“在听见以前”。汉语“未听完就”自然表达尚未充分听取便作答的先后关系，同时脚注保留更直译的可能。
- source_word: אִוֶּלֶת
  choice: 愚昧
  rationale: 这是《箴言》中的典型智慧文学用语；“愚昧”兼具认知与道德层面的贬义。
- source_word: לוֹ וּכְלִמָּה
  choice: 他的……和羞耻
  rationale: לוֹ 表示此举归于或带给那人；כְלִמָּה 指羞耻、耻辱。“他的愚昧和羞耻”紧凑地保留原文判断。
