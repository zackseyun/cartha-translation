  text: מִ/פְּרִ֣י פִי אִ֭ישׁ תִּשְׂבַּ֣ע בִּטְנ֑/וֹ תְּבוּאַ֖ת שְׂפָתָ֣י/ו יִשְׂבָּֽע־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/018/020.yaml
  text: From the fruit of a man's mouth his stomach is satisfied[a]; he is satisfied by the produce of his lips.
translation:
  language: zh_hans
  text: 人的肚腹因他口中所结的果子得饱足；他因嘴唇的出产得饱足[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“人的肚腹凭他口中所结的果子得充满；他凭嘴唇的出产得充满。”
    reason: 介词 מִן 可表达来源或凭借；“得充满”是 שׂבע（饱足、满足）的可行词义替代。
lexical_decisions:
- source_word: מִפְּרִי
  choice: 因……所结的果子
  rationale: 介词 מִן 在此可表达来源或凭借；用“因”保留言语产生后果的关系，“所结的果子”保留果实隐喻，并使现代汉语自然。
- source_word: פִי
  choice: 口中
  rationale: פֶּה 本义为“口”，此处借指言语；译作“口中”既保留身体意象，也符合汉语表达。
- source_word: אִישׁ
  choice: 人
  rationale: אִישׁ 为阳性单数，但在箴言中作泛指。现代汉语“人”天然不标性别，既准确传达泛指，也不增添原文没有的限定。
- source_word: תִּשְׂבַּע / יִשְׂבָּע
  choice: 得以饱足
  rationale: שׂבע 意为“饱足、满足”。两处采用同一译法，以保留原文的词语重复和诗句强调；现在时态体现普遍性的箴言陈述。
- source_word: בִּטְנוֹ
  choice: 肚腹
  rationale: בֶּטֶן 可指腹部、肚腹；这里保留身体隐喻，又可暗示人承受自己言语所带来的结果。“肚腹”较庄重且易懂。
- source_word: תְּבוּאַת
  choice: 收成
  rationale: תְּבוּאָה 指出产、收益或收成。“收成”保留农业隐喻，并与上句的“果子”形成自然对应。
- source_word: שְׂפָתָיו
  choice: 嘴唇
  rationale: שָׂפָה 本义为“嘴唇”，此处转指言语。保留字面意象，以呈现其与“口”的平行结构。
theological_decisions:
- issue: 言语之果与饱足的性质
  choice: 不明确限定为奖赏、惩罚或单纯物质所得
  alternative: 解释为善言必带来福报，或解释为人必承受自己言语的一切后果
  rationale: 本节本身只陈述人因口舌的产出而饱足；下文可能拓展后果的正反两面，但本节没有明说其道德性质，因此保留原文张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留“果子—收成”“口—嘴唇”以及两次“饱足”的诗性平行；避免把农业和身体隐喻解释性改写为抽象的“言语后果”。
