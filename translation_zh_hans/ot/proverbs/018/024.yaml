  text: אִ֣ישׁ רֵ֭עִים לְ/הִתְרֹעֵ֑עַ וְ/יֵ֥שׁ אֹ֝הֵ֗ב דָּבֵ֥ק מֵ/אָֽח׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/018/024.yaml
  text: A man of many companions may come to ruin[a], but there is a friend who sticks closer than a brother.
translation:
  language: zh_hans
  text: 朋友众多的人可能落得破败[a]；但有一位朋友，比兄弟更亲近。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“朋友众多的人，应当显出友好。”希伯来语动词 לְהִתְרֹעֵעַ 含义难定，历来有不止一种理解。
    reason: alternative_reading
lexical_decisions:
- source_word: אִישׁ
  choice: 人
  rationale: 希伯来语为阳性单数，在箴言中可作代表性用法；现代汉语用“人”自然涵盖一般情况，又不改变其单数格言表达。
- source_word: רֵעִים
  choice: 朋友众多
  rationale: רֵעִים可指朋友、伙伴或交往之人。此处译作“朋友众多”，保持第一分句的复数，并与第二分句那位忠诚的“朋友”形成多与一、泛交与至交的对照。
- source_word: לְהִתְרֹעֵעַ
  choice: 可能落得破败
  rationale: 此词形意义困难，既可联系“破碎、败坏”之意，也有人理解为“与人交往、显出友好”。正文采用前一理解，并以“可能”避免把箴言说成毫无例外的必然规律；另一传统理解收入脚注。
- source_word: וְיֵשׁ
  choice: 但有
  rationale: 连接词在上下句之间表达鲜明对照，现代汉语用“但”最自然。
- source_word: אֹהֵב
  choice: 一位朋友
  rationale: 该词字面为“爱人的人”，在此智慧文学语境中指真诚相爱的朋友。“一位”凸显其与上句众多朋友的对比。
- source_word: דָּבֵק
  choice: 更亲近
  rationale: דבק描写紧紧依附、不离不弃。结合人际关系语境，“更亲近”自然表达其紧密联系；忠贞不离的意象仍由全句对比传达。
- source_word: מֵאָח
  choice: 比兄弟
  rationale: 介词מִן在此表示比较，意为这种朋友的亲近程度甚至超过兄弟。
