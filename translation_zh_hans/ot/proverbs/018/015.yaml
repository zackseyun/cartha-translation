base_translation:
  language: en
  yaml_path: translation/ot/proverbs/018/015.yaml
  text: An understanding heart acquires knowledge[b][a], and the ear of the wise seeks knowledge.
translation:
  language: zh_hans
  text: 有悟性的心获取知识[a]；智慧人的耳朵[b]寻求知识。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“明辨的心获得知识。”
    reason: lexical_alternative
  - marker: b
    text: 原文作单数“耳朵”，是集合性、比喻性的说法，表示乐于聆听并领受教导。
    reason: cultural_note
lexical_decisions:
- source_word: לֵב
  choice: 心
  rationale: 希伯来智慧文学中的“心”不仅指情感，也指思考、判断和意志的内在官能；保留“心”的意象，同时符合现代汉语表达。
- source_word: נָבוֹן
  choice: 有悟性的
  rationale: 该词修饰“心”，表示能够领悟、辨明事理；“有悟性的心”保留原文结构，也传达明辨能力。
- source_word: יִקְנֶה
  choice: 获取
  rationale: קנה在此表示取得、获得，并含有主动求取之意；“获取”避免不必要的买卖色彩。
- source_word: דָּעַת
  choice: 知识
  rationale: 该词在箴言中常指通过学习和领悟所得的知识；两分句均译作“知识”，保留原文的重复和平行。
- source_word: אֹזֶן
  choice: 耳朵
  rationale: 保留具体的身体意象；此处以“耳朵”比喻听取教导、领受知识的能力和态度。
- source_word: חֲכָמִים
  choice: 智慧人
  rationale: 原文阳性复数在智慧文学中泛指有智慧的人，并非只指男性；“智慧人”简洁且不缩窄所指。
- source_word: תְּבַקֶּשׁ
  choice: 寻求
  rationale: 该动词表达主动寻找、追求；“寻求”与上句的“获取”构成自然的语义平行。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。译文保留“心”与“耳朵”的希伯来诗歌意象，以及两分句重复“知识”所形成的平行结构。
