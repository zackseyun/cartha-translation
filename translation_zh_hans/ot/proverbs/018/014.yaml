revisions:
- from: 人的心灵能支撑他度过疾病[a]；心灵若被压垮[b]，谁能承受呢？
  to: 人的心灵能支撑他熬过病痛[a]；但被压垮的心灵[b]，谁能承受呢？
  rationale: 修订仅处理汉语搭配、脚注表述和原文句法的细微对应，未改变经文的核心意思。前半句仍表达人的内在精神能在疾病中支撑他；后半句仍保留“谁能承受”的修辞问题，未擅自解释为医治、使其振作或某一特定神学结论。
