  text: רֽוּחַ אִ֭ישׁ יְכַלְכֵּ֣ל מַחֲלֵ֑/הוּ וְ/ר֥וּחַ נְ֝כֵאָ֗ה מִ֣י יִשָּׂאֶֽ/נָּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/018/014.yaml
  text: A man's spirit can sustain him in sickness[b][a], but a crushed spirit—who can bear it?
translation:
  language: zh_hans
  text: 人的心灵能支撑他熬过病痛[a]；但被压垮的心灵[b]，谁能承受呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“人的心灵能承受他的疾病”或“人的心灵能在他患病时支撑他”。
    reason: lexical_alternative
  - marker: b
    text: “被压垮的”也可译作“破碎的”或“受创的”。
    reason: lexical_alternative
lexical_decisions:
- source_word: רוּחַ
  choice: 心灵
  rationale: 本节两次出现，指人的内在生命与精神力量；前半句能支撑患病者，后半句又可被压垮，因此不是字面的“风”或“气息”。
- source_word: אִישׁ
  choice: 人
  rationale: 希伯来语为阳性单数，但箴言在这里以个体代表一般人；现代汉语用“人”自然地保留这种普遍适用性。
- source_word: יְכַלְכֵּל
  choice: 能支撑……度过
  rationale: 该动词有供养、维持、支撑之意；与疾病搭配时，“支撑他度过”清楚表达内在力量使人熬过患病处境的能力。
- source_word: מַחֲלֵהוּ
  choice: 疾病
  rationale: 名词指疾病、病患，并带第三人称阳性单数后缀。译文以“支撑他度过疾病”自然体现“他的疾病”这一关系。
- source_word: נְכֵאָה
  choice: 被压垮
  rationale: 该词可指受打击、破碎或被压碎；“被压垮”在现代汉语中形象而自然，也与前半句“支撑”形成鲜明对照。
- source_word: מִי
  choice: 谁
  rationale: 保留原文的反问形式，不把其隐含的能力意义展开为解释性陈述。
- source_word: יִשָּׂאֶנָּה
  choice: 能承受呢
  rationale: נשא可指承担、负荷或忍受；这里的阴性后缀回指阴性名词“心灵”。汉语用“承受”自然表达对这种心灵状态的承担，同时保留反问张力。
theological_decisions:
- issue: “被压垮的心灵”由谁承受，以及“承受”的对象
  choice: 保留“谁能承受呢？”这一简洁反问
  alternative: 明确译成“谁能使它振作起来？”或“谁能忍受这种痛苦？”
  rationale: 原文 נשא 的语义可涵盖承担、承载，也可能令人联想到扶起，但没有明说主体或具体方式；不将其解释为医治、振作或某种特定属灵主张，可保存原文的含混与张力。
translation_notes:
  register: 采用现代、庄重而易懂的箴言体。上下两句重复“心灵”，以保留希伯来原文的关键词呼应；用分号和反问呈现鲜明对照。所有脚注标记均置于相关词句之后。
