  text: Even one who is slack in his work is brother to a master of destruction[a].
translation:
  language: zh_hans
  text: 连在工作上懈怠的人，也是施行毁坏之人的弟兄。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“也是以毁坏为特征之人的弟兄。”希伯来语短语可指施行毁坏的人，也可指以毁坏为特征的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: 也
  rationale: 此处带有递进兼强调作用，把工作懈怠者也归入造成毁坏的一类；“也”在现代汉语中自然，并保留这种出人意料的并列。
- source_word: מִתְרַפֶּה
  choice: 懈怠的人
  rationale: רפה 的 Hitpael 分词表示任由自己松懈、疏于尽责，而不只是能力不足；“懈怠的人”保留了描述一类人的分词性质。
- source_word: בִמְלַאכְתּוֹ
  choice: 工作
  rationale: מְלָאכָה 可指工作、劳作或任务；“工作”简明自然，并保留懈怠所发生的范围。
- source_word: אָח הוּא
  choice: 是……的弟兄
  rationale: 原文用亲属关系比喻二者性质相近、同属一类；直译为“弟兄”可保留箴言鲜明的具体意象。
- source_word: לְבַעַל מַשְׁחִית
  choice: 毁灭者
  rationale: בַעַל 可表示具有某种特征的人，而 מַשְׁחִית 可理解为施行毁坏者；正文采用自然凝练的“毁灭者”，同时以脚注保留该结构也可能指“以毁灭为特征的人”。
theological_decisions: []
translation_notes:
  register: 采用现代、简洁而庄重的箴言体。“懈怠”准确表达失职性的松懈；保留“弟兄”这一希伯来语亲属比喻，不将其抽象化为“同类”。
