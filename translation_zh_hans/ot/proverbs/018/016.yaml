  text: מַתָּ֣ן אָ֭דָם יַרְחִ֣יב ל֑/וֹ וְ/לִ/פְנֵ֖י גְדֹלִ֣ים יַנְחֶֽ/נּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/018/016.yaml
  text: A man's gift makes room for him[b][a], and brings him before great men.
translation:
  language: zh_hans
  text: 人的礼物为他开路[a]，把他带到权贵面前[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “开路”直译为“使地方宽阔”。
    reason: lexical_alternative
  - marker: b
    text: “权贵”也可译为“显要人物”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מַתָּן
  choice: 礼物
  rationale: 该名词指赠礼、礼品；“礼物”是现代汉语中自然且宽泛的对应词，也保留本箴言所说礼物带来机会的含义。
- source_word: אָדָם
  choice: 人
  rationale: 这里是单数泛指个体的人。汉语“人”无需标明性别，既符合原文的泛指用法，也比“男人”更准确自然。
- source_word: יַרְחִיב לוֹ
  choice: 为他开路
  rationale: רחב 的使役形本义是“使宽阔”。“为他开路”保留道路变宽、通路开启的意象，并自然表达获得机会或门路。
- source_word: וְלִפְנֵי גְדֹלִים
  choice: 到权贵面前
  rationale: לִפְנֵי 表示“在……面前”；גְדֹלִים 在此指地位显要、有权势的人。“权贵”简洁地传达其社会地位含义。
- source_word: יַנְחֶנּוּ
  choice: 把他带到
  rationale: נחה 的使役形可指引领、带领；结合“到……面前”的语境，“把他带到”在汉语中最顺畅，并保留礼物作为主语所产生的结果。
