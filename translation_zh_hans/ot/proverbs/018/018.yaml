  text: מִ֭דְיָנִים יַשְׁבִּ֣ית הַ/גּוֹרָ֑ל וּ/בֵ֖ין עֲצוּמִ֣ים יַפְרִֽיד׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/018/018.yaml
  text: The lot puts an end to disputes[a], and separates between the mighty.
translation:
  language: zh_hans
  text: 抽签能止息争端，也能使强者彼此分开[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“抽签能解决争端，在有权势的人之间作出裁断。”
    reason: “止息”可按结果译为“解决”；“使……分开”在裁决争端的语境中也可理解为“在……之间作出裁断”。
lexical_decisions:
- source_word: מִדְיָנִים
  choice: 争端
  rationale: 该复数名词可指争执、纷争或诉讼性质的纠纷；“争端”在现代汉语中自然，也保留了较宽的语义范围。
- source_word: יַשְׁבִּית
  choice: 能止息
  rationale: 这是שׁבת的使役词形，意为“使……停止”；“能止息”既体现使役意义，也符合箴言的凝练语体。
- source_word: הַגּוֹרָל
  choice: 抽签
  rationale: גּוֹרָל指用于分配或裁决的签；汉语用“抽签”比直译“签”更清楚地表达这一决断方式。
- source_word: וּבֵין
  choice: 也能使……彼此
  rationale: בֵּין标明被分开或区分的双方；“彼此”以自然汉语表达“在……之间”的关系。
- source_word: עֲצוּמִים
  choice: 强者
  rationale: 该形容词作名词用，指强壮或有权势的人；“强者”简洁，并且不把其含义限定为政治权势。
- source_word: יַפְרִיד
  choice: 使……分开
  rationale: 这是פרד的使役词形，基本义为“使分开、使分离”。正文保留其具体意象，不直接将司法语境中的引申义写成“裁断”。
theological_decisions:
- issue: 抽签在强者之间所起作用的表述
  choice: 使强者彼此分开
  alternative: 在有权势的人之间作出裁断
  rationale: 希伯来文יַפְרִיד的直接意义是“使分开”，但在以抽签解决争端的语境中也可能含有裁决双方之意。正文保留具体措辞，脚注说明语境性译法，不把经文处理成对抽签之神学机制的额外断言。
translation_notes:
  register: 采用现代、凝练而庄重的箴言体。“抽签”便于普通读者理解古代以签作决定的做法；正文保留希伯来文“止息”和“使分开”的具体表达，脚注提供更偏语境解释的译法。
