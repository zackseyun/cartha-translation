  text: מָ֣וֶת וְ֭/חַיִּים בְּ/יַד לָשׁ֑וֹן וְ֝/אֹהֲבֶ֗י/הָ יֹאכַ֥ל פִּרְיָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/018/021.yaml
  text: Death and life are in the power of the tongue[b][a], and those who love it will eat its fruit.
translation:
  language: zh_hans
  text: 生死都在舌头的掌控之中[a]；喜爱它的人必吃它所结的果子。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“生死都在舌头的手中。”这里“在……手中”表示处于其权势或掌控之下。
    reason: lexical_alternative
  - marker: b
    text: “喜爱它的人”很可能指喜爱使用舌头的人；无论言语带来死亡还是生命，他们都要承受自己言语所结的果子。
    reason: cultural_note
lexical_decisions:
- source_word: מָוֶת וְחַיִּים
  choice: 生死
  rationale: 希伯来文以“死亡”和“生命”构成鲜明对举；中文用凝练自然的“生死”保留这一对照。
- source_word: בְּיַד
  choice: 在……的权下
  rationale: 字面为“在……手中”，在此表示权势或支配力；“在……的权下”既传达惯用义，也保留权力意象。
- source_word: לָשׁוֹן
  choice: 舌头
  rationale: 保留身体部位的具体比喻，以舌头代指言语及说话的能力，不抽象化为“言语”。
- source_word: אֹהֲבֶיהָ
  choice: 喜爱它的人
  rationale: 阴性单数后缀最自然地回指“舌头”；直译保留“喜爱”究竟指爱说话、爱使用舌头，还是迷恋其力量的含混性。
- source_word: יֹאכַל
  choice: 必吃
  rationale: 保留原文“吃”的结果性比喻；“必”适合表达箴言所陈述的必然后果。
- source_word: פִּרְיָהּ
  choice: 它所结的果子
  rationale: 保留“果子”这一农业隐喻，表示言语产生的结果；“所结的”使现代中文关系清楚而不解释过度。
theological_decisions:
- issue: “喜爱它的人”所指的行为范围
  choice: 正文保留“喜爱它”的含混表达
  alternative: 译作“爱说话的人”或“爱使用舌头的人”
  rationale: 原文没有明确限定为多言、善言或恶言；上下句同时涵盖死亡与生命，故不应把意义收窄为单一的道德评价。
translation_notes:
  register: 采用现代、凝练而庄重的箴言体。“舌头”“吃……果子”均保留原文的具体意象；标点划分两个平衡分句。所有脚注标记均置于正文相应位置。
