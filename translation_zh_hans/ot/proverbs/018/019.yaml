base_translation:
  language: en
  yaml_path: translation/ot/proverbs/018/019.yaml
  text: A brother offended is harder to win than a fortified city[b][a], and quarrels are like the bars of a citadel.
translation:
  language: zh_hans
  text: 受了冒犯的兄弟，比坚城更难挽回[a]；争端如堡垒[b]的门闩。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作：“受了亏负的兄弟，比坚城更难挽回。”希伯来文的分词既可强调受到冒犯，也可强调受到亏负；原句十分简略，“更难挽回”是按上下文补出的意思。
    reason: lexical_and_syntactic_alternative
  - marker: b
    text: “堡垒”也可译作“宫殿”。原词兼有这两种含义；这里的防御意象使“堡垒”更为贴切。
    reason: lexical_alternative
lexical_decisions:
- source_word: אָח
  choice: 兄弟
  rationale: 本义为“兄弟”，也可泛指关系亲近的人；正文保留希伯来的亲属意象，不扩大译为“亲友”。
- source_word: נִפְשָׁע
  choice: 受了冒犯的
  rationale: 该分词源自 פשע，在这里很可能指因受冒犯或亏负而关系破裂的人。“受了冒犯的”保留其关系层面的含义，同时不把它限定为法律意义上的受害。
- source_word: מִקִּרְיַת עֹז
  choice: 比坚城
  rationale: 介词 מִן 在此用于比较；“坚城”简洁自然，也保留“有力量、防守严密的城”这一意象。
- source_word: וּמְדֹנִים
  choice: 争端
  rationale: 复数名词表示争执、纷争或冲突；“争端”既能概括反复的争执，也适合本节庄重凝练的箴言体。
- source_word: כִּבְרִיחַ
  choice: 如……的门闩
  rationale: בְּרִיחַ 指固定城门或大门的横闩。希伯来文为单数，译作“门闩”既准确，也清楚传达阻隔与封闭的比喻。
- source_word: אַרְמוֹן
  choice: 堡垒
  rationale: 该词可指宫殿，也可指设防的高大建筑。上下文连续使用坚城和门闩的防御意象，因此正文采用“堡垒”，同时在脚注保留“宫殿”的词义可能。
theological_decisions: []
translation_notes:
  register: 采用现代、凝练而庄重的箴言体。“受了冒犯”比单说“生气”更贴近关系被破坏的语义；“挽回”明示希伯来文省略而由比较结构暗含的关系性谓语。两句以“坚城—堡垒—门闩”的连续意象表现隔阂之难以突破。
