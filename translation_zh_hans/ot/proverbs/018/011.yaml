  text: ה֣וֹן עָ֭שִׁיר קִרְיַ֣ת עֻזּ֑/וֹ וּ/כְ/חוֹמָ֥ה נִ֝שְׂגָּבָ֗ה בְּ/מַשְׂכִּיתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/018/011.yaml
  text: A rich man's wealth is his strong city[a], and like a high wall in his imagination.
translation:
  language: zh_hans
  text: 富人的财富是他的坚城；在他心目中[a]，它又像一堵高墙。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“在他想象中”、“按他的看法”。希伯来词可指心中的图景、形象或看待事物的方式。
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹן
  choice: 财富
  rationale: 指物质财富或财产；“财富”是现代汉语中自然、概括性强的表达。
- source_word: עָשִׁיר
  choice: 富人
  rationale: 该形容词在此作名词使用，指富有的人；“富人”简洁自然，也保留了单数泛指的作用。
- source_word: קִרְיַת עֻזּוֹ
  choice: 他的坚城
  rationale: 原文直译为“他的力量之城”，意指可供防御的坚固城邑；“坚城”保留城市防御的比喻，又符合凝练的箴言体。
- source_word: וּכְחוֹמָה נִשְׂגָּבָה
  choice: 犹如高墙
  rationale: חוֹמָה意为城墙，נִשְׂגָּבָה表示高耸，并可暗含难以攻取；“高墙”保留原文形象，不把隐含意义过度明说。
- source_word: בְּמַשְׂכִּיתוֹ
  choice: 在他想象中
  rationale: מַשְׂכִּית可指形象、图像或心中的图景；此处表达富人如何看待自己的财富。“在他想象中”既呈现主观认知，也不过度加入“自负”等贬义判断。
theological_decisions: []
translation_notes:
  register: 采用现代、凝练而庄重的箴言体。以分号呈现两幅平行意象，并将“在他想象中”前置于第二分句，使财富如高墙的主观性质在汉语中清楚而不失原文张力。
