base_translation:
  language: en
  yaml_path: translation/ot/proverbs/018/005.yaml
  text: To show partiality to the wicked is not good[b][a], nor to deprive the righteous of justice.
translation:
  language: zh_hans
  text: 偏袒恶人并不好[a]；在审判中使义人受屈[b]，也不好。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “偏袒”原文直译为“抬起恶人的脸”，是指徇私偏待。
    reason: lexical_alternative
  - marker: b
    text: 或译：“在审判中屈枉义人。”
    reason: alternative_reading
lexical_decisions:
- source_word: שְׂאֵת פְּנֵי
  choice: 偏袒
  rationale: 这是字面为“抬起……的脸”的希伯来语习语；在司法语境中指徇私、偏待。“偏袒”以自然简洁的现代汉语表达其含义。
- source_word: רָשָׁע
  choice: 恶人
  rationale: 此处单数形容词作名词使用，表示邪恶的人；“恶人”保留其道德与司法层面的宽泛含义，不限缩为已被定罪者。
- source_word: לֹא טוֹב
  choice: 并不好
  rationale: 贴近原文直接的道德判断，同时符合现代汉语箴言式表达。
- source_word: לְהַטּוֹת
  choice: 使……受屈
  rationale: 该动词本义为“使偏离、转开”，在司法语境中指使判决偏离公正、令某人遭受不公；“使……受屈”既自然，也保留实际受损的司法含义。
- source_word: צַדִּיק
  choice: 义人
  rationale: 该词可指品行正直的人，也可指在案件中有理或无辜的人；“义人”保留这种道德—法律双重含义。
- source_word: בַּמִּשְׁפָּט
  choice: 在审判中
  rationale: 介词短语直指司法判断或审理的场域。“在审判中”不额外增添“法庭”，并保留原文对审判过程的强调。
theological_decisions:
- issue: צַדִּיק 的道德与司法含义
  choice: 译作“义人”
  alternative: 译作“无辜的人”或“有理的一方”
  rationale: 原词可兼有道德正直和司法上有理的含义；采用“义人”避免把经文仅限于无罪裁定，并保留箴言中的神学与伦理张力。
- issue: לְהַטּוֹת צַדִּיק 的句法含义
  choice: 译作“使义人受屈”
  alternative: 译作“在审判中把义人撇在一边”或“剥夺义人所得的公正”
  rationale: 原文可着重于使义人在审判中偏离公正结果，也可理解为枉屈义人；正文采用自然的法律伦理表达，脚注保留较贴近形式的译法。
translation_notes:
  register: 采用简洁、对称而庄重的现代标准汉语，保留箴言的警句风格。分号连接两个并列的司法恶行；第二句补出“也不好”，使汉语关系清楚而不改变原文判断。所有脚注标记均置于相关正文之后。
