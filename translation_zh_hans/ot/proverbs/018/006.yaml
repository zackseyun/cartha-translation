lexical_decisions:
- source_word: שִׂפְתֵי
  choice: 嘴唇
  rationale: 保留原文具体意象，以嘴唇转喻言语，并与下半句的“口”构成诗体平行。
- source_word: כְסִיל
  choice: 愚昧人
  rationale: 这是《箴言》中带有道德和行为意味的智慧文学用语，并非仅指智力不足；“愚昧人”庄重且符合现代中文圣经语域。
- source_word: יָבֹאוּ
  choice: 卷入
  rationale: בוא 与介词短语 בְרִיב 连用，表达进入或参与争端；“卷入”在中文中自然，又没有改写成明确的因果关系。
- source_word: בְרִיב
  choice: 争端
  rationale: רִיב 可指争吵、争执或纷争；“争端”简洁地保留其较宽泛的冲突含义。
- source_word: פִיו
  choice: 他的口
  rationale: 直译“口”，保留与“嘴唇”的平行和言语的具象表达。
- source_word: לְמַהֲלֻמוֹת
  choice: 击打
  rationale: 该词指击打或所受的重击；“击打”不额外限定为拳打、鞭打或伤口，保留原文范围。
- source_word: יִקְרָא
  choice: 招来
  rationale: 字面义为“呼叫、召唤”；此处“招来”自然表达其言语把击打召到自己身上的语用含义，同时脚注保留更贴近字面的译法。
