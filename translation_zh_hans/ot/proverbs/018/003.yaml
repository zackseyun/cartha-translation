  text: בְּֽ/בוֹא רָ֭שָׁע בָּ֣א גַם בּ֑וּז וְֽ/עִם קָל֥וֹן חֶרְפָּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/018/003.yaml
  text: When wickedness comes[a], contempt also comes, and with dishonor comes reproach.
translation:
  language: zh_hans
  text: 恶人一来[a]，藐视也随之而来；耻辱伴着辱骂。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“邪恶一来，藐视也随之而来；耻辱伴着辱骂。”
    reason: 保留将 רָשָׁע 理解为抽象的“邪恶”的可选译法；其余词语按正文采用较贴近原文语义范围的译法。
lexical_decisions:
- source_word: בְּבוֹא
  choice: 一来
  rationale: 介词 בְּ 加 בוא 的不定式构造引出时间情境；“一来”简洁自然，并与后面的同根动词“来”相呼应。
- source_word: רָשָׁע
  choice: 恶人
  rationale: 该词在此为阳性单数的名词化形容词，通常指一个恶人，而非抽象的“邪恶”；箴言中可作为典型人物泛指此类人。
- source_word: בָּא
  choice: 随之而来
  rationale: 保留 בוא 词根在上下半句中的重复，并用“随之”明确 גַם 所表达的伴随增添关系。
- source_word: גַם
  choice: 也
  rationale: 表达附加关系，即恶人来到时，藐视也一同出现。
- source_word: בּוּז
  choice: 藐视
  rationale: 该名词表示轻蔑、鄙视；“藐视”既可指轻蔑态度，也保持原文抽象名词的凝练。
- source_word: וְעִם
  choice: 伴着
  rationale: 表达“与……一同”的伴随关系，使第二分句符合现代汉语表达，同时保留平行结构。
- source_word: קָלוֹן
  choice: 羞耻
  rationale: 该词可指羞耻、耻辱或不名誉；“羞耻”与 חֶרְפָּה 所译“凌辱”有所区分。
- source_word: חֶרְפָּה
  choice: 凌辱
  rationale: 该词常含受人辱骂、羞辱或责难的公开性和关系性；“凌辱”能与“羞耻”形成紧凑而有区别的搭配。
theological_decisions:
- issue: רָשָׁע 应理解为具体人物还是抽象邪恶
  choice: 译为具体的“恶人”
  alternative: 邪恶
  rationale: 马所拉文本的 רָשָׁע 是阳性单数名词化形容词，最直接指“恶人”。译作“邪恶”会把具体人物抽象化；脚注保留英语审订层所反映的抽象读法。
translation_notes:
  register: 采用简洁、对称而庄重的现代汉语箴言体。“恶人一来”保留原文具体人物和 בוא 的重复；分号呈现两个紧密平行的分句。
