base_translation:
  language: en
  yaml_path: translation/ot/proverbs/018/007.yaml
  text: A fool’s mouth is his ruin[b][a], and his lips are a snare to his life.
translation:
  language: zh_hans
  text: 愚昧人的口使他败亡[a]；他的嘴唇是他性命的网罗[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“愚昧人的口给他带来毁灭。”
    reason: lexical_alternative
  - marker: b
    text: “性命”原文也可指“他自己”或“本人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּי
  choice: 口
  rationale: 保留希伯来文具体的身体意象，并以“口”自然地转指言语。
- source_word: כְסִיל
  choice: 愚昧人
  rationale: 这是《箴言》中具有道德与智慧传统含义的用语，并非单指智力低下；“愚昧人”较能保留这一层次。
- source_word: מְחִתָּה
  choice: 败亡
  rationale: 此词在本句指愚昧人的言语给自己招来的毁灭性后果。“败亡”庄重自然，也与下句“网罗”的危险意象相称。
- source_word: לוֹ
  choice: 使自己
  rationale: 希伯来文直译近于“对他而言”，结合句法可自然表达为他的口使他自己败亡；这样既明确关系，又不改变因果含义。
- source_word: וּשְׂפָתָיו
  choice: 他的嘴唇
  rationale: 保留与上句“口”构成的同义平行和具体身体意象。
- source_word: מוֹקֵשׁ
  choice: 网罗
  rationale: 这是智慧文学中常见的捕捉隐喻；“网罗”比一般的“陷阱”更能保持诗体和经文语域。
- source_word: נַפְשׁוֹ
  choice: 自己的性命
  rationale: נֶפֶשׁ 在这里主要指人的生命或本人，而不宜狭义理解为与身体分离的“灵魂”；“性命”与网罗带来的生命危险自然相合。
theological_decisions:
- issue: נַפְשׁוֹ 的人论含义
  choice: 自己的性命
  alternative: 自己的灵魂／他自己
  rationale: 上下文论及言语给说话者招致的危险，并未明确讨论灵魂与身体的区分；译作“性命”保留生命受害的含义，避免引入后期的人论框架。
translation_notes:
  register: 采用现代、凝练而庄重的箴言体。两分句保留“口／嘴唇”与“败亡／网罗”的平行结构；正文使用“自己”清楚表达两个第三人称后缀都回指愚昧人。
