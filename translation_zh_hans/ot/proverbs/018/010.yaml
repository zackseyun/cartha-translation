base_translation:
  language: en
  yaml_path: translation/ot/proverbs/018/010.yaml
  text: The name of Yahweh is a strong tower[c][b][a]; the righteous runs into it and is set securely on high.
translation:
  language: zh_hans
  text: 雅威[a]的名是坚固的高塔；义人奔入其中，便被安置在高处。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文为 YHWH，即以色列上帝的专名；传统中文多译作“耶和华”。
    reason: alternative_reading
  - marker: b
    text: 也可译作“得享安稳”或“得着保护”；原文动词含有被置于高处、因难以接近而安全的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִגְדַּל עֹז
  choice: 坚固的高塔
  rationale: 原文直译为“力量之塔”，指坚固、可供防御的高塔；此译保留高耸建筑与避难所的比喻。
- source_word: שֵׁם
  choice: 名
  rationale: 保留原文“名”，不将其窄化为“名声”或直接解释为品格，使其丰富含义保持开放。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名形式呈现四字神名，而不只用称号“主”。
- source_word: בּוֹ
  choice: 其中
  rationale: 阳性单数后缀最自然地回指“高塔”这一比喻；“奔入其中”符合现代汉语表达。
- source_word: יָרוּץ
  choice: 奔入
  rationale: 动词本义为“跑”；结合介词与避难图像，译作“奔入”既保留动作，也体现急切投奔之意。
- source_word: צַדִּיק
  choice: 义人
  rationale: 这是单数阳性名词化形容词；“义人”在中文中可作具有代表性的单数称谓，无须额外加入“男人”。
- source_word: נִשְׂגָּב
  choice: 安居高处
  rationale: 该词的尼法勒形表达被置于高处、因难以接近而安全的意思；此译兼顾垂直图像与安全含义。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 原文使用神的专名。正文保留专名而非以称号替代；采用“耶和华”是基于现代中文的广泛可识别性，并以脚注说明其他常见音译及传统替代译法。
- issue: צַדִּיק 的性别与代表性
  choice: 义人
  alternative: 义士；正直的人
  rationale: 原文为单数阳性，但在箴言中具有代表性。“义人”既保留单数类别称谓，也不在汉语中不必要地添加“男人”。
- issue: נִשְׂגָּב 所表达的安全方式
  choice: 安居高处
  alternative: 得着保护；高不可侵
  rationale: 不把该词仅扁平化为一般性的“安全”，而保留因处在高而不可接近之地所获得保护的意象。
translation_notes:
  register: 采用自然、凝练而庄重的现代标准汉语，保留箴言的两分句结构及“名—高塔—奔入—高处”的连续意象。正文中的“耶和华”为四字神名的传统中文音译；“义人”为代表性单数。
