base_translation:
  language: en
  yaml_path: translation/ot/proverbs/018/008.yaml
  text: The words of a whisperer are like delicious morsels[b][a], and they go down into the inner chambers of the belly.
translation:
  language: zh_hans
  text: 搬弄是非者的话如同美味的小食[a]，直落到人的腹中深处[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“精致的小块”；这个罕见的希伯来词也可能理解为“创伤”，或“被贪婪吞下之物”。
    reason: lexical_alternative
  - marker: b
    text: “腹中深处”直译为“腹部的内室”，是希伯来语表达，指一个人的内心最深处。
    reason: cultural_note
lexical_decisions:
- source_word: דִּבְרֵי
  choice: ……的话
  rationale: 这是דָּבָר的复数构造形式；译作“……的话”自然、准确，也适合本句的箴言体。
- source_word: נִרְגָּן
  choice: 搬弄是非者
  rationale: 此词指暗中低语、传播挑拨性言语的人。“搬弄是非者”在现代汉语中清楚表达其隐秘而离间的言谈性质，同时避免将词义过窄地限定为诽谤。
- source_word: כְּמִתְלַהֲמִים
  choice: 如同美味的小食
  rationale: 这是罕见且有争议的词形；结合箴言26:22的相同用语，以及下半句“落到”腹中深处的吞食意象，理解为令人垂涎、容易吞下的小块食物最符合语境。其他可能释义保留在脚注中。
- source_word: וְהֵם
  choice: （承接为）直
  rationale: 原文连词和独立代词再次指向前面的“话”。汉语无需机械译出“而它们”，用“直落到”自然承接并保持强调。
- source_word: יָרְדוּ
  choice: 落到
  rationale: 原文虽为完成式，但箴言表达一般规律；汉语用无时态标记的“落到”即可传达恒常性的陈述。“直”补出其深入内里的动态感。
- source_word: חַדְרֵי בָטֶן
  choice: 人的腹中深处
  rationale: 原文直译为“腹部的内室”。“腹中深处”保留身体内部和深入的空间意象；加“人的”使现代汉语表意清晰。该希伯来习语所指的内在生命在脚注说明。
