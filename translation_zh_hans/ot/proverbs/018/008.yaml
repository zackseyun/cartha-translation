  register: 采用现代、庄重而易懂的箴言体。“搬弄是非者”比“低语者”更符合普通话习惯；正文保留吞食和深入腹中的具体意象，不直接抽象改写为“深入人心”。脚注标记依照正文出现顺序排列。
