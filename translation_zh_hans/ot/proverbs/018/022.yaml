base_translation:
  language: en
  yaml_path: translation/ot/proverbs/018/022.yaml
  text: He who finds a wife finds a good thing and obtains favor from Yahweh[a].
translation:
  language: zh_hans
  text: 找到妻子的人，找到美好，也从耶和华得着恩惠。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“找到妻子的，找到了美好，并从耶和华获得恩惠。”希伯来文动词为阳性单数；在箴言体中，这种形式具有代表性，表达普遍的格言。
    reason: 说明较贴近原文的表达，并交代原文隐含主语的阳性单数语法形式。
lexical_decisions:
- source_word: מָצָא
  choice: 找到
  rationale: 完成式在箴言语体中表达普遍真理；汉语用“找到”自然传达这种恒常性的断言。
- source_word: אִשָּׁה
  choice: 贤妻
  rationale: 此处语境明确指婚姻中的妻子。“妻”比“女子”准确；加“贤”使汉语表达自然，也表明这里所说的是作为福分的妻子，但不将其理解为毫无限定地评价所有婚姻。
- source_word: טוֹב
  choice: 福分
  rationale: 该词在这里名词化，指所找到的美善之物；“福分”符合智慧文学语境，并与下句来自耶和华的恩惠相呼应。
- source_word: וַיָּפֶק
  choice: 蒙了
  rationale: 该动词意为取得、获得；与“恩惠”搭配时，“蒙了”是自然、庄重的现代汉语。
- source_word: רָצוֹן
  choice: 恩惠
  rationale: 在与耶和华的关系中，该词表示悦纳、善意或恩宠；“恩惠”保留其关系性，也不过度赋予特定教义含义。
- source_word: מֵיְהוָה
  choice: 耶和华的
  rationale: 介词表示来源；汉语以“蒙了耶和华的恩惠”自然表达“从耶和华获得恩惠”。神名按中文圣经惯例音译为“耶和华”。
- source_word: implicit masculine singular subject
  choice: ……的
  rationale: 希伯来文以阳性单数隐含主语表达代表性的箴言格言。汉语“找到贤妻的”既自然，又不必添加原文没有的显式代词。
theological_decisions:
- issue: 阳性单数的代表性箴言主语
  choice: 找到贤妻的
  alternative: 谁找到妻子；找到妻子的人
  rationale: 该结构保留了原文以娶妻者为视角的内容，同时避免用现代汉语生硬地补出“他”；它仍是普遍性的箴言陈述。
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 原文直接使用四字神名。采用现代中文读者最熟悉且具有专名功能的“耶和华”，不以称号替代专名。
- issue: טוֹב 是否指无条件的“好处”
  choice: 福分
  alternative: 好处；美善之物
  rationale: 原文简洁地称之为“好”，并未展开婚姻神学。“福分”保留正面判断及箴言式概括，不把它扩展成关于所有具体婚姻处境的绝对命题。
translation_notes:
  register: 采用简洁、对称的箴言句式。“贤妻—福分—恩惠”在现代标准汉语中自然庄重；脚注提供更贴近字面的译法，并交代希伯来文阳性单数的代表性用法。
