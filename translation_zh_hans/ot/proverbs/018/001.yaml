  text: Whoever isolates himself seeks his own desire[b][a]; he breaks out against all sound judgment.
translation:
  language: zh_hans
  text: 离群独处的人追求自己的欲望；他与一切健全的判断[b]相争。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节下半句的希伯来文含义难定，尤其是译作“相争”的罕见动词；也可译作：“离群的人寻求欲望；他与一切健全的智慧争闹。”
    reason: alternative_reading
  - marker: b
    text: “健全的判断”也可译作“健全的智慧”或“良好的判断力”。
    reason: lexical_alternative
lexical_decisions:
- source_word: לְתַאֲוָה
  choice: 自己的欲望
  rationale: תַּאֲוָה指欲望、渴求或愿望；前置的לְ在此可表示目的或动机。译作“自己的欲望”以自然中文表达语境中隐含的自我指向，同时不过度限定为“自私的欲望”。
- source_word: יְבַקֵּשׁ
  choice: 追求
  rationale: בקש的皮尔式通常表示寻求或追求；“追求”在这里能体现持续以欲望为目标的意味。
- source_word: נִפְרָד
  choice: 离群独处的人
  rationale: פרד的尼斐尔分词可指与人分开或使自己分离的人。这里译为“离群独处的人”，保留其箴言式泛指，也表达主动疏离群体和劝告的语境含义。
- source_word: בְּכָל
  choice: 一切
  rationale: 介词בְ在本行关系难定；结合罕见动词和对抗性语境，以“抗拒一切”表达其可能的敌对关系，但在脚注中保留不确定性。
- source_word: תּוּשִׁיָּה
  choice: 健全的判断
  rationale: תּוּשִׁיָּה在智慧文学中可指健全的智慧、实用洞见或良好判断。“健全的判断”切合本节的群体与劝诫语境。
- source_word: יִתְגַּלָּע
  choice: 抗拒
  rationale: 这是一个意义难定的罕见hitpael形式，可能表示敌对地爆发、争闹或显露敌意。“抗拒”在正文中给出通顺且不过分具象的表达，并以脚注说明原文困难及其他可能译法。
