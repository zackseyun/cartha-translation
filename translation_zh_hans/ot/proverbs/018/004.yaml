base_translation:
  language: en
  yaml_path: translation/ot/proverbs/018/004.yaml
  text: The words of a man's mouth are deep waters[b][a]; the fountain of wisdom is a flowing brook.
translation:
  language: zh_hans
  text: 人口[b]中的话语如同深水[a]；智慧的泉源是涌流的溪水。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“人口中的话语是深水，是涌流的溪水，是智慧的泉源。”希伯来语也可理解为两个水的意象都在描述这些话语，而不是把第二行看作关于智慧的独立陈述。
    reason: alternative_reading
  - marker: b
    text: “人”所译的希伯来语 אִישׁ 是阳性单数词；这里采用箴言体的泛指用法，指一个说话的个体。
    reason: lexical_alternative
lexical_decisions:
- source_word: מַיִם עֲמֻקִּים
  choice: 深水
  rationale: 保留具体的水域意象，不用“深奥”直接解释比喻；希伯来语的复数 מַיִם 在汉语中自然译作集合意义的“水”。
- source_word: דִּבְרֵי פִי אִישׁ
  choice: 一个男人口中的话
  rationale: 直译其结构为“一个男人之口的话”。אִישׁ 是阳性单数名词；“口中的话”既保留“口”的形象，也符合现代汉语表达。
- source_word: נַחַל
  choice: 溪水
  rationale: 该词可指溪流、河谷中的水道；在与泉源相连的水意象中，“溪水”自然地表现流动的水，又不额外强调干涸河谷或洪流。
- source_word: נֹבֵעַ
  choice: 涌流的
  rationale: 该分词描写水不断涌出、流动；“涌流”兼顾泉水涌出与溪水流动的动态。
- source_word: מְקוֹר חָכְמָה
  choice: 智慧的泉源
  rationale: מְקוֹר 可指源头、泉源；“智慧的泉源”保留原文的鲜明水喻，并与上半句的“深水”呼应。
theological_decisions:
- issue: 两行水喻之间的句法关系
  choice: 把第二行译为独立判断：“智慧的泉源是涌流的溪水”
  alternative: 把“涌流的溪水”和“智慧的泉源”都看作对“一个男人口中的话”的连续描述
  rationale: 希伯来诗行省略系词，容许两种划分；正文采用常见的平行分句读法，脚注保留另一种真实可行的句法理解，不据此判定说话者的话必然具有智慧。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。正文保留“深水—泉源—溪水”的连续意象；以“如同”明确汉语中的比喻关系，同时不把“深”解释成“深奥”。脚注标记均置于正文相关位置。
