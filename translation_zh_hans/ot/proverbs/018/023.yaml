  yaml_path: translation/ot/proverbs/018/023.yaml
  text: The poor man speaks with pleas[a], but the rich man answers harshly.
translation:
  language: zh_hans
  text: 穷人说恳求的话，富人却强硬地回答。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תַּחֲנוּנִים
  choice: 低声恳求
  rationale: 该复数名词表示为求恩惠或怜悯而发出的恳切请求。结合“说”，译作“低声恳求”自然地表达卑微求告的语气；“低声”是语境化表达，并非专指音量。
- source_word: יְדַבֶּר
  choice: 恳求
  rationale: דבר 的 Piel 形式基本义为“说”。与 תַּחֲנוּנִים 连用时，中文以动词“恳求”合并表达说话的内容和方式，比直译“说恳求的话”更自然。
- source_word: רָשׁ
  choice: 穷人
  rationale: 该词指贫穷、缺乏资源的人。用单数类称的“穷人”保留箴言中代表性个体的表达，同时符合现代汉语习惯。
- source_word: וְעָשִׁיר
  choice: 富人却
  rationale: וְ 字面为“和”，但上下两句形成贫富对照，译为“却”能准确呈现转折关系。עָשִׁיר 译作“富人”，与“穷人”对称。
- source_word: יַעֲנֶה
  choice: 回答
  rationale: ענה 的 Qal 形式意为“回答、回应”。“回答”直接保留了原文的应答关系。
- source_word: עַזּוֹת
  choice: 厉声
  rationale: 该复数形式在这里作方式状语，含强硬、严厉、粗暴之意。“厉声”简洁呈现富人回应时的强硬语气；脚注保留较贴近形式的译法“强硬的话”。
theological_decisions: []
