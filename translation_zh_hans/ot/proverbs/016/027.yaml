base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/027.yaml
  text: A worthless man digs up evil[b][a], and on his lips is a scorching fire.
translation:
  language: zh_hans
  text: 无赖之徒挖出恶事[a]，他的嘴唇上仿佛有灼热的火[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“挖出祸害。”希伯来词既可侧重道德上的恶，也可侧重人所造成的伤害或灾祸。
    reason: lexical_alternative
  - marker: b
    text: 直译：“在他的嘴唇上，如同灼热的火。”
    reason: literal_rendering
lexical_decisions:
- source_word: אִישׁ בְּלִיַּעַל
  choice: 无赖之徒
  rationale: אִישׁ是阳性单数“人、男人”，בְּלִיַּעַל在此指道德败坏、卑劣无用，并非专名。“无赖之徒”以现代汉语自然地刻画这种典型人物，同时保留其贬义力度。
- source_word: כֹּרֶה
  choice: 挖出
  rationale: 源自动词כרה“挖掘”。这里以挖掘为喻，描写人蓄意翻弄、制造恶事；“挖出”既保留具体意象，又比单说“挖掘恶事”更符合现代汉语。
- source_word: רָעָה
  choice: 恶事
  rationale: 该词可指道德上的恶，也可指所造成的祸害。“恶事”以道德意义为主，同时不排除伤害和灾祸的结果。
- source_word: שפתיו
  choice: 他的嘴唇
  rationale: 直译为“他的嘴唇”。保留身体部位意象，符合箴言的诗性表达，并承接下文的火焰比喻。
- source_word: כְּאֵשׁ צָרָבֶת
  choice: 仿佛有灼人的火
  rationale: כְּ引出比较，צָרָבֶת是罕见词，表示灼烧、炽烈的性质。“灼人的火”传达言语如火般伤人的破坏力；“仿佛有”使省略系词的希伯来结构在汉语中自然通顺。
- source_word: וְעַל
  choice: ……上
  rationale: 介词עַל表示“在……上”，与“嘴唇”合译为“嘴唇上”；连接词וְ按汉语并列句习惯以逗号体现，避免生硬重复“并且”。
theological_decisions:
- issue: רָעָה兼具道德之恶与所致祸害的含义
  choice: 正文译作“恶事”，脚注保留“祸害”的可能
  alternative: 祸害
  rationale: 上下句共同描写败坏者及其伤人言语，因此道德和破坏两方面都有根据；正文不把该词缩窄为单纯的灾祸，脚注则明示其语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的箴言体。两分句平衡简洁；保留“挖出”和“火”的双重意象，不把后半句解释性改写为“他的话伤人”。
