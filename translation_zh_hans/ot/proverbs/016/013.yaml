  text: רְצ֣וֹן מְ֭לָכִים שִׂפְתֵי צֶ֑דֶק וְ/דֹבֵ֖ר יְשָׁרִ֣ים יֶאֱהָֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/013.yaml
  text: Righteous lips are the delight of kings[b][a], and he loves one who speaks what is upright.
translation:
  language: zh_hans
  text: 公正的言语是君王所喜悦的；君王喜爱说正直话的人。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “所喜悦的”也可译为“君王的恩宠”或“蒙君王悦纳”；“公正的”也可译为“正义的”。下半句原文的“喜爱”为单数，主语可理解为一位具有代表性的君王；在中文中，“君王”可作类称。
    reason: lexical_and_grammatical_alternative
lexical_decisions:
- source_word: רְצוֹן
  choice: 所喜悦的
  rationale: 该词可指喜悦、恩宠或蒙悦纳之事；这里与“君王”构成判断关系，表达公义的言语为君王所喜欢。
- source_word: שִׂפְתֵי צֶדֶק
  choice: 公义的言语
  rationale: 原文直译为“公义的嘴唇”，以嘴唇代指言语；中文译为“公义的言语”较自然，同时保留其道德正直的含义。
- source_word: מְלָכִים
  choice: 君王
  rationale: 复数名词，中文“君王”可作类称，不必另加复数标志。
- source_word: וְדֹבֵר יְשָׁרִים
  choice: 说正直话的人
  rationale: 分词作名词使用；复数形容词 יְשָׁרִים 实体化，指正直、端正的话语或事情。
- source_word: יֶאֱהָב
  choice: 君王必喜爱他
  rationale: 动词为第三人称阳性单数；将省略的主语按上半句理解为一个具有代表性的君王，并用“必”表达箴言中的惯常情形，而非单纯将来时。
theological_decisions:
- issue: 下半句单数动词与上半句复数“君王”的关系
  choice: 以“君王”作类称，并在下半句采用代表性单数观念：“君王必喜爱他”
  alternative: “君王们喜爱说正直话的人”
  rationale: 希伯来文 יֶאֱהָב 明确为第三人称阳性单数，不宜直接改作复数；中文“君王”既可类称，也可指代表性的君王，因此能保留原文数的转换而不显生硬。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。为避免“公义的嘴唇”在现代中文中的生硬感，以“公义的言语”传达原文的转喻；分号保留两分句的平行结构。
