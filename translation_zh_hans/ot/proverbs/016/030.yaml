  text: עֹצֶ֣ה עֵ֭ינָי/ו לַ/חְשֹׁ֣ב תַּהְפֻּכ֑וֹת קֹרֵ֥ץ שְׂ֝פָתָ֗י/ו כִּלָּ֥ה רָעָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/030.yaml
  text: He who shuts his eyes to devise perverse things[a], who purses his lips[b], has completed evil.
translation:
  language: zh_hans
  text: 闭眼图谋歪邪之事、抿紧嘴唇[a]的人，已把恶事做到底了[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“压紧嘴唇”。这个希伯来词在别处可指眨眼，但这里所说的明确是嘴唇。
    reason: lexical_alternative
  - marker: b
    text: 或译“完成了恶事”或“成就了恶事”。希伯来动词强调把恶事贯彻到终点。
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹצֶה
  choice: 闭眼
  rationale: 该分词在这里表示闭上眼睛；译作“闭眼”简洁自然，也保留策划恶事时的动作描写。
- source_word: עֵינָיו
  choice: 眼
  rationale: 对应“他的眼睛”；汉语放在“闭眼”这一惯用结构中，无须另译所有格。
- source_word: לַחְשֹׁב
  choice: 图谋
  rationale: חשב可指思想、筹划；与“歪邪之事”搭配时含蓄意策划之意，“图谋”准确传达其负面语境。
- source_word: תַּהְפֻּכוֹת
  choice: 歪邪之事
  rationale: 复数名词指扭曲、悖谬或邪僻的事与计谋；“歪邪之事”既保留道德意味，也便于现代读者理解。
- source_word: קֹרֵץ
  choice: 抿紧
  rationale: קרץ在别处可指眨眼，但此处宾语明确是“嘴唇”，因此应理解为把嘴唇抿起或压紧的动作。
- source_word: שְׂפָתָיו
  choice: 嘴唇
  rationale: 直译该名词；汉语语境中无需明说“他的”。
- source_word: כִּלָּה
  choice: 做到底了
  rationale: Piel词形强调完成、做尽或使之达到终点；“做到底了”自然表达把恶事贯彻完成的结果。
- source_word: רָעָה
  choice: 恶事
  rationale: 该词既可指道德上的恶，也可指有害的行为；“恶事”在本节中兼顾两层含义，并与“做到底”自然搭配。
theological_decisions:
- issue: 末句是指筹划恶事，还是已经把恶事完成
  choice: 已把恶事做到底了
  alternative: 成就了恶事／把恶事做完了
  rationale: כִּלָּה通常强调完成或达到终点。译文保留恶已被贯彻到底的强烈结果意味，不把它弱化为仅仅计划或即将行动。
translation_notes:
  register: 采用现代、凝练而庄重的箴言体。“闭眼……、抿紧嘴唇的人”保留原文两个连续分词所描绘的动作；“歪邪之事”保留תַּהְפֻּכוֹת的道德扭曲意味，而不限定为某一种具体罪行。所有脚注标记均置于相关词语之后。
