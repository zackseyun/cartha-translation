  yaml_path: translation/ot/proverbs/016/026.yaml
  text: The appetite of a laborer labors for him[c][b][a], for his mouth presses him on.
translation:
  language: zh_hans
  text: 劳力者的欲望为他劳作[a]，因为他的口逼迫他[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “欲望”或译“胃口”“生命”“心愿”。希伯来语נֶפֶשׁ含义较广；下文的“他的口”使“胃口”成为可能。原文“为他”也可按语境理解为“为自己”。
    reason: lexical_alternative
  - marker: b
    text: “逼迫他”或译“催促他”“驱使他”“迫使他”。
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: 胃口
  rationale: נֶפֶשׁ可指生命、本人、欲望或食欲；下半句提到“他的口”，语境尤其指向饮食需要。“胃口”在现代汉语中自然，并保留身体需求推动劳作的意味。
- source_word: עָמֵל
  choice: 劳力者
  rationale: 指劳作、辛苦做工的人。“劳力者”简洁庄重，也能与后面的同根动词形成呼应。
- source_word: עָמְלָה
  choice: 催他劳作
  rationale: 该动词与עָמֵל同根，基本义为劳作。汉语无法完全复制原文词根复现；结合נֶפֶשׁ作主语，用“催他劳作”自然表达人的饮食需要促使他做工。
- source_word: לּוֹ
  choice: 他
  rationale: 原文直译为“为他”；在本句汉语结构中译作“催他劳作”体现其受益或指向关系。另可理解为“为自己”，故列入脚注。
- source_word: כִּי
  choice: 因为
  rationale: 引出劳作受到推动的原因，现代汉语用“因为”清楚自然。
- source_word: אָכַף עָלָיו
  choice: 逼着他干下去
  rationale: אָכַף含施压、驱迫之意，עָלָיו表示压力加在他身上。“逼着他干下去”传达持续驱动的力度，同时符合现代汉语。
- source_word: פִּיהוּ
  choice: 他的口
  rationale: 原文直说“他的口”，以口代表饥饿或饮食需要；正文保留这一拟人化形象，不直接释为“饥饿”。
theological_decisions: []
translation_notes:
