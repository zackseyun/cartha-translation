base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/031.yaml
  text: Gray hair is a crown of glory[b][a]; it is found in the way of righteousness.
translation:
  language: zh_hans
  text: 白发是荣耀的冠冕[b]；在公义之道上可得着[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“可在公义的道路上找到。”希伯来语的“道路”常指一个人的生活方式或人生行程。
    reason: lexical_alternative
  - marker: b
    text: 本句表达一般性的智慧原则：白发与公义的人生相伴，便是尊荣的标志；它并非绝对保证每个公义的人都必长寿，也不是说每位老人都必然公义。
    reason: cultural_note
lexical_decisions:
- source_word: עֲטֶרֶת
  choice: 冠冕
  rationale: 该词指冠冕或环绕头部的饰物；“冠冕”自然保留了尊荣的比喻。
- source_word: תִּפְאֶרֶת
  choice: 荣耀
  rationale: 该词可指美丽、华美、荣光或尊荣；“荣耀”在“荣耀的冠冕”这一结构中兼顾庄重感与荣誉意味。
- source_word: שֵׂיבָה
  choice: 白发
  rationale: 原词具体指灰白的头发，并可转指年老；“白发”保留希伯来文鲜明的具体意象，也符合现代汉语表达。
- source_word: בְּדֶרֶךְ
  choice: 在……之道上
  rationale: “道路”在希伯来智慧文学中常喻指生活道路或行为方式；此译保留道路意象，同时让读者理解为人生行径。
- source_word: צְדָקָה
  choice: 正义
  rationale: 该词涵盖公义、正直和合宜行为；“正义”既保留伦理分量，也避免把含义缩窄为个人品德。
- source_word: תִּמָּצֵא
  choice: 寻得
  rationale: Niphal 形式可表达“被找到、得着”；“寻得”保留白发是在正义道路上被发现或获得的含混性，不把本句改写成绝对的因果保证。
theological_decisions:
- issue: 下半句与上半句的关系
  choice: 保留“白发在正义之道上寻得”的箴言式陈述，表达白发与正义人生相伴时的尊荣，并维持其一般性智慧原则。
  alternative: 将经文理解为正义必然保证长寿，或理解为一切老年本身都必然尊荣。
  rationale: 希伯来文没有明确写出机械式因果，也没有断言每位老人都正义；直译其道路意象和被动动词，可保留原文的神学张力。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“白发”“冠冕”保留原文意象；“正义之道”延续希伯来智慧文学的道路隐喻。脚注标记均置于正文相应位置。
