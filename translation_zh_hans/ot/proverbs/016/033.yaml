base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/033.yaml
  text: The lot is cast into the lap[a], but its every decision is from Yahweh.
translation:
  language: zh_hans
  text: 签虽被投入怀中，它的一切决定却都出于耶和华。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “决定”或译“裁定”“判决”。希伯来语这个词可带有司法裁判的意味。
    reason: 词义有多个相近选项；脚注保留原词可能具有的司法语气。
lexical_decisions:
- source_word: בַּחֵיק
  choice: 投入怀中
  rationale: חֵיק可指胸怀、膝上或衣服的襟兜；本句描写投签之处。“怀中”保留具体意象，又符合现代汉语表达。
- source_word: יוּטַל
  choice: 被投入
  rationale: 该词为使役被动形式，表示签被人投入；“被投入”保留原文的被动语态，也比“被扔”更庄重。
- source_word: הַגּוֹרָל
  choice: 签
  rationale: גּוֹרָל指用来作决定或分配的签。“签”简洁准确，不把古代投签方式窄化为骰子。
- source_word: וּמֵיְהוָה
  choice: 却都出于耶和华
  rationale: 连接词ו本可译为“而”或“和”，这里用“却”自然呈现人的投签动作与裁断来源之间的对照；מֵ表示来源。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经传统中对四字神名的通行音译，保留其作为专名的性质，而不以称号代替。
- source_word: כָּל
  choice: 每一个
  rationale: כָּל修饰单数名词，在此有逐一、分配性的含义；“每一个”明确表达无一例外。
- source_word: מִשְׁפָּטוֹ
  choice: 裁断
  rationale: מִשְׁפָּט可指判断、判决或裁定；在投签语境中，“裁断”既表示由签得出的决定，也保留一定的司法色彩。中文主句不另译第三人称所属词，以免形成生硬的“签的裁断”，但其所指仍由上下文清楚限定。
theological_decisions:
- issue: 上帝主权与看似随机之事的关系
  choice: 保留人的投签动作与每个裁断出于耶和华之间的直接对照。
  alternative: 将本句限定为圣礼性的投签，或将其扩展为关于一切随机事件的普遍命题。
  rationale: 原文只明确说签由人投入，而其每个裁断来自耶和华。译文不把这句话限制在原文未明说的特定礼仪中，也不扩展成超出本箴言措辞的系统性论断。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“虽……却……”清楚呈现箴言的对照结构；脚注标记紧随其所说明的“裁断”。
