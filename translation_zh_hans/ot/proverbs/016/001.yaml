  text: לְ/אָדָ֥ם מַֽעַרְכֵי לֵ֑ב וּ֝/מֵ/יְהוָ֗ה מַעֲנֵ֥ה לָשֽׁוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/001.yaml
  text: The plans of the heart belong to man[b][a], but the answer of the tongue is from Yahweh.
translation:
  language: zh_hans
  text: '人心中的谋划属于人，[a][b]

    但舌头的应答出于耶和华。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“心中的安排属于人；但舌头的应答出于耶和华。”
    reason: lexical_alternative
  - marker: b
    text: 原文“人”（אָדָם）为代表性单数，泛指一般的人。
    reason: cultural_note
lexical_decisions:
- source_word: לְאָדָם
  choice: 属于自己
  rationale: 介词 לְ 在此表达归属或关联。译作“属于自己”使中文无动词分句自然，并以泛指的“人”承接 אָדָם 所代表的一般人类个体。
- source_word: מַעַרְכֵי
  choice: 谋划
  rationale: 该词源于 ערך，指安排、部署或筹划；与“心”连用时表示人在内心形成的计划。“谋划”兼顾行动过程和计划内容。
- source_word: לֵב
  choice: 心中
  rationale: לֵב 指人的内在，包括思想和意向。“心中”保留希伯来意象，同时符合现代汉语表达。
- source_word: וּמֵיְהוָה
  choice: 但……出于耶和华
  rationale: ו 字面可译“而/和”，但两分句构成对照，故用“但”；מִן 表示来源，译作“出于”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名形式呈现四字神名，区别于作为称号的“主”。
- source_word: מַעֲנֵה
  choice: 应答
  rationale: 该名词指回答或回应。“应答”既贴近原义，又能与后面的“舌头”自然搭配。
- source_word: לָשׁוֹן
  choice: 舌头
  rationale: 保留原文以身体器官代指言语的具体诗歌意象，而不直接抽象化为“话语”。
theological_decisions:
- issue: 人的内心谋划与耶和华主权之间的关系
  choice: 保留“人的谋划”与“出于耶和华的应答”之间的并置和张力
  alternative: 将后半句扩展解释为耶和华控制一切结果，或解释为人自己的每句话都被直接决定
  rationale: 原文明确对照“心中的谋划”和“舌头的应答”，却没有系统说明神如何作用于人的言语。译文不把格言扩展成决定论，也不将其淡化为一般性的护理。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语，保留希伯来诗歌两分句的对照结构以及“心—舌头”的具体意象。脚注标记按顺序置于第一分句之后。
