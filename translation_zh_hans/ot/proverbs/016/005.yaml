  yaml_path: translation/ot/proverbs/016/005.yaml
  text: Everyone who is proud in heart is an abomination to Yahweh; hand to hand[a], he will certainly not go unpunished.
translation:
  language: zh_hans
  text: 凡心里高傲的人，在雅威眼中都是可憎的；手对手[a]，他绝不能免受惩罚。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“手对手”。这可能是一种表示“可以确定”或“必定”的说法；也可能意为“即使彼此联手”，即使结成同盟。
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹעֲבַת
  choice: 所憎恶的
  rationale: 该名词表示令人深恶痛绝、在道德和信仰上可憎之物。中文用“所憎恶的”既保留强烈的道德判断，也使“是雅威所憎恶的”表达自然。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，保留其作为以色列之上帝专名的性质，不以称号替代。
- source_word: כָּל
  choice: 凡……的
  rationale: 在此具有逐一概括的分配意义；“凡……的”自然表达无一例外的范围。
- source_word: גְּבַהּ לֵב
  choice: 心里高傲
  rationale: 原文直指“心高”，表示内在的骄傲和自高；“心里高傲”清楚保留其内在倾向。
- source_word: יָד לְיָד
  choice: 手与手相连
  rationale: 原文是难解的“手对手”短语，可能是保证语，也可能描绘彼此联手。正文采用较为透明且可读的直译，脚注保留主要解释，不将歧义悄然消除。
- source_word: לֹא יִנָּקֶה
  choice: 必不能免受惩罚
  rationale: 该动词的被动式在这里表示不能被算为无罪或不能逃过惩罚；“不能免受惩罚”明确传达司法后果，“必”体现语境中的强调。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名。音译为“雅威”保留其专名身份，同时避免用“主”等称号替代。
- issue: יָד לְיָד 的解释
  choice: 正文保留为“手与手相连”，并用脚注说明歧义
  alternative: 译为“可以确定”或“即使彼此联手”
  rationale: 此短语的确切功能存在真实的词义歧义，可能用于郑重保证，也可能指结盟联手。正文不武断选定单一解释，脚注列出主要可能。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“凡……的”保持箴言式概括语气；分号对应原文前后判断与后果的关系。正文中的[a]与脚注完全对应。
