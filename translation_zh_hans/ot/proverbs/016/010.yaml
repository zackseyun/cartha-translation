  text: קֶ֤סֶם עַֽל שִׂפְתֵי מֶ֑לֶךְ בְּ֝/מִשְׁפָּ֗ט לֹ֣א יִמְעַל פִּֽי/ו׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/010.yaml
  text: A divine verdict is on the lips of a king[b][a]; his mouth does not betray justice.
translation:
  language: zh_hans
  text: 王的唇上有神圣的判词[a]；他在审判时，口不违背公正[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “神圣的判词”所译的希伯来词通常指“占卜”，也可译作“神谕”或“谕示”。本句因与君王审判相连，按其司法语境译为“神圣的判词”。
    reason: lexical_alternative
  - marker: b
    text: “在审判时”也可译作“在审判中”。“不违背”所译的词可含不忠、背信或违犯之意。
    reason: lexical_alternative
lexical_decisions:
- source_word: קֶסֶם
  choice: 神谕
  rationale: 该词通常指占卜或神秘的谕示；在这里与君王施行审判的下半句对应，宜保留其超常、权威性的谕示色彩，却不直接把本句理解为赞许邪术。其通常含义另以脚注说明。
- source_word: עַל שִׂפְתֵי מֶלֶךְ
  choice: 王的嘴唇上有
  rationale: 按无动词名词句补出“有”，保留“在嘴唇上”的位置意象；“王”在箴言中作泛指，不特指某一位君王。
- source_word: בְּמִשְׁפָּט
  choice: 审判时
  rationale: 介词短语可表示审判的情境或行动；译作“审判时”自然地修饰后句，同时保留“在审判中”的可能意义。
- source_word: לֹא יִמְעַל
  choice: 不背离
  rationale: מעל表示不忠、背信或违犯；与公正的司法裁决搭配时，“不背离”既自然，也保留对公正不忠的伦理意味。
- source_word: פִּיו
  choice: 他的口
  rationale: 照原文保留“嘴唇”与“口”的用词变化，并明确后半句的主语仍是君王。
theological_decisions:
- issue: קֶסֶם在本节应取通常带负面色彩的“占卜”，还是合乎司法语境的正面谕示意义
  choice: 正文译作“神谕”，在司法语境中表达君王判词具有谕示般的权威，同时用脚注保留“占卜”的通常词义。
  alternative: “占卜在王的嘴唇上”或“王的嘴唇发出神圣判词”
  rationale: 下半句谈君王审判时不背离公正，显示本节描绘理想的王者裁判，而非明确赞许被禁止的 occult 实践；但原词本身的张力不应被完全消除。
translation_notes:
  register: 采用现代、庄重且易懂的箴言体。两分句保留原文的平行结构以及“嘴唇／口”的意象变化；用“神谕”保留 קֶסֶם 的谕示色彩，并通过脚注呈现其常见的“占卜”义及本句的解释张力。
