  text: The wise of heart is called discerning[a], and sweetness of lips increases learning.
translation:
  language: zh_hans
  text: 心中有智慧的人，称为明达；言语甜美，增添学识[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “学识”也可译作“教诲”或“劝服力”。希伯来语 לֶקַח 可指学习所得或教导；在此语境中，也可能指甜美言语所增添的劝服或教导成效。
    reason: lexical_alternative
lexical_decisions:
- source_word: לַחֲכַם לֵב
  choice: 心里有智慧的
  rationale: 保留“心”这一希伯来语意象；这里的“心”指人的内在判断与思虑。“心里有智慧的”既贴近原文，也符合现代汉语表达。
- source_word: יִקָּרֵא
  choice: 称为
  rationale: 该动词在此为被动意义，表示被人如此称呼或看待；箴言体用一般现在意义最自然。
- source_word: נָבוֹן
  choice: 明达
  rationale: נָבוֹן 指有理解力、辨别力的人。“明达”简洁庄重，并能表达洞察与判断兼具的含义。
- source_word: וּמֶתֶק שְׂפָתַיִם
  choice: 言语甘甜
  rationale: שְׂפָתַיִם 字面为“嘴唇”，在此借指言语；“言语甘甜”既保留“甜”的诗歌意象，也比“嘴唇甘甜”更符合现代汉语。
- source_word: יֹסִיף
  choice: 能增进
  rationale: 该使役形动词表示增加、增添；“能增进”自然表达甘甜言语所产生的效果。
- source_word: לֶקַח
  choice: 领受教诲的能力
  rationale: לֶקַח 可指所领受的教导、学习，也可在本语境中侧重言语的劝服或教学效果。正文采用“领受教诲的能力”，呈现听者更易接受教导这一关系，同时用脚注保留其他可能。
