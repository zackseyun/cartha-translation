  text: מְסִלַּ֣ת יְ֭שָׁרִים ס֣וּר מֵ/רָ֑ע שֹׁמֵ֥ר נַ֝פְשׁ֗/וֹ נֹצֵ֥ר דַּרְכּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/017.yaml
  text: The highway of the upright turns away from evil[b][a]; he who guards his life watches over his way.
translation:
  language: zh_hans
  text: 正直人的大道在于远离邪恶[a]；保全自己的性命[b]的人，谨守自己的道路。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“正直人的大道，是离开邪恶。”希伯来文可更形式对应地译为名词性表达。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译“自己的性命（נֶפֶשׁ）”；这里指“自己的生命”或“自己”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מְסִלַּת
  choice: 大道
  rationale: מְסִלָּה通常指修筑而成的大路或大道，比泛指的“道路”意象更鲜明；“大道”也适合智慧文学以道路喻人生行止的表达。
- source_word: יְשָׁרִים
  choice: 正直人
  rationale: 该词指品行端正的人。“正直人”自然地保留其伦理含义，又不与其他表示“义”的希伯来词完全等同。
- source_word: סוּר מֵרָע
  choice: 远离邪恶
  rationale: סוּר表达转身离开、避开的动作；“远离邪恶”在现代汉语中简洁自然，并保留其主动避恶的含义。
- source_word: רָע
  choice: 邪恶
  rationale: 本节处于道德行为的语境中，与正直相对，故译作“邪恶”比“祸患”或“坏事”更贴切。
- source_word: שֹׁמֵר נַפְשׁוֹ
  choice: 守护自己生命的人
  rationale: נֶפֶשׁ在这里指人的生命或自身，并非专指与身体相分离的“灵魂”；“守护自己生命”既保留生命含义，也切合自我保全的语境。
- source_word: נֹצֵר דַּרְכּוֹ
  choice: 谨慎自己的道路
  rationale: נצר表示留意看守、谨慎守护；“谨慎自己的道路”表达对自身行止的警醒，并避免与前半句的“守护”机械重复。“道路”保留箴言中行为和人生方向的惯用意象。
theological_decisions:
- issue: 智慧文学语境中נֶפֶשׁ的含义
  choice: 生命／自身，而非技术性意义上的“灵魂”
  alternative: 灵魂
  rationale: 本节论及道德行为与自我保全。译作“生命”不引入原文并未要求的身心二分观，同时涵盖整个人的存亡安危。
- issue: 首句名词结构的关系
  choice: 以“就是远离邪恶”表达正直人大道的实质
  alternative: 正直人的大道远离邪恶
  rationale: 希伯来文首句没有明说系词，סוּר מֵרָע可作名词性说明，界定这条大道在于离恶；正文采用自然的汉语判断句，同时以脚注保留更形式对应的名词表达。
translation_notes:
  register: 采用现代、庄重而易懂的箴言体。两分句保留希伯来文的道路意象和“守护／谨慎”的近义平行；不将נֶפֶשׁ处理为后期神学中的技术性“灵魂”概念。
