  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כָּֽל דַּרְכֵי אִ֭ישׁ זַ֣ךְ בְּ/עֵינָ֑י/ו וְ/תֹכֵ֖ן רוּח֣וֹת יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/002.yaml
  text: All a man's ways are pure in his own eyes[b][a], but Yahweh weighs the spirits.
translation:
  language: zh_hans
  text: 人所行的一切，在自己眼中都纯正；但耶和华衡量人的心灵。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “心灵”也可理解为人的内在倾向或动机；“衡量”也可译作“察验”或“评估”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל דַּרְכֵי אִישׁ
  choice: 人所行的一切
  rationale: דֶּרֶךְ在智慧文学中常指人的行事、生活道路，而非字面道路。此处用“人所行的一切”自然表达其整体行为，也保留אִישׁ在箴言中代表一般人的用法。
- source_word: זַךְ
  choice: 纯正
  rationale: זַךְ表示洁净、纯净；“纯正”既适合道德上的自我判断，又避免把意思过度限定为司法意义上的“无罪”。
- source_word: בְּעֵינָיו
  choice: 在自己眼中
  rationale: 直译并保留希伯来语习语，表示按照自己的看法或判断。
- source_word: וְתֹכֵן
  choice: 衡量
  rationale: תכן可指测量或称量；“衡量”保留原文的度量隐喻，并表达耶和华作出准确评判。
- source_word: רוּחוֹת
  choice: 人的心灵
  rationale: רוּחַ的复数在此最自然地指人的内在心灵、性情或倾向。“人的心灵”保留其广度；“动机”虽符合语境，却更窄、更具解释性。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经语境中广为人知的神名译法“耶和华”，以区别于称号“主”。
theological_decisions:
- issue: רוּחוֹת所指的内在人性层面
  choice: 人的心灵
  alternative: 人的动机／内在倾向
  rationale: 上下句对照人的自我评价与耶和华的鉴察。原词涵盖心灵、性情和内在倾向；正文不将它收窄为“动机”，脚注说明这一语境含义。
- issue: אִישׁ的代表性阳性用法
  choice: 人
  alternative: 男人／一个人的
  rationale: 此处阳性单数在箴言中具有泛指作用，适用于一般人。“人”在现代汉语中准确保留这种普遍指向，不额外限定为男性。
- issue: 人的自我判断与神的判断之间的张力
  choice: 保留“在自己眼中……但耶和华衡量……”的对照
  alternative: 明确解释为人自以为义、神却审判动机
  rationale: 原文没有明说每一种自我评价都虚假，也未把רוּחוֹת仅限定为动机；因此保留简洁而开放的对照，不加入超出原文的定论。
translation_notes:
  register: 采用简洁、对称、庄重的现代标准汉语，保留箴言的格言体节奏与“眼中／衡量”的评价对照。
