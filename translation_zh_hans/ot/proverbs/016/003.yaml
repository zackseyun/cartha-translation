base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/003.yaml
  text: Commit your works to Yahweh[b][a], and your plans will be established.
translation:
  language: zh_hans
  text: 把你所做的事交托给雅威[a]，你的计划[b]就必得以坚立。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“把你所做的事滚到雅威那里”；这一习语表示把这些事托付给他。
    reason: lexical_alternative
  - marker: b
    text: “计划”也可译作“思想”或“意图”。
    reason: lexical_alternative
lexical_decisions:
- source_word: גֹּל
  choice: 交托
  rationale: 该祈使形式字面意象是把某物“滚到”另一方那里；与“雅威”连用时，表达把事务托付给他的意思。“交托”在现代汉语中自然清楚，同时保留信赖与委托的含义。
- source_word: אֶל
  choice: 给
  rationale: 该介词表示朝向；在“交托给雅威”这一汉语搭配中，用“给”最自然。字面的“滚到……之上”则在脚注中说明。
- source_word: יְהוָה
  choice: 雅威
  rationale: 采用对希伯来神名四字母的现代汉语音译，以保留这里的专名，而不以“主”这一称号替代。
- source_word: מַעֲשֶׂיךָ
  choice: 你所做的事
  rationale: 该词可指行为、工作或所从事的事务。“你所做的事”范围宽广、现代易懂，不把含义限缩为带有道德评价色彩的“行为”。
- source_word: וְיִכֹּנוּ
  choice: 就必立稳
  rationale: כון的Nifal形式表示被确立、站立稳固。“立稳”保留其稳固的结果义；“就必”体现箴言中劝勉与结果之间明确的关联。
- source_word: מַחְשְׁבֹתֶיךָ
  choice: 你的计划
  rationale: 该名词可指思想、谋划或意图。与前句“所做的事”相呼应时，“计划”最符合此处实践性的语境，同时在脚注中保留其他可能含义。
theological_decisions:
- issue: 人的行动与上帝使计划立稳之间的关系
  choice: 经文劝人把自己所做的事交托给雅威，并陈述其计划将因此立稳。
  alternative: 把本节理解为上帝不顾人的回应而单方面决定一切计划，或理解为凡所筹划都保证获得世俗成功。
  rationale: 希伯来文以智慧文学的方式把命令与结果相连，却没有在本节展开完整的护理观，也没有保证每项事业都按人的愿望成功。译文保留这一张力，不加入决定论或成功神学式的解释。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“你所做的事”比“你的工作”涵盖面更广；“立稳”简洁保留原文的稳固意象。所有脚注标记均紧随其所说明的词语。
