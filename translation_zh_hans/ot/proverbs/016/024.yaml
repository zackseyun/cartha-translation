  source_fidelity: 草稿基本传达了箴言中良言、甘甜、内在生命与骨头得医治的平行意象，但“如蜂房滴蜜”将原文的名词性断言/比喻改为明示比较，并将有争议的“滴蜜”作为正文含义。“使生命甘甜”也把“对（内在生命）甘甜”的关系改成使役结构，汉语及原文对应均不够准确。
