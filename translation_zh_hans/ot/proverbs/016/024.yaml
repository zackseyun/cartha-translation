  rationale: 修订恢复了原文“悦人的话语—蜂巢蜜”的名词性表达，采用现代汉语自然的“蜂巢蜜”保留具体蜂蜜意象；将“使生命甘甜”改为“对心灵甘甜”，准确反映原文的关系；并以“有医治之效”对应名词“医治／疗效”。脚注保留蜂蜜短语及 נֶפֶשׁ 的词义范围。
