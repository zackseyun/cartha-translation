  terminology: “悦人的话语”可对应 אִמְרֵי נֹעַם；“蜂巢蜜”对应具体的 comb-honey 意象；“心灵”在正文中较自然，但脚注须说明 נֶפֶשׁ 也可指生命、自己或整个人，避免将其限定为二元论意义的灵魂。“医治之效”对应名词 מַרְפֵּא，且不强加具体医疗方式。
