base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/024.yaml
  text: Pleasant words are a honeycomb[b][a], sweet to the soul and healing to the bones.
translation:
  language: zh_hans
  text: 悦人的话语是蜂巢蜜[a]，对心灵[b]甘甜，对骨头有医治之效。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “蜂巢蜜”也可译为“蜂房中的蜜”或“蜜房”；希伯来语短语也有译作“滴蜜”或“流蜜”的可能。
    reason: lexical_alternative
  - marker: b
    text: “心灵”所译的希伯来词也可指“生命”“自己”“整个人”或“内在生命”。
    reason: lexical_alternative
lexical_decisions:
- source_word: צוּף דְּבַשׁ
  choice: 蜂房滴蜜
  rationale: 该短语可指蜂房中的蜜或滴下的蜂蜜；“蜂房滴蜜”既保留具体意象，也自然表达蜜的甘甜与丰盈。
- source_word: אִמְרֵי נֹעַם
  choice: 悦人的话
  rationale: אִמְרֵי 指话语，נֹעַם 表示愉悦、可喜；“悦人的话”清楚自然，又不把含义限定为某一种道德性质。
- source_word: מָתוֹק
  choice: 甘甜
  rationale: 保留与蜂蜜相呼应的味觉比喻；“甘甜”适合庄重而自然的智慧文学语体。
- source_word: לַנֶּפֶשׁ
  choice: 使生命
  rationale: נֶפֶשׁ 可指生命、自己、整个人或内在生命；此处“生命”比“灵魂”更能保留希伯来词的宽广含义，并与“骨头”构成整全的人体意象。
- source_word: וּמַרְפֵּא
  choice: 使……得医治
  rationale: מַרְפֵּא 可表示医治、疗效或良药；动词化处理使汉语平行句自然，同时保留医治意象。
- source_word: לָעָצֶם
  choice: 使骨头
  rationale: 希伯来文为单数集合用法，中文用“骨头”自然地表达全身骨骼，并保留原文具体的身体意象。
theological_decisions:
- issue: נֶפֶשׁ 的人论含义
  choice: 生命
  alternative: 心灵／灵魂／整个人
  rationale: 原词并不专指与身体分离的“灵魂”；选择“生命”以避免导入二元人论，同时用脚注保留其可指内在生命或整个人的语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的箴言体。以“悦人的话”避免将 נֹעַם 过度解释为专指恩慈或道德高尚；两次使用“使”形成汉语平行结构，并保留“甘甜—医治”“生命—骨头”的诗性对应。
