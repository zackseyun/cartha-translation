  text: אִ֣ישׁ תַּ֭הְפֻּכוֹת יְשַׁלַּ֣ח מָד֑וֹן וְ֝/נִרְגָּ֗ מַפְרִ֥יד אַלּֽוּף׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/028.yaml
  text: A perverse man stirs up strife[c][b][a], and a whisperer separates close friends.
translation:
  language: zh_hans
  text: 乖谬的人挑起纷争[a]；搬弄是非的人[b]离间密友[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “挑起”直译为“放出”或“发出”；“乖谬”也可译为“悖谬”或“邪曲”。
    reason: lexical_alternative
  - marker: b
    text: “搬弄是非的人”也可译为“暗中传话的人”或“说人坏话的人”；原词着重于私下低语并破坏关系的人。
    reason: lexical_alternative
  - marker: c
    text: “密友”也可译为“亲密伙伴”或“知己”；希伯来语为单数。
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ תַּהְפֻּכוֹת
  choice: 乖谬的人
  rationale: 希伯来语直译近于“乖谬之人”；“乖谬的人”自然、凝练，保留其品性扭曲、行事不正的含义，而不把语义限于某一种罪行。
- source_word: יְשַׁלַּח
  choice: 挑起
  rationale: 该动词字面为“放出、发出”；与“纷争”搭配时，表示使争端发动、蔓延。“挑起”符合现代汉语习惯，并保留其致使作用。
- source_word: מָדוֹן
  choice: 纷争
  rationale: 这是箴言中常见的智慧文学用语，指争吵、冲突或不和；“纷争”简洁且涵盖面适当。
- source_word: נִרְגָּן
  choice: 搬弄是非的人
  rationale: 该词指暗中低语、传播闲话而损害关系的人。“搬弄是非的人”在现代汉语中清楚表达其破坏性言语行为；脚注保留“暗中传话的人”等较贴近意象的译法。
- source_word: מַפְרִיד
  choice: 离间
  rationale: 分词描述这种人的惯常行为；“离间”既表达使人分开，也凸显关系遭言语破坏的语境。
- source_word: אַלּוּף
  choice: 密友
  rationale: 此处不是“首领”，而是亲密伙伴、知己。希伯来语为单数，译作“密友”可保留形式，也能表达箴言的一般性。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的箴言体。两分句结构平行；“挑起纷争”与“离间密友”简洁有力。保留原文第二分句单数“密友”，不擅自改为复数。
