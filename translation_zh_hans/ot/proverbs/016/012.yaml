  text: תּוֹעֲבַ֣ת מְ֭לָכִים עֲשׂ֣וֹת רֶ֑שַׁע כִּ֥י בִ֝/צְדָקָ֗ה יִכּ֥וֹן כִּסֵּֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/012.yaml
  text: It is an abomination for kings to do wickedness[a], for a throne is established by righteousness.
translation:
  language: zh_hans
  text: 君王作恶，是可憎的；因为王位靠公义得以稳固。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “靠公义”也可译作“靠公正”。
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹעֲבַת
  choice: 是可憎的
  rationale: 该词表示在道德上令人厌恶、憎恶之事；译为“是可憎的”既保留强烈的道德分量，也符合现代汉语表达。
- source_word: מְלָכִים
  choice: 君王
  rationale: 原文为复数，泛指君王这一类统治者；汉语零形态名词“君王”在这里自然地表达类指，无须加“众”。
- source_word: עֲשׂוֹת רֶשַׁע
  choice: 作恶
  rationale: עֲשׂוֹת意为“做、行”，רֶשַׁע指邪恶或不义之事；合译“作恶”简洁有力，并保留箴言式措辞。
- source_word: כִּי
  choice: 因为
  rationale: 此处引出前句的理由，现代汉语用“因为”清楚自然。
- source_word: בִצְדָקָה
  choice: 靠公义
  rationale: 介词ב表示凭借或基础；צְדָקָה涵盖合乎正道的品格与作为，在王权语境中也含秉公治理之意。“靠公义”保留其较宽的道德内涵。
- source_word: יִכּוֹן
  choice: 得以稳固
  rationale: כון的尼法勒式表达被建立、坚立或保持稳固；“得以稳固”自然呈现王位因公义而坚立的因果关系。
- source_word: כִּסֵּא
  choice: 王位
  rationale: 字面为“宝座”，在此借指王权或君王的统治地位；现代汉语“王位”能自然承接“稳固”，同时保留政治意象。
theological_decisions:
- issue: 王权语境中צְדָקָה的译法
  choice: 公义
  alternative: 公正
  rationale: “公义”保留该词兼具道德正直与合宜行为的广度；因上下文涉及君王治理，“公正”也是切合语境的可能译法，故列入脚注，不将其含义悄然限缩为司法层面的公平。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语，维持希伯来箴言前后两分句的因果结构。“君王”作类指用法；“王位”比直译“宝座”更清楚地传达此处所指的统治权位。
