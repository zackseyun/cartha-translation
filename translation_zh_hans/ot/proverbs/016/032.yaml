  text: ט֤וֹב אֶ֣רֶךְ אַ֭פַּיִם מִ/גִּבּ֑וֹר וּ/מֹשֵׁ֥ל בְּ֝/רוּח֗/וֹ מִ/לֹּכֵ֥ד עִֽיר׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/032.yaml
  text: Better is one who is slow to anger than a mighty man[b][a], and one who rules his spirit than one who captures a city.
translation:
  language: zh_hans
  text: 不轻易发怒的，胜过勇士；能约束自己心灵[a]的，胜过攻取城池的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “心灵”也可译作“性情”或“自己”。原文所用的词可指人的内在倾向和冲动。
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: 胜过
  rationale: 本节以 טוֹב 配合比较介词 מִן 构成“前者胜过后者”的智慧文学比较句；汉语用“胜过”自然、凝练，并保留箴言的对称结构。
- source_word: אֶרֶךְ אַפַּיִם
  choice: 不轻易发怒的
  rationale: 这是希伯来语惯用语，字面为“鼻孔长的”，实际指不急于动怒。译为“不轻易发怒”既准确又符合现代汉语表达。
- source_word: מִגִּבּוֹר
  choice: 胜过勇士
  rationale: גִּבּוֹר 可指强者、勇士，且本节下半句明确涉及攻城，军事语境较强；“勇士”兼顾力量与作战含义。
- source_word: וּמֹשֵׁל
  choice: 能管住
  rationale: מֹשֵׁל 是表示持续特征的分词，意为治理、掌管。结合内在对象 רוּחַ，“能管住”在现代汉语中自然表达自我约束，同时保留主动掌控之意。
- source_word: בְּרוּחוֹ
  choice: 自己心灵
  rationale: רוּחַ 可指灵、气息、性情或内在倾向。此处是人需要约束的内在冲动与性情；“自己心灵”保留原词的宽度，避免仅限于“脾气”，脚注说明其他可能表达。
- source_word: מִלֹּכֵד עִיר
  choice: 胜过攻取城池的人
  rationale: לכד 常用于军事上的夺取、攻占；“攻取城池”简洁有力，与“勇士”呼应，并凸显征服内在自我胜于外在军事功绩。
theological_decisions:
- issue: 智慧文学语境中 רוּחַ 的人论含义
  choice: 译作“自己心灵”，指人的内在性情、意念与冲动
  alternative: 译作“自己”作宽泛意译，或译作“脾气”作较窄解释
  rationale: 经文将对内在生命的掌控与攻城相对照。“心灵”保留 רוּחַ 的语义广度，不把它缩减为单一情绪，也不以笼统的“自己”抹去原文用词。
translation_notes:
  register: 采用简洁、对称而庄重的现代标准汉语，保持箴言格言体的节奏。“不轻易发怒”与“能管住自己心灵”对应，“勇士”与“攻取城池的人”构成军事意象的递进。
