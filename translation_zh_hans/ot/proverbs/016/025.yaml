base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/025.yaml
  text: There is a way that seems right before a man, but its end is the ways of death.
translation:
  language: zh_hans
  text: 有一条路，在人看来是正直的；它的结局却是死亡之路。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “死亡之路”：原文直译为“死亡的众路”。
    reason: 说明希伯来文 דַּרְכֵי 为复数；中文正文采用自然的集合性单数表达。
lexical_decisions:
- source_word: יֵשׁ דֶּרֶךְ
  choice: 有一条路
  rationale: 保留希伯来文存在句式及单数“路”的意象。
- source_word: יָשָׁר לִפְנֵי אִישׁ
  choice: 人看为正直
  rationale: לִפְנֵי 字面为“在……面前”；在此表达按某人的判断显得正直。译作“看为正直”既符合现代汉语，也保留道德判断色彩。
- source_word: וְאַחֲרִיתָהּ
  choice: 最终却
  rationale: אַחֲרִית 指一事的终局或结局；“却”体现前后反转，虽非独立词汇，却传达 וְ 在对比语境中的功能。
- source_word: דַּרְכֵי מָוֶת
  choice: 通向死亡的路
  rationale: 原文是复数“死亡之路”。正文以自然汉语表达其归宿，并用脚注保留复数形式这一异常而有力的原文细节。
theological_decisions:
- issue: 人的判断与道路真实结局之间的张力
  choice: 人看为正直，最终却是通向死亡的路
  alternative: 在人面前正直，结局却是死亡之路
  rationale: 不把经文扩展成特定的罪论或救恩论命题，只呈现人的判断可能与真实终局相反。
- issue: דַּרְכֵי מָוֶת 的复数形式
  choice: 正文采用自然的单数集合表达，并加脚注说明
  alternative: 结局却是死亡的众路
  rationale: 直译复数在现代汉语中生硬且可能误导为多条具体道路；脚注保存原文形式，不消解其修辞张力。
translation_notes:
  register: 采用简洁、警策的箴言体。用“正直”对应 יָשָׁר，保留其道德分量；避免较口语的“觉得是对的”。脚注标记已置于正文。
