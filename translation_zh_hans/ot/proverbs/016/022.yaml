base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/022.yaml
  text: Understanding is a fountain of life to its possessor[b][a], but the discipline of fools is folly.
translation:
  language: zh_hans
  text: 明智是拥有它的人的生命泉源[a]；愚昧人的管教却是愚妄[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “拥有它的人”直译为“它的拥有者”，即拥有明智的人。
    reason: lexical_alternative
  - marker: b
    text: “管教”也可译作“训诲”或“纠正”。原文中“愚昧人”与“管教”的关系含蓄；全句强调，与愚昧人相关的管教终归不过是愚妄。
    reason: lexical_and_syntactic_ambiguity
lexical_decisions:
- source_word: מְקוֹר
  choice: 泉源
  rationale: 该词可指泉、源头；“泉源”保留具体而富有生命力的比喻，也符合现代汉语的箴言体表达。
- source_word: חַיִּים
  choice: 生命
  rationale: 虽为复数形式，在希伯来语中通常作抽象名词，意为“生命”。
- source_word: שֵׂכֶל
  choice: 明智
  rationale: 此词在《箴言》中常指切合实际的理解力、见识和审慎；“明智”自然简洁，并与下句的“愚妄”形成鲜明对照。
- source_word: בְּעָלָיו
  choice: 拥有它之人
  rationale: 字面为“它的主人／拥有者”，所指为拥有明智的人；此译法保留单数关系，又避免“主人”在汉语中的歧义。
- source_word: מוּסַר
  choice: 管教
  rationale: 该词涵盖训诲、纠正和纪律性管教。此处与“愚妄”并列，语义关系存在张力，因此正文采用范围较广且常见的“管教”。
- source_word: אֱוִילִים
  choice: 愚昧人
  rationale: 《箴言》中这一称谓不仅指智力不足，更指顽梗、缺乏道德判断的人；“愚昧人”是准确而自然的传统智慧文学用语。
- source_word: אִוֶּלֶת
  choice: 愚妄
  rationale: 该抽象名词指愚昧人的典型品质或行为；“愚妄”凝练，并保留箴言末尾的警策感。
theological_decisions:
- issue: “愚昧人的管教是愚妄”中属格及谓语关系的含义
  choice: 保留“愚昧人的管教却是愚妄”这一紧凑而略带歧义的表述
  alternative: “对愚昧人的管教只是愚妄”或“愚昧人所受的教训仍是愚妄”
  rationale: 希伯来语可使人理解为愚昧人所受、所有或所施的管教，而本句并未明确限定。正文不把这种张力归结为单一解释，脚注提示主要词义范围。
translation_notes:
  register: 采用现代、庄重而简洁的箴言体。“生命泉源”保留原文意象；分号及“却”凸显两行对照。所有脚注标记均置于正文相应位置。
