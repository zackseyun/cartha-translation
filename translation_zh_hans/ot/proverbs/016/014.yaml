  text: חֲמַת מֶ֥לֶךְ מַלְאֲכֵי מָ֑וֶת וְ/אִ֖ישׁ חָכָ֣ם יְכַפְּרֶֽ/נָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/014.yaml
  text: The wrath of a king is messengers of death[b][a], but a wise man will appease it.
translation:
  language: zh_hans
  text: '王的震怒是死亡的使者[a]；

    智慧人却能平息这怒气[b]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “使者”也可译为“天使”；在这里较可能指奉王命行事的人。
    reason: lexical_alternative
  - marker: b
    text: “平息”所译的希伯来语动词，与常译作“赎罪”的动词同根；这里指安抚或转去王的震怒。
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲמַת
  choice: 震怒
  rationale: 该词表示炽烈的愤怒；“震怒”既保留庄重、强烈的语气，也与下句所暗示的致命危险相称。
- source_word: מֶלֶךְ
  choice: 王
  rationale: 原文具体指君王；“王”简洁自然，并保留古代宫廷背景。
- source_word: מַלְאֲכֵי מָוֶת
  choice: 死亡的使者
  rationale: 按原文保留生动的属格结构。“使者”在此最可能指奉王命行动的人，而非超自然的天使。为使中文比喻通顺，加入“如同”，表达王怒会带来执行死亡命令的使者。
- source_word: וְאִישׁ חָכָם
  choice: 智慧人却
  rationale: “却”体现两分句之间的转折；“智慧人”保留阳性单数的代表性人物表达，同时符合箴言体的传统而自然的中文用语。
- source_word: יְכַפְּרֶנָּה
  choice: 能使其平息
  rationale: 此处阴性宾语后缀回指“震怒”。כפר 的 piel 形式在本语境中表示安抚、消解或转去怒气，而非专指祭仪性的赎罪。“使其平息”清楚表达语境义。
theological_decisions:
- issue: כפר 应采用祭仪性的“赎罪”用语，还是非祭仪性的“平息”用语
  choice: 采用非祭仪性的“使其平息”
  alternative: 为其赎罪；将其安抚
  rationale: 直接语境是君王的怒气，并非献祭或圣所礼仪。因此正文表达平息怒气，同时用脚注保留该词根常用于赎罪语境这一词义联系，避免把祭仪神学强加于本节。
translation_notes:
  register: 采用现代、庄重而易懂的箴言体。上下两行保持鲜明对照；正文保留“死亡的使者”这一原文意象，并以“如同”使汉语表达自然，避免被误读为抽象的等同判断。脚注标记均置于相应词句之后。
