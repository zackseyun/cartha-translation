base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/009.yaml
  text: A man's heart plans his way[a], but Yahweh establishes his steps.
translation:
  language: zh_hans
  text: 人心筹划自己的道路，耶和华却使他的脚步稳固[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“确立他的脚步”或“引导他的脚步”。原文动词可指使之坚定、稳固或确立；按本处语境也可理解为引导。
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵב
  choice: 心
  rationale: 希伯来语“心”在此指人的内在思考与意志中心；中文“心”既保留原文意象，也能自然表达谋划的主体。
- source_word: אָדָם
  choice: 人
  rationale: 此处为泛指单数，表示一个具有代表性的个人；现代汉语用“人”自然且不额外限定性别。
- source_word: יְחַשֵּׁב
  choice: 筹划
  rationale: 该动词的加强词干表达有意识地思量、谋划；“筹划”简洁而符合箴言体。
- source_word: דַּרְכּוֹ
  choice: 自己的道路
  rationale: “道路”保留原文可兼指实际路径和人生行程的隐喻，并与下句“脚步”呼应。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名形式呈现四字神名，而不以称号替代。
- source_word: יָכִין
  choice: 使……稳妥
  rationale: 该使役形式可指使之坚定、确立或安置稳固；“使……稳妥”保留其使役与稳固含义，同时不把语义缩窄为单纯引导。
- source_word: צַעֲדוֹ
  choice: 他的脚步
  rationale: 原词虽为单数形式，却可集合性地指人的步履；中文“脚步”自然保留具体意象及人生行动的隐喻。
theological_decisions:
- issue: 上帝的主权与人的筹划
  choice: 保留人真实筹划自己的道路，同时由耶和华使其实际脚步稳妥的并置。
  alternative: 译作“耶和华指引他的脚步”或“耶和华决定他的脚步”。
  rationale: 原文没有否定人的筹划，却把脚步最终得以确立归于耶和华。“使……稳妥”避免把含义仅解释为引导，也避免强化为排除人意志的决定论。
translation_notes:
  register: 采用简洁、对称的现代箴言体。“人心”凝练自然；“道路—脚步”保留原文平行意象。“却”明确两个分句之间的转折，而不消解其中的人神张力。
