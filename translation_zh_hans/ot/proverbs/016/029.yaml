  text: אִ֣ישׁ חָ֭מָס יְפַתֶּ֣ה רֵעֵ֑/הוּ וְ֝/הוֹלִיכ֗/וֹ בְּ/דֶ֣רֶךְ לֹא טֽוֹב־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/029.yaml
  text: A violent man entices his neighbor and leads him in a way that is not good[a][b].
translation:
  language: zh_hans
  text: 残暴的人引诱邻舍[a]，带他走上不善的道路[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“朋友”或“同伴”。
    reason: lexical_alternative
  - marker: b
    text: 直译“在一条不好的道路上”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ חָמָס
  choice: 强暴的人
  rationale: 该短语指以暴力、残害或不法行为为特征的人。“强暴的人”自然地保留了חָמָס的强烈道德意味，也没有把含义缩窄为某一次暴力行为。
- source_word: יְפַתֶּה
  choice: 引诱
  rationale: פתה的Piel形式在此表示诱使别人走向错误的方向；“引诱”保留其道德诱导意味，同时不额外强调欺骗手段或性意味。
- source_word: רֵעֵהוּ
  choice: 邻舍
  rationale: רֵעַ可指邻舍、朋友或同伴。正文采用圣经语境中涵盖面较广的“邻舍”，不预设双方有亲密友情。
- source_word: וְהוֹלִיכוֹ
  choice: 领他走上
  rationale: הלך的Hiphil形式带有使役意义，即使某人行走或带领某人前行。“领他走上”在中文中自然，并与后面的道路意象衔接。
- source_word: בְּדֶרֶךְ לֹא טוֹב
  choice: 走上不善的道路
  rationale: 保留דֶרֶךְ的道路隐喻，并将字面的“不好”译为较庄重且具有道德含义的“不善”，而不强化为原文未直接使用的“邪恶”。
theological_decisions:
- issue: “不善”所表达的道德程度
  choice: 不善的道路
  alternative: 邪恶的道路
  rationale: 原文是לֹא טוֹב，直译为“不好／非善”，并未直接使用通常译作“邪恶”的词。采用“不善”既保留道德评价，也不把措辞无根据地强化。
translation_notes:
  register: 采用简洁、庄重而通顺的现代标准汉语。“邻舍”略带圣经文体色彩，但普通读者可理解；整句保留智慧文学的道路隐喻和原文简练的警戒语气。
