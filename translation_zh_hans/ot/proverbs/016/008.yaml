  text: טוֹב מְ֭עַט בִּ/צְדָקָ֑ה מֵ/רֹ֥ב תְּ֝בוּא֗וֹת בְּ/לֹ֣א מִשְׁפָּֽט־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/008.yaml
  text: Better a little with righteousness than great income without justice.
translation:
  language: zh_hans
  text: 宁可财物少而行公义，也不要收入丰厚却不公正。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: טוֹב ... מִן
  choice: 宁可……也不要……
  rationale: 准确表达希伯来语比较结构“前者好过后者”，并使中文格言简洁自然。
- source_word: מְעַט
  choice: 财物少
  rationale: 原文只说“少”，所指可由后半句“收入”推知；补出“财物”能使现代中文完整，又不过度限定为现金。
- source_word: בִּצְדָקָה
  choice: 而行公义
  rationale: צְדָקָה 在此指合乎正直、公义的处世与得财方式；“行公义”保留其道德和关系层面的含义。
- source_word: רֹב תְּבוּאוֹת
  choice: 收入丰厚
  rationale: תְּבוּאוֹת 字面可指收成、所得或收益，复数与 רֹב 合用表示大量进项；“收入丰厚”符合本节财富对比的语境。
- source_word: בְּלֹא מִשְׁפָּט
  choice: 却不公正
  rationale: מִשְׁפָּט 可指公平、正义或公正的裁断；此处与“公义”对举，“不公正”既保留广度，也自然涵盖不义手段。
theological_decisions:
- issue: 公义与物质丰裕的价值次序
  choice: 将少有而行公义置于丰厚却不公正之上
  alternative: 把经文理解为义人必然贫穷，或财富本身有罪
  rationale: 原文作伦理比较，谴责的是缺乏公正的丰厚所得，并未绝对否定财富，也未声称公义必然导致贫穷。
translation_notes:
  register: 采用现代、凝练的箴言体。两个分句结构平衡，以“宁可……也不要……”清楚呈现希伯来语的价值比较；不加脚注，因为正文可以直接传达原文，没有必须另注的文本歧义。
