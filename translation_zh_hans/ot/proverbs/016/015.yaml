  text: In the light of a king’s face there is life[b][a], and his favor is like a cloud of spring rain.
translation:
  language: zh_hans
  text: 君王脸上的光彩中有生命[a]；他的恩宠如春雨的云[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的“脸上的光彩”描绘君王喜悦、悦纳的神情；他的善意带来生命和福祉。
    reason: cultural_note
  - marker: b
    text: “春雨”直译可作“后雨”或“晚雨”，指生长季后期、通常在春季降下、滋润庄稼并帮助作物成熟的季节性雨。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּ/אוֹר פְּנֵי מֶלֶךְ
  choice: 王面带光彩
  rationale: 保留“王的脸之光”这一具体意象，同时用现代汉语自然表达君王显出喜悦、悦纳的神情；不直接改译为较抽象的“王的恩宠”。
- source_word: חַיִּים
  choice: 就有生命
  rationale: 希伯来语为无系词名词句，复数形式在此惯指生命、存活；补出“有”，使汉语通顺而不增加解释。
- source_word: וּ/רְצוֹנ/וֹ
  choice: 他的恩宠
  rationale: רָצוֹן可指喜悦、悦纳、善意或恩惠；王权语境中“恩宠”兼顾君王的悦纳与由此而来的好处。
- source_word: כְּ/עָב
  choice: 如……的云
  rationale: 按比较词כְּ保留明喻，以自然汉语呈现。
- source_word: מַלְקוֹשׁ
  choice: 带来春雨
  rationale: מַלְקוֹשׁ指农作物成熟前的后期季雨，通常落在春季；“春雨”便于现代读者理解，“带来”明确云与雨的自然关系，较“春雨之云”自然。
theological_decisions: []
translation_notes:
  register: 采用简洁、对称的箴言体。正文保留“脸上的光彩”“生命”和雨云的具体意象，以现代、庄重而易懂的普通话表达；脚注只补充王室语境及古代农业季雨背景。
