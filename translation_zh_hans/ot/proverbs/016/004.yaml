  text: כֹּ֤ל פָּעַ֣ל יְ֭הוָה לַֽ/מַּעֲנֵ֑/הוּ וְ/גַם רָ֝שָׁ֗ע לְ/י֣וֹם רָעָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/004.yaml
  text: Yahweh has made everything for its purpose[b][a], even the wicked for the day of disaster.
translation:
  language: zh_hans
  text: 耶和华造万物，各有其目的[a]；连恶人也为灾祸之日而造[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“耶和华为自己造了万物。”原文短语也可这样理解。
    reason: lexical_alternative
  - marker: b
    text: “灾祸之日”也可译作“患难之日”或“灾难之日”。这里的“祸”指灾难或毁灭，并非道德上的邪恶。
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל
  choice: 万物
  rationale: 该词表示“一切、所有事物”；“万物”在现代中文中简洁庄重，并保留其涵盖一切的范围。
- source_word: פָּעַל
  choice: 使
  rationale: 此动词可表示“做、造、成就”。结合后面的目的性短语，译作“使万物各有其目的”较自然，表达耶和华使一切各有所归，而不把经文过度限定为单指起初创造。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神圣名字“耶和华”，而非以“主”这一称号替代。
- source_word: לַמַּעֲנֵהוּ
  choice: 各有其目的
  rationale: מַעֲנֶה通常与“回答、回应”相关，但本句含义有争议；在箴言语境中可理解为相应的目的或归宿。译文表达目的性，同时用脚注保留“为自己”的另一种理解。
- source_word: וְגַם
  choice: 甚至
  rationale: 该组合带有递进强调，指出恶人也包括在前述范围内。
- source_word: רָשָׁע
  choice: 恶人
  rationale: 阳性单数形容词在此作名词，泛指作恶的人；“恶人”是自然、简明的中文表达。
- source_word: לְיוֹם רָעָה
  choice: 有遭灾祸的日子
  rationale: רָעָה在这里指灾祸、毁灭，而非道德上的邪恶；此译法避免误解为神使恶人行恶，并保留其面向灾祸之日的含义。
theological_decisions:
- issue: 本节是否说神创造恶人去行道德上的恶
  choice: 经文宣告耶和华使万物各有相应的目的或结局，连恶人也将面对灾祸之日。
  alternative: 耶和华为自己造了万物，甚至造恶人为了邪恶之日。
  rationale: 原文强调神的主权及万事各有归宿，但并未明确说神是道德邪恶的创始者。将 רָעָה 译为“灾祸”，既符合该词在此处的语义，也保留恶人与审判性灾祸之间令人警醒的张力。
- issue: לַמַּעֲנֵהוּ中第三人称阳性单数后缀所指为何
  choice: 正文按集合性的“万物”理解为“各有其目的”。
  alternative: 后缀指耶和华，意为“为自己”。
  rationale: 两种分析在语法和解释传统中都存在。正文采用较符合本句目的论结构的读法，脚注明确保留“为自己”，不把歧义悄然消除。
translation_notes:
  register: 采用现代、简洁而庄重的普通话。“使万物各有其目的”避免生硬直译，同时保留原文关于神主权和事物归宿的陈述；两个脚注分别呈现关键语义歧义及“灾祸”的含义。
