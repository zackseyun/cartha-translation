  text: קְֽנֹה חָכְמָ֗ה מַה טּ֥וֹב מֵ/חָר֑וּץ וּ/קְנ֥וֹת בִּ֝ינָ֗ה נִבְחָ֥ר מִ/כָּֽסֶף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/016.yaml
  text: To acquire wisdom—how much better than gold! And to acquire understanding is to be chosen over silver.
translation:
  language: zh_hans
  text: 获得智慧，何等胜过精金！获得聪明，比银子更值得选择。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קְנֹה / וּקְנוֹת
  choice: 获得
  rationale: 两个形式都源自动词 קנה，意为取得、获得；以重复的“获得”保留原文两分句的平行结构。
- source_word: חָכְמָה
  choice: 智慧
  rationale: 箴言中的常用核心词，既包括明智判断，也包括合宜生活的能力；“智慧”是自然且稳定的对应。
- source_word: חָרוּץ
  choice: 精金
  rationale: 该词在此指贵重的黄金，可能侧重经过提炼的金；“精金”保留其高价值和诗体色彩。
- source_word: בִּינָה
  choice: 聪明
  rationale: 指辨识、理解和洞察的能力；“聪明”与“智慧”形成传统而自然的箴言式搭配。
- source_word: נִבְחָר
  choice: 更值得选择
  rationale: 尼法勒分词表达“被选择、可取、当选”的价值判断；译为“更值得选择”既保留选择意象，也符合现代汉语。
- source_word: כָּסֶף
  choice: 银子
  rationale: 在与金并列比较的语境中指贵金属银；“银子”通俗、明确。
theological_decisions:
- issue: 智慧与财富的比较强度
  choice: 保留“何等胜过”与“更值得选择”的强烈优先关系
  alternative: 仅译作“比……好”或将其解释为财富本身有罪
  rationale: 原文强调智慧和聪明在价值上远超金银，却没有否定金银的一切正当用途，因此不作额外的道德或教义推断。
- issue: 第二分句 נִבְחָר 的语态和主体
  choice: 译作“比银子更值得选择”
  alternative: 译作命令式“应当选择聪明而不是银子”
  rationale: 原文使用尼法勒分词，形式上是“被选择/可取”；采用价值陈述，避免把它无根据地改成直接命令。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。保留原文对称结构及第一分句的感叹力度；第二分句略作汉语化，以避免生硬的被动句。
