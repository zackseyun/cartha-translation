  text: לִ/פְנֵי שֶׁ֥בֶר גָּא֑וֹן וְ/לִ/פְנֵ֥י כִ֝שָּׁל֗וֹן גֹּ֣בַהּ רֽוּחַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/018.yaml
  text: Pride comes before destruction[a], and a haughty spirit before a fall.
translation:
  language: zh_hans
  text: 骄傲在毁灭之前；心高气傲在跌倒之前。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“在毁灭之前，是骄傲；在跌倒之前，是灵的高傲。”
    reason: 说明原文倒装式的平行结构，并保留“灵的高傲”这一较为字面的表达。
lexical_decisions:
- source_word: לִפְנֵי
  choice: 在……以先／在……之前
  rationale: 此处是时间意义，表示某种品性先于相应的败亡结局；两分句采用近义表达，既自然又保留平行结构。
- source_word: שֶׁבֶר
  choice: 毁灭
  rationale: 该词本义涉及破碎，在智慧文学语境中可指毁坏、败亡；“毁灭”准确表达严重的崩毁结局，并与下句“跌倒”相呼应。
- source_word: גָּאוֹן
  choice: 骄傲
  rationale: 该词在别处可表示威严或高升，但这里与毁灭相连，语境明确要求负面的“骄傲”。
- source_word: וְלִפְנֵי
  choice: 在……之前
  rationale: 重复“在……之前”的时间关系，保存希伯来诗句均衡的同义平行。中文以分号连接，省去生硬的“并且”。
- source_word: כִּשָּׁלוֹן
  choice: 跌倒
  rationale: 该名词可指绊跌、失足或败落；“跌倒”保留原文具体意象，同时在箴言中自然指向败落。
- source_word: גֹּבַהּ רוּחַ
  choice: 心高气傲
  rationale: 原文直译为“灵的高昂／高傲”。“心高气傲”是现代汉语自然且庄重的表达，清楚传达内在的傲慢；脚注补明原文含“灵”的措辞。
theological_decisions:
- issue: גָּאוֹן 与 גֹּבַהּ רוּחַ 的道德性质
  choice: 均按负面意义译为“骄傲／心高气傲”
  alternative: 分别译作“威严”或较中性的“灵里高昂”
  rationale: 上下两行把这些内在特质分别置于毁灭与跌倒之前，同义平行明确指向负面的伦理含义；这是由词义和上下文决定，并非加入特定宗派解释。
translation_notes:
  register: 采用简洁、庄重而易懂的现代标准汉语。正文用“心高气傲”自然传达 גֹּבַהּ רוּחַ 的惯用含义，脚注则保留其较直译的“灵的高傲”。标点以分号凸显两行平行关系。
