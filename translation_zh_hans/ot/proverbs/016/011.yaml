  text: פֶּ֤לֶס וּ/מֹאזְנֵ֣י מִ֭שְׁפָּט לַֽ/יהוָ֑ה מַ֝עֲשֵׂ֗/הוּ כָּל אַבְנֵי כִֽיס׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/011.yaml
  text: A just balance and scales belong to Yahweh[a]; all the weights in the bag are his work.
translation:
  language: zh_hans
  text: 公道的秤和天平都属于雅威；袋中所有的砝码[a]都是他的作为。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “砝码”直译为“袋中的石头”；当时用一定重量的石块作称量用的砝码。
    reason: 说明原文的字面表达及其历史语境。
lexical_decisions:
- source_word: פֶּלֶס
  choice: 秤
  rationale: 指称衡量重量的器具；译作“秤”自然明白，并与下文“天平”形成近义并列。
- source_word: וּמֹאזְנֵי
  choice: 和天平
  rationale: מֹאזְנַיִם通常指双盘秤或天平；用“天平”与פֶּלֶס有所区分，同时保留原文平行结构。
- source_word: מִשְׁפָּט
  choice: 公道的
  rationale: 此处“公正、公义”修饰衡器，强调衡量合乎公平；“公道的”符合现代汉语商业伦理语境。
- source_word: לַיהוָה
  choice: 都属于雅威
  rationale: 介词ל在此表达归属或所属；“属于雅威”清楚传达公平衡量的准则归于雅威掌管。
- source_word: מַעֲשֵׂהוּ
  choice: 都是他的作为
  rationale: 原词可指他所做、所造或所成就的事。“他的作为”保留其宽泛性，避免只限定为物质制造，也不把含义过度解释为制度设定。
- source_word: כָּל
  choice: 所有的
  rationale: 准确表达全称范围，且与复数“砝码”搭配自然。
- source_word: אַבְנֵי
  choice: 砝码
  rationale: 字面为“石头”，在秤量和袋子的语境中指用作标准重量的石制砝码；正文采用功能性译法，字面意义收入脚注。
- source_word: כִיס
  choice: 袋中
  rationale: 指商人盛放砝码的袋或囊；“袋中”简洁自然。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较贴近其通常学术重构的读音，并保留专名性质。
- issue: 本节关于衡器与砝码的宣称
  choice: 公平的衡量准则属于雅威，袋中砝码也是他的作为
  alternative: 仅指雅威创造了物质性的衡器和石头
  rationale: “公道”及衡量器具的语义场表明经文具有公平交易的伦理意涵；同时保留“他的作为”的宽泛表达，不把经文限定为物质创造，也不声称雅威认可任何实际存在的市场标准。
translation_notes:
  register: 采用现代、庄重而通俗的普通话。“秤和天平”保留希伯来文近义并列；“他的作为”刻意保留原文可指所做、所造或所安排之事的语义张力。
