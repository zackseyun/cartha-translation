source:
  edition: WLC
  text: בִּ/רְצ֣וֹת יְ֭הוָה דַּרְכֵי אִ֑ישׁ גַּם א֝וֹיְבָ֗י/ו יַשְׁלִ֥ם אִתּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/007.yaml
  text: When a man's ways please Yahweh[a], he makes even his enemies be at peace with him.
translation:
  language: zh_hans
  text: 人的道路若蒙耶和华喜悦，耶和华甚至使那人的仇敌与他和睦。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּרְצוֹת
  choice: 若蒙……喜悦
  rationale: 介词 בְּ 加 רצה 的不定式构造在此引出条件兼时间性的从句；“若蒙……喜悦”自然表达行为得到耶和华认可的意思。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经传统中对四字神名的通行音译，保留其作为专名的性质，而不以称号代替。
- source_word: דַּרְכֵי אִישׁ
  choice: 人的道路
  rationale: “道路”在智慧文学中指人的行事为人和生活方式；אִישׁ 在此为泛指，中文“人”能自然保留这种代表性意义。
- source_word: גַּם
  choice: 甚至
  rationale: 表达递进和强调：耶和华所造成的结果甚至延及这人的仇敌。
- source_word: אֹיְבָיו
  choice: 这人的仇敌
  rationale: 明确其复数所属关系，并避免连续使用“他”而造成耶和华与那人之间的指代混淆。
- source_word: יַשְׁלִם אִתּוֹ
  choice: 使……与他和睦
  rationale: יַשְׁלִם 是 שלם 的使役形，结合 אִתּוֹ，最自然地表示“使之与他和平相处”；译文保留了使役意义。
theological_decisions:
- issue: אִישׁ 的泛指性质
  choice: 人
  alternative: 男人
  rationale: 此处并非专指某一男性，而是以单数泛指任何人；现代汉语的“人”准确传达这一范围，也不增添原文没有的性别限制。
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 上主／雅威
  rationale: “耶和华”是现代标准汉语中广为人知的专名形式，能够保留原文神名而非将其改为普通称号。
- issue: יַשְׁלִם 的主语
  choice: 明确重复“耶和华”
  alternative: 以“他”承接
  rationale: 希伯来语动词的主语自然承接前句的耶和华；中文若只用“他”容易误指前面的“人”，故重复专名以消除非原文所具有的指代混乱。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语，保留箴言的概括性与因果张力。以“道路”维持智慧文学的核心意象，并通过重复“耶和华”确保指代清楚。
