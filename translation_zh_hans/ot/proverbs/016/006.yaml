  text: בְּ/חֶ֣סֶד וֶ֭/אֱמֶת יְכֻפַּ֣ר עָוֺ֑ן וּ/בְ/יִרְאַ֥ת יְ֝הוָ֗ה ס֣וּר מֵ/רָֽע׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/006.yaml
  text: By steadfast love and faithfulness iniquity is atoned for[b][a], and by the fear of Yahweh one turns away from evil.
translation:
  language: zh_hans
  text: 因慈爱和信实，罪孽得赎[a][b]；因敬畏雅威，人就远离恶。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “慈爱和信实”也可译作“忠贞的爱和真理”。这里的两个希伯来词连用时，常表达忠贞不渝的爱与可靠可信。
    reason: lexical_alternative
  - marker: b
    text: “得赎”的希伯来语是被动式，没有说明由谁施行赎罪；本句也没有明确说明这里的慈爱和信实主要指上帝的品格、人的行为，还是兼有两者。
    reason: alternative_reading
lexical_decisions:
- source_word: בְּחֶסֶד
  choice: 因慈爱
  rationale: חֶסֶד含有忠贞、仁爱和坚定不移的爱等意；“慈爱”在现代中文中自然凝练，并保留其关系性与持久性。介词ב在此译作“因”，表达凭借或途径，而不强行界定施动者。
- source_word: וֶאֱמֶת
  choice: 和信实
  rationale: אֱמֶת既可指“真实/真理”，也可指“信实/可靠”；与חֶסֶד并列时，“信实”较能体现忠诚可靠的伦理与关系含义。
- source_word: יְכֻפַּר
  choice: 得以赎除
  rationale: כפר的Pual未完成式表达被动的赎罪、除罪含义；“得以赎除”保留被动及施动者未明的特点，同时比生硬的“被赎罪”更符合现代汉语。
- source_word: עָוֺן
  choice: 罪孽
  rationale: עָוֺן可涵盖罪恶、罪责及其后果；“罪孽”保留道德悖逆与罪责的宽广语义。
- source_word: וּבְיִרְאַת יְהוָה
  choice: 因敬畏雅威
  rationale: יִרְאָה在智慧文学中指对上帝肃然、顺服的敬畏；ב译作“因”，与前半句形成清楚的平行。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以“雅威”音译上帝的专名，区别于作为称号的“主”，也符合现代普通话常见译法。
- source_word: סוּר
  choice: 人就远离
  rationale: 该形式在箴言体中可作泛指表达；补出泛指的“人”使中文自然，又不限定某个特定主体。
- source_word: מֵרָע
  choice: 恶事
  rationale: 此处רָע在“敬畏雅威”的语境中主要指道德上的恶；“恶事”自然表达应当远离的邪恶行为，同时不把它理解为灾祸。
theological_decisions:
- issue: 前半句是否把人的功德说成赦罪的原因
  choice: 保留被动而不说明施动者：“因慈爱和信实，罪孽得以赎除。”
  alternative: 明确译作“雅威因他的慈爱和信实赎除罪孽”，或译作“人凭慈爱和信实换得赦免”。
  rationale: 希伯来语יְכֻפַּר是被动形式，没有明说谁施行赎除，也没有明确界定慈爱和信实属于上帝还是人。译文不把这张力单方面解释为上帝的行动或人的功劳。
- issue: 上帝专名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 采用专名音译以保留原文的人名性质；“雅威”较贴近学界通常重构的读音。
translation_notes:
  register: 采用现代、庄重而易懂的箴言体。两个分句以“因……；因……”保持希伯来文的平行结构。“赎除”保留祭祀与除罪色彩，但用“得以”使被动表达符合现代汉语。所有脚注标记均置于相关主句之后。
