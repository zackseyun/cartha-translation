base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/023.yaml
  text: The heart of a wise man gives insight to his mouth[b][a], and adds learning to his lips.
translation:
  language: zh_hans
  text: 智慧人的心使他的口明达[a]，又使他的嘴唇增添学识[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“使他的口谨慎明达。”希伯来文动词可表示使人有见识或行事审慎。
    reason: lexical_alternative
  - marker: b
    text: 或译：“又使他的嘴唇增添训诲”或“又增添他嘴唇的说服力”。希伯来文 לֶקַח 可指学识、训诲或教导；在这里也可能引申为言语的说服力。
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵב
  choice: 心
  rationale: 保留希伯来文的人体意象；这里的“心”指人的内在，包括思想、判断和意志，并非只指情感。
- source_word: חָכָם
  choice: 智慧人
  rationale: 该词是阳性单数、作名词用；“智慧人”既贴近原文形式，也符合中文箴言体的自然表达。
- source_word: יַשְׂכִּיל
  choice: 使……有见识
  rationale: שׂכל 的使役式可指使人明达、审慎或有洞见；此处以“口”为宾语，表达智慧的内心使言语显得明达。
- source_word: פִּיהוּ
  choice: 他的口
  rationale: 直译带第三人称阳性单数后缀的名词，并保留与下句“嘴唇”构成的具体诗歌意象。
- source_word: וְעַל
  choice: 又使
  rationale: עַל 字面为“在……上”，但这里处于平行句式中，不宜机械译出；结合后面的动词补出“使”，令中文关系清楚自然。
- source_word: שְׂפָתָיו
  choice: 他的嘴唇
  rationale: 保留原文与“口”平行的人体意象，不笼统改译为“言语”。
- source_word: יֹסִיף
  choice: 更
  rationale: 该动词表示增加、增添；在“更善于教导”中自然传达递增含义。
- source_word: לֶקַח
  choice: 善于教导
  rationale: לֶקַח 可指所领受的训诲、教导或学识；在“嘴唇”的语境中，宜理解为言语所具有的教导性，同时保留其也可能指说服力的空间。
theological_decisions: []
translation_notes:
  register: 采用简洁、庄重的现代标准汉语，保留“心—口—嘴唇”的希伯来诗歌意象和平行结构。“有见识”避免把使役动词过度限定为单纯的谨慎；“善于教导”在自然中文中呈现 לֶקַח 的训诲含义，并以脚注保存“说服力”等可能解释。
