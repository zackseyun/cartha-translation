  text: Better to be lowly in spirit with the poor than to divide plunder with the proud[a].
translation:
  language: zh_hans
  text: 与贫苦人为伴，存谦卑的心，胜过与骄傲人同分掠夺来的财物。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “贫苦人”或译“困苦人”或“谦卑的人”。希伯来语 עניים 可按语境指贫穷、受苦或谦卑的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: 胜过
  rationale: 该词引出箴言中的比较判断；用“胜过”连接前后两项，既简洁自然，又保留原文“较好”的意义。
- source_word: שְׁפַל רוּחַ
  choice: 谦卑自处
  rationale: 该短语表示灵里或心态上的卑微、谦卑。“谦卑自处”在现代汉语中自然庄重，并强调内在姿态，而非单指社会地位低下。
- source_word: אֶת עניים
  choice: 与贫苦人一起
  rationale: אֶת 在这里取伴随义“与……一起”。עניים 可指贫穷、受苦或卑微的人；“贫苦人”兼顾贫穷与困苦两层含义，同时与后半句的骄傲人形成社会和品格上的张力。
- source_word: מֵחַלֵּק
  choice: 胜过……同分
  rationale: 前缀 מִן 表示比较。“同分”简洁表达共同分取之意，并与伴随对象“与骄傲人”自然搭配。
- source_word: שָׁלָל
  choice: 掠物
  rationale: 指掠夺或战争所得的财物。“掠物”比“战利品”稍宽，不额外限定为正式战争场景，也保留其不义或暴力所得的语感。
- source_word: אֶת גֵּאִים
  choice: 与骄傲人
  rationale: אֶת 再次表示伴随；גֵּאִים 指骄傲、狂傲的人。“骄傲人”直接对应前半句的谦卑姿态。
