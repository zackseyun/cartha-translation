  text: מַשְׂכִּ֣יל עַל דָּ֭בָר יִמְצָא ט֑וֹב וּ/בוֹטֵ֖חַ בַּ/יהוָ֣ה אַשְׁרָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/020.yaml
  text: Whoever gives careful attention to a matter will find good[b][a], and blessed is he who trusts in Yahweh.
translation:
  language: zh_hans
  text: 留心一件事的人，必得益处[a]；信靠雅威的人有福。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“明智对待一件事的人，必得益处”，或“在一件事上审慎的人，必得益处”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מַשְׂכִּיל עַל־דָּבָר
  choice: 留心处理事务的
  rationale: מַשְׂכִּיל 是 שׂכל 的使役词干分词，可指明智行事、审慎留意或凭洞察力妥善处理；与 עַל־דָּבָר 连用时，“留心处理事务”兼顾审慎关注和实际行动的意味。דָּבָר 在这里取“事务、事情”，不局限为“话语”。
- source_word: יִמְצָא־טוֹב
  choice: 必得益处
  rationale: מצא 的基本义是“找到、得着”，טוֹב 可泛指好处、福祉或有利结果。“必得益处”在现代汉语中自然简洁，同时不把含义收窄为物质兴旺。
- source_word: וּבוֹטֵחַ
  choice: 信靠……的
  rationale: Qal 分词在此作泛指，与上半句的人物相平行；译为“信靠……的”保留箴言的一般性陈述。
- source_word: בַּיהוָה
  choice: 信靠雅威
  rationale: 介词 ב 与 בטח 连用表示以某位为信赖的对象；“信靠”是自然且有宗教庄重感的现代汉语表达。“雅威”直接音译神名 יהוה。
- source_word: אַשְׁרָיו
  choice: 这人有福
  rationale: אַשְׁרֵי 形式表达蒙福、昌盛的状态，不只是主观快乐。后缀为阳性单数，但在箴言中泛指任何这样的人；“这人有福”既保留单数指称，也自然适用于所有人。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名 יהוה。“雅威”按其常见学术拟音作音译，较明确地区别于称号“主”，并保留盟约之名的性质；“耶和华”是汉语传统译名，但反映的是另一种历史读法。
- issue: אַשְׁרָיו 中阳性单数的范围
  choice: 这人有福
  alternative: 他有福
  rationale: 原文阳性单数在箴言语境中具有代表性和泛指作用，并不排除女性。“这人”保留单数而避免现代汉语中不必要的性别限定。
translation_notes:
  register: 采用现代、简洁而庄重的箴言体。“留心处理”避免把 מַשְׂכִּיל 仅理解为思想上的思考，也不把它过度具体化为某一种办事技巧；分号保留两个彼此呼应、又各自完整的陈述。
