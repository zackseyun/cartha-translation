  text: אַנְשֵׁ֣י דָ֭מִים יִשְׂנְאוּ תָ֑ם וִֽ֝/ישָׁרִ֗ים יְבַקְשׁ֥וּ נַפְשֽׁ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/029/010.yaml
  text: Men of blood hate the blameless[a], but the upright seek his life.
translation:
  language: zh_hans
  text: 嗜血之徒憎恨无可指责的人，正直人却寻求他的性命[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“正直人却关切他的性命”或“正直人却设法保护他。”希伯来语“寻求他的性命”可以有不同理解。
    reason: 保留第二分句“寻求他的性命”的字面措辞及其解释歧义；脚注说明在“正直人”的语境下可作关切、保护的正面理解。
lexical_decisions:
- source_word: אַנְשֵׁי דָמִים
  choice: 嗜血之徒
  rationale: 原文直译为“流血的人”，指惯于暴力、杀戮之人。“嗜血之徒”在现代汉语中自然有力，并保留其强烈的道德谴责。
- source_word: יִשְׂנְאוּ
  choice: 恨恶
  rationale: 直接表达“恨”的含义，语体庄重，也符合智慧文学的对比句式。
- source_word: תָם
  choice: 纯全人
  rationale: 此词指品行完整、无可指摘的人。“纯全人”保留“完整、纯正”的语义，并避免与下一分句的“正直人”合并为同一措辞。
- source_word: וִישָׁרִים
  choice: 正直人
  rationale: 该词是智慧文学中常见的道德称谓，指为人正直者；原文为复数，这里按群体称谓表达。
- source_word: יְבַקְשׁוּ
  choice: 寻求保全
  rationale: 基本义为“寻求”。但在本句与“他的性命”连用时，既可能按字面理解为“寻索他的性命”，也可能在正面语境中表示关切、设法保全。正文采用较符合“正直人”这一主语的善意理解，同时以脚注保留字面歧义。
- source_word: נַפְשׁוֹ
  choice: 他的性命
  rationale: נפש在这里可指生命、本人。“性命”自然对应生命义，也保留该短语围绕追索或保全生命的解释张力。
theological_decisions:
- issue: 第二分句 יְבַקְשׁוּ נַפְשׁוֹ 究竟表示正直人关切并保全纯全人的生命，还是按字面表示“寻索他的性命”。
  choice: 正文作“寻求保全他的性命”
  alternative: 正直人却寻索他的性命
  rationale: “正直人”作为主语使善意理解在语境中较为自然，也形成嗜血者与正直人的鲜明对比；但希伯来语本身没有明说“保全”，其字面结构仍可产生敌意或含混的读法，因此不应隐去该张力，另以脚注说明。
translation_notes:
  register: 采用现代、庄重且易懂的箴言体。“嗜血之徒”与“正直人”、“恨恶”与“寻求保全”形成清楚对照；脚注标记[a]已置于正文相应位置。
