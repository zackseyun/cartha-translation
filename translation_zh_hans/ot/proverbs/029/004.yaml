  text: מֶ֗לֶךְ בְּ֭/מִשְׁפָּט יַעֲמִ֣יד אָ֑רֶץ וְ/אִ֖ישׁ תְּרוּמ֣וֹת יֶֽהֶרְסֶֽ/נָּה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/029/004.yaml
  text: By justice a king establishes a land[b][a], but a man of bribes tears it down.
translation:
  language: zh_hans
  text: '君王秉公，使国安定；

    受贿的人[a]，却使国倾覆。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “受贿的人”原文直译为“收取礼物（或捐献、征敛）的人”；这里很可能指收取败坏公正的馈赠，即贿赂。
    reason: lexical_alternative
lexical_decisions:
- source_word: מֶלֶךְ
  choice: 君王
  rationale: 原文为泛指单数，表达一般性的治国原则；汉语“君王”自然庄重，无须另加不定标记。
- source_word: בְּמִשְׁפָּט
  choice: 秉公
  rationale: מִשְׁפָּט在此指公正的判断和治理秩序；“秉公”简洁地表达以公正施政。
- source_word: יַעֲמִיד
  choice: 使……安定
  rationale: עמד的使役形在这里表示使国家站立得稳、保持稳固；“使国安定”比直译“使国站立”更符合现代汉语。
- source_word: אָרֶץ
  choice: 国
  rationale: 此处指君王所治理的疆土或国家，而非全地；上下句均译作“国”，清楚保留代词所指。
- source_word: אִישׁ
  choice: 人
  rationale: 原文阳性单数在箴言中具有代表性；汉语“人”自然表达泛指，不额外限定性别或身份。
- source_word: תְּרוּמוֹת
  choice: 受贿
  rationale: תְּרוּמוֹת通常可指捐献、礼物或征收之物；本句与公正治理相对，语境很可能指败坏公正的馈赠，即贿赂。译作“受贿”使汉语明确自然，同时以脚注保存词义范围。
- source_word: יֶהֶרְסֶנָּה
  choice: 使国倾覆
  rationale: הרס意为拆毁、毁坏，阴性宾语后缀回指“国土”；“倾覆”既保留毁坏国家的强烈意象，也与“安定”形成鲜明对照。
theological_decisions: []
translation_notes:
  register: 采用现代、凝练而庄重的箴言体。以“秉公／倾覆”和“安定／倾覆”呈现原文的治理与毁坏对比；不把泛指的“人”进一步解释为君王或官员，以免超出原文。
