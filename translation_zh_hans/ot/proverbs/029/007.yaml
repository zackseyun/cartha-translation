base_translation:
  language: en
  yaml_path: translation/ot/proverbs/029/007.yaml
  text: A righteous man knows the case of the poor[b][a]; a wicked man does not understand knowledge.
translation:
  language: zh_hans
  text: 义人了解穷人的案情[a]；恶人不明白知识[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “案情”也可译作“案件”“诉讼缘由”“权益”或“公道”。希伯来语 דִּין 可指案件、诉讼缘由或公义。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译为“恶人不明白知识”。“知识”在原文中没有“这种”一类的指示词；它可能在语境中与上半句相关。
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹדֵעַ
  choice: 了解
  rationale: 该分词表示“知道、认识、了解”。“了解”既保留基本认知意义，又能自然地与“案情”搭配，不把含义扩大为“关心”。
- source_word: צַדִּיק
  choice: 义人
  rationale: 阳性单数形容词作名词用，描绘箴言中的代表性人物类型；“义人”是现代中文圣经与一般宗教语境中自然、庄重的表达。
- source_word: דִּין
  choice: 案情
  rationale: 该词可指案件、诉讼缘由或公义。与“穷人”构成属格关系时，“案情”突出具体的司法或社会诉求，同时以脚注保留“权益／公道”等可能。
- source_word: דַּלִּים
  choice: 穷人
  rationale: 复数形式指贫穷、弱小或处境卑微的人；“穷人”简明自然，并涵盖其社会弱势处境。
- source_word: רָשָׁע
  choice: 恶人
  rationale: 阳性单数形容词作名词用，与“义人”形成简洁而对称的代表性对照。
- source_word: יָבִין
  choice: 明白
  rationale: בין表示理解、辨明；“明白”符合现代汉语，并与上句“了解”形成认知层面的对应。
- source_word: דָּעַת
  choice: 这种知识
  rationale: 原文直译为“知识”，表达较突兀；“这种”将其自然地回指上句所说的认识。因指示成分属于语境补足而非明示词汇，脚注同时说明原文形式。
theological_decisions:
- issue: 义人的“知道”是否应解释为关怀或维护穷人
  choice: 译为“了解”，保留认知动词的基本意义
  alternative: 关心／维护穷人的权益
  rationale: 上下文可能暗含实际关怀与公义行动，但原词首先是“知道、认识”；不在正文中把含义收窄为特定行动。
- issue: דִּין דַּלִּים的司法与伦理含义
  choice: 穷人的案情
  alternative: 穷人的权益／穷人应得的公道
  rationale: “案情”保留具体司法色彩，而“权益”或“公道”突出规范性含义；原文容许这些张力，因此将替代译法列入脚注。
translation_notes:
  register: 采用简洁、对称的箴言体。“义人／恶人”庄重而通行；“了解案情”符合现代标准汉语。正文保留原句末尾“知识”的抽象表达，并用脚注说明中文中补出的回指成分。
