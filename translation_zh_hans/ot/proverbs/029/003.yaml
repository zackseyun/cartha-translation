  text: A man who loves wisdom makes his father glad[a], but one who keeps company with prostitutes destroys wealth.
translation:
  language: zh_hans
  text: 喜爱智慧的人使父亲欢喜；与娼妓为伴的[a]毁掉财富。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “与娼妓为伴的”：原文直译为“牧养／喂养娼妓的人”；此处为习语，指与她们结交或经常来往。
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: 人
  rationale: 这里是单数阳性名词，在箴言中代表一般个体；现代汉语用“人”自然，并不抹去原文的代表性用法。
- source_word: אֹהֵב חָכְמָה
  choice: 喜爱智慧的人
  rationale: 分词结构表示持续的品格特征；“智慧”直接对应 חָכְמָה，不缩窄为“教训”。
- source_word: יְשַׂמַּח
  choice: 使……欢喜
  rationale: Piel 词形表达使役意义，即使父亲喜乐；这一译法准确且符合现代汉语。
- source_word: אָבִיו
  choice: 父亲
  rationale: 原文是“他的父亲”；汉语主语关系已明确，无须重复“他的”，但保留了具体的父亲而未泛化为父母。
- source_word: וְרֹעֶה
  choice: 与……为伴的
  rationale: רעה 本义与牧养、喂养有关，但此处与“娼妓”搭配，按习语表达交往、厮混或经常来往；“与……为伴”既自然又保留持续结交之意。
- source_word: זֹנוֹת
  choice: 娼妓
  rationale: 该阴性复数名词指从事卖淫的女性；“娼妓”准确、现代且适合庄重经文语体。
- source_word: יְאַבֶּד
  choice: 必败尽
  rationale: Piel 表示毁掉、使丧失；用于财物时，“败尽”自然传达挥霍以致尽失的强烈结果。“必”体现箴言式后果陈述，但不把它变成时间预测。
- source_word: הוֹן
  choice: 家财
  rationale: הוֹן 指财富或资财；“家财”与“败尽”搭配自然，也符合父子家庭语境，但不限定某种具体财产。
