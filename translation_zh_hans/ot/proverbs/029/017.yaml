  text: Discipline your son[a], and he will give you rest[b]; he will give delights to your soul.
translation:
  language: zh_hans
  text: 管教你的儿子，他必使你得安宁；他必给你的内心带来乐事[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “内心”所译的希伯来语词也可指“生命”或“自身”；“乐事”也可译作“令人愉悦的事物”或“喜乐”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יַסֵּר
  choice: 管教
  rationale: 该词是יסר的皮勒式祈使语气，指主动施行纠正和训导。“管教”既包含纠正，也包含塑造性的教导，符合箴言的语境。
- source_word: בִּנְךָ
  choice: 你的儿子
  rationale: 希伯来语明确为阳性单数“你的儿子”，因此保留原文的性别和单数形式，不泛化为“孩子”。
- source_word: וִינִיחֶךָ
  choice: 使你安宁
  rationale: 该词源于נוח的使役词干，表达“使人得安歇、宽心”的意思。“使你安宁”在现代汉语中自然，并保留使役含义。
- source_word: וְיִתֵּן
  choice: 给……带来
  rationale: נתן的基本义是“给”。汉语用“给……带来”可自然表达儿子使父母内心得到喜悦，同时不增加原文没有的因果细节。
- source_word: מַעֲדַנִּים
  choice: 喜悦
  rationale: 该复数名词可指令人愉悦之物、乐事或欢喜。“喜悦”简洁自然，也符合与“安宁”并列的诗歌语境；原文较宽的词义另以脚注说明。
- source_word: לְנַפְשֶׁךָ
  choice: 给你的心
  rationale: נפש可指生命、自我或内在之人。此处描述内在满足，译作“心”符合现代汉语表达，同时以脚注保留“生命、内在自我”等语义范围。
