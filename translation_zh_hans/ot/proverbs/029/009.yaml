  text: אִֽישׁ חָכָ֗ם נִ֭שְׁפָּט אֶת אִ֣ישׁ אֱוִ֑יל וְ/רָגַ֥ז וְ֝/שָׂחַ֗ק וְ/אֵ֣ין נָֽחַת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/029/009.yaml
  text: If a wise man has a dispute with a foolish man[a], whether he rages or laughs[b], there is no rest.
translation:
  language: zh_hans
  text: 智慧人若与愚昧人争辩[a]，或怒或笑[b]，终无安宁。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“智慧人若与愚昧人相争，愚昧人或发怒，或发笑，却总不得安宁。”希伯来文没有明确说明发怒、发笑的是智慧人还是愚昧人；许多解释者依据上下文认为是愚昧人。
    reason: alternative_reading
  - marker: b
    text: “笑”在这里也可能含有讥笑、嘲弄的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ חָכָם
  choice: 智慧人
  rationale: 原文为阳性单数“有智慧的人”，但在箴言中具有典型、代表性的用法；“智慧人”既贴近原文，又符合现代汉语箴言体。
- source_word: נִשְׁפָּט
  choice: 争辩
  rationale: 此处该动词的尼法勒词形表示与人争讼或争执；“争辩”保留对抗意味，同时不把场景限定为法庭诉讼。
- source_word: אֶת אִישׁ אֱוִיל
  choice: 与愚昧人
  rationale: 指争辩的另一方；“愚昧人”与“智慧人”形成清楚对照，也延续箴言中常见的智慧—愚昧用语。
- source_word: וְרָגַז
  choice: 他发怒
  rationale: רגז可指激动、恼怒或暴怒。“发怒”自然且不过度强化；代词“他”不明确指定是智慧人还是愚昧人，以保留希伯来文的主语歧义。
- source_word: וְשָׂחַק
  choice: 还是发笑
  rationale: שׂחק的基本义是“笑”；语境中可能带嘲笑意味，但正文保留较宽泛的基本义，并在脚注说明。
- source_word: וְאֵין נָחַת
  choice: 都不会有安宁
  rationale: נחת表示安静、歇息或平息。“不会有安宁”自然表达争端无法平息、局面不得安静，又不把含义缩窄为单纯的心理感受。
theological_decisions:
- issue: “发怒”和“发笑”的主语
  choice: 正文以指代未定的“他”保留歧义
  alternative: 明确译为“愚昧人发怒或发笑”
  rationale: 希伯来文没有明确指出发怒、发笑的是智慧人还是愚昧人；虽有不少解释者依据语境倾向愚昧人，翻译不宜在正文中消除这一真实歧义。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语，保持箴言式的对偶和概括性。“智慧人／愚昧人”沿用智慧文学中清楚易懂的类型称谓；句末采用非人称意味的“都不会有安宁”，避免擅自指定谁不得安宁。
