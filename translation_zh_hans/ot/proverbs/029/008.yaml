  text: Mockers inflame a city[b][a], but wise men turn away anger.
translation:
  language: zh_hans
  text: 嘲讽者使全城陷入骚乱[a]，智慧人却平息怒气[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“嘲讽者使一座城燃起。”原文动词带有吹旺火焰的比喻意味，在此指挑起或激化城中的骚乱。
    reason: lexical_alternative
  - marker: b
    text: “智慧人”原文为阳性复数，也可译作“有智慧的人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַנְשֵׁי לָצוֹן
  choice: 嘲讽者
  rationale: 原文为“嘲讽之人”，指以讥诮、轻蔑为特征的人；“嘲讽者”简洁自然，并保留《箴言》中人物类型的表达。
- source_word: יָפִיחוּ
  choice: 煽动
  rationale: 该使役形动词在此具有比喻意味，可描写把火吹旺或挑起骚乱；“煽动”既保留煽风点火的意象，也自然表达引发城市动荡的语境。
- source_word: קִרְיָה
  choice: 全城
  rationale: 该词指城或城邑；与“煽动”连用时，汉语以“煽动全城”自然表达使一座城陷入骚动，范围含义清楚。
- source_word: חֲכָמִים
  choice: 智慧人
  rationale: 原文是阳性复数，指有智慧的人；“智慧人”符合《箴言》的传统人物类型表达，也与前句“嘲讽者”形成对照。
- source_word: יָשִׁיבוּ
  choice: 使……止息
  rationale: 该使役形动词基本义为使之返回、退去；与“怒气”搭配时，“使……止息”是自然中文，同时保留主动消解怒气的含义。
- source_word: אָף
  choice: 怒气
  rationale: 该词本义与鼻相关，但常用来表示愤怒；“怒气”比“震怒”更贴近日常而庄重的箴言语体。
