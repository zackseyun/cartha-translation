  yaml_path: translation/ot/proverbs/029/024.yaml
  text: Whoever shares with a thief hates his own life[b][a]; he hears a curse and does not disclose it.
translation:
  language: zh_hans
  text: 与盗贼同伙的，是恨恶自己的性命；他听见咒诅[a]，却不作声[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “咒诅”也可译作“带咒诅的誓言”或“郑重的责令”。在法律语境中，它可能指公开要求知情者作证、并以咒诅约束其如实陈述的话。
    reason: lexical_alternative
  - marker: b
    text: 即他不宣告或披露所知的事；这句可能暗示知情者听见公开的咒誓或责令后，仍拒绝作证。
    reason: cultural_note
lexical_decisions:
- source_word: חוֹלֵק עִם גַּנָּב
  choice: 与盗贼分赃的
  rationale: חוֹלֵק 表示分享、分取或参与；与“盗贼”连用时，很可能指分享赃物或参与其犯罪。“分赃”以自然简洁的现代汉语表达这种同谋关系。
- source_word: שׂוֹנֵא נַפְשׁוֹ
  choice: 恨恶自己的性命
  rationale: נֶפֶשׁ 在此可指性命或自身，描述这种同谋和隐瞒行为最终害己；“性命”保留原文措辞的力度，又不把它限定为灵魂观念。
- source_word: אָלָה
  choice: 要求作证的咒誓
  rationale: אָלָה 可指咒诅、带有咒诅的誓言或用于责令知情者作证的誓词。上下文很可能是司法场景；正文兼顾“咒誓”的词义和其要求披露实情的功能，但以脚注保留歧义。
- source_word: יִשְׁמַע
  choice: 他听见
  rationale: 该动词本义为“听见”。不直接译成“被置于誓言之下”，以免超出希伯来文的明确表达。
- source_word: וְלֹא יַגִּיד
  choice: 却不说出来
  rationale: נגד 的使役式可表示告知、声明或报告。“说出来”自然地表达知情而不披露，且不将场景过度限定为正式出庭作证。
theological_decisions:
- issue: “恨恶自己的性命”是情感陈述还是自害行为的惯用表达
  choice: 保留“恨恶自己的性命”
  alternative: 害了自己
  rationale: 直译保留智慧文学中尖锐的道德判断，同时读者可从语境理解其自取祸患之意，不将原文张力化约为结果说明。
- issue: אָלָה 的司法含义
  choice: 正文译作“要求作证的咒誓”，脚注说明其他可能
  alternative: 咒诅；誓言；传唤作证的誓词
  rationale: 利未记5:1等法律语境表明该词可涉及公开责令知情者作证，但本节没有明说法庭或证人，因此既提示最可能的语境，又不排除较宽泛的“咒诅/誓言”含义。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“分赃”明确表达与盗贼共同得利的常见语境；“咒誓”略带法律和古典色彩，配合解释性短语及脚注帮助普通读者理解。所有脚注标记均置于相关正文之后。
