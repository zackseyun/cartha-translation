  text: בִּ/רְב֣וֹת רְ֭שָׁעִים יִרְבֶּה פָּ֑שַׁע וְ֝/צַדִּיקִ֗ים בְּֽ/מַפַּלְתָּ֥/ם יִרְאֽוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/029/016.yaml
  text: When the wicked increase[a], transgression increases; but the righteous will look upon their downfall.
translation:
  language: zh_hans
  text: 恶人增多，过犯也增多；义人却必看见他们的倾覆。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“看见他们的倒下。”希伯来语动词直译为“看见”，名词可译为“倒下”或“倾覆”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּרְבוֹת
  choice: 增多
  rationale: ב 加不定词构成时间或伴随情形，表示恶人数目增加；汉语用“增多”简洁自然，并与下句的 יִרְבֶּה 形成词语呼应。
- source_word: רְשָׁעִים
  choice: 恶人
  rationale: 复数形容词作名词，指道德上邪恶或有罪的人；“恶人”符合现代汉语智慧文学的庄重语体。
- source_word: יִרְבֶּה
  choice: 也增多
  rationale: 该动词与首句的 רבה 同根，译文重复“增多”以保留原文的修辞对应；“也”自然呈现随之而来的结果。
- source_word: פָּשַׁע
  choice: 过犯
  rationale: 该词可指越界、背叛或悖逆性的罪行；“过犯”比泛称“罪恶”更能保留违反规范的含义，同时不把语义限定为政治叛乱。
- source_word: וְצַדִּיקִים
  choice: 义人却
  rationale: וְ 在两分句之间具有对比作用，译为“却”；“义人”是 צַדִּיקִים 在智慧文学中的自然对应。
- source_word: בְּמַפַּלְתָּם
  choice: 他们败亡
  rationale: מַפָּלָה 表示倒下、败落或覆亡，复数第三人称后缀最自然地回指前句的恶人；“败亡”保留最终倾覆之意，但不额外加入义人幸灾乐祸的意味。
- source_word: יִרְאוּ
  choice: 必看见
  rationale: ראה 的基本义是“看见”；未完成式在箴言的概括性陈述中指向必然或将来的结果，因此用“必看见”，不扩展为庆幸、欣赏或审判。
theological_decisions:
- issue: “他们败亡”中代词后缀的所指
  choice: “他们”回指上半句的恶人
  alternative: 泛指那些倒下的人
  rationale: 从最近先行词、两分句的对照结构和整句逻辑看，后缀最自然地指恶人；这是句法与平行结构所支持的选择，并非加入特定教派解释。
- issue: 义人“看见”恶人败亡是否暗含欢喜或报复
  choice: 只译为“看见”，不增添情绪或行动
  alternative: 译作“欣然看着”或“目睹报应”
  rationale: 原文 ראה 仅表达看见或目睹；加入欢喜、报复或“报应”会超出原文，并消除经文本身保留的神学张力。
translation_notes:
  register: 采用现代、庄重而简明的箴言语体。两次使用“增多”以保留原文 רבה 的重复；用“却”呈现上下两句的对比。译文不说明义人看见败亡时的态度，以避免超出原文。
