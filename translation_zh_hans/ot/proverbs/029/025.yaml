  text: חֶרְדַּ֣ת אָ֭דָם יִתֵּ֣ן מוֹקֵ֑שׁ וּ/בוֹטֵ֖חַ בַּ/יהוָ֣ה יְשֻׂגָּֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/029/025.yaml
  text: The fear of man lays a snare[b][a], but whoever trusts in Yahweh will be set on high.
translation:
  language: zh_hans
  text: 惧怕人会带来网罗[a]；但信靠雅威的人，必被安置在高处[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“对人的惧怕给出网罗”；意思是惧怕别人会成为使人陷入其中的网罗。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“必得安全”或“必蒙保护”；希伯来文的字面图像是“被安置在高处”。
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶרְדַּת אָדָם
  choice: 对人的惧怕
  rationale: חֶרְדַּת 表示惧怕、战兢或恐慌，אָדם 在这里泛指人。译为“对人的惧怕”明确表达惧怕他人的意思，同时保留这种恐惧可能涵盖畏缩、顾忌和受人威吓的宽泛语义。
- source_word: יִתֵּן מוֹקֵשׁ
  choice: 会设下网罗
  rationale: יִתֵּן 字面为“给出”，与 מוֹקֵשׁ（网罗）连用时表达造成或布下陷阱。“设下网罗”在现代汉语中自然，也保留智慧文学的捕捉意象。
- source_word: וּבוֹטֵחַ
  choice: 但信靠……的
  rationale: 分词在此作泛指名词用法，指任何持续信靠的人；“信靠……的”简洁自然，不把对象限于某一性别。连接词 וּ 在两分句间形成鲜明对照，因此译作“但”。
- source_word: בַּיהוָה
  choice: 信靠雅威
  rationale: 介词 בְּ 与“信靠”连用，表示信赖的对象；יהוה 是神的专名，采用音译“雅威”，不以称号代替。
- source_word: יְשֻׂגָּב
  choice: 必被安置在高处
  rationale: 该被动式动词描绘被置于难以侵袭的高处，因而安全。“被安置在高处”保留原文的空间隐喻；其安全、受保护的含义在脚注说明。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。音译“雅威”保留其专名性质，也避免用称号替代；“耶和华”是传统形式，“上主”则属于替代性称谓。
- issue: יְשֻׂגָּב 所表达的应许
  choice: 保留“被安置在高处”的隐喻
  alternative: 必得安全；必蒙保护
  rationale: 原文既包含位置升高的图像，也蕴含安全、不可侵袭的结果。正文保留图像，脚注给出其语用含义，不把经文收窄为单一抽象解释。
- issue: אָדָם 与 בּוֹטֵחַ 的泛指范围
  choice: 分别译为“人”和“……的”
  alternative: 世人；信靠他的人
  rationale: 两处都具有普遍适用的泛指意义。现代汉语无需加入男性代词，便可忠实表达任何惧怕他人或信靠雅威之人的意思。
translation_notes:
  register: 采用简洁、对称的箴言体。“网罗”保留古代捕猎意象，在现代汉语中仍易理解；“安置在高处”略带庄重色彩，以保留原文隐喻。正文的[a]、[b]分别紧随所解释的短语，避免英文咨询层中脚注次序可能造成的混淆。
