  text: בִּ/רְב֣וֹת צַ֭דִּיקִים יִשְׂמַ֣ח הָ/עָ֑ם וּ/בִ/מְשֹׁ֥ל רָ֝שָׁ֗ע יֵאָ֥נַֽח עָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/029/002.yaml
  text: When the righteous increase[a], the people rejoice; but when a wicked man rules, the people groan.
translation:
  language: zh_hans
  text: 义人增多[a]，百姓就欢喜；恶人掌权，百姓便叹息。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“义人众多时，百姓就欢喜。”希伯来语的不定式构造既可强调人数增多，也可强调人数众多。
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּרְבוֹת
  choice: 增多
  rationale: בְּ加רבה的不定式构造在此表示时间情境，可指义人的数目增加，也可强调义人为数众多。正文采用“增多”，自然地保留动态含义。
- source_word: צַדִּיקִים
  choice: 义人
  rationale: 复数形容词作名词用，指公义之人这一群体；“义人”简洁庄重，也不额外限定性别。
- source_word: יִשְׂמַח
  choice: 欢喜
  rationale: שׂמח表示喜乐、欣悦；“欢喜”符合现代汉语箴言体，并与下句“叹息”构成鲜明对照。
- source_word: הָעָם / עָם
  choice: 百姓
  rationale: עם在两句中均指社会大众。“百姓”适合治理语境；第二句虽无冠词，仍指同一群体，故重复译出。
- source_word: וּבִמְשֹׁל
  choice: 掌权
  rationale: בְּ加משׁל的不定式构造表示“当……统治时”。“掌权”在汉语中凝练自然；分号已清楚体现原文连接词在对偶中的转折关系，无须另加“但是”。
- source_word: רָשָׁע
  choice: 恶人
  rationale: 单数形容词作名词用，指一个邪恶的掌权者。“恶人”保留单数类指表达，不在中文中强加原文语法性阳性的生理性别含义。
- source_word: יֵאָנַח
  choice: 叹息
  rationale: אנח的尼法勒式表示因痛苦而呻吟或叹息。“叹息”自然、庄重，传达百姓在恶政之下的愁苦。
theological_decisions: []
translation_notes:
  register: 采用简洁、对称的现代汉语箴言体。“义人增多……恶人掌权”保留原文复数义人与单数恶人的对照；“百姓就欢喜……百姓便叹息”呈现平行节奏。脚注保留首句在“增加”与“众多”之间的真实歧义。
