base_translation:
  language: en
  yaml_path: translation/ot/proverbs/029/006.yaml
  text: In the transgression of an evil man there is a snare[b][a], but the righteous sings for joy and rejoices.
translation:
  language: zh_hans
  text: 恶人的过犯中有网罗[a]；义人却欢呼并喜乐[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“恶人的过犯带来网罗。”希伯来语既可强调网罗就在他的过犯之中，也可强调他的过犯使网罗产生。
    reason: alternative_reading
  - marker: b
    text: “欢呼”也可译作“高歌”。原词指发出响亮的喜乐之声。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּפֶשַׁע
  choice: 过犯中
  rationale: 介词 בְּ 可表示处所或手段；正文采用处所性的表达，保留网罗与恶人过犯内在相连的紧凑意象，同时以脚注说明使然性的理解。
- source_word: אִישׁ רָע
  choice: 恶人
  rationale: 这是现代汉语智慧文学中自然、凝练的类别称谓，准确表达具有邪恶品行的人；不必机械保留希伯来语阳性单数的形式。
- source_word: מוֹקֵשׁ
  choice: 网罗
  rationale: 保留智慧文学常见的捕捉意象，既可指陷阱，也可暗示罪行所带来的缠累。
- source_word: צַדִּיק
  choice: 义人
  rationale: 以汉语圣经及智慧文学中清楚、庄重的类别称谓，表达名词化形容词所指的正直之人。
- source_word: יָרוּן
  choice: 欢呼
  rationale: 该动词表示发出响亮而喜悦的声音；“欢呼”兼顾声音性和喜乐之意，并以脚注保留“高歌”的可能译法。
- source_word: וְשָׂמֵחַ
  choice: 喜乐
  rationale: 表达持续或显明的欢乐状态，与前面的外在欢呼形成递进而不完全重复。
theological_decisions:
- issue: 网罗与恶人过犯之间的关系
  choice: 译作“过犯中藏着网罗”，侧重网罗存在于过犯之中
  alternative: “恶人因过犯而落入网罗”，侧重过犯造成被困的结果
  rationale: 希伯来语介词 בְּ 允许处所性和工具／原因性的理解。正文保留原句紧凑的内在关联，脚注则明示另一种可能，不断言网罗必定来自外在审判或特定因果机制。
translation_notes:
  register: 采用现代、凝练而庄重的箴言体。“藏着”补足希伯来语省略的系词，使中文自然，同时不展开原文未明说的因果关系；分号和“却”清楚呈现恶人与义人的对比。
