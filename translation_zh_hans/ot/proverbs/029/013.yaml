  text: רָ֤שׁ וְ/אִ֣ישׁ תְּכָכִ֣ים נִפְגָּ֑שׁוּ מֵ֤אִיר עֵינֵ֖י שְׁנֵי/הֶ֣ם יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/029/013.yaml
  text: A poor man and an oppressor meet together[b][a]; Yahweh gives light to the eyes of both of them.
translation:
  language: zh_hans
  text: 穷人和压迫者[a]相遇；耶和华使他们二人的眼睛明亮[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “压迫者”原文直译可作“一个施行欺压的人”；这个较难确定的说法也有人理解为“诡诈的人”或“放债取利的人”。
    reason: lexical_alternative
  - marker: b
    text: “使眼睛明亮”可表示使人看见、赐人生命或活力，也可含有光照、启明之意。
    reason: lexical_alternative
lexical_decisions:
- source_word: רָשׁ
  choice: 穷人
  rationale: 指贫穷或困乏的人；用单数“穷人”保留希伯来文格言中与另一类人相对的结构。
- source_word: אִישׁ תְּכָכִים
  choice: 欺压人的
  rationale: 这是一个意义较难确定的短语，可能指以欺压、盘剥手段待人的人；“欺压人的”自然简洁，同时以脚注保留“诡诈的人”“放债取利的人”等可能理解。
- source_word: נִפְגָּשׁוּ
  choice: 相遇
  rationale: 该动词通常表示相遇或彼此碰见；这里保留具体的相遇意象，不将其直接解释为“有共同点”。
- source_word: מֵאִיר
  choice: 使……明亮
  rationale: 字面义为使发光；与“眼睛”连用时可涉及赐予视力、生命、活力或光照。译文保留这一开放性意象。
- source_word: עֵינֵי שְׁנֵיהֶם
  choice: 他们两人的眼睛
  rationale: 明确强调处于不同社会地位的双方同样领受耶和华所赐的光。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文圣经语境中对神圣四字名最通行且易懂的专名译法，而不以普通称号替代。
theological_decisions:
- issue: 下半句“使他们两人的眼睛明亮”的含义
  choice: 保留“使眼睛明亮”的希伯来意象，表达耶和华同样使双方得光、得以存活或看见，而不限定其中一种含义。
  alternative: 明确译成耶和华赐双方视力、生命，或属灵与道德上的光照。
  rationale: 原文明确说耶和华使双方的眼睛明亮；这一习语可能涉及视力、生命、活力或启明。直保意象可避免过早消除其神学张力。
- issue: 穷人与欺压者的关系
  choice: 译为双方“相遇”，不把经文解释成认可欺压，也不将相遇抽象化为完全相同的处境。
  alternative: 译成“有共同之处”或“同处于世”。
  rationale: נִפְגָּשׁוּ首先是“相遇”，后半句说明二者共有的受造依存性；经文本身并未因此消除其道德差异。
translation_notes:
  register: 采用现代、庄重而易懂的格言体。“欺压人的”比名词“欺压者”略贴近希伯来文“一个……的人”的结构；分号保留上下两分句之间的解释性联系。脚注标记依其所解释的词语就近安放。
