base_translation:
  language: en
  yaml_path: translation/ot/proverbs/029/012.yaml
  text: If a ruler listens to a lying word, all his servants become wicked.
translation:
  language: zh_hans
  text: 统治者若听信虚假的话，他所有的臣仆就全都是恶人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מֹשֵׁל
  choice: 统治者
  rationale: 指掌权治理的人；“统治者”在现代汉语中自然，并保留原词的广义，不限于君王。
- source_word: מַקְשִׁיב עַל דְּבַר שָׁקֶר
  choice: 听信谎言
  rationale: מַקְשִׁיב 不只是听见，也含留心听从之意；“听信”准确表达对虚假话语的接纳。דְּבַר שָׁקֶר 可指虚假的话或谎言，此处简洁译为“谎言”。
- source_word: מְשָׁרְתָיו
  choice: 他的臣仆
  rationale: 指侍候统治者、为其效力的人；“臣仆”符合统治者的语境，也保留服侍和从属之意。
- source_word: רְשָׁעִים
  choice: 邪恶
  rationale: 表示在道德上有罪、作恶；译为“邪恶”自然庄重，且不把含义缩窄为某一种具体恶行。
theological_decisions:
- issue: 系词省略所表达的是状态还是变化
  choice: 译作“变得邪恶”
  alternative: 译作“都是恶人”或“都邪恶”
  rationale: 希伯来文名词句本身可描述状态，未明示“变得”；但箴言的因果结构暗示统治者听信谎言会败坏其臣仆群体。正文采用“变得”以清楚传达这一关系，同时不引入特定教派解释。
translation_notes:
  register: 采用简洁、警策的箴言体。全句使用现代标准汉语，语气庄重而易懂；不添加原文没有明确说明的具体机制或人物身份。
