  yaml_path: translation/ot/proverbs/029/026.yaml
  text: Many seek the face of a ruler, but from the LORD comes a man's justice.
translation:
  language: zh_hans
  text: 许多人求见统治者，但人所应得的公正裁断来自耶和华。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מְבַקְשִׁים פְּנֵי מוֹשֵׁל
  choice: 求见统治者
  rationale: 字面为“寻求统治者的面”，在此是求得接见、陈情或恩宠的惯用表达；“求见”以自然现代汉语保留其核心意思。
- source_word: מִשְׁפַּט אִישׁ
  choice: 人的公断
  rationale: מִשְׁפָּט 可指判决、公正裁断或应得的公道；“人的公断”保留其司法语境及“为某人作出的公正裁决”这一开放性。
- source_word: מֵיְהוָה
  choice: 来自耶和华
  rationale: 准确表达来源介词 מִן，并按希伯来专名译作“耶和华”。
theological_decisions:
- issue: 人的公正裁决究竟来自地上统治者还是耶和华
  choice: 以“但……来自耶和华”保留经文的鲜明对照
  alternative: 解释为耶和华借统治者施行裁决
  rationale: 原文只断言公断的终极来源，没有说明其实现机制，因此不加入中介方式。
- issue: מִשְׁפַּט אִישׁ 的关系
  choice: 译作“人的公断”
  alternative: “各人所得的判决”或“人为人伸冤”
  rationale: 希伯来语结构简练，可表示关乎某人的判决、公道或司法权利；正文保持简洁，不将其单向限定为伸冤或定罪。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“统治者”对应 מוֹשֵׁל，避免把范围缩窄为君王；全句保留箴言式的简洁对偶。
