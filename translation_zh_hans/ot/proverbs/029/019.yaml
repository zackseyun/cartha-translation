base_translation:
  language: en
  yaml_path: translation/ot/proverbs/029/019.yaml
  text: A slave is not corrected by words alone[a], for though he understands[b], there is no response.
translation:
  language: zh_hans
  text: 单靠言语，不能使奴隶受管教[a]；即使他明白，也不会有回应[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “奴隶”也可译作“仆人”。希伯来语 עָבֶד 可按语境指仆人或奴隶；此处译作“奴隶”，以保留这个词所可能表达的受辖制身份。
    reason: lexical_alternative
  - marker: b
    text: 或译：“因为他虽明白，却不回答。”末句既可能指没有口头答复，也可能指没有以行动作出反应。
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּדְבָרִים
  choice: 单靠言语
  rationale: 介词 בְּ 表示方式或手段；原文没有明说“单”，但上下文的对比表明，言语本身不足以使管教见效。
- source_word: יִוָּסֶר
  choice: 得到管教
  rationale: יסר 的尼法勒式表示受到管教、纠正或训诫；“得到管教”保留被动含义，也不过度限定为惩罚。
- source_word: עָבֶד
  choice: 奴隶
  rationale: עָבֶד 可指仆人或奴隶；本节的权属与服从关系较突出，译作“奴隶”更直接保留其受约束的社会身份。
- source_word: כִּי יָבִין
  choice: 即使他明白
  rationale: כִּי 在此结合后句形成让步意味：虽能听懂，却没有相应回应；“即使”自然呈现这一张力。
- source_word: וְאֵין מַעֲנֶה
  choice: 也没有回应
  rationale: 原文直译为“而没有回答／回应”。“回应”既可指口头答复，也可指以行动作出反应，因而保留原文可能的双重含义。
