  text: Whoever pampers his slave from youth[a], in the end he will become a son.
translation:
  language: zh_hans
  text: 人若从那奴隶年幼时起就娇惯他，最终那奴隶会成为儿子。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “儿子”所对应的希伯来词 מָנוֹן 含义不确定。有人理解为“儿子”或“表现得像儿子的人”，意思可能是受娇惯的奴隶会擅自把自己当作儿子；也有人理解为“麻烦”或“不服管束”。
    reason: alternative_reading
lexical_decisions:
- source_word: מְפַנֵּק
  choice: 娇惯
  rationale: 该词为 פנק 的加强词干分词，表示娇养、纵容；“娇惯”自然简洁，并保留箴言所含的负面意味。
- source_word: מִנֹּעַר
  choice: 从小
  rationale: 表示从年幼时期开始；“从小”是现代汉语中自然、准确的表达。
- source_word: עַבְדּוֹ
  choice: 自己的奴隶
  rationale: עבד 可指仆人或奴隶；此处人物处于主人的权下，“奴隶”较清楚地反映其受奴役的社会身份，所有格后缀译为“自己的”。
- source_word: וְאַחֲרִיתוֹ
  choice: 最终
  rationale: אַחֲרִית 指末后或最终结局；“最终”简明地传达本句所强调的后来结果。
- source_word: יִהְיֶה
  choice: 就会成为
  rationale: 该动词在此连接主语与疑难谓语 מָנוֹן；按“儿子”的理解译为“成为”，同时不额外说明其法律或家庭地位。
- source_word: מָנוֹן
  choice: 儿子
  rationale: 这是一个罕见且含义不确定的词；正文采用与“儿子”相关的古老理解，但以脚注明确交代其他可能解释，避免掩盖原文的不确定性。
theological_decisions:
- issue: 奴隶后来所得身份或造成的结果
  choice: 正文译为“成为儿子”
  alternative: “像儿子一样行事”“带来麻烦”或“变得不服管束”
  rationale: 原文末词 מָנוֹן 的意义不确定。正文保留与“儿子”相关的理解，不把它扩展为收养或继承等特定制度或神学概念；其他主要解释列入脚注。
translation_notes:
  register: 采用现代、凝练的箴言体。“娇惯”点明纵容意味；“奴隶”反映原文所处的主从社会关系。正文不添加“主人的”等原文未明说的关系说明，并借脚注保留末词的真实歧义。
