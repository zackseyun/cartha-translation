  text: כָּל ר֭וּח/וֹ יוֹצִ֣יא כְסִ֑יל וְ֝/חָכָ֗ם בְּ/אָח֥וֹר יְשַׁבְּחֶֽ/נָּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/029/011.yaml
  text: A fool lets out all his spirit[a], but a wise man holds it back.
translation:
  language: zh_hans
  text: 愚昧人把满腔情绪[a]都发泄出来；智慧人却把它克制住。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “情绪”也可译作“怒气”“性情”或“心灵”。末句的希伯来文表达较难确定；也可理解为“使它平静”或“把它留在后面”，即不立刻发泄。
    reason: 说明רוּחוֹ的语义范围，并保留末句有关平静、延后和克制的解释可能，不将争议性理解写成正文的双重断言。
lexical_decisions:
- source_word: כָּל רוּחוֹ
  choice: 心中的气全都
  rationale: רוּחַ可指灵、气息、性情或怒气；这里与失去克制相联。“心中的气”保留原文“气”的意象，又能让现代读者自然理解为内在情绪或冲动；כָּל译为“全都”，突出毫无保留。
- source_word: יוֹצִיא
  choice: 发泄出来
  rationale: 该使役形本义为“使之出来”。在情绪语境中，“发泄出来”自然表达把内在的气全部释放，同时保留“出来”的方向性。
- source_word: כְסִיל
  choice: 愚昧人
  rationale: 这是智慧文学中惯用的道德和实践范畴，并非单指智力不足；“愚昧人”庄重且符合《箴言》的常用表达。
- source_word: חָכָם
  choice: 智慧人
  rationale: 原文为阳性单数、用作代表性称谓；“智慧人”既贴近形式，也在汉语中可泛指具有智慧的人。
- source_word: בְּאָחוֹר יְשַׁבְּחֶנָּה
  choice: 把它平息，按捺住
  rationale: 此短语解释困难：בְּאָחוֹר有“在后面、往后”之意，动词可表达平静、止息或控制。“平息，按捺住”保留安静情绪与克制不发两层可能含义，而不把原文限定为单一解释。
theological_decisions: []
translation_notes:
  register: 采用现代、简洁而庄重的箴言体。“发泄出来”与“平息，按捺住”形成鲜明对照；脚注保留希伯来语在“气、怒气、心灵”及“平静、克制”之间的真实歧义。
