  text: A rod and reproof give wisdom[a], but a boy left to himself brings shame to his mother.
translation:
  language: zh_hans
  text: 杖和责备使人得智慧；不受管束的少年[a]使母亲蒙羞。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“被放任的少年”“任其自行的少年”或“不受管教的少年”。希伯来语字面指被“放开”或“任其离去”的少年。
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׁבֶט
  choice: 杖
  rationale: 保留原文具体的“杖”这一形象；在本节的管教语境中，它指用于管教的杖，但正文不把形象直接释义为“惩罚”。
- source_word: וְתוֹכַחַת
  choice: 和责备
  rationale: תוֹכַחַת指言语上的责备、劝戒或纠正。“责备”与“杖”并列，清楚呈现行动管教与言语纠正两个方面。
- source_word: יִתֵּן חָכְמָה
  choice: 使人有智慧
  rationale: 原文直译为“给予智慧”。现代汉语用“使人有智慧”自然地表达其使役效果，同时保留格言的简洁。
- source_word: נַעַר
  choice: 少年
  rationale: נַעַר可指男孩、少年或青年；此处是在父母管教之下、会使母亲蒙羞的男性后辈。“少年”既保留男性年龄指向，又不过度限定具体岁数。
- source_word: מְשֻׁלָּח
  choice: 被放任不管
  rationale: 该词是שלח的被动分词，基本含义为“被放开、任其离去”。在管教语境中指不受约束、无人管教；“被放任不管”兼顾被动形式与语境含义。
- source_word: מֵבִישׁ
  choice: 使……蒙羞
  rationale: בוש的使役形表达“使某人羞愧、蒙受羞辱”。“使母亲蒙羞”简洁保留了使役意义。
- source_word: אִמּוֹ
  choice: 母亲
  rationale: 第三人称阳性单数后缀回指“少年”。汉语在同一句中无需重复“他的”，仍能明确表达“他的母亲”。
theological_decisions: []
