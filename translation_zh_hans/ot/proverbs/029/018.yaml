  text: בְּ/אֵ֣ין חָ֭זוֹן יִפָּ֣רַֽע עָ֑ם וְ/שֹׁמֵ֖ר תּוֹרָ֣ה אַשְׁרֵֽ/הוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/029/018.yaml
  text: Where there is no vision[a], a people cast off restraint[d][c][b]; but the one who keeps the law—happy is he.
translation:
  language: zh_hans
  text: 没有异象[a]，百姓便放纵不羁[b]；谨守律法[c]的人有福了[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “异象”也可译作“启示”或“先知性异象”；这里指来自上帝的启示，并非仅指人的计划、抱负或远见。
    reason: lexical_alternative
  - marker: b
    text: “放纵不羁”也可译作“失去约束”或“任意而行”。
    reason: lexical_alternative
  - marker: c
    text: “律法”也可译作“训诲”或“教导”。
    reason: lexical_alternative
  - marker: d
    text: “有福了”也可译作“快乐的”或“何等有福”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאֵין
  choice: 没有
  rationale: בְּ与אַיִן构成“在没有……的情况下／当没有……”的条件性表达。汉语用“没有”开篇，简洁自然，并保留格言的一般条件结构。
- source_word: חָזוֹן
  choice: 异象
  rationale: 该词通常指来自上帝的启示性或先知性异象，而非人的规划或抱负。“异象”既符合圣经语境，也保留原词的意象；脚注进一步澄清其启示性质。
- source_word: יִפָּרַע
  choice: 放纵不羁
  rationale: פרע的Niphal形式在此表示不受约束、任意而行。“放纵不羁”传达群体摆脱约束、失去节制的状态；不采用缺乏词义依据的“灭亡”。
- source_word: עָם
  choice: 百姓
  rationale: עָם是单数集合名词，泛指一个群体。“百姓”在现代汉语中自然地保留其集合意义，且适合智慧文学的公共社会语境。
- source_word: וְשֹׁמֵר
  choice: 谨守……的
  rationale: 分词描述一类具有持续特征的人。“谨守……的”表达持续遵行，连接词则按两分句的对照关系用分号和语义转折体现，无须机械译出“而”。
- source_word: תּוֹרָה
  choice: 律法
  rationale: תּוֹרָה可泛指教导，也可带有上帝律法的约束力。此处与“异象”相对并置，“律法”较能保留其启示与规范分量；“训诲／教导”列入脚注。
- source_word: אַשְׁרֵהוּ
  choice: 他是有福的
  rationale: אַשְׁרֵי表达智慧文学中的福乐宣告，后缀为第三人称阳性单数。“他是有福的”保留单数形式和格言式祝福语气，也比单说“快乐”更能涵盖蒙福、处境美好的意味。
theological_decisions:
- issue: חָזוֹן所指的“异象”是否只是人的远见或规划
  choice: 理解为来自上帝的启示性、先知性异象
  alternative: 理解为一般的社会方向、领导愿景或人生规划
  rationale: 在圣经希伯来语中，חָזוֹן通常属于先知启示的语域。本节论及缺少神圣启示所造成的社会后果，并非提出有关组织愿景的通则。正文保留简洁的“异象”，脚注说明其范围。
- issue: תּוֹרָה在本节中的范围
  choice: 正文译为“律法”，保留其来自上帝并具有规范力的含义
  alternative: 译为“训诲”或“教导”，强调较广泛的智慧教导
  rationale: תּוֹרָה本可泛指教导，但它在此与启示性的חָזוֹן并列，并以“谨守”为搭配，因而“律法”较能呈现其神圣规范性。由于“教导”仍是词义上真实的可能，故以脚注明示。
- issue: אַשְׁרֵהוּ的阳性单数与福乐语气
  choice: 译作“他是有福的”，保留代表性的阳性单数和福语形式
  alternative: 译作“这样的人有福了”或“这样的人是快乐的”
  rationale: 原文后缀是阳性单数，所指具有代表性。“他”准确保留语法形式；“有福”则传达אַשְׁרֵי在智慧文学中的整体兴盛与可羡状态，不把它缩减为主观情绪。
translation_notes:
  register: 采用现代、庄重而易懂的格言体。两分句结构紧凑，以分号呈现群体失序与个人谨守之间的鲜明对照。“异象”“律法”“有福”保留圣经智慧文学和启示语境的分量，同时通过脚注防止现代管理学式误读，并呈现真实的词义选项。
