base_translation:
  language: en
  yaml_path: translation/ot/proverbs/029/005.yaml
  text: A man who flatters his neighbor spreads a net for his steps[a][b].
translation:
  language: zh_hans
  text: 向邻舍阿谀奉承的人[a]，在他的脚步前张设网罗[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“朋友”或“同伴”。希伯来语 רֵעַ 可指邻舍、朋友或同伴。
    reason: lexical_alternative
  - marker: b
    text: 直译“在他的脚步上”；在设网的语境中，也可理解为“为他的脚步”或“在他的脚前”，描绘在人将要走过之处设网陷害他的景象。
    reason: lexical_alternative
lexical_decisions:
- source_word: גֶּבֶר
  choice: 人
  rationale: 原词为阳性单数，通常指男子，但在箴言的格言体中可代表一般人。汉语用“人”既自然，也保留这种普遍适用的表达，不必额外加入性别限定。
- source_word: מַחֲלִיק
  choice: 奉承
  rationale: 这是 חלק 的使役分词形式，在此指使言语圆滑，即用好听的话讨好人。“奉承”简洁、自然，并准确传达其负面伦理含义。
- source_word: עַל רֵעֵהוּ
  choice: 邻舍
  rationale: רֵעַ 可指邻舍、朋友或同伴；“邻舍”保留较宽的社会关系范围。介词 עַל 与此动词连用时不宜逐字译出，而由“奉承邻舍”自然表达。
- source_word: רֶשֶׁת
  choice: 网罗
  rationale: 原词指捕捉猎物的网。“网罗”在现代汉语经文语体中清楚而庄重，同时保留具体的设陷阱意象。
- source_word: פּוֹרֵשׂ
  choice: 铺设
  rationale: 原词意为展开、铺开；与“网罗”搭配时，“铺设”自然地表达把网张开设在路上的动作。
- source_word: עַל פְּעָמָיו
  choice: 在他的脚步前
  rationale: פְּעָמִים 字面指脚步或脚。“在他的脚步前”保留原文身体与行路的图像，也清楚表达网罗被设在对方将要踏足之处；代词最自然地回指被奉承的邻舍。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的箴言体。“就是”明确前后两分句的解释关系：奉承人的行为本身如同为对方设下网罗，但不进一步判定这是有意陷害还是奉承所造成的结果。所有脚注标记均已置于正文对应处。
