  text: אִ֣ישׁ תּ֭וֹכָחוֹת מַקְשֶׁה עֹ֑רֶף פֶּ֥תַע יִ֝שָּׁבֵ֗ר וְ/אֵ֣ין מַרְפֵּֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/029/001.yaml
  text: A man often reproved[a], who stiffens his neck, will suddenly be broken beyond healing.
translation:
  language: zh_hans
  text: 人屡受责备[a]，却仍硬着颈项，必突然破碎，无可救治。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译可作“一个屡受责备的人”；“责备”为复数，含有多次受到责备的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: 人
  rationale: 希伯来语为阳性单数名词，在智慧文学格言中指一个有代表性的人；现代汉语用“人”既保留单数泛指的功能，也自然简洁。
- source_word: תּוֹכָחוֹת
  choice: 屡受责备
  rationale: 该词是“责备、劝诫”的复数形式，在这里表示多次受到责备；译为“屡受责备”比直译“责备之人”更符合现代汉语。
- source_word: מַקְשֶׁה עֹרֶף
  choice: 却仍硬着颈项
  rationale: 原文直译为“使颈项刚硬”，是形容固执抗拒的身体隐喻；保留“硬着颈项”可传达原文意象，“却仍”表达与屡次受责备之间自然形成的转折，但不改变命题内容。
- source_word: פֶּתַע
  choice: 突然
  rationale: 准确表达事情猝然发生，简洁而自然。
- source_word: יִשָּׁבֵר
  choice: 必……破碎
  rationale: 该动词为被动形态，基本义是“被打破、破碎”；保留破碎的隐喻，不限定为身体、社会或道德层面的毁灭。
- source_word: וְאֵין מַרְפֵּא
  choice: 无可救治
  rationale: 原文意为“并且没有医治／补救”；“无可救治”在现代汉语中自然地表达其不可挽回的终局性。
theological_decisions: []
