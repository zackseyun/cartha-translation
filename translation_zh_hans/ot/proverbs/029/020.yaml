  text: Do you see a man who is hasty in his words? There is more hope for a fool than for him[a].
translation:
  language: zh_hans
  text: 你见过说话急躁的人吗？愚昧人比他更有指望。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 开头的完成式动词也可按字面译作“你看见了／你见过……吗？”；在此可理解为带有观察意味的修辞性问句。
    reason: lexical_alternative
lexical_decisions:
- source_word: חָזִיתָ
  choice: 你见过……吗
  rationale: 这是חזה的Qal完成式第二人称阳性单数；在智慧文学中可作反问式观察。译作“你见过……吗”既保留完成式可能表达的既往观察，也符合现代汉语箴言式问句。
- source_word: אִישׁ
  choice: 人
  rationale: 原文为阳性单数“男人／人”。现代汉语“人”可自然承载此处的代表性单数，不必加入原文未强调的性别意味。
- source_word: אָץ
  choice: 急躁
  rationale: 该词指过于匆忙、冒失；与言语搭配时，“说话急躁”自然地表达未经思量便出口的意味，同时不过度扩展为一般性的冲动。
- source_word: בִּדְבָרָיו
  choice: 说话
  rationale: 字面为“在他的话语上／在他的话语中”。汉语译作“说话急躁”最自然，并准确把焦点放在言语行为上。
- source_word: תִּקְוָה
  choice: 指望
  rationale: 此处指改善或有好结果的希望。“有指望”是现代汉语中简洁而自然的箴言表达。
- source_word: לִכְסִיל
  choice: 愚昧人
  rationale: כְּסִיל是《箴言》的核心智慧术语，兼有认知迟钝与道德悖逆的意味；“愚昧人”比单纯表示智力低下的词更能保留其伦理内涵。
- source_word: מִמֶּנּוּ
  choice: 比他更
  rationale: 介词מִן在此表达比较。汉语需将比较关系显明译出；“愚昧人比他更有指望”简明，并清楚回指说话急躁的人。
