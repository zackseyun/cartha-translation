  text: גַּאֲוַ֣ת אָ֭דָם תַּשְׁפִּילֶ֑/נּוּ וּ/שְׁפַל ר֝֗וּחַ יִתְמֹ֥ךְ כָּבֽוֹד־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/029/023.yaml
  text: A man's pride will bring him low[a], but one who is lowly in spirit will obtain honor.
translation:
  language: zh_hans
  text: 人的骄傲必使他降卑；心灵谦卑的人必得尊荣。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“必持守尊荣”或“必获得尊荣”。希伯来语动词可表示抓住、持守或取得。
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּאֲוַת
  choice: 骄傲
  rationale: 该词表示自高、自负或傲慢；“骄傲”自然明白，并与下半句的谦卑形成鲜明对照。
- source_word: אָדָם
  choice: 人
  rationale: 这里是单数泛指，指任何一个人；现代汉语用“人”即可保留这种普遍适用性，无须增添性别限定。
- source_word: תַּשְׁפִּילֶנּוּ
  choice: 必使他降卑
  rationale: 使役词形表达“使……降低、卑下”；“使他降卑”既保留使役关系，也与后面的“尊荣”相对。
- source_word: וּשְׁפַל רוּחַ
  choice: 心灵谦卑的人
  rationale: 原文直译近于“灵里低微的”；“心灵谦卑的人”在现代汉语中自然，同时保留这是内在性情而非外在地位的意思。
- source_word: יִתְמֹךְ
  choice: 必得
  rationale: תמך通常有抓住、扶持、持守等义；以“尊荣”为宾语时，可表达取得或拥有尊荣。“必得”简洁自然，同时以脚注保留“持守”等可能理解。
- source_word: כָּבוֹד
  choice: 尊荣
  rationale: 在箴言的智慧语境中，该词主要指尊贵、荣誉或受人敬重；“尊荣”比偏神学语境的“荣耀”更贴切。
theological_decisions:
- issue: יִתְמֹךְ כָּבוֹד 的语义关系
  choice: 必得尊荣
  alternative: 必持守尊荣
  rationale: 原文动词可指抓住、托住或持守；与“尊荣”搭配时，“得尊荣”最符合上下句由降卑与受尊崇构成的对照，但原文并未排除“持守尊荣”的含义，因此在脚注中保留该可能。
translation_notes:
  register: 采用简洁、对称的箴言体。“人的骄傲……；心灵谦卑的人……”符合现代标准汉语，又保留原文的因果关系和反义对照。脚注标记置于其实际所解释的“必得尊荣”之后。
