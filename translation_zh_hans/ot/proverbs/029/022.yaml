base_translation:
  language: en
  yaml_path: translation/ot/proverbs/029/022.yaml
  text: An angry man stirs up strife[b][a], and a hot-tempered man abounds in transgression.
translation:
  language: zh_hans
  text: 易怒的人[a]挑起纷争，性情暴烈的人[b]多有过犯[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语字面为“怒气之人”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语字面为“怒气的主人”，指以烈怒为性情特征的人。
    reason: lexical_alternative
  - marker: c
    text: 或译：“使过犯增多。”
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ אַף
  choice: 易怒的人
  rationale: 字面为“怒气之人”，是指常受怒气支配、容易发怒的人；“易怒的人”符合现代汉语习惯，也表达其性情特征。
- source_word: יְגָרֶה
  choice: 挑起
  rationale: 该动词有激起、煽动之意；与“纷争”搭配时，“挑起”自然且准确。
- source_word: מָדוֹן
  choice: 纷争
  rationale: 该词指争执、争端或不和；“纷争”简洁庄重，适合智慧文学语体。
- source_word: בַעַל חֵמָה
  choice: 性情暴烈的人
  rationale: 字面为“烈怒的主人”，是指以盛怒、暴怒为性情特征的人；此译法与上句“易怒的人”形成递进而不机械重复。
- source_word: רַב
  choice: 多有
  rationale: 这里表达数量众多或充斥于某事；“多有过犯”保留“过犯很多”的基本句法关系，同时不排除“使过犯增多”的语义联想。
- source_word: פָּשַׁע
  choice: 过犯
  rationale: 该词可指越界、悖逆或严重的罪过；“过犯”保留其道德分量，又不把语义限定为政治性的叛乱。
theological_decisions:
- issue: רַב פָּשַׁע 的句法和意义
  choice: 多有过犯
  alternative: 使过犯增多；罪过累累
  rationale: 希伯来语可自然理解为此人“过犯很多”，也可能使人联想到过犯的增多。正文采用贴近表层句法而自然的“多有过犯”，脚注保留另一种理解，不把责任范围或犯罪方式具体化。
translation_notes:
  register: 采用简洁、对称的现代标准汉语，保留箴言的警句节奏。“易怒”与“性情暴烈”体现原文 אַף 和 חֵמָה 在怒气强度上的变化；“纷争”与“过犯”保持庄重而易懂的智慧文学语域。
