base_translation:
  language: en
  yaml_path: translation/ot/proverbs/029/027.yaml
  text: An unjust man is an abomination to the righteous[b][a], and one whose way is upright is an abomination to the wicked.
translation:
  language: zh_hans
  text: 行不义的人为义人所憎恶；行事正直的人为恶人所憎恶。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תּוֹעֲבַת
  choice: 厌恶
  rationale: 该词表示强烈的憎恶、嫌恶；此处两次构成对称句式。译作“厌恶”自然、庄重，并保留鲜明的道德排斥意味。
- source_word: צַדִּיקִים
  choice: 义人
  rationale: 复数形容词名词化，指以正义为特征的一类人。“义人”是智慧文学中自然且稳定的对应表达。
- source_word: אִישׁ עָוֶל
  choice: 行不义的人
  rationale: אִישׁ 与 עָוֶל 合用，指以不义、邪曲为特征的人。汉语不必机械保留阳性形式；“行不义的人”准确表达代表性的泛指意义，也比“不义之人”更口语易懂。
- source_word: רָשָׁע
  choice: 恶人
  rationale: 单数形容词名词化并作类别性泛指，与前句“义人”形成清楚对照。
- source_word: יְשַׁר דָּרֶךְ
  choice: 行为正直的人
  rationale: 原文直译为“道路正直者”，其中“道路”是生活方式和品行的隐喻。译为“行为正直的人”使现代读者直接把握伦理含义，同时不过度扩展原文。
- source_word: דָּרֶךְ
  choice: 行为
  rationale: 此处“道路”惯用于指人的生活方式或行事为人；汉语译作“行为”比“道路”更自然，并明确其道德语境。
theological_decisions:
- issue: 两句所表达的相互厌恶是否应加以道德等同
  choice: 保持原文的平行对照，不添加双方在道德上等同的暗示
  alternative: 将本节解释性改写为义人与恶人彼此仇视
  rationale: 原文描述义人与恶人彼此视对方为可憎，却没有说两种判断在道德上具有同等正当性。译文保留这种张力，不作额外评断。
- issue: אִישׁ 的阳性形式与泛指范围
  choice: 译为“人”，按汉语习惯表达类别性泛指
  alternative: 译为“男人”或“男子”
  rationale: 上下文是关于道德类型的一般箴言，并非专指男性。现代汉语“人”忠实传达其代表性范围，不造成不必要的性别限定。
translation_notes:
  register: 采用简洁、对称的现代标准汉语，保留箴言的两行平行结构。两句重复“厌恶他”，对应原文两次 תּוֹעֲבַת，并使对照关系清楚有力。
