revisions:
- from: 行不义的人，义人厌恶他；行为正直的人，恶人也厌恶他。
  to: 行不义的人为义人所憎恶；行事正直的人为恶人所憎恶。
  rationale: 消除代词回指歧义，并以“所憎恶”保留原文强烈的道德排斥语气。译文仍维持原文的两个平行分句；“行事正直的人”自然表达“道路正直者”的生活行为隐喻，未添加解释性立场。
