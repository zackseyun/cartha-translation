base_translation:
  language: en
  yaml_path: translation/ot/proverbs/029/014.yaml
  text: A king who judges the poor with truth—his throne will be established forever[a].
translation:
  language: zh_hans
  text: 君王以真理[a]审判穷人，他的宝座必永远坚立。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “以真理”也可译作“忠实地审判”或“公正地审判”。希伯来语“真理”在这里可含真实、信实、可靠或司法公正之意。
    reason: lexical_alternative
lexical_decisions:
- source_word: מֶלֶךְ
  choice: 君王
  rationale: 此处是泛指，陈述关于君王的一般原则；“君王”保留具体的王权语境，中文无需另加不定冠词。
- source_word: שׁוֹפֵט
  choice: 审判
  rationale: 分词描述君王的行为；“审判”保留司法裁断的含义，比宽泛的“治理”更贴近原文。
- source_word: בֶּאֱמֶת
  choice: 按真理
  rationale: אֱמֶת可指真实、信实、可靠，并在司法语境中含公正之意。“按真理”保留原词的开放性，不把意义仅限于“公正”或“忠实”。
- source_word: דַּלִּים
  choice: 贫寒人
  rationale: דַּלִּים指贫穷、卑微或弱势者；“贫寒人”自然庄重，并保留经济贫困及社会弱势的语感。
- source_word: כִּסְאוֹ
  choice: 他的王位
  rationale: 原词本义为“宝座”，也转喻王权与统治。“王位”在现代汉语中自然地表达其统治地位，同时保留王权意象。
- source_word: לָעַד
  choice: 永远
  rationale: 忠实表达持续长久的时间用语；在智慧文学中可按体裁理解为持久稳固，不必额外加入形而上的绝对保证。
- source_word: יִכּוֹן
  choice: 必……坚立
  rationale: כון的尼斐勒形态表示被确立、稳固；“坚立”兼顾其结果状态及王位稳固的意象，“必”体现未完成式在格言中的确定结果。
theological_decisions:
- issue: 智慧文学中לָעַד的力度
  choice: 译作“永远”，保留原文对王位长久稳固的强烈表述。
  alternative: 译作“长久”或“长存”。
  rationale: “永远”最直接对应原文；其具体力度应由箴言体裁来界定，不在译文中削弱，也不把它扩展为本文未明说的绝对形而上保证。
- issue: בֶּאֱמֶת在司法语境中的含义
  choice: 正文译作“按真理”，脚注说明也可理解为忠实或公正地施行审判。
  alternative: 正文直接译作“公正地”或“忠实地”。
  rationale: 原词同时涵盖真实、信实、可靠，并可在审判语境中指公正；保留较直译的表达可避免消除原文的语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的箴言体表达。以“君王”保持王权背景，以“贫寒人”涵盖贫穷和弱势处境；破折号关系改用逗号衔接，使中文自然流畅。
