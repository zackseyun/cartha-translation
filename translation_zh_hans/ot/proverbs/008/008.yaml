  yaml_path: translation/ot/proverbs/008/008.yaml
  text: All the words of my mouth are righteous[a]; there is nothing twisted or crooked in them.
translation:
  language: zh_hans
  text: 我口中的一切话都合乎公义；其中没有弯曲或乖谬之处。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּצֶדֶק
  choice: 合乎公义
  rationale: 介词 בְּ 与 צֶדֶק 的组合表达言语处于或符合公义的准则。“合乎公义”既保留这一关系，也比直译“在公义中”更符合现代汉语。
- source_word: כָּל אִמְרֵי פִי
  choice: 我口中的一切话
  rationale: 保留“口”的具体意象，并以“一切”传达 כָּל 的周全范围；“话”自然对应这里的言语、话语。
- source_word: אֵין בָּהֶם
  choice: 其中没有……之言
  rationale: 以自然汉语重组存在否定，同时让复数代词 בָּהֶם 清楚回指前面的“一切话”。补出“之言”仅为句法完整，并未增加新的语义内容。
- source_word: נִפְתָּל
  choice: 弯曲
  rationale: 该词可指扭曲、乖谬或诡诈；“弯曲”保留希伯来语具体而道德化的空间隐喻。
- source_word: וְעִקֵּשׁ
  choice: 诡谬
  rationale: עִקֵּשׁ 表示乖僻、歪曲或悖谬。“诡谬”与“弯曲”形成近义强化，也避免将两个词完全合并为同一概念。
theological_decisions: []
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“合乎公义”比“都是公义的”更贴近 בְּצֶדֶק 的介词结构；后半句保留两个近义词的并列强化，不将其解释为特定教义概念。
