source:
  edition: WLC
  text: יִֽרְאַ֣ת יְהוָה֮ שְֽׂנֹ֫את רָ֥ע גֵּ֘אָ֤ה וְ/גָא֨וֹן וְ/דֶ֣רֶךְ רָ֭ע וּ/פִ֨י תַהְפֻּכ֬וֹת שָׂנֵֽאתִי׀׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/013.yaml
  text: The fear of Yahweh is to hate evil[a]; pride and arrogance and the way of evil and a mouth of perversions I hate.
translation:
  language: zh_hans
  text: 敬畏耶和华，就是恨恶邪恶；骄傲、狂妄、邪恶的道路和乖谬的言语[a]，我都恨恶。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“乖谬之口”；也可译作“说歪曲话的口”。
    reason: 保留 פִי תַהְפֻּכוֹת 的身体部位转喻和“扭曲、乖谬”这一词义范围。
lexical_decisions:
- source_word: יִרְאַת יְהוָה
  choice: 敬畏耶和华
  rationale: 该组合词指向对耶和华怀有敬惧与尊崇；“敬畏”是现代汉语圣经语体中自然且准确的对应。专名采用“耶和华”，直接对应四字神名。
- source_word: שְׂנֹאת רָע
  choice: 就是恨恶邪恶
  rationale: 不定式结构在此作表语，说明敬畏耶和华体现为何种态度；“就是恨恶”保留其动词力量，“邪恶”表达道德层面的恶。
- source_word: גֵּאָה וְגָאוֹן
  choice: 骄傲、狂妄
  rationale: 两个近义词并列，均指自高；分别译作“骄傲”和“狂妄”，既保留语义重叠，也体现措辞差别。
- source_word: דֶרֶךְ רָע
  choice: 邪恶的道路
  rationale: 保留“道路”这一表示行为方式或人生取向的希伯来语隐喻，同时使中文表达自然。
- source_word: פִי תַהְפֻּכוֹת
  choice: 乖谬的言语
  rationale: 字面为“乖谬之口”，实际指从口中说出的扭曲、悖逆之言；正文采用自然中文表达，并以脚注保留较形式对应的译法。
- source_word: שָׂנֵאתִי
  choice: 我都恨恶
  rationale: 第一人称完成式在智慧文学的格言陈述中表达恒常立场，汉语以现在时理解；加入“都”自然统摄前列各项。
theological_decisions:
- issue: 智慧话语中第一人称说话者的身份
  choice: 保留“我都恨恶”，不在经文中补明说话者身份
  alternative: 明确译成“智慧恨恶”或解释为上帝亲自说话
  rationale: 希伯来文本在“智慧”的讲话语境中直接使用第一人称，却未在本节重新指明身份；不作补充可保留人格化智慧话语的文学形式及其神学张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“敬畏”“恨恶”“乖谬”保持箴言体的凝练与力度；分号呈现前半句的定义与后半句第一人称列举之间的结构转折。
