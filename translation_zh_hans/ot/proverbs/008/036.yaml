  text: וְֽ֭/חֹטְאִ/י חֹמֵ֣ס נַפְשׁ֑/וֹ כָּל מְ֝שַׂנְאַ֗/י אָ֣הֲבוּ מָֽוֶת־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/036.yaml
  text: But the one who sins against me wrongs his own soul[b][a]; all who hate me love death.
translation:
  language: zh_hans
  text: 但得罪我的人[a]，是在残害自己的性命[b]；凡恨我的，都喜爱死亡。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “得罪”所译的希伯来语动词也可表示“错过”或“未中”；本句也可理解为“错过我的人”或“未能寻得我的人”。
    reason: lexical_alternative
  - marker: b
    text: 较直译：“向自己的性命施暴”；“性命”也可译为“生命”“自身”或“魂”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְחֹטְאִי
  choice: 但得罪我的人
  rationale: חטא 可表示“犯罪、得罪”，其基本意象也可涉及“错过、未中”。这里带第一人称宾语“我”，译作“得罪我的人”自然庄重，并保留对智慧本人作出背离的道德意味；脚注说明其词义幅度。
- source_word: חֹמֵס
  choice: 是在残害
  rationale: חמס 在此为分词，可表达施暴、亏负或伤害。“残害”保留原文强烈的暴力色彩，又能自然描述拒绝智慧所造成的自我毁损。
- source_word: נַפְשׁוֹ
  choice: 自己的性命
  rationale: נפש 可指生命、性命、自身或魂。“自己的性命”在现代汉语中既自然，又避免把经文限定为后世严格的灵魂—身体二分。
- source_word: כָּל מְשַׂנְאַי
  choice: 凡恨我的
  rationale: 保留 כָּל 的全称范围及“恨我”的持续性人物特征，形式简洁，符合箴言的对称结构。
- source_word: אָהֲבוּ מָוֶת
  choice: 都喜爱死亡
  rationale: 完成式在箴言格言中表达普遍事实，汉语用现在时语感的“喜爱”最合适；“死亡”直接保留其与生命相对的字面及神学张力。
theological_decisions:
- issue: נפש 在自我伤害语句中的人论含义
  choice: 译为“自己的性命”
  alternative: 自己的灵魂；自己
  rationale: “性命”兼顾生命与整个人的含义，不把经文缩窄为仅仅身体死亡，也不强加严格的灵魂实体观。
- issue: חטא 带“我”作宾语时的含义
  choice: 正文译为“得罪我的人”，脚注保留“错过我／未寻得我”的可能
  alternative: 错过我的人；未能寻得我的人
  rationale: 上下文既有寻求、寻见智慧的意象，也有拒绝智慧的道德责任。正文采用自然且有道德力度的“得罪”，脚注保留词根及语境所容许的另一层意思，不消解原文张力。
translation_notes:
  register: 采用现代标准普通话，句式凝练而庄重，保留希伯来诗句两半之间“残害自己的性命／喜爱死亡”的平行与递进。用“是在残害”凸显行为的自我毁灭性质，同时不额外解释“死亡”的范围。
