base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/034.yaml
  text: Blessed is the man who listens to me[a], watching at my doors day by day, keeping watch at the doorposts of my entrances.
translation:
  language: zh_hans
  text: '听我话的人[a]有福了！


    他天天在我的门前警醒等候，


    在我各个入口的门柱旁守望。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文“人”是单数形式，在这里泛指任何听智慧之言的人，并非只指男性。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: 有福了
  rationale: 表达蒙福、兴盛的状态，保留智慧文学中祝福宣告的语气；比单纯的“快乐”含义更完整。
- source_word: אָדָם
  choice: 人
  rationale: 原文为单数名词，在这里具有泛指作用，指任何听从智慧的人；现代汉语用“人”既保留单数代表性，也不把所指限于男性。
- source_word: שֹׁמֵעַ לִי
  choice: 听从我的
  rationale: 既保留“听”的意象，也自然传达对拟人化智慧留心接受的意味，而不把含义完全收窄为“服从”。
- source_word: לִשְׁקֹד
  choice: 警醒
  rationale: 该词表示殷勤、警觉地守望；“警醒”体现持续专注，并与门前等候的场景相合。
- source_word: עַל דַּלְתֹתַי
  choice: 在我的门前
  rationale: 自然表达守候于智慧之门所在之处；“门”清楚保留原文的具体建筑意象。
- source_word: יוֹם יוֹם
  choice: 天天
  rationale: 原文重复“日、日”，强调持续而有规律；“天天”是简洁自然的现代汉语对应。
- source_word: לִשְׁמֹר
  choice: 守候
  rationale: 原词可指看守、守望或留心；此处不是防卫门户，而是在入口旁专注等候，因此译作“守候”。
- source_word: מְזוּזוֹת
  choice: 门柱
  rationale: 准确保留门框两侧立柱的具体建筑意象。
- source_word: פְּתָחָי
  choice: 我入口的
  rationale: 保留原文复数“入口”的概念，并与前句的“门”形成可辨认的平行，而不将两个词完全合并。
theological_decisions:
- issue: 智慧祝福语中 אָדָם 的泛指范围
  choice: 人
  alternative: 男人；任何人
  rationale: אָדָם 虽为单数形式，此处却是代表性的泛指，并非仅指男性。译作“人”符合现代汉语表达，又不必增添原文没有的“任何”一词；脚注说明其单数泛指作用。
translation_notes:
  register: 采用现代、庄重而易懂的智慧文学语体。三行结构呈现祝福宣告及两个平行的持续动作；“警醒／守候”和“门前／入口的门柱旁”保留原文的门口守望图景及细微词汇差别。
