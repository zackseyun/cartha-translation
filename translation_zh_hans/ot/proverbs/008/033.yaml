base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/033.yaml
  text: Hear instruction and become wise[a], and do not neglect it.
translation:
  language: zh_hans
  text: 要听从训诲，得智慧；不可弃绝它。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“不可放开它”或“不可忽略它”。这个希伯来语动词可表示放开、撇弃或疏忽训诲。
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ
  choice: 要听
  rationale: 复数命令式；“听”保留了留心聆听并付诸顺从的宽广含义，而不直接窄化为“服从”。
- source_word: מוּסָר
  choice: 训诲
  rationale: 在《箴言》的智慧语境中，指塑造人的教导、管教与纠正；“训诲”兼顾庄重、可读性及培育性的含义。
- source_word: וַחֲכָמוּ
  choice: 成为有智慧的人
  rationale: 该动词的命令形式表达获得智慧、变得智慧，不只是维持已有的智慧状态。
- source_word: וְאַל
  choice: 不可
  rationale: 自然表达希伯来语否定命令，同时保持劝诫语气。
- source_word: תִּפְרָעוּ
  choice: 弃绝它
  rationale: פרע在此可指放开、撇弃或忽略；“弃绝”保留主动放弃训诲的力度，代词“它”补明上下文隐含的宾语。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“要听……不可……”呈现智慧教师直接劝诫的语气；分号保留两个并列命令之间的紧密关系。
