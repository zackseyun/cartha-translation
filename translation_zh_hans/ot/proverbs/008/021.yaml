  - severity: low
    issue: 脚注中的“实产”略显生硬
    rationale: “实产”在现代普通话中不如“产业”或“财物”自然；后两者足以保留 יֵשׁ 的“实有之物、 possessions”范围，同时可在整句释义中说明“使……承受”的含义。
