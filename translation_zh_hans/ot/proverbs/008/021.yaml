  yaml_path: translation/ot/proverbs/008/021.yaml
  text: to endow those who love me with wealth[a], and to fill their treasuries.
translation:
  language: zh_hans
  text: '使爱我的人承受财富[a]，

    并充满他们的库房。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “财富”或译“产业”“财物”；全句也可译为“使爱我的人承受实有之物”。
    reason: 保留 יֵשׁ 所指实有财物、产业的词义范围，并说明 לְהַנְחִיל 的“使承受产业”含义。
lexical_decisions:
- source_word: לְהַנְחִיל
  choice: 使……承受
  rationale: 希菲勒不定式表达“使某人继承、得着产业”。“使……承受”既保留继承所得的意味，也符合现代汉语诗体表达。
- source_word: אֹהֲבַי
  choice: 爱我的人
  rationale: 带第一人称单数后缀的分词，指以爱智慧为特征的人；译作“爱我的人”自然准确。
- source_word: יֵשׁ
  choice: 财富
  rationale: 该词本义与“存在、实有”相关，此处作名词，并与下句“库房”平行，宜理解为实际拥有的财物或产业；“财富”在现代汉语中清楚自然，同时以脚注保留“实产”等较贴近字面的可能译法。
- source_word: וְאֹצְרֹתֵיהֶם
  choice: 他们的库房
  rationale: אוֹצָר可指储藏财物的库房或宝库。译作“库房”保留具体空间意象，并适合与“充满”搭配。
- source_word: אֲמַלֵּא
  choice: 又使……充满
  rationale: 第一人称单数皮勒未完成式直译为“我要充满”。在本节中，它与前面的目的性不定式形成并列；汉语译作“又使他们的库房充满”，既体现智慧是施予者，也使句式连贯。
theological_decisions:
- issue: 人格化智慧所应许福分的性质
  choice: 按经文的具体意象译为“财富”和“库房”，不另加“真正的”“属灵的”等限定。
  alternative: 译作“真正的财富”“永恒的产业”，或将其处理为抽象的属灵福分。
  rationale: יֵשׁ与“库房”相互呼应，支持财物或实产的具体图景；但本节本身并未建立凡爱智慧者必定物质富足的完整教义。译文应保留原有张力，不扩大为繁荣神学式保证，也不将具体意象灵意化。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“承受财富”略带诗体色彩，用来保留原文“使继承、使得产业”的语义；“库房”维持具体的平行意象。脚注标记[a]已置于正文对应词后。
