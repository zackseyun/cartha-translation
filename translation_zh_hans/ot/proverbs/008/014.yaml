  text: לִֽ/י עֵ֭צָה וְ/תוּשִׁיָּ֑ה אֲנִ֥י בִ֝ינָ֗ה לִ֣/י גְבוּרָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/014.yaml
  text: Counsel and sound wisdom are mine[a]; I am understanding; strength is mine.
translation:
  language: zh_hans
  text: 谋略和成事的智慧都属于我[a]；我就是悟性，力量也属于我。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “成事的智慧”也可译作“稳健的智慧”或“有效的智慧”；全句也可译作：“谋略和稳健的智慧都属于我；我就是洞察力，力量也属于我。”
    reason: 原文תּוּשִׁיָּה可指稳健、有效、足以成事的智慧；בִּינָה也可译为“洞察力”。
lexical_decisions:
- source_word: עֵצָה
  choice: 谋略
  rationale: 此词在智慧文学中指审慎的谋划、筹策或劝导；“谋略”既符合本节庄重的拟人化话语，也比日常性的“建议”更贴近其语域。
- source_word: תוּשִׁיָּה
  choice: 真知灼见
  rationale: 此词兼有效用、稳健判断和实用智慧之意。“真知灼见”在现代汉语中自然庄重，能表达可靠而切实有效的智慧，但其丰富词义仍需脚注说明。
- source_word: אֲנִי בִינָה
  choice: 我就是悟性
  rationale: 希伯来语无系词句把说话者与“悟性”直接等同，并非只说她拥有悟性；“就是”保留这一强调性的述谓关系和智慧拟人化。
- source_word: גְבוּרָה
  choice: 能力
  rationale: 该词可指力量、能力或勇力。此处列举智慧所拥有的品质，“能力”较宽泛自然，也避免无根据地把语义限定为军事勇武。
- source_word: לִי ... לִי
  choice: 都属于我……也属于我
  rationale: 重复的לִי强调归属。重复“属于我”保留原文首尾呼应的占有结构；“都”和“也”使中文诗句流畅而不削弱强调。
theological_decisions:
- issue: 智慧的拟人化
  choice: 保留智慧以第一人称自述，并用“我就是悟性”呈现其拟人化的等同表述。
  alternative: 在译文中直接把说话者解释为基督，或弱化为“我有悟性”。
  rationale: 《箴言》8章让拟人化的智慧亲自说话。希伯来文本本身没有在本节明说后来的基督论认定，因此译文不预先解决这一神学诠释问题，也不削弱原文强烈的拟人表达。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“谋略”与“悟性”保留智慧文学语域；“属于我”的重复对应原文两个לִי，并维持诗句的首尾结构。脚注标记[a]已在正文出现。
