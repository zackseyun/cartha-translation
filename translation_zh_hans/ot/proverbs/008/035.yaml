  text: כִּ֣י מֹ֭צְאִ/י מצאי חַיִּ֑ים וַ/יָּ֥פֶק רָ֝צ֗וֹן מֵ/יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/035.yaml
  text: For whoever finds me finds life and obtains favor from Yahweh.
translation:
  language: zh_hans
  text: 因为凡找到我的人，就找到了生命，也从雅威那里获得恩宠。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上一节的劝勉并说明理由；现代汉语用“因为”自然清楚。
- source_word: מֹצְאִי
  choice: 找到我的
  rationale: 该形式指“找到我的人”，第一人称后缀指人格化的智慧；配合“……的”表达泛指，且不限定性别。
- source_word: חַיִּים
  choice: 生命
  rationale: 虽然形态上是复数，但在希伯来语中常作为表示“生命”的固定用法；译作单数“生命”符合汉语习惯。
- source_word: וַיָּפֶק
  choice: 得着
  rationale: 该动词在此表示获得、取得；“得着”既自然庄重，也没有过分强调人的主动掌控。
- source_word: רָצוֹן
  choice: 恩宠
  rationale: 此处表示来自上帝的悦纳、善意与眷顾；“恩宠”保留其关系性和赐予意味。
- source_word: מֵיְהוָה
  choice: 从雅威那里
  rationale: 介词 מִן 表明来源；专名 יְהוָה 音译为“雅威”，保留经文中的神圣名字。
theological_decisions:
- issue: 人格化智慧语境中的泛指单数
  choice: 找到我的，就……
  alternative: 找到我的人；凡找到我的
  rationale: 希伯来文是泛指单数，并不限于男性。汉语“找到我的，就……”自然地表达普遍适用的对象，同时保持紧凑。
- issue: יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；“雅威”较直接地转写该名，不以称号替代，也不引入宗派性解释。
- issue: 智慧与生命、神恩之间的关系
  choice: 找到生命，也从雅威那里得着恩宠
  alternative: 获得永生并蒙雅威拯救
  rationale: 原文只说“生命”和“恩宠”，未明确限定为永生或救恩；译文保留智慧文学表达的广度及其神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。用两个“找到”保留原文 מָצָא 的重复和修辞关联；“就……也……”呈现两项并列结果。
