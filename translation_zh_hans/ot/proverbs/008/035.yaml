  to: 因为凡找到我的人，就找到了生命，也从雅威那里获得恩宠。
  rationale: 修订仅补足汉语泛指结构中的“人”，并将“得着”调整为较现代自然的“获得”；保留因果衔接、原文“找到”的重复、生命的非限定含义，以及恩宠来自雅威这一来源关系。无需脚注。
