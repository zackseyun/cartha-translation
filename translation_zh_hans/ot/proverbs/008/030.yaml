  to: 那时，我在他身旁，是个巧匠[a]；我日日是他的喜悦，时时在他面前欢欣[b]。
  rationale: 仅作低风险的汉语语体和节奏调整：“日日”对应“日复一日”，“时时”对应“在一切时候”。保留“巧匠”及其异译脚注，不把有争议的אָמוֹן释为单一确定含义；脚注锚点仍分别紧随相关主文词语。
