  text: וָֽ/אֶהְיֶ֥ה אֶצְל֗/וֹ אָ֫מ֥וֹן וָֽ/אֶהְיֶ֣ה שַׁ֭עֲשֻׁעִים י֤וֹם י֑וֹם מְשַׂחֶ֖קֶת לְ/פָנָ֣י/ו בְּ/כָל עֵֽת׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/030.yaml
  text: Then I was beside him[a], like a master workman; and I was his delight day after day, rejoicing before him at all times[b],
translation:
  language: zh_hans
  text: 那时，我在他身旁，是个巧匠[a]；我日日是他的喜悦，时时在他面前欢欣[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“像个小孩子”（也可理解为“忠信者”）。这里译作“巧匠”的希伯来语词义较难确定，也可能带有不同含义。
    reason: alternative_reading
  - marker: b
    text: 或译：“时时在他面前嬉戏。”
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶהְיֶה
  choice: 我是／我都是
  rationale: 此处是智慧自述创造时的情景；按上下文译作过去状态“我在……是……”最自然。第二次出现时结合汉语表达译为“我天天都是”。
- source_word: אֶצְלוֹ
  choice: 在他身旁
  rationale: 保留 אצל 所表达的临近、陪伴之意，不进一步界定双方关系。
- source_word: אָמֹון
  choice: 巧匠
  rationale: 该词词义历来有争议；创造语境支持“工匠、巧匠”的理解，但“小孩子”或“忠信者”等释义仍有可能，故正文采用“巧匠”，脚注保留异读。
- source_word: שַׁעֲשֻׁעִים
  choice: 他的喜悦
  rationale: 该复数名词可指喜悦或令人喜悦的对象；与“我是”连用时，译作“我是他的喜悦”符合现代汉语，也保留智慧作为喜悦对象的诗意。
- source_word: יוֹם יוֹם
  choice: 天天
  rationale: 希伯来语逐字重复表达持续而有规律的“日复一日”；“天天”简洁自然。
- source_word: מְשַׂחֶקֶת
  choice: 欢欣
  rationale: שׂחק 可表示嬉戏、欢笑或喜乐。正文用庄重而自然的“欢欣”，脚注注明更具动作和游戏色彩的译法。
- source_word: לְפָנָיו
  choice: 在他面前
  rationale: 直接保留处于他面前、在他临在中的空间关系。
- source_word: בְּכָל עֵת
  choice: 时刻
  rationale: 表达“在一切时候”的持续性；“时刻”在现代汉语中简洁流畅。
theological_decisions:
- issue: אָמֹון 所暗示的智慧在创造中的身份或角色
  choice: 正文译作“巧匠”
  alternative: “小孩子”或“忠信者”
  rationale: 该词在词形和语义上确有歧义，不能据此经文独断智慧究竟是创造的工匠、在场嬉戏的孩子，还是忠信者。正文选用较符合创造语境的“巧匠”，同时用脚注明确保留其他可能，避免把后来的基督论或形而上学结论直接写进译文。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。“在他身旁”保留空间与关系意味；“天天……时刻……”再现原文的持续节奏。所有歧义均通过正文与脚注配合呈现，未作宗派化解释。
