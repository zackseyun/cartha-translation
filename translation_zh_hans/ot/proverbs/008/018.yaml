  text: עֹֽשֶׁר וְ/כָב֥וֹד אִתִּ֑/י ה֥וֹן עָ֝תֵ֗ק וּ/צְדָקָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/018.yaml
  text: Riches and honor are with me[b][a], enduring wealth and righteousness.
translation:
  language: zh_hans
  text: 财富和尊荣在我这里；长存的资财[a]和公义[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “长存的资财”也可译为“丰厚的资财”或“可观的资财”；עָתֵק 在这里可指持久、稳固，也可能强调丰厚、可观。
    reason: lexical_alternative
  - marker: b
    text: “公义”也可译为“正义”。
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹשֶׁר
  choice: 财富
  rationale: 指物质上的丰裕或财富；用“财富”符合现代汉语，也与后面的“财产”略作区分。
- source_word: כָבוֹד
  choice: 尊荣
  rationale: 在智慧文学中主要指社会上的尊重、地位和荣誉；“尊荣”比“荣耀”更贴合此处语境。
- source_word: אִתִּי
  choice: 在我这里
  rationale: 直译为“与我同在”；汉语用“在我这里”自然表达智慧拥有并能赐予这些益处。原文只出现一次，译文末尾补出一次，以使并列结构清楚。
- source_word: הוֹן
  choice: 财产
  rationale: 指资财、产业或财富；译作“财产”既保留物质含义，又避免与前面的 עֹשֶׁר 完全重复。
- source_word: עָתֵק
  choice: 恒久的
  rationale: 此处修饰 הוֹן，较可能表示长存、耐久，也可能含丰厚、可观之意；正文采用最符合上下文的“恒久的”，并以脚注保留另一层可能。
- source_word: צְדָקָה
  choice: 公义
  rationale: 可涵盖正直、公正与合宜秩序；“公义”保留其广泛的道德意义，不把它限缩为司法语境中的“正义”。
theological_decisions:
- issue: צְדָקָה 在非特定司法语境中的译法
  choice: 公义
  alternative: 正义
  rationale: 本节陈述智慧所具有的益处，语境是广泛的道德秩序，而非明确的法庭或社会司法场景，因此正文译为“公义”；脚注保留“正义”，避免消除原词兼具道德正直与公平正义的张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留希伯来诗句中“财富／财产”的近义并列，同时用分号和补出的“也在我这里”呈现两组并列成分。所有脚注标记均置于正文相应词语之后。
