base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/012.yaml
  text: I[a], wisdom, dwell with prudence, and I find knowledge and discretion.
translation:
  language: zh_hans
  text: 我，智慧，与审慎同住[a]；我寻得关于筹谋的知识[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “同住”也可译作“已经与……同住”。希伯来语动词采用完成式，可强调既成状态；在这里也可以表达持续的现状。
    reason: 时态与体貌的另一种译法
  - marker: b
    text: 希伯来语直译为“筹谋的知识”或“关于筹谋的知识”；这两个词在原文中构成紧密关系，并非两个由连词连接的独立宾语。“筹谋”也可按语境译作“计划”“计策”或“明辨力”。
    reason: 句法及词义的多重可能
lexical_decisions:
- source_word: חָכְמָה
  choice: 智慧
  rationale: 该名词通常意为“智慧”。以第一人称自称“智慧”，保留本章的拟人表达，但不把它处理成专名，也不加入本节没有明说的身份认定。
- source_word: שָׁכַנְתִּי
  choice: 同住
  rationale: שׁכן表示居住、栖居；“与……同住”既保留空间意象，也自然表达智慧与审慎密切相伴。希伯来语完成式在这里可按持续现状理解，时态上的另一可能见脚注。
- source_word: עָרְמָה
  choice: 审慎
  rationale: 该词可指精明、机敏，也可在负面语境中指狡猾；本节处于正面的智慧语境，“审慎”能传达谨慎而有实际判断力的含义，避免误解为欺诈。
- source_word: דַעַת
  choice: 知识
  rationale: 采用该名词的常规译法，并使它与“智慧”保持词义区别。
- source_word: מְזִמּוֹת
  choice: 谋略
  rationale: 该复数名词可指谋划、计策、筹算或明辨力。“谋略”既保留计划与筹谋的色彩，也能在正面语境中表示周详的判断；其与“知识”的句法关系及其他译法见脚注。
- source_word: אֶמְצָא
  choice: 我寻得
  rationale: מצא的基本义是“找到、寻得”。保留这一动词的寻获意象，不将其改释为单纯的“拥有”或“赐予”。
- source_word: וְ
  choice: ；
  rationale: 希伯来语连词连接两个诗句。中文用分号呈现并列推进关系，比逐字加“并且”更自然，意义仍得到保留。
theological_decisions:
- issue: 智慧的拟人化
  choice: 让“智慧”以第一人称说话，但不作进一步的身份认定
  alternative: 将“智慧”明确处理为专名，或直接赋予后来的基督论身份
  rationale: 《箴言》8章以诗歌手法把智慧人格化。本节本身没有明确要求把这一形象等同于某一特定神学位格，因此译文保留拟人及其神学张力，不替经文作超出原文的定论。
- issue: דַעַת מְזִמּוֹת的关系
  choice: 正文采用并列式的“知识和谋略”，并以脚注交代更贴近形式的属格式理解
  alternative: 译作“关于各种谋划的知识”或“筹谋的知识”
  rationale: 希伯来语没有在两个名词之间另加连词，形式上可以理解为“有关谋划的知识”；但在智慧文学的正面平行结构中，也常被理解为两个紧密相关的美德概念。正文选择自然、清楚的中文，并用脚注保存真实的句法与词义歧义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“我就是智慧”清楚呈现拟人化说话者；“审慎”避免“精明”可能带来的世故或负面色彩。以分号保留希伯来诗句的两分结构，脚注则承载完成式及מְזִמּוֹת相关的真实歧义。
