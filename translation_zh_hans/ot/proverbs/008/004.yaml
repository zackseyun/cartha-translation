  text: אֲלֵי/כֶ֣ם אִישִׁ֣ים אֶקְרָ֑א וְ֝/קוֹלִ֗/י אֶל בְּנֵ֥י אָדָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/004.yaml
  text: To you[a], O men, I call, and my voice is to the sons of mankind.
translation:
  language: zh_hans
  text: '男子啊，我向你们呼唤；

    我的声音传向世人。[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “世人”原文直译为“人的众子”，是泛指人类的常用说法。
    reason: 说明希伯来语的字面形式及其泛指含义，避免读者误以为这里只指男性。
lexical_decisions:
- source_word: אֲלֵיכֶם
  choice: 向你们
  rationale: 介词 אֶל 加第二人称阳性复数词尾，明确指出智慧呼唤的对象；“向你们”自然保留了直接称呼和方向性。
- source_word: אִישִׁים
  choice: 众男子啊
  rationale: 该词是 אִישׁ 的复数，在此采用其明确的阳性表达；“众男子”比“男人们”庄重，也以“啊”体现呼语语气。
- source_word: אֶקְרָא
  choice: 我……呼唤
  rationale: קרא 的 Qal 未完成式第一人称单数在此表示出声招呼、召唤；“呼唤”既自然，也适合人格化智慧公开发言的语境。
- source_word: וְקוֹלִי
  choice: 我的声音
  rationale: 保留 קוֹל 的名词形式及第一人称单数所属词尾，以维持希伯来诗句中“我呼唤／我的声音”的平行关系。
- source_word: אֶל
  choice: 传向
  rationale: 原文后半句没有明示动词，直译成“我的声音向世人”在现代汉语中不完整；补出“传”使句子自然，同时保留 אֶל 的方向含义。
- source_word: בְּנֵי אָדָם
  choice: 世人
  rationale: 字面为“亚当／人的众子”，是希伯来语泛指人类的常见表达。“世人”在现代汉语中简洁、庄重，能表达全体人类，而字面形式收入脚注。
theological_decisions:
- issue: 希伯来诗歌中带阳性形式的人类称谓
  choice: 前半句译作“众男子”，后半句译作泛指全人类的“世人”
  alternative: 两处都用中性的“众人／人们”，或把 בְּנֵי אָדָם 直译为“人的众子”
  rationale: אִישִׁים 本身是明确的阳性复数，故正文保留“男子”；בְּנֵי אָדָם 虽在形式上为阳性系谱表达，却常用来泛指人类，因此译为自然的“世人”，并用脚注说明其字面措辞。这样既不抹平两种原文表达，也不把后一句错误限定为男性。
translation_notes:
  register: 采用现代、庄重而适合智慧文学朗读的表达；以分行和分号呈现两分句的诗歌平行。“众男子啊”保留原文前半句的阳性呼语，“世人”则自然表达后半句惯用语所涵盖的全人类。
