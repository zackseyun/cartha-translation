  text: I walk in the way of righteousness[a], in the midst of the paths of justice,
translation:
  language: zh_hans
  text: 我行在正义的道路上，在公正的路径之中。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “正义”也可译作“公义”；“公正”也可译作“公平”或“审判”。希伯来语צְדָקָה与מִשְׁפָּט的含义有所重叠；正文用“正义”和“公正”保留诗句中的用词区别。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּ/אֹרַח
  choice: 在……的道路上
  rationale: אֹרַח指道路、路径，也可比喻行为方式；与介词בְּ合译，保留行走于某一道路之上的智慧文学意象。
- source_word: צְדָקָה
  choice: 正义
  rationale: צְדָקָה可指公义、正义或合宜正直的行为。此处译作“正义”，自然庄重，并与下句“公正”保持相关而不完全相同的诗意对应。
- source_word: אֲהַלֵּך
  choice: 我行
  rationale: הלך在此表达行走或一贯行事；“我行”保留道路隐喻，也符合智慧以第一人称发言的语境。
- source_word: בְּ/תוֹךְ
  choice: 在……中间
  rationale: תּוֹךְ表示内部或中间；直译为“在……中间”，保留空间图像及与上半句的平行结构。
- source_word: נְתִיבוֹת
  choice: 路径
  rationale: נְתִיבוֹת是“路径、轨道”的复数；汉语可用集合意义的“路径”，避免生硬地强调复数，同时与“道路”形成诗意变化。
- source_word: מִשְׁפָּט
  choice: 公正
  rationale: מִשְׁפָּט可指审判、法理、公正。此处采用抽象伦理意义的“公正”，与צְדָקָה相互呼应，并保留两词的语义重叠与差别。
