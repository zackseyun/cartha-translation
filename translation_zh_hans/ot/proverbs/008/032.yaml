  text: וְ/עַתָּ֣ה בָ֭נִים שִׁמְעוּ לִ֑/י וְ֝/אַשְׁרֵ֗י דְּרָכַ֥/י יִשְׁמֹֽרוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/032.yaml
  text: And now[a], sons, listen to me; blessed are those who keep my ways.
translation:
  language: zh_hans
  text: 现在，孩子们[a]，要听我；谨守我道路的人有福了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“儿子们”；这是智慧训诲中对受教者的惯用称呼，其劝勉适用于所有受教的人。
    reason: 说明原文的性别形式及其语用范围。
lexical_decisions:
- source_word: וְעַתָּה
  choice: 现在
  rationale: 这一组合用语标志话语转折，并引出劝勉。现代汉语用“现在”即可自然承接上文；若直译连接词为“而现在”，反而显得生硬。
- source_word: בָנִים
  choice: 孩子们
  rationale: 原文是阳性复数“儿子们”，也是智慧文学中师长对受教者的惯用称呼。正文采用自然且适用于全体受教者的“孩子们”，并以脚注保留原文的性别形式。
- source_word: שִׁמְעוּ לִי
  choice: 要听我
  rationale: שׁמע与ל连用，表示把注意力转向说话者并聆听。“要听我”保留命令语气，也没有直接把其含义收窄或强化为“顺服我”。
- source_word: וְאַשְׁרֵי
  choice: 有福了
  rationale: אַשְׁרֵי宣告人处于蒙福、昌盛的可羡状态。“有福了”既符合汉语圣经语体，也比单纯的“快乐”更充分。
- source_word: דְּרָכַי
  choice: 我的道路
  rationale: דֶּרֶךְ的复数在智慧文学中常指生活方式和行事准则。“我的道路”保留其比喻，同时在现代汉语中清楚自然。
- source_word: יִשְׁמֹרוּ
  choice: 谨守
  rationale: שׁמר兼有看守、持守和遵行之意；“谨守”在此兼顾认真留意与实际遵行，适合智慧训诲的语境。
theological_decisions:
- issue: 智慧训诲中带有性别形式的称呼
  choice: 正文译作“孩子们”，脚注说明原文直译为“儿子们”
  alternative: 正文译作“儿子们”
  rationale: 希伯来语确用阳性复数，但在《箴言》的师徒训诲传统中，这类称呼指向受教群体，其劝诫并非只适用于男性。中文“儿子们”容易被理解为仅指亲生男性子女；采用“孩子们”可自然传达语用范围，同时由脚注保存原文形式与文学背景。
translation_notes:
  register: 采用现代、庄重而易懂的劝诫语体。“要听我”简洁直接；“谨守我的道路”保留智慧文学的道路意象。逗号和分号呈现原文由呼吁转向福语宣告的结构。
