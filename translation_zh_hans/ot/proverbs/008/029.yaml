id: PRO.8.29
reference: Proverbs 8:29
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: בְּ/שׂ֘וּמ֤/וֹ לַ/יָּ֨ם חֻקּ֗/וֹ וּ֭/מַיִם לֹ֣א יַֽעַבְרוּ פִ֑י/ו בְּ֝/חוּק֗/וֹ מ֣וֹסְדֵי אָֽרֶץ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/029.yaml
  text: when he set a boundary for the sea[a], so that the waters would not transgress his command, when he marked out the foundations of the earth[b],
translation:
  language: zh_hans
  text: 那时，他为海设定界限[a]，使众水不得违背他的命令[b]；那时，他划定大地的根基。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “界限”也可译作“定规”；原词既可指颁定的法则，也可指固定的边界。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“他的口”，即他口中所出的命令。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשׂוּמוֹ
  choice: 那时，他……设定
  rationale: 介词 בְּ 加不定式连缀形及第三人称单数阳性后缀，在此表达时间关系；用“那时”自然呈现重复句式。
- source_word: לַיָּם חֻקּוֹ
  choice: 为海设定界限
  rationale: חֹק 可指律例、定规或固定界限；在海与众水的创造语境中，“界限”最贴合具体意象，同时脚注保留“定规”的可能。
- source_word: וּמַיִם לֹא יַעַבְרוּ
  choice: 使众水不得违背
  rationale: עבר 本义为越过、跨过；与“他的口”搭配时兼有越界和违令之意。“不得违背”在中文中能自然连接下文的“命令”。
- source_word: פִּיו
  choice: 他的命令
  rationale: 字面为“他的口”，这里以发令的器官代指口中所出的命令；正文采用自然中文，脚注说明原文意象。
- source_word: בְּחוּקוֹ
  choice: 那时，他划定
  rationale: חקק 可指刻下、制定或划定；与“大地的根基”连用时，“划定”保留创造工程的空间意象。
- source_word: מוֹסְדֵי אָרֶץ
  choice: 大地的根基
  rationale: 直接保留希伯来诗歌中的宇宙创造意象，不将其抽象化。
theological_decisions:
- issue: 智慧话语中的创造意象
  choice: 将本节译为上帝为海与大地规定秩序的具体创造图景
  alternative: 把这些表达仅仅抽象化为一般秩序，或在正文中加入后来的基督论解释
  rationale: 原文以诗歌方式叙述创造，译文应保留具体意象及其神学张力，不把经文未明说的后期教义读入正文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“那时”重复出现，以对应两个由 בְּ 加不定式构成的时间结构；分号呈现两组创造行动之间的诗意平行。
