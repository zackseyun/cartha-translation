  text: All of them are straightforward to the one who understands[a], and upright to those who find knowledge.
translation:
  language: zh_hans
  text: 这些话，对明白人都是清楚的[a]；对寻得知识的人都是正直的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “清楚的”也可译为“直接的”或“正当的”。希伯来语此词强调正直、直接、不弯曲；这里指智慧的话对有辨识力的人是清楚可辨的。
    reason: lexical_alternative
lexical_decisions:
- source_word: כֻּלָּם
  choice: 这一切……都是
  rationale: 承接上文智慧所说的话（6—8节），表达其全部内容；中文用“这一切”自然保留总括意义。
- source_word: נְכֹחִים
  choice: 直白的
  rationale: 该词有直、正、直接、明白之意；用于言语时，“直白”既表现不弯曲、不欺瞒，也符合对明白之人而言清楚直接的语境。
- source_word: לַמֵּבִין
  choice: 对明白的人
  rationale: 保留介词所表达的关系，并将בין的分词译作具有理解、辨明能力的人，不添加性别限定。
- source_word: וִישָׁרִים
  choice: 正直的
  rationale: 保留יָשָׁר所含正、直、端正的意义，与前半句“直白”形成近义平行，同时带出智慧之言正当无邪的意味。
- source_word: לְמֹצְאֵי
  choice: 对找到……的人
  rationale: 保留分词的主动和经验性意义，即实际寻得并获得知识的人。
- source_word: דָעַת
  choice: 知识
  rationale: 按通常词义译为“知识”，并与前句בין所表达的“明白”保持词汇区别。
