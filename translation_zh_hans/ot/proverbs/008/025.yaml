base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/025.yaml
  text: Before the mountains were settled[a], before the hills, I was brought forth.
translation:
  language: zh_hans
  text: 群山尚未被安置稳固，在丘陵之先，我已被生出。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “被生出”也可译作“出生”或“被生育”。希伯来文以出生／起源的意象描写拟人化的智慧。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּטֶרֶם
  choice: 尚未
  rationale: 表示某事发生以前；与后半句“还未”构成自然的汉语诗歌平行。
- source_word: הָרִים
  choice: 群山
  rationale: 准确表达复数，并符合现代汉语诗体和宇宙创造语境。
- source_word: הָטְבָּעוּ
  choice: 被安定
  rationale: 该词为טבע的使役被动形态，在此描写山被牢固安置；“被安定”保留被动和稳固就位之意，又避免将意象过度具体化。
- source_word: לִפְנֵי
  choice: 还未
  rationale: 此处是时间意义，与前句相平行；按汉语习惯补足存在含义。
- source_word: גְבָעוֹת
  choice: 丘陵
  rationale: 与“群山”形成原文的地貌平行，措辞自然庄重。
- source_word: חוֹלָלְתִּי
  choice: 我就被生出了
  rationale: 保留拟人化智慧的出生、起源意象，同时不把词义限定为较具教义色彩的“受生”或纯生物性的“出生”。
theological_decisions:
- issue: 如何表达拟人化智慧的起源而不把后来的基督论结论带入译文
  choice: 我就被生出了
  alternative: 我就出生了；我就受生了；我就被产生了
  rationale: “被生出了”保留原文生产、出生的意象及被动意味，却不预先判定智慧与神之间的形而上关系。“受生”在汉语神学语境中容易带入特定教义术语，“被产生”则削弱了原文鲜明的生产意象。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。两行以“尚未……还未……”保持诗歌平行；“我就被生出了”保留拟人化智慧关于出生与起源的张力。
