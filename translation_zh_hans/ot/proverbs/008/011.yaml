  yaml_path: translation/ot/proverbs/008/011.yaml
  text: For wisdom is better than jewels[a], and all desirable things cannot compare with her.
translation:
  language: zh_hans
  text: 因为智慧胜过珠宝[a]；一切人所渴望的事物都不能与她相比。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “珠宝”或译“珍珠”或“红宝石”；该希伯来词泛指珍贵宝石。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文的劝勉并说明理由；“因为”自然保留原文连接和解释的作用。
- source_word: טוֹבָה חָכְמָה מִפְּנִינִים
  choice: 智慧胜过珠宝
  rationale: 形容词 טוֹבָה 与比较介词 מִן 连用，表达“比……更好、更有价值”；“胜过”在中文中简洁地传达比较义。פְּנִינִים 所指宝石种类不确定，因此用较宽泛的“珠宝”。
- source_word: וְכָל חֲפָצִים
  choice: 一切可羡慕的事物
  rationale: חֲפָצִים 泛指人所喜爱、渴求或看为宝贵的事物；此译保留其广泛含义，不限于财物或享乐。
- source_word: לֹא יִשְׁווּ בָהּ
  choice: 都不能与她相比
  rationale: שׁוה 与介词 ב 连用，表示与某对象相等或相提并论；阴性单数后缀对应本章被拟人化为女性的“智慧”，故译作“她”。
theological_decisions:
- issue: 智慧的女性拟人化
  choice: 保留女性人称“她”
  alternative: 按非人格化方式译作“它”或重复“智慧”
  rationale: בָהּ 是阴性单数形式，且《箴言》第8章持续把智慧描绘为一位女性。保留“她”忠实呈现文学拟人手法，而不额外作基督论或其他教义认定。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“胜过”凝练有力；“可羡慕的事物”兼顾自然表达与原文 חֲפָצִים 的广泛语义。分号呈现上下两句紧密的并列关系。
