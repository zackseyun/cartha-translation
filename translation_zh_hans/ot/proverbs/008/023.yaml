  yaml_path: translation/ot/proverbs/008/023.yaml
  text: From everlasting I was established[a], from the beginning, from before the earth.
translation:
  language: zh_hans
  text: 我从亘古被立定；从起初，在大地之先。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“被设立”“被安置”；这里的希伯来动词含义有争议，也有人理解为“受膏”，但在此处较不可能。
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵעוֹלָם
  choice: 从亘古
  rationale: עוֹלָם可指遥远的古时，也可表达无始的久远；在智慧于创造以前发言的语境中，“从亘古”既保留庄重而广阔的时间范围，也不把词义过度限定为抽象的“永恒”。
- source_word: נִסַּכְתִּי
  choice: 我就被立定
  rationale: 此处נסך的尼法勒形式词义有争议，可理解为被设立、安置或授予位置。“被立定”自然地表达智慧在创造以前已被确立，同时避免采用可能引入弥赛亚联想的“受膏”。
- source_word: מֵרֹאשׁ
  choice: 从起初
  rationale: רֹאשׁ用于时间表达时通常指开端或起初；“从起初”简洁地保留原文与其他时间短语的平行。
- source_word: מִקַּדְמֵי אָרֶץ
  choice: 在大地以先
  rationale: קַדְמֵי在此表达相对于大地的先在，整句处于宇宙创造语境，因此אָֽרֶץ译为“大地”而非“土地”；“在大地以先”保留原文凝练的诗体表达。
theological_decisions:
- issue: 是否把人格化的智慧直接作基督论解释
  choice: 按箴言诗歌的直接语境，译作人格化的智慧在创造以前已被立定，不加入明确的弥赛亚或三一术语。
  alternative: 把נִסַּכְתִּי译为“受膏”，从而更容易引向弥赛亚式理解。
  rationale: 基督教传统可以从预表角度把本段与圣子联系起来，但译文应首先反映希伯来文本的直接文学意义，并保留其神学张力，不加入本节并未明确要求的教义性措辞。
translation_notes:
  register: 采用现代、庄重而易懂的普通话诗体。“从亘古—从起初—在大地以先”保留希伯来原文递进且平行的时间结构；正文中的[a]与脚注对应。
