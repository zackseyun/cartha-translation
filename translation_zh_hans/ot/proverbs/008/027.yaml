  text: בַּ/הֲכִינ֣/וֹ שָׁ֭מַיִם שָׁ֣ם אָ֑נִי בְּ/ח֥וּק/וֹ ח֝֗וּג עַל פְּנֵ֥י תְהֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/027.yaml
  text: When he established the heavens[a], I was there, when he inscribed a circle on the face of the deep.
translation:
  language: zh_hans
  text: 他立定诸天时，我在那里；他在深渊表面划出圆圈[a]时。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “圆圈”也可理解为“圆形边界”或“地平线”；希伯来语可能描绘在原初深水之上划出的圆形界线。
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּהֲכִינוֹ
  choice: 他立定……时
  rationale: ב 加不定词构造及第三人称单数后缀在此表示时间；“立定”兼顾设立、使之稳固的宇宙创造语境。
- source_word: שָׁמַיִם
  choice: 诸天
  rationale: 希伯来语为复数形式；“诸天”保留其宏阔范围和庄重诗体，同时在现代中文中易懂。
- source_word: שָׁם אָ֑נִי
  choice: 我在那里
  rationale: שָׁם 是地点副词“那里”；希伯来语名词句没有明说系词，中文无需补出“曾是”，可自然表达智慧在场。
- source_word: בְּחֻקוֹ
  choice: 他……划定……时
  rationale: ב 加不定词构造再次表示时间；חקק 在此与“圆界”搭配，描绘刻画或划定边界，而非抽象地“颁布”。
- source_word: חוּג
  choice: 圆界
  rationale: 该词可指圆、圆周或环形界线；“圆界”既保留几何意象，也传达其作为水域边界的可能含义，而不直接限定为“地平线”或“穹苍”。
- source_word: עַל־פְּנֵי תְהוֹם
  choice: 在深渊的水面上
  rationale: עַל־פְּנֵי 表示在……表面上；תְהוֹם 指原初深水。“深渊的水面”使现代读者明白这里是水域意象，并避免“无底坑”等后期神学联想。
theological_decisions:
- issue: 智慧在创造时的身份与在场
  choice: 按拟人化智慧的发言直译为“我在那里”，不加入其身份的后期教义解释。
  alternative: 以措辞明确将智慧等同于某一特定神学位格。
  rationale: 本节本身只陈述智慧在创造之时在场；译文应保留其神学开放性。
- issue: 宇宙图景的具体形态
  choice: 译作“圆界”，保留诗性且不确定的圆形边界意象。
  alternative: 明确译为“地平线”“穹顶”或某种固定的古代宇宙模型。
  rationale: חוּג 可唤起圆周、地平线或水上边界等意象，但本节不足以排他地确定其中一种。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“诸天”“深渊”保持智慧诗篇的宏阔诗意；“划定圆界”兼顾具体刻画动作与边界含义。脚注标记置于整节末尾，说明紧邻前句的“圆界”。
