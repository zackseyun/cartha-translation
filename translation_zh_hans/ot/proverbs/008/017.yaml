  text: אֲ֭נִי אהבי/ה אֵהָ֑ב וּ֝/מְשַׁחֲרַ֗/י יִמְצָאֻֽ/נְנִי׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/017.yaml
  text: I love those who love me[a], and those who seek me diligently find me.
translation:
  language: zh_hans
  text: 我爱那些爱我的人；殷勤寻求我的人[a]，必寻见我。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“清早寻求我的人”。希伯来语动词可指清早寻求，也可引申为热切、殷勤地寻求。
    reason: 保留希伯来语动词具体的时间含义及其引申义之间的词义可能性。
lexical_decisions:
- source_word: אֲנִי
  choice: 我
  rationale: 句首独立人称代词具有强调作用；汉语保留“我”，既自然，也显出智慧以第一人称说话。
- source_word: אֹהֲבַי / אהבי/ה
  choice: 那些爱我的人
  rationale: 这是带第一人称单数后缀的分词，作名词使用，直指“爱我的人”。采用关系结构符合现代汉语表达，也避免把它弱化为“我的朋友”。
- source_word: אֵהָב
  choice: 爱
  rationale: 该未完成式在箴言语境中可表达恒常、普遍的事实，因此译作现在时意义的“爱”，不限定为将来。
- source_word: מְשַׁחֲרַי
  choice: 殷勤寻求我的人
  rationale: 该动词可具体指“清早寻求”，并可引申为热切、认真地寻求。正文用“殷勤寻求”传达此处较自然的惯用含义，同时在脚注保留时间意义的可能译法。
- source_word: יִמְצָאֻנְנִי
  choice: 必寻见我
  rationale: 该形式为第三人称复数未完成式并带第一人称单数宾语后缀。箴言式陈述在汉语中用“必”自然表达其稳定、可期待的结果，而“寻见”也与前面的“寻求”形成呼应。
theological_decisions:
- issue: 智慧之爱的相互性
  choice: 将本句译为智慧与爱她、寻求她之人之间的一般性相互关系
  alternative: 将其解释为救恩拣选、圣约偏爱，或在正文中直接作基督论解读
  rationale: 《箴言》第8章中的智慧以诗歌性的拟人手法说话。本节说明智慧喜爱爱她的人，并让殷勤寻求她的人寻见她；译文不加入希伯来文本未明说的后期教义范畴。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“殷勤寻求”保持智慧文学的郑重语气；“必寻见我”简洁有力，并保留箴言式的一般原则。
