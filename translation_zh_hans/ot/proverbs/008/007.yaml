  text: כִּֽי אֱ֭מֶת יֶהְגֶּ֣ה חִכִּ֑/י וְ/תוֹעֲבַ֖ת שְׂפָתַ֣/י רֶֽשַׁע־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/007.yaml
  text: For my mouth will utter truth[a], and wickedness is an abomination to my lips.
translation:
  language: zh_hans
  text: 因为我的口[a]要吐露真理；邪恶是我嘴唇所憎恶的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“我的上腭”；这里“上腭”代指发声的器官。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文智慧发出的呼吁，说明听众应当听从的理由；“因为”自然保留了解释关系。
- source_word: אֱמֶת
  choice: 真理
  rationale: 在言语的语境中，指真实、可信的言语内容；“真理”简洁庄重，并与下半句的“邪恶”形成对照。
- source_word: יֶהְגֶּה
  choice: 要吐露
  rationale: הגה可指低声说、沉思或发声；这里以发声器官为主语，并以“真理”为宾语，重点是说出。“吐露”保留了词语所带的发声意味。
- source_word: חִכִּי
  choice: 我的口
  rationale: 原义为“我的上腭”，在诗歌中转喻发声器官。正文译为“我的口”较自然，并以脚注保留原文形象。
- source_word: וְתוֹעֲבַת
  choice: 是……所憎恶的
  rationale: תּוֹעֵבָה表示可憎、令人厌恶之物。此处用主动关系式表达汉语更自然，同时保留强烈的道德排斥意味。
- source_word: שְׂפָתַי
  choice: 我嘴唇
  rationale: 直译“我的嘴唇”，保留希伯来诗歌中以发声器官指言语的形象。
- source_word: רֶשַׁע
  choice: 邪恶
  rationale: 表示道德上的恶、恶行或不义；“邪恶”适合此处概括性的伦理含义，并与“真理”形成鲜明对比。
theological_decisions: []
