  text: when he made the skies firm above[a], when the springs of the deep grew strong[b],
translation:
  language: zh_hans
  text: 他使上方的高天坚固时[a]，深渊的泉源变得强盛时[b]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “高天”也可译作“天空”“云层”或“诸天”。
    reason: lexical_alternative
  - marker: b
    text: 也可理解为“他使深渊的泉源强盛”；希伯来文既可着重泉源变得强盛，也可按上下文理解为上帝使它们强盛。
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: בְּאַמְּצוֹ
  choice: 他使……坚固时
  rationale: 介词 בְּ 加不定式在这一连串创造叙述中表示时间；אמץ 在使役意义上表达“使坚固、使强固”。
- source_word: שְׁחָקִים
  choice: 高天
  rationale: 该词可指天空、云层或诸天；结合 מִמָּעַל（“在上面”）和创造语境，“高天”既自然，也保留上方穹域的广义意象。
- source_word: מִמָּעַל
  choice: 上面的
  rationale: 直接表达位于上方；与“高天”连用，清楚呈现希伯来文的空间关系。
- source_word: בַּעֲזוֹז
  choice: 变得强盛时
  rationale: 该形式与前一分句平行，引出时间从句；按马所拉经文最自然地以“深渊的泉源”为主语，表达其变得强有力。
- source_word: עִינוֹת
  choice: 泉源
  rationale: 指泉、泉眼或水源；“泉源”在现代中文中清楚而庄重，也适合宇宙水域的图景。
- source_word: תְּהוֹם
  choice: 深渊
  rationale: 指原初的深水或无底深处；“深渊”简洁保留其宇宙性含义。
theological_decisions:
- issue: 第二分句中力量变化的施事者
  choice: 译作“深渊的泉源变得强盛”，让泉源作语法主语
  alternative: “他使深渊的泉源强盛”
  rationale: בַּעֲזוֹז 的形式本身自然支持不及物理解，但上下文持续以创造者为行动者，因此在注释中保留使役性的理解，不把经文的张力消除。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话；保留箴言诗句的平行结构，并以两个“……时”承接上下文的创造叙述。
