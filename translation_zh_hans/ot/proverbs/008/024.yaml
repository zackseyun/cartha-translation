  yaml_path: translation/ot/proverbs/008/024.yaml
  text: When there were no depths[a], I was brought forth, when there were no springs abounding with water.
translation:
  language: zh_hans
  text: 深渊尚未存在时，我被生出[a]；那时也还没有水量丰沛的泉源。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“我出生了”，或“我被形成”。希伯来语动词可唤起生产、出生的意象；“被生出”保留这一比喻，而不作过度限定。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאֵין
  choice: 尚未存在时／那时也还没有
  rationale: בְּ与אֵין在两个平行分句中表示某物不存在的时间背景。这样的译法自然传达“当……还没有时”，又不把它强化为原文未明说的绝对先后命题。
- source_word: תְּהֹמוֹת
  choice: 深渊
  rationale: 该词指深处的大水或深渊。“深渊”简洁自然，符合创造语境，同时不额外引入神话色彩。
- source_word: חוֹלָלְתִּי
  choice: 我就被生出
  rationale: 该动词在这里带有生产、生育的意象，并采用被动表达。“被生出”保留拟人化智慧的出生隐喻，也不把含义限定为纯生理性的“出生”或较抽象的“形成”。
- source_word: מַעְיָנוֹת
  choice: 泉源
  rationale: 该名词表示自然涌出的水源。“泉源”在现代汉语中兼具清晰度与诗体庄重感。
- source_word: נִכְבַּדֵּי מָיִם
  choice: 水量丰沛的
  rationale: 该短语字面带有“因水而沉重”的意象，在语境中形容泉源水量充足。“水量丰沛”既传达充盈、丰厚之意，也避免生硬的“被水压重”。
- source_word: מָיִם
  choice: 水
  rationale: 希伯来语形式虽为复数，现代汉语在此自然使用不可数的“水”。
theological_decisions:
- issue: 箴言8章中智慧起源意象的表达
  choice: 我就被生出
  alternative: 我出生了／我被形成
  rationale: 经文以生产或出生的图像描写人格化的智慧。译文保留这一隐喻及其张力，不据此引入后来的基督论结论，也不把诗歌语言改写成特定教义命题。
translation_notes:
  register: 采用现代、庄重而易懂的诗体表达。分号保留两个平行时间分句的结构；第二分句用“那时也还没有”承接首句动词的共同时间框架，避免在希伯来原文无动词处生硬重复。
