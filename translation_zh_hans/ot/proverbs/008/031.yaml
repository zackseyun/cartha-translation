  yaml_path: translation/ot/proverbs/008/031.yaml
  text: rejoicing in the world of his earth[b][a], and my delight was with the sons of man.
translation:
  language: zh_hans
  text: 在他的大地上、在世间[a]欢欣；我的喜乐在世人中间[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在他大地上有人居住的世界中”。
    reason: lexical_alternative
  - marker: b
    text: “世人”原文直译为“人的众子”，泛指全人类。
    reason: lexical_alternative
lexical_decisions:
- source_word: מְשַׂחֶקֶת
  choice: 欢欣
  rationale: 该阴性分词描写人格化的智慧持续而活泼地喜悦；“欢欣”既保留动态意味，也符合诗歌的庄重语体，不把它缩减为单纯的玩耍。
- source_word: בְּתֵבֵל
  choice: 在……世界中
  rationale: תֵבֵל通常指有秩序、有人居住的世界；正文采用现代汉语自然的“世界”，并在脚注保留“有人居住的世界”这一较具体的词义。
- source_word: אַרְצוֹ
  choice: 他大地的
  rationale: 保留第三人称阳性单数所属后缀“他的”；在创造语境中，אֶרֶץ宜译为“大地”，而非范围较窄的“土地”。与前词连译为“他大地的世界”，保留希伯来语短语的属格关系及其略显浓缩的诗性表达。
- source_word: וְשַׁעֲשֻׁעַי
  choice: 我的喜乐也在
  rationale: 原文是带第一人称单数后缀的名词，形式上为复数，可表达丰富或强烈的欢喜。汉语以抽象单数“我的喜乐”最自然，同时保留名词句式，不改写成纯粹的动词表达。
- source_word: בְּנֵי אָדָם
  choice: 世人
  rationale: 该短语字面为“人的众子”，实际泛指全人类。“世人”在现代汉语中自然、简洁且涵盖所有人；脚注说明其字面形式，以保存原文意象。
theological_decisions:
- issue: 如何表达人格化智慧在创造中的欢欣，而不把后来的基督论认同直接写入译文
  choice: 维持人格化智慧的阴性第一人称诗歌声音，描述她在受造世界和世人中间的喜乐
  alternative: 将智慧直接译解为道成肉身以前的圣子
  rationale: 本节希伯来诗歌以人格化的智慧说话。基督教传统可以作预表性或正典性的基督论阅读，但正文不应藉措辞预先裁定这种后来的神学认同。
translation_notes:
  register: 采用现代、庄重而可理解的诗歌语言。“在他大地的世界中”有意保留原文 בְּתֵבֵל אַרְצוֹ 的紧凑属格结构；“世人中间”则以自然汉语表达智慧以人类为喜乐所在。所有脚注标记均已置于正文相应词组之后。
