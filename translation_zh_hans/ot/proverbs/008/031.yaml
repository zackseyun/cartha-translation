- from: 在他大地的世界中欢欣[a]，我的喜乐也在世人中间[b]。
  to: 在他的大地上、在世间[a]欢欣；我的喜乐在世人中间[b]。
  rationale: 修订仅处理汉语表达和脚注锚点：以“大地上、在世间”的诗歌性并列表达希伯来语紧凑的 תֵבֵל אַרְצוֹ，保留其宇宙性及第三人称所属关系；其余核心词汇、第一人称声音和人类泛指均维持不变。分号更清楚地标示本节两行诗句的平行。
