  text: בִּ֭/י שָׂרִ֣ים יָשֹׂ֑רוּ וּ֝/נְדִיבִ֗ים כָּל שֹׁ֥פְטֵי צֶֽדֶק־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/016.yaml
  text: By me rulers rule[a], and nobles, all judges of righteousness.
translation:
  language: zh_hans
  text: 藉着我，首领掌权；贵族，即所有秉公审判的官长，也掌权[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “秉公审判的官长”也可译作“公义的审判官”或“施行公正审判的官长”。希伯来词“公义”既可指道德上的正直，也可指司法上的公正。
    reason: 保留 שֹׁפְטֵי צֶדֶק 的构词表达及 צֶדֶק 在伦理和司法语境中的词义幅度。
lexical_decisions:
- source_word: בִּי
  choice: 藉着我
  rationale: 介词 בְּ 加第一人称单数词尾在此表示凭借或媒介；“藉着我”自然地表达智慧是施政所凭借的途径，同时不扩展为对一切政权合法性的断言。
- source_word: שָׂרִים
  choice: 首领
  rationale: 该词指有统治或行政权力的高官、领袖或王公；“首领”不局限于王室成员，又能与后面的“贵族”有所区别。
- source_word: יָשֹׂרוּ
  choice: 掌权
  rationale: 该动词意为统治、行使权柄；“掌权”简洁凝练，符合箴言体，也与“首领”搭配自然。
- source_word: וּנְדִיבִים
  choice: 贵族
  rationale: 该名词在此指身份显贵、居领导地位的人；“贵族”保留其社会政治含义，并与“首领”区分。
- source_word: כָּל
  choice: 所有
  rationale: 明确保留希伯来文的全称量词，使末句涵盖一切按公义施行审判的人。
- source_word: שֹׁפְטֵי צֶדֶק
  choice: 按公义审判的人
  rationale: 用动词性结构自然表达希伯来文的构词关系，同时保留 צֶדֶק 所具有的伦理正直与司法公正两方面含义。
- source_word: צֶדֶק
  choice: 公义
  rationale: “公义”保留该词较宽的道德内涵；鉴于语境涉及审判，它也可偏重司法上的“公正”，故以脚注说明。
theological_decisions:
- issue: 智慧在政治权柄施行中的作用
  choice: 表明首领、贵族和审判者藉着智慧正确地行使权柄。
  alternative: 理解为智慧直接认可所有现实中的统治者及其统治。
  rationale: 希伯来文强调智慧是治理所凭借的媒介；译文保留这一主张，但不加入本节没有明说的、关于一切政权都获认可的更广泛教义。
- issue: “贵族”与“所有按公义审判的人”的句法关系
  choice: 以并列方式呈现，并补出希伯来诗句中省略的谓语“也执掌权柄”。
  alternative: 把“所有按公义审判的人”严格视为“贵族”的同位说明。
  rationale: 原文的简略并列结构容许同位或列举理解；中文若完全照搬会显得残缺，因此采用自然的并列读法，但不把两类人作过度区分。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“藉着我”保留智慧作为施政媒介的含义；分号呈现诗句的平行结构，后半句补出省略谓语，使中文完整流畅。
