  text: בִּ֭/י מְלָכִ֣ים יִמְלֹ֑כוּ וְ֝/רוֹזְנִ֗ים יְחֹ֣קְקוּ צֶֽדֶק׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/015.yaml
  text: By me kings reign[b][a], and rulers decree justice.
translation:
  language: zh_hans
  text: 君王借着我掌权[a]，执政者制定公正的法令[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “借着我”也可译作“靠我”。
    reason: lexical_alternative
  - marker: b
    text: “执政者”也可译作“统治者”；本句也可译作“执政者颁布公正的法令”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּי
  choice: 靠我／借我
  rationale: 介词 בְּ 加第一人称单数后缀在这里表示凭借或媒介。前句译作“靠我”，后句按希伯来诗歌中共享成分的特点补出“借我”，使现代汉语清楚自然。
- source_word: מְלָכִים
  choice: 君王
  rationale: 准确表达实行王权的统治者，也保持庄重而通俗的文体。
- source_word: יִמְלֹכוּ
  choice: 掌权
  rationale: 该词表示作王、施行王权；与“君王”搭配时，“掌权”比重复说“作王”更自然，并保留实际治理的含义。
- source_word: וְרֹזְנִים
  choice: 权贵
  rationale: רֹזְנִים 指地位显要、参与治理的高官或尊贵者。“权贵”保留其身份和权力色彩；“统治者”“首领”也可能。
- source_word: יְחֹקְקוּ
  choice: 制定……法令
  rationale: חקק 在治理语境中指颁定、制定具有约束力的规章。“制定法令”既体现权威性，又不把古代语境过度现代化为特定立法程序。
- source_word: צֶדֶק
  choice: 公正的法令
  rationale: צֶדֶק 可指公正、正义或正直。与“制定”相连时，汉语以“制定公正的法令”自然地表达制定合乎公正之事，同时保留司法和道德意味。
theological_decisions:
- issue: 智慧在政治权柄和公正治理中的作用
  choice: 经文陈明君王靠智慧掌权，权贵也借智慧制定公正法令；不进一步断言所有现实中的统治者都自动具有道德正当性。
  alternative: 译成一切政治权柄都由智慧直接赋予并因此获得正当性，或译成所有统治者实际制定的法令都必然公正。
  rationale: 本节处于人格化智慧的自述中，重点是智慧对正确治理不可或缺。译文保留这种积极主张，也不消除现实权力与公正治理之间的张力。
translation_notes:
  register: 采用现代、庄重且易懂的书面普通话。主句保持希伯来诗歌的平行结构；第二分句补出源文中承前省略的“借我”，避免汉语误解。脚注标记均置于相关正文之后。
