id: PRO.8.5
reference: Proverbs 8:5
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: הָבִ֣ינוּ פְתָאיִ֣ם עָרְמָ֑ה וּ֝/כְסִילִ֗ים הָבִ֥ינוּ לֵֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/005.yaml
  text: Learn prudence[a], you simple ones; and learn understanding, you fools.
translation:
  language: zh_hans
  text: 愚蒙人哪，要懂得审慎；愚昧人哪，要有明辨的心[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“心”；这里的“心”指人内在的理解力和判断力。
    reason: 说明希伯来文“心”在本节中的认知与判断含义。
lexical_decisions:
- source_word: הָבִינוּ
  choice: 要懂得／要有明辨
  rationale: 该词是复数命令式，基本义为“明白、辨别”。前半句译作“要懂得”，自然地带出所要领会的品质；后半句结合“心”译作“要有明辨”，表达成为有辨别力之人的呼吁。
- source_word: פְתָאיִם
  choice: 愚蒙人
  rationale: 《箴言》中指缺乏经验、容易受骗、尚未受智慧教导的人，并非指智力有缺陷者；“愚蒙人”也保留了智慧文学中的固定人物类别。
- source_word: עָרְמָה
  choice: 审慎
  rationale: 此词可表示精明、机敏，某些语境也可含诡诈意味；本节智慧劝诫的语境显然取正面意义，“审慎”体现明智而周全的判断。
- source_word: וּכְסִילִים
  choice: 愚昧人
  rationale: 这是《箴言》中常见的智慧术语，通常指拒绝智慧、判断乖谬的人；“愚昧人”保留其道德与智慧层面的分量。
- source_word: לֵב
  choice: 心
  rationale: 直译为“心”，在希伯来思想中也指思想、理解和判断的内在官能。正文保留具体意象，并以“明辨的”说明本处功能。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的智慧文学语体；以“哪”呈现直接呼告，以分号保留两个平行劝诫。正文保留“心”的希伯来意象，同时用“明辨”避免现代读者只按情感意义理解。
