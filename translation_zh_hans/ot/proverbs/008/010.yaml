  text: Take my instruction instead of silver[b][a], and knowledge rather than choice gold.
translation:
  language: zh_hans
  text: 要领受我的训诲，不要银子[a]；要知识，胜过要上好的金子[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“要接受我的管教，而不要银子。”这里的希伯来语采用否定对照，意思是应当选择智慧的训诲，而不是财富。
    reason: lexical_alternative
  - marker: b
    text: “上好的金子”也可译作“精选的金子”或“精金”。
    reason: lexical_alternative
lexical_decisions:
- source_word: קְחוּ
  choice: 你们要领受
  rationale: 这是复数命令式。译作“你们要领受”既保留劝令语气，也适合智慧以教师身份发出的邀请。
- source_word: מוּסָרִי
  choice: 我的训诲
  rationale: מוּסָר兼有教导、管教和纠正的意味；本节与“知识”平行，“训诲”自然庄重，并能保留塑造品格的内涵。
- source_word: וְאַל כָּסֶף
  choice: 不要银子
  rationale: 按希伯来语形式直译为否定性的对照，不把其诗意张力完全改写为单纯的比较；上下文表达应当选择智慧的训诲而非财富。
- source_word: דַעַת
  choice: 知识
  rationale: 这是智慧文学中דַּעַת的常用对应词，与“训诲”构成自然的平行。
- source_word: מֵחָרוּץ נִבְחָר
  choice: 胜过上好的金子
  rationale: מִן表达比较；חָרוּץ在此指贵重的金子，נִבְחָר意为蒙拣选、精选的。合译为“上好的金子”符合现代汉语，也传达其品质优良、价值昂贵。
theological_decisions: []
