  yaml_path: translation/ot/proverbs/008/002.yaml
  text: On the heights beside the road[a], at the crossroads she takes her stand.
translation:
  language: zh_hans
  text: 她站在路旁的高处，在路径交汇之处[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“路径之家”，指路径汇合的地方。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּ/רֹאשׁ מְרוֹמִים
  choice: 在路旁的高处
  rationale: רֹאשׁ有“顶部、最高处”之义，与מְרוֹמִים合用，描绘显眼的高处；汉语将地点短语自然整合为“在路旁的高处”。
- source_word: עֲלֵי דָרֶךְ
  choice: 路旁
  rationale: 该短语表示相对于道路的位置；“路旁”自然简洁，也保留智慧公开可见、可听的位置意象。
- source_word: בֵּית נְתִיבוֹת
  choice: 路径交汇之处
  rationale: 字面为“路径之家”，语境中指多条路径汇合的地点；“路径交汇之处”既清楚，又较“十字路口”更能保留不限定道路数量和形态的原文意象。
- source_word: נִצָּבָה
  choice: 她站
  rationale: 阴性单数形式与上下文中拟人化的智慧一致；“站”准确自然。原词也可含有站定、立于某处的意味，但本节无须在中文中强化为对抗性的“挺立”。
theological_decisions:
- issue: 智慧的阴性拟人化
  choice: 使用“她”
  alternative: 重复“智慧”，或采用不体现性别的表达
  rationale: 希伯来语动词为阴性单数，与上下文拟人化的“智慧”相应；保留“她”忠实呈现文学形式，但不由此引申额外的神学身份判断。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“路径交汇之处”保留诗歌意象并解释希伯来语习语；语序以“她站”起句，使本节作为上下文中“智慧”的连续描写自然流畅。
