  text: לְ/יַד שְׁעָרִ֥ים לְ/פִי קָ֑רֶת מְב֖וֹא פְתָחִ֣ים תָּרֹֽנָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/003.yaml
  text: Beside the gates[a], at the mouth of the city, at the entrance of the doorways[b], she cries out.
translation:
  language: zh_hans
  text: 在城门旁，在城口，在各个门户的入口处，她高声呼喊。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְיַד
  choice: 在……旁
  rationale: 该介词短语惯常表示“在旁边”，既准确传达位置，也符合现代汉语表达。
- source_word: שְׁעָרִים
  choice: 城门
  rationale: 语境指城市的门，是公众聚集和议事之处；译作“城门”比单称“门”更明确。
- source_word: לְפִי
  choice: 在……口
  rationale: 原文直译为“在……的口”；保留“口”的空间意象，并与后面的入口用语形成呼应。
- source_word: קָרֶת
  choice: 城
  rationale: 该词可指城镇或城市；此处与城门相连，译作“城”自然简洁。
- source_word: מְבוֹא
  choice: 入口处
  rationale: 表示进入之地或入口；“入口处”清楚保留其方位意义。
- source_word: פְתָחִים
  choice: 各门洞
  rationale: 复数名词表示开口、门口或门洞；“各门洞”保留复数及具体空间形象，也避免与“入口处”完全重复。
- source_word: תָּרֹנָּה
  choice: 她高声呼喊
  rationale: 阴性单数形式承接上下文人格化的智慧，表达公开而响亮的宣告；“高声呼喊”不额外指定悲伤或惊恐等情绪。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的汉语。三组方位短语依照希伯来文次序排列，保留“城口”这一较具原文色彩但仍可理解的意象；末句明确呈现阴性主语“她”，与上下文人格化的智慧相呼应。
