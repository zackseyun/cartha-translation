id: PRO.8.1
reference: Proverbs 8:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: הֲ/לֹֽא חָכְמָ֥ה תִקְרָ֑א וּ֝/תְבוּנָ֗ה תִּתֵּ֥ן קוֹלָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/001.yaml
  text: Does not wisdom call[b][a], and understanding raise her voice?
translation:
  language: zh_hans
  text: 智慧岂不呼唤[a]？聪明岂不扬声[b]？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “呼唤”或译“高声呼喊”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译“发出她的声音”，是指扬声说话或公开发声的惯用表达。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: 岂不
  rationale: 该结构引出预期肯定回答的反问；“岂不”既保留疑问形式，也符合简洁庄重的汉语表达。
- source_word: חָכְמָה
  choice: 智慧
  rationale: 这是该名词最直接、通行的对应词；本节以人的行动描写智慧，从而保留其拟人化形象。
- source_word: תִקְרָא
  choice: 呼唤
  rationale: קרא在此可指呼叫或高声呼喊。“呼唤”自然地传达向人发出召唤的动作，同时不把音量含义说得过满。
- source_word: וּתְבוּנָה
  choice: 聪明
  rationale: תבונה表示理解力、明辨力或洞察力；“聪明”是《箴言》语境中自然且易懂的对应词，并与“智慧”形成平行。
- source_word: תִּתֵּן קוֹלָהּ
  choice: 扬声
  rationale: 原文直译为“发出她的声音”，是公开发声的惯用表达。“扬声”简洁自然，并保留鲜明的拟人化动作。
theological_decisions:
- issue: 智慧与聪明的拟人化
  choice: 保留“智慧”“聪明”作为抽象名词，同时用“呼唤”“扬声”等人的行动呈现拟人化。
  alternative: 将其明确称为一位女性，或使用专名化、神格化的表达。
  rationale: 希伯来语的阴性语法和上下文共同塑造了女性拟人形象，但现代汉语名词与动词不标示语法性别。本译文保留拟人意象，却不加入本节未明确作出的更深神学认定。
translation_notes:
  register: 采用现代、简洁而庄重的反问句式。“岂不”保留原文预期肯定回答的语气；两句平行排列，使经文适合朗读。中文无法仅靠代词标出阴性，因此通过人的言语行动保留拟人化。
