base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/022.yaml
  text: Yahweh possessed me at the beginning of his way[a], before his works of old.
translation:
  language: zh_hans
  text: 雅威在他道路的开端就拥有我[a]，在他亘古的作为以先。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“雅威造了我”，或“雅威得着了我”。这个希伯来动词可以有不止一种含义；本节在历史上一直是有关人格化的智慧及其与圣子之关系的争论焦点。
    reason: 保留原文动词的其他可能含义，并说明这些译法所涉及的历史神学争议。
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 采用神圣四字名的现代汉语音译，保留其作为以色列之神专名的性质，而不以“耶和华”或“主”替代。
- source_word: קָנָנִי
  choice: 拥有我
  rationale: קנה可表示取得、拥有，也可在某些语境中表示创造。“拥有我”在正文中保留较宽的词义空间，不因后来的基督论争议而预先锁定“创造”的含义；其他重要译法列入脚注。
- source_word: רֵאשִׁית דַּרְכּוֹ
  choice: 在他道路的起初
  rationale: 较贴近原文结构，表达雅威行动或历程的开端，同时不把“道路”过度解释为某一种特定作为。
- source_word: קֶדֶם מִפְעָלָיו מֵאָז
  choice: 在他亘古的作为以先
  rationale: “以先”表达时间上的先于；“亘古的作为”传达מֵאָז所指的远古时间，并保留מִפְעָלָיו“他的作为”的概括性。
theological_decisions:
- issue: 在历来涉及基督论争议的经文中如何翻译קָנָנִי
  choice: 正文译作“拥有我”
  alternative: “造了我”或“得着了我”
  rationale: 本段直接描写的是人格化的智慧，并未直接称其为圣子。正文采用词义上成立而较不预断争议的“拥有我”，脚注则明确保留“造了我”和“得着了我”，使希伯来词本身的多义性及经文的神学张力保持可见。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“道路的起初”有意保留原文意象；“亘古的作为以先”略带诗体色彩，与箴言的智慧诗歌语域相称。
