  text: ט֣וֹב פִּ֭רְיִ/י מֵ/חָר֣וּץ וּ/מִ/פָּ֑ז וּ֝/תְבוּאָתִ֗/י מִ/כֶּ֥סֶף נִבְחָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/019.yaml
  text: My fruit is better than gold[a], even fine gold, and my yield than choice silver.
translation:
  language: zh_hans
  text: 我的果实胜过金子，胜过精金；我的出产胜过上好的银子。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: טוֹב ... מִן
  choice: 胜过
  rationale: 形容词 טוֹב 与比较介词 מִן 连用，表达比较意义；“胜过”自然、凝练，也保留价值上的优越含义。
- source_word: פִּרְיִי
  choice: 我的果实
  rationale: פְּרִי 可指果实或出产；“果实”保留智慧之所得的农业隐喻，并与下半句形成平行。
- source_word: מֵחָרוּץ
  choice: 胜过金子
  rationale: חָרוּץ 在智慧文学中指金子。译作普通的“金子”，可与随后表示更高成色的 פָּז 构成递进。
- source_word: וּמִפָּז
  choice: 胜过精金
  rationale: פָּז 指优质、纯净的黄金；“精金”是现代中文圣经语体中仍可理解的凝练表达，并保留贵金属等级的递进。
- source_word: וּתְבוּאָתִי
  choice: 我的出产
  rationale: תְּבוּאָה 可指农产、收成或所得；“出产”既承接“果实”的意象，也可涵盖智慧带来的成果。
- source_word: מִכֶּסֶף נִבְחָר
  choice: 胜过上好的银子
  rationale: נִבְחָר 本义为被拣选的、精选的；“上好的银子”以自然现代汉语表达其优质、精选之义。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。保留“果实—出产”的农业隐喻和“金子—精金”的递进关系；分号呈现希伯来诗歌的平行结构。原文语义在此足够清楚，无须脚注。
