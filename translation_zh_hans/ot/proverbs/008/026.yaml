  text: before he had made the earth and the fields[b][a], or the first of the dust of the world.
translation:
  language: zh_hans
  text: 那时，他还没有造大地和田野[a]，也没有造世界最初的尘土[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“开阔之地”。这个词在城市语境中也可指“街道”，但这里谈到创造，因此更可能指田野或开阔地带。
    reason: lexical_alternative
  - marker: b
    text: 或译“世界尘土的起头”。希伯来语原文简练而不寻常，可能是指构成世界的最早土壤或尘土。
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד לֹא
  choice: 那时……还没有
  rationale: 该结构与完成式动词连用，在此表达时间上的先于；用“那时……还没有”承接上文智慧已被生出的叙述，也符合现代汉语习惯。
- source_word: עָשָׂה
  choice: 造
  rationale: 该动词通常意为“做、制造”；在创造语境中，“造”简洁自然。
- source_word: אֶרֶץ
  choice: 大地
  rationale: 本节与“世界”平行，指受造的大地整体，不宜局限为某一片土地。
- source_word: חוּצוֹת
  choice: 旷野
  rationale: 该词可指外面的地方、街道或开阔地；创造语境排除城市街道，“旷野”自然表达未建造的开阔之地，同时以脚注保留其他可能。
- source_word: רֹאשׁ
  choice: 最初
  rationale: 此处与“尘土”构成紧凑短语，可能表示最早出现或起初的尘土；“最初”保留其原初性。
- source_word: עָפְרוֹת
  choice: 尘土
  rationale: 该复数形式在此很可能具有集合意义；“尘土”既自然，也符合创造意象。
- source_word: תֵּבֵל
  choice: 世上
  rationale: 该词指有秩序的世界或人居世界；在“世上最初的尘土”中用方位表达，符合汉语搭配。
- source_word: וְ
  choice: 也
  rationale: 马所拉文本为连接词“和”；汉语以“也没有”连接并列受造对象最自然，不将其改释为选择关系。
