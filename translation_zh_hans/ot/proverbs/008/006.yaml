  text: שִׁ֭מְעוּ כִּֽי נְגִידִ֣ים אֲדַבֵּ֑ר וּ/מִפְתַּ֥ח שְׂ֝פָתַ֗/י מֵישָׁרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/006.yaml
  text: Listen[a], for I will speak noble things[b], and the opening of my lips will be upright things.
translation:
  language: zh_hans
  text: 你们要听，因为我要讲高尚的话；我开口所说的，都是正直的话。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שִׁמְעוּ
  choice: 你们要听
  rationale: 这是复数命令式，呼吁听众留心聆听；“你们要听”既明确复数对象，也符合现代汉语表达。
- source_word: כִּי
  choice: 因为
  rationale: 此处引出听从命令的理由：听众应当听，因为智慧即将发言。
- source_word: נְגִידִים
  choice: 高尚的话
  rationale: 该词本可指领袖或尊贵者，此处在诗歌语境中指具有尊贵、高尚价值的言语；译作“高尚的话”保留其尊贵意涵，又避免误解为人物。
- source_word: אֲדַבֵּר
  choice: 我要讲
  rationale: 第一人称单数未完成式在此表示紧接着将要进行的发言；“我要讲”自然简洁。
- source_word: וּמִפְתַּח שְׂפָתַי
  choice: 我一开口
  rationale: 原文直译为“我嘴唇的开启”。汉语用“我一开口”自然地保留开唇发言的意象，并衔接后面的内容。
- source_word: מֵישָׁרִים
  choice: 正直的事
  rationale: 该词表示正直、端正，也可指合乎道德的是非标准；“正直的事”保留名词性和道德含义，并与上句“高尚的话”形成平行。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“我一开口，所说的……”略作汉语句法展开，以自然呈现原文“嘴唇的开启”这一诗歌意象；上下两句仍保持“高尚的话／正直的事”的平行。
