  text: Like silver dross overlaid on earthenware are fervent lips with an evil heart[a].
translation:
  language: zh_hans
  text: 火热的嘴唇[a]和邪恶的心，就像覆盖在陶器上的银渣。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“燃烧的嘴唇”；希伯来语分词的字面意象是发热或燃烧，在这里形容听起来十分热烈或热切的言语。
    reason: lexical_alternative
lexical_decisions:
- source_word: כֶּסֶף סִיגִים
  choice: 银渣
  rationale: 该短语所指不是纯银，而是炼银产生的杂质或废渣；“银渣”保留了外表似银、实则低劣无用的反差。
- source_word: מְצֻפֶּה
  choice: 包覆
  rationale: 该被动分词表示表面被覆盖或镀上；“包覆”自然地呈现薄层覆盖的形象，不暗示器物本身是银制的。
- source_word: עַל חָרֶשׂ
  choice: 在陶器上
  rationale: חָרֶשׂ 指陶土制品或陶器；此译保留廉价陶器与表面银色涂层之间的对比。
- source_word: שְׂפָתַיִם
  choice: 嘴唇
  rationale: 直译为“嘴唇”，在汉语中仍可转指言语，并保留原文具体的身体意象。
- source_word: דֹּלְקִים
  choice: 火热的
  rationale: 该分词本义涉及燃烧、发热；“火热”保留热度意象，可形容听来热烈、热切的言语，又不擅自限定为谄媚。
- source_word: וְלֶב רָע
  choice: 伴着邪恶的心
  rationale: 连接词把外在言语与内在品性并置；“伴着”自然表达二者同时存在，“邪恶”则保留 רָע 明确的道德分量。
theological_decisions: []
translation_notes:
  register: 采用现代、凝练而庄重的箴言体。保留“嘴唇”“心”“银渣”“陶器”等原文意象，以“伴着”表达外在热烈言辞与内在邪恶并存，避免加入“谄媚”等原文未明说的具体动机。
