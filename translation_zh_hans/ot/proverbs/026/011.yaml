  text: Like a dog returning to its vomit[a], so a fool repeats his folly.
translation:
  language: zh_hans
  text: '狗回到自己吐出的东西那里；

    愚昧人也重复自己的愚妄。[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 较为直译可作：“狗回到自己的呕吐物那里；愚昧人重复自己的愚妄。”原文两处都使用分词，生动描绘反复出现、具有惯常性的行为。
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּכֶלֶב
  choice: 狗怎样
  rationale: 前缀 כְּ 表示比较；与下半句“也怎样”配合，构成自然、清楚的汉语比拟句式。
- source_word: שָׁב
  choice: 回头吃
  rationale: שׁוּב 的分词表示回返的典型或反复动作。原文直译为“回到”，但汉语对“呕吐物”说“回头吃”更自然，也明确呈现这一意象所指的动作。
- source_word: עַל קֵאוֹ
  choice: 自己吐的东西
  rationale: קֵא 指呕吐物，词尾为第三人称阳性单数，回指狗；将介词结构按现代汉语习惯表达为“吃自己吐的东西”，准确而通顺。
- source_word: כְּסִיל
  choice: 愚昧人
  rationale: 在《箴言》中，该词常指在道德和认知上顽梗、拒绝智慧的人；“愚昧人”比单纯表示智力不足的说法更贴合其含义。
- source_word: שׁוֹנֶה
  choice: 重犯
  rationale: 该分词在此表示重复、再次去做。结合“愚妄”，译为“重犯”能自然表达再次陷入同样错误，并保留习惯性动作的意味。
- source_word: בְאִוַּלְתּוֹ
  choice: 自己的愚妄
  rationale: אִוֶּלֶת 指愚妄，词尾表示“他的”；介词 בְּ 与 שׁנה 连用可表达重复某事。现代汉语用“重犯自己的愚妄”顺畅地传达此义。
