base_translation:
  language: en
  yaml_path: translation/ot/proverbs/026/026.yaml
  text: Though hatred is covered with deceit[b][a], his evil will be exposed in the assembly.
translation:
  language: zh_hans
  text: 仇恨虽被诡诈遮掩[a]，他的邪恶终必在会众中显露[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “被诡诈遮掩”或译“以欺骗掩盖”。
    reason: lexical_alternative
  - marker: b
    text: “会众”指聚集起来的群体或大会；或译“在集会中”。
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּכַּסֶּה
  choice: 掩盖
  rationale: 该词是כסה的尼法勒未完成式，阴性单数，与“仇恨”呼应，表达被动或反身意义；汉语“掩盖”在“用诡诈掩盖”的结构中自然地传达仇恨受到遮掩。
- source_word: שִׂנְאָה
  choice: 仇恨
  rationale: 该名词指仇恨或敌意；“仇恨”既准确又符合现代汉语箴言体。
- source_word: בְּמַשָּׁאוֹן
  choice: 用诡诈
  rationale: מַשָּׁאוֹן在此指欺骗、诡诈，前缀ב表示手段；“用诡诈”清楚表达借欺骗来遮掩仇恨，同时保留其道德意味。
- source_word: תִּגָּלֶה
  choice: 终必显露
  rationale: 该词是גלה的尼法勒未完成式，表示被揭露或显露；“终必”体现箴言所陈述的预期结果，并与前半句形成鲜明转折。
- source_word: רָעָתוֹ
  choice: 他的恶行
  rationale: רָעָה可指邪恶、恶意或有害行为；“恶行”在本句中自然，并能指向最终在群体中被揭露的邪恶表现，但比单纯“恶”略具体。
- source_word: בְקָהָל
  choice: 在会众中
  rationale: קָהָל指聚集起来的群体或大会；“会众”保留具体的共同体场景，不将其泛化为仅仅“公开地”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而简洁的箴言体。“虽……终必……”清楚呈现希伯来文两分句的对照。脚注紧随各自所说明的词语，避免英文咨询层脚注标记次序混乱的问题。
