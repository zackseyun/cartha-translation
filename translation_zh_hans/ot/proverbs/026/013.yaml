  yaml_path: translation/ot/proverbs/026/013.yaml
  text: The sluggard says[a], “There is a lion in the road! A lion in the public squares!”
translation:
  language: zh_hans
  text: 懒惰人说：“路上有狮子！广场上有狮子！”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עָצֵל
  choice: 懒惰人
  rationale: 该名词在《箴言》中指惯常懒惰的一类人。“懒惰人”自然、凝练，也保留智慧文学对典型人物的刻画。
- source_word: אָמַר
  choice: 说
  rationale: 原文虽为完成式，但在格言语境中表达这类人物惯常的言行；现代汉语用“说”即可自然传达普遍、典型的意味。
- source_word: שַׁחַל
  choice: 狮子
  rationale: 该词指狮子，有时含强猛之意；此处无需额外限定，并与下半句的 אֲרִי 形成重复。
- source_word: בַּדָּרֶךְ
  choice: 路上
  rationale: 表示狮子位于人行走的道路上。“路上”是现代汉语最自然、具体的地点表达。
- source_word: אֲרִי
  choice: 狮子
  rationale: 这是希伯来语中常见的“狮子”一词。与前半句同译，可保留同义平行和懒惰人夸张重复借口的修辞效果。
- source_word: בֵּין הָרְחֹבוֹת
  choice: 广场上
  rationale: רְחֹבוֹת 指城镇中宽阔、开放的公共场所，常为广场；בֵּין 在这里可表达置身其间。译作“广场上”既准确又符合现代汉语习惯。
theological_decisions: []
translation_notes:
  register: 采用简洁、鲜明的现代标准汉语，保留原文两句平行、重复和惊叹式夸张。未加脚注，因为“广场上”已直接表达原文所指的城镇宽阔公共空间，不需另列可能造成误解的“街上”。
