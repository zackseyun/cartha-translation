    reason: ambiguity
lexical_decisions:
- source_word: כְּמִתְלַהְלֵהַּ
  choice: 好像疯癫的人
  rationale: 介词כְּ表达比拟；此处התפעל分词表示行为狂乱、失去理智。译作“疯癫的人”既保留人物形象，也传达其危险的失常行为。
- source_word: הַיֹּרֶה
  choice: 乱射
  rationale: ירה在箭矢和投射物语境中通常指发射；加入“乱”自然承接前面的疯癫状态，并呈现不顾后果、四处发射的画面。
- source_word: זִקִּים
  choice: 火把
  rationale: 该词可指燃烧的木柴或带火的投射物。“火把”简洁易懂，但原词也可能特指燃烧的投射物，故以脚注保留。
- source_word: חִצִּים
  choice: 利箭
  rationale: חִצִּים通常指箭；“利箭”符合现代汉语的诗性并强化其伤害性，但不改变基本所指。
- source_word: וָמָוֶת
  choice: 和死亡
  rationale: 直译保留原文突兀而强烈的高潮，也不武断判定“死亡”是第三种投射物、射击的结果，还是对致命伤害的诗性概括。
theological_decisions:
- issue: “死亡”与前列名词的关系
  choice: 保留“和死亡”的并列结构
  alternative: 译作“致人死亡”或“致命之物”
  rationale: 原文语法将מָוֶת与前面的名词并列，却没有明确说明其逻辑关系；直译可保存这一诗性张力。
translation_notes:
  register: 采用现代、凝练而具箴言诗体力度的表达。“乱射”使句子自然，并显出疯癫行为的危险性；句末保留逗号，因为本节的比喻在下一节完成。
