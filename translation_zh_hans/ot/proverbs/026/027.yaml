  yaml_path: translation/ot/proverbs/026/027.yaml
  text: Whoever digs a pit will fall into it[a], and he who rolls a stone, it will come back on him.
translation:
  language: zh_hans
  text: 挖坑的，必掉在其中；滚动石头的，石头必滚回他身上。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֹּרֶה
  choice: 挖……的
  rationale: Qal主动分词作名词用，泛指做这事的人；汉语用“……的”自然表达一般性主体。
- source_word: שַּׁחַת
  choice: 坑
  rationale: 指所挖的坑，也可含陷阱之意；“坑”简洁自然，并保留智慧文学中的典型意象。
- source_word: בָּהּ
  choice: 在其中
  rationale: 阴性代词回指“坑”；“掉在其中”忠实表达落入所挖之坑的结果。
- source_word: יִפֹּל
  choice: 必掉
  rationale: 未完成式在箴言中表达可预期的后果；“必”体现格言式的因果关系。
- source_word: וְגֹלֵל
  choice: 滚动……的
  rationale: 分词与上半句平行，泛指滚动石头的人；保留两分句对称结构。
- source_word: אֶבֶן
  choice: 石头
  rationale: אֶבֶן的常规、宽泛对应词，准确保留原文意象。
- source_word: אֵלָיו
  choice: 他身上
  rationale: 与“返回”连用时表示石头回到或反落在推动者身上，含有伤害性的反噬意味。
- source_word: תָּשׁוּב
  choice: 必滚回
  rationale: 阴性动词以“石头”为主语，意为返回；结合石头的运动方式译作“滚回”，使汉语形象自然，同时保留回返之义。
