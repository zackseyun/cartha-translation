  text: עֲנֵ֣ה כְ֭סִיל כְּ/אִוַּלְתּ֑/וֹ פֶּן יִהְיֶ֖ה חָכָ֣ם בְּ/עֵינָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/026/005.yaml
  text: Answer a fool according to his folly[b][a], lest he be wise in his own eyes.
translation:
  language: zh_hans
  text: 要照愚昧人的愚妄回答他[a][b]，免得他自以为有智慧。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“按他的愚妄所应得的方式回答他。”希伯来语是指用与他的愚妄相称的方式回答，并非效法他的愚妄。
    reason: lexical_alternative
  - marker: b
    text: 本节刻意与《箴言》26:4形成张力；智慧能辨明何时应当沉默，何时应当反驳。
    reason: cross_reference
lexical_decisions:
- source_word: עֲנֵה
  choice: 回答
  rationale: 这是动词 ענה 的祈使式，在此要求作出回应；“回答”简洁自然，也与上一节的措辞形成对应。
- source_word: כְסִיל
  choice: 愚昧人
  rationale: כְסִיל 是智慧文学中的常用词，所指不只是智力不足，更包括顽固、拒绝智慧的人；“愚昧人”保留了这一固定的智慧文学类别。
- source_word: כְאִוַּלְתּוֹ
  choice: 照他的愚妄
  rationale: 前缀 כְ 表示对应或相称，即回答要针对并切合他的愚妄。“照他的愚妄”贴近原文，并保留与第4节之间刻意形成的张力；它本身并不必然表示模仿对方的愚妄。
- source_word: פֶּן
  choice: 免得
  rationale: פֶּן 引出需要防止的结果或消极目的；“免得”准确、简洁，也符合现代汉语箴言式表达。
- source_word: יִהְיֶה חָכָם
  choice: 有智慧
  rationale: 结合后面的“在自己眼中”，这里不是说愚昧人真正变得有智慧，而是说他会如此看待自己；汉语以“自以为有智慧”自然表达整个结构。
- source_word: בְּעֵינָיו
  choice: 自以为
  rationale: 字面为“在他自己眼中”，表示按他自己的判断或看法。“自以为”是现代汉语中自然、准确的习语对应；其眼睛意象未直译，但含义完整保留。
theological_decisions:
- issue: 与《箴言》26:4的解释张力
  choice: 正文保留“照……愚妄回答”的对应性表达，不在译文中消解表面的矛盾。
  alternative: 译作“按他的愚妄所当得的回答他”或“用适合他愚妄的方式回答他”。
  rationale: 相邻两则箴言刻意呈现处境性的智慧张力：不可用使自己也变得像愚昧人的方式回答（第4节），但在必要时又应针对其愚妄作出回应，以免他自以为有智慧（第5节）。正文应保存这一张力，脚注只作必要说明。
translation_notes:
  register: 采用现代、庄重而简明的普通话。“要……免得……”保留希伯来文祈使句与防止结果从句的结构；“愚昧人”“愚妄”维持智慧文学的术语关联。
