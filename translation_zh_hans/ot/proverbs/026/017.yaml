    reason: lexical_alternative
lexical_decisions:
- source_word: מַחֲזִיק
  choice: 揪住
  rationale: 该词在这里表示牢牢抓住；“揪住”与“耳朵”搭配自然，也保留了原文冒失抓住危险之物的鲜明画面。
- source_word: בְּאָזְנֵי
  choice: 耳朵
  rationale: 介词 בְּ 在此标明抓取的部位；汉语以“揪住狗的耳朵”自然表达。
- source_word: כָלֶב
  choice: 狗
  rationale: 保留原文单数的具体比喻形象。
- source_word: עֹבֵר
  choice: 过路人
  rationale: Qal 主动分词在此作名词，指恰巧经过的人；“过路人”简洁自然。
- source_word: מִתְעַבֵּר
  choice: 插手
  rationale: 该 Hitpael 形式语义较难确定；在“不属于自己的争端”这一语境中，最可能指主动介入或干预。“插手”既符合现代汉语，也保留了行为不当的语气。
- source_word: עַל רִיב
  choice: 争端
  rationale: עַל 在汉语中由动词“插手”的搭配体现；רִיב 可指争吵或纠纷，“争端”能涵盖两者。
- source_word: לֹא לוֹ
  choice: 不属于自己的
  rationale: 直陈该争端与介入者无关，保留原文简洁的所属关系。
