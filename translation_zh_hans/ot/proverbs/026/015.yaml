  yaml_path: translation/ot/proverbs/026/015.yaml
  text: A sluggard buries his hand in the dish[b][a]; he is too weary to bring it back to his mouth.
translation:
  language: zh_hans
  text: 懒汉把手埋[a]在盘子里[b]，连把手收回到嘴边都觉得累。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “埋”也可译作“藏”。希伯来语动词兼有“隐藏”和“掩埋”的意思；正文采用“埋”，以保留这句箴言夸张的画面。
    reason: lexical_alternative
  - marker: b
    text: “盘子”也可译作“碗”或“大盘”。
    reason: lexical_alternative
lexical_decisions:
- source_word: טָמַן
  choice: 埋
  rationale: 该动词可表示“藏、掩埋”。这里采用“埋”，以保留箴言夸张、荒诞而鲜明的画面；“藏”则作为脚注中的可能译法。
- source_word: עָצֵל
  choice: 懒汉
  rationale: 该词在《箴言》中常指一种典型人物。“懒汉”简洁自然，并保留其人物类型和贬义色彩。
- source_word: יָדוֹ
  choice: 手
  rationale: 按上下文自然表达第三人称单数所属；后半句再次明说“手”，避免中文代词所指含混。
- source_word: בַּצַּלָּחַת
  choice: 在盘子里
  rationale: 该名词指盛食物的盘、碗或大盘。“盘子”是现代汉语中自然且不过度限定器皿形状的表达。
- source_word: נִלְאָה
  choice: 都嫌累
  rationale: 该形式表达疲乏、觉得费力；结合语境，译作“都嫌累”自然传达懒汉连这一简单动作也不愿完成的夸张意味，同时不把句子解释得过满。
- source_word: לַהֲשִׁיבָהּ
  choice: 把手拿回
  rationale: 使役形式含“使之返回、带回”之意；阴性宾语后缀所指为“手”，故在中文中明译为“把手拿回”，保留从盘中返回的动作。
- source_word: אֶל פִּיו
  choice: 嘴边
  rationale: 原文直指“到他的口”。中文“拿回嘴边”自然呈现把食物送到嘴边的动作，又没有额外明说手中已有食物。
