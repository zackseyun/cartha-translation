  yaml_path: translation/ot/proverbs/026/022.yaml
  text: The words of a whisperer are like delicious morsels[b][a], and they go down into the inner chambers of the belly.
translation:
  language: zh_hans
  text: 搬弄是非之人的话，像美味的小食[a]；这些话深入到人的腹中深处[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“像精致的小块食物”，也可能指“像被贪婪吞下的东西”。这里的希伯来词罕见，含义有争议；较古老的传统也译作“像创伤”。
    reason: lexical_alternative
  - marker: b
    text: “腹中深处”是希伯来语的形象说法，指一个人内在的最深处。
    reason: cultural_note
lexical_decisions:
- source_word: דִּבְרֵי
  choice: ……的话
  rationale: 这是דָּבָר的复数构造形式；译作“……的话”自然、准确，也符合汉语箴言体。
- source_word: נִרְגָּן
  choice: 搬弄是非之人
  rationale: 此词在《箴言》中指暗中传播挑拨性言语的人。“搬弄是非之人”比单纯的“说闲话的人”更能表达其制造纷争的含义，同时不把词义收窄为正式的诽谤。
- source_word: כְּמִתְלַהֲמִים
  choice: 像美味的小食
  rationale: 这是一个罕见且有争议的词形。同一表达见于箴言18:8；按上下文，指诱人入口、令人贪食的小块食物，能与下句“落到腹中深处”的意象连贯。脚注保留其他可能理解。
- source_word: וְהֵם
  choice: （这些话）
  rationale: 希伯来文以显式代词强调前述话语；汉语用连续句“直落到”自然承接，其所指仍清楚。
- source_word: יָרְדוּ
  choice: 直落到
  rationale: ירד意为“下去、降下”。在普遍性箴言中译作“落到”；“直”体现这些话深入人体内部的动态和结果，但不额外解释其道德作用。
- source_word: חַדְרֵי בָטֶן
  choice: 人的腹中深处
  rationale: 原文直译为“腹部的内室”。“腹中深处”保留具体身体意象，并以自然现代汉语表达其所指的内在最深处；脚注说明该希伯来意象。
