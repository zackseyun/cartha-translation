  register: 采用现代、庄重而易懂的箴言体。“搬弄是非之人”传达秘密散布挑拨言语的角色；“美味的小食”与“腹中深处”共同保留原文进食并深入内部的连贯意象。所有脚注标记均置于正文相关词语之后。
