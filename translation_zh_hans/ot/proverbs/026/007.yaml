  text: Like the legs that hang limp from a lame man[a], so is a proverb in the mouth of fools.
translation:
  language: zh_hans
  text: 跛足之人的双腿松弛下垂；愚昧人口中的箴言也是如此。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“跛足之人的双腿耷拉着；愚昧人口中的箴言也是如此。”
    reason: 原文动词可指松弛地下垂或耷拉。
lexical_decisions:
- source_word: דַּלְיוּ
  choice: 软垂无力
  rationale: 该词描绘肢体松弛下垂的状态；“软垂无力”既保留具体形象，也传达其不能正常发挥作用的意味。
- source_word: שֹׁקַיִם
  choice: 双腿
  rationale: 该词可具体指小腿或腿部；此处用现代汉语自然的“双腿”，足以保留比喻的身体意象。
- source_word: מִפִּסֵּחַ
  choice: 瘸子的
  rationale: 介词可表达所属或关联；译作“瘸子的”符合汉语习惯，同时保留双腿与跛足者之间的关系。
- source_word: וּמָשָׁל
  choice: 箴言也是如此
  rationale: 连接词引出比喻的对应项；补出“也是如此”，使希伯来诗句的比较关系在汉语中清楚自然。
- source_word: מָשָׁל
  choice: 箴言
  rationale: 在《箴言》的语境中，该词指智慧格言；“箴言”准确而庄重，也与本书体裁相合。
- source_word: בְּפִי
  choice: 口中的
  rationale: 保留原文“在口中”的具体表达，同时是自然的现代汉语说法。
- source_word: כְסִילִים
  choice: 愚昧人
  rationale: 《箴言》中该词兼具道德与认知层面的负面含义；“愚昧人”比单纯表示智力不足的词更能保留这一智慧文学范畴。
