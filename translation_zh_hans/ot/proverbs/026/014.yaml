base_translation:
  language: en
  yaml_path: translation/ot/proverbs/026/014.yaml
  text: As a door turns on its hinge[a], so a sluggard on his bed.
translation:
  language: zh_hans
  text: 门怎样绕着门轴转，懒汉也照样在床上翻身。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“门在它的轴上转，懒汉在他的床上。”原文下半句省略了“转”这一谓语；正文按汉语习惯补作“翻身”，并将并列关系表达为类比。
    reason: 说明原文的省略结构及正文为清楚表达类比所作的补足。
lexical_decisions:
- source_word: הַדֶּלֶת
  choice: 门
  rationale: 该词指“门”；汉语无需冠词，单用“门”即可自然表达箴言中的泛指。
- source_word: תִּסּוֹב
  choice: 转
  rationale: 源自动词 סבב，在此描写门围绕门轴反复转动；“转”简洁、贴近原文，并能与下半句的省略谓语相呼应。
- source_word: עַל צִירָהּ
  choice: 绕着门轴
  rationale: צִיר 指门的轴或枢轴。希伯来语介词 עַל 在这一动态意象中用“绕着”表达，比机械直译为“在……上”更符合现代汉语。
- source_word: וְעָצֵל
  choice: 懒汉也照样
  rationale: עָצֵל 是智慧文学中惯指惯常懒惰之人的用语；“懒汉”保留其鲜明的道德与箴言色彩。“也照样”显明原文两个并列意象之间的类比关系。
- source_word: עַל מִטָּתוֹ
  choice: 在床上翻身
  rationale: מִטָּה 指床或卧榻。原文下半句省略了可由上句补出的“转”；汉语以“在床上翻身”自然补足这一动作，同时保留懒汉虽动却不离床的讽刺画面。
theological_decisions: []
translation_notes:
  register: 采用简洁、有节奏的现代箴言体。“门怎样……，懒汉也照样……”保留原文对称而带讽刺意味的画面，语言通俗但不俚俗。
