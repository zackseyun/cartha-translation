  text: One who sends messages by the hand of a fool cuts off his feet and drinks violence[a].
translation:
  language: zh_hans
  text: 借愚昧人之手传话的人，砍断自己的双脚，饮下暴行。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “话”也可译作“信息”或“口信”；原文这个词可指言语或事情，这里很可能指托付给使者传达的内容。
    reason: lexical_alternative
lexical_decisions:
- source_word: מְקַצֶּה
  choice: 砍断
  rationale: 该词是קצה的强化词干分词，表示砍去或截断；“砍断”保留原文突兀有力的自残意象。
- source_word: רַגְלַיִם
  choice: 双脚
  rationale: 原文为双数，通常指两脚；不补入“自己的”，以贴近希伯来文并保留其凝练表达。
- source_word: חָמָס
  choice: 暴行
  rationale: חָמָס可指暴力、恶行或伤害；“暴行”既保留强烈意味，也能自然地与“喝下”构成比喻。
- source_word: שֹׁתֶה
  choice: 喝下
  rationale: 保留שתה“喝”的字面意象；“下”使现代汉语表达自然，并呈现将祸害吞入自身的意味。
- source_word: שֹׁלֵחַ
  choice: 借……传
  rationale: 分词表示一般性的行为者；汉语用“借……传话的”自然呈现格言中的泛指主体。
- source_word: דְּבָרִים
  choice: 话
  rationale: דְּבָרִים基本义为“话、言语、事情”；在托人递送的语境中指所传达的话或信息。“话”较贴近词面，同时保留语境中的“口信”可能。
- source_word: בְּיָד
  choice: 借……的手
  rationale: 保留希伯来语“在某人手中/借某人的手”表示媒介或代理的具体说法，现代汉语也可理解。
- source_word: כְּסִיל
  choice: 愚昧人
  rationale: 箴言中的כְּסִיל不仅指智力不足，也指道德和处世上的愚顽；“愚昧人”符合智慧文学语域。
