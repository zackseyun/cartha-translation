  yaml_path: translation/ot/proverbs/026/012.yaml
  text: Do you see a man wise in his own eyes? There is more hope for a fool than for him[a].
translation:
  language: zh_hans
  text: 你看到自以为有智慧的人吗？愚昧人比他更有指望[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你见过自以为有智慧的人吗？”希伯来语完成式在这里既可译成反问式的当下观察，也可译成对既往经验的询问。
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאִיתָ
  choice: 你看到……吗
  rationale: 这是ראה的Qal完成式第二人称阳性单数；在智慧文学中可作反问式观察。译为“你看到……吗”既自然地引出眼前所说的一类人，也保留问句语气。
- source_word: אִישׁ
  choice: 人
  rationale: 原文为阳性单数，指一个具有代表性的个体；现代汉语用“人”即可自然表达，不必增添原文没有的性别强调。
- source_word: חָכָם בְּעֵינָיו
  choice: 自以为有智慧
  rationale: 直译为“在自己眼中有智慧”，是指按自己的判断认定自己有智慧。汉语“自以为有智慧”准确传达这一习语，同时保留其讽刺意味。
- source_word: תִּקְוָה
  choice: 指望
  rationale: 此词表示希望或可期待的前景；“有指望”是自然、凝练的汉语箴言表达。
- source_word: לִכְסִיל
  choice: 愚昧人
  rationale: כְּסִיל是《箴言》中常见的智慧文学类别，兼有思想迟钝与顽梗、不肯受教之意；“愚昧人”比单纯的“笨人”更能保留其道德和认知层面。
- source_word: מִמֶּנּוּ
  choice: 比他更
  rationale: 介词מִן在这里表示比较；“比他更有指望”清楚指向前句那个自以为有智慧的人。
theological_decisions:
- issue: “愚昧人”与自以为有智慧者之间的比较
  choice: 保留“愚昧人比他更有指望”的强烈比较
  alternative: 解释为两者都毫无希望，只是程度不同
  rationale: 原文只明确作相对比较，强调自以为有智慧者比典型的愚昧人更难挽回；不进一步断言任何一方绝对没有希望。
translation_notes:
  register: 采用现代、凝练而庄重的箴言体。“自以为有智慧”以自然汉语传达“在自己眼中有智慧”的希伯来习语；全句保持原文鲜明的反问与比较结构。
