  text: Charcoal for embers[a], and wood for fire[b], and a quarrelsome man for kindling strife.
translation:
  language: zh_hans
  text: 炭使余烬更炽，柴使火更旺；好争竞的人煽起纷争。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “煽起”也可译作“挑起”或“使争端加剧”。希伯来语动词含有使争端燃起、炽烈起来的意思；正文保留了本节贯穿始终的火焰比喻。
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּחָם
  choice: 炭
  rationale: 指作为燃料的木炭；译作“炭”简洁自然，并与后面的“炭火”有所区分。
- source_word: גֶחָלִים
  choice: 炭火
  rationale: 指燃烧或灼热的煤炭、余烬；“炭火”既保留热与火的意象，也适合“添”这一动词。
- source_word: עֵצִים
  choice: 柴
  rationale: 该集合名词在此指供燃烧的木料；“柴”比泛称“木头”更符合现代汉语的用火语境。
- source_word: אֵשׁ
  choice: 烈火
  rationale: 基本义为“火”；为使“柴添烈火”的表达自然有力，译作“烈火”，体现火因加柴而旺，并未改变比喻方向。
- source_word: אִישׁ מדונים
  choice: 好争吵的人
  rationale: 字面为“纷争之人”，表示惯常引发或参与争吵的人；“好争吵的人”自然地传达其习性。
- source_word: חַרְחַר
  choice: 煽起
  rationale: 该词表达使争端燃起、加剧之意；“煽起”兼具挑动与火势被煽旺的联想，延续全句火的比喻。
- source_word: רִיב
  choice: 纷争
  rationale: 指争执、争端或冲突；“纷争”范围适中，且与“好争吵”搭配自然。
