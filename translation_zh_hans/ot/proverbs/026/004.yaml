  text: אַל תַּ֣עַן כְּ֭סִיל כְּ/אִוַּלְתּ֑/וֹ פֶּֽן תִּשְׁוֶה לּ֥/וֹ גַם אָֽתָּה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/026/004.yaml
  text: Do not answer a fool according to his folly[b][a], lest you also become like him.
translation:
  language: zh_hans
  text: 不要照愚昧人的愚妄回答他[a]，免得你也和他一样。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “照愚昧人的愚妄”也可理解为“用愚妄的方式”。希伯来语可指以与对方愚妄相呼应的方式回答。
    reason: lexical_alternative
  - marker: b
    text: 下一节说：“要照愚昧人的愚妄回答他。”两节并列，表明面对愚昧人应按具体情境运用智慧，并非简单自相矛盾。
    reason: cross_reference
lexical_decisions:
- source_word: אַל תַּעַן
  choice: 不要……回答
  rationale: אַל与未完成式构成禁令；“不要……回答”自然、直接，并保留与下一节“回答”的动词呼应。
- source_word: כְּסִיל
  choice: 愚昧人
  rationale: 这是智慧文学中兼具道德与认知含义的用语，指顽固拒绝智慧的人，并非单指智力不足者。
- source_word: כְאִוַּלְתּוֹ
  choice: 照愚昧人的愚妄
  rationale: 前缀כ表示对应或依照；此译保留原文的开放性，既可指以同样愚妄的方式回答，也可指针对其愚妄作答，不预先消解与下一节的张力。
- source_word: פֶּן
  choice: 免得
  rationale: 准确表达应当避免的负面后果，且符合现代汉语箴言体。
- source_word: תִּשְׁוֶה לּוֹ
  choice: 和他一样
  rationale: שוה在此表示与某人相同或相似；“和他一样”简洁自然。
- source_word: גַם אָתָּה
  choice: 你也
  rationale: 保留גם所表达的附加强调：回答者本人也可能变得与愚昧人相同。
theological_decisions:
- issue: 与箴言26:5相邻教训之间的解释张力
  choice: 在正文中保留“照……愚妄”的对应结构，不把含义限定为某一种解释。
  alternative: 译作“不要用愚妄的方式回答愚昧人”，从而明确限定为回答方式。
  rationale: 第4节与第5节构成刻意并置的智慧格言，要求按情境判断。原文的张力不应在翻译中被单方面消解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“愚昧人／愚妄”保留希伯来智慧文学的关键词联系；句式简洁，符合箴言体。脚注标记按内容就近放置：词义脚注[a]置于相关分句后，交叉参照脚注[b]置于全句末。
