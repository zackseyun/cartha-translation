base_translation:
  language: en
  yaml_path: translation/ot/proverbs/026/020.yaml
  text: For lack of wood[a], the fire goes out, and where there is no whisperer, strife grows quiet.
translation:
  language: zh_hans
  text: 没有柴，火就熄灭；没有传闲话的人[a]，纷争就平息。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“搬弄是非的人”或“说闲话的人”。希伯来语这个词指私下传话、散布有害言论的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאֶפֶס
  choice: 没有
  rationale: בְּ加אֶפֶס表示缺少或不存在；译作“没有”简洁自然，也保留格言中的条件与因果关系。
- source_word: עֵצִים
  choice: 柴
  rationale: עֵצִים字面为木头或树木，此处指供火燃烧的木料；“柴”符合现代汉语习惯，并准确呈现语境中的燃料含义。
- source_word: תִּכְבֶּה
  choice: 熄灭
  rationale: כבה在此是不及物用法，表示火自行熄灭；“熄灭”自然、准确。
- source_word: אֵשׁ
  choice: 火
  rationale: 汉语格言中直接说“火”最自然，无须补出定冠意义。
- source_word: וּבְאֵין
  choice: 没有
  rationale: 该结构与上半句的“没有柴”平行；重复“没有”加强原文整齐的对应结构。
- source_word: נִרְגָּן
  choice: 搬弄是非的人
  rationale: נִרְגָּן指暗中低语、散布有害言论并挑起纷争的人。“搬弄是非的人”在现代汉语中清楚自然，突出其言语造成争端的作用；脚注保留“好说闲话的人”等可能表达。
- source_word: יִשְׁתֹּק
  choice: 平息
  rationale: שתק本义为安静、沉默；用于争吵时，“平息”自然表达纷争安静下来，同时不必强调绝对终止。
- source_word: מָדוֹן
  choice: 争吵
  rationale: מָדוֹן表示争端、纷争或争竞。“争吵”通俗明确，并与搬弄是非所引发的冲突自然衔接。
