  text: כַּ/שֶּׁ֤לֶג בַּ/קַּ֗יִץ וְ/כַ/מָּטָ֥ר בַּ/קָּצִ֑יר כֵּ֤ן לֹא נָאוֶ֖ה לִ/כְסִ֣יל כָּבֽוֹד׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/026/001.yaml
  text: Like snow in summer and like rain at harvest[a], so honor is not fitting for a fool.
translation:
  language: zh_hans
  text: 夏天降雪，收割时下雨，愚昧人得尊荣也同样不合宜。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כַּשֶּׁלֶג
  choice: 夏天降雪
  rationale: 前缀 כ 表示比较；与后半句合成自然的汉语季节性图景，并由“也同样”明确承接比喻。
- source_word: בַּקַּיִץ
  choice: 夏天
  rationale: 指炎热干燥的季节；“夏天”简洁自然。
- source_word: וְכַמָּטָר
  choice: 收割时下雨
  rationale: 保留第二个与前者平行的反常天气图景；汉语用“下雨”比名词式“雨水”更自然。
- source_word: בַּקָּצִיר
  choice: 收割时
  rationale: קָצִיר 指收割或收获季节；“收割时”准确表现这一时间背景及雨水带来的不合时宜。
- source_word: כֵּן
  choice: 也同样
  rationale: 引出比喻的结论，使前两个图景与愚昧人所得尊荣之间的对应关系清楚自然。
- source_word: לֹא נָאוֶה
  choice: 不合宜
  rationale: נָאוֶה 表示合适、相称；“不合宜”庄重而通俗，并保留对失当之处的判断。
- source_word: לִכְסִיל
  choice: 愚昧人
  rationale: כְּסִיל 是智慧文学中一贯指拒绝智慧、行事愚顽之人的术语；“愚昧人”比单纯“笨人”更能保留其道德与智慧层面的含义。
- source_word: כָּבוֹד
  choice: 尊荣
  rationale: 此处指给予人的社会荣誉、地位或敬重，而非神圣荣耀；“尊荣”适合箴言体裁，也准确表达所获的荣誉。
theological_decisions: []
translation_notes:
  register: 采用现代、凝练而庄重的箴言体。汉语正文不机械重复两个“像”，而以并列图景开篇，并用“也同样”承接结论，既保留希伯来文的比较结构，也使句子自然易懂。
