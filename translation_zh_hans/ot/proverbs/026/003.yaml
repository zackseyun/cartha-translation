  - severity: medium
    issue: “为……预备的”反复使用，末句搭配不够自然。
    rationale: 原文确有平行的介词短语，但汉语“为愚昧人的背预备的”生硬。改为“给……的”既保留对应关系，也更合现代标准汉语。
  revised_text: 鞭子是给马的，辔头是给驴的，杖是给愚昧人的背的。
