  text: A whip for the horse[a], a bridle for the donkey[b], and a rod for the back of fools.
translation:
  language: zh_hans
  text: 鞭子是给马的，辔头是给驴的，杖是给愚昧人的背的。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שׁוֹט
  choice: 鞭子
  rationale: 指驱赶或管束牲畜的鞭具；“鞭子”是现代汉语中自然、准确的对应词。
- source_word: לַסּוּס
  choice: 为马预备的
  rationale: 介词 ל 表示适用或指定对象；采用“为……预备的”明确呈现三项并列关系，也符合汉语箴言体。
- source_word: מֶתֶג
  choice: 辔头
  rationale: 指用来控制牲畜的口衔或整套辔具；“辔头”既保留传统庄重感，也比单译“嚼环”涵盖更广。
- source_word: לַחֲמוֹר
  choice: 为驴预备的
  rationale: “驴”是现代标准汉语中清楚自然的动物名称，并与前项保持平行。
- source_word: וְשֵׁבֶט
  choice: 刑杖
  rationale: שֵׁבֶט 在此指用于击打、管教的杖；“刑杖”比泛指的“棍子”更能表达惩戒意味。
- source_word: לְגֵו
  choice: 为……的背预备的
  rationale: גֵו 在此指承受杖打的背部；“背”直接、清楚，并保留原文具体形象。
- source_word: כְּסִילִים
  choice: 愚昧人
  rationale: 在《箴言》中指道德与智慧意义上的愚顽者；“愚昧人”是清楚且具有经文语体的表达。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的箴言体。通过三次“为……预备的”再现希伯来文三个 ל 短语的紧密平行；不增添因果解释，也不弱化原文惩戒性的比喻。
