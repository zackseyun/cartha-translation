  text: So is the man who deceives his neighbor and says[b][a], “Am I not only joking?”
translation:
  language: zh_hans
  text: 欺骗邻舍[a]，又说：“我不就是在开玩笑吗？”[b]的人，也是这样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“朋友”或“同伴”。希伯来语 רֵעַ 可按语境指邻舍、朋友或同伴。
    reason: lexical_alternative
  - marker: b
    text: 或译“我不是在玩闹吗？”或“我不是在说笑吗？”希伯来语分词可指玩耍或戏谑；这里是用来淡化有害欺骗的托词。
    reason: lexical_alternative
lexical_decisions:
- source_word: כֵּן
  choice: 这样的人也是如此
  rationale: 承接上一节的比喻，保留“同样如此”的类比作用；汉语中置于句末更自然，也表明本节句意依赖前文。
- source_word: אִישׁ
  choice: 这样的人
  rationale: 原文为阳性单数，在箴言中代表具有所述行为的一类人；现代汉语用“这样的人”自然且不额外限定性别。
- source_word: רִמָּה
  choice: 欺骗
  rationale: 准确表达蓄意误导他人的道德含义，也与说话者随后以玩笑开脱的语境相符。
- source_word: רֵעֵהוּ
  choice: 邻舍
  rationale: רֵעַ可指邻舍、朋友或同伴；“邻舍”保留其较宽泛的人际和伦理范围。
- source_word: וְאָמַר
  choice: 却说
  rationale: 原文连接词本义为“并且”，此处语义上带有行为与辩解之间的反差；“却说”自然呈现这种语用关系。
- source_word: הֲלֹא
  choice: 不就是……吗
  rationale: 保留期待肯定回答的反问语气，并传达说话者为自己开脱、淡化伤害的口吻。
- source_word: מְשַׂחֵק
  choice: 开个玩笑
  rationale: 该分词可表示玩耍、嬉戏或戏谑；语境中指把有害欺骗说成无伤大雅的玩笑。
- source_word: אָנִי
  choice: 我
  rationale: 保留原文明确出现并带强调作用的第一人称代词。
