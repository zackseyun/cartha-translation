  naturalness: “欺骗邻舍……却说……这样的人也是如此”在现代汉语中不够顺畅，尤其“这样的人也是如此”显得重复且语义悬空。将定语结构完整地落在“人”上，并用“又说”对应连接词，读来更自然、庄重。
  terminology: “邻舍”可保留רֵעַ在此处较宽泛的人际伦理含义；脚注适当说明“朋友／同伴”的可能。“开玩笑”恰当地传达מְשַׂחֵק在本语境中将有害欺骗轻描淡写为游戏或戏谑的开脱。
