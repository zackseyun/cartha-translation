revisions:
- from: 欺骗邻舍[a]，却说：“我不就是开个玩笑吗？[b]”这样的人也是如此。
  to: 欺骗邻舍[a]，又说：“我不就是在开玩笑吗？”[b]的人，也是这样。
  rationale: 修订将“人”置于两个行为的定语结构之后，并以“也是这样”收束，清楚表达本节כֵּן对上一节比喻的类比承接。以“又说”直译性地保留连接关系；“在开玩笑”对应持续性分词，同时保留自我开脱的反问口吻。脚注内容和锚点均与相应词语相符。
