  text: Like a thorn that comes up in the hand of a drunkard[b][a], so is a proverb in the mouth of fools.
translation:
  language: zh_hans
  text: 荆棘在醉汉手中升起，箴言在愚昧人口中也是如此。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חוֹחַ
  choice: 荆棘
  rationale: 该词可指刺或带刺的植物；“荆棘”既保留尖锐、可能伤人的意象，也容纳“带刺灌木”的词义范围。
- source_word: עָלָה
  choice: 举起
  rationale: 该动词本义为“上去、升起”。在“手里”这一搭配中译作“举起”，自然呈现荆棘在醉汉手中抬起的危险画面，同时不进一步断定是挥舞还是误伤。
- source_word: בְיַד
  choice: 手里
  rationale: 直接保留具体的手部意象，并与下半句“口中”形成结构对应。
- source_word: שִׁכּוֹר
  choice: 醉汉
  rationale: 指处于醉酒状态的人；“醉汉”简洁自然，符合汉语箴言的凝练语体。
- source_word: מָשָׁל
  choice: 箴言
  rationale: 在智慧文学中指格言、箴言；此处“箴言”既贴合文体，也能表达本来有智慧内容的言语。
- source_word: בְּפִי
  choice: 口中说出
  rationale: 保留“口中”的身体意象；补入“说出”使现代汉语完整自然，并与上半句的动作相应。
- source_word: כְסִילִים
  choice: 愚昧人
  rationale: 该词在智慧文学中指在道德和判断上顽梗迟钝的人，而不只是智力不足者；“愚昧人”能保留这一惯用含义。
