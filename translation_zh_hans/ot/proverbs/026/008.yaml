  text: Like one who binds a stone in a sling[a], so is one who gives honor to a fool.
translation:
  language: zh_hans
  text: 如同把石头绑在投石带上，把尊荣给愚昧人也是如此。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“把石头放在石堆中。”译为“投石带”的希伯来语词词义不确定。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּ/צְרוֹר
  choice: 把……绑在
  rationale: 将该形式理解为动词צרר“捆绑、系住”的不定式，用具体动作再现比喻；现代汉语中“绑在”自然清楚。
- source_word: אֶבֶן
  choice: 石头
  rationale: אֶבֶן通常指“石头”，符合甩石器具的具体意象。
- source_word: בְּ/מַרְגֵּמָה
  choice: 在甩石带里
  rationale: 该罕见名词词义不确定；正文采用语境中较常见的“甩石带”解法，同时以脚注保留“石堆”的可能。
- source_word: כֵּן
  choice: 也是这样
  rationale: 明确连接前面的形象和后面的应用，保留希伯来语比较结构，并使汉语表达自然。
- source_word: נוֹתֵן
  choice: 把……给
  rationale: 该分词表达一般性的行为者；汉语无需另加性别化主语，直接用对称句式即可传达泛指。
- source_word: לִ/כְסִיל
  choice: 给愚昧人
  rationale: כְּסִיל在《箴言》中指道德和判断上顽梗、愚钝的人；“愚昧人”是庄重且符合智慧文学语域的译法。
- source_word: כָּבוֹד
  choice: 尊荣
  rationale: 此处指社会上的敬重、地位或荣誉；“尊荣”比“荣耀”更贴合对人的公开抬举，也保持经文语体。
