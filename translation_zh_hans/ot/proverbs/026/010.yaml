  yaml_path: translation/ot/proverbs/026/010.yaml
  text: Like an archer who wounds everyone is one who hires a fool or hires passersby[a][b].
translation:
  language: zh_hans
  text: 雇用愚昧人或过路人的人，就像弓箭手射伤众人一样。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文本本节极难解释。“像弓箭手射伤众人”采用一种由来已久的解释。另有译法较按常见词义处理开头，如“伟大者成就万事”等，但在上下文中较难贯通。
    reason: alternative_reading
  - marker: b
    text: 或译：“雇用愚昧人，又雇用任何过路人的人。”本句所描写的是不加分辨地雇人，结果使人受害。
    reason: lexical_alternative
lexical_decisions:
- source_word: רַב
  choice: 弓箭手
  rationale: 马所拉文本此处极难解释。רַב通常意为“大、多”，但古老且在上下文中较连贯的理解将其视为“弓箭手/射手”，与下文不加分辨地雇人所造成的广泛伤害构成比喻。
- source_word: מְחוֹלֵל
  choice: 射伤
  rationale: 此词形的词根及含义存在争议；结合“弓箭手”的传统理解，译作“射伤”既表达造成创伤，也使汉语意象完整。
- source_word: כֹּל
  choice: 众人
  rationale: 在弓箭手伤人的语境中，泛指所有受到波及的人；“众人”比“万物”自然。
- source_word: וְשֹׂכֵר
  choice: 雇用……的
  rationale: 将连接词所表达的比拟关系在汉语中重组为“……的，就像……一样”，使箴言的比较结构清楚自然。
- source_word: כְּסִיל
  choice: 愚昧人
  rationale: 这是《箴言》中常见的智慧文学用语，兼有道德与判断力上的负面含义，不仅指智力不足。
- source_word: וְשֹׂכֵר
  choice: 或随便雇用
  rationale: 重复的分词可理解为另一个同类行为；“或”保留两种对象的并列选择，“随便”点出雇用过路人所含的不加分辨之意。
- source_word: עֹבְרִים
  choice: 过路人
  rationale: 字面指经过的人；“过路人”简洁自然，并保留临时遇见、资历不明的形象。
