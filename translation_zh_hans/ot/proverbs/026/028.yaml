  terminology: “恨恶”“谄媚”“败落”均与智慧文学的正式语域相称。“压碎”保留 דכה 所含压迫、摧残的强烈意象；脚注列出的“伤害”“压迫”及“毁灭”“倾覆”适当呈现可行的语义范围。脚注 b 正确说明“圆滑的口”为字面表达及其谄媚、虚伪的语用含义。
