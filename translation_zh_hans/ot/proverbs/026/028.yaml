  text: לְֽשׁוֹן שֶׁ֭קֶר יִשְׂנָ֣א דַכָּ֑י/ו וּ/פֶ֥ה חָ֝לָ֗ק יַעֲשֶׂ֥ה מִדְחֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/026/028.yaml
  text: A lying tongue hates those it crushes[c][b][a], and a flattering mouth causes ruin.
translation:
  language: zh_hans
  text: 说谎的舌头恨恶被它压碎的人[a]；谄媚的口[b]使人败落[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“被它伤害的人”或“受它压迫的人”。希伯来语所指的是遭压碎、压迫或伤害的受害者。
    reason: lexical_alternative
  - marker: b
    text: 直译：“圆滑的口”，即以谄媚或虚假圆滑的话说话。
    reason: lexical_alternative
  - marker: c
    text: 或译：“造成毁灭”或“使人倾覆”。
    reason: lexical_alternative
lexical_decisions:
- source_word: לְשׁוֹן שֶׁקֶר
  choice: 说谎的舌头
  rationale: 直译为“虚假的舌头”；此译自然地保留以“舌头”代表言语及说话者的拟人表达。
- source_word: יִשְׂנָא
  choice: 恨恶
  rationale: 未完成式在箴言中表达普遍事实，并非特指将来；“恨恶”符合庄重的箴言语体。
- source_word: דַכָּיו
  choice: 被它压碎的人
  rationale: 该形式指被压碎、压迫或伤害的人；“被它压碎的人”保留词根的强烈意象，也明确受害者与说谎之舌的关系。
- source_word: וּפֶה חָלָק
  choice: 谄媚的口
  rationale: 字面为“圆滑的口”；在此指以谄媚或虚假圆滑的话欺骗别人，意译为“谄媚的口”更符合现代汉语。
- source_word: יַעֲשֶׂה
  choice: 使人
  rationale: 该动词本义为“做、造成”，与表示败落的名词连用时，以“使人……”自然表达其致使意义；“人”为汉语中补出的受事者，不限定具体对象。
- source_word: מִדְחֶה
  choice: 败落
  rationale: 该名词可指跌倒、倾覆或毁灭；“败落”既保留坠落、衰败的意象，也适合描述谄媚言语造成的后果。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而简洁的箴言语体。上下两句保留“舌头／口”的平行意象及言语造成伤害的拟人表达；对含义不止一种的 דַכָּיו 与 מִדְחֶה 在脚注中列出主要译法。
