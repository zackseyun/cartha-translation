  yaml_path: translation/ot/proverbs/026/002.yaml
  text: Like a sparrow in its wandering[a], like a swallow in its flying[c][b], so an undeserved curse does not come to rest.
translation:
  language: zh_hans
  text: 麻雀往来，燕子[a]飞翔；无故[b]的咒诅也不会临到[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “燕子”也可能译作“雨燕”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译为“没有缘由的咒诅”，即毫无根据或不该受的咒诅。
    reason: lexical_alternative
  - marker: c
    text: 直译为“不会来到”。结合飞鸟的比喻，也可理解为不会落在某人身上或发生效力。
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּצִּפּוֹר
  choice: 麻雀怎样
  rationale: צִפּוֹר可泛指小鸟，也常译为“麻雀”；此处与下一种鸟构成平行意象。“怎样”自然表达前缀כַּ的比喻作用。
- source_word: לָנוּד
  choice: 飞来飞去
  rationale: נוּד表示游移、飘荡或不安定的移动；“飞来飞去”以现代汉语呈现小鸟没有落定的动态。
- source_word: כַּדְּרוֹר
  choice: 燕子
  rationale: דְּרוֹר通常译为“燕子”，也可能指“雨燕”；正文采用读者更熟悉的“燕子”，并在脚注保留物种辨识上的不确定性。
- source_word: לָעוּף
  choice: 振翅飞翔
  rationale: עוּף意为飞、飞翔；“振翅飞翔”与上句的动态意象相称，同时保持诗句的平行。
- source_word: כֵּן
  choice: 也照样
  rationale: כֵּן引出比喻的结论；“也照样”清楚连接鸟飞不定与咒诅不临到的对应关系。
- source_word: קִלְלַת חִנָּם
  choice: 无故的咒诅
  rationale: 该短语直指没有缘由、没有根据的咒诅；“无故的咒诅”贴近希伯来文结构，也保留其道德含义。
- source_word: לֹא תָבֹא
  choice: 不会临到
  rationale: בוא字面是“来、到来”。“不会临到”在中文中自然表达咒诅不会到达其对象；鸟落下或停驻的意象是上下文所暗示的，因此放在脚注说明，而不写死在正文中。
theological_decisions:
- issue: 无故咒诅的结果
  choice: 不会临到
  alternative: 不会落定／不会生效
  rationale: 正文按WLC的לֹא תָבֹא表达否定的“来到、临到”，不进一步界定咒诅如何运作；脚注说明比喻可能含有“不落在目标上、不发生效力”的意味，以保留箴言意象和神学张力。
translation_notes:
  register: 采用简洁、对称的现代汉语箴言体。“飞来飞去／振翅飞翔”呈现两行平行的动态画面；“无故的咒诅”“不会临到”庄重而易懂。所有解释性扩展均放入脚注，正文不消除原文的简练与含蓄。
