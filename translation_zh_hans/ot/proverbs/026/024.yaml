  text: A hater disguises himself with his lips[b][a], but within himself he sets deceit.
translation:
  language: zh_hans
  text: 怀恨的人用嘴唇掩饰自己[a]，却在内里存着诡诈[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“怀恨的人用嘴唇假装。”
    reason: lexical_alternative
  - marker: b
    text: “内里”直译“在他里面”或“在他的内部”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בִשְׂפָתוֹ
  choice: 用嘴唇
  rationale: 介词 בְּ 在此表示手段；保留“嘴唇”的具体意象，并以“用”构成自然的现代汉语表达。
- source_word: יִנָּכֵר
  choice: 掩饰自己
  rationale: נכר 的尼法勒式在此指使自己显得与真实情况不同，即隐藏真实态度；“掩饰自己”既体现反身意味，也与下句内藏诡诈形成对照。
- source_word: שֹׂנֵא
  choice: 恨人的
  rationale: 分词在此作名词使用，指怀有仇恨的人；“恨人的”比“仇敌”更直接保留“恨”这一词义。
- source_word: וּבְקִרְבּוֹ
  choice: 内里
  rationale: קֶרֶב 指人的内部、内在；“内里”保留外在嘴唇与内在实情的对照，且不将其具体化为原文未明说的“心”。
- source_word: יָשִׁית
  choice: 存着
  rationale: שׁית 的基本义为放置、安放；结合汉语搭配，“存着诡诈”自然地表达有意将诡诈置于内在的含义。
- source_word: מִרְמָה
  choice: 诡诈
  rationale: 该词可指欺骗或奸诈；“诡诈”适合智慧文学语境，也能表达蓄意欺骗的性质。
theological_decisions: []
