  yaml_path: translation/ot/proverbs/026/025.yaml
  text: When he makes his voice gracious[a], do not trust him[b], for seven abominations are in his heart.
translation:
  language: zh_hans
  text: 他使自己的声音显得悦耳时[a]，不要信任他，因为他心里有七样可憎之事[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他说话动听时”，或“他使自己说话显得讨喜时”。希伯来文直译为“他使自己的声音显得悦耳”。
    reason: lexical_alternative
  - marker: b
    text: 智慧文学中的“七”可能含有充满或完全的意味；正文仍保留原文的数字。
    reason: cultural_note
lexical_decisions:
- source_word: יְחַנֵּן
  choice: 使……显得悦耳
  rationale: 这是חנן的Piel形式，以“他的声音”为宾语，表示刻意使话语听来讨喜、动人。“显得悦耳”既传达修饰言辞的意味，也避免误解为单纯音色优美。
- source_word: קוֹלוֹ
  choice: 自己的声音
  rationale: 原文直译为“他的声音”，在语境中指他说话的声调和方式。保留“声音”可保存希伯来文的具体意象；中文用“自己的”使主语指向清楚。
- source_word: אַל תַּאֲמֶן בּוֹ
  choice: 不要信任他
  rationale: אמן的Hiphil形式搭配介词ב，含有倚赖、信任某人的意思；“不要信任他”比仅针对言论真假的“不要相信他的话”更贴近原文结构。
- source_word: שֶׁבַע
  choice: 七样
  rationale: 原文明说“七”。智慧文学中的七可能暗示充满或完全，但正文保留明确数字，不将其解释性改写为“许多”。量词“样”与后面的复数事物自然搭配。
- source_word: תּוֹעֵבוֹת
  choice: 可憎之事
  rationale: 该词指在道德上令人厌恶、可憎的事物，语气强烈。“可憎之事”庄重自然，也保留其道德分量。
- source_word: בְּלִבּוֹ
  choice: 在他心里
  rationale: “心”在希伯来文中指人的内在思想、意图与谋算。保留这一圣经惯用意象，而不缩窄为某一种心理活动。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“使自己的声音显得悦耳”略带原文式意象，但仍可自然理解为刻意把话说得动听；句式保持箴言的简洁和警戒语气。
