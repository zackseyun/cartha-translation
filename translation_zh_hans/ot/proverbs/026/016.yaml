  yaml_path: translation/ot/proverbs/026/016.yaml
  text: A sluggard is wiser in his own eyes than seven who answer with discernment[a].
translation:
  language: zh_hans
  text: 懒惰人自以为比七个能作出明智回答的人更有智慧。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“比七个能给出合理回答的人更有智慧。”
    reason: lexical_alternative
lexical_decisions:
- source_word: חָכָם
  choice: 更有智慧
  rationale: 在由介词 מִן 引出的比较结构中作谓语，译为比较表达“更有智慧”，符合现代汉语习惯。
- source_word: עָצֵל
  choice: 懒惰人
  rationale: 指惯常懒惰的人；“懒惰人”简洁、庄重，也保留智慧文学中对一种典型人物的称谓。
- source_word: בְּעֵינָיו
  choice: 自以为
  rationale: 这是表示自我评价的希伯来语习语；现代汉语用“自以为”自然传达“在自己眼中”的含义及其反讽语气。
- source_word: מִשִּׁבְעָה
  choice: 比七个
  rationale: 介词 מִן 在此标示比较，直接译为“比七个”。
- source_word: מְשִׁיבֵי
  choice: 善于……应对的人
  rationale: 分词表示能够作出回答的人；“应对”比单纯“回答”略能体现针对问题作出合宜回应的语境。
- source_word: טָעַם
  choice: 明智
  rationale: 此处不是字面的“味道”，而是指判断力、见识或合宜的道理；与“应对”搭配译为“明智”，自然地表达有见识的回答，同时不把词义限定为某一种抽象品质。
theological_decisions: []
translation_notes:
  register: 采用现代、凝练的箴言体。“自以为”清楚传达自负的反讽；“七个”按原文保留，表达多个具备成熟判断力的人。脚注保留 מְשִׁיבֵי טָעַם 可理解为“给出合理回答”的词义选择。
