base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/004.yaml
  text: A slack hand makes one poor[a], but the hand of the diligent makes rich.
translation:
  language: zh_hans
  text: 懒散的手使人贫穷[a]；勤劳人的手使人富足。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“诡诈的手使人贫穷。”רְמִיָּה 在别处可有“诡诈”的意思，但本节谈论劳作，并与“勤劳”相对，因此更可能指“懒散”或“怠惰”。
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאשׁ
  choice: 贫穷
  rationale: 这里与使役意义的 עֹשֶׂה 连用，表示懒散劳作所导致的经济处境；译为“使人贫穷”，与下句“使人富足”形成清楚而对称的反义平行。
- source_word: עֹשֶׂה
  choice: 使
  rationale: 此处分词表达造成某种结果，汉语用“使”自然保留其因果和使役意味。
- source_word: כַף
  choice: 手
  rationale: כַף 本可特指“手掌”，但在这里以身体部位喻指劳动方式；译作“手”符合现代汉语习惯，也保留原文意象。
- source_word: רְמִיָּה
  choice: 懒散
  rationale: 该词虽可表示“诡诈”，但与“手”搭配且处于勤劳主题的反义平行中，较可能指松懈、怠惰；“懒散”既自然，也保留行为疏懒的含义。
- source_word: יָד
  choice: 手
  rationale: 保留第二分句的身体部位意象，使两句的反义平行清晰可见。
- source_word: חָרוּצִים
  choice: 勤劳人
  rationale: 复数形容词名词化，指以勤奋为特征的人；“勤劳人”简洁易懂，并与“懒散的手”形成鲜明对照。
- source_word: תַּעֲשִׁיר
  choice: 使人富足
  rationale: עשר 的使役式表示“使富有、使富足”；此译与上句“使人贫穷”结构对应，同时避免把含义不必要地限定为巨额财富。
