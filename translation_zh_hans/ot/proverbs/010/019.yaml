  text: When words are many[a], transgression does not cease[b], but whoever restrains his lips is prudent.
translation:
  language: zh_hans
  text: 言语多了，过犯就不会止息；约束自己嘴唇的，是明智的。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּרֹב דְּבָרִים
  choice: 话语一多
  rationale: בְּרֹב 表示数量众多时的情形，דְּבָרִים 在此指言语；译为“话语一多”自然地保留了希伯来语的条件性和箴言式警告。
- source_word: לֹא יֶחְדַּל
  choice: 就不会止息
  rationale: חדל 的基本义是“停止、止息”；否定式说明过犯不会停止，而非绝对断言每一句话本身都是过犯。
- source_word: פָּשַׁע
  choice: 过犯
  rationale: 该词可指悖逆、过犯或冒犯；“过犯”既保留其道德分量，也适合智慧文学的庄重语体。
- source_word: וְחֹשֵׂךְ
  choice: 约束……的
  rationale: חשׂך 在此意为抑制、扣住；第二分句与前句形成对照，因此用分号和语义上的转折表达，无须机械译出“和”。
- source_word: שְׂפָתָיו
  choice: 自己的嘴唇
  rationale: 保留希伯来文以“嘴唇”指言语行为的身体意象；“自己”自然表达原文第三人称单数所属关系及泛指用法。
- source_word: מַשְׂכִּיל
  choice: 才是明智人
  rationale: 该 Hiphil 分词表示有见识、行事审慎的人；“明智人”符合中文箴言体，“才”凸显两分句之间的对照，但不增添新的教义含义。
theological_decisions: []
translation_notes:
  register: 采用现代、凝练、庄重的箴言体。保留“嘴唇”的原文意象，并将阳性单数按希伯来箴言常见方式理解为泛指，不以性别限定其适用对象。
