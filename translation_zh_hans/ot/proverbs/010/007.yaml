  text: זֵ֣כֶר צַ֭דִּיק לִ/בְרָכָ֑ה וְ/שֵׁ֖ם רְשָׁעִ֣ים יִרְקָֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/007.yaml
  text: The memory of the righteous is a blessing[a], but the name of the wicked will rot.
translation:
  language: zh_hans
  text: 对义人的记念成为祝福[a]；恶人的名必朽烂。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“对义人的记念带来祝福。”原文直译为“对义人的记念是为祝福的”；也可能指人以祝福的话记念义人。
    reason: 原文 לִבְרָכָה（“为祝福”）的凝练表达可作“成为／带来祝福”理解，也容许“以祝福记念”的语用理解。
lexical_decisions:
- source_word: זֵכֶר
  choice: 名声
  rationale: 本词可指对某人的记念、留在人心中的印象或被人提说之事。此处与下句“名号”形成对应；“名声”在现代汉语中自然地表达身后被人记念的意义，同时避免把它仅理解为个人内心的记忆。
- source_word: צַדִּיק
  choice: 义人
  rationale: 形容词在此作名词使用，泛指行义的人；“义人”简洁庄重，也符合智慧文学的表达。
- source_word: לִבְרָכָה
  choice: 带来祝福
  rationale: 希伯来语直译为“为祝福”。“带来祝福”自然表达其结果或作用，但原文也可理解为“蒙祝福”或“成为祝福”，故以脚注保留歧义。
- source_word: שֵׁם
  choice: 名号
  rationale: 基本义是“名”。这里包含名声、声誉和身后名号等含义；译作“名号”既保留具体意象，也与上句“名声”相呼应。
- source_word: רְשָׁעִים
  choice: 恶人
  rationale: 复数形容词名词化，泛指作恶之人；汉语“恶人”可作集合性通称，无须机械标示复数。
- source_word: יִרְקָב
  choice: 必腐朽
  rationale: 该动词具体指腐烂、朽坏。“腐朽”保留鲜明的败坏意象，并适用于抽象的“名号”；“必”表达未完成式在箴言陈述中的确定结果。
theological_decisions:
- issue: לִבְרָכָה 所表达的是义人的名声本身成为祝福，还是其名声受到祝福
  choice: 正文译作“带来祝福”
  alternative: “蒙人祝福”或“成为祝福”
  rationale: 介词 לְ 构成的短语较为凝练，可表达“为祝福、成为祝福”，也可能指人在提到义人时祝福他。正文采用自然且开放的结果性表达，脚注保留主要替代读法，不限定具体祝福机制。
translation_notes:
  register: 采用现代、凝练而庄重的箴言体。分号突出两句对照；“名声／名号”和“祝福／腐朽”分别形成语义与意象上的平衡。
