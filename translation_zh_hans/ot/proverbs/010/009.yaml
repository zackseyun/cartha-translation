  text: הוֹלֵ֣ךְ בַּ֭/תֹּם יֵ֣לֶךְ בֶּ֑טַח וּ/מְעַקֵּ֥שׁ דְּ֝רָכָ֗י/ו יִוָּדֵֽעַ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/009.yaml
  text: Whoever walks in integrity walks securely[a], but he who makes his ways crooked will be found out.
translation:
  language: zh_hans
  text: 行事正直的，走得安稳；使自己道路弯曲的，必被识破。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“必被认出”或“必显露出来”。希伯来语既可指这人的本相被人认清，也可指他的行径被揭露。
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹלֵךְ
  choice: 行事……的
  rationale: 分词在箴言中泛指一类人，并表达惯常行为；“行事”既自然，又保留“行走”作为生活方式的隐喻。
- source_word: בַּתֹּם
  choice: 正直
  rationale: תֹּם表示完整、纯正、无可指摘的品格；“正直”在现代汉语中简明庄重，也不过度暗示绝对无罪。
- source_word: יֵלֶךְ
  choice: 走得
  rationale: 保留原文重复“行走”的表达和道路意象，同时与前面的“行事”形成自然的汉语句式。
- source_word: בֶּטַח
  choice: 安稳
  rationale: בֶּטַח侧重客观的安全稳妥，而不只是主观自信；“走得安稳”符合汉语习惯。
- source_word: וּמְעַקֵּשׁ
  choice: 使……弯曲的
  rationale: 该分词表示使之弯曲、扭曲或败坏；直译性的表达保留了与正直之路相反的道路图像。
- source_word: דְּרָכָיו
  choice: 自己的道路
  rationale: 保留复数道路所表达的人生行为方式；汉语以集合意义的“道路”即可自然承载原文复数含义。
- source_word: יִוָּדֵעַ
  choice: 必被识破
  rationale: ידע的尼法勒形可指“被知道、显露、被认出”；在对偶语境中，“被识破”自然表达其弯曲本相或行径终将显明，同时用脚注保留词义范围。
theological_decisions: []
