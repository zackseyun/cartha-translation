  yaml_path: translation/ot/proverbs/010/026.yaml
  text: Like vinegar to the teeth and smoke to the eyes[a], so is the sluggard to those who send him.
translation:
  language: zh_hans
  text: 醋刺激牙齿，烟熏眼睛；懒惰人对于差遣他的人，也是如此。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“酸酒刺激牙齿，烟熏眼睛；懒惰人对于差遣他的人，也是如此。”
    reason: 词语 חֹמֶץ 可指醋，也可理解为变酸的酒。
lexical_decisions:
- source_word: חֹמֶץ
  choice: 醋
  rationale: 该词指酸味液体，常指醋；在此与牙齿构成令人不适的感官比喻。“醋”是现代汉语最直接自然的对应词。
- source_word: לַשִּׁנַּיִם
  choice: 刺激牙齿
  rationale: 介词ל表示事物对牙齿产生的作用。汉语若直译为“对牙齿”不够完整，译作“刺激牙齿”自然地传达原文所暗示的不适感。
- source_word: עָשָׁן
  choice: 烟
  rationale: 直接对应原词，并保留烟使眼睛不适的具体意象。
- source_word: לָעֵינַיִם
  choice: 熏眼睛
  rationale: 介词ל表示烟对眼睛的作用；“熏眼睛”是自然的现代汉语表达，也保留原文的感官效果。
- source_word: כֵּן
  choice: 也是怎样
  rationale: 承接前面两个“怎样”的比喻，引出其在人际关系中的对应情形，保留原文简洁而未明说具体后果的表达。
- source_word: הֶעָצֵל
  choice: 懒惰人
  rationale: 该形容词名词化，指以懒惰为特征的人。“懒惰人”符合《箴言》中反复出现的人物类型，且为普通读者所理解。
- source_word: לְשֹׁלְחָיו
  choice: 对差遣他的人
  rationale: 分词复数形式带第三人称阳性单数后缀，意为“那些差遣他的人”。此译保留差遣者为复数集合、被差遣者为单数的关系，并符合现代汉语习惯。
theological_decisions: []
translation_notes:
  register: 采用自然、凝练、庄重的现代标准汉语。为使希伯来语省略的感官作用在汉语中完整可懂，分别用“刺激”和“熏”表达；结句不额外说明懒惰人如何令人烦恼，以保留原文比喻的含蓄张力。
