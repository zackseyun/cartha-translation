  text: פִּֽי צַ֭דִּיק יָנ֣וּב חָכְמָ֑ה וּ/לְשׁ֥וֹן תַּ֝הְפֻּכ֗וֹת תִּכָּרֵֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/031.yaml
  text: The mouth of the righteous bears wisdom as fruit[b][a], but the tongue of perversity will be cut off.
translation:
  language: zh_hans
  text: 义人的口结出智慧[a]，乖谬的舌头[b]必被割断。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“生出智慧”。希伯来文动词带有萌发或结果的意象。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“说乖谬话的舌头”。“乖谬”在希伯来文中为复数，可能强调反复说出扭曲颠倒的话。
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּי
  choice: 口
  rationale: 保留具体的身体意象，指言语的发出之处，并与下半句的“舌头”形成对应。
- source_word: צַדִּיק
  choice: 义人
  rationale: 希伯来文单数在此代表一类人；“义人”简洁保留其道德类别，也符合箴言的表达方式。
- source_word: יָנוּב
  choice: 结出
  rationale: 该动词含萌发、结果之意；“结出”保留有机生长和结果的比喻，比“产生”更贴近原文。
- source_word: חָכְמָה
  choice: 智慧
  rationale: 按原文保留抽象名词，不擅自扩展为“智慧的话”。
- source_word: לְשׁוֹן
  choice: 舌头
  rationale: 保留希伯来文以身体器官代指言语的表达，并与上半句的“口”构成反义平行。
- source_word: תַּהְפֻּכוֹת
  choice: 乖谬
  rationale: 该复数名词指扭曲、颠倒正道的事物或言语；正文用自然的汉语抽象名词“乖谬”，脚注说明其复数形式可能强调一再说出的歪曲言语。
- source_word: תִּכָּרֵת
  choice: 必被割断
  rationale: 保留尼法勒式的被动意义和“割断”的强烈意象，不把结果限定解释为仅仅“被制止”或“沉默”。
theological_decisions:
- issue: “被割断”所指惩罚的具体性质
  choice: 保留“必被割断”的具象而未限定的说法
  alternative: 必被制止／必被除掉
  rationale: 原文的 כרת 表达严厉的割断或剪除，却没有明确说明仅指言语被制止、舌头受罚，还是说话者被剪除；直译可保存这种张力。
translation_notes:
  register: 采用现代、庄重而简洁的箴言体。“结出智慧”保留原文的果实意象；“乖谬”是现代读者可理解的书面语，既表达道德上的扭曲，又不过度收窄为欺骗等单一罪行。所有脚注标记均置于其所解释的词语之后。
