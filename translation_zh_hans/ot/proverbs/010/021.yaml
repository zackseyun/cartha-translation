  text: The lips of the righteous feed many[b][a], but fools die for lack of sense.
translation:
  language: zh_hans
  text: '义人的嘴唇滋养许多人[a]；

    愚昧人因缺乏悟性[b]而死。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“牧养许多人”；这里的希伯来动词也可指放牧、牧养或喂养。
    reason: lexical_alternative
  - marker: b
    text: 直译“缺乏心”；希伯来语中的“心”常指理解力、判断力和辨别力。
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂפְתֵי
  choice: 嘴唇
  rationale: 保留希伯来文“嘴唇”的具体意象；这里以嘴唇代指言语，在现代汉语中仍可理解。
- source_word: צַדִּיק
  choice: 义人
  rationale: 该形容词在此作名词，泛指为人正直、公义的人；“义人”简洁，并符合《箴言》的智慧文学语域。
- source_word: יִרְעוּ
  choice: 喂养
  rationale: רעה的核心义包括放牧、牧养和喂养。以“嘴唇”为主语时，“喂养”既保留言语供应生命的比喻，也比“放牧”自然。
- source_word: רַבִּים
  choice: 许多人
  rationale: 明确表达复数实体所指的人群；汉语加入“人”可避免“许多”单独作宾语的不自然。
- source_word: אֱוִילִים
  choice: 愚昧人
  rationale: 这是智慧文学中指顽梗、缺乏道德判断的人，并非仅指智力不足；“愚昧人”能保留这一较宽含义。
- source_word: בַּחֲסַר לֵב
  choice: 因缺乏心智
  rationale: 原文直译近于“在缺少心之中”；希伯来语的“心”常涵盖理解力和判断力。“心智”自然传达这一习语，同时用脚注保留原文意象。
- source_word: יָמוּתוּ
  choice: 而死
  rationale: 按动词的直接词义译为“死”，不弱化为“败亡”或“陷入祸患”；汉语无须显明将来时即可表达箴言的一般真理。
