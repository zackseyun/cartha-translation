  text: תּוֹחֶ֣לֶת צַדִּיקִ֣ים שִׂמְחָ֑ה וְ/תִקְוַ֖ת רְשָׁעִ֣ים תֹּאבֵֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/028.yaml
  text: The expectation of the righteous is joy[a], but the hope of the wicked will perish.
translation:
  language: zh_hans
  text: 义人的期待带来喜乐[a]，恶人的指望却必破灭。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“盼望”；原文上、下两句使用两个意义相近但不同的名词。
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹחֶלֶת
  choice: 期待
  rationale: 该词表示怀着盼望的等候或期待。译作“期待”，既符合现代汉语，也与下半句的“指望”保留原文近义而不同词的平行变化。
- source_word: צַדִּיקִים
  choice: 义人
  rationale: 这是作名词用的复数形容词，指行义的人。“义人”简洁庄重，并与“恶人”形成箴言体的类别对照。
- source_word: שִׂמְחָה
  choice: 喜乐
  rationale: 该名词意为喜悦、欢乐。“喜乐”自然凝练，适合智慧文学语体。
- source_word: תִקְוַת
  choice: 指望
  rationale: 该词表示盼望或所期待之事。译作“指望”与“期待”意义相近但措辞有别，保留两个希伯来名词之间的词汇变化。
- source_word: רְשָׁעִים
  choice: 恶人
  rationale: 这是作名词用的复数形容词，指邪恶之人。“恶人”是现代中文圣经和智慧文学中简洁明了的表达，与“义人”相对。
- source_word: תֹּאבֵד
  choice: 必破灭
  rationale: 动词 אבד 可指灭亡、消失或归于无有；这里主语是“指望”。“破灭”是中文描述指望落空、归于无有的自然搭配，同时避免误解为本句直接说恶人本人灭亡。
theological_decisions:
- issue: 下半句中“破灭”的主语
  choice: 直接陈述恶人的指望必破灭
  alternative: 理解为也暗示恶人连同其指望一并败亡
  rationale: 阴性单数动词与 תִקְוַת（“指望”）一致，因此句法上明确是恶人的指望破灭。译文不把本句扩展为对恶人最终结局的完整教义性陈述。
- issue: 上半句中系词关系的含义
  choice: 译作“期待带来喜乐”
  alternative: 译作“期待就是喜乐”或“期待终成喜乐”
  rationale: 希伯来文是省略系词的名词句，可表达义人的期待以喜乐为结果或内容。中文采用“带来”使句意自然，但不具体限定喜乐实现的时间或方式。
translation_notes:
  register: 采用现代、庄重而简洁的箴言体。上、下句以“义人／恶人”和“期待／指望”形成对照；“却”凸显反义平行。“必破灭”自然表达指望归于无有，而不把动词错误地落在恶人本人身上。
