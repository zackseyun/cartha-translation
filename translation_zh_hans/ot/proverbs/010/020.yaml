  text: The tongue of the righteous is choice silver[a]; the heart of the wicked is of little worth.
translation:
  language: zh_hans
  text: 义人的舌头是上等的银子；恶人的心却价值甚微[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “价值甚微”也可译作“微不足道”或“几乎算不得什么”。希伯来原文十分简练，可指价值很小，也可带有近乎无有之意。
    reason: lexical_alternative
lexical_decisions:
- source_word: כֶּסֶף
  choice: 银子
  rationale: 保留希伯来文具体的贵金属意象；在现代汉语中“银子”既自然，也能表达价值。
- source_word: נִבְחָר
  choice: 上等的
  rationale: 此处表示精选、优质；“上等的银子”自然传达其品质和价值，不把分词机械译作“被拣选的”。
- source_word: לְשׁוֹן
  choice: 舌头
  rationale: 保留原文以身体部位转指言语的具体比喻，并与下句的“心”形成对应。
- source_word: צַדִּיק
  choice: 义人
  rationale: 该形容词作名词使用，泛指秉行正义的人；“义人”简洁而符合箴言体裁。
- source_word: לֵב
  choice: 心
  rationale: 保留希伯来文的人体意象；这里的“心”涵盖思想、意愿和道德内在生命。
- source_word: רְשָׁעִים
  choice: 恶人
  rationale: 复数形容词名词化，表示恶人这一类人；汉语可用“恶人”作集合性表达。
- source_word: כִּמְעָט
  choice: 价值甚微
  rationale: 结合上句银子的价值意象，将简略的希伯来语表达理解为价值很小；“甚微”保持箴言的凝练和庄重。
theological_decisions:
- issue: “恶人的心”所指的价值判断
  choice: 译作“价值甚微”，保持对其内在思想与品格的评价
  alternative: 译作“几乎没有”或“算不得什么”
  rationale: 原文 כִּמְעָט 极其简练，可表示少、微小或近乎无有；不将其扩展为某种特定教义判断。
translation_notes:
  register: 采用现代、凝练而庄重的箴言体。保留“舌头—心”和“银子—价值”的平行对照；以“却”明确反衬关系，但不增加原文没有的因果说明。
