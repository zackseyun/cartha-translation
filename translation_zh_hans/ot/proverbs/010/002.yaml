  text: לֹא י֭וֹעִילוּ אוֹצְר֣וֹת רֶ֑שַׁע וּ֝/צְדָקָ֗ה תַּצִּ֥יל מִ/מָּֽוֶת־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/002.yaml
  text: Treasures of wickedness do not profit[b][a], but righteousness delivers from death.
translation:
  language: zh_hans
  text: '不义之财毫无益处，

    正义却能救人脱离死亡。[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “正义”也可译作“公义”或“正直”。
    reason: lexical_alternative
lexical_decisions:
- source_word: י֭וֹעִילוּ
  choice: 毫无益处
  rationale: 该词为יעל的使役式，表示带来效用或益处；“毫无益处”简洁自然，也保留箴言的断言力度。
- source_word: אוֹצְר֣וֹת רֶ֑שַׁע
  choice: 不义之财
  rationale: 原文直译为“不义的财宝”。此处很可能指以恶行取得或带有不义性质的财富；“不义之财”符合现代汉语习惯，同时不把领属关系过度限定为某一种解释。
- source_word: וּ֝/צְדָקָ֗ה
  choice: 正义却
  rationale: צְדָקָה可指正义、公义或正直的行为；本节与“不义”形成鲜明对照，“正义”自然贴切。连接词ו在反义平行中取转折义，译作“却”。
- source_word: תַּצִּ֥יל
  choice: 能救人脱离
  rationale: נצל的使役式意为搭救、解救；补出泛指宾语“人”使汉语完整自然，但不限定获救者身份。
- source_word: מִ/מָּֽוֶת
  choice: 死亡
  rationale: 介词מן表示“脱离”，מָוֶת直指死亡；保留其可能涵盖实际死亡和致命危险的广度。
theological_decisions:
- issue: צְדָקָה的译法
  choice: 正义
  alternative: 公义；正直
  rationale: 这里的反义平行以“不义之财”对比צְדָקָה。“正义”既可表达符合正道的品格与行为，又与前半句自然呼应；不把经文缩窄为司法意义，也不额外引入宗派性含义。
- issue: “救人脱离死亡”的范围
  choice: 保留宽泛表述
  alternative: 救人免于致命危险；使人不死
  rationale: 原文没有说明这是今生脱险、延年益寿，还是更广泛的死亡主题；正文不替作者消解这种张力。
translation_notes:
  register: 采用简洁、对称的现代汉语箴言体。首句“不义之财”保留希伯来语构造的语义开放性；次句补出泛指的“人”，使中文通顺。
