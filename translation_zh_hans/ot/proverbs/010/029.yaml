base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/029.yaml
  text: The way of Yahweh is a stronghold for the blameless[b][a], but destruction for those who do evil.
translation:
  language: zh_hans
  text: 雅威的道路[a]，对纯全的人是坚固堡垒，对作恶的人却是毁灭[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威的道路”也可理解为“雅威行事的方式”或“雅威为人所定的道路”；希伯来语可能同时包含这两层意思。
    reason: lexical_alternative
  - marker: b
    text: “毁灭”也可译作“败亡”或“惊恐”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מָעוֹז
  choice: 坚固堡垒
  rationale: 该词指可供保护的堡垒或力量来源。“坚固堡垒”保留具体的防护意象，也与后半句形成鲜明对照。
- source_word: לַתֹּם
  choice: 对纯全的人
  rationale: תֹּם表示完整、正直、无可指摘的品格。结合后半句“作恶的人”的人物对比，译作“纯全的人”既保留伦理含义，也避免把它仅仅抽象化为“纯全”。
- source_word: דֶּרֶךְ יְהוָה
  choice: 雅威的道路
  rationale: 直译这一属格结构，以保留其可能兼指雅威行事的方式和他为人所设定的道路这一语义宽度。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以“雅威”音译四字神名，表明原文使用的是以色列上帝的专名，而非一般称号。
- source_word: וּמְחִתָּה
  choice: 却是毁灭
  rationale: מְחִתָּה可指毁灭、败亡或惊恐；“毁灭”最能与“坚固堡垒”形成对照。连接词按箴言中的反义平行译为“却”。
- source_word: לְפֹעֲלֵי אָוֶן
  choice: 对作恶的人
  rationale: 该短语直指从事邪恶、祸害之事的人。“作恶的人”是清楚自然的现代汉语，并保留分词的行动意味。
- source_word: אָוֶן
  choice: 恶
  rationale: 此词可指邪恶、罪孽、祸害；在与“纯全”相对的伦理语境中，“恶”准确而通俗。
theological_decisions:
- issue: “雅威的道路”的语义范围
  choice: 保留“雅威的道路”这一宽泛表达，不限定为雅威自己的行事方式或他命人行走的道路。
  alternative: 明确译为“雅威行事的方式”或“雅威所吩咐的道路”。
  rationale: 希伯来语属格结构可容纳两种理解，箴言也可能有意利用这种复义；直译可避免加入原文未明确规定的神学解释。
- issue: 前后两个介词短语与谓语名词的关系
  choice: 用“对……是……”呈现同一个“雅威的道路”对两类人的不同意义或结果。
  alternative: 译成“保护纯全的人，却毁灭作恶的人”，把名词性表述改为主动行为。
  rationale: 原文两处 לְ 与名词性谓语构成严整对照；保留“对……是……”可避免额外判定道路如何产生保护或毁灭。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“纯全的人”保留智慧文学中的品格概念；“坚固堡垒”维持原文的具体比喻。句式以两个“对……”形成平衡的反义平行。
