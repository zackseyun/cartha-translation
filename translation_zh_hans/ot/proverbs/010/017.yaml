  text: Whoever keeps discipline is on the path to life[a], but whoever forsakes reproof leads others astray.
translation:
  language: zh_hans
  text: 谨守管教的人，走在通往生命的路上[a]；离弃责备的人，却使人迷失。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“谨守管教的人，是走在生命之路上的人。”希伯来文十分简练，“生命之路”可作谓语性表达。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹרַח
  choice: 路
  rationale: 指道路，也可比喻人的生活与道德方向；“路”在现代汉语中自然凝练，并保留原文意象。
- source_word: לְחַיִּים
  choice: 通往生命
  rationale: לְ在此可表示方向或结果；“通往生命”清楚传达朝向生命的含义，同时保留脚注所述的简约谓语读法。
- source_word: שׁוֹמֵר
  choice: 谨守
  rationale: 该分词有守护、遵行之意；“谨守”体现持续认真地接受并遵行管教。
- source_word: מוּסָר
  choice: 管教
  rationale: 在《箴言》中兼有教导、训练和纠正的意味；“管教”能较简洁地涵盖其塑造性与纠正性。
- source_word: וְעוֹזֵב
  choice: 却离弃
  rationale: וְ在对偶中表达转折；עזב意为离开、抛弃，“离弃”保留其道德分量。
- source_word: תּוֹכַחַת
  choice: 责备
  rationale: 指指出错误的劝诫或纠正；“责备”是普通现代读者熟悉且符合智慧文学语境的表达。
- source_word: מַתְעֶה
  choice: 使人走迷
  rationale: 这是תעה的使役分词，重点不是自己迷失，而是使未明说的对象偏离正路；“使人走迷”保留使役语义和道路意象。
