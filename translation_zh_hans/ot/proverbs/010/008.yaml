  text: A wise-hearted man accepts commands[a], but a foolish man of lips will come to ruin.
translation:
  language: zh_hans
  text: 心中有智慧的人领受命令，言语愚妄的人却必败亡[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“必被倾覆”。末尾这个希伯来语动词很少见，可能表示被打倒、倾覆，或走向败亡。“言语愚妄的人”较字面可译为“嘴唇的愚人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲכַם לֵב
  choice: 心中有智慧的人
  rationale: 直译为“心里有智慧的”。希伯来语的“心”包含思想、判断和意志；此译保留原文意象，同时符合现代汉语表达。
- source_word: יִקַּח
  choice: 领受
  rationale: 该动词本义为“拿、取”，与“命令”搭配时表示接受并愿意遵从；“领受”既保留接受之意，也避免理解为实际拿取。
- source_word: מִצְוֺת
  choice: 命令
  rationale: 该复数名词指具有权威性的吩咐或指令。“命令”保留其约束力，不弱化为一般性的“劝告”。
- source_word: אֱוִיל
  choice: 愚妄的人
  rationale: 该词不仅指缺乏才智，也含道德和行为上的愚昧；“愚妄”符合《箴言》的智慧文学语境。
- source_word: שְׂפָתַיִם
  choice: 嘴唇愚妄
  rationale: 原文直译近于“嘴唇的愚妄人”，以“嘴唇”刻画其言语。此译保留原文具体意象，而不扩译为“多嘴”或“夸口”。
- source_word: יִלָּבֵט
  choice: 必败亡
  rationale: 这是罕见且含义不完全确定的尼法勒式动词，语境中表示被打倒、倾覆或走向毁灭。“必败亡”在现代汉语中自然，并传达其结果；较字面的译法列入脚注。
