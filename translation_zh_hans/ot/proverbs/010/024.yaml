  text: מְגוֹרַ֣ת רָ֭שָׁע הִ֣יא תְבוֹאֶ֑/נּוּ וְ/תַאֲוַ֖ת צַדִּיקִ֣ים יִתֵּֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/024.yaml
  text: What the wicked dreads will come upon him[b][a], but the desire of the righteous will be granted.
translation:
  language: zh_hans
  text: 恶人所惧怕的，必临到他[a]；义人的愿望，必蒙成全[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“恶人的恐惧，必临到他。”原词既可指恐惧本身，也可指所惧怕的事。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译为“他必赐予”，但没有说明“他”是谁；正文没有指明施予者。
    reason: alternative_reading
lexical_decisions:
- source_word: מְגוֹרַת
  choice: 所惧怕的
  rationale: 该名词可指“恐惧”，也可指“所惧怕的事”。结合后文“临到他”，译为“所惧怕的”更符合现代汉语，也保留所怕之事最终发生的含义。
- source_word: רָשָׁע
  choice: 恶人
  rationale: 希伯来语单数形容词在此作名词，具有箴言中代表一类人的泛指作用；“恶人”简洁自然，不额外突出性别。
- source_word: הִיא תְבוֹאֶנּוּ
  choice: 必临到他
  rationale: 阴性代词回指מְגוֹרַת，בוא加代词后缀表示所惧怕的事来到或临到那人。“临到他”准确而庄重。
- source_word: וְתַאֲוַת
  choice: ；……愿望
  rationale: תאוה在此指愿望、心愿。连接词字面为“和”，但上下两句构成鲜明反义平行，汉语用分号即可自然呈现转折对照，无须增添“但是”。
- source_word: צַדִּיקִים
  choice: 义人
  rationale: 原文为复数的名词化形容词，泛指义人这一类人；现代汉语“义人”可自然表达集合性。
- source_word: יִתֵּן
  choice: 必蒙成全
  rationale: 该动词字面为“他必赐予”，但主语没有明说。“必蒙成全”用承受式表达愿望得到实现，不擅自指明施予者，并保持箴言的凝练。
theological_decisions:
- issue: יִתֵּן的隐含主语
  choice: 用“必蒙成全”保留施予者未明说的状态
  alternative: 译作“上帝必成全”，明确以上帝为主语；或译作“他必赐予”，形式上保留第三人称单数
  rationale: 原文没有明确说出主语。智慧文学语境可能暗示上帝的作为，但正文若直接补出“上帝”，会消除原文保留的含混；采用承受式表达既传达结果，也不预先解决神学张力。
translation_notes:
  register: 采用现代、凝练而庄重的箴言体。“所惧怕的……必临到他”与“愿望……必蒙成全”形成清晰的反义平行；不增添原文未明说的神圣主语。
