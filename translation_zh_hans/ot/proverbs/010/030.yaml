base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/030.yaml
  text: The righteous will never be shaken[a], but the wicked will not dwell in the land.
translation:
  language: zh_hans
  text: 义人永不动摇；恶人却不能在地上安居[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “地上”也可译作“土地上”。希伯来语אֶרֶץ既可指某一片土地，也可泛指大地。
    reason: lexical_alternative
lexical_decisions:
- source_word: צַדִּיק
  choice: 义人
  rationale: 单数形容词在此作名词，泛指义人这一类；“义人”简洁自然，并保留箴言的概括性。
- source_word: לְעוֹלָם בַּל
  choice: 永不
  rationale: לְעוֹלָם 与诗歌否定词 בַּל 连用，表达持续而彻底的否定；“永不”自然传达这一语气。
- source_word: יִמּוֹט
  choice: 动摇
  rationale: מוט 的尼法勒词干表示被移动、摇动或失去稳固；“动摇”保留稳定性的比喻，不强化为“倾覆”或“灭亡”。
- source_word: רְשָׁעִים
  choice: 恶人
  rationale: 复数形容词作名词，泛指邪恶之人；汉语“恶人”能自然表达其类别意义。
- source_word: יִשְׁכְּנוּ
  choice: 安居
  rationale: שכן 指居住、定居；“安居”突出稳定居留的含义，并与上句的稳固意象相呼应。
- source_word: אֶרֶץ
  choice: 这地
  rationale: אֶרֶץ 可指特定的土地，也可泛指大地；正文采用“这地”，保留土地与居留的具体关联，较宽泛的译法列入脚注。
theological_decisions:
- issue: אֶרֶץ 的范围
  choice: 这地
  alternative: 大地
  rationale: 经文可指人所居住的特定土地，也可泛指全地。正文保留土地和定居的关联，但以脚注明确较广的可能含义，不将其限定为某一特定神学解释。
translation_notes:
  register: 采用简洁、对称的箴言体。“永不动摇”与“不能……安居”形成稳固与失去居所的鲜明对照；用现代常用词表达，同时保持庄重。
