base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/010.yaml
  text: Whoever winks the eye causes grief[a], and a fool of lips will come to ruin.
translation:
  language: zh_hans
  text: 挤眼示意的人，带来忧伤；嘴上愚妄的人，必归于败亡。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “嘴上愚妄的人”原文直译近于“嘴唇的愚人”；“必归于败亡”所译的希伯来词较罕见，也可理解为“必倾覆”或“必跌倒”。
    reason: 说明第二分句中“嘴唇的愚人”这一特殊希伯来语表达，并保留罕见动词יִלָּבֵט的词义不确定性。
lexical_decisions:
- source_word: קֹרֵץ עַיִן
  choice: 挤眼示意的
  rationale: 分词在此作名词用，泛指以挤眼传递暗示的人。“挤眼示意”既保留眼部动作，也比单说“眨眼”更能表达有意传递信号，但不擅自补入“恶意”或“诡诈”。
- source_word: יִתֵּן עַצָּבֶת
  choice: 给人带来忧伤
  rationale: נתן本义为“给”，与עַצָּבֶת连用时表达造成或带来痛苦、忧伤。“给人带来”在现代汉语中自然，也保留其使他人受伤害的关系性含义。
- source_word: וֶאֱוִיל שְׂפָתַיִם
  choice: 嘴上愚妄的人
  rationale: 原文直译近于“嘴唇的愚人”，指言语显出愚妄的人。“嘴上愚妄的人”保留“嘴唇/言语”这一意象，又较符合现代汉语表达。
- source_word: יִלָּבֵט
  choice: 必败亡
  rationale: 该词罕见且含义不完全确定；在本节及箴言10:8的语境中，表达跌倒、倾覆或归于败坏的结局。“败亡”保留结果性，又不限定具体的倒下方式。
theological_decisions:
- issue: 两分句之间的逻辑关系
  choice: 用分号并列，不强化为转折
  alternative: 译作“但嘴上愚妄的人……”
  rationale: 马所拉文本以连接词ו连接，两句的确切修辞关系并不完全明朗。中文用分号可保留并列和对照的可能，避免额外确定为强转折。
translation_notes:
  register: 采用现代、庄重而易懂的箴言体。前后两句结构简洁对应；不把挤眼的动作明确解释为恶意欺骗，并以脚注保留第二句的字面形式和词义难点。
