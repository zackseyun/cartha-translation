base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/025.yaml
  text: When the storm passes[a], the wicked are no more[b], but the righteous are an everlasting foundation.
translation:
  language: zh_hans
  text: 暴风一过[a]，恶人便不复存在[b]；义人却是永恒的根基。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“旋风一过”，也可译：“暴风经过时”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译：“就没有恶人了。”这里可指恶人消失或灭亡。
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּעֲבוֹר
  choice: 一过
  rationale: 介词 כְּ 与动词 עבר 的不定式组合在此表达时间关系，也可能略带比较意味。“一过”简洁自然地呈现风暴经过之后的情景，并保留箴言紧凑的节奏。
- source_word: סוּפָה
  choice: 暴风
  rationale: 该词指猛烈的风暴、旋风或暴风雨。“暴风”在现代汉语中清楚自然，也能传达其突然而具破坏力的意象。
- source_word: וְאֵין
  choice: 便不复存在
  rationale: 原文直译近于“就没有……”。这里描述风暴过后恶人消失或灭亡的结果；“不复存在”比生硬的“没有恶人”更符合汉语，同时以脚注保留字面表达。
- source_word: רָשָׁע
  choice: 恶人
  rationale: 原文为阳性单数，但在箴言中代表一类人。“恶人”在汉语中既可作类别称谓，又不必额外标明男性。
- source_word: וְצַדִּיק
  choice: 义人却
  rationale: וְ 在对称结构中具有转折作用，因此译作“却”。“义人”保留智慧文学中与“恶人”相对的类别称谓。
- source_word: יְסוֹד
  choice: 根基
  rationale: 该词意为建筑物的基础或根基。译作“根基”直接保留原文比喻，不额外补入“坚固”等解释性成分。
- source_word: עוֹלָם
  choice: 永恒的
  rationale: 该词在这里修饰“根基”，强调长久、持续不变。“永恒的根基”保留原文强烈的持久意味，同时是庄重自然的现代汉语。
theological_decisions:
- issue: 智慧文学中阳性单数的代表性用法
  choice: 将 רָשָׁע 和 צַדִּיק 分别译为类别称谓“恶人”和“义人”
  alternative: 译为“一个恶人”和“一个义人”，或明确译作“恶男子”和“义男子”
  rationale: 原文的阳性单数在箴言中表达普遍类别，并非将这条格言限定于男性。汉语的“恶人”“义人”既保留单数形式的凝练感，也自然涵盖所指类别。
- issue: “义人是永恒的根基”的比喻张力
  choice: 直接保留“义人却是永恒的根基”
  alternative: 解释为“义人永远稳固”或“义人有永固的根基”
  rationale: 原文明确将义人称为“根基”，而不是说义人拥有根基。直译保留这一可能表示稳固、持久或支撑作用的开放性比喻，避免替原文消解其神学与诗性张力。
translation_notes:
  register: 采用简洁、对称、庄重的现代标准汉语，保持箴言式节奏。“暴风一过……；义人却……”突出两者的鲜明对照；不添加原文没有的因果说明，也不把“根基”的比喻改写成单一解释。
