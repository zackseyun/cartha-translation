  text: מְק֣וֹר חַ֭יִּים פִּ֣י צַדִּ֑יק וּ/פִ֥י רְ֝שָׁעִ֗ים יְכַסֶּ֥ה חָמָֽס׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/011.yaml
  text: The mouth of the righteous is a fountain of life[a], but the mouth of the wicked conceals violence.
translation:
  language: zh_hans
  text: '义人的口是生命的泉源，

    恶人的口却遮盖暴行。[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “遮盖暴行”也可理解为“隐藏暴力”。原文动词可指实际的覆盖，也可指比喻性的掩藏。
    reason: lexical_alternative
lexical_decisions:
- source_word: מְקוֹר
  choice: 泉源
  rationale: 该词指涌流之水的泉或源头。“泉源”既保留具体的水泉意象，也自然表达使人得生命的言语源源流出。
- source_word: חַיִּים
  choice: 生命
  rationale: 此处复数形式通常表达抽象的单数概念，译作“生命”符合现代汉语习惯。
- source_word: פִּי צַדִּיק
  choice: 义人的口
  rationale: 直译并保留“口”的具体意象；צַדִּיק为代表性单数，“义人”不额外限定性别。
- source_word: וּפִי רְשָׁעִים
  choice: 恶人的口却
  rationale: 连接词字面为“和”，但平行句构成鲜明对比，因此用“却”。רְשָׁעִים虽为复数，原文的“口”却为单数，可理解为群体性表达；汉语“恶人的口”自然且保留这一形式。
- source_word: יְכַסֶּה
  choice: 遮盖
  rationale: 基本义为“覆盖、遮盖”，也可引申为“隐藏”。正文采用较为形式对应的“遮盖”，保留它究竟表示掩藏暴行，还是具有其他覆盖关系的语义张力。
- source_word: חָמָס
  choice: 暴行
  rationale: 该词可指暴力、残暴行为或暴虐不义。“暴行”在此简洁自然，也可与“遮盖”形成合乎汉语的搭配。
theological_decisions: []
translation_notes:
  register: 采用现代、凝练而庄重的箴言体。两行对举，保留“口”和“泉源”的具体意象；不把“口”抽象改译为“言语”。正文选择“遮盖”以贴近原文并保留歧义，脚注说明可能的引申义。
