  text: בִּרְכַּ֣ת יְ֭הוָה הִ֣יא תַעֲשִׁ֑יר וְ/לֹֽא יוֹסִ֖ף עֶ֣צֶב עִמָּֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/022.yaml
  text: The blessing of the LORD makes rich, and he adds no sorrow with it.
translation:
  language: zh_hans
  text: 耶和华所赐的福使人富足，并不加添忧愁。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּרְכַּת יְהוָה
  choice: 耶和华所赐的福
  rationale: “耶和华的福”虽更贴近形式，但现代汉语容易被理解为耶和华所享有的福；加入“所赐”自然表达这一属格结构在语境中的施予含义。
- source_word: תַעֲשִׁיר
  choice: 使人富足
  rationale: 希斐使役式表示“使富有、使富足”；“富足”既可包含物质丰裕，也不必将意义收窄为金钱。
- source_word: עֶצֶב
  choice: 忧愁
  rationale: 该词在此通常指伴随财富而来的痛苦、愁苦或劳苦；“忧愁”简洁自然，也与本句所述福分形成鲜明对照。
- source_word: וְלֹא יוֹסִף ... עִמָּהּ
  choice: 并不加添……
  rationale: 保留“加添”的基本意象；根据阴性代词“与她/它同在”，所指自然回接阴性的“福”，汉语无需重复宾语。
theological_decisions:
- issue: יוֹסִף 的主语
  choice: 采用无显式主语的“并不加添忧愁”
  alternative: “他并不随之加添忧愁”或“劳苦并不能给它增添什么”
  rationale: 希伯来语动词为第三人称阳性单数，可能以上帝为隐含主语；但句法和古代译本传统也容许其他理解。汉语省略主语可自然传达“这福不伴随忧愁”，同时避免把存在争议的主语解释写死。
- issue: 财富与福分的关系
  choice: 直译为“使人富足”
  alternative: 将其泛化为“使人兴盛”
  rationale: 经文确实使用“使富有”的词，不宜因神学顾虑淡化；同时选“富足”而非专指金钱的“发财”，避免把箴言绝对化为财富应许。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准普通话。句式保留箴言的凝练和平行感；不加脚注，因为正文可在不生硬的前提下保留原文关于第二分句主语的开放性。
