  text: יִרְאַ֣ת יְ֭הוָה תּוֹסִ֣יף יָמִ֑ים וּ/שְׁנ֖וֹת רְשָׁעִ֣ים תִּקְצֹֽרְנָה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/027.yaml
  text: The fear of Yahweh adds days[a], but the years of the wicked will be cut short.
translation:
  language: zh_hans
  text: 敬畏耶和华使人的日子增多[a]，恶人的年岁却必缩短。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“延长人的日子。”原文动词直译为“增加”，宾语是“日子”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְאַת
  choice: 敬畏
  rationale: 该词为יִרְאָה的构造形，与神名连用；“敬畏”既保留“惧怕”的分量，也表达智慧文学中对神尊崇、顺服的态度，是现代汉语圣经语境中自然而庄重的对应。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代简体中文读者熟悉的专名“耶和华”对应四字神名，保留其作为以色列之神专名的性质，而不改译为称号“主”。
- source_word: תּוֹסִיף
  choice: 使……增多
  rationale: Hiphil形式表达使之增加；原文以“日子”为宾语。“使人的日子增多”保留“增加”的具体意象，同时使汉语语义完整自然。
- source_word: יָמִים
  choice: 人的日子
  rationale: 原文直译为“日子”，语境所指是寿数。补出隐含的领属成分“人的”，避免汉语误解，同时保留与下句“年岁”的诗性平行。
- source_word: וּ/שְׁנוֹת
  choice: ……年岁却
  rationale: וְ字面为“和”，但两分句构成鲜明反义平行；用“却”自然表达其语境中的转折作用。
- source_word: רְשָׁעִים
  choice: 恶人
  rationale: 智慧文学中常指行恶、悖逆正道的人；“恶人”简洁、庄重，并保留原文复数类别性的概括意义。
- source_word: תִּקְצֹרְנָה
  choice: 必缩短
  rationale: 该阴性复数动词与“年岁”一致，意为变短或被缩短。“必缩短”在汉语中简洁地呈现原文陈述的结果，又不额外指定施事者。
theological_decisions:
- issue: 关于长寿与短命的陈述性质
  choice: 按原文直接陈述为智慧原则，不在正文中添加限制语
  alternative: 将其明说为对每个敬畏神者和恶人都毫无例外的绝对保证
  rationale: 原文采用箴言式概括，正文应保留其鲜明断言；但不额外加入“往往”等词削弱语气，也不把智慧原则系统化为排除一切例外的机械保证。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“敬畏耶和华”保留智慧文学的核心表达；两句以“日子增多／年岁缩短”形成紧凑的反义平行。正文中的[a]与脚注对应。
