base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/014.yaml
  text: Wise men store up knowledge[c][b][a], but the mouth of a fool is near ruin.
translation:
  language: zh_hans
  text: 智慧人积存知识[a]；愚昧人的口却[b]临近毁灭。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “积存”也可译作“珍藏”或“隐藏”，这里强调谨慎保存知识。
    reason: lexical_alternative
  - marker: b
    text: “却”原文也可译作“而”或“和”；上下文的对照关系支持译作“却”。
    reason: lexical_alternative
  - marker: c
    text: 原文为省略系词的短句，直按其句法可理解为“愚昧人的口临近毁灭”；也可按上下文理解为愚昧人的口招致或使毁灭临近。“毁灭”还可译作“灾祸”；该词在其他语境中也可含“惊恐”或“惶恐”之意。
    reason: ambiguity
lexical_decisions:
- source_word: חֲכָמִים
  choice: 智慧人
  rationale: 该阳性复数在箴言中作名词使用，泛指有智慧的人；“智慧人”简洁庄重，并保留箴言体的类别对照。
- source_word: יִצְפְּנוּ
  choice: 积存
  rationale: צפן可指隐藏、储藏或珍藏；此处表达审慎地保存并累积知识，“积存”保留储藏意象，且符合现代汉语。
- source_word: דָעַת
  choice: 知识
  rationale: דעת在箴言中通常指由智慧与教诲所得的知识；“知识”既直接又不额外缩窄为理解力或辨别力。
- source_word: וּפִי
  choice: ……的口却
  rationale: ו本可译作“和”，但两分句以智慧人与愚昧人形成鲜明对照，因此正文用“却”自然表达其转折功能，同时在脚注保留并列读法。
- source_word: אֱוִיל
  choice: 愚昧人
  rationale: 该词在智慧文学中指在道德与判断上顽愚的人；“愚昧人”比单纯表示智力不足的措辞更贴合其箴言语境。
- source_word: מְחִתָּה
  choice: 毁灭
  rationale: 该名词可表示毁灭、灾祸，也可表示惊恐；此处与“临近”连用，更可能指迫近的毁灭，但脚注保留其他语义可能。
- source_word: קְרֹבָה
  choice: 临近
  rationale: 谓语形容词表示“近”；译作“临近”保留迫近的空间性比喻，而不把时间或因果关系解释得过满。
theological_decisions:
- issue: 愚昧人的口与毁灭之间的句法关系
  choice: 使毁灭临近
  alternative: 愚昧人的口临近毁灭
  rationale: 希伯来语字面次序为“愚昧人的口——毁灭临近”，未明示动词和确切关系。结合箴言中言语招致灾祸的常见对照，正文采用使动理解，但以脚注保留状态性读法，避免消除原文张力。
translation_notes:
  register: 采用简洁、对称的现代箴言体。“智慧人／愚昧人”形成清晰类别对照；“积存知识／使毁灭临近”保留原文储藏与迫近的意象。所有重要词义及句法歧义均以脚注呈现。
