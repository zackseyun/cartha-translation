base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/006.yaml
  text: Blessings are on the head of the righteous, but the mouth of the wicked covers violence.
translation:
  language: zh_hans
  text: 福分临到义人的头上，恶人的口却遮盖暴行。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本句后半也可译作：“暴行却遮住恶人的口。”
    reason: 原文词序及诗歌表达存在句法和意象上的歧义；另一译法也有古译本及平行句理解上的支持。
lexical_decisions:
- source_word: בְּרָכוֹת
  choice: 福分
  rationale: 复数名词，指多方面的祝福或福惠；“福分”自然庄重，也保留其概括性。
- source_word: לְרֹאשׁ
  choice: 临到……的头上
  rationale: 直译为“在/归于……头上”；此处表达福分加在义人身上，以“临到……的头上”保留原有身体意象。
- source_word: צַדִּיק
  choice: 义人
  rationale: 智慧文学中的常用伦理称谓，指行事正直、符合公义的人。
- source_word: וּפִי רְשָׁעִים
  choice: 恶人的口
  rationale: 原文“恶人”为复数而“口”为单数，属于集合性表达；汉语用“恶人的口”自然，并保留群体概念。
- source_word: יְכַסֶּה
  choice: 遮盖
  rationale: 基本义为覆盖、遮盖。这里不擅自确定是“隐瞒”暴行，还是暴行“淹没”恶人的口，保留原文的语义张力。
- source_word: חָמָס
  choice: 暴行
  rationale: 可指暴力、残暴或由暴力造成的不法；“暴行”兼顾行为性与道德谴责。
theological_decisions:
- issue: 后半句的主客关系及含义
  choice: 恶人的口却遮盖暴行
  alternative: 暴行却遮住恶人的口
  rationale: 马所拉文本的词序和动词形式可自然理解为“恶人的口”作主语、“暴行”作宾语，但此句也可能与第11节相似，容许“暴行遮住恶人的口”的理解。正文依照较直接的句法，脚注保留另一可能。
translation_notes:
  register: 采用现代、庄重而易懂的智慧文学语体。“福分临到……头上”保留希伯来文具体意象；后半句避免用“隐藏”提前消解“遮盖”的多义性。
