  text: לֹֽא יַרְעִ֣יב יְ֭הוָה נֶ֣פֶשׁ צַדִּ֑יק וְ/הַוַּ֖ת רְשָׁעִ֣ים יֶהְדֹּֽף־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/003.yaml
  text: Yahweh will not let the righteous person go hungry[a], but he drives away the craving of the wicked.
translation:
  language: zh_hans
  text: 雅威不让义人挨饿，却挫败恶人的欲望[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “恶人的欲望”或译“恶人的灾祸（或毁灭）”。这里的希伯来词既可理解为“欲望”，也可理解为“灾祸、毁灭”。
    reason: 保留הַוַּת在本节中的词义歧义。
lexical_decisions:
- source_word: לֹא יַרְעִיב
  choice: 不让……挨饿
  rationale: יַרְעִיב是רעב的使役形，表示“使……饥饿”。“不让……挨饿”在现代汉语中自然地传达其使役含义，又不夸大为“饿死”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语中常见的音译直接呈现四字神名，不用称号替代专名。
- source_word: נֶפֶשׁ צַדִּיק
  choice: 义人
  rationale: נֶפֶשׁ在这里指完整的活人，而非专指与身体相分离的“灵魂”。汉语“义人挨饿”已自然包含“义人本人”的意思，无须生硬地译出“性命”。
- source_word: הַוַּת רְשָׁעִים
  choice: 恶人的欲望
  rationale: 此处名词可指欲望，也可能指灾祸或毁灭。正文采用“欲望”，使之与上半句的饥饿形成关于需求和渴望的对照；另一种理解收入脚注。
- source_word: יֶהְדֹּף
  choice: 驱散
  rationale: 原动词有推开、击退之意。“驱散”保留排斥、除去的意象，同时能与汉语中的“欲望”自然搭配。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用以色列上帝的专名；正文以“雅威”音译该名，不以“主”等称号代替。
- issue: נֶפֶשׁ所表达的人观
  choice: 按完整的人译作“义人”
  alternative: 义人的灵魂／义人的性命
  rationale: 本节关注义人本人是否挨饿，并未明确区分灵魂与身体；译作“义人”避免加入原文没有说明的人论框架。
- issue: הַוַּת的多义性
  choice: 欲望
  alternative: 灾祸／毁灭
  rationale: “欲望”与上句的饥饿形成较顺畅的反义平行，但“灾祸、毁灭”在词义上确有依据，因此以脚注保留，不把歧义静默消除。
translation_notes:
  register: 采用简洁、庄重而通俗的现代标准汉语，保持箴言上下两句的鲜明对照。“挨饿”自然易懂；“驱散”既保留原动词的排斥意象，也避免过度口语化。
