  rationale: 将“驱散”改为“挫败”，使汉语搭配更自然，并更准确表达“推开、击退”恶人欲求的结果，而不暗示雅威消除了他们的内在欲望。脚注删去“临到”，避免为原文未明确的属格关系定向。
