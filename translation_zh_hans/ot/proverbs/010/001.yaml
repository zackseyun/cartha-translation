  yaml_path: translation/ot/proverbs/010/001.yaml
  text: 'The proverbs of Solomon: a wise son makes a father glad[a], but a foolish son is the grief of his mother.'
translation:
  language: zh_hans
  text: '所罗门的箴言：


    有智慧的儿子使父亲喜乐，

    愚昧的儿子是他母亲的忧愁。'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִשְׁלֵי
  choice: 箴言
  rationale: 这是מָשָׁל的复数构造形式，在此引出一组智慧格言；“箴言”既符合本书传统名称，也准确表达劝诫性智慧言论。
- source_word: שְׁלֹמֹה
  choice: 所罗门
  rationale: 采用现代中文圣经与通行译名。
- source_word: בֵּן
  choice: 儿子
  rationale: 希伯来文为明确的阳性单数，故不泛化为“孩子”。
- source_word: חָכָם
  choice: 智慧的
  rationale: 在箴言语境中指道德与生活实践上的智慧，与כְּסִיל形成对照；“智慧的”自然且准确。
- source_word: יְשַׂמַּח
  choice: 使……喜乐
  rationale: 使役词形表达“使人欢喜”；此译保留其使役意义，并符合庄重自然的现代汉语。
- source_word: אָב
  choice: 父亲
  rationale: 原文没有物主后缀，中文无需添加“他的”；零冠词表达普遍性的箴言陈述。
- source_word: וּבֵן
  choice: ……儿子却
  rationale: 连接词字面可作“和”，但在反义平行中用“却”清楚呈现转折对照。
- source_word: כְּסִיל
  choice: 愚昧的
  rationale: 该词在智慧文学中主要指道德和实践上的愚顽，并非单指智力不足；“愚昧”保留这一智慧文学色彩。
- source_word: תּוּגַת
  choice: 使……忧愁
  rationale: 原文为“（是）他母亲的忧愁”这一名词构造表达；中文转为对称的使役句式，传达其结果，同时使上下两行自然平衡。
- source_word: אִמּוֹ
  choice: 母亲
  rationale: 原文有第三人称阳性单数后缀，所指即该愚昧儿子的母亲；中文语境中省略“他的”仍明确，且更简洁自然。
theological_decisions: []
translation_notes:
  register: 采用简洁、对称、庄重的现代标准汉语，保持箴言的格言体和反义平行结构。首行作为小标题，正文分两行呈现。将第二分句的名词结构自然转译为“使母亲忧愁”，不改变其基本语义；本节无须设置文本或神学脚注。
