  text: כִּ/שְׂח֣וֹק לִ֭/כְסִיל עֲשׂ֣וֹת זִמָּ֑ה וְ֝/חָכְמָ֗ה לְ/אִ֣ישׁ תְּבוּנָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/023.yaml
  text: Doing wickedness is like a joke to a fool[a], but wisdom is for a man of understanding.
translation:
  language: zh_hans
  text: 作恶在愚昧人看来如同玩笑[a]；但智慧属于有悟性的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“愚昧人以图谋恶事为游戏。”这里译作“恶”的希伯来词也可指无耻、骇人的行为。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּשְׂחוֹק
  choice: 如同玩笑
  rationale: כְּ 表示比较，שְׂחוֹק 可指欢笑、消遣或游戏。“如同玩笑”自然表达愚昧人把恶行当作可笑可玩的事，同时保留比喻形式。
- source_word: לִכְסִיל
  choice: 在愚昧人看来
  rationale: 介词 לְ 在此表示相对于某人的看法或态度；译作“在……看来”清楚呈现愚昧人如何看待作恶。
- source_word: עֲשׂוֹת
  choice: 作
  rationale: 该不定式结构在句中具有名词性作用，与 זִמָּה 合译为“作恶”，简洁而符合现代汉语。
- source_word: זִמָּה
  choice: 恶
  rationale: זִמָּה 可指邪恶、恶谋或无耻越轨之举；此处采用较宽泛的伦理含义“恶”，不把词义局限于计谋或性方面。
- source_word: וְחָכְמָה
  choice: 但智慧
  rationale: וְ 字面为“和”，但两行构成愚昧人与有悟性者的对照，因此以“但”表达其转折功能。
- source_word: לְאִישׁ תְּבוּנָה
  choice: 属于有悟性的人
  rationale: 原文直译近于“对有悟性的人而言”，且省略谓语。“属于”保持句式简练，也不额外断定智慧必然是其乐趣；“人”在现代汉语中可自然涵盖代表性用法。
theological_decisions:
- issue: אִישׁ 的阳性代表性表达
  choice: 有悟性的人
  alternative: 有悟性的男子
  rationale: אִישׁ 为阳性单数，但本节是普遍适用的智慧格言。现代汉语的“人”既准确自然，也不加入经文并未强调的性别限定。
- issue: 第二分句省略谓语所形成的关系
  choice: 智慧属于有悟性的人
  alternative: 智慧使有悟性的人喜乐
  rationale: 原文仅有“而智慧—对有悟性的人”，关系有意简省。译作“属于”保留一定开放性，避免把前半句的“玩笑”直接补成后半句的“乐趣”，从而不消除原文的省略和张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“作恶”凝练有力；“在……看来如同玩笑”明确表达愚昧人的态度；分号呈现希伯来诗句两行之间的对照。脚注标记已在正文中对应出现。
