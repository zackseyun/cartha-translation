base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/032.yaml
  text: The lips of the righteous know what is acceptable[b][a], but the mouth of the wicked speaks perversity.
translation:
  language: zh_hans
  text: 义人的嘴唇知道什么是合宜的[a]，恶人的口却尽是乖谬之言[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“什么是令人喜悦的”、“什么是蒙悦纳的”；也可理解为“恩惠”。原文名词可指喜悦、悦纳、好意或合宜可取之事。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“恶人的口却是种种乖谬”；原文没有明说“说”或其他动词。
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂפְתֵי צַדִּיק
  choice: 义人的嘴唇
  rationale: 保留原文具体的身体部位意象，并与下半句的“口”形成诗性平行；单数“义人”具有泛指性质，现代汉语中自然。
- source_word: יֵדְעוּן
  choice: 知道
  rationale: 保留 ידע 的基本词义“知道”；上下文自然暗示义人在言语上具有分辨力，不在正文中额外释义为“知道该说什么”。
- source_word: רָצוֹן
  choice: 什么是可喜悦的
  rationale: רָצוֹן 可指喜悦、悦纳、好意或合宜可取之事。此处作“知道”的宾语，译为“什么是可喜悦的”较自然，同时保留其可能指令人喜悦或蒙悦纳之言的宽度。
- source_word: וּפִי רְשָׁעִים
  choice: 恶人的口却
  rationale: 将连接词按两分句的对比关系译为“却”，保留“口”与“嘴唇”的平行；复数“恶人”在汉语中可作为群体称谓。
- source_word: תַּהְפֻּכוֹת
  choice: 尽是乖谬之言
  rationale: 该复数名词指颠倒、扭曲或乖谬之事，在此语境中指恶人口中的言语。原文没有明说动词，汉语以“尽是”构成自然的名词谓语，并用“之言”明确语境，避免硬加“说”而掩盖原句结构。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的箴言体。保留“嘴唇／口”的具体平行意象；“乖谬”略具书面色彩，但在智慧文学中准确凝练，并由“之言”使意思清楚。所有脚注标记均置于相关正文之后。
