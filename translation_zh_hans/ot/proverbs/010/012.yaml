source:
  edition: WLC
  text: שִׂ֭נְאָה תְּעוֹרֵ֣ר מְדָנִ֑ים וְ/עַ֥ל כָּל פְּ֝שָׁעִ֗ים תְּכַסֶּ֥ה אַהֲבָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/012.yaml
  text: Hatred stirs up conflicts[b][a], but love covers all transgressions.
translation:
  language: zh_hans
  text: 恨能挑起纷争，爱却遮盖一切过犯。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “遮盖”保留原文的比喻，指爱不揭露、张扬或继续激化过犯；这里并非明确主张包庇不义。
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂנְאָה
  choice: 恨
  rationale: 抽象名词作主语，与后半句的“爱”形成简洁鲜明的对照；现代汉语中“恨”比“仇恨”更凝练，适合箴言体。
- source_word: תְּעוֹרֵר
  choice: 挑起
  rationale: 该动词在此带使动意味，表示激起、引发；“挑起”自然地搭配“纷争”，并体现主动煽动争端的含义。
- source_word: מְדָנִים
  choice: 纷争
  rationale: 复数名词，指争执、冲突或争端；汉语集合性表达“纷争”既自然又保留范围上的概括性。
- source_word: וְ/עַל
  choice: 却
  rationale: 原文形式上是“而/在……之上”，但两分句构成反义平行；“却”准确传达诗句的转折关系，而不把介词意象生硬译入汉语。
- source_word: כָּל
  choice: 一切
  rationale: 保留原文概括全部的量词力度，与“过犯”搭配自然。
- source_word: פְּשָׁעִים
  choice: 过犯
  rationale: 该词可指冒犯、悖逆和违法行为；“过犯”保留其道德分量，同时不把语境限定为特定法律或教义范畴。
- source_word: תְּכַסֶּה
  choice: 遮盖
  rationale: 保留原文“覆盖、遮盖”的具体比喻，不直接解释成“饶恕”“忽略”或“隐瞒”。
- source_word: אַהֲבָה
  choice: 爱
  rationale: 直接对应抽象名词，并与“恨”构成全句核心的伦理对照。
theological_decisions:
- issue: “爱遮盖一切过犯”的含义
  choice: 保留“遮盖”的比喻，表达爱不继续揭露、张扬或激化过犯所造成的纷争。
  alternative: 译为“爱饶恕一切罪”或理解为无论公义如何都要隐瞒所有恶行。
  rationale: 希伯来文使用“遮盖”，并未明确使用“饶恕”的词，也没有说爱必须包庇不义。保留比喻可维持经文的张力，并让上下半句的对照说明：恨挑起纷争，爱则不让过犯持续扩大纷争。
translation_notes:
  register: 采用现代、凝练而庄重的箴言体。“恨……爱……”形成对称结构；“挑起纷争”是普通读者易懂的现代搭配，同时保留“遮盖”的原文意象及其解释空间。
