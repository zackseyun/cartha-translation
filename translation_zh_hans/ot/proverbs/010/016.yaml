  text: פְּעֻלַּ֣ת צַדִּ֣יק לְ/חַיִּ֑ים תְּבוּאַ֖ת רָשָׁ֣ע לְ/חַטָּֽאת׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/016.yaml
  text: The labor of the righteous leads to life[c][b][a]; the produce of the wicked leads to sin.
translation:
  language: zh_hans
  text: 义人的劳作带来生命[a]；恶人的收成带来罪恶[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “带来生命”或译“为了生命”。希伯来语介词可表示目的、趋向或结果。
    reason: lexical_alternative
  - marker: b
    text: “罪恶”所译的希伯来语在祭祀语境中也可指“赎罪祭”，但本节语境指罪。
    reason: alternative_reading
lexical_decisions:
- source_word: פְּעֻלַּת
  choice: 劳作
  rationale: 该词可指工作、劳苦，也可指工作的成果或报酬。这里与“收成”平行；“劳作”既保留人的行动，也不把含义限于工资。
- source_word: צַדִּיק
  choice: 义人
  rationale: 原文是作名词用的单数形容词，具有代表性；“义人”简洁自然，并保留《箴言》中义人与恶人的典型对比。
- source_word: לְחַיִּים
  choice: 带来生命
  rationale: 介词 לְ 在这里可表达趋向、目的或结果；“带来生命”以自然汉语呈现其结果或方向性，同时在脚注中保留“为了生命”的可能。
- source_word: תְּבוּאַת
  choice: 收成
  rationale: 该词可指农作物的出产、收益或收入。“收成”保留收获意象，也能比喻恶人行为所得的成果。
- source_word: רָשָׁע
  choice: 恶人
  rationale: 与“义人”相对，同为具有代表性的单数称谓；“恶人”符合现代汉语智慧文学的庄重表达。
- source_word: לְחַטָּאת
  choice: 带来罪恶
  rationale: חַטָּאת 在此智慧文学的道德语境中指罪，而非祭祀语境中的赎罪祭；平行的“带来”也反映 לְ 的趋向或结果用法。
theological_decisions:
- issue: חַטָּאת 的含义
  choice: 罪恶
  alternative: 赎罪祭
  rationale: 该词在祭祀语境中可以指“赎罪祭”，但本节以义人与恶人的行为及其趋向作对照，没有祭祀背景，因此道德意义的“罪恶”最符合上下文。
- issue: 两个介词 לְ 所表达的关系
  choice: 以“带来”呈现趋向或结果
  alternative: 译作“为了”，表达目的
  rationale: 原文可容纳目的或结果的意味。正文采用自然且符合箴言因果对照的“带来”，脚注保留“为了”的可能，避免将真实歧义完全消除。
translation_notes:
  register: 采用现代、简洁而庄重的箴言体。两分句以“义人／恶人”“劳作／收成”“带来生命／带来罪恶”形成紧凑对仗；不添加原文没有的性别限定。
