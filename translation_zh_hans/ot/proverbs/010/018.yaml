base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/018.yaml
  text: Lying lips conceal hatred[b][a], and whoever spreads slander is a fool.
translation:
  language: zh_hans
  text: 隐藏仇恨的人，说的是谎话[a]；散布坏话的人，是愚昧人。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“虚假的嘴唇隐藏仇恨。”原文短句极为精练，也可较直译为：“隐藏仇恨的，有虚假的嘴唇。”
    reason: syntactic_alternative
  - marker: b
    text: 或译：“传出不利传闻的。”原文可泛指传播有损于人的坏话或负面传闻，不一定专指内容虚假的诽谤。
    reason: lexical_alternative
lexical_decisions:
- source_word: מְכַסֶּה שִׂנְאָה
  choice: 隐藏仇恨的
  rationale: מְכַסֶּה是כסה的分词，表示遮盖、隐藏；שִׂנְאָה指仇恨、敌意。译文保留分词式人物称谓，也呈现把内心仇恨掩藏起来的含义。
- source_word: שִׂפְתֵי שָׁקֶר
  choice: 嘴里说的是谎话
  rationale: 原文直译为“虚假的嘴唇”或“谎言的嘴唇”。中文用“嘴里说的是谎话”自然表达以嘴唇代指言语的意象，并与前面的行为主体顺畅衔接。
- source_word: וּמוֹצִא
  choice: 散布
  rationale: יצא的使役分词本义为“使出来、带出来”；与דִבָּה连用时，指把不利的言论传出或散播开来。
- source_word: דִבָּה
  choice: 恶言
  rationale: דִבָּה可指有损于人的坏话、不利传闻或毁谤。“恶言”保留其伤害性，同时不像“诽谤”那样必然断定内容虚假；较宽泛的可能含义在脚注中说明。
- source_word: הוּא כְסִיל
  choice: 是愚昧人
  rationale: כְסִיל是《箴言》中反复出现的智慧文学类别词，主要指道德和判断上顽梗愚钝的人，而不只是智力不足。“愚昧人”有助于全书术语一致。
theological_decisions:
- issue: כְסִיל所表达的愚昧性质
  choice: 译作“愚昧人”，保留智慧文学中的道德类别
  alternative: 译作“傻瓜”或“蠢人”
  rationale: 原词在《箴言》中通常带有道德与属灵判断，不宜缩减为智力低下或日常辱骂。
translation_notes:
  register: 采用现代、庄重而易懂的箴言体；上下两句以“……的，……”形成平行结构。“嘴里说的是谎话”避免生硬的“谎言的嘴唇”，同时仍保留口与言语的身体意象。
