base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/013.yaml
  text: On the lips of a discerning man wisdom is found[a], but a rod is for the back of one who lacks sense.
translation:
  language: zh_hans
  text: '明哲人的嘴唇上可见智慧；

    缺乏见识的人[a]的背上却有杖。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“缺少心的人”；希伯来文以“心”指理解、判断和明辨的能力。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּ/שִׂפְתֵי
  choice: 嘴唇
  rationale: 介词ב与“嘴唇”连用，描写智慧显于人的言语；“嘴唇流露”在现代汉语中自然，并保留希伯来的身体意象。
- source_word: נָבוֹן
  choice: 明哲人
  rationale: נָבוֹן指有理解力和辨别力的人。“明哲人”简洁庄重，也与箴言的智慧语域相称。
- source_word: תִּמָּצֵא
  choice: 流露
  rationale: 该词为尼法勒未完成式，在此表达恒常的箴言性事实。直译可作“被发现”，但“嘴唇流露智慧”更符合现代汉语，同时表达智慧可从其言语中见到。
- source_word: חָכְמָה
  choice: 智慧
  rationale: 这是箴言中该核心词的常规译法。
- source_word: וְ/שֵׁבֶט
  choice: 却要受杖打
  rationale: 连接词在平行句中具有鲜明的转折作用，译作“却”；שֵׁבֶט是用于管教或惩罚的杖，结合“背”转译为“受杖打”最自然。
- source_word: לְ/גֵו
  choice: 背
  rationale: גֵו可指身体或背部；在杖打语境中明确指承受击打的背。
- source_word: חֲסַר לֵב
  choice: 无知者
  rationale: 该短语字面为“缺少心”，其中“心”指理解、判断和明辨能力。“无知者”简洁传达其惯用意义；脚注保留原文意象。
