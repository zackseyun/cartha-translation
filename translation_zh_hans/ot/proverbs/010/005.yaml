base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/005.yaml
  text: He who gathers in summer is a prudent son[b][a], but he who sleeps during harvest is a son who brings shame.
translation:
  language: zh_hans
  text: 在夏天收聚的，是明智的儿子[a]；在收割时沉睡的，是使人蒙羞的儿子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “儿子”原文为阳性单数；在《箴言》中，这一称呼保留父亲对儿子的训诲形式，其教训往往也具有普遍的代表意义。
    reason: cultural_note
lexical_decisions:
- source_word: אֹגֵר
  choice: 收聚
  rationale: 该分词指把农产物收集起来；“收聚”既保留收集的动作，也不额外限定为储藏。
- source_word: בַּקַּיִץ
  choice: 夏天
  rationale: 直译季节用语，并指出适宜收聚作物的时节；中文以“夏天收聚”简洁自然。
- source_word: בֵּן
  choice: 儿子
  rationale: 希伯来文明确为阳性单数，也保留《箴言》中父亲训诲儿子的表达形式；其教训可有代表性，见脚注。
- source_word: מַשְׂכִּיל
  choice: 明智
  rationale: 该词表示在行动中显出的洞察和审慎；“明智”在此自然地描述懂得及时做事的人。
- source_word: נִרְדָּם
  choice: 沉睡
  rationale: 该分词描写在不该睡的时候睡着或酣睡；“沉睡”凸显其在收割关键时刻的懈怠。
- source_word: בַּקָּצִיר
  choice: 收割时
  rationale: 清楚表达收获作物、必须及时劳作的关键时期。
- source_word: מֵבִישׁ
  choice: 贻羞
  rationale: Hiphil 分词具有使动含义，指给家人带来羞耻；“贻羞”简练地保留“使人蒙羞”的语义。
