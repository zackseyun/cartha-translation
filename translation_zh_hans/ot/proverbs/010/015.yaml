base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/015.yaml
  text: A rich man's wealth is his fortified city[b][a]; the ruin of the poor is their poverty.
translation:
  language: zh_hans
  text: 富人的财富是他的坚城；穷人的贫困，是他们的毁灭。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “毁灭”也可译作“毁坏”；这个希伯来词还可表示“惊恐、沮丧”，但在本节语境中可能性较小。
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹן
  choice: 财富
  rationale: 指物质财富或财产；“财富”自然、准确，并与下半句的“贫困”形成鲜明对照。
- source_word: עָשִׁיר
  choice: 富人
  rationale: 原文为单数的实体化形容词，意为“富有的人”；译作“富人”简洁自然，其单数领属关系由“他的”体现。
- source_word: קִרְיַת עֻזּוֹ
  choice: 他的坚城
  rationale: 字面为“他力量的城”；“坚城”保留城市作为安全保障的比喻，也自然表达坚固、可防守之意。
- source_word: מְחִתַּת
  choice: 败亡
  rationale: 该词可指毁灭、败亡，也可指惊恐。此处与“坚城”相对，并以贫困为穷人的不利根源，“败亡”较符合语境，同时以脚注保留歧义。
- source_word: דַּלִּים
  choice: 穷人
  rationale: 指贫穷、处境卑微的人；“穷人”是现代汉语中直接而自然的表达。
- source_word: רֵישָׁם
  choice: 他们的贫困
  rationale: 意为贫穷、缺乏；译作“贫困”直接保留其经济含义及与“财富”的平行对照。
theological_decisions:
- issue: 财富与贫困的陈述性质
  choice: 按智慧文学的观察性格言直译，不增添道德褒贬或神学因果说明
  alternative: 将财富解释为神的赐福，或将贫困解释为个人过错
  rationale: 原文只概括财富可提供安全、贫困可导致败亡的社会现实，并未明说财富必然正当，也未判定穷人有罪。
translation_notes:
  register: 采用凝练、对称的箴言体。“坚城”兼顾原文“力量之城”的形式和现代汉语的自然表达；下半句使用“使他们败亡”呈现原文名词短语所隐含的关系，同时不把这种关系限定为严格的机械因果。
