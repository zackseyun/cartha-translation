base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/012.yaml
  text: When you walk[a], your step will not be hindered; and if you run, you will not stumble.
translation:
  language: zh_hans
  text: 你行走时，脚步不会受阻[a]；如果奔跑，也不会绊倒。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“脚步不会受到限制”。原文动词含有变窄、受拘束的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּלֶכְתְּךָ
  choice: 你行走时
  rationale: 介词 בְּ 加动词 הלך 的不定式构造及第二人称单数后缀，在这里表达时间关系；“你行走时”自然保留了“当你行走”的意思。
- source_word: יֵצַר
  choice: 不会受阻
  rationale: 该动词在此有变窄、受限制之意，与“脚步”搭配表示行动不受拘束。“受阻”符合现代汉语表达，同时保留道路受限的意象。
- source_word: צַעֲדֶךָ
  choice: 脚步
  rationale: 原文为带第二人称单数后缀的单数名词；汉语“脚步”可自然用作集合性表达，并延续智慧文学中的道路意象。
- source_word: וְאִם
  choice: 如果
  rationale: 条件连词 אִם 明确表示“如果”；分号已承接前句，因此不必生硬译出连接词 וְ。
- source_word: תָּרוּץ
  choice: 奔跑
  rationale: רוץ 的基本义是“跑”；“奔跑”在现代汉语中自然、庄重，也与前句“行走”形成速度上的递进。
- source_word: תִכָּשֵׁל
  choice: 不会绊倒
  rationale: כשל 的尼法勒形常指失足、绊跌，也可含比喻意义。“绊倒”既保留道路意象，又不排除道德或人生层面的含义。
theological_decisions: []
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。两分句保留“行走—奔跑”和“受阻—绊倒”的平行递进；不把道路意象限定为纯粹身体行动或道德寓意。
