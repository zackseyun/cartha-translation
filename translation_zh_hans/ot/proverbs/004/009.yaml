- from: 她必把恩美的花环戴在你头上[a]，把华美的冠冕赐给你[b]。
  to: 她必为你戴上恩惠的花环[a]，赐给你华美的冠冕[b]。
  rationale: 修订消除了“恩美”的不自然表达，保留原文“恩惠／优雅”与“华美／荣美”的词汇弹性，并以自然的现代汉语保留智慧为人戴上花环、赐予冠冕的两行平行意象。脚注锚点分别紧随相关词组，说明可行的词汇替代。
