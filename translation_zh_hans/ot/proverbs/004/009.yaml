  yaml_path: translation/ot/proverbs/004/009.yaml
  text: She will place on your head a graceful wreath[b][a]; she will bestow on you a crown of beauty.
translation:
  language: zh_hans
  text: 她必为你戴上恩惠的花环[a]，赐给你华美的冠冕[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“优雅的花环”或“恩惠的华冠”。
    reason: לִוְיַת指花环、环饰或华冠；חֵן可指恩惠，也可指优雅、魅力。
  - marker: b
    text: 或译：“荣美的冠冕”或“光彩的冠冕”。
    reason: תִּפְאֶרֶת可指华美、荣美或光彩。
lexical_decisions:
- source_word: תִּתֵּן לְרֹאשְׁךָ
  choice: 把……戴在你头上
  rationale: נתן的未完成式以阴性“智慧”为主语；结合“头”和饰物的语境，汉语用“戴在……头上”自然地表达“放置”的具体动作。
- source_word: לִוְיַת
  choice: 花环
  rationale: 该词指佩戴在头上的环状装饰；“花环”是现代汉语中清楚、自然且保留诗意形象的说法。
- source_word: חֵן
  choice: 恩美的
  rationale: חֵן可指恩惠、优美、魅力；“恩美”兼顾其恩惠与美好两方面的语义，不将其单一化为外表美感。
- source_word: עֲטֶרֶת
  choice: 冠冕
  rationale: 该词指冠冕或华冠；“冠冕”符合智慧文学的庄重诗体，也与头饰意象相称。
- source_word: תִּפְאֶרֶת
  choice: 华美的
  rationale: תִּפְאֶרֶת可表示美丽、荣美、光彩；此处修饰冠冕，“华美”自然保留其视觉荣美与尊荣色彩。
- source_word: תְּמַגְּנֶךָּ
  choice: 赐给你
  rationale: 此处动词在平行句中表示交付、赐予，而非“保护”；“赐给”既准确又符合庄重诗歌语域。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重的现代标准汉语，保留希伯来诗歌两行平行结构。以“她”承接上下文中阴性人格化的“智慧”；“恩美”保留חֵן的语义张力，避免只译作审美意义上的“优美”。
