  text: Guard your heart more than all guarding[b][a], for from it are the springs of life.
translation:
  language: zh_hans
  text: 你要谨守你的心，胜过谨守一切别的事物[a]，因为生命的泉源由它而出[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你要谨守你的心，胜过你所谨守的一切。”希伯来文直译近似“在一切谨守之上，谨守你的心”，强调最高程度的警醒。
    reason: lexical_alternative
  - marker: b
    text: “泉源”也可译作“出口”“流出之处”或“源头”；原文表达生命由心发出。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִכָּל מִשְׁמָר
  choice: 胜过谨守一切
  rationale: 介词 מִן 在这里具有比较或最高程度的意味；与“谨守”连用，既保留“胜过一切守护”的强调，也尽量重现 מִשְׁמָר 与命令式 נְצֹר 之间的词根呼应。
- source_word: נְצֹר
  choice: 谨守
  rationale: 这个命令式表示主动保护、严密看守；“谨守”简洁而庄重，也能表达持续警醒之意。
- source_word: לִבֶּךָ
  choice: 你的心
  rationale: 希伯来语的“心”涵盖思想、意志和情感，是人的内在中心；保留原有意象，不将其缩窄为单纯的情绪或理智。
- source_word: כִּי
  choice: 因为
  rationale: 引出谨守内心的理由，清楚保留原句的因果关系。
- source_word: מִמֶּנּוּ
  choice: 从它
  rationale: 阳性单数后缀回指“心”；用“它”保留回指关系，避免在正文中解释性扩写。
- source_word: תּוֹצְאוֹת
  choice: 泉源……而出
  rationale: 该词可指流出之处、出口或源头；结合“生命”，用“泉源……而出”保留生命从心中发出的流动意象，同时在脚注说明其他可能译法。
- source_word: חַיִּים
  choice: 生命
  rationale: 虽为复数形态，这里通常表达抽象的“生命”；汉语用单数概念最自然。
theological_decisions:
- issue: “心”的人论含义
  choice: 保留“心”，指人的思想、意志和情感所在的内在中心
  alternative: 译为“思想”“内心”或“内在自我”
  rationale: 原文采用希伯来语常见的人论表达；直译为“心”能保留其广度，避免只理解为情感或理智。
- issue: תּוֹצְאוֹת חַיִּים 的意象
  choice: 生命的泉源都从它而出
  alternative: 生命的出路／流出之处都由它而来
  rationale: 原词容许“出口、流出、源头”等理解；正文采用自然的泉源意象，脚注保留其词义幅度，不把它限定为某一种系统性的神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“谨守”保留原文的守护语义及重复强调；句式略带箴言式凝练。所有脚注标记均已置于正文相应位置。
