  text: בְּ/אֹ֣רַח רְ֭שָׁעִים אַל תָּבֹ֑א וְ/אַל תְּ֝אַשֵּׁ֗ר בְּ/דֶ֣רֶךְ רָעִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/014.yaml
  text: Do not enter the path of the wicked[a], and do not walk in the way of evil men.
translation:
  language: zh_hans
  text: '不要踏上恶人的路径，

    也不要在恶人的道路上前行。[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “前行”或译“径直走下去”“继续前进”。希伯来语动词可指径直走、向前推进或继续走。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹרַח
  choice: 路径
  rationale: 该词既指实际路径，也可喻指生活方式；“路径”保留行路意象，并与下句的“道路”有所区别。
- source_word: רְשָׁעִים
  choice: 恶人
  rationale: 该阳性复数名词化形容词泛指作恶的人；“恶人”是现代汉语中自然、凝练且符合《箴言》语体的表达。
- source_word: אַל תָּבֹא
  choice: 不要踏上
  rationale: בוא 与表示路径的介词短语连用，在此指进入某条人生道路；“踏上”比字面的“进入”更符合汉语的道路隐喻。
- source_word: תְּאַשֵּׁר
  choice: 前行
  rationale: Piel 形式可表示径直走、继续前进或推进；“前行”保留其沿着某条道路继续走的动态含义，不把它弱化为泛泛的“行走”。
- source_word: דֶּרֶךְ
  choice: 道路
  rationale: 该词可指道路，也常喻指人的行为方式或生活道路；“道路”自然地兼具具体和隐喻意义。
- source_word: רָעִים
  choice: 坏人
  rationale: 该阳性复数名词化形容词指邪恶的人。“坏人”与前句“恶人”形成近义平行，同时避免用“作恶者”过度突出行为层面。
theological_decisions:
- issue: 阳性复数 רָעִים 的性别表达
  choice: 坏人
  alternative: 邪恶的男人
  rationale: 希伯来语采用语法上的阳性复数，但在此作为一类人的统称，并不强调生理性别。汉语“坏人”能保留人的指称和代表性范围；译成“男人”反而会加入原文语境未着重表达的性别限制。
translation_notes:
  register: 采用现代、庄重而易懂的劝诫语体。两行分别用“路径／道路”和“恶人／坏人”呈现希伯来诗歌的近义平行；“踏上／前行”保留从进入到继续行进的递进感。
