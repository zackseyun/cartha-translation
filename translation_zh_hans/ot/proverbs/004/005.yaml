  text: קְנֵ֣ה חָ֭כְמָה קְנֵ֣ה בִינָ֑ה אַל תִּשְׁכַּ֥ח וְ/אַל תֵּ֝֗ט מֵֽ/אִמְרֵי פִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/005.yaml
  text: Acquire wisdom[a]; acquire understanding. Do not forget[b], and do not turn away from the words of my mouth.
translation:
  language: zh_hans
  text: 获取智慧[a]，获取悟性；不可忘记，也不可偏离我口中的话[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “获取”也可译作“获得”或“买得”。希伯来语动词可按语境表示取得、获得或购买。
    reason: lexical_alternative
  - marker: b
    text: “偏离”也可译作“转离”或“偏开”。
    reason: lexical_alternative
lexical_decisions:
- source_word: קְנֵה
  choice: 要得
  rationale: 该命令式动词表示有意取得、获得；“要得”简洁自然，并保留两次重复所形成的劝勉力度，同时不把语境局限为商业上的“购买”。
- source_word: חָכְמָה
  choice: 智慧
  rationale: 《箴言》中的常用对应词，涵盖实践、道德与敬虔生活中的智慧。
- source_word: בִינָה
  choice: 聪明
  rationale: 表示理解力、洞察力；“聪明”与“智慧”搭配自然，也保留二者并列而不完全等同的关系。
- source_word: אַל תִּשְׁכַּח
  choice: 不可忘记
  rationale: 直接保留שׁכח“忘记”的基本意义，不将其解释性地改为“忽略”。
- source_word: וְאַל תֵּט
  choice: 也不可偏离
  rationale: נטה在此表示转离、偏离；“偏离”自然地表达不应背离所领受之言的警告。
- source_word: מֵאִמְרֵי פִי
  choice: 我口中的话
  rationale: 保留“口”这一具体意象及父亲亲口教导的意味，比单译“我的教训”更贴近原文。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的劝诫语体。“要得……要得……”保留原文命令式的重复；后半句用“不可……也不可……”呈现并列禁令。所有脚注标记均置于相关正文词语之后。
