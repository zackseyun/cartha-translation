  yaml_path: translation/ot/proverbs/004/007.yaml
  text: 'The beginning of wisdom is this: acquire wisdom[a], and with all you acquire[b], acquire understanding.'
translation:
  language: zh_hans
  text: 智慧的开端是：要获得智慧[a]；要以你一切所得，获得悟性[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“智慧是首要之事，所以要获得智慧。”这里的“开端”也可指“首要之事”或“最重要的事”。
    reason: alternative_reading
  - marker: b
    text: 希伯来文可直译为“以你一切的所得”；也可理解为“以你所有的产业”或“不惜付出你所有的一切”。“所得”与前后的“获得”在原文中出自同一词根，形成文字呼应。
    reason: lexical_alternative
lexical_decisions:
- source_word: רֵאשִׁית
  choice: 开端
  rationale: 该词可指“开始、首要之物、最重要之事”。正文采用“开端”，保留希伯来文的基本形式，并让后面的命令说明智慧如何开始；“首要之事”的可能含义列入脚注。
- source_word: חָכְמָה
  choice: 智慧
  rationale: 这是《箴言》中该词的标准对应，涵盖实际生活、道德判断与敬虔生活中的智慧，不仅指智力。原文重复此词以加强语势，译文也予以保留。
- source_word: קְנֵה
  choice: 获得
  rationale: 该命令式可表示“买、取得、获得”。“获得”既体现主动追求，又不过度限定为商业购买；同一动词在本节两次出现，译文相应重复。
- source_word: וּבְכָל קִנְיָנְךָ
  choice: 要用你所得的一切
  rationale: קִנְיָן与קנה同源，可指所得、产业或财物。此译法尽量保留“获得—所得—获得”的文字呼应，也表达不惜一切代价追求悟性的意思，同时不把范围缩窄为金钱。
- source_word: בִינָה
  choice: 悟性
  rationale: 该词在智慧文学中表示理解、洞察和辨别的能力。“悟性”简洁自然，并与“智慧”形成相关而不完全相同的平行概念。
theological_decisions:
- issue: רֵאשִׁית在本句中是“开端”还是“首要之事”
  choice: 正文译作“智慧的开端是”
  alternative: “智慧是首要之事，所以要获得智慧”
  rationale: 希伯来文是简练的名词结构，两种理解在语法和词义上均有根据。正文保留“开端”的常见意义，脚注呈现“首要、最重要”的另一种可能，不把经文本身的歧义作单一化处理。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“要获得”清楚传达命令语气；分号保留两项命令的平行关系。正文中的[a]、[b]均与脚注对应。
