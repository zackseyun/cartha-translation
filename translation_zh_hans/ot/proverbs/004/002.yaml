  yaml_path: translation/ot/proverbs/004/002.yaml
  text: For I have given you good instruction[a]; do not forsake my teaching.
translation:
  language: zh_hans
  text: 因为我给你们美好的训诲；不要离弃我的教导[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “教导”或译“训诲”；传统译作“律法”。希伯来语“妥拉”可泛指教导，并非只指成文律法。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，说明应当留心领受教诲的理由；“因为”在现代汉语中自然保留这一解释性连接。
- source_word: לֶקַח טוֹב
  choice: 美好的训诲
  rationale: לֶקַח在智慧文学语境中指所传授的教训或训诲，טוֹב说明其性质良好、有益；“美好的训诲”庄重而易懂。
- source_word: נָתַתִּי לָכֶם
  choice: 我给你们的是
  rationale: 希伯来语完成式表明已经给予、如今仍具现实意义；汉语“给你们的是”也突出所授内容的良善性质。
- source_word: תּוֹרָתִי
  choice: 我的教导
  rationale: 在父亲教导儿子的智慧文学语境中，תּוֹרָה泛指具有权威的教导，不必限定为成文律法。
- source_word: אַל תַּעֲזֹבוּ
  choice: 不要离弃
  rationale: 准确传达否定禁令及עזב所含的主动抛弃意味，并保留其道德分量。
theological_decisions:
- issue: 智慧文学语境中תּוֹרָתִי的含义
  choice: 我的教导
  alternative: 我的律法；我的训诲
  rationale: 这里是父亲向众子传授智慧的语境，所指是权威性的教导，而不明确专指摩西律法；译作“教导”既保留宽广语义，也避免加入原文未限定的法律含义。
translation_notes:
  register: 采用现代、庄重而通俗的普通话。“训诲”与“教导”分别对应לֶקַח和תּוֹרָה，既保留两个近义词的呼应，也不将其完全合并。
