  text: וְ/אֹ֣רַח צַ֭דִּיקִים כְּ/א֣וֹר נֹ֑גַהּ הוֹלֵ֥ךְ וָ֝/א֗וֹר עַד נְכ֥וֹן הַ/יּֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/018.yaml
  text: But the path of the righteous is like the light of dawn[b][a], going on and shining until the day is fully established.
translation:
  language: zh_hans
  text: 但义人的道路好像晨光[a]，越来越明亮[b]，直到白昼完全显明。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“光辉”。
    reason: נֹגַהּ可指光辉或明亮；“晨光”依据本句由初光发展到完全白昼的意象。
  - marker: b
    text: 原文直译：“前行并发光”；这里表达光持续增强。
    reason: 保留הוֹלֵךְ וָאוֹר的字面双动词结构及其在语境中的渐进含义。
lexical_decisions:
- source_word: וְ/אֹרַח
  choice: 但……道路
  rationale: אֹרַח意为“道路、路径”；连接词וְ在上下文中承接与恶人之路的对比，因此译作“但”比单纯的“和”更自然。
- source_word: צַדִּיקִים
  choice: 义人
  rationale: 复数名词化形容词，指行为正直、公义的人；“义人”简洁保留《箴言》中的伦理类别。
- source_word: כְּ/אוֹר נֹגַהּ
  choice: 好像晨光[a]
  rationale: כְּ标示比喻；אוֹר是“光”，נֹגַהּ是“光辉、明亮”。结合后文发展到完全的白昼，“晨光”自然呈现逐渐增强的清晨光亮，同时以脚注保留较字面的词义。
- source_word: הוֹלֵךְ וָ/אוֹר
  choice: 越来越明亮[b]
  rationale: “行走/前行”与“发光”的连续结构在此表达持续发展的过程；汉语“越来越明亮”自然传达光不断增强的动态，并以脚注注明原文较直译的形式。
- source_word: עַד נְכוֹן הַ/יּוֹם
  choice: 直到白昼完全来到
  rationale: עַד标示过程的终点；נְכוֹן源于כון，有“确立、稳固、达到确定状态”之意。这里指白昼达到完整、稳定的状态；“完全来到”兼顾原意与现代汉语的自然表达，避免生硬的“白昼被确立”。
theological_decisions:
- issue: צַדִּיקִים所指的伦理—神学类别
  choice: 义人
  alternative: 正直的人；公义的人
  rationale: 上下文把义人的人生道路与恶人的道路相对照。“义人”保留《箴言》本身的道德类别，不额外引入关于称义方式或特定宗派体系的解释。
translation_notes:
  register: 采用现代、庄重而通顺的标准普通话。“道路—晨光—白昼”的意象链清楚可感；用“越来越明亮”表达希伯来语渐进结构，并借脚注保留其较字面的措辞。
