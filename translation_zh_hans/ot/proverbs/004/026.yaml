  text: פַּ֭לֵּס מַעְגַּ֣ל רַגְלֶ֑/ךָ וְֽ/כָל דְּרָכֶ֥י/ךָ יִכֹּֽנוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/026.yaml
  text: Level the path of your feet[a], and all your ways will be established.
translation:
  language: zh_hans
  text: 要修平你脚下的路[a]，你一切的道路就必稳固。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“要仔细衡量你脚下的路”；希伯来语动词也可表示衡量或慎重考虑。
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּלֵּס
  choice: 修平
  rationale: 该词的加强式命令可表示修整、铺平，也可表示衡量或仔细考量。正文采用具体的道路意象“修平”，与后文的道路隐喻衔接自然；另一可能义保留在脚注中。
- source_word: מַעְגַּל
  choice: 路
  rationale: 此名词指道路、路径或行进的轨迹，在智慧文学中也可喻指人生进程。“路”简洁自然，并能兼顾具体与比喻意义。
- source_word: רַגְלֶךָ
  choice: 你脚下的
  rationale: 原文直译为“你脚的”，中文以“你脚下的路”表达更自然，同时保留行走的身体意象。
- source_word: וְכָל
  choice: 你一切的……就
  rationale: וְ连接两个分句，כָל表示“一切”。中文用“就”自然呈现命令与结果之间的语义联系，但不把它强化为严格的因果保证。
- source_word: דְּרָכֶיךָ
  choice: 你的道路
  rationale: 复数“道路”常喻指人的行为方式或人生道路。保留道路隐喻，也与前句形成同义推进。
- source_word: יִכֹּנוּ
  choice: 必稳固
  rationale: כון的Niphal未完成式表示被立稳、得以确立或保持坚定。“必稳固”在现代中文中简明地传达结果性的稳定，并避免误译成原文未明确表达的“笔直”。
theological_decisions:
- issue: 后半句是否表达无条件的成功保证
  choice: 按智慧格言的形式译作“就必稳固”
  alternative: 译作“就会安稳”或弱化为可能性
  rationale: 原文使用陈述性的未完成式，语气肯定；译文保留这种格言式确信，同时不额外解释为物质成功、绝对安全或救恩条件。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“修平你脚下的路”保留原文具体而富有伦理含义的行路意象；“稳固”对应道路与人生方向得到确立的双重含义。
