  yaml_path: translation/ot/proverbs/004/003.yaml
  text: For I was a son to my father[b][a], tender and an only child before my mother.
translation:
  language: zh_hans
  text: 因为我曾是父亲的儿子，稚嫩，在母亲面前是她独一的孩子[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “独一的孩子”所译的希伯来语也可理解为“唯一的儿子”或“独特的一个”；在某些语境中还可含“所疼爱的”之意。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 在上下文中引出父亲重视教诲的缘由；“因为”保留其解释、说明的功能。
- source_word: בֵן הָיִיתִי לְאָבִי
  choice: 我曾是父亲的儿子
  rationale: 保留“儿子”这一明确的男性亲属称谓，并以现代汉语自然表达 לְ 所表示的亲属关系；הָיִיתִי 表示过去的状态。
- source_word: רַךְ
  choice: 年幼娇嫩
  rationale: 该词可指柔嫩、稚嫩或年幼；合并表达既呈现年少，也保留脆弱柔嫩的意味，避免只译“柔弱”所可能带来的贬义。
- source_word: וְיָחִיד
  choice: 是她独一的孩子
  rationale: יָחִיד 可表示唯一、独一或特别珍爱者。“独一的孩子”保留主要词义而不武断限定为“独生子”，相关歧义在脚注说明。
- source_word: לִפְנֵי אִמִּי
  choice: 在母亲眼中
  rationale: לִפְנֵי 字面为“在……面前”，此处表达在母亲面前或在她看来所具有的身份；“在母亲眼中”是自然且保留关系意味的汉语。
theological_decisions:
- issue: יָחִיד 所表达的是唯一身份还是受宠爱地位
  choice: 正文译作“独一的孩子”，保留两者之间的张力
  alternative: “唯一的儿子”、“独生子”或“母亲所疼爱的孩子”
  rationale: 原词首先有“唯一、独一”的意思，也可因语境引申为“所珍爱的”；正文不将其单独确定为生育次序或情感偏爱。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。“我曾是父亲的儿子”有意保留原文父子相承的表述；后半句以“在母亲眼中”自然传达希伯来语关系性习语。
