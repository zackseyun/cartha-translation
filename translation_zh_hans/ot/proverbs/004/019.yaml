base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/019.yaml
  text: The way of the wicked is like deep darkness[b][a]; they do not know what makes them stumble.
translation:
  language: zh_hans
  text: 恶人的道路如同幽暗[a]；他们不知道因什么而绊倒[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“如同浓重的黑暗”或“如同昏暗”。希伯来语这个词特指浓重的黑暗。
    reason: lexical_alternative
  - marker: b
    text: 或译：“他们不知道在什么东西上绊倒。”希伯来语可指使他们绊倒的原因，也可指他们绊到的东西。
    reason: lexical_alternative
lexical_decisions:
- source_word: דֶּרֶךְ
  choice: 道路
  rationale: 保留智慧文学中以“道路”比喻人生行径或生活方式的常见意象，现代汉语也自然易懂。
- source_word: רְשָׁעִים
  choice: 恶人
  rationale: 准确表达在道德上作恶、负罪之人；“恶人”简洁庄重，符合《箴言》的语体。
- source_word: כָּאֲפֵלָה
  choice: 如同幽暗
  rationale: כְּ表示比较；אֲפֵלָה指浓重的黑暗或昏暗。“幽暗”比普通的“黑暗”更能传达其深沉、遮蔽的意味，同时保持自然。
- source_word: לֹא יָדְעוּ
  choice: 他们不知道
  rationale: 直接保留ידע所表达的不知、不觉察之意，不额外限定为理智上的“不理解”。
- source_word: בַּמֶּה
  choice: 因什么
  rationale: 介词בְּ与疑问词מָה的组合可表达凭什么、因什么，也可能指在什么东西上；正文采用自然的工具或原因读法，并以脚注保留另一种理解。
- source_word: יִכָּשֵׁלוּ
  choice: 绊倒
  rationale: כשל的Nifal形式在此表示绊跌或跌倒；“绊倒”既保留道路意象，也适合道德处境的比喻。
theological_decisions:
- issue: 恶人绊倒原因或对象的歧义
  choice: 因什么而绊倒
  alternative: 被什么绊倒／在什么东西上绊倒
  rationale: 希伯来语בַּמֶּה可按工具、原因或所触碰的对象理解。正文不说明具体原因，保留恶人缺乏觉察的张力；脚注列出对象读法。
translation_notes:
  register: 采用现代、庄重而简明的箴言体。以分号呈现两分句的紧密关系；正文保留“道路—绊倒”的连贯意象，并借脚注呈现原文末句真实的句法歧义。
