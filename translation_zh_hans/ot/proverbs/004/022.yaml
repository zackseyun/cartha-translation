  text: כִּֽי חַיִּ֣ים הֵ֭ם לְ/מֹצְאֵי/הֶ֑ם וּֽ/לְ/כָל בְּשָׂר֥/וֹ מַרְפֵּֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/022.yaml
  text: For they are life to those who find them[a], and healing to all their flesh.
translation:
  language: zh_hans
  text: 因为这些话使寻得它们的人得着生命，也医治他的全身。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “医治他的全身”直译为“医治他所有的肉体”；也可译作“使他的全身健康”。
    reason: 说明 בְּשָׂרוֹ 的字面表达，并保留 מַרְפֵּא 可指“医治”或“健康”的词义幅度。
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，说明为何应当留心并持守这些话；“因为”自然表达原文的理由关系。
- source_word: חַיִּים
  choice: 生命
  rationale: 原词虽为复数形式，但在希伯来语中常作抽象单数使用，指“生命”。
- source_word: הֵם
  choice: 这些话使……
  rationale: 代词回指上文的“话”，并保留它们作为生命与医治之源的意思；汉语采用使动句式，避免生硬的“这些话是……医治”。
- source_word: לְמֹצְאֵיהֶם
  choice: 寻得它们的人
  rationale: 准确表达分词所指的泛称群体，并以“它们”回指上文的话语。
- source_word: בְּשָׂרוֹ
  choice: 他全身
  rationale: 原文直义为“他的全部肉体”，单数阳性后缀在箴言中代表泛称的个人；现代汉语用“他全身”既保留单数形式，也自然表达其身体整体。
- source_word: מַרְפֵּא
  choice: 得医治
  rationale: 该名词表示医治、痊愈或疗效；在汉语句法中译为“得医治”清楚自然，并避免把它具体化为原文未明说的药物。
theological_decisions:
- issue: 箴言泛称表达中单数阳性后缀的处理
  choice: 译作“他全身”
  alternative: 译作“他们全身”或省略代词仅作“全身”
  rationale: בְּשָׂרוֹ 的后缀明确为第三人称阳性单数。这里的“他”具有泛称、代表性的作用；保留单数可呈现原文从复数“寻得它们的人”转向代表性个人的语法张力。
- issue: בָּשָׂר 的字面义与语境义
  choice: 正文译作“全身”，脚注注明直译“他所有的肉体”
  alternative: 正文译作“他所有的肉体”
  rationale: “肉体”虽较贴近字面，却在现代汉语中容易引出与身体欲望或神学意义上的“肉体”相关的联想；本节语境明确指整个身体，因此“全身”更自然准确，同时以脚注保持词汇透明度。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“寻得”保留智慧文学中主动寻求并获得训言的意味；“得着生命”较“获得生命”更具箴言语体，同时仍为普通读者所理解。
