id: PRO.4.10
reference: Proverbs 4:10
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: שְׁמַ֣ע בְּ֭נִ/י וְ/קַ֣ח אֲמָרָ֑/י וְ/יִרְבּ֥וּ לְ֝/ךָ֗ שְׁנ֣וֹת חַיִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/010.yaml
  text: Hear[a], my son, and receive my words[c][b], and the years of your life will be many.
translation:
  language: zh_hans
  text: 我儿，要听，也要领受我的话，你一生的年日就必增多。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “你一生的年日就必增多”也可译作“你的寿数就必加增”。
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמַע
  choice: 要听
  rationale: 祈使式在智慧训诲语境中不只是听见，也含专心听从之意；“要听”简洁自然，同时保留这一语义空间。
- source_word: בְּנִי
  choice: 我儿
  rationale: 忠实保留阳性单数呼语及箴言中父亲训诲儿子的文学框架；“我儿”庄重而符合现代汉语经文语体。
- source_word: וְקַח
  choice: 也要领受
  rationale: לקח本义为拿、取，此处宾语为“我的话”，译作“领受”能自然表达接受训诲，又不把含义扩展为单纯的理解或服从。
- source_word: אֲמָרָי
  choice: 我的话
  rationale: 直接对应带第一人称单数后缀的复数名词，现代汉语自然清楚。
- source_word: וְיִרְבּוּ
  choice: 就必增多
  rationale: 保留רבה未完成式所表达的结果或应许，以及“增多”的动态含义；避免改写成较静态的“必很多”。
- source_word: לְךָ
  choice: 你一生的
  rationale: 结合后面的“生命之年”按汉语习惯表达其与受训者的关系；并未另译成生硬的“为你”。
- source_word: שְׁנוֹת חַיִּים
  choice: 一生的年日
  rationale: 该结构直指“生命的年岁”；“一生的年日”在现代汉语中自然，也保留年寿延长的意象。
theological_decisions:
- issue: 智慧训诲中的性别称呼
  choice: 我儿
  alternative: 我的孩子
  rationale: 希伯来文是阳性单数，且处于父亲对儿子的训诲框架中，因此保留性别明确的称呼，不作中性化处理。
- issue: 寿年增多是结果、应许还是无条件保证
  choice: 译作“就必增多”，保留格言式因果陈述
  alternative: 译作“便可长寿”或解释为无条件的个别保证
  rationale: 原文直接陈述年日将增多，但箴言体裁通常表达智慧秩序中的一般原则。正文不额外加入限制条件，也不将其强化为机械式保证，从而保留原有张力。
translation_notes:
  register: 采用现代、庄重而易懂的训诲语体。“我儿”保留原文父子框架；“要听”“领受”构成自然的平行命令。脚注标记已在正文中出现。
