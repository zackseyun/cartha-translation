  text: Hold fast to instruction; do not let go. Guard her[a], for she is your life.
translation:
  language: zh_hans
  text: 要紧紧持守训诲[a]，不可放松；要守护它，因为它是你的生命。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “训诲”也可译为“管教”或“规正”；希伯来文 מוסר 指带有训练和纠正意味的教导。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֲזֵק
  choice: 紧紧抓住
  rationale: 该命令式表达牢牢把持、坚定持守；“紧紧抓住”保留了握持的比喻和劝勉力度。
- source_word: בַּמּוּסָר
  choice: 管教
  rationale: מוּסָר 在《箴言》中兼有教导、训练、规正和纪律塑造之意；“管教”较能凝聚这种带纠正作用的培育含义。
- source_word: אַל תֶּרֶף
  choice: 不可放手
  rationale: רפה 在此指松开、放松原有的把持；此译与前句“抓住”的意象自然衔接。
- source_word: נִצְּרֶהָ
  choice: 谨守它
  rationale: נצר 表示守护、保守、谨守；“谨守”体现主动珍重并持守。汉语名词没有语法性别，因此用“它”回指“管教”，避免生硬地强加女性人格化。
- source_word: כִּי הִיא
  choice: 因为它
  rationale: 阴性代词回指 מוּסָר；现代汉语自然采用无生命代词“它”，而不把希伯来语的语法性别机械译成“她”。
- source_word: חַיֶּיךָ
  choice: 你的生命
  rationale: חַיִּים 形式上为复数，但常按惯用法表示整体意义上的“生命”；此处强调管教对于受劝者具有维系和塑造生命的根本意义。
theological_decisions:
- issue: “管教”与“生命”的关系
  choice: 保留系词判断“它就是你的生命”
  alternative: 意译为“它能使你得生命”或“它是你生命的保障”
  rationale: 原文直接说“它是你的生命”，未明确表达手段、原因或保障关系；保留强烈而开放的隐喻，避免增添原文没有说明的神学因果。
translation_notes:
  register: 采用简洁、有力、适合智慧训诲的现代标准普通话。“要……不可……要……”保留连续命令的节奏；用“就是”传达末句判断的强调。
