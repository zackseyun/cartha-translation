  yaml_path: translation/ot/proverbs/004/027.yaml
  text: Do not turn to the right or to the left[b][a]; remove your foot from evil.
translation:
  language: zh_hans
  text: 不可偏向右边或左边；要使你的脚远离邪恶。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תֵּט
  choice: 偏向
  rationale: נטה在אַל所引出的禁令中表示转离既定方向。“偏向”自然表达向一侧偏离，并与“右边或左边”相配。
- source_word: יָמִין וּשְׂמֹאול
  choice: 右边或左边
  rationale: 保留原文成对的方向词及平行结构，合起来表示不可向任何一侧偏离。
- source_word: הָסֵר
  choice: 要使……远离
  rationale: 该使役式命令与“你的脚”搭配，字面有移开、除去之意；“使……远离”既保留动作意象，也符合现代汉语。
- source_word: רַגְלְךָ
  choice: 你的脚
  rationale: 保留希伯来文单数和行路的具体意象，不直接将其解释为“脚步”或“行为”。
- source_word: מֵרָע
  choice: 远离邪恶
  rationale: רַע在本段智慧训诲中具有宽泛的道德含义；“邪恶”保留这一范畴，不缩窄为灾祸或伤害。
