  text: Avoid it[a]; do not pass through it[b]. Turn away from it and pass on.
translation:
  language: zh_hans
  text: 要避开它[a]，不可从中经过；要离开它，继续前行[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “避开”也可译作“远离”或“躲开”。希伯来语中的这个动词较罕见，在这里表示要避开恶人的路。
    reason: lexical_alternative
  - marker: b
    text: 直译：“从它上面转开，继续前行。”
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּרָעֵהוּ
  choice: 要避开它
  rationale: 该词较罕见，在本节平行命令的语境中表示避开前文所说恶人的路。“避开”自然清楚，并保留主动远离的含义。
- source_word: אַל תַּעֲבָר בּוֹ
  choice: 不可从中经过
  rationale: אַל表达禁止；עבר与ב连用，在这里描写从这条路上或其中经过。“从中经过”保留道路的空间意象。
- source_word: שְׂטֵה מֵעָלָיו
  choice: 要转身离开
  rationale: שְׂטֵה是“转开、偏离”的命令式，מֵעָלָיו表示从它那里离开。合译为“转身离开”，符合现代汉语，同时呈现刻意改变方向的动作。
- source_word: וַעֲבוֹר
  choice: 继续前行
  rationale: 末尾命令吩咐听者越过此处、往前走，不在恶人的路上停留。“继续前行”自然地表达避开之后往别处走的意思。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。四个连续命令保留了原文紧凑有力的劝诫节奏；以“它”承接上文恶人的路，不把隐含指代过度明说。
