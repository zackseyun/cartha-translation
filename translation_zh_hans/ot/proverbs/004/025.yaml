  text: עֵ֭ינֶי/ךָ לְ/נֹ֣כַח יַבִּ֑יטוּ וְ֝/עַפְעַפֶּ֗י/ךָ יַיְשִׁ֥רוּ נֶגְדֶּֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/025.yaml
  text: Let your eyes look straight ahead[a], and your eyelids be directed before you.
translation:
  language: zh_hans
  text: '你的眼睛要直视前方；

    你的眼皮也要端直地朝向前方。'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֵינֶיךָ
  choice: 你的眼睛
  rationale: 复数名词带第二人称阳性单数后缀；中文自然译为“你的眼睛”，保留身体部位的具体意象。
- source_word: לְנֹכַח
  choice: 直视前方
  rationale: 该介词性表达指正对着、在前方；与动词合译为“直视前方”，既自然又传达目光不偏离的方向感。
- source_word: יַבִּיטוּ
  choice: 要直视
  rationale: נבט意为看、注视；这里用“直视”与לְנֹכַח共同表达朝正前方看的意思，不额外加入凝视的强度。
- source_word: וְעַפְעַפֶּיךָ
  choice: 你的眼皮
  rationale: 原文明确使用“眼皮”，与上一分句的“眼睛”构成诗歌平行；不将其泛化为“目光”。
- source_word: יַיְשִׁרוּ
  choice: 要朝向
  rationale: ישר在此含端直、径直对准之意。“朝向”在现代汉语中能自然描述眼皮所代表的视线方向，同时避免把句意过度解释成纯粹的道德正直。
- source_word: נֶגְדֶּךָ
  choice: 你面前
  rationale: 该词表示面对着你、在你前面；译作“你面前”简洁贴切，并与首句“前方”形成平行。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语，以两行呈现希伯来诗歌的平行结构。保留“眼睛／眼皮”的具体意象及“前方／面前”的方向性；不把本节明说为道德训诫，以免消解原文借身体方向暗示人生道路的张力。
