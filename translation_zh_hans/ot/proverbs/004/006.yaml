  text: אַל תַּעַזְבֶ֥/הָ וְ/תִשְׁמְרֶ֑/ךָּ אֱהָבֶ֥/הָ וְ/תִצְּרֶֽ/ךָּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/006.yaml
  text: Do not forsake her[a], and she will keep you; love her, and she will guard you.
translation:
  language: zh_hans
  text: 不要离弃她[a]，她就会保护你；要爱她，她就会守护你。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的“她”指本段中被拟人化为女性的智慧。
    reason: cultural_note
lexical_decisions:
- source_word: אַל
  choice: 不要
  rationale: אַל与未完成式连用，表达禁止；“不要”是自然、准确且不过度加强语气的现代汉语表达。
- source_word: תַּעַזְבֶהָ
  choice: 离弃她
  rationale: עזב可表示离开、抛弃或离弃；“离弃”保留了此处关系性的郑重语气。阴性单数后缀指向上下文中被拟人化的智慧，因此译作“她”。
- source_word: וְתִשְׁמְרֶךָּ
  choice: 她就会保护你
  rationale: שׁמר可表示看守、护卫、保全；在劝诫及其结果的结构中，“就会保护你”自然地传达其保护含义，并与下句形成近义平行。
- source_word: אֱהָבֶהָ
  choice: 要爱她
  rationale: אהב通常就是“爱”；保留原文简洁直接的情感与关系用语，阴性后缀仍指智慧。
- source_word: וְתִצְּרֶךָּ
  choice: 她就会守护你
  rationale: נצר含守卫、保守、护卫之意；“守护”既体现持续看顾的色彩，也与前句“保护”保持细微差别。
theological_decisions:
- issue: 智慧以女性形象拟人化
  choice: 保留女性代词“她”
  alternative: 改用“它”，或在每处重复“智慧”
  rationale: 希伯来文中的阴性后缀以及上下文共同把智慧塑造成女性形象。使用“她”保留原文的文学拟人手法，而不把这一形象化约为抽象概念。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“离弃”保留训诲语体的郑重感；两个分句以“保护／守护”呈现希伯来文近义动词的平行与细微差异。
