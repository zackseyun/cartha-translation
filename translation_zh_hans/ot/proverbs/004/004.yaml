base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/004.yaml
  text: Then he taught me and said to me[a], “Let your heart hold fast my words[b]; keep my commandments and live.”
translation:
  language: zh_hans
  text: 他教导我，对我说：“你的心[a]要紧紧持守我的话[b]；谨守我的诫命，便得存活。[c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文的“心”常包括思想、意志和理解，并非只指情感。
    reason: cultural_note
  - marker: b
    text: 或译：“要把我的话牢牢记在心里。”
    reason: lexical_alternative
  - marker: c
    text: 或译：“谨守我的诫命，并且活着。”希伯来文以连接词连接两个命令式；这里也可理解为谨守诫命所带来的结果。
    reason: translation_ambiguity
lexical_decisions:
- source_word: וַיֹּרֵנִי
  choice: 他教导我
  rationale: ירה的使役形在此指教导、训诲；“教导”自然清楚，也符合父亲传授智慧的语境。
- source_word: וַיֹּאמֶר לִי
  choice: 对我说
  rationale: 直接对应“向我说”，自然引出后面的直接引语。
- source_word: יִתְמָךְ
  choice: 要紧紧持守
  rationale: תמך有抓住、扶持、把持之意；以“心”为主语、以“我的话”为宾语时，表达牢牢记住并坚持不放。“紧紧持守”保留了力度和内在领受两层含义。
- source_word: דְּבָרַי
  choice: 我的话
  rationale: 忠实保留该词宽泛的“话语”含义，不把它窄化为格言或某一类教训。
- source_word: לִבֶּךָ
  choice: 你的心
  rationale: 保留希伯来文的身体意象；这里的“心”涵盖思想、意志和理解，不仅指情感，故加注说明。
- source_word: שְׁמֹר
  choice: 谨守
  rationale: שמר与诫命连用时表示认真遵行、守住；“谨守”既有遵行义，也保留慎重守护的语气。
- source_word: מִצְוֺתַי
  choice: 我的诫命
  rationale: “诫命”准确传达命令的权威性，并符合现代中文圣经语体。
- source_word: וֶחְיֵה
  choice: 便可存活
  rationale: חיה的命令式前有连接词，既可按并列命令理解，也可表达遵守诫命所带来的结果；正文采用自然中文的结果表达，并以脚注保留较直译的可能。
theological_decisions:
- issue: “谨守诫命”与“存活”之间的关系
  choice: 便可存活
  alternative: 并且活下去
  rationale: 希伯来文只用连接词וְ连接两个命令式，没有明说这是目的、应许还是并列劝勉。正文采用语境中自然的结果表达，但脚注保留形式上更直接的并列译法，避免把神学关系限定得过细。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“教导”“紧紧持守”“谨守”“诫命”保留智慧训诲的权威语气，同时避免过度古雅。标点和语序按自然中文调整。
