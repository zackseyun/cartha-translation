  text: בְּ/דֶ֣רֶךְ חָ֭כְמָה הֹרֵתִ֑י/ךָ הִ֝דְרַכְתִּ֗י/ךָ בְּ/מַעְגְּלֵי יֹֽשֶׁר־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/011.yaml
  text: I have instructed you in the way of wisdom[a]; I have led you in paths of uprightness.
translation:
  language: zh_hans
  text: 我已在智慧的道路上教导你，也引导你走正直的路径[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “正直的路径”也可译作“笔直的路径”。希伯来语“正直”兼有道路笔直和品行正直的含义。
    reason: 保留יֹשֶׁר在空间意义与伦理意义之间的双重意涵。
lexical_decisions:
- source_word: בְּדֶרֶךְ חָכְמָה
  choice: 在智慧的道路上
  rationale: “דֶּרֶךְ”本指道路，在《箴言》中也常比喻人生的行径或生活方式；此译保留道路意象，并自然表达它与“智慧”的关系。
- source_word: הֹרֵתִיךָ
  choice: 我已……教导你
  rationale: 该词是ירה的使役式完成态，可表示教导、指示；“教导”符合智慧文学中父辈训诲的语境，“已”体现已实施的行动。
- source_word: הִדְרַכְתִּיךָ
  choice: 也引导你走
  rationale: 该词是דרך的使役式，表示带领或引导人行路；“引导你走”既自然，又保留原文的行走意象。
- source_word: בְּמַעְגְּלֵי
  choice: 路径
  rationale: “מַעְגָּל”可指车辙、轨道或路径；译作“路径”与前句“道路”构成平行，同时保留原文复数所表达的多条行进路线这一概念。
- source_word: יֹשֶׁר
  choice: 正直
  rationale: 该词兼有笔直与正直之意；正文采用符合《箴言》伦理语境的“正直”，脚注保留其空间性的“笔直”意象。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“道路—路径”“教导—引导”保留希伯来诗句的平行结构与行路隐喻；用“也”使两个分句的承接在中文中更自然。
