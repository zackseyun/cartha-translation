base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/008.yaml
  text: Prize her highly[a], and she will exalt you[b]; she will honor you when you embrace her.
translation:
  language: zh_hans
  text: 珍爱她[a]，她就高举你；她必使你得尊荣，当你拥抱她[b]时。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“推崇她”或“珍视她”。句首动词较为罕见，可含珍视、爱惜或推崇智慧之意。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文也可译作：“她必使你得尊荣，因为你拥抱她。”这里的连接词既可按情境、时间理解，也可按原因理解。
    reason: lexical_alternative
lexical_decisions:
- source_word: סַלְסְלֶהָ
  choice: 珍爱她
  rationale: 该动词罕见，语境中以阴性“智慧”为宾语，可表达珍视、爱惜或推崇。“珍爱”自然保留重视并亲近智慧的含义，也避免与下句“高举”重复。
- source_word: וּתְרוֹמְמֶךָ
  choice: 她就高举你
  rationale: רומם意为抬高、高举或使尊贵；阴性主语承接拟人化的“智慧”。“高举”既保留意象，也体现地位与尊荣的提升。
- source_word: תְכַבֵּדְךָ
  choice: 她必使你得尊荣
  rationale: כבד的Piel词形在此表示给予尊重或尊荣。“使你得尊荣”符合现代汉语，并避免“荣耀你”可能带来的过强宗教色彩。
- source_word: כִּי
  choice: ……时
  rationale: כִּי常可表示“因为”，但在本语境也可理解为引出智慧使人得尊荣的情境。正文采用自然的时间表达，同时以脚注保留因果理解。
- source_word: תְחַבְּקֶנָּה
  choice: 你拥抱她
  rationale: חבק意为拥抱。直译能延续把智慧拟人化为女性的诗性形象，也表达主动亲近并持守智慧。
theological_decisions:
- issue: 智慧的女性拟人化
  choice: 全句以“她”指智慧，并保留“拥抱”的拟人意象
  alternative: 将“她”改为“智慧”，或把“拥抱”解释为“持守”
  rationale: 希伯来文使用阴性代词和直接的拥抱意象；保留拟人手法较忠实，也不额外加入特定神学身份判断。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“珍爱—高举—得尊荣—拥抱”保留原文的诗性平行和智慧女性拟人化，同时用脚注呈现罕见动词及כִּי的真实歧义。
