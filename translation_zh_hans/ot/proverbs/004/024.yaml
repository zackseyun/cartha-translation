  yaml_path: translation/ot/proverbs/004/024.yaml
  text: Put away crookedness of mouth from you[a], and put devious lips far from you.
translation:
  language: zh_hans
  text: 要除掉你口中的乖谬[a]，使诡诈的嘴唇远离你。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“除掉乖谬的口……和偏邪的嘴唇。”原文两处名词都描述在道德上扭曲、不正的言语。
    reason: lexical_alternative
lexical_decisions:
- source_word: הָסֵר
  choice: 要除掉
  rationale: 使役命令式，要求主动除去；“要除掉”在现代汉语中自然，并保留劝诫的命令力度。
- source_word: מִמְּךָ
  choice: 你……中的
  rationale: 介词加第二人称单数后缀表示与受劝者分离；结合“口中的”表达，使中文通顺，同时保留个人必须弃绝这种言语的含义。
- source_word: עִקְּשׁוּת
  choice: 乖谬
  rationale: 抽象名词指弯曲、悖谬或道德上的扭曲；“乖谬”能用于言语，且保留原文的道德隐喻。
- source_word: פֶּה
  choice: 口
  rationale: 按字面译作“口”，保留与下半句“嘴唇”的身体部位意象及诗歌平行。
- source_word: וּלְזוּת
  choice: 诡诈
  rationale: 该名词表示言语的扭曲、偏邪或欺诈；“诡诈”自然地描述由嘴唇发出的言语，又与上句“乖谬”形成近义而不完全重复的平行。
- source_word: שְׂפָתַיִם
  choice: 嘴唇
  rationale: 保留原文具体意象，不将其抽象化为“言语”，并对应上句的“口”。
- source_word: הַרְחֵק
  choice: 使……远离
  rationale: 使役命令式，意为使之远去或保持距离；“使……远离”准确表达主动排除，并体现比“除掉”更鲜明的距离意象。
- source_word: מִמֶּךָ
  choice: 远离你
  rationale: 表示与第二人称单数受劝者分离；与“使……远离”搭配自然。
