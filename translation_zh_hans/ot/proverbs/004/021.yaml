base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/021.yaml
  text: Do not let them depart from your eyes[b][a]; keep them within your heart.
translation:
  language: zh_hans
  text: 不要让它们离开你的眼前[a]；要把它们存记在你心中[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不要让它们离开你的视线。”
    reason: lexical_alternative
  - marker: b
    text: 这里的“心”指人的内在，包括思想、意志和情感。
    reason: cultural_note
lexical_decisions:
- source_word: אַל
  choice: 不要
  rationale: 这是表示禁止的否定词；“不要”符合现代汉语的自然表达。
- source_word: יַלִּיזוּ
  choice: 让它们离开
  rationale: לוז 在此有偏离、离开的意思；结合上下文，所指是父亲的话和教诲不可离开人的视线。“离开”保留原文动态意象，也不过度解释。
- source_word: מֵעֵינֶיךָ
  choice: 你的眼前
  rationale: 原文直译为“从你的眼睛”；“离开你的眼前”在现代汉语中自然，并保留持续注视、留意的具体意象。
- source_word: שָׁמְרֵם
  choice: 把它们存守
  rationale: שׁמר 可表达保守、看守、保存；“存守”在此兼顾珍藏于内心和谨慎守护两层含义。
- source_word: בְּתוֹךְ
  choice: 在……中
  rationale: 表示在内部、在当中；配合“心”译为“在你心中”，简洁自然。
- source_word: לְבָבֶךָ
  choice: 你心中
  rationale: לֵבָב 在希伯来语中指人的内在，包括思想、意志和情感；“心”保留原文的核心隐喻，具体含义由脚注说明。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“眼前”保留希伯来文的视觉意象；“存守”既表达保存，也带有谨慎守护之意。脚注标记按其在正文中所注释词语的顺序排列。
