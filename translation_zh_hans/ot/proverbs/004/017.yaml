  text: כִּ֣י לָ֭חֲמוּ לֶ֣חֶם רֶ֑שַׁע וְ/יֵ֖ין חֲמָסִ֣ים יִשְׁתּֽוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/017.yaml
  text: For they eat the bread of wickedness[b][a], and drink the wine of violence.
translation:
  language: zh_hans
  text: 因为他们吃邪恶的饼，喝暴力的酒。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “暴力”原文为复数形式，也可理解为“种种暴行”；这里用单数抽象名词表达其集合或强化的含义。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文对恶人道路的警告，说明其缘由；现代汉语用“因为”自然保留解释关系。
- source_word: לָחֲמוּ
  choice: 吃的是
  rationale: 此处动词来自 לחם II，意为“吃、食用”，并与下半句“喝”构成平行；译作“吃的是”也自然衔接后面的“邪恶之饼”。
- source_word: לֶחֶם רֶשַׁע
  choice: 邪恶之饼
  rationale: 保留“饼”的具体意象及其与“酒”的诗歌对应；“邪恶”表达 רֶשַׁע 在智慧文学中的道德含义。
- source_word: וְיֵין
  choice: 喝的是……酒
  rationale: 依照希伯来诗句的平行结构，把后置动词 יִשְׁתּוּ 在汉语中提前，使表达自然清楚。
- source_word: חֲמָסִים
  choice: 暴力
  rationale: 原文为复数形式，可表示汇集或加强的暴行概念；汉语以抽象名词“暴力”最为自然。
- source_word: יִשְׁתּוּ
  choice: 喝
  rationale: 直接表达饮用，并与前半句的“吃”形成整齐的诗歌平行。
theological_decisions:
- issue: “邪恶之饼／暴力之酒”的关系含义
  choice: 保留原文隐喻，不明确解释为靠邪恶为生、以邪恶为乐或邪恶所得之食物
  alternative: 意译为“他们以作恶为生，以暴力为乐”
  rationale: 原文的属格结构具有浓缩的诗性，可能兼含食用、滋养、习以为常或所得来源等意味；直译可避免把神学和伦理含义限定为单一解释。
translation_notes:
  register: 采用现代、庄重而易懂的智慧诗歌语体。“吃的是……喝的是……”符合普通话习惯，同时保留“邪恶之饼／暴力之酒”的具体隐喻和平行结构。
