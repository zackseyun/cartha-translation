base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/020.yaml
  text: My son[a], pay attention to my words[b]; incline your ear to my sayings.
translation:
  language: zh_hans
  text: 我儿，要留心听我的话[a]；侧耳听我的言语[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“要专心听我的话。”
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“倾斜你的耳朵”，意为仔细聆听。
    reason: cultural_note
lexical_decisions:
- source_word: בְּנִי
  choice: 我儿
  rationale: 这是父亲或师长对男性儿子的单数呼语；“我儿”既保留原文的性别与关系，也符合汉语智慧文学的庄重语体。
- source_word: לִדְבָרַי
  choice: 我的话
  rationale: דברים 在这里指说话者的教导；“我的话”自然清楚，并与下半句的“我的言语”形成近义平行。
- source_word: הַקְשִׁיבָה
  choice: 要留心听
  rationale: 该使役词形的命令语气要求主动、专心地听；“留心听”比单说“听”更充分表达其力度。
- source_word: לַאֲמָרַי
  choice: 我的言语
  rationale: אמרים 与 דברים 意义相近但用词有别；译作“言语”可保留诗句的近义平行而不将两者完全同化。
- source_word: הַט אָזְנֶךָ
  choice: 侧耳听
  rationale: 直译为“倾斜你的耳朵”，是专心聆听的形象化说法；“侧耳听”保留身体意象，同时是自然的现代汉语。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“我儿”保留智慧文学中父亲或师长训诲儿子的称呼；分号呈现希伯来诗歌两个平行分句。脚注标记按其实际说明对象放置，以避免把词义备选误系于称呼语。
