  text: כִּ֤י לֹ֣א יִֽ֭שְׁנוּ אִם לֹ֣א יָרֵ֑עוּ וְֽ/נִגְזְלָ֥ה שְׁ֝נָתָ֗/ם אִם לֹ֥א יכשולו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/016.yaml
  text: For they do not sleep unless they have done evil[a], and their sleep is taken away unless they make someone stumble.
translation:
  language: zh_hans
  text: 因为他们若不作恶，就无法入睡；若不使人跌倒[a]，他们的睡眠就被夺去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“除非他们自己跌倒。”希伯来文形式简略，既可被理解为使别人跌倒，也可被理解为他们自己跌倒；上下文较支持前者。
    reason: 保留希伯来文在使别人跌倒与自己跌倒之间的解释可能。
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，说明不可走恶人之路的缘由，保留原文的因果关系。
- source_word: לֹא יִשְׁנוּ אִם לֹא
  choice: 若不……，就无法入睡
  rationale: 原文直译为“不……就不睡”；在此描述恶人非作恶便不得安睡的惯常状态，中文用“无法入睡”自然清楚，同时保留条件结构。
- source_word: יָרֵעוּ
  choice: 作恶
  rationale: 该动词可指行恶或加害；原文未明说受害对象，因此采用范围较广的“作恶”，不擅自限定为伤害某人。
- source_word: וְנִגְזְלָה שְׁנָתָם
  choice: 他们的睡眠就被夺去
  rationale: 保留原文被动语态及“夺取”的鲜明意象，而不弱化为单纯的“睡不着”。
- source_word: יכשולו
  choice: 使人跌倒
  rationale: 结合与“作恶”的平行关系及上下文，正文采用使役理解；“跌倒”保留原文比喻，不将其限定为身体上的摔倒。
theological_decisions:
- issue: יָרֵעוּ 未明说的受事对象
  choice: 笼统译作“作恶”
  alternative: “加害于人”或“伤害别人”
  rationale: 原文没有宾语，不宜在译文中加入特定受害者；下一分句才进一步描写使人跌倒。
- issue: יכשולו 的语态和所指
  choice: 按上下文译作“使人跌倒”
  alternative: “他们自己跌倒”
  rationale: 与前句“作恶”的平行及箴言的语境较支持恶人使别人跌倒；不过所给希伯来文形式简略，可能被理解为他们自己跌倒，故在脚注保留另一读法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“无法入睡”使首句条件关系符合中文习惯；“睡眠就被夺去”则保留第二句较强烈的希伯来语意象。
