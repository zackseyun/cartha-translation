base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/001.yaml
  text: Hear[a], sons, a father's instruction, and pay attention to know understanding.
translation:
  language: zh_hans
  text: 儿子们哪，要听父亲的训诲；要留心，好得着悟性。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שִׁמְעוּ
  choice: 要听
  rationale: 复数祈使式，不仅指听见，也带有专心听从的意味；“要听”简洁保留了智慧教导中的命令语气。
- source_word: בָנִים
  choice: 众子
  rationale: 原文为阳性复数“儿子们”。“众子”保留父亲对儿子说话的箴言框架，同时保持庄重而简洁的称呼。
- source_word: מוּסַר
  choice: 训诲
  rationale: 该词可涵盖教导、管教和纠正；“训诲”在本节的教导语境中自然，也保留塑造与规正的意味。
- source_word: אָב
  choice: 父亲的
  rationale: 原文为不定的属格结构，意为“一位父亲的”，并非“我父亲的”；汉语通常无需另加“一位”。
- source_word: וְהַקְשִׁיבוּ
  choice: 要留心
  rationale: 此复数祈使式强调专注、侧耳听取；“留心”与前面的“听”形成适当区分。
- source_word: לָדַעַת
  choice: 好懂得
  rationale: 介词 ל 加不定式可表达目的；“好懂得”以自然汉语呈现“为要认识、懂得”的目的意味。
- source_word: בִּינָה
  choice: 明辨
  rationale: 这是箴言中的核心智慧词，指理解、洞察和辨别能力；“明辨”比泛泛的“明白”更能体现其辨识意味。
theological_decisions:
- issue: 智慧教导中的性别化称呼
  choice: 众子
  alternative: 孩子们
  rationale: 希伯来文明确使用阳性复数，并保留父亲对儿子的教导框架；脚注说明也可按代表性意义理解为“孩子们”，而不在正文中消除原文的性别形式。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“众子啊”保留原文的家庭教导场景；分号呈现两个并列的复数命令。“好懂得明辨”保留目的关系，也避免把“明辨”具体化为原文未明说的某种知识。
