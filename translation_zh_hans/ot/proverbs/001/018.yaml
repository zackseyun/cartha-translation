  text: וְ֭/הֵם לְ/דָמָ֣/ם יֶאֱרֹ֑בוּ יִ֝צְפְּנ֗וּ לְ/נַפְשֹׁתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/018.yaml
  text: But they lie in wait for their own blood[b][a]; they set an ambush for their own lives.
translation:
  language: zh_hans
  text: 他们却埋伏着，要流自己的血[a]；他们隐藏起来，要害自己的性命[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“为自己的血埋伏”。译文以“要流自己的血”使汉语通顺，仍保留“血”的具体意象，以及他们的暴行终必反过来使自己丧命的讽刺。
    reason: lexical_alternative
  - marker: b
    text: 或译：“他们为自己的性命隐藏起来。”原文动词本义为“隐藏、藏匿”；在这里与“埋伏”平行，可能指隐蔽地设伏。
    reason: alternative_reading
lexical_decisions:
- source_word: וְהֵם
  choice: 他们却
  rationale: 连词与独立代词合用，在上下文中与前一节形成反差；“却”自然表达转折，并保留明确的复数主语。
- source_word: לְדָמָם
  choice: 要流自己的血
  rationale: 保留“血”的具体意象，并以现代汉语可理解的方式表达介词结构；“自己的”凸显恶人的暴行最终反噬自身。
- source_word: יֶאֱרֹבוּ
  choice: 埋伏
  rationale: 该动词通常指埋伏等候、伺机袭击；“埋伏”简洁地保留其捕猎和伏击意味。
- source_word: יִצְפְּנוּ
  choice: 暗中潜伏
  rationale: 该词本义涉及隐藏、藏匿；在与“埋伏”平行的语境中，“暗中潜伏”既体现隐蔽性，也不与前一动词完全合并。
- source_word: לְנַפְשֹׁתָם
  choice: 要害自己的性命
  rationale: נֶפֶשׁ在此暴力与死亡的语境中指生命或性命；“自己的性命”保留行为反过来危害自身的讽刺。
theological_decisions:
- issue: 恶人的暴力是否被直译为有意自害
  choice: 保留经文表面的反身表达，以“自己的血”“自己的性命”呈现其行为反噬自身的智慧文学讽刺
  alternative: 将其解释性地译为“他们终将自取灭亡”
  rationale: 原文没有明说他们主观上意图自杀，而是以强烈反讽揭示其伏击最终针对自己；译文不应把这一张力化约为抽象结论。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“要流自己的血”保留希伯来语鲜明而反讽的意象；两个分句分别使用“埋伏”和“暗中潜伏”，维持平行结构，同时反映两个希伯来动词的词义差别。
