  text: My son[a], do not walk in the way with them; keep your foot from their path.
translation:
  language: zh_hans
  text: 我儿，不要跟他们走同一条路[a]；你的脚要远离他们的路径。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “跟他们走同一条路”也可译作“与他们同行”。原文的“道路”既可指实际的路，也常在智慧文学中比喻人的生活方式。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנִי
  choice: 我儿
  rationale: 保留带第一人称单数后缀的阳性单数呼语，并符合《箴言》中父亲对儿子的训诲语境；现代中文简洁庄重。
- source_word: אַל תֵּלֵךְ
  choice: 不要……同行
  rationale: אַל与未完成式表达禁止；הלך既可指行走，也可隐喻生活行为。“同行”在此自然表达与恶人共同走上某种道路。
- source_word: בְּדֶרֶךְ אִתָּם
  choice: 与他们同行一路
  rationale: דרך兼有实际道路与人生道路之义；此译保留道路意象以及智慧文学中的行为隐喻，同时表达אִתָּם的“与他们一起”。
- source_word: מְנַע
  choice: 要使……远离
  rationale: 该祈使式要求主动拦阻或约束。汉语“使你的脚远离”自然表达刻意避免之意。
- source_word: רַגְלְךָ
  choice: 你的脚
  rationale: 保留原文单数和身体意象，与后面的“路径”构成鲜明的行路比喻。
- source_word: מִנְּתִיבָתָם
  choice: 远离他们的路径
  rationale: נתיבה指小径、路径；与前面的דרך形成近义平行而非机械重复，מן所表达的分离关系由“远离”体现。
