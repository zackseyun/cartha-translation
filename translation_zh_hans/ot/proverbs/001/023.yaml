  text: תָּשׁ֗וּבוּ לְֽ/ת֫וֹכַחְתִּ֥/י הִנֵּ֤ה אַבִּ֣יעָה לָ/כֶ֣ם רוּחִ֑/י אוֹדִ֖יעָה דְבָרַ֣/י אֶתְ/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/023.yaml
  text: Turn at my rebuke[a]; behold, I will pour out my spirit to you[b]; I will make my words known to you.
translation:
  language: zh_hans
  text: 你们要因我的责备回转[a]；看哪，我要向你们倾注我的灵[b]，使你们明白我的话。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你们要转向我的劝诫”，或“你们要因我的责备悔改”。
    reason: lexical_alternative
  - marker: b
    text: “我的灵”也可按语境理解为“我的心意”“我的思想”或“我内心所想的”。有些读者认为这在更广的正典中可使人联想到上帝的灵；不过，本节直接呈现的是拟人化的智慧在说话。
    reason: alternative_reading
lexical_decisions:
- source_word: תָּשׁוּבוּ
  choice: 回转
  rationale: שוב在此呼吁听众改变原来的方向；“回转”保留具体的转向意象和道德意味，又不额外加入“悔改”可能携带的较完整神学含义。
- source_word: לְתוֹכַחְתִּי
  choice: 因我的责备
  rationale: תּוֹכַחַת可指责备、劝诫或管教；介词ל与שוב连用时，表示回应责备而转向。“因我的责备”在现代汉语中自然，并保留因责备而作出回应的关系。
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留原文提示听者注意下文的语篇功能，也符合智慧文学庄重而有呼召力的语体。
- source_word: אַבִּיעָה
  choice: 倾吐
  rationale: נבע的基本意象是涌流、流出；与“我的心意”搭配时，“倾吐”既保留丰沛流出的形象，也符合现代汉语表达。
- source_word: רוּחִי
  choice: 我的心意
  rationale: רוּחַ可表示风、气息、灵，也可在此指说话者内在的思想、意向或性情。鉴于上下文是拟人化的智慧在发言，“心意”能自然表达其内在所思所愿，同时脚注保留“灵”的直译及其可能的正典共鸣。
- source_word: אוֹדִיעָה
  choice: 使……明白
  rationale: ידע的使役形式意为“使知道、使认识”。“使你们明白”准确表达使役意义，也比生硬的“使……知道”更符合现代汉语。
- source_word: דְבָרַי
  choice: 我的话
  rationale: דבר在此指智慧所说的教导；“我的话”直接保留其言语和训诲性质。
- source_word: לָכֶם ... אֶתְכֶם
  choice: 向你们……使你们
  rationale: 分别按两个动词在汉语中的自然配价处理，同时保留复数听众的直接受话关系。
theological_decisions:
- issue: 拟人化智慧所说“רוּחִי”的含义
  choice: 正文译作“我的心意”，指拟人化智慧内在的思想、意向或性情
  alternative: 直译为“我的灵”，并可能在更广的正典阅读中使人联想到上帝的灵
  rationale: 本节直接的文学说话者是拟人化的智慧，希伯来文并未明确说“上帝的灵”或“圣灵”。正文采用自然且合乎语境的“心意”，脚注同时保留“我的灵”的直译，不排除更广的正典共鸣，也不把该共鸣当作本节明说的身份认定。
translation_notes:
  register: 采用现代、庄重而清晰的普通话。“回转”保留智慧呼召中的方向性意象；“看哪”保留原文的强调标记；后半句用“倾吐我的心意”呈现涌流隐喻，同时通过脚注保存רוּחִי的形式对应和神学张力。
