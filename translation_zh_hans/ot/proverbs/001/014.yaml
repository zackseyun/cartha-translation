  yaml_path: translation/ot/proverbs/001/014.yaml
  text: Throw in your lot among us[b][a]; we will all have one purse.
translation:
  language: zh_hans
  text: 来加入我们；我们大家共有一个钱袋。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גּוֹרָלְךָ תַּפִּיל
  choice: 你只管加入
  rationale: 原文直译是“把你的签投入”，在此构成邀请对方与团伙同伙、同享所得的习语。现代汉语若直译为“投下你的签”容易被误解为抽签，因此正文表达其语境含义，并在脚注保留原有意象。
- source_word: בְּתוֹכֵנוּ
  choice: 我们
  rationale: 本义为“在我们中间”；与“加入”搭配后，“加入我们”是自然、准确的现代汉语表达。
- source_word: כִּיס
  choice: 钱袋
  rationale: 该词指盛钱的袋或囊。“钱袋”既明确用途，也保留古代实物意象。
- source_word: אֶחָד
  choice: 一个
  rationale: 保留“一个”的数量强调，表明众人将财物归入同一钱袋。
- source_word: יִהְיֶה לְכֻלָּנוּ
  choice: 大家共用
  rationale: 原文直译为“将归我们所有／将为我们大家所有”。“大家共用”自然传达共同占有同一个钱袋及其中财物的意思。
theological_decisions: []
translation_notes:
  register: 采用现代、简洁而庄重的劝诱口吻。“你只管”体现说话者拉拢对方的语气；“共用一个钱袋”清楚表达团伙共同占有所得，同时不增加原文未明说的分赃细节。
