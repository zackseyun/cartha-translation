  yaml_path: translation/ot/proverbs/001/010.yaml
  text: My son[a], if sinners entice you[b], do not consent.
translation:
  language: zh_hans
  text: 我儿，罪人若引诱你，不要答应。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנִי
  choice: 我儿
  rationale: 保留希伯来文阳性单数的父辈式称呼；“我儿”简洁庄重，也符合《箴言》训诲语体。
- source_word: אִם
  choice: 若
  rationale: 准确表达假设条件；“若”在现代汉语中仍自然，并适合智慧文学的凝练文体。
- source_word: יְפַתּוּךָ
  choice: 引诱你
  rationale: 该动词在此指诱使人走上错误道路；“引诱”既呈现操纵和道德危险，也不把词义局限为性诱惑。
- source_word: חַטָּאִים
  choice: 罪人
  rationale: 直接表达实词化复数名词，即以犯罪作恶为特征的人；汉语可由上下文自然理解为复数。
- source_word: אַל תֹּבֵא
  choice: 不要答应
  rationale: אבה表示愿意、同意；在罪人发出邀请的语境中，“不要答应”自然准确，同时涵盖不可同意或顺从其邀约。
