  text: We will find all precious wealth[b][a]; we will fill our houses with plunder.
translation:
  language: zh_hans
  text: 我们必找到一切贵重的财物[a]；我们必用掠夺来的财物[b]装满我们的房屋。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“值钱的财富”或“贵重的资财”。
    reason: lexical_alternative
  - marker: b
    text: 或译“战利品”；希伯来语שָׁלָל指抢掠所得的财物。
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל
  choice: 一切
  rationale: 保留该量词全面、夸张的语气，符合恶人对所得财物的狂妄许诺。
- source_word: הוֹן יָקָר
  choice: 贵重的财物
  rationale: הוֹן泛指物质财富，יָקָר表示贵重、有价值；合译为“贵重的财物”，自然且保留原文搭配。
- source_word: נִמְצָא
  choice: 我们必找到
  rationale: 按מצא的基本义译为“找到”；“必”表达这一连串邀请之语中自信而笃定的语气，不将其改释为较宽泛的“获得”。
- source_word: נְמַלֵּא
  choice: 装满
  rationale: 保留“使……充满”的使动意象；中文用“把掠物装满我们的房屋”清楚呈现房屋被赃物填满的画面。
- source_word: בָתֵּינוּ
  choice: 我们的房屋
  rationale: 直译בית的具体空间意象；相较“家里”，“房屋”更突出储放掠物的场所。
- source_word: שָׁלָל
  choice: 掠物
  rationale: 指通过抢掠取得的财物；“掠物”简洁、庄重，并准确体现其暴力和非法来源。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“必……装满……”保留恶人邀约中自信夸口的节奏；“掠物”避免“赃物”可能带入的现代法律术语色彩。脚注标记分别置于所解释的“贵重的财物”和“掠物”之后。
