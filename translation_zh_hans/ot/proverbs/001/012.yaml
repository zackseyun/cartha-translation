  text: נִ֭בְלָעֵ/ם כִּ/שְׁא֣וֹל חַיִּ֑ים וּ֝/תְמִימִ֗ים כְּ/י֣וֹרְדֵי בֽוֹר׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/012.yaml
  text: Let us swallow them alive like Sheol[a], and whole like those who go down to the pit[b];
translation:
  language: zh_hans
  text: 我们要像阴间[a]一样活活吞下他们；要把他们囫囵吞下，如同那些下坑的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “阴间”指希伯来观念中死人所在的领域；也可译作“坟墓”。
    reason: lexical_alternative
lexical_decisions:
- source_word: נִבְלָעֵם
  choice: 我们要……吞下他们
  rationale: 该词是动词 בלע 的 Qal 鼓励式第一人称复数，并带第三人称复数宾语后缀；译文保留共同谋划、彼此怂恿的语气，也保留“吞下”的强烈意象。
- source_word: כִּשְׁאוֹל
  choice: 像阴间一样
  rationale: שְׁאוֹל 指希伯来观念中的死人之境。中文“阴间”既较自然，又比“坟墓”更能保留其作为死亡领域的诗歌意象。
- source_word: חַיִּים
  choice: 活活
  rationale: 此处形容受害者被吞下时仍然活着；“活活吞下”是现代汉语中自然且有力度的表达。
- source_word: וּתְמִימִים
  choice: 他们完整无缺
  rationale: תמים 在这里与吞噬、下坑的意象并列，较可能表示完整、完好，而不是道德上的无可指责。独立分句保留希伯来诗句的省略和张力。
- source_word: כְּיוֹרְדֵי בוֹר
  choice: 如同下坑的人
  rationale: 保留“下”和“坑”的具体诗歌图像；分词表达正在下去或通常被视为下坑的一类人，不将其窄化为普通坟墓。
theological_decisions:
- issue: שְׁאוֹל 的译法
  choice: 阴间
  alternative: 坟墓；死亡
  rationale: “阴间”保留其作为死人领域的含义，同时不把它过早限定为实体坟墓，也不将其抽象化为“死亡”。
- issue: תְמִימִים 在本节中的含义
  choice: 完整无缺
  alternative: 纯全；无辜；安然无恙
  rationale: 上下文描写暴力吞噬，主要强调受害者完整地被吞没；译文不在此处加入对其道德品格的判断。
- issue: 后半句的省略结构
  choice: 他们完整无缺，却如同下坑的人
  alternative: 把他们整个吞下，如同下坑的人
  rationale: 原文后半句没有重复“吞下”这一动词。译文以分号和“却”呈现承接关系，避免补入过多动作，同时保留完整活人转眼如同下坑者的诗意张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“活活吞下”保留原文凶狠的捕食意象；后半句维持简洁的诗歌省略。脚注标记均已置于正文对应词语之后。
