  text: יִשְׁמַ֣ע חָ֭כָם וְ/י֣וֹסֶף לֶ֑קַח וְ֝/נָב֗וֹן תַּחְבֻּל֥וֹת יִקְנֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/005.yaml
  text: Let the wise man hear and increase in learning[b][a], and the discerning man acquire guidance.
translation:
  language: zh_hans
  text: 智慧人要听，并增长学识[a]；明辨的人要获得指引[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“智慧人会听，并增添所学”；希伯来文的未完成式也可作陈述理解，这里依照训诲语境译作劝勉。
    reason: alternative_reading
  - marker: b
    text: “指引”也可译作“明智的劝导”“谋略”或“方略”；原词含有掌舵、导向的意象。
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׁמַע
  choice: 要听
  rationale: 该词为第三人称阳性单数未完成式，既可作陈述，也可在训诲语境中表达劝勉。译作“要听”自然呈现此处的劝勉语气，并以脚注保留陈述式理解。
- source_word: חָכָם
  choice: 智慧人
  rationale: 保留希伯来文单数代表性称谓；现代汉语“智慧人”简洁、庄重，也适合智慧文学语境。
- source_word: וְיֹסֶף
  choice: 并增长
  rationale: יסף的基本义是“增加、增添”；与“学识”搭配时，“增长”符合现代汉语表达。
- source_word: לֶקַח
  choice: 学识
  rationale: 该词可指所领受的教导、学习所得或领受教训的能力。此处承接“听”并受“增长”支配，译作“学识”较为自然，同时不局限于课堂知识。
- source_word: נָבוֹן
  choice: 明辨的人
  rationale: 该词指有理解力、能辨明事理的人。“明辨的人”比“聪明人”更准确地突出辨识和判断能力。
- source_word: תַּחְבֻּלוֹת
  choice: 指引
  rationale: 该复数名词源义带有掌舵、导向的意象，也可表示谋略、明智的劝导或处事方略。正文采用宽泛而自然的“指引”，脚注列出重要词义范围。
- source_word: יִקְנֶה
  choice: 要获得
  rationale: קנה在此意为取得、获得；与智慧资源相搭配时不宜按字面译为“购买”。“要获得”也与上半句的劝勉语气平行。
theological_decisions:
- issue: 两个未完成式的语气
  choice: 按劝勉式译为“要听……要获得”
  alternative: 按陈述式译为“会听……会获得”
  rationale: 希伯来文形式本身容许陈述性理解，但本段说明箴言用途，训诲语境支持劝勉式。脚注保留另一种真实可能，避免消除原文歧义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“智慧人”和“明辨的人”保留原文阳性单数的代表性形式，但汉语表达不额外强化性别。“增长学识”与“获得指引”保持两行平行。
