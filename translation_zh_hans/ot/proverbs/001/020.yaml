  text: חָ֭כְמוֹת בַּ/ח֣וּץ תָּרֹ֑נָּה בָּ֝/רְחֹב֗וֹת תִּתֵּ֥ן קוֹלָֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/020.yaml
  text: Wisdom cries aloud in the street[a]; in the squares she raises her voice.
translation:
  language: zh_hans
  text: 智慧在街上高声呼喊[a]，在广场上扬声。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“智慧在街上呼唤。”
    reason: 原词可表示响亮呼喊，也可较平实地表达呼唤；正文采用较有力度的译法，脚注保留较自然、较弱的词义选择。
lexical_decisions:
- source_word: חָכְמוֹת
  choice: 智慧
  rationale: 该词形态上为复数，但后接阴性单数动词，并有阴性单数代词后缀，表明这里是拟人化的单数抽象概念；汉语用“智慧”自然保留这一文学拟人。
- source_word: בַּחוּץ
  choice: 在街上
  rationale: 该词指户外或公共空间；结合下句“在广场上”的平行结构，译作“在街上”既自然，也凸显公开呼召的场景。
- source_word: תָּרֹנָּה
  choice: 高声呼喊
  rationale: רנן 在此表示声音响亮地发出；上下文是智慧向公众发出召唤，因此“高声呼喊”比“歌唱”更贴切，也比单纯“呼唤”更有力度。
- source_word: בָּרְחֹבוֹת
  choice: 在广场上
  rationale: 该词指城中的宽阔公共场所或广场；“广场”简洁、现代，并与前句的公共空间形成平行。
- source_word: תִּתֵּן קוֹלָהּ
  choice: 扬声
  rationale: 字面为“发出她的声音”。现代汉语“扬声”凝练而自然，既表达提高音量、让人听见，也避免生硬直译为“给出她的声音”。
theological_decisions:
- issue: 智慧的拟人化
  choice: 保留“智慧”作为具有女性语法指向的单数拟人形象，但不在中文正文中额外添加性别代词。
  alternative: 将其仅作为一般抽象概念处理，或明确解释为某一后来的神学位格。
  rationale: 希伯来文的阴性单数动词和代词后缀把智慧塑造成公开说话的文学人物。中文无需用“她”也能保留拟人效果；同时不把这一形象进一步等同于任何特定神学位格，以免超出本节文本。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“高声呼喊”与“扬声”保留诗句的递进和平行感；正文中的[a]与脚注对应。
