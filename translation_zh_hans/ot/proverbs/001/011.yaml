base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/011.yaml
  text: If they say[a], “Come with us, let us lie in wait for blood[b]; let us ambush the innocent without cause,”
translation:
  language: zh_hans
  text: 他们若说：“跟我们来吧！我们埋伏起来，要取人性命[a]；无故伏击[b]无辜的人。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“为了血”；这里的“血”简练地指流血杀人。
    reason: lexical_alternative
  - marker: b
    text: 这个动词更直译可作“藏起来”或“藏身”；在这里指隐藏起来伺机袭击。
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם יֹאמְרוּ לְכָה אִתָּנוּ
  choice: 他们若说：‘跟我们来吧’
  rationale: אִם保留为条件性的“若”；לְכָה אִתָּנוּ是邀请对方加入，译作“跟我们来吧”符合现代汉语口吻，也保留其怂恿意味。
- source_word: נֶאֶרְבָה
  choice: 我们埋伏起来
  rationale: 该动词表示潜伏等候袭击；“埋伏起来”既自然，又显出行动的预谋性。
- source_word: לְדָם
  choice: 要取人性命
  rationale: 希伯来文直译为“为了血”，在此是以“血”简练地指向流血杀人；正文采用现代汉语中清楚而有力度的表达，脚注保留其字面形式。
- source_word: נִצְפְּנָה
  choice: 伏击
  rationale: 词根本义可指隐藏或藏身；与前句“埋伏”平行，并以无辜者为目标，在本语境中表达藏身伺机袭击，因此译为“伏击”，同时以脚注说明较字面的译法。
- source_word: לְנָקִי
  choice: 无辜的人
  rationale: 形容词在此作名词用，指未曾加害、没有罪责而不应遭袭击的人；“无辜的人”准确保留其道德判断。
- source_word: חִנָּם
  choice: 无故
  rationale: 表示没有缘由或正当理由；“无故”简洁地突显这种暴力毫无正当性。
theological_decisions:
- issue: 受害者的道德性质
  choice: 无辜的人
  alternative: 清白的人；无罪的人
  rationale: 原文明确将目标描述为נָקִי，即不应受到这种伤害的人。“无辜的人”保留智慧训诲对不义暴力的谴责，同时不引入关于绝对无罪或其他教义性的判断。
translation_notes:
  register: 采用现代、简洁而庄重的劝诫语体。引语中的“跟我们来吧”呈现恶人拉拢同伙的直接口吻；后两分句保持希伯来诗句的平行推进，并用脚注保存原文“为了血”及“藏身”的表达层次。
