revisions:
- from: 但听从我的，必安然居住，安逸无忧，不怕灾祸。[a]
  to: 但凡听从我的人，必安然居住，免受对灾祸的恐惧搅扰。[a]
  rationale: 修订补足汉语泛指主语，使语句自然完整；并将末句明确译为免于“对灾祸的恐惧”，以更贴近 מִפַּחַד רָעָה，同时不把格言性的安全应许扩展为绝对不会遭遇灾祸的断言。保留“但”以体现与前文拒绝智慧者结局的对照，也保留第一人称，不在正文加入“智慧”的解释。
