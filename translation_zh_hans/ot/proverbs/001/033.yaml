  text: וְ/שֹׁמֵ֣עַֽ לִ֭/י יִשְׁכָּן בֶּ֑טַח וְ֝/שַׁאֲנַ֗ן מִ/פַּ֥חַד רָעָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/033.yaml
  text: But whoever listens to me will dwell securely and be at ease[a], without fear of disaster.
translation:
  language: zh_hans
  text: 但凡听从我的人，必安然居住，免受对灾祸的恐惧搅扰。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“但听从我的人必安居无虞，不受灾祸的惊恐搅扰。”
    reason: 词义与句法的另一种表达：שׁאנ可指安静、不受搅扰；מן可表示脱离或免于；פַּחַד רָעָה可译为“灾祸的恐惧”或“灾祸的惊恐”。
lexical_decisions:
- source_word: וְשֹׁמֵעַ לִי
  choice: 但听从我的
  rationale: שׁמע 与介词 ל 连用，在智慧文学中指留心并听从，不只是听见。句首 וְ 承接上文，与拒绝智慧者的结局形成对比，译作“但”。分词虽为阳性单数，在此具有泛指作用。
- source_word: יִשְׁכָּן
  choice: 必……居住
  rationale: שׁכן 表示居住、安居；与后面的 בֶּטַח 合译为自然的现代汉语“安然居住”。未额外补出地点。
- source_word: בֶּטַח
  choice: 安然
  rationale: בֶּטַח 表示安全、稳妥而无所惧怕；“安然”既保留安全感，也与“居住”搭配自然。
- source_word: וְשַׁאֲנַן
  choice: 安逸无忧
  rationale: שׁאנ 在此表示安静自在、不受搅扰。语境是正面的应许，不宜译成带贬义的“自满”或“安逸懈怠”。
- source_word: מִפַּחַד רָעָה
  choice: 不怕灾祸
  rationale: מן 在这里表达免于、远离；פחד 是惧怕或惊恐；רעה 按本段论及临到拒绝智慧者的灾难，指灾祸而非道德意义上的邪恶。合译“不怕灾祸”简洁自然。
theological_decisions:
- issue: 阳性单数分词所指的人群
  choice: 听从我的
  alternative: 听从我的人／凡听从我的人
  rationale: 希伯来语阳性单数分词在格言中可作泛指。汉语无须标明男性；省略显式主语仍自然表达任何听从者，不把应许限定于男性。
- issue: 人格化智慧作为说话者
  choice: 保留第一人称“我的”
  alternative: 听从智慧／听从我智慧的
  rationale: 本节延续上文智慧的直接发言。保留原文第一人称，避免在正文中加入解释性身份说明。
- issue: 应许的性质
  choice: 按原文保留肯定性的未来／结果表达“必”
  alternative: 可以／将会
  rationale: יִשְׁכָּן 的未完成式在格言语境中表达听从智慧者的确定结果。译文不进一步界定这是绝对免灾、一般性格言规律或末世应许，以保留经文本身的张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“安然居住，安逸无忧”保留希伯来诗句两个并列状态；“不怕灾祸”以自然汉语表达从恐惧中得释放。脚注标记置于正文句末。
