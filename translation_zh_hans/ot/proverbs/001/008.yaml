base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/008.yaml
  text: Hear[a], my son, your father's instruction[b], and do not forsake your mother's teaching.
translation:
  language: zh_hans
  text: 我儿，要听你父亲的训诲[a]，不可离弃你母亲的教导[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “训诲”也可译作“管教”；原词包括教导、纠正和训练，不单指惩罚。
    reason: lexical_alternative
  - marker: b
    text: “教导”也可译作“训诲”或“律法”；这里指母亲带有权威的教诲，并非正式的法律条文。
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמַע
  choice: 听从
  rationale: 祈使式在智慧文学中不只是听见，也表示留心领受，并含有遵从之意；“听从”在现代汉语中自然地保留这层语用力量。
- source_word: בְּנִי
  choice: 我儿
  rationale: 原文为明确的阳性单数称呼；“我儿”既保留父母对子辈劝诫的文学形式，也符合庄重而自然的箴言语体。
- source_word: מוּסַר
  choice: 管教
  rationale: 该词涵盖训诲、纠正和塑造性的纪律；“管教”比单纯的“教导”更能体现纠正与训练的成分，但并不必然指惩罚。
- source_word: אָבִיךָ
  choice: 你父亲的
  rationale: 按希伯来语构造关系译为现代汉语自然的领属结构。
- source_word: וְאַל
  choice: 不可
  rationale: 在并列劝诫中以“不可”简洁表达连接词与否定祈使语气；汉语无需机械补出“并且”。
- source_word: תִּטֹּשׁ
  choice: 离弃
  rationale: 该动词表示撇下、丢弃或放弃；“离弃”保留其较强的道德分量，不弱化为仅仅“忽视”。
- source_word: תּוֹרַת
  choice: 教导
  rationale: 此处是家庭智慧语境，指母亲带有权威的训导，并非特指正式法典；“教导”自然且不误导为摩西律法。
- source_word: אִמֶּךָ
  choice: 你母亲的
  rationale: 采用自然的领属表达，并与“你父亲的”形成原文所具有的平行结构。
theological_decisions:
- issue: 智慧文学中的男性子辈称呼
  choice: 我儿
  alternative: 我的孩子
  rationale: 原文在语法和修辞上均为阳性单数。保留“我儿”可呈现箴言中亲子训诫的具体文学场景，而不将其性别标记中性化。
- issue: 家庭语境中 תּוֹרָה 的含义
  choice: 教导
  alternative: 律法
  rationale: 这里与父亲的 מוּסַר 平行，所指是母亲权威性的训诲，不宜让读者误以为专指成文法律或摩西律法。
- issue: מוּסַר 的训诲与纪律双重含义
  choice: 管教
  alternative: 训诲
  rationale: “管教”较好地保留教导、纠正和品格训练的复合含义；脚注说明其范围，避免读者将其狭义理解为惩罚。
translation_notes:
  register: 采用现代、庄重、易懂的箴言体。“我儿”保留原文直接称呼；“要……不可……”形成平衡的劝诫句式。所有脚注标记均置于对应词语之后。
