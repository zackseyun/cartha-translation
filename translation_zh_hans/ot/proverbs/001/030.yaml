  text: לֹא אָב֥וּ לַ/עֲצָתִ֑/י נָ֝אֲצ֗וּ כָּל תּוֹכַחְתִּֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/030.yaml
  text: They were unwilling to accept my counsel[b][a]; they despised all my reproof.
translation:
  language: zh_hans
  text: 他们不肯听从我的劝告[a]，藐视我的一切责备[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们不愿接受我的劝告。”
    reason: lexical_alternative
  - marker: b
    text: “责备”也可译作“管教”或“纠正”。
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא אָבוּ
  choice: 不肯
  rationale: 否定词与动词 אָבָה 合起来表达不情愿或拒绝；“不肯”自然、简洁，并保留意志层面的意味。
- source_word: לַעֲצָתִי
  choice: 听从我的劝告
  rationale: עֵצָה 指劝告、谋略或忠告。介词结构依中文习惯译为“听从”，明确其所拒绝的是接受并遵从劝告，同时不把语气说得过重。
- source_word: נָאֲצוּ
  choice: 藐视
  rationale: 该动词表示带着轻蔑加以拒斥；“藐视”保留其强烈的蔑视意味，也符合智慧文学的庄重语体。
- source_word: כָּל
  choice: 一切
  rationale: 忠实表达整体性的量词意义；置于“责备”之前符合现代汉语习惯。
- source_word: תּוֹכַחְתִּי
  choice: 我的责备
  rationale: תּוֹכַחַת 可指责备、管教或纠正；“责备”在此自然庄重，并保留智慧发言中指出错误、要求改正的力量。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“不肯”保留原文的意志性拒绝，“藐视”则表现第二分句中更强的轻蔑态度。两个分句保持希伯来诗歌的平行结构。
