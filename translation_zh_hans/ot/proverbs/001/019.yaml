source:
  edition: WLC
  text: כֵּ֗ן אָ֭רְחוֹת כָּל בֹּ֣צֵֽעַ בָּ֑צַע אֶת נֶ֖פֶשׁ בְּעָלָ֣י/ו יִקָּֽח־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/019.yaml
  text: Such are the paths of everyone who gains unjust profit[a]; it takes away the life of its possessors.
translation:
  language: zh_hans
  text: 凡贪图不义之财的人，所走的道路都是这样；不义之财会夺去拥有它之人的性命。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“凡贪恋财利的人，所走的道路都是这样；财利会夺去拥有它之人的性命。”
    reason: lexical_alternative
lexical_decisions:
- source_word: כֵּן
  choice: 都是这样
  rationale: 承接上文对设伏流血者结局的描述，作总结性类比；“都是这样”在现代汉语中自然，也保留指示意味。
- source_word: אָרְחוֹת
  choice: 所走的路
  rationale: 保留智慧文学中“道路”所表达的生活方式与行为轨迹之隐喻，同时使句子符合现代汉语表达。
- source_word: כָּל
  choice: 凡……的人
  rationale: 与后面的分词连用，表达涵盖每一个此类之人的普遍范围；“凡……的人”简洁而庄重。
- source_word: בֹּצֵעַ בָּצַע
  choice: 贪图不义之财
  rationale: 动词分词与同根名词连用，强调逐利的贪欲；在本段谋财害命的语境中，所得带有不义性质。“贪图”也保留了该词组可侧重贪婪动机的含义。
- source_word: נֶפֶשׁ
  choice: 性命
  rationale: 此处指人的生命，而非特指非物质的“灵魂”；“夺去性命”准确传达致命后果。
- source_word: בְּעָלָיו
  choice: 占有者
  rationale: 阳性单数后缀最自然地回指前面的“财利”；“占有者”保留“拥有它的人”这一关系，同时避免把所指对象限定为合法财产。
- source_word: יִקָּח
  choice: 会夺去
  rationale: 以“不义之财”为主语，表达格言式、必然倾向的后果；“夺去”体现语境中的毁灭性，比单说“取走”更自然清楚。
theological_decisions:
- issue: 后半句的主语及代词所指
  choice: 把“不义之财”理解为“会夺去”性命的主语，并把“占有者”理解为占有这财的人
  alternative: 把贪财者理解为动词主语，或把后缀作其他回指
  rationale: 希伯来语动词为阳性单数，可与阳性单数的 בָּצַע（财利）呼应；紧凑语法和箴言中的反讽均支持“所得反噬得利者”的读法，但脚注保留词组本身可侧重贪婪的另一译法。
translation_notes:
  register: 采用现代、庄重且易懂的标准普通话。“所走的路”保留原文道路隐喻；“不义之财”契合谋财害命的近接语境，但以脚注保留 בֹּצֵעַ בָּצַע 可理解为“贪恋财利”的词义侧重。
