  text: וַ/תִּפְרְע֥וּ כָל עֲצָתִ֑/י וְ֝/תוֹכַחְתִּ֗/י לֹ֣א אֲבִיתֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/025.yaml
  text: but you ignored all my counsel[b][a], and you were unwilling to accept my reproof—
translation:
  language: zh_hans
  text: 反倒轻忽我一切的劝告[a]，不肯接受我的责备[b]——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不理会我一切的劝告”或“把我一切的劝告撇在一边”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“拒绝我的责备。”希伯来文更直译为：“不愿接受我的责备。”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּפְרְעוּ
  choice: 反倒轻忽
  rationale: פרע在此表示任由不顾、置之不理；“轻忽”既体现有意不加理会，又不像“拒绝”那样把语气强化。句首“反倒”结合上下文表达וַ的转折作用。
- source_word: כָל
  choice: 一切
  rationale: 准确表达全称量词כָל，并与“劝告”自然搭配。
- source_word: עֲצָתִי
  choice: 我的劝告
  rationale: עֵצָה在智慧文学语境中指明智的劝导；“劝告”现代、庄重而易懂，也不把词义限定为“计划”或“旨意”。
- source_word: וְתוֹכַחְתִּי
  choice: 我的责备
  rationale: תּוֹכַחַת指旨在纠正人的责备或训诫；“责备”保留其纠正性和严肃语气。
- source_word: לֹא אֲבִיתֶם
  choice: 不肯接受
  rationale: אָבָה的核心是愿意、乐意或同意；否定式强调主观上的不愿。“不肯接受”自然表达这种意志层面的拒绝，同时补足汉语所需的动宾关系。
theological_decisions: []
