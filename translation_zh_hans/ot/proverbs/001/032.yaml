  text: כִּ֤י מְשׁוּבַ֣ת פְּתָיִ֣ם תַּֽהַרְגֵ֑/ם וְ/שַׁלְוַ֖ת כְּסִילִ֣ים תְּאַבְּדֵֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/032.yaml
  text: For the turning away of the simple will kill them[a], and the complacency of fools will destroy them.
translation:
  language: zh_hans
  text: 因为愚蒙人的背离必害死他们；愚昧人的安逸自满必毁灭他们。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “背离”也可译作“偏离”或“背弃”；“安逸自满”也可译作“安逸”或“安稳自足”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，说明智慧警告所依据的原因；“因为”自然保留解释性的连接作用。
- source_word: מְשׁוּבַת
  choice: 背离正道
  rationale: 该词指转离、偏离或反叛；“背离正道”在箴言的智慧语境中自然清楚，也避免“背道”等词可能带入的后期教义色彩。
- source_word: פְּתָיִם
  choice: 愚蒙人
  rationale: 箴言中指容易受骗、尚未形成明辨力和道德定向的人；“愚蒙人”是庄重而常见的智慧文学用语，并非单指智力不足。
- source_word: תַּהַרְגֵם
  choice: 必杀害自己
  rationale: הרג直指杀死。希伯来语宾语是“他们”，中文以“自己”表达其背离所造成的自取灭亡，同时保持强烈后果。
- source_word: וְשַׁלְוַת
  choice: 安逸自满
  rationale: שַׁלְוָה可指安逸、平静无忧或安全感；此处处于愚昧人拒绝智慧的负面语境，“安逸自满”兼顾外在安逸与危险的自满意味。
- source_word: כְּסִילִים
  choice: 愚昧人
  rationale: 箴言中的固定智慧类别，主要指道德上顽梗、拒绝智慧的人，而非仅指智力低下。
- source_word: תְּאַבְּדֵם
  choice: 必毁灭自己
  rationale: אבד的使役强化形式表示使之灭亡、毁坏；“必毁灭自己”与上半句形成严整平行，并保留原文的严重性。
theological_decisions:
- issue: 毁灭的施事与受事关系
  choice: 用“自己”明确表达愚蒙人和愚昧人的行为或状态反过来导致其自身灭亡
  alternative: 直译为“必杀害他们……必毁灭他们”
  rationale: 原文中“背离”和“安逸”是语法主语，“他们”指相应的人群。中文若机械保留“他们”，容易造成指代不清；“自己”自然呈现原句的反身性后果，但不额外断定具体惩罚机制。
translation_notes:
  register: 采用现代、庄重且适合智慧文学的表达。“愚蒙人”和“愚昧人”保留箴言中两个不同的人物类别；句式保持上下两行的平行和警告力度。脚注标记置于整节末尾，涵盖两个具有语义幅度的词。
