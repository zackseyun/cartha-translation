  text: יַ֣עַן קָ֭רָאתִי וַ/תְּמָאֵ֑נוּ נָטִ֥יתִי יָ֝דִ֗/י וְ/אֵ֣ין מַקְשִֽׁיב׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/024.yaml
  text: Because I called and you refused[a], I stretched out my hand and no one paid attention,
translation:
  language: zh_hans
  text: 因为我呼唤，你们却不肯听；我伸出手来，却无人留意。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יַעַן
  choice: 因为
  rationale: 引出后续审判宣告的原因，保留希伯来文明确的因果关系，也符合现代汉语表达。
- source_word: קָרָאתִי
  choice: 我呼唤
  rationale: קרא在此指智慧发声召唤；“呼唤”既保留主动召唤的意味，也与上下文的公开劝告相称。
- source_word: וַתְּמָאֵנוּ
  choice: 你们却不肯听
  rationale: מאן本义为拒绝、不肯；结合前面的“呼唤”，补出“听”使汉语自然，并以“却”表达语境中的转折。
- source_word: נָטִיתִי יָדִי
  choice: 我伸出手来
  rationale: 保留“伸手”这一具体动作意象；“来”使现代汉语更顺畅，不限定该动作究竟表示恳请、招呼还是警告。
- source_word: וְאֵין מַקְשִׁיב
  choice: 却无人留意
  rationale: קשב的使役分词表示专心听、留意；“无人留意”自然地传达持续缺乏回应的情形，又不额外加入顺服的含义。
theological_decisions:
- issue: 智慧伸手这一动作的具体含义
  choice: 保留“我伸出手来”的形象，不解释其为邀请、恳求或警告
  alternative: 译成“我向你们招手”或“我伸手警告”
  rationale: 原文只陈述伸手动作，其修辞功能具有一定开放性；直译可保留这种含混和张力。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“不肯听”准确传达主动拒绝，并与“呼唤”形成清楚呼应；后半句用“留意”体现קשב所含的专注聆听意味。
