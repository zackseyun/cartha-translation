  text: תַּ֭חַת כִּי שָׂ֣נְאוּ דָ֑עַת וְ/יִרְאַ֥ת יְ֝הֹוָ֗ה לֹ֣א בָחָֽרוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/029.yaml
  text: Because they hated knowledge and did not choose the fear of Yahweh[b][a],
translation:
  language: zh_hans
  text: 因为他们恨恶知识，也不选择敬畏雅威[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “敬畏”在这里不只是害怕，也包括对神肃然尊崇并愿意顺服。
    reason: lexical_alternative
  - marker: b
    text: 原文使用神名יהוה（YHWH），这里译作“雅威”；传统汉语译本常译作“耶和华”或以“上主”代称。
    reason: alternative_reading
lexical_decisions:
- source_word: תַּחַת כִּי
  choice: 因为
  rationale: 这一组合在上下文中引出临到他们之结局的原因；现代汉语用“因为”最自然地表达其因果作用。
- source_word: שָׂנְאוּ
  choice: 他们恨恶
  rationale: שׂנא的基本义是“恨”；“恨恶”保留原文强烈的道德排斥意味，不弱化为一般的“不喜欢”或“拒绝”。
- source_word: דָעַת
  choice: 知识
  rationale: דעת在《箴言》中常指与智慧和道德教导相关的知识；“知识”是直接且适合本书语境的译法。
- source_word: יִרְאַת יְהוָה
  choice: 敬畏雅威
  rationale: “敬畏”保留希伯来语יִרְאָה兼含畏惧、尊崇与肃然顺服的张力；不单译作“尊敬”，以免削弱原文。
- source_word: יְהוָה
  choice: 雅威
  rationale: 原文直接使用四字神名；“雅威”以现代汉语常见音译保留其作为专名的性质，而不以称号替代。
- source_word: לֹא בָחָרוּ
  choice: 不选择
  rationale: בחר的基本义是“选择”；直译保留行为主体的意志和取舍意味，避免扩展成“拒绝接受”。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文是神的专名而非称号。采用“雅威”保留专名，并较贴近学界通常重建的读音；脚注说明原文形式。
- issue: יִרְאַת יְהוָה的含义
  choice: 敬畏雅威
  alternative: 尊崇雅威；惧怕雅威
  rationale: 这是智慧文学中的核心表达。“敬畏”能够同时容纳尊崇、畏惧及由此产生的顺服，不把其张力单向化。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语，与《箴言》的训诲语体相称。保留“恨恶—不选择”的并列结构及“敬畏”的神学张力；标点补为完整中文句号。
