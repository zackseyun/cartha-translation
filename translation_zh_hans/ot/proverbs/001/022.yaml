  text: עַד מָתַ֣י פְּתָיִם֮ תְּֽאֵהֲב֫וּ פֶ֥תִי וְ/לֵצִ֗ים לָ֭צוֹן חָמְד֣וּ לָ/הֶ֑ם וּ֝/כְסִילִ֗ים יִשְׂנְאוּ דָֽעַת־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/022.yaml
  text: How long[a], O simple ones[b], will you love simplicity? How long will scoffers delight in scoffing and fools hate knowledge?
translation:
  language: zh_hans
  text: '“愚昧人哪，你们喜爱愚昧，要到几时呢？[a]


    讥讽者以讥讽为乐，愚顽人恨恶知识，又要到几时呢？[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “愚昧人”和“愚昧”在希伯来语中是同根词；前者也可理解为“缺乏判断、容易受诱惑的人”。
    reason: 保留原文的同根双关，并说明该称谓并非单指智力不足，避免加入原文未明说的“保持无知”。
  - marker: b
    text: 希伯来文只在本节开头明说一次“要到几时”；这里按并列关系补出，使问语范围清楚。
    reason: 说明为使汉语范围清楚而补出的重复问语。
lexical_decisions:
- source_word: פְּתָיִם / פֶתִי
  choice: 愚昧人 / 愚昧
  rationale: 保留希伯来语同根词形成的双关，也呈现《箴言》中尚未受智慧塑造、容易受诱惑的一类人；这里不是单指智力不足。
- source_word: תְּאֵהֲבוּ
  choice: 喜爱
  rationale: 直接保留动词的情感与意志力度；结合“要到几时”表达一种持续、受责问的倾向。
- source_word: לֵצִים / לָצוֹן
  choice: 讥讽者 / 讥讽
  rationale: 以同根汉语词语重现原文施事者与行为名词之间的呼应，并表达轻蔑、嘲弄智慧与劝诫的态度。
- source_word: חָמְדוּ
  choice: 以……为乐
  rationale: 该动词基本义涉及渴望、贪爱；在这里以讥讽为对象，译作“以……为乐”自然地传达他们主动喜爱并享受这种行为。
- source_word: לָהֶם
  choice: 由“以……为乐”含蓄表达
  rationale: 此处与格代词带有“为自己”的意味；若硬译“为自己喜爱讥讽”不合现代汉语，故在惯用表达中保留其自得其乐的含义。
- source_word: כְסִילִים
  choice: 愚顽人
  rationale: 区别于前面的“愚昧人”，并保留《箴言》中这一道德—属灵类别：他们固执地拒绝智慧，并非只是智力低下。
- source_word: יִשְׂנְאוּ דָעַת
  choice: 恨恶知识
  rationale: 直译强烈的“恨恶”，不弱化为“拒绝”；“知识”直接对应 דָעַת，并符合《箴言》的智慧语境。
theological_decisions:
- issue: 《箴言》中的智慧人物类别
  choice: 分别译作“愚昧人”“讥讽者”“愚顽人”
  alternative: 缺乏经验的人、嘲笑别人的人、蠢人
  rationale: 这些词在《箴言》中是反复出现的伦理与属灵类型。所选译法既保持彼此区别，也避免把经文贬低为智力或性格标签。
- issue: “要到几时”是否支配后两小句
  choice: 在第二行补出“又要到几时呢”
  alternative: 只在第一小句明说，后两句并列陈述
  rationale: 希伯来文只在开头明说 עַד־מָתַי，但其责问语气自然延伸到并列的三类人。汉语补出一次可使范围清楚，同时由脚注说明原文的省略结构，不把补译误作原文重复。
translation_notes:
  register: 采用现代、庄重且可朗读的普通话。“愚昧人”与“愚顽人”虽带有智慧文学色彩，仍易为现代读者理解；“讥讽者”较“亵慢人”更符合当前通用表达。保留三组平行结构及“喜爱／为乐／恨恶”的递进张力。
