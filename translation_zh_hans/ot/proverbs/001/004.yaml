  text: לָ/תֵ֣ת לִ/פְתָאיִ֣ם עָרְמָ֑ה לְ֝/נַ֗עַר דַּ֣עַת וּ/מְזִמָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/004.yaml
  text: to give prudence to the simple[a], knowledge and discretion to the young man.
translation:
  language: zh_hans
  text: 为使缺乏经验的人获得审慎，使少年人[a]获得知识和判断力。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “少年人”原文为阳性单数，也可译作“青年”或“年轻人”；在智慧教导中可用作代表性称呼。
    reason: 保留נַעַר的词义范围及其在教导语境中的代表性可能。
lexical_decisions:
- source_word: לָתֵת
  choice: 为使……懂得／获得
  rationale: 这是带介词ל的动词不定式，承接上文表达目的。按两个宾语在汉语中分别搭配“懂得”和“获得”，使句子自然，同时保留“使之得到”的语义。
- source_word: לִפְתָאיִם
  choice: 缺乏经验的人
  rationale: פְּתָאִים指阅历不足、容易受诱导的人，并非智力低下者。“缺乏经验的人”在现代汉语中清楚、自然，也避免“愚人”可能造成的误解。
- source_word: עָרְמָה
  choice: 审慎
  rationale: עָרְמָה可指精明、机敏或谋略，在本节的正面智慧语境中强调谨慎明辨、善于应对；“审慎”保留其积极含义，同时不抹去实践判断的色彩。
- source_word: לְנַעַר
  choice: 少年人
  rationale: נַעַר是阳性单数，可指少年或年轻男子。“少年人”保留原文的单数代表性称呼及年龄特征；脚注列出较宽泛的译法。
- source_word: דַּעַת
  choice: 知识
  rationale: דַּעַת在智慧文学中通常指知识或认知；译作“知识”可与本段的智慧词汇保持清晰区别。
- source_word: וּמְזִמָּה
  choice: 和判断力
  rationale: מְזִמָּה可表示筹划、深思熟虑或辨别判断的能力。在此正面语境中，“判断力”既自然，又体现经过思考后作出合宜决定的能力。
theological_decisions:
- issue: 智慧教导中阳性单数称呼的范围
  choice: 正文译作“少年人”
  alternative: “青年”或“年轻人”
  rationale: 原文נַעַר为阳性单数，因此正文不将其直接改写成无年龄特征的群体称呼；同时，该词在智慧教导中可能具有代表性，脚注保留较宽泛的理解，避免断定教导只适用于男性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“缺乏经验的人”避免传统“愚蒙人”在当代可能引起的智力贬损联想；“审慎”和“判断力”保持箴言智慧词汇的实践性。句首“为使”保留本节承接箴言1:2—3目的陈述的句法关系。
