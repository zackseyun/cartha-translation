base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/031.yaml
  text: So they will eat from the fruit of their way[b][a], and be filled with their own counsels.
translation:
  language: zh_hans
  text: 所以，他们必吃自己道路的果子，并因自己的计谋而饱足。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “因自己的计谋而饱足”也可译作“从自己的谋略中得饱足”或“饱尝自己的计划”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֹאכְלוּ
  choice: 所以，他们必吃
  rationale: 句首连接词在上下文中带出前文拒绝智慧所导致的后果；“所以”以自然中文表达这一承接关系，“必吃”保留未完成式在此处的将来与确定意味。
- source_word: מִפְּרִי דַרְכָּם
  choice: 自己道路所结的果子
  rationale: 保留箴言中“道路”指人生道路和行为方式的核心隐喻，并将“果子”自然表达为该道路所产生的结果；“吃”继续维持原文意象。
- source_word: וּמִמֹּעֲצֹתֵיהֶם
  choice: 并被自己的计谋
  rationale: מֹעֵצוֹת可指谋略、主意或计划；此处语境具有负面的道德色彩，“计谋”既保留其谋划之义，也不额外引入特定教义解释。
- source_word: יִשְׂבָּעוּ
  choice: 填饱
  rationale: 该动词指吃饱、饱足；与前半句“吃……果子”共同构成进食隐喻。“填饱”保留反讽意味，即他们充分承受自己谋划的后果。
theological_decisions:
- issue: 智慧文学中行为与后果的意象
  choice: 译为人吃自己道路所结的果子，并被自己的计谋填饱
  alternative: 较直译地译作“他们必吃自己道路的果子，并因自己的谋略而饱足”
  rationale: 原文以吃果子和饱足描绘与自身选择相称的后果。译文保留这一道德后果的意象，不将其扩展为特定的系统神学命题。
- issue: “饱足”的正面或反讽含义
  choice: 用“填饱”保留语境中的反讽
  alternative: 译作“满足”或“饱足”
  rationale: שׂבע本身可表示饱足，但这里所吃的是自己道路的果子，所充满的是自己的计谋，因此不是祝福性的满足。“填饱”较清楚地保留进食隐喻，同时不把隐含后果具体化。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“道路—果子—填饱”的连续意象尽量贴近希伯来文智慧文学的表达；“计谋”保持道德语境中的负面色彩，同时避免过度解释。
