  language: zh_hans
  text: 大卫的儿子、以色列王所罗门的箴言[a]：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“格言”或“智慧言语”。希伯来语 מָשָׁל 可指箴言、格言或智慧言语；此处作为书名和题署，译作“箴言”最合适。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁלֵי
  choice: 箴言
  rationale: 这是 מָשָׁל 的复数构造形式，在此引出整部文集；“箴言”既表达格言、智慧言语之意，也符合本书在中文中的传统书名和标题功能。
- source_word: שְׁלֹמֹה
  choice: 所罗门
  rationale: 采用现代中文圣经及一般中文语境中通行的人名译法。
- source_word: בֶן
  choice: 儿子
  rationale: 此处在王室题署中指直接的父子关系；虽然该词有时也可泛指后裔，但本处无需扩义。
- source_word: דָּוִד
  choice: 大卫
  rationale: 采用现代中文通行的人名译法。
- source_word: מֶלֶךְ
  choice: 王
  rationale: 该名词与“所罗门”构成同位关系；译作“以色列王”简洁自然，并明确称号属于所罗门。
- source_word: יִשְׂרָאֵל
  choice: 以色列
  rationale: 采用现代中文通行的国家及民族名称译法。
