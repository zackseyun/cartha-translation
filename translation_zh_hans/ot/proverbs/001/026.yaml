  text: I also will laugh at your calamity[a]; I will mock when your dread comes,
translation:
  language: zh_hans
  text: 你们遭遇灾祸时，我也要发笑；当你们的恐惧[a]临到时，我要嗤笑。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “恐惧”也可译为“惊恐”或“所惧怕而来到的事”。希伯来词可指恐惧本身，也可指所惧怕的事件。
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם אֲנִי
  choice: 我也
  rationale: 保留显明主语所带的强调，也表达对前文拒绝智慧的对应性回应；现代汉语以“我也”自然呈现。
- source_word: בְּאֵידְכֶם
  choice: 你们遭灾时
  rationale: אֵיד指灾祸、灾难或毁灭；介词ב与“发笑”结合，在汉语中按时间情境自然译作“遭灾时”，既保留严重性，也避免生硬的“向你们的灾祸发笑”。
- source_word: אֶשְׂחָק
  choice: 要发笑
  rationale: שׂחק的基本义为“笑”；“要发笑”清楚表达未然语气，不额外强化。
- source_word: אֶלְעַג
  choice: 要嗤笑
  rationale: לעג表示嘲笑、讥诮；“嗤笑”庄重而易懂，并与前面的“发笑”形成对应而不抹平两个动词。
- source_word: בְּבֹא
  choice: 临到时
  rationale: ב加בוא不定式构成时间表达，意为“当……来到时”；“临到时”符合现代经文语体。
- source_word: פַחְדְּכֶם
  choice: 你们所惧怕的
  rationale: פחד既可指恐惧、惊恐，也可指令人惧怕的事物。因其作“临到”的主语且与“灾”平行，正文采用“你们所惧怕的”，自然表达可临到的可怕事件；同时仍未具体限定该事件为何。
theological_decisions:
- issue: 拟人化智慧对愚昧人的回应语气
  choice: 直译为“发笑”和“嗤笑”，不作弱化
  alternative: 译为“苦笑”或“因你们遭灾而欢喜”
  rationale: 希伯来文使用明确而强烈的笑与嘲弄动词，处于智慧文学的审判性警告语境。弱化会削减警告力度，译成“欢喜”又超出词义；因此保留原文造成的神学张力。
translation_notes:
  register: 采用现代、庄重且普通读者易懂的简体中文。“遭灾时”使首句自然流畅；“你们所惧怕的临到时”顺应汉语搭配，并体现פחד在恐惧感与可怕事件之间的语义张力。保留两分句的平行结构和强烈警告语气。
