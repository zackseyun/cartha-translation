  text: אָ֣ז יִ֭קְרָאֻ/נְנִי וְ/לֹ֣א אֶֽעֱנֶ֑ה יְ֝שַׁחֲרֻ֗/נְנִי וְ/לֹ֣א יִמְצָאֻֽ/נְנִי׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/028.yaml
  text: Then they will call on me[a], but I will not answer; they will seek me diligently, but they will not find me.
translation:
  language: zh_hans
  text: 那时，他们呼求我，我却不回答；他们切切寻求我[a]，却找不到我。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“清早寻求我”或“殷切寻求我”。这个希伯来动词可表达趁早、热切地寻找。
    reason: 保留 יְשַׁחֲרֻנְנִי 所含“清早寻找”与“殷切寻找”的词义幅度。
lexical_decisions:
- source_word: אָז
  choice: 那时
  rationale: 表示前述警告之后随之而来的时刻和后果；“那时”在现代汉语中自然，并保留时间推进。
- source_word: יִקְרָאֻנְנִי
  choice: 他们呼求我
  rationale: קרא 在此指向某人呼喊、求助并期待回应；“呼求我”简洁地传达紧迫求助的语气。
- source_word: וְלֹא אֶעֱנֶה
  choice: 我却不回答
  rationale: וְ 本可直译为“而/并且”，但这里与前句构成鲜明逆转；“却”自然呈现其转折力。
- source_word: יְשַׁחֲרֻנְנִי
  choice: 他们切切寻求我
  rationale: שׁחר 的 Piel 形式可含清早、迫切或殷勤寻找之意；“切切寻求”在正文中突出热切、勤恳的寻求，同时以脚注保留“清早寻求”的词源性可能。
- source_word: וְלֹא יִמְצָאֻנְנִי
  choice: 却找不到我
  rationale: מצא 意为“找到”；“却找不到我”以自然汉语保留寻求与不得之间的强烈对照。
theological_decisions:
- issue: 语境中的说话者身份
  choice: 保留第一人称，由《箴言》文学语境中人格化的智慧说话
  alternative: 在译文中直接将说话者认定为后续神学传统中的特定对象
  rationale: 本节直接属于智慧的发言。译文应忠实保留希伯来文本的文学声音，不在正文中预先裁定更广泛的预表或基督论诠释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“呼求”符合智慧文学中向说话者求助的语境；“切切寻求”略带经文语体色彩，但现代读者仍易理解，并能传达动作的迫切程度。
