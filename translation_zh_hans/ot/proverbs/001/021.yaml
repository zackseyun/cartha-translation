base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/021.yaml
  text: 'At the head of the noisy streets she cries out[c][b][a]; at the entrances of the gates in the city she speaks her words:'
translation:
  language: zh_hans
  text: 她在喧闹之处的显要位置呼喊[a]；在城中各城门口[b]，她说出自己的言语[c]：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“她在喧嚣之处的高处呼喊。”希伯来语可指公共喧闹场所中最显眼、最高或最靠前的位置。
    reason: lexical_alternative
  - marker: b
    text: 古代城门是主要的公共聚集地，人们在那里经商、审理案件并处理城中事务。
    reason: cultural_note
  - marker: c
    text: 希伯来语直译为“她说她的话”。这种搭配在中文中不自然，故译为“她说出自己的言语”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּ/רֹאשׁ
  choice: 在……的前头
  rationale: רֹאשׁ本义为“头”，在空间表达中可指顶部、开端或最前面。此处与公共场所相连，译作“前头”既保留原文意象，也表达显眼、居前的位置。
- source_word: הֹמִיּוֹת
  choice: 喧闹之处
  rationale: 该词源自表示喧响、骚动的词根，所指可理解为喧闹的地点或人群聚集造成的喧嚣。“喧闹之处”不擅自限定为街道，并保留原文的宽泛性。
- source_word: תִּקְרָא
  choice: 呼喊
  rationale: קרא可表示呼叫、呼喊或宣告；这里描写智慧在公共场所高声发言，“呼喊”自然地体现其公开性和力度。
- source_word: בְּ/פִתְחֵי
  choice: 在……的入口处
  rationale: פֶּתַח指开口或入口；复数形式配合城门，译作“各门的入口处”符合现代汉语。
- source_word: שְׁעָרִים
  choice: 各门
  rationale: שְׁעָרִים在城市语境中指城门。中文用“城中各门”清楚表明其为城市公共空间，同时避免重复说“城门的入口”。
- source_word: בָּ/עִיר
  choice: 在城中
  rationale: 直译为“在城里／城中”，用于限定城门所在的城市公共领域；“城中”简洁庄重。
- source_word: אֲמָרֶי/הָ
  choice: 自己的话
  rationale: 该词为“话语／言辞”的复数构词并带阴性单数所属后缀，意为“她的话”。中文在主语为“她”时用“自己的话”更自然，所属关系仍然明确。
- source_word: תֹאמֵר
  choice: 她说出
  rationale: אמר是普通的“说”。与宾语“自己的话”搭配时，“说出”比“说自己的话”自然，又没有增强为“宣告”等更强含义。
theological_decisions:
- issue: 智慧被拟人化为女性说话者
  choice: 保留阴性第三人称“她”
  alternative: 使用无性别或非人格化表达，如“智慧发出呼声”
  rationale: 希伯来文动词和所属后缀均为阴性单数，承接上下文中女性化、人格化的“智慧”。保留“她”准确反映语法和文学形象，但不据此加入进一步的神学认定。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“喧闹之处”保留הֹמִיּוֹת所指地点或喧嚣场域的含混性；分号呈现两组平行地点描写，末尾冒号承接下一节智慧的直接发言。
