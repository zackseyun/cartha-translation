  text: יִרְאַ֣ת יְ֭הוָה רֵאשִׁ֣ית דָּ֑עַת חָכְמָ֥ה וּ֝/מוּסָ֗ר אֱוִילִ֥ים בָּֽזוּ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/007.yaml
  text: The fear of Yahweh is the beginning of knowledge[b][a]; fools despise wisdom and discipline.
translation:
  language: zh_hans
  text: 敬畏[a]耶和华是知识的开端；愚人藐视智慧和管教[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “敬畏”包括对耶和华的尊崇、畏惧和顺服。
    reason: lexical_alternative
  - marker: b
    text: “管教”也可译作“训诲”或“纠正”；原词指塑造人的训练，其中可以包括纠正。
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְאַת
  choice: 敬畏
  rationale: “敬畏”是现代汉语圣经语境中自然而凝练的表达，兼具尊崇、畏惧与顺服之意，不把原文缩减为单纯害怕或一般尊敬。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代简体中文读者最熟悉的专名形式呈现四字神名，保留其作为以色列之神名字的功能，而不以头衔“主”替代。
- source_word: רֵאשִׁית
  choice: 开端
  rationale: “开端”既可指起点，也可含根基性原则之意，保留原文的语义张力，且较“开始”更适合庄重箴言体。
- source_word: דָּעַת
  choice: 知识
  rationale: 直接对应智慧文学中的认知与认识范畴，并与其他表示聪明、悟性的希伯来词保持适当区分。
- source_word: חָכְמָה
  choice: 智慧
  rationale: 这是箴言核心术语的标准中文表达，能够涵盖明智判断和善于生活的实践能力。
- source_word: מוּסָר
  choice: 管教
  rationale: “管教”同时包含教导、训练和纠正，比单用“教导”更能体现该词形成品格并施以纠正的意味。
- source_word: אֱוִילִים
  choice: 愚人
  rationale: 指智慧文学中在道德和属灵态度上顽愚的人，并非仅指智力不足；“愚人”简洁且符合箴言体。
- source_word: בָּזוּ
  choice: 藐视
  rationale: 表达轻看并拒绝的强烈贬抑态度，比“忽视”更准确，也保持原句的力度。
theological_decisions:
- issue: “敬畏耶和华”的含义
  choice: 正文保留“敬畏耶和华”
  alternative: 尊崇耶和华；畏惧耶和华
  rationale: 原短语同时涉及尊崇、畏惧和顺服；“敬畏”能保留这些彼此关联而不能完全互换的层面，避免将其软化为一般敬意或收窄为恐惧。
- issue: רֵאשִׁית与知识的关系
  choice: 知识的开端
  alternative: 知识的首要原则；知识最重要的部分
  rationale: “开端”保留敬畏耶和华既是认识的起点、也可能是其根基的开放性，不替原文选定单一解释。
- issue: מוּסָר的训育与纠正层面
  choice: 管教
  alternative: 教导；训诲；纠正
  rationale: 该词在箴言中不只是传递信息，也包括塑造、训练和纠正；“管教”保留这种可能令人不适却具有教育目的的张力。
translation_notes:
  register: 采用简洁、对称、庄重的现代标准汉语，维持希伯来箴言的格言式节奏。分号呈现两分句之间的鲜明对照；“愚人”保持智慧文学中的道德类别，不解释为智力缺陷。脚注标记均置于正文相应词语之后。
