lexical_decisions:
- source_word: לְהָבִין
  choice: 为要明白
  rationale: לְ加不定式承接前文的目的句；“为要明白”既保留目的意味，也符合现代汉语经文语体。
- source_word: מָשָׁל
  choice: 箴言
  rationale: 在《箴言》的语境中通常指智慧性的箴言或格言；“箴言”最贴合本书体裁。
- source_word: מְלִיצָה
  choice: 隽语
  rationale: 该词较罕见，可指措辞精妙、含意深长的表达，也可能带有解释之意；“隽语”与“箴言”并列自然，并保留其文采和凝练性。
- source_word: דִּבְרֵי
  choice: 话
  rationale: 这是דבר的复数构造形式；“智慧人的话”直接、自然，也保留所属关系。
- source_word: חֲכָמִים
  choice: 智慧人
  rationale: 形容词名词化，指有智慧的人；“智慧人”不额外限定性别，也符合本书用语。
- source_word: חִידֹתָם
  choice: 他们的谜语
  rationale: חִידָה可指谜语或需要揣摩的隐晦言语；“谜语”简洁具体，并以“他们的”保留第三人称复数后缀。
