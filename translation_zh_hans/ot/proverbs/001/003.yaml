translation:
  language: zh_hans
  text: 为要领受关于明智处事、公义、公正和正直的训诲[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “领受”所译的希伯来语也可直译为“取得”；“训诲”也可译作“管教”。“明智处事”指审慎而有智慧的实际行为，也可译作“审慎行事”或“明智行事”。“正直”也可译作“公平”或“正直无偏”。
    reason: lexical_alternative
lexical_decisions:
- source_word: לָקַחַת
  choice: 领受
  rationale: 此处不定式承接箴言1:2所列目的。该动词本义可指“取得”，但与“训诲”搭配时，“领受”更符合智慧教导的语境，也自然体现接受教导之意。
- source_word: מוּסַר
  choice: 训诲
  rationale: 该词涵盖管教、纠正和教导；这里位于全书序言，指塑造品格和行为的教育。“训诲”既保留规范与训练意味，又不局限于惩戒。
- source_word: הַשְׂכֵּל
  choice: 明智处事
  rationale: 该词强调审慎而有成效地行动，是实际生活中的智慧，不只是抽象理解。“明智处事”保留其行为和实践层面。
- source_word: צֶדֶק
  choice: 公义
  rationale: 在与“公正”和“正直”并列的三联词中，该词指合乎正道和伦理规范；译作“公义”可与 מִשְׁפָּט 的社会司法意味区分。
- source_word: מִשְׁפָּט
  choice: 公正
  rationale: 此处指公平的裁断及社会伦理中的正义规范。“公正”是自然的现代汉语表达，也与“公义”有所区别。
- source_word: מֵישָׁרִים
  choice: 正直
  rationale: 其字面意象是“平直”，伦理上指正直、公平。“正直”保留希伯来语的道德方向感；“公平”也是可能译法。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以“为要……学会……”自然表达目的结构，并将希伯来语中关于实践智慧的紧密词组译为“明智处事的训诲”。三项伦理词汇分别译作“公义、公正和正直”，尽量保留彼此的语义区别和并列节奏。
