  text: for they are a graceful wreath for your head and necklaces for your neck[a][b].
translation:
  language: zh_hans
  text: 因为这些是你头上华美的冠饰[a]，是你颈项上的项链[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你头上恩宠的冠饰”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“你颈项上的链饰”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上一节的劝诫并说明理由；“因为”在现代汉语中自然清楚。
- source_word: לִוְיַת חֵן
  choice: 华美的花冠
  rationale: לִוְיַת指缠绕而成、戴在头上的装饰，חֵן在这里表达美好、悦人或恩宠之意。“华美的花冠”自然呈现其装饰性，同时以脚注保留“恩宠”这一可能含义。
- source_word: הֵם
  choice: 这些是
  rationale: “这些”回指上一节父亲的训诲和母亲的教导；汉语补出判断词“是”，使句子流畅。
- source_word: לְרֹאשֶׁךָ
  choice: 你头上
  rationale: 按头饰的自然位置表达希伯来语关系介词לְ；比“给你的头”更符合现代汉语。
- source_word: וַעֲנָקִים
  choice: 项链
  rationale: 指佩在颈部的链状饰物。汉语“项链”本身通常不强制标示单复数，既自然，也不必把希伯来语复数过度具体化；“链饰”是可保留的词义选择。
- source_word: לְגַרְגְּרֹתֶיךָ
  choice: 你颈项上
  rationale: 该词指喉部或颈部区域；在佩戴饰物的语境中，“颈项”准确而庄重。
theological_decisions:
- issue: חֵן在装饰意象中的含义
  choice: 正文译作“华美的”，突出悦目、优美之义
  alternative: “恩宠的”或“蒙恩的”
  rationale: 本节首先描写训诲如头饰般美好，但חֵן也可含“恩宠、 favor”之意；不将其教义化，并在脚注中保留这一真实歧义。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“花冠—项链”保留原文两种身体装饰的平行意象；“颈项”略具书面色彩，但通俗易懂，并与智慧文学的文体相称。
