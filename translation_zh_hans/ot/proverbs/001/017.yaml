  yaml_path: translation/ot/proverbs/001/017.yaml
  text: For the net is spread in vain in the sight of any bird[a].
translation:
  language: zh_hans
  text: 因为在鸟儿眼前张网，总是徒然的。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“凡有翅膀的活物”（指飞鸟）。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 本词承接上文，为此前的警告提供理由；“因为”自然表达解释性的逻辑关系。
- source_word: חִנָּם
  choice: 徒然
  rationale: 此处表示行动无效、白费；“徒然”简洁庄重，符合箴言体裁。
- source_word: מְזֹרָה
  choice: 张
  rationale: 该被动分词在网的语境中表示铺开、展开；汉语通常说“张网”。句中采用主动式泛指表达，使译文自然而不改变意义。
- source_word: הָרָשֶׁת
  choice: 网
  rationale: רֶשֶׁת指捕捉猎物的网；“网”准确而清楚。
- source_word: בְּעֵינֵי
  choice: 在……眼前
  rationale: 保留希伯来语视觉性的表达，说明张网是在飞鸟看得见的地方，而非表示评价。
- source_word: כָל
  choice: 所有
  rationale: 与单数集合性称谓搭配时具有泛指整体的作用；“所有飞鸟”在现代汉语中自然。
- source_word: בַּעַל כָּנָף
  choice: 飞鸟
  rationale: 原文直译为“有翅膀者”；在捕鸟语境中，“飞鸟”是自然且贴切的对应，同时以脚注保留原文字面形象。
theological_decisions: []
translation_notes:
  register: 采用现代、简洁而庄重的箴言体。保留“眼前”的具体视觉意象，并用“徒然”表达设网无效。主句采用汉语自然的“张网”结构；脚注交代“飞鸟”背后的希伯来语字面称谓。
