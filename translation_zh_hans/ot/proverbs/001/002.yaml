  text: to know wisdom and instruction[a], to understand words of insight[b],
translation:
  language: zh_hans
  text: 使人认识智慧和训诲[a]，明白明辨之言[b]；
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “训诲”也可译作“管教”或“纠正性的训练”；原词既包括教导，也包括纠正和约束。
    reason: lexical_alternative
  - marker: b
