    reason: lexical_alternative
lexical_decisions:
- source_word: לָדַעַת
  choice: 使人认识
  rationale: 此处带 לְ 的不定式在序言中表达箴言的目的。汉语补出“使人”可自然呈现这一目的关系，同时不预先限定受教者。
- source_word: חָכְמָה
  choice: 智慧
  rationale: “智慧”是《箴言》中 חָכְמָה 的标准对应词，涵盖实际生活、道德判断与敬虔实践，不仅指智力。
- source_word: מוּסָר
  choice: 管教
  rationale: 该词兼有教导、训练、纠正和约束之意；“管教”较能保留其纠正性训练的力度，脚注列出较宽泛的“训诲”。
- source_word: לְהָבִין
  choice: 明白
  rationale: 与前一目的不定式平行；“明白”在现代汉语中自然，并保留理解、辨识的含义。
- source_word: אִמְרֵי
  choice: 言语
  rationale: 该构造复数指所说的话或格言；“言语”既贴近原文，又适合庄重的箴言序言语体。
- source_word: בִינָה
  choice: 有悟性的
  rationale: 原文是构造关系“בִינָה 的言语”，可指体现理解力、洞察力或辨别力的言语；译作“有悟性的”保留修饰关系，并避免与“明白”机械重复。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以“为使人……，明白……”呈现序言中的目的结构；保留原文两行的平行关系，并用脚注呈现 מוּסָר 与 בִינָה 的真实词义幅度。
