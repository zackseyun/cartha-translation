  text: when your dread comes like a storm[a], and your calamity arrives like a whirlwind, when distress and anguish come upon you.
translation:
  language: zh_hans
  text: 当你们的惊恐如暴风[a]袭来，你们的灾祸如旋风临到，当患难和痛苦临到你们身上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“如毁灭”；这个希伯来词既可强调毁灭、荒废，也可描绘暴风般猛烈冲击的灾变。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּבֹא
  choice: 当……袭来／当……降在
  rationale: 介词 בְּ 加动词 בוא 的不定式构造引出时间从句；用“当……时”的汉语句式自然表达其时间意义，并按搭配分别译为“袭来”和“降在”。
- source_word: כְשָׁאוָה
  choice: 如暴风
  rationale: שָׁאוָה 可指毁灭、荒废，也可带有猛烈冲击的灾变意象；上下文与“旋风”平行，因此正文采用形象自然的“暴风”，另以脚注保留“毁灭”的词义可能。
- source_word: פַּחְדְּכֶם
  choice: 你们所惧怕的
  rationale: פַּחַד 既可指惧怕的情绪，也可指令人惧怕之事；这里它像灾祸一样“袭来”，故译作“所惧怕的”，同时保留原文在感受与对象之间的张力。
- source_word: וְאֵידְכֶם
  choice: 你们的灾祸
  rationale: אֵיד 指突发的灾难或毁灭；“灾祸”庄重而通俗，符合智慧文学语体。
- source_word: כְסוּפָה
  choice: 如旋风
  rationale: סוּפָה 指猛烈的风暴或旋风；“旋风”保留其迅猛席卷的形象，并与前句构成诗歌平行。
- source_word: יֶאֱתֶה
  choice: 临到
  rationale: 该动词表示来到、抵达；“临到”适合灾祸作主语，也保持庄重的诗歌语气。
- source_word: עֲלֵיכֶם
  choice: 在你们身上
  rationale: עַל 在此表示逆境落到人身上；结合“降在”表达，可自然译出灾难临身之意。
- source_word: צָרָה
  choice: 患难
  rationale: צָרָה 表示困境、患难或苦难；“患难”是现代汉语中自然且庄重的对应词。
- source_word: וְצוּקָה
  choice: 痛苦
  rationale: צוּקָה 含受压、窘迫和苦楚之意；译作“痛苦”可与“患难”有所区分，同时保留希伯来诗歌近义并列的特点。
