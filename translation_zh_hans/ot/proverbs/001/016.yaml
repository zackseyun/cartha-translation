  text: כִּ֣י רַ֭גְלֵי/הֶם לָ/רַ֣ע יָר֑וּצוּ וִֽ֝/ימַהֲר֗וּ לִ/שְׁפָּךְ דָּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/016.yaml
  text: For their feet run to evil[b][a], and they hurry to shed blood.
translation:
  language: zh_hans
  text: 因为[a]他们的脚奔向恶事[b]，急忙去流人的血。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “因为”也可译作“原来”；这里是引出上一节劝告的理由。
    reason: lexical_alternative
  - marker: b
    text: “奔向恶事”原文直译为“跑向恶”，也可理解为“奔去作恶”或“奔向邪恶”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 在上下文中引出上一节劝告的理由；“因为”自然地保留了解释性的逻辑关系。
- source_word: רַגְלֵיהֶם
  choice: 他们的脚
  rationale: 按原文保留身体部位的意象，与上一节“禁止你的脚走他们的路”彼此呼应，并表现他们急于行动。
- source_word: לָרַע
  choice: 奔向恶事
  rationale: 原文是介词加“恶”，可表示朝向邪恶，也可语用地理解为去作恶。“恶事”在现代汉语中自然，同时没有把具体恶行说死。
- source_word: יָרוּצוּ
  choice: 奔向
  rationale: 保留“跑”的动态意象，并与表示方向的 לָ־ 合并为自然的汉语表达。
- source_word: וִימַהֲרוּ
  choice: 急忙去
  rationale: 表达原文“迅速、赶快”的意思，并与前半句的奔跑构成平行强化。
- source_word: לִשְׁפָּךְ
  choice: 流
  rationale: 与“血”搭配时指流人之血、造成死亡或伤害；采用简洁的传统汉语表达，避免机械直译为“倾倒”。
- source_word: דָּם
  choice: 人的血
  rationale: 原文仅作“血”，但汉语单说“流血”容易被理解为自己出血；补出“人的”明确其施暴含义，而不限定受害者身份。
theological_decisions: []
