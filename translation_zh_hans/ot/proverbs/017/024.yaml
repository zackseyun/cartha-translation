  text: אֶת פְּנֵ֣י מֵבִ֣ין חָכְמָ֑ה וְ/עֵינֵ֥י כְ֝סִ֗יל בִּ/קְצֵה אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/024.yaml
  text: Wisdom is before the face of a discerning man[c][b][a], but the eyes of a fool are at the ends of the earth.
translation:
  language: zh_hans
  text: 明哲人面前有智慧，愚昧人的眼目却望向地极。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “地极”也可译作“地的尽头”或“那地的边缘”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶת פְּנֵי
  choice: 在……面前
  rationale: 将 אֶת 取其较少见的介词用法，与 פְּנֵי 合起来表达“在……面前”。这样既保留希伯来文“脸面／面前”的具体意象，也呈现智慧近在明哲人眼前，与愚昧人目光游移远方形成对照。
- source_word: מֵבִין
  choice: 明哲人
  rationale: 该阳性单数分词指以理解力、辨识力为特征的人。“明哲人”符合《箴言》的智慧文学语域，并在中文中自然地用作代表性、泛指性称谓。
- source_word: חָכְמָה
  choice: 智慧
  rationale: 作前一分句的主语。原文在本节并不强制要求人格化理解，因此采用普通名词“智慧”，不额外加入神学意义。
- source_word: וְעֵינֵי
  choice: ……的眼目却
  rationale: וְ 在两类人物的鲜明对照中具有转折功能，译为“却”；“眼目”保留原文具体意象及庄重的箴言体语感。
- source_word: כְסִיל
  choice: 愚昧人
  rationale: 该词在《箴言》中常指在道德和认知上拒绝智慧的人。“愚昧人”比单纯“笨人”更能保留其智慧文学内涵。
- source_word: בִּקְצֵה אָרֶץ
  choice: 望向地极
  rationale: 原文直义为“在地／大地的尽头”。结合“眼目”，中文用“望向”自然表达目光落在遥远之处；“地极”凝练保留夸张的距离意象。
theological_decisions:
- issue: 智慧是否人格化
  choice: 译作普通名词“智慧”
  alternative: 将“智慧”理解为人格化的智慧
  rationale: 本节的语法和对比可以直接理解为明哲人专注于近在眼前的智慧，并不要求把智慧解释为独立位格；译文保留这种开放性，不加入特定教义判断。
- issue: 阳性单数的代表性人物
  choice: 明哲人
  alternative: 有悟性的人／能明辨的人
  rationale: 希伯来文使用阳性单数分词作为箴言中的典型人物。现代汉语“明哲人”并不必然限定男性，既保留单数类型称谓，也自然表达普遍适用的格言意义。
- issue: 愚昧人目光所向的含义
  choice: 保留空间意象“望向地极”
  alternative: 意译为“心不在焉”或“到处寻找”
  rationale: 原文没有明说其心理原因或具体行为，只以遥远目光与眼前智慧形成张力，因此不把隐含意义解释进正文。
translation_notes:
  register: 采用简洁、对称、庄重的现代标准汉语，保持箴言的警句节奏。“面前”与“望向地极”构成近与远的空间对照；不将隐含寓意过度明说。
