base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/006.yaml
  text: Grandchildren are the crown of the aged[b][a], and the glory of children is their fathers.
translation:
  language: zh_hans
  text: 孙辈是老年人的冠冕[a][b]；父亲是儿女的荣耀。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “孙辈”原文直译为“儿女的儿女”。
    reason: lexical_alternative
  - marker: b
    text: “老年人”也可译为“老人”；原文指年长者，不一定指担任职分的长老。
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲטֶרֶת
  choice: 冠冕
  rationale: 该词指冠冕或花冠，并象征尊荣；“冠冕”自然保留了本句的比喻及庄重格调。
- source_word: זְקֵנִים
  choice: 老年人
  rationale: 这里指年长者，并非担任职分的“长老”；“老年人”在现代汉语中清楚自然，也不限定为男性。
- source_word: בְּנֵי בָנִים
  choice: 子孙
  rationale: 该短语直译为“儿女的儿女”，语境中指孙辈；“子孙”简洁自然，但在汉语中也可能有更宽泛的后代含义，因此以脚注说明。
- source_word: תִפְאֶרֶת
  choice: 荣耀
  rationale: 该词可指荣美、华美或尊荣；“荣耀”与前半句的“冠冕”形成恰当的诗意对应。
- source_word: בָּנִים
  choice: 儿女
  rationale: 阳性复数在箴言的一般性家族语境中可涵盖儿女；“儿女”表达普遍适用性，同时保持亲属关系的自然表述。
- source_word: אֲבוֹתָם
  choice: 父亲
  rationale: 希伯来语明确使用阳性亲属称谓“父亲”，不宜泛化为“父母”；汉语中以单数类称表达“儿女各自的父亲”自然简练。
theological_decisions:
- issue: 一般性箴言中的性别化亲属称谓
  choice: 将 בָּנִים 译为“儿女”，但将 אֲבוֹתָם 保留为“父亲”。
  alternative: 较形式化地译为“儿子”和“他们的父亲”，或全面泛化为“儿女”和“父母”。
  rationale: 本句概括代际间的尊荣。בָּנִים 在智慧文学的一般性语境中可以代表儿女，但 אֲבוֹתָם 明确是阳性“父亲”；如此既使汉语自然，也不抹平原文具有语义意义的性别表达。
translation_notes:
  register: 采用现代、凝练而庄重的箴言体。两分句保持平行结构，以“冠冕”和“荣耀”保存原文的尊荣意象。所有脚注标记均置于相关词语之后。
