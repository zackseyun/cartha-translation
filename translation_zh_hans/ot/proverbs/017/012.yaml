  yaml_path: translation/ot/proverbs/017/012.yaml
  text: Better to meet a bear robbed of her cubs than a fool in his folly.
translation:
  language: zh_hans
  text: 宁可遇见失去幼崽的母熊，也不要遇见愚妄中的愚昧人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פָּגוֹשׁ
  choice: 遇见
  rationale: 该形式在此构成比较性的劝诫表达；译作“遇见”自然地保留正面遭逢危险对象的含义。
- source_word: דֹּב שַׁכּוּל
  choice: 失去幼崽的母熊
  rationale: שַׁכּוּל表示丧失后代；母熊虽由语境而非名词性别明确，但“幼崽被夺”的意象通常指护崽母熊。译文避免加入“被抢走”等原文未明说的原因。
- source_word: כְּסִיל
  choice: 愚昧人
  rationale: 箴言中的常用伦理智慧术语，指顽固拒绝智慧的人；“愚昧人”比单纯“笨人”更能承载其道德含义。
- source_word: אִוַּלְתּוֹ
  choice: 他的愚妄
  rationale: 保留名词结构及第三人称所属关系；“愚妄”指其正在表现或支配他的愚昧状态与行为。
theological_decisions:
- issue: 比较句的隐含受事者
  choice: 以“宁可……也不要……”表达，不补出“人”作受事者
  alternative: 让人遇见……也不要遇见……
  rationale: 希伯来文虽有 בְאִישׁ（临到一个人），但汉语比较句可自然省略泛指受事者，并准确传达原文警告的力度。
- issue: 母熊失崽的原因
  choice: 失去幼崽
  alternative: 幼崽被抢走
  rationale: 原词说明丧子状态，不限定是被夺、死亡或其他原因，因此保留原文的开放性。
translation_notes:
  register: 采用现代、凝练而庄重的箴言体。以“宁可……也不要……”清楚呈现希伯来文中由 וְאַל 构成的强烈对比；避免生硬照搬“让……遇见一个人”的句法。
