  text: אֹ֣הֵֽב פֶּ֭שַׁע אֹהֵ֣ב מַצָּ֑ה מַגְבִּ֥יהַּ פִּ֝תְח֗/וֹ מְבַקֶּשׁ שָֽׁבֶר־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/019.yaml
  text: Whoever loves transgression loves strife[a]; he who makes his door high seeks destruction.
translation:
  language: zh_hans
  text: '喜爱过犯的，喜爱纷争；

    把自己的门口抬高的[a]，寻求毁灭。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “门口”也可译作“入口”或“门”。“抬高门口”这一形象的确切含义并不明确，可能暗示骄傲自高、炫耀排场，或采取一种会招来灾祸的做法。
    reason: 保留 פִּתְחוֹ 的词义范围以及整幅图像的解释空间，避免正文武断地锁定一种隐喻。
lexical_decisions:
- source_word: אֹהֵב
  choice: 喜爱
  rationale: 该词是 אָהַב 的主动分词，表示爱好、喜爱或乐于某事。“喜爱”保留两分句之间重复用词所形成的平行和道德力度。
- source_word: פֶּשַׁע
  choice: 过犯
  rationale: 该词常指有意的违犯或反叛，不只是无心之失。“过犯”既保留其伦理严重性，也符合箴言的庄重语体。
- source_word: מַצָּה
  choice: 纷争
  rationale: 这里指争执、冲突或相争的状态。“纷争”自然简洁，范围也比具体一次“争吵”更广。
- source_word: מַגְבִּיהַּ
  choice: 抬高
  rationale: 这是 גבה 的使役分词，基本义为“使之高、抬高”。译作“抬高”保留原文具体而含蓄的空间意象，不先替读者确定其象征意义。
- source_word: פִּתְחוֹ
  choice: 自家门口
  rationale: פֶּתַח 可指开口、入口或门口。结合所属后缀，译作“自家门口”在现代汉语中自然，也不把场景过度限定为城门或豪宅大门。
- source_word: מְבַקֶּשׁ
  choice: 寻求
  rationale: בקש 的通常意义是寻找、寻求。这里带有箴言式反讽，指这种行为实际是在招致恶果；保留“寻求”可传达原文的尖锐表达。
- source_word: שָׁבֶר
  choice: 败亡
  rationale: שֶׁבֶר 可表示破裂、崩溃、灾祸或毁灭。“败亡”表达严重结局，同时比单指物体“破碎”更适合此处的人生警戒。
theological_decisions:
- issue: “抬高门口”这一形象的具体所指
  choice: 正文保留具体形象，不把它直接解释成骄傲、炫耀或招灾
  alternative: 直接意译为“自高自大的，自取灭亡”或“炫耀门第的，招致毁灭”
  rationale: 希伯来文只陈述“抬高他的门口”，其隐喻可能涉及自我高举、夸耀性建筑、安全上的漏洞，或招致崩塌；直接选定一种解释会消除原文真实存在的含混性。
translation_notes:
  register: 采用现代、庄重而易懂的箴言体。“就是”加强前半句的判断关系；后半句用“是在寻求”保留原文“寻求毁灭”的反讽力度。分行呈现两个对应分句。
