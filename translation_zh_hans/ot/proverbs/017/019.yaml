- from: '喜爱过犯的，就是喜爱纷争；

    把自家门口抬高的[a]，是在寻求败亡。'
  to: '喜爱过犯的，喜爱纷争；

    把自己的门口抬高的[a]，寻求毁灭。'
  rationale: 仅作两项安全的措辞调整：以“自己的”直接呈现所属关系，并以“毁灭”更完整地覆盖 שָׁבֶר 的广泛毁坏／破灭语义。正文仍保留原文的具体门口意象、平行重复与反讽性的“寻求”。
