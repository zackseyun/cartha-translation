  text: עֶֽבֶד מַשְׂכִּ֗יל יִ֭מְשֹׁל בְּ/בֵ֣ן מֵבִ֑ישׁ וּ/בְ/ת֥וֹךְ אַ֝חִ֗ים יַחֲלֹ֥ק נַחֲלָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/002.yaml
  text: A prudent slave will rule over a son who brings shame[b][a], and among brothers he will share the inheritance.
translation:
  language: zh_hans
  text: 行事明智的奴隶[a]必管辖使人蒙羞的儿子，也必与兄弟[b]一同分得产业。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“仆人”。希伯来语 עֶבֶד 可指“奴隶”或“仆人”；这里译作“奴隶”，以保留受支配者竟高过贻羞之子的强烈身份反差。
    reason: lexical_alternative
  - marker: b
    text: 原文作“兄弟”。此处在继承产业的语境中，很可能指一同承受产业的家族成员。
    reason: lexical_clarification
lexical_decisions:
- source_word: עֶבֶד
  choice: 奴隶
  rationale: 该词可指奴隶或仆人；本句的警策力量来自社会地位的逆转，因此用“奴隶”突出受支配者竟能管辖不肖之子的反差。
- source_word: מַשְׂכִּיל
  choice: 行事明智的
  rationale: 该分词强调有见识、处事审慎并取得成效，不只是拥有抽象智慧；“行事明智”符合箴言的实践智慧语境。
- source_word: יִמְשֹׁל
  choice: 必管辖
  rationale: משׁל表示统治或行使权柄；“管辖”保留其直接含义及本句的社会逆转。
- source_word: בְּבֵן מֵבִישׁ
  choice: 令人蒙羞的儿子
  rationale: 介词标明受管辖的对象；מֵבִישׁ具有使人受羞辱、带来羞耻的主动意味，故不弱化为仅指自身可耻。
- source_word: וּבְתוֹךְ אַחִים
  choice: 也必在兄弟中
  rationale: 该短语表示他被纳入家中男性继承人的群体；“兄弟”保留希伯来语阳性复数的亲属称谓。
- source_word: יַחֲלֹק נַחֲלָה
  choice: 同分产业
  rationale: חלק与“产业”连用，可指参与分配并获得一份继承产业；“同分产业”简洁地表达与家中儿子共同承受产业。
theological_decisions:
- issue: 社会身份 עֶבֶד 的表达
  choice: 奴隶
  alternative: 仆人
  rationale: 原词容许两种译法，但这里若淡化其受支配身份，就会削弱箴言刻意呈现的身份逆转；译作“奴隶”并非为经文增添特定制度细节。
- issue: 亲属称谓 אַחִים 的性别表达
  choice: 兄弟
  alternative: 手足／兄弟姐妹
  rationale: 原文明确使用阳性复数，且语境涉及古代家庭继承人；正文保留“兄弟”，脚注说明其语境所指。
- issue: 奴隶参与继承的具体法律机制
  choice: 保留“同分产业”的概括表达
  alternative: 明确解释为被收养、获赠或正式成为继承人
  rationale: 经文只陈述他会参与产业分配，并未说明其取得份额的法律途径，因此不替原文消除这一张力。
translation_notes:
  register: 采用现代、庄重而易懂的箴言体。“行事明智”避免“精明”可能带有的圆滑或算计意味；“同分产业”略带凝练的书面色彩，与智慧文学的格言语气相称，同时不把 נַחֲלָה 仅限缩为现金或一般遗物。
