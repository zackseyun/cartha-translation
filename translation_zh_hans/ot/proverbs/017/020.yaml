base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/020.yaml
  text: A crooked heart does not find good, and one who is twisted in his tongue falls into trouble.
translation:
  language: zh_hans
  text: 内心乖僻的人得不着好处；言语乖谬的人必陷入祸患。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עִקֶּשׁ לֵב
  choice: 心地乖僻的人
  rationale: עִקֶּשׁ 表示扭曲、乖僻；与“心”连用，指内在意向不正。“心地乖僻”既保留原文意象，也符合现代汉语表达。
- source_word: לֹא יִמְצָא טוֹב
  choice: 得不着福
  rationale: מצא 字面为“找到、得着”，טוֹב 可指好处、福祉或美善。此处“得不着福”保留结果上的开放性，不限定为道德上的善或物质利益。
- source_word: נֶהְפָּךְ בִּלְשׁוֹנוֹ
  choice: 舌头颠倒的人
  rationale: נֶהְפָּךְ 表示翻转、颠倒或反常；“舌头”是原文对言语的具象表达。“舌头颠倒”保留其不寻常而有力的意象，可涵盖言语乖谬、反复或歪曲。
- source_word: יִפּוֹל בְּרָעָה
  choice: 必陷入祸患
  rationale: נפל ב־ 表示落入，רָעָה 在此最自然地指灾祸、患难；“陷入祸患”准确传达其后果。未显式译出希伯来语未完成式中的确定语气，但以“必”体现箴言式断言。
theological_decisions:
- issue: טוֹב 的所指
  choice: 福
  alternative: 善／好处
  rationale: 上下句讨论乖僻内心和扭曲言语所招致的结果，因此“福”能自然涵盖好结果与福祉，同时不把它狭义化为财富或救恩。
- issue: נֶהְפָּךְ בִּלְשׁוֹנוֹ 的道德含义
  choice: 舌头颠倒
  alternative: 言语乖谬／口舌奸诈
  rationale: 原文措辞具有隐喻性，未明确限定为欺诈、亵渎或反复无常；直译式表达保留这种语义张力，避免加入特定罪名。
translation_notes:
  register: 采用简洁、对称的箴言体。分号呈现两行平行关系；“乖僻”“颠倒”“祸患”庄重但仍为现代读者易懂。未加脚注，因为主要语义可在正文中充分表达。
