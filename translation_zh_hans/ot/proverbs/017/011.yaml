  text: אַךְ מְרִ֥י יְבַקֶּשׁ רָ֑ע וּ/מַלְאָ֥ךְ אַ֝כְזָרִ֗י יְשֻׁלַּח בּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/011.yaml
  text: A rebellious man seeks only evil[a], and a cruel messenger will be sent against him.
translation:
  language: zh_hans
  text: 悖逆者所求的无非是恶事；残酷的使者[a]必被差去攻击他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “使者”也可译作“天使”；希伯来语这个词可指使者，也可指天使。
    reason: 保留原词可能指人间使者或超自然天使的歧义。
lexical_decisions:
- source_word: אַךְ
  choice: 无非
  rationale: 此处具限制、强调作用；“所求的无非是”自然表达其所追求的只有恶事。
- source_word: מְרִי
  choice: 悖逆者
  rationale: 该名词本可指抽象的“悖逆”，但结合后面的阳性单数动词和代词，此处宜按转喻理解为悖逆的人。
- source_word: יְבַקֶּשׁ
  choice: 所求的
  rationale: 保留“寻求、追求”的基本意义，并与“无非是”组成自然的现代汉语句式。
- source_word: רָע
  choice: 恶事
  rationale: 既表达道德上的恶，也适合此处作为悖逆者追求的对象；不把词义缩窄为灾祸或麻烦。
- source_word: מַלְאָךְ
  choice: 使者
  rationale: 原词既可指人的使者，也可指天使；正文采用较宽泛的“使者”，避免把其身份过度确定为超自然存在，并以脚注保留另一可能。
- source_word: אַכְזָרִי
  choice: 残酷的
  rationale: 直接传达该形容词所含的冷酷、严厉意味，不弱化惩治者的可怕性质。
- source_word: יְשֻׁלַּח
  choice: 必奉差遣
  rationale: 体现原文被动语态；“必”符合箴言所陈述的必然后果，而“奉差遣”自然暗示有差遣者，却不擅自指明其身份。
- source_word: בּוֹ
  choice: 来对付他
  rationale: 在敌对、惩治的语境中，该介词表达针对性的行动；“来对付他”比机械直译为“在他里面”或“到他那里”更符合现代汉语。
theological_decisions:
- issue: מַלְאָךְ在此是人的“使者”还是超自然的“天使”
  choice: 正文译为“使者”
  alternative: 天使
  rationale: 经文本身没有明确说明该执行惩治的主体来自天上。“使者”保留原词较广的语义范围，不额外加入特定神学判断；脚注则保留“天使”的真实可能。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“悖逆者所求的无非是恶事”保留首句的限制语气；分号呈现希伯来诗句两分句之间由恶行转向惩治后果的对应关系。
