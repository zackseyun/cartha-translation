  text: A rebuke goes deeper into a man of understanding than a hundred blows into a fool[a].
translation:
  language: zh_hans
  text: 责备使明白人深受触动，胜过责打愚昧人一百下。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“责备深入明白人，胜过击打愚昧人一百次。”
    reason: 词义与句法的另一种表达，较贴近原文“进入／深入”的空间意象及其与“击打”的比较结构。
lexical_decisions:
- source_word: תֵּחַת
  choice: 深入
  rationale: 此处动词表达落下、进入并产生深刻作用；“深入”既保留形象，也自然地传达责备对明白人的影响。
- source_word: גְּעָרָה
  choice: 责备
  rationale: 指言语上的严正纠正；“责备”简洁庄重，符合现代汉语智慧文学的语体。
- source_word: בְמֵבִין
  choice: 明白人
  rationale: 该阳性单数分词指能理解、能分辨的人；“明白人”保留《箴言》中人物类型的简练表达。
- source_word: מֵהַכּוֹת
  choice: 胜过责打
  rationale: 前缀 מ־表示比较，动词不定式指击打；“胜过责打”清楚呈现两种管教效果的对照。
- source_word: כְּסִיל
  choice: 愚昧人
  rationale: 在《箴言》中指在道德和认知上顽梗的人，并非单指智力不足；“愚昧人”能承载这一智慧文学术语的含义。
- source_word: מֵאָה
  choice: 一百下
  rationale: 数词具有强化和夸张作用；加量词“下”符合现代汉语，也保留击打次数的鲜明形象。
theological_decisions: []
