  text: The beginning of strife is like letting out water[b][a]; so abandon the quarrel before it breaks out.
translation:
  language: zh_hans
  text: 纷争的开端，好比放水；争端尚未爆发，就当罢手。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “爆发”所译的希伯来语词含义较难确定，也可理解为“迸发”“显露”或“激化”。“放水”的图像可能指打开堤坝或水道的缺口，使水一旦流出便难以止住。
    reason: lexical_alternative
lexical_decisions:
- source_word: פּוֹטֵר מַיִם
  choice: 放水决口
  rationale: פּוֹטֵר表示打开、释放原本受阻之物；与“水”连用，描绘水从缺口泄出、继而难以遏止的景象。“放水决口”在现代汉语中简明地保留这一具体比喻。
- source_word: רֵאשִׁית מָדוֹן
  choice: 纷争一开始
  rationale: רֵאשִׁית指开端或初始阶段，מָדוֹן指争竞、纷争。“纷争一开始”自然清楚，也符合箴言简练的表达。
- source_word: וְלִפְנֵי
  choice: 所以……尚未……就
  rationale: 原文直译为“而在……以前”。汉语用“所以……尚未……就”把前半句的警戒与后半句的命令自然连接起来。
- source_word: הִתְגַּלַּע
  choice: 爆发
  rationale: 此词词义较难确定，可能表示迸发、显露或激化。结合争吵及决水的意象，“爆发”传达冲突公开且趋于失控的情形，同时以脚注保留其他可能。
- source_word: הָרִיב
  choice: 争吵
  rationale: רִיב可指争讼、争执或争吵；此处“争吵”适合人际冲突语境，并与前句较广义的“纷争”有所区分。
- source_word: נְטוֹשׁ
  choice: 罢手
  rationale: 该命令式要求停止、撇下争端。“罢手”在现代汉语中简洁有力，准确表达冲突升级前应当停止参与。
