  text: A man lacking sense shakes hands[c][b][a], pledging security before his neighbor.
translation:
  language: zh_hans
  text: 缺乏判断力的人击掌作保[a]，在邻舍面前作保[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“击手掌”。这是承担承诺或担保责任时所用的约定动作。
    reason: cultural_note
  - marker: b
    text: “作保”所译的希伯来文以同根动词和名词连用，强调承担保证责任。“在邻舍面前”也可理解为“当着邻舍的面”；原文没有明确邻舍是受益人、债权人还是见证人。
    reason: lexical_alternative
lexical_decisions:
- source_word: אָדָם
  choice: 人
  rationale: 这里的单数名词指智慧格言中的一个典型人物；汉语“人”自然保留其泛指作用，无须额外标明性别。
- source_word: חֲסַר לֵב
  choice: 缺乏判断力
  rationale: 字面是“缺少心”；在希伯来智慧文学中，“心”常指理解、判断和明辨能力。“缺乏判断力”既传达习语含义，也保留其智性与道德分量。
- source_word: תּוֹקֵעַ כָּף
  choice: 击掌立约
  rationale: 字面为“击手掌”，指以击掌或握手的动作正式承担承诺。结合下文的担保语境，“击掌立约”比现代汉语中通常表示庆祝的单独“击掌”更清楚。
- source_word: עֹרֵב עֲרֻבָּה
  choice: 作保
  rationale: 原文以同根动词和名词连用，强调承担担保责任。汉语“作保”简洁而准确地表达法律及财务上的保证关系；同根复沓无法自然直译，故在脚注说明。
- source_word: לִפְנֵי רֵעֵהוּ
  choice: 在邻舍面前
  rationale: לִפְנֵי 的基本意思是“在……面前／当着……的面”。这样译可保留原文对邻舍究竟是受益人、债权人还是见证人的含混，不擅自译成“为邻舍”。
theological_decisions:
- issue: 箴言是在绝对禁止担保，还是以反面人物警戒轻率担保
  choice: 保持格言的直接刻画，不增译“轻率地”或“不可”
  alternative: 译成明确禁令，或加上“轻率地”为行为定性
  rationale: 原文以“缺乏判断力的人”描写这种行为，其警戒意味鲜明，但句法并非直接命令；译文不把隐含评价改写成绝对禁令。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“击掌立约”保留古代动作意象并交代其约定功能；“作保”是普通读者容易理解的现代表达。句式简洁，符合箴言的格言体。
