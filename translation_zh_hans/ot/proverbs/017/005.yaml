base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/005.yaml
  text: Whoever mocks the poor insults his Maker[c][b][a]; he who rejoices at calamity will not go unpunished.
translation:
  language: zh_hans
  text: 嘲笑穷人的，就是侮辱他的造物主；幸灾乐祸的，必不能免受惩罚。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “必不能免受惩罚”也可译作“必不算为无罪”或“必不得宣告无罪”。
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹעֵג
  choice: 嘲笑
  rationale: 该词表示以言语讥诮、蔑视；“嘲笑”简洁自然，并保留主动轻蔑的意味。
- source_word: לָרָשׁ
  choice: 穷人
  rationale: רָשׁ 指贫穷、困乏的人；“穷人”是现代汉语中自然、清楚的对应表达。
- source_word: חֵרֵף
  choice: 侮辱
  rationale: 该动词含责骂、羞辱、以轻蔑相待之意；“侮辱”准确表达这里对造物主的冒犯，又不将其过度限定为宗教礼仪意义上的亵渎。
- source_word: עֹשֵׂהוּ
  choice: 造他的主
  rationale: 原文直译为“造他的那一位”，其中第三人称单数后缀自然回指穷人；“造他的主”既保留这一关系，也自然传达上帝作为创造者的含义。
- source_word: שָׂמֵחַ לְאֵיד
  choice: 幸灾乐祸
  rationale: 此短语指因灾祸而欢喜；“幸灾乐祸”是现代汉语的固定表达，准确呈现这种应受谴责的喜悦。
- source_word: לֹא יִנָּקֶה
  choice: 必不能免受惩罚
  rationale: נקה 的尼法勒式可指被判无罪、免罪或免受惩罚；在此智慧文学的道德审判语境中，“不能免受惩罚”清楚传达其后果，“必”则体现否定将来式的确定语气。
theological_decisions:
- issue: “造他的主”的所指
  choice: 理解为穷人的创造者，即上帝；嘲笑穷人因而也是对上帝的侮辱。
  alternative: 较笼统地译作“造物主”，不凸显原文后缀与穷人的回指关系。
  rationale: עֹשֵׂהוּ 的宾语后缀最自然地回指前面的穷人。译文保留这种个人性的创造关系，不增添原文以外的神学说明。
- issue: לֹא יִנָּקֶה 的司法与惩罚含义
  choice: 正文采用“必不能免受惩罚”。
  alternative: “必不算为无罪”或“必不得宣告无罪”。
  rationale: 原词兼有不被判为无罪和不免受惩罚的含义。正文选择现代汉语中更自然、适合箴言语境的结果性表达，并以脚注保留司法性的译法。
- issue: 箴言中阳性单数形式的泛指功能
  choice: 使用“……的”结构作普遍性陈述，不标明性别。
  alternative: 使用“那人”或男性代词，以形式对应希伯来语阳性单数。
  rationale: 希伯来语阳性单数在此是通用的箴言表达，并非特指男性；汉语无需借助有性别的代词即可准确保留泛指意义。
translation_notes:
  register: 采用简洁、对称的现代箴言体。“嘲笑穷人的，就是……”与“幸灾乐祸的……”形成平行结构；用语庄重而易懂。避免在正文中加入解释性扩写，并以脚注保存 לֹא יִנָּקֶה 的司法语义幅度。
