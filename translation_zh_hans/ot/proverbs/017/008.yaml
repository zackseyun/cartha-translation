  text: אֶֽבֶן חֵ֣ן הַ֭/שֹּׁחַד בְּ/עֵינֵ֣י בְעָלָ֑י/ו אֶֽל כָּל אֲשֶׁ֖ר יִפְנֶ֣ה יַשְׂכִּֽיל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/008.yaml
  text: A bribe is a charm-stone in the eyes of its owner[a]; wherever he turns[b], he prospers.
translation:
  language: zh_hans
  text: 贿赂在持有者眼中是一块幸运石[a]；无论他转向哪里，都能成功[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“恩宠之石”。也可译作“贵重宝石”“有魔力的石头”或“护身符”。这里可能指一种被认为能博取好感、带来顺利的东西。
    reason: lexical_alternative
  - marker: b
    text: 或译“都亨通”。原文动词可表示行事成功、顺利，也可含有精明行事的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶבֶן חֵן
  choice: 讨人喜悦的宝石
  rationale: 原文直译为“恩宠之石”或“蒙悦纳之石”。此处把贿赂比作能为持有者博取好感、带来便利的石头。“讨人喜悦的宝石”保留石头意象及“获得 favor”的核心含义，同时脚注列出“贵重宝石”“护身符”等可能理解。
- source_word: הַשֹּׁחַד
  choice: 贿赂
  rationale: 该名词通常指用于收买人的财物，而非中性的礼物；“贿赂”准确保留本节所描写的腐败手段。
- source_word: בְּעֵינֵי
  choice: 在……眼中
  rationale: 保留希伯来语表示主观看法或评价的常见身体意象，在现代汉语中也自然。
- source_word: בְעָלָיו
  choice: 持有者
  rationale: 原词可指它的主人或拥有它的人；在本语境中即手里握有贿赂、准备使用它的人。“持有者”既保留所属性，又不误加社会身份。
- source_word: אֶל כָּל אֲשֶׁר יִפְנֶה
  choice: 无论他转向哪里
  rationale: 贴近原文“向着他所转向的一切”，表达他在各种方向、处境或所办之事上。
- source_word: יַשְׂכִּיל
  choice: 都能成功
  rationale: שׂכל 的使役式在此可指行事有成、顺利亨通，也可带有精明行事的意味。上下文强调贿赂在持有者看来处处奏效，因此译为“成功”，但不把这种成功说成道德上的智慧。
theological_decisions:
- issue: 本句是在认可贿赂，还是描述持有者对其功效的看法
  choice: 保留“在持有者眼中”的视角限定，不增添明确谴责语
  alternative: 译成直接断言贿赂必然使人亨通，或补入“他以为”等解释性措辞
  rationale: 原文明确标示“在其持有者眼中”，但下半句在语法上仍是直陈。译文保留这种张力：智慧格言如实观察贿赂的现实功效，却不把观察改写为道德赞许，也不额外淡化其陈述。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“讨人喜悦的宝石”保留原文较为突出的“石头”比喻，避免直接落实为魔法物件；分号维持两行格言的对应关系。两个脚注标记均已置入正文。
