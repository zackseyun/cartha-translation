  yaml_path: translation/ot/proverbs/017/009.yaml
  text: Whoever covers over an offense seeks love[c][b][a], but he who repeats a matter separates close friends.
translation:
  language: zh_hans
  text: 遮掩过错，是寻求爱；反复提起一件事，却使密友疏远。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “反复提起一件事”也可译作“重提一件事”。希伯来文此处可指再次提及某件事。
    reason: lexical_alternative
lexical_decisions:
- source_word: מְכַסֶּה
  choice: 遮掩
  rationale: 保留希伯来文“遮盖”的意象，表达不揭露、不反复追究别人的过错，而不直接将其解释为“饶恕”。
- source_word: פֶּשַׁע
  choice: 过错
  rationale: 此处是人际关系语境；“过错”自然易懂，并能涵盖冒犯与越界行为。
- source_word: מְבַקֵּשׁ
  choice: 寻求
  rationale: 直接对应“寻求、追求”，保留箴言所陈述的动机与目标。
- source_word: אַהֲבָה
  choice: 爱
  rationale: 采用宽泛而直接的对应词，不把含义预先收窄为友情或和睦。
- source_word: שֹׁנֶה בְדָבָר
  choice: 重提旧事
  rationale: 该短语指再次提起或翻出某件事；“重提旧事”在现代汉语中自然地表达反复提及既往过错的语境。
- source_word: מַפְרִיד
  choice: 使……疏远
  rationale: 原词表示造成分离；在人际语境中，“使……疏远”比生硬的“分开”更自然，同时保留关系遭破坏的结果。
- source_word: אַלּוּף
  choice: 密友
  rationale: 此处指亲密的朋友或伙伴；采用单数“密友”，保留希伯来文形式及其泛指作用。
theological_decisions: []
translation_notes:
  register: 采用简洁、对称的箴言体。“遮掩过错”保留原文意象；“寻求爱”保留语义张力，不扩写为“促进和睦”。后半句以“重提旧事”传达现代汉语中的关系语境，并用单数“密友”保留原文形式。
