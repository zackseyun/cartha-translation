base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/027.yaml
  text: Whoever restrains his words has knowledge[b][a], and a man of understanding is cool in spirit.
translation:
  language: zh_hans
  text: 约束自己言语的，有知识；性情冷静[a]的，是明辨之人[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“心平气和”。希伯来语字面为“冷的灵（性情）”，用温度意象描写沉着自制。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语为阳性单数“明辨的男子”；在箴言中，这种形式可用以泛指具有明辨能力的人。
    reason: cultural_note
lexical_decisions:
- source_word: חֹשֵׂךְ אֲמָרָיו
  choice: 约束言语
  rationale: חֹשֵׂךְ在此指克制、收住，而אֲמָרָיו指所说的话。“约束言语”既自然，也保留箴言对言语自制的强调。
- source_word: יוֹדֵעַ דָּעַת
  choice: 有知识
  rationale: 希伯来语字面近于“知道知识”，实际表达一个人具有知识；译作“有知识”符合现代汉语习惯。
- source_word: וְקַר רוּחַ
  choice: 心气冷静
  rationale: קַר本义为“凉、冷”，רוּחַ在此指人的内在气质或情绪状态。“心气冷静”既传达沉着自持，也尽量保留原文的温度意象。
- source_word: אִישׁ תְּבוּנָה
  choice: 明辨的人
  rationale: 该短语指具有理解力、洞察力的人。“明辨的人”简洁自然，并保留智慧文学所强调的辨识能力。
theological_decisions:
- issue: 智慧箴言中的阳性单数表达
  choice: 明辨的人
  alternative: 有悟性的男子
  rationale: אִישׁ在形式上是阳性单数，但在本箴言中以个体为例陈述普遍真理。现代汉语的“人”不标语法性别，既不排除原文所指，也避免把普遍教训误限于男性；脚注说明原文形式。
- issue: “冷”的比喻是否解释为“平静”
  choice: 心气冷静
  alternative: 心平气和
  rationale: 原文用温度意象描写内在克制。正文保留“冷静”以维持这一形象，同时不把它误解为冷漠；脚注提供较解释性的表达。
translation_notes:
  register: 采用简洁、对称的箴言句式。“约束言语”庄重而易懂；“心气冷静”是现代汉语可理解的表达，并保留原文具体的温度意象。
