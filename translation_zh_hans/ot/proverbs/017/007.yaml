base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/007.yaml
  text: Excellent speech is not fitting for a fool[b][a]; how much less are lying lips for a noble man.
translation:
  language: zh_hans
  text: 愚昧人说高超的话[a]尚且不相宜，何况尊贵的人[b]说谎呢！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“高雅的话”、“高调的话”或“夸大的话”。原文可强调言辞卓越、高扬或过度。
    reason: lexical_alternative
  - marker: b
    text: 或译“贵族”、“首领”或“慷慨的人”。原词既可指尊贵的地位，也可指高尚、慷慨的品格。
    reason: lexical_alternative
lexical_decisions:
- source_word: נָאוָה
  choice: 相宜
  rationale: 该词表达合宜、相称之意。“不相宜”自然凝练，突出本节关于言语与身份、品格是否相称的对比。
- source_word: נָבָל
  choice: 愚昧人
  rationale: 在智慧文学中通常指在道德和判断力上愚顽的人，不只是智力不足；“愚昧人”符合《箴言》的常用语体。
- source_word: שְׂפַת יֶתֶר
  choice: 高雅的话
  rationale: שְׂפַת 字面为“嘴唇”，可转指言语；יֶתֶר 可含卓越、高超、过度或高调之意。正文采用“高雅的话”，表达与愚昧人不相称的上乘言辞，同时以脚注保留其他可能。
- source_word: אַף כִּי
  choice: 尚且……就更……
  rationale: 该结构表达递进的“何况／更不用说”论证。中文用“尚且……就更……”清楚呈现由前半句到后半句加强的逻辑。
- source_word: נָדִיב
  choice: 尊贵人
  rationale: 该词既可指地位尊贵的人，也可指品格高尚、慷慨的人，有时特指首领或王子。“尊贵人”保留身份与品格两方面的开放性。
- source_word: שְׂפַת שָׁקֶר
  choice: 说谎话
  rationale: 原文直译为“虚假的嘴唇”。“说谎话”是自然现代汉语，并与前句“说高雅的话”形成清晰平行；具体的嘴唇意象虽未直译，但核心行为准确保留。
theological_decisions: []
translation_notes:
  register: 采用现代、凝练而庄重的箴言体。“尚且……就更……”保留原文递进力度；两个分句均用“说……话”形成自然对仗。脚注分别保留 שְׂפַת יֶתֶר 与 נָדִיב 的真实词义幅度，不在正文中强行消解歧义。
