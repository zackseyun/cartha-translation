  text: Better is a dry crust with peace than a house full of sacrificial feasts with strife[a].
translation:
  language: zh_hans
  text: 一块干饼而有安宁，胜过满屋祭肉而有纷争。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“祭物”；希伯来文可指献祭之物，也可指与献祭相关的丰盛筵席。
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: 胜过
  rationale: 希伯来文以“好……胜于……”构成比较式箴言；中文用“……胜过……”自然而简洁。
- source_word: פַּת חֲרֵבָה
  choice: 干饼
  rationale: פַּת 指一块或一口饼，חֲרֵבָה 指干的；“干饼”保留简陋食物的鲜明意象，又符合中文箴言体。
- source_word: וְשַׁלְוָה בָהּ
  choice: 而安宁
  rationale: שַׁלְוָה 表示安静、安稳、平和；“安宁”与后半句的“争吵”形成家庭氛围上的对照。后缀 בָהּ 所指略有含混，可理解为在此处境或其中，中文不生硬补出代词。
- source_word: מִבַּיִת מָלֵא
  choice: 胜过满屋
  rationale: מִן 表比较，בַּיִת 保留具体的“屋/家”意象；“满屋”凝练地表达丰富充盈。
- source_word: זִבְחֵי
  choice: 祭肉
  rationale: זֶבַח 可指祭牲、献祭，也可延伸指献祭筵席中的肉食；语境强调丰盛饮食，“祭肉”兼顾祭祀背景与宴食意象。
- source_word: רִיב
  choice: 争吵
  rationale: 表示争竞、纷争；“争吵”是自然现代汉语，并与“安宁”构成清楚对照。
