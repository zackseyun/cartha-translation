  text: מַצְדִּ֣יק רָ֭שָׁע וּ/מַרְשִׁ֣יעַ צַדִּ֑יק תּוֹעֲבַ֥ת יְ֝הוָ֗ה גַּם שְׁנֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/015.yaml
  text: The one who acquits the wicked and the one who condemns the righteous—both alike are an abomination to Yahweh[a].
translation:
  language: zh_hans
  text: 判恶人为无罪的，判义人为有罪的，二者都是耶和华所憎恶的。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“称恶人为义、判义人为有罪的，二者都是耶和华所憎恶的。”
    reason: 保留“称……为义”这一较贴近字面的译法，同时维持两个使役动词在司法语境中的对举；“义人”和“恶人”兼具道德与司法色彩。
lexical_decisions:
- source_word: מַצְדִּיק
  choice: 判……为无罪
  rationale: 该词是צדק的使役分词，在与“判……为有罪”对举的语境中具有司法含义；此译清楚表达法庭上的无罪判决，又避免“称义”可能引出的后期神学联想。
- source_word: רָשָׁע
  choice: 恶人
  rationale: 保留该词兼具道德与司法层面的含义；“罪人”容易带入更宽泛的神学用语，“有罪的人”则会缩窄其道德色彩。
- source_word: וּמַרְשִׁיעַ
  choice: 判……为有罪
  rationale: 该词是רשע的使役分词，在司法语境中指宣判有罪，与前半句形成准确而自然的法庭用语对照。
- source_word: צַדִּיק
  choice: 义人
  rationale: “义人”既保留道德正直的含义，也容纳在具体案件中占理、无辜的司法意味，避免将其单纯缩窄为“无辜者”。
- source_word: תּוֹעֲבַת
  choice: 为……所憎恶
  rationale: 表达该词强烈的道德厌恶含义；现代汉语中比直译为“可憎之物”更自然，同时不削弱语气。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文圣经语境中对四字神名最通行、最易识别的音译，而不以“主”这一称号替代专名。
- source_word: גַּם שְׁנֵיהֶם
  choice: 这两种人都同样
  rationale: 明确指出两类颠倒判决的人同受谴责，并传达גם所带的并列、同等强调。
theological_decisions:
- issue: צדק与רשע的使役形式应按司法宣判还是一般道德对待来理解
  choice: 采用司法语言“判……为无罪／判……为有罪”
  alternative: 译作“把恶人当作义人／把义人当作恶人”或“称恶人为义／定义人为恶”
  rationale: 两个使役分词构成法庭判决的鲜明反义对举。司法译法最贴合上下文，也避免把“称义”等词在后期神学中的专门含义带入本节。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语，保持箴言的平行结构和强烈谴责语气。正文以清楚的司法措辞呈现对举；脚注保留较直译的传统表达。
