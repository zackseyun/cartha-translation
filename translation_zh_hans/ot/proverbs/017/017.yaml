  yaml_path: translation/ot/proverbs/017/017.yaml
  text: A friend loves at all times[a], and a brother is born for adversity.
translation:
  language: zh_hans
  text: 朋友无论何时都怀有爱意；弟兄为患难而生。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּ/כָל עֵת
  choice: 时刻都
  rationale: 介词短语表达涵盖一切时候的范围；“时刻都”自然简洁，保留箴言的普遍断言。
- source_word: אֹהֵב
  choice: 爱人
  rationale: Qal主动分词在此表示持续而具有特征性的行为；“爱人”既直接，也避免把宾语误限为某个特定对象。
- source_word: הָ/רֵעַ
  choice: 朋友
  rationale: 虽有定冠词，但箴言体中可泛指一类人；“朋友”比“邻舍”更贴合这里的亲密关系，并在汉语中自然表达泛指。
- source_word: וְ/אָח
  choice: 弟兄
  rationale: אָח的基本义是兄弟，也可延伸指具有亲族般情谊的人；“弟兄”保留原文亲属称谓及两行间的对应关系。
- source_word: לְ֝/צָרָה
  choice: 为患难
  rationale: צָרָה表示困苦、危难或逆境；“患难”凝练庄重，适合箴言语体。介词לְ保留为“为”，不预先判定它仅指目的、处境或时机。
- source_word: יִוָּלֵד
  choice: 而生
  rationale: Niphal形式最直接的含义是“出生”；“而生”保留原文鲜明而略带张力的比喻，也容许理解为弟兄的作用在患难中显明。
theological_decisions:
- issue: “弟兄为患难而生”所表达的是目的、命定，还是患难中的显明
  choice: 正文保留“为患难而生”的简洁结构
  alternative: 患难之时，弟兄由此而生／弟兄生来就是为患难
  rationale: 希伯来语לְצָרָה可容纳目的、关联或处境方面的理解；不在正文中把这种诗性张力缩减为单一神学判断。
translation_notes:
  register: 采用现代、凝练而庄重的箴言语体。分号呈现两行平行关系；保留“而生”的出生意象，不用解释性较强的“就是为了帮助”。
