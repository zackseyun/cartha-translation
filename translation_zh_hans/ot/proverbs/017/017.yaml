review_pass:
  verdict: revise
  source_fidelity: 首句“朋友时刻都爱人”在现代汉语中容易理解为“朋友总是爱所有人”，且“爱人”还可被读作名词（配偶），未能清楚表达希伯来文中“朋友”持续施爱这一泛指特征。末句“弟兄为患难而生”则忠实保留了לְצָרָה与יִוָּלֵד的简洁、带张力的表达。
  naturalness: 将首句改为“朋友无论何时都怀有爱意”可避免“爱人”的歧义，符合现代普通话，同时保持箴言凝练庄重的语体。“弟兄为患难而生”自然有力，无须改动。
  terminology: “朋友”“弟兄”“患难”均恰当。删除现有脚注：其“患难之时，弟兄由此而生”把“为患难而生”误转为由患难造成或产生，不能作为可靠的词汇替代译法。
  issues:
