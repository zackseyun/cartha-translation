    issue: “爱人”有句法和词义歧义。
    rationale: 在“朋友时刻都爱人”中，“爱人”可理解为动宾结构“爱别人”，也可理解为名词“配偶”；前者还使原文未明说的受爱对象显得像是泛指所有人。
  - severity: medium
    issue: 脚注的替代译文“患难之时，弟兄由此而生”不忠实。
    rationale: “由此而生”暗示弟兄因患难而产生，改变了יִוָּלֵד与לְצָרָה所构成的“为患难而生／生来面对患难”的关系。原文的诗性表达并不要求、也不支持这一因果释义。
  revised_text: 朋友无论何时都怀有爱意；弟兄为患难而生。
