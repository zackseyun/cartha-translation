  rationale: 修订首句以消除“爱人”的现代汉语歧义，并保留אֹהֵב作为持续、特征性行动的概括表达。保留末句的出生意象及“为患难”的开放关系，不把它解释成仅指患难时显明情谊，或弟兄由患难产生。删除不可靠且会改变原意的脚注。
