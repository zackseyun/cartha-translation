base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/026.yaml
  text: Also[a], to punish a righteous man is not good[b], nor to strike nobles for their uprightness.
translation:
  language: zh_hans
  text: 惩罚义人不是好事；因他们正直而[a]责打显贵[b]，也不妥。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “因他们正直而”也可理解为“违背公正地”；这样后半句可译作：“违背公正地责打显贵，也不妥。”
    reason: lexical_alternative
  - marker: b
    text: “显贵”也可译作“王公”或“领袖”；希伯来语在这里可指身份或地位较高的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: 也
  rationale: 保留其附加、并列的语气；汉语中放在后半句较自然，并不改变两项行为并列受否定评价的关系。
- source_word: עֲנוֹשׁ
  choice: 惩罚
  rationale: 该词泛指施加处罚；“惩罚”比“罚款”宽泛，也符合司法语境。
- source_word: לַצַּדִּיק
  choice: 义人
  rationale: 保留智慧文学中作为一类人的代表性单数，并以现代汉语圣经语体中自然、明确的称谓表达。
- source_word: לֹא טוֹב
  choice: 本非善事／不妥
  rationale: “本非善事”贴近原文“不好”的评价；后句用“不妥”自然承接，避免生硬重复，同时不把评价强化为原文未明说的法律定罪。
- source_word: לְהַכּוֹת
  choice: 责打
  rationale: 保留击打或体罚的含义，又适合本节惩处高位者的司法或权力语境；不限定为鞭打等具体方式。
- source_word: נְדִיבִים
  choice: 尊贵人
  rationale: 此处较可能指有地位、身份尊贵的人；“尊贵人”保留身份含义，而不武断限定为王室的“诸侯”或正式官职的“领袖”。
- source_word: עַל יֹשֶׁר
  choice: 因正直
  rationale: 按介词 עַל 表示缘由来理解，即因正直而遭责打；同时以脚注保留“违背公正”的另一种句法和语义理解。
theological_decisions:
- issue: 责打尊贵人的原因，还是责打行为违反公正
  choice: 因正直而责打尊贵人
  alternative: 违背公正地责打尊贵人
  rationale: עַל יֹשֶׁר 可表示“因正直”这一缘由，也可作方式或规范性的短语，意为“违反正直／公正”。正文采用较直接的缘由义，脚注保留真实歧义，不将经文的伦理张力单一化。
translation_notes:
  register: 采用现代、庄重而易懂的箴言体。以分号呈现两个平行的不当行为；后半句补出“也不妥”，使希伯来语省略结构在汉语中完整自然。脚注标记均置于正文相关位置。
