base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/025.yaml
  text: A foolish son is grief to his father[b][a], and bitterness to the woman who bore him.
translation:
  language: zh_hans
  text: 愚昧的儿子使父亲忧伤[a]，使那生他的母亲愁苦[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “忧伤”或译“烦恼”或“恼怒”。希伯来词可表示愤怒、烦恼或忧伤；这里更可能指儿子带给父亲的苦楚。
    reason: lexical_alternative
  - marker: b
    text: 直译“生他的那一位”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּעַס
  choice: 忧伤
  rationale: 该词可指愤怒、烦恼或忧伤；在本节中与后半句“痛苦”平行，主要表达儿子带给父亲的精神苦楚。“忧伤”自然且保留了语境中的情感效果。
- source_word: לְאָבִיו
  choice: 使父亲
  rationale: 介词 לְ 在此表示愚昧儿子对父亲造成的影响。汉语用“使父亲”补出无动词句的关系，比直译“对父亲”更自然。
- source_word: בֵּן כְּסִיל
  choice: 愚昧的儿子
  rationale: כְּסִיל 是《箴言》中的典型智慧术语，包含道德和处世上的顽愚，并非单指智力不足；“愚昧”能保留这一含义。
- source_word: וּמֶמֶר
  choice: 痛苦
  rationale: 此罕见名词在这里最可能指苦楚或深切的愁苦，与 כַּעַס 构成同义平行。“痛苦”在现代汉语中自然，也没有把词义过度限定为愤怒或悖逆。
- source_word: לְיוֹלַדְתּוֹ
  choice: 使生他的母亲
  rationale: 原文为“生他的那一位”，特别突出母亲生育他的关系。译作“生他的母亲”既保留这一生动表达，也符合现代汉语习惯。
theological_decisions: []
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语，并保留希伯来诗句的平行结构。两个分句均用“使”明确表达原文介词所指的影响；后半句保留“生他的”这一具体的母性称谓。
