  text: Even a fool who keeps silent is considered wise; one who closes his lips[a], discerning.
translation:
  language: zh_hans
  text: 愚昧人即使默不作声，也被看作有智慧；闭口不言的，也被看作有见识。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文下半句没有重复“被看作”；可按上半句理解为“闭口不言的，也被看作有见识”。直译为：“闭住嘴唇的，是有见识的。”
    reason: 原文省略与诗句平行
lexical_decisions:
- source_word: גַּם
  choice: 也
  rationale: 在“愚昧人”这一出人意料的对象上表达递进、让步意味；与“若……也……”搭配，符合现代汉语习惯。
- source_word: אֱוִיל
  choice: 愚昧人
  rationale: 这是《箴言》中兼含认知与道德缺失意味的智慧文学用语；“愚昧人”比单纯指智力低下的说法更准确。
- source_word: מַחֲרִישׁ
  choice: 若保持沉默
  rationale: 该分词描述不出声、克制言语的状态；“保持沉默”保留持续性的意味，“若”则自然呈现本句隐含的条件关系。
- source_word: חָכָם יֵחָשֵׁב
  choice: 会被看为有智慧
  rationale: חשׁב 的尼法勒形在此表示被认定、被视为；采用被动表达，保留评价来自他人的语义。
- source_word: אֹטֵם שְׂפָתָיו
  choice: 闭口不言的
  rationale: 原文直译为“闭住嘴唇的人”。“闭口不言”既保留具体动作意象，也比“封住嘴唇”更自然。
- source_word: נָבוֹן
  choice: 有见识
  rationale: 该词表示具有理解力、辨别力；“有见识”在现代汉语中自然，并与前句“有智慧”形成相关而不完全重复的平行。
theological_decisions: []
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。保留上下两行的平行结构与“被看为”的外在评价意味，不把箴言解释为沉默本身必然使人真正成为智慧人。
