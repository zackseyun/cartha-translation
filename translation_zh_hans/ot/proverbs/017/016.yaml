base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/016.yaml
  text: Why is there a price in the hand of a fool to buy wisdom when he has no heart for it?[a]
translation:
  language: zh_hans
  text: 愚昧人既没有心思，手里为什么还拿着钱去买智慧呢？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָמָּה זֶּה
  choice: 为什么还
  rationale: 这是引出反问的短语；译作“为什么还”既符合现代汉语习惯，也体现愚昧人虽有购买手段却缺少内在领悟之心所形成的反差。
- source_word: מְחִיר בְּיַד
  choice: 手里拿着钱
  rationale: מְחִיר 指购买所需的价款，בְּיַד 原意为“在手中”。合译为“手里拿着钱”，保留手的意象和商业语境，同时避免较古雅的“手拿价银”。
- source_word: כְּסִיל
  choice: 愚昧人
  rationale: 《箴言》中常指在道德和认知上顽梗、不肯受教的人；“愚昧人”比单纯表示智力低下的称呼更能承载这一智慧文学含义。
- source_word: לִקְנוֹת
  choice: 要买
  rationale: 在“价款”的商业语境中，קנה 取“购买”义；“要买”自然表达不定式所指的目的。
- source_word: חָכְמָה
  choice: 智慧
  rationale: 该词在《箴言》中主要指关乎道德判断和实际生活的智慧；“智慧”是直接且稳定的对应词。
- source_word: וְלֶב אָיִן
  choice: 既无心领悟
  rationale: 原文直译为“却没有心”。希伯来语的“心”可涵盖理解、判断和意愿。“无心领悟”保留“心”的意象，也让现代读者明白此处不是指缺少身体器官；同时不把含义仅限于能力不足或意愿不足。
theological_decisions:
- issue: “没有心”侧重理解能力还是求取智慧的意愿
  choice: 译作“无心领悟”，保留能力与意愿两方面的张力
  alternative: “没有悟性”或“不愿领受”
  rationale: לֵב 在希伯来语人观中兼有思想、判断和意志等含义。只译为“没有悟性”会偏向能力，只译为“不愿领受”则会偏向意愿；正文保留“心”并以“领悟”交代语境，脚注说明其语义范围。
translation_notes:
  register: 采用现代、庄重而口语自然的反问句式。“手里拿着钱”保留原文具体意象；“无心领悟”避免生硬直译，同时由脚注交代字面表达和语义范围。
