  text: מַצְרֵ֣ף לַ֭/כֶּסֶף וְ/כ֣וּר לַ/זָּהָ֑ב וּ/בֹחֵ֖ן לִבּ֣וֹת יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/003.yaml
  text: The crucible is for silver[a], and the furnace for gold[b], but Yahweh tests hearts.
translation:
  language: zh_hans
  text: 炼银用坩埚，炼金用熔炉；耶和华察验人心。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַצְרֵף
  choice: 坩埚
  rationale: 指炼净金属所用的器皿；“坩埚”准确、简洁，并保留冶炼意象。
- source_word: לַכֶּסֶף
  choice: 炼银用
  rationale: 介词ל表示用途或对象；译作“炼银用”符合现代汉语格言式表达，也使隐含的炼净动作自然显明。
- source_word: כּוּר
  choice: 熔炉
  rationale: 指熔炼或精炼金属的炉；“熔炉”通俗明确，并与“坩埚”构成平行。
- source_word: לַזָּהָב
  choice: 炼金用
  rationale: 介词ל表示用途或对象；与前半句“炼银用”保持整齐的平行结构。
- source_word: וּבֹחֵן
  choice: 察验
  rationale: בחן表示检验、考察以辨明真伪；“察验”既保留检验意味，也适合上帝洞察并试验人内心的语境。
- source_word: לִבּוֹת
  choice: 人心
  rationale: 希伯来语“心”涵盖思想、意愿和动机；保留“心”的圣经意象，加“人”则使现代汉语表达自然。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经传统中最通行的专名形式呈现四字神名，避免以称号“主”替代原文专名。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。中文正文采用读者最熟悉且明确为专名的“耶和华”；“雅威”是较接近学界常见复原读音的另一译法，但原始发音不能完全确定。
- issue: בחן用于人内在生命时的力度
  choice: 察验人心
  alternative: 试验人心
  rationale: 金属精炼的对照赋予该词检验真伪的意味。“察验”保留审察与检验两面，且不把经文限定为施加患难式的“试炼”。
- issue: 前两分句与末句的逻辑关系
  choice: 以分号并列对照，不增译“但”
  alternative: 但耶和华察验人心
  rationale: 希伯来文本三项以ו连接，重点是类比：器具检验贵金属，耶和华检验人心。原文并无明确转折标记，因此不强行加入“但”。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。前两句保持紧凑平行，末句以分号引出类比的核心；不添加原文没有明确表达的转折词。
