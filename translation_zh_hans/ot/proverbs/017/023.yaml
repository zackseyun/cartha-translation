base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/023.yaml
  text: A wicked man takes a bribe from the bosom to pervert the paths of justice[a][b].
translation:
  language: zh_hans
  text: 恶人从怀里拿出贿赂[a]，为要使公正的道路偏离正轨[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“从衣襟的褶袋中”；希伯来文的意象可能指从衣服隐蔽的褶袋中取出财物，暗示暗中进行。
    reason: lexical_alternative
  - marker: b
    text: 或译“公正的进程”。
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁחַד
  choice: 贿赂
  rationale: 该词在此指用来左右裁断或行为的不正当财物；“贿赂”是现代汉语中最明确自然的对应词。
- source_word: מֵחֵיק
  choice: 从怀中
  rationale: חֵיק可指胸怀、膝上或衣襟形成的褶袋；“从怀中”保留具体意象，并含蓄传达隐秘交付之意。
- source_word: רָשָׁע
  choice: 恶人
  rationale: 该词是单数阳性实体化用法，泛指邪恶的人；“恶人”简洁、自然，也符合箴言的格言体。
- source_word: יִקָּח
  choice: 收受
  rationale: לקח本义为“拿、取”，在贿赂语境中译作“收受”更符合现代汉语固定搭配，同时不改变主动接受的含义。
- source_word: לְהַטּוֹת
  choice: 为要扭曲
  rationale: 该动词表示使某事偏转、偏离正道；“扭曲”既保留使之变形偏离的力度，也适合司法语境。
- source_word: אָרְחוֹת
  choice: 道路
  rationale: 复数名词意为“路径、道路”；汉语用“道路”可以自然保留希伯来文的路径隐喻，数的差异无须机械显化。
- source_word: מִשְׁפָּט
  choice: 公正
  rationale: 在贿赂与司法败坏的语境中，该词侧重公平正义，而不只是一次具体裁决；“公正”在修饰“道路”时也较自然。
- source_word: אָרְחוֹת מִשְׁפָּט
  choice: 公正的道路
  rationale: 保留原文“道路”的复数性路径意象及其与司法公正的关系；“公正的进程”更顺畅，却会淡化原文隐喻，故列入脚注。
theological_decisions: []
translation_notes:
  register: 采用简洁庄重的现代标准汉语，保持箴言的格言式节奏。主句保留“怀中”和“道路”两个具体意象；用“收受贿赂”确保汉语自然，用“扭曲”表达使司法偏离正轨的目的。
