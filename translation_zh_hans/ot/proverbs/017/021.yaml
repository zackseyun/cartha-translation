  yaml_path: translation/ot/proverbs/017/021.yaml
  text: He who fathers a fool does so to his own grief[b][a], and the father of a fool has no joy.
translation:
  language: zh_hans
  text: 生育愚顽人的人，给自己带来忧伤[a]；卑劣之人的父亲毫无喜乐[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可较直译作：“生育愚顽人的人，是为忧伤而生育；忧伤归于他自己。”希伯来文措辞十分紧凑。
    reason: lexical_alternative
  - marker: b
    text: “卑劣之人”译自希伯来语נָבָל，指道德上可耻、败坏的人，并非仅指智力不足的人。
    reason: cultural_note
lexical_decisions:
- source_word: יֹלֵד
  choice: 生了……之子的
  rationale: 该词是实词化的Qal分词，意为“生育者、生父”。下半句以“父亲”与之平行，因此采用父系语境清楚、现代汉语自然的表达。
- source_word: כְּסִיל
  choice: 愚顽之子
  rationale: 这是《箴言》中常见的智慧文学用语，既指思想愚昧，也含有顽梗、不受教的道德意味；“愚顽”比单纯的“愚笨”更能保留这一层含义。
- source_word: לְתוּגָה לוֹ
  choice: 给自己带来忧伤
  rationale: תוגה表示忧伤、愁苦；介词לְ与后面的לוֹ共同表明这种忧伤归到生父本人。译文以结果性的自然汉语表达这一紧凑结构。
- source_word: וְלֹא יִשְׂמַח
  choice: 毫无喜乐
  rationale: 未完成式在箴言体裁中表达一般性事实或常见结果。“毫无喜乐”保留不欢喜的含义，并与上半句“忧伤”形成鲜明对照。
- source_word: אֲבִי
  choice: ……的父亲
  rationale: 该词为附属形，须由后面的נָבָל补足；译为“……的父亲”符合汉语领属结构，也保留两句之间的父子平行关系。
- source_word: נָבָל
  choice: 卑劣之人
  rationale: 该词不只是智力不足，而着重指道德上败坏、可耻或不知廉耻的人。“卑劣之人”保留其伦理色彩，也避免与上半句的כְּסִיל完全混同。
