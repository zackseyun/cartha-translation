  text: מֵשִׁ֣יב רָ֭עָה תַּ֣חַת טוֹבָ֑ה לֹא תמיש רָ֝עָ֗ה מִ/בֵּיתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/013.yaml
  text: Whoever repays evil for good[a], evil will not depart from his house.
translation:
  language: zh_hans
  text: 以恶报善的人，祸患必不离开他的家。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“恶必不离开他的家。”原文第二个“恶”也可指祸患、灾害。
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵשִׁיב
  choice: 报
  rationale: 该词是 שוב 的使役分词，在此表示使某物作为回报而返回；汉语“以恶报善”自然、凝练地表达回报之意。
- source_word: רָעָה（第一次）
  choice: 恶
  rationale: 第一次指以错误、有害的行为回应所受的善，具有明确的道德含义；“恶”也与“善”形成箴言式对举。
- source_word: תַּחַת
  choice: 以……报……
  rationale: 该介词表示交换或替代关系，融入汉语固定结构“以恶报善”，准确表达“用恶回报善”。
- source_word: טוֹבָה
  choice: 善
  rationale: 原词可指善、好处或恩惠；“善”保持概括性，并与“恶”构成鲜明平衡。
- source_word: לֹא תמיש
  choice: 必不断有
  rationale: 原文表达不会离开、不会移去；结合“祸患”译为“必不断有”，自然呈现祸患持续不离其家的意思。
- source_word: רָעָה（第二次）
  choice: 祸患
  rationale: 第二次出现可指道德上的恶，也可指由恶行招致的灾祸或祸患。正文采用符合汉语语境的“祸患”，脚注保留“恶不离开”的重复表达。
- source_word: מִבֵּיתוֹ
  choice: 他家
  rationale: בַּיִת 可指房屋、家庭或家族；“他家”简洁自然，并保留家庭及家宅范围的宽度。
- source_word: 分词所含的泛指主语
  choice: ……的，他……
  rationale: 希伯来文以名词化分词泛指某类人；现代汉语用“……的，他……”自然表达这一普遍对象。
theological_decisions:
- issue: 第二个 רָעָה 是道德之恶还是灾祸后果
  choice: 正文译为“祸患”，突出临到其家的有害后果
  alternative: “恶必不离开他的家”，保留原文两次 רָעָה 的字面重复
  rationale: 此处语义可能由人的恶行转向持续临到家庭的祸患，但原文的重复也可能有意把行为与后果相连；因此正文采用自然且合乎语境的“祸患”，脚注明示另一译法，不把歧义解释为特定教义。
translation_notes:
  register: 采用现代、凝练而庄重的箴言体。“以恶报善”是通行成语，准确对应原文的交换结构；“他家”比“他的房屋”更自然，也可涵盖家人和家宅。
