base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/022.yaml
  text: A joyful heart promotes healing[a], but a crushed spirit dries up the bones.
translation:
  language: zh_hans
  text: 喜乐的心促进康复[a]；受压伤的心灵使骨头枯干。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“喜乐的心如良药，使人得益。”希伯来语 גֵּהָה 可指医治、康复，也可指疗效或良药。
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵב שָׂמֵחַ
  choice: 喜乐的心
  rationale: לֵב 指人的内在生命，包括情感与意志；שָׂמֵחַ 表示欢喜。译作“喜乐的心”既保留原文的人体意象，也符合现代汉语表达。
- source_word: יֵיטִב
  choice: 促进
  rationale: 这是 יטב 的使役形，含“使之良好、带来益处”之意。与 גֵּהָה 连用时，“促进”自然地表达其有益、促成的作用，同时不把因果关系绝对化。
- source_word: גֵּהָה
  choice: 康复
  rationale: 该名词可指医治、恢复，也可能指疗效或良药。“康复”与下句身体衰败的意象相对，并保留身心恢复的宽泛含义。
- source_word: רוּחַ נְכֵאָה
  choice: 灵里忧伤
  rationale: רוּחַ 在此指人的内在精神或心灵状态；נְכֵאָה 指受打击、被压伤。汉语“灵里忧伤”表达内在受创和消沉，又避免将其误解为人体器官受损。
- source_word: תְּיַבֶּשׁ
  choice: 使……枯干
  rationale: 动词表示使之干枯。“枯干”保留原文强烈而具体的衰败意象。
- source_word: גָּרֶם
  choice: 骨头
  rationale: 原文虽为单数形式，却可作集合意义，指全身骨骼或身体架构。汉语用“骨头”能自然传达这种整体性的身体意象。
theological_decisions:
- issue: 喜乐与康复之间的关系
  choice: 译作“促进康复”
  alternative: 可译作“如良药使人得益”或“有益于医治”
  rationale: 原文表达喜乐之心的有益作用，但箴言属于概括性的智慧格言，并非对每个病例作无条件的医治保证；“促进”保留因果倾向而不将其绝对化。
- issue: רוּחַ 的人论含义
  choice: 译作“灵里”
  alternative: 可译作“心灵”或“精神”
  rationale: 此处主要指人的内在生命状态，不必据此建立身体与灵魂之构成的特定教义。“灵里”保留与 לֵב 的平行，又避免过度限定。
translation_notes:
  register: 采用现代、凝练而庄重的箴言体。分号呈现两个诗行的鲜明对比；保留“心、灵、骨头”的身体与内在生命意象。
