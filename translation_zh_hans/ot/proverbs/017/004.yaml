  yaml_path: translation/ot/proverbs/017/004.yaml
  text: An evildoer listens to wicked lips[a]; a liar gives ear to a destructive tongue.
translation:
  language: zh_hans
  text: 作恶的人听从恶言[a]；说谎的人侧耳听毁灭性的话语。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“作恶的人听从罪孽的嘴唇；虚假留心听毁灭的舌头。”希伯来文也可较直译地把“虚假”理解为抽象概念，而不是“说谎的人”；“嘴唇”和“舌头”借指言语。
    reason: 词义与句法有两种可能；脚注保留שֶׁקֶר的抽象读法，并呈现אָוֶן和הַוֺּת及“嘴唇／舌头”意象较形式对应的译法。
lexical_decisions:
- source_word: מֵרַע
  choice: 作恶的人
  rationale: 此词在本句中作实体用法，指以恶行为特征的人。“作恶的人”是现代汉语中自然、明确的表达，也保留了原文的道德力度。
- source_word: מַקְשִׁיב עַל
  choice: 留心听
  rationale: קשׁב表示专心聆听、留意；与עַל连用时指出所听取的对象。“留心听”既表达听见，也体现主动关注。
- source_word: שְׂפַת אָוֶן
  choice: 邪恶的嘴唇
  rationale: שׂפה本义为“嘴唇”，在此借指言语；אָוֶן可指罪恶、邪恶或祸患。译作“邪恶的嘴唇”保留身体意象和道德含义。
- source_word: שֶׁקֶר
  choice: 说谎的人
  rationale: 该词形式上可指“虚假、谎言”，但与上半句“作恶的人”平行时，可实体化理解为以虚假为特征的人。“说谎的人”在汉语中清楚自然；抽象读法则保留在脚注中。
- source_word: מֵזִין
  choice: 侧耳听
  rationale: אזן的使役词干在此意为“留心听、侧耳听”。译作“侧耳听”保留与上半句同义而不完全重复的诗体平行。
- source_word: לְשׁוֹן הַוֺּת
  choice: 带来毁灭的舌头
  rationale: לשׁון本义为“舌头”，借指言语；הַוֺּת表示毁灭、灾祸或败坏。“带来毁灭的舌头”保留原文意象，并清楚表达这类言语的破坏性。
theological_decisions:
- issue: שֶׁקֶר应理解为抽象的“虚假”，还是指人的“说谎者”
  choice: 正文采用“说谎的人”，使其与上半句“作恶的人”形成自然平行。
  alternative: 按形式更直译为“虚假”，让抽象概念充当主语。
  rationale: 希伯来诗歌容许抽象名词实体化指具有该特征的人；上下两句的结构支持人物性理解，但抽象读法在语法上仍有可能，因此不予排除，并在脚注中说明。
translation_notes:
  register: 采用现代、庄重而易懂的箴言体。两分句以“留心听／侧耳听”和“嘴唇／舌头”构成平行；保留原文的身体部位隐喻，不改写成纯抽象的“言语”。
