  text: כִּֽי יְ֭הוָה יִתֵּ֣ן חָכְמָ֑ה מִ֝/פִּ֗י/ו דַּ֣עַת וּ/תְבוּנָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/002/006.yaml
  text: For Yahweh gives wisdom[c][b][a]; from his mouth come knowledge and understanding.
translation:
  language: zh_hans
  text: 因为雅威赐下智慧；知识和明辨都出自他的口。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “明辨”也可译作“理解力”或“洞察力”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，为前面的劝勉说明根据；中文经文单独列出时，以“因为”开头仍自然，也保留希伯来语的因果关系。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文读者最熟悉的圣名音译，直接对应四字神名，而不以“主”这一称号替代。
- source_word: יִתֵּן
  choice: 赐下
  rationale: 未完成式在箴言语体中表达恒常事实；“赐下”自然体现智慧来自上帝的给予，而非单纯的将来动作。
- source_word: חָכְמָה
  choice: 智慧
  rationale: 这是《箴言》的核心术语，译作“智慧”准确且符合中文传统。
- source_word: מִפִּיו
  choice: 出自他的口
  rationale: 保留“从他的口”这一具体意象，并用自然中文表达知识与明辨源于耶和华所说的话。
- source_word: דַּעַת
  choice: 知识
  rationale: 直接对应该词在智慧文学中的常见含义，并与下文“明辨”形成并列。
- source_word: וּתְבוּנָה
  choice: 和明辨
  rationale: 该词兼有理解、洞察与辨别之意；“明辨”既自然又较好体现实践性的辨识能力。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: “耶和华”是现代中文圣经语境中广为人知的专名形式，保留其作为名字的功能；不以“上主”替代专名。原始读音无法完全确定，“雅威”是另一种常见拟音。
- issue: 知识与明辨“出自他的口”的意象
  choice: 保留口的意象
  alternative: 意译为“他赐人知识和悟性”
  rationale: 希伯来文明确以“他的口”为来源，强调这些恩赐由上帝的话语而出；保留意象可避免把经文泛化为一般性的赐予。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“因为”保留与上文的逻辑连接；分号呈现两行诗句间的紧密解释关系。主句补出“都”，使后半句在中文中流畅，但不增加新的实质含义。
