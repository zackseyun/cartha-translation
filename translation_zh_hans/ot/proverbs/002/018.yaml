base_translation:
  language: en
  yaml_path: translation/ot/proverbs/002/018.yaml
  text: For her house sinks down to death[a], and her paths to the dead.
translation:
  language: zh_hans
  text: 因为她的家向死亡沉陷；她的路径通向死者[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “死者”也可译作“阴魂”或“幽魂”；原文是诗歌中对已死之人的称呼。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，说明为何应当避开淫妇，保留原文的解释、因果作用。
- source_word: שָׁחָה
  choice: 下沉
  rationale: 保留弯下、沉降的动态意象，并与趋向死亡的方向相配。
- source_word: אֶל מָוֶת
  choice: 趋向死亡
  rationale: אֶל 表示朝向或目的地；译作“趋向”既自然，也避免把过程过度解释为已经抵达。
- source_word: בֵּיתָהּ
  choice: 她的家
  rationale: 保留“房屋/家”的具体意象，同时在现代汉语中可自然涵盖其生活领域。
- source_word: רְפָאִים
  choice: 亡魂
  rationale: 此处指阴间中已死之人，而非利乏音族；“亡魂”保留诗歌性的幽冥色彩，又不展开推测性的死后世界观。
- source_word: מַעְגְּלֹתֶיהָ
  choice: 她的路径
  rationale: 表达道路、轨迹或惯常行径，并保留与“家”平行的诗歌意象。
theological_decisions:
- issue: 智慧文学中 רְפָאִים 的含义
  choice: 亡魂
  alternative: 死人；逝者；利乏音人
  rationale: 上下文谈死亡及其领域，因此不是族名。“亡魂”较贴近该词所指的已死者及其诗性幽冥意涵；脚注同时给出较平实的表达，避免建立超出经文的亡灵论。
- issue: 第二分句省略谓语的处理
  choice: 补出“通向”
  alternative: 直译为“她的路径也趋向亡魂”
  rationale: 希伯来诗句由前半句共享方向结构。汉语补出“通向”可清楚呈现平行关系，但不增加新的因果或神学含义。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。保留“家下沉”的突兀诗性意象，不改写为较解释性的“她的家使人走向死亡”；用分号呈现两个平行分句。
