  yaml_path: translation/ot/proverbs/002/019.yaml
  text: All who go in to her do not return, nor do they regain the paths of life.
translation:
  language: zh_hans
  text: 凡到她那里去的，都不能回来，也得不着生命的道路。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּאֶיהָ
  choice: 到她那里去的
  rationale: 保留介词 אֶל 所表达的趋向及阴性单数代词所指的“她”；措辞自然，也不把语境中的性暗示过度明说。
- source_word: לֹא יְשׁוּבוּן
  choice: 都不能回来
  rationale: 以“不能回来”表达否定未完成式在格言语境中的确定性结果；“都”与句首 כָּל 呼应。
- source_word: יַשִּׂיגוּ
  choice: 到达
  rationale: 该词在此可表示达到、抵达；采用“到达”与后面的“路径”自然搭配，不额外加入原文没有明说的“重新”。
- source_word: אָרְחוֹת חַיִּים
  choice: 生命的路径
  rationale: 保留 אָרְחוֹת 的复数/集合性道路意象和 חַיִּים 的“生命”含义；“路径”符合箴言中人生道路的比喻。
theological_decisions:
- issue: 离开“她”之后是否绝无任何回转可能
  choice: 按格言的警戒语气译为“不能回来”
  alternative: 译为“不会回来”或加注说明并非讨论悔改是否可能
  rationale: 原文作绝对性的智慧格言警告；译文保留这种严厉张力，不将其系统化为关于悔改或救恩范围的教义断言，也不以注释削弱正文。
- issue: יַשִּׂיגוּ 是否含“重新获得”之意
  choice: 译为“到达”
  alternative: 译为“重新找到”或“重返”
  rationale: “重新”可由上下文推知，但并非该动词本身明确表达；采用较贴近词义且保留解释空间的译法。
translation_notes:
  register: 采用简洁、庄重的现代汉语格言体。两个并列分句保持原文的递进警告；不增添脚注，因为本节的词义差异不足以要求正文标记说明。
