  text: בְּ֭נִ/י אִם תִּקַּ֣ח אֲמָרָ֑/י וּ֝/מִצְוֺתַ֗/י תִּצְפֹּ֥ן אִתָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/002/001.yaml
  text: My son[a], if you receive my words and store up my commandments with you[b],
translation:
  language: zh_hans
  text: 我儿[a]，你若领受我的话，把我的诫命珍藏在身边[b]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“我的孩子”。希伯来文是阳性单数“我儿”，是《箴言》中父辈训诲的惯用称呼。
    reason: lexical_alternative
  - marker: b
    text: 或译“储存在你那里”。这里的希伯来动词可指把某物谨慎收藏、妥善保存。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנִי
  choice: 我儿
  rationale: 保留希伯来文阳性单数的父辈训诲称呼；现代汉语中简洁、庄重而自然。
- source_word: אִם
  choice: 若
  rationale: 明确保留条件句的语气，并与箴言的庄重文体相称。
- source_word: תִּקַּח
  choice: 领受
  rationale: 原义为“拿、接受”；以言语为宾语时表示有意接受，“领受”兼顾接受与听从的语境。
- source_word: אֲמָרָי
  choice: 我的话
  rationale: 自然对应复数“言语、话语”，不额外限定为格言。
- source_word: וּמִצְוֺתַי
  choice: 我的诫命
  rationale: 保留 מִצְוָה 所含的权威性与道德分量，并符合常见圣经用语。
- source_word: תִּצְפֹּן
  choice: 珍藏
  rationale: 该动词兼有藏起、储存并妥善保管之意；“珍藏”凝练地表达用心保存，且保留珍视的意味。
- source_word: אִתָּךְ
  choice: 在身边
  rationale: 原文直指“与你同在”；“在身边”保留贴身保存的意象，避免解释性地改成“在心里”。
theological_decisions:
- issue: 智慧文学中带性别的亲子称呼
  choice: 我儿
  alternative: 我的孩子
  rationale: 希伯来文为阳性单数，是《箴言》中父辈训诲儿子的标准形式。正文保留这一文学与语法特征，同时脚注说明可按较宽泛的亲子称呼理解。
translation_notes:
  register: 采用现代、庄重而易懂的箴言训诲语体。“我儿”保留原文称呼；“领受”与“珍藏”呈现主动接受并妥善保存教诲的递进关系。经文在本节末保留逗号，因为希伯来文条件句延续到后文。
