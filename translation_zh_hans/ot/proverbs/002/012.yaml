base_translation:
  language: en
  yaml_path: translation/ot/proverbs/002/012.yaml
  text: to deliver you from the evil way[a], from the man who speaks perverse things,
translation:
  language: zh_hans
  text: 要救你脱离邪恶的道路，脱离那说悖谬的话[a]的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “悖谬的话”也可译为“歪曲的话”。
    reason: 说明 תַּהְפֻּכוֹת 所含扭曲、乖谬的言语这一词义范围，并使脚注锚点紧随所注词语。
lexical_decisions:
- source_word: לְהַצִּילְךָ
  choice: 要救你脱离
  rationale: נצל 的使役式不定词带第二人称阳性单数后缀，在上下文中承接前文智慧所带来的保护作用；“救你脱离”自然表达从危险或恶中解救，不额外引入特定的救恩术语含义。
- source_word: מִדֶּרֶךְ רָע
  choice: 脱离邪恶的道路
  rationale: דֶּרֶךְ 在《箴言》中常兼有道路意象和人生行径的伦理含义；רָע 在此修饰“道路”，译作“邪恶的道路”清楚保留其道德意味。
- source_word: מֵאִישׁ
  choice: 脱离那……的人
  rationale: 原文重复介词 מִן，分别指出要脱离邪恶的道路和具有某种言语特征的人；中文重复“脱离”可保留这一平行结构。“那……的人”自然呈现单数代表性人物，不必在中文中强加自然性别。
- source_word: מְדַבֵּר תַּהְפֻּכוֹת
  choice: 说悖谬话
  rationale: 分词 מְדַבֵּר 描写此人的惯常特征；复数名词 תַּהְפֻּכוֹת 指扭曲、颠倒或悖逆正道的言论。“说悖谬话”简洁、庄重，并保留原文涵义的宽度。
theological_decisions:
- issue: אִישׁ 的性别表达
  choice: 那……的人
  alternative: 那个男人
  rationale: אִישׁ 在希伯来语中是阳性单数，但此处表示一种典型的作恶者。现代汉语“人”本身不标示性别，既未把单数改成群体，也不需添加原文在此语境中并未着重强调的男性特征。
- issue: תַּהְפֻּכוֹת 所指言语的性质
  choice: 悖谬话
  alternative: 颠倒是非的话
  rationale: 原词可涵盖扭曲、反常和悖逆的言论。“悖谬话”保留这种语义张力；“颠倒是非的话”更具解释性，却可能把范围收窄为是非判断。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“邪恶的道路”保留《箴言》中的道路意象；“悖谬话”略带书面色彩，但在经文语体中自然，并由脚注提供更通俗的词义说明。
