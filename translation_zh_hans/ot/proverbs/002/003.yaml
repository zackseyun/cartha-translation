  language: zh_hans
  text: 你若呼求明辨[a]，扬声求悟性，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “明辨”也可译作“悟性”，“悟性”也可译作“明辨”。这两个智慧用语意义相近，互换译法不会显著改变本句的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: 是的，你若
  rationale: 这一组合承接上文的条件句，并加以强调。“是的，你若”同时保留强调语气和条件关系。
- source_word: בִּינָה
  choice: 明辨
  rationale: 该词指理解、洞察和分辨的能力。“明辨”在智慧文学语境中自然凝练，也可与下一个近义词有所区别。
- source_word: תִקְרָא
  choice: 呼求
  rationale: 此处不是“命名”，而是出声恳切求取；“呼求”保留了主动发声和迫切寻求的意味。
- source_word: תְּבוּנָה
  choice: 悟性
  rationale: 该词与בִּינָה意义相近，侧重领悟和辨识能力。“悟性”既保留二者的重叠，也避免在中文中完全合并。
- source_word: תִּתֵּן קוֹלֶךָ
  choice: 扬声求取
  rationale: 希伯来语直译为“发出你的声音”，表示大声或恳切地出声。“扬声求取”传达其声音意象，并在中文中明确呼求的对象。
