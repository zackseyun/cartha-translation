base_translation:
  language: en
  yaml_path: translation/ot/proverbs/002/011.yaml
  text: Discretion will watch over you[a]; understanding will guard you.
translation:
  language: zh_hans
  text: 审慎必护卫你[a]，悟性必保守你。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“谋略必看顾你；明辨必保全你。”
    reason: 原文两个智慧术语及两个保护性动词均有相近的词义范围；此译注保留其可行的词汇表达，并维持诗句的平行结构。
lexical_decisions:
- source_word: מְזִמָּה
  choice: 明智
  rationale: 此词在《箴言》的智慧语境中指审慎思考、妥善判断与筹划的能力；“明智”在现代汉语中自然易懂，并保留其正面含义。
- source_word: תִּשְׁמֹר עָלֶיךָ
  choice: 必护卫你
  rationale: שׁמר 与介词 עַל 连用，表达看顾、保护之意；“护卫你”既体现保护方向，也与下句形成自然平行。
- source_word: תְּבוּנָה
  choice: 悟性
  rationale: 该智慧术语指分辨和正确领悟的能力；“悟性”简洁庄重，并能与“明智”有所区别。
- source_word: תִנְצְרֶכָּה
  choice: 必守护你
  rationale: נצר 有看守、保全之意；“守护你”保留保护含义，并与上句近义对应而不完全重复。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而通顺的普通话。以两个拟人化的智慧品质作主语，并用“护卫／守护”呈现希伯来诗歌的同义平行。
