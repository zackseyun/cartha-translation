  text: whose paths are crooked[a], and who are devious in their ways,
translation:
  language: zh_hans
  text: 他们的道路弯曲[a]；他们的行径乖僻。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们的路径乖僻；他们在所行的路上偏离正道。”
    reason: 词汇与平行结构的另一种译法；עִקְּשִׁים可指弯曲、乖谬，נְלוֹזִים可指偏离正道、乖僻。
lexical_decisions:
- source_word: אֲשֶׁר
  choice: 他们的
  rationale: 关系词承接上文复数对象；结合后面的复数所有格，在中文中用“他们的”自然引出其路径与行为。
- source_word: אָרְחֹתֵיהֶם
  choice: 他们的路径
  rationale: אֹרַח既可指实际路径，也可比喻生活方式；“路径”保留具体道路意象及道德含义。
- source_word: עִקְּשִׁים
  choice: 弯曲
  rationale: 该词表示弯曲、乖谬；“弯曲”既维持道路意象，也让道德偏离的含义由语境显出。
- source_word: וּנְלוֹזִים
  choice: 偏邪
  rationale: 该词含偏离、转离正道乃至乖谬之意；“偏邪”同时表达离开正路和道德上的邪曲。
- source_word: בְּמַעְגְּלוֹתָם
  choice: 所走的道路
  rationale: מַעְגָּל指路径、轨迹或行程；译作“所走的道路”在现代汉语中自然，并保留与前半句平行而不机械重复。
