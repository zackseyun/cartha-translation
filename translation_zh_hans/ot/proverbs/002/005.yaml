  text: אָ֗ז תָּ֭בִין יִרְאַ֣ת יְהוָ֑ה וְ/דַ֖עַת אֱלֹהִ֣ים תִּמְצָֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/002/005.yaml
  text: Then you will understand the fear of Yahweh and find the knowledge of God[a].
translation:
  language: zh_hans
  text: 那时，你就会明白何为敬畏雅威，并寻得对上帝的认识。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָז
  choice: 那时
  rationale: 既有时间含义，也承接2:1–4所列条件，表明随之而来的结果；现代汉语自然清楚。
- source_word: תָּבִין
  choice: 你就会明白
  rationale: בין的Qal未完成式第二人称阳性单数，表示领会、辨明；“明白”符合智慧文学语境。
- source_word: יִרְאַת יְהוָה
  choice: 何为敬畏雅威
  rationale: 保留“敬畏”中畏惧与尊崇并存的张力，不将其弱化为单纯的尊敬；以“雅威”音译神的专名יהוה。“何为”使汉语搭配自然，但不增添新的命题内容。
- source_word: וְדַעַת אֱלֹהִים
  choice: 也会寻得对上帝的认识
  rationale: דַּעַת指知识或认识，与前半句形成平行；“对上帝的认识”保留构造短语可能表达的以神为认识对象之意。
- source_word: תִּמְצָא
  choice: 会寻得
  rationale: מצא的基本义为“找到、寻得”；“寻得”同时呼应前文殷勤搜寻智慧的意象。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；音译“雅威”保留其作为立约专名的性质，同时避免用称号取代专名。
- issue: יִרְאַת יְהוָה中“敬畏”的含义
  choice: 敬畏雅威
  alternative: 尊崇雅威
  rationale: “敬畏”保留希伯来智慧传统中畏惧、尊崇和顺服相交织的含义，不把张力化约为一般敬意。
- issue: דַּעַת אֱלֹהִים的关系
  choice: 对上帝的认识
  alternative: 从上帝而来的知识；对雅威的敬畏
  rationale: 按WLC辅音及马所拉读法，最直接的是以“上帝”为认识的对象；正文采用此义，同时以脚注保留所提供审校层记录的另一读法。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“那时……就……”自然呈现上下文的条件—结果关系；两个“会”维持平行，又避免过度古雅。
