  text: לְמַ֗עַן תֵּ֭לֵךְ בְּ/דֶ֣רֶךְ טוֹבִ֑ים וְ/אָרְח֖וֹת צַדִּיקִ֣ים תִּשְׁמֹֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/002/020.yaml
  text: so that you may walk in the way of the good and keep to the paths of the righteous[a][b].
translation:
  language: zh_hans
  text: 好使你行在善人[a]的道上，持守[b]义人的路。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“良善之人的”。原文是阳性复数形容词，在这里用作名词，泛指品德良善的一类人。
    reason: lexical_alternative
  - marker: b
    text: 或译“谨守”或“守护”。原文动词可指持守、看守或遵守；在这里可能指坚持走在这些路上。
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: 好使
  rationale: 引出承接上文的目的或预期结果；“好使”在现代汉语中简洁自然，并保留目的意味。
- source_word: תֵּלֵךְ
  choice: 行在……道上
  rationale: 这是הלך的第二人称阳性单数未完成式；受לְמַעַן支配，在此表达预期的行动。“行在……道上”也保留了人生道路的比喻。
- source_word: בְּדֶרֶךְ טוֹבִים
  choice: 在善人的道上
  rationale: דֶּרֶךְ既可指实际道路，也常比喻生活方式；טוֹבִים是阳性复数形容词名词化，指品德良善的一类人，因此译作“善人”。
- source_word: וְאָרְחוֹת צַדִּיקִים
  choice: 义人的路
  rationale: אֹרַח指路径或人生行径，与前半句的“道”构成诗歌平行；צַדִּיקִים指行为正直、公义的人，译作传统而清楚的“义人”。
- source_word: תִּשְׁמֹר
  choice: 持守
  rationale: שׁמר可表示守护、遵守或保持；以“路”为宾语时，“持守”既可表达坚持走这条路，也保留守护、谨守的语义余地。
theological_decisions: []
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“道／路”保留希伯来诗句中的近义平行和人生道路的比喻；“善人／义人”保留两类道德称谓的对应关系。
