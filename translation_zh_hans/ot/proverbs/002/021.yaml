base_translation:
  language: en
  yaml_path: translation/ot/proverbs/002/021.yaml
  text: For the upright will dwell in the land[a], and the blameless will remain in it.
translation:
  language: zh_hans
  text: 因为正直人必居住在这地上；纯全人必存留在其中。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“大地”。希伯来语 אָרֶץ 可指“地、土地”或“大地”；这里因上下文强调居住和存留在一处可居之地，译作“这地”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 此处承接上文，为前面的劝诫与应许说明理由；“因为”自然保留了这一逻辑关系。
- source_word: יְשָׁרִים
  choice: 正直人
  rationale: 该词指在道德上正直、行为端正的人；“正直人”清楚自然，也避免将它直接等同于含义不尽相同的“义人”。
- source_word: יִשְׁכְּנוּ
  choice: 必住
  rationale: שׁכן 表示居住、安居；“必住”兼顾持续居住的含义和未然语气。
- source_word: אָרֶץ
  choice: 地
  rationale: 该词既可指供人居住的土地，也可泛指大地。结合下一节所说从其上被拔除，此处正文译作“地”，并以脚注保留“大地”的可能。
- source_word: וּתְמִימִים
  choice: 纯全的人
  rationale: תמים 表示完整、纯正、无可指责；“纯全的人”保留品格完整的伦理含义，不把它绝对化为毫无过错。
- source_word: יִוָּתְרוּ
  choice: 必留
  rationale: יתר 的尼法勒式表示被留下、继续存留；“必留”简洁表达他们将继续在那地存留。
- source_word: בָהּ
  choice: 在其上
  rationale: 阴性单数代词回指 אָרֶץ；“在其上”保持指代关系，并与前句“在地上”形成平行。
theological_decisions:
- issue: אָרֶץ 的范围
  choice: 地
  alternative: 大地
  rationale: 上下文强调人在可居之地继续存留，正文采用较具体但仍有一定开放性的“地”；不将其限定为某一特定疆域，同时用脚注保留泛指“大地”的读法。
translation_notes:
  register: 采用现代、庄重而简洁的箴言体。两分句以“正直人／纯全的人”和“必住／必留”构成平行；“其上”略带书面色彩，但能清楚回指前面的“地”。
