  text: who abandons the companion of her youth and forgets the covenant of her God[a][b].
translation:
  language: zh_hans
  text: 她离弃了年轻时的伴侣[a]，忘记了她的上帝的约[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“年轻时的丈夫”。希伯来语这个词可指亲密的同伴；在这里很可能指她的婚姻配偶。
    reason: lexical_alternative
  - marker: b
    text: “她的上帝的约”很可能指在上帝的权柄或见证之下所立的婚约，但也可能呼应她对上帝更广泛的盟约责任。
    reason: alternative_reading
lexical_decisions:
- source_word: הָעֹזֶבֶת
  choice: 她离弃了
  rationale: עָזַב的阴性单数分词承接上文所说的淫妇；“离弃”既表达离开，也带有背弃关系的意味，符合此处语境。
- source_word: אַלּוּף
  choice: 伴侣
  rationale: 此词可指亲密同伴；结合“年轻时”和下句的“约”，此处很可能指婚姻配偶。“伴侣”保留词义宽度，不在正文中过度明确为“丈夫”。
- source_word: נְעוּרֶיהָ
  choice: 年轻时的
  rationale: 保留第三人称阴性单数所属关系，并以自然现代汉语表达她在年轻时期建立的亲密关系。
- source_word: בְּרִית
  choice: 约
  rationale: “约”保留该词正式、关系性和神学性的分量，也与现代中文圣经语体相符。
- source_word: אֱלֹהֶיהָ
  choice: 她上帝的
  rationale: 明确译出第三人称阴性单数后缀，保留“她的上帝”所表达的个人归属与责任。
- source_word: שָׁכֵחָה
  choice: 忘记了
  rationale: 该词是Qal完成式阴性单数；“忘记了”既可指不再记念，也能在此语境中表达对盟约义务的漠视和背弃。
theological_decisions:
- issue: “她上帝的约”是专指上帝见证之下的婚约，还是也包括她对上帝更广泛的盟约责任
  choice: 正文保留“她上帝的约”，由上下文显出婚约含义
  alternative: 她在上帝面前所立的婚约；或她对上帝整体的盟约义务
  rationale: 它与“年轻时的伴侣”平行，强烈指向婚姻关系；但希伯来文没有直接说“婚约”，因此不宜在正文中排除较广的盟约含义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“离弃”与“约”保留箴言的道德和盟约分量；句式简洁，并维持希伯来诗句两部分的平行关系。
