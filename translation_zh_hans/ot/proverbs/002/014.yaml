  text: 他们以作恶为乐[a]，又因邪恶的乖谬之事而欢欣[b]；
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“喜欢作恶”。
    reason: lexical_alternative
  - marker: b
