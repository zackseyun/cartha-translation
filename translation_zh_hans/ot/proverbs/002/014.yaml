lexical_decisions:
- source_word: הַשְּׂמֵחִים
  choice: 以……为乐
  rationale: 分词承接上文，刻画这类人的一贯特征；“以……为乐”自然表达他们从恶行中得到喜悦。
- source_word: לַעֲשׂוֹת
  choice: 作
  rationale: 直接对应“做、行”，不额外限定为惯常操练或违法行为。
- source_word: רָע
  choice: 恶
  rationale: 在《箴言》的智慧与伦理语境中保留鲜明的道德含义。
- source_word: יָגִילוּ
  choice: 欢欣
  rationale: 表达强烈、外显的喜悦，同时与前半句的“为乐”形成诗体上的同义呼应而非机械重复。
- source_word: בְּתַהְפֻּכוֹת
  choice: 因……乖谬之事
  rationale: 该复数名词可指扭曲、颠倒的言行或事物；“乖谬之事”兼顾其道德性质与可能的具体复数含义。
- source_word: רָע
  choice: 邪恶的
  rationale: 将末尾的 רָע 理解为修饰“乖谬之事”，保留原文紧凑而略有张力的关系。
theological_decisions: []
