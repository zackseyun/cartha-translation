  text: וּ֭/רְשָׁעִים מֵ/אֶ֣רֶץ יִכָּרֵ֑תוּ וּ֝/בוֹגְדִ֗ים יִסְּח֥וּ מִמֶּֽ/נָּה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/002/022.yaml
  text: But the wicked will be cut off from the land[b][a], and the treacherous will be uprooted from it.
translation:
  language: zh_hans
  text: 但恶人必从地上[a]被剪除，背信的人必从那里被拔除[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“从土地上”或“从大地上”。希伯来语 אֶרֶץ 可指土地、地或大地；这里与上一节正直人留在其上的话相对照。
    reason: lexical_alternative
  - marker: b
    text: “拔除”也可译作“强行除去”。原文动词强调被强制移走。
    reason: lexical_alternative
lexical_decisions:
- source_word: רְשָׁעִים
  choice: 恶人
  rationale: 该复数名词化形容词指在道德上邪恶的一类人；“恶人”简洁、自然，并保留类别性的表达。
- source_word: מֵאֶרֶץ
  choice: 从地上
  rationale: אֶרֶץ既可指“地、土地”，也可指“大地、世界”。结合第21节义人留在其上的对比，“地上”既自然，又不将所指过度限定为某一特定疆土。
- source_word: יִכָּרֵתוּ
  choice: 必被剪除
  rationale: כרת的尼法勒未完成式表达“被砍断、被除掉”；“被剪除”保留其切断隐喻及强制清除的意味。
- source_word: בוֹגְדִים
  choice: 奸诈的人
  rationale: בגד的分词表示惯常以背信、诡诈行事的人；“奸诈的人”是现代汉语中清楚自然的类别表达。
- source_word: יִסְּחוּ
  choice: 必被拔除
  rationale: נסח表示强行拉走、拔去或除掉；“被拔除”体现强制移除，并与前句“被剪除”形成平行而不完全重复。
- source_word: מִמֶּנָּה
  choice: 从其中
  rationale: 阴性单数后缀回指אֶרֶץ；“从其中”在汉语里清楚回指前面的“地上”。
- source_word: וְ
  choice: 但……，……
  rationale: 句首连词与第21节形成转折，译作“但”；第二个连词在汉语平行句中可不明译，使句子更自然。
theological_decisions:
- issue: 智慧文学语境中אֶרֶץ的范围
  choice: 地上
  alternative: 土地；大地
  rationale: 上下文将正直人留在其上与恶人从其上被除去相对照。“地上”保留希伯来词可指居住之地或大地的弹性，不把经文限定为特定地域，也不额外强化为全球性的末世陈述。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“剪除”保留原文隐喻和审判力度；“拔除”与之构成诗歌平行。脚注保留אֶרֶץ的真实词义范围，以及יִסְּחוּ所表达的强制移除意味。
