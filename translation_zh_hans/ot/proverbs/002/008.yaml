  text: לִ֭/נְצֹר אָרְח֣וֹת מִשְׁפָּ֑ט וְ/דֶ֖רֶךְ חסיד/ו יִשְׁמֹֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/002/008.yaml
  text: to guard the paths of justice[a], and he watches over the way of his faithful ones.
translation:
  language: zh_hans
  text: 为要守护公正的路径；他也看守忠信之人[a]所行的道路。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “忠信之人”也可译作“虔诚人”或“忠贞于他的人”。原词指以忠诚、敬虔为特征的人。马所拉写法为单数“他忠信的那一位”，读法传统作复数“他忠信的人们”；中文此处不强行限定数目。
    reason: 说明 חסידו 的词义范围，并保留马所拉写法与读法传统所反映的单复数差异。
lexical_decisions:
- source_word: לִנְצֹר
  choice: 为要守护
  rationale: 不定式承接上文，表达目的或结果；“为要”显明句法联系，“守护”保留 נצר 的保护意味。
- source_word: אָרְחוֹת
  choice: 路径
  rationale: 该词为复数，指人所行的路径；译作“路径”既自然，也与后半句单数的“道路”形成对应。
- source_word: מִשְׁפָּט
  choice: 公正
  rationale: 在《箴言》的伦理语境中，此词指公平正直的秩序或行为准则；“公正”比单指裁决的“审判”更贴切。
- source_word: וְדֶרֶךְ
  choice: 也……道路
  rationale: “道路”保留 דֶרֶךְ 的常用比喻义，并保留原文与前半句“路径”之间的措辞变化。
- source_word: חסידו
  choice: 他忠信之人
  rationale: חסיד 指以忠诚、敬虔为特征的人。“忠信之人”兼顾忠诚与信实的含义，避免使用带有后期教会术语色彩的“圣徒”；现代汉语中的“人”在数上不作强制标明，也可自然容纳文本传统及语境中单复数理解的张力。
- source_word: יִשְׁמֹר
  choice: 看守
  rationale: שׁמר 有看守、护卫、保守之意；译作“看守”既体现保护，也避免与前半句“守护”完全重复。
theological_decisions:
- issue: יִשְׁמֹר 的隐含主语
  choice: 让主语“他”由“他忠信之人”中的所属代词及上文语境显明，不另行增补“上主”
  alternative: 明确译作“他也看守”或“上主也看守”
  rationale: 2:6–8 的施行动作主体是上主，但本节希伯来文未重新写出主语。当前译法保持原文的衔接方式，同时让读者能从上文辨认主体。
- issue: חסידו 所指之人的数与性质
  choice: 译作数目不强制显明的“他忠信之人”
  alternative: “他的忠信者”“他的虔诚人”“他的忠信众人”
  rationale: “忠信”传达该词所含的忠诚与敬虔，不引入“圣徒”等后期技术用语；汉语不强制标示单复数，可避免在正文中把文本形式与传统理解之间的张力过早定死。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“公正的路径／所行的道路”保留智慧文学以道路比喻生活方式的平行结构；“为要”提示本节与上一节在句法和意义上的连续性。
