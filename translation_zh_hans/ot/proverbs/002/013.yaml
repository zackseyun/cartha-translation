source:
  edition: WLC
  text: הַ֭/עֹ֣זְבִים אָרְח֣וֹת יֹ֑שֶׁר לָ֝/לֶ֗כֶת בְּ/דַרְכֵי חֹֽשֶׁךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/002/013.yaml
  text: who abandon the paths of uprightness to walk in the ways of darkness,[a]
translation:
  language: zh_hans
  text: 就是那些离弃正直之路、转而行走在黑暗道路上的人。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“就是那些离弃正确道路的人。”
    reason: יֹשֶׁר既可表达抽象的“正直”，也可在此理解为“正确、正当之事”。
lexical_decisions:
- source_word: הָעֹזְבִים
  choice: 那些离弃……的人
  rationale: 分词在上下文中作名词性用法，承接上一节所说要救人脱离的对象；“离弃”表达主动舍弃，语体庄重而自然。
- source_word: אָרְחוֹת
  choice: 之路
  rationale: 保留智慧文学中以道路比喻人生行为方式的意象；中文用“路”简洁自然。
- source_word: יֹשֶׁר
  choice: 正直
  rationale: 该词指道德上的正直、端正；“正直”既保留伦理含义，也与“路”的直正意象相契合。
- source_word: לָלֶכֶת
  choice: 行走
  rationale: 保留הלך关于行为和生活方式的行路隐喻，不将其解释性改写为“行恶”。
- source_word: בְּדַרְכֵי
  choice: 在……道路上
  rationale: 自然表达沿某种道路而行，并与前面的“正直之路”形成平行。
- source_word: חֹשֶׁךְ
  choice: 黑暗
  rationale: 保留原文兼具道路景象和道德意味的隐喻，不直接释为“邪恶”。
theological_decisions:
- issue: 黑暗的道德隐喻
  choice: 保留“黑暗”这一意象
  alternative: 译作“邪恶”或“罪恶”
  rationale: 原文借黑暗道路暗示道德偏离；直译意象能够保留其丰富性和含蓄张力，避免把隐喻直接解释成某一抽象概念。
- issue: לָלֶכֶת所表达的目的或结果关系
  choice: 译作“转而行走”，呈现离弃正路后所采取的相反方向
  alternative: 直译为“为要行走”
  rationale: 不定式可表达目的或随之发生的行动；“转而”在现代汉语中自然呈现两条道路的鲜明对照，同时不强化为无法回转的最终结果。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。以“就是那些……的人”承接上一节句法；保留“路／道路、行走、黑暗”的智慧文学道路意象。“转而”使汉语关系清楚，但不把“黑暗”解释为具体教义概念。
