  text: כִּֽי תָב֣וֹא חָכְמָ֣ה בְ/לִבֶּ֑/ךָ וְ֝/דַ֗עַת לְֽ/נַפְשְׁ/ךָ֥ יִנְעָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/002/010.yaml
  text: For wisdom will enter your heart[b][a], and knowledge will be pleasant to your soul.
translation:
  language: zh_hans
  text: 因为智慧必进入你的心，知识必使你的心灵喜悦。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“当智慧进入你的心，知识使你的心灵喜悦时。”
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 在本段劝诫与应许的语境中，此词较自然地引出下文所说明的缘由；也可能带有“当……时”的时间意味，故以脚注保留。
- source_word: תָבוֹא
  choice: 必进入
  rationale: בוא 与介词 בְּ 连用，直指“进入”心中；未完成式在这里适合表达教诲语境中的将来结果或应许。
- source_word: חָכְמָה
  choice: 智慧
  rationale: 这是《箴言》的核心词汇；“智慧”保留其道德、实践和认知层面的丰富含义。
- source_word: בְלִבֶּךָ
  choice: 你的心
  rationale: 希伯来语“心”涵盖思想、意志和内在生命；保留“心”既贴近原文，也符合自然汉语表达。
- source_word: וְדַעַת
  choice: 知识
  rationale: 保持 דַּעַת 与“聪明”“明哲”等其他智慧词汇之间的区别。
- source_word: לְנַפְשְׁךָ
  choice: 你的心灵
  rationale: נֶפֶשׁ 可指生命、自我或内在之人。此处“心灵”在现代汉语中自然，并与上句“心”形成诗性呼应，同时避免把词义限定为后期身心二分意义上的“灵魂”。
- source_word: יִנְעָם
  choice: 使……喜悦
  rationale: נעם 表示令人愉悦、甘美或可喜；汉语用“使你的心灵喜悦”自然地传达其谓语意义。
theological_decisions:
- issue: לֵב 与 נֶפֶשׁ 所体现的希伯来人观
  choice: 正文译为“心”和“心灵”
  alternative: “内心”和“生命”；或“心”和“灵魂”
  rationale: 译文保留两个彼此相关但并不完全相同的内在人称用语，同时避免将 נֶפֶשׁ 过度教义化为与身体截然分离的实体。
- issue: כִּי 的逻辑或时间关系
  choice: 正文采用因果性的“因为”
  alternative: “当……时”
  rationale: 此处可承接前文，说明明辨与护卫之所以成为可能的缘由；但时间性理解在句法和语境上也成立，故列入脚注。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。以“必”呈现教诲语境中的确定结果；“心灵”兼顾 נֶפֶשׁ 的宽广语义与汉语可读性。脚注标记置于整句末尾，涵盖 כִּי 的另一种句法理解。
