  text: to rescue you from the strange woman[c][b][a], from the foreign woman whose words are smooth.
translation:
  language: zh_hans
  text: 要救你脱离外来的女子[a]，脱离那话语圆滑[b]的异乡女子[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “外来的女子”也可译作“陌生女子”或“禁忌的女子”。在《箴言》中，这个说法常指处于正当婚姻或群体界限之外的女子，并不只是指族裔上的外国人。
    reason: lexical_alternative
  - marker: b
    text: “话语圆滑”也可译作“说奉承话”或“说诱人的话”。
    reason: lexical_alternative
  - marker: c
    text: “异乡女子”也可译作“外邦女子”或“外来的女子”；这里与“外来的女子”平行，重点可能是她处于正当关系的界限之外，而不只是她来自异族。
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהַצִּילְךָ
  choice: 要救你脱离
  rationale: 希菲勒不定式带第二人称阳性单数后缀，在上下文中表示智慧的功用或结果；“救你脱离”自然地表达从危险中解救。
- source_word: אִשָּׁה זָרָה
  choice: 陌生女子
  rationale: זָרָה的本义是“陌生的、外来的”，在《箴言》中常暗含处于正当婚姻或群体界限之外的女子；正文保留源语意象，不直接收窄为“淫妇”或“禁妇”。
- source_word: מִנָּכְרִיָּה
  choice: 外来女子
  rationale: נָכְרִיָּה指外人或外来者，与前句“陌生女子”平行，描述同一危险人物；“外来”保留词义中的局外性，同时避免把重点限定为族裔。
- source_word: אֲמָרֶיהָ
  choice: 言语
  rationale: 复数构造形式直指“她的话语”；汉语用“言语”简洁且适合诗歌语体。
- source_word: הֶחֱלִיקָה
  choice: 圆滑
  rationale: חלק的希菲勒形式有“使光滑”之意，此处比喻说话圆滑、讨好或诱人；“圆滑”既保留隐喻，也传达负面的诱惑意味。
theological_decisions:
- issue: זָרָה与נָכְרִיָּה所表达的女性身份
  choice: 正文译作“陌生女子……外来女子”，保留局外性及其语境中的道德张力
  alternative: 译作“淫妇”或“禁妇”
  rationale: 源语没有在本节明说通奸行为；《箴言》的语境赋予这些称呼婚姻和群体界限方面的含义，但不宜在正文中把潜在含义定死。
- issue: 两个平行称谓是否指两名女子
  choice: 以重复“脱离”保留希伯来诗歌平行结构，并将两句理解为对同一类人物的对应描述
  alternative: 用破折号明确改写为同位语
  rationale: 原文两行都带介词מִן，形式上重复；保留重复既忠于结构，也不必过度规定句法关系。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“言语圆滑”保留希伯来文的光滑隐喻；两个“脱离”对应原文平行句式。所有脚注标记均紧接相关词语。
