  text: ו/צפן לַ֭/יְשָׁרִים תּוּשִׁיָּ֑ה מָ֝גֵ֗ן לְ/הֹ֣לְכֵי תֹֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/002/007.yaml
  text: He stores up sound wisdom for the upright[b][a]; he is a shield to those who walk in integrity.
translation:
  language: zh_hans
  text: 他为正直人积存真智慧[a]；他是行事纯全之人的盾牌[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “真智慧”也可译作“明智的判断”“才略”或“成事的智慧”；希伯来语这个词可指带来良好结果的有效智慧。
    reason: lexical_alternative
  - marker: b
    text: “纯全”也可译作“正直”“完整”或“无可指摘”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצָפַן
  choice: 珍藏
  rationale: צפן表示储存、珍藏或保留；“珍藏”既保留存放备用的意象，也自然体现其价值。
- source_word: לַיְשָׁרִים
  choice: 为正直人
  rationale: יְשָׁרִים是复数名词化形容词，指在道德上正直的人；“正直人”简明自然。
- source_word: תּוּשִׁיָּה
  choice: 健全的智慧
  rationale: תושיה可指可靠而有效的智慧、明智判断、才略或由此带来的成功；“健全的智慧”保留智慧文学语境及该词的实践效力，同时用脚注交代其宽广义域。
- source_word: מָגֵן
  choice: 盾牌
  rationale: מָגֵן本义为盾牌；保留具体比喻，不将其弱化为抽象的“保护”。
- source_word: לְהֹלְכֵי
  choice: 行事……的人
  rationale: הלך的分词形式在此描写一贯的生活方式；中文“行事”比逐字的“行走”更自然，同时保留伦理行为的含义。
- source_word: תֹם
  choice: 纯全
  rationale: תֹם兼有完整、无可指摘和正直之意；“纯全”保留“完整无缺”的语义张力，又不必理解为绝对无罪。
theological_decisions:
- issue: 两个分句之间的关系与第二句的主语
  choice: 将上帝理解为两个分句共同的主语：“他……珍藏……；他是……盾牌。”
  alternative: 可将第二句省略地理解为“为行事纯全的人所珍藏的是盾牌”，或把“盾牌”与前句内容作同位关系。
  rationale: 希伯来文第二分句没有明写动词，而מָגֵן直接出现；结合上文耶和华赐智慧的语境，将耶和华作为延续的主语最为自然，也维持两分句的平行关系。
- issue: תֹם是否表示绝对无罪
  choice: 译为“纯全”，理解为生活道路的完整、正直与无可指摘。
  alternative: 可译为“正直”“完整”或“无可指摘”。
  rationale: 该词强调品格与行为的一致和完整，不应在译文中擅自强化为绝对无罪。
translation_notes:
  register: 采用现代、庄重且易懂的书面普通话。以“珍藏”保留储备贵重之物的意象，以“盾牌”保留原文比喻；“行事纯全”自然表达希伯来语以“行走”指生活方式的惯用隐喻。所有脚注标记均置于相应词语之后。
