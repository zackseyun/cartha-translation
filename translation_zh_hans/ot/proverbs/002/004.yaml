  text: if you seek it like silver and search for it like hidden treasures[b][a],
translation:
  language: zh_hans
  text: 你若像寻找银子那样寻找它[a]，像搜寻隐藏的珍宝那样搜寻它[b]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文两处宾语后缀均为阴性单数，直译可作“寻找她”“搜寻她”，所指是上文的智慧或聪明。正文按现代汉语习惯译作“它”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“埋藏的珍宝”。原词可指藏在地下或以其他方式隐藏起来的贵重物品。
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: 若
  rationale: 引出延续上下文的条件从句；“若”简洁、庄重，并保留原文的条件意味。
- source_word: תְּבַקְשֶׁנָּה
  choice: 寻找它
  rationale: בקשׁ 表示寻找、寻求。阴性单数宾语后缀回指上文的智慧或聪明；现代汉语以“它”指抽象对象，自然而不过度拟人化。
- source_word: כַכָּסֶף
  choice: 如同寻找银子
  rationale: 前缀 כ 表示比较。原文虽字面为“像银子”，这里补出“寻找”，使汉语比较关系清楚，同时保留银子作为贵重之物、值得殷勤寻求的意象。
- source_word: וְכַמַּטְמוֹנִים
  choice: 如同搜求隐藏的珍宝
  rationale: מַטְמוֹנִים 指被藏起或埋藏的贵重物品；“隐藏的珍宝”兼顾隐蔽性与价值，也保留“埋藏的珍宝”这一可能含义于脚注。
- source_word: תַּחְפְּשֶׂנָּה
  choice: 搜求它
  rationale: חפשׂ 表示仔细搜寻、竭力寻求。“搜求”比单纯“寻找”更能体现第二分句加强的语气，并与前句形成自然平行。
theological_decisions:
- issue: 阴性单数宾语后缀的所指
  choice: 正文用“它”，脚注说明可回指上文的智慧或聪明
  alternative: 译作“她”，将智慧明显人格化
  rationale: 希伯来语后缀具有语法阴性，但本节本身没有要求把所指对象进一步人格化；“它”符合现代汉语指称抽象概念的习惯，同时脚注保留原文形式及其上下文联系。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。两分句以“寻找／搜求”形成递进式平行；保留条件句未完的逗号，以衔接后续经文。
