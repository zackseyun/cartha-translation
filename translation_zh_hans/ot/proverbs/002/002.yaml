lexical_decisions:
- source_word: לְהַקְשִׁיב
  choice: 侧耳留心
  rationale: 该词为使役式不定词，表达主动使耳朵专注聆听；“侧耳留心”在现代汉语中自然凝练，并保留有意专注的听觉意象以及与上节相接的句法延续性。
- source_word: לַחָכְמָה
  choice: 智慧
  rationale: 介词 ל 在此标示注意所指向的对象；译为“智慧”保留《箴言》的核心智慧术语。
- source_word: אָזְנֶךָ
  choice: 耳（体现于“侧耳”）
  rationale: 原文为单数并带第二人称阳性单数后缀。“侧耳”自然地保留具体的听觉意象；同句“你的心”已明确第二人称所属关系，无须机械重复“你的耳朵”。
- source_word: תַּטֶּה
  choice: 使……倾向
  rationale: נטה 表示使之倾斜、转向或伸向。“使你的心倾向”保留主动调整内在取向的意象，也与前半句的刻意专注相呼应。
- source_word: לִבְּךָ
  choice: 你的心
  rationale: לֵב 在希伯来语中指人的内在，包括思想、判断和意志；译作“心”可保留这种宽广的人观，而不缩窄为单纯的“头脑”。
- source_word: לַתְּבוּנָה
  choice: 明辨
  rationale: תְּבוּנָה 在《箴言》中兼有理解、洞察和辨别之意。“明辨”与“智慧”搭配自然，并突出有判断力的领悟；脚注保留“领悟”这一可行译法。
