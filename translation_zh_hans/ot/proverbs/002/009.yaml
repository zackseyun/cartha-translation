base_translation:
  language: en
  yaml_path: translation/ot/proverbs/002/009.yaml
  text: Then you will understand righteousness and justice and equity[a], every good path.
translation:
  language: zh_hans
  text: 那时，你就会明白公义、公正、正直和一切善道。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָז
  choice: 那时
  rationale: 表示承接上文条件与教导之后所得的结果，既有时间性，也有次序性。
- source_word: תָּבִין
  choice: 你就会明白
  rationale: 该词表示理解、辨明；“明白”自然清楚，“就会”体现与上文的结果关系。
- source_word: צֶדֶק
  choice: 公义
  rationale: 指伦理和道德上合乎正道之事；“公义”保留其道德分量，并与后面的“公正”有所区分。
- source_word: מִשְׁפָּט
  choice: 公正
  rationale: 可指审判、正当裁断或公正秩序；此处“公正”与“公义”并列自然，也避免局限于司法场景。
- source_word: מֵישָׁרִים
  choice: 正直
  rationale: 源于笔直、平正的意象，在伦理语境中指正直或公平；“正直”较好保留其道德与空间隐喻。
- source_word: כָּל
  choice: 一切
  rationale: 修饰单数集合性短语“善道”，表达所有属于善的道路。
- source_word: מַעְגַּל
  choice: 道
  rationale: 原指路径、轨道，在箴言中常比喻人的生活道路；“道”简洁庄重，并保留比喻。
- source_word: טוֹב
  choice: 善
  rationale: 既可涵盖道德上的良善，也可包括有益、合宜之意；“善”与“道”搭配自然。
theological_decisions:
- issue: 末句 כָּל מַעְגַּל טוֹב 与前面三个名词的关系
  choice: 用破折号连接“一切善道”，使其可读作对前面“公义、公正和正直”的概括说明。
  alternative: 也可理解为另一个并列宾语，即“也明白一切善道”。
  rationale: 希伯来语在末句前没有连接词，也没有重复动词。破折号既保留其紧凑结构，又不强行排除概括同位或追加宾语两种理解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“公义、公正和正直”保留原文三项并列；“善道”延续箴言中的道路隐喻。
