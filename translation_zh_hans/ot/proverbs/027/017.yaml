base_translation:
  language: en
  yaml_path: translation/ot/proverbs/027/017.yaml
  text: Iron sharpens iron[a], and a man sharpens the face of his friend.
translation:
  language: zh_hans
  text: 铁磨铁，使铁锋利；人也磨砺朋友的脸面。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“铁磨铁，使铁锋利；人也彼此磨砺。”希伯来文直译为“磨砺朋友的脸面”，可能指使对方更敏锐、更成熟。
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּרְזֶל בְּבַרְזֶל
  choice: 铁磨铁
  rationale: בַּרְזֶל明确指“铁”；介词ב表示工具或方式。译作“铁磨铁”既简洁自然，也保留箴言的具体意象和紧凑结构。
- source_word: יָחַד / יַחַד
  choice: 使……锋利／磨砺
  rationale: 此处Hiphil词形表示使之锐利、磨快。前半句按实物语境译为“使铁锋利”，后半句按人际语境译为“磨砺”，保留同一动作的对应关系，同时符合现代汉语表达。
- source_word: וְאִישׁ
  choice: 人也
  rationale: אִישׁ为阳性单数“人、男人”，在箴言中具有代表性。汉语“人”无需额外标示语法性别，既忠实于泛指功能，也不缩窄适用范围。
- source_word: פְּנֵי
  choice: 脸面
  rationale: 原文直译为“脸／面”。保留这一具体而略带张力的表达，不直接解释成“品格”或“为人”，以免消除原文可能涉及神情、表现或整个人被磨砺的含混性。
- source_word: רֵעֵהוּ
  choice: 朋友
  rationale: רֵעַ可指朋友、同伴或邻舍；本节的人际互相磨砺语境中，“朋友”自然贴切。第三人称所属关系在汉语中可由语境表达，无须生硬译出“他的”。
theological_decisions:
- issue: 智慧文学中的代表性阳性表达
  choice: 人也
  alternative: 一个男人也／一个人也
  rationale: 原文אִישׁ为阳性单数，但在箴言中代表一般的人。现代汉语“人”能自然保留这一普遍指向，并未引入性别中和式改写。
- issue: “磨砺朋友的脸面”的解释范围
  choice: 正文保留“脸面”，脚注说明可理解为彼此磨砺
  alternative: 使朋友更加敏锐／一个人磨砺另一个人
  rationale: פְּנֵי是“脸、面”的复数构式。直接意译为改善品格虽流畅，却会过早锁定隐喻；正文保留原文意象，脚注提供自然理解，以保存其含混性和神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的箴言体。前半句以“铁磨铁”保持简练和节奏；后半句保留“脸面”这一不寻常的希伯来意象，并借脚注给出较顺畅的整体理解。
