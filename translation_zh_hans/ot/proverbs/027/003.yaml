base_translation:
  language: en
  yaml_path: translation/ot/proverbs/027/003.yaml
  text: A stone is heavy[a], and sand is weighty, but a fool’s anger is heavier than both of them.
translation:
  language: zh_hans
  text: 石头沉重，沙土的负荷也沉重；愚昧人的恼怒，比这两样更重。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֹּבֶד אֶבֶן
  choice: 石头沉重
  rationale: כֹּבֶד 是“重量、沉重”的名词；译为自然的主谓结构，既保留具体意象，也与末句 כָּבֵד 的“更重”相呼应。
- source_word: וְנֵטֶל הַחוֹל
  choice: 沙土压人
  rationale: נֵטֶל 指负荷、重担或所承受的重量。译作“压人”自然表达沙土作为负荷的沉重感，又避免与首句机械重复。הַחוֹל 在这里泛指沙土。
- source_word: וְכַעַס אֱוִיל
  choice: 愚昧人的恼怒
  rationale: כַעַס 可指恼怒、愤怒，也可含令人烦恼或激恼之意；“恼怒”保留情绪意味及一定词义张力。אֱוִיל 依《箴言》的智慧文学用语译作“愚昧人”。
- source_word: כָּבֵד מִשְּׁנֵיהֶם
  choice: 比这两样更重
  rationale: מִן 在比较结构中表示“比……”，שְׁנֵיהֶם 回指石头和沙土两者；“更重”延续全节的重量比喻。
theological_decisions: []
translation_notes:
  register: 采用现代、凝练而庄重的箴言体。前两分句保持平行，末句明确比较关系；不把 כַעַס 过度限定为暴怒、挑衅或他人所受的烦扰。
