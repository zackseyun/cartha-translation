base_translation:
  language: en
  yaml_path: translation/ot/proverbs/027/004.yaml
  text: Wrath is cruel[a], and anger is a flood, but who can stand before jealousy?
translation:
  language: zh_hans
  text: 烈怒残酷，怒气如洪流；但谁能在嫉妒[a]面前站立得住？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“羡妒”。希伯来语 קִנְאָה 可按语境表示嫉妒或羡妒。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַכְזְרִיּוּת
  choice: 残酷
  rationale: 该名词表示残酷、严酷；在无系词句中按谓语理解，译为“残酷”既贴近原文，也符合现代汉语表达。
- source_word: חֵמָה
  choice: 烈怒
  rationale: 该词含炽烈、灼热的愤怒之意；译为“烈怒”保留其强度，并与下一分句的 אָף 区分。
- source_word: שֶׁטֶף
  choice: 洪流
  rationale: 该词指泛滥的水流或急流；“洪流”保留鲜明的水患意象，也能自然表达怒气不可遏止的力量。
- source_word: אָף
  choice: 怒气
  rationale: 本义与“鼻”有关，此处是表示愤怒的惯用义；“怒气”清楚自然，并与“烈怒”形成对应而不完全重复。
- source_word: וּמִי
  choice: 但……谁
  rationale: 连接词加疑问词在此引出递进性的对照；“但……谁”凸显嫉妒比前述烈怒和怒气更难抵挡。
- source_word: יַעֲמֹד
  choice: 能站立得住
  rationale: 动词本义为“站立”；加“得住”既保留站立的具体意象，也传达经受、抵挡的语境含义。
- source_word: לִפְנֵי
  choice: 面前
  rationale: 该介词字面意为“在……面前”；此译保留原文的空间意象，并与“站立得住”自然搭配。
- source_word: קִנְאָה
  choice: 嫉妒
  rationale: 该词可指嫉妒、妒忌、羡妒或热忱；在本节破坏性情绪的语境中，“嫉妒”最合适，但原词的“羡妒”可能性以脚注保留。
theological_decisions:
- issue: קִנְאָה 的情感类别具有语义歧义
  choice: 正文译作“嫉妒”
  alternative: “羡妒”
  rationale: 上下文把它与烈怒和怒气并列，并视为难以抵挡的破坏性情绪，故“嫉妒”较自然；但希伯来词本身也可表示因他人所有之物而生的羡妒，不宜完全排除。
translation_notes:
  register: 采用现代、庄重而易懂的箴言体。前两分句保持紧凑平行，以“如洪流”保留原文比喻；末句用反问和“站立得住”呈现递进与具体意象。
