  yaml_path: translation/ot/proverbs/027/021.yaml
  text: The crucible is for silver[a], and the furnace for gold, and a man is tested by his praise.
translation:
  language: zh_hans
  text: 银子用坩埚炼，金子用熔炉炼；人也因他的称赞而受考验。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“人所称赞的事物显明他的为人”；也可译：“人因所受的称赞而受考验。”原文“他的称赞”可指他发出的称赞，也可指他所领受的称赞；末句的简练结构容许不同理解。
    reason: 原文“他的称赞”可指他发出的称赞，也可指他所领受的称赞；末句的简练结构容许不同理解。
lexical_decisions:
- source_word: מַצְרֵף
  choice: 坩埚
  rationale: 指炼净金属所用的耐火容器；“坩埚”准确保留冶炼意象，在现代汉语中也简洁自然。
- source_word: לַכֶּסֶף
  choice: 炼银用
  rationale: 介词表示用途或适用对象；结合汉语表达补出“炼”，清楚说明坩埚用于炼银。
- source_word: כּוּר
  choice: 熔炉
  rationale: 指熔炼、精炼金属的炉子；“熔炉”既准确又与“坩埚”形成自然对仗。
- source_word: לַזָּהָב
  choice: 炼金用
  rationale: 与“炼银用”平行，表达熔炉的用途。
- source_word: אִישׁ
  choice: 人
  rationale: 此处是箴言体的单数泛指，现代汉语用“人”即可自然表达，不必添加性别或数量。
- source_word: לְפִי
  choice: 照
  rationale: 原义为“按着、根据”；“照”保留衡量或检验所依据标准的含义。
- source_word: מַהֲלָלוֹ
  choice: 他的称赞
  rationale: 该词组可指他发出的称赞，也可指他得到的称赞。“他的称赞”在正文中保留原文的紧凑和一定程度的歧义，主要解释列于脚注。
theological_decisions:
- issue: 末句 לְפִי מַהֲלָלוֹ 的解释歧义
  choice: 人也照他的称赞受检验
  alternative: 人从他所称赞的事物显明为人；或，人受到的称赞会检验他
  rationale: 希伯来语没有明确说明“称赞”是人发出的还是人领受的，也可能表达称赞如同熔炉一样检验人。正文不强行选定一种解释，脚注列出主要可能。
translation_notes:
  register: 采用现代、庄重而简洁的箴言体。前两分句保持平行，末句以分号转入对人的类比；“受检验”补明冶炼意象隐含的检验意义。
