base_translation:
  language: en
  yaml_path: translation/ot/proverbs/027/027.yaml
  text: And there will be enough goats' milk for your food[a], for the food of your household[b], and sustenance for your servant girls.
translation:
  language: zh_hans
  text: 山羊奶足够作你的食物[a]，作你全家的食物，也足以维持你家女仆的生活[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “食物”原文直译为“饼”；这里很可能泛指食物或生活所需。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“也使你的年轻女子有生活（或生命）”。“年轻女子”也可理解为“女仆”；“生活”在这里指维持生命所需的供给。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְדֵי
  choice: 足够
  rationale: דַּי表示数量充足；与“山羊奶”搭配译为“足够”，简明自然，也保留原文的充分之意。
- source_word: חֲלֵב עִזִּים
  choice: 山羊奶
  rationale: 直指山羊所产的奶；“山羊奶”是现代汉语中自然、准确的表达。
- source_word: לְלַחְמְךָ
  choice: 作你的食物
  rationale: לֶחֶם字面为“饼、食物”，此处泛指日常食物或供给；若仅译为“饼”，会使奶与饼的关系显得生硬。
- source_word: לְלֶחֶם בֵּיתֶךָ
  choice: 作你全家的食物
  rationale: בַּיִת在这里指家中成员，即“全家、家人”；לֶחֶם仍取广义“食物”。
- source_word: וְחַיִּים
  choice: 也足以维持……的生活
  rationale: חַיִּים字面是“生命、生活”，在物资供应的语境中指维持生活所需；此译保留“生活”的原有意象，同时表达供养之意。
- source_word: לְנַעֲרוֹתֶיךָ
  choice: 你家女仆
  rationale: נַעֲרָה可指少女、年轻女子或女仆；在家庭经济和供养的语境中，“女仆”较为贴切，但其词义歧义在脚注中保留。“你家”是为明确这些人属于前述家庭范围而作的自然汉语表达。
theological_decisions: []
