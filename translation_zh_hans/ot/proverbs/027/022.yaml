  text: Even if you grind a fool in a mortar with a pestle among crushed grain[a], his foolishness will not depart from him.
translation:
  language: zh_hans
  text: 即使你把愚昧人放在臼中，用杵同捣碎的谷粒[a]一起捣，他的愚妄也不会离开他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “捣碎的谷粒”所译的希伯来词 רִיפוֹת 较罕见，也可理解为“舂过的谷物”或“碎谷”。
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּכְתּוֹשׁ
  choice: 捣
  rationale: 该动词指在臼中捶打、捣碎；“捣”既准确对应具体动作，也与“臼、杵”自然搭配。
- source_word: אֱוִיל
  choice: 愚昧人
  rationale: 在《箴言》中，该词通常指在道德和判断上顽固愚妄的人，而不只是智力不足者；“愚昧人”保留了智慧文学的伦理意味。
- source_word: מַּכְתֵּשׁ
  choice: 臼
  rationale: 指用来捣谷物或香料的臼；现代汉语中简洁明确。
- source_word: רִיפוֹת
  choice: 捣碎的谷粒
  rationale: 该罕见名词大致指经过捣打或碾碎的谷物；此译法保留具体的粮食加工场景，同时不把其精确形态说得过死。
- source_word: עֱלִי
  choice: 杵
  rationale: 指与臼配套、用来捣击的工具；“杵”是准确而通行的汉语名称。
- source_word: תָסוּר מֵעָלָיו
  choice: 仍不会离开他
  rationale: 直译其“从他身上离去”的表达；“仍”显明即使采取极端手段，结果也不改变。
- source_word: אִוַּלְתּוֹ
  choice: 他的愚妄
  rationale: 抽象名词与“愚昧人”同源，表示其根深蒂固的愚昧、悖谬倾向；“愚妄”在箴言体裁中庄重且自然。
- source_word: אִם
  choice: 即使
  rationale: 此处引入让步性的假设，强调如此极端地捣打也无法除去愚妄。
theological_decisions: []
translation_notes:
  register: 采用现代、凝练而庄重的箴言体。“放在臼里……一起用杵捣”使汉语动作关系清楚，并保留原文夸张而具体的比喻；不将其改写成抽象的管教教训。脚注标记置于整节末尾，以免打断主句。
