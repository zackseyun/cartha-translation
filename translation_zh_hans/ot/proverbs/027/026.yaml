  yaml_path: translation/ot/proverbs/027/026.yaml
  text: Lambs are for your clothing[a], and goats are the price of a field.
translation:
  language: zh_hans
  text: '羊羔[a]供你穿衣，

    公山羊作田地的价款。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“绵羊”。希伯来语通常指羊羔或幼羊，此处也可能泛指绵羊。
    reason: 保留 כְּבָשִׂים 在“羊羔”和较宽泛的“绵羊”之间的词义可能性。
lexical_decisions:
- source_word: כְּבָשִׂים
  choice: 羊羔
  rationale: 该词通常指羊羔或幼羊；在畜牧供应的语境中也可能泛指绵羊。“羊羔”贴近其常见词义，并保留原文具体的牲畜意象。
- source_word: לִלְבוּשֶׁךָ
  choice: 供你做衣裳
  rationale: 介词 לְ 表明用途；这里不是说羊羔本身就是衣服，而是说它们供应制作衣物所需的羊毛。“供你做衣裳”在现代汉语中自然，并明确表达这种用途。
- source_word: וּמְחִיר
  choice: 可作……的价款
  rationale: מְחִיר 指价格、价款或支付代价。希伯来语省略系词；译文用“可作”表达公山羊能够充当购置田地的支付手段。
- source_word: שָׂדֶה
  choice: 田地
  rationale: שָׂדֶה 通常指田地或田野；此处涉及购置农业资产，“田地”最贴切。
- source_word: עַתּוּדִים
  choice: 公山羊
  rationale: 该词明确指雄性的山羊。“公山羊”比泛称“山羊”更准确，也符合现代汉语表达。
theological_decisions: []
translation_notes:
  register: 采用简洁、对称的箴言体。用“衣裳”保持庄重而通俗的语感；“价款”准确表达牲畜作为购地支付手段的经济意象。脚注标记置于其实际说明的“羊羔”之后；原英文资料中的脚注位置与内容不一致，且其内容所述“公山羊”已在正文中直接准确译出。
