  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: רֵֽעֲ/ךָ֨ ו/רעה אָבִ֡י/ךָ אַֽל תַּעֲזֹ֗ב וּ/בֵ֥ית אָחִ֗י/ךָ אַל תָּ֭בוֹא בְּ/י֣וֹם אֵידֶ֑/ךָ ט֥וֹב שָׁכֵ֥ן קָ֝ר֗וֹב מֵ/אָ֥ח רָחֽוֹק־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/027/010.yaml
  text: Do not forsake your friend or your father’s friend[a], and do not go to your brother’s house in the day of your calamity[b]; a nearby neighbor is better than a distant brother.
translation:
  language: zh_hans
  text: 你的朋友和你父亲的朋友，都不可离弃；你遭难的日子，不要到你兄弟[a]家里去。近邻胜过远方的兄弟。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “兄弟”也可泛指近亲或同族的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: רֵעֲךָ
  choice: 你的朋友
  rationale: רֵעַ可指朋友、同伴或邻舍；本节与“你父亲的朋友”并列，重点在持久的人际情谊，因此译作“朋友”。
- source_word: וְרֵעַ אָבִיךָ
  choice: 和你父亲的朋友
  rationale: 保留希伯来语连接词וְ的通常并列意义。汉语用“都不可离弃”自然地使同一禁令涵盖两者，无须将连接词解释为“或”。
- source_word: אַל תַּעֲזֹב
  choice: 都不可离弃
  rationale: עזב在这里不是单纯离开某处，而是弃置既有的关系与情义；“离弃”保留了这种关系上的分量。
- source_word: וּבֵית אָחִיךָ אַל תָּבוֹא
  choice: 不要到你兄弟家里去
  rationale: בוא可表示来、去或进入；结合“家”，现代汉语以“到……家里去”最自然，也含有遭难时前去投靠的语境意味，但不将这一意味明说进正文。
- source_word: בְּיוֹם אֵידֶךָ
  choice: 你遭难的日子
  rationale: אֵיד指灾祸、毁灭或严重的不幸；“遭难的日子”简洁庄重，又不限定灾祸的具体种类。
- source_word: שָׁכֵן קָרוֹב
  choice: 近邻
  rationale: שָׁכֵן是邻舍，קָרוֹב是近；“近邻”凝练自然，并突出实际距离上的接近。
- source_word: מֵאָח רָחוֹק
  choice: 胜过远方的兄弟
  rationale: 比较结构טוֹב...מִן在汉语中自然译为“胜过”。אָח保留为“兄弟”，维持血亲与邻舍之间的鲜明对照；רָחוֹק译作“远方的”，主要表达空间或实际可及性上的遥远。
theological_decisions:
- issue: 亲属称谓אָח的范围
  choice: 正文保留“兄弟”
  alternative: 亲属；族人
  rationale: אָח既可指亲兄弟，也可宽泛指近亲或同族之人。正文保留源文的具体形象和箴言张力，脚注提示其较宽词义，不把解释直接写入正文。
- issue: 不可离弃所涵盖的对象
  choice: 以“都”明确同一禁令同时涵盖自己的朋友和父亲的朋友
  alternative: 把וְ理解并译作“或”
  rationale: 希伯来语表面使用并列连接词“和”；汉语可在不改变连接词的情况下，用“都不可离弃”清楚表达禁令的共同管辖范围。
translation_notes:
  register: 采用现代、庄重而通顺的箴言体。“近邻胜过远方的兄弟”保持原文简洁有力的对比；全节避免古奥虚词，也不把“到兄弟家”进一步解释为求助或投靠，以保留原文的含蓄。
