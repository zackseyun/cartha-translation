  text: אַֽל תִּ֭תְהַלֵּל בְּ/י֣וֹם מָחָ֑ר כִּ֤י לֹא תֵ֝דַ֗ע מַה יֵּ֥לֶד יֽוֹם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/027/001.yaml
  text: Do not boast about tomorrow[a], for you do not know what a day may bring.
translation:
  language: zh_hans
  text: 不要为明天夸口，因为你不知道一天会带来什么。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“一天会生出什么”，也可译作“一天会产生什么”。
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּתְהַלֵּל
  choice: 夸口
  rationale: הלל 的 Hitpael 形式在这里有自我夸耀、自鸣得意之意。“夸口”简洁自然，保留了对自信炫耀的警戒。
- source_word: בְּיוֹם מָחָר
  choice: 为明天
  rationale: 字面是“在明日之日”，这里的介词引出夸口所涉及的对象或事情。“为明天”在现代汉语中简洁地表达对明日之事夸口。
- source_word: כִּי
  choice: 因为
  rationale: 引出前述禁令的理由；“因为”清楚呈现因果关系，也符合现代汉语箴言式表达。
- source_word: לֹא תֵדַע
  choice: 你不知道
  rationale: ידע 在此陈述人对未来缺乏知识，并不直接表示抽象意义上的“不能知道”；因此译作“你不知道”。
- source_word: מַה יֵּלֶד יוֹם
  choice: 一天会带来什么
  rationale: ילד 本义为“生、生出”，此处以生育为喻，指一天将产生或带来的事。“会带来什么”自然易懂，生育意象则在脚注中保留。
theological_decisions: []
