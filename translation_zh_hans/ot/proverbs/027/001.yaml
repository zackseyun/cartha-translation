  register: 采用简洁、庄重而自然的现代标准汉语，保留箴言的直接劝诫语气。“夸口”沿用普通读者熟悉的圣经表达；末句以自然汉语传达希伯来文的生育隐喻，并用脚注说明其字面形象。
