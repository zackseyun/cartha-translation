base_translation:
  language: en
  yaml_path: translation/ot/proverbs/027/025.yaml
  text: The hay is removed[a], and the new growth appears[c][b], and the grasses of the mountains are gathered.
translation:
  language: zh_hans
  text: 草已除去[a]，嫩草显现[b]，山上的草被收集起来[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “除去”或译“消失”或“显露出来”。希伯来语动词可表示被揭开、显露；在此语境中也可指草被移去。
    reason: lexical_alternative
  - marker: b
    text: “嫩草”或译“青草”或“新长的草”。
    reason: lexical_alternative
  - marker: c
    text: “山上的草”也可译“山上的野草”或“山上的植物”。
    reason: lexical_alternative
lexical_decisions:
- source_word: גָּלָה
  choice: 割去
  rationale: 该动词本义可指“显露、揭开”，也可在语境中表达某物被移去。与“干草”搭配并置于牧养收割的语境中，“割去”自然表达草被除去后新草显出的景象，同时以脚注保留原词的多义性。
- source_word: חָצִיר
  choice: 干草
  rationale: 该词可泛指草，也可指用作饲料的草；本节呈现割草、再生和收聚山野草木的农牧次序，因此译为“干草”。
- source_word: נִרְאָה
  choice: 显露
  rationale: Nifal形式可意为“被看见、显现”。“显露”既贴近被动色彩，也与前句草被割去后的可见景象相衔接。
- source_word: דֶשֶׁא
  choice: 嫩草
  rationale: 该名词指新鲜青绿的植被或柔嫩青草。“嫩草”简洁自然，并保留其具体植物意象。
- source_word: נֶאֶסְפוּ
  choice: 收聚起来
  rationale: 该动词为被动形式，基本义是“被聚集、被收集”。中文用“收聚起来”在农牧语境中自然，同时不过度限定为特定收割方式。
- source_word: עִשְּׂבוֹת
  choice: 草木
  rationale: 该词可泛指草本植物、野草或植被。“草木”比单纯“草”略宽，能够保留其涵盖山野植物的词义范围。
- source_word: הָרִים
  choice: 山上
  rationale: 该复数名词通常指山或群山；“山上的草木”准确传达其属格关系，也符合现代汉语表达。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的农牧用语。三个并列分句保留希伯来文的推进结构；“也都”使末句在汉语中衔接自然，但不增加神学解释。所有实质性词义歧义均以脚注保留。
