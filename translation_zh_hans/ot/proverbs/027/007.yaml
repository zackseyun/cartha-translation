  text: נֶ֣פֶשׁ שְׂ֭בֵעָה תָּב֣וּס נֹ֑פֶת וְ/נֶ֥פֶשׁ רְ֝עֵבָ֗ה כָּל מַ֥ר מָתֽוֹק־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/027/007.yaml
  text: A satisfied person despises honey[b][a], but to a hungry person every bitter thing is sweet.
translation:
  language: zh_hans
  text: 饱足的人连蜂蜜[b]也厌弃[a]；饥饿的人，凡苦的东西都是甘甜的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“饱足的魂连蜂蜜也践踏；饥饿的魂，凡苦的东西都甘甜。”希伯来语的“魂”（נֶפֶשׁ）在这里按习惯指人，尤其指人的食欲。
    reason: lexical_alternative
  - marker: b
    text: “蜂蜜”可能更具体地指蜂巢蜜或流出的蜜。
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: 人
  rationale: 该词本义可指“生命、心灵”，这里按希伯来语习惯以人的食欲状态代指整个人。译作“人”自然清楚，也保留前后“吃饱—饥饿”的对照。
- source_word: שְׂבֵעָה
  choice: 吃饱的
  rationale: 此词表示已经饱足。结合饮食语境译作“吃饱的”，比抽象的“满足的”更准确自然。
- source_word: תָּבוּס
  choice: 厌弃
  rationale: 动词字面可表示“践踏”，在这里引申为因饱足而轻看、拒绝食物。“厌弃”传达其比一般“不想吃”更强的轻蔑意味，同时不强行将字面动作写入正文。
- source_word: נֹפֶת
  choice: 蜂蜜
  rationale: 此词指蜜，可能特指蜂房中的蜜或滴流的蜜。“蜂蜜”是现代汉语中清楚、自然的对应词，具体形态另以脚注说明。
- source_word: רְעֵבָה
  choice: 饥饿的
  rationale: 准确表达缺乏食物、感到饥饿的状态，不采用“饿极了”等可能夸大程度的说法。
- source_word: כָּל
  choice: 任何
  rationale: 这里具有周遍、分配意义，表示对于饥饿的人，凡苦的东西都成了甘甜的。“任何”能自然表达这一箴言式概括。
- source_word: מַר
  choice: 苦物
  rationale: 形容词在此作名词使用，指味苦之物。“苦物”简洁保留其实体化用法，也与“甘甜”形成鲜明对照。
- source_word: מָתוֹק
  choice: 都是甘甜的
  rationale: 原文直接断言其为甜，并未明确加入“似乎”或“尝起来”。译文同样采用直接判断，以免消解箴言的力度。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而通俗的箴言体。以“吃饱的人—饥饿的人”和“蜂蜜—苦物—甘甜”呈现原文的平行对照；正文优先表达动词的语境义“厌弃”，脚注保留“践踏”的具体意象及 נֶפֶשׁ 的字面表达。
