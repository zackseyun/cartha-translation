  text: Know well the condition of your flock[b][a]; set your heart on the herds.
translation:
  language: zh_hans
  text: 你务要清楚了解你羊群的状况[a]，并要留心各群牲畜[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 字面为“务要知道你羊群的面貌”。这里的“面貌”指羊群可观察到的状况。
    reason: lexical_alternative
  - marker: b
    text: 或译“把你的心思放在各群牲畜上”。末尾的词指一群群牲畜，含义可与“羊群”重叠。
    reason: lexical_alternative
lexical_decisions:
- source_word: יָדֹעַ תֵּדַע
  choice: 要清楚了解
  rationale: 不定式绝对式与同根限定动词连用，加强命令语气；“要清楚了解”在现代汉语中自然地表达认真、充分掌握之意。
- source_word: פְּנֵי
  choice: 状况
  rationale: 字面为“面貌”，此处指从外在表现可察知的状态；译作“状况”符合汉语习惯。
- source_word: צֹאנְךָ
  choice: 羊群
  rationale: צֹאן通常指绵羊、山羊等小型牲畜的群体；“羊群”简洁自然，又不必限定为某一种羊。
- source_word: שִׁית לִבְּךָ
  choice: 专心照料
  rationale: 字面是“把你的心放在……上”，表达留心、关注和用心管理；“专心照料”传达实际牧养语境中的持续关注。
- source_word: לַעֲדָרִים
  choice: 各群牲畜
  rationale: עֲדָרִים为复数，指成群的牲畜，词义可与“羊群”重叠，也可较宽泛；“各群牲畜”既保留复数，又避免不必要地限定种类。
