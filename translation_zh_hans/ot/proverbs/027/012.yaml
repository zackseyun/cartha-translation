base_translation:
  language: en
  yaml_path: translation/ot/proverbs/027/012.yaml
  text: A prudent man sees danger and hides himself[a], but the simple pass on and suffer for it.
translation:
  language: zh_hans
  text: 谨慎的人看见危险，便藏身躲避；无知的人却继续前行，结果受罚[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “受罚”也可译为“吃苦头”或“承担后果”。希伯来语既可表示受到惩罚，也可表示承受行为带来的后果。
    reason: lexical_alternative
lexical_decisions:
- source_word: עָרוּם
  choice: 谨慎的人
  rationale: 该词在《箴言》中通常正面指有见识、能审时度势的人；译为“谨慎的人”既与下半句形成对照，也避免“狡猾”所带的负面含义。
- source_word: רָאָה
  choice: 看见
  rationale: 完成式在格言中表达一般性、典型性的行为；现代汉语用“看见”自然呈现这种恒常陈述。
- source_word: רָעָה
  choice: 危险
  rationale: 该名词可指邪恶、灾祸或伤害；这里是人能够预见并躲避的祸患，因此译为“危险”最符合语境。
- source_word: נִסְתָּר
  choice: 藏身躲避
  rationale: Nifal形式表达为避开危险而隐藏、隐蔽自己；“藏身躲避”自然传达其反身意味和目的。
- source_word: פְּתָאיִם
  choice: 无知的人
  rationale: 这是智慧文学中指缺乏经验和判断力、容易受骗之人的常用词；“无知的人”通俗易懂，又不误译为另一类更顽固的“愚昧人”。
- source_word: עָבְרוּ
  choice: 继续前行
  rationale: 该动词与谨慎之人的躲避形成对比，表示不采取防范而仍往前走。
- source_word: נֶעֱנָשׁוּ
  choice: 受罚
  rationale: ענשׁ的Nifal形式可指被处罚，也可较宽泛地指付出代价、承受后果；正文采用简洁直接的“受罚”，并以脚注保留语义范围。
theological_decisions:
- issue: נֶעֱנָשׁוּ所指是正式惩罚还是自然后果
  choice: 正文译作“受罚”，脚注说明也可能指吃苦头或承担后果
  alternative: 结果吃了苦头／为此付出代价
  rationale: 原文并未明确惩罚的施行者或机制；正文保留惩罚色彩，脚注则避免把经文限定为正式或神圣审判。
translation_notes:
  register: 采用现代、庄重而易懂的格言体。分号突出两类人的鲜明对照；“便”与“却”加强因应危险与贸然前行之间的反差。脚注标记置于其实际所解释的“受罚”之后。
