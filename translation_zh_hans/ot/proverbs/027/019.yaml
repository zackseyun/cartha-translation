  yaml_path: translation/ot/proverbs/027/019.yaml
  text: As in water face reflects face[b][a], so the heart of man reflects man.
translation:
  language: zh_hans
  text: 水怎样映照人的脸，人的心也怎样反映其人[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译近于“如同水，脸对脸；人的心对人”。两个分句都没有明说动词；“映照”和“反映”是按水中倒影及全句对应关系补出的。
    reason: lexical_alternative
  - marker: b
    text: “人”（希伯来文 אָדָם）在此为格言中的类称单数；也可译作“一个人”或“世人”。
    reason: alternative_reading
lexical_decisions:
- source_word: כַּמַּיִם
  choice: 水中
  rationale: 介词 כ־引出比较；结合后面的“脸与脸”，译作“水中”可自然表达脸显现在水中的图像，同时不把水本身说成主动映照者。
- source_word: הַפָּנִים לַפָּנִים
  choice: 脸与脸相映
  rationale: 原文直译近于“脸对脸”，没有明说动词；水的语境暗示映照。补出“相映”使汉语通顺，又以脚注注明原文的省略结构。
- source_word: כֵּן
  choice: 也是这样
  rationale: 与前句的比较结构相呼应，相当于“照样、同样”。
- source_word: לֵב
  choice: 心
  rationale: 保留智慧文学中的核心意象，涵盖人的思想、意愿和内在性情，不缩窄为单纯情感。
- source_word: הָאָדָם
  choice: 人的
  rationale: אָדָם 带冠词，在格言中可作类称；现代汉语“人”自然保留泛指意义。
- source_word: לָאָדָם
  choice: 与人
  rationale: 保留 ל־所表达的关系，并维持“脸与脸／心与人”的平行。原文没有明说“反映”或“显明”，因此正文避免把一种解释定死。
theological_decisions:
- issue: 后半句“人的心与人”的关系如何理解
  choice: 保留省略式关系：“人的心与人也是这样”
  alternative: “人的心也映照其人”或“人的心反映本人”
  rationale: 希伯来文仅为“人的心对／于人”，没有动词。它可能指一个人的心显明其本人，也可能延续前句的相互对应关系。正文保留张力，脚注提供较明确的理解。
- issue: אָדָם 的泛指范围
  choice: 人
  alternative: 男人／世人／人类
  rationale: 此处是智慧格言中的类称单数；简体中文“人”既自然又能涵盖个体与普遍的人，不必加入原文没有强调的性别限定。
translation_notes:
  register: 采用简洁、对称的现代书面汉语，保留箴言的凝练感。“相映”只在首句补足水中倒影的明显意象；后句不重复补入解释性动词，以保存原文的省略和歧义。
