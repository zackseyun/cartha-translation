  text: כִּ֤י לֹ֣א לְ/עוֹלָ֣ם חֹ֑סֶן וְ/אִם נֵ֝֗זֶר לְ/ד֣וֹר דור־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/027/024.yaml
  text: For wealth does not last forever[b][a], nor a crown from generation to generation.
translation:
  language: zh_hans
  text: 因为财富不能长存[a]，冠冕也不能世代长存[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “财富”也可译作“资财”或“财力”；希伯来词也可表示“力量”，但本段语境偏重物质产业。
    reason: lexical_alternative
  - marker: b
    text: “冠冕”也可译作“王冠”；相应的希伯来词还可与“分别为圣”有关。这里很可能以冠冕象征地位或统治权。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 本句为上下文关于谨慎照料产业的劝诫提供理由；“因为”自然表达其解释作用。
- source_word: חֹסֶן
  choice: 财富
  rationale: 该词可指财力、资财或力量；结合27:23–27有关牲畜、田产和生活供应的语境，“财富”最贴切。
- source_word: לֹא לְעוֹלָם
  choice: 不能长存
  rationale: 原文直意为“不到永远”，所强调的是财富并非永久；“不能长存”在现代汉语中凝练自然。
- source_word: וְאִם
  choice: 也不能
  rationale: אִם通常可作“若”，但在前一否定句之后，这里构成省略式的并列否定；译作“也不能”保留整体语义并符合汉语表达。
- source_word: נֵזֶר
  choice: 冠冕
  rationale: 该词可指冠冕、王冠，也可与分别为圣相关；此处与财富平行，并涉及世代延续，故保留具体而庄重的“冠冕”。
- source_word: לְדוֹר דּוֹר
  choice: 代代相传
  rationale: 重复“世代”表达一代接一代的延续；“代代相传”既自然，也能体现王权或地位未必延续至各代。
theological_decisions:
- issue: 箴言平行结构中 נֵזֶר 的含义
  choice: 冠冕，象征统治权、身份或显赫地位
  alternative: 分别为圣；王冠
  rationale: “冠冕”保留原文具体意象及其多义空间，不把经文限定为祭祀意义；与“财富”并列时，也自然表达权势和地位并非恒久。
- issue: וְאִם 在否定平行句中的句法
  choice: 理解为承接前句的第二重否定：“也不能”
  alternative: 按通常条件义直译为“若冠冕……”
  rationale: 后半句高度省略，承接 לֹא 的否定最能说明整句平行关系；同时不额外添加原文没有的条件结果。
translation_notes:
  register: 采用现代、凝练而庄重的箴言体。“不能长存”与“不能代代相传”形成清晰平行；正文中的脚注标记均紧随相关词句。
