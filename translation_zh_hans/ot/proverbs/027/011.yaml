  yaml_path: translation/ot/proverbs/027/011.yaml
  text: Be wise[a], my son, and make my heart glad[b], that I may answer the one who reproaches me.
translation:
  language: zh_hans
  text: 我儿，你要有智慧[a]，使我的心欢喜，好让我能回答[b]那讥讽我的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“变得有智慧。”原文的祈使式既可强调有智慧的状态，也可强调追求、获得智慧。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“向那讥讽我的人回一句话”，意思是“回答那讥讽我的人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲכַם
  choice: 要有智慧
  rationale: 该词是חכם的阳性单数祈使式，既可劝人处于有智慧的状态，也可劝人追求并获得智慧。“要有智慧”自然保留了劝诫语气，又不把含义局限为外在行事。
- source_word: בְּנִי
  choice: 我儿
  rationale: בן加第一人称单数后缀，直译为“我的儿子”。“我儿”符合汉语智慧训诲的称呼方式，也保留原文阳性单数形式。
- source_word: וְשַׂמַּח לִבִּי
  choice: 使我的心欢喜
  rationale: שמח的使役式祈使语气要求保留“使……欢喜”的因果含义；“我的心”也按原文具体表达予以保留。
- source_word: וְאָשִׁיבָה ... דָבָר
  choice: 好让我能回答
  rationale: אָשִׁיבָה是第一人称单数鼓励式；与דָבָר合用，字面为“回一句话”，实际表达作出回应。前面的劝诫为说话者能够回应责难提供目的或结果，因此译作“好让我能回答”。
- source_word: חֹרְפִי
  choice: 那讥讽我的人
  rationale: חרף的主动分词带第一人称单数后缀，指持续或惯常讥讽、羞辱说话者的人。“讥讽我的人”保留其人物指称和未完成性的语感。
