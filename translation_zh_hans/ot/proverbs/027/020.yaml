  text: שְׁא֣וֹל ו/אבדה לֹ֣א תִשְׂבַּ֑עְנָה וְ/עֵינֵ֥י הָ֝/אָדָ֗ם לֹ֣א תִשְׂבַּֽעְנָה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/027/020.yaml
  text: Sheol and Abaddon are never satisfied[b][a], and the eyes of man are never satisfied.
translation:
  language: zh_hans
  text: 阴间和灭亡[a]永不满足；人的眼目[b]也永不满足。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “灭亡”也可理解为“灭亡之地”；原文在这里带有领域化、拟人化的意味。
    reason: lexical_alternative
  - marker: b
    text: 这里的“人”是泛指，指所有人。
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁאוֹל
  choice: 阴间
  rationale: 指死者所在的领域；采用现代中文圣经语境中通行的“阴间”，避免译成“地狱”而带入后期的教义含义，也不缩窄为具体的“坟墓”。
- source_word: אֲבַדָּה
  choice: 灭亡
  rationale: 该词可指毁灭，也可带有毁灭领域的拟人化意味。译作“灭亡”既保留与“阴间”的平行关系，也不强行判定它是专名或具体地点。
- source_word: לֹא תִשְׂבַּעְנָה
  choice: 永不满足
  rationale: שׂבע在这里表示吃饱、充满或得到满足。上下文强调无止境，故以“永不满足”传达箴言的力度，并在两行中保持原文重复。
- source_word: עֵינֵי
  choice: 眼目
  rationale: 保留希伯来文以眼睛象征观看、贪求和欲望的具体意象；“眼目”庄重而易懂。
- source_word: הָאָדָם
  choice: 人
  rationale: 带冠词的单数אָדָם在此作类指，泛指人类。现代汉语“人”自然保留单数形式，同时清楚涵盖所有人。
theological_decisions:
- issue: שְׁאוֹל的含义
  choice: 阴间
  alternative: 坟墓／地狱
  rationale: 原词所指范围比单一坟墓更广，也不等同于后期神学中受刑之地的“地狱”；因此采用较中性的传统译语。
- issue: אֲבַדָּה是抽象的“毁灭”还是领域性称谓
  choice: 灭亡
  alternative: 灭亡之地／亚巴顿
  rationale: 本节形式可表达毁灭或拟人化的毁灭领域。正文使用“灭亡”保留这一张力，脚注交代其他理解，不将其确定为专名。
- issue: הָאָדָם在箴言中的类指范围
  choice: 人
  alternative: 一个男人／人类
  rationale: 原文语法为阳性单数类指，并非只说某一男性。中文“人”既贴近形式，又自然表达普遍的人性。
translation_notes:
  register: 采用简洁、对称的箴言体。两次使用“永不满足”，对应原文同一动词的重复；以分号呈现两组平行内容。“眼目”保留庄重感及原文关于欲望的形象，同时仍符合现代标准普通话。
