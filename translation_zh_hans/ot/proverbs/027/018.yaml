base_translation:
  language: en
  yaml_path: translation/ot/proverbs/027/018.yaml
  text: Whoever tends a fig tree will eat its fruit[b][a], and he who watches over his master will be honored.
translation:
  language: zh_hans
  text: 照料无花果树的，必吃其果子[a]；看顾主人的[b]，必得尊荣。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “照料”也可译作“看守”或“看护”；希伯来文强调持续、谨慎而忠实地照看。
    reason: lexical_alternative
  - marker: b
    text: “看顾主人”直译近于“看守（或守护）主人”，主要指留心照管、忠实尽责，不一定仅指保护其人身安全。
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹצֵר
  choice: 看护
  rationale: 该分词本义为守护、看守或持守；以无花果树为宾语时，所指是持续照看、培育树木。“看护”既保留守护含义，也符合农事语境。
- source_word: תְּאֵנָה
  choice: 无花果树
  rationale: 此名词指树木本身，而非仅指无花果；译出“树”可保留箴言具体的农耕图景。
- source_word: יֹאכַל
  choice: 必吃
  rationale: 未完成式在箴言中表达通常可预期的结果；“必吃”简洁呈现照料与收获之间的因果关系。
- source_word: פִּרְיָהּ
  choice: 树上的果子
  rationale: 阴性单数后缀回指无花果树。汉语用“树上的果子”指代清楚，也避免生硬的“它的果子”。
- source_word: שֹׁמֵר
  choice: 尽心侍候
  rationale: 该分词可指看守、守护、留意照管。以“主人”为宾语时，语境主要强调下属持续留心、忠实尽责，而不必限于身体保护；“尽心侍候”以自然汉语表达这一关系。
- source_word: אֲדֹנָיו
  choice: 主人
  rationale: 该词在此智慧语境中自然指人的主人或上级；“主人”保留古代社会关系，又不把所指直接神化。
- source_word: יְכֻבָּד
  choice: 必得尊荣
  rationale: כבד 的Pual式表示受到尊重、获得尊荣。“必得尊荣”保留被动结果的含义，并与前半句“必吃”形成整齐对应。
theological_decisions:
- issue: “主人”的所指
  choice: 按普通人际关系中的主人或上级翻译
  alternative: 将其理解为主上帝
  rationale: 希伯来文 אֲדֹנָיו 本身没有要求神圣所指的标记，且与照看无花果树平行，首先描写忠实履行属下责任的人。经文可以有更广的属灵应用，但不应把这种应用直接写入译文。
- issue: שֹׁמֵר 所表达的责任性质
  choice: 译为持续留心、忠实侍候主人
  alternative: 仅译为保护主人免受人身伤害
  rationale: 该动词语义范围包括守护、看守和谨慎照管；本节的智慧类比着重持续尽责及其所得尊荣，不宜把含义缩窄为身体保卫。
translation_notes:
  register: 采用现代、庄重而通俗的箴言体。两分句以“……的，必……”对应，保留原文的平行结构和因果力度；“看护”与“尽心侍候”则按各自宾语作自然汉语调整。
