  yaml_path: translation/ot/proverbs/027/016.yaml
  text: Whoever restrains her restrains the wind[a], and his right hand grasps oil.
translation:
  language: zh_hans
  text: 想约束她，就像约束风，又像用右手抓油。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节后半句的希伯来文含义不明确，较直译可作“他的右手呼叫油”。正文按本箴言的意象译作“用右手抓油”。
    reason: lexical_alternative
lexical_decisions:
- source_word: צֹפְנֶיהָ / צָפַן
  choice: 约束她／约束
  rationale: צפן通常有“隐藏、收藏”之意，但这里以风为对应意象，并承接上一节所说的争闹妇人，语境指试图把她管住、控制住。重复译作“约束”保留原文的词语呼应。
- source_word: רוּחַ
  choice: 风
  rationale: 本节描写无法控制之物，具体意义是“风”，而非“灵”。
- source_word: שֶׁמֶן
  choice: 油
  rationale: 直接保留原文意象；原文没有明确说是橄榄油，不作增译。
- source_word: יְמִינוֹ
  choice: 右手
  rationale: 保留原文明确的身体意象，也突显用手抓住油的不可能性。
- source_word: יִקְרָא
  choice: 抓
  rationale: 该动词通常意为“呼叫”，但如此直译在本句中意义费解。正文按箴言的平行意象译出用手抓油却抓不住的含义，同时在脚注保留较直译法及其不确定性。
