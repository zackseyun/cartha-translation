  text: מְבָ֘רֵ֤ךְ רֵעֵ֨/הוּ בְּ/ק֣וֹל גָּ֭דוֹל בַּ/בֹּ֣קֶר הַשְׁכֵּ֑ים קְ֝לָלָ֗ה תֵּחָ֥שֶׁב לֽ/וֹ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/027/014.yaml
  text: Whoever blesses his neighbor with a loud voice[a], rising early in the morning[c][b], it will be counted to him as a curse.
translation:
  language: zh_hans
  text: 清早起来，大声为邻舍[a]祝福的，这会被算作咒诅，归到他身上[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “邻舍”也可译作“朋友”或“同伴”。
    reason: lexical_alternative
  - marker: b
    text: “他”可指大声祝福的人；按语境也可理解为其邻舍。全句带有反讽意味：清早高声的祝福会被当作咒诅。
    reason: textual_ambiguity_and_cultural_note
lexical_decisions:
- source_word: מְבָרֵךְ
  choice: 祝福
  rationale: 保留ברך的基本词义，指向人说祝福的话；不窄化为一般的问候或称赞。
- source_word: רֵעֵהוּ
  choice: 邻舍
  rationale: רֵעַ可指朋友、同伴或邻舍；“邻舍”保留箴言中较宽泛的人际关系含义，并以脚注列出其他可能。
- source_word: בְּקוֹל גָּדוֹל
  choice: 大声
  rationale: 自然准确地表达希伯来语“以大声音”，同时凸显这种举动扰人的方式。
- source_word: בַּבֹּקֶר הַשְׁכֵּים
  choice: 清早起来
  rationale: 同时表达清晨的时间和刻意早起的意味，符合现代汉语表达。
- source_word: קְלָלָה
  choice: 咒诅
  rationale: 保留该名词的直接含义以及本句中祝福反成咒诅的反讽。
- source_word: תֵּחָשֶׁב לוֹ
  choice: 在邻舍看来，反算为
  rationale: 以自然汉语表达Niphal的“被看作、被算为”；介词短语לוֹ可能指在被祝福者看来，也可能指归到祝福者身上，正文采取较合语境的前者，并在脚注保留另一种理解。
theological_decisions:
- issue: לוֹ所指对象及评价视角
  choice: “在邻舍看来”：指被祝福者把这种祝福看作咒诅
  alternative: “这就算为他的咒诅”：指这行为被算在祝福者身上，成为咒诅
  rationale: 希伯来语男性单数代词存在指代上的歧义。邻舍是较近的先行词，而且扰人清梦的反讽在此读法下清楚；但语法并未彻底排除归于祝福者的理解，因此以脚注保留。
translation_notes:
  register: 采用简洁、 dignified 的现代标准普通话。“清早起来，大声……”保留原文突出的时间与音量；“反算为”传达祝福与咒诅之间的讽刺逆转。所有脚注标记均已置于正文。
