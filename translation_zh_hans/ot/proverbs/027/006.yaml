  text: Faithful are the wounds of a friend[a], but the kisses of an enemy are excessive.
translation:
  language: zh_hans
  text: 爱者所加的伤，出于忠诚；恨者的亲吻却过多[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“丰沛”或“接连不断”。这个词的含义不易确定；也可能是说，恨者的亲吻多得反常，因而显得不真诚或带有欺骗性。
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶאֱמָנִים
  choice: 出于忠诚
  rationale: 该词表示可靠、可信或忠诚。这里修饰爱人者所加的伤，重点不是伤本身可取，而是其动机真诚可靠；“出于忠诚”在现代汉语中自然地表达这一关系。
- source_word: פִּצְעֵי
  choice: 所加的伤
  rationale: 原词指伤口、创伤或伤害，在箴言中也可涵盖令人痛苦的责备。“伤”保留原文鲜明而简洁的形象。
- source_word: אוֹהֵב
  choice: 爱你的人
  rationale: 该分词直译为“爱的人”或“爱人者”。译作“爱你的人”比单纯译作“朋友”更贴近希伯来文，并与后半句“恨你之人”形成直接对照。
- source_word: וְנַעְתָּרוֹת
  choice: 却过多
  rationale: 此词形和语义较难确定，主要可理解为“很多、过多、接连不断”，也有人按语境理解为“虚假、欺骗”。正文采用较直接的数量义“过多”，不把其隐含的虚假意味写死。
- source_word: נְשִׁיקוֹת
  choice: 亲吻
  rationale: 原词明确指复数的“吻”。汉语“亲吻”既自然，又可保留表面亲热举动与真实敌意之间的反差。
- source_word: שׂוֹנֵא
  choice: 恨你之人
  rationale: 该分词直译为“恨的人”或“恨人者”。“恨你之人”保留原文的动作性含义，并与“爱你的人”构成工整对举。
theological_decisions:
- issue: 爱者造成的伤与恨者给予的吻之间的道德反差
  choice: 以“出于忠诚”说明前者的可靠动机，同时保留后者“过多”的字面开放性
  alternative: 将后半句直接译为“仇敌的亲吻是虚假的”
  rationale: 原文赞许爱者虽使人受伤却忠诚可靠，同时警示敌意之人的亲热举动；但疑难词未必直接等于“虚假”，故不在正文中消除其词义张力。
translation_notes:
  register: 采用简洁、对偶的现代书面汉语，以保留箴言的凝练力度。“爱你的人／恨你之人”贴近原文分词结构；前后略作语体变化，避免全句过度口语化。
