  text: A constant dripping on a day of heavy rain[a], and a quarrelsome wife, are alike.
translation:
  language: zh_hans
  text: 阴雨天不断滴漏的水，和好争吵的妻子一样。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“下雨天不断滴漏的水，和好争吵的妻子是一样的。”原文的“阴雨天”也可指持续降雨或风雨天气。
    reason: 保留סַגְרִיר所涵盖的雨天、持续降雨及风雨天气等词义范围，并说明较直译的比较表达。
lexical_decisions:
- source_word: דֶּלֶף
  choice: 漏水
  rationale: 指屋顶漏下的水；译作“漏水”保留具体的居家场景，并与“滴个不停”自然搭配。
- source_word: טוֹרֵד
  choice: 滴个不停
  rationale: 该分词表达持续、反复的动作；“滴个不停”以现代汉语自然呈现其延续性和扰人之感。
- source_word: בְּיוֹם סַגְרִיר
  choice: 大雨天
  rationale: סַגְרִיר可指阴雨、持续降雨或风雨天气；“大雨天”简洁保留恶劣而多雨的具体情境，不扩大为泛指的暴风雨。
- source_word: אֵשֶׁת מִדְיָנִים
  choice: 好争吵的妻子
  rationale: 该结构直指“争端之妻”；“好争吵的妻子”是自然、清楚的现代汉语，也未弱化原文的负面刻画。
- source_word: נִשְׁתָּוָה
  choice: 两者相仿
  rationale: 该动词表示相同、相似或可相比；“两者相仿”明确呈现谚语所作的类比，同时避免把相等程度说得过死。
theological_decisions: []
