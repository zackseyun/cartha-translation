  text: Let another praise you[a], and not your own mouth; a stranger[b], and not your own lips.
translation:
  language: zh_hans
  text: 让别人[a]称赞你，而不是你自己的口；让外人[b]称赞你，而不是你自己的嘴唇。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “别人”所译的希伯来词 זָר 也可译为“陌生人”或“外人”；这里着重表示称赞应当来自自己以外的人。
    reason: lexical_alternative
  - marker: b
    text: 本行的“外人”（נָכְרִי）与上一行的“别人”（זָר）在希伯来原文中是两个不同的词；译文保留这种变化，以反映诗句的平行结构。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהַלֶּלְךָ
  choice: 要让……称赞你
  rationale: 未完成式在此具有劝诫意味。“要让”自然表达准许式劝告；“称赞”直接传达 הלל 的含义。
- source_word: זָר
  choice: 别人
  rationale: זָר 可指自己圈子以外的人；本节核心对比是他人的称赞与自我夸赞。“别人”在现代汉语中准确、自然，并避免不必要地突出族群意义。
- source_word: פִיךָ
  choice: 自己的口
  rationale: 字面为“你的口”。译作“自己的口”明确呈现与“别人”的对比，同时保留“口”的身体意象。
- source_word: נָכְרִי
  choice: 外人
  rationale: נָכְרִי 常指外来或不熟悉的人。“外人”既与首行“别人”有所区别，也比“外国人”更符合本箴言的一般性语境。
- source_word: שְׂפָתֶיךָ
  choice: 自己的嘴唇
  rationale: 保留“嘴唇”的原文意象，并以“自己的”凸显不可自夸的对照。
- source_word: וְלֹא ... וְאַל
  choice: 不可……不可
  rationale: 两个否定词在平行句中共同禁止自我称赞。重复“不可”既传达劝诫语气，也保持句式平衡。
