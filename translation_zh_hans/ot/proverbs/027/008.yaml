base_translation:
  language: en
  yaml_path: translation/ot/proverbs/027/008.yaml
  text: Like a bird that wanders from its nest[a], so is a man who wanders from his place.
translation:
  language: zh_hans
  text: 鸟儿离巢飘荡；人离开自己的地方，也是这样。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “自己的地方”也可按语境理解为“自己的家”或“本来的位置”；希伯来语此词含义较宽，并不限于房屋。
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּצִפּוֹר
  choice: 雀鸟怎样
  rationale: צִפּוֹר泛指鸟类，常可指小鸟，并非特定物种；“雀鸟”在现代汉语中自然且不作过度限定，同时以“怎样……也是如此”呈现希伯来语的明喻结构。
- source_word: נוֹדֶדֶת / נוֹדֵד
  choice: 漂泊
  rationale: 两处均源于נוד，表达离开固定所在而游移、流荡；两句都用“漂泊”，保留原文刻意的词根重复和平行关系。
- source_word: מִן קִנָּהּ
  choice: 离巢
  rationale: קֵן意为“巢”；“离巢”简洁自然，准确表达从自己的巢穴离开的意思。
- source_word: כֵּן
  choice: 也是如此
  rationale: כֵּן承接前句比喻并引出人的对应处境；“也是如此”保留比较关系，符合汉语箴言体。
- source_word: אִישׁ
  choice: 人
  rationale: אִישׁ为阳性单数，但在本箴言中可作代表性个体使用。汉语“人”无需标示语法性别，也不排除原文所描写的个体性。
- source_word: מִמְּקוֹמוֹ
  choice: 离开自己的地方
  rationale: מָקוֹם基本义为“地方、所在”；此译保留其宽泛性，不把含义限定为住宅，也不擅自解释为身份或岗位。
theological_decisions:
- issue: אִישׁ的代表性阳性表达
  choice: 人
  alternative: 男人
  rationale: 希伯来语形式为阳性单数，但这里是在鸟与人的处境之间作一般性类比。现代汉语“人”自然地表达代表性个体，并未借语法性别引入或删除神学主张。
- issue: “自己的地方”的范围
  choice: 保留宽泛的“地方”
  alternative: 家；本位；归属之处
  rationale: 原文מָקוֹם可指居所、固定所在或更广义的适当位置。正文不将其收窄，以保留箴言可能具有的多重应用和张力。
translation_notes:
  register: 采用简洁、对称的现代汉语箴言体。“离巢漂泊”与“离开自己的地方”形成具体意象和人的处境之间的对应；保留原文两次使用同一词根所形成的呼应。
