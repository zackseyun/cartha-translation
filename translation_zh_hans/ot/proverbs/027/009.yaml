base_translation:
  language: en
  yaml_path: translation/ot/proverbs/027/009.yaml
  text: Oil and incense make the heart glad[a], and the sweetness of a friend comes from the counsel of the soul.
translation:
  language: zh_hans
  text: 膏油和香使人心欢喜；朋友的甘甜，来自内心的劝告[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“朋友的甘甜，胜过自己的谋算。”第二行的希伯来文十分简练，可有不止一种理解。
    reason: alternative_reading
lexical_decisions:
- source_word: שֶׁמֶן
  choice: 膏油
  rationale: 该词基本义为油，也常指用于涂抹或带香气的油；“膏油”既保留具体意象，又与“香料”自然搭配。
- source_word: קְטֹרֶת
  choice: 香料
  rationale: 该词可指焚烧的香或芳香混合物；此处“香料”在现代汉语中自然，并保留令人愉悦的芳香意象。
- source_word: יְשַׂמַּח לֵב
  choice: 使人心喜悦
  rationale: 忠实表达使役意义，并保留希伯来语以“心”指内在感受的说法。
- source_word: מֶתֶק
  choice: 甘甜
  rationale: 保留“甜美、悦人”的感官隐喻，也能自然形容朋友所带来的愉悦。
- source_word: רֵעֵהוּ
  choice: 朋友的
  rationale: 原词为“朋友／同伴”并带第三人称阳性单数后缀；箴言语体在汉语中可自然泛化为“朋友的”。
- source_word: מֵעֲצַת
  choice: 出于……劝告
  rationale: 将介词 מִן 理解为来源，表示朋友关系的甘甜源自劝告；同时以脚注保留其可能作比较义的另一种理解。
- source_word: נָפֶשׁ
  choice: 由衷的
  rationale: נֶפֶשׁ 可指生命、本人或内在之人；“由衷的”在此自然表达发自内心，但不把紧凑的原文扩展得过多。
theological_decisions:
- issue: 第二行 מֵעֲצַת־נָפֶשׁ 的句法关系
  choice: 理解为来源：“朋友的甘甜，出于由衷的劝告”
  alternative: 理解为比较：“朋友的甘甜胜过自己的谋算”
  rationale: 希伯来文极其简练，מִן 既可能表示来源，也可能表示比较；正文采用与友人真诚劝告相关的来源义，脚注明确保存另一种可行读法，不将歧义定为教义结论。
translation_notes:
  register: 采用现代、庄重而易懂的箴言体。前半句保留“膏油—香料—心喜悦”的具体意象；后半句保留“甘甜”隐喻，并用脚注明示原文真实的句法歧义。
