base_translation:
  language: en
  yaml_path: translation/ot/proverbs/027/005.yaml
  text: Open rebuke is better than hidden love[a].
translation:
  language: zh_hans
  text: 坦白的责备，胜过隐藏的爱[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“被遮掩的爱”。希伯来文可能是指没有表达出来的爱，而不是没有爱。
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹבָה
  choice: 胜过
  rationale: 与比较介词 מִן 连用时表达“比……更好”；译作“胜过”简洁自然，符合箴言的对比句式。
- source_word: תּוֹכַחַת
  choice: 责备
  rationale: 该词指言语上的指正或斥责；“责备”保留其较强语气，又是现代汉语常用表达。
- source_word: מְגֻלָּה
  choice: 公开的
  rationale: 该被动分词本义为“揭开的、显露的”；“公开的”在此表示责备没有被遮掩，但不必限定为当众责备。
- source_word: מִן
  choice: 胜过
  rationale: 该介词在 טוֹבָה 之后标示比较关系，汉语将其整合进“胜过”的结构中。
- source_word: אַהֲבָה
  choice: 爱
  rationale: 直译为“爱”，保留原文宽泛而有分量的含义，不弱化为单纯的“好感”。
- source_word: מְסֻתָּרֶת
  choice: 隐藏的
  rationale: 该词意为“被隐藏的、被遮掩的”；“隐藏的”保留了原文的歧义，既可能指未表达出来的爱，也可能泛指被隐蔽的爱。
theological_decisions:
- issue: “隐藏的爱”的性质
  choice: 保留“隐藏的爱”，不解释为虚假或缺失的爱
  alternative: 未表达的爱／隐而不露的爱
  rationale: 希伯来语只说明爱是隐藏的，并未断定这种爱不存在、虚假或出于不良动机；正文保留其张力，脚注提示可能指没有表达出来的爱。
translation_notes:
  register: 采用简洁、对称、庄重的现代标准汉语，保持箴言格言式节奏。“公开”表示显露、不隐藏，不特别限定责备发生在公众场合。
