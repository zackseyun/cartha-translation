  text: קַח בִּ֭גְד/וֹ כִּי עָ֣רַב זָ֑ר וּ/בְעַ֖ד נָכְרִיָּ֣ה חַבְלֵֽ/הוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/027/013.yaml
  text: Take his garment[a], for he has put up security for a stranger[b]; and hold it in pledge for a foreign woman.
translation:
  language: zh_hans
  text: 他为陌生人作保，就拿走他的衣服；他为外族女子[b]作保，就把他扣作抵押。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节希伯来文十分凝练。第二分句的动词可指“扣住／扣留作抵押”；其阳性单数后缀按字面可指担保者本人。也有人依照上半句的衣服与抵押图景，理解为从他取走或扣留抵押物。
    reason: syntactic_and_lexical_alternative
  - marker: b
    text: “外族女子”所译的希伯来词可指非以色列女子；在《箴言》中，也可能指在社会或道德关系上不正当的女子。这里保留较宽泛的说法。
    reason: lexical_alternative
lexical_decisions:
- source_word: קַח בִּגְדוֹ
  choice: 拿走他的衣服
  rationale: קַח是直接命令“拿”；בִּגְדוֹ指“他的衣服”。合译保留以衣物充当抵押物的法律经济图景。
- source_word: עָרַב
  choice: 作保
  rationale: 该动词在此指为他人的债务承担担保责任。“作保”是现代汉语中简洁、准确的法律经济表达。
- source_word: זָר
  choice: 陌生人
  rationale: זָר在此可指亲属或既有关系圈之外的人；“陌生人”保留箴言所强调的贸然为不熟悉者担保的风险。
- source_word: נָכְרִיָּה
  choice: 外族女子
  rationale: 该词字面可指外族、外来的女子，在《箴言》中也可能带有关系不正当或社会上不属于己方群体的意味；正文采用较宽泛的词义，并以脚注保留语义张力。
- source_word: חַבְלֵהוּ
  choice: 扣住他作抵押
  rationale: חבל在取抵押物的语境中表示扣押担保；第三人称阳性单数后缀直指“他”，因此较严格地译为扣住担保者本人，而不把宾语默认为前句的衣服。
theological_decisions:
- issue: 两小句是同一情形的平行复述，还是两个并列条件
  choice: 按平行条件句呈现：“谁……就……；谁……就……”
  alternative: “拿走他的衣服，因为他为陌生人作保；并因外族女子而扣住他作抵押”
  rationale: 希伯来文极其凝练，第二小句省略了部分成分。条件式汉语清楚表达箴言的司法警语，同时脚注说明原文结构和宾语解释仍有歧义。
translation_notes:
  register: 采用简洁、对称的现代标准汉语，以“作保”“抵押”保存原文的债务担保背景。语气保持箴言式的直接警戒；脚注交代第二小句的句法和词义歧义，不在正文中强行消解。
