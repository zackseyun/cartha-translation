  yaml_path: translation/ot/proverbs/005/018.yaml
  text: Let your fountain be blessed[a], and rejoice in the wife of your youth.
translation:
  language: zh_hans
  text: 愿你的泉源蒙福[a]；你要喜悦年轻时所娶的妻子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “泉源”也可译作“泉”或“源头”。希伯来文保留了水的比喻，可能既暗指生命的源头，也暗指婚姻中的生育。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהִי
  choice: 愿……蒙福
  rationale: 该祈愿式表达祝愿兼劝勉的语气；用“愿”自然保留其意愿色彩。
- source_word: מְקוֹרְךָ
  choice: 你的泉源
  rationale: מָקוֹר指泉、泉源或源头；本节延续上下文的水意象，并可能含蓄指向生命来源和婚姻中的生育。
- source_word: בָרוּךְ
  choice: 蒙福
  rationale: 直接表达“被赐福”的意义，并保留智慧文学中的宗教语感，不具体限定福分的形式。
- source_word: וּשְׂמַח
  choice: 要……欢喜
  rationale: 保留命令式劝勉的力度，同时符合现代汉语表达。
- source_word: מֵאֵשֶׁת
  choice: 因……妻子而欢喜
  rationale: 介词מִן在שׂמח之后可表示喜乐的来源或对象；“因……而欢喜”自然表达妻子是喜乐之源，同时不把原文具体化为别的关系。
- source_word: נְעוּרֶיךָ
  choice: 你年轻时所娶的
  rationale: “你幼年/青春时期的妻子”在希伯来语中指人在年轻时娶的妻子；如此翻译比直译“你青春的妻子”更符合现代汉语。
theological_decisions:
- issue: “泉源”的隐喻所指
  choice: 在正文保留“泉源”，不明确限定其所指
  alternative: 直接译为“生育能力”“婚姻”或“妻子”
  rationale: 希伯来文保留水的隐喻，语境可能同时涉及生命来源、婚姻性关系和生育；正文不应消除这种含蓄与张力。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“愿……蒙福；要……”分别呈现祈愿式和命令式。“年轻时所娶的妻子”解释了希伯来习语，但未添加再婚、忠贞年限等原文没有明说的内容。
