  text: but in the end she is bitter like wormwood[a], sharp like a two-edged sword.
translation:
  language: zh_hans
  text: 但到头来，她苦如苦艾[a]，锐利如双刃剑。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“但她的结局苦如苦艾，锐利如双刃剑。”
    reason: 保留וְאַחֲרִיתָהּ较形式对应的结构及“结局”这一语义。
lexical_decisions:
- source_word: וְאַחֲרִיתָהּ
  choice: 但到头来，她
  rationale: אַחֲרִיתָהּ直译为“她的结局/末后”，这里承接上文形成转折，并指向这女子最终带来的结果。译作“但到头来，她”在现代汉语中自然，同时保留阴性指称；脚注列出较形式对应的译法。
- source_word: מָרָה
  choice: 苦
  rationale: 这是谓语形容词，表示苦涩，也暗含最终结果令人痛苦。汉语用“苦如”简洁地保留比喻。
- source_word: כַלַּעֲנָה
  choice: 如茵陈
  rationale: לַעֲנָה指一种以苦味著称的植物，传统上常译“茵陈”。保留具体植物意象，而不抽象化为“苦毒”。
- source_word: חַדָּה
  choice: 锋利
  rationale: 该阴性形容词表示锐利、尖利，与后面的剑之比喻相配；“锋利”是自然、准确的现代汉语。
- source_word: כְּחֶרֶב פִּיּוֹת
  choice: 如双刃剑
  rationale: 字面为“像一把有刃口的剑”，复数“口/刃”构成双刃剑的惯用表达。“双刃剑”简明地传达两边开刃的形象；此处只取其锋利危险之意，不引入现代汉语中“利弊并存”的惯用含义。
