  text: and you groan at your end[b][a], when your flesh and your body are consumed.
translation:
  language: zh_hans
  text: 到你末了[b]、你的肉体和身躯都消耗殆尽的时候，你必呻吟[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “呻吟”或译“哀号”；希伯来语动词指因痛苦而发出的声音。
    reason: lexical_alternative
  - marker: b
    text: “末了”或译“最终结局”或“生命终了时”；希伯来语既可指最终的结果，也可指人生的末了。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָהַמְתָּ
  choice: 你必呻吟
  rationale: נהם表示因痛苦而发出的低沉声音。“呻吟”在现代汉语中自然地传达可听见的痛苦与懊悔之声，同时不过度强化为大声哭号。
- source_word: בְאַחֲרִיתֶךָ
  choice: 到你的结局
  rationale: אַחֲרִית既可指人生末了，也可指一条道路最终造成的结果。“结局”保留了这种时间与结果之间的含混。
- source_word: בִּכְלוֹת
  choice: 当……都耗尽时
  rationale: כלה的不定词结构表示伴随的时间或情形；用于肉体时，“耗尽”恰当地呈现逐渐衰败直至消耗殆尽的意象。
- source_word: בְּשָׂרְךָ
  choice: 你的肉体
  rationale: בשר本义为“肉、肉体”。保留具体的身体意象，也避免与后面的近义词完全合并。
- source_word: וּשְׁאֵרֶךָ
  choice: 和身躯
  rationale: שאר在此与“肉体”并列，依语境指人的身体。“身躯”既自然，又保留原文两个近义身体用语的诗性并列。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。为使条件与时间关系清楚，将“当……时”从句置于主句之前；保留“肉体”和“身躯”的近义并列，以呈现希伯来诗句对身体衰败的强调。
