base_translation:
  language: en
  yaml_path: translation/ot/proverbs/005/001.yaml
  text: My son[a], pay attention to my wisdom; incline your ear to my understanding[b],
translation:
  language: zh_hans
  text: 我儿，要留心我的智慧，侧耳听我的明辨。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “明辨”也可译作“理解力”、“悟性”或“洞察力”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנִי
  choice: 我儿
  rationale: 这是父亲或师长对男性单数“儿子”的呼语；“我儿”准确保留性别和关系，也符合现代汉语箴言式劝诫的庄重语气。
- source_word: לְחָכְמָתִי
  choice: 我的智慧
  rationale: 保留חָכְמָה的抽象名词形式；介词לְ在此标示הַקְשִׁיבָה所指向的对象，即要专心聆听的“智慧”。
- source_word: הַקְשִׁיבָה
  choice: 留心
  rationale: 该命令式表示专注地听、认真注意；“留心”在现代汉语中自然简洁，并能与下半句“侧耳听”形成平行而不显重复。
- source_word: לִתְבוּנָתִי
  choice: 我的见识
  rationale: תְּבוּנָה可指理解力、洞察力或明辨；“见识”作为教导者所传达的理解和判断较为自然，同时保留其与“智慧”相近而不完全相同的含义。
- source_word: הַט אָזְנֶךָ
  choice: 侧耳听
  rationale: 保留“使耳朵倾向”的身体意象，并以现代汉语自然表达专心聆听；希伯来文的单数“耳朵”在这一汉语惯用表达中无需明说。
theological_decisions: []
