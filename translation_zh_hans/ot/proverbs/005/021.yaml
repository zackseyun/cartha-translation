  text: כִּ֤י נֹ֨כַח עֵינֵ֣י יְ֭הוָה דַּרְכֵי אִ֑ישׁ וְֽ/כָל מַעְגְּלֹתָ֥י/ו מְפַלֵּֽס׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/005/021.yaml
  text: For a man's ways are before the eyes of Yahweh[a], and he watches all his paths.
translation:
  language: zh_hans
  text: 因为人的道路在雅威眼前；雅威衡量他一切的路径。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，说明前面警告的理由；“因为”清楚保留因果关系。
- source_word: נֹכַח עֵינֵי יְהוָה
  choice: 在雅威眼前
  rationale: 保留原文“眼前”的拟人化空间意象，表达人的行为完全显露在雅威面前。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文直接呈现神的专名，不以称号替代。
- source_word: דַּרְכֵי אִישׁ
  choice: 人所走的路
  rationale: אִישׁ在此为泛指；现代汉语用“人”自然涵盖代表性单数，同时保留“道路”这一行为与生活方式的比喻。
- source_word: מַעְגְּלֹתָיו
  choice: 那人所走的一切路径
  rationale: 用“路径”与前句“路”形成近义平行；将代词所指明确为前句泛指的人，避免汉语中“他”可能误指雅威。
- source_word: מְפַלֵּס
  choice: 衡量
  rationale: 该动词可指修平、称量或评估；此处用“衡量”保留具体比喻，并表达雅威对人行为的主动评估。
theological_decisions:
- issue: 如何译出神名 יהוה
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文使用四字神名，译作“雅威”可直接保留其专名性质，而不以称号替代。
- issue: 雅威对人的路径所做之事的性质
  choice: 衡量
  alternative: 审察
  rationale: 原文动词兼有称量、评估或修平道路的语义空间；正文保留“衡量”的意象，不把经文仅仅解释为观看，也不进一步规定审判结果。
- issue: 泛指阳性单数 אִישׁ
  choice: 人
  alternative: 一个男人
  rationale: 这里的阳性单数具有代表性、普遍性的用法；汉语“人”准确而自然，不把箴言的适用范围误限于成年男性。
translation_notes:
  register: 采用现代、庄重而易懂的汉语。两处道路词分别译作“路”和“路径”，保留希伯来诗歌的近义平行；用分号呈现两小句之间紧密的解释关系。
