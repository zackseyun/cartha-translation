  rationale: 删去首句未由原文明确标出的“都”，使“一切”专门对应第二小句的 וְכָל；将“那人所走的”简化为“他”，并重复“雅威”作第二小句主语，以提高现代汉语的自然度和指代清晰度，且不改变经文含义。
