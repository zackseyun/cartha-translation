  text: יִֽהְיוּ לְ/ךָ֥ לְ/בַדֶּ֑/ךָ וְ/אֵ֖ין לְ/זָרִ֣ים אִתָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/005/017.yaml
  text: Let them be for you alone[a], and not for strangers with you.
translation:
  language: zh_hans
  text: 愿它们只归你所有，不让外人与你一同享有。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“愿它们只属于你，不让外人与您一同分享。”本节承接上文泉源和水流的比喻，强调婚姻关系中的专一忠贞。
    reason: 说明另一种句法表达，并交代上下文比喻及其排他含义。
lexical_decisions:
- source_word: יִהְיוּ
  choice: 愿……归
  rationale: 这是 היה 的未完成式复数，在劝诫语境中带有意愿或命令色彩；“愿……归”自然表达这种劝勉语气，而非单纯将来时。
- source_word: לְךָ לְבַדֶּךָ
  choice: 单单归你
  rationale: לְךָ 可表达归属或受益，לְבַדֶּךָ 强调独有；合译为“单单归你”，既保留排他性，也符合现代汉语表达。
- source_word: וְאֵין לְזָרִים אִתָּךְ
  choice: 不与外人共享
  rationale: 希伯来语直译近似“没有给外人与同你一起”；结合上文泉源、水流的比喻，此处表达不可让婚姻关系之外的人共同享有。“外人”避免误解为族裔意义的外国人，“共享”明确关联 אִתָּךְ 的共同参与含义。
theological_decisions:
- issue: 本节比喻所指及婚姻排他性
  choice: 正文保留复数代词“它们”，并用“共享”表达排他关系；脚注说明其承接上文泉源、水流的比喻并强调婚姻忠贞。
  alternative: 直接释义为“你的爱情只归你自己，不可让外人分享”。
  rationale: 原文没有在本节明说“爱情”或“婚姻”，直接补入会消除比喻张力；保留“它们”更忠实于上下文衔接，脚注则帮助普通读者理解其伦理指向。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“单单归你”简洁保留原文的归属与排他意味；“外人”指婚姻关系之外的人，并非特指外国人。
