  text: שְׁתֵה מַ֥יִם מִ/בּוֹרֶ֑/ךָ וְ֝/נֹזְלִ֗ים מִ/תּ֥וֹךְ בְּאֵרֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/005/015.yaml
  text: Drink water from your own cistern[a], and flowing water from your own well.
translation:
  language: zh_hans
  text: 你要喝自己蓄水池里的水，也要喝从自己井中流出的水。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“以及从你自己井的里面流出来的。”希伯来文这里用的是“流出”的分词，并未再次明说“水”。
    reason: 词汇与句法异译
lexical_decisions:
- source_word: שְׁתֵה
  choice: 要喝
  rationale: 这是שׁתה的Qal命令式、第二人称阳性单数；“要喝”以自然、庄重的现代汉语保留直接劝诫的语气。
- source_word: מַיִם
  choice: 水
  rationale: 常用名词，意为“水”；汉语用“水”即可自然表达。
- source_word: מִבּוֹרֶךָ
  choice: 你自己水池里的水
  rationale: בּוֹר可指坑或蓄水池；在与“井”平行的家庭水源意象中，“水池”比“坑”更准确自然。“你自己”体现第二人称所有格，并传达上下文中的专属性。
- source_word: וְנֹזְלִים
  choice: 也要喝……流出的水
  rationale: נזל的分词表示“流出、流淌”；本句与前半句的“水”构成省略式平行，汉语补出“水”和承前的“喝”，使句意自然清楚，同时在脚注保留较字面的理解。
- source_word: מִתּוֹךְ
  choice: 中
  rationale: תּוֹךְ表示内部或当中；“井中流出的”自然保留水从井内而出的来源意象。
- source_word: בְּאֵרֶךָ
  choice: 你自己的井
  rationale: בְּאֵר通常指“井”。保留具体水源意象，不在正文中直接解释为妻子；“你自己”体现所有格和语境强调的专属性。
theological_decisions:
- issue: 是否在正文中明说婚姻与性忠贞的比喻含义
  choice: 保留水池、井和水的具体意象
  alternative: 释义为“要以自己的妻子为满足”等
  rationale: 希伯来文有意使用水源意象，其婚姻方面的应用由上下文显明。若在正文中直接改写为妻子，就会把解释写进译文，并削弱原句的文学张力。
- issue: 是否把וְנֹזְלִים明确处理为“流出的水”
  choice: 在正文补出“水”，并用脚注说明较字面的译法
  alternative: 译为“以及从你自己的井中流出的”而不补名词
  rationale: 希伯来分词在平行结构中有所省略，可承接前面的“水”。汉语正文补出“水”更通顺，但脚注保留不补名词的形式，以呈现原文的语法开放性。
translation_notes:
  register: 采用现代、易懂而庄重的劝诫语体。正文保留希伯来诗歌的两行平行意象；重复“你自己”以体现两个第二人称所有格及语境中的专属性。
