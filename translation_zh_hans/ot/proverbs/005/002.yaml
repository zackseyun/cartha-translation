  text: so that you may keep discretion[b][a], and your lips may guard knowledge.
translation:
  language: zh_hans
  text: 为使你持守审慎[a]，使你的嘴唇保守知识[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “审慎”或译“明辨力”或“明智的判断”。
    reason: lexical_alternative
  - marker: b
    text: 直译“你的嘴唇”。“嘴唇”可借指人的言语，含有保守或表达知识之意。
    reason: lexical_alternative
lexical_decisions:
- source_word: לִשְׁמֹר
  choice: 使你持守
  rationale: לִ־加不定式在上下文中表达目的；“使你持守”承接前一节的劝诫，并保留שׁמר“持守、看守”的含义。
- source_word: מְזִמּוֹת
  choice: 明辨力
  rationale: 该词在《箴言》的正面智慧语境中指审慎思考、明智判断的能力，而非负面的“计谋”；“明辨力”自然且能体现这种实践性的审慎。
- source_word: וְדַעַת
  choice: 知识
  rationale: דעת在《箴言》中常指由智慧而来的道德与实践知识；直译为“知识”可保留其稳定的词汇联系，不将其扩大解释为“悟性”。
- source_word: שְׂפָתֶיךָ
  choice: 你的嘴唇
  rationale: 保留希伯来文具体的身体意象；此处“嘴唇”借指言语，却不必在正文中将诗意形象抽象化。
- source_word: יִנְצֹרוּ
  choice: 守护
  rationale: נצר有看守、保存之意；“守护”既呈现保护意味，也与前面的“持守”适度区分。与目的结构相连时，中文用“使……守护”自然表达其目的或结果色彩。
theological_decisions: []
