  text: He dies for lack of discipline[a], and in the abundance of his folly he goes astray.
translation:
  language: zh_hans
  text: 他因缺少管教而死[a]；因自己的愚妄深重而误入歧途。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他必在没有管教的情况下死去；因自己的愚妄深重而误入歧途。”
    reason: 保留未完成式可按将来或必然结果理解的可能；בְּאֵין亦可译为“在没有……的情况下”，不指定是否有管教者。
lexical_decisions:
- source_word: יָמוּת
  choice: 死
  rationale: 该词为מות的Qal未完成式第三人称阳性单数；在智慧文学中可表达一般性或必然的结局。汉语用“死”自然呈现这种确定结果。
- source_word: בְּאֵין
  choice: 因缺少
  rationale: 介词ב与אֵין结合，既可表示“在没有……的情况下”，也可带出原因；“因缺少”在本句中自然表达其因果意味。
- source_word: מוּסָר
  choice: 管教
  rationale: 该词在《箴言》中常指带有纠正和塑造作用的教导；“管教”比单纯的“教导”更能保留其道德塑造力。
- source_word: וּבְרֹב
  choice: 如此深重
  rationale: רֹב表示众多、丰盛或程度之大；与“愚妄”搭配时，“如此深重”以自然汉语传达其程度和分量。
- source_word: אִוַּלְתּוֹ
  choice: 他的愚妄
  rationale: 该词是智慧文学中带有道德意味的核心概念；“愚妄”比“愚蠢”更庄重，也更能表达悖逆正道的意味。
- source_word: יִשְׁגֶּה
  choice: 走入迷途
  rationale: שׁגה可指走迷、偏离或犯错；“走入迷途”保留其道德偏离的图景，而不限定为醉酒踉跄等具体含义。
- source_word: הוּא
  choice: 他
  rationale: 显明的第三人称代词强调前文所说的那个人；汉语以“他”自然承接上下文。
