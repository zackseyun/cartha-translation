base_translation:
  language: en
  yaml_path: translation/ot/proverbs/005/003.yaml
  text: For the lips of a forbidden woman drip honey[b][a], and her palate is smoother than oil.
translation:
  language: zh_hans
  text: 因为不该亲近的女人[a]嘴唇滴下蜂蜜，她的口[b]比油更滑。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“陌生女子”“外族女子”或“淫妇”。希伯来语这个词在《箴言》中常指正当婚姻或性关系界限之外的女人。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语直译为“她的上膛”；此处可转指她的口或言语。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文劝诫，说明必须留心智慧之言的缘由；“因为”自然保留其解释关系。
- source_word: נֹפֶת תִּטֹּפְנָה
  choice: 滴蜜
  rationale: 名词指蜂蜜或蜂房中流出的蜜，动词表示滴下；合译为“滴蜜”既简洁，又保留诱人的感官比喻。
- source_word: שִׂפְתֵי
  choice: 嘴唇
  rationale: 按构词关系译出“那女人的嘴唇”，保留原文身体意象。
- source_word: זָרָה
  choice: 不该亲近的女人
  rationale: 该词本义可指陌生、外来的女人，但在《箴言》的语境中通常指处于正当婚姻或性关系界限之外的女人。此译传达禁忌关系，同时不武断限定她必为已婚的淫妇或外族女子。
- source_word: וְחָלָק מִשֶּׁמֶן
  choice: 比油更滑润
  rationale: מִן在此表示比较；“滑润”保留油的触感意象，也能暗示言辞圆滑诱人，而不直接把比喻解释掉。
- source_word: חִכָּהּ
  choice: 她的口舌
  rationale: 原词直指上膛，也可转喻口中所出的言语。“口舌”在现代汉语中既保留身体意象，又能自然指向她诱人的话语。
theological_decisions:
- issue: זָרָה在《箴言》智慧语境中的所指
  choice: 不该亲近的女人
  alternative: 陌生女子／外族女子／淫妇
  rationale: 原词保有“陌生、外来”的词义，同时上下文赋予其越过正当性关系界限的道德含义。正文采用较宽而有警戒力的表达，脚注保留其他可能译法，避免把族群意义或已婚通奸身份强加给经文。
- issue: חִכָּהּ是身体部位还是言语的转喻
  choice: 口舌
  alternative: 上膛／言语
  rationale: 原文以身体部位描写诱惑性的言谈。“口舌”兼顾字面意象与转喻功能；脚注说明严格字义，以免掩盖原文措辞。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“不该亲近的女人”避免生硬的“外女”，也不把语义过早收窄为“淫妇”；“滴蜜”“比油更滑润”保留原文平行的感官比喻。
