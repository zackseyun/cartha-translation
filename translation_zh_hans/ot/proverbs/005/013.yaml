  text: and I did not listen to the voice of my instructors[a], nor did I incline my ear to my teachers.
translation:
  language: zh_hans
  text: 我没有听训导我的人的话[a]，也没有侧耳听老师的教导。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我没有听从训导我的人的话。”这里的希伯来语动词在智慧文学语境中可指聆听、留心，也可含听从或遵从之意。
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַעְתִּי בְּקוֹל
  choice: 听从……的话
  rationale: שׁמע בקול在智慧文学语境中不仅指听见，也常指留心并服从。“听从……的话”是自然的现代汉语，同时保留“听”与顺从之间的语义张力。
- source_word: מוֹרָי
  choice: 教导我的人
  rationale: 该词源于ירה，指施行教导者。译作“教导我的人”，既准确自然，也与后句מְלַמְּדַי的“老师”略作区分。
- source_word: מְלַמְּדַי
  choice: 我的老师
  rationale: 该词源于למד，意为教导；“我的老师”直接表达复数施教者及第一人称所属关系。现代汉语中“老师”本身不标示单复数，语境可涵盖多人。
- source_word: הִטִּיתִי אָזְנִי
  choice: 侧耳听
  rationale: 直译意象为“使我的耳朵倾斜”，表示专心聆听。“侧耳听”保留希伯来语身体意象，又符合现代汉语表达。
- source_word: וְ...וְלֹא
  choice: 没有……也没有
  rationale: 原文并列两个否定分句；汉语以“没有……也没有”自然呈现持续的否定关系。
