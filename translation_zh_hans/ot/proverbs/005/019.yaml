base_translation:
  language: en
  yaml_path: translation/ot/proverbs/005/019.yaml
  text: a loving doe[a], a graceful mountain goat—may her breasts satisfy you at all times[b]; be intoxicated always with her love.
translation:
  language: zh_hans
  text: 她是可爱的母鹿，是优美的野山羊[a]；愿她的双乳时时使你满足，愿你常常陶醉在她的爱中[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “野山羊”也可译作“羱羊”，指生活在山地的野生山羊。
    reason: lexical_alternative
  - marker: b
    text: “陶醉”所译的希伯来语动词通常可指“走迷、偏离”；这里用来正面描述人因妻子的爱而忘情。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַיֶּלֶת אֲהָבִים
  choice: 可爱的母鹿
  rationale: אַיֶּלֶת指母鹿；אֲהָבִים在此修饰其可爱、可亲的特质。译文保留动物比喻和婚姻情爱语境，并采用自然的现代汉语。
- source_word: וְיַעֲלַת חֵן
  choice: 优美的野山羊
  rationale: יַעֲלָה指栖居山地的野山羊或羱羊，חֵן表达秀美、可爱、迷人的特质。“优美的野山羊”既便于普通读者理解，也保留与“母鹿”平行的诗歌意象。
- source_word: דַּדֶּיהָ
  choice: 她的双乳
  rationale: 该词明确指女性乳房；上下文赞美婚姻中的性爱之乐，因此不作委婉淡化。“双乳”准确而符合庄重的诗体表达。
- source_word: יְרַוֻּךָ
  choice: 使你满足
  rationale: רוה的基本意象是充分饮足、饱享，引申为得到充分满足。在此以双乳为主语，译作“使你满足”自然传达感官与情爱上的充盈。
- source_word: בְכָל־עֵת
  choice: 时时
  rationale: 直指每一时刻、任何时候；“时时”简洁地保留持续性的时间意义和诗句节奏。
- source_word: בְאַהֲבָתָהּ
  choice: 在她的爱中
  rationale: 介词ב可表达处于某种状态或范围之中；此译法自然地聚焦于妻子的爱，且不过度限定为单纯的性欲。
- source_word: תִּשְׁגֶּה
  choice: 陶醉
  rationale: שׁגה通常可指迷失、走偏，此处却在正面语境中表达因爱而忘情、被深深吸引。“陶醉”保留其失却常态般的强烈意味，同时符合现代汉语。
- source_word: תָמִיד
  choice: 常常
  rationale: 表达持续、不断；“常常”与前句“时时”形成自然对应。
theological_decisions:
- issue: 智慧文学中的婚姻性爱意象
  choice: 保留“双乳”等明确的婚姻性爱描写，不作委婉弱化。
  alternative: 译作“胸怀”“温存”等较含蓄的措辞。
  rationale: 本节在箴言第五章的语境中劝人专一享受妻子所带来的婚姻之乐，以此与奸淫形成对照。保留希伯来文本的具体性，避免把原文没有的避讳带入译文。
- issue: שׁגה在正面情爱语境中的张力
  choice: 正文译作“陶醉”，脚注说明其通常可指“走迷、偏离”。
  alternative: 正文直译为“走迷”或解释性地译作“神魂颠倒”。
  rationale: “陶醉”传达被爱情强烈吸引的正面语用，同时脚注保留该动词通常具有的负面词义及此处带来的修辞张力，不把歧义完全抹平。
translation_notes:
  register: 采用现代、清楚而庄重的普通话。句式保持希伯来诗歌的两个平行动物意象，并明确保留婚姻情爱内容；“双乳”准确直接但不粗俗。“时时／常常”形成节奏呼应。
