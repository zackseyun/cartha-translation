base_translation:
  language: en
  yaml_path: translation/ot/proverbs/005/016.yaml
  text: Should your springs be scattered abroad[b][a], streams of water in the streets?
translation:
  language: zh_hans
  text: 你的泉源岂可向外流散[a][b]，成为街上的水流？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本句也可较形式化地译为：“让你的泉源向外流散，成为街上的水流。”希伯来语形式本身容许这种读法，但上下文更支持把它理解为反问。
    reason: alternative_reading
  - marker: b
    text: 在箴言5:15—18有关婚姻忠贞的语境中，泉源和水流比喻男子的性活力，也可能包含其后代。
    reason: cross_reference
lexical_decisions:
- source_word: יָפ֣וּצוּ
  choice: 岂可流散
  rationale: פוץ在此表示分散、散布。希伯来语形式本身可作陈述或祈使理解，但结合上下文，以反问“岂可……”最能表达劝诫语气，同时保留“流”与水的意象。
- source_word: מַעְיְנֹתֶיךָ
  choice: 你的泉源
  rationale: מַעְיָן指泉源、泉水；“泉源”自然庄重，并保留上下文中有关婚姻忠贞的水意象。
- source_word: חוּצָה
  choice: 在外
  rationale: 该词表示向外、在外，与后半句的公共街道形成从私人领域流向外界的图景。
- source_word: בָּרְחֹבוֹת
  choice: 在街上
  rationale: רְחֹבוֹת可指宽阔的公共场所、街道或广场；“街上”在现代汉语中清楚自然，并突出公开空间。
- source_word: פַּלְגֵי מָיִם
  choice: 你的水流
  rationale: פַּלְגֵי מָיִם可指水流、水道或溪流。译作“水流”保留水的诗歌意象，并与上半句“泉源”构成自然平行；补出“你的”是依据平行结构作出的汉语表达。
theological_decisions:
- issue: 本节应译为陈述、祈使，还是反问
  choice: 译作反问：“你的泉源岂可……？”
  alternative: 较形式化地译作祈使或愿望句：“让你的泉源流散在外，水流淌在街上。”也可按形式译为陈述句。
  rationale: 希伯来语动词形式容许非疑问理解，但5:15—17劝人专一享受婚姻中的亲密关系，尤其第17节强调不可与外人共享。因此，反问最符合语境，也不需增添原文没有的解释性内容。
- issue: 水意象所指为何
  choice: 正文保留泉源与水流的隐喻，不在正文中直说性能力或后代
  alternative: 在正文中将意象解释为男性的性能力、精力或后代
  rationale: 上下文使该意象与婚姻忠贞、性亲密及可能的后代相关，但具体指向具有一定开放性。保留隐喻可避免把含义过早限定为单一解释。
translation_notes:
  register: 采用现代、清楚而庄重的普通话。“岂可”略带智慧文学的劝诫色彩，但仍为当代读者易懂；两小句采用平行反问，以重现希伯来诗歌结构。脚注标记均置于正文相关意象之后。
