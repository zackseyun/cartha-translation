  text: וְֽ/אָמַרְתָּ֗ אֵ֭יךְ שָׂנֵ֣אתִי מוּסָ֑ר וְ֝/תוֹכַ֗חַת נָאַ֥ץ לִבִּֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/005/012.yaml
  text: and you say[a], “How I hated discipline[b], and my heart despised reproof!”
translation:
  language: zh_hans
  text: 你就会说[a]：“我多么恨恶管教，我的心多么藐视责备[b]！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你就说”。希伯来语完成式在父亲的警告中可以表达将来的结果，也可以把那悔叹生动地呈现在眼前。
    reason: lexical_alternative
  - marker: b
    text: “责备”也可译作“劝戒”或“纠正”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתָּ
  choice: 你就会说
  rationale: 该形式为带连接词的第二人称阳性单数完成式；在父亲警告的后果性语境中，宜表达将来结果。“就会说”既保留直接称呼，也自然呈现随后发出的悔叹。
- source_word: אֵיךְ
  choice: 多么
  rationale: 这里引出感叹和悔恨，并非询问信息；汉语用“多么”能自然保留强烈的感叹语气。
- source_word: שָׂנֵאתִי
  choice: 我……恨恶
  rationale: 第一人称单数完成式表达回顾性的承认；“恨恶”准确传达强烈厌弃，也符合箴言的庄重语体。
- source_word: מוּסָר
  choice: 管教
  rationale: 此词在箴言中兼具教导、训练和纠正的含义；“管教”在现代汉语中较好保留其塑造性与纠正性。
- source_word: וְתוֹכַחַת
  choice: 责备
  rationale: 指以言语指出错误并加以纠正；“责备”通顺易懂，也与“管教”形成平行而不完全重复。
- source_word: נָאַץ
  choice: 藐视
  rationale: 该动词表示带着轻蔑加以拒斥；“藐视”保留其强烈的鄙弃意味，并与“恨恶”构成诗性平行。
- source_word: לִבִּי
  choice: 我的心
  rationale: 保留希伯来语“心”作为思想、意志和内在自我的表达，避免简化为单纯的“我”，并维持诗歌形象。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的智慧文学语体。以两个“多么”再现希伯来语 אֵיךְ 对两个平行分句的感叹作用；保留“我的心”这一希伯来诗歌表达。
