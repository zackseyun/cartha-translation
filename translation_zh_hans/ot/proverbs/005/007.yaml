  text: וְ/עַתָּ֣ה בָ֭נִים שִׁמְעוּ לִ֑/י וְ/אַל תָּ֝ס֗וּרוּ מֵ/אִמְרֵי פִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/005/007.yaml
  text: And now[a], sons, listen to me, and do not turn aside from the words of my mouth.
translation:
  language: zh_hans
  text: 现在，儿子们啊[a]，要听我；不可偏离我口中的话。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“孩子们”。希伯来文为阳性复数，直译为“儿子们”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: 现在
  rationale: 该词组由连接词与时间副词构成，在此标示劝诫的转折和推进。汉语用“现在”自然地表达这一话语枢纽；若译作“而现在”则较生硬。
- source_word: בָנִים
  choice: 众子啊
  rationale: 原文为阳性复数“儿子们／众子”，没有“我的”这一物主成分。“众子啊”保留其男性复数形式及智慧文学中师者对受教者的称呼语气。
- source_word: שִׁמְעוּ לִי
  choice: 要听我
  rationale: שׁמע与ל连用表示听从、留心听；“要听我”既自然，又保留从聆听到顺从之间的语义张力，未直接强化为“服从我”。
- source_word: וְאַל תָּסוּרוּ
  choice: 不可偏离
  rationale: סור表示转开、离开或偏离；“偏离”保留智慧文学中道路的隐喻。וְאַל连接第二项禁令，汉语以“不可”简洁表达。
- source_word: מֵאִמְרֵי פִי
  choice: 我口中的话
  rationale: 直译为“我口里的言语”。“我口中的话”保留原文身体意象和庄重感，同时符合现代汉语表达。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的劝诫语体。“众子啊”略带典雅色彩，以保留原文直接呼语及阳性复数；全句不增添原文没有的“我的”。脚注标记置于整节末尾，对称呼语的另一译法作说明。
