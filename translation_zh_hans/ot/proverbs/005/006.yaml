  text: אֹ֣רַח חַ֭יִּים פֶּן תְּפַלֵּ֑ס נָע֥וּ מַ֝עְגְּלֹתֶ֗י/הָ לֹ֣א תֵדָֽע־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/005/006.yaml
  text: Lest she should level the path of life[a], her tracks wander[b]; she does not know it.
translation:
  language: zh_hans
  text: 免得她把生命之路修平[a]，她的路径游移不定[b]；她并不知道。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 末句也可译作“你并不知道”，即把它理解为对听者说的话，而不是继续描述那女子。
    reason: alternative_reading
  - marker: b
    text: 本节希伯来文十分凝练，也可译作：“免得你思量生命之路；她的路径游移不定。”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹרַח חַיִּים
  choice: 生命的道路
  rationale: אֹרַח 指道路、路径，חַיִּים 指生命；“生命的道路”保留具体的道路意象，也符合现代汉语表达。
- source_word: פֶּן
  choice: 免得
  rationale: פֶּן 常引出要防止的结果或否定目的；“免得”简洁地保留箴言警戒性的语气。
- source_word: תְּפַלֵּס
  choice: 修平
  rationale: פלס 的 Piel 形可表示修平、使平直，也可理解为衡量、思量。此处与道路意象相连，译作“修平”可直接保留该隐喻，同时在脚注交代另一种理解。
- source_word: נָעוּ
  choice: 飘忽不定
  rationale: 该动词表达摇摆、游移或不稳定。“飘忽不定”自然呈现她行径的不稳定，同时维持路径隐喻。
- source_word: מַעְגְּלֹתֶיהָ
  choice: 她的路径
  rationale: מַעְגָּל 指路径、轨迹；“路径”清楚自然，并与前句“道路”形成适度的词语变化。
- source_word: לֹא תֵדָע
  choice: 她自己也不知道
  rationale: 按马所拉读法及上下文，以第三人称阴性为主语，继续描述前文的女子；“自己也”使汉语指向清楚，但不具体补出她所不知道的内容。
theological_decisions:
- issue: 末句主语所指
  choice: 继续描述那女子：“她自己也不知道”
  alternative: 转而对听者说：“你也不知道”
  rationale: 上下文第3—6节持续以第三人称阴性描述那女子，因此采用“她”最能保持语流；但希伯来文本传统及句法容许不同理解，故在脚注保留“你”的读法。
- issue: תְּפַלֵּס 的语义与句法关系
  choice: 理解为“修平”，并让 פֶּן 引出“免得她修平生命的道路”
  alternative: 理解为“思量”，译作“免得你思量生命的道路；她的路径飘忽不定”
  rationale: “修平”与本节连续的道路、路径意象紧密相连；然而原文高度凝练，动词也可有“衡量、思量”之义，且主语可作不同分析，因此不在正文中强行消除歧义，而以脚注保留另一译法。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。正文尽量保留原文“道路—路径”的连续意象及紧凑警戒语气；用脚注呈现主语和 פלס 词义上的真实歧义。
