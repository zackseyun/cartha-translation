  yaml_path: translation/ot/proverbs/005/009.yaml
  text: lest you give your honor to others[b][a], and your years to the cruel one.
translation:
  language: zh_hans
  text: 免得你把自己的尊荣[a]交给别人，把自己的年岁交给残酷的人[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “尊荣”也可译作“荣美”或“精力”。
    reason: lexical_alternative
  - marker: b
    text: “残酷的人”也可译作“残酷者”或“无情者”。
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּן
  choice: 免得
  rationale: 引出应当避免的不良后果，保留智慧文学中简洁而警戒性的语气。
- source_word: תִּתֵּן
  choice: 给了／交给
  rationale: 基本义为“给”。前半句直译为“给了”，后半句用自然汉语“交给”表达落入他人掌控的语境含义，而不加强为原文未明说的“断送”。
- source_word: לַאֲחֵרִים
  choice: 给了别人
  rationale: 原文是复数，意为“其他人、别人”；不限定为外族人或陌生人。
- source_word: הוֹדֶךָ
  choice: 你的尊荣
  rationale: הוֹד 可指尊荣、荣美、威荣或精力；此处“尊荣”兼顾个人尊严与荣耀的丧失，同时以脚注保留其他可能。
- source_word: וּשְׁנֹתֶיךָ
  choice: 你的年岁
  rationale: 忠实保留原文“你的年岁”的简洁表达；在上下文中可涵盖人生岁月或盛年。
- source_word: לְאַכְזָרִי
  choice: 给残酷的人
  rationale: 形容词在此名词化，单数且未明说性别；“残酷的人”在现代汉语中自然，并保留所指对象并不明确的特点。
theological_decisions:
- issue: “残酷的人”的具体所指
  choice: 不具体指认为某一人物或制度
  alternative: 解释为奸妇的丈夫、剥削者或某种惩罚权力
  rationale: 本节原文本身只用名词化形容词“残酷的”，没有明确身份；译文应保留这种开放性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“免得……把……”保持箴言的警戒语势；两处“自己的”强化汉语领属关系，但不增加新的语义。所有脚注标记均已置于正文相应词语之后。
