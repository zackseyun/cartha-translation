  text: פֶּֽן יִשְׂבְּע֣וּ זָרִ֣ים כֹּחֶ֑/ךָ וַ֝/עֲצָבֶ֗י/ךָ בְּ/בֵ֣ית נָכְרִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/005/010.yaml
  text: lest strangers be filled with your strength[b][a], and your labors go to the house of a foreigner.
translation:
  language: zh_hans
  text: 免得外人因你的力量得饱足[a]，你的劳苦归入外人的家中[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “得饱足”也可译作“得满足”或“得享饱足”。“力量”可指力量、活力、能力，或由此而来的资源。
    reason: lexical_alternative
  - marker: b
    text: “劳苦”也可指劳苦的成果，即辛劳所得或辛苦积攒的财富。
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּן
  choice: 免得
  rationale: 引出应当避免的不良后果，简洁保留箴言的警戒语气。
- source_word: יִשְׂבְּעוּ
  choice: 耗尽
  rationale: 该动词本义为“吃饱、满足”；与“精力”搭配时，直译“饱足于”在现代汉语中不自然。“耗尽”从受劝者的角度表达外人从其力量得饱足的结果，正文脚注保留原文意象。
- source_word: זָרִים
  choice: 外人
  rationale: 指自身家庭或应有关系范围之外的人；“外人”自然且不必限定为不同国籍者。
- source_word: כֹּחֶךָ
  choice: 你的精力
  rationale: כח表示力量、能力或活力；本段涉及因不忠而损失一生资源，“精力”既保留人的力量，也容许其生产能力和资源层面的含义。
- source_word: וַעֲצָבֶיךָ
  choice: 你辛劳所得的
  rationale: 该复数名词可指劳苦，也可转指劳苦所得；因谓语所表达的是进入他人家中的结果，采用“辛劳所得的”在汉语中更通顺，同时保留词义上的开放性。
- source_word: בְּבֵית
  choice: 落入……家中
  rationale: 原文只有介词“在”与“家”，没有明说移动；上下句平行所描绘的是资源归于他人家庭。“落入”自然表达这一结果，但不增添主动赠予之意。
- source_word: נָכְרִי
  choice: 陌生人
  rationale: נכרי指外来者或不属于自身群体的人。译作“陌生人”与前句“外人”形成近义变化，并避免把含义过窄地限定为外国国籍。
