base_translation:
  language: en
  yaml_path: translation/ot/proverbs/005/022.yaml
  text: His iniquities will capture the wicked man[b][a], and he will be held fast in the cords of his sin.
translation:
  language: zh_hans
  text: 恶人必被自己的罪孽捉住；他必被自己罪恶的绳索缠住。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַוּוֹנוֹתָיו
  choice: 自己的罪孽
  rationale: 复数名词表示恶人所犯的种种罪孽；“罪孽”保留其道德分量，“自己的”清楚呈现原文第三人称所属关系及恶果反噬自身的意象。
- source_word: יִלְכְּדֻנוֹ
  choice: 必被……捉住
  rationale: לכד意为捕捉、擒获。按汉语自然语序改用被动式，保留恶人遭自己的罪孽捕获的鲜明图像。
- source_word: הָרָשָׁע
  choice: 恶人
  rationale: 原文为阳性单数、作名词使用；现代汉语“恶人”自然简洁，也能保留智慧文学中代表性的单数人物形象。
- source_word: וּבְחַבְלֵי
  choice: 也必被……绳索
  rationale: חֶבֶל可指绳、索；“绳索”与前句捕捉的意象协调，并为后面的受困状态提供具体图景。
- source_word: חַטָּאתוֹ
  choice: 自己罪的
  rationale: 原文为单数，可作集合或抽象意义理解；保留单数“罪”，不与前句复数“罪孽”混同。
- source_word: יִתָּמֵךְ
  choice: 缠住
  rationale: 此处为被动形态，结合“罪的绳索”及平行句，表示被牢牢制住。“缠住”是自然汉语，并保留受困、无法脱身的意象。
theological_decisions:
- issue: 人的道德行为及其后果的意象
  choice: 恶人被自己的罪孽捉住，并被自己的罪所形成的绳索缠住
  alternative: 泛化为恶行自然带来不良后果，而弱化捕捉和捆缚的拟人意象
  rationale: 原文以“捉住”和“绳索”并列，强调使恶人受困的正是他自己的罪。译文保留这种道德因果关系，但不进一步规定其审判机制或决定论含义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。两次使用“自己”强化原文所属代词所表达的反身性；“捉住／缠住”保持平行的捕获与束缚意象。无需脚注，因为“恶人”在汉语中自然表达原文阳性单数的实体化形容词，而“绳索”已涵盖该词在本节中的适切语义。
