  text: I was almost in every kind of evil in the midst of the assembly and congregation[a].
translation:
  language: zh_hans
  text: 我在会众和群体当中，几乎陷于万般恶境。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我几乎陷于万般恶事”或“我几乎到了彻底毁灭的地步”。希伯来语的表达十分凝练；“恶”可指道德上的恶，也可指灾祸或毁灭。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּמְעַט
  choice: 几乎
  rationale: 与הָיִיתִי连用表示接近某种境地，而非持续时间；“几乎”自然保留了这种临近之意。
- source_word: הָיִיתִי
  choice: 陷入了
  rationale: 希伯来文直译为“我曾是/我曾处于”；结合介词短语，汉语用“陷入了”更自然地表达说话者回顾自己险些落入某种境地，同时不把结果说成已经完全发生。
- source_word: בְכָל רָע
  choice: 各种祸患
  rationale: רָע可指道德上的恶，也可指灾祸、毁灭；本节语境涉及公开蒙羞和灾难性后果。“各种祸患”保留其广泛性，并由脚注说明“万般恶事/彻底毁灭”等可能理解。
- source_word: בְּתוֹךְ
  choice: 就在……当中
  rationale: 保留“在……中间”的空间及公开意味；“就在”也自然凸显事情发生于公众群体之中。
- source_word: קָהָל
  choice: 会众
  rationale: 指正式聚集的群体；“会众”在现代中文中庄重且易懂。
- source_word: וְעֵדָה
  choice: 和集会
  rationale: 保留原文两个近义群体名词的并列，不将其合并；“集会”侧重聚集场合，与“会众”形成自然搭配。
theological_decisions:
- issue: בְכָל רָע所指是道德之恶还是灾难性毁灭
  choice: 正文译为“各种祸患”，侧重所遭遇的灾祸，同时保留范围广泛的表达
  alternative: “万般恶事”或“彻底毁灭”
  rationale: 原文高度凝练，רָע可兼有道德恶与灾祸之义。上下文既是道德警戒，也描述败坏的后果；因此不宜把歧义彻底消解，正文采用自然而较开放的译法，并在脚注列出其他可能。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“我几乎陷入了”表达险些落入某种境地；“会众和集会”保留原文近义词并列及公开场合的意味。
