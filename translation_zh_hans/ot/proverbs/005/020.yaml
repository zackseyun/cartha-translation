  text: וְ/לָ֤/מָּה תִשְׁגֶּ֣ה בְנִ֣/י בְ/זָרָ֑ה וּ֝/תְחַבֵּ֗ק חֵ֣ק נָכְרִיָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/005/020.yaml
  text: Why[a], my son[b], should you go astray with a strange woman and embrace the bosom of a foreign woman?
translation:
  language: zh_hans
  text: 我儿，你为什么要迷恋[a]别的女人[b]，搂抱外来的女子[c]的胸怀[d]呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “迷恋”所译的希伯来词也可表示“走迷、偏离正道”；在本章语境中还可能含有沉醉、痴迷的意味。
    reason: lexical_ambiguity
  - marker: b
    text: “别的女人”指正当婚姻关系之外的女子；原文也可直译为“陌生女子”。
    reason: lexical_alternative
  - marker: c
    text: “外来的女子”原文指外人或不属自己群体的女子。这里的重点是关系与道德上的越界，不一定是指外族女子。
    reason: contextual_clarification
  - marker: d
    text: “胸怀”所译的希伯来词可指胸前、怀中，也可指膝上。
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָה
  choice: 为什么要
  rationale: 这是带有劝诫意味的反问；“为什么要”在现代汉语中自然传达“为何竟要如此”的语气。
- source_word: תִשְׁגֶּה
  choice: 迷恋
  rationale: שׁגה可指偏离、迷失，也可在本章语境中带有陶醉或痴迷的意味。“迷恋”承接5:19的爱情语境，同时不把此处单限定为醉酒意象；脚注保留其“走迷、偏离”的可能。
- source_word: בְנִי
  choice: 我儿
  rationale: 保留第一人称单数所属后缀，并维持《箴言》中父亲教导儿子的称呼框架。
- source_word: זָרָה
  choice: 别的女人
  rationale: 此词在《箴言》的警戒语境中指在正当婚姻或亲密关系之外的女子。“别的女人”是自然的现代汉语，也避免把重点误解为种族或国籍。
- source_word: תְחַבֵּק
  choice: 搂抱
  rationale: 准确表达חבק亲密拥抱、环抱的动作，比一般的“拥抱”更能配合下文具体的身体意象。
- source_word: חֵק
  choice: 胸怀
  rationale: חֵק可指胸前或怀中，也可指膝上。“胸怀”保留亲密搂抱的身体意象和诗体语气，脚注说明另一可能。
- source_word: נָכְרִיָּה
  choice: 外来女子
  rationale: 保留其“外人、外来的女子”这一基本词义，并与זָרָה的译法有所区别；脚注说明本节重点是关系和道德上的界外身份，并非单纯指外族。
theological_decisions:
- issue: 如何处理זָרָה与נָכְרִיָּה这一对近义平行词
  choice: 分别译为“别的女人”和“外来女子”
  alternative: 两者都译作“淫妇”，或分别译作“陌生女子”和“外国女子”
  rationale: 经文警告的是越出正当婚姻关系的性亲密，而不是针对某个族群。“别的女人”清楚传达关系上的越界；“外来女子”则保留第二个希伯来词的“外人”色彩和诗句的词汇变化。脚注防止读者将其仅理解为地域或族裔身份。
- issue: תִשְׁגֶּה在本章中是“走迷”还是“陶醉”
  choice: 正文译作“迷恋”，脚注保留“偏离正道”的双重意味
  alternative: 译作“走迷”或“陶醉”
  rationale: 同一词根在紧邻的5:19可带陶醉意味，而此处也有道德偏离的含义。“迷恋”能在汉语中兼顾受吸引、陷入其中的语感，但不应抹去“走迷”的词义张力，因此以脚注说明。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“我儿”保留智慧文学的教导口吻；全句以“为什么要……呢”呈现劝诫性的反问。正文避免生硬的“外女”和容易造成族裔误读的“外国女子”，同时借脚注保存原文两个近义词之间的差别及其含混性。
