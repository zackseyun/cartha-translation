  yaml_path: translation/ot/proverbs/005/008.yaml
  text: Keep your way far from her[a], and do not go near the entrance of her house.
translation:
  language: zh_hans
  text: 要让你所走的路远离她[a]；不可走近她家的门口。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你要远离她，不可接近她家的门口。”
    reason: 词汇与句法上的另一种自然表达；可将命令理解为直接要求听者远离她，而不突出“你的道路”这一意象。
lexical_decisions:
- source_word: הַרְחֵק
  choice: 要使……远离
  rationale: 这是רחק的使役式命令，表达主动拉开并保持距离；与“你的道路”搭配时，“要使……远离”既保留使役语气，也保留道路意象。
- source_word: מֵעָלֶיהָ
  choice: 远离她
  rationale: 此处介词结构表示离开她所在的范围；距离含义与הַרְחֵק合并自然译为“远离她”。
- source_word: דַרְכֶּךָ
  choice: 你的道路
  rationale: דֶּרֶךְ既可指实际道路，也可隐喻人的行径或人生方向；“道路”保留智慧文学中的双重意象。
- source_word: וְאַל תִּקְרַב
  choice: 不可走近
  rationale: אַל加未完成式表达禁止；“不可走近”自然地保留移动意象和明确的劝戒语气。
- source_word: אֶל פֶּתַח
  choice: 门口
  rationale: פֶּתַח指房屋的开口、入口或门道；现代汉语“门口”能自然表达靠近房屋入口区域之意，而不局限于门扇本身。
- source_word: בֵּיתָהּ
  choice: 她家
  rationale: בַּיִת在此为具体住所；“她家”比“她的房屋”更符合现代汉语，同时保留空间性的警告。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的劝诫语体。“要使你的道路远离她”略带文学色彩，以保留希伯来文的使役命令和“道路”隐喻；后半句用自然的“不可走近她家的门口”强化具体空间警告。
