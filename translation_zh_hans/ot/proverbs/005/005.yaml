  text: רַ֭גְלֶי/הָ יֹרְד֣וֹת מָ֑וֶת שְׁ֝א֗וֹל צְעָדֶ֥י/הָ יִתְמֹֽכוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/005/005.yaml
  text: Her feet go down to death[a]; her steps hold fast to Sheol.
translation:
  language: zh_hans
  text: '她的双脚下到死亡；

    她的脚步紧紧抓住阴间[a]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “阴间”译自希伯来语“示俄勒”，也可译作“坟墓”或“死人之境”。
    reason: 说明具有特定文化和神学背景的希伯来词，并保留可行的词义选择。
lexical_decisions:
- source_word: רַגְלֶיהָ
  choice: 她的双脚
  rationale: 该词为带第三人称阴性单数后缀的复数名词；译作“双脚”既符合现代汉语，也保留具体的身体意象。
- source_word: יֹרְדוֹת
  choice: 下到
  rationale: 该词是ירד的阴性复数Qal分词，基本义为“下去、下降”；“下到”保留向下运动及其持续趋向。
- source_word: מָוֶת
  choice: 死亡
  rationale: 保留其直接而强烈的基本义，不弱化为“危险”或“毁灭”。
- source_word: שְׁאוֹל
  choice: 阴间
  rationale: “阴间”在现代汉语圣经语境中能简洁表达死人所在之境，同时不等同于后期神学意义上的“地狱”；脚注注明希伯来语名称及其他可能译法。
- source_word: צְעָדֶיהָ
  choice: 她的脚步
  rationale: 保留复数所表达的一连串步伐，并与上句“双脚”的具体意象形成平行。
- source_word: יִתְמֹכוּ
  choice: 紧紧抓住
  rationale: תמך的核心义涉及扶持、把持或抓牢；在此以“脚步”为主语、以“阴间”为前置宾语，译作“紧紧抓住”保留诗歌中强烈而略带拟人的结合意象，不将其释义化为“直通”。
theological_decisions:
- issue: שְׁאוֹל的译法
  choice: 阴间
  alternative: 示俄勒；坟墓；死人之境
  rationale: “阴间”保留古希伯来智慧文学中死人领域的概念，又避免直接套入“地狱”等后期、较专门的神学含义。脚注同时说明音译和其他可行释义，以保留原词的语义张力。
- issue: יִתְמֹכוּ所描绘的关系
  choice: 她的脚步紧紧抓住阴间
  alternative: 她的脚步直通阴间；阴间托住她的脚步
  rationale: 马所拉文本的语法最自然地以“她的脚步”为主语，以前置的“阴间”为宾语。译文保留这种不寻常的拟人化表达，不把它平整化为单纯的目的地陈述，也不倒置主客关系。
translation_notes:
  register: 采用现代、庄重而简明的汉语。两行结构对应希伯来诗歌的平行句式；“下到死亡”和“紧紧抓住阴间”刻意保留原文鲜明、略显突兀的诗歌意象。
