  text: אֹ֣זֶן שֹׁ֭מַעַת וְ/עַ֣יִן רֹאָ֑ה יְ֝הוָ֗ה עָשָׂ֥ה גַם שְׁנֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/012.yaml
  text: The hearing ear and the seeing eye—Yahweh made both of them[a].
translation:
  language: zh_hans
  text: 能听见的耳朵和能看见的眼睛——二者都是雅威所造。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直陈“听着的耳朵”和“看着的眼睛”；末句明确强调雅威造了“二者”。
    reason: 说明希伯来语中修饰“耳朵”和“眼睛”的分词结构，以及 גַם שְׁנֵיהֶם 对二者的强调。
lexical_decisions:
- source_word: אֹזֶן שֹׁמַעַת
  choice: 能听的耳朵
  rationale: 分词 שֹׁמַעַת 作定语修饰“耳朵”。译作“能听的耳朵”符合现代汉语习惯，也保留其实际功能或能力的描述；没有扩展为“顺从的耳朵”等引申义。
- source_word: עַיִן רֹאָה
  choice: 能看的眼睛
  rationale: 与前半句形成整齐对应，保留 רֹאָה 的定语作用及原文的单数表达，不把它解释为“警醒”或其他比喻含义。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，保留其专名性质，不以称号“主”替代。
- source_word: עָשָׂה
  choice: 所造
  rationale: 直接表达 עָשָׂה 的“制造、造作”义；“所造”简洁庄重，并适合箴言的一般真理陈述。
- source_word: גַם שְׁנֵיהֶם
  choice: 两者都是
  rationale: שְׁנֵיהֶם 明说“它们两个”，גַם 在此具有包举、强调作用；“两者都是”在汉语中自然地表达二者无一例外。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文使用神的专名，而非普通称号。采用“雅威”既呈现专名，也避免以“主”替代；“耶和华”是传统形式，但较不贴近该名通常复原的读音。
- issue: “听”与“看”是否具有道德或属灵含义
  choice: 按感官功能直译
  alternative: 理解为善于听从和明察
  rationale: 本节本身明确提到耳与眼，并说二者由雅威所造。上下文没有充分依据要求把分词限定为道德或属灵能力，因此保留具体意义及可能的延伸空间。
translation_notes:
  register: 采用简洁、对称的现代书面汉语，保留箴言格言式节奏。破折号凸显结论；“所造”庄重但仍为普通读者易懂。
