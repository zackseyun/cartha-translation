  text: גַּ֣ם בְּ֭/מַעֲלָלָי/ו יִתְנַכֶּר נָ֑עַר אִם זַ֖ךְ וְ/אִם יָשָׁ֣ר פָּעֳלֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/011.yaml
  text: Even a youth makes himself known by his deeds[a], whether his work is pure and upright.
translation:
  language: zh_hans
  text: 就连少年，也可从自己的行为显出本相[a]：他的作为是否纯洁、正直。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“就连少年，也可从自己的行为被认出来；他的作为是否纯洁、正直。”
    reason: 原文动词יִתְנַכֶּר在此可侧重少年借行为显露自己，也可表达人从其行为认出他。
lexical_decisions:
- source_word: גַּם
  choice: 就连
  rationale: 这里带有强调和扩展意味，指出不只是成年人，就连少年也能从行为中显出自身品格；“就连”自然传达这一语气。
- source_word: בְּמַעֲלָלָיו
  choice: 凭自己的行为
  rationale: מַעֲלָל指行为、作为，常带道德评价色彩；介词בְּ在此表示凭借或依据。
- source_word: יִתְנַכֶּר
  choice: 显明自己
  rationale: 此处נכר的Hitpael形式可指使自己为人所知或借外在表现显露自己；“显明自己”保留反身意味，同时不排除“被认出”的理解。
- source_word: נָעַר
  choice: 少年
  rationale: נַעַר泛指男孩或年轻人；“少年”适合箴言的概括性陈述，又不把年龄限定为幼童。
- source_word: אִם זַךְ
  choice: 是否纯洁
  rationale: זַךְ意为纯净、清白；这里与פָּעֳלוֹ相连，评价其所做之事。“是否”保留אִם在判断句中的开放性。
- source_word: וְאִם יָשָׁר
  choice: 正直
  rationale: יָשָׁר在智慧文学中常指道德上的正直、端正；与“纯洁”并列自然。
- source_word: פָּעֳלוֹ
  choice: 他所做的
  rationale: פֹּעַל可指工作、作为或行为；“他所做的”在现代汉语中自然，也避免与前半句机械重复。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“就连少年”保留原文的强调语气；“显明自己”保留动词的反身色彩，并用脚注呈现被动识别的词义可能。后半句以“看……是否……”自然表达原文两个אִם所保留的判断意味。
