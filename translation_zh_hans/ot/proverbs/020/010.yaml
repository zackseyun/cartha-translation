  yaml_path: translation/ot/proverbs/020/010.yaml
  text: A differing weight and a differing measure—both of them are an abomination to Yahweh[a].
translation:
  language: zh_hans
  text: 一套砝码和另一套砝码，一种量度和另一种量度，二者都是雅威所憎恶的[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“石头和石头，伊法和伊法”。“石头”在此指交易中用于称量的砝码；“伊法”是干物容量单位。重复用词指彼此不一致的计量标准。
    reason: 说明原文的字面表达及其商业语境。
lexical_decisions:
- source_word: אֶבֶן וָאֶבֶן
  choice: 两样不同的砝码
  rationale: אֶבֶן本义为“石头”，在交易语境中指天平所用的石制砝码；名词重复表示彼此不一致的两套标准。译文传达其商业含义，并保留原文所谴责的不诚实差异。
- source_word: אֵיפָה וְאֵיפָה
  choice: 两样不同的量器
  rationale: אֵיפָה是量干物的容量单位；重复形式指容量标准不一。译作“量器”比音译“伊法”更便于现代读者理解本节的交易场景。
- source_word: תּוֹעֲבַת
  choice: 所憎恶的
  rationale: 该词表达强烈的厌恶与否定。“所憎恶的”在现代汉语中自然庄重，也保留了这是雅威亲自作出的道德判断。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文直接呈现四字神名，而不以“主”这一称号替代；“雅威”是现代汉语中清楚、通行的音译。
- source_word: גַּם שְׁנֵיהֶם
  choice: 二者都是
  rationale: 明确保留“两者”均属可憎的强调，指不一致的砝码和不一致的量器这两种做法。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文使用神的专名；译作“雅威”直接音译该名，避免以“主”替代，同时符合现代学术界对其读音的通常重构。
- issue: תּוֹעֲבַת所表达的道德强度
  choice: 所憎恶的
  alternative: 可憎之物
  rationale: “所憎恶的”保留神强烈厌弃的含义，同时比名词式的“可憎之物”更符合本句自然的现代汉语表达；没有把判断弱化为一般的不赞同。
translation_notes:
  register: 采用简洁、庄重而易懂的现代标准汉语。“砝码”明确体现天平称重的交易场景，“量器”则概括伊法所代表的容量计量；破折式并列改为顿号连接，使箴言在中文中紧凑自然。
