revisions:
- from: 谁能说[a]：“我已使自己的心纯洁；我已从自己的罪中洁净了”？
  to: 谁能说[a]：“我已经使自己的心纯洁；我已经洁净，脱离了自己的罪”？
  rationale: 修订仅澄清第二分句在现代汉语中的搭配和介词关系：说话者所作的是“我已洁净、脱离自己的罪”的绝对宣称。第一分句保留使动色彩；第二分句保留其状态／结果意义，不加入原文没有明说的反身施行者。脚注相应删除不自然且过强的反身表达。
