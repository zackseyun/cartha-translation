  text: Who can say[a], “I have made my heart pure; I am clean from my sin” ?
translation:
  language: zh_hans
  text: 谁能说[a]：“我已经使自己的心纯洁；我已经洁净，脱离了自己的罪”？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“谁说：‘我使自己的心洁净了；我已经洁净，脱离了自己的罪’？”第一句的希伯来文动词可较形式地译为“使……洁净”；第二句则可译为“我已成为洁净”，并不明确说明洁净是由谁施行的。
    reason: 词义与句法的另一种译法
lexical_decisions:
- source_word: מִי יֹאמַר
  choice: 谁能说
  rationale: מִי本义为“谁”，与“说”连用构成反问。汉语加“能”可自然传达无人有资格作此绝对断言的语气，同时保留“说”这一动词。
- source_word: זִכִּיתִי
  choice: 我已使……纯洁
  rationale: זכה的Piel形式带有使之洁净、纯洁的意味；译作“使……纯洁”保留其使动色彩及自我洁净的表述。
- source_word: לִבִּי
  choice: 自己的心
  rationale: “心”保留希伯来语的圣经人论用语，指人的内在道德中心；配合第一人称主语，用“自己的心”在现代汉语中更顺畅。
- source_word: טָהַרְתִּי
  choice: 我已……洁净了
  rationale: טהר可表示洁净或成为洁净。这里与前句平行，译文保留完成性及洁净状态，但不明确添加原文未明说的反身代词。
- source_word: מֵחַטָּאתִי
  choice: 从自己的罪中
  rationale: חטאת在此指“罪”，介词מִן表达脱离、除去的关系。“从自己的罪中洁净”既保留原文结构，也呈现道德污秽的意象。
theological_decisions:
- issue: 人能否宣称内心纯洁并脱离自己的罪
  choice: 译作期待否定回答的反问，但不在正文中补出“没有人”
  alternative: 仅译为中性的“谁说”，不突出反问所含的能力或资格意味
  rationale: 上下两句提出绝对的内在纯洁与从罪中洁净的自我宣称，反问自然期待否定回答；“谁能说”传达这一语用力量，却不把隐含答案写进经文。
- issue: 洁净是自我行动还是所得状态
  choice: 第一句保留“使自己的心纯洁”的主动使动表达，第二句译为“已从自己的罪中洁净了”
  alternative: 两句都明确译成“我洁净了自己”，强调自我洁净
  rationale: 第一动词的Piel形态支持使动表达；第二动词不宜无根据地强化为明确反身动作。这样既保持平行，也保留两种动词表达之间的细微张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“纯洁”用于内心的道德纯净，“洁净”保留与罪污相对的圣经意象。正文中的脚注标记[a]与脚注对应。
