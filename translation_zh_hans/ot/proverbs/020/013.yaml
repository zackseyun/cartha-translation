  text: אַל תֶּֽאֱהַ֣ב שֵׁ֭נָה פֶּן תִּוָּרֵ֑שׁ פְּקַ֖ח עֵינֶ֣י/ךָ שְֽׂבַֽע לָֽחֶם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/013.yaml
  text: Do not love sleep[a], lest you become poor; open your eyes[b], and you will have your fill of bread.
translation:
  language: zh_hans
  text: 不要贪睡，免得你陷入贫穷[a]；睁开眼睛，你就会吃饱[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“免得你变得贫穷”。这里的希伯来语动词也可含失去产业、变穷之意。
    reason: lexical_alternative
  - marker: b
    text: 直译：“睁开你的眼睛，要以饼为饱足。”后一句也可理解为接续的命令；正文按上下文译为结果。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תֶּאֱהַב שֵׁנָה
  choice: 不要贪睡
  rationale: 直译为“不要爱睡觉”。现代汉语用“贪睡”自然传达对睡眠的过度喜爱，同时保留箴言的劝诫力度，并非否定正常睡眠。
- source_word: פֶּן
  choice: 免得
  rationale: 引出应当避免的负面后果，准确保留原文的警戒关系。
- source_word: תִּוָּרֵשׁ
  choice: 你陷入贫穷
  rationale: 该动词在此可指变穷或落入贫困；“陷入贫穷”符合上下文，也保留过程和后果的意味。
- source_word: פְּקַח עֵינֶיךָ
  choice: 睁开眼睛
  rationale: 保留原文具体意象；在语境中也自然暗示醒来、警觉并勤劳做事。
- source_word: שְׂבַע
  choice: 你就会吃饱
  rationale: 原文形式上是命令式“要饱足”，接在前一命令之后可表达结果。译作“就会吃饱”使现代汉语清楚呈现箴言的因果对照。
- source_word: לָחֶם
  choice: 吃饱
  rationale: לֶחֶם 字面为“饼、食物”。与“饱足”连用时，汉语“吃饱”最自然；具体的“饼”意象则在脚注中说明，避免生硬地译作“以饼为饱足”。
theological_decisions: []
translation_notes:
  register: 采用简洁、对称的现代箴言体。“贪睡”比字面的“爱睡觉”更符合普通话表达，又不将经文扩写成对懒惰的解释；分号保留警告与劝勉两半的结构。
