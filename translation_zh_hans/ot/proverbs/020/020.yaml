  text: מְ֭קַלֵּל אָבִ֣י/ו וְ/אִמּ֑/וֹ יִֽדְעַ֥ךְ נֵ֝ר֗/וֹ ב/אישון חֹֽשֶׁךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/020.yaml
  text: Whoever curses his father or his mother—his lamp will be put out in deepest darkness[a][b].
translation:
  language: zh_hans
  text: 咒骂自己父亲和母亲的人，他的灯必在漆黑中熄灭。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “漆黑”所译的希伯来语字面近于“黑暗的瞳人”，是表示极深、极浓黑暗的习语。
    reason: cultural_note
  - marker: b
    text: 或译：“他的灯要在极深的黑暗中灭掉。”灯这一意象可能象征一个人的生命、福祉或前途。
    reason: lexical_alternative
lexical_decisions:
- source_word: מְקַלֵּל
  choice: 咒骂……的
  rationale: 该分词在这里名词化，泛指做出这种行为的人。译作“咒骂”既保留发出咒诅的含义，也符合现代汉语表达。
- source_word: אָבִיו וְאִמּוֹ
  choice: 父亲或母亲
  rationale: 希伯来文形式上以连词连接“父亲”和“母亲”；在这类概括性箴言中，汉语用“或”自然表达咒骂其中任何一方都包括在内，同时保留父母双方的明确称谓。
- source_word: יִדְעַךְ
  choice: 必……熄灭
  rationale: 该动词指灯火熄灭。汉语“熄灭”不必明示施事者，保留原文只强调灯灭结果的表达重点；“必”传达未完成式在箴言警告中的确定将来意味。
- source_word: נֵרוֹ
  choice: 他的灯
  rationale: 保留具体的“灯”这一智慧文学意象，不把它解释性地改译为生命、福祉或前途。
- source_word: בְאִישׁוֹן חֹשֶׁךְ
  choice: 在漆黑中
  rationale: 原文直译近于“在黑暗的瞳人中”，是表示极深、极浓黑暗的习语。“漆黑”在现代汉语中凝练自然，并传达其加强意味。
theological_decisions:
- issue: “灯”这一意象的所指
  choice: 正文保留“他的灯”，不限定其象征意义
  alternative: 直接解释为他的生命、福祉、后代或前途必断绝
  rationale: 原文没有明确限定该意象究竟指生命、福祉、家业、后代还是未来；保留意象可避免消解其真实的多义性。
- issue: 父亲与母亲之间的连词
  choice: 译作“父亲或母亲”
  alternative: 译作“父亲和母亲”
  rationale: 原文使用普通连接词，但本句作为普遍警告，所指并非只有同时咒骂父母双方才成立；“或”在汉语中更准确地表达任何一方，同时不改变尊荣父母的伦理范围。
translation_notes:
  register: 采用现代、庄重而易懂的箴言体。以“咒骂……的”呈现概括性主体，以“必”加强警戒语气；保留“灯”的具体隐喻，并用脚注说明希伯来习语及意象可能的范围。
