  yaml_path: translation/ot/proverbs/020/004.yaml
  text: Because of winter[a], the lazy man does not plow; at harvest he seeks[b], and there is nothing.
translation:
  language: zh_hans
  text: 懒人因冬寒[a]不耕地；到收割时，他寻求[b]，却一无所获。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“懒人在冬天不耕地。”希伯来语介词既可表示时间（“在冬天”），也可表示原因（“因冬寒”）。
    reason: lexical_alternative
  - marker: b
    text: 或译：“到收割时他索求。”这个希伯来语动词可表示“询问、索求”；在这里也可理解为收割时寻找或求取收成。
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵחֹרֶף
  choice: 因冬寒
  rationale: 介词 מִן 在此可表示原因，חֹרֶף 指冬季及其寒冷；“因冬寒”自然地表达懒人以寒冷季节为不耕作的缘由，同时以脚注保留时间性理解。
- source_word: עָצֵל
  choice: 懒人
  rationale: 这是箴言中惯指惯常懒惰之人的词。“懒人”简洁、现代，也保留阳性单数的代表性表达。
- source_word: לֹא יַחֲרֹשׁ
  choice: 不耕地
  rationale: חרשׁ 在农业语境中指犁地、耕作；“不耕地”在现代汉语中自然明确，并以一般现在式体现箴言的普遍陈述。
- source_word: ישאל
  choice: 他寻求
  rationale: שׁאל 通常可指“求问、索求”，此处宾语省略，语境暗示在收割时寻找或索求收成；“寻求”保留其开放性，不擅自补出具体对象。
- source_word: בַּקָּצִיר
  choice: 到收割时
  rationale: 表示后果显现的时间。“到收割时”自然呈现从不耕作到收割季节的时间推进。
- source_word: וָאָיִן
  choice: 却一无所有
  rationale: אָיִן 是存在性否定，原文没有明说所缺之物。“一无所有”保留简练的绝对否定；“却”自然表达前后反差。
theological_decisions: []
translation_notes:
  register: 采用现代、凝练而庄重的箴言体。分号保留两行之间行为与后果的对应关系；不补出“粮食”或“收成”，以维持原文宾语省略所留下的含蓄。
