  text: לֵ֣ץ הַ֭/יַּין הֹמֶ֣ה שֵׁכָ֑ר וְ/כָל שֹׁ֥גֶה בּ֝֗/וֹ לֹ֣א יֶחְכָּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/001.yaml
  text: Wine is a mocker[a], strong drink a brawler, and whoever is led astray by it is not wise.
translation:
  language: zh_hans
  text: 酒是讥诮者，烈酒是喧嚷者；凡因它误入歧途的，都不明智。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“酒使人讥诮，烈酒使人喧闹。”希伯来文把酒饮拟人化：酒是“讥诮者”，烈酒是“喧嚷者”。“烈酒”泛指能使人醉的酒类，不一定专指现代蒸馏酒。
    reason: 说明较自然的解释性译法，并保留原文拟人化修辞及“烈酒”的广义。
lexical_decisions:
- source_word: לֵץ
  choice: 使人讥诮
  rationale: 该名词通常指讥诮者、嘲弄者。此处以酒为拟人化的述语；译作“使人讥诮”既保留其嘲弄意味，也自然表达酒在人身上产生的作用。
- source_word: הַיַּיִן
  choice: 酒
  rationale: יין通常指葡萄酒；在本节与שֵׁכָר对举。中文格言式表达无须复现希伯来文定冠词。
- source_word: הֹמֶה
  choice: 使人喧闹
  rationale: המה的分词表示喧嚷、骚动或沸腾不安。译文保留它与前句平行的动态效果，同时避免将其过度限定为肢体斗殴。
- source_word: שֵׁכָר
  choice: 烈酒
  rationale: 该词泛指葡萄酒之外能使人醉的酒类。“烈酒”是现代中文简明而常见的对应词，但不意在限定为现代蒸馏酒。
- source_word: שֹׁגֶה
  choice: 走入歧途
  rationale: 该动词表示迷失、偏离或犯错；这里不仅可能涉及醉态，也包括判断与行为受到误导。
- source_word: בּוֹ
  choice: 因它
  rationale: 介词加第三人称阳性单数后缀，形式上是“因它／在其中”。“因它”自然表达酒造成迷失，同时保留单数指称。
- source_word: לֹא יֶחְכָּם
  choice: 都没有智慧
  rationale: 未完成式在箴言中表达普遍真理。译作“没有智慧”比未来式“不会变得有智慧”更符合本句格言语气。
theological_decisions:
- issue: 经文是谴责酒本身，还是警戒受酒误导的人
  choice: 保留酒的拟人化及其使人偏离的危险，不扩展为绝对禁酒命令
  alternative: 将本句明确译成禁止一切饮酒
  rationale: 希伯来文本鲜明警告酒的嘲弄、喧嚷作用，并断言因它迷失者不智，但本节本身没有以命令式规定全面禁酒。
translation_notes:
  register: 采用现代、庄重而易懂的箴言体。前两分句用“使人……”形成自然平行，并以分号转入结论；脚注保留较贴近希伯来文表层结构的拟人化直译。
