  text: It is an honor for a man to keep away from strife[a], but every fool bursts out in quarrel.
translation:
  language: zh_hans
  text: '远离争端，是人的荣耀；

    愚昧人却个个争闹。[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “争闹”所译的希伯来语动词十分罕见，含义不确定；也可能指“卷入争执”，或较直译为以挑衅的姿态“显露自己”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּבוֹד
  choice: 荣耀
  rationale: 此处指一种值得称许、使人得尊荣的品格表现。“荣耀”保留原词的分量，同时在“是人的荣耀”这一结构中自然明确。
- source_word: לָאִישׁ
  choice: 是人的
  rationale: 保留 אִישׁ 的单数、男性形式所承载的普遍箴言表达；汉语“人”自然涵盖代表性意义，无须增添性别限定。
- source_word: שֶׁבֶת מֵרִיב
  choice: 远离争端
  rationale: שֶׁבֶת 与 מִן 构成离开、停止或不参与的意思；“远离”简洁传达避开争端的实际含义。
- source_word: רִיב
  choice: 争端
  rationale: 该词可指争执、纷争或诉讼性争议；“争端”范围较广，适合本节一般性的智慧教导。
- source_word: אֱוִיל
  choice: 愚昧人
  rationale: 这是箴言中的典型智慧术语，所指不只是智力不足，更包括道德与行为上的顽愚；“愚昧人”能保留这一层面。
- source_word: יִתְגַּלָּע
  choice: 争闹不休
  rationale: 该罕见的 Hitpael 形式词义不确定，但上下文与“远离争端”形成对照，指愚昧人投身争执、放任自己争闹。“争闹不休”在现代汉语中自然，也保留其公开而持续卷入冲突的语气；不确定性在脚注说明。
