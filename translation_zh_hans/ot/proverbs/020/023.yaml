base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/023.yaml
  text: Unequal weights are an abomination to Yahweh[a], and deceitful scales are not good.
translation:
  language: zh_hans
  text: 不同的砝码[a]是雅威所憎恶的；欺诈的天平也不好。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“一块石头和一块石头”，指交易中使用不同重量的砝码来欺骗他人。
    reason: 说明希伯来语习语的字面形式及其商业含义。
lexical_decisions:
- source_word: תּוֹעֲבַת
  choice: 所憎恶的
  rationale: 该词表达强烈的道德厌恶；“所憎恶的”在现代汉语中自然庄重，并保留原文的伦理力度。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，保留其专名性质，而不以称号替代。
- source_word: אֶבֶן וָאָבֶן
  choice: 两套不同的砝码
  rationale: 原文直译为“一块石头和一块石头”，是指交易中使用数值不一的石制砝码；译文传达其实际所指，脚注保留字面形式。
- source_word: וּמֹאזְנֵי מִרְמָה
  choice: 欺诈的天平
  rationale: מֹאזְנֵי 指天平，מִרְמָה 指欺骗或欺诈；此译保留原文简洁的属格结构与商业语境。
- source_word: לֹא טוֹב
  choice: 也不好
  rationale: 按原文保留“并非好”的克制表达，不擅自强化为“邪恶”或“不可接受”。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。译作“雅威”可保留其作为以色列之神专名的性质，避免用称号“主”取代；“耶和华”则源于较晚的混合读音传统。
translation_notes:
  register: 采用现代、庄重而通俗的箴言体；分号呈现两个平行分句。“也不好”有意保留原文较含蓄的否定措辞。
