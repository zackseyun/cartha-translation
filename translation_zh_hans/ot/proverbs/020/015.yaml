  text: There is gold[a], and an abundance of pearls, but lips of knowledge are a precious vessel.
translation:
  language: zh_hans
  text: 有金子，也有许多宝石[a]；有知识的嘴唇却是贵重的器皿。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“珍珠”“珊瑚”或“红宝石”；פְּנִינִים具体指哪一种贵重物品，不能确定。
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵשׁ
  choice: 有
  rationale: 用现代汉语的存在句自然引出箴言所观察到的事物。
- source_word: זָהָב
  choice: 金子
  rationale: 直接表达该物质名词，并与下文贵重物品的意象相称。
- source_word: וְרָב
  choice: 也有许多
  rationale: רָב表示数量众多；补出存在动词，使汉语并列结构自然清楚。
- source_word: פְּנִינִים
  choice: 宝石
  rationale: 该词所指的具体贵重物品不能确定；正文采用涵盖性较强的“宝石”，并在脚注保留珍珠、珊瑚、红宝石等可能。
- source_word: וּכְלִי יְקָר
  choice: 但……才是贵重的器皿
  rationale: כְלִי可指器皿、物件或用具；“贵重的器皿”保留具体比喻。“但……才是”在汉语中呈现金银宝石与有知识之言的价值对照。
- source_word: שִׂפְתֵי דָעַת
  choice: 有知识的嘴唇
  rationale: 保留“嘴唇”这一转喻性意象，同时以自然汉语表达其修饰关系，指具有知识、能说出有见识之话的言语者官。
