base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/026.yaml
  text: A wise king winnows the wicked and drives the wheel over them.
translation:
  language: zh_hans
  text: 智慧的君王簸散恶人，使碾轮从他们身上轧过[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “碾轮”原文直译为“轮”；这里可能指脱粒时用来碾压禾穗的轮具。
    reason: 原词本身只说“轮”，其具体农业用途由上下文推知，脚注保留这一词义与意象上的开放性。
lexical_decisions:
- source_word: מְזָרֶה
  choice: 簸散
  rationale: 该词源于扬场、簸扬谷物的动作；“簸散”既保留农业意象，也表达君王把恶人筛出并驱散的含义。
- source_word: רְשָׁעִים
  choice: 恶人
  rationale: 这是箴言中常见的道德类别，指行恶、不义的人；“恶人”简洁而符合全书用语。
- source_word: מֶלֶךְ חָכָם
  choice: 智慧的君王
  rationale: 忠实保留名词与形容词的关系，并采用现代汉语中自然、庄重的表达。
- source_word: וַיָּשֶׁב
  choice: 使……轧过
  rationale: 该使役形式有使之转回、带过或驱过之意；结合后面的“轮”，译文表达君王驱使碾轮经过恶人，同时不把动作弱化为单纯“转动”。
- source_word: אוֹפָן
  choice: 碾轮
  rationale: 字面义是“轮”；在扬场语境中很可能指脱粒用的轮具。“碾轮”让现代读者看出农业审判意象，脚注同时交代原文较宽泛的字面义。
theological_decisions:
- issue: 君王审判恶人的意象强度
  choice: 保留“从他们身上轧过”的强烈图像
  alternative: 淡化为“惩罚他们”或“除掉他们”
  rationale: 原文以扬场和轮子描绘君王对恶人的严厉处置。译文不将其抽象化，也不进一步断定这是具体刑罚还是比喻性描述。
translation_notes:
  register: 采用现代、庄重而易懂的箴言体。“簸散—碾轮”保留同一扬场场景；“从他们身上轧过”传达原文的严厉力度，但不额外解释为某一种特定刑罚。
