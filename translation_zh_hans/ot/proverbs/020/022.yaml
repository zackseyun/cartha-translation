source:
  edition: WLC
  text: אַל תֹּאמַ֥ר אֲשַׁלְּמָה רָ֑ע קַוֵּ֥ה לַֽ֝/יהוָ֗ה וְ/יֹ֣שַֽׁע לָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/022.yaml
  text: Do not say[a], “I will repay evil”; wait for Yahweh[c][b], and he will save you.
translation:
  language: zh_hans
  text: 不要说：“我要以恶报恶。”要等候耶和华[a]，他必拯救你[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “耶和华”即原文中的神名יהוה，也常译作“雅威”。“等候”含有怀着盼望期待他的意思。
    reason: divine_name_and_lexical_alternative
  - marker: b
    text: “拯救”也可译作“解救”；在本语境中也可能含有“为你伸冤”的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תֹּאמַר
  choice: 不要说
  rationale: אַל与未完成式连用构成禁止语气；“不要说”简洁自然，并保留原文引出直接引语的形式。
- source_word: אֲשַׁלְּמָה רָע
  choice: 我要以恶报恶
  rationale: שׁלם的Piel在这里表示报还、报复；רָע可指恶、伤害或亏负。“以恶报恶”符合现代汉语习惯，也保留报复行为的道德性质。
- source_word: קַוֵּה
  choice: 等候
  rationale: קוה表示带着盼望和期待而等待；正文用“等候”简明庄重，其期待性的内涵不必改写为单纯的被动等待。
- source_word: לַיהוָה
  choice: 耶和华
  rationale: 原文直接使用四字神名יהוה；采用现代中文圣经读者熟悉的音译“耶和华”，而非以称号代替专名。
- source_word: וְיֹשַׁע לָךְ
  choice: 他必拯救你
  rationale: ישׁע的Hiphil可表示拯救、解救或使人得胜；“拯救你”保留宽泛语义，不把应许限定为法律上的伸冤或某一种具体脱险方式。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 原文使用神的专名。中文正文采用传统且广为人知的音译“耶和华”；脚注提示“雅威”这一更接近学界常用重构读音的形式，既保留专名，也避免无说明地只用称号。
- issue: וְיֹשַׁע לָךְ所表达的拯救范围
  choice: 他必拯救你
  alternative: 他必解救你；他必为你伸冤
  rationale: 原词可涵盖救援、脱困及得胜；“拯救”不预先断定其实现方式，保留智慧文学语境中的开放性。
- issue: 报复语句的表达
  choice: 我要以恶报恶
  alternative: 我要报复这恶；我要偿还所受的伤害
  rationale: 原文没有明说恶的施行者或具体报复方式。“以恶报恶”保留这种简练与张力，也清楚呈现经文所禁止的是自行报复。
translation_notes:
  register: 采用现代、庄重而通顺的箴言体。前半句用汉语惯用语“以恶报恶”传达报复性回报，后半句保持简洁有力；所有脚注标记均已置于正文相应位置。
