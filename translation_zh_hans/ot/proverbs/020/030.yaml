  text: חַבֻּר֣וֹת פֶּ֭צַע תמריק בְּ/רָ֑ע וּ֝/מַכּ֗וֹת חַדְרֵי בָֽטֶן־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/030.yaml
  text: The bruises of a wound cleanse away evil[b][a], and blows cleanse the innermost parts of the belly.
translation:
  language: zh_hans
  text: 创伤留下的瘀痕能涤除邪恶[a]；击打能洁净人的肺腑深处[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “涤除”也可译作“除净”或“彻底清除”；原文动词有擦洗、磨净的意味。
    reason: lexical_alternative
  - marker: b
    text: 直译“肚腹的内室”，是希伯来语形容一个人内在最深处的说法。
    reason: cultural_note
lexical_decisions:
- source_word: חַבֻּרוֹת פֶּצַע
  choice: 打伤留下的瘀痕
  rationale: חַבֻּרוֹת指受击后留下的瘀痕、肿痕；פֶּצַע进一步表明这是由创伤造成的痕迹。此译既保留具体的身体意象，也符合现代汉语表达。
- source_word: תמריק
  choice: 能除净／能洁净
  rationale: 该动词含擦净、洗净、除去之意。首句用“除净”自然表达邪恶被清除，次句补出平行结构中省略的同一动词，用“洁净”保持意象。
- source_word: בְּרָע
  choice: 邪恶
  rationale: רָע在本句具有道德含义；介词结构在此表示被清除的对象。译作“邪恶”简洁而庄重。
- source_word: וּמַכּוֹת
  choice: 击打
  rationale: מַכּוֹת指打击或责打。译作“击打”保留具体动作，同时不把经文限定为某一种制度化惩罚。
- source_word: חַדְרֵי בָטֶן
  choice: 人内里的最深处
  rationale: 字面为“肚腹的密室”，是希伯来语描述人最深层内在之处的身体性表达。正文传达其实际所指，脚注保留原有比喻。
theological_decisions:
- issue: 痛苦击打意象的解释范围
  choice: 保留击打具有清除邪恶、深入人内在的管教性意象
  alternative: 将其泛化为一切苦难都具有洁净作用
  rationale: 上下句的瘀痕和击打最自然地指向严厉纠正，但原文没有明说施行者或具体管教制度，因此不把它扩展成关于所有苦难的普遍教义。
- issue: 第二句省略谓语的处理
  choice: 按平行关系补出“能洁净”
  alternative: 译作“击打直达人的内心深处”
  rationale: 希伯来诗歌第二句没有明写动词，可由首句承接。补出同一洁净动作更直接呈现平行关系，同时不排除击打深入内在的含义。
translation_notes:
  register: 采用现代、庄重而易懂的箴言体。“打伤留下的瘀痕”保留身体意象；分号呈现两句平行。“人内里的最深处”避免现代汉语中“肚腹的密室”的生硬感，并以脚注交代字面表达。
