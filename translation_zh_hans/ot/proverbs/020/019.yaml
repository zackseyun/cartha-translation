  yaml_path: translation/ot/proverbs/020/019.yaml
  text: One who reveals secrets goes about as a gossip[b][a]; do not associate with one who opens his lips wide.
translation:
  language: zh_hans
  text: 泄露秘密的人，四处传闲话；对口无遮拦的人，不可与他来往。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גּוֹלֶה סּוֹד
  choice: 泄露秘密的
  rationale: גּוֹלֶה是גלה的主动分词，表示揭开、透露；סוֹד在此指不应外传的隐密话或机密之事。“泄露秘密”自然地表达了背弃信任的语境。
- source_word: הוֹלֵךְ רָכִיל
  choice: 到处搬弄是非
  rationale: 该短语字面含有“行走、往来”的意象，רָכִיל指四处传播有害传闻的人或行为。“到处搬弄是非”既保留四处活动的意味，也传达其言语伤人的性质，同时不把含义限定为法律意义上的诽谤。
- source_word: וּלְפֹתֶה שְׂפָתָיו
  choice: 口无遮拦的人
  rationale: 这一短语的具体构词和语义略有歧义，但在本节与泄密和搬弄是非并列，所指应是随意开口、说话不谨慎的人。“口无遮拦”是现代汉语中自然且贴合语境的表达；脚注保留较直译的措辞。
- source_word: לֹא תִתְעָרָב
  choice: 你不要与他来往
  rationale: התערב在此表示与人混在一起、交往或结交。“不要与他来往”清楚自然，也符合智慧文学直接劝诫的语气。
