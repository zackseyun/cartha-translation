source:
  edition: WLC
  text: מֵ/יהוָ֥ה מִצְעֲדֵי גָ֑בֶר וְ֝/אָדָ֗ם מַה יָּבִ֥ין דַּרְכּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/024.yaml
  text: A man's steps are from Yahweh[b][a]; how then can a man understand his way?
translation:
  language: zh_hans
  text: 人的[a]脚步出于雅威[b]；人又怎能明白自己的道路？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文前句用 גָבֶר（通常指男子），后句用 אָדָם（人）；这里均以阳性单数代表一般的人。
    reason: lexical_alternative
  - marker: b
    text: “出于雅威”表示来源，也可含有人的人生行程由雅威支配或安排之意。
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵ/יהוָה
  choice: 出于雅威
  rationale: 介词 מִן 表示来源；“出于”简洁保留人的脚步源自雅威、受他安排的含义。神名 יְהוָה 音译为“雅威”。
- source_word: מִצְעֲדֵי
  choice: 脚步
  rationale: 该词指迈出的步伐，也可比喻人生的行程；“脚步”在现代汉语中自然，并保留原文的行路意象。
- source_word: גָבֶר
  choice: 人
  rationale: 该阳性单数名词可指男子，但本箴言具有普遍代表性；汉语“人”自然表达泛指，性别形式的信息收入脚注。
- source_word: וְ/אָדָם
  choice: 人又
  rationale: אָדָם 在此泛指人；“又”自然承接前句，并带出反问所含的推论关系。
- source_word: מַה יָּבִין
  choice: 怎能明白
  rationale: 此处 מַה 与动词连用构成反问，表达人的认知限度；“怎能明白”比逐字译作“明白什么”更符合汉语。
- source_word: דַּרְכּוֹ
  choice: 自己的道路
  rationale: דֶּרֶךְ 可指道路，也可比喻人生进程。“自己的道路”既保留比喻，也清楚回指句中的“人”。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；“雅威”以现代汉语常见形式音译其名，避免以称号代替专名。
- issue: 人的脚步“出于”雅威的含义
  choice: 保留来源性的简练表述
  alternative: 人的脚步由雅威安排／决定
  rationale: מִן 明确表示来源，但原句没有另加“安排”或“决定”等动词。正文保留原文的凝练与张力，脚注说明其可能包含人生行程受雅威支配、安排之意。
- issue: גָבֶר 与 אָדָם 的泛指男性形式
  choice: 正文译作“人……人”
  alternative: 男人……人；男子……世人
  rationale: 两个希伯来语名词均为阳性单数，前者更明确可指成年男子，但此箴言的论断显然具有普遍适用性。现代汉语以“人”表达泛指最自然，同时用脚注保存原文形式差异。
translation_notes:
  register: 采用简洁、对称的箴言体。分号呈现两句之间由陈述转入反问的推论关系；“脚步／道路”保留原文贯穿的行路比喻。
