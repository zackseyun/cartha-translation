  text: תִּפְאֶ֣רֶת בַּחוּרִ֣ים כֹּחָ֑/ם וַ/הֲדַ֖ר זְקֵנִ֣ים שֵׂיבָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/029.yaml
  text: The glory of young men is their strength[a], and the splendor of old men is gray hair.
translation:
  language: zh_hans
  text: 年轻人的荣耀在于力量，老年人的尊荣在于白发。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“年轻人的华美在于力量，老年人的光彩在于白发。”
    reason: 词义备选：תִּפְאֶרֶת 与 הֲדַר 都可表达华美、光彩或尊荣。
lexical_decisions:
- source_word: תִּפְאֶרֶת
  choice: 荣耀
  rationale: 该词可指荣耀、华美或引以为荣之处；这里与下半句平行，译为“荣耀”既保留尊荣意味，也符合箴言的庄重语体。
- source_word: בַּחוּרִים
  choice: 年轻人
  rationale: 原词为阳性复数，指年轻男子；现代汉语中“年轻人”在此年龄对比结构里自然简洁，并不妨碍原文所描绘的青年男性形象。
- source_word: כֹּחָם
  choice: 力量
  rationale: 原词基本义为力量、能力；此处突出青年时期的体力与活力，“力量”最直接，并保留一定涵盖面。
- source_word: הֲדַר
  choice: 尊荣
  rationale: 该词兼有华美、威仪和尊荣之义；在白发象征年长者可敬身份的语境中，“尊荣”自然，并与前句“荣耀”形成近义平行而不完全重复。
- source_word: זְקֵנִים
  choice: 老年人
  rationale: 这里与年轻人作年龄上的对照，并非特指担任职分的长老；“老年人”准确且符合现代汉语。
- source_word: שֵׂיבָה
  choice: 白发
  rationale: 该词指灰白头发，也可转指老年；译为“白发”保留了原文具体可见的意象。
theological_decisions: []
translation_notes:
  register: 采用现代、简洁而庄重的箴言体。以“在于”呈现两个无动词名词句之间的关系；保留青年力量与老年白发的对称结构及价值张力。
