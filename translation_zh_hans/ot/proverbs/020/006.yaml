  text: רָב אָדָ֗ם יִ֭קְרָא אִ֣ישׁ חַסְדּ֑/וֹ וְ/אִ֥ישׁ אֱ֝מוּנִ֗ים מִ֣י יִמְצָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/006.yaml
  text: Many a man proclaims his own loyalty[b][a], but who can find a faithful man?
translation:
  language: zh_hans
  text: 许多人声称自己忠诚[a]，但忠信的人谁能找到呢？[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “忠诚”所译的希伯来词也可指“坚贞的爱”或“仁慈”。
    reason: lexical_alternative
  - marker: b
    text: “忠信的人”也可译作“可靠的人”或“可信的人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: רָב אָדָם
  choice: 许多人
  rationale: 该短语由“多”和泛指人的 אָדָם 构成，在箴言中表示许多人；“许多人”符合现代汉语的自然表达，也保留其普遍指向。
- source_word: יִקְרָא
  choice: 声称
  rationale: קרא 本义可指“呼叫、宣告”，此处是人宣扬自己的品德；“声称”既体现公开自我标榜，也与下句对真实品格的追问形成张力。
- source_word: אִישׁ חַסְדּוֹ
  choice: 自己忠诚
  rationale: חֶסֶד 在此可指忠诚、坚贞的爱或仁慈；结合与 אֱמוּנִים 的对照，“忠诚”最自然地表达一个人自称具有的忠贞品格。“自己”体现第三人称单数后缀的归属和自我称许意味。
- source_word: וְאִישׁ אֱמוּנִים
  choice: 但忠信的人
  rationale: אֱמוּנִים 表示忠实、可靠、可信；“忠信的人”简洁而庄重，同时保留它与上句“忠诚”既相关又不完全重合的语义关系。连接词依语境译作转折性的“但”。
- source_word: מִי יִמְצָא
  choice: 谁能找到呢
  rationale: 疑问词加未完成式构成反问，强调这种人难得，并非单纯询问未来由谁找到；“谁能找到呢”自然保留这一修辞力度。
theological_decisions:
- issue: חֶסֶד 与 אֱמוּנִים 的关系
  choice: 分别译作“忠诚”和“忠信”，保留二者的语义呼应及细微区别
  alternative: 把两者都译成“忠实”或“可靠”
  rationale: 原文先说人自称具有 חֶסֶד，后追问真正具有 אֱמוּנִים 的人何处可寻。采用相近而不相同的词，避免把两者完全等同，也不额外引入特定的圣约神学解释。
translation_notes:
  register: 采用现代、简洁而庄重的箴言体。上句用“声称”传达人自我宣扬品格的意味，下句保留反问结构。泛指人的表达采用“人”，不把原文普遍适用的教训不必要地限于男性。
