  text: מוֹקֵ֣שׁ אָ֭דָם יָ֣לַע קֹ֑דֶשׁ וְ/אַחַ֖ר נְדָרִ֣ים לְ/בַקֵּֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/025.yaml
  text: It is a snare for a man to rashly dedicate something as holy, and only afterward to consider his vows.
translation:
  language: zh_hans
  text: 人轻率地把某物献作圣物，是自陷网罗；许愿之后才审察自己所许的愿，也是如此。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מוֹקֵשׁ
  choice: 自陷网罗
  rationale: 该词指捕捉猎物的网罗，并引申为使人陷入祸患之事；译作“自陷网罗”自然表达本句的警戒意味。
- source_word: יָלַע
  choice: 轻率地
  rationale: 这是罕见词，语境及古代译本所反映的理解指向仓促、冒失的言行；译文保留其鲁莽行事的核心含义。
- source_word: קֹדֶשׁ
  choice: 把某物献为圣物
  rationale: 原文简略，仅有“圣物／神圣”，在许愿语境中表示宣告或奉献某物归于神；补出“某物”使汉语完整，但不限定具体对象。
- source_word: לְבַקֵּר
  choice: 细想
  rationale: 该动词基本义为查察、审究；此处指在许愿之后才加以审慎考虑。
theological_decisions:
- issue: “圣”所表达的奉献行为
  choice: 把某物献为圣物
  alternative: 说“这是圣物”
  rationale: 前半句与后半句的“许愿”平行，重点是轻率地将某物分别归神，而不只是随口作出一个陈述。
- issue: 后半句与“网罗”的句法关系
  choice: 许愿以后才细想，也是如此
  alternative: 并在许愿以后才细想
  rationale: 希伯来文省略了第二分句的谓语关系；译文以“也是如此”说明两种行为同属网罗，同时保留箴言式的简练和平行结构。
translation_notes:
  register: 采用现代、庄重而通俗的箴言体。“轻率地”“献为圣物”“许愿以后才细想”清楚呈现先行动、后审察的次序，不加入特定宗派的誓愿制度解释。
