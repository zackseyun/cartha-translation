  rationale: 仅作汉语表达层面的澄清：以“献作”使奉献关系自然，以“审察自己所许的愿”补足汉语中可安全恢复的隐含对象。仍保留本节将轻率奉献和事后审察誓愿都视为网罗的警戒结构。
