review_pass:
  verdict: revise
  source_fidelity: 首句“拿他的衣服”及“为陌生人作保”准确传达了 לְקַח、בִּגְדוֹ、עָרַב 和 זָר。末句的 חַבְלֵהוּ 在此抵押法律语境中通常是“向他取抵押物／把他作为提供抵押者”，并不自然地表示将担保人本人“扣住作抵押”。此外，נכרים 的辅音形式可作“外人／外国人”，但传统读法也涉及“外邦女子”；应以脚注保留这一文本读法差异。
  naturalness: “要拿走”可用，但在格言式劝诫中“拿他的衣服”更凝练自然。“扣住他作抵押”容易使现代读者理解为拘禁人身，既不合现代汉语法律表达，也遮蔽了原文惯用的取押含义。“向他取抵押物”清楚、庄重且符合上下文。
  terminology: “作保”与“抵押物”适合本节商业—法律语境。“陌生人”可保留；末句用“外人”反映所给辅音文本的复数含义，同时在注释中说明传统读法的“外邦女子”，避免将文本问题静默抹平。
  issues:
  - severity: high
    issue: “扣住他作抵押”将末句译为扣留担保人本人。
    rationale: חבל加宾语后缀在此类格言的抵押语境中惯指向该人索取抵押，而不是把人拘作抵押。现译在现代汉语中尤其会造成不必要的人身拘押含义。
  - severity: medium
    issue: 脚注只提出“从他那里取抵押物”的替代，未说明 נָכְרִים 的传统读法差异。
    rationale: 所给辅音文本可译“外人／外国人”，但本节传统读法常作单数阴性“外邦女子”。这是影响末句对象的相关文本现象，宜简明保留。
  - severity: low
    issue: 脚注a的锚点置于“衣服”后，注释实际主要解释末句。
    rationale: 将锚点放在“抵押物”后，读者更容易对应所注释的简略末句。
  revised_text: 要拿他的衣服，因为他为陌生人作保[b]；他为外人作保，就要向他取抵押物[a]。
  revised_footnotes:
  - marker: a
    text: 末句的希伯来语十分简略；“向他取抵押物”直译其抵押惯用语。也可按宾语后缀理解为“把他扣作抵押”，但这在此语境中通常指向他索取抵押，而非拘留他本人。所给辅音文本的“外人”也有传统读法作“外邦女子”。
    reason: alternative_reading
  - marker: b
    text: “作保”指为另一个人的债务或义务承担保证责任。
    reason: cultural_note
  revision_rationale: 修订将末句改为“向他取抵押物”，以传达 חבל在担保与抵押语境中的通常用法，并避免“扣住他”所引入的人身拘禁含义。脚注保留宾语后缀所造成的表面歧义，并补充所给辅音文本与传统读法在担保对象上的差异。正文仍以“外人”对应所给 WLC 辅音形式，未擅自将其限定为女性。
