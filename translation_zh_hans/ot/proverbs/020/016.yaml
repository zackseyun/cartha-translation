review_pass:
  verdict: revise
  source_fidelity: 需要修订。箴言20:16的马所拉文本末句通常读作“וּבְעַד נָכְרִיָּה חַבְלֵהוּ”，其中נכריה为阴性单数，意为“外邦女子／陌生女子”，不是复数“外人／外国人”。此外，חבלהו在此抵押法律语境中更自然地指“向他索取抵押物”，而非“扣住他本人作抵押”。所给英语审校轨迹将末句处理为“foreigners”，不能凌驾于希伯来文本的这一读法。
  naturalness: 原文“扣住他作抵押”在现代汉语中容易理解为拘禁担保人本人，既不自然，也偏离通常的抵押行为。改作“向他索取抵押物”清楚、庄重，并保留箴言格言体的简洁。
  terminology: “作保”适切；“抵押物”准确表达חבל的法律语义。“陌生人”可保留对应זר；“外邦女子”明确表达נכריה的性别与外来者含义，避免把它泛化为“外人”。
  issues:
  - severity: high
    issue: 将נכריה译为“外人／外国人”
    rationale: 此处标准马所拉读法为阴性单数“外邦女子（或陌生女子）”。译作复数、非特指性别的“外人”改变了原文的数和性别。题面所列WLC字符串的“נכרים”与该节通常的带元音马所拉文本不一致；在未有明确文本批判理由时，应按该节的标准读法译出。
  - severity: high
    issue: “扣住他作抵押”把担保人本人当作抵押物
    rationale: חבלהו在本节及平行的箴言27:13的抵押语境中，适宜译为“向他索取抵押物／从他取抵押”，即因其担保行为而要求担保物；不宜译成拘押此人。
  - severity: medium
    issue: 脚注a锚定在“衣服”后，却说明末句的解释可能
    rationale: 脚注应锚定于末句“抵押物”，使读者能直接知道其所说明的歧义或替代译法。
  revised_text: 要拿他的衣服作抵押[a]，因为他为陌生人作保[b]；他为外邦女子作保，就要向他索取抵押物。
  revised_footnotes:
  - marker: a
    text: 末句的希伯来语简略；直译可作“为外邦女子的缘故，要向他取抵押物”。“向他索取抵押物”指因他为人作保而要求他提供担保物，并非扣留他本人。
    reason: alternative_reading
  - marker: b
    text: “作保”指为另一个人的债务或义务承担保证责任。
    reason: cultural_note
  revision_rationale: 修订依据希伯来文本的性数与抵押法律语境：将末句的对象译为“外邦女子”，并把命令译为向担保人索取抵押物。首句补出“作抵押”，使“拿他的衣服”的法律功能在汉语中明确。脚注a移至相关词语处，并说明句法简略所容许的表达差异，同时不把担保人误说成被扣押的物件。
