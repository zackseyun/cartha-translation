  text: לְֽקַח בִּ֭גְד/וֹ כִּי עָ֣רַב זָ֑ר וּ/בְעַ֖ד נכרים חַבְלֵֽ/הוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/016.yaml
  text: Take his garment[a], for he has put up security for a stranger[b]; and hold him in pledge for foreigners.
translation:
  language: zh_hans
  text: 要拿走他的衣服[a]，因为他为陌生人作保[b]；他既为外人担保，就要扣住他作抵押。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 末句的希伯来语十分简略，也可理解为：“他既为外人担保，就要从他那里取抵押物。”这样，重点可能是拿他的衣服作抵押，而不一定是扣住他本人。
    reason: alternative_reading
  - marker: b
    text: “作保”指为另一个人的债务或义务承担保证责任。
    reason: cultural_note
lexical_decisions:
- source_word: לְקַח
  choice: 要拿走
  rationale: 这是לקח的阳性单数祈使式；“要拿走”保留直接命令的语气，也符合取走抵押物的法律语境，不强化为暴力性的“抢走”。
- source_word: בִּגְדוֹ
  choice: 他的衣服
  rationale: בגד泛指衣物；“衣服”比“外衣”或“袍子”更少作不必要的具体化。
- source_word: כִּי
  choice: 因为
  rationale: 此处引出前一命令的理由；“因为”清楚保留因果关系。
- source_word: עָרַב
  choice: 作保
  rationale: ערב在此指为别人的债务或义务承担保证责任；“作保”是简明、自然的现代汉语法律与日常表达。
- source_word: זָר
  choice: 陌生人
  rationale: זר指与本人通常关系圈之外的人；“陌生人”保留箴言对轻率替不熟悉者担保的警戒。
- source_word: וּבְעַד
  choice: 既为
  rationale: בעד在这里表达代表或为了某些人而承担责任；结合汉语并行句式，用“既为”自然引出担保对象及相应处置。
- source_word: נכרים
  choice: 外人
  rationale: 按所给WLC辅音及元音文本理解为复数“外人、外国人”；“外人”既保留社会距离，也避免把重点过度限定为国籍。
- source_word: חַבְלֵהוּ
  choice: 扣住他作抵押
  rationale: חבל在此涉及索取或扣留抵押，阳性单数宾语后缀直指“他”；译文据此保留以担保人为对象的读法，同时以脚注说明该短句也可能理解为从他那里取抵押物。
theological_decisions:
- issue: 末句阳性宾语后缀所指及抵押行为的对象
  choice: 正文译作“扣住他作抵押”，让־הוּ按语法形式指向担保人。
  alternative: “从他那里取抵押物”，或把先前提到的衣服理解为被扣留的抵押物。
  rationale: 希伯来语末句极简，חבל的法律用法与宾语后缀可产生不同聚焦。正文保留显性的阳性后缀，脚注则保存另一种在抵押语境中成立的理解，不把真正的歧义静默消除。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“作保／担保”和“抵押”传达古代债务保证的法律背景；前后分别用“陌生人”和“外人”，既反映זר与נכרים的词汇变化，又不把两者差异夸大。所有脚注标记均已置于正文。
