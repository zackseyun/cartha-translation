  text: “Bad[a], bad,” says the buyer; but when he goes away, then he boasts.
translation:
  language: zh_hans
  text: 买主说：“不好，不好！”[a]走开后，他却自夸。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不值钱，不值钱！”或“太差了，太差了！”希伯来文重复“坏／不好”以加强语气，反映买主故意贬低货物的价值，以便压价。
    reason: lexical_alternative
lexical_decisions:
- source_word: רַע רַע
  choice: “不好，不好”
  rationale: 保留希伯来文的重复和简短语气，体现买主在讨价还价时故意贬低货物；现代汉语中自然、易懂。
- source_word: יֹאמַר
  choice: 说
  rationale: 未完成式在箴言中表达一般、反复出现的情形，译作现在性的“说”最符合汉语格言体。
- source_word: הַקּוֹנֶה
  choice: 买主
  rationale: 准确表达 קנה 在交易语境中的购买者，且比“购买者”更贴近日常讨价还价的场景。
- source_word: וְאֹזֵל לוֹ
  choice: 等他离开后
  rationale: 顺畅表达买主贬价之后离去的场景；“等……后”带出与后句的时间关系，לוֹ 在此不另作强调。
- source_word: אָז
  choice: 就
  rationale: 与“等……后”配合，简洁标明随后发生的动作。
- source_word: יִתְהַלָּל
  choice: 夸耀自己
  rationale: 该词的 Hitpael 形式表示自我夸耀、自鸣得意；明确译出反身意味，同时保留其贬义色彩。
