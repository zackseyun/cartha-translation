  to: 王的威吓，如少壮狮子的吼声[a]；惹他发怒的，危害自己的性命[b]。
  rationale: 修订以“威吓”替代“威严”，使首句与狮子威吓性的声音相对应，并更贴合 אֵימַת 的语义。后句改用现代汉语可理解的“危害自己的性命”，呈现触怒君王所导致的自我毁损；脚注保留原文 חוֹטֵא 与 nephesh 所形成的较字面、具有张力的表达。
