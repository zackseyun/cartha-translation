base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/002.yaml
  text: The terror of a king is like the growling of a young lion[c][b][a]; whoever provokes him to anger sins against his own life.
translation:
  language: zh_hans
  text: 王的威吓，如少壮狮子的吼声[a]；惹他发怒的，危害自己的性命[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “吼声”也可译作“低吼声”或“咆哮声”。“王的威吓”也可译作“王的可畏之处”。
    reason: lexical_alternative
  - marker: b
    text: 直译可作“向自己的性命犯错”或“得罪自己的性命”。希伯来语“נפש”（nephesh）可依语境指“性命”、“自己”或“魂”；此处指危及自身生命。
    reason: lexical_alternative
lexical_decisions:
- source_word: נַהַם
  choice: 吼声
  rationale: 该名词指狮子发出的威吓声；“吼声”在现代汉语中自然庄重，也保留其震慑意味。“低吼声”亦可能，但原词未明确限定音量。
- source_word: כְּפִיר
  choice: 少壮狮子
  rationale: 该词通常指年轻而强健、具有威胁性的狮子；“少壮狮子”比泛称“狮子”更能保留词义的具体性。
- source_word: אֵימַת
  choice: 威严
  rationale: 此处指君王所激起的畏惧和震慑。“威严”符合汉语箴言体，既表达令人敬畏的权势，也避免将君王本人直接等同于“恐怖”；脚注保留更强烈的“可畏之处”。
- source_word: מִתְעַבְּרוֹ
  choice: 谁惹他发怒
  rationale: 该形式在此表示招惹君王、激起他的怒气；这样译出第三人称后缀所指的君王，并使汉语语义明确自然。
- source_word: חוֹטֵא
  choice: 得罪
  rationale: חטא保留道德性的“犯罪、得罪”含义；“得罪自己的性命”也再现原文不同寻常的搭配，不将其弱化为纯粹的利害判断。
- source_word: נַפְשׁוֹ
  choice: 自己的性命
  rationale: נפש在此可指人的生命、自身或魂；上下文警告招惹王怒会危及生命，因此正文采用“自己的性命”，并以脚注保留其他可能。
theological_decisions:
- issue: חוֹטֵא נַפְשׁוֹ的道德语言与自害含义
  choice: 得罪自己的性命
  alternative: 伤害自己／拿自己的性命犯罪
  rationale: 原文既使用“犯罪、得罪”的词，又以נפש为宾语，形成有意的张力。正文不把它单纯解释成“自取灭亡”，以免消除其道德色彩和原有表达。
translation_notes:
  register: 采用现代、凝练而庄重的箴言体。“谁……谁……”使后半句在普通话中清楚有力；保留“得罪自己的性命”这一略带陌生感的表达，以反映希伯来原文的神学与修辞张力。
