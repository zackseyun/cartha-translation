  text: Steadfast love and faithfulness preserve a king[c][b][a], and by steadfast love his throne is upheld.
translation:
  language: zh_hans
  text: 慈爱与信实[a]保守[b]君王；他以慈爱巩固自己的宝座。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “信实”也可译作“真实”或“可靠”；本句与“慈爱”并列，较侧重忠诚可靠的品格。
    reason: lexical_alternative
  - marker: b
    text: “保守”也可译作“守护”或“护卫”。
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶסֶד
  choice: 慈爱
  rationale: 此词兼有仁爱、忠诚和持久委身之意。“慈爱”在现代中文圣经语体中自然庄重，也能在上下两句中重复使用，以保留希伯来文的呼应。
- source_word: אֱמֶת
  choice: 信实
  rationale: 与חֶסֶד并列时，此词侧重可靠、忠诚的品格，而非抽象的“真理”；“信实”最切合本句伦理和治国语境。
- source_word: יִצְּרוּ
  choice: 保守
  rationale: נצר在此意为守护、保存，使之得以维系；“保守”既保留保护含义，也适合以美德维系君王的语境。
- source_word: מֶלֶךְ
  choice: 君王
  rationale: 原文无定冠词，是智慧文学中的泛指。“君王”在中文中可自然表达这一一般性对象，无须添加“一个”。
- source_word: סָעַד
  choice: 稳固
  rationale: 该动词表示支撑、扶持。译为“稳固”自然表达宝座因慈爱得到支撑并持续安定的结果，同时保留王权意象。
- source_word: בַּחֶסֶד
  choice: 因慈爱
  rationale: 介词ב在此可表示凭借的手段或依据；“因慈爱”简洁自然，说明宝座藉此得到支撑。
- source_word: כִּסְאוֹ
  choice: 他的宝座
  rationale: 直译带第三人称阳性单数后缀的名词，保留以“宝座”指代君王统治的具体意象。
