  text: נֵ֣ר יְ֭הוָה נִשְׁמַ֣ת אָדָ֑ם חֹ֝פֵ֗שׂ כָּל חַדְרֵי בָֽטֶן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/027.yaml
  text: The spirit of man is the lamp of Yahweh[b][a], searching all the innermost chambers of the belly.
translation:
  language: zh_hans
  text: 人的灵[a]是耶和华的灯，探察人内心一切隐秘之处[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“人的气息”或“人的生命之气”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译：“腹中的一切内室”，是指人最深、最隐秘的内在部分。
    reason: cultural_note
lexical_decisions:
- source_word: נֵר
  choice: 灯
  rationale: 保留具体的灯盏意象；它照亮并显露隐藏之处，比抽象的“光”更贴近原词。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神名音译，不以称号“主”代替原文专名。
- source_word: נִשְׁמַת
  choice: 气息
  rationale: נשמה首先可指气息、生命之气，也可引申为人的灵；“气息”保留此处真实的词义与歧义，并在脚注列出“灵”。
- source_word: אָדָם
  choice: 人
  rationale: 此处是泛指单数，现代汉语“人”自然涵盖一般人类个体，无须加入性别限定。
- source_word: חֹפֵשׂ
  choice: 探察
  rationale: 表达持续而深入地搜寻、查验，也与灯照见隐秘之处的比喻相配。
- source_word: כָּל חַדְרֵי בָטֶן
  choice: 人内心最深处
  rationale: 原文直译为“腹中的一切内室”，是指人最深层、隐秘的内在领域；正文按现代汉语习惯传达其惯用意义，脚注保存具体意象。
theological_decisions:
- issue: נִשְׁמַת אָדָם 的人论含义
  choice: 正文译作“人的气息”，同时以脚注保留“人的灵”这一可能译法。
  alternative: 直接译作“人的灵”，或解释为“良心”。
  rationale: 原词兼有气息、生命之气和灵的语义范围。正文采用较具体的基本义，脚注保存引申义；原文并未明说“良心”，故不把该神学解释写入正文。
- issue: 灯与“探察”之间的施事关系
  choice: 按希伯来语诗句的自然衔接，让“耶和华的灯”成为探察人内在深处的意象。
  alternative: 明确增译为“耶和华借此探察”，或理解为人的灵自行省察。
  rationale: 原文分词的主语关系具有一定开放性，不增补未明说的施事者，以保存比喻和神学张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“人的气息”略带诗性，呼应希伯来文具体意象；“内心最深处”避免生硬直译，同时由脚注保留“腹中内室”的原文图景。
