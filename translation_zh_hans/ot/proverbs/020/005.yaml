base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/005.yaml
  text: Counsel in a man's heart is like deep water[b][a], but a man of understanding draws it out.
translation:
  language: zh_hans
  text: 人心里的筹算如同深水；明哲人却能把它汲取出来。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַיִם עֲמֻקִּים
  choice: 深水
  rationale: 希伯来语直译为“深的水”，形态上是复数；现代汉语以“深水”作集合性表达更自然，同时保留深藏、不易触及的比喻。
- source_word: עֵצָה
  choice: 谋略
  rationale: 此词可指计谋、筹划、劝告或意图；在“人心中”的语境里，“谋略”较好地表达内在的盘算与主意，又保留智慧文学的语感。
- source_word: בְלֶב אִישׁ
  choice: 人心中
  rationale: לֵב 在希伯来语中涵盖思想、意志和内在生命，不仅指情感；“人心中”在现代汉语里自然，并保留原文的内在性。אִישׁ 在本箴言中作泛指。
- source_word: וְאִישׁ תְּבוּנָה
  choice: 明哲人却
  rationale: תְּבוּנָה 指理解力、洞察力或明辨能力；“明哲人”符合汉语智慧文学的庄重语体。连接词 וְ 依两句之间的对照关系译为“却”。
- source_word: יִדְלֶנָּה
  choice: 能把它汲取出来
  rationale: 动词 דלה 描写从井或深处汲水；此处保留汲水意象，也表达明哲人能引出别人心中深藏的谋略。未把未完成式机械地译成将来时，而按箴言的一般性陈述译为“能……”。
theological_decisions: []
translation_notes:
  register: 采用现代、简洁而庄重的箴言体。“如同深水”保留原文前置比喻的鲜明感；“汲取出来”贯通上下句的水井意象。
