base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/018.yaml
  text: Plans are established by counsel[a]; wage war with strategy.
translation:
  language: zh_hans
  text: 计划借着商议得以确立；作战要凭策略。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַחֲשָׁבוֹת
  choice: 谋划
  rationale: 此处指预定的行动方案，而非单纯的内心思想；“谋划”符合智慧文学的实践语境，也与下半句的作战相呼应。
- source_word: בְּעֵצָה
  choice: 因商议
  rationale: 介词 בְּ 在此表示手段或凭借；“商议”既可表达听取意见，也保留共同谋定之意。
- source_word: תִכּוֹן
  choice: 立定
  rationale: כון 的尼法勒形表示被确立、变得稳固；“立定”简洁保留被建立稳固的含义。
- source_word: וּבְתַחְבֻּלוֹת
  choice: 凭策略
  rationale: תַּחְבֻּלוֹת 本有掌舵、巧妙引导的意象，在军事语境中自然指周密的策略或战术指导；“策略”准确衔接作战语境。
- source_word: עֲשֵׂה
  choice: 作战
  rationale: עשה 与 מִלְחָמָה 构成“进行战争”的习语；现代汉语用“作战”自然有力。
- source_word: מִלְחָמָה
  choice: 战
  rationale: 该词可指战争、争战；与 עשה 合译为“作战”，避免生硬的“制造战争”。
theological_decisions: []
translation_notes:
  register: 采用简洁、对称的箴言体。“谋划—商议—立定”呈现上半句的智慧判断，“凭策略作战”保留下半句的军事力度。原文没有必须另加注释才能保留的歧义，因此不设脚注。
