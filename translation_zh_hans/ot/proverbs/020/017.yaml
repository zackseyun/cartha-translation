revisions:
- from: 以虚假得来的食物，人尝着甘甜；后来，他的口中却要塞满砂石。[a]
  to: 靠欺骗得来的食物，对人是甘甜的；后来，他的口中却必充满砂砾。[a]
  rationale: 修订使汉语更自然，并将“口中被充满”的结果状态准确表达为“必充满”，避免“塞满”所带出的额外施事动作。“砂砾”更准确对应原文的小石、砾石。脚注保留希伯来语构词的字面歧义，避免将“虚假之食物”仅限定为不义所得。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T06:58:51Z'
