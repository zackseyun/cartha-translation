base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/017.yaml
  text: Bread of deceit is sweet to a man[b][a], but afterward his mouth is filled with gravel.
translation:
  language: zh_hans
  text: 靠欺骗得来的食物，对人是甘甜的；后来，他的口中却必充满砂砾。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “靠欺骗得来的食物”直译为“虚假之食物”；也可译为“虚假（或谎言）的食物”。
    reason: lexical_alternative
lexical_decisions:
- source_word: עָרֵב
  choice: 甘甜
  rationale: 此词可指悦人、可喜；在食物与口腔的意象中译为“甘甜”，既自然，也保留与后文砂石形成的讽刺性反差。
- source_word: לָאִישׁ
  choice: 人
  rationale: 希伯来语为阳性单数，但在此作代表性泛指；现代汉语用“人”即可保留单数泛指，而不必添加性别。
- source_word: לֶחֶם
  choice: 食物
  rationale: לֶחֶם可具体指饼，也可泛指食物。汉语若说“虚假的饼”容易被理解为饼本身不真实；译作“食物”更清楚地传达所得之物，同时仍与“尝着”和“口中”的饮食意象相连。
- source_word: שָׁקֶר
  choice: 以虚假得来的
  rationale: 字面为“虚假之食物”。此处自然理解为借欺骗或虚假手段取得的食物；采用关系性表达，使现代汉语清楚，同时脚注保留字面结构及其较宽泛的语义。
- source_word: וְאַחַר
  choice: 后来……却
  rationale: “后来”表达时间推进，“却”体现前后两句之间由甘甜转为痛苦的强烈反差。
- source_word: יִמָּלֵא
  choice: 要塞满
  rationale: 尼法勒未完成式可表达随后必然出现的结果；“要”保留未来、结果意味，“塞满”比单纯“充满”更贴合口中砂石的具体而令人不适的画面。
- source_word: פִיהוּ
  choice: 他的口中
  rationale: 忠实保留第三人称单数及全句核心的口腔意象。
- source_word: חָצָץ
  choice: 砂石
  rationale: 此名词指碎石、小石子或砾石。“砂石”是自然且鲜明的现代汉语表达，能传达入口后的粗硬与痛苦。
theological_decisions: []
translation_notes:
  register: 采用现代、凝练而庄重的箴言体。前句用“尝着甘甜”，后句用“口中却要塞满砂石”，保留饮食与口腔意象以及由短暂享受转为痛苦后果的对照。
