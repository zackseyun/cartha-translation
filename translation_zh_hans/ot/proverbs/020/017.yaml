  source_fidelity: 译文正确呈现了由短暂甘甜转为痛苦后果的对比，也把שָׁקֶר合理理解为以欺骗手段所得。不过“塞满”容易暗示有某个施事者把砂石塞入口中；原文尼法勒式所表达的是“口中被/充满”。“砂砾”比“砂石”更准确对应חָצָץ（碎石、砾石）。
  naturalness: “以虚假得来的食物”在现代汉语中略显生硬；“靠欺骗得来的食物”更自然。将“要塞满”改为“必充满”既保留结果性的将来意味，也更合乎汉语及原文语态。
  terminology: “食物”可保留לֶחֶם在此处可泛指食物的用法；脚注保留“虚假之食物”的字面构造，并说明“靠欺骗得来的食物”是语境化理解。
