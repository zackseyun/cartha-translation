  text: A king sitting on a throne of judgment winnows all evil with his eyes[a][b].
translation:
  language: zh_hans
  text: 君王坐在审判的宝座上，以目光簸扬一切邪恶[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“驱散”或“筛除”。希伯来语动词带有扬场簸谷的意象，即把无用的糠秕与有用的谷粒分开。
    reason: lexical_alternative
  - marker: b
    text: 或译“所有恶人”。希伯来语既可泛指邪恶，也可由语境引申为受审判的作恶者。
    reason: lexical_alternative
lexical_decisions:
- source_word: מֶלֶךְ
  choice: 君王
  rationale: 原文无定冠词，在箴言中泛指履行审判职责的君王；汉语“君王”无需另加“一位”也可自然表达通则。
- source_word: יוֹשֵׁב עַל כִּסֵּא דִין
  choice: 坐在审判的宝座上
  rationale: 保留分词所呈现的持续姿态，以及“宝座”所体现的王权场景；“审判的宝座”兼顾司法裁断之意。
- source_word: מְזָרֶה
  choice: 簸散
  rationale: 该词源于扬场簸谷的动作，指把糠秕与谷粒分开；“簸散”既保留农业隐喻，也表达辨明并清除邪恶的含义。
- source_word: בְעֵינָיו
  choice: 用目光
  rationale: 介词可表工具或方式；“用目光”自然地呈现君王凭洞察审视、分辨邪恶的图像。
- source_word: כָּל רָע
  choice: 一切邪恶
  rationale: רָע 可指抽象的邪恶，也可在语境中暗指恶人或恶事；正文采用较宽泛的“一切邪恶”，不把所指限定为人。
