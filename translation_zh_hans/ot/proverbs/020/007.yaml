base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/007.yaml
  text: A righteous man walks in his integrity[b][a]; blessed are his children after him.
translation:
  language: zh_hans
  text: 行事纯正的义人；他的儿女在他之后有福。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִתְהַלֵּךְ
  choice: 行事
  rationale: 该词为הלך的Hitpael分词，在此指持续的生活方式或为人处世；“行事”自然传达其伦理含义，同时保留动态表达。
- source_word: בְּתֻמּוֹ
  choice: 按自己的纯正
  rationale: תֹּם表示品格的完整、正直或无可指摘；“纯正”能体现内外一致的道德完整性，“按”对应介词ב所表达的行为准则或方式。
- source_word: צַדִּיק
  choice: 义人
  rationale: 希伯来语为阳性单数，作为箴言中的典型人物；汉语“义人”简洁庄重，也可自然表达代表性称谓。
- source_word: אַשְׁרֵי
  choice: 有福了
  rationale: 该感叹形式宣告一个人处于可羡慕、蒙福的景况；“有福了”保留智慧文学的庄重语域，不把含义缩减为主观快乐。
- source_word: בָנָיו
  choice: 他的儿女
  rationale: בנים虽在形式上可指“儿子们”，也常泛指后代或子女；上下文并未限定只有男性后代，“儿女”在现代汉语中准确自然。
- source_word: אַחֲרָיו
  choice: 在他之后
  rationale: 直译为“在他后面/之后”，可指时间和承继关系；保留“在他之后”以不强行限定为效法他或仅指身后。
theological_decisions:
- issue: 箴言中阳性单数的代表性表达
  choice: 义人
  alternative: 正直的人
  rationale: 原文使用阳性单数צַדִּיק描绘典型的义者。汉语“义人”既贴近原文和圣经智慧文学语域，也不必额外加入性别限定。
- issue: 义人的纯正与儿女蒙福之间的关系
  choice: 保留并列陈述，不明说因果机制
  alternative: 所以他的儿女必蒙福
  rationale: 原文后半句以אַשְׁרֵי作感叹性宣告，并无显式因果连接词；译文不加入“所以”或“必”，以保留箴言的概括性及其中未明说的关系。
translation_notes:
  register: 采用简洁、庄重而通顺的现代标准汉语。“按自己的纯正行事”保留原文关于持续生活方式的伦理重点；分号呈现两分句之间紧密但未显式界定的关系。
