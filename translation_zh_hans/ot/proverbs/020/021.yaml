base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/021.yaml
  text: An inheritance gained hastily at first will not be blessed in the end[a].
translation:
  language: zh_hans
  text: 起初匆忙得来的遗产，结局必不蒙福[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“一开始很快得来的遗产。”这里的希伯来词可能强调取得过快、过早，或带有贪婪、急于求成的意味。
    reason: 词义存在可保留的多重侧重：速度、时机过早，或贪切取得的心态。
lexical_decisions:
- source_word: נַחֲלָה
  choice: 遗产
  rationale: 此词指承受而来的财产或产业；“遗产”在现代汉语中最直接地表达继承所得，也符合本箴言所谈的财富语境。
- source_word: מבחלת
  choice: 仓促得来
  rationale: 按通常理解，此词表达急速、过早或带着贪急之心取得。“仓促得来”既保留速度意味，也暗示取得方式欠妥，同时不把具体情形说死。
- source_word: בָּרִאשֹׁנָה
  choice: 起初
  rationale: 此时间用语指事情开始或早期阶段；“起初”简洁自然，并与后面的“最终”形成清楚对照。
- source_word: וְאַחֲרִיתָהּ
  choice: 最终
  rationale: 原文直指“它的结局、末后”；“最终”在汉语箴言体中自然地呈现最后结果，并保留首尾对照。
- source_word: לֹא תְבֹרָךְ
  choice: 不会蒙福
  rationale: 原文使用“赐福”的被动形式。“蒙福”保留神学上的广度，不把意义缩减为物质上的兴旺，也不明说福分被撤回的具体机制。
theological_decisions:
- issue: 本箴言警告的性质
  choice: 急切取得的遗产，其最终结局不会蒙福，但不具体说明这是直接审判还是道德秩序所带来的后果。
  alternative: 明确译成贪婪必受上帝审判，或仅解释为急躁造成的实际损失。
  rationale: 智慧文学常以福分与结局来表达道德秩序。译文保留“蒙福”的神学张力，既不把它限定为显明的神罚，也不将它弱化为纯粹自然或经济后果。
translation_notes:
  register: 采用现代、简洁而庄重的箴言体。“起初……最终……”保留原文的首尾对照；“仓促得来”通俗自然，并避免过度解释具体的不当取得方式。
