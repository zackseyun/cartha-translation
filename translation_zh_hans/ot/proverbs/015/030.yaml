  text: מְֽאוֹר עֵ֭ינַיִם יְשַׂמַּֽח לֵ֑ב שְׁמוּעָ֥ה ט֝וֹבָ֗ה תְּדַשֶּׁן עָֽצֶם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/030.yaml
  text: The light of the eyes gladdens the heart[b][a]; good news fattens the bones.
translation:
  language: zh_hans
  text: 眼中的光使心喜乐[a]；好消息使骨头肥壮[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“明亮的眼神”，即喜悦、有神采的目光。
    reason: lexical_alternative
  - marker: b
    text: 原文直译“使骨头肥壮”；这是形容人从身体深处得到活力和振奋的说法。
    reason: cultural_note
lexical_decisions:
- source_word: מְאוֹר עֵינַיִם
  choice: 眼中的光
  rationale: 保留希伯来文“眼睛之光”的具体意象，同时中文“眼中的光”可自然指明亮、有神采的目光，而不把含义限定为某一种表情。
- source_word: יְשַׂמַּח לֵב
  choice: 使心喜乐
  rationale: 准确表达使役语气，并保留“心”所指向的内在生命这一希伯来表达。
- source_word: שְׁמוּעָה טוֹבָה
  choice: 好消息
  rationale: 这是现代汉语中自然明白的搭配，也准确表达“好的消息或传闻”。
- source_word: תְּדַשֶּׁן עָצֶם
  choice: 使骨头肥壮
  rationale: 保留“使肥润、丰足”的强烈身体意象；“骨头”按集合意义处理。“肥壮”比单说“滋润”更接近原文，同时在汉语中仍可表达身体深处获得活力。
theological_decisions: []
translation_notes:
  register: 采用简洁、对称的箴言体。“眼中的光”与“骨头肥壮”保留原文具体而富有身体感的意象；脚注说明其可能含义，正文不将诗性表达过度解释。
