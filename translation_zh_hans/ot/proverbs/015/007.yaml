  text: שִׂפְתֵ֣י חֲ֭כָמִים יְזָ֣רוּ דָ֑עַת וְ/לֵ֖ב כְּסִילִ֣ים לֹא כֵֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/007.yaml
  text: The lips of the wise spread knowledge[b][a], but the heart of fools is not so.
translation:
  language: zh_hans
  text: 智慧人的嘴唇传播知识[a]；愚昧人的心却不是这样[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “传播”所译的希伯来文动词有“撒开、扬散”的意象，也可译作“散布知识”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文此处是省略句，直译为“愚昧人的心，却不这样”。按上下文，意思可能是愚昧人不会像智慧人那样传播知识。
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂפְתֵי
  choice: ……的嘴唇
  rationale: 保留希伯来文具体的身体意象，并以汉语领属结构自然表达其构造关系。
- source_word: חֲכָמִים
  choice: 智慧人
  rationale: 作为复数实体化形容词，泛指有智慧的一类人；此译法简洁，且符合《箴言》的现代汉语表达。
- source_word: יְזָרוּ
  choice: 传播
  rationale: 原动词常有“撒开、扬散”的意象；以知识为宾语时，“传播”既自然，又保留使之广泛散布的核心含义。
- source_word: דָעַת
  choice: 知识
  rationale: 直译该词，也符合智慧文学中的常用含义。
- source_word: לֵב
  choice: 心
  rationale: 保留《箴言》中重要的“心”之意象；这里可涵盖思想、判断和内在倾向，不窄化为单纯的情感。
- source_word: כְּסִילִים
  choice: 愚昧人
  rationale: 该智慧文学术语不只指智力不足，也常带有道德迟钝、顽梗之意；“愚昧人”较能保留这一类别性含义。
- source_word: לֹא כֵן
  choice: 却不是这样
  rationale: 保留原文简短而省略的判断，不明确补成“不会传播知识”或“并不正直”，从而维持其开放的指向。
theological_decisions:
- issue: 后半句省略谓语所产生的含义张力
  choice: 译作“愚昧人的心却不是这样”
  alternative: “愚昧人的心不传播知识”或“愚昧人的心并不正直”
  rationale: 希伯来文直陈“而愚昧人的心，不如此”，没有明说所省略的谓语。正文保留这种省略，避免将解释写入经文；脚注说明最直接的语境理解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“智慧人／愚昧人”保持箴言式的类型对照；分号凸显两小句的反衬。脚注标记均置于相关正文之后。
