  text: אִ֣ישׁ חֵ֭מָה יְגָרֶ֣ה מָד֑וֹן וְ/אֶ֥רֶך אַ֝פַּ֗יִם יַשְׁקִ֥יט רִֽיב׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/018.yaml
  text: A hot-tempered man stirs up strife[c][b][a], but one who is slow to anger quiets a dispute.
translation:
  language: zh_hans
  text: 脾气暴躁的人挑起纷争；不轻易发怒的人[a]却平息争端。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “不轻易发怒”直译为“鼻孔长”，是希伯来语习语，指能克制怒气、迟迟不发怒。
    reason: cultural_note
lexical_decisions:
- source_word: אִישׁ חֵמָה
  choice: 脾气暴躁的人
  rationale: 该短语直指“盛怒之人”，在箴言中刻画一种典型性情；译为“脾气暴躁的人”既传达怒气炽烈、容易发作之意，也符合现代汉语的箴言表达。
- source_word: יְגָרֶה
  choice: 挑起
  rationale: גרה 的 Piel 形表示激起、招惹或煽动；“挑起”能自然呈现主动引发冲突的使动含义。
- source_word: מָדוֹן
  choice: 纷争
  rationale: 该词常指争执、冲突或不和；“纷争”简洁庄重，并适合智慧文学语境。
- source_word: אֶרֶךְ אַפַּיִם
  choice: 不轻易发怒
  rationale: 这是希伯来语习语，字面为“鼻孔长”，意指怒气迟缓、能够忍耐克制；“不轻易发怒”保留了与怒气的直接语义联系，又是自然现代汉语。
- source_word: יַשְׁקִיט
  choice: 平息
  rationale: שקט 的 Hiphil 形表示使之安静、止息；“平息”准确表达使争执停下来的使动意义。
- source_word: רִיב
  choice: 争端
  rationale: 该词可指争吵、争议或诉讼；此处与 מָדוֹן 平行，语境没有明确限定为法律案件，因此用范围较广的“争端”。
theological_decisions: []
translation_notes:
  register: 采用简洁、对称的现代箴言体。“脾气暴躁”与“不轻易发怒”、“挑起”与“平息”、“纷争”与“争端”形成清晰对照；分号呈现希伯来诗句两行之间的转折关系。
