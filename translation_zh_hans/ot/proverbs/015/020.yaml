base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/020.yaml
  text: A wise son brings joy to his father[a], but a foolish man despises his mother.
translation:
  language: zh_hans
  text: '有智慧的儿子使父亲欢喜，

    愚昧人却藐视自己的母亲。'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֵּן חָכָם
  choice: 智慧的儿子
  rationale: בֵּן是阳性单数“儿子”，חָכָם在智慧文学中兼有实践与道德上的智慧之意；译文保留原文具体的亲属称谓。
- source_word: יְשַׂמַּח
  choice: 使……欢喜
  rationale: שׂמח的Piel形式表达使役意义，即“使某人欢喜”；这一译法准确且符合现代汉语。
- source_word: אָב
  choice: 父亲
  rationale: 原文无物主后缀，但“儿子”已确立亲属关系；汉语直接说“使父亲欢喜”自然清楚，无须补入“他的”。
- source_word: כְסִיל אָדָם
  choice: 愚昧人
  rationale: כְסִיל指在道德和判断上顽梗、缺乏智慧的人，אָדָם在此指一个人而非全人类。“愚昧人”是中文智慧文学中自然、凝练的表达，也不把含义弱化为单纯智力不足。
- source_word: בּוֹזֶה
  choice: 藐视
  rationale: 该分词表示惯常或具有特征性的轻蔑态度；“藐视”保留了原词强烈的贬抑意味。
- source_word: אִמּוֹ
  choice: 自己的母亲
  rationale: 原文带第三人称阳性单数物主后缀。中文用“自己的”明确母亲属于该句主语，并避免代词指向含混。
theological_decisions: []
