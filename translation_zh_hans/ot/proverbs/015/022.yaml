base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/022.yaml
  text: Plans fail for lack of counsel[a], but with many advisers they stand.
translation:
  language: zh_hans
  text: 没有商议，计划就会落空；谋士众多，计划就能确立。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“没有谋议，计划就会受挫；有许多谋士，计划便得以确立。”
    reason: lexical_alternative
lexical_decisions:
- source_word: הָפֵר
  choice: 落空
  rationale: 该词为 פרר 的使役形，在这里表达计划遭破坏、不能实现的结果。汉语“落空”自然简洁，也保留“受挫、归于无效”的含义。
- source_word: מַחֲשָׁבוֹת
  choice: 计划
  rationale: 此词可指思想、意图或谋划；上下文谈到商议和谋士，因此这里指经过筹划的方案或打算。
- source_word: בְּאֵין סוֹד
  choice: 不经商议
  rationale: בְּאֵין 表示缺少或没有；סוֹד 可指密谈、共同议事或审议。此处与“谋士众多”相对，重点是缺乏共同商议，而非秘密本身。
- source_word: וּבְרֹב יוֹעֲצִים
  choice: 谋士众多
  rationale: רֹב 表示数量多，יוֹעֲצִים 指提供谋略或劝告的人。“谋士”凝练庄重，适合箴言语体；分句关系在汉语中自然呈现为对比。
- source_word: תָּקוּם
  choice: 便能立定
  rationale: קום 可表示站立、确立或得以维持。阴性单数动词可承接计划这一集合概念；“立定”保留原文“站立”的形象，也表达计划得以确立。
theological_decisions: []
translation_notes:
  register: 采用现代、凝练而庄重的箴言体。正文以“不经商议”表达缺乏共同审议，以“落空／立定”构成鲜明对照；脚注保留 הָפֵר 可译为“受挫”、סוֹד 可强调“共同商议”、תָּקוּם 可译为“得以确立”的词义空间。
