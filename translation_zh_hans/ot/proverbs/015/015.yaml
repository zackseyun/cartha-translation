  yaml_path: translation/ot/proverbs/015/015.yaml
  text: All the days of the afflicted are bad[b][a], but a cheerful heart is a continual feast.
translation:
  language: zh_hans
  text: 凡困苦人的日子都艰难[a]；心中欢畅，常如筵席。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “困苦人”或译“穷人”；希伯来语 עָנִי 可指贫穷、受苦或受压迫的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל יְמֵי
  choice: 日子全都
  rationale: 保留“所有日子”的整体范围和希伯来文“日子”的意象，同时采用自然的现代汉语语序。
- source_word: עָנִי
  choice: 困苦人
  rationale: 该词可指贫穷、受苦或受压迫的人；“困苦人”涵盖面较广，不把含义局限于经济贫困。
- source_word: רָעִים
  choice: 不好过
  rationale: 此处描述日子的负面处境，并非道德上的“邪恶”；“不好过”在汉语中自然，也能表达生活艰难。
- source_word: וְטוֹב לֵב
  choice: 心里喜乐的人，却
  rationale: 该表达直译近于“心里美好/良善者”，在本箴言中主要指内在愉悦、安适的状态；以“心里喜乐的人”清楚传达此义，并用“却”表现对比。
- source_word: מִשְׁתֶּה
  choice: 筵席
  rationale: 该名词指宴饮或宴席；“筵席”简洁庄重，适合箴言体。
- source_word: תָמִיד
  choice: 常享
  rationale: 表示持续或经常如此；与“筵席”搭配为“常享筵席”，符合自然汉语，并保留持续性。
theological_decisions: []
translation_notes:
  register: 采用简洁、对称而有格言感的现代标准汉语。“不好过”避免把 רָעִים 误解为道德意义的“邪恶”；“心里喜乐的人”以自然表达呈现 טוֹב לֵב 所指的内在状态。脚注标记置于相关词语之后。
