  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: רָח֣וֹק יְ֭הוָה מֵ/רְשָׁעִ֑ים וּ/תְפִלַּ֖ת צַדִּיקִ֣ים יִשְׁמָֽע׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/029.yaml
  text: Yahweh is far from the wicked[a], but he hears the prayer of the righteous.
translation:
  language: zh_hans
  text: 耶和华远离恶人，却垂听义人的祷告。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רָחוֹק
  choice: 远离
  rationale: 作谓语表达道德和关系上的疏远，而非单指空间距离；“远离”简洁自然，并与下半句形成鲜明对照。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代汉语圣经读者熟悉的专名“耶和华”译出四字神名，不以称号代替。
- source_word: מֵרְשָׁעִים
  choice: 恶人
  rationale: 指以邪恶为特征的一类人；“恶人”保留智慧文学中简练的类别称谓，不缩窄为司法意义上的“有罪者”。
- source_word: וּתְפִלַּת
  choice: 却……祷告
  rationale: וְ形式上是普通连接词，但两分句在语义上构成反衬，因此用“却”自然传达其对比；תְּפִלָּה直译为“祷告”。
- source_word: צַדִּיקִים
  choice: 义人
  rationale: 指以公义为特征的人；“义人”是汉语智慧文学语境中准确、凝练且通行的类别称谓。
- source_word: יִשְׁמָע
  choice: 垂听
  rationale: שׁמע本义为听、听取；祷告语境中的“垂听”表达带有关注的听取，但不像“应允”那样把含义扩展为必然按所求成就。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；主
  rationale: 原文直接使用四字神名。译作“耶和华”保留其专名性质，也符合现代汉语圣经传统中的普遍辨识度；不以“主”这一称号替代。
- issue: 耶和华“远离”恶人的含义
  choice: 保留道德与关系上的疏远，不解释为空间上的缺席或认知上的不能听见
  alternative: 神在空间上不在恶人附近；神在任何意义上都听不见恶人
  rationale: רָחוֹק在此与“垂听义人的祷告”相对，重点是神不向恶人施予悦纳的亲近和关注，而非断言神受空间限制或全然不知其言语。
- issue: “垂听”是否等于必然应允
  choice: 表达神留意并悦纳义人的祷告，但不明说每项请求都必按祈求者所想的方式实现
  alternative: 直接译为“应允”
  rationale: יִשְׁמָע的词面意义是“听”；祷告语境可含有积极关注，但译成“应允”会比原文更明确，因而保留其张力。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语，保持箴言上下两分句的对偶和反衬。“耶和华—恶人—义人—祷告”均使用普通读者熟悉的圣经词汇；全句无需脚注。
