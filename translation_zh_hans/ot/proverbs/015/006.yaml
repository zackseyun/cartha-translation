base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/006.yaml
  text: In the house of the righteous there is great wealth[b][a], but in the income of the wicked there is trouble.
translation:
  language: zh_hans
  text: 义人家中有丰厚的财富，恶人的收成[a]却有祸患[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “收成”也可译作“出产”“所得”或“收益”。
    reason: lexical_alternative
  - marker: b
    text: “有祸患”也可译作“受搅扰”或“遭败坏”；希伯来语动词可表达扰乱、祸患或毁坏。
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּית צַדִּיק
  choice: 义人家中
  rationale: בֵּית 是“房屋、家、家业”的构造形式；与 צַדִּיק 连用时，可指义人的家及其中的产业。“义人家中”保留具体的“家”这一意象，也符合现代汉语表达。
- source_word: חֹסֶן רָב
  choice: 丰厚的财富
  rationale: חֹסֶן 可指财富、财宝或资源，רָב 表示多、丰盛。这里与下半句的经济或农业所得形成对照，译作“丰厚的财富”自然且贴合语境。
- source_word: וּבִתְבוּאַת
  choice: 恶人的收成……却
  rationale: וְ 在对偶关系中具有转折意味，译作“却”。תְבוּאָה 的基本意象是土地的出产、收成，也可延伸指所得或收益；正文采用较具体的“收成”，其他可能含义置于脚注。
- source_word: רָשָׁע
  choice: 恶人
  rationale: 该词在此作名词使用，与“义人”构成箴言式对照；单数具有泛指和代表性，汉语“恶人”可自然保留这种用法。
- source_word: נֶעְכָּרֶת
  choice: 遭受祸患
  rationale: 该阴性动词与 תְבוּאָה 呼应，词根 עכר 可表达搅扰、使陷入祸患或败坏。正文“遭受祸患”兼顾受事性质与通顺表达，同时以脚注保留“受搅扰、遭败坏”等可能性。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语，以简洁的对偶句式呈现箴言风格。“家中”“财富”“收成”“祸患”均为普通读者易懂的词语；正文不把箴言的一般性观察扩写为无条件的物质应许。
