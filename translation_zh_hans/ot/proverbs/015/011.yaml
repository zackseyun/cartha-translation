id: PRO.15.11
reference: Proverbs 15:11
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: שְׁא֣וֹל וַ֭/אֲבַדּוֹן נֶ֣גֶד יְהוָ֑ה אַ֝֗ף כִּֽי לִבּ֥וֹת בְּֽנֵי אָדָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/011.yaml
  text: Sheol and Abaddon lie open before Yahweh[b][a]; how much more the hearts of the sons of man.
translation:
  language: zh_hans
  text: 阴间和亚巴顿[a]在雅威面前尚且显露无遗，何况世人[b]的心呢！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “亚巴顿”也可译作“毁灭”或“灭亡之地”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译为“人的众子”，这里泛指世人。
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁאוֹל
  choice: 阴间
  rationale: 指死者所在的领域；采用现代中文圣经语境中较易理解的传统译法，同时不把它缩减为单指坟墓。
- source_word: אֲבַדּוֹן
  choice: 亚巴顿
  rationale: 音译以保留它与“阴间”并列时近似专名、指向毁灭领域的意味；其“毁灭／灭亡之地”的词义另以脚注说明。
- source_word: נֶגֶד
  choice: 在……面前显露无遗
  rationale: 该词基本义为“在……面前”；在本箴言中表达连最隐秘的死亡领域也完全处于雅威察看之下，故用自然中文呈现其语境含义。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译保留希伯来文的神圣名字，不以称号替代。
- source_word: אַף כִּי
  choice: 尚且……何况……
  rationale: 准确表达由较难设想之事推及更明显之事的递进论证。
- source_word: לִבּוֹת
  choice: 心
  rationale: 保留希伯来文“心”的意象；此处涵盖人的思想、意愿和内在动机。
- source_word: בְּנֵי אָדָם
  choice: 世人
  rationale: 该希伯来习语字面为“人的儿子们”，实际泛指人类；“世人”在现代中文中简洁自然，并以脚注保留字面信息。
theological_decisions:
- issue: 是否将 שְׁאוֹל 与 אֲבַדּוֹן 具体化为某种后世来世教义
  choice: 译作“阴间和亚巴顿”，保留死亡领域与毁灭领域的并列
  alternative: 坟墓和毁灭／死者之境和灭亡之地
  rationale: 原文强调在人的视野中最幽暗隐秘的领域也无法向雅威隐藏，但没有细述其性质；译文不引入更具体的来世体系。
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华／主
  rationale: 原文直接使用四字神名；音译能保留其专名性质。
- issue: בְּנֵי אָדָם 的性别与范围
  choice: 世人
  alternative: 人的众子／人类
  rationale: 该阳性复数习语在此泛指所有人，并非只指男性；正文采用自然且范围准确的中文，脚注说明字面形式。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。以“尚且……何况……”再现箴言的递进论证；“显露无遗”明确表达一切都无法躲避雅威察看的语境含义。
