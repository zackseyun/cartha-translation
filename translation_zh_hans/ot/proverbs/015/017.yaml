  text: Better is a meal of vegetables where there is love than a fattened ox with hatred[a][b].
translation:
  language: zh_hans
  text: 有爱相伴的一餐蔬菜，胜过一头肥壮的牛[a]，那里却有恨意[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“一头槽养的牛”。希伯来语可侧重牛在槽中喂养，也可侧重由此养肥的状态。
    reason: lexical_alternative
  - marker: b
    text: 直译“其中有恨”；“其中”可能指这顿饭，也可能泛指用餐或家庭的处境。
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: 胜过
  rationale: 本节以מִן构成比较，טוֹב在此表示“更好”；用“胜过”自然呈现箴言的比较句式。
- source_word: אֲרֻחַת יָרָק
  choice: 一餐蔬菜
  rationale: אֲרֻחַת指一餐或一份食物，יָרָק泛指供食用的绿色植物、蔬菜；“一餐蔬菜”既简洁，也保留家常饭食的场景。
- source_word: וְאַהֲבָה שָׁם
  choice: 有爱相伴
  rationale: 希伯来文直译为“爱在那里”；此译自然表达席间或家中有爱的处境，同时不把“爱”缩限为某种特定关系。
- source_word: שׁוֹר אָבוּס
  choice: 一头肥牛
  rationale: שׁוֹר是牛、公牛或阉牛；אָבוּס可指槽养、喂肥或由此形成的肥壮状态。“肥牛”突出与蔬菜薄餐相对的丰盛筵席，相关词义差异收入脚注。
- source_word: וְשִׂנְאָה בוֹ
  choice: 含恨相对
  rationale: 原文直译为“恨在其中”；“含恨相对”在现代汉语中自然地表达同席或同处者之间充满仇恨，同时以脚注保留代词בוֹ所指对象的含混性。
