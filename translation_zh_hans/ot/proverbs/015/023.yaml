  text: שִׂמְחָ֣ה לָ֭/אִישׁ בְּ/מַעֲנֵה פִ֑י/ו וְ/דָבָ֖ר בְּ/עִתּ֣/וֹ מַה טּֽוֹב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/023.yaml
  text: A man has joy in the answer of his mouth[b][a], and a word in its time—how good it is!
translation:
  language: zh_hans
  text: 人因口中的回答而喜乐；一句话说得正是时候[a]，多么美好！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “说得正是时候”直译为“在它的时候”，也可译作“说得合时”或“说得恰逢其时”。
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂמְחָה
  choice: 喜乐
  rationale: 该名词表示欢喜、快乐；“喜乐”简洁庄重，也能表达作出合宜回答所带来的满足。
- source_word: לָאִישׁ
  choice: 人……喜乐
  rationale: ל 表示归属或受益，אִישׁ 在此作泛指。译作“人因……而喜乐”既保留单数泛指的意义，也符合现代汉语表达。
- source_word: בְּמַעֲנֵה
  choice: 因……回答
  rationale: מַעֲנֶה 指回答、回应；介词 ב 在此可理解为喜乐所缘由或所在，汉语用“因”自然地呈现这种关系。
- source_word: פִיו
  choice: 口中的
  rationale: 原文直译为“他的口”；保留“口”这一身体意象，突出所说出的回应，同时“口中的回答”在汉语中通顺。
- source_word: וְדָבָר
  choice: 一句话
  rationale: דָבָר 此处与“回答”平行，最自然地指所说的话；量词“一句”使现代汉语流畅，又未改变单数形式。
- source_word: בְּעִתּוֹ
  choice: 说得正是时候
  rationale: 原义为“在它的时候”，含有适时、合时之意；结合“话”译作“说得正是时候”，清楚传达及时而合宜的语义。
- source_word: מַה־טּוֹב
  choice: 多么美好
  rationale: 这是感叹结构，用“多么美好”保留原文赞叹的力度和简洁性。
