  yaml_path: translation/ot/proverbs/015/005.yaml
  text: A fool despises his father's discipline[a], but whoever heeds reproof is prudent.
translation:
  language: zh_hans
  text: 愚妄人藐视父亲的管教；谨守责备的人却变得精明[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “谨守”直译为“看守”或“守住”；“变得精明”也可译为“行事谨慎”或“显出机敏”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱוִיל
  choice: 愚妄人
  rationale: 这是《箴言》中常见的智慧文学用语，侧重道德与生活实践上的愚昧，并非单指智力不足；“愚妄人”既准确又符合中文圣经语体。
- source_word: יִנְאַץ
  choice: 藐视
  rationale: 该动词表示带着轻蔑加以拒绝，强于单纯的“不接受”；“藐视”保留其态度与行动两方面的力度。
- source_word: מוּסַר
  choice: 管教
  rationale: 在《箴言》中，此词兼有训练、教导和纠正之意；父子语境中的“管教”自然地涵盖这些含义。
- source_word: אָבִיו
  choice: 父亲的
  rationale: 希伯来文明确指“他的父亲”；中文在泛指的箴言句式中可自然省略“他的”，同时不改变所指。
- source_word: וְשֹׁמֵר
  choice: 谨守
  rationale: 其字面义为“看守、守住”，在此指认真接受并遵行责备；“谨守”比单纯“听从”更能保留原文的守护意象。
- source_word: תּוֹכַחַת
  choice: 责备
  rationale: 该名词指指出过错的言语性纠正；“责备”是现代中文中清楚、自然且有力度的对应词。
- source_word: יַעְרִם
  choice: 变得精明
  rationale: 该动词可表示变得审慎、精明，或表现出机敏；“变得精明”保留其动态语义，也不把原文收窄为单纯状态描述。
theological_decisions:
- issue: 父母称谓的性别指向
  choice: 父亲
  alternative: 父母／家长
  rationale: 原文明确使用“父亲”，故不改为中性或集合称谓。
- issue: 精明与狡猾之间的语义张力
  choice: 精明
  alternative: 谨慎／有见识
  rationale: 原词可指审慎而机敏，在某些语境也可能带有狡黠色彩；本节因与接受责备相连，正面意义占主导，但仍以“精明”保留其机敏色彩，不加入特定教义解释。
translation_notes:
  register: 采用现代、庄重而易懂的智慧文学语体；上下两句以“愚妄人”与省略中心语的“……的”形成鲜明对照。分号体现希伯来诗句的对比关系。
