base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/016.yaml
  text: Better is a little with the fear of Yahweh than great treasure with turmoil[a].
translation:
  language: zh_hans
  text: 财物不多而敬畏耶和华，胜过财宝丰厚、其中却有纷扰[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “纷扰”也可译作“扰乱”“混乱”或“烦扰”。这个希伯来词可指骚动、扰乱或混乱；末尾的代词可理解为“其中”，也可指与丰厚财宝相伴。
    reason: 说明 מְהוּמָה 的语义范围，并保留 בוֹ 所指的句法歧义。
lexical_decisions:
- source_word: טוֹב
  choice: 胜过
  rationale: 本句是无系词的比较式箴言；用“胜过”自然表达 טוֹב 在此“更好”的比较功能。
- source_word: מְעַט
  choice: 财物虽少
  rationale: מְעַט 指数量不多，与下半句丰厚的财宝相对；补出“财物”使现代汉语表达完整，但不把它限定为某一种财产。
- source_word: בְּיִרְאַת יְהוָה
  choice: 却敬畏耶和华
  rationale: בְּ 表示伴随情形；“敬畏耶和华”保留《箴言》中关键的智慧用语，既包含敬重与肃然之心，也不把原文窄化为单纯的恐惧。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经语境中对四字神名的通行音译，保留其作为以色列上帝之专名的性质，而非改作称号。
- source_word: מֵאוֹצָר רָב
  choice: 胜过财宝丰厚
  rationale: אוֹצָר 指积存的财宝或财富，רָב 表示多而丰厚；“财宝丰厚”与前句“财物虽少”形成清楚对照。
- source_word: וּמְהוּמָה בוֹ
  choice: 却伴有纷扰
  rationale: מְהוּמָה 可指骚动、扰乱或混乱；“纷扰”兼顾外在动荡与内在不安。בוֹ 最自然地回指丰厚财宝所处或所伴随的情形，译作“伴有”在中文中较顺畅。
theological_decisions:
- issue: 智慧文学中“敬畏耶和华”的含义
  choice: 在正文保留“敬畏耶和华”这一固定表达
  alternative: 尊崇耶和华／对耶和华心存敬畏
  rationale: 原文 יִרְאַת יְהוָה 是《箴言》的核心神学用语。保留“敬畏”可维持其正典关联和语义张力，不将其完全解释为敬重、崇敬或惧怕中的任何单一层面。
- issue: 丰厚财宝与纷扰的关系
  choice: 译作“财宝丰厚，却伴有纷扰”
  alternative: 财宝丰厚，其中却有混乱／财宝丰厚，又有患难
  rationale: 原文并未说明纷扰的原因，也没有断言财富本身必然有罪；译文只保留两者相伴的比较关系，避免加入因果性判断。
translation_notes:
  register: 采用简洁、对称的现代箴言体。“财物虽少……胜过财宝丰厚……”便于普通读者理解；“敬畏耶和华”保留庄重而熟悉的智慧文学措辞。
