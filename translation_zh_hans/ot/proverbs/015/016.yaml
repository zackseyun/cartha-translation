revisions:
- from: 财物虽少，却敬畏耶和华，胜过财宝丰厚，却伴有纷扰[a]。
  to: 财物不多而敬畏耶和华，胜过财宝丰厚、其中却有纷扰[a]。
  rationale: 修订消除了首分句由‘虽……却……’造成的主语和逻辑歧义，保留原文的比较性箴言结构：少量财物与敬畏耶和华相伴，优于丰富财宝与纷扰相伴。下半句的‘其中却有纷扰’保留 בוֹ 可作‘在其中’的自然读法；脚注同时说明其亦可理解为与财宝相伴，避免排除原文容许的关联。
