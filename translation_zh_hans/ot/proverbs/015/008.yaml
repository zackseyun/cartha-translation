  text: זֶ֣בַח רְ֭שָׁעִים תּוֹעֲבַ֣ת יְהוָ֑ה וּ/תְפִלַּ֖ת יְשָׁרִ֣ים רְצוֹנֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/008.yaml
  text: The sacrifice of the wicked is an abomination to Yahweh[a], but the prayer of the upright is his delight.
translation:
  language: zh_hans
  text: 恶人的祭物是雅威所憎恶的；正直人的祷告却蒙他悦纳[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“是他所喜悦的”或“得他的恩宠”。这里的希伯来词可表示喜悦、恩宠或接纳。
    reason: 保留 רָצוֹן 在此处“喜悦、恩宠、接纳”之间的词义幅度。
lexical_decisions:
- source_word: זֶבַח
  choice: 祭物
  rationale: 指献祭之物或祭牲；“祭物”在本节中自然简洁，也能与“祷告”形成对照。
- source_word: רְשָׁעִים
  choice: 恶人
  rationale: 这是形容词名词化的复数形式，指道德上邪恶、有罪的人；“恶人”符合汉语箴言体。
- source_word: תּוֹעֲבַת
  choice: 所憎恶的
  rationale: 该词表达强烈的厌恶与排斥；译作“所憎恶的”既保留力度，也比名词化的“可憎之物”更符合现代汉语。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，而不以“主”这一称号代替。
- source_word: תְפִלַּת
  choice: 祷告
  rationale: 构造形式为“……的祷告”；单数在箴言中具有概括性。
- source_word: יְשָׁרִים
  choice: 正直人
  rationale: 指在道德上正直、行为端正的人；“正直人”保留了该词“正、直”的伦理含义。
- source_word: רְצוֹנוֹ
  choice: 蒙他悦纳
  rationale: 该名词可表示喜悦、恩宠或接纳；在与“所憎恶的”的反义平行中，“蒙他悦纳”自然表达祷告为他所接受，同时以脚注保留词义范围。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；采用“雅威”保留专名性质，并避免用称号取代。
- issue: רְצוֹנוֹ 在第二分句中的含义
  choice: 蒙他悦纳
  alternative: 是他所喜悦的；得他的恩宠
  rationale: 希伯来文为省略系词的名词句，既可侧重喜悦，也可侧重恩宠或接纳；正文采用自然的“蒙他悦纳”，脚注列出其他可能，避免把词义范围限定为单一概念。
translation_notes:
  register: 采用简洁、对称的现代汉语箴言体。“恶人的祭物”与“正直人的祷告”保持原文的反义平行；“却”明确两分句的转折关系。
