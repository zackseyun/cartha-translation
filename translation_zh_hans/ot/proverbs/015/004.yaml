  text: מַרְפֵּ֣א לָ֭שׁוֹן עֵ֣ץ חַיִּ֑ים וְ/סֶ֥לֶף בָּ֝֗/הּ שֶׁ֣בֶר בְּ/רֽוּחַ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/004.yaml
  text: A healing tongue is a tree of life[b][a], but perverseness in it is a breaking of the spirit.
translation:
  language: zh_hans
  text: 带来医治的[a]舌头是生命树；舌头中的乖谬，是人的心灵的破碎[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “带来医治的”或译“健全的”；מַרְפֵּא 可表示医治、健康或健全。
    reason: lexical_alternative
  - marker: b
    text: “人的心灵的破碎”直译可作“灵的断裂”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מַרְפֵּא
  choice: 带来医治的
  rationale: 此词可指医治、健康或健全。译作“带来医治的”保留言语使人恢复、得医治的具体含义，也比单译“温和的”更充分。
- source_word: לָשׁוֹן
  choice: 舌头
  rationale: 原义为“舌头”，在这里借指言语。保留这一形象，既贴近希伯来文，也符合箴言的表达方式。
- source_word: עֵץ חַיִּים
  choice: 生命树
  rationale: 保留智慧文学中熟悉的“生命树”意象，同时不强行把它限定为伊甸园中那棵特定的树。
- source_word: סֶלֶף
  choice: 乖谬
  rationale: 此词表示扭曲、弯曲或颠倒；“乖谬”既能表达言语的偏曲，也保留其道德意味。
- source_word: בָּהּ
  choice: 其中
  rationale: 阴性单数后缀自然回指“舌头”；“其中”简洁地保留了原文的代词联系。
- source_word: שֶׁבֶר
  choice: 破碎
  rationale: 此名词可指断裂、破损或崩溃。“使……破碎”以自然中文传达其造成破裂的结果，同时保留鲜明的比喻。
- source_word: בְּרוּחַ
  choice: 人的心灵
  rationale: 这里的 רוּחַ 最自然地指人的内在生命或精神状态；“人的心灵”可避免被误解为风或特指圣灵。
theological_decisions:
- issue: רוּחַ 的所指
  choice: 人的心灵，即人的内在生命或精神
  alternative: 神的灵／圣灵
  rationale: 本节对照能带来恢复与造成伤害的言语，语境聚焦言语对人的内在影响，因此指人的心灵最为自然。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。正文保留“舌头”和“生命树”的希伯来意象；用“带来医治的”使中文搭配自然，并以“人的心灵”明确此处所指的是人的内在生命。
