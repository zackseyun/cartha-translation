  terminology: “雅威”恰当保留 יְהוָה 的专名性质。“所憎恶的”能传达 תּוֹעֲבַת 的强烈否定；“纯净”适切对应 טְהֹרִים。将词汇替换为“意念”与“和悦”不改变神学或解释立场。
