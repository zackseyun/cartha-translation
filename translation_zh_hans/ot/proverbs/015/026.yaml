base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/026.yaml
  text: Evil plans are an abomination to Yahweh[b][a], but pleasant words are pure.
translation:
  language: zh_hans
  text: 邪恶的意念[a]为雅威所憎恶；和悦的话语却是纯净的[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “意念”也可译作“谋算”或“计谋”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文词序直译为：“但纯净的是和悦的话语。”
    reason: source_word_order
lexical_decisions:
- source_word: תּוֹעֲבַת
  choice: 所憎恶的
  rationale: 该词为构造形式，与“雅威”相连，表示雅威深恶痛绝之事；“所憎恶的”在现代汉语中自然，同时保留强烈的道德判断。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来语四字神名的通行拟音译出其专名性质，不以“主”等称号代替。
- source_word: מַחְשְׁבוֹת רָע
  choice: 邪恶的谋算
  rationale: מַחְשְׁבוֹת 可指思想、筹划或计谋；在本节伦理语境中，“谋算”兼顾内在意图和有目的的筹划，רָע 则修饰其为邪恶。
- source_word: וּטְהֹרִים
  choice: 却是纯净的
  rationale: 连接词 וְ 在对偶结构中表达反衬，译作“却”；טְהֹרִים 表示洁净、纯洁，此处保留为道德意义较宽的“纯净”。
- source_word: אִמְרֵי נֹעַם
  choice: 悦人的话语
  rationale: 该构造词组直指带来愉悦、温美可喜的话；“悦人的话语”简明自然，又不将其限定为某种特定神学意义的“恩言”。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用以色列之神的专名。译作“雅威”保留专名及圣约语境，不以称号替换。
- issue: “纯净”所修饰的对象
  choice: 悦人的话语却是纯净的
  alternative: 纯净的话语令人喜悦
  rationale: 原文的复数形容词 טְהֹרִים 与“话语”呼应，最直接理解为对悦人话语的断定。译文保留这种关系，不把“纯净”改作定语，也不补出原文没有明说的判断主体或结果。
translation_notes:
  register: 采用简洁、庄重而通顺的现代标准汉语，保持箴言两分句的反义对偶。“所憎恶的”传达 תּוֹעֲבָה 的强烈力度；分号凸显前后反衬。
