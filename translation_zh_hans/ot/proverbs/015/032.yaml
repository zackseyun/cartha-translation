  text: פּוֹרֵ֣עַ מ֭וּסָר מוֹאֵ֣ס נַפְשׁ֑/וֹ וְ/שׁוֹמֵ֥עַ תּ֝וֹכַ֗חַת ק֣וֹנֶה לֵּֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/032.yaml
  text: Whoever ignores discipline despises himself, but he who listens to reproof gains understanding.
translation:
  language: zh_hans
  text: 弃绝管教的，是轻看自己；听从责备的，却获得明悟。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פּוֹרֵעַ מוּסָר
  choice: 弃绝管教
  rationale: פּוֹרֵעַ 在此指拒绝、撇开管教，并非仅仅疏忽；“弃绝”保留其主动排斥的力度。מוּסָר 译为“管教”，涵盖训诲、纠正和纪律。
- source_word: מוֹאֵס נַפְשׁוֹ
  choice: 轻看自己
  rationale: מוֹאֵס 表示厌弃、轻视；נֶפֶשׁ 带物主后缀，字面为“自己的生命／自己”。按箴言语境译作“自己”，自然且不把含义限定为肉体生命。
- source_word: שׁוֹמֵעַ תּוֹכַחַת
  choice: 听从责备
  rationale: שׁמע 不只指听见，也可指接受、听从；תּוֹכַחַת 是指出错误并加以纠正的责备。
- source_word: קֹנֶה לֵב
  choice: 获得明悟
  rationale: קנה 意为取得、获得；לֵב 字面是“心”，在希伯来智慧文学中常指内在的理解力、判断力和明智。译为“明悟”传达此处认知与智慧层面的含义，同时保留“获得”的取得意象。
theological_decisions:
- issue: נַפְשׁוֹ 的指涉
  choice: 自己
  alternative: 自己的生命
  rationale: “自己”保留经文对整个人的指涉，也符合现代汉语表达；不将本句收窄为仅仅危害性命。
- issue: לֵב 的智慧文学含义
  choice: 明悟
  alternative: 心／智慧之心
  rationale: 此处“心”是理解和判断的中心；“明悟”比直译“心”更能让现代读者准确把握含义，又不额外引入特定教义。
translation_notes:
  register: 采用简洁、对称的箴言句式；“管教—责备”、“轻看—获得”形成鲜明对照。语言庄重而现代，避免把希伯来语 נֶפֶשׁ 和 לֵב 机械地分别译成“灵魂”和“心”而造成误读。
