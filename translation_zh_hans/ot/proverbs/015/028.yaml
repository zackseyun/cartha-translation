base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/028.yaml
  text: The heart of the righteous considers how to answer[a], but the mouth of the wicked pours out evil things.
translation:
  language: zh_hans
  text: 义人的心思量怎样回答[a]；恶人的口却涌出恶言。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“思量如何回答。”希伯来语动词可指默想或沉思；按较贴近原文结构的译法，可作“思量要回答什么”。
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵב
  choice: 心
  rationale: 希伯来智慧文学中的“心”涵盖思想、判断和意志；保留原文意象，在现代汉语中也能自然表达人的内在思考。
- source_word: צַדִּיק
  choice: 义人
  rationale: 该形容词在此作名词使用，泛指行义的人；“义人”简洁、庄重，也不额外限定性别。
- source_word: יֶהְגֶּה
  choice: 思量
  rationale: 此动词可指默想、沉思，也可涉及低声言说；与“回答”连用时，重点在开口前审慎思考。“思量”既自然，又保留反复斟酌的意味。
- source_word: לַעֲנוֹת
  choice: 怎样回答
  rationale: 带 ל 的不定式表示思考所指向的回答行动。补出“怎样”符合现代汉语习惯，并表达答话前的斟酌，但不限定答案的具体内容。
- source_word: וּפִי
  choice: 却……口
  rationale: וּ 字面可译“而/和”；本节为反义平行，译作“却”清楚呈现义人与恶人的对照。
- source_word: רְשָׁעִים
  choice: 恶人
  rationale: 复数形容词名词化，指恶人这一类人。汉语集合性称谓“恶人”无需显式复数，也与“义人”形成整齐对照。
- source_word: יַבִּיעַ
  choice: 涌出
  rationale: 该使役形动词带有使液体冒出、奔涌而出的鲜明意象；“涌出”保留恶言不加节制地大量出口的动态感。
- source_word: רָעוֹת
  choice: 恶言
  rationale: 原词是阴性复数，泛指恶事、恶物；在“口涌出”的语境中明确指邪恶或有害的话。译作“恶言”自然凝练，同时保留道德性的负面含义。
theological_decisions: []
