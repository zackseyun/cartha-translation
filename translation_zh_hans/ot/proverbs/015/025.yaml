  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: בֵּ֣ית גֵּ֭אִים יִסַּ֥ח יְהוָ֑ה וְ֝/יַצֵּ֗ב גְּב֣וּל אַלְמָנָֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/025.yaml
  text: Yahweh tears down the house of the proud[b][a], but he sets firm the boundary of the widow.
translation:
  language: zh_hans
  text: 雅威拆毁骄傲人的家[a]，却使寡妇的地界稳固[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“拔除骄傲人的家”。这个希伯来语动词不只可指拆毁，也可表达移走或连根拔除。
    reason: lexical_alternative
  - marker: b
    text: “地界”也可译作“界线”或“界标”。这里的意象是雅威保护寡妇的土地和产业权益。
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּית
  choice: 家
  rationale: 该词为构造形式，既可指房屋，也可延伸指家室、家业；译作“家”保留具体意象及其较宽泛的含义。
- source_word: גֵּאִים
  choice: 骄傲的人
  rationale: 指高傲、自大的人；“骄傲的人”是自然、清楚的现代汉语表达，也符合智慧文学中的道德对比。
- source_word: יִסַּח
  choice: 拆毁
  rationale: 该动词表达移除、拔除或扯去。以“家”为宾语时，“拆毁”自然地传达破坏之力，同时以脚注保留“拔除”的词义可能。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按音译呈现四字神名，保留经文本身所使用的专名，而不以称号代替。
- source_word: וְיַצֵּב
  choice: 却使……稳固
  rationale: 使役词形表达使之站稳、确立或坚固；“使……稳固”准确传达其使役意义。连接词在反义平行结构中译为“却”，自然呈现审判骄傲者与保护寡妇之间的对照。
- source_word: גְּבוּל
  choice: 地界
  rationale: 基本义为边界、疆界；此处涉及寡妇的土地和产业权益，“地界”兼具具体土地界线及法律保护的意味。
- source_word: אַלְמָנָה
  choice: 寡妇
  rationale: 保留单数的代表性用法，指向这一弱势群体中的典型个体。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。译作“雅威”以现代汉语音译保留其专名性质，不用称号替代。
- issue: וְ 在 וְיַצֵּב 前的语篇作用
  choice: 却
  alternative: 并且
  rationale: 该连接词形式上通常为“和”，但本节是反义平行：雅威拆毁骄傲人的家，同时保护寡妇的地界。“却”明确表达原文语境中的对照，而未增加新的命题内容。
- issue: 寡妇地界的含义
  choice: 保留具体的产业边界意象
  alternative: 意译为保护寡妇的产业权益
  rationale: 原文说雅威使寡妇的边界稳固，既有具体土地制度背景，也蕴含对弱势者权益的保护。正文保留意象，脚注说明其语境含义，避免把具体表达化约成抽象神学陈述。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。句式简洁，保持箴言的反义平行结构；“家”与“地界”保留原文的具体意象，并让脚注承载必要的词义和背景说明。
