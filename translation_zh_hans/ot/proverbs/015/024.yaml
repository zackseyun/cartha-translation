  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אֹ֣רַח חַ֭יִּים לְ/מַ֣עְלָ/ה לְ/מַשְׂכִּ֑יל לְמַ֥עַן ס֝֗וּר מִ/שְּׁא֥וֹל מָֽטָּה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/024.yaml
  text: The path of life leads upward for the prudent, so that he may turn away from Sheol below.
translation:
  language: zh_hans
  text: 对明哲人来说，生命之路向上延伸，使他避开下方的阴间。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֹרַח חַיִּים
  choice: 生命之路
  rationale: 直译这一智慧文学惯用语，既可指通向生命的道路，也可指有生命特质的道路，保留原文的凝练性。
- source_word: לְמַשְׂכִּיל
  choice: 对明哲人来说
  rationale: מַשְׂכִּיל 指有洞察力、行事明智的人；“明哲人”符合箴言的智慧语域，又避免仅理解为世故谨慎。
- source_word: לְמַעְלָה
  choice: 向上延伸
  rationale: 保留与末句“下方”的空间对照；补入“延伸”使汉语自然，同时不把“向上”过度解释为特定的来世教义。
- source_word: לְמַעַן סוּר
  choice: 使他避开
  rationale: לְמַעַן 可表达目的或结果，“使”保留两者之间的张力；סוּר מִן 在此表示转离、避开。
- source_word: שְׁאוֹל
  choice: 阴间
  rationale: 指希伯来观念中的亡者领域；采用传统且易懂的对应语，不译作“地狱”，以免引入原文没有明确表达的刑罚含义。
- source_word: מָטָּה
  choice: 下方
  rationale: 与 לְמַעְלָה“向上”形成鲜明平行，忠实保留诗句的垂直意象。
theological_decisions:
- issue: “向上”与“下方的阴间”是否明确陈述死后升天
  choice: 保留空间意象，不明说“天堂”或“升天”
  alternative: 生命之路通往天上，使明哲人免下地狱
  rationale: 原文明确对照“上”与“下方的阴间”，但没有使用“天”或“天堂”，也没有把 שְׁאוֹל 等同于后期神学意义上的“地狱”。
- issue: לְמַעַן 的目的与结果关系
  choice: 译为“使他”
  alternative: 译为“为要让他”或“所以他能”
  rationale: “使他”在现代汉语中可涵盖目的与所产生的结果，避免把原文关系限定得过死。
translation_notes:
  register: 采用现代、凝练而庄重的箴言体。以“向上／下方”再现希伯来文的对称结构；“明哲人”体现智慧文学语域，但全句保持普通读者可懂。
