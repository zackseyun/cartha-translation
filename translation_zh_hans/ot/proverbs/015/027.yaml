base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/027.yaml
  text: Whoever is greedy for gain troubles his own house[a], but he who hates bribes will live.
translation:
  language: zh_hans
  text: 贪图财利的人，给自己的家带来祸患；恨恶贿赂[a]的人必得存活。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“礼物”；这里可能指“贿赂”。
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹכֵר
  choice: 祸害
  rationale: 该分词表示给人或群体招致祸患、搅扰。译作“祸害”简洁有力，既表达实际伤害，又不夸大为彻底毁灭。
- source_word: בֵּיתוֹ
  choice: 自己的家
  rationale: בַּיִת既可指房屋，也可指家庭或家人。“自己的家”保留原文意象，同时自然涵盖其家庭共同体。
- source_word: בּוֹצֵעַ בָּצַע
  choice: 贪图不义之财
  rationale: 同根动词与名词连用，突出对利得的贪求；该词组在希伯来语中常带有不正当获利的贬义。“贪图不义之财”兼顾贪欲与道德污点。
- source_word: וְשׂוֹנֵא
  choice: 恨恶
  rationale: “恨恶”保留原文强烈的道德排斥；连接词在对偶中具有转折对照作用，中文用分号即可自然呈现，无须另加“但是”。
- source_word: מַתָּנוֹת
  choice: 贿赂
  rationale: 该词字面为“礼物”，但在此与不义之财相对照，语境指意在影响判断或行为的馈赠，即“贿赂”。脚注保留其较宽的字面义。
- source_word: יִחְיֶה
  choice: 必存活
  rationale: 该未完成式在箴言中表达智慧行为带来的生命结果。“必存活”保留简练的应许语气，也不把含义限定为物质兴旺。
theological_decisions:
- issue: “存活”的涵义
  choice: 保留为“必存活”
  alternative: “必兴旺”或“必保全性命”
  rationale: 原文只用חיה“活”，可能涵盖保全生命及在智慧道路上得以长久存续；不将其收窄为财富、成功或某一种特定救恩含义。
translation_notes:
  register: 采用现代、凝练而庄重的箴言体。前后两句结构对称；“自己的家”保留希伯来文的家庭意象，“祸害”与“必存活”形成鲜明的因果对照。脚注标记置于实际对应的“贿赂”之后。
