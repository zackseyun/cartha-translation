  text: מוּסָ֣ר רָ֭ע לְ/עֹזֵ֣ב אֹ֑רַח שׂוֹנֵ֖א תוֹכַ֣חַת יָמֽוּת׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/010.yaml
  text: Harsh discipline is for one who forsakes the path[b][a]; whoever hates reproof will die.
translation:
  language: zh_hans
  text: 离弃道路的人，必受严厉的管教[a][b]；恨恶责备的人，必死。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“严酷的管教”。“严厉的”所对应的希伯来语也可表示“坏的”或“恶的”；这里更可能描述管教令人痛苦的严峻程度。
    reason: lexical_alternative
  - marker: b
    text: 或译：“路径”或“道路”。希伯来语在智慧文学中常以“道路”比喻人的生活道路或道德行径。
    reason: lexical_alternative
lexical_decisions:
- source_word: מוּסָר
  choice: 管教
  rationale: 该词兼有教导、纠正和惩戒之意；本节与“责备”并列，且由形容词修饰，侧重带来痛苦的纠正性管教。
- source_word: רָע
  choice: 严厉的
  rationale: 该词通常可指“恶、坏”，但在这里修饰“管教”，按语境更自然地表达管教的沉重或严酷程度；脚注保留“严酷的”这一译法以及原词更宽的词义。
- source_word: לְעֹזֵב
  choice: 离弃……的，必受
  rationale: לְ 表示这种管教所临到的对象；分词 עֹזֵב 描写具有代表性或持续性的行为。“离弃”保留主动背离的道德分量。
- source_word: אֹרַח
  choice: 正道
  rationale: 该词本义为“路径、道路”，在智慧文学中常比喻人的生活和道德道路。上下文暗示所离弃的是正确道路，因此正文用自然的“正道”，并在脚注说明原文直译。
- source_word: שׂוֹנֵא
  choice: 恨恶……的
  rationale: 分词具有概括性的箴言语气；“恨恶”保留了原文强烈而持续的拒斥意味。
- source_word: תוֹכַחַת
  choice: 责备
  rationale: 该词指言语上的指正、斥责或劝戒。“责备”与前半句较广义的“管教”有所区别，又符合现代汉语表达。
- source_word: יָמוּת
  choice: 必死亡
  rationale: 未完成式在此表达箴言式的必然后果。“必死亡”直接保留 מות 的严峻表述，不改释为较宽泛的“败亡”。
theological_decisions:
- issue: 本节所说“死亡”的性质
  choice: 直译为“必死亡”，不说明是肉身、道德意义或终极意义上的死亡。
  alternative: 必败亡；必在肉身上死亡；必灭亡。
  rationale: 原文 מות 本身没有在本节限定死亡的具体层面。保留“死亡”可避免把箴言的警告提前收窄为某一种神学解释。
- issue: “道路”的道德性质是否明说
  choice: 正文译作“正道”。
  alternative: 道路；路径；人生道路。
  rationale: 智慧文学语境和“离弃—受管教”的关系显示，这条路是当守的正确道路；不过原文名词本身只说“路径”，故以脚注保留较形式对应的译法。
translation_notes:
  register: 采用现代、凝练而庄重的箴言体。两句保持平行结构；以“必受”补出希伯来语名词句在汉语中所需的谓语关系。脚注标记依其所解释内容分别置于“严厉的管教”和“正道”之后。
