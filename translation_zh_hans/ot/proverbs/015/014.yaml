base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/014.yaml
  text: The heart of the discerning seeks knowledge[a], but the face of fools feeds on folly.
translation:
  language: zh_hans
  text: 明辨者的心寻求知识，愚昧人的脸[a]却以愚妄为食。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “脸”直译希伯来文。马所拉文本作“愚昧人的脸”；因下文有“以……为食”的意象，许多译本按意译作“愚昧人的口”。
    reason: alternative_reading
lexical_decisions:
- source_word: לֵב
  choice: 心
  rationale: 在《箴言》中指人的内在，包括思想、意愿和判断；保留希伯来的身体隐喻。
- source_word: נָבוֹן
  choice: 明辨人
  rationale: 指有理解力、能分辨的人；“明辨人”简洁自然，并与智慧文学的语体相称。
- source_word: יְבַקֶּשׁ
  choice: 寻求
  rationale: 该动词表达主动、有意地追求；“寻求”既准确又庄重。
- source_word: דָּעַת
  choice: 知识
  rationale: 这是智慧文学中的常用含义，涵盖应当认识和领会的事。
- source_word: וּפְנֵי
  choice: 脸
  rationale: 马所拉文本直译为“脸／面”；虽有译本按进食意象处理为“口”，正文保留原文较突兀却真实的表达。
- source_word: כְסִילִים
  choice: 愚昧人
  rationale: 这是《箴言》中兼具道德与认知意味的固定人物类型，不只是智力不足。
- source_word: יִרְעֶה
  choice: 以……为食
  rationale: 原义为放牧、吃草；用于“愚妄”时，以进食隐喻表达持续摄取和沉溺。
- source_word: אִוֶּלֶת
  choice: 愚妄
  rationale: 《箴言》中与智慧相反的核心概念，包含错误、悖理和道德上的愚昧。
