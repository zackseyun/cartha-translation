  text: A joyful heart makes the face cheerful[b][a], but by the sorrow of the heart the spirit is crushed.
translation:
  language: zh_hans
  text: 喜乐的心使面容明朗[a]；心中的忧伤使灵被压垮[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“使面容喜悦。”希伯来语直译为“使脸变好”，指内心的喜乐使外在神情明朗。
    reason: lexical_alternative
  - marker: b
    text: “灵被压垮”或译：“灵破碎了。”
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵב שָׂמֵחַ
  choice: 喜乐的心
  rationale: לֵב在此指人的内在情感与性情；“心”既自然，也与下半句的“灵”形成对应。שָׂמֵחַ译作“喜乐”，符合箴言庄重而通俗的语体。
- source_word: יֵיטִב פָּנִים
  choice: 使人容光焕发
  rationale: 希伯来语直译为“使脸变好”，是指内心的喜乐改善外在神情。“使人容光焕发”自然传达其使动意义和面容意象；脚注保留较贴近字面的译法。
- source_word: וּבְעַצְּבַת לֵב
  choice: 心里忧伤
  rationale: ו在对偶中表达转折；עַצְּבַת表示忧伤、痛苦。介词ב可理解为处境或原因，汉语以分句“心里忧伤”简洁呈现，并由后句表达其结果。
- source_word: רוּחַ
  choice: 灵
  rationale: 此处指人的内在精神与生命气力，而非风或字面的气息。“灵”保留希伯来语的人论深度，也与“心”构成有意义的区分。
- source_word: נְכֵאָה
  choice: 被压垮
  rationale: 该词表示受打击、被压碎或消沉。“被压垮”在现代汉语中清楚有力，同时保留其被动、受创的意味。
