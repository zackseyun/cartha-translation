  text: לֹ֣א יֶאֱהַב לֵ֭ץ הוֹכֵ֣חַֽ ל֑/וֹ אֶל חֲ֝כָמִ֗ים לֹ֣א יֵלֵֽךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/012.yaml
  text: A mocker does not love one who corrects him[a]; he will not go to the wise.
translation:
  language: zh_hans
  text: 嘲讽者不爱纠正他的人；他不肯到智者那里去。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֵץ
  choice: 嘲讽者
  rationale: 该词在智慧文学中指以轻蔑态度讥笑、拒绝受教的人。“嘲讽者”既保留主动讥诮的意味，也符合现代汉语表达。
- source_word: יֶאֱהַב
  choice: 不爱
  rationale: 按常用义直译为“爱”，保留希伯来文的强烈表达，不弱化为“不喜欢”，也不强化为“恨”。
- source_word: הוֹכֵחַ לוֹ
  choice: 纠正他的人
  rationale: 分词指向他提出指正、劝诫的人；“纠正他的人”自然清楚，并保留其旨在使人改正的含义。
- source_word: אֶל חֲכָמִים
  choice: 到智慧人那里
  rationale: 介词 אֶל 与动词“去”共同表示趋向或接近；חֲכָמִים 为复数，泛指有智慧的人。“到智慧人那里”在汉语中自然地表达主动接近并求教的意味。
- source_word: לֹא יֵלֵךְ
  choice: 他不到……去
  rationale: הלך 在此表示前往或接近；未完成式在箴言中可表达惯常行为或意愿。“不到……去”既自然，也传达拒绝亲近智慧人的倾向。
theological_decisions:
- issue: חֲכָמִים 的性别表达
  choice: 智慧人
  alternative: 有智慧的男人
  rationale: 虽然希伯来语采用阳性复数形式，但在智慧文学中通常泛指智慧之人，并非限定男性；“智慧人”保留类别性的复数含义而不额外限定性别。
translation_notes:
  register: 采用简洁、对称的箴言体。措辞现代而庄重；“嘲讽者”刻画其轻蔑拒教的性情，“不到智慧人那里去”与前半句共同呈现其拒绝纠正、疏远智慧的行为。
