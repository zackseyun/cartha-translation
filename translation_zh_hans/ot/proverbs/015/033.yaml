base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/033.yaml
  text: The fear of Yahweh is instruction in wisdom[a], and humility comes before honor.
translation:
  language: zh_hans
  text: 敬畏雅威，是智慧的训诲[a]；谦卑在尊荣以先。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“敬畏雅威，是智慧的管教。”希伯来语“训诲”也可包含纠正、管束的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְאַת יְהוָה
  choice: 敬畏雅威
  rationale: 保留 יִרְאָה 所含敬畏与惧怕的力度，不淡化为单纯“尊敬”；按所给神学决策，将 יהוה 音译为“雅威”。
- source_word: מוּסַר
  choice: 训诲
  rationale: 该词在《箴言》中兼具教导、管束与纠正之意；“训诲”在现代中文中较自然地涵盖塑造性的教导，并以脚注保留“管教”的可能译法。
- source_word: חָכְמָה
  choice: 智慧
  rationale: 这是《箴言》中该词的标准对应，也与全书智慧传统一致。
- source_word: וְלִפְנֵי
  choice: 以先
  rationale: 此处表达时间或逻辑上的先后次序；“以先”简洁而庄重，符合箴言的对句风格。
- source_word: כָבוֹד
  choice: 尊荣
  rationale: 此处指受尊重、被高举的地位；“尊荣”比“荣耀”更贴合智慧文学中的社会与伦理语境。
- source_word: עֲנָוָה
  choice: 谦卑
  rationale: 准确表达卑微、谦逊的品格；希伯来文后半句无显式动词，中文用“必有”自然补足关系而不改变其先后含义。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；依所给神学决策，以“雅威”呈现这一盟约之名，而不以称号替代。
- issue: 敬畏与智慧训诲之间的语法关系
  choice: “敬畏雅威，是智慧的训诲”
  alternative: “智慧的训诲使人敬畏雅威”
  rationale: 原文是名词性判断句，最直接的理解是把“敬畏雅威”表述为“智慧的训诲／管教”；不倒转两者关系，以保留原文可能具有的概括性和张力。
- issue: 谦卑与尊荣的次序
  choice: “尊荣以先，必有谦卑”
  alternative: “谦卑在尊荣以前”
  rationale: 保留原文前置“尊荣以前”的强调次序，同时用中文可理解的无主句表达；不额外指定赐予尊荣的主体。
translation_notes:
  register: 采用简洁、庄重而可懂的现代标准汉语，并尽量保留希伯来诗句的两分结构。后半句略用凝练的箴言体“以先”，同时以“必有”使中文关系清楚。
