  yaml_path: translation/ot/proverbs/015/001.yaml
  text: A gentle answer turns away wrath[a], but a painful word stirs up anger.
translation:
  language: zh_hans
  text: 温和的回答使烈怒消退；伤人的话[a]却挑起怒气。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “伤人的话”也可译作“使人痛苦的话”或“严厉的话”。希伯来语直译为“痛苦的话”，可指给人造成伤害、因而激起怒气的言语。
    reason: lexical_alternative
lexical_decisions:
- source_word: מַעֲנֶה
  choice: 回答
  rationale: 指对别人话语所作的回应；“回答”简洁自然，适合格言中的言语互动语境。
- source_word: רַךְ
  choice: 温和的
  rationale: 本义为柔软、柔和；用于回答时，“温和的”准确表达待人的语气与态度，也与下半句形成对照。
- source_word: יָשִׁיב
  choice: 使……消退
  rationale: 使役形在这里表示使烈怒转回、离去；“使……消退”自然呈现平息怒气的结果，同时保留使役意义。
- source_word: חֵמָה
  choice: 烈怒
  rationale: 该词带有炽热、强烈愤怒之意；“烈怒”保留其强度，又符合庄重而通俗的中文表达。
- source_word: דְבַר
  choice: 话
  rationale: 在此指说出的话语；“话”比“言辞”更贴近日常现代汉语，也保持格言的凝练。
- source_word: עֶצֶב
  choice: 伤人的
  rationale: 该词核心语义涉及痛苦、伤痛或忧伤；在修饰“话”的结构中，“伤人的话”自然表达造成痛苦的言语，而不把含义限定为语气上的严厉。
- source_word: יַעֲלֶה
  choice: 挑起
  rationale: 使役形直译为使之上升；与怒气搭配时，“挑起”自然表达激发、引起之意，并保留使役作用。
- source_word: אַף
  choice: 怒气
  rationale: 该词字面可指鼻子，但常作为愤怒的惯用表达；“怒气”在中文中清楚自然，并与上半句“烈怒”构成同义平行而不完全重复。
