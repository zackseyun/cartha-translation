base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/031.yaml
  text: An ear that listens to life-giving rebuke will remain among the wise[a][b].
translation:
  language: zh_hans
  text: 肯听使人得生命的责备的人，必住在智慧人中间[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “必住”直译可作“必住宿”或“必过夜”；这里比喻持续与智慧人同在，或安居在他们中间。
    reason: lexical_alternative
  - marker: b
    text: “使人得生命的责备”直译为“生命的责备”。这一短语也可理解为“为生命而有的责备”；指引向或保全生命的纠正。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹזֶן
  choice: 耳朵
  rationale: 保留希伯来文以“耳朵”代指愿意聆听之人的具体意象；现代汉语也能自然理解这一借代。
- source_word: שֹׁמַעַת
  choice: 听从
  rationale: 该分词表达持续而接受性的聆听，不只是听见声音；“听从”能体现留心并接受劝告的含义。
- source_word: תּוֹכַחַת
  choice: 劝戒
  rationale: 在智慧文学中指使人改正的责备或管教。“劝戒”兼顾告诫与纠正，语气庄重且适合现代汉语。
- source_word: חַיִּים
  choice: 赐生命之
  rationale: 与“劝戒”构成的短语可理解为带来、保全或引向生命的劝戒；“赐生命之”通顺地传达这种作用，同时以脚注保留“生命的劝戒”等结构歧义。
- source_word: בְּקֶרֶב
  choice: 中间
  rationale: 表示处于一个群体之中；与“智慧人”搭配为“在……中间”，自然且贴近原文空间意象。
- source_word: חֲכָמִים
  choice: 智慧人
  rationale: 复数形容词名词化，泛指有智慧的人，并不限定性别；“智慧人”也符合箴言的文体。
- source_word: תָּלִין
  choice: 必住
  rationale: 原义是“住宿、过夜”，此处比喻在智慧人中获得并保持一席之地。“住”保留原文居留意象，“必”表达未完成式在箴言格言中的结果性。
theological_decisions:
- issue: “生命”与“劝戒”的语义关系
  choice: 理解为劝戒具有赐生命、引向生命的作用
  alternative: “生命的劝戒”或“为生命而有的劝戒”
  rationale: 希伯来文结构简洁，关系并未明说。正文采用现代汉语较自然的功能性表达，但脚注保留其他可能理解，避免把原文的神学张力完全消除。
translation_notes:
  register: 采用现代、庄重而易懂的箴言体。保留“耳朵”和“住”的希伯来意象，以“听从”明确接受劝戒的持续姿态；不使用性别限定词。
