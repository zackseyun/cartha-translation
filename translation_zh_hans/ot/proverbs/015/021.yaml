  to: 愚昧是缺乏判断力之人的乐事[a]，但有悟性的人使自己的道路平直。
  rationale: 修订首句以“是……的乐事”保留原文名词性谓语，且以“缺乏判断力”准确表达“缺少心”的习语。后句将“正直”改为“平直”，以保留Piel使役动词“使之直”的道路意象，而不把含义过早限定为道德品格。脚注锚点仍紧随该习语的译文，结构与内容均完整。
