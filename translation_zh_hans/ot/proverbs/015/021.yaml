base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/021.yaml
  text: Folly is joy to one lacking sense[a], but a man of understanding makes his path straight.
translation:
  language: zh_hans
  text: 愚昧是缺乏判断力之人的乐事[a]，但有悟性的人使自己的道路平直。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“缺少心的人”；这里的“心”指理解力和判断力。
    reason: lexical_alternative
lexical_decisions:
- source_word: אִוֶּלֶת
  choice: 愚昧
  rationale: 抽象名词，指愚蠢的心态或行为；“愚昧”简洁庄重，也与箴言的智慧语汇相称。
- source_word: שִׂמְחָה
  choice: 使……喜乐
  rationale: 希伯来文是“对……是喜乐”的名词性结构；汉语用“使……喜乐”更自然，同时保留愚昧给当事人带来欢喜的意思。
- source_word: לַחֲסַר לֵב
  choice: 无知的人
  rationale: 字面为“缺少心的人”；在箴言中，“心”涉及理解力和判断力，因此译作“无知的人”以传达该习语，而不误解为缺乏感情。
- source_word: אִישׁ תְּבוּנָה
  choice: 有悟性的人
  rationale: אִישׁ 与 תְּבוּנָה 构成“有理解力/辨识力的人”；“有悟性的人”自然地与前句“无知的人”形成对照。
- source_word: יְיַשֶׁר
  choice: 使……正直
  rationale: ישר 的 Piel 形态带有“使之直、使之正”的使役意味；译文保留这一动词力度。
- source_word: לָכֶת
  choice: 自己的道路
  rationale: 字面涉及“行走”，在此喻指生活行为或人生道路；“道路”保留行路意象，并按汉语补出反身所属关系。
theological_decisions:
- issue: 阳性单数的代表性用法
  choice: 无知的人……有悟性的人
  alternative: 无知的男人……有悟性的男人
  rationale: 原文使用阳性单数形式，但智慧文学中可代表一般的人。现代汉语“人”不标语法性别，既不排除原文的代表性范围，也避免无根据地把训诲限定为男性。
- issue: “修直道路”是主动规整还是行为正直
  choice: 使自己的道路正直
  alternative: 行走正直／径直而行
  rationale: 译文保留 Piel 动词的使役形态和道路隐喻，不把它简化为仅仅描述行走方式，也不额外赋予特定教义含义。
translation_notes:
  register: 采用现代、凝练而庄重的箴言体。两分句以“但”形成鲜明对照；保留“道路”隐喻和原文动词的使役意味。
