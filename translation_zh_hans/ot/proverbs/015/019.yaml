  register: 采用现代、庄重而通俗的格言体。前后两句以“道路／路径”形成近义平行，以“荆棘篱笆／修筑好的大道”突出受阻与畅通的对比；脚注保留סְלֻלָה在“修筑、筑高”与“平坦、畅通”之间的词义张力。
