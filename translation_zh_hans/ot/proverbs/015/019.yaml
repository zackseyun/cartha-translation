  text: The way of the lazy is like a hedge of thorns[a], but the path of the upright is a raised highway.
translation:
  language: zh_hans
  text: 懒惰人的道路好像荆棘篱笆，正直人的路径却是修筑好的大道[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “修筑好的大道”也可译作“平坦的路”或“畅通的路”。希伯来语这个词可强调经过堆筑、修整的道路，并由此表示没有障碍、便于通行。
    reason: lexical_alternative
lexical_decisions:
- source_word: דֶּרֶךְ
  choice: 道路
  rationale: 既可指实际道路，也常比喻人的生活方式或行事历程；“道路”在现代汉语中自然保留这两层含义。
- source_word: עָצֵל
  choice: 懒惰人
  rationale: 指惯于懒惰的人；“懒惰人”简明易懂，并保留希伯来文泛指单数的格言表达。
- source_word: כִּמְשֻׂכַת חָדֶק
  choice: 好像荆棘篱笆
  rationale: כְּ表示比较；מְשֻׂכָה指篱笆或围障，חָדֶק指带刺植物。“荆棘篱笆”保留阻挡人前行且可能伤人的具体意象。
- source_word: אֹרַח
  choice: 路径
  rationale: 与דֶּרֶךְ近义；译作“路径”既保留道路隐喻，也使平行句自然有变化。
- source_word: יְשָׁרִים
  choice: 正直人
  rationale: 指在道德上正直的人；“正直人”准确表达伦理含义，又不把词义收窄为特定的司法或教义概念。
- source_word: סְלֻלָה
  choice: 修筑好的大道
  rationale: 该词源于סלל，可指堆筑、修筑道路，强调道路经过修整而畅通；此译保留修筑道路的具体图景，同时不强行限定为“高架”或仅仅“平坦”。
