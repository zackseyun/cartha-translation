  text: בְּֽ/כָל מָ֭קוֹם עֵינֵ֣י יְהוָ֑ה צֹ֝פ֗וֹת רָעִ֥ים ו/טוֹבִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/003.yaml
  text: In every place the eyes of Yahweh watch over the evil and the good[a].
translation:
  language: zh_hans
  text: 无论何处，雅威[a]的眼目都察看恶人和善人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文为 יהוה（YHWH），这里音译作“雅威”；传统中文常译作“耶和华”。
    reason: 说明神名的原文形式及传统译法。
lexical_decisions:
- source_word: בְּכָל מָקוֹם
  choice: 无论何处
  rationale: 表达“在每一个地方”的周遍、分配意义，同时比逐字译作“在每一处”更符合现代汉语习惯。
- source_word: עֵינֵי יְהוָה
  choice: 雅威的眼目
  rationale: 保留希伯来文“眼目”的拟人意象和所属关系；“眼目”庄重而易懂。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按通常推定的读音音译上帝的专名 YHWH，不以称号替代；脚注交代传统中文译名。
- source_word: צֹפוֹת
  choice: 都察看
  rationale: 该阴性复数分词与“眼目”一致，表示持续的观察；“察看”自然清楚，又不额外加入保护或审判之意。
- source_word: רָעִים וְטוֹבִים
  choice: 恶人和善人
  rationale: 两个形容词在此作名词使用，指品性为恶或为善的人；明确补出“人”符合现代汉语，并保留二者的对举。
theological_decisions:
- issue: 如何翻译神名 יהוה
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名 YHWH。正文采用音译“雅威”以保留专名性质，不用“上主”等称号替代；传统中文形式另见脚注。
- issue: “察看”是否含有守护之意
  choice: 按持续观察理解
  alternative: 看顾
  rationale: צֹפוֹת 在本句可表达观看、监视；“看顾”容易加入保护意味，而上下文同时提到恶人和善人，因此采用较中性的“察看”。
translation_notes:
  register: 采用自然、简洁而庄重的现代标准汉语。“无论何处……都……”重现原文的周遍性；保留“眼目”的诗性拟人表达，并以“恶人和善人”呈现箴言式对举。
