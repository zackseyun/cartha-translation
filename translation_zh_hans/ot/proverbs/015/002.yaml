  text: לְשׁ֣וֹן חֲ֭כָמִים תֵּיטִ֣יב דָּ֑עַת וּ/פִ֥י כְ֝סִילִ֗ים יַבִּ֥יעַ אִוֶּֽלֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/002.yaml
  text: The tongue of the wise makes knowledge good[b][a], but the mouth of fools pours out folly.
translation:
  language: zh_hans
  text: 智慧人的舌头善用知识[a]；愚昧人的口却涌出愚妄[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“使知识美好”“把知识表达得动听”。希伯来文动词为使役式，既可指智慧人善加运用知识，也可指把知识表达得好。
    reason: lexical_alternative
  - marker: b
    text: 或译“冒出”“倾吐出”。希伯来文动词描绘某物大量涌流出来。
    reason: lexical_alternative
lexical_decisions:
- source_word: לְשׁוֹן
  choice: 舌头
  rationale: 保留希伯来文以身体部位指代言语的具体意象，并与下半句的“口”形成平行。
- source_word: חֲכָמִים
  choice: 智慧人
  rationale: 表达实词化复数所指的一类人，不额外限定性别，符合《箴言》的用语。
- source_word: תֵּיטִיב
  choice: 善用
  rationale: 该词是יטב的使役式，可指使之美好、妥善处理或良好呈现；“善用”在现代汉语中自然，并保留使知识产生良好功用的含义。脚注交代其他可能理解。
- source_word: דָּעַת
  choice: 知识
  rationale: 保留智慧文学中的认知重点，并与下半句的“愚妄”构成对照。
- source_word: וּפִי
  choice: 却……口
  rationale: ו在诗歌平行中表达鲜明转折，译作“却”；“口”则保留原文意象。
- source_word: כְסִילִים
  choice: 愚昧人
  rationale: 这是《箴言》中常见的道德—认知类别称谓；“愚昧人”比单纯“笨人”更能表达其含义。
- source_word: יַבִּיעַ
  choice: 涌出
  rationale: 该动词描绘液体冒出、涌流的丰富动态；“涌出”既自然，又保留话语不受约束地大量流出的画面。
- source_word: אִוֶּלֶת
  choice: 愚妄
  rationale: 采用《箴言》语境中自然而庄重的抽象名词，兼具无知与道德偏差的意味。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重且易懂的智慧文学语体。保留“舌头／口”的具体平行意象；用“善用”避免生硬的“使知识美好”，同时以脚注保存原文使役结构的多义性。脚注标记依对应词语顺序置于正文。
