  text: תּוֹעֲבַ֣ת יְ֭הוָה דֶּ֣רֶךְ רָשָׁ֑ע וּ/מְרַדֵּ֖ף צְדָקָ֣ה יֶאֱהָֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/009.yaml
  text: The way of the wicked is an abomination to Yahweh[b][a], but he loves the one who pursues righteousness.
translation:
  language: zh_hans
  text: 恶人的道路为耶和华所憎恶；他喜爱追求公义的人。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “公义”或译“正义”。
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹעֲבַת
  choice: 所憎恶的
  rationale: 该名词表示令耶和华强烈厌恶、视为可憎之物。汉语用“是……所憎恶的”既保留强烈的道德评价，也能自然构成箴言式对偶。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 这是汉语圣经传统中对四字神名的通行音译，保留其作为上帝专名的性质，而不以称号替代。
- source_word: דֶּרֶךְ
  choice: 道路
  rationale: 在《箴言》中既可指道路，也常比喻生活方式和行事为人；“道路”保留了这一智慧文学意象。
- source_word: רָשָׁע
  choice: 恶人
  rationale: 原文为阳性单数，但在此具有泛指作用；“恶人”在现代汉语中可自然表示具有恶行特征的任何人，并与“追求正义的人”形成对照。
- source_word: מְרַדֵּף
  choice: 追求……的人
  rationale: 该强化词干分词表达持续、积极追求的特征；“追求……的人”自然呈现其名词化和惯常性。
- source_word: צְדָקָה
  choice: 正义
  rationale: 此词可表示正义、公义或正直的行为与秩序。“正义”在本句中清楚表达所追求的是合乎正直、公正的事；“公义”亦为可能译法，收入脚注。
- source_word: יֶאֱהָב
  choice: 是他所爱的
  rationale: 未完成式在箴言中表达恒常的一般真理，并非单指将来；采用现在时含义，同时以“所爱的”与上句“所憎恶的”形成汉语对偶。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。正文采用现代汉语读者最熟悉的专名形式“耶和华”，不以“主”等称号替代；“雅威”是另一种较贴近学术重构读音的音译。
- issue: צְדָקָה 的语义范围
  choice: 正义
  alternative: 公义／正直
  rationale: 该词兼具道德正直与公正秩序的含义。正文用“正义”避免把它缩减为纯粹法律意义；脚注明示“公义”这一传统且涵义较广的译法。
- issue: 智慧文学中阳性单数的泛指作用
  choice: 恶人／追求正义的人
  alternative: 邪恶的男子／追求正义的男子
  rationale: 原文的阳性单数在此代表一类人，并无将教训限定于男性之意，因此采用不限定性别的自然汉语。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。保留“道路”这一《箴言》常见的生活道路意象，并以“是……所憎恶的／却是……所爱的”呈现原文鲜明的反义对偶。
