  text: אַל יֵ֣שְׂטְ אֶל דְּרָכֶ֣י/הָ לִבֶּ֑/ךָ אַל תֵּ֝תַע בִּ/נְתִיבוֹתֶֽי/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/007/025.yaml
  text: Do not let your heart turn aside to her ways; do not wander into her paths.
translation:
  language: zh_hans
  text: 不要让你的心偏向她的道路；不要在她的路径上走迷。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יֵשְׂטְ
  choice: 偏向
  rationale: 该动词在此表达内心转离正道、趋向妇人道路的意思；译作“偏向”既保留方向变化，也符合现代汉语。
- source_word: לִבֶּךָ
  choice: 你的心
  rationale: 保留希伯来语“心”的意象；在智慧文学中，它指人的思想、意愿与内在取向。
- source_word: תֵּתַע
  choice: 迷失
  rationale: 该词可指游荡、偏离或误入；“迷失”保留在错误路径上失去方向的意象，并与前句“偏向”形成递进。
- source_word: בִּנְתִיבוֹתֶיהָ
  choice: 在她的路径中
  rationale: 保留复数“路径”及介词所呈现的进入并行走其中的空间意象。
theological_decisions:
- issue: “心”的含义
  choice: 直译为“你的心”
  alternative: 你的意念／你自己
  rationale: 原文以“心”作为道德抉择和人生方向的中心；保留这一意象，避免将其窄化为情感或思想。
- issue: 第二分句偏离程度
  choice: 译作“迷失在”
  alternative: 误入／游荡在／偏离到
  rationale: 原词语义允许“游荡、走迷、偏离”；“迷失在”保留其开放性，不额外断定行为是偶然误入还是主动徘徊。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语，维持希伯来诗歌两个平行禁令的结构，并保留“道路／路径”的智慧文学意象。
