base_translation:
  language: en
  yaml_path: translation/ot/proverbs/007/010.yaml
  text: And look—a woman came to meet him[a], dressed like a prostitute and cunning of heart.
translation:
  language: zh_hans
  text: 看哪，有一个女人迎着他而来，身穿妓女的装束，心思深藏[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“心机深沉”“心里诡诈”。希伯来文直译近于“心被守住”，可能指她把内心的意图隐藏起来。
    reason: 说明原文“守住／封藏内心”的意象及其可能带有的狡猾含义，保留词义歧义。
lexical_decisions:
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留引人注目、使场景骤然呈现的指示语气；“看哪”庄重而仍为现代读者所理解。
- source_word: אִשָּׁה
  choice: 一个女人
  rationale: 上下文指一名尚未具名的女性；此处没有充分依据译作“妻子”。
- source_word: לִקְרָאתוֹ
  choice: 迎面而来
  rationale: 表达朝他走来与他相遇的动态，也符合现代汉语叙事习惯。
- source_word: שִׁית זוֹנָה
  choice: 身穿妓女的装束
  rationale: שִׁית 在这里指衣着、装束；该译法保留外在打扮的含义，不把她的身份直接等同于妓女。
- source_word: וּנְצֻרַת לֵב
  choice: 心思深藏
  rationale: נצר 的被动形式含守住、封存之意，与“心”连用时暗示内在意图不显露。“心思深藏”既保留隐蔽的意象，也避免直接断定为“诡诈”。
theological_decisions:
- issue: וּנְצֻרַת לֵב 是否明确表示诡诈
  choice: 正文译作“心思深藏”
  alternative: “心里诡诈”或“心机深沉”
  rationale: 原文的字面意象是心被守住或封藏；上下文可使人联想到狡猾，但词组本身仍有含蓄和歧义，因此不在正文中把负面推论绝对化。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“看哪”保留智慧文学叙事中的现场感；全句节奏明快，并避免古奥表达。
