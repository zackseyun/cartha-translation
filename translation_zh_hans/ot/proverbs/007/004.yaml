  text: Say to wisdom[a], “You are my sister,” and call understanding your kinswoman,
translation:
  language: zh_hans
  text: 要对智慧说：“你是我的姐妹。”要称悟性为你的密友。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “密友”或可译作“亲属”、“熟人”或“知己”。希伯来语 מוֹדָע 指所熟识的人，按语境可涵盖从熟人、亲近朋友到亲属的不同关系。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱמֹר לַחָכְמָה
  choice: 要对智慧说
  rationale: אֱמֹר是阳性单数命令式，לַחָכְמָה标明说话对象；译文保留直接劝诫和《箴言》中“智慧”的人格化。
- source_word: אֲחֹתִי אָתְּ
  choice: 你是我的姐妹
  rationale: אֲחֹתִי是带第一人称单数后缀的亲属称谓，אָתְּ是阴性单数独立代词，在此作谓语；中文补出判断词“是”，并保留亲密的家庭隐喻。
- source_word: וּמֹדָע
  choice: 亲友
  rationale: מוֹדָע可指熟识的人、亲近者或亲属；“亲友”既传达亲密熟识，也不把语义限定为血缘关系，并与前句“姐妹”的关系性表达相呼应。
- source_word: לַבִּינָה
  choice: 悟性
  rationale: בִּינָה在《箴言》中常指理解、辨识和洞察的能力；“悟性”简洁自然，并与“智慧”形成传统而清楚的诗性配对。
- source_word: תִקְרָא
  choice: 要称……为
  rationale: 未完成式在与前一命令式平行的劝诫结构中具有指令语气；“称……为”自然表达给某人一个关系称谓的意思。
