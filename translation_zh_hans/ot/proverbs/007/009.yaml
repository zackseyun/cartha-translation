  yaml_path: translation/ot/proverbs/007/009.yaml
  text: at twilight[a], in the evening of the day, in the black of night and darkness.
translation:
  language: zh_hans
  text: 在黄昏，在日暮时分，在夜色最深黑之时[a]，在幽暗之中。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“在夜的瞳孔中”；这是希伯来语的意象性说法，指夜最深、最黑的时候。
    reason: 说明אִישׁוֹן לַיְלָה的字面意象及其在本句中的惯用含义。
lexical_decisions:
- source_word: נֶשֶׁף
  choice: 黄昏
  rationale: 该词可指晨昏的朦胧时段；本节与日暮、黑夜和幽暗层层并列，语境明确指向入夜前的黄昏。
- source_word: עֶרֶב יוֹם
  choice: 一天将晚之时
  rationale: 保留“日”与“晚”两层时间信息，并以自然现代汉语表达从黄昏走向夜晚的推进。
- source_word: אִישׁוֹן לַיְלָה
  choice: 夜最深处
  rationale: אִישׁוֹן本义与眼睛的“瞳人、瞳孔”有关，此处构成希伯来语意象，指夜最深、最黑的时分；正文采用清楚而庄重的意译，字面意象收入脚注。
- source_word: וַאֲפֵלָה
  choice: 在幽暗之中
  rationale: אֲפֵלָה表示浓重的黑暗或昏暗；“幽暗”保留其较强色彩，也避免与前面的“夜最深处”机械重复。
- source_word: בְּ ... בְּ ... בְּ
  choice: 在……在……在……
  rationale: 重复“在”来呈现原文连续的时间定位和逐步深入黑暗的节奏。
