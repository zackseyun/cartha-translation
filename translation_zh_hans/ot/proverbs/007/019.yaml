  text: For the man is not at his house[a]; he has gone on a journey far away.
translation:
  language: zh_hans
  text: 因为那人不在自己家里[a]；他已经远行去了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我丈夫不在家。”希伯来文较直译为“那人不在自己家里”，以间接的说法指她的丈夫。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上下文，说明女子为何断言不会被撞见，保留因果关系。
- source_word: אֵין
  choice: 不在
  rationale: 与人物和地点短语连用时表示缺席；现代汉语用“不在”自然准确。
- source_word: הָאִישׁ
  choice: 那男人
  rationale: 原文直译为“那男人”，语境中指她的丈夫；正文保留这种间接称呼，不直接释作“我丈夫”。
- source_word: בְּבֵיתוֹ
  choice: 在自己家里
  rationale: 保留原文“他的家”的所属意味；因主语已经明确，汉语用反身代词“自己”更自然，也避免误指。
- source_word: הָלַךְ
  choice: 出门……了
  rationale: 表示已经离去且目前仍不在；“出门……了”在汉语中自然传达这一现时相关性。
- source_word: בְּדֶרֶךְ
  choice: 远行
  rationale: 该短语在此表示踏上旅程；与距离词合译为“远行”，简洁而符合现代汉语。
- source_word: מֵרָחוֹק
  choice: 远
  rationale: 表达空间上的遥远，而非旅程持续时间长；在“远行”中保留这一含义。
