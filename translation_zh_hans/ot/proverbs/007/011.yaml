  language: zh_hans
  text: 她喧闹又悖逆；她的脚不在家中停留。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֹמִיָּה
  choice: 喧闹
  rationale: 该词描写吵嚷、骚动不安；“喧闹”既保留声音响亮之意，也符合本节对人物举止的刻画。
- source_word: וְסֹרָרֶת
  choice: 又悖逆
  rationale: 源自动词 סרר，表示顽梗、不受约束或反叛；“悖逆”准确保留其道德意味，且与智慧文学的庄重语体相称。
- source_word: בְבֵיתָהּ לֹא יִשְׁכְּנוּ רַגְלֶיהָ
  choice: 双脚从不安守家中
  rationale: 原文以“双脚”为主语，直译其身体意象；“安守”传达 שׁכן 在某处停留、居处的意思，并体现她不肯待在家里的习性。
theological_decisions: []
translation_notes:
  register: 采用现代、凝练而庄重的箴言体。“双脚”保留希伯来文的具体意象；“安守家中”比纯口语的“待在家里”更贴近原文，并与上下文的道德劝诫语域协调。
