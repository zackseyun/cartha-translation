base_translation:
  language: en
  yaml_path: translation/ot/proverbs/007/005.yaml
  text: to keep you from the forbidden woman[a], from the foreign woman whose words are smooth.
translation:
  language: zh_hans
  text: 使你远离不正当的女子，远离那话语圆滑的陌生女子[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “陌生女子”也可译作“外来的女子”或“外族女子”。这里与前面的“不正当的女子”对应两个希伯来语近义词；在《箴言》中，这些词可指正当关系之外的女子。原文“话语圆滑”直译为“使她的话语变得圆滑”，也可含“谄媚、奉承”的意思。
    reason: 说明 נָכְרִיָּה 的词义范围、与 זָרָה 的平行关系，并保留 חלק 使役形的字面意象及其可能的谄媚含义。
lexical_decisions:
- source_word: לִשְׁמָרְךָ
  choice: 使你远离
  rationale: 带 ל 的不定式承接上文，表示目的；שׁמר 在这里是保护、看守，使人免受诱惑。现代汉语用“使你远离”自然表达其保护作用，也与两个 מִן 短语相配。
- source_word: מֵאִשָּׁה זָרָה
  choice: 不正当的女人
  rationale: זָרָה 字面可指陌生或外来的女人，但在《箴言》的语境中，这一搭配指处于正当婚约和性伦理界限之外的女人。“不正当的女人”传达语境中的道德含义，同时避免把重点误解为族裔身份。
- source_word: מִנָּכְרִיָּה
  choice: 外女
  rationale: נָכְרִיָּה 较直接表示外来的、陌生的女人。译作“外女”既保留它与前行 זָרָה 的词汇区别和诗句平行，也延续《箴言》中指不属于正当关系之诱惑者的用法；脚注说明其可能含义。
- source_word: אֲמָרֶיהָ הֶחֱלִיקָה
  choice: 用花言巧语诱惑人的
  rationale: 希伯来语字面是“使她的话变得圆滑”，חלק 的使役形在此表示以圆滑、谄媚的话引诱。汉语译作“用花言巧语诱惑人的”自然地呈现其语用含义，脚注保留原文意象。
theological_decisions:
- issue: זָרָה 与 נָכְרִיָּה 是否专指外族女子或淫妇
  choice: 正文分别译为“不正当的女人”和“外女”，不明确限定为某一族裔或婚姻身份
  alternative: 译为“外族女人”或“淫妇”
  rationale: 原文的两个词具有“陌生、外来”的词义，并在《箴言》中承载越过正当性关系界限的伦理含义；原句本身没有明说她必为外族人或已婚通奸者，因此不宜把其中一种解释写死。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“不正当的女人”传达箴言语境中的伦理界限；“外女”保留诗歌平行句中两个近义词的区别。避免使用容易被理解为单纯性格古怪的“奇怪女子”，也不把原文过度限定为特定族裔或已婚身份。
