  yaml_path: translation/ot/proverbs/007/012.yaml
  text: In the street[a], now in the squares[b], and beside every corner she lies in wait.
translation:
  language: zh_hans
  text: 她一会儿在街上，一会儿在广场上，又在每个街角附近埋伏。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “埋伏”也可译作“潜伏等候”或“伺机伏击”；原文动词带有隐蔽、伺机而动的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּעַם ... פַּעַם
  choice: 一会儿……一会儿……
  rationale: 重复的פַּעַם表示地点上的交替转换；“一会儿……一会儿……”自然地保留了她不断变换所在之处的生动画面。
- source_word: בַּחוּץ
  choice: 在街上
  rationale: חוּץ可指户外或公共街道区域；结合城市语境，译作“在街上”清楚自然。
- source_word: בָּרְחֹבוֹת
  choice: 在广场上
  rationale: רְחֹבוֹת指城中的宽阔公共空间或广场；此译法也与前面的“街上”形成区别。
- source_word: וְאֵצֶל כָּל־פִּנָּה
  choice: 又在每个街角附近
  rationale: אֵצֶל表示靠近，פִּנָּה意为角落；在城市场景中，“每个街角附近”明确而自然。
- source_word: תֶאֱרֹב
  choice: 埋伏
  rationale: ארב表示隐蔽地等候、伺机伏击；“埋伏”保留了原文暗中窥伺和捕食性的意味。
theological_decisions: []
