  yaml_path: translation/ot/proverbs/007/015.yaml
  text: Therefore I came out to meet you[a], to seek your face, and I have found you.
translation:
  language: zh_hans
  text: 所以，我出来迎接你，为要寻找你[a]，并找到了你。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “寻找”也可译作“一早寻找”或“殷切寻找”；希伯来语动词可含清早或恳切寻求的意味。“寻找你”原文直译为“寻求你的面”。
    reason: 说明希伯来语动词的词义幅度，并保留“面”这一原文表达。
lexical_decisions:
- source_word: עַל כֵּן
  choice: 所以
  rationale: 该短语表示因果承接；“所以”既忠实传达因果关系，也符合现代汉语叙述习惯。
- source_word: יָצָאתִי
  choice: 我出来
  rationale: 该动词意为“出去、出来”；说话者正在描述自己外出迎向对方，“出来”自然贴合现场语境。
- source_word: לִקְרָאתֶךָ
  choice: 迎接你
  rationale: לִקְרַאת 常表示朝某人而去、与其相迎；“迎接你”保留主动前往相会的意味。
- source_word: לְשַׁחֵר פָּנֶיךָ
  choice: 为要寻找你
  rationale: 字面涉及“寻求你的面”，在此是寻求见到对方的希伯来语表达。“寻找你”在现代汉语中自然清楚；动词还可能含一早寻找或殷切寻找之意，留在脚注说明。
- source_word: וָאֶמְצָאֶךָּ
  choice: 也找到了你
  rationale: 该形式推进叙事，基本义为“我找到了你”。“也”承接前面的寻找行动，不额外指定时间或结果程度。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重的现代标准汉语。正文避免生硬直译“寻求你的面”，同时借脚注保留原文意象及“清早／殷切寻找”的真实词义歧义。
