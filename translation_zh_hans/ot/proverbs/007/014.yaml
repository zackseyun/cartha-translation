  yaml_path: translation/ot/proverbs/007/014.yaml
  text: Peace offerings were due from me[a]; today I have paid my vows.
translation:
  language: zh_hans
  text: 我有平安祭要献[a]；今天已经还了所许的愿。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“团契祭”。希伯来语指“平安／福祉”的祭；献祭后，献祭者可以吃其中一部分祭肉。
    reason: 说明祭名的另一译法及其献后可食用祭肉的语境，不将这一语境含义加入正文。
lexical_decisions:
- source_word: זִבְחֵי שְׁלָמִים
  choice: 平安祭
  rationale: 该组合词直指为平安、福祉而献的祭。在现代中文圣经语境中，“平安祭”既保留祭祀术语，也比逐字译作“平安祭的祭牲”自然。
- source_word: עָלַי
  choice: 我本有……要献
  rationale: עַל加第一人称单数词尾在此表示责任落在说话者身上，即她有应当献上的祭；“本有……要献”以自然中文表达这种义务，并与下句已经还愿相衔接。
- source_word: הַיּוֹם
  choice: 今天
  rationale: 直接、自然地表达原文的时间副词。
- source_word: שִׁלַּמְתִּי
  choice: 已经还了
  rationale: שׁלם的Piel词形与“愿”连用时表示偿还、履行所许的愿；“已经还了”保留“还愿”的具体祭祀含义和动作的完成性。
- source_word: נְדָרָי
  choice: 我所许的愿
  rationale: נֶדֶר为“誓愿”，复数并带第一人称单数词尾；译作“我所许的愿”符合现代汉语，不额外加入原文没有明说的“祭物”。
theological_decisions:
- issue: 淫妇言语中的献祭和还愿用语
  choice: 明确保留“平安祭”和“还愿”的敬拜术语，不作道德化改写
  alternative: 泛化为“我家有肉”或“我已经尽了宗教义务”
  rationale: 本节刻意让说话者借正当敬拜的语言为诱惑增添体面；译文应保留这种张力，而不替读者消解。
- issue: עָלַי所表达的是义务还是现有祭肉
  choice: 正文表达先前负有献祭义务，随后当天已经还愿
  alternative: 译作“我这里有平安祭的肉”
  rationale: 介词结构最直接可表示落在说话者身上的责任，下句“今天已经还了我所许的愿”也支持这一衔接；祭肉可食是语境上可能引出的含义，置于脚注说明而不写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“我本有……要献；今天已经……”清楚呈现先前义务与当日完成之间的关系；“还了我所许的愿”比单说“还愿”略为展开，便于普通读者理解，同时保留祭祀语境。
