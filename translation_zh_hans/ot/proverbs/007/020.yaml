  text: He took a bag of money in his hand[a]; he will come home at the full moon.
translation:
  language: zh_hans
  text: 他手里拿着一袋银钱；到月圆之日[a]，他会回家。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“约定的日子。”这里的希伯来词含义不确定，也有人理解为“新月”；正文译作“月圆之日”，较符合本段语境。
    reason: lexical_alternative
lexical_decisions:
- source_word: צְרוֹר
  choice: 一袋
  rationale: 该词指扎起来的包裹；在这里是装钱的袋子。译作“一袋”自然简洁，也与出门远行的语境相符。
- source_word: הַכֶּסֶף
  choice: 银钱
  rationale: כֶּסֶף本义为“银”，也常转指钱财。“银钱”既保留原词的具体意象，又能让现代读者明白是旅途所带的钱款。
- source_word: לָקַח בְּיָדוֹ
  choice: 手里带着
  rationale: 直译近于“拿在他手中”。汉语用“手里带着”既保留具体表达，也自然表示他已把钱带走。
- source_word: לְיוֹם הַכֵּסֶא
  choice: 要到月圆之日才
  rationale: 介词短语指出回家的时间；加“才”自然传达其归期尚远，符合女子用此话消除顾虑的语境。הַכֵּסֶא词义有争议，正文采用较符合此处月相及延迟归期语境的“月圆之日”。
- source_word: יָבֹא בֵיתוֹ
  choice: 回家
  rationale: 希伯来文直译为“来到他的家”。在丈夫外出的上下文中，“回家”是自然准确的现代汉语表达。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“银钱”兼顾原文“银”的字面意义与“钱财”的实际用法；“要到……才”清楚表达归期较迟。正文保留脚注标记[a]，不把有争议的月相词义绝对化。
