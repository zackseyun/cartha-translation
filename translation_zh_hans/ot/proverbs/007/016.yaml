  footnotes:
  - marker: a
    text: 本节几个织物名称在希伯来语中十分罕见。也可译作：“我用有花纹的织物铺好了床榻，用的是埃及的细麻布。”其中“彩色”也可能指有花纹、条纹或刺绣等装饰性织物。
