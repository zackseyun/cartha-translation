lexical_decisions:
- source_word: מַרְבַדִּים
  choice: 毯子
  rationale: 该复数名词指铺在床榻上的厚实或装饰性织物；“毯子”自然易懂，同时不把它限定为地毯。
- source_word: רָבַדְתִּי
  choice: 铺好了
  rationale: 动词表示铺设、铺陈或分层摆放；“铺好了”符合女子描述准备工作已经完成的语境。
- source_word: עַרְשִׂי
  choice: 床榻
  rationale: 该词可指床或卧榻；“床榻”既保留古代起居陈设的意味，也适合本段亲昵而奢华的场景。
- source_word: חֲטֻבוֹת
  choice: 彩色
  rationale: 这是罕见词，字面可能与“雕刻、切割”有关，在织物语境中常被理解为有花纹、条纹或经过装饰；正文用“彩色”表达装饰性，但以脚注保留不确定性。
- source_word: אֵטוּן
  choice: 细麻布
  rationale: 罕见的纺织品用语，可指纱线、麻布或织物；与埃及相连时，“细麻布”符合古代奢华进口织物的语境，但并非唯一可能。
- source_word: מִצְרָיִם
  choice: 埃及的
  rationale: 直接保留来源关系，表示这种织物来自埃及，避免仅用形容词而弱化产地含义。
