  text: דַּרְכֵ֣י שְׁא֣וֹל בֵּיתָ֑/הּ יֹ֝רְד֗וֹת אֶל חַדְרֵי מָֽוֶת־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/007/027.yaml
  text: Her house is the way to Sheol[b][a], going down to the chambers of death.
translation:
  language: zh_hans
  text: 她的家是通往阴间[a]的条条道路，下通死亡的内室。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “阴间”指死者所在的领域；也可译作“坟墓”，但原词的含义通常比单一墓穴更广。
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּרְכֵי
  choice: 条条道路
  rationale: 希伯来语为复数构造形式“道路/路径”。中文保留复数意象，以便与后面的复数分词“直下”所描绘的多条死亡之路相呼应；“条条”也使表达自然。
- source_word: שְׁאוֹל
  choice: 阴间
  rationale: 指死者所在的领域，并非仅指坟墓，也不应等同于后期教义中受刑罚的地狱；“阴间”是现代中文圣经语境中较准确且易懂的对应词。
- source_word: בֵּיתָהּ
  choice: 她的家
  rationale: 按上下文指那女子的房屋，也是人进入危险之地的形象；“家”比“家室”更贴近此处空间含义。
- source_word: יֹרְדוֹת
  choice: 直下
  rationale: 阴性复数分词与“道路”一致，描绘持续向下的走向。“直下”简洁保留方向感和诗歌力度，而不额外加入使役性的“引向”。
- source_word: אֶל
  choice: 到
  rationale: 保留标准方向含义，与“直下”自然搭配。
- source_word: חַדְרֵי
  choice: 密室
  rationale: 该词指内室、深处的房间；“密室”既保留房屋意象，也传达幽深、封闭而不祥的诗意。
- source_word: מָוֶת
  choice: 死亡
  rationale: 按普通名词处理，不将其人格化，也不额外解释为永刑。
theological_decisions:
- issue: שְׁאוֹל 的译法
  choice: 阴间
  alternative: 坟墓；死者的领域
  rationale: 原词所指比单一墓穴更广，但本节也没有明确表达后期意义上的“地狱”。译作“阴间”既保留古希伯来死亡观念的范围，也避免导入额外教义。
- issue: 复数“道路”与单数“家”的关系
  choice: 她的家是通往阴间的条条道路
  alternative: 她的家是通往阴间的道路
  rationale: 保留原文复数所造成的张力：单一的“家”被断言为多条通往死亡领域的路径，而不在正文中把复数归并为集合单数。
translation_notes:
  register: 采用现代、庄重而具箴言诗歌力度的表达。“条条道路—直下—密室”保留原文复数结构、下降动势和房屋内部意象。正文中的脚注标记[a]与脚注完全对应。
