  text: 'She seized him and kissed him[a]; with a bold face she said to him:'
translation:
  language: zh_hans
  text: 她抓住他，亲吻他，厚着脸皮对他说：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהֶחֱזִיקָה בּוֹ
  choice: 她抓住他
  rationale: החזיק 与 ב 连用表示抓住或把持；“抓住”自然、直接，也传达此处主动而突然的动作。
- source_word: וְנָשְׁקָה לּוֹ
  choice: 亲吻他
  rationale: נשק 的 Qal 词形通常意为“亲吻”；采用简洁直译，保留希伯来文连续叙事的节奏。
- source_word: הֵעֵזָה פָנֶיהָ
  choice: 厚着脸皮
  rationale: 该表达直指她使自己的脸刚强，含有厚颜、毫不羞怯而大胆行事之意；“厚着脸皮”是现代汉语中自然且能保留“脸”这一意象的习语。
- source_word: וַתֹּאמַר לוֹ
  choice: 对他说
  rationale: 保留原文明确的间接宾语 לוֹ，突出话是直接对他说的。
theological_decisions: []
translation_notes:
  register: 采用现代、清楚而庄重的叙事语言。“厚着脸皮”虽较具口语习语色彩，但准确保留原文的面部意象及厚颜大胆的语气；本节不另加脚注，因为译文已直接表达该习语的核心含义。
