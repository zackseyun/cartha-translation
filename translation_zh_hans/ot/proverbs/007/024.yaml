  text: וְ/עַתָּ֣ה בָ֭נִים שִׁמְעוּ לִ֑/י וְ֝/הַקְשִׁ֗יבוּ לְ/אִמְרֵי פִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/007/024.yaml
  text: And now[a], sons, listen to me, and pay attention to the words of my mouth.
translation:
  language: zh_hans
  text: 现在，儿子们，你们要听我，留心我口中的话。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: 所以现在
  rationale: 连词与时间副词共同承接上文的警告，并引出新的劝诫；“所以现在”在现代汉语中自然地体现这一推论兼转折性的语篇推进。
- source_word: בָנִים
  choice: 孩子们
  rationale: 原文为阳性复数“儿子们”，是《箴言》智慧训诲中常见的师长式称呼；汉语“孩子们”较自然，也可表达群体性的受教者称呼，脚注保留其字面性别形式。
- source_word: שִׁמְעוּ לִי
  choice: 要听我
  rationale: שׁמע 与 ל 连用表示专心听从说话者；“要听我”简洁自然，并保留命令语气。
- source_word: וְהַקְשִׁיבוּ
  choice: 要留心
  rationale: 该使役词形强调专注聆听；“留心”既符合智慧文学的劝诫语体，也比“注意”更适合与后面的“话”搭配。
- source_word: לְאִמְרֵי פִי
  choice: 我口中的话
  rationale: 原文直译为“我口里的言语”。“我口中的话”保留身体意象和诗性表达，同时符合现代汉语习惯。
theological_decisions:
- issue: 智慧训诲中带性别的呼语
  choice: 正文译作“孩子们”，脚注说明原文直译为“儿子们”
  alternative: 正文译作“儿子们”
  rationale: בָנִים 在形式上明确为阳性复数，但在箴言的训诲场景中也是固定的受教者称呼。现代汉语直接说“儿子们”容易被理解为说话者仅称呼自己的多个亲生儿子；采用“孩子们”可自然传达训诲对象，同时以脚注透明保留原文的阳性形式及其可能的代表性范围。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“所以现在”承接前文并开启总结性劝告；两个“要”再现原文并列命令的力度，“我口中的话”保留希伯来语的诗性身体意象。
