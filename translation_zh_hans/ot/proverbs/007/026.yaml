base_translation:
  language: en
  yaml_path: translation/ot/proverbs/007/026.yaml
  text: For she has cast down many wounded[a], and all her slain are mighty.
translation:
  language: zh_hans
  text: '因为她使许多受伤者倒下[a]；

    她所杀的，全都是强者。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“她使许多被杀的人倒下。”这里的名词也可译为“被杀的人”，而不译作“受伤者”；正文保留后者，以体现与下句“她所杀的”之间的递进。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文的警告并说明原因；“因为”在现代汉语中自然保留其解释作用。
- source_word: רַבִּים
  choice: 许多
  rationale: 准确表达数量众多，简洁自然。
- source_word: חֲלָלִים
  choice: 受伤的人
  rationale: 该词可指受伤者，也可指被杀者；正文采用“受伤的人”，以保留与下句“她所杀的”之间可能存在的递进，同时用脚注注明另一种译法。
- source_word: הִפִּילָה
  choice: 使……倒下
  rationale: 忠实体现 נפל 的使役式含义，即“使之倒下”，也保留诗句中受害者被击倒的鲜明意象。
- source_word: וַעֲצֻמִים
  choice: 强壮的人
  rationale: 形容词在此作名词性表语，表示强壮有力；此译法突显连强者也成为她的受害者。
- source_word: כָּל
  choice: 全是
  rationale: 自然表达总括意义，并与汉语表语结构顺畅衔接。
- source_word: הֲרֻגֶיהָ
  choice: 她所杀的
  rationale: 以自然现代汉语表达“被她杀死的人”，同时保留阴性单数施事者与受害者之间的关系。
