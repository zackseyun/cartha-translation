  yaml_path: translation/ot/proverbs/007/002.yaml
  text: Keep my commandments and live[a], and my instruction as the pupil of your eye.
translation:
  language: zh_hans
  text: 遵守我的诫命，你就存活；要守护我的训诲，如同守护你眼中的瞳仁[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “瞳仁”原文也可直译为“眼中的小人”，指瞳孔；这个说法表达要像保护眼睛一样悉心守护、珍视。
    reason: 解释希伯来语眼部习语及其谨慎守护、珍视的含义。
lexical_decisions:
- source_word: שְׁמֹר
  choice: 遵守／守护
  rationale: שׁמר兼有遵行与谨慎看守之意。与“诫命”搭配用“遵守”，与下半句珍视瞳仁的比喻搭配用“守护”，以自然中文呈现同一词根在语境中的两面含义。
- source_word: מִצְוֺתַי
  choice: 我的诫命
  rationale: מִצְוָה指具有约束力的命令；“诫命”庄重、清楚，也符合智慧文学语境。
- source_word: וֶחְיֵה
  choice: 你就存活
  rationale: 原文以“并且活”简洁连接命令及其结果。“你就存活”保留结果意味，同时不把其中关系扩写得过于明确。
- source_word: וְתוֹרָתִי
  choice: 我的训诲
  rationale: 箴言中的תּוֹרָה主要指父母或智慧教师的教导，并非仅指成文律法；“训诲”兼具教导、劝戒和权威意味。
- source_word: כְּאִישׁוֹן עֵינֶיךָ
  choice: 如同守护眼中的瞳仁
  rationale: אִישׁוֹן在此眼部习语中指瞳孔。“瞳仁”是自然的现代中文表达；补出原文省略而由上文支配的“守护”，使比较关系清楚。
theological_decisions:
- issue: 智慧文学中תּוֹרָה的含义
  choice: 训诲
  alternative: 律法／教导
  rationale: 说话者称之为“我的”תּוֹרָה，语境指父辈或智慧教师的训导。“训诲”保留其权威性和智慧文学色彩，又避免将其限定为摩西律法。
- issue: וֶחְיֵה所表达的命令与结果关系
  choice: 你就存活
  alternative: 并且活着／好使你存活
  rationale: 希伯来文并列结构容许命令后的结果意味。“你就存活”在中文中自然传达这一含蓄关系，但不把它明确改写为目的从句。
translation_notes:
  register: 采用现代、庄重而通顺的标准普通话。“遵守”适合诫命语境，“守护”则使下半句的眼睛比喻清楚有力；分号呈现原文两个紧密相连的劝命。
