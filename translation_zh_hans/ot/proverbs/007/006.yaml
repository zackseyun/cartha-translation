  yaml_path: translation/ot/proverbs/007/006.yaml
  text: For at the window of my house[a], through my lattice, I looked out,
translation:
  language: zh_hans
  text: 因为我曾在我家窗前，透过窗棂向外望去。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 在这里引出下文所叙之事，说明前面劝诫的根据；“因为”保留了解释性的承接关系。
- source_word: בְּחַלּוֹן בֵּיתִי
  choice: 在我家的窗前
  rationale: חַלּוֹן意为“窗户”，介词בְּ在此表达观察者所在的位置；“在……窗前”符合现代汉语习惯。
- source_word: בְּעַד
  choice: 透过
  rationale: 该介词在视觉语境中表示从遮挡物或开口后面向外看，“透过”准确传达这一空间关系。
- source_word: אֶשְׁנַבִּי
  choice: 窗棂
  rationale: 该词指带格栅的窗洞、窗格或窗扇；“窗棂”保留古代建筑的具体形象，也与前面的“窗”有所区分。
- source_word: נִשְׁקָפְתִּי
  choice: 向外观看
  rationale: 该动词表示从较高处或某个开口向外、向下看；“向外观看”自然清楚，不额外加入“窥视”等主观意味。
