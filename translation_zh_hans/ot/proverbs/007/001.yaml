  text: בְּ֭נִ/י שְׁמֹ֣ר אֲמָרָ֑/י וּ֝/מִצְוֺתַ֗/י תִּצְפֹּ֥ן אִתָּֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/007/001.yaml
  text: My son[a], keep my words, and treasure up my commandments with you.
translation:
  language: zh_hans
  text: 我儿，要谨守我的话，把我的诫命珍藏[a]在身边。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “珍藏”也可译作“存放”或“藏好”。希伯来语动词可表示把东西仔细存起或隐藏，以便妥善保全。
    reason: 说明 תִּצְפֹּן 的词义范围，保留“储存”与“藏好”之间的原文意象。
lexical_decisions:
- source_word: בְּנִי
  choice: 我儿
  rationale: 原文是阳性单数名词“儿子”加第一人称单数后缀，是《箴言》中父辈对儿子的直接称呼；“我儿”既准确，也符合现代汉语智慧训诲的庄重语体。
- source_word: שְׁמֹר
  choice: 谨守
  rationale: 该祈使式兼有留心守护、持守并遵行的含义。“谨守”能自然表达认真保存和服从训诲两方面。
- source_word: אֲמָרָי
  choice: 我的话
  rationale: 此处指说话者所传的训诲；“我的话”宽泛、自然，不把它限缩为格言或特定形式的言论。
- source_word: וּמִצְוֺתַי
  choice: 把我的诫命
  rationale: מִצְוָה表示命令、诫命；“诫命”保留原文正式而具有道德分量的语气。汉语按第二分句句法添加处置标记“把”。
- source_word: תִּצְפֹּן
  choice: 珍藏
  rationale: צפן可指把某物藏起或仔细储存以保全。“珍藏”在此既传达妥善保存，也符合把训诲看为宝贵之物的语境，但不强行解释为仅仅记在心里。
- source_word: אִתָּךְ
  choice: 在身边
  rationale: 原文直义为“与你同在／在你那里”，表示随身或近身保存。“在身边”是自然汉语，并避免把原文过度具体化为“在心里”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的父辈训诲语体。“我儿”保留原文男性单数称呼；两分句用“谨守／珍藏”形成自然平行。“在身边”保留 אִתָּךְ 的空间性和伴随意味，不释义为“牢记在心”。
