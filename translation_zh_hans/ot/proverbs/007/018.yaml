  text: Come[a], let us drink our fill of love until morning[b]; let us delight ourselves with love.
translation:
  language: zh_hans
  text: 来吧，让我们饱享欢爱[a]，直到清晨；让我们在爱恋[b]中尽情欢悦。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “饱享”直译为“喝到满足”。“欢爱”也可译为“爱意”或“爱抚”；本节语境带有情色意味。
    reason: lexical_alternative
  - marker: b
    text: 也可译为“爱情”或“欢爱”。此词在这里与前句相呼应，指带有情色意味的爱恋。
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכָה
  choice: 来吧
  rationale: הלך的祈使形式在这里用作邀约和催促；“来吧”自然传达诱惑性的召唤。
- source_word: נִרְוֶה
  choice: 让我们畅饮
  rationale: רוה表示“喝足、饱饮”；“畅饮”保留了原文以饮水喻满足欲望的鲜明意象。
- source_word: דֹדִים
  choice: 爱情
  rationale: 该复数名词在情色语境中可指爱情、爱抚或亲昵行为；“爱情”既保留一定含蓄性，也能与“畅饮”的比喻自然搭配。
- source_word: עַד הַבֹּקֶר
  choice: 直到清晨
  rationale: 直接表达时间界限，现代汉语自然明确。
- source_word: נִתְעַלְּסָה
  choice: 让我们尽情享受
  rationale: עלס的Hitpael形式表示欢悦、纵情享乐；“尽情享受”体现其相互投入并沉浸其中的意味。
- source_word: בָּאֳהָבִים
  choice: 爱抚
  rationale: אהבים的复数形式在本节语境中指情色的亲昵或作爱表达；“爱抚”比泛称“爱情”更具体，又不超出原文可承载的含义。
