  yaml_path: translation/ot/proverbs/007/021.yaml
  text: She persuades him with her abundant persuasion[a]; with the smoothness of her lips she compels him.
translation:
  language: zh_hans
  text: 她以百般劝诱[a]使他转向；以嘴唇柔滑的言辞催逼他前行。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“她以许多劝诱使他偏离；以她嘴唇的柔滑驱赶他向前。”
    reason: 词义可涵盖使人转离、驱赶或推动向前；保留两个动词较具空间方向感的译法。
lexical_decisions:
- source_word: הִטַּתּוּ
  choice: 使他转意
  rationale: 该词为נטה的使役形，表达使某人转向或动摇。译为“使他转意”既保留“转向”的意象，也符合此处受诱惑而改变心意的语境，避免直接加入原词本身未明说的性意味。
- source_word: בְּרֹב לִקְחָהּ
  choice: 用许多劝诱
  rationale: רֹב表示众多、丰富；לֶקַח可指教导、言辞或有说服力的话。此处言语意在诱引，因此“许多劝诱”自然传达其工具性和语境中的负面作用。
- source_word: בְּחֵלֶק שְׂפָתֶיהָ
  choice: 用嘴唇的柔滑
  rationale: 保留“嘴唇”的具体诗歌意象，并以“柔滑”呈现חֵלֶק的表层比喻；其含有奉承、圆滑言辞之意，但不在正文中将比喻完全解释掉。
- source_word: תַּדִּיחֶנּוּ
  choice: 把他催逼而去
  rationale: נדח的使役形可表示驱赶、迫使向前或使偏离。“催逼而去”保留强力推动和方向变化的动态感，不把它仅仅抽象化为“说服”或直接解释为“使他犯罪”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。前后两个分句保留希伯来诗句的平行结构；“柔滑”保留原文隐喻，“催逼而去”则呈现末尾动词较强的推动力度。
