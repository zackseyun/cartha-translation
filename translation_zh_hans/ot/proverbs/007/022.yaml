  text: ה֤וֹלֵ֥ךְ אַחֲרֶ֗י/הָ פִּ֫תְאֹ֥ם כְּ֭/שׁוֹר אֶל טָ֣בַח יָב֑וֹא וּ֝/כְ/עֶ֗כֶס אֶל מוּסַ֥ר אֱוִֽיל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/007/022.yaml
  text: He goes after her at once[a], like an ox going to the slaughter, and like a fetter to the discipline of a fool.
translation:
  language: zh_hans
  text: 他立刻跟随她，像牛走向屠宰，又如脚镣，归于愚昧人的管教。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节后半行的希伯来文词义和句法都很难确定。这里较直译为“又如脚镣，归于愚昧人的管教”；“脚镣”一词也有不同理解。有些译法将本句理解为“像鹿踏进网罗”，或“像镣铐，为愚昧人受惩戒而设”。
    reason: 说明后半行的原文不确定性，避免正文把脚镣的佩戴者、动作或“愚昧人的管教”的确切关系解释为确定含义，并保留主要替代译法。
lexical_decisions:
- source_word: הוֹלֵךְ אַחֲרֶיהָ
  choice: 跟着她走了
  rationale: הֹלֵךְ在这里生动描述男子随女子而去；“跟着她走了”符合现代汉语叙事，也准确表达אַחֲרֶיהָ所指的跟随。
- source_word: פִּתְאֹם
  choice: 立刻
  rationale: 此词在上下文中突出未经思考便迅速行动；“立刻”比“突然”更能表达仓促顺从。
- source_word: כְּשׁוֹר
  choice: 仿佛牛
  rationale: שׁוֹר泛指牛类；这里的画面是牲畜在不知结局的情况下被引向宰杀。“牛”自然、清楚，不额外限定性别或用途。
- source_word: אֶל טָבַח יָבֹא
  choice: 走向屠宰之地
  rationale: 原文直译近于“来到屠宰”；汉语用“走向屠宰之地”保留目的地和临近死亡的意象。
- source_word: וּכְעֶכֶס
  choice: 又仿佛……戴着脚镣
  rationale: עֶכֶס含义及本行句法均有争议，可能指脚镣、镣铐或脚饰。正文采用符合受约束语境的“脚镣”，并以脚注说明不确定性。
- source_word: אֶל מוּסַר
  choice: 去受管教
  rationale: מוּסָר在《箴言》中兼有训诫、纠正和惩戒意味；“受管教”在此保留纠正与惩戒两方面，不缩窄为单纯的“惩罚”。
- source_word: אֱוִיל
  choice: 愚昧人
  rationale: 这是《箴言》中常见的道德与智慧范畴，指拒绝智慧的人；“愚昧人”比口语化的“傻瓜”更庄重，也保持全书术语一致性。
theological_decisions:
- issue: 后半行主语及意象关系不明确
  choice: 译为“愚昧人戴着脚镣去受管教”
  alternative: 按词序直译为“又如脚镣走向愚昧人的管教”
  rationale: 希伯来文本后半行十分困难。正文以最少的句法补足形成可理解的现代汉语，但不把某一重构当作确定原文；脚注保留直译和其他可能解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“仿佛……又仿佛……”保留希伯来诗歌的平行结构；正文适度补足后半行句法以便诵读，同时用脚注明示原文的不确定性。
