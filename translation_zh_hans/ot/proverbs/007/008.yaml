  text: passing through the street near her corner[a], and he steps toward her house.
translation:
  language: zh_hans
  text: 他在街上从她的街角旁经过，并迈步走向她的家。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他沿着她的街角旁的市场街经过，并沿着通往她家的路迈步。”
    reason: 保留שׁוּק可指“市场街”，以及דֶרֶךְ בֵּיתָהּ可按其具体路线译为“沿着通往她家的路”的词汇和句法替代译法。
lexical_decisions:
- source_word: עֹבֵר
  choice: 经过
  rationale: 该词是עבר的Qal主动分词，在此铺陈所见场景；“经过”自然表达从某处走过的动作。
- source_word: בַּשּׁוּק
  choice: 从街上
  rationale: שׁוּק可指街道或市场街；上下文描写城中行走路线，“街上”最自然，同时不排除市场街的语义背景。
- source_word: אֵצֶל פִּנָּהּ
  choice: 靠近她的街角
  rationale: אֵצֶל表示临近；פִּנָּהּ直译为“她的角落/街角”，指与那女子相关的街角。“她的街角”保留原文的所属关系。
- source_word: וְדֶרֶךְ בֵּיתָהּ
  choice: 朝她家走去
  rationale: דֶרֶךְ בֵּיתָהּ表达通往或朝向她家的道路/路线；汉语以方向补语自然呈现其路线与目的地方向。
- source_word: יִצְעָד
  choice: 迈步
  rationale: צעד指迈步、行走；“迈步”保留具体的步行动作，也承接前面的场景性分词。
