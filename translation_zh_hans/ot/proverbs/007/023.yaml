  text: until an arrow pierces his liver[a], like a bird rushing into a snare, and he does not know that it will cost him his life.
translation:
  language: zh_hans
  text: '直到箭刺穿他的肝脏；


    他如同飞鸟急投罗网，


    却不知道这会要了他的命。[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译近于“这关乎他的性命”，也可理解为“这是针对他的性命”。希伯来文的表达简略；按上下文，意思是他所走的路会使他丧命。
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד
  choice: 直到
  rationale: 承接上一节的行动过程，引向致命结局；“直到”准确表达时间界限。
- source_word: יְפַלַּח
  choice: 刺穿
  rationale: 此处是פלח的Piel形态，表达强力穿透；“刺穿”自然并保留箭入身体的鲜明画面。
- source_word: חֵץ
  choice: 箭
  rationale: 该词通常指作为武器的箭，语境中无需泛化。
- source_word: כְּבֵדוֹ
  choice: 他的肝脏
  rationale: כָּבֵד通常指“肝脏”；保留具体器官，避免改写为“心”或笼统的“内脏”。
- source_word: כְמַהֵר צִפּוֹר אֶל־פָּח
  choice: 他如同飞鸟急投罗网
  rationale: מַהֵר表达急速趋向，צִפּוֹר泛指鸟，פָּח指捕鸟的网罗或陷阱；此译保持比喻的速度感和自投危险的意味。
- source_word: וְלֹא יָדַע
  choice: 却不知道
  rationale: 保留希伯来文直陈结构；“却”自然体现他急赴罗网与不知后果之间的反差。
- source_word: כִּי בְנַפְשׁוֹ הוּא
  choice: 这是要他的命
  rationale: 原文是省略式表达，直译近于“这是关乎/针对他的性命”；“这是要他的命”在现代汉语中清楚传达致死后果，同时以脚注保留原文歧义。
theological_decisions:
- issue: כִּי בְנַפְשׁוֹ הוּא的省略结构及致命含义
  choice: 正文译作“这是要他的命”，脚注说明直译可能
  alternative: “这是关乎他的性命”或“这是以他的性命为代价”
  rationale: 上下文明确描写死亡危险，但希伯来文介词短语本身简略，正文需自然可懂，脚注则保存其形式和一定的语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的箴言体。分行保留诗句的意象推进；“肝脏”忠实呈现具体而强烈的希伯来意象，“罗网”和“要他的命”则兼顾传统经文语感与当代可理解性。
