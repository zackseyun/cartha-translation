base_translation:
  language: en
  yaml_path: translation/ot/proverbs/007/017.yaml
  text: I have perfumed my bed with myrrh[a], aloes, and cinnamon.
translation:
  language: zh_hans
  text: 我用没药、沉香木[a]和肉桂熏香了我的床。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“香木”。这里所说的是用于制香的芳香木材，不是通常所说的芦荟植物。
    reason: lexical_alternative
lexical_decisions:
- source_word: נַפְתִּי
  choice: 熏香了
  rationale: 该动词在此指把香料施用于床榻，使其带上香气。“熏香了”自然表达预备床榻并使之芳香的结果；不机械译作“洒了”，因为原文重点在香料所产生的芳香效果。
- source_word: מִשְׁכָּבִי
  choice: 我的床
  rationale: מִשְׁכָּב可指躺卧之处、床或榻；在本段引诱的语境中，“我的床”最清楚、自然。
- source_word: מֹר
  choice: 没药
  rationale: מור指芳香树脂“没药”，这是现代中文圣经语境中准确而通行的名称。
- source_word: אֲהָלִים
  choice: 沉香木
  rationale: 此词在这里指用于制香的芳香木材，并非通常所说的现代芦荟植物。“沉香木”能较自然地避免误解；脚注保留词义辨识及另一常见译名。
- source_word: וְקִנָּמוֹן
  choice: 和肉桂
  rationale: קנמון指香料肉桂；连接词וְ在香料并列中自然译为“和”。
theological_decisions: []
