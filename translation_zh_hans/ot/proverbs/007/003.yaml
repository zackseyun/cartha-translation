source:
  edition: WLC
  text: קָשְׁרֵ֥/ם עַל אֶצְבְּעֹתֶ֑י/ךָ כָּ֝תְבֵ֗/ם עַל ל֥וּחַ לִבֶּֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/007/003.yaml
  text: Tie them on your fingers[a]; write them on the tablet of your heart.
translation:
  language: zh_hans
  text: 把它们系在你的手指上[a]，写在你的心版上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“绑在你的手指上”。
    reason: קשר 可表示“系住”或“绑住”；两者都保留原文的具体动作。
lexical_decisions:
- source_word: קָשְׁרֵם
  choice: 把它们系在
  rationale: 这是 קשר 的第二人称阳性单数命令式，带第三人称阳性复数后缀，意为“系住／绑住它们”。“系在”既自然，又保留把训诲固定在身边的具体意象。
- source_word: עַל אֶצְבְּעֹתֶיךָ
  choice: 你的手指上
  rationale: עַל 在这里表示位置；אֶצְבְּעֹתֶיךָ 是复数“你的手指”。译文保留复数和佩戴于手指之上的形象。
- source_word: כָּתְבֵם
  choice: 写
  rationale: 这是 כתב 的第二人称阳性单数命令式，带第三人称阳性复数后缀。“它们”已在前半句明示，汉语并列句可自然承接，避免重复而不损失意义。
- source_word: עַל לוּחַ לִבֶּךָ
  choice: 在你的心版上
  rationale: לוּחַ 指可供书写的版；לֵב 不仅涉及情感，也涵盖思想、意志和内在生命。“心版”保留原文把内心比作书写版面的具体隐喻及经文互文意味。
theological_decisions:
- issue: 训诲内化的隐喻
  choice: 保留“系在手指上”和“写在心版上”两个具体隐喻
  alternative: 意译为“常常记住，并铭刻在心”
  rationale: 原文借外在佩戴与内在书写构成平行意象；直保留这些意象，可呈现智慧训诲应当随时在手、深入内心的文学和神学张力，而不把它简化为解释性措辞。
translation_notes:
  register: 采用现代、简洁而庄重的命令语气。“手指”比单说“指头”更符合现代标准普通话；“心版”虽具经文色彩，但能清楚维持原文的书写隐喻。
