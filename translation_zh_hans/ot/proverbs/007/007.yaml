  yaml_path: translation/ot/proverbs/007/007.yaml
  text: and I saw among the simple[a]; I discerned among the young men a youth lacking sense.
translation:
  language: zh_hans
  text: 我在愚蒙人中看见；在年轻男子中，我察觉到一个缺乏判断力[a]的少年。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“缺少心”；这里的“心”指理解、判断和道德辨识的能力。
    reason: 说明希伯来语习语的字面意象及其在智慧文学中的含义。
lexical_decisions:
- source_word: וָאֵרֶא
  choice: 我……观看
  rationale: 这是 ראה 的第一人称单数叙事形式，表示说话者按事件次序所作的观察；译作“观看”既保留视觉动作，也与下文“察觉”有所区别。
- source_word: בַפְּתָאיִם
  choice: 在愚蒙人中
  rationale: פְּתָאיִם 在《箴言》中常指缺乏经验、容易受诱导的人。“愚蒙人”保留智慧文学中的人物类别，又不把它单纯解释为智力低下。
- source_word: אָבִינָה
  choice: 察觉
  rationale: 该词源于 בין，含辨明、看出之意；“察觉”表达由观察而得的辨识，并与前面的视觉动作相区分。
- source_word: בַבָּנִים
  choice: 在年轻人中
  rationale: בָּנִים 字面为“儿子们”，但此处按场景指一群年轻男子；“年轻人”符合现代汉语表达。
- source_word: נַעַר
  choice: 少年
  rationale: נַעַר 可指男孩至青年阶段的人；此人能独自在街上行走，“少年”既自然，也保留原词较宽的年龄范围。
- source_word: חֲסַר לֵב
  choice: 缺乏判断力
  rationale: 该短语字面是“缺少心”；在希伯来智慧文学中，“心”常涵盖理解、判断和道德辨识。“缺乏判断力”清楚传达习语含义，同时以脚注保留原文意象。
