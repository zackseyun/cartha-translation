  yaml_path: translation/ot/proverbs/011/022.yaml
  text: Like a gold ring in a pig’s snout is a beautiful woman who lacks discretion[a].
translation:
  language: zh_hans
  text: '猪鼻子上的金环，

    正如美貌却没有判断力的女人。[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“金鼻环在猪鼻子上，正如美貌却离弃判断力的女人。”
    reason: 保留נֶזֶם可明确指“鼻环”，以及סָרַת טָעַם较为字面的动态含义“离弃判断力”。
lexical_decisions:
- source_word: נֶזֶם
  choice: 环
  rationale: 该词指环形首饰，常可特指鼻环；下文“猪鼻上”已明确佩戴部位，因此正文用简洁自然的“环”。
- source_word: זָהָב
  choice: 金
  rationale: 保留贵重黄金与猪之间鲜明而突兀的对比；“金环”是现代汉语自然表达。
- source_word: בְּאַף חֲזִיר
  choice: 戴在猪鼻上
  rationale: אַף在此为具体的“鼻子”，חֲזִיר为“猪”。希伯来语介词直译为“在……中/上”；结合鼻环的图像，译作“戴在猪鼻上”清楚自然。
- source_word: אִשָּׁה יָפָה
  choice: 美貌的女人
  rationale: 上下文没有婚姻限定，אִשָּׁה取一般义“女人”；יָפָה表达外貌美丽，译作“美貌”简洁庄重。
- source_word: וְסָרַת טָעַם
  choice: 却不明事理
  rationale: סָרַת表达偏离、缺失，טַעַם在智慧文学语境中指判断力、见识或明辨，而非单指审美“品味”。“不明事理”以现代汉语传达其理智与品格判断上的欠缺；“却”显出美貌与缺乏明辨之间的反差。
theological_decisions: []
translation_notes:
  register: 采用简洁、对称的箴言体，以“正如”明确两幅图像的类比关系。正文使用现代常用的“不明事理”，脚注保留较贴近希伯来语形式的译法。
