  text: רַע יֵ֭רוֹעַ כִּי עָ֣רַב זָ֑ר וְ/שֹׂנֵ֖א תֹקְעִ֣ים בּוֹטֵֽחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/015.yaml
  text: He will surely suffer harm who becomes surety for a stranger[b][a], but whoever hates striking hands is secure.
translation:
  language: zh_hans
  text: 为外人作保的，必遭祸患；厌恶以击掌作保这种事的人，必得安稳。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “击掌”是当时订立承诺或担保时所用的动作。
    reason: cultural_note
lexical_decisions:
- source_word: רַע יֵרוֹעַ
  choice: 必遭祸患
  rationale: 将副词性/表语性的 רַע 与尼法勒式 יֵרוֹעַ 合并表达，传达必定遭受损害或厄运的强烈警告，而非道德上的“恶”。
- source_word: כִּי עָרַב
  choice: 作保的
  rationale: כִּי 在此可引出导致祸患的情形；汉语用关系分句自然呈现，无须硬译为“因为”或“如果”。עָרַב 指为他人的债务或义务承担担保责任。
- source_word: זָר
  choice: 陌生人
  rationale: 在智慧文学语境中通常指关系疏远、并非亲属或熟识之人，不必限定为异族人。
- source_word: שֹׂנֵא
  choice: 憎恶
  rationale: 保留原文强烈的厌弃语气，不弱化为仅仅“避免”。
- source_word: תֹקְעִים
  choice: 击掌作保
  rationale: 保留“击掌”的具体古代动作，同时补明其在本节中的担保含义，以免现代读者误解为一般击掌。
- source_word: בּוֹטֵחַ
  choice: 安然无忧
  rationale: 在此表示免受前述担保风险、处境安稳；采用自然且具有箴言节奏的中文表达。
theological_decisions:
- issue: 本节警戒的范围
  choice: 将警告具体落实为替陌生人作保所带来的风险
  alternative: 把经文理解为绝对禁止一切担保或援助行为
  rationale: 原文针对的是为 זָר 作保和以击掌缔结担保，不宜扩展为经文未明说的普遍教义禁令。
translation_notes:
  register: 采用现代、庄重而易懂的箴言体。前后两句形成“必遭祸患／安然无忧”的鲜明对比；正文保留“击掌”的原文意象，并以“作保”说明其文化含义。
