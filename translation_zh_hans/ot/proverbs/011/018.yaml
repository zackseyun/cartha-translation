  yaml_path: translation/ot/proverbs/011/018.yaml
  text: A wicked man earns deceptive wages[b][a], but one who sows righteousness receives a true reward.
translation:
  language: zh_hans
  text: 恶人得的是虚假的报酬[a]；播种公义的，得真实的报酬[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“恶人做虚妄的工。”原文可以侧重欺骗性或不可靠的所得，也可以侧重虚假、终必落空的劳作。
    reason: lexical_alternative
  - marker: b
    text: 直译：“真实的工价”；也可译作“稳妥的报酬”或“可靠的工价”。
    reason: lexical_alternative
lexical_decisions:
- source_word: רָשָׁע
  choice: 恶人
  rationale: 该阳性单数名词在箴言中作泛指；“恶人”简洁自然，并保留其代表性用法。
- source_word: עֹשֶׂה פְעֻלַּת שָׁקֶר
  choice: 赚得虚假的工价
  rationale: 原文直译近于“做虚假的工作／作为”；结合下半句的“报酬”，此处可理解为恶人的劳作带来虚假、欺骗人的所得。“赚得虚假的工价”既呈现平行结构，也由脚注保留较直译的可能。
- source_word: שָׁקֶר
  choice: 虚假的
  rationale: 该词可指虚假、欺骗或不可靠；“虚假的”保留较宽的语义范围，既可能形容所得以欺骗而来，也可能暗示所得终究落空。
- source_word: וְזֹרֵעַ
  choice: 但播种……的
  rationale: 连接词字面可译“而／和”；本节为反义平行，因此用“但”自然表达对比。“播种”保留原文的农业隐喻。
- source_word: צְדָקָה
  choice: 公义
  rationale: 此词兼有正直、公正和合乎正道之意；“公义”保留其广泛的伦理与神学内涵，不将其缩窄为单一的社会司法概念。
- source_word: שֶׂכֶר אֱמֶת
  choice: 真实可靠的报酬
  rationale: 原文直译为“真实的工价／报酬”。“真实可靠”表达这报酬确实、稳妥，与上半句虚假而不可靠的所得形成鲜明对照。
theological_decisions:
- issue: צְדָקָה的译法
  choice: 公义
  alternative: 正义；正直的事
  rationale: 本处既关乎人的正当行为，也带有箴言一贯的道德秩序含义。“公义”能保留这种宽度，不把经文限定为司法公正或一般善行。
- issue: 报酬对比的性质
  choice: 保留“虚假”与“真实可靠”的张力
  alternative: 明确解释为“恶人所得终必落空，义人必获上帝奖赏”
  rationale: 原文以两种工价／报酬作对比，却没有明说报酬的具体来源、时间或形式；译文不额外加入施报者或末世性解释。
translation_notes:
  register: 采用现代、凝练而庄重的箴言体。“赚得……工价／得……报酬”形成清楚的反义平行；保留“播种公义”的原文意象。脚注标记[a]、[b]均已置于正文相应位置。
