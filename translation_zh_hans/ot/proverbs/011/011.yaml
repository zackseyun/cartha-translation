  text: בְּ/בִרְכַּ֣ת יְ֭שָׁרִים תָּר֣וּם קָ֑רֶת וּ/בְ/פִ֥י רְ֝שָׁעִ֗ים תֵּהָרֵֽס׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/011.yaml
  text: By the blessing of the upright a city is exalted[b][a], but by the mouth of the wicked it is torn down.
translation:
  language: zh_hans
  text: 正直人的祝福使城兴盛[a]；恶人的口[b]却使城倾覆。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“城因正直人的祝福而兴起。”
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“借着恶人的口”；这里强调恶人言语所具有的破坏力。
    reason: cultural_note
lexical_decisions:
- source_word: בְּ/בִרְכַּת
  choice: 因……的祝福
  rationale: 介词 בְּ 在此表示途径或凭借；“祝福”保留 בִרְכָּה 的简洁表达，也不限定它仅指口头祝愿或正直人带来的福泽。
- source_word: יְשָׁרִים
  choice: 正直人
  rationale: יָשָׁר 指品格正直的人；“正直人”自然、明确，并保留智慧文学中的伦理含义。
- source_word: תָּרוּם
  choice: 得以高升
  rationale: רוּם 的 Qal 未完成式在此描述城因祝福而被提升、兴盛；“高升”兼顾原文的空间意象和社会繁荣之意。
- source_word: קָרֶת
  choice: 城
  rationale: קָרֶת 指城或城镇；单用“城”简练庄重，符合箴言的对仗风格。
- source_word: וּ/בְ/פִי
  choice: 因……的口
  rationale: בְּ 表示造成结果的途径；直译“口”保留希伯来语意象，指向恶人言语的破坏力。
- source_word: רְשָׁעִים
  choice: 恶人
  rationale: רָשָׁע 在智慧文学中通常指道德败坏的人；“恶人”是简洁而稳妥的对应。
- source_word: תֵּהָרֵס
  choice: 就倾覆
  rationale: הרס 的 Niphal 形式表示被拆毁、被推翻；“倾覆”保留被毁坏或颠覆的结果，也与“高升”形成鲜明对照。
theological_decisions:
- issue: “祝福”的具体所指
  choice: 正文保留“正直人的祝福”这一开放表达
  alternative: 明确译为“正直人的祝愿”或“正直人带来的福泽”
  rationale: 原文可指正直人所说的祝福，也可泛指他们带来的有益影响；不应在正文中排除其中任何一种理解。
- issue: 恶人的“口”如何毁城
  choice: 保留“口”的比喻意象，并在脚注说明其言语的破坏力
  alternative: 直接译为“恶人的言语”
  rationale: 原文明确使用“口”，保留该意象更贴近希伯来文本，同时脚注可帮助现代读者理解其含义。
translation_notes:
  register: 采用现代、简洁而庄重的箴言体。上下句都用“因……”，保留原文平行结构；“高升／倾覆”形成凝练对照。所有脚注标记均置于相关词句之后。
