  yaml_path: translation/ot/proverbs/011/023.yaml
  text: The desire of the righteous is only good[b][a], but the hope of the wicked is wrath.
translation:
  language: zh_hans
  text: 义人的愿望只是善，恶人的盼望却是烈怒[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “盼望”也可译作“期待”。
    reason: lexical_alternative
  - marker: b
    text: “烈怒”也可译作“震怒”或“狂怒”。原文没有明说是谁的怒气；既可指恶人的盼望本身带有愤怒，也可指临到他们的烈怒。
    reason: alternative_reading
lexical_decisions:
- source_word: תַּאֲוַת
  choice: 愿望
  rationale: 该词表示愿望、渴求；“愿望”在现代汉语中自然简洁，并与下句“盼望”形成对应。
- source_word: צַדִּיקִים
  choice: 义人
  rationale: 复数形容词名词化，指行义的一类人；“义人”保留智慧文学中的道德类别。
- source_word: אַךְ
  choice: 终归
  rationale: 此处强调义人愿望的内容或结果只归于善；“终归”兼顾格言的结果意味，而不作过度展开。
- source_word: טוֹב
  choice: 善
  rationale: 对应“好、善、美善”；“善”凝练庄重，适合与“烈怒”对举。
- source_word: תִּקְוַת
  choice: 盼望
  rationale: 该词可指盼望或期待；正文采用常见且自然的“盼望”，另以脚注保留“期待”。
- source_word: רְשָׁעִים
  choice: 恶人
  rationale: 复数形容词名词化，与“义人”平行，采用中文智慧文学中自然的道德类别称谓。
- source_word: עֶבְרָה
  choice: 烈怒
  rationale: 该词表示强烈的愤怒、震怒；“烈怒”保留原文的力度，也不明确指定发怒者。
theological_decisions:
- issue: 末句“恶人的盼望——烈怒”的含义
  choice: 正文保持名词判断式：“恶人的盼望却是烈怒。”
  alternative: 可理解为恶人所期待的是怒气，也可理解为他们的盼望最终招致烈怒（包括上帝的震怒）。
  rationale: 希伯来文没有明说是谁的烈怒，也没有明示“导致”或“终于”的关系。正文不补出“上帝的”，以保留原文的简练、歧义和神学张力。
translation_notes:
  register: 采用现代、简洁而庄重的格言体。“义人／恶人”保持平行；末句不补明烈怒的主体。脚注标记按正文出现顺序排列。
