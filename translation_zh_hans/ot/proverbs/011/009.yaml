  text: בְּ/פֶ֗ה חָ֭נֵף יַשְׁחִ֣ת רֵעֵ֑/הוּ וּ֝/בְ/דַ֗עַת צַדִּיקִ֥ים יֵחָלֵֽצוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/009.yaml
  text: With his mouth the godless man destroys his neighbor[b][a], but by knowledge the righteous are delivered.
translation:
  language: zh_hans
  text: 不敬虔的人[a]用口毁掉邻舍，义人却凭知识得以获救[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“伪善的人”。这个希伯来词可指伪善、不敬虔或邪恶的人。
    reason: 词义有多个相近侧面，主文不能同时充分呈现。
  - marker: b
    text: 或译：“义人凭知识逃脱。”
    reason: 希伯来语动词既可表达获救，也可表达逃脱。
lexical_decisions:
- source_word: בְּפֶה
  choice: 用口
  rationale: 介词 בְּ 表示手段；“用口”保留原文以“口”为伤害工具的具体意象，在中文中也自然指向言语。
- source_word: חָנֵף
  choice: 不敬虔的人
  rationale: 此词可指不敬神、邪恶或伪善的人；本节将其与“义人”对举，采用“不敬虔的人”可保留较宽的道德与宗教含义，不把意思限缩为表里不一。
- source_word: יַשְׁחִת
  choice: 毁掉
  rationale: שׁחת 的使役形在此表示毁坏、使败亡；“毁掉”简洁有力，并保留恶言造成严重破坏的力度。
- source_word: רֵעֵהוּ
  choice: 邻舍
  rationale: רֵעַ 可指邻舍、同伴或朋友；“邻舍”范围较广，适合本节的社会伦理语境，也不额外假定双方关系亲密。
- source_word: וּבְדַעַת
  choice: 却凭知识
  rationale: וּ 在两行之间形成对比，בְּ 表示凭借的手段；דַּעַת 是《箴言》的重要智慧词汇，因此译作“知识”，不改释为“聪明”或“见识”。
- source_word: צַדִּיקִים
  choice: 义人
  rationale: 复数形容词在此作名词，泛指义人这一类人；中文“义人”简洁，并保留《箴言》中核心的伦理类别。
- source_word: יֵחָלֵצוּ
  choice: 得以获救
  rationale: חלץ 的尼法勒形可表示被解救或逃脱；“得以获救”保留受解救的语气，同时不明确添加施救者或特定危险。
theological_decisions:
- issue: חָנֵף 在智慧文学语境中的含义
  choice: 译作“不敬虔的人”
  alternative: “伪善的人”或“邪恶的人”
  rationale: 该词能够包含伪善之意，但这里与“义人”形成道德和属灵上的对照；主文采用较宽的“不敬虔”，避免把经文仅仅解释为对虚伪行为的批评。
- issue: 第二行的主语与得救者
  choice: 将“义人”理解为 יֵחָלֵצוּ 的主语，即义人凭知识获救
  alternative: 理解为别人因义人的知识而获救
  rationale: 希伯来语句法最自然地把 צַדִּיקִים 视为复数动词 יֵחָלֵצוּ 的主语；译文不引入“他人”作为原文未明说的得救对象。
- issue: יֵחָלֵצוּ 所表达的解救方式
  choice: 保留为较宽泛的“得以获救”
  alternative: 明确译作“逃脱”
  rationale: 原词可涵盖被解救与逃脱；主文不限定危险来自何处，也不把知识拟人化为施救者，脚注则注明另一种自然表达。
translation_notes:
  register: 采用现代、凝练而庄重的箴言体。上下两句保持鲜明对仗：“不敬虔的人”对“义人”，“用口”对“凭知识”，“毁掉”对“获救”。保留“口”的具体意象和“知识”的智慧文学术语；不用过度宗派化的措辞，也不把危险或施救者具体化。
