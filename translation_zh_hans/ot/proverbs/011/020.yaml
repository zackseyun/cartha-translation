  text: תּוֹעֲבַ֣ת יְ֭הוָה עִקְּשֵׁי לֵ֑ב וּ֝/רְצוֹנ֗/וֹ תְּמִ֣ימֵי דָֽרֶךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/020.yaml
  text: The crooked in heart are an abomination to Yahweh[b][a], but those blameless in their way are his delight.
translation:
  language: zh_hans
  text: 内心乖谬的人，是耶和华所厌恶的[a]；行事纯全的人，却是他所喜悦的[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “内心乖谬”也可译作“心里弯曲”或“内心悖谬”。“心”在这里包括人的思想、意志和道德取向。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译“道路纯全的人”，指生活道路或行事完整、正直、无可指责的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹעֲבַת
  choice: 所憎恶的
  rationale: 该名词表达强烈的厌恶和道德排斥。译作“所憎恶的”既保留力度，也使汉语判断句自然简洁。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 这是希伯来文四字神名；采用现代中文圣经读者熟悉的专名“耶和华”，不以“主”这一称号替代。
- source_word: עִקְּשֵׁי לֵב
  choice: 内心乖谬的人
  rationale: עִקֵּשׁ表示扭曲、悖谬；לֵב指人的内在思想、意志和道德中心。“内心乖谬”保留内在道德偏曲之意，同时符合现代汉语。
- source_word: וּרְצוֹנוֹ
  choice: 却是他所喜悦的
  rationale: רָצוֹן可指喜悦、悦纳或恩宠；在本节与“所憎恶的”对举，译为“所喜悦的”最能呈现平行反差，又不排除悦纳的含义。
- source_word: תְּמִימֵי דָרֶךְ
  choice: 行为纯全的人
  rationale: תָּמִים表示完整、正直、无可指责，דֶּרֶךְ在智慧文学中常指生活道路或品行。“行为纯全”传达全心正直和品行无可指责，并避免被误解为绝对无罪。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；主
  rationale: 原文直接使用以色列之神的专名。译文保留为专名而不换成称号；“耶和华”是现代中文圣经传统中最易识别且通行的形式。
- issue: “心”的希伯来人观含义
  choice: 译为“内心”
  alternative: 心；心思；内在的人
  rationale: 这里的“心”不只指情感，也涵盖思想、意志和道德取向。“内心”保留原有意象，同时帮助现代读者理解这是人的内在品格。
- issue: תְּמִימֵי 是否表示绝对无罪
  choice: 行为纯全
  alternative: 行为无可指责；道路完全
  rationale: 本词强调完整、正直和无可指责，不必理解为形而上的绝对无罪。“纯全”保留这种完整性，也保留智慧文学的道德张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语，以分号呈现希伯来诗句的鲜明对比。“乖谬”“纯全”略带经文语体，但仍为普通读者可理解；脚注补足其语义范围。
