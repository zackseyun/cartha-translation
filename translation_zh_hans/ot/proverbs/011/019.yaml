  text: כֵּן צְדָקָ֥ה לְ/חַיִּ֑ים וּ/מְרַדֵּ֖ף רָעָ֣ה לְ/מוֹתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/019.yaml
  text: So righteousness leads to life[a], but he who pursues evil, to his own death.
translation:
  language: zh_hans
  text: 诚然，公义通向生命[a]；追逐邪恶的，却走向自己的死亡。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“如此，公义是为要得生命”，或“公义确实使人得生命”。希伯来文首句没有明说动词，因此翻译时须按语意补足。
    reason: 保留原文无动词短句在强调、目的和结果关系上的多种可能。
lexical_decisions:
- source_word: כֵּן
  choice: 诚然
  rationale: 这里可作强调或承接语，表示“确实、如此”。“诚然”保留箴言式的郑重语气，也不把它限定为纯粹的因果推论。
- source_word: צְדָקָה
  choice: 公义
  rationale: 该词在智慧文学中指合乎正道的品格与行为；“公义”既涵盖正直，也保留其可能包含的公平正义含义，并与“邪恶”形成鲜明对照。
- source_word: לְחַיִּים
  choice: 通向生命
  rationale: 介词 לְ 可表示方向、结果或归宿。原文首句没有明说动词；“通向”以自然汉语补足句意，同时保留结果与方向之间的张力。
- source_word: וּמְרַדֵּף
  choice: 追逐……的，却
  rationale: 分词名词化，指持续或惯常追逐的人。“却”在汉语中清楚表达两句之间的反义对照。
- source_word: רָעָה
  choice: 邪恶
  rationale: 在与“公义”对举的语境中，此词主要是伦理意义上的恶，而不是灾祸或一般伤害。
- source_word: לְמוֹתוֹ
  choice: 走向自己的死亡
  rationale: לְ 表示方向或结局，第三人称单数后缀明确死亡归于追恶者本人；“自己的”自然呈现这一指向，但不额外解释死亡的性质。
theological_decisions:
- issue: 智慧文学中 צְדָקָה 的含义
  choice: 译为涵盖道德正直的“公义”，并表明其通向生命
  alternative: 译为侧重社会公平的“正义”，或将本句解释为特定的称义教义
  rationale: 上下句的反义平行把合乎正道的生命取向与追逐邪恶相对照。“公义”保留较宽的伦理范围，不把经文缩窄为社会层面，也不导入经文本身未明说的教义体系。
- issue: 首句无动词结构所表达的关系
  choice: 正文采用“通向生命”，脚注保留“为要得生命”等可能
  alternative: “公义就是生命”或“公义必然产生生命”
  rationale: 原文只把“公义”与“生命”借介词 לְ 联系起来，没有明说系词或因果动词；“通向”适合上下句的方向性意象，同时避免把关系说得过满。
translation_notes:
  register: 采用现代、庄重而易懂的箴言体。“诚然”略带郑重色彩；“通向／走向”形成对称，呈现两种道路及其结局。正文脚注标记与脚注完全对应。
