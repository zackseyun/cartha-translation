  text: הֵ֣ן צַ֭דִּיק בָּ/אָ֣רֶץ יְשֻׁלָּ֑ם אַ֝֗ף כִּֽי רָשָׁ֥ע וְ/חוֹטֵֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/031.yaml
  text: Look[a], if the righteous is repaid on earth, how much more the wicked and the sinner.
translation:
  language: zh_hans
  text: 看哪[a]，义人在世上尚且得到报偿，何况恶人和罪人呢！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“诚然，义人在地上得到报偿。”希伯来文也可较直译为：“看哪，义人必在地上／世上得到报偿。”
    reason: 词义及句式存在可成立的不同译法；הֵן 可表示提示或强调，אֶרֶץ 也可译为“地上”或“世上”。
lexical_decisions:
- source_word: הֵן
  choice: 看哪
  rationale: 该词可用来唤起注意，也可加强断言的语气。“看哪”保留其鲜明的提示作用；“诚然”也是可能的译法。
- source_word: צַדִּיק
  choice: 义人
  rationale: 阳性单数形容词在此作名词，代表具有公义品格的人；“义人”是智慧文学中自然、凝练的对应语。
- source_word: בָּאָרֶץ
  choice: 在世上
  rationale: אֶרֶץ 可指“地、土地、国土”或“世界”。本节表达普遍性的道德原则，“在世上”较为自然，同时在脚注中保留“在地上”的可能译法。
- source_word: יְשֻׁלָּם
  choice: 得到报偿
  rationale: 这是 שלם 的 Pual 形式，表示受到相应的偿还或报偿。“得到报偿”不把含义限定为正面的奖赏或负面的惩罚，从而保留原文的张力。
- source_word: אַף כִּי
  choice: 尚且……何况
  rationale: 该组合构成由轻到重的推论。汉语“尚且……何况……”清楚而自然地表达这种递进关系。
- source_word: רָשָׁע
  choice: 恶人
  rationale: 这是智慧文学中对该名词化形容词的常用译法，指品行邪恶的人。
- source_word: וְחוֹטֵא
  choice: 和罪人
  rationale: חוֹטֵא 是作名词用的分词，指以犯罪为特征的人；“罪人”与“恶人”并列自然，也保留原文的两个称谓。
theological_decisions:
- issue: 义人所得报偿的性质
  choice: 译作“得到报偿”，不具体说明是奖赏、管教性的苦难，还是两者都包括。
  alternative: 译作“得到奖赏”或“受到惩罚／报应”。
  rationale: 希伯来语动词表达广义的偿还或报偿。若只译成正面的奖赏或负面的惩罚，都会消除原文保留的含义空间。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“尚且……何况……”保留原文由轻到重的箴言式推论；“报偿”刻意保持中性，避免预先判定义人的遭遇究竟是奖赏还是惩治。
