base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/025.yaml
  text: A generous person will be enriched[b][a], and whoever refreshes others will himself be refreshed.
translation:
  language: zh_hans
  text: 慷慨待人的，必得丰足[a]；滋润别人的，自己也必得滋润[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译可作：“赐福的生命必变得肥美。”希伯来文用肥美来比喻丰盛、兴旺。
    reason: lexical_alternative
  - marker: b
    text: 也可较直译为：“使人喝足的，自己也必得浇灌。”希伯来文保留了水与浇灌的意象。
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: 人
  rationale: נֶפֶשׁ在这里指完整的人，而非与身体相对的“灵魂”；汉语用“……的人”自然、准确。
- source_word: בְּרָכָה
  choice: 慷慨待人
  rationale: 该词本义为“福分、祝福”，在“נֶפֶשׁ בְּרָכָה”这一表达中刻画一个给别人带来福分的人；译作“慷慨待人”传达其伦理含义，同时不把它误解为仅仅“蒙福”。
- source_word: תְדֻשָּׁן
  choice: 必得丰足
  rationale: דשׁן的Pual形式带有肥美、富足、兴旺的意象。“丰足”保留丰盛兴旺之意，又避免现代汉语中“变胖”的误导性联想。
- source_word: וּמַרְוֶה
  choice: 滋润别人的
  rationale: רוה的使役分词本指使人喝足或浇灌。这里以水的意象描写使别人得供应、得振奋；“滋润别人”既自然又保留比喻。
- source_word: גַּם הוּא
  choice: 自己也
  rationale: 该短语强调相应的回报：使别人得滋润的人，他本人也同样得滋润。
- source_word: יוֹרֶא
  choice: 必得滋润
  rationale: 按本节平行结构和传统理解，此处表达“被浇灌、得滋润”的意思，与前半句形成互惠对应；中文沿用同一意象。
theological_decisions:
- issue: 本节是否保证慷慨者必然获得物质财富
  choice: 译作“丰足”，不限定为金钱或物质财富
  alternative: 必发财／必富有
  rationale: 原文采用肥美、丰盛的意象，但没有把所得限定为金钱。保留较宽泛的“丰足”，避免把智慧格言收窄为物质致富的绝对应许。
translation_notes:
  register: 采用现代、凝练而庄重的智慧文学语体。“慷慨待人”点明行为特征，“丰足”和“滋润”保留原文的丰盛与水源意象；两个“必”再现希伯来诗句的对应关系。所有脚注标记均置于相关词句之后。
