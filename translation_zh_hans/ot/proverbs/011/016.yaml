  text: אֵֽשֶׁת חֵ֭ן תִּתְמֹ֣ךְ כָּב֑וֹד וְ֝/עָרִיצִ֗ים יִתְמְכוּ עֹֽשֶׁר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/016.yaml
  text: A gracious woman obtains honor[a], and ruthless men obtain wealth.
translation:
  language: zh_hans
  text: 恩慈的女子获得尊荣[a]；强暴的人获得财富。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“有恩慈的女子持守尊荣……强暴的人持守财富。”两句中的希伯来语动词相同，基本意思是“抓住、扶持、持守”，在这里也可理解为获得或保有。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵשֶׁת חֵן
  choice: 恩慈的女子
  rationale: 该结构直译为“有恩惠／恩慈的女子”。这里的 חֵן 不仅指外在魅力，也可表达使人蒙悦纳的恩慈品格；“恩慈的女子”自然且保留其道德意味。
- source_word: תִּתְמֹךְ
  choice: 赢得
  rationale: תמך 的基本义是“抓住、扶持、持守”。在本节平行结构中，它表示取得或把握所得之物；“赢得尊荣”符合现代汉语习惯，同时保留主动取得的意味。
- source_word: כָּבוֹד
  choice: 尊荣
  rationale: 在智慧文学语境中，此词多指社会上的尊重、声望或荣誉，而非可见的荣耀；“尊荣”与下句的“财富”形成恰当对照。
- source_word: עָרִיצִים
  choice: 强暴的人
  rationale: 该词指凶暴、残酷、仗势压迫的人。“强暴的人”保留暴力和压迫色彩，又不把含义限定为政治上的暴君。
- source_word: יִתְמְכוּ
  choice: 攫取
  rationale: 与上句 תִּתְמֹךְ 为同一词根，基本义仍是“抓住、持守”。结合主语“强暴的人”，“攫取”自然呈现他们凭强力取得财富的方式；脚注同时保留两处动词可译为“持守”的词汇对应。
- source_word: עֹשֶׁר
  choice: 财富
  rationale: 此词通常表示物质上的富足或财产；“财富”是清楚、现代的标准表达。
theological_decisions:
- issue: 两分句的关系及其评价色彩
  choice: 保留并列对照，不补入因果关系，也不明说财富是神的奖赏或对强暴者的认可。
  alternative: 把本节解释为善有善报、恶人也必失去财富的完整报应陈述。
  rationale: 希伯来文本只并列陈述恩慈女子与强暴者各自取得之物，没有明示因果，也没有在本节内说明最终结局。译文应保留这种智慧格言的张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“女子”比“女人”略具格言体色彩，却仍易懂；“赢得尊荣”与“攫取财富”形成鲜明对照。脚注说明原文两处动词相同，避免正文因语境化表达而掩盖希伯来语的词汇平行。
