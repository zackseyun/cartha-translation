  - severity: medium
    issue: “遮掩事情”在现代汉语中易理解为掩盖问题或过错。
    rationale: מְכַסֶּה דָבָר 在此与泄露秘密相对，称许的是不将事情外传。改为“把事情保密”可传达守密功能，避免不必要的负面含义。
  - severity: low
