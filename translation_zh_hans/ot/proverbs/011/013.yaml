revisions:
- from: 搬弄是非的，泄露秘密；心里忠信的，遮掩事情。[a]
  to: 传闲话的人泄露秘密；心里忠信的人把事情保密。[a]
  rationale: 修订以“传闲话的人”对应惯于往来传播言谈的 רָכִיל，避免将其限定为挑拨者；以“把事情保密”表达“遮盖一件事”在本节平行结构中的守密含义，同时避免“遮掩”在现代汉语中常有掩盖不当之事的负面联想。保留“心里忠信”作为自然的中文表达，并以脚注保留原文“灵”的措辞。
  reviewer_model: gpt-5.6-terra
