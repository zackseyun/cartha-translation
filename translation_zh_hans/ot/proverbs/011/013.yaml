review_pass:
  verdict: revise
  source_fidelity: 首句“搬弄是非的”可表达传播有害言谈，但现代汉语常带挑拨、制造纠纷乃至无端生事的意味，较原文“传闲话／搬传话语者”略窄。末句“遮掩事情”虽贴近字面“遮盖一件事”，但汉语中往往暗示掩盖不当行为，容易偏离本节称许谨慎守密的语境。
  naturalness: 原文整体简洁、对称。“心里忠信的，遮掩事情”省略中心词且“遮掩事情”搭配略生硬；补足“人”并以“把事情保密”表达，可保持箴言体并更符合现代标准汉语。
  terminology: “秘密”“忠信”均可保留。“心里忠信”是对“忠信的灵／忠信于灵”的自然转述；脚注应说明其对应原文“忠信的灵”，而不是把“灵里忠信的”误作唯一严格直译。
  issues:
