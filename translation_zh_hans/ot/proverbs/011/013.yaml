  text: A gossip reveals a secret[b][a], but one who is faithful in spirit conceals a matter.
translation:
  language: zh_hans
  text: 传闲话的人泄露秘密；心里忠信的人把事情保密。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译：“忠信的灵”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹלֵךְ רָכִיל
  choice: 搬弄是非的
  rationale: 这一习语直译近于“行走作传话者的人”，指惯于四处传播有害或私密言谈的人。“搬弄是非的”在现代汉语中自然，并保留其习惯性行为的含义；原文不必限定为捏造虚假指控。
- source_word: מְגַלֶּה
  choice: 泄露
  rationale: 该分词表示揭开、使人知道；与“秘密”搭配时，“泄露”准确表达将本应保密的信息透露出去。
- source_word: סּוֹד
  choice: 秘密
  rationale: סוֹד 可指密议、亲密商议或秘密；本节与“遮掩事情”形成对照，语境侧重不应公开的私密信息。
- source_word: נֶאֱמַן רוּחַ
  choice: 心里忠信的
  rationale: 原文近于“灵里忠信的”。“心里忠信的”保留内在品格的表达，同时比逐字译作“灵里忠信”更符合现代汉语习惯；其含义包括可靠、守信和谨慎。
- source_word: מְכַסֶּה
  choice: 遮掩
  rationale: 原义为“遮盖”，在这里指不把所知之事泄露出去。“遮掩”既保留遮盖意象，也适合信息保密的语境。
- source_word: דָבָר
  choice: 事情
  rationale: דָבָר 含义宽泛，可指话、事或事项；此处泛指所知而应保密的事，“事情”自然且不过度限定。
