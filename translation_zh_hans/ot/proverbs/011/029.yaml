base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/029.yaml
  text: Whoever troubles his own house will inherit wind[b][a], and the fool will be a servant to the wise of heart.
translation:
  language: zh_hans
  text: 使自家[a]受害的人，必承受风[b]；愚昧人必作心中有智慧之人的仆人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “家”也可指家人、家庭或家业，不只是居住的房屋。
    reason: lexical_alternative
  - marker: b
    text: 原文作“风”，在这里比喻空无、虚幻或徒劳；也可意译为“必一无所得”。
    reason: lexical_alternative
lexical_decisions:
- source_word: עוֹכֵר
  choice: 祸害
  rationale: 该分词指给人或群体招致祸患、使其受害的人。“祸害自家”在现代汉语中自然有力，保留主动造成损害之意，又不把程度限定为彻底毁灭。
- source_word: בֵּיתוֹ
  choice: 自家
  rationale: בַּיִת既可指房屋，也可延伸指家庭、家人或家业。“自家”保留“家”的具体意象，同时能自然涵盖家庭与家业。
- source_word: יִנְחַל
  choice: 必承受
  rationale: 此动词通常表示承受产业、继承或取得。“承受”既能体现所得如产业的反讽，也比现代汉语中的“继承风”稍自然。
- source_word: רוּחַ
  choice: 清风
  rationale: 原词直译为“风”，此处喻指空无、虚幻或徒劳。“清风”使汉语读者较自然地理解所得无实质，但正文仍保留希伯来语的风之意象；脚注说明其比喻义。
- source_word: וְעֶבֶד
  choice: 必作……的仆人
  rationale: 原文是无显式系词的名词句，表达愚昧人的结局或身份。“必作……的仆人”补足现代汉语谓语，保留服属关系，不强化为制度性的奴隶身份。
- source_word: אֱוִיל
  choice: 愚昧人
  rationale: 这是智慧文学中常见的类型称谓，兼有道德和实践上的无知。“愚昧人”符合箴言传统语体，也比单说“笨人”更庄重准确。
- source_word: לַחֲכַם־לֵב
  choice: 心中有智慧之人
  rationale: 该短语直指“心里有智慧的人”；希伯来语的“心”涵盖思想、判断和意志。“心中有智慧之人”保留这一人观表达，同时符合现代汉语。
