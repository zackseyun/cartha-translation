  text: בָּז לְ/רֵעֵ֥/הוּ חֲסַר לֵ֑ב וְ/אִ֖ישׁ תְּבוּנ֣וֹת יַחֲרִֽישׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/012.yaml
  text: Whoever despises his neighbor lacks sense[c][b][a], but a man of understanding keeps silent.
translation:
  language: zh_hans
  text: 藐视邻舍的，是无知的人[a]；有悟性的人却保持沉默[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “无知的人”原文直译为“缺少心的人”；这里的“心”指判断和理解的能力。
    reason: lexical_alternative
  - marker: b
    text: 原文为阳性单数“有悟性的男子”，在箴言中作代表性泛指。
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּז
  choice: 藐视
  rationale: 该词表示轻看、鄙视某人；“藐视”简洁庄重，也清楚表达对人的轻蔑态度。
- source_word: לְרֵעֵהוּ
  choice: 邻舍
  rationale: רֵעַ 可指朋友、同伴或邻舍；在本节的社会伦理语境中，“邻舍”保留了较宽泛的人际范围。
- source_word: חֲסַר לֵב
  choice: 无知的人
  rationale: 原文直译为“缺少心”；希伯来语中的“心”在此指判断、理解的内在能力。“无知的人”自然传达此习语，而非误解为缺少情感。
- source_word: וְאִישׁ תְּבוּנוֹת
  choice: 有悟性的人
  rationale: תְּבוּנוֹת 形式上为复数，却表达辨识、领悟的品质；“有悟性的人”在现代汉语中自然，并保留智慧文学的语感。אִישׁ 的阳性单数在箴言中具有代表性，汉语“人”可自然涵盖此泛指用法。
- source_word: יַחֲרִישׁ
  choice: 保持沉默
  rationale: 该动词在此意为不出声、静默；“保持沉默”体现有意克制，与前半句的藐视形成对照，同时不额外限定沉默的具体对象或场合。
theological_decisions:
- issue: וְאִישׁ 的阳性单数代表性表达
  choice: 有悟性的人
  alternative: 有悟性的男子
  rationale: 原文使用阳性单数 אִישׁ，但箴言式陈述具有普遍、代表性的作用。现代汉语的“人”既准确表达这种泛指，也避免把教训误限于男性；脚注说明原文形式。
- issue: יַחֲרִישׁ 所指的沉默范围
  choice: 保持沉默
  alternative: 不说藐视的话
  rationale: 原文只说“保持沉默”，未明确补出沉默的对象或内容；正文保留这种开放性，不把它收窄为某一种言语行为。
translation_notes:
  register: 采用现代、庄重而易懂的箴言体。前后两句保持紧凑对称；“藐视／保持沉默”呈现行为对照，“无知／有悟性”呈现品格判断。正文避免生硬直译“缺少心”，并以脚注保存原文意象；不擅自说明智者为何或在何种情况下沉默。
