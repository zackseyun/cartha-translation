  text: בָּֽא זָ֭דוֹן וַ/יָּבֹ֣א קָל֑וֹן וְֽ/אֶת צְנוּעִ֥ים חָכְמָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/002.yaml
  text: When arrogance comes[a], disgrace comes also, but with the humble is wisdom.
translation:
  language: zh_hans
  text: 骄傲一来，羞辱也随之而来；谦逊的人却有智慧。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּא
  choice: 一来
  rationale: 此处是箴言式的普遍陈述；用“一来”既自然，又保留“来到、出现”的动态意象。
- source_word: זָדוֹן
  choice: 骄傲
  rationale: 该词指自大、狂妄、僭越式的骄傲；“骄傲”在此语境中明确表达负面的道德含义，也与下半句的“谦逊”形成自然对照。
- source_word: וַיָּבֹא
  choice: 也随之而来
  rationale: 保留前后两个“来”的呼应，并清楚表达羞辱伴随骄傲而至的箴言关系；不把这种并列关系强化为严格的因果公式。
- source_word: קָלוֹן
  choice: 羞辱
  rationale: 该词兼有蒙羞与受辱、失去尊荣之意；“羞辱”能体现其公开的耻辱色彩。
- source_word: וְאֶת
  choice: 却有
  rationale: 原文表达智慧与谦逊者同在的关联；汉语用“谦逊的人却有智慧”自然呈现这一关系，并显明上下句的对照。
- source_word: צְנוּעִים
  choice: 谦逊的人
  rationale: 该复数形容词作名词使用，指谦和、不自高的人；“谦逊的人”准确、自然，并与“骄傲”构成伦理对照。
- source_word: חָכְמָה
  choice: 智慧
  rationale: 这是《箴言》中表示智慧的常用核心词；直译为“智慧”可保持其广泛的伦理和实践内涵。
theological_decisions: []
translation_notes:
  register: 采用简洁、对称的现代汉语箴言体。前半句保留“来……随之而来”的意象，后半句用自然汉语表达原文省略系词的“智慧与谦逊者同在”。措辞庄重但通俗，不额外引入神学解释。
