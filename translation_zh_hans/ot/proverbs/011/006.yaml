  text: צִדְקַ֣ת יְ֭שָׁרִים תַּצִּילֵ֑/ם וּ֝/בְ/הַוַּ֗ת בֹּגְדִ֥ים יִלָּכֵֽדוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/006.yaml
  text: The righteousness of the upright rescues them[a], but the treacherous are caught by their own desire.
translation:
  language: zh_hans
  text: 正直人的义救他们脱险，奸诈的人却被自己的欲望困住。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “自己的欲望”也可译作“他们的灾祸”或“他们的毁灭”。希伯来语这个名词既可指带来毁灭的欲望，也可指灾祸、毁灭；正文按使奸诈之人落入网罗的内在欲望来理解。
    reason: lexical_alternative
lexical_decisions:
- source_word: צִדְקַת
  choice: 义
  rationale: 构造形צְדָקָה在此指合乎正道的品格与行为；“义”保留《箴言》的伦理范畴，也与同词根术语的通常译法一致。
- source_word: יְשָׁרִים
  choice: 正直人
  rationale: 指在道德上正直、行事端正的人；“正直人”是自然清楚的现代汉语表达。
- source_word: תַּצִּילֵם
  choice: 救他们脱险
  rationale: נצל的使役形表示搭救、解救；“救……脱险”明确表达从危险中获救，且避免在这句实践伦理格言中附加过强的专门神学色彩。
- source_word: וּבְהַוַּת
  choice: 被自己的欲望
  rationale: הַוָּה可指欲望、贪欲，也可指灾祸、毁灭；正文按工具性ב理解为使人落入网罗的内在欲望，并以“自己的”显明反身性的因果关系。另一词义保留于脚注。
- source_word: בֹּגְדִים
  choice: 奸诈的人
  rationale: בגד指行事诡诈、背信的人；“奸诈的人”保留一般性的道德类别，不将其限定为宗教背信或政治叛国。
- source_word: יִלָּכֵדוּ
  choice: 缠住
  rationale: לכד的被动形表示被捉住、陷住；与“欲望”搭配时，“被……缠住”是自然汉语，并保留反面人物因自身欲望而受困的意象。
theological_decisions:
- issue: הַוָּה的语义歧义
  choice: 正文译作“欲望”
  alternative: “灾祸”或“毁灭”
  rationale: 该名词既可能表示破坏性的欲求，也可能表示灾难或毁灭。上下文中的被动动词“被捉住”可支持内在欲望成为网罗的理解，但原文并不能完全排除遭灾或陷于毁灭之意，因此不把另一解释静默消除。
translation_notes:
  register: 采用现代、庄重而易懂的格言体。前后两句保持鲜明对照；“正直人的义”保留原文中品格与人的构造关系，“奸诈的人”则作为与“正直人”相对的伦理类型。脚注标记置于相关分句末，避免误以为只修饰单个词。
