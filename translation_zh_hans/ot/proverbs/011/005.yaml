  text: צִדְקַ֣ת תָּ֭מִים תְּיַשֵּׁ֣ר דַּרְכּ֑/וֹ וּ֝/בְ/רִשְׁעָת֗/וֹ יִפֹּ֥ל רָשָֽׁע׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/005.yaml
  text: The righteousness of the blameless makes his way straight[b][a], but the wicked falls by his wickedness.
translation:
  language: zh_hans
  text: 正直人的义使他的道路笔直[a]；恶人却因自己的邪恶而跌倒[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“引导他的路径”或“使他的道路平坦”。希伯来文动词带有使道路笔直、平正的形象。
    reason: lexical_alternative
  - marker: b
    text: “因自己的邪恶”或译：“在自己的邪恶中”。希伯来文可指邪恶是他跌倒的原因或手段，也可指他是在邪恶之中跌倒。
    reason: lexical_alternative
lexical_decisions:
- source_word: צִדְקַת
  choice: 义
  rationale: 此处指合乎正道的品格与行为；“义”既直接，也符合《箴言》的伦理语境。
- source_word: תָּמִים
  choice: 完全人
  rationale: 在智慧文学中指品格完整、行为无可指摘的人，并非宣称绝对无罪；“完全人”保留了原词“完整、纯全”的意味。
- source_word: תְּיַשֵּׁר
  choice: 使……笔直
  rationale: 该词为 ישר 的加强词干，意为使之直或平正；此译保留修整道路使其笔直的形象。
- source_word: דַּרְכּוֹ
  choice: 他的道路
  rationale: 保留希伯来文单数阳性表达，也保留智慧文学中“道路”象征人生行程和行为方式的惯用意象。
- source_word: וּבְרִשְׁעָתוֹ
  choice: 因自己的邪恶
  rationale: 介词 ב 在此可表手段或所处境况；正文采用因果或工具意义，表达恶人被自身的恶所倾覆。
- source_word: יִפֹּל
  choice: 跌倒
  rationale: 未完成式在箴言中表达普遍规律；现代汉语无需另加将来标记。“跌倒”延续道路意象，并可指败亡。
- source_word: רָשָׁע
  choice: 恶人
  rationale: 原文单数形容词名词化，指邪恶者这一类人；“恶人”简洁而符合汉语箴言体。
theological_decisions:
- issue: תָּמִים 是否暗示绝对无罪
  choice: 译作“完全人”，并按品格完整理解
  alternative: 正直人；无可指摘的人
  rationale: 原词在此描述道德上的纯全与完整，不应将其解释为绝对无罪；同时正文尽量保留其“完整”的词义张力。
- issue: בְרִשְׁעָתוֹ 的工具义与处境义
  choice: 正文采用“因自己的邪恶”
  alternative: 在自己的邪恶中
  rationale: 两种理解在语法上都可成立。正文凸显恶成为其跌倒的原因或手段，脚注保留“在……中”的处境义，避免消除原文歧义。
- issue: 单数阳性形式的表达
  choice: 保留“他的道路”
  alternative: 其道路；他们的道路
  rationale: 希伯来文以单数阳性作箴言式代表表达；现代汉语中“完全人……他的”自然可懂，不必改为复数而削弱原文形式。
translation_notes:
  register: 采用庄重而自然的现代标准汉语，保留《箴言》中“义—邪恶”“道路—跌倒”的对称意象。正文两处分句简洁，适合格言体；脚注完整呈现关键介词与动词的语义可能性。
