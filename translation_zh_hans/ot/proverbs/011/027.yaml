source:
  edition: WLC
  text: שֹׁ֣חֵֽר ט֭וֹב יְבַקֵּ֣שׁ רָצ֑וֹן וְ/דֹרֵ֖שׁ רָעָ֣ה תְבוֹאֶֽ/נּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/027.yaml
  text: Whoever diligently seeks good seeks favor[c][b][a], but evil comes to the one who searches for it.
translation:
  language: zh_hans
  text: 殷勤寻求善的，是寻求恩惠[a]；追求恶的，恶必临到他[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “恩惠”也可译作“悦纳”或“好意”；原文没有说明这是来自上帝、来自人，还是兼指二者。
    reason: lexical_alternative
  - marker: b
    text: 或译：“祸患必临到他。”原文的“恶”既可指邪恶，也可指祸患。
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁחֵר
  choice: 殷勤寻求
  rationale: 该分词含热切、认真或及早寻求之意；“殷勤寻求”在现代汉语中自然，也保留了超出一般“寻找”的强度。
- source_word: טוֹב
  choice: 善
  rationale: 此处形容词作名词使用，泛指善或美善之事；“善”简洁，并保留道德与实际层面的广度。
- source_word: יְבַקֵּשׁ
  choice: 寻求
  rationale: 采用常见而庄重的对应词，并与上半句第一个寻求动词形成可感知的呼应。
- source_word: רָצוֹן
  choice: 恩惠
  rationale: 可指悦纳、好意或恩宠，来源可能是上帝、他人或二者；“恩惠”保留其宽泛性，不擅自限定来源。
- source_word: וְדֹרֵשׁ
  choice: 追求
  rationale: דָּרַשׁ 在此表示寻求、追逐；用“追求”体现主动性，并借分号与上下句反义平行表达希伯来语连接词在此的转折效果。
- source_word: רָעָה
  choice: 恶
  rationale: 该词既可指道德上的恶，也可指祸患；译作“恶”能保留双重意味，使所追求的恶也成为临到追求者的恶果。
- source_word: תְבוֹאֶנּוּ
  choice: 恶必临到他
  rationale: 动词表示来到或临到，带第三人称阳性单数宾语后缀；补出前文“恶”为主语，并用“必”传达箴言所表达的确定后果。
theological_decisions:
- issue: רָצוֹן（恩惠）的来源范围
  choice: 译作宽泛的“恩惠”，不注明来自上帝还是人。
  alternative: 上帝的恩宠；人的好意；悦纳
  rationale: 希伯来文没有明说恩惠的来源；保持开放可避免把经文缩窄为单一的神学或人际解释。
- issue: רָעָה 的道德与结果含义
  choice: 两处均译作“恶”，保留同一个词兼具恶行与祸害的张力。
  alternative: “追求邪恶的，祸患必临到他”
  rationale: 原文以同一名词作为追求对象和后句主语；统一译法更清楚地保存其反讽和词语回响，不强行区分道德之恶与所遭之祸。
translation_notes:
  register: 采用简洁、对称而庄重的现代标准汉语，保留箴言式的因果力度。“殷勤寻求”表达 שֹׁחֵר 的热切含义；主文本不采用“清早寻求”，以免现代读者误解为单指时间。所有脚注标记均置于相关主文本之后。
