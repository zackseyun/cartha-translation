base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/028.yaml
  text: Whoever trusts in his wealth will fall[a], but the righteous will flourish like leaves.
translation:
  language: zh_hans
  text: 倚靠自己的财富的人，必跌倒；义人却要像叶子一样繁茂。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “叶子”原文为单数，也可译作“一片叶子”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בּוֹטֵחַ
  choice: 倚仗
  rationale: 该分词表示把信心或安全感寄托于某物；“倚仗”自然地传达依靠财富求保障的含义，也保留箴言中的警戒意味。
- source_word: בְּעָשְׁרוֹ
  choice: 自己的财富
  rationale: עֹשֶׁר指财富、财物；所有格后缀为第三人称阳性单数，在汉语的泛指结构中自然译作“自己的”。
- source_word: הוּא
  choice: （不单独译出）
  rationale: 独立代词在希伯来语中加强主语语气；汉语用“……的，必……”的句式已能体现这一强调，无须另加“他”。
- source_word: יִפֹּל
  choice: 必跌倒
  rationale: 未完成式在箴言中表达通常而确定的后果；“必跌倒”既保留原有意象，也不擅自限定为经济破产、死亡或其他特定灾祸。
- source_word: וְכֶעָלֶה
  choice: 却要像树叶一样
  rationale: עָלֶה在形式上是单数“叶子”，此处用作比喻，描绘植物茂盛生长的景象。“树叶”在现代汉语中可自然作类称，并与后面的“茂盛”搭配；原文单数信息收入脚注。
- source_word: צַדִּיקִים
  choice: 义人
  rationale: 阳性复数形容词在此作名词，泛指行义的人。“义人”简洁、庄重，也是现代汉语中易懂的圣经用语；汉语名词本身无需显明复数。
- source_word: יִפְרָחוּ
  choice: 要……茂盛
  rationale: פרח可指发芽、开花或繁茂，引申为兴旺。“茂盛”保留植物意象，并与前半句的“跌倒”形成鲜明对照。
theological_decisions:
- issue: 开头阳性单数分词的性别与泛指功能
  choice: 倚仗自己财富的
  alternative: 倚仗他财富的人
  rationale: 希伯来语采用阳性单数，但箴言格言通常具有泛指功能。汉语“……的”自然涵盖任何这样的人，同时“自己”准确表达第三人称单数所有关系，不额外引入性别限定。
- issue: עָלֶה比喻中的单数形式
  choice: 像树叶一样茂盛
  alternative: 像一片叶子一样茂盛
  rationale: 原文名词虽为单数，但意象重点在于叶子的鲜活茂盛，而不在数量。“树叶”作为类称更符合现代汉语习惯；用脚注保留其形式上的单数，以免消除原文细节。
- issue: “跌倒”所指的后果
  choice: 保持“跌倒”的开放意象
  alternative: 译为“败亡”或“破产”
  rationale: 经文本身没有明确限定跌倒的具体性质。直译为“跌倒”保留可能涉及衰败、失败或倾覆的张力，避免加入特定神学或物质层面的解释。
translation_notes:
  register: 采用简洁、对称的箴言体。“倚仗……的，必……”庄重而符合现代普通话；“却”清楚标示两类人的对比。避免使用较陈旧的“发旺”，以“茂盛”延续原文的植物意象。
