base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/014.yaml
  text: Without guidance a people falls[a], but in an abundance of counselors there is deliverance.
translation:
  language: zh_hans
  text: 没有指引，民就会跌倒；谋士众多，就有拯救。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “指引”也可译作“谋略”。“拯救”也可译作“安全”或“胜利”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּ/אֵין
  choice: 没有
  rationale: בְּ与אֵין构成“在缺少……时、没有……”的情状表达；“没有”简洁自然，也保留一般性条件意味。
- source_word: תַּחְבֻּלוֹת
  choice: 谋略
  rationale: 该词可指引导、筹划或策略，原有掌舵、导向的意象；“谋略”在国家或群体兴衰的语境中自然，并与后半句具体的“谋士”相区分。
- source_word: יִפָּל
  choice: 败落
  rationale: נפל字面义为“倒下”；“败落”既保留衰败、倾覆的动态意象，又符合现代汉语描述群体结局的习惯。
- source_word: עָם
  choice: 人民
  rationale: עָם可指人民或民族；此处表达普遍原则，“人民”不把含义限定为现代民族国家。
- source_word: וּ/תְשׁוּעָה
  choice: 就有拯救
  rationale: תְּשׁוּעָה可表示拯救、安全或胜利；“拯救”保留较宽的脱险、保全含义，不将语境收窄为军事胜利。
- source_word: בְּ/רֹב
  choice: 众多
  rationale: 表达数量充足或众多；置于“谋士”之后构成自然、凝练的现代汉语。
- source_word: יוֹעֵץ
  choice: 谋士
  rationale: 虽为单数形式，但רֹב יוֹעֵץ是集合性表达，所指为众多出谋献策的人；“谋士”与前半句“谋略”形成清楚呼应。
theological_decisions:
- issue: תְּשׁוּעָה的语义范围
  choice: 拯救
  alternative: 安全／胜利
  rationale: 原词涵盖获救、保全和得胜。正文采用范围较宽的“拯救”，脚注保留“安全、胜利”的可能，避免将箴言只作军事或属灵化解释。
translation_notes:
  register: 采用简洁、对称的箴言体，语言庄重而符合现代普通话。“没有……就会……；……众多，就有……”清楚呈现两分句的对照。
