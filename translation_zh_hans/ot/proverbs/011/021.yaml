    issue: “手连着手”过度引导习语含义
    rationale: 原文“יד ליד”字面为“手对手／手与手”，意义有争议，常被理解为确定性的强调语。“手连着手”在中文自然指手拉手、联手，给正文加入了原文未确定的动作关系。
  - severity: low
    issue: “也”无原文依据
    rationale: “恶人也难免受罚”中的“也”不是原文连词或语气所要求，且会使断言显得较弱。
  - severity: low
    issue: 脚注列出“代代相传”会误导
    rationale: 该释义并非此处应作为主要可行解释呈现；应说明字面形式、意义未定及较可能的强调性功能即可。
  revised_text: 手对手[a]，恶人必不免受罚；义人的后代必得逃脱。
