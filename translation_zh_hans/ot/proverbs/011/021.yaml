  text: יָ֣ד לְ֭/יָד לֹא יִנָּ֣קֶה רָּ֑ע וְ/זֶ֖רַע צַדִּיקִ֣ים נִמְלָֽט־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/021.yaml
  text: Hand to hand[a], the evil will not go unpunished, but the offspring of the righteous will escape.
translation:
  language: zh_hans
  text: 手对手[a]，恶人必不免受罚；义人的后代必得逃脱。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“手对手”。这是一个意义未完全确定的习语；在这里很可能是用来强调“确实如此”或“必定如此”。
    reason: 说明难解习语的字面形式及较可能的强调性功能，同时保留其真实歧义。
lexical_decisions:
- source_word: יָד לְיָד
  choice: 手连着手
  rationale: 保留希伯来语“手对手”的具体意象和其略显含混的习语性质；中文“手连着手”自然可读，也可能让人联想到彼此联合，而脚注说明其更可能是强调确定无疑。
- source_word: יִנָּקֶה
  choice: 难免受罚
  rationale: נקה 的尼法勒形在这里意为免受惩罚或不受追究；原文以否定式表达“不会免罚”，译作“难免受罚”符合现代汉语并保留道德后果的意味。
- source_word: רָע
  choice: 恶人
  rationale: 阳性单数形容词在此作名词使用，指一个代表性的恶者；“恶人”简洁自然，不把它误作抽象的“邪恶”。
- source_word: וְזֶרַע
  choice: 后代却
  rationale: זֶרַע 在此指子孙后代，而非字面的种子；וְ 在上下句鲜明对照中译作“却”。
- source_word: צַדִּיקִים
  choice: 义人的
  rationale: 复数实体化形容词指义人这一群体；中文属格“义人的”自然保留其集合意义。
- source_word: נִמְלָט
  choice: 必逃脱
  rationale: מלט 的尼法勒形可指逃脱或获救；“逃脱”保持简练，并不限定究竟是逃脱刑罚、灾祸，还是恶人的结局。副词“必”与前半句所表达的确定性相呼应。
theological_decisions:
- issue: רָע 的实体化阳性单数形式
  choice: 恶人
  alternative: 恶者；行恶的人；邪恶
  rationale: 译作“恶人”既反映原文所指的代表性个人，也符合汉语通称用法；避免将其抽象化为“邪恶”，同时不额外加入超出原文的身份说明。
- issue: יָד לְיָד 的含义
  choice: 正文保留手的意象，并以脚注说明其强调确定性的可能功能
  alternative: 断然；可以确定；即使联手
  rationale: 此习语的确切来源和语用功能并非完全确定。正文保留原文意象，避免把它无声地固定为单一解释；脚注提供较可能的理解。
- issue: 义人后代的“逃脱”所指
  choice: 不补明逃脱的具体对象
  alternative: 逃脱刑罚；得蒙拯救；逃过灾祸
  rationale: 原文没有明说其逃脱什么；保留这种开放性，可同时维持格言中审判、灾祸和结局等可能关联。
translation_notes:
  register: 采用简洁、对称的现代书面汉语，保持箴言警句的节奏。“手连着手”保留原文意象；分号和“却”突出两种结局的对照。
