revisions:
- from: 手连着手[a]，恶人也难免受罚；义人的后代却必逃脱。
  to: 手对手[a]，恶人必不免受罚；义人的后代必得逃脱。
  rationale: 修订以“手对手”替代会暗示手拉手或联合行动的“手连着手”，保留原文的陌生意象和未决性，并由脚注提供较可能的语用解释。删去无对应的“也”，以“必不免受罚”更直接表达“不会免罚”；后半句保留“逃脱”的开放所指。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T06:58:25Z'
review_pass:
  verdict: revise
  source_fidelity: 译文后半句准确表达了“义人的后代将逃脱”，且没有擅自界定逃脱的对象。前半句“恶人也难免受罚”基本符合“必不免受罚”，但“也”在原文中没有对应，弱化了格言式的断言。开头“手连着手”把难解的希伯来习语具体化为手牵连、联手的动作，容易造成不当释义。
  naturalness: “手连着手”在现代汉语中通常指人们手拉手或联合行动，与此处较可能的强调性用法不相称。“手对手”虽保留陌生感，却更贴近字面，配合脚注较为稳妥；“恶人必不免受罚；义人的后代必得逃脱”简洁而具箴言体警句的节奏。
  terminology: “恶人”“义人”“后代”“受罚”“逃脱”均恰当。将“难免受罚”改为“必不免受罚”，更准确地反映否定的“免罚”及开头习语所带的确定语气。脚注应避免把“彼此联手或代代相传”列作并列的主要理解；这些说法在中文中会被误当作正文所表达的关系，且“代代相传”缺乏充分文本根据。
  issues:
