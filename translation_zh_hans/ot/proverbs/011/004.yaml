  text: לֹא יוֹעִ֣יל ה֭וֹן בְּ/י֣וֹם עֶבְרָ֑ה וּ֝/צְדָקָ֗ה תַּצִּ֥יל מִ/מָּֽוֶת־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/004.yaml
  text: Wealth is of no use on the day of wrath[c][b][a], but righteousness delivers from death.
translation:
  language: zh_hans
  text: 财富在震怒之日毫无益处[a][c]，公义[b]却救人脱离死亡。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“财宝在震怒之日不能使人得益。”
    reason: lexical_alternative
  - marker: b
    text: “公义”在智慧文学语境中也可理解为“正直”或“正当的行为”。
    reason: lexical_alternative
  - marker: c
    text: “震怒之日”可泛指审判或灾祸临到的时刻；本节没有进一步说明。
    reason: alternative_reading
lexical_decisions:
- source_word: הוֹן
  choice: 财富
  rationale: 指物质财富、资财；“财富”是自然、庄重且涵盖面较广的现代汉语表达。
- source_word: יוֹעִיל
  choice: 毫无益处
  rationale: 使役词形在此表达“使人得益、发挥效用”；否定式译作“毫无益处”，清楚传达财富在特定时刻不能发挥作用。
- source_word: בְּיוֹם עֶבְרָה
  choice: 在震怒之日
  rationale: בְּיוֹם表示时间，עֶבְרָה可指烈怒、震怒；“震怒之日”保留审判意味，同时不限定为某一特定末世框架。
- source_word: צְדָקָה
  choice: 公义
  rationale: 该词可指公义、正直或合宜的行为；“公义”保留其伦理与神学幅度，脚注补充智慧文学中的行为层面。
- source_word: תַּצִּיל
  choice: 能救人脱离
  rationale: נצל的使役词形意为搭救、解救；汉语补出泛指宾语“人”，使句子自然，而不限定具体对象。
- source_word: מִמָּוֶת
  choice: 脱离死亡
  rationale: 直译为“从死亡中”；保留“死亡”的直接措辞，不擅自缩窄为某种现实危险。
theological_decisions:
- issue: “震怒之日”的所指
  choice: 保留为笼统而决定性的震怒或审判时刻
  alternative: 一般灾祸之日；末世神圣审判之日
  rationale: 原文有审判色彩，却未明确说明震怒的主体，也未规定末世论框架，因此正文不进一步限定。
- issue: “公义能救人脱离死亡”的意义
  choice: 按智慧文学的格言形式，直接陈述公义具有救人脱离死亡的作用
  alternative: 正直行为使人免遭致命后果；盟约意义上的公义带来神的拯救
  rationale: 原文明确作出生命与死亡层面的对照，但未展开称义论或救恩论机制；译文不把后来的神学争论带入经文。
translation_notes:
  register: 采用现代、庄重而易懂的箴言体。以“财富……毫无益处”与“公义……救人脱离死亡”构成清楚对仗；保留原文有关震怒、审判及死亡的开放性。
