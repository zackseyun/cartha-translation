  text: גֹּמֵ֣ל נַ֭פְשׁ/וֹ אִ֣ישׁ חָ֑סֶד וְ/עֹכֵ֥ר שְׁ֝אֵר֗/וֹ אַכְזָרִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/017.yaml
  text: A kind man benefits himself[a], but a cruel man troubles his own flesh.
translation:
  language: zh_hans
  text: 仁慈的人使自己得益，残忍的人却伤害自己的血肉[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “血肉”也可译作“身体”；若这里的 שְׁאֵר 指血亲，则可译作“亲属”。
    reason: lexical_alternative
lexical_decisions:
- source_word: גֹּמֵל
  choice: 使……得益
  rationale: 该分词在此表示施益、带来好处；与下半句“伤害”构成清楚的反义对应。
- source_word: נַפְשׁוֹ
  choice: 自己
  rationale: נֶפֶשׁ 可指生命、本人或自我；在本句中作实际而概括的反身表达，译为“自己”自然且不强加灵魂—身体二分。
- source_word: אִישׁ חָסֶד
  choice: 仁慈的人
  rationale: חֶסֶד 在此描述人的仁厚、善意品格，并非专门指上帝的圣约之爱；“仁慈的人”符合现代汉语箴言体。
- source_word: עֹכֵר
  choice: 伤害
  rationale: עכר 有使受祸、招致困扰之意；此处译作“伤害”，能自然表达残忍行为给自身血肉带来的祸害。
- source_word: שְׁאֵרוֹ
  choice: 自己的血肉
  rationale: שְׁאֵר 可指肉身、身体，也可指血亲。“自己的血肉”保留肉身意象，并容许一定程度的亲属联想；具体词义歧义在脚注中说明。
- source_word: אַכְזָרִי
  choice: 残忍的人
  rationale: 该形容词在此作名词使用；译为“残忍的人”，与上半句“仁慈的人”形成对称。
theological_decisions:
- issue: נַפְשׁוֹ 与 שְׁאֵרוֹ 是否表达灵魂和身体的二分
  choice: 译为“自己”与“自己的血肉”，不将两词解释为严格的人论二分
  alternative: 译为“灵魂”与“身体”
  rationale: 上下两句主要构成行为后果的反义平行；原文不足以要求一种严格的灵魂—身体二分理论。
- issue: שְׁאֵרוֹ 指本人肉身还是血亲
  choice: 正文采用较符合与 נַפְשׁוֹ 平行关系的肉身含义，同时以脚注保留血亲解释
  alternative: 正文直接译为“亲属”或“骨肉亲人”
  rationale: 与上半句“自己”对应时，“自己的血肉/身体”较自然，但该希伯来词确可指血亲，不宜消除这一真实歧义。
translation_notes:
  register: 采用简洁、对称的现代汉语箴言体。“仁慈的人……残忍的人……”保留原文人物类型的对照；“却”明确反义平行而不增添新的因果关系。
