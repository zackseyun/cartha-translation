  yaml_path: translation/ot/proverbs/011/024.yaml
  text: There is one who scatters[a], yet gains still more; and one who withholds more than is right, but only to poverty.
translation:
  language: zh_hans
  text: 有人慷慨施与，反而越发增多；有人扣留过多[a]，却只会缺乏。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “扣留过多”所译的希伯来语含义较难确定；也可理解为“连公平所要求的也扣住不给”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵשׁ
  choice: 有人
  rationale: 引出一种普遍的人物类型，而非某个特定的人；“有人”符合现代汉语箴言体。
- source_word: מְפַזֵּר
  choice: 慷慨散财
  rationale: 保留“分散、散布”的意象，同时以“财”点明本节语境中的慷慨施予，避免单说“分散”所造成的含混。
- source_word: וְנוֹסָף עוֹד
  choice: 反而增添更多
  rationale: נוסף 表示增加或被加添；“反而”自然呈现施散却增加的悖论，而不限定增加是主动赚取还是被动获得。
- source_word: וְחוֹשֵׂךְ
  choice: 有人……吝惜
  rationale: 表达扣住、舍不得给出的含义，并与前句的慷慨散财形成鲜明对照。
- source_word: מִיֹּשֶׁר
  choice: 过分
  rationale: 该短语含义困难，可指扣留超过合宜限度，也可能指扣留公平所要求给出的；正文用“过分吝惜”表达超出正当分寸，脚注保留另一种理解。
- source_word: אַךְ
  choice: 却只
  rationale: 兼顾转折与限定，突出吝惜所得的讽刺性结果。
- source_word: לְמַחְסוֹר
  choice: 落得贫乏
  rationale: מַחְסוֹר 指缺乏、短缺或穷乏；“落得贫乏”自然表达行为最终导致缺乏。
theological_decisions: []
translation_notes:
  register: 采用简洁、对称的现代汉语箴言体。“慷慨散财／过分吝惜”和“增添更多／落得贫乏”形成清楚对照；保留原文中财富增减机制未明说的张力，不将本节扩写为必然的现世回报公式。
