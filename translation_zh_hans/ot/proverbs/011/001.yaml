  text: מֹאזְנֵ֣י מִ֭רְמָה תּוֹעֲבַ֣ת יְהוָ֑ה וְ/אֶ֖בֶן שְׁלֵמָ֣ה רְצוֹנֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/001.yaml
  text: Dishonest scales are an abomination to Yahweh[a], but a full weight is his delight.
translation:
  language: zh_hans
  text: 诡诈的天平为雅威所憎恶；足量的砝码却为他所喜悦。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “砝码”原文直译为“完整的石头”，指交易中用来称量的足量、准确的标准石制砝码。
    reason: 说明原文的字面表达及古代商业背景。
lexical_decisions:
- source_word: מֹאזְנֵי מִרְמָה
  choice: 诡诈的天平
  rationale: מֹאזְנֵי 指称量用的天平；מִרְמָה 表示欺骗、欺诈。译为“诡诈的天平”，既保留原文名词结构和商业意象，也自然表达借称量器具行骗之意。
- source_word: תּוֹעֲבַת
  choice: 所憎恶
  rationale: 该词表示在雅威看来可憎、令人厌恶之物，语气强烈；“所憎恶”庄重自然，并保留道德判断的力度。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文四字神名直接音译为“雅威”，不以称号替代其专名。
- source_word: אֶבֶן שְׁלֵמָה
  choice: 足量的砝码
  rationale: אֶבֶן 字面为“石头”，此处指交易时放在天平上的标准石制砝码；שְׁלֵמָה 表示完整、足数。译文呈现其语境意义，并以脚注保留字面意象。
- source_word: רְצוֹנוֹ
  choice: 蒙他喜悦
  rationale: רָצוֹן 可表示喜悦、悦纳或恩宠；“蒙他喜悦”与前句“为雅威所憎恶”形成自然对仗，同时不把含义限缩为单纯情绪。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用以色列之神的专名。采用现代汉语常见的学术音译“雅威”，既保留专名性质，也避免用称号替代。
- issue: רְצוֹנוֹ 是“喜悦”还是“悦纳”
  choice: 蒙他喜悦
  alternative: 为他所悦纳
  rationale: 该词兼有喜悦、悦纳和恩宠等语义。“蒙他喜悦”保留神对公正砝码的正面评价，并与“所憎恶”构成鲜明对照，而不额外引入特定教义解释。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语，保留箴言上下句的对偶结构。“诡诈”维持原文强烈的道德色彩；“足量的砝码”让普通读者能够直接理解古代称量交易的意象。
