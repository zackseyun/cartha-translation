  text: בְּ/מ֤וֹת אָדָ֣ם רָ֭שָׁע תֹּאבַ֣ד תִּקְוָ֑ה וְ/תוֹחֶ֖לֶת אוֹנִ֣ים אָבָֽדָה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/007.yaml
  text: When a wicked man dies[a], his hope perishes, and the expectation of wealth comes to nothing.
translation:
  language: zh_hans
  text: 恶人一死，他的盼望就消逝；他对力量的指望[a]也随之破灭。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “力量”所对应的希伯来词含义不确定，也可理解为“强者”；还可能指能力、权势或财富等资源。因此本句也可译作：“强者的指望也破灭。”
    reason: 保留 אוֹנִים 的词义及句法歧义，避免在正文中武断限定。
lexical_decisions:
- source_word: בְּמוֹת
  choice: 一死
  rationale: 介词 בְּ 加动词不定式构成时间从句；“一死”在现代汉语中简洁自然，准确表达“当……死时”。
- source_word: אָדָם רָשָׁע
  choice: 恶人
  rationale: 此处指一个作恶的人；汉语“恶人”自然涵盖个体，不必把 אָדָם 单独译为“男人”，也没有把范围扩大为全人类。
- source_word: תֹּאבַד תִּקְוָה
  choice: 盼望就消逝
  rationale: תִּקְוָה 是“盼望”，אבד 表示丧失、消亡；“消逝”保留其严肃意味，也符合箴言体的凝练表达。
- source_word: וְתוֹחֶלֶת
  choice: 指望
  rationale: תּוֹחֶלֶת 与 תִּקְוָה 意义相近。分别译作“盼望”和“指望”，既呈现平行关系，又避免机械重复。
- source_word: אוֹנִים
  choice: 力量
  rationale: 该词意义困难，按马所拉文本的形式，可与表示力量、能力或资源的词相关。“力量”较少过度限定，财富、权势或强者等可能含义则不强行写入正文。
- source_word: אָבָדָה
  choice: 也随之破灭
  rationale: 此词同样源自 אבד；“破灭”自然表达指望归于无有，并以近义变化保留原文两分句的平行。
theological_decisions:
- issue: אָדָם 的性别表达
  choice: 恶人
  alternative: 邪恶的男人／邪恶的人
  rationale: 希伯来语 אָדָם 在此是智慧文学中代表性的个体，并不明确强调男性性别。现代汉语“恶人”忠实、凝练，且不引入原文没有突出的性别信息。
- issue: אוֹנִים 的解释
  choice: 力量
  alternative: 强者；财富；权势
  rationale: 该词在本节中的具体所指不确定。“力量”保留较宽的语义范围，不把它专门化为钱财；“强者”也是语法和词义上可行的理解，故在脚注中说明。
translation_notes:
  register: 采用凝练、庄重而自然的现代标准汉语，保持希伯来诗句两分句的平行结构。“一死……就……”清楚呈现时间关系；“消逝／破灭”和“盼望／指望”以近义对应表现原文的重复与变化。
