  text: מֹ֣נֵֽעַ בָּ֭ר יִקְּבֻ֣/הוּ לְא֑וֹם וּ֝/בְרָכָ֗ה לְ/רֹ֣אשׁ מַשְׁבִּֽיר׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/026.yaml
  text: The one who withholds grain—the people curse him[b][a], but blessing is on the head of the one who sells it.
translation:
  language: zh_hans
  text: 扣住粮食不卖的，民众必咒诅他[a]；售粮者[b]，祝福必临到他的头上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “民众”也可译作“人民”或“民族”；希伯来语 לְאֹם 可指一个族群，也可统指公众。
    reason: lexical_alternative
  - marker: b
    text: “售粮者”也可译作“供应粮食的人”或“分发粮食的人”；希伯来语这个分词可以侧重使粮食得到供应，但在这里与扣住粮食不卖相对，通常含有售粮的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: מֹנֵעַ
  choice: 囤积
  rationale: 该分词作名词性用法，指持续扣住粮食、不肯供应的人；结合与“出售粮食”的对照，“囤积”自然传达为牟利或造成短缺而把持粮食的语境含义。
- source_word: בָּר
  choice: 粮食
  rationale: 此词泛指谷物粮食，并不限定为小麦；“粮食”是现代汉语中准确而自然的总称。
- source_word: יִקְּבֻהוּ
  choice: 必咒诅他
  rationale: 此处 נקב 表示向某人发出咒诅；“咒诅”保留原文强烈的言语行动，未弱化为一般谴责。
- source_word: לְאֹם
  choice: 民众
  rationale: 该词可指民族、人民或公众；本节描写社会大众对粮食囤积者的反应，“民众”最贴合语境，同时以脚注保留“民族／人民”的词义可能。
- source_word: וּבְרָכָה
  choice: 福气
  rationale: בְרָכָה 指祝福或由祝福而来的福分；在“临到头上”的具体意象中，“福气”符合自然现代汉语。并列词 ו 在反义平行中以分号自然显出转折，无须额外加入“但是”。
- source_word: לְרֹאשׁ
  choice: 临到他头上
  rationale: 保留希伯来文祝福在某人头上的具体意象；“临到”使汉语通顺，又不将其抽象化为单纯的“得到”。
- source_word: מַשְׁבִּיר
  choice: 出售粮食的
  rationale: שׁבר 的 Hiphil 分词在粮食交易语境中通常指售粮、供应粮食者，与前句扣住粮食形成对照；脚注说明它也可侧重供应或分发。
