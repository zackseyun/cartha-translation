base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/003.yaml
  text: The integrity of the upright guides them[b][a], but the crookedness of the treacherous destroys them.
translation:
  language: zh_hans
  text: 正直人的纯正品格引导他们；背信之人的乖谬[a]却毁灭他们[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “乖谬”也可译作“扭曲”或“邪曲”；希伯来语带有道德上弯曲变形的意象，与“正直”相对。
    reason: lexical_alternative
  - marker: b
    text: 末句也可译作“却成为他们的毁灭”或“却使他们败亡”。
    reason: lexical_alternative
lexical_decisions:
- source_word: תֻּמַּת
  choice: 纯正
  rationale: 该词表示品格的完整、纯全与正直；“纯正”在现代汉语中自然庄重，又不会让人误以为是绝对无罪。
- source_word: יְשָׁרִים
  choice: 正直的人
  rationale: 保留“正直、端正”的伦理意义，并与下半句表示扭曲的 סֶלֶף 构成鲜明对照。
- source_word: תַּנְחֵם
  choice: 引导他们
  rationale: 这是 נחה 的使役形，意为带领、引导；在智慧文学语境中指人的品格为其人生指明方向。
- source_word: סֶלֶף
  choice: 乖谬
  rationale: 该词指扭曲、悖逆或道德上的不正；“乖谬”兼顾伦理含义及其与“正直”的对照，脚注保留更具形象性的译法。
- source_word: בּוֹגְדִים
  choice: 奸诈的人
  rationale: 该分词指惯常背信、行事诡诈的人；“奸诈的人”比特指政治背叛的“叛徒”更适合一般性的箴言语境。
- source_word: ו/שד/ם
  choice: 却使他们毁灭
  rationale: 按本句平行结构及所给文本所反映的毁坏、灭亡语义处理，表达奸诈者因自身的乖谬走向毁灭；脚注说明也可理解为“成为他们的毁灭”，以保留形式与语义上的不确定性。
theological_decisions:
- issue: 奸诈者的乖谬与其毁灭之间的关系
  choice: 译作“使他们毁灭”
  alternative: “成为他们的毁灭”或“使他们败亡”
  rationale: 上下两句都把人的品格写成影响其结局的力量；本译保留这一因果意味，但不进一步断定毁灭发生的具体方式或施行者。
translation_notes:
  register: 采用现代、庄重而易懂的箴言体。上半句以“正直—纯正”，下半句以“奸诈—乖谬”形成紧凑对仗；“纯正”表达完整的道德品格而不夸大为绝对无罪。所有脚注标记均置于所解释的词句之后。
