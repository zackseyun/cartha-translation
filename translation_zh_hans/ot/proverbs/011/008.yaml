  yaml_path: translation/ot/proverbs/011/008.yaml
  text: The righteous is rescued from trouble[a], and the wicked comes in his place.
translation:
  language: zh_hans
  text: 义人脱离患难，恶人却来代替他承受患难[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译可作“恶人却来代替他”。原文的“代替他”表达替代关系；按上下文，可指恶人承受义人所脱离的患难。
    reason: lexical_alternative
lexical_decisions:
- source_word: צַדִּיק
  choice: 义人
  rationale: 该形容词在此作名词使用，指一个具有代表性的义者；“义人”简洁自然，也符合箴言的对句风格。
- source_word: מִצָּרָה
  choice: 脱离患难
  rationale: 介词 מִן 表示从某种境况中出来，צָרָה 指患难、困苦或危难；“患难”庄重而通俗，涵盖原词的宽泛含义。
- source_word: נֶחֱלָץ
  choice: 脱离
  rationale: חלץ 的尼法勒形在这里表示被解救、得以摆脱。汉语“脱离”可自然表达结果而不暗示义人纯靠自己逃脱。
- source_word: וַיָּבֹא
  choice: 却来
  rationale: 原文动词意为“来、进入”，推动下半句；“却”体现对句中的逆转关系，但不额外规定事情发生的方式或时间。
- source_word: רָשָׁע
  choice: 恶人
  rationale: 该形容词作名词使用，与“义人”形成鲜明对照；“恶人”是现代汉语智慧文学中自然、明确的表达。
- source_word: תַּחְתָּיו
  choice: 代替他
  rationale: תַּחַת 加代词后缀常表示“在某人的位置上、代替某人”。这里表达恶人取代义人承受患难的逆转；直译为“在他下面”会误导读者。
theological_decisions:
- issue: 箴言中义人与恶人命运逆转的含义
  choice: 译为恶人来代替义人，保留替代和逆转的含义
  alternative: 明确译成“恶人反倒陷入那患难”，将所指具体解释为同一场患难
  rationale: תַּחְתָּיו 支持“代替他”的替代关系，且上半句的“患难”可自然补足其语义；但原文没有明说具体机制，因此正文保持凝练，并以脚注说明可能的具体理解。
translation_notes:
  register: 采用现代、简洁而庄重的箴言体。保留“义人／恶人”的对称结构和代表性单数，不添加性别用语；用“却”自然显出命运逆转。
