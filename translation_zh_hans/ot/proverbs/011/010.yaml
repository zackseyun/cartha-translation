  text: בְּ/ט֣וּב צַ֭דִּיקִים תַּעֲלֹ֣ץ קִרְיָ֑ה וּ/בַ/אֲבֹ֖ד רְשָׁעִ֣ים רִנָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/010.yaml
  text: In the prosperity of the righteous a city rejoices[b][a], and in the perishing of the wicked there is shouting.
translation:
  language: zh_hans
  text: 义人兴盛时，城就欢喜[a]；恶人灭亡时，便有欢呼声[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“义人安好时，城就欢喜。”希伯来语直指义人的“好处”或“安好、福祉”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“便响起高声欢呼。”这个希伯来词可指响亮而欢悦的呼喊。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּטוּב
  choice: 兴盛时
  rationale: בְּ加טוּב表示义人处于良好、安稳或顺遂境况之时。“兴盛时”在现代汉语中简洁自然，也与下句“灭亡时”形成平行；脚注保留较宽泛的“安好”含义。
- source_word: צַדִּיקִים
  choice: 义人
  rationale: 复数形容词名词化，指行事正直的一类人。“义人”简洁、庄重，并保留《箴言》中的道德范畴。
- source_word: תַּעֲלֹץ
  choice: 欢喜
  rationale: עלץ表示欣喜、雀跃。“欢喜”自然易懂，同时保留“城”作为主语的拟人表达。
- source_word: קִרְיָה
  choice: 城
  rationale: קִרְיָה指城或城镇。汉语以无量词的“城”表达泛指，适合箴言的一般性陈述，也不必强加定指。
- source_word: וּבַאֲבֹד
  choice: 灭亡时
  rationale: 介词בְּ与אבד的不定式结构表示伴随情境或时机；译作“灭亡时”既自然，又与上句“兴盛时”平行。
- source_word: רְשָׁעִים
  choice: 恶人
  rationale: 复数形容词名词化，与“义人”构成《箴言》中鲜明而简洁的道德对照。
- source_word: רִנָּה
  choice: 欢呼声
  rationale: רִנָּה可指响亮的呼喊，常带喜悦、欢庆意味。此处因恶人灭亡而发出，译作“欢呼声”较好地传达语境中的公众喜悦；脚注说明也可理解为高声欢呼。
theological_decisions:
- issue: 城因恶人灭亡而欢呼的道德张力
  choice: 按原文直陈“恶人灭亡时，便有欢呼声”
  alternative: 弱化为“恶势力消退时，人们感到宽慰”
  rationale: 原文明确将义人的良好境况与恶人的灭亡并列，并描写城中的公开欢庆。译文不将其改写为抽象原则，也不额外解释为私人报复，从而保留箴言本身的张力。
translation_notes:
  register: 采用现代、简洁而庄重的箴言体。两个分句都用“……时”保持希伯来文的平行结构；保留“城就欢喜”的拟人说法，不增译“全城”或“居民”，以免加入原文未明说的范围。
