  text: פְּֽרִי צַ֭דִּיק עֵ֣ץ חַיִּ֑ים וְ/לֹקֵ֖חַ נְפָשׂ֣וֹת חָכָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/030.yaml
  text: The fruit of the righteous is a tree of life[a], and he who wins souls is wise.
translation:
  language: zh_hans
  text: 义人的果实是生命树；赢得他人的，是有智慧的。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“取得人（或性命）的人，是有智慧的。”希伯来语直译使用“取得”与“人／性命”搭配；这里可理解为赢得或争取人，但原文措辞保留一定的含混性。
    reason: 保留 לֹקֵחַ נְפָשׂוֹת 这一搭配的字面意义及词义歧义，避免将其限定为使人归信或狭义的“拯救灵魂”。
lexical_decisions:
- source_word: פְּרִי
  choice: 果实
  rationale: 保留“果子／果实”的比喻，可指义人生命所产生的结果与影响；“果实”在现代汉语中自然且庄重。
- source_word: צַדִּיק
  choice: 义人
  rationale: 该形容词在此作名词使用，单数具有代表性；“义人”简洁地保留智慧文学中的伦理称谓。
- source_word: עֵץ חַיִּים
  choice: 生命树
  rationale: 保留箴言中反复出现的固定意象及其与创世记的互文联系，不将其解释性改写为“赐生命的树”。
- source_word: לֹקֵחַ
  choice: 赢得
  rationale: לקח的基本义是“拿、取得”，与“人／生命”连用时语义并不完全确定。“赢得”可自然表达争取、获得人的意思，同时以脚注保留其字面可能性。
- source_word: נְפָשׂוֹת
  choice: 人
  rationale: נפשׁ复数在此可指人、性命或生命，并非必然专指与身体相对的“灵魂”。正文用“人”避免输入狭义灵魂观，脚注注明其他可能译法。
- source_word: חָכָם
  choice: 是有智慧的
  rationale: 该词在句中作表语；此译法保留判断语气，并符合现代汉语箴言式表达。
theological_decisions:
- issue: “赢得人”是否专指使人归信
  choice: 理解为广义上赢得、争取或影响人，不限定为传福音使人归信。
  alternative: 解释为“拯救灵魂”或专指宗教归信。
  rationale: 希伯来语本身没有明确表达后来的宣教或归信范畴；正文保留积极的人际影响含义，脚注则呈现原文较宽且较含混的措辞。
- issue: לקח נְפָשׂוֹת的字面张力
  choice: 正文译作“赢得人的”，脚注保留“取得人／生命（性命）”的字面可能。
  alternative: 正文直译为“夺取性命的”。
  rationale: 动词לקח通常是“拿、取得”，不必然含暴力；但宾语נְפָשׂוֹת可指人或性命，因此不应把原文的全部语义范围无提示地收窄。
translation_notes:
  register: 采用现代、简洁而庄重的箴言体。“义人”“生命树”保留圣经智慧文学的传统意象；“赢得人的”比“赢得灵魂”更符合现代汉语，也避免把נפשׁ误解为单指非物质灵魂。
