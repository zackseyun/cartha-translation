  text: שְׁחוֹרָ֤ה אֲנִי֙ וְֽ/נָאוָ֔ה בְּנ֖וֹת יְרוּשָׁלִָ֑ם כְּ/אָהֳלֵ֣י קֵדָ֔ר כִּ/ירִיע֖וֹת שְׁלֹמֹֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/001/005.yaml
  text: I am dark[a], yet lovely, daughters of Jerusalem, like the tents of Kedar, like the curtains of Solomon.
translation:
  language: zh_hans
  text: 耶路撒冷的众女子啊，我虽黝黑[a]，却秀美，如同基达的帐篷，如同所罗门的帷幔。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我黝黑，也秀美。”希伯来语连接词直译为“和”；正文的“虽……却……”表达了上下文中可能含有的反衬意味。
    reason: 保留连接词可作单纯并列或语境性转折的两种理解。
lexical_decisions:
- source_word: שְׁחוֹרָה
  choice: 肤色黝黑
  rationale: 该阴性形容词表示颜色深暗；结合下一节日晒的语境，译为“肤色黝黑”自然且明确，同时不引申为族裔身份。“黝黑”比“黑色”更适合现代汉语中的人物外貌自述。
- source_word: וְנָאוָה
  choice: 却很秀美
  rationale: נָאוָה表示美丽、可爱；“秀美”兼具自然与诗意。ו字面为“和”，但语境中很可能带转折意味，故正文用“却”；直译的并列关系以脚注保留。
- source_word: בְּנוֹת יְרוּשָׁלִָם
  choice: 耶路撒冷的女子们
  rationale: 保留“女儿们”这一称呼的群体与女性意象，同时采用现代汉语更自然的“女子们”，避免让读者误解为耶路撒冷城的亲生女儿。
- source_word: כְּאָהֳלֵי קֵדָר
  choice: 如同基达的帐棚
  rationale: 按原文直译此明喻；基达作为专名音译。帐棚的深暗色泽与上文形成意象联系，但不在正文中增补解释。
- source_word: כִּירִיעוֹת שְׁלֹמֹה
  choice: 如同所罗门的幔子
  rationale: יְרִיעוֹת可指幔子、帘幕或帐棚布；“幔子”既保留织物意象，也具有适度诗体色彩，不强行限定其具体用途。
theological_decisions:
- issue: ו在נָאוָה之前是单纯并列还是带转折意味
  choice: 正文采用转折：“虽然……却……”
  alternative: “我肤色黝黑，也很秀美”
  rationale: 希伯来语ו本义为“和”，但上下文可能暗示说话者针对他人对深色皮肤的负面眼光作出反衬。中文用“虽然……却……”能自然表达这一可能性；因原文没有专门的转折连词，脚注保留并列读法，以免消除歧义。
translation_notes:
  register: 采用现代、端庄而易懂的诗体汉语。“肤色黝黑”与下一节的日晒语境相合；“秀美”“幔子”略具诗意但仍属通行词语。两组“如同”保留原文平行结构。
