base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/001/008.yaml
  text: If you do not know[a], most beautiful among women, go out for yourself in the tracks of the flock[b], and pasture your young goats beside the shepherds’ tents.
translation:
  language: zh_hans
  text: 你若不知道，女子中最美丽的啊，就沿着羊群的足迹出去，牧放你的小山羊，靠近牧人的帐棚。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִם לֹא תֵדְעִי
  choice: 你若不知道
  rationale: 保留希伯来文真实条件句及 ידע“知道”的基本义；上下文所缺省的是该往哪里去或该怎样做，中文无需擅自补明。
- source_word: הַיָּפָה בַּנָּשִׁים
  choice: 女子中最美丽的啊
  rationale: 形容词加 בְּ 与群体构成近似最高级的表达；“女子中最美丽的”自然明确，呼语助词“啊”标明称呼语气。
- source_word: צְאִי לָךְ
  choice: 出去
  rationale: צְאִי 是阴性单数命令式“出去”；לָךְ 带有亲身行动或为自己而去的细微语气，但直译“为你自己出去”在现代汉语中生硬，因此不另行显化。
- source_word: בְּעִקְבֵי הַצֹּאן
  choice: 沿着羊群的足迹
  rationale: עִקְבֵי 指脚印、踪迹；“沿着……的足迹”既保留具体牧野意象，也自然表达循迹而行。
- source_word: וּרְעִי אֶת גְּדִיֹּתַיִךְ
  choice: 牧放你的小山羊
  rationale: רעה 在此指使牲畜吃草、牧养；גְּדִיֹּתַיִךְ 是“你的小山羊”。“牧放”准确且避免“孩子”的歧义。
- source_word: עַל מִשְׁכְּנוֹת הָרֹעִים
  choice: 靠近牧人的帐棚
  rationale: עַל 在此表达空间邻近；מִשְׁכְּנוֹת 泛指住处，在游牧场景中译为“帐棚”最贴切。“靠近”保留邻近关系而不误作“在……上面”。
