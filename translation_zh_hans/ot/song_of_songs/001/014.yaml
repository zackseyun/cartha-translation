  yaml_path: translation/ot/song_of_songs/001/014.yaml
  text: My beloved is to me a cluster of henna blossoms in the vineyards of En-gedi[a].
translation:
  language: zh_hans
  text: 我的良人于我，好像隐·基底葡萄园中的一簇指甲花[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “指甲花”所译的希伯来词传统上曾按旧式名称译作“佳姆法”（camphire）；此处最可能指指甲花（henna），一种以芳香花朵著称的植物。
    reason: 说明旧译名称与较可能的植物辨识，避免将“佳姆法”误作另一项确定的植物鉴定。
lexical_decisions:
- source_word: אֶשְׁכֹּל
  choice: 一簇
  rationale: 该词指成簇或成串之物；此处与植物名连用，译作“一簇”既保留具体意象，也不误解为葡萄串。
- source_word: הַכֹּפֶר
  choice: 凤仙花
  rationale: 此词在本节最可能指散发芳香、花朵成簇的指甲花（Lawsonia inermis）；现代汉语中“凤仙花”较自然，但可能与严格植物分类中的凤仙花混淆，故以脚注说明。
- source_word: דּוֹדִי
  choice: 我的良人
  rationale: 在《雅歌》中指女子所爱的男子；“良人”保持诗歌的庄重与亲昵，也符合现代读者熟悉的雅歌语域。
- source_word: לִי
  choice: 于我
  rationale: 表达说话者主观感受和关系，即“在我看来／对我而言”；“于我”凝练地保留原文结构和诗体语气。
- source_word: בְּכַרְמֵי
  choice: 葡萄园中的
  rationale: בְּ与复数构造形式合用，表示位于隐·基底的葡萄园中；译文保留其地点意象，不额外限定为“在……之间”。
- source_word: עֵין גֶּדִי
  choice: 隐·基底
  rationale: 这是地名，采用现代中文圣经中较常见的音译形式，并以间隔号标示复合地名。
