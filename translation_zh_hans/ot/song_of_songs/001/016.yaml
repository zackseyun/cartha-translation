  yaml_path: translation/ot/song_of_songs/001/016.yaml
  text: Look[a], you are beautiful, my beloved—indeed, pleasant! Indeed, our couch is luxuriant.
translation:
  language: zh_hans
  text: 看哪，我的爱人，你真俊美，真可爱！我们的床榻也一片青翠[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“我们的床榻也清新繁茂”。原文形容词有新鲜、青绿、草木繁盛之意，可能是在描绘葱茏的自然环境。
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְּךָ
  choice: 看哪，你
  rationale: 该形式由指示、感叹词 הִנֵּה 加第二人称阳性单数后缀构成，用来鲜明地把注意力引向对方；“看哪”保留诗歌中的感叹色彩。
- source_word: יָפֶה
  choice: 俊美
  rationale: 此处称赞男性恋人的容貌；“俊美”既明确自然，又保持诗体的雅致，不把含义缩限为较口语化的“帅”。
- source_word: דוֹדִי
  choice: 我的爱人
  rationale: 在《雅歌》中，דוֹדִי 是女子对恋人的亲昵称呼；“我的爱人”自然地表达爱情关系，同时保留诗意。
- source_word: אַף
  choice: 真；也
  rationale: 该强调兼添加性的小词在两处作用略有不同：第一处加强对“可爱”的赞叹，译作“真”；第二处把床榻的景象加入描写，译作“也”。
- source_word: נָעִים
  choice: 可爱
  rationale: 该词表示令人愉悦、可喜可亲；“可爱”在这里不是幼态用语，而是对恋人悦人可亲的诗性称赞，并与前面的外貌之美相区别。
- source_word: עַרְשֵׂנוּ
  choice: 我们的床榻
  rationale: עֶרֶשׂ 可指床、卧榻或休憩之处。“床榻”保留亲密场景的可能性，又不比原文更明确地规定其性质。
- source_word: רַעֲנָנָה
  choice: 一片青翠
  rationale: 该形容词表示新鲜、青绿或草木繁茂。与“床榻”连用时很可能唤起户外草木葱茏的环境；“一片青翠”保留这一鲜明意象，而不擅自解释床榻与自然环境的具体关系。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的抒情语言。“看哪”保留原文突出的感叹语气；以“俊美”对应男性对象。“真……也……”分别呈现两处 אַף 的强调和添加作用。脚注标记紧随其所解释的“青翠”，避免误指句首感叹词。
