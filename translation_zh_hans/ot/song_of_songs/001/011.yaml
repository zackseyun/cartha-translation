  yaml_path: translation/ot/song_of_songs/001/011.yaml
  text: We will make for you ornaments of gold[b][a], with studs of silver.
translation:
  language: zh_hans
  text: 我们要为你制作金饰[a]，配以银质饰钉[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“金链”“成排的金饰”或“金环”；希伯来语所指的具体饰物形制不能确定。
    reason: lexical_alternative
  - marker: b
    text: 或译“银珠”“银点”或“银片”；希伯来语指细小的点状银饰。
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹרֵי
  choice: 金饰
  rationale: 该复数构造形式指某种制作而成的饰物，但具体形制不确定；译作“金饰”既符合首饰语境，也避免武断限定为链子、环饰或成排装饰。
- source_word: זָהָב
  choice: 金
  rationale: 此处指制作饰物所用的黄金；与“饰”结合为自然的现代汉语“金饰”。
- source_word: נַעֲשֶׂה
  choice: 我们要……打造
  rationale: 这是עשה的Qal未完成式第一人称复数，在语境中自然表达将来的意愿或承诺；“打造”适合金银饰物的制作。
- source_word: לָּךְ
  choice: 为你
  rationale: 介词加阴性单数第二人称后缀，表明饰物是为受话女子制作的。
- source_word: עִם
  choice: 配上
  rationale: 表达金饰与银质小装饰相配合；“配上”比直译“带着”更符合现代汉语首饰语境。
- source_word: נְקֻדּוֹת
  choice: 银珠
  rationale: 该词指点状或小型装饰元素；“银珠”在汉语中自然地呈现其细小、点缀性的首饰形态，同时以脚注保留“银点、银片”等可能。
- source_word: הַכָּסֶף
  choice: 银
  rationale: 标准金属名称；与נְקֻדּוֹת合译为“银珠”。
