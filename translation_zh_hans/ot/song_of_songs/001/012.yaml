base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/001/012.yaml
  text: While the king was at his table[b][a], my nard gave its fragrance.
translation:
  language: zh_hans
  text: 当王在席间时[a]，我的甘松[b]散发出香气。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“当王坐席时”“当王在宴席中时”；也可能指王斜倚在卧榻上。原文用词可泛指筵席，或众人斜倚围坐的场合。
    reason: lexical_alternative
  - marker: b
    text: “甘松”是一种芳香植物，也可指用它制成的香料。
    reason: lexical_clarification
lexical_decisions:
- source_word: עַד
  choice: ……的时候
  rationale: עַד通常可表示“直到”，但在本诗句中更自然地引出香气散发时的情境；译作“……的时候”保留其时间关系，又不强行赋予终止含义。
- source_word: שֶׁהַמֶּלֶךְ
  choice: 王
  rationale: 原文为定指的“王”，在诗歌语境中指男性爱人；不使用带神学色彩的特殊称谓或标示，以免加入原文未明说的弥赛亚解释。
- source_word: בִּמְסִבּוֹ
  choice: 在席间
  rationale: מְסִבָּה可指筵席、席位或众人斜倚围坐的场合。“在席间”自然简洁，保留宴饮场景，同时避免过度限定为桌旁或卧榻上。
- source_word: נִרְדִּי
  choice: 我的甘松
  rationale: נִרְדִּי指属于说话者的芳香植物或香料甘松；“甘松”是现代汉语中准确而简明的植物、香料名称。
- source_word: נָתַן
  choice: 散发出
  rationale: 原义为“给出”；与“香气”搭配时，现代汉语自然表达为“散发出”，准确传达香气发出的希伯来语习用说法。
- source_word: רֵיחוֹ
  choice: 香气
  rationale: 后缀指向“甘松”，汉语无需另译“它的”；“香气”符合爱情诗中正面的嗅觉语境。
theological_decisions:
- issue: 是否把“王”处理为弥赛亚或神学性称号
  choice: 按诗中人物称谓译为普通的“王”
  alternative: 采用带特殊尊称意味的写法，以暗示“君王”是神学或预表性称号
  rationale: 希伯来文本本身并未要求在此作弥赛亚或寓意解释。译文保留诗歌表层所指，不加入特定教义传统。
translation_notes:
  register: 采用现代、庄重而流畅的诗歌语言。“在席间”兼顾原文宴饮或斜倚围坐的语义幅度；“散发出香气”符合现代汉语搭配。所有脚注标记均置于正文对应词语之后。
