source:
  edition: WLC
  text: מָשְׁכֵ֖/נִי אַחֲרֶ֣י/ךָ נָּר֑וּצָה הֱבִיאַ֨/נִי הַ/מֶּ֜לֶךְ חֲדָרָ֗י/ו נָגִ֤ילָה וְ/נִשְׂמְחָה֙ בָּ֔/ךְ נַזְכִּ֤ירָה דֹדֶ֨י/ךָ֙ מִ/יַּ֔יִן מֵישָׁרִ֖ים אֲהֵבֽוּ/ךָ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/001/004.yaml
  text: Draw me after you[a]; let us run. The king has brought me into his chambers. We will rejoice and be glad in you; we will extol your love more than wine[b]. Rightly do they love you.
translation:
  language: zh_hans
  text: 愿你吸引我跟随你；我们快跑吧！王已经带我进入他的内室。我们要因你欢喜快乐；我们要称颂[a]你的爱情，胜过美酒。人们爱你，实在有理。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “称颂”或译“记念”、“述说”或“庆贺”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“正直的人爱你。”希伯来语 מֵישָׁרִים 既可作副词，表示“有理、理所当然”，也可作名词，指“正直的人”。
    reason: alternative_reading
lexical_decisions:
- source_word: מָשְׁכֵנִי
  choice: 愿你吸引我
  rationale: 动词 משׁך 有“拉、牵引、吸引”之意；在爱情诗语境中，“吸引”自然保留身体与情感牵引的诗意，且以“愿你”表达祈愿语气。
- source_word: אַחֲרֶיךָ נָּרוּצָה
  choice: 跟随你；我们快跑吧
  rationale: 保留希伯来文从第一人称单数“我”转为复数“我们”的变化；“快跑吧”体现 cohortative 的劝愿语气。
- source_word: הֱבִיאַנִי הַמֶּלֶךְ חֲדָרָיו
  choice: 王已经带我进入他的内室
  rationale: 将 הֱבִיאַנִי 按完成式处理；“内室”既表达 חדר 的内部房间含义，也保留诗中的亲密氛围。
- source_word: נָגִילָה וְנִשְׂמְחָה בָּךְ
  choice: 我们要因你欢喜快乐
  rationale: 保留两个近义喜乐动词的并列；בָּךְ 可指喜乐的对象或缘由，汉语以“因你”表达自然。
- source_word: נַזְכִּירָה
  choice: 我们要称颂
  rationale: זכר 的基本义是“记念、提说”，此处以爱情为宾语，语境可有宣扬、庆贺之意；“称颂”传达诗歌中的赞美功能，同时以脚注保留基本词义的其他可能。
- source_word: דֹדֶיךָ מִיַּיִן
  choice: 你的爱情，胜过美酒
  rationale: דֹדֶיךָ 为复数形式，可统指爱情或爱抚；中文用集合意义的“爱情”自然。“胜过美酒”明确表达比较关系。
- source_word: מֵישָׁרִים אֲהֵבוּךָ
  choice: 她们爱你，实在有理
  rationale: 将 מֵישָׁרִים 按副词性用法理解为“正当地、有充分理由地”；“她们”依据上下文中的众女子补出主语，但另一个可行句法是“正直的人爱你”，故列入脚注。
theological_decisions:
- issue: “王”的身份
  choice: 仅译作“王”，保留诗中人物称谓，不作神圣或弥赛亚身份认定。
  alternative: 将“王”解释为上帝或弥赛亚。
  rationale: 本节原文本身没有明确作出这种神学身份认定；译文应保留文学层面的开放性。
- issue: מֵישָׁרִים 的句法与所指
  choice: 按副词理解：“她们爱你，实在有理。”
  alternative: 按名词理解：“正直的人都爱你。”
  rationale: 两种分析在希伯来文中均有可能；正文采用与爱情诗语境衔接自然的副词解法，脚注保存实词解法。
translation_notes:
  register: 采用现代、端庄而富有诗意的普通话。“内室”“称颂”“美酒”保留雅歌的抒情格调，同时避免古奥表达。正文保留单数“我”转为复数“我们”的人称变化，并以脚注明示两处真实的词义和句法歧义。
