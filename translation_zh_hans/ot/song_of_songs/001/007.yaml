base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/001/007.yaml
  text: Tell me[a], you whom my soul loves, where you pasture your flock, where you make it lie down at noon; for why should I be like one who veils herself beside the flocks of your companions?
translation:
  language: zh_hans
  text: 我心所爱的啊，请告诉我：你在哪里牧放羊群？正午时，你在哪里使羊群躺卧？我为什么要在你同伴的羊群旁，像个蒙着面纱[a]的人呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“像一个四处游走的人”。这个希伯来语词通常可指蒙面或裹身的人；也有人按上下文理解为四处游走的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַגִּידָה לִּי
  choice: 请告诉我
  rationale: 保留祈使句的直接呼求；加入“请”符合现代汉语中亲密而恳切的语气。
- source_word: שֶׁאָהֲבָה נַפְשִׁי
  choice: 我心所爱的啊
  rationale: נֶפֶשׁ在此表达整个人内在深切的爱。“我心所爱的”既保留希伯来语的诗意强度，又比逐字译作“我灵魂所爱的”更自然。句末“啊”标明呼语。
- source_word: אֵיכָה תִרְעֶה
  choice: 你在哪里牧放羊群
  rationale: אֵיכָה在牧养语境中询问地点；רעה可指牧放、照料。原文未明说“羊群”，但由下文明确可知，汉语补出以避免误解。
- source_word: אֵיכָה תַּרְבִּיץ
  choice: 你在哪里使羊群躺卧
  rationale: 保留רבץ使役形的含义，即使羊群躺下休息；重复“羊群”使汉语指代清楚。
- source_word: בַּצָּהֳרָיִם
  choice: 正午时
  rationale: 准确表达时间，也保留诗句简洁的节奏。
- source_word: שַׁלָּמָה אֶהְיֶה
  choice: 我何必……呢
  rationale: 把带解释意味的反问译成自然现代汉语；不把未然语气强化为确定结果。
- source_word: כְּעֹטְיָה
  choice: 蒙着面纱
  rationale: 按עטה常见的“包裹、遮盖”词义翻译，并保留女性自我遮面的意象；“四处寻觅/流浪”的语境性理解列入脚注。
- source_word: עַל עֶדְרֵי חֲבֵרֶיךָ
  choice: 在你同伴的羊群旁边
  rationale: עַל在此取空间意义“在……旁边”；חֲבֵרֶיךָ译作“你的同伴”，不额外限定其身份。
- source_word: כְּ... עַל
  choice: 蒙着面纱……徘徊
  rationale: “徘徊”使汉语完整呈现她在别人的羊群旁寻找爱人的处境，但不以此取代כְּעֹטְיָה的主要词义。
