  yaml_path: translation/ot/song_of_songs/001/017.yaml
  text: The beams of our house are cedars[c][b][a]; our rafters are cypresses.
translation:
  language: zh_hans
  text: 我们房屋的梁木是香柏木[a]，椽木[b]是柏木[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “房屋”原文为复数形式，也可理解为集合意义的“我们的家”。
    reason: lexical_alternative
  - marker: b
    text: “椽木”所对应的希伯来语词义不确定，也可能指镶板或廊道。
    reason: lexical_alternative
  - marker: c
    text: “柏木”所指的确切树种不确定，也可能是圆柏或冷杉。
    reason: lexical_alternative
lexical_decisions:
- source_word: קֹרוֹת
  choice: 梁木
  rationale: 指房屋结构中的横梁或屋顶承重木；“梁木”在现代汉语中自然，并与下半句的建筑构件相呼应。
- source_word: בָּתֵּינוּ
  choice: 我们房屋的
  rationale: 希伯来语形式为复数并带第一人称复数后缀，直译可作“我们的房屋”；诗歌语境中也可能集合性地指共同居所。正文保留“房屋”这种单复数形式不显著的汉语表达，并在脚注说明。
- source_word: אֲרָזִים
  choice: 香柏木
  rationale: 该复数名词指香柏木材；在汉语建筑语境中译作“香柏木”比直译树木复数更自然。
- source_word: רַחִיטֵנוּ
  choice: 椽木
  rationale: 该词词义不确定；依建筑语境及与“梁木”的平行关系，正文采用指屋顶构件的“椽木”，其他可能释义列于脚注。
- source_word: בְּרוֹתִים
  choice: 柏木
  rationale: 树种辨识存在争议；“柏木”是自然且不过度精确的汉语表达，其他可能树种在脚注交代。
theological_decisions: []
translation_notes:
  register: 采用现代、凝练而有诗意的书面汉语。两个分句保持建筑意象的平行结构；不把共同居所的意象解释为特定神学寓意，并以脚注保留房屋数、建筑构件和树种上的原文不确定性。
