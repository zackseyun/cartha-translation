  text: יִשָּׁקֵ֨/נִי֙ מִ/נְּשִׁיק֣וֹת פִּ֔י/הוּ כִּֽי טוֹבִ֥ים דֹּדֶ֖י/ךָ מִ/יָּֽיִן־׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/001/002.yaml
  text: Let him kiss me with the kisses of his mouth[a], for your love is better than wine.
translation:
  language: zh_hans
  text: 愿他用口中的吻亲我！因为你的爱情比酒更美。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “爱情”或译“爱抚”。希伯来语原词为复数，也可更具体地指亲昵或爱抚的举动。
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשָּׁקֵנִי
  choice: 愿他……亲我
  rationale: Qal未完成式第三人称阳性单数带第一人称单数后缀，在此表达女子的愿望；“愿他”自然保留意愿语气，而非译作单纯将来时。
- source_word: מִנְּשִׁיקוֹת
  choice: 用……的吻
  rationale: 介词מִן在此可按工具性或部分性理解；汉语“用……的吻亲我”既自然，也保留复数“吻”的具体意象。
- source_word: פִּיהוּ
  choice: 口中的
  rationale: 直译其“他的口”之义，同时用自然汉语表达，保留原诗鲜明而亲密的身体意象。
- source_word: כִּי
  choice: 因为
  rationale: 引出前一句愿望的理由，明确保留因果关系。
- source_word: טוֹבִים
  choice: 更美
  rationale: 形容词复数与דֹּדֶיךָ呼应；在爱情诗中，“更美”比笼统的“更好”更自然，同时保留比较意义。
- source_word: דֹּדֶיךָ
  choice: 你的爱情
  rationale: 该复数名词可指爱情、爱抚或亲昵的表达；正文采用自然且涵盖面较广的“爱情”，不把语义限定为某一种具体举动，并以脚注保留更具体的可能。
- source_word: מִיָּיִן
  choice: 比酒
  rationale: מִן接在表示优越的טוֹבִים之后构成比较，现代汉语自然译为“比酒”。
