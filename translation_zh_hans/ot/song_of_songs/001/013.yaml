base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/001/013.yaml
  text: My beloved is to me a sachet of myrrh[c][b][a]; he lies between my breasts.
translation:
  language: zh_hans
  text: 我的良人于我如同一小包没药[a]，在我双乳之间留宿[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“一束没药。”希伯来语 צְרוֹר 指包裹起来的小包或小束；这里可能是佩在身上的香料包。
    reason: lexical_alternative
  - marker: b
    text: 或译：“过夜。”原文动词有住宿、过夜之意；其主语既可理解为“我的良人”，也可理解为比喻中的没药包。
    reason: lexical_alternative
lexical_decisions:
- source_word: צְרוֹר
  choice: 一小包
  rationale: 该词指包裹起来的小束或小包；与没药搭配时，“一小包”既自然，也能保留可佩带于身的香料包意象。
- source_word: הַמֹּר
  choice: 没药
  rationale: 这是芳香树脂 מור 的通行中文名称，保留诗中具体的香料意象。
- source_word: דּוֹדִי
  choice: 我的良人
  rationale: 在《雅歌》中指女子所爱的人；“良人”具有亲昵而庄重的诗歌色彩，又不额外强化性意味。
- source_word: לִי
  choice: 于我
  rationale: 表达说话者与良人的个人关系和主观感受；置于“于我，好似”中简洁而有诗意。
- source_word: בֵּין
  choice: 之间
  rationale: 保留原文明确、具体的空间关系。
- source_word: שָׁדַי
  choice: 我两乳
  rationale: 原文明确指女子的双乳；“两乳”准确呈现双数身体意象，不以“怀中”等委婉语弱化。
- source_word: יָלִין
  choice: 过夜
  rationale: 该动词常有住宿、留宿一夜之意；“过夜”保留这一时间意味，并维持良人与香囊意象之间的诗性叠合。
theological_decisions:
- issue: 动词主语是良人还是没药包
  choice: 正文依照阳性动词，以“良人”为语法上的主语，同时让没药包的比喻延续
  alternative: 把主语理解为没药包，译作“它……过夜”
  rationale: יָלִין 为阳性单数，可回指阳性的 דּוֹדִי“我的良人”，也与阳性的 צְרוֹר“小包”相合。中文正文不另加代词，保存二者有意交叠的诗性歧义。
translation_notes:
  register: 采用现代、凝练而庄重的抒情语言。“良人”承接《雅歌》的爱情诗语域；“两乳”忠实呈现身体意象，不作委婉化处理。正文避免明加“他”或“它”，以保存希伯来诗句中良人与没药包相互交叠的意象。
