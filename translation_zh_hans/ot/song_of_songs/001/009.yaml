  text: I compare you[a], my beloved, to my mare among Pharaoh’s chariots.
translation:
  language: zh_hans
  text: 我的爱人啊，我把你比作法老战车群中我的母马。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “我的母马”也可译作“一匹母马”。希伯来语原文带有第一人称单数词尾，但在这一比较句中，重点可能在母马的形象，而非强调所有关系。
    reason: lexical_alternative
lexical_decisions:
- source_word: לְסֻסָתִי
  choice: 我的母马
  rationale: סוּסָה是阴性单数名词，特指母马；其第一人称单数词尾按字面译为“我的”，既保留性别鲜明的意象，也忠实呈现原文形式。
- source_word: בְּרִכְבֵי פַרְעֹה
  choice: 法老战车群中
  rationale: רִכְבֵי为“战车”的复数构造形式；介词בְּ在此表达处于其中或与之相伴。“战车群中”自然呈现母马置身王室战车队的图景。
- source_word: דִּמִּיתִיךְ
  choice: 我把你比作
  rationale: 该词为דמה的强化词干完成式第一人称单数，带第二人称阴性单数后缀，意为“我将你比作”。汉语用“我把你比作”清楚而自然地表达诗中的明喻。
- source_word: רַעְיָתִי
  choice: 我的爱人
  rationale: 此词在《雅歌》中是男子对女子的亲密称呼。“我的爱人”兼具爱情语境所需的亲昵感与庄重诗意。
