  yaml_path: translation/ot/song_of_songs/001/003.yaml
  text: The fragrance of your oils is pleasing[a]; your name is oil poured out[b]; therefore young women love you.
translation:
  language: zh_hans
  text: 你膏油的香气悦人[a]；你的名是倾倒出来的膏油；因此，年轻女子[b]爱你。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为你膏油的香气美好。”希伯来文句法凝练，富有诗意。
    reason: alternative_reading
  - marker: b
    text: “年轻女子”所译的希伯来词也可译作“少女”；有些译本作“童女”，但该词在这里本身未必要求如此具体的含义。
    reason: lexical_alternative
lexical_decisions:
- source_word: לְרֵיחַ
  choice: ……的香气
  rationale: רֵיחַ指气味、香气；前缀לְ在这句高度凝练的诗句中按习语处理，不勉强译成独立介词。
- source_word: שְׁמָנֶיךָ / שֶׁמֶן
  choice: 你的膏油 / 膏油
  rationale: שֶׁמֶן本义为油；此处语境指带香气的油膏。“膏油”既保留具体意象，也维持前后复数与单数之间的词语呼应，避免直接释作抽象的“香水”。
- source_word: טוֹבִים
  choice: 悦人
  rationale: 该词意为“好、美好”；结合“香气”译作“悦人”，是现代汉语中自然的正面评价，同时保留诗句的赞美语气。
- source_word: תּוּרַק
  choice: 倾倒出来的
  rationale: 该使役被动形态表达“被倒出、被倾出”；此译保留膏油倾出并散发香气的鲜明图像。
- source_word: שְׁמֶךָ
  choice: 你的名
  rationale: 原文明确为“你的名”，所指可包含名声与此人的身份，但正文不将这一诗性隐喻解释性改写。
- source_word: עַל־כֵּן
  choice: 因此
  rationale: 该连接语表示原因所引出的结果；“因此”简洁地保留原句逻辑。
- source_word: עֲלָמוֹת
  choice: 年轻女子
  rationale: 该词指年轻、适婚年龄的女子，但本身不必然明确强调童贞；“年轻女子”准确而不过度限定。
- source_word: אֲהֵבוּךָ
  choice: 都爱你
  rationale: אָהַב意为“爱”；完成式在这里表达诗中的既成或概括性事实，现代汉语用现在时态自然呈现。“都”对应复数群体的整体陈述，并使句子顺畅。
