  register: 采用现代、庄重而易懂的诗歌语言。“膏油”贯穿前后两句，以保留希伯来文的词语呼应；第二句保留直接隐喻“你的名是……”，不把它解释成单纯的名声。脚注标记均置于其所说明的正文词句之后。
