revisions:
- from: 你的双颊因一排排饰物而秀美[a]，你的颈项因串珠而美丽[b]。
  to: 你的双颊配着饰物[a]，多么秀美；你的颈项配着成串的饰物[b]，多么美丽。
  rationale: 修订以“配着”表达原文饰物与双颊、颈项之间的装点关系，保留两行的赞美平行。前半句采用不预设具体形式的“饰物”，并在脚注说明“成排”的可能理解；后半句采用“成串的饰物”，避免将材质限定为珠子，同时保留串联意象。
