  yaml_path: translation/ot/song_of_songs/001/010.yaml
  text: Your cheeks are lovely with ornaments[b][a], your neck with strings of jewels.
translation:
  language: zh_hans
  text: 你的双颊配着饰物[a]，多么秀美；你的颈项配着成串的饰物[b]，多么美丽。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“成排的（饰物）”。希伯来语很可能指成排或成列的装饰，也可能指某种具体的饰物。
    reason: lexical_alternative
  - marker: b
    text: 或译：“珠串”或“项链”。希伯来语指穿成串的饰物。
    reason: lexical_alternative
lexical_decisions:
- source_word: נָאווּ
  choice: 秀美／美丽
  rationale: 该词表达美好、合宜；在赞美爱人外貌的诗歌语境中，用“秀美”和补足的“美丽”自然庄重，也保留平行句的赞美语气。
- source_word: לְחָיַיִךְ
  choice: 你的双颊
  rationale: לְחָיַיִךְ指脸颊或颌部；此处描写饰物衬托容貌，“双颊”最符合现代汉语习惯。
- source_word: בַּתֹּרִים
  choice: 因一排排饰物
  rationale: תֹּרִים在这里很可能指成排、成列的装饰；下半句的串珠及下一节的金银饰物支持这一理解。“一排排饰物”既交代排列意象，又避免误解为本词在别处可表示的“斑鸠”。
- source_word: צַוָּארֵךְ
  choice: 你的颈项
  rationale: 这是通常表示颈部的词；“颈项”较“脖子”更适合雅歌庄重的诗体。
- source_word: בַּחֲרוּזִים
  choice: 因串珠
  rationale: חֲרוּזִים指穿成串的珠子或饰物。“串珠”简洁保留串联排列的形象，同时不把材质或具体首饰类型说得过于确定。
theological_decisions: []
translation_notes:
  register: 采用现代、典雅而易懂的爱情诗语言。“因……而”表达饰物衬托双颊和颈项之美，并在中文中补出下半句隐含的谓语。脚注标记按其所解释的词语分别置于正文中。
