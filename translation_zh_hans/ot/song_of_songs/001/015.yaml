  yaml_path: translation/ot/song_of_songs/001/015.yaml
  text: Look[a], you are beautiful, my beloved; look, you are beautiful—your eyes are doves.
translation:
  language: zh_hans
  text: 看哪，你真美，我的爱人！看哪，你真美——你的眼睛是鸽子[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你的眼睛像鸽子。”希伯来文的意象表达十分凝练，直译为“你的眼睛是鸽子”。
    reason: 说明原文直接隐喻与汉语明喻译法之间的可能选择。
lexical_decisions:
- source_word: הִנָּךְ
  choice: 看哪，你
  rationale: 这是带第二人称阴性单数后缀的指示、感叹表达，用来唤起对方注意并加强赞叹。“看哪”保留其鲜明语气，也适合庄重的现代汉语诗歌。
- source_word: יָפָה
  choice: 美
  rationale: 该阴性形容词指外貌或整体上的美丽；“美”简洁自然，并能在重复句式中保持诗意。
- source_word: רַעְיָתִי
  choice: 我的爱人
  rationale: 本词在《雅歌》中是男子对女子的亲密称呼。“我的爱人”既表达爱情关系，也避免用过于古雅或带特定解释色彩的称谓。
- source_word: הִנָּךְ יָפָה
  choice: 看哪，你真美
  rationale: 保留原文两次重复的赞叹句式。“真”体现指示感叹词在语境中的强调作用，使现代汉语表达自然。
- source_word: עֵינַיִךְ
  choice: 你的眼睛
  rationale: 这是“眼睛”一词带第二人称阴性单数所属后缀，直译清楚准确。
- source_word: יוֹנִים
  choice: 是鸽子
  rationale: 原文以名词直接作谓语，凝练地说“你的眼睛是鸽子”。正文保留这一直接隐喻，不将其静默改写成明喻。
