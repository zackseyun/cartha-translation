base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/001/006.yaml
  text: Do not stare at me because I am dark[a], because the sun has scorched me. My mother’s sons were angry with me; they made me keeper of the vineyards[d][c][b], but my own vineyard I have not kept.
translation:
  language: zh_hans
  text: 不要因我黝黑[a]就盯着我看；是日头把我晒黑的[b]。我母亲的儿子们[c]向我发怒，叫我看守葡萄园；我自己的葡萄园[d]，我却没有看守。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “黝黑”也可译作“黑”。这里描述她因日晒而呈现的深色外观，并未说明族群身份。
    reason: lexical_alternative
  - marker: b
    text: 原文动词的确切含义有讨论；传统上也有较直译为“日头注视了我”的译法。按上下文，它可指日头的灼晒，使她肤色变深。
    reason: lexical_alternative
  - marker: c
    text: 也就是她的兄弟们；原文直译为“我母亲的儿子们”，可能带有刻意的疏离意味。
    reason: lexical_alternative
  - marker: d
    text: “我自己的葡萄园”很可能是隐喻，但原文没有明确说明它具体指她的身体、容貌、个人生活，还是别的事物。
    reason: cultural_note
lexical_decisions:
- source_word: אַל תִּרְאוּנִי
  choice: 不要盯着我看
  rationale: 字面为“不要看我”；结合说话者因外貌受到注目的语境，“盯着……看”自然地表达带有审视意味的注视，又不把语气强化为敌意。
- source_word: שְׁחַרְחֹרֶת
  choice: 皮肤黝黑
  rationale: 该形容词表示深色、发黑的外观；“皮肤黝黑”在现代汉语中自然，并结合下文日晒说明所指，同时避免加入族群身份。
- source_word: שֶׁשֱּׁזָפַתְנִי הַשָּׁמֶשׁ
  choice: 因为太阳把我晒黑了
  rationale: 罕见动词的具体语义存在争议，可理解为太阳“注视”她，也可按语境指日晒灼烤所造成的肤色变化。正文采用自然且符合上下文结果的“晒黑”，脚注保留较字面的另一种理解。
- source_word: בְּנֵי אִמִּי
  choice: 我母亲的儿子们
  rationale: 保留希伯来文特指“我母亲的儿子们”的表达，而不直接简化为“兄弟们”，从而保存可能带有疏离感的亲属称谓。
- source_word: נִחֲרוּ בִי
  choice: 向我发怒
  rationale: 该表达描写怒气燃起；“向我发怒”清楚、自然，也保留怒气针对说话者的方向。
- source_word: שָׂמֻנִי נֹטֵרָה אֶת־הַכְּרָמִים
  choice: 叫我看守葡萄园
  rationale: 女性分词 נֹטֵרָה 表示看守、守护者；“叫我看守”简洁地传达她被安排承担这项劳作。
- source_word: כַּרְמִי שֶׁלִּי
  choice: 我自己的葡萄园
  rationale: 双重所有表达带有强调意味，“我自己的”在汉语中自然体现这一强调。
- source_word: לֹא נָטָרְתִּי
  choice: 我却没有看守
  rationale: 继续用“看守”对应同一词根 נטר，使前后形成刻意对照，并不把葡萄园的隐喻具体解释为身体、容貌或贞洁。
theological_decisions:
- issue: “我自己的葡萄园”的隐喻所指
  choice: 正文保留葡萄园意象，不说明它具体指什么
  alternative: 将其明确解释为她的身体、容貌、个人生活或贞洁
  rationale: 希伯来诗句很可能具有隐喻意味，但没有明说所指；保留意象可维护原文的诗性含混与解释张力。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“盯着我看”表达受人审视的处境；“我母亲的儿子们”与“我自己的葡萄园”则刻意保留原文较突出的措辞和诗性张力。
