  text: My beloved put his hand through the opening[b][a], and my inward parts trembled for him.
translation:
  language: zh_hans
  text: 我的良人从门上的孔洞伸进手来[a]，我的内心便因他激荡[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “从门上的孔洞伸进”原文直译为“从那孔洞伸出（他的手）”。原文未明确说是门上的孔洞；结合上下文，这很可能指门上的开口。
    reason: lexical_alternative
  - marker: b
    text: “我的内心便因他激荡”也可译作“我的肺腑为他翻腾”或“我里面因他骚动”。希伯来文直指身体内部，以此描写深切的情感。
    reason: lexical_alternative
lexical_decisions:
- source_word: דּוֹדִי
  choice: 我的良人
  rationale: “良人”在《雅歌》中自然表达女子所爱的男子，兼具亲密和诗意，又不额外强化现代“情人”一词可能带有的婚外意味。
- source_word: שָׁלַח יָדוֹ
  choice: 伸进手来
  rationale: שׁלח 与“手”连用表示伸出或探入；结合门上孔洞的场景，译作“伸进手来”既自然，又保留动作方向。
- source_word: מִן הַחֹר
  choice: 从门孔
  rationale: 原文直译为“从那孔洞”，上下文表明是门上的孔或开口；正文补出“门”以便现代读者理解，并在脚注说明原文较为简略。
- source_word: וּמֵעַי
  choice: 我里面
  rationale: מֵעִים 本指内脏、腹中，转指人深处的感受；“我里面”保留身体性的内在意象，同时避免“心”过度抽象化，也避免“内脏”在中文诗歌中显得生硬。
- source_word: הָמוּ
  choice: 翻腾
  rationale: 该动词表达喧腾、激荡或骚动；“翻腾”能呈现强烈、具身体感的内在情绪，并不把感情单一限定为颤抖或思念。
- source_word: עָלָיו
  choice: 为他
  rationale: 介词在此表达由良人引发并指向他的情感；“为他”简洁自然，同时保留可能包含“因他”或“向着他”的语义张力。
