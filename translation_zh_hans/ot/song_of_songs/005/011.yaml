  language: zh_hans
  text: 他的头是纯金[a]；他的发绺卷曲[b]，黑如乌鸦。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“上好的黄金”；希伯来文连用两个表示黄金的词，以加强语气。
    reason: lexical_alternative
  - marker: b
    text: 或译“呈波浪状”或“卷曲的”；这里的希伯来词罕见，且富有诗意。
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹאשׁוֹ
  choice: 他的头
  rationale: רֹאשׁ在这段对良人身体的诗意描写中指具体的“头”，宜直接译出。
- source_word: כֶּתֶם פָּז
  choice: 如精金
  rationale: 两个与黄金有关的词连用，强调黄金的珍贵与上乘；“精金”简洁而有诗意，并保留比喻的力度。
- source_word: קְוּצּוֹתָיו
  choice: 他的发绺
  rationale: 该词指一绺绺垂下或卷曲的头发；“发绺”既准确，又符合现代汉语的诗歌语体。
- source_word: תַּלְתַּלִּים
  choice: 层层卷曲
  rationale: 这是罕见的诗歌用词，大概描写头发呈波浪或卷曲状；“层层卷曲”保留其形态感，同时不把罕见词的含义限定得过细。
- source_word: שְׁחֹרוֹת
  choice: 黑
  rationale: 该形容词直接表示黑色，译作“黑”最简明准确。
- source_word: כָּעוֹרֵב
  choice: 如乌鸦
  rationale: 介词כ构成明喻，以乌鸦呈现浓黑的色泽；“如乌鸦”简洁且保持原诗意象。
