base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/005/002.yaml
  text: 'I was asleep[a], but my heart was awake. The sound of my beloved knocking: “Open to me, my sister, my darling, my dove, my blameless one, for my head is drenched with dew[b], my locks with the drops of the night.”'
translation:
  language: zh_hans
  text: '我睡着了，心却醒着。听，是我良人的声音[a]！他正在敲门：


    “给我开门吧，


    我的姊妹，我的佳偶，


    我的鸽子，我纯全的爱人[b]！


    因为我的头上满了露水，


    我的发绺沾满夜间的水滴。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “声音”或译“声响”。希伯来语 קוֹל 在这里既可指良人的声音，也可泛指听见的声响。
    reason: lexical_alternative
  - marker: b
    text: “纯全的爱人”或译“完全的爱人”“无瑕的爱人”。希伯来语 תַמָּתִי 可表达完整、纯真或纯洁。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְשֵׁנָה
  choice: 睡着了
  rationale: 该阴性单数形式作谓语；“睡着了”自然地交代场景，也与下文“醒着”形成鲜明对照。
- source_word: לִבִּי עֵר
  choice: 心却醒着
  rationale: 保留希伯来文“心”的意象与睡眠中内在清醒的诗性张力；“却”明确呈现转折关系。
- source_word: קוֹל דּוֹדִי
  choice: 我良人的声音
  rationale: קוֹל既可指“声音”，也可泛指“声响”；正文采用自然且符合随后引语的“声音”，脚注保留另一可能。
- source_word: דוֹפֵק
  choice: 正在敲门
  rationale: 分词表达持续进行的动作；宾语“门”虽未明说，却由“给我开门”清楚暗示，汉语中补出可使表达自然。
- source_word: פִּתְחִי לִי
  choice: 给我开门吧
  rationale: 准确传达命令式及לִי所表达的受益或趋向关系；语气词“吧”体现亲密恳求而非生硬命令。
- source_word: אֲחֹתִי
  choice: 我的妹妹
  rationale: 直译这一《雅歌》中的亲昵称呼，保留原文独特意象，不将其解释为实际血缘关系。
- source_word: רַעְיָתִי
  choice: 我的佳偶
  rationale: “佳偶”在现代中文中仍是可懂且庄重的爱侣称呼，适合诗歌语域。
- source_word: יוֹנָתִי
  choice: 我的鸽子
  rationale: 保留原文清楚而反复出现的鸽子隐喻。
- source_word: תַמָּתִי
  choice: 我纯全的爱人
  rationale: תַמָּה可表达完整、纯真或无瑕；“纯全”兼顾完整与纯洁的语义，“爱人”使该形容词的名词化称呼在现代汉语中自然。
- source_word: שֶׁרֹּאשִׁי נִמְלָא טָל
  choice: 因为我的头上满了露水
  rationale: 保留“充满”这一原文表达，同时按汉语习惯以“头上”描写露水落在头发与头部。
- source_word: קְוֻּצּוֹתַי
  choice: 我的发绺
  rationale: 该词指一绺绺头发；“发绺”比笼统的“头发”更贴近原文，也保持诗意。
- source_word: רְסִיסֵי לָיְלָה
  choice: 夜间的水滴
  rationale: 较为直译地保留“夜之滴”的开放意象，并与上一行的露水构成平行。
