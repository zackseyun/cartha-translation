  yaml_path: translation/ot/song_of_songs/005/010.yaml
  text: My beloved is radiant and ruddy[a], distinguished among ten thousand.
translation:
  language: zh_hans
  text: 我的良人光彩照人，面色红润，在万人中卓然出众。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“在万人中格外醒目”；较直译为“在万人中如旗帜般显眼”。
    reason: lexical_alternative
lexical_decisions:
- source_word: דּוֹדִי
  choice: 我的良人
  rationale: 在《雅歌》的爱情语境中，דּוֹדִי指女子所爱的人。“我的良人”自然、庄重，也与本书反复出现的称谓相称。
- source_word: צַח
  choice: 光彩照人
  rationale: צַח含明亮、清朗之意；此处描写外貌，“光彩照人”既传达可见的明亮光采，也符合现代汉语诗性表达。
- source_word: וְאָדוֹם
  choice: 面色红润
  rationale: אָדוֹם基本义为“红”；用于人的外貌时，“面色红润”比直译“红”更自然，并保留健康红润的视觉形象。
- source_word: דָּגוּל
  choice: 卓然出众
  rationale: 该词可能表示被标识出来、显眼或杰出。“卓然出众”自然地表达他从众人中醒目突出的意思，同时不过度强化为绝对至高。
- source_word: מֵרְבָבָה
  choice: 在万人中
  rationale: 介词מִן在此表达从广大群体中比较、辨认之意；“在万人中”简洁地保留诗句所描绘的庞大人群。
theological_decisions: []
