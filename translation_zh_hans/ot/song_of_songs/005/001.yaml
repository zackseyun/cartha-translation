  text: בָּ֣אתִי לְ/גַנִּ/י֮ אֲחֹתִ֣/י כַלָּה֒ אָרִ֤יתִי מוֹרִ/י֙ עִם בְּשָׂמִ֔/י אָכַ֤לְתִּי יַעְרִ/י֙ עִם דִּבְשִׁ֔/י שָׁתִ֥יתִי יֵינִ֖/י עִם חֲלָבִ֑/י אִכְל֣וּ רֵעִ֔ים שְׁת֥וּ וְ/שִׁכְר֖וּ דּוֹדִֽים־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/005/001.yaml
  text: I have come into my garden[a], my sister, my bride; I have gathered my myrrh with my spice. I have eaten my honeycomb with my honey; I have drunk my wine with my milk. Eat, friends; drink, and be drunk, beloved ones.
translation:
  language: zh_hans
  text: 我进了我的园子，我的妹妹，我的新娘；我采了我的没药和香料，吃了我带蜜的蜂巢和蜂蜜，喝了我的酒和奶。朋友们，请吃！请喝，喝得酣醉吧，亲爱的人们[a]！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “亲爱的人们”或译“相爱的人们”。希伯来语 דּוֹדִים 也可指“爱情、爱意”；末句也可理解为“请喝，因爱而陶醉吧”。
    reason: alternative_reading
lexical_decisions:
- source_word: בָּאתִי לְגַנִּי
  choice: 我进了我的园子
  rationale: בוא 的完成式第一人称单数配合表示趋向的 לְ，表达已经进入园中；汉语以“进了”自然呈现完成的动作。
- source_word: אֲחֹתִי כַלָּה
  choice: 我的妹妹，我的新娘
  rationale: 保留两个并列的亲昵称呼；“妹妹”在此是雅歌中的爱称，不将二者合并或寓意化。
- source_word: אָרִיתִי מוֹרִי עִם בְּשָׂמִי
  choice: 我采了我的没药和香料
  rationale: ארה 表示采集；מוֹר 为没药，בְּשָׂם 为芳香料。“和”自然表达 עִם 在此列举相伴之物的关系。
- source_word: אָכַלְתִּי יַעְרִי עִם דִּבְשִׁי
  choice: 吃了我的蜂房和蜂蜜
  rationale: יַעַר 在本语境指含蜜的蜂房或蜂巢；与“蜂蜜”并列，保留原文丰盛而具体的感官意象。
- source_word: שָׁתִיתִי יֵינִי עִם חֲלָבִי
  choice: 喝了我的酒和奶
  rationale: 直译酒与奶的组合，不将其解释为特殊饮品或象征。
- source_word: אִכְלוּ רֵעִים
  choice: 朋友们，请吃
  rationale: רֵעִים 是复数称呼“朋友们”；命令式以“请”呈现热情邀请，符合现代汉语宴饮语境。
- source_word: שְׁתוּ וְשִׁכְרוּ דּוֹדִים
  choice: 请喝，尽情畅饮吧，亲爱的人们
  rationale: שׁכר 的命令式本义为喝至酣醉；“尽情畅饮”保留强烈程度而更符合庄重自然的汉语。正文将 דּוֹדִים 作为呼语，脚注保留其可能指“爱情”的另一理解。
theological_decisions:
- issue: 末句 דּוֹדִים 的句法和词义
  choice: 作复数呼语：“亲爱的人们”
  alternative: 作“爱情、爱意”，理解为“因爱而陶醉”或“尽享爱情”
  rationale: 无元音歧义之外，דּוֹדִים 在雅歌中既可指爱情、爱意，也可在此被理解为对相爱之人的称呼。正文采用与前一呼语“朋友们”平行的呼语读法，同时用脚注保存抽象名词读法，避免消除原文的真实歧义。
translation_notes:
  register: 采用现代、庄重而富有诗意的普通话。保留“园子、没药、蜂房、酒和奶”等具体感官意象；连续完成动作以简洁的“了”串联。末尾转为宴饮式邀请，用感叹语气呈现诗歌的热烈感。
