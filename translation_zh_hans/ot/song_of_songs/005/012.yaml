  yaml_path: translation/ot/song_of_songs/005/012.yaml
  text: His eyes are like doves beside streams of water[a], bathed in milk, sitting by fullness.
translation:
  language: zh_hans
  text: 他的眼睛如溪水旁的鸽子，在奶中沐浴，安坐在盈满之旁[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 末句希伯来文含义不确定。或可理解为“镶嵌得恰到好处”，也可能是说鸽子安坐在满池旁。
    reason: 保留疑难希伯来语短语 עַל מִלֵּאת 的主要解释可能，避免正文过度确定其所指。
lexical_decisions:
- source_word: עֵינָיו
  choice: 他的眼睛
  rationale: עַיִן在此有第三人称阳性单数属格后缀；结合身体描写和鸽子的比喻，应取“眼睛”，而非该词在其他语境中可有的“泉眼”义。
- source_word: כְּיוֹנִים
  choice: 如……鸽子
  rationale: 比较介词כְּ־引出明喻；“如……鸽子”自然、庄重，并保留原诗意象。
- source_word: עַל אֲפִיקֵי מָיִם
  choice: 溪水旁
  rationale: אֲפִיקִים可指水道、河槽或溪流；此处译作“溪水旁”，既符合עַל的邻近用法，也使鸽子的场景清楚自然。
- source_word: רֹחֲצוֹת בֶּחָלָב
  choice: 在奶中沐浴
  rationale: 阴性复数分词רֹחֲצוֹת在形式上呼应“鸽子”，可表示洗浴或被洗净；“在奶中沐浴”保留进行性的诗歌画面及בְּ的范围意义。
- source_word: יֹשְׁבוֹת עַל מִלֵּאת
  choice: 安坐在盈满之处
  rationale: יֹשְׁבוֹת保留“坐着、栖居”的具体意象；מִלֵּאת是疑难词，“盈满之处”尽量保存其“满、充盈”意味，而不在正文中武断确定为眼眶、镶座或满池。
theological_decisions: []
translation_notes:
  register: 采用现代标准普通话的简体中文，保持雅歌中具体、柔美而含蓄的诗歌语体。“奶”比“乳汁”更贴近日常语言，也保留原文鲜明意象；“盈满之处”略带诗性，以承载原文末语的真实歧义。
