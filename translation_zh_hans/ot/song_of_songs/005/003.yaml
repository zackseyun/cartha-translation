  yaml_path: translation/ot/song_of_songs/005/003.yaml
  text: I have taken off my tunic—how can I put it on again? I have washed my feet—how can I soil them?[a][b]
translation:
  language: zh_hans
  text: 我已经脱了衣裳，怎能再穿上呢？[a] 我已经洗了脚，怎能再弄脏呢？[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “衣裳”或译“衣服”。
    reason: lexical_alternative
  - marker: b
    text: “弄脏”或译“沾污”。
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּשַׁטְתִּי
  choice: 我已经脱了
  rationale: 该动词表示脱去或除下衣物；“脱了”简洁自然，符合夜间居家的语境。
- source_word: כֻּתָּנְתִּי
  choice: 内衣
  rationale: כֻּתֹּנֶת 指贴身穿着的基本衣物；“内衣”在现代汉语中能自然表达其贴身衣物性质，又避免把它误作外袍。
- source_word: אֵיכָכָה
  choice: 怎能
  rationale: 此疑问词在两处表达不愿重新做某事的实际推辞；“怎能”既保留问句形式，也传达这种语气。
- source_word: אֶלְבָּשֶׁנָּה
  choice: 再穿上
  rationale: 动词意为穿上，阴性单数后缀回指 כֻּתָּנְתִּי；“再”自然显明这是对刚才脱衣动作的逆转。
- source_word: רָחַצְתִּי
  choice: 我已经洗了
  rationale: 完成式表示已经完成且与当前情形有关的动作；“已经……了”准确呈现这一状态。
- source_word: רַגְלַי
  choice: 我的脚
  rationale: 该形式指双脚；现代汉语通常以“脚”统称双脚，不必机械添加数量词。
- source_word: אֲטַנְּפֵם
  choice: 弄脏
  rationale: טנף 的加强词干在此指使双脚沾污；“弄脏”具体、自然，不加入“玷污”等可能带出的宗教或道德含义。
theological_decisions:
- issue: 女子话语的解释
  choice: 按字面译作夜间居家的推辞，不在正文中加入性隐喻。
  alternative: 把脱衣和洗脚主要解释为情色隐喻。
  rationale: 本节直接措辞具体而日常。雅歌整体可能容许多层文学理解，但翻译应保存眼前的字面场景，不把解释性的隐喻直接写入经文。
translation_notes:
  register: 采用现代、自然而端庄的普通话。“怎能……呢”保留希伯来文两句平行反问及推辞语气；正文避免古奥措辞，也不把具体的居家动作过度属灵化或情色化。
