source:
  edition: WLC
  text: שׁוֹקָי/ו֙ עַמּ֣וּדֵי שֵׁ֔שׁ מְיֻסָּדִ֖ים עַל אַדְנֵי פָ֑ז מַרְאֵ֨/הוּ֙ כַּ/לְּבָנ֔וֹן בָּח֖וּר כָּ/אֲרָזִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/005/015.yaml
  text: His legs are pillars of marble[a], set on bases of fine gold. His appearance is like Lebanon[b], choice as the cedars.
translation:
  language: zh_hans
  text: 他的双腿如大理石柱[a]，立在精金座上；他的仪容如黎巴嫩[b]，出众如香柏树。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “大理石”或作“雪花石”；希伯来语שֵׁשׁ可能泛指一种上等的白色石材，未必特指现代所说的大理石。
    reason: lexical_alternative
  - marker: b
    text: “他的仪容如黎巴嫩，出众如香柏树”也可理解为“他的仪容如黎巴嫩，卓然如香柏树”。这里的“出众”所译的希伯来语בָּחוּר很可能强调精选、卓越，而不是“青年”。
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוֹקָיו
  choice: 他的双腿
  rationale: שׁוֹק可指腿部或大腿；在以柱子作比的身体描写中，“双腿”自然、清楚，也不把所指范围收得过窄。
- source_word: עַמּוּדֵי שֵׁשׁ
  choice: 如大理石柱
  rationale: עַמּוּדֵי意为“柱子”；שֵׁשׁ在此指上等白色石材，传统上常理解为大理石。“如”使汉语诗句流畅，同时保留明显的比喻关系。
- source_word: מְיֻסָּדִים עַל אַדְנֵי פָז
  choice: 立在精金座上
  rationale: מְיֻסָּדִים表示被安置、奠立；אַדְנֵי是承托柱子的座或基座；פָז指优质精炼的金。“立在精金座上”简洁呈现建筑意象和稳固感。
- source_word: מַרְאֵהוּ
  choice: 他的仪容
  rationale: מַרְאֶה指可见的外貌、形貌或整体观感。“仪容”兼顾外在形貌与庄严气度，适合本诗的高雅语域。
- source_word: כַּלְּבָנוֹן
  choice: 如黎巴嫩
  rationale: 保留原文以黎巴嫩的壮美和雄伟作比的地名意象，不增添原文未明说的解释。
- source_word: בָּחוּר כָּאֲרָזִים
  choice: 出众如香柏树
  rationale: בָּחוּר在此更可能表达经拣选而卓越、出众，而不是名词“青年”；“出众”自然传达优选卓越之意，כָּאֲרָזִים则直译为“如香柏树”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。以分号连接两组平行意象；保留“大理石柱—精金座”和“黎巴嫩—香柏树”的宏伟画面，不把这些意象作寓意化解释。
