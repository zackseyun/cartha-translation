base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/005/007.yaml
  text: The watchmen who go about the city found me[a]; they struck me, they wounded me[b]; the keepers of the walls took my cloak from me.
translation:
  language: zh_hans
  text: 城中巡行[a]的守望者找到了我；他们打了我，伤了我；看守城墙的人从我身上拿走了我的披巾[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “城中巡行”也可译作“在城中四处走动”或“在城中巡逻”。希伯来语分词意为“来回走动、环行”；在本句中，很可能指守望者巡查城内。
    reason: lexical_alternative
  - marker: b
    text: “披巾”也可译作“披肩”或“面纱”。希伯来语 רְדִיד 指披在外面的包裹或遮盖衣物，具体样式不能确定。
    reason: lexical_alternative
lexical_decisions:
- source_word: מְצָאֻנִי
  choice: 找到了我
  rationale: מצא在此直译为“找到”；结合女子在城中寻找的语境，“找到了我”自然、直接。
- source_word: הַשֹּׁמְרִים
  choice: 守望者
  rationale: שמר的分词名词指负责看守的人；“守望者”符合城中夜间守卫的场景，也保留与句末“守城墙的人”的词根呼应。
- source_word: הַסֹּבְבִים בָּעִיר
  choice: 巡行城中的
  rationale: סבב本义为“环绕、四处走动”；“巡行城中”既保留分词的持续动作，也符合守望者巡查城市的语境，而不把它过度限定为现代警务意义的“巡逻”。
- source_word: הִכּוּנִי
  choice: 他们打我
  rationale: נכה泛指击打；“打我”是自然、直接的现代汉语，暴力造成的后果由下一动词“伤了我”进一步说明。
- source_word: פְצָעוּנִי
  choice: 伤了我
  rationale: פצע意为使人受伤；“伤了我”与前面的“打我”形成递进，并保留原文简短有力的并列结构。
- source_word: נָשְׂאוּ אֶת רְדִידִי מֵעָלַי
  choice: 从我身上夺去了我的披巾
  rationale: נשא与מֵעָלַי连用，表示从她身上拿走或揭去；רְדִידִי指披在外面的遮盖物。“披巾”不武断限定为遮脸的面纱；“夺去”则自然传达守卫强行取走衣物的语境。
- source_word: שֹׁמְרֵי הַחֹמוֹת
  choice: 守城墙的人
  rationale: 该结构指负责守卫城墙的人。“守城墙的人”清楚自然，并与前面的“守望者”保持语义呼应，避免生硬重复。
