base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/005/016.yaml
  text: His mouth is sweetness itself[a], and all of him is desirable. This is my beloved, and this is my friend[b], O daughters of Jerusalem.
translation:
  language: zh_hans
  text: 他的口甘甜无比[a]；他浑身都令人爱慕[b]。耶路撒冷的女子们，这就是我的良人，这就是我的朋友。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“他的上腭甘甜无比”或“他的滋味甘甜无比”。原词本义指“上腭”，在此诗歌语境中可借指口或味觉。
    reason: lexical_alternative
  - marker: b
    text: 或译“他全然可爱”或“他全然可喜爱”。原文使用带加强意味的复数形式，表达他整个人令人渴慕、喜爱。
    reason: lexical_alternative
lexical_decisions:
- source_word: חִכּוֹ
  choice: 他的口
  rationale: 该词本义是“上腭、口腔”，在本诗语境中可借代口及其亲吻或言语；译作“口”既保留身体意象，也符合现代汉语表达。
- source_word: מַמְתַקִּים
  choice: 甘甜无比
  rationale: 原文为复数形式，在此具有抽象或加强意味；“甘甜无比”自然传达极度甘甜的诗意，同时避免生硬直译为“甘甜之物”。
- source_word: וְכֻלּוֹ
  choice: 他全然
  rationale: 直译为“他的全部”；“他全然”保留对整个人的概括，又能与下文谓语自然衔接。
- source_word: מַחֲמַדִּים
  choice: 可爱
  rationale: 该词表示令人喜爱、渴慕或珍爱的事物，复数在此很可能表达抽象或加强意义；“可爱”采用现代汉语中“令人爱慕”的较宽含义，不把它局限为外貌俊美。
- source_word: זֶה
  choice: 这就是
  rationale: 指向前文所描绘的男子，并带有强调语气；“这就是”自然保留这一指示和总结作用。
- source_word: דּוֹדִי
  choice: 我的良人
  rationale: 这是《雅歌》中女子对所爱男子的惯用称呼；“良人”保留诗歌体和亲密关系，又不额外强化现代汉语“情人”可能带有的婚外意味。
- source_word: וְזֶה
  choice: 这就是
  rationale: 重复原文的指示表达，保留平行结构与强调。
- source_word: רֵעִי
  choice: 我的朋友
  rationale: 该词可指朋友、同伴；“我的朋友”直接呈现爱情之外的陪伴关系，并保留与“我的良人”的并列张力。
- source_word: בְּנוֹת יְרוּשָׁלִָם
  choice: 耶路撒冷的女子们
  rationale: 字面为“耶路撒冷的女儿们”，但此处是对城中女子群体的称呼；译作“女子们”更符合现代标准汉语，同时保留群体称谓。
theological_decisions:
- issue: 是否将 מַחֲמַדִּים 作弥赛亚式或敬虔传统式解读
  choice: 按爱情诗的直接语境译为“可爱”
  alternative: 译作带有传统敬虔共鸣的“全然美丽”，或将该词视作称号
  rationale: 本节是女子赞美自己的良人。希伯来文本本身并未要求称号化或弥赛亚式理解，因此译文不引入后来的神学联想。
translation_notes:
  register: 采用现代、庄重而富有诗意的简体中文。“甘甜无比”传达加强复数的诗意力度；“良人”保留《雅歌》的文学语域，“朋友”则按原文直译，呈现爱慕与陪伴并列的关系。所有脚注标记均已置于正文相应位置。
