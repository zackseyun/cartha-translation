  yaml_path: translation/ot/song_of_songs/005/009.yaml
  text: What is your beloved more than another beloved[a], most beautiful among women? What is your beloved more than another beloved[b], that you have made us swear thus?
translation:
  language: zh_hans
  text: “你的爱人比别人的爱人强在哪里，女子中最美丽的啊？你的爱人比别人的爱人强在哪里，竟使我们这样起誓？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַה דּוֹדֵךְ מִדּוֹד
  choice: 你心爱的人比别人的心上人强在哪里
  rationale: מַה在比较结构中询问独特或优越之处；מִן表示比较。中文用“强在哪里”自然传达“有何胜过”，同时以“心爱的人／心上人”保留דּוֹד的爱情语境和原文重复。
- source_word: דּוֹדֵךְ
  choice: 你心爱的人
  rationale: דּוֹד在《雅歌》中指女子所爱的男子。“心爱的人”是现代、庄重且易懂的表达，也不把关系具体限定为配偶。
- source_word: הַיָּפָה בַּנָּשִׁים
  choice: 你这女子中最美丽的
  rationale: 该短语是对女子的直接称呼；形容词与ב加复数名词在此表达群体中的最高程度。此译保留称呼语气及诗体色彩。
- source_word: שֶׁכָּכָה
  choice: 这样
  rationale: 该词表示方式或程度。“这样”在现代汉语中自然，也保留对她前述郑重嘱咐之方式或强度的指向。
- source_word: הִשְׁבַּעְתָּנוּ
  choice: 使你……叫我们起誓
  rationale: שבע的使役形表示使某人起誓或郑重嘱咐。正文直译使役含义；脚注说明可理解为“郑重嘱咐”。
theological_decisions:
- issue: 是否将“心爱的人”解释为特定神学象征
  choice: 保留为诗中女子所爱的人
  alternative: 明示为神、弥赛亚或教会等象征
  rationale: 本节原文是爱情诗中的对话，本身未明确指定寓意对象；译文不引入宗派性或解释性的象征认定。
translation_notes:
  register: 采用现代标准汉语，保持爱情诗对话的自然与庄重。以“强在哪里”表达希伯来语比较问句；两次重复完整保留原文的追问和平行结构。称呼“你这女子中最美丽的”略带诗意，但仍为普通读者所能理解。
