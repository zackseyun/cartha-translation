base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/005/014.yaml
  text: His hands are rods of gold[a], set with beryl; his body is polished ivory[c][b], covered with sapphires.
translation:
  language: zh_hans
  text: 他的双手如金柱[a]，镶着绿柱石[b]；他的腹部[c]如光润的象牙，覆着蓝宝石[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“金环”或“金制圆柱”；希伯来语所表达的是圆形或圆柱状的金质物件，具体形状不能确定。
    reason: lexical_alternative
  - marker: b
    text: 或译“黄玉”“贵橄榄石”。希伯来语 תַּרְשִׁישׁ 所指的宝石种类不能确定。
    reason: lexical_alternative
  - marker: c
    text: 希伯来语也可指“肚腹”“内脏”或“内在深处”；这里按身体描写的语境译为“腹部”。
    reason: lexical_alternative
  - marker: d
    text: 传统译作“蓝宝石”；古代 סַפִּיר 也可能指青金石等蓝色宝石。
    reason: historical_context
lexical_decisions:
- source_word: יָדָיו
  choice: 他的双手
  rationale: יָד通常指“手”，有时也可涵盖手臂；本节逐一描写身体部位，直译为“双手”最为具体自然。
- source_word: גְּלִילֵי זָהָב
  choice: 如金柱
  rationale: גְּלִילִים指圆形、滚圆或圆柱状之物。“金柱”在汉语中能简洁呈现修长、圆润的金质形象；“金环”等理解则收入脚注，以保留原词的形状歧义。
- source_word: מְמֻלָּאִים בַּתַּרְשִׁישׁ
  choice: 镶着绿柱石
  rationale: מְמֻלָּאִים字面为“装满”，在金饰语境中自然表达为“镶着”。תַּרְשִׁישׁ所指宝石不能确定；正文采用常见对应“绿柱石”，并以脚注保存其他可能。
- source_word: מֵעָיו
  choice: 他的腹部
  rationale: מֵעֶה可指腹部、内脏或内在深处；在这段身体赞美诗中，具体的身体意义最合语境。“腹部”比“内脏”自然庄重，又不把范围扩展成笼统的“身体”。
- source_word: עֶשֶׁת שֵׁן
  choice: 如光润的象牙
  rationale: 该短语描绘经过加工、平滑光洁的象牙。“光润的象牙”保留材质与精工所产生的视觉和触觉美感，同时避免过度确定其具体形制。
- source_word: מְעֻלֶּפֶת סַפִּירִים
  choice: 覆着蓝宝石
  rationale: 分词可表示包裹、覆盖或镶饰；“覆着”贴近其基本图像，并保持诗句简洁。סַפִּירִים传统译作“蓝宝石”，古代所指矿石则未必等同现代蓝宝石。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而可朗读的汉语，保留原诗以金饰、象牙和宝石赞美身体的浓艳意象。句式维持两组平行结构；对宝石种类、金质物件的形状及身体部位的词义范围，均不在正文中作过度断定，而以脚注呈现真实歧义。
