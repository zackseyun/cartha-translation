  rationale: 修订仅处理中文搭配及难句的词义范围：以“高起的香料畦”延续前句的园圃意象，同时用脚注保留“塔”与“香料堆”等可行理解；将末句调整为更自然的现代汉语，仍保留没药滴落且流淌的诗歌画面。
