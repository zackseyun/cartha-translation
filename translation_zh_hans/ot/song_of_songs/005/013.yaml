base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/005/013.yaml
  text: His cheeks are like beds of spice[a], mounds of perfumes; his lips are lilies, dripping flowing myrrh.
translation:
  language: zh_hans
  text: 他的两腮如香料畦，如高起的香料畦[a]；他的嘴唇如百合花，滴着流淌的没药。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本短语的希伯来文意象较难确定；也可译作“香料的塔”或“调和香料堆”。它可能指高起的香草畦或成堆的芳香植物，并非一定指字面意义的塔。
    reason: 保留 מִגְדְּלוֹת מֶרְקָחִים 的词义和意象不确定性。
lexical_decisions:
- source_word: לְחָיָו
  choice: 他的两腮
  rationale: 该复数形式带第三人称阳性单数后缀，指脸的两侧；“两腮”自然、具体，适合此处描写爱人容貌的诗歌语境。
- source_word: כַּעֲרוּגַת הַבֹּשֶׂם
  choice: 如香料花畦
  rationale: עֲרוּגָה 指园圃中划分出的畦或种植床，הַבֹּשֶׂם 指香料或芳香植物；“香料花畦”保留栽培植物的园圃意象。
- source_word: מִגְדְּלוֹת מֶרְקָחִים
  choice: 像芳香膏的高垄
  rationale: 此短语意象难解。מִגְדְּלוֹת 可表达高起、塔状之物，מֶרְקָחִים 指调制的香料或芳香膏；“高垄”与前面的花畦相连，也保留其隆起感，避免在中文中造成脸颊上有字面“香塔”的突兀误解。异译见脚注。
- source_word: שִׂפְתוֹתָיו
  choice: 他的嘴唇
  rationale: 直接对应带第三人称阳性单数后缀的复数名词，现代汉语表达自然。
- source_word: שׁוֹשַׁנִּים
  choice: 百合花
  rationale: 传统上译作“百合花”；具体植物品种虽不确定，此译能保留广为人知的圣经诗歌意象。
- source_word: נֹטְפוֹת
  choice: 滴下
  rationale: 分词描写持续滴落或缓缓流出的动作；“滴下”简洁而具动态感。
- source_word: מוֹר
  choice: 没药
  rationale: 这是该芳香树脂在现代中文圣经及一般汉语中的标准名称。
- source_word: עֹבֵר
  choice: 流动的
  rationale: 在此修饰没药，可能指液态、自由流淌的没药；“流动的”既保留动态感，也不把多义词机械译为难懂的“经过”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而可朗读的普通话诗歌语体。“花畦—高垄”维持园圃意象的连贯，“滴下流动的没药”则尽量保留原文叠加的动作与质感。
