base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/005/005.yaml
  text: I arose to open to my beloved[a], and my hands dripped with myrrh, my fingers with flowing myrrh[b], on the handles of the bolt.
translation:
  language: zh_hans
  text: 我起来，给我的爱人开门；我的双手滴着没药，我的手指沾着流动的没药[a]，没药流过门闩的把手[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “流动的没药”也可译作“液态的没药”或“流淌的没药”。
    reason: lexical_alternative
  - marker: b
    text: “门闩的把手”也可译作“门锁的把手”或“门闩”。
    reason: lexical_alternative
lexical_decisions:
- source_word: קַמְתִּי אֲנִי
  choice: 我起来
  rationale: קום的第一人称单数完成式带显式代词，具有强调作用；“我起来”自然简洁，并保留第一人称的突出意味。
- source_word: לִפְתֹּחַ לְדוֹדִי
  choice: 给我的爱人开门
  rationale: פתח意为“打开”，语境所指是开门；דּוֹדִי在《雅歌》中指女子所爱的人。“给我的爱人开门”符合现代汉语习惯。
- source_word: יָדַי נָטְפוּ מוֹר
  choice: 我的双手滴着没药
  rationale: נטף表示“滴下、滴落”；此译保留没药滴落的感官意象。
- source_word: אֶצְבְּעֹתַי מוֹר עֹבֵר
  choice: 我的手指沾满流动的没药
  rationale: אֶצְבְּעֹתַי是“我的手指”；עֹבֵר字面有“流过、流动”之意。“沾满”使省略谓语的希伯来语并列结构在中文中自然，同时“流动的没药”保留原文动态意象及其一定的不确定性。
- source_word: עַל כַּפּוֹת הַמַּנְעוּל
  choice: 滴在门闩的把手上
  rationale: עַל表示位置或接触；כַּפּוֹת在门具语境中可指供手抓握的把手；מַנְעוּל指锁闭装置，译作“门闩”较符合古代门具情境。补出“滴”承接前句动词，使中文关系清楚。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而富有诗意的普通话。“爱人”贴合《雅歌》的恋爱语境；“没药”“门闩”保留古代物质文化色彩。译文不解释没药从何而来，以保存原文的诗性含混。
