base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/005/008.yaml
  text: 'I adjure you[a], daughters of Jerusalem: if you find my beloved, what will you tell him? That I am sick with love.'
translation:
  language: zh_hans
  text: 耶路撒冷的女子啊，我郑重嘱咐你们[a]：如果你们遇见我的良人，要告诉他什么呢？就说我因爱成病。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我叫你们起誓。”
    reason: 词义与语用选择：希伯来语使役形可直指使对方起誓，也可在此惯用语中表达郑重嘱咐。
lexical_decisions:
- source_word: הִשְׁבַּעְתִּי אֶתְכֶם
  choice: 我郑重嘱咐你们
  rationale: 该使役形在此表示使人起誓或严肃嘱托。“郑重嘱咐”在现代汉语中自然、庄重，也保留说话者急切而严肃的语气；严格说也可译作“我叫你们起誓”。
- source_word: בְּנוֹת יְרוּשָׁלִָם
  choice: 耶路撒冷的女子
  rationale: 保留本书中这一惯用呼语的字面意象，同时“女子”比“女儿”更自然地表达所呼唤的女性群体。
- source_word: אִם תִּמְצְאוּ
  choice: 如果你们遇见
  rationale: אִם保留条件义“如果”；“遇见”在寻找某人的语境中比单纯“找到”更符合自然汉语，同时不把条件改成确定预期。
- source_word: דּוֹדִי
  choice: 我的良人
  rationale: דּוֹדִי在《雅歌》中指女子所爱慕的男子。“良人”具有庄重的诗歌色彩，又不把关系过度限定为现代汉语中较明确的“情人”。
- source_word: מַה תַּגִּידוּ לוֹ
  choice: 要告诉他什么呢？
  rationale: 保留原文直接问句的形式和随后的回答结构；“要……什么”自然表达所托付的信息。
- source_word: שֶׁחוֹלַת אַהֲבָה אָנִי
  choice: 就说我因爱成病
  rationale: 保留חוֹלַת的疾病隐喻及אַהֲבָה的原因或关联。“因爱成病”简洁、诗意，并比单纯“害了相思病”更贴近原文的开放表达。
theological_decisions: []
