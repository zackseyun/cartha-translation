base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/005/006.yaml
  text: I opened to my beloved[a], but my beloved had turned away and gone. My soul went out when he spoke; I sought him, but I did not find him. I called him[b], but he did not answer me.
translation:
  language: zh_hans
  text: 我给我的良人开了门，我的良人却已抽身离去了。 他说话时，我的心神离去了[a]。我寻找他，却没有找到；我呼唤他，他却不回答我。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “我的心神离去了”直译为“我的性命／心神出去了”。这是一种强烈而难以完全复现的希伯来诗性说法；也可理解为“他说话时，我心神恍惚”或“我因他说的话而心力消散”。
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּתַחְתִּי אֲנִי לְדוֹדִי
  choice: 我给我的良人开了门
  rationale: “开”在语境中指开门；补出“门”使现代汉语自然。“我”已能承担独立代词 אֲנִי 的轻微强调，不另加“亲自”，以免过译。לְדוֹדִי 表示为良人开门。
- source_word: וְדוֹדִי חָמַק עָבָר
  choice: 谁知我的良人已经转身走了
  rationale: וְ 在叙事语境中形成出乎意料的转折，译作“谁知”自然传达落差。חָמַק עָבָר 两个动词共同强调他已经离去；“转身走了”兼顾退离和经过、离开的动态。
- source_word: נַפְשִׁי יָצְאָה בְדַבְּרוֹ
  choice: 他说话时，我的心魂都随他而去
  rationale: 保留 נַפְשִׁי יָצְאָה 的强烈诗性意象，同时以“心魂”表达整个人的内在生命与情感。“随他而去”结合上下文使汉语可懂，但不把这一困难习语限定为昏厥或单纯失神；脚注列出其他可能理解。בְדַבְּרוֹ 按时间关系译为“他说话时”。
- source_word: בִּקַּשְׁתִּיהוּ וְלֹא מְצָאתִיהוּ
  choice: 我寻找他，却找不到
  rationale: 直译其寻找与未找到的结果；“却”自然体现期待落空，不增添无能为力的含义。
- source_word: קְרָאתִיו וְלֹא עָנָנִי
  choice: 我呼唤他，他却不回答我
  rationale: “呼唤他”比“叫他”更适合诗歌语体，也自然表达向离去之人喊话；“回答我”保留关系中的沉默与失落。
theological_decisions:
- issue: נַפְשִׁי יָצְאָה 是否应解释为灵魂离体、昏厥或情感失神
  choice: 用诗性表达“我的心魂都随他而去”，不作教义化界定
  alternative: 我的魂离开了；我昏了过去；我失魂落魄
  rationale: 这是希伯来诗歌中的强烈而多义的习语。上下文强调良人说话及离去造成的情感震荡，不足以确定某种灵魂论或实际昏厥，因此正文保留张力，并以脚注说明译法范围。
translation_notes:
  register: 采用现代、庄重而可朗读的爱情诗语体。“良人”延续《雅歌》中 דוֹד 的亲密称谓；“心魂”保留原文诗性，避免把 נֶפֶשׁ 简化为单纯的情绪。正文中的脚注标记 [a] 已与脚注对应。
