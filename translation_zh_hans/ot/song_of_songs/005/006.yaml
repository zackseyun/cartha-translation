  source_fidelity: 草稿整体准确传达了开门、良人已离去、寻找未果和呼唤未获回应的顺序与情感。惟“我的心魂都随他而去”将 נַפְשִׁי יָצְאָה 明确解释为心魂跟随良人离去；原文的诗性习语虽可容许这一联想，却并未明说“随他”。宜保留其强烈而未定的表达。
  naturalness: “良人”“开了门”“呼唤”等措辞适合现代汉语中庄重、可诵读的爱情诗体。“心魂都随他而去”虽通顺，但因补足了原文未明言的动作而略显解释性；“心神离去了”较自然，也更能保留诗歌的恍惚与张力。
  terminology: “良人”适当地对应雅歌中 דּוֹד（beloved/lover），并保持全书常用的亲密诗歌称谓。将 נֶפֶשׁ 译作“心神”避免把它固定为可脱离身体的“灵魂”，同时保留内在生命、情感与意识受震动的诗性范围。
