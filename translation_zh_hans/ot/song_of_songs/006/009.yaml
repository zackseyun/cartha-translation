  text: אַחַ֥ת הִיא֙ יוֹנָתִ֣/י תַמָּתִ֔/י אַחַ֥ת הִיא֙ לְ/אִמָּ֔/הּ בָּרָ֥ה הִ֖יא לְ/יֽוֹלַדְתָּ֑/הּ רָא֤וּ/הָ בָנוֹת֙ וַֽ/יְאַשְּׁר֔וּ/הָ מְלָכ֥וֹת וּ/פִֽילַגְשִׁ֖ים וַֽ/יְהַלְלֽוּ/הָ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/006/009.yaml
  text: My dove[a], my flawless one, is the only one; she is the only one of her mother, pure to the one who bore her. Daughters saw her and called her blessed[c][b]; queens and concubines also praised her.
translation:
  language: zh_hans
  text: 我的鸽子，我纯全无瑕的佳人[a]，她独一无二；她是母亲唯一的女儿，在生她者眼中纯洁无瑕[b]。众女子[c]看见她，就称她有福；王后和妃嫔也赞美她。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “纯全无瑕”也可译作“完美”或“无可指摘”。原词可表达完整、纯全或无瑕。
    reason: lexical_alternative
  - marker: b
    text: “纯洁无瑕”原文也可理解为“出众的”“清澈的”或“光彩照人的”。
    reason: lexical_alternative
  - marker: c
    text: “众女子”原文字面为“女儿们”，在本诗中可泛指年轻女子或少女。
    reason: cultural_note
lexical_decisions:
- source_word: יוֹנָתִי
  choice: 我的鸽子
  rationale: 保留原文“鸽子”的诗歌意象；在《雅歌》中这是亲昵称呼，也传达美丽、温柔之感。
- source_word: תַמָּתִי
  choice: 我纯全的人
  rationale: 该词可表达完整、纯全或无可指摘；“纯全”既避免过度道德化，也保留其完整无瑕的诗意。
- source_word: אַחַת הִיא
  choice: 她独一无二
  rationale: 重复结构强调她的唯一性和无可比拟，不只是数字上的“一个”。
- source_word: לְאִמָּהּ
  choice: 母亲唯一的女儿
  rationale: לְ在此表达相对于母亲的身份；结合汉语习惯，将省略的关系明确为“唯一的女儿”。
- source_word: בָּרָה
  choice: 所珍爱的
  rationale: בָּרָה可指纯洁、明净，也可指精选、出众；在与生母的关系中译作“所珍爱的”，自然表达其特殊、可贵的地位，同时以脚注保留其他词义。
- source_word: לְיוֹלַדְתָּהּ
  choice: 生她之人
  rationale: 保留“生育她的那一位”这一分词表达，与前句“母亲”形成诗意平行。
- source_word: בָנוֹת
  choice: 众女子
  rationale: 字面为“女儿们”，但在《雅歌》的诗歌语境中常泛指年轻女子；现代汉语译作“众女子”更自然。
- source_word: וַיְאַשְּׁרוּהָ
  choice: 称她有福
  rationale: 使役词形表示宣称某人有福、幸福；“称她有福”准确保留评价意味。
- source_word: מְלָכוֹת וּפִילַגְשִׁים
  choice: 王后和妃嫔
  rationale: 直接呈现两类宫廷女性；“妃嫔”在汉语中比“妾”更符合此处宫廷诗歌语境。
- source_word: וַיְהַלְלוּהָ
  choice: 赞美她
  rationale: הלל的基本义为赞美、称颂；此译清楚自然。
theological_decisions: []
