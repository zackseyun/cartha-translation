  yaml_path: translation/ot/song_of_songs/006/003.yaml
  text: I am my beloved's[a], and my beloved is mine, who grazes among the lilies.
translation:
  language: zh_hans
  text: 我属我的良人，我的良人也属我；他在百合花间放牧。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “放牧”或译“牧养”，也可理解为“吃草”。希伯来文这个分词可表示放牧、牧养或吃草；原文没有明说所牧放的对象。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲנִי לְדוֹדִי
  choice: 我属我的良人
  rationale: 用“属”表达 לְ 所表示的归属关系，既自然又保留诗句中彼此相属的意味；“良人”承接 דּוֹד 在《雅歌》中的爱侣称谓，语体庄重而不作过度性化处理。
- source_word: וְדוֹדִי לִי
  choice: 我的良人也属我
  rationale: 补出汉语所需的“属”，与前句形成对称，保留希伯来文无系词句的互属结构。
- source_word: הָרֹעֶה
  choice: 他……牧放
  rationale: רעה 的 Qal 分词可指放牧、牧养，也可能描述吃草；“牧放”保留牧者意象，又不擅自补出原文未明说的羊群。
- source_word: בַּשׁוֹשַׁנִּים
  choice: 在百合花间
  rationale: בְּ 在此表示所在范围，以“在……间”自然传达；שׁוֹשַׁנִּים 依《雅歌》反复出现的传统花卉意象译为“百合花”。
theological_decisions:
- issue: 《雅歌》中的关系语言
  choice: 按恋人彼此相属的诗歌语言直译，不作寓意扩写
  alternative: 在译文中把良人明确解释为上帝或弥赛亚
  rationale: 希伯来文本呈现爱侣之间彼此归属的陈述；翻译应保留这一文本层面的含义，不把后来的寓意或教义解释写入正文。
- issue: הָרֹעֶה 的主语与动作含义
  choice: 以“他在百合花间牧放”保留男性单数分词及牧养意象
  alternative: 译作“他在百合花间吃草”或补译“他在百合花间牧放羊群”
  rationale: 分词的词义范围包含吃草、放牧和牧养。上下文可有意象上的开放性，因此正文采用不明说宾语的“牧放”，脚注交代其他可能。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“我属我的良人，我的良人也属我”保持原文的平行与互属结构；分号呈现两部分之间的停顿，并使末尾牧放意象自然承接“我的良人”。
