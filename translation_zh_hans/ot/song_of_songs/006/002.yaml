  text: My beloved has gone down to his garden[a], to the beds of spices[b], to graze in the gardens and to gather lilies.
translation:
  language: zh_hans
  text: 我的良人下到他的园子，到香料畦，在众园中放牧[a]，采摘百合花[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“取食”或“牧养”。希伯来语动词既可指牲畜吃草，也可指牧人喂养或放牧；这里可能有意保留牧养意象中的多重含义。
    reason: lexical_alternative
  - marker: b
    text: 这里的希伯来语究竟指哪一种花，不能完全确定；传统译作“百合花”。
    reason: lexical_alternative
lexical_decisions:
- source_word: דּוֹדִי
  choice: 我的良人
  rationale: “良人”在《雅歌》中自然表达女子所爱的男子，既有亲密感，也保持庄重的诗歌语体；比现代汉语中的“情人”少一些容易误解的附带含义。
- source_word: יָרַד
  choice: 下到
  rationale: 保留动词明确的向下移动含义；希伯来语完成式在此陈述已经发生、与当前情境相关的行动，现代汉语无需另加时态标记。
- source_word: לְגַנּוֹ
  choice: 到他的园中
  rationale: 忠实表达向着其园子的移动，并保留第三人称男性单数所有关系。
- source_word: לַעֲרוּגוֹת הַבֹּשֶׂם
  choice: 来到香草畦间
  rationale: עֲרוּגוֹת指栽培植物的畦或圃，בֹּשֶׂם指香料、香膏或芳香之物；“香草畦”以自然简洁的现代汉语保留园艺和芬芳意象。“来到”承接前句的方向关系，“间”适合复数园畦的空间图景。
- source_word: לִרְעוֹת
  choice: 放牧
  rationale: רעה可指放牧、牧养，也可指取食。主语或宾语在诗句中并未完全说明；“放牧”保留具体的牧野意象，不擅自补出羊群或把它解释为良人自己进食。
- source_word: בַּגַּנִּים
  choice: 在众园中
  rationale: 保留原文复数，与前面的单数“他的园”形成诗意变化；“众园”比简单的“花园里”更明确反映复数。
- source_word: וְלִלְקֹט
  choice: 采摘
  rationale: לקט在此指采集、摘取；用于花朵时，“采摘”是自然、准确的现代汉语。
- source_word: שׁוֹשַׁנִּים
  choice: 百合花
  rationale: 沿用传统且广为人知的译法，并与《雅歌》全书的反复意象保持一致；具体植物种类仍有不确定性，故加脚注说明。
