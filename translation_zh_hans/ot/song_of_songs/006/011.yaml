base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/006/011.yaml
  text: I went down to the walnut grove to look at the shoots in the valley[a], to see whether the vine had budded[c][b], whether the pomegranates had blossomed.
translation:
  language: zh_hans
  text: 我下到核桃园里[a]，要察看谷中的新芽[b]，看看葡萄树是否发了芽[c]，石榴是否开了花。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“坚果园”或“坚果树林”。原文可能指人工栽种的核桃树或其他坚果树园。
    reason: lexical_alternative
  - marker: b
    text: “谷”所译的希伯来词也可指溪谷、旱溪或河床。
    reason: lexical_alternative
  - marker: c
    text: 或译“葡萄树是否开了花”。原文动词既可表示萌芽，也可表示开花。
    reason: lexical_alternative
lexical_decisions:
- source_word: גִּנַּת אֱגוֹז
  choice: 核桃园
  rationale: גִּנָּה指园圃或果木园，אֱגוֹז指坚果树，通常理解为核桃树；“核桃园”简洁自然，也符合栽培场景。
- source_word: יָרַדְתִּי
  choice: 我下到
  rationale: 保留ירד“下去、下到”的方向意义，同时采用自然的现代汉语表达。
- source_word: לִרְאוֹת
  choice: 察看／看看
  rationale: 原文两次使用同一不定式。译文以近义表达避免汉语生硬重复，同时保留前者察看景物、后者查验是否发生的语义。
- source_word: בְּאִבֵּי הַנָּחַל
  choice: 谷中的新芽
  rationale: אִבִּים指新生的嫩芽或青翠生长物；נַחַל可指溪谷、干河床或谷地。“谷中的新芽”通顺而保留地貌上的开放性，另以脚注说明。
- source_word: הֲפָרְחָה הַגֶּפֶן
  choice: 葡萄树是否发了芽
  rationale: פרח可涵盖萌芽、抽生和开花。译作“发了芽”既保留其范围的一种合理理解，也与下句石榴“开花”所用的不同希伯来动词形成区别。
- source_word: הֵנֵצוּ הָרִמֹּנִים
  choice: 石榴是否开了花
  rationale: נוץ在此指开花；按希伯来语以果名代树名的表达译为“石榴”，现代汉语诗歌语境中自然，也可理解为石榴树。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而富有诗意的普通话。“察看……看看……”保留原文两次“看”的结构而避免机械重复；两个“是否”并列，呈现说话者下园查验春日生长状况的语气。
