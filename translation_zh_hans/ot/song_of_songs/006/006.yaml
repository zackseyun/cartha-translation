base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/006/006.yaml
  text: Your teeth are like a flock of ewes that have come up from the washing[a], all of them bearing twins[b], and none among them has lost her young.
translation:
  language: zh_hans
  text: 你的牙齿如一群从洗濯处上来的母羊；只只生有双羔[a]，没有一只丧子[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“只只成对。”此处也可暗示每颗牙齿都有与之相配的另一颗。
    reason: lexical_alternative
  - marker: b
    text: 直译：“没有一只丧失幼子。”这个比喻强调完整无缺：没有一颗牙齿缺少与之相配的另一颗。
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁנַּיִךְ
  choice: 你的牙齿
  rationale: 这是阴性单数第二人称所有格；“你的牙齿”是现代汉语直接自然的表达。
- source_word: כְּעֵדֶר הָרְחֵלִים
  choice: 如一群母羊
  rationale: רְחֵלִים特指母羊；保留原文明确的性别和牧野意象。
- source_word: שֶׁעָלוּ מִן הָרַחְצָה
  choice: 洗净后走上来
  rationale: 表达羊群从洗濯处上来的动态；“洗净后”自然传达洁白清新的诗意形象。
- source_word: שֶׁכֻּלָּם מַתְאִימוֹת
  choice: 它们个个成双
  rationale: מַתְאִימוֹת可指成对，也可在母羊意象中理解为产双羔；正文采用“成双”，既保留牙齿彼此配对的含义，也不排除羊群比喻。
- source_word: וְשַׁכֻּלָה אֵין בָּהֶם
  choice: 没有一只丧子
  rationale: שַׁכֻּלָה直指丧失幼子的母畜；保留原文比喻，而不直接改写为“没有缺牙”。
theological_decisions: []
