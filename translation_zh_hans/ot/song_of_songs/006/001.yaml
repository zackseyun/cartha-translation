  yaml_path: translation/ot/song_of_songs/006/001.yaml
  text: Where has your beloved gone[a], most beautiful among women? Where has your beloved turned, that we may seek him with you?
translation:
  language: zh_hans
  text: '众女子：


    “你的爱人往哪里去了，

    女子中最美丽的女子啊？


    你的爱人转向[a]哪里去了？

    我们好与你一同寻找他。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “转向”也可译为“转往别处”或“转身离开”；这里的动词可指改变方向或离去，并不只指身体转动。
    reason: lexical_alternative
lexical_decisions:
- source_word: אָנָה
  choice: 往哪里
  rationale: 这是询问目的地或去向的疑问副词；“往哪里”既贴合方向含义，也符合现代汉语表达。
- source_word: הָלַךְ
  choice: 去了
  rationale: 此处完成式所问的是爱人离去后的去向；汉语“去了”自然传达已经离开的动作及当前不在场的语境。
- source_word: דּוֹדֵךְ
  choice: 你的爱人
  rationale: 在《雅歌》中，该词常指女子所爱的男子。“爱人”保留亲密、浪漫意味，语体自然庄重。
- source_word: הַיָּפָה בַּנָּשִׁים
  choice: 女子中最美丽的啊
  rationale: 这是希伯来语以范围表达最高程度的习语；译作“女子中最美丽的”清楚保留其称呼和赞美语气。
- source_word: פָּנָה
  choice: 转向
  rationale: 该动词基本义为“转、转向”，在此可指改变方向或转身离去；保留“转向”可维持与前句既平行又有区别的措辞。
- source_word: וּנְבַקְשֶׁנּוּ
  choice: 我们好……寻找他
  rationale: 第一人称复数形式在问句之后表达意向或目的；“好……寻找他”自然呈现她们愿意加入寻找的意思。
- source_word: עִמָּךְ
  choice: 和你一起
  rationale: 直接表达陪同关系，符合现代汉语习惯。
