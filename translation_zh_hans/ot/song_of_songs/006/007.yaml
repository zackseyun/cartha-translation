  yaml_path: translation/ot/song_of_songs/006/007.yaml
  text: Your cheeks are like a slice of pomegranate behind your veil[a].
translation:
  language: zh_hans
  text: 你的两颊在面纱后面，如同一片石榴[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在你的发绺后面”或“透过你的头发”；若将 לְצַמָּתֵךְ 理解为头发而非面纱。
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּפֶלַח
  choice: 如同一片
  rationale: 前缀 כְּ 表示比拟；פֶלַח 指切开或裂开的一片、一瓣。译作“一片”自然地保留切开的果实这一意象。
- source_word: הָרִמּוֹן
  choice: 石榴
  rationale: 指石榴。中文无需照搬定冠词；保留雅歌中鲜明而含蓄的果实意象。
- source_word: רַקָּתֵךְ
  choice: 你的两颊
  rationale: רַקָּה 可指太阳穴或头侧；在此处描写女子面容，以“两颊”表达可见的面部美感，并与中文诗歌表达相称。原文形态为单数带第二人称阴性单数后缀，但在语境中可作集合性理解。
- source_word: מִבַּעַד
  choice: 在……后面
  rationale: 该介词表示隔着遮蔽物、从后面或透过而见。与“面纱”搭配时，“在……后面”简洁自然，也保留若隐若现之感。
- source_word: לְצַמָּתֵךְ
  choice: 你的面纱
  rationale: 此词在雅歌4:1和6:7中常被理解为女子的面纱或遮盖物，但也可能指发绺或头发。正文采用与 מִבַּעַד 搭配自然的“面纱”，脚注保留词义歧义。
theological_decisions: []
translation_notes:
  register: 采用现代、端庄而富有诗意的普通话。“如同一片石榴”保留原文紧凑的比喻，没有补入“红润”等原文未明说的解释；脚注保存“面纱／头发”的真实词义分歧。
