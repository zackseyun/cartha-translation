base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/006/012.yaml
  text: Before I knew it[b][a], my soul set me among the chariots of my noble people.
translation:
  language: zh_hans
  text: 不知不觉间，我的心[a]把我置于我尊贵族人的战车中。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “我的心”也可译作“我的生命”“我自己”或“我的心愿”。本节希伯来文的句法和含义很难确定。
    reason: lexical_alternative
  - marker: b
    text: 末句也可译作“亚米拿迪的战车”，把“我尊贵的族人”所对应的希伯来词连读为专名“亚米拿迪”。
    reason: alternative_reading
lexical_decisions:
- source_word: לֹא יָדַעְתִּי
  choice: 我不知不觉
  rationale: 希伯来文直译为“我不知道”，此处自然表达事情突然而在未察觉中发生；中文用“我不知不觉”既简洁又保留这种无意识感。
- source_word: נַפְשִׁי
  choice: 我的心愿
  rationale: נֶפֶשׁ 可指生命、自己、内在之人或欲望。这里“我的心愿”能较自然地表达内在冲动，但原词的主语用法及具体含义并不确定，故在脚注保留其他可能。
- source_word: שָׂמַתְנִי
  choice: 把我置于……中
  rationale: שׂוּם 的基本义为“放置、安置”。采用位置性的译法，不将其进一步解释为“使我像”或“带我到”。
- source_word: מַרְכְּבוֹת
  choice: 战车
  rationale: 该复数名词通常指战车；中文集合语境中无需强行标出复数。
- source_word: עַמִּי נָדִיב
  choice: 我高贵族人的
  rationale: 将 עַמִּי 读作带第一人称后缀的“我的族人”，并把 נָדִיב 理解为“高贵的”。用“族人”较“人民”更适合诗歌中的群体归属，同时保留该短语的困难读法于脚注。
theological_decisions:
- issue: 本节说话者内在行动的含义
  choice: 不把“心愿”解释为特定的属灵经验或神学行动
  alternative: 将其释作灵魂受神推动、爱情冲动或狂喜状态
  rationale: 原文极其简略且语法困难；译文应保留诗意张力，不导入文本未明说的宗派性或寓意性解释。
translation_notes:
  register: 采用现代、庄重而可朗读的普通话。“我不知不觉”传达突发和未察觉；“置于”略带诗体色彩，却仍为现代读者易懂。脚注标记依其解释对象排列为[a][b]。
