base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/006/010.yaml
  text: Who is this who looks forth like the dawn[a], beautiful as the moon, bright as the sun[c][b], awe-inspiring as bannered armies?
translation:
  language: zh_hans
  text: 这位如晨曦般显现的女子是谁？她美丽如月亮，明亮如太阳[a]，威严可畏，如旌旗招展的军队[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “明亮”所译的希伯来语形容词也可译作“纯净”或“清澈”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“令人敬畏，如有旗帜的军队。”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי זֹאת הַנִּשְׁקָפָה
  choice: 那……显现的女子是谁
  rationale: מִי זֹאת直译为“这是谁”，但阴性指示词及阴性分词明确指向女子；现代汉语若仅说“这是谁”会削弱这一信息。הַנִּשְׁקָפָה在此描写她进入视野，“显现”自然地保留视觉意象，又不强加“向下俯看”的空间关系。
- source_word: כְּמוֹ שָׁחַר
  choice: 如晨曦般
  rationale: שָׁחַר指黎明、破晓；“晨曦”既自然又富有诗意，并与后面的月亮、太阳意象协调。
- source_word: יָפָה כַלְּבָנָה
  choice: 美丽如月亮
  rationale: 直接保留希伯来文的审美判断与明喻结构，语言简洁庄重。
- source_word: בָּרָה כַּחַמָּה
  choice: 明亮如太阳
  rationale: בָּרָה可表示纯净、清澈或明亮；在月亮和太阳的光体语境中，“明亮”最贴切，同时以脚注保留词义歧义。
- source_word: אֲיֻמָּה
  choice: 威严可畏
  rationale: 该词表达令人敬畏、甚至生畏的强大气势。“威严可畏”同时保留庄严感与震慑力，避免仅译“可怕”所带来的负面道德色彩。
- source_word: כַּנִּדְגָּלוֹת
  choice: 如列队扬旗的军旅
  rationale: 该形式源于דגל“旗帜”，在本书6:4、6:10中很可能指有旗帜标识、整齐列阵的队伍。“列队扬旗的军旅”在现代汉语中具体而有气势；脚注保留较简约的另一种理解。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而可朗读的诗歌语言。句首明确女性所指，以符合希伯来文阴性形式；各明喻保持平行。末句使用“威严可畏”和“列队扬旗的军旅”，兼顾爱情诗中的赞叹与原文突出的军事震慑意象。
