  yaml_path: translation/ot/song_of_songs/006/008.yaml
  text: There are sixty queens and eighty concubines[a], and young women without number.
translation:
  language: zh_hans
  text: 有六十位王后，八十位妃嫔，年轻女子更是不计其数。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “年轻女子”也可译作“少女”，或作“处女”。希伯来语 עֲלָמוֹת 泛指年轻女子，本身并不一定要求理解为“处女”。
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁשִּׁים הֵמָּה מְּלָכוֹת
  choice: 有六十位王后
  rationale: 用现代汉语的存现句“有”自然表达希伯来语列举结构；“王后”对应复数 מְּלָכוֹת，并保留宫廷语境。
- source_word: וּשְׁמֹנִים פִּילַגְשִׁים
  choice: 八十位妃嫔
  rationale: “妃嫔”在中文宫廷语境中自然地表示地位低于王后的王室配偶，比现代常带贬义色彩的“姘妇”更准确、庄重。
- source_word: וַעֲלָמוֹת
  choice: 年轻女子
  rationale: עֲלָמוֹת 广义指适婚年龄的年轻女性，本身不必然明确其处女身份；“年轻女子”既准确又符合现代汉语。
- source_word: אֵין מִסְפָּר
  choice: 更是不计其数
  rationale: 这是表示无法计数的惯用语；“不计其数”自然且保留诗体语气，“更是”则顺畅呈现本句递进式列举。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而自然的诗歌语言。保留“三组人物加数量”的递进结构，同时避免用过于古雅或带有不必要贬义的词语。脚注标记置于整句末尾，说明“年轻女子”的词义范围。
