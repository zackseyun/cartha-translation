base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/006/005.yaml
  text: Turn your eyes away from me[a], for they overwhelm me[b]. Your hair is like a flock of goats streaming down from Gilead.
translation:
  language: zh_hans
  text: 把你的眼睛从我面前转开，因为它们使我不知所措[a]。你的头发如同一群从基列下来[b]的山羊。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“令我心慌意乱”“把我压倒了”。这里的希伯来语动词较为罕见，确切含义有争议。
    reason: lexical_alternative
  - marker: b
    text: 或译：“从基列奔流而下”或“沿基列的山坡下来”。这里的动词描绘向下移动的画面，具体的动态语感可有不同理解。
    reason: lexical_alternative
lexical_decisions:
- source_word: הָסֵבִּי עֵינַיִךְ מִנֶּגְדִּי
  choice: 求你转开双眼，不要看我
  rationale: 阴性单数祈使式要求女子把眼睛从说话者面前转开。“求你”使情诗中的请求语气自然，“不要看我”清楚表达 מִנֶּגְדִּי 所指的目光离开，却不改变命令的直接性。
- source_word: שֶׁהֵם הִרְהִיבֻנִי
  choice: 因为你的目光令我不知所措
  rationale: רָהַב 在此形式中罕见，具体语气有争议；上下文表明女子的双眼使说话者受到强烈冲击或心神不定。“不知所措”保留这种被压倒、被扰乱的情感力度，同时避免把词义限定得过窄。代词“它们”按汉语习惯明确为“你的目光”。
- source_word: שַׂעְרֵךְ כְּעֵדֶר הָעִזִּים
  choice: 你的秀发如同一群山羊
  rationale: 忠实保留头发与山羊群的田园比喻；“秀发”符合现代汉语情诗语域，“一群”自然对应 עֵדֶר。
- source_word: שֶׁגָּלְשׁוּ מִן הַגִּלְעָד
  choice: 从基列奔流而下
  rationale: גָּלְשׁוּ 描绘向下滑动或流动的动态画面。“奔流而下”既可使人联想到山羊群下行，也与秀发倾泻的视觉形象呼应；“基列”照原文处理，不擅自增添“山”或“山坡”。
