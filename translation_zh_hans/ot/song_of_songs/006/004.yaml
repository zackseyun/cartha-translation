base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/006/004.yaml
  text: You are beautiful[a], my love, like Tirzah, lovely like Jerusalem, awe-inspiring as bannered armies.
translation:
  language: zh_hans
  text: 我的爱人啊，你美丽如得撒，秀美如耶路撒冷；你令人敬畏，如展开旌旗的军队。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“如带着旗帜的军队”。希伯来语描绘的是在旗帜之下排列有序的军队，强调其庄严、壮盛而令人敬畏的气势。
    reason: lexical_alternative
lexical_decisions:
- source_word: יָפָה
  choice: 美丽
  rationale: 作谓语形容女子的美貌；“美丽”是现代汉语中自然、直接而庄重的表达。
- source_word: רַעְיָתִי
  choice: 我的爱人
  rationale: 这是《雅歌》中反复出现的亲密称呼；“我的爱人”既保留爱恋语境，也比直译为“我的同伴”自然。
- source_word: כְּתִרְצָה
  choice: 如得撒
  rationale: 前缀כ表示比较；得撒是地名，按传统译名音译，并保留原文未加解释的比喻。
- source_word: נָאוָה
  choice: 秀美
  rationale: 与前面的יָפָה平行但不完全重复；“秀美”保留诗句的词汇变化和赞美意味。
- source_word: כִּירוּשָׁלִָם
  choice: 如耶路撒冷
  rationale: 保留比较结构和通行地名译法，使“如得撒／如耶路撒冷”的平行关系清楚。
- source_word: אֲיֻמָּה
  choice: 令人敬畏
  rationale: 该词表示使人畏惧、震慑或肃然起敬；“令人敬畏”保留其强烈、威严的意味，又不把它误解为道德上的可怕。
- source_word: כַּנִּדְגָּלוֹת
  choice: 如列阵扬旗的军队
  rationale: 该形式指旗下排列的队伍，语境中带有军事阵列的意象；此译法明确传达旌旗、秩序和震慑力，同时保留诗歌的壮观画面。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而富有诗意的普通话。“我的爱人啊”体现亲密呼语；分号呈现两组平行赞语。末句保留原文把女子之美与旗下军阵相比所产生的威严和张力，不将这一强烈意象弱化。
