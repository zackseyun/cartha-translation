base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/007/010.yaml
  text: And your mouth is like the best wine[a], going down smoothly for my beloved[b], gliding over the lips of sleepers.
translation:
  language: zh_hans
  text: '你的口[a]如上好的美酒，

    顺畅地流向我的良人，

    轻轻滑过沉睡者的嘴唇。[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“你的上颚”；希伯来语所指更具体，是口腔顶部，也可借指口。
    reason: lexical_alternative
  - marker: b
    text: 或译“使沉睡者的嘴唇开口说话”。这里的希伯来语动词很少见，既可指酒轻轻滑过嘴唇，也可能指酒使沉睡者的嘴唇动起来或说出话来。
    reason: alternative_reading
lexical_decisions:
- source_word: חִכֵּךְ
  choice: 你的口
  rationale: 该词具体指上颚，也可借指口腔。正文用现代汉语诗歌中较自然的“口”，脚注保留其较具体的解剖含义。
- source_word: כְּיֵין הַטּוֹב
  choice: 如上好的美酒
  rationale: “上好的”自然表达定冠词与形容词在此语境中的优质、佳美之意；“美酒”符合汉语诗体。
- source_word: הוֹלֵךְ לְדוֹדִי
  choice: 流向我的良人
  rationale: הוֹלֵךְ本义为“行、去”，用于酒则宜译作“流”；介词ל保留朝向“我的良人”的方向感，而不改译为享用关系。
- source_word: לְמֵישָׁרִים
  choice: 顺畅地
  rationale: 该词字面涉及“笔直、平正”，形容酒的流动时表达顺直、顺畅，译文采用自然的汉语搭配。
- source_word: דּוֹבֵב
  choice: 轻轻滑过
  rationale: 这是罕见词形，在酒与嘴唇的意象中可理解为缓缓移动。正文采用流动义，同时以脚注保留“使……说话”的使动解释。
- source_word: שִׂפְתֵי יְשֵׁנִים
  choice: 沉睡者的嘴唇
  rationale: 贴近原文所有格结构，并保留酒在沉睡者嘴唇上移动或使其嘴唇开口的诗意含混。
theological_decisions: []
translation_notes:
  register: 采用现代、优美而克制的爱情诗语体。“良人”在现代日常语言中不常见，但在《雅歌》的诗歌语境里简洁庄重，并能稳定表达恋人称谓。三行结构呈现原文连续的酒液流动意象；不替文本消解“我的良人”与“沉睡者”之间的诗意张力。
