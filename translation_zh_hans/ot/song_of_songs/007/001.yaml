base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/007/001.yaml
  text: Return[a], return, O Shulammite; return, return, that we may look at you[b]. Why do you look at the Shulammite as at the dance of Mahanaim?
translation:
  language: zh_hans
  text: '回来，回来，书拉密女子！回来，回来，好让我们观看你。


    你们为什么观看书拉密女子，如同看玛哈念的舞蹈一样？[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本句希伯来文句法较难，也可译作：“你们在书拉密女子身上看什么？——如同玛哈念的舞蹈。”在这种理解中，מַה译为“什么”，而不是“为什么”。
    reason: alternative_reading
  - marker: b
    text: “玛哈念”很可能是地名；这个名称本身可能意为“双营”或“两队”。
    reason: cultural_note
lexical_decisions:
- source_word: שׁוּבִי
  choice: 回来
  rationale: 这是阴性单数祈使式，在呼唤对方回到说话者这里的语境中，“回来”自然、明确，同时保留四次重复的诗歌效果。
- source_word: הַשּׁוּלַמִּית
  choice: 书拉密女子
  rationale: 音译这一称谓，并加“女子”使现代汉语读者自然理解其阴性所指；不判定它究竟是族称、称号还是与所罗门相呼应的诗性名称。
- source_word: וְנֶחֱזֶה בָּךְ
  choice: 好让我们看看你
  rationale: 表达前面反复祈使所引出的目的；“看看”符合现代汉语，也不过度强化为凝视或观赏。
- source_word: מַה
  choice: 为什么
  rationale: 按此处可能的疑问—解释用法译为“为什么”，形成通顺的反问；其通常义“什么”所支持的另一种句法分析保留在脚注中。
- source_word: תֶּחֱזוּ
  choice: 你们……观看
  rationale: 保留第二人称阳性复数，并以“观看”与前句视觉动词相呼应；用词也适合后接舞蹈这一对象。
- source_word: כִּמְחֹלַת
  choice: 仿佛观看……的舞蹈
  rationale: 明确表达前缀 כ 的比较意义，并依汉语习惯补出“观看”，使比喻与主句动词自然衔接。
- source_word: הַמַּחֲנָיִם
  choice: 玛哈念
  rationale: 较可能是地名，故在正文音译；名称可能含有“双营”的意思，另在脚注说明。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。四次“回来”照原文保留；对话中的人称由“我们”转为“你们”也予以保留。正文不消解后半句的句法难点，以脚注呈现主要替代读法。
