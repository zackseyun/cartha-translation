  to: '回来，回来，书拉密女子！回来，回来，好让我们观看你。


    你们为什么观看书拉密女子，如同看玛哈念的舞蹈一样？[a][b]'
  rationale: 修订仅改善脚注锚点与正文的对应关系，并使比较句在现代汉语中更顺畅；保留原译对后半句“为什么”的可行理解，以及脚注中“什么”的替代读法。
