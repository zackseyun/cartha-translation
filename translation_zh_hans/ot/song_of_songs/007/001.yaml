review_pass:
  verdict: revise
  source_fidelity: 正文基本忠实保留了四次阴性单数祈使的重复、转向第一人称复数的“我们”、以及后句第二人称复数“你们”。后半句的“为什么”是可成立的解释性理解；脚注也恰当地保留了将מַה理解为“什么”的替代句法。将“仿佛观看……的舞蹈”调整为“如同看……的舞蹈一样”，更直接对应比较前缀כ，且不改变原文的句法歧义。
  naturalness: “回来，回来”及“书拉密女子”自然可懂。以“好让我们观看你”取代较口语且略带轻忽色彩的“好让我们看看你”，较适合本段庄重的诗歌语域，同时仍是现代汉语。
  terminology: “书拉密女子”保留该称谓的音译和阴性所指，不武断界定其性质；“玛哈念”作为地名音译恰当。“双营”或“两队”的可能词义宜仅置于脚注。
  issues:
  - severity: low
    issue: 替代读法脚注[a]的锚点置于第一句末，所注释的实际是后半句以מַה起首的疑问句。
    rationale: 脚注内容讨论“什么／为什么”及后半句的困难句法；将锚点移至该疑问句后，读者能明确知道注释对象。英语审校轨迹中的锚点位置与其脚注内容并不完全一致，中文应以原文句法和脚注实际所释内容为准。
  - severity: low
    issue: “仿佛观看玛哈念的舞蹈”在汉语中略显生硬。
    rationale: 原文是“像／如同玛哈念的舞蹈”的比较结构；“如同看玛哈念的舞蹈一样”更自然地把比较连接到“观看”，不增添解释。
