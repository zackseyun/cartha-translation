base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/007/013.yaml
  text: Let us rise early for the vineyards[a]; let us see whether the vine has budded, whether the blossom has opened, whether the pomegranates are in bloom[c][b]. There I will give you my love.
translation:
  language: zh_hans
  text: 让我们清早起来，到葡萄园去，看看葡萄树萌芽了没有[a]，葡萄花开放了没有，石榴开花了没有。在那里，我要把我的爱给你[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “萌芽”或译“开花”。原词既可指植物萌发，也可指开花；这里译作“萌芽”，与下一句“葡萄花开放”形成可能的生长进程。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“我的诸爱”，可能是加强或集合式说法，意为“我的爱”，也可包含“我的爱抚”的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: נַשְׁכִּימָה
  choice: 让我们清早起来
  rationale: 该词是שׁכם的使役式第一人称复数意愿式，表示清早起来或及早出发；译文既保留共同邀约的语气，也保留时间意味。
- source_word: לַכְּרָמִים
  choice: 到葡萄园去
  rationale: 介词ל在此表示朝向、目的地。现代汉语用“到……去”自然明确，无须复制英语中“for/to”的歧义。
- source_word: נִרְאֶה אִם
  choice: 看看……了没有
  rationale: ראה的意愿式表达共同察看，אִם引出间接疑问；“看看……了没有”符合自然汉语，并保留邀约和观察语气。
- source_word: פָּרְחָה הַגֶּפֶן
  choice: 葡萄树萌芽了没有
  rationale: פרח可指萌发，也可指开花。下一分句紧接葡萄花开放，因此正文用“萌芽”呈现可能的生长进程，同时以脚注保留“开花”的词义可能。
- source_word: פִּתַּח הַסְּמָדַר
  choice: 葡萄花开放了没有
  rationale: סמדר指葡萄花或葡萄初花，פתח意为打开、开放；明确译作“葡萄花开放”既贴合植物意象，也便于现代读者理解。
- source_word: הֵנֵצוּ הָרִמּוֹנִים
  choice: 石榴开花了没有
  rationale: נוץ在这里表示长出花朵、开花；“石榴开花”是准确自然的现代汉语表达。
- source_word: שָׁם אֶתֵּן
  choice: 我要在那里……给你
  rationale: שָׁם明确指地点，נתן是普通的“给”；译文保留空间指向和将来意味，不改写为单纯的时间顺序。
- source_word: דֹּדַי
  choice: 我的爱
  rationale: 原文是复数形式，可作加强或集合表达，涵盖爱情、亲昵或爱抚。“我的爱”在正文中自然含蓄，并由脚注说明原文形式及可能内涵。
