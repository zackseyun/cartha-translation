base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/007/002.yaml
  text: How beautiful are your feet in sandals[a], O noble daughter! The curves of your thighs are like jewels[b], the work of the hands of a master craftsman.
translation:
  language: zh_hans
  text: 尊贵之女啊，你穿着凉鞋的双脚何其美丽！你大腿[a]的曲线宛如珠饰[b]，是巧匠双手的杰作。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “大腿”或可译作“髋部”；希伯来词可泛指髋部至大腿一带。
    reason: lexical_alternative
  - marker: b
    text: “珠饰”或可译作“饰物”或“项链”；希伯来词很可能指精工制作的贵重装饰品。
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה יָּפוּ
  choice: 何其美丽
  rationale: מַה在这里引出赞叹，并非疑问；“何其美丽”以庄重而自然的现代汉语保留感叹语气。
- source_word: פְעָמַיִךְ
  choice: 你的双脚
  rationale: פעם可指脚或脚步；与“凉鞋”连用时，具体的“双脚”最符合语境。
- source_word: בַּנְּעָלִים
  choice: 穿着凉鞋
  rationale: 将介词ב按汉语习惯表达为“穿着”，清楚呈现双脚着凉鞋的形象。
- source_word: בַּת נָדִיב
  choice: 尊贵之女
  rationale: 保留希伯来语简洁的称呼方式；נָדִיב可涉及高贵身份或尊贵气质，译文不限定为某位贵族的亲生女儿。
- source_word: חַמּוּקֵי
  choice: 曲线
  rationale: 该词表示弯曲、圆润的轮廓；在身体赞美诗中，“曲线”比偏解剖学的“关节”更贴合审美语境。
- source_word: יְרֵכַיִךְ
  choice: 你大腿的
  rationale: יָרֵךְ可指大腿、髋部或其周围区域；正文采用直接常见的“大腿”，并以脚注保留“髋部”的可能。
- source_word: חֲלָאִים
  choice: 珠饰
  rationale: 该词指人工制作的饰物或珠宝；“珠饰”兼顾珍贵材质与工艺制品的意象，同时避免过度限定为项链。
- source_word: מַעֲשֵׂה יְדֵי אָמָּן
  choice: 是巧匠双手的杰作
  rationale: 保留“手”的原文意象，并以“巧匠”“杰作”表达精湛的手工技艺。
theological_decisions: []
translation_notes:
  register: 采用现代、端庄而富有诗意的普通话。“何其美丽”“宛如”“杰作”维持赞歌的抒情格调；直译身体意象，不弱化其亲密性，也不添加寓意化解释。
