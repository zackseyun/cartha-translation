  register: 采用现代、庄重而易懂的诗体中文，并按希伯来诗句分行。身体意象保持具体，不因现代审美习惯而弱化；地名采用常见汉语音译。脚注分别保留“巴特拉并”的语义不确定性、“鼻子”比喻的文化语境，以及 צוֹפֶה 的几种可能表达。
