base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/007/005.yaml
  text: Your neck is like a tower of ivory[a]; your eyes are pools in Heshbon, by the gate of Bath-rabbim. Your nose is like the tower of Lebanon[c][b], looking toward Damascus.
translation:
  language: zh_hans
  text: '你的颈项如象牙塔；


    你的眼睛像希实本的水池，


    在巴特拉并门旁[a]。


    你的鼻子[b]如黎巴嫩的塔，


    面向大马士革[c]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “巴特拉并”也可译作“众民之女”或“人口众多之城”。这个希伯来语短语可能是地名，也可能带有描述性的含义。
    reason: alternative_reading
  - marker: b
    text: 希伯来文直译为“鼻子”。这里的比喻很可能是在赞美女子的侧面轮廓挺拔高贵，并非按现代习惯孤立地评论某个五官。
    reason: cultural_note
  - marker: c
    text: “面向大马士革”也可译作“朝着大马士革瞭望”或“俯瞰大马士革”。
    reason: lexical_alternative
lexical_decisions:
- source_word: צַוָּארֵךְ
  choice: 你的颈项
  rationale: 该词指颈部；“颈项”自然庄重，也适合本节由身体特征构成的诗歌描写。
- source_word: כְּמִגְדַּל הַשֵּׁן
  choice: 如象牙塔
  rationale: שֵׁן 字面与“牙”有关，但在此结构中指象牙；保留“象牙塔”的鲜明比喻，不添加原文没有的“高耸”等修饰。
- source_word: עֵינַיִךְ בְּרֵכוֹת
  choice: 你的眼睛像……池水
  rationale: 原文是省略系词的隐喻。中文补出“像”使表达自然；בְּרֵכוֹת 指水池或蓄水池，“池水”更能直接呈现眼睛清澈、沉静的诗意形象。
- source_word: בְּחֶשְׁבּוֹן
  choice: 希实本
  rationale: 按地名音译，保留原文的地理指向。
- source_word: עַל שַׁעַר בַּת רַבִּים
  choice: 在巴特拉并门旁
  rationale: 将 בַּת רַבִּים 作为地名音译；עַל 在此为位置关系，译作“在……门旁”。因该短语也可能有描述性含义，另加脚注说明。
- source_word: אַפֵּךְ
  choice: 你的鼻子
  rationale: 此处通常明确指“鼻子”。不改译为较笼统的“面容”，以保留原文具体而大胆的身体意象。
- source_word: כְּמִגְדַּל הַלְּבָנוֹן
  choice: 如黎巴嫩塔
  rationale: 按定冠词和属格结构直译为“黎巴嫩塔”，既可理解为一座特定或理想化的塔，也不武断补成“黎巴嫩的一座塔”。
- source_word: צוֹפֶה פְּנֵי דַמָּשֶׂק
  choice: 朝着大马士革瞭望
  rationale: צוֹפֶה 是主动分词，含从高处观望、眺望之意；פְּנֵי 与地名连用表示朝向。“朝着……瞭望”保留塔楼守望般的动态意象。
