base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/007/014.yaml
  text: The mandrakes give off fragrance[a], and at our doorways are all choice fruits, new as well as old, which I have stored up for you[b], my beloved.
translation:
  language: zh_hans
  text: 风茄散发香气[a]；我们门前有各样佳美果品[b]，有新的，也有陈年的。我的爱人哪，这些都是我为你珍藏的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “风茄”也可称为“爱情果”；这个别称反映了这种植物传统上与爱情和生育的关联。
    reason: lexical_alternative
  - marker: b
    text: “各样佳美果品”也可译作“各样美味”或“各样珍贵之物”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַדּוּדָאִים
  choice: 风茄
  rationale: 这是该植物在现代汉语中的通行名称；上下文所说的香气以及它与爱情、生育的传统关联均与此相符。脚注保留“爱情果”这一带解释性的别称。
- source_word: נָתְנוּ רֵיחַ
  choice: 散发香气
  rationale: 原文直译为“发出香气”；用现代汉语的“散发香气”自然呈现诗中的嗅觉意象。
- source_word: וְעַל פְּתָחֵינוּ
  choice: 我们门前
  rationale: פֶּתַח 指入口或门口，עַל 在此可表达临近或所在之处；“门前”简洁自然，并保留空间画面。
- source_word: כָּל מְגָדִים
  choice: 各样佳美果品
  rationale: מְגָדִים 可指珍贵美好的出产、佳果或美味；在植物与果实的语境中译作“佳美果品”最贴切，同时脚注保留较宽泛的可能含义。
- source_word: חֲדָשִׁים גַּם יְשָׁנִים
  choice: 有新的，也有陈的
  rationale: 保留新旧并列及 גַּם 的递加语气；“陈的”比“旧的”更适合储存果品或美味的语境。
- source_word: דּוֹדִי
  choice: 我的爱人哪
  rationale: 雅歌中 דּוֹדִי 是亲密的爱情称呼；“我的爱人”在现代汉语中自然、庄重，“哪”标明直接呼语。
- source_word: צָפַנְתִּי לָךְ
  choice: 这些都是我为你珍藏的
  rationale: צפן 有藏起、积存、珍藏之意；“珍藏”兼顾储备的具体意义和爱情诗中的珍爱意味。“这些”作为汉语衔接成分，回指前述佳美果品。
theological_decisions: []
translation_notes:
  register: 采用现代、端庄而富有诗意的简体中文。句式清楚流畅，保留香气、门前、新旧珍藏等感官与爱情意象；不把诗中佳果的隐喻具体化，以保存原文的含蓄与张力。
