base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/007/009.yaml
  text: I said[a], “I will climb the palm tree; I will take hold of its branches. May your breasts be like clusters of the vine[b], and the fragrance of your breath like apples.”
translation:
  language: zh_hans
  text: 我说：“我要爬上棕榈树，抓住它的枝条[a]。愿你的双乳如葡萄树上的果串，你鼻子的香气[b]如苹果。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“它的果枝”或“它的果梗”。这个希伯来词可指棕榈树的枝条或结果实的枝梢。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译为“你鼻子的香气”；在此语境中，也可能指与鼻息或面部附近相关的芬芳。
    reason: lexical_alternative
lexical_decisions:
- source_word: תָמָר
  choice: 棕榈树
  rationale: 该词指棕榈树或海枣树；“棕榈树”自然清楚，并保留具体意象。
- source_word: אֶעֱלֶה
  choice: 我要爬上
  rationale: 该动词本义为“上去、升上”；以树为宾语时译作“爬上”最符合现代汉语，且保留说话者的意愿语气。
- source_word: אֹחֲזָה
  choice: 抓住
  rationale: 该词表示抓住、握住；“抓住”鲜明直接，又不额外强化暴力意味。
- source_word: סַנְסִנָּיו
  choice: 它的枝条
  rationale: 罕见词，可能指棕榈树的枝条、果枝或果梗；正文采用较宽泛而易懂的“枝条”，脚注保留具体词义的不确定性。
- source_word: וְיִהְיוּ נָא
  choice: 愿……如……
  rationale: 祈愿式配合 נָא 表达愿望或请求；“愿”准确传达其意愿语气。
- source_word: שָׁדַיִךְ
  choice: 你的双乳
  rationale: 原词明确指乳房；“双乳”符合诗歌语体，不淡化原文的情爱意象。
- source_word: אֶשְׁכְּלֹת הַגֶּפֶן
  choice: 葡萄树上的果串
  rationale: 直译为“葡萄树的串”；补出“果”使汉语读者自然理解为成串的葡萄，同时保留藤蔓意象。
- source_word: רֵיחַ אַפֵּךְ
  choice: 你鼻间的芬芳
  rationale: רֵיחַ 是气味、香气，אַף 通常指鼻子。“鼻间的芬芳”既保留鼻部意象，又避免生硬的“鼻子的香气”；脚注说明也可能理解为鼻息或面部附近散发的香气。
- source_word: כַּתַּפּוּחִים
  choice: 如苹果
  rationale: 传统上译为苹果；具体果种虽有争议，但“苹果”是清楚且通行的译法。
