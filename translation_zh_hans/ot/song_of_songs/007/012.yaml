  text: Come[a], my beloved, let us go out to the countryside[b]; let us spend the night among the villages.
translation:
  language: zh_hans
  text: 来吧，我的良人，我们到田野去；在村庄[a]里过夜。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在凤仙花丛中。”这里的希伯来词通常指“村庄”，但也有人将它与1:14所提到的凤仙花联系起来。
    reason: alternative_reading
lexical_decisions:
- source_word: לְכָה
  choice: 来吧
  rationale: 这是הלך的祈使形式，在此用作邀请。虽然字面可指“走”，但对良人的直接邀约用“来吧”更符合现代汉语，也保留亲昵语气。
- source_word: דוֹדִי
  choice: 我的良人
  rationale: 这是《雅歌》中常见的爱称；“良人”既有诗意和尊重，又能清楚表达女子对所爱之人的称呼。
- source_word: נֵצֵא
  choice: 我们到……去
  rationale: 第一人称复数鼓励式，表达共同的意愿或邀请；“我们到郊野去”自然传达一同离开当前所在之处的意思。
- source_word: הַשָּׂדֶה
  choice: 郊野
  rationale: 字面为“田野”，在本处可集合性地指开阔的乡间。“郊野”简洁、自然，并与后文住宿地点相协调。
- source_word: נָלִינָה
  choice: 过夜
  rationale: 第一人称复数鼓励式，意为住宿一夜。“过夜”是现代汉语中清楚自然的表达。
- source_word: בַּכְּפָרִים
  choice: 在村庄里
  rationale: כְּפָרִים通常是“村庄”的复数，与前面的郊野行程相合。介词בְּ表达所在地点，因此译为“在村庄里”。另有意见把该词与1:14的“凤仙花”联系起来，故以脚注保留这一可能。
theological_decisions: []
translation_notes:
  register: 采用现代、简洁而有诗意的普通话。“来吧，我的良人”保留亲密邀约的语气；两个共同意愿式动词用“我们……去”“过夜”自然呈现。主文采用语境较支持的“村庄”，脚注保留植物解释的词义张力。
