  yaml_path: translation/ot/song_of_songs/007/007.yaml
  text: How beautiful and how delightful you are[a], O love[b], with your pleasures!
translation:
  language: zh_hans
  text: 所爱的人啊，在种种欢愉中，你何其美丽，何其可爱！[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “所爱的人啊”字面可作“爱啊”；也可译作“爱人啊”或“我的爱人啊”。希伯来语אַהֲבָה字面为“爱”，这里用作对女子的称呼；原文没有明说“我的”。“在种种欢愉中”也可译作“带着种种欢愉”或“在悦乐之中”。希伯来语短语很凝练，可指欢愉的范围，也可形容她伴有或带来欢愉。
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה יָּפִית
  choice: 你何其美丽
  rationale: 感叹词מַה与表示美丽的形式连用，表达赞叹而非提问；“何其”既保留感叹力度，也符合庄重的现代汉语诗体。
- source_word: וּמַה נָּעַמְתְּ
  choice: 何其悦人
  rationale: נעם表示令人愉快、可喜可爱；“悦人”保留对阴性单数对象的直接赞美，并与前句形成简洁的平行结构。
- source_word: אַהֲבָה
  choice: 爱情啊
  rationale: 该词字面为“爱情、爱”，此处作呼语；译作“爱情啊”保留原文以抽象名词称呼女子的诗意，不擅自加入原文没有的“我的”。
- source_word: בַּתַּעֲנוּגִים
  choice: 在种种欢愉中
  rationale: 介词בְּ与复数תַּעֲנוּגִים构成紧凑短语，可表示所处范围、状态或伴随情形；正文采用较贴近形式且仍可理解的译法，并用脚注保留其他可能。
theological_decisions:
- issue: אַהֲבָה是否应具体化为“爱人”或“我的爱人”
  choice: 爱情啊
  alternative: 爱人啊／我的爱人啊
  rationale: 原文使用的是“爱、爱情”这一名词，并无明示的第一人称所有关系。保留抽象呼语，可避免把诗句的拟人化和亲密关系过早具体化。
- issue: בַּתַּעֲנוּגִים与前文的关系
  choice: 保留为“在种种欢愉中”并加注
  alternative: 带着种种欢愉／满有欢愉／在悦乐之中
  rationale: 希伯来语短语本身高度凝练，既可理解为欢愉的范围，也可理解为所爱者带来的或具有的欢愉；正文不将其单一定为所有关系或身体魅力。
translation_notes:
  register: 采用现代、庄重而凝练的爱情诗语体。“何其”传达连续两次感叹；“悦人”比口语化的“讨人喜欢”更适合诗歌，同时普通读者仍能理解。标点把“爱情啊”明确处理为呼语，但不消除末尾介词短语的语义张力。
