  terminology: 将אַהֲבָה译为“所爱的人”反映其在本节的称呼功能，而脚注说明其字面义及“爱啊”“爱人啊”等可能性。将נָעַמְתְּ译为“何其可爱”比“悦人”更符合现代汉语，也表达“可喜、愉悦、令人喜爱”的赞美。
