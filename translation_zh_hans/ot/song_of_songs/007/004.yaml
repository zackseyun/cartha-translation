  yaml_path: translation/ot/song_of_songs/007/004.yaml
  text: Your two breasts are like two fawns[b][a], twins of a gazelle.
translation:
  language: zh_hans
  text: 你的双乳好像两只幼鹿，是一只母羚羊所生的双胞胎。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “母羚羊”或译“母鹿”；希伯来语所指为雌性的羚羊或鹿类动物。
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁנֵי שָׁדַיִךְ
  choice: 你的双乳
  rationale: שָׁדַיִךְ明确指受话女子的两个乳房；“双乳”简洁、具体，并保留原诗坦率而雅致的情爱描写。
- source_word: כִּשְׁנֵי עֳפָרִים
  choice: 好像两只幼鹿
  rationale: 比较词כִּ引出明喻；עֳפָרִים指年幼的鹿类动物。“幼鹿”在现代汉语中自然，也不先行限定其具体物种。
- source_word: תָּאֳמֵי
  choice: 所生的双胞胎
  rationale: 该词表示一对同胎而生的幼兽；这样表达既保留配对、对称的意象，也使它与后面的母兽属格关系在汉语中清楚自然。
- source_word: צְבִיָּה
  choice: 一只母羚羊
  rationale: 阴性单数形式指雌性的羚羊或鹿类动物；“母羚羊”保留其语法性别，并符合《雅歌》中常见的羚羊意象。
