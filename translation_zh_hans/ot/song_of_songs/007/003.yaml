base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/007/003.yaml
  text: Your navel is a rounded bowl[a]; may it never lack mixed wine. Your belly is a heap of wheat[c][b], encircled with lilies.
translation:
  language: zh_hans
  text: 你的肚脐如圆形的碗[a]，愿其中不缺调和的酒[b]；你的肚腹如一堆麦子[c]，四周环绕着百合花。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或可译作“你的外阴如圆形的碗”。传统上译为“肚脐”的希伯来词，在这段情色诗歌中的确切所指仍有争议。
    reason: lexical_alternative
  - marker: b
    text: 或译“调有香料的酒”。希伯来语指经过调配的酒，可能掺水，也可能加入香料。
    reason: lexical_alternative
  - marker: c
    text: “肚腹”也可译作“子宫”；这个希伯来词有时可指子宫，但本段语境较可能是在描写外在的腹部。
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁרְרֵךְ
  choice: 你的肚脐
  rationale: 传统且最有词典依据的译法是“肚脐”；在这段由下而上描写身体的诗歌中也衔接自然。鉴于情色语境下可能另有所指，脚注保留争议。
- source_word: אַגַּן הַסַּהַר
  choice: 圆圆的碗
  rationale: אַגַּן 指碗或盆，הַסַּהַר 表示圆形、弧形；“圆圆的碗”既贴近意象，也符合现代汉语诗性表达。
- source_word: אַל יֶחְסַר
  choice: 愿其中不缺
  rationale: 保留希伯来语祈愿式的语气，而不改成平直的陈述句。补出“其中”以使中文所指自然清楚。
- source_word: הַמָּזֶג
  choice: 调和的酒
  rationale: 指经过掺调的酒，可能加水或香料；“调和的酒”贴近原词，同时不限定具体调配方式。
- source_word: בִּטְנֵךְ
  choice: 你的腹部
  rationale: 该词通常指腹部、肚腹，有时也可指子宫；身体外观的连续描写较支持“腹部”。
- source_word: עֲרֵמַת חִטִּים
  choice: 一堆麦子
  rationale: 直接保留原文的农作物比喻；“一堆”自然传达 עֲרֵמָה 的堆积形态。
- source_word: סוּגָה בַּשּׁוֹשַׁנִּים
  choice: 四周环绕着百合花
  rationale: סוּגָה 表示被围住、圈住；此译法自然呈现百合花围绕麦堆的图景。
