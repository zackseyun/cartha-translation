  text: זֹ֤את קֽוֹמָתֵ/ךְ֙ דָּֽמְתָ֣ה לְ/תָמָ֔ר וְ/שָׁדַ֖יִ/ךְ לְ/אַשְׁכֹּלֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/007/008.yaml
  text: This stature of yours is like a palm tree[a], and your breasts are like clusters of fruit.
translation:
  language: zh_hans
  text: 你这身姿好像棕榈树，你的双乳如同累累果串[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“如同一串串葡萄。”希伯来语“串”常指葡萄串，但本节没有明说是哪一种果实。
    reason: 保留אַשְׁכֹּלוֹת可特指葡萄串、也可不限定果实种类的词义空间。
lexical_decisions:
- source_word: זֹאת קוֹמָתֵךְ
  choice: 你这身姿
  rationale: זֹאת指向女子眼前的形体，קוֹמָה可指身高、身量或整体身形；“你这身姿”既保留指示语气，也比单说“身高”更符合诗中的整体形象。
- source_word: דָּמְתָה לְתָמָר
  choice: 好像棕榈树
  rationale: דמה表达“相像”，比较介词לְ在此译为“像”；תָמָר是棕榈树。现代汉语用“好像”自然地再现诗性明喻。
- source_word: וְשָׁדַיִךְ
  choice: 你的双乳
  rationale: שָׁדַיִם明确指女性的双乳；原文是坦率的爱情诗，不以较含混的“胸怀”或“胸脯”弱化其身体意象。
- source_word: לְאַשְׁכֹּלוֹת
  choice: 如同累累果串
  rationale: אַשְׁכֹּלוֹת是复数“串、簇”，常用于葡萄串，但本节没有明说果实种类。“累累果串”保留多串果实的丰满视觉形象，同时不把它限定为葡萄。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而直接的爱情诗语体。“身姿”涵盖身量与体态；“双乳”忠实保留原文的情色身体意象；“累累果串”使复数簇状意象在中文中清晰可感。脚注标记置于“果串”之后，因为词义差异实际涉及אַשְׁכֹּלוֹת，而非“棕榈树”。
