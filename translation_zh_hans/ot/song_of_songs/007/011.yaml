base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/007/011.yaml
  text: I am my beloved's[a], and his desire is for me.
translation:
  language: zh_hans
  text: 我属我的爱人[a]，他也恋慕我。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较贴近原文形式译：“我是归于我的爱人。”原文的介词可表达方向、关联或归属。
    reason: 保留介词 לְ 在无动词句中的形式歧义，同时避免“为了”在现代汉语中可能引起的目的性误解。
lexical_decisions:
- source_word: אֲנִי
  choice: 我
  rationale: 希伯来文明确使用第一人称单数代词，在此带有强调作用，中文保留。
- source_word: לְדוֹדִי
  choice: 属我的爱人
  rationale: 介词 לְ 在无动词句中表达归属或关系；结合《雅歌》2:16、6:3反复出现的相近表述，译为“属我的爱人”自然地传达彼此归属。“爱人”保留 דּוֹד 在本书中的爱情语境。
- source_word: וְעָלַי
  choice: 也……我
  rationale: 介词 עַל 与“恋慕”连用时指向恋慕的对象；中文直接以“我”作宾语最自然。连词 וְ 译作“也”，凸显上下两句的相应关系。
- source_word: תְּשׁוּקָתוֹ
  choice: 他……恋慕
  rationale: תְּשׁוּקָה 表示强烈的欲望、渴慕或恋慕；在爱情诗语境中，用动词“恋慕”比名词式“他的欲望”更自然庄重，同时不削弱其情感强度。后缀 וֹ 由“他”表达。
theological_decisions:
- issue: 关系句 לְדוֹדִי 的含义
  choice: “我属我的爱人”，表达爱情关系中的彼此归属
  alternative: “我是为了我的爱人”或“我归向我的爱人”
  rationale: 原文是无动词句，字面可理解为“我为／归我的爱人”；但本书反复使用的公式表明，其主要诗意是关系上的归属。正文采用自然中文，脚注保留较贴近形式的译法，不引入后来的寓意解读。
- issue: תְּשׁוּקָה 的情感力度
  choice: “恋慕”
  alternative: “渴望”或“欲望”
  rationale: “恋慕”符合男女爱情诗的直接语境，也保留强烈倾向与渴求之意；不借此处理该词在《创世记》3:16、4:7中的解释争议。
translation_notes:
  register: 采用现代、庄重而自然的诗歌语言。“我属我的爱人”呼应《雅歌》中反复出现的爱情宣告；“他也恋慕我”简洁有力，并与上半句形成平衡。
