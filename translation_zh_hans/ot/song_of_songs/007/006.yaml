base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/007/006.yaml
  text: Your head upon you is like Carmel[a], and the flowing hair of your head like purple[c][b]; a king is held captive in the tresses.
translation:
  language: zh_hans
  text: 你的头在你身上高耸如迦密山[a]；你头上垂下的发绺[b]如紫色；君王被缚在发绺中[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “迦密”很可能指迦密山，使人联想到其高耸、秀美的形态。
    reason: cultural_note
  - marker: b
    text: 或译：“你头上的发绺。”这里的希伯来词很少见，可能指垂下或飘动的头发。
    reason: lexical_alternative
  - marker: c
    text: 末句也可译为：“君王被缚在廊道中。”末尾的希伯来词含义难定，也有人理解为“水槽”或“水道”；正文依照上下文的头发意象译为“发绺”。
    reason: alternative_reading
lexical_decisions:
- source_word: רֹאשֵׁךְ עָלַיִךְ
  choice: 你的头在你身上
  rationale: 按空间意义直译“你的头在你上面”，在汉语中略作顺畅处理为“你的头在你身上”，保留头高耸于身躯之上的诗意形象。
- source_word: כַּכַּרְמֶל
  choice: 如迦密山
  rationale: 迦密在此最可能指迦密山；正文补出“山”，使普通中文读者能立即理解地理意象。
- source_word: דַּלַּת רֹאשֵׁךְ
  choice: 你头上垂下的秀发
  rationale: דַּלָּה 是罕见词，在本节通常指垂下或飘动的头发；“垂下的秀发”既体现方向感，也符合现代汉语爱情诗的庄雅语体。
- source_word: כָּאַרְגָּמָן
  choice: 如紫红色
  rationale: אַרְגָּמָן 可指贵重的紫色染料或织物；译作“紫红色”保留颜色及华贵联想，而不武断限定为布料。
- source_word: מֶלֶךְ
  choice: 君王
  rationale: 原文无冠词，可作泛指；汉语“君王”无需强加定指或不定指，亦切合诗体。
- source_word: אָסוּר
  choice: 被……迷住了
  rationale: 字面义为“被捆绑”；在情诗语境中表达君王被秀发俘获。“迷住了”是自然汉语，同时保留受制、无法自拔的隐喻意味。
- source_word: בָּרְהָטִים
  choice: 在那发绺中
  rationale: 该罕见复数词含义不确定。正文依上下文的头发意象理解为发绺，并以“被那发绺迷住”自然表达；其他可能释义收入脚注。
theological_decisions: []
translation_notes:
  register: 采用现代、庄雅而易懂的爱情诗语体。保留迦密山、紫红色和君王受制的浓烈意象；对两个罕见词不作过度确定，在正文采用最合语境的头发释义，并以脚注保存歧义。
