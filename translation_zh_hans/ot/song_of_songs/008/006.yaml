base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/008/006.yaml
  text: Set me as a seal upon your heart[a], as a seal upon your arm; for love is as strong as death, jealousy as relentless as Sheol. Its flashes are flashes of fire[c][b], a flame of Yah.
translation:
  language: zh_hans
  text: 求你把我放在你心上，如同印章；放在你臂上，如同印章。因为爱情如死亡一般强大，嫉妒如阴间一般无情[a]。它的火花是火焰的火花[b]，是雅的烈焰[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “阴间”指亡者所在之境。原文也可理解为：“嫉妒如坟墓一般严酷（或不可抗拒）。”
    reason: 说明שְׁאוֹל的含义，并保留קָשָׁה的其他可行译法。
  - marker: b
    text: “火花”也可译作“闪焰”或“火光”。
    reason: רֶשֶׁף的意象范围包括火焰、火花及火一般的闪光。
  - marker: c
    text: 原文直译为“雅（Yah）的烈焰”；“雅”是“耶和华”这一神名的短式。此短语也可能是一种加强语气的表达，意为“极猛烈的火焰”或“熊熊烈焰”。
    reason: 交代יה的原文形式，并保留该罕见短语可能作最高级表达的解释。
lexical_decisions:
- source_word: שִׂימֵנִי
  choice: 求你把我……放在
  rationale: 这是带第一人称单数宾语后缀的第二人称阳性单数祈使式；用“求你”传达亲密而恳切的请求，用“放在”保留其直接动作。
- source_word: כַחוֹתָם
  choice: 像印章一样
  rationale: חוֹתָם指用于标明归属、身份或认证的印章、印玺；“印章”是现代汉语中清楚自然的对应词，也保留了原文意象。
- source_word: עַל לִבֶּךָ
  choice: 在你心上
  rationale: 直译其诗性位置意象，并与下句“在你臂上”形成平行。
- source_word: עַל זְרוֹעֶךָ
  choice: 戴在你臂上
  rationale: זְרוֹעַ意为“臂膀、手臂”；加入“戴”使印章在手臂上的意象符合自然汉语，同时保留内在之心与外在之臂的对称。
- source_word: כִּי עַזָּה כַמָּוֶת אַהֲבָה
  choice: 因为爱情如死亡一般强大
  rationale: עַזָּה可指强大、猛烈、刚强；“强大”保留爱情与死亡之间鲜明而庄严的比较。
- source_word: קָשָׁה כִשְׁאוֹל קִנְאָה
  choice: 嫉妒如阴间一般无情
  rationale: קִנְאָה可指嫉妒、妒爱、热忱；保留“嫉妒”以呈现爱情要求专一的张力。קָשָׁה有坚硬、严酷、不可撼动之意，“无情”在与阴间的比较中自然表达其不可通融。
- source_word: שְׁאוֹל
  choice: 阴间
  rationale: שְׁאוֹל指亡者所在之境，不仅是坟墓；“阴间”是现代中文圣经语境中较准确且可理解的对应词。
- source_word: רְשָׁפֶיהָ
  choice: 它的闪焰
  rationale: רֶשֶׁף可指火焰、火花或火一般的闪光；“闪焰”兼顾闪射和燃烧的动态意象。“它”保留后缀所指究竟偏向爱情还是嫉妒的诗性含混。
- source_word: רִשְׁפֵּי אֵשׁ
  choice: 烈火的闪焰
  rationale: 保留原文对 רֶשֶׁף 的重复，以维持诗句的强调和节奏；“烈火”自然表达 אֵשׁ 的炽烈语境。
- source_word: שַׁלְהֶבֶתְ יָה
  choice: 耶和华的烈焰
  rationale: יָה是神名的短式。正文用读者熟悉的“耶和华”明确保留神名成分，“烈焰”对应 שַׁלְהֶבֶת 的强烈火焰意象；脚注说明其短式及可能的最高级用法。
theological_decisions:
- issue: שַׁלְהֶבֶתְ יָה 是明确含有神名，还是仅作加强语气的最高级表达
  choice: 正文保留神名，译作“耶和华的烈焰”
  alternative: “极猛烈的火焰”或“熊熊烈焰”
  rationale: 希伯来文本明确出现神名短式 יָה。正文保留这一成分，避免抹去潜在的神学与诗学意味；同时以脚注呈现将其理解为强化表达的可能性。
- issue: קִנְאָה 在爱情诗中应译为“嫉妒”还是弱化为“激情、热爱”
  choice: 译作“嫉妒”
  alternative: “激情”、“热忱”或“妒爱”
  rationale: 该词的词义核心包含排他性的嫉妒或热忱。译作“嫉妒”保留原文的强度及令人不安的张力，不把它平滑处理成单纯正面的情感。
- issue: רְשָׁפֶיהָ 的阴性后缀具体回指爱情还是嫉妒
  choice: 以“它的”保留可能的回指含混
  alternative: 明确译为“爱情的火焰”或“嫉妒的火焰”
  rationale: 原文邻近的“爱情”和“嫉妒”均为阴性名词，诗意上也彼此交织；不在译文中强行限定所指。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。句式保留两组平行结构和火焰意象的重复；“像印章一样”比古雅的“如印玺”更易懂，“戴在你臂上”则使中文动作自然。正文保留“嫉妒”和神名所形成的神学与情感张力，不作宗派化解释。
