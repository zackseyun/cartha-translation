base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/008/012.yaml
  text: My vineyard[a], my very own, is before me. The thousand is for you, Solomon[b], and two hundred for those who keep its fruit.
translation:
  language: zh_hans
  text: 我自己的葡萄园在我面前。[a]所罗门啊，那一千归你，二百归看守它果实的人。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在我面前”也可意为“由我保管”或“由我掌管”。
    reason: lexical_alternative
  - marker: b
    text: 本节原文只说“那一千”和“二百”，没有明说货币单位；上一节提到“一千银子”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּרְמִי שֶׁלִּי
  choice: 我自己的葡萄园
  rationale: כֶּרֶם通常指“葡萄园”；שֶׁלִּי在“我的葡萄园”之后再次强调归属。译作“我自己的葡萄园”，既保留葡萄园意象，也自然传达强调语气，不在正文中消解其可能的隐喻意味。
- source_word: לְפָנָי
  choice: 就在我面前
  rationale: 原义为“在我面前”。“就在”使现代汉语更自然，也保留其可指眼前、由我掌管或在我支配之下的诗性含混。
- source_word: הָאֶלֶף
  choice: 那一千
  rationale: 本节希伯来文只明说“那一千”，未重复货币单位；定冠词又回指上一节的一千银子。因此正文不补出“银子”，以忠实保留原文的省略。
- source_word: לְךָ שְׁלֹמֹה
  choice: 所罗门啊，那一千归你
  rationale: 介词לְ表示分配或归属，且所罗门在此为直接称呼。调整为符合现代汉语的称呼语序，并以“归你”表达其分配、归属之意。
- source_word: וּמָאתַיִם
  choice: 二百
  rationale: 直译数词；如同“那一千”，本节没有明说货币单位，故不擅自补入。
- source_word: לְנֹטְרִים אֶת־פִּרְיוֹ
  choice: 归看守果子的人
  rationale: נטר可指看守、守护；פְּרִי可指果子或出产。译作“看守果子的人”既贴近农业图像，也保留这些人究竟看守葡萄园还是其收益的语义张力。
