base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/008/009.yaml
  text: If she is a wall[a], we will build on her a battlement of silver; but if she is a door[b], we will enclose her with a board of cedar.
translation:
  language: zh_hans
  text: 她若是墙，我们就要在她上面建造一座银塔[a]；她若是门，我们就要用香柏木板把她围护起来[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “银塔”也可译作“银的城垛”。希伯来语所指可能是塔状或设防的建筑构件。
    reason: lexical_alternative
  - marker: b
    text: “围护起来”也可译作“封住”或“守护”。原文动词可有围起、封堵或防守的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: חוֹמָה
  choice: 墙
  rationale: 采用该名词通常的具体含义，保留建筑比喻及其潜在的坚定、防守意味，而不在正文中把隐喻解释为贞洁。
- source_word: נִבְנֶה
  choice: 我们就要……建造
  rationale: 将בנה的Qal未完成式第一人称复数按条件句后的将来行动表达；“就要”自然体现条件与结果的关系。
- source_word: טִירַת כָּסֶף
  choice: 银的城垛
  rationale: טִירָה在此可指设防或塔状的建筑构件；“城垛”与前面的“墙”衔接自然，同时保留加固和装饰的形象。其确切建筑形态存在词义不确定性，故加脚注。
- source_word: דֶּלֶת
  choice: 门
  rationale: 保留该词最普通的具体意义，不泛化为“门户”或“门扇”，使它与“墙”形成原文的对照。
- source_word: נָצוּר
  choice: 把她围住
  rationale: צור可表达围住、封住或防守；结合香柏木板的建筑形象，“围住”较自然，也不把语义限定为军事性的“围攻”。
- source_word: לוּחַ אָרֶז
  choice: 香柏木板
  rationale: לוּחַ指板、木板或板片；“香柏木板”简明而具体，保留原文的材料意象。
- source_word: עָלֶיהָ
  choice: 在她上面／把她
  rationale: 第一处按建筑在墙上加建的图像译为“在她上面”；第二处随汉语“用……围住”的句法处理为宾语“把她”，不机械重复介词。
- source_word: וְאִם
  choice: 她若是
  rationale: 第二个条件句与前句形成对举；汉语无需硬译连接词“而”，平行句式本身已清楚表达对照。
theological_decisions:
- issue: 墙与门的隐喻所指
  choice: 保留“墙”和“门”的具体隐喻，不在正文中明说为贞洁、开放或婚姻资格
  alternative: 将隐喻解释性地译成“她若坚守贞洁／她若容易向人开放”
  rationale: 原文本身使用含蓄的建筑比喻，具体伦理含义需由上下文推知；直译可保存诗歌的多义性和张力，避免把某一种解释写入正文。
- issue: 众说话者行动的性质
  choice: 用“建造”和“围住”呈现，不判定为奖赏、装饰、保护或约束
  alternative: 明确译作“奖赏她／保护她／限制她”
  rationale: 原文动作兼有加建、围护或封闭的可能色彩；正文应保留这种暧昧，不引入特定神学或伦理判断。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留原文简洁的条件式对偶和女性单数代词“她”。“银的城垛”略带诗体色彩但仍可理解；脚注交代טִירָה及צור的真实词义范围。
