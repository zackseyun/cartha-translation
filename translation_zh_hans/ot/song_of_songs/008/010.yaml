base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/008/010.yaml
  text: I am a wall[a], and my breasts are like towers; then I was in his eyes like one who finds peace.
translation:
  language: zh_hans
  text: 我是一堵墙；我的双乳像两座塔楼。于是，在他眼中，我像一个寻得平安的女子。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “寻得平安”也可译作“获得平安”。这里的“平安”还可包含安好、圆满或蒙悦纳的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: חוֹמָה
  choice: 一道墙
  rationale: 该词指墙，语境中很可能是城墙。译作“一道墙”保留简洁、坚固的比喻，不额外限定为防御工事。
- source_word: שָׁדַי
  choice: 我的双乳
  rationale: 希伯来文明确指女子的乳房；“双乳”既准确体现成对的身体意象，也适合诗歌语体。
- source_word: כַּמִּגְדָּלוֹת
  choice: 如同城楼
  rationale: 该复数名词意为塔楼，并与前面的“墙”构成同一建筑意象；中文“城楼”可自然承接城墙图景。
- source_word: אָז
  choice: 那时
  rationale: 既可表示时间上的“那时”，也可能带有承接结果的意味；此译法避免过度判定逻辑关系。
- source_word: הָיִיתִי
  choice: 我……就像
  rationale: היה 在此可表示“是”或语境上的“成为”。正文用“那时，我……就像”自然表达状态，同时不强化为明确的状态转变。
- source_word: בְּעֵינָיו
  choice: 在他眼中
  rationale: 保留希伯来语的身体意象，也自然表达“在他看来、在他评价中”。
- source_word: כְּמוֹצְאֵת
  choice: 就像一个寻得……的人
  rationale: מצא 的阴性单数分词最自然表示“寻找而得着”或“获得”；该译法保留主体为女子，并避免加入原文没有明说的对象关系。
- source_word: שָׁלוֹם
  choice: 平安
  rationale: שָׁלוֹם 可涵盖和平、安好、完整和蒙悦纳等意义。“平安”在现代中文中简洁自然，并由脚注保留其更宽的语义范围。
