base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/008/014.yaml
  text: Flee[a], my beloved[c][b], and be like a gazelle or a young stag on the mountains of spices.
translation:
  language: zh_hans
  text: 快跑吧[a]，我的良人！你要像羚羊或小公鹿[b]一样，在香料山岭上飞奔[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“逃走吧”或“跑开吧”。希伯来语动词本义是逃跑或跑开；在这里的爱情诗意象中，更可能强调像羚羊一样迅速奔跑，而不是因恐惧逃命。
    reason: lexical_alternative
  - marker: b
    text: 或译：“小鹿”。希伯来语原文直译为“群鹿中的幼鹿”，在这里也可理解为年轻的雄鹿。
    reason: lexical_alternative
  - marker: c
    text: 参《雅歌》2:17；那里同样把良人比作羚羊或小公鹿，在山岭上飞奔。
    reason: cross_reference
lexical_decisions:
- source_word: בְּרַח
  choice: 快跑吧
  rationale: 该命令式本义为“逃跑、跑开”。本节以羚羊和幼鹿为喻，重点在迅捷的动作；译作“快跑吧”既保留命令语气和速度感，也避免“逃走吧”在现代汉语中可能产生的恐惧或拒绝意味。
- source_word: דּוֹדִי
  choice: 我的良人
  rationale: 在《雅歌》中，这是女子对男性爱侣的亲昵称呼。“我的良人”既能明确关系，又符合现代中文圣经诗歌庄重而亲密的语体。
- source_word: וּדְמֵה־לְךָ
  choice: 你要像……一样
  rationale: 该结构表达相像、仿佛之意，并带有命令语气。此译法自然清楚；末尾补出“奔跑”，使中文完整，并将比喻与首句的动作相连。
- source_word: לִצְבִי
  choice: 羚羊
  rationale: צְבִי指身姿轻捷优美的羚羊一类动物。“羚羊”是现代汉语中清楚且常用的对应词。
- source_word: לְעֹפֶר הָאַיָּלִים
  choice: 小公鹿
  rationale: עֹפֶר指幼小的动物，הָאַיָּלִים指鹿或雄鹿。结合所比拟的男性爱侣，译作“小公鹿”保留年轻雄鹿的形象；脚注说明也可较宽泛地理解为“小鹿”。
- source_word: הָרֵי בְשָׂמִים
  choice: 香料山
  rationale: בְשָׂמִים泛指香料、香膏或芳香物质。“香料山”简洁地保留原文复数山岭所构成的诗意整体意象，不限定具体植物或香品。
