translation_notes:
  register: 采用现代、自然而有诗意的普通话。首句用感叹号体现结尾呼唤的力度；“良人”“香料山”保持《雅歌》的亲密感与诗歌意象。译文没有把“香料山”寓意化，也不对全书结尾的神学或寓意解释作定论。
