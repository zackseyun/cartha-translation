  text: His left hand is under my head[a], and his right hand embraces me.
translation:
  language: zh_hans
  text: 他的左手在我头下[a]，他的右手拥抱我。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“他的左边……他的右边”；这里按上下文补出“手”。
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂמֹאלוֹ
  choice: 他的左手
  rationale: 该词直指“他的左边／左手”。在拥抱的语境中，现代汉语自然补出“手”；译作“左臂”虽符合情境，却比原词更具体。
- source_word: תַּחַת
  choice: 在……下
  rationale: 直接表达“在下方、在底下”；与“托”搭配，构成自然的现代汉语诗句。
- source_word: רֹאשִׁי
  choice: 我头
  rationale: 按名词及第一人称单数后缀直译；在“我头下”这一结构中不必添加“的”。
- source_word: וִימִינוֹ
  choice: 他的右手
  rationale: 原文为“而／和他的右边（右手）”。与前半句平行，补出“手”既符合汉语习惯，也不把动作限定为较具体的“右臂”。
- source_word: תְּחַבְּקֵנִי
  choice: 将我拥抱
  rationale: חבק意为“拥抱”。未完成式在此描绘当前或持续的亲昵动作，用现代汉语现在时表达，不强行改为过去时。
