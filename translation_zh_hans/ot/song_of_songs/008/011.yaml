base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/008/011.yaml
  text: Solomon had a vineyard at Baal-hamon[a]; he gave the vineyard to keepers[c][b]. Each man was to bring a thousand pieces of silver for its fruit.
translation:
  language: zh_hans
  text: 所罗门在巴力·哈们有一座葡萄园；他把葡萄园交给[a]看守的人。每人要为葡萄园的出产[b]交上一千银子[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “交给”也可理解为“托付给”，即把葡萄园交由他们管理；原文动词本义宽泛，是“给、交给”。
    reason: lexical_alternative
  - marker: b
    text: 原文也可译作“从园中的果实”或“带着各自的出产”；“它的／他的出产”既可回指葡萄园，也可按每个看守者分别理解。
    reason: lexical_alternative
  - marker: c
    text: 原文直译为“一千银”；没有说明具体的银子计量单位。
    reason: cultural_note
lexical_decisions:
- source_word: כֶּרֶם
  choice: 葡萄园
  rationale: 该词指栽培葡萄的园地；本节两处均译作“葡萄园”，准确而自然。
- source_word: הָיָה לִשְׁלֹמֹה
  choice: 所罗门……有
  rationale: 原文直译为“有一座……归所罗门”，是表达所有关系的希伯来语结构；现代汉语用“所罗门……有”最自然。
- source_word: בְּבַעַל הָמוֹן
  choice: 在巴力·哈们
  rationale: 按地名理解并音译；介词表达地点。
- source_word: נָתַן אֶת־הַכֶּרֶם לַנֹּטְרִים
  choice: 他把葡萄园交给看守的人
  rationale: נָתַן的基本义是“给、交给”；在此语境中可包含交托管理之意，但正文不把具体法律关系限定为租赁。
- source_word: לַנֹּטְרִים
  choice: 给看守的人
  rationale: 该词源于“看守、守护”；“看守的人”保留守护葡萄园的核心意义，也不额外断定其租户身份。
- source_word: אִישׁ
  choice: 每人
  rationale: 单数名词在这里具有逐一分配的意义；“每人”自然传达各个看守者分别承担的要求。
- source_word: יָבִא
  choice: 要……交上
  rationale: 未完成式在该安排中表示预期或应当履行的行动；“要”既传达要求，也避免译成直接命令。
- source_word: בְּפִרְיוֹ
  choice: 为园中的出产
  rationale: פְּרִי在农业语境可指果实或出产；代词后缀最自然地回指葡萄园，介词则表示所交银子与出产相关。歧义保留于脚注。
- source_word: אֶלֶף כָּסֶף
  choice: 一千银子
  rationale: 原文只说“一千银”，没有明说舍客勒、银币等计量单位；中文保留这种简略表达，不擅自补定单位。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“巴力·哈们”按地名音译；“看守的人”避免使用可能暗示特定租佃制度的术语。正文保留原文经济安排的简洁性，并用脚注说明“交给”、出产所属关系及银子单位的歧义。
