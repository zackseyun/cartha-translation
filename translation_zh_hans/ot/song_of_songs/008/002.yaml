base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/008/002.yaml
  text: I would lead you and bring you into my mother’s house[a], where she taught me; I would give you spiced wine to drink[b], from the juice of my pomegranate.
translation:
  language: zh_hans
  text: 我愿领你，带你进我母亲的家；她会教导我[a]。我愿给你喝香料调制的酒，也给你喝我石榴的汁[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你会教导我。”希伯来文“教导我”这一动词是第三人称阴性单数，最自然地指“我母亲”；但原文诗句十分简略，也有人将它与所爱的人相连，作不同理解。
    reason: alternative_reading
  - marker: b
    text: 或译：“我石榴的甜酒。”这里的希伯来词可指鲜果汁、甜汁或未完全发酵的新酒。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶנְהָגֲךָ
  choice: 我要引领你
  rationale: נהג的Qal未完成式第一人称单数带第二人称阳性单数后缀。这里与上下文的愿望语气相合；现代汉语以“我要”自然表达说话者所设想、愿意采取的行动。“引领”保留具体带领之意。
- source_word: אֲבִיאֲךָ
  choice: 带你进
  rationale: בוא的Hiphil未完成式第一人称单数带第二人称阳性单数后缀，表示使对方进入；与“我母亲的家”连用时，“带你进”简洁自然。
- source_word: בֵּית אִמִּי
  choice: 我母亲的家
  rationale: 按构词关系直译，并在前面的动作动词中体现אֶל所表达的趋向和进入之意。
- source_word: תְּלַמְּדֵנִי
  choice: 她曾在那里教导我
  rationale: למד的Piel未完成式第三人称阴性单数带第一人称单数后缀，形态上最自然地以“我母亲”为主语。补出“在那里”使简约的诗歌句法在汉语中通顺；“曾”表达母亲过去教导她的回忆。原文句法仍有歧义，另见脚注。
- source_word: אַשְׁקְךָ
  choice: 我要给你喝
  rationale: שקה的Hiphil形式表示使人喝或给人饮用；“给你喝”是现代汉语中自然且不显强迫的表达。
- source_word: מִיַּיִן הָרֶקַח
  choice: 香料调制的酒
  rationale: 该短语指用香料或芳香物调制的酒。“香料调制的酒”清楚保留其调配与芬芳意象。
- source_word: מֵעֲסִיס רִמֹּנִי
  choice: 我石榴的汁
  rationale: עָסִיס可指果汁、甜汁或尚未充分发酵的甜酒。正文采用较宽泛的“汁”，不强行判定是否发酵；“我石榴”依照希伯来文单数及第一人称所属形式。
