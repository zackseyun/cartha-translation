base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/008/004.yaml
  text: 'I adjure you[b][a], daughters of Jerusalem: why should you awaken or stir up love until it desires?'
translation:
  language: zh_hans
  text: 耶路撒冷的女子们啊，我郑重嘱咐你们：何必唤醒爱情，何必惊动它，直到它自己愿意？[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“耶路撒冷的女子们啊，我郑重嘱咐你们：不要唤醒爱情，也不要惊动它，直到它自己愿意。”原文采用疑问式，但在这里具有强烈的劝止意味。
    reason: alternative_reading
  - marker: b
    text: 原文“愿意”是阴性单数，与阴性名词“爱情”呼应，把爱情描写成不能被强迫、须等它自己愿意的对象。
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשְׁבַּעְתִּי
  choice: 我郑重嘱咐你们
  rationale: 该词为שׁבע的使役式，在此表示使人起誓或以誓言郑重告诫。“郑重嘱咐”自然、庄重，并保留强烈的劝诫语气。
- source_word: בְּנוֹת יְרוּשָׁלִָם
  choice: 耶路撒冷的女子们
  rationale: 直译“耶路撒冷的女儿们”在现代汉语中容易被理解为亲属关系；“女子们”保留对城中年轻女性群体的诗性称呼，同时较为自然。
- source_word: מַה
  choice: 何必
  rationale: 保留原文疑问式表达及其反问、劝止的语用力量，不直接改写成明令禁止的“不要”。
- source_word: תָּעִירוּ
  choice: 唤醒
  rationale: 保留“使醒来”的基本意象，用于拟人化的“爱情”自然贴切。
- source_word: תְּעֹרְרוּ
  choice: 惊动
  rationale: 与“唤醒”构成意义相近而不完全重复的诗性并列，体现原文同根动词的加强作用。
- source_word: הָאַהֲבָה
  choice: 爱情
  rationale: 此处指恋爱之情或爱欲；“爱情”比宽泛的“爱”更符合《雅歌》语境，同时不限定其具体表现。
- source_word: עַד שֶׁתֶּחְפָּץ
  choice: 直等它自己愿意
  rationale: חפץ表示愿意、喜悦或有意愿；阴性单数动词与阴性名词“爱情”呼应。“它自己愿意”保留爱情的拟人化，并表达不可强迫其在适当时机之前发动。
theological_decisions:
- issue: 本句是直接禁令还是疑问式劝止
  choice: 以“何必……何必……”保留疑问形式
  alternative: 译作“不要唤醒，也不要惊动”
  rationale: 马所拉文本明确使用מַה；其在誓言式语境中具有劝止作用，但形式仍是疑问或感叹式。正文保留这种张力，脚注说明传统的禁令式理解。
- issue: “爱情”是否被拟人化
  choice: 以“它自己愿意”明确保留拟人化
  alternative: 译作“直到合宜的时候”
  rationale: 原文动词为阴性单数，与הָאַהֲבָה一致；将其改成抽象的“时机成熟”虽顺畅，却会丢失原文让爱情自行决定的诗性表达。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。“何必”承载反问式劝止；重复“何必”使汉语并列自然。“直等”略具文学色彩，与《雅歌》的抒情语域相称。脚注标记均置于正文句末。
