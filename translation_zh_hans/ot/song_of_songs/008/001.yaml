  text: מִ֤י יִתֶּנְ/ךָ֙ כְּ/אָ֣ח לִ֔/י יוֹנֵ֖ק שְׁדֵ֣י אִמִּ֑/י אֶֽמְצָאֲ/ךָ֤ בַ/חוּץ֙ אֶשָׁ֣קְ/ךָ֔ גַּ֖ם לֹא יָב֥וּזוּ לִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/008/001.yaml
  text: Oh[a], that you were like a brother to me, who nursed at my mother’s breasts! If I found you outside, I would kiss you[c][b], and no one would despise me.
translation:
  language: zh_hans
  text: 巴不得你像我的兄弟，由我母亲哺乳长大的！我若在外面遇见你，就会亲吻你[a]，也没有人会轻视我。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 意思是：若他像由同一位母亲哺乳长大的兄弟，她在公开场合亲吻他便不会受到非议。希伯来语末句直译为“他们也不会轻视我”，其中“他们”泛指旁人。
    reason: cultural_note
lexical_decisions:
- source_word: מִי יִתֶּנְךָ
  choice: 巴不得你
  rationale: 希伯来语习语表达强烈愿望，并非询问谁会“给”；“巴不得”自然保留祈愿语气。
- source_word: כְּאָח לִי
  choice: 像我的兄弟
  rationale: כְּ 表示比较而非身份等同；译文保留“像……兄弟”的明喻。
- source_word: יוֹנֵק שְׁדֵי אִמִּי
  choice: 是吃我母亲奶长大的
  rationale: 分词 יוֹנֵק 描写受同一位母亲哺乳的人；此译保留具体的母乳喂养意象，同时符合现代汉语表达。
- source_word: אֶמְצָאֲךָ בַחוּץ
  choice: 我若在外面遇见你
  rationale: 未完成体在愿望语境中可表达假设；“外面”保持地点的宽泛性，并暗示公开场合。
- source_word: אֶשָׁקְךָ
  choice: 就可以亲吻你
  rationale: 动作处于前述愿望和假设之下；“可以”体现她所设想的社会许可，并未给动词添加“公开”等原文没有的方式成分。
- source_word: גַּם לֹא יָבֻזוּ לִי
  choice: 也不会有人轻视我
  rationale: 第三人称阳性复数在此为不定主语，现代汉语自然译作“不会有人”；לִי 在语境中指她成为轻视的对象。
theological_decisions:
- issue: 爱情诗中的兄妹意象与社会习俗
  choice: 保留“像我的兄弟”的比较，并以共同受母亲哺乳说明其社会含义
  alternative: 淡化兄弟意象，或把两人解释为实际血亲
  rationale: 原文以兄弟身份作设想，使公开亲吻不致招来轻视；译文保留诗歌的张力，不据此推导原文未明说的伦理或教义结论。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“巴不得”传达祈愿；“吃我母亲奶长大的”保留原文具体意象；用“亲吻”而非较口语化的“亲”。
