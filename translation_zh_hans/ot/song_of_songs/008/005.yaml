base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/008/005.yaml
  text: Who is this coming up from the wilderness[a], leaning on her beloved? Under the apple tree I awakened you; there your mother was in labor with you[c][b]; there she who bore you was in labor.
translation:
  language: zh_hans
  text: '那从旷野上来、倚着她的良人的是谁？


    在苹果树[a]下，我唤醒了你[b][c]；


    在那里，你母亲生你时经历产痛；


    在那里，生你的那位也经历产痛。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“杏树下”；这个希伯来词所指的具体树种不能确定，“苹果树”是传统译法。
    reason: lexical_alternative
  - marker: b
    text: “唤醒”也可译作“唤起”；在这首爱情诗的语境中，原文可能不只含有从睡眠中叫醒的意思。
    reason: alternative_reading
  - marker: c
    text: 本节中段可能转换了说话者：前半节像是旁观者发问，后半节则转为直接对“你”说话；希伯来文没有明确指出后半节是谁在说。
    reason: alternative_reading
lexical_decisions:
- source_word: עֹלָה
  choice: 上来
  rationale: 该分词通常表示“上去、上来”。“上来”自然保留了朝向说话者或诗歌场景的移动意象。
- source_word: הַמִּדְבָּר
  choice: 旷野
  rationale: 该词可指荒野、旷野或沙漠；“旷野”既涵盖未开垦之地，也符合现代汉语圣经语体。
- source_word: מִתְרַפֶּקֶת עַל
  choice: 倚着
  rationale: 这个罕见的反身形式表达贴近、倚靠或依附。“倚着”保留身体支撑与亲密感，又不过度强化为“紧抱”。
- source_word: דּוֹדָהּ
  choice: 她的良人
  rationale: 《雅歌》中 דּוֹד 指女子所爱的男子。“良人”简洁、庄重，并能作为爱情称谓；此处依汉语习惯省略结构助词，译作“她良人”。
- source_word: תַּחַת הַתַּפּוּחַ
  choice: 在苹果树下
  rationale: תַּפּוּחַ 所指树种不能完全确定；正文采用传统且易懂的“苹果树”，脚注保留“杏树”等可能。
- source_word: עוֹרַרְתִּיךָ
  choice: 我唤醒了你
  rationale: עור 可表示唤醒、唤起或激起。“唤醒”保留基本词义，不把爱情诗语境中可能存在的情欲意味写死。
- source_word: חִבְּלַתְךָ
  choice: 因你经历产痛
  rationale: חבל 在此指分娩时的阵痛或挣扎。“因你经历产痛”传达母亲生此人时受产痛，避免采用把词义限定为“怀孕”的较不可能解释。
- source_word: יְלָדַתְךָ
  choice: 生你的那位
  rationale: ילד 明确涉及生育；“生你的那位”保留分词性称谓，并与前句的“你母亲”构成希伯来诗歌平行。
- source_word: שָׁמָּה ... שָׁמָּה
  choice: 在那里……在那里
  rationale: 保留重复的方位副词，以呈现原文的强调和诗歌平行结构。
theological_decisions:
- issue: 本节后半段说话者与受话者的转换
  choice: 前半句译为旁观式提问，后半句转为第一人称对第二人称直接说话，并以脚注说明说话者未被明示。
  alternative: 把全节都视为耶路撒冷众女子的话，或明确认定后半句是女子对男子说话。
  rationale: 希伯来文从“她的良人”的第三人称描述转为“我唤醒了你”的直接称呼，但没有点明说话者。正文保留这个突转，不用解释性措辞消除诗歌中的开放性。
- issue: עוֹרַרְתִּיךָ 在爱情诗语境中的意味
  choice: 正文译为“唤醒了你”，脚注注明也可理解为“唤起了你”。
  alternative: 直接译成带有明确情欲色彩的“激起了你的情欲”。
  rationale: 原词容许较广的“唤醒、唤起”语义；爱情语境可能赋予更深意味，但正文不应把可能的含义升级为唯一含义。
translation_notes:
  register: 采用现代、庄重而可朗读的诗体汉语。“旷野”“良人”“产痛”保留经文的文学气质，但句法尽量清楚自然。分行呈现后半节的重复和平行；不在正文中确定说话者身份，也不把“唤醒”的潜在情爱意味解释得过满。
