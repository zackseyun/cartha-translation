base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/008/008.yaml
  text: We have a little sister[a], and she has no breasts. What shall we do for our sister on the day when she is spoken for?
translation:
  language: zh_hans
  text: 我们有个年幼的妹妹，还没有乳房。到了有人为她提亲[a]的日子，我们该为妹妹做什么呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“有人谈起她”。希伯来文可泛指关于她的谈论；不过按上下文，很可能是指商谈婚事。
    reason: alternative_reading
lexical_decisions:
- source_word: אָחוֹת לָנוּ
  choice: 我们有个……妹妹
  rationale: 此结构直译为“有一个姐妹属于我们”。现代汉语用“我们有个妹妹”自然地表达所属关系，并结合 קְטַנָּה 所体现的年幼身份译作“妹妹”。
- source_word: קְטַנָּה
  choice: 年幼的
  rationale: 该词可指幼小或年轻；“年幼的”既符合上下文所说的身体尚未成熟，也不武断限定具体年龄。
- source_word: וְשָׁדַיִם אֵין לָהּ
  choice: 还没有乳房
  rationale: 希伯来文表述直接具体，字面意思是“她没有乳房”。“还”依据年幼语境自然传达尚未发育成熟，但正文仍保留原文的具体意象。
- source_word: מַה נַּעֲשֶׂה
  choice: 我们该……做什么呢
  rationale: 第一人称复数未完成式在此表达商议；这一译法符合现代汉语的筹划语气。
- source_word: לַאֲחֹתֵנוּ
  choice: 为妹妹
  rationale: 介词 ל 在此最自然地表示为她采取行动，即“为妹妹”，而非单纯“谈论妹妹”。
- source_word: בַּיּוֹם
  choice: 到了……的日子
  rationale: 保留原文“在那日”的时间结构，同时以自然的现代汉语呈现。
- source_word: שֶׁיְדֻבַּר בָּהּ
  choice: 有人为她提亲
  rationale: 原文是 דבר 的被动式并带 בּ，可表示她被谈及；婚姻语境下很可能指有人为她谈婚事。“提亲”准确传达主要语境意义，同时以脚注保留较宽泛的可能。
