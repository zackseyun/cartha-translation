  register: 采用自然、庄重而易懂的现代标准汉语。正文保留“乳房”这一直接具体的身体用语，不以委婉语削弱原文；对婚姻语境中的含混表达采用“提亲”，并在脚注中保留一般性“谈起她”的读法。
