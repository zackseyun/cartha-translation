  yaml_path: translation/ot/song_of_songs/008/013.yaml
  text: You who dwell in the gardens[a], companions are listening for your voice; let me hear it.
translation:
  language: zh_hans
  text: 住在众园中的女子啊，伙伴们正留心听着你的声音；让我听听吧。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“使我听见。”
    reason: 保留使役命令式的较形式化译法；正文采用更自然的中文请求语气。
lexical_decisions:
- source_word: הַיּוֹשֶׁבֶת
  choice: 住在……中的女子啊
  rationale: 带冠词的阴性单数分词在此作呼语，指向女子；译出持续居住或身处其中的意味，并以“啊”自然呈现呼唤语气。
- source_word: בַּגַּנִּים
  choice: 在众园中
  rationale: 保留原文复数“园子们”；“众园”兼顾诗歌语体与简洁表达，避免擅自改成单数。
- source_word: חֲבֵרִים
  choice: 伙伴们
  rationale: 该词可指朋友或同伴；“伙伴们”保留关系性质，同时不具体限定其身份。
- source_word: מַקְשִׁיבִים
  choice: 都在留心听
  rationale: 使役词干分词表达专注、侧耳而听的持续状态；“留心听”比单纯“听”更能体现专注意味。
- source_word: לְקוֹלֵךְ
  choice: 你的声音
  rationale: קוֹל在直接对人说话的语境中自然指人的声音；如此翻译清楚而不过度解释其是否特指歌声。
- source_word: הַשְׁמִיעִינִי
  choice: 也让我听听吧
  rationale: 阴性单数使役命令式加第一人称单数宾语，字面为“使我听见”；中文用“让我听听吧”自然表达请求，并由上下文补足所听的是她的声音。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而带诗意的呼语。“众园”保留希伯来文复数；“伙伴们”不擅自判定人物身份；末句不把“声音”明确译成“歌声”，以保存原文的开放性。
