  text: מַ֣יִם רַבִּ֗ים לֹ֤א יֽוּכְלוּ֙ לְ/כַבּ֣וֹת אֶת הָֽ/אַהֲבָ֔ה וּ/נְהָר֖וֹת לֹ֣א יִשְׁטְפ֑וּ/הָ אִם יִתֵּ֨ן אִ֜ישׁ אֶת כָּל ה֤וֹן בֵּית/וֹ֙ בָּ/אַהֲבָ֔ה בּ֖וֹז יָב֥וּזוּ לֽ/וֹ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/008/007.yaml
  text: Many waters cannot quench love[a], nor can rivers sweep it away. If a man were to give all the wealth of his house for love, he would be utterly despised.
translation:
  language: zh_hans
  text: 众水不能熄灭爱情，江河也不能把它冲走。若有人拿家中所有的财富换取爱情，他也必被人鄙视[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“人必定鄙视他”。希伯来文用同词根的不定式绝对形和限定动词连用，加强“鄙视”的语气。
    reason: 保留原文主动复数结构的译法，并说明其强调形式。
lexical_decisions:
- source_word: מַיִם רַבִּים
  choice: 众水
  rationale: 保留希伯来诗歌中“大量的水”这一具体意象，不将其窄化为一次特定的洪水。
- source_word: לֹא יוּכְלוּ לְכַבּוֹת
  choice: 不能熄灭
  rationale: כבה常用于熄灭火焰；“熄灭”承接8:6中爱情如火焰的意象，也与水形成鲜明对照。
- source_word: הָאַהֲבָה
  choice: 爱情
  rationale: 本节延续《雅歌》中男女相爱及爱情力量的主题；现代汉语用“爱情”比泛指的“爱”更准确自然。
- source_word: וּנְהָרוֹת
  choice: 江河也不能
  rationale: “江河”保留原文复数的奔流意象；“也不能”自然呈现两个否定平行句。
- source_word: לֹא יִשְׁטְפוּהָ
  choice: 不能把它冲走
  rationale: שטף可指淹没、冲刷或冲走；“冲走”体现江河水势试图压倒并除去爱情的动态力量。
- source_word: אִם יִתֵּן אִישׁ
  choice: 若有人拿
  rationale: 表达假设条件；אִישׁ在此可自然译作泛指的“有人”，无需把现代汉语不必要地限定为男性。
- source_word: כָּל הוֹן בֵּיתוֹ
  choice: 家中所有的财富
  rationale: הוֹן指财富、资财；בֵּיתוֹ可涵盖其家室或产业，译文保留“家中”的原文结构，同时清楚易懂。
- source_word: בָּאַהֲבָה
  choice: 换取爱情
  rationale: 此处介词בְּ带有交换或代价意味；“换取”使交易性的假设在汉语中清晰，同时没有把爱情本身解释为可以买卖。
- source_word: בּוֹז יָבֻזוּ לוֹ
  choice: 他也必被人鄙视
  rationale: 以被动式自然处理原文未明说主语的复数动词；“必”传达不定式绝对形与限定动词连用所表达的强烈语气。
theological_decisions:
- issue: 爱情能否用财富换取
  choice: 保留原文的强烈否定性评价，以“换取爱情……必被人鄙视”呈现
  alternative: 解释为财富本身毫无价值，或将此句专指聘礼、赎价等制度
  rationale: 原文谴责试图以全部家财换取爱情的人，却未明确说明具体制度背景；译文不加入经文未明说的神学或社会制度解释。
translation_notes:
  register: 采用现代、庄重而有诗意的普通话。“众水—江河”“熄灭—冲走”保留希伯来诗句的平行和意象推进；后半节以自然汉语表达假设与强烈的轻蔑评价。
