base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/002/008.yaml
  text: The sound of my beloved! Look[a], here he comes, leaping over the mountains, bounding over the hills.
translation:
  language: zh_hans
  text: 听啊，是我良人的声音[a]！看，他来了，跃过群山，跳过冈陵。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “声音”也可译作“声响”；希伯来语 קוֹל 可指“声音”或“声响”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֣וֹל
  choice: 声音
  rationale: קוֹל既可指“声音”，也可指一般的“声响”。此处可理解为女子听见良人的声音，也可理解为听见他临近时的声响；正文采用自然且保留“嗓音”可能性的“声音”，脚注说明另一解。
- source_word: דּוֹדִי
  choice: 我良人
  rationale: דּוֹדִי在《雅歌》中是女子对所爱男子的亲密称呼。“我良人”凝练、庄重，并符合汉语爱情诗歌的表达。
- source_word: הִנֵּה זֶה
  choice: 看，他
  rationale: הִנֵּה具有唤起注意的作用，זֶה在这里生动地指向正在出现的良人。译作“看，他”比逐字译为“看，这一个”更符合现代汉语。
- source_word: בָּא
  choice: 来了
  rationale: 该形式在此构成生动的临场描写，表示良人正朝女子而来。“来了”自然传达逼近和突然映入眼帘的动态感。
- source_word: מְדַלֵּג
  choice: 跃过
  rationale: 分词描绘轻捷而有力的跨越动作。“跃过”适合山地意象，并与下句形成诗体平行。
- source_word: עַל הֶהָרִים
  choice: 群山
  rationale: עַל与运动动词连用，表示越过山岭；汉语“跃过群山”已自然包含介词关系。复数译为“群山”，富有诗意而不失准确。
- source_word: מְקַפֵּץ
  choice: 跳过
  rationale: 该词与מְדַלֵּג近义，描写连续、轻快的跳跃。“跳过”保留同义平行中的细微措辞变化。
- source_word: עַל הַגְּבָעוֹת
  choice: 冈陵
  rationale: גְּבָעוֹת指较低的丘陵，与“群山”相对。“冈陵”简洁庄重，也能维持诗句的节奏和平行。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而富有抒情色彩的汉语。“听啊”使原文开头无动词的惊叹句在汉语中自然成立；“良人、群山、冈陵”保留诗歌格调，同时保持普通读者可懂。
