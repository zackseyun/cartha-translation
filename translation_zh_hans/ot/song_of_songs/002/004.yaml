  text: He brought me into the house of wine[a], and his banner over me was love.
translation:
  language: zh_hans
  text: '他领我进入酒之屋[a]；

    他在我上方的旗帜，乃是爱。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译“宴会厅”。希伯来文更直译为“酒之屋”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֱבִיאַנִי
  choice: 他领我进入
  rationale: 该词是 בוא 的使役式完成体第三人称阳性单数，并带第一人称单数宾语后缀，意为“使我进去、带我进去”。“领我进入”自然表达使役性的移动，又不把希伯来语完成体过度限定为某一种汉语时态。
- source_word: אֶל
  choice: 进入
  rationale: אֶל 通常表示“向、到”；与移动动词及地点搭配时，此处表达进入目的地，汉语用“进入”最自然。
- source_word: בֵּית הַיָּיִן
  choice: 酒屋
  rationale: 该构造短语直译为“酒之屋”。“酒屋”保留原文具体而简洁的诗歌意象；“宴会厅”虽可能表达语境含义，却加入了原文未明说的宴饮场景，故列入脚注。
- source_word: וְדִגְלוֹ
  choice: 他……的旗帜
  rationale: דֶּגֶל 指旗帜或旌旗。“旗帜”是现代汉语中自然、庄重且能保留公开标志意象的对应词。
- source_word: עָלַי
  choice: 在我上方
  rationale: עַל 在旗帜的空间意象中表示位于“我之上”。“在我上方”清楚保留其空间关系，也避免“罩着我”等解释性扩展。
- source_word: אַהֲבָה
  choice: 爱
  rationale: 该名词无冠词，在句中可作表语或同位成分。“爱”保留原文的简洁与开放性；不补入“他的”，以免消除原文在语法和诗意上的张力。
theological_decisions:
- issue: “旗帜”与“爱”的关系
  choice: 译作“他在我上方的旗帜是爱”
  alternative: “他以爱为旗帜覆庇我”或“他在我上方展开爱的旗帜”
  rationale: 原文仅把“他的旗帜在我之上”与“爱”并置，可能理解为表语或同位说明。所选译法保留这一关系，不额外引入保护、占有或行动等神学或寓意解释。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。分为两行以呈现希伯来诗句的两个分句；保留“酒屋”“旗帜”“爱”的具体意象，不把本节预先解释为宴饮、军事、婚姻或寓意性场景。
