base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/002/003.yaml
  text: Like an apple tree among the trees of the forest[a], so is my beloved among the sons. In his shade I delighted to sit[b], and his fruit was sweet to my taste.
translation:
  language: zh_hans
  text: 苹果树[a]在林木中怎样，我的良人在众男子[b]中也怎样。我满心欢喜地坐在他的荫下；他的果子在我口中甘甜。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “苹果树”所译的希伯来语词具体指哪一种树并不确定；也有人认为是杏树、香橼树或其他果树。
    reason: cultural_note
  - marker: b
    text: “众男子”直译为“众子”。
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּפּוּחַ
  choice: 苹果树
  rationale: 沿用传统且最易识别的译法；原词所指的具体树种并不确定，因此以脚注说明，同时保留芬芳、结果之树在林木中格外可爱的诗意形象。
- source_word: בַּעֲצֵי הַיַּעַר
  choice: 在林木中
  rationale: 简洁表达一棵果树处于众多林木之中的比较关系，符合现代汉语诗体表达。
- source_word: דּוֹדִי
  choice: 我的良人
  rationale: 在《雅歌》中指女子所爱的男子；“良人”自然、庄重，并保留爱情诗的亲昵色彩。
- source_word: בֵּין הַבָּנִים
  choice: 在众男子中
  rationale: בָּנִים字面为“众子”，但此处与女子的良人作同类比较，语境所指是其他男子；正文采用自然明确的现代汉语，字面形式收入脚注。
- source_word: בְּצִלּוֹ
  choice: 在他的荫下
  rationale: 阳性单数后缀既延续树的比喻，又指向良人；用“他的”保留拟人化及双重意象。
- source_word: חִמַּדְתִּי וְיָשַׁבְתִּי
  choice: 我满心欢喜地坐
  rationale: חמד表达渴望、喜爱和以之为乐，ישב表达坐下或安坐；合译为“满心欢喜地坐”兼顾情感意愿与实际动作，避免生硬拆译。
- source_word: וּפִרְיוֹ
  choice: 他的果子
  rationale: 延续良人与果树重叠的比喻，并依阳性后缀译作“他的”。
- source_word: מָתוֹק לְחִכִּי
  choice: 甘甜，合我口味
  rationale: חֵךְ本指上腭、味觉器官；“合我口味”是自然汉语，同时与“甘甜”共同保留具体的味觉意象。
theological_decisions:
- issue: 良人与果树意象之间的关系
  choice: 保留“他的荫下”“他的果子”的诗性比喻，不作寓意化解释
  alternative: 改用“树荫”“树上的果子”，或在正文中指定宗教寓意
  rationale: 原文有意让树的形象与男子良人彼此交叠；译文应保留这种爱情诗中的张力，不把它限定为某种神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的爱情诗语言。“良人”“荫下”略带诗意但仍为普通读者熟悉；分号维系荫庇与果实两幅相连的感官意象。脚注标记均置于其所解释的正文成分之后。
