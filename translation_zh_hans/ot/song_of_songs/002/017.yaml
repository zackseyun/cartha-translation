base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/002/017.yaml
  text: Until the day breathes and the shadows flee[a], turn[b], my beloved—be like a gazelle or a young stag on the mountains of Bether.
translation:
  language: zh_hans
  text: 直到白日吐息、暗影逃遁的时候[a]，转身吧，我的良人；要像羚羊，或像小牡鹿，在比特山岭上[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“直到天色转凉、暗影逃遁的时候。”希伯来文直译为“直到白日吹气（或呼吸）”；这是诗意表达，可能指黄昏凉风吹起，也可能指黎明的清风。
    reason: lexical_alternative
  - marker: b
    text: “比特”可能是地名；也可能意为“分隔之山”，较不可能指“崎岖或裂开的山岭”。
    reason: alternative_reading
lexical_decisions:
- source_word: עַד שֶׁיָּפוּחַ הַיּוֹם
  choice: 等到天风吹起
  rationale: פוח有“吹、呼气”之意，希伯来文把“日子”写得仿佛会呼吸或吹风。中文用“天风吹起”保留风动意象，同时避免生硬的“日子呼吸”；究竟指黄昏凉风还是黎明清风，留在注释中说明。
- source_word: וְנָסוּ הַצְּלָלִים
  choice: 暗影逃遁
  rationale: נוס通常指“逃跑”。“逃遁”保留原文强烈而拟人的动态，不将其弱化为“消失”。
- source_word: סֹב
  choice: 转身吧
  rationale: סבב的命令式基本义是“转、转身”。译作“转身吧”比“回来吧”少一层语境推断，并保持动作命令的简洁。
- source_word: דְּמֵה לְךָ
  choice: 你要像
  rationale: 此处דמה配合ל引出比较对象，直指“像、仿佛”。“你要像”符合现代汉语诗歌表达。
- source_word: דוֹדִי
  choice: 我的良人
  rationale: דוֹדִי是亲密的爱称。“我的良人”庄重而富诗意，也符合《雅歌》的爱情语境。
- source_word: לִצְבִי
  choice: 像羚羊
  rationale: צְבִי指羚羊或瞪羚；“羚羊”是普通中文读者熟悉、简洁的对应词。
- source_word: לְעֹפֶר הָאַיָּלִים
  choice: 或像小牡鹿
  rationale: עֹפֶר指幼小动物，与אַיָּלִים连用表示幼鹿；“小牡鹿”保留其雄性意象，也与羚羊形成自然并列。
- source_word: עַל הָרֵי בָתֶר
  choice: 奔行在比特山上
  rationale: בָתֶר含义不确定，可能是地名，也可能与“分开、切开”有关。正文音译“比特”，避免武断解释；“奔行”承接羚羊和小牡鹿的比喻，使中文句意自然，但它是由语境补出的动作。
