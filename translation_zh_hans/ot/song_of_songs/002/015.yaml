  yaml_path: translation/ot/song_of_songs/002/015.yaml
  text: Catch the foxes for us[a], the little foxes that ruin the vineyards[c][b], for our vineyards are in blossom.
translation:
  language: zh_hans
  text: 替我们捉住狐狸[a]——那些毁坏葡萄园[b]的小狐狸；我们的葡萄园正在开花[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “狐狸”或译“胡狼”。
    reason: lexical_alternative
  - marker: b
    text: “毁坏”或译“糟蹋”。
    reason: lexical_alternative
  - marker: c
    text: “正在开花”或译“花正盛开”；较不可能的译法是“结出嫩葡萄”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶֽחֱזוּ
  choice: 捉住
  rationale: 该词是复数命令式，用于捕捉动物时，“捉住”既自然，也保留了命令的力度。
- source_word: לָנוּ
  choice: 为我们
  rationale: 保留介词及第一人称复数后缀所表达的共同受益者或委托者。
- source_word: שׁוּעָלִים
  choice: 狐狸
  rationale: 这是此词的常见含义，也最符合葡萄园中的动物意象；“胡狼”作为可能译法收入脚注。
- source_word: שׁוּעָלִים קְטַנִּים
  choice: 那些……小狐狸
  rationale: 原文重复“狐狸”并加“小的”，形成强调；中文以“就是那些……小狐狸”保留重复和聚焦效果。
- source_word: מְחַבְּלִים
  choice: 毁坏
  rationale: 分词表示持续造成损害；“毁坏”清楚有力，又不必理解为彻底摧毁。
- source_word: כְּרָמִים
  choice: 葡萄园
  rationale: 该名词通常指葡萄园，而非单株葡萄藤，并与后半句同词呼应。
- source_word: וּכְרָמֵינוּ
  choice: 我们的葡萄园
  rationale: 直译保留连接词所引出的并列或解释关系；中文用分号衔接，不额外加入原文没有明示的因果词。
- source_word: סְמָדַר
  choice: 正在开花
  rationale: 该词最可能指葡萄藤处于开花或初花阶段；“正在开花”自然地表达其生长状态。
theological_decisions: []
