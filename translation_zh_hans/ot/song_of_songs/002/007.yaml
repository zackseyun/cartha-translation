  text: הִשְׁבַּ֨עְתִּי אֶתְ/כֶ֜ם בְּנ֤וֹת יְרוּשָׁלִַ֨ם֙ בִּ/צְבָא֔וֹת א֖וֹ בְּ/אַיְל֣וֹת הַ/שָּׂדֶ֑ה אִם תָּעִ֧ירוּ וְֽ/אִם תְּעֽוֹרְר֛וּ אֶת הָ/אַהֲבָ֖ה עַ֥ד שֶׁ/תֶּחְפָּֽץ־׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/002/007.yaml
  text: 'I adjure you[a], daughters of Jerusalem[c][b], by the gazelles or by the does of the field: do not stir up or awaken love until it pleases.'
translation:
  language: zh_hans
  text: 耶路撒冷的女子们，我指着羚羊或田野的母鹿，郑重嘱咐你们[a]：不要惊动，也不要唤醒爱情，直到它愿意[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “郑重嘱咐”直译可作“使你们起誓”或“叫你们受誓言约束”。这里是诗歌中的起誓告诫用语。“指着羚羊或田野的母鹿”是诗性的誓言格式；也有人认为其中可能含有对神圣称号的谐音，但正文的直接意思是动物意象。
    reason: lexical_and_cultural_note
  - marker: b
    text: 也可译作：“不要惊动，也不要唤醒爱情，直到爱情愿意。”原文把“爱情”当作阴性，并用阴性单数动词回指它。
    reason: alternative_reading
lexical_decisions:
- source_word: הִשְׁבַּעְתִּי אֶתְכֶם
  choice: 我……郑重嘱咐你们
  rationale: 该使役式习语意为使人起誓或以誓言郑重告诫。中文用“郑重嘱咐”自然庄重；并以“指着……”保留誓言结构。
- source_word: בְּנוֹת יְרוּשָׁלִַם
  choice: 耶路撒冷的女子们
  rationale: “女儿们”虽较逐字，却在现代汉语中易被误解为亲属称呼；“女子们”保留对城中女性群体的诗性呼语。
- source_word: בִּצְבָאוֹת
  choice: 指着羚羊
  rationale: 此处 צְבָאוֹת 按上下文和与“田野的母鹿”的平行关系取动物义“羚羊”，不取“军队”义。介词 בְ 在誓言公式中译作“指着”。
- source_word: אוֹ
  choice: 或
  rationale: 保留希伯来语通常的选择连词意义，以及两项动物意象之间的平行结构。
- source_word: בְּאַיְלוֹת הַשָּׂדֶה
  choice: 田野的母鹿
  rationale: אַיְלוֹת 指雌鹿；“母鹿”是现代中文清楚自然的表达，“田野的”则保留原文环境意象。
- source_word: אִם תָּעִירוּ וְאִם תְּעוֹרְרוּ
  choice: 不要惊动，不要唤醒
  rationale: 在郑重告诫的誓言句式中，两个 אִם 表达禁止意味。两个近义动词分别译出，以保存诗歌的重复和加强效果。
- source_word: הָאַהֲבָה
  choice: 爱情
  rationale: 在《雅歌》的男女情爱语境中，“爱情”比泛义的“爱”更明确自然；定冠词无需机械译出。
- source_word: עַד שֶׁתֶּחְפָּץ
  choice: 等它自己愿意
  rationale: 阴性单数动词可回指阴性名词“爱情”。“它自己愿意”保留爱情被拟人化、具有自身意愿的诗意，同时避免将其解释性改写成“到了适当的时候”。
theological_decisions:
- issue: 末句中阴性动词的所指及爱情的拟人化
  choice: 让“它”回指“爱情”，译为“等它自己愿意”
  alternative: 译作“直到爱情愿意的时候”或解释为“直到合宜的时候”
  rationale: 原文语法自然地让阴性动词回指“爱情”，但没有明说某个外在的“适当时机”。主译保留拟人化和时间、意愿之间的诗性张力，不将其教义化或过度解释。
- issue: 羚羊与母鹿是否暗指神的称号
  choice: 正文按动物意象直译
  alternative: 将其视为对神圣称号的文字游戏或委婉指称
  rationale: 直接的句法和平行关系支持动物义。可能的声音文字游戏缺乏足够确定性，不应取代正文的明义。
translation_notes:
  register: 采用现代、庄重而可朗读的诗歌语言。“郑重嘱咐”表达誓言分量而不过分古奥；两个“不要”保存原文平行和强调。“等它自己愿意”以自然现代汉语保留爱情的拟人化及原文未完全限定的含义。
