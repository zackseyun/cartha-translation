  text: דּוֹמֶ֤ה דוֹדִ/י֙ לִ/צְבִ֔י א֖וֹ לְ/עֹ֣פֶר הָֽ/אַיָּלִ֑ים הִנֵּה זֶ֤ה עוֹמֵד֙ אַחַ֣ר כָּתְלֵ֔/נוּ מַשְׁגִּ֨יחַ֙ מִן הַֽ/חֲלֹּנ֔וֹת מֵצִ֖יץ מִן הַֽ/חֲרַכִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/002/009.yaml
  text: My beloved is like a gazelle or a young stag[a]. Look—there he stands behind our wall, gazing through the windows[b], peering through the lattice.
translation:
  language: zh_hans
  text: 我的良人好像羚羊，或像小公鹿[a]。看哪，他站在我们的墙后，透过窗户凝望，从窗格间探看[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “小公鹿”也可译作“鹿的幼崽”。希伯来语表达指鹿类的幼兽；这里采用带雄性意味的译法，与诗中男性良人的形象相称。
    reason: lexical_alternative
  - marker: b
    text: “窗格”指墙面或窗户处有格栅、可供采光和观看的开口，不一定是现代窗户上另装的格子。
    reason: cultural_note
lexical_decisions:
- source_word: דּוֹמֶה
  choice: 好像
  rationale: 该分词表达相似或比较；“好像”自然地保留诗句的明喻。
- source_word: דוֹדִי
  choice: 我的良人
  rationale: 在《雅歌》中指女子所爱的男子；“良人”兼具亲昵和诗意，在现代中文中也较为庄重。
- source_word: לִצְבִי
  choice: 羚羊
  rationale: צְבִי 指羚羊或类似鹿的动物；“羚羊”是现代中文中清楚、常用的对应词。
- source_word: לְעֹפֶר הָאַיָּלִים
  choice: 小公鹿
  rationale: עֹפֶר 指幼小的动物，הָאַיָּלִים 指鹿或雄鹿一类；“小公鹿”既自然呈现幼鹿形象，也与诗中男性良人的描写相合。
- source_word: הִנֵּה זֶה
  choice: 看哪，他
  rationale: 该指示表达引人立即注意眼前人物；“看哪”保留诗歌的鲜明感，“他”按上下文明确所指。
- source_word: עוֹמֵד
  choice: 站
  rationale: 分词呈现正在眼前发生的动作；中文用“站在”即可自然表达这一鲜活场景。
- source_word: אַחַר כָּתְלֵנוּ
  choice: 在我们的墙后
  rationale: 直译其单数名词及第一人称复数后缀，不擅自将墙具体化为房屋外墙或院墙。
- source_word: מַשְׁגִּיחַ מִן הַחֲלּוֹנוֹת
  choice: 透过窗户凝望
  rationale: מַשְׁגִּיחַ 表示留心观看；介词短语在此描写视线经过窗户。“凝望”符合亲密的诗境，又不带“监视”的负面意味。
- source_word: מֵצִיץ מִן הַחֲרַכִּים
  choice: 从窗格间探看
  rationale: מֵצִיץ 描写从较窄处窥探或探望；חֲרַכִּים 指墙面或窗处的狭窄开口、格栅。“窗格间探看”保留具体的建筑和动作意象。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的抒情语言。“良人”“看哪”保留《雅歌》的诗体色彩，其余措辞力求自然。“凝望”与“探看”对应两个希伯来语分词，避免将平行动作压缩为同一种观看。
