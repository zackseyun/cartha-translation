  text: For look[a], the winter has passed; the rain is over and gone.
translation:
  language: zh_hans
  text: 看哪，冬天[a]已经过去；雨已经停了，远去了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “冬天”也可译作“雨季”。这里的希伯来词可更具体地指降雨的季节。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: （不单独译出）
  rationale: 此处承接上文邀请并引出其理由；汉语在本节独立呈现时若直译“因为”会显得悬空，故借整体语势体现连接作用。
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留指示并唤起注意的语气；“看哪”简洁、庄重，也符合诗歌语体。
- source_word: הַסְּתָו
  choice: 冬天
  rationale: 该词可指冬季，尤其是当地的雨季；正文采用自然通行的“冬天”，另以脚注保留“雨季”这一更具体的可能含义。
- source_word: עָבָר
  choice: 已经过去
  rationale: 表达完成的动作，并突出季节如今已经结束。
- source_word: הַגֶּשֶׁם
  choice: 雨
  rationale: 直接对应原文名词；现代汉语无需用定冠词另作标示。
- source_word: חָלַף
  choice: 停了
  rationale: 在雨的语境中自然表达其已经止息，同时与前句“过去”有所变化，避免机械重复。
- source_word: הָלַךְ לוֹ
  choice: 已经远去
  rationale: 保留该习语对前一动词的加强作用，表现雨不仅停止，而且离去；也维持诗句递进而富有画面的平行结构。
