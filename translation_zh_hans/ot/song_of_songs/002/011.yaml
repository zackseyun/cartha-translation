translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“看哪”保留原文的指示强调；后半句以“停了，已经远去”呈现原文两个连续动词的递进。脚注标记置于整节末尾，所注释的是正文中的“冬天”。
