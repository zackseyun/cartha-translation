base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/002/013.yaml
  text: The fig tree has ripened its early figs[a], and the vines in blossom give off fragrance. Arise, my love, my beautiful one[c][b], and come away.
translation:
  language: zh_hans
  text: 无花果树结出了青嫩的果子[a]，葡萄树正在开花，散发馨香[b]。起来吧，我的爱人，我的佳人，走吧[c]！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“无花果树的幼果已经成形。”原文的动词和名词着重果实初期形成的阶段，不一定表示已经成熟。
    reason: lexical_alternative
  - marker: b
    text: 或译：“葡萄树长出幼嫩的葡萄，散发香气。”原词可指葡萄花，也可指刚形成的幼嫩葡萄。
    reason: lexical_alternative
  - marker: c
    text: 原文直译近于“你去吧”或“你为自己去吧”；在这里用作离开的邀请，也可译作“离开这里吧”。
    reason: lexical_alternative
lexical_decisions:
- source_word: חָנְטָה פַגֶּיהָ
  choice: 结出了青嫩的果子
  rationale: 动词与名词合起来描写无花果已经形成、但仍处于早期生长阶段；“结出了青嫩的果子”既保留物候意象，也避免误示果实已经完全成熟。
- source_word: סְמָדַר
  choice: 正在开花
  rationale: 该词可指葡萄花或极幼嫩的葡萄；与“散发馨香”连用时，“正在开花”在汉语中最自然，并贴合春季景象。
- source_word: נָתְנוּ רֵיחַ
  choice: 散发馨香
  rationale: 这是“发出香气”的自然汉语表达；“馨香”保持诗歌体的雅致，同时清楚易懂。
- source_word: קוּמִי
  choice: 起来吧
  rationale: 女性单数命令式在此是温柔的邀请；加入“吧”符合现代汉语语气，而不削弱召唤意味。
- source_word: רַעְיָתִי
  choice: 我的爱人
  rationale: 在《雅歌》的亲密语境中表达爱称；“爱人”自然、庄重，也不额外限定婚姻身份。
- source_word: יָפָתִי
  choice: 我的佳人
  rationale: 表达对女子美丽的亲昵称呼；“佳人”简洁而富有诗意，比“我的美人”更显端雅。
- source_word: וּלְכִי לָךְ
  choice: 跟我走吧
  rationale: 字面近于“你去吧/为自己去吧”，在说话者邀请女子一同离开的语境中，汉语“跟我走吧”自然传达同行邀请，但将字面形式及另一译法保留在脚注中。
theological_decisions: []
translation_notes:
  register: 采用现代、清楚而端雅的诗歌语言。以“青嫩的果子”和“正在开花”呈现春日物候，并通过脚注保留果实发展阶段及葡萄花／幼果的词义张力。两个爱称译为“我的爱人，我的佳人”，保持亲昵而不过度解释人物关系；末句采用自然的同行邀请表达。
