  yaml_path: translation/ot/song_of_songs/002/010.yaml
  text: My beloved answered and said to me, “Rise up, my love, my beautiful one, and come away.”
translation:
  language: zh_hans
  text: '我的良人回应我，对我说：

    “起来吧，我的佳偶，我的美人，走吧！”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דּוֹדִי
  choice: 我的良人
  rationale: 雅歌中指女子所爱的人；“良人”既保留诗歌体裁的庄重感，也符合现代中文圣经语境。
- source_word: עָנָה
  choice: 回应
  rationale: 基本义为“回答、回应”；此处未必是在回答明说的问题，“回应”可保留叙事中的承接关系。
- source_word: רַעְיָתִי
  choice: 我的佳偶
  rationale: 这是对所爱女子的亲昵称呼；“佳偶”自然、庄重，并与婚恋诗歌语境相合。
- source_word: יָפָתִי
  choice: 我的美人
  rationale: 字面为“我的美丽者”，译作“我的美人”简洁自然，保留亲昵称呼。
- source_word: קוּמִי לָךְ ... וּלְכִי לָךְ
  choice: 起来吧……走吧
  rationale: 两个祈使式都带 לָךְ，主要加强邀请或催促语气；用“吧”自然表达，避免机械重复“为自己”。
theological_decisions: []
