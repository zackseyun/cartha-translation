base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/002/014.yaml
  text: My dove[a], in the clefts of the rock, in the hiding place of the cliff, let me see your appearance; let me hear your voice, for your voice is sweet[b], and your appearance is lovely.
translation:
  language: zh_hans
  text: 我的鸽子啊，你在磐石的裂缝里，在峭壁[a]的隐蔽处；让我看见你的样貌[b]，让我听见你的声音，因为你的声音甜美，你的样貌秀美。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “峭壁”所译的希伯来语词较为罕见，也可理解为“陡峭的岩坡”“岩阶”或“悬崖”。
    reason: lexical_alternative
  - marker: b
    text: “样貌”也可译作“外貌”或“面容”；希伯来语可泛指可见的外貌，也可能较具体地指面容。
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹנָתִי
  choice: 我的鸽子啊
  rationale: 直译这一亲昵称呼，保留鸽子的诗歌意象；句末加“啊”使现代汉语呼语自然。
- source_word: בְּחַגְוֵי הַסֶּלַע
  choice: 在磐石的裂缝里
  rationale: חגוי为岩石的裂缝或罅隙；“裂缝”具体易懂，并保留藏身于岩隙的图景。
- source_word: בְּסֵתֶר הַמַּדְרֵגָה
  choice: 在峭壁的隐蔽处
  rationale: סתר表示隐蔽、藏身之处；罕见词מדרגה在此可能指陡峭的岩坡、岩阶或崖壁。“峭壁”自然地呈现地势，同时以脚注保留词义的不确定性。
- source_word: הַרְאִינִי אֶת־מַרְאַיִךְ
  choice: 让我看看你的容姿
  rationale: 使役命令式在语境中表达请求，可自然译作“让我看看”。מראה指可见的外貌、形态或面容；“容姿”比单指脸面的“面容”范围更宽，也符合情歌语体。
- source_word: הַשְׁמִיעִינִי אֶת־קוֹלֵךְ
  choice: 让我听听你的声音
  rationale: 希伯来语字面为“使我听见”，在汉语中用“让我听听”表达亲切而恳切的请求。
- source_word: עָרֵב
  choice: 甜美
  rationale: 该词表示悦人、甘美；“声音甜美”是自然的现代汉语搭配，也保留爱情诗的温柔语气。
- source_word: נָאוֶה
  choice: 秀美
  rationale: 该词表示美丽、可爱；“秀美”具有适度的诗意，并与前句“甜美”形成匀称的表达。
- source_word: מַרְאַיִךְ / מַרְאֵיךְ
  choice: 容姿
  rationale: 两处采用同一译词，以保留原文的词语复现和句内呼应，同时不把意义限定为面部。
theological_decisions: []
translation_notes:
  register: 采用现代、自然而略带诗意的普通话。“啊”“听听”保留恋人呼唤与请求的亲昵语气；两次使用“容姿”维持原文复现，分号则呈现请求与理由之间的结构。
