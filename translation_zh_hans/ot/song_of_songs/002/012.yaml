  text: הַ/נִּצָּנִים֙ נִרְא֣וּ בָ/אָ֔רֶץ עֵ֥ת הַ/זָּמִ֖יר הִגִּ֑יעַ וְ/ק֥וֹל הַ/תּ֖וֹר נִשְׁמַ֥ע בְּ/אַרְצֵֽ/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/002/012.yaml
  text: The blossoms appear in the land; the time of singing has come[a], and the voice of the turtledove is heard in our land.
translation:
  language: zh_hans
  text: 花朵在大地上显现，歌唱的时候已经来到[a]；斑鸠的声音也在我们的土地上响起。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“修剪的时候已经来到。”希伯来语“זָמִיר”既可指“歌唱”，也可指“修剪”；这里因下句提到斑鸠的声音，正文采用“歌唱”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנִּצָּנִים
  choice: 花朵
  rationale: 指春日出现的花朵或花卉；“花朵”自然鲜明，又不局限于尚未开放的花蕾。
- source_word: נִרְאוּ
  choice: 显现
  rationale: 该词的尼法勒式在此表示变得可见、出现；“显现”保留诗意及不及物含义。
- source_word: בָאָרֶץ
  choice: 在大地上
  rationale: אֶרֶץ 可指土地或大地；此处描绘遍地春景，“大地”符合诗歌语境。
- source_word: עֵת הַזָּמִיר
  choice: 歌唱的时候
  rationale: עֵת 表示时候或时节；זָמִיר 可指歌唱，也可能指修剪。结合下句斑鸠的声音，正文采用“歌唱”，并在脚注保留另一解。
- source_word: הִגִּיעַ
  choice: 已经来到
  rationale: 表示时候已到；加入“已经”自然传达希伯来语完成式在此处的到达状态。
- source_word: וְקוֹל
  choice: 声音也
  rationale: קוֹל 可指声音或嗓音；用于鸟鸣时译作“声音”自然，并以“也”体现并列推进。
- source_word: הַתּוֹר
  choice: 斑鸠
  rationale: תּוֹר 特指斑鸠；采用现代汉语中准确而常见的鸟名。
- source_word: נִשְׁמַע
  choice: 响起
  rationale: 字面为“被听见”。汉语诗句中“响起”更自然，也表达其声音在当地可闻，未增添具体鸣叫方式。
- source_word: בְּאַרְצֵנוּ
  choice: 在我们的土地上
  rationale: 保留第一人称复数所属关系及亲切的共同地域感；“土地”避免与前半句“大地”机械重复。
theological_decisions: []
