base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/002/002.yaml
  text: Like a lily among thorns[b][a], so is my beloved among the daughters.
translation:
  language: zh_hans
  text: 如同荆棘中的百合花，我的爱侣[a]在众女子[b]中也是如此。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “爱侣”也可译作“爱人”或“佳偶”；希伯来语兼有亲爱的女子和伴侣之意。
    reason: lexical_alternative
  - marker: b
    text: “众女子”原文直译为“众女儿”，这里可泛指同一群体中的女子。
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּ/שׁוֹשַׁנָּה
  choice: 如同……百合花
  rationale: שׁוֹשַׁנָּה指百合一类的花，但确切植物品种未必可定；“百合花”沿用清楚而熟悉的诗歌意象。前缀כְּ明确表达比喻，译为“如同”。
- source_word: בֵּין
  choice: ……中
  rationale: 该词本义可为“在……之间”，但其宾语为复数群体时，汉语用“在……中”更自然，也准确表达置身一群对象之中的意思。
- source_word: הַ/חוֹחִים
  choice: 荆棘
  rationale: חוֹחִים泛指带刺的植物；“荆棘”简洁、庄重，并保留娇美花朵与刺丛之间的鲜明对照。
- source_word: כֵּן
  choice: 也是如此
  rationale: כֵּן承接上半句的明喻；“也是如此”使汉语比较结构完整流畅，不额外解释比较的具体方面。
- source_word: רַעְיָתִי
  choice: 我的爱侣
  rationale: רַעְיָה在本诗中称呼说话者所爱的女子，也可含伴侣之意；“爱侣”兼顾亲爱与相伴的语义，且符合诗歌语体。
- source_word: הַ/בָּנוֹת
  choice: 众女子
  rationale: בָּנוֹת字面为“女儿们”，在《雅歌》的群体称谓中可泛指女子；“众女子”在现代汉语中自然，并避免被误解为说话者或某一人的亲生女儿。
