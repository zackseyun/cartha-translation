  language: zh_hans
  text: 他的左手在我头下[a]，他的右手拥抱着我。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他的左臂在我头下……他的右臂拥抱着我。”希伯来语中表示“左”和“右”的词，在此可指相应的手、手臂或身体一侧。
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂמֹאלוֹ
  choice: 他的左手
  rationale: 该词本义可指“他的左边”或“他的左手”；在身体动作的语境中，译作“左手”自然明确，同时以脚注保留“左臂”的可能。
- source_word: תַּחַת לְרֹאשִׁי
  choice: 托在我头下
  rationale: תַּחַת 表示“在……下面”，רֹאשִׁי 是“我的头”。加入“托”使汉语姿态自然，但不改变手位于头下、支承头部的具体意象。
- source_word: וִימִינוֹ
  choice: 他的右手
  rationale: 与“左手”形成平行；该词也可按语境理解为“右臂”，故在脚注中说明。
- source_word: תְּחַבְּקֵנִי
  choice: 拥抱着我
  rationale: חבק 表示“拥抱、搂抱”；未完成式在这里描绘正在呈现的亲密场景，“拥抱着我”符合现代汉语表达。
