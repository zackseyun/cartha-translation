base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/002/005.yaml
  text: Sustain me with raisin cakes[a]; refresh me with apples[c][b], for I am sick with love.
translation:
  language: zh_hans
  text: 请用葡萄干饼[a]扶助我，用苹果[b]使我苏醒，因为我相思成病[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“葡萄干制成的饼”，也可能指“压制的葡萄饼”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语这一词传统上译作“苹果”，也可能泛指一种芳香的果实；具体所指的植物尚不能确定。
    reason: cultural_note
  - marker: c
    text: 或译“我因爱而病”或“我害了相思病”。
    reason: lexical_alternative
lexical_decisions:
- source_word: סַמְּכוּנִי
  choice: 扶持我
  rationale: 该复数祈使式表示支撑、托住或使人得以维持；“扶持我”既保留身体软弱的画面，也能涵盖情感上的支撑。
- source_word: בָּאֲשִׁישׁוֹת
  choice: 用葡萄干饼
  rationale: אֲשִׁישׁוֹת 指压制成的果饼，通常理解为葡萄干饼或压制的葡萄饼；正文采用现代读者容易理解的传统译法，并以脚注保留词义范围。
- source_word: רַפְּדוּנִי
  choice: 使我恢复精神
  rationale: רפד 的基本意象可能涉及铺垫、支撑，在本节与食物及“扶持我”平行时，可表达使衰弱者恢复、振作；此译法传达语境中的恢复作用，同时避免生硬直译。
- source_word: בַּתַּפּוּחִים
  choice: 用苹果
  rationale: תַּפּוּחַ 传统译为“苹果”，但具体所指的芳香果实无法确定；正文保留通行译法，脚注说明植物辨识的不确定性。
- source_word: כִּי
  choice: 因为
  rationale: כִּי 在这里引出前面两个请求的原因；“因为”在现代汉语中清楚自然。
- source_word: חוֹלַת אַהֲבָה
  choice: 相思成病
  rationale: 该短语直指因爱而病弱。“相思成病”是自然、凝练而有诗意的现代汉语，保留爱情导致身体不适的强烈隐喻。
- source_word: אָנִי
  choice: 我
  rationale: 独立人称代词强调说话者自身；汉语在“我相思成病”中自然地明示这一主语。
