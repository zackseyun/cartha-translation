lexical_decisions:
- source_word: אֲנִי
  choice: 我是
  rationale: 独立人称代词强调说话者的自我指认；现代汉语自然补出判断词“是”。
- source_word: חֲבַצֶּלֶת
  choice: 番红花
  rationale: 该植物名称所指的确切种类不能确定。“番红花”是较可能的现代辨识，同时脚注保留传统译法“玫瑰”，避免把不确定的植物过度确定化。
- source_word: הַשָּׁרוֹן
  choice: 沙仑的
  rationale: 沙仑是地名，采用汉语圣经传统中通行的音译，并以“的”表达原文的属格关系。
- source_word: שׁוֹשַׁנַּת
  choice: 百合
  rationale: 虽然具体种类也可能有不确定性，“百合”是符合经文用法、广为理解且能保留诗歌花卉意象的译法。
- source_word: הָעֲמָקִים
  choice: 谷中的
  rationale: 原文为复数，泛指谷地或低洼之处；汉语集合性表达“谷中”自然凝练，也与上半句形成诗意平行。
