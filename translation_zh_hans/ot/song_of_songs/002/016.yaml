  yaml_path: translation/ot/song_of_songs/002/016.yaml
  text: My beloved is mine[c][b][a], and I am his—he who grazes among the lilies.
translation:
  language: zh_hans
  text: 我的良人属我，我也属他——那在百合花间放牧的。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “放牧”所译的希伯来语分词也可表示“牧养”或“吃草”；原文没有明说动作的对象。
    reason: lexical_alternative
  - marker: b
    text: “百合花”所指的具体花种不能确定，也可能泛指一种鲜艳美丽的花。
    reason: cultural_note
lexical_decisions:
- source_word: דּוֹדִי
  choice: 我的良人
  rationale: “良人”在现代中文雅正而易懂，能表达女子对爱人的亲密称呼，又不把关系缩减为纯粹的性意味。
- source_word: לִי
  choice: 属我
  rationale: 简洁表达希伯来语所属与关系含义，并与下句形成对称。
- source_word: וַאֲנִי לוֹ
  choice: 我也属他
  rationale: 保留原文彼此相属的平衡与简练；“也”自然呈现对应关系。
- source_word: הָרֹעֶה
  choice: 牧放
  rationale: רעה 的分词可指牧养、放牧，也可指吃草。此处不明说受词；“牧放”保留田园意象及动作的开放性，避免武断地判定是良人自己取食。
- source_word: בַּשּׁוֹשַׁנִּים
  choice: 在百合花间
  rationale: “百合花”承接传统译法且读者熟悉；介词译作“在……间”自然表达置身花丛中的诗意空间。
theological_decisions:
- issue: 句末分词短语的所指与动作含义
  choice: 以分号连接“他在百合花间牧放”，让“他”自然指向良人，同时保留“牧放”未明说受词的含混。
  alternative: 译作“那在百合花间吃草的”或“他在百合花间牧羊”。
  rationale: 原文 הָרֹעֶה 可有“牧养”或“吃草”之义，且未出现明确受词；不应借译文排除任何一种可能，也不引入寓意化解释。
translation_notes:
  register: 采用现代、雅正而简洁的诗歌语体。“我的良人属我，我也属他”保持原文的互属结构；句末保留田园意象与词义张力。
