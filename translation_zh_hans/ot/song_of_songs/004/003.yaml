  yaml_path: translation/ot/song_of_songs/004/003.yaml
  text: Your lips are like a scarlet thread[a], and your mouth is lovely[c][b]. Your temples are like a slice of pomegranate behind your veil.
translation:
  language: zh_hans
  text: '你的嘴唇好像一根朱红的细线；

    你的言语悦人[a]；

    你的两鬓好像一片石榴，

    在你的面纱后[b]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你的口秀美。”这里的希伯来语通常指说话或话语；在本诗描写身体特征的语境中，也可理解为发言之口。
    reason: lexical_alternative
  - marker: b
    text: “在你的面纱后”也可译作“隔着你的面纱”或“从你的面纱后面”。译作“面纱”的希伯来语含义有争议，也可能指发绺或头发。
    reason: alternative_reading
lexical_decisions:
- source_word: כְּחוּט הַשָּׁנִי
  choice: 好像一缕朱红线
  rationale: חוּט可指线、绳或丝缕；以“一缕……线”表达纤细的诗歌意象。שָׁנִי指朱红或猩红染色，“朱红”自然凝练。
- source_word: שִׂפְתֹתַיִךְ
  choice: 你的嘴唇
  rationale: 该词为“唇”的双数形式，现代汉语自然译作“嘴唇”。
- source_word: וּמִדְבָּרֵיךְ
  choice: 你的口
  rationale: מִדְבָּר可涉及说话或言语；在依次描写身体特征的语境中，可能转指发声之口。正文保留身体意象，脚注注明“话语”的可能。
- source_word: נָאוֶה
  choice: 秀美
  rationale: 意为美丽、可爱或悦人；“秀美”符合亲密而庄重的诗歌语体。
- source_word: כְּפֶלַח הָרִמּוֹן
  choice: 好像一片石榴
  rationale: פֶּלַח指切开的一片、裂片或一瓣；“一片石榴”简洁呈现切开的石榴意象，同时避免误解为石榴籽。
- source_word: רַקָּתֵךְ
  choice: 你的两鬓
  rationale: רַקָּה通常指头侧的太阳穴或鬓侧；汉语诗歌中“两鬓”更自然，也贴合从遮盖物后显露的部位。
- source_word: מִבַּעַד לְצַמָּתֵךְ
  choice: 在面纱后
  rationale: מִבַּעַד可表示隔着、透过或从后面；צַמָּה在此传统上理解为面纱，但也可能指发绺。正文采用语境上可辩护的“面纱后”，脚注保留歧义。
