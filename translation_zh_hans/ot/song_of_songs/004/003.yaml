translation_notes:
  register: 采用现代、凝练而庄重的汉语诗体；以分行保留希伯来诗句的平行结构。用“朱红”“秀美”“两鬓”维持雅致但不过分古雅的语感，并通过脚注保留מִדְבָּר、מִבַּעַד和צַמָּה的真实词义歧义。
