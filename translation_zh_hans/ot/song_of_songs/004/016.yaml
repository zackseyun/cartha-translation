  text: ע֤וּרִי צָפוֹן֙ וּ/ב֣וֹאִי תֵימָ֔ן הָפִ֥יחִי גַנִּ֖/י יִזְּל֣וּ בְשָׂמָ֑י/ו יָבֹ֤א דוֹדִ/י֙ לְ/גַנּ֔/וֹ וְ/יֹאכַ֖ל פְּרִ֥י מְגָדָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/004/016.yaml
  text: Awake[a], north wind, and come, south wind! Blow on my garden, so that its spices may flow[c][b]. Let my beloved come into his garden and eat its choice fruits.
translation:
  language: zh_hans
  text: 北风啊，醒来！南风啊，来吧！[a]吹拂我的园子，使园中的香气四溢。[b]愿我的良人进入他的园子，[c]吃其中上好的果子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “北风”和“南风”原文直译为“北方”和“南方”；这里把它们当作能够吹拂园子的风来呼唤。
    reason: lexical_alternative
  - marker: b
    text: “香气”也可译作“香料”；原词既可指芳香之物，也可指其散发的芬芳。
    reason: lexical_alternative
  - marker: c
    text: 原文先说“我的园子”，随后说“他的园子”；这里保留了这一所有格的转换。
    reason: cross_reference
lexical_decisions:
- source_word: ע֤וּרִי
  choice: 醒来
  rationale: 阴性单数命令式，以拟人手法召唤北风；“醒来”保留诗歌中鲜明的呼唤。
- source_word: צָפוֹן / תֵימָן
  choice: 北风 / 南风
  rationale: 原词本义为“北方”和“南方”，但在此受呼唤并吹拂园子，按语境指北风和南风。
- source_word: וּב֣וֹאִי
  choice: 来吧
  rationale: 忠实表达“来”的命令语气，不提前把它解释为“吹来”。
- source_word: הָפִ֥יחִי
  choice: 吹拂
  rationale: 该动词表示吹气或吹风；“吹拂”符合风作用于园子的画面，也比“吹在……上”更自然。
- source_word: גַנִּ֖י
  choice: 我的园子
  rationale: 保留第一人称所有格及园子的亲密诗歌意象。
- source_word: יִזְּל֣וּ בְשָׂמָ֑יו
  choice: 使园中的香气四溢
  rationale: 动词表示流淌、滴流；名词可指香料或其芬芳。中文以“香气四溢”自然传达风使芬芳散发的结果，并用脚注保留具体的“香料”义。
- source_word: יָבֹ֤א דוֹדִי
  choice: 愿我的良人进入
  rationale: “愿”表达未完成式在此的祈愿语气；“良人”是雅歌语境中自然、庄重的爱称。
- source_word: לְגַנּוֹ
  choice: 他的园子
  rationale: 保留原文由“我的园子”转为“他的园子”的所有格变化，不将其抹平。
- source_word: וְיֹאכַל פְּרִי מְגָדָיו
  choice: 吃其中上好的果子
  rationale: 保留“吃”的具体意象；מְגָדִים 表示珍美、上好的出产，并不必然要求最高级。
theological_decisions:
- issue: 园子意象的情爱意味及所有格转换
  choice: 保留含蓄而感性的园子意象，并保留“我的园子”到“他的园子”的转换。
  alternative: 把园子明确解释为宗教寓意，或为行文顺畅统一所有格。
  rationale: 原文直接采用恋人之间的亲密诗歌意象，却没有在本节明说寓意；翻译不应压低其情爱意味，也不应加入特定教义解释。所有格的转换呈现双方彼此相属的张力，应予保留。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“北风啊……南风啊……”保留呼语节奏；“良人”与《雅歌》的抒情语域相称。“香气四溢”避免生硬的“香料流淌”，同时以脚注保存原词的具体义。
