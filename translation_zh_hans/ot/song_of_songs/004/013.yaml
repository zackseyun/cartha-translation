  text: Your shoots are an orchard of pomegranates with choice fruits, henna with nards.
translation:
  language: zh_hans
  text: 你的嫩枝如一座石榴园，园中有上好的果实，有指甲花和甘松。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׁלָחַיִךְ
  choice: 你的嫩枝
  rationale: 该词指从植物伸展或萌发之物，可理解为枝条、新芽或所发出的生长物；结合园圃意象译作“嫩枝”，既自然，也不把诗中的身体隐喻解释得过死。
- source_word: פַּרְדֵּס
  choice: 一座……园
  rationale: 指栽种果木的园圃；与“石榴”连用，译成“石榴园”。
- source_word: פְּרִי מְגָדִים
  choice: 佳美的果实
  rationale: מְגָדִים 表示珍贵、上好、令人喜爱的出产；“佳美”兼顾价值与感官意味。
- source_word: כְּפָרִים
  choice: 指甲花
  rationale: 此处为 henna 的复数，指指甲花植株或花簇；采用现代汉语中较易理解且植物学上准确的名称。
- source_word: נְרָדִים
  choice: 甘松
  rationale: 复数指甘松香料植物或其香品；汉语通常以集合名词“甘松”表达，不强加数量。
theological_decisions:
- issue: “嫩枝”所承载的身体与生育隐喻
  choice: 保留园圃和植物意象，不在正文中明说具体身体部位或后代
  alternative: 译作“你所生的”或明确解释为身体部位
  rationale: 原诗以含蓄的园圃语言赞美女子，所指可有多层联想；直译意象可保存诗意与真实歧义。
translation_notes:
  register: 采用现代、庄重而有诗意的普通话。“如一座石榴园”使比喻关系清晰；“结满”自然传达园中伴有丰美果实的景象，同时不扩展为原文没有的神学解释。
