base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/004/008.yaml
  text: Come with me from Lebanon[a], my bride; with me from Lebanon, come. Look from the summit of Amanah, from the summit of Senir and Hermon, from lions’ dens[b], from mountains of leopards.
translation:
  language: zh_hans
  text: 我的新娘，来吧，和我一同离开黎巴嫩；来吧，和我一同离开黎巴嫩。请从亚玛拿的山顶眺望[a]，从示尼珥[b]的山顶和黑门的山顶，从狮子的洞穴，从有豹子的群山眺望。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这个希伯来语动词的含义有争议；也可能指从这些高处下来或离开。
    reason: lexical_alternative
  - marker: b
    text: “示尼珥”是黑门山脉一带的古称。
    reason: cultural_note
lexical_decisions:
- source_word: אִתִּי מִלְּבָנוֹן
  choice: 同我离开黎巴嫩
  rationale: אִתִּי意为“同我”，מִן表示起点“从”；汉语用“离开”自然表达从黎巴嫩而来的邀请，同时保留两次重复。
- source_word: כַּלָּה
  choice: 我的新娘
  rationale: 这是对女子的称呼；原文未带第一人称后缀，但在亲密呼语中译作“我的新娘”符合汉语习惯和上下文关系。
- source_word: תָּבוֹאִי
  choice: 来吧
  rationale: 该未完成式在邀请语境中带劝请意味；“来吧”比单纯将来时更自然，也不过度强化命令语气。
- source_word: תָּשׁוּרִי
  choice: 你要……眺望
  rationale: 此词词义有困难，可理解为从高处观看；正文采用“眺望”，并以脚注保留“下来”的移动性解释。
- source_word: מֵרֹאשׁ
  choice: 从……山顶
  rationale: רֹאשׁ用于山岳时指顶峰；“山顶”是准确而自然的现代汉语表达。
- source_word: אֲמָנָה
  choice: 亚玛拿
  rationale: 地名按希伯来语音译。
- source_word: שְׂנִיר
  choice: 示尼珥
  rationale: 古地名按希伯来语音译；其与黑门山脉的关系另以脚注说明。
- source_word: חֶרְמוֹן
  choice: 黑门
  rationale: 沿用现代中文圣经读者熟悉的地名译法。
- source_word: מִמְּעֹנוֹת אֲרָיוֹת
  choice: 从狮子的洞穴
  rationale: מְעוֹנוֹת指居所、巢穴；此处“洞穴”保留险峻野兽栖居地的意象。
- source_word: מֵהַרְרֵי נְמֵרִים
  choice: 从豹子出没的群山
  rationale: 原文直译为“豹子的群山”；加入“出没”使汉语意象清楚自然，而不改变山中有豹子的含义。
theological_decisions:
- issue: 本节是否作寓意化解释
  choice: 保持男女之间的诗性呼唤，不在正文加入寓意对象
  alternative: 明确解释为上帝与其子民或基督与教会
  rationale: 原文本节直接呈现新郎对新娘的邀请；更广的神学应用不应被写入译文本身。
- issue: תָּשׁוּרִי所表达的动作
  choice: 正文译为“眺望”
  alternative: 译为“下来”或“启程”
  rationale: 词义和句中动作关系存在真实的不确定性；正文采用较直接的观看义，同时用脚注保留移动性理解，避免消除原文张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。保留“同我离开黎巴嫩”的重复，以呈现原诗的呼唤和节奏；地名不作解释性改写，猛兽与高山的危险意象保持鲜明。
