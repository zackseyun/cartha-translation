revisions:
- from: 同我离开黎巴嫩吧，我的新娘；同我离开黎巴嫩来吧。你要从亚玛拿山顶眺望[a]，从示尼珥[b]和黑门山顶眺望，从狮子的洞穴、豹子出没的群山眺望。
  to: 我的新娘，来吧，和我一同离开黎巴嫩；来吧，和我一同离开黎巴嫩。请从亚玛拿的山顶眺望[a]，从示尼珥[b]的山顶和黑门的山顶，从狮子的洞穴，从有豹子的群山眺望。
  rationale: 修订保留原文两次“与我／从黎巴嫩”的呼唤性重复，并以自然平行的现代汉语消除“离开……来”的生硬搭配。正文仍选择“眺望”对应有争议的动词，脚注保留下降或离开的可能，避免将争议消除。“有豹子的群山”去除了“出没”所添加的动态解释。
