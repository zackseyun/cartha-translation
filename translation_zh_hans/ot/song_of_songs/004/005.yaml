lexical_decisions:
- source_word: שְׁנֵי שָׁדַיִךְ
  choice: 你的双乳
  rationale: 原文明确使用数词“二”；“双乳”在现代汉语中自然、凝练，并与下文“两只”相呼应。
- source_word: כִּשְׁנֵי
  choice: 好像两只
  rationale: 前缀כְּ表示比拟；希伯来语是无动词句，汉语用“好像”自然表达比较关系。
- source_word: עֳפָרִים
  choice: 小鹿
  rationale: 该词指鹿类动物的幼崽；“小鹿”通俗而富有诗意，也不把物种限定得超过原文。
- source_word: תְּאוֹמֵי
  choice: 一对孪生小鹿
  rationale: 该构造形式意为“……所生的孪生子”；补出“小鹿”使汉语指代清楚，并保留成双、相称的意象。
- source_word: צְבִיָּה
  choice: 母羚羊
  rationale: 该阴性名词可指雌性羚羊或较宽泛的母鹿类动物；正文采用“母羚羊”，以呼应《雅歌》中反复出现的羚羊意象，同时用脚注保留词义范围。
- source_word: הָרֹעִים
  choice: 吃草
  rationale: 分词描写动物觅食或放牧的状态；“吃草”比生硬的“牧放”更符合现代汉语，也保持田园画面。
- source_word: בַּשּׁוֹשַׁנִּים
  choice: 在百合花间
  rationale: שׁוֹשַׁנִּים传统且合理地译作“百合花”；介词在此表达置身花丛之中，用“花间”自然传神。
