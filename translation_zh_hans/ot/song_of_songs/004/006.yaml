base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/004/006.yaml
  text: Until the day breathes and the shadows flee[b][a], I will go to the mountain of myrrh and to the hill of frankincense.
translation:
  language: zh_hans
  text: 直到白昼吐息、阴影逃遁[a]，我要[b]往没药山去，往乳香冈去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “白昼吐息”也可理解为“风吹起来”或“天气转凉”；这幅景象可能指晚风吹起，也可能指黎明来到。
    reason: lexical_alternative
  - marker: b
    text: “我要……去”原文也可较直地表达为“我要为自己去”；其中“为自己”可能只是加强语气，并不一定另有独立含义。
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד שֶׁיָּפוּחַ הַיּוֹם
  choice: 直到白昼吐息
  rationale: 保留פוח“呼吸、吹气”的诗性拟人，也保留时段究竟指晨曦初现还是晚风吹起的含混；“白昼”较“日子”更适合此处与影子相对的景象。
- source_word: וְנָסוּ הַצְּלָלִים
  choice: 影儿逃遁
  rationale: נוס本义为“逃跑、逃遁”，用“逃遁”保留鲜明动态；“影儿”自然而有诗意，与复数הַצְּלָלִים相称。
- source_word: אֵלֶךְ לִי
  choice: 我要……去
  rationale: אֵלֶךְ是第一人称“我要去”；לִי是利益与格或强调性与格，可加强主体意味，却未必表达另一个独立概念，因此正文不硬译为“为自己”或“离去”，另以脚注说明。
- source_word: הַר הַמּוֹר
  choice: 没药山
  rationale: 按构造关系直译，保留没药这一具体芳香树脂意象，不作寓意化解释。
- source_word: גִּבְעַת הַלְּבוֹנָה
  choice: 乳香冈
  rationale: לְבוֹנָה特指乳香；גִּבְעָה低于הַר，用“冈”与前句“山”形成自然区分，并保持诗句简洁。
theological_decisions:
- issue: 是否在译文中明确没药山和乳香冈所象征的对象
  choice: 保留字面的诗性意象，不在正文中指明所喻
  alternative: 直接译成爱人的身体意象，或解释为退隐、敬拜之所
  rationale: 希伯来文本没有明说意象的指涉；保持开放可避免把情色、寓意或宗教解释预先写入正文。
- issue: “白昼吐息”具体指清晨还是傍晚
  choice: 保留时间上的含混
  alternative: 译作“天破晓”或“晚风吹起”
  rationale: 动词和上下文容许黎明来临或晚风吹起等理解；正文保留拟人表达，脚注交代主要可能。
translation_notes:
  register: 采用现代、庄重而可诵读的诗歌语体。“吐息”保存原文拟人，“影儿”使汉语表达自然灵动；以“没药山／乳香冈”形成平行且区分山与冈。脚注标记均置于正文对应位置。
