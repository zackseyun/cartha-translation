base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/004/012.yaml
  text: A locked garden is my sister[a], my bride; a locked spring[b], a sealed fountain.
translation:
  language: zh_hans
  text: 锁闭的园子，是我的姊妹，我的新娘；锁闭的泉[a]，封住的泉源[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “锁闭”也可译作“关闭”；原文两处使用同一个词。
    reason: lexical_alternative
  - marker: b
    text: 译作“泉”的希伯来词在别处也可意为“堆”；但这里与“泉源”平行，按水源之义理解更为合适。
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּן
  choice: 园子
  rationale: 基本义为供栽种、观赏的园子；封闭之意由后面的 נָעוּל 表达，不重复加入名词本身。
- source_word: נָעוּל
  choice: 锁闭的
  rationale: 该被动分词表示被关上或锁住；“锁闭”既保留限制进入的鲜明意象，也可自然修饰园子和泉，并在两处重复以对应希伯来文。
- source_word: אֲחֹתִי
  choice: 我妹妹
  rationale: 原文直译为“我的姊妹/妹妹”，在《雅歌》中是亲昵称呼；保留亲属称谓，不将其解释性改写。现代汉语在男性对女性的称呼中用“妹妹”自然且符合诗歌语境。
- source_word: כַלָּה
  choice: 我的新娘
  rationale: 该词意为“新娘”；补出“我的”与前面的“我妹妹”形成自然的同位称呼，也符合原文关系。
- source_word: גַּל
  choice: 泉
  rationale: 该词在别处可指“堆”或“波浪”，但此处与 מַעְיָן 平行，水源之义最合语境；用“泉”简洁地保留诗歌意象。
- source_word: מַעְיָן
  choice: 泉源
  rationale: 该词指涌流的水源；译作“泉源”与前一分句的“泉”形成近义平行，同时避免完全重复。
- source_word: חָתוּם
  choice: 封住的
  rationale: 该被动分词意为“被封印、封住”；此译保留与“锁闭”有别而彼此呼应的安全、专属意象。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。保留“我妹妹，我的新娘”的亲昵同位称呼，以及“锁闭”在两处的原文重复；用量词“一座、一眼、一道”使意象在现代汉语中自然清晰。
