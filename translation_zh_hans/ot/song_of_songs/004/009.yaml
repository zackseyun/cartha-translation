base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/004/009.yaml
  text: You have captured my heart[a], my sister, my bride; you have captured my heart with one glance of your eyes[c][b], with one jewel of your necklace.
translation:
  language: zh_hans
  text: 我的姊妹，我的新妇，你夺去了我的心[a]；只凭你眼中的一瞥[b]，只凭你颈上一件饰物[c]，就夺去了我的心。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“你使我心醉”。原文动词很少见，表达佳偶强烈地触动或征服了说话者的心。
    reason: lexical_alternative
  - marker: b
    text: 原文直译近于“你眼中的一个”；意思很可能是“一次眼神”或“一瞥”。
    reason: lexical_alternative
  - marker: c
    text: 也可译“你颈上的一条链饰”或“你颈饰中的一件”。原文可能指项链、链饰，或颈上饰物中的一个部分。
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבַּבְתִּנִי
  choice: 你夺去了我的心
  rationale: 该动词罕见，表示佳偶强烈触动、压倒性地吸引了说话者的心。“夺去了我的心”既保留“心”的意象和情感力度，也符合现代汉语诗性爱情表达；原文的重复予以保留。
- source_word: אֲחֹתִי
  choice: 我的姊妹
  rationale: 按原文直译。在《雅歌》中这是亲密的爱称，译文不把它解释为生物学上的亲属关系。
- source_word: כַלָּה
  choice: 我的新妇
  rationale: 保留婚恋和新娘的意涵；与“我的姊妹”并列，维持原文直接称呼的诗体。
- source_word: בְאֶחָד מֵעֵינַיִךְ
  choice: 你双眼的一顾
  rationale: 原文形式近于“你眼中的一个”，语境所指很可能是一次眼神或一瞥，而非只用一只眼睛。“双眼的一顾”自然地保留了眼目意象和单次凝望的含义。
- source_word: בְּאַחַד עֲנָק מִצַּוְּרֹנָיִךְ
  choice: 你颈上一件饰物
  rationale: עֲנָק 指颈饰、项链或链饰，后接的形式与颈项或颈上饰物有关。此译法不武断限定其为宝石、链条或整条项链，并自然表达“一件”的单数含义。
