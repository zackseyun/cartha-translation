base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/004/002.yaml
  text: Your teeth are like a flock of shorn ewes that have come up from the washing[a], all of them bearing twins[b], and none among them has lost her young.
translation:
  language: zh_hans
  text: 你的牙齿如一群剪过毛的母羊，洗净后走上来；个个成双[a]，其中没有一只丧子的[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“个个都是双生的。”羊成双的画面暗示牙齿成对、整齐而完整。
    reason: lexical_alternative
  - marker: b
    text: 原文沿用母羊的比喻，说没有一只母羊丧子，借此含蓄表达牙齿一颗也不少。
    reason: cultural_note
lexical_decisions:
- source_word: שִׁנַּיִךְ
  choice: 你的牙齿
  rationale: 直接译出对女子牙齿的称呼，不添加原文没有的“洁白”或“象牙般”等修饰。
- source_word: כְּעֵדֶר הַקְּצוּבוֹת
  choice: 如一群剪过毛的母羊
  rationale: עֵדֶר 指羊群等小型牲畜的群；הַקְּצוּבוֹת 是阴性复数被动分词，指剪过毛的羊。补出“母羊”既符合后续阴性形式，也使中文意象清楚。
- source_word: שֶׁעָלוּ מִן הָרַחְצָה
  choice: 洗净后走上来
  rationale: 保留羊洗过后上来的具体牧野画面；“洗净后”在现代中文中比直译“从洗濯上来”自然，同时不把“洁白”明说出来。
- source_word: שֶׁכֻּלָּם מַתְאִימוֹת
  choice: 个个成双
  rationale: מַתְאִימוֹת 表示成对或双生。此译保留羊群意象中的双生含义，也自然暗示牙齿排列成对、整齐完整。
- source_word: וְשַׁכֻּלָה אֵין בָּהֶם
  choice: 其中没有一只丧子的
  rationale: שַׁכֻּלָה 本义为丧子、失去幼崽的。译文保留母羊的比喻层面，而不直接改写成“没有缺一颗牙”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而可读的诗歌语言。保留原文从牙齿转入母羊群的完整比喻，不把隐含意义直接替换为解释性陈述；分号帮助中文读者把主要比喻与后续描述连贯起来。
