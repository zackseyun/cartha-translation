  naturalness: “你的眼睛在面纱后面，如同鸽子”可以理解，但“在……后面”略显方位描写；“隔着面纱”更自然地表达眼睛透过或从遮蔽物后显现的画面。修订后的末句避免了山羊“奔流”的搭配问题。
  terminology: “我的爱人”适切传达 רַעְיָתִי 的亲密而不限定婚姻身份的称呼；“面纱”可作为对有争议的 צַמָּה 的暂定译法，脚注保留“发辫／头发”等可能性。“基列山”保留专名及原文单数表达。
