base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/004/001.yaml
  text: Look[a], you are beautiful, my darling; look, you are beautiful. Your eyes are doves behind your veil[b]. Your hair is like a flock of goats streaming down from Mount Gilead.
translation:
  language: zh_hans
  text: 看哪，我的爱人，你真美丽！看哪，你真美丽！你的眼睛隔着面纱[a]，如同鸽子。你的头发像一群从基列山奔下来的山羊。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “面纱”所译的希伯来词含义不确定，也可能指发辫或头发；前面的介词可表达“隔着”或“从……后面”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנָּךְ
  choice: 看哪，你真
  rationale: 该形式是带第二人称阴性单数后缀的指示、感叹表达；“看哪”保留诗歌中鲜明的惊叹语气，“真”使现代汉语表述自然。
- source_word: יָפָה
  choice: 美丽
  rationale: 直接表达外貌之美，现代、庄重且通俗。
- source_word: רַעְיָתִי
  choice: 我的爱人
  rationale: 此词在《雅歌》中是男子对女方的亲昵称呼；“爱人”既表达亲密关系，也保持诗体的端庄，且不额外限定婚姻身份。
- source_word: עֵינַיִךְ יוֹנִים
  choice: 你的眼睛……如同鸽子
  rationale: 希伯来文是无系词的直接并置。汉语若直译为“眼睛是鸽子”容易被理解为实体等同，故用“如同”清楚保留比喻功能。
- source_word: מִבַּעַד לְצַמָּתֵךְ
  choice: 在面纱后面
  rationale: מִבַּעַד 表示隔着或从遮蔽物后面可见；“在……后面”自然呈现半遮半露的画面。צַמָּה 词义有争议，此处按较可能的“面纱”译出，并以脚注保留其他可能。
- source_word: שַׂעְרֵךְ
  choice: 你的头发
  rationale: 采用该名词通常而明确的汉语对应。
- source_word: כְּעֵדֶר הָעִזִּים
  choice: 像一群山羊
  rationale: 保留原文田园景象；现代汉语以“一群”搭配山羊最自然。
- source_word: שֶׁגָּלְשׁוּ
  choice: 奔流而下
  rationale: 该动词描写向下滑落、流动的动态；“奔流而下”能同时呈现山羊群沿山坡而下与长发倾泻的视觉效果。
- source_word: מֵהַר גִּלְעָד
  choice: 从基列山
  rationale: 按原文单数地貌名称译为“基列山”，不扩展为整个基列山区。
theological_decisions: []
translation_notes:
  register: 采用现代标准普通话的诗体表达，保持亲密、庄重和可朗读性。重复两次“看哪，你真美丽”以保存原文的强调；动物与地貌意象均按原文保留。脚注标记紧随存在词义争议的“面纱”。
