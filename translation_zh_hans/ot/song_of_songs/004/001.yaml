revisions:
- from: 看哪，我的爱人，你真美丽！看哪，你真美丽！你的眼睛在面纱[a]后面，如同鸽子。你的头发像一群山羊，从基列山奔流而下。
  to: 看哪，我的爱人，你真美丽！看哪，你真美丽！你的眼睛隔着面纱[a]，如同鸽子。你的头发像一群从基列山奔下来的山羊。
  rationale: 仅作两项安全的语言与意象修订：以“隔着”更贴切表达遮蔽物后的可见状态；以“从基列山奔下来的”保留山羊群下行的动态，避免“奔流”所带来的水流含义。脚注继续标注相关名词和介词的词义争议。
