  text: מַה יָּפ֥וּ דֹדַ֖יִ/ךְ אֲחֹתִ֣/י כַלָּ֑ה מַה טֹּ֤בוּ דֹדַ֨יִ/ךְ֙ מִ/יַּ֔יִן וְ/רֵ֥יחַ שְׁמָנַ֖יִ/ךְ מִ/כָּל בְּשָׂמִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/004/010.yaml
  text: How beautiful your love is[a], my sister, my bride! How much better your love is than wine[b], and the fragrance of your oils than all spices!
translation:
  language: zh_hans
  text: 我的妹妹，我的新娘，你的爱情多么美好[a]！你的爱情比酒好得多；你膏油的馨香胜过一切香料[b]！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “爱情”也可译作“爱抚”；希伯来语 דֹדַיִךְ 可指以身体亲昵表达的爱。本节两处相同。
    reason: lexical_alternative
  - marker: b
    text: “膏油”很可能指带香气的油或香膏。
    reason: cultural_note
lexical_decisions:
- source_word: מַה יָּפוּ
  choice: 多么美好
  rationale: מַה在此引出赞叹而非疑问；“多么美好”自然传达对爱情之可爱、可喜的赞美。
- source_word: דֹדַיִךְ
  choice: 你的爱情
  rationale: דֹדִים在《雅歌》中可指爱情，也可指以身体亲昵表达的爱；正文用“爱情”保留较宽的诗意范围，并在两处保持一致，脚注说明另一可能。
- source_word: אֲחֹתִי כַלָּה
  choice: 我的妹妹，我的新娘
  rationale: 逐一保留两个亲昵称谓，不合并为复合词；“妹妹”在此是爱侣间的称呼。
- source_word: מַה טֹּבוּ ... מִיַּיִן
  choice: 比酒好得多
  rationale: מִן构成比较，טוב表达优越、可喜；“好得多”既直接又符合现代汉语的赞叹语气。
- source_word: וְרֵיחַ שְׁמָנַיִךְ
  choice: 你膏油的馨香
  rationale: שֶׁמֶן字面为油，此处结合香气指用于身体的芳香膏油；“馨香”适合正面的诗歌语境，同时保留具体意象。
- source_word: מִכָּל בְּשָׂמִים
  choice: 胜过一切香料
  rationale: בְּשָׂמִים指芳香材料或香料；“胜过”补足希伯来语承前省略的比较关系。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而自然的抒情汉语。保留原文两次“爱情”的重复、两个爱称以及酒、膏油、香料等具体诗歌意象；分号呈现后半句两个比较结构的连贯关系。
