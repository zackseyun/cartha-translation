base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/004/015.yaml
  text: A spring of gardens[a], a well of living water[c][b], and streams flowing from Lebanon.
translation:
  language: zh_hans
  text: 众园的泉源[a]，活水的井[b]，从黎巴嫩流淌而来的水流[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “泉源”也可译作“泉眼”。“众园”依照希伯来文的复数形式；整句也可理解为供应园圃的泉源。
    reason: lexical_alternative
  - marker: b
    text: “活水”是希伯来语的说法，指新鲜、流动而非停滞的水。
    reason: cultural_note
  - marker: c
    text: 希伯来文直译近于“从黎巴嫩流淌的”；这里补出“水流”，也可译作“从黎巴嫩流来的溪水”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מַעְיַן
  choice: 泉源
  rationale: 该词指天然涌出的泉或水源。“泉源”既保留源头的意象，也适合本节诗歌语体。
- source_word: גַּנִּים
  choice: 众园
  rationale: 希伯来文明确为复数；“众园”保留这一形式，虽在中文中略带诗意，却不把复数悄然改成单数。
- source_word: בְּאֵר
  choice: 井
  rationale: 通常指井；译作“蓄水池”会偏向储存的静水，与下文鲜活流动的水相冲突。
- source_word: מַיִם חַיִּים
  choice: 活水
  rationale: 这是希伯来语对新鲜、流动之水的惯用表达。“活水”保留原文鲜明的文学意象，并以脚注说明其本义。
- source_word: וְנֹזְלִים
  choice: 流淌而来的水流
  rationale: 复数分词表达正在流动、淌下的水；中文需补出中心名词“水流”，同时保留动态感和复数性的集合意味。
- source_word: מִן לְבָנוֹן
  choice: 从黎巴嫩……而来
  rationale: 忠实表达水流的来源；不额外强调地势或赋予象征意义。
theological_decisions:
- issue: 是否在正文补出“你是”
  choice: 不补出主语和系词，保留三个并列名词短语
  alternative: 你是众园的泉源，是活水的井，是从黎巴嫩流淌而来的水流
  rationale: 希伯来文本节本身没有明说主语或系词。上下文虽可理解为继续描写女子，但正文采用诗歌式名词并列，可避免把语境推断写成明示内容。
translation_notes:
  register: 采用简洁、庄重的现代汉语诗歌语体，以三个名词短语并列呈现原文。保留“众园”“活水”等源文意象；脚注解释不够直观的希伯来表达。所有脚注标记均已置于正文相应位置。
