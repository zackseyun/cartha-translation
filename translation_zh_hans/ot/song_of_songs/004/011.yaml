base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/004/011.yaml
  text: Your lips drip honeycomb[a], bride; honey and milk are under your tongue[b], and the fragrance of your garments is like the fragrance of Lebanon.
translation:
  language: zh_hans
  text: 新娘啊，你的双唇滴下蜂房的蜜[a]；你的舌下有蜜与奶[b]。你衣裳的芬芳，如黎巴嫩的芬芳。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“蜂巢蜜”。这里的希伯来语 נֹפֶת 比本节后面的“蜜”一词更具体。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语的次序是“蜜与奶”，不是较为熟悉的“奶与蜜”。
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹפֶת
  choice: 蜂房的蜜
  rationale: 此词比后文较通用的 דְּבַשׁ 更具体，指蜂房中流出的蜜；译作“蜂房的蜜”既保留两种希伯来语蜜词的差别，也能与“滴下”自然搭配。
- source_word: תִּטֹּפְנָה
  choice: 滴下
  rationale: נטף 表示液体滴落或流滴；“滴下”简洁、生动，并保留原诗具体而感性的意象。
- source_word: שִׂפְתוֹתַיִךְ
  choice: 你的双唇
  rationale: 原文是带第二人称阴性单数后缀的双数形式；“双唇”在现代汉语诗性表达中自然准确。
- source_word: כַּלָּה
  choice: 新娘
  rationale: 在本歌中，这是带有婚礼意象的爱称；“新娘”准确、通行，也不额外限定婚姻阶段。
- source_word: דְּבַשׁ וְחָלָב
  choice: 蜜与奶
  rationale: 依照原文次序译为“蜜与奶”，不改成熟悉的固定说法“奶与蜜”，从而保留本节自身的措辞和节奏。
- source_word: תַּחַת לְשׁוֹנֵךְ
  choice: 你的舌下
  rationale: 直译其空间关系，汉语简洁自然，并保留具体的感官意象。
- source_word: רֵיחַ
  choice: 芬芳
  rationale: 上下文明确表达悦人的气味；“芬芳”比中性的“气味”更贴合爱情诗的正面语境，同时仍属现代常用语。
- source_word: שַׂלְמֹתַיִךְ
  choice: 你衣裳
  rationale: 该复数名词指衣物或外衣；“衣裳”兼具可读性和适度诗意，避免“袍服”所带来的过度具体化。
- source_word: כְּרֵיחַ לְבָנוֹן
  choice: 如黎巴嫩的芬芳
  rationale: 保留黎巴嫩这一地理与诗歌意象，不把它解释性改写为香柏或山林气息；重复“芬芳”也对应原文 רֵיחַ 的重复。
