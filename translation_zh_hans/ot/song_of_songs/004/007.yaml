  yaml_path: translation/ot/song_of_songs/004/007.yaml
  text: You are altogether beautiful[a], my beloved[c][b], and there is no blemish in you.
translation:
  language: zh_hans
  text: 我的爱人啊，你全然美丽[a]，毫无瑕疵[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你浑身都美丽”或“你的一切都美丽”。
    reason: lexical_alternative
  - marker: b
    text: “瑕疵”也可译作“缺陷”或“斑点”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כֻּלָּךְ
  choice: 全然
  rationale: 该词带第二人称阴性单数后缀，涵盖女子整个人；“全然”既保留全面、完整的强调，也符合现代汉语诗体表达。
- source_word: יָפָה
  choice: 美丽
  rationale: 这是现代汉语中直接、自然且庄重的对应词，清楚表达外貌与整体之美。
- source_word: רַעְיָתִי
  choice: 我的爱人
  rationale: 在《雅歌》中，此词是男子对女子的亲密称呼；“我的爱人”自然地保留爱情关系和呼语语气，同时不过分口语化。
- source_word: וּמוּם
  choice: 毫无瑕疵
  rationale: מוּם指缺陷、残损或瑕疵；“瑕疵”适合审美语境，“毫无”则与否定存在句相配，使汉语表达流畅。
- source_word: אֵין בָּךְ
  choice: 毫无……
  rationale: 希伯来语意为“在你里面没有”；汉语用“毫无瑕疵”简洁自然，并保留绝对否定的力度。
