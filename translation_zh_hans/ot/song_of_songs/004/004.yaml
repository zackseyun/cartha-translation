base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/004/004.yaml
  text: Your neck is like the tower of David[a], built in rows of stone; a thousand shields hang on it[b], all the small shields of the warriors.
translation:
  language: zh_hans
  text: 你的颈项好像大卫的塔，按层砌成[a]；塔上悬挂着一千面盾牌[b]，都是勇士所用的盾牌。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “按层砌成”所对应的希伯来词（תלפיות）十分罕见，确切含义不明；也可理解为“为军械库而建”或“建有垛口”。
    reason: lexical_alternative
  - marker: b
    text: 本节先后用了两个不同的希伯来词表示防护装备：מָגֵן和שֶׁלֶט。两者都可指盾牌，但后一个词所指的具体类型并不确定。
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּמִגְדַּל דָּוִיד
  choice: 好像大卫的高塔
  rationale: כְּ明确标示比喻；מִגְדַּל דָּוִיד是“大卫的塔”。译作“高塔”符合现代汉语习惯，并保留建筑意象。
- source_word: צַוָּארֵךְ
  choice: 你的颈项
  rationale: 直接保留爱情诗中的身体比喻；“颈项”庄重而清楚。
- source_word: בָּנוּי
  choice: 砌成
  rationale: 该词是בנה的被动分词，意为“被建造”。结合石塔意象，“砌成”比泛泛的“建成”更具体自然。
- source_word: לְתַלְפִּיּוֹת
  choice: 由层层石块
  rationale: תלפיות是罕见词，确切含义不明；正文采用与精心砌筑高塔相符的理解，同时以脚注保留“为军械库而建”“建有垛口”等可能解释。
- source_word: אֶלֶף הַמָּגֵן
  choice: 一千面盾牌
  rationale: 单数形式מגן在数词后具有集合意义；汉语以量词“面”自然表达复数盾牌。
- source_word: תָּלוּי עָלָיו
  choice: 塔上悬挂着
  rationale: 分词表达静态画面；明确“塔上”可避免汉语代词指向颈项时产生突兀感，同时未改变原诗所比拟的对象。
- source_word: שִׁלְטֵי
  choice: 盾牌
  rationale: שלט可能指某类盾牌，但原文并未明确说其较小；正文不补入“小”，脚注说明与前一个盾牌词不同，以保存词汇差异和不确定性。
- source_word: הַגִּבּוֹרִים
  choice: 勇士
  rationale: גברים在此指英勇强健的战士；“勇士”简洁、自然，并契合诗中的军事意象。
