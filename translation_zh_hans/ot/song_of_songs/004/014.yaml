  text: nard and saffron[a], calamus and cinnamon, with all the trees of frankincense, myrrh and aloes[e][d][c][b], with all the finest spices.
translation:
  language: zh_hans
  text: '甘松和番红花[a]，菖蒲和肉桂，


    连同一切乳香树；


    没药和沉香[b]，


    连同一切上等香料。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “番红花”也常称“藏红花”。
    reason: lexical_alternative
  - marker: b
    text: 这里的“沉香”指芳香的沉香木，并非芦荟。
    reason: cultural_note
lexical_decisions:
- source_word: נֵרְדְּ
  choice: 甘松
  rationale: 指一种芳香植物或由其制成的香料；“甘松”是现代中文较准确、简洁的名称。
- source_word: כַרְכֹּם
  choice: 番红花
  rationale: 标准植物名称，所指为贵重芳香香料saffron；较“藏红花”更中性准确。
- source_word: קָנֶה
  choice: 菖蒲
  rationale: 本节为香料清单，此词在这里指芳香的茎秆或香蒲；采用中文圣经语境中通行的“菖蒲”，避免泛译为普通芦苇。
- source_word: קִנָּמוֹן
  choice: 桂皮
  rationale: 所指为肉桂类香料；“桂皮”自然易懂，也符合香料清单的语境。
- source_word: עִם כָּל עֲצֵי לְבוֹנָה
  choice: 连同一切乳香树
  rationale: 尽量保留希伯来文“一切……树”的具体树木意象，而不只译作乳香这种树脂。
- source_word: מֹר
  choice: 没药
  rationale: 该芳香树脂的标准中文圣经译名。
- source_word: אֲהָלוֹת
  choice: 沉香
  rationale: 在古代香料语境中可能指沉香木，而非现代所说的芦荟；中文“沉香”比音译或“芦荟”更能表达其芳香木材属性。
- source_word: רָאשֵׁי בְשָׂמִים
  choice: 上等香料
  rationale: 字面为“香料之首”，是指精选、最佳的香料；“上等香料”在现代中文中自然传达其优等含义。
