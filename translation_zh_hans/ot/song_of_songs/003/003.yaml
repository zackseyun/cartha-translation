  yaml_path: translation/ot/song_of_songs/003/003.yaml
  text: 'The watchmen who go about the city found me: “Have you seen the one whom my soul loves?”[a][b]'
translation:
  language: zh_hans
  text: 在城中巡行的守望者遇见了我：“你们看见我心所爱的人了吗？”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在城中巡行的”也可译作“在城中来回巡视的”。
    reason: lexical_alternative
  - marker: b
    text: “我心所爱的人”：希伯来文直译为“我生命所爱的那一位”；这是《雅歌》中反复出现的诗性表达。
    reason: lexical_alternative
lexical_decisions:
- source_word: מְצָאוּנִי
  choice: 遇见了我
  rationale: מצא在此可指“找到”或“遇见”。叙事中女子正在城里寻找，守望者与她相遇；“遇见了我”在现代汉语中自然，也不暗示他们先前特意寻找她。
- source_word: הַשֹּׁמְרִים
  choice: 守望者
  rationale: 该词是שמר的带冠词分词，用作名词，指夜间看守城邑的人。“守望者”既符合城中夜巡的场景，也保留诗歌的庄重语体。
- source_word: הַסֹּבְבִים בָּעִיר
  choice: 在城中巡行的
  rationale: סבב表示环行、四处走动；结合守望者的身份，“巡行”自然传达持续走遍城中的动作，而不过度引入现代警务色彩。
- source_word: אֵת שֶׁאָהֲבָה נַפְשִׁי
  choice: 我心所爱的人
  rationale: 原文直译近于“我生命所爱的那一位”。现代汉语以“我心所爱的人”较自然，并保留亲密而诗性的表达；脚注说明נפש的原文字面意象。
- source_word: רְאִיתֶם
  choice: 你们看见……了吗
  rationale: ראה的第二人称阳性复数完成式在这里构成直接问句；“看见……了吗”符合女子向一群守望者询问近期所见的现代汉语表达。
