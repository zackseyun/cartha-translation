  terminology: חֶרֶב宜译为“剑”而非现代汉语中可泛指多种刃兵器的“刀剑”。“利剑”在中文中自然，并不额外限定武器性质。大腿处的佩剑图景以“挂在大腿旁”表达，保留原文身体部位及武器位置的意象。
