base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/003/008.yaml
  text: All of them are holding swords[a], trained in warfare; each man has his sword at his thigh because of terror in the nights.
translation:
  language: zh_hans
  text: 他们全都手持利剑，训练有素，善于征战；各人都把剑挂在大腿旁，因夜间的恐惧[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文“夜”是复数，直译可作“在众夜中”。这可能是诗意地强调夜间反复或普遍存在的危险。
    reason: 说明בַּלֵּילוֹת的复数形式及其可能的诗意作用。
lexical_decisions:
- source_word: כֻּלָּם
  choice: 他们个个
  rationale: 明确表达带代词后缀的整体范围，同时自然引出这群护卫中的每一个人。
- source_word: אֲחֻזֵי חֶרֶב
  choice: 手持刀剑
  rationale: 保留“握持、执持”武器的具体形象；“刀剑”在现代汉语中可自然表示所佩的剑类兵器。
- source_word: מְלֻמְּדֵי מִלְחָמָה
  choice: 受过征战训练
  rationale: 该被动分词表示经过教导或训练；“征战训练”既保留军事含义，也符合现代汉语表达。
- source_word: אִישׁ
  choice: 人人
  rationale: 这里是复数群体之后的分配性单数，强调每一个人；“人人”简洁自然。
- source_word: חַרְבּוֹ עַל יְרֵכוֹ
  choice: 都把刀佩在大腿旁
  rationale: 保留武器位于大腿处、随时可以拔出的图景；“佩”自然传达携带在身侧的状态。
- source_word: מִפַּחַד
  choice: 因为……恐怖
  rationale: מִן在此按原因理解；“恐怖”保留פַּחַד较强的惊惧或可怕威胁之感，不限定它只指主观情绪。
- source_word: בַּלֵּילוֹת
  choice: 夜间
  rationale: 希伯来语虽用复数，但可泛指夜间发生的危险；正文采用自然现代汉语，复数信息留在脚注说明。
