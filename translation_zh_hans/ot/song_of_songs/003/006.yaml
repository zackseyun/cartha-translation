base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/003/006.yaml
  text: Who is this coming up from the wilderness like columns of smoke[a], perfumed with myrrh and frankincense[c][b], from every fragrant powder of the merchant?
translation:
  language: zh_hans
  text: 那从旷野[c]上来、如一柱柱烟[a]，被没药、乳香和商人各样香粉熏香的，是谁[b]？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“如缕缕上升的烟。”原词描写柱状或羽状升腾的烟。
    reason: lexical_alternative
  - marker: b
    text: 也可译作：“那从旷野上来的女子是谁？”希伯来语“这”采用阴性形式，暗示所指为女性。
    reason: lexical_alternative
  - marker: c
    text: “旷野”也可译作“沙漠”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי זֹאת
  choice: 是谁
  rationale: 希伯来语是疑问词加阴性指示代词，直译为“这是谁”。中文采用“那……的是谁”的诗性问句，性别信息另以脚注说明，以免正文生硬增补“女子”。
- source_word: עֹלָה
  choice: 上来
  rationale: 保留עלה所表达的向上移动，也符合现代汉语对队伍或人物从旷野而来的自然表述。
- source_word: מִן הַמִּדְבָּר
  choice: 从旷野
  rationale: מִדְבָּר可指旷野或沙漠；“旷野”语义较宽，不强加遍地沙土的景象。
- source_word: כְּתִימֲרוֹת עָשָׁן
  choice: 如一柱柱烟
  rationale: תִּימֲרוֹת描绘向上升腾的柱状或羽状烟气；“一柱柱烟”简洁保留复数与垂直上升的意象。
- source_word: מְקֻטֶּרֶת
  choice: 熏香
  rationale: 该被动分词在此表示由焚烧芳香物而使之带香；“熏香”既保留熏烟过程，也符合中文诗歌表达。
- source_word: מוֹר וּלְבוֹנָה
  choice: 没药、乳香
  rationale: 分别采用这两种芳香树脂的通行中文名称。
- source_word: מִכֹּל אַבְקַת רוֹכֵל
  choice: 商人各样香粉
  rationale: אַבְקָה本义为粉末或尘粉，在语境中是芳香粉末；רֹכֵל指商贩或行商。“商人各样香粉”保留所属关系及“各种”的范围意义，并自然融入“用……熏香”的结构。
theological_decisions:
- issue: 说话者所见对象的性别是否在正文中明说
  choice: 正文不增补“女子”，以脚注指出阴性形式
  alternative: 译作“那从旷野上来的女子是谁？”
  rationale: 原文阴性指示代词暗示所指为女性，但并未出现“女子”这一名词；正文保留诗句的指示性悬念，脚注交代语法信息，不将隐含信息提升为明说。
translation_notes:
  register: 采用现代、庄重而易懂的诗体问句。“那……的是谁”保留原文先描写、后追问的悬念；“一柱柱烟”呈现复数的升腾意象；标点与脚注顺序按中文阅读位置安排。
