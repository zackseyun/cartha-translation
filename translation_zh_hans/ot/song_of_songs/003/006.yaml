    rationale: מְקֻטֶּרֶת是被动分词，描述所见者被香料熏香、带着香气；改用“被……熏香的”更忠实且语义明确。
  - severity: low
    issue: 脚注b将阴性指示代词说明为“这／那”，不够精确。
    rationale: זֹאת的基本指示义为“这（位，阴性）”；中文正文为配合倒装诗句可用“那”，但脚注宜明确原词本身的语法与基本含义。
