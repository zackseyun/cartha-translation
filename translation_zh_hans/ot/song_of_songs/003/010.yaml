base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/003/010.yaml
  text: He made its pillars of silver[a], its back of gold, its seat of purple[c][b]; its interior was inlaid with love by the daughters of Jerusalem.
translation:
  language: zh_hans
  text: 他用银做轿柱，用金做靠背[a]，用紫色织物做座位[b]；轿内铺陈着来自耶路撒冷众女子的爱情[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “靠背”所译的希伯来词罕见，含义不确定；也可理解为“底座”或“支托”。
    reason: lexical_alternative
  - marker: b
    text: 或译“乘坐处”或“轿体”；这个希伯来词可较宽泛地指乘坐的部分或车辆构造。
    reason: lexical_alternative
  - marker: c
    text: 或译“轿内由耶路撒冷众女子以爱情铺设（或镶嵌）”。“铺陈”所译的词也可理解为“铺设”“镶嵌”或“铺满”；“来自”也可能表示“由……所作”。原文刻意把“爱情”写成装饰华轿的材料，表达十分独特。
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמּוּדָיו
  choice: 轿柱
  rationale: 该词通常指柱子；结合上下文所描写的华轿，用“轿柱”既保留构造意象，也让现代读者清楚所指。
- source_word: עָשָׂה
  choice: 做
  rationale: 按常用义译出“制作”；主语依上下文以阳性单数“他”表达。
- source_word: כֶסֶף
  choice: 银子
  rationale: 该词在此指银，译作“银子”自然明确。
- source_word: רְפִידָתוֹ
  choice: 靠背
  rationale: 这是罕见且含义不确定的名词，在华轿构件的语境中，“靠背”具体自然；“底座、支托”等可能性收入脚注。
- source_word: זָהָב
  choice: 金子
  rationale: 标准金属名称，与“银子”形成自然对仗。
- source_word: מֶרְכָּבוֹ
  choice: 座位
  rationale: 该词与乘坐、车辆有关；在华轿构造中译作“座位”清楚自然，同时以脚注保留“乘坐处、轿体”的较宽泛可能。
- source_word: אַרְגָּמָן
  choice: 紫色织物
  rationale: 该词可指珍贵的紫色染料或紫色材料；“紫色织物”在本处明确表达制作座位所用的奢华材料。
- source_word: תּוֹכוֹ
  choice: 轿内
  rationale: 原义为“它的内部”；结合上下文明确为华轿内部，译作“轿内”简洁自然。
- source_word: רָצוּף
  choice: 铺上
  rationale: 该分词表示铺设、镶嵌或覆盖；“铺上”保留具体装饰动作，也容纳诗句“铺上爱情”的奇特意象。
- source_word: אַהֲבָה
  choice: 爱情
  rationale: 马所拉文本的通常词义是“爱、爱情”。尽管与“铺上”搭配不同寻常，仍保留原诗富有张力的表达，不以推测的“皮革”等词替换。
- source_word: מִבְּנוֹת יְרוּשָׁלִָם
  choice: 由耶路撒冷的女子
  rationale: 介词מִן在此可表达施事或来源；正文采用施事义“由……”，与被铺饰的轿内相合，同时在脚注说明来源义的可能。
