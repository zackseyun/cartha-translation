base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/003/004.yaml
  text: I had scarcely passed by them when I found the one my soul loves[a]. I held on to him and would not let him go until I had brought him into my mother's house[b], into the chamber of the one who conceived me.
translation:
  language: zh_hans
  text: 我刚从他们身边走过，就找到了我心所爱的那一位[a]。我紧紧抓住他，不肯放开他，直到把他带进我母亲的家，带进孕育我的那一位的内室[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“我魂所爱的那一位。”这里的“魂”可指人的内在生命或整个人。
    reason: lexical_alternative
  - marker: b
    text: “孕育我的那一位”指她的母亲；原文以此与“我母亲的家”构成诗意平行。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּמְעַט שֶׁעָבַרְתִּי מֵהֶם עַד שֶׁמָּצָאתִי
  choice: 我刚走过他们，就找到了
  rationale: כִּמְעַט在此表达两件事相隔极短；以“刚……就……”自然传达这种紧接发生的时间关系。עָבַרְתִּי מֵהֶם指从前述守望者身边经过、继续前行。
- source_word: אֵת שֶׁאָהֲבָה נַפְשִׁי
  choice: 我心所爱的那一位
  rationale: נֶפֶשׁ可指人的内在生命、自己或全人；汉语诗歌中“我心所爱”既保留深切而全人的爱，也比直译“我灵魂所爱”更自然。
- source_word: אֲחַזְתִּיו
  choice: 我紧紧拉住他
  rationale: אָחַז含抓住、握住、持守之意；“紧紧拉住”与下句“不让他走”衔接自然，并表达坚定不放的情感而不过度渲染暴力。
- source_word: וְלֹא אַרְפֶּנּוּ
  choice: 不让他走
  rationale: רפה的使役式在此意为松手、放开；“不让他走”符合现代汉语，并保留主动不放开的语气。
- source_word: עַד שֶׁהֲבֵיאתִיו
  choice: 直到把他带进
  rationale: 保留עַד שֶׁ的终点意义；“带进”与随后两个室内地点相合。
- source_word: אֶל בֵּית אִמִּי
  choice: 我母亲的家
  rationale: 直译并保持清楚自然；前置“带进”表达进入其内。
- source_word: וְאֶל חֶדֶר הוֹרָתִי
  choice: 带进怀我的那一位的内室
  rationale: הוֹרָתִי指怀孕、孕育我的女性，与“我母亲”构成诗意平行；“怀我的那一位”尽量保留原文措辞，而“内室”体现חֶדֶר的私密室内空间。
