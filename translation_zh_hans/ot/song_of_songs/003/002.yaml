base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/003/002.yaml
  text: I will rise now and go about the city[a], in the marketplaces and in the streets; I will seek the one my soul loves. I sought him, but I did not find him.
translation:
  language: zh_hans
  text: 我要起来，在城中四处走走，在市集和街道上寻找我心所爱的人。我寻找他，却没有找到。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָקוּמָה נָּא
  choice: 我要起来
  rationale: 第一人称单数鼓励式表达说话者当下的决意；“我要起来”自然保留自我敦促的语气。נָא所含的急切意味由整体语气体现，不机械另译为“请”。
- source_word: וַאֲסוֹבְבָה בָעִיר
  choice: 走遍城中
  rationale: סבב在此指为寻找而在城中四处行走；“走遍城中”既传达巡行搜寻之意，也符合现代汉语诗歌表达。
- source_word: בַּשְּׁוָקִים
  choice: 在街市
  rationale: שׁוּק指城市中的市场、街市区域；“街市”既有公共商业空间之义，又与下文形成自然搭配。
- source_word: וּבָרְחֹבוֹת
  choice: 和广场上
  rationale: רְחֹבוֹת可指宽阔的公共街道或开阔场所；与שׁוּק并列时译作“广场”可避免两个词都泛化成“街道”，并保留城市公共空间的层次。
- source_word: אֲבַקְשָׁה
  choice: 寻找
  rationale: בקשׁ表示寻找、寻求；“寻找”适合具体寻找爱人的语境，并能与后句重复呼应。
- source_word: אֵת שֶׁאָהֲבָה נַפְשִׁי
  choice: 我心所爱的人
  rationale: נפשׁ在此表示人的内在自我与深切情感，并非要区分“灵魂”这一实体；“我心所爱的人”是自然、庄重的现代汉语，也保留强烈而亲密的爱意。
- source_word: בִּקַּשְׁתִּיו וְלֹא מְצָאתִיו
  choice: 我寻找他，却没有找到
  rationale: 保留בקשׁ的重复和两个阳性单数宾语后缀；“却”恰当地呈现寻找与未找到之间的转折。
theological_decisions: []
