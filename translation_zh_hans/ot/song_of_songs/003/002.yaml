  rationale: 修订仅收窄两处可能造成过度具体化或强化的表达：以“在城中四处走走”表达寻访式绕行，不暗示走遍全城；以“街道”对应原文的公共街道／宽阔通道。其余措辞保留原稿的现代书面诗歌语气、阳性指涉和动词重复。
