base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/003/005.yaml
  text: I adjure you[a], daughters of Jerusalem, by the gazelles or by the does of the field[b], that you not stir up or awaken love until it desires.
translation:
  language: zh_hans
  text: 耶路撒冷的女子啊，我指着羚羊或田野的母鹿[a]郑重嘱咐你们：不要惊动，也不要唤醒爱情，直到爱情自己愿意[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文很可能确指羚羊和田野的母鹿；其中“羚羊”一词也可能使人联想到“万军”，在起誓用语中形成诗意双关。
    reason: 文化与文字游戏说明
  - marker: b
    text: 也可较传统地译作“直到爱情乐意”。原文动词为阴性单数，与原文“爱”一词的语法性别一致；也有人把这句话理解为“直到她愿意”或“直到他愿意”。
    reason: 保留可能的不同理解
lexical_decisions:
- source_word: הִשְׁבַּעְתִּי אֶתְכֶם
  choice: 我……郑重嘱咐你们
  rationale: 该使役式表示使人受誓言约束、郑重告诫。中文以“指着……郑重嘱咐”结合后面的起誓凭据，既保留誓言的庄重力度，又避免生硬地译成“使你们起誓”。
- source_word: בְּנוֹת יְרוּשָׁלִַם
  choice: 耶路撒冷的女子
  rationale: 保留诗歌中的群体称呼；“女子”在现代中文中自然、庄重，也不额外限定年龄。
- source_word: בִּצְבָאוֹת אֹו בְּאַיְלוֹת הַשָּׂדֶה
  choice: 指着羚羊或田野的母鹿
  rationale: 按平行结构将两个词都理解为动物，并保留原文的“或”。“母鹿”表达阴性复数；“田野的”保留诗意场景。
- source_word: אִם תָּעִירוּ וְאִם תְּעוֹרְרוּ
  choice: 不要惊动，也不要唤醒
  rationale: 誓言句中的两个 אִם 表达严肃禁令。两个近义动词分别译出，以保留原文加强语气的平行结构。
- source_word: הָאַהֲבָה
  choice: 爱情
  rationale: 此处可指爱情本身、爱欲或被人格化的爱；“爱情”在中文中能保持诗意，并避免擅自指定某位男女为宾语。
- source_word: עַד שֶׁתֶּחְפָּץ
  choice: 直到爱情自己愿意
  rationale: 阴性单数动词在语法上可与阴性名词“爱情”呼应。“自己愿意”表达 חפץ 的意愿含义，同时保留爱情被人格化以及具体所愿之事未明说的特点。
theological_decisions:
- issue: 末句中阴性单数动词的所指
  choice: 让“爱情”作“愿意”的主语，不指明具体男性或女性
  alternative: 译为“直到她愿意”或“直到他愿意”
  rationale: 希伯来语动词的阴性单数形式自然可与阴性名词“爱情”一致；原文并未迫使读者把主语认定为某个具体人物，因此不应消除诗句的含混性。
translation_notes:
  register: 采用现代、庄重而可朗读的诗歌语言。“郑重嘱咐”结合“指着……”体现誓言公式；“不要惊动，也不要唤醒”保留希伯来语近义平行；末句有意不说明爱情愿意做什么，以维持原文的开放性。
