base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/003/011.yaml
  text: Go out and look[a], O daughters of Zion, at King Solomon, with the crown with which his mother crowned him on the day of his wedding, on the day of the joy of his heart.
translation:
  language: zh_hans
  text: 锡安的女子啊，你们出来观看所罗门王吧！看他头戴冠冕[a]；这冠冕是他母亲在他成婚的日子、在他心中喜乐的日子为他戴上的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “冠冕”也可译作“花冠”或“花环”；希伯来语 עֲטָרָה 可指节庆所用的冠饰，与婚礼场景相称。
    reason: lexical_alternative
lexical_decisions:
- source_word: צְאֶינָה וּרְאֶינָה
  choice: 你们出来观看……吧
  rationale: 两个阴性复数祈使式连续出现，呼唤锡安的女子出来观看；译文保留向外而出的动作和直接号召的语气。
- source_word: בְּנוֹת צִיּוֹן
  choice: 锡安的女子啊
  rationale: 这是对锡安女子的呼语；“啊”以自然、庄重的现代汉语标明直接呼唤。
- source_word: בַּמֶּלֶךְ שְׁלֹמֹה
  choice: 所罗门王
  rationale: 介词 ב 在观看类动词之后标示观看对象，汉语无需另译介词。
- source_word: בָּעֲטָרָה
  choice: 戴着冠冕
  rationale: 这里的介词表示伴随状态，即所罗门王头戴冠冕；“戴着”比直译“带着”更符合汉语搭配。
- source_word: עֲטָרָה
  choice: 冠冕
  rationale: 该词可指冠冕，也可指花冠或花环；正文采用涵盖面较广且符合君王语境的“冠冕”，并以脚注保留婚礼花冠的可能性。
- source_word: שֶׁעִטְּרָה לוֹ אִמּוֹ
  choice: 他母亲为他戴上的
  rationale: 清楚表达母亲把冠冕加在他身上的动作；希伯来语名词与动词的同根呼应在自然汉语中难以完整复制。
- source_word: בְּיוֹם חֲתֻנָּתוֹ
  choice: 在他成婚的日子
  rationale: חֲתֻנָּה 指婚礼或成婚庆典；此译简洁自然，并保留时间短语的诗歌结构。
- source_word: וּבְיוֹם שִׂמְחַת לִבּוֹ
  choice: 在他心中喜乐的日子
  rationale: 保留与前一时间短语的平行，也保留“心”作为喜乐所在的诗性表达，不将其解释得更具体。
