  text: Look[a], it is Solomon’s couch; sixty mighty men are around it, from the mighty men of Israel.
translation:
  language: zh_hans
  text: '看哪，这是所罗门的卧榻[a]；


    六十名勇士环绕着它，


    他们来自以色列的勇士中。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“床榻”。这个希伯来词可指床或卧榻；按上下文，有人认为这里指可携带的王室卧榻或肩舆。
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: 看哪
  rationale: 用自然而庄重的现代汉语引导读者注目眼前场景，保留原文的指示和强调作用。
- source_word: מִטָּתוֹ
  choice: 他的卧榻
  rationale: מִטָּה可指床或供躺卧之物；“卧榻”既保留这一词义范围，又不在正文中过早明确为后文所说的华轿。结合所属结构，正文自然译作“所罗门的卧榻”。
- source_word: שֶׁלִּשְׁלֹמֹה
  choice: 所罗门的
  rationale: 直接、自然地表达原文的所属关系。
- source_word: שִׁשִּׁים
  choice: 六十名
  rationale: 准确表达基数，并以量词“名”配合指人的名词。
- source_word: גִּבֹּרִים
  choice: 勇士
  rationale: 该词指强健英勇、能征战的人；“勇士”是现代汉语中简洁庄重的对应词，并保留本节两次用词的呼应。
- source_word: סָבִיב לָהּ
  choice: 环绕着它
  rationale: 表达众勇士处在卧榻四周；“它”按汉语习惯指无生命之物，不机械复制希伯来语阴性后缀。
- source_word: מִגִּבֹּרֵי יִשְׂרָאֵל
  choice: 都是以色列的勇士
  rationale: מִן在此表示从以色列勇士中选出或属于该群体。汉语用“都是”顺畅地说明这六十人的身份；“以色列的勇士”保留原文重复。
