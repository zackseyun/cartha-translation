lexical_decisions:
- source_word: אַפִּרְיוֹן
  choice: 华轿
  rationale: 这是一个罕见词，所指的具体形制不能确定，但语境表明它是一种华贵的乘舆。“华轿”在现代汉语中自然、易懂，并保留其贵重且可供乘坐的性质；脚注说明其他可能。
- source_word: עָשָׂה
  choice: 造了
  rationale: 对应常用动词“做、制造”；“造了”简洁自然，适合具体器物。
- source_word: לּוֹ
  choice: 为自己
  rationale: 介词加第三人称单数后缀直译可为“为他”，但其后明确以所罗门王为主语，此处自然理解为反身用法，表示为自己制造或使用。
- source_word: הַמֶּלֶךְ שְׁלֹמֹה
  choice: 所罗门王
  rationale: 符合现代汉语表达人名与王号的通常语序。
- source_word: מֵעֲצֵי
  choice: 用……的树木
  rationale: 原文为“从……的树木”；在说明制作材料时，“用……的树木”既保留树木意象，也符合现代汉语习惯，避免直接限定为木料或木材。
- source_word: הַלְּבָנוֹן
  choice: 黎巴嫩
  rationale: 采用该地名在现代简体中文中的标准译名。
