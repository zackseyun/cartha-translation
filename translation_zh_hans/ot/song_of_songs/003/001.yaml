  yaml_path: translation/ot/song_of_songs/003/001.yaml
  text: On my bed in the nights I sought the one my soul loves; I sought him[a], but I did not find him.
translation:
  language: zh_hans
  text: 夜复一夜[a]，我在床上寻找我心所爱的人；我寻找他，却没有找到他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “夜复一夜”所译的希伯来语“夜晚”是复数，可表示多个夜晚或反复出现的夜间时段；也可译作“在夜间”。
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל מִשְׁכָּבִי
  choice: 我躺在床上
  rationale: 原文直译为“在我的卧榻上”。现代汉语用“我躺在床上”更自然，并保留具体的卧床情景。
- source_word: בַּלֵּילוֹת
  choice: 夜复一夜
  rationale: 原文“夜晚”为复数，可指多个夜晚或反复出现的夜间时段；“夜复一夜”既保留复数意味，也符合中文诗歌表达。
- source_word: בִּקַּשְׁתִּי
  choice: 寻找
  rationale: בקשׁ在此表示寻找、寻求；“寻找”自然清楚，也能在下半句重复以保留原文的平行和强调。
- source_word: אֵת שֶׁאָהֲבָה נַפְשִׁי
  choice: 我心所爱的人
  rationale: נפשׁי字面可作“我的灵魂”，此处指人的内在自我和深切情感。“我心所爱的人”是自然庄重的现代汉语，并保留浓厚的感情色彩。
- source_word: בִּקַּשְׁתִּיו
  choice: 我寻找他
  rationale: 保留原文动词的重复及明确的阳性单数宾语后缀，以呈现诗句的平行和情感强化。
- source_word: וְלֹא מְצָאתִיו
  choice: 却找不到他
  rationale: 连词在这里具有转折效果；“却”自然表现寻找与未能找到之间的反差。“找不到”符合中文叙事语感，不额外加入“不能”的能力含义。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而富有诗意的表达。“我心所爱的人”避免生硬直译“我灵魂所爱的”，同时保留原文的深切情感；重复“寻找”以再现希伯来诗句的平行结构。
