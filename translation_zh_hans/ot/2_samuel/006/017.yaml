revisions:
- from: 他们把雅威的约柜抬进来，安放在预定的位置，就是大卫为约柜搭好的帐篷里。大卫又在雅威面前献上燔祭和平安祭[a]。
  to: 他们把雅威的约柜抬进大卫为它搭好的帐篷内，安放在它的位置上。大卫又在雅威面前献上燔祭和平安祭[a]。
  rationale: 修订删除“预定”这一无明确原文根据的限定，并重组地点短语，使“帐篷内”与“它的位置上”各自对应原文的两个定位表达。保留原有神名、礼仪术语及脚注锚点。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T05:26:44Z'
review_pass:
  verdict: revise
  source_fidelity: “预定的位置”把原文“在它的位置上”（בִּמְקוֹמוֹ）具体化为“预先指定”，属于无必要的增义。其余主要内容——约柜被带入、安放在帐篷内、大卫先前为它搭设帐篷，以及在雅威面前献燔祭和平安祭——均得到准确表达。
  naturalness: 原译整体庄重自然；但“安放在预定的位置，就是……帐篷里”会使“位置”与“帐篷”形成不够严谨的同位关系。调整语序后可更清楚地表达“帐篷内”是安放行为的地点，“它的位置”是约柜在其中的安置处。
  terminology: “雅威”“约柜”“燔祭”“平安祭”均合适，并与既定神名政策和中文圣经礼仪术语相符。脚注置于“平安祭”后，准确对应希伯来语 שְׁלָמִים。
  issues:
  - severity: low
    issue: “预定的位置”增添了原文未明说的“预定”含义。
    rationale: בִּמְקוֹמוֹ仅表示“在它的位置上／在其位置”，上下文可推知该处为约柜安置之处，却没有必要明说该位置是“预定的”。
  - severity: low
    issue: “位置，就是……帐篷里”的句法关系略含混。
    rationale: 原文区分“在它的位置上”与“在大卫为它搭的帐篷内”；中文宜将“帐篷内”前置为安放的空间，再表达“它的位置”。
  revised_text: 他们把雅威的约柜抬进大卫为它搭好的帐篷内，安放在它的位置上。大卫又在雅威面前献上燔祭和平安祭[a]。
  revised_footnotes:
