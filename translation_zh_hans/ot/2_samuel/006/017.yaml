base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/017.yaml
  text: They brought in the ark of Yahweh and set it in its place[a], inside the tent that David had pitched for it. And David offered burnt offerings and peace offerings before Yahweh.
translation:
  language: zh_hans
  text: 他们把雅威的约柜抬进大卫为它搭好的帐篷内，安放在它的位置上。大卫又在雅威面前献上燔祭和平安祭[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “平安祭”也可译作“团契祭”或“福祉祭”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲרוֹן יְהוָה
  choice: 雅威的约柜
  rationale: אֲרוֹן在此指敬拜礼仪中的约柜；יְהוָה按其专名译作“雅威”，保留原文的立约之名。
- source_word: וַיָּבִאוּ
  choice: 抬进来
  rationale: בוא的使役式表示使约柜进入预备好的地方；约柜是由人搬运的，“抬进来”在中文语境中自然明确。
- source_word: וַיַּצִּגוּ אֹתוֹ בִּמְקוֹמוֹ
  choice: 安放在预定的位置
  rationale: יצג表示把某物安置就位；“预定的位置”自然表达בִּמְקוֹמוֹ所指为约柜预备好的固定位置，避免生硬重复。
- source_word: בְּתוֹךְ הָאֹהֶל אֲשֶׁר נָטָה לוֹ דָּוִד
  choice: 就是大卫为约柜搭好的帐篷里
  rationale: בְּתוֹךְ表示在内部；נטה与帐篷连用意为搭设。“搭好的”体现该动作先于约柜被安放，明说“约柜”则消除中文代词指向不清。
- source_word: וַיַּעַל דָּוִד
  choice: 大卫又……献上
  rationale: עלה在献祭语境中表示献上祭物；“又”承接叙事中的וַ，同时保持现代中文流畅。
- source_word: עֹלוֹת
  choice: 燔祭
  rationale: עֹלָה指祭物全部焚烧献上的祭，中文圣经传统术语“燔祭”准确且简洁。
- source_word: וּשְׁלָמִים
  choice: 和平安祭
  rationale: שְׁלָמִים可指平安、团契或福祉相关的祭；正文采用中文读者较熟悉的“平安祭”，并以脚注保留其他可能含义。
- source_word: לִפְנֵי יְהוָה
  choice: 在雅威面前
  rationale: לִפְנֵי兼有“在……面前”和“在……临在中”之意；此译法简洁，并保留敬拜献祭的场景意味。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名，而非称号；音译“雅威”使读者看见这里使用的是以色列之神的专名，同时不把专名改成称号。
- issue: שְׁלָמִים所指祭物的内涵
  choice: 平安祭
  alternative: 团契祭；福祉祭
  rationale: 该词的含义涵盖平安、完整、福祉以及献祭后的共享筵席；正文保留通行名称，但不借译名把含义局限于某一种神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“约柜”“燔祭”“平安祭”保留必要且已广为理解的礼仪术语；用“搭好的”与“预定的位置”避免逐词硬译造成的中文生涩。英文咨询层的脚注标记位置与脚注内容不一致；依据希伯来词שְׁלָמִים，将[a]置于“平安祭”之后。
