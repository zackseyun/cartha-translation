  text: וּ/נְקַלֹּ֤תִי עוֹד֙ מִ/זֹּ֔את וְ/הָיִ֥יתִי שָׁפָ֖ל בְּ/עֵינָ֑/י וְ/עִם הָֽ/אֲמָהוֹת֙ אֲשֶׁ֣ר אָמַ֔רְתְּ עִמָּ֖/ם אִכָּבֵֽדָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/022.yaml
  text: And I will make myself even more contemptible than this[a], and I will be lowly in my own eyes; but with the slave girls of whom you have spoken, with them I will be honored.
translation:
  language: zh_hans
  text: 我还要使自己比这更为轻贱；在自己眼中，我也要成为卑微。至于你所说的那些婢女[a]，我却要在她们中间得尊荣。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “婢女”也可译作“女奴”或“女仆”；希伯来语指家中社会地位较低的女性仆役。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּנְקַלֹּתִי עוֹד מִזֹּאת
  choice: 我还要使自己比这更加卑微
  rationale: נקלתי 是 קלל 的尼法勒式，可表达被看轻、显得卑贱；结合大卫主动降卑的语境，用“使自己……卑微”保留其近似反身含义。עוֹד מִזֹּאת 的比较和加强语气译作“还要……比这更加”。
- source_word: וְהָיִיתִי שָׁפָל בְּעֵינָי
  choice: 在自己眼中看为低微
  rationale: שָׁפָל 指低下、卑微；“在自己眼中”保留希伯来语评价性习语，也避免将其直接解释为道德意义上的谦逊。
- source_word: הָאֲמָהוֹת
  choice: 婢女
  rationale: אָמָה 指社会地位较低的女性奴仆或女佣。“婢女”在现代中文中庄重可懂，并保留其低下家内身份；脚注说明也可译为“女奴”或“女仆”。
- source_word: אֲשֶׁר אָמַרְתְּ
  choice: 你所说的那些
  rationale: 直译关系从句，清楚回指米甲在上一节提到的女子。
- source_word: עִמָּם
  choice: 在……中间
  rationale: עם 在这里标示大卫获得尊荣的社会群体或范围；现代中文用“在她们中间”比生硬的“与她们”更自然。
- source_word: אִכָּבֵדָה
  choice: 我却要得尊荣
  rationale: כבד 的尼法勒式表示受尊重、被尊为贵，与前文的卑微形成荣辱对照；“得尊荣”既保留被动结果，也避免“得荣耀”可能带来的专门神学色彩。
theological_decisions:
- issue: אָמָהוֹת 的社会身份用语
  choice: 正文译为“婢女”，脚注列出“女奴”和“女仆”
  alternative: 正文直译为“女奴”
  rationale: 原词确实可指女性奴隶，且本节的荣辱反差涉及社会地位；但在现代中文经文语体中，“婢女”能自然表达低等家内女性仆役，又不武断限定其具体法律身份。脚注保留更强的身份译法。
- issue: 大卫的“卑微”是自身行动还是他人评价
  choice: 译作“使自己……卑微”，保留主动自降与被看轻之间的张力
  alternative: “我还要比这更被人轻看”
  rationale: 尼法勒式可以强调变得卑贱或被轻视；上下文则显示大卫愿意进一步自我降卑。所选译法不把这句话纯粹处理为外界评价，也不将其美化为单纯的道德谦逊。
- issue: 末句尊荣的来源或范围
  choice: 译作“在……中间，我却要得尊荣”
  alternative: “我却要被她们尊重”
  rationale: עִמָּם 字面是“与她们／在她们中间”，并未明确把婢女指定为施动者，因此正文保留社会范围，不擅自明确为“被她们尊重”。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以“卑微／低微／尊荣”再现本节连续的荣辱与高低对照；“却”显明末句转折。脚注标记已在正文“婢女”后标出。
