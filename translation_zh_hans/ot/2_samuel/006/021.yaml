  text: וַ/יֹּ֣אמֶר דָּוִד֮ אֶל מִיכַל֒ לִ/פְנֵ֣י יְהוָ֗ה אֲשֶׁ֨ר בָּֽחַר בִּ֤/י מֵֽ/אָבִי/ךְ֙ וּ/מִ/כָּל בֵּית֔/וֹ לְ/צַוֺּ֨ת אֹתִ֥/י נָגִ֛יד עַל עַ֥ם יְהוָ֖ה עַל יִשְׂרָאֵ֑ל וְ/שִׂחַקְתִּ֖י לִ/פְנֵ֥י יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/021.yaml
  text: David said to Michal[a], “It was before Yahweh, who chose me above your father and above all his house, to appoint me ruler over the people of Yahweh, over Israel—and I celebrated before Yahweh.”
translation:
  language: zh_hans
  text: 大卫对米甲说：“我是在雅威面前这样做的；雅威拣选了我，而不是你父亲和他的全家，任命我作领袖，统领雅威的子民，统领以色列；我还要在雅威面前欢庆[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“跳舞”。这里的希伯来语动词含义比专指跳舞的词更宽，也可表示欢快或庆贺的举动。
    reason: 保留词义范围及传统译法所反映的语境性理解。
lexical_decisions:
- source_word: לִפְנֵי יְהוָה
  choice: 在雅威面前
  rationale: 保留该短语的空间和关系含义，并在本节两处采用相同译法，以呈现原文的重复强调。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常用音译呈现上帝的专名，不以称号代替。
- source_word: אֲשֶׁר בָּחַר בִּי מֵאָבִיךְ וּמִכָּל בֵּיתוֹ
  choice: 雅威选择了我，而不是你父亲和他全家
  rationale: מן在בחר之后表达选择中的对比或排除；“而不是”在现代汉语中自然地表明大卫与扫罗王室之间的对比。“全家”同时可涵盖家族和王室谱系。
- source_word: לְצַוֹּת אֹתִי
  choice: 委任我
  rationale: צוה通常可指命令，但此处与随后的职位名词连用，表示授职或任命；“委任”准确传达这一语境。
- source_word: נָגִיד
  choice: 领袖
  rationale: 该词指被置于权柄地位的人；“领袖”既表达领导权，也避免将其窄化为特定世袭爵位。
- source_word: עַל עַם יְהוָה עַל יִשְׂרָאֵל
  choice: 统领雅威的子民，统领以色列
  rationale: 保留原文两个עַל形成的重复和强调，而不把“雅威的子民”和“以色列”合并成一个短语。
- source_word: וְשִׂחַקְתִּי
  choice: 因此，我要……欢庆
  rationale: שׂחק在这里表示欢快、庆贺性的举动，并不专指跳舞；“欢庆”保留其较宽泛的语义。结合回应语境及古译本对时态的理解，译作“我要”，呈现大卫宣告仍要如此行的意味。
theological_decisions:
- issue: 如何翻译神名יהוה
  choice: 雅威
  alternative: 耶和华；主
  rationale: 采用神名的现代汉语音译，以保留原文使用专名的特征。
- issue: 末句是否明确译为跳舞
  choice: 欢庆
  alternative: 跳舞；嬉戏
  rationale: 本节使用שׂחק，而不是本章前文较明确描述舞动的כרר或פזז；因此不把这里的动作过度限定为跳舞，同时以脚注保留这一语境上可能的理解。
- issue: 末句动词的时间指向
  choice: 我要在雅威面前欢庆
  alternative: 我在雅威面前欢庆了；我愿在雅威面前欢庆
  rationale: 该完成式处在大卫的回应和宣告中，七十士译本也作将来表达；“我要”自然呈现其继续如此行的决意，但不把它扩展为神学性誓言。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。开头以“我是在雅威面前这样做的”补出希伯来语省略但由上文可知的动作，使中文完整；感叹号体现大卫对米甲责难的强调回应。“统领……统领……”刻意保留原文重复。
