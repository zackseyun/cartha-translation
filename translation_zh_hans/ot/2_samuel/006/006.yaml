base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/006.yaml
  text: When they came to Nacon’s threshing floor[a], Uzza reached out to the ark of God and took hold of it[b], because the oxen stumbled.
translation:
  language: zh_hans
  text: 他们来到拿艮的禾场[a]时，乌撒向上帝的约柜伸手，抓住了约柜，因为牛失蹄了[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “拿艮”也可按另一音译作“拿孔”；原文也可能意为“坚固的禾场”或“固定的禾场”，但这种理解较不可能。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“牛滑了一下”；原文动词也可能指牛使约柜几乎倾倒。
    reason: lexical_alternative
lexical_decisions:
- source_word: גֹּרֶן
  choice: 禾场
  rationale: 指打谷、扬谷的场地；“禾场”是现代中文圣经语境中简明而自然的对应词。
- source_word: נָכוֹן
  choice: 拿艮
  rationale: 此处最自然地视为专名，与“禾场”构成所属关系；希伯来文没有冠词，也可作形容词理解，因此在脚注保留另一可能。
- source_word: וַיִּשְׁלַח
  choice: 伸手
  rationale: 动词本义为“伸出、伸向”；本句虽未明说“手”，但动作语境清楚，中文补出“手”才自然。
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: 上帝的约柜
  rationale: 保留完整的所属结构以及约柜与上帝的明确关联。
- source_word: וַיֹּאחֶז בּוֹ
  choice: 抓住了约柜
  rationale: אחז 表示抓住、握住；重复“约柜”比使用代词更清楚，也不额外加入“扶稳”等目的性解释。
- source_word: כִּי
  choice: 因为
  rationale: 明确表达乌撒采取行动的直接原因。
- source_word: שָׁמְטוּ
  choice: 失了前蹄
  rationale: 该动词可涉及滑脱、失足或使物体失稳；在牛拉车的叙事语境中，“失了前蹄”自然地表达牛一时失足，同时不断言约柜已经倾倒。
- source_word: הַבָּקָר
  choice: 牛
  rationale: 此处指拉车的牛；现代汉语用“牛”即可自然表达，且不必强行标示单复数。
theological_decisions:
- issue: 乌撒采取行动的原因及约柜受威胁的程度
  choice: 译作牛“失了前蹄”，只说明牛失足导致乌撒伸手抓住约柜
  alternative: 牛滑了一下；牛使约柜倾倒；牛几乎使约柜倾倒
  rationale: 希伯来文明确以牛为该动词的主语，却没有明说约柜已经倾倒或即将掉落。正文保留事件机制与危险程度的不确定性，不为乌撒的行为额外加入动机判断。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。人名采用常见中文圣经译名“乌撒”“拿艮”；用“上帝”对应 אֱלֹהִים。正文避免用“扶住”或“扶稳”，以免把乌撒的目的和约柜受威胁的具体程度说得超过原文。
