  text: וְ/דָוִ֛ד מְכַרְכֵּ֥ר בְּ/כָל עֹ֖ז לִ/פְנֵ֣י יְהוָ֑ה וְ/דָוִ֕ד חָג֖וּר אֵפ֥וֹד בָּֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/014.yaml
  text: And David was dancing with all his might before Yahweh[b][a], and David was wearing a linen ephod.
translation:
  language: zh_hans
  text: 大卫在雅威面前尽全力跳舞[a]；他身上系着一件亚麻布以弗得[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“旋转起舞”或“欢跃”；这个希伯来词描写充满活力的庆祝动作。
    reason: lexical_alternative
  - marker: b
    text: 以弗得是以色列敬拜礼仪中一种独特的服饰；这里大卫所系的是亚麻布制成的。
    reason: cultural_note
lexical_decisions:
- source_word: מְכַרְכֵּר
  choice: 跳舞
  rationale: 这个分词描写热烈、欢庆性的身体动作。“跳舞”在现代汉语中清楚自然，又不把动作过度限定为旋转或跳跃。
- source_word: בְּכָל־עֹז
  choice: 尽全力
  rationale: 表达毫无保留地用尽力量；“尽全力”简洁自然，并保留原文的强烈程度。
- source_word: לִפְנֵי יְהוָה
  choice: 在雅威面前
  rationale: לִפְנֵי可指“在……面前／临在中”；此译法简洁地保留原文的空间及敬拜语境。
- source_word: יְהוָה
  choice: 雅威
  rationale: 采用神圣四字名的现代汉语音译，保留其作为以色列之神专名的性质，而不以称号替代。
- source_word: חָגוּר
  choice: 身上系着
  rationale: 该词表示束上或装备着衣物；“身上系着”比单纯“穿着”更贴近其束系含义，同时仍符合现代汉语表达。
- source_word: אֵפוֹד
  choice: 以弗得
  rationale: 这是以色列礼仪服饰的专名，汉语传统音译“以弗得”能避免用解释性词语抹去其特定文化含义。
- source_word: בָּד
  choice: 麻布
  rationale: 此处指亚麻织物；“麻布”保留材质信息，也避免加入原文未明确表达的品质等级。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用神圣四字名。译作“雅威”旨在保留其专名性质；“耶和华”是传统形式，“上主”则以称号代替专名。
- issue: 大卫所穿以弗得是否表示祭司身份
  choice: 仅陈述他系着麻布以弗得，不进一步解释其身份
  alternative: 译成“祭司礼服”，从而暗示大卫在履行祭司职分
  rationale: 经文明确提到服饰，却没有在本节直接判定大卫的职分；保留“以弗得”这一专名可避免替原文解决相关神学张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“尽全力跳舞”清楚传达欢庆动作及其强度；“身上系着”保留服饰被束上的具体感。标点以分号对应原文两个并列分句。
