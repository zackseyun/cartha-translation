  text: וַ/יָּ֣קָם וַ/יֵּ֣לֶךְ דָּוִ֗ד וְ/כָל הָ/עָם֙ אֲשֶׁ֣ר אִתּ֔/וֹ מִֽ/בַּעֲלֵ֖י יְהוּדָ֑ה לְ/הַעֲל֣וֹת מִ/שָּׁ֗ם אֵ֚ת אֲר֣וֹן הָ/אֱלֹהִ֔ים אֲשֶׁר נִקְרָ֣א שֵׁ֗ם שֵׁ֣ם יְהוָ֧ה צְבָא֛וֹת יֹשֵׁ֥ב הַ/כְּרֻבִ֖ים עָלָֽי/ו׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/002.yaml
  text: David arose and went[a], with all the people who were with him, from Baale-judah to bring up from there the ark of God, which is called by the Name, the name of Yahweh of Armies[d][c][b], who is enthroned above the cherubim.
translation:
  language: zh_hans
  text: 大卫起身，和随从他的众人从巴阿利·犹大[a]出发，要把神的约柜从那里运上来。这约柜其上所称的名，是万军之雅威的名；他坐在基路伯之上[b][c][d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“犹大的巴拉”。这里的希伯来语形式不寻常，可能指与基列·耶琳有关的一个地方。
    reason: 保留地名形式及其识别上的文本难点。
  - marker: b
    text: 也可较直译为：“这约柜被称以万军之雅威的名。”原文的命名句式十分紧缩；也可理解为万军之雅威的名“被称在这约柜之上”。
    reason: 保存约柜与神名之间关系的语法歧义。
  - marker: c
    text: “万军之雅威”传统上常译作“万军之耶和华”。
    reason: 说明神名及神圣称号的传统译法。
  - marker: d
    text: “坐在基路伯之上”也可译作“住在基路伯之间”或“在基路伯之上登基坐着”。原文末尾的“在它上面”也可能回指约柜。
    reason: 保存坐、居住或登基的含义，以及末尾代词在空间关系上的歧义。
lexical_decisions:
- source_word: וַיָּקָם וַיֵּלֶךְ
  choice: 起身……出发
  rationale: קום与הלך连续推动叙事；“起身……出发”在现代汉语中自然地保留开始行动和前往两层意思。
- source_word: וְכָל הָעָם אֲשֶׁר אִתּוֹ
  choice: 和跟随他的众人一同
  rationale: 表达众人与大卫同行；“跟随他的”在此指与他在一起，并不限定为某种正式身份。
- source_word: מִבַּעֲלֵי יְהוּדָה
  choice: 从巴阿利·犹大
  rationale: 上下文要求将其理解为地名；音译保留希伯来文本不寻常的形式，不擅自改成别处所用的地名。
- source_word: לְהַעֲלוֹת מִשָּׁם
  choice: 要把……从那里运上来
  rationale: עלה的使役式在这里表示把约柜带上去；“运上来”兼顾移动约柜的实际动作和方向意味。
- source_word: אֵת אֲרוֹן הָאֱלֹהִים
  choice: 神的约柜
  rationale: 采用现代中文圣经叙事中清楚、庄重且通行的表达。
- source_word: אֲשֶׁר נִקְרָא שֵׁם שֵׁם
  choice: 这约柜是以那名，就是……的名，来称呼的
  rationale: 希伯来文的命名结构压缩且重复“名”；译文保留其庄严语气及“那名”的特殊分量，同时不把它简化为单纯的所有关系。
- source_word: יְהוָה צְבָאוֹת
  choice: 万军之雅威
  rationale: “雅威”直接呈现四字神名；“万军”简洁表达צְבָאוֹת所指的众军，并保留神圣称号的庄重形式。
- source_word: יֹשֵׁב הַכְּרֻבִים
  choice: 坐在基路伯之上
  rationale: יֹשֵׁב可表示坐着、居住或登基而坐；正文采用较贴近字面的“坐在”，避免在译文中完全替读者判定为“居住”或“坐在宝座上”。
- source_word: עָלָיו
  choice: 之上
  rationale: 末尾代词的指向及其与基路伯、约柜的关系在原文中较紧缩；中文将空间关系自然并入“基路伯之上”，另以脚注提示可能的理解。
theological_decisions:
- issue: 四字神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用神的专名；采用“雅威”而不是以称号替代，保留其作为盟约之名的性质。
- issue: צְבָאוֹת所构成的神圣称号
  choice: 万军之雅威
  alternative: 众军之雅威；万军之耶和华
  rationale: “万军”既可让现代读者理解其军旅含义，也保留这一称号的传统庄重感；不额外加入“统领”等原文没有明说的动词。
- issue: 约柜与神名的压缩句式
  choice: 这约柜是以那名，就是……的名，来称呼的
  alternative: ……的名被称在这约柜之上；这约柜承载……的名
  rationale: 原文既强调约柜与神名的关联，又没有用展开的语法说明这种关联的全部性质；正文保留命名公式，不将其解释成神被约柜容纳或约柜仅属神所有。
- issue: יֹשֵׁב与基路伯的关系
  choice: 坐在基路伯之上
  alternative: 住在基路伯之间；在基路伯之上登基坐着
  rationale: 该词在约柜语境中可带王权和宝座意象，但字面也可指坐或居住；正文避免过度解释，以脚注保存主要替代译法。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“约柜”“基路伯”“万军之雅威”等保留经文术语的辨识度；句法适度拆分，以免原文密集的修饰结构在中文中难以理解，同时用脚注保留地名、命名公式和宝座意象的真实歧义。
