  text: וַ/יָּ֥שָׁב דָּוִ֖ד לְ/בָרֵ֣ךְ אֶת בֵּית֑/וֹ וַ/תֵּצֵ֞א מִיכַ֤ל בַּת שָׁאוּל֙ לִ/קְרַ֣את דָּוִ֔ד וַ/תֹּ֗אמֶר מַה נִּכְבַּ֨ד הַ/יּ֜וֹם מֶ֣לֶךְ יִשְׂרָאֵ֗ל אֲשֶׁ֨ר נִגְלָ֤ה הַ/יּוֹם֙ לְ/עֵינֵ֨י אַמְה֣וֹת עֲבָדָ֔י/ו כְּ/הִגָּל֥וֹת נִגְל֖וֹת אַחַ֥ד הָ/רֵקִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/020.yaml
  text: Then David returned to bless his household[a]. But Michal daughter of Saul came out to meet David and said, “How honored the king of Israel was today, uncovering himself today in the sight of the slave girls of his slaves[c][b], as one of the vulgar fellows shamelessly uncovers himself!”
translation:
  language: zh_hans
  text: 大卫回去，要给自己的家人[a]祝福。扫罗的女儿米甲出来迎接大卫，说：“以色列王今天多么尊贵啊[b]，在他奴仆的婢女[c]眼前袒露身体，像一个无赖之徒毫无羞耻地袒露自己一样[d]！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “家人”直译为“家”；这里很可能指大卫家中的人。
    reason: lexical_alternative
  - marker: b
    text: 米甲表面说“多么尊贵”，在上下文中却明显是在讥讽大卫。也可译作“以色列王今天多么荣耀啊”。
    reason: rhetorical_clarification
  - marker: c
    text: “婢女”也可译作“女奴”或“使女”，指身份低下、受人役使的女性。
    reason: lexical_alternative
  - marker: d
    text: 原文重复“袒露”这一词根来加强语气；较贴近形式可译作“像一个无赖之徒袒露自己一样”。
    reason: source_form
lexical_decisions:
- source_word: לְבָרֵךְ
  choice: 祝福
  rationale: 保留ברך的基本含义；这里指大卫在庆典之后回去为家人祝福，而非仅仅问候。
- source_word: בֵּיתוֹ
  choice: 自己的家人
  rationale: בַּיִת可指房屋，也可指一家之人；“祝福”的受事更可能是家中成员，因此译为“家人”，同时用脚注保留“家”的表达范围。
- source_word: מִיכַל בַּת שָׁאוּל
  choice: 扫罗的女儿米甲
  rationale: 自然保留原文对米甲“扫罗之女”身份的强调。
- source_word: מַה נִּכְבַּד הַיּוֹם
  choice: 今天多么尊贵啊
  rationale: כבד在此表示受尊崇、显得尊贵；直译正面措辞，让上下文本身显出米甲的反讽，不在正文中替读者明说。
- source_word: נִגְלָה
  choice: 袒露身体
  rationale: 表达使自己身体显露的意思，又不武断断定大卫已经完全赤裸，保留原文在暴露程度上的张力。
- source_word: לְעֵינֵי
  choice: 在……眼前
  rationale: 贴近希伯来语“在……眼中／眼前”的习语，并突出行为是公开可见的。
- source_word: אַמְהוֹת עֲבָדָיו
  choice: 他奴仆的婢女
  rationale: 保留两层从属关系以及אָמָה所指女性依附者的低下身份；“婢女”比一般的“女仆”更能反映非自由或受役使的社会处境。
- source_word: כְּהִגָּלוֹת נִגְלוֹת
  choice: 像……毫无羞耻地袒露自己一样
  rationale: 原文重复同一词根，加强袒露动作；汉语无法自然复制该形式，故以“毫无羞耻地”传达米甲话语中的强烈贬斥，同时在脚注中说明较贴近形式的译法。
- source_word: אַחַד הָרֵקִים
  choice: 一个无赖之徒
  rationale: רֵיקִים字面带“空虚、无价值”之意，在此是对卑贱、轻浮之人的蔑称；“无赖之徒”在现代汉语中自然且保留侮辱语气。
theological_decisions:
- issue: 米甲话语中的反讽
  choice: 正文保留表面的称赞“多么尊贵”，由语境显明反讽
  alternative: 直接译作“今天可真丢尽了王的尊严”
  rationale: 原文使用כבד的正面词义，却借上下文表达讥讽；不将反讽改写为直接谴责，可保留原文修辞和人物声音。
- issue: נִגְלָה所指袒露的程度
  choice: 袒露身体
  alternative: 赤身露体／暴露下体
  rationale: 上下文表明大卫的举动被米甲视为有失体面，但本节本身没有精确说明裸露程度；译文不应把含义收窄为完全裸体或特定部位暴露。
- issue: אַמְהוֹת的社会身份
  choice: 婢女
  alternative: 女仆／使女／女奴
  rationale: “婢女”既能让现代普通读者理解，也保留其受役使、地位低下的含义；避免用过于柔化的家庭雇员称谓，也不在证据不足时把每一位都明确界定为现代概念下的奴隶。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“多么尊贵啊”保留米甲表面称赞、实际讥讽的尖刻语气；“袒露身体”避免把原文过度解释为完全裸体；“无赖之徒”传达蔑称而不过分口语化。
