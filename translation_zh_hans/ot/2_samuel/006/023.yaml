  yaml_path: translation/ot/2_samuel/006/023.yaml
  text: And Michal the daughter of Saul had no child until the day of her death[a].
translation:
  language: zh_hans
  text: 扫罗的女儿米甲，直到她死的那一天都没有孩子[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“后代”；希伯来语这个名词可泛指孩子，不一定专指儿子。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/מִיכַל
  choice: 而……米甲
  rationale: 前缀连词与表示领有关系的介词共同引出米甲；译作“而……米甲”既承接上文，也用自然汉语表达句子的转折或结果色彩，不过度强化为明确的因果关系。
- source_word: בַּת שָׁאוּל
  choice: 扫罗的女儿
  rationale: 忠实表达希伯来语的属格结构，并保留经文再次以父女关系指称米甲的措辞。
- source_word: לֹא הָיָה לָהּ
  choice: 没有
  rationale: 希伯来语直译为“对她而言不存在”，是表达领有的惯用结构；现代汉语自然译为“没有”。
- source_word: יָלֶד
  choice: 孩子
  rationale: 该单数名词在此可泛指孩子，并不必然限定为儿子；“孩子”准确、自然，也不额外加入“生育”的动作含义。
- source_word: עַד יוֹם מוֹתָהּ
  choice: 直到死的那一天
  rationale: 贴近原文的时间表达，清楚表明这种状况持续到她去世之日，同时保留原文句式。
theological_decisions:
- issue: “直到死的那一天”对米甲无子的含义
  choice: 按原文直译时间界限，表达米甲一生没有孩子
  alternative: 意译为“终身没有孩子”
  rationale: 原文强调这种状况一直持续到死亡之日；译文保留其表述方式，不制造死后生子的荒谬暗示，也不把无子解释成经文未明说的神学惩罚。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“而”承接上下文；保留“直到死的那一天”的原文时间结构。
