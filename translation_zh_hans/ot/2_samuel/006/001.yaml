  text: David again gathered all the chosen men of Israel[a], thirty thousand.
translation:
  language: zh_hans
  text: 大卫又召集了以色列所有的精锐[a]，共三万人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “精锐”或译“年轻人”或“精选的人”。希伯来语בָּחוּר既可强调年轻，也可指经过挑选、出众的人；本节的召集语境较支持“精锐”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּסֶף עוֹד
  choice: 又
  rationale: 这是表示动作再次发生的惯用表达；译作“又”自然地衔接叙事，也保留“再次”的意思。
- source_word: אֶת כָּל
  choice: 所有的
  rationale: אֶת标示确定的直接宾语，כָּל表示整体范围；现代汉语以“所有的”准确表达。
- source_word: בָּחוּר
  choice: 精锐
  rationale: 该词既可指年轻人，也可指经过挑选的优秀人员；本节是大规模召集的语境，“精锐”较贴合所指，同时以脚注保留词义上的歧义。
- source_word: בְּיִשְׂרָאֵל
  choice: 以色列……的
  rationale: 介词בְּ在这里可表达群体范围；译成“以色列所有的”符合现代汉语习惯，并表明这些人来自以色列整体。
- source_word: שְׁלֹשִׁים אָלֶף
  choice: 共三万人
  rationale: 数目直译为“三万”；加“共”使其与前面的召集对象自然衔接，“人”则补明计数单位。
- source_word: וַיֹּסֶף עוֹד דָּוִד אֶת
  choice: 大卫又召集了
  rationale: 原文没有明说具体动作，句式在此语境中表示大卫再次组织、聚集这些人；“召集”依据上下文补出，使中文句意完整，但不额外说明召集目的。
