  text: וַ/יְהִ֗י כִּ֧י צָעֲד֛וּ נֹשְׂאֵ֥י אֲרוֹן יְהוָ֖ה שִׁשָּׁ֣ה צְעָדִ֑ים וַ/יִּזְבַּ֥ח שׁ֖וֹר וּ/מְרִֽיא־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/013.yaml
  text: And when those carrying the ark of Yahweh had gone six steps[b][a], he sacrificed an ox and a fattened calf.
translation:
  language: zh_hans
  text: 当抬着雅威的约柜的人走了六步[a]时，他就献上一头牛和一头肥壮的牲畜[b]为祭。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“六个步距”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文指养肥的牲畜；传统上也译作“肥牛犊”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲרוֹן יְהוָה
  choice: 雅威的约柜
  rationale: אֲרוֹן在这里指敬拜礼仪中的约柜；יְהוָה按其专名音译为“雅威”，不以称号替代。正文采用“雅威约柜”的自然汉语结构。
- source_word: כִּי
  choice: ……时
  rationale: 在叙事结构וַיְהִי כִּי中引出时间情境；“……时”简洁自然。
- source_word: צָעֲדוּ נֹשְׂאֵי
  choice: 抬……的人走了
  rationale: נֹשְׂאֵי是指搬运约柜的人，צָעֲדוּ表示迈步前行；此译保留搬抬和行进两层意思。
- source_word: שִׁשָּׁה צְעָדִים
  choice: 六步
  rationale: 直译数量和步伐单位；也可理解为六个步距。
- source_word: וַיִּזְבַּח
  choice: 他就献上
  rationale: 动词为第三人称阳性单数，语境中最自然地指大卫；“献上”结合祭牲宾语，清楚表达献祭行为。
- source_word: שׁוֹר
  choice: 一头牛
  rationale: 该词泛指牛类牲畜，未必限定为阉牛或公牛；“牛”保留原词范围。
- source_word: מְרִיא
  choice: 一只肥畜
  rationale: 原词指养肥的牲畜，但未明确说明种类；“肥畜”保留这一概括性，避免正文擅自具体化为肥牛犊。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；“雅威”以现代汉语音译专名，既不以称号取代，也避免采用较晚形成的混合读音。
- issue: 献祭者的身份
  choice: 保留代词“他”
  alternative: 明确译作“大卫”
  rationale: 希伯来文动词只标示第三人称阳性单数，主语须由上文判断。语境指向大卫，但正文用“他”可保留原文的衔接方式，不额外补入名字。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“抬……的人”比“抬柜者”更口语易懂；“肥畜”虽略带书面色彩，却能准确保留原文未说明牲畜种类的含义。所有脚注标记均置于相应词语之后。
