source:
  edition: WLC
  text: וַ/יְחַלֵּ֨ק לְ/כָל הָ/עָ֜ם לְ/כָל הֲמ֣וֹן יִשְׂרָאֵל֮ לְ/מֵ/אִ֣ישׁ וְ/עַד אִשָּׁה֒ לְ/אִ֗ישׁ חַלַּ֥ת לֶ֨חֶם֙ אַחַ֔ת וְ/אֶשְׁפָּ֣ר אֶחָ֔ד וַ/אֲשִׁישָׁ֖ה אֶחָ֑ת וַ/יֵּ֥לֶךְ כָּל הָ/עָ֖ם אִ֥ישׁ לְ/בֵיתֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/019.yaml
  text: He distributed to all the people[a], to the whole multitude of Israel, from man to woman, to each person one loaf of bread, one portion of meat, and one raisin cake. Then all the people went away[b], each to his house.
translation:
  language: zh_hans
  text: 他分给所有百姓，就是以色列全体民众，无论男女[b]，每人一个饼、一份肉[a]和一个葡萄干饼。随后，众百姓各自回家去了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“一份（食物）”。希伯来词 אֶשְׁפָּר 很少见；许多人根据历代志上16:3的平行记载，将它理解为一份肉。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译“从男人直到女人”，意思是聚集在场的人全都包括在内，男女都有。
    reason: cultural_note
lexical_decisions:
- source_word: וַיְחַלֵּק
  choice: 他分给
  rationale: 此处 פיעל 词形表示把食物逐份分发给群众。“分给”自然简洁，也保留了分配的具体动作。
- source_word: לְכָל הָעָם / לְכָל הֲמוֹן יִשְׂרָאֵל
  choice: 所有百姓，就是以色列全体民众
  rationale: 两个短语形成同位、加强关系；用“就是”连接，既保留原文的双重表达，也符合现代汉语。
- source_word: לְמֵאִישׁ וְעַד אִשָּׁה
  choice: 无论男女
  rationale: 原文直译为“从男人直到女人”，在此表示聚集的人全都包括在内。“无论男女”准确传达其惯用含义。
- source_word: לְאִישׁ
  choice: 每人
  rationale: 结合紧接着的“无论男女”，这里的阳性单数具有逐一分配的泛指作用；“每人”不会误解为只给男性。
- source_word: חַלַּת לֶחֶם אַחַת
  choice: 一个饼
  rationale: חַלָּה 在这里指一个饼或饼状面包；“一个饼”具体、自然，数量也明确。
- source_word: אֶשְׁפָּר אֶחָד
  choice: 一份肉
  rationale: אֶשְׁפָּר 是罕见词，确切含义有争议；结合食物分发的语境及历代志上16:3的平行记载，“一份肉”是较可能且不过度具体的译法，并以脚注保留不确定性。
- source_word: אֲשִׁישָׁה אֶחָת
  choice: 一个葡萄干饼
  rationale: אֲשִׁישָׁה 通常指压制成的果饼，传统上多理解为葡萄干饼；此译法清楚并符合本节食物清单的语境。
- source_word: וַיֵּלֶךְ כָּל הָעָם אִישׁ לְבֵיתוֹ
  choice: 随后，众百姓各自回家去了
  rationale: “各自”体现 אִישׁ 的逐一分配意味，“回家去了”自然表达分发结束后众人散去。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“所有百姓，就是以色列全体民众”保留原文同位式的强调；“无论男女”“每人”“各自回家”使分配范围与逐一性清晰。脚注标记按其实际所注释的词语放置。
