source:
  edition: WLC
  text: וְ/הָיָה֙ אֲר֣וֹן יְהוָ֔ה בָּ֖א עִ֣יר דָּוִ֑ד וּ/מִיכַ֨ל בַּת שָׁא֜וּל נִשְׁקְפָ֣ה בְּעַ֣ד הַ/חַלּ֗וֹן וַ/תֵּ֨רֶא אֶת הַ/מֶּ֤לֶךְ דָּוִד֙ מְפַזֵּ֤ז וּ/מְכַרְכֵּר֙ לִ/פְנֵ֣י יְהוָ֔ה וַ/תִּ֥בֶז ל֖/וֹ בְּ/לִבָּֽ/הּ־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/016.yaml
  text: As the ark of Yahweh was coming into the city of David[a], Michal daughter of Saul looked out through the window and saw King David leaping and whirling before Yahweh, and she despised him in her heart.
translation:
  language: zh_hans
  text: 雅威的约柜进入大卫城时，扫罗的女儿米甲从窗户向外望，看见大卫王在雅威面前跳跃旋转[a]，心里就轻视他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “跳跃旋转”：希伯来原文用了两个动词，描绘在雅威面前欢腾、热烈的动作；第二个词也可理解为“舞动”。
    reason: 说明两个罕见动词的动作色彩及词义不确定性，避免正文将其笼统化。
lexical_decisions:
- source_word: וְהָיָה ... בָּא
  choice: ……进入……时
  rationale: 句首结构为叙事设定时间背景；用“……时”自然表达约柜正在进城、米甲同时观看的情景。“进入”依城市这一宾语明确表达来到城内，但不额外增添仪式含义。
- source_word: אֲרוֹן יְהוָה
  choice: 雅威的约柜
  rationale: 保留原文所属结构，并将四字神名音译为“雅威”；“约柜”是现代汉语圣经语境中对 אֲרוֹן 的通行、清楚表达。
- source_word: עִיר דָּוִד
  choice: 大卫城
  rationale: 采用这一地名在现代汉语中的惯用形式，简洁地保留原文的属格结构。
- source_word: מִיכַל בַּת שָׁאוּל
  choice: 扫罗的女儿米甲
  rationale: 忠实保留人物的亲属身份；该称谓在叙事中具有显著意义，汉语按自然语序置于姓名之前。
- source_word: נִשְׁקְפָה בְּעַד הַחַלּוֹן
  choice: 从窗户向外望
  rationale: 动词表示从某一处向外观看；介词短语说明视线经过窗户。此译法不强行断定她是在向下看。
- source_word: הַמֶּלֶךְ דָּוִד
  choice: 大卫王
  rationale: 按现代汉语称谓习惯组合头衔与姓名，同时保留原文对大卫王者身份的明示。
- source_word: מְפַזֵּז וּמְכַרְכֵּר
  choice: 跳跃旋转
  rationale: 两个罕见的分词描绘热烈、有节奏的身体动作；分别译出弹跳和转动的动态，不笼统合并成“跳舞”。
- source_word: וַתִּבֶז לוֹ בְּלִבָּהּ
  choice: 心里就轻视他
  rationale: 直陈她内心对大卫的鄙视，不将其弱化为不赞同或不喜欢；“就”承接她所见与内心反应。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文两次直接使用四字神名。音译“雅威”保留其作为以色列之神专名的性质，不以称号取代，也不采用较晚形成的混合读音。
- issue: 米甲内心反应的道德评价
  choice: 仅译作“心里就轻视他”
  alternative: 增译为“因此犯罪”或“错误地轻视他”
  rationale: 本节叙述米甲的内心态度，却未在此处明说神学判断；译文保留叙事张力，不抢先加入解释。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。句式紧凑，维持原文由场景、观看到内心反应的叙事推进；不使用古雅虚词，也不额外解释米甲的动机。
