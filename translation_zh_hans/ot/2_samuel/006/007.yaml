base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/007.yaml
  text: And the anger of Yahweh burned against Uzzah[a], and God struck him there for the error, and he died there beside the ark of God.
translation:
  language: zh_hans
  text: 耶和华的怒气向乌撒燃起；神就在那里击打他，因那过错[a]；他就死在那里，在神的约柜旁。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“因为那冒失的举动”“因那不敬之举”；也可能指“因为他伸出了手”。这里的希伯来语含义难以确定，历来有不同理解。
    reason: 说明罕见词 שַׁל 的多种可能释义，避免正文将疑难含义解释得过于确定。
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: 怒气……燃起
  rationale: 保留希伯来语“怒气燃烧”的意象，同时采用自然、庄重的现代汉语表达。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代汉语圣经传统中通行的专名“耶和华”呈现四字神名，而不以“主”这一称号替代。
- source_word: בְּעֻזָּה
  choice: 向乌撒
  rationale: 介词在该愤怒惯用语中标明怒气所针对的对象；“向乌撒”符合汉语表达。
- source_word: וַיַּכֵּהוּ
  choice: 击打他
  rationale: 直接表达 נכה 的基本含义，并由后文另行交代死亡结果，不提前强化为“击杀”。
- source_word: שָׁם
  choice: 在那里
  rationale: 原文两次使用该地点副词，译文也两次保留，以体现叙事对审判及死亡地点的强调。
- source_word: הָאֱלֹהִים
  choice: 神
  rationale: 原文此处由神名转用 אֱלֹהִים，译文保留这一称谓变化。
- source_word: עַל הַשַּׁל
  choice: 因为那过错
  rationale: שַׁל 是罕见且含义不确定的词；“那过错”不把其具体性质解释得过满，并以脚注交代其他可能理解。
- source_word: וַיָּמָת
  choice: 他便死
  rationale: 以简明的叙事表达呈现动作及其结果；“便”自然承接前面的击打。
- source_word: עִם אֲרוֹן הָאֱלֹהִים
  choice: 在神的约柜旁
  rationale: עִם 基本义为“与”，但这里表示空间位置；译作“在……旁”可避免误解为陪同关系。
theological_decisions:
- issue: 如何翻译乌撒受击原因中的疑难短语 עַל הַשַּׁל
  choice: 因为那过错
  alternative: 因为那冒失的举动；因为他伸出了手；因那不敬之举
  rationale: 该希伯来短语罕见而难解，可能泛指过错、冒失或不敬，也可能特指伸手触碰约柜。正文采用较少诠释性的“那过错”，脚注保留其他理解，不消除原文的歧义及其神学张力。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。保留原文两次“在那里”的重复以及“耶和华”与“神”的称谓变化；脚注标记置于对应的疑难短语之后。
