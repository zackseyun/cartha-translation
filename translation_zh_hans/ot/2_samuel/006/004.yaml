  text: וַ/יִּשָּׂאֻ֗/הוּ מִ/בֵּ֤ית אֲבִֽינָדָב֙ אֲשֶׁ֣ר בַּ/גִּבְעָ֔ה עִ֖ם אֲר֣וֹן הָ/אֱלֹהִ֑ים וְ/אַחְי֕וֹ הֹלֵ֖ךְ לִ/פְנֵ֥י הָ/אָרֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/004.yaml
  text: They carried it from the house of Abinadab[a], which was on the hill, with the ark of God, and Ahio was walking before the ark.
translation:
  language: zh_hans
  text: 他们把载着上帝的约柜的车从山冈[a]上的亚比拿达家里运出来；亚希约走在约柜前面。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “山冈”或译“基比亚”。希伯来语“基瓦”（גִּבְעָה）既可指山冈，也可用作地名“基比亚”。
    reason: 保留希伯来词既可作普通名词、也可作地名的歧义。
lexical_decisions:
- source_word: וַיִּשָּׂאֻהוּ
  choice: 他们把车……运出来
  rationale: 动词 נשׂא 在此表示搬运、运送；阳性单数宾语后缀所指承接上节的“新车”。译出“车”可使现代汉语指代清楚，又不改变原文所述的运输场景。
- source_word: מִבֵּית אֲבִינָדָב
  choice: 从……亚比拿达的家里
  rationale: 介词 מִן 表示起点，בֵּית אֲבִינָדָב 指亚比拿达的家或住所；“从……家里运出来”符合现代汉语表达。
- source_word: אֲשֶׁר בַּגִּבְעָה
  choice: 山冈上
  rationale: גִּבְעָה 可作普通名词“山冈”，也可能是地名“基比亚”。正文依其带冠词的形式和修饰住所的句法，采用普通名词义；另一可能收入脚注。
- source_word: עִם אֲרוֹן הָאֱלֹהִים
  choice: 车上有上帝的约柜
  rationale: עִם 基本表示伴随。结合上节约柜被放在车上的背景，汉语用“车上有”自然表达车与约柜一同被运出的关系，避免误解为另有一群人与约柜同行。
- source_word: וְאַחְיוֹ
  choice: 亚希约
  rationale: 按希伯来人名 אַחְיוֹ 音译，并采用现代中文圣经人名的通行形式。
- source_word: הֹלֵךְ
  choice: 走
  rationale: 分词表示运输过程中持续、同时发生的动作；汉语“走在……前面”自然体现这一进行状态。
- source_word: לִפְנֵי הָאָרוֹן
  choice: 在约柜前面
  rationale: לִפְנֵי 在这里是空间方位，指亚希约行在约柜之前。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“上帝的约柜”清楚表达 אֲרוֹן הָאֱלֹהִים；用分号呈现运输约柜与亚希约在前行走这两个同时发生的动作。脚注标记置于整节末尾，所注内容对应正文“山冈上”。
