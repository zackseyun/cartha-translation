  text: וַ/יִּרָ֥א דָוִ֛ד אֶת יְהוָ֖ה בַּ/יּ֣וֹם הַ/ה֑וּא וַ/יֹּ֕אמֶר אֵ֛יךְ יָב֥וֹא אֵלַ֖/י אֲר֥וֹן יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/009.yaml
  text: And David feared Yahweh that day[a], and he said, “How can the ark of Yahweh come to me?”
translation:
  language: zh_hans
  text: 那一天，大卫惧怕雅威，说：“雅威的约柜怎能到我这里来呢？”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语也可直译为：“雅威的约柜要怎样到我这里来呢？”这句话既可能是在询问实际该怎么办，也可能表达乌撒死后大卫因恐惧或自觉不配而产生的疑问。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרָא
  choice: 惧怕
  rationale: 本词是 ירא 的 Qal 形式，并直接以雅威为宾语。结合乌撒死亡的紧邻语境，“惧怕”既保留大卫真实的恐惧，也不排除对神的敬畏；单译“敬畏”会削弱此处叙事中的惊惧感。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译四字神名 YHWH，保留其作为以色列之神专名的性质，而不以“主”这一称号代替。
- source_word: בַּיּוֹם הַהוּא
  choice: 那一天
  rationale: 自然、准确地表达特指的时间短语，并与前述事件紧密相连。
- source_word: אֵיךְ
  choice: 怎能
  rationale: 在乌撒之死的背景下，这个疑问不只是询问将来的方式，也带有恐惧之下对可能性或合宜性的疑问。“怎能”自然传达这种语气，同时以脚注保留直译“要怎样”的可能。
- source_word: יָבֹא
  choice: 到……来
  rationale: בוא 的基本意义是“来、到达”。采用主动表达，不增添原文没有的“被运来”之被动含义。
- source_word: אֵלַי
  choice: 到我这里来
  rationale: 准确表达“向我、到我这里”，不擅自具体化为“大卫的家”或其他地点。
- source_word: אֲרוֹן יְהוָה
  choice: 雅威的约柜
  rationale: 透明呈现原文的附属结构；“约柜”是现代汉语圣经语境中清楚而庄重的称呼。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用神的专名。译作“雅威”较贴近 YHWH 通常重构的读音，并避免用“主”这一称号代替专名；“耶和华”虽是汉语传统译名，但其读音源自较晚的混合形式。
- issue: 大卫的“惧怕”是恐惧还是敬畏
  choice: 保留“惧怕”的强烈情绪，同时不排除敬畏含义
  alternative: 敬畏
  rationale: 乌撒刚因触碰约柜而死，叙事重点明显包含恐惧；但 ירא 对神使用时也可能兼具敬畏意味，因此不把它解释成单纯惊恐或单纯虔敬。
- issue: 大卫的问题表达实际困难还是不配之感
  choice: 正文用“怎能”，不明确限定原因
  alternative: “要怎样”或解释为“我不配”
  rationale: 原文 אֵיךְ 可询问方式，也可在本语境中表达因恐惧而产生的不能或不敢。正文保留张力，脚注说明另一种较直译的理解，不把“不配”直接写入经文。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“那一天”简洁衔接上下文；“惧怕”保留叙事情绪；问句使用“怎能……呢”体现大卫受到震动后的语气，同时不在正文中替原文消除其动机上的含混。脚注标记置于所解释的问句之后。
