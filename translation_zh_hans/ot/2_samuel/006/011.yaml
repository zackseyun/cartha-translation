source:
  edition: WLC
  text: וַ/יֵּשֶׁב֩ אֲר֨וֹן יְהוָ֜ה בֵּ֣ית עֹבֵ֥ד אֱדֹ֛ם הַ/גִּתִּ֖י שְׁלֹשָׁ֣ה חֳדָשִׁ֑ים וַ/יְבָ֧רֶךְ יְהוָ֛ה אֶת עֹבֵ֥ד אֱדֹ֖ם וְ/אֶת כָּל בֵּיתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/011.yaml
  text: And the ark of Yahweh remained in the house of Obed-edom the Gittite for three months[b][a], and Yahweh blessed Obed-edom and all his household.
translation:
  language: zh_hans
  text: 雅威的约柜在迦特人[a]俄别以东的家里停留了三个月；雅威赐福给俄别以东和他的全家[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “迦特人”指与迦特城有关的人。
    reason: cultural_note
  - marker: b
    text: 或译“他整个家室”。原文既可指全家的人，也可广指其家庭及家业。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: 停留
  rationale: ישׁב可表示“坐、居住、停留”。这里主语是约柜，并有“三个月”这一时段，译作“停留”最自然，也准确表达持续放置在那里的意思。
- source_word: אֲרוֹן יְהוָה
  choice: 雅威的约柜
  rationale: 按构造关系直译。אֲרוֹן在本叙事中指象征雅威临在的约柜；现代中文以“约柜”最清楚且符合既有圣经用语。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以“雅威”音译四字神名，保留原文所用的专名，而不以称号代替。
- source_word: בֵּית עֹבֵד אֱדֹם
  choice: 俄别以东的家里
  rationale: 此处בֵּית表示约柜停放的实际住所；“家里”比生硬的“房屋中”自然，同时不排除其家庭居所的范围。
- source_word: עֹבֵד אֱדֹם
  choice: 俄别以东
  rationale: 按现代中文圣经人名惯例音译该专名。
- source_word: הַגִּתִּי
  choice: 迦特人
  rationale: 这是由地名迦特构成的族籍或地域称谓；“迦特人”简洁地保留原文形式。
- source_word: שְׁלֹשָׁה חֳדָשִׁים
  choice: 三个月
  rationale: 直接表达原文的持续时段，中文无须另加介词。
- source_word: וַיְבָרֶךְ
  choice: 赐福给
  rationale: ברך的基本义是“赐福”；采用“赐福给”清楚表明雅威是施福者。
- source_word: אֶת עֹבֵד אֱדֹם וְאֶת כָּל בֵּיתוֹ
  choice: 俄别以东和他的全家
  rationale: 这里בֵּיתוֹ可指家人，也可广指其整个家室或家业。“全家”在正文中自然简洁，并以脚注保留较广的可能范围。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名。译作“雅威”旨在以现代汉语音译保留这一专名，不将其改换为“主”等称号。
- issue: “他的全家”的范围
  choice: 保留家庭与家室范围的开放性
  alternative: 明确限定为家人
  rationale: בֵּיתוֹ既可指家庭成员，也可广指整个家室或家庭产业；正文用“全家”，脚注说明广义，避免把祝福对象过度限定。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。句式紧凑，保留原文两个连续事件的叙事节奏；用分号连接停留与赐福，清楚呈现其先后关系。
