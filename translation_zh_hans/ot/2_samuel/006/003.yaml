base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/003.yaml
  text: They set the ark of God on a new cart and brought it from the house of Abinadab[a], which was on the hill; and Uzzah and Ahio, the sons of Abinadab, were driving the new cart.
translation:
  language: zh_hans
  text: 他们把上帝的约柜安放在一辆新车上，从亚比拿达在山冈上的家中运出来；亚比拿达的儿子乌撒和亚希约赶着新车。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在山冈上”或译“在基比亚”，把这里的词理解为地名。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּרְכִּבוּ
  choice: 安放在……上
  rationale: 该使役形式表示使某物乘载或置于其上；对约柜和车而言，“安放在……上”自然且准确。
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: 上帝的约柜
  rationale: “约柜”是现代汉语圣经语境中对这一圣物清楚而通行的称呼；“上帝”对应 אֱלֹהִים。
- source_word: אֶל עֲגָלָה חֲדָשָׁה
  choice: 在一辆新车上
  rationale: 结合安放动作，אֶל 在此表达移到车上；“车”简洁自然，指上下文中的运载车辆。
- source_word: וַיִּשָּׂאֻהוּ
  choice: 运出来
  rationale: נשא 可表示抬起、携带或运送；约柜已经放在车上，因此“运出来”既保留移动含义，也避免暗示由人徒手抬运。
- source_word: מִבֵּית אֲבִינָדָב
  choice: 从亚比拿达……的家中
  rationale: 准确表达从亚比拿达家中出来的起点关系，并采用通行的人名音译。
- source_word: אֲשֶׁר בַּגִּבְעָה
  choice: 在山冈上的
  rationale: 带冠词的 גִּבְעָה 在此最自然地理解为地形描述“山冈”；也可能被理解为地名“基比亚”，故以脚注保留。
- source_word: וְעֻזָּא וְאַחְיוֹ
  choice: 乌撒和亚希约
  rationale: 按现代汉语圣经传统音译两个人名。
- source_word: בְּנֵי אֲבִינָדָב
  choice: 亚比拿达的儿子
  rationale: בְּנֵי 在本叙事中最自然地指亲生儿子；汉语以单数类称“儿子”统摄两人，表达自然。
- source_word: נֹהֲגִים
  choice: 赶着
  rationale: 该分词可指驱赶或引导牲畜、车辆；“赶着新车”符合古代畜力车的场景。
- source_word: הָעֲגָלָה חֲדָשָׁה
  choice: 新车
  rationale: 保留原文重复，以维持叙事强调和词汇一致性。
