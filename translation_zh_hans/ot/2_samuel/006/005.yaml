id: 2SA.6.5
reference: 2 Samuel 6:5
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/דָוִ֣ד וְ/כָל בֵּ֣ית יִשְׂרָאֵ֗ל מְשַֽׂחֲקִים֙ לִ/פְנֵ֣י יְהוָ֔ה בְּ/כֹ֖ל עֲצֵ֣י בְרוֹשִׁ֑ים וּ/בְ/כִנֹּר֤וֹת וּ/בִ/נְבָלִים֙ וּ/בְ/תֻפִּ֔ים וּ/בִ/מְנַֽעַנְעִ֖ים וּֽ/בְ/צֶלְצֶלִֽים׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/005.yaml
  text: And David and all the house of Israel were celebrating before Yahweh with all kinds of cypress wood instruments[a], and with lyres, harps, tambourines, rattles[c][b], and cymbals.
translation:
  language: zh_hans
  text: 大卫和以色列全家在雅威面前欢庆[a]，用各样柏木制的乐器[b]，又弹琴和竖琴，击鼓，摇响器[c]，敲钹。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “欢庆”也可译作“嬉乐”或“欢跃”；原词可表示带有嬉戏意味的节庆活动。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“用各样柏木”；这里可能是指用柏木制成的各种乐器。所指树种也不确定，或为枞树、杜松一类。
    reason: textual_difficulty
  - marker: c
    text: “摇响器”所指的确切乐器不明，可能是叉铃或其他靠摇动发声的打击乐器。
    reason: lexical_alternative
lexical_decisions:
- source_word: מְשַׂחֲקִים
  choice: 欢庆
  rationale: 该动词在此指队伍中欢腾、嬉乐的庆祝活动；“欢庆”符合乐器伴奏的语境，又不把含义收窄为单纯演奏。
- source_word: לִפְנֵי יְהוָה
  choice: 在雅威面前
  rationale: 保留希伯来语表示在神临在之中的常用表达，并将四字神名音译为“雅威”。
- source_word: בְּכֹל עֲצֵי בְרוֹשִׁים
  choice: 用各样柏木制的乐器
  rationale: 原文直译近似“用各样柏木”，句法省略且含义困难；根据随后的乐器清单，正文补出“制的乐器”，同时以脚注保留字面形式及树种的不确定性。
- source_word: כִנֹּרוֹת
  choice: 琴
  rationale: 指古代里拉琴一类的弦乐器；“琴”简洁易懂，并与后面的 נְבָלִים 区分。
- source_word: נְבָלִים
  choice: 竖琴
  rationale: 指与 כִנּוֹר 不同的一种弦乐器，确切形制不明；“竖琴”是现代读者容易理解的近似称呼。
- source_word: תֻפִּים
  choice: 鼓
  rationale: 通常指手持的框鼓；中文“鼓”自然且不暗示它必定带有铃片。
- source_word: מְנַעַנְעִים
  choice: 摇响器
  rationale: 该罕见词可能指靠摇动发声的打击乐器；“摇响器”传达发声方式，同时避免武断认定为某一种具体古代乐器。
- source_word: צֶלְצֶלִים
  choice: 钹
  rationale: 指互相撞击发声的金属打击乐器，“钹”是准确而通行的中文名称。
- source_word: כָל בֵּית יִשְׂרָאֵל
  choice: 以色列全家
  rationale: 保留“家”这一群体性比喻，表达整个以色列共同体。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；音译“雅威”保留其作为立约之神专名的性质，而不以称号取代。
- issue: מְשַׂחֲקִים 所表达的敬拜行动
  choice: 欢庆
  alternative: 嬉乐；欢跃；演奏
  rationale: 原词可指嬉戏、欢跃或庆祝，语境又有多种乐器；“欢庆”保留群体节庆的广度，不把行动限定为演奏，也不额外赋予特定礼仪含义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“弹、击、摇、敲”按各类乐器的典型动作补出，使中文清楚流畅；希伯来语介词结构可自然涵盖这些动作。对原文省略和罕见乐器名称的不确定性均以脚注说明，未作过度确定的考古学认定。
