base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/010.yaml
  text: So David was not willing to bring the ark of Yahweh to himself into the City of David[b][a], but David turned it aside to the house of Obed-edom the Gittite.
translation:
  language: zh_hans
  text: 大卫不愿把雅威的约柜运到他那里，到大卫城去[a]；就把它转送到迦特人俄别以东的家中。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“上到大卫城。”原文介词可表示朝向某地，也可含有向上而行的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: אָבָה
  choice: 不愿
  rationale: 该词表示愿意、同意；否定式译为“不愿”，既保留意愿和决定的意味，也不强化为带有对抗色彩的“拒绝”。
- source_word: לְהָסִיר אֵלָיו
  choice: 接到自己所在的……里
  rationale: הֵסִיר本义有移开、转移之意；与אֵלָיו连用并结合迁移约柜的语境，汉语用“接到自己所在的……里”自然表达把约柜运到大卫那里，同时与后文实际转送别处形成对照。
- source_word: אֲרוֹן יְהוָה
  choice: 雅威的约柜
  rationale: 保留原文的属格结构；אֲרוֹן在此指神圣的约柜。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译呈现四字神名，区别于作为称号的“主”。
- source_word: עַל עִיר דָוִד
  choice: 大卫城里
  rationale: עַל在这里表示朝向或到达某处；正文按叙事目的地自然译作“里”，其“上到”的空间意味列入脚注。
- source_word: וַיַּטֵּהוּ
  choice: 把约柜转送到
  rationale: נטה在此表示使其转向另一处；“转送”既体现改变原定目的地，也符合运送约柜的具体语境。重复“约柜”可避免汉语代词指向含混。
- source_word: בֵּית עֹבֵד אֱדֹם
  choice: 俄别以东的家中
  rationale: בֵּית既可指房屋也可指家族；此处强调约柜被安置的地点，译作“家中”最贴合上下文。
- source_word: הַגִּתִּי
  choice: 迦特人
  rationale: 该族称表示来自迦特的人；汉语直接译出地名关系，比音译族称更清楚。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；译作“雅威”旨在呈现专名，并避免以称号“主”代替。
- issue: 大卫不愿迎入约柜的语气强度
  choice: 不愿
  alternative: 拒绝
  rationale: אָבָה的否定表达不愿意或不同意；“不愿”保留大卫因前文事件而产生的畏惧与迟疑，却不把原文强化成公然抗拒。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“自己所在的大卫城里”把原文“到他那里”和“大卫城”之间略显紧凑的关系自然呈现出来；脚注保留介词可能含有的“上到”意味。人名采用常见汉语圣经译名“俄别以东”，神名则按专名音译为“雅威”。
