revisions:
- from: 大卫不愿把雅威的约柜接到自己所在的大卫城里[a]，而是把约柜转送到迦特人俄别以东[b]的家中。
  to: 大卫不愿把雅威的约柜运到他那里，到大卫城去[a]；就把它转送到迦特人俄别以东的家中。
  rationale: 修订删除“自己所在”这一解释性补充，以“运到他那里，到大卫城去”保留原文两个相连的目的地方向；将“接到”改为“运到”，并收紧脚注a，使其准确对应介词的替代理解。脚注b保留为族称的透明化替代说明，虽正文未设b锚点亦不影响经文意义。
