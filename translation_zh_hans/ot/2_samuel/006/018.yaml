  text: וַ/יְכַ֣ל דָּוִ֔ד מֵ/הַעֲל֥וֹת הָ/עוֹלָ֖ה וְ/הַ/שְּׁלָמִ֑ים וַ/יְבָ֣רֶךְ אֶת הָ/עָ֔ם בְּ/שֵׁ֖ם יְהוָ֥ה צְבָאֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/018.yaml
  text: When David had finished offering the burnt offering and the peace offerings[a], he blessed the people in the name of Yahweh of hosts.
translation:
  language: zh_hans
  text: 大卫献完燔祭和平安祭，就奉万军之雅威[a]的名为百姓祝福。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威”是希伯来文神名 יהוה（YHWH）的音译；“万军”也可译作“众军”。
    reason: 说明神名的音译，并保留 צְבָאוֹת 的另一种可能表达。
lexical_decisions:
- source_word: וַיְכַל ... מֵהַעֲלוֹת
  choice: 献完……后
  rationale: כּלה 后接带 מִן 的使役式不定词，表示完成献祭；中文用“献完……后”自然呈现前一行动完成、随后祝福的叙事次序。
- source_word: הָעֹלָה
  choice: 燔祭
  rationale: עֹלָה 是整件焚烧献上的祭，采用现代中文圣经语境中简洁且可识别的标准术语“燔祭”，并保留原文单数的类称用法。
- source_word: וְהַשְּׁלָמִים
  choice: 和平安祭
  rationale: שְׁלָמִים 指与平安、福祉及共享相交有关的一类祭物；“平安祭”既保留词义联系，也较为简洁。
- source_word: וַיְבָרֶךְ אֶת־הָעָם
  choice: 就……给百姓祝福
  rationale: 忠实表达 ברך 的“祝福”之义；“给百姓祝福”是自然现代汉语，并以“就”承接下一主要行动。
- source_word: בְּשֵׁם
  choice: 奉……的名
  rationale: 此处表示借着所称之名及其权柄施行祝福；“奉……的名”是准确、自然且庄重的中文表达。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译呈现四字神名，而不以“主”这一称号替代专名。
- source_word: צְבָאוֹת
  choice: 万军之
  rationale: צְבָאוֹת 可指众军或众天军；“万军之”保留其宽广含义，并与神名合成庄重的称号。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用神的专名；“雅威”按较通行的学术重构音译，不以称号替代，也不采用源自较晚元音组合的传统音译。
- issue: יְהוָה צְבָאוֹת 的理解
  choice: 万军之雅威
  alternative: 军队之雅威；万军之主
  rationale: 保留 צְבָאוֹת 可能涵盖地上众军与天上众军的广度；不加原文没有的“主”，也不把所指限缩为单一军队。
- issue: שְׁלָמִים 的祭祀含义
  choice: 平安祭
  alternative: 团契祭；福祉祭
  rationale: 该词兼有关乎平安、福祉和共享祭物的语义。“平安祭”保持传统可识别性，同时不在正文中排除其他内涵。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“献完……后，就……”自然呈现希伯来叙事顺序；祭祀术语保留经文传统的可识别性，神名则按原文作为专名音译。
