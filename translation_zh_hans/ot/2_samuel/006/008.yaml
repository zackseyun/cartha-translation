base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/008.yaml
  text: And David was angry because Yahweh had broken out against Uzzah[a], and he called that place Perez-uzzah to this day.
translation:
  language: zh_hans
  text: 大卫因耶和华向乌撒发动了一次猛烈的冲击而发怒，就给那地方起名叫“毗列斯乌撒”[a]；那地方直到今日还叫这名。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “毗列斯乌撒”意近“向乌撒的爆发（或冲击）”。这地名与前面“发动了一次猛烈的冲击”所译的希伯来语出自同一词根，形成双关。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר לְדָוִד
  choice: 大卫……发怒
  rationale: 希伯来语习语 חרה ל 表示发怒；这样译为自然的现代汉语，同时保留大卫强烈的情绪。
- source_word: פָּרַץ יְהוָה פֶּרֶץ בְּעֻזָּה
  choice: 耶和华猛烈击打乌撒
  rationale: 原文以同根的动词和名词突出突然、猛烈且具有毁灭性的冲击。汉语若机械重复“冲破一个破口”会晦涩，因此用“猛烈击打”传达事件力度，并在脚注说明其与地名之间的双关。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文圣经语境中对神圣四字名最通行、最易识别的专名音译，而不以称号“主”替代。
- source_word: וַיִּקְרָא לַמָּקוֹם הַהוּא
  choice: 就给那地方起名叫
  rationale: 这是标准的命名句式；该译法符合现代汉语表达。
- source_word: פֶּרֶץ עֻזָּה
  choice: 毗列斯·乌撒
  rationale: 将地名音译，并用间隔号清楚呈现两个构词成分；其词义及与前句的呼应置于脚注。
- source_word: עַד הַיּוֹם הַזֶּה
  choice: 这名字沿用至今
  rationale: 按上下文明确“至今”所指的是该地名仍在使用，比孤立的“直到今日”更自然。
theological_decisions:
- issue: 如何表达神对乌撒的直接审判行动
  choice: 耶和华猛烈击打乌撒
  alternative: 耶和华冲破乌撒／耶和华使灾祸临到乌撒
  rationale: 原文明确以耶和华为行动主体，并用同根词强化突然爆发的毁灭性；译文不把事件淡化为意外或非直接后果。
- issue: 大卫发怒的对象或方向
  choice: 保留“大卫因……而发怒”的开放表达
  alternative: 大卫向耶和华发怒／大卫为乌撒发怒
  rationale: 介词 עַל 在此可引出发怒的缘由，但原文没有明说大卫究竟向谁发怒；译文不擅自补足对象，以保留叙事中的张力。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“猛烈击打”优先保证中文可理解性，原文同根反复及地名双关则由脚注补足；不明确大卫发怒所针对的对象。
