  naturalness: 整体为自然、庄重的现代汉语。“有人禀告大卫王说”可自然表达希伯来文未指明传话者的被动报告。“欢欢喜喜地”流畅，且恰当表达以喜乐随行／行事的状态。
  terminology: “耶和华”对应 יהוה，“上帝”对应 אֱלֹהִים，二者区分清楚；“约柜”“大卫城”“俄别以东”均为通行且合宜的圣经术语。脚注说明神名原文及“雅威”这一常见替代音译，足以保留术语透明度。
