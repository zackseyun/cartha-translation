  text: וַ/יֻּגַּ֗ד לַ/מֶּ֣לֶךְ דָּוִד֮ לֵ/אמֹר֒ בֵּרַ֣ךְ יְהוָ֗ה אֶת בֵּ֨ית עֹבֵ֤ד אֱדֹם֙ וְ/אֶת כָּל אֲשֶׁר ל֔/וֹ בַּ/עֲב֖וּר אֲר֣וֹן הָ/אֱלֹהִ֑ים וַ/יֵּ֣לֶךְ דָּוִ֗ד וַ/יַּעַל֩ אֶת אֲר֨וֹן הָ/אֱלֹהִ֜ים מִ/בֵּ֨ית עֹבֵ֥ד אֱדֹ֛ם עִ֥יר דָּוִ֖ד בְּ/שִׂמְחָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/012.yaml
  text: And it was reported to King David[a], saying, “Yahweh has blessed the house of Obed-edom and all that belongs to him because of the ark of God.” So David went and brought up the ark of God from the house of Obed-edom to the city of David with rejoicing.
translation:
  language: zh_hans
  text: 有人禀告大卫王说：“耶和华[a]因上帝的约柜赐福给俄别以东一家，以及他所有的一切。”于是，大卫前去，欢欢喜喜地把上帝的约柜从俄别以东家运上大卫城。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文为上帝的名“YHWH”；也可译作“雅威”。
    reason: 说明神名的原文形式及常见替代音译。
lexical_decisions:
- source_word: וַיֻּגַּד לַמֶּלֶךְ דָּוִד לֵאמֹר
  choice: 有人禀告大卫王说
  rationale: 希伯来文用被动式，不指明传话者。中文以不定主语“有人”自然表达传报发生，同时保留传话者身份未明和“说”所引出的直接引语。
- source_word: בֵּרַךְ יְהוָה
  choice: 耶和华赐福
  rationale: ברך在此表示上帝施予福分；“赐福”符合现代中文宗教语体。神名直译为传统且广为人知的“耶和华”，并以脚注交代原文形式和另一种音译。
- source_word: בֵּית עֹבֵד אֱדֹם
  choice: 俄别以东一家／俄别以东家
  rationale: בֵּית既可指房屋，也可涵盖家人和家业。第一次与“他所有的一切”并列，译作“一家”较自然；第二次表示约柜所在之处，译作“家”。
- source_word: וְאֶת כָּל אֲשֶׁר לוֹ
  choice: 以及他所有的一切
  rationale: 保留原文宽泛范围，不擅自限定为财物、家属或产业。
- source_word: בַּעֲבוּר אֲרוֹן הָאֱלֹהִים
  choice: 因上帝的约柜
  rationale: בַּעֲבוּר在这里表达原因；简洁译为“因”，保留约柜是蒙福缘由的叙述关系。
- source_word: וַיַּעַל אֶת אֲרוֹן הָאֱלֹהִים
  choice: 把上帝的约柜……抬到
  rationale: עלה带有“带上去”的方向意味；约柜按叙事背景由人抬运，中文用“抬到”既合乎具体动作，也自然表达运往大卫城。
- source_word: בְּשִׂמְחָה
  choice: 欢欢喜喜地
  rationale: 表达喜乐、欢庆的状态，语言自然鲜明，又不额外限定庆典的具体形式。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名YHWH。“耶和华”是现代中文读者最熟悉的专名形式；脚注同时说明原文及“雅威”这一更接近学界重构发音的译法，不把神名改成单纯头衔。
- issue: 约柜与赐福之间的因果关系
  choice: 因上帝的约柜赐福
  alternative: 为了上帝的约柜而赐福
  rationale: בַּעֲבוּר在本句最自然地表示原因，即约柜在俄别以东家与该家蒙福相关；译文不进一步解释约柜本身如何与上帝的临在或赐福发生关系。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“禀告”适合向君王报告的场景；“欢欢喜喜地”自然传达喜乐。“上帝”用于 אֱלֹהִים，“耶和华”用于 יְהוָה，使称谓区分清楚。
