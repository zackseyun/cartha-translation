base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/015.yaml
  text: So David and all the house of Israel were bringing up the ark of Yahweh with shouting and with the sound of the horn[a][b].
translation:
  language: zh_hans
  text: 大卫和以色列全家正欢呼[a]，伴着号角声[b]，把雅威的约柜抬上来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“高声呐喊”；希伯来语可指欢庆的高声喝彩或呐喊。
    reason: lexical_alternative
  - marker: b
    text: 或译：“羊角号声”；这里的希伯来语指角制号，通常是羊角制成的。
    reason: lexical_alternative
lexical_decisions:
- source_word: מַעֲלִים
  choice: 正……抬上来
  rationale: 该词是עלה的使役主动分词，在叙事中描写正在进行的动作；“正……抬上来”既保留进行意味，也表达约柜被带往高处的方向。
- source_word: כָל בֵּית יִשְׂרָאֵל
  choice: 以色列全家
  rationale: 直译并保留“家”所表达的整体和家族性含义；现代中文也能自然理解为以色列全体。
- source_word: אֲרוֹן יְהוָה
  choice: 雅威的约柜
  rationale: אֲרוֹן在此指神圣的约柜；יְהוָה按其专名译作“雅威”。
- source_word: תְרוּעָה
  choice: 欢呼
  rationale: 该词可指高声呼喊、欢庆的喝彩或呐喊；本节紧接着另提号角声，因此译作人的“欢呼”可避免与乐器声混同，同时符合庆典语境。
- source_word: קוֹל שׁוֹפָר
  choice: 号角声
  rationale: קוֹל意为声音，שׁוֹפָר指角制的吹奏乐器，常为羊角号；“号角声”比现代“喇叭声”更能体现其古代乐器性质。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较贴近学界通常采用的重构读音，也保留其作为专名的性质。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“以色列全家”保留原文的整体性比喻；调整语序，把伴随方式置于主要动作之前，使中文流畅，同时不改变欢呼、号角声与抬约柜三个要素的关系。
