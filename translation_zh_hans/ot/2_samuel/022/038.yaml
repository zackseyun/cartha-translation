  yaml_path: translation/ot/2_samuel/022/038.yaml
  text: I pursued my enemies and destroyed them[a], and I did not turn back until they were consumed.
translation:
  language: zh_hans
  text: 我追赶我的仇敌，消灭他们；未把他们灭尽[a]，我不回转。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“直到他们全然完结。”希伯来语动词可表示使某事完成、耗尽或彻底除灭。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶרְדְּפָה
  choice: 我追赶
  rationale: רדף在此指军事行动中的追击；“追赶”自然、准确，也保留原文第一人称的叙述力度。
- source_word: אֹיְבַי
  choice: 我的仇敌
  rationale: אֹיֵב加第一人称单数后缀，直指“我的仇敌”；“仇敌”符合诗歌和战争语境，且保持庄重。
- source_word: וָאַשְׁמִידֵם
  choice: 将他们消灭
  rationale: שׁמד的使役式表示毁灭、除灭；“消灭”保留其强烈含义，又不额外强化为更具渲染性的措辞。
- source_word: וְלֹא אָשׁוּב
  choice: 我就不回转
  rationale: שׁוב在追击语境中指停止追击而转回；“回转”比单纯的“回来”更能表达这一动作。
- source_word: עַד כַּלּוֹתָם
  choice: 他们没有灭尽
  rationale: כלה可指完结、耗尽或灭尽。结合上下文，“灭尽”体现敌人被彻底除掉的终局；以“没有……就不……”自然表达עַד所限定的时限，同时用脚注保留后缀结构可能表达“我把他们灭尽”的理解。
