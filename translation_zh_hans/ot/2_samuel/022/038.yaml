- from: 我追赶我的仇敌，将他们消灭；他们没有灭尽[a]，我就不回转。
  to: 我追赶我的仇敌，消灭他们；未把他们灭尽[a]，我不回转。
  rationale: 改为“未把他们灭尽，我不回转”，使“灭尽”的对象明确为仇敌，并准确表达原文在终结敌人以前不回转的时间界限。脚注保留该希伯来语结构可理解为“直到他们全然完结”的另一种译法。
