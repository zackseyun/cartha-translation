    rationale: עַד כַּלּוֹתָם 的后缀可指敌人被终结，也可按上下文理解为说话者将他们灭尽；无论取何者，“他们没有灭尽，我就不回转”都把敌人说成“没有灭尽”这一动作的施事，并使“我就不回转”成为不恰当的结果。
  - severity: medium
    issue: 脚注的主要译法未反映在正文的自然句法中
    rationale: 脚注正确保留“直到我把他们灭尽”的可能性，但正文应使用能表达说话者持续追击、未完成前不回转的句式。
