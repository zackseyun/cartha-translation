  yaml_path: translation/ot/2_samuel/022/048.yaml
  text: the God who gives vengeance to me and brings peoples down under me.
translation:
  language: zh_hans
  text: 那位把报应交给我、使万民降服在我之下的神。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָאֵל
  choice: 那位……的神
  rationale: 定冠词与“神”构成带后续分词修饰的表达；汉语用“那位……的神”自然衔接两个并列动作。
- source_word: הַנֹּתֵן נְקָמֹת לִי
  choice: 把报应交给我
  rationale: 保留 נְקָמוֹת 的复数/强调整体意义以及 לִי 的“给我、交给我”方向性，不改译为“替我报仇”，以免消除原文可能表示神赋予君王施行报应之权或能力的张力。汉语“报应”在此指对敌人的惩罚性回报。
- source_word: וּמוֹרִיד עַמִּים תַּחְתֵּנִי
  choice: 使万民降服在我之下
  rationale: מוֹרִיד 字面为“使……下来”；结合 תַּחְתֵּנִי（在我之下），译作“使……降服在我之下”表达置于统治之下的语义。“万民”自然传达无冠词复数 עַמִּים 的广泛集合意义，并非严格数学上的每一个民族。
theological_decisions:
- issue: 报应的施行者与受领者
  choice: 把报应交给我
  alternative: 替我报仇／为我施行报应
  rationale: 希伯来文使用 לִי（给我），而非明确表示“替我”的结构。正文保留神将报应给予诗人的表述，不把代理关系解释得过满。
- issue: 诸民处于王之下的性质
  choice: 使万民降服在我之下
  alternative: 使万民倒在我脚下
  rationale: “降服”符合王权与战争语境，也避免把“下来”限定为身体倒地；同时保留神使诸民置于受膏君王之下这一神学张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“报应”比口语化的“报仇”更能表达 נְקָמוֹת 的司法性惩罚含义；“交给我”有意贴近 לִי，并保留原文不易化解的施行者关系。
