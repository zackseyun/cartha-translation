  text: You gave me the necks of my enemies[a]; I destroyed those who hated me.
translation:
  language: zh_hans
  text: 你使我的仇敌转身逃跑[a]；我灭绝了恨我的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译：“你把我仇敌的后颈交给我。”这是说仇敌转身败逃，交在得胜者手中。
    reason: 保留原文的身体意象，并说明其习语含义。
lexical_decisions:
- source_word: אֹיְבַי
  choice: 我的仇敌
  rationale: אֹיֵב通常指“仇敌、敌人”，第一人称单数词尾表示“我的”；“仇敌”符合诗歌语体，也清楚表达敌对关系。
- source_word: תַּתָּה לִּי עֹרֶף
  choice: 你使我的仇敌在我面前转身逃跑
  rationale: 原文直译为“你把后颈给我”，是使敌人转身败逃、将其交在得胜者手中的形象化说法。正文译出习语含义，使现代读者易懂，并以脚注保留原文“后颈”的具体意象。
- source_word: מְשַׂנְאַי
  choice: 恨我的人
  rationale: שׂנא的分词形式配第一人称单数词尾，实词化表示“恨我的人”；此译法自然，并保留原文对这些人的持续性界定。
- source_word: וָאַצְמִיתֵם
  choice: 我灭绝了
  rationale: צמת的使役形在此表示消灭、除尽或使之不复存在。“灭绝”保留了动词的强烈程度和诗歌语气，且不采用较口语化的“彻底消灭”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。前半句在正文中表达希伯来习语的实际含义，脚注保留“后颈”的直译意象；后半句维持原文简洁、有力的平行结构。
