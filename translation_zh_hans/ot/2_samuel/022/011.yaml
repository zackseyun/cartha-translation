base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/011.yaml
  text: He rode on a cherub and flew[a]; he appeared on the wings of the wind.
translation:
  language: zh_hans
  text: 他骑着基路伯飞翔；他在风的翅膀上显现[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “显现”也可译作“被看见”。希伯来语动词两种理解皆有可能。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּרְכַּב
  choice: 他乘着
  rationale: רכב的Qal叙事形式意为“骑、乘”；“乘着”自然地表达其以基路伯为乘驾的诗歌意象。
- source_word: כְּרוּב
  choice: 基路伯
  rationale: 采用中文圣经传统中对这种天上活物的通行音译，保留原文明确而具体的意象。
- source_word: וַיָּעֹף
  choice: 飞翔
  rationale: עוף的基本义是“飞”；“飞翔”在现代汉语中简洁自然，又符合诗体语域，不额外加入“翱翔”等细微含义。
- source_word: וַיֵּרָא
  choice: 显现
  rationale: 该形式通常分析为ראה的Niphal，可表达“被看见”或“显现”。正文用较自然且适合神显语境的“显现”，脚注保留较形式对应的另一译法。
- source_word: כַּנְפֵי
  choice: 翅膀
  rationale: כָּנָף的复数构造形式直译为“……的翅膀”；保留原文鲜明的拟象。
- source_word: רוּחַ
  choice: 风
  rationale: 在这一神显与飞行意象中，רוּחַ最自然地指“风”；译作“灵”不合此处语境，“暴风”则增加了原词本身未明说的强度。
theological_decisions:
- issue: 如何呈现神圣战士与神显的诗歌意象
  choice: 保留“乘着基路伯”“风的翅膀”等具体意象，并将וַיֵּרָא译为“显现”。
  alternative: 将וַיֵּרָא译为“被看见”，或把整句抽象化为上帝迅速降临。
  rationale: 原文以具象诗歌描写耶和华的临现；译文不把它解释成抽象命题。“显现”符合上下文且汉语自然，同时脚注保留Niphal形式所容许的“被看见”，避免消除原文的语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的汉语诗体表达。“基路伯”为既有圣经术语；句法紧凑，保留原文两幅相连的飞行与神显意象。
