  text: חַי יְהוָ֖ה וּ/בָר֣וּךְ צוּרִ֑/י וְ/יָרֻ֕ם אֱלֹהֵ֖י צ֥וּר יִשְׁעִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/047.yaml
  text: Yahweh lives[a], and blessed be my rock, and exalted be God, the rock of my salvation.
translation:
  language: zh_hans
  text: 雅威活着！我的磐石当受颂赞！上帝——我救恩的磐石[a]——当受尊崇！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语也可较直译为“我救恩之磐石的上帝”；“我救恩的磐石”也可译作“拯救我的磐石”。
    reason: 原文连续连属结构可按诗歌平行理解为对“上帝”的同位说明，也可作较字面的连属结构；脚注保留这一句法歧义。
lexical_decisions:
- source_word: חַי יְהוָה
  choice: 雅威永活
  rationale: חַי作谓语，构成颂赞性的宣告，意为雅威是活着的；“永活”在现代汉语中自然、庄重，也传达此处对上帝生命与持续掌权的称颂，而不是起誓公式“我指着雅威的永生起誓”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译直接呈现四字神名，区别于作为称号的“主”。
- source_word: וּבָרוּךְ
  choice: 愿……受颂赞
  rationale: 被动分词在颂歌中具有祝颂、欢呼的语气；“愿……受颂赞”比单纯陈述“是有福的”更符合语境。
- source_word: צוּרִי
  choice: 我的磐石
  rationale: 保留צוּר的具体比喻，表达稳固、保护与庇护，不以解释性的“避难所”取代原有意象。
- source_word: וְיָרֻם
  choice: 愿……受尊崇
  rationale: 未完成式在这里带祈愿或欢呼色彩，并与前句“愿……受颂赞”平行。
- source_word: אֱלֹהֵי צוּר יִשְׁעִי
  choice: 上帝——我救恩的磐石——
  rationale: 按诗歌平行关系将“我救恩的磐石”理解为对“上帝”的同位说明；同时用脚注保留希伯来语连属结构可能产生的另一种理解。
- source_word: יֶשַׁע
  choice: 救恩
  rationale: 该词可指拯救、解救；“救恩”简洁而庄重，并保留其较宽广的拯救含义。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；音译“雅威”使读者看见这是专名，而不是“主”这一称号。
- issue: 上帝作为צוּר的比喻
  choice: 磐石
  alternative: 堡垒；避难所
  rationale: 保留原文的核心意象，不把其稳固、保护等含义直接解释进正文。
- issue: אֱלֹהֵי צוּר יִשְׁעִי的句法关系
  choice: 把“我救恩的磐石”作为“上帝”的同位语
  alternative: 我救恩之磐石的上帝
  rationale: 同位语读法与本节重复的“磐石”意象及诗歌平行更协调，但马所拉文本表面上是连续的连属结构，因此在脚注中保留较直译的可能。
translation_notes:
  register: 采用现代、庄重的颂歌语体，以三个感叹句再现原文的赞美节奏；用“愿……受……”保留两个平行祝颂语的祈愿色彩，并以破折号清楚标示同位说明。
