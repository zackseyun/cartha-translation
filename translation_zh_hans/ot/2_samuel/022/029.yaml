  text: כִּֽי אַתָּ֥ה נֵירִ֖/י יְהוָ֑ה וַ/יהוָ֖ה יַגִּ֥יהַּ חָשְׁכִּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/029.yaml
  text: For you are my lamp[a], O Yahweh[b], and Yahweh lights up my darkness.
translation:
  language: zh_hans
  text: 因为你是我的灯[a]，耶和华；耶和华必照亮我的黑暗。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译“我的灯”；也可按意义译作“我的光”。原文用的是具体的灯这一形象。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，为前面的陈述提供根据；“因为”在现代汉语中自然保留其因果或解释作用。
- source_word: אַתָּה
  choice: 你
  rationale: 第二人称阳性单数代词，直接称呼上帝。
- source_word: נֵירִי
  choice: 我的灯
  rationale: נֵירִי 指具体的“我的灯”，保留希伯来文具体而鲜明的比喻，不抽象化为“我的光”。
- source_word: יְהוָה / וַיהוָה
  choice: 耶和华 / 耶和华
  rationale: 用现代中文读者熟悉的专名“耶和华”译出四字神名；第二小句重复神名，以保留原文的平行和强调。
- source_word: יַגִּיהַּ
  choice: 必照亮
  rationale: 该使役式动词表达“使发光、照亮”；“照亮”自然保留使役意义。“必”体现未完成式在诗歌语境中所表达的确信。
- source_word: חָשְׁכִּי
  choice: 我的黑暗
  rationale: 保留第一人称所属形式和原文开放的隐喻，不限定为危险、患难或忧愁。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文两次使用神的专名；中文正文采用广为人知且可直接作为专名使用的“耶和华”，而不以“主”这一称号替代。
- issue: “我的黑暗”的所指
  choice: 保留未解释的隐喻
  alternative: 我的患难／我周围的黑暗
  rationale: 原文没有明确限定黑暗指危险、困境、忧愁或属灵状态，因此不在正文中消解其神学和诗意张力。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。保留“灯—黑暗”的具体意象和两次神名的平行结构；标点将“耶和华”作为直接称呼处理。
