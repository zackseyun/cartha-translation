  yaml_path: translation/ot/2_samuel/022/039.yaml
  text: I consumed them and shattered them[a], and they did not rise[b]; they fell under my feet.
translation:
  language: zh_hans
  text: 我吞灭了他们[a]，击碎了他们[b]；他们没有起来，倒在我脚下。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “吞灭”的希伯来文基本义为“吃、吞噬”，这里在争战语境中指消灭。
    reason: lexical_alternative
  - marker: b
    text: “击碎”或译“压碎”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֲכַלֵּם
  choice: 我吞灭了他们
  rationale: אכל的基本义是“吃、吞噬”，在争战语境中引申为“消灭”。“吞灭”既保留诗歌中鲜明的吞噬意象，也能自然表达彻底消灭。
- source_word: וָאֶמְחָצֵם
  choice: 击碎了他们
  rationale: מחץ可表示“击打、压碎、击碎”。“击碎”保留强烈的争战意象，并与前面的“吞灭”形成紧凑的诗性并列。
- source_word: וְלֹא יְקוּמוּן
  choice: 他们没有起来
  rationale: 原文直接陈述他们没有起来，并未明说“不能”。译文避免加入原文未明确表达的能力或可能性。
- source_word: וַיִּפְּלוּ
  choice: 倒在
  rationale: נפל通常表示“落下、倒下”。此处译作“倒在”，符合战败者倒地的语境，也使现代汉语表达流畅。
- source_word: תַּחַת רַגְלָי
  choice: 我脚下
  rationale: 直译为“我的脚下”，是表示征服与彻底败亡的具体形象；中文用“在我脚下”自然清楚。
theological_decisions:
- issue: 大卫凯歌中的暴力争战意象
  choice: 保留第一人称彻底毁灭敌人的强烈措辞
  alternative: 弱化为“我彻底打败了他们”
  rationale: 希伯来文连续使用“吞灭”“击碎”“倒在脚下”等鲜明而严厉的诗歌意象。译文不因现代读者的感受而淡化原文，也不对这段争战语言作超出文本的神学解释。
translation_notes:
  register: 采用现代、凝练而庄重的诗歌语言。两个短分句保留原文连续动作的力度；末句以“倒在我脚下”保存征服和败亡的形象。
