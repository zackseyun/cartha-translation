  text: וַ/תַּזְרֵ֥/נִי חַ֖יִל לַ/מִּלְחָמָ֑ה תַּכְרִ֥יעַ קָמַ֖/י תַּחְתֵּֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/040.yaml
  text: You armed me with strength for battle[b][a]; you caused those who rose against me to bow beneath me.
translation:
  language: zh_hans
  text: 你以力量装备我去争战[a]；你使那些起来攻击我的人屈伏在我之下[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你以力量给我束腰，使我能争战。”原文动词含有束腰、配备的意象。
    reason: lexical_alternative
  - marker: b
    text: 或译：“你使我的敌手屈膝在我之下。”原文动词可更具体地表示使人跪下或弯腰。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּזְרֵנִי
  choice: 你以……装备我
  rationale: 该动词在这里有束腰、配备之意；译作“装备”既保留为争战作准备的含义，也符合现代汉语表达。
- source_word: חַיִל
  choice: 力量
  rationale: 此词可指力量、勇力或作战能力；本句强调上帝使说话者有能力争战，因此译作“力量”。
- source_word: לַמִּלְחָמָה
  choice: 去争战
  rationale: 原文可指战争或战斗；结合“装备我”，译作“去争战”自然地表达目的。
- source_word: תַּכְרִיעַ
  choice: 你使……屈伏
  rationale: 这是使役形式，表示使人弯下、跪下或降卑；“使……屈伏”保留其使役意义和身体姿态的意象。
- source_word: קָמַי
  choice: 那些起来攻击我的人
  rationale: 原文直指“起来反对我的人”；“起来攻击我的人”保留“起来”的动态意象，并明确其敌对含义。
- source_word: תַּחְתֵּנִי
  choice: 在我之下
  rationale: 直译为“在我下面”；此译保留敌手被压服在说话者之下的空间与权势意象，而不增添原文没有明说的“脚”。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“装备我去争战”清楚表达原文的军事语境；第二分句保留“起来攻击”“屈伏”“在我之下”等原文意象，不把它泛化为单纯的“战胜”或“制服”。
