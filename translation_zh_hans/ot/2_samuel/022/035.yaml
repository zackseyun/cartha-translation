base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/035.yaml
  text: He trains my hands for battle[b][a], and my arms can bend a bow of bronze.
translation:
  language: zh_hans
  text: 他训练我的双手作战[a]；青铜弓被我的双臂拉开[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“争战”或“打仗”。
    reason: lexical_alternative
  - marker: b
    text: 或译“我的双臂能拉开青铜弓”。原文采用被动表达，描写这弓在上帝所赐的力量下被拉开。
    reason: lexical_alternative
lexical_decisions:
- source_word: מְלַמֵּד
  choice: 训练
  rationale: 该分词表示教导或训练；在军事语境中，“训练”自然地体现实战技能的培养。
- source_word: יָדַי
  choice: 我的双手
  rationale: 保留原文具体的身体意象，并与后半句的“双臂”形成对应。
- source_word: לַמִּלְחָמָה
  choice: 作战
  rationale: מִלְחָמָה 可指战争或战斗；“作战”既适合“训练双手”的搭配，也不把含义局限为长期战争。
- source_word: וְנִחַת
  choice: 也被……拉开
  rationale: 按此处被动形式及句法，将青铜弓呈现为在诗人双臂的力量下被拉开；这样保留原文的表达重点，又符合现代汉语。
- source_word: קֶשֶׁת
  choice: 弓
  rationale: 该词在此指作战所用的弓。
- source_word: נְחוּשָׁה
  choice: 青铜
  rationale: 该词可指铜或青铜；传统军事意象中“青铜弓”既准确又自然，并突出弓的坚硬。
- source_word: זְרֹעֹתַי
  choice: 我的双臂
  rationale: 保留复数身体意象，与前句“我的双手”平行，并强调所得的力量。
theological_decisions:
- issue: 军事能力中的神圣施予
  choice: 本节把大卫的作战技能和力量归于上帝的训练，同时保留其字面军事语境。
  alternative: 把本节泛化为上帝装备信徒进行属灵争战。
  rationale: 上下文是君王为上帝在实际战争中的拯救和加力而献上的感恩诗；译文不将历史性的战争语言寓意化。
- issue: 拉开青铜弓的施事与能力表达
  choice: 采用“青铜弓被我的双臂拉开”，保留希伯来文的被动构式。
  alternative: 译作“我的双臂能拉开青铜弓”，明确表达能力。
  rationale: 被动译法更贴近马所拉文本，并保留弓在上帝所赐力量之下被拉开的画面；能力式译法则是合乎语境的自然汉语解释，列入脚注。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“双手—双臂”保留原文的身体意象和平行结构；分号呈现两个紧密相关的诗行。
