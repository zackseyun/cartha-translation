base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/050.yaml
  text: Therefore I will praise you among the nations[a], O Yahweh, and I will sing praise to your name.
translation:
  language: zh_hans
  text: 因此，耶和华啊，我要在列国中称谢你[a]，歌颂你的名。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “称谢”也可译作“赞美”。
    reason: 原文动词兼有感谢与颂赞的语义，语境无法将两者截然分开。
lexical_decisions:
- source_word: עַל כֵּן
  choice: 因此
  rationale: 承接上文所述的拯救，表达由此得出的回应；“因此”简洁地保留了原文的推论关系。
- source_word: אוֹדְךָ
  choice: 我要称谢你
  rationale: ידה的使役式在敬拜语境中兼有感谢、颂赞之意。“称谢”保留感谢的色彩，也能与下句“歌颂”形成诗歌平行。
- source_word: יְהוָה
  choice: 耶和华啊
  rationale: 原文直接使用以色列上帝的专名יהוה；采用现代中文圣经读者熟悉的音译“耶和华”，并以“啊”标明呼语。
- source_word: בַּגּוֹיִם
  choice: 在列国中
  rationale: גּוֹיִם在此泛指众国、各国；“列国”保留诗体庄重感，也避免把词义限缩为后期语境中的“外邦人”。
- source_word: וּלְשִׁמְךָ
  choice: 歌颂你的名
  rationale: 保留“名”这一原文意象，因为它涉及上帝所彰显的身份与声誉，不宜直接简化为“歌颂你”。
- source_word: אֲזַמֵּר
  choice: 歌颂
  rationale: זמר的加强词干表示以歌唱或音乐发出赞美；“歌颂”在现代汉语中自然，并与前半句构成平行。
theological_decisions:
- issue: יהוה的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 原文使用神的专名而非称号。正文采用中文读者广泛熟悉的专名音译“耶和华”，不以称号替代；“雅威”是另一种较接近学界拟音的译法。
- issue: ידה在本节中的语义侧重
  choice: 称谢
  alternative: 赞美
  rationale: 该动词在颂赞语境中可兼指感谢和赞美。译作“称谢”保留其感谢意味，同时借下句“歌颂”清楚呈现赞美语境，不把两行完全同义化。
translation_notes:
  register: 采用自然、庄重而简洁的现代标准汉语。“列国”与“称谢”略带诗歌和敬拜语体，但仍为普通读者所能理解；句序保留原文两行平行结构。
