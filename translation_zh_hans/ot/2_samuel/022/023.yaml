base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/023.yaml
  text: For all his judgments were before me[a], and I did not turn away from his statutes.
translation:
  language: zh_hans
  text: '因为他的一切判决都在我面前，

    我没有偏离他的律例。[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文末尾为阴性单数代词，所指不甚明确；可按集合意义理解为“他的律例”，也可能概括前文的律法规定。
    reason: 保留原文代词所指的歧义，避免将其确定地扩展为复数的“判决和律例”。
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，为前述陈言说明理由；“因为”自然保留希伯来语的因果关系。
- source_word: כָל
  choice: 一切
  rationale: 保留该量词全面、无遗漏的语义。
- source_word: מִשְׁפָּטָיו
  choice: 他的判决
  rationale: מִשְׁפָּט可指司法判决、典章或法令；“判决”既保留其司法色彩，也与下句“律例”构成不同法律术语的平行。
- source_word: לְנֶגְדִּי
  choice: 都在我面前
  rationale: 保留原文空间隐喻，表达这些判决一直摆在说话者眼前、受到留意。
- source_word: וְחֻקֹּתָיו
  choice: 他的律例
  rationale: חֻקּוֹת指所制定的固定规条；“律例”庄重自然，并保留它与מִשְׁפָּטִים的词义区别。
- source_word: לֹא אָסוּר
  choice: 我也没有偏离
  rationale: סוּר表示转离、偏离；这里采用“偏离”，自然表达没有背离上帝所定律例。
- source_word: מִמֶּנָּה
  choice: 偏离（他的律例）
  rationale: 原文代词为阴性单数，所指在诗歌表达中并不完全明朗；正文借助语序让“他的律例”成为自然所指，同时用脚注保留代词也可能泛指前述一切判决和律例的理解。
theological_decisions:
- issue: 如何呈现盟约律法中的两个不同术语
  choice: 分别译作“判决”和“律例”
  alternative: 将二者笼统译作“法令”“律法”或“诫命”
  rationale: 原文以两个不同法律术语构成诗句平行；保留区别可避免抹平原文的词汇层次，也不额外引入特定宗派的律法分类。
- issue: 末尾代词的所指
  choice: 正文按最近的先行语理解为“他的律例”
  alternative: 理解为泛指前述所有判决和律例，即“我也没有偏离它们”
  rationale: מִמֶּנָּה形式上是阴性单数，但紧接阳性复数חֻקֹּתָיו，可能反映诗歌中的集合用法或语法吸引。正文采用自然汉语表达，脚注保留真实的指代歧义。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌体汉语；分作两行以呈现希伯来诗句的平行结构。“判决／律例”保留法律术语的区别，“在我面前”保留原文隐喻。
