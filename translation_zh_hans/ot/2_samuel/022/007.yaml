base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/007.yaml
  text: In my distress I call on Yahweh[a]; I call to my God. He hears my voice from his temple[b], and my cry for help reaches his ears.
translation:
  language: zh_hans
  text: 我在困苦中呼求雅威；我向我的上帝呼求。他从他的殿[a]中听见我的声音；我的求救声达到他耳中。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “殿”也可译作“宫殿”或“圣所”，这里可能指上帝在天上的居所。
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּצַּר לִי
  choice: 我在困苦中
  rationale: צַר表示困境、患难或受压迫的处境；“在困苦中”自然地保留了处境含义，又不额外限定痛苦程度。
- source_word: אֶקְרָא
  choice: 呼求
  rationale: קרא在此指向上帝呼喊、求告；两次均译“呼求”，保留原文的重复和平行结构。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文直接音译四字神名，区别于作为称号的“主”。
- source_word: אֱלֹהַי
  choice: 我的上帝
  rationale: 单数形式加第一人称单数词尾，直译为“我的上帝”。
- source_word: וַיִּשְׁמַע
  choice: 他……听见了
  rationale: 保留希伯来叙事动词的过去时推进作用，与整首回顾拯救经历的语境协调。
- source_word: מֵהֵיכָלוֹ
  choice: 从自己的殿中
  rationale: הֵיכָל可指宫殿、圣殿或圣所；“殿”保留汉语中圣殿与王宫的部分语义空间，并适合指上帝天上的居所。
- source_word: קוֹלִי
  choice: 我的声音
  rationale: 直接对应קוֹל加第一人称单数词尾。
- source_word: שַׁוְעָתִי
  choice: 我的求救声
  rationale: שַׁוְעָה是在患难中求援的呼喊；“求救声”简洁表达其求助内涵。
- source_word: בְּאָזְנָיו
  choice: 传入他耳中
  rationale: 原文直义为“在他耳中”；“传入他耳中”是自然的现代汉语，同时保留耳朵的具体意象。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文使用上帝的专名而非称号；采用较贴近学界通行重构读音的“雅威”，不以“主”替代专名。
- issue: הֵיכָל所指的神圣居所
  choice: 殿
  alternative: 宫殿；圣所；圣殿
  rationale: 该词兼有王宫与圣殿语义，在此可能指上帝天上的居所。“殿”既自然，又不把王权或圣所意象单方面固定下来。
- issue: וַיִּשְׁמַע的时态呈现
  choice: 听见了
  alternative: 听见
  rationale: 采用希伯来叙事动词的通常过去时值，呈现诗人对上帝回应的回顾；现在时理解虽有可能，但不宜在正文中取代形式更直接的读法。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语；保留两次“呼求”的诗歌重复，并以分号呈现平行句式。正文使用“雅威”音译神名。
