  text: יִשְׁלַ֥ח מִ/מָּר֖וֹם יִקָּחֵ֑/נִי יַֽמְשֵׁ֖/נִי מִ/מַּ֥יִם רַבִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/017.yaml
  text: He sent from on high[a]; he took me[b]; he drew me out of many waters.
translation:
  language: zh_hans
  text: 他从高处伸出手来[a]，拉住我；他把我从众水中拉出来[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “伸出手来”是按上下文补足的表达。原文直译可作“他从高处差遣”或“他从高处伸出”；原文没有明说所差遣或伸出的对象。
    reason: lexical_alternative
  - marker: b
    text: 或译“许多水中”“浩大之水中”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׁלַח מִמָּרוֹם
  choice: 他从高处伸手
  rationale: יִשְׁלַח通常表示“差遣、伸出”，原文未明说所伸出的是“手”。结合紧接的“抓住我”和救援图景，译作“伸手”在现代汉语中自然，也保留从上方施救的空间意象；以脚注说明其字面歧义。מָרוֹם译作“高处”，不把较宽泛的诗歌表达限定为“天上”。
- source_word: יִקָּחֵנִי
  choice: 抓住我
  rationale: לקח基本义为“拿、取、带走”。在伸手施救的连续动作中，“抓住我”比“取我”更符合现代汉语，又没有加入原文之外的施救方式。
- source_word: יַמְשֵׁנִי
  choice: 把我……拉上来
  rationale: משׁה的使役形在此指从水中拉出；“拉上来”准确呈现由水中获救的方向和动作，在汉语中也较自然。
- source_word: מִמַּיִם רַבִּים
  choice: 从滔滔大水中
  rationale: 字面为“从众多的水中”。רַבִּים既可强调数量，也可在语境中表达浩大；“滔滔大水”保留诗意和险境感，同时脚注列出更贴近形式的译法。
theological_decisions:
- issue: 来自高处的神圣救援意象
  choice: 保留“从高处”，不明确译成“从天上”
  alternative: 从天上
  rationale: מָרוֹם指高处或高位。上下文表明施救者是上帝，但原词本身没有明确使用“天”一词；译文因此保留诗歌性的空间表达，不进一步限定其宇宙观含义。
- issue: 首个动词省略受事对象
  choice: 按语境译作“伸手”，并用脚注提示“手”为隐含内容
  alternative: 他从高处差遣
  rationale: 原文只说“他从高处差遣／伸出”，没有明说所差遣或伸出的对象。汉语若直译会显得残缺；“伸手”能与“抓住我”连贯成施救图景，同时不把补足内容伪装成毫无歧义的字面信息。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌体。“高处”保留原文含蓄的空间意象；“滔滔大水”呈现诗性危难图景。分号保留希伯来诗句中两个连续施救动作的节奏。
