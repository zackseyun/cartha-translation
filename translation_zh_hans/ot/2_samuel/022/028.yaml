  yaml_path: translation/ot/2_samuel/022/028.yaml
  text: You save an afflicted people[b][a], but your eyes are on the haughty to bring them low.
translation:
  language: zh_hans
  text: 你拯救困苦的百姓[a]；但你的眼目在狂傲的人身上；你使他们降卑。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“贫穷的百姓”或“卑微的百姓”。希伯来语这个词可指贫穷、受苦、受压迫或处境卑微的人。
    reason: lexical_alternative
  - marker: b
    text: 或译：“骄傲的人”或“自高的人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: עַם
  choice: 百姓
  rationale: 这是表示群体的单数集合名词；“百姓”在诗歌语境中自然，也不必将其限定为一个政治意义上的“国家”。
- source_word: עָנִי
  choice: 困苦的
  rationale: 该词可指贫穷、受苦、受压迫或处于卑微境况；“困苦的”保留社会处境与受患难的含义，又不把词义缩减为单纯的经济贫困。
- source_word: תּוֹשִׁיעַ
  choice: 你拯救
  rationale: 使役词形在这里表示救助、解救；“拯救”简洁庄重，并保留较宽广的救拔含义。
- source_word: עֵינֶיךָ
  choice: 你的眼目
  rationale: 保留希伯来文具体而鲜明的身体意象；“眼目”适合庄重的诗歌语体。
- source_word: עַל
  choice: 注视
  rationale: 介词基本义为“在……之上／向着／针对”；结合“眼目”的习语，以“注视”自然表达目光落在某人身上，同时不额外断定其确切方式。
- source_word: רָמִים
  choice: 狂傲的人
  rationale: 该复数形式本可表示高处或被高举者，但在与困苦者的对照以及“降卑”的搭配中，主要带有骄傲自高的伦理意味。
- source_word: תַּשְׁפִּיל
  choice: 要把他们降卑
  rationale: שׁפל的使役形意为使之降低、使之卑下。补出中文所需的宾语“他们”，指前面的狂傲者；“要”使前半句的注视与后面的行动关系清楚。
- source_word: וְ
  choice: 但
  rationale: 希伯来文形式上是“和”，但两行在意义上构成困苦者与狂傲者、拯救与降卑之间的对照；中文用“但”更清楚自然。
theological_decisions:
- issue: 这里的对照是社会处境还是道德状态
  choice: 译文以“困苦的百姓”与“狂傲的人”形成对照，同时保留前者可能涉及贫穷、受压迫和卑微处境的含义。
  alternative: 把两者仅理解为经济贫困者与社会地位高的人。
  rationale: עָנִ可涵盖贫穷、受苦和卑微，רָמִים则在本语境中具有自高骄傲的色彩。译文不把对照仅限于经济或阶层，也不抹去其社会层面。
- issue: “你的眼目在狂傲者身上”与“降卑”的句法关系
  choice: 译作“你的眼目注视……，要把他们降卑”，保留眼目的意象，并将降卑理解为针对狂傲者的行动。
  alternative: 译作“你使狂傲的眼目降卑”，采用诗篇18:27平行经文较紧凑的表达。
  rationale: 撒母耳记下本节的马所拉文本明确有“你的眼目”和介词עַל，不应直接用平行经文的措辞取代本处独特句法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“眼目”有适度诗歌色彩，保留原文意象；分号呈现两行之间的鲜明对照。脚注标记均放在所解释的词语之后。
