base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/032.yaml
  text: For who is God besides Yahweh? And who is a rock besides our God?[a]
translation:
  language: zh_hans
  text: 因为除雅威以外，谁是上帝？除我们的上帝以外，谁是磐石？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “磐石”在希伯来文中是常用的比喻，有时近似用作上帝的称号；本句也可理解为：“除我们的上帝以外，谁是‘磐石’？”
    reason: 保留 צוּר 作为普通比喻或近似神圣称号的词汇与修辞可能性。
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，为前面的赞美提供理由；“因为”自然保留了希伯来文的解释性连接作用。
- source_word: מִי
  choice: 谁
  rationale: 保留原文反问句式，强调除雅威以外并无别神。
- source_word: אֵל
  choice: 上帝
  rationale: 在这一排他性、独一神信仰的语境中，指真正的上帝；“上帝”是现代普通话中自然庄重的表达。
- source_word: מִבַּלְעֲדֵי
  choice: 除……以外
  rationale: 准确表达排除和唯一性的含义，同时符合现代汉语习惯。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按原文保留上帝的专名，而不以“主”等称号替代。
- source_word: צוּר
  choice: 磐石
  rationale: 直接保留希伯来文关于稳固、保障与庇护的常见比喻；“磐石”比普通的“石头”更能传达该意象。
- source_word: אֱלֹהֵינוּ
  choice: 我们的上帝
  rationale: 保留第一人称复数所属关系，传达群体性的认信。
theological_decisions:
- issue: 如何译出神名 יְהוָה
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；音译为“雅威”保留其专名性质，避免用称号替代。
- issue: צוּר 是普通比喻还是近似称号
  choice: 磐石
  alternative: “磐石”（作为近似称号理解）
  rationale: 原文在表语位置使用该词，既可视为普通比喻，也可能近似上帝的称号。正文不额外作神学定性，脚注保留后一种理解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话；两个平行反问句尽量保持原文的简洁和诗歌对称。
