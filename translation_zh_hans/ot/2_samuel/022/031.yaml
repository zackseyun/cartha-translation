id: 2SA.22.31
reference: 2 Samuel 22:31
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: הָ/אֵ֖ל תָּמִ֣ים דַּרְכּ֑/וֹ אִמְרַ֤ת יְהוָה֙ צְרוּפָ֔ה מָגֵ֣ן ה֔וּא לְ/כֹ֖ל הַ/חֹסִ֥ים בּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/031.yaml
  text: As for God[a], his way is blameless; the word of Yahweh is proven; he is a shield to all who take refuge in him.
translation:
  language: zh_hans
  text: 至于上帝，他的道路无可指摘；雅威的话经过熬炼[a]；他是所有投靠他之人的盾牌。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“经受过检验”或“证明为可靠”；希伯来语采用金属在炉中熬炼、除去杂质的意象。
    reason: 说明 צְרוּפָה 的熔炼比喻及其“经过检验而可靠”的语义范围。
lexical_decisions:
- source_word: הָאֵל
  choice: 至于上帝
  rationale: 定冠词加“上帝”位于诗句开头，具有话题突出作用；“至于上帝”在现代汉语中自然地保留这一语篇功能。
- source_word: תָּמִים
  choice: 无可指摘
  rationale: 此词形容上帝的道路完整、无缺、没有瑕疵；“无可指摘”兼顾道德与品质层面的含义，也避免把它抽象化为哲学意义上的“完美”。
- source_word: דַּרְכּוֹ
  choice: 他的道路
  rationale: “道路”既保留诗歌意象，也可自然指上帝行事的方式和作为。
- source_word: אִמְרַת יְהוָה
  choice: 雅威的话
  rationale: אִמְרָה可指言语、话语或宣告；译作“话”保持宽广语义，并与上下诗句相称。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译呈现四字神名，保留其专名性质，而不以“主”等称号替代。
- source_word: צְרוּפָה
  choice: 经过熬炼
  rationale: 该词源于金属熔炼、提纯的意象，表示经过检验而显明纯正可靠；正文保留具体比喻，脚注说明其引申意义。
- source_word: מָגֵן הוּא
  choice: 他是……的盾牌
  rationale: 保留希伯来语明确的代词和盾牌比喻，以“是”构成自然的现代汉语判断句。
- source_word: לְכֹל הַחֹסִים בּוֹ
  choice: 所有投靠他之人的
  rationale: חסה具体指寻求庇护、投靠；“投靠他”比单纯的“信靠他”更完整地保存保护和避难的意象。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用神的专名。译作“雅威”力求以汉语音译保留专名，不用称号替换，也不据此加入额外的宗派解释。
- issue: צְרוּפָה 修饰“雅威的话”时的比喻力量
  choice: 经过熬炼
  alternative: 经得起考验；已经证明可靠
  rationale: 直译保留金属在火中炼净的诗歌意象，同时容纳“受过检验、证明可靠”的结果义；不把其中任一层含义排除掉。
- issue: תָּמִים 对上帝道路的描述
  choice: 无可指摘
  alternative: 完美；完整无缺
  rationale: “无可指摘”表达上帝行事没有缺陷或过失，但不将希伯来词静默限定为某种后期哲学或系统神学概念。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。保留原诗三个平行分句及“道路—熬炼—盾牌”的具体意象；“至于”呈现句首话题突出，“投靠”延续盾牌所营造的避难图景。
