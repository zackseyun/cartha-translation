base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/021.yaml
  text: Yahweh has dealt with me according to my righteousness[b][a]; according to the cleanness of my hands he has repaid me.
translation:
  language: zh_hans
  text: 耶和华按我的公义待我[a]，按我双手的清洁[b]报答我。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“报偿我”。希伯来语动词可指按照一个人的行为相应地对待或回报他。
    reason: lexical_alternative
  - marker: b
    text: “双手的清洁”是希伯来语习语，指行为上的清白或纯正。
    reason: cultural_note
lexical_decisions:
- source_word: יִגְמְלֵנִי
  choice: 待我
  rationale: גמל可指按人的行为相应地对待或报偿。译作“待我”保留较宽的语义范围，同时由下半句“报答我”显明此处正面的报偿含义。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代汉语中通行且可辨识的专名“耶和华”译出四字神名，不以称号替代。
- source_word: כְּצִדְקָתִי
  choice: 按我的公义
  rationale: 直译第一人称的צדקה，表达诗人在当前语境中所声称的正直行为；不将其弱化，也不扩大为绝对无罪或凭功德得救。
- source_word: כְּבֹר
  choice: 按……的清洁
  rationale: בֹּר表示清洁、纯净；与“双手”搭配保留希伯来诗歌的具体意象。
- source_word: יָדַי
  choice: 我双手
  rationale: “双手的清洁”保留原文以手指代行为的习语，同时符合自然的现代汉语表达。
- source_word: יָשִׁיב לִי
  choice: 报答我
  rationale: שוב的使役形式在此表示回报、偿还；“报答我”与上半句形成诗意平行，并在语境中自然表达正面的回报。
theological_decisions:
- issue: 本节是否宣称诗人绝对无罪，或凭个人功德获得救恩
  choice: 照原文保留“我的公义”和“我双手的清洁”，理解为诗人就当前处境与行为所作的申诉。
  alternative: 弱化个人公义的措辞，或将其解释成绝对无罪及凭功德得救。
  rationale: 原文明确使用第一人称的“公义”与“清洁”。译文应保留这种神学张力，不把它削弱，也不加入超出本节范围的教义结论。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语，并保留原文两行的平行结构。“公义”承接圣经传统术语；“双手的清洁”保留诗歌意象，并以脚注说明其习语意义。
