  text: מגדיל יְשׁוּע֣וֹת מַלְכּ֑/וֹ וְ/עֹֽשֶׂה חֶ֧סֶד לִ/מְשִׁיח֛/וֹ לְ/דָוִ֥ד וּ/לְ/זַרְע֖/וֹ עַד עוֹלָֽם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/051.yaml
  text: He gives great salvation to his king and shows covenant faithfulness to his anointed[c][b][a], to David and to his offspring forever.
translation:
  language: zh_hans
  text: 他赐给自己的王极大的拯救[a]，向自己的受膏者[b]显出守约的慈爱[c]，就是向大卫和他的后裔，直到永远。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“使自己的王得着极大的拯救”或“使自己的王大获胜利”。原文“拯救”为复数，可指多次的解救或胜利。
    reason: lexical_alternative
  - marker: b
    text: “受膏者”也可译作“弥赛亚”。这里首先指大卫及其王室后裔，同时也呼应更广的弥赛亚应许。
    reason: alternative_reading
  - marker: c
    text: 也可译作“坚定的慈爱”或“忠贞之爱”。原文所用的词常指忠诚、坚定并信守盟约的爱。
    reason: lexical_alternative
lexical_decisions:
- source_word: מגדיל יְשׁוּעוֹת
  choice: 大大拯救
  rationale: מגדיל是גדל的使役分词，搭配复数יְשׁוּעוֹת，描写上帝使拯救或胜利增大、显著。译作“大大拯救”符合现代汉语表达，也保留反复或丰盛施行拯救的含义。
- source_word: מַלְכּוֹ
  choice: 自己的王
  rationale: 原文直译为“他的王”。现代汉语用“自己的王”可清楚表明王属于施行拯救的上帝，避免代词关系含混。
- source_word: וְעֹשֶׂה חֶסֶד
  choice: 施守约的慈爱
  rationale: חֶסֶד兼有慈爱、忠诚和信守盟约的含义；在大卫之约的语境中，“守约的慈爱”兼顾其关系性与承诺性，且不把它缩减为单纯情感。
- source_word: לִמְשִׁיחוֹ
  choice: 向自己的受膏者
  rationale: מָשִׁיחַ的基本含义是“受膏者”。本节首先指大卫以及大卫王系，不在正文中直接限定为后来的专称“弥赛亚”，从而保留其历史所指及弥赛亚意蕴。
- source_word: לְדָוִד
  choice: 向大卫
  rationale: 按现代汉语通行形式音译人名。
- source_word: וּלְזַרְעוֹ
  choice: 和他的后裔
  rationale: זֶרַע在此是单数集合名词。“后裔”自然地表达大卫延续的世系，也保留盟约应许的整体含义。
- source_word: עַד עוֹלָם
  choice: 直到永远
  rationale: 自然表达持续无尽的时间范围，符合本节有关大卫及其后裔之应许的语境。
theological_decisions:
- issue: 大卫之约语境中חֶסֶד的译法
  choice: 守约的慈爱
  alternative: 坚定的慈爱；忠贞之爱；施恩慈爱
  rationale: 上下文强调耶和华对王及其世系持久的忠诚和承诺。“守约的慈爱”呈现这一盟约维度，同时保留“慈爱”这一关系性含义。
- issue: מְשִׁיחוֹ的译法
  choice: 自己的受膏者
  alternative: 自己的弥赛亚
  rationale: 该词在本节直接指大卫或大卫王系。“受膏者”既忠于词义和历史语境，也不排除经文在大卫之约中具有更广的弥赛亚指向。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“大大拯救”简洁有力；“自己的”明确希伯来语第三人称所有格的指向；“守约的慈爱”兼顾חֶסֶד的慈爱与盟约忠诚内涵。正文不直接使用“弥赛亚”，以免越过本节首先指向大卫王的历史层面，并以脚注保留弥赛亚意蕴。
