  text: He makes my feet like the feet of deer[b][a], and sets me secure on my heights.
translation:
  language: zh_hans
  text: 他使我的脚像母鹿的脚一样[a]，又使我立在我的高处[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译：“使我的脚像母鹿一样。”希伯来文指雌鹿；这是一种敏捷、善于在险处立足的形象。
    reason: lexical_alternative
  - marker: b
    text: 或译：“使我立在我的高地上。”
    reason: lexical_alternative
lexical_decisions:
- source_word: מְשַׁוֶּה
  choice: 使……像……一样
  rationale: 该词为 שׁוה 的 Piel 分词，在此表达“使之相似”的使动意义；与后面的比较结构合译，符合现代汉语表达。
- source_word: רַגְלַי
  choice: 我的脚
  rationale: 马所拉文本的辅音写法在所给数据中排版异常，但元音和全句第一人称语境均支持“我的脚”，并与下半句“使我”及“我的高处”一致。
- source_word: כָּאַיָּלוֹת
  choice: 像母鹿的脚一样稳健
  rationale: אַיָּלוֹת 是阴性复数，指母鹿。希伯来文直译为“像母鹿一样”；汉语补出“脚”承接比较对象，并用“稳健”自然传达诗歌意象中的敏捷与立足稳固，而不把它改成单纯的速度。
- source_word: בָּמוֹתַי
  choice: 我的高处
  rationale: 保留复数名词的“高处”及第一人称所属关系；在本诗语境中指高地或高处，不必按祭祀术语“邱坛”理解。
- source_word: יַעֲמִדֵנִי
  choice: 使我……站稳
  rationale: עמד 的 Hiphil 表示“使站立、安置”；“站稳”既保留使动意义，也自然表达在高处稳固立足的语境含义。
theological_decisions:
- issue: “我的高处”的含义
  choice: 保留“我的高处”
  alternative: 使我安然立在高处
  rationale: 原文带第一人称后缀，可能表示属于诗人的高处、他所占据的制高点或得胜之地。保留所属关系可避免把诗意过早限定为避难、安全或军事凯旋。
translation_notes:
  register: 采用庄重而清晰的现代标准汉语。“母鹿”保留希伯来文阴性复数的具体形象；“站稳”较“安置”更贴合脚在高处稳固立足的上下文。脚注标记按正文出现次序排列。
