revisions:
- from: 大卫向雅威说出这首歌的话；那时，雅威救他脱离了所有仇敌的手，也脱离了扫罗的手。
  to: 在雅威救他脱离所有仇敌的手、又脱离扫罗的手的日子，大卫向雅威说了这首歌的话。
  rationale: 将时间短语前置并明确译出“在……的日子”，使其修饰范围和原文一致；保留“向雅威说”“这首歌的话”及两次“手”的表达，不对扫罗是否包含在“所有仇敌”之内作额外解释。
