  text: וַ/יְדַבֵּ֤ר דָּוִד֙ לַֽ/יהוָ֔ה אֶת דִּבְרֵ֖י הַ/שִּׁירָ֣ה הַ/זֹּ֑את בְּ/יוֹם֩ הִצִּ֨יל יְהוָ֥ה אֹת֛/וֹ מִ/כַּ֥ף כָּל אֹיְבָ֖י/ו וּ/מִ/כַּ֥ף שָׁאֽוּל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/001.yaml
  text: And David spoke to Yahweh the words of this song on the day when Yahweh delivered him from the hand of all his enemies and from the hand of Saul[a].
translation:
  language: zh_hans
  text: 在雅威救他脱离所有仇敌的手、又脱离扫罗的手的日子，大卫向雅威说了这首歌的话。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 说出
  rationale: 该动词通常表示“说、讲”；虽然内容是歌，原文并未使用“唱”，因此保留“说出”。
- source_word: לַיהוָה / יְהוָה
  choice: 向雅威 / 雅威
  rationale: 以“雅威”音译四字神名，保留原文所用的专名，并使两个位置的译法一致。
- source_word: אֶת דִּבְרֵי הַשִּׁירָה הַזֹּאת
  choice: 这首歌的话
  rationale: 同时保留“话”和“歌”两个成分，不简化为“这首歌”。
- source_word: בְּיוֹם
  choice: 那时
  rationale: 这里引出作歌的背景时机；“那时”在现代汉语中自然，也不强行理解为仅限某一个历日。
- source_word: הִצִּיל
  choice: 救……脱离
  rationale: 该词指从敌对势力和危险中解救；“救……脱离”准确且符合现代汉语表达。
- source_word: מִכַּף
  choice: 脱离……的手
  rationale: 保留希伯来语“手”所表达的掌控、权势之比喻，而不直接释为“势力”。
- source_word: כָּל אֹיְבָיו
  choice: 所有仇敌
  rationale: 自然、完整地表达集合性的“他所有的敌人”。
- source_word: שָׁאוּל
  choice: 扫罗
  rationale: 采用现代中文圣经传统中通行的人名译法。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名，故以“雅威”音译，保留其专名性质；不以称号取代，也不借译名解决相关历史读音问题。
- issue: 扫罗与“所有仇敌”的关系
  choice: 保留并列措辞：“所有仇敌……也……扫罗”
  alternative: 把扫罗明确列为仇敌之一，或明确排除在仇敌之外
  rationale: 原文先说“所有仇敌的手”，再单独说“扫罗的手”；译文保留这种张力，不替原文界定扫罗是否被归入“仇敌”。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。保留原文略显郑重的“说出这首歌的话”和重复的“手”，以呈现其叙事引言及诗歌标题式风格；用分号划分言说动作与历史背景。
