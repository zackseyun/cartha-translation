base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/042.yaml
  text: They cried for help[a], but there was no one to save; they cried to Yahweh, but he did not answer them.
translation:
  language: zh_hans
  text: 他们呼求援助[a]，却无人施救；他们向雅威呼求，他却不回答他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “呼求援助”或译“寻求帮助”或“仰望求助”；此处希伯来词的具体含义有争议。
    reason: lexical_ambiguity
lexical_decisions:
- source_word: יִשְׁעוּ
  choice: 呼求援助
  rationale: 此词的词根归属和具体语义存在一定争议，可理解为“呼求”或“转眼寻求、仰望”。结合下句“无人施救”以及后半节向雅威呼求的平行结构，译作“呼求援助”最符合语境，同时以脚注保留另一种可能。
- source_word: וְאֵין מֹשִׁיעַ
  choice: 却无人施救
  rationale: מֹשִׁיעַ是ישׁע的使役分词，指实施拯救的人；这里不是专用称号，故译作自然的“无人施救”。וְ在呼求落空的语境中具有转折意味，译为“却”。
- source_word: אֶל יְהוָה
  choice: 向雅威呼求
  rationale: 介词אֶל表示呼求的对象或方向。希伯来文此处省略了平行分句中可由上文补出的呼求动词；中文补出“呼求”，使句意和对偶结构清楚。“雅威”直接呈现神名יהוה。
- source_word: וְלֹא עָנָם
  choice: 他却不回答他们
  rationale: ענה在此意为“回答、回应”；第三人称阳性单数主语承接前面的雅威，宾语后缀指“他们”。转折词“却”体现他们呼求而未获回应的反差。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华／上主
  rationale: 原文直接使用四字神名，音译“雅威”较贴近现有语言学证据，也保留其作为专名的性质，不将其改写为称号。
- issue: 雅威不回答敌人的呼求
  choice: 直译为“他却不回答他们”
  alternative: 弱化为“他们没有得到回答”
  rationale: 原文明确以雅威为所理解的主语，并直接陈述他不回答；译文保留这一神学张力，不以被动表达淡化其主动性。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“呼求援助—无人施救；向雅威呼求—不回答”保留原文两组彼此呼应的结构；第二分句补出原文省略但可从平行结构理解的“呼求”。
