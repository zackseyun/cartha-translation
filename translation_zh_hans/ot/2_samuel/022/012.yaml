  text: וַ/יָּ֥שֶׁת חֹ֛שֶׁךְ סְבִיבֹתָ֖י/ו סֻכּ֑וֹת חַֽשְׁרַת מַ֖יִם עָבֵ֥י שְׁחָקִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/012.yaml
  text: He made darkness a shelter around him[a], a massing of waters, thick clouds of the skies.
translation:
  language: zh_hans
  text: 他把黑暗设在自己四围，作为帐幕[a]——聚积的水，天空的密云。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他在自己四围设置黑暗的帐幕：水的聚集，天空的密云。”原文“帐幕”为复数；“聚积的水”所对应的希伯来语十分罕见，也可理解为“水的聚集”，或较意译地译作“乌黑的雨云”。
    reason: 说明诗句句法、复数形式及罕见短语的多种可能理解。
lexical_decisions:
- source_word: וַיָּשֶׁת
  choice: 设
  rationale: 该动词表示“安置、设置”。“设在自己四围”保留其主动安置的空间意象，也符合庄重诗体。
- source_word: חֹשֶׁךְ
  choice: 黑暗
  rationale: 这是该名词的常规对应；在神显的风暴图景中，指环绕他的幽暗。
- source_word: סְבִיבֹתָיו
  choice: 在自己四围
  rationale: 准确表达环绕之意；使用“自己”清楚回指本句主语。
- source_word: סֻכּוֹת
  choice: 帐幕
  rationale: 原文为复数，字面可指棚、帐棚或遮蔽处。中文“作为帐幕”可作集合性表达，既保留遮蔽意象，也避免译成节期性的“棚子”。复数信息在脚注中说明。
- source_word: חַשְׁרַת מַיִם
  choice: 聚积的水
  rationale: 这是罕见且含义不完全确定的短语，可能指水的聚集、密集或浓重水团。“聚积的水”保留具体风暴意象，避免直接释为“乌云”而过度确定其含义。
- source_word: עָבֵי שְׁחָקִים
  choice: 天空的密云
  rationale: עָבֵי 指浓厚的云，שְׁחָקִים 指天空或高天。“天空的密云”自然简洁，并保留高远的诗歌意象。
theological_decisions:
- issue: 黑暗与帐幕的句法关系
  choice: 把“黑暗”译为被安置在他四围、用作帐幕之物
  alternative: “他在自己四围设置黑暗的帐幕”
  rationale: 希伯来诗句句法凝练，חֹשֶׁךְ 与 סֻכּוֹת 的关系可有不同分析。正文采用自然的谓语—宾语—补语结构，但以脚注保留另一种理解，不赋予额外神学含义。
translation_notes:
  register: 采用现代、庄重而凝练的诗歌语言。“四围”“帐幕”“密云”保持经文的崇高语域，同时普通现代读者仍易于理解。破折号呈现后两项与前文风暴遮蔽物之间的诗性并置，不强行消除原文句法张力。
