  yaml_path: translation/ot/2_samuel/022/024.yaml
  text: I was blameless before him[b][a], and I kept myself from my iniquity.
translation:
  language: zh_hans
  text: 我在他面前纯全[a]，也保守自己远离我的罪孽[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我对他纯全（完整）。”希伯来语形容词强调品格的完整、正直或无可指责，不一定表示绝对无罪。
    reason: lexical_alternative
  - marker: b
    text: “罪孽”也可译作“罪”或“罪责”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶהְיֶה
  choice: 我……纯全
  rationale: היה的Qal连续式在诗歌叙述中自然表达过去的状态；汉语不必机械译出句首连接词，也不宜生硬加入“是”。
- source_word: תָמִים
  choice: 纯全
  rationale: 该词在道德和关系语境中兼有完整、正直、无可指责之意。“纯全”保留其整体性与品格内涵，又不必然表示绝对无罪。
- source_word: לוֹ
  choice: 在他面前
  rationale: 字面可作“对他、向他”，此处表达与上帝相关的品格评价；“在他面前”是自然庄重的汉语，同时脚注保留更贴近字面的关系性译法。
- source_word: וָאֶשְׁתַּמְּרָה
  choice: 保守自己
  rationale: שׁמר的反身形态表达自我警醒、防守；“保守自己”简洁保留反身意义。
- source_word: מֵעֲוֺנִי
  choice: 远离我的罪孽
  rationale: 介词מִן表示避开或离开；עָוֹן可指罪孽、罪责或罪。“罪孽”保留较强的道德分量，第一人称后缀明确译为“我的”。
theological_decisions:
- issue: 大卫的陈述是否宣称自己绝对无罪
  choice: 保留他在上帝面前自称纯全、并警戒自己远离罪孽的强烈表述，但不把“纯全”解释为绝对无罪
  alternative: 译成“我完全无罪”，理解为绝对的道德完美
  rationale: תָמִים侧重完整、正直和无可指责，可以描述关系与行为上的纯全，并不必然断言从未犯罪。译文保留原文的神学张力，不替经文弱化或扩大这一自我陈述。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语；保留诗歌式的简洁和平行结构。“纯全”较“无可指责”更能保存希伯来词所含的完整性，“保守自己”则保留原文的反身动作。
