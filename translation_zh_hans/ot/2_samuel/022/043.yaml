  text: I crushed them like the dust of the earth[a]; like the mud of the streets I pounded them and trampled them down.
translation:
  language: zh_hans
  text: 我把他们碾碎，如同地上的尘土；我又把他们捣碎、践踏，如同街上的泥泞[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“把他们压平”或“铺开。”希伯来语这个动词也可表示捶打、压平或铺展开。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶשְׁחָקֵם
  choice: 我把他们碾碎
  rationale: שׁחק在此为第一人称单数、带第三人称复数宾语后缀，表达碾压、磨碎之意；“碾碎”既保留强烈的战争意象，也自然衔接“尘土”的比喻。
- source_word: כַּעֲפַר אָרֶץ
  choice: 如同地上的尘土
  rationale: עָפָר可指尘土或松散的土，אֶרֶץ在此自然理解为地面；“地上的尘土”符合现代汉语，也不必把这一属格结构过度限定为“全地”。
- source_word: כְּטִיט חוּצוֹת
  choice: 如同街上的泥泞
  rationale: טִיט指泥、泥浆或泥泞，חוּצוֹת指街道或城中的公共空地；“街上的泥泞”清楚保留了任人踩踏的图景。
- source_word: אֲדִקֵּם
  choice: 又把他们捣碎
  rationale: דקק的使役式表达使之细碎、捣碎；用“捣碎”与前面的“碾碎”形成近义递进，同时保留希伯来诗歌的平行关系。
- source_word: אֶרְקָעֵם
  choice: 将他们践踏
  rationale: רקע的核心语义可包括捶打、压平、铺展开；在敌人被比作街上泥泞的战争语境中，“践踏”最自然地呈现脚下踩压的意象，但其“压平／铺开”的可能性以脚注保留。
