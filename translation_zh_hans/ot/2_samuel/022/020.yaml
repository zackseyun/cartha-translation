base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/020.yaml
  text: He brought me out into a broad place[a]; he rescued me[b], because he delighted in me.
translation:
  language: zh_hans
  text: 他带我来到宽阔之地[a]；他救了我，因为他喜悦我[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“到开阔之处”。希伯来文以宽广、开放的空间比喻脱离束缚和困境。
    reason: lexical_alternative
  - marker: b
    text: 或译“他以我为喜悦”或“他喜欢我”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּצֵא
  choice: 他领我出来
  rationale: יצא的使役式表示“使出来、带出来”。“领我出来”在现代汉语中自然，也保留了从困境中被带出的意象。
- source_word: לַמֶּרְחָב
  choice: 到宽阔之地
  rationale: מֶרְחָב指宽广、开阔的地方，在此与受困、窘迫形成对照；“宽阔之地”保留原文的空间隐喻。
- source_word: יְחַלְּצֵנִי
  choice: 他救了我
  rationale: חלץ的加强式在此意为救出、搭救。“救了我”简洁自然，并与上一分句平行。
- source_word: כִּי
  choice: 因为
  rationale: 此处引出获救的原因；“因为”清楚表达因果关系。
- source_word: חָפֵץ בִּי
  choice: 他喜悦我
  rationale: חפץ与介词ב连用，表达以某人为喜悦、乐意于某人；“喜悦我”保留其关系性和情感力度。
theological_decisions:
- issue: 上帝施行拯救的原因
  choice: 因为他喜悦我
  alternative: 因为他看我为可喜悦／因为他喜欢我
  rationale: 经文把大卫获救与上帝对他的喜悦直接相连。译文保留这一陈述及其神学张力，不进一步解释为功德，也不削弱为一般性的认可。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“宽阔之地”保留希伯来诗歌的空间意象；分号呈现两个平行的拯救动作。所有脚注标记均置于正文相应词句之后。
