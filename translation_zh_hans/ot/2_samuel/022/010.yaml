  text: He bent the heavens and came down[a]; thick darkness was under his feet.
translation:
  language: zh_hans
  text: 他使诸天低垂，便降下来；浓密的黑暗[a]在他脚下。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“浓密的暗云”。希伯来语 עֲרָפֶל 可指与耶和华显现相伴的浓重幽暗。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּט
  choice: 使……低垂
  rationale: נטה在这里以“诸天”为宾语，描绘上帝使诸天向下弯垂。“使……低垂”既保留动态和宇宙性的诗歌意象，也比生硬的“弯曲诸天”更符合现代汉语。
- source_word: שָׁמַיִם
  choice: 诸天
  rationale: 该复数形式可指天空或诸天；在神显的诗歌语境中，“诸天”保留了庄严而宏阔的语体。
- source_word: וַיֵּרַד
  choice: 降临下来
  rationale: ירד意为向下降。“降临下来”在现代汉语中自然清楚，并保留上帝从高处下来的空间性神显图景。
- source_word: וַעֲרָפֶל
  choice: 浓密的黑暗
  rationale: עֲרָפֶל可指浓重的幽暗，也可带有暗云之意，常见于耶和华显现的场景。“浓密的黑暗”保留其遮蔽、稠密的感受，同时不把它限定为云。
- source_word: תַּחַת
  choice: 在……脚下
  rationale: תַּחַת表达直接的下方空间关系；结合汉语习惯译作“在他脚下”。
- source_word: רַגְלָיו
  choice: 他的脚
  rationale: 原文直指“他的脚”，应保留具体的拟人化身体意象，而不改写为“脚步”或抽象表达。
theological_decisions:
- issue: 上帝显现时的拟人化和空间性意象
  choice: 保留“降临下来”和“在他脚下”的具体表达
  alternative: 弱化为“从天显现”等非身体、非空间性的说法
  rationale: 希伯来文以拟人和空间语言描绘上帝显现。直译其诗歌意象可保留上帝超越性与具象显现方式之间原有的神学张力，而不替文本作解释性消解。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语体。“诸天低垂”保留宏阔的神显画面；分号呈现两个紧密相连的诗句。
