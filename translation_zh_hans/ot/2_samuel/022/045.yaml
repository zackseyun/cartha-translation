base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/045.yaml
  text: The sons of foreigners come cringing to me[b][a]; at the hearing of the ear they obey me.
translation:
  language: zh_hans
  text: 外族人向我屈身归服[a]；他们一听见[b]，就听从我。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“向我假意归服”；也可能强调他们迫于威势而勉强归服。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“在耳朵听见时”，意思是“一听见就立刻回应”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי נֵכָר
  choice: 外族人
  rationale: 该短语直译为“外族之子”，是指异族、外国的人。译作“外族人”既准确表达所指，也符合现代汉语习惯。
- source_word: יִתְכַּחֲשׁוּ לִי
  choice: 向我屈服
  rationale: כחש 的 Hitpael 形式在征服语境中可表示迫于威势而归服，并可能含有勉强或虚假顺从的意味。正文用“屈服”保留受迫归顺的主旨，脚注说明其不真诚的潜在含义。
- source_word: לִשְׁמֹעַ אֹזֶן
  choice: 一听见
  rationale: 原文是“耳朵一听见”的浓缩表达，强调消息一入耳便立即反应；“一听见”自然传达这种即时性。
- source_word: יִשָּׁמְעוּ לִי
  choice: 就听从我
  rationale: שׁמע 后接 לִי 在此不只是听见声音，而是听从、服从；“听从我”同时保留了与前句“听见”的词义呼应。
