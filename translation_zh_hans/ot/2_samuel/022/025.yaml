  text: וַ/יָּ֧שֶׁב יְהוָ֛ה לִ֖/י כְּ/צִדְקָתִ֑/י כְּ/בֹרִ֖/י לְ/נֶ֥גֶד עֵינָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/025.yaml
  text: And Yahweh repaid me according to my righteousness[b][a], according to my cleanness before his eyes.
translation:
  language: zh_hans
  text: 耶和华就照我的公义，照我在他眼前[b]的清白[a]回报我。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“纯洁”。希伯来语此词表示洁净或纯正。
    reason: lexical_alternative
  - marker: b
    text: 即“在他看来”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׁב
  choice: 回报
  rationale: 此处使役性用法与间接受词“我”构成报偿、按行为相应对待的意思。“回报”自然地保留了正面奖赏与较广义报偿的语义，不像“归还”那样生硬。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的专名“耶和华”译出四字神名，而不以称号替代。
- source_word: לִי
  choice: 我
  rationale: 介词标示动词的间接受词；汉语“回报我”无需另译“给”。
- source_word: כְּצִדְקָתִי
  choice: 照我的公义
  rationale: צדקה在此指正直、合乎正义的状态；“公义”保留其道德与关系层面的宽度，“照”表达כְּ所表示的衡量标准。
- source_word: כְּבֹרִי
  choice: 照我的清白
  rationale: בֹּר表示洁净、纯正或清白。此节没有“手”一词，故不从平行经文增补。“清白”在汉语中自然，也适合受审察与获申明的语境；“纯洁”是可行的替代译法。
- source_word: לְנֶגֶד עֵינָיו
  choice: 在他眼前
  rationale: 保留希伯来语“在他眼睛面前”的具体意象，同时在现代汉语中可自然表达“在他看来、在他鉴察之下”。
theological_decisions:
- issue: 大卫声称自己有公义和清白
  choice: 直接保留第一人称的陈述，不加弱化或教义性限定。
  alternative: 将其明说为相对的圣约忠诚，或为避免与大卫所犯的罪产生张力而改写。
  rationale: 希伯来文本明确说耶和华照大卫的公义和清白回报他。译文应保留这一神学张力，不擅自断定这是绝对无罪、相对忠诚，还是特定事件中的无辜。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“照……照……”保留原文并列结构；将“在他眼前”紧接“清白”，维持原文修饰关系及具体意象。
