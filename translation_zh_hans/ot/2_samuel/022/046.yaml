  text: Foreigners lose heart and come trembling out of their strongholds[a][b][c].
translation:
  language: zh_hans
  text: 外邦人丧胆，战战兢兢地从他们的堡垒中出来[a][b][c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“外邦人凋零了。”希伯来语动词较直译可表示“枯萎”或“凋零”。
    reason: lexical_alternative
  - marker: b
    text: 此处希伯来语动词的含义难以确定；也可译为“畏缩着出来”“蹒跚着出来”，或较直译为“束腰”。
    reason: lexical_alternative
  - marker: c
    text: “堡垒”或译“要塞”；也可能指“监牢”或“围闭之处”，但在本段语境中可能性较小。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי נֵכָר
  choice: 外族人
  rationale: 这一组合结构直译为“外族之子”，是指外族人的习语。“外族人”符合现代汉语表达，也保留其群体含义。
- source_word: יִבֹּלוּ
  choice: 胆气尽失
  rationale: נבל通常表示“枯萎、衰残”。在得胜诗的军事语境中，这里更可能描写敌人的勇气或活力消退；“胆气尽失”自然地传达这一语境意义，同时在脚注保留较直译的可能。
- source_word: וְיַחְגְּרוּ
  choice: 战战兢兢地出来
  rationale: 该动词在此处含义疑难。חגר通常意为“束上”，但本处与诗篇18:45的平行经文在语境中常被理解为敌人因恐惧而出来。“战战兢兢地出来”切合上下文，其他解释则列入脚注。
- source_word: מִמִּסְגְּרוֹתָם
  choice: 从他们的堡垒中
  rationale: מִסְגְּרוֹת可指封闭或禁闭之处。在军事凯歌的语境中，“堡垒”最为贴切；“要塞、监牢、围闭之处”等词义可能在脚注说明。
