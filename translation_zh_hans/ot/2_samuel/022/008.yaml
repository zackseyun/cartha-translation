  yaml_path: translation/ot/2_samuel/022/008.yaml
  text: Then the earth reeled and quaked; the foundations of the heavens trembled and shook, because he was angry.
translation:
  language: zh_hans
  text: 于是，大地震荡摇动；诸天的根基战栗摇晃，因为他发怒了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּרְעַשׁ / וַתִּתְגָּעַשׁ
  choice: 摇撼震动
  rationale: 两个近义动词叠用，描写大地剧烈动荡；以两个自然的汉语动词保留原文的强化效果。
- source_word: מוֹסְדוֹת הַשָּׁמַיִם
  choice: 诸天的根基
  rationale: 直译其宇宙图景，并保留复数“诸天”所表达的诗歌色彩。
- source_word: יִרְגָּזוּ וַיִּתְגָּעֲשׁוּ
  choice: 战栗摇晃
  rationale: 保留两个并列动词及其递进的动态感，避免压缩成单一动作。
- source_word: כִּי חָרָה לוֹ
  choice: 因为他发怒了
  rationale: חָרָה לוֹ是表示怒气燃起的惯用语；现代汉语用“发怒”自然、准确。
theological_decisions:
- issue: 代词“他”的所指
  choice: 保留“他”
  alternative: 明说“耶和华”
  rationale: 本节希伯来文本使用第三人称代词，其指向由上文确定；不在本节擅自补出神名，以保留原文衔接。
translation_notes:
  register: 采用庄重而自然的现代书面汉语；以紧凑的并列结构保留希伯来诗歌的节奏和震撼感。
