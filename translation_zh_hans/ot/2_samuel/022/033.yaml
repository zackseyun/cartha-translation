base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/033.yaml
  text: God is my strong refuge[a], and he makes my way blameless.
translation:
  language: zh_hans
  text: 神是我坚固的避难所；他使我所走的路无可指责[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或按辅音文本更直译：“他使他的道路无可指责。”平行经文诗篇18:32支持“我所走的路”。
    reason: alternative_reading
lexical_decisions:
- source_word: הָאֵל
  choice: 神
  rationale: 定冠词与אֵל连用，在这里自然地指独一的神；现代汉语直接译作“神”庄重而流畅。
- source_word: מָעוּזִּי
  choice: 我坚固的避难所
  rationale: מָעוֹז兼有庇护之处和力量保障的含义；“避难所”突出保护，“坚固的”保留其力量色彩，又不过度限定为军事堡垒。
- source_word: חָיִל
  choice: 坚固的
  rationale: 此处表达力量、能力，与מָעוּזִּי结合译为形容性短语“坚固的避难所”，符合现代汉语表达。
- source_word: וַיַּתֵּר
  choice: 他使
  rationale: 该动词在此结构中的含义较难确定；结合诗篇18:32的平行句，可理解为使道路成为某种状态。“他使”简洁地保留这一使役关系。
- source_word: תָּמִים
  choice: 纯全
  rationale: תָּמִים可指完整、健全、无可指责；“纯全”保留完整与正直两方面含义，也避免把它窄化为绝对无罪或毫无缺陷。
- source_word: דרכו
  choice: 我的道路
  rationale: 现存辅音形式可读作“他的道路”，但诗篇18:32的平行文本支持第一人称“我的道路”。正文采用后者，同时以脚注保留辅音文本所呈现的另一读法。
theological_decisions:
- issue: 末词所属代词的读法
  choice: 神使说话者“我的道路”纯全
  alternative: 神使“自己的道路”纯全
  rationale: 撒母耳记现存辅音形式支持“他的道路”，而诗篇18:32的平行句支持“我的道路”；后者与本段中神扶持诗人的语境更连贯，但文本歧义真实存在，因此不在正文中展开解释，而以脚注保存另一读法。
translation_notes:
  register: 采用现代、庄重且易懂的诗歌体汉语。“坚固的避难所”兼顾保护与力量意象；分号呈现两个并列诗句。“纯全”有一定经文语体色彩，但仍属现代读者可理解的表达，并能较好承载תָּמִים的完整与正直含义。
