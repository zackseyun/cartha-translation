  text: וַ/יֵּֽרָאוּ֙ אֲפִ֣קֵי יָ֔ם יִגָּל֖וּ מֹסְד֣וֹת תֵּבֵ֑ל בְּ/גַעֲרַ֣ת יְהוָ֔ה מִ/נִּשְׁמַ֖ת ר֥וּחַ אַפּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/016.yaml
  text: Then the channels of the sea were seen[a]; the foundations of the world were laid bare at the rebuke of Yahweh[b], at the blast of the breath of his nostrils.
translation:
  language: zh_hans
  text: 那时，海的水道显露出来；世界的根基也显露了，因雅威[a]的斥责，因他鼻孔所出的气息。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威”是希伯来文上帝之名 יהוה 的音译；传统汉译常作“耶和华”，有些译本以“主”代替。
    reason: divine_name
  - marker: b
    text: “世界”也可译作“人所居住的世界”；“鼻孔”一词也可引申为“怒气”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרָאוּ
  choice: 显露出来
  rationale: 该词是ראה的尼法勒式，表达“被看见、变得可见”；“显露出来”既保留被动含义，也符合汉语诗歌语感。
- source_word: אֲפִקֵי יָם
  choice: 海的水道
  rationale: אֲפִיקִים可指水道、河槽或水流经过的深槽；“海的水道”保留原文意象，不进一步限定为海床或泉源。
- source_word: יִגָּלוּ
  choice: 暴露了
  rationale: גלה的尼法勒式意为被揭开、显露；此处与前句平行，“暴露了”传达根基完全显出的强烈画面。
- source_word: מֹסְדוֹת תֵּבֵל
  choice: 世界的根基
  rationale: מֹסְדוֹת意为根基；תֵּבֵל是诗体词，可指世界，尤其是人所居住的世界。“世界”自然且保留宏大的宇宙图景。
- source_word: בְּגַעֲרַת
  choice: 因……的斥责
  rationale: גְּעָרָה指斥责、喝斥；介词ב在此表示原因或手段。“因……的斥责”清楚呈现神的喝斥导致天地震动。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以常见的现代汉语音译呈现四字神名，而不以称号替代专名。
- source_word: מִנִּשְׁמַת רוּחַ אַפּוֹ
  choice: 因他鼻孔中气息的吹袭
  rationale: 保留נשמה、רוח所构成的强烈呼气意象，以及אַף在此处“鼻孔”的身体性比喻；“吹袭”表达气息爆发般的力量，同时不把意象抽象化为“怒气”。
theological_decisions:
- issue: 四字神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用以色列上帝的专名；音译“雅威”保留专名性质，而“主”是称号。“耶和华”是传统汉译，但较不贴近学界通常重构的发音。
- issue: אַפּוֹ应译为身体意象还是抽象情绪
  choice: 他鼻孔中
  alternative: 他的怒气
  rationale: אַף既可指鼻子、鼻孔，也可引申为怒气；上下文描写强风般的神圣显现，“鼻孔中气息”与נשמה和רוח直接呼应，并保留原文拟人化诗意，不排除其中暗含愤怒。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语，并保留希伯来诗歌的平行结构和神圣显现中的拟人意象。分号连接显露的结果与造成结果的神圣行动；“这是”补足汉语逻辑关系，但不增添新的神学解释。
