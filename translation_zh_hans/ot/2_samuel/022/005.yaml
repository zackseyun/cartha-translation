base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/005.yaml
  text: For the waves of death surrounded me[b][a]; the torrents of worthlessness terrified me.
translation:
  language: zh_hans
  text: 因为死亡的浪涛[a]包围我；邪恶的洪流[b]使我惊恐。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “浪涛”也可译作“碎浪”或“巨浪”。
    reason: lexical_alternative
  - marker: b
    text: 原文词可指“卑劣”“邪恶”或“毁灭”；也可按专名理解，译作“彼列的洪流”。
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 在诗歌语境中引出前述宣告的缘由，保留其因果或解释作用。
- source_word: אֲפָפֻנִי
  choice: 包围我
  rationale: 准确表达被环绕、围困的意思，现代汉语自然清楚。
- source_word: מִשְׁבְּרֵי
  choice: 巨浪
  rationale: 该词指拍击、破碎的浪涛；“巨浪”既自然，又能传达具有压倒力量的水势意象。
- source_word: מָוֶת
  choice: 死亡
  rationale: 直接保留原文将死亡描绘为汹涌浪涛的诗歌意象。
- source_word: נַחֲלֵי
  choice: 洪流
  rationale: 该词可指河谷、溪流；此处与巨浪平行，并带有威胁性的奔涌水势，译作“洪流”最贴合语境。
- source_word: בְלִיַּעַל
  choice: 邪恶
  rationale: 此处较可能是普通名词，表示卑劣、邪恶或毁灭性的力量；“邪恶”在现代汉语中清楚自然，同时不把它直接人格化。
- source_word: יְבַעֲתֻנִי
  choice: 使我惊恐
  rationale: 传达突然而强烈的恐惧或惊骇，保留原词的强度。
theological_decisions:
- issue: בְלִיַּעַל 应理解为普通名词，还是专名“彼列”
  choice: 正文译作普通名词“邪恶”
  alternative: “彼列的洪流”或“毁灭的洪流”
  rationale: 本节的诗歌平行结构描写威胁生命的洪水；该词在此可自然理解为邪恶、卑劣或毁灭性的力量。直接译成后期人格化的专名可能引入原文并未明确要求的魔鬼论含义，因此将专名读法保留在脚注中。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语；以“巨浪—洪流”保留原文两组猛烈水势的诗歌平行，并将两个动词译为“包围我—使我惊恐”，保持紧迫感和节奏。
