  text: 你赐给我你救恩的盾牌；你的温和[a]使我得尊荣。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“你的俯就”或“你的谦卑”。这里的希伯来语意义较难确定，可能指上帝施恩俯就，抬举说话的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּתֶּן לִי
  choice: 你把……赐给我
  rationale: 保留完成叙事动作和对上帝的直接称呼；“赐给”符合庄重语体，也自然表达 לִי 的间接受词作用。
- source_word: מָגֵן
  choice: 盾牌
  rationale: 保留具体的军事保护意象，不将其抽象化为“保护”。
- source_word: יִשְׁעֶךָ
  choice: 你的救恩
  rationale: 既表达上帝所施行的拯救，也保留原文所属结构及其神学内涵；“解救”亦属可能，但范围稍窄。
- source_word: וַעֲנֹתְךָ
  choice: 你的谦卑
  rationale: 此词形和词义均有困难。“谦卑”保留上帝俯就、扶助说话者这一令人意外的神学张力，而不在正文中把它解释性改写为“帮助”。其他可能含义列入脚注。
- source_word: תַּרְבֵּנִי
  choice: 使我尊大
  rationale: 使役形表达“使之为大、使之增大”。“使我尊大”在本段蒙拯救并被高举的语境中自然承接结果，同时避免误解为人数或数量上的增加。
theological_decisions:
- issue: 用于描述上帝的 וַעֲנֹתְךָ 应如何理解
  choice: 你的谦卑
  alternative: 你的温和；你的俯就；你的帮助
  rationale: 原文容许不止一种理解。正文采用“谦卑”，保留上帝甘愿俯就、使仆人尊大的张力；这不是暗示上帝有所欠缺。脚注列出其他译法并说明其可能意涵，避免把争议悄然消解。
translation_notes:
  register: 采用现代、庄重而可理解的普通话。“救恩的盾牌”保留原文鲜明意象；“谦卑”刻意保留原文的神学张力，并以脚注帮助普通读者理解。
