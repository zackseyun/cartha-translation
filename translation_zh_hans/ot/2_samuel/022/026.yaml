  yaml_path: translation/ot/2_samuel/022/026.yaml
  text: With the faithful you show yourself faithful; with the blameless warrior you show yourself blameless.
translation:
  language: zh_hans
  text: 对忠信的人，你显出忠信；对纯全的勇士，你显出纯全。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חָסִיד / תִּתְחַסָּד
  choice: 忠信的人 / 显出忠信
  rationale: 保留同根词的呼应，表达חסד所含的忠诚、信实和关系中的坚定，不把它缩窄为一般的“善良”或宗派化的“敬虔”。
- source_word: גִּבּוֹר
  choice: 勇士
  rationale: 该词可指强者、勇士或战士；在大卫的凯歌和争战语境中，“勇士”自然且保留其军事色彩。
- source_word: תָּמִים / תִּתַּמָּם
  choice: 纯全的 / 显出纯全
  rationale: תמים表示完整、无可指摘或纯全；译作“纯全”既保留道德含义，也避免把它绝对化为哲学意义上的完美，并重现原文同根复现。
theological_decisions:
- issue: 上帝回应人的品格这一对称表达
  choice: 保留“对……的人，你显出……”的对应结构
  alternative: 意译为“你以忠信/纯全待他”
  rationale: 原文使用反身或自我呈现意味较强的动词形式；“显出”保留上帝如何向不同的人彰显自己的神学张力，而不把它简单解释为行为报偿原则。
translation_notes:
  register: 采用庄重而通顺的现代普通话；以两组“……的人／显出……”和“忠信／纯全”的重复，尽量再现希伯来诗歌的平行与同根词效果。
