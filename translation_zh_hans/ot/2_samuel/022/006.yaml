base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/006.yaml
  text: The cords of Sheol surrounded me[b][a]; the snares of death confronted me.
translation:
  language: zh_hans
  text: 阴间的绳索围住我[a]；死亡的网罗迎面向我而来[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “阴间”或译“坟墓”或“死人之境”。
    reason: alternative_reading
  - marker: b
    text: 或译“遇上我”或“来到我面前”。
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶבְלֵי
  choice: 绳索
  rationale: 该词可指绳子、绳索；这里与下半句“网罗”构成困住人的诗歌意象。“绳索”自然清楚，也不把它解释为“痛苦”或“阵痛”。
- source_word: שְׁאוֹל
  choice: 阴间
  rationale: 该词指死人所在之境或死亡领域。“阴间”是现代中文中简洁且可理解的对应词；脚注同时保留“坟墓”和“死人之境”等可能含义，避免把原文范围限定得过窄。
- source_word: סַבֻּנִי
  choice: 围住我
  rationale: 动词意为围绕、环绕。“围住我”既直接表达被包围的状态，也与绳索造成的困境相符。
- source_word: קִדְּמֻנִי
  choice: 迎面向我而来
  rationale: 该动词在此可表示来到某人面前、迎上或与之相遇。此译保留“来到面前”的基本图像，并由上下文中的“死亡的网罗”自然传达威胁感，避免额外加入攻击动作。
- source_word: מֹקְשֵׁי
  choice: 网罗
  rationale: 该词指捕捉猎物的罗网或陷阱。“网罗”具有诗歌色彩，并与上句“绳索”形成恰当的平行。
- source_word: מָוֶת
  choice: 死亡
  rationale: 直接对应原文名词，并保留诗句中将死亡描绘为困住、拦截诗人的力量这一意象。
theological_decisions:
- issue: שְׁאוֹל 的译法
  choice: 阴间
  alternative: 坟墓；死人之境
  rationale: 原词所指可能涵盖坟墓、死亡状态或死人所在之境。“阴间”保留较宽的语义范围，脚注列出其他译法，以免武断限定其诗歌与神学含义。
- issue: קִדְּמֻנִי 所表达的相遇性质
  choice: 迎面向我而来
  alternative: 遇上我；来到我面前
  rationale: 上下文带有明显威胁，但该动词本身主要表达迎上、来到面前。正文保留这一基本意义，而不将其强化为“袭击”或“扑向”。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。两分句保持希伯来诗歌的平行结构：“阴间的绳索”对应“死亡的网罗”，“围住我”对应“迎面向我而来”。
