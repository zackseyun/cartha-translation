base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/015.yaml
  text: He sent arrows and scattered them; lightning[a], and threw them into confusion.
translation:
  language: zh_hans
  text: 他射出箭来，使他们四散；又发出闪电，使他们混乱。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这两个动词也可概括译作“击溃他们”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: 射出
  rationale: שלח基本义为“发出、差遣”；以“箭”为宾语时，现代汉语用“射出”最自然，同时保留诗歌中的武力意象。
- source_word: חִצִּים
  choice: 箭
  rationale: 准确保留原文具体的兵器意象，不作抽象化处理。
- source_word: וַיְפִיצֵם
  choice: 使他们四散
  rationale: 该使役形式表示“使分散、驱散”；“使他们四散”既体现使役语气，也适合敌军溃散的上下文。
- source_word: בָּרָק
  choice: 闪电
  rationale: בָּרָק指闪电或闪光；汉语“闪电”简洁自然，也保持原文紧凑的诗体。
- source_word: וַיְהֻמֵּם
  choice: 使他们混乱
  rationale: המם的使役义可指使人混乱、惊惶或溃败；正文采用较贴近词义且不过度限定军事结果的“使他们混乱”。
theological_decisions:
- issue: “使他们四散”和“使他们混乱”中代词所指
  choice: 理解为上文语境中的敌人，并以“他们”表达
  alternative: 不明说所指，仅让宾语由上下文补足
  rationale: 希伯来语两个动词均带第三人称阳性复数宾语后缀；神圣战士显现的上下文表明，所指最自然是大卫的敌人。译文保留代词，不额外把解释性名词“敌人”加入正文。
- issue: המם所描写的结果
  choice: 使他们混乱
  alternative: 击溃他们
  rationale: 该词兼有扰乱、使惊惶及击溃的语义范围；正文保留较宽的意义，脚注列出更偏军事结果的译法，避免消除原文张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。两小句保持希伯来诗歌的平行结构；以“又发出”补足闪电分句中省略而可由前文承接的动作，使汉语读来清楚流畅。
