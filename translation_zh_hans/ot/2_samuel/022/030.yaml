base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/030.yaml
  text: For by you I can run against a troop[c][b][a]; by my God I can leap over a wall.
translation:
  language: zh_hans
  text: '因为靠着你[a]，我能迎着一队敌军[b]冲去；

    靠着我的上帝，我能跃过城墙[c]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“和你一起”或“借着你”；希伯来语介词既可表示伴随，也可表示凭借。此处正文按凭借理解，即上帝使诗人能够行动。
    reason: lexical_alternative
  - marker: b
    text: 或译“一队劫掠者”。
    reason: lexical_alternative
  - marker: c
    text: 或译“壁垒”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，为前面的赞美和见证说明依据；在现代汉语中“因为”自然保留了解释性的连接作用。
- source_word: בְכָה
  choice: 靠着你
  rationale: 介词 בְּ 在此可表示凭借或方式，说明行动能力来自上帝；“靠着你”也保留了它可能表示伴随关系的余地。
- source_word: אָרוּץ
  choice: 我能冲向
  rationale: רוץ 的未完成式在诗歌语境中可表达蒙上帝赋予的能力；“冲向”既保留奔跑动作，也符合战斗场景。
- source_word: גְּדוּד
  choice: 一队敌军
  rationale: גְּדוּד 可指军队、武装队伍或劫掠队；结合战斗语境译为“一队敌军”，清楚而不把规模说得过于确定。
- source_word: בֵּאלֹהַי
  choice: 靠着我的上帝
  rationale: 重复前半句的凭借关系，并保留“我的上帝”所表达的个人信靠及诗行的平行结构。
- source_word: אֲדַלֶּג
  choice: 我能跃过
  rationale: דּלג 的加强词干表示跳跃、跃过；“能”与前半句相应，体现蒙上帝赋予的能力。
- source_word: שׁוּר
  choice: 城墙
  rationale: שׁוּר 指墙，语境带有军事防御色彩；“城墙”在汉语中自然呈现这种意象。
theological_decisions:
- issue: 军事意象中的上帝赋能
  choice: 以“我能……我能……”表达诗人靠上帝获得行动能力。
  alternative: 直译为“我冲向……我跃过……”，不明确表达能力。
  rationale: 两个希伯来语未完成式在此诗歌见证中自然可表达能力；这样的译法突出胜利源于上帝，同时不把本节扩展成更广泛的教义命题。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。两个诗句均以“靠着”开头，并以“我能”形成平行；“冲向”保留奔跑迎敌的动作，没有擅自强化为“击溃”或“冲破”。
