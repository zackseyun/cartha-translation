  source_fidelity: 译文准确呈现了两组“对／与……，你……”的对应平行，也正确将乖僻者理解为道德上偏曲、诡诈的人。但“你显出曲折”并非现代汉语中自然的谓语搭配；“曲折”通常指事情过程迂回，不能清楚传达罕见动词在此处可能含有的“以乖僻（或曲折）的方式相待／应对”之意。
  naturalness: “对纯洁的人，你显出纯洁”尚可理解，但“显为纯洁”更凝练自然。“对乖僻的人，你显出曲折”生硬且意义不明。以“你以乖僻相待”表达对应性的处理方式，既符合庄重的诗歌语体，也保留原文刻意尖锐的措辞。
  terminology: “纯洁”“乖僻”适合此处的道德和诗歌语境。“乖僻”重复用于末句，能较好保留原文中与前一分句相对应的词语回响，同时不把疑难动词过度释义为“机敏”。英文审校记录中正文的“twisted”与脚注所称正文选择“shrewd”彼此不一致；中文修订不依赖该不一致的说明，而以希伯来文本的歧义为准。
  issues:
