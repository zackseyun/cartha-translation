  yaml_path: translation/ot/2_samuel/022/027.yaml
  text: With the pure you show yourself pure[a], but with the crooked you show yourself twisted.
translation:
  language: zh_hans
  text: 对纯洁的人，你显为纯洁；对乖僻的人，你以乖僻相待。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “你以乖僻相待”也可译为“你以相反的方式对付他”或“你与他周旋”。这里的希伯来动词罕见，含义难定；诗句强调上帝对乖僻之人作出相应的回应。
    reason: lexical_alternative
lexical_decisions:
- source_word: נָבָר
  choice: 纯洁的人
  rationale: 该词表示纯净、清洁；译作“纯洁”自然庄重，并能与同根动词 תִּתָּבָר 的译法形成诗歌性重复。
- source_word: תִּתָּבָר
  choice: 你显出纯洁
  rationale: 该词是与 נָבָר 同根的反身形态，译文保留“显出”的反身意味及原文的同根呼应。
- source_word: עִקֵּשׁ
  choice: 乖僻的人
  rationale: 该词指品性扭曲、行事不正或诡诈的人；“乖僻”能表达道德层面的偏曲，也与“纯洁”构成鲜明对照。
- source_word: תִּתַּפָּל
  choice: 你显出曲折
  rationale: 这是罕见而疑难的动词，其具体语义存在争议。译作“显出曲折”保留它与“乖僻”的对应关系及原文尖锐的神学张力，不先行解释为“机敏”或“敌对”。
- source_word: עִם
  choice: 对
  rationale: 此处介词表示上帝针对不同之人的相应作为；现代汉语用“对……的人”比直译“与”更自然。
theological_decisions:
- issue: 如何表达上帝面对乖僻之人的相应作为，而不在译文中预先消解张力
  choice: 你显出曲折
  alternative: 你显出机敏／你以曲折相待／你与他相争
  rationale: 希伯来诗句有刻意的对应结构，罕见动词本身也语义不确定。正文采用较贴近字面的“曲折”，保留这种令人不安但真实存在的表达；脚注说明这可指上帝以相应、相反的方式对付乖僻之人，并不必然断言上帝在道德上乖僻。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言；保留两组“对……的人，你显出……”的平行结构，并以“纯洁／曲折”呈现原文的强烈对照。
