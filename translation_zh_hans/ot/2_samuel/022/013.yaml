  text: From the brightness before him[a], coals of fire blazed forth.
translation:
  language: zh_hans
  text: 从他面前的光辉中[a]，火炭燃烧起来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“从他面前的光芒中，火炭烧旺了。”
    reason: “光芒”是נֹגַהּ的可行替代译法；“烧旺了”保留בָּעֲרוּ的燃烧义。
lexical_decisions:
- source_word: מִנֹּגַהּ
  choice: 从……光辉中
  rationale: נֹגַהּ表示明亮、光辉或光芒；前缀מִן表示来源。译作“从……光辉中”既保留原文的来源意象，也符合现代汉语表达。
- source_word: נֶגְדּוֹ
  choice: 他面前的
  rationale: נֶגֶד加第三人称阳性单数词尾，表示“在他面前”或“在他前方”。“他面前的光辉”自然地保留空间含义，不扩译为“他的临在”。
- source_word: בָּעֲרוּ
  choice: 燃烧起来
  rationale: בער的Qal形式表示燃烧、烧旺。“燃烧起来”传达诗句中鲜明而动态的火焰景象，同时没有明说原文未明确表达的使役关系。
- source_word: גַּחֲלֵי אֵשׁ
  choice: 火炭
  rationale: 该组合直译为“火的炭块”，指燃烧的炭。“火炭”在中文中简洁凝练，保留原文的诗歌意象。
theological_decisions:
- issue: 神显意象与隐含的施事者
  choice: 把火炭描写为从他面前的光辉中燃烧起来，不另加神主动点燃火炭的表述。
  alternative: 译作“他面前的光辉点燃了火炭”。
  rationale: 希伯来文紧凑而富有诗意，并未明确使用使役结构。正文保留火焰与神圣显现之间的联系，却不把这种联系解释为明说的因果行动。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“光辉”“火炭”保留神显诗歌的凝练意象；“燃烧起来”比古雅的“着起来”更易为现代读者理解。
