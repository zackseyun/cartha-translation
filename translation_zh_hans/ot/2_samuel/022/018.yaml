base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/018.yaml
  text: He rescued me from my strong enemy, from those who hated me, for they were too mighty for me.
translation:
  language: zh_hans
  text: 他救我脱离强敌，脱离那些恨我的人，因为他们比我强大。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יַצִּילֵנִי
  choice: 他救我脱离
  rationale: 该使役动词表达从危险或敌手手中搭救；“救我脱离”自然传达其动作及后接 מִן 的分离含义。
- source_word: מֵאֹיְבִי עָז
  choice: 脱离强敌
  rationale: עָז 在此修饰单数“我的敌人”，表示强大、有力量；“强敌”简洁而准确，不额外限定敌人的身份。
- source_word: מִשֹּׂנְאַי
  choice: 脱离那些恨我的人
  rationale: 分词复数带第一人称后缀，指持续敌视诗人的人；译为关系短语较符合现代汉语。
- source_word: כִּי אָמְצוּ מִמֶּנִּי
  choice: 因为他们比我强盛
  rationale: אָמְצוּ 表示强壮、强大，מִמֶּנִּי 构成比较；“比我强盛”保留力量悬殊之意。
theological_decisions:
- issue: 单数“强敌”与复数“恨我的人”的关系
  choice: 保留原文由单数转为复数的表达
  alternative: 统一译为复数“强敌们”或把后半句解释为同一群人
  rationale: 原文先用单数 אֹיְבִי，随后用复数 שֹׂנְאַי 和 אָמְצוּ；不应擅自消除这一数的变化或限定具体所指。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“强敌”精炼有力；“比我强盛”略带诗歌语感，同时普通读者容易理解。
