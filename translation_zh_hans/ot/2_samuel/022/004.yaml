base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/004.yaml
  text: I call on Yahweh[a], who is worthy of praise, and I am saved from my enemies.
translation:
  language: zh_hans
  text: 我求告当受赞美[a]的雅威，就得以脱离我的仇敌。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“受赞美的”。希伯来文是被动分词，可描述雅威是受人赞美的，也可表达他是当受赞美的。
    reason: lexical_alternative
lexical_decisions:
- source_word: מְהֻלָּל
  choice: 当受赞美
  rationale: 这是 הלל 的被动分词，在此修饰或述说雅威；“当受赞美”既保留被动意味，也自然表达他配得赞美。
- source_word: אֶקְרָא
  choice: 我求告
  rationale: קרא 与神名连用时通常指向神呼求、祈求；“求告”比单纯的“呼叫”更准确地传达祷告语境。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，保留其专名性质，不用称号替代。
- source_word: וּמֵאֹיְבַי
  choice: 就得以脱离我的仇敌
  rationale: 介词 מִן 表示获救所脱离的对象；汉语以“脱离我的仇敌”自然表达，且不增添原文没有的“手中”。连接词 וּ 在此按前后行动与结果的关系译作“就”。
- source_word: אִוָּשֵׁעַ
  choice: 得以……得救／脱离
  rationale: ישׁע 的尼法勒未完成式表示蒙拯救。结合诗歌中的概括性陈述，以“得以脱离”表达求告之后蒙救的结果，同时避免武断限定为一次性的过去或未来事件。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；译作“雅威”保留专名，并较贴近通常重构的读音。
- issue: אִוָּשֵׁעַ 的时态与体
  choice: 就得以脱离
  alternative: 我必得救
  rationale: 未完成式在本诗句中可以表达反复、概括或预期的结果；中文不明定过去或未来，以保留原文在习惯性陈述与信心宣告之间的张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“求告”保留敬虔祈求的语感；“当受赞美”略带诗体色彩，但普通读者容易理解。
