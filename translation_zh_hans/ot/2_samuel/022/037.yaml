  text: You widen my steps beneath me[b][a], and my ankles have not given way.
translation:
  language: zh_hans
  text: 你使我脚下有宽阔之地[a]，我的脚踝没有滑跌[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译是“你使我下面的脚步宽阔”。这是一个诗歌性说法，指上帝赐人宽广、稳妥的立足之处。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“没有失稳”、“没有打滑”或“没有摇晃”。
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּרְחִיב
  choice: 你使……宽阔
  rationale: 这是רחב的使役形，表示“使宽阔、使宽广”；保留上帝赐下宽广行动空间的意象。
- source_word: צַעֲדַי
  choice: 我的步伐
  rationale: צעד指“脚步、步伐”。直译能保留诗歌的身体与行走意象；其习语含义由脚注说明。
- source_word: תַּחְתֵּנִי
  choice: 我脚下的
  rationale: 该词意为“在我下面”；在现代汉语中用“我脚下的”自然地表达空间关系。
- source_word: וְלֹא
  choice: 也没有
  rationale: 保留并列连词与否定；汉语中的“也”使两分句衔接自然，不强化为目的或结果关系。
- source_word: מָעֲדוּ
  choice: 失稳
  rationale: מעד可指滑倒、摇晃或失足。与“脚踝”搭配时，“失稳”自然表达没有支撑不住，同时不把意义限缩为单纯“打滑”。
- source_word: קַרְסֻלָּי
  choice: 我的脚踝
  rationale: 该名词具体指脚踝或踝部，译为“脚踝”比泛译“脚”更准确，并保留身体意象。
