base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/009.yaml
  text: Smoke went up from his nostrils[a], and consuming fire from his mouth; coals blazed from him.
translation:
  language: zh_hans
  text: 烟从他的鼻孔中升起[a]；从他口中发出吞噬的火；炭火从他那里烧起来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “鼻孔”也可译作“鼻”；这个希伯来词也常按惯用义指“怒气”。
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלָה עָשָׁן
  choice: 烟……升起
  rationale: עָלָה表示向上升腾；“烟……升起”自然、具体，并保留诗歌意象。
- source_word: בְּאַפּוֹ
  choice: 从他的鼻孔中
  rationale: אַף既可指“鼻、鼻孔”，也可转指“怒气”。本节与“从他口中”构成身体意象上的平行，因此正文保留具体的“鼻孔”，并以脚注说明双关或惯用义。介词按烟向外升腾的语境译作“从……中”。
- source_word: וְאֵשׁ מִפִּיו
  choice: 烈火从他口中
  rationale: 直接保留“火”及“从他口中”的拟人化神显意象；“烈火”符合现代汉语诗体表达，并为后面的吞噬动作提供自然主语。
- source_word: תֹּאכֵל
  choice: 吞噬
  rationale: 该动词为未完成式，字面是“吃、吞吃”，主语为“火”。译作“吞噬”保留火主动毁灭的形象，也不把时体过度限定为单纯过去。
- source_word: גֶּחָלִים
  choice: 炭火
  rationale: 指燃烧或灼热的煤炭。“炭火”比单说“炭”更自然，也与随后的燃烧动词相配。
- source_word: בָּעֲרוּ
  choice: 燃烧起来
  rationale: 该词可表示燃烧或被点燃；“燃烧起来”保留起燃、炽燃的动态感，同时不强行判定为被动。
- source_word: מִמֶּנּוּ
  choice: 从他那里
  rationale: מן表示来源；“从他那里”保留火炭由神发出的神显图景，并避免增添原文未明说的具体方式。
theological_decisions:
- issue: 神显中的拟人化身体语言
  choice: 正文保留“鼻孔”“口”以及烟火从他发出的具体意象。
  alternative: 把“鼻”直接解释为“怒气”，将全句抽象化为神发怒。
  rationale: 希伯来诗歌以拟人化神显描绘上帝的震怒和威能；具体译出可保存与“口”的平行及原文的神学张力，而脚注提示“怒气”的惯用含义。
- issue: תֹּאכֵל的时体与句法功能
  choice: 译作现在感或描写性的“吞噬”，不补明宾语。
  alternative: 译作明确过去时“吞噬了”，或形容化为“吞噬人的烈火”。
  rationale: 未完成式在诗歌叙述中可有多种时体效果，原文也未列出吞噬对象；简洁的“吞噬”保留这种开放性。
translation_notes:
  register: 采用现代、庄重而具诗意的普通话。保留三个分句的推进和神显中的强烈身体意象；不用古奥词汇，也不将“鼻孔”所含的怒气意味直接替换进正文。
