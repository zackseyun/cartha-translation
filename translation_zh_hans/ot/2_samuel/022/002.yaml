  text: 'And he said: “The LORD is my rock and my fortress and my deliverer for me.”'
translation:
  language: zh_hans
  text: 他说：“耶和华是我的磐石、我的堡垒，也是拯救我的那一位。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名译出神圣四字名，区别于普通称谓“主”。
- source_word: סַלְעִי
  choice: 我的磐石
  rationale: 保留岩石作为稳固、庇护象征的诗歌意象。
- source_word: מְצֻדָתִי
  choice: 我的山寨
  rationale: 指设在险要高处的坚固据点；“山寨”在圣经诗歌语境中凝练而庄重。
- source_word: מְפַלְטִי לִי
  choice: 是我的救主
  rationale: מְפַלְטִי 是使人脱险、搭救者；句末 לִי 强调其对说话者的切身关系，中文“我的”已自然承载这一意义，避免生硬重复“为我的救主”。
theological_decisions:
- issue: 句末 לִי 是否另译为“为我”
  choice: 融入“我的救主”
  alternative: “是为我施行拯救的那一位”
  rationale: 希伯来文的所属后缀与 לִי 形成强调，但逐词重复在现代汉语中不自然；此处不额外扩展其神学含义。
translation_notes:
  register: 采用简洁、庄重的现代标准汉语，并保留希伯来诗歌中连续三个第一人称比喻或称谓。
