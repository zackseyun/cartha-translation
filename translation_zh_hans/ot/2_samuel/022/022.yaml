  text: כִּ֥י שָׁמַ֖רְתִּי דַּרְכֵ֣י יְהוָ֑ה וְ/לֹ֥א רָשַׁ֖עְתִּי מֵ/אֱלֹהָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/022.yaml
  text: For I have kept the ways of Yahweh[a], and have not wickedly departed from my God.
translation:
  language: zh_hans
  text: 因为我谨守了雅威的道路，也没有作恶背离我的上帝。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “作恶背离我的上帝”也可译作“得罪我的上帝”。
    reason: 原文介词 מִן 在此既可按其通常的分离含义理解，也可能表达行为所针对的对象。
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 引出对上文的解释或理由；“因为”自然体现其因果、说明作用。
- source_word: שָׁמַרְתִּי
  choice: 我谨守了
  rationale: שׁמר 在此指遵守、持守；“谨守”既传达持续忠实遵行的意味，也符合庄重诗歌语体。
- source_word: דַּרְכֵי
  choice: 道路
  rationale: דֶּרֶךְ 的复数在此比喻行为准则或生活方式；中文“道路”保留原文意象，同时可自然理解为上帝所规定的行事方式。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常用音译呈现四字神名，保留其作为以色列上帝专名的性质，而不以称号代替。
- source_word: וְלֹא
  choice: 也没有
  rationale: 连接并否定第二分句；“也”使两个平行陈述在现代汉语中衔接自然。
- source_word: רָשַׁעְתִּי
  choice: 作恶
  rationale: 该动词表示行恶或行事邪恶；“作恶”简洁保留其明确的道德含义。
- source_word: מֵאֱלֹהָי
  choice: 背离我的上帝
  rationale: מִן 的基本意义是“从、离开”；与 רָשַׁעְתִּי 连用时，“作恶背离”兼顾邪恶行为与离开上帝的关系性含义。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文使用四字神名而非称号；“雅威”较贴近学界通常重构的读音，并明确保留专名性质。
- issue: רָשַׁעְתִּי מֵאֱלֹהָי 的关系
  choice: 作恶背离我的上帝
  alternative: 得罪我的上帝
  rationale: 原文既有“作恶”的动词，也有通常表示分离来源的介词 מִן。正文保留道德与离弃两个层面，不把介词关系完全解释为“针对、得罪”；脚注列出另一种可能理解。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“谨守”“道路”保留诗歌和盟约语境的传统表达；第二分句避免加入原文没有明说的因果连接，以保留希伯来语结构的凝练与一定歧义。
