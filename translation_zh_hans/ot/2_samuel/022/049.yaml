base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/049.yaml
  text: who brings me out from my enemies[a]; you exalt me above those who rise against me[b]; you deliver me from the violent man.
translation:
  language: zh_hans
  text: 你使我脱离仇敌[a]；你使我高过那些起来攻击我的人；你救我脱离残暴之人[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文为“使我脱离仇敌的那一位”的分词短语，前有连词承接上文；也可译为“又使我脱离仇敌”。
    reason: syntax_alternative
  - marker: b
    text: 或译：“施行暴力的人。”原文“人”为单数，“暴力”采用表示性质的复数形式。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמוֹצִיאִי
  choice: 又是那使我脱离……的
  rationale: 该词是使役词干分词，带第一人称单数宾语后缀，直译为“使我出来的那一位”。结合上文连续描述神的句法，用“又是那使我脱离……的”保留承接关系及具体的脱离意象。
- source_word: מֵאֹיְבָי
  choice: 脱离仇敌
  rationale: 介词 מִן 与“我的仇敌”连用，表示从仇敌手中或势力范围中脱离；现代汉语以“脱离仇敌”简洁表达。
- source_word: וּמִקָּמַי
  choice: 那些起来攻击我的人
  rationale: 保留 קום“起来”的动态意象，并按语境明确其敌对含义，而不简化为泛称“敌人”。
- source_word: תְּרוֹמְמֵנִי
  choice: 你使我高过
  rationale: רום 的使役或强化形式表达被抬高；与 מִן 连用时含高过对手之意。“使我高过”同时保留垂直意象和得胜意味。
- source_word: מֵאִישׁ חֲמָסִים
  choice: 脱离残暴之人
  rationale: איש 为单数，חמסים 是表示暴力或残暴性质的复数形式。“残暴之人”自然、庄重，并保留单数人物的表达。
- source_word: תַּצִּילֵנִי
  choice: 你救我脱离
  rationale: נצל 的使役形式意为搭救、救出；“救我脱离”符合诗歌语体，也清楚表达从危险人物手中获救。
theological_decisions:
- issue: 本节开头由第三人称式的称述转为第二人称直接呼告
  choice: 保留“那使我……的”与随后“你……”之间的人称转换
  alternative: 全节统一译为“你使我……”
  rationale: 希伯来文本开头为名词化分词，随后使用第二人称动词。保留这种转换可反映诗歌原有句法和呼告张力，避免为流畅而抹平。
translation_notes:
  register: 采用现代、庄重的诗歌语言；保留“起来攻击”和“高过”的动态及垂直意象，也保留原文由称述神转为直接向神说话的人称变化。
