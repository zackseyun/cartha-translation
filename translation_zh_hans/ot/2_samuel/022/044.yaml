  text: וַֽ/תְּפַלְּטֵ֔/נִי מֵ/רִיבֵ֖י עַמִּ֑/י תִּשְׁמְרֵ֨/נִי֙ לְ/רֹ֣אשׁ גּוֹיִ֔ם עַ֥ם לֹא יָדַ֖עְתִּי יַעַבְדֻֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/044.yaml
  text: You delivered me from the strivings of my people[a]; you kept me as the head of nations[c][b]; a people I had not known served me.
translation:
  language: zh_hans
  text: 你救我脱离我百姓的纷争[a]；你保守我作列国之首[b]；我原不认识的民服侍我[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“我百姓的争斗”。希伯来语既可指大卫自己百姓内部的纷争，也可指涉及他们的冲突。
    reason: lexical_alternative
  - marker: b
    text: 或译“你保全我，使我居列国之首”。
    reason: lexical_alternative
  - marker: c
    text: 或译“我不认识的民必服侍我”。希伯来语未完成式在诗歌中可带有将来的意味。
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: וַתְּפַלְּטֵנִי
  choice: 你救我脱离
  rationale: 使役形动词פלט表达使人逃脱、蒙解救；“救我脱离”自然地传达上帝施行拯救以及其后介词מִן所指的脱离对象。
- source_word: מֵרִיבֵי עַמִּי
  choice: 我百姓的纷争
  rationale: רִיב可指争斗、争端或纷争；复数构造形式与“我百姓”相连，所表达的领属关系可能涵盖百姓内部的争斗，也可能指涉及百姓的冲突，因此正文保留宽泛说法。
- source_word: תִּשְׁמְרֵנִי
  choice: 你保守我
  rationale: שׁמר的基本义包括看守、保守、保全；此处强调上帝维持并保存君王所处的统治地位，“保守”既简洁又保留原文语义。
- source_word: לְרֹאשׁ גּוֹיִם
  choice: 作列国之首
  rationale: רֹאשׁ在此比喻首领或居首者，לְ表示身份或结果；“作列国之首”保留“头/首”的意象，也符合庄重的现代汉语表达。
- source_word: גּוֹיִם
  choice: 列国
  rationale: 此王权语境中的גּוֹיִם指以色列以外的众国或众民族；“列国”准确、简洁，也避免引入后期“外邦人”一词可能带有的宗教分类意味。
- source_word: עַם לֹא יָדַעְתִּי
  choice: 我原不认识的民
  rationale: 单数集合名词עַם译为“民”；完成式יָדַעְתִּי表示此前的认识或交往，“原不认识”自然体现先前并无往来，而不暗示永远不认识。
- source_word: יַעַבְדֻנִי
  choice: 服侍我
  rationale: עבד在王权语境中可指效力、臣服或服役；“服侍我”保留原词的宽度，不把政治臣属关系过度解释为某一种具体制度。
theological_decisions:
- issue: 君王统治外国民族的语言
  choice: 正文保留大卫之歌当下的历史与王权含义，不直接加入弥赛亚解释。
  alternative: 在正文中明确译成对弥赛亚统治的直接预言。
  rationale: 本节直接语境是大卫回顾上帝的拯救和所赐王权；更广的正典脉络可能赋予其预表或弥赛亚意义，但翻译应首先呈现希伯来文本在本段中的直接意义。
- issue: יַעַבְדֻנִי的时态语气
  choice: 正文按回顾性诗歌语境译为“服侍我”。
  alternative: 译为“必服侍我”或“将服侍我”，突出未完成式可能具有的将来意味。
  rationale: 希伯来诗歌中的未完成式可以表示持续、结果或将来的动作；上下文整体回顾上帝已经成就的拯救，因此正文采用回顾性表达，同时以脚注保存将来读法。
translation_notes:
  register: 采用现代、庄重且易懂的诗歌体汉语；以“列国之首”保留原文王权隐喻，以“民”呈现单数集合名词。分号对应三个紧密相连的诗句，不额外加入解释性称谓。
