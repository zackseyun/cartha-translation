  text: יְקַדְּמֻ֖/נִי בְּ/י֣וֹם אֵידִ֑/י וַ/יְהִ֧י יְהוָ֛ה מִשְׁעָ֖ן לִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/019.yaml
  text: They confronted me in the day of my calamity[b][a], but Yahweh was my support.
translation:
  language: zh_hans
  text: 我遭难的日子，他们迎面攻击我[a]；但雅威是我的倚靠。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们迎上我”，或“他们遇见我”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְקַדְּמֻנִי
  choice: 他们迎面攻击我
  rationale: קדמ 的皮埃勒式带第一人称单数宾语，在敌对语境中表示迎上、截住或对抗。“迎面攻击”既保留其“迎上来”的空间意象，也清楚传达敌意。
- source_word: בְּיוֹם אֵידִי
  choice: 我遭难的日子
  rationale: אֵיד 指灾祸、毁灭性不幸；用“遭难”构成自然庄重的现代汉语，同时不把含义限缩为主观忧苦。
- source_word: וַיְהִי
  choice: 但……是
  rationale: וַ 在形式上承接叙事，语境中却形成敌人攻击与雅威扶持之间的转折，因此译作“但”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来辅音神名 YHWH 的通行拟音译作“雅威”，保留经文中的专名，不以称号替代。
- source_word: מִשְׁעָן לִי
  choice: 我的倚靠
  rationale: מִשְׁעָן 本指可供倚靠、支撑之物，此处为比喻；“我的倚靠”在中文中自然，并保留依靠与支撑的意象。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。译作“雅威”较直接地呈现专名；不以“上主”这一称号替代，也不采用传统但较偏离现今主流拟音的“耶和华”。
- issue: 敌人行动的力度
  choice: 迎面攻击我
  alternative: 迎上我；遇见我
  rationale: 词本身可表示迎上或遇见，但上下文主语是敌对者，带有明显敌意；译文表达这种敌对力度，脚注保留较中性的词义可能。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌散文体。“遭难的日子”保留希伯来时间表达的凝练感；“倚靠”比抽象的“支持”更能传达 מִשְׁעָן 的支撑意象。
