base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/003.yaml
  text: my God[a], my rock, in whom I take refuge, my shield and the horn of my salvation, my stronghold and my refuge[c][b], my savior—you save me from violence.
translation:
  language: zh_hans
  text: 我的上帝[c]，我的磐石，我投靠他；他是我的盾牌，我救恩的角[a]，我的高垒和避难所，我的救主[b]；你救我脱离暴力。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “角”在希伯来诗歌中象征力量和得胜的能力。
    reason: cultural_note
  - marker: b
    text: “我的救主”也可译作“拯救我的那一位”。
    reason: lexical_alternative
  - marker: c
    text: 或译“我磐石的上帝”。希伯来语的连属结构也可按诗歌中的同位称号理解为“我的上帝，我的磐石”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהֵי צוּרִי
  choice: 我的上帝，我的磐石
  rationale: 希伯来语可按连属结构直译为“我磐石的上帝”，也可在诗歌称号的并列语境中理解为同位表达。正文采用自然且符合称号串列的“我的上帝，我的磐石”，同时以脚注保留较直译的可能。
- source_word: אֶחֱסֶה בּוֹ
  choice: 我投靠他
  rationale: חסה 表示寻求庇护、投奔避难；“投靠他”简洁自然，并保留 בוֹ 的人称指向。
- source_word: מָגִנִּי
  choice: 我的盾牌
  rationale: 保留表示保护的具体军事意象。
- source_word: קֶרֶן יִשְׁעִי
  choice: 拯救我的角
  rationale: 保留 קֶרֶן“角”的希伯来诗歌意象；该短语表达带来拯救的力量。“拯救我的角”比“我救恩的角”更符合现代汉语，同时不将意象抽象化。
- source_word: מִשְׂגַּבִּי
  choice: 我的高垒
  rationale: מִשְׂגָּב 指高处的安全堡垒；“高垒”兼顾其高耸与防御含义。
- source_word: וּמְנוּסִי
  choice: 我的避难所
  rationale: 该名词与逃往安全之处有关；“避难所”准确而易懂。
- source_word: מֹשִׁעִי
  choice: 我的救主
  rationale: 源自 ישׁע 的施事形式，指施行拯救者；“救主”直接保留其名词性称号，脚注注明“拯救我的那一位”这一较少神学术语色彩的译法。
- source_word: מֵחָמָס
  choice: 脱离暴力
  rationale: חָמָס 表示暴力或暴行；保留抽象名词，不擅自补出施暴者。
- source_word: תֹּשִׁיעֵנִי
  choice: 你救我
  rationale: 第二人称阳性单数未完成式加第一人称单数宾语。采用“你救我”保留直接呼告，也不把希伯来语体貌过度限定为单次过去或单纯将来。
theological_decisions:
- issue: 诗歌中连续使用的神圣称号和具体意象
  choice: 保留“磐石、盾牌、角、高垒、避难所”等具体比喻
  alternative: 解释性译为“保护者、力量来源”等抽象说法
  rationale: 原文通过层叠的防御、力量和拯救意象描绘上帝；保留意象可维持诗歌力度和神学纹理，避免以解释取代翻译。
- issue: מֹשִׁעִי 的称号
  choice: 我的救主
  alternative: 拯救我的那一位
  rationale: “救主”忠实反映施救者这一名词称号；正文并未借此加入后期教义限定，脚注则保留普通描述性表达。
- issue: אֱלֹהֵי צוּרִי 的句法关系
  choice: 按诗歌同位关系译为“我的上帝，我的磐石”
  alternative: 我磐石的上帝
  rationale: 连属形式容许较直译的理解，但上下文是一连串对上帝的称号；同位译法在现代汉语中更自然，同时用脚注明示句法歧义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语，保持希伯来诗歌称号的层叠节奏。分号将第三人称称号串与末尾第二人称直接呼告区分开来。所有脚注标记均置于相应正文词语之后。
