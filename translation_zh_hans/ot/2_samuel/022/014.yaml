  text: יַרְעֵ֥ם מִן שָׁמַ֖יִם יְהוָ֑ה וְ/עֶלְי֖וֹן יִתֵּ֥ן קוֹלֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/014.yaml
  text: Yahweh thundered from heaven[a], and the Most High gave his voice.
translation:
  language: zh_hans
  text: 雅威从天上打雷；至高者发出他的声音[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“至高者扬声说话。”希伯来文直译为“至高者给出他的声音”，这是与“打雷”平行的诗性表达。
    reason: 说明希伯来习语的字面形式及可选译法。
lexical_decisions:
- source_word: יַרְעֵם
  choice: 打雷
  rationale: 该词是 רעם 的使役式，在风暴显现的语境中表示发出雷声。“打雷”是现代汉语自然、明确的表达，并保留气象意象。
- source_word: מִן שָׁמַיִם
  choice: 从天上
  rationale: שָׁמַיִם 可指天空或天界；这里以雅威为主语，“从天上”兼顾空间含义与神显语境，也符合现代汉语习惯。
- source_word: יְהוָה
  choice: 雅威
  rationale: 采用希伯来神名的常见现代汉语音译，而不以称号替代专名。
- source_word: וְעֶלְיוֹן
  choice: 至高者
  rationale: עֶלְיוֹן 在此作神的称号，与雅威形成诗歌平行；“至高者”保留其最高、超越万有的含义。
- source_word: יִתֵּן קוֹלוֹ
  choice: 发出他的声音
  rationale: 原文直译为“给出他的声音”。“发出他的声音”在现代汉语中自然，同时保留原文的诗性表达及其与“打雷”的平行关系。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；以“上主”替代
  rationale: 原文直接使用四字神名。音译“雅威”使专名属性清楚，避免将其改成称号。
- issue: 雅威与“至高者”的关系
  choice: 按希伯来诗歌的平行结构，将二者保留为同一位神的专名与称号
  alternative: 将“至高者”处理为另一个独立主体
  rationale: 两分句在结构和意义上彼此对应，但译文不增加原文没有明说的解释，只保留专名与称号的并列。
- issue: 神的“声音”与雷声的关系
  choice: 保留两种表达的诗歌平行，不直接把“声音”改译为“雷声”
  alternative: 将下半句译作“至高者雷声隆隆”
  rationale: 上下句强烈暗示神的声音体现为雷声，但原文仍使用“他的声音”，保留这一措辞可避免消除诗意与可能的语义张力。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“打雷”简明自然；“发出他的声音”略带诗意，以反映原文平行结构。分号突出两个对应分句。
