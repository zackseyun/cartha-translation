base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/002.yaml
  text: So every man of Israel went up from following David to follow Sheba son of Bichri[a], but the men of Judah held fast to their king[b], from the Jordan to Jerusalem.
translation:
  language: zh_hans
  text: 于是，以色列众人都离开大卫，上去跟随比基利的儿子示巴[a]；但犹大人却紧紧依附他们的王，从约旦河直到耶路撒冷。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“以色列的每一个男子”，是阳性单数的集合表达。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: 离开
  rationale: עלה本义为“上去”，但此处与“跟随”连用，叙述以色列人不再追随大卫、转而追随示巴；现代汉语译作“离开”较自然，同时不把动作过度解释为正式背叛。
- source_word: כָּל אִישׁ יִשְׂרָאֵל
  choice: 以色列众人
  rationale: 原文直译为“以色列的每一个男子”，在此是阳性集合表达；“以色列众人”自然表达群体总称，并可由脚注保留其字面形式。
- source_word: מֵאַחֲרֵי דָוִד ... אַחֲרֵי שֶׁבַע
  choice: 离开大卫，转去跟随……示巴
  rationale: 重复的אַחֲרֵי形成鲜明对照，表示停止跟随大卫而改随示巴；“转去”显明归属的转移，但不额外界定其政治或神学性质。
- source_word: שֶׁבַע בֶּן בִּכְרִי
  choice: 比基利的儿子示巴
  rationale: 按现代汉语自然语序表达父子关系，并采用常见圣经人名译法。
- source_word: וְאִישׁ יְהוּדָה
  choice: 但犹大人
  rationale: 名词虽为单数形式，实际作集合称谓；上下两句形成对比，故连接词译为“但”。
- source_word: דָּבְקוּ בְמַלְכָּם
  choice: 紧紧跟随他们的王
  rationale: דבק本有“黏住、紧附”之意，在此表达坚定依附和忠诚；“紧紧跟随”既保留具体意象，也与前句的“跟随”形成呼应。
- source_word: מִן הַיַּרְדֵּן וְעַד יְרוּשָׁלָם
  choice: 从约旦河一直到耶路撒冷
  rationale: מִן...וְעַד标示起点与终点；“一直到”自然呈现这段行程或持续范围，而不增加原文未说明的细节。
theological_decisions:
- issue: 以色列人从大卫转而跟随示巴的性质
  choice: 用“离开……转去跟随”呈现归属转移
  alternative: 译为“背叛大卫、投奔示巴”
  rationale: 原文通过前后两个“跟随”表达转移，却没有在本节直接使用“背叛”或“投奔”等评价性词语，因此保留叙事本身的张力。
- issue: 犹大人与王的关系
  choice: 译为“紧紧跟随他们的王”
  alternative: 译为“仍然忠于他们的王”
  rationale: 后者直接抽象为政治忠诚；所选译法保留דבק的具体意象，同时让忠诚含义由语境显出。
translation_notes:
  register: 采用庄重而流畅的现代标准汉语。“以色列众人”与“犹大人”构成清楚对照；两个分句分别用“转去跟随”和“紧紧跟随”，保留原文关于归属转移与坚定依附的呼应。
