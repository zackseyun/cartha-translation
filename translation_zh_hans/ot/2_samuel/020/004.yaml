  text: Then the king said to Amasa[a], “Call the men of Judah together for me within three days, and you, remain here.”
translation:
  language: zh_hans
  text: 于是，王对亚玛撒说：“你要在三天之内为我召集犹大人[a]，你自己要留在这里。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “犹大人”的希伯来语原文采用阳性集合表达。结合上下文，所指很可能是犹大中可被征召作战的男子，但原文本身没有明确说“战士”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 于是……说
  rationale: 连续式叙事动词推进事件；“于是”自然表达先后承接。
- source_word: הַמֶּלֶךְ
  choice: 王
  rationale: 按定冠词名词直译，语境中所指为大卫，无须以专名替换。
- source_word: הַזְעֶק
  choice: 召集
  rationale: זעק 的使役命令式在此表示发出号召、召集人员；“召集”简洁地保留使役和聚集之意。
- source_word: לִי
  choice: 为我
  rationale: 此处介词表示奉王之命、替王办理，译作“为我”自然准确。
- source_word: אֶת אִישׁ יְהוּדָה
  choice: 犹大人
  rationale: אִישׁ 虽为单数形式，此处作集合用语。“犹大人”保留集合含义，又不把语义过度限定为“战士”。
- source_word: שְׁלֹשֶׁת יָמִים
  choice: 在三天之内
  rationale: 命令语境表明这是完成召集的期限，并非持续三天。
- source_word: וְאַתָּה
  choice: 你自己也
  rationale: 独立人称代词带有强调；“你自己也”既体现强调，也保留连接关系，不额外强化为转折。
- source_word: פֹּה עֲמֹד
  choice: 留在这里
  rationale: עֲמֹד 字面为“站立”，在此命令语境中指留在原处等候；“留在这里”符合现代汉语。
