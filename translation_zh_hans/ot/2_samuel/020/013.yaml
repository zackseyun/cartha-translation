base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/013.yaml
  text: As soon as he had been removed from the highway[a], every man passed on after Joab to pursue Sheba son of Bichri.
translation:
  language: zh_hans
  text: 他一被从大道上挪开[a]，众人就跟随约押继续前行，去追赶比基利的儿子示巴。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “大道”也可译作“大路”或“主要道路”。希伯来语 מְסִלָּה 可指大道或主要道路。
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: 一……就……
  rationale: 引出时间从句，并自然表达叙事中障碍清除后众人立即继续行动的紧接关系；同时不过度强化为绝对瞬时。
- source_word: הֹגָה
  choice: 他……被挪开
  rationale: 保留使役被动式的语态；“他”依上文指亚玛撒，也就是他的尸体，正文不额外补入“尸体”，以免超出本节明说的内容。
- source_word: מִן הַמְסִלָּה
  choice: 从大道上
  rationale: מְסִלָּה可指修筑或抬高的道路、干道；“大道”保留其较有标记的含义，也符合军队行进的场景。
- source_word: עָבַר
  choice: 继续前行
  rationale: 在此表示障碍移除后队伍向前通过并恢复行进；“继续前行”比单纯“经过”更清楚地传达上下文中的动作。
- source_word: כָּל אִישׁ
  choice: 众人
  rationale: 希伯来语为单数分配性表达，指跟随约押的全体军士；现代汉语用“众人”自然概括该集合，同时不误解为泛指所有人。
- source_word: אַחֲרֵי יוֹאָב
  choice: 跟随约押
  rationale: אַחֲרֵי在此表示随在领军者之后；译作“跟随”比字面“在……后面”更符合现代汉语军事叙事。
- source_word: לִרְדֹּף אַחֲרֵי
  choice: 去追赶
  rationale: 不定式表达目的；“追赶”自然传达军事追击行动。
- source_word: שֶׁבַע בֶּן בִּכְרִי
  choice: 比基利的儿子示巴
  rationale: 按现代汉语姓名与父称结构表达，清楚保留人物的父子关系。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“一……就……”使时间关系流畅；“他”承接上文的亚玛撒，保留原文省略尸体名词的表达。脚注标记已在正文对应位置出现。
