  yaml_path: translation/ot/2_samuel/020/020.yaml
  text: Joab answered and said[a], “Far be it from me, far be it, if I should swallow up or destroy!”
translation:
  language: zh_hans
  text: 约押回答说：“我绝不会这样做，绝不会！我绝不吞灭或毁坏！[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文两个动词的宾语没有明说，需按上下文理解。“吞灭”直译为“吞下”，是鲜明的形象说法；也可译为“吞并”或“吞噬”。
    reason: 说明原文省略的宾语，并保留“吞灭”的字面意象及可行译法。
lexical_decisions:
- source_word: וַיַּעַן יוֹאָב וַיֹּאמַר
  choice: 约押回答说
  rationale: 保留希伯来叙事中“回答—说”的言语引介结构，同时采用自然的现代汉语表达。
- source_word: חָלִילָה חָלִילָה לִי
  choice: 我绝无此意，绝无此意
  rationale: 该感叹语重复两次，强烈否认所说的意图；重复译出以保留原文的强调，避免较古雅的“断乎不可”。
- source_word: אִם
  choice: 绝不会
  rationale: 在חָלִילָה之后引出被强烈否定的可能；汉语用“绝不会”自然表达这种否定语力，而非机械译作“如果”。
- source_word: אֲבַלֵּעַ
  choice: 吞灭
  rationale: 保留בלע“吞下、吞噬”的鲜明意象，并以“灭”提示围城语境中消灭、吞并的含义。
- source_word: וְאִם אַשְׁחִית
  choice: 或毁坏
  rationale: שׁחת的使役式表示毁坏、使之败亡；“或”自然连接两项被否认的行动。
- source_word: יוֹאָב
  choice: 约押
  rationale: 采用现代中文圣经人名的通行译名。
