  yaml_path: translation/ot/2_samuel/020/005.yaml
  text: So Amasa went to summon Judah[a], but he delayed beyond the appointed time that he had set for him.
translation:
  language: zh_hans
  text: 亚玛撒就去召集犹大人[a]，却耽搁了，超过了王为他定下的时间。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“动员犹大人”。原文动词表示紧急召聚；在本段语境中很可能包括军事动员。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: 就去
  rationale: 承接上文叙事，简洁自然地表达亚玛撒采取行动。
- source_word: לְהַזְעִיק
  choice: 召集
  rationale: 该词的使役形式在此指紧急召聚众人；“召集”既保留正式、急迫的意味，也不把军事含义说得过满。
- source_word: אֶת יְהוּדָה
  choice: 犹大人
  rationale: “犹大”在此集合性地指犹大地区或支派的民众；现代汉语用“犹大人”更清楚自然。
- source_word: וייחר
  choice: 耽搁了
  rationale: 此处意为迟延、未能按期完成；“耽搁了”适合与后面的期限表达衔接。
- source_word: מִן הַמּוֹעֵד
  choice: 超过……规定的期限
  rationale: 介词与“迟延”一词结合，表示越过预先指定的时间；“期限”符合上文限时三日的语境。
- source_word: אֲשֶׁר יְעָדוֹ
  choice: 王给他规定的
  rationale: 动词表示指定或规定时间，宾语后缀指亚玛撒；主语依上文为大卫。译作“王”使中文指代清楚，同时避免重复人名。
