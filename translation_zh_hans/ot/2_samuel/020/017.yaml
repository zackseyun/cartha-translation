base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/017.yaml
  text: He came near to her[a], and the woman said, “Are you Joab?” He said, “I am.” Then she said to him, “Listen to the words of your servant.” He said, “I am listening.”
translation:
  language: zh_hans
  text: 他走近她，那妇人问：“你是约押吗？”他说：“是我。”她又对他说：“请听你婢女的话[a]。”他说：“我在听。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “婢女”也可译作“女仆”。希伯来语原词是女性用来谦称自己的仆役称谓。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרַב אֵלֶיהָ
  choice: 他走近她
  rationale: קרב的Qal叙事形式表示实际走近，אֵלֶיהָ指向那妇人；“走近她”自然、简洁，并保留动作方向。
- source_word: הָאִשָּׁה
  choice: 那妇人
  rationale: 此处指上下文中已经出现的成年女性，并非特指妻子；“那妇人”符合叙事语体。
- source_word: הַאַתָּה יוֹאָב
  choice: 你是约押吗？
  rationale: 疑问词与独立代词构成身份确认问句，直译为现代汉语自然表达。
- source_word: אָנִי
  choice: 是我
  rationale: 独立代词在此作简短身份确认；“是我”比单说“我”更符合汉语对答习惯，也未额外加入“对”等肯定成分。
- source_word: שְׁמַע
  choice: 请听
  rationale: 命令式要求对方留心听；汉语加入“请”自然传达妇人谦恭请求的语气，而不改变命令式的基本内容。
- source_word: דִּבְרֵי אֲמָתֶךָ
  choice: 你婢女的话
  rationale: דִּבְרֵי保留为“话”；אָמָה是女性仆役称谓，也在此作为谦卑的自称。“婢女”保留其女性和卑下身份色彩。
- source_word: שֹׁמֵעַ אָנֹכִי
  choice: 我在听
  rationale: 分词加独立代词表达正在进行的专心聆听；“我在听”简洁保留持续体意味。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。对话简洁，保留原文反复使用“说”的直接感，但按汉语习惯用“问”“又对他说”使行文自然；脚注说明女性自谦称谓的词义与语用色彩。
