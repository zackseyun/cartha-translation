  yaml_path: translation/ot/2_samuel/020/016.yaml
  text: Then a wise woman called out from the city, “Listen! Listen! Please tell Joab, ‘Come near to here, so that I may speak with you.’”
translation:
  language: zh_hans
  text: 这时，城里有一个智慧的妇人高声喊道：“请听！请听！请你们告诉约押：‘请到这里来，我有话对你说。’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִשָּׁה חֲכָמָה
  choice: 一个智慧的妇人
  rationale: 直译其身份与特质；“智慧的妇人”用语庄重自然，也保留叙事对她智慧的明确评价。
- source_word: וַתִּקְרָא
  choice: 高声喊道
  rationale: 在攻城场景中，קרא指从城内向外呼喊；加“高声”自然传达远距离呼叫的语用含义。
- source_word: שִׁמְעוּ שִׁמְעוּ
  choice: 请听！请听！
  rationale: 保留原文命令的重复及急切语气；补“请”符合妇人随后礼貌请求的汉语表达。
- source_word: אִמְרוּ נָא אֶל יוֹאָב
  choice: 请你们告诉约押
  rationale: 复数命令式以“你们”体现，נָא译作礼貌请求“请”；אמר אל在此自然译为“告诉”。
- source_word: קְרַב עַד הֵנָּה
  choice: 请到这里来
  rationale: קרב表达靠近，עד הנה指到说话者所在之处；现代汉语“到这里来”准确而自然。
- source_word: וַאֲדַבְּרָה אֵלֶיךָ
  choice: 我有话对你说
  rationale: 意愿式表示说话目的；汉语惯用表达比机械直译“让我对你说话”更自然，并保持第一人称对第二人称单数。
