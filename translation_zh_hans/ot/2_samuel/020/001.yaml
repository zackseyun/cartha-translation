source:
  edition: WLC
  text: וְ/שָׁ֨ם נִקְרָ֜א אִ֣ישׁ בְּלִיַּ֗עַל וּ/שְׁמ֛/וֹ שֶׁ֥בַע בֶּן בִּכְרִ֖י אִ֣ישׁ יְמִינִ֑י וַ/יִּתְקַ֣ע בַּ/שֹּׁפָ֗ר וַ֠/יֹּאמֶר אֵֽין לָ֨/נוּ חֵ֜לֶק בְּ/דָוִ֗ד וְ/לֹ֤א נַֽחֲלָה לָ֨/נוּ֙ בְּ/בֶן יִשַׁ֔י אִ֥ישׁ לְ/אֹהָלָ֖י/ו יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/001.yaml
  text: There happened to be there a worthless man[a], whose name was Sheba son of Bichri, a Benjaminite. He blew the trumpet and said, “We have no share in David, and no inheritance in the son of Jesse. Every man to his tents[d][c][b], O Israel!”
translation:
  language: zh_hans
  text: 恰巧在那里有一个无赖[a]，名叫示巴，是比基利的儿子，属便雅悯支派。他吹响角号[b]，说：“我们与大卫无分[c]，在耶西的儿子那里也没有产业！以色列啊，各回各的帐棚去吧[d]！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“恶人”“匪徒”；较直译为“彼列之人”。“彼列”在此表达卑劣或无法无天的意思。
    reason: lexical_alternative
  - marker: b
    text: 原文指用兽角制成、用于发出公共信号的号，传统上常理解为公羊角号。
    reason: cultural_note
  - marker: c
    text: “无分”也可译作“没有份儿”。
    reason: lexical_alternative
  - marker: d
    text: 原文直译为“各人回他的帐棚”。这是分配性说法，意思是各人回自己的家或营地。
    reason: lexical_alternative
lexical_decisions:
- source_word: נִקְרָא
  choice: 恰好有
  rationale: 这里的尼法勒式与地点副词“那里”合用，承担存在、叙事引入的功能，并非表示“被称为”。“恰好有”自然呈现人物在场并随即进入叙事的意味。
- source_word: אִישׁ בְּלִיַּעַל
  choice: 一个无赖
  rationale: בְּלִיַּעַל在本处是贬义描述，指卑劣、无法无天之人；“无赖”简洁自然，也避免把它误作后期恶魔名号。
- source_word: שֶׁבַע בֶּן בִּכְרִי
  choice: 示巴，是比基利的儿子
  rationale: 按现代中文圣经人名惯例音译，并清楚表达父子关系。
- source_word: אִישׁ יְמִינִי
  choice: 属便雅悯支派
  rationale: 该短语表明支派归属；此译比直译“便雅悯人”更便于普通读者理解。
- source_word: וַיִּתְקַע בַּשֹּׁפָר
  choice: 他吹响角号
  rationale: שׁוֹפָר是作为公共信号使用的兽角号。“吹响角号”既保留器物特征，也符合这里召集叛乱的叙事场景。
- source_word: אֵין לָנוּ חֵלֶק בְּדָוִד
  choice: 我们与大卫无分
  rationale: חֵלֶק指份额、分有；“与大卫无分”保留政治上不再认同或参与其王权的简练口号感。
- source_word: וְלֹא נַחֲלָה לָנוּ בְּבֶן יִשַׁי
  choice: 在耶西的儿子那里也没有产业
  rationale: נַחֲלָה通常指产业、承受之业。保留“产业”可传达土地与承受权的回响，同时维持此处政治隐喻；“耶西的儿子”保留刻意不用王号的轻蔑语气。
- source_word: אִישׁ לְאֹהָלָיו
  choice: 各回各的帐棚去吧
  rationale: 原文以单数“各人”配复数“他的帐棚”，是分配性习语。“各回各的帐棚”在中文中自然表达众人各自离去，也保留古代营居图景。
- source_word: יִשְׂרָאֵל
  choice: 以色列啊
  rationale: 在语境中是直接呼语；“啊”明确呈现公开号召的语气。
theological_decisions:
- issue: בְּלִיַּעַל在此应作专名还是描述性称谓
  choice: 译作描述性称谓“无赖”
  alternative: 译作专名“彼列之人”或“属彼列的人”
  rationale: 本段语境用该词评价示巴的卑劣和悖逆，并不要求后期恶魔学意义。采用描述性译法可避免把后来的神学联想带入历史叙事。
- issue: נַחֲלָה的政治隐喻是否应意译
  choice: 保留“产业”
  alternative: 意译为“关系”“权益”或“份儿”
  rationale: “产业”虽带有具体土地和承受权色彩，却正能保留原文与以色列产业观念之间可能存在的回响，不把政治口号的神学张力化约掉。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。叛乱口号用短促、平行的句式呈现；“与大卫无分／没有产业”保留原文的政治与承受权语言，“耶西的儿子”则保留其贬抑王权的修辞效果。所有脚注标记均置于对应正文词句之后。
