base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/011.yaml
  text: And one of Joab’s young men stood over him and said[a], “Whoever favors Joab, and whoever is for David[b], follow Joab!”
translation:
  language: zh_hans
  text: 约押的一个随从[a]站在亚玛撒旁边，说：“谁拥护约押，谁效忠大卫，就跟随约押[b]！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “随从”所译的希伯来语也可指“年轻人”“仆人”或“侍从”，这里指约押麾下的部属。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译为“在约押之后”；这里是号召众人跟着他行动。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ
  choice: 一个
  rationale: 此处指约押部下中某个未具名的人；译作“一个”自然地保留不定指含义。
- source_word: עָמַד עָלָיו
  choice: 站在亚玛撒旁边
  rationale: עמד 与 על 连用可表示站在某人上方或旁边；结合亚玛撒倒地的场景，“站在……旁边”既符合画面，也避免中文“站在他身上”的误解。为明确代词所指，译出“亚玛撒”。
- source_word: מִנַּעֲרֵי יוֹאָב
  choice: 约押的一个随从
  rationale: נַעַר 可指年轻人、仆人或侍从；这里是约押麾下的部属。“随从”自然呈现其从属身份，同时以脚注保留年龄含义的可能。
- source_word: מִי אֲשֶׁר חָפֵץ בְּיוֹאָב
  choice: 谁拥护约押
  rationale: חָפֵץ 的基本义包括喜爱、乐意和支持；在召集军士的语境中，“拥护”准确表达对约押的支持。
- source_word: וּמִי אֲשֶׁר לְדָוִד
  choice: 谁效忠大卫
  rationale: 介词 לְ 在此表达归属或忠诚；“效忠大卫”符合政治和军事语境，又不把两句之间的张力消解为完全相同的措辞。
- source_word: אַחֲרֵי יוֹאָב
  choice: 跟随约押
  rationale: 字面为“在约押之后”，在此号召语境中表示跟在约押后面行动，因此译作“跟随约押”。
theological_decisions:
- issue: 对约押的拥护与对大卫的效忠之间的关系
  choice: 分别译作“拥护约押”和“效忠大卫”
  alternative: 将两者都译作“支持”或“站在……一边”
  rationale: 原文使用不同结构：对约押用 חָפֵץ בְּ，对大卫用 לְ。保留措辞差异，可呈现呼喊者把追随约押与效忠大卫并列、却未明说二者完全等同的张力。
translation_notes:
  register: 采用现代、庄重而清晰的叙事语言。“拥护”“效忠”“跟随”适合军事号召的语境；将代词“他”明确为“亚玛撒”，帮助普通读者辨认所指而不增加原文没有的新信息。
