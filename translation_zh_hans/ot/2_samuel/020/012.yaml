  naturalness: 译文符合现代标准汉语的叙事习惯；“大道中央”“停下脚步”“挪到田里”均自然清楚。将“盖”改为“扔在”后，动作更贴近原文，句子仍通顺。
  terminology: “亚玛撒”是通行的人名译法。“大道”“田里”“衣服”等用语恰当且不作不必要具体化。脚注恰当地保留“翻滚”与痛苦动作之间的解释余地。
