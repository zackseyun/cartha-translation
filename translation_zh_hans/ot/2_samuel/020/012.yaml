  text: וַ/עֲמָשָׂ֛א מִתְגֹּלֵ֥ל בַּ/דָּ֖ם בְּ/ת֣וֹךְ הַֽ/מְסִּלָּ֑ה וַ/יַּ֨רְא הָ/אִ֜ישׁ כִּֽי עָמַ֣ד כָּל הָ/עָ֗ם וַ/יַּסֵּב֩ אֶת עֲמָשָׂ֨א מִן הַֽ/מְסִלָּ֤ה הַ/שָּׂדֶה֙ וַ/יַּשְׁלֵ֤ךְ עָלָי/ו֙ בֶּ֔גֶד כַּ/אֲשֶׁ֣ר רָאָ֔ה כָּל הַ/בָּ֥א עָלָ֖י/ו וְ/עָמָֽד־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/012.yaml
  text: Amasa was wallowing in blood in the middle of the highway. When the man saw that all the people were stopping[a], he moved Amasa from the highway into the field and threw a garment over him, because he saw that everyone who came upon him stopped.
translation:
  language: zh_hans
  text: 亚玛撒正在大道中央的血中翻滚[a]。那人看见众人全都停下脚步，就把亚玛撒从大道挪到田里，又把一件衣服扔在他身上，因为他看见凡来到亚玛撒身边的人都停了下来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在血中辗转翻动。”这里的希伯来语动词字面意思是“自己翻滚”，很可能是在描写亚玛撒受重伤后躺在血中痛苦挪动的情形。
    reason: 保留 מִתְגֹּלֵל 的字面动作及其语境含义之间的差异，避免正文把“痛苦挣扎”解释得过死。
lexical_decisions:
- source_word: מִתְגֹּלֵל
  choice: 正在……翻滚
  rationale: 该词是 גלל 的 Hitpolel 分词，字面指自己翻滚；此处描写亚玛撒重伤后在血中的动作。“翻滚”保留原文的动作意象，又不额外断定动作完全出于痛苦抽搐。
- source_word: בַּדָּם
  choice: 在血中
  rationale: 保留原文“在血中”的简洁、鲜明表达，不擅自补入“自己的”，也不把血明确解释为“血泊”。
- source_word: בְּתוֹךְ הַמְסִלָּה
  choice: 在大道中央
  rationale: מְסִלָּה 指供人通行的主要道路，可能含铺筑或高起之意；“大道”在现代汉语中自然，也能体现这不是狭窄小径。
- source_word: הָאִישׁ
  choice: 那人
  rationale: 定冠词表明这是上下文中已知的特定人物，译作“那人”比泛指的“一个人”准确。
- source_word: כִּי עָמַד כָּל הָעָם
  choice: 看见众人全都停下脚步
  rationale: עמד 在这里表示众人因遇见亚玛撒而停住；“停下脚步”符合叙事场景，也保留 כָּל 的整体性。
- source_word: וַיַּסֵּב
  choice: 就把……挪到
  rationale: 此处使役形式表示把亚玛撒移离道路；“挪到”自然且克制，不擅自说明是拖、抬或转动。
- source_word: מִן הַמְסִלָּה הַשָּׂדֶה
  choice: 从大道挪到田里
  rationale: 以“从……到……”清楚表达由道路移往邻近田地的方向。
- source_word: וַיַּשְׁלֵךְ עָלָיו בֶּגֶד
  choice: 又拿一件衣服盖在他身上
  rationale: בֶּגֶד 是泛指衣物；原文“扔在他上面”的动作在此有遮盖之意，汉语用“拿一件衣服盖在他身上”更自然，同时不把衣物具体化为斗篷。
- source_word: כָּל הַבָּא עָלָיו
  choice: 凡来到亚玛撒身边的人
  rationale: 表达每一个行至现场、遇见亚玛撒的人；重复姓名可避免连续代词在汉语中的指代含混。
- source_word: וְעָמָד
  choice: 都停了下来
  rationale: 与前面的 עָמַד 呼应，明确说明来人见到他便停步。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“大道中央”“停下脚步”“盖在他身上”符合当代普通话习惯；正文保留动作重复和现场的直观感，不增添死亡、拖拽或衣物种类等原文未明说的信息。
