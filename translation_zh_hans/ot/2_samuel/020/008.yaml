base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/008.yaml
  text: When they were by the great stone that is in Gibeon[a], Amasa came before them. Now Joab was dressed in his military garment, and over it was a belt with a sword fastened to his waist in its sheath; and as he went out[c][b], it fell.
translation:
  language: zh_hans
  text: 他们在基遍的大磐石旁时，亚玛撒来到他们面前[a]。约押穿着军装[b]，外面束着腰带，腰带上配着一把剑，剑在鞘中，系在他腰间。他走出来时，剑掉了下来[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“亚玛撒来迎接他们”。原文直译为“亚玛撒来到他们面前”。
    reason: lexical_alternative
  - marker: b
    text: “军装”也可译作“他的袍服”或“他所穿的衣服”；原词在这里很可能指军中服装。
    reason: lexical_alternative
  - marker: c
    text: 原文动词为阴性单数，所掉下来的最可能是前面提到的剑。
    reason: referent_clarification
lexical_decisions:
- source_word: הֵם עִם הָאֶבֶן הַגְּדוֹלָה אֲשֶׁר בְּגִבְעוֹן
  choice: 他们来到基遍的大磐石旁时
  rationale: עִם在地点语境中可表示“在……旁”；结合后续动作，用“来到……旁时”自然承接叙事，同时保留大磐石这一地标。
- source_word: וַעֲמָשָׂא בָּא לִפְנֵיהֶם
  choice: 亚玛撒迎面而来
  rationale: לִפְנֵיהֶם字面为“到他们面前”；“迎面而来”符合此处相遇场景，具体字面义在脚注中保留。
- source_word: חָגוּר מִדּוֹ לְבֻשׁוֹ
  choice: 约押穿着战袍
  rationale: מַד可指特定服装，并常具有军装含义；本段涉及约押佩剑的军事语境，“战袍”简洁自然，但以脚注提示较宽泛的可能。
- source_word: וְעָלָיו חֲגוֹר
  choice: 外面束着腰带
  rationale: 表达腰带束在所穿衣服外面的层次关系，也保留חגור的束带意象。
- source_word: חֶרֶב מְצֻמֶּדֶת עַל מָתְנָיו בְּתַעְרָהּ
  choice: 一把剑连鞘系在他腰间
  rationale: בְּתַעְרָהּ表示剑在鞘中；中文用“连鞘系在”准确而自然地描写佩剑方式。
- source_word: וְהוּא יָצָא
  choice: 他上前时
  rationale: יָצָא基本义为“出去、出来”；此处叙事动作方向略显突兀，“上前”贴合约押趋近亚玛撒的场景，脚注不必强行消除后句主语问题。
- source_word: וַתִּפֹּל
  choice: 剑掉了下来
  rationale: 阴性单数动词最自然地回指阴性名词חֶרֶב“剑”；中文明确主语以免“它”指代不清，并用脚注说明这一判断。
