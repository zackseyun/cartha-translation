base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/026.yaml
  text: And Ira the Jairite also was priest to David[a].
translation:
  language: zh_hans
  text: 睚珥人以拉也作大卫的祭司[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“首席大臣”或“王室顾问”。希伯来语直译为“祭司”，但在某些王室语境中也可能指宫廷高级官员。
    reason: 词义备选：保留 כֹהֵן 在王室语境中可能指高级官员的解释。
lexical_decisions:
- source_word: וְגַם
  choice: 也
  rationale: 这一表达兼有承接和增补之意；本节处在官员名单的延续中，现代汉语用“也”即可自然体现增补语气。
- source_word: עִירָא
  choice: 以拉
  rationale: 按现代中文圣经人名的通行音译处理此专名。
- source_word: הַיָּאִרִי
  choice: 睚珥人
  rationale: 该族属或宗族形容词指与睚珥有关的人；译作“睚珥人”简洁自然，也不把关系进一步限定为直系后裔。
- source_word: הָיָה
  choice: 作
  rationale: 此处是官员名单中的过去时系词，表示以拉所任的身份，并非强调他开始担任该职；“作……的祭司”符合现代汉语叙事表达。
- source_word: כֹהֵן
  choice: 祭司
  rationale: 该词通常指“祭司”。虽然在王室语境中可能指宫廷高级官员，但正文保留其直接词义，以免消除原文的歧义。
- source_word: לְדָוִד
  choice: 大卫的
  rationale: 介词表示以拉与大卫之间的隶属或服事关系。汉语用“大卫的祭司”自然表达这种关系，同时不具体限定其职责。
theological_decisions:
- issue: 王室语境中 כֹהֵן 的含义
  choice: 正文译作“祭司”
  alternative: 首席大臣；王室顾问
  rationale: 尽管该词在与君王有关的官员名单中可能表示非礼仪性的宫廷高官，其通常和字面的含义仍是“祭司”。正文保留这一含义，脚注列出行政职务的可能解释，从而保存原文的张力。
translation_notes:
  register: 采用简洁庄重的现代标准汉语，保持官员名单的简练风格。正文使用通行人名“以拉”“睚珥”和“大卫”，并以脚注保留关键职称的语义歧义。
