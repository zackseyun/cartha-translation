  text: וַ/יָּבֹ֨א דָוִ֣ד אֶל בֵּית/וֹ֮ יְרֽוּשָׁלִַם֒ וַ/יִּקַּ֣ח הַ/מֶּ֡לֶךְ אֵ֣ת עֶֽשֶׂר נָשִׁ֣ים פִּלַגְשִׁ֡ים אֲשֶׁ֣ר הִנִּיחַ֩ לִ/שְׁמֹ֨ר הַ/בַּ֜יִת וַֽ/יִּתְּנֵ֤/ם בֵּית מִשְׁמֶ֨רֶת֙ וַֽ/יְכַלְכְּלֵ֔/ם וַ/אֲלֵי/הֶ֖ם לֹא בָ֑א וַ/תִּהְיֶ֧ינָה צְרֻר֛וֹת עַד י֥וֹם מֻתָ֖/ן אַלְמְנ֥וּת חַיּֽוּת־־׀־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/003.yaml
  text: When David came to his house at Jerusalem[a], the king took the ten women, the concubines whom he had left to keep the house, and put them in guarded custody and provided for them, but he did not go in to them. So they were kept confined until the day of their death[c][b], living as widows.
translation:
  language: zh_hans
  text: 大卫回到耶路撒冷自己的住处后，王把那十个妾室——就是他留下来看守住处的——安置在拘禁之所[a]，供养她们，却不再与她们同房[b]。她们就这样一直被幽禁，直到死去，活着却如同寡妇[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“看守之屋”，也可译作“受看守的居所”。
    reason: lexical_alternative
  - marker: b
    text: “与她们同房”是指与她们发生性关系；原文使用的是委婉说法。
    reason: cultural_note
  - marker: c
    text: 原文近于“活着的寡居状态”，意思是大卫仍然活着，她们却像寡妇一样生活。
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּיתוֹ
  choice: 自己的住处
  rationale: בַּיִת在此可指住宅、王宫或家室。“自己的住处”保留“他的房屋”的基本表达，也符合大卫回到耶路撒冷王家住所的语境，而不把“王宫”这一较具体的理解直接写入首句。
- source_word: פִּלַגְשִׁים
  choice: 妾室
  rationale: 该词指在王室家庭中具有被承认但地位较低的配偶。“妾室”在现代汉语中简洁清楚，也比泛称“妃嫔”更能保留其较低的婚姻地位。
- source_word: הִנִּיחַ לִשְׁמֹר הַבַּיִת
  choice: 留下来看守王宫
  rationale: שׁמר可指看守、守护或照管；这里的הַבַּיִת按语境是大卫的王家住所。译作“看守王宫”自然明确，并保留守护的含义。
- source_word: בֵּית מִשְׁמֶרֶת
  choice: 有人看守的住处
  rationale: 该短语直译为“看守之屋”或“拘禁之所”，兼有具体住所和受监管拘禁的意味。正文以“关在有人看守的住处”表达这两层意思，脚注保留其他可能译法。
- source_word: וַיְכַלְכְּלֵם
  choice: 供养她们
  rationale: 该动词表示持续供应生活所需。“供养”在此简洁自然，清楚表达大卫仍负责她们的生活。
- source_word: וַאֲלֵיהֶם לֹא בָא
  choice: 却不再亲近她们
  rationale: בוא אל在此是发生性关系的委婉说法。“亲近”在中文中同样保持含蓄和庄重；“再”依据她们原为大卫妾室的上下文表达此后关系中止。
- source_word: צְרֻרוֹת
  choice: 一直被幽禁
  rationale: 被动分词在此表示被关闭、隔绝的持续状态。“一直被幽禁”保留其被动、结果性和延续性，不把处境淡化为普通独居。
- source_word: עַד יוֹם מֻתָן
  choice: 到死
  rationale: 这是“直到她们死亡之日”的自然现代汉语表达，完整保留终身持续的时间范围。
- source_word: אַלְמְנוּת חַיּוּת
  choice: 活着却如同寡妇
  rationale: 原文是罕见而凝练的表达，近于“活着的寡居状态”。此译保留丈夫仍活着、她们却像寡妇一样生活的悖论感。
theological_decisions:
- issue: 如何呈现大卫对妾室的处置及其道德含义
  choice: 按叙事直接描述她们被看守、受供养、不再与大卫发生夫妻关系并终身幽禁的处境，不加辩护或定罪性评语。
  alternative: 把这种安排只解释为保护，或加入原文没有明说的道德谴责。
  rationale: 原文以冷峻的叙述呈现大卫的行动及这些妇女的结局。译文应保留这种张力，让读者面对其受供养却被幽禁、丈夫尚在却如寡妇的处境，而不代替经文作额外判断。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“妾室”“供养”“幽禁”等词兼顾古代王室背景与现代可读性；正文不美化这些妇女的受限处境，也不添加原文未明说的评价。所有脚注标记均置于对应词句之后。
