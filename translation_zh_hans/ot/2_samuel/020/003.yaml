  - severity: medium
    issue: “有人看守的住处”弱化并增添了 בֵּית מִשְׁמֶרֶת 的含义。
    rationale: 该词组指看守、拘禁之所；“有人”不是原文所明说，而“住处”本身未充分表达拘禁性质。译为“拘禁之所”更贴近其监管、隔离的语义。
