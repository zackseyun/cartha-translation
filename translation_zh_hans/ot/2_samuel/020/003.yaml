- from: 大卫回到耶路撒冷自己的住处。王把留下来看守王宫的十个妾室关在有人看守的住处[a]，供养她们，却不再亲近她们[b]。她们就这样一直被幽禁到死，活着却如同寡妇[c]。
  to: 大卫回到耶路撒冷自己的住处后，王把那十个妾室——就是他留下来看守住处的——安置在拘禁之所[a]，供养她们，却不再与她们同房[b]。她们就这样一直被幽禁，直到死去，活着却如同寡妇[c]。
  rationale: 修订避免把“房屋”具体化为“王宫”，并以“拘禁之所”准确表达“看守／拘禁之屋”的含义，且不添加“有人看守”的细节。“同房”保留原文的委婉语性质，并在脚注说明其所指。其余内容保留原译对持续幽禁和“活着如寡妇”这一悖论的准确呈现。
