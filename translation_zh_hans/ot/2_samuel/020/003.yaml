  naturalness: 原译语言庄重通顺。“活着却如同寡妇”尤其自然，也保留了原文刻意的矛盾感。修订以“拘禁之所”和“同房”使受限制状态及原文性关系委婉语更明确，同时维持现代汉语叙事的自然度。
