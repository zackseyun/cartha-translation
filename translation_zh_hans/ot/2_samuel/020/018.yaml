  text: Then she said[a], “They used to say in former times[b], ‘Let them surely ask at Abel,’ and so they ended the matter.”
translation:
  language: zh_hans
  text: 她说[a]：“古时候人常说：‘务要到亚伯[b]求问。’事情便这样了结了。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本句也可译作：“她说：‘从前人总是说：「务要在亚伯求问。」事情便这样了结了。’”希伯来文两处都采用“不定式绝对形＋动词”的加强结构；末尾的动词也可较直译为“使之结束”或“把它办完”。
    reason: lexical_alternative
  - marker: b
