    reason: cultural_note
lexical_decisions:
- source_word: וַתֹּאמֶר לֵאמֹר
  choice: 她说
  rationale: 叙事性连续式引出妇人的后续发言；第二个词在现代汉语中由直接引语标点自然表达，不机械译作“说道”。
- source_word: דַּבֵּר יְדַבְּרוּ
  choice: 人常说
  rationale: 不定式绝对形与未完成式连用，具有加强或惯常意味；结合“古时候”，译作“人常说”最自然，也保留古谚流传的语气。
- source_word: בָרִאשֹׁנָה
  choice: 古时候
  rationale: 这里指从前的时代或旧有惯例，并非某个程序中的“起初”。
- source_word: שָׁאֹל יְשָׁאֲלוּ
  choice: 务要……求问
  rationale: 不定式绝对形与未完成式连用以加强“求问”；“务要”保留强调和格言式的劝令语气。
- source_word: בְּאָבֵל
  choice: 到亚伯
  rationale: 亚伯是此处被围之城亚伯·伯玛迦的简称；介词 בְ 可按语境表达在该城求问或到该城寻求意见，“到亚伯”较符合现代汉语习惯。
- source_word: וְכֵן הֵתַמּוּ
  choice: 事情就这样解决了
  rationale: הֵתַמּוּ 是 תמם 的使役完成式，表示使某事完结；此处结合求问裁决的语境，译作“事情就这样解决了”，同时在脚注保留“结束/办完”的较直译可能。
