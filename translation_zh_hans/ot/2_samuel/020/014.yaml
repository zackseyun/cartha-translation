  text: וַֽ/יַּעֲבֹ֞ר בְּ/כָל שִׁבְטֵ֣י יִשְׂרָאֵ֗ל אָבֵ֛לָ/ה וּ/בֵ֥ית מַעֲכָ֖ה וְ/כָל הַ/בֵּרִ֑ים ו/יקלהו וַ/יָּבֹ֖אוּ אַף אַחֲרָֽי/ו־־ס־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/014.yaml
  text: He passed through all the tribes of Israel to Abel and Beth-maacah[b][a], and all the Berites assembled and also followed after him.
translation:
  language: zh_hans
  text: 他走遍以色列各支派，来到亚伯和伯玛迦；所有比利人[a]都聚集起来，也跟随他[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文作“所有比利人”。有些译本依据上下文中“比基利的儿子示巴”译作“所有比基利人”；此处马所拉文本更直接支持“比利人”。
    reason: alternative_reading
  - marker: b
    text: 或译：“也来到他后面。”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: 他走遍
  rationale: 动词 עבר 在此叙事中表示穿行各地；“走遍”自然表达他经过以色列各支派地域的广泛行动。
- source_word: בְּכָל שִׁבְטֵי יִשְׂרָאֵל
  choice: 以色列各支派
  rationale: 介词 ב 在此具有地域和分布含义；与“走遍”搭配，表达穿过各支派的地域，而非仅指与各支派的人交往。
- source_word: אָבֵלָה
  choice: 来到亚伯
  rationale: 词尾的方向词尾 ה 表示朝向亚伯；“来到”在汉语中清楚呈现这一方向。
- source_word: וּבֵית מַעֲכָה
  choice: 和伯玛迦
  rationale: 此处按地名音译，不按字面译作“玛迦之家”；保留原文将“亚伯”与“伯玛迦”并列的形式。
- source_word: וְכָל הַבֵּרִים
  choice: 所有比利人
  rationale: 马所拉文本较直接支持一个音译的族群称谓“比利人”；其具体身份不确定，因此不在正文中按上下文改成“比基利人”。
- source_word: וַיִּקָּהֲלוּ
  choice: 都聚集起来
  rationale: קהל 在此表示人群集合；“聚集起来”符合现代汉语叙事表达。
- source_word: וַיָּבֹאוּ אַף אַחֲרָיו
  choice: 也跟随他
  rationale: 字面为“也来到他后面”，在语境中表示加入并跟在他后面行动；“也跟随他”简洁传达其惯用含义，同时保留 אַף 的“也”。
