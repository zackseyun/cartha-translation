base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/015.yaml
  text: They came and besieged him in Abel-beth-maacah[a], and they cast up a siege ramp against the city, and it stood against the rampart[c][b]; and all the people who were with Joab were destroying it to bring down the wall.
translation:
  language: zh_hans
  text: 他们来到亚伯·伯玛迦，围困示巴[a]。他们向城堆筑攻城坡道，坡道靠着外堡[b][c]；跟随约押的众人不断破坏，要使城墙倒塌。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文作“围困他”，很可能是以藏在城中的示巴为目标；也可理解为“围困那城”。
    reason: alternative_reading
  - marker: b
    text: “攻城坡道”也可译作“攻城土坡”或“土垒”。
    reason: lexical_alternative
  - marker: c
    text: “外堡”所译的希伯来词可指城外的防御工事、壁垒或外墙。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: 他们来到
  rationale: 以自然的叙事表达呈现בוא的连续叙事形式，说明军队抵达。
- source_word: וַיָּצֻרוּ עָלָיו
  choice: 围困示巴
  rationale: צור עַל意为围困；希伯来文代词为阳性单数，按上文指向示巴。正文补明人名，既便于理解，也保留围城行动以示巴为目标的焦点。
- source_word: בְּאָבֵלָה בֵּית הַמַּעֲכָה
  choice: 在亚伯·伯玛迦
  rationale: 按专名音译，并以间隔号标示复合地名。
- source_word: וַיִּשְׁפְּכוּ סֹלְלָה
  choice: 堆筑攻城坡道
  rationale: שׁפך字面为“倾倒”，在攻城语境中指堆土；סֹלְלָה指攻城土坡或坡道。“堆筑攻城坡道”自然且保留军事图景。
- source_word: אֶל הָעִיר
  choice: 向城
  rationale: 保留אֶל的方向含义，同时由攻城语境表达敌对用途。
- source_word: וַתַּעֲמֹד בַּחֵל
  choice: 坡道直抵外堡
  rationale: 阴性动词最自然地回指阴性名词סֹלְלָה；חֵל可指城外的防御工事。“直抵”自然表达坡道架设至防御工事处，但不进一步限定其具体构造。
- source_word: וְכָל הָעָם אֲשֶׁר אֶת יוֹאָב
  choice: 跟随约押的众人
  rationale: 此处אֶת表示伴随或归属关系；“跟随约押的众人”准确而符合现代汉语。
- source_word: מַשְׁחִיתִם
  choice: 不断进行破坏
  rationale: 保留שׁחת分词所表达的持续破坏行动，并避免擅自补定希伯来文未明说的宾语。
- source_word: לְהַפִּיל הַחוֹמָה
  choice: 要使城墙倒塌
  rationale: 准确表达נפל使役式“使……倒下”，并保留目的关系。
theological_decisions:
- issue: עָלָיו所指对象
  choice: 正文译为“围困示巴”
  alternative: “围困那城”或“围困他”
  rationale: 原文使用阳性单数代词，结合前文最可能指示巴，而不是语法上阴性的“城”；译出示巴可在汉语中保留这一指向，脚注同时交代原文形式及另一种按实际受围对象理解的译法。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。句法保持叙事推进；军事术语力求普通读者可懂。正文不把מַשְׁחִיתִם的省略宾语强行确定为城墙或城防，以保存原文的含混；标记次序按正文首次出现排列为[a]、[b]、[c]。
