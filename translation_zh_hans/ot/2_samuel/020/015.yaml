  to: 他们来到亚伯·伯玛迦，围困示巴[a]。他们向城堆筑攻城坡道，坡道靠着外堡[b][c]；跟随约押的众人不断破坏，要使城墙倒塌。
  rationale: 将“直抵”改为“靠着”，避免把原文对攻城坡道与外防工事关系的简洁表述过度具体化；将“不断进行破坏”改为“不断破坏”，使现代汉语更自然，同时保存原文未明说破坏对象的含混。其余人名、地名、军事术语及脚注锚点均可保留。
