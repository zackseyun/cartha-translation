base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/007.yaml
  text: Joab’s men[a], the Kerethites, the Pelethites, and all the mighty men went out after him. They went out from Jerusalem to pursue Sheba son of Bichri.
translation:
  language: zh_hans
  text: 约押的部下、基利提人[a]、比利提人和所有勇士都跟着他出去。他们从耶路撒冷出发，去追赶比基利的儿子示巴。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “基利提人”是希伯来语族群或军队名称的音译，也可音译作“克利提人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצְאוּ ... אַחֲרָיו
  choice: 都跟着他出去
  rationale: 保留“出去”和“在他后面／跟着他”的动作关系，也不在本节中擅自点明“他”所指的人。
- source_word: אַנְשֵׁי יוֹאָב
  choice: 约押的部下
  rationale: 该附属结构指归约押统领的人；“部下”在现代汉语中自然，并准确表达军事隶属关系。
- source_word: הַכְּרֵתִי
  choice: 基利提人
  rationale: 作为大卫王室军队中一个群体的名称，采用中文圣经中通行且接近希伯来语的音译，不作推测性意译。
- source_word: הַפְּלֵתִי
  choice: 比利提人
  rationale: 这是常与基利提人并列的群体名称，采用通行音译。
- source_word: כָל הַגִּבֹּרִים
  choice: 所有勇士
  rationale: גִּבּוֹרִים在此具有军事含义；“勇士”简洁、庄重，并保留其勇武之人的意味。
- source_word: מִירוּשָׁלִַם
  choice: 从耶路撒冷出发
  rationale: 明确表达耶路撒冷是行动的起点；结合前文的“出去”，译作“出发”更符合现代汉语。
- source_word: לִרְדֹּף אַחֲרֵי
  choice: 去追赶
  rationale: 准确表达主动追踪、追捕的行动目的，且避免汉语中不自然的重复。
- source_word: שֶׁבַע בֶּן בִּכְרִי
  choice: 比基利的儿子示巴
  rationale: 按自然汉语表达希伯来语父名结构，保留人物与父亲之间的关系。
theological_decisions: []
