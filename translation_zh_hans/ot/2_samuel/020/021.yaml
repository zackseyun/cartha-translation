base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/021.yaml
  text: That is not the matter[a]. Rather, a man from the hill country of Ephraim, Sheba son of Bichri by name, has raised his hand against the king, against David. Hand him over alone, and I will withdraw from the city.” And the woman said to Joab, “Look[b], his head will be thrown to you over the wall.”
translation:
  language: zh_hans
  text: “事情不是这样。而是，有一个从以法莲山区[a]来的人，名叫比基利的儿子示巴；他向王、向大卫举手[b]。只把他一个人交出来，我就从这城撤走。”妇人对约押说：“看，他的头就要越过城墙扔给你。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“以法莲山地”；这里指以法莲境内的山区，并非特指一座山峰。
    reason: lexical_alternative
  - marker: b
    text: “举手”是希伯来语习语，在这里指敌对或反叛；也可意译为“背叛王、背叛大卫”。
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא כֵן הַדָּבָר
  choice: 事情不是这样
  rationale: 自然表达对妇人先前判断的否定，同时贴近希伯来语“事情并非如此”的措辞。
- source_word: כִּי
  choice: 其实
  rationale: 在否定之后引出纠正性说明，符合此处的转折和解释作用。
- source_word: מֵהַר אֶפְרַיִם
  choice: 从以法莲山区来
  rationale: 这里通常指以法莲的山地区域，而非某一座名为“以法莲山”的单独山峰。
- source_word: שֶׁבַע בֶּן בִּכְרִי שְׁמוֹ
  choice: 名叫比基利的儿子示巴
  rationale: 保留父子称谓和命名句式，同时符合现代汉语表达习惯。
- source_word: נָשָׂא יָדוֹ
  choice: 举手
  rationale: 保留原文带有敌对、反叛意味的具体习语意象，不在正文中把含义单一化。
- source_word: בַּמֶּלֶךְ בְּדָוִד
  choice: 向王、向大卫
  rationale: 保留重复介词所形成的强调，以及“王”与“大卫”的同位关系。
- source_word: תְּנוּ אֹתוֹ לְבַדּוֹ
  choice: 只把他一个人交出来
  rationale: 清楚表达约押只要求交出示巴一人，并保留“单独、唯独”的限制意味。
- source_word: וְאֵלְכָה מֵעַל הָעִיר
  choice: 我就从这城撤走
  rationale: 围城语境中指约押及其军队撤离该城；“撤走”自然传达军事行动。
- source_word: הִנֵּה רֹאשׁוֹ מֻשְׁלָךְ אֵלֶיךָ בְּעַד הַחוֹמָה
  choice: 看，他的头就要从城墙上扔给你
  rationale: “看”体现 הִנֵּה 的提示和保证作用；被动分词结合语境表示即将发生之事，“从城墙上”符合随后把首级抛出城外的场景。
theological_decisions:
- issue: “举手”所表达的政治与伦理含义
  choice: 正文保留“向王、向大卫举手”，脚注说明其反叛含义
  alternative: 直接译为“背叛大卫王”
  rationale: 原文使用具体习语而非普通的“背叛”动词；保留意象可避免抹平措辞，同时脚注确保现代读者理解。
translation_notes:
  register: 采用现代、庄重而清楚的叙事语言。“事情不是这样”直接回应上文；“只把他一个人交出来”和“撤走”使围城场景易于理解。正文保留“向王、向大卫举手”的原文修辞及含义张力，并以脚注解释。
