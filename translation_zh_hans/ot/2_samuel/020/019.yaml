source:
  edition: WLC
  text: אָנֹכִ֕י שְׁלֻמֵ֖י אֱמוּנֵ֣י יִשְׂרָאֵ֑ל אַתָּ֣ה מְבַקֵּ֗שׁ לְ/הָמִ֨ית עִ֤יר וְ/אֵם֙ בְּ/יִשְׂרָאֵ֔ל לָ֥/מָּה תְבַלַּ֖ע נַחֲלַ֥ת יְהוָֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/019.yaml
  text: I am one of the peaceable and faithful in Israel. You are seeking to destroy a city[a], and a mother in Israel. Why would you swallow up the inheritance of Yahweh?
translation:
  language: zh_hans
  text: 我是以色列中爱好和平、忠信的人之一。你竟想毁灭一座城[a]，以及以色列中的一位母亲。你为什么要吞灭耶和华的产业呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“一座在以色列作母亲的城”，可能指以色列中一座地位重要或庇护、养育众人的城。
    reason: 说明“城”和“母亲”可能是同位关系，同时保留正文较贴近原文的表达。
lexical_decisions:
- source_word: שְׁלֻמֵי אֱמוּנֵי יִשְׂרָאֵל
  choice: 以色列中爱好和平、忠信的人之一
  rationale: 两个复数形式共同描写以色列中以和平与忠信为特征的一群人；说话者以单数“我”自称其中一员。译文补出“人之一”，使现代汉语自然，同时保留群体含义。
- source_word: מְבַקֵּשׁ לְהָמִית
  choice: 竟想毁灭
  rationale: 该结构表达正在谋求或意图使之死亡。因宾语是“城”，译作“毁灭”比“杀死”自然，也符合围城语境；“竟”传达质问中的震惊与责难，并未改变命题内容。
- source_word: עִיר וְאֵם בְּיִשְׂרָאֵל
  choice: 一座城，以及以色列中的一位母亲
  rationale: 按希伯来语表层结构保留“城”与“母亲”并列的修辞张力，不在正文中断定二者必为同位关系；可能的同位解释置于脚注。
- source_word: תְבַלַּע
  choice: 吞灭
  rationale: 保留“吞下、吞没”的鲜明意象，同时“灭”使其在军事毁城语境中的破坏含义清楚。
- source_word: נַחֲלַת יְהוָה
  choice: 耶和华的产业
  rationale: “产业”在此指归属于耶和华、由他赐下并保有的份，保留其盟约和归属意味。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经传统中对神圣名号的通行译法，明确对应希伯来文四字神名。
theological_decisions:
- issue: “以色列中的母亲”与“城”的关系
  choice: 正文保留并列措辞，不把“母亲”直接解释为“重要的城”或“养育众人的城”
  alternative: 译作“一座在以色列作母亲的城”
  rationale: 原文可将“城”和“母亲”理解为同位，但其句法与意象不宜在正文中被完全消解；脚注呈现较可能的解释，既帮助理解，也保存原有含混和修辞力度。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“爱好和平、忠信”自然地表达人物所属群体的品格；“吞灭”保留原文强烈意象。正文中的脚注标记[a]与脚注完全对应。
