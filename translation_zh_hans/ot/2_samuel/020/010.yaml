base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/010.yaml
  text: But Amasa was not on guard against the sword that was in Joab’s hand[a], and he struck him with it in the belly, and his entrails spilled out to the ground; he did not strike him again, and he died. Then Joab and Abishai his brother pursued Sheba son of Bichri.
translation:
  language: zh_hans
  text: 亚玛撒没有提防约押手里的剑；约押用剑击中他的腹部[a]，他的内脏流了出来，落在地上。约押没有再击打他，他就死了。随后，约押和他弟弟亚比筛追赶比基利的儿子示巴。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“第五根肋骨处”。较早的译本常采用这一译法，但这里的希伯来词更可能泛指腹部。
    reason: lexical_alternative
lexical_decisions:
- source_word: נִשְׁמַר
  choice: 没有提防
  rationale: 此处שׁמר的尼法勒形表达警觉、防备之意；“没有提防”自然地说明亚玛撒未警觉约押手中的兵器。
- source_word: חֶרֶב
  choice: 刀
  rationale: חֶרֶב泛指有刃的武器；在这段近身刺杀的叙事中，“刀”比“剑”更符合现代汉语的自然表达，同时不改变武器类别的基本含义。
- source_word: בְּיַד יוֹאָב
  choice: 约押手里的
  rationale: 保留原文具体的空间意象，指约押手中所持的武器。
- source_word: וַיַּכֵּהוּ בָהּ
  choice: 约押用刀刺入他
  rationale: נכה本义较宽，可译为“击打”；但结合有刃武器、腹部创口及内脏流出的语境，“刺入”准确而自然。明确主语“约押”，避免连续代词造成歧义。
- source_word: אֶל הַחֹמֶשׁ
  choice: 腹部
  rationale: חֹמֶשׁ在撒母耳记这些致命袭击的语境中较可能泛指腹部；“腹部”庄重、清楚，也避免把并不确定的具体解剖位置写入正文。
- source_word: וַיִּשְׁפֹּךְ מֵעָיו אַרְצָה
  choice: 他的肠子流到地上
  rationale: 直陈创伤后内脏外流的画面；“肠子”是普通现代读者容易理解且不过分口语化的说法，“流到地上”对应אַרְצָה。
- source_word: וְלֹא שָׁנָה לוֹ
  choice: 约押没有再刺一刀
  rationale: 原文直译为“不向他重复”，省略了所重复的动作；中文补明“再刺一刀”，保留只需一次攻击便致死的叙事含义。
- source_word: וַיָּמֹת
  choice: 他就死了
  rationale: “就”自然呈现前述重创与死亡之间紧接的叙事结果，又未额外加入神学解释。
- source_word: רָדַף אַחֲרֵי
  choice: 追赶
  rationale: 这是军事追击语境中的常用现代汉语表达。
- source_word: שֶׁבַע בֶּן בִּכְרִי
  choice: 比基利的儿子示巴
  rationale: 按现代汉语圣经叙事习惯音译人名，并自然表达父子关系。
