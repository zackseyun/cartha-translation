  text: Adoram was over the forced labor[a], and Jehoshaphat the son of Ahilud was the recorder.
translation:
  language: zh_hans
  text: 亚多兰掌管劳役[a]；亚希律的儿子约沙法任史官。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“劳役征调”或“徭役”。这里的希伯来语指国家强制征发的劳役，并非一般税赋。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹרָם
  choice: 亚多兰
  rationale: 按现代中文圣经人名的通行音译处理。
- source_word: עַל
  choice: 掌管
  rationale: 在王室官职名录的行政语境中表示负责、监管某项事务；中文以“掌管”自然补出希伯来语名词句所省略的系词含义。
- source_word: הַמַּס
  choice: 服劳役的人
  rationale: מַס 在王室行政语境中指国家征发的强制劳役，也可连带指被征发服役的人；结合“掌管”，译作“服劳役的人”中文较自然，同时用脚注保留“劳役征调”的制度性理解，避免误解为普通税收。
- source_word: יְהוֹשָׁפָט
  choice: 约沙法
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: בֶּן אֲחִילוּד
  choice: 亚希律的儿子
  rationale: 直译标准希伯来父名结构，以自然中文表达亲属关系。
- source_word: הַמַּזְכִּיר
  choice: 史官
  rationale: 该王室官衔指负责记录并处理国家事务备忘的官员；“史官”是中文圣经传统中简洁而易懂的译法，但不应仅理解为后世意义上的历史学家。
