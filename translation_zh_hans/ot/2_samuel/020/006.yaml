base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/006.yaml
  text: Then David said to Abishai[a], “Now Sheba son of Bichri will do us more harm than Absalom. You, take your lord’s servants and pursue after him, lest he find fortified cities for himself and escape from our sight.”
translation:
  language: zh_hans
  text: 大卫对亚比筛说：“现在，比基利的儿子示巴会比押沙龙更严重地危害我们。你要带领你主的仆人追赶他，免得他为自己找到坚固的城邑，从我们眼前逃脱[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译近似“夺走（或救出）我们的眼睛”；这是一个习语，意指逃离我们的视线或摆脱追捕。
    reason: 说明原文特殊习语及正文的意译。
lexical_decisions:
- source_word: יֵרַע לָנוּ ... מִן־אַבְשָׁלוֹם
  choice: 必比押沙龙加害我们更甚
  rationale: רעע在此指造成伤害或祸患，而非抽象的道德邪恶；“比……加害我们更甚”保留了מִן所表达的比较关系，也符合军事叛乱的语境。
- source_word: שֶׁבַע בֶּן־בִּכְרִי
  choice: 比基利的儿子示巴
  rationale: 采用现代中文圣经人名的通行音译，并清楚保留父子关系。
- source_word: אַתָּה קַח
  choice: 你要带领
  rationale: 独立人称代词אַתָּה带有强调意味；译出“你要”体现大卫对亚比筛本人所下的明确命令。קח在带领人员的语境中自然译作“带领”。
- source_word: עַבְדֵי אֲדֹנֶיךָ
  choice: 你主的仆人
  rationale: 保留原文的隶属和尊卑用语；“你主”在叙事中指亚比筛的君主大卫，但正文不将这一指代明说，以免过度解释。
- source_word: וּרְדֹף אַחֲרָיו
  choice: 追赶他
  rationale: רדף在军事语境中表示追击或追赶；中文无需机械译出“在他后面”，即可准确表达אַחֲרָיו。
- source_word: פֶּן
  choice: 免得
  rationale: 准确表达负面目的或忧虑，现代中文自然且庄重。
- source_word: מָצָא לוֹ עָרִים בְּצֻרוֹת
  choice: 他为自己找到坚固城邑
  rationale: 保留מצא“找到”的基本意义和לוֹ的受益意味，不进一步解释为“躲进”或“占据”；“城邑”可自然涵盖原文复数。
- source_word: וְהִצִּיל עֵינֵינוּ
  choice: 从我们眼前逃脱
  rationale: 这是希伯来语习语，直译近似“救出我们的眼睛”；正文采用自然中文表达其“脱离视线、摆脱追捕”的含义，同时以“眼前”保留原文视觉意象。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而清楚的叙事语言。“加害我们更甚”保留原文的比较力度；“你要”体现独立代词的强调。脚注标记置于其实际所解释的末句习语之后，而非人名之后。
