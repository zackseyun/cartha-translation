base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/023.yaml
  text: Joab was over all the army of Israel[a], and Benaiah son of Jehoiada was over the Cherethites and the Pelethites.
translation:
  language: zh_hans
  text: 约押统管以色列全军；耶何耶大的儿子比拿雅统管基利提人[a]和比利提人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或音译作“克利提人”。这个群体名称的准确音译形式并不确定。
    reason: 保留希伯来群体名称在形式和音译上的不确定性，避免将有争议的专名解释为确定的族属或职能。
lexical_decisions:
- source_word: וְיוֹאָב אֶל כָּל הַצָּבָא יִשְׂרָאֵל
  choice: 约押统管以色列全军
  rationale: 这是官职名录中的无动词句；אֶל 在此表示约押对军队拥有统辖权，译作“统管”自然明确。כָּל 保留为“全”，צָבָא 按军事语境译作“军”。句首 וְ 是名录中的承接成分，中文不必机械译作“于是”或“现在”。
- source_word: וּבְנָיָה בֶּן יְהוֹיָדָע
  choice: 耶何耶大的儿子比拿雅
  rationale: 两个专名采用现代中文圣经中通行且易辨认的音译；将“儿子”关系置于人名前，符合自然汉语表达。
- source_word: עַל הַכרי
  choice: 统管基利提人[a]
  rationale: עַל 在官职名录中表示管辖，译作“统管”。הכרי 是族群或卫队名称，来源及具体形式有不确定性，因此采用音译而不作功能性解释，并以脚注保留另一种音译可能。
- source_word: וְעַל הַפְּלֵתִי
  choice: 和比利提人
  rationale: 第二个 עַל 与前项平行，共用“统管”；中文省略重复谓语更流畅。פְּלֵתִי 作为群体名称音译为“比利提人”。
