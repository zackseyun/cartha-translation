base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/009.yaml
  text: Joab said to Amasa[a], “Is it well with you, my brother?” And Joab took hold of Amasa’s beard with his right hand to kiss him.
translation:
  language: zh_hans
  text: 约押对亚玛撒[a]说：“我的兄弟，你平安吗？”约押用右手抓住亚玛撒的胡须，要亲吻他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 抓住胡须并亲吻，是熟人之间问候时的举动；但从上下文看，约押在这里佯作亲切问候。
    reason: cultural_note
lexical_decisions:
- source_word: הֲשָׁלוֹם אַתָּה
  choice: 你平安吗
  rationale: 这是询问对方是否安好的习语；译为“你平安吗”既保留“平安”的希伯来表达，也符合现代汉语问候方式。
- source_word: אָחִי
  choice: 我兄弟
  rationale: 保留原文明确的第一人称所属后缀和亲昵称呼，同时呈现约押表面上的亲近。
- source_word: וַתֹּחֶז
  choice: 抓住
  rationale: 该动词表示抓住、握住；“抓住”准确表现动作，又不提前把下一节才显明的袭击意味强加于本节。
- source_word: יַד יְמִין יוֹאָב
  choice: 约押便用右手
  rationale: 以自然汉语保留原文“约押的右手”这一具体动作细节。
- source_word: בִּזְקַן עֲמָשָׂא
  choice: 亚玛撒的胡须
  rationale: 直译所属关系，并保留这一与当时问候礼节有关的重要文化细节。
- source_word: לִנְשָׁק לוֹ
  choice: 要亲吻他
  rationale: 介词 ל 加不定式表达目的；“要亲吻他”自然传达约押抓住胡须的表面意图，同时不消除上下文中的欺骗性。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“我兄弟，你平安吗？”保留希伯来问安语的特色；“便”连接连续动作，使叙事自然。脚注说明文化背景及上下文中的欺骗性，但正文不提前解释人物动机。
