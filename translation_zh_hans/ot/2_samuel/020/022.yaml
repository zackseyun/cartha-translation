base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/022.yaml
  text: Then the woman went to all the people in her wisdom[a], and they cut off the head of Sheba son of Bichri and threw it to Joab. Then he blew the trumpet, and they dispersed from the city, each man to his tent; and Joab returned to Jerusalem to the king.
translation:
  language: zh_hans
  text: 那妇人便凭着她的智慧去见众人；他们砍下比基利之子示巴的头，扔给约押。约押吹响号角，众人便从城下散去，各归自己的帐棚[a]；约押回到耶路撒冷，来到王那里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “各归自己的帐棚”是表示众人解散、各自回去的惯用说法。
    reason: cultural_note
lexical_decisions:
- source_word: וַתָּבוֹא הָאִשָּׁה אֶל כָּל הָעָם
  choice: 妇人便……去见众人
  rationale: בוא 可依叙事视角表示“来”或“去”；此处指妇人前往众人那里。“众人”保留 עָם 的宽泛所指，不擅自限定为军兵或城中居民。
- source_word: בְּחָכְמָתָהּ
  choice: 凭她的智慧
  rationale: 保留介词 בְּ 的凭借、方式意味，也维持原文对她以智慧行事的强调，避免把智慧具体解释成某项未明说的计策。
- source_word: וַיִּכְרְתוּ אֶת רֹאשׁ
  choice: 砍下……的头
  rationale: 准确表达 כרת 与“头”搭配时的斩首动作，中文直接自然。
- source_word: שֶׁבַע בֶּן בִּכְרִי
  choice: 比基利之子示巴
  rationale: 按现代中文圣经姓名惯例音译，并以“之子”明确保留希伯来文父系称谓结构。
- source_word: וַיַּשְׁלִכוּ אֶל יוֹאָב
  choice: 扔给约押
  rationale: שלך 表示投掷；介词 אֶל 表明方向，译为“扔给”符合此处动作和现代汉语表达。
- source_word: וַיִּתְקַע בַּשּׁוֹפָר
  choice: 约押吹响号角
  rationale: 动词的单数主语按近接上下文判定为约押；שׁוֹפָר 是用于发出信号的角号，译作“号角”比泛称“喇叭”更贴近器物。
- source_word: וַיָּפֻצוּ מֵעַל הָעִיר
  choice: 众人便从城下散去
  rationale: פוץ 表示分散离去；מֵעַל הָעִיר 在围城语境中指从围攻该城的位置撤离。“从城下”既自然，也比仅说“从城里”更准确。
- source_word: אִישׁ לְאֹהָלָיו
  choice: 各归自己的帐棚
  rationale: 贴近原文“各人回自己的帐棚”，同时以“各归”自然表达解散后返回各自住处的惯用语义。
- source_word: וְיוֹאָב שָׁב יְרוּשָׁלִַם אֶל הַמֶּלֶךְ
  choice: 约押也回到耶路撒冷，到王那里去了
  rationale: 保留“回耶路撒冷”和“到王那里”两个地点关系，不将后者弱化为仅仅“回王那里”。
