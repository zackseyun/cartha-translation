  text: and Sheva was secretary[a], and Zadok and Abiathar were priests.
translation:
  language: zh_hans
  text: 示法作书记官[a]；撒督和亚比亚他作祭司。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“书记”。这里的希伯来语可指王室书记或秘书；译作“书记官”，是为了表明这是一项行政官职。
    reason: lexical_alternative
lexical_decisions:
- source_word: שיא
  choice: 示法
  rationale: 按本节马所拉文本所见辅音形式直接音译此人名，不借平行名单擅自改成其他名称。
- source_word: סֹפֵר
  choice: 书记官
  rationale: 此词在王室行政语境中指负责文书的官员；“书记官”既保留“书记”的基本含义，也清楚表达其官职性质。
- source_word: צָדוֹק
  choice: 撒督
  rationale: 采用现代中文圣经读者熟悉的人名译法。
- source_word: אֶבְיָתָר
  choice: 亚比亚他
  rationale: 采用现代中文圣经读者熟悉的人名译法。
- source_word: כֹּהֲנִים
  choice: 祭司
  rationale: 该复数名词指承担祭司职分的人；汉语在“撒督和亚比亚他作祭司”中无需以形态标示复数。
- source_word: וְ
  choice: ；／和
  rationale: 希伯来语反复使用连接词串联名单；汉语以分号划分两个职务项目，并在两个人名之间用“和”，自然保留并列关系。
