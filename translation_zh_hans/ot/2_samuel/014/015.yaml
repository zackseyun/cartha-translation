  text: וְ֠/עַתָּה אֲשֶׁר בָּ֜אתִי לְ/דַבֵּ֨ר אֶל הַ/מֶּ֤לֶךְ אֲדֹנִ/י֙ אֶת הַ/דָּבָ֣ר הַ/זֶּ֔ה כִּ֥י יֵֽרְאֻ֖/נִי הָ/עָ֑ם וַ/תֹּ֤אמֶר שִׁפְחָֽתְ/ךָ֙ אֲדַבְּרָה נָּ֣א אֶל הַ/מֶּ֔לֶךְ אוּלַ֛י יַעֲשֶׂ֥ה הַ/מֶּ֖לֶךְ אֶת דְּבַ֥ר אֲמָתֽ/וֹ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/015.yaml
  text: And now I have come to speak this matter to my lord the king[a], because the people have frightened me. And your servant said, ‘Please let me speak to the king[b]; perhaps the king will do the word of his servant.’
translation:
  language: zh_hans
  text: “如今我来向我主我王禀告这件事，是因为百姓使我害怕。[a]婢女便说：‘请容我向王禀告；或许王会照婢女所说的去做。’[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “使我害怕”也可译作“使我惧怕”或“吓唬我”。原文动词在这里有使动含义，并不是说“百姓害怕我”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“行他婢女的话”，意为照婢女所说的去做；此处不必将“话”限定为某一具体请求。
    reason: clarification
lexical_decisions:
- source_word: וְעַתָּה
  choice: 现在
  rationale: 作为话语转换语，引出她对当前行动的解释；现代汉语中“现在”已能自然承接上文，无须机械译出连接词。
- source_word: אֲשֶׁר בָּאתִי לְדַבֵּר
  choice: 我来……禀告
  rationale: 保留“来”与说话目的；对君王说话用“禀告”，符合宫廷语境和说话者谦恭的口吻。
- source_word: אֶל הַמֶּלֶךְ אֲדֹנִי
  choice: 向我主我王
  rationale: 同时保留“我主”和“王”两个称谓，并采用自然、庄重的汉语次序。
- source_word: אֶת הַדָּבָר הַזֶּה
  choice: 这件事
  rationale: דבר在此指她向王陈述的案件或请求，译作“这件事”比字面的“这话”更符合现代汉语。
- source_word: כִּי יֵרְאֻנִי הָעָם
  choice: 是因为百姓使我害怕
  rationale: 按 ירא 的使动意义翻译，表明百姓令她惧怕，而不是百姓惧怕她。
- source_word: וַתֹּאמֶר שִׁפְחָתְךָ
  choice: 婢女心想
  rationale: 说话者以女性仆役身份自称；上下文中的“说”是对自己所作决定的内心表述，汉语译为“心想”更自然。
- source_word: אֲדַבְּרָה נָּא אֶל הַמֶּלֶךְ
  choice: 请容我向王禀告
  rationale: 以“请容我”表达祈愿式与 נָא 的礼貌、请求语气。
- source_word: אוּלַי
  choice: 或许
  rationale: 保留说话者的不确定和谦抑语气，语体也较庄重。
- source_word: יַעֲשֶׂה הַמֶּלֶךְ אֶת דְּבַר אֲמָתוֹ
  choice: 王会照婢女的话行
  rationale: 紧贴“王会行婢女的话”这一希伯来语表达，同时用“照……行”使汉语可懂；不擅自明确为“准许请求”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的宫廷陈述语体。“我主我王”“婢女”“禀告”体现对君王的谦恭，但避免过度古雅。原文先后使用两个意义相近的女性仆役词，均译为“婢女”，不人为制造区别。
