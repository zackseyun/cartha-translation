base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/026.yaml
  text: 'Whenever he cut the hair of his head—at the end of every year he would cut it[a], because it was heavy on him—when he cut it, he weighed the hair of his head: two hundred shekels by the king’s stone.'
translation:
  language: zh_hans
  text: 他每逢剪头发——每到年终[a]，他都要剪一次，因为头发压得他很重——剪下后，就称量剪下的头发；按王的标准砝码[b]计算，重二百舍客勒。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “每到年终”直译作“从一段日子的尽头到另一段日子的尽头”；这里指每年一次的规律间隔。
    reason: 说明希伯来语时间习语及其在本句语境中的用法。
  - marker: b
    text: 直译作“按王的石头”；“石头”指王室规定用作重量基准的砝码。
    reason: 保留 אֶבֶן（“石头”）的字面信息，并说明其作为标准砝码的文化含义。
lexical_decisions:
- source_word: וּבְגַלְּחוֹ אֶת רֹאשׁוֹ
  choice: 他每逢剪头发
  rationale: 介词加不定式引出时间情境；结合上下文表达反复发生的习惯。“剪头发”比直译“剃他的头”更符合现代汉语，也不暗示完全剃光。
- source_word: וְהָיָה מִקֵּץ יָמִים לַיָּמִים אֲשֶׁר יְגַלֵּחַ
  choice: 每年年终都要剪一次
  rationale: 这一希伯来语习语在此指有规律的年度间隔；“每年年终”清楚自然，同时保留“到一段日子的尽头”的时间意象。
- source_word: כִּי כָבֵד עָלָיו
  choice: 因为头发压得他很重
  rationale: 保留 כבד על 的“重压在……身上”意象，并明确代词所指的是头发；不擅自加强为“重得受不了”。
- source_word: וְגִלְּחוֹ וְשָׁקַל אֶת שְׂעַר רֹאשׁוֹ
  choice: 剪下之后，就称一称头发
  rationale: 自然呈现剪发后称量的时序；“称一称”也契合上下文所描述的惯常行为。
- source_word: מָאתַיִם שְׁקָלִים
  choice: 重二百舍客勒
  rationale: 舍客勒在这里是重量单位，并非货币；添加“重”可防止现代读者误解。
- source_word: בְּאֶבֶן הַמֶּלֶךְ
  choice: 按王室的重量标准
  rationale: אֶבֶן 字面为“石头”，此处指作为度量基准的砝码；正文传达其实际含义，字面信息置于脚注。
