  text: וַ/יֹּ֤אמֶר הַ/מֶּ֨לֶךְ֙ יִסֹּ֣ב אֶל בֵּית֔/וֹ וּ/פָנַ֖/י לֹ֣א יִרְאֶ֑ה וַ/יִּסֹּ֤ב אַבְשָׁלוֹם֙ אֶל בֵּית֔/וֹ וּ/פְנֵ֥י הַ/מֶּ֖לֶךְ לֹ֥א רָאָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/024.yaml
  text: But the king said[a], “Let him turn aside to his own house, and let him not see my face.” So Absalom turned aside to his own house and did not see the king’s face.
translation:
  language: zh_hans
  text: 王却说：“让他回自己的家去，不可见我的面[a]。”于是，押沙龙回自己的家去了，没有见王的面。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文“见我的面／见王的面”是指来到某人面前或获准觐见。
    reason: 说明希伯来语习语，同时保留正文的字面意象和前后重复。
lexical_decisions:
- source_word: יִסֹּב / וַיִּסֹּב（סבב）
  choice: 回……去 / 回……去了
  rationale: 此处动词与 אֶל בֵּיתוֹ 连用，表示押沙龙被转回自己的住处、不得进到王面前。译作“回……去”符合现代汉语表达，并在命令与执行两处保留重复。
- source_word: בֵּיתוֹ
  choice: 自己的家
  rationale: בַּיִת 的基本义为“房屋、家”；物主后缀在此自然译作“自己的”，并突出其住处与王所在之处的对照。
- source_word: וּפָנַי לֹא יִרְאֶה
  choice: 不可见我的面
  rationale: 保留“见面”这一具体的希伯来语表达及命令语气；“不可”体现王禁止押沙龙前来觐见。
- source_word: וּפְנֵי הַמֶּלֶךְ לֹא רָאָה
  choice: 没有见王的面
  rationale: 照应王先前的原话，保留原文重复“面”的修辞，而不在正文中直接释为“未获觐见”。
- source_word: וַיֹּאמֶר הַמֶּלֶךְ
  choice: 王却说
  rationale: 叙事连接词在上下文中带有转折：王虽然准许押沙龙回来，却仍拒绝见他。
- source_word: אַבְשָׁלוֹם
  choice: 押沙龙
  rationale: 采用现代中文圣经传统中通行的人名译法。
theological_decisions:
- issue: “见我的面／见王的面”应保留字面习语，还是直接解释为获准觐见
  choice: 正文保留“见……的面”
  alternative: 译作“不可到我面前”或“没有获准觐见王”
  rationale: 原文刻意在命令和执行中重复“面”，保留这一表达能维持叙事的呼应和被拒于王面前的张力；脚注说明其语用含义，避免正文过度解释。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“王却说”呈现上下文的轻微转折；“让他……不可……”适合王所下命令的语气。正文重复“自己的家”和“见……的面”，以对应希伯来文结构。
