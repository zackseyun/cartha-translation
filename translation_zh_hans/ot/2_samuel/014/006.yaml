base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/006.yaml
  text: And your servant had two sons[a], and the two of them fought in the field, and there was no one to separate them[b]; then the one struck the other and killed him.
translation:
  language: zh_hans
  text: 你的婢女有两个儿子[a]。他们两人在田间争斗，没有人从中解救[b]；其中一个击打另一个，杀死了他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “婢女”是女子在王面前谦卑的自称，也可译作“女仆”。
    reason: lexical_alternative
  - marker: b
    text: 直译为“他们中间没有解救者”；按语境，可能指没有人介入搭救或把他们分开。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְשִׁפְחָתְךָ
  choice: 你婢女
  rationale: שִׁפְחָה指女性仆役，也可用于女子在君王面前谦卑地自称；“你婢女”保留性别和恭敬语气，并符合本段宫廷语境。
- source_word: שְׁנֵי בָנִים
  choice: 两个儿子
  rationale: בָנִים在此明确指两个男性后代，不宜泛化为“两个孩子”。
- source_word: וַיִּנָּצוּ
  choice: 争斗
  rationale: נצה在此表示双方发生冲突；“争斗”既可涵盖争执，也与随后致命的击打自然衔接。
- source_word: בַּשָּׂדֶה
  choice: 在田间
  rationale: 直接表达地点，简洁自然。
- source_word: וְאֵין מַצִּיל בֵּינֵיהֶם
  choice: 没有人从中解救
  rationale: 较贴近מַצִּיל“解救者”的字面意义，同时“从中”对应בֵּינֵיהֶם，保留原文并未明确说明具体如何介入的表达。
- source_word: וַיַּכּוֹ הָאֶחָד אֶת הָאֶחָד
  choice: 一个击打另一个
  rationale: נכה常指击打；此译保留动作本身，不把它提前解释为特定方式的殴打。
- source_word: וַיָּמֶת אֹתוֹ
  choice: 把他打死了
  rationale: מות在此结构中表达使对方死亡的结果；结合前面的“击打”，现代汉语自然表达为“把他打死了”。
