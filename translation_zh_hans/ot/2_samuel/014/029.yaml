revisions:
- from: 押沙龙便派人去请约押来，好托他去见王；约押却不肯到他那里去。押沙龙又派人去请他，第二次请他来，他还是不肯来。
  to: 押沙龙便派人去请约押来，要约押带他去见王；约押却不肯到他那里去。押沙龙又第二次派人去请约押来，他还是不肯来。
  rationale: 修订首句以“要约押带他去见王”明确约押是受请求者、押沙龙是前往王那里的人，同时不具体规定约押如何促成此事。“又第二次”保留希伯来文עוֹד和שֵׁנִית并列造成的重复强调。第二次仅译“不肯来”，与原文第二处未重复“到他那里”的简略表达相称。
