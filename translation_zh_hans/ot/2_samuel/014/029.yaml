base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/029.yaml
  text: So Absalom sent for Joab to send him to the king[a], but he was not willing to come to him. So he sent again a second time, but he was not willing to come.
translation:
  language: zh_hans
  text: 押沙龙便派人去请约押来，要约押带他去见王；约押却不肯到他那里去。押沙龙又第二次派人去请约押来，他还是不肯来。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח אַבְשָׁלוֹם אֶל יוֹאָב
  choice: 押沙龙便派人去请约押来
  rationale: שׁלח אֶל在此结合后面的目的不定式，表示押沙龙派人向约押传话、请他前来；这样译比单说“派到约押那里”更符合现代汉语，同时未强化为正式“召见”。
- source_word: לִשְׁלֹחַ אֹתוֹ אֶל הַמֶּלֶךְ
  choice: 好托他去见王
  rationale: 原文代词“他”在语境中指押沙龙，意思是请约押促成押沙龙到王面前；汉语若直译“派他到王那里”容易误指约押，因此用“托他去见王”自然表达约押的中介作用。
- source_word: וְלֹא אָבָה לָבוֹא אֵלָיו
  choice: 约押却不肯到他那里去
  rationale: אָבָה意为“愿意、同意”，否定形式译作“不肯”，既保留意愿层面的含义，也符合现代叙事语体；补出“约押”以消除连续代词造成的歧义。
- source_word: וַיִּשְׁלַח עוֹד שֵׁנִית
  choice: 押沙龙又派人去请他，第二次请他来
  rationale: 同时体现עוֹד“又、再次”和שֵׁנִית“第二次”的重复强调；虽略有复沓，但与希伯来文的刻意重复相称。
- source_word: וְלֹא אָבָה לָבוֹא
  choice: 他还是不肯来
  rationale: “还是”呈现第二次邀请后结果不变，也保留原文重复的“不肯来”。
