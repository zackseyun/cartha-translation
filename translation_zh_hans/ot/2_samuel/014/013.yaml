- from: 妇人说：“你为什么竟谋划[a]这样的事，伤害上帝的子民呢？王说出这话，便如同有罪的人[b]，因为王没有把自己被放逐的人接回来。”
  to: 妇人说：“你为什么竟谋划[a]这样的事来对付上帝的子民呢？王说出这话，就如同有罪的人[b]，因王没有接回他那被放逐的人。”
  rationale: 修订仅处理原文未明说之结果和施事：以“来对付”代替“伤害”，保留计划针对上帝子民的含义；以“他那被放逐的人”代替含混的“自己被放逐的人”，保留单数、所属与被动，不在正文或脚注中断定由谁放逐。其余措辞维持原译对希伯来文比较语气、因果关系及庄重现代汉语语体的把握。
