base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/013.yaml
  text: Then the woman said[a], “Why then have you planned such a thing against the people of God? For in speaking this word, the king is like one who is guilty[b], because the king has not brought back his banished one.”
translation:
  language: zh_hans
  text: 妇人说：“你为什么竟谋划[a]这样的事来对付上帝的子民呢？王说出这话，就如同有罪的人[b]，因王没有接回他那被放逐的人。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “谋划”也可译作“思量”或“筹划”。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“王就像一个有罪的人”；意思是，王自己的判词表明，他没有召回他那被放逐的人，因而也落在这判词之下。
    reason: alternative_reading
lexical_decisions:
- source_word: חָשַׁבְתָּה
  choice: 谋划
  rationale: 该词可指思想、筹划或谋定；在妇人以比喻责问大卫的语境中，“谋划”既保留有意采取某种方针的意味，也不把动机说得过重。
- source_word: כָּזֹאת
  choice: 这样的事
  rationale: 指向前述比喻所揭示的同类行为；现代汉语自然，并保留责问语气。
- source_word: עַל עַם אֱלֹהִים
  choice: 伤害上帝的子民
  rationale: 介词 עַל 与 חָשַׁב 连用，在本语境中带有不利、敌对的指向；补出“伤害”使汉语关系清楚，同时保留“上帝的子民”这一群体称谓。
- source_word: וּמִדַּבֵּר הַמֶּלֶךְ הַדָּבָר הַזֶּה
  choice: 王说出这话
  rationale: מ 加不定词结构可表伴随或依据；简洁译法保留“王借着说这话而显出自身问题”的逻辑。
- source_word: כְּאָשֵׁם
  choice: 便如同有罪的人
  rationale: 保留前缀 כ 的比较意味，不直接强化为毫无限定的定罪宣告。
- source_word: לְבִלְתִּי
  choice: 因为……没有
  rationale: 此结构说明责问的根据；用因果句符合现代汉语表达。
- source_word: הָשִׁיב
  choice: 接回来
  rationale: שוב 的使役形在此指使被逐者回来；“接回来”具体、自然，也符合王可召回流亡者的处境。
- source_word: נִדְּחוֹ
  choice: 自己被放逐的人
  rationale: 被动分词表示被赶走或放逐的人，单数后缀表示与王的所属关系；此译保留单数和被动含义，不在正文中直接点名押沙龙。
theological_decisions:
- issue: “上帝的子民”的范围
  choice: 保留“上帝的子民”，不缩小为押沙龙一人
  alternative: 以色列；押沙龙和王室
  rationale: 希伯来文明确使用这一群体性、盟约性的称呼。上下文虽针对王处置被逐之子的做法，却把影响扩大到整个上帝的子民；译文不应消除这种修辞张力。
- issue: 王是否被直接宣告有罪
  choice: 保留“如同有罪的人”的比较表达
  alternative: 王就是有罪的；王因此显为有罪
  rationale: כְּאָשֵׁם 带有比较形式。妇人的意思是王自己的判词使他处于有罪者的位置，但译文保留原文并非最直接断言的措辞。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“竟”强化原问句的责问意味；“便如同有罪的人”刻意保留希伯来文的比较形式；正文不直接点名押沙龙，以维持妇人话语的概括性。
