source:
  edition: WLC
  text: וְ/הִנֵּה֩ קָ֨מָה כָֽל הַ/מִּשְׁפָּחָ֜ה עַל שִׁפְחָתֶ֗/ךָ וַ/יֹּֽאמְרוּ֙ תְּנִ֣י אֶת מַכֵּ֣ה אָחִ֗י/ו וּ/נְמִתֵ֨/הוּ֙ בְּ/נֶ֤פֶשׁ אָחִי/ו֙ אֲשֶׁ֣ר הָרָ֔ג וְ/נַשְׁמִ֖ידָה גַּ֣ם אֶת הַ/יּוֹרֵ֑שׁ וְ/כִבּ֗וּ אֶת גַּֽחַלְתִּ/י֙ אֲשֶׁ֣ר נִשְׁאָ֔רָה לְ/בִלְתִּ֧י שום לְ/אִישִׁ֛/י שֵׁ֥ם וּ/שְׁאֵרִ֖ית עַל פְּנֵ֥י הָ/אֲדָמָֽה־־׀־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/007.yaml
  text: And look[a], the whole family has risen up against your servant and said, ‘Give up the one who struck his brother, so that we may put him to death for the life of his brother whom he killed; and we will destroy the heir also.’ Thus they would quench my remaining ember[b], leaving my husband neither name nor remnant on the face of the earth.
translation:
  language: zh_hans
  text: 看哪，全族都起来反对你的婢女，对我说：‘把那击打自己兄弟的人交出来，好为他所杀的兄弟的性命处死他；连这继承人也要除灭。’这样，他们就会熄灭我仅存的余烬[a]，使我丈夫在世上既无名，也无后[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “仅存的余烬”也可译作“最后的火种”。原文用一块尚未熄灭的炭或余烬，比喻家族最后存留的后裔和希望。
    reason: lexical_alternative
  - marker: b
    text: “既无名，也无后”指丈夫的名字和家系无人延续，不只是说他的名声消失。
    reason: cultural_note
lexical_decisions:
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留话语中的提示和强调作用，采用庄重而仍为现代读者熟悉的表达。
- source_word: כָל הַמִּשְׁפָּחָה
  choice: 全族
  rationale: 此处指较广的亲族群体，不只是核心家庭；“全族”简洁地传达其集体范围。
- source_word: שִׁפְחָתֶךָ
  choice: 你的婢女
  rationale: 保留说话者的女性身份及其在王面前谦卑自称的语气。
- source_word: קָמָה ... עַל
  choice: 起来攻击
  rationale: 该结构表示敌对行动，并非单纯站起来；“起来攻击”在现代汉语中自然明确。
- source_word: תְּנִי
  choice: 交出来
  rationale: 语境是亲族要求妇人交出儿子，供他们处死；“交出来”准确表现强制移交。
- source_word: מַכֵּה אָחִיו
  choice: 那击打自己兄弟的人
  rationale: 保留 נכה 的较宽泛含义及原文叙述次序，不提前将其直接译作“杀兄弟的人”；后面的 אֲשֶׁר הָרָג 才明确他杀了兄弟。
- source_word: וּנְמִתֵהוּ בְּנֶפֶשׁ אָחִיו אֲשֶׁר הָרָג
  choice: 我们要因他所杀兄弟的性命处死他
  rationale: 保留以命偿命的司法语义，同时避免加入原文没有明说的制度性称谓。
- source_word: וְנַשְׁמִידָה גַּם אֶת הַיּוֹרֵשׁ
  choice: 也要把继承人一并除灭
  rationale: “继承人”准确表达 הַיּוֹרֵשׁ；“一并”体现 גַּם，且“除灭”保留行动的严重性。
- source_word: וְכִבּוּ אֶת גַּחַלְתִּי אֲשֶׁר נִשְׁאָרָה
  choice: 他们就会熄灭我仅存的炭火
  rationale: 保留原文以仅存炭火比喻家族最后后裔和希望的鲜明意象，而不在正文中将其扁平化为抽象解释。
- source_word: לְבִלְתִּי שׂוּם לְאִישִׁי שֵׁם וּשְׁאֵרִית
  choice: 使我丈夫……既无名，也无后
  rationale: 将目的或结果关系自然译出；“无名、无后”简洁表达丈夫的名号与存留后裔都将断绝。
- source_word: עַל פְּנֵי הָאֲדָמָה
  choice: 在世上
  rationale: 这是该空间表达在现代汉语中的自然对应，并符合此处家名与后裔从人世消失的语境。
theological_decisions:
- issue: 亲族处死幸存儿子的动机
  choice: 按原文保留“为兄弟的性命处死他”与“除灭继承人”并列
  alternative: 将整句话明确解释为合法的血仇执行，或解释为夺取产业的阴谋
  rationale: 经文的话语同时带有偿命语言和消灭继承人的意图；译文不替叙事裁定其法律正当性或隐藏动机。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。王前自称译作“你的婢女”，既显明说话者为女性，也保留谦卑语气；引语中的命令和威胁保持直接有力。所有脚注标记均置于相应正文意象之后。
