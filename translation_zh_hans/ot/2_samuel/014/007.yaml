    issue: “起来攻击”可能把敌对行动窄化为肢体攻击。
    rationale: קָמָה עַל 表示起来反对、敌对；本节随后的言语是施压交出儿子，未明确描述实际攻击。
  - severity: medium
    issue: “因他所杀兄弟的性命处死他”语法关系不够清晰。
    rationale: 应补出“他所杀的兄弟”，并使“为……的性命”这一以命偿命的关系可直接理解。
  - severity: low
    issue: “炭火”可更贴近地表为“余烬”。
    rationale: גַּחֶלֶת指一块仍带火的炭、余烬；“仅存的余烬”在现代汉语中自然，也保留家系最后希望的意象。
