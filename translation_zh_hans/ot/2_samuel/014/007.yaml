revisions:
- from: 看哪，全族都起来攻击你的婢女，对我说：‘把那击打自己兄弟的人交出来！我们要因他所杀兄弟的性命处死他，也要把继承人一并除灭。’这样，他们就会熄灭我仅存的炭火[a]，使我丈夫在世上既无名，也无后[b]。
  to: 看哪，全族都起来反对你的婢女，对我说：‘把那击打自己兄弟的人交出来，好为他所杀的兄弟的性命处死他；连这继承人也要除灭。’这样，他们就会熄灭我仅存的余烬[a]，使我丈夫在世上既无名，也无后[b]。
  rationale: 修订避免将亲族的敌对举动限定为实际攻击，理顺以命偿命分句的汉语语法，并以“余烬”更贴近原文的单数炭火意象。其余内容保留原译的叙事语气、法律性措辞和未裁定亲族动机的表述。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T05:27:28Z'
review_pass:
  verdict: revise
  source_fidelity: 译文整体忠实呈现了亲族的敌对要求、以命偿命的措辞、消灭继承人的意图，以及“仅存炭火”的家系意象。惟“起来攻击”较容易限定为实际肢体攻击，而原文在此涵盖亲族集体起来敌对、施压的行动；处死缘由一句也需补足结构，使“被他杀死的兄弟”与“为其性命”之间的关系清楚可读。
  naturalness: “因他所杀兄弟的性命处死他”在现代汉语中缺少“的”，语法关系略显滞涩。改为“为他所杀的兄弟的性命处死他”既保留原文较贴近的“为……的性命”，也更通顺。
  terminology: “你的婢女”准确保留女性谦称；“全族”“继承人”“除灭”“既无名，也无后”均与原文语义和庄重叙事语体相称。“余烬”比“炭火”更直接对应单数的 גַּחֶלֶת（仍燃的炭/余烬），并保留原有比喻。
  issues:
