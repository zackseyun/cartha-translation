base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/009.yaml
  text: Then the woman from Tekoa said to the king[a], “On me, my lord the king, be the guilt, and on my father’s house; but the king and his throne are innocent.”
translation:
  language: zh_hans
  text: 提哥亚的妇人对王说：“我主我王啊，罪责归在我和我父家身上；王和王位却是清白的[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “罪责”也可译作“罪孽”或“责任”；希伯来语这个词可指过错、罪责，或由此产生的责任与后果。
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאִשָּׁה הַתְּקוֹעִית
  choice: 提哥亚的妇人
  rationale: 以地名表明妇人的来处，既准确又符合现代汉语表达。
- source_word: עָלַי
  choice: 归在我……身上
  rationale: 保留原文前置所表达的强调，并以自然汉语传达主动承担责任之意。
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: 我主我王啊
  rationale: 保留宫廷语境中的恭敬称呼，同时使用庄重而可懂的现代汉语。
- source_word: הֶעָוֺן
  choice: 罪责
  rationale: 该词可指罪孽、罪责或由罪产生的责任与后果；本节是司法责任语境，“罪责”能保留其语义幅度。
- source_word: וְעַל בֵּית אָבִי
  choice: 和我父家身上
  rationale: “父家”保留希伯来语家族及宗族范围，不将其泛化为一般意义的家庭。
- source_word: וְהַמֶּלֶךְ וְכִסְאוֹ
  choice: 王和王位却
  rationale: “却”自然表达上下句的隐含对比；“王位”保留宝座作为王权及王室统治之转喻。
- source_word: נָקִי
  choice: 是清白的
  rationale: 在司法语境中表示不承担相关罪责，并不暗示王在一切方面都毫无过错。
theological_decisions:
- issue: 对王及其王位的免责表述
  choice: 王和王位却是清白的
  alternative: 王和王位却没有罪责
  rationale: “清白”保留原文司法性的免责含义，而不扩展为对王整体道德状态的神学判断。
translation_notes:
  register: 采用庄重、自然的现代标准汉语。“我主我王啊”保留宫廷敬语；分号呈现妇人承担罪责与王权获免责之间的鲜明对照。
