  yaml_path: translation/ot/2_samuel/014/001.yaml
  text: Joab son of Zeruiah knew that the king’s heart was toward Absalom[a].
translation:
  language: zh_hans
  text: 约押，洗鲁雅的儿子，知道王的心向着押沙龙[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“王想念押沙龙。”原文措辞简略，也可较笼统地理解为“王的心在押沙龙身上”。有人理解为负面的意思：“王的心敌视押沙龙”；不过，下文较支持正面的倾向。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּדַע
  choice: 知道
  rationale: ידע的叙事性未完成式在此推进叙事；译作“知道”自然直接，不另加原文没有的显式时间词。
- source_word: יוֹאָב בֶּן צְרֻיָה
  choice: 洗鲁雅的儿子约押
  rationale: 按现代汉语自然语序表达亲属关系，并采用通行的圣经人名译法。
- source_word: כִּי
  choice: （不单独译出）
  rationale: 此处引出约押所知道的内容；汉语可直接以宾语从句承接，无须机械译出连接词。
- source_word: לֵב הַמֶּלֶךְ
  choice: 王的心
  rationale: 保留希伯来语以“心”表示内在倾向、意愿或感情的表达，避免窄化为“想法”。
- source_word: עַל
  choice: 转向了
  rationale: 该介词与“心”组成简略且有一定歧义的表达。“转向了”保留朝向某人的意象，同时不在正文中明确限定为思念、偏爱或敌对。
- source_word: אַבְשָׁלוֹם
  choice: 押沙龙
  rationale: 采用现代中文圣经传统中通行的人名音译。
theological_decisions:
- issue: 王对押沙龙的内在态度具有歧义
  choice: 王的心转向了押沙龙
  alternative: 王想念押沙龙；王的心与押沙龙为敌
  rationale: 原文只说王的心“在／向着”押沙龙，未明说其态度是思念、关切还是敌意。正文保留方向性表达；脚注列出较具体的理解，并说明下文语境较支持正面倾向。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。正文保留“王的心”这一源语意象，并用“转向”维持原文的简略与张力；脚注交代主要备选理解。
