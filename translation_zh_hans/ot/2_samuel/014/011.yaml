  text: וַ/תֹּאמֶר֩ יִזְכָּר נָ֨א הַ/מֶּ֜לֶךְ אֶת יְהוָ֣ה אֱלֹהֶ֗י/ךָ מ/הרבית גֹּאֵ֤ל הַ/דָּם֙ לְ/שַׁחֵ֔ת וְ/לֹ֥א יַשְׁמִ֖ידוּ אֶת בְּנִ֑/י וַ/יֹּ֨אמֶר֙ חַי יְהוָ֔ה אִם יִפֹּ֛ל מִ/שַּׂעֲרַ֥ת בְּנֵ֖/ךְ אָֽרְצָ/ה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/011.yaml
  text: Then she said[a], “Please let the king remember Yahweh your God, so that the avenger of blood may not continue to destroy, and they may not destroy my son.” And he said, “As Yahweh lives[b], not one hair of your son shall fall to the ground.”
translation:
  language: zh_hans
  text: 她说：“求王顾念雅威—你的上帝，使报血仇者[a]不得再施行毁灭，免得他们杀害我的儿子。”王说：“我指着永活的雅威起誓，你儿子连一根头发也不会落在地上。[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “报血仇者”指死者的近亲；按当时的亲属责任，他有责任为被杀的亲人追讨血债。也可译作“血仇报复者”。
    reason: 说明 גֹּאֵל הַדָּם 的法律文化含义及可行译法。
  - marker: b
    text: 希伯来原文采用誓言中的强烈否定句式，直译近似“雅威是永活的，若你儿子的一根头发落在地上……”，意思是王保证他会得到完全保护。
    reason: 解释 חַי יְהוָה 与 אִם 引出的希伯来誓言习语。
lexical_decisions:
- source_word: יִזְכָּר נָא
  choice: 求王顾念
  rationale: 祈愿式配合 נָא 表达恭敬而恳切的请求；“求王”自然体现对君王的敬语，“顾念”既保留“记念”的核心，也传达因记念而采取行动的语境含义。
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: 雅威你的上帝
  rationale: 直接呈现神名 יְהוָה 为“雅威”，并保留第二人称所属关系“你的上帝”，突出妇人诉诸王在雅威面前的责任。
- source_word: מֵהַרְבּוֹת גֹּאֵל הַדָּם לְשַׁחֵת
  choice: 阻止报血仇的人再添杀戮
  rationale: מן 加 רבה 的使役式不定词表达制止进一步增添破坏；“再添杀戮”保留“增多、加添”的语义，又符合现代汉语。
- source_word: גֹּאֵל הַדָּם
  choice: 报血仇的人
  rationale: 这是以亲属身份追讨血债者的法律文化称谓；此译法比生硬的“血仇报复者”自然，同时保留其职能。
- source_word: וְלֹא יַשְׁמִידוּ אֶת־בְּנִי
  choice: 免得他们灭绝我的儿子
  rationale: 保留原文复数动词所指的未明群体，不把执行报复者过度限定为一个人；“灭绝”体现 שׁמד 的彻底毁灭意味。
- source_word: חַי יְהוָה
  choice: 我指着永活的雅威起誓
  rationale: 将希伯来语标准起誓公式转化为自然庄重的现代汉语，同时明确其言语功能。
- source_word: אִם יִפֹּל מִשַּׂעֲרַת בְּנֵךְ אָרְצָה
  choice: 你儿子连一根头发也不会落在地上
  rationale: 在誓言之后，אִם 构成强烈否定；保留“一根头发落地”的希伯来习语和完全保护的强调意味。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；音译“雅威”呈现其专名性质，不以称号替代，也不采用较晚形成的混合读音。
- issue: 王的保证是否表达绝对保护
  choice: 保留“一根头发也不会落在地上”的绝对誓言措辞
  alternative: 意译为“你儿子绝不会受到伤害”
  rationale: 原文以誓言和身体意象作出强烈保证；保留意象可维持叙事张力，不额外界定保证的法律范围或后续实现方式。
translation_notes:
  register: 采用庄重、清晰的现代标准汉语。妇人的请求保留恭敬语气，王的答复保持正式誓言的力度；对古代法律术语以正文自然表达、脚注补充文化背景。
