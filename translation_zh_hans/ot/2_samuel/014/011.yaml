  to: 她说：“求王顾念雅威—你的上帝，使报血仇者[a]不得再施行毁灭，免得他们杀害我的儿子。”王说：“我指着永活的雅威起誓，你儿子连一根头发也不会落在地上。[b]”
  rationale: 修订仅改善源语语义的边界与现代汉语搭配：以“再施行毁灭”保留 מֵהַרְבּוֹת…לְשַׁחֵת 所含进一步毁灭的意思，不擅自具体化为“添杀戮”；以“杀害”自然表达本段血仇语境中对儿子的致命威胁。其余关键术语、誓言力度、复数施事者的模糊性和全部脚注锚点均予保留。
