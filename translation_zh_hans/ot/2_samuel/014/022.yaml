source:
  edition: WLC
  text: וַ/יִּפֹּל֩ יוֹאָ֨ב אֶל פָּנָ֥י/ו אַ֛רְצָ/ה וַ/יִּשְׁתַּ֖חוּ וַ/יְבָ֣רֶךְ אֶת הַ/מֶּ֑לֶךְ וַ/יֹּ֣אמֶר יוֹאָ֡ב הַ/יּוֹם֩ יָדַ֨ע עַבְדְּ/ךָ֜ כִּי מָצָ֨אתִי חֵ֤ן בְּ/עֵינֶ֨י/ךָ֙ אֲדֹנִ֣/י הַ/מֶּ֔לֶךְ אֲשֶׁר עָשָׂ֥ה הַ/מֶּ֖לֶךְ אֶת דְּבַ֥ר עבד/ו־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/022.yaml
  text: Then Joab fell with his face to the ground[a], bowed down, and blessed the king. Joab said, “Today your servant knows that I have found favor in your eyes, my lord the king, because the king has done the word of his servant.”
translation:
  language: zh_hans
  text: 约押就俯伏在地，向王下拜，为王祝福。他说：“今天仆人知道，我在我主我王眼中蒙了恩，因为王成全了仆人的请求[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译：“照仆人的话做了。”
    reason: 保留希伯来语惯用表达的字面形式；正文按上下文译出王应允约押请求的含义。
lexical_decisions:
- source_word: וַיִּפֹּל ... אֶל־פָּנָיו אַרְצָה
  choice: 俯伏在地
  rationale: 这一希伯来语表达描写面朝地伏下的姿势；“俯伏在地”在现代汉语中自然、庄重，也保留了身体动作。
- source_word: וַיִּשְׁתַּחוּ
  choice: 向王下拜
  rationale: 此处是在君王面前表示敬意的宫廷礼节；“下拜”既传达屈身致敬，也避免误解为把君王当作神来敬拜。
- source_word: וַיְבָרֶךְ אֶת־הַמֶּלֶךְ
  choice: 为王祝福
  rationale: 保留ברך的基本意义。上下文含有感激与尊敬，但译作“感谢”会缩窄原词含义。
- source_word: יָדַע עַבְדְּךָ
  choice: 仆人知道
  rationale: 完成式在这里表达因刚发生之事而得到的当前确认；汉语“今天……知道”足以传达这一语气。
- source_word: עַבְדְּךָ
  choice: 仆人
  rationale: 这是臣子对君王自称的谦辞，并不着重说明奴隶身份；译作“仆人”符合汉语宫廷语境。
- source_word: מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: 我在……眼前蒙了恩
  rationale: 保留希伯来语“在你眼中找到恩宠”的意象，同时采用现代中文圣经语体中清楚自然的表达。
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: 我主我王
  rationale: 兼顾אֲדֹנִי的尊称与הַמֶּלֶךְ的身份称谓，以简洁庄重的汉语表达宫廷礼貌。
- source_word: אֲשֶׁר
  choice: 因为
  rationale: 该关系词在此引出约押得知自己蒙恩的依据，按因果关系译为“因为”最为自然。
- source_word: עָשָׂה ... אֶת־דְּבַר עַבְדּוֹ
  choice: 成全了仆人的请求
  rationale: 原文字面是“照仆人的话做了”，在上下文中指王答应并实行了约押的请求。“成全了……请求”清楚表达语境意义，脚注保留字面形式。
theological_decisions:
- issue: 对人间君王所行礼仪的措辞
  choice: 译作“向王下拜”和“我主我王”，表达臣下对君王的尊敬而不将动作神圣化。
  alternative: 译作“敬拜王”或将“主”解释为神性称号。
  rationale: 上下文描述宫廷礼仪，不是在断言对君王进行宗教敬拜；译文保留尊敬语气，但不加入原文没有的神学含义。
- issue: “祝福王”的含义
  choice: 保留“为王祝福”。
  alternative: 按语境具体化为“感谢王”或“称颂王”。
  rationale: ברך在这里可含感谢、称颂的语用色彩，但原文仍使用“祝福”一词；保留较宽的表达可避免过早消除其语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“俯伏在地”“下拜”“我主我王”保留宫廷场景的礼仪色彩；避免古奥的文言句式，也避免把对君王的礼敬表述为宗教敬拜。
