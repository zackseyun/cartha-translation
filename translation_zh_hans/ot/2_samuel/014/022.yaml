    issue: “在我主我王眼前蒙了恩”
    rationale: 原文בְּעֵינֶיךָ直译为“在你眼中”，是“得到你的恩待／在你看来蒙恩”的惯用表达；“眼前”在汉语通常表示空间位置或当下情景，容易改变原意。应改为“在我主我王眼中蒙了恩”。
