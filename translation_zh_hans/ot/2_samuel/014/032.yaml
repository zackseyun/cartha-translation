  to: 押沙龙对约押说：“你看，我曾派人传话给你，说：‘到这里来，我好派你到王那里去，对他说：“我为什么从基述来呢？我还在那里的话，倒更好。”’如今，让我见王一面；如果我有罪，就让他处死我吧。”
