  text: וַ/יֹּ֣אמֶר אַבְשָׁל֣וֹם אֶל יוֹאָ֡ב הִנֵּ֣ה שָׁלַ֣חְתִּי אֵלֶ֣י/ךָ לֵ/אמֹ֡ר בֹּ֣א הֵ֠נָּה וְ/אֶשְׁלְחָה֩ אֹתְ/ךָ֨ אֶל הַ/מֶּ֜לֶךְ לֵ/אמֹ֗ר לָ֤/מָּה בָּ֨אתִי֙ מִ/גְּשׁ֔וּר ט֥וֹב לִ֖/י עֹ֣ד אֲנִי שָׁ֑ם וְ/עַתָּ֗ה אֶרְאֶה֙ פְּנֵ֣י הַ/מֶּ֔לֶךְ וְ/אִם יֶשׁ בִּ֥/י עָוֺ֖ן וֶ/הֱמִתָֽ/נִי־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/032.yaml
  text: Absalom said to Joab[a], “Look, I sent word to you, saying, ‘Come here, so that I may send you to the king, to say, “Why have I come from Geshur? It would be better for me still to be there.”’ Now then, let me see the king’s face; and if there is guilt in me[b], let him put me to death.”
translation:
  language: zh_hans
  text: 押沙龙对约押说：“你看，我曾派人传话给你，说：‘到这里来，我好派你到王那里去，对他说：“我为什么从基述来呢？我还在那里的话，倒更好。”’如今，让我见王一面；如果我有罪，就让他处死我吧。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: 你看
  rationale: 用现代汉语自然的提示语保留原文引人注意的语气。
- source_word: שָׁלַחְתִּי אֵלֶיךָ
  choice: 我曾派人去请你来
  rationale: 此处指派人传话召约押前来；译出汉语中自然隐含的使者，但不把约押误作被差遣的对象。
- source_word: בֹּא הֵנָּה
  choice: 到这里来
  rationale: 直接保留命令语气和方位指示。
- source_word: וְאֶשְׁלְחָה אֹתְךָ אֶל הַמֶּלֶךְ
  choice: 我好派你去见王
  rationale: “好”自然表达召约押前来的目的；“去见王”符合上下文，并未改变差遣的含义。
- source_word: לָמָּה בָּאתִי מִגְּשׁוּר
  choice: 我为什么从基述回来呢
  rationale: 原文是第一人称主动式“我来”，不是“被带回来”；中文“回来”自然表达从流亡地返回当前所在地。
- source_word: טוֹב לִי עוֹד אֲנִי שָׁם
  choice: 我还在那里倒更好
  rationale: 保留“还在那里”的明确成分，并以简洁中文补足希伯来文省略的比较意味。
- source_word: וְעַתָּה
  choice: 如今
  rationale: 表达从抱怨转向要求的时间性转折，不添加因果关系。
- source_word: אֶרְאֶה פְּנֵי הַמֶּלֶךְ
  choice: 让我见王的面
  rationale: 保留“见王的面”这一希伯来语意象，同时中文仍可理解为获准觐见王。
- source_word: עָוֺן
  choice: 罪
  rationale: 该词可指罪孽及由此而来的罪责；在王可能处死押沙龙的司法语境中，“罪”简洁而自然。
- source_word: וֶהֱמִתָנִי
  choice: 让他把我处死吧
  rationale: 准确表达使役式“使我死”，语气庄重，也保留押沙龙提出接受王裁决的意味。
theological_decisions:
- issue: עָוֺן兼有“罪孽”与“罪责”的语义范围
  choice: 正文译作“罪”
  alternative: 罪责
  rationale: “罪”在现代汉语中可同时涵盖所犯之错与应负责任，避免把原文仅限缩为主观道德状态或正式法律判罪。
translation_notes:
  register: 采用现代、庄重而口语可懂的叙事语言。押沙龙的话保留直率而带挑战性的语气；嵌套引语层次清楚。脚注标记已按其实际所解释的词句放置，而非沿用咨询文本中明显错位的标记。
