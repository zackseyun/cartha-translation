base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/030.yaml
  text: Then he said to his servants[a], “Look, Joab’s field is next to mine, and he has barley there. Go and set it on fire.” So Absalom’s servants set the field on fire.
translation:
  language: zh_hans
  text: 他对自己的仆人说：“你们看，约押的田地就在我田地旁边[a]，那里有大麦。去，把它放火烧掉。”于是，押沙龙的仆人放火烧了那块田。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“在我手边”，这里是说约押的田地与押沙龙的田地相邻。
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶלְקַת
  choice: 田地／那块田
  rationale: 这里指约押所有、种植大麦的一块耕地；“田地”符合现代汉语叙事习惯，后句用“那块田”自然回指。
- source_word: אֶל יָדִי
  choice: 挨着我的
  rationale: 该短语字面与“手边”有关，在描述土地位置时表示相邻；“挨着我的”既自然，又明确指约押的田与押沙龙的田相邻。
- source_word: שְׂעֹרִים
  choice: 大麦
  rationale: 复数形式在此指田里种植的大麦作物，现代汉语通常用集合性名词“大麦”。
- source_word: וְהוּצִיתִהָ / וַיַּצִּתוּ
  choice: 放火烧了
  rationale: 动词表示点燃、使之着火；命令和执行句采用同一表达，以保留原文的词语呼应。
- source_word: עֲבָדָיו / עַבְדֵי אַבְשָׁלוֹם
  choice: 自己的仆人／押沙龙的仆人
  rationale: עבד 可指仆人或奴仆；本节重点是他们奉命行事，并未突出其法律身份，因此译作中性的“仆人”。
- source_word: רְאוּ
  choice: 你们看
  rationale: 复数命令式用于引起众仆人的注意；“你们看”符合现代汉语直接引语。
- source_word: לְכוּ
  choice: 去
  rationale: 简洁保留复数命令式所表达的行动指令；汉语无需另行标明复数。
