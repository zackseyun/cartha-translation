  yaml_path: translation/ot/2_samuel/014/010.yaml
  text: And the king said[a], “Whoever speaks to you, bring him to me, and he will never touch you again.”
translation:
  language: zh_hans
  text: 王说：“谁对你说话，就把谁带到我这里来；他再也不会碰你[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “碰你”也可理解为“伤害你”；这里的希伯来语可能指带有敌意的接触或侵害，并非只是身体上的触碰。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמֶּלֶךְ
  choice: 王
  rationale: 保留定冠词所指的特定君王；在本段上下文中，现代汉语自然用“王”，不必重复加“那位”。
- source_word: הַמְדַבֵּר אֵלַיִךְ
  choice: 无论谁对你说什么
  rationale: 带冠词的分词作名词用，直译为“对你说话的人”；结合王向妇人作开放式保证的语境，“无论谁对你说什么”更自然，也体现任何人若出言为难她的含义。
- source_word: וַהֲבֵאתוֹ אֵלַי
  choice: 你都把他带到我这里来
  rationale: בוא 的使役形表达“使他来到”，即“带来”；宾语代词译作“他”，并用“都”承接前面的无定范围。
- source_word: לֹא יֹסִיף עוֹד
  choice: 不会再
  rationale: יסף 与 עוד 连用，表示某行动不再继续或重复；“不会再”简洁自然，并保留将来保证的语气。
- source_word: לָגַעַת בָּךְ
  choice: 碰你
  rationale: נגע 的基本义是“触碰”；本处语境可能包含骚扰、攻击或伤害，正文保留较为直译且有相同语用延伸的“碰”，不将具体伤害方式写死。
