  to: 因为王必垂听，救他的婢女[a]脱离那人的手；那人企图把我和我儿子一同从上帝的产业中除灭[b]。
  rationale: 仅将“听从”改为“垂听”，以纠正现代汉语中可能造成的关系语义偏移；并将“想”调整为“企图”，更明确表达不定式所示的敌对目的。其余保留原译的结构、语体、性别信息和“上帝的产业”的解释开放性。
