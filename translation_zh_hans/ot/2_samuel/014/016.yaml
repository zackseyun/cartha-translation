base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/016.yaml
  text: For the king will hear[b][a], to deliver his servant from the hand of the man who would destroy me and my son together from the inheritance of God.
translation:
  language: zh_hans
  text: 因为王必垂听，救他的婢女[a]脱离那人的手；那人企图把我和我儿子一同从上帝的产业中除灭[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “婢女”原文为阴性，是妇人在王面前自谦的称呼。
    reason: lexical_alternative
  - marker: b
    text: “上帝的产业”可能指上帝在以色列中所赐的产业份额；也可能指属于上帝的产业。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上一节，说明妇人之所以对王怀有指望的理由；现代汉语用“因为”自然保留其解释作用。
- source_word: יִשְׁמַע
  choice: 必会听从
  rationale: שׁמע在此不只是听见，更含听取请求并作出回应之意；“听从”符合宫廷陈情的语境。
- source_word: לְהַצִּיל
  choice: 救……脱离
  rationale: נצל的使役式表示从危险或权势下搭救出来；“救……脱离”既贴近原文，也符合现代汉语表达。
- source_word: אֲמָתוֹ
  choice: 他的婢女
  rationale: 原词为阴性，且是妇人在王前自谦的称呼；“婢女”保留性别与宫廷语体。
- source_word: מִכַּף הָאִישׁ
  choice: 脱离那人的手
  rationale: 保留希伯来语以“手”表示权势或控制的意象，同时中文也可自然理解。
- source_word: לְהַשְׁמִיד
  choice: 那人想……除灭
  rationale: 该不定式表达那人的敌对目的；“想……除灭”清楚呈现意图，并保留强烈的毁灭意味。
- source_word: יַחַד
  choice: 一同
  rationale: 强调母子两人将同时遭害，“一同”简洁自然。
- source_word: מִנַּחֲלַת אֱלֹהִים
  choice: 从上帝的产业中
  rationale: נחלה可指所分得的地业、承受之分或产业；此处保留“上帝的产业”这一开放表达，不把它限缩为土地、以色列民或家族继承权中的某一种。
theological_decisions:
- issue: “上帝的产业”的所指
  choice: 正文保留“上帝的产业”这一属格结构
  alternative: 译作“上帝所赐的产业”或“上帝自己的产业”
  rationale: 上下文涉及家系灭绝及在以色列中失去承受之分，但希伯来语属格本身可以指上帝所赐的产业，也可以指属于上帝的产业。正文不替原文消除这一张力，脚注说明主要可能性。
translation_notes:
  register: 采用现代、庄重而易懂的宫廷陈情语体。“他的婢女”照应妇人以第三人称对王自称的原文方式；分号使“那人”的毁灭意图关系清楚。所有脚注标记均已置于正文。
