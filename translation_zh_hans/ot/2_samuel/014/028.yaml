  text: So Absalom lived in Jerusalem for two years[a], and he did not see the king's face.
translation:
  language: zh_hans
  text: 押沙龙在耶路撒冷住了整整两年，未得见王[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“他没有见王的面”。这里的希伯来语表达指未能亲自见到王，或未获王接见。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: 住了
  rationale: ישׁב在此表示持续居住；“住了”符合现代汉语叙事习惯，并保留其延续意味。
- source_word: אַבְשָׁלוֹם
  choice: 押沙龙
  rationale: 采用现代中文圣经中通行的人名译法。
- source_word: בִּירוּשָׁלִַם
  choice: 在耶路撒冷
  rationale: 按地点介词短语直译，并采用通行地名译法。
- source_word: שְׁנָתַיִם יָמִים
  choice: 整整两年
  rationale: 该希伯来语时间表达直译近似“两年，日子”，表示足数的两年；“整整两年”自然传达这一时段的完整性。
- source_word: וּפְנֵי הַמֶּלֶךְ
  choice: 王的面
  rationale: 保留希伯来语具体表达“王的面”，同时用脚注说明其在宫廷语境中可指亲自觐见或接近王。
- source_word: לֹא רָאָה
  choice: 一直没有见
  rationale: 原文为“没有见”；结合前面的两年时段，加“一直”自然表达这种状态贯穿整个期间，而不改变否定含义。
