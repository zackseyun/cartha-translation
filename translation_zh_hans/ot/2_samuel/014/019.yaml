base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/019.yaml
  text: Then the king said[a], “Is the hand of Joab with you in all this?” And the woman answered and said, “As your soul lives, my lord the king, no one can turn to the right or to the left from anything that my lord the king has spoken, for your servant Joab himself commanded me[b], and he himself put all these words into the mouth of your female servant.”
translation:
  language: zh_hans
  text: 王问：“这一切事，约押也参与其中吗？”妇人回答说：“我主我王，我指着你的性命起誓[a]：谁也不能偏离我主我王所说的一切话，向右或向左都不能[b]。因为吩咐我的正是你仆人约押；也是他把这一切话放在你婢女口中的。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这个希伯来语誓言套语字面意思是“你的性命活着”，也可译为“我主我王，凭你的性命起誓”。
    reason: lexical_alternative
  - marker: b
    text: “向右或向左偏离”是希伯来语习语，表示偏离、反驳或回避王所说的话。
    reason: cultural_note
lexical_decisions:
- source_word: הֲיַד יוֹאָב אִתָּךְ
  choice: 约押是不是也参与了
  rationale: 希伯来语直译为“约押的手是否与你同在”，其中“手”表示介入、策划或施加影响。中文若直译为“约押的手”容易造成误解，因此译出其语用含义，同时保留问句中对约押参与此事的追查。
- source_word: בְּכָל זֹאת
  choice: 这一切事
  rationale: 指妇人此前整套陈述和安排；“这一切事”简洁自然，也保留了原文概括性的指向。
- source_word: חֵי נַפְשְׁךָ
  choice: 我指着你的性命起誓
  rationale: 这是正式的起誓套语，字面为“你的性命活着”。译文明确表达其誓言功能，字面形式则在脚注中说明。
- source_word: אִם אִישׁ לְהֵמִין וּלְהַשְׂמִיל
  choice: 谁也不能偏右偏左
  rationale: 原文以否定誓言句式表达“无人能够”，并保留“向右、向左”的方向比喻，表示无法偏离、反驳或回避王所说的话。
- source_word: עַבְדְּךָ יוֹאָב
  choice: 你仆人约押
  rationale: 这里是宫廷语境中对王臣属的称呼，“仆人”比“奴隶”更符合其身份和语用。
- source_word: צִוָּנִי
  choice: 吩咐我
  rationale: 该动词表示有权柄地命令；“吩咐”既体现约押的主导地位，也符合现代汉语叙事语体。
- source_word: שָׂם בְּפִי שִׁפְחָתְךָ
  choice: 把……放在你婢女口中
  rationale: 保留希伯来语“放在口中”的生动表达，表示约押把要说的话授给妇人；“婢女”准确保留女性自称及宫廷中的谦卑语气。
- source_word: אֵת כָּל הַדְּבָרִים הָאֵלֶּה
  choice: 这一切话
  rationale: 上下文强调约押给妇人安排了具体言辞，因此译为“话”比宽泛的“事情”更准确。
