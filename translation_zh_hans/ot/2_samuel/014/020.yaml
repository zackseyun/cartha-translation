base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/020.yaml
  text: In order to change the course of the matter[a], your servant Joab did this thing. But my lord is wise, with the wisdom of the angel of God[b], to know all that is in the land.
translation:
  language: zh_hans
  text: 为要改变这事的面貌，你的仆人约押做了这件事。但我主有智慧，如上帝的使者那样有智慧，能知道境内的一切[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: “境内”也可译作“地上的一切”。按上下文，这里很可能指国境之内，而非整个世界。
    reason: lexical_alternative
lexical_decisions:
- source_word: לְבַעֲבוּר
  choice: 为要
  rationale: 此处引出约押行动的目的；“为要”简洁而自然地表达目的关系。
- source_word: סַבֵּב אֶת־פְּנֵי הַדָּבָר
  choice: 使这事改换面貌
  rationale: 保留希伯来语“转变这事之面”的形象，同时表达改变事情呈现方式或处理方式的含义，不将其窄化为单纯改变进程。
- source_word: עָשָׂה ... אֶת־הַדָּבָר הַזֶּה
  choice: 才这样做
  rationale: 与前面的目的句自然衔接；“这样做”避免生硬重复“这事”，仍准确表达原文。
- source_word: עַבְדְּךָ
  choice: 你的仆人
  rationale: 符合臣属对君王说话时的谦称，也保留原文的宫廷语体。
- source_word: וַאדֹנִי
  choice: 但我主
  rationale: 连接词在这里带有轻微转折，从解释约押的行动转到称赞大卫的洞察力。
- source_word: חָכָם
  choice: 有智慧
  rationale: 采用常用、庄重的对应语，适合这里对君王判断力的称赞。
- source_word: כְּחָכְמַת מַלְאַךְ הָאֱלֹהִים
  choice: 如上帝的使者那样有智慧
  rationale: 明确保留比较结构；“上帝的使者”不擅自判定是某一位特定使者，也不把大卫等同于神性存在。
- source_word: לָדַעַת
  choice: 能知道
  rationale: 在智慧的比较之后表达由此具有的能力，现代汉语中比单用“知道”衔接更自然。
- source_word: כָּל אֲשֶׁר בָּאָרֶץ
  choice: 境内的一切
  rationale: 在君王与国事的语境中，הָאָרֶץ 较可能指其国土或疆域；译作“境内”自然呈现这一语境义，同时以脚注保留“地上”的可能。
theological_decisions:
- issue: “上帝的使者”的所指及比较性质
  choice: 译为比较性的赞语“如上帝的使者那样有智慧”
  alternative: 译成“有上帝那位使者的智慧”，或理解为接近神一般的全知
  rationale: 原文是在宫廷语境中称赞大卫非凡的辨识力。译文保留明示的比较，不把它提升为关于大卫本性或全知的断言，也不强行指定某一位使者。
translation_notes:
  register: 采用现代、庄重而易懂的宫廷叙事语体。“你的仆人”“我主”保留尊卑关系；核心习语适度保留原文形象，并用脚注说明其字面意义与其他译法。
