source:
  edition: WLC
  text: כִּי מ֣וֹת נָמ֔וּת וְ/כַ/מַּ֨יִם֙ הַ/נִּגָּרִ֣ים אַ֔רְצָ/ה אֲשֶׁ֖ר לֹ֣א יֵאָסֵ֑פוּ וְ/לֹֽא יִשָּׂ֤א אֱלֹהִים֙ נֶ֔פֶשׁ וְ/חָשַׁב֙ מַֽחֲשָׁב֔וֹת לְ/בִלְתִּ֛י יִדַּ֥ח מִמֶּ֖/נּוּ נִדָּֽח־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/014.yaml
  text: For we must surely die and are like water poured out on the ground[a], which cannot be gathered up again. Yet God does not take away life[b], but devises plans so that the banished one will not remain banished from him.
translation:
  language: zh_hans
  text: 因为我们必定要死，就像泼在地上的水，无法再收回来。然而，上帝并不夺取人的性命[a]，反而设法使被放逐的人不至于一直与他隔绝[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“上帝不偏待人。”希伯来语此句含义不确定，也有人作其他理解。
    reason: alternative_reading
  - marker: b
    text: 或译：“使被放逐的人不再被逐离他身边。”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，为妇人的请求提出理由，保留原文的论证关系。
- source_word: מוֹת נָמוּת
  choice: 我们必定要死
  rationale: 以“必定”表达不定式绝对形与未完成式组合所强调的死亡必然性，同时符合现代汉语表达。
- source_word: וְכַמַּיִם הַנִּגָּרִים אַרְצָה
  choice: 就像泼在地上的水
  rationale: 自然呈现原文比喻，并与下句“无法再收回来”所表达的不可挽回性衔接。
- source_word: אֲשֶׁר לֹא יֵאָסֵפוּ
  choice: 无法再收回来
  rationale: 表达被泼之水不能重新聚拢的意思；“再”根据比喻的语境自然补出。
- source_word: וְלֹא יִשָּׂא אֱלֹהִים נֶפֶשׁ
  choice: 然而，上帝并不夺取人的性命
  rationale: 该短语含义困难；按本节死亡与挽回被放逐者的语境，将 נֶפֶשׁ 理解为人的生命，以“然而”标明与人必死这一事实的转折关系，同时用脚注保留“不偏待人”的可能解释。
- source_word: וְחָשַׁב מַחֲשָׁבוֹת
  choice: 反而设法
  rationale: 希伯来语同根结构强调有意谋划；“设法”简洁自然地传达为达成挽回而筹划办法的含义。
- source_word: לְבִלְתִּי יִדַּח
  choice: 使……不至于一直……隔绝
  rationale: נדח 的被动形式可指被驱逐或放逐；正文结合语境表达持续处于放逐、隔绝状态的意思，脚注保留更贴近形式的译法。
- source_word: מִמֶּנּוּ נִדָּח
  choice: 被放逐的人……与他隔绝
  rationale: 保留原文单数的“被放逐者”以及 מִמֶּנּוּ 的第三人称指向，不把“他”的所指进一步限定为上帝或君王。
theological_decisions:
- issue: וְלֹא יִשָּׂא אֱלֹהִים נֶפֶשׁ 的解释
  choice: 上帝并不夺取人的性命
  alternative: 上帝不偏待人
  rationale: 在本节从死亡转向挽回被放逐者的脉络中，“不夺取人的性命”较为连贯；但原短语在句法和语义上确有困难，因此以脚注保留“不偏待人”的解释，不将争议悄然消除。
- issue: לְבִלְתִּי יִדַּח מִמֶּנּוּ נִדָּח 所表达的放逐状态
  choice: 使被放逐的人不至于一直与他隔绝
  alternative: 使被放逐的人不被逐离他
  rationale: 正文用自然汉语表达放逐状态得以逆转，脚注则保留原文被动动词“被逐离”的形式与可能侧重；“他”的指向维持原文的语境性，不作教义化限定。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“必定要死”“泼在地上的水”“设法”等表达便于普通读者理解；对两个含义困难之处以脚注保存异读，并保留末尾“他”的指代开放性。
