  yaml_path: translation/ot/2_samuel/014/023.yaml
  text: So Joab arose and went to Geshur[a], and brought Absalom to Jerusalem.
translation:
  language: zh_hans
  text: 于是，约押动身前往基述，把押沙龙带到耶路撒冷。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקָם
  choice: 动身
  rationale: קום的叙事性用法表示起身采取行动；现代汉语用“动身”自然承接随后前往基述的动作，又不必机械译作“起来”。
- source_word: וַיֵּלֶךְ
  choice: 前往
  rationale: הלך在此表示去往某地；与“动身”连用为“动身前往”，符合现代汉语叙事表达。
- source_word: גְּשׁוּרָה
  choice: 基述
  rationale: 词尾的方向性־ָה表示朝向基述；汉语通过“前往基述”清楚表达目的地。
- source_word: וַיָּבֵא
  choice: 带到
  rationale: ביא的使役形表示“使来、带来”。“带到”配合目的地“耶路撒冷”准确自然；不添加原文未明说的“带回”。
- source_word: אֶת אַבְשָׁלוֹם
  choice: 押沙龙
  rationale: אֶת为直接宾语标记；人名采用现代中文圣经中通行的译名“押沙龙”。
- source_word: יְרוּשָׁלִָם
  choice: 耶路撒冷
  rationale: 该词在句法中是带领行动的目的地；汉语以“带到耶路撒冷”明确表达这一关系。
- source_word: וַ
  choice: 于是
  rationale: 句首叙事连接词承接上文结果并推进事件；“于是”自然体现约押随即采取行动的语篇关系。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“动身前往”整合连续的“起来、去”两个叙事动作，同时保留行动次序；未将“回”加入正文，因为虽然上下文表明押沙龙结束流亡返回耶路撒冷，希伯来动词本身只明确表示“带到”。
