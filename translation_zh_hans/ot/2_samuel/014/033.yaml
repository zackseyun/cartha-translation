base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/033.yaml
  text: Then Joab came to the king and told him[a], and he called for Absalom. So he came to the king and bowed himself with his face to the ground before the king[b], and the king kissed Absalom.
translation:
  language: zh_hans
  text: 约押来到王那里，把事情告诉了王。王就召押沙龙来[a]。押沙龙来到王那里，在王面前俯伏，脸贴着地；王就亲吻了押沙龙[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “召……来”也可译作“叫……来”。
    reason: lexical_alternative
  - marker: b
    text: 王的亲吻很可能表示接纳、和好或恢复恩宠，但原文只明说王亲吻了他。
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֹא יוֹאָב אֶל־הַמֶּלֶךְ
  choice: 约押来到王那里
  rationale: בוא表示朝王所在之处移动；“来到王那里”既符合叙事视角，也自然清楚。
- source_word: וַיַּגֵּד לוֹ
  choice: 把事情告诉了王
  rationale: נגד的使役词干在此表示告诉或禀报。希伯来文只用代词“他”，中文重提“王”可避免指代含混；“事情”为中文所需的轻度补足，不增添具体内容。
- source_word: וַיִּקְרָא אֶל־אַבְשָׁלוֹם
  choice: 王就召押沙龙来
  rationale: קרא אל在王室语境中可指传召某人到面前。“召……来”简洁自然，并保留其语境意义。
- source_word: וַיִּשְׁתַּחוּ לוֹ עַל־אַפָּיו אַרְצָה
  choice: 在王面前俯伏，脸贴着地
  rationale: שחה表示俯伏致敬，后面的“脸朝地”具体说明姿势；译文保留深度俯伏的身体动作。
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: 在王面前
  rationale: 这是宫廷场景中לִפְנֵי的直接、自然表达。
- source_word: וַיִּשַּׁק הַמֶּלֶךְ לְאַבְשָׁלוֹם
  choice: 王就亲吻了押沙龙
  rationale: 原文明确叙述王亲吻押沙龙，但没有明说这一举动的礼仪或关系含义，因此正文只译动作本身。
theological_decisions:
- issue: 王亲吻押沙龙的含义
  choice: 正文直译为“王就亲吻了押沙龙”，不明说双方已经完全和好或押沙龙已恢复原有地位。
  alternative: 译作“王以亲吻表示与押沙龙和好”或“王恢复了押沙龙的恩宠”。
  rationale: 这一亲吻很可能表示接纳、和好或恢复恩宠，但希伯来文本身只陈述亲吻的动作。保留叙事张力，可避免把合理推断写成明说的事实。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。以短句呈现希伯来文连续动作，并在不改变所指的前提下重提“王”和“押沙龙”，使中文指代清楚。脚注[a]按其实际所释词语置于“召押沙龙来”之后。
