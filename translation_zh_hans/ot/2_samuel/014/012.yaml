  yaml_path: translation/ot/2_samuel/014/012.yaml
  text: Then the woman said[a], “Please let your servant speak a word to my lord the king.” And he said, “Speak.”
translation:
  language: zh_hans
  text: 妇人说：“请容婢女向我主大王说一句话。”王说：“你说吧。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֹּאמֶר הָאִשָּׁה
  choice: 妇人说
  rationale: וַתֹּאמֶר承接并推进叙事；现代汉语无需机械译出连接词。הָאִשָּׁה在本语境中指正在对王说话的妇人。
- source_word: תְּדַבֶּר נָא
  choice: 请容……说
  rationale: 未完成式配合נָא表达谦恭的请求；“请容”自然体现她向王请求准许发言。
- source_word: שִׁפְחָתְךָ
  choice: 婢女
  rationale: 该词是阴性名词，直指女性仆役；“婢女”既保留性别和自谦语气，也符合古代宫廷语境。
- source_word: אֶל אֲדֹנִי הַמֶּלֶךְ
  choice: 向我主我王
  rationale: 保留אֲדֹנִי与הַמֶּלֶךְ两个称谓，并以庄重、可懂的汉语呈现对君王的敬称。
- source_word: דָּבָר
  choice: 一句话
  rationale: דָּבָר可指“话”或“事情”；这里用“一句话”保留简洁的请求发言惯用语。
- source_word: דַּבֵּרִי
  choice: 你说吧
  rationale: 这是对女性说话者的单数阴性命令式；汉语以简洁的准许语“你说吧”自然传达其语用功能。
