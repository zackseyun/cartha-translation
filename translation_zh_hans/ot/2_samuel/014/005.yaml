    reason: lexical_alternative
lexical_decisions:
- source_word: מַה לָּךְ
  choice: 你有什么事？
  rationale: 这是希伯来语习语，直译为“对你有什么”，实际是询问对方出了什么事或有何难处。“你有什么事？”在现代汉语中自然，也保留了直接询问的语气。
- source_word: אֲבָל
  choice: 确实
  rationale: 这里主要是加强断言的语气，并非转折连词“但是”。“确实”能自然表达其强调作用；在此语境中也可能带有哀叹色彩，故以脚注保留另一种理解。
- source_word: אִשָּׁה אַלְמָנָה
  choice: 是个寡妇
  rationale: 原文由“女人”与“寡妇”组合而成，现代汉语用“是个寡妇”即可完整、自然地表达。
- source_word: וַיָּמָת אִישִׁי
  choice: 丈夫已经死了
  rationale: אִישִׁי 在这里指“我的丈夫”；动词表达丈夫死亡这一事件，而“已经死了”自然传达其死亡造成的当前处境。汉语语境已清楚表明是她的丈夫，无须重复“我的”。
- source_word: הַמֶּלֶךְ
  choice: 王
  rationale: 按上下文指特定的王。汉语圣经叙事中以“王”作称谓和叙事主语自然明确。
- source_word: וַתֹּאמֶר
  choice: 她说
  rationale: 叙事形式表示随后发言。汉语无需机械重复连接词“于是/和”，以“她说”自然承接。
