  yaml_path: translation/ot/2_samuel/014/025.yaml
  text: In all Israel there was not a man as handsome as Absalom[a], so highly praised; from the sole of his foot to the crown of his head there was no blemish in him.
translation:
  language: zh_hans
  text: 在全以色列，没有一个人像押沙龙那样俊美；他极受称赞。从脚掌到头顶，他身上毫无瑕疵。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּכְאַבְשָׁלוֹם
  choice: 像押沙龙那样
  rationale: כְּ在比较结构中与否定句共同表达无人可与押沙龙相比；不另加表示时间的“如今”。
- source_word: לֹא הָיָה אִישׁ יָפֶה בְּכָל יִשְׂרָאֵל
  choice: 在全以色列，没有一个人……那样俊美
  rationale: 按希伯来语习惯表达最高程度的比较，即全以色列无人能在容貌上与押沙龙相比。“俊美”用于男性自然、庄重。
- source_word: לְהַלֵּל מְאֹד
  choice: 备受称赞
  rationale: 不定式结构加מְאֹד表示他因外貌受到极高程度的称赞；“备受称赞”简洁传达被动意义和强烈程度。
- source_word: מִכַּף רַגְלוֹ
  choice: 从脚掌
  rationale: כַּף与“脚”连用，指脚底或脚掌；此处采用现代汉语自然的“脚掌”。
- source_word: וְעַד קָדְקֳדוֹ
  choice: 到头顶
  rationale: קָדְקֹד指头部最高处；“头顶”准确而通俗，并与“脚掌”组成涵盖全身的首尾表达。
- source_word: לֹא הָיָה בוֹ מוּם
  choice: 他身上毫无瑕疵
  rationale: מוּם在此指身体上的缺陷；“瑕疵”保留较庄重的语体，“毫无”传达否定的完整性。
theological_decisions: []
