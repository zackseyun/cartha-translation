base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/004.yaml
  text: Then the woman from Tekoa spoke to the king[a]. She fell with her face to the ground and bowed down, and she said, “Save me[b], O king!”
translation:
  language: zh_hans
  text: 提哥亚的妇人对王说[a]。她俯伏在地，向王下拜，说：“王啊，救救我[b]！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“提哥亚妇人对王说。”
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译为“王啊，救！”；“我”是根据语境补出的。
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאִשָּׁה הַתְּקֹעִית
  choice: 提哥亚的妇人
  rationale: 定冠词加地域形容词表明她来自提哥亚；此译法自然清楚，也保留其地域身份。
- source_word: וַתֹּאמֶר ... אֶל הַמֶּלֶךְ
  choice: 对王说
  rationale: 按 אָמַר 的常用义直译，并与本节后面的直接引语自然衔接。
- source_word: וַתִּפֹּל עַל אַפֶּיהָ אַרְצָה
  choice: 俯伏在地
  rationale: 希伯来语字面描写她面朝地俯伏；现代汉语以“俯伏在地”简洁自然地表达这一姿态。
- source_word: וַתִּשְׁתָּחוּ
  choice: 向王下拜
  rationale: 该词表示俯身敬礼或表示臣服；语境中的对象是王，明确补出“向王”可使汉语顺畅，又不赋予宗教敬拜的含义。
- source_word: הוֹשִׁיעָה
  choice: 救救我
  rationale: 这是 יָשַׁע 的祈使式，表示求拯救；原文未明说宾语，但语境清楚指向说话者。重叠式“救救”符合现代汉语恳求语气。
- source_word: הַמֶּלֶךְ
  choice: 王啊
  rationale: 这里是带定冠词的称呼语；“王啊”保留正式而迫切的呼告语气，不额外译作“我王”。
theological_decisions: []
