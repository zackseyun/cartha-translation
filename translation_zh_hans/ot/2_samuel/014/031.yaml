base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/031.yaml
  text: Then Joab arose and went to Absalom’s house and said to him[a], “Why have your servants set my field on fire?”
translation:
  language: zh_hans
  text: 于是，约押起身，来到押沙龙家里，对他说：“为什么你的仆人放火烧了我的田地？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקָם
  choice: 于是，约押起身
  rationale: 连续叙事形式推进情节；“于是”体现承接关系，“起身”保留希伯来叙事惯用表达，同时符合现代汉语。
- source_word: וַיָּבֹא אֶל אַבְשָׁלוֹם הַבָּיְתָה
  choice: 来到押沙龙家里
  rationale: 带方向词尾的 הַבָּיְתָה 表示朝房屋而去；结合 אֶל אַבְשָׁלוֹם，语境指押沙龙的住处。“来到……家里”自然表达目的地。
- source_word: לָמָּה
  choice: 为什么
  rationale: 直接、自然地表达询问原因。
- source_word: הִצִּיתוּ
  choice: 放火烧了
  rationale: יצת 的使役式表示点燃、使燃烧；“放火烧了”保留人为纵火的使役含义，也适合田地这一宾语。
- source_word: עֲבָדֶךָ
  choice: 你的仆人
  rationale: 该词形虽为单数形式，但复数动词 הִצִּיתוּ 表明这里具有集合意义。“仆人”既反映从属关系，也不额外强化奴隶身份。
- source_word: הַחֶלְקָה אֲשֶׁר לִי
  choice: 我的田地
  rationale: חֶלְקָה 指一块土地或田地，אֲשֶׁר לִי 明示“属于我”；现代汉语自然合并为“我的田地”。
- source_word: בָּאֵשׁ
  choice: 放火烧了
  rationale: 介词 בְּ 在此表示手段，即“用火”；汉语以“放火烧”自然表达这一工具关系。
