base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/021.yaml
  text: Then the king said to Joab[a], “Behold now, I have done this thing. Go, bring back the young man Absalom.”
translation:
  language: zh_hans
  text: 王对约押说：“你看[a]，我已经做了这事。你去，把那年轻人押沙龙带回来。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文‘你看’含有引起注意的语气；其中后一语气词的具体色彩可理解为缓和、敦促或即时性。‘我已经做了这事’也可按上下文理解为‘我已经答应这个请求’，但原文并未明确说出‘请求’。
    reason: 说明הִנֵּה נָא的语气并保留‘做这事’在上下文中可能指允准请求、却未被原文明说的含混性。
lexical_decisions:
- source_word: וַיֹּאמֶר הַמֶּלֶךְ אֶל־יוֹאָב
  choice: 王对约押说
  rationale: 未完成式连贯叙事形式推进情节；现代汉语通常无须另加“然后”。保留原文的称号“王”，不以人名替代。
- source_word: הִנֵּה נָא
  choice: 看
  rationale: הִנֵּה用于引起注意，נָא在此带有缓和或当下语气。“看”简洁自然，也避免使用较古雅的“看哪”；其具体语用色彩在脚注中说明。
- source_word: עָשִׂיתִי אֶת־הַדָּבָר הַזֶּה
  choice: 我已经办了这事
  rationale: 保留原文宽泛的“做/办这事”，不在正文中明确解释为“答应这个请求”；“办了这事”在此语境中比“做了这件事”更自然，同时仍保留原文含混性。
- source_word: וְלֵךְ
  choice: 你去
  rationale: 连接词承接前句并引出命令；汉语以直接命令“你去”自然表达，无须机械译出“并且”。
- source_word: הָשֵׁב
  choice: 带回来
  rationale: 这是שׁוב的使役式，意思是使某人返回；“带回来”准确体现其使役意义。
- source_word: הַנַּעַר
  choice: 那年轻人
  rationale: נַעַר可指少年、青年或年轻男子。押沙龙已成年，因此译为“年轻人”较合适；指示语“那”使汉语表达自然，并体现该名词的特指形式。
- source_word: אֶת־אַבְשָׁלוֹם
  choice: 押沙龙
  rationale: 按通行中文圣经人名音译；与前面的“那年轻人”构成同位说明。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“办了这事”保留原文措辞的宽泛性；“带回来”清楚表达使役式。脚注标记置于约押之后，以免打断王的整段话。
