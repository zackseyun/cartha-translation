  text: 押沙龙生了三个儿子和一个女儿；女儿名叫他玛。她是个容貌美丽的女子。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּוָּלְדוּ לְאַבְשָׁלוֹם
  choice: 押沙龙生了
  rationale: נפעל式与介词ל共同表达儿女归于押沙龙的亲子关系；现代汉语用“押沙龙生了”自然简洁，不必机械译成被动式。
- source_word: שְׁלוֹשָׁה בָנִים וּבַת אַחַת
  choice: 三个儿子和一个女儿
  rationale: 准确保留儿子的性别指称和女儿的数目。
- source_word: וּשְׁמָהּ תָּמָר
  choice: 女儿名叫她玛
  rationale: 阴性单数后缀指向刚提到的女儿；明说“女儿”可避免汉语代词指代不清。人名按常见中文圣经译名处理。
- source_word: הִיא הָיְתָה אִשָּׁה יְפַת מַרְאֶה
  choice: 她容貌美丽
  rationale: יְפַת מַרְאֶה描述外貌之美；汉语“容貌美丽”既忠实又自然。אִשָּׁה在此无需生硬独译为“一个女子”，其所指已由“她”清楚表达。
