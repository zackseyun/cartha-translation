  yaml_path: translation/ot/2_samuel/014/003.yaml
  text: Then go to the king and speak to him in this way[a]. And Joab put the words in her mouth.
translation:
  language: zh_hans
  text: “然后你去见王，照这话对他说。”约押把这些话放在她口中[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “把这些话放在她口中”是希伯来语习语，意思是约押把她该说的话教给她。
    reason: cultural_note
lexical_decisions:
- source_word: וּבָאת
  choice: 然后，你到……去
  rationale: 该词为第二人称阴性单数完成式，在连续指示中具有命令或将来行动的功能；“然后”清楚表达下一步行动。
- source_word: אֶל־הַמֶּלֶךְ
  choice: 到王那里去
  rationale: 介词 אֶל 表示朝向某人；这一表达既保留移动方向，也符合现代汉语习惯。
- source_word: וְדִבַּרְתְּ אֵלָיו
  choice: 对他说
  rationale: דבר 与 אֶל 连用表示向某人说话；“对他说”简洁自然，并保留直接言说的意味。
- source_word: כַּדָּבָר הַזֶּה
  choice: 照这样
  rationale: 该短语指下文将要说的方式或内容；“照这样”保留指示性，也不把 דָבָר 生硬地逐字译为“话语”。
- source_word: וַיָּשֶׂם
  choice: 便把……放在
  rationale: שׂים 的基本义是“放、置”；“便”自然承接前句，并保留原文动作意象。
- source_word: אֶת־הַדְּבָרִים
  choice: 那些话
  rationale: 复数定指名词指约押预先拟定的具体言辞；“那些话”在汉语中自然地指回他要妇人说的内容。
- source_word: בְּפִיהָ
  choice: 她口中
  rationale: 直译保留希伯来语“把话放在某人口中”的鲜明习语；脚注说明其实际含义，避免读者误解为字面动作。
