base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/018.yaml
  text: Then the king answered and said to the woman[a], “Please do not hide from me anything that I ask you.” And the woman said, “Please speak[b], my lord the king.”
translation:
  language: zh_hans
  text: 王回答那妇人说：“我问你的事，请不要向我隐瞒。”妇人说：“请我主我王说吧。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: 回答……说
  rationale: 保留希伯来叙事中“回答—说”的对话程式；现代汉语虽略显郑重，但自然可懂，也与原文形式相近。
- source_word: הָאִשָּׁה
  choice: 那妇人
  rationale: 所指是提哥亚的妇人，并非妻子；“那妇人”承接上下文，也符合历史叙事的庄重语体。
- source_word: אַל נָא תְכַחֲדִי מִמֶּנִּי דָּבָר
  choice: 请不要向我隐瞒
  rationale: נָא表达恳请语气，תְכַחֲדִי指隐匿或不披露；“向我隐瞒”准确表达מִמֶּנִּי所标明的对象。汉语无需另译דָּבָר为“一件事”，因后面的“我问你的事”已使宾语明确。
- source_word: אֲשֶׁר אָנֹכִי שֹׁאֵל אֹתָךְ
  choice: 我问你的事
  rationale: 将关系从句自然转化为汉语偏正结构，保留即时询问的语义，不增添“将要”或“正在”等原文未明确限定的时态。
- source_word: יְדַבֶּר נָא
  choice: 请……说吧
  rationale: 第三人称祈愿式是对君王的敬语表达；汉语以“请”加句末“吧”自然传达恭敬许可的口吻。
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: 我主我王
  rationale: 保留אֲדֹנִי的归属与尊称，以及הַמֶּלֶךְ的王号；“我主我王”是清楚而庄重的宫廷称谓。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而可读的历史叙事语体。“回答……说”有意保留希伯来语对话程式；妇人的答话保留宫廷敬语，不将第三人称敬称机械译成生硬的现代第三人称句式。
