base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/002.yaml
  text: So Joab sent to Tekoa and took from there a wise woman[a], and he said to her, “Please pretend to be mourning, and please put on mourning clothes, and do not anoint yourself with oil[d][c][b], but be like a woman who has been mourning for the dead many days.”
translation:
  language: zh_hans
  text: 于是，约押打发人往提哥亚去，从那里带来一个有智慧的妇人，对她说：“请你装作正在哀悼，穿上丧服[b]，不要用油抹身[c]；要像一个已经为死者哀悼多日的妇人[d]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 直译：“哀悼的衣服”。
    reason: lexical_alternative
  - marker: c
    text: 当时，用油抹身是日常梳洗和使身体舒爽的一部分；哀悼时不用油，是悲伤的外在表现。
    reason: cultural_note
  - marker: d
    text: 较直译：“像一个已经许多日子为死者哀悼的妇人。”
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּקוֹעָה
  choice: 提哥亚
  rationale: 采用现代中文圣经传统中较通行的地名音译，不翻译其可能的词源含义。
- source_word: אִשָּׁה חֲכָמָה
  choice: 一个有智慧的妇人
  rationale: חֲכָמָה 可指智慧、才干或机敏；这里保留较宽泛的“有智慧”，让叙事语境显出她善于完成约押所安排的劝说。
- source_word: הִתְאַבְּלִי נָא
  choice: 请你装作哀悼的人
  rationale: 该动词本义是“哀悼”，但上下文表明约押要她为了预先安排的陈诉而呈现哀悼者的样子；“装作”表达语境中的表演性质，脚注保留较直译的可能。
- source_word: בִגְדֵי אֵבֶל
  choice: 丧服
  rationale: 这是指哀悼时所穿衣服的固定表达；“丧服”简洁、自然，并准确传达文化功能。
- source_word: וְאַל תָּסוּכִי שֶׁמֶן
  choice: 不要用油抹身
  rationale: סוך 指把油涂抹在身体上，常与日常梳洗、舒爽有关；中文用“用油抹身”比宗教色彩较强的“膏抹自己”更符合本处生活习俗。
- source_word: זֶה יָמִים רַבִּים מִתְאַבֶּלֶת עַל מֵת
  choice: 为死者哀悼了许多日子
  rationale: 用完成并持续的中文表达传达分词所描述的延续状态；מֵת 是不定单数，可泛指死去的人，因此译为“死者”。
