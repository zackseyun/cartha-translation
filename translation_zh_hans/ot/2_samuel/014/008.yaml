  yaml_path: translation/ot/2_samuel/014/008.yaml
  text: Then the king said to the woman[a], “Go to your house, and I will give orders concerning you.”
translation:
  language: zh_hans
  text: 王对那妇人说：“你回家去吧，我会就你的事下令。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 连续式叙事动词推进情节；现代汉语在上下文中无需另加“于是”也能自然表达先后。
- source_word: הַמֶּלֶךְ
  choice: 王
  rationale: 准确表达带定冠词的名词；本段语境清楚指大卫王。
- source_word: הָאִשָּׁה
  choice: 那妇人
  rationale: 语境所指是提哥亚的妇人；“那妇人”既明确承接前文，又符合庄重的叙事语体。
- source_word: לְכִי לְבֵיתֵךְ
  choice: 你回家去吧
  rationale: 阴性单数命令式意为“去”，לְבֵיתֵךְ直指“你的家”；按语境译作“回家去”比逐字的“去你家”更自然。“吧”使王的吩咐在现代汉语中顺畅，但不削弱其命令性质。
- source_word: וַאֲנִי
  choice: 我会
  rationale: 保留第一人称主语所带的强调；“会”自然表达随后将采取的行动。
- source_word: אֲצַוֶּה
  choice: 下令
  rationale: צוה的加强词干表示命令、发出指示；“下令”切合君王说话的身份与权威。
- source_word: עָלָיִךְ
  choice: 为你的事
  rationale: 介词עַל与צוה连用时，可表示命令所涉及的人或事项。此译法自然传达王将针对她的案件作出指示，同时不过度限定为单纯施惠。
theological_decisions:
- issue: 王所下命令与妇人的关系
  choice: 为你的事下令
  alternative: 为你下令／就你的事下令／吩咐人照应你
  rationale: 希伯来语עָלָיִךְ可指“关于你”或“为你”；正文保留与她的事情有关且可能对她有利的语义范围，不补出原文未明说的命令内容或执行对象。
translation_notes:
  register: 采用现代、庄重且易懂的叙事语言。“那妇人”承接上文，“回家去吧”符合自然汉语；“为你的事下令”尽量保存希伯来介词表达的弹性。原文没有必须另加脚注才能保留的异文或重大歧义，因此正文不设脚注。
