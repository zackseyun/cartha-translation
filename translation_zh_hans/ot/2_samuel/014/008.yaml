  source_fidelity: 译文准确传达王对该妇人说话、命令她回家，以及随后将发布命令的基本意思。惟“为你的事下令”中的“为”在现代汉语中较容易被理解为“替你／为了你的利益”，而希伯来语 עָלָיִךְ 在此更稳妥地表示与她或她的事有关；宜改用“就你的事”以减少施惠意味，同时保留命令具体内容未说明的余地。
