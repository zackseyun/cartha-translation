  text: וַ/תֹּ֨אמֶר֙ שִׁפְחָ֣תְ/ךָ֔ יִֽהְיֶה נָּ֛א דְּבַר אֲדֹנִ֥/י הַ/מֶּ֖לֶךְ לִ/מְנוּחָ֑ה כִּ֣י כְּ/מַלְאַ֣ךְ הָ/אֱלֹהִ֗ים כֵּ֣ן אֲדֹנִ֤/י הַ/מֶּ֨לֶךְ֙ לִ/שְׁמֹ֨עַ֙ הַ/טּ֣וֹב וְ/הָ/רָ֔ע וַֽ/יהוָ֥ה אֱלֹהֶ֖י/ךָ יְהִ֥י עִמָּֽ/ךְ־־׀׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/017.yaml
  text: Then your servant said[a], ‘Please let the word of my lord the king bring rest, for my lord the king is like the angel of God, to hear the good and the evil[b]. And may Yahweh your God be with you.’
translation:
  language: zh_hans
  text: 于是，你的婢女说：“求我主我王的话带来安宁，因为我主我王如同上帝的天使[a]，能明辨善恶[b]。愿耶和华你的上帝与你同在。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “天使”也可译作“使者”；希伯来语原词兼有这两种含义。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“听善与恶”；这是一种指听审、明辨或判断善恶的表达。
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁפְחָתְךָ
  choice: 你的婢女
  rationale: 原词明确为阴性，指女性仆人；“你的婢女”既保留性别信息和自谦语气，也符合古代宫廷陈情的语境。
- source_word: יִהְיֶה נָּא
  choice: 求你让……
  rationale: 未完成式用于祈愿，配合 נָא 表达谦恭请求；中文用“求你让”自然传达其恳求语气。
- source_word: דְּבַר אֲדֹנִי הַמֶּלֶךְ
  choice: 主我王的话
  rationale: דָּבָר 可指话、事情或裁决；保留“话”既贴近原文，也能在语境中指王所作的裁断。
- source_word: לִמְנוּחָה
  choice: 带来安宁
  rationale: מְנוּחָה 表示安歇、平静或安宁；这里指王的话使事情平息，故译作“带来安宁”。
- source_word: כְּמַלְאַךְ הָאֱלֹהִים
  choice: 如同上帝的天使
  rationale: מַלְאָךְ 本义为使者，也可专指天使；此处以超常的判断能力尊崇地比拟君王，“天使”较符合语境，同时以脚注保留“使者”的词义可能。
- source_word: לִשְׁמֹעַ הַטּוֹב וְהָרָע
  choice: 能听明善恶
  rationale: 原文直译为“听善与恶”；“听明”保留听审意味，同时自然表达辨明、判断善恶的能力。
- source_word: וַיהוָה אֱלֹהֶיךָ
  choice: 耶和华你的上帝
  rationale: 将四字神名 יְהוָה 以中文传统专名“耶和华”表达，并保留“你的上帝”的第二人称所属关系。
- source_word: יְהִי עִמָּךְ
  choice: 愿……与你同在
  rationale: 这是标准的祝愿式表达；“愿……与你同在”准确传达其祈愿和祝福语气。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。中文正文采用广为人知且具有专名功能的“耶和华”，不以“主”替代神名。
- issue: מַלְאָךְ 在君王比喻中的含义
  choice: 天使
  alternative: 使者
  rationale: 该比喻强调超凡的洞察和审断能力，语境较支持超自然的“天使”；但原词也可泛指“使者”，故以脚注保留。
- issue: “听善恶”的司法含义
  choice: 听明善恶
  alternative: 辨明善恶
  rationale: “听明”保留原文“听”的司法、审理色彩，又让现代读者理解为辨别善恶，不把原文完全改写成较解释性的“辨明”。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“主我王”保留原文反复出现的宫廷敬称；“婢女”保留说话者的女性身份和自谦姿态。
