base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/019.yaml
  text: Then the woman took a covering and spread it over the mouth of the well[a], and scattered crushed grain on it[b], and the matter was not known.
translation:
  language: zh_hans
  text: 那妇人拿了一块遮盖物，铺在井口上，又把碾碎的谷物[a]撒在上面，这事没有被察觉。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“捣碎的谷物”；这里的希伯来词指经捣碎或碾碎的谷物制品，具体形态不确定。
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאִשָּׁה
  choice: 那妇人
  rationale: אִשָּׁה可指“女人”或“妻子”；本节指上下文中已经出现的那位妇人。“那妇人”既明确所指，也不额外断定其婚姻身份。
- source_word: הַמָּסָךְ
  choice: 一块盖布
  rationale: מָסָךְ可指遮盖物、帘子或屏障。此处用于遮住井口；“盖布”自然且不过度限定材质，“一块”符合现代汉语叙事表达。
- source_word: עַל פְּנֵי הַבְּאֵר
  choice: 铺在井口上
  rationale: 该短语直译为“在井的表面/面上”；按场景所指是井的开口，因此译作“井口上”。
- source_word: וַתִּשְׁטַח
  choice: 撒在
  rationale: שטח表示铺开、摊开。以碎谷为宾语时，“撒在上面”既符合动作，也自然传达用谷物掩饰盖布的场景，而不明说经文未明言的目的。
- source_word: הָרִפוֹת
  choice: 碎谷
  rationale: רִפוֹת指经捣碎或碾碎的谷物制品，具体形态并不十分确定。“碎谷”简洁易懂，并用脚注保留词义范围。
- source_word: וְלֹא נוֹדַע דָּבָר
  choice: 这事就没有被人发现
  rationale: 希伯来语字面为“事情没有被知道”。“这事就没有被人发现”保留被动含义，并在现代汉语中自然表达掩藏之事未被察觉。
