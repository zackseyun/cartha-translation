  text: The proposal seemed good in the eyes of Absalom and in the eyes of all the elders of Israel[a].
translation:
  language: zh_hans
  text: 押沙龙和以色列众长老都认为这建议好。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这事在押沙龙和以色列众长老眼中都显为合宜。”
    reason: 保留הַדָּבָר较宽泛的“这事”之义，并呈现וַיִּישַׁר在此习语中可表达“合宜、可取”的词义可能。
lexical_decisions:
- source_word: וַיִּישַׁר
  choice: 看为好
  rationale: 该动词与“在……眼中”连用，表示某事被认为合宜、可取或令人赞同；“看为好”既保留希伯来语的评价意味，也不把它误解为抽象的道德正直。
- source_word: הַדָּבָר
  choice: 这建议
  rationale: 原词可指“这事、这话”；在本段语境中具体指亚希多弗刚提出的计策，因此译作“这建议”清楚而自然。
- source_word: בְּעֵינֵי / וּבְעֵינֵי
  choice: 在……眼中
  rationale: 保留希伯来语常见的评价性习语及其重复结构，同时现代汉语读者也容易理解。
- source_word: אַבְשָׁלֹם
  choice: 押沙龙
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: כָּל זִקְנֵי יִשְׂרָאֵל
  choice: 以色列众长老
  rationale: זִקְנֵי在这里指具有公认地位的领袖或议事长老，并非泛指年老男子；כָּל以“众”自然表达全体之意。
