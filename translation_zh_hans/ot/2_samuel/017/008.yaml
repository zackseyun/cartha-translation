base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/008.yaml
  text: Hushai said[a], “You know your father and his men, that they are mighty men and bitter of soul, like a bear robbed of her cubs in the field. And your father is a man of war[b]; he will not spend the night with the troops.”
translation:
  language: zh_hans
  text: 户筛说：“你知道，你父亲和跟随他的人都是勇士，并且满怀苦愤[a]，好像田野里失去幼崽的母熊。你父亲又是久经战阵的人；他不会和部队一起过夜[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“性情凶猛”或“满怀愤恨”；原文直译近于“心里苦涩”。
    reason: lexical_alternative
  - marker: b
    text: “部队”原文作“众人”。此处动词也可按使役义理解为“他不会让众人过夜”，即不会让部队就地宿营。
    reason: textual_and_grammatical_ambiguity
lexical_decisions:
- source_word: גִבֹּרִים
  choice: 勇士
  rationale: 该词表示强壮、英勇的人，在本节军事语境中译作“勇士”简洁自然，也保留阳性复数的群体含义。
- source_word: מָרֵי נֶפֶשׁ
  choice: 心里苦愤
  rationale: 这一习语直译近于“心灵苦涩的人”，在此表示因受激而苦愤、凶猛的状态。“心里苦愤”既保留希伯来语的内在情感意象，也符合现代汉语。
- source_word: כְּדֹב שַׁכּוּל
  choice: 好像……失去幼崽的母熊
  rationale: שַׁכּוּל表示丧失儿女或幼崽；汉语明确说“母熊”和“幼崽”，可自然传达原比喻中因丧子而极其危险的形象。
- source_word: בַּשָּׂדֶה
  choice: 田野里
  rationale: 直接表达地点，并保留原文的野外场景。
- source_word: אִישׁ מִלְחָמָה
  choice: 久经战阵的人
  rationale: 原义为“战争之人”，指熟悉并善于作战的人。“久经战阵”在现代汉语中自然、庄重，比直译“战争之人”更清楚。
- source_word: לֹא יָלִין אֶת־הָעָם
  choice: 他不会和部队一起过夜
  rationale: לין指住宿、过夜；结合下一节大卫已经藏匿的语境，这里理解为他不会与随行战斗人员同宿。עָם在本段指随军众人，因此译作“部队”，并用脚注保留马所拉元音所容许的使役理解。
- source_word: יָדַעְתָּ
  choice: 你知道
  rationale: 直接、自然地表达户筛对押沙龙的提醒。
- source_word: אֲנָשָׁיו
  choice: 跟随他的人
  rationale: 字面为“他的人”；在这里指跟随大卫的一群人。该译法避免把每个人都过度限定为正式士兵，同时符合军事语境。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“心里苦愤”有意保留原文较强的情感意象；“久经战阵的人”自然传达军事经验。“和部队一起过夜”按上下文处理语法难点，同时在脚注中保留另一种可能。
