base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/025.yaml
  text: And Absalom set Amasa over the army in place of Joab. Now Amasa was the son of a man whose name was Ithra the Israelite[a], who had gone in to Abigail the daughter of Nahash, sister of Zeruiah, Joab’s mother.
translation:
  language: zh_hans
  text: 押沙龙立亚玛撒统领军队，代替约押。亚玛撒是一个名叫以特拉的以色列人[a]的儿子；以特拉曾与拿辖的女儿亚比该同房。亚比该是洗鲁雅的姐妹，洗鲁雅是约押的母亲。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文本作“以特拉这个以色列人”；历代志上2:17作“以实玛利人益帖”。
    reason: 文本异文
lexical_decisions:
- source_word: שָׂם
  choice: 立
  rationale: 此处指任命某人担任军职；“立……统领”既简洁庄重，也符合现代汉语表达。
- source_word: תַּחַת יוֹאָב
  choice: 代替约押
  rationale: תַּחַת在这里表示职位上的替代，而非空间上的“在……下面”。
- source_word: עַל הַצָּבָא
  choice: 统领军队
  rationale: עַל与“军队”连用表示管辖权；译为“统领军队”比直译“在军队之上”自然。
- source_word: בֶן אִישׁ וּשְׁמוֹ יִתְרָא
  choice: 一个名叫以特拉的……人的儿子
  rationale: 保留原文中“一个人”和“他名叫以特拉”的信息，同时按自然汉语重组。
- source_word: הַיִּשְׂרְאֵלִי
  choice: 以色列人
  rationale: 忠实采用WLC马所拉文本的读法；历代志上2:17的不同读法另以脚注说明。
- source_word: אֲשֶׁר בָּא אֶל
  choice: 曾与……同房
  rationale: 该希伯来委婉语在此表示性结合；“同房”以现代读者能够理解的汉语委婉表达传达其含义。
- source_word: אֲבִיגַל בַּת נָחָשׁ
  choice: 拿辖的女儿亚比该
  rationale: 直接表达父女关系，并采用自然的汉语姓名次序。
- source_word: אֲחוֹת צְרוּיָה אֵם יוֹאָב
  choice: 亚比该是洗鲁雅的姐妹，洗鲁雅是约押的母亲
  rationale: 将原文紧密的同位修饰结构拆为清楚的分句，避免读者误以为亚比该是约押的母亲。
theological_decisions: []
