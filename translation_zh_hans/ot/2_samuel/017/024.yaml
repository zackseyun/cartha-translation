  text: Then David came to Mahanaim, and Absalom crossed the Jordan, he and all the men of Israel with him.
translation:
  language: zh_hans
  text: 大卫到了玛哈念；押沙龙与所有跟随他的以色列男子一同渡过了约旦河。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּא
  choice: 到了
  rationale: בוא的Qal完成式在此表示抵达某地；“到了”符合现代汉语叙事习惯，也准确表达向目的地移动并抵达。
- source_word: מַחֲנָיְמָה
  choice: 玛哈念
  rationale: 地名所带的方向词尾־ָה表示朝向该地；汉语“到了玛哈念”已自然包含“到……去”的方向意义。
- source_word: עָבַר אֶת־הַיַּרְדֵּן
  choice: 渡过约旦河
  rationale: עבר以“约旦河”为直接宾语，意为横渡河流；“渡过约旦河”准确、自然且保持庄重叙事语体。
- source_word: הוּא
  choice: 他
  rationale: 独立代词在动词之后再次明示主语，并与后面的同行者构成同位结构；译作“他”保留这一明示，而不额外加强为“他本人”。
- source_word: כָל־אִישׁ יִשְׂרָאֵל
  choice: 所有以色列人
  rationale: 该短语字面为“以色列的每一个男子”，在上下文中指随押沙龙行动的以色列人员。汉语“所有以色列人”自然表达集合意义；不补入原文没有明说的“军兵”。
- source_word: עִמּוֹ
  choice: 跟随他的
  rationale: 原义为“与他一起”。在汉语同位结构中译作“跟随他的”，清楚说明这些人与押沙龙同行，避免“他和所有以色列人与他一起”造成重复和歧义。
- source_word: וְ
  choice: ；／也
  rationale: 连接词推动并衔接两个同时段的叙事动作。汉语用分号分隔两项进展，并以“也”自然呈现第二项的并列推进。
