  naturalness: “他和跟随他的所有以色列人都过去了”在现代汉语中既重复又略显累赘。改为“押沙龙与所有跟随他的以色列男子一同渡过了约旦河”自然、清楚，保持庄重的叙事语体。
  terminology: “玛哈念”“押沙龙”“约旦河”译名可保留。“以色列男子”较“以色列人”更能保留כָּל־אִישׁ יִשְׂרָאֵל的男性集合表达，且不擅自添加“军兵”等限定。
