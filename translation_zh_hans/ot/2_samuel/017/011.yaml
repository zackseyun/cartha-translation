  text: כִּ֣י יָעַ֗צְתִּי הֵ֠אָסֹף יֵאָסֵ֨ף עָלֶ֤י/ךָ כָל יִשְׂרָאֵל֙ מִ/דָּן֙ וְ/עַד בְּאֵ֣ר שֶׁ֔בַע כַּ/ח֥וֹל אֲשֶׁר עַל הַ/יָּ֖ם לָ/רֹ֑ב וּ/פָנֶ֥י/ךָ הֹלְכִ֖ים בַּ/קְרָֽב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/011.yaml
  text: But I advise that all Israel be surely gathered to you[a], from Dan to Beersheba, as numerous as the sand that is by the sea, and that you yourself go into battle.
translation:
  language: zh_hans
  text: 不过，我建议让以色列众人，从但直到别是巴，全都聚集到你这里，多得像海边的沙；并且你亲自出战。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“你的面在战斗中前行”；这是指你本人亲自进入战斗的惯用表达。
    reason: 说明原文以“你的面”指代本人，并保留该表达所强调的亲自参战之意，避免将“率军”作为原文明确陈述。
lexical_decisions:
- source_word: כִּי
  choice: 不过
  rationale: 此处引出户筛与亚希多弗方案相对的建议；结合上下文，用“不过”自然表达转折作用，同时不将该词机械译为“因为”。
- source_word: יָעַצְתִּי
  choice: 我建议
  rationale: יעץ意为“劝告、出主意”；在直接陈述方案的言语行为中，“我建议”符合现代汉语表达。
- source_word: הֵאָסֹף יֵאָסֵף
  choice: 都聚集
  rationale: 不定式绝对形与限定动词连用，强化“聚集”的全面、确定性；“众人……都聚集”以自然汉语体现强调。
- source_word: עָלֶיךָ
  choice: 到你这里
  rationale: 与אסף连用时，על表示聚集到领袖那里、归于其麾下；“到你这里”既清楚又不额外限定为包围。
- source_word: כָל יִשְׂרָאֵל
  choice: 以色列众人
  rationale: 这是指全体以色列的集合性说法；“众人”在军事动员语境中自然，并保留全体性的修辞。
- source_word: מִדָּן וְעַד בְּאֵר שֶׁבַע
  choice: 从但直到别是巴
  rationale: 保留由北至南、代表以色列全境的地理首尾语，并采用通行中文地名。
- source_word: כַּחוֹל אֲשֶׁר עַל הַיָּם לָרֹב
  choice: 多得像海边的沙
  rationale: לָרֹב突出数量极多；译文用现代汉语明确数量比较，同时保留海边沙子的原有意象。
- source_word: וּפָנֶיךָ הֹלְכִים
  choice: 由你亲自率军
  rationale: 字面为“你的面走着”，其中“面”指本人亲临；结合军事语境，表达押沙龙本人带队前往，而不保留会造成误解的身体部位字面语。
- source_word: בַּקְרָב
  choice: 出战
  rationale: קרב在此指战斗、交战；与“率军”搭配译作“出战”，符合自然、庄重的军事叙述。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“都聚集”承载原文重复结构的强调；“由你亲自率军出战”清楚传达希伯来语惯用表达，并用脚注保留其字面形式。
