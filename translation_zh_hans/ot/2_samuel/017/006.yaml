base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/006.yaml
  text: When Hushai came to Absalom[a], Absalom said to him, “Ahithophel has spoken in this way. Should we do as he says? If not, you speak.”
translation:
  language: zh_hans
  text: 户筛来到押沙龙那里，押沙龙对他说：“亚希多弗是这样说的。我们要照他的话去做[a]吗？若不然，你来说吧。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我们要实行他的话吗？”希伯来文直译为“我们要行他的话吗？”，意思是要不要执行亚希多弗的计策。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: 来到
  rationale: 叙事中的未完成式连续体推进情节；בוא 与 אֶל 连用，表示户筛来到押沙龙那里。
- source_word: חוּשַׁי
  choice: 户筛
  rationale: 采用现代中文圣经中较通行的人名音译。
- source_word: וַיֹּאמֶר ... לֵאמֹר
  choice: 对他说
  rationale: 中文引语不必重复译出“说……说”，以“对他说”自然表达引语的引入。
- source_word: כַּדָּבָר הַזֶּה דִּבֶּר
  choice: 是这样说的
  rationale: 保留“这样”的指示作用，指向亚希多弗刚才提出的计策，同时符合现代中文表达。
- source_word: הֲנַעֲשֶׂה
  choice: 我们要……吗
  rationale: 疑问词与第一人称复数未完成式在此表达共同商议，中文“我们要……吗”自然保留斟酌语气。
- source_word: אֶת דְּבָרוֹ
  choice: 照他的话去做
  rationale: 字面为“行他的话”，语境指执行亚希多弗的建议；此译既清楚又保留“话”的原文意象。
- source_word: אִם אַיִן
  choice: 若不然
  rationale: 这是商议话语中的条件性转折，“若不然”简洁而庄重。
- source_word: אַתָּה דַבֵּר
  choice: 你来说吧
  rationale: 独立代词 אַתָּה 强调“你”；“来说吧”传达命令式，同时符合征询意见的语境。
