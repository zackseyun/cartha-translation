  text: וְ/אָשִׁ֥יבָה כָל הָ/עָ֖ם אֵלֶ֑י/ךָ כְּ/שׁ֣וּב הַ/כֹּ֔ל הָ/אִישׁ֙ אֲשֶׁ֣ר אַתָּ֣ה מְבַקֵּ֔שׁ כָּל הָ/עָ֖ם יִהְיֶ֥ה שָׁלֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/003.yaml
  text: and I will bring back all the people to you[a], as when all return, the man whom you seek will be gone; all the people will be at peace.
translation:
  language: zh_hans
  text: 我必使众民都回到你这里[a]；正如全体归回时，你所寻找的那个人已不在其中；众民就都必得平安。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语本句艰涩，直译近于：“我必使众民都回到你这里，如同全体归回——你所寻找的那个人。”中间关系未明说。上下文所指的是押沙龙所寻求的大卫；意思大概是，若那一人不再在众人中，其余的人都会归回。
    reason: 说明原文困难的省略句法，并交代“所寻找的那个人”的上下文指向；“已不在其中”是为使汉语成句而作的谨慎补足，不明说其具体遭遇。
lexical_decisions:
- source_word: וְאָשִׁיבָה
  choice: 我必使……回到
  rationale: 使役式表达使众人归回；在此军事与政治语境中，比“恢复”或不及物的“回来”更准确。
- source_word: כָל הָעָם
  choice: 众民
  rationale: 保留 עָם 的一般意义，不将其过度限定为“军队”；这里指相关的全体民众或追随者。
- source_word: אֵלֶיךָ
  choice: 到你这里
  rationale: 自然表达朝向押沙龙的归回。
- source_word: כְּשׁוּב הַכֹּל
  choice: 众人归回，就像寻回众人一样
  rationale: 希伯来语句法艰涩且可能有文本问题。译文尽量保留“全体归回”的措辞及其比拟结构，不把隐含逻辑完全写死。
- source_word: הָאִישׁ אֲשֶׁר אַתָּה מְבַקֵּשׁ
  choice: 你所寻找的不过是一个人
  rationale: 保留“人”的单数及关系从句，并借“不过”表达亚希多弗将大卫与众民对置的语境含义。
- source_word: יִהְיֶה שָׁלוֹם
  choice: 就都平安了
  rationale: שָׁלוֹם 在这里指冲突结束后安定、无战事的状态；“平安”兼顾政治和平与整体安稳。
theological_decisions:
- issue: 是否明说大卫将被杀或不复存在
  choice: 不明说，只保留“你所寻找的不过是一个人”
  alternative: 你所寻找的那个人一除掉／不在了
  rationale: 希伯来文本本节并未明说“杀死”或“除掉”；虽可由上下文推知，正文不宜把推论写成明文，以保留原文的含蓄与张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“众民”保留经文语体但不过度古雅；分句处理用来避免把艰涩的希伯来结构误译成过于确定的因果关系。
