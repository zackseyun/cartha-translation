base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/005.yaml
  text: Then Absalom said[a], “Please call Hushai the Archite also, and let us hear what he too has to say.”
translation:
  language: zh_hans
  text: 押沙龙说：“也请把亚基人户筛叫来，让我们也听听他有什么话要说。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译：“也听听他口中有什么。”意思是听他有什么话要说。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 前接叙事性连词，主要推动事件发展；现代汉语在上下文中无需机械译出“于是”或“然后”。
- source_word: קְרָא נָא
  choice: 请把……叫来
  rationale: 命令式加 נָא 带请求、缓和语气；“请把……叫来”自然表达这一礼貌意味。
- source_word: גַּם לְחוּשַׁי
  choice: 也……户筛
  rationale: 第一个 גַּם 表示在亚希多弗之外再增加一位受询者，用“也”保留其附加意义。
- source_word: חוּשַׁי הָאַרְכִּי
  choice: 亚基人户筛
  rationale: 户筛为人名；הָאַרְכִּי 是族属称谓，按中文圣经传统音译为“亚基人”。
- source_word: וְנִשְׁמְעָה
  choice: 让我们……听听
  rationale: 第一人称复数祈愿式表达提议或意愿；“让我们……听听”保留共同商议的语气。
- source_word: מַה בְּפִיו
  choice: 他有什么话要说
  rationale: 字面为“他口中有什么”，是指某人的意见或提议；采用自然汉语习语，同时以脚注保留原文意象。
- source_word: גַּם הוּא
  choice: 也……他
  rationale: 第二个 גַּם 强调户筛本人也应当发表意见；汉语通过“也听听他……”自然体现这一重点。
theological_decisions: []
