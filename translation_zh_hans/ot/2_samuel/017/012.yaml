  text: וּ/בָ֣אנוּ אֵלָ֗י/ו ב/אחת הַ/מְּקוֹמֹת֙ אֲשֶׁ֣ר נִמְצָ֣א שָׁ֔ם וְ/נַ֣חְנוּ עָלָ֔י/ו כַּ/אֲשֶׁ֛ר יִפֹּ֥ל הַ/טַּ֖ל עַל הָ/אֲדָמָ֑ה וְ/לֹֽא נ֥וֹתַר בּ֛/וֹ וּ/בְ/כָל הָ/אֲנָשִׁ֥ים אֲשֶׁר אִתּ֖/וֹ גַּם אֶחָֽד־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/012.yaml
  text: Then we will come upon him in one of the places where he is found[a], and we will settle on him just as the dew falls on the ground; and not one will be left of him and of all the men who are with him—not even one.
translation:
  language: zh_hans
  text: 我们必来到他那里，在他被发现的一个地方；我们必覆在他身上，如同露水落在地上。无论是他，还是所有与他同在的人，连一个也不会留下。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבָאנוּ אֵלָיו
  choice: 我们必……找到他
  rationale: בוא אֶל 的基本意思是“来到……那里”；在军事语境中带有逼近并袭击的意味。结合后面的地点从句，汉语用“找到他”自然表达追兵抵达其藏身处，但不额外写入“杀到”等更强烈措辞。
- source_word: בְאַחַת הַמְּקוֹמוֹת אֲשֶׁר נִמְצָא שָׁם
  choice: 在他所在的某一个地方
  rationale: 保留“某一个地方”的不确定性；נמצא 在这里表示他被发现或身处该处，汉语“他所在的”简洁自然。
- source_word: וְנַחְנוּ עָלָיו
  choice: 覆在他身上
  rationale: נוח 本义为“停下、安歇、落在”，并非后一句“落下”的 נפל。此处借露水覆盖地面的比喻描写大军压境；“覆在”既保留静态覆盖感，也避免混同两个希伯来语动词。
- source_word: כַּאֲשֶׁר יִפֹּל הַטַּל עַל הָאֲדָמָה
  choice: 像露水落在地上一样
  rationale: 直译露水落地的比喻，传达无处不及、无法逃脱的军事形象。
- source_word: וְלֹא נוֹתַר בּוֹ וּבְכָל הָאֲנָשִׁים אֲשֶׁר אִתּוֹ גַּם אֶחָד
  choice: 无论是他，还是跟随他的所有人，连一个也不会留下
  rationale: נותר 表示“剩下、存留”；末尾 גם אחד 加强彻底无一幸存的语气。“跟随他的所有人”在此指与大卫同在的一众人。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而清楚的叙事语言。用“覆在”维持 נוח 与随后 נפל（“落”）之间的词义区别，同时使露水覆盖地面的比喻在中文中自然可懂。
