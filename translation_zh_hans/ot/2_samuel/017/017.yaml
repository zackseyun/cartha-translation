base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/017.yaml
  text: Jonathan and Ahimaaz were standing at En-rogel[a], and a female servant would go and tell them, and they would go and tell King David[b], for they could not be seen entering the city.
translation:
  language: zh_hans
  text: 约拿单和亚希玛斯守候在隐·罗结[a]；那婢女[b]会去把消息告诉他们，他们再去禀告大卫王，因为他们不能被人看见进城。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “守候”直译为“站着”；这里可能指他们留在那里待命。
    reason: lexical_alternative
  - marker: b
    text: “婢女”也可译作“女仆”或“女奴”。原文特指女性仆役。
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹמְדִים
  choice: 守候
  rationale: 该分词字面意为“站着”，但与地点连用，并结合秘密传信的语境，表示二人持续留在那里等候消息。“守候”既自然，也保留了驻留待命的意味。
- source_word: בְּעֵין רֹגֵל
  choice: 在隐·罗结
  rationale: 将地名 עֵין רֹגֵל 音译为“隐·罗结”；介词 בְּ 在此表示所在地点，译作“在”。
- source_word: הַשִּׁפְחָה
  choice: 那婢女
  rationale: שִׁפְחָה 特指女性仆役，也可能含女性奴仆之意；定冠词表明她是语境中已知的人物，因此译作“那婢女”。
- source_word: וְהָלְכָה וְהִגִּידָה לָהֶם
  choice: 会去把消息告诉他们
  rationale: 此处在交代既定的传信安排，不只是一次简单的过去动作；“会去”体现程序性，“把消息告诉”自然表达 Hiphil 形式“告知、报告”的含义。
- source_word: וְהֵם יֵלְכוּ וְהִגִּידוּ
  choice: 他们再去禀告
  rationale: 这一动词序列承接前一步，描述他们随后转达消息；“再去”清楚呈现传信次序，“禀告”适合向君王报告的语境。
- source_word: לַמֶּלֶךְ דָּוִד
  choice: 大卫王
  rationale: 按现代汉语的自然称谓次序处理“王大卫”，译作“大卫王”。
- source_word: כִּי לֹא יוּכְלוּ לְהֵרָאוֹת
  choice: 因为他们不能让人看见自己
  rationale: כִּי 引出这项安排的原因；ראה 的 Niphal 不定式在此表示“被看见”。中文用“让人看见自己”清楚表达他们必须避免被发现，并保留主语所受限制的含义。
- source_word: לָבוֹא הָעִירָה
  choice: 进城
  rationale: עִירָה 的方向词尾表示朝城里移动；“进城”简洁自然。
theological_decisions: []
translation_notes:
  register: 采用庄重而明白的现代标准汉语。用分号连接所在地点与随后的传信安排，保持原文连续叙事的节奏；“会……再……”呈现既定传信程序。地名采用常见圣经汉语音译并加间隔号。
