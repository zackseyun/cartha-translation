base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/021.yaml
  text: After they had gone, they came up out of the well and went and told King David. They said to David, “Get up and cross over the water quickly, for this is what Ahithophel has advised against you.”
translation:
  language: zh_hans
  text: 他们走后，二人就从井里上来，去禀告大卫王。他们对大卫说：“快起来，渡过河去！因为亚希多弗已经这样献计要对付你们。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַחֲרֵי לֶכְתָּם
  choice: 他们走后
  rationale: 按上下文，“他们”指离开的押沙龙仆人；保留原文代词，不在正文中明说身份。
- source_word: מֵהַבְּאֵר
  choice: 从井里
  rationale: בְּאֵר通常指井；“上来”自然表达二人先前藏身井中的情景。
- source_word: ק֣וּמוּ וְעִבְר֤וּ מְהֵרָה֙
  choice: 快起来，渡过河去
  rationale: 兼顾两个命令和“赶快”的紧迫语气；中文把“快”前置更自然。
- source_word: אֶת הַמַּיִם
  choice: 渡过河去
  rationale: 字面为“过水”；在此指渡过约旦河，以自然汉语明确这一动作，但不在正文补出“约旦河”。
- source_word: יָעַץ עֲלֵיכֶם
  choice: 献计要对付你们
  rationale: יָעַץ表示出谋划策，עֲלֵיכֶם在此带敌对方向；“献计要对付你们”准确传达其含义。
theological_decisions:
- issue: 是否将“这样献计”具体化为亚希多弗的计划内容
  choice: 保留“已经这样献计”的指代形式
  alternative: 展开为“献计追赶并袭击你们”
  rationale: 原文仅用כָכָה回指先前所述计划；不在本节加入解释性内容，以保留叙事衔接。
- issue: 命令中复数对象的表达
  choice: 用“你们”对应大卫及其随从
  alternative: 按直接称呼大卫而译为单数“你”
  rationale: 原文命令和“对付你们”均为复数，表明话虽对大卫说，却涉及整个队伍。
translation_notes:
  register: 采用现代、庄重而清楚的叙事语言。“禀告”体现向君王报告的语境；引语用简明有力的命令句呈现紧迫感。
