base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/020.yaml
  text: Absalom’s servants came to the woman at the house and said[a], “Where are Ahimaaz and Jonathan?” The woman said to them, “They crossed over the brook of water.” They searched, but did not find them, so they returned to Jerusalem.
translation:
  language: zh_hans
  text: 押沙龙的仆人来到那妇人的住处，问她：“亚希玛斯和约拿单在哪里？”妇人回答：“他们已经过了水道[a]。”仆人四处搜寻，却没有找到他们，就返回耶路撒冷去了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “水道”也可译作“溪流”或“水渠”。这里的希伯来语短语（מִיכַל הַמָּיִם）很罕见，所指水道的确切性质不能确定。
    reason: lexical_alternative
lexical_decisions:
- source_word: עַבְדֵי אַבְשָׁלוֹם
  choice: 押沙龙的仆人
  rationale: עֶבֶד 可指奴仆、臣仆或受差遣办事的人；本处指为押沙龙办事的人。“仆人”既贴近原文，又不武断强调其法律身份。
- source_word: אֶל הָאִשָּׁה הַבַּיְתָה
  choice: 来到那妇人家
  rationale: הַבַּיְתָה 带方向词尾，表示朝房屋而去；现代汉语用“来到那妇人家”自然地表达他们抵达妇人所在的住处，同时不强行断定他们进了屋内。
- source_word: אַיֵּה
  choice: 在哪里
  rationale: 这是询问地点的疑问词；汉语无需按后接两个人名改变形式。
- source_word: עָבְרוּ
  choice: 已经过了
  rationale: עבר 在此表示经过或越过；“过了”保留其基本空间意义，“已经”符合妇人声称二人不再在此处的语境。
- source_word: מִיכַל הַמָּיִם
  choice: 水沟
  rationale: 该希伯来语短语罕见且含义不完全确定，大概指小型水道或水流。“水沟”通俗自然，但以脚注保留“溪流、水渠”等可能。
- source_word: וַיְבַקְשׁוּ
  choice: 四处搜寻
  rationale: בקשׁ 在本语境指搜查寻找人；“四处搜寻”自然表现他们在当地搜查的行动，但不添加具体搜查地点。
- source_word: וְלֹא מָצָאוּ
  choice: 却没有找到他们
  rationale: 原文宾语从上下文省略，汉语补出“他们”可避免歧义；“却”自然表达搜寻未果的转折。
- source_word: וַיָּשֻׁבוּ יְרוּשָׁלִָם
  choice: 就返回耶路撒冷去了
  rationale: שׁוב 表示返回；“就”顺畅呈现搜寻未果之后的叙事结果。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“押沙龙”“亚希玛斯”“约拿单”“耶路撒冷”依照现代中文圣经常用译名。脚注标记置于其实际解释的“水沟”之后。
