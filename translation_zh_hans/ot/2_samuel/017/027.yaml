base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/027.yaml
  text: When David came to Mahanaim, Shobi son of Nahash from Rabbah of the Ammonites, and Machir son of Ammiel from Lo-debar, and Barzillai the Gileadite from Rogelim,
translation:
  language: zh_hans
  text: 大卫来到玛哈念时，来自亚扪人拉巴的拿辖之子朔比、来自罗底巴的亚米利之子玛吉，以及来自罗基琳的基列人巴西莱，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כְּבוֹא
  choice: ……来到……时
  rationale: וַיְהִי 推进叙事，כְּבוֹא 是带时间意义的介词加不定词结构；现代汉语用“来到……时”自然表达，无须机械译出“事情发生了”。
- source_word: מַחֲנָיְמָה
  choice: 来到玛哈念
  rationale: 地名后的方向词尾 ה 表示朝向该地；汉语动词“来到”已清楚表达这一方向。
- source_word: שֹׁבִי בֶן נָחָשׁ
  choice: 拿辖之子朔比
  rationale: 按现代汉语常用的谱系表达调整语序，同时保留父子关系和专名。
- source_word: מֵרַבַּת בְּנֵי עַמּוֹן
  choice: 亚扪人的拉巴来的
  rationale: רַבָּה 是城名“拉巴”，בְּנֵי עַמּוֹן 是族群及地域称谓“亚扪人”；此译明确说明拉巴属于亚扪人。
- source_word: מָכִיר בֶן עַמִּיאֵל
  choice: 亚米利之子玛吉
  rationale: 保留人名及标准父子关系结构。
- source_word: מִלֹּא דְבָר
  choice: 罗底巴来的
  rationale: 将地名 לֹא דְבָר 按中文圣经传统音译为“罗底巴”，介词 מִן 译为“来自”。
- source_word: בַרְזִלַּי הַגִּלְעָדִי
  choice: 基列人巴西莱
  rationale: הַגִּלְעָדִי 是表示地域身份的称谓，译作“基列人”；人名按通行译名音译。
- source_word: מֵרֹגְלִים
  choice: 罗基琳来的
  rationale: 介词 מִן 表示来源，רֹגְלִים 是地名，按通行形式音译。
theological_decisions: []
