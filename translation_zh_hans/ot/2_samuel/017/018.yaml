  text: וַ/יַּ֤רְא אֹתָ/ם֙ נַ֔עַר וַ/יַּגֵּ֖ד לְ/אַבְשָׁלֹ֑ם וַ/יֵּלְכוּ֩ שְׁנֵי/הֶ֨ם מְהֵרָ֜ה וַ/יָּבֹ֣אוּ אֶל בֵּֽית אִ֣ישׁ בְּ/בַחוּרִ֗ים וְ/ל֥/וֹ בְאֵ֛ר בַּ/חֲצֵר֖/וֹ וַ/יֵּ֥רְדוּ שָֽׁם׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/018.yaml
  text: But a young man saw them and told Absalom[a], so the two of them went quickly and came to the house of a man in Bahurim, who had a well in his courtyard, and they went down there.
translation:
  language: zh_hans
  text: 有个年轻人看见了他们，就告诉押沙龙。于是他们二人急忙前往，来到巴户琳一个人的家中；那人的院子里有一口井，他们便下到那里[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们便下到井里。”
    reason: 原文直译为“下到那里”；上下文表明所指很可能是那口井，但希伯来文此处使用的是地点副词“那里”，没有重复“井”字。
lexical_decisions:
- source_word: נַעַר
  choice: 年轻人
  rationale: 该词可指男孩、青年或侍从；此处人物能够观察并独自报信，“年轻人”既自然，也不过度限定其年龄或身份。
- source_word: וַיַּגֵּד
  choice: 去告诉
  rationale: נגד 的使役词干在此表示把所见之事告知或报告给押沙龙；“去告诉”符合现代汉语叙事表达。
- source_word: שְׁנֵיהֶם
  choice: 他们二人
  rationale: 原文明确指出是两个人；“他们二人”简洁地保留这一信息。
- source_word: מְהֵרָה
  choice: 赶紧
  rationale: 该词作副词表示急速、匆忙；“赶紧”自然地传达局势的紧迫感。
- source_word: בֵּית אִישׁ
  choice: 一个人的家
  rationale: 原文为“一个人的房屋”；按上下文译作“一个人的家”，自然且不增添此人的身份。
- source_word: בְּבַחוּרִים
  choice: 在巴户琳
  rationale: בַחוּרִים 是地名，采用通行音译“巴户琳”，介词按地点关系译为“在”。
- source_word: בְאֵר
  choice: 井
  rationale: 该词通常指井；下一节提到遮盖井口，也与此义相符，无须改译为“蓄水池”。
- source_word: בַּחֲצֵרוֹ
  choice: 那人的院子里
  rationale: חָצֵר 指住宅所属的庭院或围院；“院子”是清楚、自然的现代汉语表达。
- source_word: וַיֵּרְדוּ שָׁם
  choice: 他们便下到那里
  rationale: 原文直译为“他们下到那里”，并未明说“井里”。正文保留其指向略含蓄的表达，脚注说明按语境可明确译为进入井中。
