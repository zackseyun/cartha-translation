  to: 有个年轻人看见了他们，就告诉押沙龙。于是他们二人急忙前往，来到巴户琳一个人的家中；那人的院子里有一口井，他们便下到那里[a]。
  rationale: 仅将“赶紧离开”改为“急忙前往”，以消除原文未明说的“离开”动作，同时保留迅速行动及随后抵达的叙事推进。其余译文和脚注均可保留。
