  yaml_path: translation/ot/2_samuel/017/007.yaml
  text: Then Hushai said to Absalom[a], “The counsel that Ahithophel has given this time is not good.”
translation:
  language: zh_hans
  text: 户筛对押沙龙说：“亚希多弗这一次[a]出的主意不好。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “这一次”也可译作“在这个场合”。
    reason: 保留 בַּפַּעַם הַזֹּאת 的语境性表达所容许的另一种译法。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 希伯来语叙事中的连续式推动情节；现代汉语在上下文中用“说”即可自然表达叙事承接，无须机械加上“然后”。
- source_word: חוּשַׁי
  choice: 户筛
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: אֶל־אַבְשָׁלוֹם
  choice: 对押沙龙
  rationale: 介词 אֶל 在言说结构中自然译为“对”；“押沙龙”为通行人名译法。
- source_word: לֹא טוֹבָה
  choice: 不好
  rationale: 忠实保留原文宽泛而直接的否定评价；不具体化为“不可行”或“不明智”，以免缩窄含义。
- source_word: הָעֵצָה
  choice: 主意
  rationale: עֵצָה 在此指政治和军事方面所献的计策或意见；“主意”自然易懂，也符合户筛对具体方案的评价。
- source_word: אֲשֶׁר יָעַץ
  choice: 出的
  rationale: 与“主意”搭配为自然现代汉语，表达亚希多弗已经提出这项计策；避免照搬词根重复而形成生硬的“所谋的谋略”。
- source_word: אֲחִיתֹפֶל
  choice: 亚希多弗
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: בַּפַּעַם הַזֹּאת
  choice: 这一次
  rationale: 该短语表示“这一次”或“在这个场合”；“这一次”简洁自然，并暗示评价针对当前这项建议，而非笼统否定亚希多弗的一切谋略。
