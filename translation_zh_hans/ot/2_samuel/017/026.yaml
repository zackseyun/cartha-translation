lexical_decisions:
- source_word: וַיִּחַן
  choice: 安营
  rationale: 动词 חנה 在此表示军队驻扎、设营；“安营”简洁自然，也保留军事行动的语境。
- source_word: יִשְׂרָאֵל
  choice: 以色列人
  rationale: 此处“以色列”是集合称谓，指跟随押沙龙的以色列军民；汉语译作“以色列人”可自然表达其复数集合意义，又不额外限定为军队。
- source_word: וְאַבְשָׁלֹם
  choice: 和押沙龙
  rationale: 连词把押沙龙与以色列并列为共同主语；采用现代中文通行人名“押沙龙”。
- source_word: אֶרֶץ הַגִּלְעָד
  choice: 基列地
  rationale: אֶרֶץ 加地名表示该地的土地或地域；“基列地”是简洁、清楚且通行的中文地理称呼。
