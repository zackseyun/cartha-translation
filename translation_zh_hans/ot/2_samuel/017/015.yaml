base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/015.yaml
  text: Then Hushai said to Zadok and to Abiathar the priests[a], “This and that is what Ahithophel advised Absalom and the elders of Israel, and this and that is what I have advised.”
translation:
  language: zh_hans
  text: 户筛随后对祭司撒督和亚比亚他说：“亚希多弗给押沙龙和以色列的长老出了如此这般的主意[a]；我则出了如此这般的主意。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“这样和这样”，是概述谈话内容、而不逐字复述的惯用说法。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 随后……说
  rationale: 未完成式连续体推进叙事；“随后”自然表达事件的先后关系。
- source_word: חוּשַׁי
  choice: 户筛
  rationale: 按现代中文圣经人名的通行译法音译。
- source_word: אֶל צָדוֹק וְאֶל אֶבְיָתָר הַכֹּהֲנִים
  choice: 对祭司撒督和亚比亚他
  rationale: “祭司”在希伯来文中是复数，作同位语修饰两个人名；中文将共同身份置于人名前，清楚而自然。
- source_word: כָּזֹאת וְכָזֹאת
  choice: 如此这般
  rationale: 这是省略具体内容、概述所说之话或所出主意的惯用语。“如此这般”既保留原文不逐字复述的表达方式，也符合庄重而可懂的现代中文。
- source_word: יָעַץ
  choice: 出了……主意
  rationale: 此处指政治和军事方面的献策；“出主意”比生硬的“劝告”更贴合语境。
- source_word: אֶת אַבְשָׁלֹם וְאֵת זִקְנֵי יִשְׂרָאֵל
  choice: 给押沙龙和以色列的长老
  rationale: 用“给”自然标明献策的对象，同时保留押沙龙与以色列长老并列的结构。
- source_word: יָעַצְתִּי אָנִי
  choice: 我则出了
  rationale: 独立代词 אָנִי 强调“我”；“我则”自然保留户筛之计与亚希多弗之计的对照。
theological_decisions: []
