source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אַבְשָׁלוֹם֙ וְ/כָל אִ֣ישׁ יִשְׂרָאֵ֔ל טוֹבָ֗ה עֲצַת֙ חוּשַׁ֣י הָ/אַרְכִּ֔י מֵ/עֲצַ֖ת אֲחִיתֹ֑פֶל וַ/יהוָ֣ה צִוָּ֗ה לְ/הָפֵ֞ר אֶת עֲצַ֤ת אֲחִיתֹ֨פֶל֙ הַ/טּוֹבָ֔ה לְ/בַ/עֲב֗וּר הָבִ֧יא יְהוָ֛ה אֶל אַבְשָׁל֖וֹם אֶת הָ/רָעָֽה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/014.yaml
  text: Then Absalom and all the men of Israel said[a], “The counsel of Hushai the Archite is better than the counsel of Ahithophel.” For Yahweh had ordained to frustrate the good counsel of Ahithophel[b], so that Yahweh might bring disaster on Absalom.
translation:
  language: zh_hans
  text: 于是，押沙龙和以色列众人都说：“亚基人户筛的计策比亚希多弗的计策好。”原来，耶和华已经定意要使亚希多弗的良策落空[a]，为要使灾祸临到押沙龙[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “定意”也可译作“命令”。这里指耶和华所作的有效决定，要使亚希多弗的计策不能实现。
    reason: 保留צִוָּה通常具有的“命令”词义，并说明本句中的语境用法。
  - marker: b
    text: “灾祸”所译的希伯来语也可表示“恶”或“祸患”；这里指审判中临到押沙龙的毁灭和伤害。
    reason: 说明רָעָה的词义范围，避免把语境中的灾难意义误解为道德邪恶。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 于是……说
  rationale: 连续式叙事动词推进情节；“于是”符合现代汉语叙事习惯。
- source_word: וְכָל אִישׁ יִשְׂרָאֵל
  choice: 以色列众人都
  rationale: אִישׁ虽为单数形式，在这里具有集合意义；“众人都”自然表达全体在场以色列人的一致判断。
- source_word: טוֹבָה ... מֵעֲצַת
  choice: 计策比……的计策好
  rationale: 介词מִן构成比较，故译出“比……好”；上下文涉及军事谋划，“计策”兼顾建议与方案之意。
- source_word: חוּשַׁי הָאַרְכִּי
  choice: 亚基人户筛
  rationale: 按中文圣经人名与族称的通行音译，הָאַרְכִּי作为户筛的族属称谓处理。
- source_word: צִוָּה
  choice: 定意
  rationale: 该动词通常表示“命令”，但此处描述耶和华使某项谋略失效的有效决定；“定意”在汉语中自然表达这一语境含义，同时以脚注保留较直译的可能。
- source_word: לְהָפֵר
  choice: 使……落空
  rationale: פרר的使役式在此指挫败、废除或使计策不能奏效；“使……落空”清楚传达策略被挫败的含义。
- source_word: הַטּוֹבָה
  choice: 良策
  rationale: 保留经文对亚希多弗计策本身的正面评价，不因其服务于押沙龙而改译为负面措辞。
- source_word: לְבַעֲבוּר הָבִיא
  choice: 好把……降到
  rationale: לְבַעֲבוּר引出目的或预期结果；“好……”简洁自然地表达这一关系。
- source_word: הָרָעָה
  choice: 灾祸
  rationale: רָעָה可指邪恶、伤害或灾难；这里所指是临到押沙龙的毁灭性祸患，译为“灾祸”最合语境，同时脚注保留词义范围。
theological_decisions:
- issue: 如何译写神名יְהוָה
  choice: 耶和华
  alternative: 雅威
  rationale: 原文两次使用四字神名；正文采用现代中文读者最熟悉且庄重的专名“耶和华”，并保留其作为专名而非普通称号的性质。
- issue: 如何表达צִוָּה לְהָפֵר所述的神圣行动
  choice: 已经定意要使……落空
  alternative: 已经命令要破坏……
  rationale: 原文明确把亚希多弗计策的失败归于耶和华有效的旨意；“定意”避免在汉语中产生神向某个未明说对象下达口头命令的误解，又不削弱神主动决定的意味。
- issue: 神所降下的הָרָעָה
  choice: 灾祸
  alternative: 祸患；恶事
  rationale: 语境指押沙龙将遭受的毁灭与审判，而非把道德邪恶归给神；“灾祸”保留负面后果及审判张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“计策”“良策”“落空”既适合宫廷与军事谋略语境，也便于普通读者理解。正文保留原文先由众人评价户筛计策、随后由叙述者揭示耶和华旨意的结构与神学张力。
