  text: וְ/עַתָּ֡ה שִׁלְח֣וּ מְהֵרָה֩ וְ/הַגִּ֨ידוּ לְ/דָוִ֜ד לֵ/אמֹ֗ר אַל תָּ֤לֶן הַ/לַּ֨יְלָה֙ בְּ/עַֽרְב֣וֹת הַ/מִּדְבָּ֔ר וְ/גַ֖ם עָב֣וֹר תַּעֲב֑וֹר פֶּ֚ן יְבֻלַּ֣ע לַ/מֶּ֔לֶךְ וּ/לְ/כָל הָ/עָ֖ם אֲשֶׁ֥ר אִתּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/016.yaml
  text: Now send quickly and tell David[a], saying, ‘Do not stay tonight at the fords of the wilderness, but be sure to cross over, lest the king and all the people who are with him be swallowed up.’
translation:
  language: zh_hans
  text: 现在，你们要赶快派人去告诉大卫说：“今晚不要在旷野的平原[a]过夜，务必要渡过去，免得王和跟随他的众人都被吞灭。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“在旷野的渡口”。希伯来语通常指旷野的平原或低地；但下文强调必须渡过去，因此这里也可能是指约旦河附近的过河地点。
    reason: 说明地理用语的词义范围及语境所容许的另一种理解。
lexical_decisions:
- source_word: וְעַתָּה
  choice: 现在
  rationale: 作为话语标记，引出必须立刻采取的行动，保留原文的紧迫感。
- source_word: שִׁלְחוּ מְהֵרָה
  choice: 要赶快派人去
  rationale: 命令式与表示迅速的成分合用；汉语补出“人去”，自然表达派遣信使的含义。
- source_word: וְהַגִּידוּ לְדָוִד לֵאמֹר
  choice: 告诉大卫说
  rationale: 保留希伯来语传话公式，在现代中文叙事中也清楚自然。
- source_word: אַל תָּלֶן הַלַּיְלָה
  choice: 今晚不要……过夜
  rationale: לון 指住宿或过夜；这一表达准确而符合现代汉语习惯。
- source_word: בְּעַרְבוֹת הַמִּדְבָּר
  choice: 在旷野的平原
  rationale: עֲרָבוֹת 通常指干旱地区的平原或低地；原文本身并非表示“渡口”的常用词，因此正文保留其直接地理含义，并以脚注说明语境中的另一种理解。
- source_word: וְגַם עָבוֹר תַּעֲבוֹר
  choice: 务必要渡过去
  rationale: 不定式绝对形与同根限定动词连用，强化“渡过去”的命令；“务必要”自然传达这一强调。וְגַם 在这里推进并加强前一命令，无须机械译作“也”。
- source_word: פֶּן
  choice: 免得
  rationale: 准确表达警告及所要避免的后果。
- source_word: יְבֻלַּע
  choice: 被吞灭
  rationale: 保留 בלע“吞下、吞没”的鲜明意象，同时“吞灭”在军事危难语境中自然表达毁灭之意。
- source_word: לַמֶּלֶךְ
  choice: 王
  rationale: 原文以称号指大卫，译文保留这一政治身份，而不直接改写为人名。
- source_word: וּלְכָל הָעָם אֲשֶׁר אִתּוֹ
  choice: 和跟随他的众人
  rationale: עָם 在此指与大卫同在的全体人众，不限于军队；“跟随他的众人”简洁表达关系从句。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“务必要”体现希伯来语同根形式叠用所表达的强烈命令；“被吞灭”保留原文的形象化警告。脚注标记紧接其所说明的地理短语。
