base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/022.yaml
  text: Then David arose[a], and all the people who were with him, and they crossed the Jordan. By morning light, not one was missing who had not crossed the Jordan.
translation:
  language: zh_hans
  text: 大卫起来；他和跟随他的众人都渡过了约旦河。到天亮时[a]，没有一人未渡过约旦河。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“直到晨光出现时”。希伯来文既保留晨光的意象，也可表示渡河完成所达到的时间界限。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: 起来
  rationale: קום的Qal叙事形式基本义为“起来”；这里也推动叙事向前，但不宜直接增译为更具解释性的“动身”。
- source_word: וְכָל הָעָם אֲשֶׁר אִתּוֹ
  choice: 和跟随他的众人
  rationale: הָעָם指与大卫同行的整个群体，并非专指成年男子；“跟随他的众人”在现代汉语中自然地表达“与他同在的人”。
- source_word: וַיַּעַבְרוּ אֶת הַיַּרְדֵּן
  choice: 渡过了约旦河
  rationale: עבר以约旦河为直接宾语，表示渡过河流；“渡过”比一般性的“经过”更准确。
- source_word: עַד אוֹר הַבֹּקֶר
  choice: 到天亮时
  rationale: 该短语字面涉及“直到早晨的光”，在语境中标明渡河完成的时间界限；正文采用自然的时间表达，脚注保留晨光意象及“直到”的可能译法。
- source_word: עַד אַחַד לֹא נֶעְדָּר אֲשֶׁר לֹא עָבַר אֶת הַיַּרְדֵּן
  choice: 没有一个人还未渡过约旦河
  rationale: 希伯来文以否定结构强调无人遗漏、全员都已过河。此译保留“没有一个……未……”的强调方式，同时避免生硬地逐字重复“缺少”。
theological_decisions: []
