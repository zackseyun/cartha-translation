  naturalness: “若起初有人在他们中间倒下”语序略显生硬。“万一一开始他们中间就有人倒下”更符合现代汉语叙事和假设语气。“一个坑里”可保留，但“一个坑洼处”较能涵盖该词既可指坑、也可指地势凹处的范围。
  terminology: “跟随押沙龙的人”准确表达政治、军事上的追随关系。“遭到重创”可用，但“惨重的伤亡”更直接对应战事中“מגפה”所指的严重击杀／打击，并避免将其仅理解为抽象的失败。脚注应紧贴所注词语，并说明这不是疾病或瘟疫。
