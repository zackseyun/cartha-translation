base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/009.yaml
  text: Look[a], right now he is hidden in one of the pits or in one of the other places. And when some of them fall at the first attack, whoever hears it will say[b], ‘There has been a slaughter among the people who follow Absalom.’
translation:
  language: zh_hans
  text: 看哪，他此刻正藏身在一个坑洼处，或在别的某个地方。万一一开始他们中间就有人倒下，听见的人必会说：“跟随押沙龙的人遭受了惨重的伤亡。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “惨重的伤亡”也可译作“惨败”或“沉重的打击”。这里的希伯来语在军事语境中指严重的击杀或打击，不是疾病或瘟疫。
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה עַתָּה
  choice: 看哪，他现在
  rationale: “看哪”保留引人注意的鲜明语气，“现在”传达眼前情势的紧迫感，同时保持庄重自然。
- source_word: נֶחְבָּא
  choice: 正藏在
  rationale: 希伯来语为尼法勒分词，可表达“处于隐藏状态”。译文不明确说明是谁使他藏起来，以保留原文对施事者的含混。
- source_word: בְּאַחַת הַפְּחָתִים
  choice: 在一个坑里
  rationale: פְּחָתִים可指坑、洼地或地势中的凹处；正文采用直观的“坑”，但不把地形性质说得过细。
- source_word: אוֹ בְּאַחַד הַמְּקוֹמֹת
  choice: 或某个别的地方
  rationale: 原文表达宽泛的不定地点；“别的”自然体现与前述坑穴之间的选择关系。
- source_word: כִּנְפֹל בָּהֶם בַּתְּחִלָּה
  choice: 若起初有人在他们中间倒下
  rationale: 此结构存在句法歧义，可指在押沙龙一方中有人伤亡，也有人理解为大卫突然袭击他们。正文采用较符合后续战败传闻的前者，并以“倒下”保留军事伤亡表达。
- source_word: הַשֹּׁמֵעַ
  choice: 听见这消息的人
  rationale: 定冠词分词在此具有泛指意义；中文如此表达自然，也把所听见的是前述战况说明清楚。
- source_word: מַגֵּפָה
  choice: 重创
  rationale: 在军事语境中指严重击打、伤亡或败绩，并非疾病意义的“瘟疫”。“重创”兼顾军事打击和伤亡后果，避免“屠杀”可能带来的过度限定。
- source_word: הָעָם אֲשֶׁר אַחֲרֵי אַבְשָׁלֹם
  choice: 跟随押沙龙的人
  rationale: אַחֲרֵי在这里表示拥护、追随，而不是空间上的追赶；译文保留“人／民众”的宽泛范围，不擅自限为正规军。
