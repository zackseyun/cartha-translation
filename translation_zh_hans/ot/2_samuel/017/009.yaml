revisions:
- from: 看哪，他现在正藏在一个坑里，或某个别的地方。若起初有人在他们中间倒下，听见这消息的人就会说：“跟随押沙龙的人遭到重创了。”[a]
  to: 看哪，他此刻正藏身在一个坑洼处，或在别的某个地方。万一一开始他们中间就有人倒下，听见的人必会说：“跟随押沙龙的人遭受了惨重的伤亡。”[a]
  rationale: 修订仅改善现代汉语的条件句和地形词覆盖范围，并将脚注锚点贴近所释的军事用语。正文仍采用“他们中间有人倒下”的理解；这与上下文中随后流传押沙龙追随者受创的消息相合，同时不额外说明是谁造成伤亡。
