base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/029.yaml
  text: and honey and curds and sheep and cheese from the herd they brought near for David and for the people who were with him to eat[a], for they said[c][b], “The people are hungry and weary and thirsty in the wilderness.”
translation:
  language: zh_hans
  text: 他们把蜂蜜、凝乳[a]、羊[b]和牛乳干酪[c]送来，给大卫和同他在一起的人吃，因为他们说：“百姓在旷野又饿、又疲乏、又口渴。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “凝乳”或译“黄油”或“奶油”；原文可泛指乳制品，这里很可能不是现代意义的黄油。
    reason: lexical_alternative
  - marker: b
    text: “羊”原文是集合名词，也可统指绵羊和山羊等小型牲畜。
    reason: lexical_alternative
  - marker: c
    text: “牛乳干酪”所译的希伯来语词组含义不完全确定，指以牛乳制成的乳制品；有些译本作较笼统的“奶酪”或“乳制品”。
    reason: lexical_alternative
lexical_decisions:
- source_word: דְבַשׁ
  choice: 蜂蜜
  rationale: 该词通常指蜂蜜；虽有时可泛指甜浆，但在这份食物清单中译作“蜂蜜”最自然。
- source_word: חֶמְאָה
  choice: 凝乳
  rationale: 在圣经希伯来语中，该词往往指凝结或发酵的乳制品，不一定是现代意义的黄油；“凝乳”较符合古代饮食背景。
- source_word: צֹאן
  choice: 羊
  rationale: 该集合名词可包括绵羊和山羊；正文用简洁自然的“羊”，脚注保留其较宽泛的范围。
- source_word: שְׁפוֹת בָּקָר
  choice: 牛乳干酪
  rationale: 这一罕见词组指与牛有关的乳制品，确切制法难以确定；“牛乳干酪”保留其来自牛乳的具体含义，同时避免过度说明制作方式。
- source_word: הִגִּישׁוּ
  choice: 送来
  rationale: 该动词有“带近、呈上”之意；在供应食物的叙事语境中，“送来”自然且准确。
- source_word: לְדָוִד וְלָעָם אֲשֶׁר אִתּוֹ
  choice: 给大卫和同他在一起的人
  rationale: 忠实表达食物的接受者，并用现代汉语自然呈现关系从句“与他同在的人”。
- source_word: לֶאֱכֹל
  choice: 吃
  rationale: 该不定式表示目的；放在“给……吃”的结构中简洁自然。
- source_word: כִּי אָמְרוּ
  choice: 因为他们说
  rationale: כִּי在这里说明送来食物的原因，“因为他们说”保留原文的解释关系。
- source_word: רָעֵב וְעָיֵף וְצָמֵא
  choice: 又饿、又疲乏、又口渴
  rationale: 保留三个并列状态及其节奏，不额外强化原文的程度。
- source_word: בַּמִּדְבָּר
  choice: 在旷野
  rationale: מִדְבָּר通常指人烟稀少的荒野或草原地带，并非专指沙漠；“旷野”范围较准确。
