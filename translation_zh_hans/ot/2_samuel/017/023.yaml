  text: וַ/אֲחִיתֹ֣פֶל רָאָ֗ה כִּ֣י לֹ֣א נֶעֶשְׂתָה֮ עֲצָת/וֹ֒ וַ/יַּחֲבֹ֣שׁ אֶֽת הַ/חֲמ֗וֹר וַ/יָּ֜קָם וַ/יֵּ֤לֶךְ אֶל בֵּית/וֹ֙ אֶל עִיר֔/וֹ וַ/יְצַ֥ו אֶל בֵּית֖/וֹ וַ/יֵּחָנַ֑ק וַ/יָּ֕מָת וַ/יִּקָּבֵ֖ר בְּ/קֶ֥בֶר אָבִֽי/ו־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/023.yaml
  text: When Ahithophel saw that his counsel had not been followed[a], he saddled the donkey, arose, and went to his house in his city. He gave orders to his household, then hanged himself and died[c][b]; and he was buried in his father's tomb.
translation:
  language: zh_hans
  text: 亚希多弗见自己的计谋没有被采纳[a]，就给那头驴备上鞍，动身前往自己城里的家。他嘱咐了家里的人[b]，然后上吊身亡[c]。他被葬在他父亲的坟墓里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“自己的计谋没有被实行。”希伯来原文直译为“他的计谋没有被做成”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“把家事安排妥当。”希伯来原文更直接地说，他“嘱咐了他的家（家人）”。
    reason: lexical_alternative
  - marker: c
    text: 或译：“勒死自己。”这个动词可以指上吊或勒颈窒息；在本节语境中是指亚希多弗自杀。
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲצָתוֹ
  choice: 自己的计谋
  rationale: עֵצָה可指劝告、谋略或计划；本节处于政治与军事谋划的语境，“计谋”兼顾其建议和策略性质。
- source_word: לֹא נֶעֶשְׂתָה
  choice: 没有被采纳
  rationale: 字面为“没有被实行/做成”；结合上下文，是指亚希多弗的建议未获采用。“没有被采纳”在现代汉语中自然，同时脚注保留“没有被实行”的可能表达。
- source_word: וַיַּחֲבֹשׁ אֶת־הַחֲמוֹר
  choice: 给那头驴备上鞍
  rationale: חבש用于驴时表示为骑行备鞍；原文是带定冠词的“那头驴”，没有所有格，因此不增译为“他的驴”。
- source_word: וַיָּקָם וַיֵּלֶךְ
  choice: 动身回到
  rationale: 两个连续叙事动词字面为“起来，去”；汉语以“动身回到”自然表达行动的开始和目的地。
- source_word: אֶל־בֵּיתוֹ אֶל־עִירוֹ
  choice: 回到自己城里的家
  rationale: 保留“他的家”和“他的城”两个要素，并按现代汉语习惯处理二者关系。
- source_word: וַיְצַו אֶל־בֵּיתוֹ
  choice: 嘱咐了家里的人
  rationale: 原文近于“吩咐/嘱咐他的家（家人）”；此译保持对象为家中之人，不把含义直接限定为较具解释性的“把家事安排妥当”。
- source_word: וַיֵּחָנַק
  choice: 上吊身亡
  rationale: 该动词可表示被勒住、窒息，在本语境中为自杀。“上吊身亡”是自然的汉语表达，但脚注保留“勒死自己”的词义可能。
- source_word: בְּקֶבֶר אָבִיו
  choice: 在他父亲的坟墓里
  rationale: קֶבֶר可译坟墓或墓穴；“他父亲的坟墓”直接保留单数父亲指称，不扩展为祖坟。
theological_decisions:
- issue: 亚希多弗死亡方式中的施事与具体方式
  choice: 上吊身亡
  alternative: 勒死自己／被勒死
  rationale: 上下文明确叙述其自杀，但希伯来动词本身可涉及勒住或窒息；正文采用自然且符合情境的表达，脚注提示词义范围，避免将语法歧义完全抹去。
translation_notes:
  register: 采用现代、庄重而易懂的叙事文体。“备上鞍”“动身”“嘱咐”等表达自然清晰；不仿照希伯来语逐个堆叠连接词，但保留事件的先后次序。所有脚注标记均置于相关正文表达之后。
