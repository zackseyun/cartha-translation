- from: 即使是勇士，心像狮子的心，也必完全胆寒[a]；因为全以色列都知道，你父亲是大能的勇士[b]，跟随他的也都是勇士。
  to: 即使是心像狮子心一样的勇士，也必完全胆寒[a]；因为全以色列都知道，你父亲是个英勇的战士[b]，与他同在的也都是勇士。
  rationale: 修订“跟随他的”为“与他同在的”，以避免增添原文没有的跟随含义；调整首句语序，使中文自然且保留狮心比喻；将“大能的勇士”改为“英勇的战士”，更贴合本处军事语境。脚注锚点维持在相应词语之后，并保留强调式与词义替代说明。
