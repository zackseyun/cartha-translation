base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/010.yaml
  text: Even the valiant man whose heart is like a lion’s heart will utterly melt[a], for all Israel knows that your father is a mighty man[b], and that the men with him are valiant men.
translation:
  language: zh_hans
  text: 即使是心像狮子心一样的勇士，也必完全胆寒[a]；因为全以色列都知道，你父亲是个英勇的战士[b]，与他同在的也都是勇士。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“必融化，融化”，是加强语气的结构，意思是“必完全丧胆”。
    reason: lexical_alternative
  - marker: b
    text: “英勇的战士”也可译作“大能者”或“大有能力的勇士”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן חַיִל
  choice: 勇士
  rationale: 该习语直译为“能力／勇力之子”，在军事语境中指英勇善战的人；“勇士”自然简洁，并与本节后半句的同源复数表达保持呼应。
- source_word: לִבּוֹ כְּלֵב הָאַרְיֵה
  choice: 心像狮子的心
  rationale: 保留希伯来文的明喻及“心”的重复，呈现勇气如狮子的鲜明形象。
- source_word: הִמֵּס יִמָּס
  choice: 必完全胆寒
  rationale: 此处以不定词绝对式配合限定动词加强语气；“胆寒”传达勇气消融的语境含义，“必完全”体现强调结构。脚注保留字面隐喻。
- source_word: כִּי
  choice: 因为
  rationale: 引出前述判断的理由，符合本句论证关系。
- source_word: יֹדֵעַ כָּל יִשְׂרָאֵל
  choice: 全以色列都知道
  rationale: 直接表达分词所呈现的普遍、既定认知。
- source_word: גִּבּוֹר
  choice: 大能的勇士
  rationale: 在此军事语境中指大卫是强有力、善战的人；该译法兼顾力量和战士身份。
- source_word: וּבְנֵי חַיִל אֲשֶׁר אִתּוֹ
  choice: 跟随他的也都是勇士
  rationale: 自然表达“与他同在的勇力之子”，并保留与前文 בֶּן חַיִל 的词汇联系。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“胆寒”使希伯来文“融化”的勇气隐喻在中文中自然可解，同时以脚注保存其字面形式；两处“勇士”有意呼应原文 חַיִל 词根相关的单复数习语。
