base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/001.yaml
  text: Then Ahithophel said to Absalom[a], “Please let me choose twelve thousand men, and let me arise and pursue David tonight.”
translation:
  language: zh_hans
  text: 亚希多弗对押沙龙说：“请让我挑选一万二千人，让我今晚动身去追赶大卫。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较直译：“请让我挑选一万二千人，让我起来，今夜去追赶大卫。”这里“起来”指动身、出发。
    reason: 原文连续使用两个第一人称祈愿式；此译法保留其并列的请求／提议形式。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 未另译连接词וַ，以自然的现代汉语叙事承接上文；动词译为“说”准确简洁。
- source_word: אֲחִיתֹפֶל
  choice: 亚希多弗
  rationale: 采用现代中文圣经中通行的人名音译。
- source_word: אֶל־אַבְשָׁלֹם
  choice: 对押沙龙
  rationale: 介词אֶל在言说结构中自然译为“对”；人名采用通行音译“押沙龙”。
- source_word: אֶבְחֲרָה נָּא
  choice: 请让我挑选
  rationale: 以“请让我”表达祈愿式所带的请求、提议语气；“挑选”准确传达בחר在此处选取人员之意。
- source_word: שְׁנֵים עָשָׂר אֶלֶף אִישׁ
  choice: 一万二千人
  rationale: 按原文直译人数与“人”，不擅自具体化为“士兵”或“军队”，虽上下文显然具有军事性质。
- source_word: וְאָקוּמָה
  choice: 就动身
  rationale: קום字面为“起来”，在此表示采取行动、出发；“动身”符合现代汉语，同时保留立即行动的意味。
- source_word: וְאֶרְדְּפָה אַחֲרֵי דָוִד
  choice: 追赶大卫
  rationale: רדף与אַחֲרֵי合用表示追击、追赶某人；“追赶大卫”自然且准确。
- source_word: הַלָּיְלָה
  choice: 今晚
  rationale: 带冠词的“这夜”在语境中指当前这个夜晚，现代汉语自然译为“今晚”。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。正文将连续的祈愿式请求整合为“请让我……就……”，避免生硬的“起来”，译作符合行动语境的“动身”；脚注保留较形式化的可能表达。
