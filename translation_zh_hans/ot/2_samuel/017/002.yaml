base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/002.yaml
  text: I will come upon him while he is weary and weak-handed[a], and I will throw him into panic, so that all the people who are with him will flee; then I will strike down the king alone.
translation:
  language: zh_hans
  text: 我要趁他疲惫、双手无力[a]时向他发动攻击，使他惊慌；所有与他在一起的人都会逃跑；我只击杀王一人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语直译为“双手软弱”，指力量或勇气衰退。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָבוֹא עָלָיו
  choice: 我要……袭击他
  rationale: בוא与עַל连用，在此军事语境中表示敌意地来到某人那里、攻击某人。“袭击”自然传达其敌对含义，也与趁对方疲弱出手的语境吻合。
- source_word: יָגֵעַ
  choice: 疲惫
  rationale: 该词指因劳累而困乏；“疲惫”是现代汉语中自然、准确的对应。
- source_word: וּרְפֵה יָדַיִם
  choice: 手软
  rationale: 希伯来语直译为“双手软弱”，可表示力量或勇气衰退。“手软”保留身体意象，并在汉语中也能表达无力或勇气不足；脚注说明其语义范围。
- source_word: וְהַחֲרַדְתִּי אֹתוֹ
  choice: 使他惊慌
  rationale: חרד的使役形表示使人战栗、害怕；“使他惊慌”保留使役结构，符合突袭的战场语境。
- source_word: וְנָס כָּל־הָעָם אֲשֶׁר אִתּוֹ
  choice: 跟随他的众人就都会逃跑
  rationale: אֲשֶׁר אִתּוֹ直指与他同在的人；此处译作“跟随他的众人”符合军队语境。“就”自然表达前述惊慌所产生的结果，同时不改变事件次序。
- source_word: וְהִכֵּיתִי
  choice: 我……击杀
  rationale: נכה可指击打，也常在军事语境中指杀死。这里谋划的是除掉王，故“击杀”准确表达语境中的致命行动，同时保留“击”的词义色彩。
- source_word: הַמֶּלֶךְ
  choice: 王
  rationale: 原文使用带定冠词的称号“那王/王”，所指为大卫，但没有直接称名；译文保留称号，不以名字代替。
- source_word: לְבַדּוֹ
  choice: 只……一人
  rationale: 该词强调王是唯一的攻击目标。“只击杀王一人”在现代汉语中清楚传达这种排他性。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“手软”保留原文的具体身体意象，并以脚注避免读者只按现代汉语中“不忍下手”的常见义理解。分成两句，使计谋的步骤和“只攻击王一人”的重点更加清楚。
