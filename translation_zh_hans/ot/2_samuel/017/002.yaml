  rationale: 将易被理解为“不忍下手”的“手软”改为“双手无力”，保留希伯来语的身体意象及其可延伸的力量、勇气衰退之意。将“跟随他的众人”改为“所有与他在一起的人”，避免添加原文未明说的从属关系。其余内容保持原文的叙事顺序、军事语境及“王”为唯一攻击目标的重点。
