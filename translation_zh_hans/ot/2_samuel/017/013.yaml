  text: וְ/אִם אֶל עִיר֙ יֵֽאָסֵ֔ף וְ/הִשִּׂ֧יאוּ כָֽל יִשְׂרָאֵ֛ל אֶל הָ/עִ֥יר הַ/הִ֖יא חֲבָלִ֑ים וְ/סָחַ֤בְנוּ אֹת/וֹ֙ עַד הַ/נַּ֔חַל עַ֛ד אֲשֶֽׁר לֹא נִמְצָ֥א שָׁ֖ם גַּם צְרֽוֹר־־־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/013.yaml
  text: And if he withdraws into a city[a], then all Israel will bring ropes to that city[b], and we will drag it to the wadi until not even a small stone is found there.
translation:
  language: zh_hans
  text: 他若退入一座城，全以色列人都要把绳索带到那城，我们就把那城[a]拖到溪谷[b]，直到那里连一块小石子[c]也找不到。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文作阳性单数代词，形式上也可理解为“他”，指大卫；但按上下文，这里更可能是按意义指那城。
    reason: textual_ambiguity
  - marker: b
    text: “溪谷”所译的希伯来语可指溪流、季节性水道、溪床或沟谷。
    reason: lexical_alternative
  - marker: c
    text: 或译“石块”。原文以“连一块小石子也找不到”这一夸张说法描绘彻底毁灭。
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵאָסֵף
  choice: 退进
  rationale: 该词是אסף的尼法勒式；在此军事语境中，指大卫退入城中或聚拢到城内。“退进”自然表达撤入城中据守之意，同时不额外添加“避难”等解释。
- source_word: וְהִשִּׂיאוּ
  choice: 带到
  rationale: 此处与“绳索”连用，表示把绳索运送、带到那城；“带到”符合现代汉语，也保留动作方向。
- source_word: חֲבָלִים
  choice: 绳索
  rationale: 指用于牵拉的绳子；“绳索”清楚保留了摧毁并拖走城池的夸张图景。
- source_word: וְסָחַבְנוּ אֹתוֹ
  choice: 把它拖到
  rationale: סחב表示拖、曳。译文按上下文将代词理解为那城，从而保留用绳索把整座城拖走的夸张意象；原文代词形式存在指称张力，另加脚注说明。
- source_word: הַנַּחַל
  choice: 溪谷
  rationale: נחל可指季节性水道、溪床或沟谷。“溪谷”在现代汉语中自然，并兼顾水道与谷地两方面，不把它限定为常年有水的河流。
- source_word: גַּם צְרוֹר
  choice: 连一块小石子也
  rationale: צְרוֹר在此指小石块或石子；这一表达强化彻底毁灭的夸张语气。“连……也”准确传达גַּם在否定句中的强调作用。
theological_decisions:
- issue: וְסָחַבְנוּ אֹתוֹ中阳性代词的指称
  choice: 正文译作“把它”，指那城
  alternative: 译作“把他”，指大卫
  rationale: 前文把绳索带到城中，后文又说连一块石子也不剩，整体意象明显聚焦于把城彻底拖毁；因此正文以那城为所指。不过，希伯来语代词是阳性，而“城”通常为阴性，形式上也可能使人想到大卫，故不掩盖这一语法张力，并在脚注中交代。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“退进”体现军事撤退语境；“把绳索带到那城……拖到溪谷”保留原文强烈的夸张意象。脚注仅说明确有依据的词义范围与代词指称歧义，不把修辞性毁城图景解释为特定教义。
