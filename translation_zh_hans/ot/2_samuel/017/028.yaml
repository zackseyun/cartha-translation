  yaml_path: translation/ot/2_samuel/017/028.yaml
  text: beds[a], basins, and pottery vessels, and wheat, barley, flour[b], roasted grain, beans, lentils[d][c], and parched grain.
translation:
  language: zh_hans
  text: 床铺、盆[a]、陶制器皿[b]，还有小麦、大麦、面粉、烘烤过的谷物、蚕豆[c]、扁豆和烘烤过的谷物。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“碗”。
    reason: lexical_alternative
  - marker: b
    text: 字面意思是“陶匠的器皿”。
    reason: lexical_alternative
  - marker: c
    text: 或泛译“豆子”；原文很可能特指蚕豆。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁכָּב
  choice: 床铺
  rationale: 该词指供人躺卧之处或卧具；在供应物资的清单中，“床铺”自然清楚，也能以集合意义表达希伯来文的单数形式。
- source_word: סַפּוֹת
  choice: 盆
  rationale: 该词在此可能指盆或碗一类的容器；“盆”较符合实用器具的语境，同时在脚注保留“碗”这一可能译法。
- source_word: כְלִי יוֹצֵר
  choice: 陶制器皿
  rationale: 字面意思是“陶匠的器皿”，实际指陶器；“陶制器皿”在现代汉语中自然，并明确表达材质。
- source_word: חִטִּים
  choice: 小麦
  rationale: 该谷物名称的标准现代汉语译法。
- source_word: שְׂעֹרִים
  choice: 大麦
  rationale: 该谷物名称的标准现代汉语译法。
- source_word: קֶמַח
  choice: 面粉
  rationale: 指磨成的谷粉；“面粉”是普通读者最易理解的现代汉语表达。
- source_word: קָלִי
  choice: 烘烤过的谷物
  rationale: 指经烤制的谷物；此译法清楚自然。原文在本节中两次使用同一词，因此两处采用相同译法，保留原文的重复。
- source_word: פּוֹל
  choice: 蚕豆
  rationale: 该词很可能具体指蚕豆（即宽豆、fava bean），故正文采用较明确的“蚕豆”，并在脚注说明较宽泛的译法。
- source_word: עֲדָשִׁים
  choice: 扁豆
  rationale: 该豆类名称的标准现代汉语译法。
