base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/004/006.yaml
  text: And there they came into the midst of the house[a], taking wheat, and they struck him in the belly. Then Rekab and Baanah his brother escaped.
translation:
  language: zh_hans
  text: 他们来到屋内深处，取麦子，并击中他的腹部[a]；利甲和他的兄弟巴拿逃走了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 传统上也译作“第五根肋骨之下”；这里的希伯来语更可能泛指腹部。
    reason: 保留חֹמֶשׁ的传统译法及其词义不确定性。
lexical_decisions:
- source_word: וְהֵנָּה
  choice: 他们来到
  rationale: וְהֵנָּה带有指示并推进叙事的作用；现代汉语不宜机械译成“看哪，他们”，其功能可由句子起首和后续动作自然体现。
- source_word: עַד תּוֹךְ הַבַּיִת
  choice: 屋子深处
  rationale: תּוֹךְ指内部或中间；“屋子深处”既自然，又保留他们已进入屋内较深处的空间意味。
- source_word: לֹקְחֵי חִטִּים
  choice: 取麦子的时候
  rationale: 原文是简略的分词结构，字面意为“取麦子的人／取着麦子”。译文不加入“假装”这一未明说的动机，而以时间性表达保留其与主要动作之间可能较宽泛的关系。
- source_word: וַיַּכֻּהוּ
  choice: 击打他
  rationale: נכה在此陈述击打的动作；虽然上下文表明受害者死亡，但不直接改译为“杀死”，以免超出本句的词义。
- source_word: אֶל הַחֹמֶשׁ
  choice: 他的腹部
  rationale: חֹמֶשׁ在此最可能指腹部或腹腔一带；现代汉语用“腹部”准确、庄重，也避免沿袭不确定的传统译法“第五根肋骨下”。
- source_word: נִמְלָטוּ
  choice: 逃走了
  rationale: מלט的尼法勒式表示成功脱身或逃脱；“逃走了”符合此处叙事语境。
