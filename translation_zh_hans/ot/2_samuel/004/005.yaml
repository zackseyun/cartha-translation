base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/004/005.yaml
  text: The sons of Rimmon the Beerothite[a], Rekab and Baanah, went and came to the house of Ish-bosheth in the heat of the day[b], while he was lying down for his midday rest.
translation:
  language: zh_hans
  text: 比录人临门的儿子利甲和巴拿出发了；到了天最热的时候，他们来到伊施波设的家，那时他正在午休[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “午休”直译为“正午的躺卧”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי רִמּוֹן הַבְּאֵרֹתִי
  choice: 比录人临门的两个儿子
  rationale: בְּנֵי直译为“儿子们”；下文立即点出利甲和巴拿二人，故用“两个儿子”自然明确。地名来源词הַבְּאֵרֹתִי译作“比录人”。
- source_word: רֵכָב וּבַעֲנָה
  choice: 利甲和巴拿
  rationale: 采用现代中文圣经读者较熟悉的人名音译，同时不翻译人名含义。
- source_word: וַיֵּלְכוּ וַיָּבֹאוּ
  choice: 出发了；……他们来到
  rationale: 保留两个连续叙事动词所表达的起行与抵达，不将二者压缩成单一动作。
- source_word: כְּחֹם הַיּוֹם
  choice: 到了天最热的时候
  rationale: 该短语指白昼炎热之时，通常即一天最热的时段；此译既自然，又避免直接收窄为精确的“正午”。
- source_word: בֵּית אִישׁ־בֹּשֶׁת
  choice: 伊施波设的家
  rationale: בֵּית在此指其住所，现代汉语用“家”比“房屋”更自然；专名按通行形式音译。
- source_word: וְהוּא שֹׁכֵב
  choice: 那时他正躺着
  rationale: 将分句理解为交代他们到达时伊施波设所处的状态，以“那时……正……”自然呈现其伴随情境。
- source_word: אֵת מִשְׁכַּב הַצָּהֳרָיִם
  choice: 午休
  rationale: 字面为“正午的躺卧”，语境所指是中午躺下休息；“午休”简洁、庄重且符合现代汉语。
