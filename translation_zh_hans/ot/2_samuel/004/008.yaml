revisions:
- from: 他们把伊施波设的头带到希伯仑大卫那里，对王说：“看，这是你仇敌扫罗的儿子伊施波设的头；他曾想要你的命。雅威今天使我主我王得以向扫罗和他的后代报仇[a]。”
  to: 他们把伊施波设的头带给在希伯仑的大卫，对王说：“看，这是你仇敌扫罗的儿子伊施波设的头；他曾想要你的命。雅威今天已为我主我王向扫罗和他的后代报了仇[a]。”
  rationale: 修订明确“大卫在希伯仑”的地点关系，并以符合现代汉语搭配的完成式表达原文中刺客宣称雅威已赐下报仇的结果。保留直接引语的宣称性质，不暗示叙述者认同其神学判断；保留“扫罗和他的后代”的原文并列。
