source:
  edition: WLC
  text: וַ֠/יָּבִאוּ אֶת רֹ֨אשׁ אִֽישׁ בֹּ֥שֶׁת אֶל דָּוִד֮ חֶבְרוֹן֒ וַ/יֹּֽאמְרוּ֙ אֶל הַ/מֶּ֔לֶךְ הִנֵּֽה רֹ֣אשׁ אִֽישׁ בֹּ֗שֶׁת בֶּן שָׁאוּל֙ אֹֽיִבְ/ךָ֔ אֲשֶׁ֥ר בִּקֵּ֖שׁ אֶת נַפְשֶׁ֑/ךָ וַ/יִּתֵּ֣ן יְ֠הוָה לַֽ/אדֹנִ֨/י הַ/מֶּ֤לֶךְ נְקָמוֹת֙ הַ/יּ֣וֹם הַ/זֶּ֔ה מִ/שָּׁא֖וּל וּ/מִ/זַּרְעֽ/וֹ־־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/004/008.yaml
  text: They brought the head of Ish-bosheth to David at Hebron[a], and said to the king, “Here is the head of Ish-bosheth son of Saul, your enemy, who sought your life. Yahweh has given my lord the king vengeance today on Saul and on his offspring.”
translation:
  language: zh_hans
  text: 他们把伊施波设的头带给在希伯仑的大卫，对王说：“看，这是你仇敌扫罗的儿子伊施波设的头；他曾想要你的命。雅威今天已为我主我王向扫罗和他的后代报了仇[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “报仇”原文为复数，也可译作“报复行动”；该复数也可能具有加强语气的作用。
    reason: 说明נְקָמוֹת的复数形式及其可能的语义功能，而不将其限定为某一种具体的强化含义。
lexical_decisions:
- source_word: וַיָּבִאוּ
  choice: 他们把……带到
  rationale: 这是叙事序列中的动作；现代汉语无需机械译出句首连接词，同时保留“带来、带到”的动作方向。
- source_word: רֹאשׁ
  choice: 头
  rationale: 上下文明确指被砍下的实体头颅，不宜作比喻解释。
- source_word: אִישׁ בֹּשֶׁת
  choice: 伊施波设
  rationale: 按本节马所拉文本中的人名音译，不以历代志中的相关名字“伊施巴力”替换。
- source_word: חֶבְרוֹן
  choice: 希伯仑
  rationale: 采用该地名通行的现代中文圣经译名。
- source_word: הִנֵּה
  choice: 看，这是
  rationale: 保留当面展示之物的指示和引人注意功能，同时使用自然的现代汉语。
- source_word: אֹיִבְךָ
  choice: 你的仇敌
  rationale: 直接表达敌对者之意，并保留第二人称所属关系。
- source_word: בִּקֵּשׁ אֶת נַפְשֶׁךָ
  choice: 曾想要你的命
  rationale: 这是希伯来语表示企图取人性命的惯用语；如此译法既清楚，又保留“要你的命”的形象表达。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按四字神名的通常学术拟音作专名音译，而不以“主”这一称号替代；也与下文指人的“我主”区分。
- source_word: לַאדֹנִי הַמֶּלֶךְ
  choice: 使我主我王得以
  rationale: 保留说话者对君王的第一人称敬称，并用汉语自然表达“赐给我主我王报仇之事”的结果。
- source_word: נְקָמוֹת
  choice: 报仇
  rationale: 原文为复数形式，可表示强烈的报复或一系列报复行动；正文以自然汉语概括表达，细节见脚注。
- source_word: מִשָּׁאוּל וּמִזַּרְעוֹ
  choice: 向扫罗和他的后代
  rationale: 介词在“报仇”的搭配中标明报复所针对的对象；זֶרַע在此指扫罗的后裔、后代。
theological_decisions:
- issue: 如何翻译神名 יְהוָה
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用以四个辅音构成的神名。正文采用专名拟音，以保留其作为名字而非称号的性质。
- issue: 是否把刺客所说“雅威使王得以报仇”处理成叙述者认可的判断
  choice: 不加限定，原样保留为人物直接引语
  alternative: 加入“他们声称”“所谓”等表示怀疑或否定的措辞
  rationale: 原文只记录他们的宣称，并未在本句加入评价；后续大卫的回应承担叙事上的判断。译文不应预先替叙述者解释。
- issue: 扫罗已经死亡，如何保留“向扫罗报仇”的张力
  choice: 照原文译作“向扫罗和他的后代报仇”
  alternative: 改成“向扫罗家报仇”或只说“向他的后代报仇”
  rationale: 原文明列扫罗及其后裔。即使扫罗已死，这也是刺客自己的表述，不应为消除表面张力而改写。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。叙事句式简洁，直接引语保留向君王邀功的宫廷口吻。“我主我王”刻意保留原文的双重敬称；“雅威”与指人的“我主”清楚区分。脚注标记置于其实际说明的“报仇”之后。
