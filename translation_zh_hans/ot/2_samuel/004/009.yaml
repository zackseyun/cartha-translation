  yaml_path: translation/ot/2_samuel/004/009.yaml
  text: But David answered Rekab and Baanah his brother[a], the sons of Rimmon the Beerothite, and said to them, “As Yahweh lives, who has redeemed my life out of every distress,
translation:
  language: zh_hans
  text: 大卫回答比录人临门的儿子利甲和他的兄弟巴拿，对他们说：“我指着救赎我的性命、使我脱离一切患难的永活雅威[a]起誓：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文为“YHWH”（יהוה）；也常译作“耶和华”。
    reason: 说明正文“雅威”所对应的四字神名，并注明中文传统常见译名。
lexical_decisions:
- source_word: וַיַּעַן
  choice: 回答
  rationale: ענה的连续式在叙事对话中常用于引出回应；“回答”自然保留了这一叙事公式。
- source_word: רֵכָב וְאֶת־בַּעֲנָה אָחִיו
  choice: 利甲和他的兄弟巴拿
  rationale: 人名采用现代中文圣经中通行的音译；单数אָחִיו最自然地说明巴拿是利甲的兄弟。
- source_word: בְּנֵי רִמּוֹן הַבְּאֵרֹתִי
  choice: 比录人临门的两个儿子
  rationale: בְּנֵי为复数，指利甲和巴拿二人；族称הַבְּאֵרֹתִי译作“比录人”，既交代临门的籍贯，也符合自然中文。
- source_word: חַי יְהוָה
  choice: 我指着……永活耶和华起誓
  rationale: 这是庄严的希伯来誓言公式。中文补出“指着……起誓”以传达其语用功能，“永活”保留חַי的含义。
- source_word: פָּדָה
  choice: 救赎
  rationale: פדה含有付代价赎回或从危难中解救的语义；“救赎”保留其较强的词汇与神学分量。
- source_word: נַפְשִׁי
  choice: 我的性命
  rationale: נפש在这里指身处危险中的生命或本人，并非专指非物质的“灵魂”；“性命”最切合语境。
- source_word: מִכָּל־צָרָה
  choice: 脱离一切患难
  rationale: צָרָה指困苦、危难或逆境；“一切患难”保留כָּל的全面语气，并与“救赎……脱离”自然搭配。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 正文采用现代中文读者熟悉的传统专名形式，并以脚注注明希伯来文形式及另一常见音译。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名יהוה，而非“主”这一称号。正文保留中文传统专名“耶和华”，脚注同时注明“雅威”这一较接近学界重构发音的音译，避免把专名默默改成称号。
- issue: פדה在本节中的救赎含义
  choice: 救赎我的性命
  alternative: 救我
  rationale: 语境确实强调从危难中获救，但保留“救赎”可呈现פדה比一般“救”更丰富的赎回意味，同时“性命”说明נפש在此所指。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。为使希伯来誓言公式在中文中清楚可懂，将“耶和华是永活的”功能性地表达为“我指着……永活耶和华起誓”。句末用冒号，因为誓言内容延续到下一节。
