base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/004/011.yaml
  text: How much more[a], when wicked men have killed a righteous man in his own house on his bed[b], should I not now require his blood from your hand and purge you from the land?
translation:
  language: zh_hans
  text: 何况恶人竟在义人自己的家中、在他的床上杀死了他！我现在岂不该从你们手中追讨他的血[a]，从这地除灭你们[b]吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “从你们手中追讨他的血”是希伯来语的司法习语，意思是追究你们使他流血的罪责，要你们为他的死负责。
    reason: lexical_alternative
  - marker: b
    text: “从这地除灭你们”在这里指借司法惩罚除去杀人者，并非仅指礼仪上的洁净。
    reason: cultural_note
lexical_decisions:
- source_word: אַף כִּי
  choice: 何况
  rationale: 承接上一节由较轻到较重的论证，表达“更何况”的递进语气；句中加“竟”自然传达震惊与谴责，但不改变论证关系。
- source_word: אֲנָשִׁים רְשָׁעִים
  choice: 恶人
  rationale: 直接表达道德上的邪恶与罪责；现代汉语中不必另译“人们”或“男人”。
- source_word: הָרְגוּ
  choice: 杀死
  rationale: 原词是一般性的“杀”，上下文虽明确属于谋杀，正文仍避免把词义窄化为带法律定性的“谋杀”。
- source_word: אִישׁ צַדִּיק
  choice: 一个义人
  rationale: 保留צַדִּיק的核心词义和旧约伦理—司法色彩；此处也含有受害者不该遭此杀害之意，但不直接改译为“无辜的人”。
- source_word: בְּבֵיתוֹ עַל מִשְׁכָּבוֹ
  choice: 在一个义人的家中，把他杀死在床上
  rationale: 保留受害者在自己家中、自己床上遇害的双重情境。汉语由“他的家中”可能产生指代游移，因此用“一个义人的家中”明确所属，而“他”仍自然回指义人。
- source_word: הֲלוֹא אֲבַקֵּשׁ אֶת דָּמוֹ מִיֶּדְכֶם
  choice: 我岂不要从你们手中追讨他的血
  rationale: 保留希伯来语具体而庄严的血债问责习语。“岂不要”体现反问，预期肯定回答；“你们手中”也保留原文的责任意象。
- source_word: וּבִעַרְתִּי אֶתְכֶם מִן הָאָרֶץ
  choice: 把你们从这地清除掉
  rationale: בער在此指司法性地除去作恶者。“清除掉”保留彻底除去的力度，“这地”按语境比泛指“地上”更合适。
theological_decisions:
- issue: 是否把“从你们手中追讨他的血”直接解释为报仇或追究责任
  choice: 正文保留“追讨他的血”的血债习语，并以脚注说明
  alternative: 为他的血报仇／追究你们使他流血的罪责
  rationale: 原文兼有司法问责、索取血债和施行惩罚的意味。保留其具体表述可避免将大卫的行动缩减为私人复仇，也不抹去旧约血债语言。
- issue: “从这地清除掉”是否仅指礼仪性的洁净
  choice: 按司法性除去作恶者理解
  alternative: 仅作礼仪洁净理解
  rationale: 上下文是大卫对杀人者宣告刑罚；该动词在此所指是将他们处死、从地上除去，而非单纯举行洁净礼仪。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“何况……！现在，我岂不要……吗？”既呈现由轻到重的论证，也保留原文反问的审判力度。脚注标记放在各自所解释的短语之后，以免产生错配。
