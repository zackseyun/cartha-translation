  terminology: “扫罗”“洗革拉”均采用通行中文圣经译名。“杀了”忠实对应 הָרַג，未擅自加入正式司法处决的意味。“赏赐”在此表达报信者所期待的报偿，脚注须说明其反讽性，避免将之理解为普通支付。
