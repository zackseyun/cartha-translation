source:
  edition: WLC
  text: כִּ֣י הַ/מַּגִּיד֩ לִ֨/י לֵ/אמֹ֜ר הִנֵּה מֵ֣ת שָׁא֗וּל וְ/הֽוּא הָיָ֤ה כִ/מְבַשֵּׂר֙ בְּ/עֵינָ֔י/ו וָ/אֹחֲזָ֣/ה ב֔/וֹ וָ/אֶהְרְגֵ֖/הוּ בְּ/צִֽקְלָ֑ג אֲשֶׁ֥ר לְ/תִתִּ/י ל֖/וֹ בְּשֹׂרָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/004/010.yaml
  text: When someone told me[a], saying, ‘Look, Saul is dead,’ and he thought he was bringing good news in his own eyes[b], I seized him and killed him in Ziklag—that was the reward I gave him for his news.
translation:
  language: zh_hans
  text: 有一次，有人告诉我[a]说：‘看，扫罗死了！’他还以为自己是在报好消息。我就在洗革拉抓住他，把他杀了——这就是我给他报信的赏赐。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 较直译：“那告诉我说‘看，扫罗死了’的人。”
    reason: lexical_alternative
  - marker: b
    text: 希伯来文末句较为省略，并带有反讽意味：那人本来期待因报信得赏；大卫所说给他的“赏赐”，正是前文所述把他杀了。
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: 从前
  rationale: 此处引出大卫用来说明当前判断的往事；用“从前”自然呈现叙事回顾，也避免把 כִּי 机械译成单一因果连词。
- source_word: הַמַּגִּיד לִי לֵאמֹר
  choice: 有人来告诉我
  rationale: 带冠词的分词实质上指“那告诉我的人”；汉语用“有人来告诉我”更自然，并由后面的直接引语承载 לֵאמֹר，无须生硬译作“说”。
- source_word: הִנֵּה מֵת שָׁאוּל
  choice: 看，扫罗死了！
  rationale: “看”保留 הִנֵּה 引人注意的作用；“死了”自然表达 מֵת 所指的死亡结果状态。
- source_word: וְהוּא הָיָה כִמְבַשֵּׂר בְּעֵינָיו
  choice: 他还以为自己是在报好消息
  rationale: בְּעֵינָיו 表示“在他自己看来”；כִמְבַשֵּׂר 可指像报喜信的人。此译保留信使的主观判断及上下文中的反讽。
- source_word: וָאֹחֲזָה בוֹ
  choice: 我……抓住他
  rationale: “抓住”直接表达 אָחַז 的抓取、控制之意，语体自然且有力度。
- source_word: וָאֶהְרְגֵהוּ
  choice: 把他杀了
  rationale: 直译 הרג 的“杀死”，不额外加入审判、处决等原文未明说的司法色彩。
- source_word: בְּצִקְלָג
  choice: 在洗革拉
  rationale: 采用该地名在现代中文圣经传统中通行且易识别的译名。
- source_word: אֲשֶׁר לְתִתִּי לוֹ בְּשֹׂרָה
  choice: 这就是我因他的消息而给他的报酬
  rationale: 希伯来语末句省略而带反讽；בְּשֹׂרָה 可涉及报信所得的赏钱或报酬。此译使汉语句意完整，同时让“报酬”其实是死亡的反讽保持清楚。
theological_decisions:
- issue: 大卫杀死报信者的行为是否明确属于司法处决
  choice: 译作“把他杀了”
  alternative: 译作“把他处死了”
  rationale: 原文 הרג 只明确说杀死，并未在本节词汇中界定正式司法程序；因此不把解释性的司法定性写入正文。
- issue: 末句的报酬意象
  choice: 保留为大卫“给他的报酬”
  alternative: 解释为大卫给他的“好消息”
  rationale: 原文句法省略，且 בְּשֹׂרָה 的含义容许与报信所得报酬相关；正文采用最符合语境的反讽表达，脚注说明原文的省略性。
translation_notes:
  register: 采用现代、庄重而口语自然的叙事语言。“看”保留现场感；“还以为”清楚传达“在他自己眼中”的主观判断。破折号凸显末句的反讽，但不添加原文没有明说的神学或司法结论。
