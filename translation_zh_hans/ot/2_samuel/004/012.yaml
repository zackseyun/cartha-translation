  text: וַ/יְצַו֩ דָּוִ֨ד אֶת הַ/נְּעָרִ֜ים וַ/יַּהַרְג֗וּ/ם וַֽ/יְקַצְּצ֤וּ אֶת יְדֵי/הֶם֙ וְ/אֶת רַגְלֵי/הֶ֔ם וַ/יִּתְל֥וּ עַל הַ/בְּרֵכָ֖ה בְּ/חֶבְר֑וֹן וְ/אֵ֨ת רֹ֤אשׁ אִֽישׁ בֹּ֨שֶׁת֙ לָקָ֔חוּ וַ/יִּקְבְּר֥וּ בְ/קֶֽבֶר אַבְנֵ֖ר בְּ/חֶבְרֽוֹן־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/004/012.yaml
  text: Then David commanded the young men[a], and they killed them and cut off their hands and their feet and hung them by the pool at Hebron. But they took the head of Ish-bosheth and buried it in the tomb of Abner at Hebron.
translation:
  language: zh_hans
  text: 于是，大卫吩咐那些年轻人，他们就杀死他们，砍下他们的手和脚，把他们悬挂在希伯仑的池旁[a]。他们又取了伊施波设的头，葬在希伯仑押尼珥的坟墓里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“悬挂在池上方”。原文介词也可较宽泛地表示所在地点。
    reason: 保留希伯来介词עַל在空间关系上的歧义；正文“池旁”较符合此处的地点表达，但“池上方”在语法上仍属可能。
lexical_decisions:
- source_word: וַיְצַו דָּוִד אֶת הַנְּעָרִים
  choice: 于是，大卫吩咐那些年轻人
  rationale: 连续式叙事以“于是”自然推进情节；צוה译为“吩咐”，保留命令的语气。נְעָרִים可指年轻人，也可指侍从；正文采用较直接的“年轻人”，不把其身份进一步限定为仆役或卫兵。
- source_word: וַיַּהַרְגוּם
  choice: 他们就杀死二人
  rationale: הרג是普通的“杀死”。宾语为前文提到的两名凶手；中文以“二人”明确复数所指，又不添加“处决”等司法性质的解释。
- source_word: וַיְקַצְּצוּ אֶת יְדֵיהֶם וְאֶת רַגְלֵיהֶם
  choice: 砍下他们的手脚
  rationale: קצץ表示砍断、砍下。译文直接保留肢解的严酷画面；中文合称“手脚”自然，也完整涵盖原文的双重宾语。
- source_word: וַיִּתְלוּ עַל הַבְּרֵכָה
  choice: 把二人的尸身悬挂在……池旁
  rationale: תלה意为悬挂。二人已经被杀，因此补出“尸身”使现代中文不致误解动作次序；עַל在此可表示邻近或所在地点，正文采用自然的“池旁”，并以脚注保留空间关系的另一可能。
- source_word: בְּחֶבְרוֹן
  choice: 在希伯仑
  rationale: 介词בְּ在地名之前自然译作“在”；两处地名统一处理。
- source_word: רֹאשׁ אִישׁ בֹּשֶׁת
  choice: 伊施波设的头
  rationale: 按原文领属结构直译；人名依希伯来语形式音译。
- source_word: לָקָחוּ
  choice: 取了
  rationale: לקח是常用的“拿、取”；采用简洁的“取了”，不增添“寻回”或“移走”等原文未明说的信息。
- source_word: וַיִּקְבְּרוּ בְקֶבֶר אַבְנֵר
  choice: 葬在……押尼珥的坟墓里
  rationale: 上下文表明安葬的对象是伊施波设的头，中文承接前句可自然省略代词；קֶבֶר译为“坟墓”，准确且通俗庄重。
theological_decisions:
- issue: 如何呈现大卫命令所引发的杀戮、肢解和示众
  choice: 按叙事原貌直接陈述，不添加道德评价或司法定性
  alternative: 将“杀死”译作“处决”，或补入“惩罚凶手”等解释
  rationale: 本节只记述大卫的命令及随后发生的行动，并未在本句中直接作神学或伦理评判。直译其严酷细节可保留经文本身的张力，避免替叙事预先裁定其性质。
translation_notes:
  register: 采用现代、庄重而清楚的叙事中文。暴力细节不加淡化，也不以更强的司法术语加以解释；句式按希伯来叙事顺序推进，并用分号避免连续动作显得拖沓。
