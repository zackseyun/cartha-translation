base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/004/004.yaml
  text: Jonathan son of Saul had a son crippled in his feet. He was five years old when the news about Saul and Jonathan came from Jezreel[a], and his nurse picked him up and fled. And as she hurried to flee, he fell and became lame. His name was Mephibosheth.
translation:
  language: zh_hans
  text: 扫罗的儿子约拿单有一个双脚有残疾的儿子[a]。从耶斯列传来有关扫罗和约拿单的消息时，他五岁。他的乳母抱起他逃走；她急忙逃跑时，他摔了下来，腿就瘸了。他名叫米非波设。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“脚部受击”（“脚”为双数）；也可理解为“双脚瘸跛”。
    reason: 说明希伯来语短语的字面意象及其双数形式，并提供合乎语境的译法，不将身体状况过度医学化。
lexical_decisions:
- source_word: נְכֵה רַגְלָיִם
  choice: 腿脚残疾
  rationale: 原短语指脚部受损或有残疾；用现代、尊重且自然的中文表达身体状况，不额外断定具体伤情。
- source_word: בֶּן חָמֵשׁ שָׁנִים
  choice: 才五岁
  rationale: 按现代汉语习惯表达年龄；“才”自然凸显孩子年幼，符合叙事语境。
- source_word: בְּבֹא שְׁמֻעַת שָׁאוּל וִיהוֹנָתָן
  choice: 扫罗和约拿单的消息……传来时
  rationale: 保留“消息”内容未明说的特点，不擅自补成“死讯”或“战败的消息”。
- source_word: מִיִּזְרְעֶאל
  choice: 从耶斯列
  rationale: 直接表达消息传来的地点来源。
- source_word: אֹמַנְתּוֹ
  choice: 他的乳母
  rationale: 该词指负责照料、养育孩子的女性；“乳母”符合古代叙事语境，也为普通中文读者所理解。
- source_word: וַתִּשָּׂאֵהוּ
  choice: 抱起他
  rationale: 动词有举起、带走之意；面对五岁孩童并随即逃跑，“抱起”最符合场景。
- source_word: בְּחָפְזָהּ לָנוּס
  choice: 她慌忙逃跑时
  rationale: 兼顾“仓促、急忙”的情状与逃跑这一目的，使中文叙事流畅。
- source_word: וַיִּפֹּל
  choice: 他摔了下来
  rationale: 阳性单数主语是孩子；“摔了下来”比单说“跌倒”更能衔接乳母抱起他的前文，同时不增添具体坠落方式。
- source_word: וַיִּפָּסֵחַ
  choice: 从此瘸了腿
  rationale: 该动词表示因这次跌落而成为跛足；“从此”明确结果状态，未超出上下文所表达的因果与时间关系。
- source_word: מְפִיבֹשֶׁת
  choice: 米非波设
  rationale: 采用现代中文圣经中通行的人名音译。
