  to: 扫罗的儿子约拿单有一个双脚有残疾的儿子[a]。从耶斯列传来有关扫罗和约拿单的消息时，他五岁。他的乳母抱起他逃走；她急忙逃跑时，他摔了下来，腿就瘸了。他名叫米非波设。
