base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/004/007.yaml
  text: They came into the house while he was lying on his bed in his bedroom[a], and they struck him and put him to death. Then they removed his head, took his head[c][b], and went by way of the Arabah all night.
translation:
  language: zh_hans
  text: 他们进了屋；那时，他正躺在卧房[a]的床上。他们击打他，把他杀死；然后割下他的头[b]，拿走他的头，沿亚拉巴[c]的路走了一整夜。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在他睡觉的房间里”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译作“移去他的头”；这里指割下他的头。
    reason: lexical_alternative
  - marker: c
    text: “亚拉巴”是地名，指约旦河裂谷及其平原地区。
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֹאוּ הַבַּיִת
  choice: 他们进了屋
  rationale: בוא与表示方向的הַבַּיִת连用，意为进入屋内；“进了屋”符合现代汉语叙事。
- source_word: וְהוּא שֹׁכֵב עַל מִטָּתוֹ
  choice: 那时，他正躺在……的床上
  rationale: 该分句交代他们进屋时他的状态；“那时……正……”自然表达其伴随、同时发生的意义。
- source_word: בַּחֲדַר מִשְׁכָּבוֹ
  choice: 在卧房
  rationale: 原文直指供躺卧或睡眠的房间；“卧房”庄重自然，并保留脚注中的较直译表达。
- source_word: וַיַּכֻּהוּ וַיְמִתֻהוּ
  choice: 他们击打他，把他杀死
  rationale: 分别保留נכה的击打动作和מות使役式的致死结果，不把两个动词合并为单一的“杀死”。
- source_word: וַיָּסִירוּ אֶת רֹאשׁוֹ
  choice: 割下他的头
  rationale: סור使役式本义为移除；在此具体语境中指将头从身体上除去。“割下”清楚自然，脚注注明更贴近词面的“移去”。
- source_word: וַיִּקְחוּ אֶת רֹאשׁוֹ
  choice: 带着他的头
  rationale: לקח可指拿取、带走；结合随后整夜赶路，译作“带着”自然，同时保留原文再次提到“他的头”的刻意重复。
- source_word: וַיֵּלְכוּ דֶּרֶךְ הָעֲרָבָה
  choice: 沿亚拉巴的路走
  rationale: דֶּרֶךְ הָעֲרָבָה表示经由或沿着亚拉巴的路线；保留地理名称而不笼统译成“平原”。
- source_word: כָּל הַלָּיְלָה
  choice: 一整夜
  rationale: 准确表达整个夜间持续行路，在现代汉语中简洁自然。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。用分号和句号划分连续动作，避免汉语长句拖沓；保留原文“他的头……他的头”的重复，以呈现其沉重而鲜明的叙事效果。
