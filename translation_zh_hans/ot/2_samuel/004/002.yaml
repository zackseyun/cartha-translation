base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/004/002.yaml
  text: 'Saul’s son had two men who were commanders of raiding bands: the name of the one was Baanah[a], and the name of the second was Rechab, sons of Rimmon the Beerothite, from the sons of Benjamin; for Beeroth also was considered part of Benjamin.'
translation:
  language: zh_hans
  text: 扫罗的儿子有两个人，是劫掠队的首领：一个名叫巴拿，另一个名叫利甲。他们是比录人临门的儿子，属便雅悯子孙；因为比录也被算作归在便雅悯名下[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“比录也被归在便雅悯名下。”
    reason: 说明 תֵּחָשֵׁב עַל 的另一种较贴近“被计算、归入”的译法。
lexical_decisions:
- source_word: שְׁנֵי אֲנָשִׁים שָׂרֵי גְדוּדִים
  choice: 两名袭击队的首领
  rationale: שָׂרֵי 表示首领或指挥官，גְדוּדִים 在此指从事袭击行动的队伍；译文保留其非正规武装色彩，同时采用自然的现代汉语。
- source_word: בֶן שָׁאוּל
  choice: 扫罗的儿子
  rationale: 原文为单数，并承接上文所说的伊施波设；不在正文中直接补出名字，以保留原文的指称方式。
- source_word: שֵׁם הָאֶחָד ... וְשֵׁם הַשֵּׁנִי
  choice: 一个名叫……另一个名叫……
  rationale: 以自然汉语表达希伯来文重复的命名公式，并清楚区分两人。
- source_word: בְּנֵי רִמּוֹן הַבְּאֶרֹתִי
  choice: 比录人临门的儿子
  rationale: הַבְּאֶרֹתִי 是由地名比录构成的居民称谓；将其置于临门之前，符合汉语表达习惯。
- source_word: מִבְּנֵי בִנְיָמִן
  choice: 便雅悯子孙中
  rationale: 保留“子孙”的支派血缘用语，同时使其与前面的家族说明自然衔接。
- source_word: תֵּחָשֵׁב עַל בִּנְיָמִן
  choice: 算是属于便雅悯的
  rationale: Niphal 形式表达“被算作、被视为”，עַל 在此表示归属；译法既传达归属关系，也保留“计算、归类”的语感。
theological_decisions:
- issue: “扫罗的儿子”的身份
  choice: 保留“扫罗的儿子”
  alternative: 直接译作“伊施波设”
  rationale: 虽然上下文明确指伊施波设，原文此处仍使用亲属称谓；保留该称谓可避免把上下文解释替换成正文。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。人名、地名使用常见圣经汉语译名；“手下”用于自然表达两位首领与扫罗之子的隶属关系。脚注标记置于它所解释的归属短语之后。
