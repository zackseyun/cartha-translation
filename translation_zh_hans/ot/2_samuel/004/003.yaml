  yaml_path: translation/ot/2_samuel/004/003.yaml
  text: But the Beerothites fled to Gittaim and have lived there as sojourners to this day[a].
translation:
  language: zh_hans
  text: 但比录人逃到基他音，在那里寄居，直到今日。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“作为外来居民一直住在那里，直到今日。”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבְרְחוּ
  choice: 逃到
  rationale: ברח 的 Qal 叙事形式表示“逃走”；与目的地连用时，现代汉语自然译为“逃到”。上下文表明本节是背景说明，无须用汉语额外标示过去完成体。
- source_word: הַבְּאֵרֹתִים
  choice: 比录人
  rationale: 这是由地名“比录”构成的居民称谓，译为“比录人”简洁自然。
- source_word: גִּתָּיְמָה
  choice: 到基他音
  rationale: 地名带方向词尾，明确表示朝向或进入该地；译作“到基他音”。
- source_word: וַיִּהְיוּ שָׁם גָּרִים
  choice: 在那里寄居
  rationale: גור 表示作为非本地人在某处居住；“寄居”保留其外来居民的社会含义，也符合庄重而易懂的现代汉语。
- source_word: עַד הַיּוֹם הַזֶּה
  choice: 直到今日
  rationale: 这是希伯来语常见的时间表达，指该状态延续到叙述者所处的时代。
- source_word: וַ
  choice: 但
  rationale: 此连接词在上下文中引入对前述比录归属便雅悯之说明，带有轻微转折和背景补充作用；“但”能自然呈现这一关系。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重且易懂的叙事语言。“寄居”保留 גָּרִים 所含非本地居民身份；脚注补明其可译为“外来居民”，避免把该词仅理解为短暂停留。
