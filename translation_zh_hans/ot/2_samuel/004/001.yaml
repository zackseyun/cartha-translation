base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/004/001.yaml
  text: When Saul’s son heard that Abner had died in Hebron[a], his hands became weak, and all Israel was alarmed.
translation:
  language: zh_hans
  text: 扫罗的儿子听说押尼珥死在希伯仑，双手就发软了[a]；以色列众人也都惊慌不安。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“他的双手发软了”，是指失去力量或勇气。
    reason: 说明希伯来语惯用表达，同时保留正文中的身体隐喻。
lexical_decisions:
- source_word: בֶּן שָׁאוּל
  choice: 扫罗的儿子
  rationale: 保留原文对伊施波设的间接称呼，不补入本节未出现的人名；现代汉语领属结构自然清楚。
- source_word: כִּי
  choice: 听说……
  rationale: 这里引出所听见的内容。汉语用“听说”即可自然表达，无须另译“那”。
- source_word: מֵת
  choice: 死了
  rationale: 该动词表示押尼珥之死已先于听见这消息；汉语叙事中“听说……死了”自然体现这一先后关系。
- source_word: בְּחֶבְרוֹן
  choice: 死在希伯仑
  rationale: בְּ在此表示地点；“在希伯仑”与“死”结合，准确而自然。
- source_word: וַיִּרְפּוּ יָדָיו
  choice: 双手就发软了
  rationale: 保留原文以双手松软表达失去力量或勇气的身体隐喻，同时符合现代汉语习惯。
- source_word: כָל יִשְׂרָאֵל
  choice: 以色列众人
  rationale: 表达原文的集体民族称谓，同时避免现代读者把“以色列”只理解为地名。
- source_word: נִבְהָלוּ
  choice: 惊慌不安
  rationale: 该词表示受到震动、惊惶或陷入慌乱；“惊慌不安”兼顾其强度与自然汉语表达。
theological_decisions: []
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“双手就发软了”保留希伯来语意象，并以脚注解释其惯用含义；分号呈现主人公与全体以色列人反应之间的并列推进。
