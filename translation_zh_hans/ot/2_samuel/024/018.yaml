source:
  edition: WLC
  text: וַ/יָּבֹא גָ֥ד אֶל דָּוִ֖ד בַּ/יּ֣וֹם הַ/ה֑וּא וַ/יֹּ֣אמֶר ל֗/וֹ עֲלֵה֙ הָקֵ֤ם לַֽ/יהוָה֙ מִזְבֵּ֔חַ בְּ/גֹ֖רֶן ארניה הַ/יְבֻסִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/018.yaml
  text: That day Gad came to David and said to him[c][b][a], “Go up and set up an altar to Yahweh on the threshing floor of Araunah the Jebusite.”
translation:
  language: zh_hans
  text: 当日，迦得来到大卫那里，对他说：“你上去，在耶布斯人亚劳拿[a]的禾场上为耶和华[b]筑一座祭坛。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 《历代志上》21:18称他为“阿珥楠”。
    reason: cross_reference
  - marker: b
    text: “为耶和华”也可译作“向耶和华”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: 来到
  rationale: בוא在叙事中表示来到某人那里；结合后面的אֶל־דָּוִד，译作“来到大卫那里”自然且准确。
- source_word: בַּיּוֹם הַהוּא
  choice: 当日
  rationale: 直接表达“在那一天”，既保留明确的时间指向，也符合现代汉语叙事风格。
- source_word: עֲלֵה
  choice: 上去
  rationale: 保留עלה所含的向上行动，不将其弱化为单纯的“去”。
- source_word: הָקֵם ... מִזְבֵּחַ
  choice: 筑一座祭坛
  rationale: הקים字面为“使之立起、设立”；与“祭坛”搭配时，现代汉语通常说“筑一座祭坛”，比“立起祭坛”自然。
- source_word: לַיהוָה
  choice: 为耶和华
  rationale: 介词ל可表示归属、奉献对象或方向；“为耶和华”自然表达祭坛是献给他的，同时以“耶和华”呈现专名יהוה。
- source_word: בְּגֹרֶן
  choice: 在……的禾场上
  rationale: גורן指打谷、扬谷的场地；“禾场”是简洁且熟悉的汉语表达，处所介词ב按语境译为“在……上”。
- source_word: ארניה
  choice: 亚劳拿
  rationale: 按《撒母耳记》此处的名字形式音译，不以《历代志》的对应形式取代本文读法。
- source_word: הַיְבֻסִי
  choice: 耶布斯人
  rationale: 准确表达族属形容词，修饰亚劳拿。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 本文直接使用四字神名。现代中文圣经语境中“耶和华”辨识度高，并将其作为专名而非普通称号处理；“雅威”是按学界常见复原读音所作的另一种译法。
- issue: לַיהוָה所表达的关系
  choice: 为耶和华
  alternative: 向耶和华
  rationale: ל既可突出祭坛归属和奉献对象，也可突出敬拜行动的指向；正文采用自然的“为”，脚注保留“向”这一可能。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“筑一座祭坛”符合汉语搭配；“上去”保留原文的方向性；专名采用中文圣经读者较熟悉的形式。
