  text: וַ/יָּבֹא גָ֥ד אֶל דָּוִ֖ד וַ/יַּגֶּד ל֑/וֹ וַ/יֹּ֣אמֶר ל֡/וֹ הֲ/תָב֣וֹא לְ/ךָ֣ שֶֽׁבַע שָׁנִ֣ים רָעָ֣ב בְּ/אַרְצֶ֡/ךָ אִם שְׁלֹשָׁ֣ה חֳ֠דָשִׁים נֻסְ/ךָ֨ לִ/פְנֵֽי צָרֶ֜י/ךָ וְ/ה֣וּא רֹדְפֶ֗/ךָ וְ/אִם הֱ֠יוֹת שְׁלֹ֨שֶׁת יָמִ֥ים דֶּ֨בֶר֙ בְּ/אַרְצֶ֔/ךָ עַתָּה֙ דַּ֣ע וּ/רְאֵ֔ה מָה אָשִׁ֥יב שֹׁלְחִ֖/י דָּבָֽר־־־׀׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/013.yaml
  text: So Gad came to David and told him[a], and said to him[c][b], “Shall seven years of famine come to you in your land? Or will you flee three months before your adversaries while they pursue you? Or shall there be three days of pestilence in your land? Now know and see what answer I should return to the one who sent me.”
translation:
  language: zh_hans
  text: 迦得来到大卫那里，告诉他，说：“是让你的国中遭受七年饥荒[a]呢？还是让你在仇敌[b]追赶之下逃亡三个月呢？还是让你的国中发生三天瘟疫[c]呢？现在你要考虑清楚，看我该回什么话给那差我来的。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 《历代志上》21:12的平行记载作“三年饥荒”，本节希伯来文本作“七年”。
    reason: textual_variant
  - marker: b
    text: “仇敌”也可译作“敌人”或“敌手”。
    reason: lexical_alternative
  - marker: c
    text: “瘟疫”也可译作“疫病”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא גָד אֶל דָּוִד
  choice: 迦得来到大卫那里
  rationale: בוא在叙事中表示来到、抵达；此译自然呈现迦得前往大卫面前的动作。
- source_word: וַיַּגֶּד לוֹ
  choice: 把话告诉他
  rationale: נגד的Hifil常指告诉、报告；结合下文所传达的灾祸选项，译为“把话告诉他”自然且不过度增译。
- source_word: שֶׁבַע שָׁנִים רָעָב בְּאַרְצֶךָ
  choice: 让你的国中遭受七年饥荒
  rationale: רָעָב指饥荒而非个人饥饿；אַרְצֶךָ在君王语境中指大卫所统治的国土，译作“你的国中”比“你的地上”更自然。保留马所拉文本的“七年”。
- source_word: שְׁלֹשָׁה חֳדָשִׁים נֻסְךָ לִפְנֵי צָרֶיךָ
  choice: 让你在仇敌追赶之下，逃亡三个月
  rationale: 原文是省略结构，נֻסְךָ表达大卫一方逃跑，לִפְנֵי צָרֶיךָ表示在敌对者面前退逃；中文补出选项句式以保持清楚。
- source_word: צָרֶיךָ
  choice: 仇敌
  rationale: צַר可指敌手、仇敌；“仇敌”在现代中文中庄重清楚，“敌人”亦为可行选择。
- source_word: וְהוּא רֹדְפֶךָ
  choice: 在仇敌追赶之下
  rationale: 希伯来文代词为阳性单数，但其先行概念是复数“你的仇敌”，可能具有集合性。中文采用不标明单复数的“仇敌”，保留这种张力而不制造语法突兀。
- source_word: שְׁלֹשֶׁת יָמִים דֶּבֶר
  choice: 三天瘟疫
  rationale: דֶּבֶר通常指致命流行疫病，可译“瘟疫”或“疫病”；“瘟疫”简洁、庄重，并符合灾祸语境。
- source_word: עַתָּה דַּע וּרְאֵה
  choice: 现在你要仔细考虑
  rationale: 字面为“现在要知道并看”，在此是要求大卫审慎权衡并作出答复；“仔细考虑”自然表达这一成对命令的语用意义。
- source_word: מָה אָשִׁיב שֹׁלְחִי דָּבָר
  choice: 我该怎样回复那差我来的
  rationale: השיב דבר是“回话、答复”的惯用表达；שֹׁלְחִי指差遣迦得的那一位。译文不补明身份，以保留原文的指称方式。
theological_decisions:
- issue: 与《历代志上》21:12所记饥荒年数不同
  choice: 正文依WLC马所拉文本译作“七年饥荒”
  alternative: 《历代志上》21:12作“三年饥荒”
  rationale: 本节所据希伯来文本明确作“七年”；不在正文中与平行经文协调，而以脚注透明保留差异。
- issue: “那差我来的”所指身份
  choice: 沿用原文的间接称呼，不在正文补作“耶和华”
  alternative: 译作“差我来的耶和华”
  rationale: 上下文可辨其所指，但本节原文本身仅说“差我来的”；不补明可避免把上下文推论写进正文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。三个灾祸选项以“是……呢？还是……呢？还是……呢？”构成清晰的并列问句；避免古奥的“知道并察看”，同时保留先知传话时的严肃语气。
