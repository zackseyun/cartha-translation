  text: They traveled throughout all the land, and at the end of nine months and twenty days they came to Jerusalem.
translation:
  language: zh_hans
  text: 他们走遍全境，过了九个月零二十天，到了耶路撒冷。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשֻׁטוּ
  choice: 他们走遍
  rationale: שׁוט在此表示在一个区域内往来行走；结合人口统计的行程语境，“走遍”自然地表达了巡行各处，而不带“漫游”的漫无目的意味。
- source_word: בְּכָל הָאָרֶץ
  choice: 全境
  rationale: בְּכָל הָאָרֶץ指整个受调查的地域；“全境”简洁自然，也避免把הָאָרֶץ误解为整个地球。
- source_word: וַיָּבֹאוּ
  choice: 就回到
  rationale: בוא基本义为“来到、到达”。因前文表明约押等人从耶路撒冷出发（24:4），此处目的地又是耶路撒冷，汉语用“回到”能自然呈现叙事方向；“就”承接历时短语。
- source_word: מִקְצֵה
  choice: 过了
  rationale: 该短语在时间表达中标明一段时期的终点。“过了”符合现代汉语叙事习惯，准确表达这段时间结束之后。
- source_word: תִשְׁעָה חֳדָשִׁים וְעֶשְׂרִים יוֹם
  choice: 九个月零二十天
  rationale: “零”是现代汉语连接月数与额外日数的自然说法，清楚保留原文的精确时长。
- source_word: יְרוּשָׁלִָם
  choice: 耶路撒冷
  rationale: 采用该地名在现代中文圣经与一般汉语中的通行译名。
