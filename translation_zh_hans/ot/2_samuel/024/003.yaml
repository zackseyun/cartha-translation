  naturalness: 整体庄重自然。“我主我王”适合宫廷称谓；将数量表达改为“增至现在的一百倍”可消除现代汉语的数量歧义。
  terminology: “雅威”准确保留神名；“上帝”“百姓”“我主我王”均恰当。
