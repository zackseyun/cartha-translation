base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/003.yaml
  text: But Joab said to the king[a], “May Yahweh your God add to the people a hundred times as many as they are, and may the eyes of my lord the king see it. But why does my lord the king delight in this thing?”
translation:
  language: zh_hans
  text: 约押却对王说：“愿雅威——你的上帝——使百姓增至现在的一百倍，并愿我主我王亲眼看见[a]。可是，我主我王为什么喜欢做这件事呢？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文没有明说“看见”的对象；意思是约押祝愿王能亲眼见证百姓这样增多。
    reason: 说明希伯来文的隐含宾语，同时避免正文过度补足。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 却……说
  rationale: 连续式叙事动词推进情节；结合上下文，约押是在反对王的命令，因此用“却”表达转折比单纯的“于是”更贴切。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来语四字神名音译，以保留这里使用的上帝专名，而不以称号替代。
- source_word: אֱלֹהֶיךָ
  choice: 你的上帝
  rationale: 准确表达第二人称阳性单数所属关系。
- source_word: אֶל הָעָם
  choice: 使百姓……增多
  rationale: עָם的基本义是“百姓、人民”；虽在人口统计语境中也涉及军力，正文不作过度限定。介词结构结合יוֹסֵף自然译为“使……增多”。
- source_word: כָּהֵם וְכָהֵם מֵאָה פְעָמִים
  choice: 比现在增多百倍
  rationale: 这是表示在现有数目上成倍增加的习语；“比现在增多百倍”以自然汉语传达其意义。
- source_word: וְעֵינֵי אֲדֹנִי הַמֶּלֶךְ רֹאוֹת
  choice: 并愿我主我王亲眼看见
  rationale: 保留祝愿语气；希伯来文没有明说“看见”的宾语，中文正文也不补出明确宾语，以保存原文的含蓄。
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: 我主我王
  rationale: 保留古代宫廷中恭敬的称呼格式，同时在现代中文中仍清楚可懂。
- source_word: חָפֵץ בַּדָּבָר הַזֶּה
  choice: 喜欢做这件事
  rationale: חָפֵץ表示喜悦、乐意或属意；结合王所下的命令，译为“喜欢做这件事”自然且不过度解释动机。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。音译“雅威”保留其专名性质，避免把专名改为称号。
- issue: 约押祝愿中“亲眼看见”的对象
  choice: 正文不明说宾语
  alternative: 亲眼看见百姓这样增多
  rationale: 希伯来文的宾语是隐含的，语境表明约押愿王活着见证这种增长，但正文不把这一推断写成明说，以保留原文的省略。
translation_notes:
  register: 采用庄重、清晰的现代标准汉语。“我主我王”保留宫廷称谓的历史语感；“亲眼看见”自然表达希伯来语“眼睛看见”的说法。正文中的脚注标记[a]与脚注对应。
