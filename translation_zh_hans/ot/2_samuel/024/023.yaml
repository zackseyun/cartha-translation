source:
  edition: WLC
  text: הַ/כֹּ֗ל נָתַ֛ן אֲרַ֥וְנָה הַ/מֶּ֖לֶךְ לַ/מֶּ֑לֶךְ וַ/יֹּ֤אמֶר אֲרַ֨וְנָה֙ אֶל הַ/מֶּ֔לֶךְ יְהוָ֥ה אֱלֹהֶ֖י/ךָ יִרְצֶֽ/ךָס־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/023.yaml
  text: Araunah the king gave all this to the king[a]. And Araunah said to the king[b], “May Yahweh your God accept you.”
translation:
  language: zh_hans
  text: 亚劳拿王把这一切都给了王[a]。亚劳拿对王说：“愿雅威你的上帝悦纳你[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“亚劳拿王把这一切都给了王”。“王”这一称号用于亚劳拿，在这里较为特殊；有些译本为使语意顺畅而不保留这个称号。
    reason: alternative_reading
  - marker: b
    text: “悦纳你”也可译作“喜悦你”或“恩待你”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֹּל
  choice: 这一切
  rationale: 回指上一节所提到的祭牲和器具等全部物品，现代汉语中“这一切”既自然，也保留了整体性。
- source_word: נָתַן
  choice: 给了
  rationale: 此处完成式在叙事中陈述亚劳拿的赠予，以“给了”准确表达；不额外限定为已经成交的转让。
- source_word: אֲרַוְנָה הַמֶּלֶךְ
  choice: 亚劳拿王
  rationale: 马所拉文本明确把“王”作为亚劳拿的称号。虽然语境上不同寻常，正文仍予保留，不擅自消解文本难点。
- source_word: לַמֶּלֶךְ
  choice: 给了王
  rationale: 介词 לְ 标明接受者，即大卫；译作“给了王”符合现代汉语表达。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以常见的现代汉语音译呈现四字神名，保留其专名性质，不以称号替代。
- source_word: אֱלֹהֶיךָ
  choice: 你的上帝
  rationale: 忠实呈现第二人称阳性单数所属后缀，指亚劳拿对大卫所说“你的上帝”。
- source_word: יִרְצֶךָ
  choice: 悦纳你
  rationale: רצה 在此表达带有恩宠的接纳；“悦纳”适合献祭语境，同时保留对象是大卫本人，而不改写为只悦纳祭物。
theological_decisions:
- issue: 如何翻译神名 יְהוָה
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。译作“雅威”保留专名，避免用称号取代，也不将后期传统读法当作原文发音。
- issue: 是否保留亚劳拿的“王”这一称号
  choice: 在正文中译作“亚劳拿王”
  alternative: 只译“亚劳拿”；把 הַמֶּלֶךְ 理解为对大卫的称呼
  rationale: 现有马所拉文本的自然句法是“亚劳拿王……给王”。尽管这一称号与上下文关系难解，翻译不应在无充分依据时将其删去或改指大卫。
- issue: יִרְצֶךָ 的接受对象
  choice: 悦纳你
  alternative: 恩待你；喜悦你；悦纳你的祭物
  rationale: 动词带第二人称单数宾语，原文对象是大卫本人。“悦纳你”保留献祭背景下人与上帝之间的关系，也不补入原文没有明说的“祭物”。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“亚劳拿王……王”的重复虽不寻常，但有意保留原文的张力；引语使用“愿……”表达希伯来语未完成式在祝愿句中的语气。
