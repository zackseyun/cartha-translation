id: 2SA.24.15
reference: 2 Samuel 24:15
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יִּתֵּ֨ן יְהוָ֥ה דֶּ֨בֶר֙ בְּ/יִשְׂרָאֵ֔ל מֵ/הַ/בֹּ֖קֶר וְ/עַד עֵ֣ת מוֹעֵ֑ד וַ/יָּ֣מָת מִן הָ/עָ֗ם מִ/דָּן֙ וְ/עַד בְּאֵ֣ר שֶׁ֔בַע שִׁבְעִ֥ים אֶ֖לֶף אִֽישׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/015.yaml
  text: So Yahweh sent a plague on Israel from the morning until the appointed time[a], and seventy thousand men of the people died, from Dan to Beersheba.
translation:
  language: zh_hans
  text: 于是，耶和华使瘟疫临到以色列，从早晨直到指定的时候[a]；从但到别是巴，百姓中死了七万人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“定好的时候”。这个希伯来语短语可指指定或固定的时刻；在这里译作“聚会的时候”的可能性较小。
    reason: 保留עֵת מוֹעֵד的词义范围及较不可能的另一种理解。
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: 使……临到
  rationale: 该动词字面为“给”，但与“瘟疫”连用时表达使灾祸临到；这一译法符合现代汉语，也保留上帝直接施行审判的语义。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经传统中对四字神名的通行音译，保留其作为以色列之上帝专名的性质，而不以称号替代。
- source_word: דֶּבֶר
  choice: 瘟疫
  rationale: 准确表达致命传染性灾害，在现代汉语中清楚、庄重，并适合本段审判语境。
- source_word: בְּיִשְׂרָאֵל
  choice: 临到以色列
  rationale: 介词表示灾祸发生在或落在以色列身上；配合“使……临到”构成自然汉语。
- source_word: מֵהַבֹּקֶר
  choice: 从早晨
  rationale: 保留希伯来文明确的时间起点。
- source_word: וְעַד עֵת מוֹעֵד
  choice: 直到指定的时候
  rationale: מוֹעֵד在此最可能指预定、指定的时刻；措辞保留是谁指定以及具体为何时的未明之处。
- source_word: וַיָּמָת מִן הָעָם
  choice: 百姓中死了
  rationale: 把集合性的表达转为自然汉语，清楚表明死者出自百姓之中。
- source_word: מִדָּן וְעַד בְּאֵר שֶׁבַע
  choice: 从但到别是巴
  rationale: 直译地理范围，同时保留这一涵盖以色列全境的固定表达。
- source_word: שִׁבְעִים אֶלֶף אִישׁ
  choice: 七万人
  rationale: אִישׁ在数词后作个体计数用；现代汉语“七万人”自然且准确，不必强行译成仅指成年男性的“七万男人”。
theological_decisions:
- issue: 审判中的神圣行动主体
  choice: 耶和华使瘟疫临到以色列
  alternative: 耶和华容许瘟疫临到以色列
  rationale: 希伯来文直接以耶和华为动作主体，没有“容许”之类的缓和词，因此保留经文明确的神圣能动性。
- issue: עֵת מוֹעֵד的含义
  choice: 指定的时候
  alternative: 定好的时候；聚会的时候
  rationale: 上下文最支持时间终点之义，但该短语没有说明具体时刻，且מוֹעֵד在别处也可涉及集会；正文采用较可能的时间义，脚注保留词义上的余地。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。句首“于是”承接叙事结果；分号划分瘟疫持续时间与死亡范围、人数。专名采用中文圣经通行形式“但”“别是巴”。
