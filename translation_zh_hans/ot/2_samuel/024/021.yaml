base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/021.yaml
  text: And Araunah said[a], “Why has my lord the king come to his servant?” And David said, “To buy the threshing floor from you, to build an altar to Yahweh, so that the plague may be stopped from being upon the people.”
translation:
  language: zh_hans
  text: 亚劳拿说[a]：“我主我王为什么来到仆人这里？”大卫说：“我要向你买下这禾场，为雅威筑一座祭坛，好使百姓所遭的瘟疫止住。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“亚劳拿说：‘我主我王为什么来到他的仆人这里？’”“他的仆人”是亚劳拿以第三人称谦称自己。
    reason: 说明原文宫廷式第三人称自称；正文采用现代汉语更自然的表达。
lexical_decisions:
- source_word: מַדּוּעַ
  choice: 为什么
  rationale: 直接询问君王来访的缘由；现代汉语中自然明确。
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: 我主我王
  rationale: 保留敬称与王号，也传达宫廷语境中的谦恭口吻。
- source_word: עַבְדּוֹ
  choice: 仆人
  rationale: 原文直译为“他的仆人”，是亚劳拿以第三人称自称的正式谦辞；正文按现代汉语的实际指向译出，并以脚注说明形式差异。
- source_word: לִקְנוֹת מֵעִמְּךָ אֶת הַגֹּרֶן
  choice: 向你买下这禾场
  rationale: לִקְנוֹת 表示购买；גֹּרֶן 指打谷、簸扬谷物的场地，传统而通顺的中文对应为“禾场”。
- source_word: לִבְנוֹת מִזְבֵּחַ
  choice: 筑一座祭坛
  rationale: 准确表达目的不定式；“筑……祭坛”符合庄重而自然的圣经叙事语体。
- source_word: וְתֵעָצַר הַמַּגֵּפָה מֵעַל הָעָם
  choice: 好使百姓所遭的瘟疫止住
  rationale: 将未完成式的目的或预期结果译为“好使……止住”，保留被动含义而不把结果说成确定事实；关系结构自然传达 מֵעַל הָעָם 所表示瘟疫临到百姓身上的状态。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；“雅威”以现代汉语音译呈现其专名性质，不以称号替代。
- issue: 瘟疫停止的语气
  choice: 好使……止住
  alternative: 于是……就会止住
  rationale: 原文 וְתֵעָצַר 在此可表达筑坛的目的或预期结果；所选译法保留这种目的语气，不额外断定结果必然发生。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“我主我王”保留宫廷敬语，“禾场”和“筑一座祭坛”兼顾传统辨识度与当代可懂性。
