base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/005.yaml
  text: They crossed the Jordan and camped at Aroer[a], on the right side of the city that is in the middle of the valley of Gad[c][b], and toward Jazer.
translation:
  language: zh_hans
  text: 他们渡过约旦河，在亚罗珥安营，即在迦得溪谷[b]中那座城的右边[a]，朝向雅谢[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“那座城的右边”。有人按地理方位理解为“那座城的南边”，但希伯来文原句是“右边”。
    reason: lexical_alternative
  - marker: b
    text: 或译“迦得的河谷”“迦得的峡谷”或“迦得的季节性河床”。希伯来语这个词可指溪谷、峡谷或季节性水道。
    reason: lexical_alternative
  - marker: c
    text: 或译“到雅谢”。希伯来语介词既可表示朝某地而去，也可表示到达该地。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַבְרוּ אֶת־הַיַּרְדֵּן
  choice: 他们渡过约旦河
  rationale: עבר在行程叙事中以约旦河为宾语，表示渡过河流；“渡过约旦河”是自然、明确的现代汉语。
- source_word: וַיַּחֲנוּ בַעֲרוֹעֵר
  choice: 在亚罗珥安营
  rationale: חנה表示扎营；地点名前的ב在此表示停驻地点，译为“在……安营”简洁自然。
- source_word: יְמִין הָעִיר
  choice: 那座城的右边
  rationale: ימין本义为右手、右侧。正文保留原文空间表达，不直接解释为“南边”，以免消除其可能的地理含义。
- source_word: אֲשֶׁר בְּתוֹךְ הַנַּחַל הַגָּד
  choice: 迦得溪谷中那座城
  rationale: 关系从句修饰“城”；נחל可指溪谷、河谷、峡谷或季节性河床。“溪谷”兼顾地形低谷与水道含义；הַגָּד按地域属格译作“迦得”。
- source_word: וְאֶל יַעְזֵר
  choice: 朝向雅谢
  rationale: אל既可表示到达某地，也可表示朝某方向。此处译为“朝向”保留是否已经抵达雅谢的开放性。
