base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/024.yaml
  text: But the king said to Araunah[a], “No, but I will surely buy it from you for a price[c][b]. I will not offer to Yahweh my God burnt offerings that cost me nothing.” So David bought the threshing floor and the cattle for fifty shekels of silver.
translation:
  language: zh_hans
  text: 王对亚劳拿说：“不！我一定要付价从你那里买下。我绝不把白白得来的燔祭献给雅威——我的上帝。”[a]于是，大卫用五十舍客勒银子买下了禾场和牛。[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “白白得来的燔祭”也可较直译为“不花代价的燔祭”或“免费的燔祭”。
    reason: lexical_alternative
  - marker: b
    text: “牛”也可译作“牛群”或“公牛”；希伯来词可统指牛，也可指用于劳作或献祭的牛。
    reason: lexical_alternative
  - marker: c
    text: 《历代志上》21:25记载，大卫为那块地付了六百舍客勒金子；本节则明确记载禾场和牛的价款为五十舍客勒银子。
    reason: cross_reference
lexical_decisions:
- source_word: אֲרַוְנָה
  choice: 亚劳拿
  rationale: 按本节希伯来文人名形式音译；《历代志上》平行经文所用“阿珥楠”反映的是另一名称形式。
- source_word: קָנוֹ אֶקְנֶה
  choice: 我一定要……买
  rationale: 不定式绝对形与限定动词连用，具有加强语气的作用；“一定要买”自然地保留了这一强调。
- source_word: בִּמְחִיר
  choice: 按价
  rationale: מְחִיר指购买所付的价款；“按价”简洁保留交易含义。
- source_word: לַיהוָה אֱלֹהַי
  choice: 献给雅威我的上帝
  rationale: 直译神名יהוה为“雅威”，并保留第一人称所属语“我的上帝”。
- source_word: עֹלוֹת
  choice: 燔祭
  rationale: 指祭物在坛上全部焚烧的祭；“燔祭”是准确而通行的中文圣经用语。
- source_word: חִנָּם
  choice: 白白得来的
  rationale: 该词本义是“无代价、免费”；结合购买语境，这里指大卫不愿献上自己未付代价取得的祭物，同时以脚注保留更贴近字面的表达。
- source_word: הַגֹּרֶן
  choice: 禾场
  rationale: 指脱粒、扬谷所用的场地；“禾场”是简明而通行的中文对应词。
- source_word: הַבָּקָר
  choice: 牛
  rationale: 该集合名词可泛指牛群，也可具体指用于劳作或献祭的牛；中文“牛”保持其范围，不强行限定为公牛。
- source_word: בְּכֶסֶף שְׁקָלִים חֲמִשִּׁים
  choice: 用五十舍客勒银子
  rationale: 自然表达作为购买价款的银子重量，同时保留原文的数额和计量单位。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；音译为“雅威”保留其作为立约神名的性质，既不以称号替代，也不引入其他读音传统。
- issue: חִנָּם所表达的献祭代价
  choice: 白白得来的燔祭
  alternative: 白白献燔祭；献不花代价的燔祭
  rationale: 上下文重点在于大卫拒绝无偿取得祭物，而不是断言祭物本身具有功德；正文按语境表达，脚注保留原文较简约、可有不同理解的措辞。
- issue: 与历代志上21:25价格记载的关系
  choice: 不在正文中调和，脚注并列说明
  alternative: 把两处数额解释为同一笔交易的不同阶段或不同范围
  rationale: 本节明确说五十舍客勒银子购买禾场和牛，而平行经文记载为整块地付六百舍客勒金子；译文不替原文决定两者的具体关系。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“不！”保留王明确拒绝无偿接受的语气；“我一定要按价从你手里买”体现希伯来文的强调结构。“禾场”“燔祭”“舍客勒”保留必要的古代文化和祭祀术语，并避免在正文中对平行经文的价格差异作未经文本明示的调和。
