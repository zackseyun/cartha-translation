  text: וַ/יַּ֤ךְ לֵב דָּוִד֙ אֹת֔/וֹ אַחֲרֵי כֵ֖ן סָפַ֣ר אֶת הָ/עָ֑ם וַ/יֹּ֨אמֶר דָּוִ֜ד אֶל יְהוָ֗ה חָטָ֤אתִי מְאֹד֙ אֲשֶׁ֣ר עָשִׂ֔יתִי וְ/עַתָּ֣ה יְהוָ֔ה הַֽעֲבֶר נָא֙ אֶת עֲוֺ֣ן עַבְדְּ/ךָ֔ כִּ֥י נִסְכַּ֖לְתִּי מְאֹֽד־־־ס־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/010.yaml
  text: After that[a], David’s heart struck him after he had counted the people. And David said to Yahweh, “I have sinned greatly in what I have done. And now, Yahweh, please take away the guilt of your servant[c][b], for I have acted very foolishly.”
translation:
  language: zh_hans
  text: 大卫数点了百姓[a]以后，心中深感自责[b]。他对雅威说：“我做了这事，犯了大罪。雅威啊，现在求你除去你仆人的罪责[c]，因为我行事实在太愚昧了。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “数点”也可译作“数算”或“统计人口”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语直译为“大卫的心击打他”，是表示内心受到谴责或良心不安的习语。
    reason: cultural_note
  - marker: c
    text: “罪责”也可译作“罪孽”；这个希伯来词有时也可指犯罪所招致的刑罚。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּךְ לֵב דָּוִד אֹתוֹ
  choice: 心中深感自责
  rationale: 希伯来语直译为“大卫的心击打他”，是描述内心谴责、良心不安的习语；译文传达其含义，脚注保留原文意象。
- source_word: אַחֲרֵי כֵן סָפַר אֶת־הָעָם
  choice: 数点了百姓以后
  rationale: 按希伯来语所表达的时间关系，说明大卫内心自责发生在数点百姓之后；“数点”兼顾“数算”和官方统计人口的语境。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，保留其作为专名的性质，不以称号替代。
- source_word: חָטָאתִי מְאֹד אֲשֶׁר עָשִׂיתִי
  choice: 我做了这事，犯了大罪
  rationale: 自然表达关系从句与强调词 מְאֹד，清楚表明大卫承认自己的行为构成严重的罪。
- source_word: הַעֲבֶר נָא
  choice: 求你除去
  rationale: 该使役形式在此是请求神使罪责离去；“求你除去”既自然，也保留恳求语气。
- source_word: עֲוֺן עַבְדְּךָ
  choice: 你仆人的罪责
  rationale: עָוֹן 可指罪孽、罪责，有时也指罪的刑罚；“罪责”在认罪并求神除去的语境中最贴切，同时以脚注保留词义范围。
- source_word: כִּי נִסְכַּלְתִּי מְאֹד
  choice: 因为我行事实在太愚昧了
  rationale: 传达该动词“行事愚昧”的行为性含义，并以“实在太”体现 מְאֹד 的强调。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较贴近学界通常重构的读音，并避免用“主”等称号替代专名。
- issue: עָוֹן 在祈求中的含义
  choice: 罪责
  alternative: 罪孽；刑罚
  rationale: 原词有相互关联的多重含义。大卫先认罪，继而请求神将其除去，因此正文采用兼具罪与责任意味的“罪责”，不把含义收窄为刑罚。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“心中深感自责”自然呈现希伯来习语的实际含义，原文意象由脚注保留；祷告中的称呼与请求保持恭敬、直接。
