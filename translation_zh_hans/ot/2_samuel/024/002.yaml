  terminology: “军队统帅”“百姓”“数目”均合适。“清点”准确保留 פקד 的基本意义。原脚注中的“点阅百姓”在现代汉语中不够自然，且容易偏向检阅；宜改以“登记”说明其行政／军事编制相关的语义范围。
