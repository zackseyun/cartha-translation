reference: 2 Samuel 24:2
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר הַ/מֶּ֜לֶךְ אֶל יוֹאָ֣ב שַׂר הַ/חַ֣יִל אֲשֶׁר אִתּ֗/וֹ שֽׁוּט נָ֞א בְּ/כָל שִׁבְטֵ֤י יִשְׂרָאֵל֙ מִ/דָּן֙ וְ/עַד בְּאֵ֣ר שֶׁ֔בַע וּ/פִקְד֖וּ אֶת הָ/עָ֑ם וְ/יָ֣דַעְתִּ֔י אֵ֖ת מִסְפַּ֥ר הָ/עָֽם־׀־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/002.yaml
  text: So the king said to Joab[a], the commander of the army who was with him, “Go about now through all the tribes of Israel, from Dan to Beer-sheba, and count the people, so that I may know the number of the people.”
translation:
  language: zh_hans
  text: 于是，王对与他在一起的军队统帅约押说：“你去走遍以色列所有支派，从但到别是巴；你们要清点百姓[a]，好让我知道百姓的数目。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“登记百姓”。这个希伯来语动词可指清点或登记人员，有时带有军事编制的含义。
    reason: 保留 פקד 在人口清点、登记及军事行政语境中的词义幅度，同时避免不自然的“点阅百姓”。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 于是……说
  rationale: 承接并推进叙事；“于是”符合现代汉语叙事习惯，又不把连接词解释得过重。
- source_word: הַמֶּלֶךְ
  choice: 王
  rationale: 保留原文在此使用的称号，不以语境中的名字“大卫”替代。
- source_word: שַׂר הַחַיִל
  choice: 军队统帅
  rationale: שַׂר 表示首领或长官，חַיִל 在这里指军事力量；“军队统帅”准确而符合现代汉语。
- source_word: אֲשֶׁר אִתּוֹ
  choice: 在他身边的
  rationale: 直陈约押当时与王同在，不增添原文未明说的职务关系或行动。
- source_word: שׁוּט נָא
  choice: 你现在要走遍
  rationale: שׁוּט 表示在一片区域中往来巡行；נָא 缓和命令语气。“现在要”在王命语境中自然，且不将其弱化为普通请求。
- source_word: בְּכָל שִׁבְטֵי יִשְׂרָאֵל
  choice: 走遍以色列所有支派
  rationale: 介词与移动动词连用，表达遍行各支派范围；“所有”对应 כָּל。
- source_word: מִדָּן וְעַד בְּאֵר שֶׁבַע
  choice: 从但直到别是巴
  rationale: 保留表示全境范围的地理两极说法，并采用通行的中文圣经地名。
- source_word: וּפִקְדוּ
  choice: 你们要清点
  rationale: פקד 在此指清点或登记人口。“清点”清楚表达核定人数，同时脚注保留登记、点阅的可能语感；原文由单数命令转为复数命令，故译作“你们”。
- source_word: אֶת הָעָם
  choice: 百姓
  rationale: עָם 是宽泛的“人民、百姓”，不因军事语境而限缩为士兵或战士。
- source_word: וְיָדַעְתִּי
  choice: 好让我知道
  rationale: 在命令之后自然表达目的或结果，同时没有把形式机械译成单纯并列的“我就知道”。
- source_word: מִסְפַּר הָעָם
  choice: 百姓的数目
  rationale: 直接保留原文的结构和“百姓”的重复，避免改写为更窄的军事人数。
theological_decisions:
- issue: 军事行政语境中 הָעָם 的范围
  choice: 百姓
  alternative: 战士／军兵
  rationale: 虽然约押是军队统帅，人口清点也可能具有军事用途，但原文使用宽泛的 עָם，而非专指作战人员的词，因此不把范围限缩为军兵。
- issue: וּפִקְדוּ 的单复数变化
  choice: 将 שׁוּט 的单数命令译为“你”，将 וּפִקְדוּ 的复数命令译为“你们”
  alternative: 两处都译作单数“你”
  rationale: 保留原文从向约押个人下令到要求约押及其随员共同清点的语法变化，不在正文中进一步解释参与者身份。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“从但直到别是巴”保留原文的全境表达；用分号清楚呈现先遍行、后清点的两项命令。脚注标记紧接其所说明的“清点百姓”。
