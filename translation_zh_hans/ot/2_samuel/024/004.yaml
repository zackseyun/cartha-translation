base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/004.yaml
  text: But the king’s word prevailed against Joab and against the commanders of the army, so Joab and the commanders of the army went out from before the king to count the people of Israel.
translation:
  language: zh_hans
  text: 但王的命令胜过了约押和众军长；于是约押和众军长从王面前出去，数点以色列民。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֶּחֱזַק דְּבַר הַמֶּלֶךְ אֶל־יוֹאָב וְעַל שָׂרֵי הֶחָיִל
  choice: 王的命令压过了约押和众军长的反对
  rationale: חזק在此表示王命占了上风、最终得到执行；“压过了……的反对”既保留对抗意味，又以自然汉语交代上下文隐含的抗拒。דבר译作“命令”，符合王对臣属发令的语境。
- source_word: שָׂרֵי הֶחָיִל
  choice: 众军长
  rationale: 指军队的首领或统帅群体；“众军长”简洁、庄重，并保留复数。
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: 从王面前
  rationale: 按希伯来语空间表达直译，表示他们离开王所在之处。
- source_word: לִפְקֹד אֶת־הָעָם אֶת־יִשְׂרָאֵל
  choice: 数点以色列民
  rationale: פקד在本段语境中是登记、清点人口；“数点”符合圣经叙事语体，也能为后文人口统计保留明确关联。
theological_decisions:
- issue: 王命与约押等人的抗拒之间的张力
  choice: 译为“压过了……的反对”
  alternative: “王的话胜过约押和众军长”
  rationale: 原文介词结构带有命令针对并压倒约押等人的意味；明示“反对”来自紧接的上下文，但不引入关于王权正当性的神学判断。
- issue: 叙事分句间的结果关系
  choice: 使用“于是”
  alternative: 仅用“而”连接
  rationale: 后半句出行数点百姓显然是王命占上风后的结果；“于是”自然呈现这一叙事关系，不额外解释行为的道德性质。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“压过了……的反对”比生硬的“向约押强硬”更清楚，也保留原文中王命与臣下意见相抗的力度；“数点”延续较为正式的圣经用语。
