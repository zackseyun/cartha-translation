base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/006.yaml
  text: They came to Gilead and to the land of Tahtim-hodshi[a], and they came to Dan-jaan[b], and around to Sidon.
translation:
  language: zh_hans
  text: 他们来到基列，又来到他亭·何得示[a]地；随后来到但·雅安[b]，并绕行到西顿。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文“他亭·何得示”含义不明。有些学者校订或解释为“在加低斯的赫人之地”等类似说法，但原文所指的地名不能确定。
    reason: alternative_reading
  - marker: b
    text: “但·雅安”很可能是一个地名，但具体位于何处不能确定。
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: 他们来到／随后来到
  rationale: בוא 的连续叙事形式描述行程中的移动。译作“来到”自然，并保留原文两次出现所形成的逐站行程感；第二次加“随后”使现代汉语衔接清楚。
- source_word: הַגִּלְעָדָה
  choice: 来到基列
  rationale: 地名后的方向词尾表示朝向或进入该地；汉语用“来到基列”自然表达。
- source_word: אֶרֶץ
  choice: ……地
  rationale: 此处指一个地域。将“他亭·何得示”与“地”组合，既保留地名的不确定性，也符合现代汉语地理表述。
- source_word: תַּחְתִּים חָדְשִׁי
  choice: 他亭·何得示
  rationale: 该词组在文本和地理上都含义不明，可能保存了地名或复合地名。正文采用音译，避免把推测性的校勘或释义写入经文。
- source_word: דָּנָה יַּעַן
  choice: 但·雅安
  rationale: 最适合作为地名音译；דָּנָה 的方向词尾通过“来到”表达，不另行硬译。
- source_word: וְסָבִיב
  choice: 并绕行
  rationale: סָבִיב 可表示环绕或迂回的移动。“绕行”比单独的“周围”更清楚地呈现行程动作，同时不补入未经明说的主语或地点。
- source_word: אֶל צִידוֹן
  choice: 到西顿
  rationale: 介词 אֶל 加地名表示移动的方向或终点；“到西顿”简洁自然。
