base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/009.yaml
  text: 'Joab gave the number of the census of the people to the king: Israel was eight hundred thousand valiant men who drew the sword[a], and the men of Judah were five hundred thousand men.'
translation:
  language: zh_hans
  text: 约押把百姓登记所得的数目交给王：以色列共有八十万能拔刀作战的勇士[a]；犹大共有五十万人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 《历代志上》21:5的平行记载所列总数不同：以色列为一百一十万，犹大为四十七万。本节依《撒母耳记下》的希伯来文本翻译，没有把两处数字协调一致。
    reason: cross_reference
lexical_decisions:
- source_word: מִסְפַּר מִפְקַד הָעָם
  choice: 百姓登记所得的数目
  rationale: 这个结构兼有“数目”和“登记、点数”之意。译文保留两层含义，同时比“百姓普查的数目”更符合本段军事点数的语境。
- source_word: וַתְּהִי יִשְׂרָאֵל
  choice: 以色列共有
  rationale: 这里的“以色列”是集合称谓，后接统计总数；“共有”以自然中文表达点数后的总计结果。
- source_word: שְׁמֹנֶה מֵאוֹת אֶלֶף
  choice: 八十万
  rationale: 按马所拉文本直译基数。
- source_word: אִישׁ חַיִל
  choice: 英勇善战的人
  rationale: 该词组表示有能力、有勇力的战士；结合军事登记语境，译作“英勇善战的人”，兼顾勇武含义与现代中文的自然度。
- source_word: שֹׁלֵף חֶרֶב
  choice: 能拔刀作战
  rationale: 保留原文“拔刀”的具体军事形象，并以“能”显明这里指具备参战能力的人，而非正在进行拔刀动作。
- source_word: וְאִישׁ יְהוּדָה
  choice: 犹大共有
  rationale: 原文单数形式在这里具有集合意义；中文以“犹大共有”自然引出该群体的总人数。
- source_word: חֲמֵשׁ מֵאוֹת אֶלֶף אִישׁ
  choice: 五十万人
  rationale: 保留原文明说的计数单位“人”，并按马所拉文本译出数目。
theological_decisions:
- issue: 与《历代志上》21:5平行记载的数字差异
  choice: 依《撒母耳记下》的马所拉文本译为以色列八十万、犹大五十万。
  alternative: 按《历代志上》21:5的数字协调经文，或在正文中引入关于常备军、后备军计算范围的解释。
  rationale: 翻译应如实呈现本节希伯来文本，不在正文中消解平行记载之间的差异；可能的协调解释不属于原文本身。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“登记所得的数目”表达统计过程及结果；“英勇善战、能拔刀作战”保留军事语境和原文的具体意象。脚注标记紧随与数字差异相关的以色列军力陈述之后。
