  text: וַ/יֹּ֧אמֶר דָּוִ֛ד אֶל גָּ֖ד צַר לִ֣/י מְאֹ֑ד נִפְּלָה נָּ֤א בְ/יַד יְהוָה֙ כִּֽי רַבִּ֣ים רחמ/ו וּ/בְ/יַד אָדָ֖ם אַל אֶפֹּֽלָה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/014.yaml
  text: Then David said to Gad[a], “I am in great distress. Let us fall, please, into the hand of Yahweh, for his mercies are many[b]; but let me not fall into the hand of man.”
translation:
  language: zh_hans
  text: 大卫对迦得说：“我极其为难。我们落在雅威手中吧，因为他的怜悯丰盛[a]；只是不要让我落在人手中[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“因为他的怜悯很多。”希伯来文“怜悯”为复数，表示怜悯极其丰盛。
    reason: 说明רחמים的复数形式及其在中文中的自然表达。
  - marker: b
    text: “落在人手中”指落在人的权势或控制之下。
    reason: 解释希伯来语“在……手中”的惯用意义。
lexical_decisions:
- source_word: צַר לִי מְאֹד
  choice: 我十分为难
  rationale: 谓语形容词צַר与לִי连用，表达大卫身处极度困境、难以抉择；“我十分为难”自然凝练，并契合上下文中必须选择刑罚的处境。
- source_word: נִפְּלָה נָּא
  choice: 求你让我们落在……吧
  rationale: נִפְּלָה是第一人称复数祈愿式，保留“我们”，体现大卫将自己与百姓一同置于审判之下；נָא表达恳求语气。
- source_word: בְיַד יְהוָה
  choice: 落在耶和华手中
  rationale: “在……手中”在汉语中可自然表达受其权柄、处置或掌管，同时保留希伯来语意象。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的专名“耶和华”对应四字神名，明确这是名字而非“主”这一称号。
- source_word: כִּי רַבִּים רחמו
  choice: 因为他有丰盛的怜悯
  rationale: 马所拉辅音文本所指为“他的怜悯很多”；中文用集合意义的“丰盛的怜悯”自然表达其丰富、众多，脚注保留较直译形式。
- source_word: וּבְיַד אָדָם
  choice: 落在人手中
  rationale: אָדָם在此泛指人类，与耶和华形成鲜明对照；“人手中”既保留单数集合意义，也符合现代汉语表达。
- source_word: אַל אֶפֹּלָה
  choice: 不要让我落在
  rationale: 否定词אַל与第一人称单数未完成式表达大卫的愿望或恳求；保留由前句复数“我们”转为单数“我”的原文张力。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。正文采用中文传统且广为人知的专名“耶和华”，不以称号“主”替代；“雅威”是另一种可能的音译。
- issue: 前后人称数的变化
  choice: 前句译“我们”，后句译“我”
  alternative: 两处统一译作“我”或“我们”
  rationale: 原文נִפְּלָה为第一人称复数，而אֶפֹּלָה为第一人称单数。保留这一变化，使大卫既与百姓共同承受审判，又以个人口吻表达不愿落入人手的恳求，不擅自消除其张力。
- issue: רחמים的数与意义
  choice: 丰盛的怜悯
  alternative: 他的怜悯很多／他的慈悲广大
  rationale: 希伯来语使用复数形式并由רַבִּים修饰。中文抽象名词“怜悯”通常不采用复数，故正文按自然汉语表达其丰盛，脚注说明字面形式。
- issue: אָדָם的泛指范围
  choice: 人
  alternative: 世人／人类
  rationale: 此处אָדָם是泛指人，与耶和华相对。“人”最简洁地保留原文单数集合用法及修辞对照。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“求你……吧”传达נָא的恳求语气；保留“我们”与“我”的转换。所有脚注标记均置于正文相应位置。
