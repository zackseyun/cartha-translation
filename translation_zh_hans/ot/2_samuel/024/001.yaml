base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/001.yaml
  text: Again the anger of Yahweh burned against Israel[a], and he incited David against them, saying, “Go[b], count Israel and Judah.”
translation:
  language: zh_hans
  text: 耶和华又向以色列发怒[a]，并煽动大卫针对他们[c]，说：“去[b]，数点以色列和犹大。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 《历代志上》21:1说，撒但起来攻击以色列，煽动大卫。本节正文依照《撒母耳记下》希伯来文最自然的主语关系来翻译，保留两处记载之间的张力，不加以调和。
    reason: cross_reference
  - marker: b
    text: 或译：“统计”，或“登记……的人数”。
    reason: lexical_alternative
  - marker: c
    text: 原文此处较难确定；也可理解为“在他们中间”或“关于他们”。
    reason: textual_ambiguity
lexical_decisions:
- source_word: וַיֹּסֶף אַף יְהוָה לַחֲרוֹת
  choice: 耶和华的怒气再次……发作
  rationale: 该结构表示耶和华的怒气再度燃起。“再次……发作”既传达重复动作和怒气炽烈的意象，也符合现代汉语表达。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神名译法“耶和华”，保留专名性质，不以称号代替。
- source_word: בְּיִשְׂרָאֵל
  choice: 向以色列
  rationale: 在“怒气发作”的惯用搭配中，介词指明怒气所针对的对象；“向以色列”自然且准确。
- source_word: וַיָּסֶת
  choice: 他煽动
  rationale: סות 的使役形表示怂恿、挑动或煽动。“煽动”保留了行为促发者的因果作用及其负面语气。
- source_word: בָּהֶם
  choice: 与他们为敌
  rationale: 这一短语含义较难确定，可指针对他们、在他们中间或关乎他们。结合随后的数点及审判语境，“与他们为敌”自然表达大卫受煽动而采取对他们不利的行动，同时不把它误作地点短语。
- source_word: לֵךְ
  choice: 去
  rationale: 简洁保留命令语气。
- source_word: מְנֵה
  choice: 数点
  rationale: מנה 意为计算、编号；“数点”在中文中既保留原词的计数含义，也适合统计百姓的语境。
- source_word: יִשְׂרָאֵל וְאֶת יְהוּדָה
  choice: 以色列和犹大
  rationale: 直接保留两个群体或地域的专名，不增加原文没有的解释。
theological_decisions:
- issue: 与《历代志上》21:1相比，谁煽动大卫
  choice: 以“他”承接前句的耶和华
  alternative: 译作不定主语，或参照《历代志上》明确译作“撒但”
  rationale: 本节希伯来语中，וַיָּסֶת 的主语最自然地承接前面的“耶和华”。正文因此保留《撒母耳记下》本身的叙述，也保留它与《历代志上》21:1之间真实存在的张力，不在译文中加以调和。
- issue: בָּהֶם 与大卫受煽动的关系
  choice: 与他们为敌
  alternative: 在他们中间；关乎他们；攻击他们
  rationale: 希伯来短语本身较为困难。“与他们为敌”体现 ב 的对抗性理解，并与数点百姓最终给他们带来灾祸的上下文相符；脚注重点保留其可讨论空间并避免过度确定。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“怒气……发作”自然传达希伯来语的怒火意象；“数点”略具经文语体色彩，但普通读者仍能理解，并可由脚注补充人口统计含义。所有脚注标记均已置于正文对应位置。
