id: 2SA.24.16
reference: 2 Samuel 24:16
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יִּשְׁלַח֩ יָד֨/וֹ הַ/מַּלְאָ֥ךְ יְרֽוּשָׁלִַם֮ לְ/שַׁחֲתָ/הּ֒ וַ/יִּנָּ֤חֶם יְהוָה֙ אֶל הָ֣/רָעָ֔ה וַ֠/יֹּאמֶר לַ/מַּלְאָ֞ךְ הַ/מַּשְׁחִ֤ית בָּ/עָם֙ רַ֔ב עַתָּ֖ה הֶ֣רֶף יָדֶ֑/ךָ וּ/מַלְאַ֤ךְ יְהוָה֙ הָיָ֔ה עִם גֹּ֖רֶן ה/אורנה הַ/יְבֻסִֽי׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/016.yaml
  text: When the angel stretched out his hand toward Jerusalem to destroy it[a], Yahweh relented concerning the calamity and said to the angel who was destroying the people, “Enough[b]; now withdraw your hand.” And the angel of Yahweh was by the threshing floor of Araunah the Jebusite.
translation:
  language: zh_hans
  text: 天使向耶路撒冷伸出手，要毁灭这城的时候，雅威对这场灾祸改变了心意[a]，就对那正在毁灭百姓的天使说：“够了！现在收手！”当时，雅威的天使正在耶布斯人亚劳拿[b]的打谷场旁边。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作：“雅威不再降这灾祸。”希伯来文直译为“对这灾祸改变了心意”；这里的“灾祸”指灾难，并非道德意义上的恶。
    reason: lexical_alternative
  - marker: b
    text: 在《历代志上》21:15的平行记载中，亚劳拿名叫“阿珥楠”。
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּשְׁלַח יָדוֹ
  choice: 伸出手
  rationale: 保留“伸手采取行动”的具体意象，也符合现代汉语表达。
- source_word: הַמַּלְאָךְ
  choice: 天使
  rationale: 上下文所指是执行瘟疫审判的天上使者，译作“天使”比泛称“使者”更合适。
- source_word: לְשַׁחֲתָהּ
  choice: 要毁灭这城
  rationale: 代词所指为耶路撒冷；补出“这城”使汉语指代清楚，同时保留毁灭之意。
- source_word: וַיִּנָּחֶם יְהוָה אֶל הָרָעָה
  choice: 雅威对这场灾祸改变了心意
  rationale: 保留原文关于雅威转意的拟人性张力，并将 רָעָה 按此处语境译为“灾祸”，而非道德意义的“恶”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译呈现神的专名，而不以称号替代。
- source_word: הַמַּשְׁחִית בָּעָם
  choice: 那正在毁灭百姓的天使
  rationale: 用关系结构表达分词所指的持续行动，清楚自然。
- source_word: רַב
  choice: 够了
  rationale: 在这里作简短有力的感叹语，表示已经足够。
- source_word: עַתָּה הֶרֶף יָדֶךָ
  choice: 现在收手
  rationale: “收手”是自然的现代汉语命令，既表达停止行动，也保留“手”的意象。
- source_word: וּמַלְאַךְ יְהוָה
  choice: 雅威的天使
  rationale: 忠实保留原文的属格结构，不进一步判定这位天使的本体身份。
- source_word: הָיָה עִם
  choice: 正在……旁边
  rationale: 此处表达所在位置；“旁边”自然呈现靠近打谷场的空间关系。
- source_word: גֹּרֶן
  choice: 打谷场
  rationale: 准确表达古代脱粒作业的场地，也比“禾场”更便于普通现代读者理解。
- source_word: הָאֹרְנָה
  choice: 亚劳拿
  rationale: 按《撒母耳记》的名字形式音译；《历代志》的对应形式另见脚注。
theological_decisions:
- issue: וַיִּנָּחֶם יְהוָה 对神所使用的拟人性语言
  choice: 雅威对这场灾祸改变了心意
  alternative: 雅威不再降这灾祸；雅威为这灾祸后悔
  rationale: 译文保留原文所描述的转意，而不把它解释成神犯了道德错误，也不以神学推论消除经文本身的张力。
- issue: מַלְאַךְ יְהוָה 的身份
  choice: 雅威的天使
  alternative: 神显现的形态；受造的天使使者
  rationale: 本节只给出这一称谓，并未要求译者裁定其更深层的本体身份，因此保持开放。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“改变了心意”刻意保留原文的拟人性表达和神学张力；“收手”则以自然口语化的命令保留原文手的意象。脚注标记依内容放在“灾祸”相关表述及“亚劳拿”之后。
