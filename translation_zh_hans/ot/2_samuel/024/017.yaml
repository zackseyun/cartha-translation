base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/017.yaml
  text: Then David said to the LORD, when he saw the angel striking the people, “Look, I have sinned, and I have done wrong; but these sheep—what have they done? Please let your hand be against me and against my father's house.”
translation:
  language: zh_hans
  text: 大卫看见那击打百姓的天使，就对耶和华说：“看哪，是我犯了罪，我做了错事；但这些羊作了什么呢？求你让你的手攻击我和我的父家。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的专名译法，明确对应希伯来文神名。
- source_word: הַמַּלְאָךְ הַמַּכֶּה בָעָם
  choice: 那击杀百姓的天使
  rationale: 保留定冠词和分词结构所表达的特指及正在施行击杀的含义。
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留引人注意并加强认罪语气的言谈标记，同时维持庄重语体。
- source_word: הֶעֱוֵיתִי
  choice: 我作了恶
  rationale: 与前面的“我犯了罪”并列，表达行事乖谬、有罪，而不把两个近义动词合并。
- source_word: הַצֹּאן
  choice: 这些羊
  rationale: 保留大卫将百姓比作羊群的牧者隐喻，不解释性改译为“百姓”。
- source_word: תְּהִי נָא יָדְךָ בִּי
  choice: 求你伸手攻击我
  rationale: “手临到/在……身上”在本语境指降罚；译为自然中文，同时保留主动施罚的力度。
- source_word: בְבֵית אָבִי
  choice: 我的父家
  rationale: 直译希伯来亲族表达，可涵盖父系家族或家室，不擅自缩窄为某些具体成员。
theological_decisions:
- issue: 大卫承担罪责与百姓受罚之间的张力
  choice: 保留“是我……但这些羊作了什么呢？”的直接对比
  alternative: 解释为百姓完全无罪，或补充他们受罚的神学原因
  rationale: 原文突出大卫的认罪和代求，却没有在本节系统说明百姓的道德责任；译文不替原文消解这一张力。
- issue: “你的手”所指的行动
  choice: 译作“伸手攻击”
  alternative: 较缓和地译作“惩罚”或“降灾”
  rationale: 上下文中的天使正击杀百姓，“手”具有施行打击的具体意象；保留这一严峻表达。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准普通话。“看哪”“父家”略带经文庄重色彩，但仍为现代读者熟悉；标点突出大卫在“这些羊”处的转折和恳求。
