  to: 大卫看见那击打百姓的天使，就对耶和华说：“看哪，是我犯了罪，我做了错事；但这些羊作了什么呢？求你让你的手攻击我和我的父家。”
  rationale: 修改“击杀”为“击打”，以避免把原文分词的打击意义无依据地限定为杀戮；微调认罪及祈求的措辞，使其在现代汉语中更自然，同时保留原文的并列、隐喻和严峻的求罚语气。
