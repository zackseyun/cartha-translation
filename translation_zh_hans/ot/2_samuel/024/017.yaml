  source_fidelity: “那击杀百姓的天使”将希伯来语分词 הַמַּכֶּה（正在击打/施灾）明确化为“击杀”，超过了本节动词本身的语义；尽管上下文涉及瘟疫死亡，原文此处仍应保留“击打”的较宽含义。其余主要内容，包括大卫的自责、羊群比喻及求罚临到自己和父家的表达，均忠实反映原文。
  naturalness: 整体庄重、通顺，符合现代标准普通话经文语体。“我作了恶”可理解，但“我做了错事”在现代汉语中更自然，也能保留与“犯了罪”并列而不完全重复的认罪表达。
  terminology: “耶和华”与既定专名选择一致；“这些羊”和“我的父家”恰当地保留原文的牧者隐喻及亲族范围。“愿你的手攻击我”较准确传达“愿你的手临到/针对我”的祈求，避免“伸手”所增添的动作细节。
