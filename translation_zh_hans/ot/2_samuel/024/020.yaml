  text: וַ/יַּשְׁקֵ֣ף אֲרַ֗וְנָה וַ/יַּ֤רְא אֶת הַ/מֶּ֨לֶךְ֙ וְ/אֶת עֲבָדָ֔י/ו עֹבְרִ֖ים עָלָ֑י/ו וַ/יֵּצֵ֣א אֲרַ֔וְנָה וַ/יִּשְׁתַּ֧חוּ לַ/מֶּ֛לֶךְ אַפָּ֖י/ו אָֽרְצָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/020.yaml
  text: Araunah looked out and saw the king and his servants passing by him[a]. So Araunah went out and bowed down to the king with his face to the ground.
translation:
  language: zh_hans
  text: 亚劳拿向外望去，看见王和王的臣仆正朝他走来[a]。亚劳拿就出去，俯伏在王面前，脸伏于地。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“正从他旁边经过”或“正走近他”；希伯来文原句描述王和臣仆相对于亚劳拿而移动。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁקֵף
  choice: 向外望去
  rationale: 该动词常指从某处或较高位置向外观看；“向外望去”比单说“看”更能保留这一空间意味，也符合现代汉语叙事。
- source_word: וַיַּרְא
  choice: 看见
  rationale: 直接表达 ראה，并保留“望去—看见”的希伯来叙事进程。
- source_word: עֲבָדָיו
  choice: 王的臣仆
  rationale: 原文代词指王；在王室语境中 עבד 可包括侍从或臣属。“臣仆”既保留服事关系，也不把他们限定为低阶仆役。
- source_word: עֹבְרִים עָלָיו
  choice: 正朝他走来
  rationale: 该结构字面描述王及臣仆相对于亚劳拿的移动，具体方向具有一定歧义。按上下文，他们正来到亚劳拿所在之处；正文采用自然且合乎场景的“朝他走来”，并以脚注保留“从他旁边经过”等可能。
- source_word: וַיֵּצֵא
  choice: 出去
  rationale: יצא 的常规译法；与亚劳拿先向外望、继而出去迎接王的动作顺序吻合。
- source_word: וַיִּשְׁתַּחוּ
  choice: 俯伏
  rationale: 此动词表示屈身下拜或伏地致敬；结合“脸伏于地”，“俯伏”准确呈现动作，同时不误导为对人的神圣敬拜。
- source_word: אַפָּיו אָרְצָה
  choice: 脸伏于地
  rationale: 这是表示完全俯伏的身体姿态；该译法凝练自然，并清楚传达面朝地的动作。
- source_word: אֲרַוְנָה
  choice: 亚劳拿
  rationale: 按《撒母耳记》此处希伯来名字的传统中文音译处理；不采用《历代志》平行记载中的另一名字形式。
theological_decisions:
- issue: 亚劳拿在王面前动作的性质
  choice: 译为“俯伏在王面前”，表达臣民向人间君王的礼敬
  alternative: 译为“敬拜王”
  rationale: השתחוה 可用于敬拜，也可用于向人下拜致敬。此处受礼者是大卫王，语境是王与臣民相见，因此采用描述身体动作的译法，不加入神圣敬拜的含义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“向外望去”保留观察位置的意味；“臣仆”适合王室语境；“俯伏……脸伏于地”避免重复累赘，同时呈现完整的伏地礼。正文以“朝他走来”配合上下文，脚注保留介词结构本有的方向歧义。
