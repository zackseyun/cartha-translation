  text: וַ/יָּ֥קָם דָּוִ֖ד בַּ/בֹּ֑קֶר וּ/דְבַר יְהוָ֗ה הָיָה֙ אֶל גָּ֣ד הַ/נָּבִ֔יא חֹזֵ֥ה דָוִ֖ד לֵ/אמֹֽרפ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/011.yaml
  text: When David arose in the morning[a], the word of Yahweh had come to Gad the prophet, David’s seer, saying,
translation:
  language: zh_hans
  text: 大卫早晨起来时，雅威的话临到[a]迦得先知，就是大卫的先见，说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较直译：“雅威的话是在迦得那里／向迦得而来。”原文此处是先知叙事中的常用表达，通常译作“雅威的话临到迦得”；在上下文中也可理解为这话在大卫早晨起来以前已经临到迦得。
    reason: 原文 הָיָה אֶל 的字面表达与其在先知语境中的惯用含义，以及可能的相对时序。
lexical_decisions:
- source_word: וַיָּקָם
  choice: 起来
  rationale: 该叙事动词表示大卫起身，是随后事件的背景；“起来”自然、庄重，也符合现代汉语叙事习惯。
- source_word: בַּבֹּקֶר
  choice: 早晨
  rationale: 准确表达时间状语；与“起来时”连用，形成自然的现代汉语句式。
- source_word: וּדְבַר יְהוָה
  choice: 雅威的话
  rationale: 保留先知叙事中“话”的启示性含义，并将四字神名 יְהוָה 音译为“雅威”。
- source_word: הָיָה אֶל
  choice: 已经临到
  rationale: 这是先知文本中表示神的话传给某人的惯用结构；在此可理解为相对于大卫早晨起来而言已经发生，因此用“已经临到”，同时以脚注保留较直译的表达。
- source_word: גָּד
  choice: 迦得
  rationale: 采用现代中文圣经传统中通行的人名音译。
- source_word: הַנָּבִיא
  choice: 先知
  rationale: 准确表达 נָבִיא 所指的先知身份。
- source_word: חֹזֵה דָוִד
  choice: 大卫的先见
  rationale: 保留 חֹזֶה 与“先知”之间相关但不同的职分称谓；“大卫的先见”也忠实反映原文的属格关系。
- source_word: לֵאמֹר
  choice: 说：
  rationale: 作为引出下一节直接引语的固定叙事用语，“说：”比“说道”更简洁自然。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较贴近学界通常采用的读音，也明确保留其作为神圣专名的性质。
- issue: הָיָה אֶל 的时间关系
  choice: 已经临到
  alternative: 临到／是在……那里
  rationale: 希伯来语可按先知公式理解为神的话“临到”迦得；结合前句时间背景，完成体可表达先于大卫起床的情形，但原文并未用专门的过去完成时形式，因此脚注保留较贴近字面的可能表达。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“先知”与“先见”并列保留原文两个不同称谓；用“就是”清楚表明二者都指迦得。脚注标记紧随其所解释的“临到先知迦得”，避免误附于“早晨”。
