base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/022.yaml
  text: Then Araunah said to David[a], “Let my lord the king take and offer up what is good in his eyes. Look, the oxen are for the burnt offering[b], and the threshing sledges and the implements of the oxen are for the wood.”
translation:
  language: zh_hans
  text: 亚劳拿对大卫说：“愿我主我王取用，并献上他看为好的。看，这些牛可作燔祭，打谷橇和牛具可作柴火。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִקַּח וְיַעַל
  choice: 尽管拿去……献上
  rationale: 未完成式在直接引语中表达恭敬的许可与邀请；“尽管”自然传达亚劳拿愿意让王取用并献祭的语气。“献上”也保留了动词עלה与后文עֹלָה在献祭语境中的呼应。
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: 我主我王
  rationale: 保留对君王的双重尊称，符合古代宫廷语境，在现代中文中仍庄重易懂。
- source_word: הַטּוֹב בְּעֵינָיו
  choice: 照自己看为好的
  rationale: 较直接地保留希伯来语“在他眼中为好”的习语，同时用自然中文表达；第三人称代词所指仍是受话者君王。
- source_word: רְאֵה
  choice: 看
  rationale: 作为话语标记，引导大卫注意亚劳拿愿意提供的物品，简明而不古奥。
- source_word: הַבָּקָר
  choice: 这些牛
  rationale: 上下文显示是用于拉动打谷器具、又适合作祭牲的牛；“这些”体现定冠词及眼前所指。
- source_word: לָעֹלָה
  choice: 可作燔祭
  rationale: עֹלָה是整牲焚烧献上的祭，传统且准确的中文术语为“燔祭”；“可作”表达其指定用途。
- source_word: הַמֹּרִגִּים
  choice: 打谷橇
  rationale: 该词指带齿的打谷木橇或打谷板；“打谷橇”具体、简洁，也能说明为何可拆作燃料。
- source_word: כְלֵי הַבָּקָר
  choice: 牛具
  rationale: כְּלִי含义宽泛，可指牛所用的器具或装备；“牛具”避免过度限定为“轭”，并与可作柴烧的木制用具相符。
- source_word: לָעֵצִים
  choice: 可当柴烧
  rationale: 明确表达这些器具将作为献祭所需燃料；比直译“作木头”更符合现代汉语。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而口语可懂的叙事体。保留亚劳拿对君王恭敬慷慨的语气；对כְלֵי הַבָּקָר不作“牛轭”等过窄解释，因此正文用概括性的“牛具”。
