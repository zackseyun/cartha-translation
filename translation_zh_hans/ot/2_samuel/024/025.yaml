id: 2SA.24.25
reference: 2 Samuel 24:25
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יִּבֶן֩ שָׁ֨ם דָּוִ֤ד מִזְבֵּ֨חַ֙ לַֽ/יהוָ֔ה וַ/יַּ֥עַל עֹל֖וֹת וּ/שְׁלָמִ֑ים וַ/יֵּעָתֵ֤ר יְהוָה֙ לָ/אָ֔רֶץ וַ/תֵּעָצַ֥ר הַ/מַּגֵּפָ֖ה מֵ/עַ֥ל יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/025.yaml
  text: There David built an altar to Yahweh and offered up burnt offerings and peace offerings[a]. So Yahweh responded to the land[c][b], and the plague was restrained from Israel.
translation:
  language: zh_hans
  text: 大卫在那里为耶和华筑了一座坛，献上燔祭和平安祭[a]。耶和华就应允了为那地的祈求[b]，以色列中的瘟疫便止住了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “平安祭”也可译作“团契祭”或“和睦祭”。
    reason: 保留 שְׁלָמִים 这一祭类名称的主要解释性译法。
  - marker: b
    text: 原文直译近于“耶和华为那地受了恳求”；也可表达为“耶和华应允了为那地所作的祷告”。原文没有明说祈求者，也没有使用“祈求”这一名词。
    reason: 说明 עתר 尼法勒形所含的受恳求、施恩回应之意，以及 לָאָרֶץ 的句法含义；同时说明正文为自然汉语所作的隐含补足。
lexical_decisions:
- source_word: וַיִּבֶן שָׁם דָּוִד מִזְבֵּחַ
  choice: 大卫在那里……筑了一座坛
  rationale: 按希伯来叙事句法自然转为现代汉语；“坛”是 מִזְבֵּחַ 的通行而准确译法。
- source_word: לַיהוָה
  choice: 为耶和华
  rationale: 介词 ל 表明祭坛归属、奉献的对象；“耶和华”直接呈现专名 YHWH，并符合现代中文圣经语域。
- source_word: וַיַּעַל עֹלוֹת
  choice: 献上燔祭
  rationale: עלה 与祭物连用表示献祭；“献上”保留其祭祀动作，“燔祭”是 עֹלָה 的标准术语。
- source_word: וּשְׁלָמִים
  choice: 平安祭
  rationale: 这是 שְׁלָמִים 的传统且广为理解的中文祭祀术语，同时以脚注保留“团契祭”等解释性译法。
- source_word: וַיֵּעָתֵר יְהוָה לָאָרֶץ
  choice: 耶和华就垂听了为那地所献的祈求
  rationale: עתר 的尼法勒形表达对恳求作出有利回应；“为那地”对应 לָאָרֶץ。中文若只说“回应那地”不自然，也会削弱动词本身所含的祈求语义，因此明确译出隐含的“祈求”，但用脚注说明原文未明说该名词。
- source_word: וַתֵּעָצַר הַמַּגֵּפָה מֵעַל יִשְׂרָאֵל
  choice: 以色列的瘟疫便止住了
  rationale: עצר 的被动意义为“被制止、止住”；将字面的“从以色列之上”自然表达为“以色列的瘟疫”，保持结果状态而不添加施事者。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。现代中文圣经传统中“耶和华”辨识度最高；“雅威”更接近常见学术拟音，但原始发音并非完全确定。
- issue: וַיֵּעָתֵר יְהוָה לָאָרֶץ 中神回应的性质
  choice: 垂听了为那地所献的祈求
  alternative: 应允了那地／对那地施恩回应
  rationale: 该动词形态内含受恳求而作出有利回应之意，但经文本句没有明说祈求者或重复“祈求”一词。正文用自然中文传达词义，脚注保留其隐含性，避免把神学因果解释得超过原文。
- issue: 瘟疫停止的被动表达
  choice: 瘟疫便止住了
  alternative: 耶和华就止住了瘟疫
  rationale: 原文使用被动式“瘟疫被止住”，上下文虽暗示神为施事者，本句却未明说；保留被动可避免补入原文未直接表达的主语。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“筑坛、燔祭、平安祭”保留成熟的圣经祭祀术语；其余叙述避免古奥句式。所有脚注标记均已置于正文相应位置。
