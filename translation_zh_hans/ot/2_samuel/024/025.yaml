  to: 大卫在那里为耶和华筑了一座坛，献上燔祭和平安祭[a]。耶和华就应允了为那地的祈求[b]，以色列中的瘟疫便止住了。
  rationale: 修订仅调整两处：以“应允了为那地的祈求”更自然、充分地表达 עתר 尼法勒形的语义，同时由脚注明确原文未出现祈求者或“祈求”名词；以“以色列中的瘟疫”更贴近瘟疫从以色列之上止息的空间性表达。未改变事件、施事暗示或神学含义。
