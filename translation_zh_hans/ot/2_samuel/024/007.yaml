base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/007.yaml
  text: They came to the fortified city of Tyre and to all the cities of the Hivites and the Canaanites[a], and they went out to the Negev of Judah, to Beersheba.
translation:
  language: zh_hans
  text: 他们来到推罗的坚城，又来到希未人和迦南人的所有城邑；然后往犹大的南地[a]去，到了别是巴。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “南地”也可译作“犹大南部”。希伯来语“南地”（negev）既可指称特定的尼革夫地区，也可泛指南方地带。
    reason: 保留נֶגֶב作为专名地区或普通方位区域的词义歧义。
lexical_decisions:
- source_word: מִבְצַר צֹר
  choice: 推罗的坚城
  rationale: מִבְצָר指设防之地或要塞；与“推罗”连用时，可自然理解为设防的推罗城。“坚城”既保留军事防御色彩，也不把它限定为城内某一座堡垒。
- source_word: וְכָל עָרֵי הַחִוִּי וְהַכְּנַעֲנִי
  choice: 又来到希未人和迦南人的所有城邑
  rationale: “城邑”在现代中文中庄重而易懂；原文两个单数族名在此作集合用法，译作“希未人和迦南人”。依据前面的运动动词补出“来到”，使行程关系清楚。
- source_word: וַיֵּצְאוּ
  choice: 然后……去
  rationale: יצא本义为“出去、离开”，在这段行程叙述中标志下一程。中文用“然后……去”自然表达路线推进，不额外指定他们从哪一处出来。
- source_word: אֶל נֶגֶב יְהוּדָה
  choice: 往犹大的南地去
  rationale: נֶגֶב既可指名为“南地”的特定地区，也可泛指南方；正文采用传统而自然的地理表达“犹大的南地”，并以脚注保留其词义范围。
- source_word: בְּאֵר שָׁבַע
  choice: 别是巴
  rationale: 采用现代中文圣经读者熟悉的标准地名译法。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重且易懂的叙事语体。“坚城”“城邑”保留古代军事与地理语境；分号划分北方沿海行程与转向犹大南部的下一阶段。
