base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/012.yaml
  text: 'Go and speak to David[a], ‘Thus says Yahweh: I am setting three things before you. Choose one of them for yourself, and I will do it to you.’'
translation:
  language: zh_hans
  text: 你去对大卫说：“雅威如此说：‘我有三样[a]要加在你身上。你自己选择其中一样，我就使它临到你身上。’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文只有“三”，没有明说所数的是什么；也可理解为“三件事”或“三个选项”。
    reason: 原文省略名词，译文为符合汉语表达补出量词，同时说明其他可能理解。
lexical_decisions:
- source_word: הָלוֹךְ וְדִבַּרְתָּ
  choice: 你去对……说
  rationale: 以自然的汉语命令句表达原文不定式绝对形与限定动词连用所加强的吩咐语气。
- source_word: כֹּה אָמַר יְהוָה
  choice: 雅威如此说
  rationale: 保留先知传信公式的庄重语气，并将四字神名作为专名音译。
- source_word: שָׁלֹשׁ
  choice: 三样
  rationale: 原文只有数词“三”，名词须由上下文补出；汉语通常需要量词，“三样”比“三个选择”少一层解释。
- source_word: אָנֹכִי נוֹטֵל עָלֶיךָ
  choice: 我有三样要加在你身上
  rationale: נוֹטֵל עַל 表达把某事加在某人身上的意思；此处涉及将要临到的灾罚，这一译法既保留原文的重量感，也与后面的选择相衔接。
- source_word: בְּחַר לְךָ אַחַת מֵהֶם
  choice: 你自己选择其中一样
  rationale: “自己”体现 לְךָ 所强调的亲自选择及责任，“其中一样”自然表达部分关系。
- source_word: וְאֶעֱשֶׂה לָּךְ
  choice: 我就把它施行在你身上
  rationale: 在审判语境中，לָךְ 表示行动落到大卫身上；用“施行在你身上”避免误译成有利于他的“为你做”。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文使用以色列上帝的专名；“雅威”按较通行的学术重构音译，避免以“主”这一称号替代专名。“耶和华”虽为汉语传统译名，但源自较晚的混合读法。
- issue: 三项内容是选择还是惩罚
  choice: 译作“要加在你身上”，不直接称为“三个选择”
  alternative: 摆在你面前的三个选择
  rationale: 上下文显示大卫必须从三项灾罚中选择，但本节原文本身既省略“三”所修饰的名词，又使用 נטל על（加在……身上）。译文保留审判的分量，不把隐含内容明确化为中性的“选项”。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“如此说”保留传信公式的经文语体；引号层级区分叙述者、雅威的话语。
