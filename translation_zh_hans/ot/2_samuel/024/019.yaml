base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/019.yaml
  text: So David went up according to the word of Gad, just as Yahweh had commanded.
translation:
  language: zh_hans
  text: 于是，大卫照着迦得的话上去了，正如雅威所吩咐的。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַל
  choice: 上去了
  rationale: עלה表示“上去、登上”；此处保留方向含义，用“上去了”比单说“去了”更贴近原文，也比“登上”更自然。
- source_word: דָּוִד
  choice: 大卫
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: כִּדְבַר
  choice: 照着……的话
  rationale: כ + דבר表示“按照……的话”；译出“话”既保留希伯来文表达，也显明大卫是依从迦得所传达的指示。
- source_word: גָּד
  choice: 迦得
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: כַּאֲשֶׁר
  choice: 正如
  rationale: 表达迦得的话与雅威的吩咐相一致，同时保持原文的比较关系。
- source_word: צִוָּה
  choice: 所吩咐的
  rationale: צוה意为“命令、吩咐”；中文关系结构自然表明雅威的吩咐先于大卫的行动，无须另加时态标记。
- source_word: יְהוָה
  choice: 雅威
  rationale: 将四字神名按其常见拟音译为“雅威”，保留其作为专名的性质，而不以称号替代。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。译作“雅威”旨在以现代汉语常见拟音保留神的专名；“耶和华”是传统形式，“上主”则是称号性替代。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“于是”承接叙事，“照着……的话”保留原文措辞，“上去了”保留空间方向。
