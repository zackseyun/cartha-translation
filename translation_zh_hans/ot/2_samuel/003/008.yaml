  text: וַ/יִּחַר֩ לְ/אַבְנֵ֨ר מְאֹ֜ד עַל דִּבְרֵ֣י אִֽישׁ בֹּ֗שֶׁת וַ/יֹּ֨אמֶר֙ הֲ/רֹ֨אשׁ כֶּ֥לֶב אָנֹ֘כִי֮ אֲשֶׁ֣ר לִֽ/יהוּדָה֒ הַ/יּ֨וֹם אֶֽעֱשֶׂה חֶ֜סֶד עִם בֵּ֣ית שָׁא֣וּל אָבִ֗י/ךָ אֶל אֶחָי/ו֙ וְ/אֶל מֵ֣רֵעֵ֔/הוּ וְ/לֹ֥א הִמְצִיתִ֖/ךָ בְּ/יַד דָּוִ֑ד וַ/תִּפְקֹ֥ד עָלַ֛/י עֲוֺ֥ן הָ/אִשָּׁ֖ה הַ/יּֽוֹם־־־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/008.yaml
  text: Then Abner became very angry because of Ish-bosheth’s words[a], and he said, “Am I a dog’s head that belongs to Judah? To this day I have shown covenant loyalty to the house of Saul your father, to his brothers, and to his friends, and have not delivered you into David’s hand; yet today you charge me with guilt concerning this woman.”
translation:
  language: zh_hans
  text: 押尼珥因伊施波设的话大为恼怒，说：“难道我是属犹大的狗头吗？[a]直到今日，我一直忠诚地对待你父亲扫罗的家、他的弟兄和朋友，没有把你交在大卫手中；你今日竟为这女人的罪责追究我！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “属犹大的狗头”原文含义不易确定，是一种侮辱性的说法，可能意为“投向犹大一方的卑贱之人”。正文保留原文的比喻和歧义。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר לְאַבְנֵר מְאֹד
  choice: 押尼珥……大为恼怒
  rationale: חרה ל 是怒气燃起的惯用表达；“大为恼怒”以自然的现代汉语保留 מְאֹד 所强调的强烈程度。
- source_word: עַל דִּבְרֵי אִישׁ בֹּשֶׁת
  choice: 因伊施波设的话
  rationale: דִּבְרֵי 直译为“话”；此处 עַל 表明押尼珥发怒的缘由。
- source_word: הֲרֹאשׁ כֶּלֶב אָנֹכִי אֲשֶׁר לִיהוּדָה
  choice: 难道我是属犹大的狗头吗
  rationale: 保留“狗头”这一含义困难的侮辱性比喻，并将 אֲשֶׁר לִיהוּדָה 译作“属犹大的”，不在正文中武断地限定为“投靠犹大的人”等解释。
- source_word: הַיּוֹם אֶעֱשֶׂה חֶסֶד
  choice: 直到今日，我一直忠诚地对待
  rationale: 结合后一句再次出现的“今日”，这里是押尼珥回顾自己截至当日的效忠行为。“忠诚地对待”体现 חֶסֶד 在王朝和政治关系语境中的忠贞与恩待，同时避免生硬术语。
- source_word: עִם בֵּית שָׁאוּל אָבִיךָ
  choice: 你父亲扫罗的家
  rationale: “家”保留 בֵּית 所指的家族及王朝含义。
- source_word: אֶל אֶחָיו וְאֶל מֵרֵעֵהוּ
  choice: 他的弟兄和朋友
  rationale: 按原文保留“弟兄”；מֵרֵעֵהוּ 在此自然译为“朋友”，也可涵盖亲近的同伴。
- source_word: וְלֹא הִמְצִיתִךָ בְּיַד דָּוִד
  choice: 没有把你交在大卫手中
  rationale: 保留“交在……手中”这一权势和控制的惯用意象，表达没有把伊施波设交给大卫处置。
- source_word: וַתִּפְקֹד עָלַי עֲוֺן הָאִשָּׁה
  choice: 你今日竟为这女人的罪责追究我
  rationale: פקד על 与 עָוֺן 连用可指因罪责而查问、追究或问罪；“追究我”保留法律和道德上的责问意味。“这女人”照原文表达，不擅自补入利斯巴的名字。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“竟”传达押尼珥对伊施波设如今反过来追究他的愤怒与反诘语气；正文避免把含义困难的“狗头”直接释义化。
