  terminology: 人名“押尼珥、伊施波设、扫罗、大卫”一致且通行。“忠诚地对待”在此政治—家族关系中能够表达חסד所含的忠诚与善待，未不当引入特定教义或解释。“这女人”未补入上下文姓名，忠于原文的指称方式。
