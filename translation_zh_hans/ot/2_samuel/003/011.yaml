  text: And he could no longer answer Abner a word[a], because he feared him.
translation:
  language: zh_hans
  text: 他因惧怕押尼珥，就再也不能回答他一句话[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“再也不能回答他什么。”原文直译为“回答押尼珥一句话”。
    reason: 说明“回答……一句话”这一希伯来语表达，并提供自然的汉语替代译法。
lexical_decisions:
- source_word: יָכֹל
  choice: 敢
  rationale: 该动词本义表示“能够”；但本句随即说明原因是惧怕押尼珥，汉语用“不敢”能自然表达因恐惧而不能作答的实际语气。
- source_word: עוֹד
  choice: 再也不
  rationale: 与否定语连用，表示某行为不再继续；“再也不”符合现代汉语叙事表达。
- source_word: לְהָשִׁיב
  choice: 回
  rationale: 使役形在此按惯用义表示回答、回应；“回……一句话”简洁自然。
- source_word: אֶת־אַבְנֵר
  choice: 押尼珥
  rationale: 直接宾语标记后接专名 Abner，采用现代中文圣经中通行的译名“押尼珥”。
- source_word: דָּבָר
  choice: 一句话
  rationale: 字面为“话、言语、事情”；在“回答某人一句话”这一结构中译为“一句话”，既保留原文简练的措辞，也符合中文习惯。
- source_word: מִיִּרְאָתוֹ אֹתוֹ
  choice: 因惧怕押尼珥
  rationale: מִן 表示原因，名词“惧怕”带宾语代词，意为“因为惧怕他”；为避免中文代词所指不明，明说“押尼珥”。
