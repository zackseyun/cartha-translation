base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/002.yaml
  text: Sons were born to David in Hebron[a], and his firstborn was Amnon, by Ahinoam the Jezreelitess.
translation:
  language: zh_hans
  text: 大卫在希伯仑得了几个儿子。他的长子是暗嫩，是耶斯列人[a]亚希暖所生的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“耶斯列女子”，或“来自耶斯列的女子”。
    reason: 词义替代：希伯来文使用阴性居民称谓，既指出她属于耶斯列，也明确她是女性。
lexical_decisions:
- source_word: ו/ילדו
  choice: 得了
  rationale: 希伯来文以被动或非明确主语的方式叙述儿子为大卫而生；汉语用“大卫……得了几个儿子”自然表达这一关系，同时避免误把母亲补作经文未明说的主语。
- source_word: לְ/דָוִד
  choice: 大卫……得了
  rationale: 介词 לְ 表明这些儿子归属于大卫；汉语以“得了”自然传达“为大卫而生”的谱系关系。
- source_word: בָּנִים
  choice: 几个儿子
  rationale: בָּנִים 明确指男性子女；“儿子”保留其性别信息，量词“几个”使复数在现代汉语中表达自然。
- source_word: בְּ/חֶבְרוֹן
  choice: 在希伯仑
  rationale: 介词 בְּ 在此表示地点，直译为“在希伯仑”。
- source_word: וַ/יְהִי
  choice: 是
  rationale: 此处引出长子的身份，现代汉语用系词“是”清楚自然，无须机械译出叙事连接词。
- source_word: בְכוֹר/וֹ
  choice: 他的长子
  rationale: בְכוֹר 指按出生次序首先出生的儿子；“长子”既自然，又保留其家庭与法律层面的潜在含义。
- source_word: אַמְנוֹן
  choice: 暗嫩
  rationale: 按现代中文圣经人名的通行音译处理。
- source_word: לַ/אֲחִינֹעַם
  choice: 亚希暖所生的
  rationale: 在这份出生名单中，介词 לַ 标明母子关系；“所生的”明确而自然地表达亚希暖是暗嫩的母亲。
- source_word: הַ/יִּזְרְעֵאלִת
  choice: 耶斯列人
  rationale: 该阴性居民称谓表明亚希暖来自耶斯列。汉语“耶斯列人”自然简洁，但不显式标出希伯来文的阴性形式，因此脚注补充更直显的译法。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“得了几个儿子”避免生硬照搬希伯来文的被动结构；第二句保留“长子”及母亲籍贯等谱系信息。脚注标记紧随其实际说明的“耶斯列人”，而非放在地点“希伯仑”之后。
