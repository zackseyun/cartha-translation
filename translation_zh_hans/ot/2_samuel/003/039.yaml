  text: וְ/אָנֹכִ֨י הַ/יּ֥וֹם רַךְ֙ וּ/מָשׁ֣וּחַ מֶ֔לֶךְ וְ/הָ/אֲנָשִׁ֥ים הָ/אֵ֛לֶּה בְּנֵ֥י צְרוּיָ֖ה קָשִׁ֣ים מִמֶּ֑/נִּי יְשַׁלֵּ֧ם יְהוָ֛ה לְ/עֹשֵׂ֥ה הָ/רָעָ֖ה כְּ/רָעָתֽ/וֹ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/039.yaml
  text: And I am still weak today[a], though anointed king; and these men, the sons of Zeruiah, are too harsh for me[b]. May Yahweh repay the evildoer according to his evil.
translation:
  language: zh_hans
  text: 我今天仍然软弱，虽受膏为王；洗鲁雅的这些儿子比我强硬得多。愿耶和华按作恶之人所行的恶报应他[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “愿耶和华……报应他”也可译作“耶和华必按作恶之人所行的恶报应他”。希伯来文动词既可表达愿望，也可理解为简单将来。
    reason: alternative_reading
lexical_decisions:
- source_word: רַךְ
  choice: 软弱
  rationale: 该词本义可指“柔嫩、柔弱”，但此处大卫所说的是自己虽已受膏作王，政治力量仍不足，无法制伏洗鲁雅的儿子；“软弱”既自然，也保留原词的语义关联。
- source_word: וּמָשׁוּחַ מֶלֶךְ
  choice: 虽然受膏作王
  rationale: 希伯来文以并列结构把大卫的软弱与受膏为王的身份相对照；汉语用“虽然……却……”自然表达其中隐含的让步关系。
- source_word: בְּנֵי צְרוּיָה
  choice: 洗鲁雅的这些儿子
  rationale: 保留原文以母名称呼约押及其兄弟的家族称谓，并用“这些”对应 הָאֵלֶּה。
- source_word: קָשִׁים מִמֶּנִּי
  choice: 比我强硬，叫我难以制伏
  rationale: קָשִׁים 可指刚硬、严厉或强横；מִמֶּנִּי 在此表示这些人强硬到大卫难以应付。“比我强硬”保留比较结构，补出“叫我难以制伏”则使上下文含义在现代汉语中清楚。
- source_word: יְשַׁלֵּם
  choice: 愿……报应
  rationale: 未完成式在语境中可表达愿望或祈求，也可理解为简单将来；正文采用祈愿式，另一读法列入脚注。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代简体中文读者熟悉的专名“耶和华”翻译四字神名，而不以称号“主”替代。
- source_word: לְעֹשֵׂה הָרָעָה
  choice: 作恶之人
  rationale: 准确表达分词结构所指的行动者，语言简洁庄重。
- source_word: כְּרָעָתוֹ
  choice: 照……的恶
  rationale: 贴近原文，表达报应与行为之恶相称，不额外限定为单一恶行或一般邪恶品格。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。正文采用华语圣经传统中最通行、普通读者最易识别的专名“耶和华”，同时避免用“主”这一称号取代神名。
- issue: 大卫末句的语气
  choice: 祈愿式：“愿耶和华……报应他”
  alternative: 陈述将来：“耶和华必……报应他”
  rationale: יְשַׁלֵּם 在此既可作祈愿，也可作简单将来。结合大卫把审判交托给神的语境，正文采用祈愿式，并用脚注保留预测式理解。
- issue: 大卫对洗鲁雅众子的评价
  choice: 兼顾他们的强硬与大卫无力制伏他们
  alternative: 只译为“他们比我强”或“他们对我太严厉”
  rationale: 原文 קָשִׁים 同时容许性情强硬和难以应付的意味；译文不把它单纯化为体力、军力或道德残酷，以保留语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。“虽然……却……”呈现原文并列句隐含的对比；“叫我难以制伏”说明比较短语在语境中的实际含义。所有脚注标记均已置于正文。
