base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/007.yaml
  text: Saul had a concubine whose name was Rizpah daughter of Aiah. And Ish-bosheth said to Abner[a], “Why did you go in to my father’s concubine?”
translation:
  language: zh_hans
  text: 扫罗有一个妾，名叫利斯巴，是爱亚的女儿。伊施波设对押尼珥说：“你为什么与我父亲的妾亲近[a]？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你为什么与我父亲的妾同房？”希伯来文直译为“你为什么进到我父亲的妾那里”，这是表示发生性关系的常见委婉说法。
    reason: 说明原文“进到……那里”的性关系委婉语，并提供较明确的译法。
lexical_decisions:
- source_word: וּלְשָׁאוּל
  choice: 扫罗有
  rationale: 介词 לְ 在此构成领有表达；用现代汉语“扫罗有”自然传达其含义。句首 וּ 连接上下文，但不必机械译作“而且”或“现在”。
- source_word: פִּלֶגֶשׁ / פִּילֶגֶשׁ
  choice: 妃嫔
  rationale: 该词指地位有别于正妻的妾室；在君王扫罗的语境中，“妃嫔”既保留其社会身份，也符合庄重的叙事语体。
- source_word: וּשְׁמָהּ רִצְפָּה בַת אַיָּה
  choice: 名叫利斯巴，是爱雅的女儿
  rationale: 按希伯来语依次交代姓名与父系身份，并用自然的现代汉语拆分表达。人名依原文音译。
- source_word: וַיֹּאמֶר אֶל אַבְנֵר
  choice: 伊施波设对押尼珥说
  rationale: 原文动词的主语未明说，但上文明确是伊施波设；在汉语中补出姓名可避免歧义，不增加新的叙事信息。
- source_word: מַדּוּעַ בָּאתָה אֶל
  choice: 你为什么亲近
  rationale: בוא אֶל 字面为“进到……那里”，在此是指发生性关系的委婉说法。“亲近”保留委婉色彩和指控语气，脚注说明其字面表达与具体含义。
- source_word: פִּילֶגֶשׁ אָבִי
  choice: 我父亲的妃嫔
  rationale: 直接保留原文的领属关系以及“妃嫔”这一社会身份称谓。
