  yaml_path: translation/ot/2_samuel/003/006.yaml
  text: While the war continued between the house of Saul and the house of David[a], Abner was strengthening himself in the house of Saul.
translation:
  language: zh_hans
  text: 扫罗家与大卫家之间的战争持续期间，押尼珥在扫罗家中不断巩固自己的势力[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“押尼珥在扫罗家中日渐强盛。”原文动词既可表示变得强盛，也可表示使自己强大；此处可能指押尼珥正在巩固自己在扫罗家中的地位。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בִּהְיוֹת הַמִּלְחָמָה
  choice: 交战期间
  rationale: בִּהְיוֹת构成持续性的时间从句；结合上下文，用“交战期间”自然表达战争持续进行的背景。וַיְהִי主要承担叙事衔接功能，中文无需另加“事情发生了”。
- source_word: בֵּין בֵּית שָׁאוּל וּבֵין בֵּית דָּוִד
  choice: 扫罗家和大卫家
  rationale: 保留“家”的表达，使其仍可兼指家族、王室及其政治阵营，避免用“王朝”过度限定。
- source_word: וְאַבְנֵר
  choice: 押尼珥
  rationale: 采用现代中文圣经读者熟悉的人名译法。
- source_word: הָיָה מִתְחַזֵּק
  choice: 不断巩固自己的势力
  rationale: חזק的Hitpael形式可表示变得强盛或使自己强大；这里结合בְּבֵית שָׁאוּל所指的活动范围，译文表达押尼珥在扫罗家内部强化自身地位，同时用脚注保留较中性的可能译法。
- source_word: בְּבֵית שָׁאוּל
  choice: 在扫罗家中
  rationale: בְּ表示押尼珥增强实力的范围或权力基础；“家中”保留家庭与政治集团两层含义。
theological_decisions:
- issue: 押尼珥是主动扩张个人权势，还是仅仅日益强盛
  choice: 正文译作“不断巩固自己的势力”，突出动词反身形式可能具有的自我强化含义
  alternative: “在扫罗家中日渐强盛”
  rationale: 原文形式容许两种理解。上下文支持押尼珥巩固地位的解读，但并未完全排除单纯“变得强盛”的意义，因此以脚注保存另一译法，不把动机说得更具体。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“扫罗家／大卫家”保留希伯来文兼具家族与政治阵营的表达；“巩固自己的势力”比直译“使自己强大”更自然，并由脚注保留原文的词义张力。
