  yaml_path: translation/ot/2_samuel/003/038.yaml
  text: Then the king said to his servants[a], “Do you not know that a prince and a great man has fallen today in Israel?”
translation:
  language: zh_hans
  text: 王对臣仆说：“你们岂不知道，今天有一位领袖[a]和伟大人物在以色列倒下了吗？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “领袖”也可译作“统帅”或“官长”。希伯来语 שַׂר 可指首领、统帅、掌权者或高级官员。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 叙事中的连续式推进事件；现代汉语借上下文即可自然表达先后，无须机械加“然后”。
- source_word: הַמֶּלֶךְ
  choice: 王
  rationale: 忠实表达定指名词；上下文已明确是大卫，不必补出名字。
- source_word: עֲבָדָיו
  choice: 臣仆
  rationale: עֶבֶד在王室语境中可指王的仆从或臣属；“臣仆”既保留服事关系，也符合宫廷语境。
- source_word: הֲלוֹא תֵדְעוּ
  choice: 你们岂不知道
  rationale: 否定疑问形式构成期待肯定回答的反问；“岂不知道”庄重而自然。
- source_word: כִּי
  choice: （引出所知内容）
  rationale: 此处引出“知道”的内容，汉语可直接接宾语从句，不必另译“即”。
- source_word: שַׂר
  choice: 领袖
  rationale: 该词可指首领、统帅、官长或贵族；亚押尼珥兼具军事与政治地位，“领袖”较自然且不过度限定具体职衔。
- source_word: וְגָדוֹל
  choice: 一位伟大的人物
  rationale: 形容词名词化，与שַׂר并列，强调此人的卓越地位和分量；“伟大的人物”保留其尊崇语气。
- source_word: נָפַל
  choice: 倒下了
  rationale: 保留希伯来语以“倒下”委婉指死亡的庄重意象，而不直接改写为“死了”。
- source_word: הַיּוֹם הַזֶּה
  choice: 今天
  rationale: 这是现代汉语对“这一天”最自然、准确的表达。
- source_word: בְּיִשְׂרָאֵל
  choice: 以色列中
  rationale: 表达此人的死亡发生在以色列共同体范围内；“中”比单纯地点性的“在以色列”更贴合语境。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“岂不知道”保留反问力度；“倒下”保留原文对死亡的委婉而肃穆的说法。脚注标记置于整句引语之后，因为注释涉及句中的“领袖”。
