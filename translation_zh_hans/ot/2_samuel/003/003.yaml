  yaml_path: translation/ot/2_samuel/003/003.yaml
  text: his second, Kileab, by Abigail the wife of Nabal the Carmelite; and the third, Absalom the son of Maacah daughter of Talmai king of Geshur.
translation:
  language: zh_hans
  text: 次子基利押，是大卫从迦密人拿八的妻子亚比该所生的；三子押沙龙，是基述王达买的女儿玛迦所生的。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמִשְׁנֵהוּ
  choice: 次子
  rationale: 直译为“他的第二个”，承接上节大卫众子的名单；现代汉语以“次子”自然简洁地表达排行。
- source_word: כִלְאָב
  choice: 基利押
  rationale: 按希伯来语人名音译；与代上3:1的另一名字“但以利”不作静默协调。
- source_word: לַאֲבִיגַל אֵשֶׁת נָבָל הַכַּרְמְלִי
  choice: 是大卫从迦密人拿八的妻子亚比该所生的
  rationale: 介词ל表示母系关系；补出“大卫从……所生的”以符合汉语名单句式。“拿八的妻子”保留原文称谓，未改写成“遗孀”。
- source_word: וְהַשְּׁלִשִׁי
  choice: 三子
  rationale: 表达第三位儿子的排行，并与“次子”形成自然对应。
- source_word: בַּת תַּלְמַי מֶלֶךְ גְּשׁוּר
  choice: 基述王达买的女儿
  rationale: 保留原文的亲属与王室身份关系，按自然汉语调整语序。
