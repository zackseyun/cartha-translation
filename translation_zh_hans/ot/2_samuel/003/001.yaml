  text: וַ/תְּהִ֤י הַ/מִּלְחָמָה֙ אֲרֻכָּ֔ה בֵּ֚ין בֵּ֣ית שָׁא֔וּל וּ/בֵ֖ין בֵּ֣ית דָּוִ֑ד וְ/דָוִד֙ הֹלֵ֣ךְ וְ/חָזֵ֔ק וּ/בֵ֥ית שָׁא֖וּל הֹלְכִ֥ים וְ/דַלִּֽים׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/001.yaml
  text: The war between the house of Saul and the house of David was prolonged[a], and David kept growing stronger[b], while the house of Saul kept growing weaker.
translation:
  language: zh_hans
  text: 扫罗家[a]和大卫家之间的战争持续了很久[b]。大卫日渐强盛，扫罗家却日渐衰弱。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “家”可指家庭、家系，也可指统治王室或王朝；这里兼有家族和政治两方面的含义。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语直译为“战争很长”，指战争持续的时间很久。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּהִי הַמִּלְחָמָה אֲרֻכָּה
  choice: 战争持续了很久
  rationale: אֲרֻכָּה字面意为“长”，在这里说明战争延续的时间；译为“持续了很久”符合现代汉语表达，并保留其持续性。句首וַ承接前文推进叙事，无须另加“现在”或“后来”。
- source_word: בֵּין בֵּית שָׁאוּל וּבֵין בֵּית דָּוִד
  choice: 扫罗家和大卫家之间
  rationale: בֵּית（“家”）既可指家属、家系，也可指政治上的王室或王朝；保留“家”能承载这种家族与政治并存的含义。
- source_word: וְדָוִד הֹלֵךְ וְחָזֵק
  choice: 大卫日渐强盛
  rationale: הלך与后续谓语的组合表达持续发展的过程；“日渐强盛”自然地传达力量和地位不断增长。
- source_word: וּבֵית שָׁאוּל הֹלְכִים וְדַלִּים
  choice: 扫罗家却日渐衰弱
  rationale: 原文与大卫的日益强盛形成鲜明对比；“日渐衰弱”表达持续失去力量和政治地位，而不是经济贫困。加入“却”明确呈现原句的对照关系。
theological_decisions: []
