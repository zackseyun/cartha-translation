base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/033.yaml
  text: And the king lamented over Abner and said[a], “Should Abner die as a fool dies?”
translation:
  language: zh_hans
  text: 王为押尼珥作哀歌，说：“押尼珥竟要像愚妄人那样死吗？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְקֹנֵן
  choice: 作哀歌
  rationale: קונן指为死者唱诵或作哀歌。这里后接哀歌正文，用“作哀歌”既准确又符合现代汉语的庄重叙事语体。
- source_word: אֶל אַבְנֵר
  choice: 为押尼珥
  rationale: 介词אֶל在哀悼语境中标明哀歌所针对的对象；汉语以“为押尼珥作哀歌”表达最自然。
- source_word: הַמֶּלֶךְ
  choice: 王
  rationale: 保留原文的身份称谓及定指意义；上下文已明确所指，无需改写为“大卫”。
- source_word: וַיֹּאמַר
  choice: 说
  rationale: 原文使用普通的言说动词אמר；即使所引内容属于诗歌，也不改译为“唱道”。
- source_word: הַכְּמוֹת ... יָמוּת
  choice: 竟要像……那样死吗
  rationale: 原文是带比较结构的修辞问句，直译近于“像愚妄人的死而死吗”。“竟要……吗”自然传达哀歌中惊痛与抗议的语气，同时保留比较关系。
- source_word: נָבָל
  choice: 愚妄人
  rationale: נָבָל不只表示智力上的愚笨，也常含道德败坏、行为可耻之意。“愚妄人”保留其圣经语汇的道德分量，又不把含义过度限定为“恶棍”。
- source_word: אַבְנֵר
  choice: 押尼珥
  rationale: 采用现代中文圣经传统中通行的人名音译。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“作哀歌”体现正式哀悼文体；“竟要”呈现修辞问句中的震惊和抗议，但不额外解释押尼珥之死的神学意义。原文的诗性倒装改为汉语自然语序。
