base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/031.yaml
  text: Then David said to Joab and to all the people who were with him[a], “Tear your clothes, gird yourselves with sackcloth, and mourn before Abner.” And King David was walking behind the bier.
translation:
  language: zh_hans
  text: 大卫对约押和所有跟随他的人说：“你们要撕裂衣服，腰束麻布，在押尼珥的灵床前哀哭。”大卫王跟在灵床[a]后面走。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “灵床”原文通常指“床”或“卧榻”，这里指安放并抬运押尼珥遗体的床架；也可译作“丧床”或“担架”。
    reason: 说明原词在丧礼语境中的特殊含义，并保留可行的词义选择，避免误解为棺材。
lexical_decisions:
- source_word: קִרְעוּ בִגְדֵיכֶם
  choice: 撕裂衣服
  rationale: 这是复数命令式，所指是在哀悼中撕裂衣服的惯常举动；译文既贴近原文，也符合庄重的现代汉语表达。
- source_word: חִגְרוּ שַׂקִּים
  choice: 腰束麻布
  rationale: חגר本义是在腰间束上或系上，שַׂקִּים指哀悼时所穿的粗麻布；“腰束麻布”保留了具体动作和丧礼背景。
- source_word: וְסִפְדוּ
  choice: 哀哭
  rationale: ספד指为死者举行哀悼、哀号；“哀哭”比泛称“哀悼”更能体现公开举哀的动作，同时仍属自然汉语。
- source_word: לִפְנֵי אַבְנֵר
  choice: 在押尼珥前
  rationale: 原文直译为“在押尼珥面前／前面”，在送葬语境中可能指在其遗体或灵床前方；正文保留这种简洁表达，不擅自补入“遗体”。
- source_word: הֹלֵךְ אַחֲרֵי
  choice: 跟在……后面走
  rationale: 分词הֹלֵךְ表达进行中的行走，אַחֲרֵי在队列中表示位于后方；此译法自然体现持续动作和空间关系。
- source_word: הַמִּטָּה
  choice: 灵床
  rationale: מִטָּה通常指床或卧榻，在这里是承放并抬运死者遗体的床架；“灵床”比“棺材”更准确，也比单说“床”更清楚。
- source_word: וְהַמֶּלֶךְ דָּוִד
  choice: 大卫王则
  rationale: 保留原文对大卫王者身份的突出；“则”自然转入对大卫本人在送葬队列中位置的叙述。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“腰束麻布”略带礼仪色彩，但能准确传达古代哀悼动作；“在押尼珥前”刻意保留原文可能兼指本人遗体及送葬队列方位的含混性。脚注标记置于实际需要说明的“灵床”之后。
