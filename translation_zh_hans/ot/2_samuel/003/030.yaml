base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/030.yaml
  text: So Joab and Abishai his brother killed Abner because he had killed Asahel their brother at Gibeon in the battle[a].
translation:
  language: zh_hans
  text: 于是，约押和他兄弟亚比筛杀了押尼珥，因为押尼珥曾在基遍的那场战斗中杀死他们的兄弟亚撒黑。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“约押和他兄弟亚比筛杀了押尼珥。”希伯来语连接词也可只表示一般的承接关系；正文译作“于是”，是为呈现它与上下文的解释性联系。
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרְגוּ
  choice: 杀了
  rationale: 采用现代汉语中表示夺去性命的基本用语；不译作“谋杀”，以免加入原文在此并未用特定法律术语明说的定性。
- source_word: לְאַבְנֵר
  choice: 押尼珥
  rationale: 介词לְ在此结构中标示动词的宾语，现代汉语自然表达为“杀了押尼珥”，无需逐字译出介词。
- source_word: עַל אֲשֶׁר
  choice: 因为
  rationale: 这一组合引出约押和亚比筛杀押尼珥的缘由，“因为”准确且自然。
- source_word: הֵמִית
  choice: 曾……杀死
  rationale: מות的使役式表示使人死亡；“曾”表明此事先于约押和亚比筛杀押尼珥。
- source_word: אָחִיו / אֲחִיהֶם
  choice: 他兄弟／他们的兄弟
  rationale: 前者指亚比筛是约押的兄弟，后者指亚撒黑是约押和亚比筛二人的兄弟；明确保留亲属关系，以呈现经文所述动机。
- source_word: בְּגִבְעוֹן
  choice: 在基遍
  rationale: 按事件发生地点自然译为“在基遍”。
- source_word: בַּמִּלְחָמָה
  choice: 那场战斗中
  rationale: 定冠词指向叙事上文已知的特定战斗；“那场战斗”在现代汉语中保留这一特指。
- source_word: וְ / וַ
  choice: 于是
  rationale: 连接词在此承接并总结前文所述缘由；“于是”自然呈现上下文联系，同时以脚注保留较单纯的连接译法。
theological_decisions: []
