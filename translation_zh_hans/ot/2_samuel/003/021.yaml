  source_fidelity: 正文总体忠实呈现了押尼珥的行动意图、召集全以色列、与大卫立约，以及大卫遣送押尼珥的叙事。惟“你就可以作王”带有许可意味，较弱于原文在立约后所陈述的结果；宜改为“你就作王/你必作王”。
  naturalness: 整体语言现代庄重。“我主我王”在中文中可通，但加顿号更清楚地显出两个尊称。“平安地走了”可以理解，改为“平安离去”则更凝练，并较贴近原文惯用语。
  terminology: “立约”准确自然。“切约”作为脚注中的字面说明可保留。脚注b将נפש直译为“生命”且将“统治”纳入所谓直译，均不够准确；该短语应说明为“你自己（或你的心）所渴望的一切”，而“统治”是由前面的“作王”及介词短语在译文中补出的关系。
