revisions:
- from: 押尼珥对大卫说：“我要动身去，把以色列全体召集到我主我王这里来，让他们与你立约[a]；这样，你就可以作王，统治你所愿意的一切[b]。”大卫便让押尼珥离去，他就平安地走了[c]。
  to: 押尼珥对大卫说：“我要动身去，把以色列全体召集到我主、我王这里来，让他们与你立约[a]；这样，你就作王，统治你所愿意的一切[b]。”大卫便让押尼珥离去，他就平安离去了[c]。
  rationale: 修订“可以作王”以消除原文未表达的许可意味；校正脚注b对“统治”和נפש的字面说明；以顿号清楚标示宫廷尊称，并将末句略作凝练。其余内容保留原译对政治性立约、王权范围和和平遣离的准确表达。
