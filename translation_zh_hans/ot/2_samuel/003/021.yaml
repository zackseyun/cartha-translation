  text: וַ/יֹּ֣אמֶר אַבְנֵ֣ר אֶל דָּוִ֡ד אָק֣וּמָה וְֽ/אֵלֵ֡כָה וְ/אֶקְבְּצָה֩ אֶל אֲדֹנִ֨/י הַ/מֶּ֜לֶךְ אֶת כָּל יִשְׂרָאֵ֗ל וְ/יִכְרְת֤וּ אִתְּ/ךָ֙ בְּרִ֔ית וּ/מָ֣לַכְתָּ֔ בְּ/כֹ֥ל אֲשֶׁר תְּאַוֶּ֖ה נַפְשֶׁ֑/ךָ וַ/יְּשַׁלַּ֥ח דָּוִ֛ד אֶת אַבְנֵ֖ר וַ/יֵּ֥לֶךְ בְּ/שָׁלֽוֹם־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/021.yaml
  text: Abner said to David[a], “I will arise and go, and I will gather all Israel to my lord the king, so that they may make a covenant with you, and you shall reign over all that your soul desires.” Then David sent Abner away[c][b], and he went in peace.
translation:
  language: zh_hans
  text: 押尼珥对大卫说：“我要动身去，把以色列全体召集到我主、我王这里来，让他们与你立约[a]；这样，你就作王，统治你所愿意的一切[b]。”大卫便让押尼珥离去，他就平安离去了[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“与你切约”；这是“立约”的固定说法。
    reason: lexical_alternative
  - marker: b
    text: 或译“统治你心里所愿意的一切”；希伯来文直译为“在你自己所渴望的一切之上”。
    reason: lexical_alternative
  - marker: c
    text: “平安离去”是希伯来语惯用表达，表示他安全离开，双方仍保持和平。
    reason: cultural_note
lexical_decisions:
- source_word: אָקוּמָה וְאֵלֵכָה
  choice: 我要动身去
  rationale: 两个相连的祈愿式在此表达押尼珥明确的行动意向。“动身去”符合现代汉语，又保留起身并前往的连续动作。
- source_word: וְאֶקְבְּצָה ... אֶת כָּל־יִשְׂרָאֵל
  choice: 把以色列全体召集
  rationale: קבץ表示聚集、召集；“以色列全体”保留政治共同体的集合意义，避免误解为逐一包括每个人。
- source_word: אֶל־אֲדֹנִי הַמֶּלֶךְ
  choice: 到我主我王这里来
  rationale: אֶל取方向义，表示把众人带到大卫面前；“我主我王”保留宫廷敬称及两个称谓的叠用。
- source_word: וְיִכְרְתוּ אִתְּךָ בְּרִית
  choice: 让他们与你立约
  rationale: כרת ברית是订立盟约的固定表达；现代汉语用“立约”自然且准确，直译的“切约”不适合作为正文。
- source_word: וּמָלַכְתָּ
  choice: 你就可以作王，统治
  rationale: 该动词指行使王权。“作王，统治”既明确其君王身份，也自然引出后面的管辖范围。
- source_word: בְּכֹל אֲשֶׁר תְּאַוֶּה נַפְשֶׁךָ
  choice: 统治你所愿意的一切
  rationale: 保留愿望内容和管辖范围之间的关系；正文采用自然汉语，脚注说明נפש所形成的字面表达。
- source_word: וַיְשַׁלַּח דָּוִד אֶת־אַבְנֵר
  choice: 大卫便让押尼珥离去
  rationale: שלח在此指送走或准其离开，而不是差派他执行新任务；“让……离去”符合上下文。
- source_word: וַיֵּלֶךְ בְּשָׁלוֹם
  choice: 他就平安地走了
  rationale: 保留“在平安中离去”的希伯来惯用语，同时以自然汉语表达他安全、和平地获准离开。
theological_decisions:
- issue: 立约用语的表达
  choice: 与你立约
  alternative: 与你切约；与你缔结盟约
  rationale: 本节说的是政治性的盟约行动。“立约”清楚保留约的正式性质，却不把字面动词“切”硬译进正文，也不额外限定其神学类别。
- issue: נפש在愿望表达中的处理
  choice: 你所愿意的一切
  alternative: 你心里所愿意的一切；你生命所渴望的一切
  rationale: נפש在这里指人的自我，作为愿望的主体。正文采用自然汉语而不把它固定解释为某种灵魂观；脚注保留原文较具体的表达。
- issue: 王权范围短语的理解
  choice: 作王，统治你所愿意的一切
  alternative: 随心所愿地作王；在你所愿意的一切之上作王
  rationale: 介词בְ与“作王”相连，最自然地表示统治范围。译文不把它弱化成仅仅按自己的意愿作王，也不进一步界定具体地域。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。押尼珥对大卫的敬称译作“我主我王”，保留宫廷语气；正文避免生硬直译，并以脚注呈现“切约”、נפש愿望表达及“平安离去”的文化含义。
