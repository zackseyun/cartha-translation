base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/024.yaml
  text: Then Joab came to the king and said[a], “What have you done? Look, Abner came to you. Why is this—you sent him away, and he has gone on his way?”
translation:
  language: zh_hans
  text: 约押来到王面前，说：“你做了什么事？看哪，押尼珥来见你；你为什么竟把他放走了，以致他已经走远了呢？[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“他走了，走着”，是加强语气的说法，表示他确实已经离去或走远。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא יוֹאָב אֶל־הַמֶּלֶךְ
  choice: 约押来到王面前
  rationale: 叙事性 wayyiqtol 推进事件；“来到王面前”自然表达 אֶל 的趋向，也符合约押进见君王的语境。
- source_word: מֶה עָשִׂיתָה
  choice: 你做了什么事？
  rationale: 疑问词加完成式构成带责备意味的质问；此译保留其直接而惊愕的语气。
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留引人注意和加强语气的功能；“看哪”在现代中文圣经叙事中庄重且易懂。
- source_word: בָא אַבְנֵר אֵלֶיךָ
  choice: 押尼珥来见你
  rationale: בוא 的完成式陈述刚刚发生的事实；אֵלֶיךָ 在人物会面语境中译作“来见你”比机械的“到你这里”自然。
- source_word: לָמָּה זֶּה
  choice: 你为什么竟
  rationale: לָמָּה 表示“为什么”，זֶּה 加强约押诘问和不解的语气；中文以“竟”传达这种指斥性的强调，而不生硬直译“为什么这”。
- source_word: שִׁלַּחְתּוֹ
  choice: 让他走了
  rationale: שלח 的 Piel 在此可指打发、放走或准其离开；“让他走了”自然呈现大卫放行押尼珥的行动，又不额外断定是正式差遣。
- source_word: וַיֵּלֶךְ הָלוֹךְ
  choice: 任他一去不返
  rationale: 有限动词加同源绝对不定式强调押尼珥确已离去；“一去不返”在本句中表达他已经彻底走远、不能立即追回的语用力度，但不表示他永远不会回来。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而口语可懂的叙事语言。约押的发言保持急切、责备的语气；“竟”体现 לָמָּה זֶּה 的强调。“一去不返”按上下文表达已经彻底离开，并由脚注说明希伯来文的强调结构，避免将其误解为永久不再回来。
