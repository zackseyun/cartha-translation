  text: וַ/יֹּ֣אמֶר ט֔וֹב אֲנִ֕י אֶכְרֹ֥ת אִתְּ/ךָ֖ בְּרִ֑ית אַ֣ךְ דָּבָ֣ר אֶחָ֡ד אָנֹכִי֩ שֹׁאֵ֨ל מֵ/אִתְּ/ךָ֤ לֵ/אמֹר֙ לֹא תִרְאֶ֣ה אֶת פָּנַ֔/י כִּ֣י אִם לִ/פְנֵ֣י הֱבִיאֲ/ךָ֗ אֵ֚ת מִיכַ֣ל בַּת שָׁא֔וּל בְּ/בֹאֲ/ךָ֖ לִ/רְא֥וֹת אֶת פָּנָֽ/י־־׀־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/013.yaml
  text: 'He said[a], “Good. I will make a covenant with you. Only one thing I ask of you: You shall not see my face unless you first bring Michal, Saul’s daughter, when you come to see my face.”'
translation:
  language: zh_hans
  text: 他说：“好，我要与你立约。不过，我只向你求一件事：你来见我时，若不先把扫罗的女儿米甲带来，就不得见我的面。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “见我的面”也可理解为“到我面前来”。希伯来文两处都直译为“见我的面”。
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: 好
  rationale: 这里是对提议的简短应允；“好”保留了原文的简洁，也符合现代汉语表达。
- source_word: אֶכְרֹת אִתְּךָ בְּרִית
  choice: 我要与你立约
  rationale: “立约”是自然、庄重的汉语，也准确传达希伯来语“切约”的固定表达及其正式性质。
- source_word: אַךְ דָּבָר אֶחָד אָנֹכִי שֹׁאֵל מֵאִתְּךָ
  choice: 不过，我只向你求一件事
  rationale: “不过”体现限制转折，“只……一件事”保留单一条件的强调；“求”不把语气过度强化为命令。
- source_word: לֹא תִרְאֶה אֶת פָּנַי
  choice: 就不得见我的面
  rationale: 保留“见我的面”这一原文意象及觐见意味；“不得”自然表达该条件之下的禁止。
- source_word: כִּי אִם לִפְנֵי הֱבִיאֲךָ
  choice: 若不先把……带来
  rationale: 将排除条件与时间先后关系合并为自然汉语，清楚表达必须先带米甲来的条件。
- source_word: מִיכַל בַּת שָׁאוּל
  choice: 扫罗的女儿米甲
  rationale: 按现代汉语习惯先说明身份，再给出姓名，同时完整保留人物关系。
- source_word: בְּבֹאֲךָ לִרְאוֹת אֶת פָּנָי
  choice: 你来见我时
  rationale: 主句已经保留“见我的面”的字面表达，此处用自然汉语“来见我”，避免生硬重复而不损失意义。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。正文保留“见我的面”以呈现原文的个人及宫廷觐见色彩，但在同句前一处按汉语习惯译作“来见我”；脚注说明原文的重复及另一种自然理解。
