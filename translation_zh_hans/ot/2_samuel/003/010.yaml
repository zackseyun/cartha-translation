  text: to transfer the kingdom from the house of Saul and to establish the throne of David over Israel and over Judah[a], from Dan to Beer-sheba.
translation:
  language: zh_hans
  text: 把国权从扫罗家转移，并在以色列和犹大之上确立大卫的宝座，从但直到别是巴[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “从但直到别是巴”是地理惯用语，指从北到南的全境。
    reason: cultural_note
lexical_decisions:
- source_word: לְהַעֲבִיר
  choice: 把……转移出去
  rationale: 此处使役形表示使国权从原持有者手中转出；“转移出去”既保留政治权力转手之意，也不擅自补出未明说的接受者。
- source_word: הַמַּמְלָכָה
  choice: 国权
  rationale: 本节着重王室统治权由扫罗家转移到大卫；“国权”在现代汉语中比“王国”更准确地表达这里的王权、统治权含义。
- source_word: מִבֵּית שָׁאוּל
  choice: 从扫罗家
  rationale: 保留“家”这一圣经中的王朝性表达，既可指扫罗的家族，也带有其王室体系的含义。
- source_word: וּלְהָקִים
  choice: 并立定
  rationale: 使役形在政治语境中指建立、确立；“立定”与“王位”搭配自然，并保持庄重语体。
- source_word: אֶת כִּסֵּא דָוִד
  choice: 大卫的王位
  rationale: 保留原文“宝座”的具体王权意象；汉语“王位”较自然地兼顾王座与君王地位的含义。
- source_word: עַל יִשְׂרָאֵל וְעַל יְהוּדָה
  choice: 使他统治以色列和犹大
  rationale: 原文直译为把大卫的王位立在以色列和犹大之上；汉语用“使他统治”自然表达王位所辖范围，同时保留以色列与犹大两个政治实体。
- source_word: מִדָּן וְעַד בְּאֵר שָׁבַע
  choice: 从但直到别是巴
  rationale: 按原文保留由北到南的地理范围表达；“直到”体现 עַד 所表达的界限。
- source_word: בְּאֵר שָׁבַע
  choice: 别是巴
  rationale: 采用现代中文圣经读者熟悉的传统地名译法。
theological_decisions:
- issue: “扫罗家”与“大卫的王位”中的王朝和王权意象
  choice: 保留“家”和“王位”的具体表达
  alternative: 译作“扫罗王朝”和“大卫的统治”
  rationale: 原文借“家”和“宝座”表达王朝更替与王权确立。保留这些意象可维持经文的政治及王朝语感，又不引入后来的神学推论。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“国权”突出此处所转移的是统治权；“使他统治”用于自然表达原文“王位在……之上”的辖域关系。保留“扫罗家”“大卫的王位”及传统地名，以维持圣经叙事的王朝语感。
