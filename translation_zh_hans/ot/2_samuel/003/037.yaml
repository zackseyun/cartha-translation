base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/037.yaml
  text: So all the people and all Israel knew on that day that it was not from the king to put Abner son of Ner to death[a].
translation:
  language: zh_hans
  text: 于是，众人和全以色列在那一天都知道，杀死尼珥的儿子押尼珥这件事并非出于王[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“王并没有下令杀死尼珥的儿子押尼珥。”希伯来文直指这件事的来源或起因并不在王。
    reason: 说明原文来源结构所容许的语境性理解，同时保留正文较贴近原文的表达。
lexical_decisions:
- source_word: וַיֵּדְעוּ
  choice: 都知道
  rationale: ידע的Qal叙事形式在此表示众人获知并确认一个事实；“知道”自然清楚，“都”呼应后文两个带כָל的群体。
- source_word: כָל הָעָם וְכָל יִשְׂרָאֵל
  choice: 众人和全以色列
  rationale: 保留两个并列的整体性表达；“全以色列”维持希伯来文的集体称谓，而不改写为较具解释性的“所有以色列人”。
- source_word: בַּיּוֹם הַהוּא
  choice: 在那一天
  rationale: 直接保留时间短语及其叙事强调。
- source_word: כִּי
  choice: （引出“知道”的内容）
  rationale: 此处引出所知道的事实；中文无需另译为“即”或“因为”，以自然的宾语分句表达。
- source_word: לֹא הָיְתָה מֵהַמֶּלֶךְ
  choice: 这件事并非出于王
  rationale: מן表达来源或起因；“并非出于王”既保留原文的来源表述，也避免直接扩展为“王没有下令”或法律意义上的“王无罪”。补出“这件事”承接阴性单数动词所指的杀害事件，使中文完整自然。
- source_word: לְהָמִית
  choice: 杀死
  rationale: מות的Hiphil不定式表示使之死亡；“杀死”在现代汉语中准确自然。“处死”可能暗示原文未明说的司法程序。
- source_word: אֶת אַבְנֵר בֶּן נֵר
  choice: 尼珥的儿子押尼珥
  rationale: 按现代汉语自然次序表达父子称谓，并采用通行圣经人名译法。
theological_decisions:
- issue: 本节对大卫在押尼珥之死中责任的陈述范围
  choice: 译为“这件事并非出于王”
  alternative: “王没有下令杀死押尼珥”或“王对押尼珥之死无罪”
  rationale: 希伯来文明确否定此事源自王，却没有直接采用“命令”“无罪”等法律或行政词语。译文保留其较窄而有意留白的来源陈述，不把隐含意义提升为明说内容。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“于是”承接上文事件结果；“众人和全以色列”保留原文的重复与群体层次。正文脚注标记与脚注对应。
