  text: יָדַ֨עְתָּ֙ אֶת אַבְנֵ֣ר בֶּן נֵ֔ר כִּ֥י לְ/פַתֹּתְ/ךָ֖ בָּ֑א וְ/לָ/דַ֜עַת אֶת מוֹצָֽאֲ/ךָ֙ וְ/אֶת מבוא/ך וְ/לָ/דַ֕עַת אֵ֛ת כָּל אֲשֶׁ֥ר אַתָּ֖ה עֹשֶֽׂה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/025.yaml
  text: You know Abner son of Ner[a], that he came to deceive you, and to learn your going out and your coming in[b], and to learn all that you are doing.
translation:
  language: zh_hans
  text: 你知道尼珥的儿子押尼珥来，是要欺骗你[a]，要探知你的出入[b]，并查明你所做的一切。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“引诱你”或“劝诱你”。希伯来语动词可指引诱、劝诱或欺骗；本节带有敌意的语境较支持“欺骗你”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语直译为“你的出去和你的进来”，是指一个人的一切行踪或活动。
    reason: cultural_note
lexical_decisions:
- source_word: יָדַעְתָּ
  choice: 你知道
  rationale: Qal完成式第二人称阳性单数在此表达当前的认知状态；约押断言大卫理应明白押尼珥的用意。
- source_word: אַבְנֵר בֶּן נֵר
  choice: 尼珥的儿子押尼珥
  rationale: 按现代汉语圣经叙事中自然、庄重的亲子称谓表达，并保留人名音译。
- source_word: כִּי
  choice: （引出“来，是要……”这一认知内容）
  rationale: 这里最自然地引出“你知道”的内容，而不是另起因果句；汉语无需机械译出“即/因为”。
- source_word: לְפַתֹּתְךָ
  choice: 要欺骗你
  rationale: פתה可表示引诱、劝诱或欺骗；在约押敌意猜疑的政治军事语境中，“欺骗”最贴切，同时以脚注保留词义幅度。
- source_word: בָּא
  choice: 来
  rationale: 希伯来语完成式指押尼珥已经来到；汉语在“你知道……来，是要……”结构中无需另加“曾经”，也能清楚表达。
- source_word: לָדַעַת
  choice: 要探知／并查明
  rationale: 两个不定式表示押尼珥来访的目的，即获取情报；分别采用近义表达，避免汉语生硬重复，又保留目的关系。
- source_word: מוֹצָאֲךָ וְאֶת מְבוֹאֶךָ
  choice: 你的出入
  rationale: 以简洁自然的汉语保留“出去与进来”的对举，表示大卫全部的行动和活动范围。
- source_word: כָּל אֲשֶׁר אַתָּה עֹשֶׂה
  choice: 你所做的一切
  rationale: 准确表达“所有你正在做的事”；汉语此结构可自然涵盖分词所表达的持续、当前活动。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“你的出入”保留原文对举意象，并用脚注解释其习语含义；“探知／查明”体现获取情报的目的。
