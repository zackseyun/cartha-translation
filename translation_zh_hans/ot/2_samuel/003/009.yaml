base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/009.yaml
  text: May God do so to Abner[a], and more also, if, just as Yahweh has sworn to David, so I do for him—
translation:
  language: zh_hans
  text: 愿上帝这样惩罚押尼珥，并且更加重地惩罚他！正如雅威向大卫所起的誓，我也必照样为他做[a]——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我也要照样为他做。”希伯来语末句的未完成式可表示将来的行动。
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה יַעֲשֶׂה אֱלֹהִים לְאַבְנֵר וְכֹה יֹסִיף לוֹ
  choice: 愿上帝这样惩罚押尼珥，并且加倍惩罚他
  rationale: 这是希伯来语常见的自我咒诅式誓言。原文直译为“愿上帝这样对待押尼珥，并且再加给他”；中文用“惩罚”明示该套语所表达的降罚含义，同时保留押尼珥以第三人称称呼自己的形式。
- source_word: אֱלֹהִים
  choice: 上帝
  rationale: 此处为誓言套语中的单数所指，指上帝，而非众神。
- source_word: לְאַבְנֵר
  choice: 押尼珥
  rationale: 保留说话者用自己的名字作第三人称自称的原文特点，不改写为“我”。
- source_word: כַּאֲשֶׁר ... כִּי כֵן
  choice: 怎样……也必照样
  rationale: 这一对应结构自然表达雅威对大卫所起的誓与押尼珥决意采取的行动之间的对应关系。
- source_word: נִשְׁבַּע
  choice: 起誓
  rationale: 准确表达该动词的宣誓含义；上下文已清楚表明这是先前所起、现今仍有效的誓。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译保存四字神名，将其作为专名呈现，而不以称号替代。
- source_word: אֶעֱשֶׂה לוֹ
  choice: 我也必……为他成就
  rationale: 未完成式在誓言语境中具有将来和决意色彩。“成就”自然表达押尼珥要使雅威向大卫所起之誓成为现实；脚注保留较直译的可能。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；译作“雅威”可保留其专名性质，不以“主”等称号代替。
- issue: 押尼珥誓言的力度
  choice: 以自我咒诅表达其坚定决意
  alternative: 仅译为普通的将来陈述
  rationale: “愿上帝这样……并且加倍……”是自我咒诅式誓言；译文保留这种庄严而强烈的语气，但不补入原文未明说的具体灾祸。
- issue: אֶעֱשֶׂה 的时态与语气
  choice: 我也必……成就
  alternative: 我也……做
  rationale: 未完成式在此可表达未来行动及坚定意愿；“必”呈现其承诺性质，同时脚注保留更形式对应的译法。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“愿……惩罚”呈现古代誓言的咒诅语气；破折号保留本节句意延续到下一节的开放结构。
