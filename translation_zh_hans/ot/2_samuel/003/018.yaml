id: 2SA.3.18
reference: 2 Samuel 3:18
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/עַתָּ֖ה עֲשׂ֑וּ כִּ֣י יְהוָ֗ה אָמַ֤ר אֶל דָּוִד֙ לֵ/אמֹ֔ר בְּ/יַ֣ד דָּוִ֣ד עַבְדִּ֗/י הוֹשִׁ֜יעַ אֶת עַמִּ֤/י יִשְׂרָאֵל֙ מִ/יַּ֣ד פְּלִשְׁתִּ֔ים וּ/מִ/יַּ֖ד כָּל אֹיְבֵי/הֶֽם־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/018.yaml
  text: Now then[a], do it, for Yahweh has spoken concerning David, saying, ‘By the hand of my servant David I will save my people Israel from the hand of the Philistines and from the hand of all their enemies.’
translation:
  language: zh_hans
  text: 现在，你们就行动吧！因为耶和华曾论到大卫说：“我的仆人大卫必拯救我的子民以色列，使他们脱离非利士人的手，也脱离他们一切仇敌的手。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本句也可理解为：“我必借着我的仆人大卫的手拯救我的子民以色列，使他们脱离非利士人的手，也脱离他们一切仇敌的手。”这种理解以耶和华为施行拯救者，以大卫为他所使用的人。
    reason: 保留בְּיַד的工具性理解，以及神为终极施救者、大卫为受托执行者的另一种句法分析。
lexical_decisions:
- source_word: וְעַתָּה
  choice: 现在
  rationale: 这是承接上文并催促采取行动的话语标记；现代汉语用“现在”即可自然表达转折和紧迫感。
- source_word: עֲשׂוּ
  choice: 你们就行动吧
  rationale: 这是阳性复数命令式；补出“你们”体现复数对象，“行动吧”比生硬的“做吧”更清楚地指落实先前商议之事。
- source_word: כִּי
  choice: 因为
  rationale: 引出采取行动的根据，即耶和华先前所说的话。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文圣经语境中通行的神名译法，不以普通称号取代专名。
- source_word: אָמַר אֶל דָּוִד לֵאמֹר
  choice: 曾论到大卫说
  rationale: 此处话语内容是关于大卫及其受托使命，并非叙述神当面对大卫说话；“曾”也表达完成式所指向的先前宣告。
- source_word: בְּיַד דָּוִד עַבְדִּי
  choice: 我的仆人大卫
  rationale: בְּיַד可标示施行拯救的媒介或执行者。结合紧随其后的第三人称单数动词，正文用自然汉语把大卫表述为受神委任的执行者；另一种工具性理解收入脚注。
- source_word: הוֹשִׁיעַ
  choice: 必拯救
  rationale: 马所拉文本所标元音对应使役词干完成式第三人称阳性单数；在先前神谕中可作确定将来的“必拯救”，其主语自然承接“大卫”。
- source_word: עַמִּי יִשְׂרָאֵל
  choice: 我的子民以色列
  rationale: 保留第一人称所属关系及“以色列”的同位说明，体现盟约性称谓。
- source_word: מִיַּד פְּלִשְׁתִּים
  choice: 脱离非利士人的手
  rationale: 保留希伯来语以“手”表示权势或控制的惯用意象，同时在现代汉语中仍清楚可懂。
- source_word: וּמִיַּד כָּל אֹיְבֵיהֶם
  choice: 也脱离一切仇敌的手
  rationale: 保留重复的“手”这一文学意象和כָּל的完整范围；汉语中省去可由语境明确判断的“他们的”，避免赘复。
theological_decisions:
- issue: הוֹשִׁיעַ的主语及神与大卫在拯救中的关系
  choice: 正文按马所拉元音和表层句法译为“我的仆人大卫必拯救”，以大卫为受神委任的语法主语。
  alternative: “我必借着我的仆人大卫的手拯救我的子民以色列”，以耶和华为隐含的第一人称施事者、大卫为工具。
  rationale: הוֹשִׁיעַ按马所拉元音是第三人称阳性单数完成式，最自然地承接“大卫”为主语，并以确定性的先知性表述指将来。另一理解着重בְּיַד的工具性，并把耶和华视为终极施救者。正文遵循原文形态，脚注明示另一种有代表性的句法理解，不以神学偏好消除张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“行动吧”传达命令的直接性；敌人之“手”的意象予以保留。脚注标记置于相关引文之后，正文和脚注均避免引入宗派性术语。
