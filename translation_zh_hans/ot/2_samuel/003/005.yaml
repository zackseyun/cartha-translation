  yaml_path: translation/ot/2_samuel/003/005.yaml
  text: and the sixth[a], Ithream, by Eglah, David’s wife. These were born to David in Hebron.
translation:
  language: zh_hans
  text: 第六个儿子是以特念，由大卫的妻子[a]以格拉所生。这些都是大卫的儿子，生于希伯仑。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“大卫的妻子”。按上下文，这是说明以格拉是大卫的妻子之一，并不一定表示她是大卫唯一的妻子。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַשִּׁשִּׁי
  choice: 第六个
  rationale: 带连接词的序数词延续前文对大卫众子的列举；“个”承接语境，不必在此重复“儿子”。
- source_word: יִתְרְעָם
  choice: 以特念
  rationale: 按现代中文圣经人名的通行音译处理。
- source_word: לְעֶגְלָה
  choice: 以格拉所生
  rationale: 此处介词לְ在出生名单的固定表达中标明母亲；译作“以格拉所生”符合现代汉语家谱叙述。
- source_word: אֵשֶׁת דָּוִד
  choice: 大卫的妻子
  rationale: 忠实保留希伯来语领属结构；该表达本身不限定以格拉是大卫唯一的妻子。
- source_word: אֵלֶּה
  choice: 以上这些儿子
  rationale: 指示代词总结前文名单；补出语境中明确省略的“儿子”，使中文指代清楚自然。
- source_word: יֻלְּדוּ
  choice: 生的
  rationale: 保留ילד被动式所表达的出生关系，以自然中文表达为“给大卫生的”。
- source_word: לְדָוִד
  choice: 给大卫
  rationale: 在家谱语境中，ילד与לְ的组合表示亲子关系，即这些儿子为大卫所生。
- source_word: בְּחֶבְרוֹן
  choice: 在希伯仑
  rationale: 介词בְּ表示这些出生事件发生的地点。
theological_decisions:
- issue: “大卫的妻子”是否暗示以格拉是唯一的妻子
  choice: 正文保留“大卫的妻子”，并以脚注说明其非排他性
  alternative: 大卫的一个妻子
  rationale: 原文构词是“妻子＋大卫”的领属结构，语法上有确定性，却不能据此断定唯一性；正文保留原文形式，脚注避免现代读者误读。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“第六个是……”承接前文名单；“所生”适合家谱体裁。“以特念、以格拉、希伯仑”采用中文圣经传统中较通行的音译。
