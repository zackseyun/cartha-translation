base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/032.yaml
  text: They buried Abner in Hebron[a], and the king lifted up his voice and wept at Abner’s grave, and all the people wept.
translation:
  language: zh_hans
  text: 他们把押尼珥葬在希伯仑。王在押尼珥的坟前[a]放声哭泣，众民也都哭了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“王向着押尼珥的坟墓哭泣。”希伯来语介词通常有“向、朝”的意思；按这里的语境，也可理解为在押尼珥的坟前哭泣。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְבְּרוּ אֶת־אַבְנֵר
  choice: 他们把押尼珥葬了
  rationale: קבר的Qal叙事形式表示安葬；用现代汉语“把”字句自然表达受事关系，并保留事件顺序。
- source_word: בְּחֶבְרוֹן
  choice: 在希伯仑
  rationale: 介词בְּ在此表示地点，“在希伯仑”是自然且准确的表达。
- source_word: וַיִּשָּׂא הַמֶּלֶךְ אֶת־קוֹלוֹ
  choice: 王放声
  rationale: 字面为“王举起他的声音”，是大声哭号或说话的习语；“放声”既符合现代汉语，也保留公开、强烈哀恸的语气。
- source_word: וַיֵּבְךְ
  choice: 痛哭／哀哭
  rationale: בכה表示哭泣；结合葬礼语境译为“痛哭”和“哀哭”。两处虽措辞略有变化，仍清楚保留原文重复哭泣动作的效果。
- source_word: אֶל־קֶבֶר אַבְנֵר
  choice: 在押尼珥的坟前[a]
  rationale: אֶל通常指“向、朝”，此处也可能在语境中表达相对于坟墓的位置。“坟前”自然地保留方向性，同时脚注说明另一种更直译的理解。
- source_word: וַיִּבְכּוּ כָּל־הָעָם
  choice: 众民也都哭了
  rationale: כָּל־הָעָם指在场的全体民众；“也”呈现他们随着王一同哭泣的语篇关系。
theological_decisions: []
