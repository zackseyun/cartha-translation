base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/016.yaml
  text: Her husband went with her[a], walking and weeping behind her as far as Bahurim. Then Abner said to him, “Go[b], return.” So he returned.
translation:
  language: zh_hans
  text: 她丈夫跟着她[a]，一路走，一路哭，直到巴户琳。押尼珥对他说：“你走，回去吧[b]！”他就回去了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“跟在她后面”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译为“走，回去”，是两个连续的命令；也可译为“回去吧”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישָׁהּ
  choice: 她丈夫
  rationale: 本处带第三人称阴性单数后缀的 אִישׁ 按上下文特指这女子的丈夫；“她丈夫”自然且准确。
- source_word: הָלוֹךְ וּבָכֹה
  choice: 一路走，一路哭
  rationale: 这一结构描绘持续进行的动作；汉语“一路……一路……”既保留延续感，也符合现代叙事表达。
- source_word: אַחֲרֶיהָ
  choice: 跟着她
  rationale: 表示随在她后面而行；“跟着她”自然，并保留“在她后面”的空间含义，另一种较直译表达收入脚注。
- source_word: עַד בַּחֻרִים
  choice: 直到巴户琳
  rationale: עַד 加地名表示行程所达到的终点；“直到”准确而简洁。
- source_word: בַּחֻרִים
  choice: 巴户琳
  rationale: 地名采用中文圣经传统音译，便于读者识别。
- source_word: לֵךְ שׁוּב
  choice: 走吧，回去
  rationale: 保留原文连续两个命令词，不将其完全合并成一个命令；“吧”使现代汉语命令自然，同时仍显出催促语气。
- source_word: וַיָּשֹׁב
  choice: 他就回去了
  rationale: 叙事连接词在这里表达对命令的随即回应；“就”自然呈现结果关系。
