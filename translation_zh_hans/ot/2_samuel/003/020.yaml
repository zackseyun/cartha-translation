base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/020.yaml
  text: Abner came to David at Hebron[a], and twenty men were with him. And David made a feast for Abner and for the men who were with him.
translation:
  language: zh_hans
  text: 押尼珥来到希伯仑见大卫，与他同行的有二十人。大卫为押尼珥和与他同行的人设宴[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “设宴”也可译作“摆设筵席”或“预备宴席”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: 来到
  rationale: בוא可按叙事视角译为“来”“去”或“到达”；本句以大卫所在之处为目的地，用“来到”自然地表达抵达。
- source_word: אֶל דָּוִד חֶבְרוֹן
  choice: 来到希伯仑见大卫
  rationale: 原文在“大卫”之后直接接地名“希伯仑”，没有在地名前另加介词；结合上下文，希伯仑是大卫所在之处。汉语调整语序，既交代地点，也保留押尼珥去见大卫的意思。
- source_word: וְאִתּוֹ עֶשְׂרִים אֲנָשִׁים
  choice: 带着二十个人
  rationale: 原文是无动词短语，直义为“与他一起的有二十个人”。“带着二十个人”在现代汉语中简洁自然，并保留同行者的人数；“人”在此依上下文指男性随员。
- source_word: וַיַּעַשׂ ... מִשְׁתֶּה
  choice: 设宴
  rationale: עשה与מִשְׁתֶּה构成“办宴席、设宴”的表达。“设宴”既贴近原文动作，又符合庄重而自然的现代汉语。
- source_word: מִשְׁתֶּה
  choice: 宴
  rationale: מִשְׁתֶּה指宴席或筵席，饮酒可能包含在场景之中，但原文没有必要明说“酒宴”；“宴”不过度具体化。
- source_word: לְאַבְנֵר וְלַאֲנָשִׁים אֲשֶׁר אִתּוֹ
  choice: 为押尼珥和跟他同来的人
  rationale: 保留原文分别以介词לְ引出的受款待对象；“跟他同来的人”比“他的人”更明确对应אֲשֶׁר אִתּוֹ。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重且易懂的叙事语言。“来到希伯仑见大卫”按汉语习惯重排地点与人物关系；“设宴”简练地表达古代款待场景，不额外强调饮酒。脚注标在其所解释的“设宴”之后。
