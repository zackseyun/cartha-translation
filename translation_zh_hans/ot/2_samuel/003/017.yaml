  text: Abner had spoken with the elders of Israel, saying, “For some time you have been seeking David to be king over you.”
translation:
  language: zh_hans
  text: 押尼珥曾对以色列的长老说：“你们早就想让大卫作你们的王。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּדְבַר אַבְנֵר הָיָה עִם
  choice: 押尼珥曾对……说
  rationale: 希伯来语字面近于“押尼珥的话曾与……同在”，在此表示他曾与长老交涉并发言；译为现代汉语自然的引语引介。
- source_word: זִקְנֵי יִשְׂרָאֵל
  choice: 以色列的长老
  rationale: 保留群体领袖的正式称谓。
- source_word: גַּם תְּמוֹל גַּם שִׁלְשֹׁם
  choice: 早就
  rationale: 该习语字面为“昨天以及前天”，惯用义是此前已有一段时间；“早就”简洁传达持续已久之意，不误解为严格两日。
- source_word: מְבַקְשִׁים אֶת דָּוִד לְמֶלֶךְ עֲלֵיכֶם
  choice: 想让大卫作你们的王
  rationale: מְבַקְשִׁים 在此指谋求、希望某事实现，而非寻找大卫；“作你们的王”准确表达 לְמֶלֶךְ עֲלֵיכֶם。
