  rationale: 修正正文中人名短语的误植，并以“清白，不负……血债”更自然、明确地表达大卫及其王国在雅威面前不承担押尼珥被杀的流血责任。脚注将“脱离”调整为更贴近原文介词结构的“从”，同时保留习语说明。
