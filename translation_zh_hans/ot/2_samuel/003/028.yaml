base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/028.yaml
  text: Afterward[a], when David heard of it, he said[b], “I and my kingdom are forever innocent before Yahweh of the blood of Abner son of Ner.”
translation:
  language: zh_hans
  text: 后来[a]，大卫听说了这事，就说：“我和我的国在雅威面前，永远清白，不负尼珥的儿子押尼珥的血债[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“此后”或“过后”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译“从押尼珥的诸血”；这是指不承担杀害押尼珥的流血罪责的习语。
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵאַחֲרֵי כֵן
  choice: 后来
  rationale: 这是叙事中的时间表达，意为“此后、后来”；“后来”简洁自然，又不限定具体间隔。
- source_word: וַיִּשְׁמַע
  choice: 大卫听说了这事
  rationale: 动词意为“听见、听说”；结合上文所述事件，补出“这事”符合现代汉语表达，并未增加新的事件内容。
- source_word: נָקִי
  choice: 不担当……的罪
  rationale: 该词表示无罪、清白；与后面的介词短语合译为“不担当……的罪”，自然呈现法律与道德上的无责含义。
- source_word: אָנֹכִי וּמַמְלַכְתִּי
  choice: 我和我的国
  rationale: 既包括大卫本人，也包括他所统治的王国；“我的国”比抽象的“我的王权”更符合此处政治共同体的含义。
- source_word: מֵעִם יְהוָה
  choice: 在雅威面前
  rationale: 此处表达在雅威这位见证者和审判者面前的地位，保留其司法色彩。
- source_word: עַד עוֹלָם
  choice: 永远
  rationale: 忠实表达持续、永久的声明，且为现代汉语常用说法。
- source_word: מִדְּמֵי
  choice: 流……之血的罪
  rationale: 原文直译为“从……的诸血”，是指流血责任或血债的希伯来语习语；此译兼顾具体的“血”意象和责任含义。
- source_word: אַבְנֵר בֶּן נֵר
  choice: 尼珥的儿子押尼珥
  rationale: 按现代中文圣经人名惯例音译，并明确保留父子关系。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；“雅威”较贴近其通行学术拟音，也保留专名性质。
- issue: 大卫声明无罪的范围
  choice: 我和我的国……不担当……的罪
  alternative: 我和我的王室是清白的
  rationale: מַמְלָכָה 可指王国或王权；此处采用“国”而不收窄为王室或王朝，保留声明可能涵盖其统治共同体的宽度。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“不担当流……之血的罪”保留希伯来文的血之意象，同时让普通读者清楚理解大卫是在否认流血责任。
