revisions:
- from: 愿这血债归到约押头上，也归到他父亲的全家；愿约押家永不断有患漏症的、患严重皮肤病的[a]、扶杖的[b]、倒在刀下的，或缺少食物的。
  to: 愿这血债归到约押头上，也归到他父家所有的人；愿约押家中永不断有有漏症的、患皮肤病的[a]、拿纺锤的[b]、倒在刀剑下的，或缺少食物的。
  rationale: 修订仅处理两个可安全确定的词义与表达问题：将通常指“纺锤”的 פֶּלֶךְ 置为正文主译，并保留“扶杖”的传统替代解释；同时删除“严重”这一原文未明确限定的程度词。其余保留原译的祈愿／咒诅语气、血债语境和灾祸清单结构。
