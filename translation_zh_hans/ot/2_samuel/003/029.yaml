  text: יָחֻ֨לוּ֙ עַל רֹ֣אשׁ יוֹאָ֔ב וְ/אֶ֖ל כָּל בֵּ֣ית אָבִ֑י/ו וְֽ/אַל יִכָּרֵ֣ת מִ/בֵּ֣ית יוֹאָ֡ב זָ֠ב וּ/מְצֹרָ֞ע וּ/מַחֲזִ֥יק בַּ/פֶּ֛לֶךְ וְ/נֹפֵ֥ל בַּ/חֶ֖רֶב וַ/חֲסַר לָֽחֶם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/029.yaml
  text: May it fall on the head of Joab and on all his father’s house[a], and may there never be cut off from the house of Joab one who has a discharge, or is leprous, or holds a staff, or falls by the sword[b], or lacks bread.
translation:
  language: zh_hans
  text: 愿这血债归到约押头上，也归到他父家所有的人；愿约押家中永不断有有漏症的、患皮肤病的[a]、拿纺锤的[b]、倒在刀剑下的，或缺少食物的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“患麻风病的。”希伯来语此词可指多种使人礼仪上不洁的皮肤病，不限于现代所说的麻风病。
    reason: lexical_alternative
  - marker: b
    text: 或译：“扶杖的。”这个希伯来语短语的确切含义有争议。
    reason: lexical_alternative
lexical_decisions:
- source_word: יָחֻלוּ עַל רֹאשׁ
  choice: 愿这血债归到……头上
  rationale: 结合上一节所说的流血责任，补出汉语所需的指代“这血债”；“归到……头上”保留希伯来语关于罪责或报应临到本人的惯用表达。
- source_word: כָּל בֵּית אָבִיו
  choice: 他父亲的全家
  rationale: 保留父系家族和家室的整体含义，同时符合现代汉语表达。
- source_word: אַל יִכָּרֵת מִבֵּית יוֹאָב
  choice: 愿约押家永不断有
  rationale: 此处否定式愿望意为这些灾患在约押家中永不止息；采用自然汉语表达，同时保留咒诅语气。
- source_word: זָב
  choice: 患漏症的
  rationale: 指身体持续有异常排出物、因而在礼仪上不洁的人；“漏症”简洁，并与相关律法用语协调。
- source_word: מְצֹרָע
  choice: 患严重皮肤病的
  rationale: 该词涵盖的病症范围比现代汉语通常所指的麻风病更广，正文避免误限为汉森病。
- source_word: מַחֲזִיק בַּפֶּלֶךְ
  choice: 扶杖的
  rationale: 短语意义存在争议；按一种古老理解描写因残弱而倚杖者。另将按 פֶּלֶךְ 常见词义译作“拿纺锤的”列入脚注，以保留真实歧义。
- source_word: נֹפֵל בַּחֶרֶב
  choice: 倒在刀下的
  rationale: 保留希伯来语“倒在刀剑之下”的战争死亡惯用语及咒诅清单的节奏。
- source_word: חֲסַר לָחֶם
  choice: 缺少食物的
  rationale: לֶחֶם 字面为“饼/粮食”，在此泛指赖以生存的食物；译为“食物”使现代读者直接明白贫困饥乏之意。
theological_decisions:
- issue: 大卫这句话的性质
  choice: 表达审判愿望的咒诅
  alternative: 对未来事件的直接预言
  rationale: 祈愿式和否定祈愿式句法应译出“愿……”，而不处理成单纯的未来陈述。
- issue: 首句省略主语的所指
  choice: 按上文补为“这血债”
  alternative: 较笼统地译为“愿这事/这罪归到”
  rationale: 上一节明确谈到押尼珥之血；补出“血债”使中文通顺，并保持罪责和报应的语境，而不是另加一种教义解释。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。用“愿……永不断有”传达原文的咒诅和祈愿语气；清单各项保持平行。脚注标记[a]、[b]均已置于正文相应词语之后。
