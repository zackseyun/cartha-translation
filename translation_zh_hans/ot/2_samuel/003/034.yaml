  text: יָדֶ֣/ךָ לֹֽא אֲסֻר֗וֹת וְ/רַגְלֶ֨י/ךָ֙ לֹא לִ/נְחֻשְׁתַּ֣יִם הֻגָּ֔שׁוּ כִּ/נְפ֛וֹל לִ/פְנֵ֥י בְנֵֽי עַוְלָ֖ה נָפָ֑לְתָּ וַ/יֹּסִ֥פוּ כָל הָ/עָ֖ם לִ/בְכּ֥וֹת עָלָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/034.yaml
  text: Your hands were not bound[a], and your feet were not put into bronze fetters; as one falls before sons of injustice, so you have fallen. And all the people wept over him even more.
translation:
  language: zh_hans
  text: '你的手没有被捆绑，

    你的脚也没有套上铜镣；

    如同人倒在不义之徒[a]面前，

    你也这样倒下！

    众民就越发为他哀哭。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “不义之徒”原文直译为“不义之子”，也可译作“作恶的人”。
    reason: 说明希伯来语惯用表达的字面形式与自然汉语含义。
lexical_decisions:
- source_word: יָדֶךָ לֹא אֲסֻרוֹת
  choice: 你的手没有被捆绑
  rationale: 被动分词 אֲסֻרוֹת 表示处于被绑住的状态；“被捆绑”自然、庄重，也保留了与囚犯处境的隐含对照。
- source_word: וְרַגְלֶיךָ לֹא לִנְחֻשְׁתַּיִם הֻגָּשׁוּ
  choice: 你的脚也没有套上铜镣
  rationale: נְחֻשְׁתַּיִם 指铜制的脚镣；הֻגָּשׁוּ 字面有“被带到、被置于”之意，在这里表达脚被置入刑具。“套上铜镣”在现代汉语中自然，并保留材质与脚部刑具的细节。
- source_word: כִּנְפוֹל
  choice: 像人倒下……一样
  rationale: 带 כְּ 的不定式构成比较。补出泛指的“人”，使汉语通顺，同时不限定具体对象。
- source_word: לִפְנֵי בְנֵי עַוְלָה
  choice: 在不义之徒面前
  rationale: בְנֵי עַוְלָה 字面为“不义之子”，是指行不义之人的希伯来语表达。“不义之徒”既传达其道德含义，又符合现代汉语习惯；字面形式收入脚注。
- source_word: נָפָלְתָּ
  choice: 你竟……倒下
  rationale: 完成式陈述押尼珥已经倒下的悲剧事实。“竟”传达挽歌中对这种死亡方式的震惊和痛惜，不改变事件内容。
- source_word: וַיֹּסִפוּ כָל הָעָם לִבְכּוֹת עָלָיו
  choice: 众民就越发为他哀哭
  rationale: יָסַף 加不定式可表示继续某动作或进一步加深该动作。结合大卫挽歌后的语境，“越发”自然表达众人的哭泣进一步加剧。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的挽歌语言，并按诗句分行。前两行保留手未被绑、脚未戴镣的平行结构；第三行用重复的“倒”保留原文比较句与主句的修辞呼应。
