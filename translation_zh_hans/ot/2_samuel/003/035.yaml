base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/035.yaml
  text: Then all the people came to urge David to eat bread while it was still day[a], but David swore, saying, “May God do so to me, and more also[b], if before the sun goes down I taste bread or anything at all.”
translation:
  language: zh_hans
  text: 众人都来劝大卫趁天还亮着吃饼[a]；大卫却起誓说：“我若在日落以前尝了饼或任何东西，愿上帝这样待我，并且加倍如此[b]！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文作“饼”；这里也可以泛指食物。正文保留了具体说法。
    reason: lexical_alternative
  - marker: b
    text: 这是惯用的自咒誓词：若违背誓言，愿上帝如此对待他，并且加倍如此。原文没有说明具体会是什么惩罚。
    reason: cultural_note
lexical_decisions:
- source_word: לְהַבְרוֹת
  choice: 劝……吃
  rationale: 此处使役形表示众人设法让守丧禁食的大卫进食；“劝……吃”符合现代汉语表达，也保留了众人主动促使他进食的含义。
- source_word: לֶחֶם
  choice: 饼
  rationale: לֶחֶם既可具体指饼，也可泛指食物；正文保留具体意象“饼”，并以脚注说明其较宽泛的用法。
- source_word: בְּעוֹד הַיּוֹם
  choice: 趁天还亮着
  rationale: 该短语表示白昼尚未结束；这一译法自然清楚，并与后文“日落以前”相呼应。
- source_word: וַיִּשָּׁבַע
  choice: 起誓
  rationale: 直接表达该动词的庄严起誓之意，并自然引出后面的自咒誓言。
- source_word: כֹּה יַעֲשֶׂה לִּי אֱלֹהִים וְכֹה יֹסִיף
  choice: 愿上帝这样待我，并且更加严厉地待我
  rationale: 保留希伯来语惯用自咒誓词的含蓄性，不擅自说明具体会临到什么刑罚；“更加严厉”传达וְכֹה יֹסִיף的递加强调。
- source_word: כִּי אִם
  choice: 若
  rationale: 在誓言结构中引出自咒成立的条件；调整为自然的汉语“我若……愿……”句式，不改变条件关系。
- source_word: לִפְנֵי בּוֹא הַשֶּׁמֶשׁ
  choice: 在日落以前
  rationale: 这是希伯来语“太阳来到”的惯用表达，在语境中指太阳落下以前；“日落以前”简洁准确。
- source_word: אֶטְעַם
  choice: 尝了
  rationale: 保留טעם“尝”的具体含义，突出大卫连一点食物也不入口的强烈誓愿。
- source_word: אוֹ כָל מְאוּמָה
  choice: 或任何东西
  rationale: 表达誓言范围不只限于饼，而是包括一切可入口之物；“任何东西”在现代汉语中自然并具有全面性。
theological_decisions:
- issue: 自咒誓词是否明确具体刑罚
  choice: 保留“这样待我”的含蓄表达，并以脚注说明其为自咒誓词
  alternative: 译作“愿上帝重重惩罚我”
  rationale: 原文没有明说刑罚内容；正文保留这种刻意留白，避免把惯用语隐含的惩罚具体化。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“趁天还亮着”与“日落以前”形成自然呼应；誓词按汉语习惯重排为“我若……愿……”，同时保留原文没有明说具体刑罚的张力。
