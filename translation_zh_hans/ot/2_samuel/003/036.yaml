base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/036.yaml
  text: And all the people recognized it[a], and it was good in their eyes; for everything the king did was good in the eyes of all the people.
translation:
  language: zh_hans
  text: 众百姓都看出来了[a]，这事在他们看来是好的；正如王所做的一切，在众百姓看来都是好的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“都察觉到了”或“都明白了”。原文没有明说他们所察觉或明白的具体内容。
    reason: lexical_alternative
lexical_decisions:
- source_word: הִכִּירוּ
  choice: 看出来了
  rationale: נכר的使役式在此表示察觉、认出或看明白。原文没有明说宾语，因此译文也不补明百姓具体看出了什么，以保留上下文所含的空间。
- source_word: וַיִּיטַב בְּעֵינֵיהֶם
  choice: 也都觉得这事好
  rationale: 这是希伯来语“在他们眼中为好”的惯用表达，表示赞同或满意。现代汉语用“觉得这事好”自然清楚，同时保留“好”的核心词义。
- source_word: כְּכֹל אֲשֶׁר עָשָׂה הַמֶּלֶךְ
  choice: 王所做的一切
  rationale: כְּכֹל在此承接并概括王所做的一切；中文无需机械译出介词即可清楚表达后半句的概括评价。
- source_word: בְּעֵינֵי כָל הָעָם טוֹב
  choice: 众百姓也都看为好
  rationale: 保留“在眼中为好”的评价意象及与前句“好”的重复；“看为好”在庄重现代汉语中自然可懂。
- source_word: הַמֶּלֶךְ
  choice: 王
  rationale: 原文只用称号“王”，没有补出大卫的名字，译文照此保留叙事措辞。
