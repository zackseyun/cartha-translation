  to: 押尼珥回到希伯仑，约押把他引到城门中间，要同他私下说话；约押就在那里击中他的腹部[a]，他便死了。这是因为约押的兄弟亚撒黑所流的血。
  rationale: 修订“城门里面”为“城门中间”，以较准确表达城门/门道内部的地点，且保留“引到”所反映的使其转向动作；明确亚撒黑是约押的兄弟，消除现代汉语代词指代歧义。其余措辞及脚注处理均可保留。
