  - severity: low
    issue: “这是为了他兄弟亚撒黑所流的血”中的“他兄弟”在中文叙事中可能被误会为指押尼珥。
    rationale: 希伯来文的“他兄弟”按句法和上下文指约押的兄弟亚撒黑。明确主语不会增添解释，只会消除汉语代词歧义。
