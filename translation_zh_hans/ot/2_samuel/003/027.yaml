base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/027.yaml
  text: When Abner returned to Hebron[a], Joab drew him aside into the middle of the gate to speak with him privately, and there he struck him in the belly, so that he died, for the blood of Asahel his brother.
translation:
  language: zh_hans
  text: 押尼珥回到希伯仑，约押把他引到城门中间，要同他私下说话；约押就在那里击中他的腹部[a]，他便死了。这是因为约押的兄弟亚撒黑所流的血。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 传统译作“第五根肋骨”；这里所指的是腹部或肚腹。
    reason: 说明חֹמֶשׁ的传统译法和正文采用的语境义。
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: 回到
  rationale: שׁוב在此指押尼珥被召回后返回希伯仑；“回到”符合上下文，也比单说“回来”更明确。
- source_word: וַיַּטֵּהוּ
  choice: 把他引到
  rationale: נטה的使役形可表示使人转向、把人引开；这里指约押使押尼珥偏离原路，进入城门内部。中文用“引到”既保留方向性，也不额外断定强迫程度。
- source_word: אֶל־תּוֹךְ הַשַּׁעַר
  choice: 到城门里面
  rationale: תּוֹךְ表示内部或当中，שַׁעַר可指城门建筑及门洞区域。“城门里面”自然地表达进入门道内部，同时不把地点过度具体化。
- source_word: לְדַבֵּר אִתּוֹ בַּשֶּׁלִי
  choice: 要同他私下说话
  rationale: בַּשֶּׁלִי含义较难确定，可能涉及安静、从容或隐秘的情境；“私下”符合叙事场景，又没有加入“假意”等原文未明说的动机判断。
- source_word: וַיַּכֵּהוּ שָׁם הַחֹמֶשׁ
  choice: 就在那里击中他的腹部
  rationale: נכה表示击打，原文未明说武器，故不擅自译作“刺”。חֹמֶשׁ在类似致命打击的叙事中指躯干腹部一带；正文用现代读者清楚理解的“腹部”，传统译法置于脚注。
- source_word: וַיָּמָת
  choice: 他便死了
  rationale: 忠实保留希伯来叙事的顺承关系；“便”自然呈现受击后死亡的结果，而不把句法关系解释得过强。
- source_word: בְּדַם עֲשָׂהאֵל אָחִיו
  choice: 这是为了他兄弟亚撒黑所流的血
  rationale: 介词בְּ在此表达原因或动机。“为了……所流的血”保留血债与复仇的法律叙事色彩，却不额外加入“报仇”一词来完全解释其含义。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。人名依照中文圣经常用译名；避免添加“假意”“刺杀”“报仇”等虽可由情境推知、却未由本节明确表达的内容。脚注标记紧随“腹部”，与所注释的词对应。
