base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/026.yaml
  text: Then Joab went out from David and sent messengers after Abner[a], and they brought him back from the well of Sirah. But David did not know it.
translation:
  language: zh_hans
  text: 约押从大卫那里出来，派使者去追赶押尼珥。他们从西拉井[a]把押尼珥带了回来，大卫却不知道这事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“从博尔·西拉”；这是把希伯来语视为一个地名，而不是“西拉井”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: 出来
  rationale: יצא在连续叙事中表示离开所在之处；结合מֵעִם דָּוִד，译作“从大卫那里出来”既保留具体移动，也符合现代汉语。
- source_word: מֵעִם דָּוִד
  choice: 从大卫那里
  rationale: מֵעִם表示从与某人同在之处离开；“从大卫那里”自然表达这一关系。
- source_word: מַלְאָכִים
  choice: 使者
  rationale: 此处指约押派出的人员，而非天使；“使者”准确且符合叙事语体。
- source_word: אַחֲרֵי אַבְנֵר
  choice: 去追赶押尼珥
  rationale: אַחֲרֵי在此表示跟在押尼珥后面；上下文带有把他追回的目的，因此“追赶”比单纯“跟随”更清楚，但不额外说明其动机。
- source_word: וַיָּשִׁבוּ אֹתוֹ
  choice: 把押尼珥带了回来
  rationale: שוב的使役形式表达使某人返回；“带了回来”是自然的现代汉语。为避免连续代词所指不清，重提押尼珥的名字。
- source_word: מִבּוֹר הַסִּרָה
  choice: 从西拉井
  rationale: בּוֹר可指井、蓄水池或坑；此处传统上理解为名叫“西拉”的井。由于也可能整体视为地名，另加脚注保留异读。
- source_word: וְדָוִד לֹא יָדָע
  choice: 大卫却不知道这事
  rationale: 这里说明大卫并不知晓约押的行动。“却”自然体现语境中的对比，“这事”明确补出希伯来语语境所指。
theological_decisions: []
