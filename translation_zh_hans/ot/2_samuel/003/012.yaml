base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/012.yaml
  text: Then Abner sent messengers to David on his behalf[a], saying, “To whom does the land belong?” saying, “Make your covenant with me, and behold[b], my hand is with you to bring all Israel over to you.”
translation:
  language: zh_hans
  text: 押尼珥派使者代他去见大卫[a]，说：“这地属于谁呢？”他又说：“你与我立约吧。看哪，我的手与你同在[b]，使全以色列归向你。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语直译近于“在他的位置上”，这里指使者代表押尼珥；原文表达十分简略。
    reason: lexical_alternative
  - marker: b
    text: “我的手与你同在”是表示支持并运用力量帮助对方的说法。
    reason: idiom_explanation
lexical_decisions:
- source_word: תחתו
  choice: 代表自己
  rationale: 该词组直译近于“在他的位置上”，在这里表示押尼珥派使者代自己传话；译作“代表自己”自然地表达了代理关系，同时用脚注保留原文措辞的简略性。
- source_word: לְמִי אָרֶץ
  choice: 这地属于谁呢？
  rationale: 保留原文简短的反问形式及其关于土地归属或统治权的政治张力，不扩译为“谁应当统治这地”。
- source_word: כָּרְתָה בְרִיתְךָ אִתִּי
  choice: 你与我立约吧
  rationale: כרת ברית是“立约”的固定表达；中文无需直译为“切约”，语气则保留第二人称命令式。
- source_word: וְהִנֵּה יָדִי עִמָּךְ
  choice: 看哪，我的手与你同在
  rationale: 保留“手”的原有比喻和“看哪”的强调作用，不直接化约为“我支持你”；脚注说明该习语的含义。
- source_word: לְהָסֵב אֵלֶיךָ
  choice: 使……归向你
  rationale: 使役形式表达押尼珥要促成全以色列转而归附大卫；“归向你”兼顾政治归顺和原文的方向性。
- source_word: אֶת כָּל יִשְׂרָאֵל
  choice: 全以色列
  rationale: 指作为整体的以色列各支派或国民，采用简洁而传统、易懂的表达。
- source_word: מַלְאָכִים
  choice: 使者
  rationale: 此处是政治交涉中的人类信使，并非天使；“使者”准确且符合庄重叙事语体。
theological_decisions:
- issue: לְמִי אָרֶץ所表达的土地归属与统治权
  choice: 保留直接反问“这地属于谁呢？”
  alternative: 解释为“这地是我的”或扩译为“谁应当统治这地？”
  rationale: 原文高度凝练，可能涉及合法归属、王权，也可能暗示押尼珥自认有左右局势的权力。直译为反问可保留这些政治及神学张力，而不替读者确定唯一含义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。保留原文连续两个“说”的结构为“说……他又说”，也保留“看哪”和“我的手与你同在”的修辞力度；脚注仅解释必要的希伯来语简略表达和习语。
