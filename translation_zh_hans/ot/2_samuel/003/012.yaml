  to: 押尼珥派使者代他去见大卫[a]，说：“这地属于谁呢？”他又说：“你与我立约吧。看哪，我的手与你同在[b]，使全以色列归向你。”
  rationale: 将“代表自己”改为“代他”，使差遣使者的代理关系更符合现代汉语表达；将“我能使”改为“使”，避免把押尼珥的支持和行动承诺缩减为单纯能力，并保留原文“手”这一政治力量的比喻及其目的性。其余措辞和脚注均可保留。
