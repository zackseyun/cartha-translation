base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/015.yaml
  text: So Ish-bosheth sent and took her from her husband[b][a], from Paltiel the son of Laish.
translation:
  language: zh_hans
  text: 伊施波设就派人，把她从她丈夫[a]那里，即从拉亿的儿子帕提铁[b]那里带走了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“那男人”。这里指与她共同生活的丈夫。
    reason: lexical_alternative
  - marker: b
    text: 本节希伯来文作“帕提铁”；相关经文有较短的名字形式“帕提”。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: 派人去
  rationale: שׁלח在叙事中意为“派出、差遣”。原文没有明说所派的是谁；汉语用“派人去”自然表达行动，同时不过度具体说明人数或使命形式。
- source_word: אִישׁ בֹּשֶׁת
  choice: 伊施波设
  rationale: 按现代中文圣经常见的人名音译处理该专名。
- source_word: וַיִּקָּחֶהָ
  choice: 把她带走了
  rationale: לקח加阴性单数宾语后缀，直义为“取了她／带走了她”。这里描述她被从帕提铁身边带离；“带走”既符合语境，也不加入“强行抢走”等原文未明说的力度。
- source_word: מֵעִם אִישׁ מֵעִם
  choice: 从她丈夫那里，也就是从……那里
  rationale: 原文两次使用מֵעִם，表示从某人身边或所属处离开。第二个短语具体说明前面的“那男人”是谁；用“也就是”清楚呈现同位说明关系。
- source_word: אִישׁ
  choice: 她丈夫
  rationale: אִישׁ本义可作“男人”，在此语境中指与她有婚姻关系的帕提铁。正文采用自然明确的“她丈夫”，脚注保留原文字面表达。
- source_word: פַּלְטִיאֵל
  choice: 帕提铁
  rationale: 依本节马所拉文本פַּלְטִיאֵל音译，并与相关经文中的较短形式“帕提”有所区别。
- source_word: בֶּן לוש
  choice: 拉亿的儿子
  rationale: בֶּן表示父子关系；לוש按中文圣经传统音译为“拉亿”。
theological_decisions:
- issue: 米甲与帕提铁关系的称谓
  choice: 正文称帕提铁为“她丈夫”，同时以脚注注明原文直译
  alternative: 直译为“那男人”
  rationale: 上下文表明此人是与米甲共同生活的婚姻伴侣，但本章同时涉及大卫对米甲的先前婚姻权利。译文只表达本节中אִישׁ的语境含义，不据此裁断整段叙事中的婚姻合法性。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“于是”承接前文，“派人去……把她带走”符合现代汉语语序。保留原文两次“从……那里”的同位结构所表达的辨认关系，并用脚注说明字面形式及人名差异。
