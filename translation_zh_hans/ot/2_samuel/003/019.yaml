  text: וַ/יְדַבֵּ֥ר גַּם אַבְנֵ֖ר בְּ/אָזְנֵ֣י בִנְיָמִ֑ין וַ/יֵּ֣לֶךְ גַּם אַבְנֵ֗ר לְ/דַבֵּ֞ר בְּ/אָזְנֵ֤י דָוִד֙ בְּ/חֶבְר֔וֹן אֵ֤ת כָּל אֲשֶׁר טוֹב֙ בְּ/עֵינֵ֣י יִשְׂרָאֵ֔ל וּ/בְ/עֵינֵ֖י כָּל בֵּ֥ית בִּנְיָמִֽן־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/019.yaml
  text: Abner also spoke in the hearing of Benjamin[b][a], and Abner also went to speak in the hearing of David at Hebron all that seemed good in the eyes of Israel and in the eyes of the whole house of Benjamin.
translation:
  language: zh_hans
  text: 押尼珥也对便雅悯人说了[a]；他又到希伯仑去，把以色列和便雅悯全家眼中看为好的一切，都说给大卫听。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“也在便雅悯耳中说”；“便雅悯”在这里指便雅悯支派的人。
    reason: 说明希伯来语惯用语及集合性支派名称。
lexical_decisions:
- source_word: בְּאָזְנֵי
  choice: 对……说；说给……听
  rationale: 原文直译为“在……耳中”，是表示向某人说话、让某人听见的惯用语。按两个分句的不同句式分别译为自然的现代汉语，同时保留听说关系。
- source_word: בִנְיָמִין
  choice: 便雅悯人
  rationale: 此处“便雅悯”是集合性称呼，指便雅悯支派的人；汉语加“人”可避免被误解为单独一个人。
- source_word: לְדַבֵּר
  choice: 说给……听
  rationale: 保持 דּבר 的一般言说义，不把这次谈话进一步解释为谈判、劝服或通报。
- source_word: בְּחֶבְרוֹן
  choice: 到希伯仑
  rationale: 与前面的运动动词“去”结合，现代汉语自然表达为“到希伯仑去”；地点是押尼珥向大卫说话之处。
- source_word: אֵת כָּל אֲשֶׁר טוֹב בְּעֵינֵי
  choice: 把……眼中看为好的一切
  rationale: 保留希伯来语“在某人眼中为好”的评价性意象，也让读者看出以色列和便雅悯全家对此事的认可；不把“好”过度限定为“满意”“接受”或“赞成”。
- source_word: יִשְׂרָאֵל
  choice: 以色列
  rationale: 保留原文集合性的民族名称，并与后面的“便雅悯全家”并列。
- source_word: כָּל בֵּית בִּנְיָמִן
  choice: 便雅悯全家
  rationale: “家”保留原文亲族兼政治共同体的表达；“全家”在这里指整个便雅悯支派共同体，并非仅指一个核心家庭。
- source_word: גַּם ... גַּם
  choice: 也……又……
  rationale: 用汉语自然的对应结构保留原文两次 גַּם 所强调的两项追加行动。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“眼中看为好”略带源语色彩，刻意保留原文重复的评价表达及其可能包含的认可、赞同或认为合宜等语义范围。首句原文没有明说所说内容，译文也不补入“这事”或“这番话”，以免把隐含宾语具体化。
