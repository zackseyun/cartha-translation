base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/022.yaml
  text: And behold[a], David’s servants and Joab came in from a raid and brought much plunder with them. But Abner was not with David in Hebron, because he had sent him away[b], and he had gone in peace.
translation:
  language: zh_hans
  text: 看哪，大卫的臣仆和约押从一次突袭中归来[a]，带着许多战利品。押尼珥却不在希伯仑与大卫在一起，因为大卫已经让他离开，他也平安离去了[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “从一次突袭中归来”也可译作“从一支队伍归来”。希伯来词גְּדוּד可指军队或武装队伍；这里因下文提到战利品，正文按突袭行动理解。
    reason: lexical_alternative
  - marker: b
    text: 直译为“在平安中走了”，指他安全、和平地离开。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留希伯来语引出突发叙事进展的提示和现场感；虽带有庄重色彩，在现代中文圣经叙事中仍清楚可懂。
- source_word: עַבְדֵי דָוִד
  choice: 大卫的臣仆
  rationale: 这里指服事大卫、受他统领的人，并非着重奴隶身份；“臣仆”兼顾王廷与军事语境，也比泛化为“手下”更贴近原文。
- source_word: מֵהַגְּדוּד
  choice: 突袭归来
  rationale: גְּדוּד既可指队伍，也可涉及袭掠行动；下文提到战利品，因此正文按行动理解，同时在脚注保留“队伍”的词义可能。
- source_word: וְשָׁלָל רָב
  choice: 许多战利品
  rationale: 准确表达军事行动中夺得的大量财物，符合现代汉语常用表达。
- source_word: וְאַבְנֵר אֵינֶנּוּ עִם דָּוִד בְּחֶבְרוֹן
  choice: 押尼珥却不在希伯仑与大卫一起
  rationale: “却”自然呈现本句与约押一行归来的对照；地点和伴随关系均按原文保留。
- source_word: כִּי שִׁלְּחוֹ
  choice: 因为大卫已经让他离去
  rationale: 动词主语由上下文确定为大卫；“已经”表明此事发生在约押归来之前。“让他离去”保持中性，不额外赋予驱逐或正式解职之意。
- source_word: וַיֵּלֶךְ בְּשָׁלוֹם
  choice: 押尼珥也平安地走了
  rationale: 明确押尼珥是离去者，以免连续代词在中文中产生不必要的指代混乱；“平安地走了”保留希伯来语惯用语的字面意象与安全、和平离开的含义。
theological_decisions: []
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“看哪”保留叙事现场感；其余措辞避免文言化。为符合中文表达并消除无益的代词歧义，末句明确重复“押尼珥”。
