base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/014.yaml
  text: Then David sent messengers to Ish-bosheth son of Saul[a], saying, “Give me my wife Michal[b], whom I betrothed to myself for a hundred Philistine foreskins.”
translation:
  language: zh_hans
  text: 随后，大卫差遣使者到扫罗的儿子伊施波设那里，说：“把我的妻子米甲交给我；我曾用一百个非利士人的包皮[b]聘定她为妻[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较通顺地译作：“我用一百个非利士人的包皮赢得她为妻。”希伯来文较直译为“我为自己聘定她为妻”。
    reason: lexical_alternative
  - marker: b
    text: 关于大卫按扫罗所要求的聘礼献上非利士人的包皮，从而得到米甲的记载，见撒母耳记上18:25—27。
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: 随后，大卫差遣
  rationale: 叙事性连续式推动事件向前发展；“随后”自然表达先后次序，又不额外断定因果关系。
- source_word: מַלְאָכִים
  choice: 使者
  rationale: 这里指奉命传话的人；“使者”准确、自然，不必进一步解释为正式外交使节。
- source_word: אֶל אִישׁ בֹּשֶׁת בֶּן שָׁאוּל
  choice: 到扫罗的儿子伊施波设那里
  rationale: 保留“扫罗的儿子”这一同位说明，并采用现代中文圣经人名的常见音译。
- source_word: לֵאמֹר
  choice: 说
  rationale: 以简洁自然的中文引出直接引语。
- source_word: תְּנָה
  choice: 交给我
  rationale: נתן的命令式本义为“给”；在要求对方送回一个人的语境中，“交给我”比单说“给我”更自然，也没有增添暴力意味。
- source_word: אֶת אִשְׁתִּי אֶת מִיכַל
  choice: 我的妻子米甲
  rationale: 两个宾语标记构成同位关系，即“我的妻子，也就是米甲”；中文合并表达最为自然。
- source_word: אֲשֶׁר אֵרַשְׂתִּי לִי
  choice: 她是……为自己聘定的
  rationale: ארשׂ表示订婚、聘定，而不只是泛指结婚；“为自己”保留לִי，体现大卫以先前聘约为依据提出权利主张。
- source_word: בְּמֵאָה עָרְלוֹת פְּלִשְׁתִּים
  choice: 用一百个非利士人的阳皮
  rationale: 介词ב在此说明聘礼或代价；直译“阳皮”保留原文具体而令人不适的措辞，不作淡化。
theological_decisions:
- issue: 米甲的婚姻身份与聘约用语之间的张力
  choice: 同时译作“我的妻子”和“为自己聘定的”
  alternative: 把ארשׂ笼统译为“娶来的”，从而消除妻子与聘定用语之间的张力
  rationale: 希伯来文本一方面称米甲为大卫的“妻子”，另一方面又以聘定和聘礼作为大卫主张的依据。译文保留这种法律与关系层面的张力，不自行调和。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。“阳皮”虽生硬且带有强烈冲击性，却准确对应原文；句式避免古奥，同时保留大卫命令语气及“妻子／聘定”之间的原文张力。
