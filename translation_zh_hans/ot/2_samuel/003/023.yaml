base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/023.yaml
  text: When Joab and all the army that was with him arrived, they told Joab, saying, “Abner son of Ner came to the king, and he sent him away, and he went in peace.”
translation:
  language: zh_hans
  text: 约押和跟随他的全军来到时，有人告诉约押说：“尼珥的儿子押尼珥来见王，王送他离去，他也平安地走了。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּאוּ
  choice: 回来
  rationale: 该动词本义为“来、到达”。结合上文约押一行突袭归来，此处用“回来”自然交代他们抵达王所在之处，同时不增加原文未明说的地点。
- source_word: כָל הַצָּבָא אֲשֶׁר אִתּוֹ
  choice: 跟随他的全军
  rationale: 直译为“与他同在的全军”；“跟随他的全军”符合现代汉语叙事，也准确表达随约押行动的军队。
- source_word: וַיַּגִּדוּ
  choice: 有人告诉
  rationale: 希伯来语为未明说身份的复数主语“他们告诉”。汉语若直译“他们”容易误指约押和全军，因此以泛指“有人”保留告知者身份未定这一点。
- source_word: בָּא ... אֶל הַמֶּלֶךְ
  choice: 来见王
  rationale: 介词结构字面为“来到王那里”；“来见王”在汉语中简洁自然，且不额外规定会面的性质。
- source_word: וַיְשַׁלְּחֵהוּ
  choice: 王送他离去
  rationale: 动词可指“打发、送走”。补出承接上文的主语“王”以消除汉语歧义；“送他离去”保留较中性的语气。
- source_word: בְּשָׁלוֹם
  choice: 平安地
  rationale: 该固定表达指安然、平安离去，也可能隐含友好关系；译作“平安地”保留其叙事与关系层面的张力。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。删去希伯来叙事中可直译为“说”的冗余引语公式，以“告诉约押说”顺畅引出直接引语；人名依中文圣经通行译法作“约押、尼珥、押尼珥”。
