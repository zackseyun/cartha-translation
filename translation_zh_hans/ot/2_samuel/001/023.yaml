base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/023.yaml
  text: Saul and Jonathan[a], beloved and pleasant in their lives, were not parted in their death; they were swifter than eagles[c][b], they were stronger than lions.
translation:
  language: zh_hans
  text: 扫罗和约拿单，生前蒙人爱戴、令人喜爱；在死亡中也没有分离。他们比鹰更迅捷[a]，比狮子更强壮[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “鹰”所译的希伯来词也可泛指大型猛禽，有时可译作“秃鹫”。
    reason: lexical_alternative
  - marker: b
    text: “更强壮”也可译作“更勇猛”。
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁאוּל וִיהוֹנָתָן
  choice: 扫罗和约拿单
  rationale: 采用现代中文圣经人名的通行译法。
- source_word: הַנֶּאֱהָבִים וְהַנְּעִימִם
  choice: 可爱可亲
  rationale: 前者是אהב的被动／形容词形式，可指“受人爱戴”；后者表示令人愉悦、可亲。合译为“可爱可亲”，简洁地保留诗歌的并列赞语，又不把它限定为外貌或道德评价。
- source_word: בְּחַיֵּיהֶם וּבְמוֹתָם
  choice: 生前……死时
  rationale: 以自然现代汉语表达生命与死亡之间的平行对照；“死时”保留共同遭遇死亡的语境。
- source_word: לֹא נִפְרָדוּ
  choice: 也不分离
  rationale: 保留נפרדו所表达的分开、离散之意，并以“也”连接生前与死时的对照。
- source_word: מִנְּשָׁרִים קַלּוּ
  choice: 比鹰更迅捷
  rationale: קלל在比较结构中表示轻捷、快速；נשר通常译作“鹰”，但也可泛指大型猛禽。
- source_word: מֵאֲרָיוֹת גָּבֵרוּ
  choice: 比狮子更强壮
  rationale: גבר在此表达力量上的胜过；“更强壮”清楚保留比较关系，同时符合现代汉语诗性表达。
theological_decisions:
- issue: 大卫哀歌对扫罗和约拿单的赞颂语气
  choice: 按经文保留对二人的共同尊荣与诗性赞美，不因扫罗此前的失败而淡化措辞。
  alternative: 因扫罗在前文中的过失而弱化赞语，或将赞语强化为对二人品格的绝对判定。
  rationale: 本节属于葬礼哀歌，其修辞功能是追念并尊荣死者。译文应保留这一正面描写，同时不替整卷书化解扫罗形象中的张力。
- issue: “死时也不分离”的含义范围
  choice: 保留诗句本身的开放性，既可指二人一同战死，也与生前并列关系形成诗意呼应。
  alternative: 明确解释为二人始终关系亲密，或仅解释为他们死于同一场战役。
  rationale: 原文没有进一步限定“不分离”的具体层面，不宜在正文中替作者收窄含义。
translation_notes:
  register: 采用庄重而自然的现代标准普通话，保留哀歌的平行结构与凝练节奏。“可爱可亲”同时承载“受爱戴／可爱”与“令人愉悦／可亲”的语义，不将赞语限定为外貌、性情或道德评价。所有脚注标记均置于正文相应词句之后。
