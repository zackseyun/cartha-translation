  yaml_path: translation/ot/2_samuel/001/011.yaml
  text: Then David took hold of his clothes and tore them[a], and so did all the men who were with him.
translation:
  language: zh_hans
  text: 大卫就抓住自己的衣服，将其撕裂；所有跟他在一起的男人也都这样做了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּחֲזֵק
  choice: 抓住
  rationale: חזק在这里描写撕衣前用手抓住衣服的动作。“抓住”在现代汉语中自然直接，又不额外解释其动机。
- source_word: בִּבְגָדוֹ
  choice: 自己的衣服
  rationale: בגד为单数集合性名词，可指所穿的衣服。译作“自己的衣服”既符合汉语习惯，也明确反身所属关系；不具体化为原文未说明的“外袍”。
- source_word: וַיִּקְרָעֵם
  choice: 把衣服撕裂
  rationale: קרע表示撕裂；宾语后缀在马所拉文本中为复数，与前面的单数集合名词形成数的不一致。汉语重述“衣服”可自然保留所指，同时避免生硬的代词数对应。
- source_word: וְגַם
  choice: 也都这样做了
  rationale: וְגַם把相同动作扩展到同伴。汉语以“也都这样做了”自然补足省略的谓语，并与“所有人”呼应。
- source_word: כָּל־הָאֲנָשִׁים
  choice: 所有人
  rationale: אֲנָשִׁים在此指与大卫同在的一群人；上下文可知是其随从。现代汉语“所有人”自然涵盖整群，不必使用较显刻意的“所有男人”。
- source_word: אֲשֶׁר אִתּוֹ
  choice: 跟他在一起的
  rationale: 直译关系从句，清楚指出这些人当时与大卫同在，不强化为原文未明说的正式“随从”。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“撕裂衣服”保留古代哀悼动作的具体性，不在正文中解释其礼俗含义。分号清楚连接大卫的动作与众人的相同行动。
