  yaml_path: translation/ot/2_samuel/001/003.yaml
  text: David said to him[a], “Where have you come from?” He said to him, “I have escaped from the camp of Israel.”
translation:
  language: zh_hans
  text: 大卫对他说：“你从哪里来？”他对大卫说：“我从以色列的营中逃出来了。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵי מִזֶּה
  choice: 从哪里
  rationale: 这个问语询问来处或来源；“从哪里来”是现代汉语中自然、准确的表达。
- source_word: תָּבוֹא
  choice: 来
  rationale: 虽为未完成式，但在此直接问句中指刚刚完成的移动；汉语“从哪里来”无需另加时态标记即可清楚表达。
- source_word: מִמַּחֲנֵה יִשְׂרָאֵל
  choice: 从以色列营中
  rationale: מַחֲנֶה在此指军事营地；“以色列营”保留原文的属格关系和军事语境。
- source_word: נִמְלָטְתִּי
  choice: 逃了出来
  rationale: 该动词的Niphal形式表示成功脱离危险；“逃了出来”既体现逃离，也体现行动已经成功完成。
- source_word: וַיֹּאמֶר ... וַיֹּאמֶר
  choice: 问……回答
  rationale: 原文两次都用常见的“说”，但上下文明确是一问一答；采用“问……回答”更符合现代汉语叙事，同时不改变言语行为。
- source_word: דָּוִד
  choice: 大卫
  rationale: 采用现代简体中文圣经传统中通行的人名译法。
