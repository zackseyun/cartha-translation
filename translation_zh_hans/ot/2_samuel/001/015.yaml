  text: Then David called one of the young men and said[a], “Come near; strike him down.” So he struck him, and he died.
translation:
  language: zh_hans
  text: 大卫叫来一个年轻人，对他说[a]：“上前来，击倒他。”那年轻人就击打他，他便死了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “击倒他”或译“攻击他”、“扑向他”。希伯来语短语פְּגַע בּוֹ可泛指暴力攻击；这里的上下文清楚表明其结果是致命的。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: 叫来
  rationale: קרא在这里是呼叫或召来某人；“叫来”自然地表达大卫命一名青年到跟前来。
- source_word: לְאַחַד מֵהַנְּעָרִים
  choice: 一个青年
  rationale: נְעָרִים可指青年、仆役或侍从。原文使用年龄或身份较宽泛的称呼，并非正式职衔，因此直译为“一个青年”。
- source_word: גַּשׁ
  choice: 上前来
  rationale: נגשׁ的命令式意为靠近或上前；“上前来”符合现场发令的语境，也适合现代汉语叙事。
- source_word: פְּגַע בּוֹ
  choice: 击杀他
  rationale: פגע与ב连用可指攻击、袭击或猛击。这里命令的目的明确是致死，但原词并非通常直说“杀”的动词；“击杀”兼顾暴力动作及本段明确的致命意图。
- source_word: וַיַּכֵּהוּ
  choice: 那青年就击打他
  rationale: נכה的基本义是击打；下句另行交代死亡结果，因此不将动作和结果合并译成“杀了他”。补出“那青年”可避免现代汉语中施事者含混。
- source_word: וַיָּמֹת
  choice: 他便死了
  rationale: מות是“死”的普通动词；“便”自然呈现前一击打动作随即带来的结果，同时保留原文动作与死亡分列的叙事次序。
