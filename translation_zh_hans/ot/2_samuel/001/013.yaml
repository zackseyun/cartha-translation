base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/013.yaml
  text: David said to the young man who told him[a], “Where are you from?” And he said, “I am the son of an Amalekite sojourner.”
translation:
  language: zh_hans
  text: 大卫问那向他报信的年轻人：“你是哪里人？”他回答：“我是一个寄居的亚玛力人之子。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文也可理解为：“我是一个寄居者的儿子，是亚玛力人。”希伯来语的表达既可把他的父亲说成寄居当地的亚玛力人，也可较宽泛地表明说话者出自寄居当地的亚玛力人家族。
    reason: 保留בֶּן אִישׁ גֵּר עֲמָלֵקִי中身份修饰关系与族裔归属范围的歧义。
lexical_decisions:
- source_word: הַנַּעַר
  choice: 年轻人
  rationale: נַעַר可指年轻男子，也可指侍从；本节并未明确强调服役身份，因此译作“年轻人”自然且不过度限定。
- source_word: הַמַּגִּיד לוֹ
  choice: 那向他报信的
  rationale: נגד的分词在此指把消息带给大卫的人；“向他报信”既符合叙事语境，也比笼统的“告诉他”更准确。
- source_word: אֵי מִזֶּה
  choice: 你是哪里人？
  rationale: 这一问语询问对方的来处或出身；现代汉语以“你是哪里人”表达最自然。
- source_word: בֶּן אִישׁ
  choice: 一个……人的儿子
  rationale: 原文直译为“一个人的儿子”，在此用来说明父系身份；此译保留亲子关系，同时避免生硬赘述。
- source_word: גֵּר
  choice: 寄居的
  rationale: גֵּר指离开本族土地、居住在异地的非本地居民。“寄居的”保留其社会与地域身份，也符合庄重的经文语体。
- source_word: עֲמָלֵקִי
  choice: 亚玛力人
  rationale: 这是由“亚玛力”形成的族群称谓，采用现代中文圣经语境中的通行译名。
- source_word: אָנֹכִי
  choice: 我是
  rationale: 独立人称代词用于明确的自我陈述；汉语以“我是”自然呈现其判断句功能。
theological_decisions:
- issue: “寄居者”与“亚玛力人”的身份所指
  choice: 正文将二者都理解为对父亲的描述：“一个寄居的亚玛力人的儿子”
  alternative: 也可较宽泛地理解为说话者借父系出身表明自己属于寄居当地的亚玛力人群体
  rationale: בֶּן אִישׁ גֵּר עֲמָלֵקִי的紧密排列最自然地把“寄居的、亚玛力人”视为父亲的身份描述，但该表达也承载说话者本人的族裔和寄居背景；脚注保留这一范围而不作教义化推断。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“报信”呼应上下文中的战场消息；“寄居的”较“侨民”更贴近古代社会身份，又避免“外侨”等现代法律色彩。引号及问答结构按现代简体中文标点处理。
