  yaml_path: translation/ot/2_samuel/001/008.yaml
  text: He said to me[a], ‘Who are you?’ And I said to him, ‘I am an Amalekite.’
translation:
  language: zh_hans
  text: 他问我[a]：“你是谁？”我回答他：“我是亚玛力人。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来原文在第二句写作“他就对他说”；但按上下文，是这个人叙述自己怎样回答扫罗，所以正文译作“我回答他”。
    reason: textual_variant
lexical_decisions:
- source_word: וַיֹּאמֶר לִי
  choice: 他问我
  rationale: 字面为“他对我说”；因后接直接问句，现代汉语用“问我”更自然，也准确表达言语行为。叙事连接词 וַ־ 无须机械译出。
- source_word: מִי אָתָּה
  choice: 你是谁？
  rationale: 希伯来语无系词的疑问句；现代汉语自然表达为“你是谁？”。
- source_word: וַיֹּאמֶר אֵלָיו
  choice: 我回答他
  rationale: 马所拉文本的动词形式字面为“他就说”，但介词后缀 אֵלָיו 是“对他”，且叙事语境要求亚玛力人陈述自己对扫罗的回答，因此正文按语境译作“我回答他”，并以脚注保留原文形式。
- source_word: עֲמָלֵקִי אָנֹכִי
  choice: 我是亚玛力人
  rationale: 族称 עֲמָלֵקִי 表示“亚玛力人”；独立代词 אָנֹכִי 强调说话者的自我身份，汉语自然译为“我是亚玛力人”。
theological_decisions: []
