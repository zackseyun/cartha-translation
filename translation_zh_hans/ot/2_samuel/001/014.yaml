id: 2SA.1.14
reference: 2 Samuel 1:14
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר אֵלָ֖י/ו דָּוִ֑ד אֵ֚יךְ לֹ֣א יָרֵ֔אתָ לִ/שְׁלֹ֨חַ֙ יָֽדְ/ךָ֔ לְ/שַׁחֵ֖ת אֶת מְשִׁ֥יחַ יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/014.yaml
  text: Then David said to him[b][a], “How were you not afraid to put out your hand to destroy Yahweh’s anointed?”
translation:
  language: zh_hans
  text: 大卫对他说：“你怎么竟不惧怕[a]伸手杀害雅威的受膏者[b]呢？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你为什么不惧怕……？”希伯来文直译是“你怎么不惧怕……？”，表达震惊和责备。
    reason: lexical_alternative
  - marker: b
    text: “受膏者”在这里指由雅威膏立为王的人，即扫罗。
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 承接前文推进叙事；汉语语境已自然表达先后关系，无须机械译出连接词。
- source_word: אֵלָיו
  choice: 对他说
  rationale: 准确表达介词短语所指，即大卫对那名亚玛力报信者说话。
- source_word: אֵיךְ לֹא יָרֵאתָ
  choice: 你怎么竟不惧怕
  rationale: אֵיךְ本义为“怎么”，在此表达震惊和责备；“竟”使这种反诘语气在现代汉语中自然显明，同时不改译为更具解释性的“为什么”。
- source_word: לִשְׁלֹחַ יָדְךָ
  choice: 伸手
  rationale: 保留希伯来语“伸出你的手”的身体意象，同时在汉语中可自然表示出手加害。
- source_word: לְשַׁחֵת
  choice: 杀害
  rationale: 该词基本义域包括毁坏、除灭；此处所指是夺取扫罗的性命，“杀害”比泛称“毁灭”更符合具体语境，且保留负面评价。
- source_word: מְשִׁיחַ
  choice: 受膏者
  rationale: 指蒙神膏立为王的扫罗；“受膏者”保留礼仪和君王身份含义，又不在此直接译成后来专称性的“弥赛亚”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，而不以“主”这一称号替代。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用以色列上帝的专名；“雅威”按其较可能的读音音译，保留专名性质。
- issue: מְשִׁיחַ用于扫罗时的含义
  choice: 受膏者
  alternative: 弥赛亚；受膏的王
  rationale: 这里首先指扫罗因受膏而拥有的君王身份；“受膏者”既保留原词，也避免把后期弥赛亚称号的全部含义预先带入本节。
- issue: לְשַׁחֵת在此处的具体程度
  choice: 杀害
  alternative: 毁灭；除灭
  rationale: 上下文是报信者声称亲手结束扫罗的生命，因此用具体的“杀害”；这仍传达שׁחת在此语境中的毁灭性行动。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“怎么竟不惧怕”保留原文反诘中的震惊责备；“伸手杀害”既保留希伯来语意象，也让普通读者清楚理解行动的性质。
