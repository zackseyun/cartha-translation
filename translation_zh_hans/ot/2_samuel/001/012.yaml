  text: וַֽ/יִּסְפְּדוּ֙ וַ/יִּבְכּ֔וּ וַ/יָּצֻ֖מוּ עַד הָ/עָ֑רֶב עַל שָׁא֞וּל וְ/עַל יְהוֹנָתָ֣ן בְּנ֗/וֹ וְ/עַל עַ֤ם יְהוָה֙ וְ/עַל בֵּ֣ית יִשְׂרָאֵ֔ל כִּ֥י נָפְל֖וּ בֶּ/חָֽרֶב־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/012.yaml
  text: They mourned[a], wept, and fasted until evening for Saul, for Jonathan his son, for the people of Yahweh, and for the house of Israel[b], because they had fallen by the sword.
translation:
  language: zh_hans
  text: 他们为扫罗和他儿子约拿单，为雅威的子民和以色列家哀悼、哭泣、禁食，直到晚上，因为他们都倒在刀剑之下。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְפְּדוּ
  choice: 哀悼
  rationale: ספד指为死者举哀、哀悼；“哀悼”既自然庄重，也不额外限定为出声哀号。
- source_word: וַיִּבְכּוּ
  choice: 哭泣
  rationale: בכה直接表示哭泣；与前面的“哀悼”区分，保留原文连续列出的不同举哀行为。
- source_word: וַיָּצֻמוּ
  choice: 禁食
  rationale: צום表示停止进食，常作为哀恸或敬虔的行动；“禁食”是现代中文中准确而通行的译法。
- source_word: עַד הָעָרֶב
  choice: 直到晚上
  rationale: 准确表达这些举哀行为持续到傍晚这一时间终点，中文自然。
- source_word: עַל
  choice: 为
  rationale: 这里反复出现的עַל引出哀悼的对象；中文用“为”最简洁自然。
- source_word: יְהוֹנָתָן בְּנוֹ
  choice: 他儿子约拿单
  rationale: 保留原文对约拿单是扫罗之子的明确说明，并按现代中文习惯调整语序。
- source_word: עַם יְהוָה
  choice: 雅威的子民
  rationale: עַם是“民、百姓”；在与神的所属关系中译作“子民”自然，并保留其群体及盟约色彩。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代中文常用音译呈现四字神名，保留其作为专有名字的性质，不以称号替代。
- source_word: בֵּית יִשְׂרָאֵל
  choice: 以色列家
  rationale: 保留希伯来语常见的集体称谓及其整体性，不简化为单独的“以色列”。
- source_word: כִּי
  choice: 因为
  rationale: כִּי在此说明哀悼的原因；“因为”清楚表达因果关系。
- source_word: נָפְלוּ
  choice: 倒下
  rationale: נפל本义为“倒下”；在战争语境中委婉指阵亡。译文采用“倒在刀剑之下”，保留原文意象而不直接改写为“死去”。
- source_word: בֶּחָרֶב
  choice: 在刀剑之下
  rationale: 保留原文“刀剑”的具体战争意象；“倒在刀剑之下”在中文中自然表达被刀剑杀死。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文使用以色列神的专名，而非普通称号；“雅威”较直接地按学界普遍接受的读音音译，避免用“主”消除专名性质。
- issue: עַם יְהוָה的关系含义
  choice: 雅威的子民
  alternative: 雅威的百姓
  rationale: “子民”自然表达这个群体属于雅威，并保留可能具有的盟约意味，但不进一步加入原文没有明说的神学解释。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。保留“以色列家”和“倒在刀剑之下”等重要希伯来意象，同时以自然中文组织并列成分；不添加原文未有的解释性内容。
