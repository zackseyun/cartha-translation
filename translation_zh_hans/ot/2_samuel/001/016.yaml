source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֵלָי/ו֙ דָּוִ֔ד דמי/ך עַל רֹאשֶׁ֑/ךָ כִּ֣י פִ֗י/ךָ עָנָ֤ה בְ/ךָ֙ לֵ/אמֹ֔ר אָנֹכִ֥י מֹתַ֖תִּי אֶת מְשִׁ֥יחַ יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/016.yaml
  text: Then David said to him[a], “Your blood is on your own head, for your own mouth has testified against you, saying[b], ‘I myself killed Yahweh’s anointed.’”
translation:
  language: zh_hans
  text: 大卫对他说：“你的血归到你自己头上[a]，因为你亲口作证控告了自己[b]，说：‘是我杀了雅威的受膏者。’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可意译为“你丧命，责任在你自己”。这是希伯来语的惯用说法，表示他本人应为自己的死亡负责。
    reason: lexical_alternative
  - marker: b
    text: 较直译为“你的口作证控告了你”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלָיו דָּוִד
  choice: 大卫对他说
  rationale: 顺承叙事次序，以自然的现代汉语表达；אֵלָיו明确译为“对他说”。
- source_word: דָּמֶיךָ עַל רֹאשֶׁךָ
  choice: 你的血归到你自己头上
  rationale: 保留希伯来语司法性惯用语的“血”和“头”意象，表示他应为自己的死亡负责；“自己”使其反身含义在汉语中更清楚。
- source_word: כִּי
  choice: 因为
  rationale: 引出大卫作出判决的理由，符合此处的因果关系。
- source_word: פִּיךָ עָנָה בְךָ
  choice: 你亲口作证控告了自己
  rationale: ענה ב在法律语境中表示作证指控；“亲口”既自然，也保留פִּיךָ所强调的自证其罪。
- source_word: לֵאמֹר
  choice: 说
  rationale: 自然引出证词的具体内容。
- source_word: אָנֹכִי
  choice: 是我
  rationale: 独立代词带有强调意味；汉语用“是我”突出说话者本人。
- source_word: מֹתַתִּי
  choice: 杀了
  rationale: 该动词表示使人死亡；“杀了”直接、自然，并符合此处供认杀人的语境。
- source_word: מְשִׁיחַ יְהוָה
  choice: 雅威的受膏者
  rationale: מְשִׁיחַ在此指受膏立为王的扫罗，译作“受膏者”可保留其王权称号的含义，而不把后来的专名化含义带入本段。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以“雅威”音译四字神名，保留其作为以色列之上帝的专名，而不以称号替代。
theological_decisions:
- issue: 四字神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用神的专名；“雅威”较贴近学界通常采用的发音重构，并与称号“主”区别开来。
- issue: 王权语境中מְשִׁיחַ的译法
  choice: 受膏者
  alternative: 弥赛亚
  rationale: 这里具体指受膏为王的扫罗。“受膏者”保留原词含义，也避免把后期专名化及基督论含义预先带入叙事。
- issue: “血归到头上”的责任含义
  choice: 保留原文意象，并由脚注说明死亡责任
  alternative: 你丧命是你自己的责任
  rationale: 原文采用司法性惯用语，既宣告死亡，也归定责任；正文保留其鲜明意象，脚注帮助现代读者理解。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。保留“血归到头上”的希伯来语司法意象，以脚注解释；“亲口作证控告了自己”则用自然汉语传达自证其罪的法庭意味。
