base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/022.yaml
  text: From the blood of the slain[a], from the fat of the mighty, Jonathan’s bow did not turn back[b], and Saul’s sword did not return empty.
translation:
  language: zh_hans
  text: 从被杀者的血，从勇士的脂油[a]，约拿单的弓未曾退后[b]；扫罗的剑也未曾空空而回。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “脂油”也可指最肥美或最精华的部分；此处加强战场杀伤的意象。
    reason: lexical_alternative
  - marker: b
    text: “退后”也可译作“转回”。希伯来语动词可表示撤回或向后退。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִדַּם חֲלָלִים
  choice: 从被杀者的血
  rationale: 保留介词 מִן 所表达的来源或离开之意，以及战场诗歌中“血”的鲜明意象；חֲלָלִים 在此指战死或被杀的人。
- source_word: מֵחֵלֶב גִּבּוֹרִים
  choice: 从勇士的脂油
  rationale: חֵלֶב 的本义是“脂油”，在诗歌中也可能暗示肥美、精华之处；正文保留具体而强烈的身体意象，不直接释作“精华”。גִּבּוֹרִים 译作“勇士”，符合战争语境。
- source_word: קֶשֶׁת יְהוֹנָתָן
  choice: 约拿单的弓
  rationale: 以现代汉语自然的领属结构表达希伯来语构词关系，同时保持诗句简洁。
- source_word: לֹא נָשׂוֹג אָחוֹר
  choice: 没有退后
  rationale: נסוג 与 אָחוֹר 合用表示后退、退缩；“没有退后”既保留弓的拟人化，也不额外说明其具体作战方式。
- source_word: וְחֶרֶב שָׁאוּל
  choice: 扫罗的刀
  rationale: 与“约拿单的弓”形成平行；“刀”简洁地对应 חֶרֶב，并保持挽歌的凝练语体。
- source_word: לֹא תָשׁוּב רֵיקָם
  choice: 没有空空而回
  rationale: 保留“返回时并非空无所得”的希伯来语习语和刀的拟人化，含蓄表达它在战场上并非无功。
theological_decisions: []
translation_notes:
  register: 采用庄重而易懂的现代汉语，保留原文两组兵器意象及其平行结构。开头两个“从……”略带诗性陌生感，以保存希伯来诗句的前置结构和“离开、避开”的语义张力；没有把血与脂油解释成明确的因果关系。
