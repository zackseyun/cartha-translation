base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/007.yaml
  text: He turned around and saw me[a], and he called to me, and I said, “Here I am.”
translation:
  language: zh_hans
  text: 他转身向后看，看到我[a]，就呼唤我。我说：“我在这里。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“他转向他身后”。这里的意思是他转身往后看。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפֶן אַחֲרָיו
  choice: 他转身向后看
  rationale: פנה 表示转身，אַחֲרָיו 字面为“在他后面/向他身后”。合译为“转身向后看”，既保留空间方向，也符合现代汉语表达。
- source_word: וַיִּרְאֵנִי
  choice: 看到我
  rationale: ראה 加第一人称单数宾语后缀，直接表示“看到我”。
- source_word: וַיִּקְרָא אֵלָי
  choice: 就呼唤我
  rationale: קרא 与 אֶל 连用表示向某人呼叫；“呼唤我”自然且不加入“召见”等较强含义。
- source_word: וָאֹמַר
  choice: 我说
  rationale: אמר 的基本义是“说”；虽可按对话语境译作“回答”，正文保留较直接的表达。
- source_word: הִנֵּנִי
  choice: 我在这里
  rationale: 这是回应呼唤、自我呈现的惯用语；“我在这里”准确保留其字面意义和庄重语感。
theological_decisions: []
