base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/004.yaml
  text: David said to him[a], “What happened? Please tell me.” He said, “The people fled from the battle, and many of the people also fell and died[c][b]; and Saul and Jonathan his son are also dead.”
translation:
  language: zh_hans
  text: 大卫问他：“情况怎样[a]？请告诉我。”他回答：“百姓从战场上逃跑了，百姓中也有许多人倒下身亡[b]；扫罗和他儿子约拿单也死了[c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“发生了什么事？”原文直译近于“事情怎样了？”
    reason: lexical_alternative
  - marker: b
    text: “倒下”是希伯来语常见的战争用语，指被击倒或阵亡；后面的“身亡”明确说明了结果。
    reason: lexical_alternative
  - marker: c
    text: 或译：“扫罗和他儿子约拿单也都死了。”
    reason: lexical_alternative
lexical_decisions:
- source_word: מֶה הָיָה הַדָּבָר
  choice: 情况怎样？
  rationale: 原文直译近于“事情怎样了？”这里是大卫询问战事结果。“情况怎样？”符合现代汉语表达，也保留了问题所涵盖的整体事态。
- source_word: הַגֶּד נָא לִי
  choice: 请告诉我
  rationale: הַגֶּד是“告诉、报告”的命令式，נָא使语气带有请求或催促意味；译作“请告诉我”自然清楚。
- source_word: אֲשֶׁר נָס הָעָם מִן הַמִּלְחָמָה
  choice: 百姓从战场上逃跑了
  rationale: נָס明确表示“逃跑”；הָעָם在此指参战的以色列民众或军队。译作“百姓”保留原词的一般性，不窄化为专门的军事术语。
- source_word: וְגַם הַרְבֵּה נָפַל מִן הָעָם וַיָּמֻתוּ
  choice: 百姓中也有许多人倒下身亡
  rationale: נָפַל在战争语境中指“倒下、阵亡”，随后וַיָּמֻתוּ又明确说“死了”。“倒下身亡”既保留两个动词的递进，也符合自然汉语，避免生硬重复。
- source_word: וְגַם שָׁאוּל וִיהוֹנָתָן בְּנוֹ מֵתוּ
  choice: 扫罗和他儿子约拿单也死了
  rationale: 保留וְגַם的“也”和בְּנוֹ“他儿子”的明确关系；מֵתוּ按叙事报告译为“死了”，直接传达战报中的结论。
