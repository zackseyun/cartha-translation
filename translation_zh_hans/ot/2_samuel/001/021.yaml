source:
  edition: WLC
  text: הָרֵ֣י בַ/גִּלְבֹּ֗עַ אַל טַ֧ל וְ/אַל מָטָ֛ר עֲלֵי/כֶ֖ם וּ/שְׂדֵ֣י תְרוּמֹ֑ת כִּ֣י שָׁ֤ם נִגְעַל֙ מָגֵ֣ן גִּבּוֹרִ֔ים מָגֵ֣ן שָׁא֔וּל בְּלִ֖י מָשִׁ֥יחַ בַּ/שָּֽׁמֶן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/021.yaml
  text: Mountains of Gilboa[a], let there be no dew or rain upon you, nor fields of offerings; for there the shield of the mighty was defiled, the shield of Saul[b], not anointed with oil.
translation:
  language: zh_hans
  text: 基利波的群山啊[a]，愿你们没有露水和雨水，也没有出产供物的田地；因为勇士的盾牌在那里被玷污了——扫罗的盾牌[b]，没有用油涂抹。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “出产供物的田地”原文含义不确定，也可理解为“肥沃的田地”“出产初熟果实的田地”或“出产举祭供物的田地”。这里的希伯来词常指分别出来献给上帝的供物。
    reason: lexical_alternative
  - marker: b
    text: 本句末尾也可较直译为“扫罗的盾牌，未用油涂抹”。这很可能是说盾牌没有像备战时那样涂油保养；“被玷污”也可译为“被弃置”或“令人厌弃”。
    reason: cultural_and_lexical_note
lexical_decisions:
- source_word: הָרֵי בַגִּלְבֹּעַ
  choice: 基利波的群山哪
  rationale: 这是对基利波山地的直接呼告；“群山”体现复数，“哪”自然传达哀歌中的呼语语气。
- source_word: אַל טַל וְאַל מָטָר עֲלֵיכֶם
  choice: 愿你们那里没有露水，没有雨水
  rationale: 用“愿……没有”表达 אַל 的诅咒式愿望，并保留对群山的第二人称称呼。
- source_word: וּשְׂדֵי תְרוּמוֹת
  choice: 也没有出产供物的田地
  rationale: 原文短语含义困难。תְרוּמוֹת 常指分别出来献给上帝的供物；“出产供物的田地”使中文可懂，同时保留其礼仪性含义，不直接定为“肥沃田地”或“初熟果实的田地”。
- source_word: כִּי שָׁם
  choice: 因为……在那里
  rationale: 自然引出前述愿望的缘由，并保留地点强调。
- source_word: נִגְעַל
  choice: 蒙了污辱
  rationale: 该词可表达被玷污、被厌弃或遭弃置；战败哀歌的语境突出盾牌受辱。“蒙了污辱”保留羞辱与污损的双重色彩，也避免把具体状态说得过死。
- source_word: מָגֵן גִּבּוֹרִים
  choice: 勇士的盾牌
  rationale: גִּבּוֹרִים 在战争语境中宜译为“勇士”；措辞凝练，符合哀歌文体。
- source_word: מָגֵן שָׁאוּל
  choice: 扫罗的盾牌
  rationale: 保留原文由泛指“勇士的盾牌”转到特指“扫罗的盾牌”的同位重复与诗歌推进。
- source_word: בְּלִי מָשִׁיחַ בַּשָּׁמֶן
  choice: 不再用油膏抹
  rationale: 最自然地指盾牌未再以油涂抹；“不再”按战败后盾牌废置的语境传达其诗意，但原文直译仅为“不用油膏抹”，故在脚注说明。
theological_decisions:
- issue: מָשִׁיחַ 是否在此表示“受膏者”这一王权或弥赛亚称号
  choice: 按普通动作含义译为盾牌“用油膏抹”
  alternative: 理解为扫罗是“受膏者”，或译作“不是那用油所膏之人的盾牌”
  rationale: 该词与“用油”紧密相连，句法和战争器具的背景更支持给盾牌涂油的动作。这样既不引入弥赛亚含义，也不否认扫罗在别处被称为耶和华的受膏者。
- issue: נִגְעַל 的具体语义
  choice: 蒙了污辱
  alternative: 被玷污／被丢弃／令人厌弃
  rationale: 希伯来词在此可能兼有污损、弃置和受辱意味；正文采用较能涵盖战败羞辱的表达，并在脚注保留其他可能。
translation_notes:
  register: 采用庄重而易懂的现代书面普通话，保留哀歌的直接呼告、诅咒式愿望和两次“盾牌”的诗性重复。以破折号呈现同位说明。对两个主要难点 וּשְׂדֵי תְרוּמוֹת 与 נִגְעַל／בְּלִי מָשִׁיחַ בַּשָּׁמֶן 不作过度确定化处理，并以脚注保存歧义。
