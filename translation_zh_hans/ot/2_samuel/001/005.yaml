base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/005.yaml
  text: Then David said to the young man who told him, “How do you know that Saul and Jonathan his son are dead?”
translation:
  language: zh_hans
  text: 大卫问那向他报信的年轻人：“你怎么知道扫罗和他儿子约拿单死了？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 问
  rationale: 该动词本义为“说”，但其后直接引出疑问句；现代汉语用“问”自然准确地表达此言语行为，同时保留叙事推进。
- source_word: הַנַּעַר
  choice: 年轻人
  rationale: נַעַר可指少年、青年或侍从；本处人物能报告战场情况，译作“年轻人”最稳妥，不额外设定其身份。
- source_word: הַמַּגִּיד לוֹ
  choice: 那向他报信的
  rationale: 分词在此修饰“年轻人”，指明他是向大卫传递消息的人；“报信”符合上下文，也比笼统的“告诉”更自然。
- source_word: אֵיךְ יָדַעְתָּ
  choice: 你怎么知道
  rationale: אֵיךְ询问得知的根据或途径；完成式יָדַעְתָּ在汉语中自然表达为当前知识状态“知道”。
- source_word: כִּי
  choice: （由宾语从句直接表达）
  rationale: כִּי引出“知道”的内容。现代汉语无需强行加入“即”或“这件事”，直接接从句即可。
- source_word: מֵת
  choice: 死了
  rationale: 虽然希伯来语谓语为阳性单数，但主语包括扫罗和约拿单；汉语“死了”不标数，既忠实又自然，并表达死亡已经发生。
- source_word: בְּנוֹ
  choice: 他儿子
  rationale: 代词后缀指向扫罗，明确约拿单是扫罗的儿子；汉语中无需加入“自己的”。
- source_word: שָׁאוּל וִיהוֹנָתָן
  choice: 扫罗和约拿单
  rationale: 采用现代中文圣经人名的通行译法。
theological_decisions: []
