base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/009.yaml
  text: And he said to me[a], ‘Please stand over me and put me to death, for anguish has seized me[b], though my life is still in me.’
translation:
  language: zh_hans
  text: 他对我说：“请站在我上方，杀死我吧！因为剧痛攫住了我[a]，虽然我还活着[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“抽筋（或痉挛）攫住了我”。这里的希伯来词十分罕见，确切含义不能确定。
    reason: lexical_alternative
  - marker: b
    text: 直译：“因为我的全部生命仍在我里面。”
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲמָד נָא עָלַי
  choice: 请站到我身旁
  rationale: עָמַד意为“站立”，与עַל连用在此表示来到倒地或负伤者近旁、居高站着；“请”体现祈求语气词נָא。中文用“站到我身旁”自然表达其处境，同时不额外增添动作。
- source_word: וּמֹתְתֵנִי
  choice: 杀死我吧
  rationale: 这是מות的使役形式，直接表示“使我死亡”。“杀死我”清楚而庄重；句末“吧”与前面的נָא共同传达恳求语气。
- source_word: אֲחָזַנִי
  choice: 攫住了我
  rationale: אָחַז的基本义是“抓住、攫住”，在这里表现某种痛苦或病症突然控制了说话者。
- source_word: הַשָּׁבָץ
  choice: 剧痛
  rationale: 该词罕见，确切含义不明，可能指剧痛、抽筋或痉挛。“剧痛”避免在正文中过度限定具体生理症状，并以脚注保留其他可能。
- source_word: כִּי כָל עוֹד נַפְשִׁי בִּי
  choice: 尽管我还有气息
  rationale: נֶפֶשׁ在此指生命或活气，而非技术意义上的“灵魂”。第二个כִּי字面可作“因为”，但按语境表达让步关系：他虽受致命伤，却仍未断气。
theological_decisions:
- issue: נֶפֶשׁ是否译作“灵魂”
  choice: 气息
  alternative: 生命／灵魂
  rationale: 上下文关注扫罗尚未死亡的身体状态；译作“气息”既符合נֶפֶשׁ的生命义，也避免把经文变成关于灵魂构成的教义陈述。
- issue: 第二个כִּי的逻辑关系
  choice: 尽管
  alternative: 因为
  rationale: כִּי通常可表示原因，但本句若机械译作“因为”，中文逻辑较晦涩。结合语境，其内容与前句构成让步张力；脚注保留字面结构。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。直接引语保留战场上的紧迫感；对罕见词הַשָּׁבָץ不作过度具体化，并通过脚注呈现词义不确定性。
