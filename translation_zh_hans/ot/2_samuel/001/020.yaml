  text: אַל תַּגִּ֣ידוּ בְ/גַ֔ת אַֽל תְּבַשְּׂר֖וּ בְּ/חוּצֹ֣ת אַשְׁקְל֑וֹן פֶּן תִּשְׂמַ֨חְנָה֙ בְּנ֣וֹת פְּלִשְׁתִּ֔ים פֶּֽן תַּעֲלֹ֖זְנָה בְּנ֥וֹת הָ/עֲרֵלִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/020.yaml
  text: Do not tell it in Gath[a]; do not proclaim the news in the streets of Ashkelon, lest the daughters of the Philistines rejoice[b], lest the daughters of the uncircumcised exult.
translation:
  language: zh_hans
  text: '不要在迦特传说[a]，

    不要在亚实基伦的街上报信；

    免得非利士人的女子欢喜，

    免得未受割礼之人的女子雀跃[b]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “传说”也可译作“告诉”或“报告”。原文未明说所传的内容，按上下文指扫罗和约拿单阵亡的消息。
    reason: lexical_alternative
  - marker: b
    text: “未受割礼之人”是原文对非利士人的盟约性贬称；直译也可作“未受割礼者的女子”。
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּגִּידוּ
  choice: 传扬
  rationale: 源自动词 נגד，意为“告诉、报告、宣告”。这里没有明说宾语，中文用“传扬”可自然承接上文扫罗和约拿单阵亡的消息，并与下一行“报信”构成诗歌平行。
- source_word: בְגַת
  choice: 在迦特
  rationale: 介词 בְּ 表地点；“迦特”采用现代中文圣经传统中通行的地名译法。
- source_word: תְּבַשְּׂרוּ
  choice: 报信
  rationale: בשר 的 piel 形式表示“带来、宣告消息”。“报信”简洁自然，也保留消息被公开传开的含义。
- source_word: בְּחוּצֹת אַשְׁקְלוֹן
  choice: 在亚实基伦的街上
  rationale: חוּצוֹת 可指城中的街道或广场等公共空间；“街上”符合此处公开传报消息的场景，并保留复数所表达的广泛公共范围。
- source_word: פֶּן
  choice: 免得
  rationale: 引出所要避免的结果或目的；重复译作“免得”，保留希伯来诗句的平行结构。
- source_word: תִּשְׂמַחְנָה
  choice: 欢喜
  rationale: שמח 表示喜乐、高兴；“欢喜”自然、庄重，适合哀歌语体。
- source_word: בְּנוֹת פְּלִשְׁתִּים
  choice: 非利士人的女子
  rationale: 直译“非利士人的女儿们”。此处泛指非利士妇女；译作“女子”既保留原文意象，又比机械直译“女儿们”更符合现代汉语。
- source_word: תַּעֲלֹזְנָה
  choice: 雀跃
  rationale: עלז 表示兴高采烈、欢腾，比前句 שמח 语气更强。“雀跃”保留了平行句中的递进，同时适合诗歌表达。
- source_word: בְּנוֹת הָעֲרֵלִים
  choice: 未受割礼之人的女子
  rationale: עֲרֵלִים 字面意为“未受割礼的人”，在此是针对非利士人的族群—盟约性贬称。采用字面而可懂的译法，不将其泛化为“异教徒”或“不洁的人”。
theological_decisions:
- issue: 盟约性贬称 עֲרֵלִים 的译法
  choice: 未受割礼之人
  alternative: 异教徒／不洁的人
  rationale: 原词明确涉及割礼及其所标示的盟约身份。直译能保留原文的神学背景和修辞锋芒，又不额外导入较宽泛的宗教或礼仪判断。
translation_notes:
  register: 采用现代、庄重而可朗读的哀歌语体；以重复的“不要……不要……免得……免得……”保存希伯来诗歌的平行结构。地名采用通行译名。正文中的所有脚注标记均与脚注对应。
