  text: צַר לִ֣/י עָלֶ֗י/ךָ אָחִ/י֙ יְה֣וֹנָתָ֔ן נָעַ֥מְתָּ לִּ֖/י מְאֹ֑ד נִפְלְאַ֤תָה אַהֲבָֽתְ/ךָ֙ לִ֔/י מֵ/אַהֲבַ֖ת נָשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/026.yaml
  text: I am distressed over you[a], my brother Jonathan; you were very pleasant to me. Your love to me was wonderful, surpassing the love of women.
translation:
  language: zh_hans
  text: 我为你悲痛，我的兄弟约拿单！你使我极其欢悦。你对我的爱何等奇妙，胜过女人的爱。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“胜过妇女的爱”或“胜过对女人的爱”。希伯来文的诗性比较没有明确说明比较的具体方面，也没有界定这种爱的性质。
    reason: 保留“爱／女人”构造短语在汉语与希伯来文中可产生的指向歧义，避免将其定性为浪漫、性或仅属友谊的爱。
lexical_decisions:
- source_word: צַר לִי עָלֶיךָ
  choice: 我为你悲痛
  rationale: צַר לִי 表达切身的痛苦、悲伤；עָלֶיךָ 在哀歌语境中指因约拿单之死而为他悲痛。“我为你悲痛”自然凝练，并保留哀悼语气。
- source_word: אָחִי יְהוֹנָתָן
  choice: 我的兄弟约拿单
  rationale: אָחִי 直译为“我的兄弟”，既保留原文的亲密称呼，也不擅自把关系限定为现代意义上的“朋友”或其他类别；人名采用简体中文圣经通行译名“约拿单”。
- source_word: נָעַמְתָּ לִּי מְאֹד
  choice: 你令我十分喜悦
  rationale: נעם 表示令人愉悦、可喜或美好；“令我十分喜悦”在现代汉语中自然，并以“十分”直接体现 מְאֹד 的加强语气，同时避免“可爱”可能带来的现代狭义联想。
- source_word: נִפְלְאָתָה אַהֲבָתְךָ לִי
  choice: 你对我的爱何等奇妙
  rationale: נִפְלְאָתָה 描写超凡、奇妙或非同寻常；以感叹式“何等奇妙”呈现哀歌的诗性与赞叹。לִי 译作“对我”，明确爱的指向而不增加其性质。
- source_word: מֵאַהֲבַת נָשִׁים
  choice: 胜过女人的爱情
  rationale: מִן 表示比较，译为“胜过”；“女人的爱情”尽量保留构造短语 אַהֲבַת נָשִׁים 的概括性及其诗意歧义，不在正文中断定是女人所给予的爱，还是对女人的爱。
theological_decisions:
- issue: 大卫将约拿单的爱与“女人的爱情”相比，其具体性质如何理解
  choice: 正文保留“胜过女人的爱情”这一未加限定的比较
  alternative: 明确译为“胜过女人所给予的爱”或“胜过对女人的爱”
  rationale: 希伯来文赞叹约拿单的爱超越“女人的爱情”，但没有明说比较所涉及的是爱的给予者、对象，还是某种现代关系类别。译文不把它预先解释为性、浪漫或纯友谊性质，以保留原文的诗意张力。
translation_notes:
  register: 采用现代、庄重而易懂的哀歌语体。以短句和感叹句保留原文的情感力度；“兄弟”“奇妙”“胜过”等措辞贴近原文，同时避免古奥表达及现代关系分类。脚注标记置于实际存在歧义的比较短语之后。
