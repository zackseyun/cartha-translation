base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/001.yaml
  text: After the death of Saul[a], when David had returned from striking down the Amalekites, David stayed in Ziklag two days.
translation:
  language: zh_hans
  text: 扫罗死后，大卫从击杀亚玛力人[a]归来，在洗革拉停留了两天。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文作“亚玛力”，是对亚玛力人的集合称呼。
    reason: 说明希伯来文单数族名在正文中译为复数性族群称谓；标记置于“亚玛力人”后，以准确对应所说明的词。
lexical_decisions:
- source_word: וַיְהִי
  choice: 不单独译出
  rationale: 这是希伯来叙事中承接上下文、引入场景的常用形式；现代汉语可直接从时间短语起句，无须生硬译作“事情发生了”或另加“现在”。
- source_word: אַחֲרֵי מוֹת שָׁאוּל
  choice: 扫罗死后
  rationale: 自然、凝练地保留原文“在扫罗死亡之后”的时间框架。
- source_word: וְדָוִד שָׁב מֵהַכּוֹת
  choice: 大卫击败……归来
  rationale: שָׁב 表示返回，מֵהַכּוֹת 表明他从军事打击行动中归来。“击败……归来”既符合汉语表达，也保留 נכה 所含的军事暴力和得胜语义，而不夸大为彻底歼灭。
- source_word: אֶת הָעֲמָלֵק
  choice: 亚玛力人
  rationale: 原文用单数族名“亚玛力”集合性地指亚玛力族人；正文采用现代汉语较清楚的“亚玛力人”。
- source_word: וַיֵּשֶׁב
  choice: 住了
  rationale: 这里仅有两天，表示短期停留；“住了”比“居住”自然，也不暗示长期定居。
- source_word: בְּצִקְלָג
  choice: 在洗革拉
  rationale: 采用该地名在中文圣经传统中的通行音译，并保留地点介词。
- source_word: יָמִים שְׁנָיִם
  choice: 两天
  rationale: 直接表达原文的时段，配合“住了”构成自然的现代汉语。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而清楚的叙事语体。句序依照汉语习惯压缩为“时间—背景行动—主要行动”，不另添原文没有的“现在”。
