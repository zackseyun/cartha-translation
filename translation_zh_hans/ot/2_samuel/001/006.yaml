base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/006.yaml
  text: And the young man who told him said[a], “I happened to be on Mount Gilboa, and behold, Saul was leaning on his spear, and behold[c][b], the chariots and the horsemen were closing in on him.”
translation:
  language: zh_hans
  text: 那向他报信的年轻人说：“我碰巧在基利波山上，只见扫罗倚在自己的矛上；又见战车和骑兵正逼近他。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “正逼近他”也可译作“已经追上他”或“正在紧追他”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנַּעַר הַמַּגִּיד לוֹ
  choice: 那向他报信的年轻人
  rationale: הַנַּעַר在此指报信的青年男子；“年轻人”自然且不暗示仆役身份。分词短语הַמַּגִּיד לוֹ用“向他报信的”表达其修饰作用和叙事情境。
- source_word: נִקְרֹא נִקְרֵיתִי
  choice: 我碰巧到了
  rationale: 不定式绝对形与限定动词并用，加强偶然发生之意；“碰巧到了”既表达偶然性，也自然衔接地点。
- source_word: בְּהַר הַגִּלְבֹּעַ
  choice: 基利波山
  rationale: הַר加专名通常指具体山岳；“基利波山”是清楚自然的地名表达。地点关系已由“到了”体现。
- source_word: וְהִנֵּה
  choice: 只见／又见
  rationale: 两次הִנֵּה都引导说话者亲眼所见的鲜明场景；汉语叙事中的“只见／又见”比直译“看哪”更自然，同时保留其提示和强调作用。
- source_word: נִשְׁעָן עַל חֲנִיתוֹ
  choice: 倚在自己的矛上
  rationale: נִשְׁעָן表示以某物支撑身体；“倚在……上”直接传达这一姿态。反身领属用“自己的”可明确所指。
- source_word: הָרֶכֶב וּבַעֲלֵי הַפָּרָשִׁים
  choice: 战车和骑兵
  rationale: הָרֶכֶב可作集合名词指战车部队；בַעֲלֵי הַפָּרָשִׁים字面与骑乘者有关，在军事语境中以“骑兵”最简明自然。
- source_word: הִדְבִּקֻהוּ
  choice: 正逼近他
  rationale: דבק的使役形在此可指追上、赶上或紧紧追逼；“正逼近”保留过程感，不武断判定已经追上。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而清楚的叙事语体。“只见／又见”保留希伯来文两次הִנֵּה的现场感；避免过度古雅。脚注保留הִדְבִּקֻהוּ在“追逼”与“追上”之间的语义张力。
