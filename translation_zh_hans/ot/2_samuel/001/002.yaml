base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/002.yaml
  text: On the third day[a], behold, a man came from the camp, from Saul, with his clothes torn and dirt on his head. And when he came to David[c][b], he fell to the ground and bowed down.
translation:
  language: zh_hans
  text: 第三天，看哪，有一个人从营中、从扫罗那边来[a]。他衣服撕裂，头上有尘土[b]。他来到大卫面前时，就倒在地上，俯伏行礼[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“从扫罗那里来”或“从扫罗身边来”。希伯来语表示他与扫罗一方有关联，不一定表示他是扫罗亲自差来的。
    reason: lexical_alternative
  - marker: b
    text: 直译“头上有土”；这是当时表示悲伤或哀悼的一种举动。
    reason: cultural_note
  - marker: c
    text: 也可译作“俯伏下拜”。这个希伯来词可按语境表示深切的尊敬、顺服或礼敬。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַּיּוֹם הַשְּׁלִישִׁי
  choice: 第三天
  rationale: 按希伯来叙事次序自然承接上文；וַיְהִי在此主要推进叙事，无须另加“事情发生了”等生硬套语。
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留原文引人注意、使场景鲜明呈现的指示语气。
- source_word: אִישׁ בָּא מִן־הַמַּחֲנֶה
  choice: 有一个人从营中……来
  rationale: 准确表达单数男性人物及其从军营而来的动作；“营”在上下文中自然理解为军营。
- source_word: מֵעִם שָׁאוּל
  choice: 从扫罗那边来
  rationale: מֵעִם表示与扫罗的关联或从扫罗所在一方而来；“那边”避免误解为扫罗亲自差派。
- source_word: וּבְגָדָיו קְרֻעִים
  choice: 他衣服撕裂
  rationale: 保留原文对衣服状态的直接描写，现代汉语简明自然。
- source_word: וַאֲדָמָה עַל־רֹאשׁוֹ
  choice: 头上蒙着土
  rationale: אֲדָמָה本义为土地、泥土；“蒙着土”既接近字面，也符合哀悼举动的场景。
- source_word: בְּבֹאוֹ אֶל־דָּוִד
  choice: 他来到大卫面前时
  rationale: 将介词בְּ加不定式结构自然译为时间从句；“面前”符合此处人物觐见的汉语表达。
- source_word: וַיִּפֹּל אַרְצָה
  choice: 就倒在地上
  rationale: 表达动词及方向词אַרְצָה所指向地面的动作，不额外解释其动机。
- source_word: וַיִּשְׁתָּחוּ
  choice: 俯伏行礼
  rationale: 该词可指俯身或伏地表示尊敬、顺服或敬意；此译法保留身体动作及礼敬含义，却不武断译成敬拜。
theological_decisions:
- issue: וַיִּשְׁתָּחוּ是否应译作宗教性的“敬拜”
  choice: 俯伏行礼
  alternative: 敬拜；下拜；俯伏在地
  rationale: 对象是大卫，语境首先支持向君王或上位者表示尊敬、臣服。原词本身可用于敬拜，也可用于世俗礼敬，因此正文不将其限定为宗教行为。
translation_notes:
  register: 采用现代、庄重而清楚的叙事文体。“看哪”略带经文语体，用来保留原文鲜明的现场提示；其余措辞避免古奥。“从扫罗那边来”保留关联范围的含混性，“俯伏行礼”则避免把世俗礼敬预先解释为宗教敬拜。
