- from: 又吩咐人教导犹大子孙《弓歌》。看哪，这歌写在《雅煞珥书》上：
  to: 又说要教犹大人学习《弓》。看哪，这篇写在《雅煞珥书》上：
  rationale: 修订删除未明示的“人”，将题名由《弓歌》收束为与原文一致的《弓》，并以“学习”使汉语句法自然。加入“这篇”是为使“写在……上”在汉语中有明确指代，指向题名所指的作品，不增加其具体体裁判断。
