  text: וַ/יֹּ֕אמֶר לְ/לַמֵּ֥ד בְּנֵֽי יְהוּדָ֖ה קָ֑שֶׁת הִנֵּ֥ה כְתוּבָ֖ה עַל סֵ֥פֶר הַ/יָּשָֽׁר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/018.yaml
  text: 'and said that the sons of Judah should be taught “The Bow.” Behold, it is written in the Book of Jashar:'
translation:
  language: zh_hans
  text: 又说要教犹大人学习《弓》。看哪，这篇写在《雅煞珥书》上：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 又吩咐
  rationale: 此处承接上一节，大卫不只是“说”，而是发出让人教导的指示；译作“吩咐”符合汉语语境。
- source_word: בְּנֵי יְהוּדָה
  choice: 犹大子孙
  rationale: 保留希伯来语“……之子”的群体称谓含义，指犹大支派的人。
- source_word: קָשֶׁת
  choice: 《弓歌》
  rationale: 原文直译为“弓”，在句法中很可能是随后哀歌的题名；加“歌”帮助现代读者理解其文体，同时以书名号标明题名。
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留原文提示读者注意的标记及庄重语气。
- source_word: סֵפֶר הַיָּשָׁר
  choice: 《雅煞珥书》
  rationale: 将专名音译，避免把含义不确定的古代书名直接释作“正直人之书”。
theological_decisions:
- issue: “弓”是题名还是教导射箭
  choice: 按哀歌题名处理，译作《弓歌》
  alternative: “教导犹大子孙使用弓”或“教导犹大子孙《弓》”
  rationale: 上下文紧接大卫为扫罗和约拿单所作的哀歌，且“写在《雅煞珥书》上”更自然地指一篇作品；但原词本身仅为“弓”，因此不作进一步神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言；保留“看哪”的经文提示语。以《弓歌》清楚传达题名功能，并保留原词“弓”的意象。
