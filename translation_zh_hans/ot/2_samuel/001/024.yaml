  text: בְּנוֹת֙ יִשְׂרָאֵ֔ל אֶל שָׁא֖וּל בְּכֶ֑ינָה הַ/מַּלְבִּֽשְׁ/כֶ֤ם שָׁנִי֙ עִם עֲדָנִ֔ים הַֽ/מַּעֲלֶה֙ עֲדִ֣י זָהָ֔ב עַ֖ל לְבוּשְׁ/כֶֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/024.yaml
  text: Daughters of Israel[a], weep over Saul, who clothed you in scarlet with luxuries[b], who put ornaments of gold on your clothing.
translation:
  language: zh_hans
  text: '以色列的女子啊，要为扫罗哀哭！

    他使你们穿上朱红衣裳，配以华美饰物[a]；

    他把金饰[b]加在你们的衣服上。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “华美饰物”也可译作“奢华之物”、“精美服饰”或“悦人之物”。
    reason: lexical_alternative
  - marker: b
    text: “金饰”也可译作“金首饰”或“黄金装饰”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנוֹת יִשְׂרָאֵל
  choice: 以色列的女子
  rationale: 保留希伯来语“以色列的女儿们”这一诗歌性称呼的基本意象，同时用现代汉语中较自然的“女子”表达复数群体。
- source_word: אֶל שָׁאוּל בְּכֶינָה
  choice: 要为扫罗哀哭
  rationale: 介词 אֶל 在哀悼语境中标明哀哭的对象；“哀哭”兼顾哭泣与作哀歌悼念的含义。
- source_word: הַמַּלְבִּשְׁכֶם
  choice: 他使你们穿上
  rationale: 带冠词的分词回指扫罗，表示他使这些女子穿戴华服；译成关系清楚的陈述句，以符合现代汉语。
- source_word: שָׁנִי
  choice: 朱红衣裳
  rationale: שָׁנִי 指朱红或绯红色的染料、布料；结合“穿上”，译作“朱红衣裳”最清楚。
- source_word: עִם עֲדָנִים
  choice: 配以华美饰物
  rationale: עֲדָנִים 在此可指精美、奢华或令人喜悦的物品，具体所指并不完全确定；正文采用贴合服饰语境的表达，并以脚注保留其他可能。
- source_word: הַמַּעֲלֶה
  choice: 他把……加在
  rationale: עלה 在此有放置、加在其上的使役含义；“加在”既反映方向性，也自然衔接衣服上的装饰。
- source_word: עֲדִי זָהָב
  choice: 金饰
  rationale: עֲדִי 是装饰品或首饰，与 זָהָב 构成“金的装饰”；“金饰”简洁、现代，并保留类别上的开放性。
- source_word: עַל לְבוּשְׁכֶן
  choice: 在你们的衣服上
  rationale: 直接表达介词 עַל 的位置关系和 לְבוּשׁ 的衣着含义。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而有挽歌节奏的汉语。以两句平行结构呈现扫罗带给以色列女子的华服与装饰；不把 עֲדָנִים 的不确定含义收窄为单一类别。脚注标记均置于相应词语之后。
