source:
  edition: WLC
  text: וָ/אֶעֱמֹ֤ד עָלָי/ו֙ וַ/אֲמֹ֣תְתֵ֔/הוּ כִּ֣י יָדַ֔עְתִּי כִּ֛י לֹ֥א יִֽחְיֶ֖ה אַחֲרֵ֣י נִפְל֑/וֹ וָ/אֶקַּ֞ח הַ/נֵּ֣זֶר אֲשֶׁ֣ר עַל רֹאשׁ֗/וֹ וְ/אֶצְעָדָה֙ אֲשֶׁ֣ר עַל זְרֹע֔/וֹ וָ/אֲבִיאֵ֥/ם אֶל אֲדֹנִ֖/י הֵֽנָּה׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/010.yaml
  text: So I stood over him and put him to death[a], because I knew that he would not live after he had fallen. Then I took the crown that was on his head and the armlet that was on his arm[b], and I brought them here to my lord.
translation:
  language: zh_hans
  text: 于是我站在他身旁，把他杀死了，因为我知道他倒下后必定活不成。随后，我取下他头上的王冠和臂上的臂环[a]，带到这里来呈给我主。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“手镯”。原文所指的是戴在手臂上的饰物。
    reason: lexical_alternative
  - marker: b
    text: 这是亚玛力人向大卫所作的陈述。关于先前记载的扫罗之死，参撒母耳记上31:4–5。
    reason: cross_reference
lexical_decisions:
- source_word: וָאֶעֱמֹד עָלָיו
  choice: 于是我站在他身旁
  rationale: עמד על 在此描述说话人站在倒地的扫罗旁边或近前的位置；“站在他身旁”自然清楚，也避免中文“站在他上面”造成踩在其身上的误解。
- source_word: וַאֲמֹתְתֵהוּ
  choice: 把他杀死了
  rationale: מות 的使役式明确表示使其死亡；“把他杀死了”直接保留亚玛力人声称自己杀死扫罗的内容。
- source_word: כִּי יָדַעְתִּי כִּי לֹא יִחְיֶה
  choice: 因为我知道……必不能活
  rationale: 第一个 כִּי 表原因，第二个引出所知道的内容；中文以“因为我知道……必不能活”自然体现两层关系。
- source_word: אַחֲרֵי נִפְלוֹ
  choice: 他倒下以后
  rationale: 该结构表达在其倒下之后；“倒下”保留 נפל 的基本意象，不额外断定倒下的具体原因或状态。
- source_word: הַנֵּזֶר
  choice: 王冠
  rationale: 此处指扫罗头上的王权饰物；“王冠”比“冠冕”更符合现代普通读者的表达，同时交代其王室性质。
- source_word: וְאֶצְעָדָה
  choice: 臂环
  rationale: 该饰物戴在 זְרוֹעַ（手臂）上；“臂环”比容易被理解为腕饰的“手镯”更准确。
- source_word: זְרֹעוֹ
  choice: 他的臂上
  rationale: זְרוֹעַ 通常指手臂；原文未要求缩窄为前臂。
- source_word: וָאֲבִיאֵם ... הֵנָּה
  choice: 带到这里来献给
  rationale: wayyiqtol 延续过去叙事，而 הֵנָּה 指说话现场；“带到这里来”兼顾动作完成及当前地点。“献给”在中文中自然表达恭敬呈交，但不赋予祭祀含义。
- source_word: אֶל אֲדֹנִי
  choice: 给我主
  rationale: אֲדֹנִי 在此是对大卫的尊称，而非神名；“我主”保留宫廷式敬称。
theological_decisions:
- issue: 扫罗死亡经过的叙事张力
  choice: 按亚玛力人的直接引语译为他声称自己杀死了扫罗
  alternative: 为与撒母耳记上31:4–5协调，而在正文中淡化、改写或判定这番话为虚假陈述
  rationale: 本节直接记载亚玛力人的自述。翻译应准确呈现其声称，不在正文中预先裁定可信度，也不消解与较早记载之间的张力；以脚注提示参照经文即可。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“杀死”直陈原文的使役意义；“我主”保留对大卫的恭敬称呼。脚注标记均置于正文相应位置。
