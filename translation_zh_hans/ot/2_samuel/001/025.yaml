base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/025.yaml
  text: How the mighty have fallen in the midst of the battle! Jonathan lies slain on your heights[a].
translation:
  language: zh_hans
  text: 勇士何竟倒在战斗之中！约拿单倒毙在你的高处[a]！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “高处”也可译作“高地”。希伯来语可指隆起的地势；这里“你的”既可能承接对以色列土地的诗性称呼，也可能与约拿单相连。
    reason: 说明词义选项，并保留第二人称后缀所指的歧义。
lexical_decisions:
- source_word: אֵיךְ
  choice: 何竟
  rationale: 这里引出惊叹性的哀歌，并非询问信息；“何竟”既自然表达悲痛惊愕，也保留本诗反复句的诗歌力度。
- source_word: נָפְלוּ
  choice: 倒在
  rationale: 该完成式描写已经发生的死亡；“倒在”与勇士阵亡的语境相称，并与后半句形成呼应。
- source_word: גִבֹּרִים
  choice: 勇士
  rationale: 该词在此指英勇善战的人；“勇士”既保留英勇意味，又不限定具体军衔。
- source_word: בְּתוֹךְ הַמִּלְחָמָה
  choice: 战阵之中
  rationale: בְּתוֹךְ 强调处于争战内部；“战阵之中”简洁而庄重，保留身在激战中的意味。
- source_word: יְהוֹנָתָן
  choice: 约拿单
  rationale: 采用现代中文圣经语境中通行的人名音译。
- source_word: עַל
  choice: 在
  rationale: 按此处地点关系译为“在”，符合现代汉语表达。
- source_word: בָּמוֹתֶיךָ
  choice: 你的高处
  rationale: בָּמוֹת 可指高地或高处；直译为“你的高处”，既保留地势意象，也不贸然加入祭祀场所的含义，并保留第二人称所指的张力。
- source_word: חָלָל
  choice: 倒毙
  rationale: 该词指被杀、阵亡的人；“倒毙”以谓语形式自然表达原文省略系词的名词性断句，同时明确这里并非仅仅受伤。
theological_decisions:
- issue: “你的高处”中第二人称单数后缀的所指
  choice: 正文保留“你的”而不明确指定所指
  alternative: 明确解释为以色列的高处，或约拿单所属的高处
  rationale: 希伯来文本可让读者把“约拿单”理解为呼语，并将“你的”与他相连；结合整首哀歌，也可能延续对以色列土地的诗性称呼。正文不补出所指，以保存原文的诗意含混。
- issue: חָלָל 表示死亡还是受伤
  choice: 译为“倒毙”，指已经被杀
  alternative: 译为“受伤”或“被刺伤”
  rationale: 在本节哀悼约拿单阵亡的语境中，该词指被杀者；“倒毙”准确表达死亡，又与前句“倒在”形成诗歌呼应。
translation_notes:
  register: 采用现代、庄重而可诵读的哀歌语体。“何竟”表达惊叹与悲恸；“战阵之中”略具诗意但仍易懂。正文保留两句的感叹结构，并以“倒在／倒毙”形成呼应。
