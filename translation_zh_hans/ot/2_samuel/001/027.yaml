  text: אֵ֚יךְ נָפְל֣וּ גִבּוֹרִ֔ים וַ/יֹּאבְד֖וּ כְּלֵ֥י מִלְחָמָֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/027.yaml
  text: How the mighty have fallen[b][a], and the weapons of war have perished!
translation:
  language: zh_hans
  text: 勇士何竟倒下，作战的装备也毁坏了！[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “作战的装备”也可译作“军用器具”“武器”或“甲胄”。希伯来语所指较广，不仅限于进攻性武器。
    reason: lexical_alternative
  - marker: b
    text: “作战的装备”可能是以军事装备比喻扫罗和约拿单，视他们为以色列的战力；也可以按字面理解为实际的军用装备。
    reason: alternative_reading
lexical_decisions:
- source_word: אֵיךְ
  choice: 竟然
  rationale: 此处引出哀歌中的感叹，并非询问信息；“竟然”以自然的现代汉语表达震痛与难以置信，同时保留本章反复句的诗性力量。
- source_word: נָפְלוּ
  choice: 倒下
  rationale: 既可描述战士战死，也保留“坠落、倾覆”的哀歌意象；与前文反复句保持一致较为合适。
- source_word: גִבּוֹרִים
  choice: 勇士
  rationale: 在这首悼歌中指英勇善战的人；“勇士”简洁、庄重，也比泛称“强者”更切合军事语境。
- source_word: וַיֹּאבְדוּ
  choice: 丧失了
  rationale: אבד可表示灭亡、毁坏或失去。这里采用“丧失了”，既容许器械实际毁失，也不排除用其隐喻扫罗和约拿单这两位军事力量的读法。
- source_word: כְּלֵי מִלְחָמָה
  choice: 战争的器械
  rationale: כְּלֵי的范围较宽，可指武器、甲胄及其他军用装备；“战争的器械”较贴近原文的宽泛表达，不限于进攻性武器。
theological_decisions:
- issue: “战争的器械”是实指军备，还是隐喻扫罗和约拿单
  choice: 正文保留可作实指或隐喻的措辞，并用脚注说明
  alternative: 直接译作“战士”或明确认定为武器装备
  rationale: 原文语法容许字面理解，而悼歌语境也使隐喻理解成为可能；不应在正文中消除这一张力。
translation_notes:
  register: 采用庄重而自然的现代汉语哀歌语体，以两次“竟然”传达 אֵיךְ 的惊痛感；句式简洁，并保留原文末句在字面与隐喻之间的开放性。
