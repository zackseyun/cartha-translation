revisions:
- from: 以色列啊，你的荣美[a]在你的高处[b]被杀倒下！勇士竟然倒下了！
  to: 以色列啊，你的荣美[a]横尸在你的高处[b]！勇士何竟倒下！
  rationale: 修改前半句以区分“被杀／横尸”和后半句“倒下”这两个原文表达，并将哀歌感叹改为“何竟”。保留原有的词汇歧义脚注，仅更正“丘坛”的字形。
  reviewer_model: gpt-5.6-terra
