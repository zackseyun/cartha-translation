base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/019.yaml
  text: Your glory[a], O Israel[b], lies slain on your heights! How the mighty have fallen!
translation:
  language: zh_hans
  text: 以色列啊，你的荣美[a]横尸在你的高处[b]！勇士何竟倒下！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “荣美”：希伯来语也可译作“美丽”或“荣耀”；有些人按其具体含义理解为“羚羊”。
    reason: lexical_alternative
  - marker: b
    text: “高处”：或译“高地”。这里指地势较高之处，不一定指举行祭祀的丘坛。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצְּבִי
  choice: 你的荣美
  rationale: צְבִי可指美丽、荣美或荣耀，也可具体指羚羊一类的动物。此处是哀歌，并与以色列及后文“你的高处”相连；“你的荣美”自然地指向以色列引以为荣的人物，同时保留诗性。
- source_word: יִשְׂרָאֵל
  choice: 以色列啊
  rationale: 按呼语处理，用“啊”显明大卫是在哀悼中直接向以色列发言。
- source_word: עַל בָּמוֹתֶיךָ
  choice: 在你的高处
  rationale: 保留介词的地点意义及בָּמוֹת的地形含义；“高处”较“邱坛”中性，不额外引入祭祀场所的联想。
- source_word: חָלָל
  choice: 被杀倒下
  rationale: חָלָל指被杀者或被杀的状态；结合诗句语序译作“被杀倒下”，既明确死亡，也与下句“倒下”形成呼应。
- source_word: אֵיךְ
  choice: 竟然
  rationale: 这里引出哀歌中的惊叹。汉语用“竟然”比直译“如何”更自然地表达悲恸和震惊，同时不把它处理成真正的疑问。
- source_word: נָפְלוּ
  choice: 倒下了
  rationale: 完成式叙述已经发生、而其悲剧结果仍在眼前的事件；“倒下了”符合现代汉语哀歌语气。
- source_word: גִבּוֹרִים
  choice: 勇士
  rationale: גִבּוֹרִים可指大能者、勇士或英雄。上下文为战死者哀歌，“勇士”既贴合军事背景，也保留复数的概括性。
theological_decisions:
- issue: הַצְּבִי所指是抽象的“荣美”还是具体的“羚羊”
  choice: 正文采用“你的荣美”
  alternative: “那羚羊”或“那美物”
  rationale: 哀歌语境及对以色列的直接称呼支持把该词理解为国家的荣美或荣耀，但原词确有动物义，故用脚注保存歧义，不将具体所指绝对化。
translation_notes:
  register: 采用现代、庄重而有哀歌节奏的普通话。“以色列啊”保留呼告语气；两次“倒下”有意形成诗性回响。正文不点明“荣美”专指扫罗或约拿单，以免消除原诗的含蓄。
