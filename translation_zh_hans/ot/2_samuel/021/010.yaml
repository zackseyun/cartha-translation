  text: וַ/תִּקַּ֣ח רִצְפָּה֩ בַת אַיָּ֨ה אֶת הַ/שַּׂ֜ק וַ/תַּטֵּ֨/הוּ לָ֤/הּ אֶל הַ/צּוּר֙ מִ/תְּחִלַּ֣ת קָצִ֔יר עַ֛ד נִתַּךְ מַ֥יִם עֲלֵי/הֶ֖ם מִן הַ/שָּׁמָ֑יִם וְ/לֹֽא נָתְנָה֩ ע֨וֹף הַ/שָּׁמַ֜יִם לָ/נ֤וּחַ עֲלֵי/הֶם֙ יוֹמָ֔ם וְ/אֶת חַיַּ֥ת הַ/שָּׂדֶ֖ה לָֽיְלָה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/010.yaml
  text: Then Rizpah the daughter of Aiah took sackcloth and spread it out for herself on the rock[a], from the beginning of harvest until water was poured on them from the heavens. And she did not allow the birds of the sky to rest on them by day, nor the wild animals of the field by night.
translation:
  language: zh_hans
  text: 爱亚的女儿利斯巴拿了粗麻布，把它为自己铺在磐石上。从收割开始，直到有水从天上倾降在他们身上[a]，她白天不让空中的飞鸟停落在他们身上，夜间也不让田野的野兽靠近他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“直到雨从天上降在他们身上”。原文较直译为“直到有水从天上倾降在他们身上”。
    reason: 说明此句通常指降雨，同时保留希伯来原文“水被倾降”的具体意象。
lexical_decisions:
- source_word: רִצְפָּה בַת אַיָּה
  choice: 爱亚的女儿利斯巴
  rationale: 采用现代中文圣经人名的常见音译，并保留希伯来文的父女关系表达。
- source_word: הַשַּׂק
  choice: 麻布
  rationale: שַׂק指粗糙的麻布，常与哀悼有关；“麻布”自然简洁，也保留本段守丧背景。
- source_word: וַתַּטֵּהוּ לָהּ אֶל הַצּוּר
  choice: 为自己铺在磐石上
  rationale: נטה在此表示把布展开或铺设；לָהּ保留为“为自己”，אֶל הַצּוּר按语境译作“在磐石上”，但不进一步推定具体地点。
- source_word: מִתְּחִלַּת קָצִיר
  choice: 从收割开始
  rationale: 原文未说明收割哪一种作物，因此不增添“大麦”等信息。
- source_word: עַד נִתַּךְ מַיִם עֲלֵיהֶם מִן הַשָּׁמָיִם
  choice: 直到有水从天上倾降在他们身上
  rationale: 保留נתך“倾倒、倾降”的形象和מַיִם“水”的直译，不在正文中直接解释为下雨；עֲלֵיהֶם以“他们身上”承接前文被处死的人。
- source_word: עוֹף הַשָּׁמַיִם
  choice: 空中的飞鸟
  rationale: 这是表示鸟类的常见希伯来语组合；“空中的飞鸟”在现代中文中自然，并保留空间意象。
- source_word: לָנוּחַ עֲלֵיהֶם
  choice: 停落在他们身上
  rationale: נוח在鸟类语境中指落下、停栖；“停落”比笼统的“休息”更准确。
- source_word: חַיַּת הַשָּׂדֶה
  choice: 田野的野兽
  rationale: 该短语指陆地上的野生动物；译文保持希伯来语“田野”的表达，同时使用现代读者易懂的“野兽”。
- source_word: יוֹמָם ... לָיְלָה
  choice: 白天……夜间
  rationale: 简洁保留原文昼夜对举的节奏。
