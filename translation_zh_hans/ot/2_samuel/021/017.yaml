base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/017.yaml
  text: But Abishai son of Zeruiah came to his aid[a], struck the Philistine, and killed him. Then David’s men swore to him, saying, “You must not go out with us to battle any longer, lest you extinguish the lamp of Israel.”
translation:
  language: zh_hans
  text: 洗鲁雅的儿子亚比筛来援助他，击打那非利士人，把他杀死。于是大卫的部下向他起誓说：“你不可再同我们出战，免得你熄灭以色列的灯[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“以色列之光”。希伯来文直译为“以色列的灯”；这是指向大卫对以色列重要地位的比喻。
    reason: 说明词义替代译法及原文比喻，同时避免将其含义限定为单一解释。
lexical_decisions:
- source_word: וַיַּעֲזָר לוֹ
  choice: 却来帮助他
  rationale: עזר表示“帮助、援助”；这里指亚比筛在战斗中介入相助。“来帮助他”自然地传达叙事动作，同时保留原文代词。
- source_word: אֲבִישַׁי בֶּן צְרוּיָה
  choice: 洗鲁雅的儿子亚比筛
  rationale: 按现代汉语亲属表达调整语序，并采用通行的圣经人名译法。
- source_word: וַיַּךְ אֶת הַפְּלִשְׁתִּי
  choice: 击打那个非利士人
  rationale: נכה的基本义为“击打”。后一句另明确说将其杀死，因此此处不提前译成“击杀”，以保留两个连续动作。
- source_word: וַיְמִיתֵהוּ
  choice: 将他杀死
  rationale: מות的使役形在此明确表示使对方死亡；“将他杀死”准确而自然。
- source_word: אָז נִשְׁבְּעוּ אַנְשֵׁי דָוִד לוֹ
  choice: 于是大卫的部下向他起誓
  rationale: נשבע表示郑重起誓；“大卫的部下”清楚表达属大卫的人，并符合现代叙事语言。
- source_word: לֹא תֵצֵא עוֹד אִתָּנוּ לַמִּלְחָמָה
  choice: 你不可再同我们出战
  rationale: 誓言中的未完成式具有强烈禁止意味；“不可再”保留其郑重语气。
- source_word: וְלֹא תְכַבֶּה
  choice: 免得你熄灭
  rationale: 形式上由“和／不”连接，但语境表达所要避免的结果；“免得”是自然且准确的汉语表达。
- source_word: נֵר יִשְׂרָאֵל
  choice: 以色列的灯
  rationale: נֵר具体指灯。直译保留原文以灯象征大卫对国家之重要作用的形象，避免在正文中将比喻抽象化。
theological_decisions:
- issue: 以“以色列的灯”比喻大卫对以色列的关键作用
  choice: 正文保留“以色列的灯”这一具体比喻
  alternative: 以色列之光
  rationale: 原文使用具体名词נֵר（灯），并未直接说明其神学含义。保留比喻可呈现王权、生命与国家安定等可能联想，而不把其中的张力化约为单一解释。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。保留“击打……杀死”的连续动作与“以色列的灯”的原文意象；誓言用“不可”体现郑重禁止。
