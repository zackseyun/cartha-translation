base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/013.yaml
  text: He brought up from there the bones of Saul and the bones of Jonathan his son[a], and they gathered the bones of those who had been impaled.
translation:
  language: zh_hans
  text: 他从那里把扫罗的骸骨和扫罗的儿子约拿单的骸骨带了上来；他们又收集了那些被悬挂示众者的骸骨[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“被钉挂的人”或“被暴露示众的人”。希伯来语指遭处死后尸身被公开悬挂或展示的人；具体方式不能完全确定。
    reason: 保留הַמּוּקָעִים对于处决后公开悬置、展示的词义范围，不预断具体执行方式。
lexical_decisions:
- source_word: וַיַּעַל
  choice: 带了上来
  rationale: 使役形态表达“使上去、带上来”；这里指从前述地点取回骸骨。“带了上来”既保留方向感，也符合现代汉语叙事。
- source_word: מִשָּׁם
  choice: 从那里
  rationale: 直接保留原文的地点指示，衔接上文自然。
- source_word: עַצְמוֹת
  choice: 骸骨
  rationale: 原词直指“骨头、骨骸”；在安葬死者的语境中，“骸骨”比“骨头”庄重自然，又比泛称“遗骸”更贴近词义。
- source_word: יְהוֹנָתָן בְּנוֹ
  choice: 扫罗儿子约拿单
  rationale: 明确“他的儿子”所指的是扫罗，避免汉语连续所有格可能造成的歧义，同时保留亲属关系。
- source_word: וַיַּאַסְפוּ
  choice: 众人又收殓了
  rationale: 原文是第三人称阳性复数，不改成单数。“众人”自然呈现未明说的复数主语；在收集死者骸骨以便安葬的语境中，“收殓”比一般的“收集”更合宜。
- source_word: הַמּוּקָעִים
  choice: 那些被悬挂示众之人
  rationale: 该词描述被处死并公开悬置、陈列的人；“被悬挂示众”保留公开暴露尸身的核心含义，而不武断限定具体处刑方式。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的历史叙事语体。“骸骨”“收殓”符合安葬语境；分号呈现原文由单数主语转为复数主语的结构变化。
