  naturalness: “大卫在位期间”自然，但“求见耶和华的面”不合现代汉语宗教叙事的通常表达，且语义不够准确。“一连三年，年复一年”可保留原文强调，但调整为“接连三年，年复一年”更顺畅。
  terminology: “耶和华”“扫罗”“基遍人”“饥荒”均为通行且合适的译名。“负有血债的家”准确传达血债，脚注宜将“血之家”改为更贴近原文复数形式的“血之屋/血的家”，并说明其为流血罪责的习语。
