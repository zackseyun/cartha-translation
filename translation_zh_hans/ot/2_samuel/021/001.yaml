id: 2SA.21.1
reference: 2 Samuel 21:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יְהִ֣י רָעָב֩ בִּ/ימֵ֨י דָוִ֜ד שָׁלֹ֣שׁ שָׁנִ֗ים שָׁנָה֙ אַחֲרֵ֣י שָׁנָ֔ה וַ/יְבַקֵּ֥שׁ דָּוִ֖ד אֶת פְּנֵ֣י יְהוָ֑ה וַ/יֹּ֣אמֶר יְהוָ֗ה אֶל שָׁאוּל֙ וְ/אֶל בֵּ֣ית הַ/דָּמִ֔ים עַל אֲשֶׁר הֵמִ֖ית אֶת הַ/גִּבְעֹנִֽים־ס־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/001.yaml
  text: There was a famine in the days of David for three years[a], year after year. And David sought the face of Yahweh, and Yahweh said, “It is because of Saul and his bloodguilty house[b], because he put the Gibeonites to death.”
translation:
  language: zh_hans
  text: 大卫在位期间，发生了饥荒，接连三年，年复一年。大卫就求问耶和华[a]。耶和华说：“这是因扫罗和他那负有血债的家[b]，因为他杀死了基遍人。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“寻求耶和华”；原文直译为“寻求耶和华的面”。
    reason: 说明“寻求……的面”这一希伯来语习语，并保留可行译法。
  - marker: b
    text: 原文直译为“血之屋（家）”；“血”在这里是指流血的罪责，“家”可指家族或王室。
    reason: 解释希伯来语习语及“家”的范围。
lexical_decisions:
- source_word: רָעָב
  choice: 饥荒
  rationale: 这里指波及全地的严重粮食短缺；“饥荒”比一般性的“饥饿”更符合叙事语境。
- source_word: שָׁלֹשׁ שָׁנִים שָׁנָה אַחֲרֵי שָׁנָה
  choice: 一连三年，年复一年
  rationale: 保留原文“三年”和“年复一年”两个成分所表达的连续与强调，同时符合现代汉语习惯。
- source_word: וַיְבַקֵּשׁ ... אֶת־פְּנֵי יְהוָה
  choice: 求见耶和华的面
  rationale: 尽量保留“寻求……的面”这一希伯来语形象及其亲身求问之意；“求见”使现代读者较易理解。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者广泛熟悉的神名形式，并将其作为专名而非仅译作头衔。
- source_word: אֶל שָׁאוּל וְאֶל בֵּית הַדָּמִים
  choice: 因扫罗和他那负有血债的家
  rationale: 上下文表明这是饥荒的原因；“家”可指家族或王室，“负有血债”传达流血罪责，而不把原文生硬译成“血之家”。
- source_word: עַל אֲשֶׁר הֵמִית אֶת־הַגִּבְעֹנִים
  choice: 因为他杀死了基遍人
  rationale: 单数动词的主语回指扫罗；“杀死”自然、明确地表达使人死亡及其所带来的流血罪责。
- source_word: הַגִּבְעֹנִים
  choice: 基遍人
  rationale: 采用该族群名称在现代中文圣经中的通行译名。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: “耶和华”是简体中文圣经传统中最广为人知的专名形式，可让普通读者清楚辨认这是以色列上帝的名字；脚注无需在本节展开专名读音争议。
- issue: 扫罗之家与饥荒原因的关系
  choice: 将耶和华的话译为明确的原因说明：“这是因扫罗和他那负有血债的家”
  alternative: 较直译地作“这是对扫罗和血之家”
  rationale: 介词结构在此语境中回答饥荒缘由；补出因果关系符合汉语表达，同时保留扫罗及其家族所负流血罪责的司法意味。
- issue: “他杀死了基遍人”中单数主语的指向
  choice: 保留单数“他”，指向扫罗
  alternative: 解释为扫罗之家集体实施杀害
  rationale: 原文为阳性单数使役动词，最自然地回指扫罗；不额外断定执行杀戮的具体人员，以保留原文的归责方式。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。以“一连三年，年复一年”保留原文重复强调；“求见耶和华的面”在正文中保留原文形象，并用脚注说明更自然的功能性译法。
