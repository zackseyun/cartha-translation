  text: וַ/יִּקְרָ֥א הַ/מֶּ֛לֶךְ לַ/גִּבְעֹנִ֖ים וַ/יֹּ֣אמֶר אֲלֵי/הֶ֑ם וְ/הַ/גִּבְעֹנִ֞ים לֹ֣א מִ/בְּנֵ֧י יִשְׂרָאֵ֣ל הֵ֗מָּה כִּ֚י אִם מִ/יֶּ֣תֶר הָ/אֱמֹרִ֔י וּ/בְנֵ֤י יִשְׂרָאֵל֙ נִשְׁבְּע֣וּ לָ/הֶ֔ם וַ/יְבַקֵּ֤שׁ שָׁאוּל֙ לְ/הַכֹּתָ֔/ם בְּ/קַנֹּאת֥/וֹ לִ/בְנֵֽי יִשְׂרָאֵ֖ל וִ/יהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/002.yaml
  text: So the king called the Gibeonites and spoke to them[a]. Now the Gibeonites were not from the sons of Israel, but from the remnant of the Amorites; and the sons of Israel had sworn to them[c][b]. But Saul had sought to strike them down in his zeal for the sons of Israel and Judah.
translation:
  language: zh_hans
  text: 王召来基遍人，对他们说道。[a]基遍人并不是以色列人，而是亚摩利人的余民；以色列人曾向他们起誓。但扫罗为以色列和犹大热心，企图击杀他们。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节接下来的话是叙述者对基遍人背景的说明；王对他们所说的具体话见下一节。
    reason: 说明原文叙事结构，避免读者把后面的背景说明误当作王的话。
  - marker: b
    text: “热心”所译的希伯来词也可表示“嫉妒”。
    reason: 保留 קנא 的可行词义替代及扫罗动机所带的强烈张力。
lexical_decisions:
- source_word: וַיִּקְרָא הַמֶּלֶךְ לַגִּבְעֹנִים
  choice: 王召来基遍人
  rationale: “召来”自然表达 קרא 在此处召人到面前的意思；保留原文“王”的称谓，不补出“大卫”。
- source_word: וַיֹּאמֶר אֲלֵיהֶם
  choice: 对他们说话
  rationale: 贴近“对他们说”，同时在“召来”之后符合现代汉语表达。
- source_word: לֹא מִבְּנֵי יִשְׂרָאֵל הֵמָּה
  choice: 并非以色列人
  rationale: בני ישראל 在这里是民族称谓，译作“以色列人”比逐字的“以色列的众子”自然清楚。
- source_word: מִיֶּתֶר הָאֱמֹרִי
  choice: 亚摩利人的余民
  rationale: יֶתֶר 指剩余、存留下来的人；“余民”简洁保留这一含义。
- source_word: נִשְׁבְּעוּ לָהֶם
  choice: 曾向他们起誓
  rationale: “曾”表明起誓先于扫罗的行动；“向他们起誓”准确而自然。
- source_word: וַיְבַקֵּשׁ שָׁאוּל לְהַכֹּתָם
  choice: 但扫罗……企图击杀他们
  rationale: בקש 加不定式在此表示试图或企图；נכה 在上下文中含致命暴力，译作“击杀”既保留动词力度，也不弱化为一般攻击。
- source_word: בְּקַנֹּאתוֹ
  choice: 发热心
  rationale: קנא 可表示热心或嫉妒；这里带有为民族而产生的强烈、排他的热忱，“发热心”保留其动机的张力而不为其行为背书。
theological_decisions:
- issue: בני ישראל 的民族称谓
  choice: 以色列人
  alternative: 以色列的子孙
  rationale: 此处指整个民族群体，并非特指男性；现代汉语用“以色列人”最清楚，也与后文“以色列人和犹大”自然衔接。
- issue: קנא 所表达的扫罗动机
  choice: 发热心
  alternative: 嫉妒
  rationale: 语境是扫罗声称为以色列和犹大而有的民族性热忱，不是通常意义上的羡慕或妒忌；但“热心”并不表示经文认可其企图杀害基遍人的行为。
- issue: 扫罗行动与以色列誓言的关系
  choice: 用“但”显明对照
  alternative: 用“于是”或单纯并列
  rationale: 原文叙述先指出以色列人曾起誓，继而提到扫罗企图击杀基遍人；“但”准确传达两者之间明显的背离和张力。
translation_notes:
  register: 采用现代、庄重且易懂的叙事语体。“余民”“起誓”“击杀”保留经文历史叙事的凝练感；避免逐字译作生硬的“以色列的众子”。所有脚注标记均已置于正文。
