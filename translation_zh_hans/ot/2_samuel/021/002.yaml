  terminology: “基遍人”“亚摩利人”“余民”“起誓”均恰当。“热心”适合此处קנא所表达的强烈、带立场的热忱；脚注保留“嫉妒”这一可行的词义替代，但不宜扩展为语境中不够确切的“忌恨”。
