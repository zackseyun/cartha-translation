base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/020.yaml
  text: And there was war again at Gath[a], and there was a man of great size whose fingers and toes were six and six, twenty-four in number[c][b]; he also was born to the Rapha.
translation:
  language: zh_hans
  text: 后来，迦特又发生了战争。那里有一个身材高大的人[a]，双手各有六根手指，双脚各有六根脚趾[b]，总数二十四根。他也是拉法的后代[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“一个有度量的人”；也可译作“一个身躯魁伟的人”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译为“他双手的指头和双脚的指头”。
    reason: lexical_alternative
  - marker: c
    text: 也可译作“也是拉法所生的”或“也是拉法的族裔”。“拉法”可能与以身材高大著称的利乏音人有关。
    reason: alternative_reading
lexical_decisions:
- source_word: מִלְחָמָה
  choice: 战争
  rationale: 该词泛指战争或武装冲突；上下文叙述反复发生的战事，用“战争”比“一场战斗”更贴近其范围。
- source_word: בְּגַת
  choice: 迦特……发生
  rationale: 介词 בְּ 表示战事发生的地点；汉语用“迦特又发生了战争”自然清楚。
- source_word: אִישׁ מדין
  choice: 一个身材高大的人
  rationale: 此短语与度量、体格有关，意指体形或身量非同寻常的人；译作“身材高大”既传达含义，又避免生硬的“有度量的人”。
- source_word: אֶצְבְּעֹת יָדָיו וְאֶצְבְּעֹת רַגְלָיו
  choice: 双手各有六根手指，双脚各有六根脚趾
  rationale: 希伯来语直说“他双手的指头和双脚的指头”；现代汉语分别称为“手指”和“脚趾”。结合总数二十四，明确每只手、每只脚各有六根。
- source_word: שֵׁשׁ וָשֵׁשׁ
  choice: 各有六根……各有六根
  rationale: 保留原文对“六、六”的重复，并借“各”准确表达四肢每一只都有六指。
- source_word: עֶשְׂרִים וְאַרְבַּע מִסְפָּר
  choice: 总数二十四根
  rationale: 这是对手指和脚趾数目的汇总；该译法简洁地保留原文的计数表达。
- source_word: יֻלַּד לְהָרָפָה
  choice: 也是拉法的后代
  rationale: 被动式 ילד 与 לְ 在这里表示出生关系或血统归属；“后代”符合自然汉语，同时保留“拉法”作为名称或族系称谓。
theological_decisions:
- issue: הָרָפָה 的身份
  choice: 将“拉法”保留为专名或祖系称谓，正文译为“拉法的后代”
  alternative: “巨人的后代”或“利乏音人的后代”
  rationale: 原文强调出生和血统关系，但“拉法”究竟指一位祖先还是与利乏音人有关的群体，并不完全明确。音译可避免在正文中把这种不确定性定死。
translation_notes:
  register: 采用现代、庄重而易懂的叙事文体。“身材高大”避免过度解释为超自然的“巨人”；“拉法的后代”保留原文在个人祖先与族群称谓之间的可能歧义。脚注标记均紧随所说明的词句。
