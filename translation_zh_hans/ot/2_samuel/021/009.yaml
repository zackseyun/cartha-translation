  text: וַֽ/יִּתְּנֵ֞/ם בְּ/יַ֣ד הַ/גִּבְעֹנִ֗ים וַ/יֹּקִיעֻ֤/ם בָּ/הָר֙ לִ/פְנֵ֣י יְהוָ֔ה וַ/יִּפְּל֥וּ שבעתים יָ֑חַד ו/הם הֻמְת֜וּ בִּ/ימֵ֤י קָצִיר֙ בָּ/רִ֣אשֹׁנִ֔ים תחלת קְצִ֥יר שְׂעֹרִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/009.yaml
  text: He gave them into the hand of the Gibeonites[a], and they hanged them on the mountain before Yahweh, and the seven of them fell together. They were put to death in the first days of harvest, at the beginning of the barley harvest.
translation:
  language: zh_hans
  text: 他把他们交在基遍人手里；基遍人在山上、在耶和华面前把他们悬挂示众[a]。他们七个人一同倒下。他们被处死时正值收割初期，也就是大麦开始收割的时候。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“把他们刺穿示众”，又或：“把他们公开悬挂或展示”。希伯来语动词可泛指将人悬挂、刺穿或公开展示，也可能涉及尸体的公开展示；不一定指后来狭义的绞刑。
    reason: 保留处决或公开展示方式的词义不确定性，避免将原文无法确定的具体钉刑方式读入正文或脚注。
lexical_decisions:
- source_word: וַיִּתְּנֵם בְּיַד הַגִּבְעֹנִים
  choice: 他把他们交在基遍人手里
  rationale: נתן与“在……手里”连用，表示将人交由对方掌控；保留“在……手里”的希伯来语意象，同时用“交”表达移交之意。
- source_word: וַיֹּקִיעֻם
  choice: 把他们悬挂示众
  rationale: יקע在此指公开悬挂、陈尸或以类似方式处决示众；“悬挂示众”既表达公开展示，也避免把具体方式限定为后世狭义的绞刑。
- source_word: בָּהָר
  choice: 在山上
  rationale: הַר是带定冠词的单数，直译为“山”；上下文未明确其为丘陵或山区。
- source_word: לִפְנֵי יְהוָה
  choice: 在耶和华面前
  rationale: 保留该短语所含的临在及盟约性、司法性意味；神名 יהוה 按项目惯例译作“耶和华”。
- source_word: וַיִּפְּלוּ שבעתים יָחַד
  choice: 七个人一同倒下
  rationale: 按马所拉正文将 שבעתים 理解为“他们七个”；“倒下”保留死亡叙述中的希伯来语意象。
- source_word: הֻמְתוּ
  choice: 他们被处死
  rationale: מות的使役被动式表示“使之死亡”，在司法处决语境中自然译为“被处死”。
- source_word: בִּימֵי קָצִיר בָּרִאשֹׁנִים תחלת קְצִיר שְׂעֹרִים
  choice: 正值收割初期，也就是大麦开始收割的时候
  rationale: 后半句具体说明前面的“收割初期”；“也就是”清楚呈现同位解释关系。
theological_decisions:
- issue: יקע所指的处决或公开展示方式
  choice: 正文译为“悬挂示众”
  alternative: “把他们钉死示众”或“把他们处死后公开陈列”
  rationale: 原词可涵盖悬挂、刺穿及公开展示，无法仅凭本节确定具体方式；正文保留公开处决或展示的核心意义，脚注说明可能译法，不武断限定刑罚细节。
- issue: “在耶和华面前”的意义
  choice: 直译为“在耶和华面前”
  alternative: “当着耶和华”或解释为“献给耶和华”
  rationale: 原文确有宗教与盟约审判意味，但没有使用通常表示献祭的术语；直译可保留其神学张力而不把处决解释成祭献。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“交在……手里”保留圣经希伯来语常见意象；将较长的希伯来语并列结构适度分句，以提高普通读者的可读性。
