base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/003.yaml
  text: David said to the Gibeonites[a], “What shall I do for you, and with what shall I make atonement[b], that you may bless the inheritance of Yahweh?”
translation:
  language: zh_hans
  text: 大卫对基遍人说：“我该为你们做什么？又该用什么来赎罪，好让你们祝福耶和华的产业呢？”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“并祝福耶和华的产业。”希伯来语的形式也可较直译地看作并列分句；正文按上下文译为目的或结果。
    reason: 句法与词义的另一种可能
  - marker: b
    text: “耶和华的产业”在这里主要指属于耶和华的以色列民。
    reason: 文化与语境说明
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: אמר的叙事性wayyiqtol通常引出直接引语；译作“说”自然且不过度界定言语行为。
- source_word: הַגִּבְעֹנִים
  choice: 基遍人
  rationale: 这是指基遍居民的族群名称；采用现代中文圣经中通行、清楚的专名译法。
- source_word: מָה אֶעֱשֶׂה לָכֶם
  choice: 我该为你们做什么
  rationale: 疑问词加未完成式表达商议、询问应采取何种行动；“我该……什么”符合现代汉语，同时保留开放式询问。
- source_word: וּבַמָּה
  choice: 我用什么
  rationale: 保留ב的工具、手段含义，比仅译作“怎样”更贴近原文。
- source_word: אֲכַפֵּר
  choice: 来赎罪
  rationale: כפר的Piel形式在此涉及除去流血罪与违约所造成的罪责；“赎罪”保留其补偿、消除罪责的神学分量，而不弱化为一般性的“赔罪”。
- source_word: וּבָרְכוּ
  choice: 使你们可以……祝福
  rationale: 该连接词与意愿式命令形式在语境中很可能表达所求行动的目的或结果；中文以“使……可以”自然呈现此义，同时在脚注保留并列读法。
- source_word: נַחֲלַת יְהוָה
  choice: 耶和华的产业
  rationale: נחלה指所得之产业或属业；此处指属于耶和华的以色列民。“产业”既贴近原文，也保留这一归属意象。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文圣经传统中最通行、最易识别的神圣名号译法，明确其为专名而非普通称号。
theological_decisions:
- issue: 在流血罪和违约语境中如何翻译כפר
  choice: 赎罪
  alternative: 赔罪；作补偿；除罪
  rationale: 本节不只是处理人际冒犯，也关乎群体罪责及其在上帝面前的解除。“赎罪”能保留原词的严肃性与神学张力，又不预先断定具体赎罪方式。
- issue: 末句וּבָרְכוּ אֶת נַחֲלַת יְהוָה的句法关系
  choice: 目的或结果：“使你们可以为耶和华的产业祝福”
  alternative: 简单并列：“并为耶和华的产业祝福”
  rationale: 在上下文中，大卫询问采取何种行动才能促使基遍人为以色列祝福，因此目的或结果义较为顺畅；但希伯来语也可较直译地理解为并列命令，故以脚注明示。
- issue: “耶和华的产业”所指
  choice: 保留原有比喻，在脚注说明主要指以色列民
  alternative: 正文直接译为“耶和华的子民以色列”
  rationale: 保留“产业”可呈现原文关于归属关系的意象，避免把具有一定涵盖空间的表达在正文中过度释义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“我该……什么”呈现商议式问句；“赎罪”保留原文在违约与流血罪背景下的神学重量；“产业”保留希伯来语的归属意象。脚注标记置于整句末尾，分别对应末句的句法歧义及“产业”的所指。
