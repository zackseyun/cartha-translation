base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/019.yaml
  text: And there was again war at Gob with the Philistines[a], and Elhanan son of Jaare-oregim the Bethlehemite struck down Goliath the Gittite[b], and the shaft of his spear was like a weaver’s beam.
translation:
  language: zh_hans
  text: 后来，在歌伯又有一场与非利士人的战争。雅雷·俄珥金[a]的儿子、伯利恒人伊勒哈难击杀了迦特人歌利亚[b]；他的矛杆粗得像织布机的横轴。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文父名“雅雷·俄珥金”较难理解；有人认为“俄珥金”（意为“织布的人”）是抄写时从本节末尾误重复到这里的。
    reason: textual_variant
  - marker: b
    text: 《历代志上》20:5的记载不同，说伊勒哈难杀的是歌利亚的兄弟拉哈米。许多人认为《撒母耳记》此处保留的是一个疑难读法，或可能有传抄问题，因此按《历代志上》的记载加以协调。
    reason: textual_variant
lexical_decisions:
- source_word: בְּגֹב
  choice: 在歌伯
  rationale: 介词 בְ 与地名连用，在此表示交战地点；“歌伯”按专名音译。
- source_word: וַיַּךְ
  choice: 击杀了
  rationale: נכה 在战斗语境中可指击打并杀死对手；“击杀”既保留动作力度，也自然表达这里的结果。
- source_word: יַעְרֵי אֹרְגִים
  choice: 雅雷·俄珥金
  rationale: 按马所拉文本音译这一疑难姓名，不在正文中依《历代志上》20:5改作“雅珥”，也不删去“俄珥金”。
- source_word: בֵּית הַלַּחְמִי
  choice: 伯利恒人
  rationale: 按该词的族籍形态译为“伯利恒人”。中文以同位语置于伊勒哈难之后，表达其籍贯，同时避免改写疑难的父名。
- source_word: אֵת גָּלְיָת הַגִּתִּי
  choice: 迦特人歌利亚
  rationale: 马所拉文本明确以“迦特人歌利亚”为直接宾语；正文保留该读法，不用平行经文消除张力。
- source_word: וְעֵץ חֲנִיתוֹ
  choice: 歌利亚的矛杆
  rationale: עֵץ 字面为“木头”，在长矛语境中自然指木制矛杆。希伯来语代词仅为“他的”；中文补出最近的所指“歌利亚”，以免歧义。
- source_word: כִּמְנוֹר אֹרְגִים
  choice: 粗得像织布机的轴
  rationale: 该比喻以织布机的横轴说明矛杆粗大；补出“粗得”使现代汉语读者清楚理解比较点。
theological_decisions:
- issue: 本节与大卫杀死歌利亚的记载（撒母耳记上17章）以及历代志上20:5的平行记载存在表面张力
  choice: 正文依马所拉文本译作伊勒哈难击杀迦特人歌利亚
  alternative: 依历代志上20:5协调为伊勒哈难击杀歌利亚的兄弟拉哈米
  rationale: 所给希伯来文本明确写“歌利亚”；翻译不应在正文中无提示地以平行经文校正，而应保留文本张力，并在脚注交代异文。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“后来……又有一场”自然传达 וַתְּהִי עוֹד；专名使用常见简体中文圣经译名。正文严格保留马所拉文本的疑难读法，脚注分别说明父名问题和平行经文异文。
