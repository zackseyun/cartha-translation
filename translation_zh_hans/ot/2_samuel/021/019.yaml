  naturalness: 行文庄重、现代且通顺。“粗得像织布机的横轴”自然表达比较的重点；“横轴”也比单说“轴”更明确。
  terminology: 人名、地名和族称的译法一致且合宜：歌伯、非利士人、雅雷·俄珥金、伯利恒人、伊勒哈难、迦特人歌利亚。脚注应将“传抄有误”的判断适度限定为一种学术理解，以免把推测表述为定论。
