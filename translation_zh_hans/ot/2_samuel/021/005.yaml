base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/005.yaml
  text: They said to the king[a], “The man who consumed us, and who planned against us[b], so that we should be destroyed from having a place within all the territory of Israel—”
translation:
  language: zh_hans
  text: 他们对王说：“那人毁灭了我们，又图谋要把我们灭绝，使我们在以色列全境无处立足[a]——”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“使我们不能在以色列全境站立（或确立自己）。”这里指他们在以色列任何地方都无法继续存留或安身。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּלָּנוּ
  choice: 要把我们灭尽
  rationale: כלה在此表示使某群体归于尽头、彻底除灭。“灭尽”保留其强烈程度，也符合扫罗对基遍人的行动语境。
- source_word: דִּמָּה לָנוּ
  choice: 图谋害我们
  rationale: דמה在此语境中很可能指筹划、图谋；לָנוּ带有敌对含义。“图谋害我们”自然表达恶意策划，同时以脚注保留较宽的译法。
- source_word: נִשְׁמַדְנוּ
  choice: 使我们被消灭
  rationale: שׁמד的尼法勒式表示遭毁灭或被除灭。此处与前句构成目的或结果关系，译作“使我们被消灭”，不强行限定两者。
- source_word: מֵהִתְיַצֵּב
  choice: 无处立足
  rationale: התייצב字面为站立、使自己站稳或确立自身；结合族群在境内继续存在的语境，“无处立足”既自然，又保留站立/安身的形象。
- source_word: בְּכָל גְּבֻל יִשְׂרָאֵל
  choice: 在以色列全境
  rationale: גְּבוּל此处指疆域、领土范围，而非单指边界线；“全境”简洁表达其全面范围。
- source_word: הָאִישׁ
  choice: 那人
  rationale: 定冠词名词回指扫罗。汉语直接引语中“那人”比“这人”或生硬的“那个人”更合适，并带出控诉语气。
