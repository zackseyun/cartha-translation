source:
  edition: WLC
  text: וַ/יִּקַּ֣ח הַ/מֶּ֡לֶךְ אֶת שְׁ֠נֵי בְּנֵ֨י רִצְפָּ֤ה בַת אַיָּה֙ אֲשֶׁ֣ר יָלְדָ֣ה לְ/שָׁא֔וּל אֶת אַרְמֹנִ֖י וְ/אֶת מְפִבֹ֑שֶׁת וְ/אֶת חֲמֵ֗שֶׁת בְּנֵי֙ מִיכַ֣ל בַּת שָׁא֔וּל אֲשֶׁ֥ר יָלְדָ֛ה לְ/עַדְרִיאֵ֥ל בֶּן בַּרְזִלַּ֖י הַ/מְּחֹלָתִֽי־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/008.yaml
  text: So the king took the two sons of Rizpah daughter of Aiah[a], whom she had borne to Saul—Armoni and Mephibosheth—and the five sons of Michal daughter of Saul, whom she had borne to Adriel son of Barzillai the Meholathite.
translation:
  language: zh_hans
  text: 于是，王把爱雅的女儿利斯巴给扫罗所生的两个儿子——亚摩尼和米非波设——以及扫罗的女儿米甲[a]给米何拉人巴西莱的儿子亚得列所生的五个儿子带走了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本和古代译本作“米拉”，而不是“米甲”。参撒母耳记上18:19，那里说亚得列娶了扫罗的女儿米拉。
    reason: textual_variant
lexical_decisions:
- source_word: וַיִּקַּח
  choice: 于是……带走了
  rationale: 连续式叙事动词推进事件；“于是”体现承接关系，“带走”保留 לקח 在本语境中将这些人带去处置的基本含义，又不提前说出下一节才明确的“交给”。
- source_word: הַמֶּלֶךְ
  choice: 王
  rationale: 原文使用带定冠词的称号，所指虽是大卫，译文仍保留“王”，不以姓名替换。
- source_word: שְׁנֵי בְּנֵי רִצְפָּה בַת אַיָּה
  choice: 爱雅的女儿利斯巴……的两个儿子
  rationale: 按现代汉语习惯重组修饰语，同时准确保留人数、母亲姓名及其父系身份。
- source_word: אֲשֶׁר יָלְדָה לְשָׁאוּל
  choice: 给扫罗所生的
  rationale: ילד 与介词 ל 的结构表明扫罗是孩子的父亲；该译法自然并保留亲子关系。
- source_word: אַרְמֹנִי וְאֶת מְפִבֹשֶׁת
  choice: 亚摩尼和米非波设
  rationale: 依现代中文圣经人名惯例音译；家谱语境可将此米非波设与约拿单之子区分开来。
- source_word: חֲמֵשֶׁת בְּנֵי
  choice: 五个儿子
  rationale: 直接表达数词与复数亲属名词的组合。
- source_word: מִיכַל בַּת שָׁאוּל
  choice: 扫罗的女儿米甲
  rationale: 马所拉文本作“米甲”，正文据此翻译；不因与撒母耳记上18:19的张力而擅自改成“米拉”。
- source_word: אֲשֶׁר יָלְדָה לְעַדְרִיאֵל
  choice: 给……亚得列所生的
  rationale: 与前半节同一结构保持一致，表示亚得列是这些儿子的父亲。
- source_word: בֶּן בַּרְזִלַּי הַמְּחֹלָתִי
  choice: 米何拉人巴西莱的儿子
  rationale: 保留父称和地域称谓；“米何拉人”是自然的现代汉语表达。
theological_decisions:
- issue: 米甲是否为亚得列五个儿子的母亲这一文本与历史张力
  choice: 正文保留马所拉文本的“米甲”，并以脚注说明“米拉”异文。
  alternative: 正文采用“扫罗的女儿米拉”。
  rationale: 现有希伯来语底本明确作“米甲”；撒母耳记上18:19却说亚得列娶的是米拉。译文不应无声地协调两处，而应忠实呈现底本并公开说明重要异文。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。以破折号标出两个儿子的姓名，使较长的家谱句式清晰易读；专名沿用中文圣经中通行的译名。脚注标记置于实际存在异文的“米甲”之后。
