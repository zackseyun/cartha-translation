base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/007.yaml
  text: But the king spared Mephibosheth son of Jonathan[a], son of Saul, because of the oath of Yahweh that was between them, between David and Jonathan son of Saul.
translation:
  language: zh_hans
  text: 王却因那在大卫和扫罗的儿子约拿单之间的耶和华的誓[a]，饶了约拿单的儿子、扫罗的孙子米非波设。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“耶和华的誓”。在此上下文中，通常指大卫和约拿单奉耶和华的名、以他为见证所起的誓。
    reason: 保留原文“耶和华的誓”的字面构词和歧义，同时说明叙事语境中较可能的含义。
lexical_decisions:
- source_word: וַיַּחְמֹל
  choice: 饶了
  rationale: 此处指王没有杀死或交出米非波设。“饶了”准确表达在致死处境中保全其性命的具体含义。
- source_word: הַמֶּלֶךְ
  choice: 王
  rationale: 保留希伯来文对大卫所用的称号，不在正文中直接改为人名。
- source_word: מְפִיבֹשֶׁת
  choice: 米非波设
  rationale: 采用现代中文圣经读者较熟悉的人名音译。
- source_word: בֶּן יְהוֹנָתָן בֶּן שָׁאוּל
  choice: 扫罗的孙子、约拿单的儿子
  rationale: 中文若机械重复“儿子”容易造成米非波设也是扫罗之子的误读；按希伯来谱系关系自然表达，同时保留两代身份。
- source_word: עַל
  choice: 因
  rationale: 这里引出王饶恕米非波设的原因，简洁自然。
- source_word: שְׁבֻעַת יְהוָה
  choice: 在耶和华面前所起的誓
  rationale: 结合叙事语境，表达这誓言以耶和华为见证或在他面前订立的通常含义；脚注保留较为字面的另一种理解。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文圣经传统中广为识别的神名形式。
- source_word: אֲשֶׁר בֵּינֹתָם בֵּין דָּוִד וּבֵין יְהוֹנָתָן
  choice: 大卫和扫罗的儿子约拿单之间
  rationale: 将“他们”所指双方直接并入中文句式，并保留约拿单作为扫罗之子的说明。
theological_decisions:
- issue: “耶和华的誓”的含义
  choice: 大卫与约拿单在耶和华面前所起的誓
  alternative: 耶和华的誓；即由耶和华亲自作出的誓言
  rationale: 上下文更可能指双方奉耶和华之名、以他为见证所立的誓约，而不是耶和华亲自宣誓；以脚注提示字面结构，避免完全排除原文的形式歧义。
- issue: “王”的所指
  choice: 正文保留“王”
  alternative: 直接译作“大卫”
  rationale: 上下文表明王是大卫，但原文使用称号，故予以保留。
translation_notes:
  register: 采用庄重、自然的现代标准普通话。为使因果关系清楚，将原因短语前置；谱系按中文习惯译为“扫罗的孙子、约拿单的儿子”，避免连续两个“儿子”造成关系误解。
