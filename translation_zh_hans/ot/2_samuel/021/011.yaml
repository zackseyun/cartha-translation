  text: And it was reported to David what Rizpah daughter of Aiah, Saul’s concubine, had done.
translation:
  language: zh_hans
  text: 有人把扫罗的妃嫔、爱亚的女儿利斯巴所做的事告诉了大卫。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֻּגַּד
  choice: 有人……告诉了
  rationale: 该动词是被动式，表示消息被告知。汉语若直译为“被告诉”不自然，因此以不定施事者“有人”转换表达，同时保留报告来源未明这一点。
- source_word: לְדָוִד
  choice: 告诉了大卫
  rationale: 介词לְ标示告知的对象；按现代汉语习惯与“告诉”组合表达。
- source_word: אֵת אֲשֶׁר עָשְׂתָה
  choice: 所做的事
  rationale: אֵת אֲשֶׁר引出报告的内容，עָשְׂתָה指已经发生的行为；“所做的事”准确、自然，无须用汉语额外标示过去完成时。
- source_word: רִצְפָּה
  choice: 利斯巴
  rationale: 依照现代中文圣经人名的通行音译。
- source_word: בַת אַיָּה
  choice: 爱雅的女儿
  rationale: 直接保留希伯来文的父系身份说明。
- source_word: פִּלֶגֶשׁ שָׁאוּל
  choice: 扫罗的妃嫔
  rationale: פִּלֶגֶשׁ指地位有别于正妻的女性伴侣；“妃嫔”在王室语境中较“妾”庄重自然，同时没有把她表述为正妻。
theological_decisions: []
