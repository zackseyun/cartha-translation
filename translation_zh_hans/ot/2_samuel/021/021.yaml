  text: וַ/יְחָרֵ֖ף אֶת יִשְׂרָאֵ֑ל וַ/יַּכֵּ֨/הוּ֙ יְה֣וֹנָתָ֔ן בֶּן שמעי אֲחִ֥י דָוִֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/021.yaml
  text: And he defied Israel[a], and Jonathan the son of Shimei, David’s brother, struck him down.
translation:
  language: zh_hans
  text: 他辱骂以色列，大卫的兄弟示每[a]的儿子约拿单就击杀了他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本以及《历代志上》20:7作“示米亚”（或“示米阿”），而不是“示每”。
    reason: textual_variant
lexical_decisions:
- source_word: וַיְחָרֵף
  choice: 辱骂
  rationale: חרף在争战语境中指以侮辱性言语公然挑衅；“辱骂”既保留言语攻击的含义，也不把动作缩减为一般性的“挑战”。
- source_word: אֶת יִשְׂרָאֵל
  choice: 以色列
  rationale: 原文以国家共同体“以色列”为直接宾语；中文直译自然，并保留其集合意义。
- source_word: וַיַּכֵּהוּ
  choice: 击杀了他
  rationale: נכה本义为“击打”，在本段战斗及勇士被杀的语境中表示致命击打；“击杀”兼顾动作意象与结果。
- source_word: יְהוֹנָתָן
  choice: 约拿单
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: בֶּן שמעי
  choice: 示每的儿子
  rationale: 依据所给WLC正文的 שמעי 译作“示每”，不在正文中与平行经文的“示米亚”协调；异文另见脚注。
- source_word: אֲחִי דָוִד
  choice: 大卫的兄弟
  rationale: 按希伯来语同位关系，较自然地修饰紧邻的“示每”，表明示每是大卫的兄弟。中文调整语序，使亲属关系清楚。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“辱骂”保留原文的敌意言语色彩；“击杀”符合战斗叙事。脚注标记置于实际涉及异文的人名“示每”之后，而非“以色列”之后。
