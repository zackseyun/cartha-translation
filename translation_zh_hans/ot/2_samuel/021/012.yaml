  text: וַ/יֵּ֣לֶךְ דָּוִ֗ד וַ/יִּקַּ֞ח אֶת עַצְמ֤וֹת שָׁאוּל֙ וְ/אֶת עַצְמוֹת֙ יְהוֹנָתָ֣ן בְּנ֔/וֹ מֵ/אֵ֕ת בַּעֲלֵ֖י יָבֵ֣ישׁ גִּלְעָ֑ד אֲשֶׁר֩ גָּנְב֨וּ אֹתָ֜/ם מֵ/רְחֹ֣ב בֵּֽית שַׁ֗ן אֲשֶׁ֨ר תלו/ם שם ה/פלשתים בְּ/י֨וֹם הַכּ֧וֹת פְּלִשְׁתִּ֛ים אֶת שָׁא֖וּל בַּ/גִּלְבֹּֽעַ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/012.yaml
  text: Then David went and took the bones of Saul and the bones of Jonathan his son from the citizens of Jabesh-gilead[a], who had stolen them from the public square of Beth-shan[c][b], where the Philistines had hung them on the day the Philistines struck down Saul on Gilboa.
translation:
  language: zh_hans
  text: 于是，大卫前去，从基列·雅比的居民那里取走扫罗和他儿子约拿单的骸骨。这些居民曾从伯·珊的广场偷走这些骸骨；非利士人在基利波[b]击杀扫罗的那一天，曾把他们悬挂在那里[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “悬挂”也可理解为“挂起来示众”；有些译法作“钉挂”，但希伯来文动词本身最直接的意思是“悬挂”。
    reason: lexical_alternative
  - marker: b
    text: 基利波指扫罗阵亡的山区。参撒母耳记上31:8—13。
    reason: cross_reference
lexical_decisions:
- source_word: עַצְמוֹת
  choice: 骸骨
  rationale: 该词直指骨头；在收殓安葬的语境中，“骸骨”既保留希伯来文的具体性，也符合庄重的现代汉语叙事。
- source_word: בַּעֲלֵי יָבֵישׁ גִּלְעָד
  choice: 基列·雅比的居民
  rationale: בַּעֲלֵי与地名连用时指当地人或居民；译作“居民”自然且不把所指限于男性。
- source_word: גָּנְבוּ
  choice: 偷走
  rationale: 该动词通常意为“偷窃”；此处指居民先前秘密取走公开陈列的骸骨，直译“偷走”保留叙事的大胆意味。
- source_word: מֵרְחֹב בֵּית שַׁן
  choice: 从伯·珊的广场上
  rationale: רְחֹב指城中的开阔地或广场；“广场”简洁自然，并保留公开展示的场景。
- source_word: תלו/ם שם
  choice: 曾把他们悬挂在那里
  rationale: תלה最直接的意思是“悬挂”；“他们”依希伯来文宾语代词保留对扫罗和约拿单本人的指称，不擅自具体化为“钉挂”或“示众”。
- source_word: הַכּוֹת ... אֶת שָׁאוּל
  choice: 击杀扫罗
  rationale: נכה在此指非利士人使扫罗遭受致命败亡；“击杀”既保留动词力度，也清楚表达结果。
- source_word: בַּגִּלְבֹּעַ
  choice: 在基利波
  rationale: 原文只说“在/于基利波”，没有明说“山”；正文采用克制译法，并用脚注说明地理背景。
- source_word: וַיֵּלֶךְ ... וַיִּקַּח
  choice: 于是，大卫去……取回
  rationale: 连续的叙事形式推动情节；“于是”自然承接上文。“取回”在此表达大卫从当地居民手中接取这些骸骨，以便重新安葬。
- source_word: יְהוֹנָתָן בְּנוֹ
  choice: 他儿子约拿单
  rationale: 依就近先行词扫罗理解“他”，自然表明约拿单是扫罗的儿子。
theological_decisions: []
