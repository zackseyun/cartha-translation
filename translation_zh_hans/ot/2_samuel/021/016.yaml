base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/016.yaml
  text: And Ishbi-benob[a], who was among the descendants of Rapha, whose spear weighed three hundred shekels of bronze, and who was girded with a new sword[c][b], said that he would strike down David.
translation:
  language: zh_hans
  text: 以实比诺[a]是拉法的后裔之一[b]；他的铜矛重三百舍客勒。他腰间佩着一件新武器[c]，说要击打大卫。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这个希伯来名字的形式不能确定；“以实比诺”依照传统理解。也可能音译为“耶斯比诺”，或将原文辅音作不同切分。
    reason: textual_variant
  - marker: b
    text: 或译：“是拉法所生的人之一。”这句话可能指与利乏音巨人族有关的族系。
    reason: lexical_alternative
  - marker: c
    text: 原文只说“新的”，所修饰的名词被省略；传统上通常理解为“剑”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וישבו בְּנֹב
  choice: 以实比诺
  rationale: 马所拉经文的辅音划分与元音形式都较困难。依传统理解，将其视为人物名最符合本段连续列举巨人勇士的叙事语境；其不确定性保留在脚注中。
- source_word: אֲשֶׁר בִּילִידֵי הָרָפָה
  choice: 是拉法的后裔之一
  rationale: יְלִידֵי 表示出身、族裔或后代；保留“拉法”为专名，不直接解释成“巨人”，以免消除原文的家族或族群意味。
- source_word: וּמִשְׁקַל קֵינוֹ
  choice: 他的矛重
  rationale: קֵין 在此战斗语境中传统上理解为矛或矛杆。中文重组为“他的矛重”自然清楚，同时不改变基本意象。
- source_word: שְׁלֹשׁ מֵאוֹת מִשְׁקַל נְחֹשֶׁת
  choice: 三百舍客勒，是铜制的
  rationale: 保留古代重量单位“舍客勒”，不作可能造成虚假精确感的现代换算。נְחֹשֶׁת 可泛指铜或青铜；此处采用较宽泛、自然的“铜制”。
- source_word: וְהוּא חָגוּר חֲדָשָׁה
  choice: 他腰间佩着一件新武器
  rationale: 原文只有阴性单数形容词“新的”，所修饰的名词省略。传统常补作“剑”，但原文并未明说；正文用“新武器”保留战斗语境，并以脚注说明省略与传统理解。
- source_word: וַיֹּאמֶר לְהַכּוֹת אֶת דָּוִד
  choice: 扬言要击杀大卫
  rationale: 字面结构为“说要击打大卫”，在语境中表达公开的意图或决心。“扬言要击杀”既保留“说”的言语成分，也自然呈现其致命意图。
