base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/015.yaml
  text: And there was war again between the Philistines and Israel[a], and David went down with his servants with him, and they fought against the Philistines, and David grew weary.
translation:
  language: zh_hans
  text: 后来，非利士人又与以色列交战。大卫和他的臣仆[a]一同下去，与非利士人交战；大卫疲乏了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“部下”。希伯来语直译为“臣仆”，常指为君王效力的人，包括随军人员。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּהִי עוֹד מִלְחָמָה
  choice: 后来……又……交战
  rationale: וַתְּהִי引出新的叙事情形，עוֹד表示战事再次发生；现代汉语以“后来……又……”自然承接上下文，并用“交战”表达מִלְחָמָה在此处的敌对战事。
- source_word: לַפְּלִשְׁתִּים אֶת־יִשְׂרָאֵל
  choice: 非利士人……与以色列交战
  rationale: 这一结构表达非利士人与以色列双方敌对；“与……交战”既自然，也不把原文强行解释为某一方单独发动战争。
- source_word: וַיֵּרֶד
  choice: 下去
  rationale: 保留ירד的方向含义；原文没有说明具体目的地，因此不增译“到战场”等信息。
- source_word: וַעֲבָדָיו עִמּוֹ
  choice: 和随同他的臣仆
  rationale: עֲבָדָיו直译为“他的仆人”，在君王及军事语境中指为王效力的人；“臣仆”兼顾王室关系与现代可懂度。“随同他的”明确表达עִמּוֹ。
- source_word: וַיִּלָּחֲמוּ אֶת־פְּלִשְׁתִּים
  choice: 与非利士人交战
  rationale: לחם在此指投入战斗；“与……交战”是自然、准确的现代汉语表达。
- source_word: וַיָּעַף
  choice: 渐渐疲乏了
  rationale: 该动词表示变得疲乏、无力；“渐渐疲乏了”传达状态形成的意味，同时不夸大为完全精疲力竭。
theological_decisions: []
