  text: וַ/יִּקְבְּר֣וּ אֶת עַצְמוֹת שָׁא֣וּל וִ/יהוֹנָֽתָן בְּ֠נ/וֹ בְּ/אֶ֨רֶץ בִּנְיָמִ֜ן בְּ/צֵלָ֗ע בְּ/קֶ֨בֶר֙ קִ֣ישׁ אָבִ֔י/ו וַֽ/יַּעֲשׂ֔וּ כֹּ֥ל אֲשֶׁר צִוָּ֖ה הַ/מֶּ֑לֶךְ וַ/יֵּעָתֵ֧ר אֱלֹהִ֛ים לָ/אָ֖רֶץ אַֽחֲרֵי כֵֽן־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/014.yaml
  text: They buried the bones of Saul and of Jonathan his son in the land of Benjamin[a], in Zela, in the tomb of Kish his father. They did all that the king had commanded, and after that God responded to the plea for the land.
translation:
  language: zh_hans
  text: 他们把扫罗和他儿子约拿单的骸骨葬在便雅悯地的洗拉，即扫罗父亲基士的坟墓里。他们把王所吩咐的一切都办妥了。此后，上帝应允了为这地所作的祈求。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“上帝垂听了为这地的祈求”或“上帝应允了为这地所献的祷告”。希伯来文动词含有对恳求作出有利回应的意思。
    reason: 说明 נִפְעַל 词形的词义范围，并以自然现代汉语保留可行译法。
lexical_decisions:
- source_word: וַיִּקְבְּרוּ
  choice: 他们……葬在
  rationale: 叙事性动词，表示他们埋葬了骸骨；中文用“葬在”自然表达动作及地点。
- source_word: עַצְמוֹת
  choice: 骸骨
  rationale: 保留希伯来文“骨头”的具体含义，同时符合中文安葬语境。
- source_word: שָׁאוּל וִיהוֹנָתָן בְּנוֹ
  choice: 扫罗和他儿子约拿单的骸骨
  rationale: 自然表达两人的骸骨，并明确约拿单与扫罗的父子关系。
- source_word: בְּאֶרֶץ בִּנְיָמִן
  choice: 在便雅悯境内
  rationale: 体现“便雅悯之地”的地域含义，中文简洁自然。
- source_word: בְּצֵלָע
  choice: 在……洗拉
  rationale: 按专名音译，保留地点名称。
- source_word: בְּקֶבֶר קִישׁ אָבִיו
  choice: 在扫罗父亲基士的坟墓里
  rationale: “坟墓”准确传达 קֶבֶר；明确基士是扫罗的父亲，避免中文误以为指约拿单的父亲。
- source_word: וַיַּעֲשׂוּ כֹּל אֲשֶׁר צִוָּה הַמֶּלֶךְ
  choice: 他们把王所吩咐的一切都办妥了
  rationale: 保留“王所吩咐的一切”及完成行动的意思，表达庄重而流畅。
- source_word: וַיֵּעָתֵר אֱלֹהִים
  choice: 上帝应允了……祈求
  rationale: עתר 的尼法勒词形含有对恳求作出有利回应之意；“应允……祈求”在中文中准确、自然。
- source_word: לָאָרֶץ
  choice: 为这地所作的
  rationale: 介词表达关乎或为了这地；结合动词含义，译为“为这地所作的祈求”。
- source_word: אַחֲרֵי כֵן
  choice: 此后
  rationale: 简洁表达前述行动之后发生的结果。
theological_decisions:
- issue: וַיֵּעָתֵר אֱלֹהִים לָאָרֶץ 的含义
  choice: 上帝应允了为这地所作的祈求
  alternative: 上帝为这地受了恳求；上帝垂听了为这地所献的祷告
  rationale: 原文没有独立出现“祈求”一词，但 עתר 的尼法勒本身包含因恳求而施恩回应的语义。正文将这一动词语义自然呈现出来，却不扩展为原文未明说的“医治这地”。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。“骸骨”“安放”“应允”符合叙事和安葬语境；专名使用通行圣经译名。脚注标记置于其所解释的末句之后。
