base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/022.yaml
  text: These four were born to the Rapha in Gath[a], and they fell by the hand of David and by the hand of his servants.
translation:
  language: zh_hans
  text: 这四人都是拉法的后裔，生在迦特[a]；他们都倒在大卫和他臣仆手下。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “拉法”也可译作“那巨人”或“利乏音人”。原文也可按语序理解为“在迦特为拉法所生”；这里大概是说这四人与迦特有关的拉法／巨人族系相连。
    reason: 保留 לְהָרָפָה 的身份及其与 בְּגַת 的修饰关系上的歧义。
lexical_decisions:
- source_word: אַרְבַּעַת אֵלֶּה
  choice: 这四人
  rationale: 准确表达指示词与数词的组合；按上下文补出“人”，使现代汉语自然清楚。
- source_word: יֻלְּדוּ
  choice: 所生的
  rationale: 该动词的被动形式在此表示出生或血统关系；“所生的”既贴近原文，也避免生硬的被动句式。
- source_word: לְהָרָפָה
  choice: 拉法
  rationale: 保留音译，不在正文中断定它是专名、称号、表示“巨人”的普通名词，还是利乏音族类名称。
- source_word: בְּגַת
  choice: 迦特的
  rationale: 结合汉语语序，将地点与“拉法”相连，表达这些人与迦特的拉法传统有关；原文也可理解为“在迦特”，故在脚注中提示。
- source_word: וַיִּפְּלוּ
  choice: 倒在……手下
  rationale: 保留 נפל“倒下”的战争意象；在此语境中自然含有被杀之意。
- source_word: בְיַד
  choice: 在……手下
  rationale: 这是现代汉语中自然的施事表达，同时保留希伯来文“手”的意象。
- source_word: עֲבָדָיו
  choice: 他的臣仆
  rationale: 在君王和军事语境中指服事大卫的属员；“臣仆”比泛称“仆人”更符合此处身份，又不武断地限定为士兵。
theological_decisions:
- issue: הָרָפָה 的身份
  choice: 正文保守音译为“拉法”
  alternative: 译作“巨人”或“利乏音人”，也可将其视为名叫“拉法”的祖先
  rationale: 本节总结前述与巨人勇士交战的记载，并把四人与迦特的拉法／利乏音传统相连。希伯来文可有多种理解，因此正文不替读者消除这种歧义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事用语。“倒在……手下”保留原文战争意象；“臣仆”符合大卫作为君王和军事领袖的语境。
