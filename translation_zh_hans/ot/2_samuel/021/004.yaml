base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/004.yaml
  text: The Gibeonites said to him[a], “We have no claim for silver or gold against Saul or against his house, and it is not for us to put any man in Israel to death.” Then he said[b], “What do you say that I should do for you?”
translation:
  language: zh_hans
  text: 基遍人对他说[a]：“我们不向扫罗和他家索取金银，也无权处死以色列中的任何人[b]。”大卫说：“你们说要我为你们做什么？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我们和扫罗及其家之间，不是金银的问题。”希伯来语是惯用表达，可能指金钱赔偿。
    reason: lexical_alternative
  - marker: b
    text: 原文表达简略，或译：“我们无权在以色列中处死任何人。”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין לִי כֶּסֶף וְזָהָב עִם שָׁאוּל וְעִם בֵּיתוֹ
  choice: 我们并不是要向扫罗和他家索取金银
  rationale: 此处是惯用表达，语境所指不是财物的有无，而是基遍人不向扫罗家索取金钱赔偿。用“索取金银”自然表达索赔含义，同时以“并不是要”保留其否定语气。
- source_word: עִם
  choice: 向
  rationale: עִם通常可译为“与”，但在争议或索赔语境中可标示所针对的一方；汉语用“向扫罗和他家索取”最为自然。
- source_word: וְאֵין לָנוּ אִישׁ לְהָמִית בְּיִשְׂרָאֵל
  choice: 也无权处死以色列中的任何人
  rationale: 该分句较为省略，重点很可能不是没有可杀的人，而是基遍人没有自行处死以色列人的权柄。“无权”清楚传达这一语用含义；脚注保留较贴近字面的另一种理解。
- source_word: אִישׁ
  choice: 任何人
  rationale: 此处אִישׁ是泛指单数。现代汉语以“任何人”自然表达其非特指含义，不必机械保留男性措辞。
- source_word: מָה אַתֶּם אֹמְרִים אֶעֱשֶׂה לָכֶם
  choice: 你们说要我为你们做什么？
  rationale: 希伯来语句式紧凑，意为请对方提出要求。此译文保留“你们说”与“我为你们做”的结构，同时符合现代汉语问句习惯。
- source_word: וַיֹּאמֶר
  choice: 大卫说
  rationale: 原文仅作“他说”，但本节前半已有“对他说”，若继续用代词，汉语中容易误以为仍是基遍人发言。依据上文明确发言者为大卫，在正文中恢复其姓名可避免歧义，并不改变所指。
theological_decisions:
- issue: 基遍人所说“无……人可杀”的性质
  choice: 正文译作“无权处死”，理解为他们没有自行执行死刑的权柄
  alternative: 较直译作“我们没有一个人可在以色列中处死”
  rationale: 上下文中大卫正询问补偿条件，基遍人的回答似乎划分了他们自身的权限，而非断言不存在处死对象。不过原文句法省略，脚注保留较贴字面的可能译法，避免把解释绝对化。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“索取金银”体现赔偿语境；“处死”比“杀死”更符合司法或权柄层面的语境。为避免连续代词造成发言者混淆，后一句将原文的“他说”明确为“大卫说”。
