base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/018.yaml
  text: After this[a], there was again war with the Philistines at Gob, and then Sibbecai the Hushathite struck down Saph[b], who was among the descendants of Rapha.
translation:
  language: zh_hans
  text: 这事以后，在歌伯又有一场与非利士人的战争。那时，户沙人西比该击杀了撒弗[a]；撒弗是拉法的后裔之一[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文本作“撒弗”；历代志上20:4的平行记载作“西派”。
    reason: textual_variant
  - marker: b
    text: 或译：“撒弗是那巨人的后裔之一。”这里的希伯来文既可能指名叫“拉法”的人物，也可能指巨人或利乏音人的族系。
    reason: alternative_reading
lexical_decisions:
- source_word: אַחֲרֵי כֵן
  choice: 这事以后
  rationale: 这是常见的叙事时间衔接语，既保留前后次序，也符合现代汉语表达。
- source_word: וַתְּהִי עוֹד הַמִּלְחָמָה
  choice: 又有一场……战争
  rationale: “又”准确表达 עוֹד 所表示的再次发生；补出量词“一场”，使汉语自然，但不增加事件内容。
- source_word: בְּגֹב
  choice: 在歌伯
  rationale: 介词 בְּ 在此指战事发生的地点，译作“在”最为自然；地名按音译处理。
- source_word: עִם פְּלִשְׁתִּים
  choice: 与非利士人的
  rationale: עִם 表示交战的对象；“非利士人”采用现代中文圣经语境中通行的族名。
- source_word: אָז
  choice: 那时
  rationale: 标明随后发生的事件，保留希伯来文的叙事推进，同时比生硬重复“然后”更庄重自然。
- source_word: הִכָּה
  choice: 击杀了
  rationale: נכה 的基本义为击打，在战士阵亡名单的语境中指致命击倒；“击杀”兼顾动作力度和结果。
- source_word: סִבְּכַי הַחֻשָׁתִי
  choice: 户沙人西比该
  rationale: 人名音译为“西比该”；族属词 הַחֻשָׁתִי 直译为“户沙人”，不对其具体地理来源作额外推定。
- source_word: סַף
  choice: 撒弗
  rationale: 依马所拉文本的读音音译；历代志上20:4的平行记载作另一名称形式，留在脚注说明。
- source_word: אֲשֶׁר בִּילִדֵי הָרָפָה
  choice: 撒弗是拉法的后裔之一
  rationale: 将关系从句转换为自然汉语独立分句；“后裔之一”表达其属于该谱系，又避免把 הָרָפָה 在正文中直接解释为“巨人”。
theological_decisions:
- issue: הָרָפָה 应视为专名“拉法”，还是解释为“那巨人”或“利乏音人”
  choice: 正文采用专名“拉法”
  alternative: 那巨人；利乏音人
  rationale: 在“……的后裔”这一谱系式表达中，按专名处理能够较直接地保留希伯来文形式，也不在正文中预先解决其究竟指个人、祖系还是巨人族系的歧义；传统的“巨人”理解在脚注中保留。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。保留“歌伯、户沙人、西比该、撒弗、拉法”等专名的音译；用“又有一场……战争”和“击杀”呈现简洁有力的战事叙述。脚注标记分别紧随“撒弗”和“拉法的后裔之一”，以准确对应名称异文和谱系释义两项说明。
