base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/003.yaml
  text: And the princes of the Ammonites said to Hanun their lord[a], “Is David honoring your father in your sight because he has sent comforters to you? Has not David sent his servants to you in order to search the city, to spy it out[c][b], and to overthrow it?”
translation:
  language: zh_hans
  text: 亚扪人的首领对他们的主哈嫩说：“大卫派人来安慰你，你真以为他这是尊重你父亲吗？他派臣仆到你这里来，不正是为了察看这城，窥探城中虚实，并把城倾覆吗？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׂרֵי בְנֵי עַמּוֹן
  choice: 亚扪人的首领
  rationale: שָׂרִים可指王公、官长或领袖；这里是向哈嫩进言的宫廷权贵。“首领”既体现政治地位，又比“王子们”更能避免误解为王室子嗣。
- source_word: אֲדֹנֵיהֶם
  choice: 他们的主
  rationale: אָדוֹן在此是对人间统治者的称谓。“他们的主”保留臣属关系与原文的尊称，不作神性理解。
- source_word: הַמְכַבֵּד
  choice: 尊重
  rationale: כבד在此表示给予尊荣、表示敬意，并非神学意义上的“荣耀”。现代汉语中“尊重”自然准确。
- source_word: בְּעֵינֶיךָ
  choice: 你真以为
  rationale: 原义为“在你眼中”，在这里表达对哈嫩判断的质疑；汉语以“你真以为”自然传达反问语气，而不把首领们的指控写成叙述事实。
- source_word: מְנַחֲמִים
  choice: 派人来安慰你
  rationale: 该词指前来慰问的人；结合上节父丧语境，用“派人来安慰你”比名词“安慰者”更符合现代汉语。
- source_word: הֲלוֹא
  choice: 不正是……吗
  rationale: 这是预期听者赞同的反问。“不正是……吗”保留首领们带诱导性的猜疑口吻。
- source_word: חֲקוֹר אֶת הָעִיר
  choice: 察看这城
  rationale: חקר表示查考、探察；“察看”保留其调查意味，也适合随后军事侦察的语境。
- source_word: וּלְרַגְּלָהּ
  choice: 窥探城中虚实
  rationale: רגל的加强词干表示侦察、窥探。补出“城中虚实”是自然汉语表达，明确其军事侦察含义，同时仍以“城”为受词。
- source_word: וּלְהָפְכָהּ
  choice: 把城倾覆
  rationale: הפך可指翻转、倾覆；军事语境中“倾覆”保留原词形象及摧毁政权或城市的含义，不限定为彻底毁灭。
- source_word: עֲבָדָיו
  choice: 臣仆
  rationale: עבד在此指大卫派出的王室人员。“臣仆”兼顾他们与君王的臣属关系及使者身份，避免现代“奴隶”的误读。
theological_decisions:
- issue: 首领们的政治猜疑是否由叙述者认可
  choice: 以连续反问呈现他们的指控
  alternative: 改成肯定陈述，仿佛大卫确实意在侦察并倾覆该城
  rationale: 这些话出自哈嫩的首领，并非叙述者的裁断；反问形式保留其诱导性猜疑，也不预先判定指控为真。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。保留宫廷政治语境和两层反问；不机械复制希伯来语“在你眼中”的习语，以“你真以为”传达其语用功能。三项目的动作依原文次序呈现为察看、窥探、倾覆。
