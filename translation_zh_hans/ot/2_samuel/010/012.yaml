  text: חֲזַ֤ק וְ/נִתְחַזַּק֙ בְּעַד עַמֵּ֔/נוּ וּ/בְעַ֖ד עָרֵ֣י אֱלֹהֵ֑י/נוּ וַֽ/יהוָ֔ה יַעֲשֶׂ֥ה הַ/טּ֖וֹב בְּ/עֵינָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/012.yaml
  text: Be strong[a], and let us be strong for our people and for the cities of our God[b], and may Yahweh do what is good in his eyes.
translation:
  language: zh_hans
  text: “要刚强！让我们为我们的人民和我们上帝的城邑奋勇刚强[a]！愿耶和华行他眼中看为好的事[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“让我们显出刚强”，或“让我们振作起来”。希伯来语动词带有使自己刚强、表现出刚强的意味。
    reason: lexical_alternative
  - marker: b
    text: 或译：“耶和华必行他眼中看为好的事。”这里的希伯来语形式也可表示简单将来；正文按交托于耶和华旨意的愿望来译。
    reason: alternative_reading
lexical_decisions:
- source_word: חֲזַק
  choice: 要刚强
  rationale: 这是חזק的第二人称阳性单数命令式，直接勉励对方刚强；“要刚强”简洁自然，并与下句呼应。
- source_word: וְנִתְחַזַּק
  choice: 让我们奋勇刚强
  rationale: 这是חזק的Hitpael第一人称复数鼓励式，含振作自己、表现刚强之意；“奋勇刚强”既保留主动振奋的色彩，也符合战事语境。
- source_word: בְּעַד
  choice: 为了
  rationale: 在此表示为保护、维护某人或某地而行动；“为了”在现代汉语中自然，并能涵盖“为……而战”的语境。
- source_word: עַמֵּנוּ
  choice: 我们的人民
  rationale: עַם通常指一个民族或人民，不宜缩窄为“军队”；此处与“我们上帝的城邑”并列。
- source_word: עָרֵי אֱלֹהֵינוּ
  choice: 我们上帝的城邑
  rationale: 按希伯来语构造直译为属于或归于“我们上帝”的众城；“城邑”庄重而清楚。
- source_word: יהוה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名形式呈现四字神名，区别于称号“主”。
- source_word: יַעֲשֶׂה הַטּוֹב בְּעֵינָיו
  choice: 愿耶和华照他眼中看为好的去做
  rationale: 保留“在他眼中为好”的希伯来语表达，同时将未完成式在勉励句后的语气理解为交托性的愿望。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。中文正文采用广为人知的“耶和华”，既按专名处理，也避免以“主”遮蔽原文神名。
- issue: יַעֲשֶׂה的语气
  choice: 愿耶和华……去做
  alternative: 耶和华必照他眼中看为好的去做
  rationale: 在两个勉励式之后，可理解为将结果交托给上帝的愿望；但希伯来语形式本身也容许简单将来意义，因此以脚注保留另一读法。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“奋勇刚强”传达战场勉励和反身振作之意；“照他眼中看为好的去做”有意保留原文惯用语及其神学张力。
