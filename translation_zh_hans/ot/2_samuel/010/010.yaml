  text: וְ/אֵת֙ יֶ֣תֶר הָ/עָ֔ם נָתַ֕ן בְּ/יַ֖ד אַבְשַׁ֣י אָחִ֑י/ו וַֽ/יַּעֲרֹ֕ךְ לִ/קְרַ֖את בְּנֵ֥י עַמּֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/010.yaml
  text: And the rest of the people he put under the command of Abishai his brother[c][b][a], and he drew them up to meet the sons of Ammon.
translation:
  language: zh_hans
  text: 他把其余的军兵交在他兄弟亚比筛手下[b]，又列阵[c]迎战亚扪人[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“亚扪之子”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“交在亚比筛手中”，意思是把军兵托付给他统领。
    reason: lexical_alternative
  - marker: c
    text: 也可译作“排好阵势”。原文动词指把军队排列成战斗队形。
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶתֶר הָעָם
  choice: 其余的军兵
  rationale: יֶתֶר指剩余的部分；הָעָם字面为“人民”，但在此军事语境中指其余的作战人员。译作“其余的军兵”既传达所指，也避免现代读者误解为一般百姓。
- source_word: נָתַן בְּיַד
  choice: 交在……手下
  rationale: 该短语字面为“交在……手中”，在这里是把军兵托付给某人统领的惯用表达。“交在……手下”自然地保留了权柄和指挥关系。
- source_word: אַבְשַׁי
  choice: 亚比筛
  rationale: 按现代中文圣经人名的通行音译处理。
- source_word: אָחִיו
  choice: 他兄弟
  rationale: 原文明确说明亚比筛与前文人物的兄弟关系，予以保留；中文无需添加“的”也自然庄重。
- source_word: וַיַּעֲרֹךְ
  choice: 又列阵
  rationale: ערך在军事语境中表示把军队排成战斗阵势。“列阵”简洁、自然，并保留原文未明说宾语及主语承接略有张力的表达。
- source_word: לִקְרַאת
  choice: 迎战
  rationale: 该词基本义为“迎向、相遇”；在交战语境中译作“迎战”，能自然表达敌对相遇，而不添加战果。
- source_word: בְּנֵי עַמּוֹן
  choice: 亚扪人
  rationale: 原文字面为“亚扪之子”，是指亚扪族人的常用民族称谓；正文采用现代汉语自然的“亚扪人”，脚注保留其字面形式。
theological_decisions: []
