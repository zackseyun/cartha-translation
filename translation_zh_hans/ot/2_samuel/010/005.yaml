base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/005.yaml
  text: When they told David[a], he sent to meet them, for the men were greatly humiliated. And the king said, “Stay at Jericho until your beards have grown[b], and then return.”
translation:
  language: zh_hans
  text: 有人把这事告诉了大卫，他就派人去迎接他们[a]，因为这些人深感羞辱[b]。王说：“你们留在耶利哥，等你们的胡须长起来，再回来。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“他派去迎接他们”；所派的是人，但原文没有明确称他们为“使者”。
    reason: lexical_alternative
  - marker: b
    text: 或译“非常蒙羞”或“极其难堪”。原词着重表达受辱、蒙羞的状态。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגִּדוּ לְדָוִד
  choice: 有人把这事告诉了大卫
  rationale: 动词为复数，但主语未明说；用“有人”保留不确定性。“这事”由上下文自然补出，避免现代汉语中突兀的无宾语表达。
- source_word: וַיִּשְׁלַח לִקְרָאתָם
  choice: 他就派人去迎接他们
  rationale: 希伯来文直译为“他派去迎接他们”，虽未明说所派的是谁，但汉语需要补出隐含的“人”才自然；不进一步限定为“使者”。
- source_word: כִּי
  choice: 因为
  rationale: 在此引出大卫采取行动的原因，保留明确的因果关系。
- source_word: הָאֲנָשִׁים
  choice: 这些人
  rationale: 指前文遭受羞辱的大卫臣仆；“这些人”在汉语叙事中指代清楚。
- source_word: נִכְלָמִים מְאֹד
  choice: 深感羞辱
  rationale: כלם的尼法勒形式表达蒙羞、受辱的状态，מְאֹד加强程度；“深感羞辱”兼顾外在受辱与当事人的羞耻感。
- source_word: וַיֹּאמֶר הַמֶּלֶךְ
  choice: 王说
  rationale: 保留原文明确使用的称号“王”；上下文已清楚表明是大卫。
- source_word: שְׁבוּ בִירֵחוֹ
  choice: 你们留在耶利哥
  rationale: ישׁב在此不是单指坐下，而是暂时停留；“留在”符合语境和现代汉语习惯。
- source_word: עַד יְצַמַּח זְקַנְכֶם
  choice: 等你们的胡须长起来
  rationale: צמח意为萌生、长出；“长起来”保留原文措辞，不把上下文所暗示的“重新长出”直接写入正文。
- source_word: וְשַׁבְתֶּם
  choice: 再回来
  rationale: שׁוב意为返回；“再”自然表达“等到……然后……”的时间次序。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。以“有人”保留报告者身份不明，以“派人”补足汉语表达所需的隐含宾语，同时不额外指定其身份；“胡须长起来”保留原文，没有将上下文暗示的“重新”明文化。
