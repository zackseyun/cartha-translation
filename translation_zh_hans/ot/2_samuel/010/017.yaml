base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/017.yaml
  text: When it was reported to David[a], he gathered all Israel, crossed the Jordan, and came to Helam. Then Aram drew up in battle formation to meet David and fought with him.
translation:
  language: zh_hans
  text: 这事被报告给大卫后，他就召集全以色列，渡过约旦河，来到希兰。亚兰人列阵迎战大卫，与他交战。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“攻打他。”希伯来文直译为“与他交战”，指同对手作战。
    reason: 说明介词עִם在战争习语中的敌对含义，并保留可采用的译法。
lexical_decisions:
- source_word: וַיֻּגַּד לְדָוִד
  choice: 这事传报给大卫以后
  rationale: 保留被动表达，不指明传信者；“以后”自然体现句首连接词推动叙事的作用。“这事”承接上文所报告的消息。
- source_word: וַיֶּאֱסֹף אֶת כָּל יִשְׂרָאֵל
  choice: 他就召集全以色列
  rationale: אָסַף表示召集、聚集；保留“全以色列”这一广泛的集合称谓，不擅自限定为“全军”。
- source_word: וַיַּעֲבֹר אֶת הַיַּרְדֵּן
  choice: 渡过约旦河
  rationale: 准确表达עָבַר在此处“渡过河流”的意思，并采用现代汉语常用说法。
- source_word: וַיָּבֹא חֵלָאמָה
  choice: 来到希兰
  rationale: 地名后的方向词尾表示朝该地而去；“来到”在汉语中自然表达抵达该处。
- source_word: וַיַּעַרְכוּ אֲרָם
  choice: 亚兰人列阵
  rationale: עָרַךְ在军事语境中指排列阵势、部署迎战；用“亚兰人”自然表达希伯来文以国名作集合主语的用法。
- source_word: לִקְרַאת דָּוִד
  choice: 迎战大卫
  rationale: לִקְרַאת本义为前去相遇；在明确的战争语境中，“迎战”既保留相向而行的意思，也自然传达敌对遭遇。
- source_word: וַיִּלָּחֲמוּ עִמּוֹ
  choice: 与他交战
  rationale: 贴近希伯来文“与他作战”的结构；“交战”在现代汉语中明确表示敌对作战，不会被理解为并肩作战。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重的现代标准汉语。叙事简洁连贯；保留“全以色列”的集合表达，并以“列阵迎战”清楚呈现军事语境。脚注标记置于其实际说明的末句之后。
