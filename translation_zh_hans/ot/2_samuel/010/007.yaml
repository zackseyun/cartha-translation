base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/007.yaml
  text: When David heard[a], he sent Joab and all the army of the mighty men.
translation:
  language: zh_hans
  text: 大卫听说后，就派出约押和全军的勇士。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“约押和全军，就是那些勇士”。希伯来文中的“勇士”可理解为对“全军”的限定，也可看作与“全军”同位。
    reason: 保留原文短语结构的两种可能理解，避免断定“勇士”必指独立的精锐部队。
lexical_decisions:
- source_word: וַיִּשְׁמַע דָּוִד
  choice: 大卫听说后
  rationale: שׁמע在此意为“听见、听说”；原文未明说所听之事的宾语，中文用“听说”承接上文，并以“后”自然表达连续叙事关系。
- source_word: וַיִּשְׁלַח אֶת יוֹאָב
  choice: 就派出约押
  rationale: שׁלח在军事语境中指派遣；“派出”比单用“派”更清楚地表达约押被差往作战，同时保留原文简洁语气。
- source_word: וְאֵת כָּל הַצָּבָא הַגִּבֹּרִים
  choice: 和全军勇士
  rationale: צָבָא指军队，גִּבֹּרִים指勇士或英勇战士。“全军勇士”是自然简洁的现代汉语，也保留“勇士”是限定军队成员的读法；另一种同位语理解收入脚注。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事文体。“大卫听说后，就……”自然呈现希伯来文连续动词的先后关系；“全军勇士”保持简洁，并借脚注说明句法歧义。
