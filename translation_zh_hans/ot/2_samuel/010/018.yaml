source:
  edition: WLC
  text: וַ/יָּ֣נָס אֲרָם֮ מִ/פְּנֵ֣י יִשְׂרָאֵל֒ וַ/יַּהֲרֹ֨ג דָּוִ֜ד מֵ/אֲרָ֗ם שְׁבַ֤ע מֵאוֹת֙ רֶ֔כֶב וְ/אַרְבָּעִ֥ים אֶ֖לֶף פָּרָשִׁ֑ים וְ/אֵ֨ת שׁוֹבַ֧ךְ שַׂר צְבָא֛/וֹ הִכָּ֖ה וַ/יָּ֥מָת שָֽׁם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/018.yaml
  text: Aram fled from before Israel[a], and David killed seven hundred charioteers and forty thousand horsemen from Aram. He also struck down Shobach, the commander of their army[b], and he died there.
translation:
  language: zh_hans
  text: 亚兰人从以色列人面前逃跑。大卫杀了亚兰的战车兵七百人[a]、骑兵四万人，又击倒了其军队的统帅朔法[b]；朔法就死在那里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“七百战车（或战车部队）”。确切所指可能是战车部队，所以正文译作“战车兵”。《历代志上》19:18作“七千辆战车”。
    reason: textual_variant
  - marker: b
    text: 或译“他的军队的统帅”。希伯来文的所属后缀是单数。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּנָס אֲרָם מִפְּנֵי יִשְׂרָאֵל
  choice: 亚兰人从以色列人面前逃跑
  rationale: אֲרָם在此集合性地指亚兰人；מִפְּנֵי字面为“从……面前”，在战争语境中表示面对敌军败逃。译文保留这一意象，同时符合现代汉语。
- source_word: וַיַּהֲרֹג דָּוִד
  choice: 大卫杀了
  rationale: הרג直接表示“杀死”。采用清楚自然的现代汉语，并与后文较宽泛的נכה区分。
- source_word: שְׁבַע מֵאוֹת רֶכֶב
  choice: 战车兵七百人
  rationale: רֶכֶב可指战车或战车部队；因其在伤亡统计中作人的受词，正文采用“战车兵”，但以脚注保留原文指称上的困难及平行经文的异文。
- source_word: וְאַרְבָּעִים אֶלֶף פָּרָשִׁים
  choice: 骑兵四万人
  rationale: פָּרָשִׁים指骑马作战者或骑兵；“骑兵”简洁、自然，符合军事语境。
- source_word: וְאֵת שׁוֹבַךְ
  choice: 朔法
  rationale: 采用该人物在现代中文圣经传统中通行且易辨认的音译。
- source_word: שַׂר צְבָאוֹ
  choice: 其军队的统帅
  rationale: שַׂר在军事语境中是“统帅”，צָבָא是“军队”。“其”既可按希伯来语单数后缀理解为“他的”，也可在汉语中承接亚兰一方，避免正文武断消除所指歧义。
- source_word: הִכָּה
  choice: 击倒了
  rationale: נכה可指击打、击倒或击败。后接“他就死在那里”，故“击倒”既表明致命结果，又不与前面的הרג完全合并。
- source_word: וַיָּמָת שָׁם
  choice: 朔法就死在那里
  rationale: 直接表达原文，并以姓名明确汉语中的代词所指，不增添“当场”或“战场上”等原文未明说的信息。
