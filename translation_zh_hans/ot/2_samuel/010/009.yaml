base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/009.yaml
  text: When Joab saw that the battle line was set against him in front and in the rear[b][a], he chose from all the choice men of Israel and arrayed them to meet Aram.
translation:
  language: zh_hans
  text: 约押看见自己前后都有敌军摆开阵势，就从以色列所有精锐战士中挑选人[a]，列阵迎战亚兰[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较直译：“从以色列所有精选的战士中挑选。”
    reason: lexical_alternative
  - marker: b
    text: “亚兰”在这里指亚兰军队。
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּרְא
  choice: 看见
  rationale: 保留希伯来叙事常用的基本动词，同时在语境中自然包含察觉战局之意。
- source_word: פְּנֵי הַמִּלְחָמָה הָיְתָה אֵלָיו
  choice: 战线向他摆开
  rationale: פְּנֵי הַמִּלְחָמָה直译为“战争的面”，军事语境中指战线或战斗正面；“向他摆开”表达其朝向约押、与他对阵的态势。
- source_word: מִפָּנִים וּמֵאָחוֹר
  choice: 从前后两面
  rationale: 准确保留前后夹击的空间对照，现代汉语简洁自然。
- source_word: וַיִּבְחַר מִכֹּל בְּחוּרֵי בְיִשְׂרָאֵל
  choice: 从以色列所有精兵中挑选人手
  rationale: בְּחוּרֵי在此指精选、精锐的战士；מִכֹּל表示从全体精兵当中选取。“挑选人手”补足汉语所需宾语而不限定原文未说明的人数。
- source_word: וַיַּעֲרֹךְ
  choice: 列阵
  rationale: 该动词在军事语境中指按战斗队形部署军队；“列阵”简洁、庄重且准确。
- source_word: לִקְרַאת אֲרָם
  choice: 迎战亚兰
  rationale: לִקְרַאת有迎向、面对之意，此处为军事交锋；保留专名“亚兰”，并以脚注说明实际所指。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的军事叙事用语。“战线从前后两面向他摆开”保留原文战斗正面朝向约押的图像，也清楚呈现前后受敌的局势；不把“亚兰”改成后世地名。
