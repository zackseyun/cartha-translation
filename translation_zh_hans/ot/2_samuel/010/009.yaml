revisions:
- from: 约押看见战线从前后两面向他摆开，就从以色列所有精兵中挑选人手[a]，列阵迎战亚兰[b]。
  to: 约押看见自己前后都有敌军摆开阵势，就从以色列所有精锐战士中挑选人[a]，列阵迎战亚兰[b]。
  rationale: 修订以“自己前后都有敌军摆开阵势”自然而明确地表达战斗正面从前后针对约押的处境，未将原文仅暗示的具体战术细节扩展为包围或夹击。将“精兵”明确为“精锐战士”，并删除“人手”的事务性语感；“挑选人”仍保留原文未明示选取数量的开放性。脚注a相应采用完整、自然的较直译表述。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T05:26:43Z'
review_pass:
  verdict: revise
  source_fidelity: 译文对约押察觉前后受敌、从以色列精锐中选人并列阵面对亚兰的基本意思把握正确。可是“战线从前后两面向他摆开”把“战线”说成从两个方向展开，在汉语中不够通顺，也未清楚表达约押前后皆有敌对阵势这一战术处境。
  naturalness: “从以色列所有精兵中挑选人手”可理解，但“挑选人手”略带现代行政或劳务语感，军事叙事中“挑选精锐战士”更自然。改为“看见自己前后都有敌军摆开阵势”清晰、庄重，也合乎现代汉语军事叙述。
  terminology: “约押”“以色列”“亚兰”均规范；“亚兰”保留原文专名而以脚注说明其集体军事所指，处理恰当。“列阵迎战”准确传达军事性的וַיַּעֲרֹךְ和לִקְרַאת。
  issues:
  - severity: medium
    issue: “战线从前后两面向他摆开”句法及战术图像不够自然、明确。
    rationale: 希伯来文说明战斗正面在约押的前方和后方都针对他，表示前后受敌；汉语“战线从前后两面向他摆开”容易令人不清楚是谁摆开战线，且“战线”从前后两面“向他”展开搭配生硬。
  - severity: low
    issue: “挑选人手”语域略偏现代事务性用语。
    rationale: 原文所指为以色列的精选战士；以“挑选精锐战士”表达更直接，也保留从全体精锐中选取的含义。
  revised_text: 约押看见自己前后都有敌军摆开阵势，就从以色列所有精锐战士中挑选人[a]，列阵迎战亚兰[b]。
  revised_footnotes:
