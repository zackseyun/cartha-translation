base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/008.yaml
  text: Then the sons of Ammon came out and drew up for battle at the entrance of the gate[b][a], while Aram of Zobah and Rehob and the men of Tob and Maacah were by themselves in the field.
translation:
  language: zh_hans
  text: 亚扪人[a]出来，在城门口列阵迎战；琐巴和利合的亚兰人，以及陀伯人[b]和玛迦人，则另在田野列阵。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“亚扪之子”。
    reason: lexical_alternative
  - marker: b
    text: “陀伯人”也可理解为地名“伊施陀伯”。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּצְאוּ
  choice: 出来
  rationale: יצא在叙事中表示“出去、出来”；此处是军队从城中出到城门一带，“出来”符合场景和现代汉语表达。
- source_word: בְּנֵי עַמּוֹן
  choice: 亚扪人
  rationale: 希伯来语直译为“亚扪之子”，实际是族群称谓；现代汉语以“亚扪人”表达自然准确，并以脚注保留原文形式。
- source_word: וַיַּעַרְכוּ מִלְחָמָה
  choice: 列阵迎战
  rationale: ערך与מלחמה连用，指军队排成战阵。“列阵迎战”简明地传达其军事含义。
- source_word: פֶּתַח הַשָּׁעַר
  choice: 在城门口
  rationale: פתח指入口或开口；“城门口”是自然的现代汉语，也准确交代亚扪军的阵地。
- source_word: וַאֲרַם צוֹבָא וּרְחוֹב
  choice: 琐巴和利合的亚兰人
  rationale: אֲרַם可指亚兰或亚兰人；在并列雇佣军的语境中译作“亚兰人”，并将琐巴、利合理解为其所属地域。
- source_word: וְאִישׁ טוֹב
  choice: 陀伯人
  rationale: 该词组可理解为“陀伯人”，也可能是地名“伊施陀伯”；正文采用语境清楚的族属表达，并用脚注保留歧义。
- source_word: וּמַעֲכָה
  choice: 玛迦人
  rationale: 玛迦在本节与其他参战群体并列，汉语补出“人”以清楚表达军队来源。
- source_word: לְבַדָּם בַּשָּׂדֶה
  choice: 则另在田野列阵
  rationale: לְבַדָּם强调与亚扪军分开；בַּשָּׂדֶה是“在田野”。末尾补出“列阵”承接上文，使省略关系在汉语中清楚，同时不把田野过度具体化为“旷野”。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“城门口”与“田野”形成原文中的位置对照；分号呈现亚扪军与其盟军分开布阵的结构。所有专名使用常见中文圣经译名。
