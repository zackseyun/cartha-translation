base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/013.yaml
  text: Then Joab and the people who were with him advanced to battle against Aram[a], and they fled before him.
translation:
  language: zh_hans
  text: 于是，约押和跟随他的人上前迎战亚兰人，他们就在他面前逃跑了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּגַּשׁ
  choice: 上前迎战
  rationale: נגשׁ本义是“靠近、上前”；与לַמִּלְחָמָה连用时，表示向前投入战斗。“上前迎战”既保留动作方向，也自然呈现军事语境。
- source_word: וְהָעָם אֲשֶׁר עִמּוֹ
  choice: 和跟随他的人
  rationale: עָם字面为“人民、众人”，此处指约押所率领的作战人员。“跟随他的人”贴近原文，又避免把“军队”等较具体的解释直接写入正文。
- source_word: בַּאֲרָם
  choice: 亚兰人
  rationale: 原文形式为地名“亚兰”，但介词ב在此语境中标示交战对象，实际所指是亚兰军兵。现代汉语用“迎战亚兰人”比“迎战亚兰”更清楚自然。
- source_word: וַיָּנֻסוּ
  choice: 逃跑了
  rationale: נוּס表示逃走、溃逃；“逃跑了”直接表达其含义，不将其弱化为可能较有秩序的“撤退”。
- source_word: מִפָּנָיו
  choice: 在他面前
  rationale: 希伯来语惯用表达字面为“从他面前”，意为因他进逼而逃。“在他面前逃跑”保留原文意象；单数代词承接领军的约押。
- source_word: יוֹאָב
  choice: 约押
  rationale: 采用现代中文圣经中通行的人名译法。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重且易懂的叙事体。“于是”承接前文战局；“上前迎战”简洁呈现军队推进并交战的含义。原文的“亚兰”在这里借国名指其军队，正文按汉语习惯译作“亚兰人”，无须另加脚注。
