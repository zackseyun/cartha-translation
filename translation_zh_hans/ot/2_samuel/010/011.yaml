  text: וַ/יֹּ֗אמֶר אִם תֶּחֱזַ֤ק אֲרָם֙ מִמֶּ֔/נִּי וְ/הָיִ֥תָה לִּ֖/י לִֽ/ישׁוּעָ֑ה וְ/אִם בְּנֵ֤י עַמּוֹן֙ יֶחֱזְק֣וּ מִמְּ/ךָ֔ וְ/הָלַכְתִּ֖י לְ/הוֹשִׁ֥יעַֽ לָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/011.yaml
  text: He said[a], “If Aram is too strong for me, then you shall help me; but if the Ammonites are too strong for you[b], then I will go to help you.”
translation:
  language: zh_hans
  text: 他说：“如果亚兰胜过我[a]，你就援救我[b]；如果亚扪人胜过你，我就去援救你。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“如果亚兰强过我”或“如果亚兰对我占了上风”。
    reason: 原文חזק在这里可表示比对方强或胜过对方。
  - marker: b
    text: 原文直译近于“你就成为我的救援”；后半句则用动词说“我就去援救你”。
    reason: 说明原文前后两个相关表达在语法形式上的差异，同时保留其战场救援之意。
lexical_decisions:
- source_word: תֶּחֱזַק / יֶחֱזְקוּ
  choice: 胜过
  rationale: חזק在军事语境中表示强于对方、占据上风。“胜过”自然表达敌军取得优势的条件，也保留“强过”的词义范围。
- source_word: אֲרָם
  choice: 亚兰
  rationale: 原文使用国家或族群名称“亚兰”，不以较晚的地缘名称替代；上下文已表明所指为亚兰军队。
- source_word: מִמֶּנִּי / מִמְּךָ
  choice: 胜过我／胜过你
  rationale: 介词מִן在חזק之后表示比较或优势，汉语以“胜过”连同宾语自然体现这一关系。
- source_word: בְּנֵי עַמּוֹן
  choice: 亚扪人
  rationale: 这是现代汉语表达该族群的通行方式，比直译“亚扪之子”自然。
- source_word: וְהָיְתָה לִּי לִישׁוּעָה
  choice: 你就援救我
  rationale: 原文是“成为我的救援”一类表达，在战场语境中指前来支援。译作“援救我”简洁自然，并由脚注保留其名词性表达。
- source_word: וְהָלַכְתִּי לְהוֹשִׁיעַ לָךְ
  choice: 我就去援救你
  rationale: הלך加目的不定式表示前去实施救援；“去援救你”既保留移动含义，也符合战场协同的语境。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。以“援救”表达军事支援，避免“拯救”在此处可能产生的过强神学联想；保留前后句的条件式平行结构，并以“去”体现后半句明确的移动动词。
