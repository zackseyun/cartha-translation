  text: וַ/יִּקַּ֨ח חָנ֜וּן אֶת עַבְדֵ֣י דָוִ֗ד וַ/יְגַלַּח֙ אֶת חֲצִ֣י זְקָנָ֔/ם וַ/יִּכְרֹ֧ת אֶת מַדְוֵי/הֶ֛ם בַּ/חֵ֖צִי עַ֣ד שְׁתֽוֹתֵי/הֶ֑ם וַֽ/יְשַׁלְּחֵֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/004.yaml
  text: So Hanun took David’s servants[a], shaved off half of their beards, cut off their garments in the middle up to their buttocks, and sent them away.
translation:
  language: zh_hans
  text: 于是，哈嫩带来大卫的臣仆，剃去他们各人一半的胡须，又把他们的衣服从中间剪短，剪到臀部[a]，然后打发他们走。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“直到他们坐下的部位”或“直到他们的私处”。这里的希伯来词很少见，所指的确切身体部位仍有争议；其要点是，哈嫩把他们的衣服剪得很短，使他们蒙羞。
    reason: 说明罕见希伯来词的词义不确定性，并保留可能的解剖学指向。
lexical_decisions:
- source_word: וַיִּקַּח
  choice: 抓住
  rationale: לקח的基本义是“取、拿”；在此，哈嫩控制住使臣并加以羞辱，现代汉语用“抓住”能自然表达这一叙事动作，但不采用更强烈的“逮捕”。
- source_word: עַבְדֵי דָוִד
  choice: 大卫的臣仆
  rationale: עבד可指奴仆、臣属或王室官员；上下文中的人物是奉大卫差遣的使臣。“臣仆”既体现他们隶属君王，也不误导为受奴役者。
- source_word: וַיְגַלַּח אֶת חֲצִי זְקָנָם
  choice: 剃去他们的半边胡须
  rationale: 忠实保留“剃”和“半边”的具体羞辱行为；“他们的半边胡须”在汉语中自然地表示每个人的胡须被剃去一半。
- source_word: וַיִּכְרֹת אֶת מַדְוֵיהֶם בַּחֵצִי
  choice: 从中间割断他们的衣服
  rationale: כרת表示割断，מַדְוֵיהֶם泛指他们的衣服；“从中间”保留בַּחֵצִי的空间含义，不武断指定衣服的具体种类。
- source_word: עַד שְׁתוֹתֵיהֶם
  choice: 直到臀部
  rationale: 罕见词שְׁתוֹת的确切身体部位有争议，可能指臀部、坐处或私密部位；正文采用语境上直接且不过度扩大的“臀部”，并以脚注保留歧义。
- source_word: וַיְשַׁלְּחֵם
  choice: 把他们赶走
  rationale: שלח在这里指羞辱之后将他们送走；“赶走”符合敌意语境，也保持简洁的叙事推进。
theological_decisions: []
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。以“臣仆”体现王室差遣关系；对公开羞辱的动作直述而不粗俗。脚注标在争议词“臀部”之后，而非标在“臣仆”之后。
