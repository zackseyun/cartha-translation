revisions:
- from: 亚扪人见自己已经惹大卫厌恶[a]，就派人去雇了伯利合的亚兰人[b]和琐巴的亚兰人，共两万名步兵；又雇了玛迦王所率的一千人，以及陀伯人[c]一万二千人。
  to: 亚扪人见大卫已经厌恶他们[a]，就派人去雇佣伯利合的亚兰人[b]和琐巴的亚兰人，共两万名步兵；又雇佣玛迦王及其一千人，以及陀伯人[c]一万二千人。
  rationale: 修订仅改善现代汉语的自然性，并减少对玛迦王与一千人之间具体统率关系的解释性补足；不改变原文的军事名单、数量或叙事含义。脚注锚点a、b、c均保留并与正文对应。
