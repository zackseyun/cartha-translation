source:
  edition: WLC
  text: וַ/יִּרְאוּ֙ בְּנֵ֣י עַמּ֔וֹן כִּ֥י נִבְאֲשׁ֖וּ בְּ/דָוִ֑ד וַ/יִּשְׁלְח֣וּ בְנֵֽי עַמּ֡וֹן וַ/יִּשְׂכְּרוּ֩ אֶת אֲרַ֨ם בֵּית רְח֜וֹב וְ/אֶת אֲרַ֣ם צוֹבָ֗א עֶשְׂרִ֥ים אֶ֨לֶף֙ רַגְלִ֔י וְ/אֶת מֶ֤לֶךְ מַֽעֲכָה֙ אֶ֣לֶף אִ֔ישׁ וְ/אִ֣ישׁ ט֔וֹב שְׁנֵים עָשָׂ֥ר אֶ֖לֶף אִֽישׁ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/006.yaml
  text: When the sons of Ammon saw that they had become odious to David[a], the sons of Ammon sent and hired the Arameans of Beth-rehob and the Arameans of Zobah, twenty thousand foot soldiers, and the king of Maacah with one thousand men, and the men of Tob[c][b], twelve thousand men.
translation:
  language: zh_hans
  text: 亚扪人见大卫已经厌恶他们[a]，就派人去雇佣伯利合的亚兰人[b]和琐巴的亚兰人，共两万名步兵；又雇佣玛迦王及其一千人，以及陀伯人[c]一万二千人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译可作“他们在大卫面前成了臭味”，意思是他们变得令大卫厌恶。
    reason: lexical_alternative
  - marker: b
    text: 原文作“亚兰”；传统上也译作“叙利亚”或“叙利亚人”。
    reason: lexical_alternative
  - marker: c
    text: 也可能译作“伊施陀伯”，把这个词组理解为地名或族名；正文译作“陀伯人”。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּרְאוּ
  choice: 见
  rationale: 保留ראה“看见”的基本意义；在“见……已经”这一叙事结构中，自然表达“察觉、意识到”。
- source_word: בְּנֵי עַמּוֹן
  choice: 亚扪人
  rationale: 希伯来语直译为“亚扪之子”，现代汉语用族名“亚扪人”更自然清楚，所指不变。
- source_word: נִבְאֲשׁוּ בְּדָוִד
  choice: 已经惹大卫厌恶
  rationale: באש的字面意象是“发臭”，此处惯用义为变得令人憎恶、冒犯对方。“惹大卫厌恶”以自然汉语传达其语用意义，并用脚注保留原文意象。
- source_word: וַיִּשְׁלְחוּ
  choice: 派人去
  rationale: 原文只说“派遣”，未明说受派者；汉语若单说“派去”不完整，因此用“派人去”表达隐含但必要的施事对象，不具体增添“使者”。
- source_word: וַיִּשְׂכְּרוּ
  choice: 雇了
  rationale: שׂכר在此指付酬取得军事援助；上下文已经显明雇佣军队之意，无须在正文增译“作雇佣兵”。
- source_word: אֲרַם בֵּית רְחוֹב
  choice: 伯利合的亚兰人
  rationale: אֲרַם按历史族称译为“亚兰人”；בֵּית רְחוֹב作为地名采用中文圣经传统中易辨认的译名“伯利合”。
- source_word: אֲרַם צוֹבָא
  choice: 琐巴的亚兰人
  rationale: 将族称与地域关系明确译出；“亚兰人”比传统的“叙利亚人”更直接对应原文及其历史背景。
- source_word: עֶשְׂרִים אֶלֶף רַגְלִי
  choice: 共两万名步兵
  rationale: רַגְלִי指徒步作战的军士，译作“步兵”简洁准确；“共”表明人数合计前述两支亚兰军队。
- source_word: מֶלֶךְ מַעֲכָה
  choice: 玛迦王
  rationale: 这是“玛迦的王”，不是名叫玛迦的王；汉语“玛迦王”自然表达属地君王。
- source_word: אֶלֶף אִישׁ
  choice: 所率的一千人
  rationale: 原文为“玛迦王，一千人”，语义上指王带来或统率的一千人；加入“所率”使汉语关系清楚，不改变人数。
- source_word: אִישׁ טוֹב
  choice: 陀伯人
  rationale: 结合军事名单和历代志上19:6的平行记载，较可能指陀伯地区的人；原文形式也可能被理解为专名“伊施陀伯”，故以脚注保留歧义。
- source_word: שְׁנֵים עָשָׂר אֶלֶף אִישׁ
  choice: 一万二千人
  rationale: 直接保留原文的军队人数和简洁列举语气。
