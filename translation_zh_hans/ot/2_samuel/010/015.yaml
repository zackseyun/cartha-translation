  yaml_path: translation/ot/2_samuel/010/015.yaml
  text: When Aram saw that it had been defeated before Israel[a], they gathered together.
translation:
  language: zh_hans
  text: 亚兰人见自己在以色列面前败下阵来，就聚集在一起。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“亚兰见自己在以色列面前败下阵来，他们就聚集在一起。”原文用单数形式的专名“亚兰”统称亚兰人。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: 见……就
  rationale: 连续式叙事动词推进情节；用“见……就……”自然表达先看见/察觉、后采取行动的时间关系。
- source_word: אֲרָם
  choice: 亚兰人
  rationale: 原文专名“亚兰”虽为单数形式，此处集体指亚兰一方的人或军队；汉语用“亚兰人”可与后面的复数动词意义自然衔接。
- source_word: כִּי
  choice: （见）……
  rationale: 此处引出所察觉的内容，汉语不必另译“即/说”，直接接宾语从句最自然。
- source_word: נִגַּף
  choice: 败下阵来
  rationale: נגף 的尼法勒式在战争语境中表示遭击败；“败下阵来”清楚传达军事失败，又不额外限定败退方式。
- source_word: לִפְנֵי
  choice: 在……面前
  rationale: 保留原文空间性习语及其战争语境中的“敌不过”意味，避免直接改译为施事性的“被……击败”。
- source_word: יִשְׂרָאֵל
  choice: 以色列
  rationale: 按通行形式音译专名。
- source_word: וַיֵּאָסְפוּ
  choice: 就聚集
  rationale: אָסף 的尼法勒式意为聚集、集合；“聚集”贴近原文，不像“重整军队”那样加入军事解释。
- source_word: יָחַד
  choice: 在一起
  rationale: 准确表达副词“共同、一起”，自然修饰聚集这一行动。
