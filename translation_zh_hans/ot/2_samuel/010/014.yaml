base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/014.yaml
  text: And when the sons of Ammon saw that Aram had fled[a], they fled before Abishai and entered the city[c][b]. Then Joab returned from against the sons of Ammon and came to Jerusalem.
translation:
  language: zh_hans
  text: 亚扪人[a]见亚兰人[b]已经逃跑，就从亚比筛面前逃跑，进了那城[c]。于是约押从与亚扪人的交战中撤回，来到耶路撒冷。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“亚扪之子”。
    reason: lexical_alternative
  - marker: b
    text: 原文作“亚兰”；此处按集体含义指亚兰人。
    reason: lexical_alternative
  - marker: c
    text: 原文作“那城”，本节没有注明城名。
    reason: textual_clarity
lexical_decisions:
- source_word: וּבְנֵי עַמּוֹן
  choice: 亚扪人
  rationale: 原文直译为“亚扪之子”，是指亚扪民族的希伯来语亲族称谓；现代汉语用“亚扪人”自然清楚，并以脚注保留原文字面形式。
- source_word: רָאוּ כִּי נָס אֲרָם
  choice: 见亚兰人已经逃跑
  rationale: “见”保留感知动词 ראה；נָס 所述逃跑先于亚扪人的反应，以“已经逃跑”表达叙事时序。אֲרָם 形式上是地名“亚兰”，这里按集体含义指参战的亚兰人。
- source_word: וַיָּנֻסוּ מִפְּנֵי אֲבִישַׁי
  choice: 也从亚比筛面前逃跑
  rationale: 保留 מִפְּנֵי“从……面前”的空间和军事意味；“也”体现亚兰人和亚扪人相继溃逃。
- source_word: וַיָּבֹאוּ הָעִיר
  choice: 进了城
  rationale: בוא 与带定冠词的“城”结合，表示进入那座城；原文未在本节明说城名，因此正文不作补足。
- source_word: וַיָּשָׁב יוֹאָב מֵעַל בְּנֵי עַמּוֹן
  choice: 于是约押从与亚扪人的交战中撤回
  rationale: שׁוב 表示转回、返回；מֵעַל 在军事语境中不是单纯离开某地，而是从针对亚扪人的战事中撤离。此译法自然表达该含义。
- source_word: וַיָּבֹא יְרוּשָׁלִָם
  choice: 回到耶路撒冷
  rationale: בוא 本义为“来/到”；承接约押撤回的叙事，汉语以“回到”准确表达目的地和行动方向。
theological_decisions: []
translation_notes:
