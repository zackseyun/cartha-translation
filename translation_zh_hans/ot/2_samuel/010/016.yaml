  text: וַ/יִּשְׁלַ֣ח הֲדַדְעֶ֗זֶר וַ/יֹּצֵ֤א אֶת אֲרָם֙ אֲשֶׁר֙ מֵ/עֵ֣בֶר הַ/נָּהָ֔ר וַ/יָּבֹ֖אוּ חֵילָ֑ם וְ/שׁוֹבַ֛ךְ שַׂר צְבָ֥א הֲדַדְעֶ֖זֶר לִ/פְנֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/016.yaml
  text: Hadadezer sent and brought out the Arameans who were beyond the River[a], and they came to Helam[c][b], with Shobak the commander of Hadadezer’s army before them.
translation:
  language: zh_hans
  text: 哈大底谢派人把大河[a]那边的亚兰人调出来；他们来到希兰。哈大底谢的军队统帅朔巴克[b]走在他们前面[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 即幼发拉底河。
    reason: cultural_note
  - marker: b
    text: “朔巴克”传统也译作“朔法”。
    reason: lexical_alternative
  - marker: c
    text: “走在他们前面”可能表示他率领他们，或位于队伍前列。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: 派人
  rationale: 该动词在连续叙事中意为“差遣、派出”。原文未明说受差遣者是谁；汉语用“派人”可自然表达他发令召调军队的意思，而不增添具体人物。
- source_word: וַיֹּצֵא אֶת אֲרָם
  choice: 把……亚兰人调出来
  rationale: יצא 的使役形表示使其出来；在军事语境中，“调出来”既保留使役含义，也自然传达调动兵力之意。אֲרָם 此处按参战群体译为“亚兰人”，而非单指“亚兰”地域。
- source_word: מֵעֵבֶר הַנָּהָר
  choice: 大河那边
  rationale: 原文直译为“那河的另一边”。“大河”是现代中文圣经语体中对这条特指河流的自然表达；正文不直接补出“幼发拉底河”，以保留原文措辞，并在脚注说明。
- source_word: וַיָּבֹאוּ חֵילָם
  choice: 他们来到希兰
  rationale: 将 חֵילָם 视为地名 Helam；“希兰”采用简明、易读且已有中文传统的音译。
- source_word: וְשׁוֹבַךְ
  choice: 朔巴克
  rationale: 依马所拉文本 שׁוֹבַךְ 的辅音和读音作较直接的中文音译；传统译名另列脚注。
- source_word: שַׂר צְבָא
  choice: 军队统帅
  rationale: 该组合指军队的最高指挥者。“军队统帅”准确、庄重，也符合现代汉语。
- source_word: לִפְנֵיהֶם
  choice: 走在他们前面
  rationale: 保留原文“在他们前面”的空间表达，同时用“走在”使叙事自然；军事语境下可能含有率领之意，但不在正文中将其单一化。
theological_decisions: []
