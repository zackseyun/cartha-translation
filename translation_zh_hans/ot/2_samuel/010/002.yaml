base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/002.yaml
  text: And David said[a], “I will show kindness to Hanun son of Nahash, just as his father showed kindness to me.” So David sent by the hand of his servants to comfort him concerning his father, and David’s servants came into the land of the Ammonites.
translation:
  language: zh_hans
  text: 大卫说：“我要善待拿辖的儿子哈嫩，正如他父亲曾善待我。”于是，大卫派臣仆去，就他父亲的事安慰他[a]。大卫的臣仆就到了亚扪人的境内。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“就他父亲的事安慰他”。这里的希伯来语表达很可能指哈嫩的父亲去世后，大卫差人向他致慰问。
    reason: 说明לְנַחֲמוֹ אֶל־אָבִיו在丧亲语境中表示慰问，同时保留正文未明说死亡的表达。
lexical_decisions:
- source_word: חֶסֶד
  choice: 善待
  rationale: 本节两次出现，指双方之间以恩惠和忠诚相待；在这一外交往来语境中，“善待”自然明白，也避免把词义限定为专门的盟约术语。
- source_word: חָנוּן בֶּן נָחָשׁ
  choice: 拿辖的儿子哈嫩
  rationale: 按现代中文圣经人名惯例音译，并清楚保留父子关系。
- source_word: כַּאֲשֶׁר עָשָׂה אָבִיו עִמָּדִי חֶסֶד
  choice: 因为他父亲曾善待我
  rationale: כַּאֲשֶׁר本可译作“正如”，但在大卫说明行动理由的直接引语中，中文用“因为”自然呈现以往恩惠所构成的回报依据；没有增添超出原文的内容。
- source_word: לְנַחֲמוֹ אֶל אָבִיו
  choice: 为他父亲的事安慰他
  rationale: 保留介词短语与“安慰”的关系，不直接把父亲死亡写入正文；上下文表明这是丧亲慰问。
- source_word: בְּיַד עֲבָדָיו
  choice: 派臣仆去
  rationale: 希伯来语“借他臣仆之手”表示行动经由这些臣仆执行；现代中文以“派臣仆去”自然表达这一代理关系。
- source_word: עַבְדֵי דָוִד
  choice: 大卫的臣仆
  rationale: 在王室叙事中，“臣仆”兼顾其服事和使者身份，比单纯“仆人”更符合语境。
- source_word: אֶרֶץ בְּנֵי עַמּוֹן
  choice: 亚扪人的境内
  rationale: בְּנֵי עַמּוֹן是族名“亚扪人”；“境内”自然表达进入其国土。
