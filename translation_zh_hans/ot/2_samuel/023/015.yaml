  text: And David longed and said[a], “Who will give me water to drink from the well of Bethlehem that is by the gate?”
translation:
  language: zh_hans
  text: 大卫渴望，说[a]：“谁能给我打来伯利恒城门旁那口井里的水喝？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可较意译为：“但愿有人给我打来伯利恒城门旁那口井里的水喝！”希伯来文以“谁能……？”的问句表达渴望。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְאַוֶּה
  choice: 很想喝那里的水
  rationale: 该词的 Hitpael 形式表达强烈愿望。结合下文所说的水，用“很想喝那里的水”自然传达其渴望，同时避免生硬的“渴慕”。“那里的”承接上下文地点信息，并未另加具体地点。
- source_word: וַיֹּאמַר
  choice: 就说
  rationale: 这是普通的“说”。原文未明确表示“自言自语”或“感叹”，因此不作强化处理。
- source_word: מִי
  choice: 谁能
  rationale: 保留希伯来文“谁……？”的问句形式，同时在现代汉语中自然表达带有愿望色彩的感叹。也可意译为“但愿有人……”，见脚注。
- source_word: יַשְׁקֵנִי
  choice: 给我打水来喝
  rationale: שקה 的 Hiphil 形式意为给人水喝。因水来自井中，汉语“打水来喝”符合具体场景，也完整表达取水给大卫喝的意思。
- source_word: מַיִם
  choice: 水
  rationale: 直接对应原词。
- source_word: מִבֹּאר
  choice: 那口井里的水
  rationale: בְּאֵר 通常指井，不指蓄水池。通过汉语量词“口”和处所结构自然表达“从井中来的水”。
- source_word: בֵּית לֶחֶם
  choice: 伯利恒
  rationale: 采用现代中文圣经中通行的地名音译。
- source_word: אֲשֶׁר בַּשָּׁעַר
  choice: 城门旁
  rationale: 该短语限定伯利恒的那口井。“城门旁”既清楚表达位置，也避免将其误解为井在城门内部。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。正文保留原文问句的形式及其愿望意味；脚注提供更动态的感叹式译法。“打水来喝”适合井边取水的语境，但不增添取水者身份或大卫命令他人的含义。
