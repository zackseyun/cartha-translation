base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/023.yaml
  text: He was honored among the thirty[a], but he did not attain to the three[c][b]; and David appointed him over his bodyguard.
translation:
  language: zh_hans
  text: 他在三十勇士中备受尊重[a]，却没有达到三勇士的地位[b]。大卫派他管理自己的卫队[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他比三十勇士更受尊重。”这里的希伯来文结构既可理解为“在……之中”，也可理解为“比……更”。
    reason: lexical_alternative
  - marker: b
    text: 直译：“却没有到三勇士那里。”意思可能是他没有达到那三位杰出勇士的等级。
    reason: lexical_alternative
  - marker: c
    text: “卫队”所译的希伯来词是“米示玛阿特”，也可理解为“听命于他的人”“他的管辖”或“他的命令”。这里按军事语境译为“卫队”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן הַשְּׁלֹשִׁים
  choice: 在三十勇士中
  rationale: מִן 在这里既可能表示置身于一个群体之中，也可能带比较意味。正文采用群体内的理解，符合勇士名录的语境；比较读法保留在脚注中。
- source_word: נִכְבָּד
  choice: 备受尊重
  rationale: כבד 的尼法勒式表示“受尊重、被看重”。此译保留被动含义，也符合现代汉语表达；是否隐含比较级则不在正文中强行确定。
- source_word: וְאֶל הַשְּׁלֹשָׁה לֹא בָא
  choice: 却没有达到三勇士的地位
  rationale: בוא אֶל 字面为“来到、达到”，在这里用于身份或等级的比较。“达到……的地位”自然地表达他未列入最高三勇士之意，同时在脚注保留原文意象。
- source_word: וַיְשִׂמֵהוּ
  choice: 大卫派他管理
  rationale: שׂים 基本义为“放置、设立”，在任命职务的语境中可自然译为“派……管理”。
- source_word: אֶל מִשְׁמַעְתּוֹ
  choice: 管理自己的卫队
  rationale: מִשְׁמַעַת 可指命令、管辖范围，或听命于某人的一群人；在大卫的军事宫廷语境中，“卫队”是较可能的具体所指，但其他理解在脚注中保留。
