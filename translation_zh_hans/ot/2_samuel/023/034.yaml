  text: אֱלִיפֶ֥לֶט בֶּן אֲחַסְבַּ֖י בֶּן הַ/מַּֽעֲכָתִ֑י אֱלִיעָ֥ם בֶּן אֲחִיתֹ֖פֶל הַ/גִּלֹנִֽי־־ס־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/034.yaml
  text: Eliphelet son of Ahasbai son of the Maacathite[a], Eliam son of Ahithophel the Gilonite.
translation:
  language: zh_hans
  text: 以利法列是亚哈斯拜的儿子；亚哈斯拜是玛迦人之子[a]。以连是基罗人亚希多弗的儿子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“以利法列是玛迦人亚哈斯拜的儿子；以连是基罗人亚希多弗的儿子。”这里的关系可有不同理解；另参《历代志上》11:35–36的平行记载。
    reason: 保留希伯来语名单中同位关系的句法歧义，并提示平行经文所带来的文本比较问题。
lexical_decisions:
- source_word: אֱלִיפֶלֶט
  choice: 以利法列
  rationale: 按希伯来语人名转写，并采用现代中文圣经读者较熟悉的译名形式。
- source_word: בֶּן
  choice: ……的儿子／……之子
  rationale: 在勇士名录及父子关系中通常表示直接的父子关系；依句法需要分别用现代自然表达和较紧凑表达。
- source_word: אֲחַסְבַּי
  choice: 亚哈斯拜
  rationale: 按希伯来语形式音译人名。
- source_word: הַמַּעֲכָתִי
  choice: 玛迦人
  rationale: 这是带冠词的族属或地域称谓；译作“玛迦人”既保留身份标记，也符合自然中文。
- source_word: אֱלִיעָם
  choice: 以连
  rationale: 按希伯来语人名转写，并采用中文圣经传统中常见的形式。
- source_word: אֲחִיתֹפֶל
  choice: 亚希多弗
  rationale: 按希伯来语人名转写，并采用中文圣经传统中通行的形式。
- source_word: הַגִּלֹנִי
  choice: 基罗人
  rationale: 该词是由地名基罗构成的地域称谓；译作“基罗人”保留希伯来语的身份形态。
theological_decisions:
- issue: “玛迦人”与前面两个名字之间的句法归属
  choice: 正文依马所拉文本的连续词序，理解为“亚哈斯拜是玛迦人之子”
  alternative: 将“玛迦人”视为亚哈斯拜的同位称谓，即“玛迦人亚哈斯拜的儿子”
  rationale: 希伯来文本连续出现“以利法列—儿子—亚哈斯拜—儿子—玛迦人”，表面上支持两重父子链；但名单体裁、同位结构的可能性以及《历代志上》11:35–36的平行材料使另一分析仍然可行，因此以脚注保留歧义。
translation_notes:
  register: 采用现代、庄重而清楚的名单体表达。用分号和完整短句拆开密集的人名关系，以免中文误读；正文仍紧贴马所拉文本词序，并以脚注保存另一种可行分析。
