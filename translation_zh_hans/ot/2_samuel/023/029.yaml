  yaml_path: translation/ot/2_samuel/023/029.yaml
  text: Heleb son of Baanah the Netophathite[a], Ittai son of Ribai from Gibeah of the sons of Benjamin;
translation:
  language: zh_hans
  text: 尼陀法人、巴拿的儿子希立；利拜的儿子以太，来自便雅悯子孙的基比亚[a]；
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“来自便雅悯人的基比亚”。希伯来文直译为“来自便雅悯子孙的基比亚”。
    reason: 原文以“便雅悯子孙”限定基比亚，既可较直译地保留这一说法，也可按族属自然译为“便雅悯人的”。
lexical_decisions:
- source_word: חֵלֶב
  choice: 希立
  rationale: 人名采用现代中文圣经中通行、易辨识的译名。
- source_word: בֶּן
  choice: ……的儿子
  rationale: 在勇士名录中直接表达父子关系，符合现代汉语习惯。
- source_word: בַּעֲנָה
  choice: 巴拿
  rationale: 按希伯来语人名音译，并采用中文圣经通行形式。
- source_word: הַנְּטֹפָתִי
  choice: 尼陀法人
  rationale: 带冠词的籍贯或族属称谓，指来自尼陀法或与该地相关的人；译作“尼陀法人”简洁自然。
- source_word: אִתַּי
  choice: 以太
  rationale: 按希伯来语人名音译，并采用中文圣经通行形式。
- source_word: רִיבַי
  choice: 利拜
  rationale: 按希伯来语人名音译，并采用中文圣经通行形式。
- source_word: מִגִּבְעַת
  choice: 来自……基比亚
  rationale: 前缀介词 מִן 表示来源或籍贯，因此明确译出“来自”。
- source_word: בְּנֵי בִנְיָמִן
  choice: 便雅悯子孙的
  rationale: 保留希伯来语“便雅悯的众子/子孙”这一表达，并在汉语中用来限定基比亚。
