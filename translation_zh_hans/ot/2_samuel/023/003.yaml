  text: אָמַר֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל לִ֥/י דִבֶּ֖ר צ֣וּר יִשְׂרָאֵ֑ל מוֹשֵׁל֙ בָּ/אָדָ֔ם צַדִּ֕יק מוֹשֵׁ֖ל יִרְאַ֥ת אֱלֹהִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/003.yaml
  text: 'The God of Israel has spoken[a]; the Rock of Israel has said to me: One who rules over mankind justly, ruling in the fear of God[b],'
translation:
  language: zh_hans
  text: 以色列的上帝说；以色列的磐石对我说：“那以公义治理人类[a]、敬畏上帝而掌权的人[b]，”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “人类”原文为אָדָם，也可译作“人”；此处可泛指全体人。
    reason: lexical_alternative
  - marker: b
    text: 有些解释认为这句话具有弥赛亚性意义，视之为对理想君王的描述，并在弥赛亚身上得到应验。
    reason: alternative_reading
lexical_decisions:
- source_word: אָמַר
  choice: 说了
  rationale: 完成式引出神谕；“说了”简洁保留已然发言的语气，并与下句形成平行。
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: 以色列的上帝
  rationale: 按构造词组直译，指以色列的上帝；现代汉语自然使用“的”。
- source_word: לִי דִבֶּר
  choice: 对我说道
  rationale: לִי最自然地表示话语的对象，即上帝向大卫说话；不采用可能但较弱的“论到我”。
- source_word: צוּר יִשְׂרָאֵל
  choice: 以色列的磐石
  rationale: 保留צוּר作为上帝称号的比喻，传达稳固、保护等意蕴，不作解释性改写。
- source_word: מוֹשֵׁל בָּאָדָם
  choice: 治理人类
  rationale: 分词表示掌权者或治理行为；בָּאָדָם在此指治理人类。“人类”自然表达אָדָם的集合义。
- source_word: צַדִּיק
  choice: 以公义
  rationale: 原词形式上是形容词“公义的”，在高度凝练的诗句中可作述语或在意义上修饰治理；译作“以公义”使现代汉语通顺，同时保留公义治理的核心含义。
- source_word: מוֹשֵׁל יִרְאַת אֱלֹהִים
  choice: 存敬畏上帝之心掌权
  rationale: 希伯来文省略了现代汉语所需的关系表达；此译保留יִרְאַת אֱלֹהִים“敬畏上帝”的意义，并表达掌权者在敬畏上帝中施行统治。
- source_word: אֱלֹהִים
  choice: 上帝
  rationale: 此处复数形式依希伯来语惯用法指独一的上帝，故用单数称谓。
theological_decisions:
- issue: 弥赛亚性解读与一般王权原则
  choice: 正文将此句译为对公义、敬畏上帝之掌权者的理想描述，不直接指明弥赛亚。
  alternative: 把此句明确译成关于弥赛亚君王的预言。
  rationale: 希伯来文本本身没有在本节明说“弥赛亚”，既可作为理想君王的原则，也可在更广的正典脉络中具有弥赛亚意义；正文保留这种张力，脚注提示后一种理解。
- issue: צַדִּיק的句法功能
  choice: 理解为在意义上修饰治理，即“以公义治理”。
  alternative: 理解为对掌权者的述语描述，即“掌权者是公义的”。
  rationale: 原诗句极其凝练，两种分析意义相近；“以公义治理”在汉语中更自然，也与平行的“存敬畏上帝之心掌权”协调，但不否认“公义的掌权者”这一句法可能。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留“磐石”这一圣经诗歌中的神圣称号；用“存敬畏上帝之心”自然表达希伯来文的凝练结构。句末逗号保留本节与下一节在句法和诗意上的连续性。
