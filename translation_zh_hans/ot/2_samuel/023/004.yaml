  text: he is like the light of morning when the sun rises[a], a morning without clouds; from brightness, from rain[b], grass from the earth.
translation:
  language: zh_hans
  text: 他如同清晨的光，太阳升起，早晨无云；雨后晴光中，嫩草从地里萌生[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较直译：“又如清晨的光，太阳升起；早晨，无云；从光辉，从雨水，草从地里。”希伯来语此处是承接上一节、句法高度省略的诗句。末句各短语之间的确切关系并不完全明确；也可理解为描绘雨后晴光中草木萌生的景象。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְאוֹר
  choice: 他如同……的光
  rationale: 希伯来语以连接词和比较介词引出比喻，承接上一节对公义掌权者的描述；中文补出“他”，使省略结构清楚自然。
- source_word: בֹּקֶר
  choice: 清晨／早晨
  rationale: 两个 בֹּקֶר 均指早晨；依中文搭配分别译作“清晨的光”和“无云的早晨”，保留诗意复现。
- source_word: יִזְרַח שָׁמֶשׁ
  choice: 太阳升起时照耀
  rationale: זרח 可表达发光，也可用于太阳升起；此译兼顾两层意象，不把词义限缩为单纯的时间从句。
- source_word: בֹּקֶר לֹא עָבוֹת
  choice: 无云的早晨
  rationale: 忠实表达“早晨，没有云”的简练画面，同时符合现代汉语。
- source_word: מִנֹּגַהּ מִמָּטָר
  choice: 因雨后的光辉
  rationale: 原文两个 מִן 的关系高度压缩。正文以自然中文呈现雨后晴光与生长的图景，脚注保留较直译形式及其歧义。
- source_word: דֶּשֶׁא
  choice: 嫩草
  rationale: דֶּשֶׁא 指新鲜萌发的青草或青绿植物；“嫩草”比笼统的“草”更能传达新生意象。
- source_word: מֵאָרֶץ
  choice: 从地里萌生
  rationale: 原文直为“从地上／地里”，动词省略；补出“萌生”使中文完整，并从上下文显明草木出土的图景。
theological_decisions:
- issue: 比喻的隐含主语
  choice: 补出“他”，指上一节敬畏上帝、公义掌权的人。
  alternative: 保留片段式的“又如清晨的光……”。
  rationale: 希伯来诗句无明说的主语，但语境清楚承接上一节。中文补出代词是句法明晰化，并未额外限定其神学身份。
- issue: 末句各意象之间的关系
  choice: 译为雨后光辉之下嫩草从地里萌生。
  alternative: 形式直译为“从光辉，从雨水，草从地里”。
  rationale: 原文介词关系浓缩而不完全明确。正文传达最自然的气象与生长图景，脚注同时保存原文较生硬但真实的歧义，避免把因果机制说得过实。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“他如同”衔接上文，“嫩草从地里萌生”使希伯来语省略式诗句在中文中可读；两则脚注保留原文句法的简约、歧义及可供选择的直译。
