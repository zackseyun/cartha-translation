  text: 希斯罗[a]，迦密人[b]；帕莱，亚比人[c]；
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “希斯罗”或译“哈斯罗”。
    reason: lexical_alternative
  - marker: b
    text: 这里的“迦密人”是指来自迦密的人，与后世的加尔默罗修会无关。
