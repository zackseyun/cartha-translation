lexical_decisions:
- source_word: חצרו
  choice: 希斯罗
  rationale: 这是大卫勇士名录中的人名，按希伯来语马所拉读音作音译；“希斯罗”较自然地对应 חֶצְרוֹ，同时脚注保留“哈斯罗”这一可能译音。
- source_word: הַכַּרְמְלִי
  choice: 迦密人
  rationale: 这是带定冠词的来源形容词，意为来自迦密的人。译作“迦密人”既简洁，也避免现代读者误以为是后世加尔默罗修会成员。
- source_word: פַּעֲרַי
  choice: 帕莱
  rationale: 这是人名，按希伯来语音译；“帕莱”简明地反映其读音。
- source_word: הָאַרְבִּי
  choice: 亚拉伯人
  rationale: 这是带定冠词的地域称谓，可能指来自名为亚拉伯的地方之人。译成“亚拉伯人”保留名录的简洁形式，但不将其误解为泛指阿拉伯民族。
