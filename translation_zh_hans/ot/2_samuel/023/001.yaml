base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/001.yaml
  text: 'These are the last words of David: An oracle of David son of Jesse[a], an oracle of the man raised on high, the anointed of the God of Jacob[c][b], and the sweet singer of Israel.'
translation:
  language: zh_hans
  text: '以下是大卫最后的话：


    耶西的儿子大卫的宣言[a]，


    那被高举之人的宣言；


    雅各的上帝所膏立者[b]，


    以色列诗歌的美妙歌者[c]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “宣言”也可译作“话语”或“郑重声明”。原文用的是常见于庄严或先知性言论的正式引语词。
    reason: lexical_alternative
  - marker: b
    text: 直译“雅各的上帝的受膏者”。这里直接指大卫，也带有君王和弥赛亚的意味。
    reason: alternative_reading
  - marker: c
    text: 也可译作“以色列所喜爱的歌者”或“以色列的甜美诗歌者”。原文为简练的称谓短语，可表达大卫与以色列诗歌相关、为人所喜爱的身份。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה דִּבְרֵי דָוִד הָאַחֲרֹנִים
  choice: 以下是大卫最后的话
  rationale: 直接表达本节引入总结性言论的作用；“最后的话”保留“最后、末后”的基本含义，不添加原文没有的时间副词。
- source_word: נְאֻם
  choice: 宣告
  rationale: 该词是庄严言论、尤其是先知性言论的正式引语标记。“宣告”在现代中文中庄重自然，也不把它过度限定为某一种预言体裁。
- source_word: הַגֶּבֶר
  choice: 人
  rationale: 基本义为“人”，有时含刚强或显赫意味；此处由后面的“被高举”体现其尊荣，不另加“勇士”等解释。
- source_word: הֻקַם עָל
  choice: 被高举
  rationale: 保留被动语态及升高、尊崇的意象；比单说“尊贵”更贴近原文动作。
- source_word: מְשִׁיחַ
  choice: 所膏立的人
  rationale: 这里首先指大卫是受上帝膏立的君王；“膏立”保留原词的礼仪和君王含义，同时不在正文中直接将其处理为专名。
- source_word: נְעִים זְמִרוֹת יִשְׂרָאֵל
  choice: 以色列美歌的歌者
  rationale: “美歌”传达 נְעִים 的悦耳、可喜之意；“歌者”依据该短语对大卫的称谓功能作自然中文表达，同时用脚注保留句法上的其他可能。
theological_decisions:
- issue: מְשִׁיחַ 在此是否应译作弥赛亚称号
  choice: 雅各的上帝所膏立的人
  alternative: 雅各之上帝的受膏者／弥赛亚
  rationale: 上下文直接称述大卫蒙上帝膏立为王，因此正文采用历史语境清楚的译法；脚注保留“受膏者”一词所具有的君王—弥赛亚回响，不将这种张力抹去。
- issue: “最后的话”是否表示大卫此后绝不再有任何言语
  choice: 保留原文的“最后的话”而不作解释性限定
  alternative: 大卫后期的话／大卫最后的诗歌
  rationale: 原文称其为“最后的话”，可指临终或总结性的言论；正文不擅自缩窄为严格的时间顺序或特定文类。
translation_notes:
  register: 采用庄重而清楚的现代书面汉语，并以分行形式呈现原文连续的称谓和平行结构。“上帝”用于 אֱלֹהִים；人名采用通行圣经译名“耶西”“雅各”“大卫”。
