- source_word: צֶלֶק
  choice: 洗勒
  rationale: 按现代中文圣经人名的常见音译处理此专名。
- source_word: הָעַמֹּנִי
  choice: 亚扪人
  rationale: 这是表明民族或国族归属的形容词；译作“亚扪人”自然、明确。
- source_word: נַחְרַי
  choice: 拿哈莱
  rationale: 依马所拉元音所反映的读音音译，并与相近的中文传统译名保持协调。
- source_word: הַבְּאֵרֹתִי
  choice: 比录人
  rationale: 这是源自地名比录的居民称谓；简洁保留希伯来文名单的形式。
- source_word: נשאי כְּלֵי
  choice: 拿兵器的
  rationale: “拿／携带”与“器具、兵器”的组合在军事语境中指为将领携带武器装备的人；此处用短语表达，既自然，又避免把 כְּלֵי 的广义过度限定为单指盔甲。
- source_word: יוֹאָב בֶּן צְרֻיָה
  choice: 洗鲁雅的儿子约押
  rationale: 完整保留亲属身份说明，并采用自然的现代汉语次序。
