  text: ה֣וּא קָם֩ וַ/יַּ֨ךְ בַּ/פְּלִשְׁתִּ֜ים עַ֣ד כִּֽי יָגְעָ֣ה יָד֗/וֹ וַ/תִּדְבַּ֤ק יָד/וֹ֙ אֶל הַ/חֶ֔רֶב וַ/יַּ֧עַשׂ יְהוָ֛ה תְּשׁוּעָ֥ה גְדוֹלָ֖ה בַּ/יּ֣וֹם הַ/ה֑וּא וְ/הָ/עָ֛ם יָשֻׁ֥בוּ אַחֲרָ֖י/ו אַךְ לְ/פַשֵּֽׁט׀־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/010.yaml
  text: He rose and struck down the Philistines until his hand grew weary and his hand clung to the sword[a]. And Yahweh brought about a great victory on that day[b], and the people returned after him only to strip the slain.
translation:
  language: zh_hans
  text: 他挺身而起，击杀非利士人，直到手都疲乏了，手仍紧贴着刀[a]。那一天，雅威成就了大胜利[b]；众人随后跟着他回来，只顾剥取阵亡者的财物[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “紧贴”也可译作“黏在”或“紧紧抓住”。原文没有说明这是因疲劳而僵硬、抽筋，还是形容他始终不松刀。
    reason: lexical_alternative
  - marker: b
    text: “胜利”所译的希伯来语也可表示“拯救”或“解救”；这里指雅威在战斗中施行的决定性拯救。
    reason: lexical_alternative
  - marker: c
    text: 原文直译为“只为剥取”，指从战死者身上取下武器、衣甲和其他战利品。
    reason: cultural_note
lexical_decisions:
- source_word: קָם
  choice: 挺身而起
  rationale: 在战斗叙事中表示起身采取果断行动；“挺身而起”自然传达其主动迎战的意味，又不额外补入原文未明说的细节。
- source_word: וַיַּךְ בַּפְּלִשְׁתִּים
  choice: 击杀非利士人
  rationale: נכה在军事语境中指猛烈击打，常含致死结果；“击杀”符合战场语境，也为下文剥取阵亡者财物提供自然衔接。
- source_word: עַד כִּי יָגְעָה יָדוֹ
  choice: 直到手都疲乏了
  rationale: יגע表示因劳作或奋战而疲乏；此译保留原文以“手”突出持续挥刀作战的具体描写。
- source_word: וַתִּדְבַּק יָדוֹ אֶל הַחֶרֶב
  choice: 手仍紧贴着刀
  rationale: דבק可指黏住、紧贴或紧紧抓住。“紧贴”保留生动而略带歧义的表达，不武断判定这是抽筋、僵硬还是修辞性的描写。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以中文常见音译呈现四字神名，保留其作为以色列之神专名的性质，而不以称号替代。
- source_word: וַיַּעַשׂ יְהוָה תְּשׁוּעָה גְדוֹלָה
  choice: 雅威成就了大胜利
  rationale: עשה与抽象名词搭配可译为“成就”；תשועה在本节战斗语境中具体指拯救所体现的胜利，同时明确保留胜利出于雅威的神学重点。
- source_word: וְהָעָם יָשֻׁבוּ אַחֲרָיו
  choice: 众人随后回到他那里
  rationale: ישבו的形态在连续叙事中具有一定异常，但语境清楚指众人在他之后返回或重新跟上他；“随后回到他那里”是自然汉语，并避免擅自把“众人”限定为军队。
- source_word: אַךְ לְפַשֵּׁט
  choice: 只顾剥取阵亡者的财物
  rationale: פשט在战后语境中指从倒下者身上剥取武器、衣甲和战利品；“只顾”体现אַךְ的限制意味，“财物”补明汉语中“剥取”的对象。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文使用神的专名而非普通称号；采用“雅威”既呈现专名，也避免以“上主”消除原文专名与称号之间的区别。
- issue: תְּשׁוּעָה在战斗叙事中的含义
  choice: 大胜利
  alternative: 大拯救；大解救
  rationale: 该词可广义表示拯救或解救，在本节则落实为战场上的决定性胜利。正文采用最贴合语境的“大胜利”，脚注保留其较宽的语义范围，避免削弱神施行拯救的含义。
- issue: 个人勇武与神的作为之间的张力
  choice: 既直述勇士奋战，也明确说雅威成就胜利
  alternative: 将胜利主要归因于勇士，或淡化勇士的实际行动
  rationale: 原文并置人的奋战与雅威的决定性作为，没有把两者互相消解；译文保留这一神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“挺身而起”“成就了大胜利”保持经文气势；“手仍紧贴着刀”保留原文的具象性和解释空间。正文中的[a]、[b]、[c]均与脚注对应。
