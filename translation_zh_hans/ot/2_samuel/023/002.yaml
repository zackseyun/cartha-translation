  text: ר֥וּחַ יְהוָ֖ה דִּבֶּר בִּ֑/י וּ/מִלָּת֖/וֹ עַל לְשׁוֹנִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/002.yaml
  text: The Spirit of Yahweh spoke by me[a], and his word was on my tongue.
translation:
  language: zh_hans
  text: 耶和华的灵借着我说话[a]；他的话在我舌头上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在我里面说话。”这里的希伯来语介词也可表达借着某人说话的媒介含义。
    reason: lexical_alternative
lexical_decisions:
- source_word: ר֥וּחַ יְהוָ֖ה
  choice: 耶和华的灵
  rationale: רוּחַ可指风、气息或灵；在上帝借先知说话的语境中，“灵”最符合这里启示性行动者的含义。יְהוָה以现代中文圣经读者熟悉的“耶和华”音译。
- source_word: דִּבֶּר
  choice: 说话
  rationale: דבר在此表示发言、说话；“说话”自然地呈现这一未完成式所述的行动，不额外加入时态解释。
- source_word: בִּי
  choice: 借着我
  rationale: 介词ב可表示“在……里面”或工具、媒介关系；结合下句“他的话在我舌头上”，此处以“借着我”清楚表达媒介含义，同时用脚注保留较贴近形式的译法。
- source_word: וּמִלָּתוֹ
  choice: 他的话
  rationale: מִלָּה意为“话、言语”；“话”既简明自然，也保留神圣言语的分量，避免扩大为“信息”。
- source_word: עַל לְשׁוֹנִי
  choice: 在我舌头上
  rationale: 直译为“在我舌头上”；中文虽略带诗意，但清楚可懂，并保留希伯来文具体的身体意象。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。简体中文传统与普通读者最熟悉“耶和华”；这既将其作为专名呈现，也不以“主”替代原文神名。
- issue: רוּחַ应译为人格性的“灵”还是非人格性的“风／气息”
  choice: 灵
  alternative: 气息／风
  rationale: 本节描述耶和华借大卫发言的启示行动，语境支持“灵”；但译文不进一步加入原文未明说的系统神学限定。
- issue: בִּי所表达的关系
  choice: 借着我
  alternative: 在我里面
  rationale: 与“他的话在我舌头上”平行时，媒介或工具义最合语境；脚注保留形式更直接的另一译法，以免抹去介词本身的语义范围。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留“在我舌头上”的希伯来诗歌意象；用分号呈现两个平行分句。主文中的[a]与脚注完全对应。
