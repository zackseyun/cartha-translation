  text: 沙亚本人以利雅哈[a]，雅善的众子，约拿单。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的希伯来文简短而难解，直译是：“沙亚本人以利雅哈，雅善的众子，约拿单。”有些解释者认为这里的文本可能有不规则，因而以不同方式重构这份名单，例如把“约拿单”理解为“雅善的众子”之一。本译文保留现存希伯来文本的措辞，不作修订。
    reason: textual_variant
lexical_decisions:
- source_word: אֶלְיַחְבָּא
  choice: 以利雅哈
  rationale: 人名按希伯来语音译，并采用现代中文圣经读者较易辨认的形式。
- source_word: הַשַּׁעַלְבֹנִי
  choice: 沙本人
  rationale: 带冠词的地名派生称谓，指来自沙本的人；译作“沙本人”简洁自然，并保留其地域关联。
- source_word: בְּנֵי
  choice: 众子
  rationale: 该词是“儿子”的复数附属形。虽然后接单数人名“约拿单”使句法关系难解，仍明确译出复数，不擅自修订或理顺原文。
- source_word: יָשֵׁן
  choice: 雅善
  rationale: 在“雅善的众子”这一结构中按人名音译，不对文本作校勘性改写。
- source_word: יְהוֹנָתָן
  choice: 约拿单
  rationale: 采用现代中文圣经中通行的人名译法。
