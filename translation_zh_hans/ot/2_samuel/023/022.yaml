  text: These things Benaiah son of Jehoiada did[b][a], and he had a name among the three mighty men.
translation:
  language: zh_hans
  text: 这些事是耶何耶大的儿子比拿雅所做的；他在三位[b]勇士中享有盛名[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“他有名”。
    reason: lexical_alternative
  - marker: b
    text: 有些解释者根据大卫勇士名单的上下文，并参照涉及“三十人”的读法来理解本句；但这里的希伯来文本作“三人”。
    reason: textual_variant
lexical_decisions:
- source_word: אֵלֶּה עָשָׂה
  choice: 这些事都是……所做的
  rationale: 指回上文刚叙述的英勇事迹；用现代汉语的“这些事都是……所做的”自然保留总结、回指的作用。
- source_word: בְּנָיָהוּ בֶּן יְהוֹיָדָע
  choice: 耶何耶大的儿子比拿雅
  rationale: 按希伯来语从属结构表达父子关系，并采用中文圣经传统中通行的人名译法。
- source_word: וְלוֹ שֵׁם
  choice: 享有盛名
  rationale: 原文直译为“他有名”，是表示名声、声望的习语；“享有盛名”在现代汉语中自然、庄重。脚注保留其字面形式。
- source_word: בִּשְׁלֹשָׁה הַגִּבֹּרִים
  choice: 在三位勇士中
  rationale: 忠实依照WLC正文的“ 三位勇士”；גִּבֹּרִים在本段指大卫麾下的精锐勇士。
