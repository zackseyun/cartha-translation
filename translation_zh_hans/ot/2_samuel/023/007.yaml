source:
  edition: WLC
  text: וְ/אִישׁ֙ יִגַּ֣ע בָּ/הֶ֔ם יִמָּלֵ֥א בַרְזֶ֖ל וְ/עֵ֣ץ חֲנִ֑ית וּ/בָ/אֵ֕שׁ שָׂר֥וֹף יִשָּׂרְפ֖וּ בַּ/שָּֽׁבֶת׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/007.yaml
  text: But the man who touches them must arm himself with iron and the shaft of a spear[c][b][a], and they must be completely burned with fire in their place.
translation:
  language: zh_hans
  text: 但凡碰它们的人，都必须用铁器和枪杆装备自己[a][b]；它们必在原处被火彻底烧尽[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “它们”承接上一节如荆棘般的恶人。
    reason: cross_reference
  - marker: b
    text: “装备自己”原文直译为“被铁和枪的木头充满”；“枪的木头”指枪杆。
    reason: lexical_alternative
  - marker: c
    text: “在原处”也可译作“当场”或“在它们所在之处”。原文以同词根的两个形式连用，加强“烧”的语气。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ יִגַּע בָּהֶם
  choice: 但凡碰它们的人
  rationale: וְ在上下文中带转折意味；אִישׁ为泛指单数，汉语用“凡……的人”自然表达。נגע的基本义为“触碰”，也延续上一节荆棘不可徒手触碰的意象。
- source_word: יִמָּלֵא בַרְזֶל
  choice: 都必须用铁器……装备自己
  rationale: יִמָּלֵא字面为“被充满”，与工具连用时表示把自己配备妥当。“铁器”既保留בַרְזֶל“铁”的字面内容，也让现代读者明白这里指铁制工具。
- source_word: וְעֵץ חֲנִית
  choice: 和枪杆
  rationale: 字面为“枪的木头”，所指是长枪的木制杆身；“枪杆”简洁、具体，并与铁器共同构成处理荆棘的工具意象。
- source_word: שָׂרוֹף יִשָּׂרְפוּ
  choice: 必……彻底烧尽
  rationale: 同词根的不定式绝对形与限定动词连用，加强焚烧动作的语气；“必……彻底烧尽”兼顾确定性和彻底性。
- source_word: בַּשָּׁבֶת
  choice: 在原处
  rationale: 此处形式罕见，语境中通常按地点副词理解，指就在荆棘所在之处焚烧；正文采用自然而不过度具体化的“在原处”。
theological_decisions:
- issue: “它们”的指代
  choice: 正文保留代词，并以脚注说明指上一节如荆棘般的恶人
  alternative: 在正文中直接译为“那些恶人”或“那些荆棘”
  rationale: 原文使用复数代词，既承接“匪类／无用之人”，又维持荆棘比喻。保留代词可避免把人物与比喻之间的张力单方面化解。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“铁器”避免把原文未明说的具体工具定死；“枪杆”保留古代长枪的木杆意象。分号呈现装备处理者与焚尽荆棘之间的推进关系。
