base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/008.yaml
  text: 'These are the names of the mighty men who belonged to David: Josheb-basshebeth[a], a Tahkemonite, chief of the Three. He was Adino the Eznite[c][b], who wielded his spear against eight hundred slain at one time.'
translation:
  language: zh_hans
  text: 大卫的勇士，名字如下：他革扪人约设·巴设别[a]是三勇士之首[b]；他就是以斯尼人亚底挪[c]，曾在一次交战中击杀八百人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节希伯来文本很难理解。“约设·巴设别”依马所拉文本；平行经文《历代志上》11:11作“雅朔班，是哈革摩尼人”。
    reason: textual_variant
  - marker: b
    text: 一些古代见证和解释者作“三十勇士之首”；马所拉文本作“三勇士之首”。
    reason: alternative_reading
  - marker: c
    text: 希伯来文直作“以斯尼人亚底挪”，是一个很难理解的短语。许多人认为这里原意可能类似“他挥动长矛”或“他举矛攻击”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַגִּבֹּרִים
  choice: 勇士
  rationale: 该词在此指英勇善战的战士；“勇士”简洁自然，也符合名单体裁。
- source_word: אֲשֶׁר לְדָוִד
  choice: 大卫的
  rationale: 介词לְ表示归属或隶属关系；“大卫的勇士”自然表达他们属于大卫的队伍，而非所有权。
- source_word: יֹשֵׁב בַּשֶּׁבֶת
  choice: 约设·巴设
  rationale: 马所拉文本措辞艰深，但在句中可作人名；正文按其形式音译，不据历代志平行经文擅自校改。
- source_word: תַּחְכְּמֹנִי
  choice: 他革扪人
  rationale: 按撒母耳记马所拉文本音译这一族属或家族称谓；历代志的不同形式在脚注交代。
- source_word: רֹאשׁ הַשָּׁלִשִׁי
  choice: 三勇士之首
  rationale: 依马所拉文本元音传统理解为“三人之首”；结合下文精英勇士名单，译作“三勇士之首”更清楚。
- source_word: עֲדִינוֹ הָעֶצְנוֹ
  choice: 以斯尼人亚底挪
  rationale: 这是极难确定的短语；正文保留马所拉文本所呈现的人名和称号，避免把有争议的复原直接写入正文。
- source_word: עַל שְׁמֹנֶה מֵאוֹת חָלָל
  choice: 击杀八百人
  rationale: חָלָל指被杀者；结合武功记述，现代汉语以“击杀八百人”自然传达敌对行动及其结果。
- source_word: בְּפַעַם אֶחָד
  choice: 一次
  rationale: 该短语表示同一次事件或场合；“一次”简明自然。
