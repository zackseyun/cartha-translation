base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/018.yaml
  text: Abishai[a], the brother of Joab son of Zeruiah, was chief of the Three. He wielded his spear against three hundred and killed them[b], and he had a name among the Three.
translation:
  language: zh_hans
  text: 洗鲁雅的儿子、约押的兄弟亚比筛，是三勇士的首领[a]。他举起长矛，击杀了三百人[b]，并在三勇士中享有盛名。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文本作“三勇士的首领”。本段存在文本疑难；由于《历代志上》11:20的平行记载及古代文本的差异，也有人理解为“三十勇士的首领”。
    reason: textual_variant
  - marker: b
    text: 也可译为：“他举起（或挥动）长矛，向着三百个被杀的人。”希伯来原文极为简约，字面近似“向着三百个被杀的人举起他的长矛”。
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹאשׁ הַשְּׁלֹשִׁי
  choice: 三勇士的首领
  rationale: רֹאשׁ意为“头、首领”。后接词形在本段存在文本和释义困难；依据马所拉文本及本节后半的בַּשְּׁלֹשָׁה，正文保留“三勇士”，而将“三十勇士”的可能性列入脚注。
- source_word: עוֹרֵר אֶת־חֲנִיתוֹ
  choice: 挥矛
  rationale: עורר本义为“唤起、举起、激起”；以长矛为宾语时，“挥矛”自然表达战斗中的主动使用，同时保留“举起、挥动”的意象。
- source_word: עַל שְׁלֹשׁ מֵאוֹת חָלָל
  choice: 攻击三百人，将他们杀死
  rationale: חָלָל指“被刺死或被杀的人”。原文表达高度浓缩，直译近似“向三百名被杀者”；正文用现代汉语明示上下文所蕴含的击杀关系，脚注保留原文的简约结构和词义张力。
- source_word: וְלוֹ שֵׁם
  choice: 享有盛名
  rationale: 字面意思是“他有名”，在此表示名望或声誉；“享有盛名”是自然、庄重的现代汉语表达。
- source_word: בַּשְּׁלֹשָׁה
  choice: 在三勇士中
  rationale: 介词בְּ与数词连用，在此表示与该精英群体的关系，译作“在……中”。补出“勇士”使中文所指清楚，但不改变群体身份。
- source_word: אֲבִישַׁי ... יוֹאָב ... צְרוּיָה
  choice: 亚比筛……约押……洗鲁雅
  rationale: 采用现代中文圣经读者熟悉的人名音译。
