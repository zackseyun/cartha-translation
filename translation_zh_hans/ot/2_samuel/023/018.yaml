  to: 洗鲁雅的儿子、约押的兄弟亚比筛，是三勇士的首领[a]。他举起长矛，击杀了三百人[b]，并在三勇士中享有盛名。
  rationale: 修订仅改善中文人物关系的清晰度与战功叙述的自然度，并使脚注b更准确、可读地反映希伯来文的压缩表达。正文保留英语审计轨迹所采用的“击杀三百人”，同时在脚注保留“举起／挥动”及“被杀的人”的字面表达；不对“三勇士／三十勇士”的文本疑难作超出原文的裁定。
