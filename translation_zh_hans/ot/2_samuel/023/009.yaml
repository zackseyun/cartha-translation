  source_fidelity: 正文基本忠实反映马所拉文本的叙事顺序、勇士身份、对非利士人的辱骂以及“上去”的字面表达。不过，人名／族属短语的中文断分应更清楚；现有脚注a所列替代译法颠倒了原文的姓名链，且将“亚合”误作父名，不能保留。
  naturalness: “在他之后的是”自然。“他是……；他们……，那时……”的分号连接略显生硬，改为时间从句可使现代汉语叙事更流畅，同时不改变原文关系。“以色列人已经上去了”中的“已经”并非必要；去除后更贴近原文未明示的时序细节。
  terminology: “以利亚撒”“多多”“亚合人”“非利士人”和“勇士”均合适。“与大卫在一起”比“跟随大卫”更直接对应עִם（与、同在），不额外带出追随或隶属的含义。
