base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/009.yaml
  text: And after him was Eleazar son of Dodo[a], son of Ahohi, among the three mighty men with David, when they taunted the Philistines who had gathered there for battle[c][b], and the men of Israel had gone up.
translation:
  language: zh_hans
  text: 在他之后的是以利亚撒，是多多的儿子、亚合人[a]，也是与大卫在一起的三位勇士之一。当他们辱骂聚集在那里作战的非利士人[b]时，以色列人上去了[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “多多”也可译作“多代”；“亚合人”也可理解为“亚合的后裔”。
    reason: lexical_alternative
  - marker: b
    text: “辱骂”也可译作“蔑视”或“向……挑战”。
    reason: lexical_alternative
  - marker: c
    text: 原文直译为“以色列人上去了”；按战事语境，也可能是说他们离开或撤退了。
    reason: lexical_alternative
lexical_decisions:
- source_word: ו/אחר/ו
  choice: 在他之后的是
  rationale: 承接上文，介绍下一位勇士；中文补出“是”，使无动词的身份说明自然清楚。
- source_word: אֶלְעָזָר
  choice: 以利亚撒
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: בֶּן דדי בֶּן אֲחֹחִי
  choice: 亚合人多多的儿子
  rationale: 将末项理解为族属词“亚合人”，与历代志上11:12的平行记载相合；保留“多多”为人名。底本形式也容许另一种姓名链理解，列于脚注。
- source_word: בִּ/שְׁלֹשָׁה גברים
  choice: 三勇士之一
  rationale: 介词短语表达其属于三人之列；גברים在此为军事英雄语境，译作“勇士”比泛称“人”更准确。
- source_word: עִם דָּוִד
  choice: 跟随大卫
  rationale: 在勇士名录中表达与大卫同在、并肩行动的关系；用自然中文呈现其关联，不额外指定正式职分。
- source_word: בְּ/חָֽרְפָם
  choice: 他们辱骂
  rationale: חרף的语义核心是羞辱、辱骂或以言语蔑视；保留复数主语的开放性，不擅自缩限为某一个人。
- source_word: בַּ/פְּלִשְׁתִּים נֶאֶסְפוּ שָׁם לַ/מִּלְחָמָה
  choice: 聚集在那里作战的非利士人
  rationale: 按尼法勒式将非利士人理解为聚集者，并以中文关系结构表达。
- source_word: וַֽ/יַּעֲל֖וּ אִ֥ישׁ יִשְׂרָאֵֽל
  choice: 那时以色列人已经上去了
  rationale: 保留עלה的字面方向意义“上去”，不在正文中断定其在战场语境下是否指撤离；时序用“已经”自然衔接叙事。
