revisions:
- from: 在他之后的是亚合人多多的儿子以利亚撒[a]。他是跟随大卫的三勇士之一；他们辱骂聚集在那里作战的非利士人[b]，那时以色列人已经上去了[c]。
  to: 在他之后的是以利亚撒，是多多的儿子、亚合人[a]，也是与大卫在一起的三位勇士之一。当他们辱骂聚集在那里作战的非利士人[b]时，以色列人上去了[c]。
  rationale: 修正脚注a中被颠倒的姓名／族属关系，并以标点明确原文的并列称谓。将“跟随大卫”改为“与大卫在一起”，避免超出עִם的含义；调整句法以使中文自然。保留“他们”的复数指向及“上去了”的字面歧义，脚注继续说明战事语境下可能的“撤退”理解。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T05:27:06Z'
review_pass:
