  to: 耶何耶大的儿子比拿雅；耶何耶大是甲薛一位勇敢之人的儿子。比拿雅多有作为：他击杀了摩押的两个“亚利伊勒”[a]；又在一个下雪天，下到坑中，击杀了一头狮子。
