base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/020.yaml
  text: And Benaiah son of Jehoiada[a], son of a valiant man, great in deeds, from Kabzeel—he struck down the two sons of Ariel of Moab, and he went down and struck down the lion in the midst of the pit on a snowy day.
translation:
  language: zh_hans
  text: 耶何耶大的儿子比拿雅；耶何耶大是甲薛一位勇敢之人的儿子。比拿雅多有作为：他击杀了摩押的两个“亚利伊勒”[a]；又在一个下雪天，下到坑中，击杀了一头狮子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “亚利伊勒”所对应的希伯来语 אֲרִאֵל（’ari’el）在这里含义不确定，可能指“如狮般的人”或“勇士”，也可能是某种称号或名称。
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ חַי
  choice: 勇士
  rationale: 这里的短语按上下文是对勇力的称许，而不只是说“活着的人”；“勇士”简洁自然，也符合勇士名录的语境。
- source_word: רַב פְּעָלִים
  choice: 战功赫赫
  rationale: 该短语表示以许多非凡事迹著称；结合本节的武功叙述，“战功赫赫”以自然汉语传达其褒义和事迹众多之意。
- source_word: מִקַּבְצְאֵל
  choice: 甲薛
  rationale: 介词 מִן 表示来源地；汉语句式“甲薛一位勇士”已自然表达其来自甲薛。
- source_word: הִכָּה
  choice: 击杀
  rationale: 在列举比拿雅武功的语境中，该动词指以武力打倒并杀死；“击杀”比单纯“击打”更符合随后杀狮的叙述。
- source_word: שְׁנֵי אֲרִאֵל מוֹאָב
  choice: 摩押的两个“亚利伊勒”
  rationale: אֲרִאֵל 在这里含义有争议，可能指如狮般的人、勇士，也可能是称号或名称。正文音译并加引号与脚注，以保留原文的不确定性，避免擅自解释为“亚利伊勒的两个儿子”。
- source_word: יָרַד
  choice: 下到
  rationale: 既保留“下去”的方向，也与后面的“坑里”自然衔接。
- source_word: הָאֲרִי
  choice: 一头狮子
  rationale: 该名词明确指狮子；汉语叙事中首次提及，用“一头”比照搬定冠词更自然。
- source_word: בְּתוֹךְ הַבּוֹר
  choice: 坑里
  rationale: בּוֹר 可指坑或蓄水池；此处“坑”最宽泛，不额外限定用途。“坑里”自然传达 בְּתוֹךְ。
- source_word: בְּיוֹם הַשָּׁלֶג
  choice: 在一个下雪天
  rationale: 以现代汉语自然表达“在有雪的日子”这一时间背景。
