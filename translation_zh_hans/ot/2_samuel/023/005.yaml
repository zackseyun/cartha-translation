  to: 因为我的家与上帝的关系并非如此[a]；然而，他与我立了永远的约；这约在各方面都安排妥当，也蒙保守。因为这就是我全部的拯救和一切的心愿——他岂不使它生长吗？[b]
  rationale: 修订移除了混入正文的非中文词语，并以“蒙保守”准确译出被动性的שְׁמֻרָה；将开头关系短语调整为能体现עִם“与”的现代汉语表达；同时使“约”所受的“安排妥当／蒙保守”两个描述在句法上清晰。开头的否定读法、结尾的反问读法及其隐含宾语的含混性均予保留，脚注亦继续标示重要替代读法。
