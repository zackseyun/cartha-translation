  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּֽי לֹא כֵ֥ן בֵּיתִ֖/י עִם אֵ֑ל כִּי֩ בְרִ֨ית עוֹלָ֜ם שָׂ֣ם לִ֗/י עֲרוּכָ֤ה בַ/כֹּל֙ וּ/שְׁמֻרָ֔ה כִּֽי כָל יִשְׁעִ֥/י וְ/כָל חֵ֖פֶץ כִּֽי לֹ֥א יַצְמִֽיחַ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/005.yaml
  text: For my house is not so with God[a]; yet he has made with me an everlasting covenant, ordered in every way and kept secure[b]. For this is all my salvation and all my desire—will he not indeed make it grow?
translation:
  language: zh_hans
  text: 因为我的家与上帝的关系并非如此[a]；然而，他与我立了永远的约；这约在各方面都安排妥当，也蒙保守。因为这就是我全部的拯救和一切的心愿——他岂不使它生长吗？[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我的家与上帝的关系不正是这样吗？”许多人把开头理解为肯定性的反问，而不是否定陈述。
    reason: alternative_reading
  - marker: b
    text: 或译：“因为他必使这一切萌发兴盛。”希伯来文最后一句较难确定，既可理解为反问，也可理解为强烈的肯定。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 句首作解释性连接，承接前文；后续重复出现时则按各自语境表达原因或强调。
- source_word: לֹא כֵן
  choice: 并非如此
  rationale: 贴近马所拉文本的否定形式，不擅自说明“如此”具体指什么，保留原文张力。
- source_word: בֵּיתִי
  choice: 我的家
  rationale: “家”既可指家庭，也可承载王朝、家系之义，适合保留双重含义。
- source_word: עִם אֵל
  choice: 在上帝面前
  rationale: עִם 基本义为“与”；此处用自然汉语表达与上帝之间的关系，同时不作过度解释。
- source_word: בְרִית עוֹלָם
  choice: 永远的约
  rationale: 准确表达盟约恒久不变的性质，也是现代汉语圣经语体中自然庄重的说法。
- source_word: שָׂם לִי
  choice: 与我立了
  rationale: שׂים 字面为“安置”，在立约语境中译作“立约”能清楚传达其功能。
- source_word: עֲרוּכָה בַכֹּל
  choice: 凡事都安排妥当
  rationale: 表达约在各方面均已整齐安排、完备有序的意思，兼顾准确与可读性。
- source_word: וּשְׁמֻרָה
  choice: 稳固 محفوظ
  rationale: 表达该约受到保守、处于安全稳固状态的被动结果义。
- source_word: כָל יִשְׁעִי
  choice: 我全部的拯救
  rationale: “拯救”保留 יֵשַׁע 可涵盖救助、解救和救恩的宽广语义。
- source_word: וְכָל חֵפֶץ
  choice: 一切的心愿
  rationale: חֵפֶץ 可指愿望或喜悦；“心愿”在此与“拯救”平行，现代汉语自然。
- source_word: כִּי לֹא יַצְמִיחַ
  choice: 他岂不使它生长吗
  rationale: 按肯定性的反问理解，保留使役动词“使……生长”的植物意象，也用“它”维持宾语所指的含混。
theological_decisions:
- issue: 开头 כִּי לֹא כֵן בֵּיתִי עִם אֵל 的语气和意义
  choice: 正文按否定陈述译为“我的家在上帝面前并非如此”
  alternative: “我的家在上帝面前不正是这样吗？”
  rationale: 马所拉标点文本表面上是否定陈述，但不少解释将其理解为肯定性的反问。正文保留较直接的否定读法，并在脚注呈现重要替代读法，不消除经文本身的困难。
- issue: 结尾 יַצְמִיחַ 的语气与隐含宾语
  choice: 译作肯定性反问“他岂不使它生长吗？”
  alternative: “他必使这一切萌发兴盛”或“他不使它生长”
  rationale: 原句高度压缩，既可能按反问理解，也可能读成强烈肯定。正文用反问与立约语境相连，同时以“它”保留所指究竟是拯救、心愿还是整个盟约应许的含混。
translation_notes:
  register: 采用现代、庄重而易懂的普通话；保留“家”“约”“生长”等关键意象。脚注标记均置于正文相应位置。
