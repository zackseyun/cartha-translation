  text: 大卫那时在堡垒里，非利士人的驻军那时在伯利恒。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָז
  choice: 那时……也在
  rationale: 原文两次使用时间副词，分别修饰两个并列分句。中文首句用“那时”明确时间背景，次句用“也在”自然承接同一时点，避免生硬重复，同时保留两件事同时成立的强调。
- source_word: מְצוּדָה
  choice: 堡垒
  rationale: 该词在此指大卫所处的设防据点；“堡垒”简明保留军事和地形含义，不进一步指定具体建筑形态。
- source_word: מַצַּב
  choice: 驻军
  rationale: 在非利士人与伯利恒的军事语境中，该词最自然地指驻守当地的军队或军事据点；中文“驻军”可涵盖这一含义。
- source_word: פְּלִשְׁתִּים
  choice: 非利士人
  rationale: 采用现代中文圣经传统中通行的族名译法。
- source_word: בֵּית לָחֶם
  choice: 伯利恒
  rationale: 采用现代中文通行的地名译法。
- source_word: וְ
  choice: （逗号并列）
  rationale: 原文连接两个分句；中文以逗号并列，并借“也”表达连接关系，比直译“而且”更自然。
