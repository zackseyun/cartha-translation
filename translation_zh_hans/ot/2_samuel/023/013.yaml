base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/013.yaml
  text: Then thirty of the thirty chief men went down and came at harvest time to David[a], to the cave of Adullam[c][b], while a band of the Philistines was camped in the Valley of Rephaim.
translation:
  language: zh_hans
  text: 那时，三十位首领中的三十人[a]下去，在收割时节[b]来到在亚杜兰洞的大卫那里。其时，一队非利士人[c]正驻扎在利乏音谷。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文书面文本（ketiv）近似“30人，从那30位首领中”，语句艰涩；马所拉诵读文本（qere）作“3人”。这句话也可能指“三十勇士中的三位首领”。
    reason: 文本异读及艰涩句法
  - marker: b
    text: 或译“收割期间”；希伯来文直译为“到收割”。
    reason: 词义及句法选择
  - marker: c
    text: 希伯来文 חַיַּת פְּלִשְׁתִּים 字面为“非利士人的活物（或动物）”，这里是军事用语，指一队人马。
    reason: 特殊军事用法
lexical_decisions:
- source_word: וַיֵּרְדוּ
  choice: 下去
  rationale: 保留动词 ירד 的方向含义；“下去”符合现代汉语叙事表达。
- source_word: שלשים מֵהַשְּׁלֹשִׁים רֹאשׁ
  choice: 三十位首领中的三十人
  rationale: 尽量保留书面文本中两个“三十”以及 רֹאשׁ 所表达的首领、领头者含义，同时用脚注说明原文艰涩及马所拉诵读传统的异读。
- source_word: וַיָּבֹאוּ
  choice: 来到
  rationale: 连续的 אֶל 表示朝向大卫及亚杜兰洞而来；“来到”在汉语叙事中自然。
- source_word: אֶל קָצִיר
  choice: 在收割时节
  rationale: 按上下文将字面上的“到收割”理解为时间表达，同时以脚注保留其形式和可译空间。
- source_word: אֶל דָּוִד אֶל מְעָרַת עֲדֻלָּם
  choice: 来到大卫那里，就是亚杜兰洞
  rationale: 保留两个 אֶל 所指的目的地，并以“就是”说明大卫所在之处；不额外加入“会见”等原文未明说的动作。
- source_word: חַיַּת פְּלִשְׁתִּים
  choice: 一队非利士人
  rationale: חַיָּה 通常指“活物、动物”，但此处在军事语境中指一队人马；正文采用清楚自然的军事含义，脚注交代特殊用法。
- source_word: חֹנָה
  choice: 正驻扎
  rationale: 分词表示当时持续存在的背景状态；“正驻扎”自然传达这一时态作用。
- source_word: בְּעֵמֶק רְפָאִים
  choice: 在利乏音谷
  rationale: 按传统中文圣经地名音译 רְפָאִים，并将 עֵמֶק 译为“谷”。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。“三十位首领中的三十人”有意保留希伯来书面文本的重复与张力，不在正文中擅自改为较顺的“三人”；以脚注明示马所拉诵读传统及另一种可能理解。地名采用简体中文圣经读者较熟悉的“亚杜兰”和“利乏音谷”。
