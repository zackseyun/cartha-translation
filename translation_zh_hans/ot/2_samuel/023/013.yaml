  to: 那时，三十位首领中的三十人[a]下去，在收割时节[b]来到在亚杜兰洞的大卫那里。其时，一队非利士人[c]正驻扎在利乏音谷。
  rationale: 仅作必要修订：将不当的同位表述改为大卫所在地点的表达，以恢复原文的句法关系；同时精确化异读脚注。保留书面文本中“30”的难解读法，并不在正文以诵读文本的“3”取代它，因而保留文本歧义。
