    issue: “来到大卫那里，就是亚杜兰洞”误用“就是”。
    rationale: “就是”使“大卫”与“亚杜兰洞”在句法上等同；希伯来文的两个 אֶל 表示来者来到大卫所在的亚杜兰洞。应译作“来到在亚杜兰洞的大卫那里”。
  - severity: low
