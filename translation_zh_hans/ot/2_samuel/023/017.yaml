  text: וַ/יֹּ֡אמֶר חָלִילָ/ה֩ לִּ֨/י יְהוָ֜ה מֵ/עֲשֹׂ֣תִ/י זֹ֗את הֲ/דַ֤ם הָֽ/אֲנָשִׁים֙ הַ/הֹלְכִ֣ים בְּ/נַפְשׁוֹתָ֔/ם וְ/לֹ֥א אָבָ֖ה לִ/שְׁתּוֹתָ֑/ם אֵ֣לֶּה עָשׂ֔וּ שְׁלֹ֖שֶׁת הַ/גִּבֹּרִֽים׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/017.yaml
  text: And he said[a], “Far be it from me, O Yahweh, that I should do this! Is it not the blood of the men who went at the risk of their lives?” So he was not willing to drink it[b]. These things the three mighty men did.
translation:
  language: zh_hans
  text: 他说：“雅威啊，我绝不能做这事！这岂不是那些冒着生命危险[a]前去之人的血吗[b]？”于是他不肯喝这水。这就是那三个勇士所做的事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译近于“带着他们的性命”；意思是他们前去时冒着丧命的危险。
    reason: lexical_alternative
  - marker: b
    text: 也可按字面译为：“这岂不是那些带着自己性命前去之人的血吗？”大卫把这水看作他们的血，因为他们是冒着死亡危险取来的。
    reason: alternative_reading
lexical_decisions:
- source_word: חָלִילָה לִּי יְהוָה
  choice: 雅威啊，我绝不能
  rationale: חָלִילָה לִי 是表达强烈厌恶和拒绝的惯用语；“我绝不能”在现代汉语中自然且有力度。将 יְהוָה 作为呼语译为“雅威啊”，保留原文中的神名。
- source_word: מֵעֲשֹׂתִי זֹאת
  choice: 做这事
  rationale: 介词 מִן 加不定式承接 חָלִילָה，表示坚决排斥亲自实施这一行为；“做这事”简洁对应原文。
- source_word: הֲדַם הָאֲנָשִׁים
  choice: 这岂不是那些……之人的血吗
  rationale: 疑问词 הֲ 引出反问。补出汉语反问所需的“这”，所指是大卫面前的水；“血”保留大卫把这水视同众人之血的强烈比喻。
- source_word: הַהֹלְכִים בְּנַפְשׁוֹתָם
  choice: 冒着生命危险前去之人
  rationale: בְּנַפְשׁוֹתָם 直译近于“带着他们的性命”，在此表示他们前去时身陷致命危险；意译为“冒着生命危险”能清楚传达希伯来语习语。
- source_word: וְלֹא אָבָה לִשְׁתּוֹתָם
  choice: 于是他不肯喝这水
  rationale: אָבָה 表示愿意或同意，否定后为“不肯”。原文宾语后缀所指为前文的水，汉语明确译出“这水”以避免误解为喝血。
- source_word: אֵלֶּה עָשׂוּ שְׁלֹשֶׁת הַגִּבֹּרִים
  choice: 这就是那三个勇士所做的事
  rationale: אֵלֶּה 回指刚叙述的壮举；“三个勇士”准确表达 שְׁלֹשֶׁת הַגִּבֹּרִים 在本段对大卫精锐战士的称谓。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。音译“雅威”保留其作为以色列之神专名的性质，不以称号替代。
- issue: 水被称为众人的血
  choice: 保留反问和“血”的比喻
  alternative: 解释性地译为“这水是他们冒死取来的”
  rationale: 大卫的话把喝水等同于喝那些冒死取水之人的血，表达他不愿把他们的生命危险当作满足自己口渴的代价；直保原有张力，不在正文中消解比喻。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“我绝不能”传达强烈拒绝；“前去之人”略带叙事庄重感，但仍便于普通读者理解。正文保留原文的反问、血的比喻及末句总结结构。
