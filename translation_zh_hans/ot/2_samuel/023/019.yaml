  text: Was he not more honored than the three? So he became their commander[b][a], but he did not attain to the three.
translation:
  language: zh_hans
  text: 他不是比那三人更受尊重吗？于是他成了他们的统领；但他没有达到“那三人”的地位。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “比那三人更受尊重”或可译作“在那三人中最受尊重”。希伯来语的表达可作不同理解；但本节末句说他没有达到“那三人”的地位，因此正文采用比较义。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן הַשְּׁלֹשָׁה
  choice: 比那三人
  rationale: 介词 מִן 接在 נִכְבָּד 后，最自然地表示比较，即“比那三人”；“那三人”指上下文中一个特定的勇士等级。
- source_word: הֲכִי
  choice: 不是……吗？
  rationale: הֲ 与 כִּי 在这里构成期待肯定回答的反问；现代汉语用“不是……吗？”既自然又保留其修辞力度。
- source_word: נִכְבָּד
  choice: 更受尊重
  rationale: 该词源于 כבד，在此表示受到尊崇、被看重；结合比较结构译作“更受尊重”，避免将其仅理解为战功或正式军阶。
- source_word: וַיְהִי לָהֶם לְשָׂר
  choice: 于是他做了他们的统领
  rationale: שַׂר 可指首领、长官或统帅；军事语境中“统领”庄重自然，也不把具体军制规定得过细。
- source_word: וְעַד הַשְּׁלֹשָׁה לֹא בָא
  choice: 但他没有达到那三人的地位
  rationale: 直译为“没有来到／达到那三人”，语境所指是没有达到该精英群体的身份或等级；补出“地位”使现代读者明白其比喻义。
theological_decisions: []
