- source_word: הַבַּרְחֻמִי
  choice: 巴珊人
  rationale: 此处应音译为地域称谓；但“巴珊人”并不准确反映马所拉文本 בַּרְחֻמִי，较合适的直译音译应为“巴户米人”。
