lexical_decisions:
- source_word: עֲשָׂה אֵל
  choice: 亚撒黑
  rationale: 按现代中文圣经中这一人名的通行译法处理；原文分写的形式代表已知人名עֲשָׂהאֵל。
- source_word: אֲחִי יוֹאָב
  choice: 约押的兄弟
  rationale: 直接表达原文的亲属关系，同时符合现代汉语表达。
- source_word: בַּשְּׁלֹשִׁים
  choice: 是三十勇士之一
  rationale: 介词ב与带定冠词的数词组合在此表示属于这一群体；补出“勇士”和系词，使中文自然清楚。
- source_word: אֶלְחָנָן
  choice: 以利哈难
  rationale: 采用现代中文圣经常见的人名音译。
- source_word: בֶּן דֹּדֹו
  choice: 多多的儿子
  rationale: 马所拉文本作דֹּדֹו，按人名“多多”翻译，不与平行经文的异文协调。
- source_word: בֵּית לָחֶם
  choice: 伯利恒人
  rationale: 在名单中的同位修饰结构里，将地名自然地译为籍贯称谓。
