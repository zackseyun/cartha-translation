base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/021.yaml
  text: He also struck down an Egyptian[a], a man of impressive appearance. The Egyptian had a spear in his hand, and he went down to him with a staff, snatched the spear from the Egyptian’s hand[b], and killed him with his own spear.
translation:
  language: zh_hans
  text: 他还击杀了一个埃及人[a]，那人外貌出众。埃及人手里拿着一根矛；他拿着一根杖[b]下到埃及人那里，从埃及人手中夺过那根矛，用那埃及人自己的矛杀死了他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“一个相貌俊美的人”或“一个相貌不凡的人”。希伯来语泛指这埃及人的外貌；有些人参照《历代志上》11:23的平行记载，理解为他身材异常高大。
    reason: lexical_alternative
  - marker: b
    text: “杖”也可译作“棍子”或“权杖”。希伯来语 שֵׁבֶט 可按语境指杖、棍、权杖等。
    reason: lexical_alternative
lexical_decisions:
- source_word: הִכָּה
  choice: 击杀
  rationale: נכה可指“击打、击倒”；在勇士战绩的概述中译作“击杀”简洁自然，而后文仍具体交代他怎样杀死对方。
- source_word: אִישׁ מִצְרִי
  choice: 一个埃及人
  rationale: 符合现代汉语习惯，完整表达其族属身份。
- source_word: אשר מַרְאֶה
  choice: 那人外貌出众
  rationale: 原文结构简略，מַרְאֶה泛指外貌或形貌；“外貌出众”保留宽泛性，不限定为俊美或高大。
- source_word: וּבְיַד הַמִּצְרִי חֲנִית
  choice: 埃及人手里拿着一根矛
  rationale: 自然呈现希伯来语所有关系结构及具体画面。
- source_word: וַיֵּרֶד אֵלָיו
  choice: 下到那人那里
  rationale: 保留ירד“下去”的空间动作；原文未明确说明是由高处冲下或单纯迎战。
- source_word: בַּשָּׁבֶט
  choice: 只拿着一根棍杖
  rationale: שֵׁבֶט可指杖、棍或权杖；“棍杖”保留其宽泛器物意义。“只”用于自然表达他以棍杖面对持矛者的情形，但不把棍杖明确解释为特定武器。
- source_word: וַיִּגְזֹל
  choice: 夺过
  rationale: גזל含强行夺取之意；“夺过”符合搏斗语境，且现代汉语自然。
- source_word: וַיַּהַרְגֵהוּ
  choice: 杀死了他
  rationale: 直接、清楚地表达הרג的通常含义。
- source_word: בַּחֲנִיתוֹ
  choice: 用那人的矛
  rationale: 代词后缀最自然地回指埃及人；译出“那人的”既明确所指，也保留战局逆转的画面。
- source_word: וְהוּא
  choice: 他还
  rationale: 体现本句承接前文、继续列举比拿雅功绩的附加关系。
