base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/006.yaml
  text: But worthless men are all like thorns cast aside[a], for they cannot be taken with the hand.
translation:
  language: zh_hans
  text: 但无用之徒都像被丢弃的荆棘[a]，因为人不能用手拿它们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的希伯来语词很可能指“无用”或“邪恶”的人，并非后来用作专名的“彼列”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְלִיַּעַל
  choice: 但无用之人
  rationale: בְּלִיַּעַל在此指无用、邪恶之人，而不是后来作为专名使用的“彼列”；上下文的复数代词表明这里指一类人。
- source_word: כְּקוֹץ
  choice: 像……荆棘
  rationale: קוֹץ虽为单数形式，在此可作集合名词，与所比的复数人群相称；“荆棘”自然保留比喻。
- source_word: מֻנָד
  choice: 被丢弃的
  rationale: 该被动分词表达被推开、抛到一旁之意；“被丢弃”既贴合荆棘的意象，也与下句不直接用手拿相呼应。
- source_word: כֻּלָּהֶם
  choice: 都
  rationale: 保留“他们全都”的总体、周遍意义，同时符合现代汉语表达。
- source_word: כִּי
  choice: 因为
  rationale: 引出不能直接用手拿荆棘这一理由。
- source_word: לֹא בְיָד יִקָּחוּ
  choice: 人不能用手拿它们
  rationale: 希伯来语未明说主语，宜用汉语泛指主语“人”；“不能”传达语境中的实际不可行性，而“用手拿”自然对应介词短语。
theological_decisions:
- issue: בְּלִיַּעַל是否作为专名处理
  choice: 译为“无用之人”
  alternative: 音译为“彼列”或译为“邪恶之人”
  rationale: 本节中的词仍是描述人的普通名词性用法；译成专名会误导读者联想到后期人格化的“彼列”。“无用”较直接保留该词的核心贬义，同时不把含义限定为单一的道德类别。
translation_notes:
  register: 采用现代、庄重而易懂的汉语。“无用之人”保留原词的贬义及一定语义宽度；“被丢弃的荆棘”维持原文的被动意象和诗歌比喻。
