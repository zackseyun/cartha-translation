  to: 在他之后是哈拉人亚基的儿子沙玛。非利士人聚集成一队[a]；那里有一块田地，长满了扁豆。百姓从非利士人面前逃跑了。
  rationale: 仅调整困难词组 לַחַיָּה 的中文处理及脚注措辞。“聚集成一队”在中文中较自然地保留了原文可能所指的集结／队伍含义，不将其限定为“组建军队”；脚注继续呈现战斗和地名两种主要替代解释。其余译文无需改动。
