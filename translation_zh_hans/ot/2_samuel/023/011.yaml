base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/011.yaml
  text: After him was Shammah son of Agee the Hararite. The Philistines gathered together at Lehi[a], where there was a plot of ground full of lentils, and the people fled from before the Philistines.
translation:
  language: zh_hans
  text: 在他之后是哈拉人亚基的儿子沙玛。非利士人聚集成一队[a]；那里有一块田地，长满了扁豆。百姓从非利士人面前逃跑了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “聚集成一队”所对应的希伯来语含义不确定；也可理解为“为争战而聚集”。另有一种解释把这个词看作地名“利希”。
    reason: 保留 לַחַיָּה 的词义及文本解释歧义，避免正文武断排除其他可能。
lexical_decisions:
- source_word: וְאַחֲרָיו
  choice: 在他之后
  rationale: 保留勇士名单中简洁的承接语，不补入希伯来文没有明说的动作。
- source_word: שַׁמָּא בֶן־אָגֵא הָרָרִי
  choice: 哈拉人亚基的儿子沙玛
  rationale: 按现代中文圣经人名的常见音译处理专名，并把族属或地域称谓 הָרָרִי 译作“哈拉人”，不武断解释为“山地人”。
- source_word: וַיֵּאָסְפוּ
  choice: 聚集
  rationale: 自然表达 אסף 在此处的集合含义，符合军事语境。
- source_word: לַחַיָּה
  choice: 成军
  rationale: 该词组含义困难；“聚集成军”保留其可能表示队伍、军队编组的含义，也符合上下文，同时以脚注呈现其他主要解释。
- source_word: חֶלְקַת הַשָּׂדֶה
  choice: 一块田地
  rationale: חֶלְקָה 指划分出来的一块地；此译具体、自然，并保留原文的田地意象。
- source_word: מְלֵאָה עֲדָשִׁים
  choice: 长满了扁豆
  rationale: 以自然中文表达字面上的“满了扁豆”，不进一步断定具体耕种状态。
- source_word: וְהָעָם
  choice: 百姓
  rationale: 保留 עַם 的通常含义，不把所指明确限定为士兵。
- source_word: נָס מִפְּנֵי
  choice: 从……面前逃跑
  rationale: 较直接地保留希伯来语介词结构，同时在现代中文中清楚可懂。
