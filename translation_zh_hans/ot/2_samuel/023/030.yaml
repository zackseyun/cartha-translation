  text: Benaiah the Pirathonite[a], Hiddai from the wadis of Gaash[b];
translation:
  language: zh_hans
  text: 比拉顿人比拿雅；来自迦实溪谷[a]的希代[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “溪谷”所译的希伯来词可指季节性水道、峡谷或干河床；传统也译作“溪流”或“山谷”。
    reason: lexical_alternative
  - marker: b
    text: 《历代志上》11:32的平行名单作“户莱”，本节希伯来文本作“希代”。
    reason: cross_reference
lexical_decisions:
- source_word: בְּנָיָהוּ
  choice: 比拿雅
  rationale: 按希伯来语专名音译，并采用现代中文圣经读者较熟悉的译名形式。
- source_word: פִּרְעָתֹנִי
  choice: 比拉顿人
  rationale: 这是表示籍贯的族称形容词，意思是“来自比拉顿的人”；译作“比拉顿人”简洁自然。
- source_word: הִדַּי
  choice: 希代
  rationale: 依《马所拉文本》本节的读法音译；平行经文的异名保留在脚注中说明。
- source_word: מִ/נַּחֲלֵי
  choice: 来自……的溪谷
  rationale: נַחַל 可指季节性水道、干河床或其所在的谷地；“溪谷”既适合当地地貌，也比单译“溪”更能避免常年流水的误解。
- source_word: גָעַשׁ
  choice: 迦实
  rationale: 地名按希伯来语音译，并采用简洁、常见的中文专名形式。
