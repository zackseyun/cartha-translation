base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/012.yaml
  text: But he took his stand in the middle of the field and defended it[a], and struck down the Philistines; and Yahweh brought about a great victory.
translation:
  language: zh_hans
  text: 但他站定在那块田地中央，守住了它，击杀了非利士人；雅威带来了极大的胜利[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“极大的解救”或“极大的拯救”。这个希伯来词可指胜利、解救或拯救；此处在战斗语境中指雅威所带来的战果。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְיַצֵּב
  choice: 站在
  rationale: 该词的 Hitpael 词形表示有意站定、据守阵地；结合战斗语境，“站在……中央”自然地表达他挺身据守的位置。
- source_word: בְּתוֹךְ הַחֶלְקָה
  choice: 在那块田的中央
  rationale: חֶלְקָה 指一块划分出来的土地，本段具体为田地；“那块田”既自然，也保留其为特定地块的含义。
- source_word: וַיַּצִּילֶהָ
  choice: 守住了田地
  rationale: נצל 基本义为解救、搭救；阴性后缀所指的是田地。按此战斗场景，“守住”清楚表达使田地免遭敌军占领，同时没有把动作抽象化。
- source_word: וַיַּךְ אֶת־פְּלִשְׁתִּים
  choice: 击杀非利士人
  rationale: נכה 在战争叙事中可指击打、击倒或杀伤敌军；“击杀”保留原文强烈的战斗意味，比笼统的“打败”更贴近措辞。
- source_word: וַיַּעַשׂ יְהוָה
  choice: 雅威使他们……
  rationale: עשה 与抽象名词 תְּשׁוּעָה 连用，表示雅威成就、带来这次拯救性的战果；汉语用“使他们……”自然呈现神是胜利的成就者。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，保留其作为专名的性质，而不以称号代替。
- source_word: תְּשׁוּעָה גְדוֹלָה
  choice: 大获全胜
  rationale: תְּשׁוּעָה 可指拯救、解救或战场上的胜利；本节处于军事语境，“大获全胜”最直接传达实际战果，而脚注保留该词更宽的拯救含义。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名。正文采用“雅威”这一较贴近通常学术重构读音的现代汉语音译，并保留其专名性质；“耶和华”是传统汉语形式。
- issue: 战斗语境中 תְּשׁוּעָה 的含义
  choice: 使他们大获全胜
  alternative: 施行了极大的拯救／解救
  rationale: 上下文描述与非利士人交战，因此正文采用“胜利”义；同时该词本身也有“拯救、解救”之义，故以脚注保留语义张力，并明确胜利源于雅威的拯救行动。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“守住了田地”符合汉语战斗叙事；分号保留人的英勇行动与雅威成就胜利之间的紧密联系。
