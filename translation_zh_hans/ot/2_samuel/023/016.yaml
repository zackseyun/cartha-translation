  terminology: “非利士人”“伯利恒”“大卫”“耶和华”均规范一致。“勇士”适合此处作为大卫精锐战士的称谓。将נסך译为“倾倒”保留其字面动作；其可能具有奠祭性质，适宜置于脚注说明，而不在正文预先界定为正式祭仪。
