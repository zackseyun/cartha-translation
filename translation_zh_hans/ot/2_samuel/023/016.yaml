  text: וַ/יִּבְקְעוּ֩ שְׁלֹ֨שֶׁת הַ/גִּבֹּרִ֜ים בְּ/מַחֲנֵ֣ה פְלִשְׁתִּ֗ים וַ/יִּֽשְׁאֲבוּ מַ֨יִם֙ מִ/בֹּ֤אר בֵּֽית לֶ֨חֶם֙ אֲשֶׁ֣ר בַּ/שַּׁ֔עַר וַ/יִּשְׂא֖וּ וַ/יָּבִ֣אוּ אֶל דָּוִ֑ד וְ/לֹ֤א אָבָה֙ לִ/שְׁתּוֹתָ֔/ם וַ/יַּסֵּ֥ךְ אֹתָ֖/ם לַֽ/יהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/016.yaml
  text: Then the three mighty men broke through the camp of the Philistines and drew water from the well of Bethlehem that was by the gate[a], and carried it and brought it to David. But he was not willing to drink it; instead[b], he poured it out to Yahweh.
translation:
  language: zh_hans
  text: 于是，那三个勇士闯过非利士人的营地，从伯利恒城门旁的井里打了水，带着水来到大卫那里。大卫却不肯喝，反而把水向耶和华倾倒。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “向耶和华倾倒”可能指把水作为献给耶和华的奠祭般奉献；原文没有进一步说明这是否属于正式祭仪。
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּבְקְעוּ
  choice: 闯过
  rationale: 该动词有破开、突破之意；在军事语境中，“闯过”自然地表达三人强行穿越敌营。
- source_word: שְׁלֹשֶׁת הַגִּבֹּרִים
  choice: 那三个勇士
  rationale: גִּבּוֹרִים在大卫勇士的叙事中可指精锐战士；“勇士”既保留称号意味，也符合现代汉语。
- source_word: וַיִּשְׁאֲבוּ מַיִם
  choice: 打了水
  rationale: “打水”是现代汉语中从井里取水的惯常说法，准确对应此处动作。
- source_word: מִבֹּאר בֵּית לֶחֶם אֲשֶׁר בַּשַּׁעַר
  choice: 从伯利恒城门旁的井里
  rationale: 将关系从句自然整合为汉语定语；בַּשַּׁעַר可指在城门处或城门旁，此处译作“城门旁”而不作过度限定。
- source_word: וַיִּשְׂאוּ וַיָּבִאוּ אֶל דָּוִד
  choice: 带着水来到大卫那里
  rationale: 原文连续表达携带并带到；汉语合并处理可避免生硬重复，同时保留两项动作的整体意义。
- source_word: וְלֹא אָבָה לִשְׁתּוֹתָם
  choice: 大卫却不肯喝
  rationale: אָבָה强调意愿或同意，“不肯”保留其意志色彩；主语在汉语中明说为“大卫”以避免歧义。
- source_word: וַיַּסֵּךְ אֹתָם לַיהוָה
  choice: 反而把水浇奠在耶和华面前
  rationale: נסך在此具有奠酒式倾倒的礼仪意味；“浇奠”保留实际倾倒与献给神的内涵，“在耶和华面前”自然表达定向奉献关系，同时避免将仪式类别规定得过细。
- source_word: יהוה
  choice: 耶和华
  rationale: 采用现代简体中文圣经读者熟悉的专名译法，清楚区别于一般称号“主”。
theological_decisions:
- issue: 大卫把水倒出的行为性质
  choice: 译作“浇奠在耶和华面前”，呈现带有献祭意味的实际倾倒
  alternative: 仅译作“倒在耶和华面前”，或明确译作“献为奠祭”
  rationale: נסך通常带有礼仪性浇奠的意味，但叙事没有明确规定完整的祭仪类别；正文保留献给耶和华的性质，又不将其过度界定为正式奠祭。
- issue: 复数后缀与汉语所指
  choice: 按集合名词译为单数概念“水”
  alternative: 直译为“它们”或“这些水”
  rationale: 希伯来语מַיִם在形式上为复数，后续代词也用复数，但这里指所打来的水这一整体；现代汉语自然用“水”，不改变神学含义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“闯过敌营”“打水”等表达清楚易懂；“浇奠”略带礼仪色彩，用以保留原文נסך的献祭意味，并由脚注说明。正文中的脚注标记[a]与脚注对应。
