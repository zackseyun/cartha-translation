  text: 哈拉人沙玛，亚拉人[a]沙拉的儿子亚希暗。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “亚拉人”或作“哈拉人”，与前面的族称一致；但这里的希伯来文本宜读作“亚拉人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁמָּה
  choice: 沙玛
  rationale: 专有名词，按希伯来语音译；采用现代中文圣经人名常见形式。
- source_word: הֲרָרִי
  choice: 哈拉人
  rationale: 这是表示族属或地域来源的形容词；在勇士名录中译作族称“哈拉人”，比描述性的“山地人”更自然。希伯来语定冠词无需在中文中另行表达。
- source_word: אֲחִיאָם
  choice: 亚希暗
  rationale: 专有名词，按希伯来语音译。
- source_word: בֶּן
  choice: ……的儿子
  rationale: 标准的希伯来语父子谱系结构；中文按自然语序表达为“沙拉的儿子亚希暗”。
- source_word: שָׁרָר
  choice: 沙拉
  rationale: 专有名词，按希伯来语音译。
- source_word: הָאֲרָרִי
  choice: 亚拉人
  rationale: 马所拉文本的辅音形式指向“亚拉人”，与前面的“哈拉人”不同；正文保留这一文本差异，不作协调。
