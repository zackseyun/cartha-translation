  source_fidelity: 草稿大体忠实保留了“看哪”、以色列与犹大之间的群体称谓、“偷”的指责性比喻，以及使役式“使……过约旦河”。但末句把“所有大卫的随从与他同在”改释为“跟随王的大卫所有部下”，将原文的“与他同在”明确限定为“跟随王”，并使“大卫所有部下”的中文表达生硬；原文中代词所指不宜在译文中强行消歧。
