  to: 看哪，以色列众人来到王那里，对王说：“我们的弟兄，就是犹大人，为什么把你偷走[a]，又把王、王的家眷和所有与他同在的大卫随从带过约旦河呢？”[b]
  rationale: 修订维持原文的政治性指责、群体用语和使役式过河行动，同时以“把王、王的家眷和……随从带过约旦河”清楚呈现原文的并列宾语。将末项译作“所有与他同在的大卫随从”，保留原文代词关系的可解释空间，不把它限定为“跟随王”。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T05:27:08Z'
