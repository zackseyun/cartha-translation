  terminology: “家眷”可准确表达此处的“家／家室”。“众人”与“犹大人”可保留集合用法；脚注应说明原文的阳性集合措辞，而不应使其看似只解释句末。末句宜用“大卫的随从”，避免“部下”带来的不必要军事化限定。
