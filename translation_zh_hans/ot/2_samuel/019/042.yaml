base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/042.yaml
  text: And behold[a], all the men of Israel came to the king and said to the king, “Why have our brothers, the men of Judah, stolen you away and brought the king and his household across the Jordan[b], and all David’s men with him?”
translation:
  language: zh_hans
  text: 看哪，以色列众人来到王那里，对王说：“我们的弟兄，就是犹大人，为什么把你偷走[a]，又把王、王的家眷和所有与他同在的大卫随从带过约旦河呢？”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “偷走”也可理解为“暗中带走”。原文使用通常表示“偷窃”的动词，以此指责犹大人在其他以色列人没有参与的情况下擅自迎回王。
    reason: lexical_alternative
  - marker: b
    text: 原文在前文称“以色列所有男人”和“犹大男人”，是以阳性集合用语指当时由这些人代表的两个群体。
    reason: cultural_note
lexical_decisions:
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留希伯来语用于引起注意、使叙事场景更加鲜明的话语标记；现代中文虽略显庄重，但在经文叙事中清楚自然。
- source_word: כָּל אִישׁ יִשְׂרָאֵל
  choice: 以色列众人
  rationale: אִישׁ虽为阳性单数形式，在此作集合用语；“众人”自然表达前来质问王的以色列代表群体，同时避免误译成每一个以色列人。
- source_word: בָּאִים
  choice: 都来到
  rationale: 该分词在叙事语境中表达当时发生的行动，用汉语完成体叙述“来到”最为自然；“都”呼应כָּל的群体范围。
- source_word: גְּנָבוּךָ
  choice: 把你偷走
  rationale: 保留גנב“偷”的强烈比喻，表现以色列众人指责犹大人未让他们参与便擅自迎回王；不将其弱化为普通的“带走”，也不误解为字面绑架。
- source_word: אַחֵינוּ אִישׁ יְהוּדָה
  choice: 我们的弟兄犹大人
  rationale: 保留“弟兄”的亲属语言及אִישׁ的集合意义，突显同族群体之间的争执。
- source_word: וַיַּעֲבִרוּ
  choice: 渡过……也一同渡过去
  rationale: עבר的使役式意为使某人过河或把某人送过河；“渡过”准确体现约旦河语境中的使役行动。后半句补出省略的动作，使中文句法清楚。
- source_word: בֵּיתוֹ
  choice: 王的家眷
  rationale: 此处בַּיִת指王的家庭或随行家属，而非建筑物；“家眷”符合历史叙事语域。
- source_word: וְכָל אַנְשֵׁי דָוִד עִמּוֹ
  choice: 并把跟随王的大卫所有部下也一同渡过去
  rationale: 将עִמּוֹ理解为“大卫的部下与王同在、跟随王”，并把前面的使役动词自然补入中文；“部下”比泛称“人”更清楚地表达大卫的随从群体。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“看哪”保留原文的现场感；引语中先称“你”、随后称“王”的人称转换照原文保留。“把……渡过”体现希伯来语使役式；末句为避免中文产生悬垂成分，补出原文可承接的动作“渡过去”。
