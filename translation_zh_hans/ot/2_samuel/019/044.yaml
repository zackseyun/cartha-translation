- from: 以色列人回答犹大人说：“王有十分，我就有十份；就是在大卫身上，我也比你更有分[a]。你为什么轻看我？要迎回我的王，不是我先提出来的吗？[b]”但犹大人的话比以色列人的话更强硬[c]。
  to: 以色列人回答犹大人说：“我在王身上有十份的份额；就大卫而言，我也比你更有份[a]。你为什么轻看我？要迎回我的王，不是我先提出来的吗？[b]”但犹大人的话比以色列人的话更强硬[c]。
  rationale: 仅修正首句的句法与意义关系：原文是以色列一方宣称自己在王身上拥有“十份”份额，并非宣称“王有十分”。“就大卫而言”使汉语更自然，且不扩充原文所省略的权益性质。其余译文和脚注忠实保留了原文的修辞、歧义与比较关系。
