  text: וַ/יַּ֣עַן אִֽישׁ יִשְׂרָאֵל֩ אֶת אִ֨ישׁ יְהוּדָ֜ה וַ/יֹּ֗אמֶר עֶֽשֶׂר יָד֨וֹת לִ֣/י בַ/מֶּלֶךְ֮ וְ/גַם בְּ/דָוִד֮ אֲנִ֣י מִמְּ/ךָ֒ וּ/מַדּ֨וּעַ֙ הֱקִלֹּתַ֔/נִי וְ/לֹא הָיָ֨ה דְבָרִ֥/י רִאשׁ֛וֹן לִ֖/י לְ/הָשִׁ֣יב אֶת מַלְכִּ֑/י וַ/יִּ֨קֶשׁ֙ דְּבַר אִ֣ישׁ יְהוּדָ֔ה מִ/דְּבַ֖ר אִ֥ישׁ יִשְׂרָאֵֽל־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/044.yaml
  text: Then the man of Israel answered the man of Judah and said[a], “I have ten shares in the king, and in David also I have more than you[d][c][b]. Why then did you treat me lightly? Was not my word first in bringing back my king?” But the word of the men of Judah was harsher than the word of the men of Israel.
translation:
  language: zh_hans
  text: 以色列人回答犹大人说：“我在王身上有十份的份额；就大卫而言，我也比你更有份[a]。你为什么轻看我？要迎回我的王，不是我先提出来的吗？[b]”但犹大人的话比以色列人的话更强硬[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “十份的份额”原文直译是“十只手”，是表示份额或权益的习语，很可能是指北方十个支派相对于犹大所主张的份额。后半句也可译作：“就大卫而言，我也比你有更大的权利。”
    reason: 文化背景与词义选择
  - marker: b
    text: 或译：“要迎回我的王，不是我的话在先吗？”原文略有省略，其中“话”也可理解为“提议”。
    reason: 保留原文歧义与替代译法
  - marker: c
    text: “更强硬”也可译作“更严厉”或“更激烈”。
    reason: 词义选择
lexical_decisions:
- source_word: אִישׁ יִשְׂרָאֵל / אִישׁ יְהוּדָה
  choice: 以色列人／犹大人
  rationale: 单数“人”在此代表双方群体或其发言者。汉语用集体称谓自然，也能涵盖末句对两方言辞的概括。
- source_word: עֶשֶׂר יָדוֹת לִי בַמֶּלֶךְ
  choice: 王有十分，我就有十份
  rationale: יָדוֹת字面为“手”，在此是“份额”的习语；译文保留“十”与份额之意，并以自然汉语表达北方各支派所主张的权益。
- source_word: וְגַם בְּדָוִד אֲנִי מִמְּךָ
  choice: 就是在大卫身上，我也比你更有分
  rationale: 原文比较结构有所省略，表达以色列一方对大卫拥有更大的份额或权利；“更有分”保留其关系性与权益含义。
- source_word: הֱקִלֹּתַנִי
  choice: 轻看我
  rationale: 该使役形动词表示把对方看得轻、视为无足轻重；“轻看”简洁自然，又不强化为仇恨或彻底藐视。
- source_word: וְלֹא הָיָה דְבָרִי רִאשׁוֹן לִי לְהָשִׁיב אֶת מַלְכִּי
  choice: 要迎回我的王，不是我先提出来的吗？
  rationale: דָבָר可指话、事情或提议，整句略有省略。“先提出来”自然表达其主张自己率先倡议迎王回来的意思，同时以脚注保留较形式对应的可能译法。
- source_word: מַלְכִּי
  choice: 我的王
  rationale: 保留原文第一人称单数后缀，体现说话者的效忠以及对王所主张的关系。
- source_word: וַיִּקֶשׁ דְּבַר אִישׁ יְהוּדָה מִדְּבַר אִישׁ יִשְׂרָאֵל
  choice: 犹大人的话比以色列人的话更强硬
  rationale: קשה在此描述言辞的强烈、严厉或尖锐。“更强硬”既保留比较意味，也不把含义限定为音量或暴力。
theological_decisions:
- issue: “十份”所指的群体权益
  choice: 正文不明说十个北方支派，只保留“十份”
  alternative: 直接译作“我们十个支派在王身上都有份”
  rationale: 原文使用份额习语而未明说“支派”；正文保留其表达和潜在张力，脚注说明最可能的历史指向，避免把解释写进经文。
- issue: 对大卫“更有分”的性质
  choice: 译为关系或权益上的“更有分”
  alternative: 译为“我比你更重要”或明确作政治合法权
  rationale: 省略式原文容许“份额、权利、关系”方面的理解，但不支持泛指个人优越，也不宜加入特定政治或神学体系。
translation_notes:
  register: 采用现代、庄重而口语可懂的普通话。“王有十分，我就有十份”保留原文修辞力度；对较晦涩的份额习语及省略句以脚注解释。双方称谓用“以色列人／犹大人”，既可指代表发言者，也自然涵盖其所属群体。
