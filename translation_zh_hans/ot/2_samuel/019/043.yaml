base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/043.yaml
  text: Then every man of Judah answered the man of Israel[a], “Because the king is a close relative to me[b]. So why has this matter made you angry? Have we eaten at all at the king’s expense? Or has he given us any gift?”
translation:
  language: zh_hans
  text: 犹大人全都回答以色列人[a]说：“因为王与我们亲近[b]。你们为什么为这事发怒呢？难道我们吃过王的食物吗？难道有什么送给我们吗？[c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“犹大的每一个人回答以色列的人”；两个单数名词在这里都具有集合意义，分别代表犹大和以色列两方。
    reason: collective_singular
  - marker: b
    text: 原文直译为“王离我近”。这里很可能指亲属或支派关系上的亲近。
    reason: lexical_alternative
  - marker: c
    text: 末句的希伯来文较难理解，也可译作：“难道我们吃过王所供给的食物吗？或有什么给了我们吗？”整体意思可能是在否认犹大人从王那里得过特殊好处。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַן
  choice: 回答……说
  rationale: 该叙事动词承接前文并引出犹大人的回应；现代汉语以“回答……说”自然表达其应答功能，无须机械译出连接词“于是”。
- source_word: כָּל אִישׁ יְהוּדָה
  choice: 犹大众人
  rationale: 原文是单数形式的集合性表达，指犹大一方的全体人；“犹大众人”既保留整体性，也符合现代汉语习惯。
- source_word: עַל אִישׁ יִשְׂרָאֵל
  choice: 回答以色列人
  rationale: “以色列人”在原文中为集合性单数，代表以色列一方；介词在此争辩语境中标明回应的对象，不必译成“攻击”或“反对”。
- source_word: כִּי קָרוֹב הַמֶּלֶךְ אֵלַי
  choice: 因为王和我们亲近
  rationale: קָרוֹב 可表示一般的接近，也可表示亲属或支派关系上的亲近。正文保留“亲近”的宽度，不把其含义限定为血缘；原文集合性发言中的第一人称单数，汉语自然译作“我们”。
- source_word: וְלָמָּה זֶּה חָרָה לְךָ עַל הַדָּבָר הַזֶּה
  choice: 你们为什么为这事发怒呢
  rationale: חָרָה 是表示发怒的惯用语，字面有“燃烧”之意；对方虽用集合性单数指称，汉语按群体对话译为“你们”。
- source_word: הֶאָכוֹל אָכַלְנוּ מִן הַמֶּלֶךְ
  choice: 难道我们吃过王供给的食物吗
  rationale: 不定式绝对形与限定动词并用，加强反问语气；“难道……吗”体现这种强调。“从王吃”可指吃王所供给的食物，正文以清楚而不过度引申的方式表达。
- source_word: אִם נִשֵּׂאת נִשָּׂא לָנוּ
  choice: 难道有什么馈赠送给过我们吗
  rationale: 该句形式和具体所指均有困难。נשׂא 的核心义与“拿、带、送”有关；被动表达“有什么……送给我们”尽量贴近原文，同时依上下文补出可能的“馈赠”。
theological_decisions:
- issue: 犹大与王“亲近”的性质
  choice: 正文译作“亲近”，脚注说明可能指亲属或支派关系
  alternative: 直接译作“王是我们的近亲”
  rationale: 原文可由上下文理解为亲属或支派上的亲近，但词语本身仍有较宽含义；保留这种张力可避免把解释写死在正文中。
- issue: 末句所指的利益
  choice: 采用被动且较具体的“有什么馈赠送给过我们”
  alternative: “我们得过什么好处吗”或“有什么被抬举给我们吗”
  rationale: 原文末句文本艰涩，无法确定所送之物；“馈赠”符合与前句并列、否认从王得利的语境，但以脚注保留更宽泛的理解。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。群体对话中的希伯来语集合性单数按汉语习惯译作复数；用连续反问保留犹大一方强烈的辩解语气。
