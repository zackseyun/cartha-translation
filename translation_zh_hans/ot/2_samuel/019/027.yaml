base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/027.yaml
  text: And he has slandered your servant to my lord the king[a], for your servant said, ‘I will saddle the donkey for myself so that I may ride on it and go with the king,’ because your servant is lame.
translation:
  language: zh_hans
  text: 他回答说：“我主我王，我的仆人欺骗了我[a]。仆人原说：‘我要为自己备好驴，骑上去，跟王一起走。’因为仆人腿瘸。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“愚弄了我”或“背叛了我”。这个希伯来动词可指误导或以诡诈相待；这里按所给希伯来文本译作“欺骗了我”。
    reason: 保留该希伯来动词的词义范围，并说明现有原文与较具体的“诬告”译法之间的差别。
lexical_decisions:
- source_word: רִמָּנִי
  choice: 欺骗了我
  rationale: 该词在此为רמה的加强词干完成式，带第一人称单数宾语后缀，基本意思是以诡诈手段误导、欺骗。所给希伯来文本的宾语是“我”，没有“向王诬告你仆人”的介词结构，因此译作“欺骗了我”最贴合现有原文。
- source_word: עַבְדִּי
  choice: 我的仆人
  rationale: 指米非波设的随从；“仆人”既符合王室叙事语境，也不额外强调其法律身份。
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: 我主我王
  rationale: 保留对君王恭敬而正式的称呼，在现代中文中庄重且自然。
- source_word: אֶחְבְּשָׁה לִּי הַחֲמוֹר
  choice: 我要为自己备好驴
  rationale: חבש用于驴时指装鞍、备妥以供骑乘；第一人称意愿式表达打算或决意。“备好驴”在中文中自然，也涵盖给驴上鞍的动作。
- source_word: וְאֶרְכַּב עָלֶיהָ
  choice: 骑上去
  rationale: 准确表达骑在母驴之上的动作；中文可按上下文自然省去重复的“驴”。
- source_word: וְאֵלֵךְ אֶת־הַמֶּלֶךְ
  choice: 跟王一起走
  rationale: הלך与אֶת连用在这里表示陪同、同行，而不是前往王那里。
- source_word: פִסֵּחַ
  choice: 腿瘸
  rationale: 具体表达行动不便的身体状况，比单用“瘸”更自然，也避免带入贬损语气。
- source_word: עַבְדְּךָ
  choice: 仆人
  rationale: 这是臣下在王面前的谦称；中文直接说“仆人”可维持宫廷语境中的自谦口吻。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事中文。“我主我王”和自称“仆人”保留朝廷对话的恭敬语气。译文以所给WLC希伯来文本为首要依据；该文本开头是“他回答说：‘我主我王，我的仆人欺骗了我’”，并不支持英语咨询层所采用的“他向我主我王诬告你仆人”。
