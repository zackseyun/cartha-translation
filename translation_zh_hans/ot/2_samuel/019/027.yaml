  naturalness: 整体庄重通顺；“骑上去”在此指代略松散，“把驴备好，好骑着它跟王同行”更自然明确。“瘸腿的”既自然，也较贴近原文的形容词表述。
  terminology: “我主我王”“仆人”“欺骗了我”均适合朝廷叙事语域。脚注保留 רמה 的较宽语义范围，且不采纳与所给希伯来文本句法不符的“向王诬告你仆人”。
