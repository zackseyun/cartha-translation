base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/038.yaml
  text: Please let your servant return[a], that I may die in my own city, by the grave of my father and my mother. But here is your servant Kimham; let him cross over with my lord the king[b], and do for him what is good in your eyes.
translation:
  language: zh_hans
  text: 请让仆人回去，好让我死在自己的城里，在我父亲和母亲的坟墓旁[a]。请看，您的仆人金罕在这里；让他与我主我王一同过河吧。您看怎样好，就怎样待他[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“与我父亲和母亲的坟墓在一起”；此处按语境译为“在……坟墓旁”。
    reason: lexical_alternative
  - marker: b
    text: 直译为“为他做您眼中看为好的事”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשָׁב נָא
  choice: 请让……回去
  rationale: שׁוּב在此指返回，נָא带有恳请语气；“请让……回去”符合现代汉语的请求表达。
- source_word: עַבְדְּךָ
  choice: 仆人
  rationale: 这是巴西莱对王自称时的谦敬用语；“仆人”既保留宫廷语体，也不无端突出奴役身份。
- source_word: וְאָמֻת בְּעִירִי
  choice: 好死在自己的城里
  rationale: 连接词加未完成式承接请求，可自然理解为目的；“自己的城里”表达第一人称所属及归乡之情。
- source_word: עִם קֶבֶר אָבִי וְאִמִּי
  choice: 靠近我父母的坟墓
  rationale: עִם通常意为“与……一起”，但在此安葬语境中表示在父母墓地附近；“靠近”自然传达这一空间关系，同时以脚注保留字面形式。
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留原文引人注意和当场指示的功能，语体庄重且为普通读者所能理解。
- source_word: כִמְהָם
  choice: 金罕
  rationale: 按现代普通话圣经人名惯例音译该专名。
- source_word: יַעֲבֹר עִם
  choice: 让他与……一同过河吧
  rationale: 未完成式在语境中有祈使、请求意味；“过河”保留本段反复出现的渡过约旦河主题。
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: 我主我王
  rationale: 保留对君王的双重敬称及宫廷语气。
- source_word: וַעֲשֵׂה לוֹ אֵת אֲשֶׁר טוֹב בְּעֵינֶיךָ
  choice: 您看怎样好，就怎样待他
  rationale: 自然表达“为他做你眼中看为好的事”这一希伯来惯用语，并保留决定权在王的含义。
