  rationale: 修订仅为提升现代汉语的清晰度，并收束脚注a中过度解释的内容。“在我父亲和母亲的坟墓旁”保留原文单数“坟墓”所容许的家族墓地/墓旁表述，不擅自判断父母是否合葬。
