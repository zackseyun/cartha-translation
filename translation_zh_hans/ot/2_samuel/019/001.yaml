base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/001.yaml
  text: Then the king was deeply shaken[a], and he went up to the chamber over the gate and wept. As he went, he said, “My son Absalom! My son, my son Absalom! If only I had died instead of you, Absalom, my son[b], my son!”
translation:
  language: zh_hans
  text: 王心里大为震动，就上到城门上面的楼房[a]去哭。他上去的时候说：“我儿押沙龙啊！我儿，我儿押沙龙啊！但愿我代替你死了[b]！押沙龙啊，我儿，我儿！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“城门的上层房间。”
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“谁会给……”，是表达愿望的习语，意为“但愿”或“巴不得”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְגַּז
  choice: 悲痛欲绝
  rationale: רגז可指颤抖、激动或内心受到强烈震撼；在大卫哀悼儿子的语境中，“悲痛欲绝”自然表达其剧烈的情绪震荡，而不局限于身体发抖。
- source_word: עֲלִיַּת הַשַּׁעַר
  choice: 城门楼上的房间
  rationale: עֲלִיָּה指楼上的房间，与“门”连用时指城门建筑上方的房间；此译法清楚保留其建筑位置。
- source_word: וַיֵּבְךְּ
  choice: 哭泣
  rationale: בכה明确指流泪哀哭；“哭泣”庄重而符合叙事语体。
- source_word: וְכֹה אָמַר בְּלֶכְתּוֹ
  choice: 他一边走，一边说
  rationale: 保留בְּלֶכְתּוֹ所表达的伴随动作，并以自然汉语呈现持续行走中的哀叹。
- source_word: בְּנִי
  choice: 我儿
  rationale: 逐次保留原文反复的亲属称呼，以传达哀歌的节奏和父亲的悲恸；“我儿”比“我的儿子”更适合直接呼告。
- source_word: מִי יִתֵּן
  choice: 但愿
  rationale: 该希伯来语习语字面为“谁能使……”，实际用来表达强烈而无法实现的愿望；“但愿”简洁、自然，并保留哀叹语气。
- source_word: מוּתִי אֲנִי תַחְתֶּיךָ
  choice: 我替你死了
  rationale: תַחְתֶּיךָ在此表达代替、取代之意；结合已发生的死亡，汉语“我替你死了”自然呈现反事实愿望。
- source_word: אַבְשָׁלוֹם
  choice: 押沙龙
  rationale: 采用现代中文圣经读者熟悉的传统人名译法。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。保留“我儿”的全部重复及两个“押沙龙”的呼告，以再现希伯来文哀歌的情感强度和节奏。将“城门楼上的房间”译得具体清楚；将愿望习语מִי יִתֵּן译为自然汉语“但愿”，不按字面硬译。
