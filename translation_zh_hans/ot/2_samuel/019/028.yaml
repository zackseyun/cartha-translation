base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/028.yaml
  text: He slandered your servant to my lord the king, but my lord the king is like the angel of God; so do what is good in your eyes.
translation:
  language: zh_hans
  text: 他在我主我王面前诬陷了你的仆人；我主我王却如同上帝的使者[a]；你看怎样好，就怎样做吧。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “上帝的使者”也可译作“上帝的天使”。
    reason: 说明希伯来词 מַלְאָךְ 可指“使者”或“天使”，保留原文的词义可能性。
lexical_decisions:
- source_word: וַיְרַגֵּל
  choice: 谗毁
  rationale: 该动词在这里表示以毁谤、诬告的言语中伤别人；“谗毁”既准确表达恶意进言，也符合臣仆向君王申诉时的庄重语体。
- source_word: בְּעַבְדְּךָ
  choice: 仆人
  rationale: 保留希伯来语第三人称自称的谦卑表达，不改成较直白的“我”。
- source_word: כְּמַלְאַךְ הָאֱלֹהִים
  choice: 如同上帝的使者
  rationale: מַלְאָךְ 可指一般使者，也可指天使；正文采用较宽泛的“使者”，并用脚注保留“天使”的可能译法。
- source_word: וַעֲשֵׂה הַטּוֹב בְּעֵינֶיךָ
  choice: 所以你看怎样好，就怎样做吧
  rationale: 自然传达字面为“行你眼中看为好的事”的希伯来语惯用表达，同时保留说话人将裁决权交给王的语气。
theological_decisions:
- issue: “上帝的使者”是否明确译成超自然的“天使”
  choice: 正文译“上帝的使者”，脚注说明也可译“上帝的天使”
  alternative: 如同上帝的天使
  rationale: 希伯来语 מַלְאָךְ 本身兼有“使者”和“天使”之义；不在正文中强行消除这层词义张力。
translation_notes:
  register: 采用现代、庄重而易懂的中文。“我主我王”保留原文重复的尊称和臣下口吻；“你看怎样好，就怎样做吧”以自然汉语表达原文惯用语，并保留顺服王之裁决的语气。
