  text: וּ/מְפִבֹ֨שֶׁת֙ בֶּן שָׁא֔וּל יָרַ֖ד לִ/קְרַ֣את הַ/מֶּ֑לֶךְ וְ/לֹא עָשָׂ֨ה רַגְלָ֜י/ו וְ/לֹא עָשָׂ֣ה שְׂפָמ֗/וֹ וְ/אֶת בְּגָדָי/ו֙ לֹ֣א כִבֵּ֔ס לְ/מִן הַ/יּוֹם֙ לֶ֣כֶת הַ/מֶּ֔לֶךְ עַד הַ/יּ֖וֹם אֲשֶׁר בָּ֥א בְ/שָׁלֽוֹם־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/025.yaml
  text: And Mephibosheth son of Saul came down to meet the king[a]. He had not cared for his feet, nor trimmed his mustache, nor washed his clothes[c][b], from the day the king left until the day he came in peace.
translation:
  language: zh_hans
  text: 扫罗的儿子米非波设也下去迎接王。他从王离去的那天起，直到王平安归来的那天，都没有护理自己的脚[a]，没有修整上唇的胡须[b]，也没有洗衣服。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“没有料理他的脚”；具体指哪一种脚部护理并不明确。
    reason: lexical_alternative
  - marker: b
    text: “上唇的胡须”也可译作“髭须”；原词特指上唇及其胡须部位，不一定泛指整部胡须。
    reason: lexical_alternative
lexical_decisions:
- source_word: יָרַד
  choice: 下去
  rationale: 保留动词“下去”的空间方向；叙事未要求改作不带方向的“去”。
- source_word: לִקְרַאת הַמֶּלֶךְ
  choice: 迎接王
  rationale: לִקְרַאת 表示前去与来者相会；中文“迎接”自然准确，也符合王正在归来的语境。
- source_word: וְלֹא עָשָׂה רַגְלָיו
  choice: 没有护理自己的脚
  rationale: 原文直译为“没有料理他的脚”，具体护理行为并不确定，因此采用范围较宽的“护理”，不擅自限定为修剪趾甲或洗脚。
- source_word: וְלֹא עָשָׂה שְׂפָמוֹ
  choice: 没有修整上唇的胡须
  rationale: שָׂפָם 特指上唇或其胡须部位；“修整”符合长期停止日常仪容整理的语境，同时避免扩大为整部胡须。
- source_word: וְאֶת בְּגָדָיו לֹא כִבֵּס
  choice: 也没有洗衣服
  rationale: כִבֵּס 在此明确指洗涤衣物；现代中文“洗衣服”直接自然。
- source_word: לְמִן הַיּוֹם לֶכֶת הַמֶּלֶךְ
  choice: 从王离去的那天起
  rationale: 准确表达以王离去之日为起点，不给普通动词 לֶכֶת 添加不必要的庄重色彩。
- source_word: עַד הַיּוֹם אֲשֶׁר בָּא בְשָׁלוֹם
  choice: 直到王平安归来的那天
  rationale: בְשָׁלוֹם 可表示平安、安然；结合王先前“离去”及当前回来迎接的语境，“平安归来”在中文中自然表达回返，但不添加“回家”等原文没有的信息。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事中文。“米非波设”沿用常见圣经人名译法。将时间范围前置，使三项长期未做的仪容行为在中文中排列清楚；“也”对应本节在上下文中的连接关系。
