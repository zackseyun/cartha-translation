    text: “愿上帝重重地惩罚我”直译为“愿上帝这样待我，并且再加重”；“一直”直译为“所有的日子”。
    reason: 说明希伯来语未说明具体灾祸的誓言套语，以及表示持续任职的字面期限表达。
  revision_rationale: 修订将誓言条件改为“我若不让你……”，使汉语明确表达说话者承诺任命亚玛撒取代约押，符合原文誓言的语义和句法关系。以“一直担任”替换“终身”，既自然又保留持续任职的开放范围；并修正脚注中“加倍”这一不必要的强化。
