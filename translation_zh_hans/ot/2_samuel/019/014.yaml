revisions:
- from: 你们也要对亚玛撒说：“你不是我的骨肉吗？如果你不取代约押，在我面前终身作军队统帅，愿上帝重重地惩罚我！”[a]
  to: 你们要对亚玛撒说：“你不是我的骨肉吗？我若不让你代替约押，在我面前一直担任军队统帅，愿上帝重重地惩罚我！”[a]
  rationale: 修订将誓言条件改为“我若不让你……”，使汉语明确表达说话者承诺任命亚玛撒取代约押，符合原文誓言的语义和句法关系。以“一直担任”替换“终身”，既自然又保留持续任职的开放范围；并修正脚注中“加倍”这一不必要的强化。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T05:27:01Z'
review_pass:
  verdict: revise
  source_fidelity: 草稿准确保留了亚玛撒、骨肉亲属语、军事职位和约押被替代等主要内容。但“如果你不取代约押，在我面前终身作军队统帅”在汉语句法上把“不取代约押”读作亚玛撒的行为，未明确表达誓言所保证的是说话者将任命亚玛撒取代约押。原文的否定条件应由说话者的任命行为承担。
  naturalness: “你不是我的骨肉吗？”和“军队统帅”自然庄重。“在我面前终身作”略显生硬，且“终身”容易指人的一生，超过任职语境中“所有的日子／持续任职”的开放范围；“一直担任”更自然且不过度限定期限。
  terminology: “亚玛撒”“约押”“上帝”“骨肉”“军队统帅”均合适。誓言套语可功能性译作“愿上帝重重惩罚我”，但脚注的字面译法应避免“加倍”，因为“并且再加添／加重”并不必然表示加倍。
  issues:
  - severity: high
    issue: 誓言条件句的施事与任命关系不清且易误解
    rationale: “如果你不取代约押”会理解为亚玛撒没有取代约押；原文在誓言中保证的是大卫若不让亚玛撒在自己面前担任军队统帅、替代约押，便受神惩罚。应明示“我若不让你……”。
  - severity: medium
    issue: “终身”过度限定 כָּל־הַיָּמִים
    rationale: 该短语在这里表示持续的任职或“所有的日子”，但未必明确等同亚玛撒的一生。“一直担任”保留持续性而不扩大为终身任期。
  - severity: low
    issue: 脚注将 וְכֹה יוֹסִיף 释作“加倍地待我”过强
    rationale: 该誓言公式表达“这样待我，并且再加添／加重”，不要求数学意义的“双倍”。
  revised_text: 你们要对亚玛撒说：“你不是我的骨肉吗？我若不让你代替约押，在我面前一直担任军队统帅，愿上帝重重地惩罚我！”[a]
  revised_footnotes:
