base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/014.yaml
  text: And say to Amasa[a], ‘Are you not my bone and my flesh? May God do so to me, and more also, if you are not commander of the army before me all the days in place of Joab.’
translation:
  language: zh_hans
  text: 你们要对亚玛撒说：“你不是我的骨肉吗？我若不让你代替约押，在我面前一直担任军队统帅，愿上帝重重地惩罚我！”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “愿上帝重重地惩罚我”直译为“愿上帝这样待我，并且再加重”；“一直”直译为“所有的日子”。
    reason: 说明希伯来语未说明具体灾祸的誓言套语，以及表示持续任职的字面期限表达。
lexical_decisions:
- source_word: וְלַעֲמָשָׂא תֹּמְרוּ
  choice: 你们也要对亚玛撒说
  rationale: 保留复数受命者和指令语气；“也要对……说”符合现代汉语叙事表达。
- source_word: הֲלוֹא עַצְמִי וּבְשָׂרִי אָתָּה
  choice: 你不是我的骨肉吗
  rationale: 保留期待肯定回答的反问，并以自然的汉语亲属惯用语“我的骨肉”传达“我的骨、我的肉”。
- source_word: כֹּה יַעֲשֶׂה לִּי אֱלֹהִים וְכֹה יוֹסִיף
  choice: 愿上帝重重地惩罚我
  rationale: 这是省略具体灾祸内容的起誓套语；汉语如此表达能传达自我咒诅的郑重语气，而不擅自指定惩罚内容。
- source_word: אִם לֹא
  choice: 如果你不……愿……
  rationale: 在誓言中引出所保证之事；调整为自然汉语条件句，同时保留原文的誓言逻辑。
- source_word: שַׂר צָבָא
  choice: 军队统帅
  rationale: 指最高军事长官；“军队统帅”清楚、庄重而现代。
- source_word: תִּהְיֶה לְפָנַי
  choice: 在我面前……作
  rationale: 保留 לְפָנַי 的空间和臣属意味，既可理解为在王面前任职，也含在其权下服事之意。
- source_word: כָּל הַיָּמִים
  choice: 终身
  rationale: 字面为“所有的日子”；在任命语境中指持续任职。“终身”自然简洁，但其字面形式及可能范围在脚注说明。
- source_word: תַּחַת יוֹאָב
  choice: 取代约押
  rationale: תַּחַת 在这里表示替代而非隶属，明确说明亚玛撒将接替约押。
theological_decisions:
- issue: 誓言套语中 אֱלֹהִים 的数
  choice: 上帝
  alternative: 众神
  rationale: 该词虽具复数形态，但在以色列叙事的这一惯用誓言中指独一的上帝，谓语也按单数理解。
- issue: 是否具体说明誓言中的惩罚
  choice: 重重地惩罚我
  alternative: 愿上帝这样待我，并且加倍地待我
  rationale: 原文故意不说明所咒诅的灾祸。“重重地惩罚我”传达其功能而不具体补入死亡或其他刑罚；脚注保留字面形式。
translation_notes:
  register: 采用现代、庄重且适合公众诵读的简体中文。“骨肉”保留亲属诉求的形象性；誓言采用汉语功能对等表达，并用脚注呈现其刻意含蓄的字面形式。
