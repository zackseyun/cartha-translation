base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/010.yaml
  text: And all the people were disputing throughout all the tribes of Israel[a], saying, “The king delivered us from the hand of our enemies, and he rescued us from the hand of the Philistines[c][b], but now he has fled from the land because of Absalom.”
translation:
  language: zh_hans
  text: 以色列各支派的众人都在争论[a]，说：“王曾救我们脱离仇敌的手，又救我们脱离非利士人的手[b]；如今，他却因押沙龙而逃离了这地[c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“都在辩论”或“彼此争执”。希伯来文所表达的是各支派中普遍出现的争议，不只是一般交谈。
    reason: lexical_alternative
  - marker: b
    text: “仇敌的手”和“非利士人的手”是希伯来语表达，意思是仇敌和非利士人的权势或控制。
    reason: lexical_alternative
  - marker: c
    text: “因押沙龙”也可译作“从押沙龙面前”或“为躲避押沙龙”。此处希伯来文的表达可指从押沙龙面前逃离，或因押沙龙而逃离。
    reason: lexical_alternative
lexical_decisions:
- source_word: נָדוֹן
  choice: 都在争论
  rationale: 该词是 דין 的尼法勒分词，在本处表示民众持续处于争辩或议论之中；“都在争论”既保留分歧和交锋的力度，也符合现代汉语。
- source_word: בְּכָל שִׁבְטֵי יִשְׂרָאֵל
  choice: 以色列各支派中的
  rationale: 介词短语说明争论遍及以色列各支派；此译自然表达其分布范围。
- source_word: הִצִּילָנוּ
  choice: 救我们脱离
  rationale: נצל 在军事政治语境中指从危险或权势下解救出来；“救……脱离”准确而通顺。
- source_word: מִכַּף אֹיְבֵינוּ
  choice: 脱离仇敌的手
  rationale: 保留希伯来文“手”的意象，表示脱离仇敌的权势或控制；该表达在中文中仍可理解。
- source_word: מִלְּטָנוּ
  choice: 救我们脱离
  rationale: מלט 与前一动词意义重叠，指使人逃脱或获救。中文重复“救我们脱离”可保留原文平行结构，避免刻意制造原文没有的强烈差别。
- source_word: וְעַתָּה
  choice: 如今……却
  rationale: 该表达在上下文中将王过去的拯救与当前逃亡形成对比；“如今……却”自然呈现这一转折。
- source_word: בָּרַח מִן הָאָרֶץ
  choice: 逃离了这地
  rationale: ברח 表示逃走，הארץ 在本语境指当时所说的国土或地域；“这地”简洁保留所指范围。
- source_word: מֵעַל אַבְשָׁלוֹם
  choice: 因押沙龙
  rationale: 逃跑动词后的 מֵעַל 可表达从某人面前逃离或因其威胁而逃；正文采用自然的原因表达，同时以脚注保留形式和语义上的可能性。
