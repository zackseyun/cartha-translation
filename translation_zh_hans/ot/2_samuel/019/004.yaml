  text: So the people slipped into the city that day, as people who are ashamed slip away when they flee in battle.
translation:
  language: zh_hans
  text: 那一天，百姓悄悄地进了城，就像人在战场上逃跑时，因羞愧而悄悄躲避人一样。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתְגַּנֵּב / יִתְגַּנֵּב
  choice: 悄悄地进了／悄悄回来
  rationale: 该反身形式在此表示避人耳目、羞惭低调地行动；用“悄悄”自然传达其情态，同时避免“偷进”在现代汉语中可能引起盗窃含义。第二处依上下文译为“悄悄回来”，对应百姓进入本城的比喻。
- source_word: הַנִּכְלָמִים
  choice: 蒙受羞辱的人
  rationale: 该词可指受辱、羞愧；“蒙受羞辱”保留其既有客观受辱也有主观羞惭的语义张力。
- source_word: בְּנוּסָם בַּמִּלְחָמָה
  choice: 战败逃跑
  rationale: 原文直义为“他们在战争中逃跑时”。这里以简练汉语表达因战场逃遁而受辱的情境；“战败”由语境隐含，但不另加具体战况。
theological_decisions: []
