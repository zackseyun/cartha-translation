  text: And it was reported to Joab, “Look, the king is weeping and mourning over Absalom.”
translation:
  language: zh_hans
  text: 有人向约押报告：“看哪，王正在为押沙龙哭泣、哀悼。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֻּגַּד
  choice: 有人禀告……说
  rationale: 该词是 נגד 的霍法勒式，表示消息被告知。汉语若机械使用被动句会显得生硬；“有人禀告”不明确具体传话者，同时以符合君王叙事语境的自然表达传达其被动含义。
- source_word: לְיוֹאָב
  choice: 约押
  rationale: 介词标明禀告的对象；人名按现代中文圣经通行形式译作“约押”。
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留指示语气及报告中的即时感。“看哪”庄重且为普通读者所理解，也避免完全省略原文的提示词。
- source_word: הַמֶּלֶךְ
  choice: 王
  rationale: 原文使用带定冠词的头衔，所指为大卫；保留头衔，不直接改为人名。
- source_word: בֹּכֶה
  choice: 正在……哭泣
  rationale: 分词表达持续进行的动作；“正在”清楚呈现其延续状态。
- source_word: וַיִּתְאַבֵּל
  choice: 哀悼
  rationale: אבל 的希特帕勒式表示因丧失而哀伤、举哀。与前面的持续性分词并列表达为“正在……哭泣哀悼”，既自然又保留丧亲语境。
- source_word: עַל אַבְשָׁלֹם
  choice: 为押沙龙
  rationale: עַל 在哀悼动词之后标明哀悼的对象或缘由；中文“为押沙龙”自然保留这层关系。人名采用通行译名“押沙龙”。
