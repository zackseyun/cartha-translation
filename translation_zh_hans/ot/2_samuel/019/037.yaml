  yaml_path: translation/ot/2_samuel/019/037.yaml
  text: For your servant would only cross the Jordan a little way with the king[a]; why should the king repay me with this reward?
translation:
  language: zh_hans
  text: 仆人不过陪王过约旦河，走一小段路；王为什么要这样报答我[a]呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“王为什么要以这样的报偿回报我呢？”原文“报答”和“报偿”来自同一词根，着重表达回报之意。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּ/מְעַט
  choice: 不过……走一小段路
  rationale: כִּי承接上下文，说明巴西莱推辞的理由；מְעַט在这里表示陪送的路程很短。这样译既保留因果语气，也符合现代汉语表达。
- source_word: יַעֲבֹר
  choice: 过
  rationale: 未完成式在此表示意愿或预期行动，而非单纯预言未来；结合宾语“约旦河”，译作“过”自然明确。
- source_word: עַבְדְּךָ
  choice: 仆人
  rationale: 这是臣民对君王自称的谦辞；“仆人”既贴近原文，也比“奴隶”更符合此处的宫廷语境。
- source_word: אֶת הַ/יַּרְדֵּן
  choice: 过约旦河
  rationale: 在עבר之后，אֶת标示“约旦河”为所跨越的对象；汉语以“过约旦河”表达最自然。
- source_word: אֶת הַ/מֶּלֶךְ
  choice: 陪王
  rationale: 此处אֶת是表示伴随的介词“与……同去”，不是宾语标记；“陪王”准确传达巴西莱护送君王的意思。
- source_word: וְ/לָמָּה
  choice: 为什么……呢
  rationale: 引出带有婉拒意味的反问；句末“呢”自然呈现礼貌而坚定的语气。
- source_word: יִגְמְלֵ/נִי ... הַ/גְּמוּלָה הַ/זֹּאת
  choice: 这样报答我
  rationale: 动词גמל与同根名词גמולה连用，强调回报或报偿。正文采用自然简洁的汉语，脚注说明原文的同根反复。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而自然的叙事语言。“仆人”保留对君王说话时的谦称；分号呈现前因后问的结构。为避免生硬，没有在正文机械复制希伯来文的同根反复，而在脚注中保留这一修辞信息。
