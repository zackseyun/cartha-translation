source:
  edition: WLC
  text: וַ/יַּעֲבֹ֧ר כָּל הָ/עָ֛ם אֶת הַ/יַּרְדֵּ֖ן וְ/הַ/מֶּ֣לֶךְ עָבָ֑ר וַ/יִּשַּׁ֨ק הַ/מֶּ֤לֶךְ לְ/בַרְזִלַּי֙ וַ/יְבָ֣רֲכֵ֔/הוּ וַ/יָּ֖שָׁב לִ/מְקֹמֽ/וֹ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/040.yaml
  text: All the people crossed the Jordan[a], and the king crossed over. Then the king kissed Barzillai and blessed him, and he returned to his own place.
translation:
  language: zh_hans
  text: 众人都过了约旦河，王也过了河。王亲吻巴西莱，为他祝福；随后他[a]回到自己的地方去了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他”最自然是指巴西莱；原文没有在这里明说主语。
    reason: 说明原文隐含主语的指代歧义。
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: 过了
  rationale: 动词 עבר 在这里指渡过约旦河；“过了”简洁自然，也保留叙事动作。
- source_word: כָּל הָעָם
  choice: 众人
  rationale: עָם 在此泛指随行、聚集的人群，不宜限定为军队；“众人”符合现代汉语叙事习惯。
- source_word: אֶת הַיַּרְדֵּן
  choice: 约旦河
  rationale: 希伯来文名称指约旦河；汉语通常加“河”以明确地理实体。
- source_word: וְהַמֶּלֶךְ עָבָר
  choice: 王也过了河
  rationale: 原文再次使用 עבר，并以王为主语；“也”自然表达王随众人渡河，同时保留重复动作。
- source_word: וַיִּשַּׁק
  choice: 亲吻
  rationale: נשק 在此表示亲吻，是亲情与送别的举动；“亲吻”庄重而不生硬。
- source_word: לְבַרְזִלַּי
  choice: 巴西莱
  rationale: 采用现代中文圣经传统中通行的人名音译。
- source_word: וַיְבָרֲכֵהוּ
  choice: 为他祝福
  rationale: ברך 明确表示祝福；虽处于送别场景，仍不将其弱化为普通道别。
- source_word: וַיָּשָׁב לִמְקֹמוֹ
  choice: 随后他回到自己的地方去了
  rationale: 保留原文未明说主语的第三人称形式，也不把 מָקוֹם 过度具体化为“家”；“随后”使中文叙事衔接自然。
theological_decisions:
- issue: וַיָּשָׁב 的隐含主语
  choice: 正文保留“他”的指代开放性，并以脚注说明最自然的所指
  alternative: 直接译作“巴西莱回到自己的地方去了”
  rationale: 上下文最自然地表明返回者是巴西莱，但本节希伯来文本身没有重复姓名；保留代词可忠实呈现原文的语法形式与有限歧义。
translation_notes:
  register: 采用现代、庄重而清楚的叙事文体。“众人”避免把 עָם 限定为军队；“为他祝福”保留送别场景中的明确祝福含义。脚注标记紧随存在指代歧义的“他”，而不置于“约旦河”之后。
