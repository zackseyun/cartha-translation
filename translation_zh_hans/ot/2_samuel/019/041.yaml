base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/041.yaml
  text: Then the king crossed over to Gilgal[a], and Kimham crossed over with him. And all the people of Judah escorted the king across, and also half the people of Israel.
translation:
  language: zh_hans
  text: 王过河前往吉甲；金罕也和他一同过了河。犹大所有的百姓都护送王过河[a]，以色列民中也有一半人这样做。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “护送王过河”也可译作“领王过河”或“使王过河”。这里的希伯来语动词带直接宾语，可有使动的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: 过了河
  rationale: עבר 在上下文中指过约旦河；中文补出“河”，使所指自然清楚，同时保留渡河动作。
- source_word: הַגִּלְגָּלָה
  choice: 往吉甲去
  rationale: 地名后的方向词尾表示朝向吉甲；“往吉甲去”既传达方向，也避免误解为过河动作发生在吉甲。
- source_word: וְכִמְהָן
  choice: 金罕
  rationale: 按现代普通话圣经人名的通行音译处理该专名。
- source_word: עָבַר עִמּוֹ
  choice: 和他一同过了河
  rationale: 重复译出 עבר 的过河含义，以保留金罕与王同行渡河的叙事联系。
- source_word: וְכָל עַם יְהוּדָה
  choice: 犹大众人
  rationale: עַם יְהוּדָה 指犹大一方的民众；采用简洁、自然且保留政治群体区分的表达。
- source_word: וַיַּעַבְרוּ אֶת־הַמֶּלֶךְ
  choice: 护送王过河
  rationale: עבר 带直接宾语时在此具有使动或转移意味；“护送王过河”自然表达众人陪同并协助王渡河，而不把使动程度说得过强。
- source_word: וְגַם
  choice: 也
  rationale: 自然表达新增的参与群体，并保留附加意味。
- source_word: חֲצִי עַם יִשְׂרָאֵל
  choice: 以色列民也有一半
  rationale: 保留原文的数量表述以及犹大与以色列之间的政治区分，不进一步解释“一半”的计算方式。
