  text: וַ/יָּבֹ֥א יוֹאָ֛ב אֶל הַ/מֶּ֖לֶךְ הַ/בָּ֑יִת וַ/יֹּאמֶר֩ הֹבַ֨שְׁתָּ הַ/יּ֜וֹם אֶת פְּנֵ֣י כָל עֲבָדֶ֗י/ךָ הַֽ/מְמַלְּטִ֤ים אֶֽת נַפְשְׁ/ךָ֙ הַ/יּ֔וֹם וְ/אֵ֨ת נֶ֤פֶשׁ בָּנֶ֨י/ךָ֙ וּ/בְנֹתֶ֔י/ךָ וְ/נֶ֣פֶשׁ נָשֶׁ֔י/ךָ וְ/נֶ֖פֶשׁ פִּלַגְשֶֽׁי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/006.yaml
  text: Then Joab came into the house to the king and said[a], “Today you have put to shame all your servants who today saved your life, and the lives of your sons and your daughters[c][b], and the lives of your wives and your concubines.”
translation:
  language: zh_hans
  text: 约押进屋去见王[a]，对他说：“今天，你使所有臣仆蒙羞；他们今天救了你的性命，也救了你儿女、妻妾的性命[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “屋”可能指王的住处或王宫。
    reason: cultural_note
  - marker: b
    text: 原文这里所用的词可指“生命、性命”；在本节是指免于死亡，并非专指“灵魂”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבָּיִת
  choice: 王所在的屋里
  rationale: 原文直译为“屋里”，并以“王”说明约押所到之处；此译保留“屋”的措辞，同时用自然汉语交代王在其中。语境可能指王的住处或宫中房舍。
- source_word: הֹבַשְׁתָּ ... אֶת־פְּנֵי
  choice: 使……蒙羞
  rationale: 使役形式表达“使人羞愧”，而“使……蒙羞”自然传达公共羞辱之意；原文具体说“使……的脸蒙羞”。
- source_word: עֲבָדֶיךָ
  choice: 臣仆
  rationale: 此处指服事君王并参与作战的人；“臣仆”兼顾其臣属身份与服事关系，不限于官员。
- source_word: הַמְמַלְּטִים
  choice: 救了
  rationale: 该分词表示从危险中搭救、使人脱险；上下文明确涉及保全性命。
- source_word: נַפְשְׁךָ / נֶפֶשׁ
  choice: 性命
  rationale: נפש在这里指免于死亡的生命，并非专指非物质的“灵魂”；“性命”符合生死危急的语境。
- source_word: בָּנֶיךָ ... וּבְנֹתֶיךָ
  choice: 儿女
  rationale: 原文分别列出“儿子”和“女儿”；汉语“儿女”简洁自然，并完整涵盖两者。
- source_word: נָשֶׁיךָ ... פִּלַגְשֶׁיךָ
  choice: 妻妾
  rationale: “妻妾”保留原文对妻子与较低婚姻地位女性的区分，符合古代宫廷家庭语境，又不附加道德评价。
- source_word: וַיָּבֹא ... וַיֹּאמֶר
  choice: 进到……对他说
  rationale: 连续叙事动词推进事件；现代汉语无需机械重复“然后”，即可自然呈现先进入、后说话的次序。
theological_decisions:
- issue: 社会与家庭身份词是否加入道德评价
  choice: 妻妾
  alternative: 妻子和妾
  rationale: 原文只是列举大卫家中的两类女性。译文保留历史社会类别，不美化、弱化或谴责该制度。
- issue: נפש是否译为“灵魂”
  choice: 性命
  alternative: 灵魂
  rationale: 这里所说的是臣仆从死亡危险中救出的身体生命；译为“灵魂”会引入原文在本语境中没有表达的身心二分含义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“臣仆”体现君臣关系；“蒙羞”自然传达希伯来语“使脸蒙羞”的具体习语。保留两次“今天”，以呈现约押责备时的强调。
