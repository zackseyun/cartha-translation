base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/019.yaml
  text: The ferryboat crossed over to bring the king’s household across and to do what was good in his sight[c][b][a], and Shimei son of Gera fell before the king as he was crossing the Jordan.
translation:
  language: zh_hans
  text: 渡船[a]已经过了河，为要把王的家属和随从[b]送过河，并照王看为好的去办[c]。王过约旦河时，基拉的儿子示每伏倒在王面前。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“渡河的船”；希伯来语所用的词指渡河的工具，具体船型不能确定。
    reason: lexical_alternative
  - marker: b
    text: “王的家属和随从”对应“王的家”，指王室家庭成员及随行人员，不是王宫建筑。
    reason: cultural_note
  - marker: c
    text: 希伯来语直译为“去行他眼中看为好的事”，意思是照他所喜悦或认可的去办。
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֲבָרָה
  choice: 渡船
  rationale: 此名词指渡河的工具；结合约旦河场景，译作“渡船”具体自然，同时保留其确切形制不完全确定的余地。
- source_word: וְעָבְרָה
  choice: 渡了过去
  rationale: 阴性单数完成式与“渡船”一致，在叙事中表明渡船渡到另一边的动作。
- source_word: לַעֲבִיר אֶת־בֵּית הַמֶּלֶךְ
  choice: 要把王的家眷送过河
  rationale: 使役式不定词表示使王家的人渡河；“送过河”符合现代汉语表达。
- source_word: בֵּית הַמֶּלֶךְ
  choice: 王的家眷
  rationale: 此处所指是随王渡河的王室人员，而不是王宫建筑；“家眷”比直译“王的家”更清楚。
- source_word: וְלַעֲשׂוֹת הַטּוֹב בְּעֵינָיו
  choice: 并照王看为好的去办
  rationale: 保留“在他眼中为好”这一希伯来语习语的形象和评价意味，同时以自然汉语表明是按王所喜悦或认可的办理。
- source_word: נָפַל לִפְנֵי הַמֶּלֶךְ
  choice: 伏倒在王面前
  rationale: 既保留“倒下”的动作，也传达在君王面前谦卑求告的姿态，而不额外规定更具体的礼仪形式。
- source_word: בְּעָבְרוֹ בַּיַּרְדֵּן
  choice: 王过约旦河时
  rationale: 带后缀的不定词结构表示同时发生的时间；语境中最自然的所指是王，因此用汉语明说“王”以避免代词含混。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“渡了过去”保留叙事动作，“伏倒”兼顾原文的字面动作与求告姿态。脚注分别说明渡河工具的词义范围、“王的家”在此处的集合含义，以及“眼中看为好”的希伯来习语。
