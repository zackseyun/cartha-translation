base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/029.yaml
  text: For all my father's house were nothing but men deserving death before my lord the king[a], yet you set your servant among those who eat at your table. So what further right do I have[b], that I should cry out any more to the king?
translation:
  language: zh_hans
  text: 因为我父的全家在我主我王面前，无非都是该死的人[a]；你却让仆人列在与你同席吃饭的人中。我还有什么权利[b]，可以再向王呼求呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文作“死之人”一类的表达，是指负有死罪、应被处死的人。
    reason: lexical_alternative
  - marker: b
    text: “权利”所译的希伯来词在这里指正当的要求或申诉依据，并非主要指个人品德上的“义”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי לֹא הָיָה ... כִּי אִם
  choice: 本都是
  rationale: 这一结构表示强调性的限定；结合上下文，用“本都是”自然表达全家在王面前无非是该死之人的意思。
- source_word: כָּל בֵּית אָבִי
  choice: 我父全家
  rationale: 这是指父系家族或整个家室的希伯来亲属表达；“我父全家”简洁、自然，也保留了家族范围。
- source_word: אַנְשֵׁי מָוֶת
  choice: 该死的人
  rationale: 字面为“死亡之人”，在此指应当被处死或负有死罪的人，并非已经死亡的人。
- source_word: לַאדֹנִי הַמֶּלֶךְ
  choice: 在我主我王面前
  rationale: 介词表示相对于王的地位或在王判断之下；“在……面前”保留了臣民面对君王的语境。
- source_word: וַתָּשֶׁת
  choice: 你却使……列在
  rationale: 动词本义为“放置、安置”；“却”体现前后强烈反差，“使……列在”适合被纳入王席间宾客之列的场景。
- source_word: עַבְדְּךָ
  choice: 仆人
  rationale: 这里是臣下对王自称的谦辞，并不着重表达奴隶身份。
- source_word: בְּאֹכְלֵי שֻׁלְחָנֶךָ
  choice: 列在与你同席吃饭的人中
  rationale: 原文指被纳入在王桌前吃饭、受王供养或恩待的人群；译文保留同桌吃饭的具体意象。
- source_word: וּמַה יֶּשׁ לִי עוֹד צְדָקָה
  choice: 我还有什么权利
  rationale: צְדָקָה 在此主要指可向王提出的正当要求或依据，而非个人道德上的义；“权利”最贴合申诉语境。
- source_word: וְלִזְעֹק עוֹד אֶל הַמֶּלֶךְ
  choice: 还能向王呼求呢
  rationale: זעק 指迫切呼喊，也常用于求助、申诉；“呼求”既保留力度，也符合向王求告的语境。
theological_decisions:
- issue: צְדָקָה 在本节中的含义
  choice: 译为“权利”，指向王申诉的正当权利或依据
  alternative: 译为“义”或“公义”
  rationale: 上下文谈的是受王恩待之后是否仍有资格申诉，因此法律—关系层面的“权利”比抽象的道德之义更合适；脚注保留原词可能引起的语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的宫廷陈述语体。“我主我王”“仆人”保留臣下对君王的谦敬口吻；句末“呢”自然表达反问，不削弱原文的郑重感。
