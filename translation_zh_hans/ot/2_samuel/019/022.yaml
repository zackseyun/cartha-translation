  yaml_path: translation/ot/2_samuel/019/022.yaml
  text: But Abishai son of Zeruiah answered and said[a], “Should Shimei not be put to death for this, because he cursed Yahweh’s anointed?”
translation:
  language: zh_hans
  text: 洗鲁雅的儿子亚比筛回答说：“示每既然咒骂了雅威的受膏者，难道不该因此被处死吗？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: 回答说
  rationale: 两个叙事动词共同引出回应；“回答说”既保留答话性质，也符合现代汉语叙事习惯。
- source_word: אֲבִישַׁי בֶּן צְרוּיָה
  choice: 洗鲁雅的儿子亚比筛
  rationale: 按现代汉语自然语序保留原文的亲属身份说明，并采用通行圣经人名译法。
- source_word: הֲתַחַת זֹאת לֹא יוּמַת
  choice: 难道不该因此被处死吗
  rationale: 反问句表达亚比筛主张执行死刑；“因此”传达 תַּחַת זֹאת 在此处的缘由或报应含义，“被处死”反映 מות 的使役被动形态。
- source_word: שִׁמְעִי
  choice: 示每
  rationale: 采用现代中文圣经中通行的人名译法。
- source_word: כִּי קִלֵּל
  choice: 既然咒骂了
  rationale: כִּי 引出主张处死示每的理由；在反问语境中，“既然”自然呈现亚比筛视此理由为既定事实的语气。
- source_word: מְשִׁיחַ יְהוָה
  choice: 雅威的受膏者
  rationale: “受膏者”保留 משיח 的王权与神圣委任含义；“雅威”直接音译四字神名 יהוה。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华／上主
  rationale: 原文直接使用四字神名；“雅威”较贴近学界通常重构的读音，也避免以称号替代专名。
- issue: מְשִׁיחַ 的所指与表达
  choice: 受膏者
  alternative: 受膏的王
  rationale: 原文只说“受膏者”，语境指大卫，但不在正文中增补“王”，从而保留该称谓本身的神学与语义幅度。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“难道不该……吗”保留希伯来文反问的强烈主张；语序经过汉语化处理，但未消除原文中“因此”可兼具缘由与相应报应意味的张力。
