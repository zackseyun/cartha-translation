base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/007.yaml
  text: to love those who hate you and to hate those who love you[a]. For you have made it clear today that commanders and servants mean nothing to you; for I know today that if Absalom were alive and all of us were dead today[b], then it would be right in your eyes.
translation:
  language: zh_hans
  text: 你爱那些恨你的人，恨那些爱你的人。你今天已经表明，在你眼中，将领和臣仆都算不得什么[a]。我今天算是看明白了：要是押沙龙还活着，而我们今天全都死了[b]，那在你眼中倒是对的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“对你而言，没有将领和臣仆。”这里的意思是，他们在你心中毫无分量。
    reason: lexical_alternative
  - marker: b
    text: 或译：“巴不得押沙龙还活着，而我们今天全都死了。”约押说的是尖锐的反事实指控，并非逐字转述大卫说过的话。
    reason: alternative_reading
lexical_decisions:
- source_word: לְאַהֲבָה אֶת שֹׂנְאֶיךָ
  choice: 爱那些恨你的人
  rationale: 保留两个分词的动词意味及与下句的鲜明对照；现代汉语不必将其名词化为“仇敌”。
- source_word: וְלִשְׂנֹא אֶת אֹהֲבֶיךָ
  choice: 恨那些爱你的人
  rationale: 与前半句形成平行结构，准确保留约押指控中的修辞张力。
- source_word: הִגַּדְתָּ
  choice: 你已经表明
  rationale: 此处并非指大卫口头宣告，而是说他的行为显明了他的态度；“表明”自然传达这一语用意义。
- source_word: שָׂרִים
  choice: 将领
  rationale: 上下文是军事与王权危机，所指主要是大卫麾下的军事领袖；“将领”比“首领”或“官长”更贴合场景。
- source_word: עֲבָדִים
  choice: 臣仆
  rationale: 此处泛指服事君王并效忠于他的部属，不宜狭义译作“奴隶”；“臣仆”兼顾王室语境与现代可懂性。
- source_word: אֵין לְךָ שָׂרִים וַעֲבָדִים
  choice: 在你眼中，将领和臣仆都算不得什么
  rationale: 希伯来表达字面为“对你而言没有将领和臣仆”，语境意义是他们在大卫心中毫无分量；正文采用自然汉语表达，并以脚注保留较直译形式。
- source_word: יָדַעְתִּי הַיּוֹם
  choice: 我今天算是看明白了
  rationale: 完成式表达约押根据当天情形所得出的强烈结论；“算是看明白了”符合尖锐责备的口吻。
- source_word: לֹא אַבְשָׁלוֹם חַי וְכֻלָּנוּ הַיּוֹם מֵתִים
  choice: 要是押沙龙还活着，而我们今天全都死了
  rationale: 上下文要求反事实条件意义；“要是”使汉语关系清楚，同时不把约押的指控误作大卫亲口说过的话。
- source_word: יָשָׁר בְּעֵינֶיךָ
  choice: 那在你眼中倒是好的
  rationale: 保留“在眼中”的希伯来惯用表达及其价值判断意味；“倒是”传达约押讽刺而尖锐的控诉。
