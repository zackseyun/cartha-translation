base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/024.yaml
  text: And the king said to Shimei[a], “You shall not die.” And the king swore to him.
translation:
  language: zh_hans
  text: 王对示每说：“你不会死[a]。”王又向他起誓。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较具解释性地译作：“你不会被处死。”希伯来文直译为“你不会死”；这里可能是王所作的保证，表示赦免示每，不将他处死。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 未完成式叙事形式承接下一动作；现代汉语通常无需逐字译出连接词“和/于是”，以“说”自然推进叙事。
- source_word: הַמֶּלֶךְ
  choice: 王
  rationale: 定冠词所指为上下文已知的君王；“王”简洁、庄重，也符合圣经历史叙事语体。
- source_word: אֶל שִׁמְעִי
  choice: 对示每
  rationale: 介词标明说话对象；人名 שִׁמְעִי 按通行中文圣经译名译为“示每”。
- source_word: לֹא תָמוּת
  choice: 你不会死
  rationale: 直译否定的 מות 未完成式，既可表达郑重保证，也可具有王命效力；保留“死”可避免在正文中明确增添“被处死”的解释。
- source_word: וַיִּשָּׁבַע
  choice: 又……起誓
  rationale: שבע 的尼法勒词干表示起誓；“起誓”在现代汉语中自然而庄重，“又”承接前一叙事动作。
- source_word: לוֹ
  choice: 向他
  rationale: 代词后缀回指示每；“向他起誓”保留希伯来语的对象关系，不额外补出誓言内容。
theological_decisions:
- issue: 王的保证是否特指免于处决
  choice: 正文译作“你不会死”，脚注说明可能指“不被处死”
  alternative: “你不会被处死”
  rationale: 希伯来文表层只说“你不会死”，但语境可使其具有赦免处决的司法含义。正文保留原文的措辞和张力，脚注提示解释性读法。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“王”比“国王”更贴合古代以色列历史叙事语境；“向他起誓”准确保留原文关系，同时避免补入希伯来文未明说的宾语。
