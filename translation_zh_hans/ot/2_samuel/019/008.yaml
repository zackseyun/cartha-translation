revisions:
- from: 现在你起来，出去，安慰你的臣仆[a]。我指着耶和华起誓：你若不出去，今晚必没有一个人留下来陪你。这对你将是更大的灾祸，胜过你从年轻时直到如今所遭遇的一切灾祸。
  to: 现在你起来，出去，对你的臣仆好言相劝[a]。我指着耶和华起誓：你若不出去，今晚必没有一个人留在你身边。这对你将是更大的灾祸，胜过你从年轻时直到如今所遭遇的一切灾祸。
  rationale: 将正文的“安慰”改为“好言相劝”，以保留希伯来习语在本语境中的安抚与劝服双重作用；相应调整脚注，使其与正文一致。将“留下来陪你”改为“留在你身边”，更准确表达部属撤离支持的后果。其余措辞无需改动。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T05:27:01Z'
review_pass:
  verdict: revise
  source_fidelity: “安慰你的臣仆”将“对心说话”所含的劝慰、争取和说服意味收窄为单一的安慰；在约押要求大卫挽回部属支持的语境中，宜采用同时保留善意劝说语气的表达。其余主要信息——两个命令、奉耶和华之名起誓、今夜无人留下，以及与一生所遭灾祸的比较——均忠实传达。
  naturalness: 整体语言通顺、庄重。“对你的臣仆好言相劝”比“安慰你的臣仆”更贴合此处紧迫的政治劝告，也自然现代。“留在你身边”可表达原文“与您同住／留下”的后果，同时避免“陪你”略偏私人陪伴的色彩。
  terminology: “臣仆”适合王室属下的历史语境；“耶和华”准确呈现神名且符合通行中文圣经用语；“灾祸”正确体现此处 רָעָה 指遭遇的祸患，而非道德上的邪恶。
