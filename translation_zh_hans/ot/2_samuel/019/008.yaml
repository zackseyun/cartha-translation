source:
  edition: WLC
  text: וְ/עַתָּה֙ ק֣וּם צֵ֔א וְ/דַבֵּ֖ר עַל לֵ֣ב עֲבָדֶ֑י/ךָ כִּי֩ בַ/יהוָ֨ה נִשְׁבַּ֜עְתִּי כִּי אֵינְ/ךָ֣ יוֹצֵ֗א אִם יָלִ֨ין אִ֤ישׁ אִתְּ/ךָ֙ הַ/לַּ֔יְלָה וְ/רָעָ֧ה לְ/ךָ֣ זֹ֗את מִ/כָּל הָ/רָעָה֙ אֲשֶׁר בָּ֣אָה עָלֶ֔י/ךָ מִ/נְּעֻרֶ֖י/ךָ עַד עָֽתָּה־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/008.yaml
  text: Now get up[a], go out, and speak to the heart of your servants, for I swear by Yahweh that if you do not go out, not a man will stay with you tonight, and this will be worse for you than all the trouble that has come upon you from your youth until now.
translation:
  language: zh_hans
  text: 现在你起来，出去，对你的臣仆好言相劝[a]。我指着耶和华起誓：你若不出去，今晚必没有一个人留在你身边。这对你将是更大的灾祸，胜过你从年轻时直到如今所遭遇的一切灾祸。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“对你臣仆的心说话”，意思是以亲切、安慰、鼓励或劝勉的话对他们说。
    reason: 保留原文习语的信息，并说明正文采用的自然汉语表达。
lexical_decisions:
- source_word: וְעַתָּה קוּם צֵא
  choice: 现在你起来，出去
  rationale: 保留转折后的紧迫语气和两个命令；“起来，出去”自然且具体。
- source_word: וְדַבֵּר עַל־לֵב עֲבָדֶיךָ
  choice: 安慰你的臣仆
  rationale: “对……的心说话”是希伯来语习语，在此指以安抚、鼓励和劝慰的话挽回众人的心；“臣仆”符合君王与属下的政治语境。
- source_word: כִּי בַיהוָה נִשְׁבַּעְתִּי
  choice: 我指着耶和华起誓
  rationale: 用现代汉语常见的起誓表达保留誓言的郑重，并将神名 יהוה 音译为“耶和华”。
- source_word: אִם יָלִין אִישׁ אִתְּךָ הַלַּיְלָה
  choice: 你若不出去，今晚必没有一个人留下来陪你
  rationale: לין 在此是留下、过夜；“没有一个人”保留 אִישׁ 单数所表达的彻底无人之强调。
- source_word: וְרָעָה לְךָ זֹאת מִכָּל־הָרָעָה
  choice: 这对你将是更大的灾祸，胜过……一切灾祸
  rationale: רעה 在此指临到人的祸患而非道德邪恶；比较结构明确表达“比……更坏”。
- source_word: מִנְּעֻרֶיךָ עַד־עָתָּה
  choice: 从年轻时直到如今
  rationale: 自然表达贯穿大卫自青年时期至当下的时间范围。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名；“耶和华”是简体中文普通读者最熟悉且庄重的专名译法，同时不以“主”取代原文神名。
- issue: רעה 的含义
  choice: 灾祸
  alternative: 邪恶
  rationale: 上下文谈的是大卫将遭受的政治性损失和历来所遇的患难，因此取“灾祸”，避免误读为大卫所犯的道德恶行。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言；保留约押命令和警告的急迫、强硬语气。
