    rationale: 该习语可指安慰，也可指以亲切、鼓励或劝服的话打动人心。结合上下文，约押要大卫出去争取即将离散的臣仆；“好言相劝”较全面而不添加特定解释。
  - severity: low
    issue: “陪你”略有私人陪伴的现代语感。
    rationale: אִתְּךָ 此处主要指部属不再留在王身边、支持王；“留在你身边”更符合政治和军事关系，且仍保留今夜留下的字面时间信息。
