base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/020.yaml
  text: And he said to the king[a], “Do not let my lord count me guilty, and do not remember how your servant did wrong on the day my lord the king went out from Jerusalem[b], so that the king should take it to heart.”
translation:
  language: zh_hans
  text: 他对王说：“求我主不要把罪归在我身上；也不要记念仆人在我主我王离开耶路撒冷那天所犯的过错，免得王把这事放在心上[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “放在心上”是希伯来语惯用语，意思是认真介意这事，或记在心里而加以追究。
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחֲשָׁב לִי עָוֺן
  choice: 把罪归在我身上
  rationale: 保留希伯来语“把罪责算给某人”的司法性表达，同时符合现代汉语习惯；此处是示每求王不要按他的罪追究他。
- source_word: עָוֺן
  choice: 罪
  rationale: 该词可指罪孽、罪责或罪所招致的刑罚；在“归算”结构中译作“罪”，既保留行为与罪责之间的张力，也避免过度限定为刑罚。
- source_word: תִּזְכֹּר
  choice: 记住
  rationale: 直译其基本意义，并保留上下文所暗示的“记着而据此追究”，不把该含义明说得过满。
- source_word: הֶעֱוָה
  choice: 所行的错事
  rationale: 自然表达其“做错、行事不正”的意义，并清楚呈现说话者承认自己的过错。
- source_word: עַבְדְּךָ
  choice: 仆人
  rationale: 这是臣民在王面前的谦称；“仆人”比“奴隶”更准确传达此处宫廷语境中的自谦和臣服。
- source_word: יָצָא ... מִירוּשָׁלָם
  choice: 离开耶路撒冷
  rationale: 自然准确地表达从城中出去、离去的叙事动作。
- source_word: לָשׂוּם ... אֶל לִבּוֹ
  choice: 把这事放在心上
  rationale: 贴近希伯来语“放在心上”的意象，同时现代读者可以理解为认真介意或记在心里。
- source_word: אֲדֹנִי
  choice: 我主
  rationale: 这是对王的尊称，并非神名；保留第一人称所属关系和恭敬语气。
- source_word: הַמֶּלֶךְ
  choice: 王
  rationale: 按原文保留对君王身份的反复称呼，不擅自改为“大卫王”。
theological_decisions:
- issue: “归罪”是否意味着后来的系统神学术语“归算”
  choice: 采用日常而带司法色彩的“把罪归在我身上”
  alternative: 算我有罪／将罪孽算给我
  rationale: 原文确有计算、归责的司法性，但本节首先是臣民求王宽免的叙事情境；译文不将其技术化，也不消除其司法意味。
translation_notes:
  register: 采用现代、庄重而易懂的宫廷陈情语体。“求我主”体现恭敬请求；保留“我主我王”和“仆人”的自谦称谓。将末句作为前面请求的结果或目的来表达，但不额外补入“怀恨”等原文未明说的含义。
