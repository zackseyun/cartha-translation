base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/018.yaml
  text: and a thousand men from Benjamin with him[a], and Ziba, the servant of Saul’s house, with his fifteen sons and his twenty servants; they crossed the Jordan before the king.
translation:
  language: zh_hans
  text: 随他而来的有一千名便雅悯人；扫罗家的仆人洗巴，连同他的十五个儿子和二十个仆人，也在那里。他们在王面前[a]渡过约旦河。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“走在王前面”。希伯来语可指在王面前，也可指走在王前头。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶלֶף אִישׁ
  choice: 一千名……人
  rationale: 这是标准的计数表达；结合语境，指跟随示每的成年男子。中文用量词“名”自然庄重，也不额外把他们界定为军队。
- source_word: מִבִּנְיָמִן
  choice: 便雅悯人
  rationale: 表示所属支派；译作“便雅悯人”比“来自便雅悯的一千人”更符合现代汉语习惯。
- source_word: צִיבָא
  choice: 洗巴
  rationale: 采用中文圣经传统中通行的人名译法。
- source_word: נַעַר בֵּית שָׁאוּל
  choice: 扫罗家的仆人
  rationale: נַעַר 可指年轻人、侍从或仆人；洗巴在上下文中属于扫罗家的服务人员，因此译作“仆人”，同时保留“家”的家族与家室含义。
- source_word: וַחֲמֵשֶׁת עָשָׂר בָּנָיו וְעֶשְׂרִים עֲבָדָיו
  choice: 带着他的十五个儿子和二十个仆人
  rationale: 原文并列洗巴的随行人员；补出“带着”使中文关系清楚。עֲבָדָיו 在此指家中服役人员，译作“仆人”而不武断限定其法律身份。
- source_word: וְצָלְחוּ הַיַּרְדֵּן
  choice: 他们……渡过约旦河
  rationale: 动词在河流语境中表示渡河；“渡过约旦河”是自然、准确的现代汉语表达。
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: 在王面前
  rationale: לִפְנֵי 可表示在某人面前，也可表示走在某人前面。“在王面前”作为正文较贴近形式，并通过脚注保留空间先后关系的另一种理解。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“扫罗家”保留王室家族兼家室的含义；“在王面前”保留原文可指临在或位置在先的歧义，并以脚注说明。
