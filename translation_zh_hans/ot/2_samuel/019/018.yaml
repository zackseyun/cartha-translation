  verdict: revise
  source_fidelity: 正文准确呈现了便雅悯的一千人、扫罗家的仆人洗巴及其十五个儿子和二十个仆人，并保留了他们渡过约旦河的叙述。原文的“与他同在/随他”不必译为“同来”；“洗巴也带着”则略加强了洗巴主动带领其子和仆人的意味，原文只是并列说明他们与洗巴同在。
