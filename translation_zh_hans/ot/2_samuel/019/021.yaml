- from: 因为你仆人知道自己犯了罪。看哪，我今天在约瑟全家[a]中第一个下来迎接我主我王。[b]
  to: 因为您的仆人知道，我犯了罪。看，我今天作为约瑟家中第一个，下来迎接我主我王。[a][b]
  rationale: 修订以“约瑟家”保留原文的集体称谓，避免“全家”的现代家庭含义；以“您的仆人知道，我犯了罪”保留原文谦称后转用第一人称的句法；并调整提示语和脚注，使语言更自然、脚注更准确。脚注标记均置于其所说明的“约瑟家中第一个下来迎接”短语之后。
