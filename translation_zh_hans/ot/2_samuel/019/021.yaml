base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/021.yaml
  text: For your servant knows that I have sinned[a]. And look, I have come today as the first of all the house of Joseph[b] to come down to meet my lord the king.
translation:
  language: zh_hans
  text: 因为您的仆人知道，我犯了罪。看，我今天作为约瑟家中第一个，下来迎接我主我王。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “约瑟家”指与约瑟有关的支派群体，尤其是以法莲、玛拿西及其所代表的北方支派群体。
    reason: cultural_note
  - marker: b
    text: 或译：“我今天是从约瑟家全体中第一个下来迎接我主我王的。”希伯来语的结构可理解为他是约瑟家全体中最先下来迎接王的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי יָדַע עַבְדְּךָ כִּי אֲנִי חָטָאתִי
  choice: 因为你仆人知道自己犯了罪
  rationale: 前一个כִּי引出示每请求宽恕的理由，后一个כִּי引出其所知道的内容。“你仆人”保留王室语境中的谦称；“犯了罪”保留חטא的道德分量和完成式所表达的既往行为与当前承认。
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留引人注意的指示语气，同时采用现代中文仍可理解、且适合庄重叙事的表达。
- source_word: בָאתִי הַיּוֹם
  choice: 我今天……下来
  rationale: 结合后面的לָרֶדֶת，在中文中将来行动词组自然整合，表达他已经来到现场的结果。
- source_word: רִאשׁוֹן לְכָל בֵּית יוֹסֵף
  choice: 在约瑟全家中第一个
  rationale: 将רִאשׁוֹן理解为示每在整个约瑟群体中居首；介词לְ的关系存在一定歧义，另见脚注。
- source_word: בֵּית יוֹסֵף
  choice: 约瑟全家
  rationale: 保留以“家”指宗族、支派集团的集体称谓，不在正文中直接改写为以法莲或北方众支派。
- source_word: לָרֶדֶת לִקְרַאת אֲדֹנִי הַמֶּלֶךְ
  choice: 下来迎接我主我王
  rationale: “下来”保留地势方向；“迎接”自然表达朝某人前去相会的含义；“我主我王”保留对君王的敬称结构。
