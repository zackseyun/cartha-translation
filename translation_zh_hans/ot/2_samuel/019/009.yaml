  text: וַ/יָּ֥קָם הַ/מֶּ֖לֶךְ וַ/יֵּ֣שֶׁב בַּ/שָּׁ֑עַר וּֽ/לְ/כָל הָ/עָ֞ם הִגִּ֣ידוּ לֵ/אמֹ֗ר הִנֵּ֤ה הַ/מֶּ֨לֶךְ֙ יוֹשֵׁ֣ב בַּ/שַּׁ֔עַר וַ/יָּבֹ֤א כָל הָ/עָם֙ לִ/פְנֵ֣י הַ/מֶּ֔לֶךְ וְ/יִשְׂרָאֵ֔ל נָ֖ס אִ֥ישׁ לְ/אֹהָלָֽי/ו־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/009.yaml
  text: Then the king arose and sat in the gate[a]. And they told all the people, saying, “Look, the king is sitting in the gate.” Then all the people came before the king. But Israel had fled[b], each man to his tent.
translation:
  language: zh_hans
  text: 王就起来，坐在城门那里。有人告诉众民说：“看哪，王正坐在城门那里。”众民就都来到王面前。可是，以色列人已经逃跑[a]，各回各的帐棚[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“而以色列人逃跑了。”希伯来语连接词也可仅表示一般连接；正文按上下文译出转折，并用“已经”表明这是当时的背景情况。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语直译为“各人回自己的帐棚”，是指众人分散，各自返回住处或本族所在地的惯用说法。
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּקָם
  choice: 王就起来
  rationale: קום的Qal叙事形式承接下一事件；“就起来”符合现代汉语叙事节奏，也保留动作的先后推进。
- source_word: וַיֵּשֶׁב בַּשָּׁעַר
  choice: 坐在城门那里
  rationale: ישׁב在此指坐下或就座；בַשָּׁעַר直指城门区域。古代城门是公共事务场所，但正文不额外解释其功能。
- source_word: הִגִּידוּ לֵאמֹר
  choice: 有人告诉众民说
  rationale: 复数动词的主语未明；汉语用“有人”自然表达不定施事者，“说”保留希伯来语引语结构。
- source_word: הִנֵּה
  choice: 看哪
  rationale: הִנֵּה用于唤起注意；“看哪”兼具可懂度和庄重叙事语体。
- source_word: יוֹשֵׁב
  choice: 正坐在
  rationale: 分词表示当时持续、可见的状态；“正坐在”体现其进行性。
- source_word: וַיָּבֹא כָל הָעָם לִפְנֵי הַמֶּלֶךְ
  choice: 众民就都来到王面前
  rationale: בוא加לִפְנֵי直译为来到某人面前；不进一步限定这是朝见、列队或其他礼仪行为。
- source_word: וְיִשְׂרָאֵל נָס
  choice: 可是，以色列人已经逃跑
  rationale: וְ可作简单连接，也可按语境表达对比；“可是”凸显众民来到王前与以色列人四散之间的反差。完成式在这里作为背景，译作“已经逃跑”。
- source_word: אִישׁ לְאֹהָלָיו
  choice: 各回各的帐棚
  rationale: 这是逐一分散、返回各自住处或本族所在地的惯用表达。“帐棚”保留原文意象；“各回各的”自然传达אִישׁ的逐个分配意义。
theological_decisions:
- issue: אִישׁ的阳性分配表达
  choice: 各回各的帐棚
  alternative: 各人回自己的帐棚／各男人回自己的帐棚
  rationale: 这里的אִישׁ构成希伯来语惯用的分配表达，重点是每个人各自离去。现代汉语“各回各的”准确保留分配意义，不必生硬加入“男人”，也不把所指范围扩大解释。
- issue: וְ的连接或转折关系
  choice: 可是
  alternative: 而／于是
  rationale: 原词本身可作一般连接，语境则形成王的众民聚集与以色列人逃散的对照。正文采用自然的转折表达，脚注保留较简单的连接读法。
translation_notes:
  register: 采用现代、庄重而自然的叙事汉语。“王”与上下文一致；“城门那里”既避免现代读者误解为仅在门扇旁，也不把古代城门的公共功能写进正文。原咨询层的脚注标记位置与脚注内容不相符，本稿按实际所注释的词句重新安置并依正文顺序编号。
