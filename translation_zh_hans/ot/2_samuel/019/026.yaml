base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/026.yaml
  text: And when he came to Jerusalem to meet the king[a], the king said to him, “Why did you not go with me, Mephibosheth?”
translation:
  language: zh_hans
  text: 他到耶路撒冷迎接王的时候，王问他：“米非波设，你为什么没有和我一起走呢？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כִּי
  choice: ……的时候
  rationale: 这是希伯来叙事中引入新场景的时间结构；现代汉语以“……的时候”自然表达，无须生硬译出“事情发生了”。
- source_word: בָא
  choice: 到
  rationale: בוא 表示“来、进入、到达”；此处指米非波设来到耶路撒冷，“到”简洁自然。
- source_word: יְרוּשָׁלַם
  choice: 耶路撒冷
  rationale: 采用现代中文圣经传统中通行的地名译法。
- source_word: לִקְרַאת
  choice: 迎接
  rationale: לִקְרַאת 常表示前去与某人相会或迎接某人；在王返回的语境中，“迎接”比单纯“见”更准确。
- source_word: הַמֶּלֶךְ
  choice: 王
  rationale: 保留原文对大卫的称号；现代汉语在此不必添加定冠词。
- source_word: וַיֹּאמֶר לוֹ הַמֶּלֶךְ
  choice: 王问他
  rationale: 原文直译为“王对他说”，但后接问句；汉语用“王问他”自然准确，并保留受话者“他”。
- source_word: לָמָּה
  choice: 为什么
  rationale: 直接表达询问原因的疑问词。
- source_word: לֹא הָלַכְתָּ עִמִּי
  choice: 没有和我一起走
  rationale: הלך 的基本义是“走、去”；保留“走”可呈现大卫回顾先前离开耶路撒冷时的视角，不改成较顺口但发生视角转换的“跟我来”。
- source_word: מְפִיבֹשֶׁת
  choice: 米非波设
  rationale: 采用现代中文圣经传统中通行的人名译法。
