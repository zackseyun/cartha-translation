  text: Barzillai said to the king[a], “How many are the days of the years of my life, that I should go up with the king to Jerusalem?”
translation:
  language: zh_hans
  text: 巴西莱对王说：“我一生的年日还有多少，怎能同王上耶路撒冷去呢？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 叙事中 אמר 的连续式通常译为“说”，自然且忠实。
- source_word: בַּרְזִלַּי
  choice: 巴西莱
  rationale: 采用现代中文圣经语境中通行的人名音译。
- source_word: אֶל הַמֶּלֶךְ
  choice: 对王
  rationale: 原文使用带定冠词的普通名词“王”，没有加入“大卫”这一专名。
- source_word: כַּמָּה
  choice: 还能有多少
  rationale: 保留数量问句“多少”，并用“还”传达语境中所问的是余生；这仍是修辞问句。
- source_word: יְמֵי שְׁנֵי חַיַּי
  choice: 我一生的年日
  rationale: “年日”保留原文“日子—年岁”的叠层表达，同时比逐字译作“我生命年岁的日子”更符合现代汉语。
- source_word: כִּי
  choice: 竟能
  rationale: 此处引出修辞问句的结果或理由色彩；“竟能”自然表达“我哪里还有足够余年，以至于能……”的语气。
- source_word: אֶעֱלֶה
  choice: 上……去
  rationale: עלה 与耶路撒冷连用表示登上、前往该城；“上耶路撒冷去”保留其上行意象。
- source_word: אֶת הַמֶּלֶךְ
  choice: 陪王
  rationale: 此处 אֶת 按伴随意义理解，表示与王一同前往；“陪王”符合巴西莱受邀同行的上下文。
- source_word: יְרוּשָׁלִָם
  choice: 耶路撒冷
  rationale: 采用该地名的通行中文译名。
theological_decisions: []
