  text: וּ/בַרְזִלַּי֙ זָקֵ֣ן מְאֹ֔ד בֶּן שְׁמֹנִ֖ים שָׁנָ֑ה וְ/הֽוּא כִלְכַּ֤ל אֶת הַ/מֶּ֨לֶךְ֙ בְּ/שִׁיבָת֣/וֹ בְ/מַחֲנַ֔יִם כִּֽי אִ֛ישׁ גָּד֥וֹל ה֖וּא מְאֹֽד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/033.yaml
  text: Barzillai was very old[a], eighty years old, and he had provided for the king during his stay in Mahanaim, for he was a very wealthy man.
translation:
  language: zh_hans
  text: 巴西莱年事已高，八十岁了。王住在玛哈念期间，他供给王所需，因为他是个非常显赫的人。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他是个非常富有的人”或“他是个很有地位的人”。希伯来语此处的表达可泛指财富、地位或影响力。
    reason: 保留אִישׁ גָּדוֹל הוּא מְאֹד的语义宽度；上下文支持巴西莱有丰厚资财，但原文并未严格限于财富。
lexical_decisions:
- source_word: זָקֵן מְאֹד
  choice: 年纪已经很大
  rationale: 该短语作谓语，מְאֹד加强“年老”的程度；此译自然、庄重，并保留强调。
- source_word: בֶּן שְׁמֹנִים שָׁנָה
  choice: 八十岁了
  rationale: 希伯来语直译为“八十岁之子”，现代汉语按年龄习惯表达为“八十岁了”。
- source_word: כִלְכַּל אֶת הַמֶּלֶךְ
  choice: 一直供养王
  rationale: כלכל在此指供应生活所需、维持其生活；结合王在玛哈念停留的期间，用“一直供养”清楚表达持续性的实际供应。
- source_word: בְּשִׁיבָתוֹ בְמַחֲנַיִם
  choice: 王住在玛哈念期间
  rationale: ישב在此指居住或停留，代词后缀最自然地指前面的“王”；译文明确所指，避免汉语歧义。
- source_word: אִישׁ גָּדוֹל הוּא מְאֹד
  choice: 他是个非常富有的人
  rationale: 字面为“他是个非常大的人”，可涵盖财富、地位和影响力；本段以他有能力供养王为直接语境，因此正文采用“非常富有”，并以脚注保留较宽泛的可能含义。
theological_decisions: []
translation_notes:
  register: 采用现代标准普通话和简体中文。将较长的希伯来语并列句分为两句，使叙述自然清楚；保留“王”的称谓，并按常见中文圣经地名译作“玛哈念”。脚注标记置于所说明的末句之后。
