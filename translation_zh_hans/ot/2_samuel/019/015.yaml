base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/015.yaml
  text: And he swayed the heart of every man of Judah as one man, and they sent word to the king, “Return, you and all your servants.”
translation:
  language: zh_hans
  text: 他使所有犹大人的心都归向自己，如同一人。于是，他们派人去见王，说：“请你和你所有的臣仆回来。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּט אֶת־לְבַב
  choice: 使……的心都归向
  rationale: 该短语字面为“使心倾向”，在本段语境中指赢得或扭转众人的支持；“归向”保留心意转向的意象，同时符合现代汉语表达。
- source_word: כָּל־אִישׁ יְהוּדָה
  choice: 所有犹大人
  rationale: 希伯来语单数集合表达“犹大的每一个人”；译为“所有犹大人”自然清楚。
- source_word: כְּאִישׁ אֶחָד
  choice: 如同一人
  rationale: 保留原文比喻，强调众人同心一致。
- source_word: עֲבָדֶיךָ
  choice: 你的臣仆
  rationale: 在王权语境中指随侍大卫的人；“臣仆”兼顾政治身份与从属关系。
theological_decisions:
- issue: 动词וַיַּט的主语指代
  choice: 明确为“大卫”
  alternative: 保留为“他”
  rationale: 希伯来文仅用第三人称单数“他”，其先行词由上节的大卫确定。中文若单译“他”可能因本段人物众多而不够清楚；明确姓名不改变原文所指。
- issue: 人心转向的性质
  choice: 译为“使……的心都归向大卫”
  alternative: “使……的心倾向”或“赢得……的心”
  rationale: 这里叙述大卫借所传的话使犹大人一致支持他，并未说明神秘或直接的内在操控；译文避免额外加入神学机制。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“请……回来”自然表达送信者对王的邀请和请求；“如同一人”保留原文简洁有力的群体一致性意象。
