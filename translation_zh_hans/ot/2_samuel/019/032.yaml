base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/032.yaml
  text: And Barzillai the Gileadite had come down from Rogelim[a], and he crossed the Jordan with the king to send him off at the Jordan.
translation:
  language: zh_hans
  text: 基列人巴西莱从罗基琳下来，与王一同过约旦河，要在河边为王送行。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本句希伯来文的结构有些含混，也可译作：“从罗基琳下来，陪王过约旦河，为王送行。”
    reason: 原文中“过”“王”“约旦河”及末尾地点短语之间的句法关系可有不同理解。
lexical_decisions:
- source_word: בַרְזִלַּי
  choice: 巴西莱
  rationale: 按现代中文圣经人名的通行音译处理。
- source_word: הַגִּלְעָדִי
  choice: 基列人
  rationale: 简洁自然地表达地域归属，指来自基列的人。
- source_word: יָרַד מֵרֹגְלִים
  choice: 从罗基琳下来
  rationale: 保留动词“下来”的地势与移动意象；中文叙事无需用显式过去完成时。
- source_word: וַיַּעֲבֹר אֶת הַמֶּלֶךְ הַיַּרְדֵּן
  choice: 与王一同过约旦河
  rationale: עבר在此表示渡过；结合异常的宾语结构，语境指巴西莱陪同王渡河，译文避免误成“使王过河”。
- source_word: לְשַׁלְּחוֹ
  choice: 为王送行
  rationale: 不定式表示目的；“送行”自然表达陪伴对方走一程并道别的含义。
- source_word: אֶת ב/ירדן
  choice: 在河边
  rationale: 马所拉文本末尾形式存在句法和传抄上的难点；依照语境，将其理解为送行发生在约旦河边，同时不重复河名。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“与王一同过约旦河”清楚表达陪同行动；脚注保留原文句法歧义，不对巴西莱陪王渡河与在河边送行之间的关系作过度限定。
