  yaml_path: translation/ot/2_samuel/019/013.yaml
  text: You are my brothers[a]; you are my own bone and flesh[c][b]. So why should you be the last to bring back the king?
translation:
  language: zh_hans
  text: 你们是我的弟兄[a]，是我的骨、我的肉[b]。为什么你们反倒最后才把王迎回来[c]呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“我的族人”；原文直译“我的弟兄”。
    reason: lexical_alternative
  - marker: b
    text: 原文作“我的骨、我的肉”，是表示血肉相连、关系亲近的亲属用语。
    reason: cultural_note
  - marker: c
    text: 大卫以第三人称“王”自称。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחַי
  choice: 我的弟兄
  rationale: 原词直译为“我的弟兄”。这里大卫对犹大人说话，着重表达同族血亲关系；保留“弟兄”，并由下文“我的骨、我的肉”明确其亲属含义。
- source_word: עַצְמִי וּבְשָׂרִי
  choice: 我的骨、我的肉
  rationale: 保留希伯来文具体而有力的身体意象；这是表示血肉相连、关系亲近的亲属用语。
- source_word: וְלָמָה
  choice: 为什么……反倒
  rationale: 连接词与疑问词承接前面的亲属关系，形成带有劝说和责问意味的推论；“反倒”自然呈现这种语气。
- source_word: תִּהְיוּ אַחֲרֹנִים
  choice: 最后才
  rationale: 这里的未完成式用于修辞性劝问，意为在众人之后才采取行动；“最后才”准确而自然。
- source_word: לְהָשִׁיב
  choice: 把……迎回来
  rationale: שוב的使役式意为“使回来、带回来”。结合王重返王位所在地的语境，“迎回来”比抽象的“恢复”更具体，也符合现代汉语表达。
- source_word: אֶת־הַמֶּלֶךְ
  choice: 王
  rationale: 希伯来文保留第三人称“王”，是大卫的王室自称；译文不改成第一人称，以保存原文的修辞形式。
