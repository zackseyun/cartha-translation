base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/005.yaml
  text: And the king covered his face[a], and the king cried out with a loud voice, “My son Absalom! Absalom, my son, my son!”
translation:
  language: zh_hans
  text: 王蒙住自己的脸[a]，放声呼喊：“我儿押沙龙啊！押沙龙，我儿，我儿啊！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“把自己的脸裹住”或“遮住自己的脸”。希伯来语动词表示在悲痛中遮盖脸面。
    reason: lexical_alternative
lexical_decisions:
- source_word: לָאַט
  choice: 蒙住
  rationale: 此处动词以“脸”为宾语，表示在悲痛中把脸遮盖起来。“蒙住”既自然，又不过度限定具体遮盖方式。
- source_word: פָּנָיו
  choice: 自己的脸
  rationale: 带直接宾语标记，且与哀恸动作相连，明确指王的脸；译作“自己的脸”在现代汉语中指代清楚。
- source_word: וַיִּזְעַק
  choice: 放声呼喊
  rationale: 该动词表示大声呼叫；结合 קוֹל גָּדוֹל 译作“放声呼喊”，保留声音强烈的特点，同时不把它进一步解释为特定形式的哀号。
- source_word: קוֹל גָּדוֹל
  choice: 放声
  rationale: 希伯来语直译为“大声/洪亮的声音”；“放声”以自然汉语表达其强度，并与“呼喊”顺畅搭配。
- source_word: בְּנִי
  choice: 我儿
  rationale: 指大卫的儿子押沙龙。“我儿”准确、凝练，适合父亲悲痛呼唤的庄重语境，并保留重复带来的情感力量。
- source_word: אַבְשָׁלוֹם
  choice: 押沙龙
  rationale: 采用现代中文圣经传统中通行且易识别的人名译法。
- source_word: repetition of אַבְשָׁלוֹם / בְּנִי
  choice: “我儿押沙龙啊！押沙龙，我儿，我儿啊！”
  rationale: 完整保留原文对“押沙龙”和“我儿”的反复，以呈现大卫强烈而断续的悲痛；语气词“啊”使呼唤在现代汉语中自然可闻，但不增添新的命题内容。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而口语可懂的叙事语言。“蒙住自己的脸”清楚表达哀恸动作；呼语保留原文全部重复，并以适量语气词传达悲声，不将“呼喊”强化解释为“哀号”。
