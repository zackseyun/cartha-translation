base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/016.yaml
  text: Then the king returned and came as far as the Jordan[a], and Judah came to Gilgal to go to meet the king, to bring the king across the Jordan.
translation:
  language: zh_hans
  text: 王回来，到了约旦河。犹大人[a]来到吉甲，要去迎接王，送王过约旦河。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“犹大”，在这里集合性地指犹大支派的人。
    reason: 说明原文以支派名称集合性地指该支派的人。
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: 回来
  rationale: שׁוב的Qal叙事形式表示返回；上下文是大卫逃亡后归来，“回来”自然准确。
- source_word: וַיָּבֹא עַד הַיַּרְדֵּן
  choice: 到了约旦河
  rationale: בוא与עַד表示行至某处或边界；“到了”表明王抵达河边，却不暗示此时已经渡河。
- source_word: וִיהוּדָה
  choice: 犹大人[a]
  rationale: 原文直译为“犹大”，在此以地名或支派名集合性地指犹大支派的人；正文采用现代汉语自然的集合称谓，并以脚注说明原文形式。
- source_word: בָּא
  choice: 已经来到
  rationale: 前景叙事链之后的完成式可表达背景或先时情况；“已经来到”自然呈现犹大人先抵达吉甲、准备迎王的语篇关系。
- source_word: הַגִּלְגָּלָה
  choice: 来到吉甲
  rationale: 地名后的方向词尾表示朝向或到达吉甲；汉语以“来到吉甲”表达。
- source_word: לָלֶכֶת לִקְרַאת
  choice: 要去迎接
  rationale: 两个不定式表达目的；“要去迎接”保留“去”与“迎接”两层动作，同时符合现代汉语。
- source_word: לְהַעֲבִיר אֶת הַמֶּלֶךְ אֶת הַיַּרְדֵּן
  choice: 送王过约旦河
  rationale: עבר的Hiphil表示使某人越过；“送……过河”保留使役含义，又不额外指定渡船等方式。
theological_decisions: []
