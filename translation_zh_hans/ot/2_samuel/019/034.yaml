  yaml_path: translation/ot/2_samuel/019/034.yaml
  text: And the king said to Barzillai[a], “You cross over with me, and I will provide for you with me in Jerusalem.”
translation:
  language: zh_hans
  text: 王对巴西莱说：“你跟我一同过河吧；我会在耶路撒冷供养你，让你与我同住。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 未完成式连续叙事形式承接前文；现代汉语通常无需逐字译出句首连接词，仍能自然表达事件推进。
- source_word: הַמֶּלֶךְ
  choice: 王
  rationale: 带定冠词的名词，在上下文中指大卫；译作“王”简洁自然。
- source_word: בַּרְזִלָּי
  choice: 巴西莱
  rationale: 按现代中文圣经人名惯用音译处理。
- source_word: אַתָּה עֲבֹר אִתִּי
  choice: 你跟我一同过河吧
  rationale: 独立代词“你”带有强调意味；עֲבֹר在本段叙事中具体指渡过约旦河，译作“过河”比泛称“过去”更清楚。“吧”自然表达邀请式命令。
- source_word: וְכִלְכַּלְתִּי אֹתְךָ
  choice: 我会……供养你
  rationale: כלכל在此指供应生活所需、维持生计；“供养”凝练表达王承担其需要的持续性。
- source_word: עִמָּדִי בִּירוּשָׁלִָם
  choice: 在耶路撒冷……让你留在我身边
  rationale: 保留地点“在耶路撒冷”以及伴随关系“与我同在”；为避免汉语“在耶路撒冷供养你与我同在”的生硬结构，调整为自然分句。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“过河”依据当前语境具体化为渡过约旦河；“让你留在我身边”自然呈现原文重复的“与我同在”，未将其扩展解释为宫廷职位或特殊身份。
