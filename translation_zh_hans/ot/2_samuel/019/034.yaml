review_pass:
  verdict: revise
  source_fidelity: 译文准确传达王邀请巴西莱同行并承诺在耶路撒冷供给其所需的主旨。“过河”符合本段渡过约旦河的语境。但“让你留在我身边”把原文的“与我同在”改成了明确的使役性安排，且“留”增添了原文未明说的停留意味。
  naturalness: 整体庄重自然。将末尾关系改为“与你同住”，可更自然地表达王在耶路撒冷供养巴西莱、并使他住在王身边的安排。
  terminology: “王”“巴西莱”“耶路撒冷”及“供养”均恰当。“供养”准确表达כלכל所指持续供应生活所需；脚注所列替代译法合宜。
  issues:
  - severity: medium
    issue: “让你留在我身边”对עִמָּדִי作了较强的使役性和“停留”性扩展。
    rationale: 原文直述王将在耶路撒冷“与我同在”的条件/安排中供养巴西莱，并未使用“留住”或明确使役动词。改为“让你与我同住”保留该安排而避免“留”的额外含义。
  revised_text: 王对巴西莱说：“你跟我一同过河吧；我会在耶路撒冷供养你，让你与我同住。”
  revised_footnotes:
  - marker: a
    text: “供养”也可译作“供应你的需要”或“扶养你”。希伯来语动词含有供应所需、维持生活的意思。
    reason: lexical_alternative
  revision_rationale: 修订仅将“留在我身边”改为“与我同住”，以更贴近עִמָּדִי（“与我同在”）在此处所表达的居住安排，并避免加入“留住”的额外语义。其余译文及词汇脚注均可保留。
