revisions:
- from: 王对巴西莱说：“你跟我一同过河吧，我会在耶路撒冷供养你[a]，让你留在我身边。”
  to: 王对巴西莱说：“你跟我一同过河吧；我会在耶路撒冷供养你，让你与我同住。”
  rationale: 修订仅将“留在我身边”改为“与我同住”，以更贴近עִמָּדִי（“与我同在”）在此处所表达的居住安排，并避免加入“留住”的额外语义。其余译文及词汇脚注均可保留。
