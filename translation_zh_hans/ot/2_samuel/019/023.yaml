base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/023.yaml
  text: And David said[a], “What have I to do with you, sons of Zeruiah, that you should be an adversary to me today? Shall any man be put to death in Israel today? For do I not know that today I am king over Israel?”
translation:
  language: zh_hans
  text: 大卫说：“洗鲁雅的儿子们，我与你们有什么相干，竟要在今天作我的敌对者呢？今天岂可在以色列处死任何人呢？难道我不知道，今天我在以色列作王吗？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַה לִּי וְלָכֶם
  choice: 我与你们有什么相干
  rationale: 这是表示疏远或责斥的希伯来语惯用语；此译法自然保留了反问形式和斥责语气。
- source_word: בְּנֵי צְרוּיָה
  choice: 洗鲁雅的儿子们
  rationale: 保留具体的亲属称谓和直接呼语，所指为约押、亚比筛等洗鲁雅的儿子。
- source_word: כִּי תִהְיוּ לִי הַיּוֹם לְשָׂטָן
  choice: 你们今天竟成了我的对头
  rationale: שָׂטָן在此是普通名词，指阻挠或反对大卫的人；“对头”既保留名词表达，也避免误解为专名“撒但”。“竟”传达责斥和意外之意。
- source_word: יוּמַת אִישׁ
  choice: 岂可处死任何人
  rationale: 该动词形式表示使人被处死，带有司法处决意味；“任何人”自然表达此处泛指的אִישׁ。
- source_word: הֲלוֹא יָדַעְתִּי
  choice: 难道我不知道
  rationale: 保留否定反问的句法形态及其期待肯定回答的语气。
- source_word: מֶלֶךְ עַל יִשְׂרָאֵל
  choice: 作以色列的王
  rationale: 现代汉语中自然表达统治以色列的王权；“作……的王”传达עַל所表示的管辖关系。
theological_decisions:
- issue: שָׂטָן的含义
  choice: 普通名词“对头”
  alternative: 专名“撒但”
  rationale: 在本段历史叙事中，这个词描述洗鲁雅的儿子们对大卫决定的阻挠，并非指超自然的专名角色；译作“撒但”会引入上下文没有表达的神学含义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。保留原文连续的反问和大卫对洗鲁雅众子的直接责斥；用“岂可”和“难道”体现庄重语气，但避免过度文言化。
