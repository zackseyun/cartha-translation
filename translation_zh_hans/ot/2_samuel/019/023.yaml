  to: 大卫说：“洗鲁雅的儿子们，我与你们有什么相干，竟要在今天作我的敌对者呢？今天岂可在以色列处死任何人呢？难道我不知道，今天我在以色列作王吗？”
  rationale: 将未完成式所表达的当下、面向行动的责斥由“竟成了”改为“竟要……作”，并以问号恢复该从句与前句相连的反问语气。将“对头”正文改为较庄重的“敌对者”；脚注保留“对头”作释义，同时明确其非专名。其余反问、司法处死含义和大卫对以色列的王权均予保留。
