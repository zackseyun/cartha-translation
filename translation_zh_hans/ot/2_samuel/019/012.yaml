base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/012.yaml
  text: And King David sent to Zadok and to Abiathar the priests[a], saying, “Speak to the elders of Judah, saying, ‘Why should you be the last to bring the king back to his house, when the word of all Israel has come to the king, to his house?’”
translation:
  language: zh_hans
  text: 大卫王差遣人去见祭司撒督和亚比亚他，说：“你们要对犹大的长老说：‘你们为什么最后才把王带回他的住处呢？全以色列的话已经传到王那里，传到他的住处了[a]。’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“全以色列的提议（或消息）已经传到王那里，传到他的住处了。”原文“全以色列的话”含义较宽，可指消息、提议或请求；末尾“传到他的住处”保留原文重复的地点短语。
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלַח אֶל
  choice: 派人去见
  rationale: 这里指大卫向两位祭司差人传话；译为“派人去见”既体现“差遣”的含义，也符合现代汉语表达。
- source_word: הַמֶּלֶךְ דָּוִד
  choice: 大卫王
  rationale: 按现代汉语习惯将王号置于人名之后，保留其君王身份。
- source_word: הַכֹּהֲנִים
  choice: 祭司
  rationale: 准确表达撒督和亚比亚他的职分；汉语在并列姓名后无需重复复数标记。
- source_word: דַּבְּרוּ אֶל
  choice: 要对……说
  rationale: 保留命令语气以及“向某人说话”的结构。
- source_word: זִקְנֵי יְהוּדָה
  choice: 犹大的长老
  rationale: 直接表达该地区或支派的政治领袖群体。
- source_word: לָמָּה תִהְיוּ אַחֲרֹנִים
  choice: 你们为什么反倒最后才来
  rationale: 以反问表达责问和催促；“反倒”凸显犹大与其他以色列支派相比不应落后的语用含义。
- source_word: לְהָשִׁיב
  choice: 迎接……回
  rationale: 该使役式在上下文中不是王自行返回，而是百姓促成并迎接他复位归来；“迎接……回”自然传达这一情境。
- source_word: אֶת־הַמֶּלֶךְ אֶל־בֵּיתוֹ
  choice: 王回宫
  rationale: בַּיִת 在君王语境中可指王的居所；“回宫”比直译“回他的家”更自然，也不必限定具体建筑形制。
- source_word: וּדְבַר כָּל־יִשְׂרָאֵל
  choice: 全以色列的话
  rationale: דָּבָר 语义宽泛，可能指话、消息、提议或请求；正文保留“话”的宽度，不擅自限定。
- source_word: בָּא אֶל־הַמֶּלֶךְ
  choice: 已经传到王
  rationale: 完成式表示此事已发生；“传到”适合话语或消息抵达某人的汉语表达。
- source_word: אֶל־בֵּיתוֹ
  choice: 王的住处
  rationale: 此处短语的句法和所指存在一定含混；译作“王的住处”保留地点意义，同时避免重复使用“宫”而过度具体化。
