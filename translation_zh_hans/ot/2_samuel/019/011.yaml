base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/011.yaml
  text: And Absalom[a], whom we anointed over us, died in battle. So now why are you silent about bringing the king back?
translation:
  language: zh_hans
  text: 我们所膏立来统治我们的押沙龙已经战死了。现在，你们为什么还闭口不提迎回王[a]呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“使王归回”。
    reason: “迎回”按上下文自然表达使王返回；原文使役动词也可较直接译为“使王归回”。
lexical_decisions:
- source_word: וְ/אַבְשָׁלוֹם
  choice: 押沙龙
  rationale: 和合式连词在汉语中可由上下文自然承接，不必机械译出“而且”；保留人名，继续前文所引的话。
- source_word: מָשַׁחְנוּ עָלֵינוּ
  choice: 我们膏立来统治我们的
  rationale: “膏立”保留מָשַׁח所表达的君王就任及其政治—礼仪色彩；“来统治我们的”自然表达עָלֵינוּ在王权语境中的“在我们之上”。
- source_word: מֵת בַּמִּלְחָמָה
  choice: 已经战死了
  rationale: “战死”简洁表达在战事中死亡；“已经……了”体现完成事件对当前局势的现实影响。
- source_word: וְ/עַתָּה
  choice: 现在
  rationale: 引出前述事实所带来的当前问题；汉语语境已能传达承接和推论关系。
- source_word: מַחֲרִשִׁים
  choice: 还闭口不提
  rationale: 该词表达保持沉默；“闭口不提”在现代汉语中自然地呈现他们对迎回王一事不发声的状态，并由“还”体现责问语气。
- source_word: לְ/הָשִׁיב אֶת הַמֶּלֶךְ
  choice: 迎回王的事
  rationale: 使役词形意为使其返回、带回；在君王返回权位和都城的语境中，“迎回王”自然且具体，不把含义抽象化为“恢复王位”。
theological_decisions:
- issue: 对押沙龙使用君王膏立用语מָשַׁח
  choice: 膏立
  alternative: 立为王
  rationale: 原文对押沙龙使用通常具有君王就任色彩的动词。直译为“膏立”既不淡化这一政治—礼仪行动，也不因他在叙事中的篡位者身份而加入评价。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“膏立”保留原文的王权术语；“闭口不提迎回王的事”使希伯来语“沉默＋使王回来”的结构在汉语中清楚自然，同时以脚注保留较直接的另一种句法理解。
