base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/030.yaml
  text: 'Then the king said to him[b][a], “Why do you keep speaking of your affairs? I have decided: you and Ziba shall divide the land.”'
translation:
  language: zh_hans
  text: 王对他说：“你为什么还要再提你的事呢？我已经作了决定[a]：你和洗巴要分那田产[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“我说了。”
    reason: lexical_alternative
  - marker: b
    text: 或译：“那田地。”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר ... הַמֶּלֶךְ
  choice: 王对他说
  rationale: 叙事中的连续式推进情节；现代汉语无需另加“然后”，语序已自然表达事件承接。
- source_word: לָמָּה
  choice: 为什么
  rationale: 直接保留原文的疑问语气。
- source_word: תְּדַבֵּר עוֹד
  choice: 还要再说
  rationale: עוֹד表示继续或进一步；“还要再说”既自然，也传达王制止对方继续陈述的语气。
- source_word: דְּבָרֶיךָ
  choice: 你的事
  rationale: דָּבָר既可指“话”，也可指“事情、事务”；本节处于申诉和产业争议的语境，“你的事”保留较宽泛的含义，避免过度法律化为“你的案情”。
- source_word: אָמַרְתִּי
  choice: 我已经决定
  rationale: 字面为“我说了”，在语境中是王作出裁定的施为性表达；正文译出其语用功能，脚注保留字面形式。
- source_word: אַתָּה וְצִיבָא
  choice: 你和洗巴
  rationale: 保留第二人称代词；“洗巴”采用现代中文圣经中常见的人名译法。
- source_word: תַּחְלְקוּ
  choice: 要分
  rationale: 未完成式在王的裁决中具有指令和确定安排的语气；“要分”保留权威性，同时不额外断定必须等额平分。
- source_word: הַשָּׂדֶה
  choice: 这田产
  rationale: שָׂדֶה字面为“田地”，在产业争议中可集合性地指地产；“田产”符合上下文，指示词“这”自然指向双方争议的产业。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。正文保留王简短、带有终止申诉意味的裁决语气；不把“分”强化为“平分”，以免加入原文未明说的等额含义。
