base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/031.yaml
  text: Mephibosheth said to the king[a], “Let him even take it all, since my lord the king has come safely to his own house.”
translation:
  language: zh_hans
  text: 米非波设对王说：“就让他连一切都拿去吧，因为我主我王已经平安[a]回到自己的家了。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“安然无恙地”。
    reason: 说明 בְּשָׁלוֹם 在这里可按语境表达为安全、安然地归回；正文“平安”保留其较贴近原文的表达。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 希伯来叙事中 אמר 的常规表达；现代汉语用“说”自然准确。
- source_word: מְפִיבֹשֶׁת
  choice: 米非波设
  rationale: 采用现代中文圣经中通行的人名音译。
- source_word: אֶל הַמֶּלֶךְ
  choice: 对王
  rationale: 原文只有带定冠词的称号“王”，没有直接补出“大卫”；“对王说”符合现代汉语表达。
- source_word: גַּם אֶת הַכֹּל יִקָּח
  choice: 就让他把一切都拿去吧
  rationale: 未完成式在这里带有意愿式语气，表示米非波设甘愿让步；“一切”保留 הַכֹּל 的总体性，“就……吧”自然传达 גַּם 的强调和让步意味。
- source_word: אַחֲרֵי אֲשֶׁר
  choice: 既然
  rationale: 该短语字面有“在……之后”的时间意味，但本句中同时引出作出让步的原因；“既然”在现代汉语中清楚传达其因由关系。
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: 我主我王
  rationale: 保留宫廷敬称中“我的主”和“王”两个成分，也符合庄重的中文语体。
- source_word: בְּשָׁלוֹם
  choice: 平安
  rationale: שָׁלוֹם 在此表示王安然返回；“平安”既贴近原文字面，也能自然表达安全无恙之意。
- source_word: אֶל בֵּיתוֹ
  choice: 回到自己的家
  rationale: 动词 בָּא 与目标短语合起来在语境中表示归回；“自己的家”保留第三人称所有格的强调。
