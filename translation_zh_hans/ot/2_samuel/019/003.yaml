base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/003.yaml
  text: So the victory on that day was turned into mourning for all the people[a], because on that day the people heard it said[b], “The king is grieved over his son.”
translation:
  language: zh_hans
  text: 那一天的胜利，变成了全体百姓的哀伤[a]，因为百姓在那一天听说[b]：“王正为他的儿子悲伤。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“那一天的拯救变成了哀伤。”
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译：“百姓听见，说。”这是表示听到消息或听人传说的惯用说法。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַתְּשֻׁעָה
  choice: 胜利
  rationale: 该词可指拯救、解救或胜利；在战事刚结束的语境中，“胜利”最自然地表达得胜的结果，同时避免“救恩”在现代汉语中可能带来的过强神学色彩。
- source_word: וַתְּהִי ... לְאֵבֶל
  choice: 变成了哀痛
  rationale: 保留希伯来语所表达的结果与强烈反转：本应欢庆的胜利转而成为哀痛。
- source_word: אֵבֶל
  choice: 哀痛
  rationale: 该词表示哀悼、举哀或丧痛；“哀痛”在此既自然，也适合众人共同陷入悲哀的场景。
- source_word: הָעָם
  choice: 众人
  rationale: 原文使用一般性的“民、百姓”，语境中主要指随大卫作战的人。“众人”既不将范围限定为正规军，也符合现代叙事表达。
- source_word: כִּי שָׁמַע ... לֵאמֹר
  choice: 因为……听说
  rationale: “听见＋说”是引出传闻或所听消息的希伯来语结构；现代汉语用“听说”简洁自然，同时脚注说明其字面形式。
- source_word: נֶעֱצַב
  choice: 正……悲伤
  rationale: 该动词的尼斐勒形式表示感到痛苦、忧伤。“正……悲伤”准确表现王当时因儿子而哀恸的状态。
- source_word: עַל בְּנוֹ
  choice: 为他的儿子
  rationale: 介词 עַל 在此标明引发悲伤的对象或缘由；“为他的儿子悲伤”是自然的现代汉语搭配，且不额外断定悲伤的具体性质。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而清楚的叙事语言。“众人”保留 הָעָם 的宽泛指称；正文流畅表达，脚注保留 הַתְּשֻׁעָה 可译为“拯救”以及 שָׁמַע…לֵאמֹר 的字面结构。
