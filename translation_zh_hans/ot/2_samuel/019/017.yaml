base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/017.yaml
  text: Shimei son of Gera[a], the Benjaminite from Bahurim, hurried and went down with the men of Judah to meet King David.
translation:
  language: zh_hans
  text: 来自巴户琳的便雅悯人、基拉的儿子示每急忙下去，跟犹大人[a]一起迎接大卫王。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文作“跟一个犹大人（单数）一起”；这里的单数可作集合意义理解。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמַהֵר
  choice: 急忙
  rationale: 该动词表达迅速、急切地行动；“急忙”自然地保留了叙事中的紧迫感。
- source_word: שִׁמְעִי בֶן גֵּרָא
  choice: 基拉的儿子示每
  rationale: 按现代汉语习惯表达希伯来语父子关系，同时采用通行的圣经人名译法。
- source_word: בֶּן הַיְמִינִי
  choice: 便雅悯人
  rationale: 此处应是族属称谓，指示每属于便雅悯支派，而非另一层父子关系。
- source_word: אֲשֶׁר מִבַּחוּרִים
  choice: 来自巴户琳的
  rationale: 将关系从句自然地处理为前置定语，明确示每的来源地。
- source_word: וַיֵּרֶד
  choice: 下去
  rationale: 保留希伯来叙事中具体的地势移动用语，不笼统译作“去”。
- source_word: עִם אִישׁ יְהוּדָה
  choice: 跟犹大人一起
  rationale: 原文“犹大之人”在此可作集合表达；汉语“犹大人”本身可兼指群体，既自然又保留形式上的含混。
- source_word: לִקְרַאת
  choice: 迎接
  rationale: 该结构表示前往与某人相会；在此语境中“迎接”比单纯“见”更准确地体现行动方向和目的。
- source_word: הַמֶּלֶךְ דָּוִד
  choice: 大卫王
  rationale: 符合现代汉语中姓名在前、称号在后的自然次序，并完整保留王的身份。
