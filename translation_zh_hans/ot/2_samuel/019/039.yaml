  text: Then the king said[a], “Let Kimham cross over with me, and I will do for him what seems good in your eyes; and whatever you choose to lay on me, I will do for you.”
translation:
  language: zh_hans
  text: 王说：“让金罕和我一同过河吧。我会照你看为好的待他；凡你要我承担的，我都会为你办。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“无论你向我求什么，我都会为你办。”希伯来文的说法较为省略，直译为“凡你在我身上所选择的”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר הַמֶּלֶךְ
  choice: 王说
  rationale: 未完成式连续体推进叙事；汉语无需另加“于是”也能自然承接上下文。
- source_word: אִתִּי יַעֲבֹר כִּמְהָם
  choice: 让金罕和我一同过河吧
  rationale: 这里的未完成式带祈使意味，表达王的决定或邀请；“过河”保留上下文中反复出现的 עבר，并结合语境明确所过的是约旦河。
- source_word: כִּמְהָם
  choice: 金罕
  rationale: 依现代汉语圣经人名音译惯例处理该专名。
- source_word: וַאֲנִי אֶעֱשֶׂה לּוֹ
  choice: 我会……待他
  rationale: עשה 含义宽泛，此处指王将善待金罕；“待他”在汉语中自然，同时不过度限定具体恩惠。
- source_word: אֶת הַטּוֹב בְּעֵינֶיךָ
  choice: 照你看为好的
  rationale: 保留“在你眼中为好”这一判断性习语的意义；“照你看为好的”是自然、庄重的现代汉语。
- source_word: וְכֹל אֲשֶׁר תִּבְחַר עָלַי
  choice: 凡你要我承担的
  rationale: 原文“你在我身上所选择的”较省略；此译保留 עָלַי 所含加在王身上的责任意味，又使汉语可懂。
- source_word: אֶעֱשֶׂה לָּךְ
  choice: 我都会为你办
  rationale: 表达王会替巴西莱落实其所选择或请求之事；“办”自然呈现无明说宾语的 עשה。
