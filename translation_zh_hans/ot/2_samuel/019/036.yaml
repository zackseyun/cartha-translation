base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/036.yaml
  text: I am eighty years old today[a]. Can I still distinguish between good and evil? Can your servant taste what I eat and what I drink? Can I still hear the voice of male singers and female singers? Why then should your servant still be a burden to my lord the king?
translation:
  language: zh_hans
  text: 我今天已经八十岁了。还能分辨好坏[a]吗？仆人还能尝出我所吃所喝的滋味吗？还能听见男歌者和女歌者的声音吗？仆人为什么还要成为我主我王的负担呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “好坏”也可译作“善恶”。希伯来语这一表达既可指道德上的辨别，也可指实际的判断；本节谈到年老和感官衰退，因此正文采用含义较宽的“好坏”。
    reason: 保留原文在道德辨别与实际判断之间的词义幅度。
lexical_decisions:
- source_word: בֶּן שְׁמֹנִים שָׁנָה אָנֹכִי הַיּוֹם
  choice: 我今天已经八十岁了
  rationale: “八十岁”自然表达希伯来语以“……之子”表示年龄的习语；“今天”保留 הַיּוֹם，“已经”符合现代汉语中老人陈述高龄的自然语气。
- source_word: הַאֵדַע בֵּין טוֹב לְרָע
  choice: 还能分辨好坏吗
  rationale: ידע בין 表示辨别、判断；上下文列举年老导致的感官与能力衰退，因此“分辨好坏”既自然，也保留实践判断和道德辨别两种可能。
- source_word: יִטְעַם עַבְדְּךָ אֶת אֲשֶׁר אֹכַל וְאֶת אֲשֶׁר אֶשְׁתֶּה
  choice: 仆人还能尝出我所吃所喝的滋味吗
  rationale: טעם 的基本义是“品尝、尝出滋味”；“仆人”保留臣民在王面前谦称自己的宫廷用语。
- source_word: אֶשְׁמַע עוֹד בְּקוֹל שָׁרִים וְשָׁרוֹת
  choice: 还能听见男歌者和女歌者的声音吗
  rationale: 明确保留希伯来语阳性与阴性形式所指的男、女歌者；“声音”对应 קוֹל，不把原文限定为某一种歌唱形式。
- source_word: לְמַשָּׂא
  choice: 重担
  rationale: 此处是比喻义，指给王增添负担或拖累，并非实际背负的货物。
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: 我主我王
  rationale: 保留对人间君王的恭敬称呼；两个“我”使现代汉语庄重而清楚，不将“主”误作神名。
theological_decisions:
- issue: טוֹב לְרָע 可表示一般的好坏判断，也可带有“善恶”的道德意味
  choice: 正文译作“好坏”，脚注说明“善恶”这一可能
  alternative: 善恶
  rationale: 年龄、味觉和听觉构成的近距离语境侧重能力衰退和实际判断力；但固定搭配可能具有道德辨别意味，因此不在正文中彻底排除该层含义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“仆人”和“我主我王”保留宫廷对话的谦敬语气；连续的反问句维持原文节奏。
