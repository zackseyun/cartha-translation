  text: וְ/יוֹאָ֥ב בֶּן צְרוּיָ֖ה עַל הַ/צָּבָ֑א וִ/יהוֹשָׁפָ֥ט בֶּן אֲחִיל֖וּד מַזְכִּֽיר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/016.yaml
  text: And Joab son of Zeruiah was over the army[b][a], and Jehoshaphat son of Ahilud was recorder.
translation:
  language: zh_hans
  text: 洗鲁雅的儿子约押掌管军队[a]；亚希律的儿子约沙法任记事官[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“统领军队”；原文直译为“在军队之上”。
    reason: lexical_alternative
  - marker: b
    text: “记事官”是王室官员，可能负责保存记录，并将有关事务报告给王；也可译作“书记官”或“史官”。
    reason: cultural_note
lexical_decisions:
- source_word: עַל הַצָּבָא
  choice: 掌管军队
  rationale: 介词 עַל 在官职名录中表示居于某机构之上、负有管理或统领之责。“掌管军队”既贴近原文，也自然表达约押对军队的权责；不额外限定具体军衔。
- source_word: מַזְכִּיר
  choice: 记事官
  rationale: 该词指王室中的一种官职，职责可能包括保存记录，并将事务向王报告。“记事官”简洁保留记录职能，又避免“史官”使人只想到编写历史，或“秘书”带来的现代职位联想。
- source_word: בֶּן
  choice: ……的儿子
  rationale: 在人名身份说明中直译亲子关系，并以自然的现代汉语语序表达。
- source_word: וְ / וִ
  choice: ；
  rationale: 原文以连接词并列两名官员。汉语用分号自然呈现同一官员名录中的并列关系，避免重复“和”造成生硬。
- source_word: יוֹאָב / צְרוּיָה / יְהוֹשָׁפָט / אֲחִילוּד
  choice: 约押／洗鲁雅／约沙法／亚希律
  rationale: 采用简体中文圣经传统中通行且易辨认的人名译法。
theological_decisions: []
