base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/018.yaml
  text: Benaiah son of Jehoiada was over the Kerethites and the Pelethites, and David’s sons were priests.[a]
translation:
  language: zh_hans
  text: 耶何耶大的儿子比拿雅统领基利提人和比利提人；大卫的众子都作祭司。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“大臣”或“王室官员”。希伯来语原词通常指“祭司”，但鉴于上下文所列的是王室官员，有人认为这里指较广义的宫廷职务。
    reason: 保留כֹּהֲנִים在本处可能具有的宫廷职务义，同时不取代正文中的通常词义。
lexical_decisions:
- source_word: וּבְנָיָהוּ בֶּן יְהוֹיָדָע
  choice: 耶何耶大的儿子比拿雅
  rationale: 人名按现代中文圣经中通行且易辨认的形式音译，并依中文自然语序先说明父子关系。
- source_word: וְהַכְּרֵתִי וְהַפְּלֵתִי
  choice: 基利提人和比利提人
  rationale: 两词是并列的群体称谓，采用中文传统且较易辨认的音译，不擅自判定其族裔或军事身份。
- source_word: וּבְנָיָהוּ... וְהַכְּרֵתִי וְהַפְּלֵתִי
  choice: 比拿雅统领基利提人和比利提人
  rationale: 马所拉文本此处为省略关系词的并列结构；结合本章官员名单的语境，以及相关经文对比拿雅职掌的明确说明，用“统领”补足现代中文所需的句法关系。
- source_word: כֹּהֲנִים
  choice: 祭司
  rationale: 这是该希伯来词通常而直接的词义。尽管本处也可能指宫廷中的高级臣仆，正文保留“祭司”，不在翻译中消解原文带来的张力。
- source_word: הָיוּ
  choice: 都作
  rationale: היה在此构成身份述语；“作祭司”符合自然中文，“都”自然表达复数主语所指众子共同具有这一身份。
theological_decisions:
- issue: 大卫的众子被称为כֹּהֲנִים的含义
  choice: 正文译为“大卫的众子都作祭司”
  alternative: “大卫的众子都作大臣”或“都作王室官员”
  rationale: כֹּהֲנִים通常指“祭司”，但本章是王室行政官员名单，而大卫的儿子也并非通常意义上的利未祭司。为保留原文的词义及其神学和历史张力，正文采用直译，较宽泛的宫廷职务解释放入脚注。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“统领”使省略的职务关系在中文中清楚；分号区分两项任职陈述。正文保留“祭司”这一有张力的称谓，并以脚注呈现另一种语境性理解。
