  source_fidelity: 草稿正确遵循马所拉文本的“亚兰”，并以脚注保留“以东”异文；但将“一万八千人”拆为分号后的独立句“他击杀了一万八千人”，使原文中与“击打亚兰”紧密相连的数量成了重复叙述，句法关系较原文松散。
  naturalness: “赢得了声名”通顺，但“为自己赢得了名声”更完整自然地表达עשה名这一习语的反身含义。将地点、对象和人数置于同一战事短语中，中文行文更连贯。
  terminology: “亚兰”宜作为专名保留，不必在正文补作“亚兰人”；这也与异文脚注中“以东／亚兰”的对应更一致。保留“盐谷”和“以东”这一常用圣经地名译法。
  issues:
