  - severity: low
    issue: 正文将专名“亚兰”解释为“亚兰人”
    rationale: 希伯来文本为专名אֲרָם。中文可自然地说“击杀亚兰一万八千人”，既保留专名，也不预断其究竟指政体或其军队。
  - severity: low
    issue: 习语的反身含义未明确表达
    rationale: עשה שם在此意为为自己获得名声；“为自己赢得了名声”比单说“赢得了声名”更完整。
  revised_text: 大卫从在盐谷击杀亚兰一万八千人后回来，便为自己赢得了名声。[a]
