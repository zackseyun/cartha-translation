  text: And David made a name for himself when he returned from striking down Aram in the Valley of Salt—eighteen thousand men[a].
translation:
  language: zh_hans
  text: 大卫从在盐谷击杀亚兰一万八千人后回来，便为自己赢得了名声。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些文本见证以及《历代志上》18:12的平行记载表明，这里可能是“以东”，而不是“亚兰”。
    reason: textual_variant
lexical_decisions:
- source_word: וַיַּעַשׂ דָּוִד שֵׁם
  choice: 大卫……赢得了声名
  rationale: עשה שם是“为自己建立名声、赢得声望”的习语。“赢得了声名”自然传达其含义，也避免把“造一个名字”的字面形式生硬带入现代汉语。
- source_word: בְּשֻׁבוֹ
  choice: 回来后
  rationale: 介词ב与带后缀的不定词构造构成时间从句，表示“大卫回来时/回来后”；结合叙事中的完成动作，译作“回来后”清楚自然。
- source_word: מֵהַכּוֹתוֹ
  choice: 从……击杀……回来
  rationale: 介词מִן与נכה的不定词构造说明他从该次战事回来。נכה在军事语境中可指击打、击败或杀死；与随后人数相连时，“击杀”保留其强烈动作色彩。
- source_word: אֶת אֲרָם
  choice: 亚兰人
  rationale: 马所拉文本作“亚兰”。这里是军事行动的受事者，现代汉语用“亚兰人”比只写地名“亚兰”更自然；不采用后期地缘名称“叙利亚”。
- source_word: בְּגֵיא מֶלַח
  choice: 在盐谷
  rationale: ב标示战事地点；גֵיא מֶלַח是地名，按现代中文圣经地名习惯译为“盐谷”。
- source_word: שְׁמוֹנָה עָשָׂר אָלֶף
  choice: 一万八千人
  rationale: 希伯来文仅列数目，所数对象由军事语境补足。中文补出“人”，使句意完整，并不额外限定其具体军种或身份。
theological_decisions:
- issue: 被击杀者的身份
  choice: 正文采用“亚兰人”
  alternative: “以东人”
  rationale: WLC所据马所拉文本在本节明确作אֲרָם（亚兰）；但若干文本见证以及《历代志上》18:12的平行记载支持“以东”。正文遵循指定希伯来文底本，脚注保留这一重要异文，不替读者消除文本张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“赢得了声名”传达希伯来习语עשה שם；分号后的重复主语用于明确“一万八千”是击杀人数，避免中文读者误解为声名或其他数量。脚注标记已在正文中呈现。
