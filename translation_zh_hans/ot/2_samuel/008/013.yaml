revisions:
- from: 大卫从盐谷击杀亚兰人回来后，赢得了声名；他击杀了一万八千人。[a]
  to: 大卫从在盐谷击杀亚兰一万八千人后回来，便为自己赢得了名声。[a]
  rationale: 修订保持WLC正文的“亚兰”和“一万八千”，并将人数恢复为同一次在盐谷击打亚兰的战事的一部分。“为自己赢得了名声”自然表达希伯来习语的意义。脚注保留重要的“以东”异文，且不在正文中解决该文本张力。
