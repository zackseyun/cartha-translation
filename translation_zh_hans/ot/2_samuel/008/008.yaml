base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/008.yaml
  text: And from Betah and from Berothai[a], cities of Hadadezer[c][b], King David took very much bronze.
translation:
  language: zh_hans
  text: 大卫王从哈大底谢的两座城——比他和比罗他——夺取了极多的铜[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 或译“青铜”，也可能指“红铜”；希伯来词可按语境指铜或青铜。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִבֶּטַח
  choice: 从……比他
  rationale: 前缀介词表示“从”；地名按本节马所拉文本音译为“比他”。
- source_word: וּמִבֵּרֹתַי
  choice: 和比罗他
  rationale: 保留并列关系，并按本节希伯来文地名形式音译；相关经文中的名称差异留在脚注说明。
- source_word: עָרֵי הֲדַדְעָזֶר
  choice: 哈大底谢的城
  rationale: 依构造链直译，表示这些城属于或受哈大底谢管辖；“城”符合军事地理语境。
- source_word: לָקַח
  choice: 夺取了
  rationale: 该动词基本义为“拿、取”；在战争战利品的语境中，“夺取”自然表达从敌方取得财物，同时不把它解释成攻占这些城。
- source_word: הַמֶּלֶךְ דָּוִד
  choice: 大卫王
  rationale: 采用现代汉语中自然、庄重的王号与人名次序。
- source_word: נְחֹשֶׁת
  choice: 铜
  rationale: 希伯来词可指铜或青铜；中文“铜”在此既自然，也避免在正文中过度限定具体合金，可能的具体译法在脚注交代。
- source_word: הַרְבֵּה מְאֹד
  choice: 极多的
  rationale: 直接保留两个程度成分所表达的强烈数量强调，且符合简洁庄重的叙事文体。
theological_decisions: []
