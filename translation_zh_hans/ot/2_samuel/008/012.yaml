base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/012.yaml
  text: from Aram[a], and from Moab, and from the Ammonites, and from the Philistines, and from Amalek, and from the spoil of Hadadezer son of Rehob[c][b], king of Zobah.
translation:
  language: zh_hans
  text: 就是从亚兰[a]、摩押、亚扪人[b]、非利士人和亚玛力，以及从琐巴王利合的儿子哈大底谢[c]所掠夺的战利品。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文为“亚兰”，传统上也译作“叙利亚”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译为“亚扪的众子”。
    reason: lexical_alternative
  - marker: c
    text: 有些经文把这个名字写作“哈大利谢”。
    reason: textual_variant
lexical_decisions:
- source_word: מֵאֲרָם
  choice: 从亚兰
  rationale: “亚兰”保留希伯来地名和族名，不以较晚形成的地缘名称“叙利亚”替代。
- source_word: וּמִמּוֹאָב
  choice: 从摩押
  rationale: 按该国家或地区的专名直译。
- source_word: וּמִבְּנֵי עַמּוֹן
  choice: 从亚扪人
  rationale: 原文直译为“从亚扪的众子”；现代汉语以“亚扪人”自然、准确地表达其民族群体所指。
- source_word: וּמִפְּלִשְׁתִּים
  choice: 从非利士人
  rationale: 采用该族群在现代中文圣经语境中的通行译名。
- source_word: וּמֵעֲמָלֵק
  choice: 从亚玛力所得的
  rationale: 原文使用专名“亚玛力”，而非明确的族称；保留专名形式，并依上下文补出“所得的”，使中文句法顺畅。
- source_word: וּמִשְּׁלַל
  choice: 夺来的战利品
  rationale: שָׁלָל指战争中夺取的财物；“战利品”在现代汉语中明确自然，“夺来的”表达介词מִן所标明的来源关系。
- source_word: הֲדַדְעֶזֶר
  choice: 哈大底谢
  rationale: 依本节马所拉文本的辅音形式音译；其他经文所见的异拼在脚注中保留。
- source_word: בֶּן רְחֹב
  choice: 利合的儿子
  rationale: 透明表达标准的父子关系结构，同时采用自然的现代汉语语序。
- source_word: מֶלֶךְ צוֹבָה
  choice: 琐巴王
  rationale: 以现代汉语自然的称号结构表达“琐巴的王”，并保留地名音译。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。本节在原文中承接上一节，是来源清单，因此以“就是”维持承接关系；后半句明确说“战利品”，译文据此组织并列成分，避免中文误读，同时保留各来源项的重复关系。专名采用简体中文圣经语境中较通行的形式。
