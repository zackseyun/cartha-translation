  text: וַ/יַּ֣ךְ אֶת מוֹאָ֗ב וַֽ/יְמַדְּדֵ֤/ם בַּ/חֶ֨בֶל֙ הַשְׁכֵּ֣ב אוֹתָ֣/ם אַ֔רְצָ/ה וַ/יְמַדֵּ֤ד שְׁנֵֽי חֲבָלִים֙ לְ/הָמִ֔ית וּ/מְלֹ֥א הַ/חֶ֖בֶל לְ/הַחֲי֑וֹת וַ/תְּהִ֤י מוֹאָב֙ לְ/דָוִ֔ד לַ/עֲבָדִ֖ים נֹשְׂאֵ֥י מִנְחָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/002.yaml
  text: He struck Moab and measured them with a line[a], making them lie down on the ground. He measured off two lengths of line for death and a full length of line to keep alive. So Moab became David’s servants[b], bringing tribute.
translation:
  language: zh_hans
  text: 他击败摩押人，使他们躺在地上，用绳子量他们[a]。他量出两段绳长，定为处死；又量出整整一段绳长，定为存活。于是摩押人作大卫的臣仆[b]，向他进贡。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “绳子”也可译作“绳索”或“量绳”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文描写大卫使摩押人躺在地上，用绳子量他们：两段量出的份额被定为处死，一整段被定为存活。这表示一些人被处死，另一些人得以存活。
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּךְ אֶת־מוֹאָב
  choice: 他击败了摩押人
  rationale: נכה在军事叙事中可指击打、攻打或击败；上下文随即说明摩押臣服并进贡，因此译为“击败”自然表达战事结果，又不增添原文没有的细节。
- source_word: וַיְמַדְּדֵם בַּחֶבֶל
  choice: 用绳子量他们
  rationale: מדד为“量”，חבל可指绳、绳索或量绳；此处绳子是量度工具。“用绳子量他们”保留原文冷峻而具体的意象。
- source_word: הַשְׁכֵּב אוֹתָם אַרְצָה
  choice: 叫他们躺在地上
  rationale: 使役形式说明量度时先使他们卧在地上；此译简明自然，并保留强制意味。
- source_word: וַיְמַדֵּד שְׁנֵי חֲבָלִים
  choice: 他量出两绳
  rationale: 直译保留“两绳”的计量方式，不在正文中将其换算成明确比例，以免超出希伯来文的表达。
- source_word: לְהָמִית ... לְהַחֲיוֹת
  choice: 归于死……归于生
  rationale: 两个使役不定式分别表示使之死和使之存活。以对称、凝练的“归于死／归于生”再现原文鲜明而严酷的平行结构。
- source_word: וּמְלֹא הַחֶבֶל
  choice: 一整绳
  rationale: מְלֹא表示满量、完整的一份；原文没有明写数词“一”，但与“两绳”相对，语义上指一个完整绳长，译作“一整绳”最为清楚。
- source_word: וַתְּהִי מוֹאָב לְדָוִד לַעֲבָדִים
  choice: 于是摩押人臣服于大卫，作他的仆役
  rationale: עבדים在此为国与国之间的臣属关系。“臣服……作他的仆役”既保留“仆役”的字面意象，也明确政治性从属，避免误解为所有摩押人都成为私人奴隶。
- source_word: נֹשְׂאֵי מִנְחָה
  choice: 向他进贡
  rationale: מנחה在王权和国际关系语境中指贡物；分词表达持续性的臣属义务，现代汉语以“进贡”最自然。
theological_decisions:
- issue: 大卫以绳量摩押人的死亡与存活安排
  choice: 保留实际量度以及“归于死／归于生”的严酷叙述
  alternative: 将绳子理解为泛指征服，或在正文中直接说三分之二被杀、三分之一获生
  rationale: 经文描述的是卧地受量并被分派死亡或存活的具体行动。虽然通常可由“两绳”与“一整绳”推知大致比例，但原文没有直接使用分数，因此正文不把推论写成明说的比例，也不淡化暴力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“归于死／归于生”略带凝练的文学色彩，用以保留希伯来文的平行和突兀感；脚注标记均已置入正文。
