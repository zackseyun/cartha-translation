revisions:
- from: 他击败了摩押人，又叫他们躺在地上，用绳子量他们[a]。他量出两绳归于死，一整绳归于生。于是摩押人臣服于大卫，作他的仆役[b]，向他进贡。
  to: 他击败摩押人，使他们躺在地上，用绳子量他们[a]。他量出两段绳长，定为处死；又量出整整一段绳长，定为存活。于是摩押人作大卫的臣仆[b]，向他进贡。
  rationale: 修订保留原文冷峻的量度意象及死亡／存活的并列，不将其在正文中换算为明确比例；同时以自然现代汉语明确量出的单位是绳长份额，并清楚表达处死与使人存活的结果。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T05:26:49Z'
review_pass:
  verdict: revise
  source_fidelity: 译文总体保留了战胜摩押、使人卧地、以绳量度并分派死亡与存活，以及摩押进贡臣服的内容。为更贴合原文，需避免“归于死／归于生”这种在现代汉语中略显生硬、且未清楚表达使役不定式（处死／使存活）的说法；“两绳／一整绳”也容易被理解为两根或一根绳子，而非按绳长量出的份额。
  naturalness: “一整绳归于生”不符合自然现代汉语的计量表达。“两段绳长……一段绳长”能保留原文反复出现的量绳意象，同时清楚表达被量出的区段。以“定为处死／定为存活”维持原文简洁、严酷的对称。
  terminology: “摩押人”“大卫”“进贡”均合宜。政治从属语境中的“臣仆”比“仆役”更自然庄重，并避免让人主要联想到私人家役。
  issues:
  - severity: medium
    issue: “两绳归于死，一整绳归于生”计量含义不清且表达生硬。
    rationale: 原文的“两段绳长”和“满一绳长”是量度后划出的份额，不是在说两根绳子与一根绳子。“归于死／归于生”虽试图保留平行，却不如“定为处死／定为存活”清楚传达 לְהָמִית 与 לְהַחֲיוֹת 的使役含义。
  - severity: low
    issue: “仆役”在此政治臣属语境中不够贴切。
    rationale: עֲבָדִים在这里指附庸性的服属关系；“臣仆”在现代庄重叙事中更自然地传达这一层面。
