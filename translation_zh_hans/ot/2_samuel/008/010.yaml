  text: וַ/יִּשְׁלַ֣ח תֹּ֣עִי אֶת יֽוֹרָם בְּנ֣/וֹ אֶל הַ/מֶּֽלֶךְ דָּ֠וִד לִ/שְׁאָל ל֨/וֹ לְ/שָׁל֜וֹם וּֽ/לְ/בָרֲכ֗/וֹ עַל֩ אֲשֶׁ֨ר נִלְחַ֤ם בַּ/הֲדַדְעֶ֨זֶר֙ וַ/יַּכֵּ֔/הוּ כִּי אִ֛ישׁ מִלְחֲמ֥וֹת תֹּ֖עִי הָיָ֣ה הֲדַדְעָ֑זֶר וּ/בְ/יָד֗/וֹ הָי֛וּ כְּלֵֽי כֶ֥סֶף וּ/כְלֵֽי זָהָ֖ב וּ/כְלֵ֥י נְחֹֽשֶׁת־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/010.yaml
  text: Then Toi sent Joram his son to King David to ask about his welfare and to bless him because he had fought against Hadadezer and struck him down[a], for Hadadezer had been at war with Toi; and in his hand were articles of silver, articles of gold[b], and articles of bronze.
translation:
  language: zh_hans
  text: 于是，陀以派儿子约兰去见大卫王，向他问安，并为他祝福[a]，因为大卫与哈大底谢交战，击败了他。原来哈大底谢常常与陀以交战[b]。约兰带着[c]银器、金器和铜器。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “为他祝福”在这里也可理解为“向他道贺”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译近于“哈大底谢是陀以的战争之人”，可能表示他常与陀以交战，或是陀以的仇敌。
    reason: source_ambiguity
  - marker: c
    text: 原文直译为“在他手中有”；“他”最可能指约兰，也可能按语法理解为前文最近提到的人。
    reason: pronoun_ambiguity
lexical_decisions:
- source_word: וַיִּשְׁלַח תֹּעִי אֶת יוֹרָם בְּנוֹ
  choice: 于是，陀以派儿子约兰
  rationale: 未完成式叙事形态推进事件，用“于是”自然承接上文；人名按《撒母耳记》的希伯来文本音译。“儿子约兰”符合现代汉语语序。
- source_word: לִשְׁאָל לוֹ לְשָׁלוֹם
  choice: 向他问安
  rationale: 这是询问对方平安、近况的惯用语；“问安”简洁地传达外交使节问候之意。
- source_word: וּלְבָרֲכוֹ
  choice: 并为他祝福
  rationale: 保留 ברך 的基本词义“祝福”；在本处外交语境中也可能包含祝贺之意，因此以脚注说明。
- source_word: עַל אֲשֶׁר נִלְחַם בַּהֲדַדְעֶזֶר וַיַּכֵּהוּ
  choice: 因为大卫与哈大底谢交战，击败了他
  rationale: 上下文表明省略的主语是大卫，汉语中补出以免歧义；נכה 在军事语境中译为“击败”比字面的“击打”更自然，也不额外断定哈大底谢被杀。
- source_word: כִּי אִישׁ מִלְחֲמוֹת תֹּעִי הָיָה הֲדַדְעָזֶר
  choice: 原来哈大底谢一向与陀以交战
  rationale: 希伯来语是压缩的惯用表达，字面近于“哈大底谢是陀以的战争之人”。译文表达双方持续敌对或多次交战的含义，同时在脚注保留原文形式与范围上的不确定性。
- source_word: וּבְיָדוֹ הָיוּ
  choice: 约兰手中带着
  rationale: 字面为“在他手中有”；按使节携礼物的语境，所指最自然是约兰。正文明确指代并用自然汉语表达，脚注保留字面形式及代词歧义。
- source_word: כְּלֵי כֶסֶף וּכְלֵי זָהָב וּכְלֵי נְחֹשֶׁת
  choice: 银器、金器和铜器
  rationale: כְּלִי 是范围较广的器物用语，“器”不限定具体形制；נְחֹשֶׁת 在此按古代金属器物通常译为“铜”。
