lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: 听说
  rationale: 该叙事动词表示陀以得知此事；“听说”在现代汉语中既直接又自然。
- source_word: תֹּעִי
  choice: 陀以
  rationale: 按本节马所拉文本的读音音译；历代志上18:9的平行经文有异名，另见脚注。
- source_word: מֶלֶךְ חֲמָת
  choice: 哈马王
  rationale: 简洁自然地表达所属地与王权身份，符合现代汉语对古代君王称号的常用说法。
- source_word: כִּי
  choice: （听说）
  rationale: 此处引出所听见的内容；汉语可由“听说”直接带宾语从句，无须另译连接词。
- source_word: הִכָּה
  choice: 击溃了
  rationale: 在军事语境中，נכה表示打击、击败；“击溃”保留强烈的军事行动含义，又比“击杀”更适合以全军为宾语。
- source_word: אֵת כָּל חֵיל
  choice: 全军
  rationale: חַיִל在此指军队或军事力量；“全军”准确、简洁，并体现כָּל的整体含义。
- source_word: הֲדַדְעָזֶר
  choice: 哈大底谢
  rationale: 采用现代中文圣经人名的惯用音译形式。
