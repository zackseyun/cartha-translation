  text: וַֽ/יְהִי֙ אַֽחֲרֵי כֵ֔ן וַ/יַּ֥ךְ דָּוִ֛ד אֶת פְּלִשְׁתִּ֖ים וַ/יַּכְנִיעֵ֑/ם וַ/יִּקַּ֥ח דָּוִ֛ד אֶת מֶ֥תֶג הָ/אַמָּ֖ה מִ/יַּ֥ד פְּלִשְׁתִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/001.yaml
  text: And after this[a], David struck the Philistines and subdued them, and David took Metheg-ammah from the hand of the Philistines.
translation:
  language: zh_hans
  text: 此后，大卫攻打非利士人，使他们降服。大卫又从非利士人手中夺取了“母城的缰绳”[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “母城的缰绳”原文含义不确定，可能是指对主城的控制权。参看《历代志上》18:1，那里说大卫夺取了迦特和属迦特的乡镇。也有人把这个短语音译为地名“米提革·亚玛”。
    reason: 说明疑难希伯来语短语的字面意义、可能的习语含义、平行经文及专名读法，同时不在正文中消除原文的歧义。
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי כֵן
  choice: 此后
  rationale: 这一叙事公式承接前文并标明时间顺序；“此后”自然简洁，不必生硬译出“事情发生”。
- source_word: וַיַּךְ
  choice: 攻打
  rationale: נכה在军事语境中表示击打、攻击；“攻打”保留行动本身，并让下句“使他们降服”说明结果，避免把两个动词合并为单一的“击败”。
- source_word: פְּלִשְׁתִּים
  choice: 非利士人
  rationale: 采用现代中文圣经传统中通行的族名译法。
- source_word: וַיַּכְנִיעֵם
  choice: 使他们降服
  rationale: כנע的使役形表示使对方屈服、受制；此译明确保留使役意义及军事政治上的从属结果。
- source_word: וַיִּקַּח
  choice: 夺取了
  rationale: לקח基本义为“取、拿”；在战争及从敌方手中取得某物的语境里，“夺取”比单纯的“拿走”更自然。
- source_word: מֶתֶג הָאַמָּה
  choice: “母城的缰绳”
  rationale: 这是一个意义困难的短语。מֶתֶג通常指“缰绳、嚼环”，הָאַמָּה字面可理解为“那母者”，在城市语境中可能指母城或主城。正文保留希伯来语意象，不把不确定的解释直接写成“京城”或专名，并以脚注说明可能含义。
- source_word: מִיַּד
  choice: 从……手中
  rationale: 保留希伯来语表示掌控、占有的常见身体隐喻；现代中文同样自然易懂。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“攻打……使他们降服”保留原文两个连续动词的动作与结果；疑难短语以引号和脚注处理，使正文保留原文意象，同时让普通读者能理解其可能指向政治或城市控制权。
