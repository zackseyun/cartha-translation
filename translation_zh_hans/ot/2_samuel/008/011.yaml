base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/011.yaml
  text: King David also dedicated them to Yahweh[b][a], along with the silver and the gold that he had dedicated from all the nations that he had subdued.
translation:
  language: zh_hans
  text: 大卫王也把这些[a]连同他从所征服[b]的各国所得的金银，一并分别为圣，献给雅威。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “这些”指上一节提到的物品。
    reason: cross_reference
  - marker: b
    text: 或译“制伏”。这个希伯来语动词可指以武力使别国归服。
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: 也
  rationale: 表达承接上一节的添加关系，符合现代汉语叙事习惯。
- source_word: אֹתָם
  choice: 这些
  rationale: 保留代词的概括性，所指由上文确定；用脚注说明其指上一节提到的物品。
- source_word: הִקְדִּישׁ
  choice: 分别为圣，献给
  rationale: 该词表示将财物分别出来归于神；此译兼顾其神圣归属和奉献行为，避免只译“献上”而削弱礼仪含义。
- source_word: הַמֶּלֶךְ דָּוִד
  choice: 大卫王
  rationale: 现代汉语中头衔通常置于人名之后，庄重自然。
- source_word: לַיהוָה
  choice: 献给雅威
  rationale: ל 表示归属或奉献的对象；יהוה按其专名译作“雅威”。
- source_word: עִם
  choice: 还把……一同献上
  rationale: 清楚表达这些物品与金银一同被奉献，同时使较长的希伯来语句式在汉语中自然易懂。
- source_word: הַכֶּסֶף וְהַזָּהָב
  choice: 金银
  rationale: 现代汉语惯用并列次序为“金银”，不必机械保留希伯来语的“银和金”。
- source_word: אֲשֶׁר הִקְדִּישׁ
  choice: 献上
  rationale: 上下文已经明确奉献给雅威；后半句简译可避免重复拖沓，同时保持同一行为。
- source_word: מִכָּל הַגּוֹיִם
  choice: 从……各国得来的
  rationale: מִן 表示来源，גּוֹיִם 在军事政治语境中自然译为“各国”。
- source_word: אֲשֶׁר כִּבֵּשׁ
  choice: 所征服的
  rationale: כּבש 在此表示以武力使各国臣服；“征服”明确传达军事语境，脚注保留“制伏”的可能译法。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较贴近学界通行的拟音，并将其作为专名呈现，不以称号替代。
- issue: הִקְדִּישׁ 的神圣归属含义
  choice: 分别为圣，献给
  alternative: 奉献给
  rationale: 明确这些战利品被划归雅威所有，保留词语的礼仪和神圣维度；并不进一步推断其具体用途。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“分别为圣，献给”保留原文的礼仪含义；后半句改用自然汉语语序，并保留动词 כּבש 在“征服”和“制伏”之间的语义空间。
