base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/005.yaml
  text: And Aram of Damascus came to help Hadadezer king of Zobah[b][a], and David struck down twenty-two thousand men of Aram.
translation:
  language: zh_hans
  text: 大马士革的亚兰人[a]前来帮助琐巴王哈达德以谢[b]，大卫就击杀了两万二千名亚兰人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “亚兰”在这里指以大马士革为中心的亚兰政权及其人民；传统译本有时译作“叙利亚”。
    reason: lexical_alternative
  - marker: b
    text: “哈达德以谢”在另一些经文和译本中作“哈大利谢”。
    reason: alternative_reading
lexical_decisions:
- source_word: וַתָּבֹא
  choice: 前来
  rationale: 叙事中的 בוא 表示来到；“前来”自然承接上文战事，并保留向相关地点而来的方向感。
- source_word: אֲרַם דַּמֶּשֶׂק
  choice: 大马士革的亚兰人
  rationale: 该短语指以大马士革为中心的亚兰政权或其人民。现代汉语以“亚兰人”为集体主语较自然，同时避免使用后世地缘名称“叙利亚”。
- source_word: לַעְזֹר
  choice: 帮助
  rationale: 准确、直接地表达 עזר 的通常含义。
- source_word: לַהֲדַדְעֶזֶר
  choice: 哈达德以谢
  rationale: 按本节希伯来文本 הֲדַדְעֶזֶר 音译，并较清楚地保留名字中的“哈达德”成分。
- source_word: מֶלֶךְ צוֹבָה
  choice: 琐巴王
  rationale: 简洁自然地表达“琐巴的王”，并作为人名的同位称号。
- source_word: וַיַּךְ
  choice: 击杀了
  rationale: נכה 在军事语境中表示击打、击倒，后接具体人数时通常指杀敌；“击杀”既体现军事行动，也符合人数统计的语境。
- source_word: בַּאֲרָם
  choice: 亚兰人
  rationale: 介词 ב 与 נכה 连用，标明受攻击的群体；结合后面的 אִישׁ，以“亚兰人”表达最为自然。
- source_word: עֶשְׂרִים וּשְׁנַיִם אֶלֶף אִישׁ
  choice: 两万二千名亚兰人
  rationale: 准确保留数目；אִישׁ 指人或男子，但本句已由“亚兰人”明确计数对象，无须另加原文没有明说的“士兵”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而清楚的叙事语言。“大马士革的亚兰人”兼顾原文名称与现代汉语自然度；人名按本节马所拉文本音译，并用脚注保留异体。
