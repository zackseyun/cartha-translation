id: 2SA.8.17
reference: 2 Samuel 8:17
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/צָד֧וֹק בֶּן אֲחִיט֛וּב וַ/אֲחִימֶ֥לֶךְ בֶּן אֶבְיָתָ֖ר כֹּהֲנִ֑ים וּ/שְׂרָיָ֖ה סוֹפֵֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/017.yaml
  text: Zadok son of Ahitub and Ahimelech son of Abiathar were priests[b][a], and Seraiah was secretary.
translation:
  language: zh_hans
  text: 亚希突的儿子撒督和亚比亚他的儿子亚希米勒作祭司[a]；西莱雅作书记官[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “祭司”或可译作“首席大臣”或“王室官员”；因本节列举大卫的官员，有人认为这里的词具有较宽泛的宫廷行政含义。
    reason: lexical_alternative
  - marker: b
    text: 或译“文士”。希伯来语此词在这里指负责书写或行政事务的官员。
    reason: lexical_alternative
lexical_decisions:
- source_word: צָדוֹק
  choice: 撒督
  rationale: 希伯来人名，采用现代中文圣经读者熟悉的通行译名。
- source_word: בֶּן
  choice: ……的儿子
  rationale: 在这份官员名录中最自然地表示直接父子关系；虽可宽泛指后裔，此处无须扩大其义。
- source_word: אֲחִיטוּב
  choice: 亚希突
  rationale: 希伯来人名，采用通行中文音译。
- source_word: אֲחִימֶלֶךְ
  choice: 亚希米勒
  rationale: 希伯来人名，采用通行中文音译。
- source_word: אֶבְיָתָר
  choice: 亚比亚他
  rationale: 希伯来人名，采用通行中文音译。
- source_word: כֹּהֲנִים
  choice: 祭司
  rationale: כֹּהֵן 的常见和首要含义是“祭司”。上下文虽在列举王室官员，仍不足以推翻其通常词义；较宽泛的行政职衔解释收入脚注。
- source_word: שְׂרָיָה
  choice: 西莱雅
  rationale: 希伯来人名，采用通行中文音译。
- source_word: סוֹפֵר
  choice: 书记官
  rationale: 在王室官员名录中指负责书写及行政事务的官员；“书记官”既体现职务性质，也比单纯的“文士”更符合此处宫廷语境。
theological_decisions:
- issue: 王室官员名录中 כֹּהֲנִים 的含义
  choice: 祭司
  alternative: 首席大臣；王室官员
  rationale: 本处不涉及必须预先裁定的教义问题。希伯来词的默认含义是“祭司”，而行政名录的语境使较宽泛的官职解释具有一定可能性，因此正文保留通常含义，脚注保存另一解释。
translation_notes:
  register: 采用自然、庄重而清楚的现代标准汉语。人名使用简体中文圣经传统中较熟悉的形式；句法保持官员名录的简洁。脚注标记紧随各自所说明的词语，避免英文咨询层中标记次序造成的歧义。
