base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/003.yaml
  text: David struck down Hadadezer son of Rehob[a], king of Zobah[c][b], when he went to restore his power at the River.
translation:
  language: zh_hans
  text: 大卫击败了琐巴王、利合的儿子哈大底谢[a]；当时，他正前去大河[c]恢复自己的势力[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文本作“哈大底谢”；有些文本传统以及《历代志上》的平行记载作“哈大利谢”。
    reason: textual_variant
  - marker: b
    text: 也可译作“重新取得控制权”或“重建统治权”；直译为“使自己的手恢复”。
    reason: lexical_alternative
  - marker: c
    text: “大河”很可能指幼发拉底河。
    reason: cross_reference
lexical_decisions:
- source_word: וַיַּךְ
  choice: 击败了
  rationale: נכה在战争叙事中表示击打并战胜对方；“击败”自然传达军事语境，又不像“杀死”那样超出本节所说。
- source_word: הֲדַדְעֶזֶר
  choice: 哈大底谢
  rationale: 按WLC所载人名形式音译；其他文本传统中的异形在脚注说明。
- source_word: בֶּן רְחֹב
  choice: 利合的儿子
  rationale: 直接表达希伯来语父子关系结构，并采用通行的现代中文圣经人名译法。
- source_word: מֶלֶךְ צוֹבָה
  choice: 琐巴王
  rationale: 以自然中文表达希伯来语属格结构“琐巴之王”。
- source_word: בְּלֶכְתּוֹ
  choice: 当他前去……时
  rationale: 介词ב与不定词连用，在此表示伴随的时间背景；保留原文代词所具有的指代空间。
- source_word: לְהָשִׁיב
  choice: 恢复
  rationale: 使役形态表达使某事回到原有状态；“恢复”既准确又不预先限定恢复的是控制、统治还是一般势力。
- source_word: יָדוֹ
  choice: 自己的……势力
  rationale: “手”在此是权力或控制的习语。正文译作“势力”以便现代读者理解，同时用脚注保留直译及其他可能表达。
- source_word: בִּנְהַר
  choice: 在大河
  rationale: נהר在此以特指方式使用，很可能指幼发拉底河；正文保留较宽泛的“大河”，具体辨认放入脚注。
