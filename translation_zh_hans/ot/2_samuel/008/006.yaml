id: 2SA.8.6
reference: 2 Samuel 8:6
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יָּ֨שֶׂם דָּוִ֤ד נְצִבִים֙ בַּ/אֲרַ֣ם דַּמֶּ֔שֶׂק וַ/תְּהִ֤י אֲרָם֙ לְ/דָוִ֔ד לַ/עֲבָדִ֖ים נוֹשְׂאֵ֣י מִנְחָ֑ה וַ/יֹּ֤שַׁע יְהוָה֙ אֶת דָּוִ֔ד בְּ/כֹ֖ל אֲשֶׁ֥ר הָלָֽךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/006.yaml
  text: And David placed garrisons in Aram of Damascus[a], and Aram became servants to David, bringing tribute[c][b]. And Yahweh gave David victory wherever he went.
translation:
  language: zh_hans
  text: 大卫在大马士革的亚兰[b]设立驻军[a]；亚兰人就作了大卫的臣仆，向他进贡[c]。大卫无论往哪里去，耶和华都使他得胜[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “驻军”也可译作“驻守的官员”或“总督”。原词可指被派驻的人；本处的军事语境较支持“驻军”。
    reason: lexical_alternative
  - marker: b
    text: “大马士革的亚兰”也可译作“大马士革亚兰”或“大马士革的叙利亚”。原文使用专名“亚兰”。
    reason: lexical_alternative
  - marker: c
    text: “进贡”直译为“带来贡物”；“贡物”一词也可指礼物或供物，本处很可能指附庸所缴纳的贡品。
    reason: lexical_alternative
  - marker: d
    text: “使他得胜”也可译作“拯救大卫”或“解救大卫”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: 设立
  rationale: שׂים的基本义是“放置、设置”；与驻军或驻防机构搭配时，“设立”符合现代汉语叙事表达。
- source_word: נְצִבִים
  choice: 驻军
  rationale: 在军事征服和控制领土的语境中，此词很可能指驻防部队或据点；译作“驻军”简洁自然，同时以脚注保留“官员、总督”的可能。
- source_word: בַּאֲרַם דַּמֶּשֶׂק
  choice: 在大马士革的亚兰
  rationale: 保留אֲרָם的专名“亚兰”，而不以传统地理名称“叙利亚”替代；此短语指以大马士革为中心或与大马士革相连的亚兰政体。
- source_word: וַתְּהִי אֲרָם לְדָוִד לַעֲבָדִים
  choice: 亚兰人就作了大卫的臣仆
  rationale: “臣仆”保留עֲבָדִים的服事、从属含义，也清楚表达此处国家被征服后的政治臣属关系，避免让现代读者误解为个体奴隶制度的专门表述。
- source_word: נוֹשְׂאֵי מִנְחָה
  choice: 向他进贡
  rationale: מִנְחָה可指礼物、供物或贡物；在附庸国臣服的国际政治语境中，“进贡”最贴切。“向他”依上下文补出受贡者，使汉语流畅。
- source_word: וַיֹּשַׁע
  choice: 使他得胜
  rationale: ישׁע的使役式表示耶和华施行拯救或解救；本节处于军事战事语境，“使他得胜”自然传达其实际结果，并用脚注保留“拯救、解救”的直译可能。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名形式呈现四字神名，而不改译为称号“主”。
- source_word: בְּכֹל אֲשֶׁר הָלָךְ
  choice: 无论往哪里去
  rationale: 此希伯来语表达全面涵盖大卫所到之处；“无论往哪里去”自然且不把含义过度限定为军事行军。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 原文直接使用以色列之神的专名。正文保留神名而不以称号替代；“耶和华”是现代简体中文中辨识度最高、最通行的专名形式。
- issue: וַיֹּשַׁע在军事语境中的含义
  choice: 使他得胜
  alternative: 拯救大卫；解救大卫
  rationale: “得胜”清楚表达本段军事语境中的结果，但原词本身属于“拯救、解救”语义域，因此在脚注中保留较形式对应的译法，避免消除其神学张力。
- issue: עֲבָדִים所表达的臣属关系
  choice: 臣仆
  alternative: 仆人；臣服于大卫的人
  rationale: 本句描述整个亚兰在战败后承担进贡义务，重点是政治臣属。“臣仆”既保留服事词义，也不将其擅自具体化为现代意义上的个体奴隶身份。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“臣仆”“进贡”保留古代政治语境所需的历史色彩，但句法保持普通读者易懂。分号呈现征服、臣属与进贡之间的紧密关系；末句保留原文以耶和华为行动主体的神学重点。
