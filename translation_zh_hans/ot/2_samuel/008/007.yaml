  text: And David took the shields of gold that belonged to the servants of Hadadezer and brought them to Jerusalem[a].
translation:
  language: zh_hans
  text: 大卫取了哈大底谢的臣仆所持有的金盾牌[a]，把它们带到耶路撒冷。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “金盾牌”也可译为“金的盾牌”；希伯来语较直译为“金子的盾牌”。少数意见认为这里的词指“箭袋”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: 夺取了
  rationale: לקח的基本义是“拿、取”；在战胜敌军并取得战利品的叙事语境中，“夺取”自然表达从敌方取得之意，但不额外说明具体方式。
- source_word: שִׁלְטֵי הַזָּהָב
  choice: 金盾牌
  rationale: 该短语是限定性构造，直译为“金子的盾牌”。“金盾牌”在现代汉语中简洁自然，并保留材质或装饰为金的基本含义。שִׁלְטֵי传统上理解为盾牌或防护装备；少数意见释为箭袋，列入脚注。
- source_word: אֲשֶׁר הָיוּ אֶל
  choice: 所持有的
  rationale: 字面近于“在……那里/归……所有”，此处表达占有或隶属关系。“所持有的”既符合语境，又比“属于”稍少断定永久所有权。
- source_word: עַבְדֵי הֲדַדְעָזֶר
  choice: 哈大底谢臣仆
  rationale: עֶבֶד可指奴隶、仆人、臣属或官员。此处涉及君王身边的人员，“臣仆”保留其服事与隶属君王的双重含义，不限定为奴隶或正式官员。
- source_word: וַיְבִיאֵם
  choice: 把它们带到
  rationale: בוא的使役形在此意为“带来、带到”，宾语后缀所指为前述盾牌；汉语用“把它们带到”清楚自然。
- source_word: יְרוּשָׁלִָם
  choice: 耶路撒冷
  rationale: 采用现代中文圣经及一般读者熟悉的标准地名译法。
