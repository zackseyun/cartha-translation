  text: וַ/יָּ֨שֶׂם בֶּ/אֱד֜וֹם נְצִבִ֗ים בְּ/כָל אֱדוֹם֙ שָׂ֣ם נְצִבִ֔ים וַ/יְהִ֥י כָל אֱד֖וֹם עֲבָדִ֣ים לְ/דָוִ֑ד וַ/יּ֤וֹשַׁע יְהוָה֙ אֶת דָּוִ֔ד בְּ/כֹ֖ל אֲשֶׁ֥ר הָלָֽךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/014.yaml
  text: He placed garrisons in Edom[a]; throughout all Edom he placed garrisons, and all Edom became servants to David[b]. And Yahweh gave David victory wherever he went.
translation:
  language: zh_hans
  text: 他在以东设置驻军；他在以东全境都设置驻军。以东人全都成了大卫的臣仆[a]。大卫无论往哪里去，雅威都使他得胜[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可直译作“全以东都成了大卫的仆役”。原文以国名“以东”集合性地指以东人。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“雅威拯救（或解救）大卫”。在这里的军事语境中，“使他得胜”表达了这种拯救的结果。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם / שָׂם
  choice: 设置了
  rationale: שׂים 的基本义是“放置、设置”；与“驻军”搭配时，“设置”既自然，又不把动词本身过度具体化为“派驻”。
- source_word: נְצִבִים
  choice: 驻军
  rationale: 该词可指派驻的官员或驻守力量；在征服以东的军事语境中，“驻军”最符合上下文，同时保留其控制占领地的功能。
- source_word: בֶּאֱדוֹם / בְּכָל אֱדוֹם
  choice: 在以东 / 在以东全境
  rationale: 介词 בְּ 表示地点；בְּכָל אֱדוֹם 带有遍及全地的意思，译为“在以东全境”自然且准确。
- source_word: וַיְהִי כָל אֱדוֹם עֲבָדִים לְדָוִד
  choice: 以东全境都臣服于大卫
  rationale: 原文以国名“以东”集合性地指其人民，עֲבָדִים 表示处于仆役或受辖制的地位。在国家征服语境中，“臣服于”准确表达政治性从属，也避免现代汉语“奴隶”可能造成的过度限定。
- source_word: וַיּוֹשַׁע
  choice: 使他得胜
  rationale: ישׁע 的使役形可指拯救、解救或使人获胜；本节是军事战绩总结，“使他得胜”清楚呈现语境含义，并保留雅威为施事者。
- source_word: יְהוָה
  choice: 雅威
  rationale: 原文使用神的专名四字神名；译作“雅威”而不以称号代替，以保留专名性质。
- source_word: בְּכֹל אֲשֶׁר הָלָךְ
  choice: 无论往哪里去
  rationale: 这是表示全面范围的习语；“无论往哪里去”符合现代汉语，也不额外加入“出征”等原文未明说的军事限定。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用神的专名，正文采用“雅威”保留其专名身份，而不以称号替代。
- issue: עֲבָדִים 在征服语境中的力度
  choice: 臣服于大卫
  alternative: 作大卫的仆役；作大卫的奴仆
  rationale: 该词包含服役和受辖制的语义张力；此处涉及整个国家，译作“臣服于”突出政治从属，同时脚注保留较直译的“作仆役”可能。
- issue: וַיּוֹשַׁע 的军事语境含义
  choice: 使他得胜
  alternative: 拯救他；解救他
  rationale: 军事总结语境支持“使他得胜”，但希伯来词本身仍有“拯救、解救”之义，故以脚注保留。
translation_notes:
  register: 采用庄重、清晰的现代标准汉语。“设置驻军”保留原文动词的宽泛性；重复“在以东全境……设置了驻军”以体现希伯来文的强调。正文用“臣服”表达国家受辖制，脚注保留“仆役”的字面力度。
