base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/004.yaml
  text: David captured from him 1,700 horsemen and 20,000 foot soldiers[a]. Then David hamstrung all the chariot horses[c][b], but left enough for 100 chariots.
translation:
  language: zh_hans
  text: 大卫从他那里俘获了一千七百名骑兵和两万名步兵[a]。随后，大卫砍断了所有战车用马的腿筋[b]，只留下够一百辆战车使用的马[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文本作“一千七百名骑兵”；《历代志上》18:4的平行经文作“七千名骑兵”。
    reason: textual_variant
  - marker: b
    text: 希伯来文直译为“所有战车（或战车部队）”；由于所述动作是砍断腿筋，译文明确指出对象是战车用马。
    reason: lexical_alternative
  - marker: c
    text: 或译：“却从其中留下可供一百辆战车使用的数量。”
    reason: previous_rendering
lexical_decisions:
- source_word: וַיִּלְכֹּד
  choice: 俘获
  rationale: לכד在战争语境中表示捕获、夺取；“俘获”自然地表达大卫从敌王手中擒获军兵。
- source_word: מִמֶּנּוּ
  choice: 从他那里
  rationale: 希伯来文后缀为阳性单数，按上下文指被击败的哈大底谢。
- source_word: אֶלֶף וּשְׁבַע מֵאוֹת פָּרָשִׁים
  choice: 一千七百名骑兵
  rationale: פָּרָשִׁים指骑马作战的人；正文依照《撒母耳记》马所拉文本的数字。
- source_word: וְעֶשְׂרִים אֶלֶף אִישׁ רַגְלִי
  choice: 两万名步兵
  rationale: 原文直译为“两万名步行的人”，在军事语境中用“步兵”清楚自然。
- source_word: וַיְעַקֵּר
  choice: 砍断……腿筋
  rationale: עקר在此指割断马的腿筋，使其不能用于作战；译文明确动作及对象。
- source_word: אֶת כָּל הָרֶכֶב
  choice: 所有战车用马
  rationale: רֶכֶב通常可指战车或战车部队，但能被砍断腿筋的是马，因此这里按转喻明确译出战车用马。
- source_word: וַיּוֹתֵר מִמֶּנּוּ מֵאָה רָכֶב
  choice: 只留下够一百辆战车使用的马
  rationale: יתר的使役式表示留下或保留；结合前句，意思是留下足以配备一百辆战车的马。
