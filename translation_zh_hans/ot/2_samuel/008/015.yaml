  text: וַ/יִּמְלֹ֥ךְ דָּוִ֖ד עַל כָּל יִשְׂרָאֵ֑ל וַ/יְהִ֣י דָוִ֗ד עֹשֶׂ֛ה מִשְׁפָּ֥ט וּ/צְדָקָ֖ה לְ/כָל עַמּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/015.yaml
  text: So David reigned over all Israel[a], and David was administering justice and righteousness to all his people.
translation:
  language: zh_hans
  text: 大卫统治全以色列，又为他的全体百姓施行公正和公义[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“秉公行义”。“公正和公义”是希伯来语中描述理想君王统治的惯用搭配。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְלֹךְ
  choice: 统治
  rationale: 此处的 מלך 描述大卫实际行使王权，而不只是登基；“统治”简洁自然，适合王国政绩总结的语境。
- source_word: עַל כָּל יִשְׂרָאֵל
  choice: 全以色列
  rationale: עַל 与 מלך 连用，标明统治的范围；“全以色列”保留 כָּל 所表达的完整范围。
- source_word: וַיְהִי ... עֹשֶׂה
  choice: 施行
  rationale: וַיְהִי 加分词表示持续或惯常的行动。现代汉语虽不必另加“不断”等副词，但“施行”在本句中自然表达大卫一贯治理百姓的作为。
- source_word: מִשְׁפָּט
  choice: 公平
  rationale: 在君王治理的语境中，מִשְׁפָּט 指公正裁断和秉公治理；“公平”与“公义”搭配自然，也保留司法层面的含义。
- source_word: וּצְדָקָה
  choice: 公义
  rationale: צְדָקָה 表示正直、合宜和正义；译作“公义”可与 מִשְׁפָּט 的“公平”有所区分，不把两个概念合并。
- source_word: לְכָל עַמּוֹ
  choice: 为自己的全体百姓
  rationale: 介词 לְ 在这里表示治理行动所惠及、所面向的对象；“为”符合现代汉语表达。物主后缀译作“自己的”，而“全体”明确保留 כָּל。
theological_decisions:
- issue: 君王治理用语 מִשְׁפָּט וּצְדָקָה 的译法
  choice: 公平和公义
  alternative: 秉公行义
  rationale: 保留两个名词，可同时呈现司法上的公平和伦理上的正直，维持希伯来语对理想王权的双重描述；脚注另列较凝练的汉语表达。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“施行公平和公义”略带正式色彩，符合王政总结语境；脚注提供更凝练、较具汉语成语感的译法。
