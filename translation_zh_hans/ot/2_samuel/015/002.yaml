  text: וְ/הִשְׁכִּים֙ אַבְשָׁל֔וֹם וְ/עָמַ֕ד עַל יַ֖ד דֶּ֣רֶךְ הַ/שָּׁ֑עַר וַ/יְהִ֡י כָּל הָ/אִ֣ישׁ אֲשֶֽׁר יִהְיֶה לּ/וֹ רִיב֩ לָ/ב֨וֹא אֶל הַ/מֶּ֜לֶךְ לַ/מִּשְׁפָּ֗ט וַ/יִּקְרָ֨א אַבְשָׁל֤וֹם אֵלָי/ו֙ וַ/יֹּ֗אמֶר אֵֽי מִ/זֶּ֥ה עִיר֙ אַ֔תָּה וַ/יֹּ֕אמֶר מֵ/אַחַ֥ד שִׁבְטֵֽי יִשְׂרָאֵ֖ל עַבְדֶּֽ/ךָ־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/002.yaml
  text: Absalom would rise early and stand beside the road to the gate. Whenever any man had a dispute and came to the king for judgment[a], Absalom would call to him and say, “From what city are you?” And he would say, “Your servant is from one of the tribes of Israel.”
translation:
  language: zh_hans
  text: 押沙龙常常清早起来，站在通往城门的路旁。凡有人有争讼[a]，要到王那里求审判，押沙龙就叫住他，问道：“你是哪座城的人？”那人便说：“仆人来自以色列的一个支派。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “争讼”也可译作“案件”或“申诉”；希伯来语 רִיב 在司法语境中可指争端、控诉或诉讼案件。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִשְׁכִּים
  choice: 常常清早起来
  rationale: 该动词表示清早起来；结合全节反复发生的叙述语境，用“常常”明确其惯常性。
- source_word: וְעָמַד
  choice: 站在
  rationale: 保留“站立”的基本空间含义，并与前句共同表达押沙龙反复采取的行动。
- source_word: עַל יַד
  choice: 路旁
  rationale: 该惯用语意为“在……旁边”；与דֶּרֶךְ连用时译作“路旁”自然简洁。
- source_word: דֶּרֶךְ הַשָּׁעַר
  choice: 通往城门的路
  rationale: 结构所指是通向城门的道路；“城门”补出语境中通常隐含的城市入口，符合现代汉语表达。
- source_word: וַיְהִי כָּל הָאִישׁ אֲשֶׁר יִהְיֶה לּוֹ רִיב
  choice: 凡有人有争讼
  rationale: 以“凡……就……”呈现反复出现的情形；רִיב在司法语境中可指争端、申诉或案件，“争讼”保留这种法律性而不限定具体案由。
- source_word: לָבוֹא אֶל הַמֶּלֶךְ לַמִּשְׁפָּט
  choice: 要到王那里求审判
  rationale: מִשְׁפָּט在此指司法裁断；“求审判”准确表达来见王以获得裁决的目的。
- source_word: וַיִּקְרָא ... אֵלָיו
  choice: 押沙龙就招呼他
  rationale: 该表达是向某人呼喊或叫住他；“招呼”符合现场拦人与搭话的情景，又不误作正式传召。
- source_word: אֵי מִזֶּה עִיר אַתָּה
  choice: 你是哪个城的人？
  rationale: 自然地表达原文询问对方来自哪座城，同时保留地域归属的含义。
- source_word: מֵאַחַד שִׁבְטֵי יִשְׂרָאֵל
  choice: 是以色列某个支派的人
  rationale: 原文回答以支派而非具体城市说明来历；“某个支派”保留不特指的措辞。
- source_word: עַבְדֶּךָ
  choice: 仆人
  rationale: 此处是对王子说话时谦恭的自称；“仆人”保留社会礼貌语体，不额外强调奴隶身份。
