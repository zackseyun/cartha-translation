revisions:
- from: 押沙龙常常清早起来，站在通往城门的路旁。凡有人有争讼[a]，要到王那里求审判，押沙龙就招呼他，说：“你是哪个城的人？”那人就说：“仆人是以色列某个支派的人。”
  to: 押沙龙常常清早起来，站在通往城门的路旁。凡有人有争讼[a]，要到王那里求审判，押沙龙就叫住他，问道：“你是哪座城的人？”那人便说：“仆人来自以色列的一个支派。”
  rationale: 修订仅改善两处汉语表达：以‘叫住’更贴近呼叫并拦问的动作，以‘来自以色列的一个支派’明确原文的来源关系。其余措辞及脚注均可保留。
