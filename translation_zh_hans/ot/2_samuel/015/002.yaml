  - severity: low
    issue: ‘招呼他’可略微优化为‘叫住他’。
    rationale: וַיִּקְרָא ... אֵלָיו 是向那人呼叫；在该场景中‘叫住’更清楚表达押沙龙使路人停下并与之交谈。
