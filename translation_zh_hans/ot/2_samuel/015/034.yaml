base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/034.yaml
  text: But if you return to the city and say to Absalom, ‘I will be your servant, O king; as I was your father’s servant in the past, so now I will be your servant,’ then you will frustrate Ahithophel’s counsel for me.
translation:
  language: zh_hans
  text: 不过，你若回城去，对押沙龙说：‘王啊，我愿作你的仆人；我从前怎样作你父亲的仆人，现在也愿照样作你的仆人。’这样，你就能为我挫败亚希多弗的计谋。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תָשׁוּב
  choice: 回……去
  rationale: 该动词表示“返回”；结合目的地 הָעִיר，译作“回城去”自然且准确。
- source_word: עֶבֶד
  choice: 仆人
  rationale: 在君王语境中指效忠、服事王的人；“仆人”既保留身份用语，也符合现代汉语叙事文体。
- source_word: וְהֵפַרְתָּה
  choice: 挫败
  rationale: 希伯来语在此有使计划失效、破坏其效力之意；“挫败”适合与“计谋”搭配。
- source_word: עֲצַת
  choice: 计谋
  rationale: עֵצָה 可指建议、谋略或计策；此处亚希多弗为押沙龙出谋划策，译作“计谋”最贴合上下文。
- source_word: לִי
  choice: 为我
  rationale: 保留大卫所说的受益关系，即户筛将代表大卫使亚希多弗的计谋失效。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“我从前怎样……现在也愿照样……”以通顺汉语呈现原文高度压缩的对比结构，并保留户筛所要宣称的效忠转换。专名采用通行译法“押沙龙”“亚希多弗”。
