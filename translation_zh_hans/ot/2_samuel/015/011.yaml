  yaml_path: translation/ot/2_samuel/015/011.yaml
  text: Two hundred men from Jerusalem went with Absalom[a], invited, and they went innocently, not knowing anything.
translation:
  language: zh_hans
  text: 有二百人从耶路撒冷与押沙龙一同前去；他们受邀同行，毫无戒心，什么也不知道。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“心地单纯”或“存着正直的心”；原文在这里表示他们毫不怀疑，并不知道押沙龙的计划。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת־אַבְשָׁלוֹם הָלְכוּ
  choice: 跟随押沙龙前去
  rationale: הלך与אֶת连用表示同行；译为“跟随……前去”既表达同行关系，也符合押沙龙带领众人出发的叙事语境。
- source_word: מָאתַיִם אִישׁ
  choice: 二百人
  rationale: 原文是数词后接阳性单数集合用法；现代汉语以“二百人”自然准确地表达人数，不必另加性别词。
- source_word: מִירוּשָׁלַםִ
  choice: 从耶路撒冷
  rationale: 介词מִן表示来源，直译为“从耶路撒冷”。
- source_word: קְרֻאִים
  choice: 都是受邀而来的
  rationale: קרא的被动分词在此表示“受邀请”；不增添原文未明说的“宾客”，并用现代汉语交代他们同行的缘由。
- source_word: וְהֹלְכִים לְתֻמָּם
  choice: 毫无戒心
  rationale: לְתֻמָּם可表示纯真、正直或不存疑心；后句说明他们完全不知情，因此正文采用语境中最自然的“毫无戒心”，同时以脚注保留词义幅度。
- source_word: וְלֹא יָדְעוּ כָּל־דָּבָר
  choice: 对这事一无所知
  rationale: כָּל־דָּבָר在此指他们不知押沙龙所谋之事；“对这事一无所知”自然地传达完全不知情，而不把具体阴谋内容增写进正文。
