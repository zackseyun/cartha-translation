  text: וַ/יְהִ֤י דָוִד֙ בָּ֣א עַד הָ/רֹ֔אשׁ אֲשֶֽׁר יִשְׁתַּחֲוֶ֥ה שָׁ֖ם לֵ/אלֹהִ֑ים וְ/הִנֵּ֤ה לִ/קְרָאת/וֹ֙ חוּשַׁ֣י הָ/אַרְכִּ֔י קָר֨וּעַ֙ כֻּתָּנְתּ֔/וֹ וַ/אֲדָמָ֖ה עַל רֹאשֽׁ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/032.yaml
  text: When David came to the summit[a], where he worshiped God, behold[b], Hushai the Archite came to meet him with his tunic torn and dirt on his head.
translation:
  language: zh_hans
  text: 大卫来到那山顶；那是他在那里敬拜上帝的地方[a]。看哪[b]，亚基人户筛前来迎见他，身上的长衣撕裂，头上蒙着尘土。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的希伯来语动词可表示他惯常在那里敬拜，也可作非惯常的叙事理解。
    reason: lexical_alternative
  - marker: b
    text: “看哪”译自一个希伯来语叙事标记，用来突出户筛突然出现。
    reason: cultural_note
lexical_decisions:
- source_word: הָרֹאשׁ
  choice: 山顶
  rationale: 该词本义为“头、顶端”，在这里的地形语境中指山的顶部；“山顶”在现代汉语中准确自然。
- source_word: אֲשֶׁר יִשְׁתַּחֲוֶה שָׁם לֵאלֹהִים
  choice: 就是他在那里敬拜上帝的地方
  rationale: יִשְׁתַּחֲוֶה本义是俯伏、下拜，与“向上帝”连用时表达敬拜。未完成式在叙事中既可能表示惯常行为，也可能指当时的行动，因此正文采用不明确标示频率的“敬拜”，并以脚注保留歧义。
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留希伯来叙事标记带来的现场感和突然转折；虽属较庄重的表达，仍容易理解。
- source_word: לִקְרָאתוֹ
  choice: 迎面而来
  rationale: 该短语表示朝某人而来与之相遇；结合上下文补足汉语所需的移动含义。
- source_word: חוּשַׁי הָאַרְכִּי
  choice: 亚基人户筛
  rationale: 户筛为人名音译；הָאַרְכִּי是族属或籍贯称谓，按汉语圣经人名表达惯例译作“亚基人”。
- source_word: קָרוּעַ כֻּתָּנְתּוֹ
  choice: 身上的长衣已经撕裂
  rationale: כֻּתֹּנֶת指贴身或内层的长衣；“长衣”比笼统的“衣服”具体，又避免“袍子”可能带来的礼服联想。קָרוּעַ表达撕裂后的状态，故译“已经撕裂”。
- source_word: וַאֲדָמָה עַל רֹאשׁוֹ
  choice: 头上还撒着土
  rationale: אֲדָמָה本义为土地、泥土；这里是哀悼的举动。“撒着土”既符合原词，也自然呈现其文化动作。
theological_decisions:
- issue: 大卫在山顶敬拜是惯常行为还是当时的一次行动
  choice: 正文译为不标明频率的“他在那里敬拜上帝”
  alternative: “他素来在那里敬拜上帝”或“他在那里向上帝下拜”
  rationale: 希伯来语未完成式可按语境理解为惯常过去，也可描述当时的行动。正文不替原文消除这一歧义，脚注说明两种可能。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“看哪”有意保留原文突显新场景的语气；“身上的长衣已经撕裂，头上还撒着土”清楚呈现古代哀悼姿态，但不在正文中额外解释。
