    reason: lexical_alternative
  - marker: b
    text: “看哪”译自一个希伯来语叙事标记，用来突出户筛突然出现。
    reason: cultural_note
  revision_rationale: 修订严格保留原文的地点指涉、敬拜语义及动词形式可能含有的惯常意味，并由脚注保留歧义。将“撒着土”改为状态表达，避免无依据地补入动作；将相遇关系明确译出。
