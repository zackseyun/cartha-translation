revisions:
- from: 大卫来到山顶，就是他在那里敬拜上帝的地方[a]。看哪[b]，亚基人户筛迎面而来，身上的长衣已经撕裂，头上还撒着土。
  to: 大卫来到那山顶；那是他在那里敬拜上帝的地方[a]。看哪[b]，亚基人户筛前来迎见他，身上的长衣撕裂，头上蒙着尘土。
  rationale: 修订严格保留原文的地点指涉、敬拜语义及动词形式可能含有的惯常意味，并由脚注保留歧义。将“撒着土”改为状态表达，避免无依据地补入动作；将相遇关系明确译出。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T05:26:56Z'
review_pass:
  verdict: revise
  source_fidelity: “头上还撒着土”将原文所述的状态改成了正在进行的动作；希伯来语只说他的头上有土。将其改为“头上蒙着尘土”更准确。另，“迎面而来”虽可理解，却未清楚表达户筛是特意来与大卫相见；“前来迎见他”更贴合 לִקְרָאתוֹ。
  naturalness: 原文整体庄重自然，但“来到山顶，就是他在那里敬拜上帝的地方”略显口语式连接。改为“来到那山顶；那是他在那里敬拜上帝的地方”层次更清楚，也保留叙事文体。“看哪”在此可保留，以传达 וְהִנֵּה 的突显语气。
  terminology: “上帝”“亚基人户筛”“长衣”均可接受。“敬拜”恰当地表达向上帝下拜的习语义。脚注应说明未完成式可有惯常义或非惯常的叙事理解，但不应把后者表述为确定的“当时正在敬拜”。
  issues:
  - severity: medium
    issue: “头上还撒着土”把名词性状态译作动作。
    rationale: וַאֲדָמָה עַל־רֹאשׁוֹ 是“土在他头上”的并列描述，并没有“撒”的动词；“还”也额外引入强调。
  - severity: low
    issue: “迎面而来”未充分明示来与大卫相见的目的。
    rationale: לִקְרָאתוֹ 表示朝向大卫、为与他相见而来；“前来迎见他”在现代汉语中清楚自然。
  - severity: low
    issue: 地点关系的汉语连接可更顺畅。
    rationale: 用分号并以“那是……”承接，能清楚表达关系从句所限定的地点，而不改变其可能带有惯常意味的歧义。
  revised_text: 大卫来到那山顶；那是他在那里敬拜上帝的地方[a]。看哪[b]，亚基人户筛前来迎见他，身上的长衣撕裂，头上蒙着尘土。
  revised_footnotes:
