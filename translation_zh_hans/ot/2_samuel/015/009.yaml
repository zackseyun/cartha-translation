  text: The king said to him, “Go in peace.” So he arose and went to Hebron.
translation:
  language: zh_hans
  text: 王对他说：“你平安地去吧。”他就起身，往希伯仑去了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 对他说
  rationale: 这是叙事中引出直接引语的常用表达；结合其后的间接宾语 לֹו，译作“对他说”自然且忠实。
- source_word: הַמֶּלֶךְ
  choice: 王
  rationale: 原文用带定冠词的称谓，语境中指已知的王大卫；保留“王”，不在正文中补出名字。
- source_word: לֵךְ בְּשָׁלוֹם
  choice: 平安地去吧
  rationale: 这是用于准许离开或祝愿出行平安的惯用语；“平安地去吧”既保留命令语气，也传达 בְּשָׁלוֹם 的含义。
- source_word: וַיָּקָם
  choice: 起身
  rationale: קום 在这里表示起身并开始行动；“起身”符合庄重而自然的现代汉语叙事语体。
- source_word: וַיֵּלֶךְ
  choice: 去了
  rationale: הלך 是普通的移动动词；配合目的地译为“往……去了”，清楚呈现连续动作。
- source_word: חֶבְרוֹנָה
  choice: 往希伯仑
  rationale: 地名后的方向词尾 ה 表示朝向希伯仑；现代汉语自然译作“往希伯仑”。
