  text: וַ/יֹּ֨אמֶר֙ אַבְשָׁל֔וֹם מִי יְשִׂמֵ֥/נִי שֹׁפֵ֖ט בָּ/אָ֑רֶץ וְ/עָלַ֗/י יָב֥וֹא כָּל אִ֛ישׁ אֲשֶֽׁר יִהְיֶה לּ/וֹ רִ֥יב וּ/מִשְׁפָּ֖ט וְ/הִצְדַּקְתִּֽי/ו־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/004.yaml
  text: Then Absalom would say[a], “If only I were appointed judge in the land! Then every man who has a dispute or a case could come to me[c][b], and I would give him justice.”
translation:
  language: zh_hans
  text: 押沙龙常说[a]：“但愿有人立我作这地的审判官！凡有争讼或案件的人[b]都可以到我这里来，我就为他伸张正义[c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “但愿有人立我”直译为“谁会立我”；这里的问句表达愿望，并不只是询问信息。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“凡有争讼和案件的每一个人”；阳性单数在这里是泛指。
    reason: lexical_alternative
  - marker: c
    text: 或译：“我就判他有理”或“我就为他申冤”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 总是说
  rationale: 结合上下文，这是押沙龙反复对前来求审的人所说的话；用“总是说”表达未完成叙事形式在此处的反复意味。
- source_word: מִי יְשִׂמֵנִי
  choice: 但愿有人立我
  rationale: 字面是“谁会立我”，但这里是带修辞色彩的愿望，并非单纯询问信息；“但愿有人”既保留未指明的任命者，也自然传达渴望。
- source_word: שֹׁפֵט
  choice: 审判官
  rationale: 该词在争讼和案件的司法语境中指负责裁断的人；“审判官”比现代职位色彩较强的“法官”更适合古代背景。
- source_word: בָּאָרֶץ
  choice: 这地
  rationale: 既保留 אֶרֶץ 的地域含义，也符合本段指以色列境内的语境。
- source_word: וְעָלַי יָבוֹא
  choice: 都可以到我这里来
  rationale: 表达押沙龙所设想的条件成立后，人们可以前来由他审理；中文自然且不把结果说成必然发生。
- source_word: כָּל אִישׁ
  choice: 凡……的人
  rationale: 原文为阳性单数的泛指表达；现代汉语用“凡……的人”自然涵盖任何有法律事务者，同时避免不必要地限定性别。
- source_word: רִיב וּמִשְׁפָּט
  choice: 争讼或案件
  rationale: רִיב 指争端或诉讼，מִשְׁפָּט 在此指有待裁断的法律案件；二者并列译出，保留法律语境及一定程度的语义重叠。
- source_word: וְהִצְדַּקְתִּיו
  choice: 我就为他伸张正义
  rationale: 使役形在司法语境中可指判某人有理、为其申冤或使其得到公正裁断；正文采用自然宽广的表达，并以脚注保留较字面的可能译法。
theological_decisions:
- issue: וְהִצְדַּקְתִּיו 是否暗示押沙龙会一概判来者有理
  choice: 为他伸张正义
  alternative: 判他有理／为他申冤
  rationale: 原文带有有利于来者的司法措辞，可能刻画押沙龙笼络人心的承诺；正文不把它弱化为纯粹中性的“公正审理”，脚注则保留“判他有理”的较强含义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“总是说”体现上下文中的反复行为；“审判官”保留古代司法行政色彩。正文中的三个脚注标记均置于相关词句之后。
