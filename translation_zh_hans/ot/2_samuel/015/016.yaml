review_pass:
  verdict: revise
  source_fidelity: 正文准确呈现王离去、家中人员徒步随行、留下十名妾看守住所这三个行动。惟“妃嫔”并不精确对应 פִּילַגְשִׁים（妾、侧室），且“宫殿”较“房屋／住所”更具体、更具解释性；原文有意使用普通的“房屋”。
  naturalness: “他全家的人”略显重复且不如“他家中的人”自然。“十名女子，都是妾”既符合现代汉语，也保留原文“女子—妾”的同位说明。
  terminology: 应以“妾”对应 פִּילַגְשִׁים，不宜用范围较宽、且可指后妃等级体系中各类嫔妃的“妃嫔”。“房屋”对应末尾的 הַבַּיִת，避免将其限定为“宫殿”。
  issues:
  - severity: medium
    issue: “妃嫔”替代“女子—妾”
    rationale: פִּילַגְשִׁים特指妾或侧室；“妃嫔”是较宽泛且带中国宫廷等级色彩的称谓。正文可自然地保留“十名女子，都是妾”的原文同位关系。
  - severity: low
    issue: “宫殿”过度具体化 הַבַּיִת
    rationale: 此词在本句指留下看守的实体住所，但原文只说“房屋／家宅”，没有明说宫殿。译作“房屋”保留原文的表述范围。
  - severity: low
    issue: “他全家的人”表达不够简洁自然
    rationale: “全家”本身已可指一家人，再加“的人”显得重复；“他家中的人全都”更自然，并能表达此处作为人员群体的“家”。
