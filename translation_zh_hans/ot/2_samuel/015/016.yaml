revisions:
- from: 于是王出去了，他全家的人也都跟随他步行；王留下十个妃嫔看守宫殿。[a]
  to: 于是王出去，他家中的人全都徒步跟随在他后面；王留下十名女子，都是妾，看守房屋。[a]
  rationale: 修订以“妾”准确对应原文的 פִּילַגְשִׁים，并在正文保留“女子—妾”的说明关系；将“宫殿”收回为原文较宽的“房屋”；同时使“王家中的人员”在现代汉语中更自然清楚。脚注仍锚定相关句末，并说明随行习语及同位结构。
