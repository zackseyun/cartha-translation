  text: וַ/יֵּצֵ֥א הַ/מֶּ֛לֶךְ וְ/כָל בֵּית֖/וֹ בְּ/רַגְלָ֑י/ו וַ/יַּעֲזֹ֣ב הַ/מֶּ֗לֶךְ אֵ֣ת עֶ֧שֶׂר נָשִׁ֛ים פִּֽלַגְשִׁ֖ים לִ/שְׁמֹ֥ר הַ/בָּֽיִת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/016.yaml
  text: So the king went out[a], and all his household after him on foot; and the king left ten women, concubines, to keep the house.
translation:
  language: zh_hans
  text: 于是王出去，他家中的人全都徒步跟随在他后面；王留下十名女子，都是妾，看守房屋。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “徒步跟随在他后面”：原文较直译为“他家中的人全都在他脚边（或脚后）”。这个希伯来语表达在这里指他们徒步跟随王。“十名女子，都是妾”保留原文“十名女子——妾”的同位说明。
    reason: 保留希伯来语习语的字面可能性，以及“女子／妾”的同位结构。
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: 出去了
  rationale: יצא在叙事性连续体中表示从所在之处出去、离开；译作“出去了”保留具体动作，也符合上下文的叙事推进。
- source_word: הַמֶּלֶךְ
  choice: 王
  rationale: 原文使用带定冠词的称号“王”，虽上下文所指是大卫，仍保留称号，不以人名替代。
- source_word: וְכָל בֵּיתוֹ
  choice: 他全家的人
  rationale: בַּיִת带所属后缀在这里指王家中的人员，而非建筑物；“他全家的人”在现代汉语中自然清楚，并与本节末尾表示住所的同词形成必要区分。
- source_word: בְּרַגְלָיו
  choice: 跟随他步行
  rationale: 该短语字面可作“在他脚边／脚后”，在此语境中表达众人随王徒步而行；正文采用自然汉语，同时用脚注保留其字面形式。
- source_word: וַיַּעֲזֹב
  choice: 留下
  rationale: עזב在这里表示将人留在原处，而非带有强烈负面意味的“抛弃”。
- source_word: עֶשֶׂר נָשִׁים פִּלַגְשִׁים
  choice: 十个妃嫔
  rationale: 原文是“十个女人——妾”，其中“妾”对“女人”作同位说明。现代汉语“妃嫔”简洁表达王的这些次等配偶；脚注补明原文形式。
- source_word: לִשְׁמֹר
  choice: 看守
  rationale: שׁמר可指守护、照管；“看守”兼有守卫和照看的含义，适合受命留守王宫的语境。
- source_word: הַבָּיִת
  choice: 宫殿
  rationale: 此处בַּיִת指王留下的住所，而不是前文作为人员群体的“家”；按语境译作“宫殿”可避免误解，并准确传达王室住所。
