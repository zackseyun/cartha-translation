base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/031.yaml
  text: And it was told David[a], saying, “Ahithophel is among the conspirators with Absalom.” And David said, “O Yahweh, please turn Ahithophel’s counsel into foolishness.”
translation:
  language: zh_hans
  text: 有人告诉大卫说：“亚希多弗在与押沙龙同谋的人中。”大卫说：“雅威啊，求你使亚希多弗的计谋变得愚拙[a]！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“挫败亚希多弗的计谋。”原文更直译为使他的计谋变得愚拙。
    reason: 说明该动词既可保留“使计谋愚拙化”的原有意象，也可按语境表达为使计谋失效。
lexical_decisions:
- source_word: הִגִּיד
  choice: 有人告诉
  rationale: 该词在使役词干中意为“告诉、禀报”。原文未明说报告者是谁，汉语以不定指的“有人”自然表达，而不具体补出身份。
- source_word: לֵאמֹר
  choice: 说
  rationale: 保留希伯来语引出直接引语的结构，在现代汉语中也通顺自然。
- source_word: בַּקֹּשְׁרִים
  choice: 在……同谋的人中
  rationale: 该复数形式具体指参与阴谋或叛乱的一群人；此译既表达亚希多弗属于他们，也保留政治谋叛的语境。
- source_word: עִם
  choice: 与……
  rationale: 直接表达亚希多弗同押沙龙的联合关系，不额外解释其具体职分。
- source_word: סַכֶּל
  choice: 使……变为愚拙
  rationale: 该命令式在此求神使亚希多弗的计谋成为愚妄、失去智慧；译文保留“愚拙”的词义意象，而未直接收窄为结果性的“挫败”。
- source_word: נָא
  choice: 求你
  rationale: 在祷告中表达恳求语气；“求你”比字面的“请”更符合现代汉语庄重祈求的语域。
- source_word: עֲצַת
  choice: 计谋
  rationale: 该词可指劝告、谋略或计策。此处涉及押沙龙叛乱中的战略筹划，“计谋”兼具谋划与政治军事语境。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，保留原文直接称呼上帝名字的特点，而不以称号代替。
theological_decisions:
- issue: 直接呼求中的神名 יְהוָה
  choice: 雅威啊
  alternative: 耶和华啊／主啊
  rationale: 原文使用四字神名，并在祷告中直接呼求。译作“雅威啊”保留专名及呼格语气，不将其改作“主”这一称号。
- issue: סַכֶּל 所表达的是愚拙化还是直接挫败
  choice: 使……变为愚拙
  alternative: 挫败……
  rationale: 原文首先描写使计谋成为愚拙；虽然这在语境中很可能意味着使其失效，译文不把潜在结果取代原有意象。
translation_notes:
  register: 采用现代、庄重而易懂的叙事与祷告语言。“有人告诉”避免生硬的汉语被动式；“雅威啊，求你……”保持简短急切的祈求语气。
