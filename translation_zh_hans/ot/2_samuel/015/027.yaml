base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/027.yaml
  text: Then the king said to Zadok the priest[a], “Are you a seer? Return to the city in peace, and your two sons with you, Ahimaaz your son and Jonathan son of Abiathar.”
translation:
  language: zh_hans
  text: 王对祭司撒督说：“你是先见吗？[a]你平平安安地回城去吧。你们的两个儿子，就是你的儿子亚希玛斯和亚比亚他的儿子约拿单，也要与你们同去。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你看见吗？”希伯来语在这里既可指“先见”，也可理解为“看见”、察觉，或引申为明白。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲ/רוֹאֶה
  choice: 你是先见吗？
  rationale: 该形式可理解为带疑问词的“先见”，也可理解为“你看见／明白吗”。正文保留身份称谓式的疑问，脚注说明另一种可能。
- source_word: שֻׁבָ/ה הָ/עִיר
  choice: 回城去吧
  rationale: שוב 的祈使式带方向词尾，表示返回城中；此译法符合现代汉语叙事语体。
- source_word: בְּ/שָׁלוֹם
  choice: 平平安安地
  rationale: 既保留 שָׁלוֹם 的“平安”意象，也自然表达安全、安然返回。
- source_word: שְׁנֵי בְנֵי/כֶם אִתְּ/כֶם
  choice: 你们的两个儿子也和你们一同回去
  rationale: 原文的人称均为复数，指撒督和亚比亚他，以及他们各自的儿子；补出“回去”使汉语关系清楚。
- source_word: וַ/אֲחִימַעַץ בִּנְ/ךָ וִ/יהוֹנָתָן בֶּן אֶבְיָתָר
  choice: 就是你的儿子亚希玛斯和亚比亚他的儿子约拿单
  rationale: 按原文明确保留两个儿子各自的父子关系，并将其作为对“两个儿子”的具体说明。
theological_decisions:
- issue: הֲרֹאֶה 的身份称谓与感知问句之间的歧义
  choice: 正文译作“你是先见吗？”
  alternative: “你明白吗？”或“你看见了吧？”
  rationale: 上下文可能涉及撒督观察并传递消息的角色，但希伯来语本身容许不同句法理解，因此正文采用“先见”，脚注保留感知义，不将歧义教义化。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“平平安安地”延续圣经叙事中常见的“平安”词汇；末句明确原文复数人称，避免误解为两个儿子都属于撒督。
