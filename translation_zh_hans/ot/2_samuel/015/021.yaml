review_pass:
  verdict: revise
  source_fidelity: 译文整体准确传达了以太以雅威和王的生命起誓、誓言的断然语气、王所在之处以及“死／活”的概括性对举。惟“永活的雅威”在此处将常见的起誓公式“雅威活着”强化为“永恒活着”，加入了原文未明说的永恒性断言；宜避免。
  naturalness: 行文庄重自然。“我主我王”“仆人”均合乎臣属向王说话的语域。将誓词改为“指着雅威和我主我王的生命起誓”可避免“永活的”造成的语义增补，且仍符合现代汉语习惯。
  terminology: “雅威”适当地呈现יהוה；“以太”可作为Ittai的既定音译；“仆人”准确反映此处谦卑、自称的臣属用语，未不必要地限定为法律意义的奴隶。
  issues:
  - severity: medium
    issue: “永活的雅威”增添原文未明示的“永恒”含义。
    rationale: חַי יְהוָה是起誓公式，字面为“雅威活着／雅威永生”，在本节的语用重点是以雅威的生命作誓言凭据；译作“永活的”容易将其读作关于神永恒性的独立神学断言。改为“指着雅威……的生命起誓”，并以脚注说明字面公式，既忠于原文也自然。
  - severity: low
    issue: “也必在那里”的“也”并非原文必要成分。
    rationale: 原文只是断言“你的仆人必在那里”。删去“也”使中文更紧凑，且不改变忠诚承诺的含义。
  revised_text: 以太回答王说：“我指着雅威和我主我王的生命起誓[a]：我主我王无论在哪里，无论是死是活，仆人必在那里。”
  revised_footnotes:
  - marker: a
    text: 直译：“雅威活着，我主我王也活着。”这是希伯来语庄严的起誓格式。
    reason: 说明原文的字面形式及其作为起誓公式的语用功能。
  revision_rationale: 修订仅移除“永活的”所引入的额外语义，并删去非必要的“也”。其余表达保留原文的庄严誓言、对王的双重尊称、地点开放性，以及“死或活”的刻意概括。
