base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/021.yaml
  text: Then Ittai answered the king and said[a], “As Yahweh lives, and as my lord the king lives, surely in whatever place my lord the king may be, whether for death or for life[b], there your servant will be.”
translation:
  language: zh_hans
  text: 以太回答王说：“我指着雅威和我主我王的生命起誓[a]：我主我王无论在哪里，无论是死是活，仆人必在那里。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“雅威活着，我主我王也活着。”这是希伯来语庄严的起誓格式。
    reason: 说明原文的字面形式及其作为起誓公式的语用功能。
lexical_decisions:
- source_word: וַיַּעַן אִתַּי אֶת־הַמֶּלֶךְ וַיֹּאמַר
  choice: 以太回答王说
  rationale: 保留希伯来叙事中“回答……说”的对话结构；人名按希伯来语音译为“以太”。”
- source_word: חַי יְהוָה וְחֵי אֲדֹנִי הַמֶּלֶךְ
  choice: 我指着永活的雅威和我主我王的性命起誓
  rationale: 这是庄严的希伯来誓言格式。中文增明“起誓”，以自然表达其语用功能，同时以脚注保留字面形式；יהוה 译作“雅威”。”
- source_word: כִּי אִם
  choice: （由誓言后的冒号和“必”体现）
  rationale: 此处在誓言中具有强调、断然承诺的作用，并非普通条件句；中文用“必”自然传达其确定语气。”
- source_word: בִּמְקוֹם אֲשֶׁר יִהְיֶה שָּׁם
  choice: 无论在哪里
  rationale: 原文表达王将身处的任何地方；“无论在哪里”简洁自然，并保留开放、不限定地点的含义。”
- source_word: אִם לְמָוֶת אִם לְחַיִּים
  choice: 无论是死是活
  rationale: 保留“死／活”的对举及不计后果的效忠意味，不具体限定究竟指处境、结局还是共同命运。”
- source_word: עַבְדֶּךָ
  choice: 仆人
  rationale: 此处是臣属对王的谦称，重点在忠诚和服事，而非法律上的奴隶身份。”}],
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；“雅威”较直接地呈现这一专名，而不以称号“主”代替。”},{
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“我主我王”保留原文的双重尊称；“无论是死是活”刻意保留原文对承诺范围与结局的概括性，不加以神学化解释。
