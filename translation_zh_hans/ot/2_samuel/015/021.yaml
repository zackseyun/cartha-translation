revisions:
- from: 以太回答王说：“我指着永活的雅威和我主我王的性命起誓[a]：我主我王无论在哪里，无论是死是活，仆人也必在那里。”
  to: 以太回答王说：“我指着雅威和我主我王的生命起誓[a]：我主我王无论在哪里，无论是死是活，仆人必在那里。”
  rationale: 修订仅移除“永活的”所引入的额外语义，并删去非必要的“也”。其余表达保留原文的庄严誓言、对王的双重尊称、地点开放性，以及“死或活”的刻意概括。
  reviewer_model: gpt-5.6-terra
