base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/007.yaml
  text: And at the end of forty years, Absalom said to the king, “Please let me go and pay the vow that I vowed to the LORD in Hebron.”
translation:
  language: zh_hans
  text: 过了四十年[a]，押沙龙对王说：“请准我前去，在希伯仑向耶和华还我所许的愿。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有古译本作“四年”；希伯来文本作“四十年”。
    reason: 这是影响年代理解的重要文本异文；正文遵循所给WLC底本，脚注保留古代见证。
lexical_decisions:
- source_word: מִקֵּץ אַרְבָּעִים שָׁנָה
  choice: 过了四十年
  rationale: 准确保留马所拉文本的“四十年”，并以自然的现代汉语表达“在……期满之后”。
- source_word: אֵלֲכָה נָּא
  choice: 请准我去
  rationale: נָא 表示礼貌请求；结合押沙龙对王说话的语境，“请准我去”比直译“请让我去”更自然庄重。
- source_word: וַאֲשַׁלֵּם אֶת־נִדְרִי
  choice: 还我所许的愿
  rationale: שׁלם 与 נדר 连用表示履行、偿还所许的愿；汉语固定说法“还愿”简洁准确。
- source_word: לַיהוָה
  choice: 向耶和华
  rationale: 采用现代中文圣经语境中通行的专名“耶和华”，并以“向”表达愿的对象。
- source_word: בְּחֶבְרוֹן
  choice: 去希伯仑
  rationale: 希伯仑是押沙龙请求前往并还愿的地点；将地点前置可避免汉语误读为他曾在希伯仑许愿，因为下一节说明他是在基述居住时许愿。
theological_decisions:
- issue: “四十年”与古译本“四年”的文本差异
  choice: 正文依WLC作“四十年”，并加脚注说明异文
  alternative: 按部分古译本作“四年”
  rationale: 所给原文底本明确读 אַרְבָּעִים（四十）；不因年代推算上的困难而静默改正文，同时让读者知悉重要古代异文。
- issue: “在希伯仑”的句法归属
  choice: 理解为前往并还愿的地点
  alternative: 理解为当初许愿的地点
  rationale: 希伯来语末尾地点短语存在一定附着空间，但15:8明确说押沙龙住在基述时许愿，因此不应译成“我在希伯仑所许的愿”。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“请准我去”符合臣子向王请求许可的语境；“还我所许的愿”保留古代许愿与履愿的宗教含义，又是自然汉语。
