  text: וְ/כָל הָ/אָ֗רֶץ בּוֹכִים֙ ק֣וֹל גָּד֔וֹל וְ/כָל הָ/עָ֖ם עֹֽבְרִ֑ים וְ/הַ/מֶּ֗לֶךְ עֹבֵר֙ בְּ/נַ֣חַל קִדְר֔וֹן וְ/כָל הָ/עָם֙ עֹבְרִ֔ים עַל פְּנֵי דֶ֖רֶךְ אֶת הַ/מִּדְבָּֽר־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/023.yaml
  text: And all the land was weeping with a loud voice[a], and all the people were crossing over. The king also crossed over the Kidron Valley[b], and all the people were crossing over on the road toward the wilderness.
translation:
  language: zh_hans
  text: 全地的人都放声痛哭，众人都正越过。王也正越过汲沦谷[a]；众人都沿着通往旷野的路前行[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “汲沦谷”：传统也译作“汲沦溪”。希伯来语 נחל 可指旱谷、沟谷或季节性水道。
    reason: cultural_note
  - marker: b
    text: 或较直译：“在通往旷野的路上过去。”原文措辞简略，可理解为沿着通往旷野的路行进。
    reason: lexical_alternative
lexical_decisions:
- source_word: כָל הָאָרֶץ
  choice: 全境的人
  rationale: 这里的“全地”是集合性、转喻性的说法，指当地民众，也兼有遍地哀哭的场景感；译作“全境的人”既清楚又不扩大为全世界。
- source_word: בּוֹכִים קוֹל גָּדוֹל
  choice: 都放声痛哭
  rationale: 原文直译为“以大声哭泣”；“放声痛哭”自然保留了公开而响亮的哀号意味。
- source_word: כָל הָעָם
  choice: 众人
  rationale: עָם在此泛指随大卫同行的一群人，不宜限定为军队；“众人”简洁且符合叙事语体。
- source_word: עֹבְרִים / עֹבֵר
  choice: 都在渡过去／也渡过了／都渡过去
  rationale: עבר在此描写越过汲沦谷的行动；对众人采用进行性表达以呈现场景，对王采用完成式以符合现代汉语叙事节奏，并保留原文反复出现的“渡过”。
- source_word: בְּנַחַל קִדְרוֹן
  choice: 渡过了汲沦谷
  rationale: נחל可指旱谷、沟谷或季节性水道；此处以“谷”表达地形，比固定译成常年有水的“溪”更稳妥。
- source_word: עַל פְּנֵי דֶרֶךְ אֶת הַמִּדְבָּר
  choice: 沿着通往旷野的路前行
  rationale: 原文结构紧缩，可表达沿路并朝旷野而去；此译清楚传达行进路线，同时用脚注保留较贴近形式的理解。
theological_decisions: []
