revisions:
- from: 全境的人都放声痛哭，众人都在渡过去。王也渡过了汲沦谷[a]；众人都渡过去，沿着通往旷野的路前行[b]。
  to: 全地的人都放声痛哭，众人都正越过。王也正越过汲沦谷[a]；众人都沿着通往旷野的路前行[b]。
  rationale: 修订仅处理两处安全且必要的汉语表达：“全地的人”更贴近原文集合性说法；“正越过”消除“渡过去”的悬空宾语，同时保留原文连续使用分词所呈现的进行性场景。末句仍以“沿着通往旷野的路前行”自然表达压缩的希伯来文路线短语；脚注保留其形式上的替代理解。
