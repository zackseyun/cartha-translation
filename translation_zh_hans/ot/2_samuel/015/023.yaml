  naturalness: “放声痛哭”“众人”“沿着通往旷野的路前行”均自然且适合庄重叙事语体。将首处“全境的人”改作“全地的人”可避免“全境”偏现代行政或边界用语的联想，并较贴近原文“全地”的集合性表达。
  terminology: “汲沦谷”是对נחל קדרון稳妥且现代的处理；脚注说明其亦可指旱谷、沟谷或季节性水道，避免把地形定死为常年溪流。“旷野”符合מִדְבָּר的常用圣经译法。
