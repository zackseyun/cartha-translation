base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/035.yaml
  text: Are not Zadok and Abiathar the priests there with you? And whatever matter you hear from the king’s house, you shall report to Zadok and Abiathar the priests.
translation:
  language: zh_hans
  text: 撒督和亚比亚他两位祭司不是和你在那里吗？你从王宫里听到的任何事情，都要告诉撒督和亚比亚他两位祭司。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַכֹּהֲנִים
  choice: 祭司
  rationale: 希伯来语为带定冠词的复数名词，指撒督和亚比亚他二人；汉语以“祭司”置于人名前自然表达其共同身份。
- source_word: כָּל הַדָּבָר
  choice: 任何事
  rationale: דָּבָר 可指“话、消息、事情”；此处与“听到”连用，范围较广，译作“任何事”保留其概括性，不限定为言语或情报。
- source_word: מִבֵּית הַמֶּלֶךְ
  choice: 从王宫里
  rationale: 字面为“从王的家/王室”；在此叙事语境中指王的居所及其内部，译作“王宫里”符合现代汉语表达。
- source_word: תַּגִּיד
  choice: 要告诉
  rationale: Hifil 未完成式在此承接安排或指令，表达应当转告、报告；“要告诉”自然且保留命令语气。
theological_decisions: []
translation_notes:
  register: 采用现代、清楚而庄重的叙事语言。首句保留希伯来语反问形式；末句重复“祭司”身份，呼应原文，而不因汉语简洁倾向将其删去。
