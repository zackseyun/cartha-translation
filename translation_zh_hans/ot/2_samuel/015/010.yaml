  terminology: “号角声”恰当对应קוֹל הַשֹּׁפָר；“作王了”可表达完成式的已开始王权宣告，而不添加登基仪式或合法性判断。应以“探子”对应מְרַגְּלִים，不宜用泛称“派人”替代。
