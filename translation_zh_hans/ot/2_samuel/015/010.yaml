base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/010.yaml
  text: Then Absalom sent spies throughout all the tribes of Israel, saying, “As soon as you hear the sound of the trumpet, then say, ‘Absalom has become king in Hebron.’”
translation:
  language: zh_hans
  text: 于是，押沙龙派探子到以色列各支派去，说：“你们一听见号角声，就要说：‘押沙龙在希伯仑作王了！’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מְרַגְּלִים
  choice: 暗中派人
  rationale: 该词通常指“探子”，但这里这些人的实际任务是秘密传递预先约定的信号和口号，而非侦察；译作“暗中派人”既保留隐秘性，也符合本节语境。
- source_word: כְּשָׁמְעֲכֶם
  choice: 你们一听见
  rationale: כְּ在此表达时间关系；“一……就……”自然传达听到号角后立即行动的含义。
- source_word: קוֹל הַשֹּׁפָר
  choice: 号角声
  rationale: שׁוֹפָר指用于发信号的角号；“号角”比现代乐器意义的“喇叭”更贴合古代背景。
- source_word: מָלַךְ
  choice: 作王了
  rationale: 完成式在口号中宣告押沙龙已经取得王位；“作王了”自然表达状态已经开始，同时不额外断定其王权是否合法。
- source_word: בְּחֶבְרוֹן
  choice: 在希伯仑
  rationale: 按原文保留地点短语与“作王”的连接，不将其扩展解释为加冕或从该城统治。
theological_decisions:
- issue: 押沙龙王权宣告的性质
  choice: 采用引语“押沙龙在希伯仑作王了”呈现其党羽要传播的宣告
  alternative: 译为“押沙龙在希伯仑登基了”或“押沙龙统治希伯仑”
  rationale: 原文只说מָלַךְ，不明确描述加冕仪式，也不是说其统治范围仅限希伯仑；本译文保留政治宣告本身，不暗示神学或法统上的认可。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“暗中派人”避免把这些人误解为执行侦察任务的军事探子；引语层次和命令语气清楚，适合公开诵读。
