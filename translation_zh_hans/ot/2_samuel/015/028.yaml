base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/028.yaml
  text: See[b][a], I will wait at the fords of the wilderness until word comes from you to inform me.
translation:
  language: zh_hans
  text: 看哪，我要在旷野的渡口[a]等候[b]，直到你们传来消息告诉我。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“旷野的渡越处”。
    reason: lexical_alternative
  - marker: b
    text: “等候”或译：“逗留”或“耽延”。
    reason: lexical_alternative
lexical_decisions:
- source_word: רְאוּ
  choice: 看哪
  rationale: 复数命令式在此用于唤起听者注意；“看哪”保留直接、郑重的语气，也符合现代中文圣经文体。
- source_word: אָנֹכִי
  choice: 我
  rationale: 独立人称代词带有强调，但中文以明确的主语自然表达即可，不另加“我本人”，以免语气过重。
- source_word: מִתְמַהְמֵהַּ
  choice: 要……等候
  rationale: 该词为 מהה 的 Hitpael 分词，表示逗留、耽延；在此是大卫留在原处等待消息，“等候”最合上下文。
- source_word: בְּעַבְרוֹת
  choice: 在……渡口
  rationale: עברות 为复数，指可供渡越之处，尤其是河流的浅滩或渡口；正文用“渡口”准确而自然，并以脚注保留“过渡处”的较宽译法。
- source_word: הַמִּדְבָּר
  choice: 旷野
  rationale: מִדְבָּר 指荒野、未开垦之地，不一定是沙漠；“旷野”是准确且通行的译法。
- source_word: עַד בּוֹא דָבָר
  choice: 直到有消息……传来
  rationale: דָבָר 在此指消息或报告；“有消息传来”比逐字译作“有话来到”更符合现代汉语。
- source_word: מֵעִמָּכֶם
  choice: 从你们那里
  rationale: 该介词结构表示消息源自受话者；“从你们那里”自然保留来源含义。
- source_word: לְהַגִּיד לִי
  choice: 告诉我
  rationale: נגד 的 Hiphil 不定式表示使人知道、报告；“告诉我”简洁自然，并与传递消息的语境相符。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“看哪”保留原文唤起注意的命令语气；语序略作汉语化处理，同时保留大卫等候祭司传讯的叙事关系。
