  text: וַ/יֹּ֣אמֶר דָּ֠וִד לְ/כָל עֲבָדָ֨י/ו אֲשֶׁר אִתּ֤/וֹ בִ/ירוּשָׁלִַ֨ם֙ ק֣וּמוּ וְ/נִבְרָ֔חָה כִּ֛י לֹא תִֽהְיֶה לָּ֥/נוּ פְלֵיטָ֖ה מִ/פְּנֵ֣י אַבְשָׁל֑וֹם מַהֲר֣וּ לָ/לֶ֗כֶת פֶּן יְמַהֵ֤ר וְ/הִשִּׂגָ֨/נוּ֙ וְ/הִדִּ֤יחַ עָלֵ֨י/נוּ֙ אֶת הָ֣/רָעָ֔ה וְ/הִכָּ֥ה הָ/עִ֖יר לְ/פִי חָֽרֶב־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/014.yaml
  text: Then David said to all his servants who were with him in Jerusalem[a], “Arise, and let us flee, for there will be no escape for us from Absalom. Hurry to depart[c][b], lest he quickly overtake us and bring disaster upon us and strike the city with the edge of the sword.”
translation:
  language: zh_hans
  text: 大卫对所有跟他同在耶路撒冷的臣仆说：“起来，我们逃走吧！因为我们无法逃脱押沙龙。赶快离开，免得他迅速追上我们，使灾祸临到我们，又用刀剑攻击这城[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“以刀剑的口击打这城”；“刀剑的口”是希伯来语惯用语，指以刀剑施行攻击或杀戮。
    reason: 保留“刀剑的口”这一原文意象，并说明其在战争语境中的含义；正文保留“这城”作为原文的直接宾语。
lexical_decisions:
- source_word: עֲבָדָיו
  choice: 他的臣仆
  rationale: עֶבֶד可指奴仆、臣仆或臣属；在王宫语境中，“臣仆”既符合身份，又不武断限定为奴隶。
- source_word: קוּמוּ וְנִבְרָחָה
  choice: 起来，我们逃走吧
  rationale: 祈使式加第一人称复数鼓励式，表达大卫催促众人一同逃离；“吧”自然保留共同劝促语气。
- source_word: פְלֵיטָה מִפְּנֵי אַבְשָׁלוֹם
  choice: 逃脱不了押沙龙的手
  rationale: פְלֵיטָה指逃脱或生还；מִפְּנֵי在这里表示躲避押沙龙所构成的威胁。补出“的手”是自然汉语的威胁表达，并未把“逃脱”解释为神学性的拯救。
- source_word: מַהֲרוּ לָלֶכֶת
  choice: 赶快离开
  rationale: 字面为“赶快去”，语境明确指立即离开耶路撒冷；“赶快离开”在现代汉语中自然且保留紧迫感。
- source_word: וְהִשִּׂגָנוּ
  choice: 追上我们
  rationale: נשׂג的使役式在追赶语境中表示赶上、追上。
- source_word: וְהִדִּיחַ עָלֵינוּ אֶת־הָרָעָה
  choice: 使灾祸临到我们
  rationale: רָעָה在此指灾难而非道德上的邪恶；整句表示押沙龙会使祸患落在他们身上。
- source_word: וְהִכָּה הָעִיר לְפִי־חָרֶב
  choice: 用刀剑击杀城中的人
  rationale: “击打城”结合“刀剑之口”是战争杀戮表达；汉语以“击杀城中的人”清楚传达城市居民遭刀剑杀害的含义，同时脚注保留原文意象。
theological_decisions:
- issue: רָעָה的性质
  choice: 灾祸
  alternative: 邪恶
  rationale: 此处谈的是押沙龙追上后造成的灾难性后果，不是在判定一种抽象或道德意义上的邪恶。
- issue: פְלֵיטָה是否带有神圣拯救含义
  choice: 逃脱
  alternative: 拯救
  rationale: 上下文是军事追击和撤离，原文在本节并未明说神施行拯救，因此不增添这一神学含义。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“臣仆”适合王室语境；大卫的话以短促命令和感叹号体现危急情势。正文只设一个脚注，且标记[a]已置于对应短语之后。
