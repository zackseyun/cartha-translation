revisions:
- from: 大卫对所有跟他同在耶路撒冷的臣仆说：“起来，我们逃走吧！不然，我们谁也逃脱不了押沙龙的手。赶快离开，免得他迅速追上我们，使灾祸临到我们，又用刀剑击杀城中的人[a]。”
  to: 大卫对所有跟他同在耶路撒冷的臣仆说：“起来，我们逃走吧！因为我们无法逃脱押沙龙。赶快离开，免得他迅速追上我们，使灾祸临到我们，又用刀剑攻击这城[a]。”
  rationale: 修订仅处理原文受事、因果关系和不必要增补：“这城”保留为攻击对象，不将其限定为“城中的人”；以“因为”呈现כִּי；删去“的手”以贴近原文。其余措辞保留原稿的现代、庄重和紧迫语气。
