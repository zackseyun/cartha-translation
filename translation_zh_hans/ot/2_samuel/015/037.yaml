  yaml_path: translation/ot/2_samuel/015/037.yaml
  text: So Hushai[a], David’s friend, came into the city, as Absalom was entering Jerusalem.
translation:
  language: zh_hans
  text: 于是，大卫的朋友户筛进了城；那时，押沙龙正进入耶路撒冷。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“于是，大卫的朋友户筛进了城；押沙龙进了耶路撒冷。”希伯来文连接词也可理解为简单的顺承关系，后一个动词也可按简单过去时翻译。
    reason: 保留连接词וְ及未完成式יָבֹא在叙事关系上的另一种合理理解。
lexical_decisions:
- source_word: וַיָּבֹא
  choice: 进了
  rationale: בוא可表示“来”或“进入”；与“城”连用时，译作“进了城”符合现代汉语，也准确表达移入城中的动作。
- source_word: חוּשַׁי
  choice: 户筛
  rationale: 采用现代中文圣经中通行的人名音译。
- source_word: רֵעֶה דָוִד
  choice: 大卫的朋友
  rationale: רֵעֶה表示朋友、伙伴或亲近的同伴；“朋友”直接自然，也不额外引入“谋士”等更具体的职分含义。
- source_word: הָעִיר
  choice: 城
  rationale: 原文使用带定冠词的普通名词“那城/城”，上下文虽指耶路撒冷，正文仍保留原文普通名词的表达。
- source_word: וְאַבְשָׁלֹם
  choice: 那时，押沙龙
  rationale: 连接词וְ本可直译为“而/并且”，但结合后面的未完成式，可自然理解为交代与户筛进城同时展开的背景动作；“那时”保留这种时间关联，同时以脚注注明顺承读法。
- source_word: יָבֹא
  choice: 正进入
  rationale: 此处是未完成式，而前句为wayyiqtol；译作“正进入”体现动作正在展开及其背景性，避免抹平两种动词形式的差别。
- source_word: יְרוּשָׁלִָם
  choice: 耶路撒冷
  rationale: 采用现代中文圣经中通行的地名译法。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“进了城”简洁呈现完成的动作；“那时……正进入”表达后半句可能具有的同步、背景性质。脚注明示顺承读法，以保留希伯来文的真实歧义。
