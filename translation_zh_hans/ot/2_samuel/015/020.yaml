  text: תְּמ֣וֹל בּוֹאֶ֗/ךָ וְ/הַ/יּ֞וֹם אנוע/ך עִמָּ֨/נוּ֙ לָ/לֶ֔כֶת וַ/אֲנִ֣י הוֹלֵ֔ךְ עַ֥ל אֲשֶׁר אֲנִ֖י הוֹלֵ֑ךְ שׁ֣וּב וְ/הָשֵׁ֧ב אֶת אַחֶ֛י/ךָ עִמָּ֖/ךְ חֶ֥סֶד וֶ/אֱמֶֽת׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/020.yaml
  text: You came only yesterday[a], and today should I make you wander with us, while I go wherever I can go? Return, and take your brothers back with you[c][b]. May steadfast love and faithfulness be with you.
translation:
  language: zh_hans
  text: 你昨天才来，今天我岂能叫你跟我们一同漂泊呢？我自己还不知道要往哪里去[a]。回去吧，带你的弟兄们[b]一起回去。愿慈爱与信实与你同在[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文重复“走”和“何处”的概念，直译近似“我正往我所往之处走”；这种含蓄的说法表现大卫逃亡时去向未定。
    reason: lexical_alternative
  - marker: b
    text: “弟兄们”可能指与以太同行的同族人或伙伴。
    reason: cultural_note
  - marker: c
    text: 原文只有“慈爱与信实”，没有明说动词；这里按上下文译作祝愿。
    reason: textual_ambiguity
lexical_decisions:
- source_word: תְּמוֹל בּוֹאֶךָ
  choice: 你昨天才来
  rationale: תְּמוֹל直指“昨天”，结合语境用“才”表达以太刚刚到来的意味；将带第二人称后缀的不定式结构自然转为汉语分句。
- source_word: אֲנוּעֲךָ עִמָּנוּ לָלֶכֶת
  choice: 叫你跟我们一同漂泊
  rationale: נוע在使役形式中表示使人辗转、漂泊；“漂泊”既保留逃亡中的动荡感，也符合现代汉语表达。
- source_word: וַאֲנִי הוֹלֵךְ עַל אֲשֶׁר אֲנִי הוֹלֵךְ
  choice: 我自己也是走到哪里算哪里
  rationale: 原文有意重复“走”，表达大卫去向未定；此译保留开放和不确定的语气，而不擅自指定目的地。
- source_word: שׁוּב וְהָשֵׁב
  choice: 回去吧，带……一起回去
  rationale: 第一个动词是返回的命令，第二个是使役形式，表示让或带别人返回；汉语用“带……一起回去”清楚体现使役关系。
- source_word: אַחֶיךָ
  choice: 你的弟兄们
  rationale: 按原文保留亲属称谓；语境中可泛指与以太同行的同族人或伙伴，脚注说明其所指。
- source_word: חֶסֶד וֶאֱמֶת
  choice: 慈爱与信实
  rationale: חֶסֶד含忠贞、恩慈之爱，אֱמֶת在此侧重可靠和信实；“慈爱与信实”自然、庄重，并保留这一固定词组的神学分量。
theological_decisions:
- issue: 句末“慈爱与信实”的无动词结构
  choice: 愿慈爱与信实与你同在
  alternative: 慈爱与信实
  rationale: 希伯来文没有明说动词，既可保留为简短名词结构，也可按语境理解为祝愿。大卫正在遣返并祝福以太，补出“愿……与你同在”最符合话语功能，同时以脚注交代原文的省略。
- issue: 大卫去向未定的表达
  choice: 走到哪里算哪里
  alternative: 我走我所走的路
  rationale: 原文重复而含混，不明确说明是“能去”还是“必须去”；所选译法传达逃亡中的不确定性，不将其解释为神命定或个人能力问题。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“岂能”体现反问但不过分文言；“漂泊”和“走到哪里算哪里”传达逃亡的不安定。保留“弟兄们”及“慈爱与信实”等源文关键用语，并用脚注说明可能所指和句法省略。
