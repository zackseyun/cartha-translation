  yaml_path: translation/ot/2_samuel/015/017.yaml
  text: The king went out[a], and all the people with him on foot, and they halted at the distant house.
translation:
  language: zh_hans
  text: 王出去，众民都跟随他；他们在那所远处的房子那里停住[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“最外边的一所房子”。也可能是地名“伯特·梅尔哈克”。希伯来语短语字面可理解为“远隔之处的房子”。
    reason: 保留该短语是描述性称呼、指城边最远的一所房子，还是地名的歧义。
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: 出去了
  rationale: 这是 יצא 的 Qal 叙事形式，表示出去或离开；“出去了”直接自然，也不额外补出原文未明说的地点。
- source_word: הַמֶּלֶךְ
  choice: 王
  rationale: 带定冠词的名词在上下文中指大卫；现代汉语叙事中译作“王”清楚自然。
- source_word: וְכָל הָעָם
  choice: 众民都
  rationale: עָם 指随王同行的一群人，含义不必限于军兵；“众民”保留其宽泛性。
- source_word: בְּרַגְלָיו
  choice: 跟随他徒步而行
  rationale: 字面为“在他的脚边／随他的脚步”，此处表示随行，并可能强调步行；该译法兼顾两层意思。
- source_word: וַיַּעַמְדוּ
  choice: 停了下来
  rationale: עמד 基本义为站立，在行进叙事中可表示停住；“停了下来”符合此处语境。
- source_word: בֵּית הַמֶּרְחָק
  choice: 远处的房子
  rationale: 该短语字面近于“远隔之处的房子”，确切所指不明；正文采用较少解释性的译法，并以脚注保留“最外边的一所房子”和地名两种理解。
