base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/008.yaml
  text: For your servant made a vow while I was dwelling in Geshur in Aram[a], saying, ‘If Yahweh indeed brings me back to Jerusalem[c][b], then I will serve Yahweh.’
translation:
  language: zh_hans
  text: 因为你的仆人在亚兰的基述居住时曾许愿[a]，说：‘雅威若果真使我回到耶路撒冷[b]，我就要事奉雅威[c]。’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译为“许了一个愿”；原文以同根词重复构成强调。
    reason: lexical_alternative
  - marker: b
    text: “果真使我回到”在原文中重复“返回／使返回”这一词根，用来加强语气。
    reason: lexical_alternative
  - marker: c
    text: 或译：“敬拜雅威。”这里的“事奉”可以指以敬拜来服事神。
    reason: lexical_alternative
lexical_decisions:
- source_word: נֵדֶר נָדַר
  choice: 曾许愿
  rationale: 希伯来语以同根名词和动词连用，直译为“许了一个愿”。现代汉语用“许愿”即可自然表达，并以“曾”配合叙事中的既往情境；其形式上的强调在脚注中说明。
- source_word: עַבְדְּךָ
  choice: 仆人
  rationale: 这是臣下对君王说话时谦恭的自称。“仆人”保留宫廷语境中的敬辞色彩，不将此处重点误导为对奴隶身份的界定。
- source_word: בְּשִׁבְתִּי
  choice: 住……时
  rationale: 该介词加不定词结构表示许愿发生的时间，也含有一段时间内居住的意味；“住……时”简洁自然。
- source_word: בִגְשׁוּר בַּאֲרָם
  choice: 在亚兰的基述
  rationale: 按原文将基述置于亚兰这一地理范围内，不进一步限定两者的政治关系。
- source_word: אִם ישיב יְשִׁיבֵנִי
  choice: 若果真使我回到
  rationale: 原文重复使用“返回／使返回”词根以加强语气。“若果真使我回到”既保留条件句，也体现强调意味。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译呈现四字神名，而不以“主”这一称号代替专名。
- source_word: וְעָבַדְתִּי אֶת יְהוָה
  choice: 我就要事奉雅威
  rationale: עבד以神为宾语时可指服事，也可涵盖敬拜。“事奉”保留较宽的含义；“就”自然标明条件句的结果。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用神的专名。译作“雅威”较直接地传达该名，避免以称号“主”取代；“耶和华”虽为传统汉译，但其读音来源较为间接。
- issue: עבד 在对神使用时的语义范围
  choice: 事奉
  alternative: 敬拜
  rationale: 此词可指对神的敬拜性服事，但原文并未把意义限缩为礼仪性的敬拜，因此正文保留较宽的“事奉”，并在脚注列出另一译法。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“仆人”保留押沙龙对君王说话时的谦恭自称；引语中从第三人称自称自然转为“我”。脚注依正文出现顺序排列，并保留原文在强调结构及“事奉／敬拜”之间的语义张力。
