  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר הַ/מֶּ֨לֶךְ֙ לְ/צָד֔וֹק הָשֵׁ֛ב אֶת אֲר֥וֹן הָ/אֱלֹהִ֖ים הָ/עִ֑יר אִם אֶמְצָ֥א חֵן֙ בְּ/עֵינֵ֣י יְהוָ֔ה וֶ/הֱשִׁבַ֕/נִי וְ/הִרְאַ֥/נִי אֹת֖/וֹ וְ/אֶת נָוֵֽ/הוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/025.yaml
  text: Then the king said to Zadok[a], “Return the ark of God to the city. If I find favor in the eyes of Yahweh, he will bring me back and let me see it and its dwelling place.”
translation:
  language: zh_hans
  text: 王对撒督说：“把上帝的约柜送回城里去。我若在耶和华眼中蒙恩，他必使我回来，让我看见约柜和它的居所[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“让我看见他和他的居所。”希伯来语也可作这种更以上帝为中心的理解，不过最近的先行词是“上帝的约柜”。
    reason: 保留 אֹתוֹ 和 נָוֵהוּ 所指对象的歧义。
lexical_decisions:
- source_word: הָשֵׁב
  choice: 送回
  rationale: 这是使役意义的命令式，吩咐撒督把约柜带回城中；“送回”在现代汉语中自然，也清楚表达返回原处的意思。
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: 上帝的约柜
  rationale: 原文明确使用 אֱלֹהִים（上帝），并非神名 יהוה，因此不作协调性改写。
- source_word: הָעִיר
  choice: 城里
  rationale: 原文定冠词表明是特指的城；上下文所指为耶路撒冷，但本节只说“城”，译文保留这一表达。
- source_word: אִם אֶמְצָא חֵן בְּעֵינֵי יְהוָה
  choice: 我若在耶和华眼中蒙恩
  rationale: 保留“在……眼中蒙恩”这一希伯来语惯用表达及其关系性意味，同时使用自然、庄重的现代汉语。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代简体中文圣经语境中通行的专名形式呈现四字神名，而不以一般称号替代。
- source_word: וֶהֱשִׁבַנִי
  choice: 他必使我回来
  rationale: 使役形动词带第一人称宾语后缀，意为使大卫返回；此处不擅自补出“耶路撒冷”。
- source_word: וְהִרְאַנִי
  choice: 让我看见
  rationale: 使役形字面为“使我看见”；“让我看见”符合现代汉语，也保留由上帝施行或准许的意味。
- source_word: אֹתוֹ
  choice: 约柜
  rationale: 最近且最自然的先行词是阳性名词“约柜”；汉语为避免代词指向不明而复指“约柜”。
- source_word: נָוֵהוּ
  choice: 它的居所
  rationale: נָוֶה 可指居所、住处；“居所”保留庄重语体，且不提前具体化为当时尚不存在的圣殿。
theological_decisions:
- issue: “它和它的居所”所指为何
  choice: 正文按最近先行词理解为约柜及约柜的居所。
  alternative: 也可按更以上帝为中心的方式理解为“他和他的居所”。
  rationale: אֹתוֹ 的最近先行词是“上帝的约柜”，因此正文采用约柜为所指；但约柜象征上帝的临在，而阳性代词及所属后缀容许更以上帝为中心的理解，故以脚注保留这一真实歧义。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“城”不扩译为“耶路撒冷”；“居所”不具体化为“圣殿”。脚注标记置于产生歧义的末语之后。
