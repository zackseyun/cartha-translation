base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/018.yaml
  text: And all his servants were passing by at his side[a], and all the Cherethites, and all the Pelethites, and all the Gittites—six hundred men who had come on foot with him from Gath—were passing on before the king.
translation:
  language: zh_hans
  text: 大卫的臣仆都从他身旁走过；所有基利提人、比利提人，以及所有迦特人，就是那跟随他从迦特来的六百人[a]，也都从王面前走过。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“随他从迦特步行而来的六百人”。希伯来文直译为“随他的脚从迦特来的”，可指跟随某人同行或在其队伍中，也可能强调步行。
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲבָדָיו
  choice: 大卫的臣仆
  rationale: עֶבֶד 在王室语境中可指仆人、随从或臣属。“臣仆”既保留服事与隶属关系，也不把他们限定为某一种官职；明说“大卫”可避免汉语中代词指向含混。
- source_word: עֹבְרִים עַל יָדוֹ
  choice: 从他身旁走过
  rationale: עַל־יָד 表示“在……旁边、身旁”；结合 עֹבְרִים，译为“从他身旁走过”自然地呈现队伍经过大卫身边的场景。
- source_word: הַכְּרֵתִי
  choice: 基利提人
  rationale: 这是大卫麾下一个群体的专名，采用中文圣经传统中通行的音译，不作带解释性的意译。
- source_word: הַפְּלֵתִי
  choice: 比利提人
  rationale: 与“基利提人”并列，为群体专名，采用通行音译。
- source_word: הַגִּתִּים
  choice: 迦特人
  rationale: 该词指来自迦特的人；译为“迦特人”比音译族称更便于现代汉语读者直接理解，并与后文“从迦特来”呼应。
- source_word: שֵׁשׁ מֵאוֹת אִישׁ
  choice: 六百人
  rationale: אִישׁ 在人数统计中为计数用语。“六百人”准确简洁；不增译“士兵”，以免加入原文未明说的身份。
- source_word: אֲשֶׁר בָּאוּ בְרַגְלוֹ מִגַּת
  choice: 那跟随他从迦特来的六百人[a]
  rationale: בְרַגְלוֹ 字面涉及“他的脚”，在此可表示随某人同行、跟在其队伍中，也可能突出步行。“跟随他……来”最符合上下文，同时用脚注保留较具体的“随他步行而来”这一可能。
- source_word: עֹבְרִים עַל פְּנֵי הַמֶּלֶךְ
  choice: 从王面前走过
  rationale: עַל־פְּנֵי 在空间上表示“在……面前、前方”；此处译法保留游行队伍经过王面前的画面。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而清楚的叙事体。“臣仆”适合王室场景；“基利提人、比利提人”沿用通行专名，“迦特人”则透明表达其来源。分号与插入说明帮助读者辨明各队伍及六百人的修饰关系。
