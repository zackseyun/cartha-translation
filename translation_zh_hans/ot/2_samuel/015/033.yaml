  text: 大卫对他说[a]：“你若随我过去，就会成为我的负担。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “随我过去”也可译为“与我一同越过”。希伯来语动词可指“越过”或“过去”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר ... דָּוִד
  choice: 大卫……说
  rationale: 叙事性连续式推动情节；现代汉语不必另加“于是”或“又”，语序按汉语习惯处理。
- source_word: לוֹ
  choice: 对他说
  rationale: 希伯来文明确使用第三人称单数代词，本节并未直呼户筛之名，因此正文保留代词。
- source_word: אִם
  choice: 若
  rationale: 直接表达条件关系，简洁而庄重；“如果”也可，但“若”更适合本段叙事语体。
- source_word: עָבַרְתָּ אִתִּי
  choice: 跟我一同过去
  rationale: עבר可指“经过、过去、越过”；结合大卫继续撤离的语境，此译既保留移动含义，也自然表达随行。
- source_word: וְהָיִתָ עָלַי לְמַשָּׂא
  choice: 就会成为我的负担
  rationale: היה与על及לְמַשָּׂא连用，表示此人会给大卫造成负担；按现代汉语自然重组。
