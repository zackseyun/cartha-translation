    rationale: וְהִנֵּה与名词短语在上下文中引入撒督一行的出现；中文仅说“还有撒督”显得句法悬置。译为“撒督也来了”是审慎的语境性补足，也与英文审校文本的“Zadok also came”相符。
  - severity: medium
    issue: “直到所有百姓都从城里过去”不够自然，且“从城里过去”可能被理解为穿过城内。
    rationale: לַעֲבוֹר מִן־הָעִיר表达百姓从该城离开而越过的动作。译为“从城中渡过去为止”保留“从城中”与“过去”的运动含义，中文也更通顺。
  revised_text: 看哪，撒督也来了；所有跟随他的利未人抬着上帝之约柜。他们把上帝的约柜放下[b]；亚比亚他上去了[c]，直到所有百姓都从城中渡过去为止[a]。
