  rationale: 本次修订仅处理两处影响中文完整性与清晰度的问题：按叙事上下文将撒督的出现译为“也来了”，并将“从城里过去”改为更自然、仍保留原文移动意义的“从城中渡过去为止”。脚注标记均紧邻对应词句，且保留原文关于安放动作和“上去”具体叙事意义的不确定性。
