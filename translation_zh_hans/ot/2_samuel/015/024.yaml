  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/הִנֵּ֨ה גַם צָד֜וֹק וְ/כָֽל הַ/לְוִיִּ֣ם אִתּ֗/וֹ נֹֽשְׂאִים֙ אֶת אֲרוֹן֙ בְּרִ֣ית הָ/אֱלֹהִ֔ים וַ/יַּצִּ֨קוּ֙ אֶת אֲר֣וֹן הָ/אֱלֹהִ֔ים וַ/יַּ֖עַל אֶבְיָתָ֑ר עַד תֹּ֥ם כָּל הָ/עָ֖ם לַ/עֲב֥וֹר מִן הָ/עִֽיר־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/024.yaml
  text: And look[a], Zadok also came, and all the Levites with him, carrying the ark of the covenant of God. And they set down the ark of God[c][b], and Abiathar went up until all the people had finished crossing over from the city.
translation:
  language: zh_hans
  text: 看哪，撒督也来了；所有跟随他的利未人抬着上帝之约柜。他们把上帝的约柜放下[b]；亚比亚他上去了[c]，直到所有百姓都从城中渡过去为止[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “城”指耶路撒冷。
    reason: cross_reference
  - marker: b
    text: 或译：“他们安放了上帝的约柜。”这里的希伯来语动词可指把约柜放下，也可指将它安置在那里。
    reason: lexical_alternative
  - marker: c
    text: 或译：“亚比亚他上来了。”希伯来语直译为“上去”，这里确切的叙事含义并不明确。
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 作为叙事中的注意提示语，引出眼前的新场景；“看哪”庄重而简洁，也保留了希伯来语的鲜明语篇功能。
- source_word: גַם צָדוֹק
  choice: 还有撒督
  rationale: 原文没有明确表达“来”的动词，因此用“还有撒督”保留省略结构，并自然表达 גַם 的附加意义。
- source_word: כָל הַלְוִיִּם אִתּוֹ
  choice: 跟他一起的所有利未人
  rationale: “他”在上下文中自然指撒督；此译法清楚呈现整个名词短语。
- source_word: נֹשְׂאִים
  choice: 抬着
  rationale: 分词描述利未人当时的动作；约柜由多人搬运，用“抬着”比泛泛的“带着”更具体自然。
- source_word: אֲרוֹן בְּרִית הָאֱלֹהִים
  choice: 上帝的约柜
  rationale: 这是现代汉语中准确而通行的表达，既保留“上帝”与“约”的关系，也避免生硬地直译整个属格链。
- source_word: וַיַּצִּקוּ
  choice: 他们把……放下
  rationale: 按本句语境理解为将约柜放下或安放；正文采用最符合叙事情境的“放下”，另以脚注保留“安放”的可能。
- source_word: וַיַּעַל אֶבְיָתָר
  choice: 亚比亚他上去了
  rationale: עלה 的基本意义是向上移动；保留“上去”，不把不明确的叙事细节解释成献祭等祭司活动。
- source_word: עַד תֹּם כָּל הָעָם לַעֲבוֹר
  choice: 直到所有百姓都……过去
  rationale: 将希伯来语的完成界限结构自然转成汉语时间从句，同时保留 עָבַר 的移动意义。
- source_word: מִן הָעִיר
  choice: 从城里
  rationale: 原文只说“从那城”，未直接写出耶路撒冷；中文正文不替原文补明城名。
theological_decisions:
- issue: “城”的具体所指
  choice: 正文译作“城”，脚注说明指耶路撒冷
  alternative: 正文直接译作“耶路撒冷”
  rationale: 上下文清楚指耶路撒冷，但原文使用普通名词“城”；正文保留原文措辞，脚注提供语境所指。
- issue: וַיַּעַל אֶבְיָתָר 的叙事含义
  choice: 译作“亚比亚他上去了”
  alternative: “亚比亚他上来”或解释为“亚比亚他献祭”
  rationale: 希伯来语最直接表达向上移动，方向视角和具体动作在此并不完全明确；因此不在正文中作超出文本的神学或礼仪解释。
- issue: וַיַּצִּקוּ 的动作含义
  choice: 正文译作“放下”
  alternative: “安放”
  rationale: 语境显示众人过城期间约柜被置于某处，但动词可侧重放下或安置；正文选择自然叙事表达，并在脚注保留另一可能。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“看哪”保留经文的注意提示功能；“跟他一起”“抬着”“放下”等表达自然清楚。正文中的每个脚注标记均紧接其所说明的词句，顺序虽依落点为 [b]、[c]、[a]，但与所给脚注编号一致。
