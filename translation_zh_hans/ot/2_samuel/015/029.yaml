  text: So Zadok and Abiathar returned the ark of God to Jerusalem, and they stayed there.
translation:
  language: zh_hans
  text: 于是，撒督和亚比亚他把上帝的约柜带回耶路撒冷，并留在那里。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשֶׁב
  choice: 送回
  rationale: 该词是שׁוּב的使役形式，以“上帝的约柜”为宾语，表示使约柜返回；“送回”在现代汉语中自然，并保留其及物、使役含义。
- source_word: צָדוֹק
  choice: 撒督
  rationale: 按现代中文圣经人名的通行译法音译。
- source_word: וְאֶבְיָתָר
  choice: 和亚比亚他
  rationale: 保留连接词，并按现代中文圣经人名的通行译法音译。
- source_word: אֶת אֲרוֹן הָאֱלֹהִים
  choice: 上帝的约柜
  rationale: 原文直译为“上帝的柜”；“约柜”是该器物在现代中文中的通行名称，同时不扩写为原文未出现的“上帝的盟约之柜”。
- source_word: יְרוּשָׁלָם
  choice: 耶路撒冷
  rationale: 采用通行中文地名译法；方向意义已由动词“送回”自然表达。
- source_word: וַיֵּשְׁבוּ שָׁם
  choice: 并留在那里
  rationale: יָשַׁב可表示坐、居住或停留；在本叙事语境中，“留在那里”自然表达二人继续待在耶路撒冷。
