  text: Then David said to Ittai, “Go on and cross over.” So Ittai the Gittite crossed over, along with all his men and all the little ones who were with him.
translation:
  language: zh_hans
  text: 大卫对以太说：“去吧，渡过去。”于是迦特人以太、他的众随从和所有跟他在一起的孩子都渡过去了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֵךְ וַעֲבֹר
  choice: 去吧，过去吧
  rationale: 保留两个连续的祈使动词；“过去”不补出原文未明说的河流或地点，同时以自然汉语表达大卫准许并催促以太继续前行。
- source_word: אֲנָשָׁיו
  choice: 他的所有部下
  rationale: 此处指跟随以太同行的人；按叙事语境译作“部下”比泛称“男人”更自然，也与以太作为带队者的身份相符。
- source_word: הַטַּף
  choice: 所有孩子
  rationale: 该词通常指幼小的孩子或随行的幼小家属；译作“孩子”保留年龄层面的基本含义，不擅自扩大为所有家眷。
- source_word: הַגִּתִּי
  choice: 迦特人
  rationale: 表示来自迦特的人，采用现代中文圣经地名的通行表达。
