base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/019.yaml
  text: Then the king said to Ittai the Gittite[a], “Why are you also going with us? Return and stay with the king[c][b], for you are a foreigner and also an exile from your own place.”
translation:
  language: zh_hans
  text: 王对迦特人以太说：“你为什么也要跟我们一起走呢？[a]你回去，留在王那里吧；[b]因为你是外族人，也是离乡流亡的人。[c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你为什么也要跟我们一起去呢？”
    reason: 未完成式及运动动词在此可按说话者视角译作“要去”，也可按同行视角译作“一起走”。
  - marker: b
    text: “王”可能指留在耶路撒冷掌权的王；希伯来文没有明确说所指是谁。
    reason: 保留 עִם הַמֶּלֶךְ 中人物指涉的含混，不在正文中指定为押沙龙或其他对象。
  - marker: c
    text: 希伯来文的措辞很简略，直译近似“你也是一个流亡者，向着你自己的地方”；也可能强调以太从本乡流亡而来，以及他与本乡的联系。
    reason: 说明 לִמְקוֹמֶךָ 的方向性和语义关系存在解释空间。
lexical_decisions:
- source_word: וַיֹּאמֶר הַמֶּלֶךְ
  choice: 王……说
  rationale: 以自然的汉语叙事句式承接上下文；保留原文的称号“王”，不直接改为“大卫”。
- source_word: אִתַּי הַגִּתִּי
  choice: 迦特人以太
  rationale: 人名按通行形式音译为“以太”，族属词译为“迦特人”，表明他来自迦特。
- source_word: לָמָּה תֵלֵךְ גַּם אַתָּה אִתָּנוּ
  choice: 你为什么也要跟我们一起走呢？
  rationale: 将未完成式按语境译作即将采取的行动；“也”对应 גַּם，问句保持直接而自然。
- source_word: שׁוּב וְשֵׁב
  choice: 你回去，留在
  rationale: 两个命令式分别译出；ישׁב 在此表示停留、居住，而非字面的“坐”。
- source_word: עִם הַמֶּלֶךְ
  choice: 在王那里
  rationale: 保留“王”这一称号，不在正文中断定所指是谁；汉语用“在……那里”自然表达留在某人一方或其管辖之下。
- source_word: נָכְרִי
  choice: 外族人
  rationale: 表达不属于本地、本族共同体的身份，比“陌生人”更准确，也较符合古代叙事语境。
- source_word: וְגַם גֹּלֶה אַתָּה לִמְקוֹמֶךָ
  choice: 也是离乡流亡的人
  rationale: גֹּלֶה 表示流亡、迁离者；末语措辞压缩，正文以自然汉语表达其离开本乡、处于流亡中的身份，同时以脚注保留方向关系上的歧义。
theological_decisions:
- issue: “留在王那里”中“王”的所指
  choice: 正文保留“王”，不明确指认
  alternative: 译作“留在押沙龙王那里”“留在耶路撒冷的王那里”或“留在我这里”
  rationale: 希伯来文只重复称号“王”，没有明说所指；不替原文消除叙事上的含混。
- issue: גֹּלֶה ... לִמְקוֹמֶךָ 的方向和关系
  choice: 正文译为“离乡流亡的人”，脚注说明压缩措辞
  alternative: “流亡到你自己的地方的人”或“从你自己的地方流亡来的人”
  rationale: 原文介词 לְ 通常有“向、到”之意，但整句关系不寻常且高度压缩；正文避免生硬断定，脚注保存可能读法。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。问句用“跟我们一起走”自然呈现同行语境；命令句简洁。正文不擅自确定“王”的所指，也不把末句压缩的希伯来语解释得过死。
