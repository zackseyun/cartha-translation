  text: וַ/יַּ֨עַשׂ אַבְשָׁל֜וֹם כַּ/דָּבָ֤ר הַ/זֶּה֙ לְ/כָל יִשְׂרָאֵ֔ל אֲשֶׁר יָבֹ֥אוּ לַ/מִּשְׁפָּ֖ט אֶל הַ/מֶּ֑לֶךְ וַ/יְגַנֵּב֙ אַבְשָׁל֔וֹם אֶת לֵ֖ב אַנְשֵׁ֥י יִשְׂרָאֵֽל־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/006.yaml
  text: Absalom did this to all Israel who came to the king for judgment[a], and Absalom stole the hearts of the men of Israel.
translation:
  language: zh_hans
  text: 押沙龙这样对待所有前来向王求审判的以色列人。押沙龙就这样偷走了以色列众人的心。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “偷走了……的心”也可意译为“暗中赢得了……的拥护”。希伯来文直译为“偷了……的心”，形象地表示押沙龙用隐秘或操纵的手段取得人的忠诚。
    reason: 说明希伯来语习语的字面形象及其语境含义，同时保留可供理解的意译。
lexical_decisions:
- source_word: וַיַּעַשׂ אַבְשָׁלוֹם כַּדָּבָר הַזֶּה
  choice: 押沙龙这样对待
  rationale: 这句话回指上文所述押沙龙一再采取的做法。“这样对待”既自然地表达其对来者所做之事，也保留了希伯来语“照这事而行”的回指功能。
- source_word: לְכָל יִשְׂרָאֵל
  choice: 所有……以色列人
  rationale: לְ 表示行动所针对的对象；结合后面的关系从句，译为“所有……以色列人”符合现代汉语表达。
- source_word: אֲשֶׁר יָבֹאוּ
  choice: 前来……的
  rationale: 未完成式在过去叙事中表示惯常、反复发生的行动；“前来……的”自然传达这类经常性情形。
- source_word: לַמִּשְׁפָּט
  choice: 求审判
  rationale: מִשְׁפָּט 在此指司法裁断或案件审理。“求审判”简洁地保留法律语境，也避免将其宽泛化为一般的“公义”。
- source_word: אֶל הַמֶּלֶךְ
  choice: 向王
  rationale: 原文表示来到王那里寻求司法裁断；“向王求审判”在汉语中自然，并保留王作为审判权威的角色。
- source_word: וַיְגַנֵּב
  choice: 偷走了
  rationale: גנב 的基本义是“偷窃”。与“心”连用时，表达以隐秘或操纵手段取得忠诚；直译“偷走”保留原文鲜明而带负面色彩的隐喻。
- source_word: אֶת לֵב
  choice: ……众人的心
  rationale: 原文“心”为单数集合用法。汉语“众人的心”同样可以集合性地指许多人的内心、拥护和忠诚，无须机械改为复数。
- source_word: אַנְשֵׁי יִשְׂרָאֵל
  choice: 以色列众人
  rationale: אַנְשֵׁי 字面可指“以色列的男人们”，在此也可能代表前文“全以色列”中来求审判的民众。“以色列众人”保留群体所指，避免现代汉语“以色列男人”可能造成仅限成年男性的过度限定。
theological_decisions:
- issue: אַנְשֵׁי יִשְׂרָאֵל 的性别与群体范围
  choice: 以色列众人
  alternative: 以色列的男人们
  rationale: 该阳性复数表达可具体指男子，也可按希伯来语常见用法代表群体成员；紧接前文“所有……以色列人”的语境更支持群体性理解。译文保留这种范围上的开放性，不断言妇女必然包括或排除。
- issue: “偷走……的心”所表达的忠诚转移
  choice: 正文保留“偷走了……的心”
  alternative: 赢得了……的心
  rationale: “赢得”容易消除原文 גנב 所含的隐秘、不正当或操纵意味。保留偷窃隐喻，让叙事本身对押沙龙行为的负面刻画继续发挥作用，同时用脚注说明其习语意义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“求审判”保持司法语境；“偷走了……的心”刻意保留原文修辞力度，并以脚注澄清其指向拥护与忠诚。
