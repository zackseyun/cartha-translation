base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/003.yaml
  text: Then Absalom said to him[a], “Look, your claims are good and right[b], but there is no one from the king to hear you.”
translation:
  language: zh_hans
  text: 押沙龙对他说：“你看，你的案子是好的，也是正当的[a]；可是王那里没有人来听审你的案子[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “案子”所译的希伯来语也可指“话”“事情”或“案件”。这里的上下文是有人前来求王裁断。
    reason: lexical_alternative
  - marker: b
    text: 直译：“却没有从王那里来的听审者给你。”意思是没有代表王来听取案件的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלָיו אַבְשָׁלוֹם
  choice: 押沙龙对他说
  rationale: 未完成式连续结构推进叙事；现代汉语无须逐字译出连接词，也能自然表达事件的先后。“对他说”准确保留代词宾语。
- source_word: רְאֵה
  choice: 你看
  rationale: 该命令式在这里用于引起对方注意。“你看”是自然、通行的现代汉语说法。
- source_word: דְבָרֶךָ
  choice: 你的案情
  rationale: דָּבָר可指话、事情或案件；上下文是百姓前来求王裁断，因此采用具有司法语境而又易懂的“案情”，同时以脚注保留词义范围。
- source_word: טוֹבִים וּנְכֹחִים
  choice: 合情合理
  rationale: 两个形容词分别表达良好与正直、正确；“合情合理”自然地传达押沙龙对案件正当性的肯定，又没有过度界定其法律效力。
- source_word: וְשֹׁמֵעַ אֵין לְךָ מֵאֵת הַמֶּלֶךְ
  choice: 可是王那里没有人来听审你的案子
  rationale: “听审”在现代汉语中简洁体现司法性的“听取案件”。“王那里”保留מֵאֵת所表达的来源或代表关系，而不武断指定某种官职；补出“你的案子”使汉语语意完整。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“合情合理”便于普通读者理解，并对应原文两个并列形容词；“听审”保留司法场景。“王那里”刻意不具体化为“王所任命的官员”，以保存原文在来源、授权或代表关系上的表达空间。
