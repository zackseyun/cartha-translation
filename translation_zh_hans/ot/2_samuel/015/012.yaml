revisions:
- from: 押沙龙派人去召基罗人亚希多弗[a]，就是大卫的谋士，从他的城基罗前来；那时，押沙龙正在献祭。叛乱的势力日益强大[b]，归附押沙龙的人也越来越多[c]。
  to: 押沙龙献祭的时候，派人从大卫的谋士、基罗人亚希多弗自己的城基罗，把他召来[a]。密谋日益得势[b]，拥护押沙龙的人不断增多[c]。
  rationale: 修订首句语序，明确亚希多弗是被从其城基罗召来的人，并使“献祭”的主语押沙龙清楚无误。将“叛乱的势力”调整为“密谋日益得势”，避免超出原文词义范围的具体化；末句保留支持阵营的自然汉语表达，并在脚注中准确交代原文的惯用结构。
