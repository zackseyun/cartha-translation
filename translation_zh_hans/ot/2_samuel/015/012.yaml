base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/012.yaml
  text: And Absalom sent for Ahithophel the Gilonite[a], David’s counselor, from his city, from Giloh, while he was offering the sacrifices. And the conspiracy grew strong[c][b], and the people kept increasing with Absalom.
translation:
  language: zh_hans
  text: 押沙龙献祭的时候，派人从大卫的谋士、基罗人亚希多弗自己的城基罗，把他召来[a]。密谋日益得势[b]，拥护押沙龙的人不断增多[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“押沙龙派亚希多弗去”；希伯来语动词可作较直译的理解，但按上下文，更可能是押沙龙派人召他来参与这场密谋。
    reason: lexical_alternative
  - marker: b
    text: 或译：“密谋日益强大。”
    reason: lexical_alternative
  - marker: c
    text: 直译：“百姓不断地增多，与押沙龙同在。”这是表示支持押沙龙的人持续增加的惯用说法。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: 派人去召
  rationale: 该动词以人为直接宾语，结合押沙龙招揽支持者的语境，表示派人召来；此译既保留“派遣”的形式，也清楚表达召见之意。
- source_word: הַגִּלֹנִי
  choice: 基罗人
  rationale: 这是由地名基罗构成的居民称谓；“基罗人”是现代汉语中自然、简洁的表达。
- source_word: יוֹעֵץ דָּוִד
  choice: 大卫的谋士
  rationale: 该结构说明亚希多弗与大卫的职务关系；“谋士”适合王室政治顾问的语境。
- source_word: מֵעִירוֹ מִגִּלֹה
  choice: 从他的城基罗前来
  rationale: 保留“他的城”和地名“基罗”两项信息，并用同位关系组成自然汉语。
- source_word: בְּזָבְחוֹ אֶת־הַזְּבָחִים
  choice: 那时，押沙龙正在献祭
  rationale: 介词加不定式结构表示同时发生的动作；补明主语押沙龙，避免汉语代词误指亚希多弗。
- source_word: הַקֶּשֶׁר
  choice: 叛乱
  rationale: 本词可指密谋、结党或反叛；在押沙龙公开夺权的叙事中，“叛乱”自然地涵盖政治阴谋及其行动。
- source_word: אַמִּץ
  choice: 势力日益强大
  rationale: 与וַיְהִי连用表示局势发展为强盛；“日益强大”体现叙事中的渐进变化。
- source_word: הוֹלֵךְ וָרָב
  choice: 越来越多
  rationale: 该组合表达持续增长；“越来越多”准确传达其延续和递增意味。
- source_word: הָעָם
  choice: 人
  rationale: 这里指不断加入押沙龙一方的群体；与“归附”搭配后译为“人”比孤立的“百姓”更清楚。
- source_word: אֶת אַבְשָׁלוֹם
  choice: 归附押沙龙
  rationale: 此处אֶת表达与押沙龙同在、站在他一方；“归附”在汉语中自然呈现政治上的支持，同时脚注保留较直译的可能。
