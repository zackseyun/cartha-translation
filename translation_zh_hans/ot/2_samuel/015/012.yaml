  - severity: low
    issue: “叛乱的势力日益强大”较原文增添“势力”，并将“密谋/结党”定性为叛乱。
    rationale: הַקֶּשֶׁר首先指密谋、结党或阴谋；虽然处于夺权语境，译作“密谋日益得势”能保留原词范围及叙事发展。
  - severity: low
    issue: 脚注c的“与押沙龙同在的百姓”未反映“不断增多”的直译结构。
    rationale: 原文的惯用结构字面上包含“百姓不断地增多，与押沙龙在一起”；脚注应说明这一结构，再解释其支持意义。
