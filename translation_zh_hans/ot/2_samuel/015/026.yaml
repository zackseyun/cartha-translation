source:
  edition: WLC
  text: וְ/אִם֙ כֹּ֣ה יֹאמַ֔ר לֹ֥א חָפַ֖צְתִּי בָּ֑/ךְ הִנְ/נִ֕י יַֽעֲשֶׂה לִּ֕/י כַּ/אֲשֶׁ֥ר ט֖וֹב בְּ/עֵינָֽי/ו־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/026.yaml
  text: But if he says[a], ‘I take no pleasure in you,’ here I am[b]; let him do to me as seems good in his eyes.
translation:
  language: zh_hans
  text: 但如果他说[a]：“我不喜悦你”，我在这里；愿他按他看为好的方式待我[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我不以你为乐。”
    reason: lexical_alternative
  - marker: b
    text: 直译：“愿他照他眼中看为好的方式待我。”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: 但如果
  rationale: 承接上一节所说的另一种可能，并引出与之相对的条件，译为“但如果”既保留转折，也保留条件意味。
- source_word: כֹּה יֹאמַר
  choice: 他说
  rationale: כֹּה 与“说”连用，用来引出后面的直接引语；现代汉语无须另译“如此”。未完成式在假设条件中自然译为“他说”。
- source_word: לֹא חָפַצְתִּי בָּךְ
  choice: 我不喜悦你
  rationale: חפץ 表示喜悦、以某人为乐；“不喜悦你”保留关系性和评价意味，也避免“不要你”可能带来的过度意译。
- source_word: הִנְנִי
  choice: 我在这里
  rationale: 这是表示自我呈现、听凭处置或愿意顺服的惯用语；“我在这里”保留其简洁和庄重。
- source_word: יַעֲשֶׂה לִּי
  choice: 愿他……待我
  rationale: 此处未完成式带祈愿或许可意味，表达大卫甘愿接受神的处置；“愿他……待我”比单纯陈述未来更准确。
- source_word: כַּאֲשֶׁר טוֹב בְּעֵינָיו
  choice: 照自己看为好的
  rationale: 原文直译为“照他眼中看为好的”，是指照他认为合宜或好的；正文采用自然汉语，同时以脚注保留希伯来语意象。
theological_decisions:
- issue: 第三人称单数代词所指
  choice: 保留“他／自己”，由上下文指向耶和华
  alternative: 在正文中明确改写为“耶和华”或“神”
  rationale: 希伯来文在本节没有重述神名，只使用第三人称形式。保留代词既忠于原文，也不加入源文没有的明说；上下文足以表明所指。
- issue: 大卫话语中顺服的语气
  choice: 用“愿他……待我”表达甘愿接受处置
  alternative: 译作陈述性的“他会……待我”或许可性的“让他……待我吧”
  rationale: יַעֲשֶׂה 在此语境具有祈愿或许可色彩。“愿他”保留顺服语气，但不额外断定大卫的内在动机或建立教义性结论。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“我在这里”保留希伯来语自我呈现的惯用表达；“照自己看为好的”兼顾自然度与原文意象。所有神性指称均按现代简体中文常规书写，不以特殊大写或增补神名来解释代词。
