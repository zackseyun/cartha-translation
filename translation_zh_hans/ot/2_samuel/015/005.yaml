base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/005.yaml
  text: And whenever a man came near to bow down to him[a], he would reach out his hand, take hold of him, and kiss him.
translation:
  language: zh_hans
  text: 每逢有人上前向他俯伏[a]，押沙龙就伸手拉住他，亲吻他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“向他行礼”。希伯来语这个动词可指以俯伏表示尊敬，不一定是狭义的宗教敬拜。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: 每逢……就
  rationale: 这里的叙事结构表示惯常、反复发生的动作；用“每逢……就”自然地传达这一含义。
- source_word: בִּקְרָב אִישׁ
  choice: 有人走近
  rationale: קרב表示接近；אִישׁ在此泛指前来的人，现代汉语用“有人”比直译为“一个男人”更自然，且不改变所指。
- source_word: לְהִשְׁתַּחֲוֺת לוֹ
  choice: 向他俯伏
  rationale: 该词表示俯身或伏地以示敬意；“俯伏”保留身体动作，也不把它限定为狭义的宗教敬拜。
- source_word: וְשָׁלַח אֶת יָדוֹ
  choice: 伸手
  rationale: 这是伸出手的惯用表达；汉语“伸手”简洁自然。
- source_word: וְהֶחֱזִיק לוֹ
  choice: 拉住他
  rationale: 使役词形在此指抓住或握住前来者；结合押沙龙阻止对方俯伏并亲吻他的场景，“拉住他”自然且避免“抓住”可能带来的强制意味。
- source_word: וְנָשַׁק לוֹ
  choice: 亲吻他
  rationale: 直接保留“亲吻”的动作，不在正文中额外解释其社交或政治含义。
theological_decisions:
- issue: השתחוה所表达的是敬拜还是尊敬礼仪
  choice: 正文译作“俯伏”，脚注说明可作“向他行礼”
  alternative: 敬拜他
  rationale: 在君王与臣民的社会语境中，该动词可表示以俯伏表达尊敬，不必然指狭义的宗教敬拜；译文保留这一语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“每逢……就”呈现反复发生的动作；正文明确补出上一节语境中的主语“押沙龙”，避免现代汉语中代词指向含混。
