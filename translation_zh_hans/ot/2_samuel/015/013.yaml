translation:
  language: zh_hans
  text: 一个报信的人来到大卫那里，说：“以色列人的心已归向押沙龙。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译：“以色列人的心已在押沙龙之后。”这是表示追随、拥护或效忠的说法。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: 来见
  rationale: 该叙事性动词承接事件进展；结合介词 אֶל 与宾语“大卫”，译作“来见”符合现代汉语叙事习惯。
- source_word: הַמַּגִּיד
  choice: 有报信的人
  rationale: 该词是 נגד 的使役主动分词，指带来消息或报告的人。希伯来文虽带定冠词，现代汉语首次引入此人物时用“有报信的人”更自然，也避免“使者”可能暗示正式奉差。
- source_word: לֵאמֹר
  choice: 说
  rationale: 这是引出直接引语的标准结构，汉语以“说”自然表达。
- source_word: הָיָה לֶב
  choice: 心都归向……了
  rationale: “心”在此表示意向、忠诚或拥护；הָיָה 带出已经形成的局势，句末“了”传达状态转变或现状确立。
- source_word: אִישׁ יִשְׂרָאֵל
  choice: 以色列人
  rationale: 单数形式 אִישׁ 在这里具有集合意义。“以色列人”既自然，又能涵盖这一政治群体；其具体是否偏指成年男子，可由上下文判断。
- source_word: אַחֲרֵי
  choice: 归向
  rationale: 字面义为“在……之后”，在“心……在某人之后”的习语中表示追随或效忠。“归向”保留方向性，并清楚表达政治拥护。
- source_word: אַבְשָׁלוֹם
  choice: 押沙龙
  rationale: 采用现代中文圣经传统中通行的人名译法。
