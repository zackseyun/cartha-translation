  text: The king’s servants said to the king[a], “Whatever my lord the king chooses, here are your servants.”
translation:
  language: zh_hans
  text: 王的臣仆对王说：“我主我王无论选择什么，看哪，你的臣仆都在这里。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: 说
  rationale: 这是叙事中引出直接引语的常用表达；译作“说”简洁自然。
- source_word: עַבְדֵי הַמֶּלֶךְ
  choice: 王的臣仆
  rationale: עבד 可指奴仆、臣仆或属员；在王宫语境中，“臣仆”既体现臣属身份，也不额外强调奴隶性质。
- source_word: כְּכֹל אֲשֶׁר יִבְחַר
  choice: 无论……选择怎么做
  rationale: 原文直译近于“照着……所选择的一切”；此译自然表达臣仆愿意遵从王所选任何行动方案的意思，同时保留“选择”的词义。
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: 我主我王
  rationale: 保留宫廷称谓的敬意及“主”与“王”两个称号；现代中文虽较庄重，但在此处自然合宜。
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留 הִנֵּה 的提示和呈现功能，突出臣仆当下在场、可供差遣；比直接增译“听候差遣”更贴近原文。
- source_word: עֲבָדֶיךָ
  choice: 你的臣仆
  rationale: 与前面的“王的臣仆”保持同一词根的呼应，并符合臣下对王自称的语境。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的宫廷叙事语体。“臣仆”体现王室属员身份；“我主我王”和“看哪”保留原文正式、恭敬且带提示性的语气。
