base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/030.yaml
  text: And David was going up the ascent of the Mount of Olives[a], going up and weeping, with his head covered, and he was walking barefoot. And all the people who were with him each covered his head, and they went up[c][b], weeping as they went.
translation:
  language: zh_hans
  text: 大卫正沿着通往橄榄山的上坡路上去；他一路往上，一路哭泣[a]，蒙着头，赤着脚行走。与他同行的众人也各自蒙着头[b]；他们一路往上，一路哭泣[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文重复“上去”，着重表现大卫一面不断上行，一面哭泣。
    reason: lexical_alternative
  - marker: b
    text: 或译：“众人也都各人蒙着自己的头。”希伯来文用单数形式表达逐一分配的意思。
    reason: lexical_alternative
  - marker: c
    text: 希伯来文直译近于：“他们上去，不断上去并哭泣。”这种重复加强了动作持续而鲜明的效果。
    reason: lexical_alternative
lexical_decisions:
- source_word: מַעֲלֵה הַזֵּיתִים
  choice: 橄榄山的上坡
  rationale: מַעֲלֵה指上行的坡道或路径；הַזֵּיתִים在这里是已确立的地名“橄榄山”。译文既保留地形含义，也采用现代汉语通行地名。
- source_word: עֹלֶה ... עֹלֶה וּבוֹכֶה
  choice: 往上走；他一路往上，一路哭泣
  rationale: 重复表达正在持续的动作，营造鲜明的行进场景。汉语以“往上”及“一路……一路……”保留重复和持续感，又避免生硬直译。
- source_word: בֹּכֶה
  choice: 哭泣
  rationale: 表达实际流泪哀哭，不额外引入礼仪性“哀悼”的含义；“哭泣”庄重而通俗。
- source_word: וְרֹאשׁ לוֹ חָפוּי
  choice: 蒙着头
  rationale: 保留חָפוּי所表达的头被遮盖之状态，不擅自说明所用物品或具体包裹方式。
- source_word: יָחֵף
  choice: 赤着脚
  rationale: 现代汉语自然、明确地表达未穿鞋的状态。
- source_word: כָּל הָעָם אֲשֶׁר אִתּוֹ
  choice: 跟随他的众人
  rationale: הָעָם在此泛指与大卫同行的一群人；“众人”不把他们限定为军队。
- source_word: חָפוּ אִישׁ רֹאשׁוֹ
  choice: 也各自蒙着头
  rationale: אִישׁ在此为分配用法，“各自”准确传达每个人都如此，并符合自然汉语。
- source_word: וְעָלוּ עָלֹה וּבָכֹה
  choice: 他们一路往上，一路哭泣
  rationale: 限定动词配合不定绝对式强化并延展动作；“一路……一路……”在现代汉语中保留上行与哭泣持续并行的画面感。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。以“蒙着头”“赤着脚”保留哀伤姿态而不添加解释；用“一路……一路……”自然再现希伯来文的重复、持续性和场景张力。
