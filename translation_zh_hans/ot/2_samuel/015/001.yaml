base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/001.yaml
  text: After this[a], Absalom made for himself a chariot and horses[b], and fifty men running before him.
translation:
  language: zh_hans
  text: 这事以后，押沙龙为自己置备了[a]一辆车、马匹，以及五十名在他前面奔跑的人[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “置备”也可译作“制作”或“为自己预备”。这里的希伯来动词可指制作，也可指取得、备办。
    reason: lexical_alternative
  - marker: b
    text: 五十人在他前面奔跑，是古代君王或显贵出行时所用的排场；这里暗示押沙龙公开抬高自己的地位。
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי מֵאַחֲרֵי כֵן
  choice: 这事以后
  rationale: 自然表达希伯来叙事中的时间衔接，同时保留与上文的联系。
- source_word: וַיַּעַשׂ לוֹ
  choice: 为自己置备了
  rationale: עָשָׂה 与 לוֹ 连用，在这里可指为自己制作、取得或备办；“置备”既符合车马的语境，也保留为自己安排这些排场的反身意味。
- source_word: אַבְשָׁלוֹם
  choice: 押沙龙
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: מֶרְכָּבָה וְסֻסִים
  choice: 车和马匹
  rationale: 按原文直译其基本所指，不在正文中增添“王家”“御用”等政治解释；“马匹”自然表达复数。
- source_word: וַחֲמִשִּׁים אִישׁ רָצִים לְפָנָיו
  choice: 又有五十人在他前面奔跑
  rationale: 保留分词所呈现的动态画面，并自然表达这些人在押沙龙前方行进。
theological_decisions:
- issue: 押沙龙车马与随从的政治象征
  choice: 正文仅叙述车马和五十名奔跑者，不明说其僭越或王者排场。
  alternative: 译作“摆出王者的仪仗”或“设立王家式的队伍”。
  rationale: 原文借具体行动暗示押沙龙的自我抬举和政治野心，却没有直接作出解释；译文应保留这种含蓄张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“车和马匹”贴近原文，避免把政治含义直接写入正文；相关文化含义放在脚注说明。
