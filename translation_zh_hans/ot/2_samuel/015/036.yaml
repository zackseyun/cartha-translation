revisions:
- from: 看，他们的两个儿子也在那里和他们在一起：撒督的儿子亚希玛斯和亚比亚他的儿子约拿单。你们听到的一切消息，都要托他们带给我[a]。
  to: 看，他们的两个儿子同他们在那里：撒督的儿子亚希玛斯和亚比亚他的儿子约拿单。你们听到的一切消息，都要托他们带给我[a]。
  rationale: 修订首句语序，保留“在那里”和“同他们”两个希伯来语定位成分，删除原文未明示且在汉语中非必需的“也”，并避免重复。脚注改为准确说明“借他们的手”所对应的媒介性表达。其余译文忠实、自然，予以保留。
