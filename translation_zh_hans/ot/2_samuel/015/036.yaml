base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/036.yaml
  text: 'Look[a], their two sons are there with them: Ahimaaz for Zadok, and Jonathan for Abiathar[b]. You shall send to me by their hand every matter that you hear.'
translation:
  language: zh_hans
  text: 看，他们的两个儿子同他们在那里：撒督的儿子亚希玛斯和亚比亚他的儿子约拿单。你们听到的一切消息，都要托他们带给我[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “托他们”直译为“借他们的手”，是表示经由他们传递的惯用说法。
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: 看
  rationale: 这是引起注意的提示语；“看”保留其指示和强调作用，也符合现代汉语表达。
- source_word: שָׁם עִמָּם
  choice: 也在那里和他们在一起
  rationale: 同时表达“在那里”和“与他们同在”两层意思；“也”承接上文祭司留在城中的语境。
- source_word: שְׁנֵי בְנֵיהֶם
  choice: 他们的两个儿子
  rationale: 直译所属关系，所指是前文撒督和亚比亚他的两个儿子。
- source_word: אֲחִימַעַץ לְצָדוֹק וִיהוֹנָתָן לְאֶבְיָתָר
  choice: 撒督的儿子亚希玛斯和亚比亚他的儿子约拿单
  rationale: 此处介词לְ在上下文中表示归属或亲子关系。明确补出“儿子”，比生硬保留“归撒督的亚希玛斯”更符合自然汉语。
- source_word: וּשְׁלַחְתֶּם
  choice: 都要……带给我
  rationale: 在指示语境中表达命令或要求；“要”自然传达其指令语气。
- source_word: בְּיָדָם
  choice: 托他们带给我
  rationale: 字面为“借他们的手”，是表示媒介或代理的惯用语；汉语用“托他们带给我”自然表达信息由二人传递。
- source_word: כָּל דָּבָר
  choice: 一切消息
  rationale: דָּבָר可指话、事情或消息；这里涉及情报传递，“消息”最贴合语境，同时“一切”保留范围的完整性。
- source_word: אֲשֶׁר תִּשְׁמָעוּ
  choice: 你们听到的
  rationale: 保留שׁמע“听见”的基本义，不扩展为较具解释性的“获悉”。
