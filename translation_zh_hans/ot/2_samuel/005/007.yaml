base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/007.yaml
  text: But David captured the stronghold of Zion[a], that is, the City of David.
translation:
  language: zh_hans
  text: 可是，大卫攻取了锡安的堡垒[a]，就是大卫城。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“锡安的要塞”。希伯来语这个词指设防坚固之处。
    reason: 词义备选
lexical_decisions:
- source_word: וַיִּלְכֹּד
  choice: 攻取了
  rationale: לכד在军事语境中指攻占或夺取一处地方；“攻取了”既准确表达武力占领，也符合现代汉语叙事习惯。
- source_word: וַ
  choice: 可是
  rationale: 这里的叙事连接词承接上文耶布斯人的自信嘲讽，并形成轻微转折；“可是”自然显出“大卫仍然攻取了”的对比意味。
- source_word: מְצֻדַת
  choice: 堡垒
  rationale: 该词指设防坚固之处；“堡垒”保留军事含义，又不对具体建筑形态作过度限定。
- source_word: צִיּוֹן
  choice: 锡安
  rationale: 按现代中文圣经传统音译这一地名。
- source_word: הִיא
  choice: 就是
  rationale: 独立代词在此起同位解释作用，把“锡安的堡垒”认同为下文的“大卫城”；“就是”在现代汉语中简洁自然。
- source_word: עִיר דָּוִד
  choice: 大卫城
  rationale: 这是具有专名性质的地点称谓；“大卫城”既保留原文属格关系，也符合通行中文用法。
