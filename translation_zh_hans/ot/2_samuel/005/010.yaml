  text: וַ/יֵּ֥לֶךְ דָּוִ֖ד הָל֣וֹךְ וְ/גָד֑וֹל וַ/יהוָ֛ה אֱלֹהֵ֥י צְבָא֖וֹת עִמּֽ/וֹ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/010.yaml
  text: And David went on[a], growing greater, and Yahweh, the God of hosts, was with him.
translation:
  language: zh_hans
  text: 大卫日渐强盛[a]，雅威——万军的上帝——与他同在。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“越来越强盛。”希伯来语在这里用限定动词配合不定式绝对形，强调持续不断的增长。
    reason: 说明原文习语的持续、加强意味，并保留一种更显明的译法。
lexical_decisions:
- source_word: וַיֵּלֶךְ דָּוִד הָלוֹךְ וְגָדוֹל
  choice: 大卫日渐强盛
  rationale: 希伯来语以限定动词 וַיֵּלֶךְ 配合不定式绝对形 הָלוֹךְ，并接 וְגָדוֹל，构成表示持续进展的习语。‘日渐强盛’自然、简洁地传达不断增长的意味；脚注保留更显式的译法。
- source_word: דָּוִד
  choice: 大卫
  rationale: 采用现代汉语圣经传统中通行的人名译法。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来语四字神名直接音译，以区别于‘主’这一称号。
- source_word: אֱלֹהֵי צְבָאוֹת
  choice: 万军之上帝
  rationale: צְבָאוֹת 可指众军或众天军；‘万军’保留其宽广含义，不限定为地上的军队或天上的军队。‘上帝’对应 אֱלֹהֵי。
- source_word: עִמּוֹ
  choice: 与他同在
  rationale: 直接表达神的临在和伴随，并保留希伯来语第三人称代词。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文使用神的专名而非普通称号，因此正文采用音译‘雅威’，既保留专名性质，也不以‘主’取代原文。
- issue: 称号 אֱלֹהֵי צְבָאוֹת 中 צְבָאוֹת 的范围
  choice: 万军之上帝
  alternative: 众军的上帝；天军之上帝
  rationale: 原词本身未明确把‘军’限定为地上或天上；‘万军’保留这一语义广度，避免过度解释。
- issue: הָלוֹךְ וְגָדוֹל 的持续和加强意味
  choice: 日渐强盛
  alternative: 越来越强盛
  rationale: 正文用自然现代汉语呈现持续增长；脚注给出更显式的替代译法，并说明希伯来语结构。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。破折号标出‘万军之上帝’是对‘雅威’的同位说明；避免使用较古雅的‘日见强大’或可能偏重军事力量的‘日益壮大’。
