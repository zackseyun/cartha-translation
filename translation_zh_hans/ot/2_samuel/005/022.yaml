  yaml_path: translation/ot/2_samuel/005/022.yaml
  text: And the Philistines came up again and spread out in the Valley of Rephaim[a].
translation:
  language: zh_hans
  text: 非利士人又上来，散布在利乏音谷[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “散布”也可译作“列阵”或“展开袭击”。希伯来语动词在这里可能是说非利士军队在谷中展开并占据阵地。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּסִפוּ עוֹד ... לַעֲלוֹת
  choice: 又上来
  rationale: יסף与עוֹד及不定式连用，表示重复先前的行动；“又上来”自然保留了עלה所表达的上行或进军含义。
- source_word: פְּלִשְׁתִּים
  choice: 非利士人
  rationale: 采用现代中文圣经及历史叙事中通行的族名译法。
- source_word: וַיִּנָּטְשׁוּ
  choice: 散布
  rationale: 本处语境是军队在谷地展开、占据位置；“散布”既简洁自然，也保留该动词具体军事动作上的一定含混性。
- source_word: בְּעֵמֶק רְפָאִים
  choice: 在利乏音谷
  rationale: עֵמֶק指谷地，רְפָאִים在此为地名；采用音译“利乏音”，并按现代汉语地名习惯组成“利乏音谷”。
theological_decisions: []
