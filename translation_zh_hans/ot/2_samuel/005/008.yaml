  to: 大卫在那一天说：“凡攻打耶布斯人、到达水道[a]，又攻打大卫心里所恨恶的瘸腿者和瞎眼者[c]的。”因此人们说：“瞎眼者和瘸腿者不可进入这房屋[b]。”
  rationale: 修订仅解决汉语中不成立的“凡……的，以及……”结构，并使“大卫心里所恨恶的”在语法上明确修饰紧邻的“瘸腿者和瞎眼者”。“又攻打”是为呈现原文中并列受事而作的最小汉语补足，并不把“到达”改成命令或添加攻城路线的细节。保留了引语前半句的不完整、紧缩形态；脚注 c 明确保留另一种重要解读。脚注锚点亦已移至所释短语之后。
