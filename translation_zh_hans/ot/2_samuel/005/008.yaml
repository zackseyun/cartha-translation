  text: וַ/יֹּ֨אמֶר דָּוִ֜ד בַּ/יּ֣וֹם הַ/ה֗וּא כָּל מַכֵּ֤ה יְבֻסִי֙ וְ/יִגַּ֣ע בַּ/צִּנּ֔וֹר וְ/אֶת הַ/פִּסְחִים֙ וְ/אֶת הַ֣/עִוְרִ֔ים שנאו נֶ֣פֶשׁ דָּוִ֑ד עַל כֵּן֙ יֹֽאמְר֔וּ עִוֵּ֣ר וּ/פִסֵּ֔חַ לֹ֥א יָב֖וֹא אֶל הַ/בָּֽיִת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/008.yaml
  text: And David said on that day[a], “Whoever strikes the Jebusites and reaches the water shaft, and the lame and the blind, whom David’s soul hates.” Therefore they say[c][b], “The blind and the lame shall not come into the house.”
translation:
  language: zh_hans
  text: 大卫在那一天说：“凡攻打耶布斯人、到达水道[a]，又攻打大卫心里所恨恶的瘸腿者和瞎眼者[c]的。”因此人们说：“瞎眼者和瘸腿者不可进入这房屋[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “水道”也可译作“水渠”“竖井”或“隧道”。希伯来语这个词大概指某种供水设施，但确切所指不明。
    reason: lexical_alternative
  - marker: b
    text: “房屋”在这里也可能指王宫。
    reason: lexical_alternative
  - marker: c
    text: 本节前半句的希伯来语句法很难确定。有人把“瘸腿者和瞎眼者”理解为上一节耶布斯人嘲语的一部分，而不是大卫挑战话语中的直接宾语。
    reason: alternative_reading
lexical_decisions:
- source_word: כָּל מַכֵּה יְבֻסִי
  choice: 凡攻打耶布斯人的
  rationale: כָּל与分词构成不定指的挑战用语；“耶布斯人”虽为单数族称，语义上可作集合称谓。
- source_word: וְיִגַּע בַּצִּנּוֹר
  choice: 到达水道
  rationale: נגע可表示“触及、到达”；在攻城语境中译作“到达”自然，又不额外加入“击打”的含义。צִנּוֹר所指不确定，大概与供水设施有关，正文采用较宽泛的“水道”。
- source_word: וְאֶת הַפִּסְחִים וְאֶת הַעִוְרִים
  choice: 以及瘸腿的和瞎眼的
  rationale: 保留希伯来文本中的宾语标记所提示的并列结构，也保留整句突兀、压缩的句法，不擅自补足其隐含动作。
- source_word: שנאו נֶפֶשׁ דָּוִד
  choice: 他们是大卫心里所恨恶的
  rationale: 原文直译近于“大卫的性命/心魂恨恶”；现代汉语用“心里所恨恶”保留强烈的内在厌恶，同时避免生硬的“灵魂恨恶”。
- source_word: עַל כֵּן יֹאמְרוּ
  choice: 因此人们说
  rationale: 动词第三人称复数的主语未明，汉语用泛指的“人们”表达，并保留其引出俗语的功能。
- source_word: עִוֵּר וּפִסֵּחַ לֹא יָבוֹא אֶל הַבָּיִת
  choice: 瞎眼的和瘸腿的不可进这房子
  rationale: 原文单数形式具有类别性的泛指意义，汉语可自然理解为一类人；“房子”保留בַּיִת的宽泛含义，不直接限定为王宫。
theological_decisions:
- issue: “瘸腿的和瞎眼的”与大卫恨恶之间的关系
  choice: 保留马所拉文本表面的困难措辞，将其置于大卫所恨恶的对象中，但以破折号显示句法压缩。
  alternative: 把“瘸腿的和瞎眼的”理解为上一节耶布斯人的嘲语，或补写为攻击对象、守城者等。
  rationale: 希伯来语句法艰涩，释义传统分歧显著；翻译不应借顺译消除文本张力，也不应据此扩展为关于残障者的一般教义。
- issue: “不可进这房子”的范围
  choice: 保留为该叙事所解释的一句俗语，不将其明确解释为圣殿禁令。
  alternative: 译成“不可进入王宫”或理解为普遍的宗教禁入规定。
  rationale: בַּיִת在语境中可能指宫殿，但原文并未明说；保留“房子”可避免加入经文本身没有指定的制度或神学含义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“恨恶”保留原文力度；“水道”配脚注说明不确定性。正文刻意保留前半句不完整而突兀的结构，以反映希伯来文本的真实困难。所有脚注标记均置于正文中，并按正文出现顺序排列。
