  text: גַּם אֶתְמ֣וֹל גַּם שִׁלְשׁ֗וֹם בִּ/הְי֨וֹת שָׁא֥וּל מֶ֨לֶךְ֙ עָלֵ֔י/נוּ אַתָּ֗ה הייתה מוציא ו/ה/מבי אֶת יִשְׂרָאֵ֑ל וַ/יֹּ֨אמֶר יְהוָ֜ה לְ/ךָ֗ אַתָּ֨ה תִרְעֶ֤ה אֶת עַמִּ/י֙ אֶת יִשְׂרָאֵ֔ל וְ/אַתָּ֛ה תִּהְיֶ֥ה לְ/נָגִ֖יד עַל יִשְׂרָאֵֽל־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/002.yaml
  text: Also previously[a], when Saul was king over us, you were the one who led Israel out and brought them in. And Yahweh said to you, ‘You shall shepherd my people Israel[c][b], and you shall be ruler over Israel.’
translation:
  language: zh_hans
  text: 从前[a]，扫罗作我们的王的时候，是你率领以色列人出征、归回[b]。雅威曾对你说：‘你要牧养我的子民以色列，作以色列的领袖[c]。’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“昨天和前天”，是表示“从前”或“早已有一段时间”的习语。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“把以色列带出去，又带进来”，是指率领百姓处理事务，尤其是带领他们出征和归回的希伯来习语。
    reason: lexical_alternative
  - marker: c
    text: “领袖”也可译作“统治者”或“首领”；原文所用的词不同于通常表示“王”的词。
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם אֶתְמוֹל גַּם שִׁלְשׁוֹם
  choice: 从前
  rationale: 该短语字面为“昨天和前天”，在这里是表示过去一段时间的习语。“从前”简明自然，也保留了与当前情形相对的时间含义。
- source_word: בִּהְיוֹת שָׁאוּל מֶלֶךְ עָלֵינוּ
  choice: 扫罗作我们王的时候
  rationale: 介词 בְּ 加不定式结构构成时间从句；此译法准确、自然。
- source_word: אַתָּה
  choice: 就是你
  rationale: 独立人称代词带有强调作用；“就是你”在现代汉语中自然地凸显大卫。
- source_word: מוציא וְהַמֵּבִיא אֶת יִשְׂרָאֵל
  choice: 率领以色列出入
  rationale: 保留“带出、带入”的希伯来意象，同时用“率领”表明这里说的是大卫领导百姓，尤其可指带领他们出征和归回。
- source_word: תִרְעֶה
  choice: 牧养
  rationale: 原文以牧人照管羊群比喻君王治理上帝的百姓；“牧养”保留了这一王权隐喻及其神学意味。
- source_word: עַמִּי אֶת יִשְׂרָאֵל
  choice: 我的子民以色列
  rationale: 忠实保留原文的归属关系和“以色列”作为同位说明的结构。
- source_word: נָגִיד
  choice: 领袖
  rationale: 该词指受任命的领导者或统治者，不是通常表示“王”的词。“领袖”清楚自然，也避免抹去这一区别。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”按较通行的学术重构音译，明确把它作为专名呈现，而不是以“主”替代。
- issue: תִרְעֶה 的王权隐喻
  choice: 你要牧养我的子民以色列
  alternative: 你要治理我的子民以色列
  rationale: 保留原文“牧养”的意象，不把受上帝委任的王权扁平化为一般行政管理。
- issue: נָגִיד 与“王”的区别
  choice: 领袖
  alternative: 统治者
  rationale: 本节虽处在大卫受膏作王的语境中，却特意没有使用通常的“王”字；译为“领袖”保留这种词汇张力。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“率领以色列出入”保留原文意象，并由脚注解释；“牧养”保留王权的牧人隐喻；标点和引语格式符合现代简体中文习惯。
