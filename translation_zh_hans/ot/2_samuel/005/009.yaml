  yaml_path: translation/ot/2_samuel/005/009.yaml
  text: So David lived in the stronghold and called it the City of David[a]. And David built all around from the Millo inward.
translation:
  language: zh_hans
  text: 大卫住在堡垒里，称它为“大卫城”。他又从米罗[a]向内，在四周建造。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “米罗”的确切所指不明，可能是耶路撒冷一处建筑、填筑体或台地。末句也可译作“从米罗及其内侧建造”或“从米罗朝内部建造”。
    reason: 原词可能是专名或建筑术语，且介词短语与方向词的具体关系存在歧义。
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: 住在
  rationale: ישׁב在此表示居住、驻居；“住在”自然准确，不额外强调最初定居的动作。
- source_word: בַּמְּצֻדָה
  choice: 在堡垒里
  rationale: מְצֻדָה指设防的坚固据点；“堡垒”保留军事防御含义，也符合现代汉语表达。
- source_word: וַיִּקְרָא לָהּ
  choice: 称它为
  rationale: קרא + ל在这里表示命名或称呼；“称它为”贴近原文结构。
- source_word: עִיר דָּוִד
  choice: 大卫城
  rationale: 这是专名式地名，汉语通常译作“大卫城”。
- source_word: וַיִּבֶן
  choice: 建造
  rationale: בנה的基本义是建造；原文未明确说是加固或重建，因此不作具体化。
- source_word: סָבִיב
  choice: 在四周
  rationale: סביב表示环绕的范围；“在四周建造”以自然汉语保留这一空间含义。
- source_word: מִן הַמִּלּוֹא
  choice: 从米罗
  rationale: מִלּוֹא的确切所指有争议，可能是耶路撒冷一处已知建筑、填筑体或台地；正文音译可避免武断解释。
- source_word: וָבָיְתָה
  choice: 向内
  rationale: 该形式带方向性，语境中很可能指朝内部；“向内”保留空间方向而不限定具体建筑布局。
