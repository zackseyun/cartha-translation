  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יֵּ֣דַע דָּוִ֔ד כִּֽי הֱכִינ֧/וֹ יְהוָ֛ה לְ/מֶ֖לֶךְ עַל יִשְׂרָאֵ֑ל וְ/כִי֙ נִשֵּׂ֣א מַמְלַכְתּ֔/וֹ בַּ/עֲב֖וּר עַמּ֥/וֹ יִשְׂרָאֵֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/012.yaml
  text: And David knew that Yahweh had established him as king over Israel[a], and that he had exalted his kingdom for the sake of his people Israel.
translation:
  language: zh_hans
  text: 大卫就知道，雅威已经确立他作以色列的王，并且为了他的子民以色列[a]，使他的国得以高升。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他的子民”也可理解为“大卫的百姓以色列”，即把“他的”看作指大卫，而不是雅威。
    reason: 保留希伯来语代词所指的歧义。
lexical_decisions:
- source_word: וַיֵּדַע
  choice: 就知道
  rationale: ידע表示知道或认识到；“就知道”直接保留叙事推进，不额外强调心理顿悟。
- source_word: הֱכִינוֹ
  choice: 已经确立他
  rationale: כון的使役形在王权语境中表示使之稳固、确立；“确立”兼顾任命与巩固王位的含义。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，保留其专名性质，而不以称号替代。
- source_word: לְמֶלֶךְ עַל יִשְׂרָאֵל
  choice: 作以色列的王
  rationale: לְ标明身份或职分，עַל表示治理对象；此译符合自然汉语，也清楚表达王权范围。
- source_word: נִשֵּׂא
  choice: 使……兴盛
  rationale: נשׂא在此表示抬高、提升。汉语“使他的国兴盛”自然表达王国被提升、壮大的结果，同时避免生硬的“高举王国”。
- source_word: מַמְלַכְתּוֹ
  choice: 他的国
  rationale: ממלכה可指王国、王权或统治；“他的国”简洁保留范围上的开放性，语境中通常指大卫的王国。
- source_word: בַּעֲבוּר
  choice: 为了
  rationale: 此处表达目的或受益者，“为了”准确传达王权被提升是为以色列的益处。
- source_word: עַמּוֹ יִשְׂרָאֵל
  choice: 他的子民以色列
  rationale: 按希伯来语次序保留代词歧义；正文中最自然理解为雅威的子民，并以脚注说明也可能指大卫的百姓。
theological_decisions:
- issue: עַמּוֹ（“他的子民”）中代词的所指
  choice: 正文让“他的”自然指向雅威，即“雅威的子民以色列”。
  alternative: “他的”也可能指大卫，即“为了大卫的百姓以色列”。
  rationale: 上下文以雅威为施行动作的主体：他确立大卫，也使大卫的国兴盛；而“雅威的子民”也是常见的圣经表达。不过，希伯来语阳性单数后缀在语法上可以回指大卫，因此用脚注保留这一真实歧义。
- issue: מַמְלַכְתּוֹ（“他的国”）中代词的所指
  choice: 理解为大卫的国。
  alternative: 形式上可尝试联系雅威的王权，但在本句王权语境中较不自然。
  rationale: 前文刚说大卫被确立为王，故“他的国”最自然承接大卫的王国；雅威则是使这国兴盛的主体。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“确立他作……的王”保留王位被建立并稳固的含义；“使他的国兴盛”避免直译“高举他的国”所造成的生硬感。正文保留“他的”这一代词形式，并以脚注交代其所指歧义。
