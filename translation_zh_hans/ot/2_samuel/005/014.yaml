translation:
  language: zh_hans
  text: 以下是在耶路撒冷为他所生者[a]的名字：沙母亚、朔罢、拿单和所罗门。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“在耶路撒冷为他所生的儿女”。希伯来语分词直译是“被生下的那些人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: 以下是
  rationale: 该连接词与指示词共同引出名单；“以下是”自然保留了希伯来文的呈示作用，不必机械译出句首的“和”。
- source_word: שְׁמוֹת
  choice: 名字
  rationale: 该词是“名”的复数构造形，用来引出随后列举的姓名。
- source_word: הַיִּלֹּדִים
  choice: 生下的人
  rationale: 这是动词 ילד 的被动分词复数，直指“被生下的那些人”。译作“人”避免仅凭词形增添“儿子”，同时由所列姓名和上下文表明具体所指。
- source_word: לוֹ
  choice: 给他
  rationale: 介词短语在此表示亲子关系；现代汉语用“给他生下”可自然表达“为他所生”。
- source_word: בִּירוּשָׁלִָם
  choice: 在耶路撒冷
  rationale: 按其地点含义直译，说明出生地点。
- source_word: שַׁמּוּעַ
  choice: 沙母亚
  rationale: 按现代中文圣经人名的常见音译形式处理。
- source_word: שׁוֹבָב
  choice: 朔罢
  rationale: 按现代中文圣经人名的常见音译形式处理。
- source_word: נָתָן
  choice: 拿单
  rationale: 采用现代中文圣经中通行的人名译法。
- source_word: שְׁלֹמֹה
  choice: 所罗门
  rationale: 采用现代中文圣经中通行的人名译法。
