  source_fidelity: 译文整体准确传达了大卫向雅威求问、不可按原路上去、绕到敌后并在特定树木对面发动行动的命令。惟“桑香树”并非现代汉语中清晰、稳定的树种名称，且原文为复数；改为“香脂树丛”更贴合英语审校轨迹所采用的“balsam trees”，并以脚注保留植物鉴定的不确定性。
  naturalness: “从桑香树对面向他们进攻”可理解，但“桑香树”生僻，且“树丛”更自然地表达原文复数及此处的地貌／方位参照。“从香脂树丛的对面向他们进攻”在现代标准汉语中清楚而庄重。
  terminology: “雅威”一致保留 יהוה 的专名性质；“求问”“不要上去”“绕到他们后面”均合乎叙事及军事语境。植物名采用暂定译法“香脂树丛”，脚注说明也可音译为“巴迦树”，传统译作“桑树”，不把有争议的鉴定当作确定事实。
