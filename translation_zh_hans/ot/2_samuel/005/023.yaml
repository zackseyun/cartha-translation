base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/023.yaml
  text: So David inquired of Yahweh[a], and he said, “You shall not go up; circle around behind them, and come against them opposite the balsam trees.”
translation:
  language: zh_hans
  text: 大卫求问雅威；雅威说：“不要上去，要绕到他们后面，从香脂树丛的对面向他们进攻。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁאַל ... בַּיהוָה
  choice: 求问雅威
  rationale: שׁאל 与 בְּיהוה 连用，表示为寻求指引而求问神，不只是一般地提出问题；“求问雅威”也符合本书的军事语境。
- source_word: לֹא תַעֲלֶה
  choice: 不要上去
  rationale: 保留 עלה“上去”的基本空间意象；在此军事语境中自然表示不要按原路线进军。
- source_word: הָסֵב אֶל אַחֲרֵיהֶם
  choice: 要绕到他们后面
  rationale: סבב 的使役式命令在这里指迂回行动，אֶל אַחֲרֵיהֶם 指敌军后方；译文清楚传达战术调动。
- source_word: וּבָאתָ לָהֶם
  choice: 向他们进攻
  rationale: בוא + ל 在此军事语境中带有敌对接近、攻击之意；“进攻”比单纯“走近”更能传达上下文，同时不增加行动细节。
- source_word: מִמּוּל
  choice: 从……对面
  rationale: 表示位于某物正对面或面对着某物；与“向他们进攻”连用，呈现进攻的方位。
- source_word: בְּכָאִים
  choice: 桑香树
  rationale: 所指树种不能确定。“桑香树”是现代中文中对该词的一种常见处理，但以脚注保留“巴迦树”和传统“桑树”等可能译法。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；“雅威”以通行的学术拟音保留其专名性质，而不以称号代替。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“不要上去”保留原文表达，“绕到他们后面”和“向他们进攻”则使军事行动在现代汉语中清晰自然。
