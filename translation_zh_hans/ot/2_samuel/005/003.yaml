base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/003.yaml
  text: So all the elders of Israel came to the king at Hebron[a], and King David made a covenant with them at Hebron before Yahweh[b], and they anointed David king over Israel.
translation:
  language: zh_hans
  text: 于是，以色列的众长老都来到希伯仑见王；大卫王在希伯仑、在耶和华面前同他们立约[a]，他们就膏立大卫作以色列王。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“切约”，这是“立约”的惯用说法。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ כָּל זִקְנֵי יִשְׂרָאֵל
  choice: 以色列的众长老都到……来
  rationale: 保留כָּל的全体含义和זִקְנֵי作为群体领袖的意义；“到……来”自然表达叙事中的抵达。
- source_word: אֶל הַמֶּלֶךְ חֶבְרוֹנָה
  choice: 到希伯仑来见王
  rationale: חֶבְרוֹנָה带方向词尾，表示前往希伯仑；“来见王”清楚表达他们前往王所在之处。
- source_word: וַיִּכְרֹת ... בְּרִית
  choice: 立约
  rationale: 希伯来语字面为“切约”，是缔结盟约的固定说法；现代汉语圣经语体中“立约”简明、庄重，并保留其政治和神学分量。
- source_word: לָהֶם
  choice: 同他们
  rationale: 在“立约”这一搭配中，该介词短语表达立约双方的关系，译作“同他们”自然准确。
- source_word: לִפְנֵי יְהוָה
  choice: 在耶和华面前
  rationale: 既可表达“在……面前”，也自然包含“在……临在中”的庄严见证意味，不额外限定具体仪式。
- source_word: וַיִּמְשְׁחוּ אֶת דָּוִד לְמֶלֶךְ עַל יִשְׂרָאֵל
  choice: 他们就膏立大卫作以色列王
  rationale: “膏立”保留王权设立中的膏抹行动；“作以色列王”自然表达其对以色列的王权。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 采用现代中文读者最熟悉且庄重的专名形式，同时明确其为经文中的神名，不以“主”取代。
- issue: בְּרִית的盟约含义
  choice: 约
  alternative: 盟约／协议
  rationale: “立约”保留此处在耶和华面前确立王权关系的庄严性；“协议”分量过轻，“盟约”虽可行，但在此搭配中“立约”更自然。
- issue: 膏立的行动者
  choice: 他们
  alternative: 用无主句表达“于是大卫被膏立”
  rationale: 希伯来文动词为第三人称复数，最近且最自然的先行对象是以色列众长老，因此保留明确的复数主语。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“众长老”体现全体领袖，“膏立”保留古代王权礼仪用语；句式简洁，适合普通读者朗读和理解。
