base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/001.yaml
  text: Then all the tribes of Israel came to David at Hebron and said[a], “Look[b], we are your bone and your flesh.”
translation:
  language: zh_hans
  text: 于是，以色列众支派都到希伯仑[a]来见大卫，对他说：“看哪，我们是你的骨肉[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “希伯仑”的希伯来语形式带有表示方向的词尾，直译可作“往希伯仑”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译为“你的骨和你的肉”，是表示血缘亲属或共同家族身份的说法。
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: 于是……都到……来
  rationale: 连续式叙事动词推进情节；“于是”自然表达承接关系，“到……来”保留 בוא 的移动含义。
- source_word: כָּל שִׁבְטֵי יִשְׂרָאֵל
  choice: 以色列众支派
  rationale: 保留全体支派的集体性；“众支派”在现代汉语中简洁庄重。
- source_word: אֶל דָּוִד
  choice: 来见大卫
  rationale: אֶל 表示朝向大卫而来；结合地点“希伯仑”，译作“来见大卫”可清楚表达他们此行以大卫为对象，而不把介词误解为单纯地点关系。
- source_word: חֶבְרֹנָה
  choice: 到希伯仑
  rationale: 地名带方向词尾，最直接表示“往希伯仑”；与“来见大卫”结合，汉语表达自然。
- source_word: וַיֹּאמְרוּ לֵאמֹר
  choice: 对他说
  rationale: 这是常见的希伯来语引语公式；汉语不重复译出“说……说”，而用“对他说”自然引出直接引语。
- source_word: הִנּוּ
  choice: 看哪
  rationale: 保留提示听者注意和加强语气的功能；“看哪”庄重而易懂，也不将其弱化为无实义语气词。
- source_word: עַצְמְךָ וּבְשָׂרְךָ
  choice: 你的骨肉
  rationale: “骨肉”既保留原文“骨”和“肉”的身体隐喻及次序，也在汉语中自然表达血缘亲属关系。
- source_word: אֲנָחְנוּ
  choice: 我们是
  rationale: 原文为无系词名词句；现代汉语补出“是”，使句子完整自然。
theological_decisions:
- issue: 亲属称谓的政治—神学含义
  choice: 保留身体隐喻，译为“我们是你的骨肉”
  alternative: 我们是你的同胞／我们是你的亲族
  rationale: 众支派以共同血缘和民族身份为依据向大卫表明归属；“骨肉”既保留亲属隐喻，也不把这句话仅仅解释为政治联盟或预先限定其神学意义。
translation_notes:
  register: 采用现代、庄重而通顺的叙事语体。“于是”承接前文，“来见大卫”明确人物关系；引语中的“看哪”保留原文强调语气。“骨肉”是现代读者熟悉的亲属用语，同时最大限度保存原文隐喻。
