  yaml_path: translation/ot/2_samuel/005/018.yaml
  text: And the Philistines came and spread out in the Valley of Rephaim[a].
translation:
  language: zh_hans
  text: 非利士人来了，在利乏音谷展开[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “展开”或译“部署”。
    reason: 原文动词在此军事语境中指军队在一片地区铺展开来；“部署”可表达其军事含义，但比正文略具体。
lexical_decisions:
- source_word: וּ/פְלִשְׁתִּים
  choice: 非利士人
  rationale: ו承接上文；现代汉语叙事中无需机械译出“和/于是”。פְלִשְׁתִּים采用通行族名“非利士人”。
- source_word: בָּאוּ
  choice: 来了
  rationale: בוא的Qal完成式在此叙事语境中表示到来；译作“来了”自然简明。
- source_word: וַ/יִּנָּטְשׁוּ
  choice: 散开
  rationale: נטשׁ在此军事语境中指人员在一片区域铺展开来。“散开”保留动作图景，又不像“列阵”那样过度限定具体战术部署。
- source_word: בְּ/עֵמֶק
  choice: 在……谷
  rationale: ב为处所介词；עֵמֶק译作“谷”，与后面的专名共同构成地名。
- source_word: רְפָאִים
  choice: 利乏音
  rationale: 在地名עֵמֶק רְפָאִים中按通行圣经音译处理，不解释为某类族群。
