base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/005.yaml
  text: In Hebron he reigned over Judah seven years and six months, and in Jerusalem he reigned thirty-three years over all Israel and Judah.
translation:
  language: zh_hans
  text: 他在希伯仑作犹大的王七年六个月，在耶路撒冷作全以色列和犹大的王三十三年。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּחֶבְרוֹן
  choice: 在希伯仑
  rationale: 介词 בְּ 表示地点；“在希伯仑”符合现代汉语表达，也准确说明大卫在位的地点。
- source_word: מָלַךְ עַל
  choice: 作……的王
  rationale: מָלַךְ 在这里概述执政持续的时间，עַל 指其统治对象；“作……的王”比“登基”更能体现持续统治，而非单一的即位事件。
- source_word: עַל יְהוּדָה
  choice: 作犹大的王
  rationale: 这里的“犹大”指大卫所统治的地域及人民；此译法自然清楚。
- source_word: שֶׁבַע שָׁנִים וְשִׁשָּׁה חֳדָשִׁים
  choice: 七年六个月
  rationale: 按现代汉语习惯直接表达统治时长，无须补出连接词。
- source_word: וּבִירוּשָׁלַם
  choice: 在耶路撒冷
  rationale: 连词 וּ 与地点介词 בִּ 引出第二处统治地点；汉语以逗号衔接即可自然体现并列关系。
- source_word: שְׁלֹשִׁים וְשָׁלֹשׁ שָׁנָה
  choice: 三十三年
  rationale: 依现代汉语数词规范表达。
- source_word: עַל כָּל יִשְׂרָאֵל וִיהוּדָה
  choice: 作全以色列和犹大的王
  rationale: 保留原文“全以色列和犹大”的并列结构，既表达统治范围完整，也不抹去以色列与犹大之间的政治区分。
theological_decisions: []
