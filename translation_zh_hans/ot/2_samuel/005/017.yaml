base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/017.yaml
  text: When the Philistines heard that they had anointed David king over Israel[a], all the Philistines went up to seek David. When David heard of it, he went down to the stronghold.
translation:
  language: zh_hans
  text: '非利士人听说大卫已被膏立为以色列王，就全都上来寻找大卫。大卫听见这事，便下到要塞[a]。


    [a] 或译“堡垒”；希伯来语指设防的坚固处。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“堡垒”；希伯来语指设防的坚固处。
    reason: 说明 הַמְּצוּדָה 的词义范围，并提供自然的替代译法。
lexical_decisions:
- source_word: פְלִשְׁתִּים
  choice: 非利士人
  rationale: 采用现代中文圣经及历史叙述中通行的族名译法。
- source_word: כִּי
  choice: （听说）……
  rationale: 在此引出所听见的内容；中文以“听说”自然表达，无须另译连接词。
- source_word: מָשְׁחוּ אֶת דָּוִד לְמֶלֶךְ עַל יִשְׂרָאֵל
  choice: 大卫已被膏立为以色列王
  rationale: 被动表达避免擅自补明未明说的施事者；“已”体现膏立先于非利士人听闻此事，“为以色列王”自然表达其统治身份。
- source_word: וַיַּעֲלוּ
  choice: 就……上来
  rationale: 保留עלה的上行方位含义，同时用“就”清楚衔接听闻后的行动。
- source_word: כָל־פְּלִשְׁתִּים
  choice: 全都
  rationale: 保留כָל所强调的整体性，不增译为“全军”，以免加入原文未明说的军事编制。
- source_word: לְבַקֵּשׁ אֶת־דָּוִד
  choice: 寻找大卫
  rationale: בקש本义宽泛，可指寻索；不把敌对意图具体化为“捉拿”或“杀死”。
- source_word: וַיִּשְׁמַע דָּוִד
  choice: 大卫听见这事
  rationale: 原文省略所听内容，中文补入由上下文自然指明的“这事”，使叙事流畅。
- source_word: וַיֵּרֶד
  choice: 便下到
  rationale: 保留ירד的下行含义，不额外加入停留、躲避等动作。
- source_word: הַמְּצוּדָה
  choice: 坚固据点
  rationale: 该词指设防的坚固处；此译法现代、清楚，并避免“山寨”可能产生的古旧或现代歧义。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。首句以被动结构保留膏立者未明的特点；“寻找”保留敌对目的的语境暗示而不作过度解释。脚注标记置于其实际说明的“坚固据点”之后。
