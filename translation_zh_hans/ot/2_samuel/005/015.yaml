  footnotes:
  - marker: a
    text: 希伯来原文在每个人名前都重复“和”，直译为：“和以伯哈，和以利书亚，和尼斐，和雅非亚。”
    reason: 说明原文反复使用连接词，而正文依现代汉语习惯处理为名单标点。
lexical_decisions:
- source_word: יִבְחָר
  choice: 伊伯哈尔
  rationale: 人名按希伯来语形式音译；采用“伊伯哈尔”以保留词首 y 音及词尾辅音，比依据英语 Ibhar 转写更贴近原文。
- source_word: אֱלִישׁוּעַ
  choice: 以利书亚
  rationale: 人名按希伯来语音译；末尾 ע 不另以生硬音节标示，保持现代汉语人名的可读性。
- source_word: נֶפֶג
  choice: 尼斐
  rationale: 人名按希伯来语音译，并采用简洁、自然的现代汉语形式。
- source_word: יָפִיעַ
  choice: 雅非亚
  rationale: 人名按希伯来语音译，保留词首 y 音和末尾元音结构。
- source_word: וְ
  choice: 、……和……
  rationale: 原文在每个人名前重复连接词；现代汉语名单通常用顿号分隔，并在最后一项前用“和”，既自然又保留并列关系。
