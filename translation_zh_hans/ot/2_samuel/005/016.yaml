lexical_decisions:
- source_word: וֶ/אֱלִישָׁמָע
  choice: 还有以利沙玛
  rationale: 前缀 ו 承接上一节列举的人名，译作“还有”；专名 אֱלִישָׁמָע 按现代中文圣经中通行的音译形式译为“以利沙玛”。
- source_word: וְ/אֶלְיָדָע
  choice: 以利雅大
  rationale: 专名 אֶלְיָדָע 采用通行中文音译“以利雅大”；其前的 ו 在中文并列结构中不逐一重复，以免表达生硬。
- source_word: וֶ/אֱלִיפָלֶט
  choice: 和以利法列
  rationale: 末项前的 ו 译作“和”，自然地收束名单；专名 אֱלִיפָלֶט 采用通行中文音译“以利法列”，不另行意译其词源含义。
