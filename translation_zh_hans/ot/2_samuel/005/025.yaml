base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/025.yaml
  text: And David did so[a], just as Yahweh had commanded him[b], and he struck down the Philistines from Geba as far as Gezer.
translation:
  language: zh_hans
  text: 大卫就照雅威所吩咐他的而行，击败非利士人，从迦巴[a]直到基色附近[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 马所拉文本作“迦巴”。历代志上14:16的平行记载作“基遍”；部分译本因文本或平行经文的考虑而作不同处理。
    reason: textual_variant
  - marker: b
    text: 直译：“直到你来到基色。”可指通往基色之处或基色附近。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ דָּוִד כֵּן
  choice: 大卫就……去做
  rationale: עשה כן在此回指上文的指示，意为“照样去做”。此译法在现代汉语中自然，也保留了叙事的简洁。
- source_word: כַּאֲשֶׁר צִוָּהוּ
  choice: 照……所吩咐他的
  rationale: כַּאֲשֶׁר表示大卫的行动与先前所领受的命令相符；“照……所吩咐他的”准确而自然。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以通行的现代汉语音译呈现四字神名，保留其专名性质，不以称号代替。
- source_word: וַיַּךְ אֶת־פְּלִשְׁתִּים
  choice: 击杀非利士人
  rationale: נכה在军事语境中表示打击、杀伤或击败敌军；“击杀”保留原文的武力色彩，但不额外断定全军尽灭。
- source_word: מִגֶּבַע
  choice: 从迦巴
  rationale: 马所拉文本作גֶּבַע，即“迦巴”。译文依从所给WLC正文，并用脚注说明平行经文及部分文本传统的差异。
- source_word: עַד בֹּאֲךָ גָזֶר
  choice: 直到基色附近
  rationale: 字面为“直到你来到基色”，属表示地点范围的习语，所指可为通往基色之处或基色近旁；正文采用自然汉语，并在脚注保留字面表达及其范围。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文使用以色列之神的专名。正文采用较贴近学界通常重构读音的“雅威”，而“耶和华”是汉语传统中广为人知的另一音译；此处不以“主”等称号替代专名。
- issue: 大卫行动与神命令的关系
  choice: 照雅威所吩咐他的去做
  alternative: 按雅威的命令行事
  rationale: 保留原文对行动与命令相符的直接陈述，不进一步加入关于大卫动机、信心或功德的解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事文体。“就……去做”自然呈现希伯来语“这样做”的回指关系；地名依现代中文圣经常用译名。脚注标记均置于所说明的词语之后。
