lexical_decisions:
- source_word: בֶּן שְׁלֹשִׁים שָׁנָה
  choice: 三十岁
  rationale: 这是希伯来语表达年龄的惯用语，字面为“是三十年之子”；译为“三十岁”自然、准确。
- source_word: בְּמָלְכוֹ
  choice: 登基时
  rationale: 介词 בְּ 加 מלך 的不定式构造及第三人称阳性单数后缀，在此王朝纪年公式中表示大卫开始作王的时间；“登基时”简洁地表达即位之意。
- source_word: מָלָךְ
  choice: 在位
  rationale: 该动词表示作王、执掌王权；与“四十年”连用时，现代汉语以“在位四十年”最自然。
- source_word: אַרְבָּעִים שָׁנָה
  choice: 四十年
  rationale: 忠实表达大卫作王持续的年数。
- source_word: דָּוִד
  choice: 大卫
  rationale: 采用现代中文圣经传统中通行的人名译法。
