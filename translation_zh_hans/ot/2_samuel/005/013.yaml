  text: וַ/יִּקַּח֩ דָּוִ֨ד ע֜וֹד פִּֽלַגְשִׁ֤ים וְ/נָשִׁים֙ מִ/יר֣וּשָׁלִַ֔ם אַחֲרֵ֖י בֹּא֣/וֹ מֵ/חֶבְר֑וֹן וַ/יִּוָּ֥לְדּוּ ע֛וֹד לְ/דָוִ֖ד בָּנִ֥ים וּ/בָנֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/013.yaml
  text: And David took more concubines and wives in Jerusalem after he came from Hebron[a], and more sons and daughters were born to David.
translation:
  language: zh_hans
  text: 大卫从希伯仑来以后，又在耶路撒冷[a]娶了更多的妾和妻子；又有儿子和女儿为大卫所生。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“从耶路撒冷娶了”。希伯来语字面为“从耶路撒冷”，可能表示大卫迁居那里以后从当地娶了她们。
    reason: 保留希伯来语介词的字面意义及其可能表达的来源含义。
lexical_decisions:
- source_word: וַיִּקַּח
  choice: 娶了
  rationale: לקח在婚姻和王室家庭语境中指将女子纳入婚姻或妃嫔关系；“娶了”比泛泛的“带走”更准确自然。
- source_word: עוֹד
  choice: 又
  rationale: 两处עוֹד都表示在已有基础上的增加；“又”在现代汉语中简洁地表达这一追加意义。
- source_word: פִּלַגְשִׁים
  choice: 妃嫔
  rationale: 保留其与“妻子”不同的王室伴侣身份；在大卫王室语境中，“妃嫔”比“妾”更合乎庄重叙事语体。
- source_word: וְנָשִׁים
  choice: 妻子
  rationale: נָשִׁים虽也可泛指女人，但与“妃嫔”并列时指正式妻室，因此译作“妻子”。
- source_word: מִירוּשָׁלִַם
  choice: 在耶路撒冷
  rationale: 前置词מִן字面通常表示“从”，但此处若直接译成“从耶路撒冷娶了”可能指女子的来源；上下文也容许将地点理解为大卫迁居后纳妃娶妻的所在。正文采用自然且符合叙事场景的“在耶路撒冷”，脚注保留字面形式及歧义。
- source_word: אַחֲרֵי בֹּאוֹ מֵחֶבְרוֹן
  choice: 从希伯仑来到耶路撒冷以后
  rationale: 原文直陈“他从希伯仑来以后”；汉语补出目的地“耶路撒冷”，由紧邻的地名及上下文明确可知，使时间和迁居关系自然清楚。
- source_word: וַיִּוָּלְדוּ עוֹד לְדָוִד
  choice: 大卫又有……出生
  rationale: 保留ילד的被动出生意义和לְדָוִד所表达的归属关系，同时避免生硬的“为大卫所生”或可能误解为大卫亲自生产的措辞。
- source_word: בָּנִים וּבָנוֹת
  choice: 儿子和女儿
  rationale: 原文明列两者，故不概括成“儿女”或“孩子”，以保留其具体表达。
theological_decisions:
- issue: 对大卫多妻行为的叙事性陈述
  choice: 不加褒贬，按原文如实叙述。
  alternative: 加入表示赞同、责备或违命的评价性措辞。
  rationale: 本节只记述大卫纳妃娶妻以及儿女出生，并未在此明说任何道德评价；译文不应替原文添加神学判断。
- issue: מִירוּשָׁלִַם所表达的地点关系
  choice: 正文译为“在耶路撒冷”，脚注注明字面可译“从耶路撒冷”。
  alternative: 正文直接译作“从耶路撒冷”，将其明确理解为妻妾的来源地。
  rationale: 希伯来语形式与上下文中的自然地点理解之间存在真实张力；正文采用通顺的场景表达，脚注保留形式上的另一种读法，不武断消除歧义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“娶了妃嫔和妻子”体现王室家庭语境，并保持两类身份的区别；分号连接行动与随后出生的儿女。
