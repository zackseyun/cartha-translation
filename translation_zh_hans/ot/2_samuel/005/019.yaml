base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/019.yaml
  text: And David inquired of Yahweh[a], saying, “Should I go up against the Philistines? Will you give them into my hand?” And Yahweh said to David, “Go up, for I will certainly give the Philistines into your hand.”
translation:
  language: zh_hans
  text: 大卫求问雅威，说：“我该上去攻打非利士人吗？你会把他们交在我手中吗？”雅威对大卫说：“上去吧！因为我必定把非利士人交在你手中[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “交在……手中”是希伯来语惯用语，意思是使对方落在某人的权下，也就是使他战胜对方。
    reason: 解释原文的军事性惯用语，同时保留正文中的“手”这一意象。
lexical_decisions:
- source_word: וַיִּשְׁאַל ... בַּיהוָה
  choice: 求问雅威
  rationale: 这里的 שׁאל בַּיהוָה 指向雅威寻求指引；“求问”既符合现代中文宗教语境，也不额外限定求问所采用的仪式或媒介。
- source_word: הַאֶעֱלֶה / עֲלֵה
  choice: 我该上去攻打 / 上去吧
  rationale: עלה 的基本意义是“上去”，在军事语境中指进军；问句中补出“攻打”以明确敌对语境，答句保留“上去”，并维持原文的词语呼应。
- source_word: אֶל פְּלִשְׁתִּים
  choice: 攻打非利士人
  rationale: 介词 אֶל 本义为“向、到”，但在此军事语境中表示向敌军进发；译作“攻打”符合自然汉语。
- source_word: הֲתִתְּנֵם ... בְּיָדִי / אֶתֵּן ... בְּיָדֶךָ
  choice: 把他们交在我手中 / 把非利士人交在你手中
  rationale: 保留 נתן 与“手”构成的希伯来语意象及问答之间的平行结构；该惯用语表示使敌人落入某人的权下，从而赐下胜利。
- source_word: נָתוֹן אֶתֵּן
  choice: 我必定把……交在
  rationale: 不定式绝对式与同根限定动词连用具有强调作用；“必定”清楚传达承诺的确定性。
theological_decisions:
- issue: 神圣名字 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名 יהוה；“雅威”以常见的现代汉语音译保留其专名性质，不以称号“主”取代，也不采用较晚形成的混合读音“耶和华”。
- issue: “交在手中”的神学与军事含义
  choice: 正文保留原文意象，并用脚注说明是赐予胜利
  alternative: 正文直接译为“使你战胜他们”
  rationale: 原文强调雅威主动将敌人交付给大卫；保留惯用语可呈现这种施予关系，同时脚注帮助现代读者理解其军事含义。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“求问”表达寻求神圣指引而不限定具体方式；“我该……吗”自然传达审慎询问；答语中的“必定”保留希伯来语强化结构。标点和人名采用现代简体中文通行形式。
