  text: וַ֠/יִּשְׁלַח חִירָ֨ם מֶֽלֶךְ צֹ֥ר מַלְאָכִים֮ אֶל דָּוִד֒ וַ/עֲצֵ֣י אֲרָזִ֔ים וְ/חָרָשֵׁ֣י עֵ֔ץ וְ/חָֽרָשֵׁ֖י אֶ֣בֶן קִ֑יר וַ/יִּבְנֽוּ בַ֖יִת לְ/דָוִֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/011.yaml
  text: And Hiram king of Tyre sent messengers to David[a], and cedar logs, and craftsmen of wood, and craftsmen of stone walling[b]; and they built a house for David.
translation:
  language: zh_hans
  text: 推罗王希兰派使者到大卫那里，又送去香柏木料、木匠和砌石墙的工匠[a]；他们为大卫建造了一座房屋[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“石匠”。原文短语同时含有“石”和“墙”两个词。
    reason: lexical_alternative
  - marker: b
    text: 或译“宫殿”。原文直译为“房屋”，在王室语境中也可指宫殿。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: 派……到；又送去
  rationale: 该动词统领使者及随后列举的建材和工匠。中文分别用“派”和“送去”搭配人和物，使句意自然，同时保持同一差遣行动的结构。
- source_word: חִירָם
  choice: 希兰
  rationale: 采用现代中文圣经传统中通行的人名音译。
- source_word: מֶלֶךְ צֹר
  choice: 推罗王
  rationale: 准确表达属格结构“推罗的王”，并采用中文通行地名“推罗”。
- source_word: מַלְאָכִים
  choice: 使者
  rationale: 该词既可指一般使者，也可指外交使节；“使者”保留较宽泛的语义，不额外限定其外交身份。
- source_word: וַעֲצֵי אֲרָזִים
  choice: 香柏木料
  rationale: 原文直译近于“香柏树木”，在此指用于建筑的香柏木材；“木料”自然且不把形态过度限定为原木。
- source_word: חָרָשֵׁי עֵץ
  choice: 木匠
  rationale: 指从事木材加工的工匠。“木匠”是清楚、自然且范围合宜的现代中文表达。
- source_word: חָרָשֵׁי אֶבֶן קִיר
  choice: 砌石墙的工匠
  rationale: 这一较难的短语同时含“石”和“墙”。译文保留两项词义，并自然表达从事石墙建造的工匠；较简洁的“石匠”列入脚注。
- source_word: וַיִּבְנוּ
  choice: 他们……建造了
  rationale: 复数主语承接前述工匠；中文明确补出“他们”，使叙事关系清楚。
- source_word: בַיִת
  choice: 一座房屋
  rationale: 保留该词的基本义“房屋”。在王室语境中可能指宫殿，但不在正文中消解这一语义张力。
- source_word: לְדָוִד
  choice: 为大卫
  rationale: 直接表达受益者或建造对象，不额外加入“居所”等原文未明说的信息。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。正文保留原文“房屋”与王室语境中“宫殿”之间的含义张力，并以脚注提示；对困难的石工短语则在正文中保留“石”与“墙”两个要素。
