base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/020.yaml
  text: So David came to Baal-perazim[a], and there David struck them down. He said[b], “Yahweh has broken through my enemies before me like a breakthrough of waters.” Therefore he called the name of that place Baal-perazim.
translation:
  language: zh_hans
  text: 大卫来到巴力·毗拉心[a]，在那里击败了他们。大卫说：“雅威在我面前冲破了我的仇敌，如同水势冲决一般[b]。”因此，他给那地方起名叫巴力·毗拉心。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “巴力·毗拉心”这个地名可理解为“冲破之主”或“冲破之地”，与大卫所说雅威“冲破”仇敌彼此呼应。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“如同洪水决口涌出”。希伯来原文在“冲破”“决口”和“巴力·毗拉心”之间有文字呼应。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּבַעַל פְּרָצִים / בַּעַל פְּרָצִים
  choice: 巴力·毗拉心
  rationale: 作为地名采用音译；在脚注中说明其含义，并保留它与本节“冲破”的文字呼应。
- source_word: וַיַּכֵּם
  choice: 击败了他们
  rationale: נכה在战争语境中表示击打、击倒或击败；“击败”在现代汉语叙事中自然，同时保留军事含义，又不额外断定全部被杀。
- source_word: פָּרַץ
  choice: 冲破了
  rationale: 该动词表示冲开、突破；“冲破”既符合战斗语境，也能与水冲破缺口的比喻及地名形成呼应。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文四字神名YHWH作现代汉语音译，而不以称号代替专名。
- source_word: אֹיְבַי
  choice: 我的仇敌
  rationale: 直接表达名词及第一人称单数所属后缀。
- source_word: לְפָנַי
  choice: 在我面前
  rationale: 贴近希伯来语空间表达，并保留其可能兼有“在我前方、当着我”的意味。
- source_word: כְּפֶרֶץ מָיִם
  choice: 如同水冲破缺口一样
  rationale: 用自然、可理解的汉语呈现水决口涌出的图景，并通过重复“冲破”尽量保存פָּרַץ、פֶּרֶץ与地名之间的双关。
- source_word: קָרָא שֵׁם הַמָּקוֹם הַהוּא
  choice: 给那地方起名叫
  rationale: 这是希伯来语“称那地方的名”的自然现代汉语表达，清楚呈现命名行为。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名YHWH；“雅威”按其通常重建的读音音译，保留专名性质，不用“主”这一称号替换。
- issue: “冲破我的仇敌”的施事与图像
  choice: 雅威亲自冲破仇敌，如水冲破缺口
  alternative: 雅威使大卫冲破仇敌；雅威使仇敌阵线崩溃
  rationale: 原文以雅威为פָּרַץ的直接主语，以“我的仇敌”为宾语；译文不把大卫改作施事，也不将水的比喻解释成更具体的战术描述。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“击败”避免古雅的“击杀/击打”可能造成的过度限定；“冲破……冲破缺口”有意保留原文核心词根的重复。地名使用常见的圣经汉语音译形式并加间隔号，神名则音译为“雅威”。
