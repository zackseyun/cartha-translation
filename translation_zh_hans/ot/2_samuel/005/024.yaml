revisions:
- from: 你一听见乳香树[a]梢传来行军的声音，就要果断行动，因为那时雅威已经走在你前面，要击打非利士人的营地。
  to: 你一听见从香脂树[a]梢传来行军的声音，就要果断行动，因为那时雅威已经在你前面出发，要攻击非利士人的营地。
  rationale: 将“乳香树”改为较不具植物学排他性的“香脂树”，并保留脚注以呈现原文的真实不确定性。补出“从”，使地点短语自然；将“走在你前面”改为“在你前面出发”，更准确表达雅威已经先行出去攻击的军事动作。其余措辞保留原有的现代庄重语体、行动的紧迫性及“营地”的具体意象。
