  text: וִ֠/יהִי ב/שמע/ך אֶת ק֧וֹל צְעָדָ֛ה בְּ/רָאשֵׁ֥י הַ/בְּכָאִ֖ים אָ֣ז תֶּחֱרָ֑ץ כִּ֣י אָ֗ז יָצָ֤א יְהוָה֙ לְ/פָנֶ֔י/ךָ לְ/הַכּ֖וֹת בְּ/מַחֲנֵ֥ה פְלִשְׁתִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/024.yaml
  text: And when you hear the sound of marching in the tops of the balsam trees[a], then act decisively, for then Yahweh has gone out before you to strike down the camp of the Philistines.
translation:
  language: zh_hans
  text: 你一听见从香脂树[a]梢传来行军的声音，就要果断行动，因为那时雅威已经在你前面出发，要攻击非利士人的营地。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“巴迦树”；希伯来词所指的确切树种不能确定，旧译也常作“桑树”。
    reason: 说明该希伯来树名的植物学指称不确定，并保留音译及传统译法。
lexical_decisions:
- source_word: וִיהִי בְשָׁמְעֲךָ
  choice: 你一听见
  rationale: 希伯来语的 היה 与带介词 ב 的不定式结构引出将来的时间情境；“你一听见”自然表达“当你听见时”，并带出随即行动的意味。
- source_word: קוֹל צְעָדָה
  choice: 行军的声音
  rationale: קוֹל 是“声音”，צְעָדָה 指迈步、行进；在战事语境中译为“行军的声音”准确而自然。
- source_word: בְּרָאשֵׁי הַבְּכָאִים
  choice: 乳香树梢
  rationale: רָאשֵׁי 指树梢、顶部；בְּכָאִים 所指树种不能完全确定，“乳香树”是较常见的词义判断，具体不确定性收入脚注。
- source_word: אָז תֶּחֱרָץ
  choice: 就要果断行动
  rationale: חרץ 在这里要求迅速而坚决地采取行动；“果断行动”保留力度，又不把含义局限为单纯加快速度。
- source_word: כִּי אָז יָצָא יְהוָה לְפָנֶיךָ
  choice: 因为那时雅威已经走在你前面
  rationale: כִּי 引出行动的理由；完成式 יָצָא 表明在听见信号之时，雅威已经出发并走在大卫前面。
- source_word: לְהַכּוֹת בְּמַחֲנֵה פְלִשְׁתִּים
  choice: 要击打非利士人的营地
  rationale: נכה 的使役式在战争语境中表示击打或击溃；מַחֲנֶה 直指营地，也可连带指驻营军队，正文保留具体意象。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较贴近学界通行的拟音，也保留这是专名而非称号。
- issue: יָצָא 的时态和神在战事中的先行
  choice: 已经走在你前面
  alternative: 要走在你前面
  rationale: 完成式在这一将来时间框架中可表达届时已经发生的行动。译作“已经”保留听见信号即表明雅威先行动的逻辑，而不把人和神行动的关系倒置。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“树梢传来行军的声音”保持原文异常而鲜明的神圣信号意象；“营地”不泛化为“军队”。
