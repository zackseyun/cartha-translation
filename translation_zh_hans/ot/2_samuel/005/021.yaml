  yaml_path: translation/ot/2_samuel/005/021.yaml
  text: And they left their idols there[b][a], and David and his men carried them away.
translation:
  language: zh_hans
  text: 他们把他们的神像留在那里[b]；大卫和他的人把这些神像带走了[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 《历代志上》14:12补充说，大卫下令把这些神像烧掉。本节的希伯来文本只说，大卫和他的人把这些神像带走了。
    reason: cross_reference
  - marker: b
    text: “神像”或译“偶像”。希伯来语所指的是用于崇拜的像。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַזְבוּ
  choice: 他们……留
  rationale: עזב在此叙事语境中表示非利士人撤退时将物件留在原处；“留在那里”自然、准确，不额外强化为“丢弃”。
- source_word: שָׁם
  choice: 在那里
  rationale: 直接保留地点副词的叙事功能。
- source_word: עֲצַבֵּיהֶם
  choice: 自己的神像
  rationale: 该词指用于崇拜的雕像或偶像。“神像”清楚表达其为宗教崇拜物，同时脚注保留“偶像”这一带贬义的译法。
- source_word: וַיִּשָּׂאֵם
  choice: 把神像带走了
  rationale: נשא可表示举起、携带或带走；此处“带走”符合动作与语境，也不预断其后如何处置。重复“神像”比使用代词更清楚自然。
- source_word: דָּוִד וַאֲנָשָׁיו
  choice: 大卫和跟随他的人
  rationale: 原文直译为“大卫和他的人”；现代汉语用“跟随他的人”自然表达其随从或战士群体，又不将范围限定为正规军。
theological_decisions:
- issue: 与《历代志上》14:12所述焚烧神像的平行记载之间的关系
  choice: 按《撒母耳记》马所拉文本译为“带走了”，不在正文中协调为“烧掉了”
  alternative: 译成暗示这些神像当即被焚毁的协调性表述
  rationale: 本节希伯来文本只说大卫和跟随他的人将神像带走；《历代志上》补充说大卫下令焚烧。正文应忠实保留《撒母耳记》本身的表述，并以脚注说明平行经文。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“跟随他的人”避免生硬的“他的人”，也不把原文解释性收窄为“士兵”。脚注标记依其说明对象分别置于“神像”和全句末尾。
