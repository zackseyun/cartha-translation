revisions:
- from: 他们把自己的神像留在那里[b]；大卫和跟随他的人把神像带走了。[a]
  to: 他们把他们的神像留在那里[b]；大卫和他的人把这些神像带走了[a]。
  rationale: 修订仅消除两处轻微的解释性表达：以“他们的”直译属格，以“他的人”保留原文对大卫同伴／部众的概括称谓。其余译法和脚注均忠实呈现马所拉文本，并将《历代志上》的补充信息限于注释。
