    rationale: 希伯来文仅为“大卫和他的人”，在本段语境中可指其部众或战士，但并未明言他们是“跟随他的人”。“大卫和他的人”更贴近原文，也符合现代圣经叙事汉语。
  - severity: low
    issue: “自己的神像”有不必要的反身强调
    rationale: 第三人称复数属格只表示“他们的”；“自己的”虽不致误译，但“他们的”更直接保留原文的所有关系。
