review_pass:
  verdict: revise
  source_fidelity: 正文准确保留了希伯来文的两个动作：撤退者把其宗教像留在当地，随后大卫及其人将这些像带走；没有将《历代志上》的焚烧细节并入正文。惟“跟随他的人”将“他的男人／他的人”（אַנָשָׁיו）具体化为跟随者，略增原文未明说的关系，宜改为较贴近原文且汉语通顺的“他的人”。
  naturalness: 整体庄重、自然。将“自己的神像”改为“他们的神像”，并在后半句用“这些神像”承接，可避免“自己”在现代汉语中可能造成的反身强调，并使所指更清楚。
  terminology: “神像”适合译出此处指祭祀性像的名词；脚注保留“偶像”作为可选译法，既说明语义范围，也不在正文中额外加重贬义。
  issues:
