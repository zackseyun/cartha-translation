  text: And he bowed down and said[a], “What is your servant[b], that you have turned toward a dead dog like me?”
translation:
  language: zh_hans
  text: 他就俯伏下拜，说：“仆人算什么，你竟眷顾我这样一条死狗呢？”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “眷顾”原文直译为“转向”，此处指向某人转脸、留意；“死狗”是表达极度自我贬抑、认为自己毫无价值的说法。
    reason: lexical_and_cultural_note
lexical_decisions:
- source_word: וַיִּשְׁתַּחוּ
  choice: 俯伏下拜
  rationale: שׁחה的此形态表示俯身或伏地下拜，以表达敬意或臣服；“俯伏下拜”保留身体动作，也不将其限定为宗教敬拜。
- source_word: מֶה עַבְדֶּךָ
  choice: 仆人算什么
  rationale: 原文直译为“你的仆人是什么”，是自谦和自我贬抑的反问；“仆人算什么”符合现代汉语，又保留宫廷语境中的自称。
- source_word: כִּי
  choice: 竟
  rationale: 此处כִּי引出反问所针对的事实；汉语用“竟”自然表达对受宠眷的惊异，并连接“算什么”与下文。
- source_word: פָנִיתָ אֶל
  choice: 眷顾
  rationale: 短语字面意为“转向”，在此指上位者留意并施恩；“眷顾”自然、庄重地传达这种恩待。脚注补明其具体意象。
- source_word: הַכֶּלֶב הַמֵּת
  choice: 一条死狗
  rationale: 这是极度自贬、表示毫无价值的说法；按汉语量词习惯译作“一条死狗”，保留原有冲击力。
- source_word: אֲשֶׁר כָּמוֹנִי
  choice: 我这样
  rationale: 该关系短语修饰“死狗”，意为“像我这样的”；前置为“我这样一条死狗”符合现代汉语语序。
