base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/009/009.yaml
  text: Then the king called Ziba[a], Saul’s servant, and said to him[c][b], “All that belonged to Saul and to all his house I have given to your master’s son.”
translation:
  language: zh_hans
  text: 于是，王召来扫罗的仆从洗巴[a]，对他说：“扫罗和他全家[b]所有的产业，我都给你主人的儿子[c]了。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “仆从”也可译作“少年人”或“侍从”；这里可能指扫罗家中的仆役或随从。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“他全屋”；这里的“家”可包括扫罗的家族、家室和产业。
    reason: lexical_alternative
  - marker: c
    text: 原文直译为“你主人的儿子”。这里指米非波设；他是扫罗的孙子，因此“儿子”在此按家族谱系作较广义的称谓。
    reason: cultural_note
lexical_decisions:
- source_word: נַעַר
  choice: 仆从
  rationale: 该词通常可指“少年人”，也可在家族或王室语境中表示随从、侍役。洗巴在上下文中是扫罗家的服役者，因此译作“仆从”既体现身份关系，也比单译“少年人”更切合语境。
- source_word: כֹּל אֲשֶׁר הָיָה לְשָׁאוּל
  choice: 凡属于扫罗……的一切
  rationale: 希伯来语“归于扫罗的一切”是表达所有权的惯用结构；“凡属于扫罗……的一切”清楚、自然，并保留原文的概括范围。
- source_word: וּלְכָל בֵּיתוֹ
  choice: 和他全家
  rationale: בַּיִת 在这里不只指建筑物，也可涵盖家族、家业或家产。“全家”保留其家族性含义；脚注说明此处范围也涉及扫罗家的一切产业。
- source_word: נָתַתִּי
  choice: 我都赐给……了
  rationale: 完成式表示赐予已经发生，且结果仍然有效。句末“了”自然地传达这一完成及现存结果。
- source_word: לְבֶן אֲדֹנֶיךָ
  choice: 给你主人的后裔
  rationale: בֵּן 基本义是“儿子”，但也可指男性后裔。米非波设是扫罗的孙子；译作“后裔”避免让现代读者误以为他是扫罗的亲生儿子，同时脚注保留原文直译。
- source_word: וַיִּקְרָא ... וַיֹּאמֶר
  choice: 于是，王召来……对他说
  rationale: 连续的叙事动词推动情节发展。“于是”体现承接关系，“召来……对他说”符合现代汉语叙事表达。
