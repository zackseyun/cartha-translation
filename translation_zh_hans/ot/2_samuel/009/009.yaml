translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“仆从”比“奴仆”中性，也能表达家臣身份；“赐给”适合王所作的产业授予。“后裔”配合脚注，兼顾现代读者的准确理解与原文措辞。
