source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ ל֨/וֹ דָוִ֜ד אַל תִּירָ֗א כִּ֣י עָשֹׂה֩ אֶעֱשֶׂ֨ה עִמְּ/ךָ֥ חֶ֨סֶד֙ בַּֽ/עֲבוּר֙ יְהוֹנָתָ֣ן אָבִ֔י/ךָ וַ/הֲשִׁבֹתִ֣י לְ/ךָ֔ אֶֽת כָּל שְׂדֵ֖ה שָׁא֣וּל אָבִ֑י/ךָ וְ/אַתָּ֗ה תֹּ֥אכַל לֶ֛חֶם עַל שֻׁלְחָנִ֖/י תָּמִֽיד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/009/007.yaml
  text: David said to him[a], “Do not be afraid, for I will surely show you kindness for the sake of Jonathan your father, and I will restore to you all the land of Saul your father[c][b], and you shall always eat bread at my table.”
translation:
  language: zh_hans
  text: 大卫对他说：“不要害怕！我必因你父亲约拿单的缘故，以慈爱待你[a]。我会把你祖父扫罗[b]的一切田产都归还给你；你要常在我桌前吃饭[c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “慈爱”也可译作“恩慈”“忠爱”或“信实之爱”。希伯来语词含有出于关系忠诚而施恩的意味。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语直译“你父亲扫罗”；“父亲”也可指祖先。扫罗是米非波设的祖父。
    reason: lexical_alternative
  - marker: c
    text: 希伯来语直译“常在我的桌上吃饼”，指长期得到供养，并享有同席的地位。
    reason: cultural_note
lexical_decisions:
- source_word: אַל תִּירָא
  choice: 不要害怕
  rationale: 以现代汉语自然表达否定命令，同时保留大卫直接安慰的语气。
- source_word: כִּי עָשֹׂה אֶעֱשֶׂה
  choice: 我必……待你
  rationale: 希伯来语不定式绝对式与限定动词连用，强化行动的确定性；用“必”简洁传达强调。
- source_word: חֶסֶד
  choice: 慈爱
  rationale: 本处指因与约拿单的关系而落实于具体行动的忠诚信实与恩慈；“慈爱”既通顺，也保留其关系性和忠诚意味，并用脚注列出其他可能译法。
- source_word: בַּעֲבוּר יְהוֹנָתָן אָבִיךָ
  choice: 因你父亲约拿单的缘故
  rationale: 兼顾行为的原因及关系动机，符合现代汉语表达。
- source_word: וַהֲשִׁבֹתִי לְךָ
  choice: 归还给你
  rationale: 使役式在此表示使产业回归原属者；“归还”准确表达产业恢复的法律和社会含义。
- source_word: כָּל שְׂדֵה שָׁאוּל
  choice: 扫罗的一切田产
  rationale: שָׂדֶה 虽为单数，却可作集合意义，指土地产业；“田产”比单纯“田地”更能表达整份地产。
- source_word: שָׁאוּל אָבִיךָ
  choice: 你祖父扫罗
  rationale: אָב 可泛指男性祖先；按叙事关系，扫罗是米非波设的祖父。正文明确实际亲属关系，同时脚注交代希伯来语的字面形式。
- source_word: תֹּאכַל לֶחֶם עַל שֻׁלְחָנִי תָּמִיד
  choice: 你也可以常在我席上吃饭
  rationale: “吃饼”是共享膳食的惯用语；译作“吃饭”传达持续供养和同席相交。“常”保留 תָּמִיד 的持续意味。
theological_decisions:
- issue: חֶסֶד 的盟约与忠诚内涵
  choice: 正文译作“慈爱”，脚注说明“恩慈、忠爱、信实之爱”等可能表达
  alternative: 恩慈；忠爱；信实之爱
  rationale: 上下文强调大卫因约拿单而施行的忠诚善待。“慈爱”保持可读性而不过度限定为某一套神学术语，脚注则保留原词较丰富的关系和忠诚意涵。
- issue: “扫罗，你父亲”中的亲属称谓
  choice: 按实际亲属关系译作“你祖父扫罗”，并在脚注保留字面形式
  alternative: 你父亲扫罗
  rationale: 希伯来语 אָב 可以指祖先；这里扫罗实际是米非波设的祖父。此译避免现代读者误认其为生父，同时不掩盖原文措辞。
translation_notes:
  register: 采用庄重、自然的现代标准汉语。“席上吃饭”保留王家同席的语境，又不显古奥；句式清楚体现安慰、归还产业和持续同席三层应许。
