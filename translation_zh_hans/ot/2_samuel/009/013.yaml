base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/009/013.yaml
  text: And Mephibosheth lived in Jerusalem[a], because he always ate at the king’s table[b]. Now he was lame in both his feet.
translation:
  language: zh_hans
  text: 米非波设住在耶路撒冷，因为[a]他常在王的席上吃饭；他两脚[b]都瘸。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “因为”也可译作“原来”，把下句理解为对前句的说明。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译：“他的两只脚”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹשֵׁב
  choice: 住在
  rationale: 该分词与城市名连用时表示居住；“住在”是现代汉语中自然、准确的表达。
- source_word: כִּי
  choice: 因为
  rationale: 此处自然地引出米非波设住在耶路撒冷的原因；同时用脚注保留也可作说明性连接词理解的可能。
- source_word: שֻׁלְחַן הַמֶּלֶךְ
  choice: 王的席上
  rationale: 既保留“王的桌席”这一意象，也符合汉语表达在王席间领受供应、与王同席吃饭的习惯。
- source_word: תָּמִיד
  choice: 常
  rationale: 表达持续、经常性的惯例；结合“吃饭”，比“不断”更自然，也不致误解为无间断地进食。
- source_word: אֹכֵל
  choice: 吃饭
  rationale: 该分词表示惯常行为；“常……吃饭”在现代汉语中自然地传达这一反复发生的行动。
- source_word: פִסֵּחַ
  choice: 瘸的
  rationale: 直接表达行动能力受损的状态，不采用语气更重或解释性更强的措辞。
- source_word: שְׁתֵּי רַגְלָיו
  choice: 双脚
  rationale: 原文直指“两只脚”；“双脚”简洁自然，并保持原文所说的具体身体部位。
- source_word: וְהוּא
  choice: 他……都是
  rationale: 另起一句作为总结性的状态说明；汉语不必机械译出连接词“而且”，仍保留其附加描述的功能。
