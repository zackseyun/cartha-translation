base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/009/012.yaml
  text: Mephibosheth had a young son[a], and his name was Mica[b]. And all who lived in the house of Ziba were servants to Mephibosheth.
translation:
  language: zh_hans
  text: 米非波设有一个年幼的儿子，名叫米迦。凡住在洗巴家里的人，都是米非波设的仆人[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “仆人”也可译作“奴仆”或“奴隶”；原词可涵盖不同程度的从属身份，须按上下文理解。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לִ/מְפִיבֹשֶׁת
  choice: 米非波设有
  rationale: 希伯来语以介词 לְ 构成所有关系，直译近似“归米非波设有”，现代汉语自然表达为“米非波设有”。句首连接词 וְ 融入叙事衔接，不机械译出。
- source_word: בֵּן קָטָן
  choice: 一个年幼的儿子
  rationale: בֵּן 意为“儿子”，קָטָן 在此说明年纪尚小；“年幼的儿子”比“幼小的儿子”更自然，也准确保留年龄含义。
- source_word: וּ/שְׁמ/וֹ מִיכָא
  choice: 名叫米迦
  rationale: 原文直译为“他的名字是米迦”。“名叫米迦”在现代汉语中简洁自然，并保留命名信息。מִיכָא 按通行圣经人名译作“米迦”。
- source_word: וְ/כֹל מוֹשַׁב בֵּית צִיבָא
  choice: 凡住在洗巴家里的人
  rationale: מוֹשַׁב 与居住、住处有关，在此集合性地指洗巴家中居住的人。“凡住在……的人”既贴近原文意象，又比笼统译作“全家”更少增添亲属关系的含义。
- source_word: עֲבָדִים
  choice: 仆人
  rationale: עֲבָדִים 可指仆人，也可指奴仆或奴隶；本段着重说明他们为米非波设效力的家务安排。“仆人”符合上下文，同时以脚注保留其可能涉及从属身份的词义范围。
- source_word: לִ/מְפִיבֹשֶׁת
  choice: 米非波设的
  rationale: 介词 לְ 在 עֲבָדִים 后表示服事对象或归属关系。汉语说“米非波设的仆人”自然简明，但不进一步断定其法律所有权。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。保留原文“住在洗巴家里的人”的居住表达，避免将其窄化为亲属意义上的“全家”。人名采用简体中文圣经传统译名“米非波设、米迦、洗巴”。英文咨询层的脚注标记与脚注内容明显错位，因此按希伯来原文将词义脚注置于“仆人”之后。
