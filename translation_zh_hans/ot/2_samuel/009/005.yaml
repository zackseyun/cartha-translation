  text: So King David sent and took him from the house of Machir son of Ammiel[a], from Lo-debar.
translation:
  language: zh_hans
  text: 于是，大卫王派人到罗底巴，从亚米利的儿子玛吉家中把他接来。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译可作：“大卫王派遣，并从罗底巴、亚米利的儿子玛吉的家中把他带走。”希伯来文依次使用“派遣”和“带走（取）”两个动词；按汉语习惯，正文译作“派人……接来”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: 派人去
  rationale: שׁלח的基本义是“派遣”。现代汉语在此补出泛指宾语“人”，自然表达王差人办理此事；“去”与后文的地点和“接来”形成清楚的方向关系。
- source_word: הַמֶּלֶךְ דָּוִד
  choice: 大卫王
  rationale: 将定冠词、王的称号和人名自然合译为现代汉语常用的“大卫王”。
- source_word: וַיִּקָּחֵהוּ
  choice: 把他……接来
  rationale: לקח基本义为“取、带走”。在王派人把米非波设带到自己面前的叙事语境中，“接来”既自然，也保留了使他从原处来到王这里的含义；脚注说明更贴近字面的表达。
- source_word: מִבֵּית
  choice: 从……家里
  rationale: בַּיִת可指房屋或家户；这里的“家里”自然保留两者之间的语义空间，没有明确限定为建筑或整个家族。
- source_word: מָכִיר בֶּן עַמִּיאֵל
  choice: 亚米利的儿子玛吉
  rationale: 按希伯来文亲子结构翻译，并采用现代中文圣经中通行的人名音译。
- source_word: מִלּוֹ דְבָר
  choice: 去罗底巴
  rationale: 将地名音译为“罗底巴”。为符合汉语语序，把希伯来文末尾第二次出现的介词短语前置，与“派人去”连接；地点仍明确是玛吉之家所在之处。
