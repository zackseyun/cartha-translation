  text: וַ/יֹּ֣אמֶר הַ/מֶּ֗לֶךְ הַ/אֶ֨פֶס ע֥וֹד אִישׁ֙ לְ/בֵ֣ית שָׁא֔וּל וְ/אֶעֱשֶׂ֥ה עִמּ֖/וֹ חֶ֣סֶד אֱלֹהִ֑ים וַ/יֹּ֤אמֶר צִיבָא֙ אֶל הַ/מֶּ֔לֶךְ ע֛וֹד בֵּ֥ן לִ/יהוֹנָתָ֖ן נְכֵ֥ה רַגְלָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/009/003.yaml
  text: Then the king said[a], “Is there still anyone left of the house of Saul, that I may show him the kindness of God?” Ziba said to the king, “There is still a son of Jonathan[b], crippled in his feet.”
translation:
  language: zh_hans
  text: 王说：“扫罗家还有人吗？好让我向他施以上帝的慈爱[a]。”洗巴对王说：“约拿单还有一个儿子，双脚有残疾[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “上帝的慈爱”也可译作“上帝信实的爱”或“上帝般的慈爱”。
    reason: 保留 חֶסֶד 所含忠贞相待的意味，以及 אֱלֹהִים 属格关系的解释空间。
  - marker: b
    text: 或译：“双脚瘸了。”
    reason: 提供 נְכֵה רַגְלָיִם 较为直译的传统表达。
lexical_decisions:
- source_word: הַאֶפֶס עוֹד אִישׁ לְבֵית שָׁאוּל
  choice: 扫罗家还有人吗
  rationale: 这一问句是在询问扫罗家是否仍有后人存留。译作“还有人吗”既自然，也避免把希伯来语疑问结构误解为断言“没有人”。“家”在这里指家族或宗族。
- source_word: וְאֶעֱשֶׂה עִמּוֹ
  choice: 好让我向他施
  rationale: 用目的表达“好让我”体现未完成式在此处的意愿意味；חֶסֶד 与“施”搭配符合现代汉语习惯。
- source_word: חֶסֶד אֱלֹהִים
  choice: 上帝的慈爱
  rationale: 保留原文属格结构及其可能的多重关系；“慈爱”兼有恩慈和忠贞相待的意味，而不在正文中把它限定为某一种神学解释。
- source_word: עוֹד בֵּן לִיהוֹנָתָן
  choice: 约拿单还有一个儿子
  rationale: 自然表达约拿单仍有一名儿子存世，并保留 עוֹד 所强调的“仍然、还有”。
- source_word: נְכֵה רַגְלָיִם
  choice: 双脚有残疾
  rationale: רַגְלָיִם 为双数形式，指两脚；“有残疾”准确说明行动能力受损，也比带有贬抑色彩的旧式说法更符合现代中文。
theological_decisions:
- issue: חֶסֶד אֱלֹהִים 的属格关系和 חֶסֶד 的内涵
  choice: 上帝的慈爱
  alternative: 上帝信实的爱；上帝般的慈爱
  rationale: 原文既可理解为源于或属于上帝的慈爱，也可能指与上帝相称、反映上帝品格的慈爱；חֶסֶד 本身还含忠贞相待的意味。正文保留宽广表达，脚注说明可能含义，不把经文收窄为单一解释。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“扫罗家”按上下文指扫罗的家族后裔；“双脚有残疾”使用清楚、中性的现代措辞。
