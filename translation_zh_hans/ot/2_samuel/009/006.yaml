base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/009/006.yaml
  text: Mephibosheth son of Jonathan, son of Saul, came to David and fell on his face and bowed down. David said, “Mephibosheth,” and he said, “Here is your servant.”
translation:
  language: zh_hans
  text: 约拿单的儿子、扫罗的孙子米非波设来到大卫面前，就俯伏在地，向他下拜。大卫说：“米非波设！”他回答：“仆人在这里。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּפֹּל עַל־פָּנָיו
  choice: 俯伏在地
  rationale: 直译为“俯伏在自己脸上”不合现代汉语习惯；“俯伏在地”自然表达以脸朝地伏下的动作。
- source_word: וַיִּשְׁתָּחוּ
  choice: 向他下拜
  rationale: 保留向君王俯身致敬、表示臣服的动作含义，并与前面的“俯伏在地”区分。
- source_word: הִנֵּה עַבְדֶּךָ
  choice: 仆人在这里
  rationale: 以自然的汉语回应方式表达“看哪，你的仆人”，保留米非波设以“仆人”自称的谦卑和臣属语气。
theological_decisions:
- issue: “仆人”的身份语气
  choice: 保留“仆人”这一自称
  alternative: 译作“我在这里”
  rationale: 原文明确使用עֶבֶד（仆人、臣仆）；保留该词呈现对君王的谦卑与臣属关系，不进一步限定为奴隶或官员。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言；按原文先说明约拿单之子，再补明扫罗之孙。对话简洁，符合宫廷场景。
