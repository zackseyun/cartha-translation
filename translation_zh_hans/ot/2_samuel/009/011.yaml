base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/009/011.yaml
  text: Ziba said to the king[a], “According to all that my lord the king commands his servant[b], so your servant will do.” And Mephibosheth ate at my table like one of the king’s sons.
translation:
  language: zh_hans
  text: 洗巴对王说：“我主我王所吩咐仆人的一切，您的仆人都必遵行。”米非波设在我的席上用饭，如同王的一个儿子。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文作“在我的席上”。这里的人称似乎转为大卫的口吻；有些古译本和现代译本译作“在王的席上”。
    reason: 说明马所拉文本保留的第一人称形式及其造成的说话视角难点。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 叙事中引出直接引语的常用表达，简洁自然。
- source_word: כְּכֹל אֲשֶׁר יְצַוֶּה
  choice: 怎样吩咐
  rationale: 以现代汉语的关联结构表达“凡……所吩咐的，都照样做”，保留命令与全面遵从之意。
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: 我主我王
  rationale: 保留宫廷语境中的尊称及两个第一人称领属形式，庄重而不生硬。
- source_word: עַבְדּוֹ / עַבְדֶּךָ
  choice: 仆人 / 王的仆人
  rationale: 这里是臣仆面对君王的自称，并非着重说明奴隶身份；后者用“王的仆人”自然表达希伯来语第二人称敬称“你的仆人”。
- source_word: כֵּן יַעֲשֶׂה
  choice: 就必怎样做
  rationale: 保留关联词“照样”一类的对应关系，并以“必”表达承诺服从的语气。
- source_word: אֹכֵל
  choice: 吃饭
  rationale: 分词可表达持续或惯常状态；汉语不强加进行体，以“在……席上吃饭”自然呈现长期获准同席的安排。
- source_word: עַל שֻׁלְחָנִי
  choice: 在我的席上
  rationale: 严格保留马所拉文本第一人称单数“我的”；“席上吃饭”是自然且庄重的汉语表达。
- source_word: כְּאַחַד מִבְּנֵי הַמֶּלֶךְ
  choice: 如同王的一个儿子
  rationale: 保留比较关系和王室家人般的身份待遇，不将其解释为实际收养关系。
theological_decisions:
- issue: 末句“我的席”说话者及人称转换
  choice: 正文保留“我的席”，不改写为“王的席”
  alternative: 将末句处理为叙述者总结，译作“在王的席上”
  rationale: 马所拉文本明确为 שֻׁלְחָנִי（“我的席”）。虽然这在洗巴的话之后造成说话视角突变，译文不应在正文中无声消除这一真实难点；脚注说明另一种处理。
- issue: אֹכֵל 的时态体貌
  choice: 译作不标明完成或进行体的“吃饭”
  alternative: 译作“正在吃饭”“常在……吃饭”或“吃了饭”
  rationale: 希伯来语分词具有持续、惯常或状态性的可能；现代汉语裸动词可避免过度限定，同时上下文仍显示这是持续享有的待遇。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“我主我王”保留宫廷敬语；“王的仆人”避免现代汉语中连续使用“你的仆人”可能产生的不自然感。正文保留原文“我的席”这一真实歧义，并以脚注交代其他文本与译法。
