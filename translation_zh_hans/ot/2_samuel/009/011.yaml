  naturalness: “在我的席上吃饭”可理解，但“用饭”更符合此处宫廷宴席和庄重叙事语体。将前半句改为“所吩咐仆人的一切”可使关联关系更清晰、自然。
  terminology: “我主我王”“仆人”“米非波设”及“王的一个儿子”均适切。第二个“你的仆人”译为“您的仆人”，既保留原文从第三人称“他的仆人”转为第二人称敬称的表达，也比“王的仆人”更明确自然。
