  text: וְ/עָבַ֣דְתָּ לּ֣/וֹ אֶֽת הָ/אֲדָמָ֡ה אַתָּה֩ וּ/בָנֶ֨י/ךָ וַ/עֲבָדֶ֜י/ךָ וְ/הֵבֵ֗אתָ וְ/הָיָ֨ה לְ/בֶן אֲדֹנֶ֤י/ךָ לֶּ֨חֶם֙ וַ/אֲכָל֔/וֹ וּ/מְפִיבֹ֨שֶׁת֙ בֶּן אֲדֹנֶ֔י/ךָ יֹאכַ֥ל תָּמִ֛יד לֶ֖חֶם עַל שֻׁלְחָנִ֑/י וּ/לְ/צִיבָ֗א חֲמִשָּׁ֥ה עָשָׂ֛ר בָּנִ֖ים וְ/עֶשְׂרִ֥ים עֲבָדִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/009/010.yaml
  text: You and your sons and your slaves shall work the land for him[a], and you shall bring in the produce, and it shall be bread for your master's son, and he shall eat it. But Mephibosheth, your master's son, shall always eat bread at my table. Now Ziba had fifteen sons and twenty slaves.
translation:
  language: zh_hans
  text: 你和你的儿子、奴仆要替他耕种土地，把收成运来，作为你主人之子的食物[a]，供他食用。但你主人之子米非波设要常在我的席上吃饭。”洗巴有十五个儿子、二十个奴仆。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文“饼”在这里也可泛指“食物”或“口粮”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָבַדְתָּ לּוֹ אֶת הָאֲדָמָה
  choice: 要替他耕种土地
  rationale: עבד以“土地”为宾语，在这里具体指为米非波设从事耕作；“替他耕种土地”自然保留了受益者和农业含义。
- source_word: אַתָּה וּבָנֶיךָ וַעֲבָדֶיךָ
  choice: 你和你的儿子、奴仆
  rationale: עֲבָדִים在这一家户劳作结构中指受主人支配的奴仆，而非现代意义上的雇员；“奴仆”既反映身份，也符合中文历史叙事语体。
- source_word: וְהֵבֵאתָ
  choice: 把收成运来
  rationale: 原文只明说“带来”，宾语由耕作语境补足；“收成”明确指出土地的出产，“运来”贴合收获后送交的情景。
- source_word: וְהָיָה לְבֶן אֲדֹנֶיךָ לֶּחֶם
  choice: 作为你主人之子的食物
  rationale: לֶחֶם可指具体的饼，也可泛指食物或口粮；此处田产用于供养，译作“食物”比字面的“饼”自然。
- source_word: וַאֲכָלוֹ
  choice: 供他食用
  rationale: 宾语后缀回指前述食物；此译清楚表达这些收成供主人之子食用，同时避免中文重复累赘。
- source_word: וּמְפִיבֹשֶׁת ... יֹאכַל תָּמִיד לֶחֶם עַל שֻׁלְחָנִי
  choice: 但你主人之子米非波设要常在我的席上吃饭
  rationale: 句首ו在语境中有转折作用，将田产供养与大卫亲自供席并置。“常”表达תָּמִיד，“在我的席上吃饭”自然传达持续享用王席的含义。
- source_word: וּלְצִיבָא חֲמִשָּׁה עָשָׂר בָּנִים וְעֶשְׂרִים עֲבָדִים
  choice: 洗巴有十五个儿子、二十个奴仆
  rationale: 这是无动词的背景说明，中文自然补出“有”。עֲבָדִים仍译“奴仆”，与前文身份用语保持一致。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“主人之子”保留原文关系称谓；“席上吃饭”比“桌上吃饼”更符合现代汉语，同时保留王席供养与接纳的意象。引号承接本节中大卫的话，末句转为叙述背景。
