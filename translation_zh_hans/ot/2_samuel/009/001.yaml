  text: וַ/יֹּ֣אמֶר דָּוִ֔ד הֲ/כִ֣י יֶשׁ ע֔וֹד אֲשֶׁ֥ר נוֹתַ֖ר לְ/בֵ֣ית שָׁא֑וּל וְ/אֶעֱשֶׂ֤ה עִמּ/וֹ֙ חֶ֔סֶד בַּ/עֲב֖וּר יְהוֹנָתָֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/009/001.yaml
  text: David said[a], “Is there still anyone left of the house of Saul, that I may show kindness to him for Jonathan’s sake?”
translation:
  language: zh_hans
  text: 大卫说：“扫罗家还有谁存留吗？我好因约拿单的缘故恩待他[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“以忠诚相待”或“施行守约的慈爱”。希伯来词不仅可指一般的恩慈，也常含忠诚、信守盟约的意味。
    reason: 保留חֶסֶד在本处可能具有的忠诚与盟约内涵。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: אמר是希伯来叙事中常用的“说”；虽然后接问句，保留“说”比改作“问”更贴近原文。
- source_word: הֲכִי יֶשׁ עוֹד
  choice: 还有……吗
  rationale: 疑问结构与יֶשׁ עוֹד共同询问是否仍有某人存在；“还有……吗”是自然、准确的现代汉语表达。
- source_word: אֲשֶׁר נוֹתַר
  choice: 人存留
  rationale: נותר指剩下、存留；“有人存留”既表达幸存之意，也避免生硬直译。
- source_word: לְבֵית שָׁאוּל
  choice: 扫罗家
  rationale: בית在此指家族或王室，不是建筑物；“扫罗家”保留家族与王朝两层可能含义。
- source_word: וְאֶעֱשֶׂה עִמּוֹ חֶסֶד
  choice: 我要……向他施恩慈
  rationale: עשה עם חסד是向某人施行恩慈的惯用结构。“施恩慈”表达实际善待，同时以脚注保留חֶסֶד的忠诚及盟约内涵。
- source_word: בַּעֲבוּר יְהוֹנָתָן
  choice: 因约拿单的缘故
  rationale: בַּעֲבוּר表示原因或所顾念的对象；此译自然地说明大卫善待对方是出于对约拿单的顾念。
theological_decisions:
- issue: חֶסֶד在大卫善待扫罗家之人的行动中所含的意义
  choice: 正文译作“恩慈”，并用脚注说明忠诚和守约的含义
  alternative: 忠诚之爱；以忠诚相待；信守盟约的慈爱
  rationale: 上下文所指是大卫因约拿单而采取的善待行动；“恩慈”适合现代汉语正文，但חֶסֶד不只是情感上的仁慈，也可能包含忠诚和守约意味，因此在脚注中保留这一张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“扫罗家”保留家族与王室含义；“有人存留吗”比“还有谁剩下”更自然，并传达幸存者的语境。
