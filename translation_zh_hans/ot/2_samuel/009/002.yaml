base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/009/002.yaml
  text: The house of Saul had a servant whose name was Ziba[a], and they called him to David. And the king said to him, “Are you Ziba?” And he said, “Your servant.”
translation:
  language: zh_hans
  text: 扫罗家有一个仆人，名叫洗巴。有人把他召到大卫面前。王问他：“你就是洗巴吗？”他回答：“正是仆人。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“你的仆人。”这是省略式回答，意思是“正是仆人”或“我是你的仆人”。
    reason: 保留希伯来语简短而恭敬的自称，并说明其隐含的肯定意义。
lexical_decisions:
- source_word: וּ/לְ/בֵית שָׁאוּל
  choice: 扫罗家有
  rationale: 希伯来语以介词短语表达所属与存在；现代汉语自然译作“扫罗家有”，不另加原文没有的时间副词。
- source_word: עֶבֶד
  choice: 一个仆人
  rationale: עֶבֶד 可指奴仆或仆役；此处是扫罗家中的属员或家仆，译作“仆人”既保留从属身份，也符合上下文。
- source_word: וּשְׁמוֹ צִיבָא
  choice: 名叫洗巴
  rationale: 这是希伯来叙事中常见的姓名介绍方式；“名叫洗巴”简洁自然。
- source_word: וַיִּקְרְאוּ לוֹ אֶל־דָּוִד
  choice: 有人把他召到大卫那里
  rationale: קרא 在此表示传召；动词为复数而主语未明，译作“有人”避免凭空指定具体人物。
- source_word: הַמֶּלֶךְ
  choice: 王
  rationale: 定冠词所指为大卫；在中文叙事中用“王”自然且明确。
- source_word: הַאַתָּה צִיבָא
  choice: 你就是洗巴吗？
  rationale: 疑问词加独立代词构成身份确认问句；“就是”传达确认语气，而不增加实质信息。
- source_word: עַבְדֶּךָ
  choice: 仆人正是
  rationale: 原文直译为“你的仆人”，是省略式、恭敬的自称兼肯定回答；中文以“仆人正是”保留宫廷式谦称并使应答自然。
