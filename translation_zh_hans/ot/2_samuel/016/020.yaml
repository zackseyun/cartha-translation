  text: Then Absalom said to Ahithophel, “Give your advice. What should we do?”
translation:
  language: zh_hans
  text: 押沙龙对亚希多弗说：“你们出个主意吧，我们该怎么办？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָבוּ לָכֶם עֵצָה
  choice: 你们出个主意吧
  rationale: “הָבוּ”是复数祈使式，“לָכֶם”也是复数形式，因此保留对多人说话的语法特征；“出个主意”自然传达提出谋略或建议之意。
- source_word: מַה נַּעֲשֶׂה
  choice: 我们该怎么办
  rationale: 第一人称复数未完成式在疑问句中表达征询应采取何种行动；译为“我们该怎么办”准确而自然。
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 叙事中的常用引语公式；本节承接上下文，中文无需机械加入“于是”也能保持流畅。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而口语自然的叙事表达。原文先以单数形式称呼亚希多弗，随后用复数“你们”提出请求，可能是面向亚希多弗及在场众人；译文保留这一转换，不替原文消除其张力。
