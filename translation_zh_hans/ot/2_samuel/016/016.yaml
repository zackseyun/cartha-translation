base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/016.yaml
  text: And when Hushai the Archite[a], David’s friend, came to Absalom, Hushai said to Absalom, “Long live the king! Long live the king!”
translation:
  language: zh_hans
  text: 亚基人户筛，就是大卫的朋友，来到押沙龙那里时，便对押沙龙说：“王万岁！王万岁！”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“愿王活着！”希伯来语这句话是拥戴君王的欢呼语。
    reason: 说明祈愿式原文的较直译表达及其王室欢呼功能。
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: ……时，便……
  rationale: 以现代汉语的时间从句承接叙事，保留事件的先后关系，避免生硬直译“事情发生在……的时候”。
- source_word: בָּא
  choice: 来到
  rationale: 表示户筛抵达押沙龙所在之处；“来到”自然体现朝向相关人物的移动。
- source_word: חוּשַׁי הָאַרְכִּי
  choice: 亚基人户筛
  rationale: 按现代中文圣经常见方式音译人名，并以“亚基人”表达族属或地域称谓 הָאַרְכִּי。
- source_word: רֵעֶה דָוִד
  choice: 大卫的朋友
  rationale: 忠实表达所属结构及户筛与大卫的个人、政治关系，不额外限定其官职性质。
- source_word: אֶל אַבְשָׁלוֹם
  choice: 来到押沙龙那里／对押沙龙
  rationale: 介词 אֶל 在两个分句中分别表示移动的目标和说话的对象，依汉语习惯分别处理。
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 采用引出直接引语的标准现代汉语表达。
- source_word: יְחִי הַמֶּלֶךְ
  choice: 王万岁！
  rationale: 这是现代汉语中自然、庄重的拥王欢呼语，传达希伯来语祈愿式的语用功能；其较直译形式收入脚注。
- source_word: יְחִי הַמֶּלֶךְ（重复）
  choice: 王万岁！王万岁！
  rationale: 完整保留原文重复，以表现公开欢呼的强调效果，同时不消解户筛忠诚对象所形成的叙事张力。
theological_decisions:
- issue: 户筛向押沙龙欢呼时所含的策略性歧义
  choice: 照原文保留标准的拥王欢呼，不明说讽刺、欺骗或“王”另有所指
  alternative: 在正文中加入“假意”、讽刺语气，或明确说明户筛心中所指的是大卫
  rationale: 本节只记录一项本身可以按通常意义理解的王室欢呼；其深层意图须由上下文呈现。译文不应替叙述者预先判定或解释。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。专名沿用中文圣经中通行的“户筛、押沙龙、大卫、亚基人”。以插入语“就是大卫的朋友”清楚保留同位说明；欢呼简洁有力，并保留原文的两次重复。
