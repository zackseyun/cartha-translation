base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/010.yaml
  text: But the king said[a], “What have I to do with you, sons of Zeruiah? If he is cursing because Yahweh has said to him, ‘Curse David,’ then who can say, ‘Why have you done so?’”
translation:
  language: zh_hans
  text: 王却说：“洗鲁雅的儿子们，我与你们有什么相干？若[a]他咒骂，是因耶和华对他说：‘咒骂大卫’，那么谁能说：‘你为什么这样做？’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他咒骂，是因耶和华对他说：‘咒骂大卫。’”希伯来文的连接词也可作解释性理解，而非条件性理解。
    reason: alternative_reading
lexical_decisions:
- source_word: מַה לִּי וְלָכֶם
  choice: 我跟你们有什么相干
  rationale: 这是表示疏远或斥责的希伯来语惯用语，并非询问彼此拥有什么；此译自然地表达大卫拒绝洗鲁雅众子的主张。
- source_word: בְּנֵי צְרֻיָה
  choice: 洗鲁雅的儿子们
  rationale: 按构造词组直译，指约押和亚比筛；“洗鲁雅”沿用现代中文圣经人名的通行译法。
- source_word: יְקַלֵּל / קַלֵּל
  choice: 咒骂／咒骂
  rationale: 原词在此指向大卫发出辱骂和诅咒；前后统一译作“咒骂”，保留限定动词与引语中命令式的词汇呼应。
- source_word: כִּי ... וְכִי
  choice: 若……是因为
  rationale: 两个连接词的句法存在歧义；正文按条件—原因关系处理，表达大卫所提出的可能性，同时以脚注保留解释性读法。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文读者熟悉的神名译法，明确呈现原文专名，而不以一般称号代替。
- source_word: אָמַר לוֹ
  choice: 对他说
  rationale: 简洁呈现完成式所指的先前话语；中文语境已清楚表明这话是当前咒骂行为的原因，无须额外标明时态。
- source_word: וּמִי יֹאמַר
  choice: 那么谁能说
  rationale: “那么”显明条件句的推论关系，“谁能说”传达反问所包含的资格或权柄意味，而不只表示将来。
- source_word: מַדּוּעַ עָשִׂיתָה כֵּן
  choice: 你为什么这样做
  rationale: 以自然、简洁的现代汉语保留对其行为提出质问的直接引语。
theological_decisions:
- issue: 耶和华与示每咒骂之间的关系
  choice: 正文让大卫提出一种可能：示每咒骂是因为耶和华曾吩咐他，并保留“咒骂大卫”这一直接命令的措辞。
  alternative: 可弱化为耶和华仅仅准许此事，或强化为不带任何条件语气的确定性直接命令。
  rationale: 希伯来文明确写耶和华对他说“咒骂大卫”，而句首连接词又容许条件性理解；译文不把“吩咐”改成“准许”，也不消除句法本身的不确定性，从而保留神学张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“王却说”承接上文的反向回应；“我跟你们有什么相干”保留原文斥责性的惯用语力度。引号和脚注标记按简体中文出版格式处理。
