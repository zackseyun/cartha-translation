base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/001.yaml
  text: When David had passed a little beyond the summit[a], behold, Ziba the servant of Mephibosheth was there to meet him, with a pair of saddled donkeys, and on them were two hundred loaves of bread, a hundred clusters of raisins, a hundred summer fruits[c][b], and a skin of wine.
translation:
  language: zh_hans
  text: 大卫刚越过山顶一点[a]，看哪，米非波设的仆人洗巴[b]迎面而来，带着两匹备好鞍的驴；驴上驮着二百个饼、一百串葡萄干、一百份夏果[c]和一皮袋酒。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“刚过山顶不远”。希伯来文直译近于“从头部过去一点”；“头部”在这里是指山岭或山丘的顶部。
    reason: lexical_alternative
  - marker: b
    text: “仆人”也可译为“年轻人”或“侍从”；这里的上下文侧重洗巴作为米非波设仆人的身份。
    reason: lexical_alternative
  - marker: c
    text: “夏果”可能更具体地指无花果，但希伯来词本身含义较广。
    reason: lexical_alternative
lexical_decisions:
- source_word: מְעַט מֵהָרֹאשׁ
  choice: 刚走过山顶不远
  rationale: 原文直译近于“离开头部一点”；רֹאשׁ在此为地形用语，指山顶。译文自然表达大卫已越过山顶一小段距离，同时以脚注保留较直译的可能。
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留原文提示突现、增强叙事现场感的话语标记，不将其弱化为单纯的“有”。
- source_word: נַעַר מְפִי בֹשֶׁת
  choice: 米非波设的仆人
  rationale: נַעַר可指年轻人、侍从或仆人；这里强调洗巴与米非波设的从属关系，“仆人”最合上下文，并以脚注提示词义范围。
- source_word: צֶמֶד חֲמֹרִים
  choice: 两匹驴
  rationale: צֶמֶד表示一对；现代汉语直接译作“两匹驴”清楚自然，且不额外暗示两驴套在同一轭下。
- source_word: חֲבֻשִׁים
  choice: 备好鞍的
  rationale: 该被动分词在牲畜语境中表示已配备妥当，通常指备鞍；此译既切合场景，也比“捆绑的”准确。
- source_word: מָאתַיִם לֶחֶם
  choice: 二百个饼
  rationale: לֶחֶם在此为可计数的饼；“个”符合现代汉语计量习惯，避免误读为重量或总量。
- source_word: צִמּוּקִים
  choice: 一百串葡萄干
  rationale: 该词指干葡萄或压聚成串、成团的葡萄干；“串葡萄干”保留其可计数形式，而不确定地将其限定为葡萄干饼。
- source_word: קַיִץ
  choice: 夏季果子
  rationale: 该词广义指夏季收获的果子，在某些语境中可能特指无花果；正文保留较宽泛的词义，脚注说明较具体的可能。
- source_word: נֵבֶל יָיִן
  choice: 一皮袋酒
  rationale: נֵבֶל在此指盛酒的皮制容器；“一皮袋酒”简洁、符合古代物质文化，也自然表达容器兼数量。
