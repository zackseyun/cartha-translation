  text: וַ/יֹּ֣אמֶר חוּשַׁי֮ אֶל אַבְשָׁלֹם֒ לֹ֕א כִּי֩ אֲשֶׁ֨ר בָּחַ֧ר יְהוָ֛ה וְ/הָ/עָ֥ם הַ/זֶּ֖ה וְ/כָל אִ֣ישׁ יִשְׂרָאֵ֑ל לא אֶהְיֶ֖ה וְ/אִתּ֥/וֹ אֵשֵֽׁב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/018.yaml
  text: Hushai said to Absalom[a], “No, for the one whom Yahweh and this people and all the men of Israel have chosen—I will be his[c][b], and with him I will remain.”
translation:
  language: zh_hans
  text: 户筛对押沙龙说：“不；我必归属雅威、这百姓和以色列所有男子所拣选的那一位，也必留在他身边。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֹא כִּי
  choice: 不！
  rationale: 该组合在这里先作强烈否定，随后以 כִּי 引出更正或理由。汉语用“不！”自然保留反驳力度，后文直接说明其立场，不必机械译出连接词。
- source_word: אֲשֶׁר בָּחַר
  choice: 所拣选的那一位
  rationale: 关系从句指向语境中已在讨论的特定人物；“那一位”既补足汉语中心语，也保留户筛话语中可被双重理解的指向。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以常见的现代汉语音译呈现四字神名，保留其专名性质，不以称号替代。
- source_word: וְהָעָם הַזֶּה
  choice: 这民
  rationale: 保留原文单数集合名词及近指形式；“这民”简洁庄重，在历史叙事和直接引语中可懂。
- source_word: וְכָל אִישׁ יִשְׂרָאֵל
  choice: 和以色列众人
  rationale: 原文直译近于“以色列的每一个人”。现代汉语“以色列众人”自然表达其分布性和整体范围，同时避免误解为一名叫“以色列”的男子。
- source_word: לא אֶהְיֶה
  choice: 我必归属他
  rationale: 马所拉文本写作 לא，但此处按上下文通常理解为 לו（‘归他、属他’）的同音书写或隐含关系；“归属他”明确表达效忠，又不额外指定政治职分。
- source_word: וְאִתּוֹ אֵשֵׁב
  choice: 也必与他同住
  rationale: יָשַׁב 可指坐、居住或留下；这里表示持续留在所拥护者身边。“同住”贴近基本词义，并能自然表达继续相伴。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文使用神的专名。采用“雅威”保留专名，并避免用“主”这一称号取代；“耶和华”是汉语传统形式，但较不直接反映学界通常重构的读音。
- issue: 户筛效忠对象的语用歧义
  choice: 保留“所拣选的那一位”的开放指向
  alternative: 明确译成押沙龙或大卫
  rationale: 户筛的话表面可让押沙龙理解为指自己，但叙事语境也容许其暗指大卫。译文不替读者消解这种刻意的双关和叙事张力。
- issue: לא אֶהְיֶה 的文本困难
  choice: 按语境译为“我必归属他”
  alternative: 照辅音直译为“我岂不……？”或“我不……”
  rationale: 现存辅音可读作否定词 לא，但句法和上下文强烈支持 לו אֶהְיֶה（“我必归他”）或带反问意味的理解。正文采用最连贯的效忠含义，而不武断扩充其对象。
translation_notes:
  register: 采用现代、庄重而清楚的叙事用语。“不！”保留当面反驳的力度；“归属他”与“同住”体现宫廷效忠语境。刻意不明确“那一位”究竟是押沙龙还是大卫，以保存原话的策略性歧义。
