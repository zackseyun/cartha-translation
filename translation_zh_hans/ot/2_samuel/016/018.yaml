  rationale: 修订保留原话中“那一位”的策略性所指歧义，明确呈现“以色列所有男子”的原文范围，并以“留在他身边”表达持续相伴、效忠的语境含义。新增脚注说明לא与传统读法לו的文本困难，避免把有争议的读法无提示地当作无歧义正文。
