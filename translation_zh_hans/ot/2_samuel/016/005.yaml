base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/005.yaml
  text: When King David came to Bahurim[a], behold, a man came out from there, from the clan of the house of Saul, whose name was Shimei son of Gera; he came out continually, cursing as he came.
translation:
  language: zh_hans
  text: 大卫王到了巴户琳；看哪，有一个人从那里出来，是扫罗家族一个宗族的人，名叫示每，是基拉的儿子；他不断地出来，同时咒骂。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“他不断出来，并且咒骂”。希伯来文以分词加同源绝对不定式强化“出来”这一动作，可能表示动作反复或持续进行。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָא הַמֶּלֶךְ דָּוִד עַד בַּחוּרִים
  choice: 大卫王到了巴户琳
  rationale: 叙事中的连接词加完成式推进情节；עַד表示抵达该地。中文用“到了”自然地保留抵达事件。
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留希伯来语提示读者注意突发场景的鲜明指示语气，同时符合庄重的叙事文体。
- source_word: מִשָּׁם אִישׁ יוֹצֵא
  choice: 有一个人从那里出来
  rationale: 分词描写人物在场景中出现；中文这样表达自然，也保留“从那里”的空间指向。
- source_word: מִמִּשְׁפַּחַת בֵּית שָׁאוּל
  choice: 他是扫罗家族的人
  rationale: מִשְׁפָּחָה指亲族群体，בֵּית שָׁאוּל带有家系或王朝含义；“扫罗家族”在现代中文中简明地涵盖两者。
- source_word: וּשְׁמוֹ שִׁמְעִי בֶן גֵּרָא
  choice: 名叫示每，是基拉的儿子
  rationale: 保留希伯来文的姓名与父名识别公式，并采用自然的现代汉语句式。
- source_word: יֹצֵא יָצוֹא
  choice: 一边走出来，一边不停地
  rationale: 分词加同源绝对不定式强化动作，可表达持续或反复进行；“不停地”传达其强化与延续性，同时不武断限定为单次或多次。
- source_word: וּמְקַלֵּל
  choice: 咒骂
  rationale: 该分词表示与“出来”同时持续的行为；“咒骂”准确而自然。
