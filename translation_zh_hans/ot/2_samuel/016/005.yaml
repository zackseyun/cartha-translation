  terminology: 巴户琳、示每、基拉均为常见圣经中文专名。将“扫罗家族的人”调整为“扫罗家族一个宗族的人”，较清楚地反映“扫罗家”的内部宗族/亲族群体，而不将其仅泛化为家族成员。
