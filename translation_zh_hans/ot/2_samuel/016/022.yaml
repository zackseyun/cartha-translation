base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/022.yaml
  text: So they pitched the tent for Absalom on the roof[a], and Absalom went in to his father's concubines in the sight of all Israel.
translation:
  language: zh_hans
  text: 于是，他们为押沙龙在屋顶上搭起了帐篷；押沙龙就在全以色列人眼前[a]与他父亲的侍妾同房。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“当着全以色列人的面”或“让全以色列人都看见”。
    reason: 说明לְעֵינֵי כָּל יִשְׂרָאֵל可用不同汉语措辞表达其公开、可见的含义。
lexical_decisions:
- source_word: וַיַּטּוּ
  choice: 支搭
  rationale: נטה用于帐篷时指展开并搭设；“支搭”在现代汉语中自然，也保留具体动作。
- source_word: הָאֹהֶל
  choice: 帐篷
  rationale: 名词带定冠词，指为这次公开行动所搭设的特定帐篷；汉语通常不必另加“那”。
- source_word: עַל הַגָּג
  choice: 在屋顶上
  rationale: 直接表达גָּג所指的平顶屋顶，并保留行动公开可见的场所背景。
- source_word: וַיָּבֹא ... אֶל
  choice: 与……同房
  rationale: 希伯来语“进入……那里”在此是指性关系的委婉语；“同房”是庄重而意义明确的现代汉语对应，既不过度直白，也不误作单纯进入帐篷。
- source_word: פִּלַגְשֵׁי אָבִיו
  choice: 他父亲的妃嫔
  rationale: “妃嫔”适合君王家室语境，准确表达这些女子是其父大卫的次等妻室或妾室。
- source_word: לְעֵינֵי כָּל יִשְׂרָאֵל
  choice: 就在以色列众人眼前
  rationale: 贴近“向着全以色列的眼睛”这一表达，突出事件公开发生并为众人所见；“就在”加强原文所含的公开性而不增加新的事件内容。
theological_decisions:
- issue: 在王位篡夺及道德审判语境中如何处理性行为的委婉语
  choice: 译作“与他父亲的妃嫔同房”
  alternative: “进到他父亲的妃嫔那里”或“与他父亲的妃嫔发生性关系”
  rationale: 若逐字译为“进到……那里”，现代读者可能只理解为移动；若译作“发生性关系”则较临床化且过于直白。“同房”保留原文的委婉、庄重和明确含义，也不额外强化或淡化其道德性质。
translation_notes:
  register: 采用庄重而通俗的现代标准汉语。“于是”承接上文谋划；分号保持本节先搭帐篷、后实施行动的叙事次序。脚注标记置于整句末，所注释的是“就在以色列众人眼前”。
