base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/015.yaml
  text: Absalom and all the people[a], the men of Israel, came to Jerusalem, and Ahithophel was with him.
translation:
  language: zh_hans
  text: 押沙龙和所有民众，就是以色列众人[a]，来到耶路撒冷；亚希多弗也和他在一起。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译：“所有民众，以色列的每一个人”，或“所有民众，以色列众人”。
    reason: 保留 אִישׁ יִשְׂרָאֵל 既可作分布性表达，也可作对“所有民众”的同位说明这一语义空间。
lexical_decisions:
- source_word: וְ/אַבְשָׁל֗וֹם
  choice: 押沙龙
  rationale: 采用现代中文圣经中通行的人名译法；句首连接词在中文叙事中无需机械译出。
- source_word: וְ/כָל הָ/עָם֙ אִ֣ישׁ יִשְׂרָאֵ֔ל
  choice: 和所有跟随他的民众，就是以色列众人
  rationale: עָם 译为“民众”；“跟随他的”由语境补明其所指群体。将 אִישׁ יִשְׂרָאֵל 理解为同位说明，以“就是以色列众人”保留整体兼具个体分布的含义，并用脚注注明较直译形式。
- source_word: בָּ֖אוּ יְרוּשָׁלִָ֑ם
  choice: 都来到耶路撒冷
  rationale: בוא 在此表示到达目的地；中文自然表达为“来到耶路撒冷”。“都”呼应复数主语及“所有”。
- source_word: וַ/אֲחִיתֹ֖פֶל אִתּֽ/וֹ
  choice: 亚希多弗也与他同来
  rationale: 希伯来文末句省略显式动词，承接前面的“来到”；中文以“同来”自然补足。代词按上下文指押沙龙。
theological_decisions: []
