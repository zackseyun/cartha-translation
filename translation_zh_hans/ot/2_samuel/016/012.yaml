base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/012.yaml
  text: Perhaps Yahweh will look on my affliction[a], and Yahweh will repay me with good in place of his cursing this day.
translation:
  language: zh_hans
  text: 也许雅威会看顾我的苦难[a]；雅威会以好处回报我，代替那人今天的咒骂。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或照书写形式译作“我的罪孽”。
    reason: textual_variant
lexical_decisions:
- source_word: אוּלַי
  choice: 也许
  rationale: 表达大卫带着盼望却不确定的语气，不把他的期待说成确信。
- source_word: יִרְאֶה
  choice: 会看顾
  rationale: ראה与介词ב连用，在这里不只是视觉上的“看见”，也含留意、眷顾之意；“看顾”自然地传达这种关注。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按神名本身音译，保留以色列上帝的专名，而不以称号替代。
- source_word: ב/עונ/י
  choice: 我的苦难
  rationale: 正文采用传统诵读所指的“我的苦难/困苦”，与大卫当时受辱被骂的处境相合；书写形式可能表示“我的罪孽”，故收入脚注。
- source_word: וְהֵשִׁיב יְהוָה לִי טוֹבָה
  choice: 以好处报偿我
  rationale: שוב的使役式在此结合“好处”表达回报；“以好处报偿我”清楚保留有利回报的意思。中文可省略第二次神名而仍明确主语。
- source_word: תַּחַת
  choice: 代替
  rationale: 准确表达替换或交换关系，即以好处取代咒骂。
- source_word: קִלְלָתוֹ
  choice: 他……对我的咒骂
  rationale: 保留第三人称所属关系，并以“咒骂”呈现示每持续辱骂的言语行为。
- source_word: הַיּוֹם הַזֶּה
  choice: 今天
  rationale: 自然、准确地表达强调当前这一天的时间短语。
theological_decisions:
- issue: ב/עונ/י的书写形式与诵读传统
  choice: 正文作“我的苦难”
  alternative: “我的罪孽”
  rationale: 传统诵读及上下文更支持大卫所受的困苦；但辅音书写形式可指“我的罪孽”。正文采用语境较顺的读法，同时以脚注保留真实的文本张力。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“也许”保留试探性的盼望；“看顾”兼顾希伯来语的视觉意象与留意之义。正文中的[a]与脚注对应。
