source:
  edition: WLC
  text: וְ/כֹֽה אָמַ֥ר שִׁמְעִ֖י בְּ/קַֽלְל֑/וֹ צֵ֥א צֵ֛א אִ֥ישׁ הַ/דָּמִ֖ים וְ/אִ֥ישׁ הַ/בְּלִיָּֽעַל־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/007.yaml
  text: And Shimei said as he cursed him[a], “Get out, get out[b], man of bloodshed and worthless man!”
translation:
  language: zh_hans
  text: 示每咒骂他时这样说：“滚吧！滚吧！你这血债累累的人[a]，你这卑劣之徒[b]！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“血的人”；希伯来语用复数“血”，在这里指流血之事或流血所带来的罪责。也可译作“流人血的人”。
    reason: lexical_alternative
  - marker: b
    text: 或译“恶人”。这里的希伯来语是指卑劣、邪恶或毫无价值的人，不一定是专名“彼列”。
    reason: alternative_reading
lexical_decisions:
- source_word: וְכֹה אָמַר
  choice: 这样说
  rationale: כֹה 引出随后话语的内容或方式；“这样说”在现代汉语叙事中自然，也保留了“如此说”的语义。
- source_word: שִׁמְעִי
  choice: 示每
  rationale: 采用现代中文圣经中通行的人名译法。
- source_word: בְּקַלְלוֹ
  choice: 咒骂他时
  rationale: 介词 בְּ 加不定词构造及第三人称阳性单数后缀，表示与主句同时发生的动作；“他”依语法指受咒骂者，语境中即大卫。
- source_word: צֵא צֵא
  choice: 滚吧！滚吧！
  rationale: 重复的命令式带有强烈驱逐和斥责语气。“滚吧”比中性的“出去吧”更贴合此处咒骂性言辞，并保留重复所产生的加强作用。
- source_word: אִישׁ הַדָּמִים
  choice: 血债累累的人
  rationale: דָּמִים 字面为复数“血”，在此是涉及流血、血债或杀人罪责的习语。“血债累累”传达其指控性的含义，而不额外断定嗜血动机。
- source_word: וְאִישׁ הַבְּלִיָּעַל
  choice: 你这卑劣之徒
  rationale: בְּלִיָּעַל 在本处是表示卑劣、邪恶或毫无价值的侮辱语，并非必须视为专名。“卑劣之徒”符合现代汉语的辱骂语体，也承接前一称呼。
theological_decisions:
- issue: בְּלִיָּעַל 应译作普通名词还是专名
  choice: 按普通名词性侮辱语译为“卑劣之徒”
  alternative: “恶人”；“彼列之徒”
  rationale: 在本节的旧约语境中，该词指道德上卑劣、邪恶或无价值的人。译作专名“彼列”容易带入后期人格化或邪灵化的联想，而本节并不要求这种理解。
- issue: אִישׁ הַדָּמִים 所表达的指控
  choice: 译为“血债累累的人”
  alternative: “流人血的人”；“血人”
  rationale: 希伯来语复数“血”可指流血事件及其罪责。此译保留示每对大卫负有血债的指控，但不把它强化为对大卫内在嗜血倾向的断言。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。直接引语保留原文粗厉的咒骂语气；以两个“滚吧”再现命令式重复的强度。两个“你这……”形成汉语中的平行辱骂结构，同时对应原文两次 אִישׁ。
