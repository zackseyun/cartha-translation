  text: וַ/יֹּ֤אמֶר אֲחִיתֹ֨פֶל֙ אֶל אַבְשָׁלֹ֔ם בּ֚וֹא אֶל פִּלַגְשֵׁ֣י אָבִ֔י/ךָ אֲשֶׁ֥ר הִנִּ֖יחַ לִ/שְׁמ֣וֹר הַ/בָּ֑יִת וְ/שָׁמַ֤ע כָּל יִשְׂרָאֵל֙ כִּֽי נִבְאַ֣שְׁתָּ אֶת אָבִ֔י/ךָ וְ/חָ֣זְק֔וּ יְדֵ֖י כָּל אֲשֶׁ֥ר אִתָּֽ/ךְ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/021.yaml
  text: Ahithophel said to Absalom[a], “Go in to your father’s concubines, whom he left to keep the house, and all Israel will hear that you have become odious to your father[c][b], and the hands of all who are with you will be strengthened.”
translation:
  language: zh_hans
  text: 亚希多弗对押沙龙说：“你去与你父亲的妃嫔[a]同房，就是他留下看守王宫的妃嫔。这样，全以色列都会听说你已成为你父亲所厌恶的人[b]，所有跟随你的人都会更有胆量[c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “同房”对应原文“进去到……那里”，是指发生性关系的委婉说法。
    reason: lexical_alternative
  - marker: b
    text: 原文动词带有“变臭、变得令人厌恶”的形象；也可译作“你已在你父亲面前变得可憎”。
    reason: lexical_alternative
  - marker: c
    text: 原文直译为“所有与你同在之人的手会坚固起来”，是指他们会受到鼓舞，更有勇气和决心。
    reason: lexical_alternative
lexical_decisions:
- source_word: בּוֹא אֶל
  choice: 去亲近
  rationale: 此处是指发生性关系的委婉语。现代汉语“亲近”保留含蓄庄重的表达，并由宾语和上下文明确其含义。
- source_word: פִּלַגְשֵׁי
  choice: 妃嫔
  rationale: 在王室语境中，指具有较低婚姻地位的女性伴侣；“妃嫔”比日常用语“妾”更符合大卫王室背景。
- source_word: הִנִּיחַ לִשְׁמוֹר הַבָּיִת
  choice: 留下看守宫殿
  rationale: שׁמר在这里有照管、守护之意；הבית在王室叙事中指王宫，而不只是一般住宅。
- source_word: וְשָׁמַע כָּל יִשְׂרָאֵל
  choice: 这样，全以色列都会听说
  rationale: 在命令之后，此句表达预期结果；“全以色列”保留对以色列民整体的集体称呼。
- source_word: נִבְאַשְׁתָּ אֶת אָבִיךָ
  choice: 你已经成了你父亲所厌恶的人
  rationale: נבאש字面带有变臭、变得令人憎恶的形象，此处指押沙龙将彻底开罪父亲。“成了……所厌恶的人”自然表达其结果，又不淡化原文力度。
- source_word: וְחָזְקוּ יְדֵי
  choice: 就都会更有胆量
  rationale: 原文“手得坚固”是勇气和决心得到增强的习语；正文用自然现代汉语表达，脚注保留原有意象。
- source_word: כָּל אֲשֶׁר אִתָּךְ
  choice: 所有跟随你的人
  rationale: 指站在押沙龙一方、与他共同行动的人；“跟随你的人”比单纯“与你同在的人”更符合现代汉语和政治语境。
theological_decisions:
- issue: 王权斗争中的性行为委婉语
  choice: 用“你去亲近你父亲的妃嫔”含蓄而清楚地表达性关系
  alternative: “你去与父亲的妃嫔同房”或“你去睡你父亲的妃嫔”
  rationale: 保留希伯来文的委婉和叙事庄重感，同时不掩盖该行为在公开宣告与大卫彻底决裂方面的政治意义。
- issue: נִבְאַשְׁתָּ אֶת אָבִיךָ的关系含义
  choice: “你已经成了你父亲所厌恶的人”
  alternative: “你已经使自己在父亲面前成为臭名”或“你已经彻底得罪了父亲”
  rationale: 该结构表达押沙龙在父亲那里变得可憎、令人反感。所选译法保留强烈的关系破裂含义，不把原文缩减为一般性的冒犯。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“亲近”避免粗俗，同时由脚注澄清；“妃嫔”“宫殿”体现王室场景；结果关系以“这样……就……”自然呈现。
