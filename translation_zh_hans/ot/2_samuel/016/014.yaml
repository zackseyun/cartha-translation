base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/014.yaml
  text: The king and all the people who were with him arrived weary[b][a], and they refreshed themselves there.
translation:
  language: zh_hans
  text: 王和所有与他同行的众人抵达时都疲惫不堪；他便在那里歇息，恢复了精神。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文动词为单数，可译为“他便在那里歇息，恢复了精神”；也可按集合性用法理解，译为“他们便在那里歇息，恢复了精神”。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּבֹא
  choice: 抵达
  rationale: בוא在这里表示来到行程中的一个落脚处；“抵达”自然地突出到达这一结果。
- source_word: הַמֶּלֶךְ
  choice: 王
  rationale: 保留希伯来文所用的称号，不以其具体所指“大卫”取代。
- source_word: וְכָל הָעָם אֲשֶׁר אִתּוֹ
  choice: 和所有跟随他的人
  rationale: 准确表达“所有与他同在的人”；在行旅语境中，“跟随他的人”比直译“和他在一起的人”更自然。
- source_word: עֲיֵפִים
  choice: 都已疲惫不堪
  rationale: 该复数形容词描述王和众人因行程而疲乏；“疲惫不堪”清楚传达强烈的身体疲劳。
- source_word: וַיִּנָּפֵשׁ
  choice: 他便……歇息，恢复了精神
  rationale: 动词为第三人称阳性单数，基本意象是喘息后恢复、重新振作；这一表达既保留单数，也兼顾“歇息”和“恢复精神”的语义。
- source_word: שָׁם
  choice: 在那里
  rationale: 直接表达动作发生的地点。
theological_decisions:
- issue: וַיִּנָּפֵשׁ的单数主语与前文复数组合主语之间的张力
  choice: 正文译作“他便……”，保留希伯来文的单数形式
  alternative: 按集合意义译作“他们便……”
  rationale: 希伯来文动词明确为单数，最自然地回指“王”；但也有人将其理解为由王代表全队的集合性叙述，因此以脚注保留另一种理解。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“歇息，恢复了精神”避免只译作较单薄的“休息”，同时自然呈现原词所含恢复气力之意。
