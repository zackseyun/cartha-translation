base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/013.yaml
  text: So David and his men went on the road[a], while Shimei went along on the hillside opposite him, going along and cursing[c][b], and throwing stones opposite him and flinging dust.
translation:
  language: zh_hans
  text: 大卫和跟随他的人沿路前行；示每则在他对面的山坡上边走边咒骂[a]，又朝他那边扔石头，抛撒尘土。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文重复“走”的意思，强调示每一路持续咒骂。
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּדָּרֶךְ
  choice: 沿路
  rationale: דֶּרֶךְ在此指行进的道路；“沿路前行”既自然，也保留具体的行路场景。
- source_word: בְּצֵלַע הָהָר
  choice: 在……山坡上
  rationale: צֵלַע本义为“侧面、侧边”，与“山”连用表示山的一侧；现代汉语用“山坡”简洁自然。
- source_word: לְעֻמָּתוֹ
  choice: 在他对面／朝他那边
  rationale: 该词在原文出现两次，表达空间上的相对位置。首次译为“在他对面”，第二次译为“朝他那边”，既保留重复的空间关系，又避免生硬复述，也不武断断定石头击中了大卫。
- source_word: הֹלֵךְ ... הָלוֹךְ
  choice: 边走边
  rationale: 原文以重复的行走形式突出动作持续进行；“边走边”在汉语中自然地呈现示每持续行进并咒骂。
- source_word: וַיְקַלֵּל
  choice: 咒骂
  rationale: קלל的加强词干在此指发出咒诅；“咒骂”兼顾诅咒言语和敌意辱骂的语境。
- source_word: וַיְסַקֵּל בָּאֲבָנִים
  choice: 扔石头
  rationale: סקל可指用石头砸或石刑，但此处是沿途敌对骚扰，并非正式处刑；“扔石头”保留具体动作而不过度诠释。
- source_word: וְעִפַּר בֶּעָפָר
  choice: 抛撒尘土
  rationale: 动词与同根名词连用，描写把尘土扬撒出去的敌对举动；“抛撒尘土”较为具体，也保留动作力度。
- source_word: וַאֲנָשָׁיו
  choice: 跟随他的人
  rationale: 这里指大卫同行的部属或随从；“跟随他的人”比笼统的“他的人”清楚，也未额外限定其军事身份。
- source_word: וַיֵּלֶךְ
  choice: 前行
  rationale: הלך为“走、行进”；在此叙事中“前行”传达大卫一行继续赶路。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。分号清楚区分大卫一行与示每同时进行的动作；保留两次לְעֻמָּתוֹ所表达的相对方位，同时避免暗示石头必然击中大卫。
