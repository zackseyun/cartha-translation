source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר הַ/מֶּ֔לֶךְ וְ/אַיֵּ֖ה בֶּן אֲדֹנֶ֑י/ךָ וַ/יֹּ֨אמֶר צִיבָ֜א אֶל הַ/מֶּ֗לֶךְ הִנֵּה֙ יוֹשֵׁ֣ב בִּ/ירוּשָׁלִַ֔ם כִּ֣י אָמַ֔ר הַ/יּ֗וֹם יָשִׁ֤יבוּ לִ/י֙ בֵּ֣ית יִשְׂרָאֵ֔ל אֵ֖ת מַמְלְכ֥וּת אָבִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/003.yaml
  text: Then the king said[a], “And where is your master's son?” Ziba said to the king, “Look, he is staying in Jerusalem, for he said, ‘Today the house of Israel will restore to me the kingdom of my father.’”
translation:
  language: zh_hans
  text: 王又问：“你主人的儿子在哪里？”洗巴对王说：“看哪，他正留在[a]耶路撒冷，因为他说：‘今天，以色列家必把我父亲的国归还给我。’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “留在”也可译作“住在”。这里的希伯来语分词可表示持续居住或停留在某处，并不只是字面上的“坐着”。
    reason: 说明原词的语义范围，并保留“停留”与“居住”之间的真实词义弹性。
lexical_decisions:
- source_word: וַיֹּאמֶר הַמֶּלֶךְ
  choice: 王又问
  rationale: 叙事性的连续式推进情节；结合后面的疑问句，用“又问”比机械译作“王说”更符合现代汉语，同时保留这是王继续发问的语气。
- source_word: וְאַיֵּה
  choice: 在哪里
  rationale: 准确表达地点疑问；前接“又问”已自然体现希伯来语连接词的承接作用。
- source_word: בֶּן אֲדֹנֶיךָ
  choice: 你主人的儿子
  rationale: אֲדֹנֶיךָ在此指洗巴的主人，不是神圣称号；直译能保留人物之间的社会关系。
- source_word: צִיבָא
  choice: 洗巴
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留提示听者注意的语篇功能；“看哪”庄重、清楚，也没有把该词弱化为纯粹填充语。
- source_word: יוֹשֵׁב
  choice: 正留在
  rationale: ישׁב的分词在本处表示停留或仍在某地，不必理解为字面上的坐着；“正”体现分词所表达的持续状态。
- source_word: בִּירוּשָׁלִַם
  choice: 在耶路撒冷
  rationale: 采用通行地名译法，并明确地点关系。
- source_word: כִּי
  choice: 因为
  rationale: 引出洗巴所提供的原因，现代汉语中自然明确。
- source_word: הַיּוֹם
  choice: 今天
  rationale: 直接保留引语中的时间强调。
- source_word: יָשִׁיבוּ לִי
  choice: 必把……归还给我
  rationale: 使役形态表达使某物返回、恢复归属；“归还给我”与“国”搭配自然，并保留说话者认为本属于自己的含义。
- source_word: בֵּית יִשְׂרָאֵל
  choice: 以色列家
  rationale: 保留希伯来语的群体性、家族—民族表达，不简化为单独的“以色列”。
- source_word: מַמְלְכוּת אָבִי
  choice: 我父亲的国
  rationale: 贴近原文所属结构，在中文中简洁自然；此处指王国或王权所辖之国。
theological_decisions:
- issue: 洗巴转述米非波设的动机是否属实
  choice: 按原文直接译出洗巴的陈述，不加入质疑或认可措辞
  alternative: 添加“声称”“据说”等疏离性措辞，暗示这项指控不可信
  rationale: 本节只记载洗巴对王所说的话，并未在句法上评价其真伪。译文保留这一叙事张力，让后续上下文判断洗巴的可信度。
- issue: “我父亲的国”所指的政治主张
  choice: 保留原文概括性的“国”，不扩写为“王位”或“扫罗王朝”
  alternative: 解释性译为“我祖父扫罗的王位”或“我家的王权”
  rationale: 原文使用“我父亲的国”，虽可按家系和王权背景理解，但本节没有明确展开；直译可避免替原文消除亲属称谓及政治含义上的张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“又问”使希伯来语连续叙事在汉语中自然展开；“看哪”保留原文提示注意的力度。引语层次清楚，不以额外措辞裁定洗巴陈述的真实性。
