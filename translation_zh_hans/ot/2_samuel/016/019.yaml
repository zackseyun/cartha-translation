base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/019.yaml
  text: And secondly[a], whom should I serve? Should it not be before his son? As I served before your father, so I will be before you.
translation:
  language: zh_hans
  text: 其次，我该服事谁呢？我不正该在他儿子面前服事吗？我从前怎样在你父亲面前服事，如今也必照样侍立在你面前[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在……面前”是王廷用语，可表示在君王身边侍立、为他效力或受他统辖。
    reason: cultural_note
lexical_decisions:
- source_word: וְהַשֵּׁנִית
  choice: 其次
  rationale: 这里是话语标记，引出户筛的第二个理由；“其次”自然地表达其承接和列举作用。
- source_word: לְמִי אֲנִי אֶעֱבֹד
  choice: 我该服事谁呢
  rationale: עבד 在王廷语境中指效力、服事；疑问句带有反问意味，“该……呢”符合现代汉语表达。
- source_word: הֲלוֹא לִפְנֵי בְנוֹ
  choice: 不正该在他儿子面前吗
  rationale: הֲלוֹא 预期肯定回答，译作“不正……吗”；保留 לִפְנֵי 的“在……面前”，使原文反复出现的宫廷表达清楚可见。
- source_word: כַּאֲשֶׁר עָבַדְתִּי לִפְנֵי אָבִיךָ
  choice: 我从前怎样在你父亲面前服事
  rationale: 保留“服事”和“在……面前”的宫廷用语，并以“怎样”与后句“也必照样”构成自然对应。
- source_word: כֵּן אֶהְיֶה לְפָנֶיךָ
  choice: 也必照样在你面前
  rationale: 原文后句使用 היה（是、在），没有重复 עבד（服事）；译文也不补出“服事”，以保留这一措辞变化和简洁的平行结构。
