  yaml_path: translation/ot/2_samuel/016/004.yaml
  text: Then the king said to Ziba, “Look, all that belongs to Mephibosheth is yours.” And Ziba said, “I bow down; may I find favor in your eyes, my lord the king.”
translation:
  language: zh_hans
  text: 王对洗巴说：“你看，凡属米非波设的，都归你了。”洗巴说：“我向你下拜；愿我在我主我王眼前蒙恩。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: 看
  rationale: 用自然的现代汉语保留提示、强调语气；此处不是单纯表示空间上的“这里”。
- source_word: לְךָ כֹּל אֲשֶׁר לִמְפִי בֹשֶׁת
  choice: 凡属米非波设的，现在都归你了
  rationale: 准确表达归属转移；补入“现在”使王当场处置产业的语境在汉语中清楚，但不增加新的实质内容。
- source_word: הִשְׁתַּחֲוֵיתִי
  choice: 我向你下拜
  rationale: 该词在此指臣属向王俯伏致敬；译为“下拜”既保留身体动作，也避免误解为敬拜神。
- source_word: אֶמְצָא חֵן בְּעֵינֶיךָ
  choice: 愿我在你眼前蒙恩
  rationale: 保留希伯来语常见的恩宠表达及其礼貌请求色彩。
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: 我主我王
  rationale: 保留臣民对君王的双重尊称，语言庄重且简洁。
theological_decisions:
- issue: 王将米非波设财产判给洗巴的叙事表述
  choice: 按王的原话直接陈述，不评价其决定是否公正
  alternative: 在正文中暗示洗巴欺骗或王的判断有误
  rationale: 本节只记录王基于洗巴陈述所作的决定；其真伪与后续修正由叙事后文展开，不应在本节预先裁断。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“看”传达 הִנֵּה 的提示语气；“下拜”清楚体现宫廷礼仪。专名采用通行译法“洗巴”“米非波设”。
