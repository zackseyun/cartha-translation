base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/023.yaml
  text: The counsel of Ahithophel that he gave in those days was as if one inquired of God[a]; so was all the counsel of Ahithophel both to David and to Absalom.
translation:
  language: zh_hans
  text: 亚希多弗当时所出的计谋，就像人求问上帝一样[a]；他的一切计谋，无论是给大卫还是给押沙龙，都是如此。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“仿佛人求问上帝。”希伯来文以比较的方式强调亚希多弗的计谋被赋予极高的分量；这并不说他的计谋本身就是上帝的启示。
    reason: 保留原文比较结构，并说明其强调作用，避免将比较误解为同一认定。
lexical_decisions:
- source_word: עֲצַת
  choice: 计谋
  rationale: 此处指宫廷谋士提出的谋略；“计谋”既符合叙事语境，也能自然涵盖建议与方案，并保留全节的重复。
- source_word: יָעַץ
  choice: 所出的
  rationale: “出计谋”是现代汉语中自然的搭配，准确表达提出谋略或建议的动作。
- source_word: בַּיָּמִים הָהֵם
  choice: 那时
  rationale: 简洁自然地表达“在那些日子”，不额外加入原文没有的连接语。
- source_word: כַּאֲשֶׁר יִשְׁאַל בִּדְבַר הָאֱלֹהִים
  choice: 就像人求问上帝所得的指示一样
  rationale: 该表达描写向上帝求问以获得指示；这样既保留求问上帝的含义，也体现 דָבָר 在此语境中所指的神圣答复，同时不把亚希多弗的计谋等同于启示。
- source_word: כֵּן
  choice: 都是这样受人看重
  rationale: 结合比较句补明其语用含义：亚希多弗的计谋被视为具有近似神谕的权威；“受人看重”避免误读为他的计谋本身就是上帝的话。
- source_word: גַּם לְדָוִד גַּם לְאַבְשָׁלֹם
  choice: 无论对大卫还是对押沙龙
  rationale: 自然表达重复的 גַּם…גַּם，说明这种评价在他服务大卫和押沙龙时都一样。
theological_decisions:
- issue: 亚希多弗的计谋与求问上帝之间的比较
  choice: 保留明示的比喻，并说明他的计谋受到近似神圣指示般的重视
  alternative: 直译为“仿佛人求问上帝”，但不说明比较所落在的社会评价上
  rationale: 希伯来文是比较而非同一认定。译文既保留其非同寻常的权威感，也避免断言亚希多弗的计谋是上帝所默示的启示。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“计谋”适合政治与宫廷语境；第二句略作明示，使比较关系在中文中清楚，同时借脚注保留更贴近原文形式的译法。
