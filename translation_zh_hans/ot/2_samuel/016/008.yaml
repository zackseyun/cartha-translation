source:
  edition: WLC
  text: הֵשִׁיב֩ עָלֶ֨י/ךָ יְהוָ֜ה כֹּ֣ל דְּמֵ֣י בֵית שָׁא֗וּל אֲשֶׁ֤ר מָלַ֨כְתָּ֙ תחת/ו וַ/יִּתֵּ֤ן יְהוָה֙ אֶת הַ/מְּלוּכָ֔ה בְּ/יַ֖ד אַבְשָׁל֣וֹם בְּנֶ֑/ךָ וְ/הִנְּ/ךָ֙ בְּ/רָ֣עָתֶ֔/ךָ כִּ֛י אִ֥ישׁ דָּמִ֖ים אָֽתָּה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/008.yaml
  text: Yahweh has brought back upon you all the blood of the house of Saul[a], in whose place you reigned, and Yahweh has given the kingdom into the hand of Absalom your son. And look, you are in your calamity[c][b], because you are a man of bloodshed.
translation:
  language: zh_hans
  text: 耶和华使扫罗家的一切血债都归到你身上[a]；你曾接替扫罗作王。耶和华已把王国交在你儿子押沙龙手中。看哪，你正遭遇灾祸[b]，因为你是个流人血的人[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “扫罗家的一切血债”也可译作“扫罗家的一切流血之事”。希伯来文直译为“扫罗家的一切血”；这里的复数“血”可指流血或血债。
    reason: lexical_alternative
  - marker: b
    text: “你正遭遇灾祸”也可译作“你在你的恶中”。这里的希伯来词既可指道德上的恶，也可指灾祸；本句很可能指大卫眼下所遭的灾难。
    reason: lexical_alternative
  - marker: c
    text: “流人血的人”直译为“血之人”，可指负有血债或以暴力、流血为特征的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵשִׁיב עָלֶיךָ
  choice: 使……归到你身上
  rationale: 保留希菲勒使役形所表达的“使之返回”及 עַל 的临到意味，同时采用自然的现代汉语表达报应归身的意象。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代简体中文圣经读者熟悉的专名形式呈现四字神名，而不是用称号替代。
- source_word: כָּל דְּמֵי בֵית שָׁאוּל
  choice: 扫罗家所流的一切血
  rationale: דָּמִים 字面为复数“血”，可指流血之事或血债；正文保留“血”的具体意象，脚注说明其他语义可能。
- source_word: אֲשֶׁר מָלַכְתָּ תַּחְתָּיו
  choice: 你曾接替扫罗作王
  rationale: תחתיו 在此表示“代替他、在他的位置上”；明说扫罗可避免中文关系结构指代含混。
- source_word: וַיִּתֵּן ... אֶת־הַמְּלוּכָה בְּיַד
  choice: 已把王国交在……手中
  rationale: 保留“交在手中”的希伯来权柄转移意象，并用“已”体现叙述中已经发生的转交。
- source_word: וְהִנְּךָ
  choice: 看哪
  rationale: 作为引人注意的话语标记，“看哪”庄重而简洁，在现代中文中仍易理解。
- source_word: בְּרָעָתֶךָ
  choice: 落入了自己的灾祸
  rationale: רָעָה 可指道德上的恶，也可指临到人的祸患；上下文是押沙龙叛乱所造成的灾难，故正文取“灾祸”，同时脚注保存歧义。
- source_word: אִישׁ דָּמִים
  choice: 流人血的人
  rationale: 以自然中文保留“以血为特征之人”的习语力量，可涵盖暴力与血债，而不把它缩窄为单纯嗜血。
theological_decisions:
- issue: 示每的指控与叙述者立场
  choice: 按直接引语如实译出耶和华施行报应的断言
  alternative: 添加“示每声称”等限定语
  rationale: 原文在本节内直接记录示每的话，并未插入叙述者评价；译文不应把人物指控转化为叙述者认可，也不应自行削弱其断言。
- issue: בְּרָעָתֶךָ 的道德恶或所遭灾祸
  choice: 正文译“自己的灾祸”
  alternative: 译“自己的恶中”
  rationale: 眼前语境指大卫因押沙龙叛乱所处的祸患，但希伯来词也允许道德含义；以脚注保留真正的词义张力。
- issue: 神名 יְהוָה 的呈现
  choice: 耶和华
  alternative: 雅威
  rationale: 两者都意在呈现四字神名；正文采用现代中文圣经传统中辨识度最高的专名“耶和华”，不以“主”替代神名。
translation_notes:
  register: 采用庄重而自然的现代标准汉语；保留“归到你身上”“交在……手中”等原文意象。“看哪”用于传达 הִנֵּה 的强调功能。脚注标记均紧随相关正文。
