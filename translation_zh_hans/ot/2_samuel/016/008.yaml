  to: 耶和华使扫罗家的一切血债都归到你身上[a]；你曾接替扫罗作王。耶和华已把王国交在你儿子押沙龙手中。看哪，你正遭遇灾祸[b]，因为你是个流人血的人[c]。
  rationale: 修订仅处理两处可安全改正的问题：以“你正遭遇灾祸”贴近原文介词结构并避免“自己的灾祸”的歧义；以“扫罗家的一切血债”在中文正文中清楚表达此处“血”的惯用含义，同时在脚注中保留字面“血”及流血之事等替代读法。其余句法、神名、专名和人物直接引语的语气均予保留。
