revisions:
- from: 大卫对亚比筛和他所有的臣仆说：“看哪，我亲生的儿子尚且要取我的性命，何况现在这个便雅悯人呢！由他吧，让他咒骂，因为耶和华对他说了。[a]”
  to: 大卫对亚比筛和他所有的臣仆说：“看哪，我亲生的儿子尚且要取我的性命，何况如今这个便雅悯人呢！由他吧，让他咒骂，因为耶和华已经对他说过了[a]。”
  rationale: 修订仅改善两处汉语表达并调整脚注锚点，不改变经文含义。“如今”自然表达עַתָּה；“已经对他说过了”保留希伯来文“耶和华对他说”的内容省略，不把咒骂明确写成耶和华命令。
