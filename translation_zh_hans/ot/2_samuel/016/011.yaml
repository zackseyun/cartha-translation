  text: וַ/יֹּ֨אמֶר דָּוִ֤ד אֶל אֲבִישַׁי֙ וְ/אֶל כָּל עֲבָדָ֔י/ו הִנֵּ֥ה בְנִ֛/י אֲשֶׁר יָצָ֥א מִ/מֵּעַ֖/י מְבַקֵּ֣שׁ אֶת נַפְשִׁ֑/י וְ/אַ֨ף כִּֽי עַתָּ֜ה בֶּן הַ/יְמִינִ֗י הַנִּ֤חוּ ל/וֹ֙ וִֽ/יקַלֵּ֔ל כִּ֥י אָֽמַר ל֖/וֹ יְהוָֽה־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/011.yaml
  text: Then David said to Abishai and to all his servants[a], “Look, my son, who came out from my own body, is seeking my life; how much more now this Benjaminite! Leave him alone, and let him curse, for Yahweh has told him to.”
translation:
  language: zh_hans
  text: 大卫对亚比筛和他所有的臣仆说：“看哪，我亲生的儿子尚且要取我的性命，何况如今这个便雅悯人呢！由他吧，让他咒骂，因为耶和华已经对他说过了[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为耶和华吩咐他这样做。”原文直译为“因为耶和华对他说了”，没有明说所说的内容；上下文暗示所指的是咒骂。
    reason: 说明原文末句省略了“所说内容”，并提供依上下文作出的自然译法，而不在正文中将其解释性补足。
lexical_decisions:
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留原文引人注意并加强语气的功能；“看哪”庄重而易懂。
- source_word: בְנִי אֲשֶׁר יָצָא מִמֵּעַי
  choice: 我亲生的儿子
  rationale: 原文直译为“从我腹中出来的儿子”，强调血缘关系；汉语以“亲生的儿子”自然传达其意义，又避免对男性使用“腹中所生”造成不必要的别扭。
- source_word: מְבַקֵּשׁ אֶת נַפְשִׁי
  choice: 要取我的性命
  rationale: 这是表示企图杀害某人的常见习语；该译法既保留“性命”这一词义，也清楚表达实际含义。
- source_word: וְאַף כִּי עַתָּה
  choice: 何况现在
  rationale: 表达原文由较重情形推到更不足为奇之情形的递进、反问语气。
- source_word: בֶּן הַיְמִינִי
  choice: 这个便雅悯人
  rationale: 指便雅悯支派的一员；此译法是现代汉语中清楚简洁的族属表达。
- source_word: הַנִּחוּ לוֹ
  choice: 由他吧
  rationale: 复数命令式是大卫对众人发出的制止命令，意为不要干预示每；“由他吧”自然传达放任、不加阻止之意。
- source_word: וִיקַלֵּל
  choice: 让他咒骂
  rationale: 承接前面的命令，表达大卫容许示每继续咒骂，并未增添持续时态。
- source_word: כִּי אָמַר לוֹ יְהוָה
  choice: 因为耶和华对他说了
  rationale: 严格保留原文没有明说所说内容的结构，不把上下文暗示的“咒骂”直接补入正文。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文圣经语境中广为人知的神名译法，作为四字神名的专名表达。
theological_decisions:
- issue: 大卫的话是否把示每的咒骂归于上帝直接吩咐，还是仅归于上帝许可或护理
  choice: 因为耶和华对他说了
  alternative: 因为耶和华准许他这样做；因为耶和华吩咐他咒骂
  rationale: 原文按字面说耶和华“对他说了”，却省略所说内容。译文保留大卫将此事归于耶和华的神学张力，不弱化为单纯的许可，也不把隐含宾语扩写成明确命令。
translation_notes:
  register: 采用现代、庄重而通顺的叙事语言。“臣仆”适合王室语境；“何况现在”保留原文的递进修辞。正文保留末句的真实省略，并用脚注说明其隐含意义。
