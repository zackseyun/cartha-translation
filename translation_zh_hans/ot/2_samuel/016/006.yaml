base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/006.yaml
  text: And he threw stones at David and at all the servants of King David[a], while all the people and all the mighty men were at his right hand and at his left.
translation:
  language: zh_hans
  text: 示每向大卫和大卫王的众臣仆投掷石头[a]；所有百姓和所有勇士都在大卫的右边和左边。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他用石头打大卫和大卫王的众臣仆。”希伯来语动词可作较直译的这样表达；但这里是指用石头袭击，并不表示以石刑处死他们。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְסַקֵּל בָּאֲבָנִים
  choice: 扔石头
  rationale: סקל的加强语干在此表示用石头攻击；结合בָּאֲבָנִים，译作“扔石头”具体、自然，也避免“用石头打死”误示已经执行死刑或造成死亡。
- source_word: עַבְדֵי
  choice: 臣仆
  rationale: עבד在王室语境中可指服侍君王的人，不必然是奴隶；“臣仆”既保留从属与服侍含义，也符合王室场景。
- source_word: הַמֶּלֶךְ דָּוִד
  choice: 大卫王
  rationale: 该表达以王的称号指明大卫；“大卫王”是自然且庄重的现代汉语称法。
- source_word: כָּל הָעָם
  choice: 所有百姓
  rationale: עם基本义为“百姓、人民”；此处指随同大卫的一群人，未限定为军队，故不缩窄为“士兵”。
- source_word: הַגִּבֹּרִים
  choice: 所有勇士
  rationale: גִּבּוֹרִים在撒母耳记的军事语境中常指英勇善战者，可能包括大卫的精锐战士；“勇士”简明并保留军事色彩。
- source_word: מִימִינוֹ וּמִשְּׂמֹאלוֹ
  choice: 在大卫左右两边
  rationale: 希伯来文直译为“在他的右边和左边”。代词所指在语法上可依上下文判断；这里最自然地指大卫。正文明确“大卫”以免现代汉语产生指代含混，同时保留两侧护卫的空间画面。
