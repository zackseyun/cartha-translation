base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/017.yaml
  text: Absalom said to Hushai[a], “Is this your loyalty to your friend? Why did you not go with your friend?”
translation:
  language: zh_hans
  text: 押沙龙对户筛说：“你就是这样忠于你的朋友吗？你为什么没有跟你的朋友一起走？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חַסְדְּךָ
  choice: 忠于
  rationale: חֶסֶד可指忠诚、恩待或坚定的爱。本节是押沙龙质问户筛为何没有追随大卫，重点在个人与政治上的忠诚；译作“忠于”自然地表达这种关系，又避免加入过强的盟约色彩。
- source_word: רֵעֶךָ
  choice: 你的朋友
  rationale: רֵעַ常指朋友、同伴或伙伴；这里是押沙龙用来称呼大卫。“朋友”符合上下文，也保留原文两次重复所形成的讥讽语气。
- source_word: לָמָּה לֹא הָלַכְתָּ אֶת רֵעֶךָ
  choice: 你为什么没有跟你的朋友一起走？
  rationale: הלך与אֶת在这里表示随同某人而去。“跟……一起走”是现代汉语中的自然表达，并保留原文动词的简朴直接。
- source_word: זֶה חַסְדְּךָ אֶת רֵעֶךָ
  choice: 你就是这样忠于你的朋友吗？
  rationale: 原文是省略系词的反问句。“就是这样……吗”既补足汉语句法，也传达押沙龙惊讶而责难的语气；“忠于”自然表达אֶת在此所标示的关系对象。
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: וַיֹּאמֶר是常规叙事用语“说”。虽然引语内容是问句，仍可保留“说”，由引语本身表达质问。
theological_decisions: []
