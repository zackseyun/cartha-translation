base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/002.yaml
  text: Then the king said to Ziba[a], “What are these for?” And Ziba said, “The donkeys are for the king’s household to ride on, and the bread and summer fruit are for the young men to eat[c][b], and the wine is for the weary in the wilderness to drink.”
translation:
  language: zh_hans
  text: 王问洗巴：“这些是做什么用的[a]？”洗巴说：“驴是给王家的人骑的；饼和夏季果品[b]是给年轻人[c]吃的；酒是给在旷野疲乏的人喝的。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你带这些来是什么意思？”希伯来语直译为“这些对你是什么？”
    reason: lexical_alternative
  - marker: b
    text: 或译：“夏季农产品”。希伯来语这个词可泛指夏季采收的果品或农产品。
    reason: lexical_alternative
  - marker: c
    text: “年轻人”也可译作“随从”或“仆人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה אֵלֶּה לָּךְ
  choice: 这些是做什么用的
  rationale: 希伯来语直译近似“这些对你是什么”，语境中是在询问洗巴带来这些物品的用途；此译自然，同时以脚注保留该习语的另一种理解。
- source_word: הַחֲמוֹרִים
  choice: 驴
  rationale: 采用现代汉语中该牲畜的常用名称。
- source_word: לְבֵית הַמֶּלֶךְ
  choice: 给王家的人
  rationale: בֵּית在此指王的家属及随行人员，而非建筑物；“王家的人”清楚表达这一群体含义。
- source_word: לִרְכֹּב
  choice: 骑的
  rationale: 表达不定式的目的含义，与“驴”搭配符合现代汉语习惯。
- source_word: הַלֶּחֶם
  choice: 饼
  rationale: 在古代近东语境中指作为主食的烤制面饼；“饼”比现代汉语通常联想到的发酵条形“面包”更贴近语境。
- source_word: הַקַּיִץ
  choice: 夏季果品
  rationale: 该词可泛指夏季采收的水果或农产品，原文没有明确是哪一种果实，故不具体化为无花果。
- source_word: הַנְּעָרִים
  choice: 年轻人
  rationale: 保留该词“年轻男子”的基本词义；语境中也可能指随从或仆人，列入脚注。
- source_word: הַיָּעֵף
  choice: 疲乏的人
  rationale: 原文为带定冠词的单数形容词，具有类指作用；“疲乏的人”既保留其概括性，也不擅自改成条件式“凡疲乏的”。
- source_word: בַּמִּדְבָּר
  choice: 在旷野
  rationale: מִדְבָּר可指荒野、牧野或沙漠地带；“旷野”符合叙事场景，又避免将其局限为沙质沙漠。
