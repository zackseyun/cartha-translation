  text: וְ/עַתָּ֣ה מֵ֗ת לָ֤/מָּה זֶּה֙ אֲנִ֣י צָ֔ם הַ/אוּכַ֥ל לַ/הֲשִׁיב֖/וֹ ע֑וֹד אֲנִי֙ הֹלֵ֣ךְ אֵלָ֔י/ו וְ/ה֖וּא לֹֽא יָשׁ֥וּב אֵלָֽ/י׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/023.yaml
  text: But now he is dead. Why should I fast any longer? Can I bring him back again? I am going to him[a], but he will not return to me.
translation:
  language: zh_hans
  text: 可是现在他已经死了，我为什么还要禁食呢？难道我能使他再回来吗？我将往他那里去[a]，他却不会回到我这里来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我正往他那里去。”希伯来文的分词在这里也可表示确定的将来。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: 可是现在
  rationale: 作为话语转折，承接孩子死前与死后大卫态度的变化；“可是现在”自然表达这种对比。
- source_word: מֵת
  choice: 他已经死了
  rationale: 表达孩子如今处于死亡状态；“已经”也清楚标示局势已经改变。
- source_word: לָמָּה זֶּה אֲנִי צָם
  choice: 我为什么还要禁食呢
  rationale: 按汉语习惯表达反问语气；“还要”体现此前持续禁食、如今不再继续的语境。
- source_word: הַאוּכַל לַהֲשִׁיבוֹ עוֹד
  choice: 难道我能使他回来吗
  rationale: הֲשִׁיבוֹ 是使役形式，直指“使他返回”；用“使他回来”保留原词义，也避免在正文中额外说明复生的机制。
- source_word: אֲנִי הֹלֵךְ אֵלָיו
  choice: 我必到他那里去
  rationale: 分词 הֹלֵךְ 在此可表达确定的将来；“必到……去”既符合汉语，又保留大卫终将走向孩子所在之处的陈述，但不界定其具体状态。
- source_word: וְהוּא לֹא יָשׁוּב אֵלַי
  choice: 他却不会回到我这里来
  rationale: 未完成式在此自然指向将来；“却”突出双向行动的不对称，并与前面的“使他回来”保持词义呼应。
theological_decisions:
- issue: 大卫的话是否明确表示死后会与孩子有意识地重聚
  choice: 直译为“我必到他那里去”，不进一步说明这种“去”是怎样的状态。
  alternative: 可理解为大卫终有一死、到亡者之境，也可被理解为暗示死后与孩子重聚。
  rationale: 希伯来文只说大卫会到孩子那里去，而孩子不会回到大卫这里来；译文应保留这一开放性，不据此增添关于中间状态或夭折婴孩得救的具体教义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“禁食”“使他回来”保留经文核心词义；反问句自然流畅。脚注说明分词的时态表达空间，同时不把“到他那里去”解释成特定的死后状态。
