  text: כִּ֥י אַתָּ֖ה עָשִׂ֣יתָ בַ/סָּ֑תֶר וַ/אֲנִ֗י אֶעֱשֶׂה֙ אֶת הַ/דָּבָ֣ר הַ/זֶּ֔ה נֶ֥גֶד כָּל יִשְׂרָאֵ֖ל וְ/נֶ֥גֶד הַ/שָּֽׁמֶשׁ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/012.yaml
  text: For you did it in secret[a], but I will do this thing before all Israel and before the sun.
translation:
  language: zh_hans
  text: 因为你是在暗中做的，我却要当着全以色列、在太阳面前[a]做这事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在光天化日之下”；直译：“在太阳面前”。
    reason: 说明“在太阳面前”是对原文的直接翻译，而“在光天化日之下”表达其公开可见的含义。
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上一节所宣告的审判，说明其缘由；现代汉语用“因为”自然地保留解释关系。
- source_word: עָשִׂיתָ בַסָּתֶר
  choice: 你是在暗中做的
  rationale: 保留动词未明说宾语的简洁表达，并以“在暗中”传达隐秘行事之意。
- source_word: וַאֲנִי
  choice: 我却
  rationale: 连接词在此形成鲜明对照：大卫暗中行事，上帝则公开施行所宣告的事；“却”自然体现这一转折。
- source_word: אֶעֱשֶׂה אֶת־הַדָּבָר הַזֶּה
  choice: 要……做这事
  rationale: 保留第一人称的直接施事和将来含义，也保留“这事”的指示性，不把审判的具体内容额外补入本节。
- source_word: נֶגֶד כָּל־יִשְׂרָאֵל
  choice: 当着全以色列
  rationale: “当着”自然表达在众人面前、公开可见的意思，符合 נֶגֶד 在此的空间及公开含义。
- source_word: וְנֶגֶד הַשָּׁמֶשׁ
  choice: 在太阳底下
  rationale: 既保留原文“太阳”的鲜明意象，又用现代汉语可理解的表达传达公开、白昼之下的含义；脚注列出意译和严格直译。
theological_decisions:
- issue: 所宣告审判的施事者
  choice: 保留上帝第一人称直接施事：“我却要……做这事”
  alternative: “我要使这事发生”或“我要让人这样做”
  rationale: 希伯来文使用第一人称单数动词，直接陈述上帝将做此事。即使叙事中审判借历史人物和事件实现，译文也不应弱化或改写本节明确的神圣施事。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“暗中”与“当着全以色列”构成清楚对照；“在太阳底下”保留原文意象而不显生硬。脚注标记紧随其所说明的短语。
