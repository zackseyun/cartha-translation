  rationale: 修订调整脚注锚点及内容，使其分别对应“安慰”的词汇替代和希伯来文关于性关系的两个连续惯用表达；同时以“同房”消除“同寝”的潜在歧义。其余内容保留原文的简洁叙事、显明的婚姻关系、由大卫命名的自然语境理解，以及对耶和华之名和“爱”的直译。
