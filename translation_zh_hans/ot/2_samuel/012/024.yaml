  text: וַ/יְנַחֵ֣ם דָּוִ֗ד אֵ֚ת בַּת שֶׁ֣בַע אִשְׁתּ֔/וֹ וַ/יָּבֹ֥א אֵלֶ֖י/הָ וַ/יִּשְׁכַּ֣ב עִמָּ֑/הּ וַ/תֵּ֣לֶד בֵּ֗ן ו/יקרא אֶת שְׁמ/וֹ֙ שְׁלֹמֹ֔ה וַ/יהוָ֖ה אֲהֵבֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/024.yaml
  text: Then David comforted Bathsheba his wife[a], and he went in to her and lay with her. She bore a son, and he named him Solomon[b]. And Yahweh loved him.
translation:
  language: zh_hans
  text: 大卫安慰[a]了他的妻子拔示巴，来到她那里，与她同房[b]。她生了一个儿子；大卫给他起名为所罗门。耶和华爱他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “安慰”也可译作“抚慰”。
    reason: lexical_alternative
  - marker: b
    text: “来到她那里，与她同房”是指发生性关系的委婉说法。
    reason: cultural_note
lexical_decisions:
- source_word: וַיְנַחֵם
  choice: 安慰了
  rationale: 此处 נחם 的 piel 形表示在丧子之痛后给予安慰；“安慰”自然、准确，也不超出上下文。
- source_word: בַּת שֶׁבַע אִשְׁתּוֹ
  choice: 妻子拔示巴
  rationale: 保留希伯来文明确指出的婚姻身份；按现代汉语习惯将关系称谓置于人名前。
- source_word: וַיָּבֹא אֵלֶיהָ וַיִּשְׁכַּב עִמָּהּ
  choice: 到她那里去，与她同寝
  rationale: 保留原文两个连续动作及其委婉表达；“同寝”在庄重叙事中可自然指性关系。
- source_word: וַתֵּלֶד בֵּן
  choice: 她生了一个儿子
  rationale: 简明自然，对应“生了儿子”，并补出汉语所需的数量表达。
- source_word: וַיִּקְרָא אֶת שְׁמוֹ שְׁלֹמֹה
  choice: 大卫给他起名叫所罗门
  rationale: 动词为阳性单数，语境最自然地以大卫为主语；明确补出“大卫”可避免汉语指代不清。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经传统中通行的专名形式表达四字神名，保留其作为名字而非称号的功能。
- source_word: אֲהֵבוֹ
  choice: 爱他
  rationale: אהב 的基本义为“爱”，宾语后缀指刚出生的儿子；直译保留其简洁和神学张力。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用神的专名。中文正文采用读者最熟悉且具专名功能的“耶和华”；“雅威”是更接近现代学界拟音的替代形式。
- issue: “耶和华爱他”的含义
  choice: 直译为“耶和华爱他”
  alternative: 译作“耶和华喜爱他”或解释为拣选、眷顾
  rationale: 原文只使用一般动词 אהב，没有明说这种爱具体表现为喜爱、拣选或眷顾；直译可保留原文简洁及潜在神学含义。
- issue: 起名者的身份
  choice: 明确为大卫
  alternative: 保留无显式主语的“给他起名叫所罗门”
  rationale: 马所拉文本的动词为阳性单数，语境中最自然的先行者是大卫；补明主语符合汉语表达，同时承认原句并未再次写出其名字。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“到她那里去，与她同寝”保留原文委婉语及两个并列动词，不改写为过于直白的现代说法。正文中的所有脚注标记均与脚注对应。
