base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/028.yaml
  text: Now gather the rest of the troops[a], camp against the city, and capture it, lest I capture the city and it be called by my name.
translation:
  language: zh_hans
  text: 现在，你要召集其余的军兵，在这城旁安营，攻取这城；免得我攻取了这城，这城就要冠上我的名字[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“我的名就被称在它上面”。这是指攻取这城的功劳或荣誉会归给约押；也可理解为“这城就以我的名字命名”。
    reason: 说明“名被称在城上”这一希伯来习语，并保留其关于荣誉归属与以名相称的语义幅度。
lexical_decisions:
- source_word: וְעַתָּה
  choice: 现在
  rationale: 作为话语标记，引出需要立即采取的下一步；“现在”符合现代汉语表达。
- source_word: אֱסֹף
  choice: 召集
  rationale: 该命令式在军事语境中指把人员集合起来；“召集”自然且能体现组织军兵之意。
- source_word: יֶתֶר הָעָם
  choice: 其余的军兵
  rationale: עָם通常可指“民众”，但围城语境表明这里是尚未参战的军队；“军兵”准确体现军事所指。
- source_word: וַחֲנֵה עַל הָעִיר
  choice: 安营攻打这城
  rationale: חנה本义是安营，עַל在此表达敌对方向。“安营攻打”保留安营这一动作，又以自然汉语说明其军事目的，未将其过度限定为完整的围城程序。
- source_word: וְלָכְדָהּ
  choice: 把它攻取
  rationale: לכד在战争叙事中指夺取或攻占城邑；“攻取”兼顾军事语境与原文动作。
- source_word: פֶּן
  choice: 免得
  rationale: 引出说话者要避免的结果；“免得”准确保留原文的否定目的或警告语气。
- source_word: וְנִקְרָא שְׁמִי עָלֶיהָ
  choice: 它就归在我的名下
  rationale: 原文直译为“我的名被称在它上面”，可表达攻城功劳、名誉或归属被算给约押。“归在我的名下”在现代汉语中自然，并避免把该习语收窄为城邑正式改名。
theological_decisions:
- issue: “名被称在城上”所表达的归属或荣誉
  choice: 译作“它就归在我的名下”，并用脚注说明希伯来语字面表达及其可能含义
  alternative: 译作“它就以我的名字命名”
  rationale: 上下文重点是攻城之功归于约押，但希伯来习语也带有名号、归属和声誉的色彩；不把它单一定义为正式命名，更能保留原文张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“军兵”“安营”“攻取”保持古代军事语境，但避免过度文言化；分号清楚呈现命令与所要避免之结果的关系。
