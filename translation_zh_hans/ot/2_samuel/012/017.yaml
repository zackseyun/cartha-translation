base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/017.yaml
  text: The elders of his house stood beside him to raise him up from the ground[a], but he was unwilling[b], and he would not eat bread with them.
translation:
  language: zh_hans
  text: 他家中的长老[a]站在他身旁，要扶他从地上起来；但他不肯，也不肯同他们一起吃东西[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他家中的长老”也可译为“他家室的长老”。原文直译为“他家的长老”；“家”可指家庭、家室或家族。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“也不与他们吃饼”；这里指与他们一同进食。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֻמוּ
  choice: 来到……身边
  rationale: קום的基本义是“起来、站起”；与后面的עָלָיו连用，在本语境中表示众人起身来到大卫近旁采取行动。译作“来到……身边”能自然呈现动作和场景，又不把方位过度具体化为“站在上方”。
- source_word: זִקְנֵי בֵיתוֹ
  choice: 他家中的长老
  rationale: 直译为“他家的长老”。“家中”在这里可包括王室家眷、仆役及近臣组成的家室，保留“长老”也避免擅自限定其具体职分。
- source_word: עָלָיו
  choice: 在他身边
  rationale: עַל可表示“在……上、靠近……、临到……”。结合他们要扶起伏在地上的大卫，汉语用“在他身边”最自然，同时保留他们近身照料的画面。
- source_word: לַהֲקִימוֹ מִן הָאָרֶץ
  choice: 要把他从地上扶起来
  rationale: הקים是קום的使役式，意为“使他起来”；“扶起来”符合长老协助大卫起身的情境。“地上”准确表达此处הָאָרֶץ的具体空间义。
- source_word: וְלֹא אָבָה
  choice: 他却不肯
  rationale: אבה表示愿意或同意；否定式译为“不肯”，比“拒绝”稍弱，保留原文关于意愿的语气。
- source_word: וְלֹא בָרָא אִתָּם לָחֶם
  choice: 也不和他们一起吃饭
  rationale: 原文直陈“与他们吃饼/食物”，是指进食。现代汉语“吃饭”自然传达其惯用意义，而脚注保留字面表达。
