language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר בְּ/עוֹד֙ הַ/יֶּ֣לֶד חַ֔י צַ֖מְתִּי וָֽ/אֶבְכֶּ֑ה כִּ֤י אָמַ֨רְתִּי֙ מִ֣י יוֹדֵ֔עַ יחנ/ני יְהוָ֖ה וְ/חַ֥י הַ/יָּֽלֶד׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/022.yaml
  text: He said[a], “While the child was still alive, I fasted and wept, because I said, ‘Who knows? Yahweh may be gracious to me, and the child may live.’”
translation:
  language: zh_hans
  text: 他说：“孩子还活着的时候，我禁食哭泣，因为我想：‘谁知道呢？或许耶和华会恩待我[a]，孩子也能活下来。’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “恩待我”或译“怜悯我”。
    reason: 原文 חנן 可表达施恩、恩待，也可在此苦难语境中理解为怜悯。
lexical_decisions:
- source_word: בְּעוֹד הַיֶּלֶד חַי
  choice: 孩子还活着的时候
  rationale: בְּעוֹד 表示某种状态仍在持续；“还活着的时候”自然地表达孩子当时尚且活着的情形。
- source_word: צַמְתִּי וָאֶבְכֶּה
  choice: 我禁食哭泣
  rationale: צום 是“禁食”，בכה 是“哭泣”；简洁保留两个并列行动及庄重语气。
- source_word: כִּי אָמַרְתִּי
  choice: 因为我想
  rationale: כִּי 在此引出禁食哭泣的原因；אָמַרְתִּי 字面为“我说”，但在内心引语前，现代汉语用“我想”更自然，也不改变其内容。
- source_word: מִי יוֹדֵעַ
  choice: 谁知道呢？
  rationale: 这是表达不确定性和仍存盼望的惯用语；“谁知道呢”既自然，也不暗示确定结果。
- source_word: יְחָנֵּנִי
  choice: 会恩待我
  rationale: חנן 指施恩、厚待或怜悯；“恩待我”保留对个人施恩的直接结构和恩惠意味。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 用现代中文读者熟悉的专名“耶和华”译出四字神名，而不以称号替代。
- source_word: וְחַי הַיָּלֶד
  choice: 孩子也能活下来
  rationale: 在“谁知道呢”和“或许”的语境中，此句表达大卫所盼望的可能结果；“能活下来”保留不确定性，避免译成必然发生。
theological_decisions:
- issue: 大卫对上帝回应的盼望是否带有确定性
  choice: “或许……孩子也能活下来”
  alternative: “耶和华必恩待我，孩子必活下来”
  rationale: מִי יוֹדֵעַ 明确表达不确定；经文呈现的是盼望而非把握，因此不可把两句译成确定的应许。
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 原文使用专有神名。正文采用中文圣经传统中最广为人知的专名“耶和华”，保留其作为名字而非称号的性质。
- issue: יְחָנֵּנִי 的恩惠与怜悯含义
  choice: 恩待我
  alternative: 怜悯我
  rationale: 词根 חנן 主要表示施恩或厚待；“恩待”较贴近其核心，但“怜悯”在此语境也成立，故列为脚注异译。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“禁食哭泣”简练而有叙事力度；以“谁知道呢？或许……”保留原文的迟疑与盼望。
