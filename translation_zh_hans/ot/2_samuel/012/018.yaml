  text: וַ/יְהִ֛י בַּ/יּ֥וֹם הַ/שְּׁבִיעִ֖י וַ/יָּ֣מָת הַ/יָּ֑לֶד וַ/יִּֽרְאוּ֩ עַבְדֵ֨י דָוִ֜ד לְ/הַגִּ֥יד ל֣/וֹ כִּי מֵ֣ת הַ/יֶּ֗לֶד כִּ֤י אָֽמְרוּ֙ הִנֵּה֩ בִ/הְי֨וֹת הַ/יֶּ֜לֶד חַ֗י דִּבַּ֤רְנוּ אֵלָי/ו֙ וְ/לֹא שָׁמַ֣ע בְּ/קוֹלֵ֔/נוּ וְ/אֵ֨יךְ נֹאמַ֥ר אֵלָ֛י/ו מֵ֥ת הַ/יֶּ֖לֶד וְ/עָשָׂ֥ה רָעָֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/018.yaml
  text: And on the seventh day the child died. And David’s servants were afraid to tell him that the child was dead[a], for they said, “Behold, while the child was still alive, we spoke to him, and he did not listen to our voice. How then can we say to him, ‘The child is dead’? He may do harm.”
translation:
  language: zh_hans
  text: 到了第七天，孩子死了。大卫的臣仆害怕把孩子已经死了的消息告诉他，因为他们说：“你看，孩子还活着的时候，我们同他说话，他却不听我们的话。我们怎么能告诉他说：‘孩子死了’呢？他恐怕会做出什么不好的事[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “做出什么不好的事”也可译作“做出有害的事”“行恶”，也可能指“伤害自己”。希伯来原文十分简略，没有说明他们所担心的具体行为。
    reason: 说明 וְעָשָׂה רָעָה 的词义范围，并保留所指行为不明确的特点。
lexical_decisions:
- source_word: וַיְהִי בַּיּוֹם הַשְּׁבִיעִי
  choice: 到了第七天
  rationale: 自然表达叙事推进和时间转换，不拘泥于直译“事情发生在”。
- source_word: וַיָּמָת הַיָּלֶד
  choice: 孩子死了
  rationale: יֶלֶד 可指孩子或男孩；本段语境所指年龄很小，用“孩子”更准确自然。
- source_word: וַיִּרְאוּ עַבְדֵי דָוִד לְהַגִּיד לוֹ
  choice: 大卫的臣仆害怕……告诉他
  rationale: 这里的 ירא 表示惧怕、担忧；“臣仆”符合王室叙事语境，同时是现代读者易懂的庄重表达。
- source_word: כִּי מֵת הַיֶּלֶד
  choice: 孩子已经死了
  rationale: 作为所要告知的消息，“已经死了”在中文中自然呈现死亡已成事实。
- source_word: הִנֵּה
  choice: 你看
  rationale: 保留引人注意的语用功能，避免使用现代中文中过于古雅的“看哪”。
- source_word: בִּהְיוֹת הַיֶּלֶד חַי
  choice: 孩子还活着的时候
  rationale: “还活着”自然体现与随后死亡消息之间的对比。
- source_word: וְלֹא שָׁמַע בְּקוֹלֵנוּ
  choice: 他都不听我们的话
  rationale: 希伯来语直译为“不听我们的声音”，中文惯用语“不听我们的话”准确表达其含义；“都”表现此前劝说未被听从的语气。
- source_word: וְאֵיךְ נֹאמַר אֵלָיו
  choice: 现在我们怎么能告诉他说
  rationale: “怎么能”保留焦虑的反问语气；“现在”明示上下情境中的推论和时间转折。
- source_word: וְעָשָׂה רָעָה
  choice: 他恐怕会做出什么不好的事
  rationale: 原文只说“做出坏事／有害的事”，没有说明对象或具体行为；此译法保留其开放性和臣仆的忧虑。
theological_decisions:
- issue: וְעָשָׂה רָעָה 所指的具体行为
  choice: 保留为未具体说明的“不好的事”
  alternative: 他可能伤害自己；他可能行恶；他可能反应过激
  rationale: 原文没有宾语，也没有明确行为性质。正文不把它限定为自残、道德上的恶行或单纯的情绪反应，以免消解叙事中的含混性。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“臣仆”保留宫廷背景；直接引语使用自然口吻。避免以“自残”等较具体的心理或行为判断替代原文的含混表达。
