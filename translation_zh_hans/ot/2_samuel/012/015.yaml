base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/015.yaml
  text: Then Nathan went to his house[a], and Yahweh struck the child whom Uriah’s wife had borne to David[c][b], and it became sick.
translation:
  language: zh_hans
  text: 拿单回家去了。雅威击打乌利亚的妻子给大卫所生的孩子[a]，孩子就病了[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文称孩子的母亲为“乌利亚的妻子”，没有在这里直呼她为拔示巴。
    reason: cultural_note
  - marker: b
    text: “病了”也可译作“患病了”或“病倒了”；原文表明孩子开始患病。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ נָתָן אֶל־בֵּיתוֹ
  choice: 拿单回家去了
  rationale: וַיֵּלֶךְ推进叙事，בֵּיתוֹ直译为“他的家/房屋”；现代汉语用“回家去了”自然表达拿单前往自己住处，并保留事件次序。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语中对四字神名的常见音译“雅威”保留其专名性质，不以“主”这一称号替代。
- source_word: וַיִּגֹּף
  choice: 击打
  rationale: נָגַף表示带来伤害的击打或打击；“击打”保留原文明确归于雅威的直接行动，也不预先把它限定为某一种疾病或灾祸。
- source_word: הַיֶּלֶד
  choice: 孩子
  rationale: 上下文所指是幼小的孩子；“孩子”准确且符合现代汉语。
- source_word: אֲשֶׁר יָלְדָה אֵשֶׁת אוּרִיָּה לְדָוִד
  choice: 乌利亚的妻子给大卫所生的孩子
  rationale: 保留原文“乌利亚的妻子”这一刻意称谓，不擅自换成拔示巴的名字；“给大卫所生”自然表达 לְדָוִד 的关系。
- source_word: וַיֵּאָנַשׁ
  choice: 孩子就病了
  rationale: 该动词在此表示孩子患病；重复“孩子”可消除汉语代词指向不明，并保留疾病作为前一行动之后结果出现的叙事关系。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主；主
  rationale: 原文使用以色列上帝的专名。采用“雅威”保留专名及其圣约语境，同时避免用称号取代原文名字。
- issue: 孩子患病的行动者
  choice: 雅威击打……孩子
  alternative: 孩子受了灾害；雅威使孩子患病
  rationale: 希伯来文明确以雅威为 וַיִּגֹּף 的主语，译文不弱化这一直接归因；同时将“击打”与随后“病了”分开，避免把两个动词合并解释。
- issue: 对孩子母亲的称谓
  choice: 乌利亚的妻子
  alternative: 拔示巴
  rationale: 原文在此不直呼她的名字，而以她与乌利亚的婚姻关系称呼她；译文保留这一具有叙事和道德张力的表述。
translation_notes:
  register: 采用简明、庄重的现代标准汉语。以短句呈现连续动作；保留“击打”的强烈措辞、神的直接行动以及“乌利亚的妻子”这一叙事称谓，不作神学缓和。
