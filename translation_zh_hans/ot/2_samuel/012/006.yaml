  text: And he must repay the ewe lamb fourfold[a], because he did this thing and because he had no pity.
translation:
  language: zh_hans
  text: 他必须为那只母羊羔作四倍赔偿，因为他做了这事，又因为他毫无怜悯[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他没有饶恕（或：没有放过）。”这里的希伯来语动词可强调因怜悯而不加伤害，或予以饶恕。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכִּבְשָׂה
  choice: 那只母羊羔
  rationale: כִּבְשָׂה特指雌性的羔羊；“母羊羔”既保留其性别，也自然承接上下文所指的那一只羊羔。
- source_word: יְשַׁלֵּם
  choice: 必须……赔偿
  rationale: שׁלם的Piel形式在这里表示作出赔偿；结合大卫宣判的语境，用“必须”表达裁决的约束力。
- source_word: אַרְבַּעְתָּיִם
  choice: 四倍
  rationale: 该数词形式在此表示四倍偿还，也与《出埃及记》22:1所规定的赔偿相符；“赔偿四倍”是现代汉语自然的法律表达。
- source_word: עֵקֶב אֲשֶׁר
  choice: 因为
  rationale: 这一短语引出判决的理由，译作“因为”简洁自然。
- source_word: עָשָׂה אֶת־הַדָּבָר הַזֶּה
  choice: 他做了这事
  rationale: 保留דָּבָר较宽泛的“事”之义，不将其过度具体化为某种罪名或行为类别。
- source_word: לֹא חָמָל
  choice: 他毫无怜悯
  rationale: חמל可指因怜悯而不加伤害或予以饶惜；“毫无怜悯”在此自然表达行为人的冷酷，同时保留“没有怜悯”的核心意义。
