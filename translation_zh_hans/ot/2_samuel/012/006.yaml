translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“那只母羊羔”准确保留动物的性别和特指性；“赔偿四倍”以自然汉语呈现司法裁决。主句中的两个“因为”用“因为……又因为……”对应原文并列的两项理由。
