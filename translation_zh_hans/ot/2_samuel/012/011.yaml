source:
  edition: WLC
  text: כֹּ֣ה אָמַ֣ר יְהוָ֗ה הִנְ/נִי֩ מֵקִ֨ים עָלֶ֤י/ךָ רָעָה֙ מִ/בֵּיתֶ֔/ךָ וְ/לָקַחְתִּ֤י אֶת נָשֶׁ֨י/ךָ֙ לְ/עֵינֶ֔י/ךָ וְ/נָתַתִּ֖י לְ/רֵעֶ֑י/ךָ וְ/שָׁכַב֙ עִם נָשֶׁ֔י/ךָ לְ/עֵינֵ֖י הַ/שֶּׁ֥מֶשׁ הַ/זֹּֽאת׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/011.yaml
  text: 'Thus says Yahweh: Behold[a], I am raising up disaster against you from your own house, and I will take your wives before your eyes and give them to your neighbor[b], and he will lie with your wives in the sight of this sun.'
translation:
  language: zh_hans
  text: 耶和华如此说：“看哪，我要使灾祸从你自己的家中临到你；我要在你眼前取走你的妻子，交给你的同伴[a]；他必在这日头面前[b]与你的妻子同寝。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “同伴”也可译作“邻舍”或“与你亲近的人”。希伯来词 רֵעַ 可指邻舍、同伴或关系亲近者。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“在这日头面前”，意指在光天化日之下、公开地。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经中广为人知的上帝专名译法，保留原文专名的功能。
- source_word: כֹּה אָמַר
  choice: 如此说
  rationale: 保留先知传信公式庄重、宣告性的语气，同时符合现代书面汉语。
- source_word: הִנְנִי
  choice: 看哪，我要
  rationale: “看哪”保留提示听者注意的功能；结合后面的分词，以“我要”表达即将施行之事。
- source_word: מֵקִים ... רָעָה
  choice: 兴起灾祸
  rationale: “兴起”贴近使役动词的意象；此处 רָעָה 指临到人的灾难，而非道德上的邪恶。
- source_word: עָלֶיךָ
  choice: 攻击你
  rationale: 上下文带有敌对和审判的方向，以“攻击你”清楚传达该含义。
- source_word: מִבֵּיתֶךָ
  choice: 从你自己家中
  rationale: “家”兼含家室、家族之意；加“自己”凸显灾祸将从大卫内部兴起。
- source_word: נָשֶׁיךָ
  choice: 你的妻妾
  rationale: 在古代君王大卫的语境中，该复数名词指属于其婚姻家室的众女子；“妻妾”比现代汉语单说“妻子们”自然，也符合叙事背景。
- source_word: לְעֵינֶיךָ
  choice: 当着你的面
  rationale: 自然表达“在你眼前”的公开性，并保留大卫亲见或知悉的意味。
- source_word: לְרֵעֶיךָ
  choice: 交给与你亲近的人
  rationale: רֵעַ 可指邻舍、同伴或关系亲近者；此处不强行确定具体身份，以“与你亲近的人”保留词义范围。
- source_word: וְשָׁכַב עִם
  choice: 与……同寝
  rationale: 保留原文庄重的性关系委婉语，避免过于口语化。
- source_word: לְעֵינֵי הַשֶּׁמֶשׁ הַזֹּאת
  choice: 在这日头之下
  rationale: 保留“这日头”的具体意象，同时用可理解的中文表达事情将在公开可见之处发生。
theological_decisions:
- issue: 上帝所兴起的 רָעָה 的性质
  choice: 灾祸
  alternative: 邪恶
  rationale: 本节是审判宣告，רָעָה 指有害的灾难或祸患；译作“灾祸”既保留上帝主动施行审判的张力，也不暗示上帝在制造道德邪恶。
- issue: 上帝“交给”妻妾与后来行为人的责任
  choice: 按原文保留上帝主动“交给”的表述
  alternative: 弱化为纯粹的许可或预见
  rationale: 原文第一人称动词明确把审判行动归于耶和华；译文不将其改释为仅仅许可，也不额外断言行为人的道德责任问题。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“妻妾”适合大卫王室的历史语境；“同寝”保留希伯来文的委婉表达。“日头”略带经文语体色彩，用来保存原文鲜明的太阳意象。
