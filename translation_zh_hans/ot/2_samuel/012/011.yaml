revisions:
- from: 耶和华如此说：“看哪，我要从你自己家中兴起灾祸攻击你；我要当着你的面夺走你的妻妾，交给与你亲近的人[a]；他必在这日头之下[b]与你的妻妾同寝。”
  to: 耶和华如此说：“看哪，我要使灾祸从你自己的家中临到你；我要在你眼前取走你的妻子，交给你的同伴[a]；他必在这日头面前[b]与你的妻子同寝。”
  rationale: 修订删除原文未明说的“妾”，将“夺走”调回较中性的“取走”，并恢复“在这日头面前”的可见、公开意象。译文仍保留神谕的审判语气、灾祸来自大卫家中的含义，以及רֵעַ身份未明确的语义空间。
