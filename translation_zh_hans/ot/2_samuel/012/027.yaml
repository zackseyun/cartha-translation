base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/027.yaml
  text: Then Joab sent messengers to David and said[a], “I have fought against Rabbah; I have also captured the city of waters.”
translation:
  language: zh_hans
  text: 于是，约押派使者去见大卫，说[a]：“我攻打了拉巴，也攻占了水城。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “水城”也可译作“水之城”；这可能指拉巴中控制水源的部分。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: 于是……派
  rationale: 未完成式加叙事连接词推动事件发展；“于是”自然表达前后顺序。
- source_word: מַלְאָכִים
  choice: 使者
  rationale: 这里指奉命向大卫报告消息的人，并非天使；“使者”准确且符合庄重叙事语体。
- source_word: נִלְחַמְתִּי בְרַבָּה
  choice: 我攻打了拉巴
  rationale: 介词 בְ 与城名连用，在围城语境中表示以该城为攻击对象；“攻打”比泛指“作战”更自然。
- source_word: רַבָּה
  choice: 拉巴
  rationale: 按专名音译；本节无需补入上下文已知的“亚扪人的”。
- source_word: גַּם
  choice: 也
  rationale: 保留其递进报告中附加第二项战果的作用。
- source_word: לָכַדְתִּי
  choice: 攻占了
  rationale: 该动词在军事语境中表示夺取、占领；“攻占”与围城叙事贴合。
- source_word: עִיר הַמָּיִם
  choice: 水城
  rationale: 希伯来语字面可理解为“水之城”或“水城”；正文采用自然简洁而仍保留歧义的表达，不直接断定它具体是水源区。
