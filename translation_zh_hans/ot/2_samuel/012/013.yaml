base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/013.yaml
  text: Then David said to Nathan[a], “I have sinned against Yahweh.” And Nathan said to David, “Yahweh also has taken away your sin[b]; you shall not die.”
translation:
  language: zh_hans
  text: 大卫对拿单说：“我得罪雅威了。”拿单对大卫说：“雅威也已经除掉你的罪[a]，你必不死[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“雅威也已经使你的罪过去。”希伯来语动词字面意思是“使……过去”，在这里表示将罪除去。
    reason: lexical_alternative
  - marker: b
    text: 或译：“你不会死。”希伯来文只说“你必不死”，没有明说“你必不被处死”，尽管上下文可能含有免除死刑判决的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: חָטָאתִי
  choice: 我得罪……了
  rationale: חטא 的 Qal 完成式第一人称单数，是直接认罪；现代汉语用“得罪……了”自然表达已经发生、如今仍具切身意义的罪行。
- source_word: לַיהוָה
  choice: 得罪雅威
  rationale: 介词 ל 在 חטא 的认罪语境中表示行为所针对的对象；汉语“得罪雅威”比直译“向雅威犯罪”更自然准确。
- source_word: יְהוָה
  choice: 雅威
  rationale: 原文直接使用四字神名；音译为“雅威”，保留其专名性质。
- source_word: גַּם
  choice: 也
  rationale: 保留 גַּם 的承接和强调作用，同时不额外限定其具体逻辑关系。
- source_word: הֶעֱבִיר
  choice: 已经除掉
  rationale: 这是 עבר 的 Hiphil 完成式，字面为“使之过去”；以罪为宾语时表示将罪移去。“除掉”在现代汉语中清楚自然，又不引入原文未说明的赎罪机制。
- source_word: חַטָּאתְךָ
  choice: 你的罪
  rationale: חַטָּאת 在此指大卫刚承认的罪行；译作“罪”最直接，不将其解释性地改为“罪责”或“赎罪祭”。
- source_word: לֹא תָמוּת
  choice: 你必不死
  rationale: 否定词加 מות 未完成式直接表明大卫不会死；“必不死”保留庄重而带裁断意味的语气，不把原文扩写成“必不被处死”。
- source_word: וַיֹּאמֶר ... וַיֹּאמֶר
  choice: 大卫……说……拿单……说
  rationale: 希伯来叙事链在汉语中不必逐次机械译出连接词；按自然语序连续叙述即可清楚保留事件推进。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文使用神的专名，采用音译可保留专名性质，并避免以称号替代原文神名。
- issue: הֶעֱבִיר חַטָּאתְךָ 所表达的赦免性质
  choice: 雅威也已经除掉你的罪
  alternative: 雅威也已经使你的罪过去；雅威也已经除去你的罪责
  rationale: 译文明确表达神移去大卫的罪以及随后的免死宣告，却不说明本节未交代的赎罪机制，也不把“罪”缩限为仅指法律罪责。
- issue: לֹא תָמוּת 的司法含义
  choice: 你必不死
  alternative: 你必不被处死
  rationale: 上下文可能含有免除死刑判决的意味，但希伯来文只明说“不死”；保留较宽的措辞，避免把隐含背景写进正文。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。以“我得罪雅威了”呈现简洁直接的认罪，以“你必不死”保留先知宣告的郑重语气。脚注标记分别紧随其实际说明的“除掉你的罪”和“你必不死”，避免错置。
