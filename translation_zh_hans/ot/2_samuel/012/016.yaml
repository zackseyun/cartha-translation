base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/016.yaml
  text: And David sought God on behalf of the boy[b][a]. David fasted a fast, and he went in and spent the night and lay on the ground.
translation:
  language: zh_hans
  text: 大卫为那孩子[a]寻求神。他禁食[b]，进去过夜，躺在地上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “孩子”所译的希伯来词也可译作“男孩”或“少年”；这里指大卫患病的幼子（15、18节）。
    reason: lexical_alternative
  - marker: b
    text: 原文将“禁食”的同源动词和名词连用，字面上重复“禁食”，用以加强语气。
    reason: source_form
lexical_decisions:
- source_word: וַיְבַקֵּשׁ
  choice: 寻求
  rationale: בקש在这里指大卫为孩子的缘故迫切寻求神，语境含有祈求之意；译作“寻求”保留原词较宽的语义，不直接强化为“恳求”。
- source_word: אֶת־הָאֱלֹהִים
  choice: 神
  rationale: 带直接宾语标记的האלהים明确指大卫所寻求的对象，译作“神”自然准确。
- source_word: בְּעַד
  choice: 为
  rationale: בעד在此表达为他人代求、为他人缘故行事；现代汉语用“为那孩子”简洁自然，并由上下文显出代求含义。
- source_word: הַנַּעַר
  choice: 那孩子
  rationale: נער可指男孩、少年或孩子；这里指大卫患病的幼子。“那孩子”符合具体语境，又避免“男孩”在婴幼儿语境中的生硬感。
- source_word: וַיָּצָם ... צוֹם
  choice: 禁食
  rationale: 希伯来文以同根动词和名词连用来突出禁食这一行动。汉语若直译成“禁食了一次禁食”极不自然，因此正文用“禁食”，并以脚注说明原文的强调形式。
- source_word: וּבָא
  choice: 进去
  rationale: בוא在叙事中表示进入某处；原文没有明确补出所进的地点，因此只译“进去”。
- source_word: וְלָן
  choice: 过夜
  rationale: לון指留宿或度过一夜，“过夜”是清楚自然的现代汉语表达。
- source_word: וְשָׁכַב אָרְצָה
  choice: 躺在地上
  rationale: שכב表示躺卧，ארצה表示朝地面或在地上；“躺在地上”准确传达其姿态，又不擅自指定为室内地板。
theological_decisions:
- issue: 大卫向神所行之事的力度
  choice: 寻求神
  alternative: 恳求神
  rationale: 上下文显然涉及为孩子祈求，但בקש本身可较宽泛地表示寻求；正文保留这一语义宽度，不把动词本身的含义收窄为强烈哀求。
- issue: 过夜与躺地之间的时间关系
  choice: 并列译为“进去过夜，躺在地上”
  alternative: “进去，整夜躺在地上”
  rationale: 原文依次使用“进去、过夜、躺在地上”三个动作，并未用语法明确断定他整夜始终躺地；采用并列结构以保留这种关系上的开放性。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“寻求神”保留原文动词的宽度；“进去过夜，躺在地上”保留动作次序，并避免补出原文未明说的地点或把“躺在地上”明确延伸为整夜持续。
