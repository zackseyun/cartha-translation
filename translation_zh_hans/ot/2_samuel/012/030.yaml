  to: 他从他们的王头上取下王冠[a]。这王冠重一他连得的金子[b]，上面有一块宝石；随后戴在大卫头上。他又从城中运出极多的战利品。
  rationale: 修正“他们王”为自然的现代汉语“他们的王”；收敛脚注中对神名替代读法的过度具体化，以保存原文的语义歧义；并微调冠冕转移的句法，使其自然且不添加未明示的施事者。其余译文保持原有意思、庄重叙事语体及脚注锚点。
