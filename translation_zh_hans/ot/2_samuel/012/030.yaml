  text: וַ/יִּקַּ֣ח אֶת עֲטֶֽרֶת מַלְכָּ/ם֩ מֵ/עַ֨ל רֹאשׁ֜/וֹ וּ/מִשְׁקָלָ֨/הּ כִּכַּ֤ר זָהָב֙ וְ/אֶ֣בֶן יְקָרָ֔ה וַ/תְּהִ֖י עַל רֹ֣אשׁ דָּוִ֑ד וּ/שְׁלַ֥ל הָ/עִ֛יר הוֹצִ֖יא הַרְבֵּ֥ה מְאֹֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/030.yaml
  text: He took the crown of their king from his head[a]. Its weight was a talent of gold, and in it was a precious stone, and it was placed on David’s head[b]. He brought out the spoil of the city in very great quantity.
translation:
  language: zh_hans
  text: 他从他们的王头上取下王冠[a]。这王冠重一他连得的金子[b]，上面有一块宝石；随后戴在大卫头上。他又从城中运出极多的战利品。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“米勒公的王冠。”这里的“他们的王”也可理解为亚扪人的神“米勒公”（也作“玛勒堪”）的名字。
    reason: 保留 מַלְכָּם 既可理解为“他们的王”、也可理解为亚扪神名的真实歧义；不额外断定代词“他的头”具体指向谁。
  - marker: b
    text: “他连得”是古代很大的重量单位；一他连得通常估计约为34千克，但古代各地、各时期的标准并不完全相同。
    reason: 说明古代重量单位的大致数值，并提示换算的不确定性。
lexical_decisions:
- source_word: עֲטֶרֶת
  choice: 王冠
  rationale: 该词在这里指王权的冠冕；“王冠”是现代汉语中自然、明确的对应表达。
- source_word: מַלְכָּם
  choice: 他们王
  rationale: 按所给马所拉读法和形态，这是“王”加第三人称阳性复数后缀，即“他们的王”；汉语在“他们王”中省略“的”，更符合叙事文体。另有将其理解为亚扪神名“米勒公”的传统，保留于脚注。
- source_word: מֵעַל רֹאשׁוֹ
  choice: 从……的头上取下
  rationale: מֵעַל兼有“从……上面”的方向含义；“从头上取下”既保留动作空间关系，也符合现代汉语习惯。
- source_word: כִּכַּר זָהָב
  choice: 一他连得金子
  rationale: כִּכָּר是古代大重量单位，中文圣经语境通常音译为“他连得”；脚注说明其大致现代重量及古代标准的不确定性。
- source_word: וְאֶבֶן יְקָרָה
  choice: 上面有一块宝石
  rationale: 原文简略，直译为“和一块宝石”。结合所描述的王冠，用“上面有”自然表达宝石与王冠的关系，但不具体断定镶嵌方式。
- source_word: וַתְּהִי עַל רֹאשׁ דָּוִד
  choice: 这王冠就戴在大卫头上
  rationale: 原文说明王冠随后在大卫头上，但没有明说是谁将其戴上；此译法保留结果状态，不补入施事者。
- source_word: שְׁלַל הָעִיר
  choice: 城里的战利品
  rationale: שָׁלָל指战争中取得的掳物或财物；“战利品”在现代汉语历史叙事中清楚自然。
- source_word: הוֹצִיא הַרְבֵּה מְאֹד
  choice: 运出极多
  rationale: 使役词形在此表示把物品从城中带出；“运出”适合大量战利品的语境，“极多”保留强烈的数量强调。
theological_decisions:
- issue: מַלְכָּם应理解为普通名词“他们的王”，还是亚扪神祇的专名“米勒公”
  choice: 正文译作“他们王”
  alternative: “米勒公的王冠”
  rationale: 所给马所拉读法可直接分析为“王”加复数领属后缀，而且“从他的头上”在近距离语境中自然指向一位君王。然而，该辅音形式也可被理解为亚扪神祇的名字，因此以脚注保留这一真实歧义，不在正文中将其彻底排除。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。叙事句式简洁，避免文言化表达；在不补入原文未明说施事者的前提下，使王冠转移和战利品运出的动作清楚连贯。
