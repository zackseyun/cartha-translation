base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/025.yaml
  text: And he sent word through Nathan the prophet[a], and he called his name Jedidiah[b], because of Yahweh.
translation:
  language: zh_hans
  text: 雅威借先知拿单传话[a]，给他起名叫耶底底亚[b]；这名字是因雅威的缘故而起的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“借先知拿单的手。”
    reason: 说明希伯来语表示媒介的惯用结构。
  - marker: b
    text: “耶底底亚”可能意为“雅威所爱的”。
    reason: 说明专名可能包含的词源意义。
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: 传话
  rationale: שׁלח的基本义是“差遣、发送”；与“借……的手”连用时，这里表示雅威借拿单传达信息。“传话”以自然的现代汉语表达上下文隐含的传信行为。
- source_word: בְּיַד נָתָן הַנָּבִיא
  choice: 借先知拿单
  rationale: בְּיַד直译为“借……的手”，在此是表示媒介或代理的惯用语；正文用“借”准确而自然地保留拿单的中介角色。
- source_word: וַיִּקְרָא אֶת־שְׁמוֹ
  choice: 给孩子起名叫
  rationale: 希伯来语直译为“称他的名”；现代汉语在命名语境中通常说“给……起名叫”。“孩子”明确自然指向上文的婴孩，并未加入新的所指。
- source_word: יְדִידְיָהּ
  choice: 耶底底亚
  rationale: 按通行中文圣经人名形式音译；其名称含义另在脚注说明，不以释义替代专名。
- source_word: בַּעֲבוּר
  choice: 因……的缘故
  rationale: 该词可表示原因、根据或“为了……的缘故”。此处采用较贴近原文且不把含义具体化为“因为雅威爱他”的表达，以保留原句的简略性。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译四字神名，保留其作为以色列之上帝专名的性质，而不以称号替代。
theological_decisions:
- issue: “传话”和“起名”的主语
  choice: 正文明确以雅威为连续动作的主语
  alternative: 将第二个动词理解为拿单或大卫给孩子起名
  rationale: 紧接上文“雅威爱他”，希伯来语的连续动词最自然地延续雅威为主语；“借先知拿单”也表明拿单是执行传达的中介。不过原文第二个动词没有重述主语，因此其他理解在语法上并非绝对不可能。
- issue: בַּעֲבוּר יְהוָה所表达的关系
  choice: 这是因雅威的缘故
  alternative: 因为雅威爱他；为了雅威
  rationale: 原文只说“因/为了雅威的缘故”，没有明说“爱”。正文保留其简略和一定的语义张力，不把上文的“雅威爱他”直接补入本节。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“借……传话”适合普通读者，也保留拿单作为先知和传信中介的角色；末句刻意保持原文简洁，不作神学性扩写。
