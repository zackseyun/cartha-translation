  text: וְ/עַתָּ֗ה לֹא תָס֥וּר חֶ֛רֶב מִ/בֵּיתְ/ךָ֖ עַד עוֹלָ֑ם עֵ֚קֶב כִּ֣י בְזִתָ֔/נִי וַ/תִּקַּ֗ח אֶת אֵ֨שֶׁת֙ אוּרִיָּ֣ה הַ/חִתִּ֔י לִ/הְי֥וֹת לְ/ךָ֖ לְ/אִשָּֽׁה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/010.yaml
  text: Now therefore[a], the sword shall never depart from your house[b], because you have despised me and have taken the wife of Uriah the Hittite to be your wife.
translation:
  language: zh_hans
  text: 因此，从今以后，刀剑必永不离开你的家[a]，因为你藐视我[b]，娶赫人乌利亚的妻子为你的妻子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “家”也可指“家庭”“家族”或“王朝”；希伯来语在这里可以包含这些层面。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“你藐视我”。大卫对乌利亚及其妻子所犯的罪，在这里被视为对上帝本人的藐视。
    reason: theological_clarification
lexical_decisions:
- source_word: וְעַתָּה
  choice: 所以现在
  rationale: 兼顾连接词、时间意味和由前文罪状引出审判后果的推论意味。
- source_word: לֹא תָסוּר חֶרֶב ... עַד עוֹלָם
  choice: 刀剑必永不离开
  rationale: סור在此表示离开、除去；否定词与עַד עוֹלָם合用，表达持续而长久的审判。“刀剑”保留暴力、战争与死亡的具体意象。
- source_word: מִבֵּיתְךָ
  choice: 离开你的家
  rationale: “家”保留בַּיִת的宽广含义，既可涉及家庭、家族，也可延伸至王室世系，不把所指限缩为单一层面。
- source_word: עֵקֶב כִּי
  choice: 因为
  rationale: 以自然的现代汉语清楚表达审判缘由。
- source_word: בְזִתָנִי
  choice: 你藐视我
  rationale: 直接保留动词“藐视、轻看”的强烈含义，以及第一人称单数宾语所表达的对上帝本人的冒犯。
- source_word: וַתִּקַּח אֶת אֵשֶׁת אוּרִיָּה הַחִתִּי
  choice: 娶了赫人乌利亚的妻子
  rationale: “娶了”在本句婚姻语境中自然表达“取来”，同时“乌利亚的妻子”保留她当时与乌利亚的婚姻关系这一重点。
- source_word: לִהְיוֹת לְךָ לְאִשָּׁה
  choice: 作你的妻子
  rationale: 贴近希伯来语目的表达，且符合庄重、自然的现代汉语。
theological_decisions:
- issue: “你藐视我”中第一人称代词的所指
  choice: 直接译为“你藐视我”
  alternative: 解释性扩展为“你藐视耶和华的话／命令”
  rationale: 原文明确使用第一人称单数宾语“我”。直译保留本节的神学张力：大卫对乌利亚及其妻子所犯的罪，被宣告为对上帝本人的藐视。
- issue: “你的家”的范围
  choice: 保留宽泛的“你的家”
  alternative: 明确译为“你的家庭”“你的家族”或“你的王朝”
  rationale: 原文בַּיִת可涵盖家庭、家族和王室世系；不在正文中限定，能够保存原文范围上的真实含混。
- issue: “永不离开”所表达的持续性
  choice: 按审判宣告译为“必永不离开”
  alternative: 译为“直到永远都不离开”或弱化为“长久不离开”
  rationale: 否定表达与עַד עוֹלָם共同构成长久持续的宣告；“永不离开”自然有力，同时不额外界定其形而上或绝对时间范围。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“所以现在”承接前文并引出审判；“刀剑必永不离开”保留先知宣告的力度。脚注标记按其实际说明对象分别置于“家”和“我”之后。
