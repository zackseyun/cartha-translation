source:
  edition: WLC
  text: וְ/לָ/רָ֣שׁ אֵֽין כֹּ֗ל כִּי֩ אִם כִּבְשָׂ֨ה אַחַ֤ת קְטַנָּה֙ אֲשֶׁ֣ר קָנָ֔ה וַ/יְחַיֶּ֕/הָ וַ/תִּגְדַּ֥ל עִמּ֛/וֹ וְ/עִם בָּנָ֖י/ו יַחְדָּ֑ו מִ/פִּתּ֨/וֹ תֹאכַ֜ל וּ/מִ/כֹּס֤/וֹ תִשְׁתֶּה֙ וּ/בְ/חֵיק֣/וֹ תִשְׁכָּ֔ב וַ/תְּהִי ל֖/וֹ כְּ/בַֽת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/003.yaml
  text: But the poor man had nothing except one little ewe lamb[a], which he had bought. He kept it alive, and it grew up with him and with his children together; it would eat from his morsel and drink from his cup and lie in his bosom[c][b], and it was like a daughter to him.
translation:
  language: zh_hans
  text: 穷人什么也没有，只有一只他买来的小母羊羔[a]。他养活它；它与他和他的儿子们一同长大，吃他的一口饼，从他的杯中喝，躺在他怀里[b]，在他看来像女儿一样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “母羊羔”指雌性的小羊。
    reason: 说明希伯来语词所明确包含的性别与年龄信息。
  - marker: b
    text: “怀里”也可译作“怀抱中”或“膝上”，表达家中亲密爱怜的情景。
    reason: 说明 חֵיק 的语义范围。
lexical_decisions:
- source_word: רָשׁ
  choice: 穷人
  rationale: 该词指贫穷、缺乏的人；上下文与富人形成鲜明对比，译作“穷人”自然准确。
- source_word: אֵין כֹּל כִּי אִם
  choice: 除了一只……什么也没有
  rationale: 保留原文“全然没有，只有一个例外”的排他结构，同时符合现代汉语表达。
- source_word: כִּבְשָׂה אַחַת קְטַנָּה
  choice: 一只小母羊羔
  rationale: כִּבְשָׂה 指雌性幼羊，קְטַנָּה 表示小；“小母羊羔”兼顾性别、幼小和亲昵色彩。
- source_word: אֲשֶׁר קָנָה
  choice: 自己买来的
  rationale: קנה 在此为购买、取得；加入“自己”使汉语所属关系清楚，但不增添新的行为主体。
- source_word: וַיְחַיֶּהָ
  choice: 他养活它
  rationale: חיה 的使役式表示使之存活、维持其生命；“养活”既保留生命维持之意，也符合饲养幼羊的语境。
- source_word: וַתִּגְדַּל עִמּוֹ וְעִם בָּנָיו יַחְדָּו
  choice: 它和他以及他的儿女一同长大
  rationale: 保留“一同”所表达的共同生活图景；בָּנָיו 形式上是“他的儿子们”，此处以“儿女”自然呈现整个家庭场景，并以脚注注明。
- source_word: מִפִּתּוֹ תֹאכַל
  choice: 吃他的一口食物
  rationale: פַּת 是一小块饼或食物；“一口食物”保留从主人自己份内取食的亲密画面。
- source_word: וּמִכֹּסוֹ תִשְׁתֶּה
  choice: 喝他杯中的水
  rationale: 原文直陈“从他的杯喝”；汉语这样表达自然。“水”是语境性补足，不限定原文未明说的具体饮料。
- source_word: וּבְחֵיקוֹ תִשְׁכָּב
  choice: 躺在他怀里
  rationale: חֵיק 可指胸怀、怀抱或膝间；“怀里”在现代汉语中自然传达亲近爱怜，同时保留身体意象。
- source_word: וַתְּהִי לוֹ כְּבַת
  choice: 在他看来就像女儿一样
  rationale: 保留 כְּ 的明确比喻，不把羊与女儿的关系实体化；“在他看来”自然表达 לוֹ 的关系性。
theological_decisions:
- issue: 母羊羔的人格化家庭意象
  choice: 直接保留与家人同长、同桌饮食、躺在怀里、如同女儿的亲密描写
  alternative: 弱化为一般的饲养和宠爱
  rationale: 原文刻意用家庭式意象增强拿单比喻的情感力量；翻译不应因其强烈而淡化。
- issue: בָּנָיו 的范围
  choice: 正文译作“儿女”并加注形式意义
  alternative: 正文译作“儿子们”
  rationale: 希伯来语形式明确为“他的儿子们”，应让读者知晓；但在这幅全家共同生活的图景中，“儿女”是自然的汉语整体表达，且不影响比喻重点。
- issue: לוֹ כְּבַת 的关系表达
  choice: “在他看来就像女儿一样”
  alternative: “成了他的女儿”
  rationale: 原文是明喻而非实际亲属身份改变，故保留“像”，避免将情感关系说成字面收养。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。短句保持拿单比喻的口述感；“一口食物”“怀里”“像女儿一样”保存原文细腻而强烈的家庭亲情画面。
