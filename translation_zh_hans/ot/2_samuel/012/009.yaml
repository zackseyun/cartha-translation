base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/009.yaml
  text: Why have you despised the word of Yahweh[a], to do what is evil in his sight? You struck down Uriah the Hittite with the sword, and took his wife for yourself as a wife[c][b], and killed him with the sword of the Ammonites.
translation:
  language: zh_hans
  text: 你为什么藐视雅威的话，行他眼中看为恶的事？你用刀杀了赫人乌利亚，又把他的妻子娶来作自己的妻子[a]，又用亚扪人的刀杀了他[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译：“把他的妻子取来归你自己作妻子”，强调大卫将乌利亚的妻子据为己有。
    reason: lexical_alternative
  - marker: b
    text: 原文是“用亚扪人的刀”，意思是大卫利用亚扪人使乌利亚丧命。
    reason: cultural_note
lexical_decisions:
- source_word: מַדּוּעַ
  choice: 为什么
  rationale: 直接保留质问语气，自然传达拿单对大卫的指控。
- source_word: בָּזִיתָ
  choice: 藐视
  rationale: 该词表达轻蔑、鄙弃，不只是一般意义上的违背；“藐视”既准确又符合庄重语体。
- source_word: דְּבַר יְהוָה
  choice: 雅威的话
  rationale: 保留 דָּבָר 的“话”这一基本表达，并将四字神名按其专名译作“雅威”。
- source_word: לַעֲשׂוֹת הָרַע בְּעֵינָיו
  choice: 做他眼中看为恶的事
  rationale: 保留希伯来文“在他眼中”的评价惯用语，同时采用现代汉语可理解的表达。
- source_word: הִכִּיתָ בַחֶרֶב
  choice: 用刀杀了
  rationale: נכה 在本语境中指击杀；中文若直译“用刀击打”会弱化死亡结果，因此译作“用刀杀了”。
- source_word: לָקַחְתָּ לְּךָ לְאִשָּׁה
  choice: 把他的妻子娶来归自己为妻
  rationale: 兼顾“取来”“归你自己”和“作妻子”三层含义，保留原文对大卫据为己有之举的强调。
- source_word: הָרַגְתָּ
  choice: 杀了
  rationale: 采用 הרג 的常规意义，不另行强化为“谋杀”，让上下文本身显明其罪责。
- source_word: בְּחֶרֶב בְּנֵי עַמּוֹן
  choice: 借亚扪人的刀
  rationale: 既保留“亚扪人的刀”这一形象，也明确表达大卫通过亚扪人的军事行动使乌利亚死亡的间接手段。
- source_word: אוּרִיָּה הַחִתִּי
  choice: 赫人乌利亚
  rationale: 采用现代中文圣经人名和族名的通行形式。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文明确使用四字神名；“雅威”以专名形式呈现，避免以称号取代神名。
- issue: 大卫对乌利亚之死的责任
  choice: 你是借亚扪人的刀杀了他
  alternative: 亚扪人用刀杀了他
  rationale: 原句以大卫为“杀了”的主语，并以“亚扪人的刀”说明手段；译文保留其直接道德责任，同时没有抹去亚扪人的实际中介作用。
translation_notes:
  register: 采用现代、庄重而清楚的指控语气。“藐视”“归自己为妻”保留原文的法律与道德分量；两个脚注标记均置于相关正文之后。
