  text: וַ/יֹּאמְר֤וּ עֲבָדָי/ו֙ אֵלָ֔י/ו מָֽה הַ/דָּבָ֥ר הַ/זֶּ֖ה אֲשֶׁ֣ר עָשִׂ֑יתָה בַּ/עֲב֞וּר הַ/יֶּ֤לֶד חַי֙ צַ֣מְתָּ וַ/תֵּ֔בְךְּ וְ/כַֽ/אֲשֶׁר֙ מֵ֣ת הַ/יֶּ֔לֶד קַ֖מְתָּ וַ/תֹּ֥אכַל לָֽחֶם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/021.yaml
  text: Then his servants said to him[a], “What is this thing that you have done? While the child was alive, you fasted and wept; but when the child died, you got up and ate bread.”
translation:
  language: zh_hans
  text: 他的臣仆对他说：“你做的这是什么事？孩子活着的时候，你禁食哭泣；孩子一死，你却起来吃饭了[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“吃饼”，是指进食或用饭的惯用说法。
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: 对他说
  rationale: 承接叙事次序；现代汉语无需另加“然后”，上下文已自然表明动作推进。
- source_word: עֲבָדָיו
  choice: 他的臣仆
  rationale: עֶבֶד 可指奴仆或臣仆；这里是王宫语境，用“臣仆”既符合身份关系，也不武断强调其受奴役地位。
- source_word: מָה הַדָּבָר הַזֶּה אֲשֶׁר עָשִׂיתָה
  choice: 你做的这是什么事
  rationale: 保留希伯来文具体的“这是什么事”问法和臣仆的惊讶，不改写成单纯询问原因的“你为什么这样做”。
- source_word: בַּעֲבוּר הַיֶּלֶד חַי
  choice: 孩子活着的时候
  rationale: 结合后句“孩子一死”的对照，将此处按语境所表达的时间情形译出；“孩子”也比“男孩”更符合这里的婴儿。
- source_word: צַמְתָּ וַתֵּבְךְּ
  choice: 你禁食哭泣
  rationale: 直接而庄重地表达 צום 与 בכה，并保持两个连续动作。
- source_word: וְכַאֲשֶׁר מֵת הַיֶּלֶד
  choice: 孩子一死
  rationale: “一……就/却……”自然呈现时间推进，并与孩子活着时的行为形成鲜明对照。
- source_word: קַמְתָּ
  choice: 你却起来
  rationale: קום 在此指从原先俯伏或哀伤的状态起身；“却”明确传达上下两种行为之间的反差。
- source_word: וַתֹּאכַל לָחֶם
  choice: 吃饭了
  rationale: 字面为“吃饼/吃食物”，但在此是进食或用饭的惯用表达；正文译作自然现代汉语“吃饭”，脚注保留其字面形式。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“臣仆”符合王宫场景；问句保留原文的惊讶语气。脚注标记置于其所解释的“吃饭了”之后。
