- from: 于是，大卫召集了所有民众[a]，前往拉巴，攻打那城，并将城攻取。
  to: 于是，大卫召集了众人[a]，前往拉巴，攻打它，并攻占了它。
  rationale: 修订仅处理现代汉语语义和行文：以“众人”避免“民众”偏指平民，同时不把原文未明说的军事含义写入正文；脚注说明“全军/所有军兵”的语境性译法及字面义。以“攻占了它”替换“将城攻取”，使表述自然并忠实呈现对同一城市先作战、后夺取的顺序。
