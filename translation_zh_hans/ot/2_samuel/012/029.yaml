  text: Then David gathered all the people and went to Rabbah and fought against it and captured it[a].
translation:
  language: zh_hans
  text: 于是，大卫召集了众人[a]，前往拉巴，攻打它，并攻占了它。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“全军”或“所有军兵”；希伯来文直译为“全体百姓”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּאֱסֹף
  choice: 召集
  rationale: אסף在此表示把人聚集起来；“召集”自然贴合军事叙事，同时不额外限定为正式点兵。
- source_word: כָּל הָעָם
  choice: 所有民众
  rationale: 希伯来文直译为“所有民众/百姓”。上下文很可能指可参战的人，但原文没有使用更明确的“军队”或“士兵”，因此正文保留其较宽泛的措辞，并以脚注说明语境义。
- source_word: רַבָּתָה
  choice: 前往拉巴
  rationale: 地名רַבָּה附带表示方向的-ה；“前往拉巴”准确表达朝该城而去。
- source_word: וַיִּלָּחֶם בָּהּ
  choice: 攻打那城
  rationale: לחם与介词ב连用，在此指对该城作战；中文军事叙事用“攻打那城”自然明确，也交代阴性代词所指。
- source_word: וַיִּלְכְּדָהּ
  choice: 将城攻取
  rationale: לכד用于城邑时意为攻占、夺取；“攻取”既准确又符合庄重的历史叙事语体。
theological_decisions: []
