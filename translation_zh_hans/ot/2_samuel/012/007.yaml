reference: 2 Samuel 12:7
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יֹּ֧אמֶר נָתָ֛ן אֶל דָּוִ֖ד אַתָּ֣ה הָ/אִ֑ישׁ כֹּה אָמַ֨ר יְהוָ֜ה אֱלֹהֵ֣י יִשְׂרָאֵ֗ל אָנֹכִ֞י מְשַׁחְתִּ֤י/ךָֽ לְ/מֶ֨לֶךְ֙ עַל יִשְׂרָאֵ֔ל וְ/אָנֹכִ֥י הִצַּלְתִּ֖י/ךָ מִ/יַּ֥ד שָׁאֽוּל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/007.yaml
  text: 'Then Nathan said to David[a], “You are the man! Thus says Yahweh, the God of Israel: I anointed you king over Israel, and I delivered you from the hand of Saul.”'
translation:
  language: zh_hans
  text: 拿单对大卫说[a]：“你就是那人！以色列的上帝雅威如此说：‘我膏立你作以色列的王，我也救你脱离扫罗的手。’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你就是那个人！”希伯来文直译为“你是那人”。
    reason: 说明 אַתָּה הָאִישׁ 的字面结构及中文可选表达；正文用“就是”传达原文在语境中的强调。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 未单独译出连接词 וַ；现代汉语按叙事衔接可自然省略，语序仍清楚表明这是拿单随即作出的回应。
- source_word: אַתָּה הָאִישׁ
  choice: 你就是那人
  rationale: 保留希伯来语定冠词所形成的明确指认和无系词句的强烈语气；“就是”在现代汉语中突出拿单直指大卫正是比喻中的那个人。
- source_word: כֹּה אָמַר
  choice: 如此说
  rationale: 保留先知传信公式的庄重语体；与主语连用为“雅威如此说”，自然且具有宣告意味。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以常见中文音译呈现四字神名，保留其作为以色列之上帝专名的性质，不以称号替代。
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: 以色列的上帝
  rationale: 直接呈现希伯来语附属结构，清楚保留其圣约性称谓。
- source_word: אָנֹכִי … וְאָנֹכִי
  choice: 我……我也
  rationale: 两次明示第一人称，保留原文重复及强调；“也”体现第二项恩惠与前项并列。
- source_word: מְשַׁחְתִּיךָ לְמֶלֶךְ
  choice: 我膏立你作……的王
  rationale: “膏立”兼顾实际的受膏行动与君王职分的设立；“作……的王”符合现代汉语表达。
- source_word: עַל יִשְׂרָאֵל
  choice: 作以色列的王
  rationale: 在君王语境中 עַל 表示治理权；中文用领属式表达王对以色列的统治，较“在以色列之上作王”自然。
- source_word: הִצַּלְתִּיךָ
  choice: 救你脱离
  rationale: 准确表达从危险或敌对权势下搭救出来；配合 מִן 使用“救……脱离”简洁自然。
- source_word: מִיַּד שָׁאוּל
  choice: 脱离扫罗的手
  rationale: 保留希伯来语“手”的意象，指扫罗的权势和控制；中文读者可以自然理解。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。采用“雅威”作为现代中文音译，保留专名性质，而不以“主”这一称号替换；“耶和华”是传统音译，但较不贴近通常重建的读音。
- issue: “膏立”是否只表示任命
  choice: 保留“膏立”
  alternative: 立你为王；任命你作王
  rationale: מָשַׁח 在君王语境中既涉及膏抹行动，也表示被设立担任王职。“膏立”保留原文历史文化和神学意涵，又不额外解释其范围。
- issue: 拿单的指认与比喻中人物的关系
  choice: 你就是那人
  alternative: 你就是这个人；你就是那个人
  rationale: 原文只说“你是那人/这人”，强烈确认大卫就是所控告的人，却没有进一步明说对应关系的每一细节；译文保留这种简练而震撼的指认。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。引语分层以外双内单标示：拿单的话为外层，雅威的信息为内层。正文保留先知公式“如此说”、君王用语“膏立”以及“扫罗的手”这一源语意象；感叹号体现高潮式指认，但不添加原文没有的解释。
