base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/005.yaml
  text: Then David burned with anger against the man greatly[a], and he said to Nathan, “As Yahweh lives, the man who has done this is a son of death!”
translation:
  language: zh_hans
  text: 大卫对那人勃然大怒，便对拿单说：“我指着永活的雅威起誓：做这事的人应当被处死！[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语直译为“是死亡之子”，即应当被处死或配受死刑。
    reason: 说明希伯来惯用语 בֶן מָוֶת 的字面形式及其司法含义。
lexical_decisions:
- source_word: וַיִּחַר אַף ... מְאֹד
  choice: 勃然大怒
  rationale: 希伯来语以“怒气燃烧”的惯用表达描写极强烈的愤怒；“勃然大怒”在现代汉语中自然有力，也明确体现 מְאֹד 的加强语气。
- source_word: בָּאִישׁ
  choice: 对那人
  rationale: 介词 בְּ 在此标明大卫发怒的对象；“对那人”自然承接拿单比喻中的人物。
- source_word: חַי יְהוָה
  choice: 雅威永活
  rationale: 这是庄严的起誓公式；保留“永活”的表达，并将神名 יְהוָה 音译为“雅威”。
- source_word: כִּי
  choice: 以直接陈述表达
  rationale: כִּי 在这里引出起誓后宣告的内容，汉语无需另译为“因为”或“确实”。
- source_word: בֶן מָוֶת
  choice: 该死
  rationale: 该希伯来惯用语直译为“死亡之子”，意思是应受死刑或死有应得；正文采用自然、强烈的汉语表达，直译信息置于脚注。
- source_word: הָאִישׁ הָעֹשֶׂה זֹאת
  choice: 做这事的人
  rationale: 以简洁的关系结构准确表达分词短语对该人的界定。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较贴近学界通行的希伯来语发音重建，并保留其作为专名的性质。
- issue: בֶן מָוֶת 采用直译还是意译
  choice: 正文译作“该死”，脚注注明直译
  alternative: 死亡之子
  rationale: 直译在现代汉语中容易被误解为身份称谓；“该死”准确传达此处应受死刑的司法含义，同时脚注保留原文意象，避免遮蔽其语言形式。
translation_notes:
  register: 采用现代、庄重而有力度的叙事语言。“勃然大怒”同时传达怒气炽烈和 מְאֹד 的强化作用；誓言采用短促句式，以保留大卫宣判时的强烈语气。
