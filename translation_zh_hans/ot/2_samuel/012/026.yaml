base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/026.yaml
  text: And Joab fought against Rabbah of the Ammonites and captured the royal city[a].
translation:
  language: zh_hans
  text: 约押攻打亚扪人的拉巴，攻取了王城[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“都城”。希伯来文直译为“王权之城”或“王室之城”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלָּחֶם
  choice: 攻打
  rationale: 该词为לחם的尼法勒式，在这里表示交战；“攻打”符合围攻城市的军事语境，也自然带出敌对对象。
- source_word: רַבַּת בְּנֵי עַמּוֹן
  choice: 亚扪人的拉巴
  rationale: “拉巴”是地名，“亚扪人”是现代汉语中清楚、通行的族群称谓；此译既保留专名，也明确其归属。
- source_word: וַיִּלְכֹּד
  choice: 攻取
  rationale: לכד在军事语境中指夺取、占领；“攻取”与前面的“攻打”衔接自然，并表明行动取得成功。
- source_word: עִיר הַמְּלוּכָה
  choice: 王城
  rationale: 原文直译为“王权之城”或“王室之城”。“王城”简洁庄重，并保留它与王权、王室相关的含义，不直接把它限定解释为“首都”。
theological_decisions: []
translation_notes:
  register: 采用现代、简洁而庄重的叙事语言。“亚扪人的拉巴”清楚标明地名及其归属；“王城”保留原文可能指王室城区或王国首要城市的语义空间，脚注列出“都城”这一解释性译法。
