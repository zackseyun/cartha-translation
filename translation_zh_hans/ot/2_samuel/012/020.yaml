  edition: WLC
  text: וַ/יָּקָם֩ דָּוִ֨ד מֵ/הָ/אָ֜רֶץ וַ/יִּרְחַ֣ץ וַ/יָּ֗סֶךְ וַ/יְחַלֵּף֙ שמלת/ו וַ/יָּבֹ֥א בֵית יְהוָ֖ה וַ/יִּשְׁתָּ֑חוּ וַ/יָּבֹא֙ אֶל בֵּית֔/וֹ וַ/יִּשְׁאַ֕ל וַ/יָּשִׂ֥ימוּ ל֛/וֹ לֶ֖חֶם וַ/יֹּאכַֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/020.yaml
  text: Then David got up from the ground[a], washed, anointed himself, and changed his clothes. He went into the house of Yahweh and bowed down. Then he went to his house, asked, and they set bread before him, and he ate.
translation:
  language: zh_hans
  text: 大卫就从地上起来，沐浴，抹了油，换了衣服。他进了雅威的圣所，俯伏[a]。随后，他回到自己家里，提出请求，人们就把饼摆在他面前，他便吃了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“敬拜”。这个希伯来语动词可指人在尊崇或敬拜中俯身、伏地。
    reason: 保留וַיִּשְׁתָּחוּ所表达的身体动作与敬拜含义之间的词义幅度。
lexical_decisions:
- source_word: וַיָּקָם מֵהָאָרֶץ
  choice: 从地上起来
  rationale: 承接大卫伏地哀恸的上下文；“地上”具体自然，不作宇宙意义的“地”。
- source_word: וַיִּרְחַץ
  choice: 沐浴
  rationale: רחץ可指洗身或沐浴；此处与抹油、更衣并列，表示结束哀恸状态，“沐浴”最符合语境。
- source_word: וַיָּסֶךְ
  choice: 抹了油
  rationale: סוך指把油涂抹在身上；用“抹了油”保留具体动作，也避免与君王受膏仪式混淆。
- source_word: וַיְחַלֵּף שִׂמְלֹתוֹ
  choice: 换了衣服
  rationale: 按现代汉语习惯将集合意义的衣物译为“衣服”。
- source_word: בֵּית יְהוָה
  choice: 雅威的殿
  rationale: 此处指敬拜雅威的圣所；“殿”在中文圣经语体中简洁而明确。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以“雅威”音译四字神名，保留其作为以色列之神专名的性质，而不以称号替代。
- source_word: וַיִּשְׁתָּחוּ
  choice: 俯伏
  rationale: 该动词首先描写俯身或伏地的动作，在此敬拜场景中也含敬拜意味；正文保留动作层面的表达。
- source_word: וַיִּשְׁאַל
  choice: 开口要
  rationale: 希伯来文未明说所求的宾语，后句才说明有人把饼摆上；此译法在现代汉语中尽量保留宾语省略。
- source_word: לֶחֶם
  choice: 饼
  rationale: 保留לֶחֶם的基本词义；虽然也可泛指食物，此处不必提前泛化为“饭食”。
- source_word: וַיָּשִׂימוּ לוֹ לֶחֶם
  choice: 人们就把饼摆在他面前
  rationale: 保留原文未指明身份的复数主语，并自然表达为他摆上食物的动作。
- source_word: וַיֹּאכַל
  choice: 他便吃了
  rationale: 直接呈现叙事结尾；“便”体现动作承接，不增加因果解释。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名，译作“雅威”可保留专名性质，并采用现代汉语中较通行的音译。
- issue: וַיִּשְׁתָּחוּ是身体动作还是敬拜行为
  choice: 正文译“俯伏”，脚注说明也可译“敬拜”
  alternative: 敬拜；俯伏敬拜
  rationale: 词本身可指俯身、伏地，在雅威之殿的语境中显然具有敬拜意义；正文与脚注共同保留词义及语境之间的张力，不把两者强行合并。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。叙事句式简洁连贯；“雅威的殿”“俯伏”等词保留经文语境的庄严感，同时避免古奥表达。“开口要”刻意不补出原文省略的宾语。
