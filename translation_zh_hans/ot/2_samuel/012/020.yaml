revisions:
- from: 大卫就从地上起来，沐浴，抹了油，换了衣服。他进了雅威的殿，俯伏[a]。随后，他回到自己家里，开口要，人们就把饼摆在他面前，他便吃了。
  to: 大卫就从地上起来，沐浴，抹了油，换了衣服。他进了雅威的圣所，俯伏[a]。随后，他回到自己家里，提出请求，人们就把饼摆在他面前，他便吃了。
  rationale: 修订两处：以“提出请求”自然地保留וַיִּשְׁאַל宾语未明说的句法特点；以“雅威的圣所”表达בֵּית יְהוָה的敬拜场所含义，避免“殿”可能造成的后期圣殿联想。其余译文和脚注均可保留。
