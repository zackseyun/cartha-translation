lexical_decisions:
- source_word: לְעָשִׁיר הָיָה
  choice: 富人有
  rationale: 希伯来语介词לְ与הָיָה构成领有表达，直译近似“对富人而言有”，现代汉语自然译作“富人有”。上下文已先引出富人与穷人，因此用“富人”承接对比。
- source_word: צֹאן וּבָקָר
  choice: 牛羊
  rationale: צֹאן泛指羊等小型牲畜，בָקָר指牛类牲畜。汉语惯用并列语“牛羊”自然概括两类牲畜；虽次序与原文“羊和牛”相反，但不改变所指。
- source_word: הַרְבֵּה מְאֹד
  choice: 许许多多
  rationale: הַרְבֵּה מְאֹד强化数量之多；“许许多多”以自然现代汉语保留其强烈程度。
