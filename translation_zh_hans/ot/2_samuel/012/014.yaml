- from: 然而[a]，因为你借着这件事彻底藐视了耶和华的仇敌，所以那为你生的儿子必定死。
  to: 然而[a]，因为你因这事彻底藐视了耶和华的仇敌，连为你所生的儿子也必定死。
  rationale: 修订只调整汉语对原文连接词和分词的表达：以“因这事”对应 בַּדָּבָר הַזֶּה，以“连……也”对应 גַּם，并以“为你所生的儿子”清楚表达被动分词。正文仍保留马所拉文本所呈现的困难读法；脚注继续说明常见的解释性或修订读法，且锚点保持一致。
