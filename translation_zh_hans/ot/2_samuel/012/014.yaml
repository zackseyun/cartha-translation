base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/014.yaml
  text: Nevertheless[a], because by this matter you have utterly scorned the enemies of Yahweh, the son born to you will surely die.
translation:
  language: zh_hans
  text: 然而[a]，因为你因这事彻底藐视了耶和华的仇敌，连为你所生的儿子也必定死。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这句希伯来语较为困难。许多译本采用解释性或经修订的读法，译作：“你使耶和华的仇敌有机会藐视（或亵渎）耶和华。”
    reason: alternative_reading
lexical_decisions:
- source_word: אֶפֶס
  choice: 然而
  rationale: 在赦免的宣告之后引出强烈转折；“然而”自然、庄重，并保留让步意味。
- source_word: כִּי
  choice: 因为
  rationale: 引出所宣告后果的原因，现代汉语中因果关系清楚。
- source_word: נִאֵץ נִאַצְתָּ
  choice: 彻底藐视了
  rationale: 以“彻底”体现不定式绝对形与限定动词连用的加强语气；“藐视”保留 נאץ 所表达的轻蔑和蔑弃。
- source_word: אֶת אֹיְבֵי יְהוָה
  choice: 耶和华的仇敌
  rationale: 按所给马所拉文本，将该短语直接视为动词的宾语，不在正文中改写为“使耶和华的仇敌有机会亵渎”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神名音译，而不是以称号代替专名。
- source_word: בַּדָּבָר הַזֶּה
  choice: 借着这件事
  rationale: דבר 在此指正在谈论的整件事情或行为；“这件事”范围恰当，“借着”保留介词所表达的途径或凭借。
- source_word: גַּם
  choice: 所以
  rationale: 原词有“也、连同、确实”的附加或强调作用；结合汉语句法，以结果连接和“必定”传达其在上下文中的推进作用，避免生硬译作“也”。
- source_word: הַבֵּן הַיִּלּוֹד לְךָ
  choice: 那为你生的儿子
  rationale: 保留 בֵּן 的男性指称和被动分词“生”的意义；“为你生的”在现代汉语中简洁自然。
- source_word: מוֹת יָמוּת
  choice: 必定死
  rationale: 以“必定”体现不定式绝对形与未完成式连用所表达的强调和确定性。
theological_decisions:
- issue: “耶和华的仇敌”在困难希伯来语句法中的角色
  choice: 正文按所给马所拉文本直译为大卫“藐视了耶和华的仇敌”。
  alternative: 许多译本解释或修订为大卫“使耶和华的仇敌有机会藐视（或亵渎）耶和华”。
  rationale: 所给辅音及元音文本最直接地把 אֵת אֹיְבֵי יְהוָה 标为动词的直接宾语。尽管这种读法在语境中困难，仍不应在正文中悄然以推测性修订消除张力；常见替代读法在脚注中说明。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“彻底藐视”与“必定死”分别保留原文两个强调结构。正文坚持所给马所拉文本的困难读法，并以脚注保存常见的解释性或修订读法。
