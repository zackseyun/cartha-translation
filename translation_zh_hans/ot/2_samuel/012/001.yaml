  text: וַ/יִּשְׁלַ֧ח יְהוָ֛ה אֶת נָתָ֖ן אֶל דָּוִ֑ד וַ/יָּבֹ֣א אֵלָ֗י/ו וַ/יֹּ֤אמֶר ל/וֹ֙ שְׁנֵ֣י אֲנָשִׁ֗ים הָיוּ֙ בְּ/עִ֣יר אֶחָ֔ת אֶחָ֥ד עָשִׁ֖יר וְ/אֶחָ֥ד רָֽאשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/001.yaml
  text: Then Yahweh sent Nathan to David. He came to him and said to him[a], “There were two men in one city, one rich and one poor.”
translation:
  language: zh_hans
  text: 雅威差遣拿单到大卫那里。拿单来到他面前，对他说：“一座城里有两个人[a]，一个富有，一个贫穷。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“有两个人住在一座城里。”原文直译为“一座城里有两个人”。
    reason: 说明הָיוּ可按语境表达为“住着”；替代译文不将原文的“一座城”进一步明确为“同一座城”。
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: 差遣
  rationale: שׁלח在连续叙事形式中表示派人前往执行使命；“差遣”自然、庄重，也比“派遣”更贴合先知受命的语境。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语中常见的音译“雅威”呈现四字神名，保留其专名性质，不以称号替代。
- source_word: אֶת נָתָן
  choice: 拿单
  rationale: אֶת是直接宾语标记，不另译；人名נָתָן按通行中文形式译作“拿单”。
- source_word: אֶל דָּוִד
  choice: 到大卫那里
  rationale: אֶל在此表示差遣的对象或目的地；“到大卫那里”不预先加入“对付”等敌对含义。
- source_word: וַיָּבֹא אֵלָיו
  choice: 拿单来到他面前
  rationale: בוא אֶל可表示来到某人那里；补出“拿单”可避免连续代词在中文里指代含混，“来到他面前”符合当面进言的场景。
- source_word: וַיֹּאמֶר לוֹ
  choice: 对他说
  rationale: 保留希伯来文明确表达的间接宾语，同时采用自然的现代汉语说法。
- source_word: שְׁנֵי אֲנָשִׁים
  choice: 两个人
  rationale: אֲנָשִׁים在此指比喻中的两名男子；现代汉语用“两个人”最自然，后文的身份对比也清楚。
- source_word: הָיוּ
  choice: 有
  rationale: היה在这里是存在用法；“有”直接对应“一座城里有两个人”，不额外加入“居住”的语义。
- source_word: בְּעִיר אֶחָת
  choice: 一座城里
  rationale: 直译为“一座城里”，既自然又保留אֶחָת的“一”字；没有擅自明确为“某一座城”或“同一座城”。
- source_word: אֶחָד עָשִׁיר
  choice: 一个富有
  rationale: 希伯来文是简洁的无系词结构；中文以“一个富有”自然表达其述谓意义。
- source_word: וְאֶחָד רָאשׁ
  choice: 一个贫穷
  rationale: רָאשׁ指贫穷、缺乏的人；“贫穷”与前面的“富有”构成清晰而直接的对比。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文使用的是以色列之神的四字专名，而非“主”这一称号；采用“雅威”既保留专名，也符合其较通行的现代汉语音译。
translation_notes:
  register: 采用自然、庄重而简洁的现代标准汉语。叙事句避免不必要的古语；引语保留拿单比喻开头的简练节奏。
