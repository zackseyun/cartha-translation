  source_fidelity: 主文采用强制劳役的可行理解，并以脚注保留“置于器具之下／经过砖窑”以及可能处死的解释，整体忠实反映此节的主要歧义。惟“砍具”将מַגְזְרוֹת略偏狭地限定为砍伐工具；改为“切割工具”更贴近其宽泛的“切割器具”义，也更符合原文未能确定具体器具名称的状态。
