  text: וְ/אֶת הָ/עָ֨ם אֲשֶׁר בָּ֜/הּ הוֹצִ֗יא וַ/יָּ֣שֶׂם בַּ֠/מְּגֵרָה וּ/בַ/חֲרִצֵ֨י הַ/בַּרְזֶ֜ל וּֽ/בְ/מַגְזְרֹ֣ת הַ/בַּרְזֶ֗ל וְ/הֶעֱבִ֤יר אוֹתָ/ם֙ ב/מלכן וְ/כֵ֣ן יַעֲשֶׂ֔ה לְ/כֹ֖ל עָרֵ֣י בְנֵֽי עַמּ֑וֹן וַ/יָּ֧שָׁב דָּוִ֛ד וְ/כָל הָ/עָ֖ם יְרוּשָׁלִָֽם־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/031.yaml
  text: And he brought out the people who were in it and put them to work with saws[a], iron picks, and iron axes, and made them labor at the brick kiln. Thus he did to all the cities of the Ammonites[c][b]. Then David and all the people returned to Jerusalem.
translation:
  language: zh_hans
  text: 他把城里的居民带出来，叫他们用锯子、铁制尖锐工具和铁制切割工具劳作[a]，又叫他们在砖窑服劳役[b]。他也这样对待亚扪人的所有城邑[c]。随后，大卫和全军都返回耶路撒冷。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“把他们置于锯子、铁制尖锐工具和铁制切割工具之下。”这些器具的确切名称和用途不能确定。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语此处难解。传统上也译作“使他们经过砖窑”；有人据此把整句理解为处死俘虏，而不是强迫他们服劳役。
    reason: alternative_reading
  - marker: c
    text: 另见《历代志上》20:3；那里的平行记载措辞也同样难解。
    reason: cross_reference
lexical_decisions:
- source_word: הוֹצִיא
  choice: 带出来
  rationale: 使役词形通常表示“使出来、带出来”；此处以“带出来”自然表达大卫从城中带出居民。
- source_word: הָעָם אֲשֶׁר בָּהּ
  choice: 城里的居民
  rationale: 直译为“其中的百姓”；上下文所指是被攻取之城内的人，译作“城里的居民”清楚自然。
- source_word: וַיָּשֶׂם
  choice: 叫他们……劳作
  rationale: 本义为“放置、安置”。与后列工具连用时，主文按强制服役理解，但脚注保留“置于工具之下”、即处死的传统解释。
- source_word: בַּמְּגֵרָה
  choice: 用锯
  rationale: מְגֵרָה 指锯；介词可作工具用法。具体是劳动工具还是刑具，须结合整句判断。
- source_word: בַחֲרִצֵי הַבַּרְזֶל
  choice: 铁制尖具
  rationale: 该词组所指器具不确定，可能是带刃或带尖的铁器，也可能指铁制打谷器；“铁制尖具”避免过度具体化。
- source_word: בְמַגְזְרֹת הַבַּרְזֶל
  choice: 铁制砍具
  rationale: 该词泛指切割器具；“砍具”保留其功能意义，而不武断指定为某一种工具。
- source_word: וְהֶעֱבִיר אוֹתָם ב/מלכן
  choice: 又叫他们在砖窑服劳役
  rationale: 原文直译近于“使他们经过……”，末词的读法和含义均困难。主文结合平行经文及劳役语境，采用与制砖相关的解释；脚注说明“经过砖窑”乃至处死的传统理解。
- source_word: וְכֵן יַעֲשֶׂה
  choice: 他这样处置了
  rationale: 未完成式在叙事总结中可表达反复或概括性的行动；“这样处置了”自然承接前述做法，并避免暗示长期惯例。
- source_word: לְכֹל עָרֵי בְנֵי עַמּוֹן
  choice: 亚扪人的所有城邑
  rationale: בְּנֵי עַמּוֹן 是亚扪民族的常规称呼；“城邑”符合庄重叙事语体。
- source_word: וַיָּשָׁב דָּוִד וְכָל הָעָם יְרוּשָׁלִָם
  choice: 大卫和全军都返回耶路撒冷
  rationale: הָעָם 在军事叙事中可指随行军众，译作“全军”比泛称“众人”更贴合语境；שׁוב 加目的地表示返回。
theological_decisions:
- issue: 大卫是强迫亚扪俘虏服劳役，还是用锯、铁器和砖窑处死他们
  choice: 主文采用强制服劳役的理解
  alternative: 也可理解为把他们置于锯和铁器之下，并使他们经过砖窑，即以残酷方式处死
  rationale: וַיָּשֶׂם 与 וְהֶעֱבִיר ... ב/מלכן 的句法和词义都存在困难，平行经文《历代志上》20:3的措辞也同样有歧义。主文采用能形成连贯劳役场景的解释，但以脚注明确保留处死说，不消除原文中的伦理与神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“劳作”“服劳役”清楚呈现征服后的强制劳动语境；“尖具”“砍具”刻意保持器具名称的不确定性。主文不使用过于古雅的“使之过于”等表达，并通过脚注完整保留处死说。
