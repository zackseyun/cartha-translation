source:
  edition: WLC
  text: וָ/אֶתְּנָ֨/ה לְ/ךָ֜ אֶת בֵּ֣ית אֲדֹנֶ֗י/ךָ וְ/אֶת נְשֵׁ֤י אֲדֹנֶ֨י/ךָ֙ בְּ/חֵיקֶ֔/ךָ וָ/אֶתְּנָ֣/ה לְ/ךָ֔ אֶת בֵּ֥ית יִשְׂרָאֵ֖ל וִֽ/יהוּדָ֑ה וְ/אִ֨ם מְעָ֔ט וְ/אֹסִ֥פָה לְּ/ךָ֖ כָּ/הֵ֥נָּה וְ/כָ/הֵֽנָּה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/008.yaml
  text: And I gave you your master's house and your master's wives into your bosom[a], and I gave you the house of Israel and Judah; and if that had been too little[b], I would have added to you such and such things.
translation:
  language: zh_hans
  text: 我把你主人的家赐给你，把你主人的妻子交在你怀中[a]，又把以色列家和犹大家赐给你；若这些还嫌少，我本会把这样那样的东西加赐给你[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “怀中”也可译作“怀抱里”或“膝上”。这是表示亲密领受或占有的希伯来语说法。
    reason: lexical_alternative
  - marker: b
    text: “这样那样的东西”也可理解为“这一类以及更多的东西”。原文是表示还要增添更多的习语。
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶתְּנָה
  choice: 我……赐给你
  rationale: נתן的Qal叙事形式表示过去的赐予；在上帝直接发言的语境中，“赐给”比一般的“给”更自然庄重。
- source_word: בֵּית אֲדֹנֶיךָ
  choice: 你主人的家业
  rationale: בַּיִת可指房屋、家室、王室或产业；此处涉及扫罗王权相关的一切。“家业”保留“家”的概念，也比单纯“家”更能表达转交给大卫的整体产业，但不把含义限定为王朝。
- source_word: נְשֵׁי אֲדֹנֶיךָ
  choice: 你主人的妻妾
  rationale: נָשִׁים字面为复数“妻子/女人”；在古代君王宫廷语境中，“妻妾”是自然的汉语统称，同时不进一步断言这些女子与大卫之间关系的具体性质。
- source_word: בְּחֵיקֶךָ
  choice: 交在你怀中
  rationale: חֵיק本指胸怀或怀抱，也可表达亲密领受或占有。“怀中”保留原文身体隐喻；加“交在”使现代汉语通顺。
- source_word: בֵּית יִשְׂרָאֵל וִיהוּדָה
  choice: 以色列家和犹大家
  rationale: 保留בֵּית的“家”，反映原文与前句“家”的呼应，并避免直接解释为“王国”；中文为平行清楚而在“犹大”后补出“家”。
- source_word: וְאִם מְעָט
  choice: 如果这些还嫌少
  rationale: 表达假设中的不足；“这些”承接此前所赐的一切，“还嫌少”符合现代汉语，也传达原文מְעָט在此处的不足之意。
- source_word: וְאֹסִפָה לְּךָ
  choice: 我还会……赐给你
  rationale: יסף的Hiphil表示继续增添；中文将隐含的赐予关系明确复现，使句意自然，而“还会”保留假设后续的语气。
- source_word: כָּהֵנָּה וְכָהֵנָּה
  choice: 这样那样的东西
  rationale: 这是表示更多同类事物的不定习语；直译式表达“这样那样”保留其不明确性，脚注说明也可能强调加倍或更多。
theological_decisions:
- issue: 本节是否表明上帝认可大卫把扫罗的妻妾作为婚姻伴侣
  choice: 照原文表述上帝把大卫主人的妻妾“交在你怀中”，不增添认可、婚配或仅仅照管等解释。
  alternative: 译为“把你主人的后宫赐给你”，或弱化为“把你主人的妇女托付你照管”。
  rationale: 原文以王位承继和占有的语言描述转交，却未在本句细说关系性质或作道德评判；正文应保留这种神学张力，不代替原文作出裁断。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“赐给”适合上帝自述恩赐的语境；“主人”避免将人的称谓与神圣称号混淆；保留“怀中”和“家”的原文意象，并用脚注解释可能不熟悉的希伯来习语。
