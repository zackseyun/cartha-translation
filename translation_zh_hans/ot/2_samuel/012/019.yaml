base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/019.yaml
  text: When David saw that his servants were whispering[a], David understood that the child was dead. So David said to his servants, “Is the child dead?” And they said, “He is dead.”
translation:
  language: zh_hans
  text: 大卫看见臣仆们在低声耳语，就明白孩子死了。大卫问臣仆：“孩子死了吗？”他们说：“死了。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּרְא
  choice: 看见
  rationale: 这里的 ראה 表示大卫观察到臣仆的举动；“看见”直接自然，也保留由视觉观察引出判断的叙事关系。
- source_word: מִתְלַחֲשִׁים
  choice: 在低声耳语
  rationale: לחש 的 Hitpael 分词表示小声、隐秘地交谈。“低声耳语”自然传达臣仆彼此悄声说话的情形。
- source_word: וַיָּבֶן
  choice: 明白
  rationale: בין 在此指根据所见线索作出判断；“明白”符合现代汉语叙事表达。
- source_word: מֵת
  choice: 死了
  rationale: 该词在叙述、问句和回答中均说明孩子已处于死亡状态。汉语用“死了”既可自然表达状态，也反映状态已经发生。
- source_word: הַיָּלֶד
  choice: 孩子
  rationale: יֶלֶד 可指孩子或男孩；上下文所指是大卫幼小的儿子，“孩子”最贴切且不额外突出性别。
- source_word: עֲבָדָיו
  choice: 臣仆
  rationale: עֶבֶד 在王室语境中指服侍君王的人。“臣仆”兼顾其王室属员身份和服侍关系，比泛称“仆人”更贴合语境，又不武断译成“奴隶”。
- source_word: הֲמֵת הַיֶּלֶד
  choice: 孩子死了吗？
  rationale: 疑问词 הֲ 加上 מֵת 询问孩子是否已死；“孩子死了吗？”是自然、准确的现代汉语问法。
- source_word: וַיֹּאמֶר ... וַיֹּאמְרוּ
  choice: 问……说
  rationale: 原文两处均用 אמר（说）。首处按问句功能译为“问”更符合自然汉语，答复处保留“说”，不增加原文没有的语气。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。句式简洁，保留原文从观察、判断到询问和确认的推进。末句将希伯来文单独的 מֵת 译为“死了”，汉语无需补出主语，既自然又贴近原文，因此不设脚注。
