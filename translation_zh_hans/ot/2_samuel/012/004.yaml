revisions:
- from: 有一个过路的人来到那富户那里；富户舍不得从自己的羊群和牛群中取一只，预备给来到他那里的客旅[a]，却取了那穷人的母羊羔，预备给来到他那里的那个人。
  to: 有一个旅人来到那富户那里；富户舍不得从自己的羊群和牛群中取用来款待来到他这里的客人，却取了那穷人的母羊羔，用它款待来到他这里的那个人。
  rationale: 修订以“旅人／客人”对应相关但不同的来客称谓，并将两处餐食预备的意思自然表达为“款待”。末处保留“那个人”，以反映原文在此使用“人”而非重复“客人”。
