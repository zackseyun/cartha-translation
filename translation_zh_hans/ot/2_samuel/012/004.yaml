base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/004.yaml
  text: A traveler came to the rich man[a], and he spared taking from his own flock and from his own herd to prepare for the traveler who had come to him. So he took the ewe lamb of the poor man and prepared it for the man who had come to him.
translation:
  language: zh_hans
  text: 有一个旅人来到那富户那里；富户舍不得从自己的羊群和牛群中取用来款待来到他这里的客人，却取了那穷人的母羊羔，用它款待来到他这里的那个人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֵלֶךְ
  choice: 过路的人
  rationale: 指行旅之人，而不只是一般意义上的宾客；“过路的人”自然地交代其旅人身份。
- source_word: וַיַּחְמֹל
  choice: 舍不得
  rationale: 该动词通常有“顾惜、怜惜、不肯动用”之意；此处宾语省略，语境表明富户不肯从自己的牲畜中取用。“舍不得”既保留顾惜之意，也符合现代汉语。
- source_word: מִצֹּאנוֹ וּמִבְּקָרוֹ
  choice: 从自己的羊群和牛群中
  rationale: 保留两个集合名词及其物主后缀，并清楚凸显富户拥有众多牲畜。
- source_word: לַעֲשׂוֹת / וַיַּעֲשֶׂהָ
  choice: 预备／预备
  rationale: 在设宴款待的语境中指备办食物；前后采用同一译词，以保留原文词语的重复，同时不额外限定具体烹调方式。
- source_word: לָאֹרֵחַ
  choice: 客旅
  rationale: 既可指旅人，也可指受接待的客人。“客旅”兼顾其行旅身份和受款待者的角色，并与前面的“过路的人”体现相关而不同的希伯来词。
- source_word: כִּבְשַׂת
  choice: 母羊羔
  rationale: 原文明确为雌性的幼羊；“母羊羔”准确且容易理解。
- source_word: הָאִישׁ הָרָאשׁ
  choice: 那穷人
  rationale: רָאשׁ在此指贫穷、缺乏的人，与前文的富户形成鲜明对照。
- source_word: הַבָּא לוֹ / הַבָּא אֵלָיו
  choice: 来到他那里的
  rationale: 保留两处分词结构所表达的来访关系；末处用“那个人”对应אִישׁ，避免擅自将两个不同称谓完全同化。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而清楚的叙事语言。“富户”简洁地对应富有之人；“舍不得”保留原文“顾惜、不肯取用”的语义张力。脚注说明原文对来客使用了相关但不同的称谓。
