base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/031.yaml
  text: And behold[a], the Cushite came, and the Cushite said, “Let my lord the king receive the good news[b], for Yahweh has vindicated you today from the hand of all who rose up against you.”
translation:
  language: zh_hans
  text: 看哪，古实人[a]来了。古实人说：“请我主我王听这好消息！因为雅威今日已经为你伸冤[b]，救你脱离所有起来攻击你之人的手。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“来自古实的人。”传统上也有译作“埃塞俄比亚人”的；原文是“古实人”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“为你施行了判断”或“为你主持了公道”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留引出新人物到场的叙事标记和现场感；“看哪”庄重而简明。
- source_word: הַכּוּשִׁי
  choice: 古实人
  rationale: 原文带定冠词，是族属或地域称谓，并非人名。“古实人”比“埃塞俄比亚人”更贴近原文，也避免用现代国名作过度精确的对应。
- source_word: יִתְבַּשֵּׂר
  choice: 愿……听到好消息
  rationale: 该形式在此带祈愿、劝请语气；译法既表达使者报喜，也符合现代汉语的宫廷敬语语境。
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: 我主我王
  rationale: 保留对君王的恭敬称呼；此处“主”是臣下对君王的尊称，不含神性含义。
- source_word: שְׁפָטְךָ
  choice: 为你伸冤
  rationale: שׁפט在此具有司法裁断并维护大卫一方的含义；“为你伸冤”自然地传达神为他主持公道、作出有利判决的意思。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，保留其作为以色列之神专名的性质，而不以称号替代。
- source_word: מִיַּד
  choice: 救你脱离……之人的手
  rationale: 保留“手”所表达的权势和控制这一具体意象，同时加入“救……脱离”使汉语关系清楚。
- source_word: כָּל הַקָּמִים עָלֶיךָ
  choice: 所有起来攻击你的人
  rationale: 保留קום加על所含“起来敌对”的动态意象，又不把它过度限定为某一种形式的叛乱。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名。正文采用“雅威”作为较贴近YHWH的现代汉语音译，以专名而非“主”等称号呈现；“耶和华”是汉语传统中常见的另一音译。
- issue: שְׁפָטְךָ所表达的神圣审判
  choice: 为你伸冤
  alternative: 为你施行判断／为你主持公道
  rationale: 上下文兼有司法裁断和从敌人权势下获救的含义；正文不把它弱化为单纯军事获胜，而脚注保留较直译的理解。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“看哪”和“我主我王”保留叙事及宫廷语体；其余句法尽量口语可懂而不失经文庄重。脚注标记均置于所说明的词语之后。
