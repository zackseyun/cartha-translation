base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/019.yaml
  text: Then Ahimaaz the son of Zadok said[a], “Please let me run and bring news to the king[b], for Yahweh has delivered him from the hand of his enemies.”
translation:
  language: zh_hans
  text: 撒督的儿子亚希玛斯说：“请让我跑去向王报信[a]，因为耶和华已经为他伸冤[b]，使他脱离仇敌的手。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “报信”也可译作“报喜讯”；这个希伯来语动词常指传来好消息。
    reason: lexical_alternative
  - marker: b
    text: “为他伸冤，使他脱离……”也可译作“判决他胜诉，使他脱离……”或“救他脱离……”。原文既含司法裁断的意味，也指由此得到解救。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַ/אֲחִימַעַץ בֶּן־צָדוֹק אָמַר
  choice: 撒督的儿子亚希玛斯说
  rationale: 按希伯来语的亲属称谓和叙事次序直译；中文叙事不必另译句首连接词 וַ，以免行文生硬。
- source_word: אָרוּצָה נָּא
  choice: 请让我跑去
  rationale: 祈愿式表达说话者的意愿，נָא 带有请求语气；“请让我……”自然地保留了这一语气。
- source_word: וַ/אֲבַשְּׂרָה אֶת־הַמֶּלֶךְ
  choice: 向王报信
  rationale: בשׂר 的加强词干指传报消息，语境中通常带有喜讯色彩；正文用中性的“报信”，脚注保留“报喜讯”的可能。
- source_word: כִּי
  choice: 因为
  rationale: 这里自然地引出亚希玛斯请求去报信的理由，也可理解为所报消息的内容。
- source_word: שְׁפָטוֹ יְהוָה
  choice: 耶和华已经为他伸冤
  rationale: שׁפט 在此不只是一般性的“审判”，而是为王作出有利裁断、维护其正当权益；“为他伸冤”保留司法性的含义。
- source_word: מִיַּד אֹיְבָיו
  choice: 使他脱离仇敌的手
  rationale: “手”是表示权势和控制的希伯来语意象；中文仍可理解，因此予以保留。“使”明确此短语与前面的伸冤行动所产生的解救结果相连。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 采用现代中文圣经读者最熟悉的专名形式“耶和华”，不以“主”这一称号替代原文的神名。
- issue: שְׁפָטוֹ 的司法与拯救双重含义
  choice: 为他伸冤，使他脱离仇敌的手
  alternative: 救他脱离仇敌的手
  rationale: 原文动词 שׁפט 本身具有裁判、主持公道的司法意味，而后接“脱离仇敌的手”；正文同时呈现司法裁断与实际解救，避免只保留其中一面。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“王”比“国王”更符合古代宫廷叙事语体；保留“仇敌的手”这一清楚可懂的源文意象。
