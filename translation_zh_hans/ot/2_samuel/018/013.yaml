base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/013.yaml
  text: Or if I had dealt falsely against his life, and no matter is hidden from the king, then you yourself would have stood aside.
translation:
  language: zh_hans
  text: 或者，我若对他的性命行了诡诈的事——任何事都瞒不过王——你自己就会站在一旁。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עָשִׂיתִי בְנַפְשׁוֹ שֶׁקֶר
  choice: 我若冒死行了欺骗的事
  rationale: “בְנַפְשׁוֹ”按马所拉读法直译较难，可表示以自己的性命为代价或危及自己的性命；结合上下文，译为“冒死”自然传达说话人若违令杀押沙龙便会危及自身。“שֶׁקֶר”保留“欺骗、不忠”的含义。
- source_word: וְכָל־דָּבָר לֹא־יִכָּחֵד מִן־הַמֶּלֶךְ
  choice: 任何事都瞒不过王
  rationale: 以现代汉语自然表达“没有任何事情能向王隐藏”的绝对陈述。
- source_word: וְאַתָּה תִּתְיַצֵּב מִנֶּגֶד
  choice: 你也会站在一旁，不管我
  rationale: “מִנֶּגֶד”表示从对面、远处或置身事外；结合语境，约押届时不会援助说话人。译文保留“站在一旁”的形象，并以“不管我”说明语用含义。
