  text: וַ/יֹּ֤אמֶר הָ/אִישׁ֙ אֶל יוֹאָ֔ב ו/לא אָנֹכִ֜י שֹׁקֵ֤ל עַל כַּפַּ/י֙ אֶ֣לֶף כֶּ֔סֶף לֹֽא אֶשְׁלַ֥ח יָדִ֖/י אֶל בֶּן הַ/מֶּ֑לֶךְ כִּ֣י בְ/אָזְנֵ֜י/נוּ צִוָּ֣ה הַ/מֶּ֗לֶךְ אֹ֠תְ/ךָ וְ/אֶת אֲבִישַׁ֤י וְ/אֶת אִתַּי֙ לֵ/אמֹ֔ר שִׁמְרוּ מִ֕י בַּ/נַּ֖עַר בְּ/אַבְשָׁלֽוֹם־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/012.yaml
  text: But the man said to Joab[a], “Even if I were weighing out a thousand pieces of silver on my palms, I would not put out my hand against the king’s son; for in our hearing the king commanded you and Abishai and Ittai, saying[b], ‘Guard for me the young man Absalom.’”
translation:
  language: zh_hans
  text: 那人对约押说：“即使有人把一千银子称在我手上[a]，我也不会伸手害王的儿子；因为王曾当着我们的面吩咐你、亚比筛和以太说：‘你们要为我保护少年人押沙龙。’[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译近于“在我双手上称一千银子”，指按重量收取一大笔银子；原文没有注明具体的重量单位。
    reason: lexical_alternative
  - marker: b
    text: 本节末尾的希伯来文本较难理解，直译近于“你们要保护 מי 少年人押沙龙”；其中“מי”一词意义不明。许多人参照18:5理解为“你们要为我保护少年人押沙龙”。
    reason: textual_variant
lexical_decisions:
- source_word: שֹׁקֵל עַל כַּפַּי אֶלֶף כֶּסֶף
  choice: 即使我手上称得一千银子
  rationale: 保留“称量”以及银子在双手上的意象，同时以现代汉语表达即使得到如此重酬也不肯下手的让步语气。原文未明说“舍客勒”等重量单位，因此不擅自补入。
- source_word: לֹא אֶשְׁלַח יָדִי אֶל
  choice: 我也不会伸手害
  rationale: “伸手”保留希伯来语意象，“害”则明确该习语在此指对人施加暴力，并不把动作过度具体化为击杀。
- source_word: בֶּן הַמֶּלֶךְ
  choice: 王的儿子
  rationale: 直接保留王室亲属关系，也是此人拒绝伤害押沙龙的核心理由。
- source_word: בְאָזְנֵינוּ
  choice: 我们都亲耳听见
  rationale: 以自然汉语传达“在我们耳中”的希伯来语习惯表达，强调众人直接听到了王命。
- source_word: צִוָּה
  choice: 吩咐
  rationale: 在王对将领发令的语境中表达权威命令，同时符合现代汉语叙事语体。
- source_word: שִׁמְרוּ
  choice: 你们要……保护
  rationale: 这里的命令是要确保押沙龙安全；“保护”比单说“看守”更清楚地传达上下文中的保护含义。
- source_word: מִי בַּנַּעַר בְּאַבְשָׁלוֹם
  choice: 为我保护少年人押沙龙
  rationale: 马所拉文本此处语形困难；正文依据上下文及18:5的平行命令采用最可能的语意，同时以脚注保留原文疑难。
- source_word: הָאִישׁ
  choice: 那人
  rationale: 定冠词指向叙事中已经出现的特定人物；“那人”在中文叙事中自然明确。
- source_word: וְלֹא אָנֹכִי
  choice: 即使……我也不会
  rationale: 用让步结构表达说话人强烈而明确的拒绝，符合整句条件式语意。
theological_decisions: []
translation_notes:
