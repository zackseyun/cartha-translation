revisions:
- from: 那人对约押说：“即使我手上称得一千银子[a]，我也不会伸手害王的儿子；因为王吩咐你、亚比筛和以太时，我们都亲耳听见。他说：‘你们要为我保护少年人押沙龙。’[b]”
  to: 那人对约押说：“即使有人把一千银子称在我手上[a]，我也不会伸手害王的儿子；因为王曾当着我们的面吩咐你、亚比筛和以太说：‘你们要为我保护少年人押沙龙。’[b]”
  rationale: 修订只处理中文表达的歧义和句法自然度：明确银子是被称到说话者手上，而非由他说话者自行称量；并使王命及“在我们耳中”的句法关系更清晰。正文仍依上下文和18:5平行句采用“为我保护少年人押沙龙”，脚注明确保留马所拉文本末尾的疑难，未掩盖其歧义。
