base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/014.yaml
  text: Joab said[a], “Not so[b]; I will not wait before you.” Then he took three spears in his hand and drove them into the heart of Absalom while he was still alive in the heart of the terebinth.
translation:
  language: zh_hans
  text: 约押说：“不，我不愿在你面前这样耽搁下去。”于是，他手里拿了三根短矛[a]，刺入押沙龙的心；那时押沙龙还活着，仍在笃耨香树的中心[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“三根棍杖”。希伯来语这个词可指棍、杖或权杖；这里因其被用来刺击，更可能指短矛一类的武器。
    reason: lexical_alternative
  - marker: b
    text: 或译“橡树”。希伯来语אֵלָה通常指笃耨香树，也有译本采用较笼统的“橡树”。
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא כֵן אֹחִילָה לְפָנֶיךָ
  choice: 我不能在你面前这样耽搁下去
  rationale: אֹחִילָה在此表示等候、拖延；לֹא כֵן与上下文结合，是否定“这样”继续耽搁。译文保留לְפָנֶיךָ“在你面前”的表达，同时采用自然的现代汉语。
- source_word: שְׁלֹשָׁה שְׁבָטִים
  choice: 三根短矛
  rationale: שֵׁבֶט通常可指杖、棍或权杖，但此处是军事场景，且这些器具被刺入押沙龙的心，因此译作可用于刺击的“短矛”；词义上的不确定性在脚注保留。
- source_word: וַיִּתְקָעֵם
  choice: 刺入
  rationale: תקע在此表示用力刺进或插入。“刺入”简洁自然，并与短矛这一具体器具相配。
- source_word: בְּלֵב אַבְשָׁלוֹם
  choice: 押沙龙的心
  rationale: 原文明确使用“心”，故不弱化为“胸膛”或“身体”。
- source_word: עוֹדֶנּוּ חַי
  choice: 那时押沙龙还活着
  rationale: 直接保留原文强调押沙龙中刺时尚未死亡的意思。
- source_word: בְּלֵב הָאֵלָה
  choice: 在笃耨香树的中心
  rationale: אֵלָה较确切地指笃耨香树；בְּלֵב字面为“在……的心中”，此处意为树的中央或深处。译作“中心”，既表达空间意义，也尽量呼应前句“押沙龙的心”。
theological_decisions: []
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“笃耨香树”较“橡树”更贴近原文所指树种，并用脚注说明传统译法；“树的中心”保留原文与“押沙龙的心”之间的措辞呼应。
