  text: וַ/תְּהִי שָׁ֧ם הַ/מִּלְחָמָ֛ה נפצית עַל פְּנֵ֣י כָל הָ/אָ֑רֶץ וַ/יֶּ֤רֶב הַ/יַּ֨עַר֙ לֶ/אֱכֹ֣ל בָּ/עָ֔ם מֵ/אֲשֶׁ֥ר אָכְלָ֛ה הַ/חֶ֖רֶב בַּ/יּ֥וֹם הַ/הֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/008.yaml
  text: The battle spread there over the face of all the land[a], and the forest devoured more of the people that day than the sword devoured.
translation:
  language: zh_hans
  text: 战事在那里散布在全境各处[a]；那一天，森林吞噬的人比刀剑吞噬的更多。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“战事在那里遍及全境。”希伯来语分词可着重表示战事分散在这一地区各处。
    reason: lexical_alternative
lexical_decisions:
- source_word: נפצית
  choice: 遍及
  rationale: 该词是פּוּץ的尼法勒分词阴性形式，与“战斗”呼应，表示战斗分散、扩展到广大区域。“遍及”在现代汉语中自然地表达这种地域上的扩散，同时在脚注中保留“分散”的词义可能。
- source_word: עַל פְּנֵי כָל הָאָרֶץ
  choice: 全境
  rationale: 此处指战场所在的整个地区，并非全世界。“全境”简洁自然地传达“遍及整片土地”的范围含义。
- source_word: וַיֶּרֶב הַיַּעַר לֶאֱכֹל
  choice: 丛林吞噬的人……还多
  rationale: רבה与不定式“吞吃”及比较结构连用，意为丛林造成的死亡人数更多。译文保留丛林“吞噬”人的拟人化意象。
- source_word: הַיַּעַר
  choice: 丛林
  rationale: יַעַר指林木茂密之地；“丛林”既符合叙事地貌，也比“树林”更能承载险恶、吞噬人的语境。
- source_word: מֵאֲשֶׁר אָכְלָה הַחֶרֶב
  choice: 比刀剑吞噬的还多
  rationale: 保留原文明确的比较关系，并重复“吞噬”这一动词，使丛林与刀剑的拟人化平行结构得以呈现。
- source_word: בַּיּוֹם הַהוּא
  choice: 那一天
  rationale: 符合现代汉语叙事习惯，准确表达原文的特定时间。
theological_decisions: []
