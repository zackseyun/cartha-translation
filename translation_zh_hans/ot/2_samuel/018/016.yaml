  source_fidelity: 译文准确反映希伯来文的叙事顺序与因果关系：约押吹响号角，己方人马停止追赶并返回；原因是约押拦阻了他们。将两处הָעָם一致译为“众人”，虽未明说军兵，仍保留原文较宽泛的称谓，并由上下文及脚注交代军事所指。
  naturalness: “约押吹响号角，众人就停止追赶以色列人，退了回来，因为约押制止了众人”是自然、清楚且适合经文叙事的现代标准汉语。“停止追赶……退了回来”完整表达了从追击中转回的意思。
