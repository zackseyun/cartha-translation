  text: וַ/יִּתְקַ֤ע יוֹאָב֙ בַּ/שֹּׁפָ֔ר וַ/יָּ֣שָׁב הָ/עָ֔ם מִ/רְדֹ֖ף אַחֲרֵ֣י יִשְׂרָאֵ֑ל כִּֽי חָשַׂ֥ךְ יוֹאָ֖ב אֶת הָ/עָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/016.yaml
  text: Then Joab blew the trumpet[a], and the people turned back from pursuing Israel[c][b], because Joab restrained the people.
translation:
  language: zh_hans
  text: 约押吹响号角[a]，众人就停止追赶以色列人[b]，退了回来，因为约押制止了众人[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“羊角”。希伯来文“朔法尔”（shofar）指用来传递信号的角，通常是公羊角。
    reason: lexical_alternative
  - marker: b
    text: 这里指拥护押沙龙的以色列军兵。
    reason: cultural_note
  - marker: c
    text: “制止”也可译作“拦住”或“保全”。这里的希伯来动词可指扣住、拦阻或使人免受伤害；本处很可能是说约押阻止众人继续追击。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְקַע בַּשֹּׁפָר
  choice: 吹响号角
  rationale: תקע与שׁוֹפָר连用，表示吹响用来传递信号的角。“吹响号角”既保留具体器物，也自然符合军事叙事语境。
- source_word: וַיָּשָׁב הָעָם מִרְדֹף
  choice: 众人就停止追赶……退了回来
  rationale: שׁוּב表示返回、回转，מִן加不定式表示停止某项行动。这样的译法同时表达停止追击和退回，不把הָעָם过度具体化为“军队”。
- source_word: אַחֲרֵי יִשְׂרָאֵל
  choice: 追赶以色列人
  rationale: אַחֲרֵי在此标明追赶的对象；“以色列”在上下文中指跟随押沙龙的以色列军兵，正文仍按希伯来文保留这一称呼。
- source_word: כִּי
  choice: 因为
  rationale: כִּי在这里引出追击停止的原因，现代汉语用“因为”清楚自然。
- source_word: חָשַׂךְ אֶת־הָעָם
  choice: 制止了众人
  rationale: חָשַׂךְ可表示扣住、拦阻或保全；在本段军事语境中，重点是约押不让己方众人继续追击。“制止”表达该行动，同时不推断其动机。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“众人”对应本节两处הָעָם并保持用词一致；结合军事上下文，读者可理解为约押所率的军兵。标点和语序按现代汉语调整，同时保留原文的因果关系及חָשַׂךְ的词义张力。
