revisions:
- from: 押沙龙生前在王谷为自己立了一根石柱，因为他说：“我没有儿子使我的名字被人记念。”于是，他用自己的名字给那石柱命名；直到今天，那石柱还叫“押沙龙之手”[a]。
  to: 押沙龙在世时为自己立了一根位于王谷的石柱，因为他说：“我没有儿子使我的名字被人记念。”于是，他用自己的名字给那石柱命名；这石柱至今仍称为“押沙龙之手”[a]。
  rationale: 修订仅明确“位于王谷”是对石柱的限定，并将末句调整为较庄重自然的现代汉语。保留“我没有儿子”的原文张力，不补入儿子死亡或无继承人等解释；亦保留“押沙龙之手”这一不寻常名称，并以脚注说明。
