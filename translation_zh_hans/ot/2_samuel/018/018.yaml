base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/018.yaml
  text: Absalom had taken and set up for himself in his lifetime the pillar that is in the Valley of the King[a], for he said, “I have no son to keep my name in remembrance.” So he called the pillar by his own name, and it is called Absalom’s Monument to this day.
translation:
  language: zh_hans
  text: 押沙龙在世时为自己立了一根位于王谷的石柱，因为他说：“我没有儿子使我的名字被人记念。”于是，他用自己的名字给那石柱命名；这石柱至今仍称为“押沙龙之手”[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “押沙龙之手”直译自希伯来语；这里的“手”指纪念标志或纪念碑。
    reason: 说明希伯来语独特用语，同时保留正文中的原文意象。
lexical_decisions:
- source_word: לָקַח וַיַּצֶּב לוֹ
  choice: 为自己立了
  rationale: לָקַח在此与“立起”连用，不必在中文中机械译出“拿了”；“为自己立了”自然表达取得并设立纪念柱的整体动作。
- source_word: בְחַיּו
  choice: 生前
  rationale: 简洁表达“在他活着的时候／一生之中”，也符合这段叙事回顾先前行动的语境。
- source_word: מַצֶּבֶת
  choice: 石柱
  rationale: 该词指竖立的石头或柱子；“石柱”保留具体形象，又能让现代读者理解其纪念用途。
- source_word: בְעֵמֶק הַמֶּלֶךְ
  choice: 在王谷
  rationale: 按希伯来语地名结构直译，作为专名处理，简洁自然。
- source_word: בַּעֲבוּר הַזְכִּיר שְׁמִי
  choice: 使我的名字被人记念
  rationale: 保留使役意义以及被后人记住其名的目的，不将其窄化为仅仅“留名”。
- source_word: וַיִּקְרָא לַמַּצֶּבֶת עַל שְׁמוֹ
  choice: 他用自己的名字给那石柱命名
  rationale: 自然表达“按自己的名字称呼石柱”的希伯来语习语。
- source_word: יַד אַבְשָׁלוֹם
  choice: 押沙龙之手
  rationale: 正文保留希伯来语独特而具体的名称“手”，并用脚注说明此处指纪念标志，避免在正文中消除原文意象。
- source_word: עַד הַיּוֹם הַזֶּה
  choice: 直到今天
  rationale: 采用现代汉语中表达名称持续沿用至叙述者时代的惯用说法。
theological_decisions:
- issue: 押沙龙声称“没有儿子”与撒母耳记下14:27记载他有儿子之间存在表面张力
  choice: 照原文译作“我没有儿子”
  alternative: 解释为“我没有存活的儿子”或“我没有儿子继承我的名”
  rationale: 本节没有明说儿子已经死亡或不能继名；译文保留原文陈述及其张力，不擅自补入一种调和解释。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“生前”“王谷”“记念”等措辞简洁清楚；正文保留“押沙龙之手”这一不寻常的希伯来名称，借脚注解释其语境意义。
