base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/027.yaml
  text: Then the watchman said[a], “I see the running of the first one is like the running of Ahimaaz the son of Zadok.” And the king said, “He is a good man[b], and he comes with good news.”
translation:
  language: zh_hans
  text: 守望的人说：“我看头一个人的跑法，像撒督的儿子亚希玛斯的跑法。”王说：“他是个好人，是来报好消息的[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他会带来好消息。”原文动词也可理解为将来时。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצֹּפֶה
  choice: 守望的人
  rationale: 该分词作名词，指负责观察并报告动静的人；“守望的人”既贴近原文，也符合城楼叙事场景。
- source_word: מְרוּצַת הָרִאשׁוֹן
  choice: 头一个人的跑法
  rationale: 原文用名词“奔跑”，这里着重可辨认的奔跑方式；“跑法”比直译“奔跑”更自然，并保留观察其动作特征的意思。
- source_word: כִּמְרֻצַת
  choice: 像……的跑法
  rationale: 保留比较结构，并与前面的“跑法”呼应，呈现原文重复用词的效果。
- source_word: אֲחִימַעַץ בֶּן צָדוֹק
  choice: 撒督的儿子亚希玛斯
  rationale: 按现代中文圣经人名惯例音译，并明确表达父子关系。
- source_word: אִישׁ טוֹב זֶה
  choice: 他是个好人
  rationale: 原文直译近于“这个是好人”；按自然汉语调整为“他是个好人”，保留王对亚希玛斯的正面判断。
- source_word: וְאֶל בְּשׂוֹרָה טוֹבָה יָבוֹא
  choice: 必是带着好消息来的
  rationale: 结合眼前来人和王的推断，以“必是……来的”自然表达未完成式在语境中的推断意味；“带着好消息”传达其作为报信者前来的含义。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而口语自然的叙事语言。“头一个人”承接两名奔跑者的上下文；“跑法”清楚传达守望者凭奔跑姿态辨认来人的细节。
