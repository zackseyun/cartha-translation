  text: But he said[a], “Whatever happens, let me run.” So he said to him[c][b], “Run.” Then Ahimaaz ran by the way of the plain and passed the Cushite.
translation:
  language: zh_hans
  text: 他却说：“无论如何，请让我跑去。”约押对他说：“你跑吧。”于是亚希玛斯沿着平原的路跑去，赶过了古实人。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “赶过了”也可译作“跑得比古实人快”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וִיהִי מָה אָרוּץ
  choice: 无论如何，请让我跑去
  rationale: 这是带有坚持意味的习语；结合上下文，亚希玛斯是在再次请求获准奔跑。“无论如何”表达不顾结果的坚持，“请让我跑去”保留请求语气，而不把它处理成单纯陈述。
- source_word: רוּץ
  choice: 你跑吧
  rationale: 命令式 רוץ 直接表示“跑”；加“吧”符合现代汉语中准许对方行动的自然语气。
- source_word: דֶּרֶךְ הַכִּכָּר
  choice: 沿着平原的路
  rationale: דֶּרֶךְ 是“路、路线”，הַכִּכָּר 在此指平原，很可能是约旦河平原；正文不补入希伯来文未明说的地名。
- source_word: וַיַּעֲבֹר אֶת־הַכּוּשִׁי
  choice: 赶过了古实人
  rationale: עבר 带直接宾语时可指越过、超过；在赛跑送信的语境中，“赶过了”自然表达亚希玛斯追上并超过对方，同时避免将重点改成整体速度比较。
- source_word: הַכּוּשִׁי
  choice: 古实人
  rationale: כּוּשִׁי 指来自古实的人。“古实人”直接保留原文的族群和地域称谓，比传统的“埃塞俄比亚人”少一层地理解释。
- source_word: אֲחִימַעַץ
  choice: 亚希玛斯
  rationale: 按现代中文圣经人名的通行形式音译。
- source_word: וַיֹּאמֶר לוֹ
  choice: 约押对他说
  rationale: 原文仅为“他对他说”；为避免连续男性代词在现代汉语中造成指代不清，依据紧接的上下文明确主语为约押，未改变叙事所指。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重而简明的现代标准汉语。正文保留原文习语的坚持意味，并以“请”体现其请求性质；为消除汉语代词歧义，明确补出约押的名字。唯一脚注说明 עבר 在奔跑语境中的另一种合理译法。
