base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/017.yaml
  text: And they took Absalom and threw him into the great pit in the forest[a], and they set up over him a very large heap of stones. And all Israel fled[b], each man to his tent.
translation:
  language: zh_hans
  text: 他们带着押沙龙，把他扔进森林里的大坑，又在他上面堆起一座非常大的石堆。以色列众人都逃走了，各自回自己的帐篷[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “帐篷”在这里可泛指个人的住处；意即各自回家。
    reason: 说明希伯来语习语在保留字面意象之外的含义。
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: 众人抬起
  rationale: לקח在叙事中通常表示“拿、带”；此处对象是押沙龙，结合随后将他扔进坑里的动作，译作“抬起”自然呈现搬动其遗体的动作，同时不额外加入“抓住”等强制意味。
- source_word: וַיַּשְׁלִיכוּ אֹתוֹ
  choice: 把他扔进
  rationale: שלך表示投掷、丢弃；“扔进”既符合现代汉语，也保留处置遗体时所显出的粗暴与羞辱。
- source_word: בַיַּעַר אֶל הַפַּחַת הַגָּדוֹל
  choice: 林中的大坑里
  rationale: יַעַר是“树林、森林”，פַּחַת指坑或凹陷；“林中的大坑里”清楚保留地点关系，并与上下文中的树林场景一致。
- source_word: וַיַּצִּבוּ עָלָיו גַּל אֲבָנִים
  choice: 在他上面堆起一大堆石头
  rationale: יצב在此与“石堆”连用，表示立起或筑起；汉语“堆起”准确呈现以石头在遗体上筑成石堆的动作。
- source_word: גָּדוֹל מְאֹד
  choice: 一大堆
  rationale: 该短语强化石堆之大；现代汉语“一大堆石头”自然传达强烈的数量和规模感。
- source_word: וְכָל יִשְׂרָאֵל נָסוּ
  choice: 以色列众人都逃跑了
  rationale: “以色列”在此为集体称谓；加“众人”使汉语明确所指是以色列一方的人，而“逃跑”准确对应נוס。
- source_word: אִישׁ לְאֹהָלוֹ
  choice: 各自回到自己的帐篷
  rationale: איש作分配用法，宜译为“各自”；“帐篷”保留原文具体意象，而“回到”自然表达逃散后各归住处的方向。
theological_decisions:
- issue: אִישׁ לְאֹהָלוֹ的男性单数分配形式
  choice: 各自回到自己的帐篷
  alternative: 各人回到自己的帐篷
  rationale: 这里的איש是惯用的分配表达，重点在人人各归其处，并非特意强调性别；“各自”在现代汉语中准确、自然，也不扩大或缩小所指群体。
- issue: לְאֹהָלוֹ按字面还是按习语翻译
  choice: 正文保留“帐篷”
  alternative: 各自回家
  rationale: “帐篷”是原文明确使用的意象，在本处仍可理解；同时该表达也可泛指住所，因此以脚注说明习语含义，不在正文中消除这一层张力。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语叙事体。“扔进”保留原文动作的粗暴感；“堆起一大堆石头”避免生僻术语，同时准确再现石堆意象。
