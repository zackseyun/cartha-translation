source:
  edition: WLC
  text: וַ/יְשַׁלַּ֨ח דָּוִ֜ד אֶת הָ/עָ֗ם הַ/שְּׁלִשִׁ֤ית בְּ/יַד יוֹאָב֙ וְ֠/הַ/שְּׁלִשִׁית בְּ/יַ֨ד אֲבִישַׁ֤י בֶּן צְרוּיָה֙ אֲחִ֣י יוֹאָ֔ב וְ/הַ֨/שְּׁלִשִׁ֔ת בְּ/יַ֖ד אִתַּ֣י הַ/גִּתִּ֑י וַ/יֹּ֤אמֶר הַ/מֶּ֨לֶךְ֙ אֶל הָ/עָ֔ם יָצֹ֥א אֵצֵ֛א גַּם אֲנִ֖י עִמָּ/כֶֽם־־־ס־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/002.yaml
  text: 'David sent out the troops: one third under Joab[a], one third under Abishai son of Zeruiah, Joab’s brother, and one third under Ittai the Gittite. And the king said to the troops, “I myself will surely go out with you.”'
translation:
  language: zh_hans
  text: 大卫派军兵出战：三分之一由约押率领[a]，三分之一由洗鲁雅的儿子、约押的兄弟亚比筛率领，三分之一由迦特人以太率领。王对军兵说：“我也一定亲自跟你们一同出战。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“在约押手中”，是指由他掌权或指挥。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְשַׁלַּח
  choice: 派……出战
  rationale: 此处处于军事语境，表示大卫派出部队投入战斗；“派……出战”自然传达动作和方向。
- source_word: הָעָם
  choice: 军兵
  rationale: 该词本义可指“百姓”，但在当前战事语境中明确指大卫的作战人员；“军兵”庄重且易懂。
- source_word: הַשְּׁלִשִׁית / הַשְּׁלִשִׁת
  choice: 三分之一
  rationale: 三个重复形式分别指全军的一个三分之一，保留了三路编制。
- source_word: בְּיַד
  choice: 由……率领
  rationale: 字面为“在……手中”，在军事语境中表示置于某人的权下或指挥之下；正文采用自然汉语，并以脚注保留字面意象。
- source_word: אֲבִישַׁי בֶּן צְרוּיָה אֲחִי יוֹאָב
  choice: 洗鲁雅的儿子、约押的兄弟亚比筛
  rationale: 保留母名及兄弟关系，并按现代汉语习惯安排同位说明。
- source_word: אִתַּי הַגִּתִּי
  choice: 迦特人以太
  rationale: 以常见中文音译表达姓名和籍贯称谓。
- source_word: וַיֹּאמֶר הַמֶּלֶךְ
  choice: 王……说
  rationale: 保留希伯来文此处对大卫的称谓“王”，以简洁的汉语叙事连接上下文。
- source_word: יָצֹא אֵצֵא
  choice: 一定……出战
  rationale: 不定词绝对式与限定动词连用，强化大卫的决意；“一定”体现这一语气。
- source_word: גַּם אֲנִי
  choice: 我也……亲自
  rationale: גם表达“也”，独立人称代词带有强调；合译为“我也……亲自”同时保留附加和亲身参与之意。
- source_word: עִמָּכֶם
  choice: 跟你们一同
  rationale: 直接表达陪同军兵行动。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而通俗的军事叙事用语。“军兵”避免把 הָעָם 在此误解为全体百姓；三次“率领”清楚呈现三路部署。引语中的“我也一定亲自”保留 גם אֲנִי 与 יָצֹא אֵצֵא 的双重强调。
