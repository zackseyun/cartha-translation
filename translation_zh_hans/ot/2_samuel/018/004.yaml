base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/004.yaml
  text: The king said to them[a], “What seems good in your eyes, I will do.” So the king stood beside the gate[c][b], and all the people went out by hundreds and by thousands.
translation:
  language: zh_hans
  text: 王对他们说：“你们认为什么好，我就做什么。”于是王站在城门旁[b]，众民都按百人、千人的编制[c]出发了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 或译“在城门边”。希伯来文直译为“在城门的手边”，是表示位于城门旁的习语。
    reason: lexical_alternative
  - marker: c
    text: 指按军事编制组成的队伍。
    reason: cultural_note
lexical_decisions:
- source_word: אֲשֶׁר יִיטַב בְּעֵינֵיכֶם
  choice: 你们认为好的
  rationale: 希伯来语直译为“在你们眼中看为好的”，表示由对方判断什么最妥当。正文采用自然的现代汉语表达，并以脚注保留原文意象。
- source_word: אֶעֱשֶׂה
  choice: 我就去做
  rationale: 直接表达עשה的广义行动含义，说明王接受众人的意见，不额外限定具体做法。
- source_word: אֶל יַד הַשַּׁעַר
  choice: 站在城门旁
  rationale: אֶל יַד字面涉及“手边”，在此是表示邻近位置的习语；“城门旁”准确而自然。
- source_word: וְכָל הָעָם
  choice: 众民都
  rationale: 原文使用“民、百姓”一词，而非专指军队的名词；“众民”保留这一措辞，军事语境由后面的编队方式显明。
- source_word: יָצְאוּ
  choice: 出发了
  rationale: יצא基本义为“出去”。在军队按编制离开的语境中，“出发”比单纯“出去”更自然，但没有强化为“进军”或“开战”。
- source_word: לְמֵאוֹת וְלַאֲלָפִים
  choice: 按百人队、千人队
  rationale: 保留原文“数百、数千”的数字结构，同时用“队”清楚表达这里所指的军事编组。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“众民”保留原文较宽泛的称呼；“百人队、千人队”则自然显出当时的军事背景。所有脚注标记均置于相关正文之后。
