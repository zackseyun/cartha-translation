base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/007.yaml
  text: 'There the people of Israel were defeated before the servants of David[b][a], and the slaughter there was great on that day: twenty thousand men.'
translation:
  language: zh_hans
  text: 以色列民在那里败在大卫的臣仆面前；那一天，那里有大规模的杀戮，共有二万人被杀。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“两万”；“人”是按战斗杀戮的语境补出的。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּנָּגְפוּ
  choice: 败在……面前
  rationale: נָגַף 的尼法勒形在此表示在战斗中被击败；“败在……面前”既保留 לִפְנֵי 的希伯来叙事表达，也清楚传达军事语境。
- source_word: עַם יִשְׂרָאֵל
  choice: 以色列民
  rationale: 直译为“以色列的百姓/民”；上下文所指虽是参战部队，但保留原文较宽泛的称呼，不把它限定为正式军队。
- source_word: עַבְדֵי דָוִד
  choice: 大卫的臣仆
  rationale: עֶבֶד 可指仆人、臣属或随从；此处是大卫麾下作战的人。“臣仆”保留其从属关系，又比单纯“仆人”更适合王权与军事语境。
- source_word: הַמַּגֵּפָה
  choice: 死伤
  rationale: מַגֵּפָה 可指打击、灾殃或瘟疫；在本节战报中指战斗造成的致命打击。“死伤”以自然现代汉语表达战场损失，同时避免误解为疾病。
- source_word: גְדוֹלָה
  choice: 十分惨重
  rationale: 原义为“大”；与战场“死伤”搭配时，“十分惨重”是现代汉语自然且庄重的表达。
- source_word: עֶשְׂרִים אָלֶף
  choice: 两万人
  rationale: 希伯来文仅作“两万”；中文需补出量词和所数对象。“人”由战斗伤亡语境补足。
theological_decisions: []
