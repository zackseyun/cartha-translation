base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/020.yaml
  text: Joab said to him[a], “You are not a bearer of news today. You may carry news on another day, but today you must not carry news, because the king’s son is dead.”
translation:
  language: zh_hans
  text: 约押对他说：“你今天不适合报信[a]。改日你可以报信，但今天不可报信，因为王的儿子死了。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“你今天不适合传好消息”。这里的希伯来语可指消息，且常带“好消息”的含义；但本节所说的是王的儿子死亡。
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ בְּשֹׂרָה
  choice: 该由你去报信
  rationale: 原文直译近似“报信之人”，在本句中表示当天承担报信任务的人。译为“今天不该由你去报信”，既传达约押拒绝让他当天充任报信者的意思，也比“你不是报信的人”更符合现代汉语。
- source_word: וּבִשַּׂרְתָּ
  choice: 改日你可以报信
  rationale: 此处未完成式与“另一天”连用，在语境中表示将来的许可或机会；“可以”自然表达这种语气。
- source_word: תְבַשֵּׂר
  choice: 不可报信
  rationale: לֹא加未完成式在约押的直接话语中表达当下的禁止；“不可”保持命令力度和庄重语体。
- source_word: בְּשֹׂרָה / בשׂר
  choice: 报信
  rationale: 该词族可指传报消息，且常带“好消息”色彩；但这里所涉及的是王子死亡，正文采用中性的“报信”，不预先把消息定性为喜讯。
- source_word: הַיּוֹם הַזֶּה
  choice: 今天
  rationale: 原文三次强调“这一天”；现代汉语用“今天”简洁自然，并保留其重复强调。
- source_word: כִּי
  choice: 因为
  rationale: 引出约押禁止他当天报信的理由。
- source_word: בֶּן הַמֶּלֶךְ מֵת
  choice: 王的儿子死了
  rationale: 按希伯来语关系结构直译，并以“死了”自然表达死亡已经发生及其当前结果。
theological_decisions: []
translation_notes:
  register: 采用现代、清楚而庄重的叙事语言。保留原文“今天—改日—今天”的对比和“报信”的重复；将希伯来语习语“报信之人”按语境自然译为“该由你去报信”。
