base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/011.yaml
  text: Then Joab said to the man who had told him[a], “Look, you saw him[b]; why then did you not strike him there to the ground? And I would have been obliged to give you ten pieces of silver and one belt.”
translation:
  language: zh_hans
  text: 约押对那向他报信的人说：“你明明看见他了，为什么不当场把他打倒在地呢？我本该给你十份银子[a]和一条腰带[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“十银”，没有注明具体的重量或货币单位；“份”是为使汉语自然通顺所补。
    reason: lexical_alternative
  - marker: b
    text: 原文这一表达更直译为“给你这事在我身上”，意为此事本该由我承担、由我给你；也可译作“我本会给你十份银子和一条腰带”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּגִּיד לֹו
  choice: 那向他报信的人
  rationale: 带冠词的分词作名词使用，指先前向约押报告此事的人；“报信”符合叙事语境，也比“告诉他的人”更自然。
- source_word: וְהִנֵּה רָאִיתָ
  choice: 你明明看见了
  rationale: הִנֵּה在这里引出约押带有责问意味的反应；“明明”以自然现代汉语表达其提示和强调作用，不采用较古雅的“看哪”。
- source_word: הִכִּיתוֹ שָׁם אָרְצָה
  choice: 当场把他打倒在地
  rationale: 保留נכה的“击打”意象和אָרְצָה“向地面”的方向，同时以“当场”自然表达שָׁם；没有直接译成“杀死”，以免把语境中的致命含义过度明说。
- source_word: וְעָלַי לָתֶת לְךָ
  choice: 我就有责任给你
  rationale: עָלַי加不定式表达某事落在说话者身上、由其负责；此译保留责任或义务意味，同时符合现代汉语。
- source_word: עֲשָׂרָה כֶסֶף
  choice: 十份银子
  rationale: 原文直译为“十银”，没有明说重量或货币单位；“十份银子”避免擅自具体化为“十舍客勒”或“十枚银币”。
- source_word: חֲגֹרָה אֶחָת
  choice: 一条腰带
  rationale: חֲגֹרָה指束腰之物；“腰带”是清楚自然的现代汉语对应词，并保留数词“一”。
theological_decisions:
- issue: 约押所说报酬的语气
  choice: 保留“由我负责／我有责任给”的义务意味
  alternative: 译为“我就会给你”
  rationale: 原文וְעָלַי לָתֶת לְךָ字面为“给你这事就在我身上”，不仅陈述可能发生的给予，也带有承担责任的语气；译文不进一步判断约押此前是否已公开悬赏。
translation_notes:
  register: 采用自然、庄重的现代叙事汉语。对话保留约押责问的力度；“打倒在地”保存原文动作意象，“有责任”则保存希伯来语习语中的承担意味。
