revisions:
- from: 约押对那向他报信的人说：“你明明看见了，为什么不当场把他打倒在地呢？那样，我就有责任给你十份银子[a]和一条腰带了[b]。”
  to: 约押对那向他报信的人说：“你明明看见他了，为什么不当场把他打倒在地呢？我本该给你十份银子[a]和一条腰带[b]。”
  rationale: 修订仅澄清原文在上下文中的反事实责任语气，并改善现代汉语的自然度；“打倒在地”保留 נכה 与“向地面”的动作意象，不将其直接限定为“杀死”。脚注修正“十银”未标单位的说明，并更准确解释“在我身上”的习语。
