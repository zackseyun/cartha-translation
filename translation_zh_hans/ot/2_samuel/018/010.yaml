  text: One man saw it and told Joab[a], and said, “Look, I saw Absalom hanging in the terebinth tree.”
translation:
  language: zh_hans
  text: 有一个人看见了，就告诉约押，说：“看！我看见押沙龙挂在那棵笃耨香树[a]上。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“橡树”。希伯来语 אֵלָה 可指笃耨香树，有时也较笼统地译作“橡树”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ אֶחָד
  choice: 有一个人
  rationale: 既保留单数个体的强调，也符合现代汉语叙事习惯；此处上下文不需要刻意译出性别词“男人”。
- source_word: וַיַּרְא
  choice: 看见了
  rationale: 忠实表达完成的看见动作；希伯来文未明说宾语，汉语也可自然地让所见内容由后文补明。
- source_word: וַיַּגֵּד לְיוֹאָב
  choice: 就去告诉约押
  rationale: “告诉约押”直接对应报告动作；补入“去”使连续叙事在汉语中自然，但不增加实质信息。
- source_word: הִנֵּה
  choice: 看！
  rationale: 保留引人注意的语气，同时避免较古雅的“看哪”。
- source_word: רָאִיתִי
  choice: 我看见
  rationale: 直接表达说话者已经目睹的事实，符合现代汉语报告语境。
- source_word: תָּלוּי
  choice: 挂在……上
  rationale: 对应被动分词“悬挂着”的状态；“挂在”自然简洁，并不自行说明押沙龙是如何被挂住的。
- source_word: בָּאֵלָה
  choice: 在那棵笃耨香树上
  rationale: אֵלָה通常指笃耨香树（terebinth）；“那棵”体现定冠词及上文已提到的特定树，量词“棵”符合汉语表达。
