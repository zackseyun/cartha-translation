base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/001.yaml
  text: Then David mustered the people who were with him and appointed over them commanders of thousands and commanders of hundreds[a][b].
translation:
  language: zh_hans
  text: 大卫检阅了与他在一起的众人[a][b]，又委派千夫长和百夫长统领他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “检阅”也可译作“数点”或“点阅”；希伯来语动词在这里可指军事上的点名、清查或整编，不只是计算人数。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“与他在一起的众人”；这里指与大卫在一起的队伍。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְקֹד
  choice: 检阅
  rationale: פקד在军事语境中可指点阅、清点并整编人员；下文随即设立各级统领，因此“检阅”比单纯的“数点”更贴合，同时不把整军含义说得过满。
- source_word: הָעָם
  choice: 众人
  rationale: עם字面为“人民、众人”，本节具体指与大卫同在的队伍。“众人”既保留原文较宽泛的称呼，也能由军事上下文显明其所指。
- source_word: אֲשֶׁר אִתּוֹ
  choice: 跟随他的
  rationale: 原文直译为“与他在一起的”。中文用“跟随他的”自然地表达这些人与大卫同行、归于其队伍，但不额外断定正式的指挥关系。
- source_word: וַיָּשֶׂם עֲלֵיהֶם
  choice: 为他们设立
  rationale: שׂים与עַל连用表示把人安置或任命在他人之上；结合后面的军职，“为他们设立”清楚自然。
- source_word: שָׂרֵי
  choice: 夫长
  rationale: שׂר指首领或官长；在“千、百”的军事编制搭配中，采用现代中文圣经读者熟悉的“千夫长、百夫长”，简洁表达统领职分。
- source_word: אֲלָפִים
  choice: 千
  rationale: אֶלֶף既可表示一千，也可能指某种社会或军事单位；此处与“百”构成惯用的军队组织表达，正文采用数目义，同时以脚注保留“单位”的可能性。
- source_word: מֵאוֹת
  choice: 百
  rationale: 与“千”并列构成军事分级用语，译为“百”并合成“百夫长”，符合自然中文。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“检阅”保留军事点阅的语义范围；“众人”避免把原文较宽的עם直接收窄为“军队”。“千夫长、百夫长”是清楚而惯用的军事职衔表达。
