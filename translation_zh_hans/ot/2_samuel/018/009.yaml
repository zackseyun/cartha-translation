revisions:
- from: 押沙龙偶然遇见了大卫的臣仆。那时，押沙龙正骑着骡子；骡子从一棵大笃耨香树[a]茂密交错的枝条下经过，他的头被树枝卡住，整个人便悬在天地之间，他胯下的骡子却继续往前去了。
  to: 押沙龙偶然来到大卫的臣仆面前；那时他正骑着骡子。骡子从一棵大笃耨香树[a]茂密交错的枝条下经过，他的头被树枝卡住，便悬在天地之间；他胯下的骡子却继续往前去了。
  rationale: 仅修订首句，以较中性的“偶然来到……面前”对应原文尼法勒式的偶发相遇及 לִפְנֵי 的空间关系，避免“遇见”在汉语中容易造成的主动会见含义。其余译文及脚注可保留。
