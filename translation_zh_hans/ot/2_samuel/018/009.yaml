  terminology: “臣仆”适合王室军事叙事；“骡子”“天地之间”准确自然。“笃耨香树”虽不常见，却是对 אֵלָה（terebinth）的可接受较精确译名；保留脚注中的“橡树”及泛称“大树”作为词汇替代说明是恰当的。
