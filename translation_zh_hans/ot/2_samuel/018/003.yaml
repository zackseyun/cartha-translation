  terminology: “不可出战”“抵得上”“留在城里支援我们”均符合叙事和军事语境。“出战”是依上下文作出的自然表达，未造成实质增义。末句不应把支援的具体方式说得过细；现有措辞和说明保留了原文的简略性。
