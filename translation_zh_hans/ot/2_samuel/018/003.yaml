base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/003.yaml
  text: But the people said[a], “You must not go out, for if we flee, they will not pay attention to us; and if half of us die, they will not pay attention to us. For you are worth ten thousand of us[c][b]; so now it is better that you be ready to help us from the city.”
translation:
  language: zh_hans
  text: 众人却说：“你不可出战。若我们逃跑，敌人也不会把我们放在心上；若我们有一半人死了，他们也不会把我们放在心上。[a]因为如今你一人抵得上我们一万人。[b]所以，你最好留在城里支援我们。”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “把我们放在心上”是希伯来语习语，意思是把我们当作主要关注对象。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译：“如今你像我们一万人。”
    reason: lexical_alternative
  - marker: c
    text: 末句的希伯来文措辞较为简略，意思可能是大卫留在城中，以便在需要时提供支援或增援。
    reason: textual_note
lexical_decisions:
- source_word: לֹא תֵצֵא
  choice: 你不可出战
  rationale: 否定词加未完成式在直接引语中表达强烈劝阻。“出战”按军事语境自然表达“出去”，同时没有增添具体战术含义。
- source_word: כִּי אִם נֹס נָנוּס
  choice: 即使我们逃跑
  rationale: 不定式绝对式与同根限定动词连用，强化“逃跑”；在此条件语境中用“即使”自然传达让步意味及强调语气。
- source_word: לֹא יָשִׂימוּ אֵלֵינוּ לֵב
  choice: 敌人也不会把我们放在心上
  rationale: 希伯来语习语直译为“不把心放向我们”，意为不以他们为关注重点。补出语境中隐含的主语“敌人”，使中文清楚。
- source_word: וְאִם יָמֻתוּ חֶצְיֵנוּ
  choice: 即使我们死了一半
  rationale: 保留原文“死”的措辞，而不解释性地改成“被杀”；中文表达自然。
- source_word: כִּי עַתָּה כָמֹנוּ עֲשָׂרָה אֲלָפִים
  choice: 因为如今你一人抵得上我们一万人
  rationale: 原文的比较句字面近于“如今你像我们一万人”。“抵得上”以自然中文表达大卫对于军队的分量，同时用脚注保留字面形式。
- source_word: וְעַתָּה טוֹב
  choice: 所以，你最好
  rationale: טוֹב在这里表示更可取的做法；“最好”准确而自然地承接前面的理由。
- source_word: מֵעִיר לְעָזִיר
  choice: 留在城里支援我们
  rationale: מֵעִיר表示帮助来自城中；末词通常按“帮助、支援”理解。结合上下文，译文表达大卫从城中提供支援，但以脚注说明原文措辞。
