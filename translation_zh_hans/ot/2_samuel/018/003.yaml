revisions:
- from: 众人却说：“你不可出战。即使我们逃跑，敌人也不会把我们放在心上；即使我们死了一半，他们也不会把我们放在心上。[a]因为如今你一人抵得上我们一万人。[b]所以，你最好留在城里支援我们。”[c]
  to: 众人却说：“你不可出战。若我们逃跑，敌人也不会把我们放在心上；若我们有一半人死了，他们也不会把我们放在心上。[a]因为如今你一人抵得上我们一万人。[b]所以，你最好留在城里支援我们。”[c]
  rationale: 将两处“即使”统一改为条件性的“若”，避免把原文的假设条件误译为让步条件；将“我们死了一半”调整为“我们有一半人死了”，更清楚对应“我们的一半死去”。同时微调脚注a，使习语解释更自然、中性。其余译文忠实保留原文的重复、比较表达及末句的简略性。
