  text: So the troops went out into the field to meet Israel[a], and the battle took place in the forest of Ephraim.
translation:
  language: zh_hans
  text: 于是，军队[a]出到野外迎战以色列；战斗发生在以法莲的树林。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文为“百姓”或“人民”；这里指大卫的作战部队。
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעָם
  choice: 军兵
  rationale: 该词通常意为“百姓、人民”，但在本节军事语境中指前文所述大卫的作战部队。“军兵”既符合上下文，也不必在正文中补出“大卫的”。
- source_word: הַשָּׂדֶה
  choice: 野外
  rationale: 该词可指田野或开阔地；与“出去”连用时，“出到野外”自然表达军队从驻地进入作战区域。
- source_word: לִקְרַאת
  choice: 迎战
  rationale: 该词基本义为“迎接、会合、遭遇”；在明确的战争语境中译作“迎战”，自然传达敌对相遇的含义。
- source_word: יִשְׂרָאֵל
  choice: 以色列
  rationale: 原文直接使用专名“以色列”，虽在上下文中特指押沙龙一方的军队，正文仍保留这一称呼，不将其解释性改写。
- source_word: הַמִּלְחָמָה
  choice: 战事
  rationale: 该词可指战争或战斗；此处描述一次具体交战，“战事”符合叙事语境。
- source_word: וַתְּהִי
  choice: 发生
  rationale: 该动词字面意为“是、成为”；与“战事”搭配时译作“发生”，是自然且贴近原意的现代汉语表达。
- source_word: בְּיַעַר אֶפְרָיִם
  choice: 在以法莲树林
  rationale: יַעַר意为“森林、树林”；保留“以法莲”这一地名，不对其地理位置作正文以外的推断。
