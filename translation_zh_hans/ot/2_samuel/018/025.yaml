base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/025.yaml
  text: Then the watchman called out and told the king. And the king said[a], “If he is by himself, there is news in his mouth.” And he kept coming nearer and nearer.
translation:
  language: zh_hans
  text: 守望者高声呼喊，向王禀报。王说：“他若独自一人，口中必有消息[a]。”那人越走越近。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“喜讯。”这个希伯来词可以泛指消息；不过在本处语境中，王的话可能暗示他期待的是好消息。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצֹּפֶה
  choice: 守望的人
  rationale: 该词指被派驻观察动静的人；“守望的人”贴合城门楼上的场景，也比现代军事色彩较强的称谓更通俗。
- source_word: וַיִּקְרָא
  choice: 高声呼喊
  rationale: 此处指守望者扬声通报所见；“高声呼喊”明确表现远距离传话所需的音量。
- source_word: וַיַּגֵּד לַמֶּלֶךְ
  choice: 禀报王
  rationale: Hiphil 形式在此意为告知、报告；“禀报王”简洁自然，并符合臣属向君王报告的语境。
- source_word: אִם לְבַדּוֹ
  choice: 他若是独自一人
  rationale: 直陈来者单独一人的状态，不额外加入原文未明说的动作。
- source_word: בְּשׂוֹרָה
  choice: 好消息
  rationale: 该名词可泛指消息，但常含喜讯之意；本处王根据只有一名跑者而作判断，语境偏向“好消息”，同时以脚注保留较宽泛的可能。
- source_word: בְּפִיו
  choice: 口中必有
  rationale: 保留希伯来文“在他口中”的具体意象；补入“必”自然表达王的推断。
- source_word: וַיֵּלֶךְ הָלוֹךְ וְקָרֵב
  choice: 那人越走越近
  rationale: 该连续式结构表达持续行进并逐渐接近；“越走越近”以自然汉语传达其渐进意味。
