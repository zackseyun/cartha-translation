base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/026.yaml
  text: Then the watchman saw another man running[a], and the watchman called to the gatekeeper and said, “Look, a man is running by himself.” And the king said, “He also brings news.”
translation:
  language: zh_hans
  text: 守望的人又看见另一个人在跑，就向守门的人喊道：“看，有一个人独自跑着。”王说：“他也是来报信的[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“他也是个报信的人”或“他也带来消息”。原文这个词可指传报消息的人，也常用于传报好消息。
    reason: 保留מְבַשֵּׂר的名词性“报信者”及动词性“带来消息”两种自然表达，并说明其常见的正面消息语义，避免将该处消息性质定为明确的好消息。
lexical_decisions:
- source_word: הַצֹּפֶה
  choice: 守望的人
  rationale: 该词是צפה的分词形式，指负责观察动静的人；“守望的人”符合城门场景，也比“哨兵”少一层军事色彩。
- source_word: אִישׁ אַחֵר
  choice: 又……一个人
  rationale: אַחֵר表示这是区别于先前跑者的另一个人；用“又看见一个人”自然表达新增一人的意思。
- source_word: רָץ
  choice: 在跑／跑来
  rationale: 分词描写正在进行的动作；首次出现译作“在跑”，直接引语中结合观察视角译作“跑来”。
- source_word: הַשֹּׁעֵר
  choice: 守门的人
  rationale: 指负责看守城门的人；此译法现代、清楚，并与城门语境吻合。
- source_word: הִנֵּה
  choice: 看
  rationale: 该指示词用来唤起对方注意；“看！”在现代汉语中简洁自然。
- source_word: לְבַדּוֹ
  choice: 独自
  rationale: 表示跑者单独一人，并非队伍中的一员；“独自”准确且凝练。
- source_word: גַּם זֶה
  choice: 他也
  rationale: 表达第二个跑者同样属于前一个跑者所代表的类别；汉语用“他也”自然承接上下文。
- source_word: מְבַשֵּׂר
  choice: 来报信的
  rationale: בשׂר的Piel分词可指传报消息的人，也常含报好消息之意；正文采用不预先限定消息好坏的“来报信的”，并以脚注保留另一可能。
theological_decisions:
- issue: מְבַשֵּׂר所报消息是否明确为好消息
  choice: 正文译作“来报信的”，不限定消息性质
  alternative: “带来好消息”
  rationale: 该词常用于传报好消息，但也可较宽泛地指传报消息；此处王是根据跑者独自前来作出判断，正文不宜把消息的正面性质说得过满。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“守望的人”和“守门的人”清楚区分两个职分；直接引语简洁，保留现场呼喊的紧迫感。
