base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/005.yaml
  text: And the king commanded Joab and Abishai and Ittai[a], saying, “Deal gently for my sake with the young man Absalom.” And all the people heard when the king commanded all the commanders concerning Absalom.
translation:
  language: zh_hans
  text: 王吩咐约押、亚比筛和以太说：“为了我的缘故，要宽待那年轻人押沙龙。”[a] 王就押沙龙的事吩咐众将领时，众人都听见了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“为了我，要温和地对待那年轻人——押沙龙。”希伯来原文把王的恳求和对押沙龙的指明压缩在一个简短的表达中。
    reason: 保留 לִי 与两个 לְ 短语之间紧缩而略有歧义的句法关系。
lexical_decisions:
- source_word: וַיְצַו הַמֶּלֶךְ
  choice: 王吩咐
  rationale: צוה 表示带有权威的命令或嘱咐；“吩咐”既保留王命的分量，也自然适合王对将领说话的叙事语体。
- source_word: אֶת יוֹאָב וְאֶת אֲבִישַׁי וְאֶת אִתַּי
  choice: 约押、亚比筛和以太
  rationale: 按现代普通话音译人名；希伯来语重复的宾语标记无需在汉语中重现。
- source_word: לֵאמֹר
  choice: 说
  rationale: 这是引出直接引语的常规表达，汉语以“说”自然承接。
- source_word: לְאַט
  choice: 宽待
  rationale: 该词在这里表示温和、克制地对待某人；军事语境中“宽待”简洁自然，并传达不要严厉伤害押沙龙的要求。
- source_word: לִי
  choice: 看在我的份上
  rationale: 此处不仅是字面的“为我”，也带有大卫以个人情分提出恳求的意味；该表达保留这种关系性和情感力度。
- source_word: לַנַּעַר
  choice: 那年轻人
  rationale: נַעַר 可指少年或年轻男子；押沙龙已成年，而父亲的称呼带有疼爱，因此“年轻人”比“孩子”或“少年”更合适。
- source_word: לְאַבְשָׁלוֹם
  choice: 押沙龙
  rationale: 第二个 ל 可将押沙龙作为“那年轻人”的同位说明；正文采用自然的汉语同位结构，并以脚注说明原文的紧缩表达。
- source_word: וְכָל הָעָם שָׁמְעוּ
  choice: 所有人都听见了
  rationale: הָעָם 字面为“百姓/众人”，在当前军事场景中指在场的人群或军兵；“所有人”保留公共听闻这一重点而不作过度限定。
- source_word: בְּצַוֹּת הַמֶּלֶךְ
  choice: 王吩咐……时
  rationale: 介词 בְּ 加不定式结构表示同时发生的情形，汉语用时间从句表达最自然。
- source_word: כָּל הַשָּׂרִים
  choice: 众将领
  rationale: שָׂרִים 在此军事语境中指统兵者；“将领”比宽泛的“官长”更准确。
- source_word: עַל דְּבַר אַבְשָׁלוֹם
  choice: 怎样处置押沙龙
  rationale: 该短语基本义为“关于押沙龙的事”；结合王所下的具体命令，汉语用“怎样处置押沙龙”清楚呈现其所指，但不增添处死或释放等原文未明说的内容。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“看在我的份上”保留大卫作为父亲的恳求语气；末句略作汉语化重组，突出全体在场者都听见王公开下令。
