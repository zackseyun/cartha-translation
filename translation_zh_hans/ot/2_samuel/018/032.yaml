base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/032.yaml
  text: Then the king said to the Cushite[a], “Is it well with the young man Absalom?” And the Cushite said, “May the enemies of my lord the king, and all who rise up against you for evil[b], be like that young man.”
translation:
  language: zh_hans
  text: 王问古实人：“年轻人押沙龙平安吗？[a]”古实人回答：“愿我主我王的仇敌，以及所有起来攻击你、要害你的人，都像那年轻人一样！[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “平安”也可译作“安然无恙”。原文所用的词也可指安好、福祉；这里询问的不只是他是否存活，也包括他的整体安危与境况。
    reason: lexical_alternative
  - marker: b
    text: 古实人没有直接说明押沙龙的遭遇，而是含蓄地表示：押沙龙遭遇了王之仇敌应有的结局。
    reason: cultural_note
lexical_decisions:
- source_word: הַכּוּשִׁי
  choice: 古实人
  rationale: 这是来自古实之人的族地称谓；译作“古实人”既保留希伯来文本的地理名称，也避免套用范围较窄的现代族称。
- source_word: הֲשָׁלוֹם
  choice: 平安吗
  rationale: שָׁלוֹם在这里询问押沙龙整体的安危和境况。“平安吗”自然简洁，也保留了这个词比单纯“还活着吗”更宽的含义。
- source_word: לַנַּעַר לְאַבְשָׁלוֹם
  choice: 年轻人押沙龙
  rationale: נַעַר可指少年或年轻人；押沙龙已经成年，因此译作“年轻人”较合语境。人名依通行中文译名作“押沙龙”。
- source_word: יִהְיוּ כַנַּעַר
  choice: 愿……都像那年轻人一样
  rationale: יִהְיוּ在这里表达愿望或咒愿；“愿……都……”保留其语气。“那年轻人”延续古实人的含蓄说法，没有直接明说押沙龙已死。
- source_word: אֹיְבֵי אֲדֹנִי הַמֶּלֶךְ
  choice: 我主我王的仇敌
  rationale: 保留宫廷语境中的尊称结构，同时符合现代汉语庄重表达。
- source_word: וְכֹל אֲשֶׁר קָמוּ עָלֶיךָ לְרָעָה
  choice: 以及所有起来害你的人
  rationale: קום על表示起来敌对或反叛，לְרָעָה表示怀有恶意、意图加害；合译为“起来害你”自然地传达敌对行动与有害目的。
- source_word: וַיֹּאמֶר
  choice: 问／回答
  rationale: 按上下文分别译为“问”和“回答”，比机械重复“说”更符合现代汉语叙事，同时未改变话语关系。
theological_decisions:
- issue: 古实人对押沙龙结局的间接陈述
  choice: 保留“像那年轻人一样”的含蓄表达
  alternative: 直接译明“押沙龙已经死了”
  rationale: 原文没有直接报告死亡，而是以愿王的仇敌遭遇同样结局来暗示。保留间接性可维持叙事情张力及大卫随后反应的语境。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“我主我王”保留宫廷称谓；“平安吗”保留原文语义宽度；末句维持原文的委婉和咒愿语气。
