base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/024.yaml
  text: David was sitting between the two gates[a], and the watchman went up to the roof of the gate by the wall. He lifted up his eyes and looked, and behold, a man was running alone.
translation:
  language: zh_hans
  text: 大卫正坐在两道城门之间[a]。守望者上到靠城墙的城门楼顶，举目观看，只见有一个人独自奔跑。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“在两座门楼之间”。希伯来语直译为“在两道门之间”，可能是指设防城门内外两道门之间的空间。
    reason: 保留原文建筑用语的字面意义及其可能所指，不把推测写入正文。
lexical_decisions:
- source_word: יוֹשֵׁב
  choice: 正坐着
  rationale: 希伯来语分词描写当时持续的姿态；“正坐着”自然传达进行中的状态。
- source_word: בֵּין שְׁנֵי הַשְּׁעָרִים
  choice: 在两道城门之间
  rationale: 按原文保留“两道城门”，不擅自限定为内外门或两座门楼；“道”适合计量城门。
- source_word: הַצֹּפֶה
  choice: 守望的人
  rationale: 指负责瞭望的人；此译法准确、通俗，也符合城墙上的军事场景。
- source_word: אֶל גַּג הַשַּׁעַר אֶל הַחוֹמָה
  choice: 上到靠城墙的城门楼顶
  rationale: “上到”从前往屋顶自然体现上行；“城门楼顶”表达城门建筑的顶部，“靠城墙”保留第二个介词短语的空间关系而不作过细的建筑推断。
- source_word: וַיִּשָּׂא אֶת עֵינָיו וַיַּרְא
  choice: 举目观看
  rationale: 保留“举目”的希伯来语表达特色，同时以“观看”自然概括随后的看见动作。
- source_word: וְהִנֵּה
  choice: 只见
  rationale: “只见”在现代汉语叙事中自然呈现突然映入眼帘的景象，保留 הִנֵּה 的现场指示和引人注意作用。
- source_word: אִישׁ רָץ לְבַדּוֹ
  choice: 有一个人独自跑来
  rationale: “一个人”保留单数男性人物的所指；分词“跑”呈现正在发生的动作，“独自”明确他没有同伴。根据叙事观察点译作“跑来”，自然表达跑者向城门接近。
