base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/029.yaml
  text: And the king said[a], “Is it well with the young man Absalom?” Ahimaaz said, “I saw a great commotion when Joab sent the king’s servant and your servant, but I did not know what it was.”
translation:
  language: zh_hans
  text: 王问：“那少年押沙龙平安吗？”亚希玛斯说：“约押派王的仆人和你仆人时，我看见一场大骚动[a]，却不知道是什么事。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“一大群人”或“一片喧嚷”；希伯来语这个词可指人群、喧声或混乱骚动。
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלוֹם
  choice: 平安吗
  rationale: 这里是询问押沙龙的安危和整体状况。“平安吗”既保留שָׁלוֹם的核心意涵，也不把意思限定为单纯的生命安全。
- source_word: לַנַּעַר לְאַבְשָׁלוֹם
  choice: 那少年押沙龙
  rationale: נַעַר在此指押沙龙这位年轻男子；“那少年押沙龙”保留大卫间接、带感情色彩的称呼，同时符合庄重的现代汉语。
- source_word: הֶהָמוֹן הַגָּדוֹל
  choice: 一阵很大的骚动
  rationale: הָמוֹן可指人群、喧声或混乱骚动。上下文描写亚希玛斯所见却未辨明的动静，“骚动”能兼顾嘈杂与混乱，同时以脚注保留其他可能。
- source_word: לִשְׁלֹחַ
  choice: ……派……时
  rationale: 带לְ的独立形在此表达与差派有关的时间情境，汉语用“……派……时”自然呈现。
- source_word: עֶבֶד הַמֶּלֶךְ
  choice: 王的仆人
  rationale: עֶבֶד在这里指王室属员或臣仆，而非强调奴隶身份，因此译作“仆人”。
- source_word: וְאֶת עַבְדֶּךָ
  choice: 和你仆人
  rationale: 保留亚希玛斯在君王面前以“你仆人”自称的谦恭宫廷用语，不改写成单纯的“我”。
- source_word: וְלֹא יָדַעְתִּי מָה
  choice: 却不知道是什么事
  rationale: 原文直译为“却不知道是什么”，语意有所省略；补出“事”使现代汉语完整自然，而不增加实质信息。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“平安吗”和“你仆人”略带经文叙事及宫廷语体，以保留原文的人际关系和语气；脚注标记紧随其所解释的“骚动”。
