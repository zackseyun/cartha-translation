  text: וַ/יֹּ֨סֶף ע֜וֹד אֲחִימַ֤עַץ בֶּן צָדוֹק֙ וַ/יֹּ֣אמֶר אֶל יוֹאָ֔ב וִ֣/יהִי מָ֔ה אָרֻֽצָה נָּ֥א גַם אָ֖נִי אַחֲרֵ֣י הַ/כּוּשִׁ֑י וַ/יֹּ֣אמֶר יוֹאָ֗ב לָֽ/מָּה זֶּ֞ה אַתָּ֥ה רָץ֙ בְּנִ֔/י וּ/לְ/כָ֖ה אֵין בְּשׂוֹרָ֥ה מֹצֵֽאת־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/022.yaml
  text: Then Ahimaaz son of Zadok said again to Joab[a], “Whatever happens, please let me also run after the Cushite.” But Joab said, “Why would you run, my son[b], since you have no message that will bring reward?”
translation:
  language: zh_hans
  text: 撒督的儿子亚希玛斯又对约押说：“无论怎样，请让我也跟在古实人后面跑去。”约押说：“我儿，你为什么要跑去呢？你并没有能给你带来报偿的消息。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本句希伯来文含义不明确，也可译作“你并没有会被欣然接受的消息”。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּסֶף עוֹד
  choice: 又……说
  rationale: 这是表示再次行动的叙事惯用语；译为“又……说”自然地表达亚希玛斯再次提出请求。
- source_word: וִיהִי מָה
  choice: 无论怎样
  rationale: 该惯用语表示不顾结果如何、执意而行；“无论怎样”符合现代汉语，也保留其对后果不在意的语气。
- source_word: אָרֻצָה נָּא
  choice: 请让我……跑去
  rationale: 意愿式配合נָא表达恳切而礼貌的请求；汉语用“请让我”自然传达这一语气。
- source_word: גַם אֲנִי
  choice: 让我也
  rationale: “也”强调亚希玛斯要求作为另一名跑者前去。
- source_word: אַחֲרֵי הַכּוּשִׁי
  choice: 跟在古实人后面
  rationale: 直译介词אַחֲרֵי，并以“古实人”呈现历史族称，避免用现代地理名称作过度等同。
- source_word: לָמָּה זֶּה אַתָּה רָץ
  choice: 你为什么要跑去呢
  rationale: 以自然现代汉语表达约押带有疑问和劝阻意味的话；句末“呢”适度体现原文זֶה所加强的诘问语气。
- source_word: בְּנִי
  choice: 我儿
  rationale: 保留带亲切或长辈口吻的称呼，不暗示双方必有实际父子关系。
- source_word: אֵין בְּשׂוֹרָה מֹצֵאת
  choice: 你并没有能给你带来报偿的消息
  rationale: 原文末句省略且含义困难；正文采用“消息不会给报信者带来所得或报偿”的可能理解，同时以脚注保留“消息不会受欢迎”的另一种解释。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“无论怎样”表达亚希玛斯不计后果仍想前去的坚持；末句不把疑难原文解释得过于确定，而在正文与脚注中保留两种主要可能。
