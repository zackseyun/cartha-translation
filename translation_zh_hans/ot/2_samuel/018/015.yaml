  yaml_path: translation/ot/2_samuel/018/015.yaml
  text: Then ten young men, Joab’s armor-bearers, surrounded Absalom and struck him and killed him.
translation:
  language: zh_hans
  text: 于是，替约押拿兵器的十个年轻人围住押沙龙，击打他，把他杀死了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּסֹבּוּ
  choice: 围住
  rationale: סבב在这里表示众人转到押沙龙周围并将他包围；“围住”自然、简洁，也保留叙事中的战术动作。
- source_word: עֲשָׂרָה נְעָרִים
  choice: 十个年轻人
  rationale: נְעָרִים在军事随从语境中指年轻男子，并非儿童；译作“年轻人”避免过度限定其具体身份或职级。
- source_word: נֹשְׂאֵי כְּלֵי יוֹאָב
  choice: 给约押拿兵器的
  rationale: 该短语直指为约押携带器械或武器的人。“拿兵器的”比固定职衔式的“拿兵器者”更符合现代汉语，也不把כְּלֵי过窄地限定为铠甲。
- source_word: וַיַּכּוּ
  choice: 击打他
  rationale: נכה的基本义是击打、打击；“击打”保留原文动作，不提前把它解释成致命一击。
- source_word: וַיְמִיתֻהוּ
  choice: 把他杀死了
  rationale: מות的使役式表示使其死亡，即杀死；此译清楚呈现继击打之后的最终结果。
- source_word: אַבְשָׁלוֹם
  choice: 押沙龙
  rationale: 采用现代中文圣经读者熟悉的标准人名译法。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“于是”承接前文叙事；保留“击打”与“杀死”两个连续动词，不将二者合并，以呈现希伯来文的动作推进。
