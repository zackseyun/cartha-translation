base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/021.yaml
  text: Then Joab said to the Cushite[a], “Go, tell the king what you have seen.” And the Cushite bowed down to Joab and ran.
translation:
  language: zh_hans
  text: 约押对那古实人[a]说：“去，把你所看见的告诉王。”古实人就向约押俯身下拜，然后跑去了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “古实人”也可理解为人名“古示”；传统译法作“埃塞俄比亚人”。
    reason: 保留כּוּשִׁי作为族属称谓或人名的歧义，并说明传统地理对应。
lexical_decisions:
- source_word: כּוּשִׁי
  choice: 古实人
  rationale: 采用族属或地域称谓，直接对应希伯来文，避免武断地将其视为人名；“古实人”也是现代中文圣经语境中清楚而较少误导的表达。
- source_word: לֵךְ
  choice: 去
  rationale: 准确表达命令语气，并符合现代汉语直接命令的自然说法。
- source_word: הַגֵּד
  choice: 告诉
  rationale: 该使役式命令表示使人知道、传报；此处以“告诉王”表达最自然，也不削弱传讯含义。
- source_word: אֲשֶׁר רָאִיתָה
  choice: 你所看见的
  rationale: 保留关系结构及亲眼目睹的含义，同时符合庄重流畅的现代汉语。
- source_word: וַיִּשְׁתַּחוּ
  choice: 俯身下拜
  rationale: 表现向约押躬身致敬的身体动作，不把它误解为宗教敬拜，也不强行限定为完全俯伏。
- source_word: וַיָּרֹץ
  choice: 跑去了
  rationale: 保留动词“跑”的直接意义；加“去了”自然表达奉命出发。
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 以叙事中的顺承次序自然呈现，不机械重复翻译连接词。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“俯身下拜”表达对上级的敬意，不带宗教敬拜的暗示；全句保持原文简洁快速的叙事节奏。
