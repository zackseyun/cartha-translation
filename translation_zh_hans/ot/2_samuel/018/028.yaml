revisions:
- from: 亚希玛斯高声对王说：“平安！[a]”随后，他俯伏在王面前，脸伏于地，说：“雅威你的上帝是当受称颂的！他把那些举手攻击我主我王的人交出来了。[b]”
  to: 亚希玛斯呼喊着对王说：“平安！[a]”随后，他在王面前俯伏，脸伏于地，说：“愿雅威——你的上帝——受称颂！他已把那些举手攻击我主我王的人交在我主我王手中。[b]”
  rationale: 修订主要解决“交出来了”在汉语中交付对象不明的问题，并润饰呼喊、俯伏和祝颂公式的表达。修订保留原文的叙事顺序、身体姿势、神名、宫廷敬称及“举手”这一敌对行动的意象；脚注锚点及其所说明的词汇歧义均予保留。
