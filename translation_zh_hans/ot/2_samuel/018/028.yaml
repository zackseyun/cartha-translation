base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/028.yaml
  text: Ahimaaz called out and said to the king[a], “Peace!” Then he bowed down before the king with his face to the ground and said, “Blessed be Yahweh your God[b], who has delivered up the men who lifted their hand against my lord the king.”
translation:
  language: zh_hans
  text: 亚希玛斯呼喊着对王说：“平安！[a]”随后，他在王面前俯伏，脸伏于地，说：“愿雅威——你的上帝——受称颂！他已把那些举手攻击我主我王的人交在我主我王手中。[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“一切顺利！”希伯来语“平安”在这里不一定只是问候，也可用来报告安好或好消息。
    reason: lexical_alternative
  - marker: b
    text: “交在……手中”也可译作“交付”或“交出来”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: 高声……说
  rationale: 此处是信使向王报告时扬声呼喊；这样译符合叙事情境，也比单译“说”更具体。
- source_word: שָׁלוֹם
  choice: 平安！
  rationale: 该词在信使报告的语境中既可表示平安，也可宣告情况顺利或带来好消息；正文保留其简洁和多义性，并用脚注说明。
- source_word: וַיִּשְׁתַּחוּ לַמֶּלֶךְ לְאַפָּיו אָרְצָה
  choice: 俯伏在王面前，脸伏于地
  rationale: 具体呈现向王行礼时身体伏地的姿势，不以抽象的“致敬”取代原文动作。
- source_word: בָּרוּךְ יְהוָה אֱלֹהֶיךָ
  choice: 雅威你的上帝是当受称颂的
  rationale: 保留希伯来文颂赞公式的庄重语气，并将神名与“你的上帝”之间的同位关系清楚表达出来。
- source_word: סִגַּר
  choice: 交出来了
  rationale: 在军事冲突的语境中，该动词表示把敌对者交出、交付；此译自然表达他们已落入对方权下，同时脚注保留“交付”的译法。
- source_word: הָאֲנָשִׁים
  choice: 那些……的人
  rationale: 原文指参与敌对行动的一群特定男子；现代汉语用“那些……的人”可自然指明该群体，而不额外强调性别。
- source_word: נָשְׂאוּ אֶת יָדָם
  choice: 举手攻击
  rationale: 保留“举手”的希伯来语意象，并以“攻击”说明这里所指的是敌对行动，而非普通举手。
- source_word: בַּאדֹנִי הַמֶּלֶךְ
  choice: 攻击我主我王
  rationale: “我主我王”保留臣下对大卫的恭敬称谓；“攻击”表达介词在此处的敌对含义。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 正文采用对四字神名的音译“雅威”，以神的专名来翻译，而不以“主”这一称号替代；“耶和华”是汉语传统中常见的另一音译。
- issue: שָׁלוֹם 在报信语境中的含义
  choice: 正文译“平安”，脚注说明也可理解为“一切顺利”
  alternative: 直接译“一切顺利”
  rationale: 原词既承载平安的基本意义，又可用来报告有利结果；保留“平安”可避免过早消除这种语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“俯伏”“当受称颂”“我主我王”保留宫廷场景与颂赞语气；其余句式尽量自然简洁。
