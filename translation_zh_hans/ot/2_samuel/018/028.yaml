    rationale: סִגַּר在此指雅威将敌对者交付，使其落在王的权下。改为“交在我主我王手中”可自然清楚地传达这一结果。
  - severity: low
    issue: “雅威你的上帝是当受称颂的”略显书面生硬。
    rationale: 原文是常见的祝颂公式；“愿雅威——你的上帝——受称颂”保留祈愿式、颂赞性的语气，也更符合中文庄重语体。
