  yaml_path: translation/ot/2_samuel/018/030.yaml
  text: The king said[a], “Turn aside; stand here.” So he turned aside and stood.
translation:
  language: zh_hans
  text: 王说：“转到一旁[a]，站在这里。”他就转到一旁，站在那里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或作“转身；站在这里”。原文动词可泛指转动或转向；按上下文，此处较可能指让到一边，为下一位报信者腾出位置。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: אמר的叙事形式引出直接引语；“说”是现代汉语中自然、准确的对应。
- source_word: הַמֶּלֶךְ
  choice: 王
  rationale: 原文带定冠词，指上下文中已经明确的君王；汉语叙事中用“王”自然表达其特指意义。
- source_word: סֹב
  choice: 转到一旁
  rationale: סבב的命令式可泛指转动或转向；结合下一名报信者即将到来的语境，这里更可能是命令他让到一边，同时保留“转”的词义。
- source_word: הִתְיַצֵּב
  choice: 站
  rationale: יצב的Hitpael命令式表示使自己站定或站在指定位置；“站”简洁自然。
- source_word: כֹּה
  choice: 在这里
  rationale: 此处是地点副词，指王所指定的位置；译作“在这里”符合命令语境。
- source_word: וַיִּסֹּב
  choice: 转到一旁
  rationale: 与前面的命令סֹב保持词汇呼应，并按语境表达让到一边。
- source_word: וַיַּעֲמֹד
  choice: 站着
  rationale: עמד在这里表示站立；“站着”自然地描写执行命令后的状态。
