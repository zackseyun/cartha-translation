  text: וַ/יְצַו֩ אַבְשָׁל֨וֹם אֶת נְעָרָ֜י/ו לֵ/אמֹ֗ר רְא֣וּ נָ֠א כְּ/ט֨וֹב לֵב אַמְנ֤וֹן בַּ/יַּ֨יִן֙ וְ/אָמַרְתִּ֣י אֲלֵי/כֶ֔ם הַכּ֧וּ אֶת אַמְנ֛וֹן וַ/הֲמִתֶּ֥ם אֹת֖/וֹ אַל תִּירָ֑אוּ הֲ/ל֗וֹא כִּ֤י אָֽנֹכִי֙ צִוִּ֣יתִי אֶתְ/כֶ֔ם חִזְק֖וּ וִ/הְי֥וּ לִ/בְנֵי חָֽיִל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/028.yaml
  text: 'Then Absalom commanded his young men[a], saying, “Please watch: when Amnon’s heart is merry with wine, and I say to you, ‘Strike Amnon,’ then kill him. Do not fear. Have I not myself commanded you? Be strong, and be men of valor.”'
translation:
  language: zh_hans
  text: 押沙龙吩咐他的年轻随从说：“你们留意，等暗嫩因酒而心里畅快时，我对你们说：‘击打暗嫩！’你们就把他杀死。不要害怕！这不是我亲自吩咐你们的吗？你们要刚强，作勇士！”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נְעָרָיו
  choice: 他的年轻随从
  rationale: נַעַר可指年轻人、仆人、侍从或扈从；此处是押沙龙手下奉命实施暴力的人。“年轻随从”兼顾年龄含义及其从属身份。
- source_word: רְאוּ נָא
  choice: 你们留意
  rationale: ראה的祈使式加נָא在此要求对方密切注意时机；译作“你们留意”自然、明确，并保留命令语气。
- source_word: כְּטוֹב לֵב אַמְנוֹן בַּיַּיִן
  choice: 等暗嫩因酒而心里畅快时
  rationale: 希伯来习语直言暗嫩的心因酒而“好”，表示饮酒后兴致畅快、戒备松弛，但不必断定已经醉酒；译文保留“心里畅快”的意象与含混度。
- source_word: הַכּוּ אֶת־אַמְנוֹן
  choice: 击杀暗嫩
  rationale: נכה的基本义是击打、击杀；结合紧接的“把他杀死”，此命令是发动致命袭击的信号。“击杀”简洁而具有暴力行动的力度。
- source_word: וַהֲמִתֶּם אֹתוֹ
  choice: 你们就把他杀死
  rationale: מות的使役式明确表示使其死亡，即杀死；“就”自然表达信号出现后的行动次序。
- source_word: אַל־תִּירָאוּ
  choice: 不要害怕
  rationale: 直接保留否定祈使的命令语气，符合现代汉语。
- source_word: הֲלוֹא כִּי אָנֹכִי צִוִּיתִי אֶתְכֶם
  choice: 这不是我亲自吩咐你们的吗？
  rationale: 反问句以押沙龙本人的命令为他们壮胆；“亲自”体现强调代词אָנֹכִי。
- source_word: חִזְקוּ
  choice: 你们要刚强
  rationale: חזק的祈使式可表示刚强、坚定或鼓起勇气；“要刚强”直接保留其命令性。
- source_word: וִהְיוּ לִבְנֵי־חָיִל
  choice: 作勇士
  rationale: בני חיל是带有男性和军事色彩的习语，指勇敢、有战斗力的人；“作勇士”保留语境中的阳性群体与尚武意味，同时符合现代中文表达。
theological_decisions:
- issue: לִבְנֵי־חָיִל的性别与军事色彩
  choice: 作勇士
  alternative: 要勇敢
  rationale: 原文称这些男性随从为“勇力之子”，在此暴力行动的语境中具有明确的男性和军事色彩。“作勇士”比抽象的“要勇敢”更贴近原文的社会背景与修辞力度。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。保留原文“因酒而心里畅快”的希伯来意象，不将其过度解释为醉酒；整体维持押沙龙命令中的急迫、威压和军事语气。
