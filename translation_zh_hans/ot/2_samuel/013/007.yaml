  source_fidelity: 正文将 הַבַּיְתָה 译为“到家里”，但“家里”在汉语中缺少明确指向，且与“派人到家里对她玛说”搭配略显生硬。改为“到他玛的住处”，清楚表达大卫派人往她所在住处传话，同时不将该住处不必要地界定为她个人所有。הַבִּרְיָה 指供病者或康复者食用、以恢复身体的食物；“养病的食物”比“病中吃的食物”更自然且涵盖恢复期。
  naturalness: “派人到他玛的住处，吩咐她说”是现代标准汉语中自然、庄重的叙事表达。“到你哥哥暗嫩的家里去”补足结构助词并保留“去”，语句完整流畅。
  terminology: 应使用圣经汉语中通行的人名“他玛”，而非容易与女性代词混淆的“她玛”。“暗嫩”正确。“养病的食物”保留该罕见词的恢复性语义；脚注说明较宽泛的译法及词义范围。
