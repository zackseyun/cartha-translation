base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/007.yaml
  text: Then David sent word to Tamar at home[a], saying, “Please go to the house of your brother Amnon and prepare the food for him.”
translation:
  language: zh_hans
  text: 于是，大卫派人到他玛的住处，吩咐她说：“请你到你哥哥暗嫩的家里去，为他预备养病的食物[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“有助恢复的食物”或“饭食”。希伯来语这个词指为病人或康复中的人预备的食物。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח דָּוִד אֶל תָּמָר
  choice: 大卫派人……对她玛说
  rationale: שׁלח 的基本义是“差遣、派遣”；与 אֶל 加人物及 לֵאמֹר 连用时，表示派人向她传话。这样译既符合原文，也比直译“差到她玛那里”更自然。
- source_word: הַבַּיְתָה
  choice: 到家里
  rationale: 该词带方向词尾 -ה，字面为“往家里／屋里”。上下文表明，大卫派人到她玛所在的家中传话；“到家里”保留了方向意味，但原文未明确说是谁的家。
- source_word: לְכִי נָא
  choice: 请你到
  rationale: 阴性单数命令式 לְכִי 表示“去”，语气词 נָא 使命令较为委婉，因此译作“请你到”。
- source_word: בֵּית אַמְנוֹן אָחִיךְ
  choice: 你哥哥暗嫩家里
  rationale: 原文直译为“你兄弟暗嫩的家”。现代汉语中，暗嫩是她玛的年长兄长，译作“哥哥”自然清楚；“家里”也准确表达 בֵּית 的处所意义。
- source_word: וַעֲשִׂי לוֹ
  choice: 为他预备
  rationale: עָשָׂה 本义宽泛，可指“做、制作”；与食物连用时，汉语“预备”最自然，并保留“为他”的受益关系。
- source_word: הַבִּרְיָה
  choice: 病中吃的食物
  rationale: 该名词指给病人或康复者吃的食物，而不只是泛指普通饭食。“病中吃的食物”在正文中简明呈现其语境含义，脚注列出较宽泛或功能性译法。
