  yaml_path: translation/ot/2_samuel/013/022.yaml
  text: And Absalom did not speak with Amnon[a], either bad or good[b], because Absalom hated Amnon because he had violated Tamar his sister.
translation:
  language: zh_hans
  text: 押沙龙不跟暗嫩说话，不论是坏话还是好话[a]；因为押沙龙恨暗嫩，因他玷辱了自己的妹妹她玛。
  philosophy: optimal-equivalence
  footnotes:
