    text: “不论是坏话还是好话”是希伯来语惯用说法，意思是押沙龙什么话也不跟暗嫩说。
    reason: lexical_alternative
lexical_decisions:
- source_word: דִבֶּר ... עִם
  choice: 跟……说话
  rationale: 自然表达与某人说话，保留介词所体现的交往意味。
- source_word: לְמֵרָע וְעַד טוֹב
  choice: 无论好坏
  rationale: 保留希伯来语两极并举的表达；在本句中指任何话都不说。
- source_word: כִּי
  choice: 因为
  rationale: 明确引出押沙龙不与暗嫩说话的原因。
- source_word: שָׂנֵא
  choice: 恨
  rationale: 直接传达该动词强烈而明确的仇恨含义。
- source_word: עַל דְּבַר אֲשֶׁר
  choice: 因为……
  rationale: 该短语在这里引出押沙龙恨暗嫩的缘由；汉语用因果结构最自然。
- source_word: עִנָּה
  choice: 玷辱
  rationale: 结合前文性侵语境，既表达所受侵犯和羞辱，也不把本节动词本身处理成更具体的法律术语。
- source_word: אֲחֹתוֹ
  choice: 他的妹妹
  rationale: 后缀所指为押沙龙；按叙事关系译作他的妹妹，清楚呈现其仇恨动机。
