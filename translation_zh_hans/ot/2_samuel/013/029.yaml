  text: וַֽ/יַּעֲשׂ֞וּ נַעֲרֵ֤י אַבְשָׁלוֹם֙ לְ/אַמְנ֔וֹן כַּ/אֲשֶׁ֥ר צִוָּ֖ה אַבְשָׁל֑וֹם וַ/יָּקֻ֣מוּ כָּל בְּנֵ֣י הַ/מֶּ֗לֶךְ וַֽ/יִּרְכְּב֛וּ אִ֥ישׁ עַל פִּרְדּ֖/וֹ וַ/יָּנֻֽסוּ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/029.yaml
  text: So Absalom’s young men did to Amnon as Absalom had commanded[a]. Then all the king’s sons arose[b], and each mounted his mule and fled.
translation:
  language: zh_hans
  text: 押沙龙的年轻人[a]就照押沙龙所吩咐的，对暗嫩下了手[b]。王的众子都起身，各自骑上自己的骡子逃走了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“押沙龙的仆人”或“押沙龙的侍从”。原文所用的词既可指年轻人，也可指服侍主人的人。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“照押沙龙所吩咐的对暗嫩行事”。上一节明确说明了这道命令：等暗嫩因酒而心里畅快时，就击杀他。
    reason: cross_reference
lexical_decisions:
- source_word: נַעֲרֵי אַבְשָׁלוֹם
  choice: 押沙龙的年轻侍从
  rationale: נַעַר可指年轻人，也可指仆人或侍从；这里指奉命行事的人。“年轻侍从”兼顾年龄色彩和服侍身份，又不把其具体家户地位说得过死。
- source_word: וַיַּעֲשׂוּ לְאַמְנוֹן
  choice: 向暗嫩行了
  rationale: 保留原文含蓄而简短的表达；具体所行之事由上一节押沙龙的命令交代，避免在本节擅自补入“杀死”等词。
- source_word: כַּאֲשֶׁר צִוָּה
  choice: 照……所吩咐的
  rationale: 自然表达行动完全依照押沙龙先前的命令。
- source_word: וַיָּקֻמוּ
  choice: 起身
  rationale: 符合叙事语体，也传达王子们听闻变故后立即行动的反应。
- source_word: כָּל בְּנֵי הַמֶּלֶךְ
  choice: 王的众子
  rationale: 直接保留原文的身份称谓，所指为在场的王子们。
- source_word: וַיִּרְכְּבוּ אִישׁ עַל פִּרְדּוֹ
  choice: 各自骑上自己的骡子
  rationale: אִישׁ在这里作分配用法，意为“各自”；“自己的”明确对应第三人称单数所属形式。
- source_word: וַיָּנֻסוּ
  choice: 逃走了
  rationale: 准确传达נוּס所表示的紧急逃离，同时符合现代汉语叙事习惯。
theological_decisions: []
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。保留原文对暗嫩遭遇的简略表述，让上文说明具体行动；以“年轻侍从”保留נַעַר在年龄和职分之间的词义张力，并用脚注列出其他可译法。
