  text: וַ/יֹּ֨אמֶר אֵלֶ֜י/הָ אַבְשָׁל֣וֹם אָחִ֗י/הָ הַ/אֲמִינ֣וֹן אָחִי/ךְ֮ הָיָ֣ה עִמָּ/ךְ֒ וְ/עַתָּ֞ה אֲחוֹתִ֤/י הַחֲרִ֨ישִׁי֙ אָחִ֣י/ךְ ה֔וּא אַל תָּשִׁ֥יתִי אֶת לִבֵּ֖/ךְ לַ/דָּבָ֣ר הַ/זֶּ֑ה וַ/תֵּ֤שֶׁב תָּמָר֙ וְ/שֹׁ֣מֵמָ֔ה בֵּ֖ית אַבְשָׁל֥וֹם אָחִֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/020.yaml
  text: Then Absalom her brother said to her[a], “Has Amnon your brother been with you? But now, my sister, keep silent; he is your brother. Do not take this matter to heart.” So Tamar remained, devastated[b], in the house of Absalom her brother.
translation:
  language: zh_hans
  text: 她哥哥押沙龙对她说：“是你哥哥暗嫩和你在一起了吗？[a] 如今，我妹妹，不要作声；他是你哥哥。不要把这件事放在心上。”于是他玛凄凉地住在她哥哥押沙龙家里。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“你哥哥暗嫩和你在一起了吗？”这是含蓄的说法，在这里指暗嫩对她实施的性侵。
    reason: lexical_alternative
  - marker: b
    text: 或译“荒凉”“凄凉不堪”。原文这个词含有荒凉、毁坏或惊愕失措的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַאֲמִינוֹן
  choice: 暗嫩
  rationale: 按现代中文圣经人名的通行译法音译。
- source_word: הָיָה עִמָּךְ
  choice: 和你在一起了吗
  rationale: 保留希伯来文含蓄的表达；在本段语境中，这是对性侵的委婉指称，不在正文中进一步明说。
- source_word: הַחֲרִישִׁי
  choice: 不要作声
  rationale: 准确传达命令式“保持沉默”，语言自然而庄重，也保留押沙龙压制她发声的语气。
- source_word: אָחִיךְ הוּא
  choice: 他是你哥哥
  rationale: 直译这句突兀的亲属关系陈述，不替叙述者解释或缓和其令人不安的意味。
- source_word: אַל תָּשִׁיתִי אֶת לִבֵּךְ לַדָּבָר הַזֶּה
  choice: 不要把这件事放在心上
  rationale: 以自然中文表达“不要将心放在这事上”的希伯来习语，保留其劝她不要再挂怀此事的含义。
- source_word: וַתֵּשֶׁב
  choice: 住在
  rationale: 该动词可指坐下、居住或留下；这里与“家里”连用，译为“住在”最贴合具体居住状态。
- source_word: שֹׁמֵמָה
  choice: 孤苦凄凉
  rationale: 该词包含荒凉、受毁坏、惊愕而孤立的意味；“孤苦凄凉”在现代中文中兼顾她内在创伤与社会处境，同时不把意义仅限于一种心理感受。
- source_word: בֵּית אַבְשָׁלוֹם
  choice: 押沙龙家里
  rationale: 自然表达希伯来文“押沙龙的家”，保留家庭和居所的具体背景。
theological_decisions:
- issue: 叙事中对性侵的委婉表达
  choice: 正文保留“和你在一起了吗”这一间接说法
  alternative: “你哥哥暗嫩侵犯你了吗”或“你哥哥暗嫩与同你寝了吗”
  rationale: 原文在创伤叙事中使用含蓄措辞。译文保留其修辞克制，并用脚注说明语境所指，避免把解释直接写入正文。
- issue: 押沙龙要求他玛沉默的理由
  choice: 直译“他是你哥哥”，不补充合理化解释
  alternative: 增译为“毕竟他是你哥哥”或解释为顾全家族关系
  rationale: 原文只陈述亲属关系，其逻辑和伦理张力并未展开。译文不替说话者完善论证，也不淡化他玛所受的伤害。
- issue: 他玛受创后的状态
  choice: 译作“孤苦凄凉”并保留词义脚注
  alternative: “悲痛欲绝”“毁了”“荒凉”
  rationale: 希伯来词义可涵盖荒废、毁坏、惊愕和凄凉。选择较宽广的中文表达，避免把她的状态缩减为单一情绪或作超出原文的社会法律判断。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。对性侵沿用原文的委婉措辞，但以脚注明确其所指；不弱化押沙龙命令她沉默的冷峻语气。人名采用中文圣经通行译名“押沙龙、暗嫩、他玛”。
