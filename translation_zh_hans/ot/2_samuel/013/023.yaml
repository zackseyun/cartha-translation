base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/023.yaml
  text: It happened after two full years that Absalom had sheep shearers at Baal-hazor[a], which is near Ephraim, and Absalom invited all the king’s sons.
translation:
  language: zh_hans
  text: 过了整整两年[a]，押沙龙的剪毛工人在靠近以法莲的巴力夏琐剪羊毛。押沙龙邀请了王的众子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来原文直译为“两年之日”，是指完整的两年。
    reason: 说明原文时间习语及“整整”的译法。
lexical_decisions:
- source_word: לִשְׁנָתַיִם יָמִים
  choice: 过了整整两年
  rationale: 这个希伯来语习语直译为“两年之日”，表示完整的两年期限已经过去；“过了整整两年”在现代汉语中自然地传达完整时段。
- source_word: גֹזְזִים לְאַבְשָׁלוֹם
  choice: 押沙龙的人……剪羊毛
  rationale: גֹזְזִים 是“剪羊毛的人／剪羊毛者”，לְאַבְשָׁלוֹם 表示这些人属于或为押沙龙做工。此译法避免误解为押沙龙亲自剪羊毛，也不把上下文所暗示、但本节未明说的筵席写入正文。
- source_word: בְּבַעַל חָצוֹר
  choice: 在……巴力·夏琐
  rationale: 按地名音译；介词 בְּ 在此表示事件发生的地点。
- source_word: אֲשֶׁר עִם אֶפְרָיִם
  choice: 靠近以法莲的
  rationale: עִם 在这里表达地理上的邻近关系；“靠近”比字面的“与……一起”更符合语境。
- source_word: וַיִּקְרָא
  choice: 邀请了
  rationale: 该动词基本义为“叫、召”，在此社交场景中具有邀请赴会的语用含义；“邀请”是自然且准确的现代汉语表达。
- source_word: לְכָל בְּנֵי הַמֶּלֶךְ
  choice: 王的众子
  rationale: 保留 כָל 的全体含义；“众子”简洁、庄重，并符合叙事文体。
- source_word: וַיְהִי
  choice: 过了……
  rationale: 常见的希伯来叙事承接形式不必机械译成“事情发生了”或添加“现在”；其时序推进功能由汉语“过了”自然承载。
theological_decisions: []
