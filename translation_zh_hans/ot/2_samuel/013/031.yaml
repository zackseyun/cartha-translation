base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/031.yaml
  text: Then the king arose[a], tore his garments, and lay on the ground, and all his servants were standing with their garments torn.
translation:
  language: zh_hans
  text: 王就起身，撕裂衣服[a]，躺在地上；他所有的臣仆都站着，衣服都撕裂了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 在希伯来圣经中，撕裂衣服是表达悲痛、惊骇或哀悼的惯常举动。
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּקָם
  choice: 就起来
  rationale: קום的Qal叙事过去式表示接续发生的动作；“就起来”自然传达王听见消息后的即时反应。
- source_word: הַמֶּלֶךְ
  choice: 王
  rationale: 原文使用带定冠词的称号，指上下文中已知的王，即大卫；译文保留称号，不改用人名。
- source_word: וַיִּקְרַע אֶת־בְּגָדָיו
  choice: 撕裂自己的衣服
  rationale: קרע与衣服连用，是因悲痛、惊骇或哀悼而撕裂衣服的惯用表达；“自己的”明确反身所属，符合现代汉语。
- source_word: וַיִּשְׁכַּב אַרְצָה
  choice: 躺在地上
  rationale: שכב表示躺下或躺卧，אַרְצָה带方向意味；“躺在地上”自然表达动作及随后姿态。
- source_word: וְכָל־עֲבָדָיו
  choice: 他的臣仆也都
  rationale: עבדים在王宫语境中可指王的仆役或随从；“臣仆”既保留服侍关系，也适合宫廷场景，而不限定具体官职。
- source_word: נִצָּבִים
  choice: 站着
  rationale: נצב的Niphal分词描写持续状态；“站着”保留场景中的状态性。
- source_word: קְרֻעֵי בְגָדִים
  choice: 衣服都撕裂了
  rationale: 被动分词结构描述衣服已被撕裂后的状态；此译法自然，并保留结果状态。
