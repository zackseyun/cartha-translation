base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/010.yaml
  text: Then Amnon said to Tamar[a], “Bring the food into the inner room, so that I may eat from your hand.” So Tamar took the cakes she had made and brought them into the inner room to Amnon her brother.
translation:
  language: zh_hans
  text: 暗嫩对她玛说：“把食物拿到里屋[a]来，我好从你手里吃。”她玛就拿起自己做的饼，送进里屋，给她哥哥暗嫩。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “里屋”也可译作“内室”或“房间”。希伯来语 חֶדֶר 指房屋内部的房间；这里译作“里屋”，以体现叙事中较为隐蔽的场所。
    reason: lexical_alternative
lexical_decisions:
- source_word: הָבִיאִי
  choice: 拿到……来
  rationale: 这是使役意义的阴性单数命令式，暗嫩吩咐她玛把食物带到他所在的地方；“拿到……来”符合现代汉语的方向表达。
- source_word: הַבִּרְיָה
  choice: 食物
  rationale: 此词泛指预备好供人食用的食物；译作“食物”不提前限定具体种类，而下文再以“饼”对应更具体的 לְבִבוֹת。
- source_word: הַחֶדֶר / הֶחָדְרָה
  choice: 里屋／进里屋
  rationale: חֶדֶר 指房屋内部的房间，第二处带方向词尾，表示进入其中；两处一致译作“里屋”，既自然，也保留叙事中转入较隐蔽空间的意味。
- source_word: וְאֶבְרֶה
  choice: 我好……吃
  rationale: 此处动词表示吃用食物，并带有意愿或目的语气；在前一命令之后用“我好……吃”自然表达该语气。
- source_word: מִיָּדֵךְ
  choice: 从你手里
  rationale: 按希伯来语习语保留单数“手”的表达，也保留暗嫩要求她玛亲手递食所带出的刻意亲近意味，不强化为“喂”。
- source_word: הַלְּבִבוֹת
  choice: 饼
  rationale: 指她玛在上文制作的特定饼食；“饼”简洁自然，并与泛称的“食物”有所区别。
- source_word: אָחִיהָ
  choice: 她哥哥
  rationale: 原文明确写出亲属关系；保留这一称谓对叙事及其伦理张力十分重要。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“从你手里吃”刻意保留原文略显不寻常的亲近表达，避免解释性地译成“喂我吃”。两个 חֶדֶר 均译作“里屋”，保持词语呼应。
