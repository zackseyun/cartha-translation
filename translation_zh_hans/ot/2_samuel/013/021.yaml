  yaml_path: translation/ot/2_samuel/013/021.yaml
  text: When King David heard all these things[a], he was very angry.
translation:
  language: zh_hans
  text: 大卫王听见这一切事，就非常愤怒。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文的表达字面含有“燃烧”之意：“……就大大地向他燃烧起来”；这是表达愤怒的习语，原文没有明说“怒气”为主语。
    reason: 保留希伯来语חרה לו的“燃烧”意象，并以自然、清楚的汉语说明其习语含义及原文未明示主语的特点。
lexical_decisions:
- source_word: וְ/הַ/מֶּלֶךְ דָּוִד
  choice: 大卫王
  rationale: וְ承接前文，在中文叙事中无须机械译作“而”；定冠词、王的称号和人名自然合译为“大卫王”。
- source_word: שָׁמַע
  choice: 听见
  rationale: 保留动词“听见”的基本义；在本语境中指听到关于这些事件的消息。
- source_word: כָּל הַ/דְּבָרִים הָ/אֵלֶּה
  choice: 这一切事
  rationale: דְּבָרִים在此指前述有关她玛和暗嫩的种种事情；“事”既自然，又保留其可指言语或事件的宽泛语义。
- source_word: וַ/יִּחַר ל֖/וֹ מְאֹד
  choice: 就非常愤怒
  rationale: חרה לו是表达怒气如火燃烧的希伯来语习语；“非常愤怒”以现代汉语清楚传达其意义，而脚注保留字面意象。
theological_decisions: []
