base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/009.yaml
  text: Then she took the pan and poured them out before him[a], but he refused to eat. And Amnon said[b], “Send everyone out from me.” So everyone went out from him.
translation:
  language: zh_hans
  text: 她拿起锅来，把饼倒在他面前[a]，他却不肯吃。暗嫩说：“你们叫所有人[b]都离开我这里。”于是众人都从他那里出去了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “倒在他面前”也可译作“摆在他面前”或“端给他”；希伯来文动词的字面意思是“倒出”，这里用于把食物盛出来的情景。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译“每一个男人”，这里统指当时在场的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּשְׂרֵת
  choice: 锅
  rationale: 此词指烹制或盛放食物的器皿；结合上文她在锅中制作饼，译作“锅”简洁自然，也保留具体器物形象。
- source_word: וַתִּצֹק לְפָנָיו
  choice: 把饼倒在他面前
  rationale: יצק的基本义是“倒出、倾出”。这里宾语承接上文的饼，采用具体动作表达，比单译“端到”更贴近希伯来文，同时符合从锅中倒出食物的语境。
- source_word: וַיְמָאֵן לֶאֱכוֹל
  choice: 他却不肯吃
  rationale: מָאֵן表示主动拒绝，而不只是没有食欲；“不肯吃”自然地传达这一意志色彩。
- source_word: הוֹצִיאוּ
  choice: 你们叫……离开
  rationale: 这是יצא的使役命令式，意思是使人出去；“叫……离开”在中文命令语境中自然，并保留使役含义。
- source_word: כָל אִישׁ
  choice: 所有人／众人
  rationale: 字面为“每一个人（男人）”，此处是集体性遣散在场者；命令中译“所有人”，叙述中译“众人”，既自然又保持范围完整。
- source_word: מֵעָלַי / מֵעָלָיו
  choice: 离开我这里／离开他
  rationale: 该介词短语在此表示离开某人身边或面前。中文分别按直接引语和叙述自然表达，并保留原文人称转换。
