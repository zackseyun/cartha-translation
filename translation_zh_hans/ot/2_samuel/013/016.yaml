base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/016.yaml
  text: But she said to him[a], “No, because this great wrong of sending me away is greater than the other that you did to me.” But he would not listen to her.
translation:
  language: zh_hans
  text: 她对他说[a]：“不！你把我赶走，这件大恶比你对我所行的另一件恶更大。”但他不肯听她的话。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较形式地译作：“不要！把我赶走这件大恶，比你对我所行的另一件恶更大。”希伯来原文的表达十分紧缩，句法也较难确定。
    reason: 保留אַל可作禁令“不要”的词义，并说明原文紧缩句法所产生的翻译选择。
lexical_decisions:
- source_word: אַל
  choice: 不
  rationale: אַל通常引出禁令（“不要”），但这里的话语结构省略而紧缩，用“不”自然地表达她急切的拒绝和抗议，同时不补入原文没有的称呼。
- source_word: אוֹדֹת
  choice: （不单独译出，由后句结构体现）
  rationale: 此词在这里引出她所抗议的事情；希伯来文句法紧缩。中文将“把我赶走”直接置于“这件大恶”之前，清楚表达所论之事，避免生硬地加入“因为”或“关于”。
- source_word: הָרָעָה הַגְּדוֹלָה הַזֹּאת
  choice: 这件大恶
  rationale: רָעָה在此具有明确的道德与伤害含义；“大恶”保留原文“恶”及“大”的力度，而不是弱化为一般的坏事。
- source_word: מֵאַחֶרֶת אֲשֶׁר עָשִׂיתָ עִמִּי
  choice: 比你对我所行的另一件恶更大
  rationale: אַחֶרֶת是阴性单数“另一件”，承接省略的רָעָה（恶）。译文补出中文所需的“恶”，保留两件恶之间的明确比较，不把“另一件”过度解释为“先前那件”。
- source_word: לְשַׁלְּחֵנִי
  choice: 把我赶走
  rationale: 该不定式指把她遣走的行为。在此情境中，“赶走”比中性的“送走”更准确地传达强制和拒斥。
- source_word: וְלֹא אָבָה לִשְׁמֹעַ לָהּ
  choice: 但他不肯听她的话
  rationale: אָבָה表示意愿上的拒绝；“不肯”保留这一主观拒绝的意味，“听她的话”是自然、庄重的现代汉语。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而直接的叙事语言。她的话保持急迫和控诉的力度；不添加某些古译本或译本中的“我哥哥”等原文马所拉文本没有的称呼。
