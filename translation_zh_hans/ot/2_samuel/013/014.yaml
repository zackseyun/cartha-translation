  yaml_path: translation/ot/2_samuel/013/014.yaml
  text: But he would not listen to her[a], and he was stronger than she was[c][b], and he violated her and lay with her.
translation:
  language: zh_hans
  text: 但他不肯听她的话[a]；他力气比她大[b]，就强暴了她[c]，与她交合。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“听她的声音”。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“他制伏了她”。
    reason: lexical_alternative
  - marker: c
    text: 这里的希伯来语动词也可表示“使……受辱”或“苦待”；在本处指性侵犯。
    reason: lexical_alternative
lexical_decisions:
- source_word: אָבָה
  choice: 不肯
  rationale: 该动词表示意愿；与否定词和不定式连用时，“不肯”自然地表达出有意拒绝，而不只是没有听见。
- source_word: לִשְׁמֹעַ בְּקוֹלָהּ
  choice: 听她的话
  rationale: 原文直译为“听她的声音”，此处是听从、理会她恳求的意思；“听她的话”既自然，也保留了这一惯用语的含义。
- source_word: וַיֶּחֱזַק מִמֶּנָּה
  choice: 他力气比她大
  rationale: חזק与מן连用，表示在力量上胜过对方。此译保留比较结构，并与后面的侵犯行为区分开来，没有提前将其合并译作“制伏她”。
- source_word: וַיְעַנֶּהָ
  choice: 强暴了她
  rationale: ענה在此性暴力语境中指借强迫性交使人受辱、遭侵犯。“强暴”在现代汉语中清楚而庄重地表明行为的暴力和非自愿性质。
- source_word: וַיִּשְׁכַּב אֹתָהּ
  choice: 与她交合
  rationale: שׁכב带人物宾语时是表示性交的希伯来语惯用表达。“与她交合”明确、正式，并避免“和她睡觉”在现代汉语中可能显得含混或淡化暴力。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重且直接的叙事语言。“不肯”凸显亚扪有意拒绝；“强暴”不淡化经文所述的性暴力。“与她交合”保留原文中两个连续动词的表达，不把“侵犯”与“交合”合并成一个动作。
