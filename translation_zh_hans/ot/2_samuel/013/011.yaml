  text: וַ/תַּגֵּ֥שׁ אֵלָ֖י/ו לֶֽ/אֱכֹ֑ל וַ/יַּֽחֲזֶק בָּ/הּ֙ וַ/יֹּ֣אמֶר לָ֔/הּ בּ֛וֹאִי שִׁכְבִ֥י עִמִּ֖/י אֲחוֹתִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/011.yaml
  text: When she brought it near to him to eat[a], he seized her and said to her, “Come, lie with me, my sister.”
translation:
  language: zh_hans
  text: 她把食物端到他跟前，让他吃[a]；他抓住她，对她说：“妹妹，来，和我睡吧。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“她走近他，要让他吃。”希伯来语动词既可表示她走近，也可表示她把食物端到他跟前。
    reason: 保留וַתַּגֵּשׁ在此可能是“走近”或“送近”的词义歧义。
lexical_decisions:
- source_word: וַתַּגֵּשׁ
  choice: 她把食物送到他跟前
  rationale: נגשׁ在此既可能是不及物的“走近”，也可能是使役性的“送近”。结合她正在送上所做食物的上下文，正文采用“把食物送到他跟前”，同时以脚注保留另一种可能。
- source_word: אֵלָיו לֶאֱכֹל
  choice: 给他吃
  rationale: 介词短语表示朝向他，不定式表示目的；中文用“给他吃”自然表达隐含的食物宾语和进食目的。
- source_word: וַיַּחֲזֶק בָּהּ
  choice: 他却抓住她
  rationale: חזק与ב连用表示牢牢抓住；“抓住”清楚传达强制动作。“却”体现叙事中她送食与他突然施暴之间的转折，不减弱原文。
- source_word: בּוֹאִי
  choice: 来
  rationale: 保留阴性单数命令语气的直接性；现代汉语无需标示语法性别。
- source_word: שִׁכְבִי עִמִּי
  choice: 跟我同寝
  rationale: שׁכב与עִם连用是性行为的惯用表达。“同寝”既明确保留性含义，又保持庄重，避免用过于口语化或淡化暴力的措辞。
- source_word: אֲחוֹתִי
  choice: 妹妹
  rationale: 明确保留亲属称谓，因为兄妹关系加重了此要求的道德与叙事冲击；按中文称呼习惯译为“妹妹”比“我的妹妹”自然。
theological_decisions:
- issue: 如何表达带有性含义的命令而不加以委婉淡化
  choice: 跟我同寝
  alternative: 跟我睡觉；跟我躺下
  rationale: 原文是公认的性行为惯用语。译文应清楚呈现暗嫩的性要求，同时避免过度口语化而削弱场景的沉重与暴力性质。
- issue: 是否保留亲属称呼
  choice: 妹妹
  alternative: 省略称呼
  rationale: “我妹妹”在原文中不是无关紧要的称呼，而是凸显乱伦性质和道德冲击的关键内容，因此必须明确保留。
- issue: 是否确定וַתַּגֵּשׁ的及物或不及物含义
  choice: 正文译作她把食物送到他跟前，并以脚注保留她走近他的可能
  alternative: 正文译作她走近他
  rationale: 上下文较支持她把食物送近暗嫩，但希伯来语形式容许“她走近”的理解；不应在无说明的情况下消除真实的词义歧义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“抓住”直接呈现强制动作；“同寝”保持性含义清楚而不过分口语化。称呼依中文习惯用“妹妹”，并保留原文句末称呼所产生的冲击。
