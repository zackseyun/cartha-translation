revisions:
- from: 她把食物送到他跟前给他吃[a]，他却抓住她，对她说：“妹妹，来跟我同寝。”
  to: 她把食物端到他跟前，让他吃[a]；他抓住她，对她说：“妹妹，来，和我睡吧。”
  rationale: 修订删除原文未明示的“却”，将食物动作改为更自然的“端到他跟前”，并将“同寝”改为“和我睡吧”，以清楚表达原文性行为惯用语而不作粗俗强化。脚注保留动词及物性／词义的真实歧义，并改善替代句的现代汉语表达。
