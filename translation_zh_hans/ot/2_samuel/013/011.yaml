  naturalness: “她把食物送到他跟前给他吃”可懂，但“送到他跟前给他吃”略显重复，改为“把食物端到他跟前，让他吃”更自然。直接引语以“来，和我睡吧”表达命令自然、清楚，且保持叙事的庄重。
  terminology: “妹妹”适合原文 אֲחוֹתִי 在此处的称呼，也符合汉语语境；不宜省略。为忠实表达 שׁכב עם 的性义，采用“和我睡吧”优于语义可能较宽的“同寝”。
