base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/034.yaml
  text: But Absalom fled[a]. And the young man who was watching lifted up his eyes and saw, and behold, many people were coming by the road behind him[c][b], from the side of the mountain.
translation:
  language: zh_hans
  text: 押沙龙逃走了。负责瞭望的年轻人[a]抬眼一看[b]，只见许多人正从他后面的路上、从山坡那边走来[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “负责瞭望的年轻人”也可译作“守望的侍从”或“守望者”。希伯来原文把“年轻人／侍从”和“瞭望／守望”结合在一起。
    reason: lexical_alternative
  - marker: b
    text: 希伯来原文直译为“举起他的眼睛”，是“抬眼看”的惯用说法。
    reason: lexical_alternative
  - marker: c
    text: 或译：“从他后面的路上，从山旁走来。”希伯来原文对道路、人物和山坡之间的空间关系表达得较为紧缩，“他”具体指谁也不十分明确。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּבְרַח
  choice: 逃走了
  rationale: ברח表示逃离、逃跑；“逃走了”简洁自然，并保留叙事中的行动力度。
- source_word: אַבְשָׁלוֹם
  choice: 押沙龙
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: הַנַּעַר הַצֹּפֶה
  choice: 负责瞭望的年轻人
  rationale: נַעַר可指年轻人或侍从，צֹפֶה指观看、守望的人；此译同时保留年龄/身份用语和瞭望职能，不武断定为正式的“守望者”。
- source_word: וַיִּשָּׂא ... אֶת עֵינוֹ
  choice: 抬眼观看
  rationale: 保留希伯来语“举起眼睛”的意象，同时用现代中文自然表达其“抬头看”的惯用含义。
- source_word: וַיַּרְא וְהִנֵּה
  choice: 只见
  rationale: וְהִנֵּה在叙事中引人注意于突然进入视野的景象；“只见”自然地传达这一话语功能。
- source_word: עַם רַב
  choice: 许多人
  rationale: 直截了当地表达人数众多，不额外把他们界定为有组织的群众或队伍。
- source_word: הֹלְכִים
  choice: 正……走来
  rationale: הלך本义为行走、前行；按瞭望者的观察视角，此处是朝这边接近，故译“走来”。
- source_word: מִדֶּרֶךְ אַחֲרָיו מִצַּד הָהָר
  choice: 从他后面的路上、从山坡那边
  rationale: 尽量保留原文压缩的空间表述及两个由מִן引出的短语，不擅自确定“他”所指，也不把二者的句法关系解释得过死。
