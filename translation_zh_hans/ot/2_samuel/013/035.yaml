  text: Then Jonadab said to the king[a], “Look, the king’s sons have come; as your servant said, so it has happened.”
translation:
  language: zh_hans
  text: 约拿达对王说：“看，王的儿子们来了；正如仆人所说的，事情果然如此。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 叙事中的连续式推进事件；现代汉语通常无需另加“然后”，按上下文自然承接即可。
- source_word: יֽוֹנָדָב
  choice: 约拿达
  rationale: 采用现代中文圣经人名的通行音译。
- source_word: אֶל הַמֶּלֶךְ
  choice: 对王
  rationale: 指人间君王大卫；“对王说”符合现代汉语表达，并保留宫廷语境。
- source_word: הִנֵּה
  choice: 看
  rationale: 该指示语气词用于引人注意眼前情况；“看”简洁、即时，也避免古奥的表达。
- source_word: בְנֵי הַמֶּלֶךְ
  choice: 王的众子
  rationale: 保留复数含义；“众子”在庄重叙事中自然，并突出王的儿子们并非全被杀害。
- source_word: בָּאוּ
  choice: 都来了
  rationale: 完成式在此报告眼前已经得到证实的到来；“来了”自然表达已然结果，“都”结合复数和上下文传达众王子到场，但不等于断言绝无例外。
- source_word: כִּדְבַר עַבְדְּךָ
  choice: 正如仆人所说的
  rationale: דבר在此指先前说过的话；保留“仆人”这一宫廷自称，并以现代汉语表达对应关系。
- source_word: כֵּן הָיָה
  choice: 事情果然如此
  rationale: 表达先前陈述现已得到证实；“果然如此”自然保留“照样发生/确是如此”的确认意味。
