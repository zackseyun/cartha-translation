  terminology: “她玛”为通行人名译法；“装病”“给我些食物”“在我眼前”“从她手里接过来吃”均符合原文语义与现代汉语。将正文的“病人吃的食物”调整为中性的“食物”，并以脚注说明该词可能的专门含义，可避免把尚有讨论的词义解释当作正文确定信息。
