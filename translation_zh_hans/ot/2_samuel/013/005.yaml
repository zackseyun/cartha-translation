- from: 约拿达对他说：“你躺在床上装病。你父亲来看你的时候，你就对他说：‘请让我妹妹她玛来，给我些食物，并让她在我眼前预备病人吃的食物[a]，好让我看着，再从她手里接过来吃。’”
  to: 约拿达对他说：“你躺在床上装病。你父亲来看你的时候，你就对他说：‘请让我的妹妹她玛来，给我些食物，并让她在我眼前预备食物[a]，好让我看着，再从她手里接过来吃。’”
  rationale: 修正“我的妹妹她玛”以提升语法完整性和自然度；将正文中确定性的“病人吃的食物”改为中性的“食物”，同时保留脚注对该希伯来词可能专指病人或康复者食物的说明。其余措辞保留，以维持原文的叙事顺序、视觉观察和亲手递食的含义。
