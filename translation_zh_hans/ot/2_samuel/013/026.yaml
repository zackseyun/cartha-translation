base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/026.yaml
  text: Then Absalom said[a], “If not, please let my brother Amnon go with us.” But the king said to him, “Why should he go with you?”
translation:
  language: zh_hans
  text: 押沙龙说[a]：“若不然，请让我哥哥暗嫩跟我们一起去。”王却对他说：“他为什么要跟你去呢？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可更明确地译作：“若你不肯去，请让我哥哥暗嫩跟我们一起去。”希伯来原文在这里采用了省略说法。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说／却对他说
  rationale: 叙事中的连续式推动情节；首处用自然的“说”，次处加“却”体现王的回应与押沙龙请求之间的转折。
- source_word: וָלֹא
  choice: 若不然
  rationale: 原文是承接上文拒绝之意的省略说法。“若不然”保留其简练和条件意味；完整含义可理解为“若你不肯去”。
- source_word: נָא
  choice: 请
  rationale: 该语气词使请求显得客气、恳切；现代汉语以“请”表达最自然。
- source_word: יֵלֶךְ
  choice: 请让……去／为什么要……去呢
  rationale: 押沙龙话中的祈愿式在请求中译作“请让……去”；王答话中的未完成式用于反问，译作“为什么要……去呢”。
- source_word: אִתָּנוּ
  choice: 跟我们一起
  rationale: 准确表达伴随关系及第一人称复数，符合现代汉语习惯。
- source_word: אַמְנוֹן אָחִי
  choice: 我哥哥暗嫩
  rationale: אָחִי本义为“我的兄弟”；在叙事关系中暗嫩是押沙龙的哥哥，译作“我哥哥暗嫩”自然且明确。
- source_word: לָמָה
  choice: 为什么
  rationale: 直接、自然地表达原因疑问。
- source_word: עִמָּךְ
  choice: 跟你
  rationale: 表达伴随关系；“你”是第二人称阳性单数，指押沙龙。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“若不然”略带书面色彩，与叙事语体相称，并保留原文的省略性；脚注说明完整含义。“跟……一起去”比直译式“与……去”更符合普通读者的表达习惯。
