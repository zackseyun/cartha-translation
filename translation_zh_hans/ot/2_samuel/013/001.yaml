  text: וַ/יְהִ֣י אַֽחֲרֵי כֵ֗ן וּ/לְ/אַבְשָׁל֧וֹם בֶּן דָּוִ֛ד אָח֥וֹת יָפָ֖ה וּ/שְׁמָ֣/הּ תָּמָ֑ר וַ/יֶּאֱהָבֶ֖/הָ אַמְנ֥וֹן בֶּן דָּוִֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/001.yaml
  text: After this[a], Absalom son of David had a beautiful sister whose name was Tamar, and Amnon son of David loved her.
translation:
  language: zh_hans
  text: 这事以后，大卫的儿子押沙龙有一位美丽的姐妹，名叫她玛；大卫的儿子暗嫩爱她[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“迷恋她”或“渴望她”。希伯来文所用的是通常表示“爱”的动词，但后面的叙事表明暗嫩的这种感情是败坏的。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי כֵן
  choice: 这事以后
  rationale: וַיְהִי在此是叙事承接语，与אַחֲרֵי כֵן合起来引出后续事件。“这事以后”自然简洁，也保留与上文的时间联系。
- source_word: וּלְאַבְשָׁלוֹם בֶּן דָּוִד
  choice: 大卫的儿子押沙龙有
  rationale: 希伯来文以介词לְ表达领属，现代汉语自然译作“有”。保留“大卫的儿子”，以体现本节反复强调的王室家族关系。
- source_word: אָחוֹת יָפָה
  choice: 一个美貌的妹妹
  rationale: אָחוֹת意为“姐妹”；根据押沙龙与她玛的关系及后文语境译作“妹妹”。יָפָה在此指外貌美丽，“美貌”准确而庄重。
- source_word: וּשְׁמָהּ תָּמָר
  choice: 名叫她玛
  rationale: 直接传达命名句的内容，符合现代汉语叙事表达。
- source_word: וַיֶּאֱהָבֶהָ
  choice: 爱上了她
  rationale: אהב是通常表示“爱”的动词；“爱上了她”在汉语中自然表达此处产生男女情意的意思，同时不在正文中提前把它解释为欲望或迷恋。
- source_word: אַמְנוֹן בֶּן דָּוִד
  choice: 大卫的儿子暗嫩
  rationale: 保留第二次“⼤卫的儿子”，使原文对同一家族内部关系的强调清楚可见。
theological_decisions:
- issue: 在道德张力强烈的叙事中如何翻译אהב
  choice: 爱上了她
  alternative: 迷恋她；想要得到她
  rationale: 本节使用普通的“爱”字，而后文才显明暗嫩这种所谓的爱已经败坏并走向暴力。正文保留“爱”的用语，以维持原叙事的文学和神学张力；脚注说明上下文所揭示的性质。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“这事以后”承接上文；两次保留“大卫的儿子”，突出王室家庭关系。脚注标记已置于相关措辞之后。
