base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/013.yaml
  text: As for me[a], where could I carry my disgrace? And you—you would be like one of the fools in Israel. So now, please speak to the king[c][b], for he will not withhold me from you.
translation:
  language: zh_hans
  text: 至于我，我能把我的耻辱带到哪里去呢？至于你，你必会像以色列中一个无耻之徒[a]。现在，求你向王说吧；他不会拒绝把我给你[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “无耻之徒”所译的希伯来语也可译作“愚妄人”；这里主要指道德败坏、行为可耻的人，而不只是缺乏才智的人。
    reason: lexical_alternative
  - marker: b
    text: 她的意思是，请暗嫩求王把她给他。这里没有说明她是真认为王会准许，还是为阻止或拖延暗嫩而这样说。
    reason: alternative_reading
lexical_decisions:
- source_word: אָנָה אוֹלִיךְ אֶת־חֶרְפָּתִי
  choice: 我要把这耻辱带到哪里去呢
  rationale: 保留“带到哪里去”的移动意象，并以反问表达她将无处摆脱、安放这公开羞辱的处境。חֶרְפָּה 在这里主要指因所受之事而来的社会性耻辱。
- source_word: כְּאַחַד הַנְּבָלִים
  choice: 像以色列中一个无耻之徒
  rationale: נָבָל 在此并非单指智力上的愚笨，而是指罔顾道德、行为卑劣可耻的人；“无耻之徒”自然地传达其强烈的道德谴责。
- source_word: דַּבֶּר־נָא אֶל־הַמֶּלֶךְ
  choice: 求你向王说吧
  rationale: נָא 表示恳求；“求你……吧”体现她急切而恳切的请求。
- source_word: לֹא יִמְנָעֵנִי מִמֶּךָּ
  choice: 他不会不把我给你
  rationale: 按上下文将“不会使我离开你／不会扣住我不给你”的希伯来语表达自然译出，指王不会拒绝把她给暗嫩，但不在正文中断定此建议是否真实可行。
theological_decisions:
- issue: 她求暗嫩向王提出请求的性质
  choice: 直接保留她所说“王不会不把我给你”，不判断这是诚实可行的婚姻建议，还是为拖延侵害而采取的权宜之计。
  alternative: 明确译成她真心相信王会准许婚事，或明确说明她只是在设法拖延。
  rationale: 本节只记录她的话，并未解释其法律可行性或实际意图；译文与脚注应保留这种叙事上的含混。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“至于我……至于你……”对应原文的强调对照；用“王”而非补入“大卫”，保持原文称谓。
