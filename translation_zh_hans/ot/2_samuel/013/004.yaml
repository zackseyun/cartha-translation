base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/004.yaml
  text: He said to him[a], “Why are you so gaunt, son of the king, morning after morning? Will you not tell me?” And Amnon said to him, “I love Tamar[b], the sister of my brother Absalom.”
translation:
  language: zh_hans
  text: 他对他说：“王子啊，你为什么每天早晨都这样憔悴[a]？难道你不告诉我吗？”暗嫩对他说：“我爱我兄弟押沙龙的妹妹她玛[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译为“早晨又早晨”；也可译作“早晨接着早晨”。
    reason: 保留בַּבֹּקֶר בַּבֹּקֶר的重复形式及其反复发生的含义。
  - marker: b
    text: 也可译作“我爱上了她玛”。原文直译为“我爱她玛”。
    reason: 说明“爱上了”是合乎语境的汉语表达，但主文按אָהֵב的普通现在陈述译为“爱”。
lexical_decisions:
- source_word: מַדּוּעַ
  choice: 为什么
  rationale: 直接询问原因；现代汉语中自然明确。
- source_word: כָּכָה דַּל
  choice: 憔悴
  rationale: דַּל在这里描述暗嫩日渐显出的衰弱、消瘦状态；“憔悴”既自然，又避免误解为经济贫穷。
- source_word: בֶּן הַמֶּלֶךְ
  choice: 王子啊
  rationale: 原文直译为“王的儿子”；汉语用“王子”并加呼语助词，简洁地保留约拿达对其身份的强调。
- source_word: בַּבֹּקֶר בַּבֹּקֶר
  choice: 一天比一天
  rationale: 原文重复“早晨”表示逐日反复；结合憔悴的状态，汉语“一天比一天”自然表达持续可见的变化，脚注保留较形式对应的译法。
- source_word: הֲלוֹא תַּגִּיד לִי
  choice: 难道你不肯告诉我吗
  rationale: הֲלוֹא带有期待肯定回应的催问语气；“难道……不肯……吗”在现代汉语中传达劝促意味。
- source_word: אֲחוֹת אַבְשָׁלֹם אָחִי
  choice: 我兄弟押沙龙的妹妹
  rationale: 保留原文对押沙龙与暗嫩兄弟关系的明确表达，并以自然汉语呈现亲属结构。
- source_word: אֲנִי אֹהֵב
  choice: 我爱上了
  rationale: אָהֵב是普通的“爱”字；此处汉语“爱上了”自然表达暗嫩所声称的男女之爱，但不擅自改译为“欲求”或预先作道德判断。
theological_decisions:
- issue: 如何表达暗嫩对她玛所声称的感情
  choice: 我爱上了她玛
  alternative: 我爱她玛／我想要她玛
  rationale: 原文使用普通动词אָהֵב（爱）。主译保留其爱情表述，不因后文揭示其罪恶欲望而在本节先行改写为“想要”或“贪恋”；同时，“爱上了”比孤立的“爱”更符合此处现代汉语语境。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。人名依常见中文圣经译名作“暗嫩、押沙龙、她玛”。“王子啊”体现呼语，“难道……吗”保留原问句的催促语气。
