base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/017.yaml
  text: Then he called his young man who served him and said[a], “Please send this one away from me, outside[b], and bolt the door behind her.”
translation:
  language: zh_hans
  text: 于是，暗嫩叫来服侍他的年轻人，对他说：“请把这个女人[a]从我这里赶到外面去，再在她身后把门闩上[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “这个女人”原文仅为阴性指示词“这个”，指她玛；这里带有刻意疏远、轻蔑的语气。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“在她身后把门闩上”。“闩上”也可译为“锁上”或“关牢”。
    reason: lexical_alternative
lexical_decisions:
- source_word: נַעֲרוֹ מְשָׁרְתוֹ
  choice: 伺候他的年轻仆人
  rationale: נַעַר可指年轻人或仆役，מְשָׁרְתוֹ说明他负责近身伺候；此译兼顾年龄意味、身份和动作。
- source_word: שִׁלְחוּ נָא
  choice: 赶出去，送到外面
  rationale: שׁלח在此表示打发离开；结合后面的הַחוּצָה，中文用“赶出去，送到外面”自然呈现命令及驱逐意味。נָא在这里不必机械译成礼貌的“请”，可在急切命令语境中体现催促语气。
- source_word: זֹאת
  choice: 这个女人
  rationale: 原文只有阴性指示词“这个”，指向她玛；中文若单说“这个”不够自然。“这个女人”明确所指，同时保留暗嫩刻意疏远、轻蔑的口气。
- source_word: מֵעָלַי
  choice: 从我这里
  rationale: 字面为“从我上面”，在此是要求将她从自己身边或所在之处移走；“从我这里”自然且不把意思限定为身体接触。
- source_word: הַחוּצָה
  choice: 到外面
  rationale: 带方向词尾，表示向外；“到外面”准确保留方向性。
- source_word: וּנְעֹל הַדֶּלֶת
  choice: 再把门闩上
  rationale: נעל可指闩住、关牢或锁上。古代门具语境中“闩上”具体而贴切。
- source_word: אַחֲרֶיהָ
  choice: 别让她进来
  rationale: 原文直译为“在她身后”，即她出去之后把门闩上。中文用结果性表达自然传达动作目的，但正文另以脚注保留直译。
