base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/008.yaml
  text: So Tamar went to the house of her brother Amnon[a], while he was lying down. She took the dough, kneaded it, shaped it into cakes in his sight[b], and cooked the cakes.
translation:
  language: zh_hans
  text: 于是，他玛来到她哥哥暗嫩的家；暗嫩正躺着。她拿起面团来揉，在他眼前做成饼[a]，又把饼烹熟[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“做成心形饼”。这里的希伯来语动词和名词都很少见，可能表示一种形状与“心”有关的饼。
    reason: lexical_alternative
  - marker: b
    text: 或译“把饼煮熟”。这里的希伯来语动词常可特指水煮，但在本处也可能泛指烹调。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּלֶךְ
  choice: 于是……来到
  rationale: 叙事性连续式推进情节；“于是”承接上文的吩咐，“来到”自然表达前往并抵达暗嫩家中。
- source_word: בֵּית אַמְנוֹן אָחִיהָ
  choice: 她哥哥暗嫩家里
  rationale: 准确保留地点和亲属关系；现代汉语中“来到……家里”自然通顺。
- source_word: וְהוּא שֹׁכֵב
  choice: 那时暗嫩正躺着
  rationale: 将该分句理解为伴随情状。“正躺着”贴近原文，不进一步解释为卧病或躺在床上。
- source_word: הַבָּצֵק
  choice: 面团
  rationale: 这是食物制作语境中该词的常用含义。
- source_word: וְתָלֹשׁ
  choice: 揉
  rationale: לוש通常指揉面；汉语结合前面的“面团”即可自然表达揉制动作。
- source_word: וַתְּלַבֵּב
  choice: 做成饼
  rationale: 该动词罕见，并与下文食物名称同源；正文表达把面团制成这种饼，却不把可能的心形含义确定化。
- source_word: לְעֵינָיו
  choice: 在他眼前
  rationale: 保留原文视觉性的表达，表明暗嫩可以看见她制作食物。
- source_word: וַתְּבַשֵּׁל
  choice: 烹熟
  rationale: בשל可泛指烹煮，也常特指水煮；“烹熟”在正文中保留较宽泛的烹调含义。
- source_word: הַלְּבִבוֹת
  choice: 饼
  rationale: 指她制成的食物；“饼”简明自然，同时将可能与“心”有关的形状或名称留在脚注说明。
