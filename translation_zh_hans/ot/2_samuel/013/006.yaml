base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/006.yaml
  text: So Amnon lay down and pretended to be sick. When the king came to see him[a], Amnon said to the king, “Please let Tamar my sister come and make two cakes before my eyes, so that I may eat from her hand.”
translation:
  language: zh_hans
  text: 暗嫩便躺下装病。王来看他时，暗嫩对王说：“请让我的姊妹她玛来，在我眼前做两个饼[a]，好让我从她手中接过来吃。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语所指的具体食物不确定，也可译作“两个糕饼”或“两份点心”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: 躺下
  rationale: 这里指暗嫩为实施骗局而卧床；“躺下”既贴近原文，也符合现代汉语叙事。
- source_word: וַיִּתְחָל
  choice: 装病
  rationale: 该形式在此表示佯装生病；“装病”简洁自然，并准确呈现上下文中的欺骗行为。
- source_word: לִרְאֹתוֹ
  choice: 来看他
  rationale: 直接保留 ראה“看、见”的含义；在语境中自然表达王前来探视。
- source_word: תָּבוֹא נָא
  choice: 请让……来
  rationale: 未完成式配合 נָא 表达委婉请求；此译法符合暗嫩向王提出请求的汉语表达。
- source_word: תָּמָר אֲחֹתִי
  choice: 我妹妹她玛
  rationale: “妹妹”符合她玛与暗嫩的家庭关系和现代汉语习惯，同时保留名字与亲属称谓。
- source_word: וּתְלַבֵּב
  choice: 做
  rationale: 这是与 לְבִבוֹת 相关的罕见动词，具体烹调动作不明确；“做”避免无依据地限定为烤、煎或塑形。
- source_word: לְעֵינַי
  choice: 在我眼前
  rationale: 保留原文具体的视觉表达，突出暗嫩要求她玛当着他的面制作食物。
- source_word: שְׁתֵּי לְבִבוֹת
  choice: 两个饼
  rationale: 该词指某种饼或点心，但确切种类和形状不明；正文采用宽泛自然的“饼”，并以脚注说明不确定性。
- source_word: וְאֶבְרֶה
  choice: 好让我……吃
  rationale: 该动词在病人进食的语境中表示吃或获取滋养；“吃”清楚自然，“好让我”体现目的关系。
- source_word: מִיָּדָהּ
  choice: 从她手中
  rationale: 贴近原文单数“手”的表达，并保留由她亲自递送、服侍的意味。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“装病”明确表达语境中的佯病；“在我眼前”和“从她手中”保留原文的具体措辞及暗嫩请求中刻意营造的亲近感。脚注标记置于存在词义不确定性的“饼”之后。
