base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/039.yaml
  text: And King David longed to go out to Absalom, for he was comforted concerning Amnon, since he was dead.
translation:
  language: zh_hans
  text: 大卫王一心想去见押沙龙[a]，因为暗嫩已经死了，他为暗嫩悲伤的心也得了安慰。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本句希伯来语语法简略，含义有争议。也可译作：“大卫王不再出去追捕押沙龙。”
    reason: 保留原文在动词主语及“到／反对押沙龙”关系上的真实歧义，并反映古译本所支持的另一种理解。
lexical_decisions:
- source_word: וַתְּכַל ... לָצֵאת אֶל־אַבְשָׁלוֹם
  choice: 一心想去见押沙龙
  rationale: 希伯来语此处语法简略且含义有争议。按上下文及常见理解，阴性动词可能以省略的“心”或“性命”为主语，表达大卫内心渴望去押沙龙那里；中文用“一心想”自然传达这种内在愿望，“去见”也比直译“出去到”更符合现代汉语。
- source_word: נִחַם עַל־אַמְנוֹן
  choice: 为暗嫩悲伤的心也得了安慰
  rationale: נחם为尼法勒式，可表示“得到安慰”。补出“悲伤的心”使中文关系清楚，同时保留原文所说大卫对暗嫩之死已逐渐得到安慰的意思。
- source_word: כִּי מֵת
  choice: 因为暗嫩已经死了
  rationale: 第二个כִּי自然表原因；中文明确重复暗嫩的名字，以避免代词指向含混。
theological_decisions:
- issue: 大卫对押沙龙的态度
  choice: 正文采用“大卫王一心想去见押沙龙”
  alternative: “大卫王不再出去追捕押沙龙”
  rationale: 马所拉文本的形式异常，既可按省略女性主语来理解为“心里渴望”，也有古译本和解释传统理解为“停止出去反对／追捕”。正文依照较常见且符合叙事推进的读法，脚注保留另一种真实可能，不借翻译断定大卫是否已经饶恕押沙龙。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“一心想去见”避免生硬直译；后半句略作显化，以清楚表达大卫因暗嫩之死所受的哀痛已得到安慰。脚注简洁呈现关键文本歧义。
