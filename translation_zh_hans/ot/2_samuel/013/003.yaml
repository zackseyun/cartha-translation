  text: וּ/לְ/אַמְנ֣וֹן רֵ֗עַ וּ/שְׁמ/וֹ֙ יֽוֹנָדָ֔ב בֶּן שִׁמְעָ֖ה אֲחִ֣י דָוִ֑ד וְ/י֣וֹנָדָ֔ב אִ֥ישׁ חָכָ֖ם מְאֹֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/003.yaml
  text: Amnon had a friend[a], whose name was Jonadab son of Shimeah, David’s brother; and Jonadab was a very shrewd man.
translation:
  language: zh_hans
  text: 暗嫩有一个朋友，名叫约拿达，是大卫的兄弟示米亚的儿子。约拿达是个非常精明的人[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“很有智慧”或“非常聪明”。希伯来语可以广泛表示智慧或聪明；这里译作“精明”，因为接下来的叙事表明，约拿达的洞察力被用在道德上可疑的计谋中。
    reason: 保留 חָכָם 的词义幅度及叙事中的道德含混性。
lexical_decisions:
- source_word: רֵעַ
  choice: 朋友
  rationale: 该名词通常指朋友、同伴或相交之人；在此处是叙事对约拿达身份与后续进言的铺垫，“朋友”自然且贴合上下文。
- source_word: וּלְאַמְנוֹן
  choice: 暗嫩有
  rationale: 希伯来语以介词 לְ 加人名表达领属，直译近于“对暗嫩有”；现代汉语自然表达为“暗嫩有”。句首 וּ 只承接叙事，不另加“这时”之类原文没有的时间副词。
- source_word: וּשְׁמוֹ
  choice: 名叫
  rationale: 这是常见的命名表达；“名叫”在现代汉语中简洁自然，也保留了介绍人物姓名的功能。
- source_word: בֶּן שִׁמְעָה אֲחִי דָוִד
  choice: 是大卫的兄弟示米亚的儿子
  rationale: 按希伯来语构造，示米亚是大卫的兄弟，约拿达是示米亚的儿子。译文明确这一亲属关系，不增添原文没有的“长兄”。
- source_word: אִישׁ חָכָם מְאֹד
  choice: 是个非常精明的人
  rationale: חָכָם 可泛指有智慧、聪明或善于谋划；本段后文显示其才智被用于道德上可疑的计策。“精明”既表达敏锐机智，又不预先给予正面的道德评价；“人”对应 אִישׁ。
theological_decisions:
- issue: 约拿达的 חָכָם 是否带有正面道德评价
  choice: 正文译为“精明”，保持才智与道德评价之间的张力
  alternative: 译为“有智慧”或“聪明”
  rationale: 该词本身可有正面的“智慧”义，但叙事中的具体表现是设计可疑计谋。译为“精明”不把聪敏直接等同于敬虔或德行，同时脚注保留其他真实词义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。人名沿用常见中文圣经译名“暗嫩、约拿达、示米亚、大卫”。两句结构清楚交代人物关系，并避免加入原文没有的“长兄”或显式时间标记。
