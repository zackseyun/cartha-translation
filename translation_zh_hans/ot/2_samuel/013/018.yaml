base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/018.yaml
  text: She was wearing a richly ornamented robe[a], for this is how the virgin daughters of the king used to dress. Then his attendant put her outside and bolted the door behind her.
translation:
  language: zh_hans
  text: 她身上穿着一件华美的长袍[a]；王那些仍是处女的女儿，向来都穿这样的袍子。暗嫩的侍从把她带到外面去，随后把门闩上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “华美的长袍”所译的衣服名称确切含义不确定；也可能指“彩衣”或“有长袖的长袍”。
    reason: 保留 כְּתֹנֶת פַּסִּים 的词义不确定性，避免把传统或某一种词源解释当作定论。
lexical_decisions:
- source_word: כְּתֹנֶת פַּסִּים
  choice: 华美的长袍
  rationale: 该词组指一种彰显身份的特殊衣袍，但具体是彩衣、长袖衣还是装饰华美的衣服，无法确定。“华美的长袍”在现代汉语中自然庄重，并保留其贵重、特殊的意味；其他可能含义列入脚注。
- source_word: כִּי כֵן תִּלְבַּשְׁןָ
  choice: 向来都这样穿
  rationale: 该结构说明王女通常的穿着习惯；“向来都这样穿”简洁表达习惯性动作。
- source_word: בְנוֹת הַמֶּלֶךְ הַבְּתוּלֹת
  choice: 王的女儿中，未出嫁的
  rationale: בְּתוּלֹת 在此既涉及童贞，也在王室服饰的社会语境中标明未婚身份。正文采用自然的“未出嫁的”，避免生硬，同时不抹去所指群体的身份。
- source_word: מְעִילִים
  choice: 这样穿
  rationale: 该复数名词可指长袍或外衣。由于前文已明说衣袍，中文用“这样穿”承接，可避免“穿长袍……这样穿长袍”的累赘，同时保留解释习俗的功能。
- source_word: מְשָׁרְתוֹ
  choice: 暗嫩的侍从
  rationale: 指服侍暗嫩的贴身人员。希伯来语为“他的侍从”；中文明确为“暗嫩的”，可避免邻近女性代词造成指代含混。
- source_word: וַיֹּצֵא אוֹתָהּ הַחוּץ
  choice: 把她赶出去
  rationale: 使役形式表示让她到外面去；结合紧接着闩门的粗暴情境，“赶出去”自然传达强制性，但不额外描写具体暴力。
- source_word: וְנָעַל הַדֶּלֶת אַחֲרֶיהָ
  choice: 随后把门闩上
  rationale: נעל 指锁上或闩上。“闩上”具体传达门被封闭，也保留动作的决绝意味；“随后”自然表达 אַחֲרֶיהָ 在这里所含的“她出去之后／在她身后”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。以分号连接衣着说明和王室习俗；后半句明确侍从属于暗嫩，使中文指代清楚。脚注标记已在正文中列出。
