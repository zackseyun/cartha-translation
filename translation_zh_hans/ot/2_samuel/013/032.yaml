  text: וַ/יַּ֡עַן יוֹנָדָ֣ב בֶּן שִׁמְעָ֨ה אֲחִֽי דָוִ֜ד וַ/יֹּ֗אמֶר אַל יֹאמַ֤ר אֲדֹנִ/י֙ אֵ֣ת כָּל הַ/נְּעָרִ֤ים בְּנֵֽי הַ/מֶּ֨לֶךְ֙ הֵמִ֔יתוּ כִּֽי אַמְנ֥וֹן לְ/בַדּ֖/וֹ מֵ֑ת כִּֽי עַל פִּ֤י אַבְשָׁלוֹם֙ הָיְתָ֣ה שׂוּמָ֔ה מִ/יּוֹם֙ עַנֹּת֔/וֹ אֵ֖ת תָּמָ֥ר אֲחֹתֽ/וֹ׀־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/032.yaml
  text: Then Jonadab son of Shimeah[a], David’s brother, answered and said, “Let not my lord say, ‘They have killed all the young men, the king’s sons,’ for Amnon alone is dead[b]. For this had been determined by Absalom from the day he violated Tamar his sister.”
translation:
  language: zh_hans
  text: 大卫的兄弟示米亚的儿子约拿达回答说：“我主不要说：‘王的儿子，那些年轻人，全都被杀了。’只有暗嫩一人死了。因为自从暗嫩玷辱[b]他妹妹她玛的那日，这事就已照着押沙龙的意思定下了[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这句话也可译作“这事早已照押沙龙的话（或命令）定下了”。
    reason: lexical_alternative
  - marker: b
    text: “玷辱”在这里指性侵，也可明确译作“强奸”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: 回答说
  rationale: 保留希伯来叙事中常见的应答公式，同时符合现代汉语表达。
- source_word: יוֹנָדָב בֶּן שִׁמְעָה אֲחִי דָוִד
  choice: 大卫的哥哥示米亚的儿子约拿达
  rationale: 准确呈现亲属关系；“哥哥”在此按叙事人物关系译出，使修饰关系清楚。
- source_word: אַל יֹאמַר אֲדֹנִי
  choice: 我主不要说
  rationale: אַל加未完成式表达劝阻；“我主”保留约拿达对王恭敬的宫廷称呼。
- source_word: הַנְּעָרִים בְּנֵי הַמֶּלֶךְ
  choice: 王的儿子，那些年轻人
  rationale: 将“年轻人”与“王的儿子”之间的同位关系明示出来，避免误解为两组人。
- source_word: הֵמִיתוּ
  choice: 全都被杀了
  rationale: 使役词形意为“杀死”；上下文是传到大卫耳中的消息，汉语用被动式自然，也不强行点明行凶者。
- source_word: אַמְנוֹן לְבַדּוֹ מֵת
  choice: 只有暗嫩一人死了
  rationale: 直接体现לְבַדּוֹ的排他强调。
- source_word: עַל פִּי אַבְשָׁלוֹם הָיְתָה שׂוּמָה
  choice: 押沙龙早已定意如此
  rationale: 该短语表示事情按押沙龙的话、命令或既定意图而确定；正文采用自然且不过度具体化的“定意”，脚注保留“话/命令”的语义可能。
- source_word: מִיּוֹם עַנֹּתוֹ אֵת תָּמָר אֲחֹתוֹ
  choice: 从暗嫩玷辱他妹妹她玛的那一天起
  rationale: 结合13章上下文明确动作实施者为暗嫩；“玷辱”保留ענה在此兼具羞辱与性侵害的表达，脚注说明更明确的译法。
