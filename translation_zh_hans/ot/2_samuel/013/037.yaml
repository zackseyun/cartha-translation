source:
  edition: WLC
  text: וְ/אַבְשָׁל֣וֹם בָּרַ֔ח וַ/יֵּ֛לֶךְ אֶל תַּלְמַ֥י בֶּן עמיחור מֶ֣לֶךְ גְּשׁ֑וּר וַ/יִּתְאַבֵּ֥ל עַל בְּנ֖/וֹ כָּל הַ/יָּמִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/037.yaml
  text: But Absalom fled and went to Talmai son of Ammihur[a], king of Geshur. And he mourned for his son all the days.
translation:
  language: zh_hans
  text: 押沙龙却逃到基述王亚米忽的儿子达买那里。大卫[a]为他的儿子悲哀了许多日子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文没有明说“悲哀”的主语；根据上下文，这里指大卫。
    reason: 原文主语隐含，中文正文为清楚起见补出。
lexical_decisions:
- source_word: וְ/אַבְשָׁלוֹם בָּרַח
  choice: 押沙龙却逃到
  rationale: 连接词在此承接并形成叙事转折，译作“却”自然；בָּרַח明确表示逃走。
- source_word: וַיֵּלֶךְ אֶל
  choice: 到……那里
  rationale: 与前面的“逃”合并为自然的现代汉语表达，完整保留其前往的含义。
- source_word: תַּלְמַי בֶּן עמיחור
  choice: 亚米忽的儿子达买
  rationale: 按希伯来语父名关系表达，并采用通行的中文圣经人名译法。WLC此处辅音文本写作עמיחור，传统读法及平行经文支持“亚米忽”。
- source_word: מֶלֶךְ גְּשׁוּר
  choice: 基述王
  rationale: 希伯来语组合结构表明达买是基述的王；中文以“基述王”简洁表达。
- source_word: וַיִּתְאַבֵּל
  choice: 悲哀
  rationale: אבל的Hitpael词形指因丧失而哀悼；“悲哀”在现代中文中庄重自然。主语在希伯来文中没有明说。
- source_word: עַל בְּנוֹ
  choice: 为他的儿子
  rationale: עַל与哀悼动词连用时可自然译为“为”；代词仍保留为“他的”，上下文所指是暗嫩。
- source_word: כָּל הַיָּמִים
  choice: 许多日子
  rationale: 该习语在此表示持续一段时期，而非“大卫一生所有日子”；结合下一节的时间推进，译为“许多日子”既自然又避免误解。
theological_decisions:
- issue: וַיִּתְאַבֵּל的隐含主语
  choice: 正文补出“大卫”，并加注说明
  alternative: 保留为“他”，让读者从上下文判断
  rationale: 希伯来文只用第三人称单数动词，语法上未明说主语；上下文最自然地指大卫。正文补名可避免中文代词误指最近出现的达买，同时脚注保存原文的含蓄。
- issue: “他的儿子”所指
  choice: 保留代词，不在正文改成“暗嫩”
  alternative: 明确译为“为暗嫩悲哀”
  rationale: 原文使用בְּנוֹ“他的儿子”；保留代词可维持原文表达，而上下文足以辨明是暗嫩。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“押沙龙却逃到……那里”避免机械重复“逃了，又去了”；“悲哀了许多日子”表达持续哀悼，也与后文叙事时间相衔接。
