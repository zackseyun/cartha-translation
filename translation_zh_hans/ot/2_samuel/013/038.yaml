lexical_decisions:
- source_word: וְ/אַבְשָׁלוֹם
  choice: 押沙龙却
  rationale: 连词 וְ 在这里承接并略带转折；译作“却”符合叙事语境，同时脚注保留“于是”的可能。人名采用现代中文圣经通行译名“押沙龙”。
- source_word: בָּרַח
  choice: 逃
  rationale: בָּרַח 表示因危险或追究而逃离；“逃”简洁自然，并准确传达行动性质。
- source_word: וַ/יֵּלֶךְ גְּשׁוּר
  choice: 到基述去了
  rationale: הלך 在连续叙事中表示“去”；结合目的地 גְּשׁוּר，中文用“到基述去了”自然流畅。地名采用通行译名“基述”。
- source_word: וַ/יְהִי שָׁם
  choice: 在那里住了
  rationale: 原文直译为“他在那里”；在三年这一持续时间的限定下，中文译作“住了”最自然。脚注保留较贴近形式的译法。
- source_word: שָׁלֹשׁ שָׁנִים
  choice: 三年
  rationale: 准确表达持续三年的时间。
