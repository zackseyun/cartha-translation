  yaml_path: translation/ot/2_samuel/013/027.yaml
  text: But Absalom pressed him[a], so he sent Amnon and all the king’s sons with him.
translation:
  language: zh_hans
  text: 押沙龙再三催促王[a]，王就让暗嫩和王的众子都与押沙龙同去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“押沙龙执意恳求王”或“押沙龙不断向王施压”。这里的希伯来语习语比一般的请求语气更强，表示持续而强烈的催促。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְרָץ בּוֹ
  choice: 再三催促王
  rationale: 此处פָּרַץ与介词בְּ连用，是表示强力、持续催促某人的习语，并非字面意义的“冲破”。上文明确受催促者是大卫王；译出“王”可消除汉语中代词可能造成的歧义，而“再三催促”保留了其强于普通请求的语气。
- source_word: אַבְשָׁלוֹם
  choice: 押沙龙
  rationale: 采用现代中文圣经人名的通行译法。
- source_word: וַיִּשְׁלַח
  choice: 王就让……同去
  rationale: שׁלח在此表示大卫准许并差遣众子前往押沙龙的筵席。结合中文句法译作“让……同去”，自然地表达许可和送行之意。
- source_word: אִתּוֹ
  choice: 与押沙龙同去
  rationale: 原文直译为“与他一起”，所指是押沙龙。中文若保留“他”容易与王或暗嫩混淆，因此明示所指。
- source_word: אֶת אַמְנוֹן
  choice: 暗嫩
  rationale: 省略不需翻译的直接宾语标记；人名采用现代中文圣经的通行译法。
- source_word: וְאֵת כָּל בְּנֵי הַמֶּלֶךְ
  choice: 和王的众子
  rationale: 准确保留“王的所有儿子”这一集合意义；“众子”简洁、庄重，也符合叙事语体。
