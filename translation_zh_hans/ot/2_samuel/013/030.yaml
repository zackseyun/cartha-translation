  text: וַֽ/יְהִי֙ הֵ֣מָּה בַ/דֶּ֔רֶךְ וְ/הַ/שְּׁמֻעָ֣ה בָ֔אָה אֶל דָּוִ֖ד לֵ/אמֹ֑ר הִכָּ֤ה אַבְשָׁלוֹם֙ אֶת כָּל בְּנֵ֣י הַ/מֶּ֔לֶךְ וְ/לֹֽא נוֹתַ֥ר מֵ/הֶ֖ם אֶחָֽד־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/030.yaml
  text: While they were on the way[a], the report came to David, saying, “Absalom has struck down all the king’s sons, and not one of them is left.”
translation:
  language: zh_hans
  text: 他们还在路上时，有消息[a]传到大卫那里，说：“押沙龙击杀了王所有的儿子，一个也没有留下。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “消息”也可译作“报告”或“传闻”；希伯来词也可指尚未证实的消息。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי הֵמָּה בַדֶּרֶךְ
  choice: 他们还在路上时
  rationale: 把希伯来叙事句式自然地译为时间背景，保留“他们正在路上”的同时性。
- source_word: הַשְּׁמֻעָה
  choice: 消息
  rationale: 该词可指消息、报告或传闻；“消息”在现代汉语中自然，并不预先断定内容可靠，脚注说明其未证实的可能含义。
- source_word: בָאָה אֶל דָּוִד
  choice: 传到大卫那里
  rationale: 准确表达消息来到大卫处，在现代汉语中也比直译“来到大卫”更自然。
- source_word: לֵאמֹר
  choice: 说
  rationale: 保留引出直接引语的功能，符合现代汉语叙事习惯。
- source_word: הִכָּה
  choice: 击杀了
  rationale: נכה本义涉及击打，在本句语境中明确指致死；“击杀”兼顾词语形象和致命结果。
- source_word: כָּל בְּנֵי הַמֶּלֶךְ
  choice: 王所有的儿子
  rationale: 直接保留“王”“所有”和男性后裔“儿子”的具体含义。
- source_word: וְלֹא נוֹתַר מֵהֶם אֶחָד
  choice: 一个也没有留下
  rationale: 自然表达无人剩下，保留原文加强语气的“一人也没有”。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“击杀”保留原文动词的打击意象，同时明确本句所述为致命暴力；脚注保留消息是否可靠的语义张力。
