revisions:
- from: 暗嫩因他妹妹她玛而苦恼，甚至病倒了[a]。她玛还是处女；暗嫩觉得，要对她做任何事都难以办到[b]。
  to: 暗嫩因他的姐妹她玛而苦恼，以致患病[a]；因为她是处女，暗嫩觉得要对她做任何事都很难[b]。
  rationale: 修订删除“还是”所增添的时间性含义，以“他的姐妹”避免将未标明的长幼关系译入正文，并以“患病”保留原文对患病是反身行为或苦恼结果的语义弹性。其余措辞维持原文的叙事含混和现代汉语的庄重自然。
