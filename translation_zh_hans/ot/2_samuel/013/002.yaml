base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/002.yaml
  text: Amnon was so distressed that he made himself sick because of Tamar his sister[a], for she was a virgin[b], and it seemed impossible in Amnon’s eyes to do anything to her.
translation:
  language: zh_hans
  text: 暗嫩因他的姐妹她玛而苦恼，以致患病[a]；因为她是处女，暗嫩觉得要对她做任何事都很难[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“以致把自己弄病了。”原文既可理解为他使自己生病，也可理解为他苦恼到了患病的地步。
    reason: lexical_alternative
  - marker: b
    text: “暗嫩觉得……很难”原文直译为“这事在暗嫩眼中太难了”，意思是暗嫩认为找不到可行的办法。
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּצֶר
  choice: 苦恼
  rationale: 此处 יצר 表示内心受压、困扰或苦恼；“苦恼”自然地表达暗嫩因欲念而承受的内在煎熬，同时不额外强化为更具体的心理状态。
- source_word: לְהִתְחַלּוֹת
  choice: 甚至病倒了
  rationale: חלה 的 Hitpael 形式在这里可指“病倒”或“使自己生病”。正文采用自然的结果表达“病倒了”，并以脚注保留反身理解的可能。
- source_word: בַּעֲבוּר
  choice: 因
  rationale: 该介词在此表示原因，“因”简洁、自然，也准确连接暗嫩的苦恼与她玛。
- source_word: אֲחֹתוֹ
  choice: 他妹妹
  rationale: “妹妹”符合她玛与暗嫩的手足关系和现代汉语叙述习惯；保留亲属关系对于本段的伦理张力至关重要。
- source_word: בְתוּלָה
  choice: 处女
  rationale: 直接表达原文所指的童贞身份，不弱化为较含混的“少女”。
- source_word: וַיִּפָּלֵא בְּעֵינֵי אַמְנוֹן
  choice: 暗嫩觉得……难以办到
  rationale: 该希伯来语表达指某事在暗嫩看来过于困难、难以实现；译文保留其主观视角，避免将之断言为客观上绝无可能。
- source_word: לַעֲשׂוֹת לָהּ מְאוּמָה
  choice: 对她做任何事
  rationale: מְאוּמָה 指“任何事”或“丝毫的事”。此处保持宽泛措辞，不提前把后文将发生的罪行明说出来。
theological_decisions:
- issue: 暗嫩的病是主动造成还是苦恼导致的结果
  choice: 正文译作“甚至病倒了”
  alternative: “甚至把自己弄病了”
  rationale: Hitpael 形式容许结果性或反身性理解。正文采用较自然且不过度强调蓄意行为的表达，脚注保存另一种可能。
- issue: 暗嫩所面对的是客观不可能还是主观困难
  choice: 译作“暗嫩觉得……难以办到”
  alternative: “在暗嫩眼中是不可能的”
  rationale: “在……眼中”标明这是暗嫩的判断；采用“难以办到”既传达 פלא 的困难或不可及含义，也避免把程度锁定为绝对不可能。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“她玛还是处女”承接并说明暗嫩为何认为难以接近她；“对她做任何事”保留原文的含混与叙事张力，不提前明示后续暴行。
