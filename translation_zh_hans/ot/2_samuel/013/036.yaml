base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/036.yaml
  text: And as soon as he finished speaking[a], behold, the king’s sons came, and they raised their voices and wept. The king also, and all his servants, wept with very great weeping.
translation:
  language: zh_hans
  text: 他刚说完话，看哪，王的众子就来了；他们放声痛哭。王和他所有的臣仆也都大大痛哭[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“哭了极大的哭”，以同源词结构强调哀恸极其强烈。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּכַלֹּתוֹ לְדַבֵּר
  choice: 他刚说完话
  rationale: 将希伯来语叙事公式与时间从句自然化处理；“刚……完”准确表达紧接着发生的时间关系。
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留原文引人注意、使场景顿时鲜明的叙事标记，而不将其省略。
- source_word: בְנֵי הַמֶּלֶךְ
  choice: 王的众子
  rationale: 准确保留复数和王室亲属关系；“众子”简洁庄重，适合历史叙事。
- source_word: וַיִּשְׂאוּ קוֹלָם וַיִּבְכּוּ
  choice: 他们放声哭泣
  rationale: “放声”自然传达“扬起声音”的希伯来语习语，“哭泣”则明确表达哀恸。
- source_word: וְכָל עֲבָדָיו
  choice: 他的众臣仆
  rationale: עֲבָדִים 在王宫语境中可指王的仆人、侍从或臣属；“臣仆”既保留服事王的关系，也不把其具体官阶说死。
- source_word: בָּכוּ בְּכִי גָּדוֹל מְאֹד
  choice: 极其哀痛地哭泣
  rationale: 以自然现代汉语表达同源宾语所加强的悲哭程度，同时用脚注说明原文的强调形式。
