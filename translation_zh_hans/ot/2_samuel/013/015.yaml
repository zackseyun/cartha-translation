  yaml_path: translation/ot/2_samuel/013/015.yaml
  text: Then Amnon hated her with very great hatred[a], because the hatred with which he hated her was greater than the love with which he had loved her. And Amnon said to her, “Get up, go.”
translation:
  language: zh_hans
  text: 随后，暗嫩对她怀着极大的憎恨；因为他恨她的那种恨，比他曾爱她的那种爱更强烈。暗嫩对她说：“起来，走！”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“起来，走”。这两个简短的命令显出暗嫩严厉而突兀的遣离；也可按语境译作“起来，离开”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂנָאֶהָ
  choice: 随后，暗嫩极其憎恨她
  rationale: 叙事性连接词推动情节发展，译作“随后”；动词及阴性单数宾语后缀明确表示暗嫩憎恨她。
- source_word: שִׂנְאָה גְּדוֹלָה מְאֹד
  choice: 极其憎恨
  rationale: 这是加强动词程度的同源名词结构；“极其憎恨”在现代汉语中自然，并保留强烈语气。
- source_word: כִּי גְדוֹלָה הַשִּׂנְאָה אֲשֶׁר שְׂנֵאָהּ מֵאַהֲבָה אֲשֶׁר אֲהֵבָהּ
  choice: 他对她的恨，甚至比先前对她的爱更强烈
  rationale: מִן表示比较；两个关系从句分别限定“恨”与“爱”。“先前”体现后一完成式所指的先行动作，而“甚至”自然表达比较中突出的反差。
- source_word: קוּמִי לֵכִי
  choice: 起来，走吧
  rationale: 两个词都是阴性单数命令式。直译保持命令突兀而冷酷的简短形式，不扩展为“滚开”等更强的解释性措辞。
