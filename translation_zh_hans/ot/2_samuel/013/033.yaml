base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/033.yaml
  text: Now let not my lord the king take this matter to heart[a], saying, ‘All the king’s sons are dead,’ for Amnon alone is dead.
translation:
  language: zh_hans
  text: 现在，请我主我王不要把“王的众子都死了”这话放在心上；因为只有暗嫩一人死了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: 现在
  rationale: 作为话语转换语，引出约拿达对先前消息的纠正；“现在”自然简洁。
- source_word: אַל יָשֵׂם ... אֶל לִבּוֹ
  choice: 不要把这事放在心上
  rationale: 保留希伯来语“放/置于心上”的意象，同时符合现代汉语表达。
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: 我主我王
  rationale: 体现宫廷语境中的恭敬称呼，并保留“我的主”和“王”两个成分。
- source_word: דָּבָר
  choice: 这事
  rationale: 此处指关于王众子的消息；“这事”既自然，也保留原词可指事情或话语的宽泛性。
- source_word: לֵאמֹר
  choice: 以为
  rationale: 这里引出王不可放在心上的信息内容；汉语用“以为”比直译“说”更自然，并与上下文中的误报相符。
- source_word: כָּל בְּנֵי הַמֶּלֶךְ
  choice: 王的众子
  rationale: 准确保留所指为王的男性子嗣；“众子”庄重而简明。
- source_word: מֵתוּ
  choice: 都死了
  rationale: 结合主语中的“众”表达全体死亡的误报，采用现代汉语自然的状态表述。
- source_word: כִּי אִם
  choice: 其实只有
  rationale: 该结构在此具有排除和纠正作用；“其实只有”清楚呈现并非众子皆死的对比。
- source_word: לְבַדּוֹ
  choice: 一人
  rationale: 与“只有”合用，突出暗嫩是唯一死亡者，避免重复而不削弱排他意义。
- source_word: מֵת
  choice: 死了
  rationale: 自然表达已经发生并造成当前结果的死亡，与前句形成直接对照。
