base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/019.yaml
  text: Then Tamar put ashes on her head[a], tore the robe of many colors that was on her, put her hand on her head, and went away, going and crying out.
translation:
  language: zh_hans
  text: 他玛把灰撒在头上[a]，撕裂身上所穿的华美衣袍，又把手放在头上，一边走，一边放声哭喊。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “华美衣袍”也可译作“彩衣”或“长袖袍”。希伯来语原词的确切含义不确定；本章上文表明，这是王室处女所穿的特殊衣袍（见13:18）。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵפֶר
  choice: 灰
  rationale: 指作为哀悼标志而撒在头上的灰；现代汉语用“灰”自然简洁。
- source_word: וַתִּקַּח ... עַל רֹאשָׁהּ
  choice: 把灰撒在头上
  rationale: 希伯来文直译近于“取灰在她头上”，语义是将灰放到头上；“撒在头上”符合汉语表达，也保留具体的哀悼动作。
- source_word: כְתֹנֶת הַפַּסִּים
  choice: 彩衣
  rationale: 该词组所指的衣袍样式不确定，传统常译为彩衣；上下文表明这是王室处女所穿的特殊衣袍。正文采用简洁的传统表达，并以脚注保留其他可能。
- source_word: אֲשֶׁר עָלֶיהָ
  choice: 身上所穿的
  rationale: 自然表达这件衣服当时穿在她身上。
- source_word: קָרָעָה
  choice: 撕裂
  rationale: 准确保留撕裂衣服这一哀伤举动，语体庄重。
- source_word: וַתָּשֶׂם יָדָהּ עַל רֹאשָׁהּ
  choice: 把手放在头上
  rationale: 按原文保留这一身体姿态，不额外解释其象征意义。
- source_word: וַתֵּלֶךְ הָלוֹךְ וְזָעָקָה
  choice: 一边走，一边放声哭喊
  rationale: 表达她持续前行并同时大声呼喊的过程；“放声哭喊”保留 זעק 的强烈程度，同时不限定为抗议、哀号或尖叫。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“一边走，一边放声哭喊”自然传达希伯来文持续进行的意味；不对她把手放在头上的动作作超出原文的解释。
