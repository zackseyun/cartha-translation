base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/025.yaml
  text: But the king said to Absalom, “No, my son, please let us not all go, lest we be a burden on you.” And he pressed him, but he was not willing to go; so he blessed him.
translation:
  language: zh_hans
  text: 王对押沙龙说：“不，我儿，我们不要全都去，免得成为你的重担。”押沙龙极力请求王，但王仍不肯去，就给他祝福。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַל־נָא נֵלֵךְ כֻּלָּנוּ
  choice: 我们不要全都去
  rationale: 保留否定请求和“全都”的范围；中文用自然的劝阻语气表达。
- source_word: וְלֹא נִכְבַּד עָלֶיךָ
  choice: 免得成为你的重担
  rationale: נכבד在此指使对方负担沉重；译文保留“重”的意象，也符合宴客语境。
- source_word: וַיִּפְרָץ בּוֹ
  choice: 押沙龙再三催请他
  rationale: 该表达表示强力、执意地催促或恳请；“再三催请”兼顾持续施压与请求语境。
- source_word: וַיְבָרֲכֵהוּ
  choice: 只为他祝福
  rationale: 直译祝福动作；“只”承接不肯同行后的替代举动，不额外限定祝福的形式或内容。
