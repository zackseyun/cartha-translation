review_pass:
  verdict: revise
  source_fidelity: 译文前半准确传达王拒绝全体赴宴，以免给押沙龙造成负担。后半的主语关系应明确：押沙龙极力请求王，王仍不愿前往，随后王祝福押沙龙。原译“只为他祝福”中的“只”并非希伯来文所表达，且会误示“祝福”是排他的替代行动。
  naturalness: 整体为自然、庄重的现代汉语。但连续使用“押沙龙……他……他”会使“他却不肯去”的所指短暂含混；直接说“王仍不肯去”更清楚。
  terminology: “我儿”“重担”“祝福”均符合本节叙事和常用圣经汉语语域。“极力请求”恰当表达 וַיִּפְרָץ בּוֹ 的强力恳请，不需添加请求的具体内容。
  issues:
