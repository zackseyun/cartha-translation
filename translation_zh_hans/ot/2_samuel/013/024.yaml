  source_fidelity: 草稿将“有剪羊毛的人／正在为仆人剪羊毛”（גֹזְזִים，复数分词）改成押沙龙本人“正要剪羊毛”，既弱化了复数施事者，也把原文所陈述的剪毛活动改成了将要发生的行动。宜按汉语习惯表达为“仆人那里正在剪羊毛”，保留活动正在进行及其属于押沙龙的语义。
  naturalness: “仆人那里正在剪羊毛”在现代标准汉语中自然，也适合宫廷叙事语境。“请王和王的臣仆与仆人同去”可理解，但“王和他的臣仆”指代更顺畅，同时仍保留原文对王的第三人称敬称及押沙龙的自称。
  terminology: “押沙龙”“王”“仆人”均合宜。“臣仆”可保留，用以区别王的随从与押沙龙自称的“仆人”；“他的”只作自然的领属指代，不改变原文。
