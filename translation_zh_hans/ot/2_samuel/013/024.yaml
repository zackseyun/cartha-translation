base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/024.yaml
  text: Then Absalom came to the king and said, “Look, your servant has shearers. Please let the king and his servants go with your servant.”
translation:
  language: zh_hans
  text: 押沙龙来到王面前，说：“你看，仆人那里正在剪羊毛。请王和他的臣仆与仆人同去。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה נָא
  choice: 你看
  rationale: הִנֵּה用于引起注意，נָא使语气较为缓和；现代汉语“你看”自然传达这一话语功能。
- source_word: גֹזְזִים לְעַבְדֶּךָ
  choice: 仆人正要剪羊毛
  rationale: גֹזְזִים字面为“剪毛的人/正在剪毛”，在上下文中指为押沙龙剪羊毛，也可涵盖剪羊毛的活动；汉语用“正要剪羊毛”表达即将举行此事，并保留其以“仆人”自称的谦敬语气。
- source_word: הַמֶּלֶךְ וַעֲבָדָיו
  choice: 王和王的臣仆
  rationale: 保留押沙龙对王的第三人称敬称，并以“臣仆”区分王的随从与押沙龙自称的“仆人”。
- source_word: עִם עַבְדֶּךָ
  choice: 与仆人同去
  rationale: 直译其陪同关系，同时保留宫廷语境中押沙龙对自己的谦称。
theological_decisions: []
