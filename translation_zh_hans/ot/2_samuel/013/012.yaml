base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/012.yaml
  text: She said to him[a], “No, my brother, do not violate me, for such a thing is not done in Israel[b]. Do not do this disgraceful thing.”
translation:
  language: zh_hans
  text: 她对他说：“不，哥哥！不要凌辱我[a]，因为在以色列，人不做这样的事。不要做这种可耻的恶行[b]！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“不要强暴我”或“不要羞辱我”。希伯来语动词在这里兼有性侵犯和使人蒙羞的意味。
    reason: lexical_alternative
  - marker: b
    text: 或译“这种无耻的恶行”。希伯来语所指的是道德上令人震惊、可耻的行为，并非一般的愚蠢之举。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר לוֹ
  choice: 她对他说
  rationale: 以自然的现代汉语承接叙事，同时保留说话对象。
- source_word: אַל אָחִי
  choice: 不行，我哥哥
  rationale: 第一个 אַל 是急切的否定呼喊，并非礼貌请求；“我哥哥”直译亲属称谓，凸显事件中的乱伦性质与她的恳求。
- source_word: אַל תְּעַנֵּנִי
  choice: 不要凌辱我
  rationale: ענה 的 Piel 在性暴力语境中兼有强暴、侵犯和使人受辱的含义；“凌辱”在中文中能保留性侵犯与羞辱的双重意味，而不把词义范围缩窄为单一法律术语。
- source_word: כִּי לֹא יֵעָשֶׂה כֵן בְּיִשְׂרָאֵל
  choice: 因为在以色列不该做这样的事
  rationale: 被动式表达共同体公认的道德禁忌；“不该做”比生硬的“没有人这样做”更自然，也不把这句话误解为单纯陈述实际习俗。
- source_word: אַל תַּעֲשֵׂה אֶת הַנְּבָלָה הַזֹּאת
  choice: 不要做这种丑事
  rationale: נְבָלָה 指严重违背道德和群体秩序的可耻恶行；现代汉语“丑事”简洁有力，并保留羞耻与道德丑恶的色彩，不采用容易显得过轻的“愚妄之事”。
