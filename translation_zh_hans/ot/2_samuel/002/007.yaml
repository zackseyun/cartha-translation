  text: וְ/עַתָּ֣ה תֶּחֱזַ֣קְנָה יְדֵי/כֶ֗ם וִֽ/הְיוּ֙ לִ/בְנֵי חַ֔יִל כִּי מֵ֖ת אֲדֹנֵי/כֶ֣ם שָׁא֑וּל וְ/גַם אֹתִ֗/י מָשְׁח֧וּ בֵית יְהוּדָ֛ה לְ/מֶ֖לֶךְ עֲלֵי/הֶֽם׀־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/007.yaml
  text: Let your hands be strong[a], and be valiant men, for your lord Saul is dead, and the house of Judah also has anointed me king over them.
translation:
  language: zh_hans
  text: 现在，你们的手要刚强[a]，要作勇士；因为你们的主扫罗死了，犹大家也膏立我作他们的王。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “手要刚强”是希伯来语习语，意思是刚强壮胆、勇于行动。
    reason: 解释保留在正文中的源语意象，避免读者按身体力量作狭义理解。
lexical_decisions:
- source_word: וְעַתָּה
  choice: 现在
  rationale: 原文明确含有时间兼话语承接语“现在”；这里标志扫罗已死之后，大卫向基列雅比人发出劝勉的新局面。
- source_word: תֶּחֱזַקְנָה יְדֵיכֶם
  choice: 你们的手要刚强
  rationale: 保留希伯来语以“手”表达力量、勇气和行动能力的具体意象；“要刚强”传达此处祈使性的劝勉语气。
- source_word: וִהְיוּ לִבְנֵי חַיִל
  choice: 要作勇士
  rationale: בְּנֵי־חַיִל 在此指勇敢而有能力的人，并带有军事语境；“勇士”简洁自然，也保留男性复数的语境特征。
- source_word: אֲדֹנֵיכֶם
  choice: 你们的主
  rationale: 这里是对扫罗作为他们君主的政治和尊敬称谓，并非指上帝；“你们的主”保留原文称谓的效忠意味。
- source_word: מָשְׁחוּ בֵית יְהוּדָה
  choice: 犹大家也膏立
  rationale: “犹大家”保留 בֵּית יְהוּדָה 的群体性表达；“膏立”准确表现借着膏抹正式委任为王的行动。“也”对应 וְגַם，并将扫罗已死与大卫已在犹大作王并列为劝勉的依据。
- source_word: לְמֶלֶךְ עֲלֵיהֶם
  choice: 作他们的王
  rationale: 自然表达大卫受膏所担任的身份，同时保留其治理犹大家的关系。
theological_decisions:
- issue: “勇士”是否保留男性含义
  choice: 要作勇士
  alternative: 要勇敢；要作英勇的人
  rationale: 原文使用阳性复数 בְּנֵי חַיִל，且语境涉及扫罗阵营中的男性军事群体；译作“勇士”既符合语境，也不把性别信息不必要地中性化。
- issue: אֲדֹנֵיכֶם 的称谓性质
  choice: 你们的主
  alternative: 你们的主人；你们的君王
  rationale: 此词在这里是对人间君主扫罗的尊称，不是神名，也不应赋予基督论含义；“主”最能保留称谓和政治效忠色彩。
- issue: 犹大家膏立大卫的表述
  choice: 犹大家也膏立我作他们的王
  alternative: 犹大家也已经膏我作他们的王
  rationale: “膏立”同时表达膏抹仪式与王权委任，不将经文扩展为关于王权来源或合法性的额外神学判断。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。正文保留“现在”“手要刚强”“犹大家”等源文特征；分号使劝勉与其后的两项理由层次清楚。
