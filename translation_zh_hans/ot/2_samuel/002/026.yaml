base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/026.yaml
  text: Then Abner called to Joab and said[a], “Must the sword devour forever? Do you not know that it will be bitter in the end? How long will it be before you tell the people to turn back from following their brothers?”
translation:
  language: zh_hans
  text: 押尼珥就呼喊约押说：“刀剑岂能永远吞噬下去？你难道不知道，结局必是苦涩的吗？你还要等到什么时候，才吩咐百姓回头，不再追赶自己的弟兄[a]？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“不再跟在自己的弟兄后面”。
    reason: מֵאַחֲרֵי 字面为“从……后面”，在战事语境中可理解为“追赶”，也可较直译为“跟在……后面”。
lexical_decisions:
- source_word: הֲלָנֶצַח
  choice: 岂可永远……下去吗
  rationale: 以反问句表达持续无尽之意；“永远……下去”符合现代汉语口吻，也保留原文的紧迫感。
- source_word: תֹּאכַל חֶרֶב
  choice: 刀剑……吞噬
  rationale: 保留原文以“刀剑”为主语、以“吃”为意象的拟人表达；“吞噬”在汉语中自然有力，且没有将比喻平化为“杀戮”。
- source_word: מָרָה תִהְיֶה בָּאַחֲרוֹנָה
  choice: 结局必是苦涩的
  rationale: “苦涩”保留 מָרָה 的比喻色彩，“结局”清楚表达 בָּאַחֲרוֹנָה 所指的最终后果。
- source_word: וְעַד מָתַי
  choice: 你还要等到什么时候，才
  rationale: 原文询问约押还要拖延多久；这一结构既自然，也体现催促意味。
- source_word: לֹא תֹאמַר לָעָם
  choice: 吩咐百姓
  rationale: אמר 在此引出要求百姓采取行动的话；“吩咐”符合军事场景，但不强化为更正式、更绝对的“命令”。
- source_word: לָשׁוּב מֵאַחֲרֵי
  choice: 回头，不再追赶
  rationale: “回头”对应 שׁוּב，“不再追赶”在战事语境中自然传达 מֵאַחֲרֵי 的含义，同时以脚注保留较贴近字面的另一理解。
- source_word: אֲחֵיהֶם
  choice: 自己的弟兄
  rationale: 保留“弟兄”这一亲属称谓，突出以色列同胞彼此争战的张力；“自己的”明确反身关系。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。三个反问连续推进，保留押尼珥呼吁停止同胞相残时的急迫语气；“刀剑吞噬”和“结局苦涩”均保留希伯来文的鲜明比喻。
