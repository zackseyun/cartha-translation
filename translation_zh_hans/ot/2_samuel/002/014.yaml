base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/014.yaml
  text: Then Abner said to Joab, “Please let the young men arise and compete before us.” And Joab said, “Let them arise.”
translation:
  language: zh_hans
  text: 押尼珥对约押说：“让这些年轻人起来，在我们面前较量吧。”约押说：“让他们起来吧。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַנְּעָרִים
  choice: 这些年轻人
  rationale: 该词可指年轻人、青年或随从；结合上下文双方战士出场对阵，译作“这些年轻人”既保留其基本含义，也不提前限定其身份。
- source_word: וִישַׂחֲקוּ
  choice: 较量
  rationale: שׂחק通常可指玩耍、嬉戏，也可在特定语境中指竞技或较量；随后发生致命搏斗，因此“较量”比“玩耍”更符合语境，同时保留开场措辞可能带有的轻描淡写。
- source_word: לְפָנֵינוּ
  choice: 在我们面前
  rationale: 直接表达双方领袖在场观看的空间关系。
- source_word: יָקוּמוּ נָא
  choice: 让……起来……吧
  rationale: נָא表达请求或劝请语气；用“吧”自然呈现，而不强化为命令。
