base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/023.yaml
  text: But he refused to turn aside[a], so Abner struck him in the belly with the butt end of the spear, and the spear came out behind him; and he fell there and died on the spot. And everyone who came to the place where Asahel had fallen and died stood still.
translation:
  language: zh_hans
  text: 但他不肯转开，于是押尼珥用枪尾刺进他的腹部[a]，枪从他背后穿了出来。他就倒在那里，当场死了。凡来到亚撒黑倒地而死之处的人，都站住了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “腹部”所译的希伯来语词含义不完全确定；一些较早的译本传统上译作“第五根肋骨”，这里可能泛指腹部一带。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמָאֵן לָסוּר
  choice: 他不肯转开
  rationale: מָאֵן表示拒绝或不愿，סוּר表示转开、离开原来的方向；结合追赶的语境，“不肯转开”既保留动作意象，也表达他不肯停止追赶。
- source_word: בְּאַחֲרֵי הַחֲנִית
  choice: 用枪尾
  rationale: 字面指枪的后部。现代汉语“枪尾”简洁自然，并与随后贯穿身体的叙述相符；不额外断定其具体构造。
- source_word: אֶל הַחֹמֶשׁ
  choice: 刺进他的腹部
  rationale: חֹמֶשׁ是含义不完全确定的身体部位词，在这些战斗叙事中较可能泛指腹部。“刺进”根据枪贯体而出的下文自然呈现动作，但不改变受击部位的不确定性，故以脚注说明传统译法。
- source_word: וַתֵּצֵא הַחֲנִית מֵאַחֲרָיו
  choice: 枪从他背后穿了出来
  rationale: 紧贴希伯来文“枪从他的后面出来”，并在汉语中清楚表达枪贯穿身体。
- source_word: וַיָּמָת תַּחְתָּו
  choice: 当场死了
  rationale: תַּחְתָּו字面有“在他所在之处”之意，此处是叙事习语，表示他就在倒下之处死去；“当场死了”自然传达即时性和原地死亡。
- source_word: וַיַּעֲמֹדוּ
  choice: 都站住了
  rationale: עמד在这里表示来到的人停步站住；“站住了”保留原文的具体动作，而不加入他们震惊或哀悼等未明说的心理解释。
theological_decisions: []
translation_notes:
  register: 采用庄重而清楚的现代叙事语言。“枪尾”比技术性较强且不常用的“枪鐏”更便于普通读者理解；保留原文简短、连续的动作节奏。脚注标记置于真正涉及词义疑难的“腹部”之后。
