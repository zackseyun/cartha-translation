base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/022.yaml
  text: Abner said again to Asahel[a], “Turn aside from following me. Why should I strike you to the ground? Then how could I lift up my face to Joab your brother?”
translation:
  language: zh_hans
  text: 押尼珥又对亚撒黑说：“你转开吧，不要再追赶我。我何必把你击倒在地呢？那样，我怎能抬起脸来见你兄弟约押呢？[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “抬起脸来见”是希伯来语的形象说法，也可译作“有脸见”。
    reason: 说明原文“抬起脸”的字面形象及其指无愧于面对某人的语用含义。
lexical_decisions:
- source_word: וַיֹּסֶף עוֹד ... לֵאמֹר
  choice: 又……说
  rationale: 这个结构表示押尼珥再次开口说话；“又……说”自然地保留了重复之意。
- source_word: סוּר לְךָ מֵאַחֲרָי
  choice: 你转开吧，不要再追赶我
  rationale: סוּר 表示“转开、离开”，מֵאַחֲרָי 字面为“从我后面”，在语境中指不再跟随或追赶；译文兼顾动作画面和当前追逐场景。
- source_word: לָמָּה אַכֶּכָּה אַרְצָה
  choice: 我何必把你击倒在地呢
  rationale: נכה 表示击打或击倒，אַרְצָה 表示“到地上”；不直接译为“杀死”，以免超出原文明确措辞，同时保留致命威胁。
- source_word: וְאֵיךְ אֶשָּׂא פָנַי
  choice: 那样，我怎么能抬起脸来面对
  rationale: 保留“抬起脸”的希伯来语形象，同时用“面对”使现代汉语读者容易理解其含义。
- source_word: אֶל יוֹאָב אָחִיךָ
  choice: 你哥哥约押
  rationale: אָחִיךָ 是“你的兄弟”；根据叙事人物关系，现代汉语用“你哥哥”表达自然且准确。
- source_word: אַבְנֵר / עֲשָׂהאֵל / יוֹאָב
  choice: 押尼珥／亚撒黑／约押
  rationale: 采用现代简体中文圣经人名的通行译法。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。保留连续反问的紧张语气，以及“击倒在地”“抬起脸来”的具体形象；不把击打明确解释为杀死。
