base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/010.yaml
  text: Ish-bosheth son of Saul was forty years old when he began to reign over Israel[a], and he reigned two years[c][b]. But the house of Judah followed David.
translation:
  language: zh_hans
  text: 扫罗的儿子伊施波设[a]登基作以色列王时四十岁；他作王两年。但犹大家[b]跟随大卫[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 马所拉文本此处作“伊施波设”；相关传统中另见“以实巴力”（Eshbaal）这一名称形式。
    reason: alternative_reading
  - marker: b
    text: 原文直译为“犹大家”，是指犹大这一支派或政治群体的集体说法。
    reason: lexical_alternative
  - marker: c
    text: 或译“拥护大卫”“效忠于大卫”。原文“在大卫之后”是表示归属和支持的惯用语。
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אַרְבָּעִים שָׁנָה
  choice: 四十岁
  rationale: 这是希伯来语表达年龄的惯用说法；按现代汉语自然表达为“四十岁”。
- source_word: אִישׁ בֹּשֶׁת
  choice: 伊施波设
  rationale: 马所拉文本此处所载人名为 Ish-bosheth，采用与其读音相应且通行的中文译名；相关传统中的另一名称形式另见脚注。
- source_word: בְּמָלְכוֹ עַל יִשְׂרָאֵל
  choice: 登基作以色列王时
  rationale: 介词结构说明年龄所对应的登基时间；“作以色列王”自然表达君王治理百姓的含义。
- source_word: וּשְׁתַּיִם שָׁנִים מָלָךְ
  choice: 他作王两年
  rationale: 保留原文简洁的在位年数公式，并符合现代汉语叙事习惯。
- source_word: אַךְ
  choice: 但
  rationale: 此词在这里表示以色列受伊施波设统治与犹大归随大卫之间的对比。
- source_word: בֵּית יְהוּדָה
  choice: 犹大家
  rationale: 保留“犹大之家”的群体性表达，所指是作为宗族、支派或政治群体的犹大。
- source_word: הָיוּ אַחֲרֵי דָוִד
  choice: 跟随大卫
  rationale: 原文直译为“在大卫之后”，在此是表示拥护、归顺的惯用语；“跟随”既自然，也保留原有意象。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而清楚的叙事语体。“登基作以色列王”自然呈现希伯来语的登基时间结构；“犹大家”保留原文的群体性称谓，并以脚注说明；“跟随大卫”保留政治归属用语中的原有意象，避免把含义限定得过窄。
