  yaml_path: translation/ot/2_samuel/002/017.yaml
  text: The battle was very fierce that day[b][a], and Abner and the men of Israel were defeated before the servants of David.
translation:
  language: zh_hans
  text: 那一天，战事极其激烈[a]；押尼珥和以色列人败在大卫的臣仆[b]面前。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“那一天战事极其严酷。”
    reason: lexical_alternative
  - marker: b
    text: “臣仆”原文指服事大卫的人；这里是指大卫一方的军兵或随从。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמִּלְחָמָה
  choice: 战事
  rationale: 此处指当日具体发生的交战；“战事”既符合叙事语境，也比“战争”更能指向这场战斗。
- source_word: קָשָׁה עַד מְאֹד
  choice: 极其激烈
  rationale: קָשָׁה本义为“艰难、严酷”，用于战事时表达战斗猛烈；“极其”体现עַד מְאֹד的强化语气。
- source_word: בַּיּוֹם הַהוּא
  choice: 那一天
  rationale: 自然、直接地保留原文的时间指示。
- source_word: וַיִּנָּגֶף
  choice: 败在……面前
  rationale: נָגַף的Nifal形在军事语境中表示被击败；此译法也保留לִפְנֵי所构成的希伯来语军事表达。
- source_word: אַבְנֵר
  choice: 押尼珥
  rationale: 采用现代中文圣经中通行且易于辨识的人名译法。
- source_word: וְאַנְשֵׁי יִשְׂרָאֵל
  choice: 和以色列人
  rationale: 原文直译为“以色列的男人/人众”，上下文明确指随押尼珥作战的一方；“以色列人”自然简洁，不额外加入原文没有的“士兵”。
- source_word: עַבְדֵי דָוִד
  choice: 大卫的臣仆
  rationale: עֶבֶד指服事或隶属于大卫的人，在本段兼有政治与军事身份；“臣仆”保留从属关系，同时避免现代“仆人”仅指家务佣人的误解。
