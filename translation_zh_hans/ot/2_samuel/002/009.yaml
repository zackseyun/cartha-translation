base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/009.yaml
  text: and made him king over Gilead[a], over the Ashurites, over Jezreel, over Ephraim, over Benjamin, and over all Israel.
translation:
  language: zh_hans
  text: 立他作王，统治基列、亚书利人[a]、耶斯列、以法莲、便雅悯和全以色列。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文作“亚书利人”。有些人认为这里是指“亚设”，即亚设支派或亚设地区。
    reason: 原文 הָאֲשׁוּרִי 含义有争议；正文依马所拉文本的读音作音译，脚注保留另一种常见理解。
lexical_decisions:
- source_word: וַיַּמְלִכֵהוּ
  choice: 立他作王
  rationale: מלך 的使役式带第三人称阳性单数宾语后缀，表示“使他作王、立他为王”；“立他作王”自然且保留使役意义。
- source_word: אֶל / עַל
  choice: 统治
  rationale: 这些介词与“立为王”及地域、族群并用，表达其王权所及的范围；汉语用“统治”统领后列各对象，简洁自然。
- source_word: הַגִּלְעָד
  choice: 基列
  rationale: 采用现代中文圣经地名的通行译名。
- source_word: הָאֲשׁוּרִי
  choice: 亚述人
  rationale: 马所拉文本的读音指向带冠词的族称单数，可作集合意义理解为“亚述人”；原文存在疑难，可能指“亚设”，故将该理解保留于脚注。
- source_word: יִזְרְעֶאל
  choice: 耶斯列
  rationale: 采用现代中文圣经地名的通行译名。
- source_word: אֶפְרַיִם
  choice: 以法莲
  rationale: 采用现代中文圣经支派名的通行译名。
- source_word: בִּנְיָמִן
  choice: 便雅悯
  rationale: 采用现代中文圣经支派名的通行译名。
- source_word: יִשְׂרָאֵל כֻּלֹּה
  choice: 全以色列
  rationale: כֻּלֹּה 强调整体范围；“全以色列”简洁地保留这一强调。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而清晰的叙事语言。“立他作王，统治……”避免逐字重复介词，同时准确表达其王权所及范围；正文保留疑难族称“亚述人”，不在正文中擅自校改为“亚设”。
