- from: 立他作王，统治基列、亚述人[a]、耶斯列、以法莲、便雅悯和全以色列。
  to: 立他作王，统治基列、亚书利人[a]、耶斯列、以法莲、便雅悯和全以色列。
  rationale: 仅将“亚述人”改为“亚书利人”，以避免现代中文中“亚述”对 Assyria 的固定历史联想，并保留马所拉文本该疑难族称的形式与不确定性。其余译文忠实、自然，无须改动。
