base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/003.yaml
  text: And David brought up the men who were with him[a], each man with his household, and they settled in the towns of Hebron.
translation:
  language: zh_hans
  text: 大卫也把跟他在一起的人带上去，连同各人的家眷；他们就住在希伯仑的各城镇里[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“希伯仑一带的城邑中。”原文可能指属于希伯仑地区的各处聚落，而不只是希伯仑这一座城的中心城区。
    reason: 说明“希伯仑的各城镇”可能是地区性表述，并保留עָרֵי可译作“城邑”的词义选择。
lexical_decisions:
- source_word: וַאֲנָשָׁיו אֲשֶׁר עִמּוֹ
  choice: 跟他在一起的人
  rationale: 直译这一群与大卫同行的人，同时避免仅译作“人”而失去他们与大卫的关系。中文在此不必重复所有格；关系从“跟他在一起”已经清楚可见。
- source_word: הֶעֱלָה
  choice: 带了上去
  rationale: 使役形表达“使……上去、带上去”；此处前往位于山地的希伯仑，“上去”保留了原文的方向和地势意味。
- source_word: אִישׁ וּבֵיתוֹ
  choice: 各人都带着自己的家眷
  rationale: אִישׁ在这里具有逐一分配的作用；בֵּיתוֹ指每人的家庭或家户成员，而非房屋建筑，因此译作“家眷”自然且准确。
- source_word: וַיֵּשְׁבוּ
  choice: 他们就住在
  rationale: ישׁב在迁居语境中指居住、定居；“住在”是自然的现代汉语，也不额外限定停留时间。
- source_word: בְּעָרֵי חֶבְרוֹן
  choice: 在希伯仑的各城镇里
  rationale: עָרֵי是复数，可指城市或较小的城镇；“各城镇”适合现代汉语，并保留这些聚落与希伯仑之间关系的概括性。
- source_word: חֶבְרוֹן
  choice: 希伯仑
  rationale: 采用该地名在现代中文圣经传统中的通行音译。
