base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/004.yaml
  text: Then the men of Judah came[a], and there they anointed David king over the house of Judah. And they told David, saying, "The men of Jabesh-gilead were the ones who buried Saul."
translation:
  language: zh_hans
  text: 犹大人来了，就在那里膏立大卫作犹大家的王。他们告诉大卫说：“埋葬扫罗的是基列雅比人[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“基列雅比人埋葬了扫罗。”
    reason: 原文的关系从句既可带有辨认、强调意味，也可较简单地陈述谁埋葬了扫罗。
lexical_decisions:
- source_word: וַיָּבֹאוּ אַנְשֵׁי יְהוּדָה
  choice: 犹大人来了
  rationale: בוא在此叙述抵达；“来了”自然简洁。אַנְשֵׁי明确指人群中的男子或男性代表，汉语“犹大人”既不生硬强调性别，也没有把他们改释为首领或全民。
- source_word: וַיִּמְשְׁחוּ שָׁם אֶת־דָּוִד לְמֶלֶךְ
  choice: 就在那里膏立大卫作……王
  rationale: “膏立”保留משׁח在君王登位语境中的实际动作及政治、神学意味；“作……王”自然表达לְמֶלֶךְ的任命含义。
- source_word: עַל־בֵּית יְהוּדָה
  choice: 作犹大家的王
  rationale: “犹大家”保留בֵּית的群体与支派共同体意象，没有将其简化成纯地域性的“犹大”，也避免具体化为原文未明说的现代政治实体。
- source_word: וַיַּגִּדוּ לְדָוִד לֵאמֹר
  choice: 他们告诉大卫说
  rationale: 保留נגד使役式的“告诉、报告”含义以及לֵאמֹר引出话语的结构；现代汉语中清楚而庄重。
- source_word: אַנְשֵׁי יָבֵישׁ גִּלְעָד
  choice: 基列雅比人
  rationale: 采用通行的中文地名形式“基列雅比”，并以“人”自然表达该城的男性居民或代表；不擅自改为“领袖”。
- source_word: אֲשֶׁר קָבְרוּ אֶת־שָׁאוּל
  choice: 埋葬扫罗的是……
  rationale: 倒装判断句较自然地体现报告中的辨认或强调力量，同时以脚注保留也可按普通关系从句理解的可能。
theological_decisions:
- issue: אַנְשֵׁי的性别与群体范围
  choice: 译作“犹大人”和“基列雅比人”
  alternative: “犹大的男子”“基列雅比的男子”或“犹大众人”
  rationale: 原词为阳性复数“人、男人”，但现代汉语地名或族名加“人”通常可指相关男性群体而不必生硬重复“男子”。译文不将其扩大为抽象全民，也不将其限定为原文未明说的长老或战士。
- issue: בֵּית יְהוּדָה的共同体意象
  choice: 保留为“犹大家”
  alternative: “犹大”“犹大支派”
  rationale: “家”保留原文的家室、群体意象，也维持其可能兼有支派和政治共同体含义的张力。
- issue: 末句关系从句是否具有辨认强调
  choice: 正文译为“埋葬扫罗的是基列雅比人”
  alternative: “基列雅比人埋葬了扫罗”
  rationale: 希伯来文אֲשֶׁר קָבְרוּ可作为普通关系从句，也可能在报告中起辨认作用。正文呈现后者，脚注明示较简单的理解，避免把句法语用上的余地完全抹平。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“膏立”保留王权语境中的传统核心术语；“犹大家”有意保存原文共同体意象。地名采用中文圣经传统中通行的“基列雅比”，不额外补入本节未出现的地点信息。
