  text: Abner turned behind him and said[a], “Are you Asahel?” And he said, “I am.”
translation:
  language: zh_hans
  text: 押尼珥转过身来，说：“你是亚撒黑吗？”他回答：“是我。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּפֶן
  choice: 转身
  rationale: פנה的基本义是“转、转向”；在追赶场景中，“转身”自然简洁，又不把动作缩窄为仅仅“回头看”。
- source_word: אַחֲרָיו
  choice: 向后看
  rationale: 该表达指向押尼珥身后。与“转身”连用时译作“向后看”，既交代空间方向，也符合现代汉语表达。
- source_word: הֲאַתָּה זֶה
  choice: 你是……吗
  rationale: 这是用于确认对方身份的问句。希伯来语中的指示成分在汉语里不必机械译出；“你是亚撒黑吗”自然地保留了身份确认的语气。
- source_word: עֲשָׂהאֵל
  choice: 亚撒黑
  rationale: 采用现代中文圣经中通行的人名音译。
- source_word: אָנֹכִי
  choice: 是我
  rationale: 独立人称代词在此构成完整的身份确认答语；“是我”比单译“我”更自然，也准确传达其省略式语力。
