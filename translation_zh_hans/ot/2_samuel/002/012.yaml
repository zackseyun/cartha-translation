base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/012.yaml
  text: Then Abner son of Ner[a], and the servants of Ish-bosheth son of Saul, went out from Mahanaim to Gibeon.
translation:
  language: zh_hans
  text: 尼珥的儿子押尼珥和扫罗的儿子伊施波设[a]的臣仆，从玛哈念出发，前往基遍。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节希伯来文本作“伊施波设”；同一人在《历代志上》8:33和9:39称为“伊施巴力”。
    reason: 说明同一人物在本节与《历代志上》中的不同名字形式，并将脚注明确锚定于“伊施波设”。
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: 出发
  rationale: 该叙事动词推动情节发展；虽然希伯来语动词为单数，但其后是由押尼珥与众臣仆组成的并列主语，现代汉语无需标示数。“出发”自然表达从一地前往另一地。
- source_word: אַבְנֵר בֶּן נֵר
  choice: 尼珥的儿子押尼珥
  rationale: 按现代汉语圣经人名音译惯例处理，并以自然的汉语次序表达父子关系。
- source_word: וְעַבְדֵי
  choice: 和……的臣仆
  rationale: עֶבֶד可指仆人、臣属或侍从；本段处于军事政治语境，“臣仆”既保留其隶属关系，也不把具体军阶说得过死。
- source_word: אִישׁ בֹּשֶׁת
  choice: 伊施波设
  rationale: 马所拉文本本节明确作אִישׁ בֹּשֶׁת，采用相应音译，不以《历代志》的异名取代正文。
- source_word: בֶּן שָׁאוּל
  choice: 扫罗的儿子
  rationale: 直接表达谱系身份，说明伊施波设是扫罗之子。
- source_word: מִמַּחֲנַיִם
  choice: 从玛哈念
  rationale: 前缀מִן表示起点“从”；地名按通行形式音译为“玛哈念”。
- source_word: גִּבְעֹנָה
  choice: 前往基遍
  rationale: 地名后的方向词尾־ָה表示朝向该地；“前往基遍”在现代汉语中自然，并保留移动的目的方向。
theological_decisions:
- issue: 伊施波设的名字与《历代志》中“伊施巴力”的关系
  choice: 正文依WLC保留“伊施波设”，脚注说明异名
  alternative: 正文采用“伊施巴力”
  rationale: 本节马所拉文本读作אִישׁ בֹּשֶׁת，而《历代志上》8:33、9:39保存同一人的另一名字形式；不在正文中调和两种传统。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。句首先陈列并列主语，再交代起点和目的地；以“臣仆”体现政治军事语境中的隶属关系，同时避免过度具体化。脚注标记置于整句末，所注内容明确对应正文中的“伊施波设”。
