base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/025.yaml
  text: Then the sons of Benjamin gathered together behind Abner[a], became one band[b], and took their stand on the top of one hill.
translation:
  language: zh_hans
  text: 便雅悯人聚集在押尼珥身后[a]，合成一队[b]，站在一座山冈的山顶上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“跟随押尼珥”。希伯来语既可指空间上在他身后，也可指跟随他。
    reason: lexical_alternative
  - marker: b
    text: 或译“一群”或“一队人”。这里的希伯来词指联合在一起的一个群体。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְקַבְּצוּ
  choice: 聚集
  rationale: 该词为קבץ的Hitpael形式，表达众人聚到一起；“聚集”自然简洁，符合战事中重新集结的语境。
- source_word: בְנֵי בִנְיָמִן
  choice: 便雅悯人
  rationale: 希伯来文直译为“便雅悯之子”，在此指便雅悯支派的人；现代汉语用“便雅悯人”更自然清楚，也不损失群体身份。
- source_word: אַחֲרֵי אַבְנֵר
  choice: 到押尼珥身后
  rationale: אַחֲרֵי既可表示空间上的“在……后面”，也可表示跟随或归附；正文保留“身后”的空间意象，同时在脚注说明另一可能。
- source_word: לַאֲגֻדָּה אֶחָת
  choice: 结成一队
  rationale: אֲגֻדָּה表示联合起来的一群或一队；“结成一队”既体现合为一个整体，也切合军事场景。
- source_word: וַיַּעַמְדוּ
  choice: 站在
  rationale: עמד基本义为“站立、站住”；在战斗叙事中含据守阵地之意，但正文采用简明的“站在”，避免加入原文未明说的战术解释。
- source_word: עַל רֹאשׁ גִּבְעָה אֶחָת
  choice: 在一座山冈顶上
  rationale: רֹאשׁ在地形表达中指顶部；גִּבְעָה是山冈或小山。“一座山冈顶上”自然地保留了原文的地形及数词“一”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“便雅悯人”比直译“便雅悯之子”更符合现代汉语；以“山冈”表达גִּבְעָה，并保留原文两处“一”的聚合与地形信息。
