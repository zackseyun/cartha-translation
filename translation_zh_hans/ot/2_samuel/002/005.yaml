revisions:
- from: 大卫派使者到基列的雅比人那里，对他们说：“你们是蒙雅威[a]赐福的，因为你们如此忠厚地[b]对待你们的主扫罗，埋葬了他。”
  to: 大卫派使者到基列雅比的男子那里，对他们说：“愿你们蒙雅威[a]赐福，因为你们向你们的主扫罗所施的这份恩慈[b]，就是把他安葬了。”
  rationale: 修订保留祝福公式的祈愿语气，以“蒙雅威赐福”自然表达雅威是赐福者；将“忠厚地对待”改为“所施的这份恩慈”，对应原文名词短语；并以“就是把他安葬了”清晰呈现大卫所称许的具体行动。地名改为固定合称“基列雅比”，同时保留原文“男子”的指称。
