  - severity: medium
    issue: 安葬扫罗与所行恩慈之间的关系在草稿中不够清楚。
    rationale: 原文以“施行这份恩慈……并安葬他”称许同一事件中的作为；汉语可用“就是把他安葬了”自然地表明安葬是该恩慈的具体内容，而不添加动机。
  - severity: low
    issue: 地名“基列的雅比”不如“基列雅比”稳定。
    rationale: יַבֵישׁ גִּלְעָד 是固定地名 Jabesh-gilead；“基列雅比”是较通行、辨识度更高的中文处理。
  - severity: low
