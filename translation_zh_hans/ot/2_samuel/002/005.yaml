base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/005.yaml
  text: Then David sent messengers to the men of Jabesh-gilead and said to them[a], “Blessed are you by Yahweh, because you have shown this kindness to your lord, to Saul[b], and have buried him.”
translation:
  language: zh_hans
  text: 大卫派使者到基列雅比的男子那里，对他们说：“愿你们蒙雅威[a]赐福，因为你们向你们的主扫罗所施的这份恩慈[b]，就是把他安葬了。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威”是希伯来文神名 יהוה 的拟音；中文传统译本常译作“耶和华”。
    reason: 说明正文采用“雅威”音译，并提供常见的中文传统译名。
  - marker: b
    text: 原文词语可表示恩慈、忠诚或信实的爱；这里指他们安葬扫罗所显出的忠诚善行。
    reason: 保留 חֶסֶד 的语义范围，并按上下文说明其具体所指。
lexical_decisions:
- source_word: מַלְאָכִים
  choice: 使者
  rationale: 这里指大卫派出的人员，并非天使；“使者”准确而自然。
- source_word: אַנְשֵׁי יָבֵישׁ גִּלְעָד
  choice: 基列的雅比人
  rationale: 原文直译为“基列雅比的男人们”；上下文所指是该城参与此事的人，用“雅比人”符合现代汉语地名表达，也没有不必要地扩大为所有居民。
- source_word: בְּרֻכִים אַתֶּם לַיהוָה
  choice: 你们是蒙雅威赐福的
  rationale: 保留被动分词的陈述语气，不改写成单纯的祝愿；汉语“蒙……赐福”自然表达雅威为赐福者。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按较常见的学术拟音直接呈现四字神名，而不以“主”这一称号替代。
- source_word: הַחֶסֶד הַזֶּה
  choice: 如此忠厚地
  rationale: 此处指雅比人冒险安葬扫罗这一具体的忠诚善举；“忠厚地对待”兼顾仁厚与忠诚的语义，脚注保留该词较宽的意义范围。
- source_word: אֲדֹנֵיכֶם עִם שָׁאוּל
  choice: 对待你们的主扫罗
  rationale: 扫罗是“你们的主”的同位说明；合并为自然汉语，保留其统治者和尊称含义。
- source_word: וַתִּקְבְּרוּ אֹתוֹ
  choice: 埋葬了他
  rationale: 简洁表达已经完成、正受大卫称许的行动。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。正文用“雅威”呈现其专名性质；脚注说明中文传统译名，避免把专名无声地改成称号。
- issue: חֶסֶד 在本节的含义
  choice: 忠厚地对待
  alternative: 施恩；以忠爱相待；尽忠义
  rationale: 这里既有安葬死者的仁厚，也有臣民对扫罗的忠诚。译文不把该词限定成抽象的“爱”或专门的圣约术语。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“你们是蒙……赐福的”保留原文陈述式祝福公式；“基列的雅比人”避免生硬音译复合地名；全句维持叙事简洁，不添加原文没有的因果或动机。
