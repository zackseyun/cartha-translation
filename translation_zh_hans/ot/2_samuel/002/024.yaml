base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/024.yaml
  text: Joab and Abishai pursued Abner[a], and the sun went down; and they came as far as the hill of Ammah[b], which is opposite Giah on the way to the wilderness of Gibeon.
translation:
  language: zh_hans
  text: 约押和亚比筛追赶押尼珥。太阳下山了；他们来到亚玛山，这山在基亚对面[a]，位于通往基遍旷野的路上[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这山在基亚前面。”希伯来语这一表达既可指在某地前方，也可指在其对面。
    reason: lexical_alternative
  - marker: b
    text: 或译：“沿着通往基遍旷野的路。”希伯来语可能着重指出所走的路线，而不只是方向。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְדְּפוּ ... אַחֲרֵי
  choice: 追赶
  rationale: רדף 在军事叙事中表示带有敌意的追逐；“追赶”自然、准确，也保留行动的紧迫感。
- source_word: וְהַשֶּׁמֶשׁ בָּאָה
  choice: 太阳下山了
  rationale: 希伯来语字面为“太阳来了”，是表示日落的惯用语；译作“太阳下山了”符合现代汉语表达。
- source_word: וְהֵמָּה בָּאוּ עַד
  choice: 他们来到
  rationale: עַד 在地点前表示行动所达到的范围或终点；汉语“来到”已自然表达抵达该处，无须机械译出“直到”。
- source_word: גִּבְעַת אַמָּה
  choice: 亚玛山
  rationale: 这是由普通名词“山丘”和专名构成的地名结构；按现代汉语地名习惯译为“亚玛山”。
- source_word: אֲשֶׁר עַל־פְּנֵי גִיחַ
  choice: 这山在基亚对面
  rationale: עַל־פְּנֵי 可表示处在某地前方或对面；正文采用较自然的地理表述“对面”，并以脚注保留另一可能。
- source_word: דֶּרֶךְ מִדְבַּר גִּבְעוֹן
  choice: 位于通往基遍旷野的路上
  rationale: דֶּרֶךְ 可指道路、路线或方向；此处理解为通往与基遍相关之旷野的路线，既符合句法，也适合现代汉语。
- source_word: יוֹאָב / אֲבִישַׁי / אַבְנֵר / אַמָּה / גִּיחַ / גִּבְעוֹן
  choice: 约押／亚比筛／押尼珥／亚玛／基亚／基遍
  rationale: 采用简体中文圣经语境中通行且易于辨认的人名、地名译法。
