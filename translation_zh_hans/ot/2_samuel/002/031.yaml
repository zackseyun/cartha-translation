  yaml_path: translation/ot/2_samuel/002/031.yaml
  text: But David’s servants struck down three hundred and sixty men from Benjamin and from Abner’s men[a].
translation:
  language: zh_hans
  text: 不过，大卫的部下击杀了便雅悯人和押尼珥的部下，共三百六十人。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“大卫的部下击杀了……”。希伯来语句首的连接词也可单纯译作“和”或不译；正文用“不过”，以表达本节伤亡数字与上一节的对照。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/עַבְדֵי דָוִד
  choice: 不过，大卫的部下
  rationale: 句首 וְ 可作一般承接，也可按上下文表达转折；本节与上一节大卫一方的伤亡数字形成对照，因此正文用“不过”。עֲבָדִים 在这里指追随大卫并参战的人，用“部下”比“仆人”更符合军事语境。
- source_word: הִכּוּ
  choice: 击杀了
  rationale: נכה 在战争语境中可指击倒、杀死；后面的 מֵתוּ 明说这些人死亡，因此“击杀”自然地表达动作及其致死结果。
- source_word: מִ/בִּנְיָמִן
  choice: 便雅悯人
  rationale: 介词 מִן 表示死者出自便雅悯支派；汉语用“便雅悯人”自然表达这一群体归属。
- source_word: וּ/בְ/אַנְשֵׁי אַבְנֵר
  choice: 和押尼珥的部下
  rationale: אַנְשֵׁי 在本段战争语境中指押尼珥手下的战士；译作“部下”既自然，也避免仅用“人”造成关系含混。
- source_word: שְׁלֹשׁ מֵאוֹת וְ/שִׁשִּׁים אִישׁ מֵתוּ
  choice: 共三百六十人
  rationale: 数字直译为“三百六十人”；“共”清楚表明这是前述群体的合计。死亡含义已由“击杀”表达，避免汉语中重复说“击杀……死了”。
theological_decisions: []
