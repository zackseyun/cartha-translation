base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/030.yaml
  text: And Joab returned from pursuing Abner[a], and he gathered all the people. When they were counted, nineteen men of David’s servants were missing, besides Asahel.
translation:
  language: zh_hans
  text: 约押停止追赶押尼珥，回来召集众人。清点时，发现大卫的仆从少了十九人，另有亚撒黑[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译：“十九人和亚撒黑。”这里的措辞表明，亚撒黑是在十九人之外另计的。
    reason: 说明原文的并列结构及人数计算方式。
lexical_decisions:
- source_word: שָׁב מֵאַחֲרֵי אַבְנֵר
  choice: 停止追赶押尼珥，回来
  rationale: שׁוב表示“返回”，מֵאַחֲרֵי在此军事语境中表示从追赶某人的行动中返回；这样的译法既交代停止追赶，也符合现代汉语叙事顺序。
- source_word: וַיִּקְבֹּץ אֶת כָּל הָעָם
  choice: 召集众人
  rationale: עָם字面为“人民、众人”，在本段特指约押统率的作战人员；“众人”保留原词的宽度，并由战事语境限定所指。
- source_word: וַיִּפָּקְדוּ
  choice: 清点时，发现……少了
  rationale: פקד的尼法勒式在此指接受清点或点名；下文列出缺少的人数，因此用“清点时，发现……少了”自然呈现隐含结果。
- source_word: מֵעַבְדֵי דָוִד
  choice: 大卫的仆从
  rationale: עֲבָדִים可指仆人、臣属或效力于领袖的人；“仆从”既贴近词义，也适合此处的王室军事背景。
- source_word: תִּשְׁעָה עָשָׂר אִישׁ וַעֲשָׂה אֵל
  choice: 十九人，另有亚撒黑
  rationale: 希伯来文直列“十九人和亚撒黑”，语境表明亚撒黑是在十九人之外另计的一名阵亡者；“另有”清楚表达这种相加关系。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“仆从”保留臣属关系，“众人”避免把原文עָם过度限定为专门军事术语。脚注标记置于其实际说明的伤亡人数短语之后。
