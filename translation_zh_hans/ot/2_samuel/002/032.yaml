base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/032.yaml
  text: They carried Asahel and buried him in his father's tomb[a], which was at Bethlehem. Then Joab and his men traveled all night[b], and daybreak came upon them at Hebron.
translation:
  language: zh_hans
  text: 他们抬走亚撒黑，把他安葬在他父亲的坟墓[a]里；那坟墓在伯利恒。约押和他的人走了一整夜[b]，到希伯仑时，天亮了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“墓穴”。希伯来语“קֶבֶר”可指坟墓、墓穴，或家族墓地。
    reason: lexical_alternative
  - marker: b
    text: 原文“对他们变亮了”，是指天破晓了；也可译为“他们在希伯仑时，天破晓了”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂאוּ
  choice: 他们抬走
  rationale: נשא在这里指众人抬运亚撒黑的遗体去安葬。“抬走”自然明确，也保留了由多人搬运的叙事画面。
- source_word: עֲשָׂהאֵל
  choice: 亚撒黑
  rationale: 采用现代中文圣经中常见的人名音译。
- source_word: וַיִּקְבְּרֻהוּ
  choice: 把他安葬
  rationale: קבר是普通的“埋葬”动词；“安葬”符合中文丧葬语境，庄重而自然。
- source_word: בְּקֶבֶר אָבִיו
  choice: 在他父亲的坟墓里
  rationale: קֶבֶר既可指坟墓，也可指墓穴或家族墓地；正文采用自然且不过度限定形制的“坟墓”，脚注保留“墓穴”的可能。
- source_word: אֲשֶׁר בֵּית לָחֶם
  choice: 那坟墓在伯利恒
  rationale: 希伯来语关系从句省略系词；中文补出“在”，并明确先行词，使表达清楚顺畅。
- source_word: וַיֵּלְכוּ כָל הַלַּיְלָה
  choice: 走了一整夜
  rationale: הלך含义宽泛，可指走、行进；“走了一整夜”保留原文的一般用词，不额外指定为正式行军。
- source_word: יוֹאָב וַאֲנָשָׁיו
  choice: 约押和跟随他的人
  rationale: אֲנָשָׁיו直译为“他的人”；中文“跟随他的人”较自然，也不把他们过度限定为士兵。
- source_word: וַיֵּאֹר לָהֶם
  choice: 天亮了
  rationale: 该希伯来语习语直义为“对他们变亮了”，在此表示破晓；中文以“天亮了”自然传达其意义，脚注保留原文形象。
- source_word: בְּחֶבְרוֹן
  choice: 到希伯仑时
  rationale: בְ标示地点；结合彻夜行进的上下文，译成“到希伯仑时”自然表达他们抵达该地时破晓，但不主张介词本身含有方向意义。
