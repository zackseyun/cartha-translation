base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/015.yaml
  text: 'So they arose and crossed over by number: twelve for Benjamin and for Ish-bosheth the son of Saul[d][c][b][a], and twelve from the servants of David.'
translation:
  language: zh_hans
  text: 于是，他们起来，按数目过去：便雅悯和扫罗的儿子伊施波设[d]一方十二人[a][b]，大卫的仆从中也有十二人[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “过去”也可译作“越过”或“走过去”。希伯来语动词可表示越过或进入指定地点。
    reason: lexical_alternative
  - marker: b
    text: “便雅悯和……伊施波设一方”也可译作“从便雅悯和……伊施波设而来”。这里的希伯来语介词既可表示来源，也可表示归属；本处较可能指他们代表便雅悯和伊施波设一方。
    reason: lexical_alternative
  - marker: c
    text: “大卫的仆从中”也可译作“大卫的臣仆中”，或按语境意译为“大卫的部下中”。
    reason: lexical_alternative
  - marker: d
    text: 希伯来语作“伊施波设”；旧约相关传统中另见“伊施巴力”这一相关形式。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּקֻמוּ
  choice: 他们起身
  rationale: קום的Qal叙事形式表示下一步行动；“起身”自然保留希伯来叙事推进感。
- source_word: וַיַּעַבְרוּ
  choice: 上前
  rationale: עבר可指越过、走过或前往指定地点。上下文是双方选出的人进入较量场地，“上前”在现代汉语中自然，同时不武断指定他们越过何种地理界线。
- source_word: בְמִסְפָּר
  choice: 按数目
  rationale: 表示双方经过点数、人数相等；保留原文略带形式化的计数表达。
- source_word: שְׁנֵים עָשָׂר
  choice: 十二人
  rationale: 原文直译为“十二”，汉语补出量词“人”以明确所数的是参战者。
- source_word: לְבִנְיָמִן וּלְאִישׁ בֹּשֶׁת
  choice: 属便雅悯和……伊施波设的一方
  rationale: לְ在此更可能表示归属或所代表的一方，而非单纯来源；“属……的一方”清楚表达阵营关系，并保留便雅悯与伊施波设并列的结构。
- source_word: אִישׁ בֹּשֶׁת
  choice: 伊施波设
  rationale: 依马所拉文本音译此名；相关经文传统另见“伊施巴力”形式，但正文不以该形式取代本处读法。
- source_word: בֶּן שָׁאוּל
  choice: 扫罗之子
  rationale: 简洁保留原文的父子身份说明，语体庄重自然。
- source_word: מֵעַבְדֵי דָוִד
  choice: 大卫的仆从中
  rationale: עֶבֶד在王室军事语境可指臣仆、随从或服役之人；“仆从”比“仆人”更适合此军事场景，又不直接释作较宽泛的“部下”。
