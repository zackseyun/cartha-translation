base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/021.yaml
  text: Then Abner said to him[a], “Turn aside to your right or to your left, and seize one of the young men for yourself, and take his gear for yourself.” But Asahel was not willing to turn aside from following him.
translation:
  language: zh_hans
  text: 押尼珥对他说：“你转到右边或左边去，抓住一个年轻人，把他的装备[a]拿走吧。”可是亚撒黑不肯离开押尼珥，仍在后面追赶他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“铠甲”。这个希伯来词很可能指从倒下的战士身上取下的物品，但具体所指并不完全确定。
    reason: 保留חֲלִצָתוֹ在此处究竟指装备、铠甲或被剥取之物的词义不确定性。
lexical_decisions:
- source_word: נְטֵה לְךָ עַל יְמִינְךָ אוֹ עַל שְׂמֹאלֶךָ
  choice: 你转向右边或左边
  rationale: 在追逐语境中，נטה表示偏离当前路线；此译保留第二人称直接劝告和左右两个方向，同时符合现代汉语表达。
- source_word: וֶאֱחֹז לְךָ אֶחָד מֵהַנְּעָרִים
  choice: 抓住一个年轻人
  rationale: אחז意为抓住、擒住；נערים直译为“年轻人”，军事语境虽可指随从或战士，但正文不额外限定身份。
- source_word: וְקַח לְךָ אֶת חֲלִצָתוֹ
  choice: 把他的装备拿走吧
  rationale: חליצה在这里很可能指从被击倒的战士身上取下的装备，但具体物件并不确定；“装备”既适合战斗语境，也避免把词义过度限定为铠甲或一般战利品。
- source_word: וְלֹא אָבָה עֲשָׂהאֵל
  choice: 可是亚撒黑不肯
  rationale: אבה表示愿意或同意，否定形式可自然译为“不肯”，准确表达其拒绝改变行动。
- source_word: לָסוּר מֵאַחֲרָיו
  choice: 转开，仍在后面追赶押尼珥
  rationale: סור表示转开、离开，מאחריו字面为“从他后面”；结合追逐场景，译文明确表达亚撒黑没有停止从后追赶。末尾重复人名以消除汉语代词可能造成的歧义。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“仍在后面追赶押尼珥”将希伯来语的追逐画面清楚传达出来；引语中的“吧”使命令在上下文中呈现为劝其改换目标，而非生硬号令。
