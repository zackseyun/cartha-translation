source:
  edition: WLC
  text: וְ/עַתָּ֕ה יַֽעַשׂ יְהוָ֥ה עִמָּ/כֶ֖ם חֶ֣סֶד וֶ/אֱמֶ֑ת וְ/גַ֣ם אָנֹכִ֗י אֶעֱשֶׂ֤ה אִתְּ/כֶם֙ הַ/טּוֹבָ֣ה הַ/זֹּ֔את אֲשֶׁ֥ר עֲשִׂיתֶ֖ם הַ/דָּבָ֥ר הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/006.yaml
  text: And now may Yahweh show you steadfast love and faithfulness[a]. And I also will do this good to you[c][b], because you have done this thing.
translation:
  language: zh_hans
  text: 现在，愿耶和华向你们施慈爱和信实[a]；我也必向你们行这善事[b]，因为你们做了这件事[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“耶和华必向你们施慈爱和信实。”希伯来语动词既可理解为祝愿，也可理解为将来的陈述。
    reason: alternative_reading
  - marker: b
    text: 或译：“我也必善待你们。”希伯来语直译为“我也必向你们行这善事”。
    reason: lexical_alternative
  - marker: c
    text: “这件事”指上一节所说的事，就是埋葬扫罗。
    reason: cross_reference
lexical_decisions:
- source_word: וְעַתָּה
  choice: 现在
  rationale: 承接上文并引出大卫接下来的祝愿；现代汉语中无需机械保留句首连词。
- source_word: יַעַשׂ יְהוָה
  choice: 愿耶和华……施
  rationale: 将未完成式理解为祝愿语气；“施”可自然搭配后面的“慈爱和信实”。
- source_word: חֶסֶד
  choice: 慈爱
  rationale: 表达忠贞、恩慈之爱，同时保持简洁庄重，不将其限定为某一特定神学术语。
- source_word: וֶאֱמֶת
  choice: 信实
  rationale: 在“慈爱和信实”这一搭配中，所指侧重可靠、忠诚，而非抽象的“真理”。
- source_word: וְגַם אָנֹכִי
  choice: 我也
  rationale: 保留附加词与强调人称所体现的大卫相应行动之意。
- source_word: אֶעֱשֶׂה אִתְּכֶם הַטּוֹבָה הַזֹּאת
  choice: 我也必善待你们
  rationale: 原文直译近于“向你们行这善事”；“善待你们”在现代汉语中自然，并保留向对方行善的受益关系。
- source_word: אֲשֶׁר עֲשִׂיתֶם הַדָּבָר הַזֶּה
  choice: 因为你们做了这件事
  rationale: 按语境表达原因；“这件事”照应上一节埋葬扫罗的行动。
theological_decisions:
- issue: יַעַשׂ 的语气
  choice: 祝愿：“愿耶和华……”
  alternative: 将来陈述：“耶和华必……”
  rationale: 上下文是大卫为基列·雅比人祝福，未完成式可具有祈愿意味；脚注保留其也可理解为将来陈述的歧义。
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 采用现代简体中文圣经读者最熟悉的专名形式，明确呈现神的名字，而不以“主”这一称号替代。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“慈爱和信实”保留两个不同的希伯来语概念；正文选择祝愿读法，并用脚注呈现将来陈述的可能性。
