base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/002.yaml
  text: 'So David went up there[a], and also his two wives: Ahinoam the Jezreelite and Abigail, the wife of Nabal the Carmelite.'
translation:
  language: zh_hans
  text: 于是，大卫上到那里去；他的两个妻子也一同去了：耶斯列的亚希暖和迦密人拿八的妻子亚比该。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文称亚比该为“拿八的妻子”，以她先前与拿八的婚姻关系标识她；“迦密人”修饰拿八，指他来自迦密。
    reason: source_clarification
lexical_decisions:
- source_word: וַיַּעַל שָׁם
  choice: 上到那里
  rationale: עלה表示“上去、上到”，שָׁם指前文已经提到的目的地；“上到那里”既保留方向意味，也符合现代汉语表达。
- source_word: וְגַם שְׁתֵּי נָשָׁיו
  choice: 他的两个妻子也一同去了
  rationale: וְגַם具有添加意味；结合叙事语境补出“一同去了”，自然表达二妻也参与同行，而不改变原意。
- source_word: אֲחִינֹעַם הַיִּזְרְעֵלִית
  choice: 耶斯列人亚希暖
  rationale: 族属形容词在此标明亚希暖来自耶斯列；采用中文圣经人名、地名的通行音译。
- source_word: וַאֲבִיגַיִל
  choice: 和……亚比该
  rationale: 连接第二位妻子，名字采用中文圣经通行音译。
- source_word: אֵשֶׁת נָבָל הַכַּרְמְלִי
  choice: 迦密人拿八的妻子亚比该
  rationale: 希伯来文以亚比该先前与拿八的婚姻来标识她；阳性单数形容词הַכַּרְמְלִי修饰拿八，说明他是迦密人。中文调整语序，使修饰关系清楚自然。
