  text: וַ/יְהִ֣י אַֽחֲרֵי כֵ֗ן וַ/יִּשְׁאַל֩ דָּוִ֨ד בַּֽ/יהוָ֤ה לֵ/אמֹר֙ הַ/אֶעֱלֶ֗ה בְּ/אַחַת֙ עָרֵ֣י יְהוּדָ֔ה וַ/יֹּ֧אמֶר יְהוָ֛ה אֵלָ֖י/ו עֲלֵ֑ה וַ/יֹּ֧אמֶר דָּוִ֛ד אָ֥נָה אֶעֱלֶ֖ה וַ/יֹּ֥אמֶר חֶבְרֹֽנָ/ה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/001.yaml
  text: After this[a], David inquired of Yahweh, saying, “Shall I go up into one of the cities of Judah?” And Yahweh said to him, “Go up.” Then David said, “Where shall I go up?” And he said, “To Hebron.”
translation:
  language: zh_hans
  text: 这事以后，大卫求问雅威[a]，说：“我该上犹大的一座城去吗？”雅威对他说：“上去吧。”大卫又问：“我该上到哪里去？”他说：“到希伯仑去。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威”对应希伯来文神名 YHWH；传统上常译作“耶和华”。
    reason: 说明原文使用上帝的专名，并交代中文传统译法。
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי כֵן
  choice: 这事以后
  rationale: 保留希伯来叙事公式的时间承接作用，同时避免生硬直译为“这事以后发生了”。
- source_word: וַיִּשְׁאַל ... בַּיהוָה
  choice: 求问耶和华
  rationale: “求问”准确表达向上帝寻求指引，而不只是一般性的提问，也是现代中文圣经语体中自然且易懂的说法。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文读者最熟悉的神名音译；脚注说明其对应希伯来文四字神名 YHWH。
- source_word: לֵאמֹר
  choice: 说
  rationale: 用“说”自然引出求问的直接引语，并保留原文的引语结构。
- source_word: הַאֶעֱלֶה
  choice: 我可以上……去吗
  rationale: 既保留疑问和征求许可、指引的语气，也保留עלה“上去”的方向含义。
- source_word: בְּאַחַת עָרֵי יְהוּדָה
  choice: 犹大的一座城
  rationale: 准确表达“犹大诸城中的一座”，用中文简洁呈现不定指含义。
- source_word: עֲלֵה
  choice: 上去吧
  rationale: 重复“大卫问题”中的同一动词，保留原文刻意的词汇呼应；“吧”使许可式命令在中文中自然。
- source_word: אָנָה
  choice: 哪里
  rationale: 表达目的地疑问，现代中文无需生硬译作“往何处”。
- source_word: חֶבְרֹנָה
  choice: 到希伯仑去
  rationale: 地名后的方向词尾表示朝向该地；以“到……去”清楚传达目的地。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。正文采用现代中文传统且最广为读者识别的音译“耶和华”，不以“主”这一称号替代；脚注同时标明其希伯来文形式，以免掩盖这是专名。
- issue: 大卫求问的性质
  choice: 求问耶和华
  alternative: 问耶和华
  rationale: שׁאל 与介词 ב 及神名连用，在此表示寻求神的指引。“求问”传达这一含义，但不补充原文未说明的求问媒介或仪式。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。保留“上去”在问答中的三次词汇呼应，以呈现原文的方向感和叙事节奏；不推断大卫通过何种方式求问。
