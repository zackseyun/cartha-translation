    rationale: חַי הָאֱלֹהִים 字面为“神活着”；其功能确为誓言，但“永活的”并非原文独立形容词，“作证”也比直接誓言公式更解释性。
  - severity: medium
    issue: “那么百姓从早晨就已经撤走”在反事实句中时态和时间关系不清。
    rationale: 原文为反事实结果；“已经撤走”容易造成实际已发生的印象，也未能自然表达 מֵהַבֹּקֶר 的“从早晨起”时间起点。
  - severity: low
    issue: 脚注 b 的直译汉语不够顺畅。
    rationale: “各人从跟随自己的弟兄之后上去”不符合汉语表达习惯；可在保留原文结构的同时说明其字面意义和语境含义。
