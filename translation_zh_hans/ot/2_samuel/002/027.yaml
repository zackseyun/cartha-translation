base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/027.yaml
  text: Joab said[a], “As God lives, if you had not spoken, then from the morning the people would have gone up[b], each from following his brother.”
translation:
  language: zh_hans
  text: 约押说：“神活着！若不是你开了口，百姓从早晨[a]起就会各自停止追赶自己的弟兄了[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“从清早起”。
    reason: lexical_alternative
  - marker: b
    text: 原文较直译为“各人从跟随自己的弟兄之后上去”；在此语境中可指各人停止追赶自己的弟兄而离开。
    reason: lexical_alternative
lexical_decisions:
- source_word: חַי הָאֱלֹהִים
  choice: 永活的上帝作证
  rationale: 这是希伯来语常见的起誓用语。此译保留以永活的上帝为誓言保证的含义，同时符合现代汉语表达。
- source_word: לוּלֵא
  choice: 要不是
  rationale: 与后面的完成式连用，表达与事实相反的条件；“要不是”自然传达“如果你没有……”的反事实语气。
- source_word: דִּבַּרְתָּ
  choice: 你开了口
  rationale: 原词基本义为“说话”。这里不补出具体所说的内容；“开了口”既自然，也保留宾语未明的特点。
- source_word: כִּי אָז
  choice: 那么
  rationale: 这两个虚词在此引出反事实条件的结果，“那么”简洁而清楚地表达其功能。
- source_word: מֵהַבֹּקֶר
  choice: 从早晨
  rationale: מן加“早晨”表示时间起点。正文采用较贴近原文的“从早晨”，脚注列出自然的时间表达。
- source_word: נַעֲלָה
  choice: 就已经撤走
  rationale: עלה的核心义是“上去”，但在此军事语境中与“从追赶……之后”连用，指停止追击而离开。“撤走”传达语境意义；脚注说明原文措辞及其解释空间。
- source_word: אִישׁ מֵאַחֲרֵי אָחִיו
  choice: 各自不再追赶自己的弟兄
  rationale: 原文近似直译为“各人从跟随自己弟兄之后”。在战斗语境中，“跟随”指追赶，“从……之后”表示脱离或停止；“弟兄”保留双方同属以色列人的措辞。
