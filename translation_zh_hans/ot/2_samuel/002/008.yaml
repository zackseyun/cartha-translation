  source_fidelity: 原文的וְ可在此按上下文译为“然而”。“带过河”把使役动词וַיַּעֲבִרֵהוּ具体化为越过一条河，虽与玛哈念的地理位置相符，但本节本身没有明言河流或路线；宜避免该补充。
  naturalness: 原译整体流畅，但“扫罗的元帅、尼珥的儿子押尼珥”略有同位语堆叠。“尼珥的儿子押尼珥，是扫罗军队的统帅”更清楚自然。
  terminology: “伊施波设”“伊施巴力”“玛哈念”均采用恰当且通行的音译。“扫罗军队的统帅”比“扫罗的元帅”更明确对应שַׂר צָבָא אֲשֶׁר לְשָׁאוּל，且不额外界定现代军衔。
