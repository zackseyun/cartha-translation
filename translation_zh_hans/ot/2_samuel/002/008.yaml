base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/008.yaml
  text: But Abner son of Ner[a], the commander of Saul’s army, took Ish-bosheth son of Saul and brought him over to Mahanaim.
translation:
  language: zh_hans
  text: 然而，尼珥的儿子押尼珥，是扫罗军队的统帅；他把扫罗的儿子伊施波设[a]带到玛哈念。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 伊施波设在《历代志上》8:33和9:39中名叫伊施巴力。
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/אַבְנֵר
  choice: 然而，押尼珥
  rationale: וְ在此承接上文，同时与犹大家拥立大卫形成叙事转折；译作“然而”比单纯的“于是”更能体现对照。人名按通行形式音译。
- source_word: בֶּן נֵר
  choice: 尼珥的儿子
  rationale: 保留希伯来语标准的父子关系表达，并采用现代汉语自然语序。
- source_word: שַׂר צָבָא אֲשֶׁר לְ/שָׁאוּל
  choice: 扫罗的元帅
  rationale: שַׂר צָבָא指军队统帅；“元帅”简洁而庄重，表达他是扫罗军队的最高军事长官。
- source_word: לָקַח
  choice: 把……带
  rationale: 该动词基本义为“拿、取、带走”。上下文未明确要求“抓住”之类更强烈的措辞；与后面的使役动词连贯译为“把……带过河”。
- source_word: אֶת אִישׁ בֹּשֶׁת
  choice: 伊施波设
  rationale: 按马所拉文本音译此人名；同一人物在《历代志上》中所用的另一名字保留在脚注中。
- source_word: וַ/יַּעֲבִרֵ/הוּ
  choice: 把……带过河
  rationale: עבר的使役式表示“使其过去、带其越过”。“带过河”自然体现过到约旦河东的方向；虽然本节没有明说河名，因此不补出“约旦河”。
- source_word: מַחֲנָיִם
  choice: 玛哈念
  rationale: 地名采用现代中文圣经中较通行的音译。
theological_decisions: []
