  yaml_path: translation/ot/2_samuel/002/019.yaml
  text: Asahel pursued Abner[a], and he did not turn to the right or to the left from following Abner.
translation:
  language: zh_hans
  text: 亚撒黑追赶押尼珥[a]，跟在他后面时，没有向右或向左偏离。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“亚撒黑追赶押尼珥；他没有向右或向左偏离跟随押尼珥的路线。”
    reason: 原文两处均使用与“在……后面／跟随”相关的结构。正文依现代汉语习惯将其表达为“跟在他后面时”；异译则明确末句所指为跟随押尼珥的路线。
lexical_decisions:
- source_word: וַיִּרְדֹּף
  choice: 追赶
  rationale: רדף表示主动而持续地追逐；“追赶”符合战场叙事语境，也比单用“追”更清楚自然。
- source_word: אַחֲרֵי אַבְנֵר
  choice: 押尼珥
  rationale: 与“追赶”连用时，现代汉语直接以人名作宾语最自然；原文“在……后面”的空间关系随后由“跟在他后面”明确表达。
- source_word: וְלֹא נָטָה
  choice: 不偏向
  rationale: נטה在此指偏离正在行进的方向；“不偏向”保留空间性的动作意象。
- source_word: לָלֶכֶת
  choice: 跟在他后面
  rationale: 该不定式属于行进语境，不宜机械译成“去走”；结合句末短语，以“跟在他后面”自然呈现持续行进与尾随之意。
- source_word: עַל הַיָּמִין וְעַל הַשְּׂמֹאול
  choice: 向右，也不向左
  rationale: 保留希伯来语成对方向表达；汉语用“不……也不……”清楚呈现毫不偏离的意思。
- source_word: מֵאַחֲרֵי אַבְנֵר
  choice: 跟在他后面
  rationale: 字面为“从押尼珥后面”；在本句表示亚撒黑没有偏离尾随押尼珥的路线。用代词避免近距离重复人名，同时保留追踪画面。
- source_word: עֲשָׂהאֵל / אַבְנֵר
  choice: 亚撒黑／押尼珥
  rationale: 采用现代简体中文圣经人名的通行译法。
