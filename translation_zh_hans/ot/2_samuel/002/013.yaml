  register: 采用现代、庄重而易懂的叙事文体。人名依通行圣经汉译作“约押、洗鲁雅、基遍”。正文保留“臣仆”所含的服属关系，避免过度具体化为“士兵”；脚注标记置于整节相关空间描写之后。
