base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/013.yaml
  text: And Joab the son of Zeruiah and the servants of David went out and met them together by the pool of Gibeon. And these sat on one side of the pool[a], and those on the other side of the pool.
translation:
  language: zh_hans
  text: 洗鲁雅的儿子约押和大卫的臣仆出发，在基遍的水池[a]旁与他们相遇。双方都在那里坐下：一方在水池这边，另一方在水池那边。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “水池”也可译作“蓄水池”；希伯来语这个词可指人工修建的水池或蓄水设施。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/יוֹאָב בֶּן צְרוּיָה
  choice: 洗鲁雅的儿子约押
  rationale: 按希伯来语亲属称谓的次序译出，并采用现代中文自然、清楚的表达。句首叙事连接词不机械译作“和”，以免中文生硬；上下文承接关系仍由叙事顺序体现。
- source_word: וְ/עַבְדֵי דָוִד
  choice: 和大卫的臣仆
  rationale: עֶבֶד 在此指隶属大卫、随他行动的人，语境带有军事随从含义；“臣仆”既保留服属关系，也不把词义过度限定为“士兵”。
- source_word: יָצְאוּ
  choice: 出发
  rationale: יצא 基本义为“出去”。此处描述一队人采取行动前往会合地点，“出发”符合现代中文叙事，又没有增添“进军”等原文未明说的军事色彩。
- source_word: וַ/יִּפְגְּשׁוּ/ם
  choice: 与他们相遇
  rationale: פגשׁ 表示相遇、碰见；宾语后缀“他们”回指上一节的押尼珥和伊施波设的臣仆。译文保留代词，不擅自补明具体对象。
- source_word: עַל בְּרֵכַת גִּבְעוֹן
  choice: 在基遍池旁
  rationale: בְּרֵכָה 可指人工水池或蓄水池；正文采用简洁自然的“池”，并以脚注保留“蓄水池”的词义可能。“旁”与下文两队分坐池子两边的空间场景相符。
- source_word: יַחְדָּו
  choice: 双方会合在那里
  rationale: יַחְדָּו 表示一同、同在一处。结合复数双方相遇的语境，译为“双方会合在那里”，避免中文“与他们一同相遇”可能造成的歧义，同时不表示双方友好联合。
- source_word: וַ/יֵּשְׁבוּ
  choice: 坐
  rationale: ישׁב 此处取基本义“坐下、坐着”，不增添扎营或列阵等原文没有明确表达的动作。
- source_word: אֵלֶּה ... וְ/אֵלֶּה
  choice: 一方……另一方
  rationale: 希伯来语直译为“这些……那些”；现代中文用“一方……另一方”更自然，并准确体现两个对立群体。
- source_word: עַל הַ/בְּרֵכָה מִ/זֶּה ... עַל הַ/בְּרֵכָה מִ/זֶּה
  choice: 在池子这边……在池子那边
  rationale: 这是表示同一水池相对两侧的空间说法。“这边……那边”保留原文的指示性和场景感，比抽象的“一侧……另一侧”更贴近形式。
theological_decisions: []
