base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/018.yaml
  text: 'The three sons of Zeruiah were there: Joab[a], Abishai, and Asahel. And Asahel was swift on his feet like one of the gazelles that are in the field.'
translation:
  language: zh_hans
  text: 洗鲁雅的三个儿子都在那里，就是约押、亚比筛和亚撒黑。亚撒黑脚步飞快，如同田野中的一只羚羊[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “羚羊”也可译作“鹿”。希伯来词 צְבִי 可泛指鹿形的野生动物，但这里译作“羚羊”更能体现其奔跑迅捷的特点。
    reason: 保留该动物名称在词义范围上的另一种可能。
lexical_decisions:
- source_word: וַיִּהְיוּ שָׁם
  choice: 都在那里
  rationale: 这句话说明三人当时在场；“都”自然承接“三个儿子”，叙事性连接词 וַ 不另加原文没有的“那时”或“现在”。
- source_word: שְׁלֹשָׁה בְּנֵי צְרוּיָה
  choice: 洗鲁雅的三个儿子
  rationale: 按现代汉语领属结构表达，并以传统且通行的中文专名“洗鲁雅”音译 צְרוּיָה。
- source_word: יוֹאָב וַאֲבִישַׁי וַעֲשָׂהאֵל
  choice: 约押、亚比筛和亚撒黑
  rationale: 采用现代中文圣经读者熟悉的通行人名译法。
- source_word: קַל בְּרַגְלָיו
  choice: 脚步飞快
  rationale: קַל 在这里指奔跑迅速，而非重量轻；“脚步飞快”既保留“脚”的身体意象，也符合自然的现代汉语。
- source_word: כְּאַחַד הַצְּבָיִם
  choice: 如同……羚羊
  rationale: צְבִי 在此最可能指以奔跑迅捷著称的羚羊类动物；中文不必机械译出“其中一只”，以自然比喻传达原意。
- source_word: אֲשֶׁר בַּשָּׂדֶה
  choice: 田野中的
  rationale: 贴近原文“在田野中的”，不额外加入“开阔”等源文未明说的限定。
