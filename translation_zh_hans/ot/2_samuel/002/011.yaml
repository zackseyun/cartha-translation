  text: The length of time that David was king in Hebron over the house of Judah was seven years and six months[a].
translation:
  language: zh_hans
  text: 大卫在希伯仑作王、治理犹大家的年日[a]，共七年零六个月。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “年日”直译为“日子的数目”；这里指大卫在希伯仑作王的时间长度。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: 共
  rationale: 此处的叙事形式用于作总结陈述；汉语不必逐字译作“事情是”，以“共”自然引出在位时长。
- source_word: מִסְפַּר הַיָּמִים
  choice: 时日
  rationale: 原文直译为“日子的数目”，在此指一段时间的总长度。“时日”保留原文意象，同时由句末“共七年零六个月”明确其含义。
- source_word: אֲשֶׁר הָיָה דָוִד מֶלֶךְ
  choice: 大卫……作王
  rationale: 关系从句说明所计算的是大卫为王的时期；汉语调整语序后自然清楚。
- source_word: בְּחֶבְרוֹן
  choice: 在希伯仑
  rationale: בְּ表示地点；“在希伯仑”是现代汉语表达在该城作王的自然说法。
- source_word: עַל בֵּית יְהוּדָה
  choice: 统治犹大家
  rationale: עַל在王权语境中表示治理对象；בֵּית יְהוּדָה直译“犹大家”，具有宗族、部族共同体的整体含义，故不简化为“犹大”。
- source_word: שֶׁבַע שָׁנִים וְשִׁשָּׁה חֳדָשִׁים
  choice: 七年零六个月
  rationale: 准确传达原文时长；“零”符合现代汉语复合时段的自然表达。
