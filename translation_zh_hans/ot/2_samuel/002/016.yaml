base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/016.yaml
  text: Each man seized his companion by the head[a], and his sword was in his companion’s side, so they fell together. Therefore that place, which is in Gibeon, was called Helkath-hazzurim.
translation:
  language: zh_hans
  text: 每个人都抓住对手的头，各人的剑都插在对手的身侧；他们便一同倒下。因此，位于基遍的那地方称为“希勒甲·哈楚林”[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “希勒甲·哈楚林”是希伯来地名的音译。其确切含义不能确定；有人提出“侧边之地”“利剑之地”等解释。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחֲזִקוּ אִישׁ
  choice: 众人各自抓住
  rationale: חזק在这场搏斗中表示用力抓住；אִישׁ在此为逐一分配用法。“众人各自”自然表达每名参战者都采取同样行动。
- source_word: בְּרֹאשׁ רֵעֵהוּ
  choice: 对手的头
  rationale: רֹאשׁ直译为“头”；רֵעַ在配对厮杀的语境中指与各人相对的另一人，译作“对手”比“同伴”更符合现代汉语语境，且不暗示友谊。
- source_word: וְחַרְבּוֹ בְּצַד רֵעֵהוּ
  choice: 各人的剑也刺在对手的身侧
  rationale: 原文是紧凑的无动词结构，描绘剑已进入对方身体侧部。中文须补出谓语；“刺在”保留画面的结果状态，而不额外细化刺击方式。צַד译作“身侧”，避免把部位过度限定为肋骨。
- source_word: וַיִּפְּלוּ יַחְדָּו
  choice: 于是他们一同倒下
  rationale: “于是”体现叙事中的结果关系；יַחְדָּו强调众人同时倒下。
- source_word: וַיִּקְרָא לַמָּקוֹם הַהוּא
  choice: 因此，那地方称为
  rationale: 原文动词为未明确主语的第三人称单数，可按希伯来语非特指用法自然译为中文被动含义的“称为”；“因此”表明命名源于前述事件。
- source_word: חֶלְקַת הַצֻּרִים
  choice: 希勒甲·哈楚林
  rationale: 作为地名按希伯来语音译，以免在词源含义不确定时武断选定某一种意译；中点标示名称内部的两个成分。
- source_word: אֲשֶׁר בְּגִבְעוֹן
  choice: 就在基遍
  rationale: 关系从句说明该地所在位置；“就在”在现代汉语中简洁自然，并保留定位作用。
