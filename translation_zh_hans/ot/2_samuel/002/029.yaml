base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/029.yaml
  text: And Abner and his men traveled through the Arabah all that night[a], crossed the Jordan, went through all the Bithron, and came to Mahanaim.
translation:
  language: zh_hans
  text: 那一夜，押尼珥和他的人一直在亚拉巴行进；他们渡过约旦河，走遍比特仑[a]，来到玛哈念。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “比特仑”也可能指整个沟谷或峡谷地区；这个希伯来词可能是地名，也可能是描述这类地形地区的词。
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּעֲרָבָה
  choice: 穿行亚拉巴
  rationale: עֲרָבָה在这段行程叙述中很可能指约旦裂谷一带的特定地域，而不只是泛指“平原”；保留地名音译，并以“穿行”自然表达在该地区行进。
- source_word: כָּל הַלַּיְלָה הַהוּא
  choice: 整夜
  rationale: 准确表达行动持续了那一整夜；中文叙事中“整夜”简洁自然，所指的特定一夜由上下文清楚限定。
- source_word: וַיַּעַבְרוּ אֶת הַיַּרְדֵּן
  choice: 渡过约旦河
  rationale: עבר以“约旦”为直接宾语，在此明确表示渡河；“渡过约旦河”符合现代汉语表达。
- source_word: כָּל הַבִּתְרוֹן
  choice: 整个比特仑
  rationale: הַבִּתְרוֹן可能是地名或地域名称，也可能是描述峡谷地形的普通名词。正文保留音译，以免在证据不足时替原文消除歧义，并用脚注说明另一种理解。
- source_word: מַחֲנָיִם
  choice: 玛哈念
  rationale: 这是专有地名，采用中文圣经传统中通行的音译。
- source_word: הָלְכוּ / וַיֵּלְכוּ / וַיָּבֹאוּ
  choice: 穿行……走过……来到
  rationale: 依次呈现持续行进、经过某一区域和抵达目的地的叙事进展，同时避免机械重复同一个汉语动词。
- source_word: וַאֲנָשָׁיו
  choice: 他的人
  rationale: 直译为“他的人”，在军事语境中自然指跟随押尼珥的一队人；不译作“士兵”，以免加入原文没有明说的身份限定。
