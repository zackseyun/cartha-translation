  text: וַ/יִּתְקַ֤ע יוֹאָב֙ בַּ/שּׁוֹפָ֔ר וַ/יַּֽעַמְדוּ֙ כָּל הָ/עָ֔ם וְ/לֹֽא יִרְדְּפ֥וּ ע֖וֹד אַחֲרֵ֣י יִשְׂרָאֵ֑ל וְ/לֹֽא יָסְפ֥וּ ע֖וֹד לְ/הִלָּחֵֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/028.yaml
  text: Then Joab blew the trumpet[a], and all the people stood still, and they no longer pursued Israel or continued to fight.
translation:
  language: zh_hans
  text: 约押吹响号角[a]，众人就都停下，不再追赶以色列人，也不再继续交战。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“角号”；希伯来语 שׁוֹפָר 指用作信号乐器的角。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְקַע
  choice: 吹响
  rationale: תקע与号角连用时指吹奏、发出信号；“吹响”在现代汉语中自然，也体现号令性质。
- source_word: בַּשּׁוֹפָר
  choice: 号角
  rationale: שׁוֹפָר指用角制成或作为号角使用的信号乐器；“号角”比“喇叭”更贴近其古代形制和军事用途，同时不武断限定为羊角。
- source_word: וַיַּעַמְדוּ כָּל הָעָם
  choice: 众人就都停下
  rationale: עמד字面为“站立”，在追击的军事语境中表示停住；“停下”准确传达行动中止。הָעָם在此指约押一方的人众，“众人”既保留原文的一般称呼，也符合上下文。
- source_word: יִרְדְּפוּ עוֹד אַחֲרֵי יִשְׂרָאֵל
  choice: 不再追赶以色列人
  rationale: רדף אחרי意为“追赶、追击”，否定词与עוֹד合用表示“不再”。此处“以色列”实际指押尼统领的以色列军众，汉语用“以色列人”可避免被误解为追赶地域或抽象国家。
- source_word: וְלֹא יָסְפוּ עוֹד לְהִלָּחֵם
  choice: 也不再继续交战
  rationale: יסף加不定式有“继续、再做”之意；否定词与עוֹד强化不再发生。“继续交战”保留原文对战斗停止的独立陈述。
