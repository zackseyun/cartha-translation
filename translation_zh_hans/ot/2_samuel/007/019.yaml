base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/019.yaml
  text: And even this was too small in your eyes[a], Lord GOD; you have also spoken of your servant’s house for a long time to come, and this is the law of man[c][b], Lord GOD.
translation:
  language: zh_hans
  text: 可是这在你眼中还算小事，主耶和华啊；你又谈及你仆人的家在遥远将来的事[a]。主耶和华啊，这就是给人的训诲[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “遥远的将来”原文直译为“到远处”，这里指时间上遥远的未来。
    reason: lexical_alternative
  - marker: b
    text: 本句末尾的希伯来语含义难定，也可译作“这就是人类的章程”“这是人的律例（或惯例）”，或“这是有关人类的训诲”。
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּקְטַן עוֹד זֹאת בְּעֵינֶיךָ
  choice: 即使这事在你眼中仍算小事
  rationale: 保留“在你眼中”的希伯来语评价隐喻，并将 קטן 的语境义自然表达为“算小事”；עוֹד 表达“仍、还”的递进意味。
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: 分别体现 אֲדֹנָי 的称号“主”和四字神名 יהוה 的传统汉语译法“耶和华”，避免将二者合并。
- source_word: וַתְּדַבֵּר גַּם אֶל בֵּית עַבְדְּךָ
  choice: 你还谈到你仆人的家
  rationale: 此处说话内容关乎大卫的家；“谈到”符合 דבר אל 在语境中的指涉。“家”保留其可兼指家室与王朝的含义。
- source_word: לְמֵרָחוֹק
  choice: 在遥远的将来
  rationale: 该短语字面与“远”有关，在此按时间意义理解，指尚在远处的未来。
- source_word: תּוֹרַת
  choice: 训诲
  rationale: תורה 可指训诲、教导、律法或规范；“训诲”保留较宽泛的语义，不把这个疑难短语过早限定为成文法律。
- source_word: הָאָדָם
  choice: 人
  rationale: 保留带冠词单数 אָדָם 的概括性表达；现代汉语“人”既自然，也不必武断限定为某一个男性或明确改写为全人类。
theological_decisions:
- issue: 疑难短语 וְזֹאת תּוֹרַת הָאָדָם 的解释
  choice: 这就是给人的训诲
  alternative: 这就是人类的章程／这是人的律例或惯例／这是有关人类的训诲
  rationale: 原文的句法关系和语义均有争议。正文贴近“这—训诲—人”三个核心成分，以“给人的”表达可能的受事关系，同时用脚注保留其他合理理解，不引入王朝性或弥赛亚性的解释性改写。
translation_notes:
  register: 采用庄重而现代的标准普通话。“主耶和华啊”的呼语保留祷告语气；句末疑难短语不作教派化阐释。所有脚注标记均已置于正文相应位置。
