  text: But that night the word of Yahweh came to Nathan[a], saying,
translation:
  language: zh_hans
  text: 但就在那天夜里，雅威的话临到拿单，说：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: 但就在……临到
  rationale: 此处第一个叙事性 וַיְהִי 推进情节，并在上下文中转折拿单先前对大卫的赞同；现代汉语用“但就在”自然表达这一叙事转折，不生硬重复“事情发生了”。
- source_word: בַּלַּיְלָה הַהוּא
  choice: 那天夜里
  rationale: 准确表达特指的时间，且符合现代汉语习惯。
- source_word: וַיְהִי דְּבַר יְהוָה
  choice: 雅威的话临到
  rationale: 这是先知叙事中的固定启示公式。译作“话临到”既保留“话”的启示意味，也以自然汉语传达希伯来语“……的话发生／成为”的惯用含义。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，保留其作为以色列之神专名的性质，而不以称号替代。
- source_word: אֶל־נָתָן
  choice: 临到拿单
  rationale: אֶל 标明启示的领受者；与“话临到”搭配，现代汉语自然清楚。
- source_word: לֵאמֹר
  choice: 说
  rationale: 引出下一节神谕的具体内容；汉语在“临到某人说”结构中无需另译为“如此说”。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名。译文采用“雅威”，以音译保留专名，并避免将其改成“主”等称号；“耶和华”是汉语传统形式，但较少反映该名通常重构的读音。
- issue: “雅威的话临到”的启示公式
  choice: 保留“话”并译作“临到”
  alternative: 雅威的信息传给
  rationale: “话”保留原文 דְּבַר 的广度及神学张力，“临到”则自然表达先知领受启示，并不进一步界定启示的具体方式。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“但就在”承接上文并突出当夜发生的转折；句末用冒号，引出下一节直接话语。
