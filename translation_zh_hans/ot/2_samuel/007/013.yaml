  text: ה֥וּא יִבְנֶה בַּ֖יִת לִ/שְׁמִ֑/י וְ/כֹנַנְתִּ֛י אֶת כִּסֵּ֥א מַמְלַכְתּ֖/וֹ עַד עוֹלָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/013.yaml
  text: He will build a house for my name[a], and I will establish the throne of his kingdom forever.
translation:
  language: zh_hans
  text: 他必为我的名建造一座房屋[a]；我必使他国的王位永远坚立。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他必为我的名建造一座圣殿。”原文为“房屋”；本章以“房屋”一词关联圣殿和大卫的家室（王朝）。
    reason: 说明此处“房屋”所指的圣所含义，并保留原文在圣殿与王朝之间的文字关联。
lexical_decisions:
- source_word: הוּא
  choice: 他
  rationale: 独立第三人称阳性单数代词在此明确标示应许中的行动者；现代汉语用“他”自然表达，不额外强化为“他自己”。
- source_word: יִבְנֶה
  choice: 必……建造
  rationale: בנה 的 Qal 未完成式第三人称阳性单数，在应许语境中指将来的行动；“必”兼顾未来与应许的确定性。
- source_word: בַּיִת
  choice: 一座殿宇
  rationale: 该词本义为“房屋、家”，此处具体指为耶和华所建的圣所。汉语“殿宇”既自然指向圣殿，也保留“建筑/居所”的字面意象；脚注说明原文用词及本章“房屋—家室/王朝”的文字关联。
- source_word: לִשְׁמִי
  choice: 为我的名
  rationale: 直译介词 ל 与“我的名”的组合，保留原文的圣约与神学表达，不扩释为“为了荣耀我的名”等。
- source_word: וְכֹנַנְתִּי
  choice: 我必使……坚立
  rationale: כונן 表示使之稳固、建立；在王权语境中，“使……坚立”自然表达王位得到确立并持续稳固。
- source_word: כִּסֵּא מַמְלַכְתּוֹ
  choice: 他的国位
  rationale: כִּסֵּא 是“宝座”，מַמְלָכָה 指王国或王权。“国位”在现代庄重汉语中简洁表达“其王国的宝座”，且避免误读为仅指一件座具。
- source_word: עַד עוֹלָם
  choice: 永远
  rationale: 这是表达长久持续乃至永久的常用希伯来语组合；在大卫之约的应许中译作“永远”，不削弱其持续性的力度。
theological_decisions:
- issue: בַּיִת 应直译为“房屋”还是按语境译为“圣殿/殿宇”
  choice: 正文采用“殿宇”，脚注保留“房屋”这一原文字义及其文字关联
  alternative: 正文译作“一座房屋”或“一座圣殿”
  rationale: 直接译成“房屋”虽能复制希伯来语双关，却在现代汉语中容易使读者误以为普通住宅；“殿宇”准确呈现当下所指的敬拜建筑，同时脚注明示原文为“房屋”，并保留本章圣殿与大卫家室/王朝之间的文学张力。
- issue: עַד עוֹלָם 在大卫之约中的力度
  choice: 永远
  alternative: 长久
  rationale: 此处是盟约性的王权应许，不宜将其弱化为仅仅很长的一段时间；“永远”保留原文及语境所具有的持续性与神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“必”体现应许的确定性；“殿宇”比“房屋”更清楚地传达此处的圣所含义，又比单用“圣殿”略能保留原文的建筑意象。分号对应两个彼此紧密关联的应许分句。
