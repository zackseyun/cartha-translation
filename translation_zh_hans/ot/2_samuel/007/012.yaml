  text: כִּ֣י יִמְלְא֣וּ יָמֶ֗י/ךָ וְ/שָֽׁכַבְתָּ֙ אֶת אֲבֹתֶ֔י/ךָ וַ/הֲקִימֹתִ֤י אֶֽת זַרְעֲ/ךָ֙ אַחֲרֶ֔י/ךָ אֲשֶׁ֥ר יֵצֵ֖א מִ/מֵּעֶ֑י/ךָ וַ/הֲכִינֹתִ֖י אֶת מַמְלַכְתּֽ/וֹ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/012.yaml
  text: When your days are fulfilled and you lie down with your fathers[a], I will raise up your offspring after you, who will come from your own body[b], and I will establish his kingdom.
translation:
  language: zh_hans
  text: 当你的日子满了、你与列祖同睡时，我必在你之后兴起你的后裔[a]，就是从你身上所出的[b]；我必坚立他的国。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“你的一个后代”。希伯来文是“你的种子／后裔”，既可作集合概念，也可指一位代表性的单数后代。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译“从你的内里出来”，是指从你自己身体所出，即你的亲生后代。
    reason: cultural_note
lexical_decisions:
- source_word: כִּי יִמְלְאוּ יָמֶיךָ
  choice: 当你的日子满了
  rationale: כִּי在此引出将来的时间情境；“日子满了”保留希伯来文“日子达到满数”的意象和庄重语气。
- source_word: וְשָׁכַבְתָּ אֶת־אֲבֹתֶיךָ
  choice: 你与列祖同睡
  rationale: 保留希伯来文关于死亡及与祖先同归的惯用隐喻，不将其直接释为“死亡”。“列祖”符合庄重的圣经叙事语域。
- source_word: וַהֲקִימֹתִי
  choice: 我必……兴起
  rationale: 使役词形以“后裔”为宾语，指使一位继承者兴起；“兴起”既自然，也保留王位承继的意味。
- source_word: זַרְעֲךָ
  choice: 你的后裔
  rationale: זֶרַע既可作集合概念，也可指一位代表性的单数后代；汉语“后裔”不强制标明单复数，能保留这种开放性。
- source_word: אַחֲרֶיךָ
  choice: 在你之后
  rationale: 直接表达时间先后及承继关系。
- source_word: אֲשֶׁר יֵצֵא מִמֵּעֶיךָ
  choice: 就是从你亲身而出的
  rationale: 原文直指从身体内部而出，强调亲生血统；“亲身而出”在现代汉语中清楚而庄重，避免生硬的解剖式直译。
- source_word: וַהֲכִינֹתִי
  choice: 我必坚立
  rationale: כון的使役形式有使之稳固、确立之意；“坚立”比单纯“建立”更能呈现使王国稳固的含义。
- source_word: מַמְלַכְתּוֹ
  choice: 他的国
  rationale: מַמְלָכָה可指王国或王权；此处“他的国”简洁自然，并与大卫王朝应许的语境相合。
theological_decisions:
- issue: 大卫之约中זַרְעֲךָ所指的范围
  choice: 你的后裔
  alternative: 你的一个后代／你的子孙
  rationale: 原文既容许指紧接大卫而来的具体继承者，也保留更广的王朝延续及代表性单数含义。“后裔”不把经文限定为仅一人或仅一个集合，从而保留其神学张力。
- issue: “他的国”与“后裔”的数的一致性
  choice: 保留单数代词“他的”
  alternative: 他们的国
  rationale: 原文מַמְלַכְתּוֹ明确使用第三人称阳性单数后缀。即使זֶרַע可有集合意义，本句仍将其作为一位代表性的继承者来指称，因此不改为复数。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“日子满了”“与列祖同睡”“兴起”“坚立”等表达保留原文的王室与圣约语气；脚注说明不易在正文中完整呈现的数范畴歧义和身体习语。
