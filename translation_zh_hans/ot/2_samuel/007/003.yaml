  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר נָתָן֙ אֶל הַ/מֶּ֔לֶךְ כֹּ֛ל אֲשֶׁ֥ר בִּֽ/לְבָבְ/ךָ֖ לֵ֣ךְ עֲשֵׂ֑ה כִּ֥י יְהוָ֖ה עִמָּֽ/ךְ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/003.yaml
  text: And Nathan said to the king[a], “Go, do all that is in your heart, for Yahweh is with you.”
translation:
  language: zh_hans
  text: 拿单对王说：“你心里所想的一切，只管去做[a]，因为雅威与你同在。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“去吧，凡你心里所想的，都去做。”希伯来语“在你心里”可指心中的想法、意愿或打算。
    reason: 说明两个祈使语的表达方式及希伯来语“心”这一习语的含义范围。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 前置的叙事连接形式推进情节；现代汉语通常不必机械译出“于是”或“然后”，上下文已能表达顺承。
- source_word: נָתָן
  choice: 拿单
  rationale: 采用现代中文圣经中通行的人名音译。
- source_word: אֶל הַמֶּלֶךְ
  choice: 对王
  rationale: 希伯来文使用带定冠词的普通名词“王”，没有在本节直称大卫，因此不从上下文补入其名。
- source_word: כֹּל אֲשֶׁר בִּלְבָבְךָ
  choice: 你心里所想的一切
  rationale: לֵבָב在这里指人的内在思想、意愿或打算；“心里所想”保留原文意象，同时在现代汉语中自然清楚。
- source_word: לֵךְ עֲשֵׂה
  choice: 只管去做
  rationale: 两个祈使形式表达准许和鼓励；“只管去做”自然传达“去，做吧”的语用力度，而不把“去”误解为必须前往某地。
- source_word: כִּי
  choice: 因为
  rationale: 此处引出拿单如此劝告的理由，译作“因为”直接明晰。
- source_word: יְהוָה
  choice: 雅威
  rationale: 原文直接使用四字神名；“雅威”按其较公认的读音音译，保留专名性质，不以头衔替代。
- source_word: עִמָּךְ
  choice: 与你同在
  rationale: 直译其同在、伴随之意，并保留这一表达可能具有的神学内涵，不擅自扩展为“支持你”或“站在你一边”。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 本节使用的是神的专名而非“主”这一头衔。“雅威”更直接反映通常重构的读音 Yahweh；“耶和华”虽为中文传统译名，却源于较晚的混合读法。
- issue: “雅威与你同在”的含义范围
  choice: 保留“与你同在”
  alternative: 雅威支持你
  rationale: 原文明确表达同在，但没有在词面上限定为认可大卫此刻的全部设想；鉴于后文将修正拿单的即时判断，不宜在本节擅自加强为无条件赞同。
translation_notes:
  register: 采用自然、庄重而简明的现代标准汉语。“只管去做”传达拿单当下给予许可和鼓励的口吻；保留“心里”与“同在”等原文意象。
