id: 2SA.7.24
reference: 2 Samuel 7:24
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/תְּכ֣וֹנֵֽן לְ֠/ךָ אֶת עַמְּ/ךָ֨ יִשְׂרָאֵ֧ל לְ/ךָ֛ לְ/עָ֖ם עַד עוֹלָ֑ם וְ/אַתָּ֣ה יְהוָ֔ה הָיִ֥יתָ לָ/הֶ֖ם לֵ/אלֹהִֽים־׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/024.yaml
  text: And you established your people Israel for yourself to be your people forever[a], and you, Yahweh[b], became their God.
translation:
  language: zh_hans
  text: 你为自己坚立了你的子民以色列，使他们永远作你的子民；耶和华[a]啊，你成了[b]他们的上帝。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “耶和华”是希伯来文上帝专名YHWH的传统中文译法。
    reason: alternative_reading
  - marker: b
    text: “成了”也可译作“是”。这里按上下文译为“成了”，以表达盟约关系的确立。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּכוֹנֵן
  choice: 坚立了
  rationale: כון在此使役性词形中表示使之稳固、确立。“坚立”既保留“使稳固”的意象，也符合上帝确立以色列盟约身份的语境。
- source_word: לְךָ ... לְךָ לְעָם
  choice: 为自己……作你的子民
  rationale: 重复的לְךָ强调以色列归属于耶和华，并被确立为他的子民；此译保留了原文的重复和盟约归属关系。
- source_word: עַמְּךָ יִשְׂרָאֵל
  choice: 你的子民以色列
  rationale: 按原文保留“你的子民”与专名“以色列”的同位关系。
- source_word: עַד עוֹלָם
  choice: 永远
  rationale: 简明自然地表达持续而长久的效力，不额外界定其哲学或时间含义。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的形式音译上帝的专名YHWH，而不以称号取代。
- source_word: הָיִיתָ לָהֶם לֵאלֹהִים
  choice: 你成了他们的上帝
  rationale: היה与ל的结构在本段语境中可表达进入或确立某种关系；“成了”呼应前半句以色列被确立为上帝子民的盟约关系，同时以脚注保留状态性译法。
theological_decisions:
- issue: 盟约公式中הָיִיתָ的动态或状态含义
  choice: 你成了他们的上帝
  alternative: 你是他们的上帝
  rationale: 上下文叙述上帝确立以色列为自己的子民，因此动态译法能体现盟约关系的确立；但希伯来语也容许状态性理解，故不将另一读法排除，而在脚注中注明。
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 上主
  rationale: 原文使用的是上帝的专名而非称号；正文保留中文传统中通行的专名形式，并以脚注说明其来源。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。“耶和华啊”自然呈现原文在祷告中的直接称呼；分号对应前后两项互为呼应的盟约关系。
