source:
  edition: WLC
  text: עַל כֵּ֥ן גָּדַ֖לְתָּ אֲדֹנָ֣/י יְהוִ֑ה כִּֽי אֵ֣ין כָּמ֗וֹ/ךָ וְ/אֵ֤ין אֱלֹהִים֙ זֽוּלָתֶ֔/ךָ בְּ/כֹ֥ל אֲשֶׁר שָׁמַ֖עְנוּ בְּ/אָזְנֵֽי/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/022.yaml
  text: Therefore you are great[a], Lord GOD, for there is none like you, and there is no God besides you[b], according to all that we have heard with our ears.
translation:
  language: zh_hans
  text: 所以，主雅威[a]啊，你何其伟大！因为没有谁能与你相比；除你以外，也没有神[b]——这正合乎我们亲耳所听见的一切。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “主雅威”原文为“阿多奈·雅威”，由“主”和上帝的专名“雅威”组成；“雅威”也常译作“耶和华”。
    reason: 说明复合神名及传统译名。
  - marker: b
    text: 也可译作：“除你以外也没有上帝”或“在你之外没有神”。
    reason: 保留 אֱלֹהִים 和 זוּלָתֶךָ 的可行词汇表达。
lexical_decisions:
- source_word: עַל כֵּן
  choice: 所以
  rationale: 承接上文上帝的应许和作为，引出大卫由此作出的颂赞与推论。
- source_word: גָּדַלְתָּ
  choice: 你何其伟大
  rationale: 该完成式在颂赞语境中可表达上帝伟大这一确立并被承认的事实；用感叹句自然传达希伯来文的颂赞语气，同时不扩写为“显明自己伟大”。
- source_word: אֲדֹנָי יְהוִה
  choice: 主雅威
  rationale: 分别保留 אֲדֹנָי“主”和上帝的专名 יהוה；“雅威”以现代汉语音译呈现圣名，避免把两个成分合并为同一个称号。
- source_word: אֵין כָּמוֹךָ
  choice: 没有谁能与你相比
  rationale: 自然表达希伯来文关于上帝无可比拟的固定说法；“谁”不预先限定比较对象的类别。
- source_word: וְאֵין אֱלֹהִים זוּלָתֶךָ
  choice: 除你以外也没有上帝
  rationale: זוּלָתֶךָ 表示“除你以外、在你之外”；译文直接保留独一神的排他性宣告，不作哲学化扩充。
- source_word: בְּכֹל אֲשֶׁר שָׁמַעְנוּ בְּאָזְנֵינוּ
  choice: 这一切正如我们亲耳所听见的
  rationale: 保留 בְּ 所表达的依据或符合关系，并以“亲耳”自然再现“用我们的耳朵听见”这一强调性惯用语。
theological_decisions:
- issue: 复合称号 אֲדֹנָי יְהוִה 中圣名 יהוה 的译法
  choice: 主雅威
  alternative: 主耶和华；主上帝
  rationale: 原文直接使用四字圣名。译作“雅威”可区分专名与 אֲדֹנָי“主”，也避免把原文两个不同成分扁平化为普通称号。脚注说明这一点，以照顾熟悉传统译名的读者。
- issue: אֵין אֱלֹהִים זוּלָתֶךָ 的排他性
  choice: 除你以外也没有上帝
  alternative: 除你以外也没有神
  rationale: 译文保留原文对上帝独一性的直接宣认，不借此加入后期系统神学的进一步表述；“上帝”在此明确指真正的神。
- issue: 末句 בְּכֹל אֲשֶׁר שָׁמַעְנוּ בְּאָזְנֵינוּ 的修饰范围
  choice: 用破折号承接前面的整项宣告
  alternative: 仅紧接“没有上帝”一句
  rationale: 希伯来文末置短语的范围可理解为依据前述整个宣认，也可较窄地关联邻近分句。译文不把它硬性限制为只修饰其中一句。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“何其伟大”保留祷告颂赞的语气；“亲耳所听见”是现代读者易懂的强调表达。标点用分号与破折号呈现原文两个平行否定句及末置依据短语之间的关系。
