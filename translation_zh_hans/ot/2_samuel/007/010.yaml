language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/שַׂמְתִּ֣י מָ֠קוֹם לְ/עַמִּ֨/י לְ/יִשְׂרָאֵ֤ל וּ/נְטַעְתִּי/ו֙ וְ/שָׁכַ֣ן תַּחְתָּ֔י/ו וְ/לֹ֥א יִרְגַּ֖ז ע֑וֹד וְ/לֹֽא יֹסִ֤יפוּ בְנֵֽי עַוְלָה֙ לְ/עַנּוֹת֔/וֹ כַּ/אֲשֶׁ֖ר בָּ/רִאשׁוֹנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/010.yaml
  text: And I will appoint a place for my people Israel and will plant them[a], so that they may dwell in their own place and be disturbed no more. And the sons of wickedness shall no longer afflict them, as formerly.
translation:
  language: zh_hans
  text: 我要为我的子民以色列指定一个地方，把他们栽种在那里，使他们在自己的地方安居，不再受搅扰。不义之徒[a]不再像从前那样欺压他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“不义之子”，即作恶的人。
    reason: 保留希伯来习语的字面形式，同时说明其自然含义。
lexical_decisions:
- source_word: וְשַׂמְתִּי מָקוֹם
  choice: 选定一个地方
  rationale: שׂוּם的基本义是“放置、设立”；与“地方”搭配并用于应许语境时，表达为以色列安排、指定居所。“选定”既自然，也保留上帝主动安排的含义。
- source_word: לְעַמִּי לְיִשְׂרָאֵל
  choice: 为我的子民以色列
  rationale: 两个短语构成同位关系，既保留“我的子民”所表达的归属，也明确其所指是以色列。
- source_word: וּנְטַעְתִּיו
  choice: 把他们栽种下来
  rationale: 原文以阳性单数代词指作为集合体的以色列。中文用“他们”自然地指全体百姓；“栽种”保留原文关于稳固扎根的农业比喻，“下来”表达安顿稳固的语感。
- source_word: וְשָׁכַן תַּחְתָּיו
  choice: 使他们安居在自己的地方
  rationale: 动词和代词在希伯来文中均以集合单数指以色列。תַּחְתָּיו在此表示安居本位，而非空间上的“在它下面”；“安居在自己的地方”清楚传达定居与安稳。
- source_word: וְלֹא יִרְגַּז עוֹד
  choice: 不再受搅扰
  rationale: רגז可指震动、战栗或遭受动荡。上下文谈外敌欺压，因此“受搅扰”兼顾外来侵扰和不安定的状态，而不局限于内心恐惧。
- source_word: בְנֵי עַוְלָה
  choice: 不义之徒
  rationale: 字面为“不义之子”，是指以不义为特征之人的希伯来习语。正文采用自然而庄重的中文“不义之徒”，脚注保存字面表达。
- source_word: לְעַנּוֹתוֹ
  choice: 欺压他们
  rationale: ענה的Piel词形在此可指使人受苦、压迫或欺凌。鉴于上下文涉及恶人对以色列的敌对行为，“欺压”准确而自然。
- source_word: כַּאֲשֶׁר בָּרִאשׁוֹנָה
  choice: 像从前那样
  rationale: 该短语回指以往受压迫的时期；“像从前那样”保留时间比较，符合现代中文表达。
theological_decisions:
- issue: 以色列作为集合单数，与中文复数指代的关系
  choice: 用“他们”指以色列百姓
  alternative: 全程采用单数拟人表达，如“把他栽种下来，使他安居”
  rationale: 希伯来文常以阳性单数指一个民族整体；现代中文若用“他”指以色列，容易被理解为某个男子。用“他们”明确所指为全体百姓，不改变神学含义。
- issue: בְנֵי עַוְלָה的字面形式与习语意义
  choice: 正文译作“不义之徒”，脚注注明字面为“不义之子”
  alternative: 正文直译“不义之子”
  rationale: “不义之子”在现代中文中容易被误解为血缘关系；“不义之徒”自然传达希伯来习语所指，同时以脚注保留原文的男性复数和修辞形式。
- issue: וְשָׁכַן与前句的逻辑关系
  choice: 译为结果性表达“使他们安居”
  alternative: 并列译为“他们就安居”
  rationale: 原文连接词可容纳并列或结果关系；上下文中“栽种”带来稳固定居，中文用“使”自然呈现这一结果，但不加入额外的神学因果主张。
translation_notes:
  register: 采用现代、庄重且便于普通读者理解的书面中文。“栽种”保留诗性比喻；“安居”“欺压”符合历史叙事和应许语境。句法分为两句，以清楚呈现安置的应许与停止受压迫的应许。
