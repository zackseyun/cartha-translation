  text: וְ/נֶאְמַ֨ן בֵּיתְ/ךָ֧ וּ/מַֽמְלַכְתְּ/ךָ֛ עַד עוֹלָ֖ם לְ/פָנֶ֑י/ךָ כִּֽסְאֲ/ךָ֔ יִהְיֶ֥ה נָכ֖וֹן עַד עוֹלָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/016.yaml
  text: And your house and your kingdom shall be made sure forever before me[b][a]; your throne shall be established forever.
translation:
  language: zh_hans
  text: 你的家[a]和你的国必在你面前[b]永远坚立；你的王位必永远稳固。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的“家”很可能指王室，也就是大卫的王朝。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文本作“在你面前”；一些古代文本见证作“在我面前”。
    reason: textual_variant
lexical_decisions:
- source_word: וְנֶאְמַן
  choice: 必……坚立
  rationale: אמן 的尼法勒式在此表示被确立、成为牢靠并长久存续。“坚立”既保留其稳固持久的含义，也适合王朝应许的语境；同时与后文 נָכוֹן 所译的“稳固”有所区别。
- source_word: בֵּיתְךָ
  choice: 你的家
  rationale: בַּיִת 的字面义为“家”，在君王应许的语境中可指王室或王朝。正文保留源语意象，以脚注说明其王朝含义，避免在正文中过早消解其语义层次。
- source_word: וּמַמְלַכְתְּךָ
  choice: 和你的国
  rationale: מַמְלָכָה 可指王国、王权或统治；此处与“家”和“王位”并列，“国”是简洁自然且符合语境的译法。
- source_word: עַד עוֹלָם
  choice: 永远
  rationale: 该短语表达无尽的延续。两处均译为“永远”，保留原文的重复和强调。
- source_word: לְפָנֶיךָ
  choice: 在你面前
  rationale: 所提供的 WLC 正文为第二人称阳性单数，直译是“在你面前”。正文据此翻译；“在我面前”的异文另列脚注。
- source_word: כִּסְאֲךָ
  choice: 你的王位
  rationale: כִּסֵּא 字面可指“宝座”，也常转指君王的地位与统治。此处“王位”能自然表达其政治及王朝意义。
- source_word: יִהְיֶה נָכוֹן
  choice: 必……稳固
  rationale: נָכוֹן 与 היה 连用，表示处于牢固、确立的状态。“必稳固”简洁自然，并与前句“坚立”形成适度区别。
theological_decisions:
- issue: 王朝应许及其可能具有的弥赛亚意义
  choice: 正文保留“家”“国”和“王位”等历史性的王朝用语，不明说其弥赛亚应验。
  alternative: 把“家”直接译为“王朝”，或在正文中明确指向弥赛亚。
  rationale: 本节首先在大卫之约的历史语境中应许大卫的王室与统治长久存续。后续信仰传统可从中看见更广的弥赛亚意义，但译文不应把这一解释直接加入原文。
- issue: “在你面前”与“在我面前”的文本差异
  choice: 按所给 WLC 正文译作“在你面前”，并用脚注保留“在我面前”的异文。
  alternative: 正文采用“在我面前”，脚注注明“在你面前”。
  rationale: 所给希伯来文本 לְפָנֶיךָ 明确是第二人称“在你面前”；但“在我面前”有文本见证支持，也与上帝直接说话的语境相合，因此必须注明而不宜无声排除。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“坚立”与“稳固”保留原文两个不同表达之间的细微区别；分号呈现两句紧密相连而各有重点的应许。
