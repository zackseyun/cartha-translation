  to: 因为你——万军之耶和华、以色列的神——已经向你的仆人揭示了这事[a]，说：“我要为你建立一个家。”[b] 因此，你的仆人鼓起勇气[c]，向你祷告，献上这祷告。
  rationale: 修订“家室”为“一个家”，以减少现代汉语中偏向妻子儿女的理解，同时保留原文“房屋／家”与家系、王朝之间的语义关联；相应微调脚注。末句改为更自然的现代庄重汉语，并保留“鼓起勇气”对原文习语的释义。
