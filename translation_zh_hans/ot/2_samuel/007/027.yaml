source:
  edition: WLC
  text: כִּֽי אַתָּה֩ יְהוָ֨ה צְבָא֜וֹת אֱלֹהֵ֣י יִשְׂרָאֵ֗ל גָּלִ֜יתָה אֶת אֹ֤זֶן עַבְדְּ/ךָ֙ לֵ/אמֹ֔ר בַּ֖יִת אֶבְנֶה לָּ֑/ךְ עַל כֵּ֗ן מָצָ֤א עַבְדְּ/ךָ֙ אֶת לִבּ֔/וֹ לְ/הִתְפַּלֵּ֣ל אֵלֶ֔י/ךָ אֶת הַ/תְּפִלָּ֖ה הַ/זֹּֽאת־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/027.yaml
  text: For you[a], O Yahweh of hosts, God of Israel, have revealed this to your servant, saying[c][b], ‘I will build you a house.’ Therefore your servant has found it in his heart to pray this prayer to you.
translation:
  language: zh_hans
  text: 因为你——万军之耶和华、以色列的神——已经向你的仆人揭示了这事[a]，说：“我要为你建立一个家。”[b] 因此，你的仆人鼓起勇气[c]，向你祷告，献上这祷告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“揭开你仆人的耳朵”，这是表示把事情透露或启示给人的希伯来习语。
    reason: lexical_alternative
  - marker: b
    text: 原文为“房屋／家”。在本章语境中，这个词也指大卫的家系和王朝，并与大卫想为耶和华建造殿宇的心愿相呼应。
    reason: lexical_alternative
  - marker: c
    text: 原文直译为“找到了自己的心”，意思是获得勇气或下定决心。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: 万军之耶和华
  rationale: 采用现代中文圣经语体中清楚而庄重的称号；“万军”保留צְבָאוֹת可涵盖天上和地上众军的广度，“耶和华”则标明神的盟约之名。
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: 以色列的神
  rationale: 直接保留原文对神与以色列之关系的称谓。
- source_word: גָּלִיתָה אֶת אֹזֶן עַבְדְּךָ
  choice: 已经向你的仆人揭示了这事
  rationale: 原文直译为“揭开你仆人的耳朵”，是表示透露、启示的希伯来习语；正文传达其实际意义，脚注保留字面形象。
- source_word: עַבְדְּךָ
  choice: 你的仆人
  rationale: 符合大卫在神面前自谦的祷告语境，也保留原文两次重复此称谓的特点。
- source_word: בַּיִת אֶבְנֶה לָּךְ
  choice: 我要为你建立家室
  rationale: “家室”在中文中可指家族、家系，适合本章有关大卫王朝的应许，同时不把בַּיִת窄化为具体建筑；脚注说明其字面义及语境中的双关。
- source_word: עַל כֵּן
  choice: 因此
  rationale: 准确表达神先启示、大卫继而祷告的推论关系。
- source_word: מָצָא ... אֶת לִבּוֹ
  choice: 才鼓起勇气
  rationale: 这是“找到自己的心”的希伯来习语，在此表示获得勇气或决心；“才”也自然承接前面的因果关系。
- source_word: לְהִתְפַּלֵּל אֵלֶיךָ אֶת הַתְּפִלָּה הַזֹּאת
  choice: 向你作这祷告
  rationale: 简洁传达直接向神祷告以及“这祷告”的特指意味。
theological_decisions:
- issue: “房屋／家”的盟约含义
  choice: 正文译作“建立家室”
  alternative: 建造房屋；为你建立一个家；建立王朝
  rationale: 本章以בַּיִת形成关键文字关联：大卫想为神建殿，神却应许为大卫建立“家”，即延续其家系和王权。译作“家室”能指向家系而不直接以“王朝”消除原文的词义张力；脚注保留“房屋”的字面可能。
- issue: 启示的希伯来习语
  choice: 正文表达为“向你的仆人揭示了这事”
  alternative: 揭开你仆人的耳朵
  rationale: 逐字表达在现代中文中容易被误解为身体动作；正文传达神主动透露应许之意，脚注则保存原文形象。
- issue: 大卫祷告时的内心状态
  choice: 译作“鼓起勇气”
  alternative: 找到了自己的心；定意
  rationale: 原文习语既可侧重勇气，也可侧重决心。正文采用自然中文“鼓起勇气”，脚注说明字面形式和可能的语义范围，避免把它解释成某种特殊属灵经验。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。以破折号标出对耶和华身份的同位说明，保留“你的仆人”的重复和经文的因果推进；对现代读者不透明的希伯来习语采取正文释义、脚注存真的处理。
