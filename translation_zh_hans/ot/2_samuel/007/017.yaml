- from: 拿单就照这一切话和这一切异象[a]，这样告诉了大卫。
  to: 拿单就把这一切话和这整个异象[a]的内容，全都告诉了大卫。
  rationale: 修订以“这一切话”和“这整个异象的内容”分别对应两个重复的“照着全部”短语；“全都告诉了”在自然汉语中表达拿单完整、如实地传达两者，同时避免把单数“异象”误作多个异象。脚注保留原有的合理词义替译及说明。
