base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/017.yaml
  text: According to all these words and according to all this vision[a], so Nathan spoke to David.
translation:
  language: zh_hans
  text: 拿单就把这一切话和这整个异象[a]的内容，全都告诉了大卫。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“启示”。希伯来语这个词指先知所得的启示，常以异象的形式领受。
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּכֹל
  choice: 照这一切
  rationale: 介词כְּ表示依照、符合，כֹל表示全部；译作“照这一切”既自然，也保留原文强调拿单忠实传达的意思。
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: 这一切话
  rationale: דְּבָרִים在此指所传达的神谕内容，译作“话”比“事情”更贴合语境。
- source_word: וּכְכֹל
  choice: 和这一切
  rationale: 保留原文连接词及重复结构，与前面的“一切话”形成平行，体现其强调作用。
- source_word: הַחִזָּיוֹן הַזֶּה
  choice: 这一切异象
  rationale: חִזָּיוֹן指先知性的异象或启示性所见；“异象”是直接而通行的对应词。这里的כֹל修饰异象，可理解为异象的全部内容，故用“这一切异象”。
- source_word: כֵּן
  choice: 这样
  rationale: כֵּן承接前面的两个比较短语，表示拿单正是按上述内容传达；“这样”保留其总结和呼应作用。
- source_word: דִּבֶּר
  choice: 告诉了
  rationale: דבר基本义为“说、讲”。因后接对象大卫，现代汉语用“告诉了”更自然，并明确表达向大卫传达信息，不增添原文没有的权威色彩。
- source_word: נָתָן
  choice: 拿单
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: אֶל דָּוִד
  choice: 大卫
  rationale: אֶל标示说话所指向的对象；在“告诉大卫”结构中，其方向关系已由动词自然表达。
theological_decisions:
- issue: חִזָּיוֹן所指的先知启示性质
  choice: 正文译作“异象”
  alternative: 启示；先知异象
  rationale: “异象”直接保留希伯来词所表达的启示性观看方式，既不把它弱化为一般信息，也不扩充成原文未明说的解释性称谓。脚注列出“启示”作为语境上的可选译法。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。保留原文“一切话／一切异象”的平行与כֵּן“这样”的回指结构；用“告诉了”避免逐字译成“向大卫说”所产生的生硬感。
