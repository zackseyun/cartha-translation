    rationale: “照着……告诉”与“这样”同时使用在现代汉语中显得堆叠；将内容前置为“把……全都告诉了”可自然表达忠实、完整的转述。
  revised_text: 拿单就把这一切话和这整个异象[a]的内容，全都告诉了大卫。
