revisions:
- from: 王住在自己的宫中[a]，耶和华使他安享太平，不受四围一切仇敌的侵扰。
  to: 王住在自己的家中[a]，耶和华使他从四围一切仇敌中得享安宁。
  rationale: 修订将原文的“家／房屋”保留在正文，脚注说明其可指王宫，因而同时顾及现代中文的理解和本章的文学结构。又以“得享安宁”直接表达耶和华使大卫脱离敌人而得安息的因果关系，未加入额外神学或历史解释。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T05:26:43Z'
review_pass:
  verdict: revise
  source_fidelity: 正文准确传达了王已安居、耶和华使他脱离四围所有仇敌而得安宁的意思；但将 בְּבֵיתוֹ 直接译为“宫中”弱化了原文刻意使用“房屋／家”一词、并为本章后续文字呼应所作的铺垫。采用“家中”并以脚注说明“宫殿”这一语境义，可更好保留原文措辞与歧义。
  naturalness: “王住在自己的家中”在现代汉语中自然、庄重。“使他得享安宁”较“使他安享太平”更贴近“赐他安息／安宁”，且不额外引入“太平”的政治色彩。“从四围一切仇敌中得享安宁”保留了原文的空间与来源关系。
  terminology: “耶和华”恰当保留四字神名的专名性质。“家”应在正文保留；脚注可说明此处在王室语境中可指宫殿，并指出本章后文“殿／家室（王朝）”的相关用语。
  issues:
  - severity: medium
    issue: 正文将“房屋／家”译作“宫中”
    rationale: בַּיִת 的王室语境义确可指宫殿，但原文选择的是通常的“房屋／家”一词，并在本章发展出与耶和华的殿及大卫家室相关的文字呼应。仅以“宫中”置于正文会削弱此一可见的词汇联系；脚注不应完全取代正文的保留。
  - severity: low
    issue: “安享太平”略偏解释性
    rationale: הֵנִיחַ 表示使其得安息、安宁，且后接“脱离四围所有仇敌”。“得享安宁”更直接对应原文，并避免“太平”可能带出的较宽泛政治状态。
  revised_text: 王住在自己的家中[a]，耶和华使他从四围一切仇敌中得享安宁。
