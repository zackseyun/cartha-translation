  text: וַ/יְהִ֕י כִּי יָשַׁ֥ב הַ/מֶּ֖לֶךְ בְּ/בֵית֑/וֹ וַ/יהוָ֛ה הֵנִֽיחַ ל֥/וֹ מִ/סָּבִ֖יב מִ/כָּל אֹיְבָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/001.yaml
  text: When the king was living in his house[a], and Yahweh had given him rest on every side from all his enemies,
translation:
  language: zh_hans
  text: 王住在自己的家中[a]，耶和华使他从四围一切仇敌中得享安宁。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文为“自己的房屋／家中”；在王室语境中也可指“自己的宫殿”。原文的“家”字也为本章后文有关耶和华的“殿”和大卫“家室”的文字呼应作铺垫。
    reason: 保留 בַּיִת 的基本义、王室语境中的可能含义，以及本章内的词汇呼应。
lexical_decisions:
- source_word: וַיְהִי כִּי
  choice: （以“王住在……”起句）
  rationale: 这是希伯来叙事中引入场景的时间结构；中文可直接用分句表达背景，无须添加古雅的“事情发生在”。
- source_word: יָשַׁב
  choice: 住
  rationale: 此处表示定居、居住的状态，并非身体上的“坐”。
- source_word: הַמֶּלֶךְ
  choice: 王
  rationale: 保留原文的确定称号，不以“大卫”替换。
- source_word: בְּבֵיתוֹ
  choice: 在自己的宫中
  rationale: בַּיִת 基本义为“房屋、家”，此处指王的住所，现代中文自然称“宫”；脚注说明直译，并保留本章后文“家/殿”相关文字呼应的信息。
- source_word: וַיהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名“耶和华”表达四字神名，并保留其专名性质。
- source_word: הֵנִיחַ לוֹ
  choice: 使他安享太平
  rationale: 使役形表达赐予安息、免受战争扰害；“使他安享太平”在中文中自然，并保留神为施事者。
- source_word: מִסָּבִיב מִכָּל אֹיְבָיו
  choice: 不受四围一切仇敌的侵扰
  rationale: 将“从四围、从他所有仇敌而得安息”的来源关系自然转化为中文，完整保留“四围”和“一切仇敌”。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用四字神名；译为中文传统且通行的专名“耶和华”，不以“主”替代，从而保留这是神名的性质。
- issue: בַּיִת 在王室语境及本章文字呼应中的处理
  choice: 正文译“宫”，脚注注明原文为“房屋／家”
  alternative: 正文译“家中”
  rationale: “宫”符合王室住所的现代中文表达；脚注保留原词本义及其与后文“家、殿”多义运用的文学联系，避免完全抹平原文措辞。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。经文在希伯来文中是引向下一节的背景从句；中文保留句末延续感。
