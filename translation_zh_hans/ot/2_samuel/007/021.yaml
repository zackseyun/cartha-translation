base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/021.yaml
  text: Because of your word and according to your heart[a], you have done all this greatness[c][b], to make your servant know it.
translation:
  language: zh_hans
  text: 你因着你的话[a]，照着你的心意[b]，成就了这一切伟大的作为[c]，为要让你的仆人知道这一切。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “因着你的话”也可译作“为了你的话”或“因你的应许”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译“照着你的心”，意思是照着你自己的意愿或意图。
    reason: lexical_alternative
  - marker: c
    text: 原文用单数抽象名词，字面为“这一切伟大”；也可译作“这一切伟大的事”或“这一切伟业”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּעֲבוּר דְּבָרְךָ
  choice: 因你的话
  rationale: בַּעֲבוּר 表示原因、根据或目的；דָּבָר 可指“话”、所说之事或应许。译作“因你的话”既自然，也保留其语义宽度及上下文中的应许意味。
- source_word: וּכְלִבְּךָ
  choice: 又照你的心意
  rationale: לֵב 字面为“心”，在此指内在意愿、意图。“心意”保留希伯来语的心之意象，同时在现代汉语中清楚自然。
- source_word: עָשִׂיתָ
  choice: 成就了
  rationale: 完成式表示已经完成、且与当前祷告相关的行动；“成就了”适合上帝实现其所说之话的语境，但不把“话”明确限定为正式应许。
- source_word: אֵת כָּל הַגְּדוּלָּה הַזֹּאת
  choice: 这一切大事
  rationale: 希伯来语以单数抽象名词“伟大”概括上帝宏大的作为。汉语“这一切大事”表达自然，并保留整体性的概括；脚注说明原文形式。
- source_word: לְהוֹדִיעַ אֶת עַבְדֶּךָ
  choice: 为要让你的仆人知道这一切
  rationale: הוֹדִיעַ 是 ידע 的使役式，意为“使……知道”。汉语补出由上下文可知的宾语“这一切”，使句意完整而不改变所指。
- source_word: עַבְדֶּךָ
  choice: 你的仆人
  rationale: 在君王祷告中，这是大卫在上帝面前谦卑的自称；“仆人”比“奴隶”更符合此处语域。
theological_decisions:
- issue: 大卫之约语境中“你的话”的所指
  choice: 保留为“你的话”
  alternative: 你的应许；你所说的
  rationale: 上下文确实指向上帝对大卫所说的应许，但原文用宽泛的 דָּבָר。保留“话”可让读者从上下文领会应许含义，而不在正文中缩窄其范围。
- issue: “照你的心”的拟人表达
  choice: 译为“照你的心意”，并以脚注保留字面形式
  alternative: 照你的旨意；照你的意愿
  rationale: 原文以“心”表达上帝内在的意愿和意图。“心意”既保留这一意象，又避免现代汉语中“照你的心”可能产生的不自然感。
- issue: “这一切伟大”的整体性
  choice: 正文译作“这一切大事”
  alternative: 这一切伟业；这一切伟大的作为
  rationale: 原文用单数抽象名词将上帝的作为视为一个整体。中文正文采用自然说法，脚注则保留其语法和修辞信息，避免将其武断地解释为若干彼此分开的神迹。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。“成就”与“心意”符合当代标准汉语，也保留经文的盟约语境和希伯来语意象。所有脚注标记均置于相关词语之后。
