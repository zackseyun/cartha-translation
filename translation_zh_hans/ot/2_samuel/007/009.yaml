base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/009.yaml
  text: And I was with you wherever you went[a], and I cut off all your enemies from before you. And I will make for you a great name[b], like the name of the great ones who are on the earth.
translation:
  language: zh_hans
  text: 你无论到哪里去，我都与你同在；我从你面前剪除了你所有的仇敌。我要使你得大名[a]，如同世上[c]伟人[b]的名。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “大名”也可译作“盛名”或“显赫的声望”。希伯来文的“名”常含名声、声望之意；正文保留原文的“名”。
    reason: lexical_alternative
  - marker: b
    text: “伟人”直译“伟大者”，也可译作“大人物”或“显要人物”。
    reason: alternative_reading
  - marker: c
    text: “世上”也可译作“地上”或“这地上”；希伯来文 אֶרֶץ 可指全地，也可指特定地域。
    reason: lexical_ambiguity
lexical_decisions:
- source_word: וָאֶהְיֶה עִמְּךָ
  choice: 我都与你同在
  rationale: 保留“与你同在”所表达的临在与扶助；上下文已表明这是对过去行动的回顾，现代汉语无需生硬添加“曾经”。
- source_word: בְּכֹל אֲשֶׁר הָלַכְתָּ
  choice: 你无论到哪里
  rationale: 这是自然的现代汉语表达，也保留了原文涵盖所有去处的范围。
- source_word: וָאַכְרִתָה
  choice: 我……剪除了
  rationale: “剪除”保留כרת具体而有力的意象，并由完成体“了”清楚表达过去的行动。
- source_word: מִפָּנֶיךָ
  choice: 从你面前
  rationale: 保留希伯来文的空间性惯用语，表达仇敌从大卫面前和道路上被除去。
- source_word: וְעָשִׂיתִי לְךָ
  choice: 我要使你得享
  rationale: 在先回顾往事、继而宣告应许的语境中采用将来表达；“得享”自然体现לְךָ的受益含义。
- source_word: שֵׁם גָּדוֹל
  choice: 大名
  rationale: 保留“名”的圣经意象及互文联系，同时现代读者能自然理解为显赫名声。
- source_word: כְּשֵׁם הַגְּדֹלִים
  choice: 像……伟人所享的名一样
  rationale: 重复“名”以保留原文的平行结构；“伟人”没有在正文中额外限定具体身份。
- source_word: אֲשֶׁר בָּאָרֶץ
  choice: 世上的
  rationale: 此处是与广泛知名人物作比较，“世上”较符合语境，同时以脚注保留“地上”的可能性。
theological_decisions:
- issue: וְעָשִׂיתִי在神谕语境中的时态指向
  choice: 译作将来应许：“我要使你得享大名”
  alternative: 译作完成行动：“我已经使你得享大名”
  rationale: 虽然该动词形式为完成式，但话语从回顾神过去的作为转向对大卫的应许；将来表达较能呈现此处的语篇推进，也与《历代志上》17:8的平行经文相符。
- issue: הַגְּדֹלִים所指群体的范围
  choice: 译作“伟人”
  alternative: 译作“大人物”或“显要人物”
  rationale: 原文是复数实体化形容词，意为“伟大者”；正文不进一步规定其社会身份或以中文性别词加以窄化。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“剪除”“大名”保留原文鲜明的圣经意象；句式避免过度古雅。“所享的名”补足自然汉语所需的关系，同时不改变比较对象。
