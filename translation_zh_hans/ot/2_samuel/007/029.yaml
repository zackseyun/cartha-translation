  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/עַתָּ֗ה הוֹאֵל֙ וּ/בָרֵךְ֙ אֶת בֵּ֣ית עַבְדְּ/ךָ֔ לִ/הְי֥וֹת לְ/עוֹלָ֖ם לְ/פָנֶ֑י/ךָ כִּֽי אַתָּ֞ה אֲדֹנָ֤/י יְהוִה֙ דִּבַּ֔רְתָּ וּ/מִ/בִּרְכָ֣תְ/ךָ֔ יְבֹרַ֥ךְ בֵּֽית עַבְדְּ/ךָ֖ לְ/עוֹלָֽם־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/029.yaml
  text: And now[a], please be willing and bless the house of your servant, that it may continue before you forever. For you, Lord Yahweh, have spoken[c][b], and by your blessing the house of your servant will be blessed forever.
translation:
  language: zh_hans
  text: 现在，求你乐意[a]赐福给你仆人的家[b]，使它永远在你面前。主耶和华[c]啊，因为你已经说了，所以你仆人的家必因你的赐福永远蒙福。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “乐意”也可译作“欣然同意”或“允准”。
    reason: lexical_alternative
  - marker: b
    text: 这里的“家”也可指“家族”或“王朝”。
    reason: lexical_alternative
  - marker: c
    text: 希伯来文是“阿多奈·YHWH”，即称号“主”与上帝的专名“耶和华”连用。
    reason: alternative_reading
lexical_decisions:
- source_word: הוֹאֵל
  choice: 求你乐意
  rationale: 该词在使役词干中表达愿意、欣然同意。译作“求你乐意”既保留祈求语气，也自然传达大卫恳求上帝施恩允准的意思。
- source_word: וּבָרֵךְ
  choice: 赐福给
  rationale: 这是动词“赐福”的命令式；在向上帝祷告的语境中，“赐福给”是清楚自然的现代汉语表达。
- source_word: בֵּית עַבְדְּךָ
  choice: 你仆人的家
  rationale: “家”可兼指家室、家族和王朝，保留原文在本章中的多层含义，也保留“家”在圣殿与大卫王朝之间的文学呼应。
- source_word: לִהְיוֹת לְעוֹלָם לְפָנֶיךָ
  choice: 使它永远在你面前
  rationale: 贴近原文“永远在你面前存在”，不擅自加入“坚立”等原文此处未明说的概念。
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: 分别体现称号“主”和上帝的专名YHWH，避免把两个成分合并为一个泛称。
- source_word: דִּבַּרְתָּ
  choice: 你已经说了
  rationale: 完成式指上帝先前已说出的应许；“已经说了”既表达动作完成，也显出这话对当前祷告仍然有效。
- source_word: וּמִבִּרְכָתְךָ
  choice: 所以……必因你的赐福
  rationale: 介词可表示来源或凭借；“因你的赐福”自然表达大卫家蒙福源自上帝。“所以”使句间依据关系在汉语中清楚，但不改变其逻辑。
- source_word: יְבֹרַךְ
  choice: 必……蒙福
  rationale: 被动未完成式在这里表达以应许为根据的未来确信；“必蒙福”兼顾被动意义和坚定语气。
- source_word: לְעוֹלָם
  choice: 永远
  rationale: 准确、自然地表达盟约语境中的长久延续。
theological_decisions:
- issue: 是否将“家”明确译成“王朝”
  choice: 你仆人的家
  alternative: 你仆人的王朝／家族
  rationale: 上下文确实涉及大卫的王朝，但原文“家”同时承载家室、后裔和王朝等含义。保留“家”可避免把丰富的文学和神学张力缩减为单一解释。
- issue: 复合称谓 אֲדֹנָי יְהוִה 的译法
  choice: 主耶和华
  alternative: 主上帝／至高的主耶和华
  rationale: “主耶和华”直接保留称号与专名的组合；“至高的”会加入原文没有明说的修饰，“主上帝”则可能遮蔽专名。
- issue: 末句是祈愿还是确信陈述
  choice: 必因你的赐福永远蒙福
  alternative: 愿因你的赐福永远蒙福
  rationale: 原文使用被动未完成式，并以上帝已经说过的话为根据，较自然地表达未来确信；译作“必”避免把它强行处理成另一个祈使或愿望句，同时承认祷告语境可能使其带有祈愿色彩。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。以“求你”体现祷告语气，以“乐意”保留 gracious consent 的含义；保留“家”的有意多义性，并用“必蒙福”呈现以上帝已说之话为基础的确信。
