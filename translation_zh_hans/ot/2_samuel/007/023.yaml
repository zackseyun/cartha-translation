  text: וּ/מִ֤י כְ/עַמְּ/ךָ֙ כְּ/יִשְׂרָאֵ֔ל גּ֥וֹי אֶחָ֖ד בָּ/אָ֑רֶץ אֲשֶׁ֣ר הָלְכֽוּ אֱ֠לֹהִים לִ/פְדּֽוֹת ל֨/וֹ לְ/עָ֜ם וְ/לָ/שׂ֧וּם ל֣/וֹ שֵׁ֗ם וְ/לַ/עֲשׂ֨וֹת לָ/כֶ֜ם הַ/גְּדוּלָּ֤ה וְ/נֹֽרָאוֹת֙ לְ/אַרְצֶ֔/ךָ מִ/פְּנֵ֣י עַמְּ/ךָ֗ אֲשֶׁ֨ר פָּדִ֤יתָ לְּ/ךָ֙ מִ/מִּצְרַ֔יִם גּוֹיִ֖ם וֵ/אלֹהָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/023.yaml
  text: And who is like your people[a], like Israel, the one nation on the earth whom God went to redeem for himself as a people, to make a name for himself, and to do for you great and fearsome things for your land before your people, whom you redeemed for yourself from Egypt[b], from nations and their gods?
translation:
  language: zh_hans
  text: 世上有哪一国能像你的子民，像以色列呢？神亲自去救赎他们，归自己作子民，又为自己建立名声，并为你们行大事和可畏的作为[a]，为你的地，在你从埃及赎回归自己的子民面前，向列国和他们的神明[b]行这些事呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “可畏”也可译作“令人敬畏”；原文所用的词可指使人敬畏、惊惧或害怕的作为。
    reason: lexical_alternative
  - marker: b
    text: 原文最后的短语句法难解。也可理解为：“从埃及、列国和它的神那里”，或“从埃及、列国和众神那里”。
    reason: alternative_reading
lexical_decisions:
- source_word: וּמִי כְעַמְּךָ כְיִשְׂרָאֵל גּוֹי אֶחָד בָּאָרֶץ
  choice: 在世上有哪一国能像你的子民，像以色列呢
  rationale: 以自然的汉语反问句表达无可比拟之意，同时保留“你的子民—以色列”的强调性同位结构；“哪一国”承接גּוֹי אֶחָד，表达世上独一无二的意味。
- source_word: אֲשֶׁר הָלְכוּ אֱלֹהִים
  choice: 神亲自去
  rationale: 上下文中的אֱלֹהִים指以色列的神；“去”保留原文具体的行动意象，“亲自”在汉语中凸显神主动采取行动，但不改变单数所指。
- source_word: לִפְדּוֹת לוֹ לְעָם
  choice: 救赎他们，归自己作子民
  rationale: “救赎”准确保留פדה的赎回语义；“归自己作子民”表达לוֹ及结果性的לְעָם。
- source_word: וְלָשׂוּם לוֹ שֵׁם
  choice: 为自己建立名声
  rationale: 采用现代汉语可懂且庄重的习语，表达借伟大作为使自己的名得着声望。
- source_word: וְלַעֲשׂוֹת לָכֶם הַגְּדוּלָּה וְנֹרָאוֹת
  choice: 并且为了你们……行伟大而可畏的事
  rationale: 明确保留马所拉文本第二人称复数לָכֶם；“可畏”兼具令人敬畏与惧怕的语义张力。
- source_word: לְאַרְצֶךָ מִפְּנֵי עַמְּךָ
  choice: 为你的土地……并在他们面前赶走
  rationale: “为你的土地”保留单数第二人称形式；结合末尾“列国和神明”，将מִפְּנֵי的空间与驱逐语义自然表达为“在他们面前赶走”。
- source_word: אֲשֶׁר פָּדִיתָ לְּךָ מִמִּצְרַיִם
  choice: 你从埃及救赎你的子民归自己
  rationale: 与前一处פדה统一译为“救赎”，并保留“归自己”的圣约归属含义。
- source_word: גּוֹיִם וֵאלֹהָיו
  choice: 列国和他们的神明
  rationale: 按语境理解为在以色列面前被赶走的对象；用“他们的”分配性地表达原文难解的单数词尾，同时以脚注保留其他可能读法。
theological_decisions:
- issue: אֱלֹהִים的数与所指
  choice: 译作单数“神”，指以色列的神
  alternative: 译作复数“诸神”
  rationale: 篇章语境描述独一的神为自己的子民施行救赎；复数翻译会扭曲本节的语义。
- issue: 结尾גּוֹיִם וֵאלֹהָיו的句法与所指
  choice: 理解为神在以色列面前赶走“列国和他们的神明”
  alternative: “从埃及、列国和它的神那里”或“从埃及、列国和众神那里”
  rationale: 原文结尾高度压缩且句法困难。正文采用最符合出埃及及赶逐列国语境的理解，同时用脚注明示其他读法，不掩盖文本张力。
- issue: לָכֶם与周围单数第二人称形式的转换
  choice: 保留复数“为了你们”，并保留单数“你的土地”
  alternative: 将לָכֶם协调或修订为单数“为了你”
  rationale: 马所拉文本明确使用复数לָכֶם，随后又出现单数לְאַרְצֶךָ；译文不擅自统一人称数，保留原文突变。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。正文保留原文中复数“你们”与单数“你的”之间的转换；将过长的希伯来语问句分为两句，以提高汉语可读性，同时维持反问、救赎、归属和赶逐列国的逻辑。所有脚注标记均置于正文对应位置。
