source:
  edition: WLC
  text: וְ/חַסְדִּ֖/י לֹא יָס֣וּר מִמֶּ֑/נּוּ כַּ/אֲשֶׁ֤ר הֲסִרֹ֨תִי֙ מֵ/עִ֣ם שָׁא֔וּל אֲשֶׁ֥ר הֲסִרֹ֖תִי מִ/לְּ/פָנֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/015.yaml
  text: But my steadfast love will not depart from him[a], as I removed it from Saul[b], whom I removed from before you.
translation:
  language: zh_hans
  text: 但我的慈爱必不离开他[a]，不像我从扫罗那里收回慈爱那样——扫罗是我从你面前除去的[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “慈爱”也可译作“坚贞的爱”或“守约的忠诚”。希伯来语这个词强调在约的关系中持久、忠诚的爱。
    reason: lexical_alternative
  - marker: b
    text: “从你面前除去”直译保留了原文的表达；这里可能指扫罗在大卫面前被废去王位，不只是从某处离开。
    reason: lexical_alternative
lexical_decisions:
- source_word: חַסְדִּי
  choice: 我的慈爱
  rationale: חֶסֶד 在此指上帝在约的关系中坚定、忠诚的爱。“慈爱”是现代中文圣经语体中自然而庄重的表达，也不把含义缩窄为单纯的怜悯。
- source_word: לֹא יָסוּר מִמֶּנּוּ
  choice: 必不离开他
  rationale: סור 表示离开、转离；以“慈爱”为主语时，“不离开他”自然地保留了原文的关系性和分离意象。
- source_word: כַּאֲשֶׁר הֲסִרֹתִי מֵעִם שָׁאוּל
  choice: 不像我使慈爱离开扫罗
  rationale: 原文直译近于“正如我从扫罗那里使之离开”，其中被移去之物承接前面的“我的慈爱”。中文用“不像”表达否定主句所形成的对比，并补出“慈爱”以免误读为扫罗本人先被除去。
- source_word: אֲשֶׁר הֲסִרֹתִי מִלְּפָנֶיךָ
  choice: 我已把扫罗从你面前除去
  rationale: 关系代词 אֲשֶׁר 的先行词是扫罗。译文补出“扫罗”以保持中文指代清晰，同时保留“从你面前”这一原文意象，不具体限定为地理离开或失去王位。
theological_decisions:
- issue: 大卫之约语境中 חֶסֶד 的性质
  choice: 译作“慈爱”，并以脚注说明其包含坚定之爱与守约忠诚
  alternative: 怜悯；坚贞的爱；守约的忠诚
  rationale: 本节对比上帝对大卫后裔持续不变的恩爱与他从扫罗收回的恩宠。“慈爱”兼具可读性和圣约关系色彩，脚注则保留该词丰富而不能由单一汉语词完全涵盖的含义。
- issue: כַּאֲשֶׁר 在否定主句后的比较关系
  choice: 译作“不像”，表达慈爱不会像对扫罗那样被收回
  alternative: 正如；如同
  rationale: 希伯来文以否定主句配合 כַּאֲשֶׁר 构成对比。现代汉语若直译为“正如”容易短暂造成肯定比较的误解；“不像”清楚传达句法关系，并未改变神学内容。
- issue: “从你面前除去”的所指
  choice: 保留原文空间意象，不在正文中明确解释为废除王位
  alternative: 从你面前废去他的王位；不让他继续作王挡在你前面
  rationale: 上下文显然涉及扫罗被废与大卫兴起，但短语本身仍保有较宽的表达。保留其开放性可避免把解释写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的中文。“必不”保留应许的确定语气；用分号呈现原文中两次 הֲסִרֹתִי 的不同宾语：先是慈爱离开扫罗，后是扫罗本人从大卫面前被除去。所有脚注标记均已置于正文相应位置。
