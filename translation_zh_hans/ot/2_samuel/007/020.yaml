  text: וּ/מַה יּוֹסִ֥יף דָּוִ֛ד ע֖וֹד לְ/דַבֵּ֣ר אֵלֶ֑י/ךָ וְ/אַתָּ֛ה יָדַ֥עְתָּ אֶֽת עַבְדְּ/ךָ֖ אֲדֹנָ֥/י יְהוִֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/020.yaml
  text: And what more can David say to you? You know your servant[a], Lord GOD.
translation:
  language: zh_hans
  text: 大卫还能向你说什么呢？主耶和华[a]啊，你知道你的仆人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文为“主耶和华”（אֲדֹנָי יְהוִה）；“耶和华”代表希伯来文的上帝之名יהוה（YHWH）。
    reason: 说明复合神圣称号及神名的原文形式。
lexical_decisions:
- source_word: וּמַה יוֹסִיף דָּוִד עוֹד לְדַבֵּר אֵלֶיךָ
  choice: 大卫还能向你说什么呢
  rationale: יסף与עוד及不定式连用，字面是“再加上说”，在此构成反问，意为“还能说什么”；“向你说”保留אֵלֶיךָ所表达的对象。句首וּ承接上文，但现代汉语在此不必机械译作“而且”。
- source_word: וְאַתָּה יָדַעְתָּ
  choice: 你知道
  rationale: 独立人称代词אַתָּה带有强调意味；完成式יָדַעְתָּ在祷告语境中表达已经确立、现今持续的认识，译作“你知道”自然准确。
- source_word: עַבְדְּךָ
  choice: 你的仆人
  rationale: עבד可指奴仆或臣仆；大卫在向上帝祷告时以此谦称自己，“仆人”既保留隶属与服事含义，也符合现代汉语祷告语体。
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: אֲדֹנָי是尊称“主”，יְהוִה是上帝的专名；译作“主耶和华”可同时保留两者，并符合现代中文圣经语汇。呼格助词“啊”使直接称呼在汉语中自然清楚。
theological_decisions:
- issue: 复合称号אֲדֹנָי יְהוִה中神名的译法
  choice: 主耶和华
  alternative: 主上帝；主雅威
  rationale: 原文明确使用四字神名，而非通称אֱלֹהִים；因此不以“上帝”取代。采用中文读者熟悉的“耶和华”，并保留前面的אֲדֹנָי为“主”，不把两个成分合并。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。反问句保留大卫在祷告中的谦卑语气；将神圣称号前置于后一句，并加“啊”标明呼格。
