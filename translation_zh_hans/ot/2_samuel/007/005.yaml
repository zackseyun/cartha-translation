  text: לֵ֤ךְ וְ/אָֽמַרְתָּ֙ אֶל עַבְדִּ֣/י אֶל דָּוִ֔ד כֹּ֖ה אָמַ֣ר יְהוָ֑ה הַ/אַתָּ֛ה תִּבְנֶה לִּ֥/י בַ֖יִת לְ/שִׁבְתִּֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/005.yaml
  text: 'Go and say to my servant David[a], ‘Thus says Yahweh: Would you build a house for me to dwell in?’'
translation:
  language: zh_hans
  text: 你去对我的仆人大卫说：‘耶和华如此说：你要为我建造房屋，供我居住吗？’[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“难道你就是要为我建造房屋、供我居住的那一位吗？”希伯来文强调“你”，问题带有反问意味。
    reason: 说明 הַאַתָּה 的强调作用及其可采用的反问译法，避免正文把语气解释得过死。
lexical_decisions:
- source_word: לֵךְ וְאָמַרְתָּ
  choice: 你去告诉
  rationale: 祈使式后接带连续 וְ 的完成式，合起来构成连贯命令；“你去告诉”符合现代汉语表达，也保留直接命令的语气。
- source_word: עַבְדִּי אֶל־דָּוִד
  choice: 我的仆人大卫
  rationale: עֶבֶד 在此是君王与圣约语境中的尊称，译作“仆人”比“奴隶”合宜；“大卫”自然地作为同位语。
- source_word: כֹּה אָמַר יְהוָה
  choice: 耶和华如此说
  rationale: 保留先知传信的固定宣告格式；将四字神名 יְהוָה 译作汉语中通行的音译“耶和华”，而非以称号代替。
- source_word: הַאַתָּה
  choice: 你要……吗
  rationale: 疑问词与独立人称代词“你”连用，使问题带强调和反问意味；正文采用自然汉语疑问句，较强的强调义在脚注中说明。
- source_word: תִּבְנֶה לִּי בַיִת
  choice: 为我建造房屋
  rationale: בַיִת 本义为“房屋、家”，此处指供上帝居住的圣所。译作“房屋”而不提前明确为“圣殿”，可保留本章后文围绕“房屋／家”的文学张力。
- source_word: לְשִׁבְתִּי
  choice: 供我居住
  rationale: 介词 לְ 加不定式及第一人称单数词尾表达目的，译文清楚呈现“为让我居住”的意思。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用以色列上帝的专名；“耶和华”是现代简体中文圣经语境中最通行、普通读者最易识别的音译，同时不以“主”这一称号取代专名。
- issue: בַיִת 应译为“房屋”还是“圣殿／殿宇”
  choice: 房屋
  alternative: 圣殿
  rationale: 这里确实指预备建造的圣所，但原词仍是普通的“房屋／家”，并与本章中大卫的“家”形成重要呼应。采用“房屋”避免过早消除这种语义张力。
- issue: 疑问句是否明确译成反问
  choice: 正文保留可作普通疑问或反问理解的形式
  alternative: 难道由你为我建造房屋，供我居住吗？
  rationale: 上下文强烈支持反问语气，但希伯来文形式本身是带强调“你”的问句。正文不把语用功能绝对化，脚注则交代强调性反问的可能表达。
translation_notes:
  register: 采用现代、庄重而易懂的叙事和先知宣告语体。“耶和华如此说”保留正式传信公式；“房屋”刻意保存原文词义及本章的文学呼应。
