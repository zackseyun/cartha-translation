source:
  edition: WLC
  text: וְ/עַתָּה֙ יְהוָ֣ה אֱלֹהִ֔ים הַ/דָּבָ֗ר אֲשֶׁ֨ר דִּבַּ֤רְתָּ עַֽל עַבְדְּ/ךָ֙ וְ/עַל בֵּית֔/וֹ הָקֵ֖ם עַד עוֹלָ֑ם וַ/עֲשֵׂ֖ה כַּ/אֲשֶׁ֥ר דִּבַּֽרְתָּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/025.yaml
  text: And now[a], Yahweh God, confirm forever the word that you have spoken concerning your servant and concerning his house[b], and do as you have spoken.
translation:
  language: zh_hans
  text: 现在，雅威上帝啊，求你使你论到你仆人和他的家[b]所说的话[a]永远坚立，并照你所说的去行。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “话”也可按这里的语境理解为“应许”。
    reason: lexical_alternative
  - marker: b
    text: 这里的“家”不只指家庭，也包括他的王室家族或王朝。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译上帝的专名，不用“主”这一称号替代原文的专名。
- source_word: אֱלֹהִים
  choice: 上帝
  rationale: 在“雅威”之后作神圣称号；“雅威上帝啊”自然表达直接呼告。
- source_word: הַדָּבָר
  choice: 所说的话
  rationale: דָּבָר在这里指上帝先前论及大卫及其家的话；保留“话”的基本意义，不在正文中直接解释成“应许”。
- source_word: דִּבַּרְתָּ
  choice: 你……所说的
  rationale: 回指上帝先前已经说过、如今仍具效力的话；汉语定语结构自然承载这一关系。
- source_word: עַל
  choice: 论到
  rationale: 表示上帝所说之话涉及的对象，语体庄重而不古奥。
- source_word: עַבְדְּךָ
  choice: 你仆人
  rationale: 这是君王祷告中在上帝面前自谦的常用称呼；“仆人”比“奴隶”更符合此处语境。
- source_word: בֵּיתוֹ
  choice: 他家
  rationale: 保留全章关键的“家”这一意象，同时以脚注说明这里包含王室家族和王朝的意义。
- source_word: הָקֵם
  choice: 使……坚立
  rationale: 使役式命令表达使所说的话站立稳固；“使……坚立”既贴近词形，也适合以“话”为宾语。
- source_word: עַד עוֹלָם
  choice: 永远
  rationale: 自然、准确地表达持续不止的时间意义。
- source_word: וַעֲשֵׂה
  choice: 并……去行
  rationale: 保留עשה宽泛而直接的“行、做”之义，不扩展成解释性的“成就应许”。
- source_word: כַּאֲשֶׁר דִּבַּרְתָּ
  choice: 照你所说的
  rationale: 保留与前半句“说”字的呼应，表达求上帝按自己所说的施行。
theological_decisions:
- issue: 在盟约语境中，是否把דָּבָר直接译成“应许”
  choice: 所说的话
  alternative: 所说的应许
  rationale: 上下文确有应许性质，但原文明确使用“话”并搭配“说”；正文保留原文措辞，让应许含义由上下文呈现。
- issue: 是否把בֵּיתוֹ在正文中明确译成“王朝”
  choice: 他家
  alternative: 他的王朝
  rationale: 王朝含义在本章十分重要，但“家”是本章刻意反复使用的盟约意象；正文保留这一关键词，并在脚注交代其王朝意义。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。“求你使……坚立”补出汉语祈求句所需的“求”，但没有改变原文命令式的恳求力量。脚注标记均置于其所解释的词语之后。
