base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/018.yaml
  text: Then King David went in and sat before Yahweh and said[a], “Who am I, Lord GOD, and what is my house, that you have brought me this far?”
translation:
  language: zh_hans
  text: 于是，大卫王进去，坐在雅威面前，说：“主雅威啊，我是谁？我的家[a]算什么？你竟带我到如今！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “家”也可理解为“家族、家室”，并含有大卫王朝的意味。本章多次使用“家”一词，形成贯穿上下文的呼应。
    reason: 说明בֵּיתִי在本章中可指家族、家室并带有王朝含义，同时保留正文“家”与上下文的关键词联系。
lexical_decisions:
- source_word: וַיָּבֹא
  choice: 进去
  rationale: 保留具体的移动动作，但不补出原文未说明的地点；现代汉语叙事中自然简洁。
- source_word: וַיֵּשֶׁב לִפְנֵי יְהוָה
  choice: 坐在雅伟面前
  rationale: ישב在此指实际坐下；לִפְנֵי表达来到神面前、在其临在中的意思。
- source_word: יְהוָה
  choice: 雅伟
  rationale: 以音译呈现四字神名，区别于称号“主”，并与所给项目术语方针一致。
- source_word: מִי אָנֹכִי
  choice: 我是谁
  rationale: 自然传达大卫自谦、惊叹的反问语气。
- source_word: אֲדֹנָי יְהוִה
  choice: 主雅伟
  rationale: 同时保留אֲדֹנָי这一称号与יְהוָה这一专名，避免将二者合并。
- source_word: וּמִי בֵיתִי
  choice: 我的家算什么
  rationale: 希伯来文直译近于“我的家是谁”；汉语以“算什么”自然表达身份与地位上的自谦，同时保留“家”这一全章关键意象。
- source_word: הֲבִיאֹתַנִי עַד הֲלֹם
  choice: 你竟带领我到了这一步
  rationale: הביא为使役义“使来到、带到”；“到了这一步”既可指如今的处境和地位，也保留历程推进的意味，“竟”体现反问中的惊叹而未改变命题内容。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅伟
  alternative: 耶和华；上主
  rationale: 原文使用四字神名；采用“雅伟”音译以保留其作为专名的功能，并在复合称呼אֲדֹנָי יְהוִה中译为“主雅伟”。
- issue: “我的家”所指范围
  choice: 正文保留“家”，脚注说明可涵盖家族、家室及王朝
  alternative: 我的家族；我的王朝
  rationale: 本章反复以“家”连接大卫想为神建造的殿宇与神应许为大卫建立的家系。单译“家族”或“王朝”会过早限定原文的多重含义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“于是”承接先知传话后的情节；称呼“主雅伟啊”符合祷告语体。“你竟……！”传达原文反问所含的谦卑与惊叹。
