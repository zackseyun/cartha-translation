  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ֠/עַתָּה כֹּֽה תֹאמַ֞ר לְ/עַבְדִּ֣/י לְ/דָוִ֗ד כֹּ֤ה אָמַר֙ יְהוָ֣ה צְבָא֔וֹת אֲנִ֤י לְקַחְתִּ֨י/ךָ֙ מִן הַ/נָּוֶ֔ה מֵ/אַחַ֖ר הַ/צֹּ֑אן לִֽ/הְי֣וֹת נָגִ֔יד עַל עַמִּ֖/י עַל יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/008.yaml
  text: 'Now therefore[a], this is what you shall say to my servant David: This is what Yahweh of hosts says: I took you from the pasture, from following the flock[b], to be ruler over my people, over Israel.'
translation:
  language: zh_hans
  text: “现在，你要对我的仆人大卫这样说：‘万军之耶和华如此说：我把你从牧场[a]、从羊群后面带来，立你作领袖[b]，治理我的子民，治理以色列。’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“羊圈”。希伯来语这个词可指牧放之地，也可指羊群栖居之处。
    reason: lexical_alternative
  - marker: b
    text: “领袖”也可译作“统治者”或“首领”。希伯来语这个词指受任命治理的人，不一定采用特定称号“王”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: 现在
  rationale: 既承接上文，又引出神谕的下一部分；现代汉语用“现在”即可自然表达这一转折推进。
- source_word: כֹּה תֹאמַר
  choice: 你要……这样说
  rationale: 保留使者公式的指令语气，同时符合现代汉语表达。
- source_word: לְעַבְדִּי לְדָוִד
  choice: 对我的仆人大卫
  rationale: “仆人”在此是大卫相对于耶和华的尊称和关系用语，不着重奴役身份；合并表达比重复介词更自然。
- source_word: יְהוָה צְבָאוֹת
  choice: 万军之耶和华
  rationale: “耶和华”直接呈现神名；“万军之”是 צְבָאוֹת 在汉语圣经语域中清楚、庄重且不过度限定所指的表达。
- source_word: לְקַחְתִּיךָ
  choice: 把你选召出来
  rationale: לקח 字面为“取、带走”；本语境描述神从牧羊生活中拣选并提升大卫。“选召出来”自然呈现此处的选取意味，但不把后面的任命内容提前具体化。
- source_word: מִן הַנָּוֶה
  choice: 从牧场
  rationale: נָוֶה 可指牧放之地或羊群栖居之处；正文采用语境中自然的“牧场”，并以脚注保留“羊圈”的可能。
- source_word: מֵאַחַר הַצֹּאן
  choice: 从跟随羊群的时候
  rationale: 保留“在羊群后面”的牧人图景，又以现代汉语自然说明大卫当时所处的生活状态。
- source_word: נָגִיד
  choice: 领袖
  rationale: 该词指受任命治理百姓的人，带有统治权，却不等同于特定称号“王”；“领袖”较能保留这一宽度。
- source_word: עַל עַמִּי עַל יִשְׂרָאֵל
  choice: 治理我的子民，治理以色列
  rationale: 重复“治理”对应两次 עַל，保留原文的强调和节奏；“以色列”是对“我的子民”的同位说明。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 正文直接呈现四字神名，而不以“主”替代；在现代简体中文圣经语域中，“耶和华”最为通行、庄重且易懂。
- issue: 大卫被称为 עֶבֶד
  choice: 仆人
  alternative: 奴仆
  rationale: 此处表达大卫对神的隶属、事奉与受托关系，并作为尊荣性的盟约称谓使用；“仆人”比“奴仆”更符合上下文，同时不消除其顺服关系。
- issue: נָגִיד 的政治含义
  choice: 领袖
  alternative: 统治者
  rationale: 原词可指被任命的领导者或执政者，虽有王权色彩，却没有直接使用“王”这一称号；正文避免提前把含义限定为正式王号。
translation_notes:
  register: 采用现代、庄重而易懂的叙事与神谕语体。“如此说”保留先知使者公式；末句重复“治理”以反映希伯来文两次 עַל 的修辞结构。正文所有脚注标记均已对应列出。
