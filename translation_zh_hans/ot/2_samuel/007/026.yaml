  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/יִגְדַּ֨ל שִׁמְ/ךָ֤ עַד עוֹלָם֙ לֵ/אמֹ֔ר יְהוָ֣ה צְבָא֔וֹת אֱלֹהִ֖ים עַל יִשְׂרָאֵ֑ל וּ/בֵית֙ עַבְדְּ/ךָ֣ דָוִ֔ד יִהְיֶ֥ה נָכ֖וֹן לְ/פָנֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/026.yaml
  text: And may your name be magnified forever[a], saying[b], ‘Yahweh of hosts is God over Israel,’ and may the house of your servant David be established before you.
translation:
  language: zh_hans
  text: 愿你的名永远被尊为大[a]，使人说：“万军之雅威是统管以色列的上帝。”愿你仆人大卫的家[b]在你面前坚立。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“愿你的名永远显为伟大”。
    reason: lexical_alternative
  - marker: b
    text: 这里的“家”指大卫的家族或王朝，并非仅指一座房屋。
    reason: cultural_note
lexical_decisions:
- source_word: וְיִגְדַּל שִׁמְךָ
  choice: 愿你的名……被尊为大
  rationale: 未完成式在祷告语境中表达愿望；“被尊为大”自然传达上帝的名被彰显为伟大，而不是名字本身增大。
- source_word: עַד עוֹלָם
  choice: 永远
  rationale: 简洁自然地表达持续到永久的时间意义。
- source_word: לֵאמֹר
  choice: 使人说
  rationale: 将希伯来语引出下文话语的结构译成自然中文，并显明这里预期人们作出随后的宣认。
- source_word: יְהוָה צְבָאוֹת
  choice: 万军之雅威
  rationale: “雅威”音译四字神名，保留其专名性质；“万军”保留 צְבָאוֹת 所涵盖的众军、天上军队等宽广意象。
- source_word: אֱלֹהִים עַל יִשְׂרָאֵל
  choice: 是统管以色列的上帝
  rationale: עַל 在此最自然地表示权柄和主权；“统管”比单纯的“在……之上”更符合现代汉语表达。
- source_word: וּבֵית עַבְדְּךָ דָוִד
  choice: 愿你仆人大卫的家
  rationale: 保留“家”这一关键词及本章中“房屋—王室”的文字关联；在此语境中它指大卫的家族或王朝。
- source_word: יִהְיֶה נָכוֹן
  choice: 坚立
  rationale: 准确传达稳固、确立并持续存在的意义，也与大卫之约的语境相称。
- source_word: לְפָנֶיךָ
  choice: 在你面前
  rationale: 直接保留原文的空间兼关系性表达，体现这一家的存立是在上帝面前。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文使用上帝的专名；“雅威”按较通行的学术重构音译，不以“主”这一称号取代专名。
- issue: “大卫的家”的含义
  choice: 正文保留“家”，脚注说明其家族或王朝意义
  alternative: 正文直接译作“大卫王朝”
  rationale: 保留 בַּיִת 的基本意象及撒母耳记下7章有关“家”的文字关联，同时用脚注避免现代读者误解为一座建筑。
- issue: יִהְיֶה נָכוֹן 的语气
  choice: 译作祈愿句“愿……坚立”
  alternative: 陈述句“必坚立”
  rationale: 形态上可容纳陈述或祈愿，但大卫向上帝祷告的上下文支持祈愿语气；译文不把它强化为独立的必然宣告。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。“被尊为大”“坚立”兼顾原文形式与自然汉语；引号内的宣认保持简洁有力。
