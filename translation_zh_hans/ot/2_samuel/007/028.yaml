  text: וְ/עַתָּ֣ה אֲדֹנָ֣/י יְהוִ֗ה אַתָּה הוּא֙ הָֽ/אֱלֹהִ֔ים וּ/דְבָרֶ֖י/ךָ יִהְי֣וּ אֱמֶ֑ת וַ/תְּדַבֵּר֙ אֶֽל עַבְדְּ/ךָ֔ אֶת הַ/טּוֹבָ֖ה הַ/זֹּֽאת׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/028.yaml
  text: And now[a], Lord GOD, you are God, and your words are true[b], and you have spoken this good thing to your servant.
translation:
  language: zh_hans
  text: 现在，主耶和华啊，你就是上帝；你的话都是真实的[a]，你也已经把这美好的事告诉了你的仆人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“你的话必定真实”或“你的话是可信可靠的”。
    reason: 原文动词可有将来意味，而אֱמֶת兼有真实、可信可靠之意。
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: 分别表达尊称“主”和上帝的名字YHWH，同时符合现代中文圣经语体，避免把两个成分合并。
- source_word: אַתָּה הוּא הָאֱלֹהִים
  choice: 你就是上帝
  rationale: “就是”自然地传达原文代词结构的强调意味；不把冠词机械译成中文不自然的“那上帝”。
- source_word: דְבָרֶיךָ
  choice: 你的话
  rationale: 中文“话”本身不标单复数，在语境中可涵盖希伯来文复数，不必解释性地改译为“应许”。
- source_word: יִהְיוּ אֱמֶת
  choice: 都是真实的
  rationale: 按上下文表达上帝话语恒常真实可信；同时以脚注保留未完成式可指将来实现的可能。
- source_word: וַתְּדַבֵּר אֶל
  choice: 已经把……告诉了
  rationale: 自然表达此前向某人说话的动作，并保留“说”的基本语义，不直接解释为“应许”。
- source_word: עַבְדְּךָ
  choice: 你的仆人
  rationale: 这是大卫在祷告中对自己的谦卑称呼；“仆人”比“奴隶”更符合此处王室祷告语境。
- source_word: הַטּוֹבָה הַזֹּאת
  choice: 这美好的事
  rationale: 保留原文“这美好的〔事〕”的宽泛表达，不擅自限定为“应许”或“福分”。
theological_decisions:
- issue: 复合神名אֲדֹנָי יְהוִה的译法
  choice: 主耶和华
  alternative: 主雅威
  rationale: “主耶和华”在现代中文读者中辨识度高，也同时保留尊称与专名；此处不将YHWH泛化为普通称号。
- issue: יִהְיוּ אֱמֶת所表达的时态与话语可靠性
  choice: 你的话都是真实的
  alternative: 你的话必定真实／必定应验
  rationale: 上下文首先是大卫对上帝话语真实性的确认，但希伯来文未完成式也容许面向将来的理解，因此不在正文中把意思收窄为“应验”，而以脚注保留张力。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语言。“啊”标示直接呼告；“就是”体现强调；避免以较教义化的“应许”替代原文较宽泛的“话”和“美好的事”。
