base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/014.yaml
  text: I will be a father to him[a], and he will be a son to me. When he commits iniquity, I will discipline him with the rod of men and with the blows of the sons of man.
translation:
  language: zh_hans
  text: 我要作他的父亲；他要作我的儿子。他作恶的时候，我要用人的杖和世人的击打来管教他。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “世人的击打”原文直译为“人的众子的击打”，意指人类的击打；也可较通顺地译为“人的责打”。
    reason: 说明בני אדם这一泛指人类的希伯来表达，并提供不改变原文意义的自然汉语替代译法。
lexical_decisions:
- source_word: אֶהְיֶה לּוֹ לְאָב
  choice: 我要作他的父亲
  rationale: 保留关系性的盟约表达，同时符合现代汉语习惯。
- source_word: וְהוּא יִהְיֶה לִּי לְבֵן
  choice: 他要作我的儿子
  rationale: 与前句形成对称，保留父子关系公式。
- source_word: אֲשֶׁר בְּהַעֲוֺתוֹ
  choice: 他若作恶
  rationale: אֲשֶׁר在此引出发生过犯时的情形；“若”自然表达未断言必然发生的条件情境，而“作恶”传达עוה的道德含义。
- source_word: וְהֹכַחְתִּיו
  choice: 我必……管教他……责罚他
  rationale: יכח的使役形在刑杖和击打的语境中指纠正性惩戒；汉语分置谓语使两个介词短语都清楚地依附于惩戒行动。
- source_word: בְּשֵׁבֶט אֲנָשִׁים
  choice: 用人的杖
  rationale: 保留“杖”的比喻及“人”的修饰，不限定究竟指普通人的方式还是借人施行惩戒。
- source_word: וּבְנִגְעֵי בְּנֵי אָדָם
  choice: 用世人的击打
  rationale: נגע在此取“击打”义；בני אדם用自然的现代汉语译作“世人”，同时在脚注交代直译。
theological_decisions:
- issue: 父子应许的范围及其与后来弥赛亚用法的关系
  choice: 按上下文译为上帝与大卫后裔君王之间的父子关系，不在正文中加入明确的弥赛亚解释。
  alternative: 在正文中直接作弥赛亚式阐释。
  rationale: 本节首先处于大卫之约的历史语境中；译文保留其可供后来经文引用和展开的措辞，而不把后来的解释预先写入正文。
- issue: אֲשֶׁר בְּהַעֲוֺתוֹ的条件性与时间性
  choice: 译作“他若作恶”。
  alternative: 译作“他作恶的时候”或“当他作恶时”。
  rationale: 原文可表达在其犯罪情形下所采取的行动。“若”在现代汉语中保留这种情境关系，也避免断定这位后裔必然犯罪；脚注说明也可按时间关系理解。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“作父亲／作儿子”保留盟约公式的关系性；“人的杖”“世人的击打”保存原文并列意象。
