revisions:
- from: 也不像从前，就是从我委派士师治理我民以色列的日子以来那样。我必使你安享太平，不受一切仇敌侵扰。雅威也向你宣告：雅威必为你建立家室[a]。
  to: 也不像从前，自从我委派士师治理我民以色列以来那样。我使你得享安宁，脱离你的一切仇敌。雅威也向你宣告：雅威必为你建立家室[a]。
  rationale: 修订保留本节作为上一节续句的结构、士师的治理职分、雅威之名及“家”的双关。将“必使”改为无显性时态的“使你得享”，避免在可讨论的希伯来语形式上作不必要的时态裁决；以“安宁，脱离……仇敌”准确表达赐安息的意思。
