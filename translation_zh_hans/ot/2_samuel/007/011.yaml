source:
  edition: WLC
  text: וּ/לְ/מִן הַ/יּ֗וֹם אֲשֶׁ֨ר צִוִּ֤יתִי שֹֽׁפְטִים֙ עַל עַמִּ֣/י יִשְׂרָאֵ֔ל וַ/הֲנִיחֹ֥תִי לְ/ךָ֖ מִ/כָּל אֹיְבֶ֑י/ךָ וְ/הִגִּ֤יד לְ/ךָ֙ יְהוָ֔ה כִּי בַ֖יִת יַעֲשֶׂה לְּ/ךָ֥ יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/011.yaml
  text: and from the day that I appointed judges over my people Israel[a]. And I have given you rest from all your enemies. Yahweh also declares to you that Yahweh will make a house for you.
translation:
  language: zh_hans
  text: 也不像从前，自从我委派士师治理我民以色列以来那样。我使你得享安宁，脱离你的一切仇敌。雅威也向你宣告：雅威必为你建立家室[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “家室”也可译作“家”。这里指向大卫的家系和王朝，同时回响大卫想为雅威建造殿宇（“家”）的心愿；原文保留了这两层关联。
    reason: 说明 בַּיִת 的王朝指向及其与殿宇的文字呼应，同时不消除原文的双关。
lexical_decisions:
- source_word: וּלְמִן הַיּוֹם
  choice: 就是从……的日子以来
  rationale: 该短语承接上文的“从前”，标明时间起点；用“就是……以来”既保留承接关系，也使本节作为续句在现代汉语中通顺。
- source_word: צִוִּיתִי שֹׁפְטִים עַל עַמִּי יִשְׂרָאֵל
  choice: 我委派士师治理我民以色列
  rationale: צוה 在此语境中指任命、委派士师；עַל 表示其治理权柄。“委派……治理”比字面译作“吩咐士师在……之上”更符合汉语。
- source_word: וַהֲנִיחֹתִי לְךָ מִכָּל אֹיְבֶיךָ
  choice: 我必使你安享太平，不受一切仇敌侵扰
  rationale: נוח 的使役形表示使人得安息、免受仇敌威胁。结合本段应许语境，译为将来性的“我必使你……”；“安享太平”自然表达这里政治与军事上的安息。
- source_word: וְהִגִּיד לְךָ יְהוָה
  choice: 雅威也向你宣告
  rationale: נגד 的使役形是告知、宣布；“宣告”符合此处庄严的应许语气。“也”表达连接词 וְ 在话语转折中增添另一项宣告的作用。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译呈现四字神名，而不以“主”这一称号替代。
- source_word: כִּי בַיִת יַעֲשֶׂה לְּךָ יְהוָה
  choice: 雅威必为你建立家室
  rationale: עשה 是“作成、建立”，בַיִת 在这里主要指王室、家系，却刻意呼应大卫想为雅威建造“殿宇/房屋”的愿望。“建立家室”保留家系意象，并以脚注说明双关。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。译作“雅威”保留专名性质，并较直接地对应 Yahweh 的读音，不用称号取代。
- issue: 大卫之约中 בַיִת 的含义
  choice: 家室
  alternative: 王朝；家；殿宇
  rationale: 此词在应许中主要指大卫的家系和王朝，同时与大卫要为雅威建造殿宇的愿望形成文字呼应。正文不直接译成“王朝”，以免消除原文的双重意蕴。
- issue: וַהֲנִיחֹתִי 的时态指向
  choice: 我必使你安享太平
  alternative: 我已经使你得享安息
  rationale: 希伯来语形式本身可按完成动作理解，但在拿单所传达的应许段落中，也自然指向雅威将赐下的安定。正文采用将来应许语气，保留神主动赐安息的含义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“士师”保留通行的圣经历史称谓；“安享太平”将“安息”在此处免受仇敌侵扰的具体意义表达出来。首句按其承接上文的句法处理，因此保留“也不像从前……那样”的续接形式。
