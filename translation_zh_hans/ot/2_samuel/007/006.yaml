source:
  edition: WLC
  text: כִּ֣י לֹ֤א יָשַׁ֨בְתִּי֙ בְּ/בַ֔יִת לְ֠/מִ/יּוֹם הַעֲלֹתִ֞/י אֶת בְּנֵ֤י יִשְׂרָאֵל֙ מִ/מִּצְרַ֔יִם וְ/עַ֖ד הַ/יּ֣וֹם הַ/זֶּ֑ה וָ/אֶֽהְיֶה֙ מִתְהַלֵּ֔ךְ בְּ/אֹ֖הֶל וּ/בְ/מִשְׁכָּֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/006.yaml
  text: For I have not dwelt in a house from the day I brought up the sons of Israel out of Egypt to this day[b][a], but I have been moving about in a tent and in a tabernacle.
translation:
  language: zh_hans
  text: 因为自从我领以色列人出埃及的那一天，直到今天，我未曾住在房屋里，而是一直在帐篷和帐幕中往来。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “帐幕”也可译作“居所”；“帐篷和帐幕”也可能是对同一可移动居所的双重描述。
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשַׁבְתִּי
  choice: 未曾住
  rationale: ישׁב在房屋语境中指居住；“未曾住”自然表达从出埃及至今持续未发生的状态。
- source_word: בְּבַיִת
  choice: 在房屋里
  rationale: 原文没有定冠词，故不译为特指的“那座房屋”，也不提前解释为“圣殿”。
- source_word: לְמִיּוֹם הַעֲלֹתִי
  choice: 自从我领……出的那一天
  rationale: 该短语标明时间起点；עלה的使役形在出埃及语境中表示领出。中文以“自从……那一天”顺畅呈现其时段意义。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 该固定族群称谓在现代汉语中通常自然译为“以色列人”，包括整个以色列群体；直译“以色列的儿子们”会在中文中造成不必要的性别或亲子含义。
- source_word: מִמִּצְרַיִם
  choice: 出埃及
  rationale: 与使役形“领出”搭配，准确表达从埃及出来的行动。
- source_word: וְעַד הַיּוֹם הַזֶּה
  choice: 直到今天
  rationale: 保留原文由出埃及延续至说话当下的时间范围。
- source_word: וָאֶהְיֶה מִתְהַלֵּךְ
  choice: 而是一直……往来
  rationale: 与前面的“不住在房屋里”构成语境上的对比；分词表达持续活动，“一直……往来”保留移动、没有固定住所的意象。
- source_word: בְּאֹהֶל
  choice: 在帐篷……中
  rationale: אֹהֶל的基本义是帐篷；原文未特指，译文也不加“那”。
- source_word: וּבְמִשְׁכָּן
  choice: 和帐幕中
  rationale: מִשְׁכָּן既可泛指居所，也可指可移动的圣所；“帐幕”符合本段历史和敬拜语境，同时保留它与“帐篷”的并列。
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל的群体称谓
  choice: 以色列人
  alternative: 以色列的子孙
  rationale: 现代汉语的“以色列人”准确指整个民族群体，避免把固定希伯来称谓误读为只限男性；“以色列的子孙”较贴近传统表达，但不如前者自然。
- issue: מִשְׁכָּן的圣所含义
  choice: 帐幕
  alternative: 居所
  rationale: 上下文涉及从出埃及以来可移动的神圣居所，“帐幕”保留历史与敬拜含义；但原词本身也有“居所”这一较宽泛的词义。
- issue: אֹהֶל与מִשְׁכָּן的关系
  choice: 保留为“帐篷和帐幕”两个并列名词
  alternative: 合并为“会幕”或理解为同一居所的双重描述
  rationale: 原文并列两个不同词，关系可能是两个相近称呼，也可能突出可移动居所的不同方面；译文不将其静默合并。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“房屋”保持普通名词的开放性，不预先译作“圣殿”；“帐篷和帐幕中往来”保留原文移动居所的意象及两个近义名词之间的张力。
