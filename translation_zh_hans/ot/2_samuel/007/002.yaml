base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/002.yaml
  text: And the king said to Nathan the prophet[a], “See now, I dwell in a house of cedar, but the ark of God dwells within curtains.”
translation:
  language: zh_hans
  text: 王对先知拿单说：“你看，我住在香柏木造的房屋里，上帝的约柜却住在帷幕之中[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“在一幅帷幕之中”。这里的希伯来词指帐篷所用的帘幕或幕布，可能使人联想到会幕的遮盖物。
    reason: 说明原文名词为单数，并保留其可指单幅帷幕或集合性帘幕、幕布的词义空间；不在正文补出“帐幕”。
lexical_decisions:
- source_word: וַיֹּאמֶר הַמֶּלֶךְ
  choice: 王……说
  rationale: 按希伯来叙事语流自然承接上文；保留“王”这一确定称号，不擅自补出“大卫”。
- source_word: נָתָן הַנָּבִיא
  choice: 先知拿单
  rationale: 自然表达同位身份说明，并采用现代中文圣经传统中通行的人名译法。
- source_word: רְאֵה נָא
  choice: 你看
  rationale: 作为引起对方注意的惯用语，自然传达祈使式和语气词 נָא；此处不宜译成过分恳求的“请看”。
- source_word: בְּבֵית אֲרָזִים
  choice: 住在香柏木造的宫殿里
  rationale: 短语指以香柏木建造或装饰的王室住所；“宫殿”符合王的语境，“香柏木造的”保留材料意象。
- source_word: וַאֲרוֹן הָאֱלֹהִים
  choice: 上帝的约柜却
  rationale: וַ 在这里表达大卫住所与约柜居所之间的对比，故译“却”；“约柜”准确表达 אֲרוֹן 在此礼仪语境中的所指。
- source_word: יֹשֵׁב בְּתוֹךְ הַיְרִיעָה
  choice: 住在帐幕的幔子中
  rationale: 重复“住”以保留原文拟人化的平行对照；יְרִיעָה 是帐幕所用的幔子、幕布，而非泛指整座帐幕。
theological_decisions:
- issue: 约柜居所的具体表述
  choice: 帐幕的幔子中
  alternative: 帐幕里
  rationale: 原文明确使用 יְרִיעָה（幔子、幕布），译文保留其具体而临时性的居所意象，不把它概括成“帐幕”，也不引入后来的圣殿神学。
- issue: 约柜“住”的拟人化表达
  choice: 上帝的约柜却住在……
  alternative: 上帝的约柜却安放在……
  rationale: 原文对王和约柜都使用 יֹשֵׁב，刻意形成平行与反差；保留“住”可呈现这一修辞张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“宫殿”使王室住所的语境清楚，“住”则有意保留原文中人与约柜之间的拟人化平行。脚注标在相关短语之后，避免误以为注释针对“先知拿单”。
