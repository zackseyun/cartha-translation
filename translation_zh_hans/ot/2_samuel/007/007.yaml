source:
  edition: WLC
  text: בְּ/כֹ֥ל אֲשֶֽׁר הִתְהַלַּכְתִּי֮ בְּ/כָל בְּנֵ֣י יִשְׂרָאֵל֒ הֲ/דָבָ֣ר דִּבַּ֗רְתִּי אֶת אַחַד֙ שִׁבְטֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁ֣ר צִוִּ֗יתִי לִ/רְע֛וֹת אֶת עַמִּ֥/י אֶת יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר לָ֛/מָּה לֹֽא בְנִיתֶ֥ם לִ֖/י בֵּ֥ית אֲרָזִֽים־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/007.yaml
  text: In all the places where I have walked among all the sons of Israel[a], did I ever speak a word to one of the tribes of Israel, whom I commanded to shepherd my people Israel, saying, ‘Why have you not built me a house of cedar?’
translation:
  language: zh_hans
  text: 我在以色列众人中间往来、所到的各处，何曾对以色列的一个支派[a]——就是我吩咐去牧养我民以色列的支派——说过：“你们为什么没有为我建造香柏木的殿宇？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文本作“以色列的一个支派”；平行经文《历代志上》17:6作“以色列的士师”，可能是指那些受命牧养百姓的领袖。
    reason: textual_variant
lexical_decisions:
- source_word: הִתְהַלַּכְתִּי
  choice: 往来
  rationale: 该词在此表示上帝在百姓中间行走、迁移，并非固定居住；“往来”在现代汉语中自然地保留这种动态意象。
- source_word: בְּכֹל אֲשֶׁר ... בְּכָל בְּנֵי יִשְׂרָאֵל
  choice: 在以色列众人中间往来的时候，无论到了哪里
  rationale: 按行走意象理解首个“凡……之处”，并把第二处介词结构译为“在……中间”，使成对结构在汉语中清楚自然。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列众人
  rationale: 这是指整个民族的惯用称谓；“以色列众人”既不误解为雅各的亲生儿子，又保留群体含义。
- source_word: הֲדָבָר דִּבַּרְתִּי
  choice: 何曾……说过这样的话
  rationale: 用反问式“何曾”表达疑问词与同根宾语所加强的否定语气，也符合庄重而自然的现代汉语。
- source_word: אַחַד שִׁבְטֵי יִשְׂרָאֵל
  choice: 以色列的任何一个支派
  rationale: 忠实采用马所拉文本的“支派”；“任何一个”配合反问句，准确表达希伯来语 אַחַד 在此的范围。
- source_word: אֲשֶׁר צִוִּיתִי לִרְעוֹת
  choice: 就是我吩咐牧养……的
  rationale: 保留原文关系从句的结构张力，并以“牧养”保存治理与照料百姓的牧者隐喻。
- source_word: עַמִּי אֶת יִשְׂרָאֵל
  choice: 我民以色列
  rationale: 保留同位结构，同时呈现立约性的归属表达“我民”。
- source_word: לָמָּה לֹא בְנִיתֶם לִי בֵּית אֲרָזִים
  choice: 你们为什么没有为我建造香柏木的殿宇
  rationale: “你们”反映希伯来语复数动词；“香柏木的殿宇”在上帝居所的语境中自然庄重，同时保留建筑材料的明确所指。
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל 的民族称谓
  choice: 以色列众人
  alternative: 以色列的众子
  rationale: 此处是全民族的惯用称呼，并非强调性别或血缘上的儿子；现代汉语用“众人”更准确易懂，也没有改变所指群体。
- issue: “支派”与牧养职责之间的文本张力
  choice: 正文译作“支派”，并保留关系从句
  alternative: 按《历代志上》17:6译作“士师”或按语境译作“领袖”
  rationale: WLC 的《撒母耳记》本文明确作“支派”，应据此翻译；紧接着的“吩咐牧养”似乎指向领袖，而平行经文作“士师”，故以脚注说明，不在正文中消解张力。
- issue: בֵּית אֲרָזִים 所指的上帝居所
  choice: 香柏木的殿宇
  alternative: 香柏木的房屋／香柏木的居所
  rationale: 原词本义为“房屋”，但在向上帝建造居所的直接语境中，“殿宇”是自然且庄重的汉语表达；不进一步译成“圣殿”，以免加入原文未明说的专门名称。
translation_notes:
  register: 采用现代、庄重、可朗读的标准普通话。“何曾”保留反问力度；“往来”保留上帝尚未固定居于一处的动态意象。正文刻意不把“支派”改成“士师”或“领袖”，以保存马所拉文本及其与后续关系从句之间的张力。
