base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/004.yaml
  text: So David sent messengers and took her[a], and she came to him, and he lay with her. Now she was purifying herself from her uncleanness. Then she returned to her house.
translation:
  language: zh_hans
  text: 于是，大卫派使者把她带来；她来到大卫那里，大卫就与她同房。那时，她正在洁净自己，除去她的不洁[a]。随后，她回到自己家里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“她已经洁净了自己，除去了她的不洁。”希伯来语也可理解为背景说明，所指可能是月经之后的礼仪洁净。
    reason: 保留分词从句可理解为进行性的背景说明或先前已完成的动作，并说明“不洁”的可能礼仪语境。
lexical_decisions:
- source_word: וַיִּשְׁלַח דָּוִד מַלְאָכִים
  choice: 大卫派使者去
  rationale: “派”自然表达叙事中的差遣动作；“使者”保留 מַלְאָכִים 的具体含义，不额外断定其官职或身份。
- source_word: וַיִּקָּחֶהָ
  choice: 把她带来
  rationale: לקח 的基本义是“拿、带、取”。在差遣使者的语境中，“把她带来”既符合现代汉语，也保留大卫主动将她带到自己这里的简洁叙述。
- source_word: וַתָּבֹוא אֵלָיו
  choice: 她来到他那里
  rationale: 直接表达动词 בוא 与介词 אֶל 的方向关系，不加入原文没有明说的委婉或强制意味。
- source_word: וַיִּשְׁכַּב עִמָּהּ
  choice: 他就与她同寝
  rationale: “与她同寝”是庄重、清楚的汉语圣经叙事用语，传达这里发生性关系的惯用含义，又避免过分口语化。
- source_word: וְהִיא מִתְקַדֶּשֶׁת מִטֻּמְאָתָהּ
  choice: 那时，她正在洁净自己，除去她的不洁
  rationale: 将 Hitpael 分词译为正在进行的礼仪洁净，并以“不洁”保留 טֻמְאָה 的礼仪类别；“那时”表明这是背景说明，而非新的主线动作。
- source_word: וַתָּשָׁב אֶל־בֵּיתָהּ
  choice: 随后，她回到自己家里
  rationale: “随后”自然承接叙事次序；“家里”在现代汉语中比机械直译“房屋”更符合 בַּיִת 在此处所指的住家。
theological_decisions:
- issue: 礼仪洁净从句的时态与叙事功能
  choice: 译作背景性、进行中的动作：“那时，她正在洁净自己，除去她的不洁。”
  alternative: 译作先于同寝完成的动作：“她已经洁净了自己，除去了她的不洁。”
  rationale: 希伯来语分词最自然地提供背景信息，但也可能按语境理解为已经完成的洁净。正文保留其背景性和进行性，脚注说明完成式理解；不把礼仪洁净误作道德上的圣化，也不据此推断拔示巴的罪责或无罪。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。保留原文短促的动作推进，并用“同寝”“不洁”等词维持其文学与礼仪语域；不添加原文未明说的同意、强迫或道德判断。
