base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/008.yaml
  text: Then David said to Uriah[a], “Go down to your house and wash your feet.” So Uriah went out from the king’s house[b], and a present from the king went out after him.
translation:
  language: zh_hans
  text: 大卫对乌利亚说：“下到你家去，洗洗脚吧[a]。”乌利亚就从王宫出去，王的一份礼物[b]也随后送了出去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “洗脚”是原文的具体说法，也可暗示旅途之后休息整顿，或回家安顿下来。
    reason: cultural_note
  - marker: b
    text: 或译“王的一份份额”。原词可指被带去或送出的东西，包括一份份额或礼物。
    reason: lexical_alternative
lexical_decisions:
- source_word: רֵד
  choice: 下到
  rationale: 保留动词“下去、下到”的方向含义；这里很可能指从王宫下到乌利亚家中。
- source_word: לְבֵיתְךָ
  choice: 你家
  rationale: 希伯来语直译为“你的房屋”；现代汉语用“你家”更自然，同时保持具体所指。
- source_word: וּרְחַץ רַגְלֶיךָ
  choice: 洗洗脚吧
  rationale: 保留原文“洗脚”的具体表达；叠词“洗洗”符合现代汉语口吻，也能表达大卫让他回家休息整顿的语气，而不把潜在含义直接写入正文。
- source_word: מִבֵּית הַמֶּלֶךְ
  choice: 从王宫
  rationale: 原文字面是“从王的房屋”；在叙事语境中指王的居所或办公处，译作“王宫”清楚自然。
- source_word: מַשְׂאַת הַמֶּלֶךְ
  choice: 王的一份礼物
  rationale: מַשְׂאֵת可指被带去或送出的礼物、份额；正文采用自然且语境合宜的“礼物”，并以脚注保留“份额”的可能。
- source_word: אַחֲרָיו
  choice: 随后
  rationale: 表达礼物跟在乌利亚之后送出的先后和跟随关系，符合现代汉语叙事习惯。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“下到你家”保留原文的方向感；“王宫”避免生硬的“王的房屋”；末句保留礼物在乌利亚之后被送出的叙事画面，不进一步推断礼物的具体内容。
