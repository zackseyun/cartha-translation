base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/009.yaml
  text: But Uriah slept at the entrance of the king’s house with all the servants of his lord[d][c][b][a], and did not go down to his house.
translation:
  language: zh_hans
  text: 乌利亚却睡[a]在王宫[b]门口，与他主人[c]的众仆人一起，并没有下到自己家里去[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“躺下”或“在那里过夜”。希伯来语动词既可表示躺下，也可表示睡觉；这里指乌利亚在那里留宿。
    reason: lexical_alternative
  - marker: b
    text: 或译“王的家”。原文作“王的家”。
    reason: lexical_alternative
  - marker: c
    text: 或译“他的主”。这里指乌利亚的上级大卫。
    reason: lexical_alternative
  - marker: d
    text: 或译“并没有回家”。原文直译为“并没有下到他的家去”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: 睡
  rationale: שׁכב可指“躺下”或“睡觉”；本段叙事强调乌利亚留宿在王宫门口，因此译作“睡”自然清楚，同时以脚注保留“躺下、过夜”的可能表达。
- source_word: פֶּתַח
  choice: 门口
  rationale: פֶּתַח指开口、入口或门道；“门口”是现代汉语中自然的地点表达，又不过度限定为具体的门扇。
- source_word: בֵּית הַמֶּלֶךְ
  choice: 王宫
  rationale: 希伯来文直译为“王的家”；在此语境中所指是王的居所和宫廷，“王宫”符合现代汉语习惯，直译形式在脚注中保留。
- source_word: אֵת כָּל עַבְדֵי אֲדֹנָיו
  choice: 与他主人的众仆人一起
  rationale: 这里的结构表达陪同或同处；“与……一起”准确呈现空间上的相伴。עֲבָדִים在宫廷语境中译作“仆人”，不额外断定其法律身份。
- source_word: אֲדֹנָיו
  choice: 他主人
  rationale: אדון可指“主”或“主人”，这里指乌利亚的上级大卫；“主人”在现代汉语中清楚表达从属关系，并避免被误解为对上帝的称呼。
- source_word: וְלֹא יָרַד אֶל בֵּיתוֹ
  choice: 并没有下到自己家里去
  rationale: 保留ירד“下去”的方向含义和בֵּיתוֹ“他的家”的具体措辞；“下到自己家里去”在上下文中清楚，也保留原文的空间叙述。
