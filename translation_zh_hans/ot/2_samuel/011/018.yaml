  text: וַ/יִּשְׁלַ֖ח יוֹאָ֑ב וַ/יַּגֵּ֣ד לְ/דָוִ֔ד אֶת כָּל דִּבְרֵ֖י הַ/מִּלְחָמָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/018.yaml
  text: Then Joab sent word and told David all the news of the battle[a].
translation:
  language: zh_hans
  text: 于是，约押派人把战事的全部情况都报告给大卫。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “战事的全部情况”直译为“战事的一切话（或事情）”，在这里指战斗的详情或战报。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: 派人
  rationale: 该动词本义为“差遣、派出”。经文没有明说所派之人的身份，但下文表明约押借使者传递战报；中文用“派人”自然表达这一省略的受差者。
- source_word: יוֹאָב
  choice: 约押
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: וַיַּגֵּד לְדָוִד
  choice: 报告给大卫
  rationale: נגד 的使役式在此表示“告知、报告”；战事语境中“报告给”比一般的“告诉”更贴切，并自然体现介词 לְ。
- source_word: אֵת כָּל דִּבְרֵי הַמִּלְחָמָה
  choice: 把战事的全部情况都
  rationale: דִּבְרֵי 字面可指“话、事情”，在叙事语境中指战斗的详情或战报内容。“战事的全部情况”既自然，又保留“所有事项”的范围。
- source_word: הַמִּלְחָמָה
  choice: 战事
  rationale: מִלְחָמָה 可指战争、战斗或交战；此处指当前军事行动，“战事”能涵盖具体战况，又不必过度限定为单场战斗。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“于是”承接叙事进程；“派人……报告”清楚表达希伯来文连续动词所描写的差遣与传报。
