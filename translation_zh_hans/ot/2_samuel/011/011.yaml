  text: וַ/יֹּ֨אמֶר אוּרִיָּ֜ה אֶל דָּוִ֗ד הָ֠/אָרוֹן וְ/יִשְׂרָאֵ֨ל וִֽ/יהוּדָ֜ה יֹשְׁבִ֣ים בַּ/סֻּכּ֗וֹת וַ/אדֹנִ֨/י יוֹאָ֜ב וְ/עַבְדֵ֤י אֲדֹנִ֨/י עַל פְּנֵ֤י הַ/שָּׂדֶה֙ חֹנִ֔ים וַ/אֲנִ֞י אָב֧וֹא אֶל בֵּיתִ֛/י לֶ/אֱכֹ֥ל וְ/לִ/שְׁתּ֖וֹת וְ/לִ/שְׁכַּ֣ב עִם אִשְׁתִּ֑/י חַיֶּ֨/ךָ֙ וְ/חֵ֣י נַפְשֶׁ֔/ךָ אִֽם אֶעֱשֶׂ֖ה אֶת הַ/דָּבָ֥ר הַ/זֶּֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/011.yaml
  text: Uriah said to David[a], “The ark, and Israel and Judah, are staying in shelters, and my lord Joab and the servants of my lord are camped in the open field. Shall I then go to my house to eat and to drink and to lie with my wife? As surely as you live, and as your soul lives[c][b], I will not do this thing.”
translation:
  language: zh_hans
  text: 乌利亚对大卫说：“约柜、以色列和犹大都在临时棚屋[a]中；我主约押和我主的臣仆都在野地露营。我反倒要回家吃喝，与妻子同寝吗？[b]我指着你的生命，也指着你的性命起誓[c]，我绝不做这事！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文作“棚屋”，指在野外搭建的简陋临时住处。
    reason: lexical_alternative
  - marker: b
    text: 也可译作：“难道我要回家……吗？”原文以反问表达乌利亚的拒绝。
    reason: alternative_reading
  - marker: c
    text: 原文的誓言格式直译为：“你活着，你的性命也活着——如果我做这事……”。其中“如果”在誓言之后表达强烈否定。
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאָרוֹן
  choice: 约柜
  rationale: 原文仅作“柜”并带定冠词；汉语圣经语境中“约柜”能明确这一已知对象，又不扩展为本节没有明说的完整称号。
- source_word: יֹשְׁבִים בַּסֻּכּוֹת
  choice: 住在临时棚屋里
  rationale: סֻכּוֹת指临时搭建的棚屋或遮蔽处；此译保留战地临时居所的含义，避免笼统译作“帐篷”。
- source_word: אֲדֹנִי
  choice: 我主
  rationale: 这里是对人的尊称，分别用于约押和大卫属下的人，并非神的名号；“我主”保留古代臣属语境中的郑重口吻。
- source_word: עַל פְּנֵי הַשָּׂדֶה
  choice: 在旷野
  rationale: 该短语直译为“在田野表面”，在此表达露天野外；“在旷野”符合自然汉语，也传达军队在外扎营的情景。
- source_word: חֹנִים
  choice: 安营
  rationale: 分词表示持续处于扎营状态；“安营”简洁并符合军事语境。
- source_word: וַאֲנִי אָבוֹא אֶל בֵּיתִי
  choice: 我反倒要回家……吗
  rationale: 原文形式上可作陈述，但上下文显示这是带有抗议意味的反问；“反倒”显出与前述战地处境的强烈对照。
- source_word: לֶאֱכֹל וְלִשְׁתּוֹת וְלִשְׁכַּב עִם אִשְׁתִּי
  choice: 吃喝，与妻子同寝
  rationale: “同寝”以庄重而清楚的方式保留原文的性关系委婉语；汉语将前两个并列动词自然合为“吃喝”。
- source_word: חַיֶּךָ וְחֵי נַפְשֶׁךָ
  choice: 我凭你的生命，也凭你的性命起誓
  rationale: 保留希伯来誓言中两重生命用语的郑重性，不把 נֶפֶשׁ 完全消解为普通代词；同时补出汉语所需的“起誓”。
- source_word: אִם אֶעֱשֶׂה אֶת הַדָּבָר הַזֶּה
  choice: 我绝不做这事
  rationale: 在誓言公式之后，אִם构成省略咒诅后果的强烈否定；直译“如果我做这事”在现代汉语中会显得句意未完，因此明确译出否定力量。
