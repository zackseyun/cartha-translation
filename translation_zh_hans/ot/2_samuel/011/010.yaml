base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/010.yaml
  text: They told David[a], saying, “Uriah did not go down to his house.” So David said to Uriah[b], “Have you not come from a journey? Why did you not go down to your house?”
translation:
  language: zh_hans
  text: 有人来告诉大卫说：“乌利亚没有下到自己的家里[a]。”大卫就对乌利亚说：“你不是从旅途中来的吗？为什么没有下到你家里去？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “下到自己的家里”也可意译为“回家”。这里可能是指从地势较高之处或王宫所在区域下到自己的住处。
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּגִּדוּ לְדָוִד לֵאמֹר
  choice: 有人告诉大卫说
  rationale: 希伯来文动词为复数，但主语未明；译作“有人”自然保留不确定性。“说”保留 לֵאמֹר 引出直接引语的叙事功能。
- source_word: לֹא יָרַד אוּרִיָּה אֶל בֵּיתוֹ
  choice: 乌利亚没有下到自己家里
  rationale: 保留 ירד“下去”和 בַּיִת“家/房屋”的具体表达及其后文重复；“自己家里”在现代汉语中清楚指向乌利亚的住处。
- source_word: וַיֹּאמֶר
  choice: 就……说
  rationale: “就”自然表达连续叙事以及大卫得知消息后的回应，不额外强化因果。
- source_word: הֲלוֹא
  choice: 不是……吗
  rationale: 该否定疑问预期肯定回答；汉语“不是……吗”准确传达反问语气。
- source_word: מִדֶּרֶךְ אַתָּה בָא
  choice: 你从旅途中回来
  rationale: דֶּרֶךְ 字面为“道路”，此处指行路或旅程；בוא 为“来”，结合说话现场译作“回来”符合自然汉语，但不暗示超出语境的特殊返程含义。
- source_word: מַדּוּעַ לֹא יָרַדְתָּ אֶל בֵּיתֶךָ
  choice: 为什么没有下到自己家里去
  rationale: 保留前半节“下到……家里”的重复，维持本段叙事张力；“去”使现代汉语方向表达完整。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。保留“下到……家里”的希伯来语空间表达和两次重复；将未明说的复数主语自然译为“有人”。
