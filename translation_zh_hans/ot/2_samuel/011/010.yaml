revisions:
- from: 有人告诉大卫[a]说：“乌利亚没有下到自己家里。”大卫就对乌利亚说：“你不是从旅途中回来的吗？为什么没有下到自己家里去？”
  to: 有人来告诉大卫说：“乌利亚没有下到自己的家里[a]。”大卫就对乌利亚说：“你不是从旅途中来的吗？为什么没有下到你家里去？”
  rationale: 修订仅处理原文动词“来”的未定向含义、第二人称所有格，以及脚注锚点。仍保留“下到……家里”在上下文中的两次重复和可能的地势／王宫区域背景，不加入对乌利亚行程或动机的额外解释。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T05:26:45Z'
review_pass:
  verdict: revise
  source_fidelity: 译文总体忠实保留了“下到家里”的空间性重复和大卫的反问。惟“回来”比原文“来”多了一层明确的返归含义，宜改为“来”；第二次“自己家里”也应按原文第二人称明确为“你家里”。开头“有人”可表达未具名的报告者，但未体现希伯来文复数；以“有人来告诉大卫”仍可在汉语中自然保留未指明报告者的表达。
  naturalness: 修订后采用“你不是从旅途中来的吗？”和“你家里”，在现代标准汉语中更自然、指向更明确。将脚注标记置于其所说明的“下到……家里”短语之后，避免现稿标在“大卫”后造成锚点错位。
  terminology: “乌利亚”“大卫”用名一致；“旅途”“下到……家里”恰当地对应原文的 דרך 与 ירד／בית，并保留叙事中的重复。
  issues:
  - severity: medium
    issue: “回来”对 בָא 的译法略增语义。
    rationale: 原文仅说乌利亚“从旅途／路上来”，并未明说“返回”。虽语境可能暗示返程，中文宜译“来”以免将语境推断写入正文。
  - severity: medium
    issue: 末句“自己家里”未明确对应原文第二人称“你的家”。
    rationale: 在大卫直接对乌利亚说话的语境中，“你家里”更自然且准确保留人称；“自己”虽通常可理解，却弱化了原文人称转换。
  - severity: medium
    issue: 脚注 a 的锚点置于“大卫”之后，与脚注所说明的“下到……家里”不对应。
    rationale: 脚注应紧随首次出现的相关短语，以确保读者能够辨识其所注释的表达。
  revised_text: 有人来告诉大卫说：“乌利亚没有下到自己的家里[a]。”大卫就对乌利亚说：“你不是从旅途中来的吗？为什么没有下到你家里去？”
  revised_footnotes:
