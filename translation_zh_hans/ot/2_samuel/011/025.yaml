reference: 2 Samuel 11:25
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר דָּוִ֜ד אֶל הַ/מַּלְאָ֗ךְ כֹּֽה תֹאמַ֤ר אֶל יוֹאָב֙ אַל יֵרַ֤ע בְּ/עֵינֶ֨י/ךָ֙ אֶת הַ/דָּבָ֣ר הַ/זֶּ֔ה כִּֽי כָ/זֹ֥ה וְ/כָ/זֶ֖ה תֹּאכַ֣ל הֶ/חָ֑רֶב הַחֲזֵ֨ק מִלְחַמְתְּ/ךָ֧ אֶל הָ/עִ֛יר וְ/הָרְסָ֖/הּ וְ/חַזְּקֵֽ/הוּ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/025.yaml
  text: Then David said to the messenger[a], “Thus you shall say to Joab, ‘Do not let this matter be evil in your eyes, for the sword devours one as well as another[c][b]. Strengthen your attack against the city and overthrow it.’ And encourage him.”
translation:
  language: zh_hans
  text: 大卫对信使说：“你要这样告诉约押：‘不要把这事看为恶[a]，因为刀剑有时吞噬这个人，有时吞噬那个人[b]。你要加强对这城的攻势，把城拆毁。’你还要鼓励他[c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“不要因这事不悦”。希伯来文直译为“不要让这事在你眼中为恶”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文作“刀剑这样那样地吞噬”，是指刀剑会杀这个人，也会杀那个人。
    reason: lexical_alternative
  - marker: c
    text: 或译“使他刚强”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּלְאָךְ
  choice: 报信的人
  rationale: 本段所指的是把战况带给大卫、再替大卫传话给约押的人类信使；“报信的人”符合叙事语境，也避免被误解为天使。
- source_word: כֹּה תֹאמַר
  choice: 你要这样告诉
  rationale: 保留传话公式的明确命令语气，同时采用自然的现代汉语表达。
- source_word: אַל יֵרַע בְּעֵינֶיךָ
  choice: 不要把这事看为恶
  rationale: 保留“在眼中为恶”的评价色彩，没有只把它弱化为情绪上的“不高兴”；较顺畅的意译收入脚注。
- source_word: הַדָּבָר הַזֶּה
  choice: 这事
  rationale: 泛指刚刚报告的战事及乌利亚之死，不在译文中把所指范围说得过窄。
- source_word: כִּי כָזֹה וְכָזֶה
  choice: 因为……有时……这个，有时……那个
  rationale: 该习语表达刀剑造成的伤亡并不固定；重复“这个……那个”既传达其不加区别的意味，也保留原文形式。
- source_word: תֹּאכַל הֶחָרֶב
  choice: 刀剑……吞噬
  rationale: 保留原文以“吃、吞噬”描绘刀剑杀人的鲜明隐喻，而不平译成“杀死”。
- source_word: הַחֲזֵק מִלְחַמְתְּךָ אֶל הָעִיר
  choice: 加强对城的攻势
  rationale: 在自然汉语中表达“使针对该城的战事更强”，符合围城作战的语境。
- source_word: וְהָרְסָהּ
  choice: 把城拆毁
  rationale: 原动词表示拆除、摧毁；明确补出宾语“城”，使中文指代清楚。
- source_word: וְחַזְּקֵהוּ
  choice: 你还要鼓励他
  rationale: 阳性单数后缀最自然地指约押；在人际语境中，“鼓励”准确表达使他刚强、振作之意，直译另见脚注。
theological_decisions:
- issue: 大卫对乌利亚之死的道德淡化
  choice: 保留“看为恶”的道德评价措辞
  alternative: 译作“不要因这事不悦”
  rationale: 原文不只描述约押的情绪，也使用“恶”这一词汇；译文不替大卫消除这种带有道德张力的自我开脱。
- issue: 末句命令的对象与功能
  choice: 译为大卫吩咐报信者鼓励约押
  alternative: 把末句并入给约押的信息，或译为“使他刚强”
  rationale: 语法中的第三人称阳性单数后缀最自然地回指约押，而命令的直接承受者仍是报信者；但“鼓励”与更字面的“使他刚强”之间的差异在脚注中保留。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“刀剑吞噬”保留原文意象；“加强对城的攻势”则避免生硬直译。引语层次清楚，末句置于约押口信之外，以反映大卫另行吩咐报信者鼓励约押。
