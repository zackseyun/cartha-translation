  text: So David sent word to Joab, “Send Uriah the Hittite to me.” And Joab sent Uriah to David.
translation:
  language: zh_hans
  text: 于是，大卫派人去告诉约押：“把赫人乌利亚派到我这里来。”约押就派乌利亚到大卫那里。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח דָּוִד אֶל יוֹאָב
  choice: 大卫派人对约押说
  rationale: שׁלח本义为“派、送”。此处没有明说受差遣者或信息，但后接直接命令；汉语用“派人对……说”自然表达大卫传令的动作，又不把约押误作被派遣的对象。
- source_word: שְׁלַח אֵלַי
  choice: 派到我这里来
  rationale: 祈使式שְׁלַח表达直接命令；אֵלַי意为“到我这里”。“派到我这里来”保留方向和命令语气，不增添“召回”等原文未明说的含义。
- source_word: אֶת אוּרִיָּה הַחִתִּי
  choice: 赫人乌利亚
  rationale: אוּרִיָּה按通行中文译名作“乌利亚”；הַחִתִּי是族属称谓，采用现代中文圣经与历史语境中通行的“赫人”。宾格标记אֶת不另译。
- source_word: וַיִּשְׁלַח יוֹאָב אֶת אוּרִיָּה אֶל דָּוִד
  choice: 约押就把乌利亚派到大卫那里
  rationale: 重复“派”以对应原文再次使用שׁלח；“就”自然体现叙事承接及约押执行命令的次序，אֶל דָּוִד译为“到大卫那里”。
