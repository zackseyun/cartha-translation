base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/024.yaml
  text: The archers shot at your servants from atop the wall[a], and some of the king’s servants died[b]; your servant Uriah the Hittite also died.
translation:
  language: zh_hans
  text: 弓箭手从城墙上向你的臣仆射箭，王的臣仆中有些人死了；你的臣仆赫人乌利亚也死了。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 末句也可译作“你的臣仆赫人乌利亚也已经死了”；希伯来语形式着重于他处于死亡状态。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּרוּ הַמּוֹרִים
  choice: 弓箭手……射箭
  rationale: 该短语由“射击”和“射手”构成；在攻城语境中译作“弓箭手……射箭”自然清楚，同时保留军事含义。
- source_word: אֶל עֲבָדֶיךָ
  choice: 向你的臣仆
  rationale: אֶל 与射击动词连用表示射击所朝向的对象；“臣仆”保留向君王禀报时的宫廷敬语。
- source_word: מֵעַל הַחוֹמָה
  choice: 从城墙上
  rationale: מֵעַל 表示从墙上方或墙顶的位置发射；此译符合现代汉语表达。
- source_word: וַיָּמֻתוּ מֵעַבְדֵי הַמֶּלֶךְ
  choice: 王的臣仆中有些人死了
  rationale: 介词 מִן 在此具有部分义，表明死者是王的臣仆中的一部分，而非全体。
- source_word: וְגַם
  choice: 也
  rationale: 保留附加并加强后项报告的作用，使乌利亚之死成为最后的重点。
- source_word: עַבְדְּךָ אוּרִיָּה הַחִתִּי
  choice: 你的臣仆赫人乌利亚
  rationale: “你的臣仆”保留恭敬称谓；“赫人乌利亚”采用现代中文圣经中通行的人名与族名形式。
- source_word: מֵת
  choice: 死了
  rationale: 该形式可表达“已经死了／是死的”这一状态；在叙事禀报中，“死了”最自然，并与前句事件相连。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“臣仆”体现使者向大卫王禀报时的敬语语域；分号突出乌利亚之死在报告中的递进和收束作用。
