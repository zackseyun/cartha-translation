  text: וַ/יַּעֲבֹ֣ר הָ/אֵ֗בֶל וַ/יִּשְׁלַ֨ח דָּוִ֜ד וַ/יַּאַסְפָ֤/הּ אֶל בֵּית/וֹ֙ וַ/תְּהִי ל֣/וֹ לְ/אִשָּׁ֔ה וַ/תֵּ֥לֶד ל֖/וֹ בֵּ֑ן וַ/יֵּ֧רַע הַ/דָּבָ֛ר אֲשֶׁר עָשָׂ֥ה דָוִ֖ד בְּ/עֵינֵ֥י יְהוָֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/027.yaml
  text: When the mourning was over[a], David sent and brought her into his house, and she became his wife and bore him a son. But the thing that David had done was evil in the eyes of Yahweh.
translation:
  language: zh_hans
  text: 哀悼期过后，大卫派人把她接到自己家中；她就成了他的妻子，并为他生了一个儿子。可是，大卫所做的这事在雅威眼中是恶的。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“令雅威不悦”。希伯来文直译为“在雅威眼中是恶的”，表达雅威对大卫所行之事的道德判断。
    reason: 说明可采用的惯用译法，并交代正文保留希伯来文道德评价力度的原因。
lexical_decisions:
- source_word: הָאֵבֶל
  choice: 哀悼期
  rationale: 这里指乌利亚死后的哀悼时段，不只是内心的悲伤；“哀悼期”自然地保留了时间和礼俗层面的含义。
- source_word: וַיַּעֲבֹר
  choice: 过后
  rationale: 该动词本义为“过去”；与“哀悼期”搭配译作“过后”，符合现代汉语的时间表达，也清楚交代事件次序。
- source_word: וַיַּאַסְפָהּ אֶל־בֵּיתוֹ
  choice: 把她接到自己家中
  rationale: אָסַף在这里表示把拔示巴接入自己的住所或家室。“接到……家中”比字面的“聚集”自然，同时没有额外强调她是否自愿。
- source_word: וַתְּהִי לוֹ לְאִשָּׁה
  choice: 她就成了他的妻子
  rationale: 这一结构表示身份发生变化；“成了他的妻子”准确而自然。
- source_word: וַתֵּלֶד לוֹ בֵּן
  choice: 为他生了一个儿子
  rationale: 准确表达ילד与间接受词לוֹ的关系，是自然的现代汉语说法。
- source_word: הַדָּבָר אֲשֶׁר עָשָׂה דָוִד
  choice: 大卫所做的这事
  rationale: דָּבָר在此指大卫所行的事；此译法保留希伯来文具体的指称，又符合汉语习惯。
- source_word: וַיֵּרַע
  choice: 是恶的
  rationale: 该词在本语境中表达明确的道德否定；“是恶的”保留其力度，不弱化为单纯令人不快。
- source_word: בְּעֵינֵי יְהוָה
  choice: 在雅威眼中
  rationale: 保留希伯来文“在……眼中”的评判性隐喻，表示雅威对大卫行为的道德判断。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现以色列上帝的专名，而不以称号替代。
theological_decisions:
- issue: 叙述者对大卫行为的道德评价力度
  choice: “在雅威眼中是恶的”
  alternative: “令雅威不悦”
  rationale: 希伯来文וַיֵּרַע在这里具有明确的道德含义；正文保留“恶”的直率判断，避免把谴责弱化为主观的不悦。
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 正文以音译呈现专名，既区别于“主”这一称号，也不把所依据的辅音传统误作其他读音。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“哀悼期过后”简洁交代时间推进；“接到自己家中”避免古奥直译；末句保留“在……眼中是恶的”这一希伯来语意象与鲜明的道德判断。脚注标记置于其实际说明的末句之后。
