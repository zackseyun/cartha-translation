  text: And he commanded the messenger[a], saying, “When you have finished telling the king all the news of the battle,”
translation:
  language: zh_hans
  text: 他吩咐传信的人说：“你把战事的全部情况[a]向王禀报完以后，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“有关战事的一切事项”，即战事的完整报告。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: 他吩咐
  rationale: צוה表示带有权威地命令或交代；“吩咐”既保留权威意味，也符合叙事语体。
- source_word: הַמַּלְאָךְ
  choice: 传信的人
  rationale: מַלְאָךְ可指使者或天使；本处是递送军情的人，用“传信的人”可明确其人类信使身份，且通俗自然。
- source_word: לֵאמֹר
  choice: 说
  rationale: 这是希伯来叙事中引出直接引语的常见形式，译作“说”简洁自然。
- source_word: כְּכַלּוֹתְךָ
  choice: 你……完以后
  rationale: כ加带第二人称后缀的不定词构成时间从句；“完以后”准确表达动作完成后的时序，而不额外强调立即性。
- source_word: כָּל דִּבְרֵי הַמִּלְחָמָה
  choice: 战事的全部情况
  rationale: 字面为“战争的一切话语／事情”，语境指有关战斗的完整报告；“战事的全部情况”在现代汉语中自然，并保留范围完整之意。
- source_word: לְדַבֵּר אֶל הַמֶּלֶךְ
  choice: 向王禀报
  rationale: 该结构字面为“对王说”；在下属向君王递交军情的语境中，“向王禀报”自然体现其交际功能与身份关系。
