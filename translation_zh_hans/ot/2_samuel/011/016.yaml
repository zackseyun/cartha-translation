  text: So when Joab was watching the city[a], he stationed Uriah in the place where he knew the mighty men were.
translation:
  language: zh_hans
  text: 约押监视那城时，就把乌利亚部署在他知道那里有勇猛的战士的地方。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּשְׁמֹר יוֹאָב אֶל־הָעִיר
  choice: 约押围察那城的时候
  rationale: ב加不定式构成时间从句；שׁמר在围城语境中表示监视、察看。译作“围察”简洁体现围城中的监视行动，又不把介词אֶל过度解释为“攻击”。
- source_word: וַיִּתֵּן אֶת־אוּרִיָּה
  choice: 就把乌利亚部署在
  rationale: נתן字面为“放置”，此处指有意安排士兵的位置；“部署”自然传达军事语境中的战术性安置。
- source_word: הַמָּקוֹם
  choice: 地方
  rationale: 保留מקום的普通空间含义；其战术色彩已由“部署”及上下文表达。
- source_word: יָדַע
  choice: 他知道
  rationale: 按ידע的常用义直译，不额外推断约押如何获得这一信息。
- source_word: אַנְשֵׁי חַיִל
  choice: 勇猛战士
  rationale: חיל在这里描述有能力、强悍而难以对付的作战人员。“勇猛战士”明确军事所指，同时避免让读者误以为这是大卫勇士团的专称。
- source_word: שָׁם
  choice: 有……的地方
  rationale: 用汉语存在句自然表达“那里有”；方位意义已融入“地方”的关系结构。
- source_word: וַיְהִי
  choice: ……的时候，就……
  rationale: 将希伯来叙事中的事件引介自然地并入现代汉语“……的时候，就……”结构，保留时间推进关系。
