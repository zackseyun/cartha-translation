  yaml_path: translation/ot/2_samuel/011/014.yaml
  text: In the morning[a], David wrote a letter to Joab and sent it by the hand of Uriah.
translation:
  language: zh_hans
  text: 到了早晨，大卫写了一封信给约押，托乌利亚带去。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “托乌利亚带去”直译为“借乌利亚的手送去”；也可译作“由乌利亚送去”或“让乌利亚带去”。
    reason: 说明希伯来语 בְּיַד 的字面意象及其表示经由、携带或递送的惯用含义。
lexical_decisions:
- source_word: וַיְהִי בַבֹּקֶר
  choice: 到了早晨
  rationale: 叙事性的 וַיְהִי 承接前文并引出下一事件；与时间短语合译为“到了早晨”，既自然，又保留事件推进的意味。
- source_word: וַיִּכְתֹּב
  choice: 写了
  rationale: 采用现代汉语中最普通、直接的叙事用语。
- source_word: סֵפֶר
  choice: 一封信
  rationale: 该词可泛指书面文件，但此处是大卫写给约押并托人送达的信息，语境所指自然是“信”。
- source_word: אֶל יוֹאָב
  choice: 给约押
  rationale: 介词 אֶל 标明书信的收件人；汉语以“写信给约押”表达最自然。
- source_word: וַיִּשְׁלַח בְּיַד אוּרִיָּה
  choice: 交由乌利亚亲手带去
  rationale: בְּיַד 字面为“借着……的手”，在此表示由乌利亚携带、送交。译作“亲手带去”保留“手”的意象及乌利亚本人携带此信的讽刺张力，同时符合现代汉语。
- source_word: אוּרִיָּה
  choice: 乌利亚
  rationale: 采用现代中文圣经人名的通行音译。
theological_decisions: []
translation_notes:
  register: 使用自然、庄重而易懂的现代标准汉语。“亲手带去”有意保留原文“手”的意象，但脚注说明其惯用含义，避免误解为仅强调亲自书写或直接交付。
