base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/017.yaml
  text: The men of the city came out and fought against Joab[a], and some of the people among David’s servants fell[b]; Uriah the Hittite also died.
translation:
  language: zh_hans
  text: 城里的人出来[a]，与约押交战。大卫的臣仆中有些人阵亡了[b]，赫人乌利亚也死了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “出来”也可译作“出去”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文作“从百姓中、从大卫的臣仆中，有人倒下了”；两个“从……”短语表示其中一部分人，指大卫的臣仆中有些人。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצְאוּ
  choice: 出来
  rationale: יצא表示“出去、出来”。这里是城中的人出城迎战；“出来”符合叙事观察角度，同时在脚注中保留“出去”这一可能译法。
- source_word: אַנְשֵׁי הָעִיר
  choice: 城里的人
  rationale: 原文直译为“城中的男人”。语境明确指城中的男性战士；现代汉语用“城里的人”自然简洁，也不改变所指群体。
- source_word: וַיִּלָּחֲמוּ אֶת יוֹאָב
  choice: 与约押交战
  rationale: 该战争用语表示敌对交战。“与约押交战”在汉语中自然，并保留约押作为对阵一方的表达。
- source_word: וַיִּפֹּל
  choice: 阵亡了
  rationale: נפל在战事叙述中常以“倒下”委婉表示战死；“阵亡”清楚传达本节的战场伤亡含义。
- source_word: מִן הָעָם מֵעַבְדֵי דָוִד
  choice: 大卫的臣仆中有些人
  rationale: 两个מן短语在这里构成部分表达，说明死者是大卫臣仆中的一部分。“有些人”使这一关系在现代汉语中清楚自然。
- source_word: עַבְדֵי דָוִד
  choice: 大卫的臣仆
  rationale: עבד可指仆人，也可指为君王效力的臣属。此处是军事王权语境，“臣仆”兼顾字面服务关系与王室人员身份。
- source_word: וַיָּמָת גַּם אוּרִיָּה הַחִתִּי
  choice: 赫人乌利亚也死了
  rationale: גם表示乌利亚也包括在死者之中；保留“也”凸显叙事焦点，同时不额外解释其死亡。
- source_word: הַחִתִּי
  choice: 赫人
  rationale: 采用现代中文圣经传统中对该族称的通行译名。
theological_decisions: []
