base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/007.yaml
  text: When Uriah came to him[a], David asked about Joab's welfare, the welfare of the troops, and the welfare of the war.
translation:
  language: zh_hans
  text: 乌利亚来到大卫那里，大卫就问约押是否安好、军兵是否安好，以及战事进展如何。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文三次使用同一个“平安”结构，直译为：“问约押的平安、军兵的平安和战事的平安。”
    reason: 说明希伯来原文刻意重复לִשְׁלוֹם；正文按现代汉语习惯分别译作“是否安好”和“进展如何”。
lexical_decisions:
- source_word: וַיָּבֹא
  choice: 来到
  rationale: בוא在此表示向某人所在之处而来；“来到”与后面的אֵלָיו自然衔接。
- source_word: אֵלָיו
  choice: 大卫那里
  rationale: 原文直译为“他那里”，所指是大卫。汉语明说“大卫”可避免代词指向含混，又不改变原意。
- source_word: וַיִּשְׁאַל
  choice: 问
  rationale: שׁאל在此表示询问前线情况；“问”简洁自然，符合叙事语体。
- source_word: לִשְׁלוֹם
  choice: 是否安好／进展如何
  rationale: שָׁלוֹם在这一结构中指人或事的安好、状况。用于约押和军兵时译为“是否安好”，用于战事时译为“进展如何”，既传达同一希伯来习语，也符合现代汉语搭配。
- source_word: יוֹאָב
  choice: 约押
  rationale: 采用现代中文圣经中通行的人名译法。
- source_word: הָעָם
  choice: 军兵
  rationale: עָם本义可作“百姓、人民”，但在约押率军作战的语境中指参战人员；“军兵”既明确语境所指，也保持庄重。
- source_word: הַמִּלְחָמָה
  choice: 战事
  rationale: מִלְחָמָה可指战争、战斗或作战情势；此处大卫询问前线状况，“战事”比“战争”更自然地涵盖战况与进展。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重的现代标准汉语。正文保留原文三个并列询问对象，同时按汉语习惯调整“平安”与“战事”的搭配；脚注呈现原文重复结构，避免掩盖其形式特征。
