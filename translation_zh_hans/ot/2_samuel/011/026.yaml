base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/026.yaml
  text: When Uriah’s wife heard that Uriah her husband was dead[a], she mourned for her husband.
translation:
  language: zh_hans
  text: 乌利亚的妻子听说她的丈夫乌利亚死了[a]，就为她的丈夫哀悼。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“听说她的丈夫乌利亚已经死了。”
    reason: 保留 מֵת 可侧重死亡状态，也可按汉语时体表达为“已经死了”的译法差异。
lexical_decisions:
- source_word: וַתִּשְׁמַע
  choice: 听说
  rationale: שׁמע 在此表示听到并获知消息；现代汉语“听说”自然地引出所听见的内容，又比“得知”更贴近基本词义。
- source_word: אֵשֶׁת אוּרִיָּה
  choice: 乌利亚的妻子
  rationale: 按希伯来语构属关系直译，同时保留叙事者以丈夫身份称呼她的表达。
- source_word: כִּי
  choice: （由“听说”直接引出内容）
  rationale: כִּי 在这里引出所听见的内容；汉语“听说……”无需另译“that”。
- source_word: מֵת
  choice: 死了
  rationale: מֵת 表明乌利亚已处于死亡状态；“死了”是自然、庄重的现代汉语，也容纳“已经死去”的完成含义。
- source_word: אוּרִיָּה אִישָׁהּ
  choice: 她丈夫乌利亚
  rationale: 保留名字与婚姻关系的同位说明；这一语序符合现代汉语，也对应原文对乌利亚身份的明确重申。
- source_word: וַתִּסְפֹּד
  choice: 就……哀悼
  rationale: ספד 指为死者举哀、哀悼；“哀悼”清楚而庄重，“就”体现连续叙事中的结果性推进。
- source_word: עַל
  choice: 为
  rationale: 与“哀悼”搭配时，עַל 标示哀悼的对象，汉语自然表达为“为……哀悼”。
- source_word: בַּעְלָהּ
  choice: 丈夫
  rationale: בַּעַל 在婚姻语境中明确指“丈夫”；不采用“主人”等会额外引入支配意味的译法。
theological_decisions: []
translation_notes:
  register: 采用现代、自然而庄重的叙事语体。“乌利亚的妻子”与“她丈夫乌利亚”保留原文重复的关系称谓；末句省去“她”的重复，以符合汉语习惯，但仍清楚指她自己的丈夫。
