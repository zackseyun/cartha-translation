  yaml_path: translation/ot/2_samuel/011/022.yaml
  text: So the messenger went and came and told David all that Joab had sent him to say[a].
translation:
  language: zh_hans
  text: 于是，使者去了，来到后，把约押派他传达[a]的一切都告诉了大卫。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“约押派他的一切”。原文没有明说使者所受差派的具体行动；根据语境，这里指约押派他去传达的信息。
    reason: 说明原文在“派他”后省略的交际性补足，并解释中文“传达”的依据。
lexical_decisions:
- source_word: הַמַּלְאָךְ
  choice: 使者
  rationale: 这里是约押派往大卫那里的军事传信人员，因此取人类语境中 מַלְאָךְ 的常用义“使者”，而非“天使”。
- source_word: וַיֵּלֶךְ וַיָּבֹא
  choice: 去了，来到
  rationale: 保留两个连续动词所形成的叙事推进：使者先动身，继而来到大卫那里；中文虽略显重复，却忠实呈现希伯来文节奏。
- source_word: וַיַּגֵּד לְדָוִד
  choice: 告诉了大卫
  rationale: Hiphil 形式 וַיַּגֵּד 表示“告知、报告”；“告诉了大卫”自然清楚，也保留原文的受话者。
- source_word: אֵת כָּל אֲשֶׁר
  choice: 一切
  rationale: כָּל 表明信息内容的完整范围；“一切”简洁地保留了这一总括含义。
- source_word: שְׁלָחוֹ יוֹאָב
  choice: 约押派他传达
  rationale: 原文直译近于“约押派他的”，结合使者汇报信息的语境，中文补出“传达”以使句意完整；脚注说明这一补足。
- source_word: דָוִד / יוֹאָב
  choice: 大卫 / 约押
  rationale: 采用现代简体中文圣经人名的通行译法。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“于是”承接前文叙事；保留“去了，来到”的连续动作，同时用“派他传达”清楚表达使者所负的传信任务。
