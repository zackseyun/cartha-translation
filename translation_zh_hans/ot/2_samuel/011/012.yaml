  text: וַ/יֹּ֨אמֶר דָּוִ֜ד אֶל אוּרִיָּ֗ה שֵׁ֥ב בָּ/זֶ֛ה גַּם הַ/יּ֖וֹם וּ/מָחָ֣ר אֲשַׁלְּחֶ֑/ךָּ וַ/יֵּ֨שֶׁב אוּרִיָּ֧ה בִ/ירוּשָׁלִַ֛ם בַּ/יּ֥וֹם הַ/ה֖וּא וּ/מִֽ/מָּחֳרָֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/012.yaml
  text: Then David said to Uriah[a], “Stay here today also, and tomorrow I will send you away.” So Uriah stayed in Jerusalem that day and the next day.
translation:
  language: zh_hans
  text: 大卫对乌利亚说：“你今天也留在这里，明天我会打发你走。”于是，乌利亚那一天和次日[a]都留在耶路撒冷。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“那一天和随后的一天”。
    reason: 原文末尾的时间表达指“那一天”和紧随其后的那一天；此处提供自然的汉语替代表达。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 叙事性连续式推进情节；现代汉语通常不必另加“然后”，上下文已清楚表达先后关系。
- source_word: שֵׁב בָּזֶה
  choice: 留在这里
  rationale: ישׁב在此不是字面的“坐”，而是暂时停留；“留在这里”自然、准确。
- source_word: גַּם הַיּוֹם
  choice: 今天也
  rationale: 保留גַּם所表达的附加意味，说明乌利亚还要再留一天。
- source_word: וּמָחָר אֲשַׁלְּחֶךָּ
  choice: 明天我就让你走
  rationale: שׁלח在此指准许或打发乌利亚离开；“让你走”符合对话语境，也避免误解为派他执行新任务。
- source_word: וַיֵּשֶׁב
  choice: 于是……留在
  rationale: “于是”自然呈现大卫命令之后的叙事结果，并与前句的“留在”保持词汇呼应。
- source_word: בִּירוּשָׁלִַם
  choice: 在耶路撒冷
  rationale: 按地点介词בְּ及专名的通常意义翻译。
- source_word: בַּיּוֹם הַהוּא וּמִמָּחֳרָת
  choice: 那一天和次日
  rationale: 直译两个相连的时间范围；מִמָּחֳרָת指随后的一天。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“让你走”贴近日常命令语境；“次日”保持经文叙事的凝练感。脚注标记置于其所说明的时间短语之后。
