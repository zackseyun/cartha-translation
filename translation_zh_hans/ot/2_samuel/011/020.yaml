base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/020.yaml
  text: And if the king’s anger rises and he says to you[a], ‘Why did you go so near the city to fight? Did you not know what they would shoot from the wall?’
translation:
  language: zh_hans
  text: 倘若王发怒，对你说：‘你们为什么要逼近那城交战？难道你们不知道他们会从城墙上射来些什么吗？’[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “射来些什么”也可译作“投掷些什么”。原文动词可泛指射出或投掷投射物。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה אִם
  choice: 如果
  rationale: 该结构承接上文，引入约押所设想的条件情形；现代汉语以“如果”表达最自然，无须机械译出连接词。
- source_word: תַּעֲלֶה חֲמַת הַמֶּלֶךְ
  choice: 王发怒
  rationale: חֵמָה表示怒气，עלה描写怒气上升；“发怒”以自然简洁的汉语传达整个短语的动态含义。
- source_word: וְאָמַר לְךָ
  choice: 对你说
  rationale: 在条件句所设想的场景中，译作“对你说”自然地引出直接引语。
- source_word: נִגַּשְׁתֶּם אֶל הָעִיר לְהִלָּחֵם
  choice: 靠近城墙交战
  rationale: נגשׁ表示走近，לְהִלָּחֵם表示交战的目的。上下文所责问的是军队过分靠近设防城墙，因此用“城墙”明确实际危险所在，同时保持原意。
- source_word: הֲלוֹא יְדַעְתֶּם
  choice: 难道你们不知道
  rationale: 保留原文预期肯定答案的反问语气，并符合现代汉语表达。
- source_word: אֵת אֲשֶׁר יֹרוּ
  choice: 他们会……射下来
  rationale: ירה在使役词干中可指射出或投掷物体；军事语境下“射”是常见含义，“下来”结合墙上的位置自然表达弹射物的来向。
- source_word: מֵעַל הַחוֹמָה
  choice: 从城墙上
  rationale: מֵעַל意为“从……上面”；“从城墙上”准确保留其空间含义。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而自然的叙事用语。直接引语保留责问和反问的力度；“交战”比“打仗”略显庄重，又不至于古雅。脚注标记置于整段引语之后。
