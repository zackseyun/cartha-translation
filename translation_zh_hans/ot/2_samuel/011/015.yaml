  text: He wrote in the letter[a], saying, "Set Uriah at the front of the hardest fighting, then withdraw from behind him so that he may be struck down and die."
translation:
  language: zh_hans
  text: 他在信中写道：“要把乌利亚置于战斗最激烈的前线，然后从他身后撤退，好让他被击倒而死。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּכְתֹּב בַּסֵּפֶר לֵאמֹר
  choice: 他在信中写道
  rationale: 叙事体wayyiqtol用汉语过去事件的自然表达；סֵפֶר在上下文中指大卫送出的书信，לֵאמֹר自然融入“写道”。
- source_word: הָבוּ אֶת אוּרִיָּה
  choice: 要把乌利亚安置
  rationale: הָבוּ是复数命令式；“安置”既表达安排位置的命令，也保持庄重而自然的语体。
- source_word: אֶל מוּל פְּנֵי הַמִּלְחָמָה הַחֲזָקָה
  choice: 在战斗最激烈的前线
  rationale: מוּל פְּנֵי表示正面、前沿的暴露位置，הַמִּלְחָמָה הַחֲזָקָה指激烈、猛烈的战斗；此译兼顾军事场景和现代汉语习惯。
- source_word: וְשַׁבְתֶּם מֵאַחֲרָיו
  choice: 然后从他后面撤退
  rationale: שׁוּב在此表示转身退回或撤退；保留“从他后面”，明确表现原文所述撤去其后方支援的战术性遗弃。
- source_word: וְנִכָּה וָמֵת
  choice: 使他被击倒而死
  rationale: נכה的Nifal形式表达“被击打、被击倒”，随后独立的וָמֵת明确结果是死亡；译文保留两个动作之间的因果推进，没有简化成单一的“杀死”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重且清楚的叙事汉语。“战斗最激烈的前线”传达希伯来语军事短语的整体含义；本节无须设置脚注。英文材料所列脚注内容实际是同一短语的另一种译法，而非“信”的异文，因此未沿用其错位标记。
