  text: וַ/יֹּ֤אמֶר הַ/מַּלְאָךְ֙ אֶל דָּוִ֔ד כִּֽי גָבְר֤וּ עָלֵ֨י/נוּ֙ הָֽ/אֲנָשִׁ֔ים וַ/יֵּצְא֥וּ אֵלֵ֖י/נוּ הַ/שָּׂדֶ֑ה וַ/נִּהְיֶ֥ה עֲלֵי/הֶ֖ם עַד פֶּ֥תַח הַ/שָּֽׁעַר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/023.yaml
  text: The messenger said to David[a], “The men were stronger than we were, and they came out against us into the open field[b]; but we pressed them back as far as the entrance of the gate.”
translation:
  language: zh_hans
  text: 报信的人对大卫说：“那些人胜过了我们[a]，出来，在田野迎战我们；但我们向他们发起反攻[b]，一直到城门口。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“那些人比我们强。”
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“我们在他们之上”。这是军事用语，可指我们向他们进攻，或把他们逼退。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּלְאָךְ
  choice: 报信的人
  rationale: 此处指奉命向大卫报告战况的军中信使，而非天使；“报信的人”符合叙事语境，也便于现代读者理解。
- source_word: כִּי
  choice: 不单独译出，引出报告内容
  rationale: 这里的 כִּי 引出信使所说的内容，现代汉语直接进入引语更自然。
- source_word: גָבְרוּ עָלֵינוּ
  choice: 胜过了我们
  rationale: גבר 与 עַל 连用，表示力量占上风或胜过对方；此译保留原文既可理解为“比我们强”，也可理解为“占了上风”的空间。
- source_word: הָאֲנָשִׁים
  choice: 那些人
  rationale: 原文直称“那些人”；上下文表明他们是守城的敌军，无须在正文中增译为“士兵”。
- source_word: וַיֵּצְאוּ אֵלֵינוּ הַשָּׂדֶה
  choice: 出城到田野来迎战我们
  rationale: 原文描写守军从城中出来，在城外田野与大卫的军队交战；“迎战”自然表达 אֵלֵינוּ 在军事语境中的敌对趋向。
- source_word: וַנִּהְיֶה עֲלֵיהֶם
  choice: 我们反攻他们
  rationale: 字面是“我们在他们之上／向他们而去”，在此军事语境中表示转而向敌军进攻；“反攻”衔接前文敌军一度占上风，又不过度规定具体战术动作。
- source_word: עַד פֶּתַח הַשָּׁעַר
  choice: 一直逼到城门口
  rationale: עַד 标明进攻所达到的界限，פֶּתַח הַשָּׁעַר 是城门的入口；“城门口”是自然且准确的现代汉语表达。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而清楚的战况报告语体。“报信的人”避免将人类军使误解为天使；正文保留战局先失利、后反攻的转折。脚注标记均紧随其所说明的短语。
