base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/013.yaml
  text: David invited him[a], and he ate and drank before him, and he made him drunk. In the evening he went out to lie on his bed with the servants of his lord[d][c][b], but he did not go down to his house.
translation:
  language: zh_hans
  text: 大卫召乌利亚来[a]，乌利亚就在他面前[b]吃喝；大卫把他灌醉了。到了晚上，乌利亚出去，和他主人的仆人们[c]一起躺在自己的铺位上，却没有下到自己家里去[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“叫乌利亚来”或“召见乌利亚”。
    reason: lexical_alternative
  - marker: b
    text: “他”指大卫；意思是乌利亚在大卫面前，也就是在大卫在场时吃喝。
    reason: referent_clarification
  - marker: c
    text: 也可译“和他主人的众仆人一起”。这里的“主人”指大卫。
    reason: referent_clarification
  - marker: d
    text: 原文是“没有下到自己家里去”。这里保留了原文“下去”的方向用语，没有简化为“没有回家”。
    reason: source_form
lexical_decisions:
- source_word: וַיִּקְרָא לוֹ
  choice: 大卫召乌利亚来
  rationale: קרא 加 ל 指向某人时可表示叫某人来、召来。语境中大卫主动叫乌利亚赴席；“召……来”既自然，又保留了原文较“邀请”更宽泛的含义。
- source_word: לְפָנָיו
  choice: 在他面前
  rationale: 直译为“在他面前／在他面前的所在”，即乌利亚在大卫面前、在大卫在场时吃喝；正文保留原文的关系性表达，并以脚注说明所指。
- source_word: וַיְשַׁכְּרֵהוּ
  choice: 大卫把他灌醉了
  rationale: שׁכר 的使役形明确表示大卫使乌利亚醉。“把他灌醉了”以现代汉语直接呈现使役意义和大卫的主动行为。
- source_word: בָּעֶרֶב
  choice: 到了晚上
  rationale: 自然标示叙事进入下一时段，同时保留原文的时间推进。
- source_word: לִשְׁכַּב
  choice: 躺
  rationale: 该不定式表示躺下；不译作“睡觉”，以免增添原文未明确陈述的结果。
- source_word: בְּמִשְׁכָּבוֹ
  choice: 在自己的铺位上
  rationale: מִשְׁכָּב 可指床或睡卧之处。这里与主人仆人们共同留宿的场景中，“铺位”比固定家具意味较强的“床”更合适，同时后缀表明这是乌利亚所用的卧处。
- source_word: עִם עַבְדֵי אֲדֹנָיו
  choice: 和他主人的仆人们一起
  rationale: 保留“他的主人”的第三人称所属结构；脚注说明这里的主人是大卫，不在正文中替原文消除这一称谓所带的叙事意味。
- source_word: וְאֶל בֵּיתוֹ לֹא יָרָד
  choice: 却没有下到自己家里去
  rationale: 保留 ירד“下去”的方向意义，因为该动词在上下文中反复出现；“却”自然表达此处与大卫意图相反的转折。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。为避免连续代词在汉语中造成主语误读，第二分句明确写出“乌利亚”，使读者知道吃喝的是乌利亚；同时仍以“在他面前”及脚注保留原文表达。
