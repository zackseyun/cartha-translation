revisions:
- from: 一年周而复始的时候[a]，正值列王出征之时[b]，大卫派出约押，以及跟随约押的臣仆和全以色列。他们重创亚扪人，围攻拉巴；大卫却留在耶路撒冷。
  to: 年岁回转的时候[a]，正值列王出征之时[b]，大卫派出约押、他的臣仆和以色列全军同去。他们蹂躏亚扪人，围攻拉巴；大卫却留在耶路撒冷。
  rationale: 修订纠正了将大卫的臣仆误作约押随从的归属问题，保留原文并列的出征队伍。“年岁回转”较自然地保留时间习语；“以色列全军”依直接军事语境明确集体称谓的功能；“蹂躏”更贴合原文的破坏性动词。脚注锚点及其替代读法说明均予以保留。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T05:26:58Z'
