id: 2SA.11.1
reference: 2 Samuel 11:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יְהִי֩ לִ/תְשׁוּבַ֨ת הַ/שָּׁנָ֜ה לְ/עֵ֣ת צֵ֣את הַ/מַּלְאֿכִ֗ים וַ/יִּשְׁלַ֣ח דָּוִ֡ד אֶת יוֹאָב֩ וְ/אֶת עֲבָדָ֨י/ו עִמּ֜/וֹ וְ/אֶת כָּל יִשְׂרָאֵ֗ל וַ/יַּשְׁחִ֨תוּ֙ אֶת בְּנֵ֣י עַמּ֔וֹן וַ/יָּצֻ֖רוּ עַל רַבָּ֑ה וְ/דָוִ֖ד יוֹשֵׁ֥ב בִּ/ירוּשָׁלִָֽם׀־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/001.yaml
  text: At the turn of the year[a], at the time when kings go out to battle, David sent Joab, his servants with him, and all Israel. They devastated the Ammonites and besieged Rabbah[b], but David remained in Jerusalem.
translation:
  language: zh_hans
  text: 年岁回转的时候[a]，正值列王出征之时[b]，大卫派出约押、他的臣仆和以色列全军同去。他们蹂躏亚扪人，围攻拉巴；大卫却留在耶路撒冷。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语直译为“年回转（或返回）的时候”，很可能指适合出征的春季。
    reason: 说明希伯来语时间习语及其可能的季节背景，同时避免在正文中过度解释。
  - marker: b
    text: 传统读作“列王”；按希伯来语的书写形式，也可读作“使者”，意为“使者出发之时”。军事语境更支持正文的读法。
    reason: 保留原文书写形式与传统读法之间的真实文本歧义。
lexical_decisions:
- source_word: לִתְשׁוּבַת הַשָּׁנָה
  choice: 一年周而复始的时候
  rationale: 保留“年回转、复始”的希伯来语意象，不直接把可能所指的季节解释为“春天”；现代汉语也能自然表达岁序循环。
- source_word: לְעֵת צֵאת הַמַּלְאֿכִים
  choice: 正值列王出征之时
  rationale: 按传统读法和军事语境理解为“列王出去”，并用“出征”表达上下文隐含的作战目的；书写形式所容许的“使者出去”另列脚注，以保留文本歧义。
- source_word: וַיִּשְׁלַח
  choice: 派出
  rationale: 符合王派遣将领、臣仆和军队出战的叙事场景，也自然对应希伯来语“差遣”。
- source_word: עֲבָדָיו
  choice: 臣仆
  rationale: 在王室语境中，“臣仆”比一般的“仆人”更合适，同时不把所指范围缩窄为军官。
- source_word: כָּל יִשְׂרָאֵל
  choice: 全以色列
  rationale: 保留原文的集体称谓，不直接释为“以色列全军”，让读者从出征语境理解其所指。
- source_word: וַיַּשְׁחִתוּ
  choice: 重创
  rationale: 表达使役形态所含的严重毁坏行动，又避免“消灭”可能造成彻底歼灭的误解，因为随后仍在围城。
- source_word: בְּנֵי עַמּוֹן
  choice: 亚扪人
  rationale: 这是该族名在现代汉语中的标准自然表达。
- source_word: וַיָּצֻרוּ עַל רַבָּה
  choice: 围攻拉巴
  rationale: 准确表达צור与על连用时“围困、围攻一座城”的军事含义。
- source_word: יוֹשֵׁב
  choice: 留在
  rationale: 该分词本义为“坐着、居住”，在本节对比语境中表示大卫没有随军出征，而是继续待在耶路撒冷。
- source_word: בִּירוּשָׁלִָם
  choice: 在耶路撒冷
  rationale: 采用该地名通行的现代汉语译名。
theological_decisions:
- issue: לְעֵת צֵאת הַמַּלְאֿכִים的文本读法及叙事含义
  choice: 列王出征之时
  alternative: 使者出发之时
  rationale: 传统读法、紧接着的军事行动和古代常见的季节性征战背景都支持“列王”。这一译法也保留了叙事中的明显反差：通常是列王出征的时候，大卫却留在耶路撒冷。由于书写形式确实容许“使者”的读法，脚注予以说明，而不把歧义隐藏起来。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。句首保留岁序转换的希伯来语意象；以“正值”使时间结构自然连贯；末句用“却”凸显大卫留守与列王出征、军队作战之间的叙事反差。
