base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/003.yaml
  text: So David sent and inquired about the woman, and someone said, “Is this not Bathsheba, the daughter of Eliam, the wife of Uriah the Hittite?”
translation:
  language: zh_hans
  text: 于是，大卫派人去打听那女人。有人说：“这不是以连的女儿、赫人乌利亚的妻子拔示巴吗？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּדְרֹשׁ לָאִשָּׁה
  choice: 去打听那女人
  rationale: 该短语表示查询、探问有关那女人的情况；“打听”符合现代汉语，也保留行动的间接性。
- source_word: בַּת שֶׁבַע
  choice: 拔示巴
  rationale: 采用该人名在现代中文圣经中的通行音译。
- source_word: הַחִתִּי
  choice: 赫人
  rationale: 采用该族名的通行中文译法。
theological_decisions:
- issue: וַיֹּאמֶר的未明说主语
  choice: 有人说
  alternative: 他说
  rationale: 希伯来文动词为阳性单数，但叙事中没有明指说话者；上下文最自然地指受差遣者或消息提供者，而不是大卫。译作“有人说”保留主语未明确的特点，并避免误认大卫为说话者。
- issue: 反问句 הֲלוֹא 的语气
  choice: 这不是……吗？
  alternative: 她就是……
  rationale: 保留原文用于确认身份的反问形式，使其语气和叙事张力不被改写为直陈句。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“以连的女儿、赫人乌利亚的妻子”依原文并列身份信息，突出她与父亲及丈夫的关系；不添加原文没有的解释。
