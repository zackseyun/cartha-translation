base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/002.yaml
  text: Then at evening time David arose from his bed and walked on the roof of the king’s house[a], and from the roof he saw a woman bathing[b]; and the woman was very beautiful in appearance.
translation:
  language: zh_hans
  text: 傍晚时分[a]，大卫从床上起来，在王宫[b]的屋顶上走动。他从屋顶看见一个妇人正在沐浴；那妇人容貌非常美丽。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“事情发生在傍晚的时候。”
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“王的房屋”；按语境也就是王宫。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי לְעֵת הָעֶרֶב
  choice: 傍晚时分
  rationale: 该短语以叙事动词配合时间表达引入新场景。“傍晚时分”自然简洁，既交代叙事推进，也保留时间背景。
- source_word: וַיָּקָם
  choice: 起来
  rationale: 准确表达 קום 的基本含义，符合现代汉语叙事习惯。
- source_word: מֵעַל מִשְׁכָּבוֹ
  choice: 从床上
  rationale: מִשְׁכָּב 可指床或躺卧之处；此处译作“床”最自然，也符合上下文。
- source_word: וַיִּתְהַלֵּךְ
  choice: 走动
  rationale: Hitpael 形式可表现持续或来回行走；“走动”比单纯“走”更能传达这一动作形态，又避免加入“闲逛”等主观意味。
- source_word: עַל גַּג בֵּית הַמֶּלֶךְ
  choice: 在王宫的屋顶上
  rationale: 原文直译为“王的房屋的屋顶上”。在此语境中，“王宫”是自然且准确的现代汉语表达；脚注保留原文字面措辞。
- source_word: וַיַּרְא אִשָּׁה רֹחֶצֶת
  choice: 看见一个妇人正在沐浴
  rationale: 分词 רֹחֶצֶת 表示正在进行的动作；“正在沐浴”准确传达其持续性，并保持庄重自然。
- source_word: מֵעַל הַגָּג
  choice: 从屋顶
  rationale: 最自然地表示大卫观看时所在的位置，保留原文的空间细节。
- source_word: טוֹבַת מַרְאֶה מְאֹד
  choice: 容貌非常美丽
  rationale: 该短语直指外观悦目；“容貌非常美丽”保留视觉层面的强调，同时符合现代汉语表达。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而通顺的叙事语言。“妇人”比“女人”略显庄重，又不带特定宗派色彩；“沐浴”准确而含蓄。“走动”保留原文动作的持续感。
