  text: The woman conceived[a], and she sent word and told David[b], “I am pregnant.”
translation:
  language: zh_hans
  text: 那女人怀了孕[a]，就派人去告诉大卫[b]，说：“我怀孕了。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“那女人受孕了。”
    reason: lexical_alternative
  - marker: b
    text: “派人”所对应的希伯来文直译为“差遣”；上下文表明她差人向大卫传话。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּהַר
  choice: 怀了孕
  rationale: הרה表示受孕、进入怀孕状态。“怀了孕”是现代汉语自然、简洁的表达，也保留了事件发生的意味。
- source_word: הָאִשָּׁה
  choice: 那女人
  rationale: אִשָּׁה可指“女人”或“妻子”。本句以定冠词回指拔示巴，却没有在此处明确突出其妻子身份，因此译作“那女人”，不加入上下文虽可推知但本句未明说的关系。
- source_word: וַתִּשְׁלַח
  choice: 派人
  rationale: שׁלח字面义为“差遣、送出”。结合随后“告诉大卫”的表述，这里意指派人传话；“派人”符合现代汉语叙事习惯，同时把信息传递的方式保持为上下文推知。
- source_word: וַתַּגֵּד
  choice: 告诉
  rationale: נגד的使役式表示告诉、禀报或宣布。“告诉”直接自然，适合这里向大卫传达消息的语境。
- source_word: לְדָוִד
  choice: 大卫
  rationale: 采用该人名在现代汉语圣经传统中的标准译名。
- source_word: הָרָה אָנֹכִי
  choice: 我怀孕了
  rationale: 谓语形容词הָרָה与独立代词אָנֹכִי表达当前状态。“我怀孕了”是自然的现代汉语，并保留这句简短而直接的报告。
