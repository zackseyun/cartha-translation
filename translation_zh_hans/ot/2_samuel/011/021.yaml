  text: מִֽי הִכָּ֞ה אֶת אֲבִימֶ֣לֶךְ בֶּן יְרֻבֶּ֗שֶׁת הֲ/לֽוֹא אִשָּׁ֡ה הִשְׁלִ֣יכָה עָלָי/ו֩ פֶּ֨לַח רֶ֜כֶב מֵ/עַ֤ל הַֽ/חוֹמָה֙ וַ/יָּ֣מָת בְּ/תֵבֵ֔ץ לָ֥/מָּה נִגַּשְׁתֶּ֖ם אֶל הַֽ/חוֹמָ֑ה וְ/אָ֣מַרְתָּ֔ גַּ֗ם עַבְדְּ/ךָ֛ אוּרִיָּ֥ה הַ/חִתִּ֖י מֵֽת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/021.yaml
  text: Who struck down Abimelech son of Jerubbesheth? Was it not a woman who threw an upper millstone on him from the wall[a], so that he died at Thebez? Why did you go near the wall?’ Then you shall say[c][b], ‘Your servant Uriah the Hittite is dead also.’
translation:
  language: zh_hans
  text: “是谁击杀了耶路比设的儿子亚比米勒[a]？岂不是一个妇人从城墙上扔下一块上磨石[b]，砸在他身上，于是他死在提备斯吗？[c]你们为什么靠近城墙呢？”你就要说：“你的仆人赫人乌利亚也死了。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文本作“耶路比设”；参《士师记》9:1，那里作“耶路巴力”。
    reason: alternative_reading
  - marker: b
    text: 或译“一块磨石碎片”；这个希伯来语词组很可能指上磨石。
    reason: lexical_alternative
  - marker: c
    text: 所提事件见《士师记》9:53。
    reason: cross_reference
lexical_decisions:
- source_word: הִכָּה
  choice: 击杀
  rationale: 保留“击打”的具体动作，同时按上下文表达这一击致命；比单用“杀死”更贴近原词。
- source_word: אֲבִימֶלֶךְ בֶּן יְרֻבֶּשֶׁת
  choice: 耶路比设的儿子亚比米勒
  rationale: 依照马所拉文本保留“耶路比设”，不在正文中与《士师记》9章的“耶路巴力”协调。
- source_word: הֲלוֹא
  choice: 岂不是……吗
  rationale: 再现预期肯定回答的反问语气。
- source_word: פֶּלַח רֶכֶב
  choice: 一块上磨石
  rationale: רֶכֶב通常指转动的上磨石；פֶּלַח可表示一块或一片，因此正文采用简洁的可能所指，并以脚注保留词义上的不确定性。
- source_word: מֵעַל הַחוֹמָה
  choice: 从城墙上扔下
  rationale: מֵעַל表示从墙上方而来；“扔下”在汉语中自然呈现由高处向下的动作。
- source_word: וַיָּמָת בְּתֵבֵץ
  choice: 于是他死在提备斯
  rationale: 用“于是”表达叙事上的后果关系，但不将连接词强化为严格的目的或因果从句。
- source_word: לָמָּה נִגַּשְׁתֶּם אֶל הַחוֹמָה
  choice: 你们为什么靠近城墙呢
  rationale: 直接传达נגשׁ“走近、靠近”的含义，并保留责问语气，不额外加入“这么近”等原文没有明说的程度成分。
- source_word: וְאָמַרְתָּ
  choice: 你就要说
  rationale: 这是对报信者的后续指示；“就要”自然体现事件次序和命令意味。
- source_word: עַבְדְּךָ
  choice: 你的仆人
  rationale: 在对君王的称谓中，这是表示臣属身份的礼貌用语；译作“仆人”比“奴隶”更符合此处语域。
- source_word: גַּם
  choice: 也
  rationale: 保留乌利亚是额外阵亡者的附加意味。
