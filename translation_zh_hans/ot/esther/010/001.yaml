base_translation:
  language: en
  yaml_path: translation/ot/esther/010/001.yaml
  text: King Ahasuerus imposed tribute on the land and the islands of the sea[a][b].
translation:
  language: zh_hans
  text: 亚哈随鲁王向全国和海岛[a]征收贡赋[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “海岛”或译“沿海地区”。希伯来语原词既可指岛屿，也可指海滨地带。
    reason: lexical_alternative
  - marker: b
    text: “贡赋”或译“税赋”或“徭役”。希伯来语原词在不同语境中也可指强制劳役。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: 征收
  rationale: 在שׂוּם מַס עַל这一行政语境中，表示向某地课征贡赋；“征收”比直译“放置”更符合现代汉语。
- source_word: הַמֶּלֶךְ אחשרש
  choice: 亚哈随鲁王
  rationale: 采用《以斯帖记》中通行的中文人名译法，并按现代汉语习惯将“王”置于专名之后。
- source_word: מַס
  choice: 贡赋
  rationale: 该词可指贡税、税赋或劳役。本节涉及王向广大疆域课征，政治财政含义较强；“贡赋”既体现帝国统治语境，也不过度限定具体征收形式。
- source_word: עַל הָאָרֶץ
  choice: 向全国
  rationale: 此处הָאָרֶץ指王所统辖的陆上疆域，而非全世界；“全国”在汉语中自然表达其统治范围。
- source_word: וְאִיֵּי הַיָּם
  choice: 和海岛
  rationale: אִיֵּי可指岛屿，也可指沿海地区；正文采用较贴近字面的“海岛”，并以脚注保留“沿海地区”的可能。
theological_decisions: []
