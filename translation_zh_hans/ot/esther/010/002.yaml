base_translation:
  language: en
  yaml_path: translation/ot/esther/010/002.yaml
  text: And all the acts of his power and might[a], and the full account of the greatness of Mordecai, to which the king raised him—are they not written in the Book of the Chronicles of the Kings of Media and Persia?
translation:
  language: zh_hans
  text: 他权势和威力的一切作为，以及王使末底改显贵的详细记载，不都写在《玛代和波斯诸王大事记》[a]上吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：《玛代和波斯诸王年鉴》。
    reason: “דִּבְרֵי הַיָּמִים”可指官方编录的史事；“大事记”和“年鉴”都是可行译法。
lexical_decisions:
- source_word: מַעֲשֵׂה תָקְפּוֹ וּגְבוּרָתוֹ
  choice: 他以权势和威力所行的一切事
  rationale: “权势”表达 תֹּקֶף 在君王语境中的实际权力，“威力”表达 גְּבוּרָה 的强大与能力；用“所行的一切事”自然传达 מַעֲשֵׂה 的史书式概括。
- source_word: וּפָרָשַׁת
  choice: 详细记载
  rationale: 该词指详尽的说明或叙述；“详细记载”既符合官方史料语境，也比直译为“解释”自然。
- source_word: גְּדֻלַּת מָרְדֳּכַי אֲשֶׁר גִּדְּלוֹ הַמֶּלֶךְ
  choice: 王怎样使末底改尊大起来
  rationale: 保留 גְּדֻלָּה 与 גִּדְּלוֹ 的词根呼应，并清楚表达君王提升末底改地位的含义。
- source_word: הֲלוֹא הֵם כְּתוּבִים
  choice: 不都写在……上吗
  rationale: 保留希伯来文史书惯用的反问句式，同时符合现代汉语表达。
- source_word: סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי מָדַי וּפָרָס
  choice: 《玛代和波斯诸王大事记》
  rationale: 将该官方记录名称译为“大事记”，体现按时期记录王国政事的史料性质；“诸王”自然表达复数 מַלְכֵי。
