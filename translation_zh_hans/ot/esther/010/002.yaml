- from: 他以权势和威力所行的一切事，以及王怎样使末底改尊大起来的详细记载，不都写在《玛代和波斯诸王大事记》[a]上吗？
  to: 他权势和威力的一切作为，以及王使末底改显贵的详细记载，不都写在《玛代和波斯诸王大事记》[a]上吗？
  rationale: 修改首个并列项，避免把“权势和威力”误作“所行之事”的工具性状语；将“尊大起来”改为“显贵”，使表述符合现代汉语，同时维持原文关于王提升末底改地位的含义、正式史书体及反问句式。
