  text: כִּ֣י מָרְדֳּכַ֣י הַ/יְּהוּדִ֗י מִשְׁנֶה֙ לַ/מֶּ֣לֶךְ אֲחַשְׁוֵר֔וֹשׁ וְ/גָדוֹל֙ לַ/יְּהוּדִ֔ים וְ/רָצ֖וּי לְ/רֹ֣ב אֶחָ֑י/ו דֹּרֵ֥שׁ טוֹב֙ לְ/עַמּ֔/וֹ וְ/דֹבֵ֥ר שָׁל֖וֹם לְ/כָל זַרְעֽ/וֹ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/010/003.yaml
  text: For Mordecai the Jew was second to King Ahasuerus[a], great among the Jews, and favored by the multitude of his brothers[c][b], seeking good for his people and speaking peace to all his offspring.
translation:
  language: zh_hans
  text: 因为犹太人末底改的地位仅次于亚哈随鲁王，在犹太人中位高望重，并为众弟兄所接纳[a][b]；他为自己的人民谋求福祉，向他所有的后裔述说平安[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “众弟兄”或译“大多数弟兄”；原文既可指众多的人，也可指其中的大多数。
    reason: lexical_alternative
  - marker: b
    text: 这里的“弟兄”很可能泛指末底改的犹太同胞或同族人，不只是有血缘关系的男性兄弟。
    reason: lexical_alternative
  - marker: c
    text: “后裔”原文直译为“种子”，是表示子孙后代的集合用语。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 保留本句对前文总结所作的解释或说明；现代汉语中“因为”能自然表达这一连接关系。
- source_word: הַיְּהוּדִי
  choice: 犹太人
  rationale: 在《以斯帖记》的波斯背景中，这一称谓主要标明末底改的族群身份；译作“犹太人”比偏重地域的“犹大人”更符合语境。
- source_word: מִשְׁנֶה לַמֶּלֶךְ
  choice: 地位仅次于……王
  rationale: 原文表示末底改在王之下居第二位；此译不擅自加入“宰相”等原文没有的具体官职名称。
- source_word: וְגָדוֹל לַיְּהוּדִים
  choice: 在犹太人中位高望重
  rationale: 表达末底改在犹太群体中的显要地位和声望，比逐字译作“为大”更自然清楚。
- source_word: וְרָצוּי
  choice: 所爱戴
  rationale: 该词表示受到接纳、认可和喜爱；“爱戴”适合描述群体对一位显要人物的赞许。
- source_word: לְרֹב אֶחָיו
  choice: 为众弟兄
  rationale: רֹב可指众多之人，也可指大多数人；正文用“众”保留较宽泛的数量含义，并在脚注交代“大多数”的可能读法。
- source_word: אֶחָיו
  choice: 弟兄
  rationale: 保留原文的亲属称谓；语境中所指很可能是同族的犹太人，而非仅指亲生兄弟，故以脚注说明。
- source_word: דֹּרֵשׁ טוֹב
  choice: 谋求福祉
  rationale: 表达持续积极地为他人寻求好处；“福祉”在现代汉语中自然涵盖整体益处。
- source_word: לְעַמּוֹ
  choice: 为自己的人民
  rationale: 直接体现末底改为其本族人民谋益处，所指为犹太群体。
- source_word: וְדֹבֵר שָׁלוֹם
  choice: 说和平的话
  rationale: 保留“说”与“和平”的原文意象；שָׁלוֹם也可涵盖平安、安康与福祉，不缩窄为政治意义上的和平。
- source_word: לְכָל זַרְעוֹ
  choice: 向自己所有的后裔
  rationale: זֶרַע是集合名词，可指后代或子孙；“后裔”既准确又符合庄重的现代汉语表达。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的书面语。“地位仅次于”清楚表达宫廷等级而不引入特定官职；“位高望重”“谋求福祉”兼顾自然度与原文意义。正文保留“弟兄”“说和平的话”“后裔”等原文意象，并用脚注说明数量歧义、群体性亲属称谓及集合名词。
