base_translation:
  language: en
  yaml_path: translation/ot/esther/006/012.yaml
  text: Then Mordecai returned to the king’s gate[a], but Haman hurried to his house[b], mourning and with his head covered.
translation:
  language: zh_hans
  text: 末底改回到王宫门口；哈曼却急忙[a]回家，哀伤，蒙着头[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “急忙”所译的希伯来语也可译作“被催逼着”或“被驱赶着”，保留动词的被动意味；经文没有说明是谁或什么使他如此离去。
    reason: lexical_alternative
  - marker: b
    text: 蒙头在当时可表示悲伤、受辱或哀恸。
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: 回到
  rationale: 叙事形式中的שׁוּב表示返回先前所在之处；“回到”自然、简洁，并保留方向意义。
- source_word: שַׁעַר הַמֶּלֶךְ
  choice: 王宫门
  rationale: 该组合指与王及宫廷建筑群相关的门；“王宫门”比直译“王的门”更符合现代汉语，也保留其具体地点含义。
- source_word: נִדְחַף
  choice: 匆匆
  rationale: דחף的Niphal形式可含“被驱赶、被催逼”的被动意味，在此也描写哈曼受辱后急促离去的状态。“匆匆”使中文叙事自然，同时以脚注保留原文较强的被动可能。
- source_word: בֵּיתוֹ
  choice: 家里
  rationale: 字面为“他的房屋”；在表示返回自己的住处时，“家里”是自然、庄重而易懂的现代汉语。
- source_word: אָבֵל
  choice: 悲悲切切
  rationale: 该形容词描写哀伤、悲恸的状态；“悲悲切切”在叙事中自然地表现其哀伤狼狈之态，而不限定为丧亲哀悼。
- source_word: חֲפוּי רֹאשׁ
  choice: 蒙着头
  rationale: 保留原文具体可见的动作，不以“羞愧”或“受辱”之类解释性措辞取代。
