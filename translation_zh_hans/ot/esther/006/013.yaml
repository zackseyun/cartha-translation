revisions:
- from: 哈曼把自己所遭遇的一切都告诉了妻子细利斯和所有朋友。他的智士和妻子细利斯对他说：“你已经开始败在末底改面前；他若是犹太人的后裔[a]，你就不能胜过他，因为你必定会败在他面前。”
  to: 哈曼把自己所经历的一切都告诉了妻子细利斯和所有朋友。他的智士和妻子细利斯对他说：“如果末底改是犹太人的后裔[a]，而你已经开始败在他面前，你就不能胜过他，因为你必定会败在他面前。”
  rationale: 修订将“末底改是犹太人的后裔”恢复为条件句的核心，并以“而你已经开始败在他面前”表达原文插入的关系性陈述；保留“败在他面前”的重复和“必定”的加强语气。首句改用较中性的“所经历的一切”。
