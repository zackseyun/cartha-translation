base_translation:
  language: en
  yaml_path: translation/ot/esther/006/013.yaml
  text: Then Haman told Zeresh his wife and all his friends everything that had happened to him. Then his wise men and Zeresh his wife said to him[a], “If Mordecai, before whom you have begun to fall, is from the seed of the Jews, you will not prevail against him, for you will surely fall before him.”
translation:
  language: zh_hans
  text: 哈曼把自己所经历的一切都告诉了妻子细利斯和所有朋友。他的智士和妻子细利斯对他说：“如果末底改是犹太人的后裔[a]，而你已经开始败在他面前，你就不能胜过他，因为你必定会败在他面前。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“有犹太血统”。
    reason: “种子”（זֶרַע）在这里表示族裔、血统；脚注提供更直接的现代汉语表达。
lexical_decisions:
- source_word: וַיְסַפֵּר
  choice: 告诉
  rationale: 此叙事动词表示哈曼把刚发生的事情一一讲述出来；“告诉”符合现代汉语叙事习惯。
- source_word: אֹהֲבָיו
  choice: 朋友
  rationale: 字面指爱他或亲近他的人；在宫廷社交语境中指朋友、亲信或同伴，并非情人。
- source_word: כָּל אֲשֶׁר קָרָהוּ
  choice: 自己所遭遇的一切
  rationale: 表达临到哈曼身上的全部事情；“遭遇”在本段受挫的语境中自然，同时不增加原文没有的具体内容。
- source_word: חֲכָמָיו
  choice: 他的智士
  rationale: 保留“智慧之人”的词义及波斯宫廷顾问色彩；“智士”简洁、庄重，也与一般的朋友有所区别。
- source_word: אִם מִזֶּרַע הַיְּהוּדִים
  choice: 他若是犹太人的后裔
  rationale: זֶרַע本义为“种子”，此处表示族裔或血统；“后裔”既传达谱系含义，也保留繁衍意象的一部分。
- source_word: הַחִלּוֹתָ לִנְפֹּל לְפָנָיו
  choice: 你已经开始败在末底改面前
  rationale: החל加不定式表示动作已经开始；以“败在……面前”表达相对于末底改的失势，并为末句的重复铺垫。
- source_word: לֹא תוּכַל לוֹ
  choice: 你就不能胜过他
  rationale: יכל加ל在这里表示无力对抗或压倒对方；“不能胜过”准确而自然。
- source_word: נָפוֹל תִּפּוֹל
  choice: 你必定会败
  rationale: 不定式绝对形与限定动词连用，加强结果的确定性；“必定”传达这一强调。
- source_word: לְפָנָיו
  choice: 在他面前
  rationale: 末句重复这一关系性表达，突出哈曼将在末底改面前败落；译文也保留前后呼应。
theological_decisions:
- issue: 犹太血统与哈曼败亡之间的因果张力
  choice: 保留智士和细利斯原话中的判断，不补充神学解释
  alternative: 明确说明这是出于上帝的保守或犹太人的蒙拣选
  rationale: 原文只记录人物的断言，并未在本节明说其神学根据；译文不应替叙事者解释或将人物话语直接等同于神谕。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。为保留原文修辞，前后两次לִנְפֹּל／נָפוֹל均译作“败”，并重复“在……面前”；同时调整条件句次序，使中文清楚自然而不改变逻辑。
