base_translation:
  language: en
  yaml_path: translation/ot/esther/006/010.yaml
  text: Then the king said to Haman[a], “Hurry, take the robe and the horse, just as you have said, and do so for Mordecai the Jew, who sits at the king’s gate[b]. Leave out nothing from all that you have said.”
translation:
  language: zh_hans
  text: 王对哈曼说：“赶快，取那礼袍和那匹马，照你所说的，为坐在王宫门口的犹太人[a]末底改办理。凡你所说的，一点也不可遗漏[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “犹太人”也可译作“犹大人”；这里更可能是指末底改的族群—宗教身份。
    reason: lexical_alternative
  - marker: b
    text: 直译近于“凡你所说的，不可让一件事落下”；这是指不可遗漏任何一项。
    reason: lexical_alternative
lexical_decisions:
- source_word: מַהֵר
  choice: 快去
  rationale: 这是要求立即行动的命令；“快去”在现代汉语中自然地传达紧迫感。
- source_word: קַח
  choice: 拿上
  rationale: 对应“拿、取”的命令形式；与礼服和马搭配时，“拿上”比单说“拿”更符合连续行动的汉语表达。
- source_word: הַלְּבוּשׁ
  choice: 那礼服
  rationale: 定冠词回指上一节所述的王服；“礼服”既保留衣服的正式性质，也比泛称“衣裳”更切合语境。
- source_word: הַסּוּס
  choice: 那匹马
  rationale: 原文只说“马”，未在本节明说“御马”；量词“匹”使汉语自然，指示词“那”体现定指。
- source_word: כַּאֲשֶׁר דִּבַּרְתָּ
  choice: 照你所说的
  rationale: 明确把王的命令与哈曼刚才的提议相连，并保留反讽力度。
- source_word: וַעֲשֵׂה כֵן
  choice: 这样做
  rationale: 简洁对应“如此行”，是自然、庄重的现代汉语。
- source_word: לְמָרְדֳּכַי
  choice: 为……末底改
  rationale: 介词在此表示受益对象；“为”准确表达替末底改施行这些尊荣。
- source_word: הַיְּהוּדִי
  choice: 犹太人
  rationale: 在《以斯帖记》的叙事中主要标示末底改的族群—宗教身份；地理性的“犹大人”作为脚注备选保留。
- source_word: הַיּוֹשֵׁב בְּשַׁעַר הַמֶּלֶךְ
  choice: 坐在王宫门口的
  rationale: 分词描述末底改素常所在或任职的位置。“王宫门口”自然表达王的门楼区域，避免被误解为王本人所有的一扇普通门。
- source_word: אַל תַּפֵּל דָּבָר מִכֹּל אֲשֶׁר דִּבַּרְתָּ
  choice: 凡你所说的，一点也不可遗漏
  rationale: 原文直译近于“不可让任何一件事落下”，实际是不可省略任何细节；此译清楚传达全面执行的命令。
