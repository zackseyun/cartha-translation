base_translation:
  language: en
  yaml_path: translation/ot/esther/006/011.yaml
  text: So Haman took the robe and the horse[a], clothed Mordecai, led him on horseback through the city square, and proclaimed before him, “Thus shall it be done for the man whom the king delights to honor.”
translation:
  language: zh_hans
  text: 于是，哈曼取来那礼服和那匹马，给末底改穿上那礼服，让他骑着那匹马[a]穿过城里的广场，并在他前面宣告：“王所喜悦尊荣的人，就要这样待他。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “让他骑着那匹马”所译的希伯来语动词是使役形式，直译为“使他骑乘”。经文没有明说哈曼是否亲自牵马。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַלְּבוּשׁ
  choice: 礼服
  rationale: 定冠词和单数形式指向上文所说的特定王室服饰；“礼服”既自然庄重，也比泛称“衣服”更符合场景。
- source_word: הַסּוּס
  choice: 马
  rationale: 希伯来文只说“那马”；王室关联已由上文确立，因此本节不额外加入“御马”。
- source_word: וַיַּלְבֵּשׁ אֶת מָרְדֳּכָי
  choice: 给末底改穿上礼服
  rationale: 使役词形表示哈曼使末底改穿上该服饰；中文这样表达直接、自然，并明确承接前面的“礼服”。
- source_word: וַיַּרְכִּיבֵהוּ
  choice: 让他骑着马
  rationale: רכב 的使役词形表示使某人骑乘；“让他骑着马”保留使役意义，又避免过度说明哈曼具体如何牵引或引领。
- source_word: בִּרְחוֹב הָעִיר
  choice: 经过城里的广场
  rationale: רְחוֹב 常指城市中的宽阔公共场所或广场，而非普通街道；介词结合行进语境自然译为“经过”。
- source_word: וַיִּקְרָא לְפָנָיו
  choice: 在他前面宣告
  rationale: קרא 在这里是公开传报；“宣告”体现正式性，“在他前面”保留空间关系，不武断限定哈曼的精确位置或动作。
- source_word: כָּכָה יֵעָשֶׂה
  choice: 就要这样待他
  rationale: 保留指示语“这样”和被动表达的功能，同时用自然现代汉语表达对受尊荣者所施行的待遇。
- source_word: לָאִישׁ אֲשֶׁר
  choice: 谁
  rationale: 原文是“那人，就是……的人”的关系结构；汉语用“谁……就……”自然表达其泛指公式，并未改变单数对象的意义。
- source_word: חָפֵץ בִּיקָרוֹ
  choice: 喜悦尊荣
  rationale: חפץ 含喜悦、乐意之意，יקר 在此指授予尊荣；“喜悦尊荣”兼顾王的意愿与所赐的荣誉。
