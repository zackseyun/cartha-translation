  yaml_path: translation/ot/esther/006/014.yaml
  text: While they were still speaking with him[b][a], the king’s eunuchs arrived and hurried to bring Haman to the banquet that Esther had prepared.
translation:
  language: zh_hans
  text: 他们还在同他说话时，王的太监[a]到了，便急忙[b]把哈曼带去赴以斯帖所预备的宴席。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“王的官员”；希伯来语这个词既可指太监，也可指宫廷官员。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“赶紧”或“迅速”；这里的希伯来语动词强调行动急迫。
    reason: lexical_alternative
lexical_decisions:
- source_word: עוֹדָם מְדַבְּרִים עִמּוֹ
  choice: 他们还在同他说话时
  rationale: “还在……时”准确表达副词与分词所表示的持续动作；“同他说话”保留 עִמּוֹ 的“与他”关系，也保留原文代词所具有的语境指向。
- source_word: סָרִיסֵי הַמֶּלֶךְ
  choice: 王的太监
  rationale: סָרִיס 可指太监，也可泛指宫廷官员；正文采用其常见、具体的含义“太监”，并以脚注保留另一可能。
- source_word: הִגִּיעוּ
  choice: 到了
  rationale: 简洁自然地表达他们来到现场，符合现代汉语叙事语体。
- source_word: וַיַּבְהִלוּ
  choice: 便急忙
  rationale: 该词的使役形在此强调行动迅速、紧迫；“急忙”不必暗示惊恐，却保留了紧迫感。
- source_word: לְהָבִיא אֶת הָמָן
  choice: 把哈曼带去
  rationale: 结合目的地“到宴席”，现代汉语用“带去”比机械直译为“带来”更自然；其目的关系融入连续叙事。
- source_word: הַמִּשְׁתֶּה
  choice: 宴席
  rationale: מִשְׁתֶּה 指设有酒食的筵宴；“宴席”适合以斯帖记的宫廷场景，庄重而易懂。
- source_word: אֲשֶׁר עָשְׂתָה אֶסְתֵּר
  choice: 以斯帖所预备的
  rationale: עָשָׂה 字面为“做”，用于宴席时译作“预备”符合汉语习惯，并表明宴席此前已经安排好。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而流畅的叙事语言。“他们”和“他”依照原文保留代词表达，不在正文中补明身份；“赴……宴席”自然呈现哈曼被带往筵宴的目的。
