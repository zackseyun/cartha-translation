base_translation:
  language: en
  yaml_path: translation/ot/esther/006/005.yaml
  text: The king’s attendants said to him[a], “Look, Haman is standing in the court.” And the king said, “Let him come in.”
translation:
  language: zh_hans
  text: 王的侍从对他说：“看，哈曼正站在院子里。”王说：“让他进来。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נַעֲרֵי הַמֶּלֶךְ
  choice: 王的侍从
  rationale: נַעַר可指年轻人、仆人或侍从；在王宫语境中，“侍从”自然地表达其宫廷职分，又不强调年龄。
- source_word: הִנֵּה
  choice: 看
  rationale: הִנֵּה用于引人注意；“看”简洁、现代，并保留话语的即时感。
- source_word: עֹמֵד
  choice: 正站着
  rationale: 分词表示当时持续的状态；“正站着”直接传达正在进行的姿态，不另行解释为“等候”。
- source_word: בֶּחָצֵר
  choice: 在院子里
  rationale: חָצֵר在王宫语境中指院落或庭院；“院子里”在现代汉语中自然清楚，并与上文所指的王宫外院相称。
- source_word: יָבֹא
  choice: 让他进来
  rationale: 此处未完成式具有命令或准许的语气；“让他进来”既自然，也保留王所发指令的力度。
- source_word: הָמָן
  choice: 哈曼
  rationale: 采用现代中文圣经中通行的人名译法。
