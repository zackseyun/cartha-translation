base_translation:
  language: en
  yaml_path: translation/ot/esther/006/006.yaml
  text: So Haman came in[a], and the king said to him, “What should be done for the man whom the king delights to honor?” And Haman said in his heart, “Whom would the king delight to honor more than me?”
translation:
  language: zh_hans
  text: 哈曼进来后，王问他：“王所乐意尊荣的人，应当怎样待他呢？”哈曼心里想[a]：“王还会乐意尊荣谁，比尊荣我更多呢？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“哈曼在心里说。”
    reason: 保留希伯来语内心言语的字面意象。
lexical_decisions:
- source_word: וַיָּבוֹא הָמָן
  choice: 哈曼进来
  rationale: 叙事体的连续式推动情节；“进来”自然表达哈曼进入王面前的场景。
- source_word: וַיֹּאמֶר לוֹ הַמֶּלֶךְ
  choice: 王问他
  rationale: אָמַר本义为“说”，但此处所说的是问句；现代汉语用“问”更自然，同时准确传达言语行为。
- source_word: מַה לַעֲשׂוֹת בָּאִישׁ
  choice: 应当怎样待……的人
  rationale: 不定式结构询问在此情形下应采取的行动；“怎样待”比逐字译作“向这人做什么”更符合现代汉语。
- source_word: אֲשֶׁר הַמֶּלֶךְ חָפֵץ בִּיקָרוֹ
  choice: 王所乐意尊荣的人
  rationale: חָפֵץ表达乐意、喜悦，יְקָר在宫廷语境中指所赐的尊荣；此译保留王主动赐荣的含义。
- source_word: וַיֹּאמֶר הָמָן בְּלִבּוֹ
  choice: 哈曼心里想
  rationale: 希伯来语直译为“哈曼在心里说”；现代汉语以“心里想”自然表达内心独白，脚注保留原文意象。
- source_word: לְמִי יַחְפֹּץ הַמֶּלֶךְ לַעֲשׂוֹת יְקָר
  choice: 王乐意尊荣谁
  rationale: 重复用“乐意尊荣”对应前半节的חָפֵץ与尊荣词群，保留原文的词汇呼应。
- source_word: יוֹתֵר מִמֶּנִּי
  choice: 还能胜过我呢
  rationale: 以反问句保留哈曼认定无人比自己更可能获王尊荣的自负，也维持原文比较结构的力度。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“乐意尊荣”既保留宫廷语境，也在前后两问中维持原文关键词的呼应；内心独白用当代读者易懂的“心里想”，并以脚注注明直译。
