base_translation:
  language: en
  yaml_path: translation/ot/esther/006/003.yaml
  text: Then the king said[a], “What honor and greatness has been bestowed on Mordecai for this?” The king’s young men who attended him said, “Nothing has been done for him.”
translation:
  language: zh_hans
  text: 王说：“末底改为这事得了什么尊荣和显贵呢？”服侍王的年轻人回答：“没有为他做过什么。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַה נַּעֲשָׂה
  choice: 得了什么
  rationale: 原文是被动式，直译为“有什么被做了”；与后面的“尊荣和显贵”连用时，现代汉语用“得了什么”更自然，也保留了询问末底改所得待遇的意思。
- source_word: יְקָר
  choice: 尊荣
  rationale: 在宫廷语境中指给予人的荣誉、尊崇，而非物质上的贵重。
- source_word: וּגְדוּלָּה
  choice: 显贵
  rationale: 该词本义为“大、伟大”，此处与“尊荣”并列，指显赫尊贵的地位或待遇；“显贵”既贴合宫廷语境，也避免把它缩窄为正式升职。
- source_word: לְמָרְדֳּכַי
  choice: 末底改……得了
  rationale: לְ 标示接受者或受益者；在所采用的汉语句式中，以主语“末底改”配“得了”自然表达。
- source_word: עַל זֶה
  choice: 为这事
  rationale: 回指上文末底改所做之事，表达缘由或酬报依据。
- source_word: נַעֲרֵי הַמֶּלֶךְ
  choice: 王的年轻臣仆
  rationale: נְעָרִים 字面为“年轻人”，但此处是王宫中任职者；“年轻臣仆”兼顾年龄含义和宫廷身份。
- source_word: מְשָׁרְתָיו
  choice: 侍候王的
  rationale: 分词表示在王身边服侍、听差；译作定语可自然修饰“年轻臣仆”。
- source_word: לֹא נַעֲשָׂה עִמּוֹ דָּבָר
  choice: 什么也没有为他做
  rationale: 保留原文被动表达的核心意思，即没有采取任何行动给他奖赏或优待，同时不擅自补出具体奖赏。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“尊荣和显贵”保留两个并列名词及其略显浓缩的宫廷色彩；末句不补译“奖赏”，以免超出原文。
