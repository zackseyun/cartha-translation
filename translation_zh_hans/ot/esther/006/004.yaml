base_translation:
  language: en
  yaml_path: translation/ot/esther/006/004.yaml
  text: And the king said[a], “Who is in the court?” Now Haman had come into the outer court of the king’s palace to speak to the king about hanging Mordecai on the gallows that he had prepared for him.
translation:
  language: zh_hans
  text: 王说：“谁在院子里？”这时，哈曼已经来到王宫的外院，要向王进言，将末底改挂在他为末底改预备的木架[a]上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “木架”原文也可指“树”或“木头”；这里指哈曼预备的处刑设施，但原文没有明确说明其具体形制。
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶחָצֵר / לַחֲצַר
  choice: 院子里 / 外院
  rationale: חָצֵר指围起来的院落；首次按王的问话译作自然的“院子里”，第二次结合הַחִיצוֹנָה译作“外院”，清楚呈现王宫空间。
- source_word: וְהָמָן בָּא
  choice: 这时，哈曼已经来到
  rationale: 该分句交代王发问时的背景；“这时”和“已经”以自然汉语表达哈曼先已到达、正等候求见的叙事关系。
- source_word: בֵּית הַמֶּלֶךְ
  choice: 王宫
  rationale: 字面为“王的 house”，在君王居所的语境中译作“王宫”最准确自然。
- source_word: הַחִיצוֹנָה
  choice: 外
  rationale: 该形容词用于区分内外院；“外院”简洁明确。
- source_word: לֵאמֹר לַמֶּלֶךְ
  choice: 要向王提议
  rationale: 此目的结构表示哈曼来向王陈说所求之事；结合后续处死末底改的内容，“提议”比机械地译作“说”更符合现代汉语，同时不把王的批准写成既成事实。
- source_word: לִתְלוֹת
  choice: 把……挂在……上
  rationale: תלה基本义为悬挂；此处是处决语境，但具体方式可能涉及悬挂或示众，不在正文中把它过度限定为现代绞刑。
- source_word: הָעֵץ
  choice: 木架
  rationale: עֵץ可指树、木头或木制物；这里指哈曼预备的处刑设施。“木架”既自然，又保留原词并未精确说明设施形制的宽泛性。
- source_word: אֲשֶׁר הֵכִין לוֹ
  choice: 他为末底改预备的
  rationale: 语境表明לוֹ指末底改。明说“末底改”可消除现代汉语中连续代词造成的歧义，而不改变指称。
theological_decisions:
- issue: 处刑方式是否明确为绞刑
  choice: 译作“挂在……木架上”
  alternative: 译作“吊死在绞刑架上”或“钉在木桩上”
  rationale: 希伯来语תלה与עֵץ没有单独明确现代绞刑或刺穿的具体技术；正文保留这种历史与词义上的开放性。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“王”与上下文称谓一致；用“这时，……已经……”顺畅交代背景。正文中的“木架”避免现代“绞刑架”带来的过度具体化，并用脚注说明原文词义范围。
