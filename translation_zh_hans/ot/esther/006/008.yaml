base_translation:
  language: en
  yaml_path: translation/ot/esther/006/008.yaml
  text: Let them bring a royal robe that the king has worn[a], and a horse on which the king has ridden, and on whose head a royal crown has been placed.
translation:
  language: zh_hans
  text: “应当把王穿过的王袍拿来，再牵来一匹王骑过、头上曾被安放过王冠的马[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译可作：“并且王冠被放在它头上。”这里的代词按句法最自然地指这匹马，但也有人理解为指王。
    reason: 保留第三人称代词所指对象的句法歧义。
lexical_decisions:
- source_word: יָבִיאוּ
  choice: 应当把……拿来，也牵来
  rationale: 该使役式未完成时在直引语中带有吩咐意味。“应当”自然表达意愿式语气；按汉语习惯，衣袍用“拿来”，马用“牵来”。
- source_word: לְבוּשׁ מַלְכוּת
  choice: 王袍
  rationale: 该组合指与王权身份相称的衣服；“王袍”简洁、自然，也符合此处用于公开尊荣仪式的特定衣袍。
- source_word: אֲשֶׁר לָבַשׁ בּוֹ הַמֶּלֶךְ
  choice: 王穿过的
  rationale: 关系从句说明这件王袍确实曾由王穿着；“穿过”自然传达完成动作及其对当前选择的关联。
- source_word: וְסוּס
  choice: 也牵来一匹……马
  rationale: 名词在此引入第二件所求之物；量词“一匹”符合现代汉语，而“牵来”比泛称“拿来”更适用于马。
- source_word: אֲשֶׁר רָכַב עָלָיו הַמֶּלֶךְ
  choice: 王骑过
  rationale: 关系从句表明这匹马曾由王亲自骑乘；汉语“骑过”已自然包含原文介词所表达的关系。
- source_word: וַאֲשֶׁר נִתַּן
  choice: 曾戴有
  rationale: 该被动完成式表示王冠曾被安置在所指对象头上。“曾戴有”在汉语中自然简洁，同时保留先前已经发生的意味。
- source_word: כֶּתֶר מַלְכוּת
  choice: 王冠
  rationale: 该词组指王室或王权的冠冕；“王冠”是现代汉语中准确而通行的表达。
- source_word: בְּרֹאשׁוֹ
  choice: 头上
  rationale: 第三人称阳性单数后缀按最近且最自然的句法先行词理解为“马”；汉语在定语结构中无需重复代词。脚注保留其可能指王的另一种理解。
