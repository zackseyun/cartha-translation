  terminology: 保留通行译名“末底改”“辟探拿”“提列”“亚哈随鲁”。“太监”适合王宫语境，同时用脚注保留该词可泛指王宫官员的语义范围。“看守宫门的人”自然表达守卫入口／门槛者，不把其职务过度具体化。
