base_translation:
  language: en
  yaml_path: translation/ot/esther/006/002.yaml
  text: And it was found written that Mordecai had reported concerning Bigthana and Teresh[a], two of the king’s eunuchs, among those who guarded the threshold[b], who had sought to lay a hand on King Ahasuerus.
translation:
  language: zh_hans
  text: 书上发现记载着：末底改曾禀报有关辟探拿[a]和提列的事；这两人是王的两个太监[b]，属于看守宫门的人，曾企图加害亚哈随鲁王。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “辟探拿”依照本节希伯来文的名字形式音译；别处作“辟探”。
    reason: alternative_reading
  - marker: b
    text: “太监”所译的希伯来词也可泛指王宫官员。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמָּצֵא כָתוּב
  choice: 书上记着
  rationale: 结合上文查阅宫廷史籍的语境，自然表达“发现有文字记载”的被动含义，同时避免生硬直译。
- source_word: הִגִּיד עַל
  choice: 告发
  rationale: 这里指末底改将二人的阴谋报告给王室；“告发”简洁体现报告内容对二人不利，符合宫廷记录语境。
- source_word: בִּגְתָנָא וָתֶרֶשׁ
  choice: 辟探拿和提列
  rationale: “辟探拿”依照本节希伯来文本较长的名字形式 בִּגְתָנָא 音译；“提列”采用现代中文圣经读者较熟悉的译名。
- source_word: שְׁנֵי סָרִיסֵי הַמֶּלֶךְ
  choice: 王的两个太监
  rationale: סָרִיס 在王宫语境中可特指太监，也可泛指宫廷官员；正文保留较具体的常见义，较宽泛的可能性置于脚注。
- source_word: מִשֹּׁמְרֵי הַסַּף
  choice: 他们是守门的人
  rationale: 表达二人属于负责把守门槛或入口的群体；汉语用“守门的人”比“守门槛的人”自然。
- source_word: בִּקְשׁוּ לִשְׁלֹחַ יָד
  choice: 曾企图加害
  rationale: בִּקְשׁוּ 表示寻求、意图，לִשְׁלֹחַ יָד 是敌意伸手攻击的习语；“企图加害”既自然，又不限定具体攻击方式或暗示行动成功。
- source_word: בַּמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ
  choice: 亚哈随鲁王
  rationale: 采用该波斯王名在现代中文圣经传统中的通行音译，并按自然汉语将“王”置于名字之后。
theological_decisions: []
