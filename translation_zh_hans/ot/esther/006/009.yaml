  text: וְ/נָת֨וֹן הַ/לְּב֜וּשׁ וְ/הַ/סּ֗וּס עַל יַד אִ֞ישׁ מִ/שָּׂרֵ֤י הַ/מֶּ֨לֶךְ֙ הַֽ/פַּרְתְּמִ֔ים וְ/הִלְבִּ֨ישׁוּ֙ אֶת הָ/אִ֔ישׁ אֲשֶׁ֥ר הַ/מֶּ֖לֶךְ חָפֵ֣ץ בִּֽ/יקָר֑/וֹ וְ/הִרְכִּיבֻ֤/הוּ עַל הַ/סּוּס֙ בִּ/רְח֣וֹב הָ/עִ֔יר וְ/קָרְא֣וּ לְ/פָנָ֔י/ו כָּ֚כָה יֵעָשֶׂ֣ה לָ/אִ֔ישׁ אֲשֶׁ֥ר הַ/מֶּ֖לֶךְ חָפֵ֥ץ בִּ/יקָרֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/006/009.yaml
  text: And let the robe and the horse be entrusted to the hand of one of the king’s noble officials, and let them clothe the man whom the king delights to honor, and let them mount him on the horse through the open square of the city, and proclaim before him, ‘Thus shall it be done for the man whom the king delights to honor.’
translation:
  language: zh_hans
  text: 要把礼服和马交在王的一位显贵大臣手中，让他们给王所乐意尊荣的人穿上礼服，让他骑着那匹马穿过城中的广场，并在他前面宣告：‘王所乐意尊荣的人，就要这样对待他！’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנָתוֹן ... עַל יַד
  choice: 要把……交在……手中
  rationale: 保留希伯来语“交在某人手中”的委托含义，同时符合现代汉语表达。
- source_word: מִשָּׂרֵי הַמֶּלֶךְ הַפַּרְתְּמִים
  choice: 王的一位显贵大臣
  rationale: שָׂרֵי 表示王的官长或大臣，הַפַּרְתְּמִים 指身份显赫的贵族；“显贵大臣”简洁呈现两层含义，不擅自加强为最高等级。
- source_word: חָפֵץ בִּיקָרוֹ
  choice: 所乐意尊荣
  rationale: חָפֵץ 表示喜悦、愿意，יְקָר 在此表示尊荣；此译保留王主动乐意赐予尊荣的意味。
- source_word: וְהִרְכִּיבֻהוּ עַל הַסּוּס
  choice: 使他骑上马
  rationale: 使役形态表示让该人乘骑，不译成“牵着他”，以免改变动作的直接宾语关系。
- source_word: בִּרְחוֹב הָעִיר
  choice: 经过城中的广场
  rationale: רְחוֹב 常指城市中的宽阔公共场地或广场；“经过”自然表达公开巡行的场景。
- source_word: וְקָרְאוּ לְפָנָיו
  choice: 在他前面宣告
  rationale: לְפָנָיו 可指空间上的“在他前面”；保留宣告者行在受尊荣者前方的画面。
