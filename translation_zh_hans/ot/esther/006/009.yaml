revisions:
- from: 要把礼服和马交在王的一位显贵大臣手中，让他们给王所乐意尊荣的人穿上礼服，使他骑上马，经过城中的广场，并在他前面宣告：‘王所乐意尊荣的人，就要这样待他！’
  to: 要把礼服和马交在王的一位显贵大臣手中，让他们给王所乐意尊荣的人穿上礼服，让他骑着那匹马穿过城中的广场，并在他前面宣告：‘王所乐意尊荣的人，就要这样对待他！’
  rationale: 作小幅措辞修订，以改善骑马巡行与宣告语的汉语表达，并更紧密对应希伯来文的动作关系和正式句式；不改变原文中由一位显贵官员受托、而后使用复数动词的表述张力。
