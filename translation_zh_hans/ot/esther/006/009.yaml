  - severity: low
    issue: 结尾“就要这样待他”未充分显出公开宣告的正式措辞。
    rationale: כָּכָה יֵעָשֶׂה意为“如此要被施行/如此要做”；“就要这样对待他”较直接，避免“待他”的口语歧义。
