  text: And Haman said to the king[a], “For the man whom the king delights to honor—”
translation:
  language: zh_hans
  text: 哈曼对王说：“王所乐意尊荣的人——”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 该叙事动词承接上文、推进情节；现代汉语通常不必把连接词 וַ־ 单独译成“于是”或“就”，以免增添原文未明确表达的因果色彩。
- source_word: הָמָן
  choice: 哈曼
  rationale: 按现代汉语圣经人名的通行音译处理。
- source_word: אֶל הַמֶּלֶךְ
  choice: 对王
  rationale: 表示说话对象；“对王说”符合现代汉语习惯，也保留了 הַמֶּלֶךְ 的确定称谓。
- source_word: אִישׁ אֲשֶׁר
  choice: ……的人
  rationale: אִישׁ 是阳性单数，可指“一个人”或语境中特定的“那个人”。汉语关系结构“……的人”自然流畅，并可保留其确定性上的含混。
- source_word: חָפֵץ
  choice: 乐意
  rationale: 该词表达喜悦、乐于如此，不只是单纯“想要”；“乐意”在宫廷语境中自然庄重。
- source_word: בִּיקָרוֹ
  choice: 尊荣
  rationale: יְקָר 在此指给予某人尊贵、荣誉或显要地位。译作动词“尊荣”符合汉语表达，也避免“荣耀”可能带出的过强宗教色彩。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“王”比“国王”更贴合本书宫廷对话中的称谓。句末破折号保留本节未完、下节继续说明应当如何待他的句法张力。
