  source_fidelity: 正文准确传达了哈曼对王说话，以及“王乐意尊荣的人”这一未完的名词短语。希伯来语 אִישׁ 可作不定指，且在此上下文中也可被理解为指向某一特定人；汉语不加冠词，正文不宜强行消除这一开放性。בִּיקָרוֹ 的宾语代词由关系结构中的“人”自然承接。
  naturalness: “王乐意尊荣的人”可以理解，但在现代庄重汉语中，“王所乐意尊荣的人”更顺畅，也更清楚地标示“王”是“尊荣”的施事。脚注原有的“一个王乐意尊荣的人”语序不自然，宜调整。
  terminology: “哈曼”“王”“尊荣”均合适。“尊荣”保留宫廷授予荣誉、显贵的语境，未不当地引入特定宗教含义。
