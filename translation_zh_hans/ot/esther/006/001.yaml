lexical_decisions:
- source_word: בַּלַּיְלָה הַהוּא
  choice: 那天夜里
  rationale: 保留指示词所标明的特定夜晚，同时采用自然的现代汉语叙事表达。
- source_word: נָדְדָה שְׁנַת הַמֶּלֶךְ
  choice: 王睡不着
  rationale: 原文直译为“王的睡眠离去了”；正文用自然汉语传达失眠之意，并在脚注保留原有意象。
- source_word: וַיֹּאמֶר לְהָבִיא
  choice: 就吩咐人取来
  rationale: אָמַר在这里引出命令；补出未明说的执行者“人”，使汉语通顺，但不具体指定是谁。
- source_word: סֵפֶר הַזִּכְרֹנוֹת
  choice: 记事册
  rationale: 该词组指为留存记忆而保存的官方记录；“记事册”简明且符合宫廷档案语境。
- source_word: דִּבְרֵי הַיָּמִים
  choice: 年代志
  rationale: 该词组指按时日记载的史事或年鉴，在此与“记事册”构成同位说明。
- source_word: וַיִּהְיוּ נִקְרָאִים
  choice: 有人……诵读
  rationale: 原文是复数被动结构，表示这些记录被读出；汉语以不定施事句自然表达，并用“诵读”表明是在王面前读出声来。
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: 在王面前
  rationale: 直接保留“在王面前／在王面前所在之处”的空间与宫廷语境，不额外解释为专门读给王听。
