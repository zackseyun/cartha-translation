base_translation:
  language: en
  yaml_path: translation/ot/esther/007/008.yaml
  text: The king returned from the palace garden to the house of the wine feast, and Haman was falling on the couch where Esther was. Then the king said, “Will he even assault the queen while I am in the house?” As the word went out from the king’s mouth, they covered Haman’s face.
translation:
  language: zh_hans
  text: 王从王宫的花园回到饮酒宴的大厅时，哈曼正伏在以斯帖所在的卧榻上。王说：“他竟敢在我还在宫中时侵犯王后吗？”王的话一出口，哈曼的脸就被蒙住了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֵּית מִשְׁתֵּה הַיַּיִן
  choice: 饮酒宴的大厅
  rationale: 保留“酒宴”与场所（בֵּית）的双重含义，同时用自然汉语表达王返回宴会所在厅堂。
- source_word: נֹפֵל עַל־הַמִּטָּה
  choice: 正伏在……卧榻上
  rationale: 分词 נֹפֵל 描写王回来时正在呈现的姿态；“伏在”比直译“跌落”更符合哈曼向王后哀求的上下文，又不额外断定具体动作过程。
- source_word: לִכְבּוֹשׁ
  choice: 凌辱
  rationale: 该词基本义涉及制服、强行支配；在王对哈曼靠近王后的愤怒指控中带有性侵犯意味。“凌辱”保留强暴性和语境张力，却不把可能的修辞指控限定为某一具体行为。
- source_word: עִמִּי בַּבָּיִת
  choice: 当着我的面，在宫里
  rationale: עִמִּי 字面为“与我同在”，此处自然表达为“当着我的面”；בַּבָּיִת 依王宫场景译作“在宫里”。
- source_word: וּפְנֵי הָמָן חָפוּ
  choice: 人们就蒙住了哈曼的脸
  rationale: 希伯来语形式字面近于“哈曼的脸被蒙住了”，汉语用不定主语“人们”清楚表达被动事件，不臆测执行者身份。
theological_decisions:
- issue: 王所说 לִכְבּוֹשׁ 的指控强度
  choice: 译作“凌辱”
  alternative: “侵犯”或“强暴”
  rationale: 原词在此明显表达强制和性威胁，但叙事未说明哈曼实际意图侵犯王后；“凌辱”既呈现王的指控，也避免把王的愤怒解读当成客观事实。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“卧榻”符合古代宴席场景；句式紧凑，保留原文由王目睹姿态、发出指控到哈曼被定罪式处置的迅速推进。
