revisions:
- from: 王从王宫的花园回到饮酒宴的大厅时，哈曼正伏在以斯帖所在的卧榻上。王说：“他竟敢当着我的面，在宫里凌辱王后吗？”王的话一出口，人们就蒙住了哈曼的脸。
  to: 王从王宫的花园回到饮酒宴的大厅时，哈曼正伏在以斯帖所在的卧榻上。王说：“他竟敢在我还在宫中时侵犯王后吗？”王的话一出口，哈曼的脸就被蒙住了。
  rationale: 修订仅处理两处可安全校正之处：以“在我还在宫中时”对应 עִמִּי בַּבָּיִת，避免添加“当面目击”的意思；以无施事被动句对应末句。其余保留原译：分词 נֹפֵל 以“正伏在”呈现王返回时的进行状态，“侵犯”保留王对 לכבוש 的强烈、可能带性意味的指控而不宣称哈曼实际意图。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T06:21:15Z'
review_pass:
  verdict: revise
  source_fidelity: 整体忠实呈现叙事次序及哈曼在榻上的姿态，但“当着我的面”将 עִמִּי（‘与我同在／我还在’）收窄为直接目击；末句补出“人们”虽可理解，却非原文所明示。
  naturalness: 行文庄重自然。将王的话改为“在我还在宫中时”更贴近原文，也保持现代汉语通顺。
  terminology: “卧榻”“凌辱”均可用；但本句的王室愤怒指控以“侵犯”更直接对应 לכבוש 所含的强行制服、侵犯意味，同时不把控诉当作叙事事实而断言为既成的性暴力。
  issues:
  - severity: medium
    issue: “当着我的面”对 עִמִּי בַּבָּיִת 的处理过度具体化。
    rationale: 原文是“与我在这宫中／我还在宫中”，并未明确说王亲眼目睹。王刚从园中返回，故“在我还在宫中时”保留其愤怒修辞及空间、时间关系。
  - severity: low
    issue: “人们就蒙住了哈曼的脸”补出了未明示的施事者。
    rationale: 希伯来文只陈述哈曼的脸被蒙住；汉语被动式可自然保留原文未指明施事者的特点。
