base_translation:
  language: en
  yaml_path: translation/ot/esther/007/005.yaml
  text: Then King Ahasuerus said to Esther the queen[a], “Who is he, and where is he[b], who has filled his heart to do this?”
translation:
  language: zh_hans
  text: 亚哈随鲁王问王后以斯帖：“这人是谁？他在哪里[a]？竟敢[b]做这样的事！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“究竟是哪一个？”若把这句话理解为进一步辨认此人的身份，而不是询问他的所在；这种理解可能性较小。
    reason: alternative_reading
  - marker: b
    text: 原文直译近似“使自己的心充满（胆量）去这样做”，是表示“胆敢”或“冒然”做某事的惯用语。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר ... וַיֹּאמֶר
  choice: 问
  rationale: 原文连续两次使用“说”，第二次引出对王后以斯帖所说的话；现代汉语用“问”自然表达其后两个疑问句的言语行为，避免生硬重复，同时保留叙事推进。
- source_word: הַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ
  choice: 亚哈随鲁王
  rationale: 按现代汉语习惯将王号置于专名之后；专名采用通行译名“亚哈随鲁”。
- source_word: לְאֶסְתֵּר הַמַּלְכָּה
  choice: 王后以斯帖
  rationale: 原文为“以斯帖，那王后”的同位结构；“王后以斯帖”符合现代汉语称谓习惯，也完整保留身份信息。
- source_word: מִי הוּא זֶה
  choice: 这人是谁
  rationale: 这是带强调意味的身份询问；“这人是谁”保留指示语的力度，又不额外限定其身份。
- source_word: וְאֵי זֶה הוּא
  choice: 他在哪里
  rationale: אֵי通常询问地点，因此理解为追问此人的所在；另有将短语理解为“究竟是哪一个”的较弱可能，收入脚注。
- source_word: אֲשֶׁר מְלָאוֹ לִבּוֹ
  choice: 竟敢
  rationale: 这是含“心”意象的希伯来语惯用语，表示某人胆敢或擅敢行事；正文译为自然有力的现代汉语“竟敢”，字面形式另见脚注。
- source_word: לַעֲשׂוֹת כֵּן
  choice: 做这样的事
  rationale: כֵּן回指前文所述灭绝犹太人的图谋；“做这样的事”既清楚回指，又保留原文未在本节重述具体行动的表达。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。将希伯来语重复的“说”按汉语叙事习惯整合为“问”；以两个短问句表现国王震惊、急切的语气，并用感叹号传达原句强烈的质问力度。
