base_translation:
  language: en
  yaml_path: translation/ot/esther/007/007.yaml
  text: Then the king rose in his wrath from the wine banquet and went into the palace garden[a], but Haman remained to beg Queen Esther for his life[c][b], for he saw that the evil against him had been determined by the king.
translation:
  language: zh_hans
  text: 王在盛怒中从酒宴上起来，走进王宫的花园[a]。哈曼却留下来，向王后以斯帖恳求饶他一命[b]，因为他看出王已经决定要降祸于他[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “王宫的花园”也可译作“宫苑”或“宫中亭阁的花园”；希伯来语 בִּיתָן 可指宫殿、亭阁或宫殿建筑群。
    reason: cultural_note
  - marker: b
    text: “留下来”直译为“站着”；“恳求饶他一命”较直译为“向王后以斯帖为自己的性命恳求”。
    reason: lexical_alternative
  - marker: c
    text: “已经决定要降祸于他”较直译为“祸患已经由王定在他身上”；原文表达王对哈曼的处置已成定局。
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחֲמָתוֹ
  choice: 盛怒之下
  rationale: חֵמָה 表示强烈、炽烈的愤怒；“盛怒之下”既保留强度，也符合现代汉语叙事表达。
- source_word: מִמִּשְׁתֵּה הַיַּיִן
  choice: 离开酒宴
  rationale: מִשְׁתֶּה 指宴席，且原文明确提到酒；“酒宴”简洁自然，保留了饮酒宴席的含义。
- source_word: גִּנַּת הַבִּיתָן
  choice: 王宫的花园
  rationale: גִּנָּה 是花园；בִּיתָן 可指宫殿或亭阁建筑群。结合波斯宫廷语境，“王宫的花园”清楚自然，同时以脚注保留其他可能。
- source_word: עָמַד
  choice: 留下来
  rationale: 字面是“站着”，但此处与王离席形成对比，叙事重点是哈曼没有随王出去，而是留在原处求情。
- source_word: לְבַקֵּשׁ עַל נַפְשׁוֹ
  choice: 求情保命
  rationale: 该表达字面涉及“为自己的性命寻求”，在语境中是恳求王后救其性命；“求情保命”自然地传达其迫切处境。
- source_word: מֵאֶסְתֵּר הַמַּלְכָּה
  choice: 向王后以斯帖
  rationale: 介词 מֵאֵת 表示求助对象或来源；按现代汉语习惯将头衔置于姓名之前。
- source_word: כִּי רָאָה
  choice: 因为他看出
  rationale: כִּי 引出哈曼求情的原因；רָאָה 在此不只是视觉所见，也含判断、察觉之意，因此译为“看出”。
- source_word: כִּי כָלְתָה אֵלָיו הָרָעָה
  choice: 已经定意要降祸于他
  rationale: כָלְתָה 在此表示事情已定、结局已成定局；הָרָעָה 可指祸患、灾难。译文突出决定的确定性，同时保留祸患含义。
- source_word: מֵאֵת הַמֶּלֶךְ
  choice: 王……定意
  rationale: 该短语标明祸患或决定出自王；汉语改用王作主语，更自然地表达来源和施事。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。前半句以“盛怒之下”表现王怒气的强度；后半句以“却”显明王离开与哈曼留下的对照。对希伯来语中“站着”“寻求性命”以及“祸患已定”的字面形态，正文采用通顺表达，并在脚注中保留。
