base_translation:
  language: en
  yaml_path: translation/ot/esther/007/006.yaml
  text: And Esther said, “A hostile and enemy man—this evil Haman!” Then Haman was terrified before the king and the queen.
translation:
  language: zh_hans
  text: 以斯帖说：“仇人和敌人，就是这个恶人哈曼！”哈曼在王和王后面前惊恐万分。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִישׁ צַר וְאוֹיֵב
  choice: 仇人和敌人
  rationale: צַר 与 אוֹיֵב 构成近义并列，强调哈曼既敌对又为仇敌；中文用“仇人和敌人”自然保留双重指称。אִישׁ 在此用于指认此人，无须生硬译作“一个……的人”。
- source_word: הָמָן הָרָע הַזֶּה
  choice: 就是这个恶人哈曼
  rationale: 保留 הַזֶּה 的现场指认语气，并以“恶人”自然表达 הָרָע 对哈曼的道德定性。
- source_word: נִבְעַת
  choice: 惊恐万分
  rationale: 该动词表达突然而强烈的恐惧、惊骇；“惊恐万分”符合宴席现场的剧烈反应。
- source_word: מִלִּפְנֵי הַמֶּלֶךְ וְהַמַּלְכָּה
  choice: 在王和王后面前
  rationale: מִלִּפְנֵי 可描述身处二人面前而惊恐；直译为“从……面前”在现代中文中不自然。
theological_decisions: []
