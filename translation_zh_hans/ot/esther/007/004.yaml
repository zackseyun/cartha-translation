  text: כִּ֤י נִמְכַּ֨רְנוּ֙ אֲנִ֣י וְ/עַמִּ֔/י לְ/הַשְׁמִ֖יד לַ/הֲר֣וֹג וּ/לְ/אַבֵּ֑ד וְ֠/אִלּוּ לַ/עֲבָדִ֨ים וְ/לִ/שְׁפָח֤וֹת נִמְכַּ֨רְנוּ֙ הֶחֱרַ֔שְׁתִּי כִּ֣י אֵ֥ין הַ/צָּ֛ר שֹׁוֶ֖ה בְּ/נֵ֥זֶק הַ/מֶּֽלֶךְ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/esther/007/004.yaml
  text: For we have been sold[a], I and my people, to be destroyed, to be killed, and to perish. But if we had been sold as male slaves and female slaves, I would have kept silent, for the adversary is not worth the damage to the king.
translation:
  language: zh_hans
  text: 因为我和我的本族已经被卖了，要被毁灭、被杀害、被除尽。假如我们只是被卖为男女奴隶，我本会默不作声；因为这仇敌也无法补偿王的损失[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文末句的表达较紧缩。“王的损失”也可译作“对王的损害”，可指财物损失、损害或给王带来的不便。“仇敌”一词也有按“苦难”或“灾祸”理解的可能。
    reason: 保留 הַצָּר 和 שֹׁוֶה בְּנֵזֶק הַמֶּלֶךְ 的词义及关系上的解释余地，同时不将一种解释当作唯一含义。
lexical_decisions:
- source_word: נִמְכַּרְנוּ
  choice: 已被卖掉
  rationale: 保留 מכר 的商业性隐喻，并与下文假设被卖为奴形成直接呼应。
- source_word: עַמִּי
  choice: 我的民族
  rationale: 此处指以斯帖所认同、正遭整体威胁的族群；“民族”比泛指的“人民”更清楚地表达族群含义。
- source_word: לְהַשְׁמִיד לַהֲרֹג וּלְאַבֵּד
  choice: 要被毁灭、杀害、除尽
  rationale: 保留原文三个近义不定式的叠加强调；按语境采用被动表达，呈现受害者将遭遇的结局。
- source_word: וְאִלּוּ
  choice: 假如……只是
  rationale: 表达与事实相反的较轻假设，并自然引出以斯帖所作的对比。
- source_word: לַעֲבָדִים וְלִשְׁפָחוֹת
  choice: 被卖作奴隶和婢女
  rationale: 保留原文男女有别的奴役称谓，也避免以较弱的“仆人”淡化强迫役使的含义。
- source_word: הֶחֱרַשְׁתִּי
  choice: 我也会默不作声
  rationale: 在反事实条件句中准确表达“本会保持沉默”的语气。
- source_word: הַצָּר
  choice: 这仇敌
  rationale: 定冠词与上下文指向具体敌对者哈曼；“仇敌”保留其敌对、加害的含义。
- source_word: שֹׁוֶה בְּנֵזֶק הַמֶּלֶךְ
  choice: 不足以抵偿王所受的损失
  rationale: שוה 有等值、相抵之意；此译使罕见而紧缩的希伯来语表达在中文中可懂，同时保留损失与补偿的经济语域。
theological_decisions:
- issue: 末句中仇敌、灾祸与王之损失之间的关系
  choice: 这仇敌不足以抵偿王所受的损失
  alternative: 我们的苦难还不值得惊扰王；或：仇敌比不上给王造成的损害
  rationale: 原文末句句法和词义均较难，הַצָּר 通常可指“仇敌”，也可能关联“困苦”；שֹׁוֶה בְּ 可表示等值或相抵。正文采用最贴近显性名词“仇敌”及经济语境的理解，脚注提示其他可能解释，不把歧义处理成教义判断。
translation_notes:
  register: 采用现代、庄重而清楚的宫廷陈述语体。“卖掉—被卖作”维持上下句的修辞联系；“毁灭、杀害、除尽”保留三重排比；末句以正文加脚注保存原文真实歧义。
