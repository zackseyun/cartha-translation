base_translation:
  language: en
  yaml_path: translation/ot/esther/007/003.yaml
  text: Then Queen Esther answered and said[a], “If I have found favor in your eyes, O king, and if it pleases the king, let my life be given me at my petition, and my people at my request.”
translation:
  language: zh_hans
  text: 王后以斯帖回答说：“王啊，我若在你眼前蒙恩，王若以为好，就请按我的祈求把我的性命赐给我，并按我的请求把我的族人也赐给我。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתַּעַן ... וַתֹּאמַר
  choice: 回答说
  rationale: 保留希伯来叙事中“回答……说”的双重表达；现代汉语虽可简化为“回答”，但“回答说”仍自然庄重。
- source_word: אֶסְתֵּר הַמַּלְכָּה
  choice: 王后以斯帖
  rationale: 按现代汉语称号置于姓名之前的习惯表达，同时保留其王后身份。
- source_word: אִם מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: 我若在你眼前蒙恩
  rationale: 保留“在眼前”的希伯来意象，也用汉语圣经与庄重言谈中易懂的“蒙恩”表达获得恩宠。
- source_word: הַמֶּלֶךְ
  choice: 王啊
  rationale: 此处具有呼格功能；“王啊”直接体现以斯帖对王的尊称。
- source_word: וְאִם עַל הַמֶּלֶךְ טוֹב
  choice: 王若以为好
  rationale: 贴近原文“若对王是好的”这一宫廷请愿惯用语，同时符合庄重的现代汉语。
- source_word: תִּנָּתֶן לִי נַפְשִׁי
  choice: 请……把我的性命赐给我
  rationale: נֶפֶשׁ 在死亡威胁的语境中指“性命”；加入“请”体现请求语气，“赐给我”保留 נתן 的给予意象，避免误译为“灵魂”。
- source_word: בִּשְׁאֵלָתִי
  choice: 按我的祈求
  rationale: ב 在此表示请求的依据或相应关系；“祈求”体现正式而恳切的请愿。
- source_word: וְעַמִּי
  choice: 并……我的族人
  rationale: “族人”在此比宽泛的“人民”更清楚地指以斯帖所属、正受灭绝威胁的民族群体。
- source_word: בְּבַקָּשָׁתִי
  choice: 按我的请求
  rationale: 以“请求”与前面的“祈求”形成近义变化，对应原文 שְׁאֵלָה 与 בַּקָּשָׁה 的措辞变化。
theological_decisions: []
