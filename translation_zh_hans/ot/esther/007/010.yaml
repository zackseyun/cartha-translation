  yaml_path: translation/ot/esther/007/010.yaml
  text: So they hanged Haman on the gallows that he had prepared for Mordecai[a], and the king’s wrath subsided.
translation:
  language: zh_hans
  text: 于是，他们把哈曼挂在他为末底改预备的木架上[a]，王的怒气便平息了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们把哈曼悬挂在他为末底改预备的木柱上。”希伯来语עֵץ可指“树、木头或木柱”；这里的动词指把人或尸体悬挂起来。结合这两个词，所指的器具及具体行刑方式不能确定，也可能是以木柱刺穿。
    reason: 保留עֵץ及相关行刑方式的词义宽度；删除“钉在”的过度具体化说法，并明确“刺穿”是由整体语境所容许的可能理解，而非动词本身的确定含义。
lexical_decisions:
- source_word: וַיִּתְלוּ
  choice: 他们把……挂在……上
  rationale: תלה的基本意思是“悬挂、挂起”。此处显然指处死哈曼，但动词本身没有明确限定具体的行刑方式，因此正文采用自然且不过度具体化的“挂在……上”。
- source_word: הָמָן
  choice: 哈曼
  rationale: 采用现代中文圣经读者熟悉的人名译法。
- source_word: עַל הָעֵץ
  choice: 在……木架上
  rationale: עֵץ可指树、木材、木柱或木制器具；在本叙事中指哈曼所预备的行刑设施。“木架”既符合上下文，也比“绞刑架”较少限定具体刑法；原词较宽的含义及“木柱”的可能译法在脚注中保留。
- source_word: אֲשֶׁר הֵכִין לְמָרְדֳּכָי
  choice: 他为末底改预备的
  rationale: 准确表达הכין“预备、备妥”的意思，并保留哈曼反受其害的叙事反讽。
- source_word: וַחֲמַת הַמֶּלֶךְ
  choice: 王的怒气
  rationale: חֵמָה表示强烈的愤怒；“怒气”在现代汉语中自然、庄重，也保持原文的强度。
- source_word: שָׁכָכָה
  choice: 便平息了
  rationale: שׁכך表示消退、平静下来；“平息了”与“怒气”搭配自然，并准确表达状态的消退。
theological_decisions: []
