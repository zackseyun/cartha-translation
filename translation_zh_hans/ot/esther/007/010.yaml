  register: 采用简洁、庄重而自然的现代标准汉语。“于是”承接前文裁决，“便”表达行刑之后王怒消退的叙事结果。正文避免使用会过度确定行刑方式的“绞死”或“绞刑架”，并以脚注说明原文歧义。
