base_translation:
  language: en
  yaml_path: translation/ot/esther/007/002.yaml
  text: And the king said to Esther on the second day also[a], at the banquet of wine, “What is your petition, Queen Esther? It will be granted to you. And what is your request? Even to half the kingdom[b], it shall be done.”
translation:
  language: zh_hans
  text: 第二天的酒宴上，王又对以斯帖说：“以斯帖王后，你所求的是什么？必赐给你。你的请求是什么？就是王国的一半，也必为你成全。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גַּם בַּיּוֹם הַשֵּׁנִי
  choice: 第二天……又
  rationale: גַּם承接前一天的宴席和询问；用“又”自然表达王在第二天再次开口，同时保留“第二天”的明确时间信息。
- source_word: בְּמִשְׁתֵּה הַיַּיִן
  choice: 在酒宴上
  rationale: 该短语直指饮酒设宴的场合；“酒宴”在现代汉语中简洁自然，也保留了原文对酒的明确提及。
- source_word: מַה שְּׁאֵלָתֵךְ
  choice: 你有什么所求
  rationale: שְׁאֵלָה在此指向君王提出的正式求取；“所求”庄重自然，并与下文的“请求”保持近义变化。
- source_word: וְתִנָּתֵן לָךְ
  choice: 必赐给你
  rationale: 字面为“必给你”；在君王回应臣民所求的语境中，“赐给”既自然又保留宫廷语气。
- source_word: וּמַה בַּקָּשָׁתֵךְ
  choice: 你有什么请求
  rationale: בַּקָּשָׁה与前面的שְׁאֵלָה意义相近；译作“请求”可反映原文用词变化，而不夸大二者差异。
- source_word: עַד חֲצִי הַמַּלְכוּת
  choice: 即便达到半个王国
  rationale: 保留עַד“直到、达到”的上限意味，以及原文“王国”而非明说“我的王国”的形式；“即便”传达这一宫廷许诺的强调语气。
- source_word: וְתֵעָשׂ
  choice: 也必为你办到
  rationale: 原文表达请求将获实行或成就；“为你办到”符合现代汉语中君王承诺满足请求的表达，并保留被动结果意味。
- source_word: אֶסְתֵּר הַמַּלְכָּה
  choice: 以斯帖王后
  rationale: 按现代汉语通常的姓名与尊号次序表达，保留原文的尊称。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“酒宴”“所求”“请求”“赐给”“办到”兼顾宫廷语境与普通读者的可理解性；没有沿用英语咨询层中位置与内容不相符的第一条脚注，而是直接按希伯来文将בְּמִשְׁתֵּה הַיַּיִן译为“在酒宴上”。
