revisions:
- from: 第二天，在酒宴上，王又对以斯帖说：“以斯帖王后，你有什么所求？必赐给你。你有什么请求？即便达到半个王国[a]，也必为你办到。”
  to: 第二天的酒宴上，王又对以斯帖说：“以斯帖王后，你所求的是什么？必赐给你。你的请求是什么？就是王国的一半，也必为你成全。”
  rationale: 将时间和场合调整为自然的“第二天的酒宴上”；将不顺畅的“即便达到半个王国”改为“就是王国的一半”，保留原文“直到半个王国”的上限及强调语气；以“为你成全”对应王对请求必获实行的承诺。脚注随译文措辞更新，并保留其文化说明功能。
