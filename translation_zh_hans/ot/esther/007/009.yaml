  to: 王面前的一名太监哈波拿说：“而且，看哪，哈曼为那曾说过对王有益的话的末底改所造的木架[a]，正立在哈曼家中，高五十肘。”王说：“把哈曼挂在上面[b]！”
  rationale: 修订仅处理中文语序、连接语和状态表达，使其更自然地对应希伯来文的“而且／看哪”及“哈曼为末底改所造的木架”这一结构。保留人名、宫廷称谓、古代长度单位和木制处刑设施的必要歧义；脚注锚点仍分别紧随“木架”和“上面”。
