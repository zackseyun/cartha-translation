  text: וַ/יֹּ֣אמֶר חַ֠רְבוֹנָה אֶחָ֨ד מִן הַ/סָּרִיסִ֜ים לִ/פְנֵ֣י הַ/מֶּ֗לֶךְ גַּ֣ם הִנֵּה הָ/עֵ֣ץ אֲשֶׁר עָשָׂ֪ה הָמָ֟ן לְֽ/מָרְדֳּכַ֞י אֲשֶׁ֧ר דִּבֶּר ט֣וֹב עַל הַ/מֶּ֗לֶךְ עֹמֵד֙ בְּ/בֵ֣ית הָמָ֔ן גָּבֹ֖הַּ חֲמִשִּׁ֣ים אַמָּ֑ה וַ/יֹּ֥אמֶר הַ/מֶּ֖לֶךְ תְּלֻ֥/הוּ עָלָֽי/ו־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/007/009.yaml
  text: Then Harbonah[a], one of the eunuchs before the king, said, “Also, behold, the gallows that Haman made for Mordecai, who spoke good for the king, is standing at Haman’s house, fifty cubits high.” And the king said[c][b], “Hang him on it.”
translation:
  language: zh_hans
  text: 王面前的一名太监哈波拿说：“而且，看哪，哈曼为那曾说过对王有益的话的末底改所造的木架[a]，正立在哈曼家中，高五十肘。”王说：“把哈曼挂在上面[b]！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “木架”原文直译为“树”或“木头”，这里指木制的处刑设施，传统上也译作“绞刑架”。
    reason: lexical_alternative
  - marker: b
    text: “挂在上面”也可能指“刺穿在上面”；原文可泛指把人悬挂或置于木制刑具上，并不明确等同于后世的绞刑。
    reason: lexical_alternative
lexical_decisions:
- source_word: חַרְבוֹנָה
  choice: 哈波拿
  rationale: 按希伯来语人名音译，并采用现代中文圣经读者较易识别的形式。
- source_word: הַסָּרִיסִים
  choice: 太监
  rationale: 该词在王宫语境中通常指受阉割的宫廷侍从；“太监”比泛称“官员”更直接地保留原词含义。
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: 王面前的
  rationale: 保留在王前侍立、服侍的宫廷语感，同时符合自然中文。
- source_word: גַּם הִנֵּה
  choice: 看哪……还
  rationale: “看哪”传达指示和强调，“还”保留גַּם的附加语气；调整词序以使中文自然。
- source_word: הָעֵץ
  choice: 木架
  rationale: 原词本义为“树、木头”，此处指木制刑具；“木架”不把具体处刑方式限定为后世式绞刑架，并配脚注说明。
- source_word: עָשָׂה ... לְמָרְדֳּכַי
  choice: 为……造了一座
  rationale: 直接表达“制造”及其针对末底改的用途。
- source_word: דִּבֶּר טוֹב עַל הַמֶּלֶךְ
  choice: 曾说了有利于王的话
  rationale: 保留“说好处/益处”的宽泛表达，并在上下文中自然表示末底改的话使王受益，而不具体增补告密情节。
- source_word: עֹמֵד
  choice: 就立在
  rationale: 保留分词所表达的现存、竖立状态。
- source_word: בְּבֵית הָמָן
  choice: 在哈曼家里
  rationale: 直译其位于哈曼住所或宅院范围内，不额外限定具体位置。
- source_word: גָּבֹהַּ חֲמִשִּׁים אַמָּה
  choice: 高五十肘
  rationale: 保留古代长度单位，以维持原文形式及叙事尺度。
- source_word: תְּלֻהוּ עָלָיו
  choice: 把哈曼挂在上面
  rationale: 原文代词直译为“他”，中文补出“哈曼”以避免歧义；“挂”保留悬挂或陈尸于木制刑具上的较宽泛含义，脚注提示也可能涉及刺穿。
theological_decisions:
- issue: 末底改所说之话的性质
  choice: 说了有利于王的话
  alternative: 为王说了好话／说了王的好话
  rationale: 原文דִּבֶּר טוֹב עַל הַמֶּלֶךְ可表示所说的话使王得益；此译避免误解为奉承，也不把含义收窄为某一种行为。
- issue: 处刑方式
  choice: 挂在木架上
  alternative: 钉在木桩上／刺穿在上面／吊死在上面
  rationale: 希伯来语措辞可泛指把人悬挂或置于木制刑具上，具体技术并不完全确定；正文采用宽泛表达，避免断定为后世绞刑。
translation_notes:
  register: 采用现代、庄重而易懂的叙事中文。“看哪”保留宫廷宣告中的强调语气；使用“木架”和“挂”并加脚注，以保留古代处刑方式的不确定性。所有脚注标记均置于正文相应位置。
