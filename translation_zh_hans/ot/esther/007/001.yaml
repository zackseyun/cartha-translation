base_translation:
  language: en
  yaml_path: translation/ot/esther/007/001.yaml
  text: So the king and Haman came to drink with Queen Esther[a].
translation:
  language: zh_hans
  text: 王和哈曼来，与王后以斯帖一同饮。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较直译：“王和哈曼来，与以斯帖，就是王后，一同饮。”
    reason: 保留希伯来语中“以斯帖，那位王后”的后置同位语次序；“饮”对应原文动词，并不补出“酒”或“宴席”。
lexical_decisions:
- source_word: וַיָּבֹא
  choice: 来
  rationale: בוא的叙事性未完成式推动情节，基本义为“来、进入”。此处译“来”自然，也不额外加入原文没有明说的“进入”。句首叙事连接词不必机械译出，中文以语序自然承接上文。
- source_word: הַמֶּלֶךְ
  choice: 王
  rationale: מֶלֶךְ带定冠词，指上下文已经明确的波斯王。中文叙事中译作“王”简洁自然。
- source_word: וְהָמָן
  choice: 和哈曼
  rationale: 连词וְ连接王与哈曼；专名按现代中文圣经通行形式译为“哈曼”。
- source_word: לִשְׁתּוֹת
  choice: 饮宴
  rationale: שׁתה字面义为“喝、饮用”，但在《以斯帖记》的宫廷筵席语境中可指宴饮。译作“饮宴”既保留饮酒活动的核心，又比单说“一同喝”更符合现代汉语的庄重叙事语体；不擅自补出原文未明说的“酒”。
- source_word: עִם
  choice: 与……一同
  rationale: עִם表示伴随关系；“与……一同”清楚传达王和哈曼同以斯帖宴饮。
- source_word: אֶסְתֵּר הַמַּלְכָּה
  choice: 王后以斯帖
  rationale: 希伯来语字面次序是“以斯帖，那位王后”。现代汉语通常将身份称谓置于姓名之前，译作“王后以斯帖”自然且不改变意义。
