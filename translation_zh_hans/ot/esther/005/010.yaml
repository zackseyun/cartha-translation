base_translation:
  language: en
  yaml_path: translation/ot/esther/005/010.yaml
  text: But Haman restrained himself and went to his house[b][a]. Then he sent and brought in his friends and Zeresh his wife.
translation:
  language: zh_hans
  text: 但哈曼克制住自己[a]，回到家里[b]。随后，他差人把他的朋友和他的妻子细利斯叫来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“控制自己”或“克制自己”。
    reason: lexical_alternative
  - marker: b
    text: 直译：“到他的房屋去”。也可译：“回家”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְאַפַּק
  choice: 克制住自己
  rationale: התפעל词形表达面对怒气时的自我约束；“克制住自己”自然保留反身含义及上下文中的张力。
- source_word: וַיָּבֹא אֶל־בֵּיתוֹ
  choice: 回到家里
  rationale: 原文直指前往自己的房屋；在此叙事语境中，“回到家里”是自然的现代汉语表达，同时保留目的地含义。
- source_word: וַיִּשְׁלַח
  choice: 派人
  rationale: 原文只说“他差遣”，所差遣的对象省略；汉语用“派人”自然补出动作所隐含的执行者，而不改变后续使役动作。
- source_word: וַיָּבֵא
  choice: 请来
  rationale: בוא的使役形意为“使……来”；对朋友和妻子而言，“请来”比生硬的“带来”更符合汉语召集语境。
- source_word: אֹהֲבָיו
  choice: 他的朋友
  rationale: 该复数名词在此指哈曼的亲近者或朋友；“朋友”简明自然。
- source_word: זֶרֶשׁ אִשְׁתּוֹ
  choice: 妻子细利斯
  rationale: 按现代汉语习惯以身份称谓置于姓名前，清楚表达细利斯是他的妻子。
- source_word: וַ
  choice: 但／随后
  rationale: 句首叙事连接词结合上文怒气带有轻微转折，译作“但”；后一个叙事推进用“随后”表达连续动作。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“派人把……请来”将两个连续希伯来动词合成自然汉语结构，同时保留先差遣、后召来的动作次序。所有脚注标记均置于对应正文之后。
