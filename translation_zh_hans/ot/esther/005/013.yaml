  text: וְ/כָל זֶ֕ה אֵינֶ֥/נּוּ שֹׁוֶ֖ה לִ֑/י בְּ/כָל עֵ֗ת אֲשֶׁ֨ר אֲנִ֤י רֹאֶה֙ אֶת מָרְדֳּכַ֣י הַ/יְּהוּדִ֔י יוֹשֵׁ֖ב בְּ/שַׁ֥עַר הַ/מֶּֽלֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/005/013.yaml
  text: Yet all this is worth nothing to me whenever I see Mordecai the Jew sitting at the king’s gate[a][b].
translation:
  language: zh_hans
  text: 然而，每当我看见犹太人末底改坐在王的门口，这一切对我就毫无价值[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这一切对我都没有益处。”
    reason: lexical_alternative
  - marker: b
    text: “犹太人”也可译作“犹大人”；此处很可能着重指末底改在波斯宫廷环境中的犹太族群身份。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כָל זֶה
  choice: 然而……这一切
  rationale: וְ 在本句中承接哈曼此前的夸耀，同时形成强烈转折；“然而”自然表达这种语境作用，“这一切”则完整保留 כָל זֶה。
- source_word: אֵינֶנּוּ שֹׁוֶה לִי
  choice: 对我就毫无价值
  rationale: שׁוה 在此表示有价值、算数或有益；与否定词连用，表达哈曼认为自己所得的一切都变得毫无价值，而不是字面上的“不与我相等”。
- source_word: בְּ/כָל עֵת אֲשֶׁר
  choice: 每当
  rationale: 原短语直译为“在每一次……的时候”，含反复发生之意；“每当”在现代汉语中简洁自然。
- source_word: אֲנִי רֹאֶה
  choice: 我看见
  rationale: 代词加分词表达持续或反复的动作；配合“每当”，“我看见”准确自然。
- source_word: מָרְדֳּכַי
  choice: 末底改
  rationale: 采用中文圣经传统中通行且易识别的人名译法。
- source_word: הַיְּהוּדִי
  choice: 犹太人
  rationale: יְהוּדִי 可指“犹太人”或“犹大人”；在波斯宫廷和散居背景中，此处主要突出末底改的族群身份。
- source_word: יוֹשֵׁב
  choice: 坐
  rationale: 直接保留原文所描写的姿态和所在状态，不增添“仍然”等原文未明说的强调。
- source_word: בְּ/שַׁעַר הַמֶּלֶךְ
  choice: 在王门那里
  rationale: 该短语指王宫门口及其行政区域；“在王门那里”既保留传统称谓“王门”，又以“那里”使现代汉语位置表达更自然。
theological_decisions: []
