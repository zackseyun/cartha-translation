translation_notes:
  register: 采用现代、庄重而易懂的宫廷对话语体。“王后以斯帖”符合现代汉语称谓顺序；两个问句保留原文的递进与重复，“即使要半个国，也必赐给你”则兼顾希伯来语范围表达和自然中文。
