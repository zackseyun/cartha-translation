  yaml_path: translation/ot/esther/005/003.yaml
  text: Then the king said to her[a], “What is it[c][b], Queen Esther? And what is your request? Up to half the kingdom—it will be given to you.”
translation:
  language: zh_hans
  text: 王对她说：“王后以斯帖，你有什么事？你有何请求？就是半个国，也必赐给你。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר לָהּ הַמֶּלֶךְ
  choice: 王对她说
  rationale: 按希伯来语叙事顺序直译核心内容；中文不必机械译出连接词“于是”，上下文已能表达事件推进。
- source_word: מַה לָּךְ
  choice: 你有什么事
  rationale: 这是字面为“对你有什么”的希伯来语习语，用来询问对方有何心事、需要或来意；“你有什么事”自然简洁，并保留语义范围。
- source_word: אֶסְתֵּר הַמַּלְכָּה
  choice: 王后以斯帖
  rationale: 采用现代汉语中自然的头衔加姓名次序，同时完整保留王后身份和名字。
- source_word: וּמַה בַּקָּשָׁתֵךְ
  choice: 你有何请求
  rationale: בַּקָּשָׁה可指请求或所求之事；“请求”现代易懂，也符合朝廷语境。
- source_word: עַד חֲצִי הַמַּלְכוּת
  choice: 即使要半个国
  rationale: 表达王所许范围可达国的一半；“即使要”在中文中自然传达这种慷慨承诺的上限，而不把它误写成已经提出的具体要求。
- source_word: וְיִנָּתֵן לָךְ
  choice: 也必赐给你
  rationale: 被动式表达确定的应许；中文以王为隐含施事，用“赐”符合君王对臣民说话的语境，“必”传达承诺语气。
