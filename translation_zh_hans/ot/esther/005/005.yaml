  text: וַ/יֹּ֣אמֶר הַ/מֶּ֔לֶךְ מַהֲרוּ֙ אֶת הָמָ֔ן לַ/עֲשׂ֖וֹת אֶת דְּבַ֣ר אֶסְתֵּ֑ר וַ/יָּבֹ֤א הַ/מֶּ֨לֶךְ֙ וְ/הָמָ֔ן אֶל הַ/מִּשְׁתֶּ֖ה אֲשֶׁר עָשְׂתָ֥ה אֶסְתֵּֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/005/005.yaml
  text: Then the king said[a], "Hurry, bring Haman, so that Esther's word may be done." So the king and Haman came to the banquet that Esther had prepared.
translation:
  language: zh_hans
  text: 于是王说：“快把哈曼叫来，好照以斯帖所说的去做[a]。”王和哈曼就来到以斯帖所预备的宴席。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“好实行以斯帖的话。”希伯来文直译是“去做以斯帖的话”；这里的“话”可以指她所说的事或提出的请求。
    reason: 保留דְּבַר的词义范围及原文表达方式。
lexical_decisions:
- source_word: מַהֲרוּ אֶת הָמָן
  choice: 快把哈曼叫来
  rationale: מַהֲרוּ是复数命令式，显然是吩咐侍从迅速行动；希伯来文以哈曼为直接宾语。中文用“快把哈曼叫来”自然表达催促与召人前来的语境。
- source_word: לַעֲשׂוֹת אֶת דְּבַר אֶסְתֵּר
  choice: 好照以斯帖所说的去做
  rationale: דְּבַר可指“话、所说的事、请求”。此处不把它窄化为单一含义，而以“所说的”保留其措辞，同时用“照……去做”自然表达לַעֲשׂוֹת אֶת的意思。
- source_word: וַיָּבֹא
  choice: 来到
  rationale: בוא可按叙事视角译为“来”或“去”；这里目的地随即出现，译作“来到”符合现代汉语叙事。
- source_word: הַמִּשְׁתֶּה
  choice: 宴席
  rationale: מִשְׁתֶּה指设有饮宴的筵席；“宴席”适合王宫场景，也比直译为“饮酒宴”更自然且不过度强调饮酒。
- source_word: אֲשֶׁר עָשְׂתָה אֶסְתֵּר
  choice: 以斯帖所预备的
  rationale: עשה与宴席连用表示设办、预备；“所预备的”简洁自然，并表明宴席在他们到达前已经安排好。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“快把……叫来”符合君王向侍从下令的口吻；“照以斯帖所说的去做”既自然，又保留原文“以斯帖的话”所具有的语义余地。
