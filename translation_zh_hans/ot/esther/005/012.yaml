base_translation:
  language: en
  yaml_path: translation/ot/esther/005/012.yaml
  text: Then Haman said[a], “Indeed, Queen Esther brought no one with the king to the banquet she prepared except me[b]; and tomorrow also I am invited by her together with the king.”
translation:
  language: zh_hans
  text: 哈曼说：“王后以斯帖所预备的宴席，除了我以外，她没有邀请任何人与王一同赴席；明天我还蒙她邀请，要与王一同赴席。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 又说
  rationale: 叙事中的连续式推进情节；结合上文哈曼正在夸耀，译作“又说”自然地承接其话语。
- source_word: אַף לֹא
  choice: 没有……别人
  rationale: 该组合带有加强语气；与后面的排他结构配合，用“除了我以外，没有……别人”表现哈曼夸耀自己独受礼遇。
- source_word: הֵבִיאָה
  choice: 请……赴宴
  rationale: 字面义为“带来、使进入”，在宴席语境中实际指使人前来赴宴；现代汉语以“请……赴宴”较自然，同时不额外引入正式召见之意。
- source_word: אֶסְתֵּר הַמַּלְכָּה
  choice: 王后以斯帖
  rationale: 符合现代汉语称谓次序，并保留其王后身份。
- source_word: עִם הַמֶּלֶךְ
  choice: 随王／与王一同
  rationale: 两处都表达与王共同在场；前处用“随王”适合赴宴句式，后处用“与王一同”清楚传达同行共席之意。
- source_word: אֶל הַמִּשְׁתֶּה
  choice: 赴宴／宴席
  rationale: מִשְׁתֶּה指设有酒饮的筵席或宴会；宫廷语境中译为“宴席”，并在动词结构中自然表达为“赴宴”。
- source_word: אֲשֶׁר עָשָׂתָה
  choice: 所预备的
  rationale: 字面为“她所办的／做的”；汉语谈宴席时“所预备的”既自然，也保留以斯帖主办宴席的意思。
- source_word: כִּי אִם אוֹתִי
  choice: 除了我以外
  rationale: 准确表达例外和排他意义，并与前面的否定结构自然搭配。
- source_word: וְגַם לְמָחָר
  choice: 明天我还
  rationale: “还”保留וְגַם的附加语气，突出哈曼明日仍将独享殊荣的自得。
- source_word: קָרוּא
  choice: 受……邀请
  rationale: 字面为“被叫／被召”，但在宴席语境中表示受邀；“受邀请”是清楚自然的现代汉语。
- source_word: לָהּ
  choice: 受她邀请
  rationale: 此处לָהּ标明邀请与以斯帖的关系；汉语用主动来源式表达，明确是她发出的邀请。
theological_decisions: []
