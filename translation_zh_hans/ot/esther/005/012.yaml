  to: 哈曼说：“王后以斯帖所预备的宴席，除了我以外，她没有邀请任何人与王一同赴席；明天我还蒙她邀请，要与王一同赴席。”
  rationale: 以“没有邀请任何人与王一同赴席”明确对应原文“没有带任何人与王到她所办的宴席，只有我”，避免“随王”可能造成的从属关系误读。后半句保留“明天”“还”及“受她邀请、与王一同”的全部信息。
