base_translation:
  language: en
  yaml_path: translation/ot/esther/005/008.yaml
  text: If I have found favor in the eyes of the king[a], and if it pleases the king to grant my petition and fulfill my request, let the king and Haman come to the banquet that I will prepare for them[b], and tomorrow I will do according to the king’s word.
translation:
  language: zh_hans
  text: “我若在王眼前蒙恩[a]，王若以为好，准我的所求，并成全我的请求，就请王和哈曼来赴我为他们预备的宴席；明日，我必照王的话去做[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在王眼前蒙恩”也可意译为“蒙王恩宠”。
    reason: lexical_alternative
  - marker: b
    text: 原文为“明日，我必照王的话去做”。这句话可能是指以斯帖会回应王的要求，在次日说明自己的所求。
    reason: lexical_alternative
lexical_decisions:
- source_word: מָצָאתִי חֵן בְּעֵינֵי
  choice: 在王眼前蒙恩
  rationale: 保留希伯来语“在……眼中找到恩惠”的意象，也符合汉语较庄重的宫廷语境；此处的“恩”指王的 Favor，并不特指神学意义上的恩典。
- source_word: עַל הַמֶּלֶךְ טוֹב
  choice: 王若以为好
  rationale: 贴近原文“对王是好的”，在现代汉语中表达王认为合宜、悦纳此事，同时保持以斯帖恭敬含蓄的语气。
- source_word: לָתֵת אֶת שְׁאֵלָתִי
  choice: 准我的所求
  rationale: “准”自然表达君王应允请求；“所求”与下文“请求”形成相关而不完全重复的对应。
- source_word: וְלַעֲשׂוֹת אֶת בַּקָּשָׁתִי
  choice: 成全我的请求
  rationale: 原文直译为“做我的请求”；“成全”在汉语中自然表达将请求付诸实现，并保留与前一分句的近义并列。
- source_word: שְׁאֵלָתִי / בַּקָּשָׁתִי
  choice: 我的所求／我的请求
  rationale: 以两个相近表达对应原文两个相关名词，既反映措辞变化，又维持正式请求的语域。
- source_word: יָבֹא
  choice: 就请……来赴
  rationale: 该未完成式在语境中具有祈使或请求作用；“请……来赴”适合对君王发出的恭敬邀请。
- source_word: הַמִּשְׁתֶּה
  choice: 宴席
  rationale: 该词指筵宴，常包含饮酒；“宴席”符合王宫叙事，且比“饮酒宴”更自然。
- source_word: אֲשֶׁר אֶעֱשֶׂה לָהֶם
  choice: 我为他们预备的
  rationale: 原文为“我为他们做的”；汉语通常说“预备宴席”，既自然又准确。
- source_word: וּמָחָר אֶעֱשֶׂה כִּדְבַר הַמֶּלֶךְ
  choice: 明日，我必照王的话去做
  rationale: 保留原文略带省略且开放的表达，不直接补成“陈明所求”或“回答王”，让上下文说明以斯帖将依王所说的办理。
