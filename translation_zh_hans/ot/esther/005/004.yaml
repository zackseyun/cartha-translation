  yaml_path: translation/ot/esther/005/004.yaml
  text: Esther said[a], “If it pleases the king[b], let the king and Haman come today to the banquet that I have prepared for him.”
translation:
  language: zh_hans
  text: 以斯帖说：“王若以为好，就请王和哈曼今日前来，赴我为王[a]预备的宴席。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文作“为他”，这个单数代词看来特指王，尽管哈曼也受邀。
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם עַל הַמֶּלֶךְ טוֹב
  choice: 王若以为好
  rationale: 这是宫廷中提出请求的委婉表达；此译保留“好”的语义和对王的恭敬语气，同时在现代汉语中自然易懂。
- source_word: יָבוֹא
  choice: 就请……前来
  rationale: 该未完成式在此具有祈使、请求意味。“就请”自然表达以斯帖礼貌邀请王赴宴的语气。
- source_word: הַמֶּלֶךְ וְהָמָן
  choice: 王和哈曼
  rationale: 依照原文重复“王”的称号，不补入本节未出现的王名。
- source_word: הַיּוֹם
  choice: 今日
  rationale: 准确保留邀请当日赴宴的时间紧迫性；“今日”适合庄重叙事语体。
- source_word: הַמִּשְׁתֶּה
  choice: 宴席
  rationale: 该词指设有饮食酒宴的筵席；“宴席”符合王宫场景，也不刻意强化饮酒含义。
- source_word: אֲשֶׁר עָשִׂיתִי לוֹ
  choice: 我为王预备的
  rationale: “预备宴席”符合现代汉语搭配。原文代词为阳性单数，最自然地回指王，因此正文明确译作“王”，并以脚注说明原文形式。
