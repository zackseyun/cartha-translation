base_translation:
  language: en
  yaml_path: translation/ot/esther/005/011.yaml
  text: And Haman told them of the glory of his wealth[a], and the multitude of his sons, and all that the king had done to make him great[d][c][b], and how he had exalted him above the officials and servants of the king.
translation:
  language: zh_hans
  text: 哈曼向他们讲述自己财富的荣华[a]、众多的儿子[b]，以及王使他显贵所做的一切[c]，又讲述王怎样把他高举在众官长和王的臣仆之上[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“他财富的荣耀”；也可译“他财富的华贵”。希伯来语强调其财富所呈现的显赫与华美。
    reason: lexical_alternative
  - marker: b
    text: 也可译“他儿子的数目众多”。希伯来语明确说“儿子”，不是泛指“儿女”或“孩子”。
    reason: lexical_alternative
  - marker: c
    text: 也可译“王为提拔他所做的一切”。
    reason: lexical_alternative
  - marker: d
    text: 也可译“把他抬举在”或“把他提升到”众官长和王的臣仆之上。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְסַפֵּר
  choice: 讲述
  rationale: 该叙事动词表示哈曼向在场的人逐一陈说自己的情况；“讲述”自然、准确，而不把上下文中的炫耀意味直接写进词义。
- source_word: כְּבוֹד עָשְׁרוֹ
  choice: 自己显赫的财富
  rationale: כָּבוֹד 与“财富”连用，强调财富所呈现的荣耀、分量和华贵。“显赫的财富”在现代汉语中较自然，也保留其令人瞩目的意味。
- source_word: רֹב בָּנָיו
  choice: 众多的儿子
  rationale: רֹב 表示数量多，בָּנָיו 明确指“他的儿子”，因此不泛化为“儿女”或“孩子”。
- source_word: גִּדְּלוֹ
  choice: 使他尊大
  rationale: גדל 的 Piel 词形在这里表示使某人变得尊大、显要；保留使役含义和王的主动作用，并由“所做的一切”表达 כָּל אֲשֶׁר。
- source_word: נִשְּׂאוֹ עַל
  choice: 把他擢升到……之上
  rationale: נשא 与 עַל 在此表示职位或等级上的提升；“擢升到……之上”清楚体现哈曼被置于其他宫廷人员之上的层级关系。
- source_word: הַשָּׂרִים
  choice: 众官长
  rationale: שָׂרִים 可指掌权者、官员或首领；在波斯宫廷语境中，“官长”既庄重又不限定为世袭贵族。
- source_word: עַבְדֵי הַמֶּלֶךְ
  choice: 王的臣仆
  rationale: 该词组指服务于王的宫廷人员。“臣仆”符合王廷语境，也避免把这里不确定的身份狭义化为奴隶。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“讲述”不提前替读者判定哈曼是在夸耀；“尊大”保留原文使之为大的表达，“擢升”则清楚传达官阶高于他人的含义。
