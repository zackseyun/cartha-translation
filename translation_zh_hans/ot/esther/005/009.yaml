  text: וַ/יֵּצֵ֤א הָמָן֙ בַּ/יּ֣וֹם הַ/ה֔וּא שָׂמֵ֖חַ וְ/ט֣וֹב לֵ֑ב וְ/כִ/רְאוֹת֩ הָמָ֨ן אֶֽת מָרְדֳּכַ֜י בְּ/שַׁ֣עַר הַ/מֶּ֗לֶךְ וְ/לֹא קָם֙ וְ/לֹא זָ֣ע מִמֶּ֔/נּוּ וַ/יִּמָּלֵ֥א הָמָ֛ן עַֽל מָרְדֳּכַ֖י חֵמָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/005/009.yaml
  text: Haman went out that day joyful and glad of heart. But when Haman saw Mordecai in the king’s gate[a], and that he did not rise or tremble before him, Haman was filled with rage against Mordecai.
translation:
  language: zh_hans
  text: 那一天，哈曼欢欢喜喜、心情畅快地出来了。但哈曼看见末底改在王宫门口，既不起身，也不因他而战兢[a]，哈曼就对末底改充满怒火。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“也不因他而动”，或“也不在他面前显出惧怕”。
    reason: 原文动词可指颤动、战兢，也可较宽泛地指移动或受震动；其后的介词既可表达原因，也可联系所惧怕的对象。
lexical_decisions:
- source_word: שָׂמֵחַ וְטוֹב לֵב
  choice: 欢欢喜喜、心情畅快
  rationale: 这一对表达描写喜悦、兴高采烈的状态；译文既保留两个并列成分，也采用自然的现代汉语。
- source_word: בַּיּוֹם הַהוּא
  choice: 那一天
  rationale: 自然地保留原文明确的时间指称。
- source_word: בְּשַׁעַר הַמֶּלֶךְ
  choice: 在王宫门口
  rationale: 字面为“在王的门”；此处指王宫门楼或宫门区域。“王宫门口”符合现代汉语习惯，同时保留宫廷场景。
- source_word: וְלֹא קָם
  choice: 不起身
  rationale: קום在此指为表示敬意而起身；“不起身”简洁地保留这一社交动作。
- source_word: וְלֹא זָע מִמֶּנּוּ
  choice: 也不因他而战兢
  rationale: זוע可指颤动、战兢或受震动；מִמֶּנּוּ可表达原因或所惧怕的对象。正文保留“战兢”的强烈形象及“因他”的关系，脚注列出更宽泛的可能译法。
- source_word: וַיִּמָּלֵא ... חֵמָה
  choice: 满腔怒火
  rationale: 原结构是“被烈怒充满”；“满腔怒火”是有力度且自然的现代汉语对应。
- source_word: עַל מָרְדֳּכַי
  choice: 对末底改
  rationale: עַל与愤怒用语连用时标明怒气针对的对象；“对末底改满腔怒火”在汉语中清楚自然。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“欢欢喜喜、心情畅快”保留原文并列的情绪描写；“满腔怒火”传达强烈愤怒而不使用古奥措辞。脚注标记[a]已置于对应短语之后。
