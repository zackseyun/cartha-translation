  rationale: 修订“达到国的一半”为“即使到半个国度”，以准确、自然地表达原文的上限式王室允诺；将末句改为“也必照办”，使其在现代汉语中自然指向所提出的请求。其余措辞保留原稿的庄重叙事语体、近义复现和原文未明示所属者的歧义。
