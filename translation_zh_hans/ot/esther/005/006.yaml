base_translation:
  language: en
  yaml_path: translation/ot/esther/005/006.yaml
  text: And the king said to Esther at the wine banquet[a], “What is your petition? It will be granted to you. And what is your request? Even up to half the kingdom[b], it will be done.”
translation:
  language: zh_hans
  text: 王在酒宴上[a]对以斯帖说：“你的所求是什么？必赐给你。你的请求是什么？即使到半个国度，也必照办[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“在酒的筵席上”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文作“直到国度的一半”，没有明说“我的国”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּמִשְׁתֵּה הַיַּיִן
  choice: 在酒宴上
  rationale: מִשְׁתֶּה 指筵席或宴饮，הַיַּיִן 明确指出酒；“酒宴”既自然，也保留宴饮场景。
- source_word: שְּׁאֵלָתֵךְ
  choice: 你有什么所求
  rationale: 此处指向君王提出的诉求，并非一般疑问；“所求”符合宫廷语境，也与下文“请求”略作区分。
- source_word: וְיִנָּתֵן לָךְ
  choice: 必赐给你
  rationale: נתן 的尼法勒形式在这一公式中表达君王允诺；“必赐给你”既保留“给予”的意象，也自然传达必获准许的语气。
- source_word: בַּקָּשָׁתֵךְ
  choice: 你有什么请求
  rationale: בַּקָּשָׁה 表示所寻求、所请求之事；译作“请求”清楚自然，并保留与前一个名词之间轻微的措辞变化。
- source_word: עַד חֲצִי הַמַּלְכוּת
  choice: 就是达到国的一半
  rationale: 原文是“直到国的一半”，没有明说“我的国”；“就是达到”传达 עַד 在君王夸张允诺中的强调作用，同时不补入所属代词。
- source_word: וְתֵעָשׂ
  choice: 也必为你成就
  rationale: 该形式表达请求将得到实行或成全；“成就”适合庄重的君王允诺，“为你”在汉语中明确承接以斯帖的请求，而不改变所指。
