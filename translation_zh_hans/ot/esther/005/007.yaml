  yaml_path: translation/ot/esther/005/007.yaml
  text: Then Esther answered and said[a], “My petition and my request are:”
translation:
  language: zh_hans
  text: 以斯帖回答说：“我的请求和恳求是：[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “请求”和“恳求”原文是一对意义相近的正式用语；前一个词也可指“所问的事”或“所求的事”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעַן
  choice: 回答
  rationale: 保留 ענה 的言语回应义；叙事先后关系在现代汉语中由上下文自然呈现，不必另加“于是”。
- source_word: אֶסְתֵּר
  choice: 以斯帖
  rationale: 采用现代简体中文圣经人名的通行音译。
- source_word: וַתֹּאמַר
  choice: 说
  rationale: 与“回答”并用，保留希伯来语“回答说”的双动词表达，同时符合庄重自然的现代汉语。
- source_word: שְׁאֵלָתִי
  choice: 我的请求
  rationale: 该词可指问题、所求之事或请求；在向王陈情的宫廷语境中译作“请求”较贴切。
- source_word: וּבַקָּשָׁתִי
  choice: 和恳求
  rationale: 表达所求、恳请之意；用“恳求”与前面的“请求”形成近义而不完全相同的正式配对。
