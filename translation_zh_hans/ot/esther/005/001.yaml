base_translation:
  language: en
  yaml_path: translation/ot/esther/005/001.yaml
  text: On the third day[a], Esther put on her royal robes and stood in the inner court of the king’s palace, opposite the king’s house, while the king was sitting on his royal throne in the royal house[b], opposite the entrance of the house.
translation:
  language: zh_hans
  text: 第三天，以斯帖穿上王室礼服[a]，站在王宫的内院，正对着王的宫殿；王坐在王宫[b]的王座上，正对着宫门。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“穿上王权（或王室尊荣）”，在这里指穿上王室礼服或服饰。
    reason: lexical_alternative
  - marker: b
    text: 原文为“王室之屋”；希伯来语“屋”在这里可指宫殿或王宫。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: 不单独译出
  rationale: 此处是希伯来叙事推进句式；现代汉语可直接从时间状语起句，无须添加“事情是这样”或“那时”。
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: 第三天
  rationale: 直接、自然地保留原文的时间表达。
- source_word: וַתִּלְבַּשׁ אֶסְתֵּר מַלְכוּת
  choice: 以斯帖穿上王室礼服
  rationale: מַלְכוּת 通常指王权、王室身份或国度，但与“穿上”连用时，语境所指是体现王室身份的衣饰；正文采用自然的具体表达，并以脚注保留字面张力。
- source_word: וַתַּעֲמֹד
  choice: 站在
  rationale: 准确传达简单的叙事动作，不额外强化为“挺身站立”等。
- source_word: בַּחֲצַר בֵּית־הַמֶּלֶךְ הַפְּנִימִית
  choice: 站在王宫的内院
  rationale: בֵּית־הַמֶּלֶךְ 在宫廷场景中指王的宫殿建筑群；“王宫的内院”符合现代汉语习惯。
- source_word: נֹכַח בֵּית הַמֶּלֶךְ
  choice: 面对宫殿
  rationale: נֹכַח 表示处在对面并朝向某处；“面对”保留空间关系，又避免生硬重复“王的房屋”。
- source_word: וְהַמֶּלֶךְ יוֹשֵׁב
  choice: 王正坐在
  rationale: “正”自然表达该动作与以斯帖站立同时发生的背景情形。
- source_word: עַל כִּסֵּא מַלְכוּתוֹ
  choice: 在……的王位上
  rationale: 该结构指王所坐的统治宝座；“王位”在汉语中既可指宝座，也带有王权含义，符合此处语境。
- source_word: בְּבֵית הַמַּלְכוּת
  choice: 在王宫大殿
  rationale: 该短语字面与“王权、王室”相关，语境指王所在的宫殿内部；“王宫大殿”清楚呈现场景，同时以脚注说明“殿”所译的原文字义范围。
- source_word: נֹכַח פֶּתַח הַבָּיִת
  choice: 面对殿门
  rationale: 简洁保留王位朝向建筑入口的空间布局；“殿门”与前文“王宫大殿”自然衔接。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。通过“王宫—宫殿—大殿—殿门”呈现原文反复使用“屋”所描绘的宫廷空间，同时避免现代汉语中“王的房屋”等不自然措辞。分号用于清楚区分以斯帖的位置与王座所在的位置。
