base_translation:
  language: en
  yaml_path: translation/ot/esther/005/014.yaml
  text: Then Zeresh his wife and all his friends said to him[a], “Let a gallows fifty cubits high be made, and in the morning tell the king to have Mordecai hanged on it. Then go with the king to the banquet rejoicing.” The matter pleased Haman[c][b], and he made the gallows.
translation:
  language: zh_hans
  text: 他妻子细利斯和他所有的朋友对他说：“让人造一座五十肘高的木架[a][b]。早晨你去禀告王，让人把末底改挂在上面[c]；然后欢喜地同王赴宴。”这话正合哈曼的心意，他便造了那座木架。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “木架”也可译作“木桩”或“木柱”。希伯来语עֵץ可指木头、树木或木制刑具，具体形制不能确定。
    reason: lexical_alternative
  - marker: b
    text: 五十肘约合二十三米。
    reason: cultural_note
  - marker: c
    text: “挂在上面”也可能被理解为“在木桩上刺穿”或“钉在上面”；原文没有明确说明具体执行方式。
    reason: alternative_reading
lexical_decisions:
- source_word: אֹהֲבָיו
  choice: 他所有的朋友
  rationale: 该分词字面意为“爱他的人”，在此宫廷叙事语境中自然指哈曼的亲近友人或同党；“朋友”是现代汉语中不额外强化情感色彩的表达。
- source_word: יַעֲשׂוּ
  choice: 让人造
  rationale: 未明确主语的复数未完成式在此表达建议；“让人造”既保留使役性的提议，也不擅自指定施工者。
- source_word: עֵץ
  choice: 木架
  rationale: 该词可指树、木材或木制刑具。上下文明确它用于处置并示众末底改，但具体形制不明；“木架”比“绞刑架”更少限定执行方式，同时符合现代汉语叙事。
- source_word: גָּבֹהַּ חֲמִשִּׁים אַמָּה
  choice: 五十肘高
  rationale: 正文保留古代长度单位，避免用现代单位造成虚假的精确感；约数在脚注说明。
- source_word: אֱמֹר לַמֶּלֶךְ
  choice: 你去禀告王
  rationale: 动词基本义为“对王说”。在宫廷语境中，“禀告”自然表达下级向君王陈说，但不把它过度解释为正式请求或命令。
- source_word: וְיִתְלוּ אֶת־מָרְדֳּכַי עָלָיו
  choice: 让人把末底改挂在上面
  rationale: 复数动词的执行者未指明，故译作“让人”；תלה可表示悬挂，也可能在此涉及刺穿后悬示，正文采用较宽泛的“挂”，另以脚注保留执行方式的不确定性。
- source_word: מִשְׁתֶּה
  choice: 宴
  rationale: 该词指宴席，常含饮酒之意；此处为王室宴会，“赴宴”简洁自然。
- source_word: שָׂמֵחַ
  choice: 欢欢喜喜地
  rationale: 形容词在句中作状态或方式修饰哈曼赴宴；该译法生动传达其欣喜状态。
- source_word: וַיִּיטַב הַדָּבָר לִפְנֵי הָמָן
  choice: 这话正合哈曼的心意
  rationale: 这是表示某事在某人看来美好、可取的惯用语；“正合……的心意”准确而符合现代汉语习惯。
- source_word: וַיַּעַשׂ הָעֵץ
  choice: 他便造了那座木架
  rationale: 希伯来文直接说哈曼“造了”木架；中文保留直接表述，不额外判定是亲手建造还是命人建造。
theological_decisions:
- issue: 木制刑具的形制与处决方式
  choice: 正文译为“木架”及“挂在上面”，以保留希伯来文的宽泛性
  alternative: 译为“绞刑架／绞死”，或“木桩／刺穿”
  rationale: עֵץ与תלה在该语境中确定涉及木制处刑或陈尸示众设施，但原文未清楚交代其形制和具体执行方式；不应根据后世绞刑意象或波斯习俗单方面定案。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“禀告王”“陪王赴宴”保留宫廷叙事色彩而不过度古雅；以“木架”避免现代读者把该刑具直接想象成固定形制的绞刑架。所有脚注标记均紧随其所说明的词语或短语。
