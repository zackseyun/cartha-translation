base_translation:
  language: en
  yaml_path: translation/ot/esther/005/002.yaml
  text: And when the king saw Esther the queen standing in the court[a], she found favor in his sight, and the king extended to Esther the golden scepter that was in his hand[c][b]. Then Esther came near and touched the top of the scepter.
translation:
  language: zh_hans
  text: 王看见王后以斯帖站在院中[a]，她就蒙王恩宠。王便向以斯帖伸出手中的金权杖。以斯帖走上前，摸了杖头[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “院中”也可译作“庭院里”。
    reason: lexical_alternative
  - marker: b
    text: “杖头”也可译作“杖的顶端”或“杖的端头”；希伯来文直译为“杖的头”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִרְאוֹת
  choice: 王看见……时
  rationale: 该结构引出时间情境；汉语叙事可自然处理为“王看见……”，不必生硬译出“事情发生了”。
- source_word: אֶסְתֵּר הַמַּלְכָּה
  choice: 王后以斯帖
  rationale: 希伯来文为名字与称号同位；现代汉语通常将称号置于名字之前，更自然且意义不变。
- source_word: עֹמֶדֶת בֶּחָצֵר
  choice: 站在院中
  rationale: 保留分词所表达的站立状态；חָצֵר在此指王宫内的院子，译为“院中”清楚自然。
- source_word: נָשְׂאָה חֵן בְּעֵינָיו
  choice: 她就在王眼前蒙了恩
  rationale: 保留“在他眼中/眼前”与“恩”的源语意象，同时以汉语圣经叙事中自然可懂的表达传达她得到王的悦纳。
- source_word: וַיּוֹשֶׁט
  choice: 伸出
  rationale: 准确表达王把杖朝以斯帖伸去的动作，简洁自然。
- source_word: שַׁרְבִיט הַזָּהָב
  choice: 金杖
  rationale: 在王室语境中指象征王权的权杖；“金杖”简明且符合现代汉语表达。
- source_word: אֲשֶׁר בְּיָדוֹ
  choice: 手中的
  rationale: 以紧凑的汉语定语结构表达“在他手中的”，没有删减所指信息。
- source_word: וַתִּקְרַב
  choice: 走上前
  rationale: 传达以斯帖响应王的动作而靠近；比直译“接近”更符合现场动作与现代汉语叙事。
- source_word: וַתִּגַּע בְּרֹאשׁ הַשַּׁרְבִיט
  choice: 摸了杖头
  rationale: רֹאשׁ字面为“头”，指杖的顶端；“杖头”既保留源语意象，也不武断限定为尖端。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而清楚的叙事语体。“蒙了恩”保留希伯来语习语及其文学色彩；句法按现代汉语调整，避免欧化结构。所有脚注标记均置于对应正文之后。
