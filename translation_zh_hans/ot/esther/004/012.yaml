base_translation:
  language: en
  yaml_path: translation/ot/esther/004/012.yaml
  text: And they told Mordecai Esther’s words[a].
translation:
  language: zh_hans
  text: 他们就把以斯帖的话告诉了末底改。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“以斯帖的信息”，或“以斯帖的答复”。
    reason: 词义备选：דִּבְרֵי 在本语境中既可指具体所说的话，也可概括为信息或答复。
lexical_decisions:
- source_word: וַיַּגִּידוּ
  choice: 他们就……告诉了
  rationale: 该词是 נגד 的使役词干叙事形式，承接下一步行动；原文主语为未明确身份的复数，译作“他们”，并以“就”自然体现叙事推进。
- source_word: לְמָרְדֳּכָי
  choice: 告诉了末底改
  rationale: 介词 לְ 标明告知的间接对象；现代汉语用“告诉了末底改”自然表达。人名依通行中文译名作“末底改”。
- source_word: אֵת
  choice: 不单独译出
  rationale: 这是希伯来语直接宾语标记，其语法功能由汉语句法体现。
- source_word: דִּבְרֵי
  choice: 话
  rationale: דָּבָר 的复数构造形式在此可指所说的话、信息或答复。“话”最贴近字面且符合现代汉语表达，并保留对以斯帖言语内容的强调。
- source_word: אֶסְתֵּר
  choice: 以斯帖的
  rationale: 该专名按通行中文译名作“以斯帖”；其与 דִּבְרֵי 的构造关系用“以斯帖的”表达。
theological_decisions: []
translation_notes:
  register: 采用现代、自然而庄重的叙事语言。“他们”保留原文未明确身份的复数主语；“把”字句清楚呈现传话动作，而不增加传话者身份等原文未说明的信息。
