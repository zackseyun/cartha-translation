base_translation:
  language: en
  yaml_path: translation/ot/esther/004/007.yaml
  text: Mordecai told him everything that had happened to him[a], and the exact amount of money that Haman had said he would weigh out into the king’s treasuries for the destruction of the Jews.
translation:
  language: zh_hans
  text: 末底改把他所遭遇的一切，以及哈曼说要为灭绝犹太人而称出、交入王库的银子确数[a]，都告诉了他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“银子的详细说明”或“银子的总数”。希伯来语可指哈曼提出要支付的那笔银子的明确数额或详细说明。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגֶּד
  choice: 告诉了
  rationale: 使役词形在此表示“使知道、告知”；“告诉了”符合现代汉语叙事语体。
- source_word: לוֹ
  choice: 他
  rationale: 按上下文指哈他革；原文只用代词，译文也保留代词。
- source_word: אֵת כָּל אֲשֶׁר קָרָהוּ
  choice: 自己遭遇的一切
  rationale: קָרָה加第三人称单数宾语后缀，直指临到末底改的事；“自己遭遇的一切”明确保留后缀所表达的对象。
- source_word: פָּרָשַׁת הַכֶּסֶף
  choice: 银子确数
  rationale: פָּרָשָׁה可指明确说明、细目或确切数额；结合哈曼提出的款项，此处以“确数”表达特定数额，同时用脚注保留其他可能理解。כֶּסֶף在本语境是按重量支付的银子。
- source_word: אָמַר ... לִשְׁקוֹל
  choice: 说要称出
  rationale: 保留原文“说”与“称量”的具体表达，不将其直接释为“答应支付”。
- source_word: לִשְׁקוֹל
  choice: 称出
  rationale: 古代银子按重量计量；“称出”既自然，也保留具体经济图景。
- source_word: עַל גִּנְזֵי הַמֶּלֶךְ
  choice: 交入王库
  rationale: 该短语表示把款项纳入王的府库；“交入王库”以自然汉语传达存入皇家库藏的方向。
- source_word: ביהודיים לְאַבְּדָם
  choice: 以灭绝犹太人
  rationale: 介词短语与不定式共同表明毁灭行动的对象和目的；“以灭绝犹太人”保留目的关系及行动的严重程度。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“称出”保留银子按重量计量的古代背景；句末“都告诉了他”统摄并列的两项内容。
