base_translation:
  language: en
  yaml_path: translation/ot/esther/004/003.yaml
  text: And in every province[a], wherever the king’s word and his decree reached, there was great mourning among the Jews, with fasting and weeping and lamentation; sackcloth and ashes were spread out for many.
translation:
  language: zh_hans
  text: 在各省，凡王的谕令和法令传到的地方，犹太人都有极大的悲哀，禁食、哭泣、哀号；许多人铺着麻布和灰烬[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“麻布和灰烬为许多人铺开。”原文表达简略，既可能指许多人使用麻布和灰烬，也可能指这些哀悼之物为许多人铺设。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְכָל מְדִינָה וּמְדִינָה
  choice: 在各省
  rationale: 希伯来语以名词重复表达周遍分配，现代汉语用“各省”自然地保留无一例外的范围。
- source_word: מְקוֹם אֲשֶׁר
  choice: 凡……的地方
  rationale: 保留原文随地点展开的分配意味，也与前面的“各省”衔接自然。
- source_word: דְּבַר הַמֶּלֶךְ וְדָתוֹ
  choice: 王的谕令和法令
  rationale: דְּבַר 在此指君王发布的正式话语，译作“谕令”；דָת 指具有法律效力的敕令，译作“法令”，既区分二词又符合波斯宫廷语境。
- source_word: מַגִּיעַ
  choice: 传到
  rationale: 该分词描写王令传播并抵达各地；“传到”比单纯“到达”更符合公文颁行的语境。
- source_word: אֵבֶל גָּדוֹל לַיְּהוּדִים
  choice: 犹太人都大大悲哀
  rationale: אֵבֶל 指面对灾祸的哀痛与举哀；“大大悲哀”保留 גָּדוֹל 的强度，并自然表达这是犹太群体的反应。
- source_word: וְצוֹם וּבְכִי וּמִסְפֵּד
  choice: 禁食、哭泣、哀号
  rationale: 三个并列名词列出悲哀的具体表现；מִסְפֵּד 带有公开哀悼、哀哭的意味，译作“哀号”。
- source_word: שַׂק וָאֵפֶר
  choice: 麻布和炉灰
  rationale: 这是古代哀悼的标志性用品；“麻布和炉灰”在现代中文圣经语体中清楚、庄重。
- source_word: יֻצַּע לָרַבִּים
  choice: 许多人铺着
  rationale: יֻצַּע 本义为“被铺开、铺下”，לָרַבִּים 结构简约，既可理解为许多人使用这些哀悼之物，也可理解为这些东西为许多人铺设。正文采用自然且较可能的施事理解，同时用脚注保留另一种句法可能。
