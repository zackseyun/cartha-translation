  text: וְ/אֶת פַּתְשֶׁ֣גֶן כְּתָֽב הַ֠/דָּת אֲשֶׁר נִתַּ֨ן בְּ/שׁוּשָׁ֤ן לְ/הַשְׁמִידָ/ם֙ נָ֣תַן ל֔/וֹ לְ/הַרְא֥וֹת אֶת אֶסְתֵּ֖ר וּ/לְ/הַגִּ֣יד לָ֑/הּ וּ/לְ/צַוּ֣וֹת עָלֶ֗י/הָ לָ/ב֨וֹא אֶל הַ/מֶּ֧לֶךְ לְ/הִֽתְחַנֶּן ל֛/וֹ וּ/לְ/בַקֵּ֥שׁ מִ/לְּ/פָנָ֖י/ו עַל עַמָּֽ/הּ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/004/008.yaml
  text: He also gave him a copy[a] of the written decree issued in Susa for their destruction, to show it to Esther and explain it to her, and to charge her to go to the king, implore his favor, and plead before him on behalf of her people.
translation:
  language: zh_hans
  text: 末底改又把那份在书珊城颁布、要消灭犹太人的诏令文本[a]交给哈他革，让他拿给以斯帖看，向她说明，并吩咐她去见王，恳求王施恩，在王面前为她的民族求情。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 译作“文本”的波斯语借词，也可以指官方文书的“副本”。
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּתְשֶׁגֶן כְּתָב
  choice: 诏令文本
  rationale: 该波斯语借词可指官方文书的文本或副本；正文采用自然且不武断限定为复制件的“文本”，并以脚注保留“副本”的可能。
- source_word: הַדָּת
  choice: 诏令
  rationale: 在《以斯帖记》的波斯宫廷语境中，此词指官方颁行的命令；“诏令”比宽泛的“律法”更贴切。
- source_word: נִתַּן בְּשׁוּשָׁן
  choice: 在书珊城颁布
  rationale: 行政语境中的被动“被给予”表示命令获颁行；译作“颁布”符合现代汉语。
- source_word: לְהַשְׁמִידָם
  choice: 要消灭犹太人
  rationale: 不定式带复数后缀表达诏令的目的；根据上下文明确后缀所指，同时保留彻底毁灭的强烈含义。
- source_word: נָתַן לוֹ
  choice: 交给哈他革
  rationale: 代词所指由上下文明晰；在独立经节中写出姓名，便于普通读者理解。
- source_word: לְהַרְאוֹת אֶת אֶסְתֵּר וּלְהַגִּיד לָהּ
  choice: 要他拿给以斯帖看，向她说明
  rationale: 希伯来文先说展示文书，再说告知她；“说明”自然表达使她明白诏令内容，而不增加新的命题。
- source_word: וּלְצַוּוֹת עָלֶיהָ
  choice: 并嘱咐她
  rationale: צוה具有明确吩咐的力度；“嘱咐”兼顾末底改的迫切指示与现代汉语中人物关系的自然语气。
- source_word: לָבוֹא אֶל הַמֶּלֶךְ
  choice: 去见王
  rationale: 表达进入王面前的行动；“去见王”简洁自然，危险的宫廷背景由上下文呈现。
- source_word: לְהִתְחַנֶּן לוֹ
  choice: 恳求王施恩
  rationale: התפעל词形表达迫切求恩；译文同时保留恳求的强度和 חנן 的恩惠语义。
- source_word: וּלְבַקֵּשׁ מִלְּפָנָיו עַל עַמָּהּ
  choice: 在王面前为自己的民族求情
  rationale: “从他面前寻求”是宫廷请愿用语；汉语用“在王面前……求情”既保留临王陈情的场景，也清楚表达为本族代求。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“诏令”“施恩”“求情”保留波斯宫廷和迫切请愿的语域；避免生硬直译“从王面前寻求”。所有代词均按上下文适度明示，以利独立阅读。
