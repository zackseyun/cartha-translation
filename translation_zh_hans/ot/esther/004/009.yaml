base_translation:
  language: en
  yaml_path: translation/ot/esther/004/009.yaml
  text: So Hathach came and told Esther the words of Mordecai[a].
translation:
  language: zh_hans
  text: 于是，哈他革回来，把末底改的话[a]告诉了以斯帖。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“末底改的信息”，或“末底改所说的话”。希伯来文直译为“末底改的话”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: 回来
  rationale: בוא可表示“来、去、到达”。结合上下文，哈他革先去见末底改，现在回到以斯帖那里；译作“回来”自然呈现叙事视角。
- source_word: הֲתָךְ
  choice: 哈他革
  rationale: 人名按现代中文圣经常用音译处理。
- source_word: וַיַּגֵּד
  choice: 告诉了
  rationale: נגד的使役形在此意为“使人知道、告诉、报告”；“告诉了”符合简洁的叙事语体。
- source_word: לְאֶסְתֵּר
  choice: 以斯帖
  rationale: 介词לְ标明告知的对象，中文用“告诉了以斯帖”自然表达。
- source_word: אֵת
  choice: 不单独译出
  rationale: 这是直接宾语标记，在中文中由语序体现，无须另译。
- source_word: דִּבְרֵי
  choice: ……的话
  rationale: דָּבָר的复数构造形式，字面为“……的话语”；中文“末底改的话”既贴近原文，也自然通顺。
- source_word: מָרְדֳּכָי
  choice: 末底改
  rationale: 采用现代中文圣经中通行的人名音译。
