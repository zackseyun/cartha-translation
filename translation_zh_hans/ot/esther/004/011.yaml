source:
  edition: WLC
  text: כָּל עַבְדֵ֣י הַ/מֶּ֡לֶךְ וְ/עַם מְדִינ֨וֹת הַ/מֶּ֜לֶךְ יֽוֹדְעִ֗ים אֲשֶׁ֣ר כָּל אִ֣ישׁ וְ/אִשָּׁ֡ה אֲשֶׁ֣ר יָבֽוֹא אֶל הַ/מֶּלֶךְ֩ אֶל הֶ/חָצֵ֨ר הַ/פְּנִימִ֜ית אֲשֶׁ֣ר לֹֽא יִקָּרֵ֗א אַחַ֤ת דָּת/וֹ֙ לְ/הָמִ֔ית לְ֠/בַד מֵ/אֲשֶׁ֨ר יֽוֹשִׁיט ל֥/וֹ הַ/מֶּ֛לֶךְ אֶת שַׁרְבִ֥יט הַ/זָּהָ֖ב וְ/חָיָ֑ה וַ/אֲנִ֗י לֹ֤א נִקְרֵ֨אתי֙ לָ/ב֣וֹא אֶל הַ/מֶּ֔לֶךְ זֶ֖ה שְׁלוֹשִׁ֥ים יֽוֹם־־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/004/011.yaml
  text: 'All the king’s servants and the people of the king’s provinces know that for any man or woman who goes to the king in the inner court without being summoned[a], there is one law for him: to be put to death, except for the one to whom the king extends the golden scepter, so that he may live. But as for me[b], I have not been summoned to go in to the king these thirty days.'
translation:
  language: zh_hans
  text: 王的所有臣仆和王各省的百姓都知道：任何人，无论男女，若未奉召[a]而进入内院去见王，只有一条法令[b]：处死；惟有王向那人伸出金杖，他才能存活。至于我，已经三十天没有奉召进去见王了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“没有被召见”。原文使用被动形式，所指的是未经王正式召见。
    reason: lexical_alternative
  - marker: b
    text: 原文直译近于“他的法令只有一条”，意思是这种情形只有一个固定的法律处置。
    reason: idiom_clarification
lexical_decisions:
- source_word: עַבְדֵי
  choice: 臣仆
  rationale: 在波斯宫廷语境中，此词泛指服事王的人；“臣仆”兼顾臣属身份与宫廷语体，又不武断地译成“奴隶”或仅限于“官员”。
- source_word: וְעַם מְדִינוֹת הַמֶּלֶךְ
  choice: 和王各省的百姓
  rationale: “各省”准确表达帝国的行政区划，“百姓”则把范围从宫廷人员扩展到各省民众。
- source_word: כָּל אִישׁ וְאִשָּׁה
  choice: 任何人，无论男女
  rationale: 保留原文明确提到男女双方的表达，同时符合现代汉语习惯。
- source_word: יָבוֹא אֶל הַמֶּלֶךְ אֶל הֶחָצֵר הַפְּנִימִית
  choice: 进入内院到王面前
  rationale: 原文既表达进入受限制的内院，也表达趋近王本人；此译保留两个空间与行动要素。
- source_word: אֲשֶׁר לֹא יִקָּרֵא
  choice: 没有奉召
  rationale: 被动式在这里指未经正式召见；“奉召”简洁而自然地体现宫廷规制。
- source_word: אַחַת דָּתוֹ
  choice: 只有一条法令
  rationale: 保留原文“一条法令”的习语形态，并由下文“处死”说明其固定结果，不把两者过度合并。
- source_word: לְהָמִית
  choice: 处死
  rationale: 该不定式表示依法施加的死刑，而不只是自然死亡；“处死”直接体现法律处罚。
- source_word: לְבַד מֵאֲשֶׁר
  choice: 惟有
  rationale: 清楚标明下文是该死刑规定的唯一例外。
- source_word: יוֹשִׁיט לוֹ הַמֶּלֶךְ אֶת שַׁרְבִיט הַזָּהָב
  choice: 王向他伸出金杖
  rationale: 准确呈现王把金杖伸向来人的动作，并保留“金杖”这一王权与恩准的具体标志。
- source_word: וְחָיָה
  choice: 他才可存活
  rationale: 表达王伸杖之后得以免死的结果；“才”也凸显这一例外条件。
- source_word: זֶה שְׁלוֹשִׁים יוֹם
  choice: 已经三十天
  rationale: 原文强调截至说话时已有三十天；“已经”自然传达这段持续至今的时间。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而清楚的叙事语体。“臣仆”“奉召”“法令”“金杖”保留宫廷氛围，但避免过度古雅。校正了咨询层中脚注[b]标记位置与脚注内容不相符的问题，将其置于“只有一条法令”之后。
