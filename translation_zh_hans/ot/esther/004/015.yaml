  text: 于是，以斯帖吩咐人回话给末底改：[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译：“以斯帖说，要回复给末底改。”这里的表达意为她吩咐人把答复传回给他。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: 于是……吩咐
  rationale: 未完成式连续体推进叙事；“于是”自然表达先后关系。结合后面的使役不定式，译作“吩咐”比单纯的“说”更符合汉语表达。
- source_word: אֶסְתֵּר
  choice: 以斯帖
  rationale: 采用现代中文圣经传统中通行的人名音译。
- source_word: לְהָשִׁיב
  choice: 回复
  rationale: שׁוב 的使役式不定词在此表达使答复返回，即托人回话。“回复”简洁自然，并保留回应前讯息的含义；为明确使者并非以斯帖本人，按汉语习惯补出“人”。
- source_word: אֶל
  choice: 给
  rationale: 该介词标明回应所朝向的对象；与“回复”搭配时，“给”是自然的现代汉语表达。
- source_word: מָרְדֳּכָי
  choice: 末底改
  rationale: 采用现代中文圣经传统中通行的人名音译。
