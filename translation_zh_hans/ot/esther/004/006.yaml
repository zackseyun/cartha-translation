base_translation:
  language: en
  yaml_path: translation/ot/esther/004/006.yaml
  text: So Hathach went out to Mordecai[a], to the open square of the city that was in front of the king's gate.
translation:
  language: zh_hans
  text: 于是，哈他革出去见末底改，来到王门前的城中广场。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: 出去
  rationale: 该动词叙述一个已经发生的动作，并保留从以斯帖所在之处出去的方向含义。
- source_word: הֲתָךְ
  choice: 哈他革
  rationale: 按现代中文圣经人名的通行译法音译。
- source_word: אֶל מָרְדֳּכָי
  choice: 去见末底改
  rationale: 介词 אֶל 表示趋向；结合人物奉命传话的叙事语境，“去见”比生硬的“到末底改那里”更自然，同时不改变原意。
- source_word: אֶל רְחוֹב הָעִיר
  choice: 来到城中广场
  rationale: רְחוֹב 在这里指城内宽阔的公共开放空间，而非现代意义上的街道；“城中广场”简洁自然。
- source_word: אֲשֶׁר לִפְנֵי
  choice: 王门前的
  rationale: 将希伯来语关系从句自然地转为中文定语结构，准确表达空间位置。
- source_word: שַׁעַר הַמֶּלֶךְ
  choice: 王门
  rationale: 这是《以斯帖记》中反复出现的王宫入口或附属门区；“王门”符合中文圣经传统且简练。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。原文连续两次使用 אֶל，分别指向人物和地点；中文以“出去见……，来到……”清楚呈现行动对象与所在地点，避免误读为两个彼此独立的目的地。רְחוֹב 明译为“广场”，无需脚注。
