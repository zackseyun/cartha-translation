id: EST.4.14
reference: Esther 4:14
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּ֣י אִם הַחֲרֵ֣שׁ תַּחֲרִישִׁי֮ בָּ/עֵ֣ת הַ/זֹּאת֒ רֶ֣וַח וְ/הַצָּלָ֞ה יַעֲמ֤וֹד לַ/יְּהוּדִים֙ מִ/מָּק֣וֹם אַחֵ֔ר וְ/אַ֥תְּ וּ/בֵית אָבִ֖י/ךְ תֹּאבֵ֑דוּ וּ/מִ֣י יוֹדֵ֔עַ אִם לְ/עֵ֣ת כָּ/זֹ֔את הִגַּ֖עַתְּ לַ/מַּלְכֽוּת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/004/014.yaml
  text: For if you remain silent at this time, relief and deliverance will arise for the Jews from another place, but you and your father's house will perish. And who knows whether you have come to your royal position for a time like this?
translation:
  language: zh_hans
  text: 因为你若在此时一直沉默，必有喘息和拯救从别处临到犹太人；你和你父家却必灭亡。谁知道呢？也许你正是为了这样的时刻才登上王后之位。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “王后之位”原文意为“王权”或“王室地位”；这里按以斯帖的身份表达。
    reason: 说明 לַמַּלְכוּת 的较宽语义范围，并交代正文为何依上下文译作“王后之位”，而不暗示以斯帖成为君王。
lexical_decisions:
- source_word: כִּי אִם
  choice: 因为你若
  rationale: 兼顾 כִּי 的解释作用和 אִם 的条件意义，并自然承接上文。
- source_word: הַחֲרֵשׁ תַּחֲרִישִׁי
  choice: 一直沉默
  rationale: 用“一直”体现不定式绝对式对同根动词的加强，表达在当前危机中持续不发声。
- source_word: בָּעֵת הַזֹּאת
  choice: 在此时
  rationale: 简洁保留当前危急时刻的时间指向。
- source_word: רֶוַח וְהַצָּלָה
  choice: 喘息和拯救
  rationale: “喘息”保留 רֶוַח 所含获得宽舒、缓解的形象，“拯救”准确表达脱离灭族危险，且不额外引入专门的救恩术语。
- source_word: יַעֲמוֹד
  choice: 必……得着
  rationale: 此处 עמד 表示援助将兴起、出现；汉语以“得着”与“喘息和拯救”搭配更自然，同时保留结果将会出现的语义。
- source_word: לַיְּהוּדִים
  choice: 犹太人
  rationale: 在《以斯帖记》的波斯侨居背景中，指犹太群体；采用现代汉语通行称呼。
- source_word: מִמָּקוֹם אַחֵר
  choice: 从别处
  rationale: 保留来源不明的间接措辞，不把隐含的帮助来源明说为上帝。
- source_word: וְאַתְּ וּבֵית אָבִיךְ
  choice: 你和你父家
  rationale: “父家”保留希伯来亲属与家族单位的表达，也符合庄重而可懂的圣经汉语。
- source_word: תֹּאבֵדוּ
  choice: 必灭亡
  rationale: אבד 可涵盖死亡和毁灭；“灭亡”保留警告的广度与严肃性。
- source_word: וּמִי יוֹדֵעַ
  choice: 谁知道呢
  rationale: 保留修辞性的开放语气，不将可能性改写为确定断言。
- source_word: אִם לְעֵת כָּזֹאת
  choice: 也许……正是为了这样的时刻
  rationale: 这里的 אִם 在“谁知道”之后引出不确定的可能性；“也许”符合现代汉语习惯，同时“为了”表达 לְ 可能具有的目的意味。
- source_word: הִגַּעַתְּ לַמַּלְכוּת
  choice: 登上王后之位
  rationale: 直译为“到达王权/王位”；按以斯帖的身份译作“登上王后之位”，比“获得王权”自然，并避免暗示她成为统治全境的君王。
theological_decisions:
- issue: “从别处”与“为了这样的时刻”所暗示的神圣护理
  choice: 正文保持间接表达，不明确补出“上帝”
  alternative: 将“别处”解释为上帝，或译成“上帝使你为此时成为王后”
  rationale: 经文强烈容许护理性的理解，却没有明说上帝；译文应保存这种含蓄与张力。
- issue: 末句是确定目的还是开放的可能性
  choice: 译作“谁知道呢？也许……”
  alternative: 译作“你正是为了这样的时刻……”
  rationale: וּמִי יוֹדֵעַ אִם 保持认识上的不确定；不可把末句提升为无保留的确定宣告。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“喘息和拯救”略带经文庄严感，同时保留两个并列名词的区别；“父家”保留希伯来家族概念。正文中的脚注标记与脚注条目一致。
