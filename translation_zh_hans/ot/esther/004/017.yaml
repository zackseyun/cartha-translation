lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: 离去
  rationale: עבר本义为“经过、越过”，此处叙事语境中指末底改离开并着手执行以斯帖的指示；“离去”自然且不过度具体化。
- source_word: וַיַּעַשׂ
  choice: 去做了
  rationale: עשה是常用的“做、行”；结合后面的遵照结构，“去做了”保持简洁，并清楚表达他付诸行动。
- source_word: כְּכֹל אֲשֶׁר
  choice: 照……的一切
  rationale: 保留כְּ的遵照含义和כֹל的全面范围，表达末底改完全依照以斯帖的吩咐行事。
- source_word: צִוְּתָה
  choice: 吩咐
  rationale: צוה意为“命令、吩咐”；在此人物对话与叙事中，“吩咐”既保留权威性，也比“命令”更符合自然现代汉语。
- source_word: עָלָיו
  choice: 他
  rationale: על与צוה连用时标示受命者，现代汉语宜直接作“吩咐他”。
- source_word: אֶסְתֵּר
  choice: 以斯帖
  rationale: 采用中文圣经传统中通行且易识别的人名译法。
- source_word: מָרְדֳּכָי
  choice: 末底改
  rationale: 采用中文圣经传统中通行且易识别的人名译法。
