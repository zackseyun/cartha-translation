id: EST.4.16
reference: Esther 4:16
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: לֵךְ֩ כְּנ֨וֹס אֶת כָּל הַ/יְּהוּדִ֜ים הַֽ/נִּמְצְאִ֣ים בְּ/שׁוּשָׁ֗ן וְ/צ֣וּמוּ עָ֠לַ/י וְ/אַל תֹּאכְל֨וּ וְ/אַל תִּשְׁתּ֜וּ שְׁלֹ֤שֶׁת יָמִים֙ לַ֣יְלָה וָ/י֔וֹם גַּם אֲנִ֥י וְ/נַעֲרֹתַ֖/י אָצ֣וּם כֵּ֑ן וּ/בְ/כֵ֞ן אָב֤וֹא אֶל הַ/מֶּ֨לֶךְ֙ אֲשֶׁ֣ר לֹֽא כַ/דָּ֔ת וְ/כַ/אֲשֶׁ֥ר אָבַ֖דְתִּי אָבָֽדְתִּי־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/004/016.yaml
  text: Go[a], gather all the Jews who are found in Susa, and fast for me. Do not eat or drink for three days[b], night and day. I and my young women also will fast in the same way. Then I will go to the king, though it is not according to the law; and if I perish[e][d][c], I perish.
translation:
  language: zh_hans
  text: “你去，把所有在书珊的犹太人都召集起来，为我禁食[a]。三天三夜，不要吃也不要喝。我和我的侍女[b]也要照样禁食。之后，我要去见王，尽管这不合律法[c]。我若死，就死吧！[d]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “为我”也可译作“为我的事”或“为我的缘故”。
    reason: 介词 עַל 表示禁食所关涉的对象或事情，汉语可有数种自然表达。
  - marker: b
    text: “侍女”原文也可指“年轻女子”或“女侍从”。
    reason: נַעֲרוֹת 的词义范围包括年轻女子及女性仆役，具体身份由宫廷语境限定。
  - marker: c
    text: “不合律法”也可译作“违反律法”。
    reason: לֹא כַדָּת 直指“不按照法令”；两种译法分别侧重不符合规定和违背规定。
  - marker: d
    text: “我若死，就死吧”也可理解为“我死的时候，就死吧”。原文措辞简短而有力，表达以斯帖甘愿承担丧命的风险。
    reason: כַאֲשֶׁר 的语义及重复句式容许条件或时间色彩，不宜在正文中彻底消除这种张力。
lexical_decisions:
- source_word: לֵךְ כְּנוֹס
  choice: 你去，把……都召集起来
  rationale: 两个命令语气连续出现；译为自然有力的现代汉语命令句，并保留“去”和“召集”两个动作。
- source_word: כָּל הַיְּהוּדִים הַנִּמְצְאִים בְּשׁוּשָׁן
  choice: 所有在书珊的犹太人
  rationale: הַנִּמְצְאִים 在这里表示“在场、身处某地”；汉语直接说“在书珊的”最自然，也保留了“所有”的周全范围。
- source_word: וְצוּמוּ עָלַי
  choice: 为我禁食
  rationale: 介词 עַל 表示禁食与以斯帖及其处境有关；“为我”简洁自然，同时以脚注保留“为我的事”的可能表达。
- source_word: וְאַל תֹּאכְלוּ וְאַל תִּשְׁתּוּ שְׁלֹשֶׁת יָמִים לַיְלָה וָיוֹם
  choice: 三天之内，昼夜都不要吃喝
  rationale: 保留三天及昼夜持续禁食的强调；汉语合并重复的否定词，以“不要吃喝”清楚表达两项禁令。
- source_word: נַעֲרֹתַי
  choice: 我的侍女
  rationale: 该词在宫廷语境中可指随侍以斯帖的年轻女子或女仆；“侍女”既符合语境，又比单译“年轻女子”更能体现从属侍奉关系。
- source_word: אָצוּם כֵּן
  choice: 也要照样禁食
  rationale: כֵּן 回指前述禁食的方式和时段；“照样”自然保留这一回指。
- source_word: וּבְכֵן
  choice: 之后
  rationale: 该连接语表示在上述禁食之后采取下一步行动；“之后”清楚呈现叙事次序，而不额外强化因果。
- source_word: אָבוֹא אֶל הַמֶּלֶךְ
  choice: 我要去见王
  rationale: בוא אֶל 在此指前往并接近王；“去见王”是符合现代汉语及宫廷场景的自然说法。
- source_word: אֲשֶׁר לֹא כַדָּת
  choice: 尽管这不合律法
  rationale: 原文从句说明擅自见王不符合既定法令；按语境译出让步关系，但不增加原文没有说明的处罚细节。
- source_word: וְכַאֲשֶׁר אָבַדְתִּי אָבָדְתִּי
  choice: 我若死，就死吧
  rationale: 原文简短而强调，以重复的 אָבד 表达接受可能丧命的后果；此译保留决绝语气，同时用脚注说明连接词所容许的另一种理解。
theological_decisions:
- issue: 禁食是否明确包含向上帝祷告
  choice: 只译“禁食”，不补入“祷告”或上帝的名字
  alternative: 译作“禁食祷告”或“向上帝禁食祈求”
  rationale: 本节希伯来文本只明说禁食，并未出现“祷告”或上帝的称谓；不应把合理的宗教含义写成明示内容。
- issue: 以斯帖末句表达的是条件还是确定结局
  choice: 正文采用汉语惯用的条件式“我若死，就死吧”，脚注保留另一理解
  alternative: 译作“我死的时候，就死吧”或“我必死，就死吧”
  rationale: כַאֲשֶׁר 可按语境表达“若、当、照着”；原句刻意简短，重点是接受风险，不宜把死亡解释为必然或仅为可能而完全排除另一面。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。命令句简洁坚定；“昼夜都不要吃喝”清楚传达禁食的连续性；末句用现代读者熟悉的“我若死，就死吧”呈现以斯帖决绝而克制的语气。专名采用中文圣经传统通行形式“书珊”。
