base_translation:
  language: en
  yaml_path: translation/ot/esther/004/004.yaml
  text: Esther’s young women and her eunuchs came and told her[a], and the queen was greatly distressed. She sent garments to clothe Mordecai and to remove his sackcloth from him[c][b], but he did not accept them.
translation:
  language: zh_hans
  text: 以斯帖的年轻侍女[a]和太监[b]来把这事告诉她，王后就极其不安。她送衣服给末底改穿，好让他脱下身上的麻衣[c]，他却不肯接受。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “年轻侍女”也可译作“女侍从”。
    reason: lexical_alternative
  - marker: b
    text: “太监”一词在某些语境中也可泛指王宫官员，但在《以斯帖记》的王宫背景下，更可能指太监。
    reason: cultural_note
  - marker: c
    text: 麻衣是粗糙的衣服，人常穿麻衣表示哀悼、悲痛或受辱。
    reason: cultural_note
lexical_decisions:
- source_word: נַעֲרוֹת
  choice: 年轻侍女
  rationale: 该词本义为年轻女子；在王宫语境中指服侍以斯帖的女子。“年轻侍女”兼顾词义与其宫廷身份。
- source_word: וְסָרִיסֶיהָ
  choice: 和太监
  rationale: סָרִיס在王室语境中通常指太监，虽也可泛指宫廷官员；此处采用较具体、符合波斯宫廷背景的译法。
- source_word: וַיַּגִּידוּ לָהּ
  choice: 来把这事告诉她
  rationale: 保留叙事中“来到”与“禀告”两个动作；“这事”承接上文，使中文表达完整自然。
- source_word: וַתִּתְחַלְחַל ... מְאֹד
  choice: 就极其不安
  rationale: 动词表示强烈的震动、战栗或惊惶；“极其不安”自然表达王后内心受到的强烈冲击，同时避免把含义限定为身体发抖。
- source_word: בְּגָדִים
  choice: 衣服
  rationale: 现代汉语中清楚自然，也符合使末底改换下麻衣的具体语境。
- source_word: לְהַלְבִּישׁ אֶת מָרְדֳּכַי
  choice: 给末底改穿
  rationale: 表达送衣服的目的，既贴近使役含义，又符合现代汉语习惯。
- source_word: וּלְהָסִיר שַׂקּוֹ מֵעָלָיו
  choice: 好脱下他身上的麻衣
  rationale: 保留脱去身上麻衣这一具体动作，并以“好”自然连接两个目的。
- source_word: שַׂקּוֹ
  choice: 他身上的麻衣
  rationale: שַׂק指哀悼时所穿的粗布衣。“麻衣”是中文圣经语境中准确而简洁的对应词，文化含义另以脚注说明。
- source_word: וְלֹא קִבֵּל
  choice: 他却不肯接受
  rationale: 希伯来文未明说宾语，语境指所送的衣服；“不肯接受”准确传达拒绝之意。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而通顺的叙事语言。“年轻侍女”避免古旧的“婢女”，“太监”和“麻衣”保留王宫及哀悼习俗的具体文化色彩。主句用“王后”照应原文正式称号；末句用“却”突出末底改的拒绝。
