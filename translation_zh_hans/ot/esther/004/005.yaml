base_translation:
  language: en
  yaml_path: translation/ot/esther/004/005.yaml
  text: Then Esther called for Hathach[a], one of the king’s eunuchs, whom he had appointed to attend her, and commanded him concerning Mordecai, to learn what this was and why it was.
translation:
  language: zh_hans
  text: 于是，以斯帖召来哈他革[a]，他是王派来服侍她的一个太监；以斯帖吩咐他，为末底改的事查明这是怎么回事，又是为了什么。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “太监”也可译作“宫廷官员”。希伯来语这个词可以特指太监，在某些语境中也可泛指王室官员。
    reason: 保留סָרִיס在王宫语境中的词义范围。
lexical_decisions:
- source_word: וַתִּקְרָא
  choice: 于是……召来
  rationale: 未完成式连续体推进叙事；“于是”自然承接上文，“召来”表达以斯帖叫人到跟前来的意思。
- source_word: לַהֲתָךְ
  choice: 哈他革
  rationale: 按希伯来语人名音译，并采用现代中文圣经读者较熟悉的译名。
- source_word: מִסָּרִיסֵי הַמֶּלֶךְ
  choice: 王的一个太监
  rationale: סָרִיס在王宫语境中通常指太监；因该词有时也可泛指宫廷官员，另以脚注保留这一词义可能。
- source_word: אֲשֶׁר הֶעֱמִיד לְפָנֶיהָ
  choice: 王派他侍候以斯帖
  rationale: הֶעֱמִיד的主语最自然地承接“王”；“派他侍候”以自然中文表达被安排在她面前供职、随侍的宫廷职责。明确复称“以斯帖”，避免中文代词可能误指王。
- source_word: וַתְּצַוֵּהוּ עַל מָרְדֳּכָי
  choice: 以斯帖吩咐他去见末底改
  rationale: צוה保留命令、交代之力；עַל מָרְדֳּכָי表示使命涉及末底改。结合下文询问目的，“去见末底改”是合乎语境的中文表达，但不额外说明所问内容。
- source_word: לָדַעַת
  choice: 查明
  rationale: 这是表示目的的不定式；“查明”自然表达奉命询问并弄清情况。
- source_word: מַה זֶּה וְעַל מַה זֶּה
  choice: 这是怎么回事，又是为了什么
  rationale: 前一问询问事情是什么，后一问询问缘由。中文用成对问句保留两者的区别，也避免生硬直译为“这是什么，在什么之上这是”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事中文。“于是”推进情节；分为两句以避免过长结构。“怎么回事，又是为了什么”自然保留希伯来语两个相连但侧重点不同的问题。
