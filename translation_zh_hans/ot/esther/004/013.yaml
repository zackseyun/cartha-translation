review_pass:
  verdict: revise
  source_fidelity: 原文说末底改吩咐人回复以斯帖，警告她不要因身在王宫而设想自己能从全体犹太人的灾祸中单独逃脱。修订保留了使役传话、内心设想、王宫处境和“相对于所有犹太人”的限定；“独自逃脱”以自然汉语表达原文在此略紧缩、可带比较或区别色彩的结构，未加入额外神学解释。
  naturalness: 原译“不要心想”缺少现代汉语中常见的宾语结构，末尾“成为所有犹太人中唯一幸免的”也形成悬置的“的”，读来不完整。改为“不要以为……就能……独自逃脱”更流畅、庄重且清楚。
  terminology: “末底改”“以斯帖”“王宫”“犹太人”均恰当并与通行圣经汉语名称相符。“逃脱”准确对应原文的不定式。
