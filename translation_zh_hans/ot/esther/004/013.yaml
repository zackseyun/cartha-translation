base_translation:
  language: en
  yaml_path: translation/ot/esther/004/013.yaml
  text: Then Mordecai said to reply to Esther, “Do not imagine that you alone of all the Jews will escape in the king’s house.
translation:
  language: zh_hans
  text: 末底改叫人回复以斯帖：“不要以为你在王宫里，就能在所有犹太人中独自逃脱。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר מָרְדֳּכַי לְהָשִׁיב אֶל־אֶסְתֵּר
  choice: 末底改叫人回复以斯帖
  rationale: 希伯来语直译近于“末底改说，要回复以斯帖”；结合上文由使者传话的情境，用“叫人回复”自然表达使役含义，同时不在正文增添人名。
- source_word: אַל־תְּדַמִּי בְנַפְשֵׁךְ
  choice: 不要心想
  rationale: 保留“在自己心里设想”的内在心理含义，以现代汉语简洁表达。
- source_word: לְהִמָּלֵט
  choice: 能逃脱
  rationale: 该不定式表示逃脱、幸免于难；“逃脱”贴近原词，并由语境显出所逃避的是灭族之祸。
- source_word: בֵּית הַמֶּלֶךְ
  choice: 在王宫里
  rationale: 字面为“王的家/宫室”，此处指王宫及王室处境；“王宫”是自然准确的现代汉语。
- source_word: מִכָּל־הַיְּהוּדִים
  choice: 成为所有犹太人中唯一幸免的
  rationale: 介词מִן带有比较或区别含义。此处不是说她比所有犹太人更容易逃脱，而是警告她不可认为自己会从全体犹太人的命运中被单独豁免；此译明确传达语境中的对比。
theological_decisions:
- issue: 以斯帖是否因身处王宫而可独自免祸
  choice: 表达为她不可设想自己会成为犹太人中唯一幸免者
  alternative: “不要以为你在王宫里比所有犹太人更能逃脱”
  rationale: 原文比较结构可以较直译地处理，但上下文重点是以斯帖不能因王后身份而与本族命运分离。所选译法贴合语用意义，且不引入关于神意或结局的额外说明。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“心想”保留原文内在判断的意味；“唯一幸免”使原文略显紧缩的比较结构在中文中清楚可懂。
