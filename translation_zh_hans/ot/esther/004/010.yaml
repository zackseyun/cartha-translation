  text: Then Esther spoke to Hathach and commanded him to go to Mordecai[a].
translation:
  language: zh_hans
  text: 于是，以斯帖对哈他革说，吩咐他去见末底改[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“于是，以斯帖对哈他革说，吩咐他到末底改。”希伯来文在“吩咐他”后直接接“到末底改”；语境表明她吩咐哈他革去见末底改。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: 于是……说话
  rationale: 叙事性的连接形式推进情节，译作“于是”；אמר通常指“说”，结合介词宾语，译作“对……说话”自然承接下文的吩咐。
- source_word: אֶסְתֵּר
  choice: 以斯帖
  rationale: 采用现代中文圣经中通行的人名音译。
- source_word: לַהֲתָךְ
  choice: 对哈他革
  rationale: 介词ל标示说话的对象；人名按通行形式音译为“哈他革”。
- source_word: וַתְּצַוֵּהוּ
  choice: 吩咐他
  rationale: צוה的加强词干表示下达命令或指示；“吩咐”既保留权威语气，也符合现代汉语叙事表达。代词后缀“他”指哈他革。
- source_word: אֶל
  choice: 去见
  rationale: אֶל本义为“到、向”；在“吩咐他”之后，希伯来语省略了动作内容，中文补出“去见”以明确方向和交谈对象，同时用脚注保留原文简略结构。
- source_word: מָרְדֳּכָי
  choice: 末底改
  rationale: 采用现代中文圣经中通行的人名音译。
