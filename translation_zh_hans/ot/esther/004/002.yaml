base_translation:
  language: en
  yaml_path: translation/ot/esther/004/002.yaml
  text: He came as far as the front of the king’s gate[b][a], because no one could enter the king’s gate clothed in sackcloth.
translation:
  language: zh_hans
  text: 他来到王门前[a]，因为穿着粗麻布衣服的人不得进入王门。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译可作：“他来到王门前为止。”这里强调他所到的界限是在王门前，并未进去。
    reason: lexical_alternative
  - marker: b
    text: 本句也可较直译为：“因为穿着粗麻布衣服不可进入王门。”这里表达的意思是，穿哀服的人不准入内。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: 他来到
  rationale: בוא的叙事形式表示末底改向王门移动并抵达近前；“来到”符合现代汉语叙事表达。
- source_word: עַד לִפְנֵי
  choice: 王门前
  rationale: עַד标明所到的界限，לִפְנֵי表示在……前面；结合下句的禁入原因，“来到王门前”自然表达他只到门前而未进入。脚注保留更显明的界限语气。
- source_word: שַׁעַר הַמֶּלֶךְ
  choice: 王门
  rationale: 该构造短语指王宫或王廷的门；“王门”简洁、庄重，并与《以斯帖记》的宫廷场景相符。
- source_word: כִּי אֵין לָבוֹא
  choice: 因为……不得进入
  rationale: אֵין加不定式在此语境中表达禁止或不准许，而非单纯能力不足；“不得进入”准确传达实际禁令，同时不另加经文未明说的施令者。
- source_word: אֶל שַׁעַר הַמֶּלֶךְ
  choice: 进入王门
  rationale: אֶל本可表示“到、向、进入”；上下文说明末底改停在门前，故此处用“进入”体现进入门内或门区的意思。
- source_word: בִּלְבוּשׁ שָׂק
  choice: 穿着麻衣的人
  rationale: 原文直译为“穿着麻布衣服”；“麻衣”是现代中文圣经语域中自然且清楚的哀悼服饰称谓。为配合אֵין לָבוֹא的非人称结构，译成“穿着麻衣的人不得进入”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“王门”保持宫廷语境的简洁称谓；“麻衣”沿用普通读者熟悉的哀悼服饰用语。脚注分别说明עַד לִפְנֵי的界限含义及אֵין לָבוֹא较非人称、形式对应的译法。
