base_translation:
  language: en
  yaml_path: translation/ot/esther/004/001.yaml
  text: When Mordecai learned all that had been done[a], Mordecai tore his clothes and put on sackcloth and ashes. Then he went out into the midst of the city and cried out with a great and bitter cry.
translation:
  language: zh_hans
  text: 末底改得知所发生的一切，就撕裂衣服，披上麻衣，蒙上灰。他走到城中，发出又大又凄苦的哀号[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“喊出一个又大又苦的喊声。”希伯来语用同根的动词和名词加强语气。
    reason: 说明原文的同根词强调结构，并保留较为直译的表达。
lexical_decisions:
- source_word: יָדַע
  choice: 得知
  rationale: 此处表示末底改获悉诏令及相关事件；“得知”自然表达进入知情状态，而不只是静态的“知道”。
- source_word: כָּל אֲשֶׁר נַעֲשָׂה
  choice: 所发生的一切
  rationale: 希伯来语是被动结构，既可理解为“所做的一切”，也可按叙事语境自然表达为“所发生的一切”；后者在现代汉语中更顺畅，并未限定具体施事者。
- source_word: וַיִּקְרַע ... אֶת בְּגָדָיו
  choice: 撕裂衣服
  rationale: 直接表达古代哀悼时撕衣的举动，清楚、庄重，不采用古雅而较难懂的措辞。
- source_word: שַׂק וָאֵפֶר
  choice: 披上麻衣，蒙上灰尘
  rationale: 将哀悼和自卑的两个外在标志具体呈现；“披麻蒙灰”虽简练，但“披上……蒙上……”更符合现代叙述语体。
- source_word: בְּתוֹךְ הָעִיר
  choice: 走到城中
  rationale: 保留 בְּתוֹךְ 的空间意义，不把它过度具体化为现代意义的“市中心”。
- source_word: וַיִּזְעַק זְעָקָה גְדֹלָה וּמָרָה
  choice: 发出又大又凄苦的哀号
  rationale: 以“哀号”传达动词与同根名词所强调的高声呼喊；“又大又凄苦”保留 גְדֹלָה 与 מָרָה 的双重修饰及强烈情感。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“麻衣”和“灰尘”保留古代哀悼习俗的文化形象；避免把“城中”解释成现代城市的中心区域。
