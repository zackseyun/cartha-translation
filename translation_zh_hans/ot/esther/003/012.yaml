revisions:
- from: 正月十三日，王的书记官被召来，照着哈曼所吩咐的一切拟写文书，传给王的各位总督、各省的省长和各族的官长；各省采用本省的文字[a]，各族采用本族的语言。文书奉亚哈随鲁王的名写成，并盖上王的印戒。
  to: 第一月十三日，王的书记官被召来；他们就照哈曼所吩咐的一切，写信给王的各位总督、管辖各省的省长，以及各族的官长；给每一省的文书都按该省的文字[a]书写，给每一族的文书都按该族的语言书写。这些文书奉亚哈随鲁王的名写成，并用王的印戒盖印。
  rationale: 修订消除对月份的额外历法限定，恢复“写给”行政受文对象的句法关系，并明确文书分别按各省文字、各族语言书写；同时将印戒的动作改为“用王的印戒盖印”，以准确反映原文。脚注仍紧贴“文字”这一文化性术语。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T06:21:14Z'
review_pass:
  verdict: revise
  source_fidelity: 草稿基本保留了书记官被召、哈曼下令、各级行政官员、按各省文字和各族语言书写，以及奉王名并以王印戒盖印等信息。但“正月”将原文仅称“第一月”的表述具体化为中国农历语境；“传给”将原文的受文对象误作传递动作；“盖上王的印戒”也把用印戒盖印误说成盖上印戒。
  naturalness: 原译整体庄重流畅，但“各省采用本省的文字，各族采用本族的语言”容易理解为各省、各族主动采用文字或语言，而非文书按其文字、语言写成。修订后以“给……的文书”明确修饰关系，并保持现代汉语自然表达。
  terminology: “书记官”“总督”“省长”“官长”“印戒”均可用于此行政语境。修订保留这些术语；“用王的印戒盖印”准确表达以王的印戒封缄。
  issues:
  - severity: medium
    issue: “正月十三日”
    rationale: 希伯来文只说“第一月，十三日”，并未使用可对应汉语“正月”的月份名称。为避免不必要的历法本土化，应译为“第一月十三日”。
  - severity: medium
    issue: “拟写文书，传给……”
    rationale: 原文说文书是“写给”各级官员，并非说文书随后被“传给”他们；“拟写”也弱化了实际写成的动作。
  - severity: medium
    issue: “各省采用本省的文字，各族采用本族的语言”
    rationale: 原文的意思是发给每省的文书按该省文字书写、发给每族的文书按该族语言书写，不是这些群体选择或采用文字、语言。
  - severity: medium
    issue: “并盖上王的印戒”
    rationale: נֶחְתָּם בְּטַבַּעַת 表示“用王的印戒盖印／封缄”，不是将印戒本身盖上。
