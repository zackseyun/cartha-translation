translation_notes:
  register: 采用庄重而易懂的现代标准汉语。行政官衔按层级译为“总督、省长、官长”；保留原文各省、各族的分配结构。原文“第一月”译作自然的“正月”。未沿用英文咨询层中位置与内容不相符的脚注a，而只为“文字”保留必要的文化说明。
