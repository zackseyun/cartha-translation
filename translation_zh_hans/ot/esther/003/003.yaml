  text: Then the king’s servants who were at the king’s gate said to Mordecai[a], “Why are you transgressing the king’s command?”
translation:
  language: zh_hans
  text: 于是，王门那里的臣仆对末底改说：“你为什么违背王的命令？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: 于是……说
  rationale: 连续式未完成时推动叙事向前；“于是”自然表达事件的承接关系。
- source_word: עַבְדֵי הַמֶּלֶךְ
  choice: 王的臣仆
  rationale: עֶבֶד 可指仆人或臣属；此处人物是在王门供职的王室人员。“臣仆”既保留其从属身份，也符合宫廷语境，而不武断译成奴隶或官员。
- source_word: אֲשֶׁר בְּשַׁעַר הַמֶּלֶךְ
  choice: 在王门那里的
  rationale: 该短语按地点限定臣仆。“王门”保留宫廷建筑及行政场所的表达，“在那里”使现代汉语句法自然。
- source_word: לְמָרְדֳּכָי
  choice: 对末底改
  rationale: 介词 לְ 在此标明说话的对象，译为“对末底改”。
- source_word: מַדּוּעַ
  choice: 为什么
  rationale: 直接询问原因，现代汉语自然译为“为什么”。
- source_word: אַתָּה עוֹבֵר
  choice: 你……违背
  rationale: עבר 与“命令”搭配时表示越过、违反。汉语“违背”既保留越界违反的力度，也比“触犯”更自然；进行中的分词在汉语中无需另加时态标记。
- source_word: אֵת מִצְוַת הַמֶּלֶךְ
  choice: 王的命令
  rationale: מִצְוָה 在宫廷语境中是王所发布的命令；译作“命令”避免误添宗教性的“诫命”色彩。
