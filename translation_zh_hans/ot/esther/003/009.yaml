base_translation:
  language: en
  yaml_path: translation/ot/esther/003/009.yaml
  text: If it seems good to the king[a], let it be written that they be destroyed, and I will weigh out ten thousand talents of silver into the hands of those who do the work[c][b], to bring it into the king’s treasuries.
translation:
  language: zh_hans
  text: 王若以为好[a]，请下诏将他们灭绝；我将称出一万他连得银子[b]，交在办理这事的人手中[c]，让他们送入王的库房。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“若王以为合宜”。
    reason: lexical_alternative
  - marker: b
    text: 原文为“一万他连得银子”。“他连得”是很大的重量单位；这里的银子按重量计算，并非指一万枚钱币。
    reason: cultural_note
  - marker: c
    text: “交在……手中”也可理解为“借着办理这事的人”，即由执行此事的人员经手。
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם עַל הַמֶּלֶךְ טוֹב
  choice: 王若看为好
  rationale: 这是表示君王认可或喜悦的宫廷用语；译文保留“好”的字面意象，同时用现代汉语可理解的表达呈现。
- source_word: יִכָּתֵב
  choice: 请下诏
  rationale: 字面为“愿它被写下”，但在王宫语境中指写成正式诏令；“下诏”自然传达其语用意义。
- source_word: לְאַבְּדָם
  choice: 将他们灭绝
  rationale: 准确表达诏令的内容及其致命意图，不弱化为驱逐或惩处。
- source_word: כִּכַּר כֶּסֶף
  choice: 他连得银子
  rationale: כִּכָּר是按重量计算的大单位；采用传统音译，并以脚注解释，避免用不确定的现代重量换算。
- source_word: אֶשְׁקוֹל
  choice: 称出
  rationale: 保留שקל“称量”的具体含义，反映银子按重量交付的古代做法。
- source_word: עַל יְדֵי
  choice: 交在……手中
  rationale: 保留“在手中”的源文意象；此处也可表示借着相关人员办理，脚注说明这种代理含义。
- source_word: עֹשֵׂי הַמְּלָאכָה
  choice: 办理这事的人
  rationale: 原文所指人员身份较宽泛；此译法自然，却不擅自限定为某类官员。
- source_word: לְהָבִיא
  choice: 让他们送入
  rationale: בוא的使役语境为“带来、送入”；汉语补出承接前项人员的主语，使关系清楚。
- source_word: גִּנְזֵי הַמֶּלֶךְ
  choice: 王的府库
  rationale: 指君王储藏财物之处；“府库”庄重自然，也可涵盖希伯来文复数所指的一处或多处库房。
