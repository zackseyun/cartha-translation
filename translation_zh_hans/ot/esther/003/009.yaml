  to: 王若以为好[a]，请下诏将他们灭绝；我将称出一万他连得银子[b]，交在办理这事的人手中[c]，让他们送入王的库房。
  rationale: 修订仅调整两处：以更自然的“王若以为好”表达宫廷条件语，以“我将称出”准确呈现说话者对银子交付的未来承诺；并将“府库”换为较现代、且能自然表达复数库藏的“库房”。脚注锚点均保留在相应词语后，且保留原文的语义范围。
