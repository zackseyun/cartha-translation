  text: אַחַ֣ר הַ/דְּבָרִ֣ים הָ/אֵ֗לֶּה גִּדַּל֩ הַ/מֶּ֨לֶךְ אֲחַשְׁוֵר֜וֹשׁ אֶת הָמָ֧ן בֶּֽן הַמְּדָ֛תָא הָ/אֲגָגִ֖י וַֽ/יְנַשְּׂאֵ֑/הוּ וַ/יָּ֨שֶׂם֙ אֶת כִּסְא֔/וֹ מֵ/עַ֕ל כָּל הַ/שָּׂרִ֖ים אֲשֶׁ֥ר אִתּֽ/וֹ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/003/001.yaml
  text: After these things[a], King Ahasuerus promoted Haman son of Hammedatha the Agagite, exalted him[c][b], and set his throne above all the officials who were with him.
translation:
  language: zh_hans
  text: 这些事以后[a]，亚哈随鲁王擢升了哈米大他的儿子、亚甲族人[b]哈曼，又抬举他，把哈曼的座位[c]置于在王身边的所有官长之上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这些事情以后”。
    reason: lexical_alternative
  - marker: b
    text: “亚甲族人”保留了希伯来语中的称谓，可能表示与亚甲有关的谱系、宗族或其他身份关联。
    reason: cultural_note
  - marker: c
    text: “座位”也可译作“宝座”；这里指象征权位和等级的座席。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחַר הַדְּבָרִים הָאֵלֶּה
  choice: 这些事以后
  rationale: 这是承接前文、引出后续发展的常见时间表达；既贴近希伯来语，也符合现代汉语叙事习惯。
- source_word: גִּדַּל
  choice: 擢升
  rationale: 本处涉及宫廷中的地位和职级提升；“擢升”准确传达晋升之意，并保持庄重文体。
- source_word: הַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ
  choice: 亚哈随鲁王
  rationale: 采用中文圣经人名的通行音译，并按自然汉语使用“人名＋王”的次序。
- source_word: הָמָן
  choice: 哈曼
  rationale: 采用中文圣经传统中通行且易识别的音译。
- source_word: בֶּן הַמְּדָתָא
  choice: 哈米大他的儿子
  rationale: 明确保留父子关系，并采用通行人名音译。
- source_word: הָאֲגָגִי
  choice: 亚甲族人
  rationale: 该词可能表示与亚甲相关的族裔、宗族或谱系身份；“亚甲族人”保留这种关联而不在正文中过度判定其确切性质。
- source_word: וַיְנַשְּׂאֵהוּ
  choice: 又抬举他
  rationale: 保留与前一动词并列而又有所递进的地位提升含义，避免将两个动词合并为一次单纯的“晋升”。
- source_word: וַיָּשֶׂם אֶת כִּסְאוֹ
  choice: 把他的座位置于
  rationale: כִּסֵּא既可指宝座，也可指代表权位的座席；哈曼并非君王，正文用“座位”可保留词义张力而避免误解。
- source_word: מֵעַל כָּל הַשָּׂרִים
  choice: 所有官长之上
  rationale: 表达哈曼高于其他宫廷高级官员的位次；“官长”兼顾古代职衔语感与现代可懂度。
- source_word: אֲשֶׁר אִתּוֹ
  choice: 王身边
  rationale: 代词所指在语境中最自然地是王；译出“王”可避免中文中的指代含混，同时表达这些官员隶属王廷。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而清晰的叙事汉语。“擢升”体现宫廷职级语境；“抬举”保留第二个提升动词，避免重复得过于生硬。将אֲשֶׁר אִתּוֹ译为“王身边”，明确其最自然的先行词。所有脚注标记均置于正文相关词语之后。
