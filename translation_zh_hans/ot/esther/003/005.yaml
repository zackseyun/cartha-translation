  text: When Haman saw that Mordecai was neither bowing down nor prostrating himself before him[a], Haman was filled with rage.
translation:
  language: zh_hans
  text: 哈曼看见末底改既不屈膝，也不向他俯伏[a]，就充满了怒火。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“既不跪拜，也不向他表示敬意。”希伯来文用了两个相关却不同的动词，描述表示臣服或尊敬的动作。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: 哈曼看见
  rationale: 未完成式连续体推进叙事；汉语用“看见……就……”自然呈现其时间与因果衔接。
- source_word: כִּי אֵין מָרְדֳּכַי
  choice: 末底改既不……也不……
  rationale: אֵין与两个分词连用，表示持续不做这些动作；“既不……也不……”准确而自然。
- source_word: כֹּרֵעַ
  choice: 屈膝
  rationale: כרע指弯膝、跪下或屈身；“屈膝”保留具体身体动作，并与后一动词区别开来。
- source_word: וּמִשְׁתַּחֲוֶה
  choice: 也不……俯伏
  rationale: השתחוה通常指俯身至地的敬礼动作；“俯伏”保留较强的身体动作含义，不将其抽象化为单纯“致敬”。
- source_word: לוֹ
  choice: 向他
  rationale: 字面为“对他/向他”，在汉语中与“俯伏”搭配自然，清楚表明动作所指向的对象。
- source_word: וַיִּמָּלֵא ... חֵמָה
  choice: 就满腔怒火
  rationale: 保留“充满”的希伯来语意象，同时采用自然的现代汉语表达强烈愤怒。
- source_word: חֵמָה
  choice: 怒火
  rationale: 此词在本叙事语境中表示猛烈的愤怒；“怒火”既有强度，也能与“满腔”自然搭配。
