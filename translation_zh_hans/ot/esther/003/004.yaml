base_translation:
  language: en
  yaml_path: translation/ot/esther/003/004.yaml
  text: And when they spoke to him day after day and he would not listen to them[a], they told Haman, to see whether Mordecai’s words would stand, for he had told them that he was a Jew.
translation:
  language: zh_hans
  text: 他们日复一日地对末底改说，他却不听从他们。于是，他们把这事告诉哈曼，想看看末底改的话能否站得住[a]，因为末底改已经告诉他们自己是犹太人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “末底改的话能否站得住”也可理解为“末底改的说法是否成立”。希伯来原文直译是“末底改的话是否能站立”，既可能指他拒绝跪拜的理由能否成立，也可能指他在压力下能否坚持这一立场。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בְאָמְרָם אֵלָיו
  choice: 他们……劝末底改
  rationale: וַיְהִי加בּ不定式结构引出同时发生的时间背景；אמר אֶל在此不只是一次“说”，结合反复情境，译为“劝”自然地表达他们持续要求末底改顺从。为避免汉语代词指向含混，明说“末底改”。
- source_word: יוֹם וָיוֹם
  choice: 日复一日
  rationale: 保留希伯来语叠用所表达的逐日反复和持续性。
- source_word: וְלֹא שָׁמַע אֲלֵיהֶם
  choice: 他却不听
  rationale: שׁמע אֶל可指听从、理会；“不听”简洁自然，并保留既可理解为不听劝、也可理解为不服从的语义范围。
- source_word: וַיַּגִּידוּ לְהָמָן
  choice: 他们把这事告诉哈曼
  rationale: נגד的使役式表示告知、报告；补出汉语所需的宾语“这事”，所指由上下文限定。
- source_word: לִרְאוֹת
  choice: 想看看
  rationale: 不定式表示目的；“想看看”符合现代汉语叙事表达。
- source_word: הֲיַעַמְדוּ דִּבְרֵי מָרְדֳּכַי
  choice: 末底改的话能否站得住
  rationale: 直译并保留עמד“站立”的隐喻，也保留“话”可能指其理由、说法或立场的歧义。
- source_word: כִּי הִגִּיד לָהֶם
  choice: 因为末底改已经告诉他们
  rationale: כִּי说明他们向哈曼报告的原因；“已经”体现该告知先于他们的报告。
- source_word: אֲשֶׁר הוּא יְהוּדִי
  choice: 自己是犹太人
  rationale: יְהוּדִי在此为身份名词；“犹太人”是现代汉语直接、通行的表达。反身代词“自己”明确嵌入话语的主语关系。
theological_decisions:
- issue: 末底改所说的话具体指什么
  choice: 保留“末底改的话能否站得住”的宽泛表达
  alternative: 明确译为“末底改的理由是否成立”或“末底改能否坚持立场”
  rationale: 原文דִּבְרֵי既可能指他所陈述的理由或说法，也可能连带指其拒绝跪拜的立场；译文不替原文消除这一张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“日复一日”体现持续施压；“站得住”保留原文隐喻及其真实歧义。脚注标记[a]已置于与歧义相关的主句之后。
