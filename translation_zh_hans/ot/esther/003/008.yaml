base_translation:
  language: en
  yaml_path: translation/ot/esther/003/008.yaml
  text: Then Haman said to King Ahasuerus[a], “There is a certain people, scattered and separated among the peoples in all the provinces of your kingdom. Their laws are different from those of every other people, and they do not keep the king’s laws, so it is not in the king’s interest to let them remain.”
translation:
  language: zh_hans
  text: 哈曼对亚哈随鲁王说：“有一个民族，分散在你国各省的众民族中，与他们隔离。他们的律法与其他各民族的律法都不同，也不遵行王的律法；所以，任由他们这样下去[a]，对王并没有好处。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“任由他们”“不去管他们”或“容忍他们”。希伯来语动词可指让某人维持现状，任其不受干预。
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶשְׁנוֹ עַם אֶחָד
  choice: 有一个民族
  rationale: 既保留“一个”的形式，也以汉语自然地引出一个未明说名称、却被刻意指向的群体，符合哈曼含蓄而煽动性的语气。
- source_word: מְפֻזָּר וּמְפֹרָד
  choice: 散居并分散
  rationale: 分别呈现两个分词。“散居”表达散布于各地，“分散”保留第二个词所强调的分离状态，又不武断解释为群体内部的分裂。
- source_word: בֵּין הָעַמִּים
  choice: 在众民族中
  rationale: 此处指帝国内不同的族群或民众；“众民族”比“列国”更切合帝国各省的语境。
- source_word: בְּכֹל מְדִינוֹת מַלְכוּתֶךָ
  choice: 在你国各省
  rationale: מְדִינוֹת 在《以斯帖记》中通常指行政省份；“你国各省”简洁自然，并保留王国所属关系。
- source_word: דָתֵיהֶם
  choice: 他们的律法
  rationale: דָּת 在本书的波斯宫廷语境中可指法律、命令或规章；这里与“王的律法”对举，译作“律法”最能保留法律层面的指控。
- source_word: שֹׁנוֹת מִכָּל עָם
  choice: 与其他各民族的都不同
  rationale: 原文比较的是该民族的律法与各民族的律法；汉语以“的”承接省略的“律法”，清楚而不增添实质内容。
- source_word: וְאֶת דָּתֵי הַמֶּלֶךְ אֵינָם עֹשִׂים
  choice: 也不遵行王的律法
  rationale: עָשָׂה 与“律法”连用表示实行、遵守；“遵行”庄重自然，并准确表达持续不守王法的指控。
- source_word: וְלַמֶּלֶךְ אֵין שֹׁוֶה
  choice: 对王并没有好处
  rationale: 该表达关乎是否有利、是否值得；“对王并没有好处”直接传达哈曼从君王利益出发的劝诱。
- source_word: לְהַנִּיחָם
  choice: 容他们继续存在
  rationale: נוח 的使役式在此可表示任其存在、让其不受干预或容忍他们。“继续存在”贴合上下文，但以脚注保留“任由他们、不加干预”的可能含义。
