  to: 哈曼对亚哈随鲁王说：“有一个民族，分散在你国各省的众民族中，与他们隔离。他们的律法与其他各民族的律法都不同，也不遵行王的律法；所以，任由他们这样下去[a]，对王并没有好处。”
