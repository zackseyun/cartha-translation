base_translation:
  language: en
  yaml_path: translation/ot/esther/003/007.yaml
  text: In the first month[a], that is, the month of Nisan, in the twelfth year of King Ahasuerus, Pur—that is, the lot—was cast before Haman, from day to day and from month to month, until the twelfth month, that is, the month of Adar.
translation:
  language: zh_hans
  text: 亚哈随鲁王在位第十二年，正月，就是尼散月，在哈曼面前掣普珥，就是签；从一日到一日，从一月到一月，直到十二月，就是亚达月。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文末段较直译为：“从一日到一日，从一月到一月，十二，就是亚达月。”这里的表达十分简略；通常理解为掣签在日期和月份间进行，最后落在十二月，即亚达月。
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחֹדֶשׁ הָרִאשׁוֹן
  choice: 正月
  rationale: 这是以序数标示历月的时间短语；“正月”自然简洁，并由下文“尼散月”明确所指。
- source_word: הוּא חֹדֶשׁ נִיסָן
  choice: 就是尼散月
  rationale: הוּא在此引出同位解释；“就是”清楚保留说明关系，月名按音译处理。
- source_word: בִּשְׁנַת שְׁתֵּים עֶשְׂרֵה לַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ
  choice: 亚哈随鲁王在位第十二年
  rationale: 按现代汉语王朝纪年习惯重组语序，同时完整保留君王、在位年数和时间框架。
- source_word: הִפִּיל פּוּר
  choice: 有人……掣普珥
  rationale: 使役形在掣签惯用语中表示“掣/投签”；希伯来文未明说施事者，因此用“有人”避免指定具体人物。
- source_word: פּוּר הוּא הַגּוֹרָל
  choice: 普珥，也就是掣签
  rationale: 保留波斯借词“普珥”及原文随后的希伯来语解释；在汉语中以“掣签”表达该物件兼行动的语境含义，也与后文“普珥日”形成联系。
- source_word: לִפְנֵי הָמָן
  choice: 在哈曼面前
  rationale: 直接表达“在……面前/在场”，不把哈曼解释为亲自掣签的人。
- source_word: מִיּוֹם לְיוֹם וּמֵחֹדֶשׁ לְחֹדֶשׁ
  choice: 逐日逐月地掣
  rationale: 以自然汉语保留从一日到另一日、从一月到另一月的连续检选过程。
- source_word: שְׁנֵים עָשָׂר הוּא חֹדֶשׁ אֲדָר
  choice: 掣出了十二月，就是亚达月
  rationale: 上下文表明十二月是掣签所得的日期；“掣出了”补明原文省略但由句法过程暗示的结果，同时用脚注保留较直译的可能。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“正月”与“十二月”形成自然对应；保留“普珥”这一外来词，并立即解释。因原文未明说掣签者，避免译成哈曼亲自掣签；末段的省略结构在正文中适度显明其结果，脚注保存其形式上的含混。
