base_translation:
  language: en
  yaml_path: translation/ot/esther/003/011.yaml
  text: Then the king said to Haman[a], “The silver is given to you, and the people also[b], to do with them as seems good in your eyes.”
translation:
  language: zh_hans
  text: 于是，王对哈曼说：“银子[a]交给你，这个民族也交给你；你看怎样好，就怎样处置他们[b]吧。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “银子”也可译作“钱”。希伯来语כֶּסֶף本指银，也常引申为钱。
    reason: lexical_alternative
  - marker: b
    text: 原文的“民族”在语法上是单数集合名词，随后指代它的代词也是单数；汉语按集合意义译作“他们”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 于是……说
  rationale: 连续叙事形式推进情节；“于是”自然表达先后承接，不额外添加因果解释。
- source_word: הַמֶּלֶךְ
  choice: 王
  rationale: 原文使用带定冠词的君王称号，并未在本节直称其名；汉语依上下文用“王”自然明确。
- source_word: לְהָמָן
  choice: 对哈曼
  rationale: 介词与人名构成说话的对象；采用现代汉语通行译名“哈曼”。
- source_word: הַכֶּסֶף
  choice: 银子
  rationale: כֶּסֶף本义为“银”，也可引申为“钱财”。上下文涉及哈曼所许诺的款项；正文保留具体意象“银子”，脚注注明引申义。
- source_word: נָתוּן לָךְ
  choice: 交给你
  rationale: 被动分词结构表示交付或任其支配。“交给你”既贴近形式，也不强行判定王是在退还款项、豁免款项，还是准许哈曼支配。
- source_word: וְהָעָם
  choice: 那民也交给你
  rationale: “民”保留עָם作为集合名词的特点；“那”指向上文哈曼所说的特定族群，“也交给你”自然显明银子与那民并列受其支配。
- source_word: לַעֲשׂוֹת בּוֹ
  choice: 处置他们
  rationale: 不定式表达目的，介词短语指对该族群采取行动。汉语用“处置”比直译“对他们做”更自然，同时保留其行动内容未明说的开放性。
- source_word: כַּטּוֹב בְּעֵינֶיךָ
  choice: 你看怎样好，就怎样
  rationale: 保留“在你眼中为好”的主观判断含义，并用自然现代汉语表达，而不把它弱化为单纯的“随你喜欢”。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“那民”略带经文语体，但简洁保留原文集合名词及其与上文特定族群的衔接；“你看怎样好，就怎样……”保留希伯来语“在你眼中为好”的表达张力，同时避免生硬直译。
