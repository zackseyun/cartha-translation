base_translation:
  language: en
  yaml_path: translation/ot/esther/003/014.yaml
  text: A copy of the written decree was to be issued as law in every province and province[a], being made known to all the peoples[b], so that they would be ready for this day.
translation:
  language: zh_hans
  text: 诏书的抄本要在各省[a]颁布为法令，向各族民众公开，使他们为这一天[b]做好准备。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文逐字为“在每一省、省”，以重复表达“每一个省，无一例外”。
    reason: lexical_alternative
  - marker: b
    text: “这一天”也可译作“那一天”，指诏书所指定的日子。
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּתְשֶׁגֶן
  choice: 抄本
  rationale: 这是波斯语借词，指官方文书的副本；“抄本”既准确，也符合诏令传递的行政语境。
- source_word: הַכְּתָב
  choice: 诏书
  rationale: 字面意为“文书、所写的”，在本节指王命形成的正式书面文件；“诏书”自然体现其王室行政性质。
- source_word: לְהִנָּתֵן דָּת
  choice: 颁布为法令
  rationale: 被动不定式“被给予”在行政语境中指颁发、公布；דָּת表示具有约束力的法令，合译为“颁布为法令”保留文书成为正式法律命令的含义。
- source_word: בְּכָל מְדִינָה וּמְדִינָה
  choice: 在各省
  rationale: 希伯来语重复“省”构成分配式表达，强调每一个省；现代汉语以“各省”自然传达同样的周遍意义，并在脚注说明原文形式。
- source_word: גָּלוּי
  choice: 公开
  rationale: 该词表示公开、显明；此处修饰法令面向民众的公布状态，“公开”简洁保留其公开披露之意。
- source_word: לְכָל הָעַמִּים
  choice: 向各族民众
  rationale: עַמִּים为复数“各民、各族群”，指帝国内不同族群；“各族民众”比“列国”更符合帝国内部多族群的语境。
- source_word: לִהְיוֹת עֲתִדִים
  choice: 使他们……做好准备
  rationale: 不定式与形容词组合表达目的或结果，即让各族民众处于准备状态；此译符合现代汉语，并保留目的含义。
- source_word: לַיּוֹם הַזֶּה
  choice: 为这一天
  rationale: 原文直译为“为这一天”，指诏书所指定的日子；正文保留指示词“这”，脚注说明语境中也可理解为“那一天”。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“诏书”“颁布”“法令”体现波斯王室行政语境；避免照搬希伯来语重复而造成生硬，以“各省”表达其分配式强调。脚注标记均置于相关正文处。
