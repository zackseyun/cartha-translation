revisions:
- from: 驿使奉王命火速出发，谕旨也在书珊城堡颁布。王和哈曼却坐下饮酒，书珊城却陷入一片惶乱。[a]
  to: 驿使奉王命急速出发，法令也在书珊卫城颁布。王和哈曼坐下饮酒，书珊全城却陷入惶乱。[a]
  rationale: 将“书珊城堡”改为“书珊卫城”，更准确对应原文的地理—行政称谓；调整末句连接方式，使中文叙事对照自然，同时不改变原文事件关系或语义范围。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T06:21:17Z'
