base_translation:
  language: en
  yaml_path: translation/ot/esther/003/015.yaml
  text: The couriers went out[a], hurried by the king’s command, and the decree was issued in Susa the citadel. And the king and Haman sat down to drink[b], but the city of Susa was thrown into confusion.
translation:
  language: zh_hans
  text: 驿使奉王命急速出发，法令也在书珊卫城颁布。王和哈曼坐下饮酒，书珊全城却陷入惶乱。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “惶乱”也可译作“困惑不安”或“陷入混乱”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרָצִים
  choice: 驿使
  rationale: 指奉王命递送公文的人；“驿使”既体现官方职能，也符合古代波斯行政语境。
- source_word: דְחוּפִים
  choice: 火速
  rationale: 表达这些驿使受命催促、急速行动的被动意味，以自然汉语呈现紧迫感。
- source_word: בִּדְבַר הַמֶּלֶךְ
  choice: 奉王命
  rationale: 这里的“话”具有君王命令的权威，不只是一般言语。
- source_word: הַדָּת נִתְּנָה
  choice: 谕旨……颁布
  rationale: דָּת 在波斯行政背景中指具有法律效力的命令；נִתְּנָה 字面为“被交付”，此处按行政语境译作“颁布”。
- source_word: שׁוּשַׁן הַבִּירָה
  choice: 书珊城堡
  rationale: בִּירָה 指设防的王宫城堡或卫城；采用中文圣经传统较熟悉的“书珊”，并以“城堡”表达其性质。
- source_word: יָשְׁבוּ לִשְׁתּוֹת
  choice: 坐下饮酒
  rationale: 贴近希伯来语结构，保留王与哈曼在暴力谕旨发出后饮酒所形成的强烈叙事反差。
- source_word: נָבוֹכָה
  choice: 陷入一片惶乱
  rationale: 该词可兼含困惑、惊惶和骚乱；“惶乱”保留心理与全城秩序两方面的含义。
- source_word: וְ
  choice: 却
  rationale: 原文连续使用连接词“和/而”；中文以“却”显明王与哈曼饮酒、全城惶乱之间的叙事对照，而不改变事件内容。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“奉王命火速出发”简洁呈现王命所施加的催迫；两个“却”强化原文末段的鲜明反差。脚注标记置于其所说明的“惶乱”之后。
