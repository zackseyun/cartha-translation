source:
  edition: WLC
  text: וַ/יִּ֣בֶז בְּ/עֵינָ֗י/ו לִ/שְׁלֹ֤ח יָד֙ בְּ/מָרְדֳּכַ֣י לְ/בַדּ֔/וֹ כִּֽי הִגִּ֥ידוּ ל֖/וֹ אֶת עַ֣ם מָרְדֳּכָ֑י וַ/יְבַקֵּ֣שׁ הָמָ֗ן לְ/הַשְׁמִ֧יד אֶת כָּל הַ/יְּהוּדִ֛ים אֲשֶׁ֛ר בְּ/כָל מַלְכ֥וּת אֲחַשְׁוֵר֖וֹשׁ עַ֥ם מָרְדֳּכָֽי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/003/006.yaml
  text: But it seemed contemptible in his eyes to lay a hand on Mordecai alone[a], because they had told him what people Mordecai belonged to. So Haman sought to destroy all the Jews throughout the whole kingdom of Ahasuerus—the people of Mordecai.
translation:
  language: zh_hans
  text: 他不屑于只向末底改一人下手，因为有人告诉了他末底改属于哪个民族[a]。于是，哈曼图谋灭绝亚哈随鲁整个国中所有的犹太人，也就是末底改的族人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“末底改的民族”，即末底改所属的民族。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶז בְּעֵינָיו
  choice: 他不屑于
  rationale: בזה 与“在他眼中”这一表达共同表示轻视、认为不值得；“不屑于”以自然现代汉语保留了哈曼鄙夷的主观判断。
- source_word: לִשְׁלֹחַ יָד בְּ
  choice: 向……下手
  rationale: 原文是“伸手攻击”的惯用语，指采取暴力行动；“向……下手”既保留手的意象，也符合现代汉语叙事表达。
- source_word: לְבַדּוֹ
  choice: 只……一人
  rationale: 突出末底改单独一人不足以成为哈曼报复的全部对象，并与后文针对整个民族形成对比。
- source_word: כִּי הִגִּידוּ לוֹ
  choice: 因为有人告诉了他
  rationale: 该从句说明哈曼扩大报复范围的原因；希伯来语复数主语未明确身份，汉语用泛指“有人”自然表达。
- source_word: אֶת עַם מָרְדֳּכָי
  choice: 末底改属于哪个民族
  rationale: 原文直译为“末底改的民族”，语境指末底改所归属的族群；展开表达可避免被误解为由末底改拥有或统领的人。
- source_word: וַיְבַקֵּשׁ
  choice: 图谋
  rationale: בקש 在此表示有目的地寻求实施某事；“图谋”贴合蓄意策划毁灭的语境，同时不暗示计划已经成功。
- source_word: לְהַשְׁמִיד
  choice: 灭绝
  rationale: שׁמד 的使役形在此指彻底毁灭整个群体；“灭绝”准确传达其全面毁灭的严重程度。
- source_word: כָּל הַיְּהוּדִים
  choice: 所有的犹太人
  rationale: 在《以斯帖记》的波斯帝国语境中，该词指散居的犹太族群，不仅指犹大地区的居民。
- source_word: אֲשֶׁר בְּכָל מַלְכוּת אֲחַשְׁוֵרוֹשׁ
  choice: 亚哈随鲁整个国中
  rationale: 简洁表达犹太人遍布王国各处的范围，并保留“整个王国”的全面性。
- source_word: עַם מָרְדֳּכָי
  choice: 末底改的族人
  rationale: 作为“所有的犹太人”的同位说明，保留原文对末底改所属群体的重复强调。
theological_decisions: []
