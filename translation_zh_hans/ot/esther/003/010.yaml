base_translation:
  language: en
  yaml_path: translation/ot/esther/003/010.yaml
  text: So the king took his signet ring from his hand and gave it to Haman son of Hammedatha the Agagite[a], the enemy of the Jews.
translation:
  language: zh_hans
  text: 于是，王从手上摘下自己的印戒，交给亚甲人哈米大他的儿子哈曼，就是犹太人的仇敌[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“犹大人”。希伯来语“犹大人／犹太人”可泛指犹太民族，也可在某些语境中指犹大或犹太地的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּסַר
  choice: 摘下
  rationale: 该动词表示移去、取下；与“从自己手上”搭配时，“摘下”在现代汉语中自然准确。
- source_word: טַבַּעְתּוֹ
  choice: 印章戒指
  rationale: 此戒指用于盖印并代表王权授权；“印章戒指”既保留实物形态，也说明其宫廷功能。
- source_word: מֵעַל יָדוֹ
  choice: 从自己手上
  rationale: 直接保留希伯来语的身体意象；“自己”明确此手属于王。
- source_word: וַיִּתְּנָהּ
  choice: 交给
  rationale: 阴性后缀指前述戒指；“交给”比单纯“给”更符合正式授予权柄的叙事场景，同时未过度阐释。
- source_word: לְהָמָן
  choice: 哈曼
  rationale: 按现代中文圣经人名惯例音译。
- source_word: בֶּן הַמְּדָתָא
  choice: 哈米大他的儿子
  rationale: 忠实保留希伯来语父子称谓结构，并采用通行中文音译。
- source_word: הָאֲגָגִי
  choice: 亚甲族人
  rationale: 保留其族属或谱系称号及叙事上的历史呼应，不进一步断定具体血缘关系。
- source_word: צֹרֵר
  choice: 仇敌
  rationale: 该分词指敌对、加害之人；“仇敌”准确表达强烈敌意，也符合庄重叙事语体。
- source_word: הַיְּהוּדִים
  choice: 犹大人
  rationale: 该词既可指犹太民族，也保留与犹大身份的联系；以“犹大人”呈现其古代族群称谓，避免现代词义可能造成的时代错置。
- source_word: וַ
  choice: 于是
  rationale: 叙事连接词承接上一节王对哈曼的回应；“于是”自然表达由前文引出的后续行动。
theological_decisions:
- issue: הָאֲגָגִי所指的身份性质
  choice: 亚甲族人
  alternative: 亚甲的后裔
  rationale: 原词是族属或谱系形容词，但经文本身未在此明确说明血缘层级；采用较开放的表达，以保留可能的历史与文学联系。
- issue: הַיְּהוּדִים的族群称谓
  choice: 犹大人
  alternative: 犹太人
  rationale: 两种译法均有词源和语境依据；本译选择较贴近古代称谓的“犹大人”，同时该节上下文清楚表明所指是被哈曼敌视的整个族群。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“王从自己手上摘下印章戒指”保留原文动作顺序；将“犹大人的仇敌”前置，并以破折号连接哈曼的完整身份，使中文句式流畅，同时保持原文对其敌对身份的强调。
