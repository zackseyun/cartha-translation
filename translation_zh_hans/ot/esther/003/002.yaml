source:
  edition: WLC
  text: וְ/כָל עַבְדֵ֨י הַ/מֶּ֜לֶךְ אֲשֶׁר בְּ/שַׁ֣עַר הַ/מֶּ֗לֶךְ כֹּרְעִ֤ים וּ/מִֽשְׁתַּחֲוִים֙ לְ/הָמָ֔ן כִּי כֵ֖ן צִוָּה ל֣/וֹ הַ/מֶּ֑לֶךְ וּ/מָ֨רְדֳּכַ֔י לֹ֥א יִכְרַ֖ע וְ/לֹ֥א יִֽשְׁתַּחֲוֶֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/003/002.yaml
  text: And all the king’s servants who were at the king’s gate were bowing down and paying homage to Haman[a], for the king had so commanded concerning him[b]. But Mordecai would not bow down or pay homage.
translation:
  language: zh_hans
  text: 所有在王门那里的王臣都向哈曼屈膝下拜[a]，因为王曾为他这样下令[b]。但末底改既不屈膝，也不下拜。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“向哈曼俯伏致敬”。译作“下拜”的希伯来语动词，在对象是神的语境中也可译作“敬拜”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“因为王曾这样吩咐他。”不过，这里的“他”更可能指哈曼，意思是王曾下令要众人如此礼遇哈曼。
    reason: alternative_reading
lexical_decisions:
- source_word: עַבְדֵי הַמֶּלֶךְ
  choice: 王臣
  rationale: עֶבֶד在王宫语境中指服事君王的臣仆或官员。“王臣”既保留从属关系，也避免“奴隶”所暗示的过度限定。
- source_word: בְּשַׁעַר הַמֶּלֶךְ
  choice: 在王门任职
  rationale: “王门”是与王室事务相关的公共、行政场所。补出“任职”使现代汉语自然，也符合这些王臣常驻该处的语境。
- source_word: כֹּרְעִים
  choice: 屈膝
  rationale: 该词表示屈膝、跪下的臣服姿态；分词形式在此表明惯常行为。
- source_word: וּמִשְׁתַּחֲוִים
  choice: 下拜
  rationale: 该词可指俯伏致敬，也可在对象为神时指敬拜。此处对象是哈曼，“下拜”保留身体动作和尊崇意味，而不预先断定为宗教敬拜。
- source_word: כִּי כֵן צִוָּה לוֹ הַמֶּלֶךְ
  choice: 因为王曾这样吩咐，要人如此待他
  rationale: לוֹ最自然地回指哈曼，表示王的命令涉及应当给予哈曼的礼遇；此译法同时避免误解为王只吩咐了哈曼本人。
- source_word: וּמָרְדֳּכַי
  choice: 但末底改
  rationale: 连接词字面为“而/和”，但上下文形成明显反差，现代汉语用“但”更准确地表达语篇功能。
- source_word: לֹא יִכְרַע וְלֹא יִשְׁתַּחֲוֶה
  choice: 既不屈膝，也不下拜
  rationale: 两个未完成式在此描写末底改一贯且带意志性的拒绝；“既不……也不……”保留两个并列动作及其强调。
theological_decisions:
- issue: הִשְׁתַּחֲוָה在本节是否应译为明确的宗教性“敬拜”
  choice: 下拜
  alternative: 敬拜；俯伏致敬
  rationale: 该动词既可用于对神的敬拜，也可用于向人的俯伏致敬。由于此处对象是哈曼，正文采用不预设宗教含义的“下拜”，脚注则保留其语义范围，避免消解经文可能具有的神学张力。
- issue: לוֹ所指为何
  choice: 指哈曼，即王吩咐众人如此礼遇他
  alternative: 指受命令者，即“王这样吩咐了他”
  rationale: 上下文更支持该代词回指哈曼，说明命令关乎给予他的尊荣；但希伯来语形式容许另一种句法理解，因此以脚注保留。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“王门”保留古代宫廷行政场所的具体意象；“王臣”比“仆人”更符合宫廷人员语境。“屈膝／下拜”保留原文两个近义而不完全相同的动作，并避免把向哈曼的礼仪直接定性为宗教敬拜。
