base_translation:
  language: en
  yaml_path: translation/ot/esther/001/018.yaml
  text: And today the noblewomen of Persia and Media who have heard the queen’s word will say the same to all the king’s officials[c][b][a], and there will be enough contempt and wrath.
translation:
  language: zh_hans
  text: 今天，波斯和米底的贵妇[a]听说了这件有关王后的事[b]，也会对王的所有官员这样说；于是必会有许多藐视和愤怒[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“波斯和米底的女贵族”。原文指身份显贵的女性，不一定是王室的女儿。
    reason: lexical_alternative
  - marker: b
    text: 也可译为“王后的话”或“有关王后的事”。原文的“话／事”既可指她所说的话，也可指有关她的这件事。
    reason: lexical_alternative
  - marker: c
    text: 原文末句省略了谓语，直译近似“而且足够的藐视和愤怒”。此处补出“必会有许多”，以表达警告性的结果；原文没有明说这些藐视和愤怒具体出自谁。
    reason: textual_or_grammatical
lexical_decisions:
- source_word: וְהַיּוֹם הַזֶּה
  choice: 今天
  rationale: 表达眼前、当日就会发生的后果；现代汉语中“今天”自然明白，无须额外强化为“就在今天”。
- source_word: תֹּאמַרְנָה
  choice: 也会……这样说
  rationale: 该词是“说”的阴性复数未完成式，在本段论述中表示预期的结果。“这样”承接上一节所述王后的言行，使汉语语意完整，但不具体限定贵妇会采用哪些话语。
- source_word: שָׂרוֹת
  choice: 贵妇
  rationale: 指具有显贵身份的女性，与王廷中的高官相对应；“贵妇”既体现其社会地位，又避免“公主”所暗示的王室血统。
- source_word: פָּרַס וּמָדַי
  choice: 波斯和米底
  rationale: 采用现代中文圣经及历史叙述中通行的地名。
- source_word: אֲשֶׁר שָׁמְעוּ
  choice: 听说
  rationale: 完成式表示她们已经获悉此事；中文“听说”也自然包含消息传播的意味。
- source_word: אֶת דְּבַר הַמַּלְכָּה
  choice: 王后的事
  rationale: דָּבָר 可指话语、事情或事件；此处可能指王后所说的话，也可能泛指她抗命一事。“王后的事”保留这一语义宽度。
- source_word: לְכֹל שָׂרֵי הַמֶּלֶךְ
  choice: 对王的所有官员
  rationale: שָׂרִים 指掌权者或宫廷高官；“官员”是清楚的现代汉语，不引入“王子”的血统含义。
- source_word: וּכְדַי
  choice: 就够多了
  rationale: כְּדַי 表示足够、充分；原文末句省略谓语，译文以“就……了”补足中文句法，同时保留其简短而带警告意味的表达。
- source_word: בִּזָּיוֹן
  choice: 藐视
  rationale: 该名词表示轻蔑、鄙视；此处侧重妻子对丈夫及权威的蔑视，而不只是自身蒙受羞辱。
- source_word: וָקָצֶף
  choice: 和愤怒
  rationale: קֶצֶף 表示强烈的怒气。“愤怒”在现代中文中有足够力度，也符合宫廷论辩的庄重语域。
