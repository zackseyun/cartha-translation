base_translation:
  language: en
  yaml_path: translation/ot/esther/001/013.yaml
  text: Then the king said to the wise men who knew the times—for this was the king’s procedure before all who knew law and judgment—
translation:
  language: zh_hans
  text: 于是，王对那些通晓时势的智者说——因为王的事向来都是在一切通晓律法和审判的人面前如此办理——
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יֹדְעֵי הָעִתִּים
  choice: 通晓时务的
  rationale: 字面为“知道时势/时机的人”；在宫廷语境中指熟悉时代情势及相宜处置的人。“通晓时务”自然凝练，同时保留其范围可能较广的含义。
- source_word: דְּבַר הַמֶּלֶךְ
  choice: 王的事务
  rationale: דבר 可指话语、事情或事务；这里描述王把案件提交给专家审议的惯常程序，译作“事务”较贴合上下文，又不把它窄化为单一命令。
- source_word: דָּת וָדִין
  choice: 律法和判例
  rationale: דָּת 指法律、法令；דִּין 可指审判、裁断或司法案件。译作“判例”凸显这些人所通晓的司法裁断领域，并与“律法”形成自然搭配。
- source_word: לִפְנֵי
  choice: 交由……审议
  rationale: 字面为“在……面前”。结合“王的事务”而言，表达事项提交到法律专家面前处理；中文以“交由……审议”呈现这一程序性含义。
