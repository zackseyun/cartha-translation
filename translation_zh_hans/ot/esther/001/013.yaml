  terminology: “判例”是现代法学中的专门术语，通常指既往裁判可作为规则或先例的案例；דִּין此处更宽泛地指审判、裁断或司法，宜译为“审判”。“律法和审判”也更贴近原文及英文审计文本的“law and judgment”。
