  rationale: 仅作必要的汉语句法和表达修订。“所做的错事”对应עָוְתָה（行事错误、作恶／冒犯），“得罪了”表达其行为针对王、大臣和众民的关系。保留原文“不只是……也……”的修辞推进，以及“所有的大臣”和“各族人民”的范围。无需脚注。
