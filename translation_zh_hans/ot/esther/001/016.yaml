base_translation:
  language: en
  yaml_path: translation/ot/esther/001/016.yaml
  text: Then Memucan said before the king and the officials[a], “Queen Vashti has done wrong not against the king alone, but against all the officials and all the peoples who are in all the provinces of King Ahasuerus.”
translation:
  language: zh_hans
  text: 米母干在王和众大臣面前说：“王后瓦实提所做的错事，不只是得罪了王，也得罪了亚哈随鲁王各省所有的大臣和各族人民。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 未完成式带连续叙事的 waw 推进情节；现代汉语在上下文中无需机械译出“于是”，用“说”即可自然承接。
- source_word: מומכן
  choice: 米母干
  rationale: 按希伯来文本音译人名，并采用中文圣经传统中通行、易识别的译名。
- source_word: לִפְנֵי
  choice: 在……面前
  rationale: 表达当着王和大臣、在其面前发言，既贴近原文，也符合现代汉语。
- source_word: הַשָּׂרִים
  choice: 众大臣／所有大臣
  rationale: שׂרים 在波斯宫廷语境中指有地位的官员；“大臣”比“王子”准确，也比泛称“官员”更符合宫廷语境。首处用“众大臣”，后处依 כָּל 译为“所有大臣”。
- source_word: לֹא עַל הַמֶּלֶךְ לְבַדּוֹ
  choice: 得罪的，不只是王一人
  rationale: 保留“不单……也……”的对照结构；עַל 与表示行恶的动词连用，指错误行为所针对或伤害的对象。
- source_word: עָוְתָה
  choice: 得罪
  rationale: 该动词表示行事错误、作恶或冒犯；此处是对王及帝国群体所犯的过错。“得罪”自然简洁，同时保留道德与关系层面的含义。
- source_word: וַשְׁתִּי הַמַּלְכָּה
  choice: 王后瓦实提
  rationale: 按自然汉语将称号置于人名前；“王后”在语境中比单纯“女王”准确。
- source_word: כִּי
  choice: 也
  rationale: 此处承接前面的否定，形成“不只是……也……”的修正扩展关系；汉语用“也”自然呈现其对照功能。
- source_word: עַל כָּל הַשָּׂרִים וְעַל כָּל הָעַמִּים
  choice: 也得罪了……所有大臣和各族人民
  rationale: 补出第二个“得罪了”，清楚反映重复的 עַל；הָעַמִּים 为复数，在多民族帝国语境中译作“各族人民”，避免抹平其复数意义。
- source_word: אֲשֶׁר בְּכָל מְדִינוֹת
  choice: 各省的
  rationale: 关系从句说明这些大臣和各族人民分布于王的所有行省；汉语以领属式压缩表达，更自然而不改变范围。
- source_word: מְדִינוֹת
  choice: 省
  rationale: 指波斯帝国的行政区域，“省”是《以斯帖记》语境中清楚、通行的译法。
- source_word: אֲחַשְׁוֵרוֹשׁ
  choice: 亚哈随鲁
  rationale: 采用中文圣经传统中通行的王名音译，便于读者识别。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。保留米母干把王后的行为扩大为对帝国官员及各族人民之冒犯的修辞主张，不替叙述者判断该主张是否公允。原文语序也可较直译为“瓦实提王后不只得罪了王，也得罪了……”，但中文正文调整为主题突出而自然的表达，无需脚注。
