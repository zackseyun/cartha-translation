base_translation:
  language: en
  yaml_path: translation/ot/esther/001/007.yaml
  text: Drinks were served in vessels of gold, with vessels differing from vessel to vessel, and royal wine in abundance, according to the king’s bounty.
translation:
  language: zh_hans
  text: 饮酒用金制器皿，器皿件件不同；王室的酒丰盛，是照着王的慷慨供应的。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַשְׁקוֹת
  choice: 饮酒用的是
  rationale: 该词为不定式结构，语境中指宴席上的饮用或供饮；这样译成自然汉语，同时避免无依据地明确添加“侍从端上”等主语。
- source_word: בִּכְלֵי זָהָב
  choice: 金器
  rationale: 直译为“金的器皿”，在宴饮语境中指盛酒、饮酒所用的金制器皿；“金器”简洁庄重。
- source_word: וְכֵלִים מִכֵּלִים שׁוֹנִים
  choice: 各样器皿件件不同
  rationale: 保留希伯来文“器皿与器皿不同”的强调性表达，表明器皿样式各异，而不擅自解释为价值、大小或材质不同。
- source_word: וְיֵין מַלְכוּת
  choice: 御酒
  rationale: מַלְכוּת 在此修饰酒，意为王室所备或属于王家的酒；“御酒”符合现代中文的宫廷语境。
- source_word: רָב
  choice: 丰足
  rationale: 表达数量丰富、供应充裕，与宴席铺张的语境相合。
- source_word: כְּיַד הַמֶּלֶךְ
  choice: 尽显王的慷慨
  rationale: 字面为“照着王的手”，是表示能力、财力或宽厚程度的习语；此处结合盛宴语境译为王的慷慨，同时体现供应规模。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事文体；以分号呈现器皿与酒两方面的铺陈。未设置脚注，因为本节的习语可在正文中自然传达，且没有必须另注的文本异读或神学歧义。
