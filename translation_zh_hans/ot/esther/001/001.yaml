base_translation:
  language: en
  yaml_path: translation/ot/esther/001/001.yaml
  text: It happened in the days of Ahasuerus—the Ahasuerus who reigned from India to Cush[b][a], over one hundred twenty-seven provinces—
translation:
  language: zh_hans
  text: 事情发生在亚哈随鲁[a]的日子——这位亚哈随鲁统治着从印度到古实[b]的一百二十七个省——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“薛西斯”；这是把此名理解为历史上相对应的波斯王时所用的名称，而“亚哈随鲁”是按希伯来文直接音译。
    reason: alternative_reading
  - marker: b
    text: “古实”是古代地区名；有些译本译作“埃塞俄比亚”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: 事情发生在
  rationale: 这是希伯来叙事常用的开篇形式。译文保留其引出后续事件的作用，不另加原文没有的“那时”或“如今”。
- source_word: בִּימֵי
  choice: 在……在位的日子
  rationale: 既贴近“在……的日子”这一时间表达，又结合君王语境，使现代汉语读者易于理解。
- source_word: אֲחַשְׁוֵרוֹשׁ
  choice: 亚哈随鲁
  rationale: 按希伯来文名称音译，不把可能的历史身份认定直接写入正文；“薛西斯”列入脚注作为可能的历史对应名称。
- source_word: הוּא אֲחַשְׁוֵרוֹשׁ
  choice: 这位亚哈随鲁
  rationale: 保留代词加重复人名所具有的指明、限定作用，并采用自然的现代汉语表达。
- source_word: הַמֹּלֵךְ
  choice: 统治着
  rationale: 分词描述此人的统治范围；“统治着”自然地呈现持续状态。
- source_word: מֵהֹדּוּ וְעַד כּוּשׁ
  choice: 从印度直到古实
  rationale: הֹדּוּ依通行理解译作“印度”；כּוּשׁ采用古代地名“古实”，避免让“埃塞俄比亚”被误解为现代国家疆域。
- source_word: שֶׁבַע וְעֶשְׂרִים וּמֵאָה
  choice: 一百二十七
  rationale: 按现代汉语数词次序自然表达原文数目。
- source_word: מְדִינָה
  choice: 省
  rationale: 在波斯帝国行政语境中，“省”是简洁、通行且易懂的对应词。
