base_translation:
  language: en
  yaml_path: translation/ot/esther/001/020.yaml
  text: And when the king’s decree that he makes is heard throughout all his kingdom—for it is vast—all the women will give honor to their husbands[b][a], from great to small.
translation:
  language: zh_hans
  text: 当王所颁布的诏令[a]传遍他的整个国度时——因为他的国度辽阔——所有妇女都会敬重[b]自己的丈夫，无论尊卑。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“谕旨”。原文所用的词指君王正式发布的命令。
    reason: lexical_alternative
  - marker: b
    text: 或译“向自己的丈夫表示尊重”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִשְׁמַע
  choice: 一传遍
  rationale: 该词是שׁמע的尼法勒式，表达诏令被听见并传开的情形；“一传遍”在现代汉语中自然地带出随后的结果，同时保留其时间关系。
- source_word: פִּתְגָם
  choice: 诏令
  rationale: 在波斯宫廷语境中，此词指君王正式发布的命令；“诏令”庄重而易懂。
- source_word: אֲשֶׁר יַעֲשֶׂה
  choice: 所颁布的
  rationale: עשה本义宽泛，但与正式王令搭配时表示作出、发布；汉语用“颁布”最符合搭配习惯。
- source_word: בְּכָל מַלְכוּתוֹ
  choice: 传遍他的整个国度
  rationale: 介词短语表示诏令在王国全境为人所知；“传遍”清楚表达其覆盖范围。
- source_word: כִּי רַבָּה הִיא
  choice: 因为这国度辽阔
  rationale: רַבָּה在此描述王国幅员广大；“辽阔”比笼统的“大”更贴合语境。
- source_word: וְכָל הַנָּשִׁים
  choice: 所有妇女
  rationale: 保留原文泛指复数“妇女”，不直接改成“妻子”；后面的“自己的丈夫”已限定这里所涉及的婚姻关系。
- source_word: יִתְּנוּ יְקָר
  choice: 都会敬重
  rationale: 该短语直译为“给予尊荣”；“敬重”以自然现代汉语表达给予尊重和看重之意。
- source_word: לְבַעְלֵיהֶן
  choice: 自己的丈夫
  rationale: בעל虽可指主人或所有者，但在妇女与家庭关系的语境中明确指丈夫；“自己的”自然对应复数所有格。
- source_word: לְמִגָּדוֹל וְעַד קָטָן
  choice: 无论尊卑
  rationale: 这是涵盖整个社会等级范围的惯用表达。置于句末，既贴近原文次序，也不过度限定“尊卑”只修饰妇女或只修饰丈夫。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重且易懂的书面汉语。“因为这国度辽阔”以破折号保留原文插入说明的结构；句末“无论尊卑”保留原文可能涉及妇女或丈夫社会等级的语义张力。
