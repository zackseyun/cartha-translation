  rationale: 修订保留原文“当……坐在……”的时间性，并将“位于书珊这座堡垒”的关系从句自然地置于“王位”之前。以“堡垒”对应הַבִּירָה的设防王室／行政中心含义，避免将其泛化为“首都”。
