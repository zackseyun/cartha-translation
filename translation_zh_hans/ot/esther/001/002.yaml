  source_fidelity: 原文的时间框架、亚哈随鲁王坐在其王位上，以及王位位于书珊这座堡垒／卫城的关系，均应明确保留。草稿基本传达了这些要素，但将关系从句拆作“这王位设在……”稍显生硬；改为直接修饰“王位”更准确自然。
  naturalness: “这王位设在书珊城堡里”在现代汉语中略显书面且“书珊城堡”易被理解为普通城堡名称。采用“位于书珊堡垒的王位”可更清晰地表达“书珊这座卫城／堡垒”是王位所在地。
  terminology: “亚哈随鲁王”符合通行中文圣经人名用法。“书珊”可保留；脚注将其与现代常用名称“苏萨”对应即可。הַבִּירָה在此宜译为“堡垒”或“卫城”，不宜译作“首都”。
