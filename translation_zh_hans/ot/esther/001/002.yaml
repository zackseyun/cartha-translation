base_translation:
  language: en
  yaml_path: translation/ot/esther/001/002.yaml
  text: In those days[a], when King Ahasuerus sat on his royal throne, which was in Susa the citadel,
translation:
  language: zh_hans
  text: 当时，亚哈随鲁王坐在位于书珊[a]堡垒的王位上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “书珊”即今常称的“苏萨”（Susa）。
    reason: 地名异译说明
lexical_decisions:
- source_word: בַּיָּמִים הָהֵם
  choice: 那时
  rationale: 这是希伯来语常见的叙事时间用语；“那时”在现代汉语中自然，并保留指示意味。
- source_word: כְּשֶׁבֶת
  choice: 坐在
  rationale: כְּ 加不定式构成时间从句；结合前面的“那时”译为“王坐在”，简洁自然地表达当时的状态。
- source_word: הַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ
  choice: 亚哈随鲁王
  rationale: 按现代汉语习惯将王号置于人名之后；“亚哈随鲁”采用通行的中文圣经人名译法。
- source_word: עַל כִּסֵּא מַלְכוּתוֹ
  choice: 坐在他的王位上
  rationale: 原文直译为“在他国权／王权的宝座上”；“他的王位”既保留所属关系和君王含义，又符合自然汉语。
- source_word: אֲשֶׁר
  choice: 这王位设在
  rationale: 关系代词指向“王位”。分为后置分句，可避免汉语中冗长的前置修饰，同时清楚保留王位所在地这一关系。
- source_word: בְּשׁוּשַׁן
  choice: 在书珊
  rationale: שׁוּשַׁן 为波斯城名，采用中文圣经中较通行的“书珊”，并以脚注提供现代常见音译“苏萨”。
- source_word: הַבִּירָה
  choice: 城堡
  rationale: בִּירָה 在此指有防御设施的王宫或行政建筑群；“城堡”比“首都”更贴近其空间与防御含义，也比单纯“堡垒”更适合王宫语境。
theological_decisions: []
