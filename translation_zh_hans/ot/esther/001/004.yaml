  text: while he displayed the riches of the glory of his kingdom and the splendor of the honor of his greatness for many days—one hundred and eighty days.
translation:
  language: zh_hans
  text: 他展示自己国度荣耀的财富，以及他伟大威严的华美和尊贵，历时许多日子，共一百八十天。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּהַרְאֹתוֹ
  choice: 他……展示
  rationale: 该结构承接上文，表示亚哈随鲁王设宴期间所做之事；“展示”准确表达使人看见、陈列之意。
- source_word: עֹשֶׁר כְּבוֹד מַלְכוּתוֹ
  choice: 他王国荣耀的财富
  rationale: 保留原文连续属格结构及“财富—荣耀—王国”的修辞密度，不将“荣耀”弱化为单纯的物质富足。
- source_word: יְקָר תִּפְאֶרֶת גְּדוּלָּתוֹ
  choice: 他伟大之尊荣的华美
  rationale: 分别体现 יְקָר 的尊荣、贵重感与 תִּפְאֶרֶת 的华美、辉煌感，同时保留原文庄重而叠加的宫廷修辞。
- source_word: יָמִים רַבִּים שְׁמוֹנִים וּמְאַת יוֹם
  choice: 许多日子……共一百八十天
  rationale: 既保留“许多日子”的概括语，又将随后数字明确理解为其具体说明。
