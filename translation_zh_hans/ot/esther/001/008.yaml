base_translation:
  language: en
  yaml_path: translation/ot/esther/001/008.yaml
  text: 'And the drinking was according to the law: there was no compulsion[c][b][a], for so the king had instructed every official of his household to do according to the desire of each man.'
translation:
  language: zh_hans
  text: 饮酒按规矩进行[a]，没有人被强迫饮酒[b]；因为王已吩咐王宫中所有主管，要照每个人[c]的意愿办理。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“按规定进行”。原文用词可指法律、法令或正式规则。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“没有强迫”，意思是没有人被迫饮酒。
    reason: lexical_alternative
  - marker: c
    text: 原文为“人和人”，是逐一分配的表达，意思是每一个人。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַשְּׁתִיָּה
  choice: 饮酒
  rationale: 该名词具体指宴席中的饮酒活动；译为“饮酒”简明自然，又不扩大为整个宴会。
- source_word: כַדָּת
  choice: 按规矩进行
  rationale: דָּת 可指法律、法令或正式规定；本节语境侧重宴饮的既定规程，因此“按规矩进行”比“依法”更自然，同时保留正式规则之意。
- source_word: אֵין אֹנֵס
  choice: 不可强迫
  rationale: 原文直陈“没有强迫”；汉语用“不可强迫”自然表达席间无人被迫饮酒的规定，且不补入原文未明说的施事者。
- source_word: כִּי כֵן
  choice: 因为
  rationale: 该组合引出前述不强迫之所以实行的原因；汉语以“因为”清楚连接王的命令。
- source_word: יִסַּד
  choice: 曾吩咐
  rationale: 该动词本义涉及设立、奠定；在宫廷行政语境中表示定下并发布安排，译作“曾吩咐”符合实际语用。
- source_word: עַל כָּל רַב בֵּיתוֹ
  choice: 宫中所有主管
  rationale: רַב 指居上位者或主管；בֵּיתוֹ 在此为王室、宫廷范围。“宫中所有主管”兼顾职分和场景。
- source_word: לַעֲשׂוֹת כִּרְצוֹן
  choice: 要照……的意愿行事
  rationale: 保留“做/行”与“意愿”的结构，同时以现代汉语清楚表达主管应按宾客个人意愿办理。
- source_word: אִישׁ וָאִישׁ
  choice: 各人
  rationale: 这是希伯来语的逐一分配表达，意为每一个人；“各人”简洁保留个体性的重点。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“按规矩进行”传达宫廷宴饮有正式规程，却避免让“依法饮酒”产生现代法律术语的生硬感；分号保留原文前述政策与后述王命之间的因果层次。
