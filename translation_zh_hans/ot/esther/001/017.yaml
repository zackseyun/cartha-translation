base_translation:
  language: en
  yaml_path: translation/ot/esther/001/017.yaml
  text: For the queen’s matter will go out to all women, causing them to despise their husbands in their eyes, when they say, ‘King Ahasuerus said to bring Queen Vashti before him, but she did not come.’
translation:
  language: zh_hans
  text: 因为王后的事必传到所有妇女耳中，使她们轻视自己的丈夫，说：“亚哈随鲁王说要把瓦实提王后带到他面前，她却没有来。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דְבַר הַמַּלְכָּה
  choice: 王后的事
  rationale: דָּבָר在此可指事情、事件或言行；译作“王后的事”保留原文较宽泛的表达，不把含义限定为“行为”或“消息”。
- source_word: יֵצֵא ... עַל כָּל הַנָּשִׁים
  choice: 必传到所有妇女耳中
  rationale: 字面为“必出去到所有妇女那里”，语境所指是事情广为传开；中文以“传到……耳中”自然表达传播含义。
- source_word: לְהַבְזוֹת בַּעְלֵיהֶן בְּעֵינֵיהֶן
  choice: 使她们轻视自己的丈夫
  rationale: בזה意为轻看、蔑视；“在她们眼中”是希伯来语表达判断和看待的方式，中文“轻视”已自然涵盖此义，避免生硬重复。
- source_word: אָמַר לְהָבִיא
  choice: 说要把……带来
  rationale: 保留אָמַר“说”而不强化为“命令”；不定式לְהָבִיא表达让人把王后带到王面前。
- source_word: וְלֹא בָאָה
  choice: 她却没有来
  rationale: 直译并保留叙述的简洁和转折力度。
theological_decisions:
- issue: 是否把王后的事具体化为不顺服或失德行为
  choice: 保留宽泛的“王后的事”
  alternative: 王后的行为／王后的所作所为
  rationale: 原文דְבַר具有语义宽度；本节陈述米母干的政治判断，并未在该短语中直接作神学或道德定性。
- issue: 是否将王的话译为正式命令
  choice: “说要把……带来”
  alternative: “命令把……带来”
  rationale: 原文使用אָמַר“说”，故不添加更强的权威语气；王命的语境仍可由上下文体现。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。人名依常见《以斯帖记》中文译名作“亚哈随鲁”“瓦实提”。引语层次清楚，不添加原文没有的道德评价。
