  yaml_path: translation/ot/esther/001/009.yaml
  text: Queen Vashti also gave a feast for the women in the royal house that belonged to King Ahasuerus[a][b].
translation:
  language: zh_hans
  text: 王后瓦实提也在亚哈随鲁王的王宫里，为妇女们设宴[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “宴”也可译作“筵席”；希伯来语此词常指伴有饮酒的宴席。
    reason: lexical_alternative
  - marker: b
    text: “王宫”直译为“王室的房屋”或“王权的房屋”。
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: 也
  rationale: 承接前文王所设的宴席，表明瓦实提另为妇女设宴。
- source_word: וַשְׁתִּי הַמַּלְכָּה
  choice: 王后瓦实提
  rationale: 按现代汉语习惯，将头衔置于人名前；专名采用中文圣经中通行的译名“瓦实提”。
- source_word: עָשְׂתָה מִשְׁתֵּה
  choice: 设宴
  rationale: עָשְׂתָה字面为“做、举行”，与מִשְׁתֵּה连用时，汉语自然表达为“设宴”，既简洁又保留举行宴席之意。
- source_word: נָשִׁים
  choice: 为妇女们
  rationale: 说明宴席的对象或与宴者；“妇女们”自然明确，不额外推断其具体身份。
- source_word: בֵּית הַמַּלְכוּת
  choice: 王宫里
  rationale: 该短语字面为“王权／王室之房屋”，在本语境指王宫；正文采用自然现代汉语，脚注保留较直译的可能。
- source_word: אֲשֶׁר לַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ
  choice: 亚哈随鲁王的
  rationale: 希伯来文关系从句表达所属关系，汉语以领属结构自然呈现。
- source_word: אֲחַשְׁוֵרוֹשׁ
  choice: 亚哈随鲁
  rationale: 采用中文圣经传统中广为人知的音译。
