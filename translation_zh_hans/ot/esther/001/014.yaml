base_translation:
  language: en
  yaml_path: translation/ot/esther/001/014.yaml
  text: And those closest to him were Carshena[a], Shethar, Admatha, Tarshish, Meres, Marsena, and Memucan[b], the seven officials of Persia and Media who saw the king’s face and sat first in the kingdom.
translation:
  language: zh_hans
  text: 在王身边最亲近的，有甲示拿、示达、押玛他、他施斯、米力、玛西拿和米母干。他们是波斯和米底的七位大臣，得以见王的面[a]，在国中坐在首位[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “见王的面”是宫廷用语，指获准直接觐见王、进入王面前。
    reason: cultural_note
  - marker: b
    text: 也可译作“在国中位居最高的职位”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַקָּרֹב אֵלָיו
  choice: 在王身边最亲近的，有
  rationale: 原文“亲近”在形态上是单数，但后接七人名单，具有集合性。译为“最亲近的”既保留亲近程度，也自然引出多人名单。
- source_word: כַּרְשְׁנָא שֵׁתָר אַדְמָתָא תַרְשִׁישׁ מֶרֶס מַרְסְנָא מְמוּכָן
  choice: 甲示拿、示达、押玛他、他施、米力、玛西拿和米母干
  rationale: 均为人名，采用现代中文圣经读者较熟悉的传统音译形式，不赋予词义解释。
- source_word: שִׁבְעַת שָׂרֵי
  choice: 七位大臣
  rationale: שָׂרֵי 指身居高位的统治者或官员；“大臣”符合宫廷语境，也避免“王子”可能带来的血统含义。
- source_word: פָּרַס וּמָדַי
  choice: 波斯和米底
  rationale: 指帝国中的两个政治地域名称，采用中文通行译名。
- source_word: רֹאֵי פְּנֵי הַמֶּלֶךְ
  choice: 得以见王的面
  rationale: 保留原文“见王的面”的具体宫廷表达，同时用“得以”显示这是一种获准亲近君王的特权。
- source_word: הַיֹּשְׁבִים רִאשֹׁנָה בַּמַּלְכוּת
  choice: 在国中坐首席
  rationale: 保留“坐”与席位次序的意象，表达这些人在王国行政体系中居于最高等级。
theological_decisions: []
