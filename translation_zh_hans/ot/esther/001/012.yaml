base_translation:
  language: en
  yaml_path: translation/ot/esther/001/012.yaml
  text: But Queen Vashti refused to come at the king’s command by the hand of the eunuchs[a], and the king became very angry[b], and his wrath burned within him.
translation:
  language: zh_hans
  text: 王后瓦实提却不肯遵从王借太监传达的命令前来[a]。王就十分愤怒，他的怒火在心中燃烧[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译为“照王借太监之手所传的话前来”；“借……之手”表示王的命令由他们转达。
    reason: lexical_alternative
  - marker: b
    text: 也可译为“他的烈怒在他里面燃烧”。希伯来原文保留了以火比喻愤怒的形象。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּמָאֵן
  choice: 却不肯
  rationale: מאן表示明确拒绝或不愿意；“不肯”自然地保留了主动拒绝的语气，“却”承接并突出与王命相反的行动。
- source_word: הַמַּלְכָּה וַשְׁתִּי
  choice: 王后瓦实提
  rationale: 按现代汉语将头衔置于人名前，兼顾身份与姓名。
- source_word: לָבוֹא
  choice: 前来
  rationale: בוא在王召见的语境中表示来到王所在之处；“前来”比单纯“来”更符合庄重叙事语体。
- source_word: בִּדְבַר הַמֶּלֶךְ
  choice: 照王……所传的命令
  rationale: דבר在此指王的命令，而非泛指言语；介词ב表达依据，译为“照”。
- source_word: אֲשֶׁר בְּיַד הַסָּרִיסִים
  choice: 借太监之手所传
  rationale: 保留“借……之手”的希伯来语媒介表达，同时用“所传”说明命令由这些宫廷太监转达。סָרִיסִים在波斯宫廷语境下通常指太监。
- source_word: וַיִּקְצֹף ... מְאֹד
  choice: 就非常愤怒
  rationale: קצף表示发怒，מְאֹד加强程度；“非常愤怒”准确而符合现代汉语。
- source_word: וַחֲמָתוֹ בָּעֲרָה בוֹ
  choice: 怒火在他里面燃烧
  rationale: 保留חֵמָה与בער构成的火焰意象，也按בוֹ直译为内在位置，不将其改解为针对某个外在对象。
