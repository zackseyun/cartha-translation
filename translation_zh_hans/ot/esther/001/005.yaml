base_translation:
  language: en
  yaml_path: translation/ot/esther/001/005.yaml
  text: And when these days were completed[a], the king gave a banquet for all the people who were present in Susa the citadel, from great to small, for seven days[d][c][b], in the court of the garden of the king’s palace.
translation:
  language: zh_hans
  text: 这些日子结束后，王为所有在书珊城堡[a]的人，不分尊卑[b]，设宴[c]七天，在王宫[d]花园的庭院里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “书珊城堡”也可译作“书珊王城”或“书珊卫城”。原词指设防的城堡或卫城区域。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“从大的直到小的”，是指各个等级、各种身份的人。
    reason: idiom_clarification
  - marker: c
    text: “设宴”所对应的希伯来词常指以饮酒为重要内容的宴席。
    reason: lexical_clarification
  - marker: d
    text: “王宫”所译的词也可理解为“宫室”“房屋”或“亭阁”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִמְלֹאות הַיָּמִים הָאֵלֶּה
  choice: 这些日子结束后
  rationale: ב 加不定式构成时间从句，表示前述日子完结之时；译文自然承接上文，同时保留“这些日子”的近指意义。
- source_word: עָשָׂה ... מִשְׁתֶּה
  choice: 设宴
  rationale: עָשָׂה 与 מִשְׁתֶּה 搭配，惯用义是举办宴席；“设宴”简洁、庄重，也符合王室场景。
- source_word: לְכָל הָעָם הַנִּמְצְאִים
  choice: 为所有……的人
  rationale: 这里的 הַנִּמְצְאִים 指身在或当时在场于某地的人，不必按字面译为“被找到的人”。
- source_word: בְּשׁוּשַׁן הַבִּירָה
  choice: 在书珊城堡
  rationale: בִּירָה 指设防的城堡、卫城或王城区域；“书珊城堡”兼顾地名与防御性王城的含义。
- source_word: לְמִגָּדוֹל וְעַד קָטָן
  choice: 不分尊卑
  rationale: 原文直译为“从大的直到小的”，在此是涵盖不同社会地位者的惯用表达；“不分尊卑”自然传达其包举意义。
- source_word: שִׁבְעַת יָמִים
  choice: 七天
  rationale: 直接表达宴席持续的时间。
- source_word: בַּחֲצַר גִּנַּת בִּיתַן הַמֶּלֶךְ
  choice: 在王宫花园的庭院里
  rationale: 保留原文由“庭院—花园—王的宫室”构成的空间关系，并按现代汉语习惯调整修饰次序。
- source_word: בִּיתַן
  choice: 王宫
  rationale: 这是一个含义并非完全确定的波斯借词，可指宫室、房屋或亭阁；王室语境下以“王宫”最为清楚自然，同时用脚注保留其他可能。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“又”承接前文叙事；“设宴”“不分尊卑”符合现代汉语表达。对 בִּירָה、מִשְׁתֶּה 和 בִּיתַן 的词义幅度以脚注保留，避免在正文中过度解释。
