base_translation:
  language: en
  yaml_path: translation/ot/esther/001/021.yaml
  text: The matter pleased the king and the officials[b][a], and the king did according to the word of Memucan.
translation:
  language: zh_hans
  text: 王和众官员都认为这事很好[a]，王就照米母干所说的去做了[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这事在王和众官员眼中是好的。”也可按语境译为“王和众官员都认为这个提议很好”。
    reason: lexical_alternative
  - marker: b
    text: 直译：“王就照米母干的话去做了”；这里“话”指米母干所提出的建议。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּיטַב ... בְּעֵינֵי
  choice: 在……眼中看为好
  rationale: 保留希伯来语“在某人眼中为好”的评价性习语，同时符合现代中文表达；语境上也可理解为“认为这个提议很好”。
- source_word: הַדָּבָר
  choice: 这事
  rationale: דָּבָר可指“话、事、提议”；此处回指米母干刚提出的主张，“这事”自然且不过度限定。
- source_word: וְהַשָּׂרִים
  choice: 和众官员
  rationale: שָׂרִים指宫廷中的高官或首领；“众官员”适合波斯宫廷语境，也比“王子”准确。
- source_word: וַיַּעַשׂ
  choice: 去做了
  rationale: 对应常用动词עָשָׂה“做、实行”，并由下文说明行动依据。
- source_word: כִּדְבַר מְמוּכָן
  choice: 照米母干的话
  rationale: 较贴近字面“按照米母干的话”，同时中文自然；语境中所指是他的建议，但正文不将该词义窄化。
- source_word: מְמוּכָן
  choice: 米母干
  rationale: 采用现代中文圣经人名的通行音译。
