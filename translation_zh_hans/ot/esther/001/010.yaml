base_translation:
  language: en
  yaml_path: translation/ot/esther/001/010.yaml
  text: On the seventh day[a], when the king’s heart was merry with wine, he told Mehuman, Biztha, Harbona, Bigtha, Abagtha, Zethar[b], and Karkas—the seven eunuchs who attended King Ahasuerus—
translation:
  language: zh_hans
  text: 第七天，王因酒而心中快活[a]，就对米户幔、比斯他、哈波拿、比革他、亚拔他、西达和甲迦这七个侍立在亚哈随鲁王面前的太监[b]说——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译可作“王的心因酒而畅快”。这句希伯来语惯用语表示王因酒而心情快活，但没有明说他已经喝醉。
    reason: lexical_alternative
  - marker: b
    text: “太监”一词在某些语境中也可较宽泛地指王宫官员；正文保留其较直接的词义。
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: 第七天
  rationale: 原文只标明“第七天”，未在本节明说是筵席的第七天，因此不补入解释性成分。
- source_word: כְּטוֹב לֵב הַמֶּלֶךְ בַּיָּיִן
  choice: 王因酒而心中快活
  rationale: 保留希伯来语以“心”为主体的表达，并表明快活与酒有关；不译作“喝醉”，以免超出原文明确所说。
- source_word: אָמַר
  choice: 就对……说
  rationale: אָמַר是普通的“说”；命令的具体内容始于下一节，所以本节不提前译作“命令”或“吩咐”。
- source_word: לִמְהוּמָן בִּזְּתָא חַרְבוֹנָא בִּגְתָא וַאֲבַגְתָא זֵתַר וְכַרְכַּס
  choice: 米户幔、比斯他、哈波拿、比革他、亚拔他、西达和甲迦
  rationale: 人名按希伯来语形式音译，并采用现代中文圣经读者较熟悉的通行写法。
- source_word: שִׁבְעַת הַסָּרִיסִים
  choice: 七个太监
  rationale: סָרִיס在王宫语境中的直接词义是受阉的宫廷侍从，故正文采用“太监”；脚注保留其也可泛指宫廷官员的可能性。
- source_word: הַמְשָׁרְתִים אֶת פְּנֵי
  choice: 侍候在……面前
  rationale: 兼顾“服侍”与“在某人面前”的原文结构，呈现这些人贴身供职于王前的宫廷身份。
- source_word: הַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ
  choice: 亚哈随鲁王
  rationale: 采用现代汉语中自然的称号后置语序，并沿用该王名的通行中文音译。
