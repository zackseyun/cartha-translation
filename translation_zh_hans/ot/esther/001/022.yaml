base_translation:
  language: en
  yaml_path: translation/ot/esther/001/022.yaml
  text: And he sent letters to all the provinces of the king[a], to each province in its own script and to each people in its own language[d][c][b], that every man should be master in his own house and speak the language of his own people.
translation:
  language: zh_hans
  text: 他把文书送到王的各省[a]：给每一省的文书都按该省的文字写成，给每一族的文书都按该族的语言写成[b]；文书规定，每个男子[c]都要在自己家中作主，并按自己民族的语言说话[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“王所属的各省”。
    reason: lexical_alternative
  - marker: b
    text: 原文用逐一列举的方式，强调发给各省的文书按该省的文字写成，发给各族的文书按该族的语言写成。
    reason: cultural_note
  - marker: c
    text: 也可按上下文译作“每一位丈夫”。原文直译为“每个男子”；本段涉及婚姻和家庭中的权柄。
    reason: lexical_alternative
  - marker: d
    text: 末句直译为“并按他民族的语言说话”。这可能指每个男子说自己民族的语言，也可能较宽泛地关联到以丈夫的语言为家庭规范；原文没有说明具体如何实行。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: 他把……送到
  rationale: 该叙事性动词承接上文，主语由语境确定；现代汉语无需机械译出句首连接词。
- source_word: סְפָרִים
  choice: 诏书
  rationale: 此处指奉王命发往帝国各省的正式书面命令；“诏书”比泛称“书信”更符合王室行政语境。
- source_word: כָּל מְדִינוֹת הַמֶּלֶךְ
  choice: 王的各省
  rationale: 贴近原文所属结构，同时在现代汉语中自然简洁。
- source_word: אֶל מְדִינָה וּמְדִינָה כִּכְתָבָהּ
  choice: 每省采用本省的文字
  rationale: 希伯来语重复单数表达逐一分配；“文字”在这里指各省所使用的书写系统或书面形式。
- source_word: וְאֶל עַם וָעָם כִּלְשׁוֹנוֹ
  choice: 每族采用本族的语言
  rationale: 保留“省—文字、族—语言”的平行结构；עַם 在多族群帝国语境中译作“族”较自然。
- source_word: לִהְיוֹת
  choice: 宣告……都要
  rationale: 不定式在这里引出诏令的内容或目的；“宣告……都要”符合汉语诏令语体。
- source_word: כָּל אִישׁ
  choice: 各人
  rationale: 形式上是“每个男人”；译文保留简洁措辞，并以脚注说明婚姻与家庭语境中也可理解为“各作丈夫的”。
- source_word: שֹׂרֵר בְּבֵיתוֹ
  choice: 在自己家中作主
  rationale: 分词表示掌权、管辖；“作主”自然传达家庭内部的主导权，同时避免加入原文没有的制度化术语。
- source_word: וּמְדַבֵּר כִּלְשׁוֹן עַמּוֹ
  choice: 并说本族的语言
  rationale: 按马所拉文本直接理解为命令男子使用自己族群的语言；保留该末句与家庭秩序之间略显突兀的张力。
theological_decisions:
- issue: 家庭权柄的对象与范围
  choice: 译为“各人都要在自己家中作主”
  alternative: “各作丈夫的都要管理自己的家”
  rationale: אִישׁ 基本义为男人或个人，语境则涉及婚姻家庭。正文不过度限定为“丈夫”，脚注呈现语境性译法，以免把解释直接写进正文。
- issue: 末句与家庭秩序的关系
  choice: 直译为“并说本族的语言”
  alternative: 把它宽泛解释为家庭秩序应以丈夫的族群语言为准
  rationale: 原文确实提到“说他本族的语言”，但没有明确说明谁必须采用这种语言，或它如何落实家庭权柄；正文保留原文的不明确性。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“诏书”“各省”“每族”体现波斯帝国的行政语境；“作主”保留原文关于家庭权柄的力度，但不添加宗派性解释。所有脚注标记均置于对应正文位置。
