  text: אִם עַל הַ/מֶּ֣לֶךְ ט֗וֹב יֵצֵ֤א דְבַר מַלְכוּת֙ מִ/לְּ/פָנָ֔י/ו וְ/יִכָּתֵ֛ב בְּ/דָתֵ֥י פָֽרַס וּ/מָדַ֖י וְ/לֹ֣א יַעֲב֑וֹר אֲשֶׁ֨ר לֹֽא תָב֜וֹא וַשְׁתִּ֗י לִ/פְנֵי֙ הַ/מֶּ֣לֶךְ אֲחַשְׁוֵר֔וֹשׁ וּ/מַלְכוּתָ/הּ֙ יִתֵּ֣ן הַ/מֶּ֔לֶךְ לִ/רְעוּתָ֖/הּ הַ/טּוֹבָ֥ה מִמֶּֽ/נָּה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/001/019.yaml
  text: 'If it seems good to the king[a], let a royal decree go out from before him and be written among the laws of Persia and Media, so that it may not be revoked: that Vashti is not to come before King Ahasuerus[c][b], and let the king give her royal position to another woman better than she.'
translation:
  language: zh_hans
  text: 王若以为好[a]，就请由王颁布一道王令，写入波斯和米底亚的律法中，不得废除[b]：瓦实提不可到亚哈随鲁王面前；并将她的王后之位[c]赐给另一个比她更好的女子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“王若喜悦。”
    reason: 保留宫廷套语 אִם עַל־הַמֶּלֶךְ טוֹב 的另一种自然译法。
  - marker: b
    text: 或译：“不得更改”或“不得违犯”。原文这一法律用语强调王令具有不可改变的效力。
    reason: וְלֹא יַעֲבוֹר 的字面和语境含义有一定幅度，正文采用“不得废除”，脚注保留其他可能译法。
  - marker: c
    text: 原文直译为“她的王权”或“她的王后身份”。
    reason: 说明 מַלְכוּתָהּ 在本处并非指疆土，而是王后的身份和职位。
lexical_decisions:
- source_word: אִם עַל־הַמֶּלֶךְ טוֹב
  choice: 王若以为好
  rationale: 保留宫廷提议的恭敬语气，也贴近希伯来语“在王看来为好”的表达；现代中文虽略庄重，但清楚自然。
- source_word: יֵצֵא דְבַר מַלְכוּת מִלְּפָנָיו
  choice: 就请从王面前颁布一道王令
  rationale: “王令”体现 דְבַר מַלְכוּת 的正式法律效力；“从王面前”保留 מִלְּפָנָיו 的宫廷空间与权威色彩。
- source_word: וְיִכָּתֵב בְּדָתֵי פָרַס וּמָדַי
  choice: 写入波斯和米底亚的律法中
  rationale: 表达该命令被正式纳入既有法律体系，并依原文保留“波斯和米底亚”的次序。
- source_word: וְלֹא יַעֲבוֹר
  choice: 不得废除
  rationale: 在法律语境中指命令不得撤销或使之失效；正文采用自然明确的“不得废除”，脚注保留其他可能含义。
- source_word: אֲשֶׁר לֹא תָבוֹא וַשְׁתִּי לִפְנֵי הַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ
  choice: 瓦实提不可再到亚哈随鲁王面前
  rationale: 此从句说明王令的内容。“不可再到”在中文中自然表达今后被禁止晋见；“再”属于语境蕴含，并非另加一次具体事件。
- source_word: וּמַלְכוּתָהּ
  choice: 她的王后之位
  rationale: 此处 מַלְכוּת 指瓦实提作为王后的身份或职位，而不是她统治的疆域；“王后之位”最符合本段语境。
- source_word: לִרְעוּתָהּ הַטּוֹבָה מִמֶּנָּה
  choice: 另一个比她更好的女子
  rationale: רְעוּתָהּ 在替换王后的语境中指另一名女子；הַטּוֹבָה מִמֶּנָּה 只作概括性比较，不擅自说明“更好”的具体标准。
