  naturalness: “他在位第三年”“设宴”“贵族”自然得体。“臣仆”在庄重的宫廷叙事中可用，但略偏文言；仍不构成错误。改用破折号连接名单，可使汉语句法清楚，并避免分号造成的断裂。
