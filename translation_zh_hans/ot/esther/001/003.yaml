  to: 他在位第三年，为所有大臣和臣仆设宴[a]——波斯和米底的军队[b]、贵族和各省官长都在他面前[c]。
  rationale: 以破折号替换分号，使后面的军事力量、贵族和省级官长明确仍是“为……设宴”的受邀群体，同时保留“都在他面前”所表达的宫廷列席情境。将“各省大臣”改为“各省官长”，避免对未明确的省级职位作过细限定。脚注锚点与内容均保留，且各自仍对应相关词语。
