base_translation:
  language: en
  yaml_path: translation/ot/esther/001/003.yaml
  text: In the third year of his reign[a], he gave a banquet for all his officials and servants—the army of Persia and Media, the nobles[c][b], and the officials of the provinces before him.
translation:
  language: zh_hans
  text: 他在位第三年，为所有大臣和臣仆设宴[a]——波斯和米底的军队[b]、贵族和各省官长都在他面前[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “宴”所译的希伯来词常指以饮酒和庆贺为特色的筵席。
    reason: lexical_alternative
  - marker: b
    text: “军队”也可译作“军力”；原词还可表示实力。
    reason: lexical_alternative
  - marker: c
    text: 意思是他们都在王面前，也就是在场列席。
    reason: clarification
lexical_decisions:
- source_word: בִּשְׁנַת שָׁלוֹשׁ לְמָלְכוֹ
  choice: 他在位第三年
  rationale: 该短语表示君王统治时期中的第三年；此译法符合现代汉语的纪年表达，也不把它误解为登基之时。
- source_word: עָשָׂה מִשְׁתֶּה
  choice: 设宴
  rationale: עָשָׂה 与 מִשְׁתֶּה 连用时表示举办宴饮；“设宴”简洁自然，并保留王宫宴会的正式语体。
- source_word: לְכָל שָׂרָיו וַעֲבָדָיו
  choice: 为所有大臣和臣仆
  rationale: שָׂרִים 指有权位的官长；עֲבָדִים 在宫廷语境中主要指王的臣属或侍从，译作“臣仆”可避免无根据地限定为奴隶。
- source_word: חֵיל פָּרַס וּמָדַי
  choice: 波斯和米底的军队
  rationale: חֵיל 可指军力、军队或实力；在这份宫廷政治人物的名单中，“军队”保留其最直接的军事含义，同时以脚注提示词义范围。
- source_word: הַפַּרְתְּמִים
  choice: 贵族
  rationale: 这个波斯语借词指身份显赫的高阶贵胄；“贵族”是清楚、简练而不过度细分官职的译法。
- source_word: וְשָׂרֵי הַמְּדִינוֹת
  choice: 和各省大臣
  rationale: שָׂרֵי 在此泛指各省的官长；“大臣”保持与前文相称的正式语体，又不擅自规定为“省长”。
- source_word: לְפָנָיו
  choice: 都在他面前
  rationale: 直译保留希伯来语的宫廷空间意象，同时自然表达这些人列席于王面前。
theological_decisions: []
