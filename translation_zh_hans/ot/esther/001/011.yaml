base_translation:
  language: en
  yaml_path: translation/ot/esther/001/011.yaml
  text: to bring Queen Vashti before the king with the royal crown[a], to show the peoples and the officials her beauty[c][b], for she was beautiful in appearance.
translation:
  language: zh_hans
  text: 要把戴着王冠的王后瓦实提带到王面前，让各族人民和官员观看她的美貌，因为她容貌美丽。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְהָבִיא
  choice: 带到
  rationale: 该词是בוא的使役式不定词，表示使某人来到某处；“带到王面前”在现代汉语中直接自然。
- source_word: וַשְׁתִּי הַמַּלְכָּה
  choice: 王后瓦实提
  rationale: 按现代汉语习惯将身份称号置于人名前，同时保留其王后身份。
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: 到王面前
  rationale: לִפְנֵי意为“在……面前、在……跟前”；此处与“带到”连用，准确表达进入王面前。原文仅称“王”，未重复其名字。
- source_word: בְּכֶתֶר מַלְכוּת
  choice: 戴着王冠
  rationale: 介词בְּ可表达伴随状态；上下文最自然的理解是王后头戴王冠出现在众人面前。脚注保留较贴近形式而不明说佩戴动作的译法。
- source_word: לְהַרְאוֹת
  choice: 让……观看
  rationale: ראה的使役式表示“使看见、展示”。“让各族人民和官员观看她的美貌”既保留使役意义，也符合现代汉语表达。
- source_word: הָעַמִּים
  choice: 各族人民
  rationale: 原文为复数“众民、各族人民”，在波斯帝国背景下可能指多个臣属族群；“各族人民”自然地保留复数含义。
- source_word: וְהַשָּׂרִים
  choice: 和官员
  rationale: שָׂרִים指统治者、高官或权贵；“官员”避免误解为王室子弟，并适合宫廷语境。
- source_word: יָפְיָהּ
  choice: 她的美貌
  rationale: 该抽象名词带第三人称阴性单数后缀，直指她可供观看的外在美丽。
- source_word: כִּי טוֹבַת מַרְאֶה הִיא
  choice: 因为她容貌美丽
  rationale: כִּי引出原因；טוֹבַת מַרְאֶה字面为“外貌是好的”，是指外表美丽的希伯来语习语。“容貌美丽”准确而自然。
