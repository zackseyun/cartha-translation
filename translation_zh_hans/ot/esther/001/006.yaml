  to: 悬挂着白色棉布和蓝色织物的帷幔，用由细麻和紫色织物制成的绳索系在银环[a]和大理石柱上；又有金银卧榻[b]，摆在以雪花石、大理石、珍珠母和宝石铺成的地面上。[c]
