base_translation:
  language: en
  yaml_path: translation/ot/esther/001/006.yaml
  text: There were hangings of white cotton and blue[a], fastened with cords of fine linen and purple to silver rings and marble pillars, and couches of gold and silver on a pavement of alabaster, marble, mother-of-pearl[c][b], and precious stones.
translation:
  language: zh_hans
  text: 悬挂着白色棉布和蓝色织物的帷幔，用由细麻和紫色织物制成的绳索系在银环[a]和大理石柱上；又有金银卧榻[b]，摆在以雪花石、大理石、珍珠母和宝石铺成的地面上。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “银环”也可译作“银杆”；原文所指可能泛指圆形或卷成的银制构件。
    reason: lexical_alternative
  - marker: b
    text: “卧榻”指宴席上供人斜倚的榻，不是普通睡床。
    reason: cultural_note
  - marker: c
    text: 铺地材料的确切种类不能完全确定。这里译作“雪花石、大理石、珍珠母和宝石”，也有学者译作“斑岩、白大理石、深色石”等。
    reason: lexical_alternative
lexical_decisions:
- source_word: חוּר כַּרְפַּס וּתְכֵלֶת
  choice: 白色棉布和蓝色布幔
  rationale: חוּר在此最可能表示白色，כַּרְפַּס可能指棉布，תְכֵלֶת指贵重的蓝色或蓝紫色织物；译文用自然的现代汉语表达帷幔的颜色和质料。
- source_word: אָחוּז בְּחַבְלֵי בוּץ וְאַרְגָּמָן
  choice: 用细麻绳和紫色绳系
  rationale: אָחוּז表示固定、系住；בּוּץ为细麻，אַרְגָּמָן为紫色染料或紫色织物。补出“绳”使两项并列在中文中清楚自然，同时不把具体材质解释得过细。
- source_word: גְּלִילֵי כֶסֶף
  choice: 银环
  rationale: גְּלִילִים字面涉及圆形或卷成的物件；在悬挂布幔的语境中，“银环”最容易理解，但确切形制不明，故加脚注保留“银杆”等可能。
- source_word: עַמּוּדֵי שֵׁשׁ
  choice: 大理石柱
  rationale: 这里的שֵׁשׁ指白色石材而非细麻；“大理石柱”符合建筑语境，具体石种仍有不确定性。
- source_word: מִטּוֹת זָהָב וָכֶסֶף
  choice: 金银卧榻
  rationale: מִטּוֹת在宴席语境中指供人斜倚的榻，而非普通睡床；“卧榻”简洁地保留古代宴饮习俗。
- source_word: רִצְפַת
  choice: 铺成的地面
  rationale: 指铺设完成的地面或铺石地面；用“铺成的地面”既自然，也避免把它过度具体化为马赛克。
- source_word: בַּהַט וָשֵׁשׁ וְדַר וְסֹחָרֶת
  choice: 雪花石、大理石、珍珠母和宝石
  rationale: 这组铺地材料中若干词义罕见且有争议；正文采用常见学术辨认，脚注明示其他可能，避免掩盖原文的不确定性。
