base_translation:
  language: en
  yaml_path: translation/ot/esther/001/015.yaml
  text: According to the law[c][b][a], what is to be done with Queen Vashti because she did not carry out the command of King Ahasuerus delivered by the eunuchs?
translation:
  language: zh_hans
  text: 按律法，因瓦实提王后没有执行[c]亚哈随鲁王借太监[a][b]传达的命令，应当怎样处置她呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“经由太监”；原文直译为“在太监之手”。
    reason: lexical_alternative
  - marker: b
    text: 这里译作“太监”的希伯来语也可较宽泛地指宫廷官员，不过“太监”是较直接的译法。
    reason: cultural_note
  - marker: c
    text: 或译：“没有听从亚哈随鲁王的命令”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּדָת
  choice: 按律法
  rationale: דָּת在《以斯帖记》的波斯宫廷语境中通常指具有约束力的律法或法令；“按律法”保留了正式的司法语气。
- source_word: מַה לַּעֲשׂוֹת
  choice: 应当怎样处置
  rationale: 该不定式结构询问应采取什么行动；“应当怎样处置”在现代汉语中自然地表达针对王后的司法处置，同时保留商议语气。
- source_word: בַּמַּלְכָּה וַשְׁתִּי
  choice: 处置瓦实提王后
  rationale: 介词与“做”连用，表示对某人采取行动；汉语用“处置”较为自然，但不额外说明惩罚的具体形式。
- source_word: עַל אֲשֶׁר לֹא עָשְׂתָה
  choice: 因……没有执行
  rationale: עַל אֲשֶׁר说明采取行动的缘由；“没有执行”贴近“没有做”的基本意义，也能与王命自然搭配，而不在正文中强化为“悖逆”。
- source_word: מַאֲמַר
  choice: 命令
  rationale: מַאֲמַר可指话语或命令；在君王发令的语境中，“命令”最能体现其权威性质。
- source_word: הַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ
  choice: 亚哈随鲁王
  rationale: 翻译君王称号，并按本项目惯例音译专名。
- source_word: בְּיַד הַסָּרִיסִים
  choice: 借太监传达
  rationale: 原文直译为“在太监之手”，是表示代理或传递的惯用语；“借太监传达”在汉语中自然呈现其媒介作用。סָרִיסִים直接指向“太监”，但也可能泛指宫廷官员，故以脚注保留这一可能。
