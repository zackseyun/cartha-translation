    rationale: נַעֲרָה可指年轻女子；“年轻女子”较中性，也符合现代庄重叙事语体。
  revised_text: 这年轻女子便这样去见王：凡她所要求的[a]，都给她，让她从女子居所[b]带到王宫去。
