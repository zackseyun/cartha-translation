- from: 少女就是这样去见王：她无论提出要什么，都要给她，让她从女院带着前往王宫[a][b]。
  to: 这年轻女子便这样去见王：凡她所要求的[a]，都给她，让她从女子居所[b]带到王宫去。
  rationale: 修订解决了“带着前往”的悬置表达，并将脚注锚定在相应词语上。“凡她所要求的”在正文中自然表达上下文所指，同时脚注保留希伯来文“她所说的一切”的字面措辞，避免把语境解释误作原文的唯一词义。
