  naturalness: 原译“让她从女院带着前往王宫”中“带着”缺少明确的宾语，现代汉语读来悬置且不顺。改为“让她从女子居所带到王宫去”，使省略的宾语可由“凡她所要求的”自然承接。
  terminology: 将“少女”调整为“年轻女子”，较贴近נַעֲרָה而不额外限定为较低年龄。以“女子居所”对应“众女子之家”，并在脚注交代其为宫中女子居住的区域；“王宫”在此宫廷语境中自然对应“王的家”。
