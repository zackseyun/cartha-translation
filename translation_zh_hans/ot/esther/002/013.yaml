base_translation:
  language: en
  yaml_path: translation/ot/esther/002/013.yaml
  text: 'And in this way the young woman went to the king: whatever she said would be given to her to take with her from the house of the women to the king’s house[a][b].'
translation:
  language: zh_hans
  text: 这年轻女子便这样去见王：凡她所要求的[a]，都给她，让她从女子居所[b]带到王宫去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “凡她所要求的”直译为“她所说的一切”；按这里的语境，是指她要求带去的东西。
    reason: lexical_alternative
  - marker: b
    text: “女子居所”直译为“众女子之家”，指宫中女子居住的区域。
    reason: cultural_note
lexical_decisions:
- source_word: וּבָזֶה
  choice: 就是这样
  rationale: 这里的介词与指示词构成承接上文的惯用表达，说明少女去见王的方式或程序；“就是这样”自然地衔接前文。
- source_word: הַנַּעֲרָה
  choice: 少女
  rationale: נַעֲרָה 指年轻女子；“少女”简洁、现代，也符合本段语境。
- source_word: בָּאָה אֶל־הַמֶּלֶךְ
  choice: 去见王
  rationale: בוא 与 אֶל 连用表示来到或前往某人那里；此处目的在觐见王，“去见王”符合现代汉语表达。
- source_word: אֵת כָּל אֲשֶׁר תֹּאמַר
  choice: 她无论提出要什么
  rationale: 字面是“她所说的一切”，但语境表明是她提出想带走的物品；“提出要什么”既保留说出要求的动作，也清楚表达语境含义。
- source_word: יִנָּתֵן לָהּ
  choice: 都要给她
  rationale: נתן 的尼法勒式为被动“给她”，未完成式在此表示惯常程序；“都要给她”自然体现这一规定。
- source_word: לָבוֹא עִמָּהּ
  choice: 让她……带着前往
  rationale: 字面意思是所给之物“与她一同进去”；汉语用“带着前往”可自然表达物品随她同行，而不添加具体物品名称。
- source_word: מִבֵּית הַנָּשִׁים
  choice: 从女院
  rationale: 字面为“从众女子之家”。结合宫廷语境，“女院”简洁地指女子居住的院所，又避免直接采用带有额外文化联想的“后宫”。
- source_word: עַד בֵּית הַמֶּלֶךְ
  choice: 前往王宫
  rationale: 字面为“直到王的家”；在宫廷语境中指王所居的宫殿，“王宫”是准确而自然的现代汉语表达。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“少女”与上下文人物身份相称；“女院”和“王宫”避免生硬直译，同时不引入原文未明说的制度性称谓。两个脚注标记均置于相应词语之后。
