id: EST.2.3
reference: Esther 2:3
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/יַפְקֵ֨ד הַ/מֶּ֣לֶךְ פְּקִידִים֮ בְּ/כָל מְדִינ֣וֹת מַלְכוּת/וֹ֒ וְ/יִקְבְּצ֣וּ אֶת כָּל נַעֲרָֽה בְ֠תוּלָה טוֹבַ֨ת מַרְאֶ֜ה אֶל שׁוּשַׁ֤ן הַ/בִּירָה֙ אֶל בֵּ֣ית הַ/נָּשִׁ֔ים אֶל יַ֥ד הֵגֶ֛א סְרִ֥יס הַ/מֶּ֖לֶךְ שֹׁמֵ֣ר הַ/נָּשִׁ֑ים וְ/נָת֖וֹן תַּמְרוּקֵי/הֶֽן־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/002/003.yaml
  text: Let the king appoint officers in all the provinces of his kingdom[a], and let them gather every young virgin of beautiful appearance to Susa the citadel, to the house of the women, into the custody of Hegai the king’s eunuch, keeper of the women[b]; and let their cosmetics be given to them.
translation:
  language: zh_hans
  text: 请王在他王国的各省任命官员，让他们把所有年轻、容貌美丽的处女召集到书珊城堡，送进女子居所[a]，交给王的宦官、主管女子的希该管理；并供应她们美容用品[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “女子居所”直译为“女人们的房舍”。按语境也可译作“后宫”，但原文用语本身较为中性。
    reason: lexical_alternative
  - marker: b
    text: “美容用品”也可译作“美容护理”。原词可泛指用于洁净和美容的制剂或护理。
    reason: lexical_alternative
lexical_decisions:
- source_word: יַפְקֵד
  choice: 委派
  rationale: 此处是פקד的使役式，指君王为特定任务任命或指派人员；“委派”自然体现行政授权。
- source_word: פְּקִידִים
  choice: 官员
  rationale: 指奉派执行王命的行政人员；“官员”不附加军事身份。
- source_word: מְדִינוֹת מַלְכוּתוֹ
  choice: 他国中的各省
  rationale: מְדִינוֹת是《以斯帖记》中波斯帝国的行政区划，“各省”是现代汉语中清楚自然的对应表达。
- source_word: וְיִקְבְּצוּ
  choice: 让他们……召集
  rationale: 延续建议语气，并表达把各地人选集中送往指定地点的行动。
- source_word: כָּל נַעֲרָה בְתוּלָה
  choice: 所有……年轻处女
  rationale: “年轻”保留נַעֲרָה的年龄信息，“处女”保留בְתוּלָה的明确限定。
- source_word: טוֹבַת מַרְאֶה
  choice: 容貌美丽的
  rationale: 保留原文“外貌好看”的视觉重点，同时符合现代汉语习惯。
- source_word: שׁוּשַׁן הַבִּירָה
  choice: 书珊王城
  rationale: הַבִּירָה在本书指设防的王室城堡或宫城区域；“王城”兼顾其王室行政中心和城堡性质，且表达简洁。
- source_word: בֵּית הַנָּשִׁים
  choice: 女眷宫
  rationale: 原文直译为“女人们的房舍”，在宫廷语境中特指安置王室女眷的区域；“女眷宫”既易懂又不使用带有额外文化联想的外来称谓。
- source_word: אֶל יַד הֵגֶא
  choice: 交由……希该看管
  rationale: “到某人手下”表示置于其管理或照管之下，译作“交由……看管”符合汉语习惯。
- source_word: סְרִיס
  choice: 太监
  rationale: 该词可泛指宫廷官员，但其基本义为阉人，且此处负责女眷；“太监”最符合具体宫廷语境。
- source_word: שֹׁמֵר הַנָּשִׁים
  choice: 主管女眷的
  rationale: 这是说明希该职务的分词短语；“主管”清楚表达其监管职责。
- source_word: וְנָתוֹן תַּמְרוּקֵיהֶן
  choice: 并把美容用品发给她们
  rationale: תַּמְרוּקִים可指用于美容洁身的制剂；“美容用品”简明而不把含义局限于现代彩妆，“发给”体现由宫廷供应。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。以“请王……让他们……”保留臣下提出方案的建议语气；人物与地名采用中文圣经传统中通行的“希该”“书珊”。脚注标记紧跟所解释的词语。
