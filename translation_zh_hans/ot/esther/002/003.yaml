    rationale: בֵּית הַנָּשִׁים 字面是“女人们的房舍/居所”。“宫”与“女眷”引入中国宫廷制度色彩，脚注又将其界定为“宫中安置女眷的区域”。宜用较透明的“女子居所”，并仅将“后宫”列为语境性译法。
  - severity: low
    issue: “太监”具有较强中国制度色彩
    rationale: סָרִיס 的通常词义为“宦官/阉人”，在此语境可译“宦官”。“宦官”较适合跨文化的宫廷叙事，且不改变其通常含义。
