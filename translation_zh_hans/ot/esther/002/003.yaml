  source_fidelity: 草稿总体准确地呈现了王下令任命官员、聚集年轻处女、交希该管理并供应美容制剂的提议语气。但“他国中的各省”把“他的王国”误作“他国”，改变了所属关系；“女眷宫”也比原文“女人们的房舍”更具体且带有中国宫廷色彩。
