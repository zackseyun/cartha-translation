  to: 请王在他王国的各省任命官员，让他们把所有年轻、容貌美丽的处女召集到书珊城堡，送进女子居所[a]，交给王的宦官、主管女子的希该管理；并供应她们美容用品[b]。
  rationale: 修订纠正“他国”对“他的王国”的误译，并以较透明、少带中国制度色彩的措辞处理女子居所和宦官。保留原文的建议语气、行政动作、希该的职务说明，以及美容制剂含义的适度宽度。
