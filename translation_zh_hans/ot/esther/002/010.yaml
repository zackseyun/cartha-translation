  yaml_path: translation/ot/esther/002/010.yaml
  text: Esther had not disclosed her people or her kindred[a], because Mordecai had commanded her not to disclose it.
translation:
  language: zh_hans
  text: 以斯帖一直没有透露自己的民族和出身[a]，因为末底改曾吩咐她不可透露。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “出身”或译“家族”或“血统”。原词 מוֹלֶדֶת 可指亲族、世系或出生地、来源。
    reason: 原词的语义范围较宽；正文采用“出身”，脚注说明其也可涉及亲族、世系或出生地/来源。
lexical_decisions:
- source_word: לֹא הִגִּידָה
  choice: 一直没有透露
  rationale: הִגִּידָה是נגד的使役式，意为“使人知道、告知”。“透露”符合隐瞒身份的语境；“一直没有”以自然汉语表达叙事至此仍未说出的状态。
- source_word: עַמָּהּ
  choice: 自己的民族
  rationale: עַם在这里指以斯帖所属的族群或民族共同体。“民族”比“国籍”更贴近原词，也避免把它误解为若干具体的“族人”。
- source_word: מוֹלַדְתָּהּ
  choice: 自己的出身
  rationale: מוֹלֶדֶת可涵盖亲族、血统及出生来源。与“民族”并列时，“出身”既自然又保留较宽的语义范围，不把含义限定为亲属或家系。
- source_word: צִוָּה עָלֶיהָ
  choice: 曾吩咐她
  rationale: צוה表示有约束力的命令；现代汉语叙事中“吩咐”自然且仍保留权威意味。“曾”标明这项吩咐先于当前叙述状态。
- source_word: אֲשֶׁר לֹא תַגִּיד
  choice: 不可透露
  rationale: 该从句说明末底改命令的内容。“不可”保留禁令的力度，“透露”复现前一动词，维持原文的词语呼应；宾语由上文自然承接，无须重复。
- source_word: אֶסְתֵּר / מָרְדֳּכַי
  choice: 以斯帖 / 末底改
  rationale: 采用现代中文圣经传统中通行且易识别的人名译法。
