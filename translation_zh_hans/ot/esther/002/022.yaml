  yaml_path: translation/ot/esther/002/022.yaml
  text: When the matter became known to Mordecai[a], he told Queen Esther[c][b], and Esther told the king in Mordecai's name.
translation:
  language: zh_hans
  text: 末底改得知了这事[a]，就告诉王后以斯帖[b]；以斯帖便以末底改的名义[c]告诉王。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“有人把这事告知末底改。”希伯来文的被动形式既可侧重末底改得知这事，也可表示有人把这事告诉了他。
    reason: lexical_alternative
  - marker: b
    text: 直译：“以斯帖王后。”
    reason: lexical_alternative
  - marker: c
    text: 或译：“奉末底改的名。”这句话表示以斯帖将这消息归于末底改，说明消息来自他。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּוָּדַע הַדָּבָר לְמָרְדֳּכַי
  choice: 这事传到了末底改那里
  rationale: וַיִּוָּדַע 是 ידע 的尼法勒式，表达被动或起始意义，即这事进入末底改的知悉范围。此译法在现代汉语中自然，也不明确添加告知者。
- source_word: הַדָּבָר
  choice: 这事
  rationale: דָּבָר 本义宽泛；上下文所指是前文的谋害事件。“这事”既承接语境，又避免把原文未明说的“阴谋”直接写入正文。
- source_word: וַיַּגֵּד
  choice: 他就告诉了
  rationale: נגד 的使役式常表示告诉或报告；此处主语是末底改，受话者是以斯帖。“告诉了”符合叙事语流。
- source_word: לְאֶסְתֵּר הַמַּלְכָּה
  choice: 王后以斯帖
  rationale: 希伯来文直译为“以斯帖王后”，属于名称与头衔的同位结构；“王后以斯帖”是自然、庄重的现代汉语表达。
- source_word: וַתֹּאמֶר אֶסְתֵּר לַמֶּלֶךְ
  choice: 以斯帖便……告诉王
  rationale: אָמַר 基本义为“说”，但在这里带有向王传达所知之事的含义；汉语用“告诉王”比“对王说”更完整地衔接上下文。
- source_word: בְּשֵׁם מָרְדֳּכָי
  choice: 以末底改的名义
  rationale: בְּשֵׁם 直译为“以……的名”；在本语境中表示以斯帖把消息归于末底改，承认他是消息来源。正文保留“名义”措辞，并用脚注说明语用含义。
theological_decisions: []
translation_notes:
  register: 采用现代、清楚而庄重的叙事语体。“传到了……那里”避免生硬的被动句，同时保留原文没有说明消息如何传到末底改那里的含蓄性；分号呈现两个连续但层次分明的传报动作。
