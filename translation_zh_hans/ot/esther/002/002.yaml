base_translation:
  language: en
  yaml_path: translation/ot/esther/002/002.yaml
  text: Then the king’s young men who attended him said[b][a], “Let young virgins beautiful in appearance be sought for the king.”
translation:
  language: zh_hans
  text: 于是，服侍王的年轻人说：“应当为王寻找容貌姣好的年轻的处女。[a][b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“年轻女子、处女、容貌姣好。”
    reason: 保留原文名词与形容成分的排列，并显示“年轻女子”和“处女”之间可理解为并列修饰或同位说明。
  - marker: b
    text: 或较形式化地译作：“让人为王寻找容貌姣好的年轻的处女。”
    reason: 原文动词在形式上是第三人称复数主动式；正文采用汉语中自然的无主语指令表达，本注保留其主动、复数而未指明执行者的形式。
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: 于是……说
  rationale: 连续式叙事动词推进情节；“于是”自然表达事件的先后承接。
- source_word: נַעֲרֵי הַמֶּלֶךְ
  choice: 王手下的年轻人
  rationale: נַעַר可指年轻人，也可指仆役；因下文מְשָׁרְתָיו已明确其服侍职分，正文保留“年轻人”这一词义层次。
- source_word: מְשָׁרְתָיו
  choice: 服侍他的
  rationale: 该分词描述这些年轻人侍奉、随侍王的身份；用关系性修饰语既自然，也避免与“年轻人”合并成单一职称。
- source_word: יְבַקְשׁוּ
  choice: 要……寻找
  rationale: 原文是第三人称复数祈使意义的未完成式，表达提议或指令；汉语以无明确主语的“要……寻找”自然传达其指令语气，同时不擅自指定执行者。
- source_word: לַמֶּלֶךְ
  choice: 为王
  rationale: 简洁表达受益或目的关系，不增添“供王享用”等原文未明说的含义。
- source_word: נְעָרוֹת בְּתוּלוֹת
  choice: 年轻处女
  rationale: נְעָרוֹת表示年轻女子，בְּתוּלוֹת明确表示处女；合译为“年轻处女”简明自然，并保留两项语义。
- source_word: טוֹבוֹת מַרְאֶה
  choice: 容貌姣好
  rationale: 该希伯来语惯用语直指外貌好看；“容貌姣好”准确、庄重，也比单说“美丽”更明确保留מַרְאֶה的外貌含义。
