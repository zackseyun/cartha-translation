base_translation:
  language: en
  yaml_path: translation/ot/esther/002/004.yaml
  text: And let the young woman who pleases the king become queen instead of Vashti[a]. The proposal pleased the king[c][b], and he did so.
translation:
  language: zh_hans
  text: 王看中哪个年轻女子，就让她代替瓦实提作王后[a]。王觉得这个建议很好[b]，便照着做了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “作王后”直译为“作王（统治）”。这里按上下文指接替瓦实提的王后之位。
    reason: lexical_alternative
  - marker: b
    text: 直译：“这事在王眼中为好。”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנַּעֲרָה
  choice: 年轻女子
  rationale: נַעֲרָה指年轻女性；“年轻女子”符合现代汉语，也避免“女孩”可能暗示年龄过小或“少女”可能附带的未婚含义。
- source_word: אֲשֶׁר תִּיטַב בְּעֵינֵי הַמֶּלֶךְ
  choice: 王看中哪个
  rationale: 希伯来语惯用语直译为“在王眼中为好”，在此表示合王心意、得到王认可；“王看中哪个”自然简洁，并保留由王作出评判的语气。
- source_word: תִּמְלֹךְ
  choice: 作王后
  rationale: מלך字面可指“作王、统治”；本段语境是选出一名女子取代瓦实提的王后身份，因此译作“作王后”最符合现代汉语，且不额外断言她实际掌握统治权。
- source_word: תַּחַת וַשְׁתִּי
  choice: 代替瓦实提
  rationale: תַּחַת在此表示替代，而非空间上的“在……下面”；“代替”准确表达其关系。
- source_word: וַיִּיטַב הַדָּבָר בְּעֵינֵי הַמֶּלֶךְ
  choice: 王觉得这个建议很好
  rationale: דָּבָר在上下文中指前述提议；再次出现的“在王眼中为好”以自然汉语译为“王觉得……很好”，同时保留与前半节相呼应的评价用语。
- source_word: וַיַּעַשׂ כֵּן
  choice: 便照着做了
  rationale: 这是叙事中的常用表达，表示王依照所提方案行事；“便照着做了”准确而流畅。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。前后两处“在王眼中为好”分别译为“王看中”和“王觉得……很好”，使汉语流畅，同时以脚注保留原文惯用语及 תִּמְלֹךְ 的字面意义。
