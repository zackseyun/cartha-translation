base_translation:
  language: en
  yaml_path: translation/ot/esther/002/011.yaml
  text: And every single day Mordecai would walk back and forth in front of the courtyard of the women’s house, to learn how Esther was doing and what would be done with her.
translation:
  language: zh_hans
  text: 末底改天天都在女院的庭院前来回走动，要打听以斯帖是否安好，以及人将怎样对待她。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְכָל־יוֹם וָיוֹם
  choice: 天天都
  rationale: 希伯来语用“每一日又一日”的重复结构强调持续、无一日间断；“天天都”在现代汉语中自然地保留这一强调。
- source_word: מִתְהַלֵּךְ
  choice: 来回走动
  rationale: 该分词在此描写反复、持续地走动；结合他在院子前等候消息的语境，“来回走动”比单纯“行走”更具体。
- source_word: חֲצַר בֵּית הַנָּשִׁים
  choice: 女院的院子
  rationale: בֵּית הַנָּשִׁים直译为“妇女之屋”，指王宫中安置女子的区域；“女院”简洁自然，而后保留חצר“院子”，避免把两个空间概念合并。
- source_word: לָדַעַת אֶת־שְׁלוֹם אֶסְתֵּר
  choice: 要打听以斯帖是否安好
  rationale: שָׁלוֹם在此指安康、近况；“是否安好”符合现代汉语表达，也保留末底改想获知她状况的含义。
- source_word: וּמַה־יֵּעָשֶׂה בָּהּ
  choice: 以及她会受到怎样的处置
  rationale: 被动式字面为“将有什么施于她／她将被怎样对待”。“受到怎样的处置”保留被动和前途未定的意味，不明确断定结果好坏。
theological_decisions:
- issue: 末底改关注以斯帖的表达是否加入情感评价
  choice: 只陈述他天天打听她的安危与将受的处置
  alternative: 增译为他因担忧或关爱以斯帖而守候
  rationale: 原文通过行动暗示关切，却没有明说其内心情感；译文不作额外心理解释。
- issue: מַה־יֵּעָשֶׂה בָּהּ的未定含义
  choice: 译作“她会受到怎样的处置”
  alternative: 译作“她会遭遇什么”或“她将来会怎样”
  rationale: 原文使用被动动词，重点是别人将对她做什么；所选译法保留这种受动性和不确定性。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“女院”作为宫廷场所名称简明易懂；“来回走动”“是否安好”贴近日常表达，同时避免口语化过度。
