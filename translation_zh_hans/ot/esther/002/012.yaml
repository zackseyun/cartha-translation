base_translation:
  language: en
  yaml_path: translation/ot/esther/002/012.yaml
  text: 'When the turn of each young woman came to go in to King Ahasuerus, after she had been under the regulation for the women for twelve months—for in this way the days of their beauty treatments were completed: six months with oil of myrrh, and six months with spices and with the cosmetics for women—'
translation:
  language: zh_hans
  text: 每个少女轮到进去见亚哈随鲁王时，是在她按为女子所定的规例受美容护理满了十二个月以后；因为她们的美容护理期就是这样满的：六个月用没药油，六个月用香料和女子的美容用品。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תֹּר
  choice: 轮到
  rationale: 表示依次等候后轮到某人的次序，现代汉语用“轮到”自然准确。
- source_word: לָבוֹא אֶל־הַמֶּלֶךְ
  choice: 进去见王
  rationale: “进去”保留宫廷叙事中的空间动作；“见”使现代汉语明确其对象，同时不把可能含蓄的语义进一步解释出来。
- source_word: כְּדָת הַנָּשִׁים
  choice: 照着女子的规例
  rationale: דָּת 在《以斯帖记》的波斯宫廷语境中指正式规定或规例；保留“女子的”这一修饰关系。
- source_word: יְמֵי מְרוּקֵיהֶן
  choice: 她们美容的日子
  rationale: מְרוּקִים 指洁净、润饰或美容护理；此处结合没药油与香料，译作“美容”最符合语境且易懂。
- source_word: שֶׁמֶן הַמֹּר
  choice: 没药油
  rationale: 直译该芳香制品名称，符合常见圣经汉语用词。
- source_word: בַּבְּשָׂמִים וּבְתַמְרוּקֵי הַנָּשִׁים
  choice: 用香料和女子的美容用品
  rationale: 保留两个并列项目及“女子的”限定；“美容用品”比生硬的“洁净物”更贴合本节护理语境。
theological_decisions:
- issue: “进去见王”可能含有性关系的委婉意味
  choice: 不在正文中明说性关系
  alternative: 译为“进去与王同寝”
  rationale: 原文仅说“到/进入王那里”，虽在上下文中可能带有委婉含义，但本节本身没有明说；应保留原文的含蓄与叙事张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。句子保留原文“当……时，她已经……”的时间结构，并以冒号列出十二个月的具体安排；不添加原文没有的篇章标记“现在”。
