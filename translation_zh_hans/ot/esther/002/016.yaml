  text: וַ/תִּלָּקַ֨ח אֶסְתֵּ֜ר אֶל הַ/מֶּ֤לֶךְ אֲחַשְׁוֵרוֹשׁ֙ אֶל בֵּ֣ית מַלְכוּת֔/וֹ בַּ/חֹ֥דֶשׁ הָ/עֲשִׂירִ֖י הוּא חֹ֣דֶשׁ טֵבֵ֑ת בִּ/שְׁנַת שֶׁ֖בַע לְ/מַלְכוּתֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/002/016.yaml
  text: So Esther was taken to King Ahasuerus[a], into his royal palace, in the tenth month, which is the month Tebeth[b], in the seventh year of his reign.
translation:
  language: zh_hans
  text: 于是，以斯帖被带到亚哈随鲁王那里[a]，进入他的王宫。那时是他在位第七年的十月，就是提别月[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“被领到亚哈随鲁王那里”。希伯来文动词为被动形式，强调以斯帖是承受行动的一方。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文作“提别月”，这是第十月的巴比伦名称。
    reason: cultural_note
lexical_decisions:
- source_word: וַתִּלָּקַח
  choice: 被带到
  rationale: 该词为לקח的尼法勒未完成式叙事形，具有被动意义；译作“被带到”既符合现代汉语，也保留以斯帖是承受行动者这一叙事重点。
- source_word: אֶל הַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ
  choice: 到亚哈随鲁王那里
  rationale: 介词אֶל表示朝向、到达；按现代汉语习惯将王号置于人名之后，并保留移动到王面前的含义。
- source_word: אֶל בֵּית מַלְכוּתוֹ
  choice: 进入他的王宫
  rationale: 字面为“到他王权的宫室”，上下文所指是君王的宫廷住所；“进入他的王宫”自然清楚，并表达向内移动。
- source_word: בַּחֹדֶשׁ הָעֲשִׂירִי
  choice: 十月
  rationale: 直译其序数月份表达；在句中以“那时是”引出时间，使汉语顺畅。
- source_word: הוּא חֹדֶשׁ טֵבֵת
  choice: 就是提别月
  rationale: הוּא在此引出同位解释，说明第十月的名称；“就是”保留其辨明、解释作用。
- source_word: טֵבֵת
  choice: 提别月
  rationale: 采用该希伯来月份名称的通行中文音译，并加“月”以便普通读者识别。
- source_word: בִּשְׁנַת שֶׁבַע לְמַלְכוּתוֹ
  choice: 他在位第七年
  rationale: 这是纪年公式；“在位第七年”是现代汉语中自然、准确的君王纪年表达。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。保留“被带到”的被动表达，不把以斯帖改写为主动前往；月份名称音译，并用脚注补充其文化背景。
