  terminology: “太监”可对应此处宫廷语境中的 סָרִיס；“沙押甲”可保留。“妃嫔”容易带入中国宫廷等级制度，且较“妾”宽泛；“王的嫔妾”较贴近 פִּילַגְשִׁים，同时汉语自然。“管理”适合 שֹׁמֵר 所表达的负责、看管职务。
