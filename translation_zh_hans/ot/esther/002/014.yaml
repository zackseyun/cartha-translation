  - severity: low
    issue: “妃嫔”带有中国宫廷品级联想。
    rationale: פִּילַגְשִׁים 指妾或侧室；“王的嫔妾”在现代汉语中更贴近其身份，也避免以“妃嫔”暗示特定本土制度。
