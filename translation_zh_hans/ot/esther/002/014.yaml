  text: בָּ/עֶ֣רֶב הִ֣יא בָאָ֗ה וּ֠/בַ/בֹּקֶר הִ֣יא שָׁבָ֞ה אֶל בֵּ֤ית הַ/נָּשִׁים֙ שֵׁנִ֔י אֶל יַ֧ד שַֽׁעֲשְׁגַ֛ז סְרִ֥יס הַ/מֶּ֖לֶךְ שֹׁמֵ֣ר הַ/פִּֽילַגְשִׁ֑ים לֹא תָב֥וֹא עוֹד֙ אֶל הַ/מֶּ֔לֶךְ כִּ֣י אִם חָפֵ֥ץ בָּ֛/הּ הַ/מֶּ֖לֶךְ וְ/נִקְרְאָ֥ה בְ/שֵֽׁם׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/002/014.yaml
  text: In the evening she would go in[a], and in the morning she would return to the second house of the women, into the care of Shaashgaz, the king’s eunuch, keeper of the concubines[b]. She would not go in again to the king unless the king delighted in her and she was summoned by name.
translation:
  language: zh_hans
  text: 晚上，她进去[a]；早晨，她就回到第二所女子居所，交由王的太监沙押甲照管；他负责管理王的嫔妾。此后，她就不再进去见王，除非王喜爱她，点名召她。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “进去”是希伯来语惯用表达，指进入王的内室或到王面前；上下文暗示与王同寝，但原文没有明说。
    reason: cultural_note
lexical_decisions:
- source_word: בָּעֶרֶב
  choice: 晚上
  rationale: 自然表达时间，保留原文的傍晚时段。
- source_word: בָאָה
  choice: 她进去
  rationale: 原义为“她来”，但在此处指进入王的内室或到王面前；译作“进去”既符合叙事视角，也不把语境所暗示的性关系明说出来。
- source_word: וּבַבֹּקֶר הִיא שָׁבָה
  choice: 早晨，她就回到
  rationale: 保留早晚次序及“返回”的意义；“就”自然呈现随后发生的动作。
- source_word: בֵּית הַנָּשִׁים שֵׁנִי
  choice: 第二处女院
  rationale: 较直译的“第二个女子院”在现代汉语中生硬；“第二处女院”清楚表示另一处供宫中女子居住的院所，又避免直接以“后宫”消解原文结构。
- source_word: אֶל יַד
  choice: 交由……照管
  rationale: 这是置于某人手下、由其负责的惯用表达，汉语用“交由……照管”自然准确。
- source_word: שַׁעֲשְׁגַז
  choice: 沙押甲
  rationale: 按希伯来语人名音译，并采用简洁、可读的汉字形式。
- source_word: סְרִיס הַמֶּלֶךְ
  choice: 王的太监
  rationale: 在波斯宫廷语境中，该词很可能特指阉人；“太监”是现代汉语中自然且具体的对应词。
- source_word: שֹׁמֵר הַפִּילַגְשִׁים
  choice: 负责看守妃嫔
  rationale: 分词表示持续负责监管的人；“负责看守”清楚呈现职务。פִּילֶגֶשׁ指地位低于正妻的伴侣，在王宫语境中译“妃嫔”较自然。
- source_word: לֹא תָבוֹא עוֹד אֶל הַמֶּלֶךְ
  choice: 此后，她不得再进去见王
  rationale: 保留“再”及进入王面前或内室的表达；“不得”符合此处宫廷制度下的惯常规定。
- source_word: כִּי אִם
  choice: 除非
  rationale: 准确表达唯一例外条件。
- source_word: חָפֵץ בָּהּ
  choice: 王喜爱她
  rationale: 该动词兼有喜悦、喜欢和想要之意；“喜爱”保留一定宽度，不限定为单纯的性欲。
- source_word: וְנִקְרְאָה בְשֵׁם
  choice: 点名召她
  rationale: 把“按名字被召”自然地译为“点名召她”，保留特定召见之意。
