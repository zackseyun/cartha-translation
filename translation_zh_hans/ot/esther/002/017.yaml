base_translation:
  language: en
  yaml_path: translation/ot/esther/002/017.yaml
  text: The king loved Esther more than all the women[a], and she found favor and kindness before him more than all the virgins[b]. So he placed the royal crown on her head and made her queen instead of Vashti.
translation:
  language: zh_hans
  text: 王爱以斯帖，胜过所有女子；以斯帖在王面前所蒙的恩宠和厚爱[a]，胜过所有处女[b]。于是，王把王冠戴在她头上，立她为王后，代替瓦实提。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “所蒙的恩宠和厚爱”也可译作“赢得了恩宠和厚爱”。希伯来语习语直译为“承载恩宠和慈爱”。
    reason: lexical_alternative
  - marker: b
    text: 这里的“处女”所译的希伯来词，比本节前面的“女子”含义更具体；译文保留了这一区别。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּאֱהַב
  choice: 爱
  rationale: אהב直接表示爱或喜爱；译作“爱”保留叙事中的感情色彩，不弱化为单纯的偏爱或认可。
- source_word: מִכָּל הַנָּשִׁים
  choice: 胜过爱其他所有女子
  rationale: מן与כל构成比较，明确表达“胜过所有”；נָשִׁים是普通的“女人、女子”复数，在此指被带到王面前的女子。
- source_word: וַתִּשָּׂא חֵן וָחֶסֶד
  choice: 所得的恩宠和厚爱
  rationale: 希伯来语字面为“承载恩宠和慈爱”，是表示获得他人好感与善待的习语。“恩宠和厚爱”分别呈现חֵן与חֶסֶד，并符合宫廷语境。
- source_word: לְפָנָיו
  choice: 在王面前
  rationale: 原文意为“在他面前”；明确译出“王”可避免中文代词指向含混，同时保留在王眼中蒙悦纳的关系意味。
- source_word: מִכָּל הַבְּתוּלֹת
  choice: 胜过其他所有处女
  rationale: בְּתוּלֹת比前面的“女子”更具体，指处女；译文保留原文两种称谓之间的区别。
- source_word: וַיָּשֶׂם כֶּתֶר מַלְכוּת
  choice: 把王冠戴在她头上
  rationale: כֶּתֶר מַלְכוּת直译为“王权的冠冕”，现代汉语用“王冠”简洁自然；“戴在她头上”准确表达动作及位置。
- source_word: וַיַּמְלִיכֶהָ
  choice: 立她为王后
  rationale: מלך的使役形表示使某人作王或掌权；因对象为女性且处于后位继承语境，译作“立她为王后”最清楚。
- source_word: תַּחַת וַשְׁתִּי
  choice: 取代瓦实提
  rationale: תַּחַת在继任语境中表示代替、接替；“取代”自然地表达以斯帖承接瓦实提的位置。
