    rationale: “族人”通常表示该族的成员，容易使句子理解为以斯帖没有告诉别人她的家世及那些成员；原文表达的是她自己的族群归属。改为“本族”更直接且保留原文含义。
  - severity: low
    issue: “出身”可能偏向社会身份
    rationale: 虽然可涵盖来源，但现代汉语中常指个人的社会阶层、履历或背景；“家世”更贴合原文所指的出生、家族来源或亲属关系。
