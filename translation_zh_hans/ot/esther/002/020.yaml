base_translation:
  language: en
  yaml_path: translation/ot/esther/002/020.yaml
  text: Esther had not made known her family line or her people[a], just as Mordecai had commanded her; and Esther kept doing what Mordecai said[b], as when she was under his care.
translation:
  language: zh_hans
  text: 以斯帖一直没有把自己的家世和本族[a]告诉别人，正如末底改吩咐她的；以斯帖仍照末底改所说的去做，像从前受他抚养时一样[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “家世”所译的希伯来词也可指“出身”“亲族”或“血统”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“像从前在他照管之下时一样。”希伯来原文回指以斯帖早年由末底改抚养的生活。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין אֶסְתֵּר מַגֶּדֶת
  choice: 以斯帖一直没有……告诉别人
  rationale: אֵין与分词מַגֶּדֶת构成持续状态的否定；在叙事语境中，“一直没有”自然表达截至当时仍未透露，且“告诉别人”补出希伯来语中不定受事的正常汉语表达。
- source_word: מוֹלַדְתָּהּ
  choice: 自己的出身
  rationale: 该词可指出生、来源、家世或亲族。“出身”在现代汉语中简洁自然，并保留其涵盖血统与家族来源的宽度。
- source_word: עַמָּהּ
  choice: 族人
  rationale: עַם在此指以斯帖所属的民族群体。“族人”与“出身”并列自然，也避免用现代政治意义较强的“国籍”。
- source_word: כַּאֲשֶׁר צִוָּה עָלֶיהָ מָרְדֳּכָי
  choice: 正如末底改吩咐她的
  rationale: צוה带有命令、嘱咐的力度；“吩咐”既保留权威性，又符合监护人与被抚养者关系下的自然汉语。
- source_word: וְאֶת מַאֲמַר מָרְדֳּכַי אֶסְתֵּר עֹשָׂה
  choice: 以斯帖仍照末底改所说的去做
  rationale: מַאֲמַר可指话语、指示或命令；译作“所说的”不强行消除词义宽度。分词עֹשָׂה表示持续或惯常行为，“仍……去做”体现她持续遵从。
- source_word: כַּאֲשֶׁר הָיְתָה בְאָמְנָה אִתּוֹ
  choice: 像从前受他抚养时一样
  rationale: בְאָמְנָה源于אמן，在此指被养育、抚养的状态；“受他抚养”直接呼应2:7中末底改养育以斯帖的背景。加入“从前”自然标明与早先生活的比较。
