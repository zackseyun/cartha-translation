revisions:
- from: 以斯帖一直没有把自己的出身和族人[a]告诉别人，正如末底改吩咐她的；以斯帖仍照末底改所说的去做，像从前受他抚养时一样[b]。
  to: 以斯帖一直没有把自己的家世和本族[a]告诉别人，正如末底改吩咐她的；以斯帖仍照末底改所说的去做，像从前受他抚养时一样[b]。
  rationale: 仅调整“出身和族人”为“家世和本族”，以更准确地区分原文中“家族来源／亲属关系”与“所属人民／族群”这两个并列概念；其余译文保留原有的持续体、叙事语气和脚注锚点。
