  text: When the virgins were gathered a second time[b][a], Mordecai was sitting at the king's gate.
translation:
  language: zh_hans
  text: 众处女第二次[a]被召集时，末底改正坐在王宫门口[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“再次”。希伯来文直译为“第二次”。
    reason: lexical_alternative
  - marker: b
    text: “王宫门口”很可能指王宫的门区，是办理公务和行政事务的场所。
    reason: cultural_note
lexical_decisions:
- source_word: וּבְהִקָּבֵץ
  choice: 被召集时
  rationale: 介词 בְּ 加尼法勒不定式构成时间从句；“被召集”保留被动语态，“时”自然表达时间关系。句首 וּ 的衔接作用由中文叙事语流承载，不另加“如今”等原文没有的时间词。
- source_word: בְּתוּלוֹת
  choice: 童女们
  rationale: 该词在本处明确涉及未有性经验的女子；“童女”比泛称“年轻女子”更准确，也适合庄重的叙事语体。
- source_word: שֵׁנִית
  choice: 第二次
  rationale: 直接表达“第二次、再一次”的意思，并保留原文对次数的明确陈述。
- source_word: וּמָרְדֳּכַי
  choice: 末底改
  rationale: 采用现代中文圣经读者熟悉且稳定的人名译法。
- source_word: יֹשֵׁב
  choice: 正坐在
  rationale: 分词表示当时持续的状态；“正坐在”比单纯的“坐在”更清楚地传达进行或延续之意。
- source_word: בְּשַׁעַר הַמֶּלֶךְ
  choice: 在王宫门那里
  rationale: 字面为“在王的门处”。这里很可能指王宫建筑群的门区；“王宫门那里”既自然，又避免让人误解为只是一扇门本身。
