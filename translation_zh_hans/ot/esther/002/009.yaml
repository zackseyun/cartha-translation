  text: וַ/תִּיטַ֨ב הַ/נַּעֲרָ֣ה בְ/עֵינָי/ו֮ וַ/תִּשָּׂ֣א חֶ֣סֶד לְ/פָנָי/ו֒ וַ֠/יְבַהֵל אֶת תַּמְרוּקֶ֤י/הָ וְ/אֶת מָנוֹתֶ֨/הָ֙ לָ/תֵ֣ת לָ֔/הּ וְ/אֵת֙ שֶׁ֣בַע הַ/נְּעָר֔וֹת הָ/רְאֻי֥וֹת לָֽ/תֶת לָ֖/הּ מִ/בֵּ֣ית הַ/מֶּ֑לֶךְ וַ/יְשַׁנֶּ֧/הָ וְ/אֶת נַעֲרוֹתֶ֛י/הָ לְ/ט֖וֹב בֵּ֥ית הַ/נָּשִֽׁים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/002/009.yaml
  text: The young woman pleased him and found favor before him[a], and he quickly provided her with her beauty treatments and her portions, and with seven young women suitable to be given to her from the king’s palace; and he transferred her and her young women to the best place in the women’s house.
translation:
  language: zh_hans
  text: 这年轻女子深得他的欢心，也在他面前蒙了恩宠。他赶紧为她提供美容护理和配给，又从王宫中拨给她七名合适的侍女；他还把她和她的侍女迁到女院中最好的住处。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “女院中最好的住处”也可译作“女院中最好的区域”或“女院中上好的住处”。“女院”指王宫内安置女子的区域，常被理解为后宫。
    reason: 说明希伯来语短语指女院内较优越的区域；正文避免直接采用解释性较强的“后宫”。
lexical_decisions:
- source_word: הַנַּעֲרָה
  choice: 这年轻女子
  rationale: 用现代汉语自然表达年轻女性，避免“女孩”可能带来的年幼含义，也避免“少女”的文学色彩。
- source_word: וַתִּיטַב ... בְעֵינָיו
  choice: 很得他喜悦
  rationale: 按希伯来语“在他眼中为好”的习语意义翻译，表达她令他满意，不额外加入爱情或性意味。
- source_word: וַתִּשָּׂא חֶסֶד לְפָנָיו
  choice: 在他面前蒙了恩宠
  rationale: 保留“在他面前”的希伯来语表达，并以“恩宠”体现宫廷语境中的好感和优待。
- source_word: וַיְבַהֵל
  choice: 赶紧
  rationale: 保留动词所表达的急速行动，同时使后续一连串供应安排在汉语中流畅。
- source_word: תַּמְרוּקֶיהָ
  choice: 美容用品
  rationale: 该词指女子预备过程中所用的香膏、化妆品或净身用品；此译清楚自然，同时不过度限定具体形态。
- source_word: מָנוֹתֶיהָ
  choice: 应得的份例
  rationale: 该词表示分配给个人的定额，常涉及食物或日用供应；“份例”符合宫廷分配语境，又保留所给物品未被明确限定的空间。
- source_word: שֶׁבַע הַנְּעָרוֹת הָרְאֻיוֹת
  choice: 七名合适的侍女
  rationale: “侍女”明确她们在此处承担服侍角色，“合适的”对应被认为适于分派给她的含义，不暗示原文没有明说的正式选拔程序。
- source_word: מִבֵּית הַמֶּלֶךְ
  choice: 从王宫中
  rationale: 在王室语境中，בֵּית הַמֶּלֶךְ 指王的宫廷或宫殿；译作“王宫”比字面的“王家”更准确自然。
- source_word: וַיְשַׁנֶּהָ
  choice: 把她……迁到
  rationale: 该动词在这里表示改变安置或调换位置；“迁到”呈现实际移动，不把它过度解释为正式晋升。
- source_word: לְטוֹב בֵּית הַנָּשִׁים
  choice: 女院中最好的住处
  rationale: 该短语简略地指向女院内较优越的位置；“住处”补足汉语所需成分，并保留其空间意义。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“蒙了恩宠”“份例”略带宫廷语感，但在上下文中易懂；正文避免古雅的“悦其目”“婢女”等表达，也没有把含义解释得超过希伯来原文。
