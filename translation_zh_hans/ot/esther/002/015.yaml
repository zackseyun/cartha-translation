  text: וּ/בְ/הַגִּ֣יעַ תֹּר אֶסְתֵּ֣ר בַּת אֲבִיחַ֣יִל דֹּ֣ד מָרְדֳּכַ֡י אֲשֶׁר֩ לָקַֽח ל֨/וֹ לְ/בַ֜ת לָ/ב֣וֹא אֶל הַ/מֶּ֗לֶךְ לֹ֤א בִקְשָׁה֙ דָּבָ֔ר כִּ֠י אִ֣ם אֶת אֲשֶׁ֥ר יֹאמַ֛ר הֵגַ֥י סְרִיס הַ/מֶּ֖לֶךְ שֹׁמֵ֣ר הַ/נָּשִׁ֑ים וַ/תְּהִ֤י אֶסְתֵּר֙ נֹשֵׂ֣את חֵ֔ן בְּ/עֵינֵ֖י כָּל רֹאֶֽי/הָ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/002/015.yaml
  text: When Esther’s turn came—the daughter of Abihail[a], the uncle of Mordecai, who had taken her as his own daughter—to go in to the king, she asked for nothing except what Hegai, the king’s eunuch, keeper of the women, advised[b]. And Esther was gaining favor in the eyes of all who saw her.
translation:
  language: zh_hans
  text: 轮到以斯帖——她是末底改的叔叔亚比孩的女儿，末底改曾收她为女儿[a]——进去见王时，她除了王的太监[b]、负责照管众女子的希该所说的以外，什么也没有求。以斯帖受到所有见到她的人的喜爱。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“把她当作女儿收养”。希伯来语习语表示末底改把以斯帖接来，按女儿的身份照料；原文未说明正式的法律收养程序。
    reason: lexical_alternative
  - marker: b
    text: “太监”在某些语境也可泛指“宫廷官员”；但本节涉及管理王宫女子的场景，较具体的含义更合适。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְהַגִּיעַ תֹּר
  choice: 轮到……时
  rationale: 介词与不定词结构引出时间从句；תֹּר在本段指按次序所定的轮次。合译为“轮到……时”自然、准确。
- source_word: דֹּד מָרְדֳּכַי
  choice: 末底改的叔叔
  rationale: דֹּד在此表示男性亲属；结合2:7所述亲属关系，译作“叔叔”。希伯来文未区分父系伯叔，现代汉语以较通行的“叔叔”表达。
- source_word: לָקַח לוֹ לְבַת
  choice: 收为女儿
  rationale: 此习语表示末底改接纳以斯帖，以女儿的身份照料她；“收为女儿”不额外断言正式法律收养程序。
- source_word: לָבוֹא אֶל־הַמֶּלֶךְ
  choice: 进去见王
  rationale: 保留进入王面前的宫廷语气，也不把叙事含蓄表达的亲密背景说得比原文更直白。
- source_word: לֹא בִקְשָׁה דָּבָר כִּי אִם
  choice: 除了……以外，什么也没有求
  rationale: 准确表达排除式结构：以斯帖没有索求任何其他物品，只接受希该所指定的。
- source_word: אֲשֶׁר יֹאמַר
  choice: 所吩咐的
  rationale: 字面为“所说的”；结合希该负责管理众女子并为她们预备入宫用品的语境，“所吩咐的”自然表达其指定之物，但不具体补出原文省略的宾语。
- source_word: סְרִיס
  choice: 太监
  rationale: 该词可泛指宫廷官员，也常指阉人；在后宫管理语境中，“太监”最符合具体词义和现代汉语宫廷称谓。
- source_word: שֹׁמֵר הַנָּשִׁים
  choice: 负责照管众女子的
  rationale: 表达希该对王宫女子的监管职责；“照管”比生硬的“看守”更符合现代叙事语体。
- source_word: וַתְּהִי אֶסְתֵּר נֹשֵׂאת חֵן בְּעֵינֵי
  choice: 都喜爱她
  rationale: 希伯来习语直译为“在……眼中承受恩宠”，实际表示获得他人的好感。“喜爱她”在汉语中自然传达关系性的好感。
- source_word: כָּל רֹאֶיהָ
  choice: 凡看见以斯帖的人
  rationale: 保留“所有看见她的人”这一广泛表述，以“凡……的人”呈现原文的概括语气。
