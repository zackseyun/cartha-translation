  yaml_path: translation/ot/esther/002/023.yaml
  text: When the matter was investigated and found to be so[a], both of them were hanged on a tree, and it was written in the book of the chronicles in the presence of the king.
translation:
  language: zh_hans
  text: 这事经过查验，证实确有其事；两人都被挂在木头上[a]。这事就记在王面前的史书（历代志）上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“被钉在木柱上”或“被悬挂在木架上”。希伯来文直译为“被挂在木头（或树）上”；当时波斯具体采用何种处刑方式并不确定，可能包括刺刑或公开悬挂。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבֻקַּשׁ הַדָּבָר
  choice: 这事经过查验
  rationale: 被动式表达对所报告阴谋的正式调查；“经过查验”既保留被动意味和司法语气，也符合现代汉语。
- source_word: וַיִּמָּצֵא
  choice: 证实确有其事
  rationale: 在此叙事语境中表示报告经调查被证实；这一译法自然表达希伯来文隐含的确认结果。
- source_word: וַיִּתָּלוּ שְׁנֵיהֶם
  choice: 两人就都被挂
  rationale: 保留 תלה 的宽泛含义及 שְׁנֵיהֶם 对两名谋反者的共同强调，不在正文中武断限定具体刑罚方式。
- source_word: עַל עֵץ
  choice: 在木架上
  rationale: עֵץ 可指树、木材或木制刑具；此处“木架”比直译“树上”更符合现代汉语的处刑场景，同时仍保留材质与结构上的开放性。
- source_word: וַיִּכָּתֵב
  choice: 记在
  rationale: 中文以主动形式自然表达希伯来文“被写下、被记录”的结果，不改变其被收入官方记录的含义。
- source_word: בְּסֵפֶר דִּבְרֵי הַיָּמִים
  choice: 在历代志上
  rationale: 该词组指宫廷编年记录；“历代志”简洁、庄重且为读者熟悉，此处并非指圣经中的《历代志》书卷。
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: 当着王的面
  rationale: 准确传达“在王面前、在王临在之处”，并自然体现宫廷记录是在王面前完成或呈报的。
