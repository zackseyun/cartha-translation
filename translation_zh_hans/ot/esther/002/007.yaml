  text: וַ/יְהִ֨י אֹמֵ֜ן אֶת הֲדַסָּ֗ה הִ֤יא אֶסְתֵּר֙ בַּת דֹּד֔/וֹ כִּ֛י אֵ֥ין לָ֖/הּ אָ֣ב וָ/אֵ֑ם וְ/הַ/נַּעֲרָ֤ה יְפַת תֹּ֨אַר֙ וְ/טוֹבַ֣ת מַרְאֶ֔ה וּ/בְ/מ֤וֹת אָבִ֨י/הָ֙ וְ/אִמָּ֔/הּ לְקָחָ֧/הּ מָרְדֳּכַ֛י ל֖/וֹ לְ/בַֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/002/007.yaml
  text: He was bringing up Hadassah—that is[a], Esther—the daughter of his uncle, because she had neither father nor mother. The young woman was beautiful in form and attractive in appearance, and when her father and her mother died[b], Mordecai took her as his own daughter.
translation:
  language: zh_hans
  text: 他抚养着哈大沙，就是以斯帖；她是他叔父的女儿[a]，因为她没有父亲，也没有母亲。这少女身材秀美，容貌姣好。她父亲和母亲去世时，末底改就收她作自己的女儿[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“他叔父的女儿”；按亲属关系说，即他的表亲。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“末底改收养她作女儿”。希伯来文更直白地说，他“把她接来作自己的女儿”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹמֵן
  choice: 抚养着
  rationale: 该分词描述末底改持续照料、养育以斯帖的角色。“抚养着”既保留进行中的状态，也比“作监护人”少一层法律解释。
- source_word: הֲדַסָּה הִיא אֶסְתֵּר
  choice: 哈大沙，就是以斯帖
  rationale: הִיא在此连接同一人的两个名字；“就是”以自然汉语清楚表达同位说明。
- source_word: בַּת דֹּדוֹ
  choice: 他叔父的女儿
  rationale: 按希伯来语的亲属表达直译，不直接简化为“堂姐妹”，从而保留原文的具体说法。
- source_word: כִּי אֵין לָהּ אָב וָאֵם
  choice: 因为她父母双亡
  rationale: 原文直陈她没有父亲和母亲；结合下文父母去世的说明，“父母双亡”在现代汉语中简洁自然，并未仅以抽象的“孤儿”取代原文信息。
- source_word: הַנַּעֲרָה
  choice: 这个少女
  rationale: נַעֲרָה指年轻女子；“少女”符合婚选语境，也保持庄重而不古奥。
- source_word: יְפַת תֹּאַר
  choice: 身材秀美
  rationale: תֹּאַר在此侧重形体、身段；这一译法保留与后面容貌描写的区别。
- source_word: טוֹבַת מַרְאֶה
  choice: 容貌姣好
  rationale: מַרְאֶה指外在所见、容貌；“容貌姣好”自然地表达悦目，并与“身材秀美”构成并列。
- source_word: וּבְמוֹת אָבִיהָ וְאִמָּהּ
  choice: 她父母去世后
  rationale: בְּ加死亡表达时间或情境；“去世后”在汉语叙事中自然，也符合事件关系。
- source_word: לְקָחָהּ מָרְדֳּכַי לוֹ לְבַת
  choice: 末底改就收她作自己的女儿
  rationale: 原文直义是“把她取来，归自己作女儿”。“收她作自己的女儿”传达实际关系，同时避免“收养”可能带入的现代正式法律程序。
