base_translation:
  language: en
  yaml_path: translation/ot/esther/002/008.yaml
  text: And when the king’s command and his decree were heard[a], and when many young women were gathered to Susa the citadel into the custody of Hegai, Esther also was taken into the king’s house, into the custody of Hegai[b], keeper of the women.
translation:
  language: zh_hans
  text: 当王的命令和法令传开，许多年轻女子被聚集到书珊城堡、交给希该看管[a]时，以斯帖也被带进王宫[b]，交给看管众女子的希该。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“到希该手中”；也可译“交由希该监管”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译“王的家”。
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּבַר הַמֶּלֶךְ
  choice: 王的命令
  rationale: דָּבָר在王室行政语境中指王所发出的正式命令；译作“命令”比泛指的“话”更清楚。
- source_word: דָת
  choice: 法令
  rationale: 该词在波斯宫廷语境中指正式颁布的规章或谕令；“法令”庄重自然，又不必把它理解为永久性法律。
- source_word: נְעָרוֹת רַבּוֹת
  choice: 许多年轻女子
  rationale: נְעָרוֹת指适婚年龄的年轻女性，本节本身未用“处女”一词；“年轻女子”既准确，也避免添加上下文才明确的信息。
- source_word: שׁוּשַׁן הַבִּירָה
  choice: 书珊城堡
  rationale: הַבִּירָה在此指设防的王室城堡或宫城；“书珊城堡”简洁地保留地名与设施性质。
- source_word: אֶל יַד
  choice: 交在……手下
  rationale: 原文惯用语直译为“到……手中”，表示置于某人的权柄、监管或照管之下；“交在……手下”自然并保留其权力关系。
- source_word: וַתִּלָּקַח
  choice: 也被带进
  rationale: 被动形式表明以斯帖不是主动前往。“被带进”保留被动和可能的强制意味，又不像“被抓走”那样过度强化暴力。
- source_word: בֵּית הַמֶּלֶךְ
  choice: 王宫
  rationale: 原文直译是“王的家”，在此语境指王的宫廷建筑或王室范围；正文用现代汉语自然的“王宫”，脚注保留字面形式。
- source_word: שֹׁמֵר הַנָּשִׁים
  choice: 负责看管众女子的
  rationale: שֹׁמֵר表示看守、监管者；“负责看管”比“保护”更中性，也更符合这些女子处于宫廷监管之下的语境。
- source_word: וַיְהִי בְּהִשָּׁמַע ... וּבְהִקָּבֵץ
  choice: ……传开以后，……被聚集……；……也……
  rationale: 两个介词加不定式结构提供时间背景。汉语以“以后”引出后续事件，并用分号清楚呈现长句层次，同时保持希伯来叙事的先后关系。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“年轻女子”避免把本节未明说的贞洁状况写入译文；连续使用被动表达，保留女子被聚集以及以斯帖被带走时缺乏主动性的叙事张力。
