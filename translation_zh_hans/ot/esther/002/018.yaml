base_translation:
  language: en
  yaml_path: translation/ot/esther/002/018.yaml
  text: Then the king gave a great banquet for all his officials and servants—the banquet of Esther—and he granted relief to the provinces and gave gifts according to the king’s bounty[a][b].
translation:
  language: zh_hans
  text: 王为他所有的官长和臣仆举行了盛大的筵席——以斯帖的筵席；又使各省得享宽免[a]，并按王的慷慨赏赐礼物[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “宽免”也可译作“休息”或“放假”。原文用词可泛指休息、减轻负担或宽免，也可能指赋税等方面的减免。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“照着王的手”，是指按与君王的能力、身份或慷慨相称的程度。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁתֶּה גָדוֹל
  choice: 大摆筵席
  rationale: מִשְׁתֶּה指饮宴或筵席，גָדוֹל表示盛大；“大摆筵席”既自然，也符合王宫庆典的语境。
- source_word: לְכָל שָׂרָיו וַעֲבָדָיו
  choice: 为他所有的官长和臣仆
  rationale: שָׂרִים在宫廷语境中指高级官员，“官长”保留其身份和权位；עֲבָדִים字面为仆人，此处也可涵盖王室属员，以“臣仆”兼顾臣属与服侍之意。
- source_word: אֵת מִשְׁתֵּה אֶסְתֵּר
  choice: 就是以斯帖的筵席
  rationale: 保留原文同位结构及属格关系，不把它明确限定为以斯帖主办或仅仅为她举行的筵席。
- source_word: וַהֲנָחָה לַמְּדִינוֹת עָשָׂה
  choice: 又使各省得以休息
  rationale: הֲנָחָה可指休息、宽免或减轻负担；正文采用较宽泛的“得以休息”，脚注列出节庆放假和赋税宽免等可能。
- source_word: מַשְׂאֵת
  choice: 礼物
  rationale: 此处指王所赐下之物；“礼物”自然且不把内容过度限定为食物份额或其他特定赏赐。
- source_word: כְּיַד הַמֶּלֶךְ
  choice: 照着王的气派
  rationale: 原文直译为“照着王的手”，是表示与君王身份、能力或慷慨相称的习语；“照着王的气派”在现代汉语中较自然，并由脚注保留字面形式和语义范围。
- source_word: וַיַּעַשׂ
  choice: 大摆
  rationale: 动词本义为“做、举行”；与筵席搭配译作“大摆”，符合现代汉语惯用表达。
theological_decisions: []
