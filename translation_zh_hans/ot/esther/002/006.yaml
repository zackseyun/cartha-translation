  yaml_path: translation/ot/esther/002/006.yaml
  text: who had been taken into exile from Jerusalem with the exiles who had been taken into exile with Jeconiah king of Judah[a], whom Nebuchadnezzar king of Babylon had taken into exile.
translation:
  language: zh_hans
  text: 他曾与那些同犹大王耶哥尼雅一起被掳的人，一同从耶路撒冷被掳去[a]；耶哥尼雅是巴比伦王尼布甲尼撒掳去的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他”也可能指末底改的祖先基士，而不是末底改本人，因为耶哥尼雅被掳发生在更早的世代。
    reason: alternative_reading
lexical_decisions:
- source_word: אֲשֶׁר הָגְלָה
  choice: 他曾……被掳走
  rationale: 希伯来语关系从句承接上文人物；被动表达体现被强制迁徙，现代中文以“被掳走”自然、凝练。
- source_word: מִירוּשָׁלַיִם
  choice: 从耶路撒冷
  rationale: 直接表达介词所标明的离开地点。
- source_word: עִם הַגֹּלָה
  choice: 与那些……被掳的人一道
  rationale: הַגֹּלָה在此指被掳的群体，而非抽象的“被掳”事件；中文用具体的人群表达。
- source_word: אֲשֶׁר הָגְלְתָה
  choice: 被掳的人
  rationale: 阴性单数动词与集合名词הַגֹּלָה呼应；中文按集合意义译为复数人群。
- source_word: יְכָנְיָה
  choice: 耶哥尼雅
  rationale: 按本节希伯来语名字形式音译，不以其异名约雅斤替换。
- source_word: מֶלֶךְ יְהוּדָה
  choice: 犹大王
  rationale: 符合现代中文对王号与地域名的惯常语序。
- source_word: אֲשֶׁר הֶגְלָה
  choice: 是……掳走的
  rationale: 明确尼布甲尼撒是执行强制迁徙的施事者，并与前文“被掳”保持词义呼应。
- source_word: נְבוּכַדְנֶאצַּר
  choice: 尼布甲尼撒
  rationale: 采用现代中文圣经传统中通行且易识别的译名。
- source_word: מֶלֶךְ בָּבֶל
  choice: 巴比伦王
  rationale: 符合现代中文王号表达习惯。
theological_decisions:
- issue: 以斯帖记2:6关系从句的先行词
  choice: 正文按希伯来语表层句法，将“曾……被掳走”理解为承接末底改。
  alternative: 关系从句也可能指末底改的祖先基士，因为耶哥尼雅被掳发生在更早的世代。
  rationale: 就叙事语流而言，末底改是较近的语法承接对象；但历史年代使“基士”为先行词成为真实可能，因此不在正文中强行消除歧义，而以脚注保存另一理解。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“被掳”保留经文的历史强制性，也为普通读者熟悉；通过分号拆分较长的希伯来语关系链，以提高可读性，同时不改变各从句的逻辑关系。
