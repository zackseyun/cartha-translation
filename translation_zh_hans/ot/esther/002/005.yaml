base_translation:
  language: en
  yaml_path: translation/ot/esther/002/005.yaml
  text: There was a Jewish man in Susa the citadel[a], and his name was Mordecai son of Jair, son of Shimei, son of Kish[c][b], a Benjaminite.
translation:
  language: zh_hans
  text: 在书珊的卫城，有一个犹太人[a]，名叫末底改；他是睚珥的儿子、示每的儿子、基士的儿子[b]，是便雅悯人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “犹太人”也可译作“犹大人”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来原文三次使用“儿子”；在家谱中，“儿子”也可指较远的后裔。
    reason: cultural_note
lexical_decisions:
- source_word: אִישׁ יְהוּדִי
  choice: 一个犹太人
  rationale: יְהוּדִי既可指“犹太人”，也可指“犹大人”。在以斯帖记的波斯离散背景中，“犹太人”最自然地表达其族群身份，同时以脚注保留另一可能。
- source_word: הָיָה
  choice: 有
  rationale: 此处用于叙事中引入新人物，现代汉语以存在句“有一个……”表达自然准确。
- source_word: בְּשׁוּשַׁן הַבִּירָה
  choice: 在书珊城堡里
  rationale: שׁוּשַׁן是地名书珊，הַבִּירָה指设防的王宫城堡或卫城；此译简洁自然，脚注保留“书珊城”这一传统理解。
- source_word: וּשְׁמוֹ מָרְדֳּכַי
  choice: 名叫末底改
  rationale: 符合现代汉语人物介绍的自然表达；人名采用通行中文圣经译名。
- source_word: בֶּן יָאִיר בֶּן שִׁמְעִי בֶּן קִישׁ
  choice: 是睚珥的儿子、示每的孙子、基士的后代
  rationale: 连续的בֶּן在家谱中既可指亲生儿子，也可泛指后裔。汉语按谱系层级表达，可避免误使读者认为三人都是末底改的直接父亲，同时脚注说明原文形式与谱系弹性。
- source_word: אִישׁ יְמִינִי
  choice: 属便雅悯支派
  rationale: 该短语表示便雅悯支派身份；此译比直译“便雅悯人”更清楚、自然。
theological_decisions:
- issue: 末底改谱系中“儿子”的范围
  choice: 正文按连续谱系译为“儿子、孙子、后代”，并以脚注说明原文
  alternative: 逐项译作“……的儿子、……的儿子、……的儿子”
  rationale: 希伯来语בֶּן可涵盖较远的祖先关系；此处理不武断确定每一代的具体距离，也避免不自然或易误解的汉语串联。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。地名和人名使用简体中文圣经传统通行译名；正文保持流畅，并通过脚注保存原文的词义与谱系歧义。
