base_translation:
  language: en
  yaml_path: translation/ot/esther/002/001.yaml
  text: After these things[a], when the anger of King Ahasuerus had subsided, he remembered Vashti, what she had done[b], and what had been decreed against her.
translation:
  language: zh_hans
  text: 这些事以后，亚哈随鲁王的怒气平息后，他想起瓦实提、她所做的事，以及针对她所作的裁决。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַחַר הַדְּבָרִים הָאֵלֶּה
  choice: 这些事以后
  rationale: 这是希伯来语常见的时间承接语；译文贴近原文，同时符合现代汉语叙事习惯。
- source_word: כְּשֹׁךְ חֲמַת
  choice: 怒气平息了
  rationale: שׁכך表示逐渐止息、平静；חֵמָה指强烈的怒气。此译简洁自然，并保留怒气消退的动态含义。
- source_word: הַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ
  choice: 亚哈随鲁王
  rationale: 采用现代中文圣经语境中通行的人名音译，并按汉语习惯将王号置于姓名之后。
- source_word: זָכַר
  choice: 想起
  rationale: 该动词意为记起、忆及；在本段叙事语境中，“想起”比“记念”更自然，也不额外赋予褒义或礼仪含义。
- source_word: וַשְׁתִּי
  choice: 瓦实提
  rationale: 采用现代中文圣经语境中通行的专名音译。
- source_word: אֲשֶׁר עָשָׂתָה
  choice: 她所做的事
  rationale: 直接保留原文未明确评价其行为性质的表达，不将其解释为顺服、违抗或罪行。
- source_word: אֲשֶׁר נִגְזַר עָלֶיהָ
  choice: 对她所作的裁决
  rationale: נִגְזַר是被动形式，表示已经定下或颁定之事；“裁决”保留官方决定及对她不利的语境，同时避免把具体文书形式说得过死。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。用“想起”保持叙事语气，用“裁决”传达宫廷司法背景；不对瓦实提的行为作原文没有明说的道德评判。
