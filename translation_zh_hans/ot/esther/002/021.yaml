base_translation:
  language: en
  yaml_path: translation/ot/esther/002/021.yaml
  text: In those days[a], while Mordecai was sitting at the king’s gate, Bigthan and Teresh, two of the king’s eunuchs from those who guarded the threshold[b], became angry and sought to lay hands on King Ahasuerus.
translation:
  language: zh_hans
  text: 在那些日子，末底改坐在王的宫门口。王的两个太监[a]比革他和提列，是看守宫门的；他们发怒，企图向亚哈随鲁王下手。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “太监”也可译作“王室官员”；这个希伯来词有时泛指宫廷官员，但在这里的王宫语境中很可能指太监。
    reason: lexical_alternative
  - marker: b
    text: “向……下手”直译为“向……伸手”；这是一个习语，意思是攻击或刺杀王。
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיָּמִים הָהֵם
  choice: 那些日子
  rationale: 保留希伯来叙事中宽泛的时间框架，现代汉语自然简洁。
- source_word: יֹשֵׁב בְּשַׁעַר הַמֶּלֶךְ
  choice: 正坐在王门那里
  rationale: 分词表达当时持续的背景情形；“王门”也保留与王室行政场所有关的称谓。
- source_word: קָצַף
  choice: 恼怒起来
  rationale: 前置单数动词带复合主语，可按两人共同的反应理解；译法不额外强化愤怒程度。
- source_word: סָרִיסֵי הַמֶּלֶךְ
  choice: 王的两个太监
  rationale: סָרִיס在王宫语境中很可能指太监，但也可能泛指王室官员，因此以脚注保留另一可能。
- source_word: מִשֹּׁמְרֵי הַסַּף
  choice: 就是守门的人
  rationale: הַסַּף字面为门槛，此处指守卫王宫入口的人；“守门”在汉语中自然且清楚。
- source_word: וַיְבַקְשׁוּ לִשְׁלֹחַ יָד
  choice: 想要下手害
  rationale: 保留“寻求/企图”所表达的意图，并用汉语惯用语传达伸手攻击、加害的含义，而不把行动过度限定为已经实施。
- source_word: אֲחַשְׁוֵרוֹשׁ
  choice: 亚哈随鲁
  rationale: 依希伯来名字音译，不以历史认同名称“薛西斯”取代正文形式。
