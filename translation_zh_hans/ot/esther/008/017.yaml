base_translation:
  language: en
  yaml_path: translation/ot/esther/008/017.yaml
  text: And in every province and province, and in every city and city, wherever the king’s word and his decree reached, there was joy and gladness for the Jews, a feast and a good day. And many from the peoples of the land were becoming Jews, because the fear of the Jews had fallen on them.
translation:
  language: zh_hans
  text: 在各省各城，王的谕旨和法令所到之处，犹太人都有欢喜快乐，有宴饮和佳节。当地各族中有许多人成为犹太人[a]，因为他们惧怕犹太人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “成为犹太人”也可理解为“自称为犹太人”或“认同、归附犹太人”；原文所指是否为正式改宗，不能完全确定。
    reason: 说明罕见动词 מִתְיַהֲדִים 的可能语义，避免将因惧怕而发生的身份认同明确限定为正式或真诚的改宗。
lexical_decisions:
- source_word: מְדִינָה וּמְדִינָה / עִיר וָעִיר
  choice: 各省各城
  rationale: 希伯来语以名词重复表达逐一遍及之意；汉语用“各省各城”自然而准确地传达全面分布。
- source_word: שִׂמְחָה וְשָׂשׂוֹן
  choice: 欢喜快乐
  rationale: 保留两个近义词并列所形成的喜庆强调。
- source_word: מִשְׁתֶּה וְיוֹם טוֹב
  choice: 设宴庆祝，把那天当作佳节
  rationale: מִשְׁתֶּה 指宴饮，יוֹם טוֹב 指喜庆或节庆之日；这样译兼顾动作和日期的节庆性质。
- source_word: מִתְיַהֲדִים
  choice: 归入犹太人
  rationale: 该词是罕见的 Hitpael 形式，可指成为或自称为犹太人；正文采用不预断内心动机的表达，并以脚注保留歧义。
- source_word: נָפַל פַּחַד הַיְּהוּדִים עֲלֵיהֶם
  choice: 他们惧怕犹太人
  rationale: 希伯来习语直译为“对犹太人的恐惧落在他们身上”；正文用现代汉语自然表达其含义。
theological_decisions:
- issue: מִתְיַהֲדִים 是否表示真诚改宗
  choice: 归入犹太人
  alternative: 成为犹太人／装作犹太人
  rationale: 经文本身紧接着说明其原因是惧怕，可能涉及身份归附、公开认同或改宗，却不足以断定真诚信仰或纯粹伪装，因此正文和脚注保留张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“各省各城”避免机械照搬希伯来语重复结构；“谕旨和法令”保留 דְּבַר הַמֶּלֶךְ וְדָתוֹ 的两项表达。
