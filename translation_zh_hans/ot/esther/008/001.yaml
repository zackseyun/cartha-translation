  text: בַּ/יּ֣וֹם הַ/ה֗וּא נָתַ֞ן הַ/מֶּ֤לֶךְ אֲחַשְׁוֵרוֹשׁ֙ לְ/אֶסְתֵּ֣ר הַ/מַּלְכָּ֔ה אֶת בֵּ֥ית הָמָ֖ן צֹרֵ֣ר ה/יהודיים וּ/מָרְדֳּכַ֗י בָּ֚א לִ/פְנֵ֣י הַ/מֶּ֔לֶךְ כִּֽי הִגִּ֥ידָה אֶסְתֵּ֖ר מַ֥ה הוּא לָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/008/001.yaml
  text: On that day King Ahasuerus gave Queen Esther the house of Haman, the enemy of the Jews, and Mordecai came before the king, because Esther had told what he was to her.
translation:
  language: zh_hans
  text: 那一天，亚哈随鲁王把犹太人的仇敌哈曼的家产赐给王后以斯帖。末底改也来到王面前，因为以斯帖已经告诉王，末底改是她的什么人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֵּית הָמָן
  choice: 哈曼的家产
  rationale: בַּיִת在此指被处置并转赐的家宅、产业或家产，而非单指房屋；译作“家产”符合叙事语境，也不把范围过度限定为住宅。
- source_word: צֹרֵר הַיְּהוּדִים
  choice: 犹太人的仇敌
  rationale: צֹרֵר表示敌对、迫害者；“仇敌”简洁保留其强烈敌意。
- source_word: בָּא לִפְנֵי הַמֶּלֶךְ
  choice: 来到王面前
  rationale: 保留希伯来语宫廷表达；上下文也可能暗示获准觐见或进入王的侍从体系，但本节不宜明说。
- source_word: מַה הוּא לָהּ
  choice: 末底改是她的什么人
  rationale: 原文直译为“他对她是什么”，是概括两人关系的惯用表达；中文如此表达自然，并保留原文未在本节具体说明亲属关系的特点。
theological_decisions:
- issue: כִּי所表达的因果关系
  choice: 因为
  alternative: 原来／这是因为
  rationale: 保留原文明确的因果连接：末底改得以来到王面前，与以斯帖向王说明二人关系有关；不额外推断具体宫廷任命。
- issue: 末底改与以斯帖关系的具体化
  choice: 不具体说明，只译“是她的什么人”
  alternative: 她的养父／她的亲属
  rationale: 虽然前文说明末底改收养以斯帖且二人有亲属关系，本节措辞本身较概括；保留这种概括可避免替原文消除含混。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“亚哈随鲁、以斯帖、末底改、哈曼”沿用中文圣经通行专名。分为两句以提高可读性，同时保留原文事件次序和因果关系。
