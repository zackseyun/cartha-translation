base_translation:
  language: en
  yaml_path: translation/ot/esther/008/008.yaml
  text: But you may write concerning the Jews as seems good in your eyes[a], in the king’s name, and seal it with the king’s signet ring[b], for a document that is written in the king’s name and sealed with the king’s signet ring cannot be revoked.
translation:
  language: zh_hans
  text: 但你们可以照你们看为好的，就犹太人的事写文书[a]，以王的名义发出，并用王的印戒盖印；因为凡以王的名义写成、又用王的印戒盖印的文书，都不能撤销[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “照你们看为好的”也可译作“照你们认为合适的”。希伯来语直译为“照在你们眼中为好的”。
    reason: lexical_alternative
  - marker: b
    text: “不能撤销”也可译作“不能更改”或“不能收回”。这里指以王名义写成并加盖王印的文书不得废止。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתֶּם
  choice: 至于你们
  rationale: 显出复数代词的强调，并承接上文形成转折；比单用“但你们”更符合现代汉语庄重叙事语体。
- source_word: כִּתְבוּ
  choice: 可以……拟写
  rationale: 原文是复数命令式；在王授权的语境中译作“可以”体现准许而不过度强化为义务，“拟写”也符合官方文书语境。
- source_word: עַל הַיְּהוּדִים
  choice: 为犹太人
  rationale: 介词 עַל 可表示所关涉的对象；上下文明确这份文书关乎并有利于犹太人，中文“为犹太人”自然，同时不把文书具体内容说死。
- source_word: כַּטּוֹב בְּעֵינֵיכֶם
  choice: 照你们看为好的
  rationale: 保留希伯来语“在你们眼中为好”的意象和判断含义，又比逐字翻译更符合现代汉语。
- source_word: בְּשֵׁם הַמֶּלֶךְ
  choice: 以王的名义
  rationale: 忠实保留“名”的词汇形式，并自然表达凭王权威发布。
- source_word: וְחִתְמוּ בְּטַבַּעַת הַמֶּלֶךְ
  choice: 并用王的印戒盖印
  rationale: טַבַּעַת 在行政语境中指用于盖印的印戒；“盖印”清楚表达该动作。
- source_word: כְתָב
  choice: 文书
  rationale: 该词泛指书面文件；“文书”适合王室行政语境，又不像“诏书”或“法令”那样增加原文没有的具体类别。
- source_word: אֵין לְהָשִׁיב
  choice: 是不能撤销的
  rationale: 原意为“不能使之返回”，在法律行政语境中即不能收回、废止；“撤销”准确自然。
