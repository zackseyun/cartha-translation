base_translation:
  language: en
  yaml_path: translation/ot/esther/008/010.yaml
  text: He wrote in the name of King Ahasuerus[a], sealed it with the king’s signet ring, and sent letters by couriers on horses, riding the royal steeds bred from swift stock.
translation:
  language: zh_hans
  text: 他奉亚哈随鲁王的名写了文书，用王的印戒盖印，又借骑马的驿使把文书送出；他们骑着御用骏马，都是由繁育用马所生的。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节末尾几个希伯来语马匹用词十分罕见，确切含义难以确定。“御用骏马，都是由繁育用马所生的”也可较直译为“骏马、亚哈施特兰尼姆、拉玛基姆之子”。“亚哈施特兰尼姆”可能指与王室或官方驿传有关的马匹；“拉玛基姆”可能指母马或繁育用马。
    reason: 保留罕见马匹术语的词义及其相互句法关系的不确定性，避免将其确定为特定品种或王家马种。
lexical_decisions:
- source_word: וַיִּכְתֹּב
  choice: 写成文书
  rationale: 该叙事动词承接上文；结合后面的复数“文书”，译为“写成文书”比单说“写了”更自然，同时不额外指定文书的具体类别。
- source_word: בְּשֵׁם הַמֶּלֶךְ אֲחַשְׁוֵרֹשׁ
  choice: 奉亚哈随鲁王的名
  rationale: בְּשֵׁם在此表示凭王的名义和权柄行事；“奉……的名”符合现代汉语公文语境，也保留正式色彩。
- source_word: וַיַּחְתֹּם בְּטַבַּעַת הַמֶּלֶךְ
  choice: 用王的印戒盖印
  rationale: טַבַּעַת在王室语境中指用于钤印的戒指；“印戒”准确表达其用途，“盖印”自然传达动词含义。
- source_word: וַיִּשְׁלַח סְפָרִים
  choice: 送出文书
  rationale: סְפָרִים在此是官方书面文件。“文书”比“信件”更能体现王令的正式性质，又不把它窄化为某一种诏令。
- source_word: בְּיַד הָרָצִים
  choice: 派……驿使送出
  rationale: בְּיַד表示借某人之手，הָרָצִים指奉命传递公文的人；在他们骑马的语境中，“驿使”比直译“奔跑者”清楚自然。
- source_word: בַּסּוּסִים רֹכְבֵי
  choice: 骑马的；骑的是
  rationale: 保留信使骑马递送以及后文进一步说明坐骑的两层表达，同时用分句避免汉语重复生硬。
- source_word: הָרֶכֶשׁ
  choice: 良马
  rationale: 该词指精选的骑乘马或骏马；“良马”表达其优良、专用性质，却不把词义过度限定为速度。
- source_word: הָאֲחַשְׁתְּרָנִים
  choice: 御用
  rationale: 这是含义不确定的罕见借词，可能与王家驿传或王室马厩有关。“御用”保留宫廷关联，并避免武断指定动物品种。
- source_word: בְּנֵי הָרַמָּכִים
  choice: 是王家马种所生的
  rationale: 字面为“……之子”，末词罕见，可能指母马或王家繁育用马。“王家马种所生”传达血统、繁育背景，并在脚注中保留字面及其他可能。
