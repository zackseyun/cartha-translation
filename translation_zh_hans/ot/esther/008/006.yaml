  yaml_path: translation/ot/esther/008/006.yaml
  text: For how could I bear to see the disaster that will come upon my people? And how could I bear to see the destruction of my kindred?[a]
translation:
  language: zh_hans
  text: 因为我怎能眼看灾祸临到我的族人？我又怎能眼看我的亲族[a]遭毁灭呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“我的同胞”或“与我同出一族的人”。希伯来语这个词可指因出生、血缘或族属而与自己相联的人，不一定指地理上的出生地。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 省略明译，以问句承接上文
  rationale: 此处引出以斯帖恳求的理由。汉语紧接上文时直接以反问表达更自然，因果关系仍由语境清楚呈现。
- source_word: אֵיכָכָה אוּכַל
  choice: 我怎能忍心
  rationale: 字面为“我怎能/如何能够”。结合哀求语气，“忍心”自然表达她无法承受亲眼目睹灾难的情感，同时保留反问力度。
- source_word: וְרָאִיתִי
  choice: 看着
  rationale: 在“怎能忍心”之后作补足语，表达亲眼目睹、眼看事情发生；用“看着”符合现代汉语。
- source_word: בָּרָעָה אֲשֶׁר יִמְצָא
  choice: 灾祸临到
  rationale: רָעָה在这里指灾难而非道德上的邪恶；יִמְצָא אֶת是“临到、遭遇”的希伯来语习惯表达。
- source_word: עַמִּי
  choice: 我的族人
  rationale: עַם指以斯帖所属的人民或民族。译作“族人”既表达共同民族身份，也避免与后句用词完全重复。
- source_word: בְּאָבְדַן
  choice: 被毁灭
  rationale: אָבְדַן表示灭亡、毁灭。结合针对群体的威胁，动词式“被毁灭”在汉语中自然有力，又不比原文更具体。
- source_word: מוֹלַדְתִּי
  choice: 我的同胞
  rationale: 该词可指与自己同出一族、因出生而相联的人，而不必指地理上的出生地。“同胞”自然传达出生和族属关系；脚注保留“亲族”等可能含义。
theological_decisions: []
