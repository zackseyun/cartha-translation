revisions:
- from: 就在那时，王的书记被召来。那是三月，就是西弯月，二十三日。他们完全照末底改所吩咐的，写信给犹太人，也给从印度直到古实[a]这一百二十七个省的总督、省长和各省官员；各省采用本省的文字，各族采用本族的语言，犹太人也采用自己的文字和语言。
  to: 就在那时，王的书记被召来；当时是三月，就是西弯月二十三日。文书便照末底改所吩咐的一切写成，发给犹太人，以及从印度直到古实[a]的一百二十七省的总督、省长和各省官员：给每一省都按其文字，给每一族都按其语言，也给犹太人按他们的文字和语言。
  rationale: 以“文书……写成”保留原文未明说的被动表达和官方文书语境，避免将其限定为书信；以“给每一省都按其文字，给每一族都按其语言”准确表达书写／发布的分配公式，而不把省和族群说成主动采用文字或语言。日期也调整为现代汉语中更连贯的表达。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T06:21:23Z'
review_pass:
  verdict: revise
  source_fidelity: “写信”不符合原文：וַיִּכָּתֵב为未明示文书类别的被动式“被写成／写成了”，并非特指私人或一般书信。另，“各省采用……、各族采用……”将文书的书写语言文字误表为省与族群主动采用的行为。应明确这是写给各省、各族的文书分别按其文字和语言写成。
  naturalness: 原译整体通顺，但“那是三月，就是西弯月，二十三日”断裂感较强；将日期整合为“当时是三月，就是西弯月二十三日”更自然。修订后的分发公式保留原文行政文书的庄重和清晰。
  terminology: “王的书记”“末底改”“西弯月”“古实”均可保留；“总督、省长、各省官员”可作为三类波斯行政官员的功能性译法。保留“文字”和“语言”的区分。
  issues:
  - severity: high
    issue: “写信”将未限定的官方文书限定为“信”。
    rationale: 原文仅说“写成了”，且语境是王室政令；“信”会改变文类和正式程度。
  - severity: high
    issue: “各省采用本省的文字，各族采用本族的语言”误置动作主体。
    rationale: מְדִינָה...כִּכְתָבָהּ וְעַם...כִּלְשֹׁנוֹ说明文书给每省按其文字、给每族按其语言写成，不是各省或各族“采用”文字、语言。
