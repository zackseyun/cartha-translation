  yaml_path: translation/ot/esther/008/012.yaml
  text: on one day in all the provinces of King Ahasuerus, on the thirteenth day of the twelfth month, that is, the month Adar.
translation:
  language: zh_hans
  text: 在亚哈随鲁王的所有省份，在同一天，就是十二月十三日；十二月就是亚达月。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּיוֹם אֶחָד
  choice: 定在同一天
  rationale: בְּ表时间，אֶחָד强调各省执行诏令的日期相同。结合本句承接上文诏令日期的句法，用“定在同一天”既保留“一日”的含义，也使中文片段自然。
- source_word: בְּכָל מְדִינוֹת
  choice: 在……的各省
  rationale: מְדִינוֹת指帝国的行政省份；“各省”准确、简洁。“在”保留介词的处所意义。
- source_word: הַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ
  choice: 亚哈随鲁王
  rationale: 按现代汉语习惯将王号置于专名之后；“亚哈随鲁”采用中文圣经传统中通行且可辨识的音译。
- source_word: בִּשְׁלוֹשָׁה עָשָׂר לְחֹדֶשׁ שְׁנֵים עָשָׂר
  choice: 十二月十三日
  rationale: 希伯来语以基数词表达日期；现代汉语自然表述为“十二月十三日”，准确呈现月份与日数。
- source_word: הוּא חֹדֶשׁ אֲדָר
  choice: 十二月就是亚达月
  rationale: הוּא在此具有同位解释作用，说明第十二月的名称；“就是”清楚保留这一解释关系，“亚达月”采用通行音译。
