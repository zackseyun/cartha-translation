base_translation:
  language: en
  yaml_path: translation/ot/esther/008/014.yaml
  text: The couriers[a], mounted on the royal steeds, went out hastened and pressed on by the king’s command, and the decree was issued in Susa the citadel.
translation:
  language: zh_hans
  text: 信使骑着御用骏马[a]，在王命催逼之下火速出发；谕旨也在书珊卫城颁布了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有关这些坐骑的希伯来语词很罕见，确切所指不能确定；也可理解为“骑着骏马，即御用种马”。
    reason: 保留罕见动物名称及其修饰关系在词义和句法上的不确定性，避免把其来源具体化为“御苑所出”。
lexical_decisions:
- source_word: הָרָצִים
  choice: 驿使
  rationale: 该词本义与“奔跑者”有关，但在波斯帝国传递王室文书的语境中指官方信使；“驿使”既表达其职能，也符合其骑乘坐骑传递谕旨的情境。
- source_word: רֹכְבֵי
  choice: 骑着
  rationale: 保留分词所描写的骑乘状态，中文自然直接。
- source_word: הָרֶכֶשׁ הָאֲחַשְׁתְּרָנִים
  choice: 御用骏马
  rationale: 两个有关坐骑的词，尤其后一个罕见的波斯借词，确切含义不明；正文以“御用骏马”传达王家驿传和迅速行动的语境，同时用脚注保留词义及句法上的不确定性。
- source_word: יָצְאוּ
  choice: 出发
  rationale: 在信使奉命上路的语境中，“出发”比直译“出去”更自然。
- source_word: מְבֹהָלִים וּדְחוּפִים
  choice: 在……催逼之下火速
  rationale: 两个被动分词共同表现信使被迫加快速度、紧急赶路；译文保留外在催促与行动迅急两层意思。
- source_word: בִּדְבַר הַמֶּלֶךְ
  choice: 在王命……之下
  rationale: דבר在这里是具有权威的命令，介词ב表达命令所带来的推动或依据。
- source_word: וְהַדָּת
  choice: 谕旨
  rationale: דת在《以斯帖记》的波斯行政语境中指正式颁行的王家法令；“谕旨”符合君王发布命令的语境。
- source_word: נִתְּנָה
  choice: 颁布了
  rationale: 字面为“被给予”，在行政语境中表示法令正式发布，故译为“颁布了”。
- source_word: בְּשׁוּשַׁן הַבִּירָה
  choice: 在书珊城堡
  rationale: 保留传统地名“书珊”，并将הַבִּירָה译为“城堡”，指书珊的王城或设防宫城。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“驿使”“谕旨”“书珊城堡”保持波斯宫廷行政语境；以“催逼”“火速”再现原文连续两个被动分词所强调的紧迫感。
