base_translation:
  language: en
  yaml_path: translation/ot/esther/008/015.yaml
  text: And Mordecai went out from the presence of the king in royal clothing of blue and white[a], with a large crown of gold and a robe of fine linen and purple[e][d][c][b]; and the city of Susa shouted and rejoiced.
translation:
  language: zh_hans
  text: 末底改从王面前出来，身穿蓝白两色的王服，头戴一顶大金冠，又披着细麻和紫色的外袍[a]；书珊城欢呼喜乐。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “外袍”所译的希伯来语也可指披风或裹身衣。
    reason: lexical_alternative
lexical_decisions:
- source_word: יָצָא מִלִּפְנֵי הַמֶּלֶךְ
  choice: 从王面前出来
  rationale: 贴近希伯来语宫廷用语的字面结构，同时在现代汉语中自然清楚，表示末底改离开王所在之处。
- source_word: לְבוּשׁ מַלְכוּת
  choice: 王服
  rationale: 简洁表达王室身份与礼仪性质；下文随即说明其颜色。
- source_word: תְּכֵלֶת וָחוּר
  choice: 蓝白两色
  rationale: 保留两种颜色的并列。תְּכֵלֶת可能指蓝色至蓝紫色的贵重染料，但正文采用通行且清楚的“蓝”。
- source_word: עֲטֶרֶת זָהָב גְּדוֹלָה
  choice: 一顶大金冠
  rationale: 保留冠饰的材质和宏大尺寸；量词“一顶”符合现代汉语习惯。
- source_word: תַכְרִיךְ
  choice: 外袍
  rationale: 该词指包裹身体的衣物或披裹式服装；“外袍”既自然，也不过度限定具体式样。
- source_word: בּוּץ וְאַרְגָּמָן
  choice: 细麻和紫色
  rationale: 保留原文对贵重材料与颜色的并列描述；“细麻”体现בּוּץ的优质麻织品含义。
- source_word: הָעִיר שׁוּשָׁן
  choice: 书珊城
  rationale: 采用中文圣经传统中广为人知的地名译法，并以“城”自然表达原文结构。
- source_word: צָהֲלָה וְשָׂמֵחָה
  choice: 欢呼喜乐
  rationale: 分别保留公开发声庆贺与内在欢喜这两个相连而有区别的动作。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。句式保留原文由末底改的王室装束转向全城反应的推进；避免把衣物式样解释得过于具体。
