base_translation:
  language: en
  yaml_path: translation/ot/esther/008/004.yaml
  text: Then the king held out the golden scepter to Esther[a], and Esther rose and stood before the king.
translation:
  language: zh_hans
  text: 于是，王向以斯帖伸出金杖[a]；以斯帖便起身，站在王面前。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“把金杖伸向以斯帖。”
    reason: 词汇表达的另一种可能，突出动作的方向性。
lexical_decisions:
- source_word: וַיּוֹשֶׁט
  choice: 伸出
  rationale: 该动词表示伸展、递出；“伸出”自然准确，适合王向以斯帖示意的宫廷语境。
- source_word: שַׁרְבִיט הַזָּהָב
  choice: 金杖
  rationale: 指王所持的金质或金色权杖；“金杖”简洁自然，也与《以斯帖记》上下文中的既有王室器物相符。
- source_word: וַתָּקָם
  choice: 起身
  rationale: 该动词意为起来；“起身”既符合现代汉语，又与下文“站在”保持动作上的区别。
- source_word: וַתַּעֲמֹד לִפְנֵי הַמֶּלֶךְ
  choice: 站在王面前
  rationale: לִפְנֵי表示“在……面前”或“在……面前侍立”；此译法自然、正式，并保留宫廷场景。
- source_word: וַ
  choice: 于是／便
  rationale: 连续式叙事中的连接词推进事件次序；分别用“于是”和“便”可自然表达动作承接，避免机械重复“和”。
- source_word: לְאֶסְתֵּר
  choice: 向以斯帖
  rationale: 介词在此表示动作所朝向的对象；汉语以“向”搭配“伸出”最为自然。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“于是……便……”清楚呈现叙事推进；“起身，站在”保留原文两个连续而不同的动作。
