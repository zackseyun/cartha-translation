base_translation:
  language: en
  yaml_path: translation/ot/esther/008/007.yaml
  text: Then King Ahasuerus said to Queen Esther and to Mordecai the Jew[a], “Look, I have given Haman’s house to Esther, and they have hanged him on the gallows because he stretched out his hand against the Jews.”
translation:
  language: zh_hans
  text: 亚哈随鲁王对王后以斯帖和犹大人末底改说：“看哪，我已把哈曼的家产赐给以斯帖；至于哈曼，他们已把他挂在木架上[a]，因为他曾伸手攻击犹大人。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译“挂在树木上”。这里指为处决哈曼所用的木制刑具，因此译作“木架”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 叙事中的连续式推进事件；现代汉语通常无需另加“然后”，上下文已清楚表达先后。
- source_word: הַמֶּלֶךְ אֲחַשְׁוֵרֹשׁ
  choice: 亚哈随鲁王
  rationale: 按现代汉语习惯将王号置于人名之后，并采用《以斯帖记》中通行的音译。
- source_word: לְאֶסְתֵּר הַמַּלְכָּה
  choice: 对王后以斯帖
  rationale: 保留王后头衔，并采用自然、庄重的现代汉语语序。
- source_word: וּלְמָרְדֳּכַי הַיְּהוּדִי
  choice: 和犹大人末底改
  rationale: יְהוּדִי在本书中是族群称谓；“犹大人”既保留其词源与历史背景，也符合中文圣经语境。
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留指示和强调作用；“看哪”虽带经文语体色彩，但仍易懂且庄重。
- source_word: בֵית הָמָן
  choice: 哈曼的家产
  rationale: בַּיִת可指房屋、家室或产业；结合7:9及8:1的财产处置语境，“家产”比单指建筑物的“房屋”更贴切。
- source_word: נָתַתִּי
  choice: 我已……赐给
  rationale: 完成式表示已经完成且结果仍然有效的行动；“已”明确这一点，“赐给”符合君王处置产业的语境。
- source_word: וְאֹתוֹ תָּלוּ
  choice: 至于哈曼，他们已把他挂
  rationale: 原文以宾语“他”前置，并用主语未明的第三人称复数；中文以“至于哈曼”凸显转折对象，同时保留不特指施行者的“他们”。
- source_word: עַל הָעֵץ
  choice: 在木架上
  rationale: עֵץ本义可指树或木头，此处指处决哈曼的木制刑具；“木架”既传达语境，也避免把具体构造过度确定为近代绞刑架。
- source_word: עַל אֲשֶׁר
  choice: 因为
  rationale: 该组合在此引出哈曼受刑的原因，现代汉语用“因为”最清楚自然。
- source_word: שָׁלַח יָדוֹ
  choice: 伸手攻击
  rationale: 保留“伸手”的希伯来语意象，同时以“攻击”说明该习语所表达的敌对行动。
- source_word: ביהודיים
  choice: 犹大人
  rationale: 指哈曼意图加害的整个族群；与本节对末底改的族群称谓保持一致。
theological_decisions: []
