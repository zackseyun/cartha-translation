revisions:
- from: 以斯帖又在王面前说话。她俯伏在王脚前[a]，哭泣着恳求王消除亚甲人哈曼所行的恶，以及他谋害犹太人的计谋。
  to: 以斯帖又在王面前开口。她俯伏在王脚前[a]，哭泣着恳求王除去亚甲人哈曼的恶事，以及他针对犹太人所谋划的计谋。
  rationale: 修改首句以提升现代汉语的自然度；将“谋害犹太人”改为“针对犹太人”，避免把原文较宽泛的敌对性谋划收窄为特定杀害行为；并微调“哈曼的恶”的表达，使其与“除去”搭配更自然，同时仍与下文“计谋”有所区分。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T06:21:15Z'
