base_translation:
  language: en
  yaml_path: translation/ot/esther/008/003.yaml
  text: Then Esther spoke again before the king. She fell before his feet[a], wept, and pleaded with him to avert the evil of Haman the Agagite and his scheme that he had devised against the Jews.
translation:
  language: zh_hans
  text: 以斯帖又在王面前开口。她俯伏在王脚前[a]，哭泣着恳求王除去亚甲人哈曼的恶事，以及他针对犹太人所谋划的计谋。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“倒在王脚前”。原文描写以斯帖伏地恳求的姿态。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתּוֹסֶף אֶסְתֵּר וַתְּדַבֵּר
  choice: 以斯帖又……说话
  rationale: יסף 加后续限定动词表示动作重复或继续；“又……说话”自然保留“再次”的意思。
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: 在王面前
  rationale: 保留空间和宫廷场景中的正式意味，即在王的面前、王的临在中。
- source_word: וַתִּפֹּל לִפְנֵי רַגְלָיו
  choice: 她俯伏在王脚前
  rationale: 该短语描写恳求者身体伏地的姿态；“俯伏”比单纯“倒下”更准确传达此处的动作与语境。
- source_word: וַתֵּבְךְּ וַתִּתְחַנֶּן לוֹ
  choice: 哭泣着恳求王
  rationale: בכה 是哭泣，חנן 的 Hitpael 形式表示恳切求恩；合译流畅而保留情感和请求的力度。
- source_word: לְהַעֲבִיר
  choice: 消除
  rationale: עבר 的 Hiphil 表示使之过去、除去或废除；“消除”可自然搭配后面的“恶”和“计谋”，同时不把含义限定为法律上的撤销。
- source_word: אֶת רָעַת הָמָן הָאֲגָגִי
  choice: 亚甲人哈曼所行的恶
  rationale: רָעָה 可指邪恶、祸害或恶行。译作“所行的恶”保留道德维度，并避免与下文明确的“计谋”合并为同一概念。
- source_word: וְאֵת מַחֲשַׁבְתּוֹ אֲשֶׁר חָשַׁב עַל הַיְּהוּדִים
  choice: 以及他谋害犹太人的计谋
  rationale: חשב 的名词与动词同根复现，强调蓄意策划；汉语用“谋害……的计谋”自然表达其针对犹太人的敌意，也保留与前项“恶”的区别。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“王”在同一句中重复一次，以避免“他”在哈曼出现前后造成指代含混；不添加原文没有的神学解释。
