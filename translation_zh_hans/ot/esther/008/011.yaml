  text: אֲשֶׁר֩ נָתַ֨ן הַ/מֶּ֜לֶךְ לַ/יְּהוּדִ֣ים אֲשֶׁ֣ר בְּ/כָל עִיר וָ/עִ֗יר לְ/הִקָּהֵל֮ וְ/לַ/עֲמֹ֣ד עַל נַפְשָׁ/ם֒ לְ/הַשְׁמִיד֩ וְ/לַ/הֲרֹ֨ג וּ/לְ/אַבֵּ֜ד אֶת כָּל חֵ֨יל עַ֧ם וּ/מְדִינָ֛ה הַ/צָּרִ֥ים אֹתָ֖/ם טַ֣ף וְ/נָשִׁ֑ים וּ/שְׁלָלָ֖/ם לָ/בֽוֹז׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/008/011.yaml
  text: that the king granted the Jews in every single city to assemble and to stand for their lives[a], to destroy, to kill, and to annihilate every armed force of any people or province that might attack them, including children and women[b], and to plunder their spoil.
translation:
  language: zh_hans
  text: 王准许各城的犹太人聚集起来，挺身保全自己的性命[a]，除灭、杀死、消灭任何攻击他们的民族或省份的一切武装力量，包括孩童和妇女[b]，并掠夺他们的财物。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译近于“为自己的性命站立”，意思是挺身自卫以保全性命。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文作“孩童和妇女”；诏令的措辞明确把他们包括在所描述的敌方群体中。
    reason: cultural_note
lexical_decisions:
- source_word: אֲשֶׁר נָתַן
  choice: 王准许
  rationale: 此关系从句承接上一节诏书的内容；נָתַן 在王令语境中表达授予权利或许可，译作“准许”自然且符合行政法律语气。
- source_word: בְּכָל עִיר וָעִיר
  choice: 各城
  rationale: 希伯来语的重复结构具有逐一分配和无一遗漏之意；现代汉语“各城”简洁地传达这一范围。
- source_word: לְהִקָּהֵל
  choice: 聚集起来
  rationale: 该词为尼法勒式，表示集合成群；“聚集起来”保留其自发聚合的含义，语言自然。
- source_word: וְלַעֲמֹד עַל נַפְשָׁם
  choice: 挺身保全自己的性命
  rationale: 原文直译近于“为自己的性命站立”。“挺身保全”保留“站立”的形象，同时清楚传达为求生而自卫的语境。
- source_word: לְהַשְׁמִיד וְלַהֲרֹג וּלְאַבֵּד
  choice: 除灭、杀死、消灭
  rationale: 三个近义动词构成刻意累积的暴力法律措辞，译文逐一呈现，不加弱化。
- source_word: כָּל חֵיל
  choice: 一切武装力量
  rationale: חֵיל 在此指军事力量或武装队伍，而非财富；“武装力量”最符合诏令准许自卫的上下文。
- source_word: עַם וּמְדִינָה
  choice: 任何……民族或省份
  rationale: 这一组合涵盖帝国内族群与行政区域；补出“任何”传达原文整体、泛指的范围。
- source_word: הַצָּרִים אֹתָם
  choice: 攻击他们的
  rationale: צרר 的分词可指敌视、与之为敌或加害的人；在本节防卫语境中，“攻击他们的”自然地表达其实际敌对行动，同时不把时态限定为已经发生或仅属可能。
- source_word: טַף וְנָשִׁים
  choice: 包括孩童和妇女
  rationale: טַף 指孩童或受抚养者。根据句法，这一短语包含在被针对的敌方群体之内；“包括”使现代汉语关系清楚，但不淡化文本的伦理张力。
- source_word: וּשְׁלָלָם לָבוֹז
  choice: 夺取他们的财物为掠物
  rationale: 原文准许掠夺敌方战利品；此译既表达夺取行为，也保留“掠物”的法律战争语汇。
theological_decisions:
- issue: 王令中的暴力语言
  choice: 直接译出“除灭、杀死、消灭”三个动词，并以“挺身保全自己的性命”和“攻击他们的”保留防卫语境。
  alternative: 用“击败”“制伏”等较缓和的词，或概括为“抵御攻击者”。
  rationale: 原文明确采用三个累积的毁灭性动词，也准许掠夺；忠实翻译不应减轻其严厉程度。同时，上下文确有保命和面对敌对者的防卫框架，也不应抹去。
- issue: “孩童和妇女”的范围
  choice: 将其明确呈现为敌方目标群体中所包括的人，保留原文令人不安的伦理张力。
  alternative: 省略、模糊处理，或解释为与被攻击群体无关的独立成分。
  rationale: 句法最自然地将“孩童和妇女”连接于前述被处置的敌方群体。译文应透明呈现，而不替文本化解其道德难题。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话，保留诏令的法律语气和三重暴力动词。主句承接上一节，因此以“王准许”起句。脚注仅解释原文形象及困难句法，不替读者消解伦理张力。
