base_translation:
  language: en
  yaml_path: translation/ot/esther/008/002.yaml
  text: Then the king removed his signet ring[a], which he had taken away from Haman, and gave it to Mordecai. And Esther appointed Mordecai over the house of Haman.
translation:
  language: zh_hans
  text: 王摘下他从哈曼那里收回的印戒，交给末底改。以斯帖委派末底改管理哈曼的家业[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “家业”或译“家宅”“家属”“产业”。
    reason: 原文בֵּית可指房屋、家属或整个产业；本节语境不能完全排除这些彼此重叠的含义。
lexical_decisions:
- source_word: וַיָּסַר
  choice: 摘下
  rationale: 使役形在这里表示使物件离开原处；用于手上的戒指时，“摘下”是准确、自然的现代汉语。
- source_word: טַבַּעְתּוֹ
  choice: 他的印戒
  rationale: 原词可泛指戒指，但《以斯帖记》的宫廷语境表明这是用于盖印授权的王室印戒；保留第三人称领属关系。
- source_word: אֲשֶׁר הֶעֱבִיר מֵהָמָן
  choice: 他从哈曼那里收回的
  rationale: 使役形可表示移走、拿走或转交；“收回”贴合君王先前把印戒交给哈曼、如今因哈曼倒台而撤回的叙事语境。
- source_word: וַיִּתְּנָהּ לְמָרְדֳּכָי
  choice: 交给末底改
  rationale: נתן的基本义是“给”；“交给”在此自然表达印戒及其授权的转移，又不额外解释其法律效力。
- source_word: וַתָּשֶׂם אֶסְתֵּר אֶת מָרְדֳּכַי עַל
  choice: 以斯帖又派末底改管理
  rationale: שׂים与עַל连用表示把某人置于某事物之上、委派其负责；“派……管理”清楚表达行政职责。
- source_word: בֵּית הָמָן
  choice: 哈曼的家业
  rationale: בַּיִת在这里可涵盖房屋、家属与产业。上文提到哈曼的产业归给以斯帖，因此“家业”能自然传达整体财产与家务管辖的广义，同时以脚注保留其他可能。
theological_decisions: []
translation_notes:
  register: 采用简洁、庄重的现代标准汉语。“印戒”体现宫廷授权语境；“家业”保留原文“家”的宽泛语义。英文咨询层的脚注标记附在“signet ring”之后，但其脚注内容实际解释“house of Haman”；本稿依原文所指将标记置于“哈曼的家业”之后。
