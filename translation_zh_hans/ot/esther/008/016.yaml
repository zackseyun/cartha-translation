  text: 犹太人有了光明、欢喜、快乐和尊荣。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“对犹太人来说，有了光明、欢喜、快乐和尊荣。”希伯来语的句式既可按领有关系译作“犹太人有了”，也可按存在关系译作“对犹太人来说，有了”。
    reason: lexical_alternative
lexical_decisions:
- source_word: לַיְּהוּדִים
  choice: 犹太人有了
  rationale: 句首的 לְ 可标示相关对象或领有者；与 הָיְתָה 连用时，现代汉语自然表达为“犹太人有了”。这也保留了希伯来语所表达的处境转变。
- source_word: הָיְתָה
  choice: 有了
  rationale: 完成式 היה 在这里表示新局面的出现；“有了”比静态的“有”更符合上下文中的命运逆转，同时不扩写为“临到”。
- source_word: אוֹרָה
  choice: 光明
  rationale: 保留原文“光”的意象，并以现代汉语中自然、庄重的“光明”表达获救后明朗昌盛的处境，而不把比喻直接解释成“救恩”。
- source_word: שִׂמְחָה
  choice: 欢喜
  rationale: 译作“欢喜”，与后面的 שָׂשׂוֹן 区分开来，同时保留原文近义词叠加所形成的庆贺语势。
- source_word: שָׂשׂוֹן
  choice: 快乐
  rationale: 该词表示欣喜、欢腾；“快乐”通俗自然，并与“欢喜”形成近义并列。
- source_word: יְקָר
  choice: 尊荣
  rationale: 本处侧重犹太人在社会地位上得到的尊重与荣耀；“尊荣”比“华美”更切合上下文，也保持庄重语体。
