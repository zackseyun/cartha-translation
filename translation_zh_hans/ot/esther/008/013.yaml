  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: פַּתְשֶׁ֣גֶן הַ/כְּתָ֗ב לְ/הִנָּ֤תֵֽן דָּת֙ בְּ/כָל מְדִינָ֣ה וּ/מְדִינָ֔ה גָּל֖וּי לְ/כָל הָ/עַמִּ֑ים וְ/לִ/הְי֨וֹת ה/יהודיים עתודים לַ/יּ֣וֹם הַ/זֶּ֔ה לְ/הִנָּקֵ֖ם מֵ/אֹיְבֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/008/013.yaml
  text: A copy of the written decree was to be issued as law in every province and province[a], being made public to all the peoples[d][c][b], and so that the Jews would be ready on that day to avenge themselves on their enemies.
translation:
  language: zh_hans
  text: 诏书的副本要在各省颁布为法令，并向各族公开，使犹太人预备好，在那一天向仇敌报仇。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “报仇”也可译作“为自己复仇”。原文动词明确含有复仇、报仇之意，并非仅指自卫。
    reason: alternative_reading
lexical_decisions:
- source_word: פַּתְשֶׁגֶן הַכְּתָב
  choice: 诏书的副本
  rationale: פַּתְשֶׁגֶן是指官方文书的副本，הַכְּתָב在王室行政语境中指成文诏书；合译简洁而明确。
- source_word: לְהִנָּתֵן דָּת
  choice: 颁布为法令
  rationale: 表达官方命令被正式发布并取得法律效力；“法令”也符合波斯行政语境。
- source_word: בְּכָל מְדִינָה וּמְדִינָה
  choice: 在各省
  rationale: 希伯来语逐字为“每省和省”，是周遍性的分配表达；现代汉语用“各省”自然传达其含义。
- source_word: גָּלוּי לְכָל הָעַמִּים
  choice: 向各族公开
  rationale: גָּלוּי表示公开、公布；עַמִּים为复数，在帝国背景下指不同族群，故译“各族”。
- source_word: וְלִהְיוֹת הַיְּהוּדִים עֲתוּדִים
  choice: 使犹太人预备好
  rationale: 不定式结构表达该诏令的目的或结果；עֲתוּדִים意为已经准备妥当。
- source_word: לַיּוֹם הַזֶּה
  choice: 在那一天
  rationale: 字面为“为这一天”，但叙事中指诏书所指定的日期；汉语以“在那一天”清楚表达时间指向。
- source_word: לְהִנָּקֵם מֵאֹיְבֵיהֶם
  choice: 向仇敌报仇
  rationale: נקם的尼法勒式明确表示为自己复仇、报仇；介词结构在汉语中自然译作“向仇敌报仇”。
theological_decisions:
- issue: 是否弱化经文中的复仇措辞
  choice: 向仇敌报仇
  alternative: 抵御仇敌／自卫
  rationale: 原文动词נקם具体表示报仇或复仇。虽然后文语境涉及自我保护，本节不宜把原文的暴力与司法张力解释性地弱化为单纯自卫。
translation_notes:
  register: 采用现代、庄重而通顺的书面普通话。“诏书”“颁布”“法令”保留波斯王室行政语体；将希伯来语分配式重复“每省和省”自然化为“各省”，不在正文中保留生硬重复。
