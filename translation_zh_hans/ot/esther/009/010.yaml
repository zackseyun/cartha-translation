  text: עֲ֠שֶׂרֶת בְּנֵ֨י הָמָ֧ן בֶּֽן הַמְּדָ֛תָא צֹרֵ֥ר הַ/יְּהוּדִ֖ים הָרָ֑גוּ וּ/בַ֨/בִּזָּ֔ה לֹ֥א שָׁלְח֖וּ אֶת יָדָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/010.yaml
  text: the ten sons of Haman son of Hammedatha[a], the enemy of the Jews, they killed; but they did not lay a hand on the plunder.
translation:
  language: zh_hans
  text: 他们杀了犹太人的仇敌、哈米大他的儿子哈曼的十个儿子，却没有伸手取战利品[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：掠夺物。
    reason: בִּזָּה 可指抢夺或掠夺所得之物；“战利品”为正文的自然译法，脚注保留另一准确词汇表达。
lexical_decisions:
- source_word: עֲשֶׂרֶת בְּנֵי הָמָן
  choice: 哈曼的十个儿子
  rationale: עֲשֶׂרֶת 与 בְּנֵי 构成限定性的数词短语；上下文列出的确是哈曼的十名男性后代，因此译作“十个儿子”准确自然。
- source_word: בֶּן הַמְּדָתָא
  choice: 哈米大他的儿子
  rationale: 这是说明哈曼身份的同位语；人名按现代中文圣经通行形式音译。
- source_word: צֹרֵר הַיְּהוּדִים
  choice: 犹太人的仇敌
  rationale: צֹרֵר 指敌对、加害或使人受困苦者；“仇敌”既表达持续的敌意，也符合庄重而易懂的现代中文。
- source_word: הָרָגוּ
  choice: 他们杀了
  rationale: הרג 的完成式第三人称复数直指杀死；“杀了”简明准确，不弱化动作。
- source_word: וּבַבִּזָּה
  choice: 却……战利品
  rationale: בִּזָּה 指抢夺所得的财物、掠物；“战利品”是自然清楚的现代汉语。连接词 וּ 在这里表达与杀敌行为相对照的转折关系，故译作“却”。
- source_word: לֹא שָׁלְחוּ אֶת יָדָם
  choice: 没有伸手拿
  rationale: 原文直译为“不伸出他们的手”，在此指不取用或占有；“伸手拿”保留手的具体意象，同时清楚传达其惯用含义。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事文体。把身份说明“犹太人的仇敌、哈米大他的儿子哈曼”置于“十个儿子”之前的修饰结构中，使中文句法流畅；用“却”明确原文语境中的对照，同时以“伸手拿”保留希伯来语的身体意象。
