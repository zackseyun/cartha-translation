  yaml_path: translation/ot/esther/009/014.yaml
  text: So the king said that it should be done so. A decree was issued in Susa[a], and the ten sons of Haman were hanged.
translation:
  language: zh_hans
  text: 王说：“就照这样办。”于是，在书珊颁布了谕令；哈曼的十个儿子被悬挂起来[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“被钉在柱上”。希伯来语动词可指把尸体挂在木架或柱上，不一定是现代意义上以绳勒颈的绞刑。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: אמר的通常含义是“说”。这里引出王对以斯帖请求的准许；译作“说”不把它过度解释为正式下令，后句的谕令已表明其官方效力。
- source_word: לְהֵעָשׂוֹת כֵּן
  choice: 就照这样办
  rationale: 该不定式结构表达以斯帖所求之事获准施行。中文用“就照这样办”自然简洁，并保留כן“这样、如此”的指向。
- source_word: וַתִּנָּתֵן דָּת
  choice: 颁布了谕令
  rationale: נתן与דת连用是波斯时期的行政用语。“颁布谕令”准确表达官方命令被发布，且比直译“给出法令”自然。
- source_word: בְּשׁוּשָׁן
  choice: 书珊
  rationale: 采用中文圣经传统中对波斯都城שׁוּשָׁן的通行译名。
- source_word: עֲשֶׂרֶת בְּנֵי הָמָן
  choice: 哈曼的十个儿子
  rationale: 直接呈现希伯来文属格结构，中文自然明确。
- source_word: תָּלוּ
  choice: 被悬挂起来
  rationale: תלה可指把人或尸体挂在木架、柱或刑具上，具体方式未必等同于现代意义上的绞刑。“悬挂起来”保留动作本身及其可能的陈尸含义，不武断限定致死方式。
