  text: עַל כֵּ֞ן הַ/יְּהוּדִ֣ים ה/פרוזים הַ/יֹּשְׁבִים֮ בְּ/עָרֵ֣י הַ/פְּרָזוֹת֒ עֹשִׂ֗ים אֵ֠ת י֣וֹם אַרְבָּעָ֤ה עָשָׂר֙ לְ/חֹ֣דֶשׁ אֲדָ֔ר שִׂמְחָ֥ה וּ/מִשְׁתֶּ֖ה וְ/י֣וֹם ט֑וֹב וּ/מִשְׁל֥וֹחַ מָנ֖וֹת אִ֥ישׁ לְ/רֵעֵֽ/הוּ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/019.yaml
  text: Therefore the Jews of the villages[a], who live in the rural towns, make the fourteenth day of the month of Adar a day of gladness and feasting and a holiday, and of sending portions[b], each man to his neighbor.
translation:
  language: zh_hans
  text: 因此，住在没有城墙的城镇里的犹太人[a]，把亚达月十四日定为欢喜、宴饮和节日的日子，并彼此馈送礼物[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“住在乡村聚落里的犹太人”。原文所用词语可指开放的、没有城墙设防的聚落。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“送出份额”；在这里很可能指为筵席馈送的食物份额或礼物。
    reason: cultural_note
lexical_decisions:
- source_word: עַל כֵּן
  choice: 因此
  rationale: 承接上文并引出结果，保留原文的因果推论关系。
- source_word: הַיְּהוּדִים הַפרוזים הַיֹּשְׁבִים בְּעָרֵי הַפְּרָזוֹת
  choice: 住在无城墙乡镇的犹太人
  rationale: פרוזים及עָרֵי הַפְּרָזוֹת均指没有城墙设防的居民或聚落；合并为自然的现代汉语，同时保留与下一节设防城邑的对比。
- source_word: עֹשִׂים אֵת יוֹם אַרְבָּעָה עָשָׂר לְחֹדֶשׁ אֲדָר
  choice: 把亚达月十四日定为
  rationale: עשה与日期连用表示守为、作为或庆祝某日；“定为”既贴合后接多个表语的句法，也不额外限定为某种礼仪。
- source_word: שִׂמְחָה וּמִשְׁתֶּה וְיוֹם טוֹב
  choice: 欢喜、宴饮和庆祝的日子
  rationale: 分别表达喜乐、筵席（可能含饮酒）与节庆之日；“宴饮”保留מִשְׁתֶּה的饮宴色彩，“庆祝的日子”自然表达יוֹם טוֹב在此处的节日含义。
- source_word: וּמִשְׁלוֹחַ מָנוֹת
  choice: 赠送食物
  rationale: 字面为“送出份额”；上下文是节庆宴饮，所送很可能是食物份额。正文采用自然清楚的表达，并以脚注保留原词较宽泛的形式。
- source_word: אִישׁ לְרֵעֵהוּ
  choice: 彼此
  rationale: 这是希伯来语常见的相互性分配表达，字面为“各人给他的同伴”；“彼此”准确传达群体成员互赠的功能，不把语法阳性误解为仅限男性。
theological_decisions:
- issue: אִישׁ לְרֵעֵהוּ的语法阳性与所指范围
  choice: 彼此
  alternative: 各人送给自己的同伴
  rationale: 该固定式以阳性单数表达相互行动，语境涉及整个犹太群体，并无证据把实践限于男性；译为“彼此”保留其群体性与相互性。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“无城墙乡镇”明确呈现本节与设防城邑之间的地理差别；“亚达月”沿用常见圣经月份译名。所有脚注标记均已置于正文相应位置。
