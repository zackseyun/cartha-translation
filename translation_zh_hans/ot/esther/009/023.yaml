base_translation:
  language: en
  yaml_path: translation/ot/esther/009/023.yaml
  text: So the Jews accepted what they had begun to do[a], and what Mordecai had written to them.
translation:
  language: zh_hans
  text: 犹太人就接受了他们已经开始做的事[a]，以及末底改写给他们的内容。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“把他们已经开始做的事承担起来。”希伯来文动词既可表示“接受”，也可表示把某事承担在自己身上。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקִבֵּל
  choice: 接受了
  rationale: קבל在本节语境中指接受并承担某种做法或义务。“接受了”保留其基本含义，也能与两个并列宾语自然搭配。
- source_word: הַיְּהוּדִים
  choice: 犹太人
  rationale: 带定冠词的族群称谓，现代汉语自然译作“犹太人”。
- source_word: אֵת אֲשֶׁר הֵחֵלּוּ לַעֲשׂוֹת
  choice: 他们已经开始实行的事
  rationale: הֵחֵלּוּ表示“开始”，לַעֲשׂוֹת表示“去做”。因所指为已经开始遵行的节期惯例，“实行”比泛泛的“做”更符合上下文。
- source_word: וְאֵת אֲשֶׁר
  choice: 也接受了……的事
  rationale: 希伯来文以第二个直接宾语标记构成与前项平行的宾语。汉语重复谓语“接受了”，使并列关系清楚自然。
- source_word: כָּתַב
  choice: 写给
  rationale: 完成式表示写信这一行动已发生；汉语无需另加过去完成标记，结合אֲלֵיהֶם译为“写给他们”。
- source_word: מָרְדֳּכַי
  choice: 末底改
  rationale: 采用现代中文圣经传统中通行且易识别的人名译法。
- source_word: אֲלֵיהֶם
  choice: 给他们
  rationale: 介词אֶל表示朝向或对象，在书面传达语境中自然译为“给他们”。
theological_decisions:
- issue: 犹太人对普珥日惯例所采取行动的性质
  choice: 接受了
  alternative: 承担了／确认了
  rationale: 原文动词קבל可表示接受，也可含承担在自己身上的意味。正文不把它限定为法律确认或纯粹自愿承诺，并以脚注保留另一可能。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。为保留原文两个并列宾语的结构，第二项重复“接受了”；“实行”点明这里所说的是已经开始遵守的惯例，同时避免加入原文未明说的“节期”或“规定”。
