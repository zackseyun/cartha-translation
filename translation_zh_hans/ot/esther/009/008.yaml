  text: 还有波拉他[a]、亚大利雅和亚利大他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节承接上一节哈曼众子的名单；“杀了”一词沿用《以斯帖记》9:7。
    reason: cross_reference
lexical_decisions:
- source_word: וְ/אֵת
  choice: 还有……、……和……
  rationale: וְ与直接宾语标记אֵת在此逐项引出名单中的人名，并承接上一节的谓语“杀了”。汉语不另译直接宾语标记；用“还有”表明名单续接，再用顿号和“和”自然连接各项。
- source_word: פּוֹרָתָא
  choice: 波拉他
  rationale: 这是人名，按希伯来语形式音译；采用易于现代汉语读者辨认和朗读的字形。
- source_word: אֲדַלְיָא
  choice: 亚大利雅
  rationale: 这是人名，按希伯来语形式音译，并以“雅”体现词尾音节。
- source_word: אֲרִידָתָא
  choice: 亚利大他
  rationale: 这是人名，按希伯来语形式音译，保留与前一人名不同的音节结构。
