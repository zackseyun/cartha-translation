base_translation:
  language: en
  yaml_path: translation/ot/esther/009/005.yaml
  text: So the Jews struck all their enemies with the stroke of the sword[a], and with slaughter and destruction[b], and they did to those who hated them as they pleased.
translation:
  language: zh_hans
  text: 于是，犹太人用刀剑击打[a]他们所有的仇敌，杀戮并毁灭他们；他们按照自己的意愿对待那些恨他们的人[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语直译为“刀剑的一击”或“刀剑的击打”。
    reason: 说明מַכַּת חֶרֶב这一凝缩的构词短语及其字面意象。
  - marker: b
    text: 或译：“按他们自己的意愿。”
    reason: 保留כִּרְצוֹנָם较为字面的译法。
lexical_decisions:
- source_word: וַיַּכּוּ
  choice: 击打
  rationale: נכה含义较宽，可指击打、攻击或击杀。译作“击打”保留动词本身的宽泛性，由后面的“杀戮并毁灭”说明其致命后果。
- source_word: הַיְּהוּדִים
  choice: 犹太人
  rationale: 在《以斯帖记》的波斯流散背景中，יְהוּדִים指作为族群和信仰群体的犹太人；“犹太人”是现代汉语中自然准确的称呼。
- source_word: בְּכָל אֹיְבֵיהֶם
  choice: 所有仇敌
  rationale: 保留כָל所表达的完整范围；“仇敌”也与后文“那些恨他们的人”形成原文中的词汇区别。
- source_word: מַכַּת חֶרֶב
  choice: 用刀剑击打
  rationale: 该结构直译为“刀剑的击打”。“用刀剑击打”在汉语中较自然，同时保留原文对刀剑打击动作的明确表达。
- source_word: וְהֶרֶג וְאַבְדָן
  choice: 杀戮并毁灭
  rationale: 保留原文连续堆叠的强烈暴力用语，不弱化为笼统的“击败”，也不夸张为原文未必要求的“彻底灭绝”。
- source_word: וַיַּעֲשׂוּ בְשֹׂנְאֵיהֶם
  choice: 处置那些恨他们的人
  rationale: עשה是宽泛的“做、行”，结合介词短语，在汉语中以“处置”表达对这些人采取行动；“那些恨他们的人”准确保留שׂנא分词的含义，并避免与前面的“仇敌”合并。
- source_word: כִּרְצוֹנָם
  choice: 想怎样……就怎样
  rationale: 其字面义为“按照他们的意愿”。这一汉语结构自然表达他们可随意采取行动，同时不额外判断其动机。
theological_decisions:
- issue: 如何呈现战争叙事中的暴力而不加以淡化或夸张
  choice: 直译为“用刀剑击打……杀戮并毁灭”
  alternative: 弱化为“击败”，或强化为“彻底歼灭”
  rationale: 希伯来文连续使用“刀剑的击打、杀戮、毁灭”等词，译文应保留其严酷程度，同时不加入超出词义证据的评价或程度。
- issue: 是否对犹太人的行动作道德或神学解释
  choice: 仅陈述他们按自己的意愿处置仇恨他们的人
  alternative: 加入“正当地报复”“奉命惩罚”等解释
  rationale: 本节叙述行动本身，并未在句内明说其道德性质或神学依据；译文不替原文消解这一张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“击打”保留首个动词的宽泛性，“杀戮并毁灭”则呈现随后名词的致命力度；末句用汉语对举结构传达“按照他们的意愿”，不加入道德评断。
