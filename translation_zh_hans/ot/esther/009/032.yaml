base_translation:
  language: en
  yaml_path: translation/ot/esther/009/032.yaml
  text: And Esther’s command confirmed these matters of Purim[b][a], and it was written in the book.
translation:
  language: zh_hans
  text: 以斯帖的命令确立了这些有关普珥节的事[a]，这事也记在书上[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这些普珥节的规定”。“事”所对应的希伯来词也可指话语、事项或事务。
    reason: lexical_alternative
  - marker: b
    text: 或译：“也被写在书中。”原文没有明确说明被记下的具体是命令、这些事项，还是前述整件事。
    reason: ambiguity
lexical_decisions:
- source_word: מַאֲמַר
  choice: 命令
  rationale: 该词在此不是泛指一句话，而是指以斯帖带有权威、用于确立节期规例的指令；“命令”自然传达其正式效力。
- source_word: אֶסְתֵּר
  choice: 以斯帖
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: קִיַּם
  choice: 确立了
  rationale: 该动词有使之成立、站立得住之意；在确立普珥节规例的行政语境中，“确立”比单纯“证实”更自然，同时保留其使规定生效的含义。
- source_word: דִּבְרֵי הַפֻּרִים הָאֵלֶּה
  choice: 这些有关普珥节的事
  rationale: דִּבְרֵי 可指话语，也可指事项、事务；此处涵盖关于普珥节的规定或事宜，不宜限缩为口头言辞。中文调整语序，使表达自然，并保留“这些”的指示作用。
- source_word: הַפֻּרִים
  choice: 普珥节
  rationale: 采用通行节期名称；加“节”有助于普通读者明确这是节期，同时未改变专名所指。
- source_word: וְנִכְתָּב
  choice: 这事也记在
  rationale: 希伯来文为被动式“被写下”；中文以“记在”自然表达书面记录之意。“这事”作为语法补足语，指前述命令确立普珥节事项一事，但原文单数主语所指略有含混，故脚注说明。
- source_word: בַּסֵּפֶר
  choice: 书上
  rationale: סֵפֶר 可指书、卷册或文书记录；正文采用不作过度限定的“书上”，保留原文未说明具体是哪一部书的特点。
theological_decisions:
- issue: “记在书上”的语法主语
  choice: 正文以“这事”承接前述整件事
  alternative: 也可理解为以斯帖的命令、普珥节事项或相关文告被记载
  rationale: 原文 וְנִכְתָּב 是阳性单数被动式，所指并未明说。译文不应把它神学化或过度确定，因此正文采用宽泛的“这事”，并在脚注保留其他可能。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“确立”体现行政和法律语境；“有关普珥节的事”避免生硬直译，同时由脚注保留“规定／话语”等词义可能。所有脚注标记均置于正文对应位置。
