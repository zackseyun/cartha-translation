revisions:
- from: 就是犹太人得以摆脱仇敌、享受安宁的那些日子，也是他们由悲转喜、由哀悼变为喜庆之日的那个月；他们要把这些日子定为设宴欢乐的日子，彼此赠送食物[a]，并周济穷人。
  to: 即犹太人得享安宁、脱离仇敌的那些日子，以及他们由忧伤转为欢喜、由哀悼转为欢庆之日的那个月；要把这些日子定为宴饮欢乐的日子，彼此馈送食物[a]，并赠送礼物给穷人。
  rationale: 修订使句首连接更符合现代汉语，同时保留原文“安宁/脱离仇敌”的双重表达、悲哀与欢乐的平行逆转，以及“给穷人的礼物”的明示语义。“欢庆之日”是“好日子”在此节庆语境中的自然表达；未补出逆转的行动者。
