base_translation:
  language: en
  yaml_path: translation/ot/esther/009/022.yaml
  text: as the days on which the Jews had rest from their enemies[a], and as the month that had been turned for them from sorrow to gladness and from mourning to a good day, to make them days of feasting and gladness, and of sending portions, each man to his neighbor[c][b], and gifts to the poor.
translation:
  language: zh_hans
  text: 即犹太人得享安宁、脱离仇敌的那些日子，以及他们由忧伤转为欢喜、由哀悼转为欢庆之日的那个月；要把这些日子定为宴饮欢乐的日子，彼此馈送食物[a]，并赠送礼物给穷人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “食物”原文直译为“份”；这里很可能指作为节庆礼物互相馈送的食物份。
    reason: 文化与词义说明
lexical_decisions:
- source_word: נָחוּ מֵאֹיְבֵיהֶם
  choice: 得以摆脱仇敌、享受安宁
  rationale: נוח 表示安歇或获得缓解，מן 表示脱离其来源；合译既保留“安宁”，也明确这是从仇敌威胁下获得解脱。
- source_word: נֶהְפַּךְ
  choice: 变为
  rationale: 该词为 נפעל 形式，表达处境发生逆转；汉语“变为”自然呈现其被改变后的结果，而不额外指明行动者。
- source_word: יָגוֹן לְשִׂמְחָה
  choice: 由悲转喜
  rationale: 保留悲伤与欢喜之间简洁有力的对照，并与全节的逆转主题相呼应。
- source_word: אֵבֶל לְיוֹם טוֹב
  choice: 由哀悼变为喜庆之日
  rationale: אֵבֶל 是哀悼；יוֹם טוֹב 字面为“好日子”，语境中指欢庆的日子，译作“喜庆之日”较符合现代汉语。
- source_word: לַעֲשׂוֹת אוֹתָם
  choice: 把这些日子定为
  rationale: 字面是“使它们成为”；在设立纪念日的语境中，“定为”准确而自然。
- source_word: יְמֵי מִשְׁתֶּה וְשִׂמְחָה
  choice: 设宴欢乐的日子
  rationale: מִשְׁתֶּה 指筵席或宴饮；“设宴欢乐”传达节庆活动，又不把重点局限于饮酒。
- source_word: מִשְׁלוֹחַ מָנוֹת אִישׁ לְרֵעֵהוּ
  choice: 彼此赠送食物
  rationale: מָנוֹת 是“份、份额”，在节庆互赠语境中很可能指食物；אִישׁ לְרֵעֵהוּ 是分配式表达，现代汉语以“彼此”最自然。
- source_word: מַתָּנוֹת לָאֶבְיוֹנִים
  choice: 周济穷人
  rationale: 原文是“给穷人的礼物”；“周济穷人”简洁表达实际赠予及其扶助性质。
theological_decisions:
- issue: אִישׁ לְרֵעֵהוּ 的性别与分配式含义
  choice: 彼此
  alternative: 各人送给自己的邻舍
  rationale: 这里的阳性单数结构是惯用的分配式说法，重点是群体成员相互赠送，并非限制只有男性参与；“彼此”不增添性别限定，也符合现代汉语。
- issue: 逆转的行动者是否明说
  choice: 不补出行动者
  alternative: 上帝使之由悲转喜
  rationale: 本节的 נֶהְפַּךְ 为被动/中间意义，原句没有明说行动者；译文保留这一含蓄，不把上下文中的神学推论直接加入正文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以分号维持希伯来文长句的层次；“由悲转喜、由哀悼变为喜庆之日”保留原文平行对照。“周济”略带书面色彩，但在此清楚凝练。
