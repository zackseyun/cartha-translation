  text: on the thirteenth day of the month of Adar[a], and resting on the fourteenth day of it[b], and making it a day of feasting and gladness.
translation:
  language: zh_hans
  text: 他们在亚达月十三日这样做；十四日[b]，他们安歇，并把这日定为设筵欢乐的日子[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语这里的动词形式可按上下文译为较完整的过去时：“并把这日定为设筵欢乐的日子。”
    reason: lexical_alternative
  - marker: b
    text: 即亚达月十四日。
    reason: cultural_note
lexical_decisions:
- source_word: בְּיוֹם שְׁלֹשָׁה עָשָׂר לְחֹדֶשׁ אֲדָר
  choice: 在亚达月十三日
  rationale: בְּ在日期表达中表示时间；复合数词在日期语境中按序数理解。保留“亚达月”这一月份名称。
- source_word: וְנוֹחַ
  choice: 便停战休息
  rationale: נוּחַ表示停止行动、安歇；上下文是战斗结束，因此“停战休息”比单说“休息”更清楚，同时没有把含义扩大为永久和平。
- source_word: בְּאַרְבָּעָה עָשָׂר בּוֹ
  choice: 到了十四日
  rationale: בּוֹ回指亚达月。正文按自然汉语省去重复的月份名称，脚注说明所指日期。
- source_word: וְעָשֹׂה אֹתוֹ
  choice: 并把这一天定为
  rationale: עָשָׂה אֹתוֹ在此表示把该日作为某种日子来度过或设定。译作“定为”能自然连接后面的名词短语，又不额外引入制度化含义。
- source_word: יוֹם מִשְׁתֶּה וְשִׂמְחָה
  choice: 设宴欢乐的日子
  rationale: מִשְׁתֶּה指宴饮、筵席，שִׂמְחָה指喜乐欢庆；“设宴欢乐”以现代汉语保留两项并列内容。
