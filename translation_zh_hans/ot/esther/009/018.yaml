base_translation:
  language: en
  yaml_path: translation/ot/esther/009/018.yaml
  text: But the Jews who were in Susa assembled on the thirteenth day of it and on the fourteenth day of it[a], and rested on the fifteenth day of it[b], and made it a day of feasting and gladness.
translation:
  language: zh_hans
  text: 但书珊的犹太人在本月十三日和本月十四日聚集，在本月十五日休息，并把这一天作为设宴欢乐的日子[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “设宴欢乐”也可译作“宴饮喜乐”。原文三个日期短语直译为“在它的十三日……在它的十四日……在它的十五日”，其中“它”按上下文指这个月。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַיְּהוּדִים אֲשֶׁר בְּשׁוּשָׁן
  choice: 但在书珊的犹太人
  rationale: 连接词在此与上一节各省的犹太人形成对比，译作“但”；“书珊”采用中文圣经传统中广为人知的地名形式。
- source_word: נִקְהֲלוּ
  choice: 聚集
  rationale: 忠实表达קהל的被动词干在此所指的集合、聚集，不额外说明其目的。
- source_word: בִּשְׁלֹשָׁה עָשָׂר בּוֹ וּבְאַרְבָּעָה עָשָׂר בּוֹ
  choice: 在本月十三日和十四日
  rationale: 原文两次使用“在它的……日”，代词按上下文指该月；中文以“本月”自然明示其所指，同时保留两个日期。
- source_word: וְנוֹחַ בַּחֲמִשָּׁה עָשָׂר בּוֹ
  choice: 到十五日才休息
  rationale: נוח表示停止争战而休息；“到……才”自然呈现他们连续两日聚集、随后在十五日休息的时间关系。
- source_word: וְעָשֹׂה אֹתוֹ
  choice: 并把这一天作为
  rationale: 原文结构表示把该日当作或定为具有某种性质的一日；此译法自然且不把一次行为过度解释为正式设立节期。
- source_word: יוֹם מִשְׁתֶּה וְשִׂמְחָה
  choice: 设宴欢乐的日子
  rationale: מִשְׁתֶּה指筵席、宴饮，שִׂמְחָה指喜乐、欢乐；“设宴欢乐”符合现代汉语节庆语境。
