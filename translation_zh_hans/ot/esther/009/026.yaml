base_translation:
  language: en
  yaml_path: translation/ot/esther/009/026.yaml
  text: Therefore they called these days Purim[a], after the name of Pur. Therefore, because of all the words of this letter, and what they had seen concerning this matter, and what had happened to them[b],
translation:
  language: zh_hans
  text: 因此，他们因“普珥”这个名字，把这些日子称为“普珥日”[a]。因此，鉴于这封信中的一切话、他们在这件事上所看见的，以及临到他们身上的事[b]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“因‘普珥’”；希伯来文直译为“按‘普珥’的名字”。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“发生在他们身上的事”。
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרְאוּ
  choice: 称为
  rationale: 这是קרא的Qal完成时第三人称复数，在命名语境中译为“称为”既贴近原文，也符合现代汉语表达。
- source_word: לַיָּמִים הָאֵלֶּה
  choice: 这些日子
  rationale: 保留带冠词指示词所表达的明确所指，即上下文正在谈论的节期日期。
- source_word: פוּרִים
  choice: 普珥日
  rationale: 采用现代中文圣经读者熟悉的节期名称；“日”使其作为节期名称在汉语中清楚自然，同时保留与“普珥”的词源联系。
- source_word: עַל שֵׁם הַפּוּר
  choice: 根据“普珥”这个名称
  rationale: עַל שֵׁם表示“按……的名称”；此译保留原文明确提到“名称”的措辞，并自然说明节名的由来。
- source_word: הַפּוּר
  choice: 普珥
  rationale: 此处重点是解释“普珥日”一名的来源，因此保留音译；“普珥”意为“签”，已由上下文说明。
- source_word: עַל כֵּן
  choice: 因此
  rationale: 原文此短语在本节出现两次；两处均译为“因此”，保留其因果总结作用及有意重复。
- source_word: עַל כָּל דִּבְרֵי הָאִגֶּרֶת הַזֹּאת
  choice: 鉴于这封信中的一切话
  rationale: “鉴于”体现此处עַל的依据或原因含义，“一切话”则保留דִּבְרֵי较为具体的表述，并让本节自然衔接下一节。
- source_word: וּמָה רָאוּ עַל כָּכָה
  choice: 他们在这件事上所看见的
  rationale: 保留ראה“看见”的基本意义，同时以“在这件事上”自然表达עַל כָּכָה所指的相关事项，不把它扩展为较强的解释性用语。
- source_word: וּמָה הִגִּיעַ אֲלֵיהֶם
  choice: 临到他们身上的事
  rationale: הגיע אל可表示某事临到或发生在某人身上；“临到他们身上”较贴近希伯来语意象，也保留事件性质未明说的概括性。
theological_decisions: []
