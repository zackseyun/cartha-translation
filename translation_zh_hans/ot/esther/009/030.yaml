base_translation:
  language: en
  yaml_path: translation/ot/esther/009/030.yaml
  text: And he sent letters to all the Jews in the one hundred twenty-seven provinces of the kingdom of Ahasuerus[a], words of peace and truth[c][b],
translation:
  language: zh_hans
  text: 他寄信给亚哈随鲁王国一百二十七个省的所有犹太人，信中写着平安和真实的话语[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “平安和真实的话语”也可译作“平安和信实的信息”。希伯来文直译为“平安和真实的话语”。
    reason: lexical_alternative
  - marker: b
    text: 这里的“真实”也可理解为“信实”或“可靠”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח סְפָרִים
  choice: 他把信送给
  rationale: וַיִּשְׁלַח承接叙事，主语依上下文为单数男性；סְפָרִים在波斯帝国行政语境中指发送的书面信件。现代汉语以“把信送给”自然表达寄送及收件关系。
- source_word: אֶל כָּל הַיְּהוּדִים
  choice: 所有犹太人
  rationale: 忠实表达该短语的集体和遍及意义。
- source_word: אֶל שֶׁבַע וְעֶשְׂרִים וּמֵאָה מְדִינָה
  choice: 一百二十七个省的
  rationale: 第二个אֶל说明收件人所在的地域范围；用“……个省的所有犹太人”符合现代汉语习惯，也避免误解为各省本身是收件对象。
- source_word: מַלְכוּת אֲחַשְׁוֵרוֹשׁ
  choice: 亚哈随鲁王国
  rationale: 保留原文的王国归属关系；按希伯来文名称音译אֲחַשְׁוֵרוֹשׁ，不直接替换为历史认定。
- source_word: דִּבְרֵי שָׁלוֹם וֶאֱמֶת
  choice: 信中写的是平安、真实的话
  rationale: 保留דִּבְרֵי的“话”及שָׁלוֹם和אֱמֶת并列的形式；补出“信中写的是”以使汉语句法完整，并明确此短语描述信件内容。
