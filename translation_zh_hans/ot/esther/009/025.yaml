base_translation:
  language: en
  yaml_path: translation/ot/esther/009/025.yaml
  text: But when she came before the king[a], he commanded by letter that his evil scheme which he had devised against the Jews should return on his own head[b], and they hanged him and his sons on the gallows.
translation:
  language: zh_hans
  text: 但她来到王面前时，王以文书下令[a]，要使他图谋加害犹太人的恶计归到他自己头上；人们又把他和他的儿子们悬挂在木架上[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这句话的希伯来文较为凝练，直译近于“他连同文书说”；按上下文，是指王以书面谕令作出命令。
    reason: 保留原文不寻常的句法和“文书”的字面要素，同时说明正文所采用的语境性理解。
  - marker: b
    text: “悬挂”所指的具体处刑或示众方式不能完全确定；“木架”原文直译为“树”或“木头”，也可能指木杆或其他木制刑具，并非现代意义的绞刑架。
    reason: 原文未明确处刑或示众的具体方式，也未说明刑具的准确形制。
lexical_decisions:
- source_word: וּבְבֹאָהּ
  choice: 但她来到……时
  rationale: 阴性单数后缀按上下文最自然地回指以斯帖；用“她”保留原文的代词照应，不另行补出名字。
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: 王面前
  rationale: 准确表达进入君王面前、当面觐见的常用希伯来语表达，同时符合现代汉语习惯。
- source_word: אָמַר עִם הַסֵּפֶר
  choice: 王以文书下令
  rationale: 原文结构凝练，直译近于“他连同文书说”；上下文表明这是王借书面谕令作出的命令。正文采用自然表达，脚注保留字面形式及其含混性。
- source_word: יָשׁוּב
  choice: 要使……报应在
  rationale: 该动词本义为“返回、转回”，此处表达恶计反归策划者自身的逆转；“报应在他自己头上”自然传达这一惯用含义。
- source_word: מַחֲשַׁבְתּוֹ הָרָעָה אֲשֶׁר חָשַׁב
  choice: 他谋害……的恶计
  rationale: מַחֲשָׁבָה 在此指蓄意策划的计谋，而非单纯思想；以“谋害……的恶计”简洁呈现名词与同根动词的含义。
- source_word: עַל הַיְּהוּדִים
  choice: 谋害犹太人
  rationale: 介词 עַל 在敌对语境中表示“针对、反对”；结合“恶计”译为“谋害”明确表达其恶意对象。
- source_word: עַל רֹאשׁוֹ
  choice: 报应在他自己头上
  rationale: 保留原文“在他头上”的报应性惯用语，并用“自己”明确反身意义。
- source_word: וְתָלוּ אֹתוֹ וְאֶת־בָּנָיו
  choice: 人们又把他和他的儿子们悬挂
  rationale: תלה 的核心意义是悬挂；译作“悬挂”避免在正文中过度确定具体处刑方式，也不暗示这些人必然是在此刻才被处死。
- source_word: עַל הָעֵץ
  choice: 在木架上
  rationale: עֵץ 可指树、木头、木杆或木制刑具；本段语境指用于示众或处刑的木制设施。“木架”比现代意义的“绞刑架”更少引入原文没有明说的结构与方式。
