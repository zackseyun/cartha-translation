  text: כִּי֩ הָמָ֨ן בֶּֽן הַמְּדָ֜תָא הָֽ/אֲגָגִ֗י צֹרֵר֙ כָּל הַ/יְּהוּדִ֔ים חָשַׁ֥ב עַל הַ/יְּהוּדִ֖ים לְ/אַבְּדָ֑/ם וְ/הִפִּ֥יל פּוּר֙ ה֣וּא הַ/גּוֹרָ֔ל לְ/הֻמָּ֖/ם וּֽ/לְ/אַבְּדָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/024.yaml
  text: For Haman son of Hammedatha the Agagite[a], the enemy of all the Jews, had plotted against the Jews to destroy them, and had cast Pur—that is[b], the lot—to crush them and to destroy them.
translation:
  language: zh_hans
  text: 因为哈米大他的儿子、亚甲族人哈曼，是所有犹太人的仇敌；他图谋消灭犹太人，又掷了“普珥”[a]，也就是签，要使他们陷入混乱[b]，并消灭他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “普珥”是一个外来词，原文随即解释为“签”；保留这个词，是为了显明它与上下文中“普珥日”这一名称的联系。
    reason: cultural_note
  - marker: b
    text: 或译“使他们惊慌”，也可能有“击溃他们”的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 本词在上下文中引出设立普珥节的缘由；“因为”自然体现其解释性和因果关系。
- source_word: הָמָן בֶּן הַמְּדָתָא הָאֲגָגִי
  choice: 哈米大他的儿子、亚甲族人哈曼
  rationale: 采用现代中文圣经语境中通行的人名音译，并保留“亚甲族人”这一族裔或王朝性称号。
- source_word: צֹרֵר כָּל הַיְּהוּדִים
  choice: 所有犹太人的仇敌
  rationale: צֹרֵר表示敌对、迫害之人；“仇敌”既准确又庄重，并保留כָּל的总体范围。
- source_word: חָשַׁב עַל הַיְּהוּדִים
  choice: 图谋……犹太人
  rationale: 该动词与介词组合在此表达带有恶意的谋划；中文用“图谋”清楚传达敌对意图。
- source_word: לְאַבְּדָם
  choice: 消灭他们
  rationale: 使役意义指使他们灭亡；“消灭”在现代中文中力度明确，也适合针对群体的语境。
- source_word: וְהִפִּיל פּוּר
  choice: 又掷了“普珥”
  rationale: 保留波斯借词“普珥”，以维系本节与“普珥日”名称的联系；“掷”反映הִפִּיל的动作含义。
- source_word: הוּא הַגּוֹרָל
  choice: 也就是签
  rationale: 原文直接解释外来词“普珥”；“签”简洁表达用于决定日期的签或阄。
- source_word: לְהֻמָּם
  choice: 要使他们陷入混乱
  rationale: המם可表示使人慌乱、混乱或遭到击溃；正文采用不把语义过度收窄的译法，并以脚注保留其他可能。
- source_word: וּלְאַבְּדָם
  choice: 并消灭他们
  rationale: 保留原文对“消灭他们”的重复，呈现哈曼意图的强调效果。
theological_decisions: []
