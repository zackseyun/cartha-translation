base_translation:
  language: en
  yaml_path: translation/ot/esther/009/020.yaml
  text: Then Mordecai wrote these things and sent letters to all the Jews who were in all the provinces of King Ahasuerus[a], both near and far.
translation:
  language: zh_hans
  text: 末底改把这些事[a]写下来，又把书信寄给亚哈随鲁王各省所有的犹太人，无论远近。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“这些话”。希伯来语既可指刚才所述的事情，也可指末底改就这些事写下的话。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְתֹּב
  choice: 写下来
  rationale: כתב在叙事中直接表示书写；“写下来”自然表达将所述之事记录成文。
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: 这些事
  rationale: דברים可指“话”或“事情”。上下文主要回指刚叙述的事件，但也可指写下的话，因此正文采用涵盖面较广的“这些事”，并用脚注保留歧义。
- source_word: וַיִּשְׁלַח סְפָרִים
  choice: 把书信寄给
  rationale: ספרים在此帝国行政语境中指书面通信；“书信”比泛称“文书”更自然，“寄给”准确传达发送对象。
- source_word: כָּל הַיְּהוּדִים
  choice: 所有的犹太人
  rationale: 直接表达遍及帝国的犹太群体，不额外添加解释。
- source_word: בְּכָל מְדִינוֹת
  choice: 各省
  rationale: מדינות指帝国的行政辖区；现代汉语以“各省”简洁自然地表达“所有省份”。
- source_word: הַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ
  choice: 亚哈随鲁王
  rationale: 按现代汉语称号语序处理，并采用通行的圣经人名译法。
- source_word: הַקְּרוֹבִים וְהָרְחוֹקִים
  choice: 无论远近
  rationale: 这对形容词实体化使用，涵盖近处和远处的犹太人；“无论远近”自然保留其总括性。
- source_word: וַ
  choice: 又
  rationale: 连接连续发生的叙事动作；“又”在本句中自然呈现末底改写下并发送书信的行动次序。
theological_decisions: []
