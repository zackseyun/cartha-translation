base_translation:
  language: en
  yaml_path: translation/ot/esther/009/031.yaml
  text: to establish these days of Purim at their appointed times[a], just as Mordecai the Jew and Esther the queen had established for them[b], and just as they had established for themselves and for their offspring the matters of the fasts and their cry.
translation:
  language: zh_hans
  text: 为要在所定的时候确立这些普珥日[a]，正如犹太人末底改和王后以斯帖为他们所规定的，又如他们为自己和后代所承担的有关禁食和他们呼喊之事[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “确立”也可译作“确认”。本节重复使用的希伯来语动词含正式制定或认可这一节期安排的意思。
    reason: lexical_alternative
  - marker: b
    text: “呼喊”也可译作“呼求”或“哀号”，可能指群体禁食时发出的呼喊。
    reason: lexical_alternative
lexical_decisions:
- source_word: לְקַיֵּם
  choice: 为要确立
  rationale: 此处为 piel 不定式，含使某事确立、使之具有约束力之意；“确立”保留了正式制定节期的行政语气。
- source_word: יְמֵי הַפֻּרִים הָאֵלֶּה
  choice: 这些普珥日
  rationale: 直译其构造，并保留指示词对前文所述特定节日的强调。
- source_word: בִּזְמַנֵּיהֶם
  choice: 按所定的日期
  rationale: זְמָן 指指定或固定的时间；结合节期语境译作“所定的日期”自然明确。
- source_word: כַּאֲשֶׁר קִיַּם עֲלֵיהֶם
  choice: 正如……为他们所规定的
  rationale: עַל 表明这项安排对群体具有约束力；“规定”表达正式设立，而不额外强调强迫。
- source_word: מָרְדֳּכַי הַיְּהוּדִי
  choice: 犹太人末底改
  rationale: 按现代中文圣经叙事的自然语序表达其族群称谓。
- source_word: אֶסְתֵּר הַמַּלְכָּה
  choice: 王后以斯帖
  rationale: 采用现代中文自然且庄重的称谓次序。
- source_word: וְכַאֲשֶׁר קִיְּמוּ עַל נַפְשָׁם וְעַל זַרְעָם
  choice: 也正如他们为自己和后代所承担的
  rationale: על נפשם 在此表示自行承担义务；“承担”比机械重复“确立”更准确地传达反身语义，זַרְעָם 则按群体延续语境译为“后代”。
- source_word: דִּבְרֵי הַצֹּמוֹת וְזַעֲקָתָם
  choice: 禁食和哀求之事
  rationale: דִּבְרֵי 在行政叙述中可指相关事项；זַעֲקָה 是困苦中的呼喊，结合禁食语境译作“哀求”，但不把它限定为某种特定礼仪。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“使人……守节”将希伯来语中‘在所定时间确立这些日子’所蕴含的按期举行之意自然表达出来；对同一希伯来语动词按不同搭配分别译为“确立”“规定”“承担”，以兼顾词义连续性与中文可读性。
