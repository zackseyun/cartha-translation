base_translation:
  language: en
  yaml_path: translation/ot/esther/009/027.yaml
  text: 'the Jews established and accepted for themselves[a], for their offspring, and for all who joined them, that it should not fail: to observe these two days according to what was written for them and at their appointed time[b], year after year.'
translation:
  language: zh_hans
  text: 犹太人确立并接受了这项规定，作为他们自己、自己的后裔和一切归附他们的人[a]所承担的义务：要年年照所写的规定，在指定的日期守这两日，不可废弛[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“所有依附他们的人”。希伯来语指加入犹太人群体或与他们联合的人。
    reason: lexical_alternative
  - marker: b
    text: 或译“不可中断”或“不可废止”。原文直译可作“不可过去”，这里指守这两日的规例不可停止。
    reason: lexical_alternative
lexical_decisions:
- source_word: קִיְּמוּ וְקִבֵּלוּ
  choice: 确立并接受了
  rationale: 保留两个并列动词：前者表达使规例成立、固定下来，后者表达接受并承担这项义务。
- source_word: עֲלֵיהֶם
  choice: 为自己
  rationale: 这里表示把义务加在自己身上；“为自己”符合现代汉语表达，并与后面的后裔及归附者并列。
- source_word: זַרְעָם
  choice: 自己的后裔
  rationale: 在世代延续的语境中，זֶרַע 指后代；“后裔”比直译“种子”自然准确。
- source_word: כָּל הַנִּלְוִים עֲלֵיהֶם
  choice: 一切归附他们的人
  rationale: לוה 的分词表示依附、加入某群体的人；“归附”保留主动加入并与犹太群体相连的含义。
- source_word: וְלֹא יַעֲבוֹר
  choice: 永不废止
  rationale: 直译有“不越过、不消逝”之意；在固定节期的法律语境中，指这项遵守不可中断或废弛。
- source_word: לִהְיוֹת עֹשִׂים
  choice: 要……守
  rationale: 字面为“持续实行”；节期语境下用“守”简洁表达持续遵行，而不额外加入庆祝方式。
- source_word: שְׁנֵי הַיָּמִים הָאֵלֶּה
  choice: 这两日
  rationale: 直接保留原文的数目和指示语。
- source_word: כִּכְתָבָם
  choice: 照所写的规定
  rationale: 保留以书面内容为准的意思，同时不武断指定所指的具体文书。
- source_word: וְכִזְמַנָּם
  choice: 在指定的日期
  rationale: זְמַן 指规定、指定的时间；因对象是两日，汉语用“日期”自然清楚。
- source_word: בְּכָל שָׁנָה וְשָׁנָה
  choice: 年年
  rationale: 希伯来语重复“每一年和一年”强调逐年持续；“年年”保留这种反复性。
theological_decisions: []
