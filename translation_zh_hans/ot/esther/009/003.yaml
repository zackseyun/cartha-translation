base_translation:
  language: en
  yaml_path: translation/ot/esther/009/003.yaml
  text: And all the officials of the provinces[a], the satraps, the governors, and those doing the king’s work were supporting the Jews, because the fear of Mordecai had fallen on them.
translation:
  language: zh_hans
  text: 各省所有的官员、总督、地方长官和办理王务的人都支持犹太人[a]，因为他们惧怕末底改。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“都帮助犹太人”；这个希伯来语动词也可表示“抬举”或“优待”他们。
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרֵי הַמְּדִינוֹת
  choice: 各省的所有官员
  rationale: שָׂרִים在此指各省的统治或行政官员；译作“官员”符合随后列举行政职衔的语境，也自然易懂。
- source_word: אֲחַשְׁדַּרְפְּנִים
  choice: 总督
  rationale: 这是波斯行政职衔，指管辖较大区域的高级长官；现代汉语通常以“总督”表达，并与下一级的“巡抚”相区别。
- source_word: פַּחוֹת
  choice: 巡抚
  rationale: 该词指地区行政长官，职级或管辖范围有别于前面的总督；“巡抚”保留了职衔差别，且较“省长”更适合古代帝国背景。
- source_word: עֹשֵׂי הַמְּלָאכָה אֲשֶׁר לַמֶּלֶךְ
  choice: 办理王务的人
  rationale: 原文直指“办理属于王之事务的人”；此译保留宽泛所指，不把他们过度限定为某一类王室行政人员。
- source_word: מְנַשְּׂאִים אֶת־הַיְּהוּדִים
  choice: 支持犹太人
  rationale: נשׂא的使役形在此可表达扶助、抬举或优待；结合冲突语境，“支持”自然地涵盖实际援助，同时不武断断定为社会地位上的抬高。
- source_word: כִּי
  choice: 因为
  rationale: 此处引出官员支持犹太人的原因，译作“因为”关系明确。
- source_word: נָפַל פַּחַד מָרְדֳּכַי עֲלֵיהֶם
  choice: 他们都惧怕末底改
  rationale: 原文直译为“对末底改的惧怕落在他们身上”，是希伯来语表示恐惧临到人的惯用表达；正文采用自然现代汉语传达其意义。
- source_word: מָרְדֳּכַי
  choice: 末底改
  rationale: 采用现代中文圣经传统中通行且易识别的人名译法。
theological_decisions: []
translation_notes:
  register: 采用庄重、清晰的现代标准汉语。行政职衔依层级分别译为“官员、总督、巡抚”，并以“办理王务的人”保留原文的宽泛表达。恐惧习语在正文中自然化处理，避免生硬直译；支持、帮助、抬举之间的词义幅度则通过脚注保留。
