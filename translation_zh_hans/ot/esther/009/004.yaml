base_translation:
  language: en
  yaml_path: translation/ot/esther/009/004.yaml
  text: For Mordecai was great in the king’s house[a], and the report about him was spreading through all the provinces[b], for the man Mordecai was becoming greater and greater.
translation:
  language: zh_hans
  text: 因为末底改在王宫中地位显赫[a]，他的名声[b]传遍各省；因为末底改这人越来越显赫[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “王宫”直译为“王的家”，也可理解为王廷。
    reason: lexical_alternative
  - marker: b
    text: “名声”也可译作“有关他的消息”或“关于他的传闻”。
    reason: lexical_alternative
  - marker: c
    text: 直译为“不断前行并变得显赫”，是表示地位或声望持续上升的希伯来语惯用表达。
    reason: idiom_explanation
lexical_decisions:
- source_word: כִּי
  choice: 因为／这是因为
  rationale: 两处 כִּי 都具有解释或说明原因的作用；分别译为“因为”和“这是因为”，既保留衔接关系，也使现代汉语行文自然。
- source_word: גָדוֹל
  choice: 地位显赫／显赫
  rationale: 此词在语境中指身份、声望和影响力突出。“显赫”保留其宽泛含义，避免仅限定为政治权力。
- source_word: בְּבֵית הַמֶּלֶךְ
  choice: 在王宫中
  rationale: 原文直译为“在王的家中”，在波斯宫廷语境下指王宫或王廷；“在王宫中”清楚自然，同时不过度具体化为某种官职。
- source_word: שָׁמְעוֹ
  choice: 他的名声
  rationale: 该词可指关于他的消息、传闻或名声。上下文强调末底改日益显赫及其影响遍及各省，因此正文采用自然的“名声”，并以脚注保留“消息／传闻”的可能。
- source_word: הוֹלֵךְ בְּכָל הַמְּדִינוֹת
  choice: 传遍各省
  rationale: 当主语是“名声”时，הוֹלֵךְ 表示持续扩展或传播；“传遍”准确表达这种动态，并符合现代汉语习惯。
- source_word: הָאִישׁ מָרְדֳּכַי
  choice: 末底改这人
  rationale: 保留原文“这人／这个人末底改”的强调意味，同时采用自然的汉语语序。
- source_word: הוֹלֵךְ וְגָדוֹל
  choice: 正变得越来越显赫
  rationale: 这是希伯来语表示持续递增的惯用结构；“正变得越来越显赫”传达其地位和声望不断上升的过程。
