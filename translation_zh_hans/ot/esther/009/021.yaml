base_translation:
  language: en
  yaml_path: translation/ot/esther/009/021.yaml
  text: to establish among them that they should observe the fourteenth day of the month Adar[a], and the fifteenth day of it, year after year,
translation:
  language: zh_hans
  text: 要规定他们每年都守亚达月十四日和十五日，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְקַיֵּם עֲלֵיהֶם
  choice: 要规定他们
  rationale: 该短语在这里表示确立一项对群体具有约束力的惯例或责任。“规定他们”用现代汉语自然表达这种确立并施行于他们的语气，同时承接上文的不定式结构。
- source_word: לִהְיוֹת עֹשִׂים
  choice: 守
  rationale: 字面为“持续做”，但以节期日期为宾语时，指按规定遵守、纪念这些日子；汉语用“守”简洁而符合节期语境。
- source_word: יוֹם אַרְבָּעָה עָשָׂר לְחֹדֶשׁ אֲדָר
  choice: 亚达月十四日
  rationale: 按现代汉语日期次序表达希伯来文的历法日期，意义明确，保留“亚达月”这一专名。
- source_word: וְאֵת יוֹם חֲמִשָּׁה עָשָׂר בּוֹ
  choice: 和十五日
  rationale: בּוֹ回指刚提到的亚达月；汉语并列日期时无需重复“亚达月”，仍能清楚表达同月十五日。
- source_word: בְּכָל שָׁנָה וְשָׁנָה
  choice: 年复一年
  rationale: 希伯来文重复“年”以表达逐年、每年的分配和持续意义；“年复一年”既自然，也保留重复所带来的强调。
