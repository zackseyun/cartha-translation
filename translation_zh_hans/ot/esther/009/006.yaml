  text: And in Susa the citadel[a], the Jews killed and destroyed five hundred men.
translation:
  language: zh_hans
  text: 在书珊的卫城里，犹太人杀了五百名男子，又毁灭了他们。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/בְ/שׁוּשַׁן
  choice: 在书珊
  rationale: 介词表达地点；句首连接词在现代汉语中不必机械译出，省略后与上下文衔接自然。“书珊”采用通行的圣经地名译法。
- source_word: הַ/בִּירָה
  choice: 城堡
  rationale: 该词指设防的王城、卫城或宫城区域；“城堡”既保留防御性，也不把含义限缩为单一宫殿。另义见脚注。
- source_word: הָרְגוּ
  choice: 杀死
  rationale: 准确表达 הרג 的直接含义，语言现代而庄重。
- source_word: הַ/יְּהוּדִים
  choice: 犹太人
  rationale: 在《以斯帖记》中指这一民族群体；“犹太人”是现代汉语最自然、通行的表达。
- source_word: וְ/אַבֵּד
  choice: 并灭了
  rationale: 单独译出使之灭亡的含义，以保留原文“杀死”和“灭”两个并列动词；避免合并后丢失原文的强调。
- source_word: חֲמֵשׁ מֵאוֹת אִישׁ
  choice: 五百名男子
  rationale: אִישׁ 是阳性计数名词；译作“男子”比泛化为“人”更贴近原文。
