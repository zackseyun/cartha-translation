base_translation:
  language: en
  yaml_path: translation/ot/esther/009/028.yaml
  text: And these days are remembered and observed in every generation[a], every family, every province, and every city; and these days of Purim shall not pass away from among the Jews[c][b], and their remembrance shall not cease from their offspring.
translation:
  language: zh_hans
  text: 这些日子在世世代代、各家各户、各省各城[a]，都要被记念和遵守[b]。这些普珥日不会从犹太人中消失；对这些日子的记念也不会在他们的后代中断绝。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“每一代又一代、每一家又一家、每一省又一省、每一城又一城”，用重复的单数名词逐项强调无一例外。
    reason: lexical_alternative
  - marker: b
    text: “遵守”所译的希伯来语本义是“做、实行”，在这里指实际守行这些节期日子。
    reason: lexical_alternative
lexical_decisions:
- source_word: נִזְכָּרִים
  choice: 被记念
  rationale: 该词是זכר的尼法勒分词，在这里表示这些日子被人铭记、纪念；“被记念”直接保留原文以“日子”为主语的表达。
- source_word: וְנַעֲשִׂים
  choice: 并遵守
  rationale: עשה本义为“做、实行”，用于节期日子时指实际奉行相关礼仪和庆祝安排；“遵守”自然表达这种实践含义，又不过度限定庆祝方式。
- source_word: בְּכָל דּוֹר וָדוֹר
  choice: 在世世代代
  rationale: 原文重复单数名词，具有逐一分配并延续各代的强调意味；“世世代代”符合现代汉语习惯。
- source_word: מִשְׁפָּחָה וּמִשְׁפָּחָה
  choice: 各家各户
  rationale: 重复的单数名词表示每一个家族或家庭；“各家各户”自然传达其分配性强调。
- source_word: מְדִינָה וּמְדִינָה
  choice: 各省
  rationale: 在《以斯帖记》的波斯帝国行政语境中，מְדִינָה指行省；“各省”准确而简洁。
- source_word: וְעִיר וָעִיר
  choice: 各城
  rationale: 原文重复单数以表达逐城涵盖；“各城”在汉语中清楚传达此意。
- source_word: יְמֵי הַפּוּרִים
  choice: 这些普珥日
  rationale: 保留专名“普珥”及复数“日子”，与上下文所设立的节期日期相符。
- source_word: לֹא יַעַבְרוּ מִתּוֹךְ הַיְּהוּדִים
  choice: 绝不可从犹太人中消失
  rationale: עבר与מן/מתוך连用，在此表示不再存在于群体之中；“消失”清楚表达该比喻含义，“绝不可”体现否定命令式的庄重力度。
- source_word: וְזִכְרָם
  choice: 对这些日子的记念
  rationale: 阳性复数后缀回指前文的普珥日；明说“这些日子”可避免汉语代词所指不清，同时保留纪念的含义。
- source_word: לֹא יָסוּף מִזַּרְעָם
  choice: 绝不可在他们的后代中断绝
  rationale: יסוף表示停止、终结，זֶרַע在此指后裔；“在他们的后代中断绝”既自然，也表现纪念传统不可终止。
