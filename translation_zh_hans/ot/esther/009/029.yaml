base_translation:
  language: en
  yaml_path: translation/ot/esther/009/029.yaml
  text: Then Esther the queen[a], daughter of Abihail, and Mordecai the Jew wrote with full authority to confirm this second letter of Purim.
translation:
  language: zh_hans
  text: 于是，亚比孩的女儿以斯帖王后和犹太人末底改以全权[a]写信，确认这第二封有关普珥节的书信。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“以充分的效力”或“以完全的权威”。希伯来语这一表达可指力量、效力或权威；此处着重书信所具有的正式而有力的效力。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּכְתֹּב
  choice: 于是……写信
  rationale: 叙事性连接词推动事件发展，译作“于是”符合现代汉语叙事；动词为阴性单数，首先与以斯帖呼应，但随后又列出末底改，汉语动词不标数，因而可自然保留原文结构，不强行解释两人的具体分工。
- source_word: אֶסְתֵּר הַמַּלְכָּה בַת אֲבִיחַיִל
  choice: 亚比孩的女儿以斯帖王后
  rationale: 保留以斯帖的家族身份和王后身份；按现代汉语习惯把“王后”置于人名之后，同时不删减原文的正式身份说明。
- source_word: וּמָרְדֳּכַי הַיְּהוּדִי
  choice: 和犹太人末底改
  rationale: יהודי在《以斯帖记》的波斯背景中主要是族群称谓；“犹太人”比地理意味较强的“犹大人”更自然、准确。
- source_word: אֶת כָּל תֹּקֶף
  choice: 以十足的权威
  rationale: תֹּקֶף可表示力量、效力或权威；在正式发函的语境中，“以十足的权威”最能表达书信所具有的官方权威性，同时以脚注保留其他可能。
- source_word: לְקַיֵּם
  choice: 确认
  rationale: 该不定式说明写信的目的；这里涉及正式认可并使既定安排继续有效，“确认”简洁地涵盖确立、认可和维持其效力的意思。
- source_word: אֵת אִגֶּרֶת הַפּוּרִים הַזֹּאת הַשֵּׁנִית
  choice: 这第二封普珥节书信
  rationale: אִגֶּרֶת意为书信，构造词组“普珥节书信”保留原文“普珥的书信”的紧密关系；“这第二封”对应指示词、序数词及其限定性。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。保留“亚比孩的女儿”这一正式身份说明，并将“以斯帖王后”按自然汉语语序表达。脚注标记紧随其实际对应的“以十足的权威”，避免误指王后称号。
