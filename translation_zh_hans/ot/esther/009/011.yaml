  text: 当天，书珊城堡中被杀的人数被报到王面前。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: 当天
  rationale: 自然、简洁地表达“在那一天”，承接前文所述日期。
- source_word: מִסְפַּר הַהֲרוּגִים
  choice: 被杀的人数
  rationale: 保留 הֲרוּגִים 的被动含义，指遭杀死之人的数目。
- source_word: שׁוּשַׁן הַבִּירָה
  choice: 书珊城堡
  rationale: הַבִּירָה 在《以斯帖记》中可指设防的王城或城堡区域；“城堡”简明保留这一含义。
- source_word: בָּא ... לִפְנֵי הַמֶּלֶךְ
  choice: 呈报到王面前
  rationale: 希伯来文直译为“来到王面前”；结合“人数”作主语的语境，用“呈报到”自然表达消息或统计数字传至王前，同时保留其行进意象。
