  text: וַ/תֹּ֤אמֶר אֶסְתֵּר֙ אִם עַל הַ/מֶּ֣לֶךְ ט֔וֹב יִנָּתֵ֣ן גַּם מָחָ֗ר לַ/יְּהוּדִים֙ אֲשֶׁ֣ר בְּ/שׁוּשָׁ֔ן לַ/עֲשׂ֖וֹת כְּ/דָ֣ת הַ/יּ֑וֹם וְ/אֵ֛ת עֲשֶׂ֥רֶת בְּנֵֽי הָמָ֖ן יִתְל֥וּ עַל הָ/עֵֽץ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/013.yaml
  text: Esther said[a], “If it pleases the king, let it be granted to the Jews who are in Susa to do tomorrow also according to today’s decree, and let Haman’s ten sons be hanged on the gallows.”
translation:
  language: zh_hans
  text: 以斯帖说：“王若以为好，就请准许书珊的犹太人明天也照今天的法令行事，并把哈曼的十个儿子挂在木架上。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“挂在树上（木头上）”，也可能指“刺在木桩上”。希伯来文直译为“挂在木头／树上”，这里指一种木制刑具。
    reason: 保留 עֵץ 所指刑具形制及 תלה 所描述处置方式的词义不确定性。
lexical_decisions:
- source_word: אִם עַל־הַמֶּלֶךְ טוֹב
  choice: 王若以为好
  rationale: 这是宫廷请愿用语，表达是否合王心意、蒙王认可；此译保留原文措辞和庄重语气，又符合现代汉语表达。
- source_word: יִנָּתֵן
  choice: 就请准许
  rationale: 该被动祈愿式在此表示请求王正式授权；汉语以主动敬语表达更自然，并保留请求的语气。
- source_word: גַּם מָחָר
  choice: 明天也
  rationale: 准确表达把当日的授权延续到次日。
- source_word: לַיְּהוּדִים אֲשֶׁר בְּשׁוּשָׁן
  choice: 书珊的犹太人
  rationale: 简洁自然地表达地点关系及获准行事的人群；שׁוּשָׁן 按传统中文圣经地名译作“书珊”。
- source_word: לַעֲשׂוֹת כְּדָת הַיּוֹם
  choice: 照今天的法令行事
  rationale: דָּת 在《以斯帖记》的波斯宫廷语境中指官方法令；“行事”保留 עשה 的宽泛含义，不额外说明具体行动。
- source_word: עֲשֶׂרֶת בְּנֵי הָמָן
  choice: 哈曼的十个儿子
  rationale: 以现代汉语自然表达希伯来语的领属结构。
- source_word: יִתְלוּ עַל־הָעֵץ
  choice: 把……挂在木架上
  rationale: תלה 表示悬挂，עֵץ 可指树、木头或木制刑具。“木架”符合本书叙事场景，同时不把刑具的具体形制限定为绞刑架；其他可能译法收入脚注。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的宫廷请愿语体。“王若以为好，就请准许”体现以斯帖对王的恭敬请求；句子不过度解释第二天所要进行的行动，也不明确断定木制刑具的具体形制。
