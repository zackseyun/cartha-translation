  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וּ/שְׁאָ֣ר הַ/יְּהוּדִ֡ים אֲשֶׁר֩ בִּ/מְדִינ֨וֹת הַ/מֶּ֜לֶךְ נִקְהֲל֣וּ וְ/עָמֹ֣ד עַל נַפְשָׁ֗/ם וְ/נ֨וֹחַ֙ מֵ/אֹ֣יְבֵי/הֶ֔ם וְ/הָרֹג֙ בְּ/שֹׂ֣נְאֵי/הֶ֔ם חֲמִשָּׁ֥ה וְ/שִׁבְעִ֖ים אָ֑לֶף וּ/בַ֨/בִּזָּ֔ה לֹ֥א שָֽׁלְח֖וּ אֶת יָדָֽ/ם׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/016.yaml
  text: And the rest of the Jews who were in the king’s provinces gathered themselves together and stood for their lives[a], and had relief from their enemies, and killed seventy-five thousand of those who hated them[b]; but they did not lay a hand on the plunder.
translation:
  language: zh_hans
  text: 王的各省其余的犹太人也聚集起来，保卫自己的性命[a]，得享安宁，脱离仇敌；他们杀了恨他们的人七万五千，却没有下手夺取财物[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“为自己的性命站立”，意思是为保全性命而抵抗。
    reason: lexical_alternative
  - marker: b
    text: “财物”或译“战利品”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁאָר הַיְּהוּדִים
  choice: 其余的犹太人也
  rationale: שְׁאָר指其余、剩下的人；结合上文书珊城的犹太人，用“其余的”清楚表达对比。וּ在此承接叙事，译作“也”符合现代汉语。
- source_word: בִּמְדִינוֹת הַמֶּלֶךְ
  choice: 王各省
  rationale: מְדִינוֹת指帝国的行政省份；“王各省”简洁自然，也保留这些省份隶属王权的含义。
- source_word: נִקְהֲלוּ
  choice: 聚集起来
  rationale: 该词表示众人集合；“聚集起来”既自然，又保留本章反复出现的集体行动意味。
- source_word: וְעָמֹד עַל נַפְשָׁם
  choice: 保卫自己的性命
  rationale: 字面意象是“为自己的性命站立”，在语境中表示为保全生命而抵抗。“保卫自己的性命”明确传达自卫含义，而不把行动改写为单纯进攻。
- source_word: וְנוֹחַ מֵאֹיְבֵיהֶם
  choice: 得以摆脱仇敌
  rationale: נוּחַ在此表示从仇敌造成的威胁中获得安歇或解脱；“得以摆脱仇敌”符合叙事情境，也比直译“从仇敌得安息”更自然。
- source_word: וְהָרֹג בְּשֹׂנְאֵיהֶם
  choice: 他们杀了恨他们的人
  rationale: שֹׂנְאֵיהֶם直指“恨他们的人”。中文将数量置于宾语之后，清楚表达被杀者属于敌视他们的人群。
- source_word: חֲמִשָּׁה וְשִׁבְעִים אָלֶף
  choice: 七万五千
  rationale: 按现代汉语数词次序自然表达原文数字。
- source_word: וּבַבִּזָּה
  choice: 却……财物
  rationale: בִּזָּה指战争中可掠取的战利品或财物；“财物”通俗明确，而“却”体现杀敌与不取战利品之间的语境对比。
- source_word: לֹא שָׁלְחוּ אֶת יָדָם
  choice: 没有下手夺取
  rationale: 原文是“没有伸手”的习语，表示没有动手占取；“没有下手夺取”既保留手的动作意象，也明确实际含义。
theological_decisions:
- issue: 犹太人行动的道德与叙事框架
  choice: 保卫自己的性命
  alternative: 为自己的性命站立；保护自己
  rationale: 原文明确把他们的集结和行动与保全性命相连。译文保留自卫框架，但不淡化随后明确记载的杀戮。
- issue: 对战利品的态度
  choice: 没有下手夺取财物
  alternative: 没有伸手拿战利品
  rationale: 保持原文强调的克制：他们虽杀死仇敌，却未取财物；不额外推断其动机或赋予宗派性解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“保卫自己的性命”传达希伯来语习语的自卫含义；“下手夺取”保留原文“伸手”的意象。所有脚注标记均已置于正文相应位置。
