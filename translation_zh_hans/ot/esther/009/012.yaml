  text: וַ/יֹּ֨אמֶר הַ/מֶּ֜לֶךְ לְ/אֶסְתֵּ֣ר הַ/מַּלְכָּ֗ה בְּ/שׁוּשַׁ֣ן הַ/בִּירָ֡ה הָרְגוּ֩ הַ/יְּהוּדִ֨ים וְ/אַבֵּ֜ד חֲמֵ֧שׁ מֵא֣וֹת אִ֗ישׁ וְ/אֵת֙ עֲשֶׂ֣רֶת בְּנֵֽי הָמָ֔ן בִּ/שְׁאָ֛ר מְדִינ֥וֹת הַ/מֶּ֖לֶךְ מֶ֣ה עָשׂ֑וּ וּ/מַה שְּׁאֵֽלָתֵ/ךְ֙ וְ/יִנָּ֣תֵֽן לָ֔/ךְ וּ/מַה בַּקָּשָׁתֵ֥/ךְ ע֖וֹד וְ/תֵעָֽשׂ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/012.yaml
  text: Then the king said to Esther the queen[a], “In Susa the citadel the Jews have killed and destroyed five hundred men, along with the ten sons of Haman. What then have they done in the rest of the king’s provinces? Now what is your petition? It will be granted to you. And what is your further request? It will be done.”
translation:
  language: zh_hans
  text: 王对王后以斯帖说：“犹太人在书珊城堡杀死并除灭了五百人和哈曼的十个儿子；那么，在王其余各省，他们做了什么呢？你所求的是什么？必赐给你。你还有什么请求？必为你办成。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּשׁוּשַׁן הַבִּירָה
  choice: 在书珊城堡
  rationale: בִּירָה在波斯王室背景中指设防的王城或城堡；“书珊城堡”简洁自然，也与本书常见地名表达协调。
- source_word: הָרְגוּ ... וְאַבֵּד
  choice: 杀死并除灭
  rationale: 保留希伯来文两个并列动词的累加强调；“除灭”体现אבד在敌对行动语境中的毁灭含义，又不把程度扩展为原文未明说的“彻底消灭”。
- source_word: חֲמֵשׁ מֵאוֹת אִישׁ
  choice: 五百人
  rationale: אִישׁ在数字后作个体计数；现代汉语以“五百人”最直接自然，且汉语“人”在此不必强行标出原文语法性别。
- source_word: וְאֵת עֲשֶׂרֶת בְּנֵי הָמָן
  choice: 又杀了哈曼的十个儿子
  rationale: אֵת引出附加的直接宾语。汉语需补出前文动词“杀了”，以免“并除灭五百人和十个儿子”产生结构歧义；“又”保留附加关系。
- source_word: בִּשְׁאָר מְדִינוֹת הַמֶּלֶךְ
  choice: 在王其余各省
  rationale: מְדִינוֹת在波斯帝国行政背景中宜译“省”，שְׁאָר译“其余”，准确且符合现代汉语。
- source_word: מֶה עָשׂוּ
  choice: 那么……他们做了什么呢
  rationale: 字面是“他们做了什么”；“那么”表达由书珊战果推及其他省份的推断语气，但仍保留疑问形式及其潜在反问意味。
- source_word: שְּׁאֵלָתֵךְ
  choice: 你所求的
  rationale: שְׁאֵלָה在本书宫廷语境中指向王提出的请求。“所求的”庄重而易懂，并可与后句近义词形成自然呼应。
- source_word: וְיִנָּתֵן לָךְ
  choice: 必赐给你
  rationale: נתן的被动式在此表示请求将获准或所求之物将被赐下；“必赐给你”保留王室话语色彩及被动语义效果。
- source_word: בַּקָּשָׁתֵךְ עוֹד
  choice: 你还请求什么
  rationale: בַּקָּשָׁה与שְׁאֵלָה近义，עוֹד表示进一步或另外的请求；用“还”清楚呈现递进，而不刻意制造原文没有的术语差别。
- source_word: וְתֵעָשׂ
  choice: 必为你办成
  rationale: 原文表示所求之事将被实行。“办成”在现代汉语中自然地表达落实请求；补出“为你”使关系清楚，不改变原意。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而通顺的宫廷叙事语体。保留“杀死并除灭”两个动词的力度，也保留“他们做了什么呢”的疑问与推断张力；不另加注释，因为“那么”仅显明上下文自然蕴含的推断，并未排除较平直的问法。
