base_translation:
  language: en
  yaml_path: translation/ot/esther/009/015.yaml
  text: The Jews who were in Susa also assembled on the fourteenth day of the month of Adar[a], and they killed three hundred men in Susa; but they did not lay a hand on the plunder.
translation:
  language: zh_hans
  text: 在书珊的犹太人也在亚达月十四日聚集起来；他们在书珊杀了三百人，却没有伸手夺取战利品[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“却没有向战利品伸出他们的手。”
    reason: 保留希伯来语“伸出手”的原文形象，并说明正文“伸手夺取”的惯用语处理。
lexical_decisions:
- source_word: וַיִּקָּהֲלוּ
  choice: 聚集起来
  rationale: 该动词表达众人集合成群并采取共同行动；“聚集起来”自然地保留了其主动参与和群体行动的意味。
- source_word: הַיְּהוּדִים
  choice: 犹太人
  rationale: 在《以斯帖记》的波斯侨居背景中，该词指犹太民族群体；“犹太人”是现代汉语中清楚、通行的表达。
- source_word: אֲשֶׁר בְּשׁוּשָׁן
  choice: 住在书珊的
  rationale: 关系从句限定身处书珊的犹太人。“住在”在此自然表达其所在地；“书珊”采用中文圣经传统且通行的地名译法。
- source_word: גַּם
  choice: 也
  rationale: 该词将十四日的行动与前一日的事件相连接，表达追加之意。
- source_word: בְּיוֹם אַרְבָּעָה עָשָׂר לְחֹדֶשׁ אֲדָר
  choice: 在亚达月十四日
  rationale: 准确保留希伯来历日期，同时采用自然简洁的现代汉语日期表达。
- source_word: וַיַּהַרְגוּ
  choice: 杀了
  rationale: הרג是直接表示杀死的普通动词；“杀了”避免弱化暴力，也不使用古雅措辞。
- source_word: שְׁלֹשׁ מֵאוֹת אִישׁ
  choice: 三百人
  rationale: 数词后的אִישׁ在这里用于计数个体；现代汉语以“三百人”表达最自然，并不额外推断原文未明确说明的身份。
- source_word: וּבַבִּזָּה
  choice: 却……战利品
  rationale: בִּזָּה指冲突中可掠取的财物，译作“战利品”清楚准确；连接词按上下文译为“却”，显明杀人和不取财物之间的对比。
- source_word: לֹא שָׁלְחוּ אֶת יָדָם
  choice: 没有伸手夺取
  rationale: 原文直译为“没有伸出他们的手”；加入“夺取”使汉语明确表达对战利品不予取用的惯用含义，同时以脚注保留原文形象。
theological_decisions: []
translation_notes:
