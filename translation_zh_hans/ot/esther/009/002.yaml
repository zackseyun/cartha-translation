  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: נִקְהֲל֨וּ הַ/יְּהוּדִ֜ים בְּ/עָרֵי/הֶ֗ם בְּ/כָל מְדִינוֹת֙ הַ/מֶּ֣לֶךְ אֳחַשְׁוֵר֔וֹשׁ לִ/שְׁלֹ֣חַ יָ֔ד בִּ/מְבַקְשֵׁ֖י רָֽעָתָ֑/ם וְ/אִישׁ֙ לֹא עָמַ֣ד לִ/פְנֵי/הֶ֔ם כִּֽי נָפַ֥ל פַּחְדָּ֖/ם עַל כָּל הָ/עַמִּֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/002.yaml
  text: The Jews assembled in their cities throughout all the provinces of King Ahasuerus to lay hands on those seeking their harm[a], and no one could stand before them[c][b], because the fear of them had fallen on all the peoples.
translation:
  language: zh_hans
  text: 犹大人在亚哈随鲁王各省的城里聚集起来，要下手攻击那些想要害他们的人[a]。没有人能在他们面前站立得住[b]，因为各族的人都惧怕他们[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“要向那些想要害他们的人伸手”；这是希伯来语习语，按字面是“伸出手”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“没有人能抵挡他们。”
    reason: lexical_alternative
  - marker: c
    text: “各族的人”可能指帝国内不同的民族或居民群体，并非只指一个民族。
    reason: cultural_note
lexical_decisions:
- source_word: נִקְהֲלוּ
  choice: 聚集起来
  rationale: 该词是 קהל 的尼法勒式，表示众人集合；“聚集起来”自然地保留了集体行动的含义。
- source_word: בְּעָרֵיהֶם
  choice: 在……城里
  rationale: עִיר 通常指城或城市；结合“各省”这一分布范围，译作“在……城里”符合汉语表达。
- source_word: בְּכָל מְדִינוֹת הַמֶּלֶךְ אֳחַשְׁוֵרוֹשׁ
  choice: 在亚哈随鲁王各省
  rationale: מְדִינוֹת 指波斯帝国的行政省份；“各省”既准确又简洁。
- source_word: לִשְׁלֹחַ יָד
  choice: 下手攻击
  rationale: 该希伯来语习语直译为“伸手”，在这里表示采取敌对行动；“下手攻击”保留手的意象，也明确表达语境中的暴力含义。
- source_word: בִּמְבַקְשֵׁי רָעָתָם
  choice: 那些想要害他们的人
  rationale: 字面意思是“寻求他们祸患的人”；此译自然表达持续的敌意，而不额外限定具体手段。
- source_word: וְאִישׁ לֹא עָמַד לִפְנֵיהֶם
  choice: 没有人能在他们面前站立得住
  rationale: 保留“站在面前”的原文图像，同时以“站立得住”表达无法抵挡、抗衡的语境含义。
- source_word: כִּי נָפַל פַּחְדָּם
  choice: 因为……都惧怕他们
  rationale: 原文直译为“对他们的惧怕落在……之上”。汉语译为“惧怕他们”更自然，同时保留因恐惧而无人抵挡的逻辑。
- source_word: עַל כָּל הָעַמִּים
  choice: 各族的人
  rationale: עַמִּים 是复数，指帝国内不同民族或族群；“各族的人”比笼统的“众人”更能保留复数群体含义。
- source_word: אֳחַשְׁוֵרוֹשׁ
  choice: 亚哈随鲁
  rationale: 采用现代中文圣经传统中通行的人名音译。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。正文保留“下手”和“站立得住”等原文意象，但用上下文清楚呈现攻击与无法抵挡的含义；将复数 עַמִּים 译为“各族的人”，避免抹去帝国内多族群的范围。
