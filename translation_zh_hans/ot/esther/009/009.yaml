  text: 巴玛斯他[a]、亚利赛、亚利代和瓦耶撒他，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文在每个名字前都重复“和”以及直接宾语标记，直译为：“和巴玛斯他，和亚利赛，和亚利代，和瓦耶撒他。”
    reason: 说明原文反复使用连接词和直接宾语标记，而正文按自然中文列举方式表达。
lexical_decisions:
- source_word: פַּרְמַשְׁתָּא
  choice: 巴玛斯他
  rationale: 这是哈曼众子的名字之一，按希伯来语读音音译；采用现代中文圣经读者较熟悉的译名形式。
- source_word: אֲרִיסַי
  choice: 亚利赛
  rationale: 专名，按希伯来语读音音译，并采用中文圣经中通行、易辨认的形式。
- source_word: אֲרִדַי
  choice: 亚利代
  rationale: 专名，按希伯来语读音音译，并与相近人名“亚利赛”保持清楚区别。
- source_word: וַיְזָתָא
  choice: 瓦耶撒他
  rationale: 专名，按希伯来语读音音译；“瓦耶撒他”兼顾原文音节和中文可读性。
- source_word: וְאֵת ... וְאֵת ... וְאֵת ... וְאֵת
  choice: 以顿号列举，末项前用“和”
  rationale: 原文在每个名字前重复连接词 וְ 和直接宾语标记 אֵת，承接上一节的名单。中文通常以顿号列项，并在末项前用“和”，可自然表达同一列举关系；原文的重复形式另以脚注说明。
