  text: וָ/אֶתְּנָ֣/ה אֶת פָּנַ֗/י אֶל אֲדֹנָ/י֙ הָֽ/אֱלֹהִ֔ים לְ/בַקֵּ֥שׁ תְּפִלָּ֖ה וְ/תַחֲנוּנִ֑ים בְּ/צ֖וֹם וְ/שַׂ֥ק וָ/אֵֽפֶר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/003.yaml
  text: So I turned my face to the Lord God[a], to seek prayer and pleas for mercy, with fasting, sackcloth[b], and ashes.
translation:
  language: zh_hans
  text: 于是，我把脸转向主上帝[a]，为要借着祷告和恳求寻求他[b]，并禁食、披麻、蒙灰。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文较直译为“我把我的脸置向主上帝”。这是表示专心、坚定地转向的习语。
    reason: lexical_alternative
  - marker: b
    text: “他”是按上下文补出的，指主上帝。原文按词序可较直译为“寻求祷告和恳求”，也可理解为“借着祷告和恳求寻求（主上帝）”。
    reason: textual_ambiguity
lexical_decisions:
- source_word: וָאֶתְּנָה אֶת־פָּנַי
  choice: 我定意面向
  rationale: 字面为“我把我的脸转向/置于……”，是表示专心转向并下定决心的希伯来语习语。“定意面向”既保留“脸面”的具体意象，也表达有意识、坚定地转向上帝。
- source_word: אֶל־אֲדֹנָי הָאֱלֹהִים
  choice: 向主上帝
  rationale: אֲדֹנָי 是尊称“主”，并非此处直接出现的神名 YHWH；הָאֱלֹהִים 译作“上帝”。“主上帝”在现代汉语中自然地保留两个称号。
- source_word: לְבַקֵּשׁ
  choice: 寻求他
  rationale: 该不定式表示目的。希伯来文未明说宾语，但上下文指向刚提到的“主上帝”；汉语补出“他”可避免“寻求”悬空。由于后接名词的句法可有不同理解，另以脚注保留歧义。
- source_word: תְּפִלָּה וְתַחֲנוּנִים
  choice: 祷告和恳求
  rationale: תְּפִלָּה 是一般性的“祷告”；תַחֲנוּנִים 指谦卑而迫切地求恩惠或怜悯。“恳求”简明自然，并保持两词的层次。
- source_word: בְּצוֹם
  choice: 禁食
  rationale: 介词 בְּ 在此表示伴随方式或处境；汉语直接说“禁食”比“以禁食”更自然。
- source_word: וְשַׂק וָאֵפֶר
  choice: 披麻、蒙灰
  rationale: “麻布”和“灰”在此是哀恸、谦卑和悔罪的外在标志。采用汉语圣经语境中清楚而凝练的动作表达“披麻、蒙灰”，自然呈现其仪式性用法。
theological_decisions:
- issue: 神圣称号 אֲדֹנָי הָאֱלֹהִים 的译法
  choice: 主上帝
  alternative: 主，神
  rationale: 原文是 אֲדֹנָי，而不是神名 YHWH，因此译作“主”而不采用专用于神名的特殊形式；“上帝”对应 הָאֱלֹהִים，不额外引入宗派性称谓。
- issue: לְבַקֵּשׁ 后宾语及方式的理解
  choice: 以祷告和恳求寻求他
  alternative: 寻求祷告和恳求／祈求
  rationale: “他”虽未显式写出，却可由“主上帝”补足，祷告与恳求则可理解为寻求的方式。鉴于希伯来语表面结构也可能把“祷告和恳求”看作 לְבַקֵּשׁ 所支配的内容，脚注保留这一句法张力，不把它断定为唯一解释。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“定意面向”保留原文脸面的意象与坚定意志；“禁食、披麻、蒙灰”用整齐的并列短语呈现哀恸和谦卑的动作。所有补足和句法歧义均在脚注中明示。
