  rationale: 修订末句，以“你的城和你的百姓都称为你名下的”自然表达希伯来语被动习语所指的归属与身份认同；脚注保留字面结构。另以“留心并行事”替换“留心，采取行动”，使语体更庄重凝练，同时保持原文由留意转向施行的请求。
