id: DAN.9.19
reference: Daniel 9:19
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אֲדֹנָ֤/י שְׁמָ֨עָ/ה֙ אֲדֹנָ֣/י סְלָ֔חָ/ה אֲדֹנָ֛/י הַֽקֲשִׁ֥יבָ/ה וַ/עֲשֵׂ֖ה אַל תְּאַחַ֑ר לְמַֽעֲנְ/ךָ֣ אֱלֹהַ֔/י כִּֽי שִׁמְ/ךָ֣ נִקְרָ֔א עַל עִירְ/ךָ֖ וְ/עַל עַמֶּֽ/ךָ׀׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/019.yaml
  text: Lord[a], hear! Lord, forgive! Lord, pay attention and act! Do not delay, for your own sake, my God, because your name is called over your city and your people.
translation:
  language: zh_hans
  text: 主啊，求你垂听！主啊，求你赦免！主啊，求你留心并行事！我的神啊，求你为了你自己的缘故，不要迟延，因为你的城和你的百姓都称为你名下的[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“因为你的名被称在你的城和你的百姓之上。”这是表示归属和身份认同的希伯来语表达。
    reason: 保留原文“名被称在……之上”的字面意象，并说明正文采用的自然汉语习语。
lexical_decisions:
- source_word: אֲדֹנָי
  choice: 主啊
  rationale: 这是向上帝发出的呼语；“主啊”自然、庄重，也保留原文三次重复呼求的力度。
- source_word: שְׁמָעָה
  choice: 求你垂听
  rationale: 祈使式用于迫切祷告；“垂听”既表达听见，也带有恳求上帝回应的祷告语气。
- source_word: סְלָחָה
  choice: 求你赦免
  rationale: 在认罪祷告中，סלח明确指赦免罪过；“赦免”准确且符合现代庄重语体。
- source_word: הַקֲשִׁיבָה
  choice: 求你留心
  rationale: Hiphil祈使式强调专注听取；“留心”与前面的“垂听”有所区别，并为随后的行动请求作铺垫。
- source_word: וַעֲשֵׂה
  choice: 采取行动
  rationale: עשה本义宽泛，但此处没有明说宾语，语境是请求上帝介入；“采取行动”自然表达其语用含义而不补入具体行动。
- source_word: אַל תְּאַחַר
  choice: 求你不要迟延
  rationale: 否定祈愿表达不要推迟行动；“不要迟延”简洁而有迫切感。
- source_word: לְמַעַנְךָ
  choice: 为你自己的缘故
  rationale: 明确请求的根据在于上帝自己的名誉与缘故；“自己”体现代词的强调意味。
- source_word: אֱלֹהַי
  choice: 我的神啊
  rationale: 保留第一人称所属形式和直接呼求，体现祷告者与上帝之间的个人关系。
- source_word: כִּי
  choice: 因为
  rationale: 在此引出不要迟延的理由，现代汉语用“因为”清楚表达因果关系。
- source_word: שִׁמְךָ נִקְרָא עַל
  choice: 你的名冠在……身上
  rationale: 原文直译近于“你的名被称在……之上”，表示归属和以神之名识别。“冠在……身上”在现代汉语中较自然，同时保留“名在其上”的原文意象；另一种惯用表达列入脚注。
- source_word: עִירְךָ
  choice: 你的城
  rationale: 保留第二人称所属关系；上下文所指为耶路撒冷，无须在正文中明说。
- source_word: עַמֶּךָ
  choice: 你的百姓
  rationale: 保留第二人称所属关系，并用“百姓”表达作为上帝群体的人民。
theological_decisions:
- issue: שִׁמְךָ נִקְרָא עַל 所表达的归属与认同
  choice: 你的名冠在你的城和你的百姓身上
  alternative: 你的城和你的百姓都是称为你名下的
  rationale: 正文尽量保留希伯来文“名在城和百姓之上”的被动意象，不把它完全改写成单纯的命名关系；脚注提供较惯用的汉语说法，以显明这里涉及上帝的所有权、关系认同和名誉，同时不把这些含义限定为某一种神学解释。
translation_notes:
  register: 采用现代、庄重的祷告语言。保留三次“主啊”及连续感叹句，呈现原文急切而反复的恳求；用“垂听／留心／采取行动”区分递进的三个请求，避免将其压缩为同义重复。
