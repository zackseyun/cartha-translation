source:
  edition: WLC
  text: וְ/ע֨וֹד אֲנִ֤י מְדַבֵּר֙ וּ/מִתְפַּלֵּ֔ל וּ/מִתְוַדֶּה֙ חַטָּאתִ֔/י וְ/חַטַּ֖את עַמִּ֣/י יִשְׂרָאֵ֑ל וּ/מַפִּ֣יל תְּחִנָּתִ֗/י לִ/פְנֵי֙ יְהוָ֣ה אֱלֹהַ֔/י עַ֖ל הַר קֹ֥דֶשׁ אֱלֹהָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/020.yaml
  text: While I was still speaking and praying[a], confessing my sin and the sin of my people Israel, and presenting my plea before Yahweh my God concerning the holy mountain of my God[b],
translation:
  language: zh_hans
  text: 我还在说话、祷告，承认我的罪和我民以色列的罪，并在雅威——我的上帝——面前，为我上帝的圣山[b]献上恳求[a]的时候，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “献上恳求”原文直译为“使我的恳求落在……面前”；也可译作“呈上我的祈求”或“提出我的请求”。
    reason: lexical_alternative
  - marker: b
    text: “我上帝的圣山”指锡安山或耶路撒冷，也就是上帝圣所所在之地。
    reason: cultural_note
lexical_decisions:
- source_word: וְעוֹד אֲנִי מְדַבֵּר וּמִתְפַּלֵּל
  choice: 我还在说话、祷告
  rationale: 以“还在”表达动作仍在持续，并保留两个并列分词的进行意味；“祷告”是פלל在此语境中的通常含义。
- source_word: וּמִתְוַדֶּה
  choice: 承认
  rationale: ידה的Hitpael形式以“罪”为宾语时表示承认、 confess；现代汉语“承认……的罪”自然清楚，也避免把它误解为感谢或赞美。
- source_word: חַטָּאתִי וְחַטַּאת עַמִּי יִשְׂרָאֵל
  choice: 我的罪和我民以色列的罪
  rationale: חטאת在这里是“罪”，不是“赎罪祭”；译文保留“我民”与“以色列”的同位关系。
- source_word: וּמַפִּיל תְּחִנָּתִי לִפְנֵי
  choice: 在……面前献上恳求
  rationale: 原文直译是“使我的恳求落在……面前”，属于祷告用语；“献上恳求”在现代汉语中自然，并保留郑重而迫切的语气。
- source_word: יְהוָה
  choice: 雅威
  rationale: 直接音译四字神名，区别于称号“主”，并与源文明确使用专名相对应。
- source_word: אֱלֹהַי
  choice: 我的上帝
  rationale: 保留原文两次出现的第一人称所属形式，不因汉语行文而省略。
- source_word: עַל הַר קֹדֶשׁ אֱלֹהָי
  choice: 为我上帝的圣山
  rationale: עַל在这里标明恳求所关切的事项；“为”既自然，也保留可理解为关乎或为了圣山的语义幅度。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 源文使用四字神名而非称号。采用较直接对应YHWH的“雅威”，不以“主”替代专名；“耶和华”是传统形式，但反映了不同的音译惯例。
- issue: “我上帝的圣山”所指
  choice: 正文保留原文称谓，不直接改写为锡安或耶路撒冷
  alternative: 我上帝的圣山锡安；耶路撒冷
  rationale: 原文只说“圣山”；具体历史所指在脚注说明，可避免在正文中把解释写成原文明说的内容。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。句末保留逗号，因为本节的时间从句在下一节继续并得到完成。脚注标记均置于正文相应词语之后；将有关“恳求”的脚注放在“献上恳求”之后，以准确对应其解释对象。
