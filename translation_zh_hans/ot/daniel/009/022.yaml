base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/022.yaml
  text: He made me understand[a], and spoke with me, and said, “Daniel[b], I have now come out to give you insight and understanding.”
translation:
  language: zh_hans
  text: 他使我明白[a]，又与我交谈，对我说：“但以理，我如今出来[b]，为要使你有洞察力和悟性。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “使我明白”：希伯来语也可能理解为“他明白了”，但上下文更支持使役义。
    reason: lexical_alternative
  - marker: b
    text: “出来”：也可译作“出去”或“出来而来”；原文动词本义为“出去／出来”，此处的视角并不完全明确。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֶן
  choice: 他使我明白
  rationale: 将 בין 此处按使役义理解，表示来者使但以理获得明白；既贴近希伯来语形式，也符合上下文。
- source_word: וַיְדַבֵּר עִמִּי
  choice: 又与我说话
  rationale: עִם 明确表示“与”，译文保留这一介词关系，同时符合现代汉语表达。
- source_word: וַיֹּאמַר
  choice: 说
  rationale: 这是叙事中引出直接引语的常用形式；汉语无需重复译出连接词也能自然承接。
- source_word: דָּנִיֵּאל
  choice: 但以理
  rationale: 采用中文圣经传统中通行且易识别的人名译法。
- source_word: עַתָּה
  choice: 现在
  rationale: 直接表达说话者此刻所执行的使命。
- source_word: יָצָאתִי
  choice: 我现在出来
  rationale: יצא 的基本义是“出去、出来”。此处保留空间意象和原文视角上的一定含混，不擅自补入“奉差遣”等原文未明说的内容。
- source_word: לְהַשְׂכִּילְךָ
  choice: 使你有洞察力
  rationale: שׂכל 的使役形式表示使人有见识、获得洞察；这样也能与后面的 בִינָה 区分而不重复。
- source_word: בִינָה
  choice: 悟性
  rationale: בִינָה 指理解、辨识的能力；“悟性”自然凝练，并与“洞察力”共同保留原文两个相关概念。
