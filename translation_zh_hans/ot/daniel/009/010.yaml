  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/לֹ֣א שָׁמַ֔עְנוּ בְּ/ק֖וֹל יְהוָ֣ה אֱלֹהֵ֑י/נוּ לָ/לֶ֤כֶת בְּ/תֽוֹרֹתָי/ו֙ אֲשֶׁ֣ר נָתַ֣ן לְ/פָנֵ֔י/נוּ בְּ/יַ֖ד עֲבָדָ֥י/ו הַ/נְּבִיאִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/010.yaml
  text: and we have not obeyed the voice of Yahweh our God[a], to walk in his laws, which he set before us through his servants the prophets.
translation:
  language: zh_hans
  text: 我们没有听从耶和华我们的上帝的话，也没有遵行他借着他的仆人，即众先知，摆在我们面前的律法。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “律法”原文为复数，也可译作“训诲”或“指示”；“借着”原文直译为“借……的手”。
    reason: 保留תּוֹרָה的语义幅度，并说明בְּיַד这一希伯来语媒介表达。
lexical_decisions:
- source_word: שָׁמַעְנוּ בְּקוֹל
  choice: 听从……的话
  rationale: שׁמע与בְּקוֹל连用，不只是听见，也包含以顺服回应；“听从……的话”在现代汉语中自然地保留了“听”与“顺服”两层含义。
- source_word: יְהוָה אֱלֹהֵינוּ
  choice: 耶和华—我们上帝
  rationale: 以“耶和华”音译神的专名，并用破折号清楚表达“我们的上帝”与该专名的同位关系。
- source_word: לָלֶכֶת בְּתוֹרֹתָיו
  choice: 遵行他的律法
  rationale: “行走在”是品行与生活方式的希伯来隐喻；汉语“遵行”既自然，也准确传达按这些训令生活的含义。复数תּוֹרֹתָיו在此指上帝所赐的各项律法或训令。
- source_word: אֲשֶׁר נָתַן לְפָנֵינוּ
  choice: 摆在我们面前
  rationale: 直译为“赐在我们面前”，语义是把某事陈明、置于人面前；“摆在我们面前”保留原文形象且符合现代汉语。
- source_word: בְּיַד עֲבָדָיו הַנְּבִיאִים
  choice: 借着自己的仆人众先知
  rationale: בְּיַד字面为“借……的手”，在这里表示媒介或代理。“借着”清楚传达此义；“仆人众先知”保留“仆人”与“先知”的同位关系。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名；中文正文采用广为人知的专名形式“耶和华”，不以“主”等称号代替。
- issue: 复数תּוֹרֹתָיו的语义范围
  choice: 他的律法
  alternative: 他的训诲／教导
  rationale: 此处处于认罪与盟约悖逆的语境，并与“遵行”相连，“律法”贴合语境；同时不把它收窄为单一法典，脚注提示原文为复数，也可涵盖训诲或指示。
- issue: לָלֶכֶת与前句的关系
  choice: 没有遵行
  alternative: 为要行在／去遵行
  rationale: 不定式说明听从上帝之声在生活行为上的具体表现。汉语用并列否定“没有……，没有……”表达这一密切关系，避免生硬地把目的或结果单方面定死。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“听从……的话”保留原文听见并顺服的意味；以“遵行”自然表达希伯来语“行走”的生活隐喻。脚注标记置于相关句末。
