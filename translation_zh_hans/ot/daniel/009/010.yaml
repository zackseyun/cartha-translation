  naturalness: “耶和华—我们上帝”使用破折号来处理属格结构，现代普通话中略显生硬；“耶和华我们的上帝”更自然、庄重且不损失原文关系。以“也没有”连接两个否定分句，能更顺畅地反映后面的不定式与前句的密切关联。
  terminology: 保留“耶和华”作为神的专名，保留“上帝”“律法”“仆人”“先知”等既自然又符合经文语域的术语。“律法”可作复数训令的集合性译法，脚注恰当说明其复数形式及可有的较宽语义。
