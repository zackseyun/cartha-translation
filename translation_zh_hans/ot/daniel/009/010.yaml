revisions:
- from: 我们没有听从耶和华—我们上帝的话，没有遵行他借着自己的仆人众先知摆在我们面前的律法。[a]
  to: 我们没有听从耶和华我们的上帝的话，也没有遵行他借着他的仆人，即众先知，摆在我们面前的律法。[a]
  rationale: 修订仅处理汉语句法和同位关系：“耶和华我们的上帝”自然对应原文神名加第一人称复数属格；“也没有遵行”顺畅表达不听从所体现的行为性悖逆；“即众先知”明确先知与“他的仆人”的同位关系。原有脚注内容准确，保留不变。
