source:
  edition: WLC
  text: לְ/ךָ֤ אֲדֹנָ/י֙ הַ/צְּדָקָ֔ה וְ/לָ֛/נוּ בֹּ֥שֶׁת הַ/פָּנִ֖ים כַּ/יּ֣וֹם הַ/זֶּ֑ה לְ/אִ֤ישׁ יְהוּדָה֙ וּ/לְ/יוֹשְׁבֵ֣י יְרֽוּשָׁלִַ֔ם וּֽ/לְ/כָל יִשְׂרָאֵ֞ל הַ/קְּרֹבִ֣ים וְ/הָ/רְחֹקִ֗ים בְּ/כָל הָֽ/אֲרָצוֹת֙ אֲשֶׁ֣ר הִדַּחְתָּ֣/ם שָׁ֔ם בְּ/מַעֲלָ֖/ם אֲשֶׁ֥ר מָֽעֲלוּ בָֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/007.yaml
  text: To you[a], O Lord, belongs righteousness, but to us belongs shame of face, as it is this day—to the men of Judah, to the inhabitants of Jerusalem, and to all Israel, those who are near and those who are far away[b], in all the lands where you have driven them[c], because of their unfaithfulness that they committed against you.
translation:
  language: zh_hans
  text: 主啊，公义归于你；我们却满面羞愧[a]，正如今日一样。犹大人[b]、耶路撒冷的居民和所有以色列人，无论在近处还是远方，在你把他们赶到的各地，都是如此；这是因为他们向你行了背信之事[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语直译为“脸面的羞耻”，可指公开受辱，或羞耻显露在脸上。
    reason: lexical_alternative
  - marker: b
    text: 或译：“每一个犹大人。”希伯来语使用阳性单数形式，具有分配或集合含义。
    reason: lexical_alternative
  - marker: c
    text: “背信”也可译为“不忠”或“背叛”；原文用同一词根的名词和动词强调他们对上帝破坏信义。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי
  choice: 主啊
  rationale: 这是对上帝的直接呼唤，并非神名 יהוה；“主啊”自然保留祷告语气。
- source_word: הַצְּדָקָה
  choice: 公义
  rationale: 此处指上帝在道德和审判上的正直，以及他被证实为正确；“公义”比单用“公平”或“正义”更能保留认罪祷告中的神学分量。
- source_word: בֹּשֶׁת הַפָּנִים
  choice: 满面羞愧
  rationale: 希伯来语直译为“脸面的羞耻”，表示显在脸上、公开可见的羞耻；“满面羞愧”既保留面部意象，也符合现代汉语。
- source_word: כַּיּוֹם הַזֶּה
  choice: 正如今日一样
  rationale: 指眼前可见、延续到当下的受辱处境，保留“这日”的指示意味。
- source_word: לְאִישׁ יְהוּדָה
  choice: 犹大人
  rationale: 单数 אִישׁ 在这里作分配或集合用法；汉语“犹大人”可自然涵盖这一群体，脚注注明也可理解为“每一个犹大人”。
- source_word: יוֹשְׁבֵי יְרוּשָׁלִַם
  choice: 耶路撒冷的居民
  rationale: 准确表达居住在耶路撒冷的人，简洁且符合现代书面汉语。
- source_word: כָּל יִשְׂרָאֵל
  choice: 所有以色列人
  rationale: 在此指整个以色列群体；使用“以色列人”可避免现代汉语把“以色列”误解为单指地域或现代国家。
- source_word: הַקְּרֹבִים וְהָרְחֹקִים
  choice: 无论在近处还是远方
  rationale: 保留近与远的对照，并在上下文中自然表达以色列人分散各地的地理处境。
- source_word: בְּכָל הָאֲרָצוֹת
  choice: 在……各地
  rationale: 原文为“在所有土地／国家中”；“各地”自然表达被掳者分散在多个地域，不额外引入现代民族国家概念。
- source_word: הִדַּחְתָּם
  choice: 你把他们赶到
  rationale: 使役形式强调上帝使他们被驱逐到各地；“赶到”保留上帝的主动作用和流亡的强制性。
- source_word: בְּמַעֲלָם אֲשֶׁר מָעֲלוּ בָךְ
  choice: 因为他们向你行了背信之事
  rationale: מעל 词族表示破坏信义、背信或不忠；此译保留其针对上帝的关系性冒犯，也以“背信之事”承接原文同词根的名词与动词结构。
theological_decisions:
- issue: 上帝的公义与百姓的羞耻之间的对照
  choice: 译作“公义归于你；我们却满面羞愧”
  alternative: “你是公正的；我们则公开蒙羞”
  rationale: 原文以平行结构对照上帝站立得正与百姓因背信而受辱，并未在此否认怜悯，也未暗示人可凭功劳自义；名词式表达更贴近原文张力。
- issue: 流亡中的神圣主动性
  choice: 保留“你把他们赶到”
  alternative: “他们被分散到”
  rationale: 原文使役动词明确以上帝为主语；不将其弱化为无人称的历史遭遇，同时也让下文说明流亡与百姓背信的关系。
- issue: לְאִישׁ יְהוּדָה 的集合与分配含义
  choice: 正文采用“犹大人”，脚注说明“每一个犹大人”
  alternative: “犹大众人”或“每一个犹大男子”
  rationale: 原文阳性单数可作分配用法。汉语群体称谓“犹大人”自然且不抹去原文信息；脚注保留更逐字的另一种理解。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语言。“主啊”保留呼告语气；分号和“都是如此”明确“羞愧”同样归于随后列举的犹大人、耶路撒冷居民及全体以色列人。正文避免生硬直译“脸面的羞耻”，但以脚注保存原文意象；同时保留上帝驱逐百姓与百姓背信之间未被弱化的神学张力。
