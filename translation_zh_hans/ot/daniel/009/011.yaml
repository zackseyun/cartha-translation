id: DAN.9.11
reference: Daniel 9:11
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/כָל יִשְׂרָאֵ֗ל עָֽבְרוּ֙ אֶת תּ֣וֹרָתֶ֔/ךָ וְ/ס֕וֹר לְ/בִלְתִּ֖י שְׁמ֣וֹעַ בְּ/קֹלֶ֑/ךָ וַ/תִּתַּ֨ךְ עָלֵ֜י/נוּ הָ/אָלָ֣ה וְ/הַ/שְּׁבֻעָ֗ה אֲשֶׁ֤ר כְּתוּבָה֙ בְּ/תוֹרַת֙ מֹשֶׁ֣ה עֶֽבֶד הָֽ/אֱלֹהִ֔ים כִּ֥י חָטָ֖אנוּ לֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/011.yaml
  text: All Israel has transgressed your law and turned aside[a], not listening to your voice. So the curse and the oath that are written in the law of Moses, the servant of God, have been poured out on us, because we have sinned against him.
translation:
  language: zh_hans
  text: 以色列全体都违犯了你的律法，偏离正道，不听从你的话。因此，记在上帝的仆人摩西的律法中的咒诅和誓言[a]，就倾倒在我们身上，因为我们得罪了他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “咒诅和誓言”也可理解为“立誓施行的咒诅”。希伯来原文使用两个名词，可能指摩西律法中以誓言确认的盟约制裁。
    reason: 说明“誓言”在盟约制裁语境中的可能含义，同时保留正文的直译。
lexical_decisions:
- source_word: וְכָל יִשְׂרָאֵל
  choice: 全以色列
  rationale: כָל与专名“以色列”连用，概括整个民族；“全以色列”简洁自然，并保留集体认罪的范围。
- source_word: עָבְרוּ אֶת תּוֹרָתֶךָ
  choice: 都违犯了你的律法
  rationale: עבר与“律法”连用时表示越界、违犯；加入“都”使中文清楚表达复数谓语和全体性的含义。
- source_word: וְסוֹר
  choice: 转离正道
  rationale: סור表示偏离、转离；“正道”将原文隐含的道路意象自然呈现，但不指定额外的教义内容。
- source_word: לְבִלְתִּי שְׁמֹעַ בְּקוֹלֶךָ
  choice: 不听从你的话
  rationale: שמע בקול不仅指听见，也指听从、顺服；“听从你的话”是自然现代汉语，同时保留其顺服层面的含义。
- source_word: וַתִּתַּךְ עָלֵינוּ
  choice: 就倾倒在我们身上
  rationale: נתך在此描写审判如液体倾倒而下；保留“倾倒”可传达原文鲜明意象。
- source_word: הָאָלָה וְהַשְּׁבֻעָה
  choice: 咒诅和誓言
  rationale: 分别直译两个名词，不把“誓言”解释性地并入“咒诅”，从而保留原文关系上的张力。
- source_word: אֲשֶׁר כְּתוּבָה בְּתוֹרַת מֹשֶׁה
  choice: 那记在……摩西律法中的
  rationale: 自然表达这些盟约制裁载于摩西律法；中文无需处理希伯来语形容词的单复数配合问题。
- source_word: עֶבֶד הָאֱלֹהִים
  choice: 上帝仆人
  rationale: 保留摩西的尊称及其与上帝的所属关系，表达简练庄重。
- source_word: כִּי חָטָאנוּ לוֹ
  choice: 因为我们得罪了他
  rationale: חטא与ל连用可指得罪某人；“他”按祷告语境回指上帝，并保留但以理置身群体之中的第一人称复数认罪。
theological_decisions:
- issue: 以色列的集体罪责
  choice: 以“全以色列都违犯了”表达全国整体的罪责，随后保留“我们……得罪了他”的共同认罪。
  alternative: 将句子处理为抽象的民族罪责，弱化但以理所用的第一人称复数。
  rationale: 原文先以第三人称复数指全以色列，后转为第一人称复数，既强调群体责任，也表明祷告者认同并置身于犯罪的群体中。
- issue: 盟约语境中“誓言”的含义
  choice: 正文保留“咒诅和誓言”两个并列名词。
  alternative: 解释性译为“立誓施行的咒诅”或“誓约的咒诅”。
  rationale: 上下文很可能指摩西律法中以誓言确认的盟约制裁，但原文明确保留两个名词；正文不将两者合并，以免过早消解其关系。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“转离正道”保留偏离道路的意象；“倾倒在我们身上”保留审判降临的形象化表达。脚注标记置于其实际解释的“咒诅和誓言”之后。
