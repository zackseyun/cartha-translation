source:
  edition: WLC
  text: וְ/תֵדַ֨ע וְ/תַשְׂכֵּ֜ל מִן מֹצָ֣א דָבָ֗ר לְ/הָשִׁיב֙ וְ/לִ/בְנ֤וֹת יְרֽוּשָׁלִַ֨ם֙ עַד מָשִׁ֣יחַ נָגִ֔יד שָׁבֻעִ֖ים שִׁבְעָ֑ה וְ/שָׁבֻעִ֞ים שִׁשִּׁ֣ים וּ/שְׁנַ֗יִם תָּשׁוּב֙ וְ/נִבְנְתָה֙ רְח֣וֹב וְ/חָר֔וּץ וּ/בְ/צ֖וֹק הָ/עִתִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/025.yaml
  text: 'So know and understand: from the issuing of the word to restore and rebuild Jerusalem until an anointed one[a], a prince, there will be seven weeks, and for sixty-two weeks it will be restored and rebuilt, with plaza and moat[c][b], but in troubled times.'
translation:
  language: zh_hans
  text: 所以，你要知道，也要明白：从发出要恢复并重建耶路撒冷的话起，直到一位受膏者[a]，就是一位领袖，将有七周[b]；在六十二周[b]期间，这城将得到恢复和重建，有广场和壕沟[c]，却是在困苦的时期。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“弥赛亚，一位统治者”，或“弥赛亚君王”。希伯来文直译为“受膏者，领袖（或君王）”。
    reason: 保留מָשִׁיחַ נָגִיד的传统弥赛亚读法及נָגִיד的不同语义范围。
  - marker: b
    text: “七周”也可译作“七个七期”；“六十二周”同样可译作“六十二个七期”。原文没有在这里明确说明每一“七期”具体有多长。
    reason: 原词可指“周”或由七构成的周期，需避免在译文中直接确定其年代计算。
  - marker: c
    text: 或译“广场和沟渠（或壕堑）”。译作“壕沟”的希伯来词在这里含义不确定，可能指沟渠或防御性的壕堑。
    reason: חָרוּץ在本节的确切所指存在词义不确定性。
lexical_decisions:
- source_word: וְתֵדַע וְתַשְׂכֵּל
  choice: 你要知道，也要明白
  rationale: 两个未完成式在此具有劝告或指示语气；译文保留“知道”和“明白”的并列，同时符合现代汉语表达。
- source_word: מִן מֹצָא דָבָר
  choice: 从发出……的话起
  rationale: מֹצָא有“出去、发出”之意，דָבָר可指“话、事情、谕令”。正文用“话”避免把它预先限定为某一道帝王诏令。
- source_word: לְהָשִׁיב וְלִבְנוֹת יְרוּשָׁלִַם
  choice: 要恢复并重建耶路撒冷
  rationale: הֵשִׁיב在城市语境中宜作“恢复”；בנה译作“重建”，清楚表达耶路撒冷的复兴与建造。
- source_word: עַד מָשִׁיחַ נָגִיד
  choice: 直到一位受膏者，就是一位领袖
  rationale: מָשִׁיחַ本义为“受膏者”，正文不预先认定其具体身份；נָגִיד表示领袖、统治者或君王，译作“领袖”可保留其较宽泛的语义。
- source_word: שָׁבֻעִים שִׁבְעָה
  choice: 七周
  rationale: שָׁבֻעַ可表示“周”或“七的单位”。正文采用简洁而传统的“周”，脚注注明“七期”的可能译法。
- source_word: וְשָׁבֻעִים שִׁשִּׁים וּשְׁנַיִם
  choice: 在六十二周中
  rationale: 表达随后的一段时期，并与马所拉重音所支持的分句保持一致。
- source_word: תָּשׁוּב וְנִבְנְתָה
  choice: 这城将得到恢复和重建
  rationale: 阴性单数动词回指耶路撒冷；以“这城”明确汉语中的主语，而不改变所指。
- source_word: רְחוֹב וְחָרוּץ
  choice: 广场和壕沟
  rationale: רְחוֹב指开阔的公共场所；חָרוּץ在此词义不确定，可能指壕沟、沟渠或防御性壕堑，因此正文选“壕沟”并加脚注。
- source_word: וּבְצוֹק הָעִתִּים
  choice: 而那将是在困苦的时期
  rationale: 保留时期受压、艰难的含义，并避免把连接词过度解释为强烈的让步关系。
theological_decisions:
- issue: מָשִׁיחַ是否应在正文直接译为专名“弥赛亚”
  choice: 正文译作“一位受膏者”
  alternative: “弥赛亚”“弥赛亚君王”
  rationale: 该希伯来词本身可泛指受膏的人，单凭本节措辞不能无争议地确定为专名。正文保留词汇本义，脚注列出传统的弥赛亚译法。
- issue: שָׁבֻעִים所表示的时间单位
  choice: 正文译作“周”
  alternative: “七期”“七个七”或解释为“年周”
  rationale: 原词既可表示周，也可突出七的周期。正文采用通行译法，但不在正文中擅自解释为七年；脚注保留较直译的选择。
- issue: 七周与六十二周的句法分界
  choice: 七周止于受膏领袖出现；六十二周与城市恢复重建相连
  alternative: 把七周和六十二周合并为直到受膏者的一段时期
  rationale: WLC的马所拉重音在“七周”处设置主要停顿，支持正文分句；另一种合并读法在解释史上存在，但不是该重音系统所呈现的首选句法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留预言文本的紧凑结构和关键歧义；以“这城”补足汉语主语，以破折号之外的同位表达“就是一位领袖”保持可读性。脚注标记均在正文首次相关位置出现；关于“周”的同一脚注在两处重复标示，以明确同时适用于两个数字。
