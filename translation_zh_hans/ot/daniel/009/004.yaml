base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/004.yaml
  text: And I prayed to Yahweh my God and confessed and said[a], “Please, Lord, the great and awesome God[b], who keeps the covenant and steadfast love for those who love him and keep his commandments,”
translation:
  language: zh_hans
  text: 我向雅威我的神祷告、认罪，说：“主啊，伟大而令人敬畏的神！你向爱你、遵守你诫命的人守约，施慈爱[a]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “慈爱”所译的希伯来词在这里与“约”并列，含有忠贞、信实和怜悯之意；也可译作“信实的爱”或“盟约之爱”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶתְפַּלְלָה
  choice: 我……祷告
  rationale: 该叙事形式表示接续发生的行动；用现代汉语的一般过去叙述表达，不另加进行体。
- source_word: לַיהוָה אֱלֹהַי
  choice: 向雅威我的神
  rationale: 介词 ל 标明祷告的对象；保留第一人称所属关系，并将 יהוה 音译为“雅威”，以体现专名。
- source_word: וָאֶתְוַדֶּה
  choice: 认罪
  rationale: ידה 的 Hitpael 形式在本段悔罪语境中指承认罪，译为“认罪”简洁自然。
- source_word: אָנָּא אֲדֹנָי
  choice: 主啊
  rationale: אָנָּא 是恳求或感叹语气词；汉语呼语“啊”自然传达恳切语气，无须生硬译成“求你”。
- source_word: הָאֵל הַגָּדוֹל וְהַנּוֹרָא
  choice: 伟大而令人敬畏的神
  rationale: נוֹרָא 指使人产生畏惧、敬畏者；“令人敬畏”兼顾威严和宗教性的敬畏，避免“可怕”的纯负面色彩。
- source_word: שֹׁמֵר הַבְּרִית וְהַחֶסֶד
  choice: 守约，施慈爱
  rationale: 分词描述神一贯的作为。汉语采用并列动宾结构，既保留“约”，也自然表达 חֶסֶד 的忠贞慈爱。
- source_word: לְאֹהֲבָיו וּלְשֹׁמְרֵי מִצְוֺתָיו
  choice: 向爱你、遵守你诫命的人
  rationale: 两个带 ל 的短语共同限定神守约施慈爱的对象；第三人称后缀在直接祷告的汉语引语中自然转换为第二人称“你”。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华／上主
  rationale: 原文使用四字神名，音译“雅威”保留其专名性质，并区别于本节稍后的称号 אֲדֹנָי（主）。
- issue: חֶסֶד 在盟约语境中的含义
  choice: 慈爱
  alternative: 信实的爱／盟约之爱／忠爱
  rationale: “慈爱”是自然、庄重的中文表达；脚注说明它在此与“约”相连，包含忠贞、信实和怜悯，不把词义缩减为情感。
- issue: נוֹרָא 的敬畏与惧怕张力
  choice: 令人敬畏
  alternative: 可畏／可怕
  rationale: 保留神使人畏惧的威严，同时避免把该词解释成纯粹负面或仅表示赞叹。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语言。以“主啊”表达直接呼告，以“令人敬畏”保留原文的威严感；句末按本节语法收束为完整中文句子，同时不消解后文祷告的延续性。
