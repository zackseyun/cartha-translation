  text: וְ/לֹ֤א שָׁמַ֨עְנוּ֙ אֶל עֲבָדֶ֣י/ךָ הַ/נְּבִיאִ֔ים אֲשֶׁ֤ר דִּבְּרוּ֙ בְּ/שִׁמְ/ךָ֔ אֶל מְלָכֵ֥י/נוּ שָׂרֵ֖י/נוּ וַ/אֲבֹתֵ֑י/נוּ וְ/אֶ֖ל כָּל עַ֥ם הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/006.yaml
  text: We have not listened to your servants the prophets[a], who spoke in your name to our kings, our officials, our fathers[b], and to all the people of the land.
translation:
  language: zh_hans
  text: 我们没有听从[a]你的仆人——众先知；他们奉你的名，向我们的君王、首领、列祖[b]和这地所有的百姓说话。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“听”。希伯来语动词可指听取、留心，也常含有作出回应、遵从的意思。
    reason: lexical_alternative
  - marker: b
    text: 或译“我们的祖先”；原文直译为“我们的父亲”。
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַעְנוּ אֶל
  choice: 听从
  rationale: שׁמע与אֶל连用，表示听某人的话并作出相应回应。“听从”在现代汉语中自然地兼顾听取与顺服，但不把词义收窄为单纯“服从”。
- source_word: עֲבָדֶיךָ הַנְּבִיאִים
  choice: 你的仆人——众先知
  rationale: “仆人”符合先知事奉上帝这一尊称性的语境；破折号清楚表达“众先知”是对“你的仆人”的同位说明。
- source_word: דִּבְּרוּ בְּשִׁמְךָ
  choice: 奉你的名……说话
  rationale: “奉你的名”保留先知凭上帝授权、代表上帝发言的含义，也贴近希伯来语表达。
- source_word: מְלָכֵינוּ שָׂרֵינוּ
  choice: 我们的君王、首领
  rationale: מְלָכֵינוּ直译为“我们的君王”；שָׂרֵינוּ指掌权者或官长，“首领”既自然，又不将其过窄地限定为世袭贵族或现代官员。
- source_word: אֲבֹתֵינוּ
  choice: 列祖
  rationale: 该词字面为“我们的父辈”，在此指先前各代。“列祖”简洁、庄重，并保留原文男性亲属称谓的历史表达；脚注列出更通俗的译法。
- source_word: כָּל עַם הָאָרֶץ
  choice: 这地所有的百姓
  rationale: עַם是集合名词，译作“百姓”；הָאָרֶץ在此自然指本地或国土。“这地”保留原文措辞，不进一步限定具体政治疆域。
theological_decisions:
- issue: שָׁמַעְנוּ应侧重听见、听从还是服从
  choice: 听从
  alternative: 听；服从
  rationale: 本节是认罪祷告，明显包含未依言而行的责任；但原词范围比纯粹“服从”更宽。“听从”保留听取和回应两层含义，脚注说明其语义幅度。
- issue: אֲבֹתֵינוּ应译作男性亲属称谓还是概括性的祖先
  choice: 列祖
  alternative: 我们的祖先；我们的父辈
  rationale: 原文为阳性复数“我们的父辈”，在上下文中泛指前代。“列祖”保留这一传统男性称谓，同时不否认所指为历代先人；脚注提供现代通俗释义。
- issue: בְּשִׁמְךָ是否应解释为抽象的授权
  choice: 奉你的名
  alternative: 凭你的权柄；代表你
  rationale: 原文习语兼具授权与代表的意味。“奉你的名”保留这些神学内涵，不在正文中只选定其中一个解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“君王、首领、列祖、百姓”保持祷告及历史认罪语境的庄严感；句中用破折号标明同位关系，用分号避免多层修饰造成歧义。
