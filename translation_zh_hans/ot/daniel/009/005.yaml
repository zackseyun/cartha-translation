source:
  edition: WLC
  text: חָטָ֥אנוּ וְ/עָוִ֖ינוּ ו/הרשענו וּ/מָרָ֑דְנוּ וְ/ס֥וֹר מִ/מִּצְוֺתֶ֖/ךָ וּ/מִ/מִּשְׁפָּטֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/005.yaml
  text: We have sinned and done wrong and acted wickedly and rebelled[b][a], turning aside from your commandments and your judgments.
translation:
  language: zh_hans
  text: 我们犯罪，行事不义[a]，作恶，悖逆，偏离了你的诫命和典章[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“作孽”。原文动词含有行事乖曲、邪僻的意思。
    reason: lexical_alternative
  - marker: b
    text: 或译“判决”或“法令”。原文词语可指司法判决，也可指规定的法令。
    reason: lexical_alternative
lexical_decisions:
- source_word: חָטָאנוּ
  choice: 我们犯罪
  rationale: 这是 חטא 的第一人称复数完成式，直接表达共同认罪；汉语无需另加时态标记，祷告语境已显明是回顾并承认所犯之罪。
- source_word: וְעָוִינוּ
  choice: 行事不义
  rationale: עוה 含有行为乖曲、邪僻并因此负罪的意味。“行事不义”自然易懂，也与后面的“作恶”有所区别；脚注保留“作孽”这一较凝练的可能译法。
- source_word: וְהִרְשַׁעְנוּ
  choice: 作恶
  rationale: רשע 的使役词干在此表示行恶或表现邪恶。“作恶”保留其动词性，并避免与前一项“行事不义”完全重合。
- source_word: וּמָרָדְנוּ
  choice: 悖逆
  rationale: מרד 指反叛、抗拒权柄；“悖逆”符合向上帝认罪的盟约语境，庄重而仍为现代读者熟悉。
- source_word: וְסוֹר
  choice: 偏离了
  rationale: סור 表示转离、偏离。此处承接前面一连串认罪动词，译为“偏离了”使现代汉语句法顺畅，同时保留离开上帝所定道路的意象。
- source_word: מִמִּצְוֺתֶיךָ
  choice: 你的诫命
  rationale: מצוה 通常指命令、诫命；“诫命”准确保留经文及盟约语域。
- source_word: וּמִמִּשְׁפָּטֶיךָ
  choice: 和典章
  rationale: משפט 可指判决、司法规定或所颁定的法令。“典章”在与“诫命”并列时自然且庄重，并能涵盖规范性的法律含义；脚注说明其司法和法令层面的其他可能译法。
theological_decisions:
- issue: 是否合并连续的认罪用语
  choice: 分别译出“犯罪、行事不义、作恶、悖逆、偏离”
  alternative: 概括为“我们犯罪作恶，背叛了你”
  rationale: 原文连续使用五个相关而不完全相同的表达，形成层层累积的共同认罪。分别译出可保留其修辞力度和各词之间的道德、盟约含义，而不把张力压平。
- issue: מִשְׁפָּטֶיךָ 的法律含义
  choice: 你的典章
  alternative: 你的判决；你的法令
  rationale: 该词既可指司法判决，也可指具有约束力的规定。正文采用适合与“诫命”并列的“典章”，脚注保留“判决、法令”的语义幅度，不将其限定为单一制度类别。
translation_notes:
  register: 采用现代、庄重而可理解的祷告语言。以并列短语保留希伯来文密集累加的认罪节奏；“悖逆、诫命、典章”保持经文语域，但整体句法简洁自然。
