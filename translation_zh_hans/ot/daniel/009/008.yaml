  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: יְהוָ֗ה לָ֚/נוּ בֹּ֣שֶׁת הַ/פָּנִ֔ים לִ/מְלָכֵ֥י/נוּ לְ/שָׂרֵ֖י/נוּ וְ/לַ/אֲבֹתֵ֑י/נוּ אֲשֶׁ֥ר חָטָ֖אנוּ לָֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/008.yaml
  text: O Lord[a], to us belongs shame of face—to our kings, to our princes[b], and to our fathers—because we have sinned against you.
translation:
  language: zh_hans
  text: 耶和华啊，[a]我们满面羞愧；我们的君王、首领和列祖也都如此，因为我们得罪了你。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “耶和华”原文为上帝的名YHWH。
    reason: 说明原文神名。
  - marker: b
    text: “满面羞愧”原文直译为“脸面的羞耻归于我们”，指公开蒙羞、受辱。
    reason: 说明希伯来语习语的字面形式与含义。
lexical_decisions:
- source_word: יְהוָה
  choice: 主
  rationale: 这是以色列上帝的专名YHWH；中文正文按通行、庄重的圣经用语译作“主”，并保留直接呼告语气。
- source_word: לָנוּ בֹּשֶׁת הַפָּנִים
  choice: 我们满面羞愧
  rationale: 原文直译为“脸面的羞耻归于我们”。“满面羞愧”保留“脸面”的具体意象，同时自然表达公开蒙羞、受辱之意。
- source_word: לִמְלָכֵינוּ לְשָׂרֵינוּ
  choice: 我们的君王、首领
  rationale: 重复的介词ל表明这些人同样承受羞愧。שָׂרִים可指王公、官长或领袖；“首领”既保留政治领导含义，也不把其范围过度限定为世袭王子。
- source_word: וְלַאֲבֹתֵינוּ
  choice: 和列祖
  rationale: אָבוֹת字面为“父辈”，此处指先辈、祖先；“列祖”是现代中文圣经语体中庄重且清楚的对应表达。
- source_word: אֲשֶׁר חָטָאנוּ לָךְ
  choice: 因为我们得罪了你
  rationale: אֲשֶׁר在此引出羞愧的原因；חטא与ל连用表示冒犯的对象。“得罪了你”自然传达向上帝犯罪的关系性含义。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 主
  alternative: 耶和华／雅威
  rationale: 原文是神的专名YHWH。正文采用中文读者熟悉的“主”，避免在学术拟音之间作不必要的定论；脚注说明原文形式。
- issue: 群体羞愧的分配关系
  choice: “也都如此”明确君王、首领和列祖同样满面羞愧
  alternative: 重复“满面羞愧归于我们的君王、首领和列祖”
  rationale: 希伯来文重复ל，逐项列出羞愧所归属的人群；“也都如此”用自然中文保存这种平行关系，而不是把后列各组仅理解为“我们”的解释成分。
translation_notes:
  register: 采用现代、庄重而可朗读的祷告语体。“满面羞愧”保留原文脸面的意象；分号和“也都如此”清楚呈现各群体平行承担羞愧。脚注标记[a]已置于正文相关句末。
