revisions:
- from: 主我们的神有怜悯和赦免[a]，因为我们背叛了他。
  to: 怜悯和赦免都属于主——我们的神；尽管我们背叛了他。[a]
  rationale: 修订归属句式，使中文更自然并忠实呈现 לְ 的语义；将连接词调整为让步性的“尽管”，保留神的怜悯与人背叛之间的祷告性反衬。脚注仅说明可确证的复数现象，删去“多次赦免”这一不必要的语义添加。
