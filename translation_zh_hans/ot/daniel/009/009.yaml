base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/009.yaml
  text: To the Lord our God belong compassion and forgiveness[a], for we have rebelled against him.
translation:
  language: zh_hans
  text: 怜悯和赦免都属于主——我们的神；尽管我们背叛了他。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “怜悯”和“赦免”在希伯来原文中都是复数形式；这可以表示丰富，也可作抽象名词理解。
    reason: lexical_alternative
lexical_decisions:
- source_word: לַאדֹנָי אֱלֹהֵינוּ
  choice: 主我们的神有
  rationale: 介词 לְ 在无动词句中表达归属；汉语用“有”自然传达“属于主我们的神”。保留“主”和“我们的神”这两个相连的称谓。
- source_word: הָרַחֲמִים
  choice: 怜悯
  rationale: 原文为复数形式，但可用作抽象名词，表示丰盛的慈怜；“怜悯”是自然、庄重的现代汉语。
- source_word: וְהַסְּלִחוֹת
  choice: 赦免
  rationale: 原文为复数形式，并与“怜悯”并列；汉语抽象名词“赦免”既自然，也保留宽恕罪责的含义。
- source_word: כִּי
  choice: 因为
  rationale: 在这里引出说明性的理由，把神的怜悯与赦免同百姓承认背叛联系起来。
- source_word: מָרַדְנוּ בּוֹ
  choice: 我们背叛了他
  rationale: מרד 指反叛、背叛，而不只是一般性的犯罪；בּוֹ 表明背叛所针对的对象，汉语自然表达为“背叛了他”。
theological_decisions:
- issue: 神的称谓 אדני אֱלֹהֵינוּ
  choice: 主我们的神
  alternative: 我们的主、我们的神；主人我们的神
  rationale: אדני 在祷告中是对神的尊称，译作“主”庄重而自然；紧接“我们的神”，保留原文的盟约性称呼，不引入额外的教派含义。
- issue: 怜悯与赦免的归属
  choice: 主我们的神有怜悯和赦免
  alternative: 怜悯和赦免属于主我们的神
  rationale: 原文是以 לְ 表达归属的无动词句；“有”在现代汉语中简洁自然，同时没有把神的怜悯与赦免仅仅处理成一次行动。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语言。句式简洁，保留原文“神的怜悯和赦免—人的背叛”之间的张力；脚注说明两个复数名词可能具有的丰富性，而正文采用自然的汉语抽象名词。
