reference: Daniel 9:14
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יִּשְׁקֹ֤ד יְהוָה֙ עַל הָ֣/רָעָ֔ה וַ/יְבִיאֶ֖/הָ עָלֵ֑י/נוּ כִּֽי צַדִּ֞יק יְהוָ֣ה אֱלֹהֵ֗י/נוּ עַל כָּל מַֽעֲשָׂי/ו֙ אֲשֶׁ֣ר עָשָׂ֔ה וְ/לֹ֥א שָׁמַ֖עְנוּ בְּ/קֹלֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/014.yaml
  text: So Yahweh kept watch over the disaster and brought it upon us[a], for Yahweh our God is righteous in all the works that he has done[c][b], and we have not listened to his voice.
translation:
  language: zh_hans
  text: 因此，雅威留意[b]那灾祸[a]，使它临到我们；因为雅威我们的上帝在他所行的一切事上都是公义的，而我们没有听从他的话[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“使那灾难临到我们”。这里的希伯来词也可表示“恶”，但本节指审判所带来的灾祸。
    reason: lexical_alternative
  - marker: b
    text: “留意”所译的动词也可理解为“警醒关注”，或较具解释性地译为“迅速施行”。
    reason: lexical_alternative
  - marker: c
    text: “听从他的话”直译为“听他的声音”，含有照他所说的去行、顺服他的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁקֹד
  choice: 留意
  rationale: שׁקד含警醒、持续关注之意；在此表示雅威一直关注已经宣告的灾祸，直至使其临到百姓。“留意”保留这一意象，又比“加速”少一层解释。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文四字神名的通行学术拟音译出其专名，不以“主”这一称号替代，也不采用源自后期混合读法的“耶和华”。
- source_word: הָרָעָה
  choice: 那灾祸
  rationale: רָעָה在审判语境中指灾难、祸患，而非道德意义上的邪恶；“灾祸”既体现审判性质，也避免暗示上帝行了道德之恶。
- source_word: וַיְבִיאֶהָ עָלֵינוּ
  choice: 使它临到我们
  rationale: 准确表达使役形式以及阴性代词对“灾祸”的回指，符合现代汉语表达。
- source_word: צַדִּיק
  choice: 公义的
  rationale: 表达上帝所行合乎正义与正直；“公义”也保留本段的圣经伦理和盟约语域。
- source_word: עַל כָּל מַעֲשָׂיו אֲשֶׁר עָשָׂה
  choice: 在他所行的一切事上
  rationale: 将介词עַל理解为“就……而言／在……方面”，自然表达上帝的公义彰显在他一切作为中。
- source_word: וְלֹא שָׁמַעְנוּ בְּקֹלוֹ
  choice: 而我们没有听从他的话
  rationale: שׁמע בקול是听而顺从的固定表达；“听从他的话”兼顾听见与服从的含义，比直译“听他的声音”更自然。
theological_decisions:
- issue: רָעָה与上帝行动的关系
  choice: 那灾祸
  alternative: 那恶事／那灾难
  rationale: 此处所指是上帝按约施行的审判灾祸。译作“灾祸”保留上帝主动使其临到百姓的张力，同时不把道德邪恶归于上帝。
- issue: 上帝施行灾祸与其公义并列
  choice: 保留因果陈述：雅威使灾祸临到百姓，因为他所行的一切事都是公义的
  alternative: 弱化为上帝仅仅容许灾祸发生
  rationale: 希伯来文明确使用使役动词，并直接宣告上帝为公义；译文不以“容许”消解这项神学张力。
- issue: 百姓没有听从上帝
  choice: 而我们没有听从他的话
  alternative: 却没有顺服他
  rationale: 保留原文“听从声音／话语”的表达基础，同时让顺服之意清楚可辨；“而”体现语义上的对照，但不过度强化连接词。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“雅威”作为神名音译；句式保留希伯来文从灾祸、上帝的公义到百姓不顺服的论证推进。用“灾祸”而非“邪恶”，并以脚注保存词义范围；用“听从他的话”传达希伯来习语所含的顺服意义。
