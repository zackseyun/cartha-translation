revisions:
- from: 正如摩西律法中所写的，这一切灾祸都临到我们了；然而，我们仍没有恳求耶和华[a]我们上帝的恩待，离开我们的罪孽，并在你的真理中获得明悟。[b]
  to: 正如摩西律法中所写的，这一切灾祸都临到我们了；然而，我们仍没有恳求耶和华[a]——我们的上帝——施恩，转离我们的罪孽，并留心你的真理。[b]
  rationale: 修订仅处理中文搭配与句法清晰度：“恳求……施恩”自然对应向神求恩的希伯来惯用语；破折号避免“耶和华我们上帝”连续定语造成的歧义；“留心你的真理”使中文更流畅，并由脚注保留原文可指明悟、审慎及神之信实的空间。
