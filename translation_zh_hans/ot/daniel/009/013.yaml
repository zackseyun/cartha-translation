id: DAN.9.13
reference: Daniel 9:13
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כַּ/אֲשֶׁ֤ר כָּתוּב֙ בְּ/תוֹרַ֣ת מֹשֶׁ֔ה אֵ֛ת כָּל הָ/רָעָ֥ה הַ/זֹּ֖את בָּ֣אָה עָלֵ֑י/נוּ וְ/לֹֽא חִלִּ֜ינוּ אֶת פְּנֵ֣י יְהוָ֣ה אֱלֹהֵ֗י/נוּ לָ/שׁוּב֙ מֵֽ/עֲוֺנֵ֔/נוּ וּ/לְ/הַשְׂכִּ֖יל בַּ/אֲמִתֶּֽ/ךָ־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/013.yaml
  text: Just as it is written in the Law of Moses[a], all this calamity has come upon us[c][b], yet we have not sought the favor of Yahweh our God by turning from our iniquities and by gaining insight into your truth.
translation:
  language: zh_hans
  text: 正如摩西律法中所写的，这一切灾祸都临到我们了；然而，我们仍没有恳求耶和华[a]——我们的上帝——施恩，转离我们的罪孽，并留心你的真理。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “耶和华”译自希伯来文神名יהוה（YHWH）。
    reason: 说明正文所译的是专有神名，而非一般头衔。
  - marker: b
    text: “留心你的真理”也可译作“在你的真理中得明悟”或“因你的信实而得明悟”；原文动词兼有明白、留心和审慎行事的含义，“真理”一词也可表示“信实”。
    reason: 保留וּלְהַשְׂכִּיל בַּאֲמִתֶּךָ在动词、介词关系及名词语义上的真实弹性。
lexical_decisions:
- source_word: כַּאֲשֶׁר כָּתוּב
  choice: 正如……所写的
  rationale: 保留比较与应验式对应的语气，表明现今灾祸正与律法所载相符。
- source_word: בְּתוֹרַת מֹשֶׁה
  choice: 摩西律法中
  rationale: 此处指摩西律法传统；“律法”在现代中文中清楚、庄重，也符合上下文的圣约审判背景。
- source_word: אֵת כָּל הָרָעָה הַזֹּאת
  choice: 这一切灾祸
  rationale: רָעָה在此指临到百姓的灾难性审判，而非道德意义上的邪恶；“灾祸”保留其严重性。
- source_word: בָּאָה עָלֵינוּ
  choice: 都临到我们了
  rationale: 自然表达审判已经降临并构成当前处境；“了”体现完成后果。
- source_word: וְלֹא חִלִּינוּ אֶת פְּנֵי
  choice: 然而，我们仍没有恳求……的恩待
  rationale: חלה与“面”构成惯用语，意为恳求、求取恩惠；译出实际含义，同时以“恳求”保留祈求色彩。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名呈现四字神名，区别于头衔“主”。
- source_word: אֱלֹהֵינוּ
  choice: 我们上帝
  rationale: 直接保留第一人称复数所属关系和圣约称谓。
- source_word: לָשׁוּב מֵעֲוֺנֵנוּ
  choice: 离开我们的罪孽
  rationale: שׁוב表达转离，עָוֹן兼有罪责、罪孽之意；译文保留悔改的道德分量。
- source_word: וּלְהַשְׂכִּיל בַּאֲמִתֶּךָ
  choice: 并在你的真理中获得明悟
  rationale: הַשְׂכִּיל可指明白、审慎或行事有智慧；בַּאֲמִתֶּךָ的介词关系及אֱמֶת的“真理/信实”含义存在弹性，正文采用自然且不过度限定的表达，并以脚注保留可能性。
theological_decisions:
- issue: רָעָה作为神审判用语的译法
  choice: 灾祸
  alternative: 灾难；祸患；恶
  rationale: 上下文所指是按摩西律法临到群体的审判性灾难，不宜让中文读者误解为道德之恶，同时不削弱审判的严厉性。
- issue: 神名יְהוָה的呈现
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 原文使用专有圣名而非普通头衔；“耶和华”是现代标准中文中最广为人知且可直接识别的专名形式。
- issue: בַּאֲמִתֶּךָ与הַשְׂכִּיל的关系
  choice: 在你的真理中获得明悟
  alternative: 留心你的真理；因你的信实而明白；按你的真理行事明智
  rationale: 希伯来文可涉及理解、留意或明智行动，אֱמֶת也可指真理或信实。正文不将其收窄为纯智识理解或单一伦理行动，脚注保留语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。分号呈现“灾祸已临到”与“仍未恳求”之间的强烈反差；“然而……仍没有”自然表达וְלֹא在语境中的逆接意味。正文避免生硬直译“使耶和华的脸柔和”，转译为中文可理解的“恳求……的恩待”。
