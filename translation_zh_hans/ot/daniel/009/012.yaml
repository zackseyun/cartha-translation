  text: וַ/יָּ֜קֶם אֶת דברי/ו אֲשֶׁר דִּבֶּ֣ר עָלֵ֗י/נוּ וְ/עַ֤ל שֹֽׁפְטֵ֨י/נוּ֙ אֲשֶׁ֣ר שְׁפָט֔וּ/נוּ לְ/הָבִ֥יא עָלֵ֖י/נוּ רָעָ֣ה גְדֹלָ֑ה אֲשֶׁ֣ר לֹֽא נֶעֶשְׂתָ֗ה תַּ֚חַת כָּל הַ/שָּׁמַ֔יִם כַּ/אֲשֶׁ֥ר נֶעֶשְׂתָ֖ה בִּ/ירוּשָׁלִָֽם־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/012.yaml
  text: He has confirmed his words that he spoke against us and against our judges who judged us[a], by bringing upon us a great disaster such as had not been done under all heaven, as it was done in Jerusalem.
translation:
  language: zh_hans
  text: 他使自己针对我们和审判我们的审判官所说的话应验，把大灾祸降在我们身上；普天之下从未有过像在耶路撒冷所发生的这样的大灾祸。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקֶם
  choice: 使……所说的话应验
  rationale: 使役态的קום与“话”连用，表示使先前所说的成立、实现；“应验”自然表达所宣告的审判成为事实。
- source_word: דבריו אֲשֶׁר דִּבֶּר עָלֵינוּ
  choice: 他向我们……所说的话
  rationale: 保留“他的话”的内容关系；על在审判语境中带有不利于“我们”的含义，但中文由“灾祸”和“应验”已清楚体现，无须生硬译作“攻击我们”。
- source_word: שֹׁפְטֵינוּ אֲשֶׁר שְׁפָטוּנוּ
  choice: 审判我们的审判官
  rationale: 保留名词与动词同根的修辞重复；שפט也可泛指治理，因此另以脚注说明较宽的职权含义。
- source_word: לְהָבִיא עָלֵינוּ
  choice: 把……降在我们身上
  rationale: 不定式说明上帝使其话应验的方式或结果；“降在……身上”符合现代汉语中灾祸临到人的表达。
- source_word: רָעָה גְדֹלָה
  choice: 大灾祸
  rationale: רעה在此指审判所带来的灾难，而非道德意义上的邪恶；“大灾祸”准确、凝练。
- source_word: תַּחַת כָּל הַשָּׁמַיִם
  choice: 普天之下
  rationale: 采用自然庄重的汉语成语，表达希伯来语“全天下”的范围。
- source_word: כַּאֲשֶׁר נֶעֶשְׂתָה בִּירוּשָׁלָם
  choice: 像在耶路撒冷所发生的事
  rationale: 以自然汉语保留被动式所指的事件，并使其与前述空前的灾祸形成比较。
theological_decisions:
- issue: 全节隐含主语的所指
  choice: 以“他”指上帝，不在正文补出“上帝”
  alternative: 明确译作“上帝使……”
  rationale: 上下文的祷告清楚表明行动者是上帝，但本节希伯来文仅用隐含的第三人称主语；保留“他”既忠于文体，也不消除上下文关系。
- issue: 官长职能的范围
  choice: 正文保留“审判官”及“审判”的同根重复，并用脚注提示可泛指治理者
  alternative: 正文译作“治理我们的官长”
  rationale: שפט既可指司法审判，也可指施行治理。正文保留词形重复，脚注则保存其较宽的政治含义，避免把所指限定为现代法庭法官。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“使……所说的话应验”清楚表达宣告成为事实；“普天之下”保留经文的宏阔语气。正文刻意保留“审判我们的审判官”的同根重复，虽略带希伯来语色彩，但仍可理解，并由脚注说明其较广含义。
