    issue: “他向我们和审判我们的审判官所说的话”未体现“针对我们和……所说”的不利、审判性方向。
    rationale: 希伯来语דבר + על在本句的审判语境中是向对象宣告不利之事；汉语“向……所说”容易理解为单纯对其说话。
  - severity: medium
    issue: 末句以“事”作比较对象，未明确其为“大灾祸”。
    rationale: אשר לא נעשתה……כאשר נעשתה בירושלים的阴性形式回指前面的“灾祸”；中文应明确空前的是这场灾祸，而非任何泛指事件。
