source:
  edition: WLC
  text: שָׁבֻעִ֨ים שִׁבְעִ֜ים נֶחְתַּ֥ךְ עַֽל עַמְּ/ךָ֣ וְ/עַל עִ֣יר קָדְשֶׁ֗/ךָ לְ/כַלֵּ֨א הַ/פֶּ֜שַׁע ו/ל/חתם חטאות וּ/לְ/כַפֵּ֣ר עָוֺ֔ן וּ/לְ/הָבִ֖יא צֶ֣דֶק עֹֽלָמִ֑ים וְ/לַ/חְתֹּם֙ חָז֣וֹן וְ/נָבִ֔יא וְ/לִ/מְשֹׁ֖חַ קֹ֥דֶשׁ קָֽדָשִֽׁים־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/024.yaml
  text: 'Seventy weeks are decreed concerning your people and your holy city: to finish the transgression[a], to seal up sins, to make atonement for iniquity, to bring in everlasting righteousness, to seal up vision and prophet[d][c][b], and to anoint the most holy place.'
translation:
  language: zh_hans
  text: 关于你的子民和你的圣城，已定下七十个“七”[a]：要终止悖逆，封住诸罪[b]，为罪孽赎罪，带来永恒的公义，封住异象和先知[c]，并膏抹至圣之处[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“七十个七”；这里的“七”指由七构成的单位。许多人把它理解为七十个七年期。
    reason: 保留期限单位的词义歧义，避免在正文中加入原文未明说的“年”。
  - marker: b
    text: “封住诸罪”也可理解为“使诸罪止息”。
    reason: 说明“封住”的盖印隐喻在本语境中可能包含终止之意。
  - marker: c
    text: 希伯来文作“异象和先知”；也有人理解为“异象和预言”。“封住”在这里也可能含有使之完成或得到证实的意思。
    reason: 保留马所拉文本的具体名词“先知”，同时交代常见的语义理解。
  - marker: d
    text: “至圣之处”也可译为“至圣之物”；有人把这短语理解为“一位至圣者”。
    reason: 原短语可指至圣的地方或事物，其是否具有个人所指存在解释分歧。
lexical_decisions:
- source_word: שָׁבֻעִים שִׁבְעִים
  choice: 七十个“七”
  rationale: שָׁבוּעַ表示由七构成的周期。中文若直译为“七十周”容易被理解为普通的七日周，若译作“七十个七年”又会把经文本身未明说的“年”写入正文；“七十个‘七’”保留了单位的开放性，并以脚注说明常见理解。
- source_word: נֶחְתַּךְ
  choice: 已经定下
  rationale: 此处Niphal形式表达已被决定、划定或分配。“已经定下”自然清楚，也保留了这一安排具有确定性的语气。
- source_word: עַל עַמְּךָ וְעַל עִיר קָדְשֶׁךָ
  choice: 为你的人民和你的圣城
  rationale: 介词עַל在这里标明所定期限涉及或针对的对象；“为”符合汉语表达，同时没有把其意义限制为单纯的受益关系。
- source_word: לְכַלֵּא הַפֶּשַׁע
  choice: 要终止悖逆
  rationale: 动词在此有完成、结束之意；定冠词和单数形式由“悖逆”这一集合性表达体现。“终止”准确传达使其到达尽头的目的。
- source_word: וְלַחְתֹּם חטאות
  choice: 封住诸罪
  rationale: חתם的基本意象是盖印、封住；“封住”保留隐喻及其可能包含的终结、关闭之意。“诸罪”体现复数而不显累赘。
- source_word: וּלְכַפֵּר עָוֺן
  choice: 为罪孽赎罪
  rationale: כפר是表示赎罪的核心动词，可包含洁除和遮盖等祭祀语义。“为罪孽赎罪”保留神学分量，却不额外规定赎罪的具体机制。
- source_word: וּלְהָבִיא צֶדֶק עֹלָמִים
  choice: 带来永恒的公义
  rationale: הביא意为带来、引入；צדק在此为公义，עֹלָמִים强调恒久延续。“永恒的公义”简明而庄重。
- source_word: וְלַחְתֹּם חָזוֹן וְנָבִיא
  choice: 封住异象和先知
  rationale: 马所拉文本明确读作נָבִיא“先知”，而不是抽象名词“预言”。正文据原文保留“异象和先知”，并在脚注列出语义上常见的另一理解。
- source_word: וְלִמְשֹׁחַ קֹדֶשׁ קָדָשִׁים
  choice: 膏抹至圣之处
  rationale: משׁח直译为膏抹。קֹדֶשׁ קָדָשִׁים通常指至圣的地方或物件；结合圣城语境，正文采用自然的“至圣之处”，但以脚注保留指至圣者或至圣之物的可能。
theological_decisions:
- issue: קֹדֶשׁ קָדָשִׁים的所指
  choice: 至圣之处
  alternative: 至圣之物；一位至圣者
  rationale: 该希伯来语短语常用于圣所空间或分别为圣之物，原文却没有在此明确说明具体所指。正文采用语境中较自然的地点理解，脚注保留非地点及人物性理解，不将特定弥赛亚解释直接写入正文。
- issue: שָׁבֻעִים所表示的期限单位
  choice: 七十个“七”
  alternative: 七十周；七十个七年期
  rationale: 原词表示由七构成的周期，本节没有明说这些周期以日还是年计算。正文保持开放，脚注说明常见的“年期”理解。
- issue: “封住异象和先知”的含义
  choice: 按字面保留“异象和先知”
  alternative: 封住异象和预言；使异象和先知得到证实
  rationale: “先知”是马所拉文本的直接读法，而“封住”可能表达终结、封存或认证。正文不替经文选择某一种神学实现方式，脚注仅说明语言上的可能理解。
translation_notes:
  register: 采用现代、庄重而可朗读的普通话。句子以冒号引出六项目的，保持希伯来文的平行结构；“悖逆—诸罪—罪孽”分别对应三个不同词项，不将其合并。“封住”两次重复，以保留原文的词汇呼应。
