  naturalness: 原译前半句关系结构过长，且“临到……时所说的”不够自然。改为“雅威临到先知耶利米的话所论及的年数”可清楚表达修饰关系，同时保持庄重、现代的叙述语体。
  terminology: “雅威”“先知耶利米”“书卷”均合宜。“耶路撒冷的荒凉将满七十年”自然表达原文以期限完成为焦点的意思，不补出完成者，也不将其狭窄化为单指物质废墟。
