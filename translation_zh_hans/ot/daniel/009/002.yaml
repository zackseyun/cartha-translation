base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/002.yaml
  text: 'In the first year of his reign[a], I, Daniel, understood from the books the number of the years about which the word of Yahweh had come to Jeremiah the prophet, for the completion of the desolations of Jerusalem: seventy years.'
translation:
  language: zh_hans
  text: 他作王第一年，我但以理从书卷[a]中明白了雅威临到先知耶利米的话所论及的年数，就是耶路撒冷的荒凉将满七十年。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “书卷”也可译作“书籍”。希伯来词可泛指书写的文献；此处所指文献在古代通常以卷轴形式保存。
    reason: cultural_note
lexical_decisions:
- source_word: בִּשְׁנַת אַחַת לְמָלְכוֹ
  choice: 他作王第一年
  rationale: 希伯来语以基数词表达序数意义，指他在位的第一年；这样译简洁自然，也保留代词所指由上下文确定。
- source_word: בִּינֹתִי בַּסְּפָרִים
  choice: 我……从经卷中明白了
  rationale: בין 在此表示领会、明白；介词 ב 可表达凭借或来源，因此译为“从经卷中”。סְפָרִים 泛指书写文献，在古代语境中通常是卷轴形式。
- source_word: מִסְפַּר הַשָּׁנִים
  choice: 所说的年数
  rationale: 这里指启示中指定的年数；“年数”保留原文对具体年限总数的强调，并用关系结构使汉语通顺。
- source_word: דְבַר יְהוָה
  choice: 雅威的话
  rationale: 将四字神名 יְהוָה 音译为“雅威”，而不以称号替代；“话”符合先知启示的语境。
- source_word: אֶל יִרְמִיָה הַנָּבִיא
  choice: 临到先知耶利米
  rationale: “话临到某人”保留希伯来先知文献的惯用表达，同时在现代汉语中清楚庄重。
- source_word: לְמַלֹּאות לְחָרְבוֹת יְרוּשָׁלִַם שִׁבְעִים שָׁנָה
  choice: 耶路撒冷荒凉要满七十年
  rationale: “满”表达 מלא 达到完整期限的含义；“荒凉”比“废墟”范围更广，也保留 חָרְבוֹת 所指的毁坏、荒废状态。该句不额外指定由谁使期限满足。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。音译“雅威”保留其作为专名的性质，避免以“主”这一称号取代；“耶和华”是传统音译，但较不贴近通常重构的读音。
- issue: לְמַלֹּאות 与耶路撒冷荒凉期的关系
  choice: 耶路撒冷荒凉要满七十年
  alternative: 使耶路撒冷的荒凉应验；耶路撒冷荒凉的期限完成
  rationale: “要满七十年”突出原文的时间焦点，又不擅自补出使其成就的主体，也不把 מלא 限定为某种特定的神学性“应验”。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。“我但以理”保留原文自称的强调；句末用冒号引出但以理所明白的具体年限。脚注标记置于“经卷”之后，以准确对应注释对象。
