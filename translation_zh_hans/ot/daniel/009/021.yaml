  text: וְ/ע֛וֹד אֲנִ֥י מְדַבֵּ֖ר בַּ/תְּפִלָּ֑ה וְ/הָ/אִ֣ישׁ גַּבְרִיאֵ֡ל אֲשֶׁר֩ רָאִ֨יתִי בֶ/חָז֤וֹן בַּ/תְּחִלָּה֙ מֻעָ֣ף בִּ/יעָ֔ף נֹגֵ֣עַ אֵלַ֔/י כְּ/עֵ֖ת מִנְחַת עָֽרֶב־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/021.yaml
  text: while I was still speaking in prayer[a], the man Gabriel, whom I had seen in the vision at the beginning, came to me in swift flight at the time of the evening offering.
translation:
  language: zh_hans
  text: 我还在祷告中说话时，我起初在异象中所见的那人加百列，迅速飞到我这里[a]，正是献晚祭的时候。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“疲惫不堪地前来”或“在疲惫中前来”，但这种解释的可能性较小。这里的希伯来语短语含义难定。
    reason: 保留מֻעָף בִּיעָף的另一种词义及句法分析，避免消除原文的歧义。
lexical_decisions:
- source_word: וְעוֹד אֲנִי מְדַבֵּר בַּתְּפִלָּה
  choice: 我还在祷告中说话的时候
  rationale: 保留“说话”与“祷告”两个要素，并以现代汉语自然表达持续动作与随后事件同时发生。
- source_word: הָאִישׁ גַּבְרִיאֵל
  choice: 那人加百列
  rationale: 原文称加百列为“那人”，体现异象中人的形貌，不因其使者身份而改译为“天使”。
- source_word: אֲשֶׁר רָאִיתִי בֶחָזוֹן בַּתְּחִלָּה
  choice: 先前我在异象中见过的
  rationale: בַּתְּחִלָּה直译可作“起初”，这里回指此前的异象；“先前”在汉语中自然，同时保留时间上的回指。
- source_word: מֻעָף בִּיעָף
  choice: 迅速飞来
  rationale: 采用传统且较符合来临语境的飞行义；原短语艰涩，另有“疲惫”解释，故以脚注保留。
- source_word: נֹגֵעַ אֵלַי
  choice: 来到我这里
  rationale: נגע可指触及或到达；本句重点是加百列抵达但以理所在之处，因此译作“来到我这里”，避免无把握地具体化为身体接触。
- source_word: כְּעֵת מִנְחַת עָרֶב
  choice: 在献晚祭的时候
  rationale: מִנְחָה可指供物，亦可特指素祭；此处主要标示固定献祭时刻，“晚祭”简洁且不把祭物种类限定过窄。
theological_decisions:
- issue: מֻעָף בִּיעָף所描述的加百列状态或动作
  choice: 加百列迅速飞来
  alternative: 加百列疲惫不堪地前来／在疲惫中前来
  rationale: 该希伯来短语在词形和语义上艰涩。上下文描述加百列在但以理祷告时来到，传统理解为快速飞行；正文采用此义，同时以脚注保留“疲惫”的可能解释，不消除原文的不确定性。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“祷告中说话”略保留原文表达，“那人加百列”保留异象叙述的人的形貌；全句调整为符合汉语时序与修饰习惯的结构。
