  text: בִּ/תְחִלַּ֨ת תַּחֲנוּנֶ֜י/ךָ יָצָ֣א דָבָ֗ר וַ/אֲנִי֙ בָּ֣אתִי לְ/הַגִּ֔יד כִּ֥י חֲמוּד֖וֹת אָ֑תָּה וּ/בִין֙ בַּ/דָּבָ֔ר וְ/הָבֵ֖ן בַּ/מַּרְאֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/023.yaml
  text: At the beginning of your pleas[a], a word went out, and I have come to tell it, because you are greatly beloved[b]. So consider the word and understand the vision.
translation:
  language: zh_hans
  text: 你开始恳求的时候，就有话发出；我来是要把这话告诉你，因为你是极蒙爱的人[a]。所以，你要留心这话，明白这异象。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你极受珍视。”希伯来语表达但以理格外珍贵、蒙爱或受重视。
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּתְחִלַּת תַּחֲנוּנֶיךָ
  choice: 你开始恳求的时候
  rationale: 以自然现代汉语表达时间起点；“恳求”保留 תַּחֲנוּנִים 所含恳切祈求的意味。
- source_word: יָצָא דָבָר
  choice: 就有话发出
  rationale: 保留 דָבָר 的“话”以及 יָצָא 的“发出”意象，不将其过度限定为命令、旨意或答复。
- source_word: וַאֲנִי בָּאתִי לְהַגִּיד
  choice: 我来是要把这话告诉你
  rationale: 补出前文“这话”作为语境中的内容，并补出汉语所需的受事“你”，清楚表达来访目的。
- source_word: חֲמוּדוֹת אָתָּה
  choice: 你是极蒙爱的人
  rationale: 该强调性表达可指珍贵、可爱或受重视；“极蒙爱”在本语境中自然地体现特殊眷爱，同时不引入额外教义。
- source_word: וּבִין בַּדָּבָר
  choice: 所以，你要留心这话
  rationale: בין 在此要求辨明、领会；译作“留心”能与下一句“明白”区分，又保留认真思量的命令语气。
- source_word: וְהָבֵן בַּמַּרְאֶה
  choice: 明白这异象
  rationale: מַרְאֶה 在《但以理书》的语境中指异象；“明白”直接传达命令Daniel理解其内容。
theological_decisions:
- issue: חֲמוּדוֹת אָתָּה 所表达的但以理在上帝面前的地位
  choice: 你是极蒙爱的人
  alternative: 你极受珍视
  rationale: “极蒙爱”保留关系性的眷爱意味；脚注列出“极受珍视”，以保存希伯来语在“蒙爱”与“珍贵、受重视”之间的语义幅度，而不把它教义化。
- issue: יָצָא דָבָר 的性质
  choice: 有话发出
  alternative: 有信息发出／有命令颁出
  rationale: 正文保留希伯来语的宽泛措辞，不武断判定这是口传信息、答复还是正式命令。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“恳求”比“祈求”更突出迫切感；“有话发出”有意保留原文略显凝练的措辞及其歧义；两个相邻命令分别译为“留心”和“明白”，避免中文机械重复，同时呈现从认真领会到理解异象的推进。
