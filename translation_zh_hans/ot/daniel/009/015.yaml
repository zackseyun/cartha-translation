revisions:
- from: 现在，主我们的上帝啊，你曾用大能的手领你的子民出了埃及地，并为自己赢得了名声，正如今日一样。我们犯了罪，行了恶。
  to: 如今，主啊，我们的上帝，你曾以大能的手将你的子民从埃及地领出来，为自己赢得了名声，直到今日；我们犯了罪，行了恶。
  rationale: 修订仅改善现代汉语的呼告语序、动词搭配和时间短语的可读性。保留原文的第二人称祷告语气、出埃及典故、神圣能力的“手”这一意象、上帝得名的习语，以及“犯罪／作恶”两个并列认罪动词。无需增设脚注。
