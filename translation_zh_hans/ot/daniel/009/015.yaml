base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/015.yaml
  text: And now[a], O Lord our God, who brought your people out of the land of Egypt with a strong hand and made for yourself a name, as it is this day—we have sinned[c][b]; we have acted wickedly.
translation:
  language: zh_hans
  text: 如今，主啊，我们的上帝，你曾以大能的手将你的子民从埃及地领出来，为自己赢得了名声，直到今日；我们犯了罪，行了恶。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲדֹנָי אֱלֹהֵינוּ
  choice: 主我们的上帝啊
  rationale: 保留祷告中的呼格和复数领属关系；这一表达庄重而清楚，避免把 אֲדֹנָי 误作独立的人名。
- source_word: הוֹצֵאתָ אֶת עַמְּךָ מֵאֶרֶץ מִצְרַיִם
  choice: 你曾……领你的子民出了埃及地
  rationale: 使役形 הוֹצֵאתָ 表示“带出、领出”；“领……出了”既自然，也保留出埃及事件的固定意象。
- source_word: בְּיָד חֲזָקָה
  choice: 用大能的手
  rationale: 保留希伯来文“手”的形象和出埃及传统中的固定表达；חֲזָקָה 在此侧重强大有力，译作“大能的”符合现代汉语圣经语域。
- source_word: וַתַּעַשׂ לְךָ שֵׁם
  choice: 并为自己赢得了名声
  rationale: 该习语表示建立名声、获得声望；“赢得了名声”自然传达其意义，同时保留“为自己”的反身结构。
- source_word: כַּיּוֹם הַזֶּה
  choice: 正如今日一样
  rationale: 保留原文比较式表达及其时间指向，不将其完全解释为“直到今日”；所指是上帝的名声在说话者当下仍为人所知。
- source_word: חָטָאנוּ רָשָׁעְנוּ
  choice: 我们犯了罪，行了恶
  rationale: 以两个并列动词分别对应“犯罪”和“作恶”，保留认罪祷告中的累加强调和道德力度。
theological_decisions:
- issue: 出埃及典故与上帝名声的关系
  choice: 保留“用大能的手”“出了埃及地”的出埃及公式，并将“为自己造名”译为“为自己赢得了名声”。
  alternative: 意译为“以大能拯救你的子民脱离埃及，使你声名远扬”。
  rationale: 原文借救赎历史申诉上帝公开彰显的能力与名声；保留核心意象可维持经文间的联系，同时避免生硬照译“为自己造了一个名”。
- issue: כַּיּוֹם הַזֶּה 的时间意义
  choice: 译作“正如今日一样”，保留比较式及一定的开放性。
  alternative: 译作“直到今日”，明确表达持续至今。
  rationale: 该短语可强调当下可见的事实，也可能含有延续至今之意；正文不把这种张力单一化。
translation_notes:
  register: 采用现代、庄重而可朗读的祷告语言。“主我们的上帝啊”保留呼告语气；句号划开上帝昔日作为与会众当下认罪，使汉语结构清晰。
