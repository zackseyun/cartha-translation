    rationale: 该希伯来固定表达指上帝所得名声延续至说话者的当下；“直到今日”是自然、常用的汉语表达，不涉及额外教义性解释。
  revised_text: 如今，主啊，我们的上帝，你曾以大能的手将你的子民从埃及地领出来，为自己赢得了名声，直到今日；我们犯了罪，行了恶。
