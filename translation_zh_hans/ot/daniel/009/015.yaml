    rationale: “主我们的上帝啊”在现代标准汉语中缺少自然停顿，容易读作不通顺的名词串；“主啊，我们的上帝”既保留 אֲדֹנָי אֱלֹהֵינוּ 的呼告和领属，也更适于朗读。
  - severity: low
    issue: “领你的子民出了埃及地”略显拗口
    rationale: 将宾语和来源处所调整为“将你的子民从埃及地领出来”，可清楚对应“带领你的子民离开埃及地”，不改变原文的使役动作或出埃及意象。
  - severity: low
