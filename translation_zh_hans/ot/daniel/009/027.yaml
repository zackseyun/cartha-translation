base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/027.yaml
  text: And he will make a firm covenant with the many for one week[a], and for half of the week he will put a stop to sacrifice and offering. And on the wing of abominations will come one who makes desolate[e][d][c][b], until the decreed end is poured out on the desolator.
translation:
  language: zh_hans
  text: 他必使与众人所立的盟约坚固，历时一个七[a]；这一个七过了一半，他必使祭牲和供物止息[b]。在可憎之物的翼上[c]，必有施行荒凉者[d]，直到那已定的终局倾倒在施行荒凉者身上[e]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“一个七期”。希伯来语直译为“一个七”，指由七个单位组成的周期；本句没有明说每个单位是日、年，还是别的时段。
    reason: lexical_alternative
  - marker: b
    text: “供物”也可更具体地译为“素祭”。
    reason: lexical_alternative
  - marker: c
    text: 希伯来语直译“在可憎之物的翼上”。此语十分难解；也有人译作“在可憎之物的顶端”或“在可憎之物的一翼上”。
    reason: alternative_reading
  - marker: d
    text: 或译“荒凉者”或“造成荒凉的”。原文没有明确补出其来到或出现的动词。
    reason: lexical_alternative
  - marker: e
    text: 末句也可译为“倾倒在那被荒凉者身上”或“倾倒在荒凉之地”。原文文本稳定，但句法和末词所指存在争议。
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִגְבִּיר
  choice: 使……坚立
  rationale: 使役式表达“使之强固、使之有力或占优势”。“使盟约坚立”保留使役含义，也不预设这是确认既有盟约还是另立盟约。
- source_word: בְּרִית
  choice: 盟约
  rationale: 该词在圣经希伯来语中具有郑重的立约含义；“盟约”比一般的“协议”更能保留其分量。
- source_word: לָרַבִּים
  choice: 与众人
  rationale: 介词 ל 在此可有不同理解；结合“盟约”，译作“与众人”较自然，并保留 רבים 所指的群体性。
- source_word: שָׁבוּעַ אֶחָד
  choice: 一个七
  rationale: שָׁבוּעַ 指由七个单位构成的周期；直译“一个七”可避免中文“一个星期”误导读者把它限定为七天，并保留本段的象征性与时间单位的开放性。
- source_word: וַחֲצִי הַשָּׁבוּעַ
  choice: 到了这一个七的一半
  rationale: 保留“一半”的形式，同时以“到了”自然表达事件发生的时间点；不进一步解释该周期的具体长度。
- source_word: יַשְׁבִּית
  choice: 使……止息
  rationale: שבת 的使役式意为“使停止”；此译既保留使役语气，又符合庄重的现代中文。
- source_word: זֶבַח וּמִנְחָה
  choice: 祭牲和供物
  rationale: זֶבַח 着重被宰献的祭牲，מִנְחָה 可泛指供物，也常特指素祭；正文采用较宽泛而清楚的对应，具体义置于脚注。
- source_word: וְעַל כְּנַף שִׁקּוּצִים
  choice: 在可憎之物的翼上
  rationale: כָּנָף 的基本义是“翼”，整句极为疑难。正文保留原有隐喻和语法张力，不武断改译为建筑意义的“顶端”或“殿翼”。
- source_word: מְשֹׁמֵם
  choice: 那使地荒凉者
  rationale: 该阳性单数分词表示造成荒凉者。“使地荒凉者”保留主动、持续的分词力量；其中“地”是为中文通顺所作的最小补足，并不限定为某一特定地点。
- source_word: וְעַד כָּלָה וְנֶחֱרָצָה
  choice: 直到所定的结局
  rationale: 两个词合起来表达一个已被决定的终局或彻底结局；此译简洁地保留“结局”与“定意”两层含义。
- source_word: תִּתַּךְ
  choice: 倾倒
  rationale: נתך 在此表示倾泻、倾倒，常用于审判语境；不在正文补出“忿怒”等原文未明说的宾语。
- source_word: עַל שֹׁמֵם
  choice: 在那使地荒凉者身上
  rationale: 阳性单数形式最直接可理解为施行荒凉的主体；同时在脚注保留“被荒凉者”或“荒凉之地”等语法可能。
theological_decisions:
- issue: 本节连续出现之隐含主语“他”的身份
  choice: 仅译作“他”，不指明其身份
  alternative: 受膏者、上一节将要来的领袖、安条克四世、提多或末世敌对者
  rationale: 希伯来文本本节没有明说先行词，各传统对此分歧显著；翻译不应把某一历史或末世解释写入正文。
- issue: כְּנַף שִׁקּוּצִים 的含义
  choice: 按字面译为“可憎之物的翼”
  alternative: 可憎之物的顶端、可憎之事的极处、带着可憎之物
  rationale: 此短语在词义和句法上都很困难。保留“翼”最能呈现原文隐喻及其不确定性，其他解释列入脚注。
- issue: 末句 שֹׁמֵם 的所指
  choice: 译作主动意义的“那使地荒凉者”
  alternative: 被荒凉者或荒凉之地
  rationale: 阳性单数分词在形态上较自然地指施行荒凉者，但句法仍有争议，因此正文采用最直接读法，脚注说明其他可能。
- issue: “一个七”的具体时间长度
  choice: 不解释其具体年数或日数
  alternative: 一个星期、七年或象征性的七期
  rationale: 上下文以“七”为时间结构，但本节自身并未把单位直接说成日或年；正文保留这种开放性。
translation_notes:
  register: 采用庄重、现代而易懂的普通话。“盟约、祭牲、供物、止息、倾倒”等词保持经文语体但不过度古雅。对“一个七”“可憎之物的翼”等关键难语采取形式较贴近原文的表达，并用脚注帮助普通读者理解，而不在正文中消除原有歧义。
