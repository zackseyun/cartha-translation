source:
  edition: WLC
  text: וְ/אַחֲרֵ֤י הַ/שָּׁבֻעִים֙ שִׁשִּׁ֣ים וּ/שְׁנַ֔יִם יִכָּרֵ֥ת מָשִׁ֖יחַ וְ/אֵ֣ין ל֑/וֹ וְ/הָ/עִ֨יר וְ/הַ/קֹּ֜דֶשׁ יַ֠שְׁחִית עַ֣ם נָגִ֤יד הַ/בָּא֙ וְ/קִצּ֣/וֹ בַ/שֶּׁ֔טֶף וְ/עַד֙ קֵ֣ץ מִלְחָמָ֔ה נֶחֱרֶ֖צֶת שֹׁמֵמֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/026.yaml
  text: And after the sixty-two weeks[a], an anointed one will be cut off and will have nothing. And the city and the sanctuary the people of the coming ruler will destroy. Its end will come with a flood, and until the end there will be war[d][c][b]; desolations are decreed.
translation:
  language: zh_hans
  text: 六十二个七之后，一位受膏者[a]必被剪除，一无所有[b]。那将要来的统治者[c]的人民必毁灭这城和圣所。其结局[d]必随洪水而来；直到末了，必有战争；荒凉已经命定。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“弥赛亚”。希伯来文直译为“一位受膏者”；这里是否特指弥赛亚，解释者意见不一。
    reason: alternative_reading
  - marker: b
    text: 也可理解为“没有什么归他”或“无人支持他”。希伯来文这一短语十分简略，含义不确定。
    reason: lexical_alternative
  - marker: c
    text: 或译“一个将要来的领袖的人民”。
    reason: lexical_alternative
  - marker: d
    text: 原文为“其结局”；这个代词的所指存在争议，也可理解为“他的结局”。
    reason: alternative_reading
lexical_decisions:
- source_word: אַחֲרֵי הַשָּׁבֻעִים שִׁשִּׁים וּשְׁנַיִם
  choice: 六十二个七之后
  rationale: שָׁבוּעַ本义是由七构成的周期；在但以理书的语境中译作“七”可保留时间单位的开放性，避免让现代读者自然地限定为七天的一周。
- source_word: יִכָּרֵת
  choice: 必被剪除
  rationale: 保留כרת在被动语态中的强烈意象，可表达遭到除灭、断绝或暴力死亡，而不进一步限定具体方式。
- source_word: מָשִׁיחַ
  choice: 一位受膏者
  rationale: 原词无冠词，可泛指一位受膏的人；此译不预先断定其特定身份，同时以脚注保留“弥赛亚”的传统理解。
- source_word: וְאֵין לוֹ
  choice: 一无所有
  rationale: 以简洁自然的中文传达其遭受彻底剥夺的可能含义；原文所缺的是财物、权利还是支持者并不明确，故在脚注中保留其他理解。
- source_word: הָעִיר וְהַקֹּדֶשׁ
  choice: 这城和圣所
  rationale: “圣所”准确表达此处的神圣区域或圣殿，并与前面的城并列。
- source_word: יַשְׁחִית
  choice: 必毁灭
  rationale: שׁחת的使役形在此表示使城和圣所败坏、毁灭；“毁灭”清楚而有力度。
- source_word: עַם נָגִיד הַבָּא
  choice: 那将要来的统治者的人民
  rationale: נָגִיד表示掌权者或领袖；“统治者”是现代中文的自然表达，הַבָּא则译出其限定性的“将要来的”。
- source_word: וְקִצּוֹ בַשֶּׁטֶף
  choice: 它的结局必随洪水而来
  rationale: 保留洪水的形象和第三人称单数后缀，同时不在正文中武断确定代词所指；脚注说明也可理解为“他的结局”。
- source_word: וְעַד קֵץ מִלְחָמָה
  choice: 战争必持续到末了
  rationale: 按马所拉重音和简略句法，以自然中文表达战争延续至终局。
- source_word: נֶחֱרֶצֶת שֹׁמֵמוֹת
  choice: 荒凉的事已经定了
  rationale: נֶחֱרֶצֶת表达已经决定、命定；שֹׁמֵמוֹת为复数形式，指造成荒凉的事或荒凉状态，中文用集合性表述保持庄重流畅。
theological_decisions:
- issue: מָשִׁיחַ是否应在正文中明确译为“弥赛亚”
  choice: 正文译作“一位受膏者”
  alternative: 弥赛亚
  rationale: 原词无冠词，词义本身可指一般的受膏者，而本节所指身份历来有争议；正文采用词汇上透明的译法，并用脚注保留弥赛亚式理解。
- issue: וְאֵין לוֹ具体表示何种缺失
  choice: 一无所有
  alternative: 没有什么归他；无人支持他
  rationale: 原文极其简略，可能涉及产业、权利、支持或生命被剥夺；译文不把它限定为某一种神学解释。
- issue: וְקִצּוֹ中第三人称后缀的所指
  choice: 译作“它的结局”，不明确锁定先行词
  alternative: 他的结局
  rationale: 后缀可能指城、毁灭事件或将要来的统治者；保留代词并以脚注呈现另一种主要理解。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“被剪除”“圣所”“已经定了”保留先知文学的凝练和肃穆；“六十二个七”避免把שָׁבוּעַ过早限定为普通的七日周。脚注标记依相关词句顺序置于正文。
