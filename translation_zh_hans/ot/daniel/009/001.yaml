  naturalness: “大流士出自玛代人的后裔”不自然且语义不够准确；改为同位语式的“他是玛代人的后裔”清楚自然。将“被立为王，统治……”改为“被立为……的王”，能更紧密对应原文“被立为王，治理……之国”的关系。
