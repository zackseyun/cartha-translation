  text: בִּ/שְׁנַ֣ת אַחַ֗ת לְ/דָרְיָ֛וֶשׁ בֶּן אֲחַשְׁוֵר֖וֹשׁ מִ/זֶּ֣רַע מָדָ֑י אֲשֶׁ֣ר הָמְלַ֔ךְ עַ֖ל מַלְכ֥וּת כַּשְׂדִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/001.yaml
  text: In the first year of Darius son of Ahasuerus[a], of the offspring of the Medes, who was made king over the kingdom of the Chaldeans—
translation:
  language: zh_hans
  text: 亚哈随鲁之子大流士元年；他是玛代人的后裔，被立为迦勒底人王国的王[a]——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“巴比伦人的王国。”原文作“迦勒底人的王国”；在这里，这一称呼也可指巴比伦王国。
    reason: 保留原文族名，同时说明其在本语境中可作为巴比伦王国的称呼。
lexical_decisions:
- source_word: בִּשְׁנַת אַחַת לְדָרְיָוֶשׁ
  choice: 大流士元年
  rationale: 这是君王纪年的惯用表达；译作“元年”既准确又符合现代汉语的历史叙述习惯。
- source_word: בֶּן אֲחַשְׁוֵרוֹשׁ
  choice: 亚哈随鲁之子
  rationale: בֶּן 在此明确表示父子关系；人名采用通行的中文圣经音译。
- source_word: מִזֶּרַע מָדָי
  choice: 出自玛代人的后裔
  rationale: זֶרַע 在此指血统、族裔渊源，而非字面意义的“种子”；“后裔”保留了谱系含义。
- source_word: הָמְלַךְ
  choice: 被立为王
  rationale: 该词为使役被动形态，表示大流士被赋予王位；“被立为王”保留了原文的被动意味。
- source_word: עַל מַלְכוּת כַּשְׂדִּים
  choice: 统治迦勒底人的国
  rationale: עַל 表示治理的对象，מַלְכוּת 指王国或国度；כַּשְׂדִּים 按其希伯来文族名称直译为“迦勒底人”。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。首句用“元年”呈现君王纪年公式；重复“大流士”以避免连续修饰造成指代含混。句末保留破折号，因为本节的时间背景在下一节继续展开。
