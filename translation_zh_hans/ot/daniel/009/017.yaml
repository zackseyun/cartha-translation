  text: וְ/עַתָּ֣ה שְׁמַ֣ע אֱלֹהֵ֗י/נוּ אֶל תְּפִלַּ֤ת עַבְדְּ/ךָ֙ וְ/אֶל תַּ֣חֲנוּנָ֔י/ו וְ/הָאֵ֣ר פָּנֶ֔י/ךָ עַל מִקְדָּשְׁ/ךָ֖ הַ/שָּׁמֵ֑ם לְמַ֖עַן אֲדֹנָֽ/י׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/017.yaml
  text: And now[a], our God, hear the prayer of your servant and his pleas for mercy, and let your face shine upon your sanctuary, which lies desolate, for the Lord’s sake.
translation:
  language: zh_hans
  text: 如今，我们的上帝啊，求你垂听你仆人的祷告和他的恳求；愿你的脸光照你那荒凉的圣所，为主的缘故[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“主啊，为你自己的缘故。”希伯来文直译为“为主的缘故”，在直接呼告上帝时使用了第三人称的上帝称号。
    reason: 保留原文第三人称形式与直接呼告语境之间的歧义。
lexical_decisions:
- source_word: וְעַתָּה
  choice: 现在
  rationale: 作为话语承接标记，引出但以理进一步的祈求；现代汉语用“现在”已能自然承接上文，不必生硬补出“并且”.
- source_word: שְׁמַע
  choice: 求你垂听
  rationale: 这是向上帝发出的祷告请求；“垂听”既保留“听”的核心意义，也符合现代汉语庄重而自然的祈祷语体。
- source_word: אֱלֹהֵינוּ
  choice: 我们的上帝啊
  rationale: 准确表达第一人称复数所属后缀，并以“啊”标明直接呼告。
- source_word: תְּפִלַּת עַבְדְּךָ
  choice: 你仆人的祷告
  rationale: 保留原文领属结构和祈祷者在上帝面前谦卑自称“仆人”的语气。
- source_word: תַּחֲנוּנָיו
  choice: 他的恳求
  rationale: 该词指恳切求恩的祈求；“恳求”在现代汉语中清楚自然，并与单数领属后缀“他的”对应。
- source_word: וְהָאֵר פָּנֶיךָ
  choice: 使你的脸光照
  rationale: 保留使役形式及“脸发光”的圣约祝福意象，不将其抽象改写为“施恩”。
- source_word: עַל מִקְדָּשְׁךָ הַשָּׁמֵם
  choice: 你那荒凉的圣所
  rationale: “圣所”比“圣殿”更贴近 מִקְדָּשׁ 的范围；“荒凉的”保留 הַשָּׁמֵם 对圣所现状的描述。
- source_word: לְמַעַן אֲדֹנָי
  choice: 为主的缘故
  rationale: לְמַעַן 表示缘由或所依据的目的；原文在直接向上帝说话时仍使用第三人称神圣称号“主”，正文保留这一不寻常表达。
theological_decisions:
- issue: לְמַעַן אֲדֹנָי 中对上帝的第三人称称呼
  choice: 为主的缘故
  alternative: 主啊，为你自己的缘故
  rationale: 希伯来文使用称号 אֲדֹנָי，而不是第二人称代词。正文保留其第三人称形式及修辞张力，同时用脚注交代符合直接呼告语境的另一种理解。
translation_notes:
  register: 采用现代、庄重、易懂的祈祷语体。“垂听”“圣所”保留经文语感而不过分古雅；保留“脸光照”的原文意象，并避免用解释性神学术语替代。
