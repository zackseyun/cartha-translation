reference: Daniel 9:16
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אֲדֹנָ֗/י כְּ/כָל צִדְקֹתֶ֨/ךָ֙ יָֽשָׁב נָ֤א אַפְּ/ךָ֙ וַ/חֲמָ֣תְ/ךָ֔ מֵ/עִֽירְ/ךָ֥ יְרוּשָׁלִַ֖ם הַר קָדְשֶׁ֑/ךָ כִּ֤י בַ/חֲטָאֵ֨י/נוּ֙ וּ/בַ/עֲוֺנ֣וֹת אֲבֹתֵ֔י/נוּ יְרוּשָׁלִַ֧ם וְ/עַמְּ/ךָ֛ לְ/חֶרְפָּ֖ה לְ/כָל סְבִיבֹתֵֽי/נוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/016.yaml
  text: Lord[a], according to all your righteous acts, please let your anger and your wrath turn away from your city Jerusalem, your holy mountain; because through our sins and the iniquities of our fathers[b], Jerusalem and your people have become a reproach to all those around us.
translation:
  language: zh_hans
  text: 主啊[a]，求你照着你一切公义的作为，使你的怒气和烈怒离开你的圣山耶路撒冷城；因为我们的罪和我们祖先[b]的罪孽，耶路撒冷和你的子民成了我们四围众人的羞辱。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “公义的作为”也可译作“施行正义的作为”或“公义”。希伯来语在这里使用复数，可能着重指上帝所行的公义之事，而不只是抽象的属性。
    reason: lexical_alternative
  - marker: b
    text: “祖先”指这个民族先前的世代。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי
  choice: 主啊
  rationale: 这是直接呼求上帝的尊称；“主啊”自然表达希伯来语呼格语气，又保持庄重。
- source_word: כְּכָל צִדְקֹתֶיךָ
  choice: 照着你一切公义的作为
  rationale: כְּ表示祈求所诉诸的准则；复数צִדְקוֹת较自然地指上帝彰显公义的具体作为，而非仅指抽象属性。
- source_word: יָשָׁב נָא
  choice: 求你……使……转离
  rationale: 祈愿式配合נָא表达恳求；以怒气为语法主体的“转离”在中文中用使动结构更自然。
- source_word: אַפְּךָ וַחֲמָתְךָ
  choice: 你的怒气和烈怒
  rationale: אַף在此为“怒气”的惯用义；חֵמָה语势较强，译作“烈怒”既与前者有别，也保留加强效果。
- source_word: מֵעִירְךָ יְרוּשָׁלַם הַר קָדְשֶׁךָ
  choice: 转离你的城耶路撒冷，就是你的圣山
  rationale: מִן表示怒气所离开的对象；“你的圣山”与耶路撒冷构成同位说明，中文以“就是”明确其关系。
- source_word: כִּי בַחֲטָאֵינוּ וּבַעֲוֹנוֹת אֲבֹתֵינוּ
  choice: 因为我们的罪和我们祖先的罪孽
  rationale: כִּי引出原因，בְּ在此表示导致现状的原因或媒介；“罪孽”保留עָוֹן所含的悖逆与罪责色彩。“祖先”准确指先前世代，现代中文也比“列祖”更通俗。
- source_word: לְחֶרְפָּה
  choice: 成了羞辱
  rationale: 介词לְ可表达结果或所处状态；“成了羞辱”保留耶路撒冷和子民因罪而陷入受辱境况的动态意味。
- source_word: לְכָל סְבִיבֹתֵינוּ
  choice: 在我们四周的人中
  rationale: 字面结构指周围的一切/各方；语境所指是周围的人或民族，译文补出“人”以符合现代汉语。
theological_decisions:
- issue: צִדְקֹתֶיךָ既可指上帝的公义，也可指其公义或施行正义的作为
  choice: 你一切公义的作为
  alternative: 你一切的公义；你一切施行正义的作为
  rationale: 复数形式更倾向具体行动，但这些行动又彰显上帝的公义属性；正文保留二者联系，脚注列出未被排除的理解。
- issue: 群体及跨世代的认罪
  choice: 我们的罪和我们祖先的罪孽
  alternative: 我们的罪和我们列祖的罪孽
  rationale: 原文同时提到当代群体和先前世代，不应削弱其群体连带性；“祖先”清楚表达אָבוֹת在此指前代之人，而不把责任局限于直接父亲。
- issue: לְחֶרְפָּה所表达的是结果还是单纯状态
  choice: 成了羞辱
  alternative: 是羞辱；受人羞辱
  rationale: 无动词分句容许状态性表达，而לְ也可呈现结果；“成了羞辱”保留原文简练而强烈的结果意味，不额外解释受辱机制。
translation_notes:
  register: 采用现代、庄重而可朗读的祷告语体。“主啊，求你……”符合当代标准汉语中的恳求表达；避免过度古雅的“列祖”“忿怒”等词，同时以“烈怒”“罪孽”“圣山”保留经文的肃穆感。所有脚注标记均已置于正文相应位置。
