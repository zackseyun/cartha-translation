reference: Daniel 9:18
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: הַטֵּ֨ה אֱלֹהַ֥/י אָזְנְ/ךָ֮ וּֽ/שֲׁמָע֒ פקח/ה עֵינֶ֗י/ךָ וּ/רְאֵה֙ שֹֽׁמְמֹתֵ֔י/נוּ וְ/הָ/עִ֕יר אֲשֶׁר נִקְרָ֥א שִׁמְ/ךָ֖ עָלֶ֑י/הָ כִּ֣י לֹ֣א עַל צִדְקֹתֵ֗י/נוּ אֲנַ֨חְנוּ מַפִּילִ֤ים תַּחֲנוּנֵ֨י/נוּ֙ לְ/פָנֶ֔י/ךָ כִּ֖י עַל רַחֲמֶ֥י/ךָ הָ/רַבִּֽים׀־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/018.yaml
  text: Incline your ear[a], my God, and hear; open your eyes and see our desolations and the city that is called by your name. For we are not presenting our pleas before you because of our righteousnesses[b], but because of your abundant mercies.
translation:
  language: zh_hans
  text: 我的上帝啊，求你侧耳倾听！求你睁眼察看我们的荒凉，以及那称为你名下的城[a]。我们在你面前献上恳求，不是凭我们的义行[b]，而是凭你丰盛的怜悯。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“你的名被称在其上”，表示这城归属于上帝，并与他的名相联。
    reason: 说明希伯来语惯用表达，并保留其归属与关联的含义。
  - marker: b
    text: “义行”原文为复数，也可指“我们所行的义”或“我们自以为义的根据”。
    reason: 说明原文复数形式的语义范围，避免将其限缩为抽象的道德品质。
lexical_decisions:
- source_word: הַטֵּה אֱלֹהַי אָזְנְךָ וּשֲׁמָע
  choice: 我的上帝啊，求你侧耳倾听
  rationale: 保留“侧耳”的拟人化祷告意象，并将连续命令自然表达为现代汉语中的恳求；“我的上帝啊”明确直接呼告。
- source_word: פְּקַחָה עֵינֶיךָ וּרְאֵה
  choice: 求你睁眼察看
  rationale: 保留原文“眼睛”的拟人化意象；“察看”既对应ראה，也符合恳切祷告的语体。
- source_word: שֹׁמְמֹתֵינוּ
  choice: 我们的荒凉
  rationale: 保留希伯来语复数所涵盖的多重荒废景况，但汉语以集合性“荒凉”表达更自然，也可兼指百姓与地方的凄凉状态。
- source_word: אֲשֶׁר נִקְרָא שִׁמְךָ עָלֶיהָ
  choice: 那以你名下称的城
  rationale: 以较贴近原文的表达保留“你的名被称在其上”这一归属和关联的惯用语含义，并用脚注说明。
- source_word: מַפִּילִים תַּחֲנוּנֵינוּ לְפָנֶיךָ
  choice: 我们在你面前献上恳求
  rationale: 这是“使恳求落在……面前”的希伯来语习语；“献上恳求”自然传达陈明、呈上祈求之意。
- source_word: צִדְקֹתֵינוּ
  choice: 我们的义行
  rationale: 原文为复数，可指正义之举或可据以自称为义的根据；“义行”保留复数语义功能，又避免生硬的“诸义”。
- source_word: רַחֲמֶיךָ הָרַבִּים
  choice: 你丰盛的怜悯
  rationale: רבים表达众多、丰厚；“丰盛”在现代汉语中自然地体现怜悯的丰富充盈，同时保留复数集合意义。
theological_decisions:
- issue: 对上帝使用“耳”和“眼”的拟人化语言
  choice: 保留“侧耳”和“睁眼”的直接意象
  alternative: 释义为“求你留心、眷顾”
  rationale: 原文借身体意象表达祈求上帝垂听和察看；保留修辞不等于断言上帝受受造身体限制。
- issue: 但以理祈求的依据
  choice: 明确译为“不凭我们的义行，而凭你丰盛的怜悯”
  alternative: 弱化为“不因我们的好处，而因你的慈爱”
  rationale: 原文刻意对比人的צדקות与上帝的רחמים；译文应保留人的义不能成为此祈求根据、祈求仰赖上帝怜悯的张力。
- issue: “称名在其上”的含义
  choice: 正文保留较贴近原文的“以你名下称”，脚注解释归属关联
  alternative: 直接意译为“属于你的城”或“以你的名命名的城”
  rationale: 该习语可能同时包含归属、认同与名号关联；不在正文中把它缩减成单一解释。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。祷告中的连续命令以“求你”表达恳切语气；保留“侧耳、睁眼”的诗性拟人意象。“以你名下称”略带经文庄重感，因此配脚注帮助普通读者理解。
