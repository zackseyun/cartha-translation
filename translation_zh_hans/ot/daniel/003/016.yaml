base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/016.yaml
  text: Shadrach, Meshach, and Abed-nego answered and said to the king, Nebuchadnezzar, “We have no need to give you an answer concerning this matter.”
translation:
  language: zh_hans
  text: 沙得拉、米煞、亚伯尼歌回答尼布甲尼撒王说：“这件事，我们无须回答你。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֲנוֹ ... וְאָמְרִין
  choice: 回答……说
  rationale: 保留亚兰文中常见的双重表达，同时符合庄重、自然的现代汉语叙事风格。
- source_word: לְמַלְכָּא נְבוּכַדְנֶצַּר
  choice: 尼布甲尼撒王
  rationale: 原文可直译为“对王尼布甲尼撒”；汉语将称号置于姓名之后更自然，并保留其王者身份。
- source_word: לָא חַשְׁחִין אֲנַחְנָה
  choice: 我们无须
  rationale: 表达“不需要、没有必要”的语义，而非“不能”或“不愿”。
- source_word: עַל דְּנָה פִּתְגָם לַהֲתָבוּתָךְ
  choice: 这件事……回答你
  rationale: פִּתְגָם 在此指需要作出回应的事由或话语；结合 לַהֲתָבוּתָךְ，译为“这件事，我们无须回答你”简洁自然。
theological_decisions:
- issue: 三人的话是拒绝辩护，还是宣称无需作答
  choice: 采用“无须回答你”
  alternative: “不必为这件事向你申辩”
  rationale: 原文强调没有必要作答，未明确使用法律意义上的“申辩”；译文不额外强化其态度或司法语境。
translation_notes:
  register: 采用庄重而清晰的现代标准汉语。人名沿用中文圣经中通行译名；语序适度汉化，但保留“回答……说”的原文叙事结构。
