language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אִיתַ֞י גֻּבְרִ֣ין יְהוּדָאיִ֗ן דִּֽי מַנִּ֤יתָ יָתְ/הוֹן֙ עַל עֲבִידַת֙ מְדִינַ֣ת בָּבֶ֔ל שַׁדְרַ֥ךְ מֵישַׁ֖ךְ וַ/עֲבֵ֣ד נְג֑וֹ גֻּבְרַיָּ֣/א אִלֵּ֗ךְ לָא שָׂ֨מֽוּ עלי/ך מַלְכָּ/א֙ טְעֵ֔ם ל/אלהי/ך לָ֣א פָלְחִ֔ין וּ/לְ/צֶ֧לֶם דַּהֲבָ֛/א דִּ֥י הֲקֵ֖ימְתָּ לָ֥א סָגְדִֽין־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/012.yaml
  text: 'There are certain Jewish men whom you have appointed over the administration of the province of Babylon—Shadrach[a], Meshach, and Abed-nego. These men have paid no attention to you, O king: they do not serve your gods[b], and they do not worship the golden image that you have set up.'
translation:
  language: zh_hans
  text: 有几个犹太人，你任命他们管理巴比伦省的事务，就是沙得拉、米煞和亚伯尼歌。王啊，这些人不理会你[a]；他们不事奉你的神[b]，也不敬拜你所立的金像。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“不尊重你”或“不顾念你”。亚兰语习语的字面意思是没有把重视或关注“放”在王身上。
    reason: lexical_alternative
  - marker: b
    text: 亚兰语在这里使用两个不同的动词：他们不“事奉”王的神，也不“敬拜”金像。后一个动词也可表达俯伏下拜。
    reason: lexical_alternative
lexical_decisions:
- source_word: אִיתַי גֻּבְרִין יְהוּדָאיִן
  choice: 有几个犹太人
  rationale: אִיתַי是引出控告对象的存在词；“有几个”以自然汉语传达这里指称若干特定人物的语气。גֻּבְרִין虽明确为“男人”，但现代汉语“犹太人”已足以自然指称下文三名男子，避免生硬的“犹太男人”。
- source_word: דִּי מַנִּיתָ יָתְהוֹן עַל עֲבִידַת מְדִינַת בָּבֶל
  choice: 是你任命管理巴比伦省事务的
  rationale: מַנִּיתָ表示“任命、指派”，עַל עֲבִידַת在此行政语境中指主管相关事务；译文保留他们由王亲自任命这一反讽性的控告背景。
- source_word: שַׁדְרַךְ מֵישַׁךְ וַעֲבֵד נְגוֹ
  choice: 沙得拉、米煞和亚伯尼歌
  rationale: 采用现代中文圣经读者较熟悉的人名音译，同时分别对应三个亚兰文名字。
- source_word: גֻּבְרַיָּא אִלֵּךְ
  choice: 这些人
  rationale: 保留指示词的强调作用，承接刚刚列出的三人。
- source_word: לָא שָׂמוּ עֲלַיִךְ ... טְעֵם
  choice: 不把你放在眼里
  rationale: 该亚兰语习语字面涉及没有把“重视、顾念”放在王身上；“不把你放在眼里”自然表达对王不予理会或不予尊重的控告，同时不擅自把宾语改成王的某一道命令。
- source_word: מַלְכָּא
  choice: 王啊
  rationale: 以现代而庄重的汉语保留直接呼语。
- source_word: לֵאלָהַיִךְ לָא פָלְחִין
  choice: 他们不事奉你的神明
  rationale: פְלַח表示对神祇的服事或宗教性侍奉；“事奉”保留其与下句סְגַד的词义区别。“神明”在汉语中自然指王所敬奉的诸神。
- source_word: וּלְצֶלֶם דַּהֲבָא דִּי הֲקֵימְתָּ
  choice: 也不敬拜你所立的金像
  rationale: צֶלֶם דַּהֲבָא是金制的像，הֲקֵים指立起或设立；“所立的金像”简洁地保留本章反复出现的表述。
- source_word: לָא סָגְדִין
  choice: 不敬拜
  rationale: סְגַד可指俯伏、下拜或敬拜；在金像这一祭祀语境中，“敬拜”自然传达行为的宗教性质，而脚注说明它与前一动词有别。
theological_decisions:
- issue: 两种宗教行为动词的区别
  choice: 将פָלְחִין译为“事奉”，将סָגְדִין译为“敬拜”
  alternative: 两处都译为“敬拜”
  rationale: 原文有意使用两个不同动词：前者侧重对神明的宗教性服事，后者侧重向金像俯伏敬拜。分别翻译可避免抹平控告的两个层面。
- issue: 对王的冒犯究竟指不尊重王本人还是不遵守王命
  choice: 正文译为“不把你放在眼里”，脚注保留“不理会你”等可能表达
  alternative: 译为“不听从你的命令”
  rationale: 原文直接指向“你”，并未明确说“你的命令”；因此不把含义限定为违抗某道诏令，以保留习语在“不重视、不理会”之间的张力。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“王啊”保留宫廷控告中的直接称呼；“不把你放在眼里”虽属常用表达，但语气有力，符合迦勒底人蓄意指控三人藐视君王的场景。句末分别使用“事奉”和“敬拜”，保留原文词汇与行为层面的区别。
