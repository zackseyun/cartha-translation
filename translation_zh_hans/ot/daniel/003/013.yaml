base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/013.yaml
  text: Then Nebuchadnezzar, in rage and fury, commanded that Shadrach, Meshach, and Abed-nego be brought in. Then these men were brought before the king.
translation:
  language: zh_hans
  text: 于是，尼布甲尼撒怒气冲冲，大发烈怒，下令把沙得拉、米煞、亚伯尼歌带来。于是，这几个人被带到王面前。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: 于是
  rationale: 这是亚兰文叙事推进标记；译作“于是”自然地承接上文，并保留事件接续的作用。原文在本节两次使用，译文也两次保留。
- source_word: בִּרְגַז וַחֲמָה
  choice: 怒气冲冲，大发烈怒
  rationale: 两个并列名词共同加强尼布甲尼撒的愤怒程度。采用两个相应的汉语表达，既保留修辞叠加强度，也比生硬直译“在愤怒和烈怒中”更自然。
- source_word: אֲמַר לְהַיְתָיָה
  choice: 下令把……带来
  rationale: “说”加使役不定式在此表达命令；“下令把……带来”清楚体现命令语气及使人将他们带来的使役含义。
- source_word: לְשַׁדְרַךְ מֵישַׁךְ וַעֲבֵד נְגוֹ
  choice: 沙得拉、米煞、亚伯尼歌
  rationale: 按现代中文圣经人名的通行音译处理，不翻译名字的词义。
- source_word: גֻּבְרַיָּא אִלֵּךְ
  choice: 这几个人
  rationale: 指刚刚点名的三人。“这几个人”既表达指示意义，也符合现代汉语叙事习惯。
- source_word: הֵיתָיוּ קֳדָם מַלְכָּא
  choice: 被带到王面前
  rationale: 动词在语境中具有被带来的被动、使役结果，不只是自行来到；“王面前”准确表达宫廷场景中的 קֳדָם。
