  text: כָּ/ל קֳבֵ֤ל דְּנָה֙ בֵּ/הּ זִמְנָ֔/א קְרִ֖בוּ גֻּבְרִ֣ין כַּשְׂדָּאִ֑ין וַ/אֲכַ֥לוּ קַרְצֵי/ה֖וֹן דִּ֥י יְהוּדָיֵֽ/א־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/008.yaml
  text: For this reason[a], at that time certain Chaldean men came forward and maliciously accused the Jews.
translation:
  language: zh_hans
  text: 因此，当时有些迦勒底人上前，恶意控告犹太人[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“犹大人”。这里的亚兰语词既可按族群指“犹太人”，也可按地域来源指“犹大人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל־קֳבֵל דְּנָה
  choice: 因此
  rationale: 这是表示因果承接的亚兰语惯用语；“因此”简洁自然，也清楚衔接上文。
- source_word: בֵּהּ זִמְנָא
  choice: 当时
  rationale: 准确表达该时间短语，在现代汉语叙事中自然凝练。
- source_word: קְרִבוּ
  choice: 上前
  rationale: 原义为“走近、接近”；在王廷陈情的语境中，“上前”自然贴切。
- source_word: גֻּבְרִין כַּשְׂדָּאִין
  choice: 有些迦勒底人
  rationale: 原文直指若干迦勒底男子；汉语用“有些迦勒底人”既保留不定数量，又避免不自然的“迦勒底男子”，且不擅自将其解释为官员。
- source_word: וַאֲכַלוּ קַרְצֵיהוֹן
  choice: 恶意控告
  rationale: 这是一个字面涉及“吃掉某人的碎块”的亚兰语惯用语，实际表示怀有敌意地告发或控告；“恶意控告”同时传达司法性与敌对意味。
- source_word: דִּי יְהוּדָיֵא
  choice: 犹太人
  rationale: 该词既可按族群称为“犹太人”，也可按地域来源称为“犹大人”；正文采用现代读者较熟悉且符合流亡语境的“犹太人”，并在脚注保留另一译法。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而清晰的叙事语言。“因此，当时”保留原文因果与时间双重衔接；“上前，恶意控告”符合王廷场景，也避免把亚兰语惯用语生硬直译。脚注标记置于其实际说明的“犹太人”之后。
