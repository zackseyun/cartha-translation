  yaml_path: translation/ot/daniel/003/004.yaml
  text: And the herald cried aloud[a], “To you it is proclaimed, O peoples, nations[b], and languages:”
translation:
  language: zh_hans
  text: 传令官大声呼喊道[a]：“各族、各国、说各种语言的人哪，现向你们宣告[b]：”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“用力呼喊”或“高声呼喊”。亚兰文直译涉及“力量”，这里描述传令官呼喊的力度或音量。
    reason: lexical_alternative
  - marker: b
    text: 亚兰文形式上是“他们说”，这里用作无人称的官方宣告套语，因此译为“现向你们宣告”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כָרוֹזָא
  choice: 传令官
  rationale: 指奉命公开宣告信息的官员；“传令官”符合宫廷诏令语境，也比“喊话者”庄重自然。
- source_word: קָרֵא
  choice: 喊道
  rationale: 该动词表示出声呼喊；与“大声”连用，既自然又引出后面的直接引语。
- source_word: בְחָיִל
  choice: 大声
  rationale: 字面与“力量”有关，此处修饰宣告的声量或力度；译作“大声”符合现代汉语习惯。[a]保留字面语义所容许的另一理解。
- source_word: לְכוֹן
  choice: 给你们
  rationale: 这是第二人称复数的与格形式；结合正式宣告公式，译为“有令传给你们”自然地标明受令对象。
- source_word: אָמְרִין
  choice: 有令传给
  rationale: 形式上是“他们说”，但这里用作无人称的官方宣告公式；“有令传给”体现诏令语境，同时以脚注保留其形式意义。
- source_word: עַמְמַיָּא
  choice: 各族
  rationale: 指复数的族群或人民群体；“各族”既保留复数分布意义，也与后面的“各国”相区分。
- source_word: אֻמַּיָּא
  choice: 各国
  rationale: 通常指列国或民族共同体；“各国”保留三项并列中的独立含义。
- source_word: לִשָּׁנַיָּא
  choice: 说各种语言的人
  rationale: 字面为“各种舌头／语言”，在呼语中所指是不同语言群体；这样翻译比单说“各种语言哪”更符合现代汉语。
