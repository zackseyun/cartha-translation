  text: בֵּ/אדַ֨יִן נְבוּכַדְנֶצַּ֜ר הִתְמְלִ֣י חֱמָ֗א וּ/צְלֵ֤ם אַנְפּ֨וֹ/הִי֙ אשתנו עַל שַׁדְרַ֥ךְ מֵישַׁ֖ךְ וַ/עֲבֵ֣ד נְג֑וֹ עָנֵ֤ה וְ/אָמַר֙ לְ/מֵזֵ֣א לְ/אַתּוּנָ֔/א חַ֨ד שִׁבְעָ֔ה עַ֛ל דִּ֥י חֲזֵ֖ה לְ/מֵזְיֵֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/019.yaml
  text: Then Nebuchadnezzar was filled with fury[a], and the expression of his face was changed against Shadrach, Meshach, and Abed-nego. He answered and said to heat the furnace seven times more than it was usually heated.
translation:
  language: zh_hans
  text: 那时，尼布甲尼撒满腔怒火，他对沙得拉、米煞、亚伯尼歌的神色也变了。他吩咐人把炉子烧热到平常的七倍[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“七倍热。”亚兰语的说法指把炉子烧到远超通常加热程度的强度。
    reason: 保留“七倍”的简洁替代表述，并说明其相对于通常加热程度的语义，不把它改写为“另加七倍”。
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: 那时
  rationale: 这是承接叙事进程的亚兰语标记；“那时”自然地引出随即发生的事。
- source_word: הִתְמְלִי חֱמָא
  choice: 怒气填胸
  rationale: 原文表达“被盛怒充满”；此译保留强烈程度，同时符合现代汉语的庄重叙事语体。
- source_word: וּצְלֵם אַנְפּוֹהִי אשתנו
  choice: 脸色……变了
  rationale: 原义为“他脸面的形貌改变了”，所指是怒气在面部神情上的显露；“脸色变了”简洁自然。
- source_word: עַל
  choice: 因
  rationale: 此处表示他的脸色变化是针对三人、由他们引起的敌意反应；汉语用“因……而变”自然表达该关系，又不额外补入原文没有的动作。
- source_word: עָנֵה וְאָמַר
  choice: 他吩咐
  rationale: 这是常见的闪语叙事套语，字面为“他回答说”；但后接使炉子加热的命令，汉语译为“吩咐”更自然，并准确传达言语行为。
- source_word: לְמֵזֵא לְאַתּוּנָא
  choice: 把炉子烧热
  rationale: 不定式表示命人提高炉温；此译简明、通顺。
- source_word: חַד שִׁבְעָה
  choice: 七倍
  rationale: 这是表示七倍强度的亚兰语表达；“七倍”是现代汉语最简洁的对应说法。
- source_word: עַל דִּי חֲזֵה לְמֵזְיֵהּ
  choice: 烧到平常的七倍
  rationale: 该分句字面近于“超过通常所当加热的程度”，指相对于惯常炉温大幅加热；译文清楚表达比较基准。
- source_word: שַׁדְרַךְ מֵישַׁךְ וַעֲבֵד נְגוֹ
  choice: 沙得拉、米煞、亚伯尼歌
  rationale: 采用现代中文圣经读者熟悉的人名音译。
theological_decisions: []
