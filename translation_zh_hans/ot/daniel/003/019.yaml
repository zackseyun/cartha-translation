    issue: “脸色也因沙得拉、米煞、亚伯尼歌而变了”弱化了原文“对／向着他们”的敌对指向。
    rationale: 原文介词在此不是单纯说明脸色改变的原因，而是标明王的怒气和变色针对这三人。
  - severity: medium
    issue: 脚注的“比平常再烧热七倍”可能造成数量关系偏移。
    rationale: 该说法在现代汉语中可理解为在通常温度之上额外增加七倍，未能稳妥对应原文惯常加热程度的七倍这一表达。
