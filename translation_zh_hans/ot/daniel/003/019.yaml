revisions:
- from: 那时，尼布甲尼撒怒气填胸，脸色也因沙得拉、米煞、亚伯尼歌而变了。他吩咐人把炉子烧热，烧到平常的七倍[a]。
  to: 那时，尼布甲尼撒满腔怒火，他对沙得拉、米煞、亚伯尼歌的神色也变了。他吩咐人把炉子烧热到平常的七倍[a]。
  rationale: 修订以“对……的神色变了”恢复原文针对三人的敌对取向，以“满腔怒火”提升现代汉语自然度；同时收紧脚注，避免把七倍表达解释成通常程度以外再增加七倍。
