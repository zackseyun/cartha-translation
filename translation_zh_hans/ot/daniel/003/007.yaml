revisions:
- from: 因此，就在那时，所有民族一听见号角、笛子、琴、三角琴、瑟，以及各种乐器的声音[a]，各民族、各邦国、说各种语言的人就都俯伏敬拜尼布甲尼撒王所立的金像。
  to: 因此，在那时，当所有民族听见号角、笛子、琴、三角琴、瑟，以及各种音乐的声音[a]时，各民族、各邦国、说各种语言的人就都俯伏敬拜尼布甲尼撒王所立的金像。
  rationale: 仅作两项保守修订：以“当……时”保留原文未被强化的时间关系，并以“各种音乐的声音”恢复列举之后的概括性音乐用语。其余措辞、名称、敬拜用语及脚注均可保留。
