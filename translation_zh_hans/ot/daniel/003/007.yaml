  text: כָּ/ל קֳבֵ֣ל דְּנָ֡ה בֵּ/הּ זִמְנָ֡/א כְּ/דִ֣י שָֽׁמְעִ֣ין כָּֽל עַמְמַיָּ֡/א קָ֣ל קַרְנָ/א֩ מַשְׁר֨וֹקִיתָ֜/א קיתרס שַׂבְּכָא֙ פְּסַנְטֵרִ֔ין וְ/כֹ֖ל זְנֵ֣י זְמָרָ֑/א נָֽפְלִ֨ין כָּֽל עַֽמְמַיָּ֜/א אֻמַיָּ֣/א וְ/לִשָּׁנַיָּ֗/א סָֽגְדִין֙ לְ/צֶ֣לֶם דַּהֲבָ֔/א דִּ֥י הֲקֵ֖ים נְבוּכַדְנֶצַּ֥ר מַלְכָּֽ/א־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/007.yaml
  text: Therefore[a], at that time, when all the peoples heard the sound of the horn, pipe, lyre, trigon, psaltery, and every kind of music, all the peoples, nations, and languages fell down and worshiped the golden image that King Nebuchadnezzar had set up.
translation:
  language: zh_hans
  text: 因此，在那时，当所有民族听见号角、笛子、琴、三角琴、瑟，以及各种音乐的声音[a]时，各民族、各邦国、说各种语言的人就都俯伏敬拜尼布甲尼撒王所立的金像。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里几种乐器的确切名称和形制不能确定。“三角琴”可能是三角形的竖琴类乐器；“瑟”可能是齐特琴或竖琴一类的弦乐器。
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל־קֳבֵל דְּנָה
  choice: 因此
  rationale: 保留亚兰语习语承接前述王令并引出结果的推论作用；现代汉语简洁自然。
- source_word: בֵּהּ זִמְנָא
  choice: 就在那时
  rationale: 准确表达当时执行命令的时间背景，“就”也自然衔接上下文。
- source_word: כְּדִי שָׁמְעִין
  choice: 一听见
  rationale: 分词结构在此表达时间关系；结合随即俯伏的语境，用“一听见”自然呈现紧接发生的动作。
- source_word: כָּל עַמְמַיָּא
  choice: 所有民族
  rationale: 保留复数群体和族群含义，不将其缩减为泛指的“所有人”。
- source_word: קָל
  choice: 声音
  rationale: 这里指乐器发出的可听声音，而非说话的嗓音。
- source_word: קַרְנָא
  choice: 号角
  rationale: 采用宽泛而易懂的古代吹奏乐器名称，不武断限定为羊角号。
- source_word: מַשְׁרוֹקִיתָא
  choice: 笛子
  rationale: 指一种管乐器；“笛子”通俗自然，同时避免更细的未经证实的分类。
- source_word: קיתרס
  choice: 琴
  rationale: 该借词指类似希腊基他拉琴的弦乐器；“琴”在中文中简明可读，并避免误认作某一种现代乐器。
- source_word: שַׂבְּכָא
  choice: 三角琴
  rationale: 该乐器的确切形制不明；“三角琴”保留常见的三角形弦乐器理解，并以脚注说明不确定性。
- source_word: פְּסַנְטֵרִין
  choice: 瑟
  rationale: 很可能是某种拨弦乐器的借词；以中文传统的宽泛弦乐器名称表达，但不声称两者形制完全相同。
- source_word: וְכֹל זְנֵי זְמָרָא
  choice: 以及各种乐器的声音
  rationale: 在列举乐器后作总括；依本节句法将“声音”统摄整项，使中文避免把抽象的“音乐”与具体乐器并列。
- source_word: נָפְלִין
  choice: 俯伏
  rationale: 既呈现身体伏下的具体动作，也符合敬拜场景，比单纯“倒下”更准确。
theological_decisions:
- issue: 对金像所行之举的译法
  choice: 敬拜
  alternative: 下拜；表示敬意
  rationale: 对象是王所立的像，且处于受命进行的礼仪性场景；“敬拜”保留其宗教性力度，同时不额外加入经文未明说的神学判断。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留经文中“各民族、各邦国、说各种语言的人”的排比和帝国性范围；乐器名称以可读性与不过度确定之间的平衡为原则，并用脚注交代词义不确定性。
