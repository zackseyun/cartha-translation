    rationale: כְּדִי 加分词在此表示“当……时”；语境虽显示随即顺从，但原文并未明示“刚一听见就”的即时程度。应译为“当……听见……时”。
  - severity: medium
    issue: “各种乐器的声音”限缩了末项的概括语。
    rationale: וְכֹל זְנֵי זְמָרָא 是列举后对各类音乐/奏乐的总括；译为“各种音乐的声音”较符合原文及英文审校轨迹，不把其限定为乐器本身。
