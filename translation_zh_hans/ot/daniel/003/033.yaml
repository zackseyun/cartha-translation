  to: 他的神迹何其伟大[a]，他的奇事何等有力！他的国度是永远长存的国度[b]，他的权柄世世代代长存[c]。
  rationale: 修订仅改善两处汉语搭配，并以更自然、庄重的“权柄……长存”呈现原文的治理权与跨世代持续性；不补出代词的所指，不改变神学表达，也保留原文的平行和感叹语气。
