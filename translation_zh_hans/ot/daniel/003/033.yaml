  naturalness: “他的奇事何其强大”在现代汉语中搭配不够自然：‘强大’通常不直接修饰‘奇事’，且未充分体现原文对奇事之效力/威能的颂赞。末句“统治权延续世世代代”可理解，但改为‘他的权柄世世代代长存’更合乎庄重、自然的汉语颂赞语体。
