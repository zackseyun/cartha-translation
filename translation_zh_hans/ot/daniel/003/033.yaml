base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/033.yaml
  text: How great are his signs[a], and how mighty are his wonders! His kingdom is an everlasting kingdom[c][b], and his dominion is from generation to generation.
translation:
  language: zh_hans
  text: 他的神迹何其伟大[a]，他的奇事何等有力！他的国度是永远长存的国度[b]，他的权柄世世代代长存[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他的记号”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“永恒的国度”。
    reason: lexical_alternative
  - marker: c
    text: 亚兰文直译近于“与一代又一代同在”，是指历世历代持续不绝的习语。
    reason: cultural_note
lexical_decisions:
- source_word: אָתוֹהִי
  choice: 他的神迹
  rationale: 该词在圣经亚兰文中指具有指示意义、常带超自然性质的记号；“神迹”在现代汉语中自然，也与下句“奇事”构成惯用搭配。
- source_word: כְּמָה
  choice: 何其
  rationale: 这里是表示赞叹程度的感叹词；“何其”简洁庄重，准确呈现“多么”的感叹语气。
- source_word: רַבְרְבִין
  choice: 伟大
  rationale: 上下文强调神迹的非凡程度，而非单纯数量之多；“伟大”保留其质的含义。
- source_word: תִמְהוֹהִי
  choice: 他的奇事
  rationale: 指令人惊叹的作为；“奇事”既清楚又庄重，并避免与前面的“神迹”完全重复。
- source_word: תַקִּיפִין
  choice: 强大
  rationale: 该词表示强劲、有能力；“强大”自然地修饰这些令人惊叹的作为，并保留颂赞语气。
- source_word: מַלְכוּתֵהּ
  choice: 他的国度
  rationale: 指神的王国或王权范围；“国度”在此比单说“国”更能表达神掌权的含义，同时不把“统治”这一层意思过度写入。
- source_word: מַלְכוּת עָלַם
  choice: 永远长存的国度
  rationale: 该短语表达持续不止的国度；“永远长存”自然明确，也保留“永恒的”这一可选译法。
- source_word: שָׁלְטָנֵהּ
  choice: 他的统治权
  rationale: 指统治的权力、权柄；“统治权”既保留王权语义，又与前面的“国度”形成平行而不重复。
- source_word: עִם דָּר וְדָר
  choice: 延续世世代代
  rationale: 原文直译近于“与一代又一代同在”，是表示历代持续不绝的习语；此译符合现代汉语表达。
theological_decisions:
- issue: 尼布甲尼撒颂词中代词所指
  choice: 按原文译为“他的”，不在正文中补出“神的”或“至高者的”。
  alternative: 在正文中明确译为“神的”或“至高者的”。
  rationale: 上下文已清楚表明这些代词指至高的神；保留代词可忠实呈现本节措辞，避免加入解释性扩展。
- issue: “国度”与“统治权”的关系
  choice: 分别译出“国度”和“统治权”，保留原文平行的两个概念。
  alternative: 都处理为“掌权”或“统治”，使两者合并。
  rationale: 原文使用两个不同名词；分别翻译能保留神的国度与其治理权柄之间相关但不完全相同的表达。
translation_notes:
  register: 采用现代、庄重而易懂的颂赞语体。“何其……！”保留原文连续感叹的修辞；“国度—统治权”维持诗性平行。所有代词均按原文保留，不额外加入神学解释。
