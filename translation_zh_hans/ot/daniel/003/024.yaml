source:
  edition: WLC
  text: אֱדַ֨יִן֙ נְבוּכַדְנֶצַּ֣ר מַלְכָּ֔/א תְּוַ֖הּ וְ/קָ֣ם בְּ/הִתְבְּהָלָ֑ה עָנֵ֨ה וְ/אָמַ֜ר לְ/הַדָּֽבְר֗וֹ/הִי הֲ/לָא֩ גֻבְרִ֨ין תְּלָתָ֜א רְמֵ֤ינָא לְ/גוֹא נוּרָ/א֙ מְכַפְּתִ֔ין עָנַ֤יִן וְ/אָמְרִין֙ לְ/מַלְכָּ֔/א יַצִּיבָ֖א מַלְכָּֽ/א־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/024.yaml
  text: Then King Nebuchadnezzar was astonished and rose up in haste[a]. He answered and said to his counselors, “Did we not throw three men, bound, into the midst of the fire?” They answered and said to the king, “Certainly[b], O king.”
translation:
  language: zh_hans
  text: 那时，尼布甲尼撒王大吃一惊，慌忙站起来。他开口对自己的谋士们[a]说：“我们扔进火中[b]的，不是三个被捆绑的人吗？”他们回答王说：“王啊，确实如此。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“官员们”或“臣僚们”；亚兰文此词指在王廷中侍奉君王的人。
    reason: lexical_alternative
  - marker: b
    text: 原文更完整地说“火的中央”或“火的内部”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱדַיִן
  choice: 那时
  rationale: 作为亚兰文叙事衔接语，引出紧接着发生的事；“那时”自然、庄重，也保持事件推进。
- source_word: תְּוַהּ
  choice: 大吃一惊
  rationale: 该动词表示因所见之事而惊愕、震惊；此处用现代汉语常用表达传达国王突如其来的强烈反应。
- source_word: בְּהִתְבְּהָלָה
  choice: 慌忙
  rationale: 原词兼有急促和慌乱之意；“慌忙站起来”同时保留动作的迅速与情绪上的不安。
- source_word: עָנֵה וְאָמַר
  choice: 他开口……说
  rationale: 这是闪语常见的发言公式；译为“开口……说”保留双重表达的源语色彩，又符合现代汉语。
- source_word: לְהַדָּבְרוֹהִי
  choice: 自己的谋士们
  rationale: 该词指在王廷中侍奉君王、参与咨询或行政事务的人；“谋士们”切合此处由他们确认王命的场景，但词义也可较宽泛地理解为官员或臣僚。
- source_word: הֲלָא
  choice: 不是……吗
  rationale: 引出预期得到肯定回答的反问；汉语“不是……吗”准确传达这一语用功能。
- source_word: גֻבְרִין תְּלָתָא
  choice: 三个人
  rationale: 直译数词与表示成年男子的名词；上下文已明确人物身份，现代汉语用“三个人”自然清楚。
- source_word: רְמֵינָא
  choice: 扔进
  rationale: 该动词意为扔、投掷；“扔进”是现代汉语中清楚直接的表达。
- source_word: לְגוֹא נוּרָא
  choice: 进火中
  rationale: לְגוֹא 带有进入内部或中央的空间含义；正文采用自然的“火中”，脚注说明较完整的字面意思。
- source_word: מְכַפְּתִין
  choice: 被捆绑的
  rationale: 分词描述三人被投入时所处的捆绑状态；被动表达准确且符合上下文。
- source_word: עָנַיִן וְאָמְרִין
  choice: 他们回答王说
  rationale: 保留原文“回答并说”的发言公式，同时以汉语可接受的句式呈现。
- source_word: יַצִּיבָא
  choice: 确实如此
  rationale: 该词表示“真实、确定”，这里是对王反问的肯定答复；“确实如此”自然且明确。
theological_decisions: []
