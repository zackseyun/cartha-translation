source:
  edition: WLC
  text: כְּעַ֞ן הֵ֧ן אִֽיתֵי/כ֣וֹן עֲתִידִ֗ין דִּ֣י בְ/עִדָּנָ֡/א דִּֽי תִשְׁמְע֡וּן קָ֣ל קַרְנָ֣/א מַשְׁרוֹקִיתָ֣/א קיתרס שַׂבְּכָ֡א פְּסַנְתֵּרִין֩ וְ/סוּמְפֹּ֨נְיָ֜ה וְ/כֹ֣ל זְנֵ֣י זְמָרָ֗/א תִּפְּל֣וּן וְ/תִסְגְּדוּן֮ לְ/צַלְמָ֣/א דִֽי עַבְדֵת֒ וְ/הֵן֙ לָ֣א תִסְגְּד֔וּן בַּ/הּ שַׁעֲתָ֣/ה תִתְרְמ֔וֹן לְ/גֽוֹא אַתּ֥וּן נוּרָ֖/א יָקִֽדְתָּ֑/א וּ/מַן ה֣וּא אֱלָ֔הּ דֵּ֥י יְשֵֽׁיזְבִנְ/כ֖וֹן מִן יְדָֽ/י־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/015.yaml
  text: Now if you are ready[a], when you hear the sound of the horn, pipe, lyre, trigon, harp, and bagpipe, and every kind of music, to fall down and worship the image that I have made, well and good. But if you do not worship, in that very hour you will be thrown into the midst of a blazing furnace of fire[d][c][b]. And who is the god who will deliver you out of my hands?
translation:
  language: zh_hans
  text: 现在，你们若已准备好，一听见号角、笛子、琴、三角琴[a]、竖琴[b]、风笛[c]以及各样音乐的声音，就俯伏敬拜我所造的像，那就好[d]；但你们若不敬拜，必立刻被扔进烈火窑中。到那时，哪一个神能救你们脱离我的手呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “三角琴”所对应的亚兰语乐器名称含义不确定，也可理解为一种三角形的竖琴。
    reason: lexical_alternative
  - marker: b
    text: 这里指一种弦乐器，传统译法也有“瑟”；其确切形制不明。
    reason: lexical_alternative
  - marker: c
    text: “风笛”所对应的古代乐器究竟是什么仍有争议，也可能是“双管笛”。
    reason: lexical_alternative
  - marker: d
    text: 亚兰原文在“我所造的像”之后省略了顺服所带来的结果；“那就好”是为使句意完整而补出的。
    reason: ellipsis
lexical_decisions:
- source_word: כְּעַן
  choice: 现在
  rationale: 作为亚兰语话语副词，引出王再次发出的挑战；“现在”自然地保留其即时语气。
- source_word: אִיתֵיכון עֲתִידִין
  choice: 你们若已准备好
  rationale: 该习语表达已经预备好立即行动；“已准备好”简洁、自然，并与条件句衔接。
- source_word: בְעִדָּנָא דִּי תִשְׁמְעוּן קָל
  choice: 一听见……的声音
  rationale: 既表达时间关系，也体现听见乐声后须立即行动的命令语气。
- source_word: קַרְנָא מַשְׁרוֹקִיתָא קיתרס
  choice: 角、笛、琴
  rationale: 采用普通读者易懂的现代乐器通称，同时避免对古代乐器形制做无根据的精确判定。
- source_word: שַׂבְּכָא
  choice: 三角琴
  rationale: 该乐器的确切形制不明；“三角琴”传达较可能的类别，并以脚注注明不确定性。
- source_word: פְּסַנְתֵּרִין
  choice: 竖琴
  rationale: 指一种弦乐器；“竖琴”比音译或较陈旧的名称更易懂，但脚注保留其他可能。
- source_word: סוּמְפֹּנְיָה
  choice: 风笛
  rationale: 这是常见的现代鉴定之一，但原词所指乐器仍有争议，故以脚注说明“双管笛”等可能。
- source_word: כֹל זְנֵי זְמָרָא
  choice: 各样乐器的声音
  rationale: 结合前面的乐器清单，译为“各样乐器的声音”比抽象的“各种音乐”更贴合上下文，同时保留其概括性。
- source_word: בַּהּ שַׁעֲתָה
  choice: 立刻
  rationale: 字面为“就在那一刻”；“立刻”在现代汉语中准确表达即时惩罚。
- source_word: אַתּוּן נוּרָא יָקִדְתָּא
  choice: 烈火窑
  rationale: 自然凝练地表达“燃烧着火的窑”，保留火势炽烈和窑炉意象。
theological_decisions:
- issue: 偶像语境中 סגד 的译法
  choice: 敬拜
  alternative: 下拜；致敬
  rationale: 此处冲突涉及向像献上宗教性效忠，因此“敬拜”恰当；前面的“俯伏”另行保留身体动作。
- issue: 尼布甲尼撒挑衅中 אֱלָהּ 的译法
  choice: 哪一个神
  alternative: 哪一位神；什么神
  rationale: 王是在泛指并挑衅任何可能施救的神明，不是在承认以色列的神；“哪一个神”保留其说话立场及反问语气。
- issue: “我所造的像”之后省略的条件结果
  choice: 补出“那就好”
  alternative: 不补出，保留中断句式
  rationale: 亚兰文本在顺服条件之后省略结果；补出简短的“那就好”使现代汉语完整，同时不增加具体奖赏或承诺。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。乐器名称以可理解性为先，同时通过脚注保存原文词义的不确定性；王的威胁用短促有力的表达，末句保留其狂妄的反问语气。
