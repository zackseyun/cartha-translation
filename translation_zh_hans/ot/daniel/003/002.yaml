  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וּ/נְבוּכַדְנֶצַּ֣ר מַלְכָּ֡/א שְׁלַ֡ח לְ/מִכְנַ֣שׁ לַֽ/אֲחַשְׁדַּרְפְּנַיָּ֡/א סִגְנַיָּ֣/א וּֽ/פַחֲוָתָ֡/א אֲדַרְגָּזְרַיָּ/א֩ גְדָ֨בְרַיָּ֤/א דְּתָבְרַיָּ/א֙ תִּפְתָּיֵ֔/א וְ/כֹ֖ל שִׁלְטֹנֵ֣י מְדִֽינָתָ֑/א לְ/מֵתֵא֙ לַ/חֲנֻכַּ֣ת צַלְמָ֔/א דִּ֥י הֲקֵ֖ים נְבוּכַדְנֶצַּ֥ר מַלְכָּֽ/א׀׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/002.yaml
  text: Then King Nebuchadnezzar sent to assemble the satraps[a], the prefects, and the governors, the counselors, the treasurers, the judges, the magistrates, and all the officials of the provinces, to come to the dedication of the image that King Nebuchadnezzar had set up.
translation:
  language: zh_hans
  text: 于是，尼布甲尼撒王派人召集各总督、长官、省长、谋士、司库、法官、司法官，以及各省所有官员，叫他们前来参加尼布甲尼撒王所立之像[a]的奉献典礼。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“雕像”。亚兰文这个词可泛指形像；在本段语境中，所指的是一座大型立像。
    reason: 保留 צַלְמָא 的词义范围，同时说明本段具体语境。
lexical_decisions:
- source_word: שְׁלַח לְמִכְנַשׁ
  choice: 派人召集
  rationale: 原文是“派出／差遣”加目的不定式“聚集”。“派人召集”既保留差遣行动，也符合正式行政语境。
- source_word: אֲחַשְׁדַּרְפְּנַיָּא
  choice: 总督
  rationale: 这是波斯帝国的高级地方官衔，即通常所谓 satrap；“总督”在现代中文中较易理解，也能体现其高阶地方行政地位。
- source_word: סִגְנַיָּא
  choice: 长官
  rationale: 指高级行政官员，但具体职级难以确定；采用宽泛而正式的“长官”，避免过度限定。
- source_word: פַחֲוָתָא
  choice: 省长
  rationale: 该词指治理一地的官员；“省长”可与前面的“总督”区分，并适合“各省”的行政背景。
- source_word: אֲדַרְגָּזְרַיָּא
  choice: 谋士
  rationale: 这一官衔的确切职能不完全确定，传统上多理解为顾问类高级官员；“谋士”保留其咨询职能与古代宫廷语境。
- source_word: גְדָבְרַיָּא
  choice: 司库
  rationale: 通常理解为掌管国库或财务的官员；“司库”简洁、正式。
- source_word: דְּתָבְרַיָּא
  choice: 法官
  rationale: 该词与司法裁断有关；“法官”是直接且清楚的现代对应词。
- source_word: תִּפְתָּיֵא
  choice: 司法官
  rationale: 确切含义有争议，但显然是另一类司法或民政官员；“司法官”保留官职性质，同时避免与前面的“法官”完全重复。
- source_word: כֹל שִׁלְטֹנֵי מְדִינָתָא
  choice: 各省所有官员
  rationale: 这是概括性的行政称谓，承接前面具体官职清单；“官员”足够宽泛，符合原文集合意义。
- source_word: לְמֵתֵא
  choice: 前来
  rationale: 直译为“来”；“前来”在王命召集官员的正式语境中自然得体，且不将其解释性地译成“出席”。
- source_word: חֲנֻכַּת
  choice: 奉献典礼
  rationale: 该名词表示将某物正式启用或奉献的仪式；“奉献典礼”既表达仪式性，也保留宗教及礼仪色彩。
- source_word: צַלְמָא
  choice: 像
  rationale: 该词可泛指形像、偶像或雕像；正文采用语义较宽的“像”，不预先断定其精确形制。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而清楚的行政叙事语体。保留原文首尾两次出现“尼布甲尼撒王”的重复，以呈现王权命令与王所立之像之间的强调。官职名称尽量使用普通读者可懂的现代词，同时不对若干含义不确定的古代官衔作过度精确的制度对应。
