  yaml_path: translation/ot/daniel/003/030.yaml
  text: Then the king caused Shadrach[a], Meshach, and Abednego to prosper in the province of Babylon.
translation:
  language: zh_hans
  text: 于是，王使沙得拉[a]、米煞、亚伯尼歌在巴比伦省亨通。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在巴比伦省提升沙得拉、米煞和亚伯尼歌。”这里的亚兰语动词可表示使人亨通或成功；在本段语境中，也可能包括官职上的晋升。
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: 于是
  rationale: 这是承接前文结果的亚兰语叙事标记；“于是”自然地保留了事件的先后与因果衔接。
- source_word: מַלְכָּא
  choice: 王
  rationale: 原文为强调状态的“王”；上下文已明确指尼布甲尼撒，本节不补出专名。
- source_word: הַצְלַח
  choice: 使……亨通
  rationale: 该使役形式表示使人成功、兴盛或顺利；“使……亨通”保留王的施动作用，也避免把含义缩窄为单纯的官职升迁。
- source_word: לְשַׁדְרַךְ מֵישַׁךְ וַעֲבֵד נְגוֹ
  choice: 沙得拉、米煞、亚伯尼歌
  rationale: 依照现代中文圣经人名的通行音译处理三个专名。
- source_word: בִּמְדִינַת בָּבֶל
  choice: 在巴比伦省
  rationale: מְדִינָה指行政辖区或省份；“巴比伦省”简洁自然，并符合帝国行政背景。
