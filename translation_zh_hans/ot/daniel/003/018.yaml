base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/018.yaml
  text: But if not[a], let it be known to you, O king, that we will not serve your gods, and we will not bow down to the golden image that you have set up.
translation:
  language: zh_hans
  text: 但若不然[a]，王啊，你当知道：我们绝不侍奉你的神明，也不向你所立的金像下拜。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“但若不”。这里承接上一节，是省略表达；所省略的内容可理解为“他不救我们”，但原文未明说。或译：“但即使不然。”
    reason: 说明开头条件语的省略及其由上下文暗示、但未在本节明说的内容。
lexical_decisions:
- source_word: וְהֵן לָא
  choice: 但即使不这样
  rationale: 这是承接上一节、引出相反情形的省略表达；“即使不这样”在现代汉语中自然，也保留了原文未明说“不拯救我们”的含蓄与张力。
- source_word: יְדִיעַ לֶהֱוֵא לָךְ
  choice: 你也该知道
  rationale: 原文是使某事为对方所知的非人称表达；这样译成自然庄重的现代汉语，同时保留正式宣告的语气。
- source_word: מַלְכָּא
  choice: 王啊
  rationale: 这是直接呼语；“王啊”保留了当庭陈词的庄重感。
- source_word: לֵאלָהָיִךְ
  choice: 你的神明
  rationale: 复数形式指王所敬奉的诸神；“神明”在现代汉语中可自然表达异教诸神，并避免与独一的“神”混淆。
- source_word: לָא אִיתַנָא פָלְחִין
  choice: 我们绝不侍奉
  rationale: 否定词与分词结构表达坚定而持续的拒绝；“绝不”传达其意志坚定，“侍奉”适合宗教性服事的语境。
- source_word: צֶלֶם דַּהֲבָא
  choice: 金像
  rationale: 直指由金构成或以金装饰的像；“金像”简洁自然，又不额外限定其具体形制。
- source_word: הֲקֵימְתָּ
  choice: 你所立的
  rationale: 原文完成式指王已经竖立、设立此像；定语结构符合汉语表达并保留其已完成的动作。
- source_word: נִסְגֻּד
  choice: 下拜
  rationale: 该动词指俯伏、屈身致敬；“下拜”保留身体动作及其敬拜含义，而不只抽象译作“敬拜”。
theological_decisions:
- issue: 开头条件语的省略所指
  choice: 但即使不这样
  alternative: 但即使他不救我们
  rationale: 上一节暗示所省略的是神是否施行拯救，但本节本身没有重述宾语。正文保留省略，以维持原文的修辞力度和神学张力；脚注说明其可能含义。
translation_notes:
  register: 采用现代、庄重而清晰的法庭陈词语体。“王啊”保留直接呼语；“绝不”突出三人的坚定拒绝。正文不补出省略的“他不救我们”，脚注交代上下文所暗示的含义。
