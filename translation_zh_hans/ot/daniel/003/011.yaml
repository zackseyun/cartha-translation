base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/011.yaml
  text: And whoever does not fall down and worship shall be thrown into the midst of a furnace of blazing fire[a].
translation:
  language: zh_hans
  text: 凡不俯伏敬拜的，必被扔进燃着烈火的窑中[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 较为直译：“必被投入燃烧之火的窑中。”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמַן דִּי
  choice: 凡……的
  rationale: מַן דִּי在此构成不定关系表达，意为“无论谁、凡……的”。中文用“凡……的”自然表达王令中的普遍条件；句首连接词וּ承接上文，在单节中文中不必生硬译出。
- source_word: לָא
  choice: 不
  rationale: 否定后面的两个未完成式动词；在法令的一般条件句中，简洁译为“不”最自然。
- source_word: יִפֵּל
  choice: 俯伏
  rationale: 此处不是普通跌倒，而是在像前伏身致敬；“俯伏”准确保留身体动作及臣服意味。
- source_word: וְיִסְגֻּד
  choice: 敬拜
  rationale: 该词指伏拜、致敬。与“俯伏”并列时，“敬拜”表达动作所具有的宗教与政治效忠含义，同时避免同义重复。
- source_word: יִתְרְמֵא
  choice: 必被扔进
  rationale: 被动未完成式在王令中规定刑罚；“必被”体现法令的确定性与被动意义，“扔进”符合现代汉语。
- source_word: לְגוֹא
  choice: 进……中
  rationale: 该表达指向内部、当中；中文“扔进……中”自然保留被投入窑内的意象。
- source_word: אַתּוּן
  choice: 窑
  rationale: 指高温炉窑。结合烈火刑罚的语境，“窑”比日常烹调用的“炉”更贴切，也延续《但以理书》中这一设施的称呼。
- source_word: נוּרָא יָקִדְתָּא
  choice: 烈火
  rationale: 字面为“燃烧的火”，用于强化火势。“烈火”是简洁、庄重且自然的现代中文，保留强烈程度而不把修饰关系移到“窑”上。
theological_decisions: []
translation_notes:
