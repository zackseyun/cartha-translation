reference: Daniel 3:10
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אנתה מַלְכָּ/א֮ שָׂ֣מְתָּ טְּעֵם֒ דִּ֣י כָל אֱנָ֡שׁ דִּֽי יִשְׁמַ֡ע קָ֣ל קַרְנָ֣/א מַ֠שְׁרֹקִיתָ/א קיתרס שַׂבְּכָ֤א פְסַנְתֵּרִין֙ ו/סיפניה וְ/כֹ֖ל זְנֵ֣י זְמָרָ֑/א יִפֵּ֥ל וְ/יִסְגֻּ֖ד לְ/צֶ֥לֶם דַּהֲבָֽ/א־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/010.yaml
  text: You[a], O king, have issued a decree that every man who hears the sound of the horn, pipe, lyre[b], trigon, psaltery, and bagpipe, and every kind of music, must fall down and worship the golden image.
translation:
  language: zh_hans
  text: 王啊，你曾下令：任何人一听见号角、笛、琴[a]、三角琴、瑟和风笛[b]，以及各种音乐的声音，就必须俯伏敬拜那金像。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “琴”可能指基塔拉琴一类的弦乐器；这种古代乐器的准确形制不能完全确定。
    reason: lexical_alternative
  - marker: b
    text: “风笛”或译“双管笛”；这个亚兰文乐器名称具体指什么，尚不能确定。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַנְתָּה מַלְכָּא
  choice: 王啊，你
  rationale: 保留亚兰文第二人称直接称呼和宫廷语境中的呼语，同时采用自然的现代汉语语序。
- source_word: שָׂמְתָּ טְּעֵם
  choice: 曾下令
  rationale: 原义为“设立命令/谕令”；“下令”简洁自然，并保留正式权威色彩。
- source_word: כָל אֱנָשׁ
  choice: 任何人
  rationale: 亚兰文为阳性单数名词，但在这里具有泛指作用；现代汉语“任何人”准确表达其涵盖所有人的语义，不额外限定性别。
- source_word: יִשְׁמַע קָל
  choice: 一听见……的声音
  rationale: 保留“听见声音”的基本结构，并用“一……就……”自然表达命令所设条件。
- source_word: קַרְנָא
  choice: 角
  rationale: 泛指角制或角形吹奏乐器；“角”简洁且不过度具体化。
- source_word: מַשְׁרֹקִיתָא
  choice: 笛
  rationale: 指吹奏乐器，确切形制不明；“笛”是现代中文中易懂而谨慎的对应。
- source_word: קיתרס
  choice: 琴
  rationale: 该借词指基塔拉一类弦乐器；正文用通俗的“琴”，并以脚注说明可能的具体类型。
- source_word: שַׂבְּכָא
  choice: 三角琴
  rationale: 通常理解为三角形弦乐器；此译法比音译更便于普通读者理解，同时不把它混同于一般的琴或竖琴。
- source_word: פְסַנְתֵּרִין
  choice: 瑟
  rationale: 指一种拨弦乐器；“瑟”是庄重、简洁且为中文读者熟悉的传统对应，但具体古代乐器形制仍难确定。
- source_word: סִיפֹנְיָה
  choice: 风笛
  rationale: 传统上常译作风笛，但词源和所指乐器均有争议；正文采用常见译法，脚注保留“双管笛”的可能。
- source_word: וְיִסְגֻּד
  choice: 敬拜
  rationale: 对象是金像，语境具有明显宗教礼仪意味；“敬拜”比单纯“致敬”更能体现原文力度。
theological_decisions:
- issue: כָל אֱנָשׁ 的泛指阳性形式
  choice: 任何人
  alternative: 每个男人
  rationale: 原文语法形式为阳性单数，但语用上泛指所有受命者。汉语没有对应的语法阳性标记，译作“任何人”既不缩窄范围，也不额外消解原文含义。
- issue: וְיִסְגֻּד 的宗教含义
  choice: 敬拜
  alternative: 俯身致敬
  rationale: 本句已另有 יִפֵּל（俯伏），而 סגד 指向金像；译作“敬拜”保留偶像崇拜语境中的神学张力，并避免与“俯伏”重复。
- issue: 命令语气的表达
  choice: 就必须俯伏敬拜
  alternative: 就要俯伏敬拜
  rationale: 这是王所颁布命令的内容，“必须”清楚表达强制性，而不把命令误读为单纯的将来叙述。
translation_notes:
  register: 采用现代、庄重而易懂的叙事用语。“王啊”保留正式呼语；乐器名称尽量兼顾可读性与彼此区分。因多种古代乐器的准确形制不明，正文避免过度专业化，并以脚注明确关键不确定性。所有脚注标记均置于对应词后。
