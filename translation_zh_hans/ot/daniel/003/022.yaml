  source_fidelity: 正文准确保留了原文的因果链：王命严厉、火炉异常炽热，以及火焰烧死带三人上去的执行者。惟“抬上去”把原文泛指的“带上去／领上去”具体化为搬抬动作，缺乏必要依据。
