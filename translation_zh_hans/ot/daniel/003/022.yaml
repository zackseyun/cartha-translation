base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/022.yaml
  text: Because of this, since the king’s command was harsh and the furnace had been heated exceedingly, the flame of the fire killed those men who brought up Shadrach, Meshach, and Abed-nego.
translation:
  language: zh_hans
  text: 正因如此，王的命令十分严厉[a]，火炉又烧得异常炽热，那些把沙得拉、米煞、亚伯尼歌带上去的人，都被火焰烧死了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “严厉”也可译作“紧急”或“急迫”。
    reason: 亚兰文 מַחְצְפָה 在此可侧重命令的强硬严苛，也可能侧重其急迫性；正文按上下文选“严厉”，脚注保留词义歧义。
lexical_decisions:
- source_word: מַחְצְפָה
  choice: 十分严厉
  rationale: 该词在此形容王命的强硬、苛严；译作“十分严厉”既切合语境，也保留命令所带来的强制意味。
- source_word: אֵזֵה יַתִּירָא
  choice: 烧得异常炽热
  rationale: “异常”对应“格外、过度”，“炽热”自然表达窑火温度极高。
- source_word: הַסִּקוּ
  choice: 抬上去
  rationale: 该使役形式含“使上去、带上去”之意；结合三人被捆绑、士兵执行投窑的场景，“抬上去”比泛泛的“带去”更具体。
- source_word: שְׁבִיבָא דִּי נוּרָא
  choice: 火焰
  rationale: 原文直指火的烈焰；“火焰”简洁自然，并保留其作为施事者杀死士兵的句法力度。
theological_decisions:
- issue: 士兵死亡的直接原因
  choice: 都被火焰烧死了
  alternative: 火焰杀死了那些人
  rationale: 保留原文所说的直接原因，不额外说明这是神迹、审判或自然结果，以免替文本消解其叙事张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。人名使用中文圣经传统通行译名；句式保留“王命严厉—窑火异常炽热—执行者被烧死”的因果推进。
