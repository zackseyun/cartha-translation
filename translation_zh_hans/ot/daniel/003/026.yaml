  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: בֵּ/אדַ֜יִן קְרֵ֣ב נְבוּכַדְנֶצַּ֗ר לִ/תְרַע֮ אַתּ֣וּן נוּרָ֣/א יָקִֽדְתָּ/א֒ עָנֵ֣ה וְ/אָמַ֗ר שַׁדְרַ֨ךְ מֵישַׁ֧ךְ וַ/עֲבֵד נְג֛וֹ עַבְד֛וֹ/הִי דִּֽי אֱלָהָ֥/א עלי/א פֻּ֣קוּ וֶ/אֱת֑וֹ בֵּ/אדַ֣יִן נָֽפְקִ֗ין שַׁדְרַ֥ךְ מֵישַׁ֛ךְ וַ/עֲבֵ֥ד נְג֖וֹ מִן גּ֥וֹא נוּרָֽ/א־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/026.yaml
  text: Then Nebuchadnezzar came near to the door of the blazing fiery furnace[a]. He answered and said, “Shadrach, Meshach, and Abed-nego, servants of the Most High God, come out and come here.” Then Shadrach, Meshach[b], and Abed-nego came out from the midst of the fire.
translation:
  language: zh_hans
  text: 于是，尼布甲尼撒走近烈火窑的门口[a]，开口说：“沙得拉、米煞、亚伯尼歌，至高上帝的仆人，出来，到这里来！”于是，沙得拉、米煞、亚伯尼歌从火中出来了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “门口”也可译作“入口”。
    reason: 原词可指门、门洞或入口；窑炉的具体结构不明确，正文不应把它限定为装有门扇的门。
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: 于是
  rationale: 这是推进叙事次序的亚兰语连接词；“于是”自然地承接前事，并突出随后发生的行动。
- source_word: קְרֵב
  choice: 走近
  rationale: 该动词表示在空间上靠近；“走近”符合尼布甲尼撒向火窑入口移动的具体场景。
- source_word: לִתְרַע
  choice: 门口
  rationale: תְרַע可指门、门洞或入口。窑炉未必有现代意义上的门扇，因此正文用较自然且能涵盖入口位置的“门口”，脚注保留“入口”的可能。
- source_word: אַתּוּן נוּרָא יָקִדְתָּא
  choice: 烈火窑
  rationale: 原短语由“窑炉”“火”和“燃烧的”组合而成，具有强调意味；“烈火窑”简洁、自然，并保留火势猛烈的形象。
- source_word: עָנֵה וְאָמַר
  choice: 开口说
  rationale: 这是常见的闪语发言公式。此处前文没有直接问话，直译为“回答说”在现代汉语中容易误示有人提问；“开口说”保留引出郑重发言的功能。
- source_word: עַבְדוֹהִי
  choice: 仆人
  rationale: 该词可指仆役或奴仆；这里强调三人属于上帝并事奉他，“仆人”既忠实又符合尊称语境。
- source_word: אֱלָהָא עליא
  choice: 至高上帝
  rationale: 这是神圣称号，表达上帝的至高地位；“至高上帝”是现代中文中清楚、庄重的表达，不额外加入教义解释。
- source_word: פֻּקוּ
  choice: 出来
  rationale: 命令三人从窑火内部出来；按说话者站在外面的指向，译作“出来”最自然。
- source_word: וֶאֱתוֹ
  choice: 到这里来
  rationale: 这是紧接“出来”的第二个命令，要求三人进一步走向说话者；“到这里来”明确保留了趋向含义。
- source_word: מִן גּוֹא נוּרָא
  choice: 从火中
  rationale: גּוֹא表示内部或当中；“从火中”简洁而准确地说明他们原在火焰内部。
theological_decisions:
- issue: 神圣称号 אֱלָהָא עליא 的译法
  choice: 至高上帝
  alternative: 至高的上帝
  rationale: 将其作为完整称号翻译，保留尼布甲尼撒对上帝至高地位的承认，同时不把这一称呼扩展成经文未明说的系统神学论断。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。人名依照中文圣经传统通行音译；保留“于是”的连续使用，以反映原文两次 בֵּאדַיִן 所形成的叙事节奏。正文只设一条与相应词语直接对应的脚注，避免沿用英文咨询层中位置疑似错置的第二个脚注标记。
