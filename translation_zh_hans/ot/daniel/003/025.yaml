  naturalness: 整体为自然、庄重的现代汉语。“看哪”“行走”“毫无损伤”适合本段叙事语体。“第四个的样子”比“第四个的相貌”更适用于对人物整体可见形态的描述，也更自然。
  terminology: 不应将尼布甲尼撒的话在正文中定为“上帝的儿子”或“神的儿子”。“众神的一个儿子”保留其多神语境、复数形式和不定性；脚注可说明传统基督教的另一读法，但不把该读法当作亚兰文的直译。
