  to: 他回答说：“看哪！我看见四个人没有被捆绑，在火中行走，身上毫无损伤；第四个的样子好像众神的一个儿子[a]。”
  rationale: 修订仅澄清原文在“众神的一个儿子”中的复数和不定性，并以“样子”更准确自然地表达可见外观；其余译文可保留。
