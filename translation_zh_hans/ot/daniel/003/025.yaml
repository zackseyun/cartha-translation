base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/025.yaml
  text: He answered and said[a], “Look! I see four men unbound, walking in the midst of the fire, and there is no harm on them; and the appearance of the fourth is like a son of the gods.”
translation:
  language: zh_hans
  text: 他回答说：“看哪！我看见四个人没有被捆绑，在火中行走，身上毫无损伤；第四个的样子好像众神的一个儿子[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或按传统基督教解释译作“好像上帝的儿子”。亚兰文较直译为“好像众神的一个儿子”，反映尼布甲尼撒本人的视角。
    reason: 保留传统基督教读法，同时说明正文依据原文的比较语气、复数形式及说话者视角所作的选择。
lexical_decisions:
- source_word: הָא
  choice: 看哪！
  rationale: 这是引出强烈、突然观察的指示感叹词。“看哪”简洁庄重，也保留现场的惊异感。
- source_word: חָזֵה
  choice: 我看见
  rationale: 表达王正在报告眼前所见；现代汉语用“我看见”自然清楚。
- source_word: גֻּבְרִין אַרְבְּעָה
  choice: 四个人
  rationale: 此处指四名男性人物；“四个人”在现代汉语中自然，且上下文已明确被投入火中的三人。
- source_word: שְׁרַיִן
  choice: 没有被捆绑
  rationale: 与先前三人被捆绑后投入炉中的情形形成明确对照；比宽泛的“自由自在”更贴近原文意象。
- source_word: מַהְלְכִין
  choice: 行走
  rationale: 分词表示持续进行的动作；“行走”直接而庄重。
- source_word: בְּגוֹא נוּרָא
  choice: 在火中
  rationale: 准确表达位于火焰内部；汉语无需增添“正中央”也能自然传达原文方位。
- source_word: וַחֲבָל לָא אִיתַי בְּהוֹן
  choice: 身上毫无损伤
  rationale: 以自然汉语表达他们没有受到伤害，同时保留损伤不在他们身上的语义。
- source_word: רֵוֵהּ דִּי רביעיא
  choice: 第四个的相貌
  rationale: רֵוֵהּ 指可见的外貌或形态；“相貌”符合王对第四位人物外观的描述。
- source_word: דָּמֵה
  choice: 好像
  rationale: 保留比较而非身份认定，不把观察性描述改成确定判断。
- source_word: לְבַר אֱלָהִין
  choice: 神明之子
  rationale: בַר 是“儿子/子”，אֱלָהִין 为复数形式；从尼布甲尼撒的多神信仰视角，“神明之子”既能反映不定、类别性的表达，也避免在正文中预先认定为“上帝的儿子”。
theological_decisions:
- issue: 尼布甲尼撒所说第四位人物的身份
  choice: 按王自身的观察和宗教视角译为“好像神明之子”
  alternative: “好像上帝的儿子”或“好像上帝之子”
  rationale: 亚兰文是比较性的描述，并未在本节明确认定该人物身份；复数 אֱלָהִין 在异教君王口中最自然地指“神明”。第28节又由王称其为上帝差来的使者。因此正文不把后来的基督论理解直接写入王的话中，但以脚注保留传统基督教读法。
translation_notes:
  register: 采用现代、庄重且易懂的叙事语言。“看哪”保留突发惊叹的语气；“毫无损伤”比生硬的直译更符合现代汉语。脚注标记[a]已置于相关短语之后。
