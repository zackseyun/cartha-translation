source:
  edition: WLC
  text: עָנֵ֤ה נְבֻֽכַדְנֶצַּר֙ וְ/אָמַ֣ר לְ/ה֔וֹן הַ/צְדָּ֕א שַׁדְרַ֥ךְ מֵישַׁ֖ךְ וַ/עֲבֵ֣ד נְג֑וֹ לֵֽ/אלָהַ֗/י לָ֤א אִֽיתֵי/כוֹן֙ פָּֽלְחִ֔ין וּ/לְ/צֶ֧לֶם דַּהֲבָ֛/א דִּ֥י הֲקֵ֖ימֶת לָ֥א סָֽגְדִֽין׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/014.yaml
  text: Nebuchadnezzar answered and said to them[a], “Is it true, Shadrach, Meshach, and Abed-nego, that you do not serve my god and do not bow down to the golden image that I have set up?”
translation:
  language: zh_hans
  text: 尼布甲尼撒对他们说[a]：“沙得拉、米煞、亚伯尼歌，你们不事奉我的神，也不向我所立的金像下拜，这是真的吗？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 亚兰文“这是真的吗”也可理解为“这是故意的吗”或“你们是有意这样做的吗”。
    reason: 保留 הַצְדָּא 在“事实属实”与“有意而为”之间的词义可能。
lexical_decisions:
- source_word: עָנֵה ... וְאָמַר
  choice: 对他们说
  rationale: 这是亚兰文叙事中引出话语的惯用组合。现代汉语通常直接译为“说”，比机械地译作“回答说”更自然；结合 לְהוֹן 译出“对他们”。
- source_word: הַצְדָּא
  choice: 这是真的吗
  rationale: 此词在语境中可指事情属实，也可能强调行为出于故意。正文采用符合听取控告后核实事实这一语境的“这是真的吗”，并用脚注保留另一种可能。
- source_word: שַׁדְרַךְ מֵישַׁךְ וַעֲבֵד נְגוֹ
  choice: 沙得拉、米煞、亚伯尼歌
  rationale: 采用现代中文圣经读者较熟悉的人名音译，清楚而庄重。
- source_word: לֵאלָהַי
  choice: 我的神
  rationale: 该形式在本分句中按单数并带第一人称单数后缀理解，故译为“我的神”，不改作复数“我的众神”。
- source_word: פָּלְחִין
  choice: 事奉
  rationale: 该动词表示服事，尤其可指宗教礼仪中的事奉；译作“事奉”既符合语境，也与后面的身体俯伏动作相区分。
- source_word: וּלְצֶלֶם דַּהֲבָא
  choice: 金像
  rationale: 这是“金的像”的自然现代汉语表达，也与本章反复出现的偶像主题相符。
- source_word: דִּי הֲקֵימֶת
  choice: 我所立的
  rationale: 简洁表达君王先前把金像竖立起来的动作及其在当前场景中的持续关联。
- source_word: סָגְדִין
  choice: 下拜
  rationale: 该动词具体指俯伏、跪拜或以身体动作表示敬意。“下拜”保留这一身体动作，并与“事奉”形成源文中的词义区别。
theological_decisions:
- issue: 是否把两个表示偶像崇拜行为的不同动词合并为一个笼统的“敬拜”
  choice: 分别译为“事奉”和“下拜”
  alternative: 将其中一个或两个都译为“敬拜”
  rationale: 亚兰文分别使用表示宗教性服事和俯伏下拜的动词。保留两者可呈现原文的修辞力度，也避免把不同动作归并为源文没有明说的单一神学范畴。
- issue: הַצְדָּא 的语义取向
  choice: 正文译为“这是真的吗”
  alternative: “你们是故意这样做的吗”或“这是有意的吗”
  rationale: 该词在此既可能询问控告是否属实，也可能质问三人是否故意抗命。正文按君王听取控告后核实事实的直接语境处理，脚注保留“故意”的可能，以免消除原文张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“事奉”保留宗教语境中的正式感，“下拜”则清楚呈现身体动作。脚注标记置于“说”之后，提示它涉及随后整句问话的语气与含义。
