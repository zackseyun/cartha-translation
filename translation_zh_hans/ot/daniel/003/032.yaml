base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/032.yaml
  text: It has seemed good to me to declare the signs and wonders that the Most High God has done for me[a][b].
translation:
  language: zh_hans
  text: 我认为，宣告至高的上帝在我身上[b]所行的神迹奇事，是合宜的[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我认为应当使人知道。”原文是表示认可、认为合宜或决意的正式王室用语。
    reason: lexical_alternative
  - marker: b
    text: “在我身上”原文字面为“与我”；可指与我有关或发生在我身上的作为。
    reason: lexical_alternative
lexical_decisions:
- source_word: אָתַיָּא
  choice: 神迹
  rationale: 指具有标记意义的超常作为；与“奇事”并列时，“神迹”是现代中文圣经语体中自然、庄重且易懂的表达。
- source_word: וְתִמְהַיָּא
  choice: 奇事
  rationale: 指令人惊异的作为，与“神迹”构成固定的意义配对，也保留原文的崇高语气。
- source_word: דִּי
  choice: 所
  rationale: 引出修饰“神迹奇事”的关系分句；中文用“所行的”表达最自然。
- source_word: עֲבַד
  choice: 行
  rationale: 基本义为“做、施行”；“所行的神迹奇事”符合现代庄重中文，也不过度解释其性质。
- source_word: עִמִּי
  choice: 为我
  rationale: 原文字面为“与我”，在此表示上帝在尼布甲尼撒身上或与他有关的作为；正文采用自然的“为我”，并以脚注保留字面范围。
- source_word: אֱלָהָא עִלָּיָא
  choice: 至高的上帝
  rationale: 直接传达该亚兰文神圣称号的最高级含义，不加入后期教义表述。
- source_word: שְׁפַר קֳדָמַי
  choice: 我乐意
  rationale: 这是表示认可、认为合宜或作出决定的王室公文习语；“我乐意”在中文中简洁自然，同时保留说话者公开宣告的意愿。
- source_word: לְהַחֲוָיָה
  choice: 宣告
  rationale: 意为“使人知道、公布”；在王室公告语境中译作“宣告”最为贴切。
theological_decisions:
- issue: 神圣称号 אֱלָהָא עִלָּיָא 的译法
  choice: 至高的上帝
  alternative: 至高上帝
  rationale: 保留原文明确的尊称及最高级意义，并用自然现代中文表达，不引入源文没有的教义限定。
- issue: עִמִּי 所描述的上帝作为与尼布甲尼撒的关系
  choice: 为我所行
  alternative: 在我身上所行；与我所行
  rationale: “为我”符合上下文并自然可读，但原介词的范围可包括“与我有关”或“在我身上”；因此用脚注保存这一真实的词义张力，避免把它仅限于施惠含义。
translation_notes:
  register: 采用现代、庄重而易懂的公告语体。“神迹奇事”保留成对表达；句序调整为先提出上帝的作为，再陈明宣告的意愿，使中文流畅，同时不改变原文重点。
