base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/006.yaml
  text: And whoever does not fall down and worship shall in that hour be thrown into the midst of a furnace of blazing fire[a].
translation:
  language: zh_hans
  text: 凡不俯伏敬拜的，必在那时被扔进烈火的窑炉中。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 阿拉姆语直译为“在那时刻”；此处也可理解为“立即”或“马上”。
    reason: 保留时间短语的字面表达及其可能的惯用含义。
lexical_decisions:
- source_word: וּמַן דִּי
  choice: 凡……的
  rationale: 这一阿拉姆语不定关系表达引出普遍适用的条件；“凡……的”自然、庄重，并保留其概括性。
- source_word: לָא יִפֵּל
  choice: 不俯伏
  rationale: 该动词字面为“倒下”，在此指伏身表示臣服；“俯伏”既体现身体动作，也符合现代中文叙事。
- source_word: וְיִסְגֻּד
  choice: 敬拜
  rationale: 该词可指伏拜、致敬；本处对象是像，带有宗教性。“敬拜”传达这一层面，同时前面的“俯伏”已呈现身体姿态。
- source_word: בַּהּ שַׁעֲתָא
  choice: 在那时
  rationale: 较贴近原文“在那时刻”的表达，不把语义直接收窄为“立刻”；上下文中的即时执行意味另以脚注说明。
- source_word: יִתְרְמֵא
  choice: 必……被扔进
  rationale: 保留原文被动意义；“必”表达敕令中的确定后果，“扔进”是自然现代汉语。
- source_word: לְגוֹא
  choice: 进……中
  rationale: 表达进入内部或当中；中文“扔进……中”简洁自然，并保留方向和内部位置。
- source_word: אַתּוּן
  choice: 窑
  rationale: 该词指大型炉窑；叙事语境中“窑”简明自然，也能与燃烧烈火的场景相合。
- source_word: נוּרָא יָקִדְתָּא
  choice: 烈火
  rationale: 原文为“燃烧的火”，具有加强意味；“烈火”以自然凝练的中文传达熊熊燃烧之火。
