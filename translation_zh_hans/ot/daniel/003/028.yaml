source:
  edition: WLC
  text: עָנֵ֨ה נְבֽוּכַדְנֶצַּ֜ר וְ/אָמַ֗ר בְּרִ֤יךְ אֱלָהֲ/הוֹן֙ דִּֽי שַׁדְרַ֤ךְ מֵישַׁךְ֙ וַ/עֲבֵ֣ד נְג֔וֹ דִּֽי שְׁלַ֤ח מַלְאֲכֵ/הּ֙ וְ/שֵׁיזִ֣ב לְ/עַבְד֔וֹ/הִי דִּ֥י הִתְרְחִ֖צוּ עֲל֑וֹ/הִי וּ/מִלַּ֤ת מַלְכָּ/א֙ שַׁנִּ֔יו וִ/יהַ֣בוּ גשמי/הון דִּ֠י לָֽא יִפְלְח֤וּן וְ/לָֽא יִסְגְּדוּן֙ לְ/כָל אֱלָ֔הּ לָהֵ֖ן לֵ/אלָֽהֲ/הֽוֹן־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/028.yaml
  text: Nebuchadnezzar answered and said[a], “Blessed be the God of Shadrach, Meshach, and Abed-nego, who sent his angel and delivered his servants, who trusted in him, and set aside the king’s command, and gave up their bodies[c][b], that they might not serve or worship any god except their own God.”
translation:
  language: zh_hans
  text: 尼布甲尼撒回应说：“沙得拉、米煞、亚伯尼歌的上帝当受颂赞！他差遣自己的天使[a]，救了倚靠他的仆人。他们置王的命令于不顾[b]，宁愿舍身[c]，也不事奉、不下拜任何别的神，只事奉、下拜自己的上帝。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“使者”。亚兰文原词既可指“天使”，也可指“使者”。
    reason: lexical_alternative
  - marker: b
    text: 字面为“改变了王的话”，在这里指拒绝遵行或把王的命令置于一旁。
    reason: lexical_alternative
  - marker: c
    text: 字面为“交出自己的身体”，即甘愿让身体遭受苦难或死亡。
    reason: literal_rendering
lexical_decisions:
- source_word: עָנֵה ... וְאָמַר
  choice: 回应说
  rationale: 这是亚兰文叙事中引出发言的惯用公式；“回应说”既保留其形式，也不暗示此前必有明确提问。
- source_word: בְּרִיךְ
  choice: 当受颂赞
  rationale: 保留祝颂和赞美的语气，比单纯陈述“是有福的”更符合此处颂赞上帝的语境。
- source_word: אֱלָהֲהוֹן דִּי שַׁדְרַךְ מֵישַׁךְ וַעֲבֵד נְגוֹ
  choice: 沙得拉、米煞、亚伯尼歌的上帝
  rationale: 所属后缀由随后列出的三个人名具体说明，中文用“……的上帝”最清楚自然。
- source_word: שְׁלַח מַלְאֲכֵהּ
  choice: 差遣自己的天使
  rationale: מַלְאָךְ 可指天使或使者；在神迹性拯救的语境中，“天使”较自然，同时以脚注保留“使者”这一词义。
- source_word: וְשֵׁיזִב
  choice: 救了
  rationale: 该动词表示从危险中搭救；“救了”简洁自然，也准确对应从火窑中获救的具体情境。
- source_word: לְעַבְדֹוהִי
  choice: 他的仆人
  rationale: 在效忠和敬拜的语境中，“仆人”是庄重而自然的现代中文表达。
- source_word: הִתְרְחִצוּ עֲלֹוהִי
  choice: 倚靠他
  rationale: 该反身形式表达把信心寄托于某人；“倚靠他”保留关系性和信赖之意。
- source_word: וּמִלַּת מַלְכָּא שַׁנִּיו
  choice: 置王的命令于不顾
  rationale: 字面涉及“改变王的话”，在上下文中指拒绝遵行王命；正文采用自然且不含混的功能对等表达，脚注保留字面意象。
- source_word: וִיהַבוּ גֶשְׁמֵיהוֹן
  choice: 宁愿舍身
  rationale: 原文为“交出自己的身体”，表达他们甘愿让身体遭受危险甚至死亡，而不顺从偶像崇拜；“宁愿舍身”自然凝练，脚注注明字面形式。
- source_word: לָא יִפְלְחוּן וְלָא יִסְגְּדוּן
  choice: 不事奉、不下拜
  rationale: 分别保留宗教服事与俯伏下拜两个动作，避免将两词合并成单一的“敬拜”。
- source_word: לָהֵן
  choice: 只
  rationale: 该词标示排除性例外；中文以“任何别的神，只……”自然表达“除了……以外”的意思。
theological_decisions:
- issue: מַלְאֲכֵהּ 所指形象的身份
  choice: 自己的天使
  alternative: 自己的使者；某些解释将其进一步认定为神显或基督显现
  rationale: 亚兰文词本身可指“天使”或“使者”。本节是尼布甲尼撒的陈述，并未要求译文进一步确定该形象的神学身份，因此正文采用语境中自然的“天使”，脚注保留词义上的另一可能，不加入后来的特定认定。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“当受颂赞”保留颂赞语气；“置……于不顾”和“宁愿舍身”使亚兰文习语在中文中自然清楚；“事奉、不下拜”保留原文两个并列动词的区别。所有脚注标记均已置于正文相应位置。
