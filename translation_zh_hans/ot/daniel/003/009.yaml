lexical_decisions:
- source_word: עֲנוֹ וְאָמְרִין
  choice: 他们回答……说
  rationale: 保留亚兰文常用的叙事答话公式；现代汉语中“回答……说”自然且忠实。
- source_word: לִנְבוּכַדְנֶצַּר מַלְכָּא
  choice: 尼布甲尼撒王
  rationale: 介词标明答话对象，首个“王”是尼布甲尼撒的称号；汉语通常将“王”置于姓名之后。
- source_word: מַלְכָּא（第二次）
  choice: 王
  rationale: 第二次出现的称号是直接称呼；“愿王……”以简洁庄重的宫廷语气表达呼格作用。
- source_word: לְעָלְמִין חֱיִי
  choice: 愿王万岁
  rationale: 原文直译近于“愿你活到永远／万世”；在对君王的宫廷祝颂中，汉语“愿王万岁”既传达祈愿语气，也自然保留惯用的永远长存之意。
