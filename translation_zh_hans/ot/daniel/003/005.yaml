id: DAN.3.5
reference: Daniel 3:5
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: בְּ/עִדָּנָ֡/א דִּֽי תִשְׁמְע֡וּן קָ֣ל קַרְנָ֣/א מַ֠שְׁרוֹקִיתָ/א קיתרוס סַבְּכָ֤א פְּסַנְתֵּרִין֙ סוּמְפֹּ֣נְיָ֔ה וְ/כֹ֖ל זְנֵ֣י זְמָרָ֑/א תִּפְּל֤וּן וְ/תִסְגְּדוּן֙ לְ/צֶ֣לֶם דַּהֲבָ֔/א דִּ֥י הֲקֵ֖ים נְבוּכַדְנֶצַּ֥ר מַלְכָּֽ/א־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/005.yaml
  text: At the time when you hear the sound of the horn[a], pipe, lyre, trigon, psaltery, bagpipe, and every kind of music[b], you are to fall down and pay homage to the golden image that King Nebuchadnezzar has set up.
translation:
  language: zh_hans
  text: 你们一听见角、笛、琴、三角琴、瑟、风笛[a]和各样乐器的声音，就要俯伏，向尼布甲尼撒王所立的金像下拜[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “风笛”所对应的亚兰语乐器名称具体指什么并不确定；也有人译作“双管笛”。
    reason: lexical_alternative
  - marker: b
    text: “下拜”也可译作“敬拜”；亚兰语动词可指俯伏致敬，在这里向金像下拜的语境中带有偶像崇拜的含义。
    reason: alternative_reading
lexical_decisions:
- source_word: בְּעִדָּנָא דִּי תִשְׁמְעוּן
  choice: 你们一听见
  rationale: 原文是“在你们听见……的时候”；汉语用“一听见”自然地表达时间关系及随即执行命令的语境。
- source_word: קַרְנָא
  choice: 角
  rationale: 泛指角制或角形吹奏乐器，不限定为羊角或近代短号。
- source_word: מַשְׁרוֹקִיתָא
  choice: 笛
  rationale: 指管笛类吹奏乐器；“笛”简明自然，同时避免过度细分。
- source_word: קיתרוס
  choice: 琴
  rationale: 该借词指基塔拉琴一类弦乐器；“琴”适合普通现代读者，也不武断指定其精确形制。
- source_word: סַבְּכָא
  choice: 三角琴
  rationale: 通常理解为三角形弦乐器，但确切形制不明；该译名兼顾传统辨识度与可能的器形。
- source_word: פְּסַנְתֵּרִין
  choice: 瑟
  rationale: 指一种拨弦乐器；“瑟”是中文圣经语境中简洁且可辨识的对应词，并与前后乐器区分。
- source_word: סוּמְפֹּנְיָה
  choice: 风笛
  rationale: 具体所指存在争议；正文采用常见理解“风笛”，并以脚注保留“双管笛”等可能。
- source_word: וְכֹל זְנֵי זְמָרָא
  choice: 和各样乐器的声音
  rationale: 短语直译近于“各类音乐”；在乐器清单中，汉语补出“乐器的声音”，使整句搭配自然，并保留总括含义。
- source_word: תִּפְּלוּן
  choice: 就要俯伏
  rationale: 原文未完成式在王命语境中具有命令效力；“就要”承接“一听见”，表达必须立即行动。
- source_word: וְתִסְגְּדוּן
  choice: 下拜
  rationale: 该动词表示俯身致敬或敬拜；“下拜”保留外在俯伏动作及在偶像语境中的宗教含义，而不把词义完全收窄为“敬拜”。
- source_word: לְצֶלֶם דַּהֲבָא דִּי הֲקֵים נְבוּכַדְנֶצַּר מַלְכָּא
  choice: 向尼布甲尼撒王所立的金像
  rationale: 依照原文关系结构，清楚标明下拜的对象以及立像者。
theological_decisions:
- issue: 偶像语境中 סגד 的译法
  choice: 下拜
  alternative: 敬拜
  rationale: 该词本义可指俯伏、致敬，也可在宗教语境中指敬拜。本节对象是金像，行为显然具有偶像崇拜性质；正文用“下拜”保留词汇本身的动作性与神学张力，脚注说明“敬拜”这一可能译法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“角、笛、琴、三角琴、瑟、风笛”保持清单节奏；对无法确证的古代乐器不作过度精确的现代分类。所有脚注标记均置于正文相应词语之后。
