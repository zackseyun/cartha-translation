id: DAN.3.3
reference: Daniel 3:3
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: בֵּ/אדַ֡יִן מִֽתְכַּנְּשִׁ֡ין אֲחַשְׁדַּרְפְּנַיָּ֡/א סִגְנַיָּ֣/א וּֽ/פַחֲוָתָ֡/א אֲדַרְגָּזְרַיָּ֣/א גְדָבְרַיָּ/א֩ דְּתָ֨בְרַיָּ֜/א תִּפְתָּיֵ֗/א וְ/כֹל֙ שִׁלְטֹנֵ֣י מְדִֽינָתָ֔/א לַ/חֲנֻכַּ֣ת צַלְמָ֔/א דִּ֥י הֲקֵ֖ים נְבוּכַדְנֶצַּ֣ר מַלְכָּ֑/א ו/קאמין לָ/קֳבֵ֣ל צַלְמָ֔/א דִּ֥י הֲקֵ֖ים נְבוּכַדְנֶצַּֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/003.yaml
  text: Then the satraps[a], the prefects, and the governors, the counselors, the treasurers, the judges, the magistrates, and all the officials of the provinces were assembled for the dedication of the image that King Nebuchadnezzar had set up, and they stood before the image that Nebuchadnezzar had set up.
translation:
  language: zh_hans
  text: 于是，总督、长官、省长、谋士、司库、法官、司法官，以及各省所有官员，都聚集来参加尼布甲尼撒王所立之像[a]的奉献礼。他们站在尼布甲尼撒所立的像前。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“雕像”。亚兰文“像”可指实体的像或大型立像。
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: 于是
  rationale: 作为亚兰文叙事推进标记，承接上文并引出随后的集会；“于是”自然、庄重。
- source_word: מִתְכַּנְּשִׁין
  choice: 都聚集
  rationale: 该被动／反身分词表达众人集合；汉语用主动式“聚集”更自然，“都”与官员名单相呼应。
- source_word: אֲחַשְׁדַּרְפְּנַיָּא
  choice: 总督
  rationale: 指波斯帝国体系中的高级地方行政长官；采用现代读者易懂的惯用对应词，并与后列官职区分。
- source_word: סִגְנַיָּא
  choice: 长官
  rationale: 表示一种行政官职，但确切层级不完全清楚；“长官”保留其概括性，避免过度确定。
- source_word: פַחֲוָתָא
  choice: 省长
  rationale: 常指辖区或省级统治官员；“省长”简明，并能与前两个行政头衔区分。
- source_word: אֲדַרְגָּזְרַיָּא
  choice: 谋士
  rationale: 该官职的确切职责存在不确定性，通常理解为高级顾问类官员；“谋士”保留咨询职能而不过度细化。
- source_word: גְדָבְרַיָּא
  choice: 司库
  rationale: 通常指掌管国库或财务的官员；“司库”凝练且符合正式官职语域。
- source_word: דְּתָבְרַיָּא
  choice: 法官
  rationale: 大概指承担审判职能的官员；“法官”是现代汉语中最直接清楚的表达。
- source_word: תִּפְתָּיֵא
  choice: 司法官
  rationale: 指另一类法律或行政官员，确切职能不明；“司法官”既保留法律行政色彩，也与“法官”有所区别。
- source_word: כֹל שִׁלְטֹנֵי מְדִינָתָא
  choice: 各省所有官员
  rationale: 这是概括其余地方掌权者的总称；“官员”涵盖面适当，“各省所有”忠实体现范围。
- source_word: לַחֲנֻכַּת
  choice: 来参加……的奉献典礼
  rationale: 指为所立之像举行的正式启用或奉献仪式；补出“典礼”使现代汉语顺畅，同时保留奉献含义。
- source_word: צַלְמָא
  choice: 像
  rationale: 该词可指形像、雕像或巨型人像；“像”保留较宽语义，不预断其具体形态。
- source_word: לָקֳבֵל
  choice: 在……前
  rationale: 表示面对或位于该像之前；译作“在……前”简洁自然。
theological_decisions: []
