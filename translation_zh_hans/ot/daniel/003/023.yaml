base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/023.yaml
  text: And these three men—Shadrach[a], Meshach[b], and Abed-nego—fell bound into the midst of the blazing furnace.
translation:
  language: zh_hans
  text: 这三个人——沙得拉、米煞、亚伯尼歌——仍被捆着，落入烈火的窑中。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文动词直译为“落下”；结合上文，也可理解为“被扔进烈火的窑中”。
    reason: lexical_alternative
lexical_decisions:
- source_word: גֻבְרַיָּא אִלֵּךְ תְּלָתֵּהוֹן
  choice: 这三个人
  rationale: 按亚兰语直译为“这三个男人/人”；上下文已明确所指，现代汉语用“这三个人”自然准确。
- source_word: שַׁדְרַךְ מֵישַׁךְ וַעֲבֵד נְגוֹ
  choice: 沙得拉、米煞、亚伯尼歌
  rationale: 采用现代中文圣经读者熟悉的人名音译，同时依原文列出三人的名字。
- source_word: נְפַלוּ
  choice: 落入
  rationale: 原动词本义是“落下、掉落”。译作“落入”保留其直接语义，不在正文中改写为上下文所暗示的“被扔进”。
- source_word: לְגוֹא
  choice: ……中
  rationale: 该词表示内部或当中；“落入……中”在现代汉语里自然地传达进入窑内的空间意义。
- source_word: אַתּוּן נוּרָא יָקִדְתָּא
  choice: 烈火窑
  rationale: 短语指有熊熊燃火的窑炉。“烈火窑”简洁、自然，并保留火势猛烈的意象。
- source_word: מְכַפְּתִין
  choice: 被捆绑着
  rationale: 被动分词表示他们处于被捆绑的状态；“被捆绑着”既表达被动，也凸显他们落入窑中时仍被绑住。
