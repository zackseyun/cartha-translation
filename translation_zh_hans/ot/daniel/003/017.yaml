  text: הֵ֣ן אִיתַ֗י אֱלָהַ֨/נָא֙ דִּֽי אֲנַ֣חְנָא פָֽלְחִ֔ין יָכִ֖ל לְ/שֵׁיזָבוּתַ֑/נָא מִן אַתּ֨וּן נוּרָ֧/א יָקִֽדְתָּ֛/א וּ/מִן יְדָ֥/ךְ מַלְכָּ֖/א יְשֵׁיזִֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/017.yaml
  text: If it is so[a], our God whom we serve is able to deliver us from the furnace of blazing fire, and he will deliver us from your hand[c][b], O king.
translation:
  language: zh_hans
  text: 如果事情真是这样[a]，我们所侍奉的上帝能把我们从熊熊燃烧的火窑[b]中救出来；王啊，他也必救我们脱离你的手[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较直译为“如果有这种情形”。这个亚兰语开头承接王刚才所威胁的刑罚。
    reason: lexical_alternative
  - marker: b
    text: 或译“从燃烧着烈火的窑中”。原文同时包含“窑”“火”和“燃烧”的意思。
    reason: lexical_alternative
  - marker: c
    text: 或译“他也可能救我们”，或“愿他救我们”。这里的亚兰语形式可有不同理解；正文将其译为充满信心的将来断言。
    reason: alternative_reading
lexical_decisions:
- source_word: הֵן אִיתַי
  choice: 即便如此
  rationale: 这个亚兰语习语承接王所威胁的刑罚，构成条件性的开头。译作“即便如此”既自然，也保留“若事情果真如此”的含义。
- source_word: אֱלָהַנָא דִּי אֲנַחְנָא פָלְחִין
  choice: 我们所侍奉的上帝
  rationale: פְּלַח在此指带有敬拜意味的服侍；“侍奉”既保留其基本词义，也由上下文显明宗教含义。
- source_word: יָכִל
  choice: 能够
  rationale: 直接表达上帝具有施行拯救的能力，并保持庄重、自然的现代汉语。
- source_word: לְשֵׁיזָבוּתַנָא
  choice: 把我们……救出来
  rationale: 该词表示从危险中搭救；此译明确呈现从火窑中获救的具体情境。
- source_word: מִן אַתּוּן נוּרָא יָקִדְתָּא
  choice: 从烈火熊熊的窑中
  rationale: 兼顾“窑”“火”和“燃烧、炽烈”三个语义成分，同时符合现代汉语表达。
- source_word: וּמִן יְדָךְ
  choice: 脱离你的手
  rationale: 保留“手”的原文比喻，指脱离王的权势和控制。
- source_word: מַלְכָּא
  choice: 王啊
  rationale: 明确表达呼格，保留三人对王直接而庄重的称呼。
- source_word: יְשֵׁיזִב
  choice: 他也必救我们
  rationale: 正文将未完成式理解为充满信心的将来陈述；“必”传达其断言力度，“也”连接上帝的能力与行动。
theological_decisions:
- issue: 末尾未完成式 יְשֵׁיזִב 的语气
  choice: 充满信心的将来断言：“他也必救我们”
  alternative: 可理解为可能语气“他也能救我们”，或祈愿语气“愿他救我们”
  rationale: 本节的句法和对王说话的语境支持信心坚定的陈述。下一节仍承认上帝可能不按他们所期待的方式施行拯救，因此这里不必弱化为单纯的愿望；两节之间的神学张力应予保留。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“侍奉”“脱离你的手”保留经文的宗教语域和原文意象；“烈火熊熊的窑”避免生硬叠词，同时完整呈现火窑的炽烈。所有脚注标记均置于相应正文位置。
