base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/031.yaml
  text: 'King Nebuchadnezzar[a], to all peoples, nations[b], and languages that dwell in all the earth: May your peace abound.'
translation:
  language: zh_hans
  text: 尼布甲尼撒王，致住在全地[b]的各族、各国和说各种语言的人：愿你们的平安增多[a]！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“愿你们的平安倍增。”
    reason: lexical_alternative
  - marker: b
    text: “全地”是帝国文告中的惯用说法，在这里可能是修辞性的表达，意思近于“全国各地”或“整个疆域”。
    reason: cultural_note
lexical_decisions:
- source_word: מַלְכָּא
  choice: 王
  rationale: 该名词与专名构成同位称号；按现代汉语王室称谓习惯译作“尼布甲尼撒王”。
- source_word: לְכָל עַמְמַיָּא אֻמַיָּא וְלִשָּׁנַיָּא
  choice: 致……各族、各国和说各种语言的人
  rationale: 保留帝国文告中涵盖臣民群体的三重表达；将字面上的“语言”自然地表达为“说各种语言的人”，避免把抽象语言本身当作收信对象。
- source_word: דִּי דארין
  choice: 住在
  rationale: 关系词加分词描述受文者的居住范围；“住在”符合现代汉语，同时保留持续居住的含义。
- source_word: בְּכָל אַרְעָא
  choice: 全地
  rationale: אַרְעָא 可指“地、土地、国土”；“全地”保留帝国文告刻意扩大的普世性措辞，其修辞性质另以脚注说明。
- source_word: שְׁלָמְכוֹן
  choice: 你们的平安
  rationale: 该词涵盖平安、福祉与安康；“平安”既保留闪语问安公式，也为现代读者所熟悉。
- source_word: יִשְׂגֵּא
  choice: 增多
  rationale: 该动词意为增长、增大；“愿……增多”较直接地保留祈愿结构及数量增长的意象，不把它缩减为一般问候。
