    issue: “几个”可能不当地缩小不定复数的数量范围。
    rationale: וּלְגֻבְרִין 为泛指的复数“人”，上下文没有表明“少数几个”；“一些”保留原文的不定性。
  - severity: low
    issue: “烈火窑里”将“炉／窑、火、燃烧的”压缩为复合词，火的成分不如“烈火的窑中”明确。
    rationale: 原文的炉（窑）与火及其燃烧状态均有表达；修订可在自然汉语中更完整地呈现这一意象。
