base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/020.yaml
  text: And he commanded certain mighty men of valor who were in his army to bind Shadrach[a], Meshach, and Abednego, to throw them into the blazing furnace of fire.
translation:
  language: zh_hans
  text: 他又命令军中一些勇猛的战士，把沙得拉、米煞、亚伯尼歌捆起来，扔进烈火的窑中。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּלְגֻבְרִין גִּבָּרֵי חַיִל
  choice: 几个勇猛的壮士
  rationale: 该词组指强壮能干、具有战斗力的人；结合下文“在他的军队中”，译作“勇猛的壮士”既保留力量与军事色彩，也符合现代汉语表达。“几个”自然传达原文不定指的复数人物。
- source_word: דִּי בְחַיְלֵהּ
  choice: 军中
  rationale: חַיִל 在此指王的军事力量或军队；“军中”简洁自然，并准确表达这些壮士属于他的军队。
- source_word: אֲמַר
  choice: 命令
  rationale: 该动词本可表示“说”，但其后接两个目的性不定式，语境明确是发布指令，因此译作“命令”。
- source_word: לְכַפָּתָה
  choice: 捆起来
  rationale: 原词表示捆绑；“捆起来”是现代汉语中自然、具体的叙事用语。
- source_word: לְשַׁדְרַךְ מֵישַׁךְ וַעֲבֵד נְגוֹ
  choice: 沙得拉、米煞、亚伯尼歌
  rationale: 采用现代中文圣经读者较熟悉的人名音译，保持三个人名的清晰辨识。
- source_word: לְמִרְמֵא
  choice: 扔进
  rationale: 该动词意为投掷、扔入；“扔进”准确呈现动作方向，也比传统的“投在”更符合现代汉语。
- source_word: לְאַתּוּן נוּרָא יָקִדְתָּא
  choice: 烈火窑里
  rationale: 短语由“窑炉”“火”和“燃烧的”构成。“烈火窑”以简洁自然的中文保留炽烈燃烧的火窑意象，避免生硬堆叠为“燃烧着火的窑”。
theological_decisions: []
translation_notes:
  register: 采用庄重而流畅的现代标准汉语。句法按汉语习惯安排为“命令对象—执行动作”，同时保留原文中捆绑并投入火窑的动作次序。
