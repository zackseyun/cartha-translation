  naturalness: “烈火熊熊的炉”可理解，但“烈焰熊熊的火炉”在现代标准汉语中更自然。“他们还穿着……，就被捆绑起来”清楚表达原文“穿着这些衣物而被捆绑”的状态，避免句首“穿着”在结构上略显悬置。
  terminology: “裤子”“斗篷”“其他衣物”可保留。将“内衣”改为“短袍”，避免把词义未定的罕见词解释为内着衣；脚注保留“头巾”这一重要替代释义。
