  to: 于是，这些人还穿着裤子、短袍[a]、斗篷和其他衣物，就被捆绑起来，扔进烈焰熊熊的火炉中[b]。
  rationale: 修订仅处理词义不确定性与汉语表达：以较中性的“短袍”替代过度具体的“内衣”，保留脚注异译；调整句式以体现他们仍穿着所列衣物时被捆绑，并将火炉短语改为更自然的现代汉语。未改变经文的事件顺序、受事焦点或神学含义。
