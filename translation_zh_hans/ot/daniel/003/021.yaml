base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/021.yaml
  text: Then these men were bound in their trousers[a], their tunics, their cloaks, and their other garments[b], and they were thrown into the midst of the blazing furnace.
translation:
  language: zh_hans
  text: 于是，这些人还穿着裤子、短袍[a]、斗篷和其他衣物，就被捆绑起来，扔进烈焰熊熊的火炉中[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “短袍”所译的亚兰语词十分罕见，确切所指不能确定；或译“头巾”。
    reason: lexical_alternative
  - marker: b
    text: 直译：“燃烧之火的炉子。”
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: 于是
  rationale: 这是承接前文、推进事件的亚兰语叙事标记；“于是”符合现代汉语叙事习惯。
- source_word: גֻּבְרַיָּא אִלֵּךְ
  choice: 这些人
  rationale: 名词复数加近指指示词，回指前文所说的三人。
- source_word: כְּפִתוּ
  choice: 被捆绑起来
  rationale: 保留被动意义，也清楚表达他们在被投入火炉前受到捆绑。
- source_word: סַרְבָּלֵיהוֹן
  choice: 穿着裤子
  rationale: 该波斯语借词较可能指下身所穿的裤子；结合“被捆绑”译为“穿着裤子……被捆绑起来”，使亚兰语介词所表达的穿戴状态在汉语中自然呈现。
- source_word: פטישי/הון
  choice: 内衣
  rationale: 这是罕见且所指不确定的服饰词；在服饰清单中译作“内衣”，与裤子和斗篷有所区分，同时用脚注保留“头巾”的重要异译。
- source_word: כַרְבְּלָתְהוֹן
  choice: 斗篷
  rationale: 该词指披在外面的衣物或披风；“斗篷”是清楚、简洁的现代汉语对应词。
- source_word: לְבֻשֵׁיהוֹן
  choice: 其他衣服
  rationale: 这是泛指衣着的词，列在几件具体服饰之后；加“其他”体现其概括补充作用。
- source_word: וּרְמִיו
  choice: 扔进
  rationale: 上下文中这些人是动作承受者；与前面的“被捆绑起来”共用被动结构，既合乎汉语，也保留叙事焦点。
- source_word: לְגוֹא
  choice: 炉中
  rationale: 该词强调内部或当中；“扔进……炉中”自然表达被投入炉子里面。
- source_word: אַתּוּן נוּרָא יָקִדְתָּא
  choice: 烈火熊熊的炉
  rationale: 原文叠用“炉、火、燃烧”等词强化火势；此译法以自然汉语保留强烈形象，脚注另列较直译的表达。
