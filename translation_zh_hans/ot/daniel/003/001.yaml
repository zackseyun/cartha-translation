  text: נְבוּכַדְנֶצַּ֣ר מַלְכָּ֗/א עֲבַד֙ צְלֵ֣ם דִּֽי דְהַ֔ב רוּמֵ/הּ֙ אַמִּ֣ין שִׁתִּ֔ין פְּתָיֵ֖/הּ אַמִּ֣ין שִׁ֑ת אֲקִימֵ/הּ֙ בְּ/בִקְעַ֣ת דּוּרָ֔א בִּ/מְדִינַ֖ת בָּבֶֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/001.yaml
  text: King Nebuchadnezzar made an image of gold[a], its height sixty cubits and its width six cubits. He set it up in the plain of Dura[b], in the province of Babylon.
translation:
  language: zh_hans
  text: 尼布甲尼撒王造了一座金像[a]，高六十肘，宽六肘。他把像立在巴比伦省的杜拉平原上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“金制雕像”。亚兰文可指形像或雕像；结合后文，也可理解为“偶像”。“金像”本身并不能确定它是纯金铸成，还是外面包金。
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְכָּא
  choice: 王
  rationale: 该词在专名后作君王称号；汉语自然语序为“尼布甲尼撒王”。
- source_word: עֲבַד
  choice: 造了
  rationale: 此处表示制作该像；“造了”简洁自然，又不限定具体工艺。
- source_word: צְלֵם
  choice: 像
  rationale: 该词可指形像或雕像；“像”保留较宽泛、中性的含义，不提前将其明确称为偶像。
- source_word: דִּי דְהַב
  choice: 金像
  rationale: 表达像与黄金的材料关系，同时与脚注配合，保留实心金制或包金等可能性。
- source_word: רוּמֵהּ אַמִּין שִׁתִּין
  choice: 高六十肘
  rationale: 按现代汉语量度表达简洁呈现“其高度为六十肘”。
- source_word: פְּתָיֵהּ אַמִּין שִׁת
  choice: 宽六肘
  rationale: “宽”是现代汉语表达物体横向尺寸的自然用词。
- source_word: אֲקִימֵהּ
  choice: 把像立在
  rationale: 该动词意为使之站立、设立；“立在”适合大型像的安置，且汉语表达自然。
- source_word: בְּבִקְעַת
  choice: 平原上
  rationale: 该词可指宽阔平地或谷地；此处“平原”符合地理语境和设置大型像的场景。
- source_word: דּוּרָא
  choice: 杜拉
  rationale: 地名按普通话常用译音音译。
- source_word: בִּמְדִינַת בָּבֶל
  choice: 巴比伦省
  rationale: מְדִינָה 指行政辖区，“巴比伦省”准确体现帝国行政背景。
theological_decisions:
- issue: 是否把 צְלֵם 译成带有明确宗教贬义的称呼
  choice: 像
  alternative: 偶像；雕像
  rationale: 本节只说明其材料、尺寸和地点，尚未直接界定其崇拜用途。“像”保留叙事在此处的中性和词义宽度，让后文说明其功能。
translation_notes:
  register: 采用现代、庄重而通顺的叙事语言。量度按汉语习惯译作“高六十肘，宽六肘”。正文中的脚注标记与注释一一对应。
