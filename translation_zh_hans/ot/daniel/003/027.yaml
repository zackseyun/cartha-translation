reference: Daniel 3:27
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וּ֠/מִֽתְכַּנְּשִׁין אֲחַשְׁדַּרְפְּנַיָּ֞/א סִגְנַיָּ֣/א וּ/פַחֲוָתָ/א֮ וְ/הַדָּבְרֵ֣י מַלְכָּ/א֒ חָזַ֣יִן לְ/גֻבְרַיָּ֣/א אִלֵּ֡ךְ דִּי֩ לָֽא שְׁלֵ֨ט נוּרָ֜/א בְּ/גֶשְׁמְ/ה֗וֹן וּ/שְׂעַ֤ר רֵֽאשְׁ/הוֹן֙ לָ֣א הִתְחָרַ֔ךְ וְ/סָרְבָּלֵי/ה֖וֹן לָ֣א שְׁנ֑וֹ וְ/רֵ֣יחַ נ֔וּר לָ֥א עֲדָ֖ת בְּ/הֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/027.yaml
  text: And the satraps[a], the prefects, the governors, and the king’s counselors gathered together and saw concerning these men that the fire had no power over their bodies, and the hair of their heads was not singed, and their cloaks were not changed, and no smell of fire had come upon them.
translation:
  language: zh_hans
  text: 众总督、行政长官、省长和王的顾问都聚集起来，察看这些人，发现火在他们身上毫无能力；他们的头发没有烧焦，外袍[a]没有改变，身上也没有火燎的气味。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“衣服”；这个亚兰语词具体指哪一种衣物，不能完全确定。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִתְכַּנְּשִׁין
  choice: 都聚集起来
  rationale: 该分词表达官员们会集在一起；此译自然地保留了集体聚集的动作。
- source_word: אֲחַשְׁדַּרְפְּנַיָּא
  choice: 总督
  rationale: 这是源自波斯行政体系的官衔；“总督”既体现历史性，也避免泛化为普通官员。
- source_word: סִגְנַיָּא
  choice: 行政长官
  rationale: 指高级行政官员；此译清楚易懂，并与同句其他官职有所区分。
- source_word: פַחֲוָתָא
  choice: 省长
  rationale: 该行政称谓常指地方或行省治理者；“省长”简明自然。
- source_word: הַדָּבְרֵי מַלְכָּא
  choice: 王的顾问
  rationale: 该词组可指王室官员、参议者或顾问；在宫廷语境中，“王的顾问”准确而不过度限定具体官职。
- source_word: חָזַיִן לְגֻבְרַיָּא אִלֵּךְ
  choice: 察看这些人，发现
  rationale: 介词 לְ 在此表示所察看的对象或所关涉的人；中文用“察看……，发现……”自然呈现官员亲眼确认随后各项事实的句法关系。
- source_word: לָא שְׁלֵט נוּרָא בְּגֶשְׁמְהוֹן
  choice: 火对他们的身体毫无权势
  rationale: שׁלט 表示掌权、支配；保留“权势”比仅译作“没有伤害”更贴近原文的强烈措辞。
- source_word: שְׂעַר רֵאשְׁהוֹן לָא הִתְחָרַךְ
  choice: 他们的头发没有烧焦
  rationale: 动词在此特指毛发被火燎焦；“烧焦”是现代汉语中准确自然的表达。
- source_word: סָרְבָּלֵיהוֹן לָא שְׁנוֹ
  choice: 外袍没有变样
  rationale: 衣物名称的确切种类不确定，“外袍”是合理而不过度具体的正文选择；“没有变样”保留衣物未受改变的陈述。
- source_word: וְרֵיחַ נוּר לָא עֲדָת בְּהוֹן
  choice: 身上也没有火烧的气味
  rationale: 原文直陈火的气味未临到或留在他们身上；此译以自然中文表达完全没有烟火气味的结果。
theological_decisions:
- issue: 火是否仅仅“没有造成效果”，还是被描写为没有支配权
  choice: 火对他们的身体毫无权势
  alternative: 火没有伤害他们的身体
  rationale: 原文使用表示掌权、辖制的 שׁלט；保留权势意象，不把它弱化为单纯的物理结果，也不额外解释神迹机制。
translation_notes:
  register: 采用现代、庄重且易懂的叙事语体。官职依次译为“总督、行政长官、省长、王的顾问”，尽量保留原文列举的层级差异；以分号承接官员亲眼确认的四项结果，使长句清晰而不割裂。
