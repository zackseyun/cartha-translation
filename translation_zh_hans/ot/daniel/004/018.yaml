id: DAN.4.18
reference: Daniel 4:18
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/עָפְיֵ֤/הּ שַׁפִּיר֙ וְ/אִנְבֵּ֣/הּ שַׂגִּ֔יא וּ/מָז֨וֹן לְ/כֹ֖לָּ/א בֵ֑/הּ תְּחֹת֗וֹ/הִי תְּדוּר֙ חֵיוַ֣ת בָּרָ֔/א וּ/בְ/עַנְפ֕וֹ/הִי יִשְׁכְּנָ֖ן צִפֲּרֵ֥י שְׁמַיָּֽ/א־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/018.yaml
  text: Its foliage was beautiful and its fruit abundant[a], and in it was food for all. Under it the beasts of the field lived, and in its branches the birds of the heavens dwelled.
translation:
  language: zh_hans
  text: 它的枝叶美丽，果实丰盛，其中有供一切活物享用的食物。田野的走兽住在它下面，天上的飞鸟[a]栖息在它的枝条间。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“天空中的飞鸟”。亚兰文直译为“诸天的飞鸟”。
    reason: 说明现代汉语的自然译法及原文复数形式所具有的字面表达。
lexical_decisions:
- source_word: עָפְיֵהּ
  choice: 它的枝叶
  rationale: 该词指树木叶片构成的整体覆盖；“枝叶”在现代汉语中自然，并能表达集合意义。
- source_word: שַׁפִּיר
  choice: 美丽
  rationale: 直接表达外观美好、悦目的含义，现代而庄重。
- source_word: אִנְבֵּהּ שַׂגִּיא
  choice: 果实丰盛
  rationale: “果实”准确对应树的出产，“丰盛”自然表达数量多、供应充足。
- source_word: מָזוֹן לְכֹלָּא בֵהּ
  choice: 其中有供一切活物享用的食物
  rationale: 保留食物位于树上的空间意象；“一切活物”使汉语通顺，也依上下文说明“所有”的对象，而不把范围缩限为某一类动物。
- source_word: חֵיוַת בָּרָא
  choice: 田野的走兽
  rationale: 保留“田野”这一原文空间表达；“走兽”与后面的飞鸟形成自然对举。
- source_word: תְּדוּר
  choice: 住
  rationale: 表达居住、停留之意，措辞简明自然，不额外强调筑巢。
- source_word: בְעַנְפוֹהִי
  choice: 在它的枝条间
  rationale: 准确呈现位于树枝之中的空间关系；“枝条间”符合飞鸟栖息的汉语表达。
- source_word: יִשְׁכְּנָן
  choice: 栖息
  rationale: 既表达安居、停留，也适合描述飞鸟；未过度具体化为“筑巢”。
- source_word: צִפֲּרֵי שְׁמַיָּא
  choice: 天上的飞鸟
  rationale: 保留原文“天/诸天”的意象，同时采用现代汉语中自然的固定表达。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“田野的走兽”与“天上的飞鸟”形成诗性对举；“栖息”保留居住意象而不限定为筑巢。脚注标记置于实际所注释的“天上的飞鸟”之后。
