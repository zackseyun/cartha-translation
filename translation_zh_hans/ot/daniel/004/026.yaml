  text: לִ/קְצָ֥ת יַרְחִ֖ין תְּרֵֽי עֲשַׂ֑ר עַל הֵיכַ֧ל מַלְכוּתָ֛/א דִּ֥י בָבֶ֖ל מְהַלֵּ֥ךְ הֲוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/026.yaml
  text: At the end of twelve months[a], he was walking on the roof of the royal palace of Babylon.
translation:
  language: zh_hans
  text: 十二个月期满时，他正在巴比伦王国的宫殿上[a]走动。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“在巴比伦王宫的屋顶上”。亚兰文直译为“在巴比伦王国的宫殿上”，所指可能是宫殿的屋顶或上层建筑。
    reason: 原文只明确说“在宫殿上”，具体位置可能是屋顶或宫殿上部，正文保留其含混性，脚注提供自然的语境性译法。
lexical_decisions:
- source_word: לִ/קְצָת
  choice: 期满时
  rationale: 这一时间结构表示一段时期到了尽头；“期满时”简洁自然，并保留原文的时间界限。
- source_word: יַרְחִין תְּרֵי עֲשַׂר
  choice: 十二个月
  rationale: 直接对应亚兰文“十二个月”，不压缩为较具解释性的“一年”。
- source_word: עַל
  choice: 在……上
  rationale: 保留介词所表达的位置关系，不在正文中直接限定为“屋顶”。
- source_word: הֵיכַל
  choice: 宫殿
  rationale: 在巴比伦君王的语境中指王宫，而非圣殿。
- source_word: מַלְכוּתָא דִּי בָבֶל
  choice: 巴比伦王国的
  rationale: 保留“王国”这一政治性名词及其与“巴比伦”的属格关系，避免直接化约为形容词“王室的”。
- source_word: מְהַלֵּךְ הֲוָה
  choice: 正在……走动
  rationale: 分词与“是”的过去时形式共同表达过去持续进行的动作；“正在……走动”体现这一进行意义。
theological_decisions: []
