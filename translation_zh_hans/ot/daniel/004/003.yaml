  text: וּ/מִנִּ/י֙ שִׂ֣ים טְעֵ֔ם לְ/הַנְעָלָ֣ה קָֽדָמַ֔/י לְ/כֹ֖ל חַכִּימֵ֣י בָבֶ֑ל דִּֽי פְשַׁ֥ר חֶלְמָ֖/א יְהֽוֹדְעֻנַּֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/003.yaml
  text: And by me a decree was issued to bring before me all the wise men of Babylon[a], that they might make known to me the interpretation of the dream.
translation:
  language: zh_hans
  text: 于是我下令，把巴比伦所有的智者召到我面前，要他们把梦的解释[a]告诉我。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“梦的意思”。
    reason: “解释”保留 פְשַׁר 在本书中指梦之解释的术语色彩；“意思”则以较通俗的现代汉语表达梦所代表的含义。
lexical_decisions:
- source_word: וּמִנִּי שִׂים טְעֵם
  choice: 于是我下令
  rationale: 该短语直指命令由王发出；在王室行政语境中，用现代汉语“我下令”自然传达“命令从我而出、被颁下”的意思。“于是”承接前文叙事。
- source_word: לְהַנְעָלָה קָדָמַי
  choice: 叫人……召到我面前
  rationale: 使役式不定词表达使这些人进入王面前；“叫人召到我面前”既保留使役含义，也符合宫廷场景下的自然汉语。
- source_word: לְכֹל חַכִּימֵי בָבֶל
  choice: 巴比伦所有的智者
  rationale: “智者”可涵盖巴比伦宫廷中的各类智慧专家，又不额外限定其具体职业；“所有的”保留 לְכֹל 的全称范围。
- source_word: פְשַׁר חֶלְמָא
  choice: 梦的解释
  rationale: פְשַׁר 在《但以理书》中常指梦或奥秘的解释；“梦的解释”保留其书内较为专门的用法。原文是定指的“这梦/那梦”，上下文已明确所指，汉语用“梦”即可自然表达。
- source_word: יְהוֹדְעֻנַּנִי
  choice: 告诉我
  rationale: 该使役形式字面为“使我知道”。现代汉语“告诉我”准确、自然地表达这一使役和受事关系；全句仍明确所告知的是梦的解释。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“下令”“召到我面前”符合王室语境，但避免过度文言化；句法按自然汉语调整，同时保留命令的发出者、全部智者、带到王前以及说明梦之解释等信息。
