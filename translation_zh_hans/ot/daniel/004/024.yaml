source:
  edition: WLC
  text: לָהֵ֣ן מַלְכָּ֗/א מִלְכִּ/י֙ יִשְׁפַּ֣ר עלי/ך ו/חטי/ך בְּ/צִדְקָ֣ה פְרֻ֔ק וַ/עֲוָיָתָ֖/ךְ בְּ/מִחַ֣ן עֲנָ֑יִן הֵ֛ן תֶּהֱוֵ֥א אַרְכָ֖ה לִ/שְׁלֵוְתָֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/024.yaml
  text: 'Therefore[a], O king, let my counsel be acceptable to you: break off your sins by righteousness, and your iniquities by showing mercy to the poor[b], that there may perhaps be a prolonging of your prosperity.'
translation:
  language: zh_hans
  text: 所以，王啊，愿你接纳我的劝告：要以行义断绝你的罪[a]，以怜悯穷苦人断绝你的罪孽；或许你的安稳可以延续[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “断绝”或译“赎去”。亚兰文动词可指“断开、除去”，在某些语境中也可指“赎回、解救”。
    reason: lexical_alternative
  - marker: b
    text: “安稳”也可译作“安宁”“太平”或“顺遂”。
    reason: lexical_alternative
lexical_decisions:
- source_word: לָהֵן
  choice: 所以
  rationale: 这是承接异梦解释并引出劝告的推论词；“所以”自然、清楚。
- source_word: מַלְכָּא
  choice: 王啊
  rationale: 保留呼格和宫廷语境中的恭敬直陈。
- source_word: מִלְכִּי יִשְׁפַּר עֲלָיִךְ
  choice: 愿你接纳我的劝告
  rationale: 该表达指劝告在听者看来合宜、蒙其悦纳；此译兼顾谦恭语气和现代汉语表达。
- source_word: חטי/ך בְּצִדְקָה פְרֻק
  choice: 以行义断绝你的罪
  rationale: “行义”把抽象名词的伦理实践含义表达出来；“断绝”保留 פְרֻק 的决然停止之意，同时不把“赎”这一可能但具神学歧义的义项直接写入正文。
- source_word: וַעֲוָיָתָךְ
  choice: 你的罪孽
  rationale: 与前面的“罪”形成近义平行，同时保留邪恶与罪责的较强意味。
- source_word: בְּמִחַן עֲנָיִן
  choice: 以怜悯穷苦人
  rationale: מִחַן 表示施怜悯，עֲנָיִן 可指贫穷或受苦的人；“穷苦人”保留两方面的语义范围。
- source_word: הֵן
  choice: 或许
  rationale: 表达不确定的可能性，不把结果译成保证。
- source_word: תֶּהֱוֵא אַרְכָה לִשְׁלֵוְתָךְ
  choice: 你的安稳可以延续
  rationale: 以自然汉语表达“有延长临到你的安适”；“安稳”兼含平静、安逸与处境顺遂，不将其限缩为物质繁荣。
theological_decisions:
- issue: 劝告是否表示靠义行和怜悯作为功德赎罪
  choice: 正文译作“断绝你的罪……除去你的罪孽”，呈现悔改须落实于行义与怜悯人的要求。
  alternative: 也可将 פְרֻק 译作“赎去”，从而读成“以行义赎去你的罪”。
  rationale: פְרֻק 可有断开、解救或赎回之义。上下文首先要求王停止不义，但词义上的“赎去”可能性不应被抹除，故正文避免预断功德赎罪问题，并在脚注保留另一译法。
- issue: 顺服劝告后的结果是否确定
  choice: 保留“或许”，表明安稳延续只是一种可能。
  alternative: 译成确定的“你的安稳就必延续”。
  rationale: הֵן 在此引出不确定可能，不能把它强化为无条件保证。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“王啊”保留直接而恭敬的宫廷称呼；平行句式尽量体现亚兰文劝诫的力度。正文中的[a]、[b]均与脚注对应。
