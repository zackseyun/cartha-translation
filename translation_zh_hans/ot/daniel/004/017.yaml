base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/017.yaml
  text: The tree that you saw[a], which grew and became strong, whose height reached to the heavens and was visible to all the earth—
translation:
  language: zh_hans
  text: 你所看见的那棵树，长大并变得强壮，高达诸天，全地都看得见——
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִילָנָא
  choice: 那棵树
  rationale: 这是带确定意味的阿拉米语常用名词；上下文指王梦中所见的特定树，现代汉语用“那棵树”自然明确。
- source_word: דִּי חֲזַיְתָ
  choice: 你所看见的
  rationale: 保留关系结构和第二人称阳性单数完成式的直接含义；“所看见的”庄重而自然。
- source_word: דִּי רְבָה וּתְקִף
  choice: 就是那渐渐长大、越发坚固
  rationale: 两个动词描述树的发展状态。“渐渐”和“越发”以自然汉语表现其递进过程，但不额外引入时间长度。
- source_word: וְרוּמֵהּ יִמְטֵא לִשְׁמַיָּא
  choice: 高达诸天
  rationale: רוּם在此指高度；“高达”简洁表达其高度达到诸天，避免把该词具体化为“树梢”。“诸天”保留阿拉米语复数形式及宏大的异象语域。
- source_word: וַחֲזוֹתֵהּ
  choice: 都能看见
  rationale: 该名词表示外观、所见或可见性；结合范围短语，译为“都能看见”比直译“它的外观”更符合现代汉语。
- source_word: לְכָל אַרְעָא
  choice: 全地
  rationale: אַרְעָא既可指“地”也可指“土地/国土”；异象中树高达诸天并为全地所见，采用“全地”保留普遍范围，也较“全世界”少作解释。
theological_decisions:
- issue: 王梦异象中אַרְעָא的范围
  choice: 全地
  alternative: 全境／整个国土
  rationale: 该词本身可有“地”或“国土”的含义，但本节异象刻意呈现宏大范围。“全地”既与此规模相称，又不将其扩展为额外的末世或教义性断言。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。保留原文关系从句的延展感，并以破折号表示本句尚未完结、下文继续描述这棵树。
