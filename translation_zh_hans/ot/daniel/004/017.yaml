  naturalness: 原文“你所看见的那棵树，就是那……的树”在现代汉语中重复“树”，且“就是那”造成不必要的指示性重述。改为直接以“你所看见的那棵树”引出连续描述，更自然，也保留原句未完、承接下文的语势。
  terminology: “诸天”适合保留圣经异象语体中复数的“heavens”。“全地”恰当；阿拉米语אַרְעָא亦可指“地/土地”，可用简短脚注提示，不应译为带现代地理色彩的“全世界”。“强壮”对应“变得强壮/强大”，比“坚固”更直接反映该词的力量含义。
