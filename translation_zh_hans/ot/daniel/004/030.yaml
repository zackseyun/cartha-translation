id: DAN.4.30
reference: Daniel 4:30
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: בַּ/הּ שַׁעֲתָ֗/א מִלְּתָ/א֮ סָ֣פַת עַל נְבוּכַדְנֶצַּר֒ וּ/מִן אֲנָשָׁ֣/א טְרִ֔יד וְ/עִשְׂבָּ֤/א כְ/תוֹרִין֙ יֵאכֻ֔ל וּ/מִ/טַּ֥ל שְׁמַיָּ֖/א גִּשְׁמֵ֣/הּ יִצְטַבַּ֑ע עַ֣ד דִּ֥י שַׂעְרֵ֛/הּ כְּ/נִשְׁרִ֥ין רְבָ֖ה וְ/טִפְר֥וֹ/הִי כְ/צִפְּרִֽין־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/030.yaml
  text: At that moment the word was fulfilled against Nebuchadnezzar. He was driven away from among men[a], and he ate grass like oxen, and his body was drenched with the dew of heaven, until his hair grew like eagles’ feathers and his nails like birds’ claws.
translation:
  language: zh_hans
  text: 就在那一刻，那话应验在尼布甲尼撒身上。他被赶离人类中间，像牛一样吃草；他的身体被天上的露水浸湿，直到他的头发长得像鹰的羽毛一样[a]，指甲像鸟爪一样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “鹰”也可译作“大型猛禽”或“秃鹫”；亚兰语原词可泛指大型猛禽，传统上译作“鹰”。
    reason: 保留 נִשְׁרִין 的词义范围及传统译法之间的真实歧义。
lexical_decisions:
- source_word: בַּהּ שַׁעֲתָא
  choice: 就在那一刻
  rationale: 该亚兰语习语直译为“在那时辰”，这里强调审判即时临到；“就在那一刻”自然且保留紧迫感。
- source_word: מִלְּתָא סָפַת
  choice: 那话应验
  rationale: מִלְּתָא 可指“话、事情、判词”，此处回指先前宣告的审判；סָפַת 表示达到完成。“那话应验”既贴近词义，也在中文中自然地表达宣告成为事实。
- source_word: עַל נְבוּכַדְנֶצַּר
  choice: 在尼布甲尼撒身上
  rationale: עַל 在审判语境中带有不利于其人的意味；中文“应验在……身上”自然表达宣告临到并实现，不必另加“攻击”之类解释。
- source_word: וּמִן אֲנָשָׁא טְרִיד
  choice: 他被赶离人群
  rationale: טְרִיד 表示被驱逐或赶走；אֲנָשָׁא 在此指人类群体。“赶离人群”清楚表达他被排除在人类社会之外。
- source_word: וְעִשְׂבָּא כְתוֹרִין יֵאכֻל
  choice: 像牛一样吃草
  rationale: עִשְׂבָּא 指草或植物，תּוֹרִין 指牛类；此译简洁自然，并保留其兽化生活的鲜明形象。
- source_word: וּמִטַּל שְׁמַיָּא גִּשְׁמֵהּ יִצְטַבַּע
  choice: 他的身体被天露浸湿
  rationale: גִּשְׁמֵהּ 是“他的身体”，יִצְטַבַּע 表示变湿、浸湿；“天露”保留 שְׁמַיָּא 的圣经语体，又不失可懂性。
- source_word: שַׂעְרֵהּ כְּנִשְׁרִין רְבָה
  choice: 他的头发长得如鹰的羽毛
  rationale: רְבָה 与头发连用表示长长或长大；נִשְׁרִין 通常译作“鹰”，也可泛指大型猛禽。正文采用传统而自然的“鹰”，脚注保留词义范围。
- source_word: וְטִפְרוֹהִי כְצִפְּרִין
  choice: 指甲如鸟爪
  rationale: טִפְרוֹהִי 可指指甲或爪；与鸟类比较时，中文“鸟爪”能准确传达形象。
theological_decisions:
- issue: אֲנָשָׁא 所指的人类范围
  choice: 人群
  alternative: 人类／世人
  rationale: 这里的对比是尼布甲尼撒被逐出人类社会、过着如兽的生活，并非专指男性。“人群”既不引入性别限制，也保留被赶离共同体的具体意味。
- issue: מִלְּתָא 的审判含义
  choice: 那话
  alternative: 判词／命令
  rationale: 上下文中的“话”确实是审判宣告，但原词仍有“话、事情”的宽度。译作“那话”保留原文的概括性，不把司法意味强化为原文唯一可能的词义。
translation_notes:
  register: 采用现代、庄重且易懂的叙事语言。“天露”略带圣经语体；分号使连续动作层次清楚。脚注标记已置于正文相应词语之后。
