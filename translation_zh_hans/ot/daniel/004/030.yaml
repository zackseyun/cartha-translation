  rationale: 修订仅改善现代汉语的准确性与流畅度：“人类中间”明确原文的人类／兽类对比；“天上的露水”是自然且忠实的表达；末句补足比较结构，使两项描写平行清晰。脚注保留在“鹰”后，并将释义表述校正为更准确的“猛禽”。
