  to: 于是，但以理（又名伯提沙撒）惊愕[a]了约一个时辰[b]；他的心思使他恐惧。王说：“伯提沙撒，不要让这梦和梦的解释使你恐惧。”伯提沙撒回答说：“我主啊，愿这梦归给恨你的人，梦的解释归给你的仇敌！”
