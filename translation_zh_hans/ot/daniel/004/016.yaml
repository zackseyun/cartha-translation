source:
  edition: WLC
  text: אֱדַ֨יִן דָּֽנִיֵּ֜אל דִּֽי שְׁמֵ֣/הּ בֵּלְטְשַׁאצַּ֗ר אֶשְׁתּוֹמַם֙ כְּ/שָׁעָ֣ה חֲדָ֔ה וְ/רַעְיֹנֹ֖/הִי יְבַהֲלֻנֵּ֑/הּ עָנֵ֨ה מַלְכָּ֜/א וְ/אָמַ֗ר בֵּלְטְשַׁאצַּר֙ חֶלְמָ֤/א וּ/פִשְׁרֵ/א֙ אַֽל יְבַהֲלָ֔/ךְ עָנֵ֤ה בֵלְטְשַׁאצַּר֙ וְ/אָמַ֔ר מרא/י חֶלְמָ֥/א ל/שנאי/ך וּ/פִשְׁרֵ֥/הּ ל/ערי/ך־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/016.yaml
  text: Then Daniel[a], whose name was Belteshazzar, was appalled for about an hour, and his thoughts terrified him. The king answered and said, “Belteshazzar, do not let the dream or its interpretation terrify you.” Belteshazzar answered and said, “My lord, may the dream be for those who hate you[b], and its interpretation for your enemies.”
translation:
  language: zh_hans
  text: 于是，但以理（又名伯提沙撒）惊愕[a]了约一个时辰[b]；他的心思使他恐惧。王说：“伯提沙撒，不要让这梦和梦的解释使你恐惧。”伯提沙撒回答说：“我主啊，愿这梦归给恨你的人，梦的解释归给你的仇敌！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“震惊得说不出话来”。这个亚兰语动词可表示因震惊而一时无言；本处也含有不安、骇异之意。
    reason: lexical_alternative
  - marker: b
    text: 原文直译近于“约一个时辰”。这里的“时辰”表示一段约一小时的时间。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱדַיִן
  choice: 于是
  rationale: 这是承接叙事进程的亚兰语话语标记；“于是”自然地引出随后发生的事。
- source_word: דָּנִיֵּאל דִּי שְׁמֵהּ בֵּלְטְשַׁאצַּר
  choice: 但以理（又名伯提沙撒）
  rationale: 关系结构说明但以理在巴比伦宫廷中的名字；括注形式简洁清楚，也符合现代汉语叙事。
- source_word: אֶשְׁתּוֹמַם
  choice: 惊愕
  rationale: 该动词可指因震惊、骇异而一时无言；上下文表明但以理因梦兆凶险而深受震动，“惊愕”兼顾震惊与不安。
- source_word: כְּשָׁעָה חֲדָה
  choice: 约一个时辰
  rationale: 字面接近“约一个时辰”；保留明确的时间长度，同时不把表达处理成过度精确的现代计时。
- source_word: וְרַעְיֹנֹהִי
  choice: 心里的意念
  rationale: 该名词指思想、思绪或内心所想；“心里的意念”在庄重现代汉语中自然，并凸显其内在反应。
- source_word: יְבַהֲלֻנֵּהּ / יְבַהֲלָךְ
  choice: 使他恐惧／使你恐惧
  rationale: 两处同根动词均表示使人惊惧、惶恐；重复“使……恐惧”保留原文的词汇呼应和较强情绪。
- source_word: עָנֵה מַלְכָּא וְאָמַר
  choice: 王开口说
  rationale: 原文是闪语常见的“回答并说”公式；此处王不是回答一个直接问题，“开口说”在汉语中自然，又保留发言公式的功能。
- source_word: חֶלְמָא וּפִשְׁרֵא אַל יְבַהֲלָךְ
  choice: 不要让这梦和梦的解释使你恐惧
  rationale: 保留“梦”和“解释”两个并列成分，并以使役结构呈现动词含义。
- source_word: מָרִי
  choice: 我主啊
  rationale: 这是但以理对君王的宫廷敬称；“我主”保留尊敬语气，在本语境中并非神性称号。
- source_word: לְשָׂנְאָיִךְ
  choice: 归给恨你的人
  rationale: 介词表达梦所指向或应验的对象；“归给”自然表达但以理希望梦兆落在憎恨王的人身上。
- source_word: וּפִשְׁרֵהּ לְעָרָיִךְ
  choice: 梦的解释归给你的仇敌
  rationale: 保持与前半句平行，并将 פשר 明确译作梦的“解释”，而非仅指抽象意义。
theological_decisions:
- issue: 但以理称尼布甲尼撒为 מָרִי
  choice: 我主啊
  alternative: 主人啊／陛下
  rationale: 此词在这里是臣下对人间君王的尊称，不是对上帝的称号；“我主”较贴近原文形式和宫廷语气，同时不额外加入原文没有的王号。
- issue: 愿梦及其解释归给王的敌人
  choice: 保留为祝愿式表达
  alternative: 解释为委婉地宣告梦实际临到王
  rationale: 原文以愿望或委婉表达呈现，但上下文形成明显张力；译文不把这句话直接改写成对王的判决，以保留原文修辞和神学张力。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。保留宫廷对话的敬语和原文中“恐惧”的重复呼应；以“一个时辰”维持古代叙事语感，并用脚注说明其时间含义。
