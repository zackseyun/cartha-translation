  text: חָזֵ֥ה הֲוֵ֛ית בְּ/חֶזְוֵ֥י רֵאשִׁ֖/י עַֽל מִשְׁכְּבִ֑/י וַ/אֲלוּ֙ עִ֣יר וְ/קַדִּ֔ישׁ מִן שְׁמַיָּ֖/א נָחִֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/010.yaml
  text: I was looking in the visions of my head as I lay on my bed[a], and behold, a watcher, a holy one, came down from heaven.
translation:
  language: zh_hans
  text: 我躺在床上时，正观看脑海中的异象；看哪，有一位守望者，一位圣者[a]，从天上降下来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“一个守望者，一个圣者”。两个称谓在此指同一位天上的存在；经文没有直接称其为天使。
    reason: 说明“守望者”和“圣者”的字面并列及同位关系，同时避免把该存在直接等同于天使。
lexical_decisions:
- source_word: חָזֵה הֲוֵית
  choice: 正观看
  rationale: 分词与存在动词构成迂回式，表达过去持续进行的观看；“正观看”在现代汉语中自然保留这一进行意味。
- source_word: בְּחֶזְוֵי רֵאשִׁי
  choice: 脑海中的异象
  rationale: 原文直译近于“我头脑的异象”。“脑海中的异象”保留异象发生于内在视觉经验的含义，同时避免生硬的“我头的异象”。
- source_word: עַל מִשְׁכְּבִי
  choice: 我躺在床上
  rationale: 按语境表达异象出现时他正在床上躺卧，比直译“在我的床榻上”更符合现代汉语。
- source_word: וַאֲלוּ
  choice: 看哪
  rationale: 保留原文引人注意、突然聚焦于下一景象的叙事功能，并维持庄重的圣经文体。
- source_word: עִיר
  choice: 守望者
  rationale: 该词字面指“警醒者、守望者”，在本段指天上的存在；保留这一独特称号，不径直释作“天使”。
- source_word: וְקַדִּישׁ
  choice: 就是一位圣者
  rationale: 将“圣者”理解为与“守望者”同位，指同一个存在；“就是”自然传达同位关系，同时脚注保留原文较为并列的形式。
- source_word: מִן שְׁמַיָּא
  choice: 从天上
  rationale: 亚兰文形式虽为复数形态，但此处汉语惯用“天上”，自然表达其来源。
- source_word: נָחִת
  choice: 降下来
  rationale: 准确表达从上方向下移动，并符合叙述者立足地上的观察视角。
theological_decisions:
- issue: עִיר וְקַדִּישׁ所指存在的身份
  choice: 译作“守望者，就是一位圣者”，不进一步认定为天使
  alternative: 一位天使／一位天上的使者
  rationale: 原文采用独特称号“守望者”和“圣者”，而非通常表示“天使”的词。保留原称谓可避免加入经文本身未明确作出的神学身份判断。
- issue: “守望者”与“圣者”的句法关系
  choice: 按同位关系处理，指同一位存在
  alternative: 一位守望者和一位圣者，指两个存在
  rationale: 两个阳性单数称谓并列，后接单数动词，语境最自然地表明二者描述同一位天上存在；脚注同时交代原文的字面排列。
translation_notes:
  register: 采用现代、清楚而庄重的普通话。“脑海中的异象”使原文“头脑的异象”这一习语易于理解；“看哪”与“守望者”则保留原文突出的叙事语气和独特称谓。
