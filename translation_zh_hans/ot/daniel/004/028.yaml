revisions:
- from: 这话还在王口中的时候[a]，就有声音从天上降下来说：“尼布甲尼撒王啊，有话对你说：王国已经离开你了[b]。”
  to: 王的话还在口中时[a]，就有声音从天上降下，宣告说：“尼布甲尼撒王啊，有人对你宣告：你的国度已经离你而去了[b]。”
  rationale: 修订保留原文“话仍在王口中”的中断感，以及声音“从天上降下”的鲜明意象；以“有人对你宣告”自然对应无人称复数分词的正式公告语气，而不指定未明说的发话者。以“国度……离你而去”表达完成的丧失，避免在正文增添“夺去”的明确施事含义；该理解保留于脚注替代译法。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T07:54:30Z'
review_pass:
  verdict: revise
  source_fidelity: 译文总体准确传达亚兰文的时间突发、从天而来的声音、对尼布甲尼撒的正式宣告，以及国度从他离去的完成事实。但“有话对你说”较像日常会话中的“有件事要告诉你”，未充分对应לָךְ אָמְרִין的无人称宣告格式；宜改为“有人对你宣告”。
  naturalness: “这话还在王口中的时候”虽可理解，但现代汉语略显生硬；“王的话还在口中时”既保留原文习语，也更自然。结尾“王国已经离开你了”可理解，却不如“你的国度已经离你而去”庄重顺畅，并清楚表达该国度原属王。
  terminology: “尼布甲尼撒王”合乎通行中文圣经人名和称谓。“天上”保留神圣来源，恰当。“国度”在此比“王国”更能兼容领土与王权／统治的语义范围；“离你而去”保留原文未明示施事者的表达。
  issues:
