base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/028.yaml
  text: 'While the word was still in the king’s mouth[a], a voice fell from heaven: “To you it is said, King Nebuchadnezzar, the kingdom has departed from you.”'
translation:
  language: zh_hans
  text: 王的话还在口中时[a]，就有声音从天上降下，宣告说：“尼布甲尼撒王啊，有人对你宣告：你的国度已经离你而去了[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“王的话还在口中”。意思是王还没有说完。
    reason: idiom_clarification
  - marker: b
    text: 或译：“你的国度已经从你那里被挪去了。”
    reason: lexical_alternative
lexical_decisions:
- source_word: עוֹד מִלְּתָא בְּפֻם מַלְכָּא
  choice: 这话还在王口中的时候
  rationale: 保留亚兰文“话在口中”的生动习语，并以“还……的时候”表达话语尚未说完便遭打断。
- source_word: קָל מִן שְׁמַיָּא נְפַל
  choice: 有声音从天上降下来
  rationale: קָל在直接引语前指可辨识的声音；נְפַל字面为“落下”，汉语用“降下来”既保留自上而下的意象，也较自然。
- source_word: לָךְ אָמְרִין
  choice: 有话对你说
  rationale: 原文复数分词作无人称表达，具有近似被动的宣告语气；此译避免补出未明说的说话主体，同时符合现代汉语。
- source_word: נְבוּכַדְנֶצַּר מַלְכָּא
  choice: 尼布甲尼撒王啊
  rationale: 按现代汉语称谓顺序处理，并用“啊”清楚呈现呼格。
- source_word: מַלְכוּתָה
  choice: 王国
  rationale: 该词可指王权、统治或王国；上下文涉及尼布甲尼撒失去国度，译作“王国”直接且保留其领域与统治的双重关联。
- source_word: עֲדָת מִנָּךְ
  choice: 已经离开你了
  rationale: 贴近动词“离去、转离”的表层表达，不在正文中直接限定为被动“被夺去”；完成意义由“已经……了”表达。
theological_decisions:
- issue: 声音来源“天上”的含义
  choice: 从天上
  alternative: 从天空／从诸天
  rationale: 此处是神圣审判的宣告，“天上”在现代汉语中自然保留属天来源，不把它弱化为单纯的气象空间。
- issue: 王国离去是否明确表达神主动夺取
  choice: 已经离开你了
  alternative: 已经从你手中夺去了／已经被挪去了
  rationale: 原文动词本身表达王国从王那里离去，并未在该分句明示施事者；正文保留这种语法张力，脚注提示符合语境的被动理解。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“从天上降下来”保留原文声音自上而下的鲜明图景；直接引语具有正式宣告的语气。
