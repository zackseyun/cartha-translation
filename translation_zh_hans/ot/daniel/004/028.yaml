    rationale: לָךְ אָמְרִין字面为“对你有人说／人们对你说”，是审判宣告的固定式表达。“有话对你说”在现代汉语中偏口语化，且把重点转为“有事情要说”。
  - severity: low
    issue: 开头和结尾的措辞可更自然、庄重。
    rationale: “王的话还在口中时”比“这话还在王口中的时候”更符合汉语语序；“你的国度已经离你而去”比“王国已经离开你了”更贴合语境并维持经文体。
  revised_text: 王的话还在口中时[a]，就有声音从天上降下，宣告说：“尼布甲尼撒王啊，有人对你宣告：你的国度已经离你而去了[b]。”
  revised_footnotes:
