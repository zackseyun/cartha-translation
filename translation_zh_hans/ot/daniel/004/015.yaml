language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: דְּנָה֙ חֶלְמָ֣/א חֲזֵ֔ית אֲנָ֖ה מַלְכָּ֣/א נְבוּכַדְנֶצַּ֑ר ו/אנתה בֵּלְטְשַׁאצַּ֜ר פִּשְׁרֵ֣/א אֱמַ֗ר כָּ/ל קֳבֵל֙ דִּ֣י כָּל חַכִּימֵ֣י מַלְכוּתִ֗/י לָֽא יָכְלִ֤ין פִּשְׁרָ/א֙ לְ/הוֹדָ֣עֻתַ֔/נִי ו/אנתה כָּהֵ֔ל דִּ֛י רֽוּחַ אֱלָהִ֥ין קַדִּישִׁ֖ין בָּֽ/ךְ׀־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/015.yaml
  text: This is the dream that I[a], King Nebuchadnezzar, saw. And you, Belteshazzar, tell its interpretation, because all the wise men of my kingdom are not able to make its interpretation known to me, but you are able, for the spirit of the holy gods is in you.
translation:
  language: zh_hans
  text: “这就是我——尼布甲尼撒王所见的梦。伯提沙撒啊，你要说明这梦的解释，因为我国中所有的智慧人都不能把这梦的解释告诉我；但你能，因为圣洁众神的灵在你里面[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“圣洁上帝的灵在你里面。”亚兰文中的“神”和“圣洁”都是复数形式，但也有人把这个短语理解为单数，指上帝的灵。
    reason: 保留רוּחַ אֱלָהִין קַדִּישִׁין可按复数“圣洁众神”或按单数理解的歧义，同时不在正文中消除其多神语境。
lexical_decisions:
- source_word: דְּנָה חֶלְמָא חֲזֵית
  choice: 这就是……所见的梦
  rationale: דְּנָה指示前述梦境，חֶלְמָא为定指形式；中文以“这就是……的梦”自然表达，חֲזֵית按完成体译为“所见”。
- source_word: אֲנָה מַלְכָּא נְבוּכַדְנֶצַּר
  choice: 我尼布甲尼撒王
  rationale: 保留第一人称及王号的同位关系，并采用符合现代汉语自称语序的表达。
- source_word: וְאַנתָּה בֵּלְטְשַׁאצַּר
  choice: 伯提沙撒啊，你
  rationale: 把人名置于呼语位置，并用“啊”清楚标明直接称呼；וְ在此主要承接话语，无须机械译出。
- source_word: פִּשְׁרֵא אֱמַר
  choice: 说明这梦的解释
  rationale: פְּשַׁר指梦的“解释”，אֱמַר为命令式；“说明”比逐字的“说”更符合现代汉语。原文虽未在此重复“梦”，但中文补出“这梦”可清楚指明所属关系。
- source_word: כָּל־קֳבֵל דִּי
  choice: 因为
  rationale: 该复合表达引出原因，现代汉语以“因为”最为清楚自然。
- source_word: כָּל חַכִּימֵי מַלְכוּתִי
  choice: 我国中所有的智慧人
  rationale: חַכִּימִין在但以理书语境中指宫廷智慧人士；“智慧人”既保留术语色彩，又为普通读者所能理解。
- source_word: לָא יָכְלִין פִּשְׁרָא לְהוֹדָעוּתַנִי
  choice: 都不能把这梦的解释告诉我
  rationale: לְהוֹדָעוּתַנִי字面为“使我知道”，汉语用“告诉我”自然表达其使役含义；补出“这梦”保持指代清楚。
- source_word: וְאַנתָּה כָּהֵל
  choice: 但你能
  rationale: וְ形式上是连接词，但上下文与众智慧人的无能构成鲜明对比，因此译为“但”；כָּהֵל表达能力。
- source_word: רוּחַ אֱלָהִין קַדִּישִׁין בָּךְ
  choice: 你里面有圣神明的灵
  rationale: רוּחַ译作“灵”；אֱלָהִין与קַדִּישִׁין形态上均为复数，主文据此译作“圣神明”，同时保留短语可作单数理解的可能性于脚注。
theological_decisions:
- issue: רוּחַ אֱלָהִין קַדִּישִׁין应按复数神明还是单数上帝理解
  choice: 圣神明的灵
  alternative: 圣洁上帝的灵／圣灵
  rationale: 说话者是巴比伦王，且אֱלָהִין和קַדִּישִׁין在形态上均为复数，主文采用复数读法，避免把单一神论解释直接写入正文。不过，该短语也有人按单数敬称或指以色列的上帝理解，因此在脚注中保留这一真实歧义。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。人名依常见中文圣经译名处理；用“说明”“告诉”避免生硬直译。主文保留尼布甲尼撒话语中较可能的多神语境，同时以脚注呈现单数神学读法。
