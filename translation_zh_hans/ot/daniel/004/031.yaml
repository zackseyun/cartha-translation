  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/לִ/קְצָ֣ת יֽוֹמַיָּ/ה֩ אֲנָ֨ה נְבוּכַדְנֶצַּ֜ר עַיְנַ֣/י לִ/שְׁמַיָּ֣/א נִטְלֵ֗ת וּ/מַנְדְּעִ/י֙ עֲלַ֣/י יְת֔וּב ו/ל/עלי/א בָּרְכֵ֔ת וּ/לְ/חַ֥י עָלְמָ֖/א שַׁבְּחֵ֣ת וְ/הַדְּרֵ֑ת דִּ֤י שָׁלְטָנֵ/הּ֙ שָׁלְטָ֣ן עָלַ֔ם וּ/מַלְכוּתֵ֖/הּ עִם דָּ֥ר וְ/דָֽר׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/031.yaml
  text: At the end of the days[a], I, Nebuchadnezzar, lifted my eyes to heaven, and my understanding returned to me; and I blessed the Most High, and I praised and honored him who lives forever, for his dominion is an everlasting dominion, and his kingdom is from generation to generation.
translation:
  language: zh_hans
  text: 那段日子结束时，我尼布甲尼撒举目望天，我的神智[a]恢复了。于是我称颂至高者，赞美、尊崇那位永远活着的；因为他的权柄是永远的权柄，他的国度存到世世代代。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“我的理解力”或“我的理性”。亚兰语原词可指知识、理解力或理性。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִקְצָת יֽוֹמַיָּה
  choice: 那段日子结束时
  rationale: 此短语指前文所定时期的终结。“那段日子”既保留原文“日子”的表达，也在现代汉语中自然地回指前述时期。
- source_word: עַיְנַי לִשְׁמַיָּא נִטְלֵת
  choice: 举目望天
  rationale: 保留原文抬眼向天的动作及其转向上天的含义，是自然、庄重的汉语习语。
- source_word: וּמַנְדְּעִי עֲלַי יְתוּב
  choice: 我的神智也恢复了
  rationale: מַנְדַּע可指知识、理解力或理性；在王从失常状态复原的叙事语境中，“神智”自然表达心智能力的恢复，又不采用现代医学诊断术语。
- source_word: לעליא
  choice: 至高者
  rationale: 这是《但以理书》中稳定的神圣称号，准确传达其至高含义。
- source_word: בָּרְכֵת
  choice: 称颂
  rationale: 与随后表示赞美的动词有所区别；“称颂”适合人向上帝表达祝颂的语境。
- source_word: לְחַי עָלְמָא
  choice: 那永远活着的
  rationale: 忠实呈现原文对上帝永恒生命的分词性描述，同时保持颂赞语体。
- source_word: שַׁבְּחֵת וְהַדְּרֵת
  choice: 赞美、尊崇
  rationale: 分别表达赞颂与尊荣，保留两个相近但不相同的敬拜动作。
- source_word: שָׁלְטָנֵהּ שָׁלְטָן עָלַם
  choice: 他的权柄是永远的权柄
  rationale: 保留原文同根名词的重复和强调；“权柄”符合本章君王与统治的语境。
- source_word: וּמַלְכוּתֵהּ עִם דָּר וְדָר
  choice: 他的国度直到世世代代
  rationale: 原文为无显式动词的持续性名词句；“直到世世代代”自然表达其贯穿历代的延续，同时避免补入过强的解释性动词。
theological_decisions:
- issue: 如何呈现尼布甲尼撒对上帝的颂赞及永活者称谓
  choice: 于是我称颂至高者，赞美、尊崇那永远活着的
  alternative: 于是我称颂至高者，赞美、尊崇永活者
  rationale: “那永远活着的”较直接地保留原文的描述性结构，不把它固定化为原文未必明确要求的专名，同时保持个人性的颂赞对象。
- issue: 如何处理国度延续的无动词分句
  choice: 他的国度直到世世代代
  alternative: 他的国度世世代代长存
  rationale: 所选译法保留原文无显式动词的简洁结构及持续含义，不额外强化为特定系统神学表述。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“举目望天”“至高者”“世世代代”保留经文颂赞语体；整体避免古奥虚词。脚注标在其实际说明的“神智”之后，而非“日子”之后。
