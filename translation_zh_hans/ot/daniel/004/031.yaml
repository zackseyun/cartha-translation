  to: 那段日子结束时，我尼布甲尼撒举目望天，我的神智[a]恢复了。于是我称颂至高者，赞美、尊崇那位永远活着的；因为他的权柄是永远的权柄，他的国度存到世世代代。
  rationale: 修订仅处理两处现代汉语表达：为末句补出表达持续性的谓语“存到”，并在“那永远活着的”中加入量词“位”。其余用语保留，以维持与原文的词汇区别、颂赞语体及脚注锚点。
