  yaml_path: translation/ot/daniel/004/025.yaml
  text: All this came upon King Nebuchadnezzar[a].
translation:
  language: zh_hans
  text: 这一切都临到了尼布甲尼撒王[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这一切都发生在尼布甲尼撒王身上。”
    reason: 词汇替代译法：מְּטָא עַל 既可表达“临到”，也可较直白地表达“发生在……身上”。
lexical_decisions:
- source_word: כֹּלָּא
  choice: 这一切
  rationale: 这是一个总括性表达，回指前文所宣告的全部事情；“这一切”自然、清楚，并保留完整涵盖之意。
- source_word: מְּטָא
  choice: 临到了
  rationale: 该动词可表示到达、达到；与介词 עַל 连用时，“临到”贴合某事落在某人身上的语义，也适合这里审判应验的庄重语境。
- source_word: עַל
  choice: 到……身上（体现在“临到了”中）
  rationale: 该介词标明事情所临及的对象；汉语以“临到某人”自然表达，无须逐词另译“在……之上”。
- source_word: נְבוּכַדְנֶצַּר
  choice: 尼布甲尼撒
  rationale: 采用现代中文圣经传统中通行且易识别的人名译法。
- source_word: מַלְכָּא
  choice: 王
  rationale: 此词为强调态，具有确定性；置于人名之后译作“尼布甲尼撒王”，符合现代汉语称谓习惯。
