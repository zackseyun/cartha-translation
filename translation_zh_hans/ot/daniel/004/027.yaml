base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/027.yaml
  text: The king answered and said[a], “Is this not Babylon the Great[b], which I myself built as a royal residence by the might of my power and for the glory of my majesty?”
translation:
  language: zh_hans
  text: 王回答说：“这不就是我亲自凭着我权能的力量建造为王权之都[a]、为彰显我威严的荣耀的大巴比伦吗？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“作为王权之家”；也可理解为“作为王室居所”。
    reason: lexical_alternative
lexical_decisions:
- source_word: עָנֵה ... וְאָמַר
  choice: 开口说
  rationale: 这是亚兰文常见的叙事套语；现代汉语通常无需机械保留两个动词，“开口说”既自然，也保留发言公式的庄重感。
- source_word: הֲלָא
  choice: 这不就是……吗
  rationale: 保留预期肯定回答的反问语气，并传达王自鸣得意的口吻。
- source_word: בָּבֶל רַבְּתָא
  choice: 大巴比伦
  rationale: 形容词位于专名之后并带强调意味；“大巴比伦”简洁、庄重，保留夸耀性的宏大语气。
- source_word: אֲנָה
  choice: 我亲自
  rationale: 独立人称代词置于动词之前具有强调作用；“我亲自”体现自我高举，却不增添“独自”之意。
- source_word: לְבֵית מַלְכוּ
  choice: 作为王室之城
  rationale: 字面为“作王权／王国之家”。所指是巴比伦作为王权中心，而非仅指一座宫殿；“王室之城”在上下文中自然，并保留城市与王权中心的关系。
- source_word: בִּתְקַף חִסְנִי
  choice: 用我大能的威力
  rationale: 原文有刻意强化、近乎叠加的表达；此译保留夸张和自夸色彩，不将其过度简化。
- source_word: וְלִיקָר הַדְרִי
  choice: 为要彰显我威严的荣耀
  rationale: 兼顾 יְקָר 的“荣耀／尊荣”和 הֲדַר 的“威严／华美”，保持王自我荣耀的高昂语气。
theological_decisions:
- issue: 尼布甲尼撒对巴比伦伟大的夸耀
  choice: 大巴比伦
  alternative: 伟大的巴比伦
  rationale: 原短语是描述性称谓，并非必须视为固定头衔；“大巴比伦”在中文中更凝练有力，同时保留骄傲自大的修辞效果。
- issue: 巴比伦作为“王权之家”的含义
  choice: 作为王室之城
  alternative: 作为王宫；作为王国之家
  rationale: 原文可指王权的居所或中心。上下文谈的是整座巴比伦城，因此避免缩窄为单一宫殿，同时以脚注保留较直译的可能。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。反问句和“我亲自”突出王的骄傲；保留原文“大能／威力”及“威严／荣耀”的强化性措辞。
