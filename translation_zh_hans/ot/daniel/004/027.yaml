    rationale: 原文的דִּי引出修饰“巴比伦”的关系从句。中文宜直接使“我亲自……建造”的内容修饰“大巴比伦”，避免重复的“这”。
  - severity: low
    issue: “王室之城”对לְבֵית מַלְכוּ的王权中心含义表达不够明确。
    rationale: 该短语可指王权／王国之“家”或王室居所；结合对象为整座巴比伦，“王权之都”较自然，同时以脚注保留其他可能。
