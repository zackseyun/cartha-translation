  text: וְ/עַ֣ד אָחֳרֵ֡ין עַל֩ קָֽדָמַ֨/י דָּנִיֵּ֜אל דִּֽי שְׁמֵ֤/הּ בֵּלְטְשַׁאצַּר֙ כְּ/שֻׁ֣ם אֱלָהִ֔/י וְ/דִ֛י רֽוּחַ אֱלָהִ֥ין קַדִּישִׁ֖ין בֵּ֑/הּ וְ/חֶלְמָ֖/א קָֽדָמ֥וֹ/הִי אַמְרֵֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/005.yaml
  text: 'At last Daniel came in before me—he whose name was Belteshazzar[a], after the name of my god, and in whom is the spirit of the holy gods—and I told the dream before him:'
translation:
  language: zh_hans
  text: 最后，但以理来到我面前；他的名字叫伯提沙撒，这名字是按我神的名起的；他里面有圣洁诸神的灵[a]。我把这梦告诉了他：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“圣洁之神的圣灵”或“圣洁之神的灵”。这里的亚兰文可以有不同理解；但从王的异教语境来看，“圣洁诸神的灵”较为自然。
    reason: 保留亚兰文复数异教表达与单数尊称理解之间的歧义。
lexical_decisions:
- source_word: וְעַד אָחֳרֵין
  choice: 最后
  rationale: 这个时间短语表示在其他人之后、到末了才发生；“最后”自然地传达了迟至末后的语气。
- source_word: עַל קָדָמַי
  choice: 来到我面前
  rationale: 既保留“来到”的动作，也表达进入君王面前的宫廷场景。
- source_word: דָּנִיֵּאל
  choice: 但以理
  rationale: 采用现代中文圣经传统中通行的人名音译。
- source_word: דִּי שְׁמֵהּ בֵּלְטְשַׁאצַּר
  choice: 他的名字叫伯提沙撒
  rationale: 准确表达关系从句对但以理巴比伦名字的说明，同时符合现代汉语习惯。
- source_word: כְּשֻׁם אֱלָהִי
  choice: 是照我神的名起的
  rationale: 介词与“名”的组合表示依照或取名于；此译法清楚说明名字与王所敬奉之神的关联。
- source_word: וְדִי רוּחַ אֱלָהִין קַדִּישִׁין בֵּהּ
  choice: 他里面有圣洁众神的灵
  rationale: 说话者是尼布甲尼撒，且“神”和“圣洁”在亚兰文中均呈复数形式；正文因此保留王的多神语境，不把它直接解释为“圣灵”。
- source_word: וְחֶלְמָא קָדָמוֹהִי אַמְרֵת
  choice: 我就把梦告诉了他
  rationale: 原文直译近于“我在他面前说出那梦”；现代汉语用“把梦告诉了他”自然表达在但以理面前陈述梦的意思。
theological_decisions:
- issue: 尼布甲尼撒所说 רוּחַ אֱלָהִין קַדִּישִׁין 的理解
  choice: 圣洁众神的灵
  alternative: 圣洁之神的圣灵；圣洁之神的灵
  rationale: 亚兰文的“神”和修饰它的“圣洁”具有复数形态，而说话者的异教背景也支持复数理解；不过 אֱלָהִין 在某些语境中也可指独一的神，因此用脚注保留单数理解，不在正文中消除原文的神学张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“来到我面前”保留宫廷陈述的语感；分号划分名字来源与灵在他里面这两项补充说明。脚注标在实际存在歧义的短语之后。
