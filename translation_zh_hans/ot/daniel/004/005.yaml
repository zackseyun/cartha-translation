  terminology: “但以理”“伯提沙撒”均采用中文圣经中通行的人名。正文保留“诸神”的复数，不将尼布甲尼撒的异教措辞调和为单一上帝或“圣灵”。脚注保留单数理解的可能性，并避免把该可能性当作正文结论。
