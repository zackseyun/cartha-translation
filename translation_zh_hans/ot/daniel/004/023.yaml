source:
  edition: WLC
  text: וְ/דִ֣י אֲמַ֗רוּ לְ/מִשְׁבַּ֞ק עִקַּ֤ר שָׁרְשׁ֨וֹ/הִי֙ דִּ֣י אִֽילָנָ֔/א מַלְכוּתָ֖/ךְ לָ֣/ךְ קַיָּמָ֑ה מִן דִּ֣י תִנְדַּ֔ע דִּ֥י שַׁלִּטִ֖ן שְׁמַיָּֽ/א־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/023.yaml
  text: And because they said to leave the stump of the tree with its roots[a], your kingdom will remain yours from the time that you know that Heaven rules.
translation:
  language: zh_hans
  text: 因为他们说要留下那树的树墩和根，你的国必仍归你所有，自你认识到天[a]掌权之时起。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“诸天掌权。”亚兰文“天”采用复数形式，并作为对神至高主权的敬称性表达。
    reason: 保留 שְׁמַיָּא 的字面复数形式及其在本处作为敬称性转喻的含义。
lexical_decisions:
- source_word: וְדִי
  choice: 这表示
  rationale: 该组合承接前文异象中的命令，并引出其解释。汉语用“这表示”自然地呈现说明关系，同时避免把因果关系说得过强。
- source_word: אֲמַרוּ
  choice: 他们吩咐
  rationale: 原文是主动复数“他们说”。结合守望者所宣告的命令语境，译作“他们吩咐”既保留复数主语，也清楚表达其言语功能。
- source_word: לְמִשְׁבַּק
  choice: 要留下
  rationale: שבק 在此指使某物留存、不被除尽；“要留下”符合砍树异象的语境。
- source_word: עִקַּר שָׁרְשׁוֹהִי דִּי אִילָנָא
  choice: 树墩和它的根
  rationale: 该短语指被砍之树残留的基部及根系；“树墩和它的根”在现代汉语中清楚保留这一形象。
- source_word: מַלְכוּתָךְ לָךְ קַיָּמָה
  choice: 你的国仍必归你
  rationale: קַיָּמָה 表示存立、保留；לָךְ 强调王国为王保留。“仍必归你”自然表达王权并未永久丧失，而将为他保留。
- source_word: מִן דִּי
  choice: 直到
  rationale: 字面结构可指从某一时点起；在本句语境中，所强调的是王国为他保留，直至他认识上天掌权。汉语“直到”能自然呈现惩罚阶段的终点及随后复位的条件性时点。
- source_word: תִנְדַּע
  choice: 你承认
  rationale: 动词基本义为“知道”，但此处不只是获得知识，也包括认识并承认主权事实；“承认”贴合上下文而不另加教义解释。
- source_word: שַׁלִּטִן שְׁמַיָּא
  choice: 上天掌权
  rationale: שְׁמַיָּא 字面为复数形式“诸天/天”，在此作为敬称性转喻，指神的主权；“上天掌权”保留转喻，不直接改译为“神掌权”。
theological_decisions:
- issue: שְׁמַיָּא 是按字面译作“诸天”，还是作为敬称性转喻译作“上天”
  choice: 上天掌权
  alternative: 诸天掌权
  rationale: 但以理书的语境表明，“天”在这里敬称并转指神的至高权柄。“上天”在现代汉语中自然保留这一含蓄表达，又不把原文直接释义为“神”。脚注同时保留字面形式。
- issue: תִנְדַּע 表示单纯知道，还是带有承认之意
  choice: 你承认
  alternative: 你知道
  rationale: 上下文关乎尼布甲尼撒对至高主权的实际认识与服膺，因此“承认”更准确传达语用含义；但其词汇本义仍是“知道”。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“树墩和它的根”保持异象的具体画面；“你的国仍必归你”清楚表达王权将被保留；“上天掌权”保留原文含蓄的敬称性表达。
