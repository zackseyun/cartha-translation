id: DAN.4.12
reference: Daniel 4:12
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: בְּרַ֨ם עִקַּ֤ר שָׁרְשׁ֨וֹ/הִי֙ בְּ/אַרְעָ֣/א שְׁבֻ֔קוּ וּ/בֶֽ/אֱסוּר֙ דִּֽי פַרְזֶ֣ל וּ/נְחָ֔שׁ בְּ/דִתְאָ֖/א דִּ֣י בָרָ֑/א וּ/בְ/טַ֤ל שְׁמַיָּ/א֙ יִצְטַבַּ֔ע וְ/עִם חֵיוְתָ֥/א חֲלָקֵ֖/הּ בַּ/עֲשַׂ֥ב אַרְעָֽ/א־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/012.yaml
  text: Nevertheless[a], leave the stump of its roots in the earth, even with a band of iron and bronze in the grass of the field; and let him be drenched with the dew of heaven, and let his portion be with the beasts in the grass of the earth.
translation:
  language: zh_hans
  text: 然而，要把它根部的树墩留在地里，套上铁和青铜的箍，留在田野的青草中；让他被天上的露水浸湿，让他在地上的草丛中与野兽同在。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּרַם
  choice: 然而
  rationale: 该转折词引出对砍树命令的例外；“然而”既清楚自然，也保留谕令庄重的语气。
- source_word: עִקַּר שָׁרְשׁוֹהִי
  choice: 它根部的树墩
  rationale: 该短语指树被砍后仍扎根于土中的基部，不只是抽象的“根”；此译兼顾树墩与根系的含义。
- source_word: בְּאַרְעָא
  choice: 在地里
  rationale: 此处是农业场景中的位置表达，指树墩留在土中；“地里”比“地上”更准确自然。
- source_word: שְׁבֻקוּ
  choice: 要把……留在
  rationale: 复数命令式承接上一节的命令；汉语用“要把……留在”简明地表达使其存留。
- source_word: וּבֶאֱסוּר דִּי פַרְזֶל וּנְחָשׁ
  choice: 用铁和青铜的箍箍住
  rationale: אֱסוּר 可指捆绑物或约束；主文采用“箍”，切合围住树墩的图像，同时脚注保留“锁链/镣铐”这一可能含义。נְחָשׁ 在古代金属语境中译作“青铜”。
- source_word: בְּדִתְאָא דִּי בָרָא
  choice: 在田野的青草中
  rationale: 该短语指旷野或田野中的草木；译文保留草地意象及其与后文受辱场景的联系。
- source_word: וּבְטַל שְׁמַיָּא יִצְטַבַּע
  choice: 让他被天露浸湿
  rationale: 动词具有被浸湿、沾湿之意；“浸湿”保留形象力度。“他”忠实呈现亚兰文由树的象征转向其所指之人的语法变化。
- source_word: וְעִם חֵיוְתָא חֲלָקֵהּ
  choice: 让他与野兽同得一份
  rationale: חֲלָקֵהּ 指他的份、分或命运；“同得一份”保留原文的分配措辞，也自然表达他与野兽处境相同。
- source_word: בַּעֲשַׂב אַרְעָא
  choice: 在地上的草丛中
  rationale: 此处再次描写地上的草木环境；“草丛”在现代汉语中自然，并避免与前句机械重复。
theological_decisions:
- issue: 树木意象转向其所指的人
  choice: 前半句以“它”指树墩，后半句按原文改用“他”：“让他被天露浸湿，让他与野兽同得一份”。
  alternative: 全节均用“它”，使描写始终停留在树木意象上。
  rationale: 亚兰文有意从树的象征转向树所代表的王；保留代词变化可维持异象的叙事逻辑，又不提前解释其身份。
- issue: 铁和青铜之物的功能
  choice: 主文采用围箍树墩的图像：“用铁和青铜的箍箍住”。
  alternative: 译作给人使用的“铁和青铜的锁链/镣铐”。
  rationale: 原词可表示捆绑物或约束，句法也允许不同理解。主文顺应当前树墩图像，脚注则明确保留可能转向受约束之人的解释，不消除原文张力。
translation_notes:
  register: 采用现代、庄重而易懂的谕令式表达。以“它”到“他”的代词转换保留原文从树木意象转向人物所指的突变；分号呈现命令的两个阶段。
