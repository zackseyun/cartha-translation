revisions:
- from: 然而，要把它根部的树墩留在地里，用铁和青铜的箍[a]箍住，留在田野的青草中；让他被天露浸湿，让他与野兽同得一份，在地上的草丛中。
  to: 然而，要把它根部的树墩留在地里，套上铁和青铜的箍，留在田野的青草中；让他被天上的露水浸湿，让他在地上的草丛中与野兽同在。
  rationale: 修订消除“箍箍住”的重复，改善末句在现代汉语中的完整性，并以“天上的露水”提高可懂度。仍保留原文由“它”转为“他”的意象转换，且不确定性未被脚注或主文消除。
