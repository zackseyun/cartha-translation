translation_notes:
  register: 采用现代、庄重而易懂的普通话。“渐渐长大，变得坚壮”保留异象中树木不断发展的动态；“诸天”对应亚兰文复数并保持诗性。脚注标记置于相关分句后，说明“可见”与“景象”之间的真实词义歧义。
