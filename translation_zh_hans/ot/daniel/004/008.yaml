base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/008.yaml
  text: The tree grew large and became strong[a], and its height reached to the heavens, and it was visible to the end of the whole earth.
translation:
  language: zh_hans
  text: 那棵树长大，变得强壮；树高直达诸天，从全地的尽头都能看见它[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“它的景象遍及全地的尽头。”亚兰文名词既可指“外观、景象”，也可指所看见的事物；本处语境较支持“从各处都能看见”的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: רְבָה
  choice: 渐渐长大
  rationale: 该动词表示增大、变得伟大；用于树木时，“渐渐长大”自然地传达生长发展的过程。
- source_word: אִילָנָא
  choice: 那棵树
  rationale: 强调态结合梦境中已出现的特定树木，宜作确定指称。
- source_word: וּתְקִף
  choice: 变得坚壮
  rationale: 该词表示变强、强盛；“坚壮”既适合树木意象，也保留力量增强的动态含义。
- source_word: וְרוּמֵהּ
  choice: 树高
  rationale: 源词指高度；“树高”简洁自然，并明确所指。
- source_word: יִמְטֵא לִשְׁמַיָּא
  choice: 直达诸天
  rationale: 动词表示达到，שְׁמַיָּא为复数形式；“诸天”保留原文高远而宏大的意象。
- source_word: וַחֲזוֹתֵהּ
  choice: 都能看见
  rationale: 该名词可指“外观、景象”或“可见之物”；在与“全地的尽头”搭配时，按可见性理解最符合语境，并以现代汉语动词结构表达。
- source_word: לְסוֹף כָּל אַרְעָא
  choice: 从全地的尽头
  rationale: 该短语指全地最远的边界；配合“能看见”用“从……尽头”表达从极远之处也可见的意思。
