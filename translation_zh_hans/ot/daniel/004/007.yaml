  text: וְ/חֶזְוֵ֥י רֵאשִׁ֖/י עַֽל מִשְׁכְּבִ֑/י חָזֵ֣ה הֲוֵ֔ית וַ/אֲל֥וּ אִילָ֛ן בְּ/ג֥וֹא אַרְעָ֖/א וְ/רוּמֵ֥/הּ שַׂגִּֽיא־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/007.yaml
  text: 'These were the visions of my head as I lay on my bed: and behold[a], a tree in the midst of the earth, and its height was great.'
translation:
  language: zh_hans
  text: 我躺在床上时，脑海中所见的异象[a]是这样的：看哪，大地中央有一棵树，它很高大。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 亚兰文直译为“我头的异象”。这是《但以理书》中指人在梦中内在所见景象的表达。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְחֶזְוֵי רֵאשִׁי
  choice: 脑中所见的异象
  rationale: 原文直译为“我头中的异象”，是《但以理书》反复出现的亚兰语习语，指梦中内在所见的景象。译作“脑中所见的异象”既保留身体意象，也符合现代汉语表达。
- source_word: עַל מִשְׁכְּבִי
  choice: 我躺在床上时
  rationale: 原文为“在我的床榻上”；结合 חָזֵה הֲוֵית 的持续性结构，译成时间背景从句，汉语自然清楚。
- source_word: חָזֵה הֲוֵית
  choice: 所见……是这样的
  rationale: 这是分词加 הוה 构成的迂回式，字面为“我正在看见”。汉语以“所见的异象是这样的”引出异象内容，保留其叙述功能而避免生硬直译。
- source_word: וַאֲלוּ
  choice: 看哪
  rationale: 该指示性惊叹语引出异象中引人注目的新景物；“看哪”保留庄重而醒目的叙事语气。
- source_word: אִילָן
  choice: 一棵树
  rationale: 这是该树首次出现；量词“一棵”符合现代汉语。
- source_word: בְּגוֹא אַרְעָא
  choice: 大地中央
  rationale: בְּגוֹא 表示“当中、中央”，אַרְעָא 可指“大地”或“土地”；此处异象后文具有广阔范围，故采用“大地”，同时不额外加入宇宙论解释。
- source_word: וְרוּמֵהּ שַׂגִּיא
  choice: 它非常高大
  rationale: 原文直陈“它的高度很大”。汉语用“非常高大”自然表达树的高度非凡，又不采用“高耸入云”等增译性措辞。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“看哪”保留异象叙事的突显语气；“大地中央”和“非常高大”避免过度解释，同时使汉语流畅。
