base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/021.yaml
  text: 'This is the interpretation[a], O king, and it is a decree of the Most High that has come upon my lord the king:'
translation:
  language: zh_hans
  text: 王啊，这就是解释；至高者的裁定已经临到我主我王：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דְּנָה פִשְׁרָא
  choice: 这就是解释
  rationale: 指明但以理即将说明梦的含义；“解释”贴合亚兰文在解梦语境中的常用意义。
- source_word: מַלְכָּא
  choice: 王啊
  rationale: 按呼格处理，保留庄重而自然的宫廷称呼。
- source_word: גְזֵרַת
  choice: 所定的旨意
  rationale: 该词表示权威者颁定的决定或谕令；与神圣主语连用时，“所定的旨意”既自然，也保留不可撤回的裁定意味。
- source_word: עִלָּיָא
  choice: 至高者
  rationale: 作为神的称号，强调他高于一切地上统治者；“至高者”在现代中文中准确、庄重。
- source_word: מְטָת עַל
  choice: 已经临到
  rationale: 保留“到达、来到……之上”的意象及审判语境中的肃穆感，不进一步解释为“攻击”或“惩罚”。
- source_word: מָרִי מַלְכָּא
  choice: 我主我王
  rationale: 保留说话者对君王的双重尊称及原文宫廷语体。
theological_decisions:
- issue: 神圣称号 עִלָּיָא 的译法
  choice: 至高者
  alternative: 最高者
  rationale: “至高者”是自然且成熟的神圣称号，明确表达神超越地上一切君王，却不加入文本以外的教义说明。
- issue: גְזֵרַת 的神学与权威色彩
  choice: 所定的旨意
  alternative: 命令；谕旨；裁定
  rationale: 原词兼具权威决定和颁定之意；此处保持其神圣权威及审判色彩，同时不把它缩窄为某一种行政文书。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。分号对应两个并列判断句；“王啊”与“我主我王”保留宫廷敬语。
