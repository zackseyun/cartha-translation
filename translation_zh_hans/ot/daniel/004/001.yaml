base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/001.yaml
  text: I[a], Nebuchadnezzar[b], was at ease in my house and flourishing in my palace.
translation:
  language: zh_hans
  text: 我，尼布甲尼撒，在我家中安稳[a]，在我王宫中兴旺[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “安稳”或译“安逸”或“安然”；原文可侧重平静安适，也可侧重安全无扰。
    reason: lexical_alternative
  - marker: b
    text: “兴旺”或译“昌盛”；原文表达旺盛、繁荣的良好状态。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲנָה
  choice: 我
  rationale: 这是第一人称独立代词；与随后的人名构成同位结构，译作“我尼布甲尼撒”既忠实又符合现代汉语叙述习惯。
- source_word: נְבוּכַדְנֶצַּר
  choice: 尼布甲尼撒
  rationale: 采用现代中文圣经传统中通行的人名音译。
- source_word: שְׁלֵה
  choice: 安稳
  rationale: 该亚兰语形容词可表达安逸、平静或安全无扰；“安稳”兼顾平静与安全两层含义，也避免“安逸”可能带有的贬义。
- source_word: הֲוֵית
  choice: （隐含于“安稳”）
  rationale: 此处作系词，表示当时所处的状态；现代汉语形容词谓语无需另译“是”。
- source_word: בְּבֵיתִי
  choice: 在自己的家中
  rationale: 保留“家／房屋”的具体意象；用“自己的”清楚表达第一人称领属关系，并与句首主语自然衔接。
- source_word: וְרַעְנַן
  choice: 兴旺
  rationale: 该词表示新鲜、有活力、繁盛的良好状态；“兴旺”在此可涵盖旺盛与昌盛，而不把意象限制为植物繁茂。
- source_word: בְּהֵיכְלִי
  choice: 在自己的王宫里
  rationale: הֵיכַל 可指宫殿或圣殿；君王自述居所的语境明确支持“王宫”，可避免误解为宗教圣殿。
