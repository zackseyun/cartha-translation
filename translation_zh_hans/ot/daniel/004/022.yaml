id: DAN.4.22
reference: Daniel 4:22
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/לָ֣/ךְ טָֽרְדִ֣ין מִן אֲנָשָׁ֡/א וְ/עִם חֵיוַ֣ת בָּרָ/א֩ לֶהֱוֵ֨ה מְדֹרָ֜/ךְ וְ/עִשְׂבָּ֥/א כְ/תוֹרִ֣ין לָ֣/ךְ יְטַֽעֲמ֗וּן וּ/מִ/טַּ֤ל שְׁמַיָּ/א֙ לָ֣/ךְ מְצַבְּעִ֔ין וְ/שִׁבְעָ֥ה עִדָּנִ֖ין יַחְלְפ֣וּן עֲלָ֑/יךְ עַ֣ד דִּֽי תִנְדַּ֗ע דִּֽי שַׁלִּ֤יט עִלָּיָ/א֙ בְּ/מַלְכ֣וּת אֲנָשָׁ֔/א וּ/לְ/מַן דִּ֥י יִצְבֵּ֖א יִתְּנִנַּֽ/הּ־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/022.yaml
  text: And you will be driven away from men[a], and your dwelling will be with the beasts of the field. You will be made to eat grass like oxen, and you will be drenched with the dew of heaven, and seven times will pass over you[b], until you know that the Most High rules in the kingdom of men and gives it to whomever he wills.
translation:
  language: zh_hans
  text: 你必被赶离人群[a]，与田野的走兽同住。你必被迫像牛一样吃草，被天上的露水浸湿；七个时期必临到你身上[b]，直到你知道：至高者掌管人类的国度，并把它赐给他所愿意的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你必被人赶走。”原文用未指明身份的复数主语。
    reason: 说明亚兰语主动句的不定主语及正文采用被动表达的依据。
  - marker: b
    text: “时期”原文所指的确切长度不明；许多人理解为“年”。
    reason: 保留 עִדָּנִין 的时间单位歧义，避免正文过度确定为七年。
lexical_decisions:
- source_word: טָרְדִין מִן אֲנָשָׁא
  choice: 你必被赶离人群
  rationale: 原文是以不定复数主语表达的主动形式，汉语用被动句自然地传达有人强行将王逐出人类社会的意思；“人群”也清楚呈现人与野兽生活的对比。
- source_word: חֵיוַת בָּרָא
  choice: 田野的走兽
  rationale: 保留原文“田野之兽”的具体意象和庄重语气，同时用现代汉语常见的“走兽”指陆地野生动物。
- source_word: מְדֹרָךְ
  choice: 同住
  rationale: 原义为“你的住处”；结合介词结构译作“与……同住”更符合现代汉语，又保留居所转移的含义。
- source_word: וְעִשְׂבָּא כְתוֹרִין לָךְ יְטַעֲמוּן
  choice: 你必被迫像牛一样吃草
  rationale: 动词为使役形式，不能仅译为自主的“吃”；“被迫”保留审判临到、此事强加于王的意味。“牛”自然涵盖原文复数牛类的比较意象。
- source_word: וּמִטַּל שְׁמַיָּא לָךְ מְצַבְּעִין
  choice: 被天上的露水浸湿
  rationale: “天上的露水”贴近原文意象；“浸湿”准确传达被露水弄湿、浸润的程度，而不过度强化为暴雨般的“淋透”。
- source_word: שִׁבְעָה עִדָּנִין
  choice: 七个时期
  rationale: עִדָּנִין 指时间段，但本身没有明确规定为“年”；“时期”在正文中保留时长的不确定性。
- source_word: יַחְלְפוּן עֲלָיךְ
  choice: 必从你身上过去
  rationale: 较直接地保存原文时间“经过在你之上”的个人经历感，且汉语可理解为这段时期临到并经过他。
- source_word: שַׁלִּיט עִלָּיָא בְּמַלְכוּת אֲנָשָׁא
  choice: 至高者掌管人类的国度
  rationale: “至高者”是神圣称号的自然对应；“掌管”表达统治权。“人类的国度”既可指人类统治的领域，也可指人世间的王权，保留原语的语义张力。
- source_word: וּלְמַן דִּי יִצְבֵּא יִתְּנִנַּהּ
  choice: 并把它赐给他所愿意的人
  rationale: “它”回指国度；“他所愿意的人”紧贴原文，不额外解释神拣选的依据。
theological_decisions:
- issue: 尼布甲尼撒受审判的“七个时期”究竟多长
  choice: 七个时期
  alternative: 七年；七季；七个时段
  rationale: 亚兰语 עִדָּנִין 只明确表示时间单位或时期，不能单凭本节确定为七年。正文不把常见解释写成原文已经明说的内容。
- issue: “人类的国度”的范围
  choice: 人类的国度
  alternative: 人的王国；人间的统治权；世人的国
  rationale: 该短语既关乎人类社会中的王权，也可涵盖人类所处的统治领域；采用较宽的译法，避免将含义缩窄为某一个帝国或单一政体。
- issue: “知道”的认知性质
  choice: 直到你知道
  alternative: 直到你承认；直到你认识到
  rationale: 原文基本义是“知道”，语境虽包含因经历审判而承认神主权的意味，但正文保留原词，不把其心理或悔改程度解释得过满。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。句式保留宣告审判的节奏，以“必”呈现预言的确定性；避免过度古雅的“居所”“沾濡”等词，也不以教派性术语解释至高者的主权。所有脚注标记均已置于相关正文位置。
