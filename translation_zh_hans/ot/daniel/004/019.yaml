base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/019.yaml
  text: You are the king[a], who has grown great and strong; your greatness has become great and reached to heaven, and your dominion to the end of the earth.
translation:
  language: zh_hans
  text: 你就是那位已经变得强大、强盛的王；你的威势已变得浩大，直达天上；你的统治权延伸到地极[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“延伸到大地的尽头”。
    reason: “地极”所译的亚兰语短语字面意为“地的尽头”；脚注保留较直译的表达。
lexical_decisions:
- source_word: אַנְתָּה הוּא
  choice: 你就是
  rationale: 代词加系词构成强调性的直接认定；“你就是”自然保留了“那棵树正是你”的强调。
- source_word: מַלְכָּא
  choice: 那位王
  rationale: 此处不是呼格，而是把梦中的树认定为尼布甲尼撒王；“那位王”在现代汉语中明确而庄重。
- source_word: דִּי
  choice: （另起一句承接描述）
  rationale: 亚兰语关系从句描述这位王；汉语用后续陈述句比生硬直译“那位……的王”更自然。
- source_word: רְבַית וּתְקֵפְתְּ
  choice: 你日益壮大，越发强盛
  rationale: 分别表达“变得伟大”和“变得强有力”，保留两个并列动词及其递进感，同时符合君王势力增长的语境。
- source_word: וּרְבוּתָךְ רְבָת
  choice: 你的威势越来越浩大
  rationale: 原文名词和动词重复“伟大/增大”。汉语以“威势……浩大”表达君王的显赫与规模，并用“越来越”保留增长过程。
- source_word: וּמְטָת לִשְׁמַיָּא
  choice: 直达天上
  rationale: 准确表达“达到天/诸天”，且延续梦中巨树高耸入天的意象。
- source_word: וְשָׁלְטָנָךְ
  choice: 你的统治权
  rationale: שָׁלְטָן 指统治、权柄或管辖权；“统治权”兼顾实际统治与王权含义。
- source_word: לְסוֹף אַרְעָא
  choice: 到地极
  rationale: 原文直译为“到地的尽头”。“地极”是自然、庄重的汉语表达，可指极远之处而不预先界定其政治范围。
theological_decisions:
- issue: 王权覆盖范围
  choice: 译作“延伸到地极”
  alternative: 译作“延伸到全地的尽头”或理解为严格意义上的全球政治统治
  rationale: 原文采用古代王权语境中表示广大统治范围的措辞。译文保留其普遍、宏大的表述，不把它限定为地方性势力，也不强行判定为现代地理意义上的全球统治。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。以短句处理亚兰语关系结构，使认定与描述层次清楚；保留“壮大—强盛—浩大”的重复和递进，同时避免过度古雅。
