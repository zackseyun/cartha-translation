source:
  edition: WLC
  text: בֵּ/אדַ֣יִן עללין חַרְטֻמַיָּ/א֙ אָֽשְׁפַיָּ֔/א כשדי/א וְ/גָזְרַיָּ֑/א וְ/חֶלְמָ֗/א אָמַ֤ר אֲנָה֙ קֳדָ֣מֵי/ה֔וֹן וּ/פִשְׁרֵ֖/הּ לָא מְהוֹדְעִ֥ין לִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/004.yaml
  text: Then the magicians[a], enchanters, Chaldeans, and diviners came in, and I told the dream before them[b], but they did not make its interpretation known to me.
translation:
  language: zh_hans
  text: 于是，术士、咒术师、迦勒底人[a]和占卜者都进来了。我在他们面前讲述了那个梦，但他们没有把梦的解释告诉我。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “迦勒底人”在这里可能不只是指一个族群，也可能指巴比伦宫廷中一类专家。
    reason: cultural_note
  - marker: b
    text: 或译：“他们不能把梦的解释告诉我。”亚兰文直译是“他们没有使我知道”；“不能”是根据上下文作出的推断，一些译本采用这种表达。
    reason: alternative_reading
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: 那时
  rationale: 这是推进叙事的亚兰语连接词；“那时”自然庄重，也保留事件承接关系。
- source_word: עללין
  choice: 都进来了
  rationale: 该复数动词表示进入；“进来了”符合宫廷人员奉召入见的场景，补出“都”以自然表达所列各类人的共同动作。
- source_word: חַרְטֻמַיָּא
  choice: 术士
  rationale: 指巴比伦宫廷中与秘术有关的一类专家；“术士”是现代中文中清楚、简洁且不过度具体化的对应词。
- source_word: אָשְׁפַיָּא
  choice: 咒术师
  rationale: 指从事咒术或法术的一类人员；此译法既与“术士”有所区分，也不擅自限定为占星者。
- source_word: כַּשְׂדָּיָא
  choice: 迦勒底人
  rationale: 保留原文的族名或职衔；在本宫廷名单中可能特指一类巴比伦学术或占卜专家，故以脚注说明其专业含义。
- source_word: גָזְרַיָּא
  choice: 占卜者
  rationale: 在此语境中指借占卜作判断或宣告解释的人；“占卜者”清楚且符合名单中的专业类别。
- source_word: חֶלְמָא
  choice: 那个梦
  rationale: 原文为强调状态，语境指尼布甲尼撒已经提及的特定梦；“那个梦”在现代中文中自然地表达特指。
- source_word: אָמַר אֲנָה קֳדָמֵיהוֹן
  choice: 我在他们面前讲述了那个梦
  rationale: 原文直指“在他们面前说”；此译既保留众人在场的公开场景，也符合中文叙事表达。
- source_word: וּפִשְׁרֵהּ
  choice: 梦的解释
  rationale: פִשְׁרָא在《但以理书》中常指梦或奥秘的解释；“解释”保留其技术含义，并在中文中明确所指。
- source_word: לָא מְהוֹדְעִין לִי
  choice: 他们没有把梦的解释告诉我
  rationale: 使役形式表示“使知道、告知”；此译直接表达原文所说的未告知，不把语境所暗示的无能明写进正文。
theological_decisions:
- issue: 末句应译为“没有告诉我”，还是“不能告诉我”
  choice: 他们没有把梦的解释告诉我
  alternative: 他们不能把梦的解释告诉我
  rationale: 亚兰文以否定词加使役分词，直接陈述他们没有使王知道解释；上下文或可推知他们无能为力，但本节并未明确使用表示“不能”的措辞，因此正文保留原文的克制，并以脚注交代另一种理解。
translation_notes:
  register: 采用现代标准汉语，语气庄重而易懂。四类宫廷人员使用彼此可区分的常用称谓；句法保留“在他们面前”的公开陈述场景。脚注标记按实际注释对象安置，避免英文咨询层中标记与注释内容错位。
