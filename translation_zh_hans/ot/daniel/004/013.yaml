  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: לִבְבֵ/הּ֙ מִן אנוש/א יְשַׁנּ֔וֹן וּ/לְבַ֥ב חֵיוָ֖ה יִתְיְהִ֣ב לֵ֑/הּ וְ/שִׁבְעָ֥ה עִדָּנִ֖ין יַחְלְפ֥וּן עֲלֽוֹ/הִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/013.yaml
  text: Let his heart be changed from that of a man[a], and let the heart of a beast be given to him, and let seven times pass over him.
translation:
  language: zh_hans
  text: 他的心要被改变，不再是人的心；野兽的心要赐给他；七个时期[a]要从他身上经过。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“七段时间”或“七季”；亚兰语指指定的时间或时期，本节没有说明其确切长度。
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְבֵהּ
  choice: 他的心
  rationale: 亚兰语“心”指人的内在自我，包括思想和性情。译作“心”既保留原文意象，也不把含义限缩为“心智”。
- source_word: מִן אֱנוֹשָׁא
  choice: 不再是人的心
  rationale: 原文直译近于“从人（的状态）改变他的心”。汉语补出“心”并用“不再是”表达脱离人的状态，清楚自然，又不强调特定性别。
- source_word: יְשַׁנּוֹן
  choice: 要被改变
  rationale: 原文复数动词在此可作不定施事的表达。使用被动式保留施事者未明说的特点，不另行指定是谁改变他的心。
- source_word: וּלְבַב חֵיוָה
  choice: 野兽的心
  rationale: “野兽”保留审判场景中人与兽的鲜明对照；“心”延续原文具体意象，涵盖思想与性情。
- source_word: יִתְיְהִב לֵהּ
  choice: 要赐给他
  rationale: 准确表达“被给予他”的意思；汉语“赐给”符合庄重的经文语体，同时未明说施予者。
- source_word: שִׁבְעָה עִדָּנִין
  choice: 七个时期
  rationale: עִדָּן表示时间、时期或季节，此处没有说明每一时期的确切长度。“七个时期”自然且避免误定为七年。
- source_word: יַחְלְפוּן עֲלֹוהִי
  choice: 要在他身上过去
  rationale: 贴近原文“从他身上／在他之上经过”的空间性表达，同时清楚传达这些时期将就他而言流逝。
theological_decisions:
- issue: 所描述审判的性质
  choice: 保留“人的心”被改变并获赐“野兽的心”的意象，不说明这是身体变形还是兽性般的心智状态。
  alternative: 明确译为身体发生变形，或明确解释为疯狂、精神失常。
  rationale: 本节只陈述心的改变，并未界定其生理或心理机制；直译核心意象可保存原文的神学张力与歧义。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。三个分句保持原文的平行结构；使用“要被改变”“要赐给”“要……过去”表达宣告中的将来／命令色彩。脚注标记置于其实际说明的“七个时期”之后。
