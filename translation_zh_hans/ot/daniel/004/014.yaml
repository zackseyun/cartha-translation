source:
  edition: WLC
  text: בִּ/גְזֵרַ֤ת עִירִין֙ פִּתְגָמָ֔/א וּ/מֵאמַ֥ר קַדִּישִׁ֖ין שְׁאֵֽלְתָ֑/א עַד דִּבְרַ֡ת דִּ֣י יִנְדְּע֣וּן חַ֠יַּיָּ/א דִּֽי שַׁלִּ֨יט עלי/א בְּ/מַלְכ֣וּת אנוש/א וּ/לְ/מַן דִּ֤י יִצְבֵּא֙ יִתְּנִנַּ֔/הּ וּ/שְׁפַ֥ל אֲנָשִׁ֖ים יְקִ֥ים עלי/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/014.yaml
  text: The sentence is by the decree of the watchers[a], and the decision by the word of the holy ones, so that the living may know that the Most High rules in the kingdom of mankind and gives it to whom he wills[c][b], and sets up over it the lowliest of men.
translation:
  language: zh_hans
  text: “这判语出于守望者的谕令[b]，这决定出于圣者的话语[a]，为要使活着的人知道：至高者掌管人类的国度[c]，并随自己的旨意把国度赐给谁，又立人中最卑微的人在其上。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本句的亚兰文十分凝缩；שְׁאֵלְתָא也可译为“请求”或“诉求”。因此，这半句也可理解为“这决定是按圣者的请求作出的”。
    reason: lexical_alternative
  - marker: b
    text: “守望者”直译《但以理书》中一个指天上存在者的专门称谓；许多解释者认为他们是天使。
    reason: cultural_note
  - marker: c
    text: “人类的国度”也可译作“人的国度”或“人间的王权”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּגְזֵרַת
  choice: 出于……的谕令
  rationale: גְזֵרָה表示正式而具有权威的决定或谕令；“出于”也保留了介词בְּ所表达的依据或来源。
- source_word: עִירִין
  choice: 守望者
  rationale: 这是《但以理书》中指天上存在者的专门称谓；采用直译，避免直接解释为“天使”。
- source_word: פִּתְגָמָא
  choice: 判语
  rationale: 此处指已经宣告的司法性裁决；“判语”既保留法律语气，也比宽泛的“话”更贴合上下文。
- source_word: וּמֵאמַר קַדִּישִׁין שְׁאֵלְתָא
  choice: 这决定出于圣者的命令
  rationale: 原文表达高度凝缩。מֵאמַר可指话语或命令，שְׁאֵלְתָא在此可按平行结构理解为决定，也可直译为请求或诉求；正文传达权威宣告，脚注保留另一种真实可能。
- source_word: קַדִּישִׁין
  choice: 圣者
  rationale: 该词与“守望者”平行，所指是天上的圣洁存在者；“圣者”保留原文称谓，不引入后来的教会用语。
- source_word: עַד דִּבְרַת דִּי
  choice: 为要使
  rationale: 该结构引出目的或结果；“为要使”在现代中文中庄重清楚，并保留目的意味。
- source_word: חַיַּיָּא
  choice: 活着的人
  rationale: 原词泛指活人；此译自然明确，又不把范围不必要地扩大为一切生物。
- source_word: שַׁלִּיט עִלָּיָא
  choice: 至高者掌管
  rationale: עִלָּיָא是“至高者”这一称号，שַׁלִּיט表达实际的统治权；“掌管”保留其主动语义。
- source_word: בְּמַלְכוּת אֱנוֹשָׁא
  choice: 人类的国度
  rationale: אֱנוֹשָׁא是集合意义上的人类，介词בְּ直译为“在……中”；中文以“掌管人类的国度”自然表达在这领域中施行统治的含义。
- source_word: וּלְמַן דִּי יִצְבֵּא יִתְּנִנַּהּ
  choice: 随自己的旨意把国赐给谁
  rationale: 该句强调至高者自由赐予王权；“随自己的旨意”既庄重，也保留意愿与主权的力度。
- source_word: וּשְׁפַל אֲנָשִׁים
  choice: 人中最卑微的
  rationale: 这是单数形容词与复数名词组成的惯用表达，意为在人群中地位最低微者；此译保留最高级意味，但不额外断定其道德卑劣。
theological_decisions:
- issue: “守望者”和“圣者”的身份
  choice: 正文保留原文天上议会场景中的专门称谓“守望者”和“圣者”。
  alternative: 译作“天使”或“天上的存在者”。
  rationale: 原文没有在本节直接使用“天使”一词。保留其独特称谓可维护《但以理书》的意象，也避免把解释写入正文。
- issue: 守望者、圣者的谕令与至高者主权之间的张力
  choice: 照原文保留天上存在者颁令、作决定的说法，同时明确陈述至高者掌管并赐予国度。
  alternative: 把前半句改写成守望者仅仅转达至高者的命令。
  rationale: 经文本身并列呈现天上议会的参与和至高者的终极统治；翻译不应借改写消除这种神学张力。
- issue: “最卑微”是社会地位还是道德评价
  choice: 采用可涵盖低微身份的“最卑微”，不明确加上贬义道德判断。
  alternative: 译作“最卑贱”或“最恶劣”。
  rationale: שְׁפַל首先表示低下、卑微；上下文可产生贬抑色彩，但原词本身不足以要求译成道德上的邪恶。
translation_notes:
  register: 采用现代、庄重而可朗读的普通话。“判语、谕令、旨意”维持天上法庭与王权语境；句法则避免过度文言化。正文不把“守望者”直接解释为天使，并以脚注保存首句在词义和句法上的歧义。
