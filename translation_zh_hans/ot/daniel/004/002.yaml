base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/002.yaml
  text: I saw a dream[a], and it frightened me; and the thoughts on my bed and the visions of my head terrified me.
translation:
  language: zh_hans
  text: 我做了一个梦[a]，这梦使我害怕；我躺在床上时的思绪，以及脑海中的异象，都使我惊恐。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我做了一个梦，这梦使我害怕；我在床上的思绪和脑海中的异象使我惊慌。”
    reason: 提供较贴近原文并列结构及末尾动词较弱语气的译法；原文相关词语可译为“思绪／思索”和“惊恐／惊慌”。
lexical_decisions:
- source_word: חֵלֶם חֲזֵית
  choice: 我做了一个梦
  rationale: 原文直译为“我看见一个梦”。现代汉语通常说“做梦”；这样表达自然，也保留了叙述的直接性。
- source_word: וִידַחֲלִנַּנִי
  choice: 这梦使我害怕
  rationale: 动词带第一人称单数宾语，单数主语最自然地回指前面的“梦”；明确译出“这梦”，使汉语指代清楚。
- source_word: וְהַרְהֹרִין
  choice: 思绪
  rationale: 该词可指思想、思索或内心意念。“思绪”符合梦境语境，也与后面的“异象”自然并列。
- source_word: עַל מִשְׁכְּבִי
  choice: 我躺在床上时
  rationale: 字面为“在我的床上”。译作时间情境短语，符合现代汉语表达，同时保留卧床这一场景。
- source_word: וְחֶזְוֵי רֵאשִׁי
  choice: 脑海中的异象
  rationale: 字面为“我头中的异象”或“我头的异象”。“脑海中的”自然传达闪现在意识中的异象，而“异象”保留 חזוי 的视觉和启示性含义。
- source_word: יְבַהֲלֻנַּנִי
  choice: 都使我惊恐
  rationale: 该动词表示使人惊惶、惊恐；复数形式对应前面的“思绪”和“异象”。加入“都”在汉语中清楚体现复合主语。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙述语言。“做了一个梦”符合标准汉语习惯；“脑海中的异象”避免生硬的“头中的异象”。分号保留原文从梦本身转向床上思绪与异象的平行推进。
