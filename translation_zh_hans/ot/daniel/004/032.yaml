  source_fidelity: 译文准确呈现阿拉姆语的三层宣告：地上居民在至高者面前被看为无有、他按自己的意愿在天上的军旅和地上居民中行事、无人能拦阻或质问他。“在他看来都算不得什么”表达的是价值/分量上的否定，并未误译为人不存在；“挡住他的手”恰当转达“击打他的手”这一惯用表达所含的拦阻之意。
  naturalness: 整体为自然、庄重且易懂的现代标准汉语。分号后的并列宣告及末句反问均有合宜的经文语体。“天军”虽较凝练，但在本处可理解，并由脚注说明其未被限定为天使或天体。
  terminology: “旨意”“行事”“天军”与本段关于至高者主权的庄重语域相称，且没有将天上的军旅具体化为某一类存在。“他”忠实保留原文代词，并由上下文确定指向。脚注a和b均有清楚锚点，脚注b有效保留原文的字面意象。
