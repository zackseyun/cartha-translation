id: DAN.4.32
reference: Daniel 4:32
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/כָל דארי אַרְעָ/א֙ כְּ/לָ֣ה חֲשִׁיבִ֔ין וּֽ/כְ/מִצְבְּיֵ֗/הּ עָבֵד֙ בְּ/חֵ֣יל שְׁמַיָּ֔/א ו/דארי אַרְעָ֑/א וְ/לָ֤א אִיתַי֙ דִּֽי יְמַחֵ֣א בִ/ידֵ֔/הּ וְ/יֵ֥אמַר לֵ֖/הּ מָ֥ה עֲבַֽדְתְּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/032.yaml
  text: And all the inhabitants of the earth are regarded as nothing[a], and he does according to his will among the army of heaven and among the inhabitants of the earth; and there is no one who can strike his hand or say to him[b], “What have you done?”
translation:
  language: zh_hans
  text: 地上所有的居民在他看来都算不得什么；他在天军[a]中和地上的居民中，都照自己的旨意行事。没有谁能挡住他的手[b]，或对他说：“你做了什么？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “天军”也可译作“天上的众军”；这里没有明确限定为天使或天体。
    reason: lexical_alternative
  - marker: b
    text: 原文直译“击打他的手”，意思是阻挡或制止他。
    reason: idiom
lexical_decisions:
- source_word: דארי אַרְעָא
  choice: 地上的居民
  rationale: 这个阿拉姆语分词表达指居住在地上或地中的人；“地上的居民”自然、庄重，也保留本节的普遍范围。
- source_word: כְּלָה חֲשִׁיבִין
  choice: 在他看来都算不得什么
  rationale: 原文表达衡量、看待或算为无有，并非断言人不存在；此译既传达人在至高者面前毫无分量，也避免过度解释。
- source_word: וּכְמִצְבְּיֵהּ
  choice: 照自己的旨意
  rationale: מִצְבֵּא 可指意愿、心意或喜悦；“旨意”符合庄重语域，并准确表达自主决定。
- source_word: עָבֵד
  choice: 行事
  rationale: 该常用动词意为做、实行；“行事”在本句中比单用“做”自然，同时保持概括性的行动含义。
- source_word: בְּחֵיל שְׁמַיָּא
  choice: 在天军中
  rationale: חֵיל 可指军队、众军或力量；“天军”保留军事意象，又不把所指限定为天使或星体。
- source_word: וְלָא אִיתַי דִּי
  choice: 没有谁能
  rationale: 保留原文存在句式所强调的绝对无人能够干预。
- source_word: יְמַחֵא בִידֵהּ
  choice: 能挡住他的手
  rationale: 原文直译为“击打他的手”，在语境中是阻挡、制止其行动的惯用表达；正文译出实际含义，脚注保留具体意象。
- source_word: מָה עֲבַדְתְּ
  choice: 你做了什么？
  rationale: 直接保留原文对既成行动提出质问的修辞力量，不改成较弱的“你在做什么”。
theological_decisions:
- issue: 施行主权者的身份
  choice: 沿用第三人称“他”，由上下文表明所指是至高者
  alternative: 在本节明写“上帝”或“至高者”
  rationale: 原文本节使用代词；保留代词可忠实呈现文本衔接，同时不削弱上下文明确的神圣所指。
- issue: בְּחֵיל שְׁמַיָּא 所涵盖的对象
  choice: 译作“天军”，不进一步指明其成员
  alternative: 明确译作“众天使”或“天体”
  rationale: 该词组可广指天上的众军；原文没有在此限定为天使或星辰，因此译文保留其广度。
- issue: יְמַחֵא בִידֵהּ 的字面意象与惯用含义
  choice: 正文译作“挡住他的手”，脚注注明字面为“击打他的手”
  alternative: 正文直译“击打他的手”
  rationale: 现代汉语中的纯字面译法容易被误解为攻击或责打；译出“阻挡”的惯用含义能准确表达无人可干预其行动，同时以脚注保存原文意象。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“算不得什么”避免把原文误解为不存在；“照自己的旨意行事”保持神学分量；分号与短句使宣告性的节奏清晰。
