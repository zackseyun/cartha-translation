  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: בֵּ/הּ זִמְנָ֞/א מַנְדְּעִ֣/י יְת֣וּב עֲלַ֗/י וְ/לִ/יקַ֨ר מַלְכוּתִ֜/י הַדְרִ֤/י וְ/זִוִ/י֙ יְת֣וּב עֲלַ֔/י וְ/לִ֕/י הַדָּֽבְרַ֥/י וְ/רַבְרְבָנַ֖/י יְבַע֑וֹן וְ/עַל מַלְכוּתִ֣/י הָתְקְנַ֔ת וּ/רְב֥וּ יַתִּירָ֖ה ה֥וּסְפַת לִֽ/י־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/033.yaml
  text: At that time my reason returned to me[a], and for the glory of my kingdom, my majesty and splendor returned to me. My counselors and my nobles sought me, and I was reestablished over my kingdom[c][b], and surpassing greatness was added to me.
translation:
  language: zh_hans
  text: 那时，我的理智恢复了[a]；为了我王国的荣耀，我的威严和光彩也恢复了。我的谋士和权贵来求见我[b]；我重新被确立为我王国的统治者[c]，又有非凡的尊荣加给了我。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “理智”也可译作“悟性”或“心智”。
    reason: lexical_alternative
  - marker: b
    text: “来求见我”也可译作“寻找我”或“寻求我”；“谋士和权贵”也可译作“顾问和大臣”。
    reason: lexical_alternative
  - marker: c
    text: “重新被确立为我王国的统治者”也可译作“在我的国中重新得以稳固”或“重新掌管我的国”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּהּ זִמְנָא
  choice: 那时
  rationale: 这是自然简洁的时间表达，既承接前文，也不把时间的即时性说得过强。
- source_word: מַנְדְּעִי
  choice: 我的理智
  rationale: 此处指尼布甲尼撒恢复了正常的认知和理性能力；“理智”比“知识”更符合语境，同时保留“悟性”这一可能译法于脚注。
- source_word: יְתוּב עֲלַי
  choice: 恢复了
  rationale: 原义为“回到我这里”；中文用“恢复了”较自然，并能清楚表达理智及君王威仪的复原。
- source_word: לִיקַר מַלְכוּתִי
  choice: 使我的国重得荣耀
  rationale: לִ־可表达关系、目的或结果；此译在中文中自然地呈现王者威仪恢复与国度荣耀之间的关联，又以“重得”配合全节的复归语境。
- source_word: הַדְרִי וְזִוִי
  choice: 我的威严和光彩
  rationale: הדר指君王的威严、尊荣，זיו可指光辉、容光或外在风采；“威严和光彩”适合王室语境，并保留两词的区别。
- source_word: הַדָּבְרַי וְרַבְרְבָנַי
  choice: 我的谋士和权贵
  rationale: 前者指为王出谋献策的人，后者指国中位高权重者；“谋士和权贵”简明而符合宫廷语境。
- source_word: יְבַעוֹן
  choice: 来求见我
  rationale: 该动词可指寻找、寻求或请求；在王权恢复的场景中，“来求见我”自然表达群臣重新前来接触并承认君王，但脚注保留较直译的可能。
- source_word: עַל מַלְכוּתִי הָתְקְנַת
  choice: 我重新被立在我的国之上
  rationale: 被动形式表示他重新被安置并稳固在统治位置上；保留被动语态，不明说施事者。
- source_word: רְבוּ יַתִּירָה
  choice: 格外的威势
  rationale: רבוּ表示强盛、伟大，יַתִּירָה加强程度；“格外的威势”符合君王语境，又不必明确比较对象。
- source_word: הוּסְפַת לִי
  choice: 加给我
  rationale: 保留原文“被加给”的外来施加意味，但不在本节直接补出上帝为施事者。
theological_decisions:
- issue: 君王复原背后的神圣施事者是否明说
  choice: 沿用“恢复了”“被立”“加给我”等表达，不补入“上帝”或“至高者”。
  alternative: 译成“上帝使我的理智恢复，并重新立我为王”。
  rationale: 上下文虽清楚表明复原来自至高者，本节本身却没有明说施事者；保留含蓄表达可避免把上下文的解释直接写进本节。
- issue: לִיקַר מַלְכוּתִי所表达的关系
  choice: 译为结果性的“使我的国重得荣耀”。
  alternative: 较形式地译为“为了我王国的荣耀”或关系性地译为“我王国的荣耀”。
  rationale: 介词关系可有一定幅度；正文采用自然中文呈现威严复原所带来的国度荣耀，同时不把它神学化为特定因果教义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“我的国”比连续使用“我的王国”更自然，也符合君王第一人称叙述。“来求见我”体现宫廷场景；“格外的威势”保留原文程度加强而不强行指定比较对象。分号用于呈现原文几个彼此相连但层次清楚的复原结果。
