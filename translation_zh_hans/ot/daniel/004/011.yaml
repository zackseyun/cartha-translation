id: DAN.4.11
reference: Daniel 4:11
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: קָרֵ֨א בְ/חַ֜יִל וְ/כֵ֣ן אָמַ֗ר גֹּ֤דּוּ אִֽילָנָ/א֙ וְ/קַצִּ֣צוּ עַנְפ֔וֹ/הִי אַתַּ֥רוּ עָפְיֵ֖/הּ וּ/בַדַּ֣רוּ אִנְבֵּ֑/הּ תְּנֻ֤ד חֵֽיוְתָ/א֙ מִן תַּחְתּ֔וֹ/הִי וְ/צִפְּרַיָּ֖/א מִן עַנְפֽוֹ/הִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/011.yaml
  text: 'He cried aloud and said thus: ‘Chop down the tree[a], and cut off its branches; strip off its foliage, and scatter its fruit. Let the beasts flee from beneath it[b], and the birds from its branches.’'
translation:
  language: zh_hans
  text: 他大声呼喊，说：“砍倒这棵树[a]，砍掉它的枝子；剥去它的叶子，撒散它的果子。让走兽从树下逃开，让飞鸟也离开它的枝子[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“把这棵树伐倒。”
    reason: lexical_alternative
  - marker: b
    text: 亚兰文末句省略了谓语，直译为“飞鸟从它的枝子”；意思是飞鸟也要离开树枝。
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרֵא בְחַיִל
  choice: 大声呼喊
  rationale: 该短语直指用力量、响亮地呼喊；“大声呼喊”自然传达宣告的音量与力度。
- source_word: וְכֵן אָמַר
  choice: 说
  rationale: כֵן用于引出下文所说的内容；中文直接以“说”接引语，已自然表达其话语功能，无须生硬译作“如此说”。
- source_word: גֹּדּוּ אִילָנָא
  choice: 砍倒这棵树
  rationale: 命令式动词指把树砍倒；定指名词在上下文中指异象里的那棵树，故译“这棵树”。
- source_word: וְקַצִּצוּ עַנְפוֹהִי
  choice: 砍掉它的枝子
  rationale: 动词表示砍断、除去，עַנְפוֹהִי指树的枝条；“砍掉……枝子”准确而有力度。
- source_word: אַתַּרוּ עָפְיֵהּ
  choice: 剥去它的叶子
  rationale: 动词表示剥除或除去；עָפְיֵהּ指叶片、叶丛，中文以“叶子”表达最自然。
- source_word: וּבַדַּרוּ אִנְבֵּהּ
  choice: 撒散它的果子
  rationale: בדר表示使之四散，אִנְבֵּהּ指树的果实；“撒散”保留动作的鲜明感。
- source_word: תְּנֻד חֵיוְתָא מִן תַּחְתּוֹהִי
  choice: 让走兽从树下逃开
  rationale: 动词在此表示离开、逃散；审判场景中的“逃开”传达树被毁时动物迅速离去。中文明确“树下”，避免代词指向不清。
- source_word: וְצִפְּרַיָּא מִן עַנְפוֹהִי
  choice: 让飞鸟也离开它的枝子
  rationale: 亚兰文末句省略动词，并与前句平行；中文补出“离开”，同时用“也”体现并列关系。
theological_decisions:
- issue: 宣告中命令式和祈使式的力度
  choice: 将前四项译作直接命令，随后以“让……”表达动物离去
  alternative: 把整段统一译成直接命令，或把末句逐字保留为无谓语结构
  rationale: 原文先连续使用命令式，随后使用带祈使意味的未完成式，末句又省略谓语。当前译法既保留语气转换，也使现代中文通顺。
- issue: 末句省略的谓语
  choice: 补出“离开”，并以“也”标明其承接前句
  alternative: 译作“飞鸟从它的枝子”，不补谓语
  rationale: 原文的省略关系清楚，但中文若完全照搬会成为残缺句；补出中性的“离开”只明示句法所含之意，不增加神学解释。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“砍倒、砍掉、剥去、撒散”保持连续命令的节奏与画面感；“走兽、飞鸟”略具经文语体，但普通读者易懂。所有脚注标记均已置于正文对应位置。
