source:
  edition: WLC
  text: וְ/דִ֣י חֲזָ֣ה מַלְכָּ֡/א עִ֣יר וְ/קַדִּ֣ישׁ נָחִ֣ת מִן שְׁמַיָּ֡/א וְ/אָמַר֩ גֹּ֨דּוּ אִֽילָנָ֜/א וְ/חַבְּל֗וּ/הִי בְּרַ֨ם עִקַּ֤ר שָׁרְשׁ֨וֹ/הִי֙ בְּ/אַרְעָ֣/א שְׁבֻ֔קוּ וּ/בֶ/אֱסוּר֙ דִּֽי פַרְזֶ֣ל וּ/נְחָ֔שׁ בְּ/דִתְאָ֖/א דִּ֣י בָרָ֑/א וּ/בְ/טַ֧ל שְׁמַיָּ֣/א יִצְטַבַּ֗ע וְ/עִם חֵיוַ֤ת בָּרָ/א֙ חֲלָקֵ֔/הּ עַ֛ד דִּֽי שִׁבְעָ֥ה עִדָּנִ֖ין יַחְלְפ֥וּן עֲלֽוֹ/הִי׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/020.yaml
  text: And because the king saw a watcher[a], a holy one, coming down from heaven and saying, ‘Cut down the tree and destroy it, but leave the stump of its roots in the earth, with a band of iron and bronze, in the grass of the field, and let him be drenched with the dew of heaven[c][b], and let his portion be with the beasts of the field until seven times pass over him’—
translation:
  language: zh_hans
  text: 王既看见一位守望者[a]、一位圣者从天上降下来，说：‘把这棵树砍倒，毁坏它；但要把它的根墩留在地里，用铁和铜的箍带箍住，留在田野的草中。让他被天上的露水浸湿，让他的份与田野的走兽同在，直到七期[c]在他身上过去。’——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “守望者”也可译作“警醒者”；亚兰文指一位以警醒、守望为特征的天上存在。
    reason: lexical_alternative
  - marker: c
    text: “七期”可能指七段时期；原文没有说明每一期的确切长度。
    reason: alternative_reading
lexical_decisions:
- source_word: עִיר
  choice: 守望者
  rationale: 该词在《但以理书》的亚兰文中指一位以警醒、守望为特征的天上存在；保留原有称谓，不进一步断定其天使类别。
- source_word: וְקַדִּישׁ
  choice: 就是一位圣者
  rationale: “守望者”和“圣者”是对同一位天上存在的同位描述；“就是”在现代汉语中自然地表明这一关系。
- source_word: נָחִת מִן שְׁמַיָּא
  choice: 从天上降下来
  rationale: 表达王看见这位圣者正在从天而降，措辞自然且保留动作方向。
- source_word: גֹּדּוּ אִילָנָא וְחַבְּלוּהִי
  choice: 把这棵树砍倒，毁坏它
  rationale: 保留两个复数命令的力度：先砍倒，再加以毁坏。
- source_word: עִקַּר שָׁרְשׁוֹהִי
  choice: 它连根的树墩
  rationale: 所指并非抽象的根，而是砍伐后仍连着根、留在土中的树墩。
- source_word: בֶּאֱסוּר דִּי פַרְזֶל וּנְחָשׁ
  choice: 用铁圈和铜圈箍住
  rationale: אֱסוּר可指束缚物或箍带；正文采用符合树墩意象的“圈箍”，脚注保留“锁链捆住”的可能。
- source_word: בְּדִתְאָא דִּי בָרָא
  choice: 在田野的草中
  rationale: 简洁表达开放田野中的草木植被，并保持原文空间图景。
- source_word: יִצְטַבַּע
  choice: 被天露浸湿
  rationale: 该被动动词表示被露水湿透；“浸湿”比单纯“沾湿”更能传达其力度。
- source_word: וְעִם חֵיוַת בָּרָא חֲלָקֵהּ
  choice: 使他与田野的走兽同分
  rationale: 保留חֲלָק的“份、分”概念，也保留原文从树的“它”转为人格化“他”的突变。
- source_word: שִׁבְעָה עִדָּנִין
  choice: 七期
  rationale: עִדָּנִין表示若干时段，但原文没有说明具体时间单位；“七期”保留这种不确定性。
theological_decisions:
- issue: “守望者、圣者”的身份
  choice: 保留原文对天上存在的称谓，不具体译作“天使”
  alternative: 译作“天使”或进一步界定为天上议会成员
  rationale: 原文只用“守望者”和“圣者”描述其身份；不引入更具体的天使分类，以保留经文本身的神学边界。
- issue: 树木意象中代词由非人格转为人格
  choice: 前文称树为“它”，到露水与走兽部分改称“他”
  alternative: 全段统一用“它”或直接点明所象征的人物
  rationale: 原文自身发生这一转变，预示树所代表的人，却尚未在本句中明说；译文保留这种张力。
- issue: “七期”的时长
  choice: 不指定为七年
  alternative: 译作“七年”或“七个季节”
  rationale: 原文只说七个时段，未明确单位；不依据后续解释或传统理解提前限定。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。以“王既然看见”承接本段解释性的句法，并用句末破折号显示话语尚未完结。命令部分保持直接有力；同时保留树的“它”转为“他”、束缚物的词义空间以及“七期”时长未定等原文特征。
