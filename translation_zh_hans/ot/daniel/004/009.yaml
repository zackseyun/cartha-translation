base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/009.yaml
  text: Its foliage was beautiful and its fruit abundant[a], and in it was food for all. Under it the beasts of the field found shade, and in its branches the birds of the heavens dwelt, and from it all flesh was fed.
translation:
  language: zh_hans
  text: 树叶秀美，果实累累，树上有供一切活物享用的食物。田野的走兽在树下乘凉，天空的飞鸟栖息在树枝上；凡有血肉的，都从树得食。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “凡有血肉的”也可译作“一切活物”。亚兰文直译为“所有肉身”，是泛指有生命之物的圣经惯用语。
    reason: 解释原文惯用语及其指涉范围。
lexical_decisions:
- source_word: עָפְיֵהּ
  choice: 树叶
  rationale: 该词指树木的叶丛或枝叶；“树叶”在现代汉语中自然、清楚，也保留具体意象。
- source_word: שַׁפִּיר
  choice: 秀美
  rationale: 意为美丽、悦目；“秀美”适合描写树木，语言庄重而不过时。
- source_word: אִנְבֵּהּ שַׂגִּיא
  choice: 果实累累
  rationale: 原文直指果实众多；这一现代汉语表达自然传达丰盛之意。
- source_word: מָזוֹן לְכֹלָּא בֵהּ
  choice: 树上有供一切活物享用的食物
  rationale: בֵהּ 字面为“在其中/在它里面”，就树而言汉语宜作“树上”；לְכֹלָּא 的范围由后文动物与飞鸟说明，译出“一切活物”避免汉语中“供一切”指代不明。
- source_word: תַּטְלֵל
  choice: 乘凉
  rationale: 该动词与荫蔽、遮护有关；“在树下乘凉”自然表达动物处于树荫之下，不额外强化避难含义。
- source_word: חֵיוַת בָּרָא
  choice: 田野的走兽
  rationale: 保留“田野”这一圣经意象，并以“走兽”与下文“飞鸟”形成自然对应。
- source_word: ידרון
  choice: 栖息
  rationale: 克提卜形式在语境中表示居住、停留；用于飞鸟时“栖息”自然，且不把含义收窄为筑巢。
- source_word: כָּל בִּשְׂרָא
  choice: 凡有血肉的
  rationale: 保留原文“所有肉身/凡有血肉者”的圣经惯用语及其广泛指涉，同时用脚注说明。
- source_word: יִתְּזִין
  choice: 得食
  rationale: 该动词表示得到喂养或滋养；“得食”简洁地表达从树获得食物。
theological_decisions:
- issue: כָּל בִּשְׂרָא 的范围与惯用语色彩
  choice: 凡有血肉的
  alternative: 一切活物／所有生灵
  rationale: 原文是“所有肉身”的惯用表达，在此结合走兽与飞鸟，泛指有生命的受造物。正文保留其圣经语汇张力，脚注给出自然释义，不将其误限于人类。
translation_notes:
  register: 采用现代、庄重而通顺的叙事语言。“秀美”“果实累累”“乘凉”“栖息”便于普通读者理解；末句保留“凡有血肉的”这一具有互文色彩的表达，并以脚注消除歧义。
