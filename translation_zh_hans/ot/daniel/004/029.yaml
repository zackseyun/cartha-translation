  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וּ/מִן אֲנָשָׁ/א֩ לָ֨/ךְ טָֽרְדִ֜ין וְֽ/עִם חֵיוַ֧ת בָּרָ֣/א מְדֹרָ֗/ךְ עִשְׂבָּ֤/א כְ/תוֹרִין֙ לָ֣/ךְ יְטַעֲמ֔וּן וְ/שִׁבְעָ֥ה עִדָּנִ֖ין יַחְלְפ֣וּן עלי/ך עַ֣ד דִּֽי תִנְדַּ֗ע דִּֽי שַׁלִּ֤יט עִלָּיָ/א֙ בְּ/מַלְכ֣וּת אֲנָשָׁ֔/א וּ/לְ/מַן דִּ֥י יִצְבֵּ֖א יִתְּנִנַּֽ/הּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/029.yaml
  text: And you will be driven away from men[a], and your dwelling will be with the beasts of the field. You will be made to eat grass like oxen, and seven times will pass over you[b], until you know that the Most High rules in the kingdom of men and gives it to whomever he wills.
translation:
  language: zh_hans
  text: 你将被赶离人群[a]，与田野的走兽同住。你将被迫像牛一样吃草；七个时期[b]将临到你，直到你知道至高者掌管人的国度，并把这国赐给他所愿意的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “人群”原文泛指人类，与下文的走兽相对。
    reason: lexical_alternative
  - marker: b
    text: 原文直译“七个时间（或时期）”；可能指七年，也可能泛指七段时间。
    reason: alternative_reading
lexical_decisions:
- source_word: טָרְדִין
  choice: 你将被赶离
  rationale: 原文形式直译为“他们将赶走你”，但施事者未明；汉语用被动式自然地保留这一点，并凸显审判临到尼布甲尼撒。
- source_word: אֲנָשָׁא
  choice: 人群／人的
  rationale: 此词泛指人类；前半句译作“人群”以自然表达离开人类社会，后半句译作“人的国度”以保留与至高者统治权的对照。
- source_word: חֵיוַת בָּרָא
  choice: 田野的走兽
  rationale: 保留原文的田野意象及人与兽的鲜明对照，同时符合庄重的现代汉语表达。
- source_word: מְדֹרָךְ
  choice: 同住
  rationale: 原义为“你的住处”；在“与……同住”中转化为自然汉语，意义不失。
- source_word: עִשְׂבָּא כְתוֹרִין
  choice: 像牛一样吃草
  rationale: 准确传达草食与牛的比拟；“牛”比限定为公牛或耕牛更符合该复数名词在此处的类别意义。
- source_word: יְטַעֲמוּן
  choice: 你将被迫……吃
  rationale: 字面形式带有使役和未明示的复数施事者，即“他们要使你吃”；译为“被迫”保留非自愿、受审判的意味。
- source_word: שִׁבְעָה עִדָּנִין
  choice: 七个时期
  rationale: עִדָּנִין 指若干时间单位或时期，原文本身未明确说“年”；“时期”既自然，又不把解释写进正文。
- source_word: יַחְלְפוּן עֲלָךְ
  choice: 将从你身上过去
  rationale: 较贴近原文“经过／越过你”的表达，并显示这段时间亲自临到他。
- source_word: שַׁלִּיט עִלָּיָא
  choice: 至高者掌管
  rationale: 清楚表达至高者具有并施行统治权，保留本节的王权主题。
- source_word: וּלְמַן דִּי יִצְבֵּא יִתְּנִנַּהּ
  choice: 并把国赐给他所愿意的人
  rationale: 代词所指为前述“国度”；补出“国”使汉语清楚。“他所愿意的人”保留至高者自由赐予王权的意思。
theological_decisions:
- issue: 尼布甲尼撒受审判的期限（עִדָּנִין）
  choice: 七个时期
  alternative: 七年；七段时间；七期
  rationale: 上下文可能支持“七年”的传统理解，但本词只明确表示“时期／时间单位”。正文不把期限具体化为年，脚注说明其解释空间。
- issue: 人的国度与至高者的统治
  choice: 至高者掌管人的国度
  alternative: 至高者在人类的王权中掌权；至高者统治人间的国
  rationale: “掌管”兼顾原文谓语的主动统治意义与现代汉语的清晰度，不额外界定神如何行使主权。
- issue: 未明示的复数施事者
  choice: 采用被动表达“被赶离”“被迫”
  alternative: 他们要赶走你；他们要使你吃
  rationale: 原文虽用第三人称复数动词，却没有指出“他们”是谁。被动表达保留这种未确定性，避免擅自指定天使、人或其他施事者。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“田野的走兽”保留经文意象；“七个时期”保留原文对期限单位的开放性。正文中的脚注标记与脚注逐一对应。
