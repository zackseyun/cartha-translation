base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/034.yaml
  text: I, Nebuchadnezzar, praise and exalt and honor the King of heaven, because all his works are truth, and his ways are justice; and those who walk in pride he is able to humble.
translation:
  language: zh_hans
  text: 现在，我，尼布甲尼撒，颂赞、尊崇、尊敬天上的王，因为他的一切作为都真实，他的道路都公正；行事骄傲的人，他能使他们降卑。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְּעַן
  choice: 现在
  rationale: 这是明确的阿拉姆语时间副词，意为“现在／如今”，在本节中标示尼布甲尼撒经历降卑与复原之后的宣告。
- source_word: מְשַׁבַּח וּמְרוֹמֵם וּמְהַדַּר
  choice: 颂赞、尊崇、尊敬
  rationale: 保留原文三个并列分词的层递表达，分别传达赞美、抬高和给予尊荣之意。
- source_word: מֶלֶךְ שְׁמַיָּא
  choice: 天上的王
  rationale: 直译原文属格结构，表达统管诸天的王，语言自然且庄重。
- source_word: קְשֹׁט
  choice: 真实
  rationale: 该词可指真实、真理或可靠；在描述“一切作为”时译为“真实”最贴合搭配，也不把抽象名词过度解释为某种教义概念。
- source_word: דִּין
  choice: 公正
  rationale: 此处描述上帝道路的司法与道德正直；“公正”在现代汉语中准确自然。
- source_word: מַהְלְכִין בְּגֵוָה
  choice: 行事骄傲的人
  rationale: 保留“行走于骄傲中”的习语含义，以现代汉语“行事骄傲”表达持续的生活姿态。
- source_word: יָכִל לְהַשְׁפָּלָה
  choice: 他能使他们降卑
  rationale: 准确传达能力动词与使役不定式；“降卑”保留其被压低、受谦抑的神学张力。
theological_decisions:
- issue: 上帝作为与道路的性质
  choice: “一切作为都真实……道路都公正”
  alternative: “一切作为都是真理……道路都是审判”
  rationale: 选择符合上下文的性质描述，同时保留“真实”和“公正”两项不同断言，避免把原文机械抽象化。
- issue: 上帝使骄傲者降卑的能力
  choice: “他能使他们降卑”
  alternative: “他必使他们降卑”
  rationale: 原文使用表示能力的 יָכִל，强调他有能力如此行，并未直接使用必然将来的形式，因此不强化为“必”。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。保留开头明确的时间副词“现在”和三个并列称颂动词；末句略用回指式结构，以突出“行事骄傲的人”这一对象。
