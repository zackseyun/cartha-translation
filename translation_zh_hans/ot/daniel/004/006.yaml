  text: בֵּלְטְשַׁאצַּר֮ רַ֣ב חַרְטֻמַיָּ/א֒ דִּ֣י אֲנָ֣ה יִדְעֵ֗ת דִּ֠י ר֣וּחַ אֱלָהִ֤ין קַדִּישִׁין֙ בָּ֔/ךְ וְ/כָל רָ֖ז לָא אָנֵ֣ס לָ֑/ךְ חֶזְוֵ֨י חֶלְמִ֧/י דִֽי חֲזֵ֛ית וּ/פִשְׁרֵ֖/הּ אֱמַֽר׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/006.yaml
  text: Belteshazzar[a], chief of the magicians, whom I know has the spirit of the holy gods in you, and no mystery is too difficult for you, tell me the visions of my dream that I saw, and its interpretation.
translation:
  language: zh_hans
  text: 伯提沙撒[a]啊，术士的首领，我知道你里面有圣洁的众神之灵，没有什么奥秘能难倒你。请把我所见梦中的异象和它的解释告诉我。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “圣洁的众神之灵”或译“圣洁上帝的灵”。
    reason: 原文的复数形态倾向于“众神”，但此处传统上也有单数理解。
lexical_decisions:
- source_word: רַב חַרְטֻמַיָּא
  choice: 术士的首领
  rationale: “רַב”表示首领；“חַרְטֻמַיָּא”在《但以理书》的巴比伦宫廷语境中指从事秘术并负责解梦的智慧人阶层。“术士”比“魔术师”更符合古代宫廷背景，也比“秘术祭司”自然易懂。
- source_word: רוּחַ אֱלָהִין קַדִּישִׁין
  choice: 圣洁众神的灵
  rationale: “אֱלָהִין”和修饰它的“קַדִּישִׁין”均为复数形式，且说话者是尼布甲尼撒，因此正文保留其多神语境下最自然的复数含义；争议性的单数理解列入脚注。
- source_word: וְכָל רָז לָא אָנֵס לָךְ
  choice: 没有什么奥秘能难倒你
  rationale: “רָז”在《但以理书》中常指隐藏的事，尤其是梦所包含的奥秘；“לָא אָנֵס לָךְ”表达没有奥秘超出但以理的能力，译文采用自然的现代汉语。
- source_word: חֶזְוֵי חֶלְמִי דִי חֲזֵית
  choice: 我所见梦中的异象
  rationale: 保留“חֶזְוֵי”的复数异象以及“חֶלְמִי”的梦境范围，也保留“我所见”的第一人称经历，避免将其简化为“我的梦”。
- source_word: וּפִשְׁרֵהּ אֱמַר
  choice: 和它的解释告诉我
  rationale: “פִשְׁרֵהּ”是《但以理书》中梦之解释的常用术语；命令式“אֱמַר”依语境译为“告诉我”。
theological_decisions:
- issue: רוּחַ אֱלָהִין קַדִּישִׁין应理解为多神表达还是对独一上帝的单数称呼
  choice: 圣洁众神的灵
  alternative: 圣洁上帝的灵／圣洁上帝的圣灵
  rationale: 原文名词与形容词的复数形态，以及尼布甲尼撒的说话视角，都支持正文采用复数表达。鉴于该短语也可被理解为单数的神圣称谓，脚注保留这一可能，不在正文中消除其神学张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“伯提沙撒啊”明确呼语；“术士”符合古代宫廷中的解梦与秘术背景。“没有什么奥秘能难倒你”以通顺表达传达原文习语，同时保留“异象”和“解释”等《但以理书》的关键术语。
