- from: 于是，这些人说：“我们绝不会找到任何控告这个但以理的把柄[a]，除非从他上帝的律法上找。”
  to: 于是，这些人说：“我们不会找到任何控告这个但以理的根据，除非我们能在他所信奉的上帝的律法中找到控告他的根据。”
  rationale: 修订以“不会找到”对应原文对未来搜查结果的判断，保留“这些人”“这个但以理”和两次“找到”的呼应。后半句明确补足汉语所需的“控告他的根据”，并将律法作为可寻得该根据的领域。“他所信奉的上帝”只是将原文“他的上帝”在现代汉语中自然地展开，不增加神学断言。
