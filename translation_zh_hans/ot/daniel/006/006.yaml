  text: אֱ֠דַיִן גֻּבְרַיָּ֤/א אִלֵּךְ֙ אָֽמְרִ֔ין דִּ֣י לָ֧א נְהַשְׁכַּ֛ח לְ/דָנִיֵּ֥אל דְּנָ֖ה כָּל עִלָּ֑א לָהֵ֕ן הַשְׁכַּ֥חְנָֽה עֲל֖וֹ/הִי בְּ/דָ֥ת אֱלָהֵֽ/הּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/006.yaml
  text: Then these men said[a], ‘We will not find any charge against this Daniel unless we find it against him in the law of his God.’
translation:
  language: zh_hans
  text: 于是，这些人说：“我们不会找到任何控告这个但以理的根据，除非我们能在他所信奉的上帝的律法中找到控告他的根据。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֱדַיִן
  choice: 于是
  rationale: 表示叙事的时间推进和顺承关系；“于是”符合现代汉语叙事习惯。
- source_word: גֻּבְרַיָּא אִלֵּךְ
  choice: 这些人
  rationale: 按原文直译为“这些人”；本节没有使用官职名称，因此不从上下文补入“官员”。
- source_word: אָמְרִין
  choice: 说
  rationale: 在叙事引语中用现代汉语的一般过去叙述方式，无须另行表现进行体。
- source_word: דִּי לָא נְהַשְׁכַּח
  choice: 我们绝不会找到
  rationale: 未完成式在此表达他们对搜寻结果的预期；“绝不会”也传达其断定的语气。
- source_word: לְדָנִיֵּאל דְּנָה
  choice: 控告这个但以理
  rationale: 介词在司法语境中表示针对但以理；保留指示词“这个”，呈现原文可能带有的指点或轻蔑语气。
- source_word: כָּל עִלָּא
  choice: 任何……把柄
  rationale: 该词在此指可据以控告人的理由或根据；“把柄”自然简洁，并适合这些人图谋构陷但以理的语境。
- source_word: לָהֵן
  choice: 除非
  rationale: 引出前述断言的唯一例外，清楚保留原文逻辑。
- source_word: הַשְׁכַּחְנָה
  choice: 找
  rationale: 与前句“找到”保留同一词根的重复；汉语中省略已知宾语更为自然。
- source_word: עֲלוֹהִי
  choice: （隐含为）针对他
  rationale: 其所指由“控告这个但以理的把柄”承接；不在后半句机械重复，以免汉语累赘。
- source_word: בְּדָת אֱלָהֵהּ
  choice: 从他上帝的律法上
  rationale: “从……上找”自然表达以该律法为控告根据；“他上帝的律法”保留原文所属关系。
theological_decisions:
- issue: אֱלָהֵהּ 的指称表达
  choice: 他上帝
  alternative: 他的神
  rationale: 原文指但以理所敬奉的上帝。“他上帝”在现代汉语中清楚表达该特定指称，同时不额外加入原文没有明说的教义判断。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。保留“这个但以理”的指示语气和前后两次“找”的呼应；句式简洁，适合普通读者阅读。
