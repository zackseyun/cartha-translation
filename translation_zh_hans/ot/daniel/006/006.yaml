review_pass:
  verdict: revise
  source_fidelity: 草稿基本传达了叙事推进、指示语“这个但以理”、法律语境中的控告根据，以及唯一例外的逻辑。不过“绝不会”比原文未完成式所表达的“不会找到／找不到”的预期更强；后半句“从他上帝的律法上找”不合现代汉语搭配，且没有清楚表达“在其律法中找到针对他的控告根据”。
  naturalness: “他上帝”“从……律法上找”均不够自然。“他的上帝的律法”虽可理解但连用两个“的”较滞涩；用“他所信奉的上帝的律法”可在不改变指称的前提下使所属关系清楚。
  terminology: 将 עִלָּא 译为“控告的根据”较准确地保留其司法性，避免“把柄”所带较强口语和负面构陷色彩。保留“上帝”以对应本书叙事中但以理所事奉的特定神。
  issues:
  - severity: medium
    issue: “绝不会”强化了原文语气。
    rationale: 原文的未完成式在这里表达他们预期搜查的结果；“不会找到”足以保留该判断，不必加上“绝”所造成的额外绝对性。
  - severity: high
    issue: “除非从他上帝的律法上找”不自然且语义表达不完整。
    rationale: 汉语通常说“在……律法中找到……根据”，这样才能清楚表达原文“在他神的律法中找到针对他的［控告根据］”。
  - severity: medium
    issue: “把柄”偏口语，并可能过度引入图谋不轨的色彩。
    rationale: עִלָּא 在此首先是法律上的理由、事由或控告根据；“控告的根据”更为中性而准确。
  revised_text: 于是，这些人说：“我们不会找到任何控告这个但以理的根据，除非我们能在他所信奉的上帝的律法中找到控告他的根据。”
  revised_footnotes:
  - marker: a
    text: “控告的根据”或译“控告的理由”“把柄”。
    reason: 保留 עִלָּא 在司法语境中可指控告的理由、根据或可资利用的事由这一词义范围。
  revision_rationale: 修订以“不会找到”对应原文对未来搜查结果的判断，保留“这些人”“这个但以理”和两次“找到”的呼应。后半句明确补足汉语所需的“控告他的根据”，并将律法作为可寻得该根据的领域。“他所信奉的上帝”只是将原文“他的上帝”在现代汉语中自然地展开，不增加神学断言。
