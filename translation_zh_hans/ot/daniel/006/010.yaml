  text: כָּ/ל קֳבֵ֖ל דְּנָ֑ה מַלְכָּ/א֙ דָּֽרְיָ֔וֶשׁ רְשַׁ֥ם כְּתָבָ֖/א וֶ/אֱסָרָֽ/א־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/010.yaml
  text: Because of this[a], King Darius signed the document and the injunction.
translation:
  language: zh_hans
  text: 因此[a]，大流士王签署了文书和禁令。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“于是，大流士王写下了文书和禁令。”阿拉米语可作较形式对应的翻译；正文采用“签署”，更能表达这里使禁令正式生效的法律语境。
    reason: 词义替代译法
lexical_decisions:
- source_word: כָּל־קֳבֵל דְּנָה
  choice: 因此
  rationale: 这是表示因果或结果的阿拉米语惯用语；“因此”自然承接上文，并保留由前事引出后果的语气。
- source_word: מַלְכָּא דָּרְיָוֶשׁ
  choice: 大流士王
  rationale: 按现代汉语习惯排列称号与人名，同时保留原文的王室称号。
- source_word: רְשַׁם
  choice: 签署了
  rationale: 该动词基本义涉及书写、记录；在君王使法律文书生效的行政语境中，“签署了”能自然表达正式确认并颁行的法律效力，同时在脚注中保留较形式对应的译法。
- source_word: כְּתָבָא
  choice: 文书
  rationale: 该词指书面文字或文件；“文书”符合正式法律语境，又不把它过度具体化为另一道独立的法令。
- source_word: וֶאֱסָרָא
  choice: 和禁令
  rationale: 该词指具有约束力的禁止性规定；“禁令”在现代汉语中清楚、正式，并保留其禁止性质。
theological_decisions: []
