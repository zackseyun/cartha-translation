source:
  edition: WLC
  text: אִתְיָעַ֜טוּ כֹּ֣ל סָרְכֵ֣י מַלְכוּתָ֗/א סִגְנַיָּ֤/א וַֽ/אֲחַשְׁדַּרְפְּנַיָּ/א֙ הַדָּֽבְרַיָּ֣/א וּ/פַחֲוָתָ֔/א לְ/קַיָּמָ֤ה קְיָם֙ מַלְכָּ֔/א וּ/לְ/תַקָּפָ֖ה אֱסָ֑ר דִּ֣י כָל דִּֽי יִבְעֵ֣ה בָ֠עוּ מִן כָּל אֱלָ֨הּ וֶֽ/אֱנָ֜שׁ עַד יוֹמִ֣ין תְּלָתִ֗ין לָהֵן֙ מִנָּ֣/ךְ מַלְכָּ֔/א יִתְרְמֵ֕א לְ/גֹ֖ב אַרְיָוָתָֽ/א׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/008.yaml
  text: 'All the high officials of the kingdom[a], the prefects and satraps, the counselors and governors, have agreed together to establish a royal statute and to enforce an injunction: that whoever makes a petition to any god or man for thirty days, except to you, O king[c][b], shall be thrown into the lions’ den.'
translation:
  language: zh_hans
  text: 王国所有高级官员——长官、总督、谋士和省长——都共同商议，决定制定王室法令，并使禁令具有约束力：任何人在三十天内，若向你这位王以外的任何神或人求什么，就必被扔进狮子坑。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִתְיָעַטוּ
  choice: 共同商议，决定
  rationale: 该反身复数形态兼有彼此商议与达成共同决定之意；此译保留两层含义，也自然呈现官员们的联合行动。
- source_word: סָרְכֵי מַלְכוּתָא
  choice: 王国的所有总长
  rationale: 此词指王国中的高级行政官员；结合本章语境译作“总长”，既体现其高位，也与随后列举的其他官职区分。
- source_word: סִגְנַיָּא
  choice: 长官
  rationale: 指一种行政官衔；中文缺少完全对应的固定称谓，译作“长官”清楚而不过度限定其具体级别。
- source_word: אֲחַשְׁדַּרְפְּנַיָּא
  choice: 总督
  rationale: 波斯帝国省区统治者的历史官衔；“总督”是现代中文较易理解且能体现其行政地位的对应词。
- source_word: הַדָּבְרַיָּא
  choice: 谋士
  rationale: 指参与王室决策、提供意见的人；“谋士”保留其咨议职能，并与一般官员有别。
- source_word: פַחֲוָתָא
  choice: 省长
  rationale: 指地方行政长官；译作“省长”简明地表达其治理辖区的职务。
- source_word: לְקַיָּמָה קְיָם מַלְכָּא
  choice: 设立一条王命
  rationale: 同根动词与名词的搭配强调使一项王室法令成立；“设立一条王命”兼顾法律效力与王权来源。
- source_word: וּלְתַקָּפָה אֱסָר
  choice: 使禁令生效
  rationale: 该短语表示使禁令坚固、具有约束力；中文“使……生效”准确传达其法律执行力。
- source_word: יִבְעֵה בָעוּ
  choice: 祈求
  rationale: 同根动词与名词构成强调式表达，意为提出请求或祈求；因对象包括神明和人，“祈求”可涵盖宗教及向权势者求告的语境，又不局限为一般祷告。
- source_word: מִן כָּל אֱלָהּ וֶאֱנָשׁ
  choice: 向任何神明或人
  rationale: 介词字面为“从”，表达向某对象求取；现代中文与“祈求”搭配时自然说“向……祈求”，因此按语义关系译出。
- source_word: עַד יוֹמִין תְּלָתִין
  choice: 三十天内
  rationale: 此处限定禁令适用的三十日期间；“三十天内”自然准确。
- source_word: לָהֵן מִנָּךְ
  choice: 除你以外
  rationale: 表示唯一例外，即请求对象只能是王；该译简洁并保留排他性。
- source_word: גֹב אַרְיָוָתָא
  choice: 狮子坑
  rationale: 指关押狮子的坑穴；“狮子坑”是清晰、自然且符合叙事场景的中文表达。
theological_decisions:
- issue: 禁令所禁止行为的范围
  choice: 译作“向任何神明或人祈求”
  alternative: 译作“向任何神明或人祷告”
  rationale: 原文所用词可指请求、求告，并不只限于宗教祷告；译作“祈求”保留禁令同时涉及神明与人的广泛范围，避免缩窄其含义。
translation_notes:
  register: 采用现代、庄重而清楚的叙事语言。官衔尽量保持彼此区分，但不使用普通读者难懂的音译或过度古雅称谓；法律措辞用“设立”“生效”“禁令”呈现正式语域。
