  to: 但以理知道那份文书已经签署[a]，就回到家里。他楼上的房间有窗户向着耶路撒冷敞开[b]；他仍一日三次双膝跪地[c]，在他的上帝面前祷告、献上感谢，像从前一向所做的那样。
  rationale: 修订仅处理窗户状态与朝向的表达，并更正脚注c不自然且误导性的所谓“直译”。其余内容保留原译对正式文书、每日三次祷告、感谢上帝和既有惯常做法的准确表达；不将但以理的行动解释为明确的政治抗议。
