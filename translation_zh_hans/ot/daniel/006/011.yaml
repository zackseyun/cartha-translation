source:
  edition: WLC
  text: וְ֠/דָנִיֵּאל כְּ/דִ֨י יְדַ֜ע דִּֽי רְשִׁ֤ים כְּתָבָ/א֙ עַ֣ל לְ/בַיְתֵ֔/הּ וְ/כַוִּ֨ין פְּתִיחָ֥ן לֵ/הּ֙ בְּ/עִלִּיתֵ֔/הּ נֶ֖גֶד יְרוּשְׁלֶ֑ם וְ/זִמְנִין֩ תְּלָתָ֨ה בְ/יוֹמָ֜/א ה֣וּא בָּרֵ֣ךְ עַל בִּרְכ֗וֹ/הִי וּ/מְצַלֵּ֤א וּ/מוֹדֵא֙ קֳדָ֣ם אֱלָהֵ֔/הּ כָּ/ל קֳבֵל֙ דִּֽי הֲוָ֣א עָבֵ֔ד מִן קַדְמַ֖ת דְּנָֽה־׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/011.yaml
  text: And when Daniel knew that the document had been signed[a], he went to his house. Now the windows in his upper room were open toward Jerusalem, and three times a day he knelt on his knees and prayed and gave thanks before his God[c][b], just as he had been doing before this.
translation:
  language: zh_hans
  text: 但以理知道那份文书已经签署[a]，就回到家里。他楼上的房间有窗户向着耶路撒冷敞开[b]；他仍一日三次双膝跪地[c]，在他的上帝面前祷告、献上感谢，像从前一向所做的那样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“那份文书已经写定。”亚兰文指正式的书面命令已经签署。
    reason: lexical_alternative
  - marker: b
    text: 或译：“朝着耶路撒冷。”
    reason: lexical_alternative
  - marker: c
    text: 原文的表达描写但以理祷告时屈膝跪下的姿势。
    reason: cultural_note
lexical_decisions:
- source_word: כְּדִי יְדַע
  choice: 知道……以后
  rationale: כְּדִי在此引出时间背景，יְדַע表示但以理已知悉文书的法律状态；汉语用“知道……就……”自然呈现叙事次序，而不额外强调“立刻”。
- source_word: רְשִׁים כְּתָבָא
  choice: 那份文书已经签署
  rationale: 该短语指正式书面命令已获签署并生效；“文书”保留原文的书面文件意象，“签署”符合本段的法律行政语境。
- source_word: עַל לְבַיְתֵהּ
  choice: 就回到家里
  rationale: 该表达在语境中表示但以理前往自己的住所；“回到家里”符合现代汉语叙事习惯。
- source_word: כַוִּין פְּתִיחָן לֵהּ בְּעִלִּיתֵהּ
  choice: 他楼上的房间有窗户开着
  rationale: 原文描述楼上房间的窗户处于敞开状态，并未说明是此时才打开；译文避免加入临时开窗的含义。
- source_word: נֶגֶד יְרוּשְׁלֶם
  choice: 开向耶路撒冷
  rationale: 表示窗户及祷告方向朝向耶路撒冷；“开向”简明地结合窗户的朝向与原文方位表达。
- source_word: זִמְנִין תְּלָתָה בְיוֹמָא
  choice: 一日三次
  rationale: 准确传达固定的每日频率，并保持庄重而自然的经文语体。
- source_word: בָּרֵךְ עַל בִּרְכוֹהִי
  choice: 双膝跪地
  rationale: 该习语在“膝盖”这一搭配中描写跪下的祷告姿势，不按动词的其他可能义项译作“祝福”。
- source_word: מְצַלֵּא וּמוֹדֵא
  choice: 祷告、感谢
  rationale: מְצַלֵּא意为祷告；מוֹדֵא在此敬拜语境中最自然地表示向上帝感恩，同时不扩展为较强的认罪或赞美解释。
- source_word: כָּל קֳבֵל דִּי הֲוָא עָבֵד מִן קַדְמַת דְּנָה
  choice: 像从前一向所做的那样
  rationale: 强调这不是临时的抗议举动，而是但以理此前持续保持的惯常做法；“一向”体现原文的持续性。
theological_decisions:
- issue: 但以理在王令之下祷告的性质
  choice: 按叙事本身描写他继续原有的跪地、祷告和感谢习惯
  alternative: 将此举直接表述为公开反抗或蔑视王令
  rationale: 本节突出但以理“像从前”一样行，并未明说其行动是政治抗议；译文保留其忠诚信仰与王令之间的张力，不额外赋予动机。
- issue: מוֹדֵא在祷告中的含义
  choice: 感谢
  alternative: 认罪；赞美
  rationale: 该词可以涵盖承认、称谢等意义；在本节与祷告并列且以“在他的上帝面前”为背景，“感谢”最合语境，但脚注并非必需，以免给普通读者造成不必要负担。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“文书”“一日三次”略带经文庄重感，但仍属现代常用表达；用“上帝”对应 אֱלָהֵהּ。句法按汉语重组，同时保留窗户朝向耶路撒冷、跪地祷告及既有习惯等叙事重点。
