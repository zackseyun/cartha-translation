base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/015.yaml
  text: Then the king[a], when he heard the statement, was greatly distressed, and he set his mind on delivering Daniel; and until the going down of the sun he kept striving to rescue him.
translation:
  language: zh_hans
  text: 王听见这话，就非常苦恼[a]，一心要救但以理；直到日落，他一直设法搭救他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“非常生自己的气。”亚兰文这一习语直译为“对自己非常苦恼（或不悦）”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱדַיִן
  choice: 就
  rationale: 作为亚兰文叙事推进词，承接前文并引出紧接发生的事；现代汉语用“就”自然流畅。
- source_word: מַלְכָּא
  choice: 王
  rationale: 强调状态表明所指明确；上下文已清楚是哪一位王，汉语用“王”即可自然表达。
- source_word: כְּדִי מִלְּתָא שְׁמַע
  choice: 听见这话
  rationale: כְּדִי在此引出时间情境，מִלְּתָא可指话、事情或陈述；“听见这话”在汉语中自然，并指向官员刚才所说的内容。
- source_word: שַׂגִּיא בְּאֵשׁ עֲלוֹהִי
  choice: 非常懊恼
  rationale: 该习语表达强烈的内心苦恼或不悦，并可能含有对自己不满的反身意味；正文以“非常懊恼”保留情绪强度，脚注说明另一种理解。
- source_word: וְעַל דָּנִיֵּאל שָׂם בָּל
  choice: 一心要救但以理
  rationale: שָׂם בָּל字面为“把心放在”，表示专心定意；结合介词短语和后接目的式，译作“一心要救但以理”简洁自然。
- source_word: לְשֵׁיזָבוּתֵהּ
  choice: 要救但以理
  rationale: 表示使其脱离危险；明确代词所指为但以理，避免连续代词在汉语中的歧义。
- source_word: וְעַד מֶעָלֵי שִׁמְשָׁא
  choice: 直到日落
  rationale: 亚兰文习语指太阳落下；“直到日落”准确、简洁，并保留时间界限。
- source_word: הֲוָא מִשְׁתַּדַּר
  choice: 一直设法
  rationale: 迂回式动词结构表达持续努力；“一直设法”体现行动持续到日落。
- source_word: לְהַצָּלוּתֵהּ
  choice: 搭救他
  rationale: 表示从危险或刑罚中救出；“搭救”与前面的“救”形成自然变化，同时保持相同的拯救语义场。
