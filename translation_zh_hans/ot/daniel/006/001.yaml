base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/001.yaml
  text: And Darius the Mede received the kingdom[a], being about sixty-two years old.
translation:
  language: zh_hans
  text: 玛代人大利乌得了国权[a]，年约六十二岁。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“取得了国权”。亚兰语动词的含义较宽；正文译作“得了”，表达他获得国权，却不暗示他以某种特定方式取得统治权。
    reason: 词义备选
lexical_decisions:
- source_word: וְ/דָרְיָוֶשׁ
  choice: 大利乌
  rationale: 句首连接词 וְ 在此承接上文；中文叙事无需机械译作“并且”。专名按通行圣经译名译为“大利乌”。
- source_word: מָדָיָא
  choice: 玛代人
  rationale: 该族称指出大利乌的族属；“玛代人”符合现代中文圣经语境，也比“玛代的”自然。
- source_word: קַבֵּל
  choice: 承受
  rationale: 亚兰语动词的基本义是“领受、接受”。“承受”既贴近原文，又不暗示他以征服、继承或受任等某一特定方式取得统治权。
- source_word: מַלְכוּתָא
  choice: 国权
  rationale: 此处所指主要是王国的统治权或王权。“国权”比单纯的“国”更能表达 מַלְכוּתָא 在本语境中的统治含义，同时保持简洁。
- source_word: כְּ/בַר שְׁנִין
  choice: 那时他约……岁
  rationale: 这是表达年龄的亚兰语习语，字面涉及“……岁的儿子”；译为现代汉语自然的年龄表达，并保留 כְּ 所表示的约数。
- source_word: שִׁתִּין וְ/תַרְתֵּין
  choice: 六十二
  rationale: 按现代汉语通常的基数词形式翻译。
theological_decisions:
- issue: 大利乌取得国权的方式
  choice: 承受了国权
  alternative: 取得了国权；接管了国权；得了国
  rationale: “承受”贴近 קַבֵּל 的领受义，不把经文有限的陈述扩展为征服、继承或受任等具体历史机制，保留其解释空间。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。句首 וְ 通过上下文衔接体现，不生硬译出；以“那时他约六十二岁”自然表达年龄，同时保留原文的约数。
