  text: וַ/אֲמַ֣ר מַלְכָּ֗/א וְ/הַיְתִ֞יו גֻּבְרַיָּ֤/א אִלֵּךְ֙ דִּֽי אֲכַ֤לוּ קַרְצ֨וֹ/הִי֙ דִּ֣י דָֽנִיֵּ֔אל וּ/לְ/גֹ֤ב אַרְיָוָתָ/א֙ רְמ֔וֹ אִנּ֖וּן בְּנֵי/ה֣וֹן וּ/נְשֵׁי/ה֑וֹן וְ/לָֽא מְט֞וֹ לְ/אַרְעִ֣ית גֻּבָּ֗/א עַ֠ד דִּֽי שְׁלִ֤טֽוּ בְ/הוֹן֙ אַרְיָ֣וָתָ֔/א וְ/כָל גַּרְמֵי/ה֖וֹן הַדִּֽקוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/025.yaml
  text: Then the king commanded[a], and those men who had maliciously accused Daniel were brought and thrown into the lions’ den—they, their sons, and their wives. And before they reached the bottom of the den, the lions overpowered them and crushed all their bones.
translation:
  language: zh_hans
  text: 于是，王下令，把那些恶意控告[a]但以理的人带来，将他们、他们的儿子和妻子都扔进狮子坑。他们还没有落到坑底，狮子就制伏了他们，把他们所有的骨头都压碎了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “恶意控告”所译的亚兰语习语，字面意思是“吃他的碎块”，可表示诬告、谗毁或恶意告发。
    reason: 说明原文特殊习语及其可能的语义范围。
lexical_decisions:
- source_word: וַאֲמַר מַלְכָּא
  choice: 于是，王下令
  rationale: וַאֲמַר 字面为“说”，但在君王发话并随即执行刑罚的叙事语境中具有下令的功能；“于是”体现连续推进的叙事关系。
- source_word: וְהַיְתִיו
  choice: 带来
  rationale: 使役形式表示使这些人前来，即由人把他们带到执行刑罚之处；现代汉语用“带来”自然清楚。
- source_word: גֻּבְרַיָּא אִלֵּךְ
  choice: 那些……的人
  rationale: 名词与指示词指向前文所说的特定群体，即控告但以理的人。
- source_word: אֲכַלוּ קַרְצֹוהִי דִּי דָנִיֵּאל
  choice: 恶意控告但以理
  rationale: 该亚兰语习语字面意为“吃他的碎块”，实际表示诬告、谗毁或告发；“恶意控告”兼顾司法语境和敌意。
- source_word: וּלְגֹב אַרְיָוָתָא רְמוֹ
  choice: 扔进狮子坑
  rationale: גּוֹב 可指坑穴；本章语境中“狮子坑”是自然且沿用一致的表达。“扔进”保留暴力执行刑罚的动作。
- source_word: אִנּוּן בְּנֵיהוֹן וּנְשֵׁיהוֹן
  choice: 他们连同他们的儿子和妻子
  rationale: 原文明确列出这些人、他们的儿子和妻子；“儿子”比泛化为“孩子”更准确。
- source_word: וְלָא מְטוֹ לְאַרְעִית גֻּבָּא
  choice: 他们还没有落到坑底
  rationale: 原意为“他们尚未到达坑的底部”；结合被扔下的动作，“落到坑底”符合汉语叙事，同时保留时间关系。
- source_word: שְׁלִטוּ בְהוֹן אַרְיָוָתָא
  choice: 狮子就扑上去制伏了他们
  rationale: שׁלט 表示掌控、胜过或制伏；“制伏”保留支配之义，“扑上去”使狮子在受害者落地前发动攻击的场景在汉语中连贯明确。
- source_word: וְכָל גַּרְמֵיהוֹן הַדִּקוּ
  choice: 把他们全身的骨头都咬碎了
  rationale: 原文直陈“把他们所有的骨头压碎/击碎”；狮子语境中“咬碎”自然地表达施事方式，“全身的骨头都”保留整体性。
theological_decisions:
- issue: 控告者家属一同受刑
  choice: 如实保留“他们的儿子和妻子”，不淡化刑罚的严酷性，也不附加道德评判。
  alternative: 泛译为“家人”或“孩子”，或因伦理不适而省略家属。
  rationale: 经文明说王的命令波及这些人的儿子和妻子。译文应保存叙事本身造成的伦理张力，而不替文本辩护或谴责。
translation_notes:
  register: 采用庄重而直接的现代标准汉语。句式保持叙事推进和暴烈场景的清晰度；保留“儿子和妻子”的具体措辞。脚注标记置于全节末尾，所注词语在正文中明确可辨。
