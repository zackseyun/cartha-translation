  text: וּ/כְ/מִקְרְבֵ֣/הּ לְ/גֻבָּ֔/א לְ/דָ֣נִיֵּ֔אל בְּ/קָ֥ל עֲצִ֖יב זְעִ֑ק עָנֵ֨ה מַלְכָּ֜/א וְ/אָמַ֣ר לְ/דָנִיֵּ֗אל דָּֽנִיֵּאל֙ עֲבֵד֙ אֱלָהָ֣/א חַיָּ֔/א אֱלָהָ֗/ךְ דִּ֣י אנתה פָּֽלַֽח לֵ/הּ֙ בִּ/תְדִירָ֔/א הַ/יְכִ֥ל לְ/שֵׁיזָבוּתָ֖/ךְ מִן אַרְיָוָתָֽ/א־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/021.yaml
  text: And when he came near the den[a], he cried out to Daniel with a distressed voice. The king spoke and said to Daniel, “Daniel, servant of the living God, has your God, whom you continually serve[c][b], been able to deliver you from the lions?”
translation:
  language: zh_hans
  text: 他走近狮子坑时，用悲痛的声音向但以理呼喊。王对但以理说：“但以理，永活的上帝的仆人[a]，你所一直事奉[b]的上帝，能救你脱离狮子吗？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “仆人”也可译作“奴仆”；这里侧重忠诚事奉的尊称。
    reason: lexical_alternative
  - marker: b
    text: “事奉”也可译作“敬拜”；亚兰语原词可指宗教性的服事或敬拜。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְמִקְרְבֵהּ לְגֻבָּא
  choice: 他临近狮子坑时
  rationale: 以时间从句表达介词复合结构的时间意义；“狮子坑”既保留 גֻבָּא 的坑穴意象，也符合本段叙事语境。
- source_word: בְּקָל עֲצִיב
  choice: 用悲痛的声音
  rationale: עֲצִיב 表示悲伤、痛苦或忧愁；“悲痛”自然传达王当时的沉重情绪，又不过度具体化。
- source_word: זְעִק
  choice: 呼喊
  rationale: 该动词指大声急切地喊叫；“呼喊”在现代汉语中兼具音量与迫切感。
- source_word: עָנֵה מַלְכָּא וְאָמַר
  choice: 王开口……说
  rationale: 这是闪语常见的引语公式；此处并非明显回应先前话语，译作“开口……说”自然，也保留正式叙事语气。
- source_word: עֲבֵד אֱלָהָא חַיָּא
  choice: 永活上帝的仆人
  rationale: עֲבֵד 可指仆人或奴仆，此处是对但以理忠诚事奉上帝的称谓；“永活上帝”自然表达“活着的上帝”这一神圣称号。
- source_word: דִּי אנתה פָּלַח לֵהּ בִּתְדִירָא
  choice: 你所常常事奉的
  rationale: פְּלַח 在圣经亚兰语中可表示宗教性的服事或敬拜；“事奉”保留较广的语义，并与“仆人”呼应。בִּתְדִירָא 表示持续、恒常。
- source_word: הַיְכִל לְשֵׁיזָבוּתָךְ
  choice: 能救你
  rationale: הַיְכִל 是完成式，问题聚焦于截至此刻上帝是否已经显明其拯救能力；汉语“能救你”简洁自然，语境已使结果时态清楚。
- source_word: מִן אַרְיָוָתָא
  choice: 脱离狮子
  rationale: 直译介词短语，指从狮子的威胁或伤害中获救，不另行补入“口”或“权势”。
theological_decisions:
- issue: עֲבֵד אֱלָהָא 所表达的但以理与上帝的关系
  choice: 永活上帝的仆人
  alternative: 永活上帝的奴仆
  rationale: 本处为宫廷叙事中的尊称，重点是忠诚归属与服事，而非社会法律意义上的奴隶身份；“仆人”更符合语境，同时脚注保留另一可能。
- issue: פָּלַח 的宗教含义
  choice: 事奉
  alternative: 敬拜
  rationale: 该词可涵盖敬拜，但本句强调但以理持续忠诚地服事上帝，不限于礼仪行为；“事奉”保留较宽语义。
- issue: הַיְכִל 问句的语用力度
  choice: 能救你脱离狮子吗
  alternative: 果真救了你脱离狮子吗
  rationale: 源文直接询问上帝是否有能力施行拯救，同时在当下语境中也询问拯救是否已经发生；采用不额外强化怀疑或确信的中性问法，保留张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“上帝”与“事奉”保持宗教语域；用“王开口……说”自然呈现亚兰语引语公式。脚注标记均置于所说明内容附近：仆人[a]、全句末的事奉说明[b]。
