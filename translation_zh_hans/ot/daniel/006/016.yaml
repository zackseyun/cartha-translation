base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/016.yaml
  text: Then these men came by agreement to the king and said to the king[a], "Know, O king[b], that it is a law of the Medes and Persians that any injunction or statute that the king establishes cannot be changed."
translation:
  language: zh_hans
  text: 于是，这些人一同来向王施压，对王说[a]：“王啊，你要知道，玛代人和波斯人有一条法律：凡王所立的禁令或律例[b]，一概不可更改。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “一同来向王施压”也可译作“一同来到王面前”或“联合起来逼迫王”。原文动词可含有众人协调一致、坚持施压的意味，并非只表示走近。
    reason: lexical_alternative
  - marker: b
    text: “禁令”也可译作“禁制”，“律例”也可译作“法令”。这对词涵盖具有约束力的王室禁制和正式规定。
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: 于是
  rationale: 作为亚兰文叙事衔接语，表示事件随即推进；“于是”自然、庄重，并保留先后关系。
- source_word: גֻּבְרַיָּא אִלֵּךְ
  choice: 这些人
  rationale: 指上文已经出现并采取敌对行动的那群官员；直译清楚，不额外加入其职位。
- source_word: הַרְגִּשׁוּ עַל
  choice: 一同来到……面前
  rationale: 该亚兰文表达含有集体、协调而带催逼意味的行动；正文以自然汉语表达共同进见，脚注保留“联合起来逼迫”的可能语气。
- source_word: דַּע מַלְכָּא
  choice: 王啊，你要知道
  rationale: 保留命令式和呼格的宫廷语气，同时符合现代汉语表达。
- source_word: דִּי דָת לְמָדַי וּפָרַס
  choice: 玛代人和波斯人有一条法律
  rationale: 表达他们所诉诸的是玛代—波斯法律体系中一项既定规则，语义清楚而不过度解释。
- source_word: כָל אֱסָר וּקְיָם
  choice: 凡……禁令或律例
  rationale: אֱסָר指有约束力的禁制，קְיָם指确立的法令或规章；“禁令或律例”保留两项法律术语的区别及涵盖面。
- source_word: דִּי מַלְכָּא יְהָקֵים
  choice: 王所立的
  rationale: “立”简洁表达制定并使之生效，也可同时搭配“禁令”和“律例”。
- source_word: לָא לְהַשְׁנָיָה
  choice: 一概不可更改
  rationale: 准确表达所立法令不得变更的固定性；“一概”与前面的“凡”呼应，呈现全称范围。
