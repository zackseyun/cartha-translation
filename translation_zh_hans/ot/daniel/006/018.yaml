  text: וְ/הֵיתָ֨יִת֙ אֶ֣בֶן חֲדָ֔ה וְ/שֻׂמַ֖ת עַל פֻּ֣ם גֻּבָּ֑/א וְ/חַתְמַ֨/הּ מַלְכָּ֜/א בְּ/עִזְקְתֵ֗/הּ וּ/בְ/עִזְקָת֙ רַבְרְבָנ֔וֹ/הִי דִּ֛י לָא תִשְׁנֵ֥א צְב֖וּ בְּ/דָנִיֵּֽאל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/018.yaml
  text: Then a stone was brought and placed over the mouth of the pit[a], and the king sealed it with his signet ring and with the signet rings of his nobles, so that nothing concerning Daniel might be changed.
translation:
  language: zh_hans
  text: 于是，一块石头被搬来，放在坑口；王用自己的印戒和众显贵的印戒在石头上盖了印，免得有关但以理的事有所更改。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “事”也可译作“意图”“意愿”或“决定”。亚兰文 צְבוּ 含义较宽，可指有关但以理的事情、意图或决定。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵיתָיִת אֶבֶן חֲדָה
  choice: 于是，有人搬来一块石头
  rationale: 用“于是”承接叙事次序；原文为被动式“被带来”，汉语以不定主语“有人搬来”更自然。“一块石头”体现 חֲדָה“一”的含义，而不刻意强调“仅仅一块”。
- source_word: וְשֻׂמַת עַל פֻּם גֻּבָּא
  choice: 放在坑口
  rationale: פֻּם 字面为“口”，与 גֻּבָּא“坑”组合时，现代汉语自然表达为“坑口”；上下文表明这是狮子坑。
- source_word: וְחַתְמַהּ מַלְכָּא בְּעִזְקְתֵהּ וּבְעִזְקָת רַבְרְבָנוֹהִי
  choice: 王用自己的印戒和贵族们的印戒封住坑口
  rationale: עִזְקָה 指用于盖印的戒指，译为“印戒”；רַבְרְבָנִין 指权贵或高级官员，译为“贵族们”。原文代词所指在汉语中明确为坑口，故直接说“封住坑口”。
- source_word: דִּי לָא תִשְׁנֵא צְבוּ בְּדָנִיֵּאל
  choice: 使有关但以理的决定无法更改
  rationale: צְבוּ 可表示事情、意愿、意图或决定；这里涉及已执行并加封的王令，正文采用“决定”，同时以脚注保留较宽泛的词义可能。
theological_decisions:
- issue: צְבוּ 的语义范围
  choice: 有关但以理的决定
  alternative: 有关但以理的事情；对但以理所定的安排
  rationale: 上下文最直接指王及官员对但以理所作的正式处置，但亚兰词本身较宽，不应将其限定为某种神学意义上的旨意；脚注保留歧义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“坑口”“印戒”保留原文具体意象；句子分为两句以便普通读者理解，同时保持叙事紧凑。脚注标记置于相关歧义所在的句末。
