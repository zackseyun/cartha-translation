  naturalness: 原译通顺、庄重。“有人搬来”自然，但原文为被动式；改为“一块石头被搬来”可更直接对应原文，且在本节简洁的叙事语境中仍然自然。“在石头上盖了印”是现代汉语中清楚自然的表达。
  terminology: “印戒”准确传达用以盖印的戒指。“贵族们”可以理解，但 רַבְרְבָנוהִי 指王的显贵或高官；“众显贵”既保留其尊贵身份，也不把其制度身份过度具体化。将“决定”改为“事”保留 צְבוּ 所涵盖的事情、意图或决定等歧义。
