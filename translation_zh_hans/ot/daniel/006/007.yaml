  text: אֱ֠דַיִן סָרְכַיָּ֤/א וַ/אֲחַשְׁדַּרְפְּנַיָּ/א֙ אִלֵּ֔ן הַרְגִּ֖שׁוּ עַל מַלְכָּ֑/א וְ/כֵן֙ אָמְרִ֣ין לֵ֔/הּ דָּרְיָ֥וֶשׁ מַלְכָּ֖/א לְ/עָלְמִ֥ין חֱיִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/007.yaml
  text: 'Then these high officials and satraps came before the king and said this to him: “King Darius[b][a], live forever!”'
translation:
  language: zh_hans
  text: 于是，这些总长和总督一同来到王面前[a]，对他说：“大流士王，愿你万岁！[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“聚集到王面前”“一同商议好后到王那里”，或“闹哄哄地拥到王那里”。这里的亚兰语说法强调他们协调一致、集体前来；结合上下文，也可能暗含共谋之意。
    reason: lexical_alternative
  - marker: b
    text: 直译为“愿你活到万世”。这是宫廷中惯用的祝颂语，并不是说王真的永远不死。
    reason: cultural_note
lexical_decisions:
- source_word: אֱדַיִן
  choice: 于是
  rationale: 表示叙事事件的顺承，现代汉语中自然简洁。
- source_word: סָרְכַיָּא
  choice: 总长
  rationale: 这是帝国高级行政官员的称号；“总长”既体现其较高职级，也与现代读者熟悉的《但以理书》行政语境相称。
- source_word: אֲחַשְׁדַּרְפְּנַיָּא
  choice: 总督
  rationale: 指波斯帝国辖区的高级地方长官；“总督”比生硬音译更便于普通中文读者理解，同时保留行政职务性质。
- source_word: אִלֵּן
  choice: 这些
  rationale: 指向上文刚提及的官员，保留原文指示词。
- source_word: הַרְגִּשׁוּ עַל
  choice: 一同来到……面前
  rationale: 表达众人协调一致地前往王那里；正文保留集体行动的意味，而不把喧闹或阴谋意图写死，其他可能语气置于脚注。
- source_word: וְכֵן אָמְרִין לֵהּ
  choice: 对他说
  rationale: 按现代汉语直接引语习惯自然表达，含义对应“如此对他说”。
- source_word: דָּרְיָוֶשׁ מַלְכָּא
  choice: 大流士王
  rationale: 采用现代中文常用人名译法，并按汉语习惯把王号置于姓名之后。
- source_word: לְעָלְמִין חֱיִי
  choice: 愿你万岁
  rationale: 原义为“愿你活到万世”；“愿你万岁”是中文中自然、庄重的宫廷祝颂语，传达其惯用功能而非字面不死之意。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。行政称号用“总长”和“总督”，避免古奥或不必要的音译；对 הַרְגִּשׁוּ עַל 的多义性不在正文中过度解释，并以脚注保留其集体、协调乃至可能带有喧闹或共谋意味的语感。
