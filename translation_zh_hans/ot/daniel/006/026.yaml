base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/026.yaml
  text: 'Then King Darius wrote to all the peoples[a], nations[b], and languages that dwell in all the earth: “May your peace abound.”'
translation:
  language: zh_hans
  text: 于是，大流士王写信给住在全地[b]的各族、各国和说各种语言的人：“愿你们的平安大大增多[a]！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“愿你们的平安增多。”
    reason: lexical_alternative
  - marker: b
    text: “全地”直译亚兰文的措辞；按上下文，这里指大流士帝国疆域的各处。
    reason: cultural_note
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: 于是
  rationale: 这是亚兰文叙事推进语，承接前事并引出下一行动；“于是”自然地保留了事件的先后关系。
- source_word: דָּרְיָוֶשׁ מַלְכָּא
  choice: 大流士王
  rationale: 按现代汉语习惯将王号置于人名之后，准确表达原文。
- source_word: כְּתַב
  choice: 写信
  rationale: 原动词意为“写”；这里有明确的收信对象，译作“写信给”符合汉语表达，同时不擅自强化为“颁布诏令”。
- source_word: לְכָל עַמְמַיָּא אֻמַיָּא וְלִשָּׁנַיָּא
  choice: 各族、各国和说各种语言的人
  rationale: 保留原文列举的三类帝国臣民；“说各种语言的人”将以“语言”代指语言群体的表达自然化，避免“各语言”在汉语中的生硬。
- source_word: דִּי דארין
  choice: 住在
  rationale: 准确表达描述受信者的关系从句和居住含义，采用普通现代汉语。
- source_word: בְּכָל אַרְעָא
  choice: 全地
  rationale: אַרְעָא可指“地、土地、大地”；“全地”保留王室文告中的广泛措辞，不在正文中直接限缩为“大流士的疆域”。
- source_word: שְׁלָמְכוֹן
  choice: 你们……平安
  rationale: 该词可指平安、安康或福祉；“你们……平安”保留其第二人称复数所指，并符合汉语祝愿语。
- source_word: יִשְׂגֵּא
  choice: 大享
  rationale: 该动词表示增多、增长；“大享平安”在庄重而易懂的祝愿语中传达平安丰盛增加之意。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而通顺的汉语，保留王室文告的正式语气。脚注标记分别置于其实际说明的“全地”和“平安”之后，以免沿用咨询文本中标记位置与脚注内容不相符的问题。
