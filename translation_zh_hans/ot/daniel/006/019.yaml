  yaml_path: translation/ot/daniel/006/019.yaml
  text: Then the king went to his palace and spent the night fasting; no entertainment was brought before him[a], and sleep fled from him.
translation:
  language: zh_hans
  text: 随后，王回到王宫，整夜禁食；没有任何娱乐之物被带到他面前[a]，睡意也离开了他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“没有乐师被带到他面前。”这里的亚兰文词义不确定，也可能泛指艺人、娱乐之物或消遣。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱדַיִן
  choice: 随后
  rationale: 这是亚兰文叙事中承接事件次序的常用副词；“随后”自然地表明下一件事发生。
- source_word: אֲזַל מַלְכָּא לְהֵיכְלֵהּ
  choice: 王回到宫中
  rationale: אֲזַל是一般移动动词；הֵיכַל可指宫殿或圣殿，此处是王的居所，译作“宫中”最合语境。“回到”根据上下文自然表达他从狮子坑返回住处。
- source_word: וּבָת טְוָת
  choice: 整夜禁食
  rationale: וּבָת在此表示度过夜晚，טְוָת说明其方式为禁食；“整夜禁食”简洁自然地传达原意。
- source_word: וְדַחֲוָן
  choice: 娱乐消遣
  rationale: 此词词义不确定，可能指乐师、娱乐之物或其他消遣；“娱乐消遣”保留其宽泛含义，不把正文限定为某一具体解释。
- source_word: לָא הַנְעֵל קָדָמוֹהִי
  choice: 没有人把……带到他面前
  rationale: 使役形式表达某物未被带进王面前；中文用不定主语的主动句比机械的被动句更自然。
- source_word: וְשִׁנְתֵּהּ נַדַּת עֲלוֹהִי
  choice: 他也无法入睡
  rationale: 原文直陈“他的睡眠从他身上离去”，表达彻夜无眠；正文采用自然现代汉语，脚注保留原文的形象说法。
