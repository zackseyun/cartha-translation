id: DAN.6.4
reference: Daniel 6:4
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אֱדַ֨יִן֙ דָּנִיֵּ֣אל דְּנָ֔ה הֲוָ֣א מִתְנַצַּ֔ח עַל סָרְכַיָּ֖/א וַ/אֲחַשְׁדַּרְפְּנַיָּ֑/א כָּ/ל קֳבֵ֗ל דִּ֣י ר֤וּחַ יַתִּירָא֙ בֵּ֔/הּ וּ/מַלְכָּ֣/א עֲשִׁ֔ית לַ/הֲקָמוּתֵ֖/הּ עַל כָּל מַלְכוּתָֽ/א־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/004.yaml
  text: Then this Daniel distinguished himself above the high officials and the satraps[a], because an extraordinary spirit was in him[b], and the king planned to set him over the whole kingdom.
translation:
  language: zh_hans
  text: 那时，这位但以理胜过众总长和总督[a]，因为他里面有非凡的灵[b]；王便打算立他治理全国。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “总督”原是波斯帝国辖区长官的专称，也常音译为“总督（satrap）”。
    reason: historical_term
  - marker: b
    text: 或译：“卓越的灵”。这句话可广义指但以理非凡的内在素质、智慧或性情；本节没有进一步说明。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱדַיִן
  choice: 那时
  rationale: 作为承接叙事发展的时间副词，既自然，也保留“随后、当时”的语感。
- source_word: דָּנִיֵּאל דְּנָה
  choice: 这位但以理
  rationale: 保留指示词所带的强调，避免仅译作不带标记的“但以理”。
- source_word: הֲוָא מִתְנַצַּח עַל
  choice: 胜过
  rationale: 表达但以理持续显出优越、超越其他官员的意思；中文简洁自然。
- source_word: סָרְכַיָּא
  choice: 总长
  rationale: 指帝国行政体系中的高级官员；“总长”简明，并与下一级的总督相区别。
- source_word: אֲחַשְׁדַּרְפְּנַיָּא
  choice: 总督
  rationale: 该词指波斯帝国的辖区长官；正文采用现代读者易懂的职衔，脚注补充其历史专名。
- source_word: כָּל־קֳבֵל דִּי
  choice: 因为
  rationale: 清楚表明但以理胜过其他官员的原因。
- source_word: רוּחַ יַתִּירָא
  choice: 非凡的灵
  rationale: 既传达“卓越、超常”的含义，也保留原文“灵”的措辞及其解释空间。
- source_word: בֵּהּ
  choice: 在他里面
  rationale: 保留原文对这种“灵”内在于但以理的表述。
- source_word: וּמַלְכָּא עֲשִׁית
  choice: 王便打算
  rationale: 该表达指王的意向或计划，而不是已经完成的任命。
- source_word: לַהֲקָמוּתֵהּ עַל כָּל מַלְכוּתָא
  choice: 立他治理全国
  rationale: 以自然中文表达使他居于全国之上的治理职位，同时不暗示任命已经实施。
theological_decisions:
- issue: “灵”所指的性质
  choice: 保留“非凡的灵”，不进一步界定
  alternative: 译作“非凡的才智”“卓越的品格”或明确指圣灵
  rationale: 本节只说有“非凡的灵”在但以理里面，并未明确限定为才智、性情或神圣赋能；保留“灵”可维持原文的神学与文学开放性。
- issue: 王的任命是否已经发生
  choice: 译作“打算立他”
  alternative: 译作“已经立他”或“任命他”
  rationale: 原文表达王的意向，尚不是已完成的行动；“打算”准确保留这一时态和叙事张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“这位但以理”保留原文强调；“总长和总督”体现官阶用语；分号呈现但以理的卓越与王之计划之间紧密而有层次的关系。
