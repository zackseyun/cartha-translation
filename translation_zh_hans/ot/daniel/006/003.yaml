base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/003.yaml
  text: And over them were three high officials[a], of whom Daniel was one[b], so that these satraps might give account to them and the king might suffer no loss.
translation:
  language: zh_hans
  text: 在他们之上有三位总长，但以理是其中之一，为要让这些总督向他们述职[a]，免得王遭受损失[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“向他们交账”或“向他们报告”；这里的亚兰语在行政语境中可指交代账目或呈报公务。
    reason: lexical_alternative
  - marker: b
    text: 或译“免得王受到损害”；这里很可能是指王在行政或财务方面蒙受损失。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעֵלָּא מִנְּהוֹן
  choice: 在他们之上又设了
  rationale: 表达在总督之上另设更高一级官职的行政层级；按中文叙事补出“设了”，使句意自然，但不改变原文关系。
- source_word: סָרְכִין תְּלָתָא
  choice: 三位总长
  rationale: 该词指置于总督之上的高级监察官员。“总长”简洁庄重，也避免采用带有现代政体色彩的“总统”。
- source_word: דִּי דָנִיֵּאל חַד מִנְּהוֹן
  choice: 但以理是其中之一
  rationale: 准确保留关系从句，说明但以理属于三位总长之一。
- source_word: אֲחַשְׁדַּרְפְּנַיָּא
  choice: 总督
  rationale: 这是波斯行政官衔；“总督”是现代中文读者容易理解且符合历史行政语境的译法。
- source_word: יָהֲבִין לְהוֹן טַעְמָא
  choice: 向他们述职
  rationale: 此行政用语可指交账、呈报或说明情况；“述职”自然地表达这些总督须向三位总长负责并报告公务。
- source_word: וּמַלְכָּא לָא לֶהֱוֵא נָזִק
  choice: 免得王遭受损失
  rationale: נזק可泛指受损或蒙受损失；在官僚行政语境中，“遭受损失”既自然，也不把含义限缩为人身伤害。
