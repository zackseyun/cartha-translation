  text: who rescues and delivers, and works signs and wonders in heaven and on earth—he who rescued Daniel from the power of the lions.
translation:
  language: zh_hans
  text: 他施行拯救和救援，在天上地上行神迹奇事；他曾救但以理脱离狮子的权势。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מְשֵׁיזִב וּמַצִּל
  choice: 施行拯救和搭救
  rationale: 保留两个近义分词的并列及持续、特征性的语气；用自然的现代汉语表达君王对上帝作为的宣告。
- source_word: אָתִין וְתִמְהִין
  choice: 神迹奇事
  rationale: 这是圣经语境中常见的固定搭配，对应“记号和奇事”，既自然又保留超自然作为的含义。
- source_word: בִּשְׁמַיָּא וּבְאַרְעָא
  choice: 在天上地下
  rationale: 简洁保留原文两个领域的并列，表示其作为遍及天与地。
- source_word: מִן יַד אַרְיָוָתָא
  choice: 脱离狮子的掌控
  rationale: 原文“从狮子的手”是表达权势、控制的惯用语；狮子没有人的手，故译出其语义而不机械直译。
theological_decisions:
- issue: 末句关系从句的指称与强调
  choice: 用“他曾……”承接同一位施救者
  alternative: 译为“就是那救……的”
  rationale: 原文关系词 דִּי 引出具体实例，可作“他曾/就是那……的”理解；中文用分号后重复“他”既保留强调，也避免过度规定其句法功能。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语；保留“拯救/搭救”和“神迹奇事”的平行结构，不添加原文没有的神学称谓。
