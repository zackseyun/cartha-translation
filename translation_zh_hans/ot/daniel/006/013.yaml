reference: Daniel 6:13
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: בֵּ֠/אדַיִן קְרִ֨יבוּ וְ/אָמְרִ֥ין קֳדָם מַלְכָּ/א֮ עַל אֱסָ֣ר מַלְכָּ/א֒ הֲ/לָ֧א אֱסָ֣ר רְשַׁ֗מְתָּ דִּ֣י כָל אֱנָ֡שׁ דִּֽי יִבְעֵה֩ מִן כָּל אֱלָ֨הּ וֶֽ/אֱנָ֜שׁ עַד יוֹמִ֣ין תְּלָתִ֗ין לָהֵן֙ מִנָּ֣/ךְ מַלְכָּ֔/א יִתְרְמֵ֕א לְ/ג֖וֹב אַרְיָותָ֑/א עָנֵ֨ה מַלְכָּ֜/א וְ/אָמַ֗ר יַצִּיבָ֧א מִלְּתָ֛/א כְּ/דָת מָדַ֥י וּ/פָרַ֖ס דִּי לָ֥א תֶעְדֵּֽא־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/013.yaml
  text: 'Then they came near and spoke before the king concerning the king’s injunction: “Did you not sign an injunction that any man who makes a petition to any god or man for thirty days[a], except to you, O king, shall be thrown into the lions’ den?” The king answered and said, “The matter is certain, according to the law of the Medes and Persians[c][b], which cannot be changed.”'
translation:
  language: zh_hans
  text: 于是，他们上前，在王面前提起王的禁令，说：“王啊，你不是签署了禁令，规定三十天内，任何人若向任何神明或人祈求，除非向你祈求，就必被扔进狮子坑吗？”王回答说：“这话确实如此；按照玛代人和波斯人的律法，这禁令不可更改[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “不可更改”也可译作“不可撤销”或“不可废除”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: 于是
  rationale: 作为叙事推进语，既表达随后发生，也符合现代汉语自然叙事。
- source_word: קְרִיבוּ
  choice: 他们上前
  rationale: 保留“靠近、走近”的具体动作；在宫廷场景中比单说“来到”更清楚自然。
- source_word: וְאָמְרִין קֳדָם מַלְכָּא
  choice: 在王面前……说
  rationale: קֳדָם 表示在王面前或王的临在中，译文保留正式觐见场景。
- source_word: עַל אֱסָר מַלְכָּא
  choice: 提起王的禁令
  rationale: אֱסָר 指具有约束力的禁制，不只是泛指命令；“禁令”准确、通俗，也体现禁止性质。
- source_word: רְשַׁמְתָּ
  choice: 签署
  rationale: 在此法律语境中指以书面方式正式确立命令；“签署”最符合现代汉语法律表达。
- source_word: כָל אֱנָשׁ
  choice: 任何人
  rationale: אֱנָשׁ 虽为阳性单数形式，在本法律条文中具有泛指作用；现代汉语“任何人”自然且不缩窄适用范围。
- source_word: יִבְעֵה
  choice: 祈求
  rationale: 此处是向神明或人提出请求；因上下文涉及但以理的祷告，“祈求”兼能表达宗教请求与郑重求告，同时没有把对象限于神。
- source_word: מִן כָּל אֱלָהּ וֶאֱנָשׁ
  choice: 向任何神明或人
  rationale: מִן 字面常作“从”，但与求取动词连用时表示请求所指向或求取的对象；汉语用“向”最自然。
- source_word: עַד יוֹמִין תְּלָתִין
  choice: 三十天内
  rationale: 表达禁令有效期间；“三十天内”保留时限含义，并适合法令措辞。
- source_word: לָהֵן מִנָּךְ
  choice: 除非向你祈求
  rationale: 明确表达唯一例外，并顺应前文“向……祈求”的汉语搭配。
- source_word: יִתְרְמֵא לְגוֹב אַרְיָותָא
  choice: 必被扔进狮子坑
  rationale: 保留被动刑罚表达和法律后果的确定性；“坑”符合 גֹּב，避免误译为笼穴。
- source_word: יַצִּיבָא מִלְּתָא
  choice: 这事确实如此
  rationale: 表达王对所述法令内容的确认；庄重而不生硬。
- source_word: דִּי לָא תֶעְדֵּא
  choice: 这是不可更改的
  rationale: 动词可指废除、撤销或改变；正文采用较宽泛的“更改”，不排除“撤销”的法律含义。
theological_decisions:
- issue: 法律条文中 אֱנָשׁ 的泛指范围
  choice: 任何人
  alternative: 任何男子
  rationale: 亚兰语名词形态为阳性单数，但此处处在“凡……者”的法律公式中，具有一般人的泛指功能。汉语没有相应的语法阳性要求，译作“任何人”既忠于语义范围，也避免误示禁令仅适用于男性。
- issue: יִבְעֵה 的宗教与非宗教语义张力
  choice: 祈求
  alternative: 请求／求取
  rationale: 对象同时包括神明和人，词义不能限于敬拜；“祈求”在汉语中可用于向神或向人恳切求告，并与本章祷告情境呼应，但不把禁令解释成只禁宗教祷告。
- issue: 玛代人与波斯人律法的不可变性
  choice: 不可更改
  alternative: 不可撤销
  rationale: 原文可涵盖改变、废除或撤销。正文保留较宽语义，不进一步断定其法律机制；脚注列出“撤销”这一可能译法。
translation_notes:
  register: 采用现代、庄重而易懂的叙事与宫廷法律语体。“王啊”用于直接称呼，体现原文称谓而不作古奥化处理。正文中的脚注标记[a]与脚注完全对应。
