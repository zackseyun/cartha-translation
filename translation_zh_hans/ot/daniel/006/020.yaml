  yaml_path: translation/ot/daniel/006/020.yaml
  text: Then the king arose at dawn[a], at first light[b], and in haste went to the den of the lions.
translation:
  language: zh_hans
  text: 于是，王在黎明、天刚亮的时候[a]起身，急忙[b]前往狮子坑。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文连续使用两个意思相近的破晓表达，可译为“黎明时……天一亮”，以加强语气。
    reason: lexical_alternative
  - marker: b
    text: “急忙”也可含有“惊慌”或“焦急迫切”的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: 于是
  rationale: 亚兰文叙事推进标记，表示紧接着发生的事；“于是”自然保留事件的连续性。
- source_word: מַלְכָּא
  choice: 王
  rationale: 强调式确定形式；上下文已明确所指，现代汉语用“王”即可自然表达。
- source_word: בִּשְׁפַּרְפָּרָא
  choice: 在黎明
  rationale: 指破晓或清晨初始；“黎明”简洁、庄重。
- source_word: יְקוּם
  choice: 起身
  rationale: 此动词表示起来或站起；“起身”符合现代汉语叙事表达。
- source_word: בְּנָגְהָא
  choice: 天刚亮时
  rationale: 与光亮、天明有关。原文连续使用两个相近的晨曦表达；分别译作“在黎明、天刚亮时”，既保留强调，也避免机械重复。
- source_word: וּבְהִתְבְּהָלָה
  choice: 急忙
  rationale: 该词可表示匆忙、惊慌或焦急迫切；正文用“急忙”表达行动方式，并以脚注保留情绪色彩的可能性。
- source_word: לְגֻבָּא
  choice: 前往……坑
  rationale: 该词本义可指坑穴；在本章特指关狮子的坑。“狮子坑”是准确且惯用的汉语表达。
- source_word: דִי
  choice: 狮子坑（属格关系）
  rationale: 关系词连接“坑”与“狮子”；汉语以合成名词“狮子坑”最为自然。
- source_word: אַרְיָוָתָא
  choice: 狮子
  rationale: 复数强调式，在“狮子坑”这一固定语境中，汉语通常无需显式标出复数和定指。
- source_word: אֲזַל
  choice: 前往
  rationale: 常用的“去、前往”之意；“前往”与经文庄重而自然的叙事语体相称。
