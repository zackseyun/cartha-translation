base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/002.yaml
  text: It seemed good to Darius to appoint over the kingdom one hundred and twenty satraps[a], who would be throughout the whole kingdom.
translation:
  language: zh_hans
  text: 大流士认为，任命一百二十名总督[a]管理全国各地，是合宜的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “总督”指波斯帝国的高级地方行政官；也可译作“行省长官”。
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁפַר קֳדָם דָּרְיָוֶשׁ
  choice: 大流士认为……甚好
  rationale: 这是亚兰语惯用表达，表示某事在大流士看来是好的、合宜的；此译自然保留其评价意味，不刻意强化为情绪上的“喜悦”。
- source_word: וַהֲקִים
  choice: 立
  rationale: 本处指任命官员就职；“立”简洁庄重，也符合行政语境。
- source_word: עַל מַלְכוּתָא
  choice: 治理全国
  rationale: 原文直译为“在国之上”，在任命官员的语境中表达其管辖职责；译作“治理全国”可自然呈现行政含义。
- source_word: אֲחַשְׁדַּרְפְּנַיָּא
  choice: 总督
  rationale: 指波斯行政体系中的高级地方官，即 satrap；“总督”是现代中文较易理解且具有历史行政色彩的对应词，脚注补充其具体所指。
- source_word: מְאָה וְעֶשְׂרִין
  choice: 一百二十名
  rationale: 按现代中文行文写出数词，并以量词“名”搭配官员。
- source_word: דִּי לֶהֱוֺן בְּכָל מַלְכוּתָא
  choice: 治理全国
  rationale: 关系词加未完成式带有预期或目的意味，末尾短语表示这些官员分布并任职于整个国境；中文合并为“治理全国”，避免生硬重复，同时保留其职能和范围。
