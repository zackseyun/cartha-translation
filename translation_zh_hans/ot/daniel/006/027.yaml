  to: 我颁布命令：在我王国所辖的全境[a]，人人都要在但以理的神面前战兢惧怕[b]，因为他是永活的神，永远长存；他的国永不毁灭，他的权柄直到终结[c]。
  rationale: 作两处低风险的中文润饰：“所辖”使全国范围的表达更顺畅；“权柄直到终结”更贴近末句名词性表述，也更符合现代中文，同时保留原文对“终结”未作界定的语义开放性。其余译文及脚注忠实、自然，无须改动。
