reference: Daniel 6:27
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: מִן קֳדָמַ/י֮ שִׂ֣ים טְעֵם֒ דִּ֣י בְּ/כָל שָׁלְטָ֣ן מַלְכוּתִ֗/י לֶהֱוֺ֤ן זאעין וְ/דָ֣חֲלִ֔ין מִן קֳדָ֖ם אֱלָהֵ֣/הּ דִּי דָֽנִיֵּ֑אל דִּי ה֣וּא אֱלָהָ֣/א חַיָּ֗/א וְ/קַיָּם֙ לְ/עָ֣לְמִ֔ין וּ/מַלְכוּתֵ/הּ֙ דִּֽי לָ֣א תִתְחַבַּ֔ל וְ/שָׁלְטָנֵ֖/הּ עַד סוֹפָֽ/א־׀־־־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/027.yaml
  text: A decree is issued by me[a], that in all the dominion of my kingdom people are to tremble and fear before the God of Daniel, for he is the living God, enduring forever; and his kingdom will not be destroyed[c][b], and his dominion will be to the end.
translation:
  language: zh_hans
  text: 我颁布命令：在我王国所辖的全境[a]，人人都要在但以理的神面前战兢惧怕[b]，因为他是永活的神，永远长存；他的国永不毁灭，他的权柄直到终结[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在我王国统治所及的全境。”
    reason: lexical_alternative
  - marker: b
    text: 或译：“敬畏惧怕。”原文两个词共同表达强烈的震惧与敬畏。
    reason: lexical_alternative
  - marker: c
    text: 或译：“直到尽头。”这里的“终结”没有进一步说明所指为何。
    reason: ambiguity
lexical_decisions:
- source_word: מִן קֳדָמַי שִׂים טְעֵם
  choice: 我颁布命令
  rationale: 这是亚兰语王室行政用语，字面涉及命令“从我面前发出”并被“设立”。译为“我颁布命令”自然、庄重，也清楚表达君王亲自授权。
- source_word: בְּכָל שָׁלְטָן מַלְכוּתִי
  choice: 在我王国管辖的全境
  rationale: שָׁלְטָן在此指统治所及的领域；“管辖的全境”既表达政治范围，也避免生硬重复“统治、王国”。
- source_word: לֶהֱוֺן
  choice: 人人都要
  rationale: 原文未明说主语，但王令所要求的是辖境中的人。“人人”明示汉语所需的承受对象，不额外限定族群。
- source_word: זאעין וְדָחֲלִין
  choice: 战兢惧怕
  rationale: 两个并列分词都带有强烈的震惧和敬畏色彩。“战兢惧怕”保留双重表达及其力度，没有将其弱化为单纯的尊敬。
- source_word: מִן קֳדָם אֱלָהֵהּ דִּי דָנִיֵּאל
  choice: 在但以理的神面前
  rationale: מִן קֳדָם在此表达处于神面前的姿态；这一译法自然地保留了关系性和临在感。
- source_word: אֱלָהָא חַיָּא
  choice: 永活的神
  rationale: “永活的神”在现代中文中庄重流畅，并在上下文中与无生命的神像形成隐含对照；“永活”也与随后“永远长存”相呼应而不合并两项陈述。
- source_word: וְקַיָּם לְעָלְמִין
  choice: 永远长存
  rationale: קַיָּם可指持续存在、坚定不移；结合לְעָלְמִין，译作“永远长存”准确表达永久延续。
- source_word: וּמַלְכוּתֵהּ דִּי לָא תִתְחַבַּל
  choice: 他的国永不毁灭
  rationale: תִתְחַבַּל在此表示遭毁坏或败亡。“永不毁灭”清楚传达其国不可被摧毁，并保留原文将来的否定意义。
- source_word: וְשָׁלְטָנֵהּ עַד סוֹפָא
  choice: 他的统治存到终结
  rationale: שָׁלְטָן此处是掌权、统治；עַד סוֹפָא直译为“直到终结”。主文保留原文的终末性措辞，不擅自将“终结”具体化。
theological_decisions:
- issue: 王令要求人对但以理之神采取何种态度
  choice: 战兢惧怕
  alternative: 敬畏惧怕
  rationale: 原文使用两个力度较强的词，既可包含敬畏，也明确带有震惧。主文保留其强烈语气，脚注说明较偏重尊崇的译法。
- issue: 神及其国度的永久性
  choice: 永远长存；他的国永不毁灭
  alternative: 永远坚定；他的国不会败坏
  rationale: 此译直接陈述神持续存在和其国不可毁坏，没有加入经文未明说的系统神学术语。
- issue: עַד סוֹפָא所指的“终结”
  choice: 存到终结
  alternative: 直到尽头；统治永无穷尽
  rationale: 原文没有在本短语中明确界定“终结”是什么。主文贴近其措辞，既呈现终末视野，也不把解释性结论直接写入正文。
translation_notes:
  register: 采用现代、庄重的王室诏令语体。“我颁布命令”简洁有力；后半句保持诗性平行结构。避免古奥文言和宗派化术语，同时以脚注保留词义及终末措辞的真实张力。
