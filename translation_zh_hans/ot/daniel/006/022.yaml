  yaml_path: translation/ot/daniel/006/022.yaml
  text: 'Then Daniel spoke with the king: “O king[a], live forever!”'
translation:
  language: zh_hans
  text: 于是，但以理对王说：“愿王[a]万岁！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“愿王永远活着！”阿拉姆语原文采用的是惯常的王室祝颂语。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱדַיִן
  choice: 于是
  rationale: 这是推动叙事顺序的阿拉姆语连接词；“于是”在现代汉语中自然地承接前文行动。
- source_word: דָּנִיֶּאל
  choice: 但以理
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: עִם
  choice: 对
  rationale: 该介词本义为“与”，但与“说话”连用时标明说话对象；汉语用“对王说”最自然，也准确表达句法关系。
- source_word: מַלְכָּא（第一次）
  choice: 王
  rationale: 第一次出现是说话所指向的对象；上下文已明确其身份，汉语不必另加“那位”。
- source_word: מַלִּל
  choice: 说
  rationale: 该动词意为“说、讲话”；在“对王说”的结构中，“说”简洁自然，且不增添原文没有的“回答”。
- source_word: מַלְכָּא（第二次）
  choice: 王
  rationale: 第二次出现用于直接称呼。现代汉语以“愿王……”自然表达庄重的王室称颂，无需添加古雅的呼格词。
- source_word: לְעָלְמִין
  choice: 万岁
  rationale: 字面表示长久、永远；与 חֱיִי 构成惯用的王室祝颂语。汉语“万岁”自然对应整句“愿王永远活着”的礼仪功能。
- source_word: חֱיִי
  choice: 愿……万岁
  rationale: 形式上是命令式而语用上表达祝愿；以“愿”明确其祈愿语气，并与“万岁”构成现代读者熟悉而庄重的王室祝颂。
