  text: אֱלָהִ֞/י שְׁלַ֣ח מַלְאֲכֵ֗/הּ וּֽ/סֲגַ֛ר פֻּ֥ם אַרְיָוָתָ֖/א וְ/לָ֣א חַבְּל֑וּ/נִי כָּ/ל קֳבֵ֗ל דִּ֤י קָֽדָמ֨וֹ/הִי֙ זָכוּ֙ הִשְׁתְּכַ֣חַת לִ֔/י וְ/אַ֤ף קדמי/ך מַלְכָּ֔/א חֲבוּלָ֖ה לָ֥א עַבְדֵֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/023.yaml
  text: My God sent his angel and shut the mouths of the lions[a], and they have not harmed me, because innocence was found in me before him; and also before you, O king[c][b], I have done no harm.
translation:
  language: zh_hans
  text: 我的上帝差遣他的天使[a]，封住了狮子的口；它们没有伤害我，因为我在他面前被查明是无辜的[b]；王啊，我在你面前也没有行过恶[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“使者”。亚兰文这个词既可指一般的使者，也可指天使；本处神奇拯救的语境较支持“天使”。
    reason: lexical_alternative
  - marker: b
    text: 或译“因为我在他面前被查明是清白的”或“纯洁的”。
    reason: lexical_alternative
  - marker: c
    text: 或译“王啊，我也没有得罪你”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלָהִי
  choice: 我的上帝
  rationale: 保留第一人称所属关系，明确但不过度扩展但以理对上帝的称呼。
- source_word: מַלְאֲכֵהּ
  choice: 他的天使
  rationale: 该词可指使者或天使；本处超自然拯救的语境更自然地指天使，同时以脚注保留词义上的另一可能。
- source_word: וּסֲגַר פֻּם אַרְיָוָתָא
  choice: 封住狮子的口
  rationale: 贴近亚兰文的集合表达；现代汉语以单数“口”概括众狮之口，简洁自然。
- source_word: וְלָא חַבְּלוּנִי
  choice: 它们没有伤害我
  rationale: 复数动词的主语是狮子；“伤害”准确表达造成损伤之意。
- source_word: זָכוּ הִשְׁתְּכַחַת לִי
  choice: 我被查明是无辜的
  rationale: 以自然汉语传达“有清白被发现归于我”的司法性被动表达，并保留上帝鉴察、判明的意味。
- source_word: וְאַף קֳדָמָיךְ מַלְכָּא
  choice: 王啊，在你面前，我也
  rationale: 保留对王的直接称呼以及“在你面前”这一与“在他面前”对应的评价范围。
- source_word: חֲבוּלָה לָא עַבְדֵת
  choice: 没有做过伤害人的事
  rationale: 该短语表示未行伤害或恶事；补出“人的”使现代汉语明确自然，却不限定具体受害者。
theological_decisions:
- issue: מַלְאֲכֵהּ 所指身份
  choice: 他的天使
  alternative: 他的使者
  rationale: 神奇拯救的叙事语境支持天上的使者，但不进一步推定该天使的具体身份。
- issue: 但以理的“无辜”范围
  choice: 在他面前，我被查明是无辜的
  alternative: 在他面前，我被查明纯全无过
  rationale: “无辜”按上下文指控告事项上的清白，不把这句话扩大为绝对无罪或无瑕；与后半句对王的无害行为并列。
- issue: 对王没有行 חֲבוּלָה 的含义
  choice: 在你面前，我也没有做过伤害人的事
  alternative: 我也没有得罪你，王啊
  rationale: 正文保留“伤害/恶行”的较宽意义，不将其悄然收窄为只针对王个人的冒犯；脚注列出另一种语境化译法。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“王啊”保留宫廷中的直接称呼；两个“在……面前”维持原文在上帝与君王面前受审察的平行结构。
