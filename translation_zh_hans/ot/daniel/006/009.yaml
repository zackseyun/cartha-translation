base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/009.yaml
  text: Now[a], O king, establish the injunction and sign the document so that it cannot be changed, according to the law of the Medes and Persians[b], which cannot be revoked.
translation:
  language: zh_hans
  text: 现在，王啊，请立下这道禁令，签署这份文书，使这文书不可更改[a]；照玛代人和波斯人的法律，这法律是不可废除的[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不得改动。”亚兰文强调这份书面法令不可变更。
    reason: lexical_alternative
  - marker: b
    text: 或译：“是不可撤销的。”直译为“不会消逝”，在这里是指法律不得取消或失效。
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּעַן
  choice: 现在
  rationale: 作为话语副词，引出谋士们催促性的请求；“现在”自然地保留了当下、立即办理的语气，而不过度解释为因果关系。
- source_word: מַלְכָּא
  choice: 王啊
  rationale: 原文在此为直接呼语；“王啊”保留宫廷陈词中的称呼形式，同时符合现代汉语圣经文体。
- source_word: תְּקִים
  choice: 立下
  rationale: 该动词有设立、使之确立之意；与“禁令”搭配时，“立下”自然表达使法令正式生效。
- source_word: אֱסָרָא
  choice: 这道禁令
  rationale: 上下文所指是限制人行为的强制性法令；“禁令”比宽泛的“命令”更准确，“这道”则衔接前文已经提出的议案。
- source_word: וְתִרְשֻׁם
  choice: 签署
  rationale: 该词本可指写下、记载；在王正式批准法律文书的语境中，“签署”传达书面确认并赋予效力的行为。
- source_word: כְּתָבָא
  choice: 文书
  rationale: 指正式写成的法律文件；“文书”兼具书面性与官方性质，也比“文件”略显庄重。
- source_word: דִּי לָא לְהַשְׁנָיָה
  choice: 使它不可更改
  rationale: 表达拟定文书不得改变的法律目的；“使它不可更改”保留原文目的或结果色彩以及不可变更的强度。
- source_word: כְּדָת
  choice: 照……的法律
  rationale: דָּת 指成文法、法令或法律惯例；“照……的法律”自然表达以该法律规范为依据。
- source_word: מָדַי וּפָרַס
  choice: 玛代人和波斯人
  rationale: 按族群名称直译，指其共同的法律传统；采用现代中文圣经中清楚且通行的名称。
- source_word: דִּי לָא תֶעְדֵּא
  choice: 是不可废除的
  rationale: 字面意为“不消逝”，在法律语境中是不得取消或失效的惯用表达；“不可废除”准确传达其法律上的不可撤销性。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的法律与宫廷陈词语体。“王啊”保留直接呼语；“立下禁令、签署文书、不可更改、不可废除”形成清楚的法律语义链。两个近义否定语分别对应原文关于文书不可改动和法律不可失效的表达，未将其合并，以保留原文的重复与强调。
