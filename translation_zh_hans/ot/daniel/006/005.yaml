  terminology: “总长”和“总督”可保留，既合乎本段既有官制译名，也不对职位作过度细化。“王国政务”“腐败行为”“疏忽”准确适合行政语境。将מְהֵימַן译为“可靠”足以表达其公职上的可信赖性；脚注保留“忠实／忠信”作为替代译法。
