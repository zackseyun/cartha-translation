    rationale: “在王国政务上寻找控告但以理的把柄”更清楚地表达行政领域与控告目的。
  revised_text: 于是，那些总长和总督试图在王国政务上寻找控告但以理的把柄，却找不到任何把柄或腐败行为，因为他可靠[a]，在他身上也找不到任何疏忽[b]或腐败行为。
