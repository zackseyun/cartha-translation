  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אֱדַ֨יִן סָֽרְכַיָּ֜/א וַ/אֲחַשְׁדַּרְפְּנַיָּ֗/א הֲו֨וֹ בָעַ֧יִן עִלָּ֛ה לְ/הַשְׁכָּחָ֥ה לְ/דָנִיֵּ֖אל מִ/צַּ֣ד מַלְכוּתָ֑/א וְ/כָל עִלָּ֨ה וּ/שְׁחִיתָ֜ה לָא יָכְלִ֣ין לְ/הַשְׁכָּחָ֗ה כָּ/ל קֳבֵל֙ דִּֽי מְהֵימַ֣ן ה֔וּא וְ/כָל שָׁלוּ֙ וּ/שְׁחִיתָ֔ה לָ֥א הִשְׁתְּכַ֖חַת עֲלֽוֹ/הִי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/005.yaml
  text: Then the high officials and satraps tried to find grounds for accusing Daniel in matters of the kingdom, but they could find no grounds for accusation or corruption, because he was trustworthy[a], and no negligence[b] or corruption could be found against him.
translation:
  language: zh_hans
  text: 于是，那些总长和总督试图在王国政务上寻找控告但以理的把柄，却找不到任何把柄或腐败行为，因为他可靠[a]，在他身上也找不到任何疏忽[b]或腐败行为。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“忠实”“忠信”；亚兰文在这里强调但以理履行职务值得信赖。
    reason: lexical_alternative
  - marker: b
    text: 或译“过失”“差错”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱדַיִן
  choice: 于是
  rationale: 表示叙事的时间推进和紧接发生的行动；“于是”符合现代汉语叙事语流。
- source_word: סָרְכַיָּא
  choice: 总长
  rationale: 这是帝国行政职衔；采用读者较熟悉且与上下文官制相称的传统译名，同时不额外界定其具体职权。
- source_word: אֲחַשְׁדַּרְפְּנַיָּא
  choice: 总督
  rationale: 指波斯帝国的地方高级官员；“总督”在现代中文中清楚自然，并保留历史行政背景。
- source_word: בָעַיִן ... לְהַשְׁכָּחָה
  choice: 竭力要……找
  rationale: 该结构表示持续寻求发现；“竭力要找”自然表达这些官员有目的的反复尝试。
- source_word: עִלָּה
  choice: 把柄
  rationale: 该词在这里指可据以提出控告的理由或口实，而不一定是已经成立的正式罪名；“把柄”准确传达其预设敌意和司法用途。
- source_word: מִצַּד מַלְכוּתָא
  choice: 在治理王国的事务上
  rationale: 限定他们搜寻把柄的领域，即但以理在王国行政方面的公务表现；补出“治理”使现代中文含义明确。
- source_word: שְׁחִיתָה
  choice: 腐败行为
  rationale: 在行政语境中指败坏、徇私或不正当的行为；“腐败行为”比单说“腐败”更便于与“找到”搭配。
- source_word: מְהֵימַן
  choice: 忠实可靠
  rationale: 强调但以理履职可信、尽责；并列措辞兼顾“忠实”与“可靠”的词义范围，不将其限定为宗教意义上的信心。
- source_word: שָׁלוּ
  choice: 疏忽
  rationale: 在官务语境中表示失误、过失或懈怠；“疏忽”自然体现行政失职的可能性。
- source_word: הִשְׁתְּכַחַת עֲלֹוהִי
  choice: 在他身上找不到
  rationale: 保留原文介词表达的针对性，同时以自然中文说明调查未能发现任何可归到但以理身上的问题。
theological_decisions:
- issue: 但以理“忠实”的性质
  choice: 译作“忠实可靠”，主要指他在公职上的可信和尽责。
  alternative: 可译作“忠信”或单译“可靠”。
  rationale: 上下文审查的是但以理在王国事务中的操守。译文保留道德分量，但不把该词悄然转成专指宗教信仰的陈述。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“总长、总督”保留古代帝国行政背景；“找把柄控告”体现司法性的敌意，“治理王国的事务”明确其公务范围。所有脚注标记均置于正文相应词语之后。
