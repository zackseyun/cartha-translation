  text: בֵּ/אדַ֣יִן מַלְכָּ֗/א שַׂגִּיא֙ טְאֵ֣ב עֲל֔וֹ/הִי וּ/לְ/דָ֣נִיֵּ֔אל אֲמַ֖ר לְ/הַנְסָקָ֣ה מִן גֻּבָּ֑/א וְ/הֻסַּ֨ק דָּנִיֵּ֜אל מִן גֻּבָּ֗/א וְ/כָל חֲבָל֙ לָא הִשְׁתְּכַ֣ח בֵּ֔/הּ דִּ֖י הֵימִ֥ן בֵּ/אלָהֵֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/024.yaml
  text: Then the king was very glad because of him[a], and he ordered that Daniel be brought up from the pit. So Daniel was brought up from the pit, and no kind of harm was found on him[b], because he had trusted in his God.
translation:
  language: zh_hans
  text: 那时，王因但以理大大欢喜，就吩咐人把他从坑[a]里拉上来。于是，但以理被人从坑里拉了上来；他身上丝毫损伤也没有，因为他信靠[b]他的上帝。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“狮子穴”。亚兰文这个词指坑状的围场；在这里指关狮子的坑。
    reason: lexical_alternative
  - marker: b
    text: 或译“相信”。这个动词既可表达相信，也可表达信靠；此处译作“信靠”，突出但以理对上帝的倚赖。
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: 那时
  rationale: 这是亚兰文叙事推进语，承接前文并引出随后发生的事；“那时”自然、清楚。
- source_word: שַׂגִּיא טְאֵב עֲלוֹהִי
  choice: 因但以理大大欢喜
  rationale: שַׂגִּיא 强化 טְאֵב 所表达的喜悦；代词所指在汉语中明确译为“但以理”，避免“因他”指代含混。
- source_word: וּלְדָנִיֵּאל אֲמַר לְהַנְסָקָה
  choice: 就吩咐人把他……拉上来
  rationale: 原文的“说”结合使役不定式，在语境中具有命令含义；汉语补出不定施事者“人”，并以“拉上来”表达从坑中向上移出的动作。
- source_word: מִן גֻּבָּא
  choice: 从坑里
  rationale: גֻּבָּא 指坑状的围 enclosure；本段具体是狮子坑。“坑”保留其地形意象，并以脚注说明语境性译法。
- source_word: וְכָל חֲבָל לָא הִשְׁתְּכַח בֵּהּ
  choice: 他身上丝毫损伤也没有
  rationale: חֲבָל 在此指伤害或损伤；כָל 与否定词连用表达完全没有。“身上……没有”符合检查但以理身体状况的语境。
- source_word: דִּי הֵימִן בֵּאלָהֵהּ
  choice: 因为他信靠他的上帝
  rationale: דִּי 引出原因；הֵימִן 可指相信或信靠，此处“信靠”更能表达但以理对上帝的倚赖，同时脚注保留“相信”的词义可能。
theological_decisions:
- issue: 但以理获保全的原因
  choice: 因为他信靠他的上帝
  alternative: 因为他相信他的上帝
  rationale: 原文明说但以理未受损伤与他对上帝的信靠有关。译文保留这一因果陈述，但不进一步界定这种信靠与拯救之间的教义机制，也不把它解释为功德。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“大大欢喜”“丝毫损伤也没有”既自然又保留原文的强调。主文中的脚注标记分别紧接实际涉及的词语，避免英文咨询层中标记位置与脚注内容错位。
