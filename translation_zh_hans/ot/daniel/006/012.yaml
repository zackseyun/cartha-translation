source:
  edition: WLC
  text: אֱ֠דַיִן גֻּבְרַיָּ֤/א אִלֵּךְ֙ הַרְגִּ֔שׁוּ וְ/הַשְׁכַּ֖חוּ לְ/דָנִיֵּ֑אל בָּעֵ֥א וּ/מִתְחַנַּ֖ן קֳדָ֥ם אֱלָהֵֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/012.yaml
  text: Then these men came by agreement and found Daniel petitioning and pleading before his God[a][b].
translation:
  language: zh_hans
  text: 于是，这些人一同赶来[a]，发现但以理正在他的上帝面前祈求、恳求[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“相约而来”“一同聚集而来”，也可能有“喧嚷着赶来”的意思。亚兰文动词很可能表示这些人怀着共同目的，协同行动。
    reason: lexical_alternative
  - marker: b
    text: 或译：“祷告、恳切祈求”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱדַיִן
  choice: 于是
  rationale: 表示叙事顺序的时间副词；“于是”自然承接前文，并推进事件发展。
- source_word: גֻּבְרַיָּא אִלֵּךְ
  choice: 这些人
  rationale: 忠实表达带指示成分的复数名词，所指是上文刚提到的那群谋划者。
- source_word: הַרְגִּשׁוּ
  choice: 一同赶来
  rationale: 该动词在本章语境中含有众人一起行动、带着共同目的聚集而来的意味；“一同赶来”既保留协同行动和突然到场的语感，又不把正文限定为喧闹或正式约定。
- source_word: וְהַשְׁכַּחוּ
  choice: 发现
  rationale: 表达他们到场后看见但以理正在进行某事；“发现”符合现代汉语叙事习惯。
- source_word: לְדָנִיֵּאל
  choice: 但以理
  rationale: 采用该人名在中文圣经传统中的通行译名。
- source_word: בָּעֵא
  choice: 祈求
  rationale: 该分词表示提出请求；在向上帝祷告的语境中，“祈求”自然、庄重，也保留请求之意。
- source_word: וּמִתְחַנַּן
  choice: 恳求
  rationale: 该分词带有恳切求恩、求怜悯的意味；“恳求”体现迫切语气，同时不补入原文未明说的宾语。
- source_word: קֳדָם
  choice: 在……面前
  rationale: 直接表达“在……面前／在……临在中”的空间及敬拜关系。
- source_word: אֱלָהֵהּ
  choice: 他的上帝
  rationale: 准确反映名词所带的第三人称阳性单数所属后缀。
theological_decisions:
- issue: 如何翻译但以理祷告的两个并列分词，而不加入原文未明说的祈求内容
  choice: 祈求、恳求
  alternative: 祷告、祈求恩惠
  rationale: 原文用两个词描写请求和恳切求告，却没有明说所求的具体对象或内容。“祈求、恳求”保留二者的并列和语气递进，也避免擅自补入“恩惠”或其他神学化宾语。
- issue: 如何处理 הַרְגִּשׁוּ 所含的集体行动色彩
  choice: 一同赶来
  alternative: 相约而来／喧嚷着聚来
  rationale: 此词可能强调共同策划、聚集或急切喧动。正文采用较宽泛的“一同赶来”，让协同行动的语境清楚可见，同时将更具体的可能义保留在注释中。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“一同赶来”呈现谋划者协同行动及突然到场的语感；“祈求、恳求”保持祷告语言的敬虔语域，并保留原文两个近义分词的并列张力。
