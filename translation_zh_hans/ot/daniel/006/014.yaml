source:
  edition: WLC
  text: בֵּ֠/אדַיִן עֲנ֣וֹ וְ/אָמְרִין֮ קֳדָ֣ם מַלְכָּ/א֒ דִּ֣י דָנִיֵּ֡אל דִּי֩ מִן בְּנֵ֨י גָלוּתָ֜/א דִּ֣י יְה֗וּד לָא שָׂ֨ם עלי/ך מַלְכָּ/א֙ טְעֵ֔ם וְ/עַל אֱסָרָ֖/א דִּ֣י רְשַׁ֑מְתָּ וְ/זִמְנִ֤ין תְּלָתָה֙ בְּ/יוֹמָ֔/א בָּעֵ֖א בָּעוּתֵֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/014.yaml
  text: Then they answered and said before the king[a], “Daniel, who is one of the exiles from Judah, pays no attention to you, O king, or to the injunction that you have signed[c][b], but three times a day he makes his petition.”
translation:
  language: zh_hans
  text: 于是，他们在王面前回答说：“王啊，那从犹大被掳之人中来的但以理不理会你，也不理会你所签署的禁令[a]，却每天三次提出自己的祈求[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “禁令”也可译作“禁制”或“法令”；原词在这里指具有法律约束力的禁令。
    reason: lexical_alternative
  - marker: b
    text: 原文直译近似“他寻求自己的祈求”。这是动词与同源名词构成的表达，指他持续提出祈求；本分句没有明说向谁祈求，但上下文表明是向但以理的上帝。
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: 于是
  rationale: 这是推进叙事的亚兰语标记；“于是”自然地承接前文，并表示随后的行动。
- source_word: עֲנוֹ וְאָמְרִין
  choice: 回答说
  rationale: 保留闪语常见的双动词言说公式，同时符合现代汉语的庄重叙事表达。
- source_word: קֳדָם מַלְכָּא
  choice: 在王面前
  rationale: קֳדָם 表示在某人面前或在其面前陈说，保留了宫廷场景。
- source_word: דִּי מִן בְּנֵי גָלוּתָא דִּי יְהוּד
  choice: 犹大被掳者中的但以理
  rationale: בְּנֵי גָלוּתָא 指被掳群体的成员；此译保留控告者带有贬抑意味的身份标签。
- source_word: לָא שָׂם עֲלַיִךְ ... טְעֵם
  choice: 不把你放在眼里
  rationale: 原文惯用语字面涉及“不把重视或留意放在你身上”；此汉语表达清楚传达“不尊重、不理会”的控告语气。
- source_word: מַלְכָּא
  choice: 王啊
  rationale: 保留原文明确的呼格重复，体现宫廷称呼和控告者对王施加的修辞压力。
- source_word: וְעַל אֱסָרָא דִּי רְשַׁמְתָּ
  choice: 也不理会你签署的禁令
  rationale: אֱסָרָא 在此指具有约束力的法律禁令；רְשַׁמְתָּ 结合上下文译作“签署”，指正式认可成文命令。
- source_word: וְזִמְנִין תְּלָתָה בְּיוֹמָא
  choice: 反而一天三次
  rationale: 原文连接词在控告语境中带出对比；“一天三次”是自然准确的频率表达。
- source_word: בָּעֵא בָּעוּתֵהּ
  choice: 祈求他所求的事
  rationale: 保留同源动词与名词构成的表达，并以“祈求”体现恳求、祷告的语境；不添加原文此分句没有明说的接受者。
theological_decisions:
- issue: 是否明确补出但以理向上帝祈求
  choice: 不补出接受祈求者，只译为“祈求他所求的事”
  alternative: “向他的上帝祷告”或“向上帝祈求”
  rationale: 上下文表明但以理向他的上帝祷告，但本节该分句没有明确写出接受者。保留隐含对象可避免把上下文信息直接增入本句。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“不把你放在眼里”自然传达控告者所说的轻慢之意；“王啊”保留宫廷呼格。“祈求他所求的事”略带原文色彩，以保留受词未明说的特点。
