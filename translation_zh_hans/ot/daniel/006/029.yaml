  text: וְ/דָנִיֵּ֣אל דְּנָ֔ה הַצְלַ֖ח בְּ/מַלְכ֣וּת דָּרְיָ֑וֶשׁ וּ/בְ/מַלְכ֖וּת כּ֥וֹרֶשׁ פרסי/א׃פ
base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/029.yaml
  text: And this Daniel prospered during the reign of Darius and during the reign of Cyrus the Persian[a].
translation:
  language: zh_hans
  text: 这但以理在大流士统治期间，又在波斯人居鲁士统治期间，事事亨通。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在大流士的统治期间，也就是在波斯人居鲁士的统治期间”；若这两个名字被理解为指同一位君王。
    reason: alternative_reading
lexical_decisions:
- source_word: דְּנָה
  choice: 这但以理
  rationale: 指回刚刚提到的但以理，保留亚兰文指示词所带的强调和承接作用；现代汉语中“这但以理”庄重而可懂。
- source_word: הַצְלַח
  choice: 事事亨通
  rationale: 该动词表示顺利、成功或兴盛；“事事亨通”在叙事总结中自然，也不把含义局限为物质富足。
- source_word: בְּמַלְכוּת
  choice: 在……统治期间
  rationale: 原义可指“在……的王国／统治中”，此处主要表达时间范围；“统治期间”清楚传达君王在位的时期。
- source_word: דָּרְיָוֶשׁ
  choice: 大流士
  rationale: 采用现代中文圣经及历史语境中通行的君王译名。
- source_word: וּבְמַלְכוּת
  choice: 又在……统治期间
  rationale: 保留原文重复的介词结构；“又”自然连接两个并列时段，同时不预先判定两名是否指不同君王。
- source_word: כּוֹרֶשׁ
  choice: 居鲁士
  rationale: 采用现代汉语历史著作中通行的波斯君王译名。
- source_word: פרסי
  choice: 波斯人
  rationale: 该族称形容居鲁士的民族或帝国身份；“波斯人居鲁士”直接而自然。
theological_decisions:
- issue: 本节中大流士与居鲁士的关系
  choice: 正文按表面句法并列两个统治期间，不判定两名所指是否为两位君王。
  alternative: 也可能将第二个短语理解为对第一个短语的同位说明，即“大流士的统治，也就是波斯人居鲁士的统治”。
  rationale: 原文使用两个由连词连接的相同介词短语，通常可读为并列，但其历史身份关系并未在本节明确说明；正文保留这一张力，脚注提示可能的同位理解。
translation_notes:
  register: 采用现代、庄重且通俗的叙事语言。“这但以理”保留原文的强调承接；“事事亨通”概括其顺利成功，不限于财富。正文中的[a]与脚注相对应。
