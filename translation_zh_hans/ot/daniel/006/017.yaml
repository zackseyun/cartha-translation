base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/017.yaml
  text: Then the king gave the command[a], and they brought Daniel and threw him into the den of lions. The king answered and said to Daniel, “Your God, whom you continually serve[b], he will deliver you.”
translation:
  language: zh_hans
  text: 于是，王下令，人就把但以理带来，扔进狮子坑里[a]。王对但以理说：“你的上帝——你一向事奉的那一位——他必救你[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“狮子的坑”。也可译作“群狮之坑”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“愿他救你。”这里的亚兰语也可被理解为表达愿望；主文则按较直接的陈述语气译作“他必救你”。
    reason: alternative_reading
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: 那时
  rationale: 这是推进叙事的亚兰语标记；“那时”既自然，也清楚承接前文事件。
- source_word: אֲמַר
  choice: 下令
  rationale: 字面义为“说”，但此处是王发出随即被执行的命令；译作“下令”符合语境中的言语功能。
- source_word: וְהַיְתִיו
  choice: 他们就把……带来
  rationale: 这是“来”的使役形式；在官员执行王命的语境中，“带来”最为自然。
- source_word: וּרְמוֹ
  choice: 扔进
  rationale: 该动词表示投掷、抛入；“扔进”保留动作的力度，不弱化为“放进”。
- source_word: לְגֻבָּא דִּי אַרְיָוָתָא
  choice: 进狮子坑里
  rationale: 原文结构是“进入狮子的坑”；“狮子坑”是现代汉语中简洁自然的表达。
- source_word: עָנֵה ... וְאָמַר
  choice: 开口对……说
  rationale: 这是常见的闪语叙事套语。汉语用“开口……说”可体现引入发言的公式感，又避免生硬直译为“回答并说”。
- source_word: אֱלָהָךְ
  choice: 你的上帝
  rationale: 保留第二人称单数所属形式，直接表达王对但以理所说的“你的上帝”。
- source_word: דִּי אנתה פָּלַח לֵהּ
  choice: 就是你……事奉的那一位
  rationale: פּלח在此指向对神的服事，也含敬拜色彩；“事奉”保留其较宽的语义范围。
- source_word: בִּתְדִירָא
  choice: 恒常
  rationale: 表达持续而稳定的经常性；“恒常”庄重、简洁，符合本句语体。
- source_word: הוּא
  choice: 他
  rationale: 独立代词具有强调作用；用破折号后的“他”保留这一突出效果。
- source_word: יְשֵׁיזְבִנָּךְ
  choice: 必救你
  rationale: 该词表示从危险中搭救、解救；“救你”自然明确，“必”呈现主文所采用的陈述式信心。
theological_decisions:
- issue: 王最后一句话的语气
  choice: 陈述式：“他必救你”
  alternative: 愿望式：“愿他救你”
  rationale: 亚兰语形式可自然理解为未完成式的预言或信心表达，因此主文采用陈述式；但语境也使部分译者将其理解为愿望，故在脚注中保留这种可能，不把王的信心程度解释得过满。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“下令”“扔进”保持动作清晰有力；引语以破折号凸显原文独立代词的强调，同时避免过度古雅或教派化措辞。
