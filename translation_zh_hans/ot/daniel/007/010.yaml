id: DAN.7.10
reference: Daniel 7:10
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: נְהַ֣ר דִּי נ֗וּר נָגֵ֤ד וְ/נָפֵק֙ מִן קֳדָמ֔וֹ/הִי אֶ֤לֶף אלפים יְשַׁמְּשׁוּנֵּ֔/הּ וְ/רִבּ֥וֹ רבון קָֽדָמ֣וֹ/הִי יְקוּמ֑וּן דִּינָ֥/א יְתִ֖ב וְ/סִפְרִ֥ין פְּתִֽיחוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/010.yaml
  text: A river of fire was flowing and coming out from before him[a]; a thousand thousands were serving him, and ten thousand times ten thousand were standing before him. The court sat[c][b], and the books were opened.
translation:
  language: zh_hans
  text: 有一道火河流淌着，从他面前涌出；千千侍奉他，万万侍立在他面前[a]。法庭就座了[b]，书卷也展开了[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文为“千的千侍奉他，万的万侍立在他面前”，是层叠的数量表达；也可译作“千千万万……无数万万”。
    reason: 保留原文数量结构及其可能的非精确、宏大用法。
  - marker: b
    text: 原文直译近于“审判坐下了”，指法庭就座以施行审判。
    reason: 说明亚兰语司法惯用表达与正文自然译法之间的关系。
  - marker: c
    text: “书卷”也可译作“案卷”。
    reason: 原词可指书、卷册或书面记录；审判语境使“案卷”成为可能译法，但原文未限定其具体载体或内容。
lexical_decisions:
- source_word: נְהַר דִּי נוּר
  choice: 一道火河
  rationale: 保留“河”与“火”的鲜明异象意象；“一道”符合现代汉语对河流的量词习惯。
- source_word: נָגֵד וְנָפֵק
  choice: 流淌着……涌出
  rationale: 两个并列分词描绘持续进行的动作；“流淌着”表现延续状态，“涌出”表现向外发出的动态。
- source_word: מִן קֳדָמוֹהִי
  choice: 从他面前
  rationale: 按原文保留空间性表达，并明确所指为宝座上的那一位，不将其抽象化为“从他的同在中”。
- source_word: אֶלֶף אלפים
  choice: 千千
  rationale: 凝练保留原文“千的千”的数量层叠感，在庄重中文中也自然可懂。
- source_word: יְשַׁמְּשׁוּנֵּהּ
  choice: 侍奉他
  rationale: 该动词可指服事或在君王面前供职；“侍奉”兼顾天庭场景与现代可懂性，又不限定为礼仪性事奉。
- source_word: וְרִבּוֹ רבון
  choice: 万万
  rationale: 对应“万的万”，保留数量意象和宏大感，不直接解释为抽象的“无数”。
- source_word: קָדָמוֹהִי יְקוּמוּן
  choice: 侍立在他面前
  rationale: “侍立”既保留“站立”的含义，也自然呈现众多侍从在宝座前等候的宫廷场景。
- source_word: דִּינָא יְתִב
  choice: 审判庭开庭了
  rationale: 原文直译近于“审判坐下”；在此司法语境中是审判机构就座审理的惯用表达。“审判庭开庭”以自然现代汉语传达其功能。
- source_word: וְסִפְרִין פְּתִיחוּ
  choice: 案卷也展开了
  rationale: סִפְרִין 可泛指书、卷册或书面记录；在审判场景中“案卷”自然体现供审理的记录，同时脚注保留“书卷”的形式性译法。
theological_decisions:
- issue: דִּינָא יְתִב 的司法性惯用语
  choice: 审判庭开庭了
  alternative: 直译“审判坐下了”或译“法庭就座了”
  rationale: 所选译法清楚呈现天上审判正式开始的场景，但不进一步判定审判的对象、阶段或教义体系。
- issue: 天上侍从的数量表达
  choice: 千千……万万
  alternative: 千千万万……万万千千，或“一千个一千……一万个一万”
  rationale: 保留原文层叠的数字意象，不把它解释成精确统计，也不直接消解为泛称“无数”。
- issue: סִפְרִין 在审判场景中的所指
  choice: 案卷
  alternative: 书卷
  rationale: “案卷”显明司法语境，但原词本身可泛指书面卷册，故以脚注保留较形式对应的“书卷”，不武断确定其具体内容。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“火河”“千千……万万”保留异象文学的凝练与宏大；“侍立”“审判庭”“案卷”使宫廷和司法场景自然可辨。句中用分号区分火河、侍从与开庭三个画面，并以“了”标示叙事推进。
