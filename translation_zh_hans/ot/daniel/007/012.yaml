source:
  edition: WLC
  text: וּ/שְׁאָר֙ חֵֽיוָתָ֔/א הֶעְדִּ֖יו שָׁלְטָנְ/ה֑וֹן וְ/אַרְכָ֧ה בְ/חַיִּ֛ין יְהִ֥יבַת לְ/ה֖וֹן עַד זְמַ֥ן וְ/עִדָּֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/012.yaml
  text: As for the rest of the beasts[a], their dominion was taken away, but an extension of life was given to them for a time and a season.
translation:
  language: zh_hans
  text: 至于其余的兽，它们的统治权被夺去；但它们的生命得以延续，直到一个时期和一个时节。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “一个时期和一个时节”的具体时长不明。此处也可理解为：它们的生命获延续一段有限的时间。
    reason: 保留亚兰文介词עַד在此可被理解为时间界限或有限时段的含混性，且不把两个近义时间词解释为确定的年代单位。
lexical_decisions:
- source_word: וּשְׁאָר חֵיוָתָא
  choice: 至于其余的兽
  rationale: “至于”自然表达话题转移及与前一只兽的对比；“兽”符合但以理书第7章异象中的象征性形象。
- source_word: הֶעְדִּיו שָׁלְטָנְהוֹן
  choice: 它们的统治权也被夺去
  rationale: 采用被动表达，保留原文未明说执行者的特点；“统治权”兼顾实际统治与权柄之意。“也”承接上一节那只兽所遭遇的审判。
- source_word: וְאַרְכָה בְחַיִּין
  choice: 不过，它们获准延续生命
  rationale: 本句与统治权被夺形成转折；将字面上的“生命中的延长”译成自然汉语“延续生命”，同时保留它们仍可存活的含义。
- source_word: יְהִיבַת לְהוֹן
  choice: 它们获准
  rationale: 原文为“赐给它们”的被动结构；“获准”简洁表达生命延续是被给予的，而不补明给予者。
- source_word: עַד זְמַן וְעִדָּן
  choice: 直到一个时期和一个时节
  rationale: עַד通常表示界限“直到”；分别译出两个近义时间名词，避免将其技术化为特定末世时间单位。
theological_decisions:
- issue: 诸兽失去统治权后仍存活至何时
  choice: 直到一个时期和一个时节
  alternative: 在一段时期内；到所定的时间为止
  rationale: 原文明确使用עַד标示时间界限，但两个时间名词的具体长度并未说明。正文保留“直到”的界限意义和两个词的并列表达，不把它解释为某套特定的末世年代计算。
translation_notes:
  register: 采用现代、庄重而易懂的书面语。“统治权”适合异象中的政治权力语境；“延续生命”比逐字译作“生命得以延长”更自然。脚注标记置于其所说明的时间短语之后。
