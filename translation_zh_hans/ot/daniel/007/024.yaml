revisions:
- from: 至于那十个角：从这国中必兴起十个王；在他们之后，还必兴起另一个王。他将与先前的王不同[a]，并要使三个王降卑[b]。
  to: 至于那十个角：从这国中必兴起十个王；在他们之后，还必兴起另一个王。他将不同于先前的王[a]，并要使三个王降卑[b]。
  rationale: 修订仅改善“不同于”的汉语语序，并校正脚注a可能造成的语义偏移；脚注b改用不额外限定政治手段的等值表达。正文仍保留原文对该王之差异及三王所受处置的开放性。
