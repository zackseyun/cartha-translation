base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/024.yaml
  text: As for the ten horns[a], out of this kingdom ten kings will arise; and another will arise after them. He will be different from the former ones[b], and he will humble three kings.
translation:
  language: zh_hans
  text: 至于那十个角：从这国中必兴起十个王；在他们之后，还必兴起另一个王。他将不同于先前的王[a]，并要使三个王降卑[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他将有别于先前的王。”
    reason: 原词在此通常表示“不同、相异”；替代译法仅调整汉语表达，不把意思转为该王自身发生改变。
  - marker: b
    text: 或译：“使三个王卑微。”
    reason: 原文为“使之低下”的使役表达；此译法保留其贬低、降低的隐喻，避免将行动具体化为征服或废黜。
lexical_decisions:
- source_word: קַרְנַיָּא עֲשַׂר
  choice: 那十个角
  rationale: 保留异象中的“角”这一象征，不预先解释；本节随后明确说明它们所代表的是王。
- source_word: מִנַּהּ מַלְכוּתָה
  choice: 从这国中
  rationale: 阴性代词后缀回指异象中的国；译为“这国”既符合上下文，也自然表达诸王由其中兴起。
- source_word: עַשְׂרָה מַלְכִין יְקֻמוּן
  choice: 必兴起十个王
  rationale: קום在统治者语境中指掌权者兴起；“必兴起”兼顾预言语气和现代汉语表达。
- source_word: וְאָחֳרָן יְקוּם אַחֲרֵיהוֹן
  choice: 在他们之后，还必兴起另一个王
  rationale: “另一个”在上下文中所指为王，故补出“王”以使汉语清楚；同时保留时间先后和与前句相应的“兴起”。
- source_word: יִשְׁנֵא מִן קַדְמָיֵא
  choice: 他将与先前的王不同
  rationale: 此处动词按上下文表示有所不同、相异；不进一步说明其差异的性质，以免加入经文没有明说的解释。
- source_word: וּתְלָתָה מַלְכִין יְהַשְׁפִּל
  choice: 并要使三个王降卑
  rationale: שׁפל的使役形表达“使之低下、降卑”。这一译法保留原文的高低隐喻，不武断限定其政治手段或最终结局。
theological_decisions:
- issue: 后来兴起之王与先前诸王有何区别
  choice: 他将与先前的王不同
  alternative: 他将改变，有别于先前的王
  rationale: 原文肯定其差异，却没有说明差异的具体性质或人物身份；正文保留这一开放性，不引入特定末世解释体系。
- issue: 三个王所受处置的性质
  choice: 使三个王降卑
  alternative: 压倒三个王／使三个王败落
  rationale: 原文以“使低下”描述其行动。正文保留该隐喻，不直接译成杀死、废黜或征服，以免把可能的政治含义收窄为某一种结果。
translation_notes:
  register: 采用现代、庄重而易懂的预言叙事语体。“至于”标示句首主题，“必兴起”体现预言语气；保留“角”“降卑”等异象性和隐喻性表达，同时借脚注呈现重要词义空间。
