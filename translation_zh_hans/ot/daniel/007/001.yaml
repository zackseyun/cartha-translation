  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: בִּ/שְׁנַ֣ת חֲדָ֗ה לְ/בֵלְאשַׁצַּר֙ מֶ֣לֶךְ בָּבֶ֔ל דָּנִיֵּאל֙ חֵ֣לֶם חֲזָ֔ה וְ/חֶזְוֵ֥י רֵאשֵׁ֖/הּ עַֽל מִשְׁכְּבֵ֑/הּ בֵּ/אדַ֨יִן֙ חֶלְמָ֣/א כְתַ֔ב רֵ֥אשׁ מִלִּ֖ין אֲמַֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/001.yaml
  text: In the first year of Belshazzar king of Babylon[a], Daniel saw a dream and visions in his head while on his bed. Then he wrote down the dream—the summary of the words he told.
translation:
  language: zh_hans
  text: 巴比伦王伯沙撒元年，丹以理在床上做了一个梦，脑海中看见异象。随后，他把这梦写下来，述说了其中的要点。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “其中的要点”直译为“话语的头”。这句也可译作：“他把这梦写下来，说出了事情的概要。”
    reason: 保留亚兰文 רֵאשׁ מִלִּין 这一习语的字面意象及其可理解为主要内容或概要的歧义。
lexical_decisions:
- source_word: בִּשְׁנַת חֲדָה לְבֵלְאשַׁצַּר
  choice: 巴比伦王伯沙撒元年
  rationale: 这是亚兰文纪年惯用语；用“元年”自然、简洁地表达“第一年”，并将王号与人名合并为符合现代汉语的结构。
- source_word: חֵלֶם חֲזָה
  choice: 做了一个梦
  rationale: 原文直译为“看见一个梦”，但现代汉语通常说“做梦”；下文“看见异象”仍保留了视觉与启示性质，避免全句生硬。
- source_word: וְחֶזְוֵי רֵאשֵׁהּ
  choice: 脑海中看见异象
  rationale: 原文为“他头脑的异象”。“脑海中”自然表达内在视觉经验，同时不将其简化为一般思想或想象。
- source_word: עַל מִשְׁכְּבֵהּ
  choice: 在床上
  rationale: 直接保留梦发生时的地点背景，不增添原文未明说的动作。
- source_word: בֵּאדַיִן
  choice: 随后
  rationale: 作为叙事推进词，表达紧接前事发生的动作，比机械的“那时”更符合现代汉语。
- source_word: חֶלְמָא כְתַב
  choice: 把这梦写下来
  rationale: 忠实表达“写这梦”，并以“写下来”自然体现记录之意。
- source_word: רֵאשׁ מִלִּין אֲמַר
  choice: 述说了其中的要点
  rationale: 字面为“说了话语的头（首要部分）”。“要点”保留其可能指主要内容或概要的含义；“述说”对应 אֲמַר，并避免把句法关系处理成含混的“所说之话的摘要”。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“元年”符合中文历史纪年习惯；“脑海中看见异象”兼顾原文措辞与自然表达。脚注标记置于相关句末，正文与脚注相互对应。
