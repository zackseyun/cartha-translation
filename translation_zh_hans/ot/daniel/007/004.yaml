id: DAN.7.4
reference: Daniel 7:4
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: קַדְמָיְתָ֣/א כְ/אַרְיֵ֔ה וְ/גַפִּ֥ין דִּֽי נְשַׁ֖ר לַ֑/הּ חָזֵ֣ה הֲוֵ֡ית עַד֩ דִּי מְּרִ֨יטוּ גַפַּ֜י/הּ וּ/נְטִ֣ילַת מִן אַרְעָ֗/א וְ/עַל רַגְלַ֨יִן֙ כֶּ/אֱנָ֣שׁ הֳקִימַ֔ת וּ/לְבַ֥ב אֱנָ֖שׁ יְהִ֥יב לַֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/004.yaml
  text: The first was like a lion[a], and it had the wings of an eagle. I kept watching until its wings were plucked off, and it was lifted up from the earth and made to stand on two feet like a man[c][b], and a human heart was given to it.
translation:
  language: zh_hans
  text: 第一只兽像狮子，有鹰的翅膀。我一直观看，直到它的翅膀被拔掉[a]；它被从地上抬起，又被立起来，像人一样用两脚站立[b]，又有一颗人的心赐给它[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“被扯掉”或“被剥去”。
    reason: lexical_alternative
  - marker: b
    text: 直译：“被使站立在脚上，像人一样。”
    reason: lexical_alternative
  - marker: c
    text: 或译：“人的心被赐给它。”这里的“心”也可指人的内在心智或性情。
    reason: lexical_alternative
lexical_decisions:
- source_word: קַדְמָיְתָא
  choice: 第一只兽
  rationale: 阴性序数词指上一节所述四只巨兽中的第一只；补出“兽”使中文指代清楚自然。
- source_word: כְאַרְיֵה
  choice: 像狮子
  rationale: 前缀 כְ 表示比较而非同一，故保留异象中的明喻。
- source_word: וְגַפִּין דִּי נְשַׁר לַהּ
  choice: 有鹰的翅膀
  rationale: 原文是表达领属的结构，直译近于“鹰的翅膀属于它”；现代汉语用“有”最自然。
- source_word: חָזֵה הֲוֵית
  choice: 我一直观看
  rationale: 分词与助动词组合表达过去持续进行的动作，“一直观看”体现其延续性。
- source_word: עַד דִּי
  choice: 直到
  rationale: 作为时间连接语，引出观看过程中达到的节点。
- source_word: מְּרִיטוּ גַפַּיהּ
  choice: 它的翅膀被拔掉
  rationale: 动词表示拔去、扯去；“拔掉”保留动作的强烈和具体形象，其他可能译法列入脚注。
- source_word: וּנְטִילַת מִן אַרְעָא
  choice: 它从地上被抬起来
  rationale: 保留被动语态及离开地面的动作，不预断隐含施事者。
- source_word: וְעַל רַגְלַיִן כֶּאֱנָשׁ הֳקִימַת
  choice: 像人一样用两脚站立
  rationale: 使役被动形式表示它被置于站立状态；“两脚”体现 רַגְלַיִן 的双数形式，并以自然中文表达直立的人形姿态。
- source_word: וּלְבַב אֱנָשׁ יְהִיב לַהּ
  choice: 又有一颗人的心赐给了它
  rationale: 保留“人的心”这一具体而开放的意象，不将其解释性地窄化为理智、性情或意识。
theological_decisions:
- issue: 兽获得人的形态与内在特征的措辞
  choice: 译作“像人一样用两脚站立”及“一颗人的心”
  alternative: “像一个男人一样站立”及“人性之心／人的理智”
  rationale: אֱנָשׁ 在两处强调人类与兽类的对照，并非突出男性性别；同时“心”的意义在异象中具有解释空间，因此保留原有身体与内在意象，不指定其象征含义。
- issue: 被动动作的施事者
  choice: 保留“被拔掉”“被抬起来”“赐给了它”等被动或无主表达
  alternative: 明确译为“有人拔掉……把它抬起……赐给它”或直接指定上帝为施事者
  rationale: 原文没有明说这些动作的施事者；译文不作神学性补足，以保存叙述的含蓄。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。以“第一只兽”承接上下文；保留异象叙事的持续观看、被动动作及“人的心”这一未被解释定型的意象。所有脚注标记均置于对应正文之后。
