id: DAN.7.8
reference: Daniel 7:8
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: מִשְׂתַּכַּ֨ל הֲוֵ֜ית בְּ/קַרְנַיָּ֗/א וַ֠/אֲלוּ קֶ֣רֶן אָחֳרִ֤י זְעֵירָה֙ סִלְקָ֣ת ביני/הון וּ/תְלָ֗ת מִן קַרְנַיָּ/א֙ קַדְמָ֣יָתָ֔/א אתעקרו מִן קדמי/ה וַ/אֲל֨וּ עַיְנִ֜ין כְּ/עַיְנֵ֤י אֲנָשָׁ/א֙ בְּ/קַרְנָ/א דָ֔א וּ/פֻ֖ם מְמַלִּ֥ל רַבְרְבָֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/008.yaml
  text: I was considering the horns[a], and behold, another horn, a little one, came up among them, and three of the first horns were uprooted before it. And behold, in this horn were eyes like the eyes of a man[b], and a mouth speaking great things.
translation:
  language: zh_hans
  text: 我正仔细察看[a]那些角，看哪，另有一只小角在它们中间长起来；先前的角中有三只在它面前被连根拔除。看哪，这只角上有一双眼睛，像人的眼睛[b]，还有一张口，说着大事[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “仔细察看”也可译作“不断观看”。
    reason: 原文分词与系词强调过去持续的观看，动词也可侧重观察而非思量。
  - marker: b
    text: 或译：“有像人的眼睛一样的眼睛”。
    reason: 此译法较逐字保留原文重复出现“眼睛”的明喻结构。
  - marker: c
    text: 或译：“说夸大的话”或“夸口说大话”。
    reason: 原文直译为“说着大事”；在语境中也可指夸大、狂傲的话语。
lexical_decisions:
- source_word: מִשְׂתַּכַּל הֲוֵית
  choice: 我正仔细察看
  rationale: 分词与系词构成过去进行表达，描写但以理在异象中持续而专注地观察；“仔细察看”兼顾进行性和审视意味。
- source_word: בְּקַרְנַיָּא
  choice: 那些角
  rationale: 亚兰文为限定复数，指向上下文中已经出现的角；现代汉语用“那些角”自然体现其特指性。
- source_word: וַאֲלוּ
  choice: 看哪
  rationale: 该话语标记引出异象中的突变并加强现场感；“看哪”保留庄重的启示文学语体。
- source_word: קֶרֶן אָחֳרִי זְעֵירָה
  choice: 另有一只小角
  rationale: 同时表达“另一只”和“小”的含义，以自然汉语重组，不把“小角”预先处理成超出本节的专门术语。
- source_word: סִלְקָת ביניהון
  choice: 从它们中间长起来
  rationale: 动词表示上升或出现；用于角的异象时，“长起来”符合意象，“从它们中间”准确表达其位置关系。
- source_word: וּתְלָת מִן קַרְנַיָּא קַדְמָיָתָא
  choice: 先前的角中有三只
  rationale: קַדְמָיָתָא 指在先、先前的角；此译法保持顺序关系，并符合汉语量词习惯。
- source_word: אתעקרו
  choice: 被连根拔除
  rationale: 该形式表达遭到拔起；“连根拔除”清楚保留原词的猛烈、彻底移除意象。
- source_word: מִן קֳדָמֵיהּ
  choice: 在它面前
  rationale: 保留空间或临在关系，不进一步断定是因它而被拔除，避免消解原文可能保有的语义余地。
- source_word: עַיְנִין כְּעַיְנֵי אֲנָשָׁא
  choice: 像人眼一样的眼睛
  rationale: 保留原文明确的比较结构，并以简洁自然的现代汉语表达；“人的眼睛”列入脚注作为较形式对应的译法。
- source_word: בְּקַרְנָא דָא
  choice: 这只角上有
  rationale: 原文介词为“在这角中/上”；按视觉意象译为“角上有”，比单纯说“角拥有”更具体自然。
- source_word: וּפֻם מְמַלִּל רַבְרְבָן
  choice: 还有一张说大话的口
  rationale: רַבְרְבָן 字面与“大”相关，在语境中可指夸大的、狂傲的话；汉语“说大话”既保留“大”的措辞，也自然传达其负面语用色彩。
theological_decisions:
- issue: רַבְרְבָן 是否应明确译成狂傲或亵渎性的言语
  choice: 说大话
  alternative: 说狂傲的话；夸口说大事
  rationale: “说大话”保留原文“大话/大事”的表达，同时在现代汉语中自然带出夸张自大的意味；不直接译作“亵渎”，以免加入本节没有明说的神学判断。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“看哪”保留启示文学的突显语气；“连根拔除”延续角被当作可生长之物的异象意象。两个脚注标记均置于与其内容对应的正文位置。
