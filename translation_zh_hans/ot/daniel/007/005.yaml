  text: וַ/אֲר֣וּ חֵיוָה֩ אָחֳרִ֨י תִנְיָנָ֜ה דָּמְיָ֣ה לְ/דֹ֗ב וְ/לִ/שְׂטַר חַד֙ הֳקִמַ֔ת וּ/תְלָ֥ת עִלְעִ֛ין בְּ/פֻמַּ֖/הּ בֵּ֣ין שני/ה וְ/כֵן֙ אָמְרִ֣ין לַ֔/הּ ק֥וּמִֽי אֲכֻ֖לִי בְּשַׂ֥ר שַׂגִּֽיא־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/005.yaml
  text: 'And look[a], another beast, a second one, resembling a bear; it was raised up on one side, and three ribs were in its mouth between its teeth. And this is what they were saying to it: “Arise[b], eat much flesh.”'
translation:
  language: zh_hans
  text: 看哪，又有一只兽，是第二只，样子像熊；它的一侧被抬高[b]，口中牙齿之间有三根肋骨[a]。他们对它说：“起来，吃许多肉！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “肋骨”或可译作“獠牙”；不过“在牙齿之间”的说法更支持“肋骨”。
    reason: lexical_alternative
  - marker: b
    text: “它的一侧被抬高”也可理解为“它的一边被抬高”，着重描写这兽高低不平的姿态。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲרוּ
  choice: 看哪
  rationale: 这是亚兰文异象叙事中引出新景象的提示语；“看哪”保留其鲜明、庄重的指示作用。
- source_word: חֵיוָה
  choice: 兽
  rationale: 本章所指是具有象征意义、带威胁性的异象之兽；“兽”比“动物”更切合语境。
- source_word: אָחֳרִי תִנְיָנָה
  choice: 又有一只兽，是第二只
  rationale: 同时保留“另一只”和“第二只”两层信息，表达其区别与次序。
- source_word: דָּמְיָה לְדֹב
  choice: 样子像熊
  rationale: 自然表达分词所表示的相似关系，并未把异象中的兽直接等同于熊。
- source_word: וְלִשְׂטַר חַד הֳקִמַת
  choice: 它一边被抬高
  rationale: 保留动词的被动意义和姿态不均衡的图像；“一边”也容许理解为一侧或一边身体。
- source_word: וּתְלָת עִלְעִין
  choice: 三根肋骨
  rationale: עִלְעִין通常理解为“肋骨”，且与其位于牙齿之间的描写吻合；另见脚注所列少数释义。
- source_word: בְּפֻמַּהּ בֵּין שניּה
  choice: 口中牙齿之间衔着
  rationale: “口中牙齿之间”保留两个位置短语；“衔着”用自然汉语呈现这些东西处于兽口中的静态画面。
- source_word: וְכֵן אָמְרִין לַהּ
  choice: 有声音对它说
  rationale: 原文使用未说明主语的复数动词；汉语以不确定来源的“有声音”自然表达，不擅自认定说话者身份。
- source_word: קוּמִי
  choice: 起来
  rationale: 准确传达对这只阴性名词所指之兽发出的命令，并符合现代庄重汉语。
- source_word: אֲכֻלִי בְּשַׂר שַׂגִּיא
  choice: 吃许多肉
  rationale: 贴近原文普通动词“吃”和数量词“许多”，不强化为原文并未明确使用的“吞噬”。
theological_decisions:
- issue: 未说明发令者的身份
  choice: 用“有声音对它说”，不指明具体主体
  alternative: “他们对它说”
  rationale: 亚兰文动词为复数，但主语未明；译文避免把说话者确定为天使、神或其他群体，同时以自然汉语保留不确定性。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。句式保留异象叙事的鲜明节奏；不用古奥的“尔等”式语言，也不加入对兽所象征帝国的解释。脚注标记均置于正文相关内容之后。
