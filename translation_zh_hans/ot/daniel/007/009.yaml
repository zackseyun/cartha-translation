id: DAN.7.9
reference: Daniel 7:9
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: חָזֵ֣ה הֲוֵ֗ית עַ֣ד דִּ֤י כָרְסָוָן֙ רְמִ֔יו וְ/עַתִּ֥יק יוֹמִ֖ין יְתִ֑ב לְבוּשֵׁ֣/הּ כִּ/תְלַ֣ג חִוָּ֗ר וּ/שְׂעַ֤ר רֵאשֵׁ/הּ֙ כַּ/עֲמַ֣ר נְקֵ֔א כָּרְסְיֵ/הּ֙ שְׁבִיבִ֣ין דִּי נ֔וּר גַּלְגִּלּ֖וֹ/הִי נ֥וּר דָּלִֽק׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/009.yaml
  text: I kept watching until thrones were set in place[a], and the Ancient of Days took his seat. His clothing was white as snow, and the hair of his head was like pure wool. His throne was flames of fire[b]; its wheels were a burning fire.
translation:
  language: zh_hans
  text: 我一直观看，直到众宝座被安设[a]，亘古常在者[b]坐下。他的衣服洁白如雪，头发如纯净的羊毛；他的宝座是火焰，宝座的轮子是熊熊烈火。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“众宝座被放置”。此处也有人按该动词在其他语境中的意义译作“众宝座被推倒”，但紧接着描写的是天上法庭设立并开庭的场景，因此“被安设”更合乎上下文。
    reason: alternative_reading
  - marker: b
    text: 亚兰文直译为“年日久远者”，是一个强调其悠久年日与永恒威严的称号。
    reason: cultural_note
lexical_decisions:
- source_word: חָזֵה הֲוֵית
  choice: 我一直观看
  rationale: 分词与助动词的组合表示过去持续进行的动作；“一直观看”自然地传达但以理持续注视异象。
- source_word: עַד דִּי
  choice: 直到
  rationale: 该短语标明持续观看所达到的时间点。
- source_word: כָרְסָוָן
  choice: 众宝座
  rationale: 原文为复数，指君王或审判者的宝座；“众”既保留复数，也不擅自规定具体数目。
- source_word: רְמִיו
  choice: 被安设
  rationale: 在天上法庭即将开庭的语境中，此动词宜理解为把宝座安放就位；同时以脚注保留“被推倒”的传统理解。
- source_word: וְעַתִּיק יוֹמִין
  choice: 亘古常在者
  rationale: 这是中文圣经语境中庄重而易于辨认的称号，表达原文所强调的久远年日与永恒威严；脚注补充较直译的含义。
- source_word: יְתִב
  choice: 坐下
  rationale: 直接表达就座之意，在审判与登座的场景中简洁自然。
- source_word: לְבוּשֵׁהּ כִּתְלַג חִוָּר
  choice: 他的衣服洁白如雪
  rationale: 保留雪白的明喻，并采用现代汉语自然表达。
- source_word: וּשְׂעַר רֵאשֵׁהּ כַּעֲמַר נְקֵא
  choice: 头发如纯净的羊毛
  rationale: נְקֵא侧重洁净、纯净；译作“纯净”避免把原词直接收窄为颜色，同时与上句的洁白意象呼应。
- source_word: כָּרְסְיֵהּ שְׁבִיבִין דִּי נוּר
  choice: 他的宝座是火焰
  rationale: 保留原文直接而强烈的隐喻；שְׁבִיבִין在此可指火焰或火星，语境中“火焰”较为自然。
- source_word: גַּלְגִּלּוֹהִי נוּר דָּלִק
  choice: 宝座的轮子是熊熊烈火
  rationale: 后缀在意象中指向宝座；明确译作“宝座的轮子”可避免中文误解为人物本身的轮子，并保留烈火燃烧的动态感。
theological_decisions:
- issue: עַתִּיק יוֹמִין作为神圣称号的译法
  choice: 亘古常在者
  alternative: 年日久远者；亘古者
  rationale: “亘古常在者”以庄重、通顺的现代中文呈现这一称号，不把异象中的身份与神学含义进一步解释死；脚注说明原文的字面构成，以保留其独特意象。
- issue: 多个宝座的用途与坐席者
  choice: 只译“众宝座”，不说明其余宝座属于谁
  alternative: 审判者的宝座；天庭众成员的座位
  rationale: 本节没有明说其他宝座由谁使用；译文保留复数及天上法庭的张力，不把后文或特定解释直接写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“我一直观看”保留异象持续展开的感觉；火焰与轮子的描写尽量维持原文直接、震撼的诗性意象。脚注标记均置于相关词语之后。
