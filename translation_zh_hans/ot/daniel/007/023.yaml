base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/023.yaml
  text: 'Thus he said: ‘The fourth beast will be a fourth kingdom on the earth[a], which will be different from all the kingdoms[b]; and it will devour the whole earth and trample it down and crush it.’'
translation:
  language: zh_hans
  text: 他这样说：“第四兽将是地上的第四个国；这国与所有别国不同。它必吞吃全地，践踏并粉碎全地。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֵּן אֲמַר
  choice: 他这样说
  rationale: 自然地引出随后对异象的解释，并按上下文补出阳性单数主语“他”。
- source_word: חֵיוְתָא רְבִיעָיְתָא
  choice: 第四兽
  rationale: “兽”准确保留但以理书异象中该生物凶猛而不祥的启示文学色彩。
- source_word: מַלְכוּ רביעיא
  choice: 第四个国
  rationale: 此处经文本身把兽解释为政治性的国度；“第四个国”在现代汉语中自然，也保留序数含义。
- source_word: בְאַרְעָא
  choice: 地上的
  rationale: 本章具有广阔的帝国与世界性视野，因此译作“地上”比局部性的“那地”更合适；其句法归属仍有一定歧义，另见脚注。
- source_word: דִּי תִשְׁנֵא מִן כָּל מַלְכְוָתָא
  choice: 它与其他各国都不同
  rationale: 动词表达区别、迥异；“其他各国”明确比较对象，同时避免汉语“与所有国不同”可能把本国也包括在内的不自然表达。
- source_word: וְתֵאכֻל כָּל אַרְעָא
  choice: 它要吞吃全地
  rationale: “吞吃”保留兽类意象及暴烈力量；“全地”反映 כָּל אַרְעָא 的广泛范围。
- source_word: וּתְדוּשִׁנַּהּ
  choice: 把地践踏
  rationale: 准确表达踩踏、蹂躏之意，并在汉语中自然承接“全地”。
- source_word: וְתַדְּקִנַּהּ
  choice: 压碎
  rationale: 简洁有力地表达彻底粉碎的结果；“击碎”也是可能译法。
theological_decisions:
- issue: 第四兽的所指
  choice: 译为“第四兽就是……第四个国”
  alternative: 仅将兽与国并列而弱化其解释关系
  rationale: 亚兰文本身在天使的解释中明确把第四兽认定为一个国，因此应保留这种解释性等同，而不额外指定任何历史帝国。
- issue: “地上的”在句中的归属
  choice: 将其修饰“第四个国”
  alternative: 将其连同后面的关系句理解为“地上将有第四个国，它将与其他各国不同”或“它在地上将与各国不同”
  rationale: 词序最直接支持“地上的第四个国”，但亚兰语句法允许不同的切分，故用脚注保存歧义。
translation_notes:
  register: 采用庄重、清楚的现代标准普通话。“吞吃—践踏—压碎”保留原文逐步加强的毁灭性动作链；不把“第四个国”具体认定为任何历史政权。
