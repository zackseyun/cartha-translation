  text: עָנֵ֤ה דָנִיֵּאל֙ וְ/אָמַ֔ר חָזֵ֥ה הֲוֵ֛ית בְּ/חֶזְוִ֖/י עִם לֵֽילְיָ֑/א וַ/אֲר֗וּ אַרְבַּע֙ רוּחֵ֣י שְׁמַיָּ֔/א מְגִיחָ֖ן לְ/יַמָּ֥/א רַבָּֽ/א־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/002.yaml
  text: Daniel answered and said[a], “I was seeing in my vision by night, and behold, the four winds of heaven were stirring up the great sea.”
translation:
  language: zh_hans
  text: 但以理回答说[a]：“我在夜间的异象中观看，看哪，天上的四风正在搅动大海。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “回答说”原文直译如此；这里未记载先前有人提问，这是亚兰文中引出话语的惯用表达。另，“天上的四风”也可译作“天上的四灵”；亚兰文同一个词可指“风”或“灵”。
    reason: 说明原文叙事套语，并保留“风／灵”的词义歧义。
lexical_decisions:
- source_word: עָנֵה ... וְאָמַר
  choice: 开口说
  rationale: 这是亚兰文引出话语的叙事套语；直译“回答说”容易使现代读者误以为前文有人提问。“开口说”自然地保留正式的引语导入功能，脚注说明其字面形式。
- source_word: חָזֵה הֲוֵית
  choice: 我……观看
  rationale: 分词配合助动词表示过去持续进行的动作；“观看”比简单的“看见了”更能体现异象持续展开的过程。
- source_word: בְּחֶזְוִי עִם לֵילְיָא
  choice: 在夜间的异象中
  rationale: 准确表达第一人称所属的单数“我的异象”所处的夜间场景；汉语中由“我”与“异象中”已可自然体现这是但以理所见的异象。
- source_word: וַאֲרוּ
  choice: 看哪
  rationale: 保留引人注意的语篇标记及启示文学的鲜明、庄重语气。
- source_word: אַרְבַּע רוּחֵי שְׁמַיָּא
  choice: 天上的四风
  rationale: רוּחַ 可指“风”或“灵”；在搅动大海的直接图景中，“风”更自然，同时在脚注中保留“灵”的可能。
- source_word: מְגִיחָן
  choice: 正搅动
  rationale: 分词表示持续动作；“搅动”清楚呈现四风使海水动荡的效果，同时不将其过度具体化为某一种冲击方式。
- source_word: לְיַמָּא רַבָּא
  choice: 大海
  rationale: 直接而自然地表达“大／伟大的海”，并保留它作为广阔水域及可能固定称谓的意味。
theological_decisions:
- issue: 启示异象中 רוּחֵי 的含义
  choice: 正文译作“风”
  alternative: “灵”
  rationale: 四者搅动大海的图景首先支持“风”；但该词本身也可指“灵”，且启示文学具有象征张力，因此不作教义化排除，在脚注中保留另一读法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以“观看”“看哪”保留异象叙事的持续感和启示文学语气；避免生硬照搬“回答说”，但用脚注交代原文形式。
