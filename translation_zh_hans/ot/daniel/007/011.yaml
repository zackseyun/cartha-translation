id: DAN.7.11
reference: Daniel 7:11
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: חָזֵ֣ה הֲוֵ֔ית בֵּ/אדַ֗יִן מִן קָל֙ מִלַּיָּ֣/א רַבְרְבָתָ֔/א דִּ֥י קַרְנָ֖/א מְמַלֱּלָ֑ה חָזֵ֣ה הֲוֵ֡ית עַד֩ דִּ֨י קְטִילַ֤ת חֵֽיוְתָ/א֙ וְ/הוּבַ֣ד גִּשְׁמַ֔/הּ וִ/יהִיבַ֖ת לִ/יקֵדַ֥ת אֶשָּֽׁא־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/011.yaml
  text: I kept watching then because of the sound of the great words that the horn was speaking. I kept watching until the beast was killed[a], and its body was destroyed and given over to the burning fire.
translation:
  language: zh_hans
  text: 那时，我因那角所说大话[a]的声音，继续观看。我一直观看，直到那兽被杀，它的身体被毁，交给烈火焚烧。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“夸耀的话”或“狂妄的话”；原文直译为“大的话”。
    reason: 保留 מִלַּיָּא רַבְרְבָתָא 的字面意义及其在上下文中可能具有的夸耀、狂妄意味。
lexical_decisions:
- source_word: חָזֵה הֲוֵית
  choice: 继续观看／一直观看
  rationale: 分词与助动词构成持续过去时态；按上下文分别译作“继续观看”和“一直观看”，自然表达但以理持续注视异象。
- source_word: בֵּאדַיִן
  choice: 那时
  rationale: 这是推进异象叙事的时间副词；“那时”简洁且庄重。
- source_word: מִן קָל
  choice: 因……之声
  rationale: 此处 מִן 表示原因或缘由，而 קָל 指可听见的声音；合译为“因……之声”既保留语义，也符合汉语表达。
- source_word: מִלַּיָּא רַבְרְבָתָא
  choice: 大话
  rationale: 字面为“大言语／大话”。“大话”既接近原词形式，也能在现代汉语中暗示夸耀、狂妄的语气，但不直接加上“亵渎”等解释。
- source_word: קַרְנָא
  choice: 那角
  rationale: 保留异象中的象征意象，不在译文中将其解释为具体人物、政权或国度。
- source_word: מְמַלֱּלָה
  choice: 所说的
  rationale: 分词表达正在进行的说话动作；嵌入汉语定语结构后译作“所说的”，语义清楚自然。
- source_word: עַד דִּי
  choice: 直到
  rationale: 准确标明持续观看的终点。
- source_word: קְטִילַת חֵיוְתָא
  choice: 那兽被杀
  rationale: 保留被动意义和异象中的“兽”这一象征，不抽象解释其所代表的对象。
- source_word: וְהוּבַד גִּשְׁמַהּ
  choice: 尸身被毁
  rationale: גִּשְׁמַהּ 本义为“它的身体”；兽已经被杀，汉语用“尸身”能自然呈现此时的身体状态，而“被毁”直接表达 וְהוּבַד 的毁灭含义。
- source_word: וִיהִיבַת לִיקֵדַת אֶשָּׁא
  choice: 交给烈火焚烧
  rationale: 保留被交付以及火焚烧的审判图景；这一表达比逐字译作“交给火的燃烧”更自然。
theological_decisions:
- issue: 是否在正文中把“大的言语”明确解释为狂妄、夸耀或亵渎的话
  choice: 正文译作“大话”，脚注说明也可理解为“夸耀的话”或“狂妄的话”
  alternative: 直接译作“狂妄的话”“夸耀的话”或“亵渎的话”
  rationale: 上下文确有狂妄夸耀之意，但原文只直称“大”的言语。“大话”在汉语中兼顾字面形式与语用暗示，脚注则保存更明确的理解，不把“亵渎”这一较强解释直接写入正文。
- issue: 是否把兽受审判的异象解释为某个国度或政权被毁灭
  choice: 保留“角”“兽”“尸身”和烈火焚烧的异象用语
  alternative: 译成某国、某政权或某统治者被彻底审判
  rationale: 本节以异象符号叙事；直接保留这些符号，避免在翻译中预先决定其历史或末世指涉。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。重复“观看”以保留原文两次 חָזֵה הֲוֵית 的异象叙事节奏；保留“角”和“兽”的象征性，不作解释性替换。
