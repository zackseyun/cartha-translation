reference: Daniel 7:7
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: בָּאתַ֣ר דְּנָה֩ חָזֵ֨ה הֲוֵ֜ית בְּ/חֶזְוֵ֣י לֵֽילְיָ֗/א וַ/אֲר֣וּ חֵיוָ֣ה רביעיה דְּחִילָה֩ וְ/אֵֽימְתָנִ֨י וְ/תַקִּיפָ֜א יַתִּ֗ירָא וְ/שִׁנַּ֨יִן דִּֽי פַרְזֶ֥ל לַ/הּ֙ רַבְרְבָ֔ן אָֽכְלָ֣ה וּ/מַדֱּקָ֔ה וּ/שְׁאָרָ֖/א ב/רגלי/ה רָפְסָ֑ה וְ/הִ֣יא מְשַׁנְּיָ֗ה מִן כָּל חֵֽיוָתָ/א֙ דִּ֣י קָֽדָמַ֔י/הּ וְ/קַרְנַ֥יִן עֲשַׂ֖ר לַֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/007.yaml
  text: After this I kept looking in the visions of the night[a], and behold, a fourth beast, terrifying and dreadful and exceedingly strong. It had large iron teeth; it devoured and crushed, and it trampled the remainder with its feet. It was different from all the beasts that were before it[b], and it had ten horns.
translation:
  language: zh_hans
  text: 此后，我在夜间的异象中继续观看；看哪，第四兽可怕、骇人，且极其强壮。它有巨大的铁牙；它吞吃、粉碎，又用脚践踏其余的。它与先前所有的兽都不同，并且有十只角。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּאתַר דְּנָה
  choice: 此后
  rationale: 自然表达时间上的承接，保留异象场景推进的次序。
- source_word: חָזֵה הֲוֵית
  choice: 我……继续观看
  rationale: 分词与助动词的组合表示过去持续进行的动作；“继续观看”体现其延续性。
- source_word: בְּחֶזְוֵי לֵילְיָא
  choice: 在夜间的异象中
  rationale: 忠实表达夜间异象的场景，同时符合现代汉语习惯。
- source_word: וַאֲרוּ
  choice: 看哪
  rationale: 保留指示语带来的突现感和异象叙述的庄重语气。
- source_word: חֵיוָה רביעיה
  choice: 第四只兽
  rationale: 上下文是象征性的兽；不在译文中预先指定其所代表的政权。
- source_word: דְּחִילָה וְאֵימְתָנִי
  choice: 既可怕又骇人
  rationale: 保留两个近义形容词的叠加强调，而不将其合并削弱。
- source_word: וְתַקִּיפָא יַתִּירָא
  choice: 而且极其强壮
  rationale: 表达强度副词与形容词所强调的非凡力量。
- source_word: וְשִׁנַּיִן דִּי פַרְזֶל לַהּ רַבְרְבָן
  choice: 它有巨大的铁牙
  rationale: 同时保留牙齿的材质与尺寸，中文简洁自然。
- source_word: אָכְלָה וּמַדֱּקָה
  choice: 它吞吃、咬碎
  rationale: “吞吃”贴合兽的形象；“咬碎”既表达彻底破坏，也与铁牙的近接语境自然衔接。
- source_word: וּשְׁאָרָא בְרגליה רָפְסָה
  choice: 又用脚践踏剩下的
  rationale: 将“剩余者／剩余之物”的概括性保留下来，不擅自明确其对象。
- source_word: מְשַׁנְּיָה מִן כָּל חֵיוָתָא דִּי קָדָמַיהּ
  choice: 与先前所有的兽都不同
  rationale: 直接表达第四兽相对于此前诸兽的独特性。
- source_word: וְקַרְנַיִן עֲשַׂר לַהּ
  choice: 并且有十只角
  rationale: 按异象形象直译，不在本节加入象征解释。
theological_decisions:
- issue: 第四只兽的历史或末世身份
  choice: 仅按经文译为象征性的“第四只兽”，不作具体政权认定
  alternative: 在译文中将其认定为罗马、希腊化时代的某帝国，或末世复合政权
  rationale: 本节只描写它的可怕、力量、独特性和十角，并未明说其历史身份；译文应保留解释空间。
- issue: שְׁאָרָא所指对象
  choice: 译作“剩下的”，保留对象未明的表达
  alternative: 明确译作“剩下的人”“其余国家”或“残余之物”
  rationale: 原文使用概括性的“余剩”，没有在本句明确限定具体对象，不宜在翻译中补入。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话；保留异象叙述中“看哪”的突现语气，并避免古奥表达及任何宗派性历史认定。
