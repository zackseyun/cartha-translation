  text: וְ/דִינָ֖/א יִתִּ֑ב וְ/שָׁלְטָנֵ֣/הּ יְהַעְדּ֔וֹן לְ/הַשְׁמָדָ֥ה וּ/לְ/הוֹבָדָ֖ה עַד סוֹפָֽ/א־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/026.yaml
  text: But the court will sit[a], and his dominion will be taken away[c][b], to be destroyed and annihilated to the end.
translation:
  language: zh_hans
  text: 但审判庭必开庭[a]，他的统治权[b]必被夺去，以致被毁灭、被除尽，直到终局[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“审判将进行”。亚兰文既可着重审判庭的召集，也可着重审判正式进行。
    reason: lexical_alternative
  - marker: b
    text: 或译：“他的权柄”或“他的统治”。
    reason: lexical_alternative
  - marker: c
    text: 或译：“直到末了”；也可理解为强调毁灭和除尽的彻底、最终。
    reason: lexical_alternative
lexical_decisions:
- source_word: דִינָא
  choice: 审判庭
  rationale: 该词在圣经亚兰文中既可指审判，也可指施行审判的法庭。这里与“坐下”连用，语境更偏向天上的审判庭开庭，同时以脚注保留另一可能。
- source_word: יִתִּב
  choice: 必开庭
  rationale: 原义为“坐下”；用于法庭语境时，表示审判者就座、法庭开庭。“开庭”是现代汉语中自然且庄重的对应表达。
- source_word: שָׁלְטָנֵהּ
  choice: 他的统治权
  rationale: 该词指统治的权力、权柄或主权。“统治权”既切合但以理书第七章国度更替的语境，也保留其为权力本身而非领土的含义。
- source_word: יְהַעְדּוֹן
  choice: 必被夺去
  rationale: 原文使用复数动词，但在此可作不定主体或非人称表达。汉语被动式避免擅自补出行动者，并清楚表达其统治权遭到撤除。
- source_word: לְהַשְׁמָדָה
  choice: 以致被毁灭
  rationale: 此形式可表达目的或结果。译作“以致被毁灭”保留其与夺去统治权之间的结果关系，也显示统治权是承受毁灭的对象。
- source_word: וּלְהוֹבָדָה
  choice: 被除尽
  rationale: 与“被毁灭”并列，形成加强语气的表达，强调审判的彻底性；“除尽”比单纯“败坏”更能体现完全消除的力度。
- source_word: עַד סוֹפָא
  choice: 直到终局
  rationale: 字面为“直到末了／终点”。“直到终局”保留时间与终极性的张力，不直接把它简化为程度副词“彻底”。
theological_decisions:
- issue: “他的统治权”所指为何
  choice: 保留单数代词“他的”，让它在直接语境中指向先前狂妄说话的角，同时不在译文中进一步确定其身份。
  alternative: 理解为第四兽整体的统治权。
  rationale: 紧接的上下文聚焦于那角受审判，但那角又属于第四兽及其国度。保留原文单数形式，可以避免将这层关联过度限定。
- issue: 毁灭与除尽的对象
  choice: 按句法承接“他的统治权”，译为该统治权被毁灭、被除尽。
  alternative: 将不定主体理解为毁灭并除尽那位统治者或其国度。
  rationale: 原文连续结构最自然地承接前面的“统治权”，但目的／结果结构仍带有一定压缩性；译文不额外补出统治者或国度。
translation_notes:
  register: 采用现代、庄重而易懂的法庭用语。“审判庭必开庭”以自然汉语表达原文“审判／法庭坐下”的意象；后半句保留被动结构、并列加强语和“直到终局”的末世性张力。
