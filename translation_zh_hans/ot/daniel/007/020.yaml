revisions:
- from: 也想知道它头上的十个角，以及后来长出来的另一个角；在它面前有三个角倒下。这个角有眼睛，有一张说大话的口[a]，它的样貌比同伴更显高大。
  to: 我又想知道它头上的十个角，以及另一个长出来的角；有三个角在它面前倒下。这个角有眼睛，又有一张口说大话；它的样貌比同伴的更大。[a]
  rationale: 修订使中文更自然，并避免把“另一个”和“更大”的原文语义分别固定为“后来”及“高大”。脚注锚点置于整句末尾，所释词语“说大话”仍在同一句中，且保留英文审计轨迹所列的字面与解释性替代译法。
