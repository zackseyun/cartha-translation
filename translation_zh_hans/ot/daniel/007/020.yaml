  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/עַל קַרְנַיָּ֤/א עֲשַׂר֙ דִּ֣י בְ/רֵאשַׁ֔/הּ וְ/אָחֳרִי֙ דִּ֣י סִלְקַ֔ת ו/נפלו מִן קדמי/ה תְּלָ֑ת וְ/קַרְנָ֨/א דִכֵּ֜ן וְ/עַיְנִ֣ין לַ֗/הּ וְ/פֻם֙ מְמַלִּ֣ל רַבְרְבָ֔ן וְ/חֶזְוַ֖/הּ רַ֥ב מִן חַבְרָתַֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/020.yaml
  text: and about the ten horns that were on its head[a], and the other horn that came up, before which three fell—the horn that had eyes and a mouth speaking great things, and whose appearance was greater than that of its companions.
translation:
  language: zh_hans
  text: 我又想知道它头上的十个角，以及另一个长出来的角；有三个角在它面前倒下。这个角有眼睛，又有一张口说大话；它的样貌比同伴的更大。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“口说宏大的话”；也可理解为“说狂妄的话”或“大肆夸口”。
    reason: 原文 רַבְרְבָן 字面指“大事”或“宏大的话”；上下文可带有夸耀、狂妄的意味。
lexical_decisions:
- source_word: קַרְנַיָּא עֲשַׂר
  choice: 十个角
  rationale: 保留异象中“角”的象征形象，不将其直接解释为君王或国度。
- source_word: בְרֵאשַׁהּ
  choice: 它头上的
  rationale: ב与“头”及阴性单数后缀连用，所指回到那兽；“它头上的”符合现代汉语空间表达。
- source_word: אָחֳרִי דִּי סִלְקַת
  choice: 后来长出来的另一个角
  rationale: אָחֳרִי可表示“另一个”或“后来的”，而סִלְקַת描绘角出现、上长的动态；此译兼顾区别和先后画面。
- source_word: וּנְפָלוּ מִן־קֳדָמַהּ תְּלָת
  choice: 在它面前有三个角倒下
  rationale: 按上下文补出“角”，使中文指称清楚；“在它面前”保留原文可指在其面前或因其出现而退落的表达，不进一步说明因果。
- source_word: וְעַיְנִין לַהּ
  choice: 这个角有眼睛
  rationale: 直陈异象中特别而鲜明的形貌。
- source_word: וְפֻם מְמַלִּל רַבְרְבָן
  choice: 有一张说大话的口
  rationale: “大话”贴近“说宏大的话”这一字面意象，同时在现代汉语中自然传达其夸大的语气；脚注列出较少解释性的译法。
- source_word: וְחֶזְוַהּ רַב מִן חַבְרָתַהּ
  choice: 它的样貌比同伴更显高大
  rationale: חֶזְוָהּ指可见的样貌，רַב既可涉及大小，也可表达显赫、突出；“更显高大”保留两者之间的张力，“同伴”则维持诸角之间的关系性称呼。
theological_decisions:
- issue: רַבְרְבָן应译为中性的“宏大的话”，还是带贬义的“狂妄话”
  choice: 说大话
  alternative: 说宏大的话；说狂妄的话；大肆夸口
  rationale: 上下文显示这话带有傲慢意味，但原词本身直指“大事、大话”。正文采用自然且仍保留一定语义幅度的“说大话”，不把其神学性质进一步定死；其他可能性列于脚注。
- issue: רַב מִן חַבְרָתַהּ指物理尺寸还是威势地位
  choice: 样貌比同伴更显高大
  alternative: 外形比同伴更大；看起来比同伴更威严
  rationale: 原文把比较落在“样貌”上，却以可兼指大、显赫的רַב描述它；译文避免只限定为体积或权势。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。“也想知道”承接上一节的求问，反映本节开头的并列结构；使用“长出来”“倒下”保持异象的动态画面。脚注标记置于其实际解释的“说大话”之后。
