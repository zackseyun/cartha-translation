id: DAN.7.28
reference: Daniel 7:28
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: עַד כָּ֖ה סוֹפָ֣/א דִֽי מִלְּתָ֑/א אֲנָ֨ה דָֽנִיֵּ֜אל שַׂגִּ֣יא רַעְיוֹנַ֣/י יְבַהֲלֻנַּ֗/נִי וְ/זִיוַ/י֙ יִשְׁתַּנּ֣וֹן עֲלַ֔/י וּ/מִלְּתָ֖/א בְּ/לִבִּ֥/י נִטְרֵֽת־־׀׃פ
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/028.yaml
  text: This is the end of the matter[a]. As for me, Daniel, my thoughts greatly terrified me, and my appearance changed because of it[b]; but I kept the matter in my heart.
translation:
  language: zh_hans
  text: 到这里，这事就结束了[a]。至于我——但以理，我的思绪使我极其惊恐，我的面色也随之改变[b]；但我把这事存记在心里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“到这里，就是这事的结局。”
    reason: 原文可理解为叙述到此终止，也可强调所述之事的结局。
  - marker: b
    text: “面色”也可译作“容貌”或“光彩”。
    reason: 亚兰语זִיו兼有容貌、面色与光彩等含义。
lexical_decisions:
- source_word: עַד כָּה
  choice: 到这里
  rationale: 这是亚兰语中表示叙述止点的用语；译为“到这里”既保留原文空间性表达，又符合现代汉语总结语境。
- source_word: סוֹפָא דִי מִלְּתָא
  choice: 这事就结束了
  rationale: סוֹפָא意为“末了、终结”，מִלְּתָא在此指异象所述之事；采用自然汉语句式，同时保留“结束”的明确含义。
- source_word: אֲנָה דָנִיֵּאל
  choice: 至于我但以理
  rationale: 独立代词与人名并用带有强调意味；“至于我但以理”清楚保留这种自指强调。
- source_word: שַׂגִּיא רַעְיוֹנַי
  choice: 我的思绪……极其
  rationale: רַעְיוֹנַי指思想、思绪，שַׂגִּיא在此加强后续动词的程度；“思绪”适合异象后的内心反应，“极其”保留强度。
- source_word: יְבַהֲלֻנַּנִי
  choice: 使我……惊恐
  rationale: 该动词可表示使人惊慌、恐惧或不安；结合程度副词与异象语境，“惊恐”准确而有力度。
- source_word: וְזִיוַי
  choice: 我的面色
  rationale: זִיו可指光彩、容貌或面色；与“改变”连用时，“面色”是现代汉语中自然且具体的表达，同时在脚注保留其他词义可能。
- source_word: יִשְׁתַּנּוֹן עֲלַי
  choice: 也随之改变
  rationale: 原文直译近于“在我身上改变”；“随之改变”自然表达但以理外貌因惊恐而发生变化，不把具体变化说死。
- source_word: וּמִלְּתָא
  choice: 但我把这事
  rationale: 连接词字面可作“和”，此处内在保存与外在惊恐构成语篇对照，译作“但”更符合汉语关系；מִלְּתָא继续译为“这事”。
- source_word: בְּלִבִּי
  choice: 在心里
  rationale: 保留圣经中“心”作为内在人格与思想所在的表达，不窄化为纯认知意义的“头脑”。
- source_word: נִטְרֵת
  choice: 存在
  rationale: 该动词意为保守、保存；汉语“存在心里”简洁自然，表达牢记并保留此事。
theological_decisions:
- issue: בְּלִבִּי所体现的人论语言
  choice: 译为“在心里”
  alternative: 在脑海里；在内心深处
  rationale: “心”保留原文对人内在生命的整体性表达，避免将其限定为单纯的思想活动。
- issue: זִיו的多义性
  choice: 正文译为“面色”并以脚注保留“容貌／光彩”
  alternative: 容貌；光彩
  rationale: 上下文最自然地指向但以理可见的面色变化，但该词确有“光彩”义，不应在翻译中完全消除这项词义张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。句首“到这里”保留原文的收束感；“至于我但以理”体现强调；“存在心里”沿用普通读者熟悉的圣经式表达，但不显陈旧。所有脚注标记均已置于正文相应位置。
