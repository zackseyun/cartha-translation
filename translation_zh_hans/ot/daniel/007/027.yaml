source:
  edition: WLC
  text: וּ/מַלְכוּתָ֨/ה וְ/שָׁלְטָנָ֜/א וּ/רְבוּתָ֗/א דִּ֚י מַלְכְוָת֙ תְּח֣וֹת כָּל שְׁמַיָּ֔/א יְהִיבַ֕ת לְ/עַ֖ם קַדִּישֵׁ֣י עֶלְיוֹנִ֑ין מַלְכוּתֵ/הּ֙ מַלְכ֣וּת עָלַ֔ם וְ/כֹל֙ שָׁלְטָ֣נַיָּ֔/א לֵ֥/הּ יִפְלְח֖וּן וְ/יִֽשְׁתַּמְּעֽוּן־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/027.yaml
  text: And the kingdom and the dominion and the greatness of the kingdoms under all heaven shall be given to the people of the saints of the Most High[a]. His kingdom shall be an everlasting kingdom[c][b], and all dominions shall serve and obey him.
translation:
  language: zh_hans
  text: 普天之下各国的国度、权柄和威势，都必赐给至高者的圣民[a]。他的国度是永远的国度[b]；一切掌权者都必侍奉他[c]，听从他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “至高者的圣民”也可按字面译作“至高者众圣者的百姓”，或译作“至高者圣者的百姓”。原文“圣者”是复数，既可按个体理解，也可指整体的圣洁群体。
    reason: 保留“圣者／圣民”及集合名词“百姓”的词汇和句法可能性。
  - marker: b
    text: 原文在“他的国度”以及下文“侍奉他，听从他”中都使用阳性单数形式；这可能指向异象前文那位代表性的统治者，而国度同时又赐给圣民。
    reason: 说明原文单数代词与前文群体领受国度之间的释义张力，避免以复数解释性地消除它。
  - marker: c
    text: “侍奉”在《但以理书》中用于对神明的服事时，也可含“敬拜”的意思。“一切掌权者”也可译作“一切统治权”或“一切政权”。
    reason: 保留动词可能具有的宗教含义，并说明复数名词可指掌权者或其统治权、政权。
lexical_decisions:
- source_word: מַלְכוּתָה
  choice: 国权
  rationale: 此词兼有国度与王权之意；在三个并列名词中译作“国权”，既表达统治实权，也避免与后文“各国”重复得过于生硬。
- source_word: שָׁלְטָנָא
  choice: 统治权
  rationale: 指支配、治理的权柄；“统治权”在现代汉语中清楚而庄重。
- source_word: רְבוּתָא
  choice: 威势
  rationale: 原词表示伟大、强盛或显赫；结合各国统治的语境，“威势”比抽象的“伟大”更自然，同时不过度限定为荣耀或尊贵。
- source_word: דִּי מַלְכְוָת תְּחוֹת כָּל שְׁמַיָּא
  choice: 天国以下各国的
  rationale: 按亚兰语关系结构修饰前三项；“天国以下”是涵盖全世界的庄重表达，“各国”保留复数。
- source_word: יְהִיבַת
  choice: 都必赐给
  rationale: 形式上为完成式，但在异象解释的预告语境中指将来的结局；“必”传达其确定性。
- source_word: לְעַם
  choice: 给……的百姓
  rationale: עַם 是集合名词，指一群人民；“百姓”自然表达共同体，不引入现代民族国家观念。
- source_word: קַדִּישֵׁי עֶלְיוֹנִין
  choice: 至高者众圣民
  rationale: קַדִּישִׁין 可指圣者、圣民；“众圣民”保留复数与群体含义，脚注列出其他可行理解。
- source_word: מַלְכוּתֵהּ
  choice: 他的国
  rationale: 原文后缀为第三人称阳性单数，必须保留单数，不能按前文群体改成“他们的国”。
- source_word: מַלְכוּת עָלַם
  choice: 永远的国
  rationale: 自然而庄重地表达持续无尽的王国。
- source_word: שָׁלְטָנַיָּא
  choice: 一切掌权者
  rationale: 复数形式可指统治权、政权或掌权者；因其后执行“侍奉、听从”的动作，正文采用人格化的“掌权者”，并在脚注说明词义范围。
- source_word: יִפְלְחוּן
  choice: 必侍奉他
  rationale: 动词可表示服事，也可在但以理书中用于对神的敬奉；“侍奉”保留二者之间的语义张力。
- source_word: וְיִשְׁתַּמְּעוּן
  choice: 听从他
  rationale: 原义涉及听，语境中含顺服之意；“听从”同时保留听与服从两层含义。
theological_decisions:
- issue: 后半节单数代词所指
  choice: 保留“他的国……侍奉他，听从他”的单数形式。
  alternative: 按领受国度的众圣民意译为“他们的国……侍奉并听从他们”。
  rationale: 亚兰语的物主后缀和宾语代词均为阳性单数；全章既说国度赐给“像人子的”，又说赐给至高者的圣民。译文不替原文消除这项代表性个体与群体之间的张力。
- issue: קַדִּישֵׁי עֶלְיוֹנִין 的身份
  choice: 正文译为“至高者众圣民”，并保留“百姓”这一集合名词。
  alternative: 译为“至高者的众圣者”，可能理解为天上的圣者；或合并译成“至高者的圣民”。
  rationale: 该短语在但以理书第七章可能着重于属于至高者的圣洁群体，但“圣者”这一词义及其复数形式不应被完全抹去，故以脚注保留替代读法。
- issue: יִפְלְחוּן 是否明确译作敬拜
  choice: 译为“侍奉”，不在正文中限定为礼拜意义。
  alternative: 译为“敬拜”。
  rationale: 该动词在但以理书中用于对神明的事奉时可含敬拜意味，但本节也处在普世政权顺服的语境；“侍奉”能保留政治臣服与宗教敬奉之间的可能张力。
translation_notes:
  register: 采用现代、庄重且便于朗读的标准普通话。“国权、统治权和威势”维持原文三项并列；“百姓”避免现代民族国家色彩；后半节严格保留原文单数代词。所有脚注标记均已置于正文相应位置。
