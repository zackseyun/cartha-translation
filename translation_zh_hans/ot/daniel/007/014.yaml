  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/לֵ֨/הּ יְהִ֤יב שָׁלְטָן֙ וִ/יקָ֣ר וּ/מַלְכ֔וּ וְ/כֹ֣ל עַֽמְמַיָּ֗/א אֻמַיָּ֛/א וְ/לִשָּׁנַיָּ֖/א לֵ֣/הּ יִפְלְח֑וּן שָׁלְטָנֵ֞/הּ שָׁלְטָ֤ן עָלַם֙ דִּֽי לָ֣א יֶעְדֵּ֔ה וּ/מַלְכוּתֵ֖/הּ דִּי לָ֥א תִתְחַבַּֽל־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/014.yaml
  text: And to him was given dominion and glory and a kingdom[a], that all peoples, nations, and languages should serve him. His dominion is an everlasting dominion, which will not pass away, and his kingdom is one that will not be destroyed.
translation:
  language: zh_hans
  text: 权柄、荣耀和国度都赐给了他，使各族、各国、说各种语言的人都事奉他[a]。他的权柄是永远的权柄，永不消逝；他的国度永不毁灭。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“敬拜他”，也可理解为“向他效忠”或“向他致敬”。亚兰文这个动词可指服事，包括宗教性的事奉，因此这里的含义可能不只限于政治上的臣服。
    reason: 词义存在重要的解释空间，且涉及这位人物所接受之普世事奉的性质。
lexical_decisions:
- source_word: יְהִיב
  choice: 赐给了
  rationale: 采用被动表达，符合亚兰文句法，也保留赐予者未明说的特点；“赐给”体现庄重语境中的授予。
- source_word: שָׁלְטָן
  choice: 权柄
  rationale: 此词指统治和支配的权力；“权柄”既适合君王与异象语境，也便于在后半节重复，保留原文的强调。
- source_word: וִיקָר
  choice: 荣耀
  rationale: 该词可指尊荣、威荣或荣耀；此处与权柄和国度并列，“荣耀”最能保持庄严而不失自然。
- source_word: מַלְכוּ / מַלְכוּתֵהּ
  choice: 国度
  rationale: 该词可指王权、统治或国度；此处“国度”兼顾所赐的王权及其统治领域，并与全章诸国度的语境相应。
- source_word: עַמְמַיָּא אֻמַיָּא וְלִשָּׁנַיָּא
  choice: 各族、各国、说各种语言的人
  rationale: 保留原文三项并列所表达的普世范围，同时把“语言”自然地处理为说各种语言的人。
- source_word: יִפְלְחוּן
  choice: 事奉他
  rationale: 该动词可表示服事，也可包含敬拜或效忠的意味。“事奉”保留其宗教性可能，又不把含义限定为单纯敬拜或政治臣服。
- source_word: שָׁלְטָנֵהּ שָׁלְטָן עָלַם
  choice: 他的权柄是永远的权柄
  rationale: 重复“权柄”以保留原文的强调；“永远的”清楚表达其与短暂无常的人间政权相反。
- source_word: יֶעְדֵּה
  choice: 永不消逝
  rationale: 该词可表示过去、离去或被除掉；“消逝”自然表达其统治不会终止，同时不额外指定外在施动者。
- source_word: תִתְחַבַּל
  choice: 永不毁灭
  rationale: 在国度的语境中，此词指遭毁坏或灭亡；“毁灭”准确表达彻底败亡的含义。
theological_decisions:
- issue: 人子般的人物所受的 יִפְלְחוּן 的性质
  choice: 事奉他
  alternative: 敬拜他；向他效忠／致敬
  rationale: 该亚兰文动词在《但以理书》中可以带有宗教事奉的意味，但本身也能指服事或臣服。译作“事奉”既不排除敬拜含义，也不预先断定这里只是政治效忠，从而保留经文的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。前句保留被动授予结构，不明说赐予者；后句重复“权柄”，对应原文修辞。脚注标在“事奉他”之后，因为注释针对该动词，而非“国度”。
