  text: עַ֣ד דִּֽי אֲתָ֗ה עַתִּיק֙ יֽוֹמַיָּ֔/א וְ/דִינָ֣/א יְהִ֔ב לְ/קַדִּישֵׁ֖י עֶלְיוֹנִ֑ין וְ/זִמְנָ֣/א מְטָ֔ה וּ/מַלְכוּתָ֖/א הֶחֱסִ֥נוּ קַדִּישִֽׁין־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/022.yaml
  text: until the Ancient of Days came[a], and judgment was given to the saints of the Most High, and the time arrived[c][b], and the saints took possession of the kingdom.
translation:
  language: zh_hans
  text: 直到亘古常在者来到，并为至高者的圣民作出裁决[a][b]；时候到了，圣民便取得了国度[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“把裁决交给至高者的圣民。”亚兰文介词既可表示“为……”，即作出有利于他们的裁决，也可表示“给……”。
    reason: alternative_reading
  - marker: b
    text: “圣民”或译“圣者”；下同。
    reason: lexical_alternative
  - marker: c
    text: 或译：“圣民拥有了国度。”
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד דִּי
  choice: 直到
  rationale: 引出前文压迫持续的时间界限；“直到”准确而自然。
- source_word: אֲתָה
  choice: 来到
  rationale: 表达来到、抵达，并保留异象叙事的动态感。
- source_word: עַתִּיק יוֹמַיָּא
  choice: 亘古常在者
  rationale: 作为但以理书中这一神圣称号的通行译法，既体现久远古老，也保持庄严。
- source_word: וְדִינָא יְהִב
  choice: 并……作出裁决
  rationale: דִּין具有审判、裁决或司法判决之义；中文用“作出裁决”清楚保留司法语境。
- source_word: לְקַדִּישֵׁי עֶלְיוֹנִין
  choice: 为至高者的圣民
  rationale: 依上下文将介词理解为受益用法，即裁决有利于受逼迫的圣民；同时以脚注保留“交给圣民”的语法可能。
- source_word: וְזִמְנָא מְטָה
  choice: 时候到了
  rationale: 自然表达决定性时刻的来临，不额外加入原文未明说的“所定”。
- source_word: וּמַלְכוּתָא
  choice: 国度
  rationale: 在但以理书第七章的语境中指王国或王权；“国度”简洁且与上下文协调。
- source_word: הֶחֱסִנוּ
  choice: 取得了
  rationale: 该动词可指取得或占有；“取得了国度”表现圣民实际进入对国度的拥有。
- source_word: קַדִּישִׁין
  choice: 圣民
  rationale: 在本章语境中自然指属神的圣洁群体，同时避免把所指对象限定为某一特定宗派或末世体系。
theological_decisions:
- issue: וְדִינָא יְהִב לְקַדִּישֵׁי עֶלְיוֹנִין中法律性分句的含义
  choice: 为至高者的圣民作出裁决
  alternative: 把裁决交给至高者的圣民
  rationale: 上下文强调圣民受逼迫后获得有利裁决；不过介词לְ也可能标示间接宾语，因此在脚注中保留另一种理解，不把经文的语法张力消除。
- issue: קַדִּישֵׁי／קַדִּישִׁין所指的群体
  choice: 圣民
  alternative: 圣者
  rationale: “圣民”在现代汉语中适合指属神的群体，但脚注保留较宽泛的“圣者”，避免过度限定其所指。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“亘古常在者”保留传统且准确的神圣称号；分号呈现原文由裁决转入圣民得国的推进。脚注标记均紧随其所说明的词句。
