  text: אֱדַ֗יִן צְבִית֙ לְ/יַצָּבָ֔א עַל חֵֽיוְתָ/א֙ רְבִיעָ֣יְתָ֔/א דִּֽי הֲוָ֥ת שָֽׁנְיָ֖ה מִן כל/הון דְּחִילָ֣ה יַתִּ֗ירָה שני/ה דִּֽי פַרְזֶל֙ וְ/טִפְרַ֣י/הּ דִּֽי נְחָ֔שׁ אָֽכְלָ֣ה מַדֲּקָ֔ה וּ/שְׁאָרָ֖/א בְּ/רַגְלַ֥י/הּ רָֽפְסָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/019.yaml
  text: Then I wanted to know for certain about the fourth beast[a], which was different from all of them, exceedingly terrifying, with teeth of iron and claws of bronze, which devoured, crushed[b], and trampled what was left with its feet.
translation:
  language: zh_hans
  text: 于是，我想确切了解第四只兽[a]。它与其他所有的兽都不同，极其可怕，有铁牙和青铜爪[b]；它吞吃、碾碎，又用脚践踏剩下的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “想确切了解”也可译作“想查明……的实情”。亚兰文表达希望把事情弄清楚、确定下来。
    reason: lexical_alternative
  - marker: b
    text: “青铜爪”也可译作“铜爪”或“青铜指甲”；原词可指爪或指甲。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱדַיִן
  choice: 于是
  rationale: 作为时间和叙事推进标记，承接异象中但以理接下来的询问。
- source_word: צְבִית לְיַצָּבָא
  choice: 我想确切了解
  rationale: צְבִית表达愿望，לְיַצָּבָא在本语境强调弄清、确定；合译既自然，也保留求得确切认识的语气。
- source_word: עַל חֵיוְתָא רְבִיעָיְתָא
  choice: 第四只兽
  rationale: עַל由汉语动词“了解”自然支配，无须另译“关于”；序数与名词按现代汉语表达。
- source_word: דִּי הֲוָת שָׁנְיָה מִן כלהון
  choice: 它与其他所有的兽都不同
  rationale: 明确比较对象，传达שָׁנְיָה的“不同、异于”之意；“其他”避免把第四兽本身纳入比较集合而造成汉语歧义。
- source_word: דְּחִילָה יַתִּירָה
  choice: 极其可怕
  rationale: 保留יַתִּירָה的强烈程度和דְּחִילָה所表达的骇人特征。
- source_word: שניּה דִּי פַרְזֶל
  choice: 铁牙
  rationale: 简洁自然地表达材质关系，符合兽的形象。
- source_word: וְטִפְרַיּהּ דִּי נְחָשׁ
  choice: 铜爪
  rationale: טִפְרַיּהּ可指爪或指甲；在兽的意象中“爪”最贴切。נְחָשׁ在此指铜或青铜，正文用自然简洁的“铜”，脚注保留材质译法的可能范围。
- source_word: אָכְלָה מַדֲּקָה
  choice: 吞吃、碾碎
  rationale: 保持两个连续暴力动作的区分；מַדֲּקָה含压碎、破碎之意，“碾碎”传达其强度。
- source_word: וּשְׁאָרָא בְּרַגְלַיּהּ רָפְסָה
  choice: 又用脚践踏剩下的
  rationale: “剩下的”保留שְׁאָרָא作为吞吃、碾碎之后余物的开放指称，不擅自补出具体对象。
