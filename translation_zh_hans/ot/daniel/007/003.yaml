  text: וְ/אַרְבַּ֤ע חֵיוָן֙ רַבְרְבָ֔ן סָלְקָ֖ן מִן יַמָּ֑/א שָׁנְיָ֖ן דָּ֥א מִן דָּֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/003.yaml
  text: And four great beasts were coming up from the sea[a], different from one another.
translation:
  language: zh_hans
  text: 四只巨兽从海里[a]上来，彼此各不相同。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“从海中出来。”
    reason: 原文介词短语可译为“从海里”，也可更明确地表达为“从海中出来”。
lexical_decisions:
- source_word: וְ/אַרְבַּע
  choice: 四只
  rationale: 以“四只”自然引出异象中的下一幕；汉语不必机械译出连接词“和”，上下文的承接关系仍然清楚。
- source_word: חֵיוָן
  choice: 巨兽（核心名词“兽”）
  rationale: 在但以理书的异象语境中，此词指具有象征意义、令人畏惧的兽类形体；“兽”比“动物”或“活物”更能保留其末世异象色彩，又不在本节中提前明说其所象征的国度。
- source_word: רַבְרְבָן
  choice: 巨
  rationale: 该词表示巨大或伟大；与“兽”合译为“巨兽”，既简洁自然，也突出这些形体的庞大与威势。
- source_word: סָלְקָן
  choice: 上来
  rationale: 保留从海中向上出现的动态。亚兰文形式描绘异象中正在发生的动作；现代汉语“上来”在此无需额外加入进行标记，也可自然表达该场景。
- source_word: מִן יַמָּא
  choice: 从海里
  rationale: 介词表示来源或由内部出来。“从海里”符合现代汉语习惯；“从海中”同样可行，列入脚注以保留语体与空间表达上的选择。
- source_word: שָׁנְיָן
  choice: 各不相同
  rationale: 此处表示彼此有别，而不是正在改变；“各不相同”清楚传达四兽之间的差异。
- source_word: דָּא מִן דָּא
  choice: 彼此
  rationale: 这是表达相互区别的习语；与“各不相同”搭配，准确而自然地传达“四兽一个不同于另一个”的意思。
theological_decisions:
- issue: 异象语境中 חֵיוָן 的象征力度
  choice: 译作“兽”，并与修饰语合为“巨兽”
  alternative: “活物”或“动物”
  rationale: “兽”保留这些形体令人畏惧的异象性质及其后文所具有的政治象征潜力，却不把后文对它们的解释直接加入本节。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“巨兽”比“伟大的兽”更符合中文搭配；“彼此各不相同”保留原文的相互比较。主句未另译句首连接词，以避免生硬，同时不改变异象叙事的连续性。
