  yaml_path: translation/ot/daniel/007/017.yaml
  text: These great beasts[a], which are four, are four kings who will arise from the earth.
translation:
  language: zh_hans
  text: 这四只巨兽，就是四个将要从地上[a]兴起的王。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“从土地上”。亚兰文“אַרְעָא”既可指“大地”，也可指“土地”；这里因全章异象的广阔范围而译作“地上”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אִלֵּין
  choice: 这
  rationale: 亚兰文复数指示词指向异象中刚出现的兽；汉语用“这四只”自然承接近指语境。
- source_word: חֵיוָתָא רַבְרְבָתָא
  choice: 四只巨兽
  rationale: חֵיוָתָא 在本章象征性、威胁性的异象语境中宜译“兽”；רַבְרְבָתָא 可指巨大或伟大，合译“巨兽”既自然，也保留其体量和威势。量词“只”符合现代汉语习惯。
- source_word: דִּי אִנִּין אַרְבַּע
  choice: 就是四个
  rationale: 该关系结构把先前所见的兽与其解释连接起来；汉语用“就是”清楚表达同一指称关系，避免生硬直译为“它们是四个”。
- source_word: אַרְבְּעָה מַלְכִין
  choice: 四个……王
  rationale: 原文明确使用“王”的复数，而非“国”；保留“王”，不将象征意义预先解释成“四国”。
- source_word: יְקוּמוּן
  choice: 将要……兴起
  rationale: 该动词可指站起、起来或兴起；用于君王出现的预言语境，“兴起”自然且贴切。“将要”体现未完成式在此处的将来指向。
- source_word: מִן אַרְעָא
  choice: 从地上
  rationale: אַרְעָא 可表示“大地”或“土地/地”；在广阔的末世异象语境中，主文采用“地上”，同时以脚注保留“这地/那地”的词义可能。
theological_decisions:
- issue: 末世象征中“四个王”的所指
  choice: 主文按原词译作“四个王”，不扩展为“四个国”。
  alternative: 按象征所指解释性地译作“四个国”，或在注释中说明王可能代表国度。
  rationale: 原文是 מַלְכִין（“王”），而本节本身没有使用“国”。保留原文措辞，可避免借邻近经文消解王与国之间的象征张力。
- issue: אַרְעָא 的范围
  choice: 主文译作“地上”。
  alternative: 译作“这地上”或“那地上”，理解为特定土地。
  rationale: 本章异象具有广阔范围，“地上”较符合上下文；但亚兰文词本身可指土地，因此用脚注保留歧义。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“这四只巨兽，就是……”以自然汉语重组原文解释句式；“将要从地上兴起的王”保持预言语气，并保留“王”而不解释成“国”。
