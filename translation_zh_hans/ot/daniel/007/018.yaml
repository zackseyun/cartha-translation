  text: וִֽ/יקַבְּלוּן֙ מַלְכוּתָ֔/א קַדִּישֵׁ֖י עֶלְיוֹנִ֑ין וְ/יַחְסְנ֤וּן מַלְכוּתָ/א֙ עַֽד עָ֣לְמָ֔/א וְ/עַ֖ד עָלַ֥ם עָלְמַיָּֽ/א־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/018.yaml
  text: But the holy ones of the Most High will receive the kingdom and possess the kingdom forever—forever and ever[a].
translation:
  language: zh_hans
  text: 但至高者的圣者[a]必领受国度，并且拥有这国度，直到永远，直到永永远远。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“至高者的圣民。”这亚兰文表达可指上帝的圣民；在本章语境中，也有人理解为天上的圣者。
    reason: 词义与所指对象存在真实歧义。
lexical_decisions:
- source_word: וִיקַבְּלוּן
  choice: 必领受
  rationale: Peal未完成式在此表示将来的领受；“领受”忠实表达“接受、取得”的基本义，又不暗示以武力夺取或把原文主动形式改成被动。
- source_word: מַלְכוּתָא
  choice: 国度
  rationale: 该词兼有王权、统治和疆域的含义；“国度”在现代中文中自然，也保留但以理书第7章中与兽所代表的诸国相对照的意象。第二次出现时译作“这国度”，清楚承接前项。
- source_word: קַדִּישֵׁי עֶלְיוֹנִין
  choice: 至高者的圣民
  rationale: קַדִּישֵׁי是实体化的复数形容词“圣者／圣洁者”，עֶלְיוֹנִין在此构成“至高者”的神圣称号。“圣民”符合自然中文，并以脚注保留此语可能指“圣者”、包括天上圣者的歧义。
- source_word: וְיַחְסְנוּן
  choice: 并且拥有
  rationale: 该动词在此表示占有、持有；“拥有”与前面的“领受”形成自然递进，并保留持续占有国度的意味，不额外引入“承受产业”的解释。
- source_word: עַד עָלְמָא
  choice: 直到永远
  rationale: 这是表示无尽久远的惯用语；“直到永远”既贴近介词עַד的形式，又是庄重自然的现代中文。
- source_word: וְעַד עָלַם עָלְמַיָּא
  choice: 直到永永远远
  rationale: 叠加强调永久性；“永永远远”保留原文在前一“直到永远”之上的强化和递进。
theological_decisions:
- issue: קַדִּישֵׁי עֶלְיוֹנִין所指的身份
  choice: 正文译作“至高者的圣民”，脚注给出“至高者的圣者”这一较形式对应的译法，并说明所指可能包括天上的圣者。
  alternative: 正文译作“至高者的圣者”，不判定是上帝的子民还是天上圣者。
  rationale: 上下文容许将其理解为属上帝的圣民，也有人据但以理书第7章的天上议会背景理解为天上圣者。中文“圣民”较自然，但脚注明确保留原文复数“圣者”的词义及其真实歧义，避免把争议完全消解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“但”承接第17节与第18节之间的转折；“必”简洁表达预言性的将来。保留两次“国度”及“直到永远，直到永永远远”的重复递进，以呈现亚兰文的强调。
