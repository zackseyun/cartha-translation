source:
  edition: WLC
  text: קִרְבֵ֗ת עַל חַד֙ מִן קָ֣אֲמַיָּ֔/א וְ/יַצִּיבָ֥א אֶבְעֵֽא מִנֵּ֖/הּ עַֽל כָּל דְּנָ֑ה וַ/אֲמַר לִ֕/י וּ/פְשַׁ֥ר מִלַּיָּ֖/א יְהוֹדְעִנַּֽ/נִי־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/016.yaml
  text: I approached one of those standing there and asked him the certainty about all this[b][a]. So he told me and made known to me the interpretation of the matter.
translation:
  language: zh_hans
  text: 我走近那些站在那里的人中有一位，向他求问有关这一切的实情[a]。他就对我说，并使我知道这些事的解释[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“有关这一切的确切情况”；亚兰语词可表示坚定、确定或真实。
    reason: lexical_alternative
  - marker: b
    text: 直译“这些话的解释”；这里的“话”可指异象的内容或所涉及的事情。
    reason: lexical_alternative
lexical_decisions:
- source_word: קִרְבֵת
  choice: 我走近
  rationale: 该词是第一人称单数完成式，在叙事中表示走近某人；“我走近”准确、自然。
- source_word: עַל חַד מִן קָאֲמַיָּא
  choice: 站立在那里的人中的一位
  rationale: 保留“站立者中的一个”这一不确定身份，不把对方进一步认定为天使或其他特定角色。
- source_word: וְיַצִּיבָא אֶבְעֵא מִנֵּהּ עַל כָּל דְּנָה
  choice: 向他求问有关这一切的实情
  rationale: יַצִּיבָא可指确实、真实或确定之事；“实情”在现代汉语中自然地表达但以理寻求可靠真相的意思，同时用脚注保留“确切情况”的可能理解。
- source_word: וַאֲמַר לִי
  choice: 他就对我说
  rationale: 保留叙事顺序及אמר“说”的基本意义，不提前把后面的解释内容并入此动词。
- source_word: וּפְשַׁר מִלַּיָּא
  choice: 这些事的解释
  rationale: פְשַׁר意为“解释、释义”；מִלַּיָּא字面是“话语”，但在此可指异象所涉及的内容或事情。“这些事”符合上下文，字面形式在脚注中说明。
- source_word: יְהוֹדְעִנַּנִי
  choice: 告诉了我
  rationale: 该词是ידע的使役形式，意为“使我知道”；汉语“把……告诉了我”自然保留使人得知的作用。
theological_decisions:
- issue: 站立者的身份
  choice: 不明确其身份，仅译作“站立在那里的人”
  alternative: 译作“侍立的天使”或“天使中的一位”
  rationale: 本节原文没有明说其为天使；虽然上下文可能暗示超自然侍从，译文不应替原文消除这一含混性。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“求问”略具经文庄重感，但仍是当代读者熟悉的表达；句法保持简洁，并保留原文先“对我说”、后“使我知道解释”的层次。
