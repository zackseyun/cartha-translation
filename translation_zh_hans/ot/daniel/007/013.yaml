  to: 我在夜间的异象中继续观看。看哪，有一位像人子的[a]，与天上的云[b]一同而来；他来到亘古常在者那里，他们把他领到亘古常在者面前。
  rationale: 修订仅改善汉语句法清晰度并更准确呈现比较结构：以“像人子的”保留“像”与“人子”，以“与……一同”对应原文“与”，并以重复称谓消除代词歧义。脚注保留词义替代和传统“驾云”理解，同时将其弥赛亚关联明确限定为后来的诠释史。
