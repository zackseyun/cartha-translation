id: DAN.7.13
reference: Daniel 7:13
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: חָזֵ֤ה הֲוֵית֙ בְּ/חֶזְוֵ֣י לֵֽילְיָ֔/א וַ/אֲרוּ֙ עִם עֲנָנֵ֣י שְׁמַיָּ֔/א כְּ/בַ֥ר אֱנָ֖שׁ אָתֵ֣ה הֲוָ֑ה וְ/עַד עַתִּ֤יק יֽוֹמַיָּ/א֙ מְטָ֔ה וּ/קְדָמ֖וֹ/הִי הַקְרְבֽוּ/הִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/013.yaml
  text: I kept looking in the visions of the night[a], and behold, with the clouds of heaven one like a son of man was coming, and he came to the Ancient of Days[b], and they brought him near before him.
translation:
  language: zh_hans
  text: 我在夜间的异象中继续观看。看哪，有一位像人子的[a]，与天上的云[b]一同而来；他来到亘古常在者那里，他们把他领到亘古常在者面前。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“有一位像人”或“有一位像人类”。亚兰文直译为“像人的儿子”，可以指具有人的样式的一位；这一表达在后来的圣经诠释中也具有重要的弥赛亚意义。
    reason: lexical_alternative
  - marker: b
    text: 传统上常译作“驾着天上的云”或“乘着天上的云”。这里的亚兰文介词本义是“与、同”，可能表示云与他相伴，不一定明确表示他在云上。
    reason: alternative_reading
lexical_decisions:
- source_word: חָזֵה הֲוֵית
  choice: 我……继续观看
  rationale: 分词与הוה构成的表达具有过去持续的意味；“继续观看”自然地传达异象中不断注视的动作。
- source_word: בְּחֶזְוֵי לֵילְיָא
  choice: 在夜间的异象中
  rationale: 保留“异象”的复数集合意义以及它与“夜间”的关系，同时符合现代汉语习惯。
- source_word: וַאֲרוּ
  choice: 看哪
  rationale: 保留引出异象中新场景的醒目提示语和启示文学的庄重语气。
- source_word: עִם עֲנָנֵי שְׁמַיָּא
  choice: 随着天上的云
  rationale: עִם的基本意义是“与、同”；“随着”既表达云与人物相伴，也避免擅自断定人物是在云上移动。
- source_word: כְּבַר אֱנָשׁ
  choice: 有一位好像人子
  rationale: “好像”保留比较词כְּ；“人子”保存原文较为形式对应且在后续经文传统中意义重大的说法，而“一位”使现代汉语句法自然。
- source_word: אָתֵה הֲוָה
  choice: 而来
  rationale: 结合上下文呈现正在趋近的动态；“随着……而来”在汉语中自然，并未将其简化为静态出现。
- source_word: עַתִּיק יוֹמַיָּא
  choice: 亘古常在者
  rationale: 采用汉语圣经传统中成熟、庄重且易懂的称号，表达这位存在年日久远者。
- source_word: מְטָה
  choice: 他来到
  rationale: 用完成性的“来到”承接前面的趋近过程，表现到达亘古常在者那里的叙事进展。
- source_word: הַקְרְבוּהִי
  choice: 他们把他领到
  rationale: 保留使役动词和原文未说明身份的复数施事者，不改写成被动句，也不擅自指明“他们”是谁。
- source_word: וּקְדָמוֹהִי
  choice: 他面前
  rationale: 简洁表达来到亘古常在者临在之处；代词所指由紧邻上下文清楚限定。
theological_decisions:
- issue: 如何翻译具有弥赛亚解释史意义的כְּבַר אֱנָשׁ
  choice: 有一位好像人子
  alternative: 有一位好像人；有一位仿佛人类
  rationale: 正文同时保留比较意味和“人子”这一源语表达，不把该人物直接等同于后来的特定解释，也不把措辞淡化为纯粹泛指的人类描述。脚注说明其一般语义及后续解释史的重要性。
- issue: 如何翻译עִם עֲנָנֵי שְׁמַיָּא
  choice: 随着天上的云
  alternative: 驾着天上的云；在天上的云上
  rationale: 源语介词עִם表示“与、同”，可描述伴随关系；正文不将其明确解释为人物位于云上，脚注则保留传统译法所反映的另一种理解。
- issue: 是否说明带人子近前的复数施事者身份
  choice: 保留未指明身份的“他们”
  alternative: 改为被动式“他被领到”或解释为天使领到
  rationale: 原文使用第三人称复数动词但没有明确主语。保留“他们”维护原文的含混，不引入天使等解释。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“看哪”保留启示文学的突显语气；“亘古常在者”沿用成熟的汉语圣经称号。句中以分号区分人物来临与到达、被领近的连续动作。所有脚注标记均置于相关词语之后。
