  text: חָזֵ֣ה הֲוֵ֔ית וְ/קַרְנָ֣/א דִכֵּ֔ן עָבְדָ֥ה קְרָ֖ב עִם קַדִּישִׁ֑ין וְ/יָכְלָ֖ה לְ/הֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/021.yaml
  text: I kept watching[a], and that horn was making war with the holy ones and was prevailing over them,
translation:
  language: zh_hans
  text: 我一直观看着，那角正在与众圣者[a]争战，并占着上风。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “众圣者”也可译作“圣徒”或“上帝的圣民”。亚兰文直译为“圣者们”。
    reason: lexical_alternative
lexical_decisions:
- source_word: חָזֵה הֲוֵית
  choice: 我继续观看
  rationale: 分词与存在动词连用，表达过去持续进行的动作；“继续观看”既自然，也保留异象叙述中的延续感。
- source_word: וְקַרְנָא דִכֵּן
  choice: 那角
  rationale: דִכֵּן在这里作回指性的指示词，指前文所述的角；“那角”简洁自然。
- source_word: עָבְדָה קְרָב
  choice: 正在……争战
  rationale: 原文是“进行/发动战争”的惯用表达；“正在争战”体现持续状态，又符合现代汉语。
- source_word: עִם
  choice: 与
  rationale: 介词本义为“与、同”；在“争战”这一语境中敌对关系已经清楚，无须改译为“攻击”。
- source_word: קַדִּישִׁין
  choice: 众圣者
  rationale: 该词字面意为复数的“圣者”；此译法避免直接限定为某一特定群体，并保留其所指对象的解释空间。
- source_word: וְיָכְלָה לְהוֹן
  choice: 并且胜过了他们
  rationale: 动词可表示“有能力、占上风、胜过”；此处战争语境支持“胜过”，而上下文仍可说明这种胜势并非最终结局。
theological_decisions:
- issue: קַדִּישִׁין所指的对象
  choice: 众圣者
  alternative: 圣徒；上帝的圣民
  rationale: 原词可以指“圣者/圣民”，其具体范围在本章异象中具有解释张力。“众圣者”贴近原文，不预先限定为教会概念、地上的圣民或天上的圣者。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“继续观看”呈现持续观察；“正在……争战”保持异象场景的进行感；“众圣者”保留原文在身份指向上的开放性。
