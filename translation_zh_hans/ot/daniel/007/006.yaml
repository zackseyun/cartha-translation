base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/006.yaml
  text: After this I kept looking[a], and behold, another, like a leopard; it had four wings of a bird on its back, and the beast had four heads, and dominion was given to it.
translation:
  language: zh_hans
  text: 此后，我继续观看。看哪，另有一兽，形状像豹，背上有四个鸟翼[a]。这兽有四个头，统治权被赐给它。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“在它的侧面”或“在它的上部”。这里的亚兰文可指这兽的背部，也可较宽泛地指其上部或侧面。
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּאתַר דְּנָה
  choice: 此后
  rationale: 这是引出异象下一幕的时间短语；“此后”简洁自然，并保留叙事推进。
- source_word: חָזֵה הֲוֵית
  choice: 我继续观看
  rationale: 分词与助动词的组合表达过去持续进行的动作；“继续观看”体现其延续性，而非仅译作一次性的“我看见”。
- source_word: וַאֲרוּ
  choice: 看哪
  rationale: 保留异象叙事中提示读者注意、增强现场感的感叹功能。
- source_word: אָחֳרִי
  choice: 另有一兽
  rationale: 原词意为“另一个”；结合上下文补出“兽”，使现代汉语表达完整清楚。
- source_word: כִּנְמַר
  choice: 形状像豹
  rationale: 准确表达前缀 כ־所标示的比较；加入“形状”使汉语自然，但不把相似之处具体化。
- source_word: גַּפִּין אַרְבַּע דִּי עוֹף
  choice: 四个鸟翼
  rationale: 保留翅膀数目及其属于鸟类翅翼的特征，表达简洁且符合异象描写。
- source_word: עַל גבי/ה
  choice: 背上
  rationale: גַּב在此最直接可指背部或上部表面；正文采用自然的“背上”，并以脚注保留较宽泛的可能。
- source_word: וְאַרְבְּעָה רֵאשִׁין לְחֵיוְתָא
  choice: 这兽有四个头
  rationale: 将亚兰文无系词结构自然转换成现代汉语的“有”字句，并保持“兽”的章节术语一致性。
- source_word: שָׁלְטָן
  choice: 统治权
  rationale: 该词指施行统治的权力；“统治权”既清楚易懂，也适合本章政治与异象语境。
- source_word: יְהִיב לַהּ
  choice: 赐给它
  rationale: 采用汉语被动意义结构“有……赐给它”，保留权柄来自外在授予这一点，同时不明说授予者。
theological_decisions:
- issue: 统治权的授予者未明说
  choice: 又有统治权赐给它
  alternative: 它从上帝那里得了统治权
  rationale: 本节只说统治权被赐予，并未明确指出授予者；译文保留这一含蓄之处，不把语境推断直接写入正文。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“看哪”保留异象叙事的鲜明提示语气；句式适度分开，以便普通读者朗读和理解。脚注标记置于其实际说明的“鸟翼”位置之后。
