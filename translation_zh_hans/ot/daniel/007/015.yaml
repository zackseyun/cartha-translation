  source_fidelity: “忧伤”较偏哀伤，未充分表达阿拉米语动词所指的内在困扰、烦乱；“躯壳”虽试图保留נִדְנֶה的比喻，却在现代汉语中常带贬抑或灵肉二分的色彩。将其译为“身体之内”，并以脚注说明原文字面意象，能更准确且不额外引入人论含义。
  naturalness: “至于我但以理”宜以破折号或逗号划分同位语。“我头脑中的异象”是现代书面汉语中既自然、又较贴近“我头的异象”的表达；“愁烦”“惊惶”庄重而清晰。
  terminology: “灵”保留רוּחִי的内在生命/精神层面，不将其缩窄为“心情”或发展特定教义。“身体”作为正文释义，脚注保留“鞘／外壳”的罕见原文意象及“我里面”的译法可能。
  issues:
