  text: אֶתְכְּרִיַּ֥ת רוּחִ֛/י אֲנָ֥ה דָנִיֵּ֖אל בְּ/ג֣וֹא נִדְנֶ֑ה וְ/חֶזְוֵ֥י רֵאשִׁ֖/י יְבַהֲלֻנַּֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/015.yaml
  text: As for me[a], Daniel, my spirit was distressed within me, and the visions of my head terrified me.
translation:
  language: zh_hans
  text: 至于我——但以理——我的灵在我身体之内愁烦；我头脑中的异象使我惊惶。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֶתְכְּרִיַּת
  choice: 忧伤
  rationale: 该动词表示内心受痛苦、困扰；“忧伤”既保留内在痛楚，也不把词义限定为身体被刺透。
- source_word: רוּחִי
  choice: 我的灵
  rationale: 此处指但以理内在的灵，而非风或气息；直译为“我的灵”可保留原文的人观表达。
- source_word: בְּגוֹא נִדְנֶה
  choice: 在躯壳内
  rationale: בְּגוֹא表示“在……里面”；נִדְנֶה是罕见的“鞘、外壳”意象，这里比喻包容灵的身体。“躯壳”在中文中既自然又保留这一比喻。
- source_word: חֶזְוֵי רֵאשִׁי
  choice: 我脑海中的异象
  rationale: 原文形式上是“我头的异象”。“脑海中的异象”以现代汉语自然表达异象显现在头脑中的意思，同时保留其内在视觉经验。
- source_word: יְבַהֲלֻנַּנִי
  choice: 使我惊恐
  rationale: 该词表达强烈的惊慌和恐惧；“惊恐”比一般的“困扰”更符合其强度。
theological_decisions:
- issue: 灵与身体的关系
  choice: 保留“灵在躯壳内”的原文比喻
  alternative: 译作“我的灵在我里面忧伤”或“我内心忧伤”
  rationale: 原文使用罕见的“鞘、外壳”意象来描写灵在身体之内。正文保留这一意象，但不据此发展特定的人论体系；脚注说明其可能的通顺译法。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“至于我但以理”保留原文自我点明的语气；“脑海中的异象”避免生硬的“我头的异象”。
