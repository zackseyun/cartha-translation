  rationale: 将内在痛苦译为“愁烦”，以反映异象引起的烦乱；以中性的“身体”处理罕见的“鞘”比喻，并在脚注完整保留该意象和替代译法。调整标点与“头脑中的异象”，使中文更自然而仍贴近原文。
