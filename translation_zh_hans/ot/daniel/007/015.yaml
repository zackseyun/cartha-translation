  - severity: medium
    issue: “躯壳”带有不必要的贬义及可能的灵肉二分联想。
    rationale: נִדְנֶה确有“鞘、外壳”的罕见比喻，但中文“躯壳”通常暗示身体只是低贬的外在容器。正文用中性的“身体”更合适，脚注说明原文比喻即可。
  - severity: low
    issue: “脑海中的异象”较“头脑中的异象”稍远离原文的“头”。
    rationale: 两者都可通顺表达该异象习语；“头脑中的异象”在保留原文身体意象方面更直接。
  revised_text: 至于我——但以理——我的灵在我身体之内愁烦；我头脑中的异象使我惊惶。
