source:
  edition: WLC
  text: וּ/מִלִּ֗ין לְ/צַ֤ד עלי/א יְמַלִּ֔ל וּ/לְ/קַדִּישֵׁ֥י עֶלְיוֹנִ֖ין יְבַלֵּ֑א וְ/יִסְבַּ֗ר לְ/הַשְׁנָיָה֙ זִמְנִ֣ין וְ/דָ֔ת וְ/יִתְיַהֲב֣וּן בִּ/ידֵ֔/הּ עַד עִדָּ֥ן וְ/עִדָּנִ֖ין וּ/פְלַ֥ג עִדָּֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/025.yaml
  text: He will speak words against the Most High[a], and he will wear out the saints of the Most High. He will intend to change times and law, and they will be given into his hand for a time, times[c][b], and half a time.
translation:
  language: zh_hans
  text: 他必说出攻击至高者的话，也必摧残至高者的圣民；他企图改变时节[a]和律法。圣民[b]必被交在他手中，直到一段时期、若干时期和半段时期[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “时节”也可译作“节期”“时期”或“规定的时间”。
    reason: 保留 זִמְנִין 可泛指时间、时期，也可指固定或指定时节的词义范围。
  - marker: b
    text: 原文直译为“他们必被交在他手中”，没有明说“他们”是谁；按上下文，最自然是指圣民。
    reason: 说明被动复数动词隐含主语的语法与语境判断。
  - marker: c
    text: 原文直译为“直到一时、众时和半时”；“众时”为复数，未明确数目。这可能表示一个有限时期，也常被理解为三年半。
    reason: 保留启示文学时间公式的复数形式及其数值、单位上的歧义，避免在正文中固定为精确历年或纯象征解释。
lexical_decisions:
- source_word: מִלִּין לְצַד עֶלְיָא יְמַלִּל
  choice: 他必说话攻击至高者
  rationale: מִלִּין与יְמַלִּל共同表达“说话”，לְצַד在本语境中具有敌对意味。中文不必机械重复“言语”，如此既忠于原意，也自然庄重。
- source_word: קַדִּישֵׁי עֶלְיוֹנִין
  choice: 至高者的圣民
  rationale: 字面可译“至高者的圣者”；但本章语境主要指领受国度、遭受压迫的神圣群体。“圣民”在现代汉语中较易懂，同时不进一步限定其身份。
- source_word: יְבַלֵּא
  choice: 折磨
  rationale: 该动词有使之耗损、磨尽之意；“折磨”能自然表达持续压迫并使人疲惫耗损的作用。
- source_word: יִסְבַּר לְהַשְׁנָיָה
  choice: 企图改变
  rationale: יִסְבַּר表示思想、打算，后接“改变”的不定式；“企图”保留其意向性，不暗示他必然成功。
- source_word: זִמְנִין
  choice: 节期
  rationale: 该词可泛指时间，也可指规定的时期或节期。与“律法”并列时，“节期”较能体现制度或宗教历法层面的含义；脚注保留较宽泛的译法。
- source_word: דָת
  choice: 律法
  rationale: 该词可指法律、法令；在“节期和律法”的搭配中，“律法”自然且符合本段语境，同时未限定为某一具体法典。
- source_word: יִתְיַהֲבוּן בִּידֵהּ
  choice: 圣民必被交在他手中
  rationale: 动词是阳性复数被动式，主语在原文中省略。结合前句，最自然的所指是“圣民”；“交在他手中”保留原文以“手”表示权势的习语。
- source_word: עַד עִדָּן וְעִדָּנִין וּפְלַג עִדָּן
  choice: 直到一载、二载、半载
  rationale: עִדָּן是单数，עִדָּנִין是双数形式，随后为“半个时期”。“一载、二载、半载”简洁保留启示文学的公式表达，不直接换算成三年半。
theological_decisions:
- issue: “至高者的圣者/圣民”的所指
  choice: 正文译作“至高者的圣民”
  alternative: “至高者的圣者”，可能包括天上的圣者或天使
  rationale: 但以理书7章将这些圣者与领受国度的群体紧密相连，语境较支持神的子民；不过译文没有加入“以色列”或其他更具体的身份，以免消除原文仍有的张力。
- issue: 被交在他手中的对象
  choice: 在正文补明“圣民”
  alternative: 维持无明确主语的“他们”，或理解为节期与律法
  rationale: יִתְיַהֲבוּן是复数，而“律法”为单数；最近且最自然的复数先行项是“至高者的圣民”。脚注说明这是原文隐含而非明说的所指。
- issue: 末尾时间公式的意义
  choice: 保留“一载、二载、半载”的公式表达
  alternative: 直译“一时、二时、半时”，或解释为“三年半”/象征性的有限时期
  rationale: 原文没有直接使用“年”，该公式可能具有数值或象征意义。正文用传统而可懂的“载”，脚注说明其字面形式和可能含义，不引入特定末世论体系。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“至高者”“律法”“交在他手中”保留经文语体；“企图”准确表达意向而非成就。正文所有脚注标记均已对应列出。
