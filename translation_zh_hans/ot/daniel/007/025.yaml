  naturalness: 原文“说话攻击”可更自然、明确地译为“说出攻击……的话”；“时节和律法”既庄重也符合现代中文经文语体。“一段时期、若干时期和半段时期”虽保留公式性表达，但比“一时、众时”更易懂。
  terminology: “至高者”“圣民”“律法”“交在他手中”均恰当。“时节”比“节期”更宽，避免将 זִמְנִין 在正文限定为宗教节期；脚注可保留“节期/规定的时间”的可能性。“摧残”较好体现 יְבַלֵּא 所含持续消耗、使其疲惫的压迫意味。
