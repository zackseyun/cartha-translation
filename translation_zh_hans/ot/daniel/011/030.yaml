  text: וּ/בָ֨אוּ ב֜/וֹ צִיִּ֤ים כִּתִּים֙ וְ/נִכְאָ֔ה וְ/שָׁ֛ב וְ/זָעַ֥ם עַל בְּרִֽית ק֖וֹדֶשׁ וְ/עָשָׂ֑ה וְ/שָׁ֣ב וְ/יָבֵ֔ן עַל עֹזְבֵ֖י בְּרִ֥ית קֹֽדֶשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/030.yaml
  text: For ships of Kittim will come against him[a], and he will be disheartened. Then he will turn back and rage against the holy covenant, and he will act[b]. He will turn back and pay attention to those who forsake the holy covenant.
translation:
  language: zh_hans
  text: 因为基提的船只必来攻击他[a]，他就会气馁。随后他必回转，向圣约发怒，并采取行动。他又必回转，关注那些背弃圣约的人[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“从基提来的船只”。“基提”可指塞浦路斯，也可泛指西方的海上势力。
    reason: lexical_alternative
  - marker: b
    text: “关注”或译“眷顾”或“重视”。
    reason: lexical_alternative
lexical_decisions:
- source_word: צִיִּים כִּתִּים
  choice: 基提的战船
  rationale: צִיִּים在本语境中指航海船只或海上力量；כִּתִּים可指基提、塞浦路斯，也可泛指西方海上势力。“基提的战船”保留地名表达，同时符合军事语境。
- source_word: וְנִכְאָה
  choice: 他就会气馁
  rationale: 该词可表达受挫后的灰心、畏缩或受辱；“气馁”贴合军事政治语境，又不把含义强化为身体上的毁灭。
- source_word: וְשָׁב
  choice: 他必回转／他又必回转
  rationale: שׁוּב在此表示受挫后的转向或返回。译文保留原文两次出现的重复，并用“又”使叙事推进自然。
- source_word: וְזָעַם עַל
  choice: 向……发怒
  rationale: זעם表示对某对象发怒或倾泻愤怒；这一译法保留敌对意味，同时不擅自补出具体的迫害方式。
- source_word: בְּרִית קֹדֶשׁ / בְּרִית קוֹדֶשׁ
  choice: 圣约
  rationale: 直译为具有神圣性质的约。“圣约”简洁、庄重，也不把其所指解释得比原文更具体。
- source_word: וְעָשָׂה
  choice: 并采取行动
  rationale: עשה是宽泛的“做、行”。“采取行动”保留原文的简略，没有添加原文未明说的行动内容或目的。
- source_word: וְיָבֵן עַל
  choice: 关注
  rationale: בין在这里可表示留意、考虑或重视某人。“关注”自然且保持宽泛，不预先断定这是理解、结盟还是优待。
- source_word: עֹזְבֵי
  choice: 那些背弃……的人
  rationale: 该分词指离弃或抛弃圣约的人。“背弃”准确传达主动离弃和不忠的意味，同时避免使用带有后期技术色彩的称谓。
theological_decisions:
- issue: “圣约”的具体所指
  choice: 保留“圣约”，不在正文中进一步界定
  alternative: 上帝与以色列所立的约／犹太人的约
  rationale: 经文显然指向与圣民及其敬拜有关的约，但希伯来文本本身没有在本节作更具体的说明，译文不应代替文本消除这一开放性。
- issue: 王对背弃圣约者的态度
  choice: 译作“关注”，保留其行动性质的开放性
  alternative: 眷顾／重视／与……联合
  rationale: וְיָבֵן עַל可能含有留意或重视之意，但本节没有明确说明其关注是理解、利用、结盟还是优待，因此不作更窄的神学或历史判断。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。保留原文短促的叙事节奏、两次“回转”的重复，以及“采取行动”和“关注”在具体所指上的含混；“基提”保留传统地名，并以脚注说明其可能范围。
