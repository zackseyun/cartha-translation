id: DAN.11.35
reference: Daniel 11:35
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וּ/מִן הַ/מַּשְׂכִּילִ֣ים יִכָּֽשְׁל֗וּ לִ/צְר֥וֹף בָּ/הֶ֛ם וּ/לְ/בָרֵ֥ר וְ/לַ/לְבֵּ֖ן עַד עֵ֣ת קֵ֑ץ כִּי ע֖וֹד לַ/מּוֹעֵֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/035.yaml
  text: And some of those who have insight will stumble[a], so that they may be refined among them, purified, and made white, until the time of the end[d][c][b]; for it is still for the appointed time.
translation:
  language: zh_hans
  text: 有些明辨之人必跌倒[a]，为要在他们中间施行熬炼[b]，使他们洁净，并使他们洁白[c]，直到末期；因为所定的时候尚未来到[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“倒下”。希伯来语保留了绊跌的形象，也可能指人在迫害或考验中遭受败亡。
    reason: lexical_alternative
  - marker: b
    text: “在他们中间”也可理解为“借着他们”或“在他们身上”；希伯来语表达简约，可指熬炼发生在这群人中，也可指借他们所遭遇的事施行熬炼。
    reason: lexical_alternative
  - marker: c
    text: “使他们洁白”直译希伯来语的形象，表达洁净、除去杂质。
    reason: lexical_alternative
  - marker: d
    text: 原文也可较直译为：“因为这事仍要等到所定的时候。”
    reason: alternative_reading
lexical_decisions:
- source_word: וּמִן הַמַּשְׂכִּילִים
  choice: 有些明辨之人
  rationale: מִן与复数名词连用，在此表示其中一部分；הַמַּשְׂכִּילִים是具有洞察力、能明辨的人。译作“明辨之人”既保留其分词性质，也避免仅以“智慧人”弱化其洞察、领悟之意。
- source_word: יִכָּשְׁלוּ
  choice: 必跌倒
  rationale: כשל的尼法勒形可指绊跌或倒下。保留“跌倒”的形象，不预先限定这是殉难、受迫害、道德失败，还是一般性的受挫。
- source_word: לִצְרוֹף
  choice: 施行熬炼
  rationale: צרף源自冶炼金属、除去杂质的意象。结合后续不定式，此处表达这些人的跌倒所产生或所服务的炼净目的。
- source_word: בָּהֶם
  choice: 在他们中间
  rationale: 介词ב加代词的关系简约而有歧义；“在他们中间”保留熬炼发生于这群人之中的理解，同时以脚注注明“借着他们／在他们身上”的可能性。
- source_word: וּלְבָרֵר
  choice: 使他们纯净
  rationale: ברר在此可表达藉分离而清除杂质、洁净。中文采用使动表达，与前后的熬炼和洁白意象连贯。
- source_word: וְלַלְבֵּן
  choice: 使他们洁白
  rationale: לבן的希非勒形直指“使之变白”。“洁白”既保留具体色彩意象，也自然传达洁净含义，而不把形象完全抽象化为“使纯洁”。
- source_word: עַד עֵת קֵץ
  choice: 直到末期
  rationale: 这是《但以理书》中常见的时间表达，指向终局之时；“末期”简洁、庄重，并与原文保持接近。
- source_word: כִּי עוֹד לַמּוֹעֵד
  choice: 因为所定的日期尚未来到
  rationale: מוֹעֵד是指定、约定的时刻。希伯来文为省略式表达，中文补出“来到”，清楚表达终局仍须等候既定时刻，同时不说明由谁指定。
theological_decisions:
- issue: 明辨之人的跌倒与熬炼之间的关系
  choice: 译为“为要”，保留目的或结果意味
  alternative: 仅将后续动词理解为与跌倒并列的预言，不表达目的
  rationale: יִכָּשְׁלוּ之后连续使用ל不定式，最自然地表示目的或结果。译文呈现苦难具有熬炼作用，却不据此扩展成完整的苦难论或成圣教义。
- issue: “跌倒”的具体所指
  choice: 保留形象，不明确限定为殉难、迫害中的失败或道德背离
  alternative: 直译为“被杀”“败亡”或“犯罪跌倒”
  rationale: 上下文可能涉及迫害和倒下，但כשל本身仍保留较宽的语义范围；不应在正文中消除这种张力。
- issue: 熬炼的施行者
  choice: 采用无明确施行者的表达“施行熬炼”
  alternative: 补出“上帝要熬炼他们”或“敌人要熬炼他们”
  rationale: 原句没有明说施行者。中文不擅自补出上帝或迫害者，可避免把隐含的神学因果关系解释得过满。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“明辨之人”“熬炼”“洁白”“末期”等词保留《但以理书》的智慧与炼净意象；句法适度调整为自然中文，同时通过脚注保留בָּהֶם及末句省略结构的歧义。
