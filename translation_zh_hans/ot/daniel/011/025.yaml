source:
  edition: WLC
  text: וְ/יָעֵר֩ כֹּח֨/וֹ וּ/לְבָב֜/וֹ עַל מֶ֣לֶךְ הַ/נֶּגֶב֮ בְּ/חַ֣יִל גָּדוֹל֒ וּ/מֶ֣לֶךְ הַ/נֶּ֗גֶב יִתְגָּרֶה֙ לַ/מִּלְחָמָ֔ה בְּ/חַֽיִל גָּד֥וֹל וְ/עָצ֖וּם עַד מְאֹ֑ד וְ/לֹ֣א יַעֲמֹ֔ד כִּֽי יַחְשְׁב֥וּ עָלָ֖י/ו מַחֲשָׁבֽוֹת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/025.yaml
  text: And he will stir up his power and his heart against the king of the South with a great army[a], and the king of the South will engage in battle with a very great and mighty army, but he will not stand[b], for they will devise schemes against him.
translation:
  language: zh_hans
  text: 他必激发自己的力量和勇气，率领大军攻击南方王；南方王也必率领一支极其庞大而强盛的军队奋起迎战。然而，他必站立不住[a]，因为他们要谋划对付他[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不能取胜”或“守不住阵地”。希伯来文直译为“不能站立”。
    reason: lexical_alternative
  - marker: b
    text: 也可译：“因为他们要策划反对他。”希伯来文用了同根词，直译为“他们要对他筹划计谋”。谋划者的身份没有明说。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָעֵר כֹּחוֹ וּלְבָבוֹ
  choice: 他必激发自己的力量和勇气
  rationale: העיר 的使役形表示激发、调动；כֹּחַ 译为“力量”，לֵבָב 在战争语境中指内在的胆量和决心，译作“勇气”比直译“心”更自然，同时保留力量与意志并举的表达。
- source_word: עַל מֶלֶךְ הַנֶּגֶב
  choice: 攻击南方王
  rationale: עַל 在这里表示敌对方向；נֶגֶב 在《但以理书》11章是地缘政治上的方位称号，故译“南方王”。
- source_word: בְּחַיִל גָּדוֹל
  choice: 率领大军
  rationale: חַיִל 在军事语境中指军队；介词短语以自然汉语表达为“率领大军”。
- source_word: יִתְגָּרֶה לַמִּלְחָמָה
  choice: 奋起迎战
  rationale: גרה 的 Hitpael 形在此表示使自己投入战争、应战；“奋起迎战”兼顾自主发动和交战语境。
- source_word: בְּחַיִל גָּדוֹל וְעָצוּם עַד מְאֹד
  choice: 率领一支极其庞大而强盛的军队
  rationale: גָּדוֹל 表规模庞大，עָצוּם 表强盛，עַד־מְאֹד 加强程度；译文分别保留这些成分。
- source_word: וְלֹא יַעֲמֹד
  choice: 然而，他必站立不住
  rationale: 保留 עמד“站立”的希伯来语意象，同时现代汉语“站立不住”也可表达无法维持阵地或不能取胜；代词按最近的主语指南方王。
- source_word: יַחְשְׁבוּ עָלָיו מַחֲשָׁבוֹת
  choice: 有人要设计谋害他
  rationale: 原文是同根词结构，字面为“对他筹划计谋”；“设计谋害”表达其敌对阴谋含义。主语仅是复数动词而未明确身份，因此用不定称“有人”，避免擅自指认。
theological_decisions:
- issue: “他必站立不住”所指对象
  choice: 按语法上的最近主语，理解为南方王
  alternative: 理解为前文率军攻击南方王的那位王
  rationale: 前一分句的明确主语是“南方王”，其后单数“他”最自然地回指该主语；不过希伯来语代词本身不点名，译文不增加身份称谓。
- issue: 设计谋害者的身份
  choice: 保留为未明确的“有人”
  alternative: 具体解释为南方王的臣属、同盟者或宫廷人员
  rationale: 经文本身只使用第三人称复数动词，没有说明谋划者身份；不把历史重构写入正文。
translation_notes:
  register: 采用现代、庄重且易懂的叙事语言。“南方王”沿用本章方位性王号；“率领大军”“奋起迎战”使军事动作符合自然汉语。正文保留“站立不住”的源语意象，并以脚注说明其可能的语用含义。
