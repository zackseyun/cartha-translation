reference: Daniel 11:17
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/יָשֵׂ֣ם פָּ֠נָי/ו לָ/ב֞וֹא בְּ/תֹ֧קֶף כָּל מַלְכוּת֛/וֹ וִ/ישָׁרִ֥ים עִמּ֖/וֹ וְ/עָשָׂ֑ה וּ/בַ֤ת הַ/נָּשִׁים֙ יִתֶּן ל֣/וֹ לְ/הַשְׁחִיתָ֔/הּ וְ/לֹ֥א תַעֲמֹ֖ד וְ/לֹא ל֥/וֹ תִהְיֶֽה׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/017.yaml
  text: He will set his face to come with the strength of his whole kingdom[a], and upright terms will be with him; and he will act. He will give him the daughter of women to destroy it, but she will not stand[d][c][b], and she will not be for him.
translation:
  language: zh_hans
  text: 他必定意要带着全国之力而来，并带着公平的条件[a]；他必行事。他要把“女子的女儿”给对方[b]，为要毁坏她[c]；但她不能立住[d]，她也不会归他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “公平的条件”所对应的希伯来语短语字面可理解为“正直的人与他同在”，也可能指公平的条件或双方达成的协议；本句在上下文中的确切意思不明。
    reason: alternative_reading
  - marker: b
    text: 希伯来语作“女子的女儿”，可能指一位被安排嫁出的王室女子；许多人按历史背景理解为政治联姻中的公主。
    reason: cultural_note
  - marker: c
    text: “毁坏她”中的希伯来语后缀为阴性单数，既可能指这名女子，也可能指某个阴性所指对象，如王国或计谋。
    reason: lexical_alternative
  - marker: d
    text: 或译：“但这事不能成立”或“但她不会成功。”阴性动词可能指这名女子，也可能指这项计谋。
    reason: alternative_reading
lexical_decisions:
- source_word: וְיָשֵׂם פָּנָיו
  choice: 他必定意
  rationale: 这是表示坚定决意、定向而行的希伯来语习语。译作“定意”保留其坚决意味，又比直译“摆正他的脸”更符合现代汉语。
- source_word: לָבוֹא בְּתֹקֶף כָּל מַלְכוּתוֹ
  choice: 带着全国的力量前来
  rationale: בוא 本义宽泛，故用“前来”而不直接增译为“入侵”；תֹּקֶף 表示力量或强力，整句呈现动用整个王国实力的含义。
- source_word: וִישָׁרִים עִמּוֹ
  choice: 并与对方订立公平的协议
  rationale: ישרים 字面为“正直的／公平的（复数）”，此处语境艰深。正文采用在外交语境中较通顺的“公平的协议”，脚注保留“正直的人与他同在”等可能。
- source_word: וְעָשָׂה
  choice: 他必采取行动
  rationale: עשה 含义宽泛；此译保持开放，不擅自说明行动的具体内容。
- source_word: וּבַת הַנָּשִׁים
  choice: “女子之女”
  rationale: 保留希伯来语罕见表达及其陌生感；其在本段中很可能指用于婚姻联盟的王室女子，但正文不把这一历史解释写死。
- source_word: יִתֶּן לוֹ
  choice: 给对方
  rationale: לוֹ 字面为“给他”。因本节有两个男性角色，汉语用“对方”较清楚地表示所指的另一位君王，同时不补入其身份。
- source_word: לְהַשְׁחִיתָהּ
  choice: 企图使其败坏
  rationale: 阴性单数后缀可能指该女子，也可能指某个阴性所指对象，如王国或计谋。“其”避免在正文中过早固定对象；“企图”表达此不定式所陈明的目的。
- source_word: וְלֹא תַעֲמֹד
  choice: 但她（或这计谋）不能立住
  rationale: 动词为阴性单数，可指女子，也可指计划。正文以邻近的女子为表层所指，同时用括注和脚注明确保留另一可能；“立住”保存 עמד 的意象及“成功、持续”的语义张力。
- source_word: וְלֹא לוֹ תִהְיֶה
  choice: 她也不会归他
  rationale: 原文关系表达简短，可涉及归属、支持或效忠。“归他”在汉语中保留婚姻与政治立场两方面的可能。
theological_decisions:
- issue: 阴性动词及代词所指
  choice: 不将其唯一确定为女子或政治计谋
  alternative: 全都解释为该女子，或全都解释为王国／计谋
  rationale: 希伯来语语法只明确阴性单数，语境不足以排除任何一项主要可能；译文和脚注因此保留这项真实歧义。
translation_notes:
  register: 采用现代、庄重而可朗读的标准普通话。“定意”“立住”“归他”适度保留原文意象；对罕见短语“女子之女”加引号并以脚注解释。两位男性角色并存处用“对方”减少汉语代词混淆，而不增添专名或历史身份。
