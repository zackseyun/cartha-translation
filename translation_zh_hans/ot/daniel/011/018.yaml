  text: Then he will turn his face to the coastlands and capture many[b][a]. But a commander will put an end to his reproach against him; indeed, he will repay his reproach to him.
translation:
  language: zh_hans
  text: 此后，他必转向沿海地区[a]，攻取许多[b]。但有一位统帅必使他加在自己身上的羞辱止息；他还要把这羞辱还在他身上[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“岛屿”。这里的希伯来词既可指岛屿，也可泛指沿海或海上地区。
    reason: lexical_alternative
  - marker: b
    text: 原文只说“许多”，没有说明是许多地方、城邑还是人。
    reason: source_ambiguity
  - marker: c
    text: 本节末句的希伯来文十分难解，主语和代词所指并不完全明确。也可理解为：“一位统帅必使他的羞辱止息，而不让羞辱转回到自己身上。”
    reason: alternative_reading
lexical_decisions:
- source_word: וישב פניו
  choice: 他必转向
  rationale: 该短语直译为“转过脸来”，在这里表示转而朝向新的地区或目标。中文用“转向”自然传达这一意象和行动方向。
- source_word: לאיים
  choice: 沿海地区
  rationale: אִיִּים既可指岛屿，也可广指海岸地带或海上区域。“沿海地区”适合此处军事行动的语境，同时在脚注保留“岛屿”这一可能。
- source_word: ולכד רבים
  choice: 攻取许多
  rationale: לכד表示捕获、夺取或攻占；军事语境中“攻取”最自然。רבים没有明说所修饰的名词，因此不擅自限定为地方、人民或城邑。
- source_word: קצין
  choice: 一位统帅
  rationale: קָצִין可指领袖、官长或军事长官；本节处于战争语境，“统帅”贴切而不指定具体历史人物。
- source_word: והשבית
  choice: 必使……止息
  rationale: 这是שבת的使役形，表示使某事停止。“使……止息”既贴近原文，也保持庄重语体。
- source_word: חרפתו לו
  choice: 他加给自己的羞辱
  rationale: חֶרְפָּה可指羞辱、凌辱或耻辱。此处代词关系紧缩而含混；正文采用较可能的理解，即前述君王加给统帅的羞辱，同时用脚注说明句法歧义。
- source_word: בלתי חרפתו ישיב לו
  choice: 他更要把这羞辱还到他身上
  rationale: ישיב本义为“使返回”，此处可表达将羞辱反加于原施加者。将בלתי理解为加强或附加语气，以“更要”表达；脚注同时保留另一种把它理解为“不给自己招致羞辱”的读法。
theological_decisions:
- issue: 后半节的主语、代词所指及בלתי的语义
  choice: 统帅制止前述君王加给自己的羞辱，并把这羞辱反加到君王身上
  alternative: 统帅使羞辱止息，而自己的羞辱不会反落到自己身上；或统帅除去自己所受的羞辱
  rationale: 希伯来文后两小句高度压缩，代词指向和בלתי的功能均有争议。正文采用较自然的报应或逆转读法，但不点名任何历史人物，并在脚注明确保留其他句法可能，避免把有争议的解释写成唯一结论。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“此后”“统帅”“止息”等词保持预言叙事的正式感；避免直接加入罗马或任何具体历史人物的身份。正文尽量保留原文“许多”的省略和末句的张力，必要信息置于脚注。
