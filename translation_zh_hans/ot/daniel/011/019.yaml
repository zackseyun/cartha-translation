base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/019.yaml
  text: Then he will turn his face toward the fortresses of his own land[a], but he will stumble and fall[b], and he will not be found.
translation:
  language: zh_hans
  text: 于是，他必转向自己国中的堡垒[a]，却要绊跌、倒下，不复被人寻见[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“要塞”。希伯来语泛指坚固、防守或可供避难之处。
    reason: lexical_alternative
  - marker: b
    text: “不复被人寻见”是含蓄的说法，表示他从此退出历史舞台，可能是死亡或被推翻，但原文没有明说其方式。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָשֵׁב פָּנָיו
  choice: 于是，他必转向
  rationale: שׁוב与“他的脸”连用，表示改变朝向。汉语用“转向”自然传达这一动作；“于是”体现叙事推进，而不把它仅仅解释为返回。
- source_word: לְמָעוּזֵּי
  choice: 向……堡垒
  rationale: מָעוֹז可指坚固、防守或避难之处；本节军事政治语境中，“堡垒”贴切，同时脚注保留较宽泛的“要塞”选择。
- source_word: אַרְצוֹ
  choice: 自己国中的
  rationale: אֶרֶץ在此指其领土或本国。“自己国中”明确这些堡垒属于他的国家，未超出原文所有关系。
- source_word: וְנִכְשַׁל וְנָפַל
  choice: 却要绊跌、倒下
  rationale: 分别保留כשל的“绊跌”和נפל的“倒下”，维持原文连续而带有比喻色彩的失败描写；“却”体现上下文的转折。
- source_word: וְלֹא יִמָּצֵא
  choice: 不复被人寻见
  rationale: 保留מצא被动式“被寻见”的含蓄表达，不直接断定其死亡或被推翻；“不复”自然表达他从此退出历史场景。
theological_decisions:
- issue: “不被寻见”是否应明译为死亡或覆亡
  choice: 保留“不复被人寻见”的间接说法
  alternative: 译作“便消亡了”或“被杀身亡”
  rationale: 原文只说“不会被找到”，虽可能暗示死亡、覆亡或退出舞台，却没有明说具体方式；译文不应消除这种含蓄与开放性。
translation_notes:
  register: 采用庄重而自然的现代汉语。“转向”“绊跌、倒下”保留希伯来语的方向和动作意象；“不复被人寻见”略带书面色彩，以传达原文含蓄、终局性的语气。所有脚注标记均已置于正文对应位置。
