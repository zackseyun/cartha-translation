base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/023.yaml
  text: And from the time of an alliance with him[a], he will act deceitfully; and he will rise and become strong with a small nation.
translation:
  language: zh_hans
  text: 他与那人结盟以后，就行诡诈；他必兴起，靠一个小国变得强大。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “靠一个小国”也可译作“靠少数人”。希伯来语 בִּמְעַט גּוֹי 表达紧凑，可能指一个人数不多或势力弱小的民族，也可能强调使他强大的只是少数人。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִן הִתְחַבְּרוּת אֵלָיו
  choice: 他与那人结盟之后
  rationale: הִתְחַבְּרוּת 是源于 חבר 的动名词，在本段政治语境中指结盟；מִן 在此引出结盟以后随之发生的行动。אֵלָיו 直译为“向他”，但汉语以“与那人结盟”自然表达其关系义，并保留所指对象在上下文中的指代。
- source_word: יַעֲשֶׂה מִרְמָה
  choice: 就会施行诡诈
  rationale: 该短语直指采取欺诈、背信的手段。“施行诡诈”保留名词 מִרְמָה 的力度，也符合庄重而自然的现代汉语。
- source_word: וְעָלָה
  choice: 他必兴起
  rationale: עלה 可指上升、兴起；此处描述政治势力的上升，用“兴起”既贴近原义，又避免过度限定为军事进军。
- source_word: וְעָצַם
  choice: 变得强大
  rationale: עצם 在此表示力量增长、成为强盛；“变得强大”保留其渐成或结果意味。
- source_word: בִּמְעַט גּוֹי
  choice: 靠少数人
  rationale: 该紧凑短语可理解为“凭少数人”，也可能指“凭一个小国／弱小民族”。正文采用自然且较能表达有限人数之意的“靠少数人”，并以脚注保留集体政治实体的可能解释。
