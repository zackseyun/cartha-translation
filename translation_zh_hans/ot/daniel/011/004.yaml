  text: וּ/כְ/עָמְד/וֹ֙ תִּשָּׁבֵ֣ר מַלְכוּת֔/וֹ וְ/תֵחָ֕ץ לְ/אַרְבַּ֖ע רוּח֣וֹת הַ/שָּׁמָ֑יִם וְ/לֹ֣א לְ/אַחֲרִית֗/וֹ וְ/לֹ֤א כְ/מָשְׁל/וֹ֙ אֲשֶׁ֣ר מָשָׁ֔ל כִּ֤י תִנָּתֵשׁ֙ מַלְכוּת֔/וֹ וְ/לַ/אֲחֵרִ֖ים מִ/לְּ/בַד אֵֽלֶּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/004.yaml
  text: And as soon as he has arisen[a], his kingdom will be broken and divided toward the four winds of heaven, but not to his posterity, and not according to the dominion with which he ruled[b]; for his kingdom will be uprooted and given to others besides these.
translation:
  language: zh_hans
  text: 他一兴起，他的国就必破裂，分裂到天的四方[a]；却不归给他的后裔[b]，也不会有他所掌握的那样的权势。因为他的国必被拔除，归给另一些人，不归给这些人[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“天的四风”，是指四面八方，即四个方位。
    reason: cultural_note
  - marker: b
    text: “后裔”所译的希伯来语也可直译为“他的后来”或“他的末后”；在这里指他之后承继王位的人。
    reason: lexical_alternative
  - marker: c
    text: “这些人”所指并不完全明确；译文保留原文的指示性和歧义。
    reason: referential_ambiguity
lexical_decisions:
- source_word: וּכְעָמְדוֹ
  choice: 他一兴起
  rationale: עמד在此处指王兴起并立稳权位，而非单指身体站立；“一……就……”自然表达其兴起后国度随即破裂的紧密时序。
- source_word: תִּשָּׁבֵר מַלְכוּתוֹ
  choice: 他的国就必破裂
  rationale: שבר的被动式表示国度被打破；“破裂”也与下文被分割相衔接。מַלְכוּת在此指可被分割的政治国度。
- source_word: וְתֵחָץ לְאַרְבַּע רוּחוֹת הַשָּׁמָיִם
  choice: 分向天的四风
  rationale: 保留希伯来语方向性的图像和“四风”惯用语，不在正文中直接改写为四个方位。
- source_word: וְלֹא לְאַחֲרִיתוֹ
  choice: 但不会归给他的后裔
  rationale: אַחֲרִית字面涉及“后来、末后”，在王朝承继语境中指王之后的人，即后裔；中文用“归给”承接国度的分配。
- source_word: וְלֹא כְמָשְׁלוֹ אֲשֶׁר מָשָׁל
  choice: 其权势也不再像他掌权时那样
  rationale: 以“权势／掌权”体现同根的名词和动词，同时避免生硬重复，并保留后来统治规模或强度不及从前的比较。
- source_word: תִנָּתֵשׁ מַלְכוּתוֹ
  choice: 他的国必被拔除
  rationale: נתש具有连根拔起、强行移除的意象；“拔除”保留该隐喻及被动语态。
- source_word: וְלַאֲחֵרִים מִלְּבַד אֵלֶּה
  choice: 归给这些人以外的其他人
  rationale: “归给”是由上下文所许可的最小补足；“这些人”保留אֵלֶּה的指示性及其所指对象可能存在的歧义。
theological_decisions:
- issue: 是否在译文中指明该王及国度分裂后的历史人物
  choice: 不加入任何历史身份，只翻译王的兴起、国度破裂和转归
  alternative: 在正文中将该王及继承者明确认定为特定历史人物
  rationale: 本节本身没有写出这些名字；历史认定属于注释或释经范围，不应进入正文。
- issue: “这些人”所指为何
  choice: 正文保留指示代词，并用脚注说明其指向并不完全明确
  alternative: 直接释为“他的后裔以外的人”或“那四方统治者以外的人”
  rationale: אֵלֶּה的先行对象在句法和语境上并非绝对明确，译文不应暗中排除可能读法。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“一兴起……就……”体现迅速转折；“四风”“拔除”等保留原文意象，并借脚注解释文化表达和指代歧义。
