source:
  edition: WLC
  text: וְ/גַ֣ם אֱֽלֹהֵי/הֶ֡ם עִם נְסִֽכֵי/הֶם֩ עִם כְּלֵ֨י חֶמְדָּתָ֜/ם כֶּ֧סֶף וְ/זָהָ֛ב בַּ/שְּׁבִ֖י יָבִ֣א מִצְרָ֑יִם וְ/הוּא֙ שָׁנִ֣ים יַעֲמֹ֔ד מִ/מֶּ֖לֶךְ הַ/צָּפֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/008.yaml
  text: He will also carry off to Egypt their gods[a], with their cast images and with their precious vessels of silver and gold, as plunder; and for some years he will stand aloof from the king of the north.
translation:
  language: zh_hans
  text: 他也要把他们的神明、铸像，以及金银制成的珍贵器皿，当作战利品带到埃及去；在若干年间，他将远离北方王。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他将比北方王多持续几年”，又或：“他将在多年间强于北方王。”希伯来语此句十分简略，其中的介词也可能表示比较，而不一定表示疏远或不交战。
    reason: alternative_reading
lexical_decisions:
- source_word: וְגַם
  choice: 也
  rationale: 保留承接上文的附加、强调意味，同时符合现代汉语表达。
- source_word: אֱלֹהֵיהֶם
  choice: 他们的神明
  rationale: 原文是复数，指战败者所敬奉的诸神；“神明”既保留其宗教指称，也不额外加入“偶像”等评价。
- source_word: נְסִכֵיהֶם
  choice: 铸像
  rationale: 该词指以熔铸方式制成的像；“铸像”简洁自然，并保留制作方式。
- source_word: כְּלֵי חֶמְדָּתָם
  choice: 珍贵器皿
  rationale: כְּלֵי 可指器具、器皿，חֶמְדָּתָם 表示可珍爱、贵重之物；在圣殿或王室财宝语境中，“珍贵器皿”贴切而不失宽度。
- source_word: כֶּסֶף וְזָהָב
  choice: 金银制成的
  rationale: 将材料说明自然地修饰“珍贵器皿”；汉语习惯先说“金”后说“银”，不改变所指。
- source_word: בַּשְּׁבִי
  choice: 当作战利品
  rationale: 这里被带走的是神像和贵重器物，语境为战争掳掠，因此译作“战利品”比字面上的“被掳”更适合物品。
- source_word: יָבִא מִצְרָיִם
  choice: 带到埃及去
  rationale: בוא 的使役式表示“带去、带来”；结合战利品语境，译文已借“当作战利品”表达强行掳走之意。
- source_word: שָׁנִים
  choice: 随后几年
  rationale: 原文仅说“多年／几年”，没有具体数目；“随后几年”在汉语中自然表达一段未定的年数及叙事上的后续。
- source_word: יַעֲמֹד מִמֶּלֶךְ הַצָּפוֹן
  choice: 与北方王保持距离
  rationale: 保留 עמד 与 מן 所可能表达的站开、离开或不接近之意，避免在正文中进一步解释为“不发动攻击”；比较义的可能性留在脚注。
theological_decisions:
- issue: וְהוּא שָׁנִים יַעֲמֹד מִמֶּלֶךְ הַצָּפוֹן 的压缩句法
  choice: 理解为他有几年与北方王保持距离
  alternative: 也可理解为“他将比北方王多维持几年”，或“他将多年强于北方王”
  rationale: עמד 与 מן 可表达分离或疏远，但 מן 也可能具有比较作用。正文以较能保留动词意象的分离义呈现，脚注则保留比较义，避免武断消除原文歧义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“神明”避免把原文直接解释成带贬义的“偶像”；“与……保持距离”保留原文的空间意象和军事上的不接触意味。脚注标记置于真正存在歧义的末句，而非“神明”之后。
