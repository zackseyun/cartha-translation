  text: וְ/יִטַּע֙ אָהֳלֶ֣י אַפַּדְנ֔/וֹ בֵּ֥ין יַמִּ֖ים לְ/הַר צְבִי קֹ֑דֶשׁ וּ/בָא֙ עַד קִצּ֔/וֹ וְ/אֵ֥ין עוֹזֵ֖ר לֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/045.yaml
  text: He will pitch the tents of his royal pavilion between the seas and the beautiful holy mountain[a]; yet he will come to his end[b], and there will be no one to help him.
translation:
  language: zh_hans
  text: 他要在众海和圣洁荣美的山之间，支搭他王室行宫的营帐[a]；然而，他必走到尽头，无人帮助他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “王室行宫”所译的希伯来词十分罕见，也可理解为“宫殿”“华贵的营帐”或“行宫”。这里可能指王室居所或君王出征时的营帐行馆。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִטַּע
  choice: 搭起
  rationale: נטע本义为“栽种”，以帐篷为宾语时指搭设、支起；“搭起”符合现代汉语搭配，同时保留具体动作感。
- source_word: אָהֳלֵי
  choice: 帐篷
  rationale: 保留希伯来语复数所表达的营帐群概念；汉语名词通常不以形态标示复数，结合“王家行宫”可自然理解为一组营帐。
- source_word: אַפַּדְנוֹ
  choice: 他王家行宫的
  rationale: 这是罕见词，可能指宫殿、华贵营帐或王室行馆。置于“帐篷”之后，“王家行宫”既体现王室性质，也避免将其限定为永久性的石造宫殿。
- source_word: בֵּין יַמִּים
  choice: 在众海之间
  rationale: 原文为复数“海”；“众海之间”保留其复数和地理表达，不擅自确定具体水域。
- source_word: לְהַר צְבִי קֹדֶשׁ
  choice: 圣洁荣美的山那里
  rationale: צבי可表示荣美、华美或荣耀；“圣洁荣美的山”保留修饰关系和诗性。介词ל在此与“在……之间”共同构成位置表达，译作“那里”使汉语通顺，同时不把地点进一步明确为锡安或耶路撒冷。
- source_word: וּבָא עַד קִצּוֹ
  choice: 然而，他必走到尽头
  rationale: 直译意象为“来到他的尽头”。“走到尽头”是自然而庄重的汉语，也保留其结局为何的概括性；“然而”体现上下文中其权势与最终败亡之间的转折。
- source_word: וְאֵין עוֹזֵר לוֹ
  choice: 无人帮助他
  rationale: 简洁保留“没有帮助他的人”之意，清楚表达他最终孤立无援。
theological_decisions:
- issue: 但以理书11:45中王的身份
  choice: 正文仅以“他”指称，不辨明其身份。
  alternative: 可解释为安条克四世、末世敌基督人物，或兼具历史与预表意义的统治者。
  rationale: 希伯来文只使用第三人称动词和代词后缀；具体身份存在解释争议，不应由译文替读者作出神学判定。
- issue: “圣洁荣美的山”的具体所指
  choice: 正文保留地理称谓，不直接增译“锡安”或“耶路撒冷”。
  alternative: 将其明确解释为锡安山或耶路撒冷。
  rationale: 上下文很可能指向耶路撒冷／锡安，但原文未直接使用这些名称；保留原称谓可避免把高度可能的解释写成明说。
- issue: “走到尽头”的具体方式
  choice: 保留概括性的“走到尽头”。
  alternative: 明确译为死亡、覆亡或遭受审判。
  rationale: קִצּוֹ说明他的终局，却未在本节明确交代终结的方式；译文不应额外限定。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“圣洁荣美的山”保留原文凝练的诗性与可能的歧义；“王家行宫的帐篷”保留复数营帐和罕见王室居所词之间的结构关系。正文脚注标记[a]与脚注完全对应。
