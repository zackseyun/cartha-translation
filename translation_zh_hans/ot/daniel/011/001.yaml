base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/001.yaml
  text: And as for me[a], in the first year of Darius the Mede[b], I stood up to strengthen and be a fortress to him.
translation:
  language: zh_hans
  text: 至于我[a]，在米底人大利乌[b]元年，我站出来扶助他，作他的保障。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文较直译作：“至于我，在米底人大利乌元年，我站出来，为要扶助他，并作他的坚固保障。”
    reason: lexical_alternative
  - marker: b
    text: 希伯来文传统将本句列为《但以理书》11:1；有些英文经文章节编排将其计为10:21下半节至11:1，或将其置于11:1而段落划分略有不同。
    reason: versification
lexical_decisions:
- source_word: וַאֲנִי
  choice: 至于我
  rationale: 独立代词带有轻微强调，并承接前文、转回说话者；“至于我”自然保留这一话语转换。
- source_word: בִּשְׁנַת אַחַת
  choice: 元年
  rationale: 在君王纪年语境中指第一年；现代汉语以“元年”表达最简洁自然。
- source_word: לְדָרְיָוֶשׁ הַמָּדִי
  choice: 米底人大利乌
  rationale: 按现代中文圣经人名惯例音译专名，并将族属称号译出。
- source_word: עָמְדִי
  choice: 曾起来
  rationale: עמד 基本义为站立、起来或站出来；结合上下文的主动支持含义，译作“起来”而不额外解释行动方式。“曾”体现希伯来语完成体在回顾往事时的语境功能。
- source_word: לְמַחֲזִיק
  choice: 扶助
  rationale: 使役意义表示使之坚强、支持；“扶助”兼顾给予力量与实际支持，也适合人际及政治语境。
- source_word: וּלְמָעוֹז
  choice: 作他的保障
  rationale: מָעוֹז 是名词，指坚固之处、堡垒或保障。保留名词性比单译为“保护”更贴近原文，而“保障”在现代汉语中比“作堡垒”自然。
- source_word: לוֹ
  choice: 他／他的
  rationale: 阳性单数代词在近邻语境中最自然地指大利乌；中文依两个并列成分分别表达为“他”和“他的”。
theological_decisions:
- issue: 说话者及第三人称代词的所指
  choice: 让说话者承接前文的天使性人物，并让“他”自然指向大利乌，但不在正文中增添身份说明。
  alternative: 不同章节划分可能使本句更明显地被视为上一段的结尾；也有人可能从更广语境讨论代词所指。
  rationale: 希伯来语本句没有明确重述说话者身份。译文应保持叙事连续性，不加入推测性的天使姓名或神学认定；阳性单数代词以最近的男性先行词大利乌为自然所指。
- issue: מָעוֹז 的形象是否保留
  choice: 译作“作他的保障”，保留原文名词性和成为坚固依靠的意味。
  alternative: 译作“保护他”较流畅；译作“作他的堡垒／坚垒”则更具象、更直译。
  rationale: 原文并非普通的“保护”动词，而是名词“坚固之处、堡垒”。“保障”兼顾现代可懂度和原文意象，不把比喻过度具体化。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“元年”符合中文纪年习惯；“扶助……作他的保障”保留两个并列目的成分及第二项的名词性。所有脚注标记均置于正文中。
