  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: בְּ/שַׁלְוָ֞ה וּ/בְ/מִשְׁמַנֵּ֣י מְדִינָה֮ יָבוֹא֒ וְ/עָשָׂ֗ה אֲשֶׁ֨ר לֹא עָשׂ֤וּ אֲבֹתָי/ו֙ וַ/אֲב֣וֹת אֲבֹתָ֔י/ו בִּזָּ֧ה וְ/שָׁלָ֛ל וּ/רְכ֖וּשׁ לָ/הֶ֣ם יִבְז֑וֹר וְ/עַ֧ל מִבְצָרִ֛ים יְחַשֵּׁ֥ב מַחְשְׁבֹתָ֖י/ו וְ/עַד עֵֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/024.yaml
  text: 'In a time of security he will come into the richest parts of the province[a], and he will do what neither his fathers nor his fathers’ fathers did: he will scatter among them plunder, spoil, and goods; and against fortresses he will devise his plans[c][b], but only until a time.'
translation:
  language: zh_hans
  text: 他会在局势安稳时，进入境内最富庶的地区[a]，做他父辈和父辈的父辈未曾做过的事：把掳物、战利品和财物分散给他们[b]；又会筹划计策对付堡垒[c]，但只到某个时候为止[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在局势安稳时”也可译作“安然地”或“出其不意地”；“境内”也可译作“省内”或“辖区内”。
    reason: lexical_alternative
  - marker: b
    text: “分散给他们”也可译作“散给他们”或“分给他们”。原文保留了“撒散”的形象。
    reason: lexical_alternative
  - marker: c
    text: 或译：“他会设谋对付堡垒。”
    reason: alternative_reading
  - marker: d
    text: 或译：“直到指定的时候”，或“但只维持一段时间”。原文直译为“直到一个时候”，没有明说该时候是“指定的”。
    reason: theological_ambiguity
lexical_decisions:
- source_word: בְּשַׁלְוָה
  choice: 趁局势安稳
  rationale: שַׁלְוָה可指安宁、安逸或安全稳定的状态。此处译为“趁局势安稳”，既保留政治军事环境中的安稳背景，也传达乘机而入的语境意味，同时不把它直接强化为“入侵”。
- source_word: וּבְמִשְׁמַנֵּי מְדִינָה
  choice: 进入境内最富庶的地区
  rationale: מִשְׁמַנִּים字面与“肥美”有关，此处惯用义为富饶、富庶之地；מְדִינָה可指行政区、辖区或国境内的区域。“境内最富庶的地区”在现代汉语中自然，并避免过度确定其行政层级。
- source_word: יָבוֹא
  choice: 进入
  rationale: 原动词是普通的“来、进入”，上下文虽有军事意味，却不必直接译成更强的“入侵”。
- source_word: וְעָשָׂה אֲשֶׁר לֹא עָשׂוּ
  choice: 做……未曾做过的事
  rationale: 直接保留原文对其行为与前代所为的强调性比较。
- source_word: אֲבֹתָיו וַאֲבוֹת אֲבֹתָיו
  choice: 他列祖和列祖的祖先
  rationale: 尽量保留希伯来文“他的父辈和他父辈的父辈”的重复层次与修辞力度；“列祖”比逐字的“父亲们”更符合现代汉语历史叙事语体。
- source_word: בִּזָּה וְשָׁלָל וּרְכוּשׁ
  choice: 掳物、战利品和财物
  rationale: 保留三个彼此相近却不完全相同的名词所形成的累积效果；“财物”自然表达רְכוּשׁ所指的产业或财富。
- source_word: לָהֶם יִבְזוֹר
  choice: 散给众人
  rationale: בזר的基本意象是撒散、分散；与间接受词结合时指把所得分给他们。“散给”保留其鲜明意象，而“众人”避免在缺少明确先行词时用生硬的“他们”。
- source_word: וְעַל מִבְצָרִים יְחַשֵּׁב מַחְשְׁבֹתָיו
  choice: 谋划计策，攻取堡垒
  rationale: 原文是同根动词与名词的组合，近于“思谋他的谋略”；עַל在此可表达针对堡垒的敌对谋划。译文使对象和目的在汉语中清楚，同时脚注保留较贴近形式的表达。
- source_word: וְעַד עֵת
  choice: 但也只能到某个时候
  rationale: 字面为“直到一个时候”，本身没有明说“指定”。“只能”表达行动受时间限制，“某个时候”保留其不确定性，不把神定的含义直接写进正文。
theological_decisions:
- issue: 是否把时间限制明确解释为神所指定的日期
  choice: 但也只能到某个时候
  alternative: 直到指定的日期；但只能维持一段时间
  rationale: עַד עֵת没有显式修饰语说明该时间是“指定的”。正文保留不确定表达，从而不消除上下文中可能暗示却未在本短语中明说的神学张力。
- issue: 是否将其进入富庶地区明确译作军事入侵
  choice: 进入
  alternative: 入侵
  rationale: יָבוֹא本身仅表示来或进入。军事敌对含义可由上下文推知，但不应在动词中被强行确定。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“列祖”“掳物”“堡垒”等词兼顾经文风格与普通读者的可读性；避免古奥句法，也不把上下文暗示的军事侵略或神定日期提升为原短语明说的内容。
