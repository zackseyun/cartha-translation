base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/027.yaml
  text: As for both of them[a], the kings—their hearts are set on evil, and at one table they will speak lies, but it will not succeed[c][b], for the end is still for the appointed time.
translation:
  language: zh_hans
  text: 这两个王都心怀恶意；他们在同一张桌前说谎[a]，但不会得逞[b]，因为结局还要等到指定的时期才会来到[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“说虚假的话”或“讲谎言”。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“但事情不会成功”。原文动词为阴性单数，可能以非人称方式泛指他们的计谋或事情的结果。
    reason: lexical_and_grammatical_alternative
  - marker: c
    text: 也可译作“因为结局尚有指定的时期”。原文强调结局要等到一个固定的时间。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁנֵיהֶם הַמְּלָכִים
  choice: 这两个王都
  rationale: 承接上下文所指的两位君王；“都”自然表达复数双方，避免生硬直译为“至于他们二人，那些王”。
- source_word: לְבָבָם לְמֵרָע
  choice: 心怀恶意
  rationale: 希伯来语直译近于“他们的心向着恶”；此译保留两人蓄意行恶的含义，同时符合现代汉语表达。
- source_word: וְעַל שֻׁלְחָן אֶחָד
  choice: 在同一张桌前
  rationale: 保留原文共同坐席的具体图像，不把外交或宴席背景明说出来。
- source_word: כָּזָב יְדַבֵּרוּ
  choice: 说谎
  rationale: כָּזָב 指虚假、谎言；“说谎”简明自然，也保留双方话语不实的意思。
- source_word: וְלֹא תִצְלָח
  choice: 但不会得逞
  rationale: 原文动词为阴性单数，所指对象没有明说，可能泛指他们的计谋或事情的结果；汉语采用无显式主语的表达，以保留这种含混。
- source_word: כִּי עוֹד קֵץ לַמּוֹעֵד
  choice: 因为结局仍要到指定的时期才会来临
  rationale: 表达结局受制于一个已定时期的时间关系；不在译文中补出原文未明说的施定者。
theological_decisions:
- issue: “指定的时期”是否应明确说成“上帝指定的时期”
  choice: 保留“指定的时期”，不补出上帝
  alternative: 因为结局仍要到上帝指定的时期才会来临
  rationale: 《但以理书》的语境强烈暗示历史进程受上帝主权支配，但本节此处没有明说上帝；译文保留这一神学含意而不将其解释性展开。
- issue: “不会得逞”的隐含主语
  choice: 采用无显式主语的“不会得逞”
  alternative: 他们的计谋不会得逞
  rationale: 希伯来语使用阴性单数动词，却未明确指出究竟是计谋、事情还是预期结果不会成功；不补出“计谋”，以保存原文的指称张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“同一张桌前”保留原文的共同坐席意象；分号和逗号呈现两王的恶意、谎言、失败与既定结局之间的逻辑推进。所有代词与隐含主语均尽量避免超出原文作明确化处理。
