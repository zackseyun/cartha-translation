base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/021.yaml
  text: And in his place a despised man will arise[a], on whom they had not bestowed the majesty of kingship[b]; he will come in quietly and seize the kingdom by intrigues.
translation:
  language: zh_hans
  text: 将有一个受人藐视的人兴起，接替他的位置；人们没有把王的威荣授给他。他却必安然来到[a]，用圆滑手段[b]取得王权。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “安然”也可译作“平静地”或“在安稳之际”；此词可指平静、安逸或安全的状态，并不必然表示其行为在道德上和平。
    reason: lexical_alternative
  - marker: b
    text: “圆滑手段”也可译作“谄媚的话”或“花言巧语”；原词以“光滑”为意象，可指欺骗性的奉承言辞或政治手腕。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָמַד עַל־כַּנּוֹ
  choice: 接替他的，将兴起
  rationale: 在但以理书的王位承继语境中，עמד表示“兴起”，עַל־כַּנּוֹ表示接替前人的位置；此译既交代承继关系，也保留预言语气。
- source_word: נִבְזֶה
  choice: 一个受人藐视的人
  rationale: 该词表达被轻视、遭鄙弃的状态；“受人藐视”保留其被动意味，避免把它直接解释成对其品格的定论。
- source_word: וְלֹא נָתְנוּ עָלָיו
  choice: 人们并没有……授给他
  rationale: 原文第三人称复数主语未明确指出具体人物，汉语用泛指的“人们”自然地保留这一不确定性；“授给”符合政治权位的语境。
- source_word: הוֹד מַלְכוּת
  choice: 君王的尊荣
  rationale: הוֹד可指尊荣、威仪或光彩，מַלְכוּת在此涉及君王身份与统治权；此译保留尊荣与王权之间的关联。
- source_word: וּבָא בְשַׁלְוָה
  choice: 他却会安然来到
  rationale: בְשַׁלְוָה可表示安稳、平静或不以公开强攻的方式行动。“安然来到”简洁自然，同时不把它限定为道德意义上的和平。
- source_word: וְהֶחֱזִיק מַלְכוּת
  choice: 夺取王权
  rationale: החזיק在此表示取得并牢牢掌握；结合篡取统治地位的语境，“夺取”体现其主动控制，而“王权”比领土意义的“王国”更贴合מַלְכוּת。
- source_word: בַּחֲלַקְלַקּוֹת
  choice: 用圆滑手段
  rationale: 该词源于“光滑、圆滑”的概念，可指谄媚言辞，也可广指欺骗性的政治手腕。“圆滑手段”保留这两方面的语义空间。
