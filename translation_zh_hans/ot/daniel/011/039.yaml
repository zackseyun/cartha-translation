source:
  edition: WLC
  text: וְ/עָשָׂ֞ה לְ/מִבְצְרֵ֤י מָֽעֻזִּים֙ עִם אֱל֣וֹהַּ נֵכָ֔ר אֲשֶׁ֥ר הכיר יַרְבֶּ֣ה כָב֑וֹד וְ/הִמְשִׁילָ/ם֙ בָּֽ/רַבִּ֔ים וַ/אֲדָמָ֖ה יְחַלֵּ֥ק בִּ/מְחִֽיר־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/039.yaml
  text: And he will act against the strongest fortresses with a foreign god[a]. Those whom he acknowledges, he will increase with honor, and he will make them rule over many[d][c][b], and he will divide land for a price.
translation:
  language: zh_hans
  text: 他必与一个异邦神一同攻击最坚固的堡垒[a][b]。凡他所认可的人[c]，他必使他们大得尊荣，又使他们管辖许多人；他还必以代价分配土地[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “最坚固的堡垒”也可译作“坚固的要塞”或“堡垒中的坚垒”；希伯来语原句十分凝练，句法可有不同理解。
    reason: lexical_alternative
  - marker: b
    text: “与一个异邦神一同”也可译作“借着一个异邦神”；这里的介词既可能表示伴随，也可能表示凭借。
    reason: lexical_alternative
  - marker: c
    text: “凡他所认可的人”也有人理解为“凡认可他的人”；不过，按动词形式和后文的复数代词，前一种理解更自然。
    reason: alternative_reading
  - marker: d
    text: “以代价分配土地”也可译作“为报酬划分土地”或“把土地作为奖赏分给人”；原文表达的是一种带有交换或酬报性质的土地分配。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשָׂה
  choice: 他必……攻击
  rationale: עָשָׂה本义宽泛，可指“做、行事”。在军事语境及后接לְמִבְצְרֵי的结构中，译为“攻击”能自然表达行动所指，同时不额外说明具体作战方式。
- source_word: לְמִבְצְרֵי מָעֻזִּים
  choice: 最坚固的堡垒
  rationale: מִבְצָר指设防之地或堡垒，מָעוֹז指力量或坚固据点；两词连用具有强化意味。“最坚固的堡垒”符合现代汉语，也保留其强势表达。
- source_word: עִם אֱלוֹהַּ נֵכָר
  choice: 借着一个异邦神
  rationale: עִם通常表示“与、同”，在此也可能表达凭借某种力量的工具意义。正文采用较合语境的“借着”，并以脚注保留“与……一同”的可能。אֱלוֹהַּ נֵכָר译作“异邦神”，不具体认定其身份。
- source_word: אֲשֶׁר הִכִּיר
  choice: 凡他所认可的人
  rationale: נכר的使役式可指“认出、承认、认可”。动词为第三人称阳性单数，最自然的理解是王为主语，并以随后“他们”的复数代词承接这些人。
- source_word: יַרְבֶּה כָבוֹד
  choice: 他必使他们大得尊荣
  rationale: 原文是压缩表达，直译近于“使尊荣增多”。汉语补出从上下文可知的受益者“他们”，以“大得尊荣”保留尊荣增多的使役含义。
- source_word: וְהִמְשִׁילָם בָּרַבִּים
  choice: 又使他们管辖许多人
  rationale: משל的使役式意为“使……掌权、使……统治”；בָּרַבִּים在此自然理解为其管辖对象，即“许多人”。
- source_word: וַאֲדָמָה יְחַלֵּק בִּמְחִיר
  choice: 他还必按价分配土地
  rationale: אֲדָמָה指土地，חלק的加强式指划分或分配，מְחִיר指价钱或代价。“按价分配土地”保留交易性质，不断定这是售卖、贿赂还是政治奖赏。
theological_decisions:
- issue: “所认可的人”指谁
  choice: 理解为王所认可并加以尊荣、授予权柄的人。
  alternative: 也可能理解为认可这位异邦神的人，或认可这位王的人。
  rationale: הִכִּיר最自然地是以王为第三人称单数主语，其复数宾语由后文“他们”承接。正文不把这些人进一步界定为某种敬拜群体，以免加入原文没有明确说明的神学判断。
- issue: 异邦神在攻取堡垒中的作用
  choice: 正文采用“借着”，表达可能的凭借或工具关系。
  alternative: 也可理解为王“与一个异邦神一同”行动，表示伴随关系。
  rationale: 介词עִם本身通常表示伴随，但此处语境容许工具性理解；脚注保留两者，避免把该神与王的关系解释得过于确定。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“堡垒、异邦神、尊荣、管辖、分配土地”等词便于普通读者理解，同时保持异象文本的政治与宗教张力。正文尽量顺畅，原文中有关介词、关系从句及土地交易性质的歧义均以脚注保留。
