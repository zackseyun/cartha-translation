  text: וְ/שָׁב֙ מֶ֣לֶךְ הַ/צָּפ֔וֹן וְ/הֶעֱמִ֣יד הָמ֔וֹן רַ֖ב מִן הָ/רִאשׁ֑וֹן וּ/לְ/קֵ֨ץ הָֽ/עִתִּ֤ים שָׁנִים֙ יָ֣בוֹא ב֔וֹא בְּ/חַ֥יִל גָּד֖וֹל וּ/בִ/רְכ֥וּשׁ רָֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/013.yaml
  text: Then the king of the north will return and raise a multitude greater than the former one[a]; and at the end of the times, after some years[c][b], he will surely come with a great army and with much equipment.
translation:
  language: zh_hans
  text: 北方王必再来，召集一支比先前更庞大的军队；过了若干年，到了那些时期的终点[a]，他必定率领大军，带着许多军需物资[b]前来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“过了多年，到了所定时期的终点。”原文表达简略，可能强调一段既定时期已经结束。
    reason: lexical_alternative
  - marker: b
    text: “军需物资”或译“财物”或“装备”；原词泛指财产、物资或随军资源。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁב
  choice: 必再来
  rationale: שׁוּב在此表示“返回、再来”；结合预言语体，用“必”自然表达未完成式所指向的将来行动。
- source_word: מֶלֶךְ הַצָּפוֹן
  choice: 北方王
  rationale: 保留本章反复出现的方位性王号，简洁自然。
- source_word: וְהֶעֱמִיד
  choice: 召集
  rationale: עמד的使役式在军事语境中指使人列队、集结；“召集”比字面的“使站立”更符合现代汉语。
- source_word: הָמוֹן רַב מִן הָרִאשׁוֹן
  choice: 一支比先前更庞大的军队
  rationale: הָמוֹן רַב指规模很大的群体，此处语境明确为军旅；比较介词מִן表明这支军队超过先前那一支。
- source_word: וּלְקֵץ הָעִתִּים שָׁנִים
  choice: 过了若干年，到了那些时期的终点
  rationale: 原文结构凝缩，同时包含“年”和“时期的终点”两个时间要素；译文保留二者及其可能的预定时限意味。
- source_word: יָבוֹא בּוֹא
  choice: 必定……前来
  rationale: 限定动词与绝对不定式并用，强化“来”的确定性；“必定”体现这一强调。
- source_word: בְּחַיִל גָּדוֹל
  choice: 率领大军
  rationale: חַיִל在当前军事语境中最自然地指军队；介词בְּ表示随同或凭借。
- source_word: וּבִרְכוּשׁ רָב
  choice: 带着许多军需物资
  rationale: רְכוּשׁ可指财物、物资或资源；在出征语境中，“军需物资”传达随军携带的丰富资源，同时不局限为武器装备。
theological_decisions: []
