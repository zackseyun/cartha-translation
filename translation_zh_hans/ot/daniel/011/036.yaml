id: DAN.11.36
reference: Daniel 11:36
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/עָשָׂ֨ה כִ/רְצוֹנ֜/וֹ הַ/מֶּ֗לֶךְ וְ/יִתְרוֹמֵ֤ם וְ/יִתְגַּדֵּל֙ עַל כָּל אֵ֔ל וְ/עַל֙ אֵ֣ל אֵלִ֔ים יְדַבֵּ֖ר נִפְלָא֑וֹת וְ/הִצְלִ֨יחַ֙ עַד כָּ֣לָה זַ֔עַם כִּ֥י נֶחֱרָצָ֖ה נֶעֱשָֽׂתָה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/036.yaml
  text: And the king will do as he pleases[a]. He will exalt himself and magnify himself above every god, and against the God of gods he will speak astonishing things. And he will prosper until the indignation is finished[c][b], for what has been decreed will be done.
translation:
  language: zh_hans
  text: 王必任意而行。他必高抬自己，使自己为大，超过一切神明；又要说攻击万神之神的惊人话[a]。他必亨通，直到震怒完结[b]，因为所定的事必然成就[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“非凡的话”。希伯来语可指异乎寻常、令人惊异的事；这里的语境表明这些话狂妄而骇人。
    reason: lexical_alternative
  - marker: b
    text: 或译：“直到愤怒结束”。
    reason: lexical_alternative
  - marker: c
    text: 或译：“因为已经决定的事必会实行。”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשָׂה כִרְצוֹנוֹ
  choice: 必任意而行
  rationale: 直译为“照自己的意愿行事”；“任意而行”在现代汉语中简洁自然，并保留其自主妄为的语气。
- source_word: הַמֶּלֶךְ
  choice: 这王
  rationale: 定冠词指向上下文已经谈及的王；汉语以“这王”自然承接所指对象，不额外确定其历史身份。
- source_word: וְיִתְרוֹמֵם וְיִתְגַּדֵּל
  choice: 必高抬自己，自尊为大
  rationale: 保留两个反身动词的并列递进，表达自我抬举和自我尊大的意思。
- source_word: עַל כָּל אֵל
  choice: 超过一切神明
  rationale: 在自我抬高的语境中，עַל 表示凌驾于其上；“神明”也自然保留此处泛指诸神的含义。
- source_word: וְעַל אֵל אֵלִים יְדַבֵּר נִפְלָאוֹת
  choice: 又要说攻击万神之神的惊人话
  rationale: עַל 在言说结构中取敌对的“攻击”之意；נִפְלָאוֹת 基本义为非凡、令人惊异之事，在此敌对语境中译作“惊人的话”，而不径直强化为“亵渎的话”。
- source_word: וְהִצְלִיחַ
  choice: 必亨通
  rationale: 该动词表示成功或顺遂；“亨通”符合预言文体，也呈现其成功只是暂时的。
- source_word: עַד כָּלָה זַעַם
  choice: 直到愤怒结束
  rationale: זַעַם 可指愤怒、震怒，先知语境中很可能指神的震怒；正文不明说愤怒的主体，以保留原文的含蓄。
- source_word: כִּי נֶחֱרָצָה נֶעֱשָׂתָה
  choice: 因为所定的事必然成就
  rationale: 既表达事情已经决定，也表达该决定将落实；“成就”适合庄重的预言语体。
theological_decisions:
- issue: אֵל אֵלִים 的所指
  choice: 译为“万神之神”，将其理解为至高的神
  alternative: 译为泛指的“众神之神”，不明确其独一至高的所指
  rationale: 上下文先说“一切神明”，继而以这一最高级构词指向凌驾诸神者；中文不以大小写区分，采用传统而清楚的“万神之神”，但不添加神名。
- issue: זַעַם 的主体
  choice: 正文译作“愤怒”，不明说是谁的愤怒
  alternative: 明确译作“神的震怒”
  rationale: 但以理书的先知性语境强烈暗示神的愤怒及其预定终点，但希伯来文本在本句没有明示主体，因此保留这一含蓄。
- issue: 王说话的性质
  choice: 译作“惊人的话”，由“攻击”及上下文显出其敌对性
  alternative: 直接译作“亵渎的话”或“狂妄的话”
  rationale: נִפְלָאוֹת 本身表示非凡、惊异之事；虽然语境显然负面，正文仍不把词义收窄为特定的神学罪名。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以“必”维持预言语气；用“神明”泛指诸神，用“万神之神”指至高者。正文保留“惊人的话”和“愤怒”在词义及主体上的适度含蓄，并以脚注列出重要替代译法。
