base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/044.yaml
  text: But reports from the east and from the north will alarm him[b][a], and he will go out with great fury to destroy and to devote many to destruction.
translation:
  language: zh_hans
  text: 但从东方和北方传来的消息[a]必使他惊慌；他就要怀着烈怒出去，大肆毁灭，把许多人归于毁灭[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “消息”也可译作“传闻”或“情报”。
    reason: lexical_alternative
  - marker: b
    text: 这里的希伯来语动词也可指“置于禁令之下”或“献于毁灭”；它具有比前面的“毁灭”更专门的禁毁含义。
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמֻעוֹת
  choice: 消息
  rationale: 该复数名词指所听见的事，在本语境中是从外地传来的消息或情报。“消息”自然、宽泛，不预先断定内容是否可靠。
- source_word: יְבַהֲלֻהוּ
  choice: 必使他惊慌
  rationale: בהל 的 Piel 词形表示使人突然不安、惊惶；“使他惊慌”保留使役含义，又不夸大为极度恐惧。
- source_word: מִמִּזְרָח וּמִצָּפוֹן
  choice: 从东方和北方传来的
  rationale: 保留两个方位及其平行结构；补出“传来的”，使汉语能自然修饰“消息”。
- source_word: וְיָצָא
  choice: 他就要……出去
  rationale: 按 יצא 的基本义译为“出去”，不在动词本身额外加入“出征”或“进军”的军事解释。
- source_word: בְּחֵמָא גְדֹלָה
  choice: 大发烈怒
  rationale: חֵמָה 表示炽烈的愤怒；“大发烈怒”在庄重现代汉语中自然，并传达 גְדֹלָה 的强度。
- source_word: לְהַשְׁמִיד
  choice: 毁灭
  rationale: שׁמד 的 Hiphil 表示使之灭亡或毁灭；“毁灭”直接而不过度限定具体方式。
- source_word: וּלְהַחֲרִים
  choice: 列为当灭的人
  rationale: חרם 的 Hiphil 可指置于禁令之下、归为当毁灭者。此译法刻意与前面的普通“毁灭”有别，并由脚注说明其特殊含义。
- source_word: רַבִּים
  choice: 许多人
  rationale: 直译其复数实体用法，同时符合现代汉语表达。
theological_decisions:
- issue: 军事审判语境中 חרם 的译法
  choice: 把他们列为当灭的人
  alternative: 把许多人尽行毁灭；把许多人置于禁令之下
  rationale: 原文并列 לְהַשְׁמִיד 与 וּלְהַחֲרִים，后者具有比一般“毁灭”更专门的禁毁含义。正文保留二者差别，同时不把这种用语扩展成特定宗派的神学解释。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“大发烈怒出去”保留原文动作次序；以分号划分消息所引起的惊慌和随后采取的行动。所有脚注标记均置于相关词语之后。
