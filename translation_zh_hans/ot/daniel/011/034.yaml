  text: וּ/בְ/הִכָּ֣שְׁלָ֔/ם יֵעָזְר֖וּ עֵ֣זֶר מְעָ֑ט וְ/נִלְו֧וּ עֲלֵי/הֶ֛ם רַבִּ֖ים בַּ/חֲלַקְלַקּֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/034.yaml
  text: When they stumble[a], they will receive a little help, and many will join themselves to them with smooth words.
translation:
  language: zh_hans
  text: 他们跌倒时，必得到一点帮助；并且许多人会用圆滑的话[a]加入他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“用谄媚的话”或“靠花言巧语”。希伯来语字面指“圆滑之事／圆滑的话”，常用来形容欺骗或奉承的言辞。
    reason: 保留原文意象，并说明语境中可能含有谄媚、虚假的意味。
lexical_decisions:
- source_word: וּבְהִכָּשְׁלָם
  choice: 他们跌倒时
  rationale: ב加不定式结构表示时间情境；“跌倒”保留כשל的比喻，也不把程度限定为彻底败亡。
- source_word: יֵעָזְרוּ
  choice: 必得到……帮助
  rationale: 该词为被动意义，表示帮助来自外部；现代汉语用“得到帮助”比直译“被帮助”自然。
- source_word: עֵזֶר מְעָט
  choice: 一点帮助
  rationale: 直接表达援助有限，符合自然的现代汉语。
- source_word: וְנִלְווּ עֲלֵיהֶם
  choice: 依附他们
  rationale: 表达加入、附着于某群体的意思，并保留参与者主动靠拢但关系带有依附性的语气。
- source_word: רַבִּים
  choice: 许多人
  rationale: 这是普通的数量表达；“许多人”准确而自然。
- source_word: בַּחֲלַקְלַקּוֹת
  choice: 用圆滑的话
  rationale: 保留“光滑、圆滑”这一原文意象，同时在汉语中自然暗示讨好、虚假或欺骗性的言辞。
