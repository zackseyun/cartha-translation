  text: וְ/יָשֹׁ֤ב אַרְצ/וֹ֙ בִּ/רְכ֣וּשׁ גָּד֔וֹל וּ/לְבָב֖/וֹ עַל בְּרִ֣ית קֹ֑דֶשׁ וְ/עָשָׂ֖ה וְ/שָׁ֥ב לְ/אַרְצֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/028.yaml
  text: Then he will return to his land with great wealth[a], but his heart will be against the holy covenant[b]; and he will act and return to his land.
translation:
  language: zh_hans
  text: 然后，他必带着大量财物[a]返回本国；但他心里却敌对圣约。他必行事，随后返回本国。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“大量财富”；原文这个词可指财产、货物或财富。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָשֹׁב אַרְצוֹ
  choice: 然后，他必……返回本国
  rationale: שׁוב是Qal未完成式，表示返回；句首连接词按叙事推进译为“然后”。אַרְצוֹ虽无方向介词，在此可作方向宾语；“本国”比“他的土地”更符合现代汉语中的地缘政治语境。
- source_word: בִּרְכוּשׁ גָּדוֹל
  choice: 带着大量财物
  rationale: רְכוּשׁ可指财产、货物或财富。“大量财物”既自然，又保留具体财产与广义财富之间的语义范围，不擅自限定为掠物。
- source_word: וּלְבָבוֹ עַל
  choice: 他的心却要敌对
  rationale: לֵבָב指内心、心意；עַל在此结合上下文表达针对乃至敌对的取向。“他的心……敌对”保留原文以“心”表达内在意向的说法；“却”呈现语境中的转折。
- source_word: בְּרִית קֹדֶשׁ
  choice: 圣约
  rationale: בְּרִית意为“约”，קֹדֶשׁ在此修饰该约，表示神圣、分别为圣。“圣约”简洁、庄重，并保留原文的盟约范畴。
- source_word: וְעָשָׂה
  choice: 他必采取行动
  rationale: עשׂה的语义宽泛，可指做、施行或行动，且原文没有说明宾语。“采取行动”在现代汉语中自然，同时不擅自补明行动的具体内容。
- source_word: וְשָׁב לְאַרְצוֹ
  choice: 随后返回本国
  rationale: 原文再次使用שׁוב，译文重复“返回”，保留其结构和强调；“随后”使两次返回之间所插入的行动关系清楚，但不限定该行动的细节。
theological_decisions:
- issue: “圣约”所指为何
  choice: 保留“圣约”，不作解释性扩写
  alternative: 犹太宗教；上帝的立约子民及其秩序
  rationale: 上下文可能指与上帝圣民相关的盟约秩序，但本节本身使用的是“约”这一神学范畴。直译为“圣约”可避免把所指过早缩窄为某种宗教制度或群体。
- issue: וְעָשָׂה所指行动的性质
  choice: 译作“采取行动”，不补出具体恶行
  alternative: 任意而行；攻击圣约；采取敌对行动
  rationale: 上下文显示其心意敌对圣约，但动词本身没有宾语。译文保留这种简略和张力，不把上下文推断写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“本国”适合君王与国土的叙事语境；重复“返回”以对应原文两次使用同一动词。句间以分号和句号梳理希伯来语连续连接结构，同时保留行动次序与原文的简练感。
