  text: וּ/בָ֗א בְּ/מַלְכוּת֙ מֶ֣לֶךְ הַ/נֶּ֔גֶב וְ/שָׁ֖ב אֶל אַדְמָתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/009.yaml
  text: Then he will come into the realm of the king of the South[a], but he will return to his own land.
translation:
  language: zh_hans
  text: 他必进入南方王的国[a]，却要返回自己的国土。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他必来到南方王的国中。”
    reason: בוא与介词בְ的组合既可较直接地表达“来到……中”，也可按方向意义自然译为“进入”。
lexical_decisions:
- source_word: וּבָא
  choice: 他必进入
  rationale: בוא表示“来、进入”；在本段预言叙事的连续动作中，以“必”表达尚待发生的行动。“进入”与后面的方向性介词短语自然衔接。句首的ו不机械译作“并且”，因为汉语可由语序直接体现承接。
- source_word: בְּמַלְכוּת
  choice: 进入……的国
  rationale: מַלְכוּת在此指君王统治的国家或疆域；בְ与移动动词连用，可表达进入某范围。译作“国”简洁自然，也保留政治与地域两方面的含义。
- source_word: מֶלֶךְ הַנֶּגֶב
  choice: 南方王
  rationale: 该词组在但以理书11章中是南北对峙格局里的固定称谓，指位于南方的统治者，并非专指“南地（Negev）之王”。
- source_word: וְשָׁב
  choice: 却要返回
  rationale: שׁוב意为“返回”。连接词ו本义宽泛，可译“并且”，但这里后一行动构成进军后的折返，用“却”自然呈现语境中的转折或未能停留之意，同时不说明其原因。
- source_word: אֶל אַדְמָתוֹ
  choice: 自己的土地
  rationale: אֲדָמָה可指土地、地域；第三人称单数所有格表明是属于该行动者的土地。政治军事语境中译作“自己的土地”最自然。
theological_decisions:
- issue: 动词主语的身份
  choice: 只译作“他”，不在正文中指名
  alternative: 明确译为“北方王”或某一历史君王
  rationale: 希伯来文动词仅以阳性单数形式承接上下文，本节没有再次明说主语；保持代词可避免把历史解释直接写入经文。
- issue: 返回所暗示的结果
  choice: 以“却要返回”表达折返，不补充失败、战败或被迫等原因
  alternative: 译作“却将败退”或“却被迫返回”
  rationale: 原文只陈述返回，并未明确交代原因或军事结果，应保留这种叙述上的克制。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“南方王”与本章上下文的称谓保持一致；句式简洁，保留原文对主语身份和返回原因的含蓄。
