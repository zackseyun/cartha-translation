base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/026.yaml
  text: Those who eat his food will break him[a], and his army will be swept away[c][b], and many slain will fall.
translation:
  language: zh_hans
  text: 吃他所供食物的人必使他败亡[a][b]；他的军队必如洪水般涌来[c]，许多被杀的人必倒下。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“吃他席上之饼的人”；这是指他的亲信、臣属或受他供养的人。
    reason: lexical_alternative
  - marker: b
    text: “使他败亡”原文直译为“打破他”，是使他垮台的比喻说法。
    reason: lexical_alternative
  - marker: c
    text: 原文动词带有洪水漫溢、涌流的意象；此处以“军队”为主语，也可译作“必漫溢”或“必汹涌而来”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹכְלֵי פַת בָּגוֹ
  choice: 吃他食物的人
  rationale: 该短语直指享用王所供食物的人，在宫廷语境中暗含亲信、臣属或受供养者。译为“吃他食物的人”既自然，也保留原文没有明说“筵席”或“背叛”的含蓄性。
- source_word: יִשְׁבְּרוּהוּ
  choice: 必使他败亡
  rationale: שׁבר本义为“打破”，此处用于人及其政治军事处境，表示使其垮台、败亡。直译“打破他”在现代汉语中生硬，“使他败亡”传达比喻含义，脚注保留原有意象。
- source_word: חֵילוֹ
  choice: 他的军队
  rationale: חַיִל可指力量、财富或军队；上下文是交战与伤亡，因此“军队”最贴切清楚。
- source_word: יִשְׁטוֹף
  choice: 必被冲走
  rationale: שטף带有洪水漫溢、冲刷的意象。虽然希伯来语动词形式可直陈“涌流”，在此以“被冲走”表达军队遭压倒溃败，同时保存洪水图景。
- source_word: וְנָפְלוּ חֲלָלִים רַבִּים
  choice: 必有许多人被杀倒下
  rationale: חֲלָלִים指遭击杀、阵亡者；“被杀倒下”保留“倒下”与“被杀”两层表达，也符合战争语境。
