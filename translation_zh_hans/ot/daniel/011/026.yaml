- from: 吃他食物的人必使他败亡[a][b]；他的军队必被冲走[c]，必有许多人被杀倒下。
  to: 吃他所供食物的人必使他败亡[a][b]；他的军队必如洪水般涌来[c]，许多被杀的人必倒下。
  rationale: 修订“军队”分句，以保留希伯来文中军队作主动主语及洪水般涌流的画面；相应更新脚注 c。首句微调为“吃他所供食物的人”，使供养关系在现代汉语中更明确自然，同时不增添“背叛”或“筵席”等正文未明说的内容。末句改按原文名词“被杀的人”加“倒下”的结构呈现。
