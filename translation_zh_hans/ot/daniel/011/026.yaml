  naturalness: “吃他食物的人”在现代汉语中可懂且庄重；“他的军队必如洪水般涌来”更自然地表达军队作主语的汹涌推进。“许多被杀的人必倒下”虽保留原文的强调性重复，仍属可接受的经文体表达。
  terminology: “败亡”适当地传达“打破他”的比喻性毁灭，且脚注保留字面意象。“军队”符合此处 חַיִל 的战争语境。“吃他所供的食物的人”既保留宫廷供养关系，也不在正文中增译“背叛”。
