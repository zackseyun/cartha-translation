base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/043.yaml
  text: And he will rule over the treasures of gold and silver[a], and over all the precious things of Egypt[b]; and the Libyans and Cushites will be in his train.
translation:
  language: zh_hans
  text: 他必掌管金银的隐秘宝藏[a]，以及埃及一切珍贵之物；利比亚人和古实人必跟随他的脚步[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “金银的隐秘宝藏”或译“金银的宝藏”；原词指隐藏或贮存起来的财宝。
    reason: lexical_alternative
  - marker: b
    text: 原文直译“在他的脚步中”，也可理解为“随他行进”或“加入他的随从队伍”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָשַׁל
  choice: 他必掌管
  rationale: מָשַׁל在此表示取得并行使支配权；“掌管”自然地表达对财物的控制，也不额外引入政治统治的含义。
- source_word: בְּמִכְמַנֵּי הַזָּהָב וְהַכֶּסֶף
  choice: 秘藏的金银
  rationale: מִכְמַנִּים指隐藏或贮存起来的贵重物品。“秘藏的金银”保留其隐秘储藏的意味，同时符合现代汉语表达。
- source_word: וּבְכֹל חֲמֻדוֹת מִצְרָיִם
  choice: 以及埃及一切珍贵之物
  rationale: חֲמֻדוֹת可指令人喜爱、珍视或价值贵重之物；“珍贵之物”保留较宽泛的含义，不将其局限为钱财或珠宝。
- source_word: לֻבִים
  choice: 利比亚人
  rationale: 该族名通常指古代利比亚地区的族群；采用通行中文名称，比音译“路比人”更易理解。
- source_word: כֻשִׁים
  choice: 古实人
  rationale: 采用圣经历史地理名称“古实”，避免以现代国家“埃塞俄比亚”替代古代族群概念。
- source_word: בְּמִצְעָדָיו
  choice: 必跟随他的脚步
  rationale: 该词组字面涉及脚步、行进或步伐；此译保留原文意象，同时表达这些族群随他行进的语境含义。
theological_decisions:
- issue: 利比亚人和古实人与此人的关系
  choice: 必跟随他的脚步
  alternative: 必加入他的随从队伍／必听命于他
  rationale: 原文简略，只说他们“在他的脚步中／随着他的步伐”，可能表示随军、随从或受其支配。正文保留脚步意象，不明确断定具体政治或军事关系。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“掌管”与“珍贵之物”保持语义宽度；末句保留“脚步”的原文意象，并借脚注说明其可能表示随从或随军而行。
