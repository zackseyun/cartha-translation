  text: וּ/מַרְשִׁיעֵ֣י בְרִ֔ית יַחֲנִ֖יף בַּ/חֲלַקּ֑וֹת וְ/עַ֛ם יֹדְעֵ֥י אֱלֹהָ֖י/ו יַחֲזִ֥קוּ וְ/עָשֽׂוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/032.yaml
  text: He will corrupt with smooth words those who act wickedly against the covenant[b][a], but the people who know their God will stand firm and take action.
translation:
  language: zh_hans
  text: 他要用谄媚的话[a]腐化那些作恶、违背圣约的人；但认识自己上帝的子民必刚强并行动[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“用花言巧语”或“用奉承的话”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“必站立得稳并采取行动”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמַרְשִׁיעֵי בְרִית
  choice: 那些作恶违背圣约的人
  rationale: רשע的使役分词在这里指在约的关系上行恶的人；译作“作恶违背圣约”既表达其罪责，也清楚呈现其所针对的是圣约。
- source_word: יַחֲנִיף
  choice: 腐化
  rationale: חנף的使役式可表示使人亵渎、败坏或陷入不敬虔；结合后面的诱媚言辞，“腐化”保留道德与宗教层面的败坏含义，又不把具体方式解释得过窄。
- source_word: בַּחֲלַקּוֹת
  choice: 用花言巧语
  rationale: 该词本义涉及“圆滑”，在此惯用地指诱人的奉承话。“花言巧语”是自然的现代汉语，并体现言辞圆滑而具有迷惑性的语义。
- source_word: וְעַם
  choice: 但……子民
  rationale: וְ形式上是“和”，但上下两句构成明显对比；用“但”准确表达篇章中的转折关系。עם在此指属于上帝、认识上帝的群体，译作“子民”符合盟约语境。
- source_word: יֹדְעֵי אֱלֹהָיו
  choice: 认识自己上帝的
  rationale: 分词表示持续而具关系性的认识。阳性单数后缀与集合名词עם呼应，汉语用反身性的“自己”自然地保留“其上帝”的归属关系，同时不误解为前述君王的上帝。
- source_word: יַחֲזִקוּ
  choice: 必刚强
  rationale: חזק的使役式在这里可作不及物或结果性理解，表示变得强健、保持坚强。“刚强”保留原词的力量含义，也适合受压迫而坚定不移的语境。
- source_word: וְעָשׂוּ
  choice: 行动
  rationale: עשה本义宽泛，可指做、行或成就；在逼迫与抗争的上下文中，“行动”自然表达实际作为，又避免增添“建立功勋”等原文未明说的内容。
theological_decisions:
- issue: 末句中忠信群体回应的性质
  choice: 译为“必刚强行动”，让“刚强”与“行动”并列，同时保留行动内容的开放性。
  alternative: 可译为“必站立得稳，采取行动”或较形式地译为“必刚强而行”。
  rationale: 原文יַחֲזִקוּ וְעָשׂוּ既强调坚强，也强调付诸行动，但עשה并未说明行动的具体形式。译文呈现忠于圣约者与背约者的对比，却不把行动限定为军事功绩或任何后来的教义性解释。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“圣约”凸显此处盟约语境；“花言巧语”较口语化但仍适合公共诵读，并准确传达圆滑、诱媚言辞的意味。末句使用简洁有力的“刚强行动”，保留希伯来文的紧凑节奏及语义张力。
