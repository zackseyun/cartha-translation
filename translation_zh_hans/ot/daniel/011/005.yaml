  yaml_path: translation/ot/daniel/011/005.yaml
  text: Then the king of the South will grow strong[a], but one of his commanders will grow stronger than he and will rule, and his dominion will be a great dominion.
translation:
  language: zh_hans
  text: 南方王必强盛起来；但他的一位将领必比他更强，并要掌权；他的统治范围将极其广大。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“南方王必强盛起来；他的一位首领必强盛，胜过他，并要掌权；他的统治范围将极其广大。”希伯来语的句法容许较为直译的处理；正文则按上下文表达其中的比较意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶחֱזַק
  choice: 必强盛起来
  rationale: חזק的Qal未完成式在此表示政治、军事力量变得强大；“强盛起来”自然地保留了动态含义和预言语境中的将来指向。
- source_word: מֶלֶךְ הַנֶּגֶב
  choice: 南方王
  rationale: 这是但以理书本章反复出现的方位性政治称号；“南方王”简洁、庄重，也便于全章术语一致。
- source_word: וּמִן שָׂרָיו
  choice: 但他的一位将领
  rationale: מן接带后缀的复数名词，语境中指从他的众首领中出来的一人；שַׂר在此更可能是军政将领。“但”表达下文形成的对比。
- source_word: וְיֶחֱזַק עָלָיו
  choice: 必比他更强
  rationale: חזק与עַל连用在此表达相对于前一位王的优势；比较式中文比直译为“在他之上强盛”更清楚。
- source_word: וּמָשָׁל
  choice: 并要掌权
  rationale: 带连接词的完成式延续预言叙事次序；“掌权”准确表达政治统治，又符合现代汉语。
- source_word: מִמְשָׁל רַב מֶמְשַׁלְתּוֹ
  choice: 他的统治权将极其广大
  rationale: 两个同根名词共同强调其统治的规模和范围；中文以“统治权”保留政治权柄之义，以“极其广大”表达רַב的强度。
