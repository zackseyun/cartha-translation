  text: וְ/נִשָּׂ֥א הֶ/הָמ֖וֹן ירום לְבָב֑/וֹ וְ/הִפִּ֛יל רִבֹּא֖וֹת וְ/לֹ֥א יָעֽוֹז׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/012.yaml
  text: And when the multitude is carried away[a], his heart will be lifted up, and he will cast down tens of thousands[c][b], but he will not prevail.
translation:
  language: zh_hans
  text: 那大军被扫除时[a]，他的心就高傲起来[b]；他使数万人倒下，却不能得势[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“那大军被举起（或被带走）后。”原文动词既可表示“被举起”，也可表示“被带走、除去”；战争语境较支持“大军被扫除”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译：“他的心被高举起来”，是指他变得骄傲。
    reason: cultural_note
  - marker: c
    text: 或译：“却不能强盛。”原文既可侧重未能占得优势，也可侧重未能巩固实力。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִשָּׂא
  choice: 被击溃时
  rationale: נשׂא 的尼斐尔式可表示“被举起”或“被带走、除去”。在交战语境中，以“被击溃”自然表达大批军兵被扫除；将连接词按事件关系译作“时”，符合汉语叙事。
- source_word: הֶהָמוֹן
  choice: 大军
  rationale: הָמוֹן 指众多的人、群众或大群；此处明确处于军事语境，“大军”比“群众”自然，但不限定具体兵种。
- source_word: יָרוּם לְבָבוֹ
  choice: 他的心就高傲起来
  rationale: 直译为“他的心被高举”，是指骄傲自大的希伯来语习语。正文采用现代汉语的自然表达，并以脚注保留原文意象。
- source_word: וְהִפִּיל
  choice: 使……倒下
  rationale: נפל 的使役式意为“使倒下”；在战争语境中可指杀死或击败。此译保留原文未明确区分伤亡与败落的宽度。
- source_word: רִבֹּאוֹת
  choice: 数万人
  rationale: 复数 רִבֹּאוֹת 指多个“万”或极大的数量。“数万人”是简明自然的现代汉语表达。
- source_word: וְלֹא יָעוֹז
  choice: 却不能得势
  rationale: 该动词表示强盛、成为强有力或占优势。“不能得势”既适合军事上下文，也避免把含义过度限定为最终胜利。
theological_decisions:
- issue: 他在杀伤众多敌军后仍“不能得势”的含义
  choice: 保留为军事与权势上的“不能得势”
  alternative: 译为“却不能获胜”或“却不能强盛”
  rationale: 原文可侧重未能保持强势、巩固成果或取得决定性优势；不将经文解释为某一种特定历史或神学结局。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“大军被击溃”传达军事语境，“心就高傲起来”清楚表达希伯来习语；分号与“虽……却……”呈现成功、骄傲与未能得势之间的张力。
