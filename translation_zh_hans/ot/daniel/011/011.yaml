base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/011.yaml
  text: Then the king of the South will become enraged and go out and fight with him[a], with the king of the North; and he will raise up a great multitude[c][b], but the multitude will be given into his hand.
translation:
  language: zh_hans
  text: 南方王必大为愤怒[a]，出兵与他，就是北方王交战；他必集结大军，但这大军必交在他手中[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“激愤起来”或“心怀苦愤”。希伯来语动词表示内心受到强烈激动，继而采取行动。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文后半节只用第三人称动词和代词，没有重述两位王的称号，因此“他”及“他手中”的指代形式上未明。按上下文通常理解为北方王集结大军，而这大军落入南方王的权下。“交在……手中”意为交在某人的权力之下。
    reason: ambiguity_and_cultural_note
lexical_decisions:
- source_word: וְיִתְמַרְמַר
  choice: 必大为愤怒
  rationale: 该词为מרר的Hitpael形式，表达内心强烈激动、苦愤而发怒；“大为愤怒”在现代汉语中自然，并保留情绪加剧而付诸行动的意味。
- source_word: מֶלֶךְ הַנֶּגֶב
  choice: 南方王
  rationale: 保留《但以理书》第11章反复出现的方位性王号，简洁而庄重。
- source_word: וְיָצָא
  choice: 出兵
  rationale: 原义是“出去”；在明确的军事语境中译作“出兵”，自然地表达王出战的行动。
- source_word: וְנִלְחַם עִמּוֹ עִם מֶלֶךְ הַצָּפוֹן
  choice: 与北方王交战
  rationale: עִם字面为“与”，在לחם的搭配中表示同对方作战；合并重复指称，使汉语清楚流畅而不改变敌对含义。
- source_word: וְהֶעֱמִיד הָמוֹן רָב
  choice: 必集结大军
  rationale: עמד的Hiphil在这里有使之列队、调集之意；המון רב在军事语境中指庞大的军众，译作“大军”比“大群人”更准确自然。
- source_word: וְנִתַּן הֶהָמוֹן בְּיָדוֹ
  choice: 但这大军必交在南方王手中
  rationale: נתן的Niphal表示被交付；“交在……手中”保留希伯来语意象，并由注释说明其支配权含义。连接词按语境译为“但”，突出大军虽被集结却遭交付的转折。
theological_decisions:
- issue: 后半节两个第三人称形式所指的对象
  choice: 正文按战事逻辑明确为北方王集结大军，而大军被交在南方王手中
  alternative: 连续使用“他”，保留表面上的指代不明
  rationale: 希伯来文没有在两个分句中重述王号，单凭语法可有指代含混；然而前后战事脉络与下一节说明南方王掳走军众，支持此处的明确表达。脚注保留原文形式上的含混，避免将解释伪装成毫无歧义的字面形式。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“出兵”“交战”“集结大军”符合军事上下文；保留“交在……手中”的圣经意象，并以脚注解释。
