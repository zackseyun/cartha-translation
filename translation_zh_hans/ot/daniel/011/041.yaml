  text: וּ/בָא֙ בְּ/אֶ֣רֶץ הַ/צְּבִ֔י וְ/רַבּ֖וֹת יִכָּשֵׁ֑לוּ וְ/אֵ֨לֶּה֙ יִמָּלְט֣וּ מִ/יָּד֔/וֹ אֱד֣וֹם וּ/מוֹאָ֔ב וְ/רֵאשִׁ֖ית בְּנֵ֥י עַמּֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/041.yaml
  text: 'He will enter into the Beautiful Land[a], and many will stumble; but these will escape from his hand: Edom, Moab[c][b], and the foremost of the sons of Ammon.'
translation:
  language: zh_hans
  text: 他将进入那荣美之地[a]，许多将倾覆[b]；但这些必逃脱他的手：以东、摩押，以及亚扪人中为首的[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“华美之地”或“可喜悦之地”。
    reason: lexical_alternative
  - marker: b
    text: 原文只说“许多”，没有明说是许多人、许多国家，还是许多地方。
    reason: lexical_ambiguity
  - marker: c
    text: 或译“亚扪人的主要部分”。原文直译为“亚扪子孙中为首的”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָא
  choice: 他将进入
  rationale: בוא 与介词 בְּ 及“地”连用，表示进入某地；主语承接上文，中文自然译作“他将进入”。
- source_word: בְּאֶרֶץ הַצְּבִי
  choice: 那荣美之地
  rationale: צְבִי 可指荣美、华美或可喜悦之物。“荣美之地”保留其称号性质和意象，不在正文中直接解释为以色列或犹大。
- source_word: וְרַבּוֹת
  choice: 许多
  rationale: 阴性复数形式在此作名词性用法，却没有明说所指的是人、国家还是土地；译文不补出名词，以保留原文含混。
- source_word: יִכָּשֵׁלוּ
  choice: 都将倾覆
  rationale: כשל 的 Niphal 形可表示绊倒、跌倒或败亡；军事政治语境中“倾覆”既保留倒下的意象，也能自然表达败落。
- source_word: וְאֵלֶּה יִמָּלְטוּ
  choice: 但这些必逃脱
  rationale: וְ 在语境中形成转折；מלט 表示逃脱或获救，此处接“他的手”，译作“逃脱”最为贴切。
- source_word: מִיָּדוֹ
  choice: 他的手
  rationale: 直译保留希伯来语以“手”表达权势、控制的具体比喻，现代中文也可理解。
- source_word: אֱדוֹם וּמוֹאָב
  choice: 以东、摩押
  rationale: 采用现代中文圣经及历史地名的通行译名。
- source_word: וְרֵאשִׁית בְּנֵי עַמּוֹן
  choice: 以及亚扪人中的为首者
  rationale: רֵאשִׁית 基本义为起初、首要部分，在此可指为首或主要的一部分；该译法保留其与“亚扪人”之间的结构关系，且不误译为“余民”。
theological_decisions:
- issue: “荣美之地”的地理所指
  choice: 正文保留称号“那荣美之地”，不直接写成“以色列地”或“犹大地”
  alternative: 明确译作“以色列地”；或泛译“美地”
  rationale: 但以理书语境通常使人联想到以色列／犹大之地，但原文没有在本节直接写出该地名；保留称号可避免把解释嵌入正文。
- issue: וְרַבּוֹת 所省略的中心名词
  choice: 仅译“许多”，不指明是人、国家或土地
  alternative: “许多人”；“许多国家／地方”
  rationale: 原文使用阴性复数的名词性形容词而未明说所指。中文正文保留这一悬而未决之处，并以脚注说明。
- issue: רֵאשִׁית בְּנֵי עַמּוֹן 的范围
  choice: “亚扪人中的为首者”
  alternative: “亚扪人的主要部分”；“亚扪人的首领”
  rationale: רֵאשִׁית 可指首要者或主要部分，语法并未完全确定其具体范围；正文采用较贴近结构且自然的表达，脚注列出另一可能。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“荣美之地”保留原文的称号感；“倾覆”适合军事政治语境，并保留 כשל 所含倒下、败落的意象。所有原文中的关键含混均在正文或脚注中保留，未加入宗派性解释。
