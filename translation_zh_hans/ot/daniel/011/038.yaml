source:
  edition: WLC
  text: וְ/לֶ/אֱלֹ֨הַּ֙ מָֽעֻזִּ֔ים עַל כַּנּ֖/וֹ יְכַבֵּ֑ד וְ/לֶ/אֱל֜וֹהַּ אֲשֶׁ֧ר לֹא יְדָעֻ֣/הוּ אֲבֹתָ֗י/ו יְכַבֵּ֛ד בְּ/זָהָ֥ב וּ/בְ/כֶ֛סֶף וּ/בְ/אֶ֥בֶן יְקָרָ֖ה וּ/בַ/חֲמֻדֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/038.yaml
  text: Instead[a], he will honor a god of fortresses in his place; he will honor a god whom his fathers did not know with gold, silver, precious stones[c][b], and desirable things.
translation:
  language: zh_hans
  text: 他却要在其位上尊崇堡垒之神[a][b]；他要用金、银、宝石和珍贵之物[c]，尊崇他列祖所不认识的神。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“坚垒之神”。
    reason: lexical_alternative
  - marker: b
    text: “在其位上”原文直译可作“在他的基座上”或“在他的位置上”；此短语含义和代词所指均不确定，也可能表示“代替他”。
    reason: alternative_reading
  - marker: c
    text: 或译：“珍宝”或“可喜爱之物”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֶאֱלֹהַּ מָעֻזִּים
  choice: 却要尊崇堡垒之神
  rationale: מָעֻזִּים是复数，指防御坚固之处；“堡垒”自然地保留其军事语境。“却”表达本节与上文的转折关系，但不把该神明确等同于某位历史神祇。
- source_word: עַל־כַּנּוֹ
  choice: 使其居于原位
  rationale: כֵּן可指基座、台座或位置；此处结构简练且含义有争议。正文采用较通顺而仍留有空间意味的表达，脚注列出“在他的基座上”及“取代他”等可能。
- source_word: יְכַבֵּד
  choice: 尊崇
  rationale: כבד的Piel形在此表示给予尊荣；“尊崇”适合对神明献上贵重物品的语境，并用于本节两次出现之处。
- source_word: אֱלוֹהַּ אֲשֶׁר לֹא יְדָעֻהוּ אֲבֹתָיו
  choice: 他列祖所不认识的神
  rationale: “列祖”准确传达אֲבֹתָיו所指的祖先世代；“不认识”保留ידע的直接措辞，不擅自解释为“不承认”或“不敬拜”。
- source_word: בְּזָהָב וּבְכֶסֶף
  choice: 用金、银
  rationale: 介词ב在这里表示尊崇所借助的物品或方式；“用”符合现代汉语习惯。
- source_word: וּבְאֶבֶן יְקָרָה
  choice: 宝石
  rationale: 希伯来语形式为单数，但可作集合意义；汉语“宝石”本身无须标明单复数，且能自然融入贵重物品的列举。
- source_word: וּבַחֲמֻדוֹת
  choice: 珍贵之物
  rationale: חֲמֻדוֹת泛指令人喜爱、珍重或贵重的物品；“珍贵之物”比“珍宝”更宽泛，也避免将所指过度限定为财宝。
theological_decisions:
- issue: “堡垒之神”的身份与性质
  choice: 按描述性短语译作“堡垒之神”，不确定其具体身份。
  alternative: 译作某一特定战神的称号，或解释为军事力量本身。
  rationale: 本节没有提供足够依据来认定某一历史或末世人物、神祇；保留原文的开放性，避免加入宗派性或历史性的特定认定。
- issue: עַל־כַּנּוֹ的所指与句法关系
  choice: 正文译作“使其居于原位”，并以脚注保存其他读法。
  alternative: “在他的基座上”或“取代他”。
  rationale: 该短语可有空间意义，也可能表达替代关系；代词所指同样不完全清楚。正文不武断指定被取代者，脚注明确呈现歧义。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“列祖”保留经文的祖先世代色彩；句式调整为汉语自然语序。正文与脚注中的[a]、[b]、[c]一一对应。
