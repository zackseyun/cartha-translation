- from: 现在，我要把真相告诉你：看哪，波斯还会有三位王兴起[a]。第四位将比所有人富有得多[b]；他因财富而强盛时，就会动员众人对抗希腊国[c]。
  to: 现在，我要把真事告诉你：看哪，波斯还会有三位王兴起[a]。第四位将比其余诸王富有得多[b]；他因财富而强盛时，就会动员众人对抗希腊王国[c]。
  rationale: 修订仅处理比较范围、现代政治实体名称和脚注表述。“比其余诸王”使汉语语义与王位序列的上下文一致，避免“所有人”所造成的无界扩大；“真事”保留启示宣告的庄重与中性；“希腊王国”更自然地对应原文的“希腊的王国”。末句维持原文和英语审校轨迹所支持的“动员众人对抗希腊”理解。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T07:55:46Z'
review_pass:
