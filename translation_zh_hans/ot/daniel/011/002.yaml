language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/עַתָּ֕ה אֱמֶ֖ת אַגִּ֣יד לָ֑/ךְ הִנֵּה עוֹד֩ שְׁלֹשָׁ֨ה מְלָכִ֜ים עֹמְדִ֣ים לְ/פָרַ֗ס וְ/הָֽ/רְבִיעִי֙ יַעֲשִׁ֤יר עֹֽשֶׁר גָּדוֹל֙ מִ/כֹּ֔ל וּ/כְ/חֶזְקָת֣/וֹ בְ/עָשְׁר֔/וֹ יָעִ֣יר הַ/כֹּ֔ל אֵ֖ת מַלְכ֥וּת יָוָֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/002.yaml
  text: 'And now I will tell you the truth: behold[a], three more kings will arise for Persia, and the fourth will become far richer than all of them; and when he becomes strong through his riches[c][b], he will stir up everyone against the kingdom of Greece.'
translation:
  language: zh_hans
  text: 现在，我要把真事告诉你：看哪，波斯还会有三位王兴起[a]。第四位将比其余诸王富有得多[b]；他因财富而强盛时，就会动员众人对抗希腊王国[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“还会有三位王为波斯而兴起。”
    reason: לְפָרַס可表示与波斯的归属或关联；“为波斯”较形式对应，但现代汉语略显生硬。
  - marker: b
    text: 或译：“第四位将积聚远胜其余诸王的巨额财富。”
    reason: 原文以“富有／财富”的同根结构加强语气；מִכֹּל字面为“超过一切”，在王位继承的语境中自然理解为超过其余诸王。
  - marker: c
    text: 直译可作：“他将激起全部来反对希腊王国。”
    reason: הַכֹּל字面为“全部”；在政治军事语境中，正文的“众人”自然指他所能动员的全体人众。与“希腊王国”的关系按此处动词用法及上下文理解为敌对目标。
lexical_decisions:
- source_word: וְעַתָּה
  choice: 现在
  rationale: 在现代汉语中自然地引出启示的下一阶段；上下文已足以体现连接作用，无须生硬增译“而”。
- source_word: אֱמֶת אַגִּיד לָךְ
  choice: 我要把真相告诉你
  rationale: 准确表达“告诉你真相”的宾语结构，语言清楚庄重。
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留原文提示听者注意的指示和预言语气。
- source_word: עוֹד שְׁלֹשָׁה מְלָכִים עֹמְדִים לְפָרַס
  choice: 波斯还会有三位王兴起
  rationale: “还”保留附加之意，“兴起”符合王位继承语境；“波斯还会有”自然表达 לְפָרַס 所指的归属关系，同时不把它过度限定为单纯地点。
- source_word: יַעֲשִׁיר עֹשֶׁר גָּדוֹל מִכֹּל
  choice: 将比所有人富有得多
  rationale: 用“富有得多”体现同根动词与名词所加强的巨富含义，并保留 מִכֹּל 的比较范围为较宽泛的“所有人”。
- source_word: וּכְחֶזְקָתוֹ בְעָשְׁרוֹ
  choice: 他因财富而强盛时
  rationale: 同时表达 כְ 的时间／情状意义和 בְ 的工具或原因色彩，不把财富与力量的关系拆开。
- source_word: יָעִיר הַכֹּל
  choice: 就会动员众人
  rationale: עור 的使役形在军事政治语境中可指唤起、激动或发动；“动员众人”自然表达使众人采取行动的含义。
- source_word: אֵת מַלְכוּת יָוָן
  choice: 对抗希腊国
  rationale: 依本章政治军事语境，将希腊国理解为动员行动所针对的对象；“希腊国”简明表达 מַלְכוּת יָוָן。
theological_decisions:
- issue: 末句的历史政治关系
  choice: 第四位波斯王动员众人对抗希腊国
  alternative: 他激起一切，而其对象或所涉范围是希腊国
  rationale: 此处主要是句法与词义判断，并非教义限定。结合 עור、הַכֹּל 及上下文，敌对或进攻希腊的理解最连贯；脚注保留较贴近表层句法的可能表达。
- issue: “所有人”的比较范围
  choice: 不在正文中明定为前三位王
  alternative: 比此前诸王都富有
  rationale: 原文 מִכֹּל 只说“超过所有”，未明说比较对象；正文保留其开放性，避免把历史认定写进经文。
translation_notes:
  register: 采用现代、清楚而庄重的叙述语体。“看哪”保留预言文本的提醒语气；其余部分避免文言化。正文以自然汉语表达政治军事行动，并用脚注保存 לְפָרַס、同根强调结构、הַכֹּל 及末句句法上的真实张力。
