base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/040.yaml
  text: At the time of the end[a], the king of the South will clash with him, and the king of the North will storm against him with chariots, horsemen, and many ships[d][c][b]; he will enter into the lands and sweep through and pass on.
translation:
  language: zh_hans
  text: 在末了的时候，南方王必与他交锋[a]；北方王必带着战车、骑兵和许多船只，猛烈冲向他[b][c]。他必进入各地[d]，席卷而过。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “交锋”所译的希伯来词本有用角抵撞、顶撞的意思，此处比喻敌对冲突；也可译作“攻击他”。
    reason: lexical_alternative
  - marker: b
    text: “猛烈冲向”也可译作“如旋风般袭击”或“如暴风般冲来”；原词含狂风暴雨般迅猛冲击的意象。
    reason: lexical_alternative
  - marker: c
    text: 本节两次出现的“他”，希伯来原文都没有在此明确说明所指何人；其确切指称存在不同解释。
    reason: alternative_reading
  - marker: d
    text: “各地”也可译作“列国”或“诸国”；希伯来语复数可指多片土地、疆域或国家。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְעֵת קֵץ
  choice: 到了终局的时候
  rationale: 保留“עֵת קֵץ”所指的终结时期及其末世意味，同时不把具体时间表解释进正文。
- source_word: יִתְנַגַּח עִמּוֹ
  choice: 必与他交锋
  rationale: 该动词本有以角抵撞、顶撞的意象，此处比喻敌对冲突；“交锋”自然表达激烈碰撞，也保留介词“与”的结构。
- source_word: מֶלֶךְ הַנֶּגֶב / מֶלֶךְ הַצָּפוֹן
  choice: 南方王／北方王
  rationale: 这是但以理书第11章反复出现的地缘政治称号；采用简洁一致的现代汉语表达。
- source_word: וְיִשְׂתָּעֵר עָלָיו
  choice: 必……如暴风般冲向他
  rationale: 动词含猛烈如风暴席卷而来的意象；此译传达其急剧、强暴的动态，不过“如暴风般”属于把词内意象明示出来，故附注说明。
- source_word: בְּרֶכֶב וּבְפָרָשִׁים וּבָאֳנִיּוֹת רַבּוֹת
  choice: 用战车、骑兵和许多船只
  rationale: “战车”体现集合名词的军事含义；“骑兵”是现代汉语中自然的军队称谓；“用”统摄整组装备与兵力。
- source_word: וּבָא בָאֲרָצוֹת
  choice: 他必进入列国
  rationale: 复数“אֲרָצוֹת”可指多片土地、疆域或国家；“列国”在军事推进的语境中简洁自然，但不限定其具体所指。
- source_word: וְשָׁטַף וְעָבָר
  choice: 如洪水漫过，一路前行
  rationale: “שׁטף”保留洪水泛滥、席卷的形象；“עבר”表达继续越过、向前推进，避免两个动词在汉语中简单重复。
theological_decisions:
- issue: “与他／冲向他”中代词的指称
  choice: 正文只译作“他”，不明确其身份
  alternative: 将其解释为上文的王、某位末世统治者，或按特定解释体系指定为南方王或北方王
  rationale: 希伯来文本只使用第三人称代词，没有在本节重新点明先行词。保留代词可避免把某种历史或末世论体系写入译文。
translation_notes:
  register: 采用现代、庄重而清楚的叙事语体。“终局的时候”保留末世性而不过度界定；“如洪水漫过”保存军事推进中的洪水隐喻。脚注标记均置于其直接说明的词句之后。
