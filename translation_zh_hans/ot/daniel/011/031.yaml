language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וּ/זְרֹעִ֖ים מִמֶּ֣/נּוּ יַעֲמֹ֑דוּ וְ/חִלְּל֞וּ הַ/מִּקְדָּ֤שׁ הַ/מָּעוֹז֙ וְ/הֵסִ֣ירוּ הַ/תָּמִ֔יד וְ/נָתְנ֖וּ הַ/שִּׁקּ֥וּץ מְשׁוֹמֵֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/031.yaml
  text: And forces from him will arise[a], and they will profane the sanctuary fortress, and remove the regular burnt offering[d][c][b], and set up the abomination that desolates.
translation:
  language: zh_hans
  text: 从他而出的军队[a]必兴起，亵渎圣所——那堡垒[b]，除去常献的燔祭[c]，并设立那造成荒凉的可憎之物[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “军队”原文直译为“膀臂”，也可译为“武装力量”；“必兴起”也可译为“必站立”或“必出现”。
    reason: lexical_alternative
  - marker: b
    text: 原文为“圣所，那堡垒”；也可理解为“坚固的圣所”。
    reason: alternative_reading
  - marker: c
    text: 原文为“常常的”或“持续的”；在这里指日常例行献上的燔祭。
    reason: lexical_alternative
  - marker: d
    text: “造成荒凉的”也可译为“使之荒凉的”。
    reason: alternative_reading
lexical_decisions:
- source_word: וּזְרֹעִים מִמֶּנּוּ
  choice: 他所派出的军队
  rationale: זְרֹעִים直译为“膀臂”，在军事语境中指武装力量；מִמֶּנּוּ表明这些力量出自前文所说的人。译作“他所派出的军队”符合现代汉语，也保留其军事含义。
- source_word: יַעֲמֹדוּ
  choice: 必出动
  rationale: עמד本义为“站立”，此处指军队上前、就位或采取行动；“出动”自然传达军事语境中的动态含义。
- source_word: וְחִלְּלוּ
  choice: 亵渎
  rationale: חלל的强化词干在圣所语境中意为把神圣之物当作俗物、予以玷污；“亵渎”准确而庄重。
- source_word: הַמִּקְדָּשׁ הַמָּעוֹז
  choice: 圣所——那堡垒
  rationale: 原文将“圣所”和“堡垒”两个带定冠词的名词并置，关系紧凑而略有歧义。破折号保留同位解释的可能，又不直接改写为“坚固的圣所”。
- source_word: וְהֵסִירוּ הַתָּמִיד
  choice: 废除常献的燔祭
  rationale: הֵסִירוּ意为移去、除掉；הַתָּמִיד字面为“常献的／持续的”，在但以理书的祭祀语境中指日常例行献上的祭。用“燔祭”补明所指，脚注同时交代原文的省略表达。
- source_word: וְנָתְנוּ
  choice: 并设立
  rationale: נתן本义为放置；用于安置某种亵渎之物时，“设立”是自然贴切的汉语表达。
- source_word: הַשִּׁקּוּץ
  choice: 可憎之物
  rationale: שִׁקּוּץ指令人憎恶、常与偶像崇拜有关的事物；“可憎之物”既保留实体指向，也不预先断定其具体身份。
- source_word: מְשׁוֹמֵם
  choice: 造成荒凉的
  rationale: 该分词可表达使荒废、造成毁灭性荒凉的作用。“造成荒凉的”保留其主动或致使意味，并维持原文对“可憎之物”的修饰关系。
theological_decisions:
- issue: הַמִּקְדָּשׁ与הַמָּעוֹז的关系
  choice: 译作“圣所——那堡垒”，保留两个名词及其同位关系的张力。
  alternative: “坚固的圣所”或“圣所堡垒”
  rationale: 希伯来文没有明示两者是修饰、同位还是称谓关系。破折号使普通读者可理解其同位性质，同时避免把歧义完全消解为形容关系。
- issue: הַתָּמִיד所指为何
  choice: 正文译作“常献的燔祭”。
  alternative: “常献之祭”或仅译“常献的”
  rationale: 原文只写“常献的”，但在本书祭祀语境中是对日常例行祭献的省称。正文补明“燔祭”以便理解，并以脚注说明原文形式，避免让补足内容显得是原文明说。
- issue: מְשׁוֹמֵם的语义方向
  choice: 译作“造成荒凉的”，让分词修饰“可憎之物”。
  alternative: “使人惊骇的”或“荒凉的”
  rationale: 该词在此可被理解为致使荒凉，也带有骇人、毁灭性的语感。正文采用最符合上下文的致使含义，脚注提示另一种自然表达，而不把所指具体化。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“亵渎”“圣所”“燔祭”等保留经文所需的礼仪语域；以“出动”避免机械直译“站立”，以破折号呈现原文紧凑的同位结构。
