base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/016.yaml
  text: And the one who comes against him will do as he pleases[a], and no one will stand before him. He will stand in the Beautiful Land[b], and it will be consumed in his hand.
translation:
  language: zh_hans
  text: 那来攻击他的人，必任意而行，无人能在他面前站立。他必站在荣美之地[a]，毁灭在他手中[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“华美之地”或“美丽之地”。这个希伯来语称号表示美丽、荣美或可喜爱之地；这里指以色列／犹大之地。
    reason: lexical_alternative
  - marker: b
    text: 这句希伯来文十分简练，也可理解为“那地必在他手中被毁尽”或“他手中握有毁灭之力”。原文既可能强调他所掌控的毁灭力量，也可能强调那地在他手中遭到毁坏。
    reason: alternative_reading
lexical_decisions:
- source_word: וְיַעַשׂ
  choice: 必……而行
  rationale: עָשָׂה 的基本义是“做、行”；此处用于军事政治行动。“而行”自然庄重，又不把行动内容说得过细。
- source_word: הַבָּא אֵלָיו
  choice: 那来攻击他的
  rationale: אֶל 本可表示“到、向着”，但上下文是敌对的军事进攻，因此译为“攻击他”表达这里的语境含义。
- source_word: כִּרְצוֹנוֹ
  choice: 任意
  rationale: 原意为“照自己的意愿”。“任意而行”是自然的现代汉语表达，也传达其行动不受阻挡。
- source_word: וְאֵין עוֹמֵד לְפָנָיו
  choice: 无人能在他面前站立
  rationale: 保留“在他面前站立”的希伯来语意象；在军事语境中，该表达含有无人能够抵挡他的意思。
- source_word: וְיַעֲמֹד
  choice: 他必站在
  rationale: 保留 עָמַד“站立”的基本意象，同时让上下文显出占据或立足于该地的军事政治意味。
- source_word: בְּאֶרֶץ הַצְּבִי
  choice: 在荣美之地
  rationale: צְבִי 可指美丽、荣美或可喜爱之物；“荣美之地”保留这一称号的诗性和地理指向，而不在正文中直接增补地名。
- source_word: וְכָלָה בְיָדוֹ
  choice: 毁灭尽在他手中
  rationale: 该短语极为简练，כָלָה 可表达终结、毁尽或毁灭。“毁灭尽在他手中”保留“在他手中”的意象，并避免强行补出希伯来文未明说的主语。
theological_decisions:
- issue: “荣美之地”的所指
  choice: 正文保留“荣美之地”这一地理称号
  alternative: 直接译作“以色列地”或“犹大地”
  rationale: 在《但以理书》的异象叙事中，此称号指向以色列／犹大之地；正文保留原文的修辞称号，脚注说明所指，避免把解释直接写入经文。
- issue: 末句的句法与毁灭对象
  choice: 译作“毁灭尽在他手中”
  alternative: “全地必在他手中被毁尽”或“他手中握有毁灭之力”
  rationale: 原文省略而紧凑，既可着重他掌控毁灭之力，也可理解为那地在他手中遭毁。正文保留这种张力，脚注列出主要理解。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“任意而行”“在他面前站立”保留原文惯用意象；“荣美之地”延续地理称号的诗性；末句刻意保持原文的简练和句法含混。
