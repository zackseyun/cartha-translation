  text: וּ/מַשְׂכִּ֣ילֵי עָ֔ם יָבִ֖ינוּ לָֽ/רַבִּ֑ים וְ/נִכְשְׁל֞וּ בְּ/חֶ֧רֶב וּ/בְ/לֶהָבָ֛ה בִּ/שְׁבִ֥י וּ/בְ/בִזָּ֖ה יָמִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/033.yaml
  text: And those among the people who have insight will give understanding to the many[a], but they will stumble by sword and by flame, by captivity and by plunder[d][c][b], for days.
translation:
  language: zh_hans
  text: 民中有见识的人必使许多人明白[a]；然而，他们必因刀剑、火焰、被掳和掠夺而跌倒[b]多日。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“必教导许多人。”
    reason: lexical_alternative
  - marker: b
    text: “跌倒”也可译作“倒下”；这个希伯来词在此可表示受挫、败亡，或在迫害中死亡。
    reason: lexical_alternative
lexical_decisions:
- source_word: מַשְׂכִּילֵי עָם
  choice: 民中有洞见的人
  rationale: מַשְׂכִּילֵי 表示具有洞见、辨识力的人，也可含教导能力；译作“有洞见的人”保留其分词性质。“民中”对应 עָם，且不在正文中补入原文未明说的“以色列”。
- source_word: יָבִינוּ לָרַבִּים
  choice: 必使许多人明白
  rationale: בין 的使役式在此结合 לָרַבִּים，宜表达为使别人明白或教导多人；“使许多人明白”兼顾使役意义和现代汉语的自然表达。
- source_word: וְנִכְשְׁלוּ
  choice: 然而，他们必……跌倒
  rationale: כשל 的意象是绊跌、倒下，语境可涵盖受挫、败亡或在迫害中死亡；保留“跌倒”可避免把含义过早限定为死亡。连接词按语境译为“然而”，显出教导多人和随后受难之间的转折。
- source_word: בְּחֶרֶב וּבְלֶהָבָה
  choice: 遭刀剑、火焰……而
  rationale: 重复的 בְּ 表示造成跌倒的手段或境遇。“遭……而跌倒”在中文中自然，也保存刀剑与火焰的并列。לֶהָבָה 具体指“火焰”，不泛化为“火”。
- source_word: בִּשְׁבִי וּבְבִזָּה
  choice: 被掳和抢掠
  rationale: שְׁבִי 指被掳或囚禁状态，בִּזָּה 指抢掠、劫掠。中文以“被掳和抢掠”表达这些苦难，并与前两项形成顺畅列举。
- source_word: יָמִים
  choice: 持续多日
  rationale: 裸复数“日子”在此作时间状语，表达一段未明确限定的时日。“持续多日”符合现代汉语，又不将其解释为特定末世期限。
theological_decisions:
- issue: נִכְשְׁלוּ 是否应译成明确的死亡或彻底败亡
  choice: 跌倒
  alternative: 倒下／败亡
  rationale: “跌倒”保留希伯来文的宽泛隐喻，可包含受迫害、受挫、败亡甚至死亡，却不武断认定每个人的结局都相同。
- issue: לָרַבִּים 是否指一个具有特定神学含义的群体
  choice: 许多人
  alternative: 众人／那许多人
  rationale: 原文可理解为“许多人”或“众人”，但本节没有充分依据把它限定为某一预设的神学群体；正文采用自然且不过度诠释的“许多人”。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“有洞见的人”比单称“智者”更贴近 מַשְׂכִּילֵי 的辨识意味；“遭……而跌倒”使四项苦难在中文中保持并列，同时避免生硬照搬介词结构。所有脚注标记均已置于正文相应位置。
