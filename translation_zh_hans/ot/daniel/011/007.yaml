base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/007.yaml
  text: And one from a branch of her roots shall arise in his place[a], and he shall come against the army and enter the fortress of the king of the north[d][c][b], and he shall act against them and prevail.
translation:
  language: zh_hans
  text: 从她的根所出的一个枝子[a]必在他的位置上兴起；他必进攻军队，进入北方王的堡垒[b]，对他们采取行动[c]，并且占上风[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“从她的根所出的一个嫩枝”，即她家系中的一位后裔。
    reason: lexical_alternative
  - marker: b
    text: 或译“攻入北方王的坚固营垒”。
    reason: lexical_alternative
  - marker: c
    text: 或译“处置他们”或“在他们中间行事”；希伯来语这一表达含义较宽。
    reason: lexical_alternative
  - marker: d
    text: 或译“显出力量”或“得势”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָמַד
  choice: 必起来
  rationale: 在王朝更替的预言语境中，עמד指继起、登场，而不只是身体站立；“起来”既自然，也保留原文意象。
- source_word: מִנֵּצֶר שָׁרָשֶׁיהָ
  choice: 她根系所生的一根枝条
  rationale: נֵצֶר是嫩枝、枝条；与“她的根”连用，构成家系后裔的比喻。译文保留植物意象，脚注说明其家族含义。
- source_word: כַּנּוֹ
  choice: 接替他
  rationale: 该词组表示占据某人的位置，即继任。“接替他”符合现代汉语，同时不具体判定代词所指。
- source_word: הַחַיִל
  choice: 军队
  rationale: חַיִל虽可指力量、财富或军力，此处军事语境明确，译作“军队”最为贴切。
- source_word: בְּמָעוֹז מֶלֶךְ הַצָּפוֹן
  choice: 进入北方王的堡垒
  rationale: מָעוֹז指坚固之地或堡垒；介词ב与移动动词连用，可表达进入其中。
- source_word: וְעָשָׂה בָהֶם
  choice: 对他们采取行动
  rationale: עשה ב是含义宽泛的表达，可指对某人有所作为、处置或采取敌对行动；此译法顺应军事语境而不把行动内容说得过细。
- source_word: וְהֶחֱזִיק
  choice: 并且占上风
  rationale: חזק的使役形在此可表达显出力量、变得强盛或制胜；“占上风”自然地传达军事上的优势，同时脚注保留其他可能。
