  text: וּ/לְ/קֵ֤ץ שָׁנִים֙ יִתְחַבָּ֔רוּ וּ/בַ֣ת מֶֽלֶךְ הַ/נֶּ֗גֶב תָּבוֹא֙ אֶל מֶ֣לֶךְ הַ/צָּפ֔וֹן לַ/עֲשׂ֖וֹת מֵישָׁרִ֑ים וְ/לֹֽא תַעְצֹ֞ר כּ֣וֹחַ הַ/זְּר֗וֹעַ וְ/לֹ֤א יַעֲמֹד֙ וּ/זְרֹע֔/וֹ וְ/תִנָּתֵ֨ן הִ֤יא וּ/מְבִיאֶ֨י/הָ֙ וְ/הַ/יֹּ֣לְדָ֔/הּ וּ/מַחֲזִקָ֖/הּ בָּ/עִתִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/006.yaml
  text: At the end of years they will join together[a], and the daughter of the king of the South will come to the king of the North to make an agreement. But she will not retain the strength of her arm, and he and his arm will not stand; and she will be given up, along with those who brought her, and the one who fathered her[b], and the one who supported her in those times.
translation:
  language: zh_hans
  text: 过了若干年，他们必彼此联合。南方王的女儿必到北方王那里，为要订立协议[a]。但她不能保住自己臂膀的力量；他和他的臂膀也站立不住。她和带她来的人、她的生父[b]，以及当时支持她的人，都必被交出。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “订立协议”原文直译为“作成正直（或公平）的事”，也可理解为“订立公平条款”或“达成公正的协议”。
    reason: lexical_alternative
  - marker: b
    text: “她的生父”所对应的希伯来语分词是阳性形式。也有译本译作“她的孩子”，或采用其他所指。
    reason: textual_or_lexical_ambiguity
lexical_decisions:
- source_word: וּלְקֵץ שָׁנִים
  choice: 过了若干年
  rationale: 该短语直指一段年日终结之时；现代汉语用“过了若干年”自然表达若干年之后，同时不虚构确切年数。
- source_word: יִתְחַבָּרוּ
  choice: 他们必彼此联合
  rationale: התפעל词形表示相互结合或结盟；“彼此联合”保留政治联盟的可能性而不过度具体化。
- source_word: וּבַת מֶלֶךְ הַנֶּגֶב
  choice: 南方王的女儿
  rationale: 保留但以理书第11章中“南方王”的方向性政治称号以及定指的父女关系。
- source_word: תָּבוֹא אֶל מֶלֶךְ הַצָּפוֹן
  choice: 必到北方王那里
  rationale: בוא可依叙述视角译为“来”或“去”；“到……那里”在汉语中自然，并避免不必要地固定叙述视点。
- source_word: לַעֲשׂוֹת מֵישָׁרִים
  choice: 为要达成和约
  rationale: מֵישָׁרִים本义涉及正直、公平或平正之事，在外交语境中指建立公平条款或协议；正文用“和约”表达其政治功能，脚注保留字面含义。
- source_word: לֹא תַעְצֹר כּוֹחַ הַזְּרוֹעַ
  choice: 她臂膀的力量不能保持
  rationale: 保留“臂膀”这一力量隐喻；עצר表达把持、保有，故译“不能保持”。
- source_word: וְלֹא יַעֲמֹד וּזְרֹעוֹ
  choice: 那王和他的臂膀也站立不住
  rationale: 阳性单数主语在上下文中很可能指北方王；“他的臂膀”保留原文的权势隐喻，“站立不住”保留不能存立或持久的习语。
- source_word: וְתִנָּתֵן הִיא
  choice: 她……必被交出
  rationale: נתן的尼פעל式为被动，可指被交付、交出或放弃；“被交出”清楚而不增添交给何人的信息。
- source_word: וּמְבִיאֶיהָ
  choice: 带她来的人
  rationale: 该分词复数指把她带来或护送来的人；直译可避免擅自限定为侍从。
- source_word: וְהַיֹּלְדָהּ
  choice: 生她的人
  rationale: 马所拉文本为阳性单数分词，语义可指生育或生父；正文采用较贴近词面的“生她的人”，脚注说明其语法性别及其他理解，以保留文本难点。
- source_word: וּמַחֲזִקָהּ
  choice: 支持她的人
  rationale: חזק的使役分词可表示使之强盛、扶持或支持；“支持她的人”自然且能涵盖政治保护者。
- source_word: בָּעִתִּים
  choice: 当时
  rationale: 原文复数“在那些时期”在这里指相关历史阶段；汉语以“当时”简洁自然地表达，未指定精确时点。
theological_decisions:
- issue: “那王和他的臂膀”的指代
  choice: 正文以“那王”承接北方王，同时保留“臂膀”隐喻
  alternative: 译为“他不能站立，他的势力也不能”或把主语理解为另一人物
  rationale: 原文仅用阳性单数动词及“他的臂膀”，指代存在一定含混；最近且最自然的阳性先行词是北方王。译文作最低限度的指代显化，不把“臂膀”进一步解释成军队或政权。
- issue: וְהַיֹּלְדָהּ所指的人
  choice: 译为“生她的人”，并用脚注说明马所拉文本为阳性形式
  alternative: 明确译作“她父亲”，或按异解译作“她的孩子”
  rationale: 原文语法支持男性生育者，但具体历史所指及部分释读有争议；较直译的表达能保留这种张力，避免在正文中过度判定。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“必”体现预言体语气；保留“南方王／北方王”“臂膀”“站立不住”等贯穿本章的称号和意象。正文的[a]、[b]与脚注逐一对应。
