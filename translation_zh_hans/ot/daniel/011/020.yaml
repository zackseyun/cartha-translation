  text: וְ/עָמַ֧ד עַל כַּנּ֛/וֹ מַעֲבִ֥יר נוֹגֵ֖שׂ הֶ֣דֶר מַלְכ֑וּת וּ/בְ/יָמִ֤ים אֲחָדִים֙ יִשָּׁבֵ֔ר וְ/לֹ֥א בְ/אַפַּ֖יִם וְ/לֹ֥א בְ/מִלְחָמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/020.yaml
  text: Then one will arise in his place who will send an exactor through the splendor of the kingdom[a]; but within a few days he will be broken[c][b], though not in anger and not in battle.
translation:
  language: zh_hans
  text: 随后，在他的位置上必兴起一人；他必使一名征收贡赋者[a]经过王国的荣美之地[b]。但不出几日，他必被毁灭；却不在愤怒中[c]，也不在战争中。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “征收贡赋者”也可译作“征税官”或“压迫者”。原文指强行征收贡赋或款项的人。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“王国的荣美”或“王国的威荣”。原文可能指国中最华美的地方，也可能泛指王国的尊荣与华美。
    reason: lexical_alternative
  - marker: c
    text: 也可理解为“不是由于愤怒”或“不是在盛怒中”。原文表达简略，未说明是谁的愤怒，或愤怒与其毁灭有何关系。
    reason: textual_ambiguity
lexical_decisions:
- source_word: וְעָמַד עַל כַּנּוֹ
  choice: 随后，必有一人接替他兴起
  rationale: 这是《但以理书》11章中表示统治者更替的惯用表达；“接替他兴起”自然传达在前任位置上继起之意，“随后”体现叙事推进。
- source_word: מַעֲבִיר
  choice: 使……经过
  rationale: 保留עבר使役式“使某人经过”的空间意象，不将其收窄为单纯“派遣”。
- source_word: נוֹגֵשׂ
  choice: 催征者
  rationale: 该词指强制征收贡赋或款项的人；“催征者”既体现征收职能，也保留其带有强制性的色彩。
- source_word: הֶדֶר מַלְכוּת
  choice: 王国的荣美之地
  rationale: הדר可指荣美、华美或威荣；结合“经过”的空间表达，正文采用“荣美之地”，同时以脚注保留泛指王国荣美或威荣的可能。
- source_word: וּבְיָמִים אֲחָדִים
  choice: 不出几日
  rationale: 自然表达事情将在很短时间内发生，不强求精确的日数。
- source_word: יִשָּׁבֵר
  choice: 覆灭
  rationale: שבר的被动形式在此比喻统治者遭毁灭或垮台；“覆灭”符合现代汉语政治语境，又避免生硬直译为“被折断”。
- source_word: וְלֹא בְאַפַּיִם
  choice: 却不是出于愤怒
  rationale: אַפַּיִם常表示怒气或震怒，介词ב所表达的方式或原因较为含混；正文保留这种压缩表达，并以脚注提示其他理解。
- source_word: וְלֹא בְמִלְחָמָה
  choice: 也不是在战争中
  rationale: 直接表达其覆灭并非发生于战争或战斗，保持与前一否定短语的平行。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“催征者”保留古代政治经济语境而不过分技术化；“覆灭”传达统治者迅速败亡的含义。句式维持原文先继位、后施政、再突然覆灭的推进，并通过脚注保留关键短语的词义与句法歧义。
