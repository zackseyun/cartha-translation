id: DAN.11.37
reference: Daniel 11:37
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/עַל אֱלֹהֵ֤י אֲבֹתָי/ו֙ לֹ֣א יָבִ֔ין וְ/עַל חֶמְדַּ֥ת נָשִׁ֛ים וְ/עַֽל כָּל אֱל֖וֹהַּ לֹ֣א יָבִ֑ין כִּ֥י עַל כֹּ֖ל יִתְגַּדָּֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/037.yaml
  text: He will show no regard for the gods of his fathers[a], or for the desire of women, or for any god[b], because he will magnify himself above all.
translation:
  language: zh_hans
  text: 他不顾他祖先的诸神[a]，也不顾妇女所爱慕的[b]，不顾任何神，因为他要高抬自己，超过一切。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他祖先的上帝。”希伯来语形式是复数“诸神”，但有人将其理解为圣经中常见的“祖先的上帝”这一表达。
    reason: alternative_reading
  - marker: b
    text: 希伯来语直译近于“妇女所爱慕的”，可指妇女所渴望的事物，也可指她们所爱慕的某一位。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהֵי אֲבֹתָיו
  choice: 他祖先的诸神
  rationale: אֱלֹהֵי 在形态上为复数附属形式，且上下文提到“任何神”，故正文保留复数。“祖先”以现代汉语自然表达 אֲבֹתָיו，同时不改变其世代传承之意。
- source_word: לֹא יָבִין
  choice: 不顾
  rationale: בין 基本义为“明白、考虑”，与 עַל 连用时在此表示留意、重视或顾念；“不顾”简洁自然，并准确传达其漠视之意。
- source_word: חֶמְדַּת נָשִׁים
  choice: 妇女所爱慕的
  rationale: 该附属结构可指妇女渴望的事物，也可指她们所爱慕的某一位。“所爱慕的”保留对象未明的特点，不把它限定为婚姻、性欲、儿女、某位神祇或弥赛亚期待。
- source_word: כָּל אֱלוֹהַּ
  choice: 任何神
  rationale: כָּל 加单数名词在此具有逐一涵盖的分配意义；“任何神”符合现代汉语，也表达毫无例外。
- source_word: כִּי עַל כֹּל יִתְגַּדָּל
  choice: 因为他要高抬自己，超过一切
  rationale: גדל 的 Hitpael 形式表达自我抬高；“高抬自己”保留反身含义，“超过一切”传达 עַל כֹּל 的比较与凌驾意味。
theological_decisions:
- issue: חֶמְדַּת נָשִׁים 的所指
  choice: 正文译作“妇女所爱慕的”，保留所指不明。
  alternative: 可理解为妇女普遍渴望的事物，或妇女所爱慕的某一位；传统上另有婚姻、儿女、特定神祇或弥赛亚期待等解释。
  rationale: 希伯来语本身不能明确判定具体所指；正文不引入某一宗派或历史解释，脚注只说明主要语法可能。
- issue: אֱלֹהֵי אֲבֹתָיו 的数
  choice: 按形态译为复数“他祖先的诸神”。
  alternative: “他祖先的上帝”。
  rationale: 该词形为复数，附近又提到“任何神”，因此正文采用复数；但“祖先的上帝”是圣经中常见表达及重要传统读法，故列入脚注。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“不顾”避免生硬直译为“不明白”；“高抬自己”保留自我尊大的反身色彩。正文中的[a]、[b]均与脚注对应。
