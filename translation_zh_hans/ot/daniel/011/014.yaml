source:
  edition: WLC
  text: וּ/בָ/עִתִּ֣ים הָ/הֵ֔ם רַבִּ֥ים יַֽעַמְד֖וּ עַל מֶ֣לֶךְ הַ/נֶּ֑גֶב וּ/בְנֵ֣י פָּרִיצֵ֣י עַמְּ/ךָ֗ יִֽנַּשְּׂא֛וּ לְ/הַעֲמִ֥יד חָז֖וֹן וְ/נִכְשָֽׁלוּ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/014.yaml
  text: And in those times many will rise up against the king of the South[a], and the violent among your people will lift themselves up to establish the vision[c][b], but they will stumble.
translation:
  language: zh_hans
  text: 在那些时期，必有许多人起来反对南方王；你本族中的横暴之徒[a]也必自高自大，要使异象得以确立[b]，但他们必跌倒。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你本族中强暴之人的儿子。”希伯来语的结构较复杂，也可理解为“你本族中的横暴之徒”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“要使异象应验。”
    reason: alternative_reading
lexical_decisions:
- source_word: וּבָעִתִּים הָהֵם
  choice: 在那些时期
  rationale: 保留复数“时期”的历史进程意味，比“在那些日子”更贴近原文，也符合现代汉语。
- source_word: רַבִּים יַעַמְדוּ עַל
  choice: 必有许多人起来反对
  rationale: עמד על在冲突语境中表示敌对、抗拒；“起来反对”自然表达其主动对抗之意。
- source_word: מֶלֶךְ הַנֶּגֶב
  choice: 南方王
  rationale: 但以理书11章以方向称谓指涉地缘政治势力；“南方王”简洁地保留该称号。
- source_word: וּבְנֵי פָּרִיצֵי עַמְּךָ
  choice: 你本族中强暴之人的子孙
  rationale: 较形式地保留בני的“子孙”和פָּרִיצֵי的强暴、横行意味，不把这一困难结构提前解释为某个特定群体；另在脚注列出性质化理解。
- source_word: יִנַּשְּׂאוּ
  choice: 必自高自大
  rationale: 该形式表达自我抬高、自我高举；“自高自大”在现代汉语中自然传达政治反叛语境下的自我抬举，而非身体上的举起。
- source_word: לְהַעֲמִיד חָזוֹן
  choice: 要使异象确立
  rationale: העמיד本义为“使站立、使确立”；此译保留其使役意味，不直接断定为“应验”。
- source_word: וְנִכְשָׁלוּ
  choice: 但他们必跌倒
  rationale: 保留כשל的跌倒意象，同时可涵盖失败或败亡，未过度限定结果。
theological_decisions:
- issue: וּבְנֵי פָּרִיצֵי עַמְּךָ所指群体的性质
  choice: 正文译作“你本族中强暴之人的子孙”
  alternative: 你本族中的强暴之徒
  rationale: 希伯来语结构较复杂，既可较直译地保留“子孙”，也可将“……之子”理解为性质或类别称谓。正文保留形式上的张力，脚注给出顺畅的性质化理解，不将其等同于后来的特定派别。
- issue: לְהַעֲמִיד חָזוֹן的含义
  choice: 使异象确立
  alternative: 使异象应验
  rationale: 原文动词并不直接等同于“应验”。正文贴近“使之站立、确立”的措辞，脚注保留较具解释性的可能译法。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“南方王”“异象”延续本章与先知文学的术语一致性；对两处有真实歧义的短语以正文加脚注处理，避免加入特定宗派或历史身份判断。
