base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/015.yaml
  text: Then the king of the north will come and heap up a siege ramp and capture a fortified city[a], and the forces of the south will not stand, nor his choice troops[b], for there will be no strength to stand.
translation:
  language: zh_hans
  text: 于是，北方王必来，筑起攻城土垒，攻取一座坚城。南方的军队必站立不住，连南方王的精锐部队[a]也站立不住，因为再没有力量站立。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“南方王所拣选的民”。按上下文，这句话很可能是指南方王精选的兵员或精锐部队。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָבֹא
  choice: 于是……必来
  rationale: 连接词与未完成时在此推进预言叙事；“于是”自然表达先后承接，“必来”体现语境中的将来确定性。
- source_word: מֶלֶךְ הַצָּפוֹן
  choice: 北方王
  rationale: 保留但以自然汉语表达《但以理书》11章反复出现的南北政治称谓。
- source_word: וְיִשְׁפֹּךְ סֹלֲלָה
  choice: 筑起攻城土垒
  rationale: 该希伯来语搭配指堆筑用于围城的土垒；译出军事用途，避免按字面译成不自然的“倾倒土垒”。
- source_word: וְלָכַד
  choice: 攻取
  rationale: 在围城军事语境中表示夺取城池；“攻取”简洁而准确。
- source_word: עִיר מִבְצָרוֹת
  choice: 一座坚城
  rationale: 复数名词在结构中描述城防坚固；“坚城”是现代汉语中简明自然的军事表达。
- source_word: וּזְרֹעוֹת הַנֶּגֶב
  choice: 南方的军队
  rationale: “膀臂”在此比喻军事力量；按语境译为“军队”，避免汉语读者误解为人体肢体。
- source_word: לֹא יַעֲמֹדוּ
  choice: 必站立不住
  rationale: 保留“站立”的原文意象，同时在战事语境中自然传达无法坚守或抵抗。
- source_word: וְעַם מִבְחָרָיו
  choice: 连他的精锐部队
  rationale: 上下文为军事冲突，所拣选的人最可能指精锐兵员；“连”表明这一成分进一步强调南方无法站立。代词“他的”保留原文所含的指代。
- source_word: וְאֵין כֹּחַ לַעֲמֹד
  choice: 因为他们无力站立
  rationale: 在汉语中用“因为”明示该分句对前文的原因说明，并重复“站立”，保留原文的词语呼应。
theological_decisions:
- issue: וְעַם מִבְחָרָיו 所指的是一般百姓还是精选兵员
  choice: 正文译作“他的精锐部队”
  alternative: “他所拣选的民”或“他精选的人”
  rationale: 军事上下文以及与“南方的军队”的并列关系支持精锐兵员之义；脚注保留较贴近字面的另一种理解，不赋予该短语额外的神学身份。
translation_notes:
  register: 采用现代、庄重而清楚的书面普通话。保留“站立”在相邻分句中的重复，以呈现原文的修辞联系；军事术语采用普通读者容易理解的“攻城土垒”“坚城”“精锐部队”。
