base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/029.yaml
  text: At the appointed time he will return and come into the south[a], but it will not be as the former or as the latter.
translation:
  language: zh_hans
  text: 到了所定的时候，他必回来，进入南方；但这次不会像从前，也不会像后来。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译：“但不会像先前，也不像后来。”原文的比较对象被省略，表达较为简约。
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמּוֹעֵד
  choice: 到了指定的日期
  rationale: מוֹעֵד指预定、指定的时间；此处不将其具体化为节期或聚会。“到了指定的日期”在现代汉语中自然，并保留时间已被定下的含义。
- source_word: יָשׁוּב
  choice: 他必返回
  rationale: שׁוּב在Qal词干中通常表示“返回、回去”；军事行动的语境适合译作“返回”。“必”表达未完成式在预言叙述中的将来指向。
- source_word: וּבָא
  choice: 进入
  rationale: בוא可表示“来、进入”。与地域“南方”搭配时，“进入”比直译为“来到”更自然，也清楚表达向该地区进军。
- source_word: בַנֶּגֶב
  choice: 南方
  rationale: נֶגֶב既可指尼革夫，也可指“南方”。但以理书11章以南北势力相对，故这里宜作方向及政治地域意义的“南方”，不缩窄为尼革夫。
- source_word: וְלֹא תִהְיֶה
  choice: 但这一次不会
  rationale: 阴性单数动词所指的行动或战役在原文中省略。“这一次不会”以自然汉语保留省略，不武断补出“战役”或“结果”。
- source_word: כָרִאשֹׁנָה
  choice: 像前一次
  rationale: רִאשׁוֹנָה可表示“先前的、第一次的”。结合隐含的行动，“前一次”既自然又保留比较对象未明说的简练。
- source_word: וְכָאַחֲרֹנָה
  choice: 也不会像后一次
  rationale: אַחֲרוֹנָה可表示“后来的、末后的”。“后一次”与“前一次”形成对应，并保留原文所压缩的比较关系；连词形式上是“和”，在否定比较句中自然译为“也不”。
theological_decisions:
- issue: “前一次／后一次”所比较的具体对象
  choice: 不在正文中明确为某两次战役或某种结果
  alternative: 补译为“这次战役的结果不会像前一次或后一次”
  rationale: 希伯来文只用阴性形容词作比较，所修饰的名词被省略。为避免把特定历史辨识或解释写入正文，应保留这种含混和简省。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。“指定的日期”传达预定时间；“南方”顺应本章的地缘政治语境。正文以“这一次”使汉语完整，但不明说是战役、远征还是结果；脚注提示原文比较结构的省略与另一种时间性理解。
