  text: ו/בנ/ו יִתְגָּר֗וּ וְ/אָסְפוּ֙ הֲמוֹן֙ חֲיָלִ֣ים רַבִּ֔ים וּ/בָ֥א ב֖וֹא וְ/שָׁטַ֣ף וְ/עָבָ֑ר וְ/יָשֹׁ֥ב ו/יתגרו עַד מעז/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/010.yaml
  text: His sons will stir themselves up and assemble a multitude of great forces[a], and one will certainly come and overflow and pass through[b]; then he will return and stir up war as far as his fortress.
translation:
  language: zh_hans
  text: 他的儿子们必奋起，集结大批军队。其中一人必定前来[a]，如洪水般席卷而过；他必返回，再度交战，直抵他的堡垒[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“他必定前来”。希伯来文在这里从复数“他的儿子们”转为单数，可能特别聚焦其中一个儿子。
    reason: alternative_reading
  - marker: b
    text: “堡垒”也可译作“坚固据点”。原文虽作单数“他的”，却没有明说这个代词指谁。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָנָיו
  choice: 他的儿子们
  rationale: בנים在王朝争战的语境中指男性后裔；译作“儿子们”比“孩子们”更准确。
- source_word: יִתְגָּרוּ
  choice: 必奋起
  rationale: גרה的Hitpael词形含有激起自己、投入争战之意；“奋起”保留其反身意味，也符合军事语境。
- source_word: וְאָסְפוּ הֲמוֹן חֲיָלִים רַבִּים
  choice: 聚集许多大军
  rationale: 该短语描写大批军力的集结；“许多大军”以自然中文表达הֲמוֹן与חֲיָלִים רַבִּים所强调的庞大数量。
- source_word: וּבָא בּוֹא
  choice: 其中一人必定前来
  rationale: 限定动词与绝对不定式连用，加强动作的确定性；原文又由复数主语转为单数，因此用“其中一人”显明语法转换，却不指认具体是哪一个儿子。
- source_word: וְשָׁטַף וְעָבָר
  choice: 如洪水般席卷而过
  rationale: שטף保留洪水漫溢的军事比喻，עבר表达继续穿越、推进；合译为“如洪水般席卷而过”既呈现意象，也符合现代汉语。
- source_word: וְיָשֹׁב
  choice: 随后他必返回
  rationale: שוב表示返回；“随后”自然呈现叙事次序而不增加新的事件。
- source_word: וְיִתְגָּרֶה
  choice: 再次奋战
  rationale: 此处再次使用גרה的Hitpael词形，指重新投入争战；“再次”反映动作的重复，并与前文“奋起”相呼应。
- source_word: עַד מָעֻזֹּה
  choice: 直到他的堡垒
  rationale: מָעוֹז指堡垒或坚固据点，阳性单数后缀直译为“他的”；“直到”保留עַד所表示的界限，不额外断定堡垒属于哪一方。
theological_decisions:
- issue: 复数“他的儿子们”之后单数主语的所指
  choice: 译为“其中一人必定前来”，显出单数转换，但不指明是哪一个儿子。
  alternative: 译为“他必定前来”，或根据历史解释直接写出特定儿子。
  rationale: 希伯来文从复数转为单数，却没有在本节给出该人的身份；正文保留这一转换及其未确定性。
- issue: “他的堡垒”中代词所指
  choice: 保留阳性单数“他的”，不说明堡垒具体属于谁。
  alternative: 按上下文释为“他们的堡垒”，或在正文中明确归给某一历史人物。
  rationale: 原文后缀是阳性单数，但其先行对象并未明说；不应借翻译消除这种歧义。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。以短句呈现连续军事行动；保留“洪水”意象、复数转单数的语法张力，以及堡垒归属的不确定性。
