  yaml_path: translation/ot/daniel/011/003.yaml
  text: Then a mighty king will arise[a], and he will rule with great dominion and do as he pleases.
translation:
  language: zh_hans
  text: 必有一位强大的王兴起，施行广大的统治，任意而行。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָמַד
  choice: 必有……兴起
  rationale: עמד在此预言语境中指一位统治者出现、崛起，而非单纯站立。用“必有”体现未完成式在预言中的将来指向；不另译连接词，以符合现代汉语自然的承接方式。
- source_word: מֶלֶךְ גִּבּוֹר
  choice: 一位强大的王
  rationale: גִּבּוֹר兼有强盛、有力和英武之意；“强大的王”保留政治与军事力量的宽泛含义，不局限为“勇士之王”。
- source_word: וּמָשַׁל מִמְשָׁל רַב
  choice: 掌握大权
  rationale: 动词משׁל与同根名词מִמְשָׁל构成强调表达，表示施行范围广大的统治权。“掌握大权”以自然汉语传达实际统治及权势之大。
- source_word: וְעָשָׂה כִּרְצוֹנוֹ
  choice: 任意而行
  rationale: 该短语直指按自己的意愿行事，语境中含权力不受制约之意；“任意而行”简洁、庄重，并保留这一力度。
