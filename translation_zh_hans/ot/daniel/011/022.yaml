id: DAN.11.22
reference: Daniel 11:22
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וּ/זְרֹע֥וֹת הַ/שֶּׁ֛טֶף יִשָּׁטְפ֥וּ מִ/לְּ/פָנָ֖י/ו וְ/יִשָּׁבֵ֑רוּ וְ/גַ֖ם נְגִ֥יד בְּרִֽית׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/022.yaml
  text: The flood-like forces will be swept away from before him and be broken[b][a], and also the prince of the covenant.
translation:
  language: zh_hans
  text: 如洪水般的军队必从他面前被冲走、被击溃[a]，盟约的领袖也必如此[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “如洪水般的军队”直译为“洪水的膀臂”，可能是指势不可挡的军事力量。
    reason: lexical_alternative
  - marker: b
    text: “盟约的领袖”也可译作“盟约之君”。原文没有说明此人的身份。
    reason: lexical_alternative
lexical_decisions:
- source_word: זְרֹעוֹת הַשֶּׁטֶף
  choice: 如洪水般的军队
  rationale: זְרֹעוֹת字面为“膀臂”，在军事政治语境中可指武力或军队；הַשֶּׁטֶף带有洪水奔涌之意。译文以“如洪水般的军队”传达其军事所指并保留洪水意象，字面形式置于脚注。
- source_word: יִשָּׁטְפוּ
  choice: 必……被冲走
  rationale: 该词在此为尼法勒式，与洪水意象呼应，宜表达被压倒、冲去的被动意义。
- source_word: מִלְּפָנָיו
  choice: 从他面前
  rationale: 保留原文的空间和对抗意味，表示这些军队在他面前被除去。
- source_word: וְיִשָּׁבֵרוּ
  choice: 被击溃
  rationale: שבר的尼法勒式意为“被打破、被粉碎”；军事语境下“被击溃”自然清楚，同时不必断定具体毁灭程度。
- source_word: וְגַם
  choice: 也必如此
  rationale: 原文将“盟约的领袖”追加为同受前述动作影响者。汉语补出“必如此”，使省略关系清楚，而不增加新的事件。
- source_word: נְגִיד בְּרִית
  choice: 盟约的领袖
  rationale: נְגִיד可指领袖、统领或君王；“领袖”不预设王族身份，也不预先认定其历史身份。בְּרִית虽无冠词，在语境中可作特指，故译“盟约”。
theological_decisions:
- issue: “盟约的领袖”的身份及其特指性
  choice: 译作“盟约的领袖”，不在正文中指认其人。
  alternative: 可理解为大祭司俄尼亚三世、一般性的盟约领袖，或弥赛亚人物。
  rationale: 希伯来文本本身没有明说此人的历史身份；透明保留称号，可避免把有争议的解释写入译文。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“被冲走、被击溃”延续原文洪水与破碎的双重意象；“也必如此”明确汉语中的承接关系。所有脚注标记均置于相关正文之后。
