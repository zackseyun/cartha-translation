  text: 他必伸手攻击列国，埃及地也不能逃脱[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“将没有逃脱的余地。”希伯来文的字面结构是“将不成为逃脱（之处）”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִשְׁלַח יָדוֹ
  choice: 他必伸手攻击
  rationale: שׁלח的基本义是“伸出、伸展”或“差遣”；与“手”连用时，在此军事语境中表示施展权势、发动攻击。译文保留“伸手”的希伯来意象，并用“攻击”清楚表达介词短语所体现的敌对方向。
- source_word: בַּאֲרָצוֹת
  choice: 列国
  rationale: אֲרָצוֹת是复数，可指诸地、诸国；在列举军事扩张对象的语境中，“列国”简洁自然，也保留多个疆域或国家的含义。介词בּ在此结合动词短语译入“攻击”。
- source_word: וְאֶרֶץ מִצְרַיִם
  choice: 埃及地也
  rationale: 原文明确使用“埃及之地”的结构，因此保留为“埃及地”，而不简化成“埃及”；וְ在此承接并突出埃及也在其势力范围内，译作“也”符合现代汉语。
- source_word: לֹא תִהְיֶה לִפְלֵיטָה
  choice: 不能逃脱
  rationale: 字面为“不会成为逃脱／幸免”，其中פְּלֵיטָה可表示逃脱、幸免或逃脱者。按本节军事语境，译作“不能逃脱”自然清楚，同时用脚注保留原文较特殊的表达。
