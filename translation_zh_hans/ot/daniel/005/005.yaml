  text: בַּ/הּ שַׁעֲתָ֗/ה נפקו אֶצְבְּעָן֙ דִּ֣י יַד אֱנָ֔שׁ וְ/כָֽתְבָן֙ לָ/קֳבֵ֣ל נֶבְרַשְׁתָּ֔/א עַל גִּירָ֕/א דִּֽי כְתַ֥ל הֵיכְלָ֖/א דִּ֣י מַלְכָּ֑/א וּ/מַלְכָּ֣/א חָזֵ֔ה פַּ֥ס יְדָ֖/ה דִּ֥י כָתְבָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/005.yaml
  text: At that moment the fingers of a human hand came out and wrote opposite the lampstand on the plaster of the wall of the king’s palace[e][d][c][b][a], and the king saw the palm of the hand that was writing.
translation:
  language: zh_hans
  text: 就在那一刻，人的手指头伸了出来，在灯台对面、王宫墙壁的灰泥上写字[a][b][c][d]。王看见了那只正在写字的手的手掌[e]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “人的手指头”也可译作“男人的手指头”；亚兰语 אֱנָשׁ 既可指男人，也可泛指人。
    reason: lexical_alternative
  - marker: b
    text: “灯台对面”也可译作“灯台前面”。
    reason: lexical_alternative
  - marker: c
    text: “灰泥”也可译作“石灰灰泥”或“粉刷层”。
    reason: lexical_alternative
  - marker: d
    text: “王宫”也可译作“王的大厅”；这个亚兰语词既可指宫殿，也可指其中宏伟的大厅。
    reason: lexical_alternative
  - marker: e
    text: “手掌”或可较宽泛地译作“手”；פַּס 在这里的确切含义尚有争议。
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּהּ שַׁעֲתָה
  choice: 就在那一刻
  rationale: 这是表示即时发生的亚兰语习语；“就在那一刻”自然地传达事件的突然性。
- source_word: נפקו
  choice: 伸出来
  rationale: 原词本义为“出来”；结合指头这一主语，“伸出来”既保留出现、显露的动态感，也符合现代汉语表达。
- source_word: אֶצְבְּעָן דִּי יַד אֱנָשׁ
  choice: 有人手的指头
  rationale: 按构造关系直译为人的手所具有的指头；“人手”保留其与超自然现象之间的张力，又不把 אֱנָשׁ 限定为某个男性。
- source_word: וְכָתְבָן
  choice: 写字
  rationale: 复数形式与“指头”呼应；汉语无需显式标示数，用“写字”自然呈现叙事动作。
- source_word: לָקֳבֵל נֶבְרַשְׁתָּא
  choice: 灯台对面
  rationale: לָקֳבֵל 可指“对面”或“前面”；正文采用空间关系较明确的“对面”，并以脚注保留另一可能。
- source_word: עַל גִּירָא
  choice: 在……灰泥上
  rationale: גִּירָא 指墙面的石灰灰泥或粉刷层；“灰泥”简洁准确，技术性适中。
- source_word: דִּי כְתַל הֵיכְלָא דִּי מַלְכָּא
  choice: 王宫墙壁的
  rationale: כְתַל 是墙壁；הֵיכְלָא 在宫廷语境可指王宫，也可能指其中的宏伟大厅，正文选用较自然的“王宫”。
- source_word: וּמַלְכָּא חָזֵה
  choice: 王看见了
  rationale: 以现代汉语简单叙事形式表达原文的视觉动作。
- source_word: פַּס יְדָה
  choice: 手的手掌
  rationale: פַּס 的确切所指有争议，常解为手掌、手的一部分或整只手；正文采用较具体的传统理解“手掌”，脚注保留宽泛可能。
- source_word: דִּי כָתְבָה
  choice: 正在写字的
  rationale: 关系从句描绘王看见手正在书写的场景；“正在”体现持续中的动作。
