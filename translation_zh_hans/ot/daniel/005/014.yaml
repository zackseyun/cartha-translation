  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/שִׁמְעֵ֣ת עלי/ך דִּ֛י ר֥וּחַ אֱלָהִ֖ין בָּ֑/ךְ וְ/נַהִיר֧וּ וְ/שָׂכְלְתָנ֛וּ וְ/חָכְמָ֥ה יַתִּירָ֖ה הִשְׁתְּכַ֥חַת בָּֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/014.yaml
  text: And I have heard about you that the spirit of the gods is in you[b][a], and that light and insight and extraordinary wisdom are found in you.
translation:
  language: zh_hans
  text: 我听说你有诸神的灵[a]，又有光明[b]、悟性和非凡的智慧。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“上帝的灵”或“上帝之灵”。亚兰文直译为“诸神的灵”，反映这位王的说法。
    reason: alternative_reading
  - marker: b
    text: “光明”原指光或明亮，这里比喻心思清明、洞察通达。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁמְעֵת עֲלָיִךְ דִּי
  choice: 我听说
  rationale: 该表达引出王所听到的关于但以理的消息；现代汉语用“我听说”即可自然涵盖其内容从句。
- source_word: רוּחַ אֱלָהִין
  choice: 诸神的灵
  rationale: אֱלָהִין 在形态上为复数，且说话者是巴比伦王；译作“诸神的灵”保留其宫廷语境和说话者视角，不将其措辞预先改写为以色列的独一神信仰表述。
- source_word: בָּךְ
  choice: 在你里面
  rationale: 直译其处所含义，并与后半句各样品质“在你里面”相呼应。
- source_word: נַהִירוּ
  choice: 光明
  rationale: 原词本义为光或明亮，此处比喻思想上的明澈；“光明”保留原有意象，具体语境义由脚注说明。
- source_word: שָׂכְלְתָנוּ
  choice: 悟性
  rationale: 表示理解、明辨或洞察的能力；“悟性”在现代汉语中自然，并能与“光明”和“智慧”有所区分。
- source_word: חָכְמָה יַתִּירָה
  choice: 非凡的智慧
  rationale: יַתִּירָה 表示超出寻常；“非凡的”准确传达其强化意味，又符合现代汉语表达。
- source_word: הִשְׁתְּכַחַת
  choice: 有
  rationale: 原义为“被发现、存在”；汉语以“在你里面有……”表达同一存在意义，比机械译作“被发现”更自然。
theological_decisions:
- issue: 在异教君王的话中，אֱלָהִין 应译作单数的“上帝”还是复数的“诸神”
  choice: 诸神的灵
  alternative: 上帝的灵／上帝之灵
  rationale: 当前说话者是伯沙撒，且该词形为复数；正文保留巴比伦君王的表述方式，避免把他的语言无声地改成犹太教或基督教的神学措辞。由于该词组也可按但以理从上帝所得的能力作单数理解，脚注保留这一译法。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“诸神的灵”保留异教君王的说话视角；后半句重复“在你里面”，使原文各项品质都“存在于”但以理里面的结构清楚可见。
