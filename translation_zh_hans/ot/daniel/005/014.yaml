  naturalness: 原稿的“我听说，……而且在你里面有……”虽可理解，但停顿后直接进入内容从句略显生硬，重复“在你里面有”也较拗口。修订为“我听说你有……，又有……”是现代标准汉语中自然、庄重的转述方式；“光明”保留并由脚注说明其认知层面的比喻用法。
  terminology: “诸神的灵”忠实反映亚兰文复数形式及异教君王的说话视角；不将其正文预设为“上帝的灵”。“悟性”“非凡的智慧”分别恰当对应理解力与超常的智慧。
