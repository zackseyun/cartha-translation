  rationale: 修订仅作汉语措辞和脚注锚点调整。“我听说你有……”在本语境中自然地涵盖“我听说关于你的事，即……”，并保留所闻内容。以“又有”并列后续三项，等值表达它们“在你里面被发现”；“诸神的灵”及其替代译法脚注均予保留。
