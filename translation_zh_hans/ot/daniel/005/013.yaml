base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/013.yaml
  text: Then Daniel was brought in before the king. The king answered and said to Daniel[a], “Are you that Daniel, one of the exiles of Judah, whom the king my father brought from Judah?”
translation:
  language: zh_hans
  text: 于是，但以理被带到王面前。王问但以理说：“你就是那位但以理吗？你是我父王[a]从犹大带来的、犹大被掳之人中的一员吗？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “父王”也可指“先王”。在古代王室用语中，“父”可以指祖先或前代君王，不一定专指亲生父亲。
    reason: 文化及历史语境说明
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: 于是
  rationale: 这是承接前文、推进叙事的亚兰语标记；“于是”自然表达随即发生的下一事件。
- source_word: הֻעַל
  choice: 被带到
  rationale: 该使役被动形式表明但以理由别人带入王的面前；中文用“被带到”准确且自然。
- source_word: קֳדָם מַלְכָּא
  choice: 王面前
  rationale: 这是表示进入某人临在或觐见场景的惯用表达；译作“王面前”简洁而符合宫廷语境。
- source_word: עָנֵה ... וְאָמַר
  choice: 问……说
  rationale: 原文直译为“回答并说”，但这里并非回应但以理先前的话，而是王向他发问；现代中文以“问……说”保留发言公式及疑问语境，避免生硬。
- source_word: אַנְתָּה הוּא דָנִיֵּאל
  choice: 你就是那位但以理
  rationale: 代词与系词结构具有辨认、确认身份的语气；“那位”保留原文略带距离感的指认意味。
- source_word: דִּי מִן בְּנֵי גָלוּתָא
  choice: 从犹大被掳的人中出来的
  rationale: 字面为“属于被掳之子民中的”；此译自然表达但以理是被掳群体的一员，并与后面的“从犹大带来”相衔接。
- source_word: יְהוּד
  choice: 犹大
  rationale: 此处兼具地域及群体背景，但上下文明确说从那里带来，译为地名“犹大”最贴切。
- source_word: דִּי הַיְתִי מַלְכָּא אַבִי מִן יְהוּד
  choice: 是我父王从犹大带来的吗
  rationale: 保留“父”这一原文明说，同时用中文常见的“父王”表达君王所称的父辈或前代君王；句末疑问语气符合上下文。
theological_decisions:
- issue: 王室用语“我父”（אַבִי）的所指
  choice: 正文译作“我父王”，脚注说明可指先王
  alternative: 我的前任
  rationale: 原文明说“我的父亲”，不宜在正文中直接消解其历史张力；古代王室称谓中的“父”可泛指祖先或在位前的君王，因此以脚注交代其语用范围。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“于是”推动故事进程；“你就是那位但以理”保留王确认身份时的指认语气。正文保留“父王”，不在译文中预先解决其历史所指，并以脚注说明王室用法。
