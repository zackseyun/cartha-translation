source:
  edition: WLC
  text: קָרֵ֤א מַלְכָּ/א֙ בְּ/חַ֔יִל לְ/הֶֽעָלָה֙ לְ/אָ֣שְׁפַיָּ֔/א כשדי/א וְ/גָזְרַיָּ֑/א עָנֵ֨ה מַלְכָּ֜/א וְ/אָמַ֣ר לְ/חַכִּימֵ֣י בָבֶ֗ל דִּ֣י כָל אֱ֠נָשׁ דִּֽי יִקְרֵ֞ה כְּתָבָ֣/ה דְנָ֗ה וּ/פִשְׁרֵ/הּ֙ יְחַוִּנַּ֔/נִי אַרְגְּוָנָ֣/א יִלְבַּ֗שׁ ו/המונכ/א דִֽי דַהֲבָ/א֙ עַֽל צַוְּארֵ֔/הּ וְ/תַלְתִּ֥י בְ/מַלְכוּתָ֖/א יִשְׁלַֽט׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/007.yaml
  text: The king called out loudly to bring in the enchanters[a], the Chaldeans, and the diviners. The king answered and said to the wise men of Babylon, “Any man who reads this writing and makes its interpretation known to me shall be clothed with purple, have a chain of gold around his neck[c][b], and rule as third in the kingdom.”
translation:
  language: zh_hans
  text: 王高声呼喊，召术士、迦勒底人[a]和占卜者进来。王对巴比伦的智者说：“无论谁能读这文字，把它的解释告诉我，谁就必身穿紫袍，颈戴金链，并在国中居第三位掌权[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “迦勒底人”在这里也可能指巴比伦宫廷中的一类术士或占星家，而不只是一个民族群体。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“作国中的第三位统治者”。原文很可能是指权力地位居第三。
    reason: alternative_reading
lexical_decisions:
- source_word: קָרֵא ... בְּחַיִל
  choice: 大声下令
  rationale: 该短语表示王以强有力的声音公开呼喊；结合召见宫廷人员的语境，译作“大声下令”既保留声音的力度，也自然表达王命。
- source_word: לְהֶעָלָה
  choice: 召……进来
  rationale: 使役式不定词在宫廷场景中指把人带到王面前；现代汉语用“召……进来”自然明确。
- source_word: אָשְׁפַיָּא
  choice: 术士
  rationale: 此词指从事法术或咒术的宫廷专业人员。“术士”简洁庄重，并与后文统称的“智者”有所区别。
- source_word: כשדי/א
  choice: 迦勒底人
  rationale: 保留原词的民族或宫廷专业称谓，不在正文中限定为占星家；其职业性含义另以脚注说明。
- source_word: גָזְרַיָּא
  choice: 占卜者
  rationale: 此词指判断征兆、作出占断的人；“占卜者”是现代读者易懂且不过度具体化的称呼。
- source_word: עָנֵה מַלְכָּא וְאָמַר
  choice: 王……说
  rationale: 这是亚兰文常见的叙事套语。逐字译为“回答说”在此处汉语生硬，故以自然的“说”表达其言说功能。
- source_word: לְחַכִּימֵי בָבֶל
  choice: 巴比伦的智者
  rationale: 直译宫廷智者群体的统称，措辞自然并保留其正式身份。
- source_word: כָל אֱנָשׁ דִּי
  choice: 无论谁
  rationale: 原文虽为阳性单数形式，但在此为泛指；“无论谁”准确传达任何人的开放条件，避免中文不必要的性别限定。
- source_word: יִקְרֵה כְּתָבָה דְנָה
  choice: 读出这文字
  rationale: כְּתָבָה 指墙上的书写内容；“文字”比“铭文”更少解释性，“读出”符合向王辨读文字的场景。
- source_word: וּפִשְׁרֵהּ יְחַוִּנַּנִי
  choice: 把它的解释告诉我
  rationale: 保留“解释”这一名词及“使我知道”的动作，以流畅现代汉语表达。
- source_word: אַרְגְּוָנָא יִלְבַּשׁ
  choice: 身穿紫袍
  rationale: 紫色衣物象征王室荣誉；语境所指为服饰，译作“紫袍”比抽象的“紫色”更自然，但未进一步规定具体式样。
- source_word: וְהַמּוֹנְכָא דִי דַהֲבָא עַל צַוְּארֵהּ
  choice: 颈戴金链
  rationale: 该名词指作为尊荣标志的金质链饰；“颈戴金链”简洁准确。
- source_word: וְתַלְתִּי בְמַלְכוּתָא יִשְׁלַט
  choice: 在国中掌权，位列第三
  rationale: תַלְתִּי 可能表示居第三位或作第三位统治者。正文采用最可能的等级含义，同时以脚注保留另一种句法表达。
theological_decisions:
- issue: “迦勒底人”是民族称谓还是宫廷智者的专业称谓
  choice: 正文保留“迦勒底人”
  alternative: 占星家
  rationale: 原词在《但以理书》中可兼具民族与职业含义。正文不强行消除歧义，脚注提示其可能指一类巴比伦宫廷术士。
- issue: תַלְתִּי 所指的权位
  choice: 在国中掌权，位列第三
  alternative: 作国中的第三位统治者
  rationale: 两者都表达第三等级的权柄；正文采用自然且能体现排名的说法，脚注保留更具职衔色彩的译法，不推定具体政治制度。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“大声下令”“召……进来”符合宫廷场景；“术士、迦勒底人和占卜者”保留不同专业群体的区分。条件句用“无论谁……谁就……”呈现原文泛指关系。所有脚注标记均置于正文相关词句之后。
