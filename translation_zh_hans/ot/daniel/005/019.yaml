  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וּ/מִן רְבוּתָ/א֙ דִּ֣י יְהַב לֵ֔/הּ כֹּ֣ל עַֽמְמַיָּ֗/א אֻמַיָּ/א֙ וְ/לִשָּׁ֣נַיָּ֔/א הֲו֛וֹ זאעין וְ/דָחֲלִ֖ין מִן קֳדָמ֑וֹ/הִי דִּֽי הֲוָ֨ה צָבֵ֜א הֲוָ֣א קָטֵ֗ל וְ/דִֽי הֲוָ֤ה צָבֵא֙ הֲוָ֣ה מַחֵ֔א וְ/דִֽי הֲוָ֤ה צָבֵא֙ הֲוָ֣ה מָרִ֔ים וְ/דִֽי הֲוָ֥ה צָבֵ֖א הֲוָ֥ה מַשְׁפִּֽיל־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/019.yaml
  text: And because of the greatness that he gave him[a], all peoples, nations, and languages were trembling and fearing before him. Whomever he wanted, he killed; and whomever he wanted, he kept alive; and whomever he wanted, he raised up; and whomever he wanted[c][b], he humbled.
translation:
  language: zh_hans
  text: 因着他所赐给他的尊荣[a]，各族、各国、各方言的人都在他面前战兢惧怕。他想杀谁就杀谁，想让谁活就让谁活，想抬举谁就抬举谁，想使谁降卑就使谁降卑。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他所赐给他的”：施予者承接上一节，指上帝；受予者指尼布甲尼撒。
    reason: 说明原文隐含主语及两个代词的所指。
lexical_decisions:
- source_word: רְבוּתָא
  choice: 尊荣
  rationale: 该词表示伟大、尊崇或崇高地位；语境强调上帝赐给尼布甲尼撒的王权威荣。“尊荣”比单用“伟大”更自然地表达君王的显赫地位。
- source_word: יְהַב לֵהּ
  choice: 他所赐给他的
  rationale: 保留亚兰文中未明说的施予者；按上一节，前一个“他”指上帝，后一个“他”指尼布甲尼撒。
- source_word: עַמְמַיָּא אֻמַיָּא וְלִשָּׁנַיָּא
  choice: 各族、各国、说各种语言的人
  rationale: 保留三项并列，又避免把“语言”本身写成会惧怕的主体；最后一项按闪语习惯表达为以语言区分的人群。
- source_word: זאעין וְדָחֲלִין
  choice: 战兢惧怕
  rationale: 用两个相联而不重复的现代汉语词保留原文成对用词的加强效果。
- source_word: מִן קֳדָמוֹהִי
  choice: 在他面前
  rationale: 自然表达处于君王面前及其权势之下的含义。
- source_word: דִּי הֲוָה צָבֵא
  choice: 他想……谁就……谁
  rationale: 以重复句式呈现君王意志所具有的任意性，并保持原文四个分句的修辞节奏。
- source_word: קָטֵל
  choice: 杀
  rationale: 直接、准确地表达杀死，不弱化原文力度。
- source_word: מַחֵא
  choice: 让……活
  rationale: 与“杀”形成鲜明对偶；该词也可理解为使人存活或饶人性命。
- source_word: מָרִים
  choice: 抬举
  rationale: 既保留“举高”的隐喻，也自然表达提升人的地位。
- source_word: מַשְׁפִּיל
  choice: 使……降卑
  rationale: 保留与“抬举”相对的高低意象，并准确表达使人地位降低。
theological_decisions:
- issue: 赐予尼布甲尼撒尊荣者的身份
  choice: 正文保留“他所赐给他的”，不直接补出“上帝”
  alternative: 译作“上帝所赐给他的”
  rationale: 亚兰文本节没有重述主语，施予者须从上一节承接为上帝。正文保留原文的隐含指代，脚注加以说明，避免在正文中增补专名。
- issue: 君王使人存活的动作
  choice: 译作“想让谁活就让谁活”
  alternative: 译作“想饶谁就饶谁”或“想使谁存活就使谁存活”
  rationale: 原词在与“杀”相对时可指保全性命；“让谁活”保留其语义范围，不把它限定为司法赦免。
translation_notes:
  register: 采用现代、庄重而清楚的叙述语体。四次使用“想……谁就……谁”保留亚兰文的重复和强烈节奏；“战兢惧怕”“抬举／降卑”兼顾经文庄重感与普通读者的可理解性。
