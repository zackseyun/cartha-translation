revisions:
- from: 他被赶离世人[a]，他的心变得像野兽一样[b]，与野驴[c]同住。他像牛一样被喂草吃，身体被天降的露水湿透，直到他明白：至高的上帝掌管世人的国度[d]，愿意立谁，就立谁治理这国。
  to: 他被赶出人群[a]，他的心变得像野兽一样[b]，与野驴[c]同住。他被喂食草，如同牛一样；他的身体被天上的露水湿透，直到他明白：至高的上帝掌管人类的国度[d]，愿意立谁，就立谁治理这国。
  rationale: 修订仅处理汉语表达及细微的源语贴合度：将食草的比较关系明确译出，采用“天上的露水”对应原文，并将泛称的人类政权表达为“人类的国度”。其余关键意象、神圣称号和主权陈述均予保留。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T07:55:15Z'
review_pass:
  verdict: revise
  source_fidelity: 译文总体准确传达了被逐离人群、心如兽类、与野驴同居、食草、受露水浸湿，以及至高上帝掌管并设立统治者的连续叙述。惟“他像牛一样被喂草吃”在汉语中比较关系和被动使役关系均不够清楚；原文是“他被喂食草，如同牛一样”。
  naturalness: 整体庄重、现代且通顺。“他像牛一样被喂草吃”明显生硬，容易被理解为“他以像牛的方式被喂食”；宜改为“他被喂食草，如同牛一样”。“天上的露水”也比“天降的露水”更贴近原文固定表达并自然。
  terminology: “至高的上帝”“野驴”“野兽”“掌管”均合适。“人类的国度”比“世人的国度”更明确地对应泛称的“人”的国度，同时避免“世人”在同一句中重复造成的歧义。
