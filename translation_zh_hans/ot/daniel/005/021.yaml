source:
  edition: WLC
  text: וּ/מִן בְּנֵי֩ אֲנָשָׁ֨/א טְרִ֜יד וְ/לִבְבֵ֣/הּ עִם חֵיוְתָ֣/א שוי וְ/עִם עֲרָֽדַיָּ/א֙ מְדוֹרֵ֔/הּ עִשְׂבָּ֤/א כְ/תוֹרִין֙ יְטַ֣עֲמוּנֵּ֔/הּ וּ/מִ/טַּ֥ל שְׁמַיָּ֖/א גִּשְׁמֵ֣/הּ יִצְטַבַּ֑ע עַ֣ד דִּֽי יְדַ֗ע דִּֽי שַׁלִּ֞יט אֱלָהָ֤/א עלי/א בְּ/מַלְכ֣וּת אֲנָשָׁ֔/א וּ/לְ/מַן דִּ֥י יִצְבֵּ֖ה יְהָקֵ֥ים עלי/ה־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/021.yaml
  text: He was driven away from the sons of men[a], and his heart was made like the beasts, and his dwelling was with the wild donkeys. He was fed grass like oxen, and his body was drenched with the dew of heaven[d][c][b], until he knew that the Most High God rules over the kingdom of mankind and sets over it whomever he wills.
translation:
  language: zh_hans
  text: 他被赶出人群[a]，他的心变得像野兽一样[b]，与野驴[c]同住。他被喂食草，如同牛一样；他的身体被天上的露水湿透，直到他明白：至高的上帝掌管人类的国度[d]，愿意立谁，就立谁治理这国。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “人群”原文直译为“人的众子”，泛指人类。
    reason: lexical_alternative
  - marker: b
    text: 这里的“心”也可包括思想、意志和性情。
    reason: lexical_alternative
  - marker: c
    text: “野驴”指生活在野外的驴类动物。
    reason: cultural_note
  - marker: d
    text: “人类的国度”也可译作“人的国度”。
    reason: lexical_alternative
lexical_decisions:
- source_word: טְרִיד
  choice: 被赶离
  rationale: 表达被动遭驱逐、与人群隔绝的结果，也与本节连续的受辱状态相称。
- source_word: בְּנֵי אֲנָשָׁא
  choice: 世人
  rationale: 这是泛指人类的惯用语；“世人”既自然，也保留了与野兽相对的意义。
- source_word: לִבְבֵהּ ... שוי
  choice: 他的心变得像野兽一样
  rationale: 保留“心”的原文意象，同时以“变得”自然表达其内在状态被改变；不把含义限缩为现代意义上的理智或精神疾病。
- source_word: חֵיוְתָא
  choice: 野兽
  rationale: 与人类形成鲜明对照，并保留王遭降卑、兽化的强烈意象。
- source_word: עֲרָדַיָּא
  choice: 野驴
  rationale: 该词特指野驴一类动物；“野驴”是现代汉语中准确、易懂的表达。
- source_word: מְדוֹרֵהּ
  choice: 同住
  rationale: 原文直指其居处与野驴在一起；译作“同住”比名词化的“住处”更符合现代汉语。
- source_word: עִשְׂבָּא כְתוֹרִין יְטַעֲמוּנֵּהּ
  choice: 他像牛一样被喂草吃
  rationale: 保留使役结构中他作为受事者的意味，同时清楚呈现“草”和“牛”的比较。
- source_word: גִּשְׁמֵהּ יִצְטַבַּע
  choice: 身体……湿透
  rationale: “身体”准确对应名词，“湿透”体现动词所表达的彻底沾湿。
- source_word: אֱלָהָא עליא
  choice: 至高的上帝
  rationale: 准确、庄重地表达神圣称号，在现代汉语中也自然清楚。
- source_word: שַׁלִּיט
  choice: 掌管
  rationale: 直接表达实际统治和主权，不额外引入抽象的神学术语。
- source_word: יְהָקֵים
  choice: 立……治理
  rationale: “立”保留任命、设立之意；补出“治理”使“立在其上”的关系在汉语中明确。
theological_decisions:
- issue: 如何表达至高上帝对人间政权的主权
  choice: 至高的上帝掌管世人的国度，愿意立谁，就立谁治理这国
  alternative: 至高的上帝在世人的国中掌权，并把国赐给他所愿意的人
  rationale: 原文强调上帝实际掌权，并主动设立他所愿意的人；本译文保留这一力度，同时不把经文扩展成更系统化的政治神学论断。
- issue: אֲנָשָׁא 的性别与范围
  choice: 世人
  alternative: 人类／男人
  rationale: 此处泛指全体人类，并非只指男性；“世人”准确表达其代表性范围，也与前文形成词语呼应。
- issue: “心像野兽”所指为何
  choice: 保留“心”的原文意象，并以脚注说明其语义范围
  alternative: 他的理智变得像野兽一样
  rationale: 亚兰文“心”可涵盖思想、意志和性情；直接译成“理智”会把原文较宽的含义过度限定。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。句式保留原文连续描写受辱状态的节奏，并在主权宣告处用冒号形成自然转折。避免古奥词语，也不把“心”现代医学化或心理学化。
