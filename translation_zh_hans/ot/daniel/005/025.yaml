- source_word: כְתָבָא דִּי רְשִׁים
  choice: 所写的文字
  rationale: כְתָבָא可指“文字、题字”，רְשִׁים为被动“被写下”；合译既忠实又符合现代汉语，且保留“题字/铭文”的可能性于脚注。
- source_word: מְנֵא מְנֵא
  choice: 米尼，米尼
  rationale: 保留音译及原文重复，以维持神秘题字的形式，并为后文“数算”的双关留下空间。
- source_word: תְּקֵל
  choice: 提客勒
  rationale: 采用音译，不预先译成“称量”或货币名称，以保留下一节解释中的文字游戏。
- source_word: וּפַרְסִין
  choice: 乌法珥新
  rationale: 将连词וּ与פַרְסִין一并按传统可辨识形式音译；保留本节的复数形式及其与后文单数“毗勒斯”、‘分开’和‘波斯人’之间的双关。
