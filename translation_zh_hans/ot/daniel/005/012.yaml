id: DAN.5.12
reference: Daniel 5:12
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כָּ/ל קֳבֵ֡ל דִּ֣י ר֣וּחַ יַתִּירָ֡ה וּ/מַנְדַּ֡ע וְ/שָׂכְלְתָנ֡וּ מְפַשַּׁ֣ר חֶלְמִין֩ וַֽ/אַֽחֲוָיַ֨ת אֲחִידָ֜ן וּ/מְשָׁרֵ֣א קִטְרִ֗ין הִשְׁתְּכַ֤חַת בֵּ/הּ֙ בְּ/דָ֣נִיֵּ֔אל דִּֽי מַלְכָּ֥/א שָׂם שְׁמֵ֖/הּ בֵּלְטְשַׁאצַּ֑ר כְּעַ֛ן דָּנִיֵּ֥אל יִתְקְרֵ֖י וּ/פִשְׁרָ֥/ה יְהַֽחֲוֵֽה־׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/012.yaml
  text: because an extraordinary spirit[a], knowledge, and understanding to interpret dreams, explain riddles, and solve difficulties were found in him, in Daniel, whom the king named Belteshazzar. Now let Daniel be called[c][b], and he will show the interpretation.
translation:
  language: zh_hans
  text: 因为发现但以理——王给他起名叫伯提沙撒——具有非凡的灵[a]、知识和悟性，能解释梦境、解明谜语、解开难题[b]。现在可以召但以理来，他必说明其中的解释[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “非凡的灵”也可译作“卓越的灵”。这里没有明确说明这灵的来源。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“解开绳结”，比喻解决棘手、难解的问题。
    reason: cultural_note
  - marker: c
    text: “说明其中的解释”也可译作“使人知道其中的解释”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל־קֳבֵל דִּי
  choice: 因为
  rationale: 这是亚兰语因果表达，承接上文，说明太后为何推荐但以理；“因为”自然并保留其因果作用。
- source_word: רוּחַ יַתִּירָה
  choice: 非凡的灵
  rationale: יַתִּירָה 表示超常、卓越；“非凡的灵”既保留 רוּחַ 的措辞，也不擅自明确其来源。
- source_word: מַנְדַּע וְשָׂכְלְתָנוּ
  choice: 知识和悟性
  rationale: 分别呈现知识与理解、洞察能力，保留原文并列累加的表达。
- source_word: מְפַשַּׁר חֶלְמִין
  choice: 能解释梦境
  rationale: 该分词描述但以理所具有的能力；译为“能解释梦境”符合现代汉语表达。
- source_word: אַחֲוָיַת אֲחִידָן
  choice: 解明谜语
  rationale: 指把隐晦、难解之事说明清楚；“解明谜语”简洁地保留宫廷智慧语境。
- source_word: מְשָׁרֵא קִטְרִין
  choice: 解开难题
  rationale: 原文直译为“解开绳结”，以此比喻解决棘手问题；正文采用自然汉语，脚注保留原有意象。
- source_word: הִשְׁתְּכַחַת בֵּהּ
  choice: 在但以理身上……发现有
  rationale: 较贴近原文“在他里面被发现”的结构，同时在汉语中清楚可读。
- source_word: דִּי מַלְכָּא שָׂם שְׁמֵהּ בֵּלְטְשַׁאצַּר
  choice: 王给他起名叫伯提沙撒
  rationale: “立他的名为”在现代汉语中自然表达为“给他起名叫”。
- source_word: כְּעַן דָּנִיֵּאל יִתְקְרֵי
  choice: 现在可以召但以理来
  rationale: יִתְקְרֵי 是被动、指令性的“让他被召来”；译文保留建议召见的语气，并避免生硬直译。
- source_word: פִשְׁרָהּ יְהַחֲוֵה
  choice: 他必说明那解释
  rationale: 意为使那解释为人所知；“说明那解释”保留“解释”这一名词，并符合上下文。
theological_decisions:
- issue: “非凡的灵”是否明确指上帝的灵
  choice: 保留为“非凡的灵”，不明确限定为圣灵或上帝的灵
  alternative: 译作“上帝所赐的非凡之灵”或直接理解为“上帝的灵”
  rationale: 本节称赞但以理具有超常的灵、知识和悟性，却没有在此处明确说明这灵的来源；译文保留原文的神学张力，不作超出文本的限定。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“伯提沙撒”沿用通行圣经人名译法。破折号标出插入的改名说明；“解释梦境、解明谜语、解开难题”形成清晰的并列节奏。
