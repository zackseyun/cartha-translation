  naturalness: ‘在但以理身上——王给他起名叫伯提沙撒——发现有’的插入结构可理解，但略显拗口；改为‘发现但以理……具有’更合乎现代汉语。‘他必说明那解释’搭配生硬，‘他必说明其中的解释’更自然且不改变原意。
  terminology: ‘伯提沙撒’为通行译名；‘非凡的灵’保留原文未明示其来源的含混性，合宜。‘知识和悟性’能区分原文并列的两项品质。脚注a不应把‘灵’解释为特定神圣位格；现有说明适当。
