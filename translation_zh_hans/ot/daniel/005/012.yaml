revisions:
- from: 因为在但以理身上——王给他起名叫伯提沙撒——发现有非凡的灵[a]、知识和悟性，能解释梦境、解明谜语、解开难题[b]。现在可以召但以理来，他必说明那解释[c]。
  to: 因为发现但以理——王给他起名叫伯提沙撒——具有非凡的灵[a]、知识和悟性，能解释梦境、解明谜语、解开难题[b]。现在可以召但以理来，他必说明其中的解释[c]。
  rationale: 仅作必要的汉语行文修订：将较滞涩的被动式插入结构改为自然的‘发现但以理……具有’，并将不自然的‘说明那解释’改为‘说明其中的解释’。保留原文对‘灵’来源的未定性、智慧项目的并列关系、‘解开绳结’的比喻性脚注，以及末句宣示解释的含义。
