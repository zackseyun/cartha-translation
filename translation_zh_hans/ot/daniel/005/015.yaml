  to: 如今，智慧人和术士被带到我面前，要读这文字，把它的解释告诉我；但他们不能把这话的解释说明出来。
  rationale: 仅作一处文体与指称上的安全调整：以“这话”替换“这信息”，并将末句改为更自然的“把这话的解释说明出来”。修订仍保留原文两次“解释”的重复、王要求术士解读文字的目的，以及他们未能展示其解释的意思。
