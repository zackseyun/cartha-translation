base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/015.yaml
  text: And now the wise men, the enchanters, have been brought before me to read this writing and make its interpretation known to me, but they were not able to show the interpretation of the message.
translation:
  language: zh_hans
  text: 如今，智慧人和术士被带到我面前，要读这文字，把它的解释告诉我；但他们不能把这话的解释说明出来。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חַכִּימַיָּא
  choice: 智慧人
  rationale: 这是亚兰语中对宫廷智者的统称；译作“智慧人”既贴近原文，也与《但以理书》的语境相符。
- source_word: אָשְׁפַיָּא
  choice: 术士
  rationale: 指从事法术或咒术的一类宫廷人员；“术士”自然简洁，又不把词义过度限定为某一种具体法术。
- source_word: כְתָבָה דְנָה
  choice: 这文字
  rationale: 原文直指眼前所写的内容；“这文字”保留其具体指示性，不额外推定载体或文字种类。
- source_word: פִשְׁרֵהּ / פְּשַׁר
  choice: 解释
  rationale: 该词在本章表示对神秘文字所作的解明；统一译作“解释”，保留原文的重复。
- source_word: מִלְּתָא
  choice: 信息
  rationale: 该词可指话、事情或所传达的内容；此处承接墙上的文字，译作“信息”较自然，同时保留其内容层面的含义。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。保留原文两次出现“解释”的重复，以呈现王所要求的任务与术士失败之间的对应；不增加原文未明说的神学判断。
