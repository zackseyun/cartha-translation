base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/018.yaml
  text: As for you[a], O king, the Most High God gave kingship and greatness and glory and majesty to Nebuchadnezzar your father.
translation:
  language: zh_hans
  text: 至于你，王啊，至高的上帝曾把王权、尊大、荣耀和威严赐给你父亲尼布甲尼撒[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “你父亲”也可理解为“你的祖先”或“你的前任”；亚兰文直译为“你父亲”，但在王室谱系语言中可以有更宽泛的用法。
    reason: lexical_alternative
lexical_decisions:
- source_word: אנתה
  choice: 至于你
  rationale: 独立人称代词前置，带有强调和话语转折作用；“至于你”自然地保留这一语用色彩。
- source_word: מַלְכָּא
  choice: 王啊
  rationale: 此处是正式的呼语；“王啊”保留宫廷场景中的庄重直接称呼。
- source_word: אֱלָהָא עִלָּיָא
  choice: 至高的上帝
  rationale: 准确传达亚兰文对上帝的至高尊称，也符合现代汉语宗教语体。
- source_word: מַלְכוּתָא
  choice: 王权
  rationale: 这里指上帝赐给尼布甲尼撒个人的君王权位与统治权，并非主要指疆域意义上的“国度”。
- source_word: רְבוּתָא
  choice: 尊大
  rationale: 该词表示伟大、崇高的地位；“尊大”与后面的王室荣誉词组协调，并保持庄重语气。
- source_word: יְקָרָא
  choice: 荣耀
  rationale: 在王室语境中表示尊荣或荣耀；“荣耀”保留原文递进并列的庄严感。
- source_word: הַדְרָה
  choice: 威严
  rationale: 表示君王的华美、尊贵与威仪；“威严”既区别于前面的“荣耀”，又符合现代汉语表达。
- source_word: יְהַב
  choice: 曾把……赐给
  rationale: 原词为简单的“给”；“赐给”自然表达上帝向君王授予王权与尊荣，“曾”则使过去时态在汉语中更清楚。
- source_word: לִנְבֻכַדְנֶצַּר
  choice: 给……尼布甲尼撒
  rationale: 按普通话通行的圣经人名音译处理。
- source_word: אֲבוּךְ
  choice: 你父亲
  rationale: 正文保留亚兰文通常的亲属称谓；该词在王室或谱系语言中也可广义指祖先或前任，相关歧义以脚注说明。
theological_decisions:
- issue: “你父亲”在王室及谱系语言中的含义
  choice: 正文保留直译“你父亲”
  alternative: “你的祖先”或“你的前任”
  rationale: 原文使用普通的“父亲”一词，而该词在古代近东王室语言中可有较宽泛的谱系或承继含义。正文不替原文消解这一张力，脚注则提示可能范围。
translation_notes:
  register: 采用现代、庄重而清楚的普通话。“至于你，王啊”保留前置代词的强调和正式呼语；四项并列名词维持原文王室语域及累积节奏。脚注标记置于“尼布甲尼撒”之后，用来说明整个“你父亲尼布甲尼撒”这一关系表达。
