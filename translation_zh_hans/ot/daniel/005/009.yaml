  text: אֱ֠דַיִן מַלְכָּ֤/א בֵלְשַׁאצַּר֙ שַׂגִּ֣יא מִתְבָּהַ֔ל וְ/זִיוֺ֖/הִי שָׁנַ֣יִן עֲל֑וֹ/הִי וְ/רַבְרְבָנ֖וֹ/הִי מִֽשְׁתַּבְּשִֽׁין׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/009.yaml
  text: Then King Belshazzar became greatly alarmed[a], his color changed[b], and his nobles were perplexed.
translation:
  language: zh_hans
  text: 于是，伯沙撒王大为惊慌，脸色也变了[a]；他的权贵都困惑不安[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“容貌改变了”。亚兰语原文直译近于“他的光彩（或容貌）在他身上改变了”，这里指因惊恐而显在脸上的变化。
    reason: lexical_alternative
  - marker: b
    text: “权贵”指王手下地位显赫的高级官员；“困惑不安”也可译作“茫然失措”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱדַיִן
  choice: 于是
  rationale: 这是承接前文、推进叙事的亚兰语标记；“于是”自然地表达紧接着发生的反应。
- source_word: מַלְכָּא בֵלְשַׁאצַּר
  choice: 伯沙撒王
  rationale: 按现代汉语习惯将王号置于人名之后，同时准确保留其身份。
- source_word: שַׂגִּיא מִתְבָּהַל
  choice: 大为惊慌
  rationale: שַׂגִּיא 强化 מִתְבָּהַל 所表达的受惊、慌乱状态；“大为惊慌”既传达强烈程度，也符合自然汉语。
- source_word: זִיוֹהִי שָׁנַיִן עֲלוֹהִי
  choice: 脸色也变了
  rationale: זִיו 可指光彩、容貌或面色；结合恐惧语境，整个亚兰语表达指外貌尤其是脸色发生可见变化。“脸色也变了”简明自然，同时以脚注保留字面范围。
- source_word: רַבְרְבָנוֹהִי
  choice: 他的权贵
  rationale: 该词指王身边地位显赫的达官贵人或高级官员；“权贵”适合宫廷语境，又避免“贵族”可能带来的世袭身份限定。
- source_word: מִשְׁתַּבְּשִׁין
  choice: 都困惑不安
  rationale: 该分词表示陷入迷乱、困惑或失序状态；“困惑不安”兼顾思想上的茫然与现场的慌乱。
theological_decisions: []
