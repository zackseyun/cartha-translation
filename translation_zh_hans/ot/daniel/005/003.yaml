base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/003.yaml
  text: Then they brought in the gold vessels that had been taken out of the temple[a], the house of God, which was in Jerusalem, and the king and his nobles[b], his wives and his concubines drank from them.
translation:
  language: zh_hans
  text: 于是，就把从耶路撒冷上帝的殿中取出的金器皿拿来；王和他的权贵、王的妻子[a]和妃嫔都用这些器皿饮酒。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “王的妻子”所译的亚兰文可指王室配偶；有些译作“王后”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: 于是
  rationale: 作为亚兰文叙事推进语，承接上一节的命令并引出随后的行动；“于是”自然且庄重。
- source_word: הַיְתִיו
  choice: 人们……拿来
  rationale: 此处动词以金器皿为宾语，表示把器皿带来；原文未明说主语，汉语用泛指“人们”可避免擅自指定执行者。
- source_word: מָאנֵי דַהֲבָא
  choice: 金器皿
  rationale: מָאנֵי可指器具、器皿；在圣殿语境中，“器皿”准确而有礼仪色彩。
- source_word: דִּי הַנְפִּקוּ
  choice: 取出的
  rationale: 原文使用主动形式但未明说施事者；汉语无主语的“取出”保留这一点，并让焦点仍落在器皿上。
- source_word: מִן הֵיכְלָא דִּי בֵית אֱלָהָא
  choice: 从……上帝殿中
  rationale: הֵיכְלָא指殿宇，后面的“上帝之家”说明其性质。现代汉语合译为“上帝殿”，既清楚又避免累赘的重复表达。
- source_word: דִּי בִירוּשְׁלֶם
  choice: 耶路撒冷
  rationale: 原文关系结构说明上帝的殿位于耶路撒冷；汉语将地名置于“上帝殿”之前最自然。
- source_word: וְאִשְׁתִּיו בְּהוֹן
  choice: 都用这些器皿喝酒
  rationale: 介词表示以器皿作为饮酒用具；“用……喝酒”是自然的现代汉语表达。
- source_word: מַלְכָּא וְרַבְרְבָנוֹהִי
  choice: 王和他的权贵
  rationale: רַבְרְבָנוֹהִי指王手下的显贵或高级人物；“权贵”简洁、庄重，并保留其社会地位含义。
- source_word: שֵׁגְלָתֵהּ
  choice: 王后
  rationale: 该词指王室中的妻妾或王室配偶，具体范围并不完全确定；正文采用自然的“王后”，并以脚注保留“王妃”等可能译法。
- source_word: וּלְחֵנָתֵהּ
  choice: 妃嫔
  rationale: 指地位较低的王室女性伴侣；“妃嫔”在中文王室语境中比“妾”更自然、庄重，也与前项形成身份层级。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事文体。保留原文未明说取出器皿者的特点；将“殿，就是上帝的家”按现代汉语自然压缩为“上帝殿”，不改变所指。脚注标记已在正文对应位置出现。
