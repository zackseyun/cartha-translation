id: DAN.5.23
reference: Daniel 5:23
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/עַ֣ל מָרֵֽא שְׁמַיָּ֣/א הִתְרוֹמַ֡מְתָּ וּ/לְ/מָֽאנַיָּ֨/א דִֽי בַיְתֵ֜/הּ הַיְתִ֣יו קדמי/ך ו/אנתה ו/רברבני/ך שֵֽׁגְלָתָ֣/ךְ וּ/לְחֵנָתָ/ךְ֮ חַמְרָ/א֮ שָׁתַ֣יִן בְּ/הוֹן֒ וְ/לֵֽ/אלָהֵ֣י כַסְפָּֽ/א וְ֠/דַהֲבָ/א נְחָשָׁ֨/א פַרְזְלָ֜/א אָעָ֣/א וְ/אַבְנָ֗/א דִּ֠י לָֽא חָזַ֧יִן וְ/לָא שָׁמְעִ֛ין וְ/לָ֥א יָדְעִ֖ין שַׁבַּ֑חְתָּ וְ/לֵֽ/אלָהָ֞/א דִּֽי נִשְׁמְתָ֥/ךְ בִּ/ידֵ֛/הּ וְ/כָל אֹרְחָתָ֥/ךְ לֵ֖/הּ לָ֥א הַדַּֽרְתָּ־׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/023.yaml
  text: But you have exalted yourself against the Lord of heaven[a], and the vessels of his house were brought before you, and you and your nobles, your wives, and your concubines have been drinking wine from them. And you have praised the gods of silver and gold, bronze, iron, wood, and stone, which do not see or hear or know; but the God in whose hand is your breath, and to whom belong all your ways[c][b], you have not honored.
translation:
  language: zh_hans
  text: 你却高抬自己，敌对天上的主[a]。他殿里的器皿被带到你面前，你和你的大臣、妻子、妃嫔都用这些器皿喝酒。你又赞美那些银、金、铜、铁、木、石的神；它们看不见，听不到，也一无所知。然而，你的气息在上帝手中[b]，你所走的一切道路也都属于他；你却没有尊崇他[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“天上的主宰。”亚兰文 מָרֵא 既可表示“主”，也可表示“主宰”。
    reason: lexical_alternative
  - marker: b
    text: 也可表达为：“那位把你的气息握在手中的上帝。”
    reason: lexical_alternative
  - marker: c
    text: 或译：“你却没有把荣耀归给他。”
    reason: lexical_alternative
lexical_decisions:
- source_word: מָרֵא שְׁמַיָּא
  choice: 天上的主
  rationale: מָרֵא可指“主”或“主宰”；“天上的主”既自然庄重，也保留这一神圣称号及שְׁמַיָּא在此处的集合意义。
- source_word: הִתְרוֹמַמְתָּ
  choice: 高抬自己
  rationale: 该反身形式表达自我抬高、狂傲自大；“高抬自己”保留向上抬举的意象。
- source_word: מָאנַיָּא דִי בַיְתֵהּ
  choice: 他殿里的器皿
  rationale: בַיְתֵהּ直译为“他的家／殿”；上下文明确指上帝的圣殿，译作“殿”可避免现代读者误解，同时“器皿”准确表达圣殿用具。
- source_word: רַבְרְבָנַיִךְ
  choice: 你的大臣
  rationale: 指宫廷中的高官显贵；“大臣”符合王室语境，也比“贵族”更自然。
- source_word: שֵׁגְלָתָךְ וּלְחֵנָתָךְ
  choice: 你的妻子、妃嫔
  rationale: 两词分别指王室妻室和地位较低的妾室；此译保留二者的区分，并适合现代中文的宫廷语境。
- source_word: חַמְרָא שָׁתַיִן בְּהוֹן
  choice: 用这些器皿喝酒
  rationale: 分词描写宴席中正在发生的亵渎行为；中文无需另加进行体标记即可自然呈现场景。
- source_word: אֱלָהֵי כַסְפָּא וְדַהֲבָא נְחָשָׁא פַרְזְלָא אָעָא וְאַבְנָא
  choice: 银、金、铜、铁、木、石的神
  rationale: 依原文次序保留偶像材质的列举；“……的神”维持原文属格表达，不明加“所造”。
- source_word: דִּי לָא חָזַיִן וְלָא שָׁמְעִין וְלָא יָדְעִין
  choice: 它们看不见，听不到，也一无所知
  rationale: 以自然中文保留“看、听、知”三重否定，突出偶像毫无能力。
- source_word: אֱלָהָא דִּי נִשְׁמְתָךְ בִּידֵהּ
  choice: 你的气息在上帝手中
  rationale: 保留“气息”和“手”的具体意象，表达上帝对人生命的主权，而不把它抽象改写为“生命”或“命运”。
- source_word: וְכָל אֹרְחָתָךְ לֵהּ
  choice: 你所走的一切道路也都属于他
  rationale: 保留“道路”隐喻及לֵהּ所表达的归属关系，不缩窄为单指“命运”或仅指“行为”。
- source_word: לָא הַדַּרְתָּ
  choice: 没有尊崇他
  rationale: הדר在此可表达尊荣、荣耀；“尊崇”在现代中文中自然地传达给予应有尊荣之意。
theological_decisions:
- issue: מָרֵא作为上帝称号的译法
  choice: 天上的主
  alternative: 天上的主宰
  rationale: “主”自然表达上帝的权柄，又不把称号扩展为额外的神学说明；脚注保留“主宰”这一真实词义可能。
- issue: 真神与偶像的对照
  choice: 保留“气息在上帝手中”及“一切道路都属于他”的具体表达
  alternative: 解释为“上帝掌管你的生命和命运”
  rationale: 原文以手、气息、道路和归属构成张力，表明上帝对生命与人生进程的主权；直保意象可避免过度释义。
- issue: לָא הַדַּרְתָּ的神学语气
  choice: 没有尊崇他
  alternative: 没有把荣耀归给他
  rationale: 两者都可表达原文；正文采用较简洁的“尊崇”，脚注说明“归荣耀”的可能译法，不限定为某一教派术语。
translation_notes:
  register: 采用现代、庄重而清楚的标准普通话。句式保留但以连接词分开长句，使公开诵读自然；维持原文从狂傲、亵渎偶像到忽视真神的递进对比。
