  text: 'Tekel: you have been weighed in the balances and found lacking[a][b][c].'
translation:
  language: zh_hans
  text: “提客勒”[a]：你已经被放在天平上[b]称过，显出不足[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 亚兰语“提客勒”是但以理所解释的墙上文字；这个词与“称量”的意思相关。
    reason: lexical_alternative
  - marker: b
    text: “在天平上”也可译作“在秤上”。
    reason: lexical_alternative
  - marker: c
    text: “显出不足”也可译作“被发现不足”或“显得欠缺”。
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּקֵל
  choice: 提客勒
  rationale: 这是墙上所写、由但以理加以解释的亚兰语词，因此采用音译，以保留兆语本身与随后解释之间的区别；其词形又与“称量”相关。
- source_word: תְּקִילְתָּה
  choice: 你已经……被称量
  rationale: 这是对伯沙撒说的被动形式；“已经”表达称量已经完成，并且其判定在当前生效。
- source_word: בְמֹאזַנְיָא
  choice: 在天平上
  rationale: 指称量用的器具。“天平”在现代汉语中自然清楚，也保留原文的衡量意象；“在秤上”亦可。
- source_word: וְהִשְׁתְּכַחַתְּ
  choice: 显出
  rationale: 该词表达经过检验后被发现处于某种状态。译作“显出”符合汉语表达，同时保留称量所得结果的含义；较形式对应的译法是“被发现”。
- source_word: חַסִּיר
  choice: 亏欠
  rationale: 表达称量后显示不足、欠缺。此处“亏欠”既能保留分量不足的比喻，也带出受审判者有所欠缺的语义，而不将隐喻直接改写为“有罪”。
theological_decisions:
- issue: 审判比喻的性质
  choice: 以称量后显出亏欠的意象表达神圣的评断，不进一步扩写其教义含义。
  alternative: 直译为商业称重，或解释性改写为“上帝已经审判你，认定你有罪”。
  rationale: 原文以衡量和不足构成审判性的比喻。译文保留这一张力，既不把它缩减为字面的商业称重，也不将其消解为明确的教义性释义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“提客勒”以音译保留铭文词与解释之间的文字关系；“在天平上被称量，显出亏欠”保留原文的衡量与审判双重意象。所有脚注标记均置于正文相应位置。
