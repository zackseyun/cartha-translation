base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/026.yaml
  text: 'This is the interpretation of the message: MENE—God has numbered your kingdom and finished it[a][b].'
translation:
  language: zh_hans
  text: 这信息[a]的解释是：“米尼”[b]——上帝已经数算了你的王国，并使它终结[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“这话”、“这件事”或“这段铭文”。
    reason: lexical_alternative
  - marker: b
    text: 亚兰语“米尼”与后面意为“数算”的动词同源。
    reason: lexical_alternative
  - marker: c
    text: 或译“并使它完结”或“并使它完成”。
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּנָה
  choice: 这就是
  rationale: 亚兰文指示代词引出下文的解释；汉语补出判断词“就是”，表达自然。
- source_word: פְּשַׁר
  choice: 解释
  rationale: 在《但以理书》中常指对异象、梦或神秘文字的解释。
- source_word: מִלְּתָא
  choice: 信息
  rationale: 该词可指“话、事情、文字内容”；此处指墙上文字所传达的内容，“信息”简明而不把词义过度限定为字形或一般事务。
- source_word: מְנֵא
  choice: 米尼
  rationale: 这是墙上所写、随后被解释的词，因此正文采用音译，以保留其作为铭文用语的性质。
- source_word: מְנָה
  choice: 数算了
  rationale: 该动词解释“米尼”，并与之形成同根双关；“数算”既保留计数含义，也适合庄重语体。
- source_word: אֱלָהָא
  choice: 上帝
  rationale: 定指形式在此指实施审判的上帝；“上帝”是现代标准汉语中清楚、通行的称呼。
- source_word: מַלְכוּתָךְ
  choice: 你的国
  rationale: 该词可指王国、王权或统治；“你的国”自然简洁，并保留其范围可能兼及国度与王权的张力。
- source_word: וְהַשְׁלְמַהּ
  choice: 并使它终结
  rationale: 该使役动词表示使之完成、完结；在宣告审判的语境中，“使它终结”清楚表达王国走到尽头，同时以脚注保留“使它完成”的词义可能。
theological_decisions:
- issue: 上帝对伯沙撒之国所采取行动的性质
  choice: 上帝数算这个国，并使它终结
  alternative: 上帝数算这个国，并使它完成／完结
  rationale: 经文宣告上帝对王国的主权审判，但未明说“数算”的对象是年日，也未详细说明终结的方式；译文不增添“年日”等解释性内容。
- issue: “米尼”与“数算”的文字游戏
  choice: 正文保留音译“米尼”，随后译出“数算了”
  alternative: 把“米尼”直接译成“数过了”
  rationale: 音译保留墙上铭文的身份，后面的解释则显出同根词语的双关；脚注说明两者的联系。
translation_notes:
  register: 采用现代、庄重而易懂的标准汉语。“这就是……的解释”保留原文释义公式；“数算”略带庄重色彩，有助于呈现铭文与解释之间的双关。未增译传统译本中常见的“年日”，因为该词不在本节亚兰文中。
