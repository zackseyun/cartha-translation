base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/024.yaml
  text: Then from before him the palm of a hand was sent[b][a], and this writing was inscribed.
translation:
  language: zh_hans
  text: 于是，一只手的手掌从他面前[a]被差来；这文字也被写下了[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“从他的临在而来。”亚兰语直译为“从他面前”，表明这手掌是从前文所说那一位的临在中而来。
    reason: lexical_alternative
  - marker: b
    text: 或译：“这铭文被刻写下来。”
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: 于是
  rationale: 这是推进叙事次序的亚兰语话语标记；“于是”自然地承接前文，并表明接下来发生的事。
- source_word: מִן קֳדָמוֹהִי
  choice: 从他面前
  rationale: 依照字面保留“从……面前”的空间和临在意象，而不直接增补“神”作主语；所指可由上下文判断。
- source_word: שְׁלִיחַ
  choice: 被差来
  rationale: 保留该动词的被动形式及“差遣、送出”的含义；“被差来”也准确表达其朝叙事现场而来的方向。
- source_word: פַּסָּא דִי יְדָא
  choice: 一只手的掌部
  rationale: פַּסָּא可指手掌或手的末端部分。“掌部”既贴近词义，又避免把原文对具体部位的表达过度限定为整只手。
- source_word: וּכְתָבָא דְנָה
  choice: 这段文字
  rationale: 指向随后将要引述的书面信息；现代汉语用“这段文字”比“这个书写”自然，也保留指示词“这”。
- source_word: רְשִׁים
  choice: 被写下了
  rationale: 该词可表示写下或刻写。此处采用较宽泛、自然的“写下”，不额外断定文字是刻入墙面还是以其他方式留下。
theological_decisions:
- issue: “从他面前”中“他”的所指及差遣者
  choice: 保留代词和“面前”的临在意象，由上下文指向至高者
  alternative: 直译为“从他的临在中”，或明确译作“由神差来”
  rationale: 紧接的上下文表明源头是神，但亚兰文本本句没有重新明说“神”。保留“他”可避免超出原文增补，同时保存神圣临在是此手掌来源的意蕴。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“从他面前”有意保留原文略显具象的表达；“一只手的掌部”保留原文对手部局部的称呼；全句维持两个被动结构，以反映原文对差遣和书写之施事者的含蓄处理。
