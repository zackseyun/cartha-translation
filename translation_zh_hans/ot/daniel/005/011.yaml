revisions:
- from: 在你国中有一个人，圣神明的灵[a]在他里面。你父亲在位的日子，人们发现他里面有光明、悟性和智慧，如同神明的智慧。你父亲尼布甲尼撒王立他作术士、巫师、迦勒底人和占卜者的首领——王啊，就是你的父亲[b]。
  to: 你国中有一个人，他里面有圣洁诸神的灵[a]。在你父亲在位的日子，人们发现他有光明、悟性和智慧，如同众神的智慧。你的父亲尼布甲尼撒王立他作术士、巫师、迦勒底人和占卜者的首领——你的父亲，就是那位王[b]。
  rationale: 修订仅处理明确的汉语表达及句法错误：以“圣洁诸神”清楚、自然地表达复数神祇；以“众神的智慧”与之对应；删除误作呼语的“王啊”，改为同位语“就是那位王”。保留“你父亲”的两次重复、原文的复数叙事视角和脚注中的替代理解，未对历史亲属关系作额外判定。
