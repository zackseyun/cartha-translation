source:
  edition: WLC
  text: אִיתַ֨י גְּבַ֜ר בְּ/מַלְכוּתָ֗/ךְ דִּ֠י ר֣וּחַ אֱלָהִ֣ין קַדִּישִׁין֮ בֵּ/הּ֒ וּ/בְ/יוֹמֵ֣י אֲב֗/וּךְ נַהִיר֧וּ וְ/שָׂכְלְתָנ֛וּ וְ/חָכְמָ֥ה כְּ/חָכְמַת אֱלָהִ֖ין הִשְׁתְּכַ֣חַת בֵּ֑/הּ וּ/מַלְכָּ֤/א נְבֻֽכַדְנֶצַּר֙ אֲב֔/וּךְ רַ֧ב חַרְטֻמִּ֣ין אָֽשְׁפִ֗ין כַּשְׂדָּאִין֙ גָּזְרִ֔ין הֲקִימֵ֖/הּ אֲב֥/וּךְ מַלְכָּֽ/א־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/011.yaml
  text: There is a man in your kingdom in whom is a spirit of the holy gods[a], and in the days of your father light and insight and wisdom like the wisdom of the gods were found in him. And King Nebuchadnezzar, your father, appointed him chief of the magicians, enchanters, Chaldeans, and diviners—your father[b], the king.
translation:
  language: zh_hans
  text: 你国中有一个人，他里面有圣洁诸神的灵[a]。在你父亲在位的日子，人们发现他有光明、悟性和智慧，如同众神的智慧。你的父亲尼布甲尼撒王立他作术士、巫师、迦勒底人和占卜者的首领——你的父亲，就是那位王[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“圣洁之神的灵”或“圣洁之神的神灵”。亚兰文的“神”和“圣洁”均为复数；但有人认为王后的话是指独一的真神。
    reason: 保留原文复数形式，并说明将其理解为单数的另一种解释。
  - marker: b
    text: 这里的“父亲”在宫廷和王朝语境中也可指“祖先”或“前任君王”。
    reason: 说明古代亲属称谓可有较宽的王朝性用法。
lexical_decisions:
- source_word: אִיתַי גְּבַר בְּמַלְכוּתָךְ
  choice: 在你国中有一个人
  rationale: 按亚兰文存在句直译，同时采用自然的现代汉语语序；不增添“某个”等原文未必要求的限定。
- source_word: רוּחַ אֱלָהִין קַדִּישִׁין
  choice: 圣神明的灵
  rationale: אֱלָהִין 与 קַדִּישִׁין 在形式上均为复数；译作“圣神明”保留巴比伦宫廷人物的多神语境，不在正文中将其单数化。
- source_word: נַהִירוּ
  choice: 光明
  rationale: 保留“光”的隐喻，表达心智清明，而不直接改写为解释性的“聪明”。
- source_word: שָׂכְלְתָנוּ
  choice: 悟性
  rationale: 表达理解、洞察与辨识能力，并与“光明、智慧”构成自然而庄重的并列。
- source_word: כְּחָכְמַת אֱלָהִין
  choice: 如同神明的智慧
  rationale: 保留亚兰文复数及比较结构，反映说话者的宫廷语汇。
- source_word: רַב חַרְטֻמִּין אָשְׁפִין כַּשְׂדָּאִין גָּזְרִין
  choice: 术士、巫师、迦勒底人和占卜者的首领
  rationale: רַב 译为“首领”；各类宫廷智者分别译出。“迦勒底人”在此指宫廷智者阶层，仍保留原有称谓。
- source_word: אֲבוּךְ
  choice: 你父亲
  rationale: 正文保留原文的亲属称谓；其可指祖先或王朝前任的语用范围放入脚注说明。
theological_decisions:
- issue: 王后话语中 אֱלָהִין קַדִּישִׁין 与 אֱלָהִין 的单复数
  choice: 正文采用复数“圣神明／神明”
  alternative: “圣洁之神的灵／神的智慧”
  rationale: 亚兰文名词及相关形容词为复数，且说话场景属于巴比伦宫廷。正文保留叙事人物的表达和其中的神学张力；单数理解列入脚注。
- issue: 尼布甲尼撒被称为伯沙撒的“父亲”
  choice: 正文直译“你父亲”
  alternative: “你的祖先”或“你的前任”
  rationale: 原文两次使用 אֲבוּךְ。古代王朝语境下该词范围可宽于生父；为保持文本透明度，正文不替原文作历史关系判定。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。以短句减轻亚兰文长句在汉语中的负担；保留“光明”的原文隐喻、神明用语的复数形式及重复的“你父亲”，不以解释性改写消除文本张力。
