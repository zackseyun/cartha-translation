  to: 于是，但以理在王面前回答说：“你的礼物留给你自己吧；把你的赏赐给另一个人吧。不过，我要把这文字读给王听，并把它的解释告诉王。”
  rationale: 修订仅处理可安全确定的语法与表达问题：以“另一个人”保留原文单数，以“把……给……吧”保留命令式，并使“读给王听”更符合现代汉语，同时不改变经文含义或增添解释。
