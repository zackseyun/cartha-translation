base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/017.yaml
  text: Then Daniel answered and said before the king, “Let your gifts remain yours, and give your rewards to another. Nevertheless, I will read the writing for the king and make its interpretation known to him.”
translation:
  language: zh_hans
  text: 于是，但以理在王面前回答说：“你的礼物留给你自己吧；把你的赏赐给另一个人吧。不过，我要把这文字读给王听，并把它的解释告诉王。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: 那时
  rationale: 作为亚兰文叙事衔接语，引出紧接着发生的行动；“那时”自然且保留时间推进感。
- source_word: עָנֵה ... וְאָמַר
  choice: 回答说
  rationale: 以现代汉语常用的叙事表达对应“回答并说”这一闪语式组合，既体现回应动作，也不显累赘。
- source_word: קֳדָם מַלְכָּא
  choice: 在王面前
  rationale: 保留 קֳדָם 所表达的临在和宫廷场景，不弱化为单纯的“对王”。
- source_word: מַתְּנָתָךְ ... לָךְ לֶהֶוְיָן
  choice: 你的礼物留给你自己吧
  rationale: 自然表达礼物仍归王所有的拒绝之意，同时保留命令式语气。
- source_word: נְבָזְבְּיָתָךְ
  choice: 你的赏赐
  rationale: 上下文指王应许给解读者的奖赏；“赏赐”符合王室语境，又为现代读者所理解。
- source_word: לְאָחֳרָן הַב
  choice: 可以给别人
  rationale: 准确传达“给另一个人”的意思；汉语“别人”自然，不强行判定是某一特定人物还是泛指他人。
- source_word: בְּרַם
  choice: 不过
  rationale: 清楚表达转折：但以理拒绝赏赐，却仍愿意宣读并解释文字。
- source_word: כְּתָבָא
  choice: 这文字
  rationale: 指墙上的神秘文字；“这文字”简明，并与现场所指相符。
- source_word: אֶקְרֵא לְמַלְכָּא
  choice: 我要为王读出这文字
  rationale: “为王”体现 לְמַלְכָּא 的受益者或对象关系，“读出”则符合公开宣读墙上文字的场景。
- source_word: פִשְׁרָא
  choice: 它的解释
  rationale: פִשְׁרָא 是《但以理书》中解释异象、梦或隐秘信息的术语；“解释”保留其技术性，“它的”明确指向墙上的文字。
- source_word: אֲהוֹדְעִנֵּהּ
  choice: 告诉王
  rationale: 以自然汉语表达使役词形“使他知道”；重复“王”可避免代词指向含混。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而清楚的叙事语言。“在王面前”保留宫廷场景；“留给你自己吧”自然传达但以理拒绝报酬的态度；句中不增添拒绝赏赐的神学动机。
