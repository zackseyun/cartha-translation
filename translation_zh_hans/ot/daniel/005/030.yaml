  yaml_path: translation/ot/daniel/005/030.yaml
  text: In that very night Belshazzar[a], the Chaldean king, was killed.
translation:
  language: zh_hans
  text: 就在那一夜，迦勒底人的王伯沙撒被杀了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֵּהּ בְּלֵילְיָא
  choice: 就在那一夜
  rationale: 这组亚兰语时间短语直译近于“在那夜”，其中带后缀的 בֵּהּ 与后面的“夜”合用，具有指回并强调同一时刻的作用；“就在那一夜”既保留强调，也符合现代汉语表达。
- source_word: קְטִיל
  choice: 被杀了
  rationale: 该词在此表达被动或结果状态。“被杀了”清楚保留被动含义，并以句末“了”自然地叙述当夜发生的事件；不采用较文言的“被杀害”或“遭诛杀”。
- source_word: בֵּלְאשַׁצַּר
  choice: 伯沙撒
  rationale: 采用现代中文圣经传统中通行且易识别的人名音译。
- source_word: מַלְכָּא כַשְׂדָּיָא
  choice: 迦勒底人的王
  rationale: 按亚兰语保留“王”与“迦勒底人”的所属关系，比解释性较强的“巴比伦王”更贴近原文，也避免把族称改写为更宽泛的地理或政治名称。
