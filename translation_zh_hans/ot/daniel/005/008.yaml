base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/008.yaml
  text: Then all the king’s wise men came in[b][a], but they were not able to read the writing or make its interpretation known to the king.
translation:
  language: zh_hans
  text: 于是，王的一切智者都进来了；但他们不能读那文字，也不能把它的解释告诉王。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֱדַיִן
  choice: 于是
  rationale: 这是推进叙事次序的亚兰语话语标记；“于是”自然地承接前文并引出下一事件。
- source_word: עללין
  choice: 进来了
  rationale: 该复数动词表示进入；在宫廷场景中，“进来了”简明自然，也保留人物进入王面前的动作。
- source_word: כֹּל חַכִּימֵי מַלְכָּא
  choice: 王所有的智者
  rationale: 原文是领属结构，指隶属王廷的全体智者；这一译法既准确又符合现代汉语表达。
- source_word: וְלָא כָהֲלִין
  choice: 可是，他们不能
  rationale: 连词在此形成转折：众智者虽已进来，却无力完成任务。“可是”明确表达这一对照，“不能”自然传达能力上的欠缺。
- source_word: כְּתָבָא לְמִקְרֵא
  choice: 读出那文字
  rationale: כְּתָבָא可指写下来的文字或信息；“那文字”保留其宽泛含义，“读出”在此可涵盖辨读墙上文字，不预先断定困难仅在发音还是理解。
- source_word: וּפִשְׁרָא
  choice: 它的解释
  rationale: פְּשַׁר是《但以理书》中反复用于神秘文字、异象或梦之解说的术语；“解释”保留这一术语联系，并以“它的”指回所写的文字。
- source_word: לְהוֹדָעָה לְמַלְכָּא
  choice: 把它的解释告诉王
  rationale: 使役式不定词表示使人知道、告知；“告诉王”是现代汉语中自然、清楚的表达，同时保留向王报告的宫廷语境。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“智者”延续宫廷专业群体的称谓；保留“读出”与“解释”两个并列任务，不把两者合并，从而维持原文对辨读文字和说明其含义的区分。
