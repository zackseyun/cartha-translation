base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/004.yaml
  text: They drank the wine and praised the gods of gold and silver[a], bronze, iron, wood, and stone.
translation:
  language: zh_hans
  text: 他们喝了酒，赞美金、银、青铜[a]、铁、木、石所造的诸神。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “青铜”也可译作“铜”。这个阿拉姆语词可指铜或铜合金；在此类偶像材料清单中，通常理解为青铜。
    reason: lexical_alternative
lexical_decisions:
- source_word: אִשְׁתִּיו
  choice: 他们喝了
  rationale: 该词是פעל完成式第三人称复数，用于顺叙已发生的动作；现代汉语用“喝了”自然地承接叙事。
- source_word: חַמְרָא
  choice: 酒
  rationale: 名词为强调态，指宴席中正在饮用的特定酒；汉语在此不必另加定冠词。
- source_word: וְשַׁבַּחוּ
  choice: 赞美
  rationale: 该动词表示称颂、赞扬；“赞美”既自然，也保留敬拜语境中的色彩。
- source_word: לֵאלָהֵי
  choice: 神明
  rationale: 复数形式及随后列举的造像材料表明所指为异教诸神；“神明”在现代汉语中可自然表达多位受崇拜的神祇，并避免误指以色列的神。
- source_word: דַּהֲבָא וְכַסְפָּא נְחָשָׁא פַרְזְלָא אָעָא וְאַבְנָא
  choice: 金、银、铜、铁、木、石所造的
  rationale: 原文以材料名词修饰“神”；补出“所造的”符合汉语表达，也明确这些材料描述的是神像，而非材料本身为神，同时不改变原文的偶像崇拜语境。
- source_word: נְחָשָׁא
  choice: 铜
  rationale: 该阿拉姆语词可指铜或铜合金（青铜）。中文“铜”可作较宽泛的材料名称，正文简洁，另以脚注保留“青铜”的可能。
theological_decisions:
- issue: אֱלָהֵי应译为“神明”还是单数的“神”
  choice: 神明
  alternative: 神
  rationale: 该词为复数，且后文列出金、银、铜、铁、木、石等偶像材料，清楚指异教诸神或其神像，不是以色列的神。
- issue: 材料列表与“神明”的关系是否应显明为神像的制作材料
  choice: 译作“金、银、铜、铁、木、石所造的神明”
  alternative: 译作“金、银、铜、铁、木、石的神”
  rationale: 原文的属格结构本身简练，既可按字面说“某材料的神”，语境上则指这些材料制成的神像。补出“所造的”使现代汉语清楚自然，但不把“神明”直接改译成“偶像”，从而保留原文以“诸神”称呼它们的讽刺和神学张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。句式简洁，保留原文连续叙事和材料清单的节奏；用“神明”表达复数异教神祇，并以“所造的”使材料与神像的关系符合自然汉语。
