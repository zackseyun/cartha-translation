  text: וּ/כְ/דִי֙ רִ֣ם לִבְבֵ֔/הּ וְ/רוּחֵ֖/הּ תִּֽקְפַ֣ת לַ/הֲזָדָ֑ה הָנְחַת֙ מִן כָּרְסֵ֣א מַלְכוּתֵ֔/הּ וִֽ/יקָרָ֖/ה הֶעְדִּ֥יוּ מִנֵּֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/020.yaml
  text: But when his heart was lifted up and his spirit was hardened in arrogance[a], he was brought down from his royal throne[b], and his glory was taken away from him.
translation:
  language: zh_hans
  text: 但当他的心高傲起来，他的灵因狂妄而刚硬[a]，他就从王位上被废黜，他的尊荣也被夺去[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他的灵变得狂妄”，或“他的灵刚强，以致妄自尊大”。
    reason: lexical_alternative
  - marker: b
    text: “尊荣”也可译作“荣耀”或“威严”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְדִי
  choice: 但当
  rationale: 该亚兰语连接语引出时间情境；结合上文的转折关系，“但当”同时保留时间与对比意味。
- source_word: רִם לִבְבֵהּ
  choice: 他的心高傲起来
  rationale: 原文直译为“他的心升高”。汉语以“心高傲起来”自然表达这一隐喻的道德含义，同时保留动态感。
- source_word: וְרוּחֵהּ תִּקְפַת לַהֲזָדָה
  choice: 他的灵也因狂妄而刚硬
  rationale: תִּקְפַת含变强、变硬之意，לַהֲזָדָה指狂妄、僭越自恃；此译保留内在刚硬与狂妄之间的关联，而不把两者简化为单一概念。
- source_word: הָנְחַת
  choice: 被……拉下来
  rationale: 语境中的使役或被动意义指他从高位被降下；“拉下来”呼应前文心的升高，并突出受辱降卑。
- source_word: מִן כָּרְסֵא מַלְכוּתֵהּ
  choice: 从王位上
  rationale: כָּרְסֵא为宝座，מַלְכוּתֵהּ涉及王权或王位；“王位”在现代汉语中简洁自然，并准确表达其统治地位。
- source_word: וִיקָרֵהּ
  choice: 尊荣
  rationale: יְקָר可指尊荣、荣耀或威严；在君王失位的语境中，“尊荣”兼顾其身份、名望和王者威仪。
- source_word: הֶעְדִּיוּ מִנֵּהּ
  choice: 被夺去
  rationale: 原文复数动词可作不定施事者表达；汉语被动式不必擅自补出施事者，并保留“从他那里除去”的含义。
theological_decisions:
- issue: 尼布甲尼撒降卑的施事者
  choice: 用被动表达他被拉下王位、尊荣被夺去，本句不明说施事者。
  alternative: 根据上下文直接译成“神把他从王位上拉下来”。
  rationale: 本句采用被动或不定施事结构，虽上下文表明神是终极施事者，译文仍应保留本句的含蓄，不将上下文推论直接写入正文。
- issue: “灵刚硬”与“狂妄”的关系
  choice: 译作“因狂妄而刚硬”，并以脚注保留其他可能理解。
  alternative: 译作“他的灵变得狂妄”或“他的灵刚强，以致妄自尊大”。
  rationale: 原文既包含变强或变硬的语义，也包含狂妄自恃的语义；正文采用自然汉语表达其关联，脚注保留语法和词义上的张力。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“心高傲起来”自然传达原文“心升高”的习语；“灵……刚硬”保留原文的内在状态描写。“王位”较“王国的宝座”更符合现代汉语，但不削弱王权含义。所有脚注标记均已在正文出现。
