base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/010.yaml
  text: Because of the words of the king and his nobles[a], the queen entered the banquet hall. The queen spoke and said, “O king, live forever! Do not let your thoughts terrify you[b], and do not let your face grow pale.”
translation:
  language: zh_hans
  text: 王后因王和权贵们所说的话，进了宴会厅。王后开口说[a]：“愿王万岁！不要让你的思绪使你惊慌，也不要让你的脸色改变[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“回答说。”亚兰语这一惯用表达既可引出回应，也可仅仅表示开始说话。
    reason: lexical_alternative
  - marker: b
    text: 直译：“你的光彩不要改变。”这是描述面容外观的说法；本章相近的表达用来描写人因恐惧而脸色发生变化。
    reason: lexical_alternative
lexical_decisions:
- source_word: לָקֳבֵל מִלֵּי מַלְכָּא וְרַבְרְבָנוֹהִי
  choice: 因王和权贵们所说的话
  rationale: לָקֳבֵל在此表示原因或缘由；מִלֵּי直指所说的话，רַבְרְבָנוֹהִי指宫廷中的高官显贵。这样的译法既贴近原文，也符合叙事语境。
- source_word: לְבֵית מִשְׁתְּיָא
  choice: 宴会厅
  rationale: 字面是“宴饮之家”，在本节宫廷宴席的场景中，用现代汉语“宴会厅”最自然清楚。
- source_word: עֲנָת ... וַאֲמֶרֶת
  choice: 开口说
  rationale: 这是闪语常见的双动词表达，可表示“回答说”，也可单纯引出发言。此处没有人直接向王后提问，因此正文译为自然的“开口说”，并以脚注保留另一种理解。
- source_word: לְעָלְמִין חֱיִי
  choice: 愿王万岁
  rationale: 这是宫廷中向君王致意的固定用语；“愿王万岁”庄重、简洁，也保留祝愿语气。
- source_word: רַעְיוֹנָךְ
  choice: 你的思绪
  rationale: 该词表示思想、念头或心中的思虑。译作“思绪”保留其心理活动的含义，而不预先将它解释成“焦虑”。
- source_word: יְבַהֲלוּךְ
  choice: 使你惊慌
  rationale: 该动词表达惊扰、使人恐慌之意；“使你惊慌”既体现强度，也保持现代汉语的自然表达。
- source_word: זִיוָיךְ ... יִשְׁתַּנּוֹ
  choice: 你的脸色改变
  rationale: זִיוָיךְ字面涉及光彩、容貌或面容，结合上下文指脸上的神色；יִשְׁתַּנּוֹ本义是“改变”。正文译作“脸色改变”保留原文，没有进一步限定为“变白”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的宫廷叙事语体。“权贵”“宴会厅”“愿王万岁”体现正式场景，但避免文言化。脚注标记按其实际所解释的短语安放： [a]置于“开口说”之后，[b]置于“脸色改变”之后。
