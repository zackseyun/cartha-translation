  text: “毗勒斯”：你的国已经被分割，并交给了玛代人和波斯人。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 亚兰文题词“毗勒斯”与表示“分割”的词同根，并与“波斯（人）”一词形成语音呼应；这一双关在中文译文中无法完全呈现。
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּרֵס
  choice: 毗勒斯
  rationale: 采用音译，因为本节是在解释墙上所写的词；音译可保留题词本身，并由脚注说明它与“分割”及“波斯”之间的双关。
- source_word: פְּרִיסַת
  choice: 已被分割
  rationale: 该动词与פְּרֵס同根，表示分开、分割；用“已被分割”体现完成式所宣告的决定性审判。
- source_word: מַלְכוּתָךְ
  choice: 你的国
  rationale: 这里指伯沙撒统治的国度；“你的国”简洁自然，也符合现代汉语经文语体。
- source_word: וִיהִיבַת
  choice: 交给
  rationale: 表达国度被转交给新统治者的被动结果；汉语中与前面的“已被分割”共享被动结构，行文自然。
- source_word: לְמָדַי
  choice: 玛代人
  rationale: 按族群名称翻译，并与后面的“波斯人”构成并列。
- source_word: וּפָרָס
  choice: 波斯人
  rationale: 表达其历史所指的族群；原文与פְּרֵס、פְּרִיסַת的语音呼应则在脚注中保留。
