  text: ו/אנתה בְּרֵ/הּ֙ בֵּלְשַׁאצַּ֔ר לָ֥א הַשְׁפֵּ֖לְתְּ לִבְבָ֑/ךְ כָּ/ל קֳבֵ֕ל דִּ֥י כָל דְּנָ֖ה יְדַֽעְתָּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/022.yaml
  text: But you[a], his son, Belshazzar, have not humbled your heart, though you knew all this.
translation:
  language: zh_hans
  text: 但你，他的儿子[a]伯沙撒，尽管知道这一切，却没有使自己的心谦卑下来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 亚兰文“儿子”也可指“后裔”或“继承者”。
    reason: 说明原词可能涵盖较广的宗族或王朝承继关系，避免将正文限定为亲生父子关系。
lexical_decisions:
- source_word: וְאַתָּה
  choice: 但你
  rationale: 连词与独立代词在此承接前文，并突出伯沙撒与尼布甲尼撒经历之间的对比；“但你”自然表达这一转折。
- source_word: בְּרֵהּ
  choice: 他的儿子
  rationale: 保留亚兰文的直称，不在正文中预先判定这是亲生、后裔还是王位承继关系；较宽泛的可能含义见脚注。
- source_word: בֵּלְשַׁאצַּר
  choice: 伯沙撒
  rationale: 采用现代中文圣经中通行且易辨识的人名译法。
- source_word: הַשְׁפֵּלְתְּ לִבְבָךְ
  choice: 使自己的心谦卑
  rationale: 使役动词意为“使卑下、使谦卑”；保留“心”这一圣经人论用语，指人的意志、思想和内在自我。
- source_word: כָּל־קֳבֵל דִּי
  choice: 尽管……却
  rationale: 上下文要求让步关系：伯沙撒虽已知道先前发生的事，仍未自卑。
- source_word: כָל־דְּנָה
  choice: 这一切
  rationale: 简洁自然地回指前文关于尼布甲尼撒的全部经历。
- source_word: יְדַעְתָּ
  choice: 知道
  rationale: 表达伯沙撒早已知悉前述事件；其时间关系由“尽管……却”及上下文清楚呈现。
theological_decisions:
- issue: 伯沙撒被称为尼布甲尼撒的“儿子”所表达的关系
  choice: 正文保留“他的儿子”
  alternative: 他的后裔；他的继承者
  rationale: 亚兰文“儿子”可以表示亲生儿子，也可用于较广的宗族或王朝承继关系。正文不以历史协调方案消除原文的开放性，脚注说明其他可能含义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“尽管……却”清楚呈现让步关系；“使自己的心谦卑”保留原文的使役结构和“心”的圣经意象。脚注标记紧随存在词义歧义的“伯沙撒”称谓短语之后。
