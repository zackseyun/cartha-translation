  yaml_path: translation/ot/daniel/005/006.yaml
  text: Then the king’s color changed[a], and his thoughts terrified him; the joints of his hips gave way[b], and his knees knocked against each other.
translation:
  language: zh_hans
  text: 那时，王的脸色变了[a]，心中的念头使他惊恐；他腰部的关节都松开了[b]，双膝彼此相撞。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他的光彩改变了。”这是亚兰文的惯用表达，指他因恐惧而面色或外貌改变。
    reason: lexical_alternative
  - marker: b
    text: 或译：“他腰部的关节松开了。”这个表达描述人在极度惊恐中身体发软、近乎瘫倒。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱדַיִן
  choice: 那时
  rationale: 亚兰文常用的叙事承接词，表示随后发生的事；“那时”自然庄重，也不额外强调“立刻”。
- source_word: מַלְכָּא
  choice: 王
  rationale: 原词为强调状态，在上下文中指已知的王；现代汉语叙事用“王”即可明确表达。
- source_word: זִיוֹהִי שְׁנוֹהִי
  choice: 王的脸色变了
  rationale: 字面近于“他的光彩改变了”，在此是因恐惧而外貌或面色改变的惯用表达；“脸色变了”在现代汉语中清楚自然。
- source_word: רַעְיוֹנֹהִי
  choice: 心中的念头
  rationale: 该名词指思想、意念或脑中的印象；“心中的念头”保留复数意涵，并符合汉语表达。
- source_word: יְבַהֲלוּנֵּהּ
  choice: 使他惊恐
  rationale: 动词表达突然而强烈的惊惶；结合随后的身体反应，“惊恐”比“烦扰”更符合语境强度。
- source_word: קִטְרֵי חַרְצֵהּ
  choice: 他的腰胯
  rationale: 这是较难确定的身体部位短语，字面涉及腰胯部的连接、关节或束结；正文用“腰胯”避免把解剖含义说得过细，脚注保留较直译的可能。
- source_word: מִשְׁתָּרַיִן
  choice: 松脱了
  rationale: 该形式表示松开、解开或失去支撑；“松脱”既保留原词意象，也传达因恐惧而身体发软的状态。
- source_word: אַרְכֻבָּתֵהּ
  choice: 双膝
  rationale: 原词指膝盖；“双膝”自然承接后面的彼此相撞。
- source_word: דָּא לְדָא
  choice: 彼此
  rationale: 亚兰文的相互表达，直义为“这个对着那个”；“彼此”是简洁准确的现代汉语。
- source_word: נָקְשָׁן
  choice: 相撞
  rationale: 动词意为敲击、碰撞；用于双膝时，“相撞”清楚呈现恐惧引起的颤抖。
