base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/001.yaml
  text: King Belshazzar made a great feast for a thousand of his nobles[a], and in the presence of the thousand he was drinking wine.
translation:
  language: zh_hans
  text: 伯沙撒王为他的一千名权贵大摆筵席，并在这一千人面前饮酒[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文也可较直译为“在这一千人前面饮酒”；此处可能是指他当着这一千名宾客的面饮酒。
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְכָּא
  choice: 王
  rationale: 定指形式的名词与专名构成同位语；按现代汉语习惯译作“伯沙撒王”。
- source_word: עֲבַד
  choice: 摆
  rationale: 该动词本义为“做、制作”；与筵席搭配时，“摆筵席”既自然，也比“举行”更贴近原文措辞。
- source_word: לְחֶם רַב
  choice: 大摆筵席
  rationale: לְחֶם 本指食物或饭食，在此宴饮语境中指筵席；רַב 表示盛大，结合汉语动词译为“大摆筵席”。
- source_word: לְרַבְרְבָנֹוהִי
  choice: 他的一千名权贵
  rationale: 该词指位高权重者或朝廷显贵；“权贵”是现代、简洁且符合宫廷语境的表达，也避免“贵族”可能带来的世袭含义。
- source_word: אֲלַף
  choice: 一千名
  rationale: 按基数词直译，并添加适合指人的量词“名”。
- source_word: וְלָקֳבֵל
  choice: 并在……面前
  rationale: 该介词短语可表示“在……前面、当着……的面”；正文保留其空间兼公开性的基本表达，不进一步解释动机。
- source_word: חַמְרָא
  choice: 酒
  rationale: 该词通常指葡萄酒；现代汉语叙事中“饮酒”自然庄重，且无需在正文中过度具体化。
- source_word: שָׁתֵה
  choice: 饮酒
  rationale: 原文为分词，表达持续或进行中的动作；汉语“饮酒”在此可自然呈现当时正在进行的行为，而不必机械添加“正在”。
