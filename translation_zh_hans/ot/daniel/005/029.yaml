base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/029.yaml
  text: Then Belshazzar gave the command[a], and they clothed Daniel with purple, put a chain of gold around his neck[b], and proclaimed concerning him that he should be the third ruler in the kingdom.
translation:
  language: zh_hans
  text: 于是，伯沙撒下令，他们就给但以理穿上紫色衣服，给他戴上金链，挂在他颈项上；又宣告他要作国中第三位掌权者。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在国中位居第三。”原文表示权位等级为第三，并未进一步说明具体官衔或制度安排。
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: 于是
  rationale: 作为亚兰文叙事推进标记，承接前文并引出随即发生的事；“于是”自然、庄重。
- source_word: אֲמַר בֵּלְשַׁאצַּר
  choice: 伯沙撒下令
  rationale: אֲמַר 字面为“说”，但后接复数执行者，语境表明这是君王发布命令；译为“下令”传达其施行效力。
- source_word: וְהַלְבִּישׁוּ לְדָנִיֵּאל אַרְגְּוָנָא
  choice: 他们就给但以理穿上紫袍
  rationale: 使役复数动词表示给人穿戴；אַרְגְּוָנָא 可指紫色衣料或紫色服饰，在王室授荣语境中，“紫袍”简洁自然，同时以脚注保留词义范围。
- source_word: ו/המונכא דִי דַהֲבָא
  choice: 金链
  rationale: 指作为尊荣标志佩戴的金质链饰；“金链”符合现代汉语表达。
- source_word: עַל צַוְּארֵהּ
  choice: 戴在他颈项上
  rationale: 介词字面为“在……上”，结合链饰，汉语用“戴在……颈项上”自然；“颈项”保持经文的庄重语体。
- source_word: וְהַכְרִזוּ עֲלֹוהִי
  choice: 并宣告他
  rationale: 动词指公开传告，介词短语表明宣告关乎但以理；汉语直接说“宣告他要……”清晰流畅。
- source_word: דִּי לֶהֱוֵא
  choice: 要
  rationale: 引出宣告内容，并含任命或预定状态的语气；“要”在现代汉语中简明地表达这一含义。
- source_word: שַׁלִּיט תַּלְתָּא בְּמַלְכוּתָא
  choice: 在国中位居第三
  rationale: שַׁלִּיט 表示掌权者，תַּלְתָּא 指第三等级；“位居第三”自然表达权位次序，而不额外断定具体行政头衔。
theological_decisions:
- issue: “第三”所指的权位性质
  choice: 在国中位居第三
  alternative: 作国中的第三位统治者
  rationale: 原文清楚表示第三等级，却未详述制度或前两位是谁；“位居第三”保留其等级含义，避免引入超出本节的历史或制度解释。
translation_notes:
  register: 采用现代、清晰而庄重的叙事语言。“紫袍”传达王室授荣的语境，并以脚注保留原词也可泛指紫色衣料或服饰的可能性；“位居第三”避免把原文固定为某一特定官制。
