id: DAN.5.16
reference: Daniel 5:16
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/אֲנָה֙ שִׁמְעֵ֣ת עלי/ך דִּֽי תוכל פִּשְׁרִ֛ין לְ/מִפְשַׁ֖ר וְ/קִטְרִ֣ין לְ/מִשְׁרֵ֑א כְּעַ֡ן הֵן֩ תוכל כְּתָבָ֜/א לְ/מִקְרֵ֗א וּ/פִשְׁרֵ/הּ֙ לְ/הוֹדָ֣עֻתַ֔/נִי אַרְגְּוָנָ֣/א תִלְבַּ֗שׁ ו/המונכ/א דִֽי דַהֲבָ/א֙ עַֽל צַוְּארָ֔/ךְ וְ/תַלְתָּ֥א בְ/מַלְכוּתָ֖/א תִּשְׁלַֽט־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/016.yaml
  text: But I have heard about you that you are able to give interpretations and to solve difficulties[a]. Now, if you are able to read the writing and make its interpretation known to me, you shall be clothed with purple, and a chain of gold shall be put around your neck[b], and you shall rule as third in the kingdom.
translation:
  language: zh_hans
  text: 但我听说，你能作出解释，解开难题[a]。现在，你若能读这文字，把它的解释告诉我，就必身穿紫袍，颈戴金链，并在国中掌权，位列第三[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 阿拉姆语直译为“解开结”，是解决疑难或消除困惑的习语。
    reason: lexical_alternative
  - marker: b
    text: 或译：“作国中的第三位统治者。”原文很可能指在国中位居第三等级。
    reason: alternative_reading
lexical_decisions:
- source_word: וַאֲנָה שִׁמְעֵת עֲלָיִךְ
  choice: 但我听说
  rationale: 独立代词配合连接词形成转折并突出说话者；现代汉语用“但我听说”自然承接伯沙撒前面所述之事。“听说”已能表达所得消息与当前相关。
- source_word: פִּשְׁרִין לְמִפְשַׁר
  choice: 解释奥秘
  rationale: 原文是名词与同根动词的组合，指作出解释。结合本章神秘文字的语境，“解释奥秘”比生硬重复“解释解释”更自然，同时保留宫廷叙事中的庄重感。
- source_word: וְקִטְרִין לְמִשְׁרֵא
  choice: 解开难题
  rationale: 字面为“解开绳结”，是解决疑难、排除困惑的比喻。译作“解开难题”既保留“解开”的意象，也清楚传达习语意义。
- source_word: כְּעַן הֵן תוכל
  choice: 现在，你若能
  rationale: כְּעַן 标示从传闻转入眼前请求，הֵן 引出条件；“现在，你若能”准确而自然。
- source_word: כְּתָבָא לְמִקְרֵא
  choice: 读出这文字
  rationale: כְּתָבָא 指眼前墙上的文字；“这文字”符合指示语境，“读出”可涵盖辨读并宣读其内容。
- source_word: וּפִשְׁרֵהּ לְהוֹדָעוּתַנִי
  choice: 把它的解释告诉我
  rationale: 保留“它的解释”这一名词结构，并以“告诉我”自然表达使说话者知晓的使役含义。
- source_word: אַרְגְּוָנָא תִלְבַּשׁ
  choice: 身穿紫袍
  rationale: אַרְגְּוָנָא 可指紫色或紫色衣袍；在授予宫廷尊荣的语境中，“紫袍”清楚表达象征身份的贵重服饰。
- source_word: וְהַמּוֹנְכָא דִי דַהֲבָא עַל צַוְּארָךְ
  choice: 颈戴金链
  rationale: 凝练表达金链置于颈上的奖赏，符合现代汉语的庄重叙事语体。
- source_word: וְתַלְתָּא בְמַלְכוּתָא תִּשְׁלַט
  choice: 在国中掌权，位列第三
  rationale: 原文可理解为以第三等级掌权，或成为第三位统治者。正文用“掌权，位列第三”保留统治职权与等级含义，并以脚注说明另一种表达。
theological_decisions:
- issue: “第三”所指的是统治序位还是第三位统治者
  choice: 在国中掌权，位列第三
  alternative: 作国中的第三位统治者
  rationale: 阿拉姆语 תַלְתָּא 可表达第三等级或第三位的身份，原文本身未明说其制度背景。正文不把历史重构写入经文，以“位列第三”保留等级焦点，脚注列出另一可行理解。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“解释奥秘，解开难题”形成自然对句；奖赏部分用“身穿紫袍，颈戴金链”保持宫廷宣告的凝练节奏。所有脚注标记均已置于正文相应位置。
