source:
  edition: WLC
  text: בֵּלְשַׁאצַּ֞ר אֲמַ֣ר בִּ/טְעֵ֣ם חַמְרָ֗/א לְ/הַיְתָיָה֙ לְ/מָאנֵי֙ דַּהֲבָ֣/א וְ/כַסְפָּ֔/א דִּ֤י הַנְפֵּק֙ נְבוּכַדְנֶצַּ֣ר אֲב֔/וּהִי מִן הֵיכְלָ֖/א דִּ֣י בִ/ירוּשְׁלֶ֑ם וְ/יִשְׁתּ֣וֹן בְּ/ה֗וֹן מַלְכָּ/א֙ וְ/רַבְרְבָנ֔וֹ/הִי שֵׁגְלָתֵ֖/הּ וּ/לְחֵנָתֵֽ/הּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/002.yaml
  text: Belshazzar gave the order[a], as he tasted the wine, to bring the vessels of gold and silver that Nebuchadnezzar his father had taken out of the temple that was in Jerusalem, so that the king and his nobles, his wives and his concubines[b], might drink from them.
translation:
  language: zh_hans
  text: 伯沙撒当尝酒时[a]，吩咐人把金银器皿拿来；这些器皿是他父亲[b]尼布甲尼撒从耶路撒冷的圣殿中取出来的，好让王和他的权贵、妻子、妃嫔从中饮酒。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“受酒影响的时候”；亚兰文习语直译为“在酒的滋味中”。
    reason: lexical_alternative
  - marker: b
    text: 亚兰文直译“他父亲”；在王室用语中，也可以指“他的祖先”或“他的前任”。
    reason: alternative_reading
lexical_decisions:
- source_word: אֲמַר
  choice: 吩咐人
  rationale: 该动词本义为“说”，但这里后接“拿来”的指令，语境具有命令作用；“吩咐人”在现代汉语中自然表达这一施为含义，又不如“命令”那样过度强化语气。
- source_word: בִּטְעֵם חַמְרָא
  choice: 尝着酒的时候
  rationale: 原文直译近于“在酒的滋味中”。此译保留品尝、饮用的具体意象，不在正文中直接断定伯沙撒已经醉酒；其可能含有“受酒影响”的意味留在脚注说明。
- source_word: לְהַיְתָיָה
  choice: 把……拿来
  rationale: 使役形式表示叫人将器皿带到宴席上；“拿来”符合汉语指令语境。
- source_word: מָאנֵי דַּהֲבָא וְכַסְפָּא
  choice: 金银器皿
  rationale: מָאנֵי泛指器皿或用具。“器皿”保留其圣殿器物的广义，不预先缩窄为酒杯。
- source_word: הַנְפֵּק
  choice: 取出来
  rationale: 该词表示“带出、取出”。这里指尼布甲尼撒把器皿从耶路撒冷的殿中取出。
- source_word: אֲבוּהִי
  choice: 他父亲
  rationale: 正文保留亚兰文普通亲属称谓的字面表达；君王叙事中可能表示祖先或前任的语用范围另见脚注。
- source_word: הֵיכְלָא
  choice: 殿
  rationale: 所指为耶路撒冷的圣殿；上下文已有地点限定，简洁的“殿”自然、庄重，并保留宗教建筑含义。
- source_word: וְיִשְׁתּוֹן בְּהוֹן
  choice: 要……用这些器皿喝酒
  rationale: 未完成式在命令之后表达目的或预期结果。“要……喝酒”清楚传达王叫人取来器皿的目的。
- source_word: רַבְרְבָנוֹהִי
  choice: 他的权贵
  rationale: 该词指朝廷中的显贵或高级官员。“权贵”适合宫廷场景，也比“伟人”更准确。
- source_word: שֵׁגְלָתֵהּ
  choice: 妻子
  rationale: 该词指王室中的妻子或地位较高的女性伴侣；“妻子”保留宽泛而确定的婚姻关系，不把她们一概称为王后。
- source_word: לְחֵנָתֵהּ
  choice: 妃嫔
  rationale: 该词指地位低于妻子的王室女性。“妃嫔”在古代宫廷语境中自然，并与前面的“妻子”保持原文的身份区分。
theological_decisions:
- issue: 尼布甲尼撒与伯沙撒的王室亲属称谓
  choice: 正文译作“他父亲”
  alternative: “他的祖先”或“他的前任”
  rationale: 亚兰文使用通常表示“父亲”的称谓，但在王室用语中可有较宽含义。正文不以历史重构取代原文措辞，而用脚注保留其可能的语用范围。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“尝着酒的时候”有意保留原文习语的具体意象和歧义；将较长的原文句子分为两句，以避免现代汉语结构拖沓，同时保持取器皿与饮酒目的之间的逻辑联系。
