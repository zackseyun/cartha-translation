  text: And he said to me[a], “Until 2,300 evenings and mornings[b]; then the sanctuary will be restored.”
translation:
  language: zh_hans
  text: 他对我说：“要到二千三百个晚上和早晨；那时，圣所[b]必恢复应有的状态。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 或译：“圣所必得洁净”“圣所必获昭雪”或“圣所必被证实为正当”。希伯来语动词的字面意思是“被纠正，恢复应有的状态”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלַי
  choice: 他对我说
  rationale: 按希伯来语叙事顺序直译，并自然表达说话对象。
- source_word: עַד
  choice: 要到
  rationale: 表达时间延续至某一终点，准确保留“直到”的含义，也符合对“要到几时”的回答。
- source_word: עֶרֶב בֹּקֶר
  choice: 晚上和早晨
  rationale: 保留原文独特的单数并列结构，不在正文中断定它指整日还是早晚献祭的次数。
- source_word: אַלְפַּיִם וּשְׁלֹשׁ מֵאוֹת
  choice: 二千三百个
  rationale: 准确表达基数，并用量词使现代汉语自然通顺。
- source_word: וְנִצְדַּק
  choice: 必恢复正常
  rationale: 该词是צדק的尼法勒形，核心意义是被纠正、恢复应有状态；此译法避免将其窄化为礼仪性的“洁净”。
- source_word: קֹדֶשׁ
  choice: 圣所
  rationale: 结合但以理书第八章圣殿受亵渎的语境，此词最自然地指圣所，而非抽象的圣洁。
theological_decisions:
- issue: וְנִצְדַּק קֹדֶשׁ 如何描述圣所的结局
  choice: 圣所必恢复正常
  alternative: 圣所必得洁净／必获昭雪／必被判为正当
  rationale: 原文使用צדק而非通常表示“洁净”的טהר；正文采用涵盖面较广的“恢复正常”，脚注保留其他可能译法，避免预设特定教义或历史解释。
- issue: עֶרֶב בֹּקֶר 的计数所指
  choice: 保留“二千三百个晚上和早晨”
  alternative: 二千三百日／二千三百次早晚献祭（约一千一百五十日）
  rationale: 原文措辞容许不同的时间理解，正文不替读者解决其真实歧义。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“要到”自然承接上文“要到几时”的提问；“恢复正常”通俗而不失准确，并保留原文关于圣所被纠正、恢复应有状态的宽泛语义。
