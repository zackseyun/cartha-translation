source:
  edition: WLC
  text: וְ/עַ֥ד שַֽׂר הַ/צָּבָ֖א הִגְדִּ֑יל וּ/מִמֶּ֨/נּוּ֙ הרים הַ/תָּמִ֔יד וְ/הֻשְׁלַ֖ךְ מְכ֥וֹן מִקְדָּשֽׁ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/011.yaml
  text: It even magnified itself up to the Prince of the host[a], and from him the regular offering was taken away[c][b], and the place of his sanctuary was cast down.
translation:
  language: zh_hans
  text: 它甚至自高，直至军旅之君[a]；常献的祭从他那里[b]被除掉，他圣所的所在[d]也被推倒。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “军旅之君”也可译作“军队的统帅”或“天军之君”；原文没有明确指出他的身份。
    reason: lexical_and_referential_ambiguity
  - marker: b
    text: “从他那里”直译希伯来文的阳性单数代词；这个代词具体指谁，存在争议。
    reason: alternative_reading
  - marker: d
    text: “所在”也可译作“基址”或“根基”；原词既可表示固定的地点，也可表示根基。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַד
  choice: 甚至……竟高及
  rationale: עַד表示达到的界限，前接וְ在此承接并加强前文。“竟高及”既表达“直到、达到”的程度，也凸显这角自高的惊人程度。
- source_word: שַׂר הַצָּבָא
  choice: 军旅之君
  rationale: שַׂר可指君长、统帅；צָבָא可指军队或天上的军旅。“军旅之君”保留称号的庄重感，也不预先限定其身份。
- source_word: הִגְדִּיל
  choice: 自高
  rationale: 本章中גדל的使役形描述这角妄自尊大的行为。“自高”自然地表达语境中的反身意味。
- source_word: וּמִמֶּנּוּ
  choice: 从他那里
  rationale: 后缀为阳性单数；直译为“从他那里”可保留其先行词存在的争议。
- source_word: הרים
  choice: 被除掉
  rationale: 字面涉及“举起”，但与הַתָּמִיד连用时，语境所指是常规祭祀被撤除。采用被动表达，既符合汉语，也避免擅自明确施事者。
- source_word: הַתָּמִיד
  choice: 常献之祭
  rationale: תָּמִיד本义为持续、定常；在圣殿语境中省略地指经常举行的献祭礼仪。“常献之祭”简洁保留这一祭祀含义，而不额外补入原文没有明说的“燔祭”。
- source_word: וְהֻשְׁלַךְ
  choice: 也被摔毁
  rationale: 使役被动形表达被抛下、扔倒。“被摔毁”保留强烈的暴力意象，并在现代汉语中清楚自然。
- source_word: מְכוֹן
  choice: 所在
  rationale: מָכוֹן可指固定的地方、基址或根基。与“圣所”连用时，“所在”较自然，也不把含义过早限定为建筑结构上的“根基”。
- source_word: מִקְדָּשׁוֹ
  choice: 他的圣所
  rationale: מִקְדָּשׁ指圣所、圣地。“圣所”保留其敬拜和神圣空间的含义，不将范围缩窄为整个圣殿建筑群。
theological_decisions:
- issue: “军旅之君”的身份
  choice: 正文只保留“军旅之君”这一称号，不指明具体身份。
  alternative: 可理解为天上的君长、上帝、历史上的大祭司，或某些传统所理解的弥赛亚。
  rationale: 希伯来文称号崇高，却没有在本节直接确认其身份；保持中性可避免把某一神学或历史解释写进正文。
- issue: “从他那里”中代词的先行词
  choice: 保留阳性单数的“他”，不在正文说明所指。
  alternative: 可理解为指军旅之君，也有人将其与军旅或上下文中的其他对象联系起来，或按较宽泛的句法理解。
  rationale: 原文代词的所指有争议；直译能保存这种真实的歧义。
- issue: 除掉常献之祭的施事者
  choice: 采用“被除掉”的被动式。
  alternative: 也可按辅音形式和句法译为“它除掉了常献之祭”。
  rationale: 被动表达符合上下文所呈现的结果，同时避免在希伯来文本形态与传统理解之间作过度确定的裁断。
translation_notes:
  register: 采用现代、庄重而可朗读的书面汉语。“自高”“军旅之君”“常献之祭”保留异象文体的凝练感；句法则按现代汉语调整，使普通读者可以顺畅理解。
