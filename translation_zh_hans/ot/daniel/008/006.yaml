  yaml_path: translation/ot/daniel/008/006.yaml
  text: He came up to the ram with the two horns[a], which I had seen standing before the canal[b], and ran at him in the fury of his power.
translation:
  language: zh_hans
  text: 它来到那只长着两只角的公羊跟前，就是我先前看见站在水渠[a]前的那只；它在盛怒中竭尽全力，向那只公羊冲去[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“溪流”。希伯来语אוּבָל指水道；这里译作“水渠”，因为更符合《但以理书》第8章的场景。
    reason: lexical_alternative
  - marker: b
    text: 直译“在他力量的烈怒中向他奔去”；也可译“以强烈愤怒和力量向它冲去”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא עַד הָאַיִל
  choice: 它来到……公绵羊跟前
  rationale: בוא与עַד连用，表示来到某对象面前；“来到……跟前”自然保留了趋近并抵达的方向意义。אַיִל在异象中指公羊，译作“公绵羊”可明确动物种类并与后文的公山羊区分。
- source_word: בַּעַל הַקְּרָנַיִם
  choice: 长着两只角
  rationale: בעל本义为“拥有者”，在这里作属性描述；קְרָנַיִם是双数。“长着两只角”符合现代汉语对动物的自然说法，也保留角的数目。
- source_word: אֲשֶׁר רָאִיתִי עֹמֵד
  choice: 我先前看见这公绵羊站在
  rationale: 分句说明这是但以理此前已经见到的公绵羊。“先前”在汉语中清楚交代相对于当前动作的时间先后。
- source_word: לִפְנֵי הָאֻבָל
  choice: 在水渠前
  rationale: אוּבָל指水道；本章场景下“水渠”较为贴切，同时用脚注保留“溪流”这一可能译法。לִפְנֵי译作“在……前”，不额外判定是在岸边还是正对水道。
- source_word: וַיָּרָץ אֵלָיו
  choice: 向公绵羊冲去
  rationale: רוץ的基本义是“跑”，但此处语境明显带有攻击性；“冲去”兼顾快速奔跑和敌对方向。重述“公绵羊”可避免连续使用动物代词造成指代不清。
- source_word: בַּחֲמַת כֹּחוֹ
  choice: 盛怒之下，奋力
  rationale: חֵמָה表示烈怒、狂怒，כֹּחַ表示力量。“盛怒之下，奋力”以自然汉语保留愤怒与力量两个要素，而不把该短语压缩为单一副词；脚注列出更贴近希伯来语结构的译法。
