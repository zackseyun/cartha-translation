source:
  edition: WLC
  text: וְ/עָצַ֤ם כֹּח/וֹ֙ וְ/לֹ֣א בְ/כֹח֔/וֹ וְ/נִפְלָא֥וֹת יַשְׁחִ֖ית וְ/הִצְלִ֣יחַ וְ/עָשָׂ֑ה וְ/הִשְׁחִ֥ית עֲצוּמִ֖ים וְ/עַם קְדֹשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/024.yaml
  text: His power will become strong[a], but not by his own power. He will bring about extraordinary destruction, and he will succeed and act; he will destroy the mighty and the people of the holy ones.
translation:
  language: zh_hans
  text: 他的力量必变得强盛，却不是靠自己的力量。他必造成惊人的毁灭，必得逞并行事；他必毁灭强者和众圣者的民[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“圣民”；或“圣徒的民”。
    reason: 希伯来语短语可按字面构造理解为“众圣者的民”，也可惯用地理解为“圣民”，其所指范围存在真实歧义。
lexical_decisions:
- source_word: וְעָצַם כֹּחוֹ
  choice: 他的力量必强盛
  rationale: עָצַם与כֹּחַ连用，表示力量变得强大；“必强盛”保留动态和述谓意味，也比“变得伟大”更符合词义。
- source_word: וְלֹא בְכֹחוֹ
  choice: 却不是靠他自己的力量
  rationale: 介词ב在此表示凭借或手段；“自己的”清楚表达前后两个同指代词所形成的反差，并暗示其力量另有来源而不进一步解释来源。
- source_word: וְנִפְלָאוֹת יַשְׁחִית
  choice: 他必造成惊人的毁灭
  rationale: נִפְלָאוֹת可指非凡、惊人的事；与שׁחת连用时语义负面。“造成惊人的毁灭”以自然中文表达毁灭程度或方式非同寻常，同时保留震撼感。
- source_word: וְהִצְלִיחַ
  choice: 他必得逞
  rationale: 使役词干的צלח在此指成功、顺利。“得逞”符合敌对压迫者的语境，并避免“亨通”可能带来的道德认可意味。
- source_word: וְעָשָׂה
  choice: 并采取行动
  rationale: עשה含义宽泛，可指做、施行或行动。此处不增添原文没有明说的“任意而行”，以“采取行动”保留其概括性并使现代中文通顺。
- source_word: וְהִשְׁחִית
  choice: 他必毁灭
  rationale: 在军事压迫的上下文中，שׁחת表示摧毁或毁灭；“毁灭”准确延续本节的灾害主题。
- source_word: עֲצוּמִים
  choice: 强者
  rationale: 该复数形容词作名词使用，指强大或有势力的人；“强者”简洁自然。
- source_word: וְעַם קְדֹשִׁים
  choice: 众圣者的民
  rationale: 按构造关系直译为“圣者们的民”，保留קְדֹשִׁים的复数以及短语可能涉及圣者群体的含混性；中文用“众圣者”自然标示复数。另一种惯用理解“圣民”收入脚注。
theological_decisions:
- issue: וְעַם קְדֹשִׁים所指对象及其构造关系
  choice: 众圣者的民
  alternative: 圣民；圣徒的民
  rationale: 希伯来语קְדֹשִׁים为复数，可指“圣者们”，而整个短语也可能惯用地指上帝的圣民。在正文保留字面构造和神学张力，在脚注列出惯用及传统译法，不武断限定圣者为天上存在或地上圣徒。
translation_notes:
  register: 采用庄重而现代的标准普通话。“得逞”贴合反派语境；“采取行动”避免把简约的עשה扩展成“任意而行”。分号呈现希伯来语连续分句的推进感，同时保持中文可读性。
