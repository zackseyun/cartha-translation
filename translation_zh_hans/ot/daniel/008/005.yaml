id: DAN.8.5
reference: Daniel 8:5
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/אֲנִ֣י הָיִ֣יתִי מֵבִ֗ין וְ/הִנֵּ֤ה צְפִיר הָֽ/עִזִּים֙ בָּ֤א מִן הַֽ/מַּעֲרָב֙ עַל פְּנֵ֣י כָל הָ/אָ֔רֶץ וְ/אֵ֥ין נוֹגֵ֖עַ בָּ/אָ֑רֶץ וְ/הַ֨/צָּפִ֔יר קֶ֥רֶן חָז֖וּת בֵּ֥ין עֵינָֽי/ו׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/005.yaml
  text: As I was considering[a], behold, a male goat came from the west over the face of the whole earth, without touching the ground[c][b]; and the goat had a conspicuous horn between its eyes.
translation:
  language: zh_hans
  text: 我正仔细察看时，看哪，有一只公山羊从西方而来，掠过全地，却不沾地面[a]；这只公山羊两眼之间长着一只显眼的角[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“并没有触及地”；这是异常迅疾的形象。
    reason: lexical_alternative
  - marker: b
    text: “显眼的角”也可译作“突出的角”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הָיִיתִי מֵבִין
  choice: 我正仔细察看
  rationale: היה与分词构成持续性动作；此处指但以理持续留意并思量异象。中文用“仔细察看”兼顾视觉观察和专注理解，且与异象语境自然衔接。
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留异象叙事中引入突发新景象的鲜明提示语，也维持庄重的先知文学语体。
- source_word: צְפִיר הָעִזִּים
  choice: 一只公山羊
  rationale: 该短语明确指雄性的山羊；“公山羊”是现代汉语中准确、自然的称呼。
- source_word: מִן הַמַּעֲרָב
  choice: 从西方而来
  rationale: מַעֲרָב在此为方位“西方”；按自然汉语补出“而来”。
- source_word: עַל פְּנֵי כָל הָאָרֶץ
  choice: 掠过全地
  rationale: 该短语描绘从整个地面之上越过的动态画面。“掠过”与下句“不沾地面”共同传达迅疾腾越的意象；“全地”保留הָאָרֶץ可指大地或全地的范围张力，不强行限定为现代意义的全球。
- source_word: וְאֵין נוֹגֵעַ בָּאָרֶץ
  choice: 却不沾地面
  rationale: 原文较直译为“并没有触及地”；“不沾地面”是简洁自然的中文，并保留异常迅疾的视觉形象。
- source_word: קֶרֶן חָזוּת
  choice: 一只显眼的角
  rationale: קֶרֶן直译为“角”，保留后文展开的象征意义；חָזוּת在此突出其可见、醒目或突出的特征，“显眼”自然且不预先解释象征所指。
- source_word: בֵּין עֵינָיו
  choice: 两眼之间
  rationale: 忠实保留原文的具体空间位置，不改写为带解释性的“额头上”。
theological_decisions:
- issue: 启示文学中的象征性动物意象
  choice: 保留“公山羊”和“角”的字面异象，不在本节译文中明说其所代表的国度或君王。
  alternative: 依据本章后文的解释，在本节直接译出其政治象征所指。
  rationale: 本节处于异象呈现阶段，象征的解释尚未给出。按文本次序保留形象，可避免把后文解释提前嵌入译文。
- issue: הָאָרֶץ的范围
  choice: 译作“全地”。
  alternative: 译作“整个世界”或“所有土地”。
  rationale: “全地”既能呈现异象的广阔范围，也保留希伯来词可指大地、地面或地域的语义弹性，避免不必要地把地理范围绝对化。
translation_notes:
  register: 采用现代、庄重而易懂的异象叙事语体。“看哪”保留先知文学的突显作用；其余表达避免古奥。“掠过全地，却不沾地面”以自然汉语再现原文的动态画面。
