    rationale: שַׁלְוָה主要指安稳、安逸、平安或安全；上下文可推知受害者未作防备，但原词本身未直接说“无备”。改为“在安逸之时”可保留语义范围，避免过度具体化。
  - severity: low
    issue: “他心里必自高自大”缺少介词性连接，表达略不自然。
    rationale: וּבִלְבָבוֹ明示“在他心里”；“他必在心里自高自大”更自然，并保留内在自我高举的意思。
  - severity: low
