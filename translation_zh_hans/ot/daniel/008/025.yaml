id: DAN.8.25
reference: Daniel 8:25
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/עַל שִׂכְל֗/וֹ וְ/הִצְלִ֤יחַ מִרְמָה֙ בְּ/יָד֔/וֹ וּ/בִ/לְבָב֣/וֹ יַגְדִּ֔יל וּ/בְ/שַׁלְוָ֖ה יַשְׁחִ֣ית רַבִּ֑ים וְ/עַ֤ל שַׂר שָׂרִים֙ יַעֲמֹ֔ד וּ/בְ/אֶ֥פֶס יָ֖ד יִשָּׁבֵֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/025.yaml
  text: And through his shrewdness he will make deceit prosper in his hand; and in his heart he will magnify himself. In a time of security he will destroy many[a], and he will rise up against the Prince of princes; but he will be broken without hand.
translation:
  language: zh_hans
  text: 他凭着自己的机巧，必使诡诈在他手中得逞；他必在心里自高自大。在安逸之时，他必毁灭许多人；他还要起来敌对众统帅之首，却非人手所能，他必被击碎。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“非／没有手”。这是一种简略习语，通常指并非由人力或寻常人的力量所致。
    reason: 说明希伯来文בְּאֶפֶס יָד的字面形式和惯用含义，同时不在正文中指定施事者。
lexical_decisions:
- source_word: שִׂכְלוֹ
  choice: 自己的机巧
  rationale: 该词可指洞察力、精明或才智；在此处敌对且与诡诈相连的语境中，“机巧”既保留才智之意，也带有适度的负面色彩，而不把它过度强化为纯粹的“奸诈”。
- source_word: וְהִצְלִיחַ מִרְמָה בְּיָדוֹ
  choice: 使诡诈在他手中得逞
  rationale: הִצְלִיחַ为使役形式，以“诡诈”为宾语，表示他使诡诈成功；“在他手中”保留原文的手之意象，并可表达在其操控之下。
- source_word: וּבִלְבָבוֹ יַגְדִּיל
  choice: 他心里必自高自大
  rationale: 原文直陈他在心中“使大”，反身对象由上下文隐含；“自高自大”自然表达内在的自我抬高。
- source_word: וּבְשַׁלְוָה
  choice: 在安然无备之时
  rationale: שַׁלְוָה可指安稳、安逸或平静；此处很可能描写人毫无戒备的处境。“安然无备”传达这一语境含义，又避免让“和平”产生政治状态上的误解。
- source_word: יַשְׁחִית רַבִּים
  choice: 毁灭许多人
  rationale: שׁחת的使役形式在此最自然地表示毁灭或使人败亡；结合异象中的政治与暴力语境，译作“毁灭”最为清楚。
- source_word: שַׂר שָׂרִים
  choice: 众统帅之首
  rationale: 该组合表示凌驾于其他שׂרים之上的最高者。“众统帅之首”保留层级结构和尊崇称号，同时不把שַׂר限定为世俗君王。
- source_word: וְעַל ... יַעֲמֹד
  choice: 起来敌挡
  rationale: עמד与עַל连用表达敌对抗拒；“起来敌挡”兼顾原文“站立”和公开反抗的语气。
- source_word: וּבְאֶפֶס יָד
  choice: 不借人手
  rationale: 原文为简略习语，字面近于“没有手”，意指其败亡并非由通常的人力造成。正文采用自然中文表达，并以脚注注明较直译形式。
- source_word: יִשָּׁבֵר
  choice: 被击碎
  rationale: שׁבר的被动形式表示“被打破、被击碎”；此译保留原文比喻及施事者未明说的特点。
theological_decisions:
- issue: שַׂר שָׂרִים所指及其称号性质
  choice: 众统帅之首
  alternative: 众首领之首；最高的统帅
  rationale: 该称号指凌驾于一切较低统治者之上的最高者，在《但以理书》的语境中具有神圣或超越性的指向。中文不靠首字母大写区分专名，因此以庄重的称号形式呈现，而不在本节中进一步指定其身份。
- issue: וּבְאֶפֶס יָד所表达的败亡方式
  choice: 不借人手
  alternative: 在没有手的情况下；非由人的力量
  rationale: 希伯来文没有明说“人的”，但该习语暗示这次毁灭并非由通常的人力实施。正文采用合乎中文习惯的表达，脚注保留字面形式，以免把施事者进一步解释为某个明确对象。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“机巧”“得逞”“自高自大”“起来敌挡”等词兼顾异象文体的严肃感与普通读者的可理解性；保留原文未明说击碎者是谁的含蓄。
