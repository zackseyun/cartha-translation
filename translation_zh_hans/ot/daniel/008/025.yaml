    rationale: יַעֲמֹד עַל表达起来反对、敌对；“起来敌对”在现代汉语中更顺畅，敌对力度仍足。
  - severity: medium
    issue: “不借人手而被击碎”对简略习语作了较强的释义，且语序可能造成歧义。
    rationale: בְּאֶפֶס יָד字面为“非／没有手”，虽惯指非由人力，却未明说“人”。“非人手所能，他必被击碎”保留其椭圆性和被动句，脚注再说明惯用理解。
