- from: 他凭着自己的机巧，必使诡诈在他手中得逞；他心里必自高自大。在安然无备之时，他必毁灭许多人。他还要起来敌挡众统帅之首，却必不借人手而被击碎。[a]
  to: 他凭着自己的机巧，必使诡诈在他手中得逞；他必在心里自高自大。在安逸之时，他必毁灭许多人；他还要起来敌对众统帅之首，却非人手所能，他必被击碎。[a]
  rationale: 修订收窄了“安然无备”所加入的推断，使其对应“安逸／安稳”的原文核心；调整两处汉语句法以提升现代通顺度；并以“非人手所能”及脚注处理“非／没有手”的简略习语，既表达其通常所指，又不把未明言的施事者确定下来。
