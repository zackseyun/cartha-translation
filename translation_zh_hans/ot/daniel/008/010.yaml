  text: וַ/תִּגְדַּ֖ל עַד צְבָ֣א הַ/שָּׁמָ֑יִם וַ/תַּפֵּ֥ל אַ֛רְצָ/ה מִן הַ/צָּבָ֥א וּ/מִן הַ/כּוֹכָבִ֖ים וַֽ/תִּרְמְסֵֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/010.yaml
  text: It grew as high as the host of heaven[a], and it cast some of the host and some of the stars down to the earth, and trampled them.
translation:
  language: zh_hans
  text: 它渐渐强大，高及天上的万军[a]；又使天上万军中的一些和一些星辰坠落到地上，并践踏它们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“天上的军队”。这个短语可能象征天上的灵体、神的子民或天上的权势；希伯来原文保留了这一意象的开放性。
    reason: 词义有可成立的替代译法，且象征所指并不明确。
lexical_decisions:
- source_word: וַתִּגְדַּל
  choice: 它渐渐强大
  rationale: גדל的Qal连续式表示变得强大或增长；“渐渐强大”在现代汉语中自然，也保留其发展过程，不加入原文未明说的反身含义。
- source_word: עַד
  choice: 高及
  rationale: עַד表示延伸达到某一界限；结合“天上的众军”，译作“高及”体现向上的空间意象。
- source_word: צְבָא הַשָּׁמַיִם
  choice: 天上的众军
  rationale: צָבָא可指军队或众多成群者；“众军”既保留军事色彩，也不限定为天使、神的子民或天体。
- source_word: וַתַּפֵּל
  choice: 抛落
  rationale: נפל的Hiphil为使役义，即“使……落下”；“抛落”简洁地表达其强制性和向下动作。
- source_word: אַרְצָה
  choice: 在地
  rationale: 这是带方向词尾的אֶרֶץ，表示朝地面而下；“抛落在地”符合现代汉语表达，并保留天地相对的宇宙图景。
- source_word: מִן הַצָּבָא וּמִן הַכּוֹכָבִים
  choice: 众军和星辰中的一些
  rationale: 此处מִן宜按部分义理解，表示从众军与星辰当中抛下一部分，而非全部。
- source_word: הַכּוֹכָבִים
  choice: 星辰
  rationale: כּוֹכָבִים直指星体；“星辰”庄重自然，同时不在正文中解释其象征对象。
- source_word: וַתִּרְמְסֵם
  choice: 并践踏它们
  rationale: רמס意为践踏；三复数宾语后缀回指被抛落的众军与星辰。“践踏”保留原文强烈而简洁的动作。
theological_decisions:
- issue: “天上的众军”和“星辰”究竟指天使、神的子民，还是象征性的天体或权势
  choice: 正文保留“天上的众军”和“星辰”的意象，不明确指定所指
  alternative: 直译或解释为天使、神的子民、圣民，或象征统治者的天体
  rationale: 本节属于启示性异象，意象可能具有象征意义，但希伯来文本在此没有明确界定所指。保留开放性可避免替原文消解神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“高及”保留异象中的垂直运动；“众军”略带经文语体，但仍能被普通读者理解，并比直接解释为“天使”或“圣民”更忠实地保存原文歧义。
