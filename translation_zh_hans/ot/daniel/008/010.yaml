- from: 它渐渐强大，高及天上的众军[a]；又把众军和星辰中的一些抛落在地，并践踏它们。
  to: 它渐渐强大，高及天上的万军[a]；又使天上万军中的一些和一些星辰坠落到地上，并践踏它们。
  rationale: 修订明确了“万军”与“星辰”各自都有“一些”被击落的部分义，并以更自然的现代汉语表达使役性的下坠动作。保留“天上的万军”和“星辰”的字面异象，不在正文指定其象征对象。
