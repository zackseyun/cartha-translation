  text: וַ/יֹּ֨אמֶר֙ הִנְ/נִ֣י מוֹדִֽיעֲ/ךָ֔ אֵ֥ת אֲשֶׁר יִהְיֶ֖ה בְּ/אַחֲרִ֣ית הַ/זָּ֑עַם כִּ֖י לְ/מוֹעֵ֥ד קֵֽץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/019.yaml
  text: Then he said, “Look, I am making known to you what will happen in the latter part of the indignation, for the end is for the appointed time.”
translation:
  language: zh_hans
  text: 他就说：“看哪，我要让你知道震怒的末期将要发生的事，因为终局有指定的时期。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנְנִי
  choice: 看，我要
  rationale: 保留引人注意的语气，同时用自然的现代汉语承接说话者即将采取的行动。
- source_word: מוֹדִיעֲךָ
  choice: 使你知道
  rationale: 贴近使役分词的含义，即把将要发生的事告知但以理。
- source_word: בְּאַחֲרִית הַזָּעַם
  choice: 震怒末期
  rationale: אַחֲרִית在此指后段或末期；הַזָּעַם保留为“震怒”，不擅自限定其主体。
- source_word: מוֹעֵד
  choice: 指定的时期
  rationale: 表达预先确定的时间，而不缩窄为单一时刻。
- source_word: קֵץ
  choice: 终局
  rationale: 表达所预告事件的终结；并避免把它未经说明地等同于整个世界的末日。
theological_decisions:
- issue: “震怒”的主体与具体所指
  choice: 不补出主体，仅译为“震怒”
  alternative: 上帝的震怒／受压迫时期
  rationale: 希伯来文本本节没有明说主体；保留其解释空间和神学张力。
- issue: כִּי לְמוֹעֵד קֵץ的句法关系
  choice: “因为终局是在指定的时期”
  alternative: “因为这是关乎指定的末期”
  rationale: 按马所拉文本将קֵץ理解为句中主题，并保留“终局”与“指定时期”的紧密关系；不借改写来消除原文的简约与一定程度的含混。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“看”保留 הִנְנִי 的提示力；“指定的时期”比“定期”更透明，也能维持预定时间的语义。
