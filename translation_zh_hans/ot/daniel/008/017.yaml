language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יָּבֹא֙ אֵ֣צֶל עָמְדִ֔/י וּ/בְ/בֹא֣/וֹ נִבְעַ֔תִּי וָ/אֶפְּלָ֖/ה עַל פָּנָ֑/י וַ/יֹּ֤אמֶר אֵלַ/י֙ הָבֵ֣ן בֶּן אָדָ֔ם כִּ֖י לְ/עֶת קֵ֥ץ הֶ/חָזֽוֹן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/017.yaml
  text: So he came near where I was standing[a], and when he came, I was terrified and fell on my face. Then he said to me, “Understand, son of man[b], that the vision is for the time of the end.”
translation:
  language: zh_hans
  text: 他走近我所站的地方[a]；他走近时，我惊恐万分，俯伏在地。他对我说：“人子[b]啊，你要明白：这异象关乎末期[c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我所站之处的旁边”。
    reason: 保留 אֵצֶל עָמְדִי 所表达的邻近空间关系。
  - marker: b
    text: “人子”在这里是对但以理的称呼，也可理解为“人”或“必死的人”。希伯来语字面意思是“人的儿子”。
    reason: 说明 בֶּן־אָדָם 在此强调人的身份，同时保留正文的字面形式及其文学张力。
  - marker: c
    text: 或译：“这异象是关乎终结之时。”
    reason: 反映 לְעֵת קֵץ 与终结之时相关的时间指向，避免加入原文未明说的具体末世时间框架。
lexical_decisions:
- source_word: אֵצֶל עָמְדִי
  choice: 走近我站立的地方
  rationale: אֵצֶל 表示临近、靠近；与 עָמְדִי 连用，指但以理当时站立之处。此译自然保留空间意义。
- source_word: נִבְעַתִּי
  choice: 我就惊恐万分
  rationale: בעת 的尼法勒形表达强烈恐惧，而不只是受到轻微惊吓；“惊恐万分”体现其强度。
- source_word: וָאֶפְּלָה עַל־פָּנַי
  choice: 俯伏在地
  rationale: 希伯来语字面为“倒在脸上”，是面伏于地的惯用表达；中文用“俯伏在地”既自然又保留姿态含义。
- source_word: הָבֵן
  choice: 你要明白
  rationale: בין 的使役式命令形在此要求领会异象；“你要明白”直接而庄重。
- source_word: בֶּן אָדָם
  choice: 人子
  rationale: 字面为“人的儿子”，在此用于称呼但以理，突出其人类身份。“人子”保留原文形式及《但以理书》内部的文学呼应，脚注说明其普通人、必死之人的语义。
- source_word: לְעֵת קֵץ
  choice: 关乎末后的时期
  rationale: 介词 לְ 可表示所指向或所关涉的时间；עֵת קֵץ 指终局、尽头所对应的时期。此译不额外设定具体末世体系。
- source_word: הֶחָזוֹן
  choice: 这异象
  rationale: 带定冠词的名词回指但以理刚刚所见的异象；现代中文用“这异象”回指清晰。
theological_decisions:
- issue: 末世语境中 בֶּן אָדָם 的译法
  choice: 人子
  alternative: 世人；必死的人
  rationale: 此处首先是对但以理的称呼，强调他是人；保留字面形式可维持《但以理书》的互文和神学张力，又不把这里直接解释为特定弥赛亚称号。
- issue: לְעֵת קֵץ 的含义
  choice: 这异象关乎末后的时期
  alternative: 这异象是为终局的定期；这异象关乎末期
  rationale: 原文明确把异象与“终结/尽头”的时期相连，却没有在本节中说明其完整时间框架。“关乎末后的时期”保留这种指向而不导入特定末世论方案。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“惊恐万分”传达强烈惧怕；“俯伏在地”以自然中文表达面伏于地的动作；“人子”和“末后的时期”保留原文的文学及神学张力，并以脚注提示可选理解。
