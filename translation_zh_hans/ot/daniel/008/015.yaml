  text: וַ/יְהִ֗י בִּ/רְאֹתִ֛/י אֲנִ֥י דָנִיֵּ֖אל אֶת הֶ/חָז֑וֹן וָ/אֲבַקְשָׁ֣/ה בִינָ֔ה וְ/הִנֵּ֛ה עֹמֵ֥ד לְ/נֶגְדִּ֖/י כְּ/מַרְאֵה גָֽבֶר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/015.yaml
  text: And it happened[a], when I, Daniel, had seen the vision and was seeking understanding, behold, standing before me was one with the appearance of a man.
translation:
  language: zh_hans
  text: 我，但以理看见这异象，正寻求明白时，看哪，有一位站在我面前，形貌如同男子。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“看哪，有一位站在我面前，具有男子的形貌。”
    reason: 原文 כְּמַרְאֵה גָבֶר 描述其外在形貌与男子相似；此译法保留比较意味，不确定该人物的身份或本体。
lexical_decisions:
- source_word: וַיְהִי
  choice: 事情是这样
  rationale: 这是希伯来叙事中常见的承接表达，用现代汉语自然地引出接下来的情景，同时保留其叙事推进作用。
- source_word: בִּרְאֹתִי אֲנִי דָנִיֵּאל
  choice: 我但以理看见了……时
  rationale: 介词 בְּ 加不定式结构构成时间从句；“我但以理”保留原文显明的自称和强调。
- source_word: הֶחָזוֹן
  choice: 这异象
  rationale: חָזוֹן 在本段指但以理所见的异象；汉语用“这”自然承接上文所述的特定异象。
- source_word: וָאֲבַקְשָׁה בִינָה
  choice: 正寻求明白其中的意思
  rationale: בקשׁ 与 בינה 表达寻求理解或洞见；“正寻求”体现过程性，“其中的意思”使现代汉语完整自然，却不预先规定异象的解释。
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: הִנֵּה 用于鲜明地引人注意突然呈现的景象；“看哪”保留庄重、文学性的提示作用。
- source_word: עֹמֵד לְנֶגְדִּי
  choice: 有一位站在我面前
  rationale: 分词 עֹמֵד 描写正在站立的状态，לְנֶגְדִּי 表示在说话者面前或对面；“站在我面前”符合此处视觉场景。
- source_word: כְּמַרְאֵה גָבֶר
  choice: 形貌像个男人
  rationale: 比较词 כְּ 与 מַרְאֶה 表示外观上的相似，并不说明这位人物的本体或身份；“形貌像个男人”在汉语中简明地保留这种现象性描述。
- source_word: גָבֶר
  choice: 男人
  rationale: גָבֶר 在这里指成年男性；上下文着重可见的男性形貌，并无充分理由译为“勇士”。
theological_decisions:
- issue: כְּמַרְאֵה גָבֶר 所描写者的身份与性质
  choice: 仅译作“有一位……形貌像个男人”，按所见外形加以描述，不进一步确认其身份。
  alternative: 可具体解释为取了人形的天使、一个男人，或道成肉身以前显现的神圣人物。
  rationale: 本节只说但以理看见一位形貌像男人的存在；翻译应保留比较语气与身份上的开放性，不把上下文解释或特定神学认定写进正文。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“事情是这样”避免古雅的“事就这样成了”；“看哪”则有意保留异象叙事中鲜明的注意提示。脚注标记置于其所说明的外貌描述之后。
