revisions:
- from: 事情是这样：我但以理看见了这异象，正寻求明白其中的意思时，看哪，有一位站在我面前，形貌像个男人。[a]
  to: 我，但以理看见这异象，正寻求明白时，看哪，有一位站在我面前，形貌如同男子。[a]
  rationale: 修订删除不够贴切的解释性开头，调整自称的标点和外貌措辞，并重写脚注，使其成为语法完整、忠实保留比较意义的替代译文。未对该人物作天使、人或神圣显现等身份判定。
