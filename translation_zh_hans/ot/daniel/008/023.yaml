source:
  edition: WLC
  text: וּֽ/בְ/אַחֲרִית֙ מַלְכוּתָ֔/ם כְּ/הָתֵ֖ם הַ/פֹּשְׁעִ֑ים יַעֲמֹ֛ד מֶ֥לֶךְ עַז פָּנִ֖ים וּ/מֵבִ֥ין חִידֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/023.yaml
  text: And at the latter end of their kingdom[a], when the transgressors have reached their full measure, a king will arise, fierce in countenance and skilled in intrigue.
translation:
  language: zh_hans
  text: 在他们的国度的末期，当悖逆者的悖逆满盈时，必有一位王兴起；他面目凶悍，善解隐语[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “善解隐语”也可译为“善于解谜”或“明白隐晦的话”；按上下文，也可能暗指精于诡计或权谋。
    reason: 保留חִידוֹת的基本词义及其在本段政治语境中可能具有的引申意味，而不将后一理解定为唯一含义。
lexical_decisions:
- source_word: וּבְאַחֲרִית מַלְכוּתָם
  choice: 到他们国度的末期
  rationale: אַחֲרִית表示一段时期的后段或末期；מַלְכוּת为单数并带第三人称阳性复数后缀，因此译作“他们国度”，不擅自改为复数“诸国”。
- source_word: כְּהָתֵם הַפֹּשְׁעִים
  choice: 当悖逆之人的恶行达到极点时
  rationale: תמם表达完成、达到尽头；这里不是说悖逆者本人不复存在，而是其悖逆发展到完全的程度。“恶行达到极点”在现代汉语中自然，也保留了达到满盈或完成状态的含义。
- source_word: יַעֲמֹד מֶלֶךְ
  choice: 必有一位王兴起
  rationale: עמד在君王更替的语境中可指兴起、登场；מֶלֶךְ直译为“王”。“必有”表达未完成式在预言语境中的将来指向。
- source_word: עַז פָּנִים
  choice: 面目凶悍
  rationale: 原文直义近于“脸面强硬”，是描述强横、凶猛或无所顾忌的习语。“面目凶悍”保留面容意象，同时符合现代汉语表达。
- source_word: וּמֵבִין חִידוֹת
  choice: 善解隐语
  rationale: בין意为理解、辨明，חידות可指谜语、隐语或晦涩难解的话。“善解隐语”直接反映原文措辞，避免在正文中把其含义单向限定为政治阴谋；可能的诡诈、权谋含义列入脚注。
theological_decisions:
- issue: וּמֵבִין חִידוֹת所指的是理解隐语，还是精于诡计
  choice: 正文译作“善解隐语”
  alternative: “精通诡计”或“善于权谋”
  rationale: 原文可以直接指理解谜语、隐晦言辞，也可能在敌对君王的政治语境中暗示狡黠和权谋。正文采用较贴近字面的译法，并以脚注保留语境性的另一种理解，避免消除原有张力。
- issue: כְּהָתֵם הַפֹּשְׁעִים中“达到完全”的对象
  choice: 译作“悖逆之人的恶行达到极点”
  alternative: “悖逆者达到满数”或“悖逆者到了尽头”
  rationale: 希伯来文的结构简练，完成或满盈的具体所指存在一定含混。上下文更自然地指悖逆发展到极致，而不是悖逆者的人数凑足或其生命终止，因此采用动态表达，但不引入具体历史身份。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“末期”“兴起”“隐语”保持预言文学的凝练感；避免过度古雅的句式，也不把这位王直接认定为任何特定历史或末世人物。
