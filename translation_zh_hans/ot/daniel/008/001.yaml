base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/001.yaml
  text: In the third year of the reign of Belshazzar the king[a], a vision appeared to me—I, Daniel—after the one that had appeared to me at the first.
translation:
  language: zh_hans
  text: 伯沙撒王在位第三年，在先前向我显现的异象之后，又有一个异象向我——但以理——显现。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּשְׁנַת שָׁלוֹשׁ לְמַלְכוּת
  choice: 在位第三年
  rationale: 这是君王纪年公式；希伯来语基数词在此具有序数含义。现代汉语用“在位第三年”既自然又准确。
- source_word: בֵּלְאשַׁצַּר הַמֶּלֶךְ
  choice: 伯沙撒王
  rationale: 按现代汉语习惯将人名和王号合并表达，同时保留其君王身份。
- source_word: חָזוֹן נִרְאָה אֵלַי
  choice: 有一个异象向我显现
  rationale: נִרְאָה 是 ראה 的尼法勒式，在异象语境中表示“显现”。此译法比“我看见一个异象”更贴近原文的语态与表达焦点。
- source_word: אֲנִי דָנִיֵּאל
  choice: 我——但以理——
  rationale: 显式人称代词加姓名带有自我标明和轻微强调；破折号保留插入式强调，又符合现代汉语表达。
- source_word: אַחֲרֵי הַנִּרְאָה אֵלַי
  choice: 在……向我显现的那个异象之后
  rationale: 原文以带冠词的尼法勒形式回指此前的显现；汉语补出“异象”使所指清楚，并以“那个”保留其特指性。
- source_word: בַּתְּחִלָּה
  choice: 先前
  rationale: 本处指时间次序上较早的一次显现。“先前”在现代汉语中自然，也避免“起初”被误解为绝对开端。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。保留“异象向我显现”的原文视角，并用插入式姓名表现 אֲנִי דָנִיֵּאל 的强调。
