reference: Daniel 8:12
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/צָבָ֛א תִּנָּתֵ֥ן עַל הַ/תָּמִ֖יד בְּ/פָ֑שַׁע וְ/תַשְׁלֵ֤ךְ אֱמֶת֙ אַ֔רְצָ/ה וְ/עָשְׂתָ֖ה וְ/הִצְלִֽיחָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/012.yaml
  text: And a host was given over with the regular burnt offering because of transgression[a]; and it cast truth to the ground[c][b], and it acted and prospered.
translation:
  language: zh_hans
  text: 因悖逆，军旅连同常献的祭[a][b]被交付；它[c]把真理抛在地上，行事，且亨通。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “常献的祭”也可译作“每日的祭”“常献祭”或（按上下文补足）“常献的燔祭”。希伯来语תָּמִיד指圣所中按常规持续献上的祭。
    reason: lexical_alternative
  - marker: b
    text: “连同”所译的希伯来介词也可能表示“攻击”或“针对”。本句的希伯来语结构较难确定。
    reason: alternative_reading
  - marker: c
    text: “把……抛”“行事”“亨通”的希伯来语动词均为阴性单数；其确切所指在异象中表达得很紧缩，可能指上文所象征的敌对势力。
    reason: alternative_reading
lexical_decisions:
- source_word: וְצָבָא
  choice: 军旅
  rationale: צָבָא可指军队、众军或一群人；“军旅”保留其集合性和异象语境中的一定含混，避免径直限定为现代意义的“军队”。
- source_word: תִּנָּתֵן
  choice: 被交了出去
  rationale: נתן的尼法勒式为被动，基本义是“被交出、被交付”；此译体现落入敌对势力权下的语境。
- source_word: עַל
  choice: 连同
  rationale: 此处עַל的结构和语义较难确定；“连同”表达军旅与常献祭物共同被交出的关联，同时以脚注保留“攻击”的可能。
- source_word: הַתָּמִיד
  choice: 常献的燔祭
  rationale: תָּמִיד在圣所礼仪语境中指经常、持续献上的祭；“常献的燔祭”既说明祭祀性质，也保留“常献”这一核心含义。
- source_word: בְּפָשַׁע
  choice: 因悖逆
  rationale: 介词ב可作原因解；פֶּשַׁע兼有过犯和反叛之意。“悖逆”适合本段敌对上帝与圣所的语境，又不明确指定是谁的悖逆。
- source_word: וְתַשְׁלֵךְ
  choice: 它把……抛
  rationale: שלך的使役式意为“扔、抛”；“抛在地上”直接而自然，并保留原文阴性单数动词所指不明的问题。
- source_word: אֱמֶת
  choice: 真理
  rationale: אֱמֶת可指真理、真实或信实；“真理”保留其广泛的道德和宗教含义。
- source_word: אַרְצָה
  choice: 在地上
  rationale: 带方向词尾的אֶרֶץ表示“到地上”；汉语惯用“抛在地上”表达这一方向和结果。
- source_word: וְעָשְׂתָה
  choice: 行事
  rationale: עשה含义宽泛，可指做、行；原文没有宾语，“行事”保留其简练，不增添“任意而行”等解释。
- source_word: וְהִצְלִיחָה
  choice: 亨通
  rationale: צלח的使役式在此表示成功、顺利；“亨通”符合先知文学的庄重语体，同时不暗示其行为正当。
theological_decisions:
- issue: 阴性单数动词的所指与行动主体
  choice: 用中性代词“它”，不明确认定为小角、军旅或其他主体。
  alternative: 译作“他”或“那角”，明确以小角为主体。
  rationale: 原文“抛、行、亨通”均为阴性单数形式，与可能的先行词关系压缩且不明确；用“它”保存异象本身的语法张力，避免替文本解决解释问题。
- issue: הַתָּמִיד在本节中的含义
  choice: 正文译为“常献的燔祭”。
  alternative: 译作“日常的祭”或“常献祭”。
  rationale: 该词在此圣所语境中指固定持续献上的祭物；正文点明燔祭较便于现代读者理解，脚注同时保留较宽的译法。
- issue: בְּפָשַׁע所指的悖逆
  choice: 译作“因悖逆”，不说明悖逆者是谁。
  alternative: 明确为百姓的过犯，或敌对势力的叛逆行为。
  rationale: 原文未明说悖逆归属于哪一方；保持无主限定可避免导入特定历史或神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。句式尽量保存希伯来文的简练与并列推进；“它”刻意保留行动主体的含混。“军旅”略带经文语体，但比“万军”更少神学预设，也比“军队”更能保存集合义。
