base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/003.yaml
  text: Then I lifted up my eyes and saw[a], and behold, one ram was standing before the canal, and it had two horns. The horns were high, but one was higher than the other[b], and the higher one came up last.
translation:
  language: zh_hans
  text: 我举目观看，看哪，一只公绵羊站在水渠[a]前，长着两只角。两只角都很高，但一只比另一只更高；那只较高的角是后来长起来的[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “水渠”也可译作“水道”或“河流”。原文指水流的通道；在《但以理书》此处的语境中，很可能指水渠。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“那只较高的角最后才长起来”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשָּׂא עֵינַי
  choice: 我举目观看
  rationale: 保留希伯来语“举目”的惯用表达及异象叙事的庄重语气，同时符合现代汉语表达。
- source_word: וָאֶרְאֶה וְהִנֵּה
  choice: 观看，看哪
  rationale: “看哪”传达 הִנֵּה 引人注意、使景象顿现的指示作用；与前面的观看连用，保留原文鲜明的视觉叙述。
- source_word: אַיִל אֶחָד
  choice: 一只公绵羊
  rationale: אַיִל 特指公绵羊；“一只”明确反映 אֶחָד，并自然引入异象中的单个形象。
- source_word: עֹמֵד לִפְנֵי הָאֻבָל
  choice: 站在水渠前
  rationale: 分词表达持续站立的姿态。אֻבָל 指水道，在《但以理书》的语境中很可能是人工水渠；“水渠”既准确又不过度限定。
- source_word: וְלוֹ קְרָנָיִם
  choice: 长着两只角
  rationale: 将字面上的领属结构自然转成现代汉语；双数形式明确译为“两只角”。
- source_word: וְהַקְּרָנַיִם גְּבֹהוֹת
  choice: 两只角都很高
  rationale: 直接表达 גְּבֹהוֹת 的高度含义；补出“都”使双角并列关系在汉语中清楚自然。
- source_word: וְהָאַחַת גְּבֹהָה מִן הַשֵּׁנִית
  choice: 但一只比另一只更高
  rationale: “另一只”比直译“第二只”更符合汉语习惯；“但”准确呈现两角同高大而又有高低差异的转折关系。
- source_word: וְהַגְּבֹהָה עֹלָה בָּאַחֲרֹנָה
  choice: 那只较高的角是后来长起来的
  rationale: עֹלָה 在角的语境中指长出、兴起；בָּאַחֲרֹנָה 表示后来或最后出现。“后来长起来”兼顾生长意象和时间次序。
theological_decisions:
- issue: 启示文学中的象征性动物与角的意象
  choice: 正文保留“公绵羊”和“角”的具体形象，不加入其所象征对象的解释。
  alternative: 在本节正文中直接说明公绵羊及两角的历史或政治所指。
  rationale: 本节只呈现异象，相关解释在本章后文给出；不提前释义可避免把解释性结论掺入译文，并保留叙事推进与神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“举目观看，看哪”保留异象叙事的抬升语体；其余句式力求简洁自然。脚注标记[a]置于与其所解释的末句紧邻的位置。
