  text: וּ/רְאִיתִ֞י/ו מַגִּ֣יעַ אֵ֣צֶל הָ/אַ֗יִל וַ/יִּתְמַרְמַ֤ר אֵלָי/ו֙ וַ/יַּ֣ךְ אֶת הָ/אַ֔יִל וַ/יְשַׁבֵּר֙ אֶת שְׁתֵּ֣י קְרָנָ֔י/ו וְ/לֹא הָ֥יָה כֹ֛חַ בָּ/אַ֖יִל לַ/עֲמֹ֣ד לְ/פָנָ֑י/ו וַ/יַּשְׁלִיכֵ֤/הוּ אַ֨רְצָ/ה֙ וַֽ/יִּרְמְסֵ֔/הוּ וְ/לֹא הָיָ֥ה מַצִּ֛יל לָ/אַ֖יִל מִ/יָּדֽ/וֹ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/007.yaml
  text: And I saw him come up to the ram[a], and he was enraged against him, and he struck the ram and broke its two horns. And there was no strength in the ram to stand before him; he threw him to the ground and trampled him[d][c][b], and there was no one to rescue the ram from his hand.
translation:
  language: zh_hans
  text: 我看见公山羊来到公绵羊跟前[a]，对公绵羊满怀愤恨[b]，就击打公绵羊，折断了它的两只角。公绵羊无力在公山羊面前站立[c]；公山羊把公绵羊摔在地上，又践踏它。没有谁能从公山羊手中[d]救出公绵羊。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“接近公绵羊”。这里的希伯来语动词可指来到近旁或抵达跟前。
    reason: lexical_alternative
  - marker: b
    text: 或译“就对它满怀苦恨”。原文表达强烈的敌意、激愤或苦恨。
    reason: lexical_alternative
  - marker: c
    text: “在它面前站立”在这里也可理解为“抵挡它”或“与它抗衡”。
    reason: lexical_alternative
  - marker: d
    text: “从它手中”是希伯来语习语，意思是脱离它的权势或控制。
    reason: cultural_note
lexical_decisions:
- source_word: וּרְאִיתִיו
  choice: 我看见它
  rationale: 第一人称完成式带第三人称阳性单数宾语后缀，承接异象叙述；所指为上下文中的公山羊。现代汉语通常以“它”指动物。
- source_word: מַגִּיעַ אֵצֶל הָאַיִל
  choice: 来到公绵羊跟前
  rationale: נגע 的分词与 אֵצֶל 连用，表示来到近旁或抵达跟前；此译保留异象中的动态感，同时自然清楚。
- source_word: וַיִּתְמַרְמַר אֵלָיו
  choice: 向它怒气发作
  rationale: מרר 的 Hitpael 形式表达变得苦毒、激愤或充满敌意；战斗语境下译作“怒气发作”既体现强烈敌意，也不把含义收窄为具体冲锋动作。
- source_word: וַיַּךְ אֶת הָאַיִל
  choice: 撞击公绵羊
  rationale: נכה 基本义为击打。由于主语是公山羊，“撞击”符合动物以角攻击的场景，又没有增添原文未明说的结果。
- source_word: וַיְשַׁבֵּר אֶת שְׁתֵּי קְרָנָיו
  choice: 折断了它的两只角
  rationale: שבר 意为打破、折断；用于角时，“折断”最自然准确。
- source_word: וְלֹא הָיָה כֹחַ בָּאַיִל
  choice: 公绵羊无力
  rationale: כֹּחַ 可指力量或能力；在搏斗场景中，“无力”简洁地表达公绵羊没有抵抗之力。
- source_word: לַעֲמֹד לְפָנָיו
  choice: 在它面前站立
  rationale: 直译保留“站在它面前”的希伯来表达；在冲突语境中也自然含有无法抗衡、抵挡之意。
- source_word: וַיַּשְׁלִיכֵהוּ אַרְצָה
  choice: 把公绵羊摔倒在地
  rationale: השליך 表示扔下、抛下，אַרְצָה 表示向地面；“摔倒在地”符合激烈搏斗的画面。重复“公绵羊”可避免连续动物代词所造成的指代混乱。
- source_word: וַיִּרְמְסֵהוּ
  choice: 又践踏它
  rationale: רמס 指踩踏、践踏；“践踏”保留原文强烈而庄重的暴力意象。
- source_word: וְלֹא הָיָה מַצִּיל לָאַיִל מִיָּדוֹ
  choice: 没有谁能从它手中救出公绵羊
  rationale: מַצִּיל 是主动分词，指施行拯救者；“没有谁能……救出”符合现代汉语。“从它手中”保留原文以手表示权势或控制的习语。
