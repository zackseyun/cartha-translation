  to: 我看见公山羊来到公绵羊跟前[a]，对公绵羊满怀愤恨[b]，就击打公绵羊，折断了它的两只角。公绵羊无力在公山羊面前站立[c]；公山羊把公绵羊摔在地上，又践踏它。没有谁能从公山羊手中[d]救出公绵羊。
  rationale: 修订仅处理汉语指代清晰度、搭配自然度及“摔到地上”的动作表达。明确“公山羊／公绵羊”是为在目标语中保留原文清楚的攻击关系；没有加入象征性解释或改变任何神学含义。脚注锚点及其所说明的词汇和习语均予保留。
