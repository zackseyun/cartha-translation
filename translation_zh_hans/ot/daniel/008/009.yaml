  text: וּ/מִן הָ/אַחַ֣ת מֵ/הֶ֔ם יָצָ֥א קֶֽרֶן אַחַ֖ת מִ/צְּעִירָ֑ה וַ/תִּגְדַּל יֶ֛תֶר אֶל הַ/נֶּ֥גֶב וְ/אֶל הַ/מִּזְרָ֖ח וְ/אֶל הַ/צֶּֽבִי־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/009.yaml
  text: And out of one of them came a small horn[a], and it grew exceedingly great toward the south, toward the east[b], and toward the Beautiful Land.
translation:
  language: zh_hans
  text: 从它们中的一个，长出一只小角[a]；这小角向南、向东和向那荣美之地[b]不断壮大。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“一只微小的角”。“角”是异象中的象征，正文不在此处将它解释为某个君王或政权。
    reason: lexical_alternative
  - marker: b
    text: “荣美之地”也可译作“美地”或“可喜爱之地”；这是一个描述性称号，很可能指以色列地。
    reason: alternative_reading
lexical_decisions:
- source_word: וּמִן הָאַחַת מֵהֶם
  choice: 从它们中的一个
  rationale: מִן表示来源；保留阴性“一个”所指对象在上下文中的开放性，不擅自明确为某一只角或某一风向。
- source_word: יָצָא
  choice: 长出
  rationale: 该动词本义为“出来”；与“角”搭配时，“长出”在现代汉语中自然，并保留从某一来源出现的图像。
- source_word: קֶרֶן אַחַת מִצְּעִירָה
  choice: 一只小角
  rationale: 保留启示性异象中的“角”这一象征，不在正文中解释为君王或政权；מִצְּעִירָה表达微小，译为“小”。
- source_word: וַתִּגְדַּל יֶתֶר
  choice: 这角变得极其强大
  rationale: גדל可指变大或变强，יתר加强程度。语境涉及角的势力扩张，译为“变得极其强大”兼顾增长和权势含义。
- source_word: אֶל הַנֶּגֶב
  choice: 向南
  rationale: 在与东方及荣美之地并列的地理序列中，נֶגֶב最自然地表示南方。
- source_word: וְאֶל הַמִּזְרָח
  choice: 向东
  rationale: מִזְרָח通常指东方；此处为方向表达。
- source_word: וְאֶל הַצְּבִי
  choice: 向那荣美之地
  rationale: צְבִי含美丽、荣美、可喜爱之意；保留其描述性称号，不直接替换为“以色列地”。“那”体现定冠词。
theological_decisions:
- issue: 是否在正文中把异象的“角”解释为君王、王国或权势
  choice: 保留“角”的象征图像
  alternative: 译作“一个君王”“一个政权”或“一个王国”
  rationale: 希伯来文在本节使用象征性语言；直接解释会超出翻译范围，并提前消解异象本身的张力。
- issue: הַצְּבִי是否应直接解释为以色列地
  choice: 译作“那荣美之地”，并以脚注说明可能所指
  alternative: 直接译作“以色列地”，或译作“美地”“可喜爱之地”
  rationale: 原文使用描述性称号而非地名。正文保留该表达，脚注提供语义范围和可能指向。
- issue: וַתִּגְדַּל יֶתֶר主要表达体积增长还是势力增强
  choice: 译作“变得极其强大”
  alternative: “长得极其高大”或“越来越大”
  rationale: “角”在异象中兼具形象和权势象征；“强大”符合语境，但不进一步指定其历史身份。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“一只小角”保留异象图像；“向南、向东，并向……”使三个方向清楚并列。“扩展”补足汉语中方向短语与“变得强大”的关系，但不增加具体征服方式。
