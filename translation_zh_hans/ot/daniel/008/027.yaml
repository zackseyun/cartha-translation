base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/027.yaml
  text: And I[a], Daniel, was overcome and was sick for days. Then I rose and did the king’s work, but I was appalled by the vision, and there was no one who understood it.
translation:
  language: zh_hans
  text: 我但以理精疲力竭，病了几天。随后我起来，办理王的事务。我因这异象而惊骇，却无人明白这异象[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“但我不明白这异象。”希伯来文的表达很简略，既可理解为“无人明白这异象”，也可理解为但以理本人“不明白这异象”。
    reason: alternative_reading
lexical_decisions:
- source_word: נִהְיֵיתִי
  choice: 精疲力竭
  rationale: 这里的 היה 表示异象之后陷入的一种结果状态，并非单纯的“存在”。“精疲力竭”自然地表达但以理身心耗尽的情形，又不把它明确限定为昏厥。
- source_word: נֶחֱלֵיתִי
  choice: 病了
  rationale: חלה 的尼法勒词形通常表示患病或变得虚弱；结合后面的时间短语，“病了”是简明自然的表达。
- source_word: יָמִים
  choice: 好些天
  rationale: 复数“日子”在此表示一段未明确长短的时间。“好些天”符合现代汉语，同时没有具体规定天数。
- source_word: וָאָקוּם
  choice: 后来我起来
  rationale: 连续式推动叙事向前，表示但以理经过患病后起身恢复活动；“后来”自然呈现事件次序。
- source_word: וָאֶעֱשֶׂה אֶת־מְלֶאכֶת הַמֶּלֶךְ
  choice: 办理王的事务
  rationale: מְלָאכָה 可指工作、任务或事务。此处指但以理恢复履行王室职责，“办理王的事务”既忠实又符合现代汉语。
- source_word: וָאֶשְׁתּוֹמֵם
  choice: 感到震惊
  rationale: 该词形表达因所见而惊愕、骇然或茫然的强烈反应。“感到震惊”比一般的“惊讶”更有力度，又避免加入原文没有明确说明的情绪。
- source_word: הַמַּרְאֶה
  choice: 这异象
  rationale: 在《但以理书》的启示语境中，מַרְאֶה 指所见的异象，而不只是外观；中文用“这异象”也能清楚回指上文。
- source_word: וְאֵין מֵבִין
  choice: 却没有人明白这事
  rationale: 原文是简略的存在句，分词没有明说主语，直译近于“没有明白的”。正文采用非人称理解，即无人明白；为使中文完整，以“这事”回指异象。可能指但以理本人不明白的读法保留在脚注中。
theological_decisions:
- issue: וְאֵין מֵבִין 的主语
  choice: 非人称／存在句：“却没有人明白这事”
  alternative: 个人读法：“但我不明白这事”
  rationale: 马所拉文本没有第一人称代词，形式上更直接地支持“没有明白的人”。不过上下文集中描述但以理本人的反应，因此以他为隐含主语也有可能；脚注保留这一歧义，不作教义化裁断。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以短句呈现叙事推进；“精疲力竭”“病了”“办理王的事务”兼顾原文力度与自然汉语。正文保留结尾希伯来文的主语歧义，并用脚注说明另一种合理读法。
