  text: וּ/בְ/דַבְּר֣/וֹ עִמִּ֔/י נִרְדַּ֥מְתִּי עַל פָּנַ֖/י אָ֑רְצָ/ה וַ/יִּ֨גַּע בִּ֔/י וַ/יַּֽעֲמִידֵ֖/נִי עַל עָמְדִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/018.yaml
  text: And while he was speaking with me[a], I fell into a deep sleep with my face to the ground[b]; but he touched me and made me stand up where I had been standing.
translation:
  language: zh_hans
  text: 他正和我说话时，我脸朝地，昏睡过去[a]；他触摸我，使我重新站立在原处[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“我昏睡了过去”或“我陷入沉睡般的恍惚中”。希伯来语描述人陷入深沉的睡眠或昏沉状态。
    reason: lexical_alternative
  - marker: b
    text: 直译作“使我站在我的站立处”。这句话可能指使我重新站立，也可能指使我回到原先所在的位置。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְדַבְּרוֹ עִמִּי
  choice: 他正和我说话的时候
  rationale: בְּ加不定词构造表达时间背景；“正……的时候”保留动作持续之意。עִם通常意为“和、与”，故译作“和我说话”，而非只译“对我说话”。
- source_word: נִרְדַּמְתִּי
  choice: 沉睡了过去
  rationale: רדם的尼法勒式表示陷入沉睡或昏沉状态；此译体现状态的开始，同时不采用带有专门神学含义的“入定”或“出神”。
- source_word: עַל־פָּנַי אָרְצָה
  choice: 面伏于地
  rationale: 原文直指“脸朝地”的姿势；“面伏于地”简洁、庄重，也符合现代汉语叙事。
- source_word: וַיִּגַּע בִּי
  choice: 他却触摸我
  rationale: נגע与ב连用通常表示触摸；“却”承接前句倒地沉睡与随后被扶起之间的转折，不增加动作强度。
- source_word: וַיַּעֲמִידֵנִי עַל־עָמְדִי
  choice: 使我站回原处
  rationale: 使役式וַיַּעֲמִידֵנִי表示“使我站立”；עַל־עָמְדִי字面近于“在我的站立处/站立状态上”。“站回原处”保留恢复站立及回到原有位置的可能含义，避免无原文对应的“站在脚上”。
theological_decisions:
- issue: 但以理在异象中的状态
  choice: 译为陷入沉睡，不将其定性为专门意义上的出神状态
  alternative: 昏睡、恍惚、进入出神状态
  rationale: רדם可描述沉睡或类似昏沉的状态，但经文本身没有要求使用技术性的宗教术语；正文采用自然叙述，脚注保留词义范围。
- issue: עַל־עָמְדִי所指的是站立状态还是原先所站之处
  choice: 正文译“站回原处”，兼顾恢复站立与位置含义
  alternative: 使我站起来；使我站稳；使我站在原先所站之处
  rationale: 希伯来表达高度凝缩，既可着重重新站立，也可能涉及站立之处。译文不将其中一面绝对化，并用脚注说明字面形式。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“面伏于地”保留经文的肃穆感；“沉睡了过去”比“睡着了”更能表达原文的深沉或昏沉状态。所有词义与神学歧义均在正文或脚注中保留。
