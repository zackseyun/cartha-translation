- from: 他正和我说话的时候，我面伏于地，沉睡了过去[a]；他却触摸我，使我站回原处[b]。
  to: 他正和我说话时，我脸朝地，昏睡过去[a]；他触摸我，使我重新站立在原处[b]。
  rationale: 修订使汉语叙事更自然，并更紧密地把“脸朝地”与昏睡时的姿态相连。删除无明确原文锚点的转折词“却”。“重新站立在原处”保留使役动词的力量及 עַל־עָמְדִי 所涉及的恢复站立与位置的可能性；脚注明确保留该短语的歧义。
