id: DAN.8.26
reference: Daniel 8:26
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וּ/מַרְאֵ֨ה הָ/עֶ֧רֶב וְ/הַ/בֹּ֛קֶר אֲשֶׁ֥ר נֶאֱמַ֖ר אֱמֶ֣ת ה֑וּא וְ/אַתָּה֙ סְתֹ֣ם הֶֽ/חָז֔וֹן כִּ֖י לְ/יָמִ֥ים רַבִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/026.yaml
  text: And the vision of the evening and the morning that was spoken is true; but you, seal up the vision, for it concerns many days from now.
translation:
  language: zh_hans
  text: 所说那关于晚上和早晨的异象是真的。至于你，要封住这异象，因为它关乎许多日子以后的事。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַרְאֵה הָעֶרֶב וְהַבֹּקֶר
  choice: 关于晚上和早晨的异象
  rationale: 保留原文“晚上和早晨”的措辞，并用“关于”自然表达该异象所涉及的内容，不进一步解释其象征意义。
- source_word: אֱמֶת הוּא
  choice: 是真的
  rationale: 直接传达“它是真实的／可靠的”，现代汉语中“是真的”简明自然。
- source_word: סְתֹם
  choice: 封住
  rationale: 该动词可指封闭、封存；“封住”既贴近原文，也保留异象暂不公开或妥善保存之间的张力。
- source_word: לְיָמִים רַבִּים
  choice: 关乎许多日子以后的事
  rationale: 原文简略为“到／为许多日子”；按语境表达其指向遥远的将来，同时保留“许多日子”的原有意象。
theological_decisions:
- issue: “封住异象”的具体含义
  choice: 不解释封住是保密、保存，还是确认其权威
  alternative: 译为“把异象隐藏起来”或“把异象封存起来”
  rationale: 原词容许相关含义，正文采用较宽泛的“封住”，避免加入特定末世论解释。
- issue: “许多日子”的时间指向
  choice: 译作“许多日子以后”，表达异象关乎遥远将来
  alternative: 较直译为“因为还要许多日子”
  rationale: 上下文显示此异象并非近期应验，但原文没有给出精确期限，因此不作更具体说明。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语；句式保留原文先确认异象真实、再吩咐但以理封住异象的结构。
