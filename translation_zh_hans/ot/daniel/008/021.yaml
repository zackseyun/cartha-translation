base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/021.yaml
  text: And the shaggy male goat is the king of Greece[b][a], and the great horn that is between his eyes is the first king.
translation:
  language: zh_hans
  text: 那只多毛的公山羊就是希腊的王[a][b]；它两眼之间的那根大角就是第一位君王。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “多毛的公山羊”也可译作“公山羊”或“山羊”。希伯来语的说法更形象，特意描写这只公山羊毛发浓密。
    reason: lexical_alternative
  - marker: b
    text: “希腊”希伯来文作“雅完”，这里通常指希腊或希腊势力。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצָּפִיר הַשָּׂעִיר
  choice: 长毛的公山羊
  rationale: 两个希伯来词合起来既指公山羊，也突出其多毛、长毛的外观；译作“长毛的公山羊”保留了原文鲜明的描写，同时符合现代汉语表达。
- source_word: מֶלֶךְ יָוָן
  choice: 希腊的王
  rationale: יָוָן在本处指希腊或希腊势力；מֶלֶךְ是单数的“王”，因此保留个人性称谓，不改译为“希腊国”。
- source_word: הַקֶּרֶן הַגְּדוֹלָה
  choice: 那根大角
  rationale: “大角”简洁保留了象征形象中角的大小和显著性；量词“根”使中文自然。
- source_word: אֲשֶׁר בֵּין עֵינָיו
  choice: 它两眼之间的
  rationale: 希伯来语为关系从句，且阳性单数后缀回指公山羊；中文用“它”自然指称动物，并以定语结构流畅表达位置。
- source_word: הוּא הַמֶּלֶךְ הָרִאשׁוֹן
  choice: 就是第一位王
  rationale: רִאשׁוֹן在此表示次序上的“第一”；继续译作“王”与本节前半句一致，“就是”体现原文强调性的代词系词结构。
theological_decisions:
- issue: 公山羊和大角所代表的对象
  choice: 公山羊代表希腊的王，大角代表第一位王。
  alternative: 把公山羊理解为整体的希腊王国。
  rationale: 原文明确使用מֶלֶךְ יָוָן“希腊的王”，随后又称大角为“第一位王”。译文保留经文本身在象征解释中的措辞与张力，不在正文中加入具体历史人物的身份。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。以分号对应原文两个并列解释句；用“那……就是……”清楚呈现异象符号与其所指对象之间的对应关系。
