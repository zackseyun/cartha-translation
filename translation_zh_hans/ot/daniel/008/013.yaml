source:
  edition: WLC
  text: וָ/אֶשְׁמְעָ֥/ה אֶֽחָד קָד֖וֹשׁ מְדַבֵּ֑ר וַ/יֹּאמֶר֩ אֶחָ֨ד קָד֜וֹשׁ לַ/פַּֽלְמוֹנִ֣י הַֽ/מְדַבֵּ֗ר עַד מָתַ֞י הֶ/חָז֤וֹן הַ/תָּמִיד֙ וְ/הַ/פֶּ֣שַׁע שֹׁמֵ֔ם תֵּ֛ת וְ/קֹ֥דֶשׁ וְ/צָבָ֖א מִרְמָֽס־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/013.yaml
  text: Then I heard a holy one speaking[a], and one holy one said to the one speaking, “How long is the vision concerning the regular burnt offering and the desolating transgression[d][c][b], and the giving over of both the sanctuary and the host to be trampled?”
translation:
  language: zh_hans
  text: 于是，我听见一位圣者说话；另一位圣者对那位说话的[a]说：“这有关常献的祭[b]、使荒凉的罪过[c]，以及圣所和军旅[d]被交出、任人践踏的异象，要到几时呢？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “那位”所对应的希伯来语 לַפַּלְמוֹנִי 意义不确定；也可能译作“某位”，或把它视为名称或称号，译作“帕勒莫尼——那位说话的”。
    reason: alternative_reading
  - marker: b
    text: 传统译作“每日的祭”。希伯来语指圣所礼仪中按例、持续献上的祭。
    reason: lexical_alternative
  - marker: c
    text: 也可译作“荒凉的罪过”或“那使荒凉的罪过”。
    reason: lexical_alternative
  - marker: d
    text: “军旅”可能指与圣所有关的民众、一支军队、天军或其他集体；此处希伯来语没有完全明确。
    reason: lexical_alternative
lexical_decisions:
- source_word: קָדוֹשׁ
  choice: 圣者
  rationale: 在异象语境中指属天的圣洁存在；“圣者”保留原文称谓，又不在正文中进一步限定为“天使”或人间圣徒。
- source_word: לַפַּלְמוֹנִי
  choice: 那位
  rationale: 该词意义隐晦，可能是不定或特指某位交谈者，也可能是名称或称号；正文以自然的泛称处理，其他可能见脚注。
- source_word: הַמְדַבֵּר
  choice: 说话的
  rationale: 对应分词，指当时正在说话的那一位，与前文自然衔接。
- source_word: הֶחָזוֹן
  choice: 这异象所显的
  rationale: 后续成分说明异象的内容；“所显的”在中文中自然表达这种关联，同时不把问题仅限于异象本身的时长。
- source_word: הַתָּמִיד
  choice: 常献祭
  rationale: 指圣所礼仪中持续按例献上的祭，中文采用简洁且具有礼仪含义的传统表达；并以脚注说明其范围。
- source_word: הַפֶּשַׁע שֹׁמֵם
  choice: 那使地荒凉的罪过
  rationale: 将 שֹׁמֵם 理解为表达使荒凉之作用，保留“罪过”与“荒凉”之间的紧密关系；原文也可译作更凝缩的“荒凉的罪过”。
- source_word: תֵּת
  choice: 被交出
  rationale: 以被动表达圣所和众军遭交付、任凭践踏的意思，符合中文问句结构。
- source_word: קֹדֶשׁ
  choice: 圣所
  rationale: 在圣殿和献祭语境中指具体的神圣场所，而非抽象的“圣洁”。
- source_word: צָבָא
  choice: 众军
  rationale: 保留其集合性和军事色彩，不在正文中断定是与圣所有关的百姓、军队或天军；歧义见脚注。
- source_word: מִרְמָס
  choice: 遭受践踏
  rationale: 将表示践踏的名词自然地转为中文动词结构，保留受凌辱、被蹂躏之意。
theological_decisions:
- issue: “圣者”的身份
  choice: 正文保留“圣者”，语境上理解为属天的圣洁存在
  alternative: 人间的圣徒；直接译作“天使”
  rationale: 但以理异象中的发言者最自然地理解为属天者；然而原文没有使用“天使”一词，因此不在正文中过度明确。
- issue: צָבָא 所指
  choice: 译作“众军”，不限定具体对象
  alternative: 上帝的子民；天军；军队或其他群体
  rationale: 该词在本节所指存在争议，保留较宽泛的译法可避免消除经文本身的解释张力。
- issue: 问题所问的持续范围
  choice: 将常献祭、使地荒凉的罪过，以及圣所和众军被交出践踏并列为异象内容
  alternative: 把“常献祭”理解为被除掉的祭，或把后半句完全作为“罪过”的结果从属处理
  rationale: 原文结构高度凝缩，正文保留各项的并列关系，不补入原文未明说的“废除”等动作。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“于是，我听见”承接异象叙事；问句末用“要持续到什么时候呢”自然表达 עַד מָתַי。正文保留“圣者”“众军”等关键歧义，并以脚注交代重要替代读法。
