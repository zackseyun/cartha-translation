- from: 至于那折断的角，四个角起来取代了它，意思是将有四个国从那国中兴起，却没有先前那角的力量。[a]
  to: 至于那被折断的角，四个角在它的位置上兴起：将有四个国从那国兴起，却不具备原有的力量。[a]
  rationale: 修改“四个角起来取代了它”为“四个角在它的位置上兴起”，更直接对应原文的空间／继承表达，也更合乎现代汉语。以冒号呈现异象与解释的对应关系。末句改为“不具备原有的力量”，避免在正文中预先裁定阳性后缀究竟指王还是与原角相关的原有权势；脚注保留指第一位王的自然读法。
