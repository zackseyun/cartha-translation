  text: וְ/הַ֨/נִּשְׁבֶּ֔רֶת וַ/תַּֽעֲמֹ֥דְנָה אַרְבַּ֖ע תַּחְתֶּ֑י/הָ אַרְבַּ֧ע מַלְכֻי֛וֹת מִ/גּ֥וֹי יַעֲמֹ֖דְנָה וְ/לֹ֥א בְ/כֹחֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/022.yaml
  text: 'And as for the broken horn[a], in whose place four arose: four kingdoms will arise from that nation, but not with its power.'
translation:
  language: zh_hans
  text: 至于那被折断的角，四个角在它的位置上兴起：将有四个国从那国兴起，却不具备原有的力量。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“却没有他的力量”，指那被折断的角所代表的第一位王的力量。
    reason: 保留原文阳性单数后缀可能直接指向第一位王的读法。
lexical_decisions:
- source_word: וְהַנִּשְׁבֶּרֶת
  choice: 至于那折断的角
  rationale: 阴性单数分词“折断的”承接上一节阴性名词“角”；汉语补出“角”以明确所指。“至于”体现解释异象时转换话题的语气。
- source_word: וַתַּעֲמֹדְנָה אַרְבַּע תַּחְתֶּיהָ
  choice: 四个角起来取代了它
  rationale: עמד在此表示兴起、掌权；“取代了它”自然表达“在它的位置上”。原文省略“四个”所修饰的名词，依据异象语境补出“角”。
- source_word: אַרְבַּע מַלְכֻיּוֹת
  choice: 四个国
  rationale: מַלְכוּת可指王权、统治或王国；在这里指由该国分出的继承政权，译作“四个国”简明自然。
- source_word: מִגּוֹי
  choice: 从那国中
  rationale: גּוֹי意为国家、民族；“那国”回指上文所述的希腊国，同时不在正文中加入原文未明说的历史名称。
- source_word: יַעֲמֹדְנָה
  choice: 兴起
  rationale: 此处עמד描述政治实体出现并取得地位，“兴起”符合现代汉语的预言文体。
- source_word: וְלֹא בְכֹחוֹ
  choice: 却没有先前那角的力量
  rationale: כֹּחַ指力量、权势。阳性单数后缀很可能回指先前由那角象征的王；正文沿用异象的象征表达，以“先前那角”明确比较对象，同时在脚注保留人格化译法。
theological_decisions:
- issue: וְלֹא בְכֹחוֹ末尾代词后缀的所指
  choice: 理解为后来四国不具备先前那角所代表的力量
  alternative: “却没有他的力量”，即没有第一位王的力量
  rationale: “角”与其所代表的王在异象解释中紧密相连。正文保留“角”的象征层面，不指名某位历史人物；脚注则保留阳性后缀所支持的人格化理解。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“意思是”明确后半句是在解释异象；“国”比“王权”更易懂，也符合此处政治实体的语境。脚注标记放在存在歧义的末句之后。
