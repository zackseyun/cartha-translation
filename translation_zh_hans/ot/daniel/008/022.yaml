  naturalness: “四个角起来取代了它”在现代汉语中稍显生硬；“四个角在它的位置上兴起”更符合庄重、自然的经文语体。“意思是”可用冒号直接连接异象事实与解释，行文更凝练。
  terminology: “角”“国”“兴起”均恰当。将末句译作“不具备原有的力量”保留原文代词所指的未决性；脚注保留“他的力量”即指第一位王的可行理解。
