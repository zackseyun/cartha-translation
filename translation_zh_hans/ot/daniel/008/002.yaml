base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/002.yaml
  text: And I saw in the vision[a], and when I saw, I was in Susa the citadel, which is in the province of Elam; and I saw in the vision that I was beside the Ulai Canal.
translation:
  language: zh_hans
  text: 我在异象中观看；正观看的时候，我在以拦省的书珊城堡；我在异象中看见，自己在乌莱水道[a]旁。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “水道”也可译作“乌莱河”“乌莱溪”或“乌莱运河”。原文所用词可泛指水流通道；按书珊附近的地理环境，可能指人工渠道。
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶרְאֶה
  choice: 我……观看／我……看见
  rationale: ראה在叙事中表示视觉经验。首处译作“观看”以配合持续进入异象的语境，第二处译作“看见”，自然引出所见内容，同时保留原文两次重复。
- source_word: בֶּחָזוֹן
  choice: 在异象中
  rationale: 表示但以理所处的异象性观看情境；中文无需强行表达英语冠词区别。
- source_word: וַיְהִי בִּרְאֹתִי
  choice: 正观看的时候
  rationale: 该结构引出时间从句；省去希伯来语习语中不宜直译的“事情发生”，以自然中文表达“当我观看时”。
- source_word: בְּשׁוּשַׁן
  choice: 在……书珊
  rationale: 采用现代中文圣经地名中通行且贴近希伯来语的音译“书珊”。
- source_word: הַבִּירָה
  choice: 城堡
  rationale: בִּירָה指设防的王室或行政中心；“城堡”兼顾防御建筑与行政中心的含义，且不窄化为单纯“宫殿”。
- source_word: אֲשֶׁר בְּעֵילָם הַמְּדִינָה
  choice: 以拦省的
  rationale: 以自然简洁的中文表达书珊位于以拦这一行政区域；מְדִינָה译为“省”。
- source_word: וַאֲנִי הָיִיתִי
  choice: 自己在
  rationale: 在“看见”后以“自己在”明确这是异象中但以理所见的自身位置，又不武断判定其肉身是否实际到了当地。
- source_word: עַל
  choice: 旁
  rationale: 与水道连用时表示临近、在其边上，而非位于水面之上。
- source_word: אוּבַל
  choice: 水道
  rationale: אוּבַל泛指水流通道，在书珊环境中可能是运河；“水道”保留河流、溪流或人工渠道之间的词义开放性。
- source_word: אוּלָי
  choice: 乌莱
  rationale: 专有地名，按现代普通话音译。
theological_decisions:
- issue: 但以理是在异象中身处书珊，还是身体实际位于书珊
  choice: 用“我在异象中又看见自己在……”呈现其异象中的自我定位
  alternative: 直译为“我在书珊城堡”或解释为“我仿佛到了书珊”
  rationale: 原文重复“我在异象中看见”，随后说“我在那里”，可理解为异象内容，但句法仍保留一定张力；译文避免断言身体迁移，也不加入原文没有的“仿佛”。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。保留原文两次“在异象中观看／看见”的重复，不为追求流畅而删减；地名采用“书珊、以拦、乌莱”。
