source:
  edition: WLC
  text: וּ/צְפִ֥יר הָ/עִזִּ֖ים הִגְדִּ֣יל עַד מְאֹ֑ד וּ/כְ/עָצְמ֗/וֹ נִשְׁבְּרָה֙ הַ/קֶּ֣רֶן הַ/גְּדוֹלָ֔ה וַֽ/תַּעֲלֶ֜נָה חָז֤וּת אַרְבַּע֙ תַּחְתֶּ֔י/הָ לְ/אַרְבַּ֖ע רוּח֥וֹת הַ/שָּׁמָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/008.yaml
  text: And the male goat grew exceedingly great[a], but when he was strong, the great horn was broken[b], and in its place four conspicuous horns came up toward the four winds of heaven.
translation:
  language: zh_hans
  text: 公山羊变得极其强盛；正当它强盛时，那只大角折断了；在它的位置上[b]，长出四只显眼的角[a]，向着天的四风。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“四个显眼者”。希伯来文形容它们是可见、醒目或突出的；“角”是按上下文补出的。
    reason: lexical_alternative
  - marker: b
    text: 原文直译“在它下面”；这里的意思是“在它的位置上”或“取代它”。
    reason: lexical_alternative
lexical_decisions:
- source_word: צְפִיר הָעִזִּים
  choice: 公山羊
  rationale: 该词组明确指雄性的山羊；“公山羊”是现代汉语中自然、准确的说法。
- source_word: הִגְדִּיל עַד מְאֹד
  choice: 变得极其强盛
  rationale: הגדיל 在此表示在权势或地位上变得强大，עַד מְאֹד 加强程度；“极其强盛”既保留强化语气，也符合异象所指向的权势语境。
- source_word: וּכְעָצְמוֹ
  choice: 正当它强盛时
  rationale: 该短语带有时间意味，指它处于力量强盛之时；“正当……时”也凸显大角在鼎盛之际突然折断。
- source_word: נִשְׁבְּרָה
  choice: 折断了
  rationale: שׁבר 的被动式在这里描写角被折断；汉语以“折断了”自然表达其被动结果，并切合“角”的具体意象。
- source_word: הַקֶּרֶן הַגְּדוֹלָה
  choice: 那只大角
  rationale: 保留“角”的异象象征，不在正文中提前解释为君王或国度；“大”兼可表达形体与显赫程度。
- source_word: וַתַּעֲלֶנָה
  choice: 长了出来
  rationale: עלה 描写四者出现、升起；因主体在上下文中是角，“长了出来”在汉语中形象自然。
- source_word: חָזוּת אַרְבַּע
  choice: 四只显眼的角
  rationale: חָזוּת 在此表达可见、醒目或突出的性质；希伯来文只说“四个显眼者”，译文依上下文补出“角”，并以脚注说明。
- source_word: תַּחְתֶּיהָ
  choice: 取代它
  rationale: 该词字面为“在它下面”，但在替代语境中表示“代替它、在它的位置上”；“取代它”清楚呈现四角接替大角的关系。
- source_word: לְאַרְבַּע רוּחוֹת הַשָּׁמָיִם
  choice: 朝向天的四风
  rationale: 保留圣经异象中“四风”的空间意象，不将其直接平化为“四个方向”；介词 לְ 在此以“朝向”表达。
theological_decisions:
- issue: 正文保留象征性异象，还是直接加入历史解释
  choice: 保留“角”和“天的四风”等异象语言
  alternative: 把“角”直接译作君王或国度，把“四风”直接译作四方
  rationale: 本节以异象图景叙述，其解释应由本章后文提供；翻译不应在正文中预先指定历史实体或消除象征张力。
- issue: 四个“显眼者”的省略指代
  choice: 依上下文在正文补出“角”，并以脚注标明原文形式
  alternative: 译作“四个显眼者”，不补出所指
  rationale: 补出“角”使现代汉语清楚通顺，但脚注保留原文仅用形容性名词表达的特点及其可能译法。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。以“公山羊”“那只大角”“长了出来”维持异象的具体画面；以“极其强盛”“正当它强盛时”表达权势达到高峰的语境。两个脚注标记均置于其实际说明的词语之后，避免咨询层中标记与脚注内容错位的问题。
