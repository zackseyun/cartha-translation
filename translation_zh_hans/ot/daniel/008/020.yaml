base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/020.yaml
  text: The ram that you saw[a], the one with the two horns, is the kings of Media and Persia.
translation:
  language: zh_hans
  text: 你所看见、长着两只角的那只公绵羊，指的是米底和波斯的诸王。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“你所看见的公绵羊，那有两只角的，是米底和波斯的诸王。”原文为无明示系词的名词句。
    reason: 说明原文无明示系词的直接表述，并保留“两只角”的属性说明。
lexical_decisions:
- source_word: הָאַיִל
  choice: 那只公绵羊
  rationale: אַיִל指公绵羊；在异象语境中，“公绵羊”准确、自然。“那只”承接但以理先前所见。
- source_word: אֲשֶׁר רָאִיתָ
  choice: 你所看见的
  rationale: 关系从句修饰“公绵羊”；רָאִיתָ是ראה的Qal完成式第二人称阳性单数，此处用现代汉语“你所看见的”自然地回指异象。
- source_word: בַּעַל הַקְּרָנַיִם
  choice: 就是那有两只角的
  rationale: בַּעַל字面为“拥有者”，此处作属性说明，意为“有……的”；קְּרָנַיִם为带定冠词的双数，明确是“两只角”。
- source_word: מַלְכֵי
  choice: 诸王
  rationale: מֶלֶךְ的构造复数，表示“……的诸王”；“诸王”保留原文复数，也符合庄重的现代汉语。
- source_word: מָדַי וּפָרָס
  choice: 米底和波斯
  rationale: 采用现代中文圣经与历史叙述中通行的专名译法，保留两者的并列关系。
theological_decisions:
- issue: 无明示系词的象征解释应如何表达
  choice: 指的是米底和波斯的诸王
  alternative: 就是米底和波斯的诸王
  rationale: 希伯来文是无系词名词句，字面直接把公绵羊与诸王等同；但语境显然是在解释异象符号。“指的是”使现代汉语顺畅并表达象征与所指的关系，同时脚注保留原文更直接的表述。
- issue: “米底和波斯的诸王”的复数是否保留
  choice: 保留“诸王”
  alternative: 译为“米底和波斯王”或“米底—波斯帝国”
  rationale: 原文מַלְכֵי明确为复数；不将其统一解释成单一君王或帝国，以免消除文本本身的表达与可能的张力。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“公绵羊”准确呈现异象中的动物；“那有两只角的”以同位说明保留原句结构；正文用“指的是”清楚表达象征解释，脚注则呈现更贴近希伯来文形式的直译。
