  text: וָ/אֶשְׁמַ֥ע קוֹל אָדָ֖ם בֵּ֣ין אוּלָ֑י וַ/יִּקְרָא֙ וַ/יֹּאמַ֔ר גַּבְרִיאֵ֕ל הָבֵ֥ן לְ/הַלָּ֖ז אֶת הַ/מַּרְאֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/016.yaml
  text: And I heard the voice of a man between the banks of the Ulai[a], and he called out and said, “Gabriel[c][b], make this one understand the vision.”
translation:
  language: zh_hans
  text: 我听见一个人的声音从乌莱河两岸之间传来[a]；他呼喊说：“加百列，要使这人明白这异象。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“在乌莱之间”，也可理解为“在乌莱河两边之间”，即河道或水渠两岸之间的空间。
    reason: 原文表达简略；正文按水道语境明确其空间含义，同时以注释保留字面形式及其歧义。
lexical_decisions:
- source_word: וָאֶשְׁמַע
  choice: 我听见
  rationale: שׁמע 的第一人称单数叙事形式承接前文；汉语用“我听见”自然表达连续发生的经历，无须机械译出连接词。
- source_word: קוֹל אָדָם
  choice: 一个人的声音
  rationale: קוֹל 是“声音”，אָדָם 在此指具体的人。“一个人的声音”既保留原文的具体性，也不把身份解释得过多。
- source_word: בֵּין אוּלָי
  choice: 从乌莱河两岸之间传来
  rationale: בֵּין 的基本义是“在……之间”；结合水道语境，以“两岸之间”使空间关系在现代汉语中清楚。“传来”配合“听见声音”，自然呈现声音来源。
- source_word: וַיִּקְרָא וַיֹּאמַר
  choice: 他呼喊说
  rationale: 保留“呼喊”和“说”两个动词的作用，同时采用简洁自然的汉语引语格式。
- source_word: גַּבְרִיאֵל
  choice: 加百列
  rationale: 采用该人名在现代汉语圣经传统中通行且易识别的音译。
- source_word: הָבֵן
  choice: 要使……明白
  rationale: 这是 בין 的使役式命令语气，意为使对方理解，而非命令加百列自己去理解。
- source_word: לְהַלָּז
  choice: 这人
  rationale: 该指示语指场景中的但以理；“这人”自然、简洁，并保留具体的人称指向。
- source_word: אֶת הַמַּרְאֶה
  choice: 这异象
  rationale: מַרְאֶה 可指所见景象或异象；在本章启示性语境中译作“异象”最贴切，指示词“这”使汉语所指明确。
theological_decisions:
- issue: אָדָם 与 לְהַלָּז 所指对象的表达
  choice: 分别译为“一个人”和“这人”
  alternative: “人的声音”与“这一个”
  rationale: 上下文指向具体人物；采用自然的具体称呼，不把 אָדָם 泛化为抽象的“人类”，也不为指示语加入身份或神学解释。
- issue: 命令 הָבֵן 的使役意义
  choice: “要使这人明白”
  alternative: “你要明白”或“向这人解释”
  rationale: 保留希伯来语使役式的核心意义，同时不把“使其明白”缩减为仅仅“解释”。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“乌莱河”说明该专名在此为水道；“呼喊说”保留原文双动词；全句避免生硬照搬希伯来语词序。
