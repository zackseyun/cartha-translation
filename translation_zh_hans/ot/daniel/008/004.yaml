  text: רָאִ֣יתִי אֶת הָ/אַ֡יִל מְנַגֵּחַ֩ יָ֨מָּ/ה וְ/צָפ֜וֹנָ/ה וָ/נֶ֗גְבָּ/ה וְ/כָל חַיּוֹת֙ לֹֽא יַֽעַמְד֣וּ לְ/פָנָ֔י/ו וְ/אֵ֥ין מַצִּ֖יל מִ/יָּד֑/וֹ וְ/עָשָׂ֥ה כִ/רְצֹנ֖/וֹ וְ/הִגְדִּֽיל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/004.yaml
  text: I saw the ram charging westward and northward and southward[a], and no beasts could stand before him, and there was no one who could rescue from his hand. He did as he pleased and became great.
translation:
  language: zh_hans
  text: 我看见那只公绵羊向西、向北、向南冲撞。没有任何兽能在它面前站立，也没有人能把谁从它手中救出来。它任意而行，强盛起来[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“自高”或“日益强大”。希伯来文既可表示变得强大，也可表示使自己显为强大。
    reason: 词义存在一般结果义与反身使动义两种可能，正文不宜消除这一歧义。
lexical_decisions:
- source_word: רָאִיתִי
  choice: 我看见
  rationale: ראה的Qal完成式第一人称单数在此用于叙事，直接译为“我看见”，自然并忠实。
- source_word: הָאַיִל
  choice: 那只公绵羊
  rationale: אַיִל指公绵羊；定冠词表明这是异象中已经出现的特定对象，中文用“那只”明确指称。
- source_word: מְנַגֵּחַ
  choice: 冲撞
  rationale: נגח的分词描写有角动物用角猛力攻击；“冲撞”既保留公绵羊的动作形象，也符合现代汉语。
- source_word: יָמָּה וְצָפוֹנָה וָנֶגְבָּה
  choice: 向西、向北、向南
  rationale: 三个词的方向词尾都表示朝某方向运动，中文用“向”准确传达。
- source_word: וְכָל חַיּוֹת לֹא יַעַמְדוּ לְפָנָיו
  choice: 没有任何兽能在它面前站立
  rationale: חַיּוֹת在异象语境中指兽类；否定式与未完成式在此表达无力抗衡。“在它面前站立”保留原文意象，同时“能”传达能力含义。
- source_word: וְאֵין מַצִּיל מִיָּדוֹ
  choice: 也没有谁能从它手中搭救
  rationale: Hiphil分词מַצִּיל表示施行搭救者，原文未明说被救对象；中文保留这一省略。“从它手中”保留以“手”表示权势或控制的希伯来语意象。
- source_word: וְעָשָׂה כִרְצֹנוֹ
  choice: 它任意而行
  rationale: 该短语表示按自己的意愿行事；“任意而行”简洁、庄重，并保留自主行事的语气。
- source_word: וְהִגְדִּיל
  choice: 强盛起来
  rationale: גדל的Hiphil在此可表达变得强大，也可能带有使自己尊大的意味。“强盛起来”贴合前文扩张得胜的结果，同时不把反身和道德色彩写死。
theological_decisions:
- issue: וְהִגְדִּיל应译为一般性的“变得强盛”，还是反身性的“抬高自己”
  choice: 强盛起来
  alternative: 抬高自己；日益强大
  rationale: 希伯来文没有明示反身代词，紧接的语境着重公绵羊势力扩张、行动无阻。“强盛起来”保留其壮大之意，而脚注交代可能的反身理解，避免过早加入更强的道德评断。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“公绵羊”“冲撞”维持异象的动物形象；“在它面前站立”“从它手中”适度保留原文惯用意象。脚注标记置于其实际说明的末句之后。
