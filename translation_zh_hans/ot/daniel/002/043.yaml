  text: די חֲזַ֗יְתָ פַּרְזְלָ/א֙ מְעָרַב֙ בַּ/חֲסַ֣ף טִינָ֔/א מִתְעָרְבִ֤ין לֶהֱוֺן֙ בִּ/זְרַ֣ע אֲנָשָׁ֔/א וְ/לָֽא לֶהֱוֺ֥ן דָּבְקִ֖ין דְּנָ֣ה עִם דְּנָ֑ה הֵֽא כְ/דִ֣י פַרְזְלָ֔/א לָ֥א מִתְעָרַ֖ב עִם חַסְפָּֽ/א־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/043.yaml
  text: As you saw the iron mixed with clay[a], they will mix themselves with the seed of man, but they will not hold together, this one with that one[c][b], just as iron does not mix with pottery.
translation:
  language: zh_hans
  text: 你既看见铁与泥[a]混合，他们也将与人的后裔混合；但彼此不能黏合[b]，正如铁不能与陶器[c]混合一样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“陶泥”。
    reason: חֲסַף טִינָא 可指泥、制陶用的黏土或陶质材料。
  - marker: b
    text: 直译：“这个与那个不能黏合。”
    reason: 保留 דְּנָה עִם דְּנָה 的字面表达及其分属不同部分的意味。
  - marker: c
    text: “陶器”也可译作“陶土”或“泥土”。
    reason: חַסְפָּא 的语义范围包括陶器、陶土及陶质材料。
lexical_decisions:
- source_word: חֲזַיְתָ
  choice: 你既看见
  rationale: 这是阿رام语第二人称阳性单数完成式，指尼布甲尼撒在异象中所见；“你既看见”自然承接前文，并引出解释。
- source_word: פַּרְזְלָא
  choice: 铁
  rationale: 该词通常指铁，与本章巨像的材质意象一致。
- source_word: חֲסַף טִינָא
  choice: 泥
  rationale: 这一组合词指泥或制陶用的黏土；正文用“泥”简洁呈现材质，同时与句末较具体的“陶土”有所区别。
- source_word: מִתְעָרְבִין לֶהֱוֺן
  choice: 将……混合
  rationale: 该结构表达将要发生的掺混。现代汉语中“他们也将与……混合”已自然包含主体参与其中的意义，无须生硬地译作“将自己混合”。
- source_word: בִּזְרַע אֲנָשָׁא
  choice: 与人的后裔
  rationale: 原文直译近于“与人的种子”。“人的后裔”保留繁衍、血统的意象及所指的含混性，又比“人的种子”更符合现代汉语。
- source_word: דָּבְקִין
  choice: 黏合
  rationale: 该动词指黏住、附着或结合；“黏合”既呼应铁与陶土的物质比喻，也表达彼此无法牢固结合。
- source_word: דְּנָה עִם דְּנָה
  choice: 彼此
  rationale: 原文为“这个与那个”，具有相互、分属不同部分的意味；汉语“彼此”简洁而准确。
- source_word: הֵא כְדִי
  choice: 正如……一样
  rationale: 自然引出作为依据的比较。
- source_word: חַסְפָּא
  choice: 陶土
  rationale: 该词可指陶土、陶器或陶质材料。“陶土”既保留与前文泥土意象的联系，也与铁形成清楚的材质对照；脚注注明其他可能译法。
theological_decisions:
- issue: “他们将与人的后裔混合”的解释
  choice: 保留“他们”的未明指代，并以“与人的后裔混合”维持原文的含混性。
  alternative: 译作“他们将彼此通婚”，或明确解释为君王与平民、不同王国或某类超自然存在的结合。
  rationale: 原文没有明确说明“他们”是谁，也没有直接使用“通婚”一词。译文不把这一难解短语限定为某一种历史或末世论解释。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“人的后裔”刻意保留原文“人的种子”所含的血统意象及解释空间；不将其直接改写为“通婚”。所有脚注标记均置于正文对应词语之后。
