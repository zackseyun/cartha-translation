base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/032.yaml
  text: That image—its head was of fine gold[a], its chest and its arms of silver[c][b], its belly and its thighs of bronze.
translation:
  language: zh_hans
  text: 那像[a]的头是精金[b]，胸膛和双臂是银，腹部和大腿是铜[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“那雕像”。亚兰语“צַלְמָא”可指形像，也可指雕像。
    reason: lexical_alternative
  - marker: b
    text: 直译“好金”，意思是优质的金；也可译“纯金”。
    reason: lexical_alternative
  - marker: c
    text: 或译“青铜”。亚兰语“נְחָשׁ”在此类语境中常指青铜，但古代铜与铜合金的名称可能有所重叠。
    reason: lexical_alternative
lexical_decisions:
- source_word: צַלְמָא
  choice: 像
  rationale: 该亚兰语词可指形像或雕像；此处指梦中具有人体各部分的像。“像”保留原词较宽的语义，“雕像”亦可。
- source_word: רֵאשֵׁהּ
  choice: 它的头
  rationale: 按附着代词直译为“它的头”；汉语正文用“那像的头”自然承接上文。
- source_word: דִּי
  choice: 是
  rationale: 此处关系词连接身体部位与构成材料；现代汉语以“是”表达材料构成最自然，无须逐项译出关系结构。
- source_word: דְהַב טָב
  choice: 精金
  rationale: 字面为“好金”，意指优质金；“精金”简洁、庄重，又不必武断限定为现代技术意义上的纯金。
- source_word: חֲדוֹהִי
  choice: 胸膛
  rationale: 指躯干前部或胸部；“胸膛”在现代汉语中自然清楚。
- source_word: דְרָעוֹהִי
  choice: 双臂
  rationale: 原文为复数“它的臂”；“双臂”符合人体形像的自然表达。
- source_word: כְסַף
  choice: 银
  rationale: 直接对应银这种材料。
- source_word: מְעוֹהִי
  choice: 腹部
  rationale: 该词可指腹部、肚腹或内脏区域；在身体部位的顺序中，“腹部”准确且得体。
- source_word: יַרְכָתֵהּ
  choice: 大腿
  rationale: 可指大腿、腰胯或身体两侧；此处按人体部位次序译为“大腿”，同时保留复数语意。
- source_word: נְחָשׁ
  choice: 铜
  rationale: 该古代金属名称可涵盖铜或青铜，语义范围有所重叠；中文传统和自然用语可概括译作“铜”，脚注说明“青铜”的可能。
- source_word: הוּא
  choice: 那
  rationale: 该代词回指前文已经提到的梦中之像，译为“那像”符合篇章指代。
