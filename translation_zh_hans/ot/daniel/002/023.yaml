id: DAN.2.23
reference: Daniel 2:23
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: לָ֣/ךְ אֱלָ֣הּ אֲבָהָתִ֗/י מְהוֹדֵ֤א וּ/מְשַׁבַּח֙ אֲנָ֔ה דִּ֧י חָכְמְתָ֛/א וּ/גְבוּרְתָ֖/א יְהַ֣בְתְּ לִ֑/י וּ/כְעַ֤ן הֽוֹדַעְתַּ֨/נִי֙ דִּֽי בְעֵ֣ינָא מִנָּ֔/ךְ דִּֽי מִלַּ֥ת מַלְכָּ֖/א הוֹדַעְתֶּֽ/נָא׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/023.yaml
  text: To you[a], O God of my fathers, I give thanks and praise, because you have given me wisdom and might, and now you have made known to me what we requested from you[c][b], for you have made known to us the king’s matter.
translation:
  language: zh_hans
  text: 我列祖的上帝啊，我感谢你，赞美你，因为你赐给我智慧和能力；如今，你使我知道了我们向你所求的事，因为你已使我们知道王的事[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “王的事”也可译作“王的话”或“王的事项”；这里指王所提出的那件事。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלָהּ אֲבָהָתִי
  choice: 我的列祖之上帝
  rationale: 字面为“我列祖的上帝”。“列祖”既保留家族与历史延续的表达，也符合现代中文圣经语体；“上帝”清楚、庄重。
- source_word: מְהוֹדֵא וּמְשַׁבַּח אֲנָה
  choice: 我感谢你，赞美你
  rationale: 两个并列分词与第一人称代词共同构成陈述；分别译出“感谢”和“赞美”，保持原文的两项行动。
- source_word: חָכְמְתָא וּגְבוּרְתָא
  choice: 智慧和能力
  rationale: חָכְמְתָא 为“智慧”；גְבוּרְתָא 可指力量、能力或权能。此处说上帝赐给但以理解决危机所需的本领，“能力”自然且不局限于体力。
- source_word: יְהַבְתְּ לִי
  choice: 你赐给我
  rationale: “赐给”适合上帝作为施予者的语境，并准确保留第一人称单数受词。
- source_word: וּכְעַן
  choice: 如今，你又
  rationale: “如今”标示从先前的赐予转到眼前的启示；“又”自然衔接两项恩惠。
- source_word: הוֹדַעְתַּנִי
  choice: 你又使我知道了
  rationale: 使役词形直译为“使我知道”，并保留此处第一人称单数。
- source_word: דִּי בְעֵינָא מִנָּךְ
  choice: 我们向你所求的事
  rationale: בְעֵינָא 是第一人称复数，必须译出“我们”；“所求的事”简洁表达向上帝寻求或请求的内容。
- source_word: מִלַּת מַלְכָּא
  choice: 王的事
  rationale: מִלָּה 语义宽泛，可指话语、事情或事项。译作“王的事”保留宽度，不在本节中额外限定为梦或梦的解释。
- source_word: הוֹדַעְתֶּנָא
  choice: 你已使我们知道
  rationale: 保留第一人称复数后缀，与前面的“我们所求”呼应，不把群体性改成单数。
theological_decisions:
- issue: 对上帝的祖先性称呼
  choice: 我的列祖之上帝
  alternative: 我祖先的上帝
  rationale: “列祖”较贴近复数“父辈”，并保留但以理与先辈信仰历史的联系，同时不增添原文没有明说的教义内容。
- issue: 后半节单复数人称的转换
  choice: 使我知道……我们所求……使我们知道
  alternative: 统一译为单数或复数
  rationale: 亚兰文明确先用第一人称单数，随后两次使用第一人称复数。照原样保留转换，显出但以理个人领受与同伴共同祈求之间的张力。
- issue: “王的事”的具体所指
  choice: 不具体化，译作“王的事”
  alternative: 王的梦及其解释
  rationale: 上下文可说明其所指，但本节的 מִלָּה 本身较宽泛；不把上下文解释直接写进正文，以保存原文措辞的开放度。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。“我的列祖之上帝啊”保留原文呼语；分号划分上帝先前所赐与如今所显明的内容。正文中的[a]与脚注对应。
