base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/048.yaml
  text: Then the king made Daniel great and gave him many great gifts[b][a], and he made him ruler over the whole province of Babylon and chief prefect over all the wise men of Babylon.
translation:
  language: zh_hans
  text: 于是，王使但以理显贵，赐给他许多贵重的礼物，又委任他治理巴比伦全省，并立他为巴比伦所有智者的总长。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “总长”所译的称号，指统辖其他官员或行政人员的高级官员；其确切官阶不详。
    reason: cultural_note
lexical_decisions:
- source_word: אֱדַיִן
  choice: 于是
  rationale: 表示叙事中紧接着发生的行动；“于是”自然地承接上文。
- source_word: רַבִּי
  choice: 使但以理尊贵
  rationale: 该动词字面义为“使……为大”，在宫廷语境中指抬举、晋升；此译保留原词意象，同时符合现代汉语。
- source_word: וּמַתְּנָן רַבְרְבָן שַׂגִּיאָן יְהַב לֵהּ
  choice: 赐给他许多贵重的礼物
  rationale: “礼物”前的修饰语兼有众多、丰厚或重大的意味；“许多贵重的”兼顾数量与价值，并以“赐给”体现君王施予的语境。
- source_word: וְהַשְׁלְטֵהּ
  choice: 委任他治理
  rationale: 这是“统治、掌权”的使役形式，表示王使但以理获得治理权；“委任他治理”自然表达任命及权柄。
- source_word: עַל כָּל מְדִינַת בָּבֶל
  choice: 巴比伦全省
  rationale: מְדִינָה在帝国行政语境中指“省”；单数结构表示整个巴比伦省。
- source_word: וְרַב סִגְנִין
  choice: 并作总长
  rationale: רַב意为首领，סִגְנִין指官员、长官一类人物；结合下文“统管所有智者”，译为“总长”以表达其居首统辖的高级官职，同时不武断限定具体官阶。
- source_word: עַל כָּל חַכִּימֵי בָבֶל
  choice: 统管巴比伦所有的智者
  rationale: “智者”是但以理书宫廷语境中的术语，泛指宫廷中的学者、术士及顾问群体；“统管”明确承接其总长职权。
theological_decisions: []
translation_notes:
  register: 采用庄重而流畅的现代标准汉语。“使但以理尊贵”保留亚兰文“使……为大”的表达；行政称谓则用普通读者易懂的“总长”，并以脚注交代其语义范围。
