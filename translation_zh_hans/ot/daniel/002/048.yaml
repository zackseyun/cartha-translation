  to: 于是，王使但以理显贵，赐给他许多贵重的礼物，又委任他治理巴比伦全省，并立他为巴比伦所有智者的总长。[a]
  rationale: 修订不改变经文含义；以“显贵”更自然地表达王使但以理“为大”的擢升，并重组末句以清楚表达其作为巴比伦全体智者之首的职分。脚注则收窄至原文和语境所支持的行政含义。
