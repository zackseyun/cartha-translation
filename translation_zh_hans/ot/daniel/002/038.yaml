source:
  edition: WLC
  text: וּ/בְ/כָל דִּ֣י דארין בְּֽנֵי אֲ֠נָשָׁ/א חֵיוַ֨ת בָּרָ֤/א וְ/עוֹף שְׁמַיָּ/א֙ יְהַ֣ב בִּ/ידָ֔/ךְ וְ/הַשְׁלְטָ֖/ךְ בְּ/כָלְּ/ה֑וֹן אַנְתְּה ה֔וּא רֵאשָׁ֖/ה דִּ֥י דַהֲבָֽ/א־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/038.yaml
  text: And wherever the children of men dwell[a], the beasts of the field and the birds of the heavens—he has given them into your hand and made you ruler over all of them[c][b]. You are the head of gold.
translation:
  language: zh_hans
  text: 无论人[a]住在哪里，田野的走兽和天空的飞鸟，他都交在你手中，使你统管这一切[b]。你就是那金头。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “人”字面为“人的儿女”，在这里泛指人类。
    reason: lexical_alternative
  - marker: b
    text: “他”指上节所说天上的神；本节原文没有再次明说主语。
    reason: cross_reference
lexical_decisions:
- source_word: וּבְכָל דִּי דארין
  choice: 凡……所居住的地方
  rationale: 该结构表达广泛的地点范围，即“无论在哪里／凡……居住之处”。此译法既保留范围意义，也符合现代汉语表达。
- source_word: בְּנֵי אֲנָשָׁא
  choice: 人
  rationale: 这是表示人类的惯用语，字面为“人的儿女”。现代汉语用“人”最自然准确；脚注保留字面形式。
- source_word: חֵיוַת בָּרָא
  choice: 田野的走兽
  rationale: בָּרָא 指野外或开阔地；“田野的走兽”保留具体意象和庄重语体，并不把范围缩窄为现代分类意义上的野生动物。
- source_word: וְעוֹף שְׁמַיָּא
  choice: 天空的飞鸟
  rationale: 直译为“天的鸟”。“天空的飞鸟”在现代汉语中自然，并保留空间意象。
- source_word: יְהַב בִּידָךְ
  choice: 他都交在你手中
  rationale: “交在……手中”保留了授予支配权的手之隐喻。“都”承接后文“这一切”，使列举对象与代词关系清楚。
- source_word: וְהַשְׁלְטָךְ בְּכָלְּהוֹן
  choice: 使你统管这一切
  rationale: 使役形式表示使尼布甲尼撒掌权；“统管”简洁传达治理和支配之意，“这一切”回指前述人、走兽和飞鸟。
- source_word: אַנְתְּה הוּא
  choice: 你就是
  rationale: 代词与系词的组合带有强调意味；“你就是”自然体现这种明确指认。
- source_word: רֵאשָׁה דִּי דַהֲבָא
  choice: 那金头
  rationale: 指梦中已出现的金质头部。“金头”保留原文名词结构和异象意象，“那”体现特指。
theological_decisions:
- issue: “交在”与“使……统管”的隐含施事者
  choice: 主文保留“他”，由上节语境指向天上的神，不直接补入“神”。
  alternative: 译作“神都交在你手中，使你统管这一切”。
  rationale: 本节亚兰文动词未明说主语，而上节已明确以天上的神为授予国度者。保留代词既忠于篇章衔接，也避免在本节添加原文未重复的名词。
- issue: בְּנֵי אֲנָשָׁא 的人类称谓
  choice: 主文译为“人”，脚注说明字面为“人的儿女”。
  alternative: 主文译为“人的儿女”或“世人”。
  rationale: 该短语在此泛指人类，并非强调亲子关系或男性。“人”在现代汉语中准确、自然；脚注则保存源语意象。
- issue: 统治范围的表达
  choice: 将 בְּכָלְּהוֹן 译作“这一切”，明确回指所列的人与动物。
  alternative: 译作“他们众者”或仅作“万有”。
  rationale: 原文复数后缀回指前述对象。“这一切”不把范围扩展为宇宙性的“万有”，也不排除非人的动物。
translation_notes:
  register: 采用现代、庄重而清楚的叙述语体。“田野的走兽”“天空的飞鸟”“交在你手中”保存原文的具体意象；避免过度古雅的“世人所寓之处”和容易扩大语义的“万有”。
