  text: ה֛וּא גָּלֵ֥א עַמִּיקָתָ֖/א וּ/מְסַתְּרָתָ֑/א יָדַע֙ מָ֣ה בַ/חֲשׁוֹכָ֔/א ו/נהיר/א עִמֵּ֥/הּ שְׁרֵֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/022.yaml
  text: He reveals deep and hidden things[a]; he knows what is in the darkness[b], and light dwells with him.
translation:
  language: zh_hans
  text: 他显明深奥和隐藏的事[a]；他知道黑暗中有什么，光也与他同住[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “隐藏的事”或译“隐秘的事”。
    reason: lexical_alternative
  - marker: b
    text: “与他同住”或译“与他同在”。亚兰语动词可表达较静态的状态，但“同住”更能保留原文的居住意象。
    reason: lexical_alternative
lexical_decisions:
- source_word: גָּלֵא
  choice: 显明
  rationale: 此亚兰语分词表示揭开、使人知道；“显明”自然庄重，也契合本章上帝揭示奥秘的语境。
- source_word: עַמִּיקָתָא
  choice: 深奥的事
  rationale: 该复数实体化形容词指深邃、难以洞察之事；“深奥的事”保留深度隐喻，并符合现代汉语表达。
- source_word: וּמְסַתְּרָתָא
  choice: 和隐藏的事
  rationale: 源自动词“隐藏、遮蔽”；“隐藏的事”直接保留原文意象，不先行限定为人为保守的“秘密”。
- source_word: יָדַע מָה
  choice: 他知道……有什么
  rationale: 按汉语语序译作“他知道黑暗中有什么”，自然地表达上帝所知的内容。
- source_word: בַחֲשׁוֹכָא
  choice: 黑暗中
  rationale: 保留具体的黑暗意象；汉语通常无需另译亚兰语的定指形式。
- source_word: וּנְהִירָא
  choice: 光也
  rationale: “光”与“黑暗”形成鲜明对照；加入“也”使并列推进在汉语中更顺畅，不改变命题内容。
- source_word: עִמֵּהּ שְׁרֵא
  choice: 与他同住
  rationale: שְׁרֵא 可指居住、停留或安居；“与他同住”保留原文动态而拟人化的诗意，不弱化为单纯的“与他同在”。
- source_word: הוּא
  choice: 他
  rationale: 句首代词带有强调作用；汉语通过独立起句及后续重复“他”自然呈现，不采用额外强调词。
theological_decisions:
- issue: 光与上帝关系的拟人化表达
  choice: 光也与他同住
  alternative: 光也与他同在
  rationale: 原文动词 שְׁרֵא 通常含居住、停留之意。“同住”保留诗歌中的拟人化和神学张力，却不据此加入关于“光”位格或本体的额外解释。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。以对称句式保留诗性，并维持“深奥／隐藏”“黑暗／光”的意象对照；不添加宗派性解释。
