base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/017.yaml
  text: Then Daniel went to his house and made the matter known to Hananiah[a], Mishael, and Azariah, his companions.
translation:
  language: zh_hans
  text: 于是，但以理到自己家里去，把这事告诉他的同伴哈拿尼雅、米沙利和亚撒利雅。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“朋友”。亚兰语此词可指同伴、伙伴或朋友。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱדַיִן
  choice: 于是
  rationale: 这是亚兰语叙事中表示先后承接的副词；“于是”自然地体现事件的时间推进。
- source_word: לְבַיְתֵהּ
  choice: 回到自己家里
  rationale: 原文直译为“到他的家”；结合但以理此前在外与护卫长交涉的语境，“回到”符合现代汉语表达，其中“自己”清楚传达第三人称单数所有关系。
- source_word: אֲזַל
  choice: 回到
  rationale: 该常用亚兰语动词基本义为“去”；与目的地“他的家”连用时，汉语用“回到”更自然，同时不改变叙事动作。
- source_word: חַבְרוֹהִי
  choice: 他的同伴
  rationale: 该词指与但以理关系密切、共同处境中的伙伴或同伴；“同伴”保留关系含义，又不额外断定私人友谊的性质。
- source_word: מִלְּתָא
  choice: 这事
  rationale: 此处指前文所述的事项，即王的命令以及但以理为解梦所作的请求；“这事”简洁自然，并保持原词在语境中的宽泛性。
- source_word: הוֹדַע
  choice: 告诉
  rationale: 这是“知道”的使役形，意为“使……知道”。现代汉语“告诉”准确、自然地表达这一使役含义。
- source_word: וְלַחֲנַנְיָה מִישָׁאֵל וַעֲזַרְיָה
  choice: 哈拿尼雅、米沙利和亚撒利雅
  rationale: 按原文音译三个人名；介词所表达的对象关系已由汉语动词“告诉”自然统摄。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“于是”承接上文，“把这事告诉”符合现代汉语习惯；保留“同伴”与“朋友”之间的词义空间，并以脚注说明。
