base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/026.yaml
  text: The king answered and said to Daniel, whose name was Belteshazzar, “Are you able to make known to me the dream that I saw, and its interpretation?”
translation:
  language: zh_hans
  text: 王回答，对那名叫伯提沙撒的但以理说：“你能把我所见的梦及其解释告诉我吗？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עָנֵה מַלְכָּא וְאָמַר
  choice: 王回答……说
  rationale: 保留亚兰文叙事中“回答—说”的双动词表达，同时按现代汉语语序自然组织。
- source_word: לְדָנִיֵּאל
  choice: 对……但以理
  rationale: 介词标明说话的对象；中文用“对……说”自然表达。
- source_word: דִּי שְׁמֵהּ בֵּלְטְשַׁאצַּר
  choice: 那名叫伯提沙撒的
  rationale: 将“他的名字是伯提沙撒”这一关系从句自然地译成定语，并保留但以理的巴比伦名字。
- source_word: הֲאִיתָךְ כָּהֵל
  choice: 你能……吗
  rationale: 疑问结构加表示能力的词，现代汉语以“能……吗”准确而自然。
- source_word: לְהוֹדָעֻתַנִי
  choice: 告诉我
  rationale: 该使役形式本义为“使我知道”；在直接问话中，“告诉我”既体现结果，也比“使我知道”更符合现代汉语。
- source_word: חֶלְמָא דִּי חֲזֵית
  choice: 我所做的梦
  rationale: 中文通常说“做梦”而不说“看见梦”；“所做的梦”自然传达原文“我所看见的梦”。
- source_word: וּפִשְׁרֵהּ
  choice: 和梦的解释
  rationale: פשר在《但以理书》中是解梦的技术用语；重复“梦”可避免代词指向生硬或含混。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而清楚的叙事语言。保留“回答……说”的圣经叙事特征，但避免不自然的逐词直译；人名按中文圣经通行译法处理。
