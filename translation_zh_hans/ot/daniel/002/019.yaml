id: DAN.2.19
reference: Daniel 2:19
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אֱדַ֗יִן לְ/דָנִיֵּ֛אל בְּ/חֶזְוָ֥/א דִֽי לֵילְיָ֖/א רָזָ֣/ה גֲלִ֑י אֱדַ֨יִן֙ דָּֽנִיֵּ֔אל בָּרִ֖ךְ לֶ/אֱלָ֥הּ שְׁמַיָּֽ/א־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/019.yaml
  text: Then the mystery was revealed to Daniel in a vision of the night[c][b][a]. Then Daniel blessed the God of heaven.
translation:
  language: zh_hans
  text: 于是，这奥秘在夜间的异象中向但以理显明了[a][b]。于是，但以理称颂天上的上帝[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在夜间异象中”。
    reason: lexical_alternative
  - marker: b
    text: “奥秘”也可译作“秘密”。
    reason: lexical_alternative
  - marker: c
    text: “称颂”也可译作“祝颂”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱדַיִן
  choice: 于是
  rationale: 这是表示叙事承接与先后次序的亚兰语话语标记；译作“于是”自然、庄重，并在两句中重复，以保留原文的重复结构。
- source_word: בְּחֶזְוָא דִי לֵילְיָא
  choice: 在夜间的异象中
  rationale: 贴近原文“夜的异象”这一表达，同时符合现代汉语习惯；也保留事件借夜间异象发生的意思。
- source_word: רָזָה
  choice: 这奥秘
  rationale: 此词在《但以理书》中指王之梦及其含义这一隐藏而后被上帝揭示的事。“奥秘”保留神圣启示语境；指示词“这”体现亚兰语的确定形式及上下文所指。
- source_word: גֲלִי
  choice: 显明了
  rationale: 原文为被动形式，表示隐藏之事被揭示，而非但以理凭自己发现；汉语“向但以理显明了”自然地保留这一受事结构及启示意味。
- source_word: בָּרִךְ
  choice: 称颂
  rationale: 该动词本义可对应“祝颂”，用于人对上帝时表示颂赞。现代汉语“称颂上帝”既准确表达语境功能，也比“祝福上帝”自然，同时未缩减为单纯感谢。
- source_word: לֶאֱלָהּ שְׁמַיָּא
  choice: 天上的上帝
  rationale: 这是圣经中的上帝称号；“天上的上帝”在现代汉语中自然清楚，并保留其称号性质。
- source_word: דָנִיֵּאל
  choice: 但以理
  rationale: 采用现代中文圣经传统中通行的人名音译。
theological_decisions:
- issue: 隐藏之事的启示表达
  choice: 这奥秘……向但以理显明了
  alternative: 这秘密……向但以理揭示了
  rationale: “奥秘”与“显明”共同保留此事原本隐藏、后来由神启示而为人所知的语义，但不暗示它永远不可理解。
- issue: 人对上帝施行 בָּרִךְ 的含义
  choice: 但以理称颂天上的上帝
  alternative: 但以理祝颂天上的上帝
  rationale: 用于上帝时，该动词表达人的颂赞。“称颂”是自然、庄重的现代汉语，也保留了祝颂性语气；脚注列出更贴近词形的“祝颂”。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。保留原文两次“于是”的叙事重复，以呈现先后推进；正文中的脚注标记紧随各自所说明的词语或短语。
