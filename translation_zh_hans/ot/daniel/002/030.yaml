id: DAN.2.30
reference: Daniel 2:30
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/אֲנָ֗ה לָ֤א בְ/חָכְמָה֙ דִּֽי אִיתַ֥י בִּ/י֙ מִן כָּל חַיַּיָּ֔/א רָזָ֥/א דְנָ֖ה גֱּלִ֣י לִ֑/י לָהֵ֗ן עַל דִּבְרַת֙ דִּ֤י פִשְׁרָ/א֙ לְ/מַלְכָּ֣/א יְהוֹדְע֔וּן וְ/רַעְיוֹנֵ֥י לִבְבָ֖/ךְ תִּנְדַּֽע־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/030.yaml
  text: But as for me[a], this mystery has been revealed to me not because of wisdom that is in me more than in all the living, but in order that the interpretation may be made known to the king[b], and that you may know the thoughts of your heart.
translation:
  language: zh_hans
  text: 至于我，这奥秘之所以向我显明，并不是因为我拥有的智慧胜过一切活人，而是为了使王知道这奥秘的解释，也使你知道你心里的意念。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַאֲנָה
  choice: 至于我
  rationale: 独立代词突出但以理本人，并与上文上帝启示奥秘形成话题转折；汉语用“至于我”自然保留这种强调。
- source_word: לָא בְחָכְמָה דִּי אִיתַי בִּי מִן כָּל חַיַּיָּא
  choice: 并不是因为我拥有的智慧胜过一切活人
  rationale: בְ在此表示原因或依据，מִן表示比较；译文明确保留但以理否认自己比所有活人更有智慧的意思。
- source_word: רָזָא דְנָה
  choice: 这奥秘
  rationale: רָז指隐藏而后被启示的事；在《但以理书》的语境中，“奥秘”兼顾隐藏性及上帝揭示的意味。
- source_word: גֱּלִי לִי
  choice: 向我显明
  rationale: 原文形式表达但以理是领受启示者而非启示源头；“向我显明”在现代汉语中简洁、庄重。
- source_word: לָהֵן עַל דִּבְרַת דִּי
  choice: 而是为了
  rationale: 该组合在此引出与前句否定相对的目的；“而是为了”同时呈现否定—肯定结构及目的关系。
- source_word: פִשְׁרָא לְמַלְכָּא יְהוֹדְעוּן
  choice: 使王知道这奥秘的解释
  rationale: פִשְׁרָא是梦或奥秘的解释。复数动词在语境中可作非人称、被动式理解；汉语使动表达自然，并补出“这奥秘”以明确“解释”的所指。
- source_word: וְרַעְיוֹנֵי לִבְבָךְ תִּנְדַּע
  choice: 也使你知道你心里的意念
  rationale: 保留“心”这一圣经人观用语，同时以“心里的意念”表达内在思想与思虑；目的意味由“使”体现。
theological_decisions:
- issue: 启示临到但以理是否源于他个人的卓越智慧
  choice: 明确译出并非因为但以理的智慧胜过一切活人
  alternative: 较笼统地译为“并不是出于我的智慧”
  rationale: 原文含明确的比较短语 מִן כָּל חַיַּיָּא。保留它既忠实文本，也维持但以理的谦卑与启示源于上帝之间的神学张力。
- issue: “心”的人观用语
  choice: 保留“心”，译为“你心里的意念”
  alternative: 译为“你脑中的想法”或“你心思中的意念”
  rationale: 原文 לִבְבָךְ 直指“你的心”，在圣经语境中涵盖思想、意向和内在生命；保留“心”避免将其收窄为现代心理学意义上的“头脑”。
- issue: 目的从句的范围
  choice: 将知道解释和知道心中意念都置于启示的目的之下
  alternative: 把后半句理解为单纯结果或独立陈述
  rationale: לָהֵן עַל דִּבְרַת דִּי 引出目的，后续两个并列成分自然共同受其统摄；译文用两个“使”清楚呈现而不额外解释。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“一切活人”保留原文概括性表达；“这奥秘的解释”比单说“解释”更符合普通读者的汉语理解。原文可合理直译而无需脚注，因此正文不设脚注标记。
