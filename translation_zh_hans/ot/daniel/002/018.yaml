source:
  edition: WLC
  text: וְ/רַחֲמִ֗ין לְ/מִבְעֵא֙ מִן קֳדָם֙ אֱלָ֣הּ שְׁמַיָּ֔/א עַל רָזָ֖/ה דְּנָ֑ה דִּ֣י לָ֤א יְהֹֽבְדוּן֙ דָּנִיֵּ֣אל וְ/חַבְר֔וֹ/הִי עִם שְׁאָ֖ר חַכִּימֵ֥י בָבֶֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/018.yaml
  text: and to seek mercy from before the God of heaven concerning this mystery[a], so that Daniel and his companions might not perish with the rest of the wise men of Babylon.
translation:
  language: zh_hans
  text: 要就这奥秘[a]，向天上的上帝求怜悯，使但以理和他的同伴不至与巴比伦其余的智者一同灭亡。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“秘密”。亚兰语这个词指需要借启示才能知道的隐藏之事。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרַחֲמִין לְמִבְעֵא
  choice: 求怜悯
  rationale: 复数名词“怜悯”在此按亚兰语习惯表达慈悲、怜恤；与不定式连用，表示但以理吩咐同伴恳切祈求的目的。现代汉语“求怜悯”自然简洁。
- source_word: מִן קֳדָם אֱלָהּ שְׁמַיָּא
  choice: 向天上的上帝
  rationale: מִן קֳדָם直译为“从……面前”，在祈求语境中表示向处于其面前的对象求取；汉语用“向”自然传达祈求的方向，并保留“天上的上帝”这一称号。
- source_word: עַל רָזָה דְּנָה
  choice: 为这奥秘
  rationale: עַל在此说明祈求所关涉的事项；“为”符合汉语祈求语境。רָז指必须借启示才能知晓的隐藏之事，“奥秘”比单纯的“秘密”更能体现本章语境。
- source_word: דִּי לָא יְהֹבְדוּן
  choice: 使……不至……灭亡
  rationale: דִּי加否定未完成式在此表达目的或预期结果。Haphil形式可指使之消灭；“不至灭亡”既自然，也涵盖他们将被处死的叙事处境。
- source_word: וְחַבְרוֹהִי
  choice: 和他的同伴
  rationale: 该词指但以理在宫廷中的几位亲近伙伴；“同伴”比“朋友”更贴合叙事身份，也保持庄重。
- source_word: עִם שְׁאָר חַכִּימֵי בָבֶל
  choice: 与巴比伦其余的智者一同
  rationale: עִם表示与更大群体共同遭遇同一结局；“其余的智者”清楚表明但以理及其同伴被归在巴比伦智者群体之中。
theological_decisions:
- issue: 但以理宫廷叙事中רָז的译法
  choice: 奥秘
  alternative: 秘密
  rationale: 本章所指并非只是人刻意保守的秘密，而是人凭自身智慧无法知道、必须由上帝揭示的隐藏之事。“奥秘”保留这一启示层面，同时不把后世术语含义强加于本节。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。经文承接上一节的吩咐，保留目的结构；“向天上的上帝求怜悯”避免生硬照译“从……面前”，而“智者”作为巴比伦宫廷贤士阶层的称呼，较“智慧人”更符合现代汉语。
