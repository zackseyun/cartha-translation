id: DAN.2.27
reference: Daniel 2:27
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: עָנֵ֧ה דָנִיֵּ֛אל קֳדָ֥ם מַלְכָּ֖/א וְ/אָמַ֑ר רָזָ/ה֙ דִּֽי מַלְכָּ֣/א שָׁאֵ֔ל לָ֧א חַכִּימִ֣ין אָֽשְׁפִ֗ין חַרְטֻמִּין֙ גָּזְרִ֔ין יָכְלִ֖ין לְ/הַֽחֲוָיָ֥ה לְ/מַלְכָּֽ/א־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/027.yaml
  text: Daniel answered before the king and said[a], “The mystery that the king asks, no wise men, enchanters, magicians[b], or diviners are able to make known to the king.”
translation:
  language: zh_hans
  text: 但以理在王面前回答说：“王所问的奥秘[a]，智者、行法术的[b]、术士和占卜者都不能告诉王。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“秘密”。这里译作“奥秘”，是为了保留本章反复出现的主题：隐藏之事只有上帝才能揭示。
    reason: lexical_alternative
  - marker: b
    text: “行法术的”所译的亚兰语词，是巴比伦某一类专业人员的称谓；其确切含义不完全确定，传统上也译作“占星者”。
    reason: lexical_alternative
lexical_decisions:
- source_word: עָנֵה
  choice: 回答
  rationale: 这是亚兰语叙事中引出回应的常用动词；“回答”保留正式对话语气，也符合当前讲话场景。
- source_word: קֳדָם
  choice: 在……面前
  rationale: 表示“在……面前、在……面前临在”；此译法自然地保留宫廷场景。
- source_word: רָזָה
  choice: 奥秘
  rationale: 本词在本章反复指隐藏而须由上帝揭示的梦及其意义；“奥秘”可保留这一贯穿全章的主题。“秘密”也是可能译法。
- source_word: דִּי
  choice: 所……的
  rationale: 关系词连接“奥秘”与“王问”这一分句；汉语用“王所问的奥秘”最自然。
- source_word: שָׁאֵל
  choice: 问
  rationale: 此处把王的要求作为当前议题；“所问的”在直接引语中简洁自然，也不额外限定时态。
- source_word: חַכִּימִין
  choice: 智者
  rationale: 指宫廷中一类有学识的顾问；“智者”简洁，并保留其群体称谓。
- source_word: אָשְׁפִין
  choice: 行法术的
  rationale: 这是巴比伦某类专业人员的技术性称谓，确切含义并不完全确定；此译法谨慎地表达其与法术或秘术有关，又与下文“术士”有所区别。
- source_word: חַרְטֻמִּין
  choice: 术士
  rationale: 在圣经用法中指埃及或巴比伦的一类秘术专家；“术士”是清楚、常见且符合语境的现代汉语表达。
- source_word: גָּזְרִין
  choice: 占卜者
  rationale: 在但以理书中指借占卜判定或宣告隐秘之事的一类人；“占卜者”准确表达其语境功能。
- source_word: יָכְלִין
  choice: 能
  rationale: 表示能力；与否定词连用译为“不能”，自然且忠实。
- source_word: לְהַחֲוָיָה
  choice: 告诉
  rationale: 使役式不定词表示使人知道、披露或显明；在“告诉王”这一汉语结构中，“告诉”自然表达把隐秘之事告知王的含义，而不作过度阐释。
- source_word: לְמַלְכָּא
  choice: 告诉王
  rationale: 这里的王是披露行为的间接宾语；译作“告诉王”与前面的“在王面前”清楚区分。
theological_decisions:
- issue: רָזָה是否译为带有后世神学色彩的专门术语
  choice: 译为“奥秘”，并以脚注注明“秘密”这一可能译法
  alternative: 秘密
  rationale: “奥秘”能保留本章关于隐藏之事唯有借上帝启示才得显明的重复主题，但不在正文中加入额外的教义解释；脚注保留词义上的真实选择。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“在王面前回答说”保留宫廷叙事的正式感；四类人员各用不同称谓，以反映原文并列结构，同时避免把含义尚不确定的技术术语说得过于确定。
