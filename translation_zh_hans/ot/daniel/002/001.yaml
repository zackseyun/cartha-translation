base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/001.yaml
  text: In the second year of Nebuchadnezzar’s reign[a], Nebuchadnezzar dreamed dreams, and his spirit was troubled[c][b], and his sleep left him.
translation:
  language: zh_hans
  text: 尼布甲尼撒在位第二年，尼布甲尼撒做了梦[a]，心神烦乱[b]，睡意全无[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“梦了梦”；“梦”在原文中为复数。
    reason: lexical_alternative
  - marker: b
    text: 或译：“他的心神激荡不安。”
    reason: lexical_alternative
  - marker: c
    text: 较直译：“他的睡眠离开了他。”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִשְׁנַת שְׁתַּיִם
  choice: 在……第二年
  rationale: 希伯来语直译为“而在第二年”；句首连接词在这里主要承接叙事，现代汉语无需单独译出。
- source_word: לְמַלְכוּת
  choice: 在位
  rationale: 此处指君王统治的年期，而非疆域或抽象的王权；“在位第二年”是自然、准确的汉语纪年表达。
- source_word: נְבֻכַדְנֶצַּר
  choice: 尼布甲尼撒
  rationale: 采用现代中文圣经传统中通行且易于辨认的人名译法。
- source_word: חָלַם ... חֲלֹמוֹת
  choice: 做了梦
  rationale: 原文是同源宾语结构，字面为“梦见了梦”，且“梦”为复数。汉语“做了梦”自然，并可在数量上保持不定，不武断地补入“几个”或“一些”；脚注说明原文形式。
- source_word: וַתִּתְפָּעֶם רוּחוֹ
  choice: 他的心灵烦乱
  rationale: 动词表达强烈的内在扰动；“心灵”保留 רוּחַ 在此所指的内在人格层面，又比直译“灵”更符合现代汉语叙事。
- source_word: וּשְׁנָתוֹ נִהְיְתָה עָלָיו
  choice: 再也无法入睡
  rationale: 该短语按上下文表达睡意或睡眠离开了他。“再也无法入睡”自然呈现失眠的结果；脚注保留较贴近字面的传统译法。
