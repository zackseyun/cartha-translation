source:
  edition: WLC
  text: וּֽ/בְ/יוֹמֵי/ה֞וֹן דִּ֧י מַלְכַיָּ֣/א אִנּ֗וּן יְקִים֩ אֱלָ֨הּ שְׁמַיָּ֤/א מַלְכוּ֙ דִּ֤י לְ/עָלְמִין֙ לָ֣א תִתְחַבַּ֔ל וּ/מַ֨לְכוּתָ֔/ה לְ/עַ֥ם אָחֳרָ֖ן לָ֣א תִשְׁתְּבִ֑ק תַּדִּ֤ק וְ/תָסֵיף֙ כָּל אִלֵּ֣ין מַלְכְוָתָ֔/א וְ/הִ֖יא תְּק֥וּם לְ/עָלְמַיָּֽ/א־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/044.yaml
  text: And in the days of those kings[a], the God of heaven will set up a kingdom that will never be destroyed, and the kingdom will not be left to another people. It will crush and put an end to all these kingdoms[b], and it will stand forever.
translation:
  language: zh_hans
  text: 在那些王当政的日子里[a]，天上的上帝必建立一个永不毁灭的国；这国不会留给别的民族。它必击碎[b]并终结这一切国度，必永远屹立。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “那些王”回指尼布甲尼撒梦中由像所代表的王或国；其确切的历史所指，解释者有不同看法。
    reason: alternative_reading
  - marker: b
    text: 或译“压碎”“粉碎”；亚兰文动词含有碾碎、打得粉碎的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְיוֹמֵיהוֹן דִּי מַלְכַיָּא אִנּוּן
  choice: 在那些王当政的日子里
  rationale: 保留时间短语及其回指作用；补出“当政”符合汉语习惯，也显明“王的日子”指他们掌权的时期，而不限定具体历史所指。
- source_word: יְקִים
  choice: 建立
  rationale: 该动词表示设立、建立；“建立”自然庄重，适合国度语境。
- source_word: אֱלָהּ שְׁמַיָּא
  choice: 天上的上帝
  rationale: 准确传达亚兰文的固定称号，并采用现代汉语中自然的表达。
- source_word: מַלְכוּ דִּי לְעָלְמִין לָא תִתְחַבַּל
  choice: 一个永不毁灭的国
  rationale: 将否定词与表示永久的短语合译为“永不”，清楚表达这个国不可毁灭的持久性。
- source_word: וּמַלְכוּתָהּ לְעַם אָחֳרָן לָא תִשְׁתְּבִק
  choice: 这国不会留给别的民族
  rationale: “这国”自然回指前述国度；“留给”保留不转归另一群体所有的含义。“民族”比“百姓”更适合此处政治群体的语境。
- source_word: תַּדִּק
  choice: 击碎
  rationale: 使役形式表达压碎、打碎；“击碎”既保留石头意象，又与下一动词“终结”有所区别。
- source_word: וְתָסֵיף
  choice: 并终结
  rationale: 该使役动词意为使之结束；“终结”简洁地传达彻底结束，而不与“击碎”重复。
- source_word: כָּל אִלֵּין מַלְכְוָתָא
  choice: 这一切国度
  rationale: 指向梦中已经提到并由像所代表的诸国；“国度”也能与上帝所建立的“国”形成清楚对照。
- source_word: וְהִיא תְּקוּם לְעָלְמַיָּא
  choice: 自己却要永远屹立
  rationale: “屹立”保留קום的站立隐喻，表达稳定长存；“却”显出它与被终结的诸国之间的对比。
theological_decisions:
- issue: 上帝所建立之国的身份
  choice: 只陈述其来自上帝、永不毁灭并战胜诸国，不在正文中进一步指定其教义身份。
  alternative: 在正文中明确称为弥赛亚或基督的国。
  rationale: 本节明确说这是天上的上帝所建立的永恒国度，却未在本句直接使用“弥赛亚”或“基督”等称谓；译文不应超出亚兰文本身。
- issue: “那些王”的具体所指
  choice: 保留回指性的“那些王”，并以脚注说明其精确历史所指存在不同理解。
  alternative: 明确译成四国的君王、分裂之国的诸王，或末期同时在位的统治者。
  rationale: 上下文清楚表明这些王与梦中所呈现的王和国有关，但本句没有进一步限定其具体历史范围。
- issue: 神国与列国之间的冲突
  choice: 直译为神所建立的国将击碎并终结列国。
  alternative: 弱化为神国将和平取代或仅仅超越列国。
  rationale: 原文使用两个强烈的使役动词，明确表达粉碎和使之终止；不应将其暴力性的审判意象淡化。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“当政的日子”避免生硬的“在那些王的日子里”；“永不毁灭”“永远屹立”形成清晰对照。脚注标记均置于对应词语之后，并纠正咨询层中脚注内容与标记位置互相错置的问题。
