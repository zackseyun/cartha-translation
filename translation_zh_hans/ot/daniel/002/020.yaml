  text: עָנֵ֤ה דָֽנִיֵּאל֙ וְ/אָמַ֔ר לֶהֱוֵ֨א שְׁמֵ֤/הּ דִּֽי אֱלָהָ/א֙ מְבָרַ֔ךְ מִן עָלְמָ֖/א וְ/עַ֣ד עָלְמָ֑/א דִּ֧י חָכְמְתָ֛/א וּ/גְבוּרְתָ֖/א דִּ֥י לֵֽ/הּ הִֽיא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/020.yaml
  text: 'Daniel answered and said: “Blessed be the name of God from everlasting to everlasting[b][a], for wisdom and might belong to him.”'
translation:
  language: zh_hans
  text: 但以理回应说：“愿上帝的名从亘古直到永远[a]都受颂赞，因为智慧和能力都属于他[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“世世代代”，或“从永远到永远”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“智慧和权能都是他的。”
    reason: lexical_alternative
lexical_decisions:
- source_word: עָנֵה ... וְאָמַר
  choice: 回应说
  rationale: 这是亚兰语常见的叙事引语格式；译作“回应说”既保留回应之意，又符合现代汉语表达。
- source_word: לֶהֱוֵא ... מְבָרַךְ
  choice: 愿……受颂赞
  rationale: 该意愿式构成祝颂语。“愿……受颂赞”自然、庄重，也保留了原文祈愿式语气。
- source_word: שְׁמֵהּ דִּי אֱלָהָא
  choice: 上帝的名
  rationale: 忠实保留“名”的圣经表达，指向上帝所显明的身份与尊荣，而不将其扁平化为仅仅“上帝”。
- source_word: מִן עָלְמָא וְעַד עָלְמָא
  choice: 从亘古直到永远
  rationale: 表达无尽的时间跨度，并以现代读者可懂而庄重的汉语保留原文“从……直到……”的结构。
- source_word: דִּי
  choice: 因为
  rationale: 此处引出颂赞上帝之名的理由，译作“因为”清楚呈现逻辑关系。
- source_word: חָכְמְתָא
  choice: 智慧
  rationale: 直接对应原文抽象名词，语境中无需另作解释。
- source_word: גְבוּרְתָא
  choice: 能力
  rationale: 该词表示力量、权能；“能力”在现代汉语中自然，并与“智慧”构成清晰配对。
- source_word: דִּי לֵהּ הִיא
  choice: 都属于他
  rationale: 原文表达所有关系；“属于他”准确自然，“都”统摄并列的智慧与能力，不额外加入排他含义。
theological_decisions:
- issue: 祝颂公式与上帝的属性
  choice: 将本节译为对上帝之名的祝颂，并以智慧和能力属于他作为祝颂的理由。
  alternative: 较直译为：“愿上帝的名……蒙福，因为智慧和能力是他的。”
  rationale: 这里是颂赞，不是抽象的形而上定义。“受颂赞”避免现代汉语中“蒙福”可能暗示上帝从外界领受福分的误解，同时不扩展原文的神学陈述。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。“回应说”保留叙事公式但避免生硬重复；“愿……受颂赞”体现祝颂语气；正文中的脚注标记均紧随相关短语。
