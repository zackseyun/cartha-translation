base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/024.yaml
  text: 'Therefore Daniel went in to Arioch[a], whom the king had appointed to destroy the wise men of Babylon. He went and said this to him: “Do not destroy the wise men of Babylon. Bring me in before the king[b], and I will show the interpretation to the king.”'
translation:
  language: zh_hans
  text: 因此，但以理去见亚略，就是王所委派、要消灭巴比伦智慧人的那位。他去了，对亚略这样说：“不要消灭巴比伦的智慧人。请领我到王面前，我会把解释告诉王。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל קֳבֵל דְּנָה
  choice: 因此
  rationale: 这是承接上文的因果和话语标记，表示但以理因奥秘已经显明而采取行动；“因此”简洁自然。
- source_word: עַל עַל אַרְיוֹךְ
  choice: 去见亚略
  rationale: עַל在此可指进去、前往或接近。结合随后的当面说话，“去见”以自然汉语保留了前往接触之意，又不额外设定具体空间。
- source_word: דִּי מַנִּי מַלְכָּא
  choice: 就是王所委派……的那位
  rationale: מַנִּי表示任命、委派；关系从句说明亚略受王差派执行命令。
- source_word: לְהוֹבָדָה / אַל תְּהוֹבֵד
  choice: 要消灭／不要消灭
  rationale: 使役形式表示使之灭亡、除灭。在本段具体涉及处决，但“消灭”保留原词较宽的语义，并在两处保持词汇呼应。
- source_word: לְחַכִּימֵי בָבֶל
  choice: 巴比伦的智慧人
  rationale: 这是但以理书对宫廷贤士群体的惯用称呼；“智慧人”既贴近原文，也符合全书术语一致性。
- source_word: אֲזַל וְכֵן אֲמַר לֵהּ
  choice: 他去了，对亚略这样说
  rationale: 保留原文再次出现的行动动词及“这样说”的引语导入。明确“亚略”可避免现代汉语中代词指向含混。
- source_word: הַעֵלְנִי קֳדָם מַלְכָּא
  choice: 请领我到王面前
  rationale: 使役命令形式直译为使我进去或上去，קֳדָם表示在王面前；“领我到王面前”符合宫廷情境。“请”体现汉语请求语气，不改变命令式内容。
- source_word: וּפִשְׁרָא
  choice: 解梦之意
  rationale: פְּשַׁר指梦或奥秘的解释。本节语境明确是王梦的解释；“解梦之意”自然且与叙事内容紧密相连。
- source_word: אֲחַוֵּא
  choice: 我会……告诉
  rationale: 该动词可表示显明、使人知道。“告诉”在以解释为宾语、以王为间接对象的汉语结构中自然，并保留“使王知道”的核心意义。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。保留“消灭”在本节两次出现的词汇对应，不把它直接窄化为“杀死”；用“智慧人”维持但以理书宫廷术语的一致性。原文没有需要以脚注标出的实质文本异读或神学歧义。
