  text: חָזֵ֣ה הֲוַ֗יְתָ עַ֠ד דִּ֣י הִתְגְּזֶ֤רֶת אֶ֨בֶן֙ דִּי לָ֣א בִ/ידַ֔יִן וּ/מְחָ֤ת לְ/צַלְמָ/א֙ עַל רַגְל֔וֹ/הִי דִּ֥י פַרְזְלָ֖/א וְ/חַסְפָּ֑/א וְ/הַדֵּ֖קֶת הִמּֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/034.yaml
  text: You were watching until a stone was cut out[a], not by hands[b], and it struck the statue on its feet of iron and clay and crushed them.
translation:
  language: zh_hans
  text: 你一直在观看，直到有一块石头被凿出来，不是人手凿出来的[a]；它击中那座雕像[b]的铁和泥的脚，把双脚砸得粉碎。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“不是用手凿出来的”。这句亚兰文表达指出，这石头不是由人力凿出的。
    reason: idiom_clarification
  - marker: b
    text: “雕像”也可译作“像”或“形像”；这里指梦中所见的巨大人形。
    reason: lexical_alternative
lexical_decisions:
- source_word: חָזֵה הֲוַיְתָ
  choice: 你一直观看
  rationale: 分词与הוה的组合表达过去持续进行的动作；“一直观看”既保留延续性，也符合现代汉语。
- source_word: עַד דִּי
  choice: 直到
  rationale: 引出观看持续到的时间节点，直译为“直到”自然准确。
- source_word: הִתְגְּזֶרֶת אֶבֶן
  choice: 有一块石头被凿出来
  rationale: 保留动词的被动含义；“凿出来”符合石头从整体中被切取的语境。
- source_word: דִּי לָא בִידַיִן
  choice: 却不是人手凿的
  rationale: 既贴近“不是用手”的字面表达，也在汉语中清楚表明并非出于人的施为；“却”凸显与通常凿石方式的反差。
- source_word: וּמְחָת
  choice: 石头击在
  rationale: 阴性单数动词回指“石头”；汉语重提主语可避免指代含混，“击在”体现猛烈撞击。
- source_word: לְצַלְמָא
  choice: 那像
  rationale: צלם可指形像或雕像；“那像”简洁并承接梦中所见，脚注保留“雕像”这一更具体的译法。
- source_word: עַל רַגְלֹוהִי דִּי פַרְזְלָא וְחַסְפָּא
  choice: 由铁和陶土构成的脚上
  rationale: 明确关系从句修饰脚，并按上下文将材料关系自然译出；חסף在此指陶土。
- source_word: וְהַדֵּקֶת הִמּוֹן
  choice: 把双脚砸得粉碎
  rationale: 动词表示压碎、粉碎；宾语复数代词回指脚。“砸得粉碎”力度充足，“双脚”自然体现复数所指。
theological_decisions:
- issue: “不是用手”所表达的非人力施为
  choice: 却不是人手凿的
  alternative: 不是用手凿出来的
  rationale: 正文既保留“手”的原文意象，又以自然汉语表明石头并非由人凿出；不进一步指明施为者，以免超出本节原文并提前消解其神学张力。
- issue: צלם所指梦中形体的译法
  choice: 像
  alternative: 雕像
  rationale: 原词可涵盖“像”与“雕像”；正文采用范围较宽的“像”，脚注提供更具体且符合场景的译法，不将词义收窄为唯一解释。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“你一直观看”保留亚兰文的持续体意味；分为两句以避免汉语长句拖沓，同时不改变事件次序。正文所有脚注标记均已对应出现。
