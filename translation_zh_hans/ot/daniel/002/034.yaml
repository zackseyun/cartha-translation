revisions:
- from: 你一直观看，直到有一块石头被凿出来，却不是人手凿的[a]。石头击在那像[b]由铁和陶土构成的脚上，把双脚砸得粉碎。
  to: 你一直在观看，直到有一块石头被凿出来，不是人手凿出来的[a]；它击中那座雕像[b]的铁和泥的脚，把双脚砸得粉碎。
  rationale: 修订使措辞更符合现代标准汉语，并更贴合梦中巨大人形的语境。“不是人手凿出来的”保留原文“手”的意象及非人力施为的含义，但不对施为者作神学性推断。脚注标记均保留并与正文对应。
