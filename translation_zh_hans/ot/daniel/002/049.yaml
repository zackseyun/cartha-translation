  text: וְ/דָנִיֵּאל֙ בְּעָ֣א מִן מַלְכָּ֔/א וּ/מַנִּ֗י עַ֤ל עֲבִֽידְתָּ/א֙ דִּ֚י מְדִינַ֣ת בָּבֶ֔ל לְ/שַׁדְרַ֥ךְ מֵישַׁ֖ךְ וַ/עֲבֵ֣ד נְג֑וֹ וְ/דָנִיֵּ֖אל בִּ/תְרַ֥ע מַלְכָּֽ/א־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/049.yaml
  text: And Daniel requested of the king[a], and he appointed Shadrach, Meshach, and Abed-nego over the administration of the province of Babylon. But Daniel remained at the king’s court.
translation:
  language: zh_hans
  text: 但以理向王提出请求，王便委派沙得拉、米煞、亚伯尼歌负责巴比伦省的政务。但以理则在王的宫廷里[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“在王的门口”。这里可能指王室处理政务、接近君王的地方，即王的宫廷或朝廷。
    reason: 保留 בִּתְרַע מַלְכָּא 的字面意象及其可能的行政含义，避免正文的意译掩盖原文表达。
lexical_decisions:
- source_word: בְּעָא מִן מַלְכָּא
  choice: 向王请求
  rationale: בְּעָא 表示询问或请求；与 מִן 连用时，这里是向王提出请求。“向王请求”符合现代汉语宫廷语境，又不把它强化为正式的法律请愿。
- source_word: וּמַנִּי
  choice: 王便委派
  rationale: 该动词是第三人称阳性单数，意为设置、指派或任命。原文没有明说主语，但上下文自然指向王；汉语补出“王”可避免代词指向含混。“委派”也贴合行政职务的语境。
- source_word: עַל עֲבִידְתָּא דִּי מְדִינַת בָּבֶל
  choice: 负责巴比伦省的政务
  rationale: עֲבִידְתָּא 可指工作、事务或行政事务；在省级治理的上下文中译为“政务”最自然。עַל 表示掌管或负责，מְדִינָה 在帝国行政语境中指“省”。
- source_word: לְשַׁדְרַךְ מֵישַׁךְ וַעֲבֵד נְגוֹ
  choice: 沙得拉、米煞、亚伯尼歌
  rationale: 采用现代中文圣经读者熟悉的人名译法；前缀 לְ 标明受委派的人。
- source_word: וְדָנִיֵּאל
  choice: 但以理则
  rationale: 连接词 וְ 在这里承接前文，同时形成角色与任职地点上的对照；“则”自然呈现这种对比，却不过度强化为转折。
- source_word: בִּתְרַע מַלְכָּא
  choice: 在王的宫廷里
  rationale: 字面是“在王的门口／门廷”。古代近东语境中的王门是办理王室事务、接近君王的行政场所，因此正文采用现代读者易懂的“宫廷”，并在脚注保留字面表达及其语义范围。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“负责……政务”清楚表达省级行政职责；末句保留原文简短的名词性陈述，不额外加入“留下”“任职”等原文未明说的动作。
