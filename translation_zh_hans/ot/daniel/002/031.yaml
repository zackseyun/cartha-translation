base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/031.yaml
  text: You[a], O king, were watching, and behold, there was one great statue[b]. That statue was immense, and its splendor was extraordinary; it was standing before you[c], and its appearance was terrifying.
translation:
  language: zh_hans
  text: 王啊，你[a]当时正观看，看哪，有一尊巨大的像[b]。这尊像十分庞大，光辉非凡；它站在你面前，外貌令人畏惧[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文句首明确使用“你”，带有直接强调的意味。
    reason: discourse_emphasis
  - marker: b
    text: 亚兰文 צְלֵם 也可译作“形像”或“雕像”；这里所描写的是一尊立在王面前的巨大可见形体，因此译作“像”。
    reason: lexical_alternative
  - marker: c
    text: 或译：“它的外观十分可怕。”原文形容其样貌会使人产生恐惧。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַ֣נְתְּה מַלְכָּ֗א
  choice: 王啊，你
  rationale: 保留第二人称直接称呼和宫廷语境中的呼格；把代词明确译出，以传达原文句首的强调。
- source_word: חָזֵ֤ה הֲוַ֨יְתָ֙
  choice: 当时正观看
  rationale: 分词与助动词的组合表示过去持续进行的动作；“当时正观看”自然保留其延续性。
- source_word: וַאֲלוּ
  choice: 看哪
  rationale: 这是引出异象中突然呈现之物的指示性叹词；“看哪”兼顾庄重语体和突现感。
- source_word: צְלֵ֥ם חַד֙ שַׂגִּ֔יא
  choice: 一尊巨大的像
  rationale: צְלֵם可指像、雕像；量词“尊”显示这里是可见而立着的巨大形体。חַד明确译作“一”，שַׂגִּיא译作“巨大”。
- source_word: צַלְמָא דִּכֵּן רַב
  choice: 这像极其高大
  rationale: דִּכֵּן回指刚提到的像，译作“这”；רַב再次强调其巨大，用“极其高大”保留递进而避免机械重复。
- source_word: וְזִיוֵהּ יַתִּיר
  choice: 光辉非凡
  rationale: זִיו可指光辉、荣光或亮度，יַתִּיר表示超常、非凡；译文保留其视觉上的强烈光彩。
- source_word: קָאֵם לְקָבְלָךְ
  choice: 它站在你面前
  rationale: 分词描写异象中的静态场景；לְקָבְלָךְ可指在你面前或与你相对，此处采用自然且不缩窄含义的表达。
- source_word: וְרֵוֵהּ דְּחִיל
  choice: 样貌令人畏惧
  rationale: רֵו指外观、样貌，דְּחִיל表示可怕、引发恐惧；“令人畏惧”既说明其效果，也保持庄重。
