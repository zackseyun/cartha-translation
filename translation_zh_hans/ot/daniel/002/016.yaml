base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/016.yaml
  text: So Daniel went in and asked the king to give him time, so that he might make the interpretation known to the king.
translation:
  language: zh_hans
  text: 于是，但以理进去，求王给他一段时间，好把解说呈明给王。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַל
  choice: 进去
  rationale: 此处亚兰语动词指进入王所在之处或进到王面前；现代汉语用“进去”简洁自然，并保留原文未明说具体地点的特点。
- source_word: זְמָן
  choice: 一些时间
  rationale: 指为处理此事而获得的一段期限；“一些时间”比单说“时间”更符合现代汉语请求宽限的表达。
- source_word: פִשְׁרָא
  choice: 梦的解释
  rationale: 该词意为“解释、解明”；结合本章语境，所解释的是王的梦。补出“梦的”可避免汉语歧义，但不增添原文之外的神学判断。
- source_word: לְהַחֲוָיָה
  choice: 告诉
  rationale: 使役不定式意为“使人知道、说明、告知”；“告诉”在此自然清楚，表达但以理要把解释呈明给王。
theological_decisions:
- issue: 但以理请求时间的目的
  choice: 好让他把梦的解释告诉王
  alternative: 并把梦的解释告诉王
  rationale: 原文关系词 דִּי 在此自然引出目的或结果。采用“好让”保留其目的性，不把但以理当时尚未获得的解释说成已经掌握。
translation_notes:
  register: 采用现代、庄重而通顺的叙事语体。“于是”承接前文；“请求王给他一些时间”符合现代汉语，又忠实表达原文。未添加脚注，因为本节没有必须由脚注保留的文本异读或重要歧义。
