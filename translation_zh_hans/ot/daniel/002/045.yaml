  to: 正如你所看见的：有一块石头从山中凿出，不是用手凿出的[a]；它把铁、铜、泥、银和金都砸碎了。伟大的上帝已经把此后将要发生的事告诉了王。这个梦是确定的，它的解释也是可靠的。
  rationale: 修订“从山上”为“从山中”，以准确表达石头从山体中切出的意象；将梦的性质译为“确定的”，并将“可靠的”用于其解释，较好反映原文两个不同形容词的语义重点。其余内容保持不变。
