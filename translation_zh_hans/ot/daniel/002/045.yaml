reference: Daniel 2:45
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כָּ/ל קֳבֵ֣ל דִּֽי חֲזַ֡יְתָ דִּ֣י מִ/טּוּרָ/א֩ אִתְגְּזֶ֨רֶת אֶ֜בֶן דִּי לָ֣א בִ/ידַ֗יִן וְ֠/הַדֶּקֶת פַּרְזְלָ֨/א נְחָשָׁ֤/א חַסְפָּ/א֙ כַּסְפָּ֣/א וְ/דַהֲבָ֔/א אֱלָ֥הּ רַב֙ הוֹדַ֣ע לְ/מַלְכָּ֔/א מָ֛ה דִּ֥י לֶהֱוֵ֖א אַחֲרֵ֣י דְנָ֑ה וְ/יַצִּ֥יב חֶלְמָ֖/א וּ/מְהֵימַ֥ן פִּשְׁרֵֽ/הּ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/045.yaml
  text: Just as you saw that a stone was cut from the mountain not by hands[a], and that it crushed the iron, the bronze, the clay, the silver, and the gold, the great God has made known to the king what will happen after this. The dream is certain, and its interpretation is trustworthy.
translation:
  language: zh_hans
  text: 正如你所看见的：有一块石头从山中凿出，不是用手凿出的[a]；它把铁、铜、泥、银和金都砸碎了。伟大的上帝已经把此后将要发生的事告诉了王。这个梦是确定的，它的解释也是可靠的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“不是由手凿出来的”或“未经人手”；亚兰语这一表达说明石头并非出于人的作为。
    reason: 说明原文习语的直译形式及其所暗示的非人力施为，同时不在正文中消除其含蓄性。
lexical_decisions:
- source_word: כָּל־קֳבֵל דִּי
  choice: 正如
  rationale: 该亚兰语短语引出与梦中景象相对应的解释；“正如”兼顾比较与说明作用，也符合现代汉语表达。
- source_word: מִטּוּרָא אִתְגְּזֶרֶת אֶבֶן
  choice: 有一块石头从山上凿出来
  rationale: 保留定指的“山”和动词的被动意义；汉语以“凿出来”自然呈现石头从山中被切出的空间意象。
- source_word: דִּי לָא בִידַיִן
  choice: 却不是用手凿的
  rationale: 尽量保留“不是用手”的原文习语，不在正文中直接补成“不是人手”，以保存非人力施为的含蓄神学意味。
- source_word: וְהַדֶּקֶת
  choice: 它把……都砸碎了
  rationale: 该动词有压碎、粉碎之意；“砸碎”具体有力，并以“它”明确承接石头。
- source_word: פַּרְזְלָא נְחָשָׁא חַסְפָּא כַּסְפָּא וְדַהֲבָא
  choice: 铁、铜、泥、银和金
  rationale: 严格保留亚兰文在本节中的材料顺序；נְחָשָׁא在此指铜或青铜，正文采用传统且简洁的“铜”。
- source_word: אֱלָהּ רַב
  choice: 伟大的上帝
  rationale: 直接呈现名词加形容词的称谓，不额外引入“至高”等原文未明说的头衔。
- source_word: הוֹדַע לְמַלְכָּא
  choice: 已经把……告诉了王
  rationale: 使役动词意为“使知道”；“告诉了王”是清楚自然的现代汉语，同时保留完成意义。
- source_word: מָה דִּי לֶהֱוֵא אַחֲרֵי דְנָה
  choice: 此后将要发生的事
  rationale: 准确表达该从句的未来指向，语言简明庄重。
- source_word: וְיַצִּיב חֶלְמָא
  choice: 这个梦确实可靠
  rationale: יַצִּיב表示确定、稳固、可信；“确实可靠”在汉语中自然地表达梦的确定性。
- source_word: וּמְהֵימַן פִּשְׁרֵהּ
  choice: 它的解释也可信
  rationale: מְהֵימַן意为可信、可靠；以“可信”避免与前句机械重复，同时保留对解释可靠性的断言。
theological_decisions:
- issue: “不是用手”所暗示的施为者
  choice: 正文保留“却不是用手凿的”的含蓄表达
  alternative: 不是人手凿出来的／未经人手
  rationale: 原文暗示非人力、最终属神的作为，却没有在该短语内明说施为者；保留习语可避免把隐含意义直接解释进正文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。冒号和分号梳理梦中景象的长句结构；材料名称依原文次序排列。正文避免古雅的“非人手所凿”，也不把隐含的神圣施为扩写为明说。
source_grounding:
  english_pob_role: consult_only
