  register: 采用现代、庄重而易懂的叙事语体。“问道”避免照搬闪语复合套语造成汉语累赘；“严急”刻意保留 מְהַחְצְפָה 在严厉与急迫之间的语义张力。所有脚注标记均已置于正文相应位置。
