base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/015.yaml
  text: He answered and said to Arioch[a], the king’s commander[b], “Why is the decree so harsh from before the king?” Then Arioch made the matter known to Daniel.
translation:
  language: zh_hans
  text: 他就对王的官长亚略[a]问道：“王为什么下了这么严厉的命令[b]？”于是亚略把这事告诉了但以理。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 亚略是奉命处死巴比伦智者的王室官员（见本章14节）。“官长”也可译作“掌权者”或“官员”。
    reason: lexical_alternative
  - marker: b
    text: “王……下了”原文直译为“从王面前”，是指这命令出自王本人或王的权威。原文“严厉”也可含有急迫或仓促施行的意味。
    reason: cultural_note
lexical_decisions:
- source_word: עָנֵה וְאָמַר
  choice: 问道
  rationale: 这是闪语叙事中常见的复合表达；在本句语境中其后直接引出问话，现代汉语用“问道”自然地传达其功能，避免生硬直译为“回答说”。
- source_word: שַׁלִּיטָא דִי מַלְכָּא
  choice: 王的官长
  rationale: שַׁלִּיטָא 泛指有权柄的官员；上下文显示亚略奉命执行王令，但本词本身未明确限定具体军衔，故译“官长”以保留范围。
- source_word: עַל מָה
  choice: 为什么
  rationale: 符合现代汉语问因表达。
- source_word: דָתָא
  choice: 命令
  rationale: 此处指王所颁布并交付执行的法令；“命令”在问句中自然，也符合上下文的行政权威语境。
- source_word: מְהַחְצְפָה
  choice: 严急
  rationale: 该词兼有严厉、急迫或仓促施行的意味；“严急”力求同时保留命令的严峻性和紧迫性，不单方面消解其词义张力。
- source_word: מִן קֳדָם מַלְכָּא
  choice: 王……下了
  rationale: 原文直译为“从王面前”，是表示命令出自王本人或王权的亚兰语习语；汉语正文按其功能自然表达，并在脚注说明原貌。
- source_word: אֱדַיִן
  choice: 于是
  rationale: 自然表达叙事推进及前后承接。
- source_word: מִלְּתָא
  choice: 这事
  rationale: 该宽泛名词在此指王令及其缘由或相关情况；“这事”自然且不作过度限定。
- source_word: הוֹדַע
  choice: 告诉
  rationale: 该使役形式意为“使知道”；现代汉语“告诉”简洁自然地保留这一语义。
