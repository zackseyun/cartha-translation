source:
  edition: WLC
  text: בְּרַ֡ם אִיתַ֞י אֱלָ֤הּ בִּ/שְׁמַיָּ/א֙ גָּלֵ֣א רָזִ֔ין וְ/הוֹדַ֗ע לְ/מַלְכָּ/א֙ נְבֽוּכַדְנֶצַּ֔ר מָ֛ה דִּ֥י לֶהֱוֵ֖א בְּ/אַחֲרִ֣ית יוֹמַיָּ֑/א חֶלְמָ֨/ךְ וְ/חֶזְוֵ֥י רֵאשָׁ֛/ךְ עַֽל מִשְׁכְּבָ֖/ךְ דְּנָ֥ה הֽוּא־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/028.yaml
  text: 'But there is a God in heaven who reveals mysteries[a], and he has made known to King Nebuchadnezzar what will happen in the latter days. Your dream, and the visions of your head as you lay on your bed[c][b], were these:'
translation:
  language: zh_hans
  text: 然而，天上有一位揭示奥秘的上帝；他已经使尼布甲尼撒王知道，在末后的日子将要发生什么事[a]。你在床上所做的梦，以及你脑中所见的异象[b]，就是这样：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “末后的日子”也可译作“日后”。这个短语可以指未来一个具有终局意义的时期，但本身并未限定某一种末世论体系。
    reason: lexical_alternative
  - marker: b
    text: “你脑中所见的异象”，原文直译为“你头脑的异象”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרַם
  choice: 然而
  rationale: 这是转折语气，承接上文巴比伦智者无力解明奥秘的处境；“然而”自然且庄重。
- source_word: אִיתַי אֱלָהּ בִּשְׁמַיָּא
  choice: 天上有一位上帝
  rationale: 保留存在句以及原文形式上的不定性，同时以“上帝”明确所指是真神；“一位”也符合现代汉语对有位格者的表达。
- source_word: גָּלֵא רָזִין
  choice: 他能揭示奥秘
  rationale: 分词描述上帝作为奥秘启示者的特征；“揭示奥秘”保留但以理书中隐藏之事由神显明的主题。“能”在汉语中自然表达其特有能力，而非仅指一次行动。
- source_word: וְהוֹדַע
  choice: 他已经让……知道
  rationale: 保留使役意义，并与前面的“揭示”作词义区分；“已经”体现已完成且与当前相关的行动。
- source_word: מָה דִּי לֶהֱוֵא
  choice: 将要发生的事
  rationale: 以自然现代汉语表达未来指向，不拘泥于较生硬的“将要成为的事”。
- source_word: בְּאַחֲרִית יוֹמַיָּא
  choice: 日后
  rationale: 简洁表达未来较后的时日，并避免把该短语限定为某一种特定末世体系；脚注列出更具末世色彩的译法。
- source_word: חֶלְמָךְ וְחֶזְוֵי רֵאשָׁךְ
  choice: 你……所做的梦，以及脑中所见的异象
  rationale: “脑中所见的异象”自然传达“你头脑的异象”这一闪语习语，同时用脚注保留其字面形式。
- source_word: עַל מִשְׁכְּבָךְ
  choice: 你躺在床上时
  rationale: 表达梦与异象发生时的情境，符合现代汉语习惯，也不额外扩展原意。
- source_word: דְּנָה הוּא
  choice: 是这样的
  rationale: 自然引出下文将叙述的梦境内容，并保留单数指示表达的概括功能。
theological_decisions:
- issue: אֱלָהּ בִּשְׁמַיָּא 在一神论语境中的不定形式
  choice: 天上有一位上帝
  alternative: 天上有上帝；天上有那位上帝
  rationale: 原文在形式上是不定的，但上下文明指以色列的真神。“一位上帝”兼顾亚兰文形式与宫廷语境；“上帝”的用字又避免让读者误以为是泛指某个异教神明。
- issue: בְּאַחֲרִית יוֹמַיָּא 的时间与末世含义
  choice: 日后
  alternative: 末后的日子；末日
  rationale: 该短语可指未来的高潮时期，却未自行界定某一种末世论框架。“日后”在正文中自然且开放，脚注保留“末后的日子”这一可能译法。
translation_notes:
  register: 采用现代、庄重而清楚的普通话。“然而”体现与上文的对照；整句调整为符合汉语信息顺序的表达。保留“上帝”短语的不定性和“日后”的时间张力，并通过脚注说明字面形式及其他合理译法。
