    issue: “他能揭示奥秘”将分词性描述偏向能力表述。
    rationale: גָּלֵא 是描述神作为“揭示奥秘者”的分词；汉语以“揭示奥秘的上帝”更直接保留其特征性功能，不将重点限于“能够”。
  - severity: medium
    issue: “日后”弱化了“在末后的日子里”的原文措辞。
    rationale: 日后可泛指任何后来的时候；“末后的日子”较完整地保留 אַחֲרִית 与 יוֹמַיָּא 的时间张力和复数形式，同时不强加末世体系。
  - severity: low
    issue: 床上的时间短语在现有汉语结构中主要贴近“所做的梦”。
    rationale: 原文将梦与头脑的异象并列，并在床上这一场景中陈述；重组并列成分可使中文读者更自然地将该场景理解为整项梦中经历。
  - severity: low
