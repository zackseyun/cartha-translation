base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/013.yaml
  text: So the decree went out[a], and the wise men were being killed[b]; and they sought Daniel and his companions to kill them.
translation:
  language: zh_hans
  text: 于是，谕令颁布了[a]，智者们正被处死[b]；他们又寻找但以理和他的同伴，要把他们杀死。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“出去了”，指王的谕令正式发出。
    reason: lexical_alternative
  - marker: b
    text: 或译“正被杀害”。原文形式表明处决行动已经开始并在进行。
    reason: lexical_alternative
lexical_decisions:
- source_word: דָתָא
  choice: 谕令
  rationale: 指王所颁的正式命令；“谕令”既体现宫廷和法律语境，又是现代读者能够理解的庄重表达。
- source_word: נֶפְקַת
  choice: 颁布了
  rationale: 原义为“出去了”，在此指王令正式发出并生效；正文采用自然汉语“颁布了”，脚注保留原文意象。
- source_word: חַכִּימַיָּא
  choice: 智者们
  rationale: 这是但以理书中对王宫博学顾问群体的称谓；“智者”比“智慧人”更符合现代标准汉语，同时不把范围缩窄为某一种术士。
- source_word: מִתְקַטְּלִין
  choice: 正被处死
  rationale: 被动分词表现行动正在进行；“正被处死”清楚传达处决已经展开，并符合官方谕令的语境。
- source_word: וּבְעוֹ
  choice: 人也搜寻
  rationale: 该动词在这里表示寻找；原文未明说主语是谁，故以泛指“人”保留这种不明确性，而不擅自补成特定官员。
- source_word: חַבְרוֹהִי
  choice: 他的同伴
  rationale: 指与但以理一同任职、共同经历事件的人；“同伴”准确而不如“朋友”那样偏重私人情谊。
- source_word: לְהִתְקְטָלָה
  choice: 要把他们杀死
  rationale: 目的不定式表达搜寻他们是为了处死他们；补出复数“他们”，自然指但以理及其同伴。
theological_decisions: []
