  yaml_path: translation/ot/daniel/002/012.yaml
  text: Because of this[a], the king became furious and very enraged[b], and he commanded that all the wise men of Babylon be destroyed.
translation:
  language: zh_hans
  text: 为此[a]，王勃然大怒，怒气极盛，并下令[b]除灭巴比伦所有的智者。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因此”或“因为这事”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“说”，但在王室命令的语境中指颁下命令，故译为“下令”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל־קֳבֵל דְּנָה
  choice: 因此
  rationale: 这是表示原因或结果的亚兰语短语；“因此”简洁自然，并保留与上文明确的因果联系。
- source_word: מַלְכָּא
  choice: 王
  rationale: 强调形表示特指；上下文已明确所指，现代汉语叙事中译作“王”自然准确。
- source_word: בְּנַס
  choice: 勃然大怒
  rationale: 该动词表示发怒、震怒；“勃然大怒”体现怒气骤发，也与后续怒词形成递进。
- source_word: וּקְצַף שַׂגִּיא
  choice: 十分恼恨
  rationale: קְצַף 表示盛怒、恼恨，שַׂגִּיא 加强程度；此译保留原文两个怒词的叠加，同时避免中文机械重复。
- source_word: וַאֲמַר
  choice: 就下令
  rationale: 字面是“说”，但在王命及其不定式内容的语境中具有颁令功能；“下令”准确传达语用力度。
- source_word: לְהוֹבָדָה
  choice: 灭绝
  rationale: 源自动词 אבד 的使役形式，意为使之灭亡；“灭绝”保留针对整个群体的毁灭性命令。
- source_word: לְכֹל חַכִּימֵי בָבֶל
  choice: 巴比伦所有的智者
  rationale: 准确表达全称范围及所属关系；“智者”适合指宫廷中的智慧阶层，且比“聪明人”更符合庄重叙事语体。
