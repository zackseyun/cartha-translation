  text: עָנֵ֤ה מַלְכָּ/א֙ וְ/אָמַ֣ר ל/כשדי/א מִלְּתָ֖/א מִנִּ֣/י אַזְדָּ֑א הֵ֣ן לָ֤א תְהֽוֹדְעוּנַּ֨/נִי֙ חֶלְמָ֣/א וּ/פִשְׁרֵ֔/הּ הַדָּמִין֙ תִּתְעַבְד֔וּן וּ/בָתֵּי/כ֖וֹן נְוָלִ֥י יִתְּשָׂמֽוּן׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/005.yaml
  text: 'The king answered and said to the Chaldeans[a], “The word from me is firm: if you do not make known to me the dream and its interpretation, you will be made into limbs[b], and your houses will be made a refuse heap.”'
translation:
  language: zh_hans
  text: 王回答迦勒底人说：“我的话已经定了：[a]你们若不把那梦和梦的解释告诉我，就必被肢解，[b]你们的房屋也必沦为粪堆。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“话已从我发出。”
    reason: alternative_reading
  - marker: b
    text: 亚兰语直译为“被做成肢体”，意指身体被肢解；传统上也译作“被剁成碎块”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְכָּא
  choice: 王
  rationale: 这是该亚兰语王室称号在现代汉语叙事中的标准对应词，简洁庄重。
- source_word: לכשדיא
  choice: 迦勒底人
  rationale: 保留原文的族群兼职业称谓，不在正文中解释性改译为“占星家”等职衔。
- source_word: מִלְּתָא מִנִּי אַזְדָּא
  choice: 我的话已经定了
  rationale: אַזְדָּא 的含义有争议；结合下文的王命与威吓，此处表达决定已定最为贴切，同时用脚注保留“话已从我发出”的可能解释。
- source_word: תְהוֹדְעוּנַּנִי
  choice: 告诉我
  rationale: 该使役形式直译为“使我知道”；现代汉语用“告诉我”自然准确，也保留使对方获知的语义。
- source_word: חֶלְמָא וּפִשְׁרֵהּ
  choice: 那梦和梦的解释
  rationale: פִשְׁרֵהּ 在《但以理书》中指梦或异象的解释；重复“梦的”可避免汉语代词指向含混。
- source_word: הַדָּמִין תִּתְעַבְדוּן
  choice: 必被肢解
  rationale: הַדָּמִין 字面涉及肢体，整个短语表示使受刑者成为分离的肢体；“被肢解”在现代汉语中准确、自然地传达被动处刑及身体意象。
- source_word: נְוָלִי יִתְּשָׂמוּן
  choice: 必沦为粪堆
  rationale: 该名词表示污秽、可耻的废弃之地，传统上常指粪堆；“沦为”兼顾被置为某种状态的被动含义和汉语表达。
theological_decisions:
- issue: מִנִּי אַזְדָּא 的解释
  choice: 正文译作“我的话已经定了”
  alternative: “话已从我发出”
  rationale: 前者符合王的要求不可更改这一语境，但原语短语确有“发出／离去”方向的解释传统，因此在脚注中保留歧义。
- issue: הַדָּמִין 所描述的刑罚
  choice: 译作“被肢解”
  alternative: “被剁成碎块”或更字面的“被做成肢体”
  rationale: 原文明确保留身体肢体的暴力意象；“被肢解”既不弱化刑罚，也避免现代汉语中无法自然成立的生硬逐词对应。
- issue: נְוָלִי 的具体所指
  choice: 译作“粪堆”
  alternative: “垃圾堆”或“废墟”
  rationale: 该词含污秽与羞辱意味；“粪堆”保留较强而传统的形象，但不据此扩展任何额外神学含义。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“王回答……说”保留原文叙事公式；王的话则以直接、强硬的语气呈现。正文中的每个脚注标记均与脚注对应。
