  text: בֵּ֠/אדַיִן מַלְכָּ֤/א נְבֽוּכַדְנֶצַּר֙ נְפַ֣ל עַל אַנְפּ֔וֹ/הִי וּ/לְ/דָנִיֵּ֖אל סְגִ֑ד וּ/מִנְחָה֙ וְ/נִ֣יחֹחִ֔ין אֲמַ֖ר לְ/נַסָּ֥כָה לֵֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/046.yaml
  text: Then King Nebuchadnezzar fell on his face and paid homage to Daniel[c][b][a], and he commanded that an offering and incense be offered to him.
translation:
  language: zh_hans
  text: 于是，尼布甲尼撒王俯伏在地，向但以理下拜[a]，又吩咐人把供物和香料[b]献给他[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“敬拜但以理”或“向但以理致敬”。亚兰语动词可指下拜、敬拜或表达崇高敬意；正文译作“下拜”，保留王俯伏所表明的极度尊崇，而不断定这必然是把但以理当作神明来敬拜。
    reason: alternative_reading
  - marker: b
    text: 或译“馨香”或“悦人的香气”。
    reason: lexical_alternative
  - marker: c
    text: “献给”所译的动词更具体地可指倾倒液体作奠祭，即“浇献给他”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: 于是
  rationale: 这是承接叙事次序的亚兰语标记；“于是”自然地引出紧接着发生的事。
- source_word: נְפַל עַל אַנְפּוֹהִי
  choice: 俯伏在地
  rationale: 原文直译为“俯伏在自己的脸上”，描写完全伏地的姿态；“俯伏在地”既自然，又保留动作的强烈程度。
- source_word: סְגִד
  choice: 致敬
  rationale: 该动词可指俯伏、敬拜或表达崇高敬意。此处受礼者是但以理，因此正文用“致敬”保留尊崇含义而不武断认定为对神明的敬拜，并以脚注列出其他可能译法。
- source_word: מִנְחָה
  choice: 供物
  rationale: 该词可指礼物、贡物或祭献之物；上下文带有礼仪和献祭色彩，“供物”既保留此色彩，又不限定具体种类。
- source_word: נִיחֹחִין
  choice: 馨香之物
  rationale: 该复数词字面涉及令人悦纳的香气。在献供语境中可理解为香品，但“馨香之物”更直接保留原词的意象和一定的指称开放性。
- source_word: אֲמַר לְנַסָּכָה לֵהּ
  choice: 吩咐人……献给他
  rationale: “说要……”在此具有命令意义，相关动词更具体地可指浇献或奠祭。正文采用自然而涵盖面较广的“献给”，脚注说明其更具体的词义。
theological_decisions:
- issue: סְגִד 用于但以理时，是译作“敬拜”还是较少神学限定的表达
  choice: 向但以理致敬
  alternative: 敬拜但以理；向但以理下拜
  rationale: 原词容许敬拜、俯伏和尊崇等含义。译作“致敬”不把但以理暗示为神明，同时仍保留王完全俯伏所表达的极度尊崇；脚注则保留“敬拜”和“下拜”的可能性。
- issue: 王所命令的献供是否应在正文明确描述为奠祭
  choice: 献给他
  alternative: 为他浇献；向他行奠祭
  rationale: 原动词带有倾倒液体作奠祭的具体色彩，但同时支配“供物”和“馨香之物”时，中文若一概译作“浇献”会显得生硬。正文采用较宽的“献给”，脚注保留奠祭含义，不消除此举所具有的宗教礼仪张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“俯伏在地”保留原文姿态的强烈程度；“供物”“馨香之物”维持礼仪语境，却避免过度限定祭物类别。全句保持原文令人不安的张力：王不仅向但以理俯伏致敬，还命人向他献上带有祭礼色彩的供物。
