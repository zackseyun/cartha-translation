  text: וּ/מַלְכוּ֙ רביעיה תֶּהֱוֵ֥א תַקִּיפָ֖ה כְּ/פַרְזְלָ֑/א כָּ/ל קֳבֵ֗ל דִּ֤י פַרְזְלָ/א֙ מְהַדֵּ֤ק וְ/חָשֵׁל֙ כֹּ֔לָּ/א וּֽ/כְ/פַרְזְלָ֛/א דִּֽי מְרָעַ֥ע כָּל אִלֵּ֖ין תַּדִּ֥ק וְ/תֵרֹֽעַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/040.yaml
  text: And the fourth kingdom will be strong like iron[a], because iron crushes and shatters everything; and like iron that breaks all these things[b], it will crush and shatter.
translation:
  language: zh_hans
  text: 第四个国必像铁一样强大[a]，因为铁能压碎、击碎一切；它必像那打碎这一切的铁[b]一样，将它们压碎、打碎。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文没有冠词，也可理解为“将有第四个国”；但按上下文，这是依次出现的第四个国。
    reason: lexical_alternative
  - marker: b
    text: “这一切”很可能指雕像异象中先前由不同材质代表的诸国。
    reason: cross_reference
lexical_decisions:
- source_word: וּמַלְכוּ רביעיה
  choice: 第四个国
  rationale: מַלְכוּ意为“国、王国”，רביעיה意为“第四”。汉语序数表达自然为“第四个国”；连接词וּ承接前文，在本句中无需机械译出“而”。
- source_word: תֶּהֱוֵא
  choice: 必……
  rationale: 此处未完成式指将来的状态；“必”既自然，也表达预告中的确定性，具体状态由“强大”承载。
- source_word: תַקִּיפָה כְּפַרְזְלָא
  choice: 像铁一样强大
  rationale: תַקִּיפָה表示强壮、强有力；比较词כְ引出铁的比喻。“像铁一样强大”符合现代汉语表达。
- source_word: כָּל קֳבֵל דִּי
  choice: 因为
  rationale: 该短语在此说明第四国为何像铁一样强大，具有明确的因果作用。
- source_word: מְהַדֵּק וְחָשֵׁל כֹּלָּא
  choice: 能压碎、击碎一切
  rationale: 两个动词共同描写铁强力破坏、使之碎裂的作用；用“压碎、击碎”保留并列和递进感，不合并为单一动作。
- source_word: וּכְפַרְזְלָא דִּי מְרָעַע
  choice: 它必像那打碎……的铁一样
  rationale: מְרָעַע表示打破、打碎。补出“它”指第四个国，使较长的阿拉姆语比较结构在汉语中清楚自然。
- source_word: כָּל אִלֵּין
  choice: 这一切
  rationale: 直译为“这一切”，保留指代范围；上下文很可能指异象中先前由不同材质代表的诸国，但不在正文中把解释写死。
- source_word: תַּדִּק וְתֵרֹעַ
  choice: 将它们压碎、打碎
  rationale: 两个动词分别表达压碎和打破。汉语补出由“这一切”承接而来的宾语“它们”，同时保留两个破坏性动作。
theological_decisions:
- issue: “这一切”所指的对象
  choice: 正文保留“这一切”，脚注说明其很可能指先前的诸国
  alternative: 在正文直接译成“先前各国”
  rationale: 原文使用指示语而未明说“诸国”；保留这一点可避免把上下文推断提升为原文字面内容。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“像铁一样强大”保留核心比喻；“压碎、击碎、打碎”呈现原文多个近义动词所形成的密集破坏意象。
