reference: Daniel 2:42
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/אֶצְבְּעָת֙ רַגְלַיָּ֔/א מנ/הון פַּרְזֶ֖ל ו/מנ/הון חֲסַ֑ף מִן קְצָ֤ת מַלְכוּתָ/א֙ תֶּהֱוֵ֣ה תַקִּיפָ֔ה וּ/מִנַּ֖/הּ תֶּהֱוֵ֥ה תְבִירָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/042.yaml
  text: And as the toes of the feet were partly iron and partly clay[a], so part of the kingdom will be strong[b], and part of it will be brittle.
translation:
  language: zh_hans
  text: 脚趾有的是铁，有的是泥[a]；照样，这国一部分会强盛，一部分会脆弱[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “泥”也可译作“陶土”或“陶器”。
    reason: lexical_alternative
  - marker: b
    text: “脆弱”也可译作“易碎”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶצְבְּעָת רַגְלַיָּא
  choice: 脚趾
  rationale: 该短语直译为“脚的趾头”；现代汉语“脚趾”已自然保留完整意象，无须重复说“脚的脚趾”。
- source_word: מנ/הון ... ו/מנ/הון
  choice: 有的是……有的是……
  rationale: 字面为“其中一些……其中一些”，这里说明脚趾由两种材料构成；此表达自然地传达混合组成。
- source_word: פַּרְזֶל
  choice: 铁
  rationale: 准确对应异象中所见的金属，并延续本章雕像的材料意象。
- source_word: חֲסַף
  choice: 泥
  rationale: 该亚兰语词指陶土或陶制材料；“泥”在铁与泥的对照中简洁自然，同时以脚注保留“陶土、陶器”的词义可能。
- source_word: מִן קְצָת מַלְכוּתָא
  choice: 这国一部分
  rationale: 保留“部分”的分配意义，表明同一个国具有不同部分，而非把它明确解释为多个国家。
- source_word: תֶּהֱוֵה
  choice: 会
  rationale: 在解释梦境的语境中表达将来的状态，符合现代汉语习惯。
- source_word: תַקִּיפָה
  choice: 强盛
  rationale: 表达力量和坚固；用于“国”比单说“强”更自然，同时不超出原词的强固含义。
- source_word: וּמִנַּהּ
  choice: 一部分
  rationale: 阴性单数后缀回指“国”；译出“一部分”可清楚呈现与前半句的分配对照。
- source_word: תְבִירָה
  choice: 脆弱
  rationale: 原词涉及破碎、易碎；在此不是断言该国已经破碎，而是描述其容易破裂的性质。“脆弱”自然地保留这一含义。
theological_decisions:
- issue: “国”的内部构成
  choice: 译为同一国“一部分……一部分……”。
  alternative: 解释为几个不同的国家或政权。
  rationale: 亚兰语的阴性单数后缀回指单数“国”，经文只说明其部分具有不同性质；不在翻译中加入特定历史或末世体系。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以“照样”明确连接脚趾的材料与国的性质；两个分号分句保留原文的类比和对称结构。所有脚注标记均已置于正文相应词后。
