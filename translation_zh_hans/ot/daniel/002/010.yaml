  text: עֲנ֨וֹ כשדי/א קֳדָם מַלְכָּ/א֙ וְ/אָ֣מְרִ֔ין לָֽא אִיתַ֤י אֲנָשׁ֙ עַל יַבֶּשְׁתָּ֔/א דִּ֚י מִלַּ֣ת מַלְכָּ֔/א יוּכַ֖ל לְ/הַחֲוָיָ֑ה כָּ/ל קֳבֵ֗ל דִּ֚י כָּל מֶ֨לֶךְ֙ רַ֣ב וְ/שַׁלִּ֔יט מִלָּ֤ה כִ/דְנָה֙ לָ֣א שְׁאֵ֔ל לְ/כָל חַרְטֹּ֖ם וְ/אָשַׁ֥ף וְ/כַשְׂדָּֽי־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/010.yaml
  text: The Chaldeans answered before the king and said, “There is not a man on earth who can make known the king’s matter, because no great and powerful king has asked for a thing like this from any diviner-priest, enchanter, or Chaldean.”
translation:
  language: zh_hans
  text: 迦勒底人在王面前回答说：“世上没有人能把王的事说出来，因为从来没有一位伟大而有权势的王向任何术士、法师或迦勒底人提出过这样的要求。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כשדי/א
  choice: 迦勒底人
  rationale: 此处指宫廷智者群体中的迦勒底人；保留族群兼职业称谓，不将其泛化为其他术士。
- source_word: עַל יַבֶּשְׁתָּא
  choice: 世上
  rationale: 字面为“在陆地上”，在本句是“世上、人间”的惯用表达；译作“世上”自然准确。
- source_word: מִלַּת מַלְכָּא
  choice: 王所问的事
  rationale: מִלָּה 可指言语、事情或要求；上下文是王要求他们说出梦及其解释，译文保留概括性，并以“所问”衔接后半句的 שְׁאֵל。
- source_word: יוּכַל לְהַחֲוָיָה
  choice: 能……说明白
  rationale: הַחֲוָיָה 意为使人知道、陈明；“说明白”符合对王揭示其所求之事的语境。
- source_word: רַב וְשַׁלִּיט
  choice: 伟大而有权势
  rationale: 分别表达“伟大”和“掌权、有统治力”，避免把两个并列形容词压缩为单一概念。
- source_word: חַרְטֹּם
  choice: 术士
  rationale: 指掌握秘术或祭司性知识的宫廷专家；现代中文以“术士”简洁表达，且不作过度具体化。
- source_word: אָשַׁף
  choice: 法师
  rationale: 指施行法术或咒术者；“法师”在此按古代宫廷术法语境理解，与“术士”并列。
- source_word: כִדְנָה
  choice: 这样的事
  rationale: 准确表达“像这样的一件事”，自然承接王提出的异常要求。
theological_decisions:
- issue: 迦勒底人的断言是叙事中人物的判断，而非经文作者直接作出的普遍神学命题
  choice: 按绝对语气译出“世上没有人”，并保留在直接引语中
  alternative: 加上“据我们所知”等限制语
  rationale: 原文没有限制语；直接引语已清楚标明这是迦勒底人的答复，后文将以神的启示回应其关于人无能为力的判断。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。保留宫廷陈述的正式语气；“术士、法师、迦勒底人”维持原文三个并列类别，不人为合并或赋予宗派性解释。
