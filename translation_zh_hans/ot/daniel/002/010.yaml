    issue: ‘王所问的事’、‘问过这样的事’可能将两处‘事/话’译成普通问答。
    rationale: מִלַּת מַלְכָּא 是‘王的事/话’，而 שְׁאֵל 此处是向宫廷专家提出这种异常要求。改译避免把‘使人知道’弱化为‘说明、解释一个问题’，同时不额外界定该事为何。
  revised_text: 迦勒底人在王面前回答说：“世上没有人能把王的事说出来，因为从来没有一位伟大而有权势的王向任何术士、法师或迦勒底人提出过这样的要求。”
