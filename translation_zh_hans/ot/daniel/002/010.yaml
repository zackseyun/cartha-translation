  to: 迦勒底人在王面前回答说：“世上没有人能把王的事说出来，因为从来没有一位伟大而有权势的王向任何术士、法师或迦勒底人提出过这样的要求。”
  rationale: 将两处可能造成‘问答’理解的表述调整为‘王的事’和‘提出过这样的要求’，以更贴近原文的措辞与句中所指的请求；其余译法保持不变。
