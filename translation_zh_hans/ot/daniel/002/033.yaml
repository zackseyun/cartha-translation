base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/033.yaml
  text: its legs were of iron[a], its feet partly of iron and partly of clay.
translation:
  language: zh_hans
  text: 它的腿是铁的，脚则一部分是铁，一部分是陶土[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “陶土”或译“陶器”“瓦器”；亚兰语 חֲסַף 可指黏土或陶制品。
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁקוֹהִי
  choice: 它的腿
  rationale: 该词指像的腿部；译作“腿”自然、明确，也与下文的“脚”形成解剖部位上的区分。
- source_word: דִּי
  choice: 是……的
  rationale: 关系词在这里连接身体部位与构成材料；汉语用“是铁的”自然表达这种材料关系。
- source_word: פַרְזֶל
  choice: 铁
  rationale: 这是该亚兰语金属名称的标准对应词，语境中没有改译的理由。
- source_word: רַגְלוֹהִי
  choice: 脚
  rationale: 此词在这里指脚，与前面的“腿”有别；保留区别可呈现异象中雕像身体部位的递进。
- source_word: מנ/הון
  choice: 一部分
  rationale: 字面意思近于“其中一些”，在此表示双脚的构成一部分为某种材料；译作“一部分”符合现代汉语习惯。
- source_word: ו/מנ/הון
  choice: 一部分
  rationale: 连词加同一分配表达，说明另一部分的材料；与前项组成“一部分……一部分……”的自然汉语结构。
- source_word: חֲסַף
  choice: 陶土
  rationale: 该词可指黏土或陶制材料；“陶土”既保留材料意象，也不强行限定为已经制成的陶器。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“脚则……”清楚承接前句并突出材料变化；“一部分……一部分……”准确传达原文的分配结构。
