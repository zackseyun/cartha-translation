  text: עָנֵה֩ מַלְכָּ֨/א לְ/דָנִיֵּ֜אל וְ/אָמַ֗ר מִן קְשֹׁט֙ דִּ֣י אֱלָהֲ/כ֗וֹן ה֣וּא אֱלָ֧הּ אֱלָהִ֛ין וּ/מָרֵ֥א מַלְכִ֖ין וְ/גָלֵ֣ה רָזִ֑ין דִּ֣י יְכֵ֔לְתָּ לְ/מִגְלֵ֖א רָזָ֥/ה דְנָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/047.yaml
  text: The king answered Daniel and said[a], “Truly, your God is God of gods and Lord of kings, and a revealer of mysteries, because you were able to reveal this mystery.”
translation:
  language: zh_hans
  text: 王回答但以理说：“你们的神实在是万神之神、万王之主，又是奥秘的揭示者[a]；因为你能揭示这个奥秘。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “奥秘”也可译作“秘密”。亚兰文可泛指隐藏的事；这里译作“奥秘”，以保留《但以理书》中神揭示隐秘之事的主题用语。
    reason: lexical_alternative
lexical_decisions:
- source_word: עָנֵה ... וְאָמַר
  choice: 回答……说
  rationale: 保留亚兰文叙事套语中的两个动词，在现代汉语中仍自然庄重。
- source_word: מִן קְשֹׁט
  choice: 实在
  rationale: 表达“确实、真正”的强调语气；“实在”符合现代汉语引语语境。
- source_word: אֱלָהֲכוֹן
  choice: 你们的神
  rationale: 后缀为第二人称阳性复数，指但以理及其同伴；译出复数，不将其收窄为仅指但以理。
- source_word: אֱלָהּ אֱלָהִין
  choice: 万神之神
  rationale: 表达构造链所强调的至高地位；中文传统而清楚，但不额外断言其他神明真实存在或王已完全归信。
- source_word: וּמָרֵא מַלְכִין
  choice: 万王之主
  rationale: מָרֵא意为主人、主宰；“万王之主”保留崇高的王权语域，并与前句形成自然对仗。
- source_word: וְגָלֵה רָזִין
  choice: 又是揭示奥秘的
  rationale: 分词表示神具有揭示隐藏之事的特征；此译法保留谓语性质，并避免生硬的名词化表达。
- source_word: רָזִין / רָזָה
  choice: 奥秘
  rationale: 该词指隐藏而由神显明的事；“奥秘”保留《但以理书》中神圣启示的主题词汇。
- source_word: דִּי יְכֵלְתָּ
  choice: 因为你能
  rationale: דִּי在此引出王作出宣告的依据；“因为”明确表达因果关系。
- source_word: לְמִגְלֵא רָזָה דְנָה
  choice: 揭示这个奥秘
  rationale: 与前面的גלה采用同一译词，保留词语复现；“这个”指刚才的梦及其解释。
theological_decisions:
- issue: 尼布甲尼撒的话是否意味着他已经完全接受独一神信仰
  choice: 译作对但以理之神至高地位的强烈承认：“万神之神、万王之主”。
  alternative: 增译为“唯有你们的神才是真神”，或反向弱化为仅仅众神之一。
  rationale: 亚兰文使用至高性的称号，却没有明确说王已弃绝一切其他神明。译文保留这种神学张力，既不削弱宣告，也不越过原文断言完全归信。
- issue: 揭示奥秘的能力属于神还是但以理本人
  choice: 保留“因为你能揭示”的字面归属，同时由上句明确神是揭示奥秘者。
  alternative: 释译为“因为神使你能够揭示”，以明确能力来源。
  rationale: 原文直接对但以理说“你能”，但上下文将奥秘的启示归于神。译文不增补因果机制，让二者之间的关系由原有张力呈现。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“万神之神、万王之主”形成整齐对仗，适合王的郑重宣告；“揭示”兼顾书面尊严与现代可读性。脚注标记置于整句末，所注词在正文中明确出现。
