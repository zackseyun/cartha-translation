base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/014.yaml
  text: Then Daniel answered Arioch[a], the chief of the king’s executioners, with counsel and discretion—the one who had gone out to kill the wise men of Babylon.
translation:
  language: zh_hans
  text: 于是，但以理以谋略和明辨回答王的侍卫长亚略[a]，就是那已经出去、要杀巴比伦智者的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “侍卫长”也可译作“王的行刑官长”。亚兰文官衔直译是“屠杀者之长”；在王宫语境中可指行刑官的首领，也可指王室侍卫的长官。
    reason: 保留原文官衔在“行刑官长”与“侍卫长”之间的词义可能。
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: 于是
  rationale: 这是亚兰文叙事推进语，承接前文并引出但以理随后的行动；“于是”自然、庄重。
- source_word: הֲתִיב
  choice: 回答
  rationale: 该动词在圣经亚兰文中常用于引出言语回应；此处虽未立即引出直接引语，仍可自然译为“回答”。
- source_word: עֵטָא וּטְעֵם
  choice: 谨慎明智地
  rationale: 两个名词合用，描述但以理回应时所表现的谋略、判断和分寸。汉语采用状语表达较自然，同时保留两个彼此相关而不完全相同的层面。
- source_word: לְאַרְיוֹךְ
  choice: 亚略
  rationale: 按现代中文圣经人名惯例音译 Arioch。
- source_word: רַב טַבָּחַיָּא דִּי מַלְכָּא
  choice: 王的侍卫长
  rationale: 原文直译近于“王的屠杀者之长”。宫廷语境中可指负责处决者或王室卫队长；正文采用通行且自然的官职表达，脚注保留“行刑官长”的可能。
- source_word: דִּי נְפַק
  choice: 当时已经出去
  rationale: 关系从句回指亚略；“已经”清楚呈现他在但以理回应之前已奉命出发的叙事先后。
- source_word: לְקַטָּלָה
  choice: 要杀
  rationale: 表示出去的目的；“杀”直接对应原文，也符合处死智者的上下文。
- source_word: לְחַכִּימֵי בָּבֶל
  choice: 巴比伦的智者
  rationale: 这是但以理书中的宫廷群体称谓；“智者”简洁保留原文类别名称，避免擅自限定为某一种术士。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“谨慎明智地回答”比逐字译作“以谋略和判断回答”更符合现代汉语，同时避免加入原文没有明说的内容。正文中的脚注标记[a]与脚注对应。
