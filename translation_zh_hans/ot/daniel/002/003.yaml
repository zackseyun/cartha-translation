  text: וַ/יֹּ֧אמֶר לָ/הֶ֛ם הַ/מֶּ֖לֶךְ חֲל֣וֹם חָלָ֑מְתִּי וַ/תִּפָּ֣עֶם רוּחִ֔/י לָ/דַ֖עַת אֶֽת הַ/חֲלֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/003.yaml
  text: And the king said to them[a], “I have dreamed a dream[c][b], and my spirit is troubled to know the dream.”
translation:
  language: zh_hans
  text: 王对他们说：“我做了一个梦，我心神不安，想要知道这梦。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר לָהֶם הַמֶּלֶךְ
  choice: 王对他们说
  rationale: 按希伯来语叙事句法自然转为现代汉语；“他们”明确保留介词短语所指的听话者。
- source_word: חֲלוֹם חָלָמְתִּי
  choice: 我做了一个梦
  rationale: 希伯来语以同源宾语结构“梦了一个梦”加强语气；汉语若直译会显得生硬，因此用自然且略带强调的“做了一个梦”。
- source_word: וַתִּפָּעֶם רוּחִי
  choice: 我心神不安
  rationale: 动词表示内在受到搅扰、激动不安；“心神”既保留 רוּחַ 所指的内在自我，又符合现代汉语表达。
- source_word: לָדַעַת אֶת־הַחֲלוֹם
  choice: 想要知道这梦
  rationale: לָדַעַת 直译为“知道”；保留宽泛含义，不擅自限定为知道梦的内容或解释。“这梦”也保留原文对“梦”的重复。
theological_decisions:
- issue: “知道这梦”究竟指回想梦的内容，还是明白梦的意义
  choice: 保留“知道这梦”的宽泛说法
  alternative: “知道这梦的意思”或“弄清梦的内容”
  rationale: 原文只说 לָדַעַת אֶת־הַחֲלוֹם，本节自身没有明确限定为内容或解释；不应在译文中消除这一语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“心神不安”比直译“我的灵受搅扰”更自然，同时仍呈现君王内在受到强烈扰动的状态。
