  text: וְ/דִֽי חֲזַ֜יְתָה רַגְלַיָּ֣/א וְ/אֶצְבְּעָתָ֗/א מנ/הון חֲסַ֤ף דִּֽי פֶחָר֙ ו/מנ/הון פַּרְזֶ֔ל מַלְכ֤וּ פְלִיגָה֙ תֶּהֱוֵ֔ה וּ/מִן נִצְבְּתָ֥/א דִ֥י פַרְזְלָ֖/א לֶֽהֱוֵא בַ֑/הּ כָּ/ל קֳבֵל֙ דִּ֣י חֲזַ֔יְתָה פַּ֨רְזְלָ֔/א מְעָרַ֖ב בַּ/חֲסַ֥ף טִינָֽ/א־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/041.yaml
  text: And as you saw the feet and toes[a], partly of potter’s clay and partly of iron, the kingdom will be divided; yet some of the firmness of iron will be in it[b], just as you saw the iron mixed with clay mud.
translation:
  language: zh_hans
  text: 至于你所看见的脚和脚趾，一部分是陶匠用的陶土，一部分是铁，这国必是分裂的；但其中仍会有几分铁的坚固性[a]，正如你看见铁与泥质陶土混合在一起[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“几分铁的力量”或“几分铁的稳定性”。亚兰语词可指坚固、力量或稳定。
    reason: lexical_alternative
  - marker: b
    text: 或译“与泥泞的陶土混合”。原文并用表示陶土和泥的词，突出了这种不稳固的混合物。
    reason: lexical_alternative
lexical_decisions:
- source_word: רַגְלַיָּא וְאֶצְבְּעָתָא
  choice: 脚和脚趾
  rationale: 上下文所指是像的足部，且与“脚趾”并列，因此译作“脚”比“腿”准确自然。
- source_word: מנ/הון ... ו/מנ/הון
  choice: 一部分……一部分……
  rationale: 保留材料构成上的两分结构，也符合现代汉语表达。
- source_word: חֲסַף דִּי פֶחָר
  choice: 窑匠的陶土
  rationale: 同时表达陶土材料和窑匠的关联；“陶土”比单说“泥”更贴合造器语境。
- source_word: פַּרְזֶל
  choice: 铁
  rationale: 该金属名称在异象语境中的标准译法。
- source_word: מַלְכוּ פְלִיגָה תֶּהֱוֵה
  choice: 这国必是分裂的
  rationale: 所指为像所象征的特定国度；未来式译为“必是”，并保留其处于分裂状态的含义。
- source_word: וּמִן נִצְבְּתָא דִי פַרְזְלָא לֶהֱוֵא בַהּ
  choice: 但其中仍会有几分铁的坚固
  rationale: מִן 表示具有其中一部分；נִצְבְּתָא可指坚固、力量或稳定性。“坚固”既贴近铁的具体形象，也不排除“力量”的含义。
- source_word: כָּל־קֳבֵל דִּי
  choice: 正如
  rationale: 这里把解释与先前所见对应起来，采用比较性的“正如”，同时不把短语强解为纯因果关系。
- source_word: מְעָרַב
  choice: 混合在一起
  rationale: 清楚表达两种材料掺混的状态。
- source_word: בַּחֲסַף טִינָא
  choice: 与泥状陶土
  rationale: “泥状陶土”尽量保留חֲסַף与טִינָא共同形成的陶土、泥浆双重意象，又比生硬的名词堆叠更符合现代汉语。
theological_decisions:
- issue: 分裂之国仍具有铁的某种性质
  choice: 保留“几分铁的坚固”这一有限而未具体化的表述
  alternative: 解释为某个政权仍拥有军事力量或政治稳定
  rationale: 原文只说明国中仍有来自铁之坚固、力量或稳定性的成分，并未明确其历史或政治实现，不宜加入特定释经体系。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“至于……这国……”清楚呈现异象所见与解释的关系；用“陶土”维持器皿材料的意象，用“泥状陶土”保留末句两个材料词的叠加意味。脚注标记按其实际解释对象安放：坚固处为[a]，泥状陶土处为[b]。
