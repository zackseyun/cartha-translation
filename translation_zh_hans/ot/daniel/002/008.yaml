base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/008.yaml
  text: The king answered and said[a], “I know for certain that you are trying to gain time, because you have seen that the matter has gone from me.”
translation:
  language: zh_hans
  text: 王回答说：“我确实知道，你们是在争取时间，因为你们看出这事已离开我。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这话已经离开我”；也可能理解为“这事我已经忘了”或“我的命令已经确定”。亚兰文措辞简洁，在这里有不止一种理解。
    reason: 保留 אַזְדָּא מִנִּי מִלְּתָא 在上下文中的词义和解释歧义，且避免在“从我口中发出”的说法中加入原文未明说的“口中”。
lexical_decisions:
- source_word: עָנֵה מַלְכָּא וְאָמַר
  choice: 王回答说
  rationale: 保留亚兰文常见叙事公式中“回答”和“说”的双重表达，同时符合现代汉语习惯。
- source_word: מִן יַצִּיב
  choice: 确实
  rationale: 该短语表达确定无疑的语气；“确实”简洁自然，也保留王断然认定的强调。
- source_word: יָדַע אֲנָה
  choice: 我知道
  rationale: 直接对应第一人称认知动词，语义明确有力。
- source_word: עִדָּנָא אַנְתּוּן זָבְנִין
  choice: 你们是在拖延时间
  rationale: 原文直译近于“你们在购买时间”，在此是争取时间、故意拖延的习语；“拖延时间”最自然地传达王的指控。
- source_word: כָּל־קֳבֵל דִּי
  choice: 因为
  rationale: 该连接语引出王作此判断的理由，“因为”是清楚自然的现代汉语对应表达。
- source_word: חֲזֵיתוֹן
  choice: 你们看出
  rationale: 既保留“看见”的基本意象，又在语境中自然表达他们已经察觉此事。
- source_word: אַזְדָּא מִנִּי
  choice: 已经离开我了
  rationale: 尽量贴近“从我这里去了”的字面意义，不擅自判定是王忘了梦，还是他的命令已经发出或确定。
- source_word: מִלְּתָא
  choice: 这事
  rationale: 该词可指话、事情、命令等；“这事”在汉语中自然宽泛，能够保留原文在本段中的多义性。
theological_decisions:
- issue: מִלְּתָא / אַזְדָּא מִנִּי 的歧义
  choice: 这事已经离开我了
  alternative: “这话已经从我口中发出”“这事我已经忘了”或“我的命令已经确定”
  rationale: 亚兰文措辞紧凑，在上下文中既可被理解为王不再记得梦，也可被理解为王的话或命令已经发出、不可更改。正文采用较贴近字面的宽泛表达，脚注说明主要可能性，不替读者消解原文的张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“拖延时间”清楚传达习语含义；“这事已经离开我了”略带源语色彩，是为保留关键歧义。脚注标记置于相关句末。
