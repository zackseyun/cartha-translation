source:
  edition: WLC
  text: דִּ֣י הֵן חֶלְמָ/א֩ לָ֨א תְהֽוֹדְעֻנַּ֜/נִי חֲדָה הִ֣יא דָֽתְ/כ֗וֹן וּ/מִלָּ֨ה כִדְבָ֤ה וּ/שְׁחִיתָה֙ הזמנתון לְ/מֵאמַ֣ר קָֽדָמַ֔/י עַ֛ד דִּ֥י עִדָּנָ֖/א יִשְׁתַּנֵּ֑א לָהֵ֗ן חֶלְמָ/א֙ אֱמַ֣רוּ לִ֔/י וְֽ/אִנְדַּ֕ע דִּ֥י פִשְׁרֵ֖/הּ תְּהַחֲוֻנַּֽ/נִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/009.yaml
  text: But if you do not make the dream known to me[a], there is only one decree for you, for you have agreed to speak lying and corrupt words before me until the time changes. Therefore tell me the dream[c][b], and I will know that you can make its interpretation known to me.
translation:
  language: zh_hans
  text: 但你们若不把那梦告诉我[a]，给你们的判决只有一个；因为你们已经预备好[b]，要在我面前说虚假、败坏的话，直到时候改变[c]。所以，把那梦告诉我，我就知道你们能把它的解释告诉我。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “给你们的判决只有一个”也可译作“给你们的法令只有一个”或“给你们的律例只有一条”。亚兰语 דָּת 在王室语境中可指法令、律例或司法判决。
    reason: lexical_alternative
  - marker: b
    text: “已经预备好”也可译作“已经安排好”或“已经串通好”。原文动词表示蓄意预备或安排；在王对一群人的指控中，也可带出共同谋划的意味。
    reason: lexical_alternative
  - marker: c
    text: “直到时候改变”也可理解为“直到时势改变”。原文“时候”是单数；上下文可暗示等待形势转变，但原文没有明确说“拖延”。
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּי הֵן
  choice: 但……若
  rationale: 既承接上文的转折，又保留条件语气和一定的强调意味。
- source_word: חֶלְמָא
  choice: 那梦
  rationale: 所指是王先前已经提到的特定梦；“那梦”在现代汉语中自然地表达特指。
- source_word: לָא תְהוֹדְעֻנַּנִי
  choice: 不把……告诉我
  rationale: 该使役形意为“使我知道”；汉语用“把……告诉我”较自然，并保留信息被告知给王的含义。
- source_word: חֲדָה הִיא דָתְכוֹן
  choice: 你们所受的判决只有一个
  rationale: דָּת 在王室司法语境中可指法令、律例或判决；这里强调众人将面对同一项处置，“判决”最贴合威胁性的上下文，同时以脚注保留其他可能。
- source_word: וּמִלָּה כִדְבָה וּשְׁחִיתָה
  choice: 虚假败坏的话
  rationale: 分别表达谎假与败坏、乖谬的性质，不把二者合并为单一概念。
- source_word: הזמנתון
  choice: 已经串通好
  rationale: 该动词基本义为预备、安排；在王对一群人的指控中，含有共同谋划的意味。“串通好”传达这种集体而蓄意的安排，但脚注保留较中性的译法。
- source_word: לְמֵאמַר קָדָמַי
  choice: 要在我面前说
  rationale: 直接保留“在我面前”的宫廷临在表达，汉语也通顺。
- source_word: עַד דִּי עִדָּנָא יִשְׁתַּנֵּא
  choice: 拖延到时局改变
  rationale: 原文直译为“直到时候改变”；语境指等待局势转变。“拖延”显明王所指控的策略，“时局”自然表达此处的时间与情势含义，脚注注明直译及数的差异。
- source_word: לָהֵן
  choice: 所以
  rationale: 自然表达前因后果，同时保留推论关系。
- source_word: אֱמַרוּ לִי
  choice: 把……告诉我
  rationale: 命令式 אמר 在此是要求对方说出梦的内容；现代汉语如此表达最自然。
- source_word: וְאִנְדַּע
  choice: 我就知道
  rationale: 保留结果性的直陈语气，不改写为明确的目的从句。
- source_word: פִשְׁרֵהּ תְּהַחֲוֻנַּנִי
  choice: 能把梦的解释向我说明
  rationale: פְּשַׁר 是《但以理书》中解释梦或奥秘的术语；“解释”保持术语一致，“向我说明”自然体现使役含义。
