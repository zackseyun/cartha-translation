translation_notes:
  register: 采用庄重而清晰的现代标准汉语。“那梦”保持具体所指；“判决”“虚假败坏的话”“解释”等词适合王廷审问语境。主文适度显明王所指控的拖延与共同谋划，但借脚注保留原文中“安排/预备”和“时候改变”的较直译可能。所有脚注标记均置于相关主文之后。
