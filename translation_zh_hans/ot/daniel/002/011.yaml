id: DAN.2.11
reference: Daniel 2:11
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וּ/מִלְּתָ֨/א דִֽי מַלְכָּ֤/ה שָׁאֵל֙ יַקִּירָ֔ה וְ/אָחֳרָן֙ לָ֣א אִיתַ֔י דִּ֥י יְחַוִּנַּ֖/הּ קֳדָ֣ם מַלְכָּ֑/א לָהֵ֣ן אֱלָהִ֔ין דִּ֚י מְדָ֣רְ/ה֔וֹן עִם בִּשְׂרָ֖/א לָ֥א אִיתֽוֹ/הִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/011.yaml
  text: And the thing that the king asks is difficult[a], and there is no other who can declare it before the king except the gods[b], whose dwelling is not with flesh.
translation:
  language: zh_hans
  text: 王所问的事非常困难[a]；除了诸神[b]以外，没有谁能在王面前说明这事；诸神并不与血肉之人同住。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“王所问的事甚是艰难。”
    reason: lexical_alternative
  - marker: b
    text: “诸神”也可译作“神明”；“与血肉之人同住”也可译作“与世人同住”或“与凡人同住”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִלְּתָא
  choice: 事
  rationale: 此词可指“话、事情、事项”；本处指王要求揭示的梦及其解释，用“事”自然且贴近原文。
- source_word: שָׁאֵל
  choice: 所问的
  rationale: 分词表示王正在询问或索求之事；“所问的”直接保留其基本语义，不把上下文中的强硬语气过度词汇化为“所要求的”。
- source_word: יַקִּירָה
  choice: 实在困难
  rationale: 该形容词可有“贵重、罕有、艰难”之意；语境强调王的要求极难办到，“困难”最合适，“实在”体现其程度分量。
- source_word: וְאָחֳרָן לָא אִיתַי
  choice: 没有谁
  rationale: 原文为“没有别的〔人/者〕”的存在句；汉语用“没有谁”简洁自然，并与后面的例外结构衔接。
- source_word: יְחַוִּנַּהּ
  choice: 能……把它说出来
  rationale: 动词意为“显明、说明、告知”；宫廷语境中“把它说出来”清楚表达向王揭示此事，且保持现代汉语自然度。
- source_word: קֳדָם מַלְכָּא
  choice: 在王面前
  rationale: 准确表达“在王的面前、王的临在中”的宫廷场景。
- source_word: לָהֵן
  choice: 除了……以外
  rationale: 本处引出唯一例外，汉语“除了……以外”最清楚。
- source_word: אֱלָהִין
  choice: 诸神
  rationale: 原文为复数，且出自巴比伦术士之口；“诸神”既保留复数，也符合叙事中的异教宫廷背景。
- source_word: מְדָרְהוֹן
  choice: 同住
  rationale: 原文名词结构直译为“他们的居所不与……同在”；汉语以“并不与……同住”更自然，同时保留居住观念。
- source_word: עִם בִּשְׂרָא
  choice: 与血肉之人
  rationale: בִּשְׂרָא 字面为“肉/血肉”，在此指有血肉的人类。译作“血肉之人”保留原文具体意象，也让现代读者明白其所指。
- source_word: לָא אִיתוֹהִי
  choice: 并不……同住
  rationale: 此否定存在/系词表达在关系从句中说明诸神的居所不与血肉同在；融入汉语谓语“并不……同住”最为顺畅。
theological_decisions:
- issue: אֱלָהִין 的所指
  choice: 诸神
  alternative: 神明；上帝
  rationale: 复数形态和巴比伦谋士的说话背景支持“诸神”。译成单数“上帝”会把以色列的一神论称谓带入这些人的原话；“神明”虽可涵盖复数，却不如“诸神”明确。
- issue: בִּשְׂרָא 的表达
  choice: 血肉之人
  alternative: 世人；凡人；血肉
  rationale: 原词字面意象是“肉/血肉”，语境则指人类。主文采用“血肉之人”，兼顾形式与可懂度，不把神与具肉身者之间的张力完全抽象化。
translation_notes:
  register: 采用现代、庄重而易懂的宫廷叙事语体。“王”沿用《但以理书》语境中的常用称谓；句式保留原文先陈述困难、再排除人类能力、最后指出诸神居所的推进。主文中的[a]、[b]均与脚注对应。
