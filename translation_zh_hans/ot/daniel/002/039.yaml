  text: וּ/בָתְרָ֗/ךְ תְּק֛וּם מַלְכ֥וּ אָחֳרִ֖י ארע/א מִנָּ֑/ךְ וּ/מַלְכ֨וּ תליתיא אָחֳרִי֙ דִּ֣י נְחָשָׁ֔/א דִּ֥י תִשְׁלַ֖ט בְּ/כָל אַרְעָֽ/א־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/039.yaml
  text: And after you another kingdom[a], inferior to yours, will arise; and yet a third kingdom, of bronze[b], which will rule over all the earth.
translation:
  language: zh_hans
  text: 在你以后，必有另一个国兴起，不及你的国[a]；随后又有第三个国，就是铜的国，它必统治全地[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“比你低下。”原文的表达较难；意思可能是下一个国在地位或荣光上不及尼布甲尼撒所代表的国。
    reason: lexical_alternative
  - marker: b
    text: “全地”也可译作“整个地区”。原词既可指“大地”，也可指“土地、地域”；这里表达广泛的帝国统治。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָתְרָךְ
  choice: 在你以后
  rationale: 表示在尼布甲尼撒之后的时间与王国承继关系；保留第二人称，不预先指明具体历史王朝。
- source_word: תְּקוּם
  choice: 必兴起
  rationale: 原义为“起来、站立”，用于王国时，“兴起”既自然，也保留其出现并取得地位的意象。
- source_word: מַלְכוּ אָחֳרִי
  choice: 另一个……国
  rationale: מַלְכוּ在异象语境中指政治性的国度或王权实体；אָחֳרִי表明它是随后出现且有别于前者的另一个国。
- source_word: אֲרַע מִנָּךְ
  choice: 不及你的
  rationale: 该短语较难，语境上表示后一个国在地位、尊荣或辉煌程度上逊于尼布甲尼撒所代表的国；正文不限定具体衡量标准，并以脚注保留较直译的表达。
- source_word: וּמַלְכוּ תְלִיתָיָא אָחֳרִי
  choice: 随后又有第三个国
  rationale: 按原文连续推进王国次序；“随后又有”符合现代汉语叙述，同时未增加具体历史认定。
- source_word: דִּי נְחָשָׁא
  choice: 就是铜的国
  rationale: 关系结构把第三国与像中的铜对应起来；“铜的国”简洁地保留象征性材质。
- source_word: דִּי תִשְׁלַט
  choice: 它必统治
  rationale: 动词表示施行权柄或管辖；“统治”清楚呈现政治支配的含义。
- source_word: בְּכָל אַרְעָא
  choice: 全地
  rationale: אַרְעָא既可指“大地、天下”，也可指“土地、地域”；正文采用具有广泛帝国统治意味的“全地”，脚注保留另一可能。
theological_decisions:
- issue: אֲרַע מִנָּךְ的比较含义
  choice: 不及你的
  alternative: 比你低下
  rationale: 原文直接以“你”为比较对象，且措辞罕见。正文依上下文表达继起之国较逊色，却不说明究竟在权力、道德或疆域上逊色，也不加入后世王国身份的解释。
- issue: בְּכָל אַרְעָא的范围
  choice: 全地
  alternative: 整个地区
  rationale: 异象使用普世性的帝国统治语言，但名词本身可指大地或某片地域；正文保留广阔语气，脚注说明词义范围，避免把地理范围解释得过窄或过绝对。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“必兴起”“统治”清晰易懂，并保留异象解释的正式语气；不加入任何继起王国的具体历史或宗派性认定。
