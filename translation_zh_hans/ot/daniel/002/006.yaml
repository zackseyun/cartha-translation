id: DAN.2.6
reference: Daniel 2:6
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/הֵ֨ן חֶלְמָ֤/א וּ/פִשְׁרֵ/הּ֙ תְּֽהַחֲוֺ֔ן מַתְּנָ֤ן וּ/נְבִזְבָּה֙ וִ/יקָ֣ר שַׂגִּ֔יא תְּקַבְּל֖וּן מִן קֳדָמָ֑/י לָהֵ֕ן חֶלְמָ֥/א וּ/פִשְׁרֵ֖/הּ הַחֲוֺֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/006.yaml
  text: But if you make known the dream and its interpretation[a], you will receive from me gifts and rewards and great honor. Therefore make known to me the dream and its interpretation.
translation:
  language: zh_hans
  text: 但你们若把梦和梦的解释[a]告诉我，就必从我这里得到礼物、赏赐和极大的尊荣。因此，你们要把梦和梦的解释告诉我。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “告诉”也可译作“使我知道”或“向我说明”；本节两处所用的是同一个亚兰语动词。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵן
  choice: 但……若
  rationale: 承接上一节的威胁并引出与之相对的条件，现代汉语以“但……若”自然表达转折和条件。
- source_word: חֶלְמָא
  choice: 梦
  rationale: 所指是此前已经提到的特定之梦；汉语通常无须另加定冠词。
- source_word: וּפִשְׁרֵהּ
  choice: 和梦的解释
  rationale: פשר在但以理书的亚兰语语境中指对梦或奥秘的解释；重复“梦”比“它的”更清楚自然。
- source_word: תְּהַחֲוֺן / הַחֲוֺנִי
  choice: 告诉我
  rationale: חוה的使役形表示使人知道、告知或说明；“告诉我”既保留其传达信息的含义，也符合君王直接要求的语气。
- source_word: מַתְּנָן
  choice: 礼物
  rationale: 指所赐予的贵重物品，译作“礼物”简明自然。
- source_word: וּנְבִזְבָּה
  choice: 赏赐
  rationale: 该词指由君王给予的奖赏或酬报；“赏赐”贴合宫廷语境，并与“礼物”有所区分。
- source_word: וִיקָר שַׂגִּיא
  choice: 极大的尊荣
  rationale: יְקָר表示尊荣、声望，שַׂגִּיא表示大或多；“极大的尊荣”自然保留加强语气。
- source_word: תְּקַבְּלוּן
  choice: 就必……得到
  rationale: 第二人称复数未完成式在条件句结果部分表达将来的确定结果；“就必”清楚呈现其条件关系和应许语气。
- source_word: מִן קֳדָמַי
  choice: 从我这里
  rationale: 该惯用语在此表示赏赐的来源是说话的君王；“从我这里”比直译“从我面前”更合现代汉语。
- source_word: לָהֵן
  choice: 因此
  rationale: 从所应许的奖赏推导出随后的命令，译作“因此”保留逻辑关系。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留原文由威胁转向奖赏的条件结构，并在末句重复“梦和梦的解释”，以体现君王强调的要求。
