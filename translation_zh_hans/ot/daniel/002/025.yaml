base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/025.yaml
  text: Then Arioch hurriedly brought Daniel before the king and said to him[a], “I have found a man from among the exiles of Judah who will make the interpretation known to the king.”
translation:
  language: zh_hans
  text: 于是，亚略急忙把但以理带到王面前，对王说：“我在犹大被掳的人中找到了一个人[a]，他会把这解释告诉王。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “犹大人”也可译为“犹太人”或“犹大地人”。原文指属于犹大、正在被掳流亡群体中的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱדַיִן
  choice: 于是
  rationale: 这是承接叙事进程的标记；“于是”自然地引出紧接发生的事件。
- source_word: בְּהִתְבְּהָלָה
  choice: 急忙
  rationale: 该词在此表达匆忙、急迫；“急忙”符合亚略立即带但以理觐见王的语境，同时不加入“惊慌”的意味。
- source_word: הַנְעֵל
  choice: 带到
  rationale: 使役形式表示带领或带入；与“王面前”搭配时，“带到”是自然且准确的中文表达。
- source_word: קֳדָם מַלְכָּא
  choice: 王面前
  rationale: 这是宫廷语境中表示来到君王跟前的惯用表达。
- source_word: וְכֵן אֲמַר לֵהּ
  choice: 对王说
  rationale: 此短语引出直接引语；代词在中文中明确译作“王”，可避免“对他说”所可能产生的指代含混。
- source_word: הַשְׁכַּחַת
  choice: 我……找到了
  rationale: 完成体表示已经成功找到，且结果与当前报告直接相关。
- source_word: גְּבַר
  choice: 一个人
  rationale: 原词指男性个体；中文“一个人”在本句中自然，并未否定但以理的男性身份。
- source_word: מִן בְּנֵי גָלוּתָא
  choice: 从被掳到这里的……人中
  rationale: 该习语指被迁徙、流放的群体；“被掳到这里”以自然中文传达流亡处境，并使“中”所支配的人群结构清楚。
- source_word: דִּי יְהוּד
  choice: 犹大人
  rationale: 该称谓在流亡背景中标明与犹大这一族群和地域共同体的归属；“犹大人”较贴近亚兰文，也避免直接采用可能带有后期语感的“犹太人”。
- source_word: פִשְׁרָא
  choice: 梦的解释
  rationale: 该词是《但以理书》中解释梦和奥秘的关键术语；上下文所指为王的梦，因此中文补出“梦的”可自然明确所解释的对象。
- source_word: יְהוֹדַע
  choice: 能把……告诉
  rationale: 使役动词意为使人知道；“能把梦的解释告诉王”自然表达预期能力和告知结果，不把词义强化为神学色彩更浓的“启示”。
theological_decisions:
- issue: 族群称谓 דִּי יְהוּד
  choice: 犹大人
  alternative: 犹太人；来自犹大的人
  rationale: 此处主要是流亡宫廷叙事中的历史—族群身份标识。“犹大人”保留它与犹大及被掳群体的直接联系，又不将后期“犹太人”的全部语义预先带入。
translation_notes:
  register: 采用现代、庄重而易懂的叙事中文。“急忙”“带到王面前”保持动作明快；亚略的话使用宫廷语境下自然的“告诉王”，不使用过度古雅的自称或敬称。原文此节没有必须以脚注保留的文本差异；有关 דִּי יְהוּד 的语义范围已在翻译决策中说明，因此正文不设脚注标记。
