  text: דְּנָ֣ה חֶלְמָ֔/א וּ/פִשְׁרֵ֖/הּ נֵאמַ֥ר קֳדָם מַלְכָּֽ/א־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/036.yaml
  text: This was the dream[a], and we will tell its interpretation before the king.
translation:
  language: zh_hans
  text: 这就是那梦[a]，我们要在王面前讲明它的解释。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这是那梦；现在我们要在王面前讲明它的解释。”亚兰文可因断句及动词时态理解的细微差异而有不同译法，基本意思不变。
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּנָה
  choice: 这就是
  rationale: 指回前面刚叙述完的梦；汉语判断句补出“就是”，表达自然，并未增加新的内容。
- source_word: חֶלְמָא
  choice: 那梦
  rationale: 名词为确定形式，指尼布甲尼撒所做、但以理刚刚复述的特定之梦；“那梦”既体现所指明确，也承接上文。
- source_word: וּפִשְׁרֵהּ
  choice: 它的解释
  rationale: פִשְׁרָא在《但以理书》中是解释梦和奥秘的术语；“解释”保留这一语境意义，代词“它”指那梦。
- source_word: נֵאמַר
  choice: 我们要……讲明
  rationale: 第一人称复数未完成式在此表示随后将要陈说；“我们要”保留复数和将来指向，“讲明”符合向王陈述梦之解释的现代汉语表达。
- source_word: קֳדָם
  choice: 在……面前
  rationale: 直译其“在……面前、当着……”之义，并保留宫廷陈述的场景。
- source_word: מַלְכָּא
  choice: 王
  rationale: 原文为确定形式，所指在上下文中明确；汉语称谓“王”自然，无须补出尼布甲尼撒之名。
theological_decisions: []
