  text: אַ֣נְתְּה מַלְכָּ֔/א מֶ֖לֶךְ מַלְכַיָּ֑/א דִּ֚י אֱלָ֣הּ שְׁמַיָּ֔/א מַלְכוּתָ֥/א חִסְנָ֛/א וְ/תָקְפָּ֥/א וִֽ/יקָרָ֖/א יְהַב לָֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/037.yaml
  text: You[a], O king, are the king of kings, to whom the God of heaven has given the kingdom, the might, the power, and the glory.
translation:
  language: zh_hans
  text: 王啊，你是万王之王；天上的神已将国度、威力、权势和荣耀[a]赐给你。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “荣耀”或译“尊荣”或“荣华”。
    reason: 原词 וִיקָרָא 可表示荣耀、尊荣或荣华；正文采用“荣耀”，脚注保留其词义范围。
lexical_decisions:
- source_word: אַ֣נְתְּה
  choice: 你
  rationale: 独立的第二人称阳性单数代词，用于直接称呼；结合后面的“王啊”，自然保留强调和当面陈述的语气。
- source_word: מַלְכָּא
  choice: 王啊
  rationale: 带定指形式的单数名词在此作呼语；“王啊”符合现代汉语中庄重的宫廷称呼。
- source_word: מֶלֶךְ מַלְכַיָּא
  choice: 万王之王
  rationale: 这是“王中之王”的属格结构，表达至高的王者称号；“万王之王”自然、庄重，并保留原文的强化意味。
- source_word: דִּי
  choice: 已将……赐给你
  rationale: 关系词引出说明上帝所赐之物的从句；汉语不必逐字译出关系代词，调整为主动句可清楚保留其句法关系。
- source_word: אֱלָהּ שְׁמַיָּא
  choice: 天上的上帝
  rationale: 保留“天之上帝”这一称号的定指和庄重色彩，同时符合现代汉语习惯。
- source_word: מַלְכוּתָא
  choice: 国度
  rationale: 可指王权、统治或国度；此处用“国度”保留其宽广含义，不把它限缩为领土或抽象权柄。
- source_word: חִסְנָא
  choice: 威力
  rationale: 该词表示强力、强盛；“威力”适合君王语境，也能与随后表示能力、权势的词保持既相关又有区别。
- source_word: תָקְפָּא
  choice: 权能
  rationale: 该词可表示力量、能力或权势；“权能”兼顾实际能力与统治力量，并避免与前一词完全重复。
- source_word: וִיקָרָא
  choice: 荣耀
  rationale: 该词涵盖尊荣、荣耀和荣华；“荣耀”保持经文的崇高语体，而脚注列出其主要词义可能。
- source_word: יְהַב לָךְ
  choice: 已将……赐给你
  rationale: Peal完成式第三人称阳性单数，带第二人称阳性单数间接宾语；“已……赐给你”表达已经完成且结果仍然有效的赐予。
theological_decisions:
- issue: 尼布甲尼撒王权的来源
  choice: 国度、威力、权能和荣耀都被陈述为天上的上帝所赐。
  alternative: 这些权势是尼布甲尼撒凭征服或自身地位而固有的。
  rationale: 原文明确以“赐给你”把君王的统治与尊荣归因于上帝的授予；译文保留这一陈述，不作超出经文的神学发挥。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“王啊”保留直接而尊敬的宫廷称呼；四个并列名词按原文次序呈现，并尽量保留相邻词语之间的语义重叠。脚注标记置于实际对应的“荣耀”之后。
