base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/021.yaml
  text: He changes times and seasons[a]; he removes kings and sets up kings[b]; he gives wisdom to the wise and knowledge to those who have understanding.
translation:
  language: zh_hans
  text: 他改变时候和时节[a]；他废去君王，设立君王；他把智慧赐给有智慧的人，把知识赐给有悟性的人[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “时节”或译“指定的时期”。这两个亚兰语词既可泛指时间和时期，也可指合宜或指定的时候。
    reason: lexical_alternative
  - marker: b
    text: 原文直译近于“知道悟性的人”或“悟性的知者”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מְהַשְׁנֵא
  choice: 改变
  rationale: 使役分词表示使之改变；“改变”自然直接，也保留持续施行的意味。
- source_word: עִדָּנַיָּא
  choice: 时代
  rationale: 该复数名词可指时间或时期；与后面的 זִמְנַיָּא 搭配时，“时代”表达较宽广的时间阶段。
- source_word: זִמְנַיָּא
  choice: 时机
  rationale: 该词可指时间，尤其是适当或规定的时刻；“时机”与“时代”形成自然区别，同时保留合宜、特定时刻的意味。
- source_word: מְהַעְדֵּה
  choice: 废黜
  rationale: 该使役动词意为使之离去、除去；用于君王时，“废黜”准确表达其王位被除去，且不削弱行动的直接性。
- source_word: מַלְכִין
  choice: 君王
  rationale: 直接对应复数“王”；“君王”符合庄重的经文语体。
- source_word: מְהָקֵים
  choice: 设立
  rationale: 该使役动词意为使站立、兴起或建立；“设立君王”自然，并与“废黜君王”构成鲜明对应。
- source_word: יָהֵב
  choice: 赐给
  rationale: 基本义为“给”；在上帝赐予智慧和知识的语境中，“赐给”自然庄重。
- source_word: חָכְמְתָא
  choice: 智慧
  rationale: 这是该名词的标准对应词。
- source_word: לְחַכִּימִין
  choice: 给有智慧的人
  rationale: 形容词在此作名词用，指智慧人；现代汉语用“有智慧的人”清楚自然。
- source_word: מַנְדְּעָא
  choice: 知识
  rationale: 该名词表示知识；如此可与随后表示悟性、明辨的 בִינָה 保持区别。
- source_word: לְיָדְעֵי בִינָה
  choice: 给明达的人
  rationale: 原文结构近于“知道悟性的人”；“明达的人”以自然简洁的现代汉语表达有悟性、能明辨之人，脚注保留其特殊原文形式。
theological_decisions:
- issue: 上帝对政治统治者的主权
  choice: 直接表述他“废黜君王，也设立君王”
  alternative: 他容许君王兴衰，或他影响政治变迁
  rationale: 原文直接把废去和设立君王归于上帝；译文保留这一强烈陈述，却不进一步引入决定论或许可论体系。
- issue: 智慧与领受者之间看似张力的关系
  choice: 保留“把智慧赐给有智慧的人”
  alternative: 把智慧赐给寻求智慧的人，或使人变得有智慧
  rationale: 原文明确说智慧赐给智慧人；不替文本解释这种看似循环的表达，也不消除其神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“时代和时机”保留两个时间词的区别；“废黜……设立……”形成凝练对偶。正文中的[a]、[b]均与脚注对应。
