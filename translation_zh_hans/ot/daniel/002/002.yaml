base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/002.yaml
  text: Then the king ordered the magicians[a], the enchanters, the sorcerers, and the Chaldeans to tell the king his dreams[b]. So they came and stood before the king.
translation:
  language: zh_hans
  text: 于是，王下令召来[b]术士、咒术师、巫师和迦勒底人[a]，要他们把王的梦告诉王。他们就来，站在王面前。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “迦勒底人”既可指迦勒底族人，也可能在这里指巴比伦宫廷中的一类智者。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“王说要召来”；这是一种表示王下令召集他们的说法。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר ... לִקְרֹא
  choice: 下令召来
  rationale: 原文直译为“王说要召来”，在这一结构中表达命令之意；“下令召来”既自然，又保留召见的动作。
- source_word: חַרְטֻמִּים
  choice: 术士
  rationale: 指宫廷中从事法术、占卜等活动的专业人员；“术士”简明、易懂，也适合古代宫廷语境。
- source_word: אַשָּׁפִים
  choice: 咒术师
  rationale: 该词的确切专门含义不能确定，但指某类施行秘术的人；“咒术师”可与同列的其他群体相区别，同时避免过度限定为占星家。
- source_word: מְכַשְּׁפִים
  choice: 巫师
  rationale: 源自动词“施行巫术”，此处用常见的现代汉语名称，保留其巫术性质。
- source_word: כַּשְׂדִּים
  choice: 迦勒底人
  rationale: 该词既可指迦勒底族人，也可能在此指巴比伦宫廷中的一类智者；音译可保留这种歧义，并以脚注说明。
- source_word: לְהַגִּיד
  choice: 告诉
  rationale: 直接表达“说出、告知”，与“梦”搭配自然。
- source_word: חֲלֹמֹתָיו
  choice: 王所做的梦
  rationale: 原文为带第三人称阳性单数后缀的复数“他的梦”；明确所指为王，并保留复数形式在汉语中可由语境涵盖的特点。
- source_word: וַיָּבֹאוּ וַיַּעַמְדוּ לִפְנֵי הַמֶּלֶךְ
  choice: 他们就来，站在王面前
  rationale: 贴近原文连续的叙事动词，并自然表达臣属到王面前候命。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“术士、咒术师、巫师”保留原文对不同宫廷秘术群体的并列区分；不将含义不确定的 אַשָּׁפִים 具体化为“占星家”。
