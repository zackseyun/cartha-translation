language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: בֵּ/אדַ֣יִן דָּ֣קוּ כַ/חֲדָ֡ה פַּרְזְלָ/א֩ חַסְפָּ֨/א נְחָשָׁ֜/א כַּסְפָּ֣/א וְ/דַהֲבָ֗/א וַ/הֲווֹ֙ כְּ/ע֣וּר מִן אִדְּרֵי קַ֔יִט וּ/נְשָׂ֤א הִמּוֹן֙ רוּחָ֔/א וְ/כָל אֲתַ֖ר לָא הִשְׁתֲּכַ֣ח לְ/ה֑וֹן וְ/אַבְנָ֣/א דִּֽי מְחָ֣ת לְ/צַלְמָ֗/א הֲוָ֛ת לְ/ט֥וּר רַ֖ב וּ/מְלָ֥ת כָּל אַרְעָֽ/א־־־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/035.yaml
  text: Then the iron[a], the clay, the bronze, the silver, and the gold were crushed all at once and became like chaff from the summer threshing floors, and the wind carried them away so that no place was found for them[c][b]. But the stone that struck the statue became a great mountain and filled the whole earth.
translation:
  language: zh_hans
  text: 于是，铁、泥、铜、银、金一同[a]粉碎，变得像夏天禾场上的糠秕[b]；风把它们吹走，再也找不到它们的踪迹。那块击打巨像的石头却变成一座大山，充满全地[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “一同”也可译作“同时”或“一下子”。
    reason: lexical_alternative
  - marker: b
    text: 或译“尘土”；原词指禾场上能被风吹走的轻碎物。
    reason: lexical_alternative
  - marker: c
    text: “全地”也可译作“整个大地”或“全世界”。
    reason: alternative_reading
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: 于是
  rationale: 这是承接前文、推进事件次序的亚兰语话语标记；“于是”自然地表达随即发生的结果。
- source_word: דָּקוּ
  choice: 粉碎
  rationale: 该被动复数动词表示这些材料被强力击碎；汉语以不显明施事者的“粉碎”即可自然表达被动结果，并与随后轻如糠秕的比喻衔接。
- source_word: כַחֲדָה
  choice: 一同
  rationale: 该副词短语可表示“一起、同时、如同一体”；“一同”保留共同遭毁的重点，不额外强化突发性。
- source_word: פַּרְזְלָא חַסְפָּא נְחָשָׁא כַּסְפָּא וְדַהֲבָא
  choice: 铁、泥、铜、银、金
  rationale: 依照原文次序列出巨像的各种材料；נְחָשָׁא可指铜或青铜，简体中文圣经语境中“铜”自然且不过度限定合金成分。
- source_word: וַהֲווֹ כְּעוּר
  choice: 变得像……糠秕
  rationale: עוּר指禾场上可被风吹散的轻碎物；结合禾场意象，“糠秕”比泛称“尘土”更具体。
- source_word: אִדְּרֵי קַיִט
  choice: 夏天禾场
  rationale: 指旱季夏天进行打谷扬场的场所；“夏天禾场”简洁保留季节与农业背景。
- source_word: וּנְשָׂא הִמּוֹן רוּחָא
  choice: 风把它们吹走
  rationale: 原文以“风”为主语，表示风将这些碎物带走；“吹走”符合糠秕的具体图景。
- source_word: וְכָל אֲתַר לָא הִשְׁתֲּכַח לְהוֹן
  choice: 再也找不到它们的踪迹
  rationale: 直译为“没有任何地方为它们找到”；此处是表达彻底消失的亚兰语说法，译为“找不到……踪迹”自然且保留结果。
- source_word: אַבְנָא דִּי מְחָת לְצַלְמָא
  choice: 那块击打巨像的石头
  rationale: 关系从句明确指出石头就是击中巨像的那一块；“巨像”承接本章异象中的庞大人像。
- source_word: הֲוָת לְטוּר רַב
  choice: 变成一座大山
  rationale: 准确表达石头成为巨大山岳的变化结果。
- source_word: וּמְלָת כָּל אַרְעָא
  choice: 充满全地
  rationale: מלא表示充满，כָּל אַרְעָא可作“全地”或“整个大地”；“全地”保留其广阔范围及“地／土地”的词义张力。
theological_decisions:
- issue: אַרְעָא的范围
  choice: 全地
  alternative: 整个大地；全世界
  rationale: 亚兰语אַרְעָא既可指地、土地，也可在广义上指大地。译作“全地”既符合异象的广大范围，又不在译文中超出原词而明确加入现代地理意义的“全球”。
- issue: 石头分句前连接词的语气
  choice: 却
  alternative: 并且；而
  rationale: 原文连接词形式上是“和／而”，但上下文形成鲜明对照：巨像的材料消失，石头则扩展成山。“却”自然呈现这一语篇对比，不对石头的象征身份作额外解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“粉碎”“糠秕”“禾场”保留异象的力度与农业图景；“巨像”与本章上下文相接。“全地”避免把原文可含的“地／土地”范围过早限定为某一种神学解释。
