lexical_decisions:
- source_word: וַיְדַבְּרוּ
  choice: 于是……说
  rationale: 承接并推进叙事；“于是”符合现代汉语的叙事表达。
- source_word: הַכַּשְׂדִּים
  choice: 迦勒底人
  rationale: 保留原文的族群或宫廷群体称谓，不在正文中解释性地改译为“占星家”。
- source_word: אֲרָמִית
  choice: 用亚兰语
  rationale: 准确表达说话所用的语言，同时标示本书原文语言在此发生转换。
- source_word: מַלְכָּא לְעָלְמִין חֱיִי
  choice: 愿王万岁
  rationale: 这是向君王致意的祝愿语；采用自然而庄重的汉语宫廷表达，传达“愿你永远活着”的语气。
- source_word: אֱמַר חֶלְמָא
  choice: 请把梦告诉
  rationale: 原文为命令式；加“请”符合臣下对王的恭敬语气，“告诉”切合讲述梦境的语境。
- source_word: לְעַבְדָךְ
  choice: 仆人们
  rationale: 这是臣属在王前的自称，译作“仆人”既保留谦卑的宫廷用语，也避免误突出法律上的奴隶身份。
- source_word: וּפִשְׁרָא נְחַוֵּא
  choice: 我们就会说明梦的解释
  rationale: “说明”体现动词“使人知道、展示”的含义；补出“梦的”使现代汉语指向清楚，而不增添新的解释内容。
