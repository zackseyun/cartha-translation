  text: 'Then the Chaldeans spoke to the king in Aramaic: “O king[a], live forever! Tell the dream to your servants[c][b], and we will declare the interpretation.”'
translation:
  language: zh_hans
  text: 于是，迦勒底人用亚兰语对王说：“愿王[a]万岁！请把那梦告诉仆人，我们就会解释这梦。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文从这里开始改用亚兰语，一直延续到但以理书7:28。
