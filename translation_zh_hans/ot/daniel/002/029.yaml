id: DAN.2.29
reference: Daniel 2:29
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אַ֣נְתְּה מַלְכָּ֗/א רַעְיוֹנָ/ךְ֙ עַל מִשְׁכְּבָ֣/ךְ סְלִ֔קוּ מָ֛ה דִּ֥י לֶהֱוֵ֖א אַחֲרֵ֣י דְנָ֑ה וְ/גָלֵ֧א רָזַיָּ֛/א הוֹדְעָ֖/ךְ מָה דִ֥י לֶהֱוֵֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/029.yaml
  text: As for you[a], O king, your thoughts came up on your bed about what would happen after this, and he who reveals mysteries has made known to you what would happen.
translation:
  language: zh_hans
  text: 王啊，至于你，你躺在床上时，心中浮现了此后将要发生的事；那显明奥秘的[a]，已经使你知道将要发生的事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“奥秘的显明者”。亚兰文在这里使用主动分词，既可理解为描述“那显明奥秘的”，也可带有称号意味。
    reason: 保留分词表达在描述性用法与称号性用法之间的语义张力。
lexical_decisions:
- source_word: אַנְתְּה
  choice: 至于你
  rationale: 独立人称代词带有强调和话题化作用；“至于你”在现代汉语中自然地保留这一语气。
- source_word: מַלְכָּא
  choice: 王啊
  rationale: 此处是直接称呼；“王啊”既体现呼格作用，也符合宫廷语境中的庄重语体。
- source_word: רַעְיוֹנָךְ
  choice: 你……心中浮现了……事
  rationale: 该名词指思想、思绪；结合复数动词“上升”，译作“心中浮现”能以自然汉语表达思绪涌现的意思。
- source_word: עַל מִשְׁכְּבָךְ
  choice: 你躺在床上时
  rationale: 原文直译为“在你的床上”；汉语用时间性表达更自然，同时保留王卧床思索的场景。
- source_word: סְלִקוּ
  choice: 浮现了
  rationale: 动词本义为“上升、起来”，与思绪连用时，“浮现”既保留意象，又符合现代汉语习惯。
- source_word: מָה דִּי לֶהֱוֵא אַחֲרֵי דְנָה
  choice: 此后将要发生的事
  rationale: 清楚表达所思内容的未来指向；“此后”保留 אַחֲרֵי דְנָה 的顺序意义。
- source_word: גָלֵא רָזַיָּא
  choice: 那显明奥秘的
  rationale: 亚兰文以主动分词构成描述性、近似称号的表达；此译不擅自补出“上帝”，也不把它过度固定为正式头衔。
- source_word: הוֹדְעָךְ
  choice: 已经使你知道
  rationale: 使役形式表示“使……知道”；“已经”适合表达完成动作，并与上下文的启示事件相符。
- source_word: מָה דִי לֶהֱוֵא
  choice: 将要发生的事
  rationale: 保留原文对未来内容的重复，不以较文言的“将有之事”削弱可读性。
theological_decisions:
- issue: גָלֵא רָזַיָּא 是否译作正式的神圣称号
  choice: 那显明奥秘的
  alternative: 奥秘的显明者
  rationale: 原文是主动分词式表达，可作描述，也带有称号色彩；正文采用描述性译法以保留这种张力，并避免加入原文没有明说的“上帝”。
- issue: 是否明确补出“上帝”为动作主体
  choice: 不补出“上帝”
  alternative: 显明奥秘的上帝
  rationale: 上下文虽清楚指向上帝，本节却没有使用相应名词或神名；保留原文的间接指称更忠实。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“王啊”保留宫廷称呼，“至于你”体现强调；分号呈现王的思绪与启示者行动之间的并列推进。
