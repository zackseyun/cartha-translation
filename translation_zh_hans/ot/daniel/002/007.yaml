base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/007.yaml
  text: They answered a second time and said[a], “Let the king tell the dream to his servants[b], and we will show the interpretation.”
translation:
  language: zh_hans
  text: 他们第二次回答说[a]：“请王把梦告诉仆人，我们就会讲明这梦的解释[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“再次回答说”。原文副词更具体地表示“第二次”。
    reason: lexical_alternative
  - marker: b
    text: 或译“我们就会使这梦的解释显明”或“告知这梦的解释”。原文动词可指“使人知道、显明”。
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲנוֹ
  choice: 回答
  rationale: Peal完成式第三人称复数；在连续对话中译作“回答”自然准确。
- source_word: תִנְיָנוּת
  choice: 第二次
  rationale: 该副词明确带有“第二次”的序数含义，比笼统的“再次”更贴近原文。
- source_word: וְאָמְרִין
  choice: 说
  rationale: 用于引出直接引语；现代汉语叙事中“回答说”自然，无须机械保留连接词。
- source_word: מַלְכָּא
  choice: 王
  rationale: 此处是 יֵאמַר 的主语，而非呼语；因此译作“王”，不译作“王啊”。
- source_word: חֶלְמָא
  choice: 梦
  rationale: 保留宫廷解梦语境中的普通、明确用词；汉语不需另加定冠词。
- source_word: יֵאמַר
  choice: 请……告诉
  rationale: 未完成式在直接引语中具有祈使或请求语气；“请王……告诉”既保留意愿色彩，也符合臣下对王说话的语域。
- source_word: לְעַבְדוֹהִי
  choice: 告诉仆人们
  rationale: עבד 可指奴仆或臣仆；这里是宫廷人员对王的谦称，“仆人们”比“奴隶们”更符合语境，同时不把它改释为一般性的“臣子”。
- source_word: וּפִשְׁרָה
  choice: 梦的解释
  rationale: פשר 在此指对梦的解释；汉语补出“梦的”以明确所指，避免“它的解释”显得生硬。
- source_word: נְהַחֲוֵה
  choice: 说明白
  rationale: Haphel第一人称复数，含“使人知道、说明”的意思；“把梦的解释说明白”自然地表达其使役和揭示含义。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“请王”保留宫廷敬语和原文中以“王”为主语的句法；“仆人们”保留说话者对王的谦称。句末用“说明白”避免生硬直译，同时准确传达“使人知道”的含义。
