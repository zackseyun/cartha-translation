  text: וָ/אֶשָּׂ֤א אֶת עֵינַ/י֙ וָ/אֵ֔רֶא וְ/הִנֵּ֥ה אִישׁ אֶחָ֖ד לָב֣וּשׁ בַּדִּ֑ים וּ/מָתְנָ֥י/ו חֲגֻרִ֖ים בְּ/כֶ֥תֶם אוּפָֽז־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/010/005.yaml
  text: I lifted up my eyes and looked[a], and behold, a man clothed in linen, with his waist girded with the gold of Uphaz.
translation:
  language: zh_hans
  text: 我举目观看，看哪，有一个人身穿细麻衣，腰间束着乌法的精金。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “乌法”可能是地名；“精金”也可理解为强调黄金贵重或经过纯炼。
    reason: 说明专名及金子品质用语所含的词义不确定性。
lexical_decisions:
- source_word: וָאֶשָּׂא אֶת־עֵינַי וָאֵרֶא
  choice: 我举目观看
  rationale: 保留“举目”这一希伯来语惯用表达，同时用“观看”自然呈现随后“看见”的动作，避免在中文中生硬重复。
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留指示和引人注意的语气，也符合异象叙事庄重而鲜明的风格。
- source_word: אִישׁ אֶחָד
  choice: 有一个人
  rationale: 明确呈现单数男性人物，但不超出经文本身去判定其身份。
- source_word: לָבוּשׁ בַּדִּים
  choice: 身穿细麻衣
  rationale: בַּדִּים指细麻布或细麻衣；译作“细麻衣”简洁自然，并保留服饰材质。
- source_word: מָתְנָיו חֲגֻרִים
  choice: 腰间束着
  rationale: 准确表达腰部被束裹的状态；不擅自补出原文没有明说的“腰带”。
- source_word: בְּכֶתֶם אוּפָז
  choice: 乌法的精金
  rationale: כֶּתֶם指贵重、纯炼的黄金；“乌法”按专名音译，同时以脚注保留其性质并非完全确定这一点。
theological_decisions:
- issue: 异象中人物的身份
  choice: 仅译作“一个人”
  alternative: 天使、弥赛亚或神显中的人物
  rationale: 本节只描述其外貌和衣着，并未明确说明其身份；中性翻译可保留经文中的神学张力。
translation_notes:
  register: 采用现代、庄重而清楚的叙事语言。“举目观看”“看哪”保留异象场景的郑重语气；“腰间束着”避免古奥的“腰肾”类直译，也不额外补入原文未明说的器物。
