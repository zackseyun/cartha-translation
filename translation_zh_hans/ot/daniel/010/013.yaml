  text: וְ/שַׂ֣ר מַלְכ֣וּת פָּרַ֗ס עֹמֵ֤ד לְ/נֶגְדִּ/י֙ עֶשְׂרִ֣ים וְ/אֶחָ֣ד י֔וֹם וְ/הִנֵּ֣ה מִֽיכָאֵ֗ל אַחַ֛ד הַ/שָּׂרִ֥ים הָ/רִאשֹׁנִ֖ים בָּ֣א לְ/עָזְרֵ֑/נִי וַ/אֲנִי֙ נוֹתַ֣רְתִּי שָׁ֔ם אֵ֖צֶל מַלְכֵ֥י פָרָֽס׀׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/010/013.yaml
  text: But the prince of the kingdom of Persia stood against me for twenty-one days[a], and behold, Michael, one of the chief princes, came to help me[b], and I was left there beside the kings of Persia.
translation:
  language: zh_hans
  text: 但波斯国的首领抵挡我二十一天；看哪，首要的首领之一[a]米迦勒来帮助我，我仍留在那里，在波斯诸王身边[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “首要的首领”也可译作“最先的首领”或“居首的首领”。
    reason: lexical_alternative
  - marker: b
    text: 原文是“波斯诸王”，为复数；“在……身边”所译的原词也可理解为“在……旁边”或“与……同在”。
    reason: source_form_and_lexical_ambiguity
lexical_decisions:
- source_word: שַׂר מַלְכוּת פָּרַס
  choice: 波斯国的首领
  rationale: שַׂר表示地位很高的统治者或领袖；“首领”既适用于人间权柄，也可用于天上权柄，避免用“王子”误导为君王之子，也不擅自加上“天使”或“魔君”等解释。
- source_word: עֹמֵד לְנֶגְדִּי
  choice: 抵挡我
  rationale: 该表达具有站在对面、与之对抗的含义；“抵挡我”在现代汉语中自然地保留其敌对意味。
- source_word: עֶשְׂרִים וְאֶחָד יוֹם
  choice: 二十一天
  rationale: 按原文直译持续时间，中文无需另加介词。
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留原文引人注意和增强叙事现场感的功能，同时维持庄重语体。
- source_word: מִיכָאֵל
  choice: 米迦勒
  rationale: 采用现代中文圣经人名的通行译名。
- source_word: אַחַד הַשָּׂרִים הָרִאשֹׁנִים
  choice: 居首的首领之一
  rationale: הָרִאשֹׁנִים可指次序在先，也可指地位卓越；“居首的”保留这种层级含义而不完全锁定为单一解释。
- source_word: בָּא לְעָזְרֵנִי
  choice: 来帮助我
  rationale: 直接而自然地表达移动动词与目的不定式。
- source_word: נוֹתַרְתִּי
  choice: 我就留在那里
  rationale: 该词的Niphal形式可表示“被留下”或“留下、停留”；中文采用自然的“留在那里”，不强行确定其被动意味。
- source_word: אֵצֶל מַלְכֵי פָרָס
  choice: 在波斯诸王那里
  rationale: אֵצֶל可表示“在……旁边、与……同在、在……那里”。此译法保持空间或关联意义的开放性，并严格保留מַלְכֵי的复数。
theological_decisions:
- issue: “波斯国的首领”与“居首的首领”的身份
  choice: 正文均译为“首领”，不明确称其为天使、邪灵或人间统治者。
  alternative: 可解释为管辖列国的超自然权势、人间政治领袖，或天上与地上权柄的对应呈现。
  rationale: 上下文尤其是米迦勒的出现强烈暗示超自然冲突，但希伯来文只使用שַׂר。译文应让上下文传达暗示，不把解释写进正文。
- issue: מַלְכֵי פָרָס的复数形式
  choice: 译作“波斯诸王”。
  alternative: “波斯王”或把复数理解为波斯王朝历代君王。
  rationale: 马所拉文本明确使用复数；译文保留原文形式，不按传统理解改成单数。
- issue: נוֹתַרְתִּי的语态含义
  choice: 译作“我就留在那里”。
  alternative: “我被留在那里”。
  rationale: 该形式兼有“被留下”和“留下、仍在”的可能；中文主动形式较自然，也不额外说明是谁使说话者留下。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“看哪”保留先知叙事的强调语气；避免“魔君”等解释性传统用语。分号用于呈现米迦勒来援与说话者留下之间的紧密转折和结果关系。
