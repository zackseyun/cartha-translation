source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֵלַ/י֮ אַל תִּירָ֣א דָנִיֵּאל֒ כִּ֣י מִן הַ/יּ֣וֹם הָ/רִאשׁ֗וֹן אֲשֶׁ֨ר נָתַ֧תָּ אֶֽת לִבְּ/ךָ֛ לְ/הָבִ֧ין וּ/לְ/הִתְעַנּ֛וֹת לִ/פְנֵ֥י אֱלֹהֶ֖י/ךָ נִשְׁמְע֣וּ דְבָרֶ֑י/ךָ וַ/אֲנִי בָ֖אתִי בִּ/דְבָרֶֽי/ךָ־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/010/012.yaml
  text: Then he said to me[a], “Do not fear, Daniel, because from the first day that you set your heart to understand and to humble yourself before your God, your words were heard[b], and I have come because of your words.”
translation:
  language: zh_hans
  text: 他对我说：“但以理，不要害怕。因为从你立定心意要明白、又在你的上帝面前谦卑自己[a]的第一天起，你的话就已蒙垂听；我因你的话[b]而来。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“刻苦己身”。这里的希伯来语在敬虔语境中可以表示自我克制、自我苦待或自我谦卑。
    reason: 词义选择
  - marker: b
    text: 也可译作“为回应你的话”。
    reason: 译法选择
lexical_decisions:
- source_word: אַל תִּירָא
  choice: 不要害怕
  rationale: 准确表达否定命令，在现代汉语中自然清楚，也符合使者安慰但以理的语境。
- source_word: מִן הַיּוֹם הָרִאשׁוֹן
  choice: 从……的第一天起
  rationale: 保留原文时间起点的表达，并使较长的汉语句子结构自然。
- source_word: נָתַתָּ אֶת לִבְּךָ
  choice: 立定心意
  rationale: 这个希伯来语习语表示定意、专注并投入内在意志；“立定心意”兼顾认知与意志层面。
- source_word: לְהָבִין
  choice: 要明白
  rationale: 直接表达求得理解或洞见的目的，不额外限定所要明白的具体内容。
- source_word: וּלְהִתְעַנּוֹת
  choice: 谦卑自己
  rationale: 在敬虔语境中可指自我谦抑或刻苦己身；正文采用自然且不把具体苦修方式说死的译法，较字面的可能含义置于脚注。
- source_word: לִפְנֵי אֱלֹהֶיךָ
  choice: 在你的上帝面前
  rationale: 保留“在……面前／临在中”的关系性表达以及“你的上帝”这一原文称谓。
- source_word: נִשְׁמְעוּ דְבָרֶיךָ
  choice: 你的话就已蒙垂听
  rationale: 保留“你的话”而不直接释作“祷告”；“蒙垂听”自然表达被上帝听见并接纳回应的语境。
- source_word: וַאֲנִי בָאתִי בִּדְבָרֶיךָ
  choice: 我正是因你的话而来
  rationale: 将介词 בְּ 译为原因关系，清楚表达使者的到来由但以理的话所促成，同时保留“回应”这一可能语气于脚注。
theological_decisions:
- issue: וּלְהִתְעַנּוֹת 所指的敬虔行动
  choice: 谦卑自己
  alternative: 刻苦己身
  rationale: 原文可以涵盖自我谦抑、自我克制或受苦式的敬虔行动。正文不把它限定为某种特定禁欲实践，脚注则保留较强、较字面的译法。
- issue: 句末 בִּדְבָרֶיךָ 的语义力量
  choice: 因你的话
  alternative: 为回应你的话
  rationale: 原文介词在此可以表达原因或回应关系。正文保留简洁的因果联系，但不进一步说明天使行动的机制。
- issue: נִשְׁמְעוּ 的隐含施事者
  choice: 蒙垂听
  alternative: 被听见
  rationale: 被动式没有明说施事者，语境明显指向上帝。“蒙垂听”符合汉语祷告语境，同时仍采用被动表达，没有把原文未明说的主语加入正文。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“立定心意”保留原文涉及内在意志与专注的习语力量；“蒙垂听”符合普通读者熟悉的祷告语境。脚注标记均放在对应词语之后，避免沿用英文资料中位置与内容不相符的标记。
