id: DAN.10.21
reference: Daniel 10:21
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אֲבָל֙ אַגִּ֣יד לְ/ךָ֔ אֶת הָ/רָשׁ֥וּם בִּ/כְתָ֖ב אֱמֶ֑ת וְ/אֵ֨ין אֶחָ֜ד מִתְחַזֵּ֤ק עִמִּ/י֙ עַל אֵ֔לֶּה כִּ֥י אִם מִיכָאֵ֖ל שַׂרְ/כֶֽם־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/daniel/010/021.yaml
  text: But I will tell you what is recorded in the writing of truth[a]. And there is no one who stands firmly with me against these except Michael[b], your prince.
translation:
  language: zh_hans
  text: 不过，我要把记在真理的文书上的事告诉你[a]。除你们的首领米迦勒外，没有一位在这些事上同我并肩奋力[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我要把记在真实的文书上的事告诉你。”
    reason: “真理的文书”也可理解为“真实的文书”；הָרָשׁוּם 可直译为“所写的”。
  - marker: b
    text: 或译：“没有一位同我一起奋力抵挡这些。”希伯来语可指与某人一同刚强站立；“这些”既可能指敌对者，也可能指正在谈论的事。
    reason: 保留 מִתְחַזֵּק עִמִּי עַל אֵלֶּה 在动作、介词关系和指代上的真实歧义。
lexical_decisions:
- source_word: אֲבָל
  choice: 不过
  rationale: 作为转折词承接上文；“不过”在现代汉语中自然、庄重，又保留明显的转折关系。
- source_word: אַגִּיד לְךָ
  choice: 我要把……告诉你
  rationale: נגד 的使役式在此意为告诉、宣告；采用“告诉你”清楚保留将来指向和第二人称单数。
- source_word: הָרָשׁוּם
  choice: 记载……的事
  rationale: רשם 的被动分词作名词性成分，指已写下或记录的内容；“记载……的事”符合现代汉语表达。
- source_word: בִּכְתָב אֱמֶת
  choice: 在真理文书中
  rationale: כְּתָב 指书写物、文件或文书，而非明确的“书卷”；“真理文书”保留其文献意味及 אֱמֶת 的属格张力，不把它限定为普通书籍。
- source_word: וְאֵין אֶחָד
  choice: 没有一位
  rationale: 准确表达 אין 与 אחד 构成的存在否定；“一位”适合此处所指的有位格天上存在。
- source_word: מִתְחַזֵּק עִמִּי
  choice: 同我一起奋力抵挡
  rationale: חזק 的 Hitpael 形式带有使自己刚强、奋力站稳之意；结合 עִמִּי 表示与说话者并肩出力。
- source_word: עַל אֵלֶּה
  choice: 抵挡这些势力
  rationale: 在本章天上争战的语境中，将 עַל 理解为对抗关系；“这些势力”使汉语指向清楚，但以脚注保留它也可能指相关事情的歧义。
- source_word: כִּי אִם
  choice: 除……外
  rationale: 在否定句后构成例外表达，现代汉语自然对应“除……外”。
- source_word: מִיכָאֵל
  choice: 米迦勒
  rationale: 采用汉语圣经传统中通行且易识别的人名音译。
- source_word: שַׂרְכֶם
  choice: 你们的首领
  rationale: שַׂר 可指首领、统领或王子；此处是与但以理所属群体相关的天上首领。“你们”保留希伯来语第二人称复数后缀，不把身份进一步解释为“天使长”。
theological_decisions:
- issue: 米迦勒的身份和职分
  choice: 你们的首领米迦勒
  alternative: 你们的天使长米迦勒；象征以色列的米迦勒
  rationale: 本节只称米迦勒为 שַׂרְכֶם，并未在这里使用“天使长”一词，也没有说明他只是象征，因此按经文本身保留其作为但以理群体之天上首领的表述。
- issue: עַל אֵלֶּה 所指为何
  choice: 这些势力
  alternative: 这些事；这些对手
  rationale: 上下文中的争战支持把它理解为敌对势力，但希伯来语“这些”本身未明说所指，故正文采用符合语境的表达，同时在脚注中保留另一种可能。
- issue: “真理文书”的性质
  choice: 不说明它具体是何种天上书卷或文献
  alternative: 真理之书；真实的文书
  rationale: בִּכְתָב אֱמֶת 可表达“真理的文书”或带真实性意味的文书；译文避免加入经文本节没有交代的系统性解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“文书”较贴近 כְּתָב 的文件或书写记录含义；“奋力抵挡”传达争战语境，同时通过脚注避免把原文歧义绝对化。人称上区分 לְךָ 的单数“你”和 שַׂרְכֶם 的复数“你们”。
