  to: 波斯王居鲁士第三年，有一信息启示给但以理；他名叫伯提沙撒。这信息是真实的，内容关乎一场大争战[a]。但以理明白这信息，并在异象中得了悟性。
  rationale: 修正末句以保留“在异象中”的关系，并改善开句和冲突短语的现代汉语表达。保留通行人名及启示性“信息”。脚注删去“漫长的艰难时期”，避免超出原文词义的扩展。
