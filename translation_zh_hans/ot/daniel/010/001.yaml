  text: בִּ/שְׁנַ֣ת שָׁל֗וֹשׁ לְ/כ֨וֹרֶשׁ֙ מֶ֣לֶךְ פָּרַ֔ס דָּבָר֙ נִגְלָ֣ה לְ/דָֽנִיֵּ֔אל אֲשֶׁר נִקְרָ֥א שְׁמ֖/וֹ בֵּלְטְשַׁאצַּ֑ר וֶ/אֱמֶ֤ת הַ/דָּבָר֙ וְ/צָבָ֣א גָד֔וֹל וּ/בִין֙ אֶת הַ/דָּבָ֔ר וּ/בִ֥ינָה ל֖/וֹ בַּ/מַּרְאֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/010/001.yaml
  text: In the third year of Cyrus king of Persia[a], a word was revealed to Daniel, who was called Belteshazzar. The word was true, and it concerned a great conflict; and he understood the word and had understanding in the vision.
translation:
  language: zh_hans
  text: 波斯王居鲁士第三年，有一信息启示给但以理；他名叫伯提沙撒。这信息是真实的，内容关乎一场大争战[a]。但以理明白这信息，并在异象中得了悟性。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “大争战”也可译作“大规模的战事”或“大战争”。
    reason: צָבָא גָדוֹל可指重大的战事或争战；此注保留其较正式的军事性译法，而不添加原文未明示的时间长度。
lexical_decisions:
- source_word: דָּבָר
  choice: 信息
  rationale: 此词可指“话、事情、信息”。本节指启示给但以理的内容，译作“信息”在现代汉语中自然，也能贯通本节三次出现的相关用法。
- source_word: נִגְלָה
  choice: 启示给
  rationale: Niphal 形式表示被揭示、显明；这里是启示内容向但以理显明，译作“启示给”清楚自然。
- source_word: נִקְרָא שְׁמוֹ
  choice: 称为
  rationale: 希伯来语直译为“他的名字被叫作”，现代汉语以“称为”表达同一被动命名意义。
- source_word: בֵּלְטְשַׁאצַּר
  choice: 伯提沙撒
  rationale: 采用现代中文圣经语境中通行的音译，以便读者辨认但以理的巴比伦名字。
- source_word: וֶאֱמֶת הַדָּבָר
  choice: 这信息是真实的
  rationale: 保留 דָּבָר 的重复，并明确肯定该启示可靠真实。
- source_word: וְצָבָא גָדוֹל
  choice: 所关乎的是一场大战
  rationale: צָבָא 可指军队、战争、服役或艰苦争战。结合但以理书10—12章的冲突语境，“一场大战”简洁保留军事色彩；句法上的“所关乎”属于语境性补足。
- source_word: וּבִין אֶת הַדָּבָר
  choice: 但以理明白了这信息
  rationale: בין 表示理解、辨明；补出主语“但以理”，使中文指代清楚。
- source_word: וּבִינָה לוֹ בַּמַּרְאֶה
  choice: 也领悟了那异象
  rationale: 该短语较直译为“在异象中，他有悟性/理解”。中文译作“领悟了那异象”自然地表达他对所见启示获得理解，同时不额外说明领悟的来源。
theological_decisions:
- issue: צָבָא גָדוֹל 在末世性启示中的含义
  choice: 所关乎的是一场大战
  alternative: 并且有大争战／是一段漫长的艰难时期
  rationale: 该短语本身简短且有歧义，可指重大的战争、争战，也可能引申为严峻艰苦。正文保留军事性的主要意义，不把它限定为纯属天上或地上的冲突；其他可能译法列入脚注。
- issue: 末句理解与异象的关系
  choice: 也领悟了那异象
  alternative: 他在异象中得了悟性／他留心这信息，明白了异象
  rationale: 希伯来语可表达但以理对异象有所理解，也可能强调他在异象中获得领悟。正文采用自然而不过度神学化的表达。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“居鲁士”“伯提沙撒”使用通行圣经音译；以“信息”表达启示性 דָּבָר，避免“话”在此处可能显得口语或含混。正文保留原文简洁陈述的节奏，并用脚注呈现关键词义歧义。
