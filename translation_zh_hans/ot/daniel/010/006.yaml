id: DAN.10.6
reference: Daniel 10:6
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וּ/גְוִיָּת֣/וֹ כְ/תַרְשִׁ֗ישׁ וּ/פָנָ֞י/ו כְּ/מַרְאֵ֤ה בָרָק֙ וְ/עֵינָי/ו֙ כְּ/לַפִּ֣ידֵי אֵ֔שׁ וּ/זְרֹֽעֹתָי/ו֙ וּ/מַרְגְּלֹתָ֔י/ו כְּ/עֵ֖ין נְחֹ֣שֶׁת קָלָ֑ל וְ/ק֥וֹל דְּבָרָ֖י/ו כְּ/ק֥וֹל הָמֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/010/006.yaml
  text: His body was like beryl[a], his face like the appearance of lightning, his eyes like torches of fire, his arms and his feet like the gleam of polished bronze[c][b], and the sound of his words like the sound of a multitude.
translation:
  language: zh_hans
  text: 他的身躯仿佛水苍玉[a]，面容看起来如同闪电，眼睛好像燃烧的火把，双臂和双脚如同磨亮之铜的光泽[b]；他说话的声音仿佛众人的喧声[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“黄玉”“贵橄榄石”，也可能是另一种宝石；希伯来语“他施石”究竟指哪一种宝石，无法确定。
    reason: lexical_alternative
  - marker: b
    text: 或译“如同擦亮之铜的外观”。
    reason: lexical_alternative
  - marker: c
    text: 或译“仿佛人群的声音”或“仿佛众人的轰鸣声”。
    reason: lexical_alternative
lexical_decisions:
- source_word: גְוִיָּתוֹ
  choice: 他的身躯
  rationale: גְוִיָּה指身体或躯体；“身躯”在异象性描写中既具体又庄重，并不把含义缩窄为躯干。
- source_word: כְתַרְשִׁישׁ
  choice: 仿佛水苍玉
  rationale: תַּרְשִׁישׁ指一种宝石，但具体矿物无法确定。“水苍玉”是较常见的对应说法，同时以脚注保留黄玉、贵橄榄石等可能。
- source_word: פָנָיו
  choice: 面容
  rationale: 上下文逐项描写可见的身体特征，因此取פָּנִים的“脸、面容”义，而不是“临在”。
- source_word: כְמַרְאֵה בָרָק
  choice: 看起来如同闪电
  rationale: מַרְאֶה强调所见的外观；“看起来如同”保留这一层意思，又比生硬直译“如闪电的外观”自然。
- source_word: כְלַפִּידֵי אֵשׁ
  choice: 好像燃烧的火把
  rationale: לַפִּיד是火把或燃烧的木炬；“燃烧的火把”自然呈现希伯来语“火之火把”的鲜明意象。
- source_word: זְרֹעֹתָיו וּמַרְגְּלֹתָיו
  choice: 双臂和双脚
  rationale: זְרוֹעַ通常指手臂，מַרְגְּלוֹת在这里指脚或下肢；正文采用最直接的身体部位称呼。
- source_word: כְעֵין נְחֹשֶׁת קָלָל
  choice: 如同磨亮之铜的光泽
  rationale: עֵין在此表示外观或光泽，נְחֹשֶׁת是铜或青铜，קָלָל可能表示磨亮、擦亮或发亮。“磨亮之铜的光泽”兼顾视觉效果和修饰语含义。
- source_word: קוֹל דְּבָרָיו
  choice: 他说话的声音
  rationale: 原文直指“他言语的声音”；中文以“他说话的声音”表达更自然，同时保留对听觉效果的强调。
- source_word: כְקוֹל הָמוֹן
  choice: 仿佛众人的喧声
  rationale: הָמוֹן既可指众多人群，也可指其发出的嘈杂、轰鸣之声。“众人的喧声”同时保留人多与声势浩大的意象。
theological_decisions:
- issue: 异象中人物的身份
  choice: 正文只按原文描写一位具有人形特征的异象人物，不给他加上身份称谓。
  alternative: 将他明确称为天使、神显中的人物，或道成肉身前显现的基督。
  rationale: 本节只描写其外貌和声音，并未明确说明其身份；翻译不应替经文作出神学认定。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。全句保持异象描写的排比节奏，以“仿佛、如同、好像”避免机械重复；分号区分外貌描写与声音描写。所有不确定的宝石、金属光泽及הָמוֹן的声响含义均在脚注中保留。
