  terminology: “水苍玉”是中文圣经传统中对应“他施石／beryl”的常见译名，脚注正确说明其具体矿物未定。火把、铜、身躯、面容等术语一致且无不必要的神学导向。脚注锚点[a][b][c]均置于相应不确定词语之后，内容与正文匹配。
