  source_fidelity: 译文逐项忠实对应希伯来文：גְוִיָּתוֹ译为“身躯”，תַרְשִׁישׁ译作“水苍玉”并以脚注保留矿物鉴定的不确定性；“面容看起来如同闪电”“眼睛好像燃烧的火把”“双臂和双脚如同磨亮之铜的光泽”均保留原文的视觉比喻和并列结构。“他说话的声音仿佛众人的喧声”准确传达קוֹל דְּבָרָיו及הָמוֹן所兼具的众多人群与强烈声响意象，未擅自界定异象人物身份。
