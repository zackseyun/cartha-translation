base_translation:
  language: en
  yaml_path: translation/ot/daniel/010/003.yaml
  text: I ate no delicacies[a], and no meat or wine entered my mouth, nor did I anoint myself at all[b], until the completion of three full weeks.
translation:
  language: zh_hans
  text: 我没有吃美味佳肴[a]，肉和酒也没有入口；我完全没有用油抹身，直到整整三个星期期满[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译为“可喜爱的食物”，即上好、可口的食物。
    reason: lexical_alternative
  - marker: b
    text: 直译为“三个星期的日子”，即整整三个星期。
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶחֶם חֲמֻדוֹת
  choice: 美味佳肴
  rationale: 该词组直译近似“令人喜爱的饼（食物）”，在此指可口、上好的食物；“美味佳肴”自然传达其习语含义，又不局限于面饼。
- source_word: בָשָׂר
  choice: 肉
  rationale: 在饮食语境中，译作“肉”最自然准确。
- source_word: יַיִן
  choice: 酒
  rationale: 此处指葡萄酒；在本句饮食语境中用“酒”简洁自然。
- source_word: לֹא בָא אֶל־פִּי
  choice: 没有入口
  rationale: 保留希伯来语“没有来到我口中”的形象，同时以现代汉语自然表达没有食用。
- source_word: סוֹךְ לֹא סָכְתִּי
  choice: 完全没有用油抹身
  rationale: 同根词重复加强否定语气，所指是以油涂抹身体这一日常梳洗或舒缓做法；“完全没有”体现强调。
- source_word: עַד מְלֹאת
  choice: 直到满了
  rationale: 表达这段时期达到完成、期满之意，并保持原文的时间界限。
- source_word: שְׁלֹשֶׁת שָׁבֻעִים יָמִים
  choice: 整整三个星期
  rationale: 字面为“三个星期的日子”，强调实际按日计算且完整的三个星期；“整整”在现代汉语中清楚传达此意。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“美味佳肴”传达习语含义；“肉和酒也没有入口”保留原文形象；“用油抹身”避免把日常梳洗行为误读为特定宗教礼仪。脚注标记按其实际说明对象分别置于“美味佳肴”和“整整三个星期”之后。
