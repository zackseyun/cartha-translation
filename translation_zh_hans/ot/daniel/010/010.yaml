revisions:
- from: 看哪，有一只手触摸我，使我摇晃着[a]，以双膝和两手掌撑地。
  to: 看哪，有一只手触摸我，使我以双膝和双手的手掌撑地[a]。
  rationale: 修订消除了草稿后半句的语法问题，并避免将原文使役动词固定译为“摇晃”。正文按上下文自然表达手的触碰使但以理转为以膝和手掌支撑的姿势；脚注保留“移动、摇动、颤抖”等可能的词义范围，未作超过原文的解释。
