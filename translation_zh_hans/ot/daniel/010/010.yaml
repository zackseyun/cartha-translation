  yaml_path: translation/ot/daniel/010/010.yaml
  text: And behold[a], a hand touched me and set me on my knees and the palms of my hands.
translation:
  language: zh_hans
  text: 看哪，有一只手触摸我，使我以双膝和双手的手掌撑地[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“使我移动”或“使我摇动”；这个希伯来语动词可表示使人移动、摇动或颤抖。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留希伯来语提示读者注意眼前突发情景的鲜明话语功能；在异象叙事中庄重而清楚。
- source_word: יָד
  choice: 有一只手
  rationale: 原文“手”没有冠词；这样既自然，也保留这只手的所属者尚未明说所形成的叙事悬念。
- source_word: נָגְעָה בִּי
  choice: 触摸我
  rationale: נגע 在此表示身体接触；“触摸”直接、自然，不额外引入击打等含义。
- source_word: וַתְּנִיעֵנִי
  choice: 使我摇晃着[a]
  rationale: נוע 的使役式可表示使人移动、摇动或颤抖。正文采用“使我摇晃着”，表现但以理身体不稳，同时以脚注保留词义范围。
- source_word: עַל בִּרְכַּי וְכַפּוֹת יָדָי
  choice: 以双膝和两手掌撑地
  rationale: 自然呈现原文所描述的身体姿态，并明确保留 כַּפּוֹת יָדַי 所指的“手掌”，而不笼统译作“手”。
