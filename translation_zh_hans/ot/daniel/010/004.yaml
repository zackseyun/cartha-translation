base_translation:
  language: en
  yaml_path: translation/ot/daniel/010/004.yaml
  text: On the twenty-fourth day of the first month[a], I was by the side of the great river—that is, the Tigris.
translation:
  language: zh_hans
  text: 正月二十四日，我在大河边，就是底格里斯河[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文作“希底结”，即通常所称的底格里斯河。
    reason: 说明原文河名，并交代正文采用现代通行译名。
lexical_decisions:
- source_word: וּבְיוֹם עֶשְׂרִים וְאַרְבָּעָה
  choice: 正月二十四日
  rationale: 希伯来文用基数词构成日期；现代汉语日期惯用“二十四日”。句首的连接词不必机械译出。
- source_word: לַחֹדֶשׁ הָרִאשׁוֹן
  choice: 正月
  rationale: 指历法中的第一个月。译作“正月”自然简洁，不额外指定其月份名称。
- source_word: וַאֲנִי הָיִיתִי
  choice: 我在
  rationale: 此处 היה 表示当时所处的位置，现代汉语以“我在”最自然。
- source_word: עַל יַד
  choice: 在……边
  rationale: 该惯用语表示“在旁边、靠近”；原文没有明确使用“河岸”一词，因此保留较宽泛的空间表达。
- source_word: הַנָּהָר הַגָּדוֹל
  choice: 大河
  rationale: 直接保留名词与形容词的描述，不把“גדול”强化为“浩荡”或“雄伟”。
- source_word: הוּא חִדָּקֶל
  choice: 就是底格里斯河
  rationale: הוּא 在此引出说明或确认；חִדָּקֶל 是底格里斯河的希伯来名称，正文采用现代汉语通行地名。
