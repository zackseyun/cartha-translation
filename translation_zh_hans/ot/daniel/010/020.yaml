  text: וַ/יֹּ֗אמֶר הֲ/יָדַ֨עְתָּ֙ לָ/מָּה בָּ֣אתִי אֵלֶ֔י/ךָ וְ/עַתָּ֣ה אָשׁ֔וּב לְ/הִלָּחֵ֖ם עִם שַׂ֣ר פָּרָ֑ס וַ/אֲנִ֣י יוֹצֵ֔א וְ/הִנֵּ֥ה שַׂר יָוָ֖ן בָּֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/010/020.yaml
  text: Then he said[a], “Do you know why I have come to you? And now I will return to fight against the prince of Persia; and when I go out, behold[c][b], the prince of Greece is coming.”
translation:
  language: zh_hans
  text: 他说：“你知道我为什么到你这里来吗？现在我要回去与波斯的统领[b]交战；我离开时[a]，看哪，希腊[c]的统领就要来了。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文也可直译为“而我出去（离开）”或“而我正在出去（离开）”；原句简略，既可单指离去，也可表示“我离开时”的时间次序。
    reason: lexical_alternative
  - marker: b
    text: “统领”在这里很可能指与某一国家相关的超自然统治者，不过本节并未明确这样称呼他。
    reason: alternative_reading
  - marker: c
    text: 希伯来文作“雅完”，通常指希腊或希腊势力。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיָדַעְתָּ
  choice: 你知道……吗
  rationale: 疑问词与 ידע 连用，是询问但以理是否知道或明白来访的原因；“你知道……吗”是自然、简洁的现代汉语。
- source_word: לָמָּה בָּאתִי אֵלֶיךָ
  choice: 我为什么到你这里来
  rationale: לָמָּה 表示询问原因；完成式 בָּאתִי 在当前谈话中指已经发生且与眼下相关的来到，汉语无需另加完成标记。
- source_word: וְעַתָּה אָשׁוּב
  choice: 现在我要回去
  rationale: וְעַתָּה 推进话语，אָשׁוּב 在语境中指将返回先前的争战；“要回去”自然表达其将来指向。
- source_word: לְהִלָּחֵם עִם
  choice: 与……交战
  rationale: 该结构表示同对方争战；“与……交战”既保留介词形式，又清楚表达敌对关系。
- source_word: שַׂר פָּרָס
  choice: 波斯的统领
  rationale: שַׂר 可指首领、统领或王公。“统领”避免把该词误解为君王之子，也不在正文中断定其为天使、邪灵或人间官长。
- source_word: וַאֲנִי יוֹצֵא
  choice: 我离开时
  rationale: 希伯来语短句较凝练，可作简单并列的离去，也可理解为引出随后事件的时间背景；正文采用合乎汉语习惯的时间表达，并以脚注保留另一可能。
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 该提示词使读者注意随后的突发或重要情形；“看哪”保留异象叙述庄重而醒目的语气。
- source_word: שַׂר יָוָן
  choice: 希腊的统领
  rationale: יָוָן 在这里通常指希腊或希腊势力；“希腊”对现代读者清楚，“统领”则与本节前一个 שַׂר 保持一致。
- source_word: בָּא
  choice: 就要来了
  rationale: 分词可表示正在发生或临近的行动；结合前面的离去与争战次序，“就要来了”自然表达其临近，同时不把时间说得过于精确。
theological_decisions:
- issue: “波斯的统领”和“希腊的统领”的身份
  choice: 正文保留“统领”，不明说是天使、邪灵或人间统治者。
  alternative: 译作“波斯的魔君／希腊的魔君”，或理解为与国家相关的超自然统治者。
  rationale: 上下文强烈暗示这些角色属于超自然领域，但本节的 שַׂר 本身并未明确标明其性质；采用较中性的“统领”可让上下文引导理解，并保留经文的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“交战”和“看哪”保留异象叙述的严肃感；以“统领”对应 שַׂר，避免现代汉语“王子”容易被理解为君王之子的歧义，也避免“魔君”等解释性过强的译法。所有脚注标记均置于其所说明的词句之后。
