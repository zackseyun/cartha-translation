source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֵלַ֡/י דָּנִיֵּ֣אל אִישׁ חֲ֠מֻדוֹת הָבֵ֨ן בַּ/דְּבָרִ֜ים אֲשֶׁר֩ אָנֹכִ֨י דֹבֵ֤ר אֵלֶ֨י/ךָ֙ וַ/עֲמֹ֣ד עַל עָמְדֶ֔/ךָ כִּ֥י עַתָּ֖ה שֻׁלַּ֣חְתִּי אֵלֶ֑י/ךָ וּ/בְ/דַבְּר֥/וֹ עִמִּ֛/י אֶת הַ/דָּבָ֥ר הַ/זֶּ֖ה עָמַ֥דְתִּי מַרְעִֽיד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/010/011.yaml
  text: And he said to me[a], “Daniel, man greatly beloved, understand the words that I am speaking to you, and stand in your place, for now I have been sent to you.” And when he spoke this word to me[c][b], I stood trembling.
translation:
  language: zh_hans
  text: 他对我说：“但以理啊，你这深受珍爱的人[a]，要明白我对你所说的话，并站起来[b]，因为我如今奉差遣来到你这里。”在他对我说这话时[c]，我就战战兢兢地站了起来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “深受珍爱的人”也可译作“极受尊重的人”或“极其宝贵的人”。原文直译近于“珍贵、可爱的人”，在这里用作尊称。
    reason: lexical_alternative
  - marker: b
    text: “站起来”所译的原文直译近于“站在你的站立之处”，也可理解为“站直了”或“站定”。
    reason: lexical_alternative
  - marker: c
    text: “这话”也可译作“这信息”或“这件事”。原文所用的词可指言语、事情或信息。
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ חֲמֻדוֹת
  choice: 深受爱重的人
  rationale: חֲמֻדוֹת含有可爱、宝贵、受珍视之意，在这里用作对但以理的尊称。“深受爱重”既保留关爱意味，也容纳“备受珍视、尊重”的语义，不将其来源或性质说得过于明确。
- source_word: הָבֵן
  choice: 要明白
  rationale: 该祈使式要求但以理领会接下来所说之言的含义；“要明白”自然、直接，并保持命令语气。
- source_word: בַּדְּבָרִים אֲשֶׁר אָנֹכִי דֹבֵר אֵלֶיךָ
  choice: 我对你所说的话
  rationale: דְּבָרִים为复数，结合“说”这一语境，宜译为“话”；分词דֹבֵר表示当前正在进行的言说，现代汉语无需机械添加“正在”也可清楚表达。
- source_word: וַעֲמֹד עַל־עָמְדֶךָ
  choice: 站在你的位置上
  rationale: 原文以“站”及同根名词组成强调性表达，字面近于“站在你所站之处”。此译保留“位置”的成分，也让上下文中的实际起身动作保持可见。
- source_word: שֻׁלַּחְתִּי אֵלֶיךָ
  choice: 我奉差遣到你这里来
  rationale: 原文是被动完成式，强调说话者是受差遣而来；“奉差遣”保留被动受命的意味，又符合庄重叙事语体。
- source_word: וּבְדַבְּרוֹ עִמִּי אֶת־הַדָּבָר הַזֶּה
  choice: 他对我说这话时
  rationale: 介词ב与不定词结构表示同时发生；עִמִּי字面为“与我”，但在言说语境中自然表达为“对我”。דָּבָר在此可指一句话、所说内容或信息，正文用“这话”保留原文单数。
- source_word: עָמַדְתִּי מַרְעִיד
  choice: 我就战战兢兢地站了起来
  rationale: עָמַדְתִּי表示站立，מַרְעִיד描写身体发抖；结合前文的命令和但以理先前俯伏的状态，“站了起来”最合乎汉语叙事，“战战兢兢”准确表现其颤抖。
theological_decisions:
- issue: 天使对但以理的尊称所表达的是蒙爱还是受尊重
  choice: 深受爱重的人
  alternative: 极蒙眷爱的人；极受尊重的人；极其宝贵的人
  rationale: 原文既有可爱、可喜、宝贵的词义，又在语境中构成尊称。“爱重”刻意保留关爱与珍视、尊重之间的张力，不明确添加“上帝所爱”等原文未明说的对象。
- issue: וַעֲמֹד עַל־עָמְדֶךָ是单纯要求站直，还是要求站在其位置上
  choice: 站在你的位置上
  alternative: 站起来；站直了；站在你的岗位上
  rationale: 原文的同根表达含有实际站立，也可能带有就位或站稳的意味。正文保留“位置”，避免把它缩减为纯粹的身体姿态，也不将其强化为带有职分含义的“岗位”。
translation_notes:
  register: 采用现代、庄重而易懂的普通话叙事语体。称呼使用“但以理啊”表现直接呼语；“奉差遣”保留天使受命而来的正式色彩；末句用“战战兢兢地站了起来”自然呈现身体颤抖与起身动作。脚注只说明原文确有的词义和句法空间，不替正文消解其歧义。
