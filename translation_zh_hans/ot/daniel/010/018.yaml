  yaml_path: translation/ot/daniel/010/018.yaml
  text: Again one with the appearance of a man touched me and strengthened me[a].
translation:
  language: zh_hans
  text: 又有一位看起来像人的，触摸我，使我得力[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “看起来像人的”也可译作“有人的形貌”或“形貌如人”。希伯来文描述这位显现者可见的外貌，并未明确说他只是人。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּסֶף
  choice: 又
  rationale: יסף后接限定动词常表示动作再次发生；“又”自然简洁地传达“再次”的承接作用。
- source_word: וַיִּגַּע בִּי
  choice: 触摸我
  rationale: נגע与ב连用在此指实际接触；结合异象场景和随后得力的结果，“触摸我”最贴切。
- source_word: כְּמַרְאֵה אָדָם
  choice: 有一位形貌像人的
  rationale: מַרְאֶה指可见的形貌，前缀כ表示相似；译文既以“一位”补足汉语主语，又保留只是描述外观、未明说其身份的含义。
- source_word: אָדָם
  choice: 人
  rationale: 这里指异象中个体所呈现的人的形貌；现代汉语用“人”自然准确，也不把该存在直接认定为普通人。
- source_word: וַיְחַזְּקֵנִי
  choice: 使我有力量
  rationale: חזק的加强词干表示使人刚强、得力；“使我有力量”保留身体与精神两方面的宽泛含义。
theological_decisions:
- issue: 形貌像人的那一位的身份
  choice: 仅按经文描述其外貌，不指明身份
  alternative: 明确译作天使或道成肉身前的基督
  rationale: 希伯来文只说其形貌像人，并未明确认定其身份；译文因此保留经文本身的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“形貌”比“样子”略显庄重，并准确对应异象中的可见外观；“使我有力量”自然表达得力而不局限于情绪上的鼓励。
