language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יֹּ֜אמֶר אַל תִּירָ֧א אִישׁ חֲמֻד֛וֹת שָׁל֥וֹם לָ֖/ךְ חֲזַ֣ק וַ/חֲזָ֑ק וּֽ/בְ/דַבְּר֤/וֹ עִמִּ/י֙ הִתְחַזַּ֔קְתִּי וָ/אֹֽמְרָ֛/ה יְדַבֵּ֥ר אֲדֹנִ֖/י כִּ֥י חִזַּקְתָּֽ/נִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/010/019.yaml
  text: And he said[a], “Do not fear, man greatly beloved; peace be to you. Be strong, yes, be strong.” And when he spoke with me, I was strengthened and said, “Let my lord speak, for you have strengthened me.”
translation:
  language: zh_hans
  text: 他对我说：“极蒙眷爱的人[a]，不要惧怕。愿你平安！要刚强，要刚强！”他同我说话时，我便刚强起来，说：“我主，请说吧，因为你已使我刚强。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“极受珍爱的人”或“极受尊重的人”。希伯来文直译近于“珍爱／可贵之人”或“所切慕之人”；这是一种表示特别眷爱、珍视或器重的习语性称呼。
    reason: 词义存在真实的习语性范围，正文无法同时呈现“被爱”“珍贵”和“受器重”等色彩。
lexical_decisions:
- source_word: אִישׁ חֲמֻדוֹת
  choice: 极蒙眷爱的人
  rationale: 该短语直译近于“珍爱之物／愿望之人”，在这里是表示特别恩宠、珍爱或尊重的称呼。“极蒙眷爱的人”自然庄重，并保留其带有人际亲近感的主要语气；其他可能含义列入脚注。
- source_word: שָׁלוֹם לָךְ
  choice: 愿你平安
  rationale: 这是祝愿性的问安或赐福语，并非仅陈述“平安”这一抽象概念；“愿你平安”准确表达其祝愿语气。
- source_word: חֲזַק וַחֲזָק
  choice: 要刚强，要刚强
  rationale: 原文重复同一命令式以加强劝勉。中文直接重复既自然有力，也与本节后续同词根的“刚强”形成呼应。
- source_word: וּבְדַבְּרוֹ עִמִּי
  choice: 他同我说话时
  rationale: 介词加不定词结构在此表达时间关系；此译简洁地保留“在他说话之时”的同步性。
- source_word: הִתְחַזַּקְתִּי
  choice: 我便刚强起来
  rationale: Hitpael形式表示进入刚强、有力量的状态。“刚强起来”既保留形态上的状态变化，也不必在中文中强行判定为纯被动或自我使役。
- source_word: יְדַבֵּר אֲדֹנִי
  choice: 请我主说吧
  rationale: 未完成式在此有委婉请求的语气。“请……吧”符合现代汉语敬语表达；“我主”保留对说话者的尊称。
- source_word: כִּי חִזַּקְתָּנִי
  choice: 因为你已使我刚强
  rationale: 该分句说明但以理如今能够继续聆听的原因；“使我刚强”保留使役意义，并贯通本节反复出现的חזק词根。
theological_decisions:
- issue: 对说话者的称呼אֲדֹנִי
  choice: 我主
  alternative: 我的主人；主
  rationale: 此词是对眼前说话者的单数敬称，并非神名。译作“我主”保留尊敬程度，同时不把该人物进一步认定为上帝或弥赛亚。
- issue: אִישׁ חֲמֻדוֹת所表达的是被爱、被珍视还是受尊重
  choice: 正文采用“极蒙眷爱的人”，脚注保留“极受珍爱／极受尊重”等可能性
  alternative: 极受珍爱的人；极受尊重的人；令人十分喜爱的人
  rationale: 该希伯来习语语义范围兼有珍爱、可贵和受器重之意。正文需自然可读，但不应把其神学关系限定为某一种；因此以“眷爱”为主译，并在脚注说明真实的词义张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“要刚强，要刚强”保留原文的重复强调；“我便刚强起来”避免把Hitpael无必要地完全被动化；“我主”作为敬称书写，不使用专指神的“大写”区分或额外神学称号。
