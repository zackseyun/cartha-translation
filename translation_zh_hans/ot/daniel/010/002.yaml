lexical_decisions:
- source_word: בַּיָּמִים הָהֵם
  choice: 那些日子
  rationale: 忠实保留希伯来语复数时间表达及其叙事衔接功能；现代汉语中自然、庄重。
- source_word: אֲנִי דָנִיֵּאל
  choice: 我但以理
  rationale: 保留独立代词加专名所带的自我指明和轻微强调；汉语无需插入逗号。
- source_word: הָיִיתִי מִתְאַבֵּל
  choice: 悲哀了
  rationale: 该结构表示过去一段时间持续处于哀恸之中；结合后面的时长短语，“悲哀了”在现代汉语中自然，并保留持续意义。
- source_word: שְׁלֹשָׁה שָׁבֻעִים יָמִים
  choice: 整整三个星期
  rationale: 原文直译近于“三个星期的日子”，其中“日子”说明这里是按日计算的普通星期；“整整三个星期”自然传达其具体、完整的时长，同时脚注保留原文形式。
theological_decisions:
- issue: “三个星期”是否应解释为象征性的“七期”
  choice: 按日计算的三个普通星期
  alternative: 象征性的三个“七期”
  rationale: 名词 יָמִים（“日子”）对 שָׁבֻעִים 作出限定，表明此处所说的是由日子组成的星期；译文不进一步赋予其未明说的神学象征意义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“整整”传达明确而持续的三周时段；脚注说明希伯来语较特殊的表达，避免正文生硬。
