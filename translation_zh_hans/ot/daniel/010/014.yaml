  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וּ/בָ֨אתִי֙ לַ/הֲבִ֣ינְ/ךָ֔ אֵ֛ת אֲשֶׁר יִקְרָ֥ה לְ/עַמְּ/ךָ֖ בְּ/אַחֲרִ֣ית הַ/יָּמִ֑ים כִּי ע֥וֹד חָז֖וֹן לַ/יָּמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/010/014.yaml
  text: And I have come to make you understand what will happen to your people in the latter days[b][a], for the vision is yet for days to come.
translation:
  language: zh_hans
  text: 我来，是要使你明白，在末后的日子[a]，你的人民将会遇到什么事；因为这异象还关乎未来的日子[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“在日后的岁月”或“在后来的日子”。这个希伯来语先知性惯用语指向未来事件最终展开的时期。
    reason: alternative_reading
  - marker: b
    text: 或译“关乎许多日子”或“关乎以后的日子”。原文表明这异象涉及仍在将来的时期。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָאתִי
  choice: 我来
  rationale: 这是带连接词的בוא第一人称单数完成式；结合上下文，来者是在说明自己已经来到并且现在在场的目的。汉语“我来”自然地兼具已经抵达和当前目的的语感。
- source_word: לַהֲבִינְךָ
  choice: 使你明白
  rationale: בין的使役形不定式带第二人称阳性单数后缀，表示使但以理理解，而不只是“理解”。
- source_word: אֵת אֲשֶׁר יִקְרָה לְעַמְּךָ
  choice: 你的人民将会遇到什么事
  rationale: אֵת אֲשֶׁר引出所要明白的内容；קרה表示发生、临到。这里译作“遇到什么事”清楚自然，又不像“遭遇”那样预先限定为灾祸。
- source_word: בְּאַחֲרִית הַיָּמִים
  choice: 在末后的日子
  rationale: 保留希伯来语先知性惯用语中指向未来终局或后期阶段的意味，同时不把它限定为某一种末世时间表。
- source_word: כִּי
  choice: 因为
  rationale: 此处引出前面说明的理由；“因为”直接表达解释或因果关系。
- source_word: עוֹד חָזוֹן לַיָּמִים
  choice: 这异象还关乎未来的日子
  rationale: עוֹד表明所指时间仍在前方；חָזוֹן指上下文正在谈论的异象；לַיָּמִים指向尚未来到的日子。译文保留时间范围可能较远、但并未明确数量的特点。
theological_decisions:
- issue: בְּאַחֲרִית הַיָּמִים所指的末后时期
  choice: 在末后的日子
  alternative: 在日后的岁月／在后来的日子
  rationale: 原文是先知文学中的时间表达，可指事件在未来的最终展开，却没有在本节中规定具体的末世体系或时间表。正文保留其终局意味，脚注说明较宽的理解。
- issue: לַיָּמִים的时间范围
  choice: 关乎未来的日子
  alternative: 关乎许多日子／关乎以后的日子
  rationale: 该短语明确指向未来，但本身未必强调可计算的“许多”日子；因此正文不把数量含义说死，并在脚注保留其他可能译法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“你的人民”贴近עַמְּךָ，又避免“百姓”在现代语境中可能产生的身份含混；分号保留原文后半句的解释关系。所有脚注标记均置于其所说明的短语之后。
