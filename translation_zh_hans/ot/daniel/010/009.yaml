base_translation:
  language: en
  yaml_path: translation/ot/daniel/010/009.yaml
  text: Then I heard the sound of his words[a], and when I heard the sound of his words, I fell into a deep sleep on my face[b], with my face to the ground.
translation:
  language: zh_hans
  text: 于是，我听见他说话的声音[a]；我一听见他说话的声音，就脸朝地伏着，陷入沉睡[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他话语的声音”。
    reason: lexical_alternative
  - marker: b
    text: “陷入沉睡”也可译作“沉沉睡去”或“昏睡过去”；希伯来文表示深沉、昏重的睡眠。
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשְׁמַע
  choice: 于是，我听见
  rationale: 该叙事性动词形式推进事件次序；“于是”在现代汉语中自然表达随后发生的动作。
- source_word: קוֹל דְּבָרָיו
  choice: 他说话的声音
  rationale: קוֹל 可指“声音”，דְּבָרָיו 指“他的话”；此译既保留听觉重点，也比生硬的“他话语的声音”更符合现代汉语。
- source_word: וּכְשָׁמְעִי
  choice: 我一听见
  rationale: כְּ 与该形式构成时间关系；“一……就……”清楚呈现听见声音与随即倒伏沉睡之间的紧密承接。
- source_word: נִרְדָּם
  choice: 沉沉睡去
  rationale: 该词表示陷入深沉、昏重的睡眠状态；“沉沉睡去”既表达程度，也保留进入该状态的动态含义，不将其技术性解释为“出神”。
- source_word: עַל־פָּנַי וּפָנַי אָרְצָה
  choice: 面伏于地
  rationale: 两个短语合起来强调但以理脸朝下、伏在地上的姿态；汉语用“面伏于地”凝练而完整地表达这一重复画面。
theological_decisions:
- issue: 但以理在异象中的状态性质
  choice: 因不堪承受而伏地进入沉睡状态
  alternative: 进入宗教性的出神状态
  rationale: נִרְדָּם 通常指深沉或昏重的睡眠；经文本身描写的是身体倒伏和沉睡，并未要求采用“出神”这一技术性解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“他说话的声音”避免不自然的直译；“面伏于地”合并原文两个彼此强化的方位短语，同时保留脸朝地的明确画面。
