    rationale: 希伯来文说但以理是在脸朝地的姿态中“处于昏沉/沉睡状态”（הָיִיתִי נִרְדָּם），并以“脸朝地”再次强化。原译“面伏于地，沉沉睡去”基本正确，但并列动词容易淡化该姿态与状态的同时性。
  revised_text: 于是，我听见他说话的声音[a]；我一听见他说话的声音，就脸朝地伏着，陷入沉睡[b]。
