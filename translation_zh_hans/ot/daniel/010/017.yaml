  text: וְ/הֵ֣יךְ יוּכַ֗ל עֶ֤בֶד אֲדֹנִ/י֙ זֶ֔ה לְ/דַבֵּ֖ר עִם אֲדֹ֣נִ/י זֶ֑ה וַ/אֲנִ֤י מֵ/עַ֨תָּה֙ לֹֽא יַעֲמָד בִּ֣/י כֹ֔חַ וּ/נְשָׁמָ֖ה לֹ֥א נִשְׁאֲרָה בִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/010/017.yaml
  text: So how can this servant of my lord speak with my lord like this? As for me[a], from now on no strength remains in me[c][b], and no breath is left in me.
translation:
  language: zh_hans
  text: 我主[a]的这个仆人，怎能与我主这样[b]说话呢？至于我，现在[c]我已毫无力气，气息也不剩了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “我主”也可译作“我的主人”。这里的称谓不是神名“耶和华”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来原文两次使用指示词，直译可作“我主的这个仆人……我的这位主”。本译将第二处按语境译为“这样”，以表达眼前这次交谈的临场性。
    reason: lexical_alternative
  - marker: c
    text: 也可译作“如今”或“从现在起”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵיךְ יוּכַל
  choice: 怎能
  rationale: 承接上文并引出反问；“怎能”自然表达能力动词与反问语气，汉语无需另译句首连接词。
- source_word: עֶבֶד אֲדֹנִי זֶה
  choice: 我主的这个仆人
  rationale: “仆人”是但以理谦卑自称的宫廷敬语，不强调奴隶身份；“这个”保留 זֶה 的近指意味。
- source_word: לְדַבֵּר עִם אֲדֹנִי זֶה
  choice: 跟我的这位主说话
  rationale: “跟……说话”保留 עִם“与、跟”的关系；“这位”以自然汉语保留第二个 זֶה 的指示意味。
- source_word: וַאֲנִי
  choice: 至于我
  rationale: 突出代词并转入但以理对自身状况的陈述。
- source_word: מֵעַתָּה
  choice: 如今
  rationale: 在本语境中指眼下、此刻开始的状态；“如今”比“从现在起”更少暗示长期延续，同时保留时间起点的意味。
- source_word: לֹא יַעֲמָד בִּי כֹחַ
  choice: 里面已经没有力气
  rationale: 希伯来语直译为“力气不在我里面站立”；此译自然表达力量无法存留的意思，并保留“在我里面”的内在表述。
- source_word: וּנְשָׁמָה לֹא נִשְׁאֲרָה בִי
  choice: 连气息也不剩了
  rationale: נְשָׁמָה 在体力尽失的上下文中首先指呼吸或生命气息；“不剩了”准确表达 Niphal 形式所指的存留状态。
theological_decisions:
- issue: 人类或受造尊贵对象称谓 אֲדֹנִי 的译法
  choice: 我主
  alternative: 我的主人
  rationale: 此处不是神名 יהוה，而是对眼前尊贵对象的敬称。“我主”保留庄重和谦恭语气，又不将其误作神名；“主人”虽可表达从属关系，却容易使现代读者过度联想到所有权或奴役制度。
- issue: נְשָׁמָה 所指为何
  choice: 气息
  alternative: 灵；生命之气
  rationale: 本节描述但以理体力耗尽、无法呼吸的身体状态，因此“气息”最合语境；不把该词处理成关于人的“灵”的教义性陈述。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“我主”保留宫廷式敬称，“仆人”体现自谦。正文尽量保留原文两次近指词造成的临场感，并在脚注说明第二处也可能按方式理解为“这样”。
