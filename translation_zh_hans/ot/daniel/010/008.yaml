source:
  edition: WLC
  text: וַ/אֲנִי֙ נִשְׁאַ֣רְתִּי לְ/בַדִּ֔/י וָֽ/אֶרְאֶ֗ה אֶת הַ/מַּרְאָ֤ה הַ/גְּדֹלָה֙ הַ/זֹּ֔את וְ/לֹ֥א נִשְׁאַר בִּ֖/י כֹּ֑ח וְ/הוֹדִ֗/י נֶהְפַּ֤ךְ עָלַ/י֙ לְ/מַשְׁחִ֔ית וְ/לֹ֥א עָצַ֖רְתִּי כֹּֽחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/010/008.yaml
  text: So I alone was left and saw this great vision[a], and no strength remained in me; my splendor was turned to ruin upon me[b], and I retained no strength.
translation:
  language: zh_hans
  text: 于是，只剩下我一个人；我看见了这个大异象[a]，浑身再没有力气。我的容光变得衰败[b]，我一点力气也保不住。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“这个伟大的显现”或“这个壮观的景象”。
    reason: lexical_alternative
  - marker: b
    text: 或译“我的容貌变得衰败”，或“我的精力转为衰竭”。
    reason: lexical_alternative
lexical_decisions:
- source_word: נִשְׁאַרְתִּי לְבַדִּי
  choice: 只剩下我一个人
  rationale: 既表达 נִשְׁאַרְתִּי 的“被留下／剩下”，也保留 לְבַדִּי 所强调的独自状态，并符合现代汉语叙事习惯。
- source_word: הַמַּרְאָה הַגְּדֹלָה הַזֹּאת
  choice: 这个大异象
  rationale: מַרְאָה 可指所见的景象、显现或异象；本章启示性语境支持“异象”，同时用脚注保留其他可能。
- source_word: כֹּחַ
  choice: 力气
  rationale: 两处均指但以理身体能力的丧失；“力气”比“力量”更自然、具体。
- source_word: וְלֹא נִשְׁאַר בִּי כֹּחַ
  choice: 浑身再没有力气
  rationale: 自然表达“我里面没有留下力量”的彻底虚弱；“浑身”体现 בִּי 的身体内在状态，但不作机械直译。
- source_word: הוֹדִי
  choice: 我的荣光
  rationale: הוֹד 的词义核心是荣美、威荣或光彩；“荣光”保留这一核心，不直接将其收窄为容貌或气色。
- source_word: נֶהְפַּךְ עָלַי לְמַשְׁחִית
  choice: 在我身上变为衰败
  rationale: “在我身上”对应 עָלַי，“变为衰败”保留 נֶהְפַּךְ 与 מַשְׁחִית 所表达的毁坏性转变，同时避免误解为抽象的彻底毁灭。
- source_word: וְלֹא עָצַרְתִּי כֹּחַ
  choice: 我一点力气也保不住
  rationale: עצר 在此有持守、保有之意；“保不住”准确体现主语无法留存任何力气，并与前句形成递进。
theological_decisions:
- issue: 启示语境中 הַמַּרְאָה 的性质
  choice: 异象
  alternative: 显现；景象
  rationale: 上下文具有启示和异象性质，故正文采用“异象”；但原词本身也可表示可见的显现或景象，故在脚注中保留歧义。
- issue: הוֹדִי 所指的但以理状态
  choice: 我的荣光
  alternative: 我的容貌；我的气色／精力
  rationale: 正文保留该词“荣美、威荣、光彩”的词义核心，不把它无声地限定为外貌或体力；脚注说明语境中可能指外在容貌或健旺状态。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“只剩下我一个人”贴合叙事语境；两次 כֹּחַ 都译作“力气”，保持词汇呼应。正文对 הוֹדִי 采用较形式对应的“荣光”，并以脚注交代语境性解释，保留原文的张力。
