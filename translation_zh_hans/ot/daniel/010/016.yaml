id: DAN.10.16
reference: Daniel 10:16
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/הִנֵּ֗ה כִּ/דְמוּת֙ בְּנֵ֣י אָדָ֔ם נֹגֵ֖עַ עַל שְׂפָתָ֑/י וָ/אֶפְתַּח פִּ֗/י וָ/אֲדַבְּרָ/ה֙ וָ/אֹֽמְרָ/ה֙ אֶל הָ/עֹמֵ֣ד לְ/נֶגְדִּ֔/י אֲדֹנִ֗/י בַּ/מַּרְאָה֙ נֶהֶפְכ֤וּ צִירַ/י֙ עָלַ֔/י וְ/לֹ֥א עָצַ֖רְתִּי כֹּֽחַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/010/016.yaml
  text: And behold[a], something like the likeness of a son of man touched my lips. Then I opened my mouth and spoke, and I said to the one standing before me, “My lord, because of the vision my pains have come upon me[c][b], and I have retained no strength.”
translation:
  language: zh_hans
  text: 看哪，有一个仿佛人类样式的触摸了我的嘴唇[a]。于是我开口说话，对站在我面前的那一位说：“我主啊，因这异象，剧痛临到我[b]，我已留不住一点力气[c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文的说法层层相叠，直译近于“仿佛人类的样式”。“有一个仿佛人类样式的”省略了所指的形体；也可译作“有一个仿佛人形的”。这里的“人类”是泛指，不是作为称号的“人子”。
    reason: lexical_alternative
  - marker: b
    text: “剧痛”也可译作“苦楚”或“阵痛”。原文描写强烈的痛苦袭来。“因这异象”也可理解为“在异象中”。
    reason: lexical_alternative
  - marker: c
    text: 或译：“我里面毫无力气存留。”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּדְמוּת בְּנֵי אָדָם
  choice: 有一位形状仿佛人的
  rationale: כְּ、דְּמוּת与בְּנֵי אָדָם构成层叠而间接的比较表达，意为呈现人类的样式。译文保留异象描述的不确定性，同时用现代汉语自然表达；此处不是“人子”称号。
- source_word: נֹגֵעַ עַל שְׂפָתָי
  choice: 摸了我的嘴唇
  rationale: נגע与עַל连用表示触碰；分词在连续叙事中自然译作完成动作。
- source_word: וָאֶפְתַּח פִּי וָאֲדַבְּרָה וָאֹמְרָה
  choice: 于是我张开口说话……说
  rationale: 保留“张开口”“说话”“说”三个动作所形成的叙事铺陈，同时以“于是”体现先后进展。
- source_word: הָעֹמֵד לְנֶגְדִּי
  choice: 站在我面前的那一位
  rationale: לְנֶגֶד表示在面前或对面；“在我面前”符合场景且汉语自然。
- source_word: אֲדֹנִי
  choice: 我主啊
  rationale: 这是对异象中人物的尊称，并非神名；“我主”保留敬意而不把对方直接等同于耶和华。
- source_word: בַּמַּרְאָה
  choice: 因这异象
  rationale: 介词בְּ在语境中可表原因；但以脚注保留“在异象中”等可能理解。
- source_word: נֶהֶפְכוּ צִירַי עָלַי
  choice: 剧痛临到我
  rationale: צִירַי可指疼痛、阵痛或强烈苦楚；与נֶהֶפְכוּ עָלַי连用，描写痛苦袭来。译作“剧痛临到我”清楚而不过度限定具体生理症状。
- source_word: וְלֹא עָצַרְתִּי כֹּחַ
  choice: 我再也留不住力气了
  rationale: עצר在此有留住、保持之意；译文贴近原文主动式表达，也自然传达力量尽失。
theological_decisions:
- issue: 异象描述中בְּנֵי אָדָם的理解
  choice: 作为泛指人类的非称号用语，译为“形状仿佛人的”
  alternative: 译作带弥赛亚称号意味的“人子”；或简化为“一个人形”
  rationale: 原文是复数结构，并嵌在比较表达中，不宜解释为专名式的“人子”。译文既保留人的样式，也不导入经文本身未明说的基督论含义。
- issue: אֲדֹנִי的身份含义
  choice: 我主啊
  alternative: 主啊；先生；我的主人
  rationale: 此词是对异象中人物的敬称，不是神名יהוה。中文“我主”能保持尊敬，也不明断该人物就是耶和华。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“看哪”保留异象叙事中的提示语气；“有一位形状仿佛人的”有意保留原文比较表达的朦胧感。“我主啊”作为恭敬称呼处理，不以专名或大写方式预断人物身份。
