base_translation:
  language: en
  yaml_path: translation/ot/daniel/010/007.yaml
  text: And I[a], Daniel, alone saw the vision, and the men who were with me did not see the vision; but a great trembling fell upon them[b], and they fled to hide themselves.
translation:
  language: zh_hans
  text: 只有我但以理一人看见了这异象；跟我在一起的那些人却没有看见这异象。然而，极大的战栗临到他们[a]，他们便逃去躲藏[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“极大的恐惧临到他们。”希伯来语 חֲרָדָה 可表示战栗、惊惧或恐怖。
    reason: lexical_alternative
  - marker: b
    text: 或译：“他们逃跑，藏了起来”，或“他们逃入藏身之处”。希伯来语不定式 בְּהֵחָבֵא 可表达他们逃跑的目的或方式。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאִיתִי אֲנִי דָנִיֵּאל לְבַדִּי
  choice: 只有我但以理一人看见了
  rationale: 显明的第一人称代词、名字和“独自”共同构成强调；译作“只有我但以理一人”自然地保留“唯独但以理看见”的排他意味。完成式在叙事中表示实际发生的视觉感知，故译“看见了”。
- source_word: הַמַּרְאָה
  choice: 这异象
  rationale: מַרְאָה 可指所见之景、显现或异象；本章语境是启示性的观看，译作“异象”最为贴切。前有定冠词，现代汉语用“这”自然指回当前所述的异象。
- source_word: וְהָאֲנָשִׁים אֲשֶׁר הָיוּ עִמִּי
  choice: 跟我在一起的那些人
  rationale: אֲנָשִׁים 在此指与但以理同行的人；“那些人”既符合现代汉语习惯，也不添加原文没有说明的身份。
- source_word: לֹא רָאוּ אֶת הַמַּרְאָה
  choice: 却没有看见这异象
  rationale: 重复“看见”和“异象”，保留原文中但以理与同行者之间的鲜明对照。
- source_word: אֲבָל
  choice: 然而
  rationale: 表达转折：他们虽未看见异象，却仍受到强烈影响。
- source_word: חֲרָדָה גְדֹלָה
  choice: 极大的战栗
  rationale: חֲרָדָה 兼有战抖、惊惧和恐怖之意；“战栗”保留身体反应与内心恐惧的双重意味，同时以脚注说明另一可行译法。
- source_word: נָפְלָה עֲלֵיהֶם
  choice: 临到他们
  rationale: 原文直译为“落在他们身上”，表示一种压倒性的经历；“临到他们”在中文中自然且保留外来力量突然笼罩他们的意象。
- source_word: וַיִּבְרְחוּ
  choice: 他们便逃去
  rationale: 连续叙事形式推动情节；“便”显出他们因战栗而立即逃离。
- source_word: בְּהֵחָבֵא
  choice: 躲藏
  rationale: 该不定式可表达逃跑的目的或伴随方式；“逃去躲藏”简洁地表达为躲避而逃，同时不把目的与结果区分得过于绝对。
