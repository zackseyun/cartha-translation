base_translation:
  language: en
  yaml_path: translation/ot/daniel/010/015.yaml
  text: And when he spoke these words with me[b][a], I set my face toward the ground and became speechless.
translation:
  language: zh_hans
  text: 他跟我说这些话时，我便面向地面，不能说话。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“便沉默不语”或“便成了哑巴”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְדַבְּרוֹ
  choice: 他……说……时
  rationale: 介词 בְּ 与带后缀的不定式连用，在此表达时间关系；译作“……时”自然，也保留动作正在发生或随之发生的时间弹性。
- source_word: עִמִּי
  choice: 对我
  rationale: עִם 基本义为“与”，但现代汉语在单向讲话的语境中通常说“对我说”；此译法自然，且不改变这里的指向关系。
- source_word: כַּדְּבָרִים הָאֵלֶּה
  choice: 这些话
  rationale: דְּבָרִים 可指“话”或“事情”；紧接讲话语境，译作“这些话”最直接。כַּ 在此与宾语搭配，汉语无需另译为“像”。
- source_word: נָתַתִּי פָנַי אַרְצָה
  choice: 我就脸朝地
  rationale: 原文直译近于“把脸置向地面”。“脸朝地”保留身体姿态和 אַרְצָה 的方向含义，同时比生硬的直译更符合现代汉语。
- source_word: וְנֶאֱלָמְתִּי
  choice: 哑口无言
  rationale: אלם 的 Niphal 形式表示不能出声或沉默下来；“哑口无言”自然表达当时说不出话的状态，不暗示永久性失语，也不强加外力使其闭口的含义。
