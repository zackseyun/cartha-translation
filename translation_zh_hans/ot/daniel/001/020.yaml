base_translation:
  language: en
  yaml_path: translation/ot/daniel/001/020.yaml
  text: And in every matter of wisdom and understanding that the king asked of them[b][a], he found them ten times better than all the magicians and enchanters who were in all his kingdom.
translation:
  language: zh_hans
  text: 王在一切关乎智慧和悟性的事上向他们求问，发现他们比全国所有的术士和咒术师[b]强十倍[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “强十倍”直译为“十手之上”。这是希伯来语表示远远胜过的说法。
    reason: lexical_alternative
  - marker: b
    text: “咒术师”也可译作“占星师”。这个词指巴比伦智慧阶层中的一类人，其确切职能并不确定。
    reason: alternative_reading
lexical_decisions:
- source_word: וְכֹל דְּבַר
  choice: 无论……什么……问题
  rationale: דָּבָר在此指受考问的事项或问题；结合כֹל，用“无论……什么”自然表达涵盖每一事项的意思。
- source_word: חָכְמַת בִּינָה
  choice: 有关智慧和悟性
  rationale: 保留“智慧”与“悟性”两个相关而有区别的名词，并以现代汉语自然连接。
- source_word: אֲשֶׁר בִּקֵּשׁ מֵהֶם הַמֶּלֶךְ
  choice: 王……问他们
  rationale: בקש与מן连用在此语境中表示向他们询问、考察；“问他们”简洁贴合上下文。
- source_word: וַיִּמְצָאֵם
  choice: 都发现他们
  rationale: 表达王经过询问后所得出的评估，同时保留“他们”为直接受评对象。
- source_word: עֶשֶׂר יָדוֹת עַל
  choice: 比……强十倍
  rationale: 希伯来语字面为“十手之上”，是显著优越的比较表达；“强十倍”既自然又保留数字修辞。
- source_word: הַחַרְטֻמִּים
  choice: 术士
  rationale: 该词指宫廷中从事神秘、宗教或法术活动的专门人士；“术士”在中文中简洁、可懂，又不过度限定其具体职能。
- source_word: הָאַשָּׁפִים
  choice: 咒术师
  rationale: 该词指巴比伦智慧阶层中可能与咒语或法术有关的一类人，但精确职能不确定；“咒术师”保留与前一类的区别，并在脚注说明其他可能。
- source_word: אֲשֶׁר בְּכָל מַלְכוּתוֹ
  choice: 全国所有的
  rationale: 自然表达这些宫廷专家遍及王整个国度的范围。
theological_decisions:
- issue: 如何翻译巴比伦宫廷专业人士的称谓而不强加过度具体的后世分类
  choice: 术士和咒术师
  alternative: 术士和占星师；秘术祭司和行法术的人
  rationale: 经文将但以理等人的智慧与巴比伦公认的宫廷智慧及秘术专家作比较。原词的精确专业范围并不完全确定，因此正文采用易懂但不过度具体的称呼，并以脚注保留词义的不确定性。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“悟性”与“智慧”并列，保留原文两个概念；“术士和咒术师”体现宫廷秘术背景，同时避免把第二个称谓解释得过于确定。脚注标记均置于相关比较与称谓之后。
