  text: נַס נָ֥א אֶת עֲבָדֶ֖י/ךָ יָמִ֣ים עֲשָׂרָ֑ה וְ/יִתְּנוּ לָ֜/נוּ מִן הַ/זֵּרֹעִ֛ים וְ/נֹאכְלָ֖ה וּ/מַ֥יִם וְ/נִשְׁתֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/001/012.yaml
  text: Please test your servants for ten days[a], and let us be given vegetables to eat and water to drink.
translation:
  language: zh_hans
  text: “请试验你的仆人们十天，给我们植物性食物[a]吃，给我们水喝。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“种子类食物”；也可译作“蔬菜”。希伯来语这个词泛指植物性食物，其具体范围未必限于现代意义的蔬菜。
    reason: 保留原词与“种子”相关的字面含义，并说明其具体所指的词义范围。
lexical_decisions:
- source_word: נַס נָא
  choice: 请试验
  rationale: נַס是נסה的祈使式，表示进行一段考察性的试验；נָא使语气缓和，现代汉语以“请”自然表达礼貌请求。
- source_word: עֲבָדֶיךָ
  choice: 你仆人
  rationale: 这是但以理对上级所用的谦恭自称；“仆人”保留宫廷语境中的尊卑语气，不强化为“奴隶”。
- source_word: יָמִים עֲשָׂרָה
  choice: 十天
  rationale: 该短语作时段宾语，说明试验持续的时间；汉语直接说“试验……十天”自然清楚。
- source_word: וְיִתְּנוּ לָנוּ
  choice: 并给我们
  rationale: 第三人称复数祈愿式表达请求，施事者并非重点；汉语可自然省略不特指的主语，以“给我们”承接请求。
- source_word: מִן הַזֵּרֹעִים
  choice: 一些种子所出的食物
  rationale: זֵרֹעִים在此指由种子生长或种子类的植物性食物，范围可能宽于现代汉语的“蔬菜”；正文保留其种子语义，并以脚注说明可采用的顺畅译法。
- source_word: וְנֹאכְלָה
  choice: 吃
  rationale: 第一人称复数意愿式在请求结构中表达所给食物的用途，汉语以“食物吃”呈现其简洁关系。
- source_word: וּמַיִם וְנִשְׁתֶּה
  choice: 给我们水喝
  rationale: 与前面的食物和进食构成平行；补出承前省略的“给我们”，使现代汉语清楚顺畅。
theological_decisions: []
