  text: וַ/יִּתֵּ֤ן הָֽ/אֱלֹהִים֙ אֶת דָּ֣נִיֵּ֔אל לְ/חֶ֖סֶד וּֽ/לְ/רַחֲמִ֑ים לִ/פְנֵ֖י שַׂ֥ר הַ/סָּרִיסִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/001/009.yaml
  text: And God gave Daniel favor and compassion before the chief of the eunuchs[a].
translation:
  language: zh_hans
  text: 上帝使但以理在太监长面前获得恩惠和怜悯。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: 使……蒙……、受……
  rationale: 希伯来语直译为“给”，但在“把某人交在恩惠和怜悯中”这一结构里，现代汉语用“使……蒙恩惠、受怜悯”更自然，同时保留上帝是主动施行者的含义。
- source_word: הָאֱלֹהִים
  choice: 上帝
  rationale: 此处指独一真神，原文没有使用圣约名 יהוה，因此译作“上帝”，不译作“耶和华”。
- source_word: אֶת דָּנִיֵּאל
  choice: 但以理
  rationale: אֶת 是直接宾语标记，在汉语中不另行翻译；人名采用通行译名“但以理”。
- source_word: לְחֶסֶד
  choice: 蒙恩惠
  rationale: חֶסֶד 在此处描述但以理得到官长的善意和优待，并非特别强调圣约忠诚；“蒙恩惠”符合宫廷人际语境，也与动词结构自然衔接。
- source_word: וּלְרַחֲמִים
  choice: 受怜悯
  rationale: רַחֲמִים 表达怜恤、同情之情；“受怜悯”既自然，又保留它与“恩惠”并列而不完全同义的语义。
- source_word: לִפְנֵי
  choice: 在……面前
  rationale: 按其基本空间及关系性用法译作“在……面前”，表示但以理在这位官长看来得到恩惠和怜悯。
- source_word: שַׂר
  choice: 长
  rationale: שַׂר 指有权位、负管理职责的人；与“太监”组合为“太监长”，简洁表达其主管身份。
- source_word: הַסָּרִיסִים
  choice: 太监
  rationale: סָרִיסִים 的直接词义可指太监，在宫廷语境中也可能泛指内廷或宫廷官员。正文采用较直接的“太监”，并用脚注保留较宽泛的制度性解释。
theological_decisions:
- issue: 巴比伦宫廷语境中 סָרִיסִים 的含义
  choice: 太监
  alternative: 宫廷官员；内廷官员
  rationale: 该词既可指实际受阉割的太监，也可较宽泛地指王室官员。原文未明确要求采用委婉或制度性解释，因此正文保留直接词义，同时以脚注呈现真实存在的词义歧义，不对相关历史或神学问题作武断裁定。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“使……蒙恩惠、受怜悯”自然表达原文中上帝主动使但以理得到官长善意的含义；“太监长”沿用清楚简洁的宫廷称谓，并以脚注保留词义范围。
