  rationale: 修订将神所赐的“知识和悟性”直接作为主句宾语，并以“有关各样书卷和智慧的”表达其适用领域，避免加入原文未明说的使役结果。后半句保留“又”所表示的附加关系，不把但以理与其余三人制造为强烈对立；“明白”也不预先限定为领受或解释异象和梦。
