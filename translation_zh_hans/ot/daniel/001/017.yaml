reference: Daniel 1:17
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/הַ/יְלָדִ֤ים הָ/אֵ֨לֶּה֙ אַרְבַּעְתָּ֔/ם נָתַ֨ן לָ/הֶ֧ם הָֽ/אֱלֹהִ֛ים מַדָּ֥ע וְ/הַשְׂכֵּ֖ל בְּ/כָל סֵ֣פֶר וְ/חָכְמָ֑ה וְ/דָנִיֵּ֣אל הֵבִ֔ין בְּ/כָל חָז֖וֹן וַ/חֲלֹמֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/001/017.yaml
  text: As for these four youths[a], God gave them knowledge and insight in every kind of literature and wisdom[b]; and Daniel had understanding in every vision and dream.
translation:
  language: zh_hans
  text: 至于这四个少年，神赐给他们有关各样书卷[a]和智慧的知识和悟性；但以理又明白各种异象和梦[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“各种书卷”；希伯来语表达可能更广泛地指文字学问或典籍。
    reason: lexical_alternative
  - marker: b
    text: 或译“但以理在各种异象和梦上都有悟性”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיְלָדִים
  choice: 少年
  rationale: 该词本义为孩子或年轻人；在宫廷受训的语境中，“少年”既保留其年少身份，又不显得幼稚或过于成熟。
- source_word: הָאֵלֶּה אַרְבַּעְתָּם
  choice: 这四个
  rationale: 自然表达指示词、数词及其代词后缀的整体意思，现代汉语无需另行译出后缀。
- source_word: נָתַן לָהֶם הָאֱלֹהִים
  choice: 神赐给他们
  rationale: 明确保留神作为赐予者；“赐给”符合庄重语体，也自然表达 נָתַן 的意思。
- source_word: מַדָּע
  choice: 知识
  rationale: 该词指知识或学问；“知识”保留认知层面的含义，并与下文“悟性”相配。
- source_word: הַשְׂכֵּל
  choice: 悟性
  rationale: 源自动词 שכל，表达理解、洞察或明智处事的能力；“悟性”在现代汉语中简洁自然，并避免与后文重复使用“明白”。
- source_word: בְּכָל סֵפֶר
  choice: 各种典籍
  rationale: סֵפֶר 字面是“书卷”，此处可能广指文字学问或文献；“各种典籍”适合宫廷教育语境，同时用脚注保留字面可能。
- source_word: וְחָכְמָה
  choice: 和智慧
  rationale: חָכְמָה 通常指智慧，也可含技能或明智判断；采用常见译法，不把范围缩窄为某种专门技能。
- source_word: הֵבִין
  choice: 能明白
  rationale: בין 的使役词干在此表达理解或辨明的能力；“能明白”自然呈现但以理所具有的特殊领悟力。
- source_word: בְּכָל חָזוֹן וַחֲלֹמוֹת
  choice: 各种异象和梦
  rationale: 表达但以理对于启示性异象和梦的理解能力；“各种”自然涵盖希伯来文的 כָל，也避免机械复制单复数差异。
theological_decisions:
- issue: 四个少年的能力出自谁
  choice: 明确说知识和悟性是神所赐
  alternative: 将这些能力仅理解为训练或天资发展的结果
  rationale: 原文以神为 נָתַן（赐给）的主语，清楚强调神的主动赐予，因此译文不将其弱化为无主体的成长过程。
- issue: 但以理对异象和梦的特殊能力
  choice: 译作能明白各种异象和梦，不进一步限定为领受或解释
  alternative: 译成但以理领受所有异象和梦，或明确译成他能解释一切异象和梦
  rationale: 原文只说明但以理在异象和梦方面具有理解力，并未明确限定这种能力究竟是领受、解释还是辨明；译文保留这一开放性。
- issue: 四人共有的恩赐与但以理特有的恩赐
  choice: 用“又”表达在共同恩赐之外，但以理另有相关能力
  alternative: 用强烈转折词把但以理与其余三人对立起来
  rationale: 原文使用普通连接词 וְ，不要求强烈对比；“又”既呈现附加信息，也避免制造原文没有的对立。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“少年”符合人物年龄和受训语境；“典籍”比“文学”更贴近古代书面学问，同时不局限于单本书卷。句式保留神的施予、四人共有的能力，以及但以理另有的特殊理解力。
