revisions:
- from: 王给他们指定每日的份额，就是王所用的膳食[a]和他所饮的酒，又吩咐抚育他们三年；期满以后[b]，他们要侍立在王面前[c]。
  to: 王为他们定下每日的份额，取自王的膳食[a]和他所饮的酒；又要培育他们三年。三年期满时[b]，他们要侍立在王面前[c]。
  rationale: 修订使时间表达与原文“在三年终结时”一致，避免把培育安排误表为另一项明说的命令，并提升现代汉语搭配的自然度。脚注标记均紧随其所说明的词语，内容保留原有词汇和文化说明。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T07:54:03Z'
review_pass:
  verdict: revise
  source_fidelity: 译文总体准确传达王每日配给王室食物和酒、为期三年的培育，以及期满后在王面前侍立。惟“期满以后”将“在三年结束时”的时间点稍微推后；“又吩咐抚育他们”也加入了原文未明说的“吩咐”动作，且“抚育”在现代汉语中较易联想到对幼儿的养育。
  naturalness: 原文语句基本通顺、庄重。“王给他们指定”略显搭配生硬，改为“王为他们定下”更自然。将食物和酒说明为“取自王的膳食和他所饮的酒”，可清楚呈现两者均属每日配给的来源。
  terminology: “膳食”适合正式语体；“侍立在王面前”恰当地保留宫廷习语和服务语境。以“培育”译וּלְגַדְּלָם可涵盖供养、培养而不武断限定为正式教育。
  issues:
  - severity: medium
    issue: “期满以后”弱化了原文的时间点。
    rationale: וּמִקְצָתָם意为“在它们（即三年）的终结时/期满时”，并不特别表示在期满之后。
  - severity: medium
    issue: “又吩咐抚育他们三年”加入了“吩咐”，且“抚育”语义略窄。
    rationale: 原文以不定式表达安排培育他们三年，并未明说另一道命令；“抚育”在现代汉语常用于养育儿童，而此处涉及王室供养和培养。
  - severity: low
    issue: “王给他们指定”搭配稍不自然。
    rationale: “为他们定下每日的份额”更符合现代标准汉语，也保留行政配给的意思。
