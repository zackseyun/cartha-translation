base_translation:
  language: en
  yaml_path: translation/ot/daniel/001/005.yaml
  text: And the king assigned to them a daily portion from the king’s food and from the wine he drank[a], and to bring them up for three years[c][b]; and at the end of them they were to stand before the king.
translation:
  language: zh_hans
  text: 王为他们定下每日的份额，取自王的膳食[a]和他所饮的酒；又要培育他们三年。三年期满时[b]，他们要侍立在王面前[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “王的膳食”也可译作“王的珍馐美味”或“王的丰盛食物”。原文指王室餐桌所供应的食物，可能含有奢华珍贵的意味。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“在它们的尽头”，指三年期满。
    reason: lexical_alternative
  - marker: c
    text: “侍立在王面前”是宫廷用语，表示在王面前随侍或进入王室任职。
    reason: cultural_note
lexical_decisions:
- source_word: וַיְמַן
  choice: 指定
  rationale: 该动词表示为某人安排或配给某物；“指定”符合王室行政安排的语境。
- source_word: דְּבַר יוֹם בְּיוֹמוֹ
  choice: 每日的份额
  rationale: 此习语指每天固定配给的分量；译文兼顾具体的配给概念和现代汉语的自然表达。
- source_word: מִפַּת בַּג הַמֶּלֶךְ
  choice: 王所用的膳食
  rationale: 该词组指王室餐桌供应的食物，可能含珍馐美味之意；正文采用较克制而庄重的表达，并以脚注保留可能的奢华色彩。
- source_word: וּמִיֵּין מִשְׁתָּיו
  choice: 他所饮的酒
  rationale: 贴近原文，明确这是王自己饮用或宴饮所用的酒。
- source_word: וּלְגַדְּלָם
  choice: 抚育他们
  rationale: 使役形式表示使他们成长、养育至成熟；“抚育”既包含供养培育，也不把含义限缩为单纯喂养或正式教育。
- source_word: שָׁנִים שָׁלוֹשׁ
  choice: 三年
  rationale: 直接表达规定的持续时间。
- source_word: וּמִקְצָתָם
  choice: 期满以后
  rationale: 原文直译为“在它们的尽头”，所指是三年结束；“期满以后”在中文中自然且指代明确。
- source_word: יַעַמְדוּ לִפְנֵי הַמֶּלֶךְ
  choice: 侍立在王面前
  rationale: 保留“站在……面前”的宫廷表达，同时以“侍立”传达入朝供职、随侍君王的语境含义。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“膳食”适合王室语境但不过分古雅；“抚育”保留成长、培养与供养的综合含义；“侍立在王面前”既保存原文的具体形象，也提示宫廷服务的含义。脚注标记按其所释词组就近放置。
