base_translation:
  language: en
  yaml_path: translation/ot/daniel/001/007.yaml
  text: 'And the chief of the eunuchs gave them names: he gave Daniel the name Belteshazzar[a], Hananiah the name Shadrach, Mishael the name Meshach, and Azariah the name Abed-nego.'
translation:
  language: zh_hans
  text: 太监长[a]给他们取了名字：给但以理取名叫伯提沙撒，给哈拿尼雅取名叫沙得拉，给米沙利取名叫米煞，给亚撒利雅取名叫亚伯尼歌。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“宫廷官员的主管”；这里的希伯来语词既可指太监，也可泛指王宫官员。
    reason: 保留סָרִיס在宫廷语境中可能指太监或一般王宫官员的词义歧义。
lexical_decisions:
- source_word: וַיָּשֶׂם לָהֶם שֵׁמוֹת
  choice: 给他们取了名字
  rationale: 希伯来语直译为“把名字放给他们”，这里是取名、命名的惯用表达；中文用“取了名字”自然地传达这一动作。
- source_word: שַׂר הַסָּרִיסִים
  choice: 太监长
  rationale: סָרִיס的基本词义可指太监，也可延伸指宫廷官员；שַׂר表示主管者。“太监长”保留较直接的词义，脚注说明语义上的另一种可能。
- source_word: וַיָּשֶׂם
  choice: 给……取名叫
  rationale: 原文重复使用“放置、设立”一词，逐一列出所取的新名；中文以重复的“给……取名叫”清楚保留分配式结构。
- source_word: לְדָנִיֵּאל ... בֵּלְטְשַׁאצַּר
  choice: 给但以理取名叫伯提沙撒
  rationale: 将介词结构明确表达为取名关系，避免把两个名字误读为并列人物。
- source_word: בֵּלְטְשַׁאצַּר / שַׁדְרַךְ / מֵישַׁךְ / עֲבֵד נְגוֹ
  choice: 伯提沙撒／沙得拉／米煞／亚伯尼歌
  rationale: 这些人名采用现代中文圣经语境中通行且易辨认的音译形式，不对其可能的词源含义作推断性翻译。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。四次使用“给……取名叫”形成清晰平行结构，并保留原文逐一命名的节奏；不解释这些新名字的词源或宗教含义，以免加入原文未明说的内容。
