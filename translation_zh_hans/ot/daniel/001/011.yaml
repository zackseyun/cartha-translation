base_translation:
  language: en
  yaml_path: translation/ot/daniel/001/011.yaml
  text: Then Daniel said to the steward whom the chief of the eunuchs had appointed over Daniel[a], Hananiah, Mishael, and Azariah,
translation:
  language: zh_hans
  text: 于是，但以理对太监长[a]所委派、照管但以理、哈拿尼雅、米沙利和亚撒利雅的管家说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “太监长”也可译为“首席官员”；这里译作“太监”的希伯来词，在某些语境中也可泛指王室官员。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 于是……说
  rationale: 叙事性连续式推动事件向前；“于是”自然表达先后承接。
- source_word: הַמֶּלְצַר
  choice: 膳食主管
  rationale: 该词可能是外来官衔，指直接照管这些少年之人；结合下文试验饮食的职责，译作“膳食主管”比音译更清楚，同时避免把其具体身份说得过死。
- source_word: אֲשֶׁר מִנָּה
  choice: 所委派
  rationale: 关系从句说明此主管由太监长任命；“委派”简洁表达任命并交付职责。
- source_word: שַׂר הַסָּרִיסִים
  choice: 太监长
  rationale: 直译该宫廷职衔；סָרִיס也可能泛指宫廷官员，因此在脚注保留另一种理解。
- source_word: עַל
  choice: 来管理
  rationale: 在任命语境中表示受命负责、监管某人；现代汉语用“管理”比直译“在……之上”自然。
- source_word: דָּנִיֵּאל חֲנַנְיָה מִישָׁאֵל וַעֲזַרְיָה
  choice: 但以理、哈拿尼雅、米沙利和亚撒利雅
  rationale: 依原文保留四人的希伯来名字，并采用现代中文圣经人名的通行译法。
theological_decisions:
- issue: סָרִיסִים所指身份
  choice: 正文译作“太监”
  alternative: 宫廷官员
  rationale: “太监”是该词的直接常见义，但在宫廷语境中也可泛指官员；正文保持形式对应，脚注保留语义范围，不据此断定人物的身体状况。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“膳食主管”依据上下文明确其职责；句末冒号表明话语内容将在下一节出现。
