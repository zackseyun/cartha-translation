  yaml_path: translation/ot/daniel/001/016.yaml
  text: So the steward kept taking away their choice food and the wine they were to drink[b][a], and kept giving them vegetables.
translation:
  language: zh_hans
  text: 于是，管膳的人不断撤去分给他们的王室佳肴和他们该喝的酒，改不断给他们蔬菜。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “蔬菜”原文指由种子所产的食物，可能包括蔬菜和豆类。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמֶּלְצַר
  choice: 膳食官
  rationale: 本词指负责管理这些青年饮食的官员；“膳食官”自然简明，也比“仆人”更能体现其职务。
- source_word: נֹשֵׂא
  choice: 不断撤去
  rationale: 分词与 וַיְהִי 连用，表示持续或惯常的动作；“不断撤去”传达反复执行之意。
- source_word: פַּתְבָּגָם
  choice: 他们的御膳
  rationale: 该借词指特别配给的王室食物；“御膳”简洁地保留其出自王室、专门供应的含义。
- source_word: יֵין מִשְׁתֵּיהֶם
  choice: 他们当喝的酒
  rationale: 这一结构指分配给他们饮用的酒；此译法符合现代汉语，并保留指定饮用的语气。
- source_word: וְנֹתֵן
  choice: 给他们吃
  rationale: 与前面的分词平行，表示惯常给予；前文“不断”可自然统摄两个连续动作，避免汉语重复累赘。
- source_word: זֵרְעֹנִים
  choice: 素食
  rationale: 该词泛指由种子生长所得的食物，包括蔬菜和豆类；“素食”在本语境中比单译“蔬菜”覆盖面更广，但不限定具体种类。
