base_translation:
  language: en
  yaml_path: translation/ot/daniel/001/010.yaml
  text: But the chief of the eunuchs said to Daniel[a], “I fear my lord the king, who assigned your food and your drink[c][b]. Why should he see your faces looking worse than the youths who are of your own age? Then you would endanger my head with the king.”
translation:
  language: zh_hans
  text: 但太监长[a]对但以理说：“我惧怕我主我王；他已经指定了你们的食物和饮品。他为什么要看见你们的面色比和你们同龄的年轻人憔悴呢？这样，你们就会使我在王面前性命难保[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “太监”所译的希伯来词也可泛指王室宫廷官员。
    reason: lexical_alternative
  - marker: b
    text: 原文直译“使我的头对王负罪”，是指使他在王面前被追责，性命受到危险。
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׂר הַסָּרִיסִים
  choice: 太监长
  rationale: 直译这一宫廷职衔；סָרִיס既可指太监，也可泛指宫廷官员，但本处保留较具体且传统的称谓。
- source_word: יָרֵא אֲנִי אֶת אֲדֹנִי הַמֶּלֶךְ
  choice: 我惧怕我的主——王
  rationale: 保留原文“惧怕”及宫廷敬称；破折号使现代汉语中的同位关系清楚。
- source_word: מִנָּה אֶת מַאֲכַלְכֶם וְאֶת מִשְׁתֵּיכֶם
  choice: 你们的食物和饮品都是他指定的
  rationale: מִנָּה表示指定或分派；מִשְׁתֶּה在本节不必限定为酒，故译作较宽泛的“饮品”。
- source_word: פְּנֵיכֶם זֹעֲפִים
  choice: 你们的面色……憔悴
  rationale: 该短语字面可指面容愁苦、阴沉或状态不佳；结合与同龄人外貌的比较，“面色憔悴”自然表达可见的欠佳状况，同时不过度限定其成因。
- source_word: הַיְלָדִים אֲשֶׁר כְּגִילְכֶם
  choice: 同龄的年轻人
  rationale: יְלָדִים在宫廷受训背景中指年轻人；כְּגִילְכֶם表示与你们年龄相仿。
- source_word: וְחִיַּבְתֶּם אֶת רֹאשִׁי לַמֶּלֶךְ
  choice: 你们就会使我的头在王面前担罪
  rationale: 尽量保留“使我的头负罪/承担责任”的生动原文表达；其语境含义是使这名官员面临王的惩处，甚至危及性命。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的宫廷叙事语体。正文保留原文“头”与“担罪”的形象，并以脚注说明其实际含义；不把“饮品”具体化为酒，也不把官员所惧怕的后果缩减为一般性的风险。
