id: DAN.1.2
reference: Daniel 1:2
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יִּתֵּן֩ אֲדֹנָ֨/י בְּ/יָד֜/וֹ אֶת יְהוֹיָקִ֣ים מֶֽלֶךְ יְהוּדָ֗ה וּ/מִ/קְצָת֙ כְּלֵ֣י בֵית הָֽ/אֱלֹהִ֔ים וַ/יְבִיאֵ֥/ם אֶֽרֶץ שִׁנְעָ֖ר בֵּ֣ית אֱלֹהָ֑י/ו וְ/אֶת הַ/כֵּלִ֣ים הֵבִ֔יא בֵּ֖ית אוֹצַ֥ר אֱלֹהָֽי/ו־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/001/002.yaml
  text: And the Lord gave Jehoiakim king of Judah into his hand[a], along with some of the vessels of the house of God. He brought them to the land of Shinar, to the house of his god[c][b], and he brought the vessels into the treasury of his god.
translation:
  language: zh_hans
  text: 主把犹大王约雅敬交在他手中[a]，也把上帝的殿里的一部分器皿交给他。 他把约雅敬和这些器皿带到示拿之地[b]，带进他所敬奉之神的殿[c]；又把那些器皿带进他所敬奉之神的宝库。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“把犹大王约雅敬交给他掌控。”
    reason: lexical_alternative
  - marker: b
    text: “示拿”是巴比伦尼亚的古称。
    reason: cultural_note
  - marker: c
    text: “殿”原文直译为“房屋”。本节以同一个词指“上帝的殿”和他所敬奉之神的庙宇；后文“宝库”也可译作“库房”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי
  choice: 主
  rationale: 原文为 אֲדֹנָי，而非四字神名；译作“主”直接、庄重，也不与项目中对 יהוה 的专门译法混淆。
- source_word: וַיִּתֵּן
  choice: 交在……手中
  rationale: נתן 基本义为“给”，在此表示交付给敌方掌控；结合 בְּיָדוֹ 译为“交在他手中”，既保留原文手的意象，也自然表达权力转移。
- source_word: יְהוֹיָקִים מֶלֶךְ יְהוּדָה
  choice: 犹大王约雅敬
  rationale: 采用现代汉语惯用的头衔加人名语序，准确表达同位结构。
- source_word: וּמִקְצָת כְּלֵי בֵית הָאֱלֹהִים
  choice: 也把上帝殿里的一部分器皿交给他
  rationale: מִקְצָת 表示“一部分”；כְּלֵי 在圣殿语境中译作“器皿”。“上帝殿”保留“上帝的房屋/殿”的表达，并与后文异教神祇的殿形成对应。
- source_word: וַיְבִיאֵם
  choice: 他把他们带到
  rationale: 阳性复数后缀最自然地回指前述约雅敬与器皿这一复合宾语。汉语用“他们”保留这种可能包含人的集合指称，不把意义缩窄为仅指器皿。
- source_word: אֶרֶץ שִׁנְעָר
  choice: 示拿地
  rationale: 保留古地名 שִׁנְעָר，并明确译出 אֶרֶץ“地”。
- source_word: בֵּית אֱלֹהָיו
  choice: 他神的殿
  rationale: בֵּית 字面为“房屋”，此处指神祇的庙宇，现代汉语以“殿”自然简洁；“神”小写所表达的区别在中文无大小写可体现，但“他神”清楚指巴比伦王所敬奉的神祇。
- source_word: וְאֶת הַכֵּלִים הֵבִיא בֵּית אוֹצַר אֱלֹהָיו
  choice: 又把那些器皿带进他神的宝库
  rationale: אוֹצָר 可指宝库或储藏室；“宝库”适合存放圣殿贵重器物的语境。保留原文再次使用“带”的重复。
theological_decisions:
- issue: 耶路撒冷陷落中的神圣主权
  choice: 直陈主把约雅敬交在巴比伦王手中
  alternative: 主只是容许约雅敬落入敌手
  rationale: 原文以主为 נתן 的主动施事者，表达积极的神圣作为；译文不将其弱化为单纯许可。
- issue: וַיְבִיאֵם 的复数宾语范围
  choice: 用“他们”保留约雅敬与器皿都被带走的自然读法
  alternative: 用“这些器皿”，将宾语限定为器皿
  rationale: 后缀为阳性复数，前文复合宾语包括约雅敬和部分器皿；译文保留其集合指称。随后原文另行明确提到器皿，形成区别。
translation_notes:
  register: 采用现代、庄重而通顺的书面普通话。“交在他手中”保留希伯来语的具体意象；“他们”刻意保存复数后缀可能同时指约雅敬和器皿的语义。所有脚注标记均置于相关正文之后。
