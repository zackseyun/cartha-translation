  text: וַ/יֹּ֣אמֶר הַ/מֶּ֔לֶךְ לְ/אַשְׁפְּנַ֖ז רַ֣ב סָרִיסָ֑י/ו לְ/הָבִ֞יא מִ/בְּנֵ֧י יִשְׂרָאֵ֛ל וּ/מִ/זֶּ֥רַע הַ/מְּלוּכָ֖ה וּ/מִן הַֽ/פַּרְתְּמִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/001/003.yaml
  text: Then the king told Ashpenaz[a], the chief of his court officials, to bring some of the sons of Israel, both from the royal offspring and from the nobles,
translation:
  language: zh_hans
  text: 王吩咐宫廷官员的首领亚施毗拿[a]，从以色列人中带来一些出身于王室和贵族的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “宫廷官员的首领”也可译作“宦官长”。希伯来语这个词既可指宦官，也可泛指王室高级官员。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 吩咐
  rationale: 该动词本义为“说”，但后接表示所吩咐事项的不定式“带来”；在君王对臣属发话的语境中，“吩咐”自然体现其功能，又不强化为更明确的“命令”。叙事先后关系在中文中无须另加“然后”。
- source_word: הַמֶּלֶךְ
  choice: 王
  rationale: 直接对应带定冠词的普通名词；中文叙事中称“王”自然简洁。
- source_word: לְאַשְׁפְּנַז
  choice: 亚施毗拿
  rationale: 按现代中文圣经人名惯用译法音译 Ashpenaz。
- source_word: רַב סָרִיסָיו
  choice: 宫廷官员长
  rationale: רַב 表示首领或主管；סָרִיס 可指宦官，也可泛指王室高级官员。正文采用不预断其生理身份且符合宫廷语境的“宫廷官员”，并在脚注保留“宦官长”这一真实可能。
- source_word: לְהָבִיא
  choice: 要他……带来
  rationale: הביא 是 בוא 的使役式不定词，表示“使……来、带来”；置于“吩咐”之后译为“要他……带来”符合现代汉语句法。
- source_word: מִבְּנֵי יִשְׂרָאֵל
  choice: 从以色列人中
  rationale: בני ישראל 字面为“以色列之子”，此处是族群称谓；现代汉语以“以色列人”表达最自然。介词 מן 在此具有从整体中选取一部分的含义。
- source_word: וּמִזֶּרַע הַמְּלוּכָה
  choice: 王族……的一些后代
  rationale: זֶרַע 表示种子、后裔；“后代”保留血统含义，而“王族”自然表达所属王室的出身。
- source_word: וּמִן הַפַּרְתְּמִים
  choice: 贵族
  rationale: פַּרְתְּמִים 是罕见词，指身居高位的贵胄或显贵；“贵族”简洁且不过度限定具体官衔。
theological_decisions:
- issue: סָרִיסָיו 是否专指被阉割的宦官
  choice: 正文译作“宫廷官员”
  alternative: “宦官”
  rationale: 该词在希伯来文中既可指实际的宦官，也可泛指王宫官员；上下文不能确定亚施毗拿的生理身份，因此正文不作排他性判断，脚注保留另一可能。
translation_notes:
  register: 采用现代、庄重而自然的叙事汉语。“王吩咐……要他……”清楚呈现发话者、受命者和任务；将两个 וּמִן 短语合译为并列的“王族和贵族”，并以“一些后代”统摄，避免生硬重复，同时保留人员来自这两个上层群体的含义。
