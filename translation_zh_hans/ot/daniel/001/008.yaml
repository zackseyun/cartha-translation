source:
  edition: WLC
  text: וַ/יָּ֤שֶׂם דָּנִיֵּאל֙ עַל לִבּ֔/וֹ אֲשֶׁ֧ר לֹֽא יִתְגָּאַ֛ל בְּ/פַתְבַּ֥ג הַ/מֶּ֖לֶךְ וּ/בְ/יֵ֣ין מִשְׁתָּ֑י/ו וַ/יְבַקֵּשׁ֙ מִ/שַּׂ֣ר הַ/סָּרִיסִ֔ים אֲשֶׁ֖ר לֹ֥א יִתְגָּאָֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/001/008.yaml
  text: But Daniel resolved in his heart that he would not defile himself with the king’s food or with the wine he drank[a], and he sought permission from the chief of the eunuchs that he might not defile himself.
translation:
  language: zh_hans
  text: 但以理却在心里立定主意，不以王的膳食和王所饮的酒玷污自己；他便请求太监长[a]允许他不玷污自己。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “太监”一词也可泛指“宫廷官员”；因此“太监长”也可译作“宫廷官员之长”。
    reason: 保留 סָרִיסִים 在具体身体身份与一般王室职务之间的词义歧义。
lexical_decisions:
- source_word: וַיָּשֶׂם ... עַל לִבּוֹ
  choice: 在心里立定主意
  rationale: 原文直译为“放在心上”，在这里表示内在而坚定的决意；此译既保留“心里”的意象，也符合现代汉语表达。
- source_word: יִתְגָּאַל
  choice: 玷污自己
  rationale: 此处为 התפעל 词形，表达使自己受到礼仪或盟约层面的污损。“玷污自己”保留其道德—礼仪力度，同时不擅自判定玷污的具体原因。
- source_word: פַּתְבַּג
  choice: 王的膳食
  rationale: 该词指王所供给或分配的食物。“膳食”适合宫廷语境，又不像“珍馐美味”那样过度强调奢华。
- source_word: יֵין מִשְׁתָּיו
  choice: 王所饮的酒
  rationale: 原短语可直解为“他饮用的酒”或“他宴饮的酒”；依最近的先行词“王”补明所属关系，译文自然且不增加宴席等原文未明确的信息。
- source_word: שַׂר הַסָּרִיסִים
  choice: 太监长
  rationale: סָרִיס 可指受阉的宫廷人员，也可泛指王室官员。“太监长”保留该词较具体的通常含义，较宽泛的行政含义列入脚注。
- source_word: וַיְבַקֵּשׁ
  choice: 请求……准他
  rationale: 动词意为“寻求、请求”；上下文暗含请求许可，因此用“请求……准他”自然表达其宾语和意图。
- source_word: אֲשֶׁר לֹא יִתְגָּאָל
  choice: 准他不玷污自己
  rationale: 此从句说明但以理请求的内容或目的；“准他”把语境中隐含的许可关系清楚表达出来。
theological_decisions:
- issue: 但以理拒绝王室膳食的原因
  choice: 只译作“不……玷污自己”，不说明玷污的具体机制。
  alternative: 可解释为礼仪不洁、违反摩西饮食条例，或与偶像祭物及异教王室文化发生牵连。
  rationale: 本节只说但以理要避免玷污，并未交代具体理由；保留宽泛措辞可维持原文的解释张力。
- issue: סָרִיסִים 的含义
  choice: 正文译作“太监”，脚注注明也可泛指宫廷官员。
  alternative: 宫廷官员、王室官员。
  rationale: 该词既可指太监，也可泛指高级宫廷人员。正文采用其较具体、传统且词源透明的译法，同时以脚注保留历史身份上的不确定性。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“在心里立定主意”保留希伯来语的内在意志意象；“膳食”贴合宫廷语境；分号对应本节由决意转向请求的结构。脚注标记置于其实际解释的“太监长”之后。
