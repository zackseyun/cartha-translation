base_translation:
  language: en
  yaml_path: translation/ot/daniel/001/013.yaml
  text: Then let our appearance and the appearance of the youths who are eating the king’s food be seen before you[a], and according to what you see, deal with your servants.
translation:
  language: zh_hans
  text: 请你看看我们和那些吃王膳[a]的年轻人的面貌；然后照你所看见的来对待你的仆人吧。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “王膳”也可译作“王的份食”或“王的佳肴”；原文用词指王室供应的食物。
    reason: 说明פַּתְבַּג的词义范围及可译选项。
lexical_decisions:
- source_word: וְיֵרָאוּ
  choice: 让你看看
  rationale: 该词是ראה的尼法勒未完成式，在提议中带祈使意味，字面为“让……被看见”。汉语用“让你看看”自然表达让对方观察比较，同时不把“检验”之类的解释性含义写入正文。
- source_word: לְפָנֶיךָ
  choice: 让你看看（含“在你面前”之意）
  rationale: לְפָנֶיךָ字面为“在你面前”。现代汉语若直译会略显生硬；结合被动动词转换为主动表达“让你看看”，已自然包含呈到对方面前察看的意思。
- source_word: מַרְאֵינוּ
  choice: 我们的外貌
  rationale: מַרְאֶה在此指肉眼可见的身体面貌或气色。“外貌”简明、现代，也适合后文的比较语境。
- source_word: וּמַרְאֵה הַיְלָדִים
  choice: 以及那些……年轻人的外貌
  rationale: יְלָדִים在宫廷受训的语境中指年轻人，并非幼童；“年轻人”比“孩子”更符合上下文。
- source_word: הָאֹכְלִים
  choice: 吃……的
  rationale: 希伯来语分词表示这些年轻人持续或惯常食用王所供应的膳食；汉语定语结构自然保留这一特征。
- source_word: פַּתְבַּג הַמֶּלֶךְ
  choice: 王膳
  rationale: פַּתְבַּג是指王室供应食物的借词。“王膳”凝练而庄重，表达“王所供应的膳食”，又不擅自限定为佳肴或固定份额。
- source_word: וְכַאֲשֶׁר תִּרְאֶה
  choice: 然后照你所看见的
  rationale: 保留判断依据是官员亲眼所见；“照你所看见的”贴近原文，也符合现代汉语。
- source_word: עֲשֵׂה עִם עֲבָדֶיךָ
  choice: 处置你的仆人吧
  rationale: עָשָׂה עִם意为按某种方式对待、处理。“处置”在此表示由官员根据观察结果决定如何对待他们；“你的仆人”保留宫廷中谦恭的自称。
theological_decisions:
- issue: עֲבָדֶיךָ的身份用语
  choice: 你的仆人
  alternative: 你的奴仆／你的奴隶
  rationale: 此处是但以理对官员的谦恭自称，重点在从属和请求，而非突出法律上的奴隶身份。“仆人”既保留服属意味，也符合宫廷话语语境。
- issue: וְיֵרָאוּ的观察强度
  choice: 让你看看
  alternative: 让你检验／让你察看
  rationale: 原词本身是“被看见”，语境虽含比较评估，却没有明说正式检验。正文保留较宽的“看”，避免把隐含的评估意味强化为明确程序。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“让你看看”避免机械被动句；“王膳”保持宫廷语境且便于普通读者理解；句末“吧”呈现原文请求式语气。
