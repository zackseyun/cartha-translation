  yaml_path: translation/ot/daniel/001/021.yaml
  text: And Daniel remained until the first year of King Cyrus[a].
translation:
  language: zh_hans
  text: 但以理一直留到居鲁士王元年。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“但以理在那里，直到居鲁士王元年。”希伯来文动词字面意思是“在”，这里很可能表示他持续在那里。
    reason: 保留 וַיְהִי 的字面译法及其在本语境中的持续含义，避免将“留到”理解为原文明确说明了更具体的处境。
lexical_decisions:
- source_word: וַיְהִי
  choice: 一直留到
  rationale: 该动词字面为“是／在”，与表示时间终点的 עַד 连用，并以但以理为主语，在本语境中自然表达为持续留在其位置或职分直到所述时间；“一直留到”既通顺，也不把经文具体未说明的处境说死。
- source_word: דָּנִיֵּאל
  choice: 但以理
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: עַד
  choice: 到
  rationale: 表示持续状态所达到的时间界限；与“一直留”合用，构成自然的中文时间表达。
- source_word: שְׁנַת אַחַת
  choice: 元年
  rationale: 该结构在君王纪年语境中意为“第一年”；现代中文以“元年”表达君王在位第一年，简洁而准确。
- source_word: לְכוֹרֶשׁ
  choice: 居鲁士
  rationale: 介词 לְ 在君王纪年格式中标明年份所属的君王；中文借助“居鲁士王元年”的结构自然体现，无须另译介词。
- source_word: הַמֶּלֶךְ
  choice: 王
  rationale: 明确保留原文的君王称号，并按自然中文次序置于专名之后。
theological_decisions: []
