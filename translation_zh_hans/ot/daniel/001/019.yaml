  text: וַ/יְדַבֵּ֣ר אִתָּ/ם֮ הַ/מֶּלֶךְ֒ וְ/לֹ֤א נִמְצָא֙ מִ/כֻּלָּ֔/ם כְּ/דָנִיֵּ֣אל חֲנַנְיָ֔ה מִֽישָׁאֵ֖ל וַ/עֲזַרְיָ֑ה וַ/יַּֽעַמְד֖וּ לִ/פְנֵ֥י הַ/מֶּֽלֶךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/001/019.yaml
  text: The king spoke with them[a], and among them all no one was found like Daniel, Hananiah, Mishael, and Azariah; so they stood before the king.
translation:
  language: zh_hans
  text: 王与他们交谈，在所有人中，找不到一个能与但以理、哈拿尼雅、米沙利和亚撒利雅相比的；于是他们侍立在王面前。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可理解为“于是他们开始为王效力”。希伯来文直译是“他们站在王面前”，这是宫廷用语，指在王面前供职。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר אִתָּם
  choice: 王与他们交谈
  rationale: דבר 与 אִתָּם 表示直接交谈。“交谈”自然准确；译作“面试”虽符合语境，却比希伯来文本更具解释性。
- source_word: וְלֹא נִמְצָא מִכֻּלָּם
  choice: 在所有人中，找不到一个
  rationale: 保留 מצא 的“找到”意象，并将 מִכֻּלָּם 的群体比较关系译成自然的现代汉语。
- source_word: כְּדָנִיֵּאל חֲנַנְיָה מִישָׁאֵל וַעֲזַרְיָה
  choice: 能与但以理、哈拿尼雅、米沙利和亚撒利雅相比的
  rationale: כְּ 表示比较关系。四个人名采用现代中文圣经中通行且可辨识的音译。
- source_word: וַיַּעַמְדוּ לִפְנֵי הַמֶּלֶךְ
  choice: 于是他们侍立在王面前
  rationale: עמד לפני 字面为“站在……面前”，在王宫语境中也有在王前供职、侍奉之意。“侍立”兼顾站立形象和宫廷职分，脚注说明其语用含义。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“侍立”略具宫廷色彩，但在上下文中清楚自然，并保留原文的字面形象及其职务含义。
