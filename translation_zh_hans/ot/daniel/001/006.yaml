  text: And among them[a], from the sons of Judah, were Daniel, Hananiah, Mishael, and Azariah.
translation:
  language: zh_hans
  text: 其中有犹大人[a]：但以理、哈拿尼雅、米沙利和亚撒利雅。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“犹大的儿子们”；也可译“犹大子孙”。
    reason: 说明希伯来文的字面表达，并保留其可指犹大群体成员的含义。
lexical_decisions:
- source_word: וַיְהִי
  choice: 有
  rationale: 这里的叙事形式用来陈述人物存在于前文所说的群体中；汉语用“有”最自然，无须生硬译出“事情发生了”。
- source_word: בָהֶם
  choice: 他们中间
  rationale: 介词ב在此表示这些人包含在前文提到的较大群体之内；“他们中间”准确且符合现代汉语表达。
- source_word: מִבְּנֵי יְהוּדָה
  choice: 几个犹大子孙
  rationale: 保留בני יהודה的血缘或族群表达及阳性所指；量词“几个”配合随后列出的四名男子，使句子自然。“犹大子孙”也保留其可指犹大后裔或犹大族人的张力。
- source_word: דָּנִיֵּאל
  choice: 但以理
  rationale: 采用现代中文圣经传统中通行且易识别的人名译法。
- source_word: חֲנַנְיָה
  choice: 哈拿尼雅
  rationale: 采用现代中文圣经传统中通行且易识别的人名译法。
- source_word: מִישָׁאֵל
  choice: 米沙利
  rationale: 采用现代中文圣经传统中通行且易识别的人名译法。
- source_word: וַעֲזַרְיָה
  choice: 和亚撒利雅
  rationale: 采用通行人名译法，并以“和”表达希伯来文连接最后一个名字的ו。
