base_translation:
  language: en
  yaml_path: translation/ot/daniel/001/018.yaml
  text: And at the end of the days that the king had said to bring them in[a], the chief of the eunuchs brought them before Nebuchadnezzar.
translation:
  language: zh_hans
  text: 王所说要把他们带来的期限到了时，太监长[a]把他们带到尼布甲尼撒面前。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “太监长”也可译作“宫廷官员的首领”。希伯来语此词可指太监，也可泛指王宫官员。
    reason: 保留 שַׂר הַסָּרִיסִים 的另一种词义可能，不在正文中强行决定其是否专指受阉者。
lexical_decisions:
- source_word: וּלְמִקְצָת הַיָּמִים
  choice: 到了……的日期
  rationale: 该短语指一个先前规定时期的终点。结合但以理书1:5所述三年期限，译作“到了……的日期”既表达期满之意，也比直译“日子的末了”更符合现代汉语。
- source_word: אֲשֶׁר אָמַר הַמֶּלֶךְ
  choice: 王所说
  rationale: 保留 אָמַר 的基本义“说”，不强化为“指定”或“命令”；汉语定语结构自然体现这是王先前所说的日期。
- source_word: לַהֲבִיאָם
  choice: 要把他们带来觐见
  rationale: 希伯来语使役形表达“使他们来／把他们带来”；根据宫廷语境补出“觐见”，说明带到王面前的目的，但以脚注保留更严格的字面理解。
- source_word: וַיְבִיאֵם
  choice: 就把他们带到
  rationale: 采用直接的使役义“带到”，目的地由后面的“尼布甲尼撒面前”给出。
- source_word: שַׂר הַסָּרִיסִים
  choice: 太监长
  rationale: סָרִיס 在王宫语境中可指太监，也可泛指宫廷官员；正文采用具体、传统且简洁的“太监长”，脚注保留较宽泛的可能。
- source_word: לִפְנֵי
  choice: 面前
  rationale: 准确表达进入某人面前、在其临在中的常见含义，且是自然的现代汉语。
- source_word: נְבֻכַדְנֶצַּר
  choice: 尼布甲尼撒
  rationale: 采用现代中文圣经中通行的人名音译。
theological_decisions: []
