  to: 王所说要把他们带来的期限到了时，太监长[a]把他们带到尼布甲尼撒面前。
  rationale: 删除原文未明说的“觐见”，以“期限到了时”表达既定日子的终结，并将词义说明限于“太监长”这一确有歧义的宫廷职称。修订保留王先前所说、随后由太监长执行带领、以及被带到尼布甲尼撒面前的叙述关系。
