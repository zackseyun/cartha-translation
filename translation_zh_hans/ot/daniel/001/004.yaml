  text: יְלָדִ֣ים אֲשֶׁ֣ר אֵֽין בָּ/הֶ֣ם כָּל מאום וְ/טוֹבֵ֨י מַרְאֶ֜ה וּ/מַשְׂכִּילִ֣ים בְּ/כָל חָכְמָ֗ה וְ/יֹ֤דְעֵי דַ֨עַת֙ וּ/מְבִינֵ֣י מַדָּ֔ע וַ/אֲשֶׁר֙ כֹּ֣חַ בָּ/הֶ֔ם לַ/עֲמֹ֖ד בְּ/הֵיכַ֣ל הַ/מֶּ֑לֶךְ וּֽ/לֲ/לַמְּדָ֥/ם סֵ֖פֶר וּ/לְשׁ֥וֹן כַּשְׂדִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/001/004.yaml
  text: young men in whom there was no defect at all[a], good in appearance, skillful in all wisdom, knowledgeable in learning, discerning in understanding, and who had the ability to stand in the king’s palace[c][b], and to teach them the literature and language of the Chaldeans.
translation:
  language: zh_hans
  text: 要选年轻人，他们毫无残缺，容貌俊美，在各样智慧上都有悟性，具有知识，能明辨事理，并且有能力在王宫里侍立[a]；又要教导他们迦勒底人的文字[b]和语言[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “侍立”直译为“站立”；在这里也可理解为“在王宫供职”或“在王的朝廷侍候”。
    reason: lexical_alternative
  - marker: b
    text: “文字”所译的词也可指“书写”、“书卷”，在这里可能包括文献和书吏方面的学问。
    reason: lexical_alternative
  - marker: c
    text: 原文特指“迦勒底人”；在本语境中，这一称呼也可能泛指巴比伦人。
    reason: cultural_note
lexical_decisions:
- source_word: יְלָדִים
  choice: 年轻人
  rationale: 该词可泛指孩子或青年；在选拔进入王宫受训的语境中，指适合王室服务的青年男子。“年轻人”自然且不过度限定年龄。
- source_word: אֵין בָּהֶם כָּל מְאוּם
  choice: 毫无残缺
  rationale: 表达身体上没有任何缺陷；“毫无”保留 כָּל 的周全语气，也避免“瑕疵”可能带来的祭祀色彩。
- source_word: טוֹבֵי מַרְאֶה
  choice: 容貌俊美
  rationale: 自然表达外表良好、悦目的意思，符合王宫选拔的语境。
- source_word: מַשְׂכִּילִים בְּכָל חָכְמָה
  choice: 精通各样智慧
  rationale: שכל 在此含有通达、具备才干之意；“精通”传达实际能力，“各样智慧”保留原文广泛的范围。
- source_word: יֹדְעֵי דַעַת
  choice: 富有知识
  rationale: 原文以“知道”与“知识”构成同根式意味的密集表达；中文采用自然说法，保留其知识充足之意。
- source_word: מְבִינֵי מַדָּע
  choice: 善于领悟
  rationale: 突出理解和辨明的能力，并与前面的“富有知识”形成原文所具有的知识与理解之并列。
- source_word: כֹּחַ בָּהֶם
  choice: 有能力
  rationale: כֹּחַ 可指力量或能力；这里强调胜任王宫职务的条件，译为“能力”最合语境。
- source_word: לַעֲמֹד בְּהֵיכַל הַמֶּלֶךְ
  choice: 在王宫里侍立
  rationale: 保留“站立”的具体意象，同时以“侍”表达在君王面前供职、侍奉的惯用含义。
- source_word: הֵיכַל
  choice: 王宫
  rationale: 在此王室语境中指宫殿，而非圣殿。
- source_word: לְלַמְּדָם
  choice: 教导他们
  rationale: 直接表达使这些青年接受相关文字和语言教育的意思。
- source_word: סֵפֶר
  choice: 文字
  rationale: סֵפֶר 可指书写、书卷或文献知识；在课程语境中，“文字”既贴近字面，也可涵盖书写与文献学习。
- source_word: לְשׁוֹן כַּשְׂדִּים
  choice: 迦勒底人的语言
  rationale: 直接保留原文族称和“语言”的表达，不将其无说明地泛化为“巴比伦人的语言”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。排比结构尽量保留原文层层罗列的选拔条件；对“知识”与“领悟”作自然区分，避免机械重复。“侍立”兼顾字面意象与宫廷服务含义。
