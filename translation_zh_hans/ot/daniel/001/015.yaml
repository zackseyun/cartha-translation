base_translation:
  language: en
  yaml_path: translation/ot/daniel/001/015.yaml
  text: And at the end of ten days, their appearance seemed better, and they were healthier in flesh than all the youths who were eating the king’s food.
translation:
  language: zh_hans
  text: 十天期满，他们看起来比所有吃王膳的少年气色更好，身体也更健壮。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִקְצָת יָמִים עֲשָׂרָה
  choice: 十天期满
  rationale: 准确表达十天这一期限结束，符合现代汉语习惯。
- source_word: נִרְאָה מַרְאֵיהֶם טוֹב
  choice: 他们看起来……气色更好
  rationale: נראה保留“显得、看起来”的观察意味，不将结果表述为超出观察范围的绝对判断；מראה在此指外在容貌或气色。
- source_word: בְרִיאֵי בָּשָׂר
  choice: 身体也更健壮
  rationale: 该短语直指肉身丰满健康；“身体更健壮”自然传达健康、壮实之意，避免生硬直译“肉体肥壮”。
- source_word: פַּתְבַּג הַמֶּלֶךְ
  choice: 王膳
  rationale: 指王所供应的膳食；“王膳”简洁、庄重，并与上下文用语协调。
- source_word: הַיְלָדִים
  choice: 少年
  rationale: 本章语境中指被选入宫廷受训的年轻人，“少年”比泛称“孩子”更合适。
theological_decisions: []
translation_notes:
  register: 采用现代、自然而庄重的叙事语体。句中保留“看起来”的观察性语气；比较范围“所有吃王膳的少年”表达清楚，不额外说明结果的原因。
