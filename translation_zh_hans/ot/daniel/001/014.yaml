base_translation:
  language: en
  yaml_path: translation/ot/daniel/001/014.yaml
  text: So he listened to them in this matter and tested them for ten days[a].
translation:
  language: zh_hans
  text: 于是，他在这件事上听取了他们的意见，试验他们十天[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他在这件事上答应了他们的请求”；这里的希伯来语动词既可指听取，也可指听从、应允。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: 听从
  rationale: שׁמע 与 לְ 连用可表示“听取、听从”。上下文中，委办接受了但以试验为限的请求；“听从”既体现听取意见后照办，也避免“服从”所带来的身份关系过强之意。
- source_word: לָהֶם
  choice: 他们
  rationale: 随“听从”作宾语，符合现代汉语习惯，并准确表达希伯来语介词结构的对象。
- source_word: לַדָּבָר הַזֶּה
  choice: 在这件事上
  rationale: דָּבָר 此处指前文提出的具体请求或方案；译作“这件事”自然准确，又不把词义拘泥为“话”。
- source_word: וַיְנַסֵּם
  choice: 试验他们
  rationale: נסה 的 Piel 词形表示测试、试验。此处是按所提饮食方案观察结果，“试验他们”简洁并保留原文以人为受试对象的表达。
- source_word: יָמִים עֲשָׂרָה
  choice: 十天
  rationale: 此处宾格表示持续时间；现代汉语直接说“试验他们十天”即可清楚表达试验持续十天。
theological_decisions: []
