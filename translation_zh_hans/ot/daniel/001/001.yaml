lexical_decisions:
- source_word: בִּ/שְׁנַת שָׁלוֹשׁ לְ/מַלְכוּת
  choice: 在位第三年
  rationale: 这是君王纪年格式；译作“在位第三年”既准确表达时间关系，也符合现代汉语习惯。
- source_word: יְהוֹיָקִים מֶלֶךְ יְהוּדָה
  choice: 犹大王约雅敬
  rationale: 将同位结构自然调整为汉语常用的“国名＋王＋人名”次序。
- source_word: בָּא
  choice: 来到
  rationale: 原词基本义为“来、到”；虽处于军事语境，仍不扩译为“进军”，让后面的动词明确敌对行动。
- source_word: נְבוּכַדְנֶאצַּר מֶלֶךְ בָּבֶל
  choice: 巴比伦王尼布甲尼撒
  rationale: 采用现代中文圣经传统中通行的人名音译，并按汉语习惯排列头衔与姓名。
- source_word: יְרוּשָׁלִַם
  choice: 耶路撒冷
  rationale: 采用现代汉语中通行的地名译法。
- source_word: וַ/יָּצַר עָלֶי/הָ
  choice: 围困了这城
  rationale: צור搭配עַל用于军事语境，指围攻或围城；“围困”简洁准确。“这城”明确阴性代词所指的是耶路撒冷，避免汉语中“它”指代生硬。
