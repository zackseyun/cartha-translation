base_translation:
  language: en
  yaml_path: translation/ot/daniel/012/012.yaml
  text: Blessed is the one who waits and reaches the 1,335 days[a].
translation:
  language: zh_hans
  text: 那等候并等到一千三百三十五日的人有福了。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“那等候并抵达一千三百三十五日之期的人有福了。”
    reason: 词义与表达方式的可行替代译法；“抵达……之期”较明确呈现原文到达指定时间节点的含义。
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: 有福了
  rationale: 该词宣告一个人处于蒙福、令人羡慕的境况。“有福了”保留先知语境中庄重的祝福语气，也符合现代中文表达。
- source_word: הַמְחַכֶּה
  choice: 那等候……的人
  rationale: 分词表示持续并带着期待的等候；中文以“那等候……的人”自然表达泛指单数，并保留其延续意味。
- source_word: וְיַגִּיעַ
  choice: 并达到
  rationale: 此处使役词形按语境表示来到、达到某个时间点；“达到”可自然地与所列日数搭配。
- source_word: לְיָמִים
  choice: 达到……日
  rationale: 介词与前面的动词共同表示抵达规定的日数这一时间节点；中文无需逐字译出介词。
- source_word: אֶלֶף שְׁלֹשׁ מֵאוֹת שְׁלֹשִׁים וַחֲמִשָּׁה
  choice: 一千三百三十五
  rationale: 希伯来文基数词合计为一千三百三十五；正文使用中文数字，以保持庄重而易读的经文体。
theological_decisions:
- issue: 启示文学时间表中这项祝福的含义
  choice: 只保留达到一千三百三十五日这一时间陈述，不在译文中判定该数字应按字面还是象征理解。
  alternative: 把它明确解释为严格的实际日数，或明确解释为象征性、模式化的启示文学数字。
  rationale: 原文宣告坚持等候直至指定时间的人有福，却没有说明该日数的解释方式；译文应保留这一末世论张力。
translation_notes:
  register: 采用现代、庄重而通顺的标准普通话。“有福了”保留祝福宣告的经文语气；不增添对一千三百三十五日的历法、象征或教义解释。
