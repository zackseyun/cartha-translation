  text: וַ/אֲנִ֥י שָׁמַ֖עְתִּי וְ/לֹ֣א אָבִ֑ין וָ/אֹ֣מְרָ֔/ה אֲדֹנִ֕/י מָ֥ה אַחֲרִ֖ית אֵֽלֶּה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/daniel/012/008.yaml
  text: As for me[a], I heard, but I did not understand. So I said, “My lord, what will be the outcome of these things?”
translation:
  language: zh_hans
  text: 至于我，我听见了，却不明白。于是我说：“我主啊，这些事最终会怎样呢？[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这些事的结局是什么呢？”
    reason: אַחֲרִית 既可译为“最终、末后”，也可译为“结局、结果”。
lexical_decisions:
- source_word: וַאֲנִי
  choice: 至于我
  rationale: 独立代词带有轻微的转折或重提作用；“至于我”自然地凸显但以理个人的处境。
- source_word: שָׁמַעְתִּי
  choice: 我听见了
  rationale: שׁמע 的基本义是“听见”；这里指但以理听到了启示的话，并不特别强调专心聆听。
- source_word: וְלֹא אָבִין
  choice: 却不明白
  rationale: בין 表示“明白、领会”；连词在此具有逆接意味，与前面的“听见了”形成对照。
- source_word: וָאֹמְרָה
  choice: 于是我说
  rationale: 叙事形式推进事件，也表明发问源于先前的不明白；“于是”符合现代汉语叙述习惯。
- source_word: אֲדֹנִי
  choice: 我主啊
  rationale: 保留原文“我的主”这一尊称及呼语语气，不把受话者明确断定为上帝或普通人。
- source_word: מָה אַחֲרִית אֵלֶּה
  choice: 这些事最终会怎样呢
  rationale: אַחֲרִית 可指“末后、结局、结果”；此译自然表达面向未来的最终结果，同时以脚注保留较贴近字面的译法。
theological_decisions:
- issue: אֲדֹנִי 所指的对象
  choice: 采用不加专名限定的尊称“我主啊”，让上下文指向天上的传讯者或解释者
  alternative: 译作明确指向上帝的“主啊”，或弱化为对人的“先生”
  rationale: 眼前语境显示但以理是在向启示他的那一位说话，但经文本身没有在本节明确界定其身份；译文不应作超出原文的神学认定。
- issue: אַחֲרִית 的末世意味
  choice: 正文译作“最终会怎样”，保留对这些事终局的询问
  alternative: 译作“这些事的结局是什么”或“这些事的末后是什么”
  rationale: 该词既可表示时间上的末后，也可表示事情的结局或结果；正文采用自然且涵盖两者的表达，脚注列出较字面的可能译法。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“我主啊”保留古代尊称的分量，但不使用可能预先断定受话者为上帝的专名化表达。脚注标记置于其实际说明的问句末尾。
