base_translation:
  language: en
  yaml_path: translation/ot/daniel/012/005.yaml
  text: 'Then I[a], Daniel, looked, and behold, two others were standing: one on this bank of the river, and one on that bank of the river.'
translation:
  language: zh_hans
  text: 我但以理观看，只见有另外两位站着：一位在河的这岸，一位在河的那岸。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文两处使用同一地点副词，字面均可译为“这里”；也可译作“一位在河岸的这一边，一位在河岸的那一边”。
    reason: 保留地点副词 הֵנָּה 两次重复的字面形式，并说明正文按河两岸的语境作出的自然表达。
lexical_decisions:
- source_word: וְרָאִיתִי
  choice: 我……观看
  rationale: 连词加完成式承接并推进异象叙事；“观看”自然表达但以理主动看去的动作。
- source_word: אֲנִי דָנִיֵּאל
  choice: 我但以理
  rationale: 保留独立人称代词与名字所形成的自我指明和轻微强调，同时符合现代中文叙事语体。
- source_word: וְהִנֵּה
  choice: 忽然看见
  rationale: 该话语标记引导读者注意新出现的景象；“忽然看见”在现代中文中保留现场感，但不把它理解成严格表示时间上突发的副词。
- source_word: שְׁנַיִם אֲחֵרִים
  choice: 另有两位
  rationale: “另有”将这两位与上文已有的人物区分；“位”保持中性尊称，不擅自说明其为天使或其他天上存在。
- source_word: עֹמְדִים
  choice: 站在那里
  rationale: 分词描绘持续的站立姿态；中文用“站在那里”自然呈现静态场景。
- source_word: הֵנָּה
  choice: 这岸……那岸
  rationale: 结合河岸语境，用成对的“这岸／那岸”自然表达两处相对位置；原文两次使用同一地点副词，另以脚注说明。
- source_word: לִשְׂפַת הַיְאֹר
  choice: 在河的……岸
  rationale: שָׂפָה本义为边缘、唇，河流语境中自然译作“岸”；יְאֹר在本异象中泛指河，不必具体化为尼罗河。
theological_decisions:
- issue: “另有两位”的身份
  choice: 仅译为“另有两位”，不说明其身份
  alternative: “另有两位天使”或“另有两个天上的存在”
  rationale: 本节希伯来文没有明说这两位是谁；中性表达避免把上下文推断直接写进译文。
- issue: 两位所站位置的关系
  choice: 正文译作“这岸……那岸”
  alternative: 按字面重复译作“这里……这里”
  rationale: 上下文以河岸为参照，明显呈现两处位置；正文采用自然中文表达其对举关系，同时以脚注保留希伯来文形式上的重复和可能的歧义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“忽然看见”承担 וְהִנֵּה 的引介和聚焦作用；不使用较古雅的“看哪”。量词“位”尊重人物而不预设其天使身份。
