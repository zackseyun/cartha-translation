  yaml_path: translation/ot/daniel/012/013.yaml
  text: But as for you[a], go to the end[d][c][b]; and you will rest and stand in your allotted place at the end of the days.
translation:
  language: zh_hans
  text: 至于你，你要走向终局[a]；你必安息[b]。到了末后的日子[d]，你必站立，得着为你所定的份[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你要走，直到终局。”
    reason: lexical_alternative
  - marker: b
    text: “安息”很可能指但以理会在最终成全之前死去。
    reason: lexical_alternative
  - marker: c
    text: 直译可作：“为你的阄（或份）站立”；意思可能是得着所分给你的份或产业。
    reason: lexical_alternative
  - marker: d
    text: “末后的日子”是指向终末的表达；参但以理书12:2。
    reason: cross_reference
lexical_decisions:
- source_word: וְאַתָּה
  choice: 至于你
  rationale: 独立代词配合连接词，把话题转回但以理本人，并带有对比意味；“至于你”自然体现这一语篇转折。
- source_word: לֵךְ לַקֵּץ
  choice: 你要走向终局
  rationale: לֵךְ是命令式“去、走”，לַקֵּץ指向“终点、结局”。译文保留朝向终局前行的表达，不把介词的时间含义直接定死。
- source_word: וְתָנוּחַ
  choice: 你必安息
  rationale: נוח本义是“安息、歇息”。上下文可能暗指但以理死去，正文仍保留动词本身的含蓄表达。
- source_word: וְתַעֲמֹד
  choice: 你必站立
  rationale: עמד本义为“站立”。但以理书12章的语境可使人联想到复活，但正文不将其明确改译为“复活”或“起来”。
- source_word: לְגֹרָלְךָ
  choice: 得着为你所定的份
  rationale: גּוֹרָל原指“签、阄”，进而指借抽签分得的份额。此处用现代汉语表达所得的指定份额，同时保留“所定”的分配意象。
- source_word: לְקֵץ הַיָּמִין
  choice: 到了末后的日子
  rationale: 直译为“在那些日子的末了”。“到了末后的日子”在现代汉语中自然庄重，也保留其末世性而不进一步界定具体时点。
theological_decisions:
- issue: וְתָנוּחַ是否应明确译作死亡
  choice: 正文译作“你必安息”
  alternative: “你必死去安息”或“你必在死亡中安息”
  rationale: 上下文很可能指但以理在最终成全之前死去，但נוח本身只说“安息”；正文不把语境推论写成明说。
- issue: וְתַעֲמֹד是否应明确译作复活
  choice: 正文译作“你必站立”
  alternative: “你必起来”或“你必复活”
  rationale: 本章12:2使复活成为自然联想，但עמד的词义是“站立”。保留原有意象，也保留经文的神学张力。
- issue: לְגֹרָלְךָ所指是位置、产业还是最终所得的份
  choice: 译作“得着为你所定的份”
  alternative: “站在指定给你的位置上”或“承受你的产业”
  rationale: “份”涵盖所分得的部分而不过早限定为土地、职位或某种具体奖赏；“为你所定”传达גּוֹרָל的分配含义。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“终局”“安息”“站立”“所定的份”分别尽量对应原文意象；不在正文中明说死亡或复活，以免消除原文保留的含蓄和张力。脚注标记按其所解释的短语就近放置。
