base_translation:
  language: en
  yaml_path: translation/ot/daniel/012/002.yaml
  text: And many of those sleeping in the dust of the earth will awake[a], these to everlasting life, and those to reproaches[c][b], to everlasting contempt.
translation:
  language: zh_hans
  text: 地上尘土中沉睡的人，有许多将要醒来[a]：这些人要得永生；那些人要受羞辱[b]，永远被憎恶[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作：“地上尘土中沉睡的众多人将要醒来。”希伯来原文说的是“许多”，并没有明确说“所有人”。
    reason: alternative_reading
  - marker: b
    text: “受羞辱”也可译作“蒙羞”或“受凌辱”。
    reason: lexical_alternative
  - marker: c
    text: “被憎恶”也可译作“被鄙弃”。参以赛亚书66:24；那里在审判语境中使用了同一罕见名词。
    reason: cross_reference
lexical_decisions:
- source_word: רַבִּים
  choice: 有许多
  rationale: 直译为“许多”，不扩展成“所有人”；既符合希伯来语的通常词义，也保留其范围是否具有包举意味的歧义。
- source_word: מִיְּשֵׁנֵי
  choice: 沉睡的人
  rationale: 保留以睡眠指死亡的隐喻，不直接解释为“死去的人”。
- source_word: אַדְמַת עָפָר
  choice: 地上尘土中
  rationale: 自然表达埋葬与必朽的尘土意象；原短语较直可作“尘土之地”。
- source_word: יָקִיצוּ
  choice: 将要醒来
  rationale: 保留与“沉睡”相呼应的苏醒意象，避免以“复活”直接代替原动词。
- source_word: אֵלֶּה ... וְאֵלֶּה
  choice: 这些人……那些人
  rationale: 保留原文两组人之间的指示性对照，而不改写成“有些……另一些”。
- source_word: לְחַיֵּי עוֹלָם
  choice: 要得永生
  rationale: “永生”是现代汉语自然、庄重且为普通读者熟悉的表达；介词 לְ 表明趋向或结局。
- source_word: חֲרָפוֹת
  choice: 受羞辱
  rationale: 该复数名词可指辱骂、羞辱或耻辱；“受羞辱”保留社会性受辱意味，同时较“受辱骂”更适合作为末后结局。
- source_word: דִרְאוֹן
  choice: 被憎恶
  rationale: 此罕见名词表示憎恶、厌弃；采用被动表达，传达成为憎恶对象的含义。“被鄙弃”亦属可能。
- source_word: עוֹלָם
  choice: 永生／永远
  rationale: 两处均表达持久无尽的时间；汉语需依搭配分别译为固定词“永生”和副词“永远”，语义与平行关系仍然清楚。
theological_decisions:
- issue: “许多”所指的复活范围
  choice: 按 רַבִּים 译作“有许多”，不增译为“所有人”。
  alternative: 可理解为所论死者的全体，或译作“众多的人”。
  rationale: 原文明确说“许多”，但其语用范围仍可讨论；译文不以系统神学结论消除这一张力。
- issue: 负面结局的性质
  choice: 分别译出“受羞辱”和“永远被憎恶”。
  alternative: “蒙羞，永远被鄙弃”或“受凌辱，永远令人憎恶”。
  rationale: 原文有两个相连但不同的名词，前者为复数、带社会性羞辱意味，后者表示强烈憎恶；不将二者压缩成单一概念，也不引入后期教义术语。
translation_notes:
  register: 采用现代标准普通话，句式庄重而清楚。以“沉睡／醒来”保存原文隐喻；用分号突出两种结局的平行对照。脚注标记均置于相关词句之后。
