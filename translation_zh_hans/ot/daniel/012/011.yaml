base_translation:
  language: en
  yaml_path: translation/ot/daniel/012/011.yaml
  text: And from the time that the regular offering is removed and the abomination that desolates is set up[b][a], there will be 1,290 days.
translation:
  language: zh_hans
  text: 从常献的祭物[a]被撤去，并设立那带来荒凉的可憎之物[b]之时起，必有一千二百九十日。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“常献祭”或较传统的“每日的祭”。希伯来语“常献的”（תָּמִיד）在这里是礼仪用语的省略说法，指圣殿中定期、持续献上的祭物。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“那使荒凉的可憎之物”或“那荒凉的可憎之物”；按传统译法可作“那行毁坏可憎的事物”。
    reason: alternative_reading
lexical_decisions:
- source_word: וּמֵעֵת
  choice: 从……之时起
  rationale: מִן与עֵת共同标明时间起点；前缀连接词承接上文。中文用“从……之时起”自然表达其时间关系，不必机械译出“并且”。
- source_word: הוּסַר
  choice: 被撤去
  rationale: 这是סור的使役被动式，表示某物遭到移除。“被撤去”既保留被动意义，也适合圣殿礼仪被终止的语境。
- source_word: הַתָּמִיד
  choice: 常献的祭
  rationale: תָּמִיד在这里是礼仪用语的省略说法，指圣殿中定期、持续献上的祭。“常献的祭”保留这种礼仪含义，又不擅自限定为某一种祭。
- source_word: וְלָתֵת
  choice: 并设立
  rationale: 字面义为“并放置／设立”。在本句的时间结构中，中文以“并设立”表达第二件作为计时起点的事，清楚而不过度补充原文未明说的施事者。
- source_word: שִׁקּוּץ
  choice: 可憎之物
  rationale: 该词常指令人厌恶、尤其与偶像崇拜或亵渎有关的事物。“可憎之物”在现代中文中清楚庄重，并保留所指对象未完全明定的特点。
- source_word: שֹׁמֵם
  choice: 使地荒凉的
  rationale: 该分词修饰“可憎之物”，表达其造成荒凉的作用。补出“地”使中文表达自然，但不规定荒凉具体指圣所、城或其他对象；脚注保留传统名词化译法。
- source_word: יָמִים אֶלֶף מָאתַיִם וְתִשְׁעִים
  choice: 必有一千二百九十日
  rationale: 希伯来文简洁列出“日子：一千二百九十”。中文补入“必有”，使预言语境中的句子完整流畅，同时准确保留数目。
theological_decisions:
- issue: הַתָּמִיד在启示文学和圣殿语境中的译法
  choice: 常献的祭
  alternative: 常献祭；每日的祭；常献的燔祭
  rationale: 原词是省略性的礼仪术语。“常献的祭”既指出圣殿献祭背景，也不把原文进一步限定为燔祭或强调每日一次；较传统的译法收入脚注。
- issue: שִׁקּוּץ שֹׁמֵם的语法和神学张力
  choice: 那使地荒凉的可憎之物
  alternative: 那带来荒凉的可憎之物；行毁坏可憎的；荒凉的可憎之物
  rationale: 将שֹׁמֵם理解为具有主动或使动作用的分词，可直接体现该可憎之物造成荒凉的含义，同时不判定其具体历史或末世所指。传统名词化表达列于脚注，以保留经文互文中的熟悉措辞。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。“常献的祭”保留圣殿礼仪色彩；“可憎之物”避免过早认定具体对象。句式以“从……之时起”清楚呈现计时起点，并保留原文两件并列事件之间略为紧凑的关系。
