base_translation:
  language: en
  yaml_path: translation/ot/daniel/012/003.yaml
  text: And those who have insight will shine like the brightness of the expanse[a], and those who make the many righteous[c][b], like the stars forever and ever.
translation:
  language: zh_hans
  text: 有智慧的人必发光，如穹苍的光辉[a]；使许多人归义的人[b]，必如星辰，直到永永远远。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “有智慧的人”也可译作“有洞见的人”或“明智的人”；“穹苍”指铺展开来的广大天穹。
    reason: lexical_alternative
  - marker: b
    text: “使许多人归义”也可译作“使许多人成为义人”“使许多人得以称义”或“引导许多人行义”；原文的使役表达兼有这些可能。
    reason: alternative_reading
lexical_decisions:
- source_word: הַמַּשְׂכִּלִים
  choice: 有智慧的人
  rationale: 该词是שׂכל的使役词干分词，在此指具有洞察力、明辨力的人。“有智慧的人”自然庄重，也可涵盖“明智的人”和“有洞见的人”。
- source_word: יַזְהִרוּ
  choice: 必发光
  rationale: זהר的使役词干在此表示发光、闪耀；“必发光”简洁自然，并与下文的光辉和星辰意象呼应。
- source_word: כְּזֹהַר הָרָקִיעַ
  choice: 如穹苍的光辉
  rationale: זֹהַר指光辉、明亮；רָקִיעַ指铺展开来的天穹。“穹苍”既保留古代宇宙图景，又比单译“天空”更贴近原词。
- source_word: וּמַצְדִּיקֵי הָרַבִּים
  choice: 使众人得以称义的人
  rationale: צדק的使役词干分词具有使成为义、使被判为义或引向正义等可能含义。“使众人得以称义”保留其使役性及司法—伦理张力，同时避免武断限定具体机制。定冠词所指的群体在汉语中自然译作“众人”。
- source_word: כַּכּוֹכָבִים
  choice: 如星辰
  rationale: 直接保留明喻；“星辰”较“星星”更符合本节庄重、诗性的语体。
- source_word: לְעוֹלָם וָעֶד
  choice: 直到永永远远
  rationale: 这一成对表达强化永久性；“直到永永远远”在现代宗教文体中清楚自然，并保留强调语气。
theological_decisions:
- issue: מַצְדִּיקֵי הָרַבִּים的含义
  choice: 使众人得以称义的人
  alternative: 使众人成为义人的人；引导众人行义的人；使众人被判为义的人
  rationale: 原文的使役形式可以涉及使人成为义、促使人行义或使人获判为义。正文采用“使……得以称义”，尽量保留结果与宣告之间的张力；脚注列出主要语义可能，不把后来的特定称义论预先置入经文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以分号呈现两组平行主语和比喻；第二分句补出“必”，使汉语句法完整，但不增加新的时间或神学含义。所有脚注标记均置于正文相应位置。
