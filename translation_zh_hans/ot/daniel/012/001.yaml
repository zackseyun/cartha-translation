  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וּ/בָ/עֵ֣ת הַ/הִיא֩ יַעֲמֹ֨ד מִֽיכָאֵ֜ל הַ/שַּׂ֣ר הַ/גָּד֗וֹל הָ/עֹמֵד֮ עַל בְּנֵ֣י עַמֶּ/ךָ֒ וְ/הָיְתָה֙ עֵ֣ת צָרָ֔ה אֲשֶׁ֤ר לֹֽא נִהְיְתָה֙ מִֽ/הְי֣וֹת גּ֔וֹי עַ֖ד הָ/עֵ֣ת הַ/הִ֑יא וּ/בָ/עֵ֤ת הַ/הִיא֙ יִמָּלֵ֣ט עַמְּ/ךָ֔ כָּל הַ/נִּמְצָ֖א כָּת֥וּב בַּ/סֵּֽפֶר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/012/001.yaml
  text: And at that time Michael[a], the great prince who stands over the sons of your people, will arise. And there will be a time of distress such as has not happened since there was a nation until that time. And at that time your people will escape[c][b], everyone who is found written in the book.
translation:
  language: zh_hans
  text: “到那时，保护你同胞的[a]大君米迦勒必挺身而起。那将是一段患难的时期[b]，是自有国家以来直到那时前所未有的。到那时，你人民中凡被发现名字记在书册上的人，都必逃脱[c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“站在你人民的众子之上的”；也可译作“为你同胞站立的”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“危难时期”。
    reason: lexical_alternative
  - marker: c
    text: 或译：“都必蒙拯救”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעֲמֹד
  choice: 必挺身而起
  rationale: 动词 עמד 基本义为“站立”，在此启示文学语境中表示起身采取行动。“挺身而起”既保留站立的意象，也自然传达米迦勒决定性介入的意味。
- source_word: הַשַּׂר הַגָּדוֹל
  choice: 大君
  rationale: שַׂר 可指首领、统帅或君王；但以理书在天上权势的语境中，传统而凝练的“大君”能保留其尊位，又不把角色限定为世俗君王。
- source_word: הָעֹמֵד עַל בְּנֵי עַמֶּךָ
  choice: 护佑你同胞的
  rationale: 字面为“站在你人民的众子之上”。介词 עַל 与分词在此表达为其站立、监管或保护；“护佑”使现代汉语读者清楚理解关系，同时脚注保留更贴近字面的译法。“你同胞”自然表达 בְּנֵי עַמֶּךָ 所指的本族成员，避免在汉语中误读为仅限男性儿子。
- source_word: עֵת צָרָה
  choice: 患难时期
  rationale: צָרָה 可指患难、困苦或危难。“患难时期”庄重而通俗，并保留事件的严重程度。
- source_word: אֲשֶׁר לֹא נִהְיְתָה מִהְיוֹת גּוֹי עַד הָעֵת הַהִיא
  choice: 是自从有国家以来，直到那时从未有过的
  rationale: 贴近希伯来文的时间比较结构，不扩展为“万国”或“人类历史”，从而保留 גּוֹי 在此可作泛指“国家/民族”的表达。
- source_word: יִמָּלֵט
  choice: 都必逃脱
  rationale: מלט 的尼法勒形可表示“逃脱”或“蒙拯救”。正文采用“逃脱”以突出安然脱离患难的词汇义，不预先限定其神学方式；另一种被动意味列入脚注。
- source_word: כָּל הַנִּמְצָא כָּתוּב בַּסֵּפֶר
  choice: 所有名录在册上的人
  rationale: 该短语直指凡被发现写在册中的人。“名录在册”是自然现代汉语，并保留被记录于特定册卷中的意象；“册”不武断规定其物质形式或具体神学名称。
theological_decisions:
- issue: 米迦勒行动的性质
  choice: 译为“挺身而起”，表达他作为护佑者开始采取决定性行动
  alternative: 译为“站立”或“站起来”，可更直接保留字面及法庭、军事上的站立意象
  rationale: 原文允许静态站立与起而行动之间的相关含义。正文选择符合上下文的行动性表达，却不进一步界定其天使论角色或行动方式。
- issue: יִמָּלֵט 所表达的解救
  choice: 译为“逃脱”，前景化从空前患难中得以脱离
  alternative: 译为“蒙拯救”，强调外力施行的拯救，并可具有更广的末世含义
  rationale: 尼法勒形兼容逃脱与被救的语义。采用“逃脱”避免在本节中把它收窄为某一套救恩论，同时以脚注保留被动解救的可能。
- issue: 册上有名者与人民的关系
  choice: 将“所有名录在册上的人”作为“你的人民”的同位说明
  alternative: 可理解为在人民之中进一步限定那些被记在册上的人
  rationale: 希伯来文后置短语可自然作限定或同位说明。汉语译文保留这种范围关系，不说明册的具体名称，也不推断未记名者的结局。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“挺身而起”“患难时期”“名录在册”保持启示文学的肃穆感，同时避免生硬照搬希伯来语序。正文中的脚注标记 [a]、[b]、[c] 均与脚注对应。
