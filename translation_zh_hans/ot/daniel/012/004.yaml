  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/אַתָּ֣ה דָֽנִיֵּ֗אל סְתֹ֧ם הַ/דְּבָרִ֛ים וַ/חֲתֹ֥ם הַ/סֵּ֖פֶר עַד עֵ֣ת קֵ֑ץ יְשֹׁטְט֥וּ רַבִּ֖ים וְ/תִרְבֶּ֥ה הַ/דָּֽעַת־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/012/004.yaml
  text: But you[a], Daniel, shut up the words and seal the book until the time of the end. Many will roam about[b], and knowledge will increase.
translation:
  language: zh_hans
  text: 但你，但以理，要封存这些话，封好这书卷[a]，直到末期。必有许多人四处奔走[b]，知识也必增长。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “书卷”也可译作“书”或“文书”。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“来往奔走”；这里的希伯来语也可能含有反复察看、搜寻的意思，因此整句或可理解为：“许多人将反复查考，认识也必增长。”
    reason: alternative_reading
lexical_decisions:
- source_word: סְתֹם
  choice: 封存
  rationale: 该命令式有封闭、使之暂不可接触之意；“封存”既保留具体动作，也不过度解释为完全隐瞒。
- source_word: הַדְּבָרִים
  choice: 这些话
  rationale: דבר 可指“话”或“事情”；上下文指但以理所领受的启示内容，“这些话”指代清楚且自然。
- source_word: חֲתֹם
  choice: 封好
  rationale: 该命令式指给文书加封；“封好”与宾语“书卷”搭配自然，并与前面的“封存”有所区分。
- source_word: הַסֵּפֶר
  choice: 这书卷
  rationale: ספר 可指书、卷轴或文书；古代语境中“书卷”准确而易懂，指示语“这”使所指更明确。
- source_word: עַד עֵת קֵץ
  choice: 直到末期
  rationale: 直译为“直到终结之时”；“末期”是简洁、庄重的现代汉语表达，不额外界定其具体年代。
- source_word: יְשֹׁטְטוּ רַבִּים
  choice: 必有许多人四处奔走
  rationale: שוטט 可表示来往、四处走动，也可能含有遍察或搜寻之意；正文采用宽泛的移动义，脚注保留搜寻性的理解。
- source_word: וְתִרְבֶּה הַדָּעַת
  choice: 知识也必增长
  rationale: רבה 表示增多或增长，דעת 通常指知识；此译法直接、自然，同时不限定这是一般知识还是对启示的认识。
theological_decisions:
- issue: יְשֹׁטְטוּ רַבִּים וְתִרְבֶּה הַדָּעַת 的含义
  choice: 正文表述为许多人四处奔走、知识增长，但不说明二者究竟指一般旅行与知识发展，还是查考书卷与增进对预言的认识。
  alternative: 可理解为“许多人将来往奔走，知识将增多”；也可理解为“许多人将反复查考，认识将增长”。
  rationale: 希伯来语动词 שוטט 具有移动、巡行乃至遍察的语义空间，本句也未明确限定 דעת 的对象。译文应保留这种真实歧义，避免将经文专门套用于现代交通、科技进步或某一种预言解释。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“封存……封好……”保留原文两个相近命令的平行结构；“四处奔走”避免古奥，又由脚注呈现“查考”的可能含义。专名采用《和合本》传统译名“达尼以理”，便于普通中文读者辨识。
