  text: וַ/יֹּ֖אמֶר לֵ֣ךְ דָּנִיֵּ֑אל כִּֽי סְתֻמִ֧ים וַ/חֲתֻמִ֛ים הַ/דְּבָרִ֖ים עַד עֵ֥ת קֵֽץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/012/009.yaml
  text: And he said[a], “Go your way, Daniel, because the words are concealed and sealed until the time of the end.”
translation:
  language: zh_hans
  text: 他就说：“但以理，你去吧！因为这些话被隐藏、被封住，直到末期。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “隐藏”也可译作“封闭”。希伯来文用两个被动分词描述这些话在所定的末期以前处于不可获取的状态。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 他就说
  rationale: 未完成式连续体推进叙事；“就说”在现代汉语中自然体现承接关系。
- source_word: לֵךְ
  choice: 你去吧
  rationale: הלך的命令式；加“吧”既自然，也表达此处让但以理离去、不再追问的语境意味，而不额外强化为逐客语气。
- source_word: דָּנִיֵּאל
  choice: 但以理
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: כִּי
  choice: 因为
  rationale: 明确表达该连词在此引出命令理由的因果作用。
- source_word: סְתֻמִים
  choice: 隐藏
  rationale: סתם的被动分词，表示这些话被封闭而暂不可获取或明白；“隐藏”自然清楚，同时脚注保留“封闭”的词义可能。
- source_word: וַחֲתֻמִים
  choice: 封住
  rationale: חתם的被动分词，常用于文件被盖印封存；“封住”保留其具体意象，并与“隐藏”形成两个并列状态。
- source_word: הַדְּבָרִים
  choice: 这些话
  rationale: דבר在此指前文启示的言语；汉语用“这些话”能自然指回刚才所述内容。
- source_word: עַד עֵת קֵץ
  choice: 直到末期
  rationale: 简明保留“直到”和指定终末时期的结构；“末期”在《但以理书》语境中具有终末意味，却不擅自规定具体年代。
theological_decisions:
- issue: עֵת קֵץ的终末论含义
  choice: 末期
  alternative: 终结之时／末后的时期
  rationale: “末期”保留该短语在《但以理书》中的特殊终末指向，同时不把它解释为某一预定历史日期或具体时间表。
- issue: 这些话不可获取的性质
  choice: 已经隐藏、封住
  alternative: 已经封闭、封住
  rationale: 保留两个被动分词及其神意被动的可能，不说明是谁执行了隐藏和封存，也不把它简化为仅仅“难以理解”。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“你去吧”符合当代口语习惯而不过分随便；“隐藏、封住”保留原文两个并列被动分词；“末期”保持《但以理书》关键术语的终末张力。脚注标记置于整节句末。
