  text: וַ/יֹּ֗אמֶר לָ/אִישׁ֙ לְב֣וּשׁ הַ/בַּדִּ֔ים אֲשֶׁ֥ר מִ/מַּ֖עַל לְ/מֵימֵ֣י הַ/יְאֹ֑ר עַד מָתַ֖י קֵ֥ץ הַ/פְּלָאֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/012/006.yaml
  text: And he said to the man clothed in linen[a], who was above the waters of the river[b], “How long until the end of these wonders?”
translation:
  language: zh_hans
  text: 他对那身穿细麻衣、在河水上方的人说：“这些奇事要到何时才结束？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 他……说
  rationale: 以现代汉语自然叙事表达 wayyiqtol；主语依上下文保留为“他”，不擅自说明其身份。
- source_word: לָאִישׁ
  choice: 对……的人
  rationale: 前缀冠词表明这是上下文中可识别的特定人物，因此用“那……的人”。
- source_word: לְבוּשׁ הַבַּדִּים
  choice: 身穿细麻衣
  rationale: 准确表达穿着细麻织物或衣服的状态，也保持异象叙述庄重而自然的语体。
- source_word: אֲשֶׁר מִמַּעַל לְמֵימֵי הַיְאֹר
  choice: 在河水上方
  rationale: מִמַּעַל 表示位于水面之上；יְאֹר 在本处按异象语境译作“河”，不引入尼罗河的地域联想。
- source_word: עַד מָתַי
  choice: 要到何时才
  rationale: 该惯用语询问距离某事完成尚有多久；此译法符合现代汉语，也保留面向终点的含义。
- source_word: קֵץ
  choice: 结束
  rationale: 这里指相关事件达到终点或完成；汉语问句中用动词“结束”比名词结构更自然。
- source_word: הַפְּלָאוֹת
  choice: 这些奇事
  rationale: 源自 פלא，指非凡、令人惊异的事；“这些”结合定冠词和近在语境中的事件，明确其回指作用。
theological_decisions:
- issue: 说话者与异象人物的身份
  choice: 保留“他”和“身穿细麻衣……的人”的文本描述，不进一步认定身份。
  alternative: 明确译为一位天使向另一位天使说话，或把身穿细麻衣者认定为基督显现。
  rationale: 本节本身没有明确说明这些身份；保持原文的简略指称，可避免加入经文未作出的神学判断。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“在河水上方”保留异象中的空间关系；问句调整为自然汉语语序，但不消解原文关于终期的张力。
