id: DAN.12.7
reference: Daniel 12:7
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וָ/אֶשְׁמַ֞ע אֶת הָ/אִ֣ישׁ לְב֣וּשׁ הַ/בַּדִּ֗ים אֲשֶׁ֣ר מִ/מַּעַל֮ לְ/מֵימֵ֣י הַ/יְאֹר֒ וַ/יָּ֨רֶם יְמִינ֤/וֹ וּ/שְׂמֹאל/וֹ֙ אֶל הַ/שָּׁמַ֔יִם וַ/יִּשָּׁבַ֖ע בְּ/חֵ֣י הָ/עוֹלָ֑ם כִּי֩ לְ/מוֹעֵ֨ד מֽוֹעֲדִ֜ים וָ/חֵ֗צִי וּ/כְ/כַלּ֛וֹת נַפֵּ֥ץ יַד עַם קֹ֖דֶשׁ תִּכְלֶ֥ינָה כָל אֵֽלֶּה־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/012/007.yaml
  text: Then I heard the man clothed in linen[a], who was above the waters of the river, and he raised his right hand and his left hand to heaven and swore by him who lives forever that it would be for a time, times, and half a time; and when the shattering of the power of the holy people is finished[b], all these things will be completed.
translation:
  language: zh_hans
  text: 我听见那身穿细麻衣、在河水之上的人。他向天举起右手和左手，指着那永远活着的起誓，说：“这事还要延续一段时期、若干时期和半段时期[a]；等到圣民的力量被彻底粉碎[b]，这一切都必完成。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译可作“一个定期、若干定期和半个定期”；许多人理解为“一年、两年、半年”。
    reason: 保留מוֹעֵד的词义范围、复数的未定数量及时间单位的不确定性。
  - marker: b
    text: 希伯来文直译为“圣民的手”；“手”在这里很可能指力量或权势。
    reason: 说明正文采用的转喻译法。
lexical_decisions:
- source_word: לְבוּשׁ הַבַּדִּים
  choice: 身穿细麻衣
  rationale: 用自然的现代汉语保留衣料及人物形象；בַּדִּים在此指细麻布衣服。
- source_word: הַיְאֹר
  choice: 河
  rationale: 异象语境所指是河流；不译作“尼罗河”，以免加入本节并未要求的埃及地域含义。
- source_word: וַיָּרֶם יְמִינוֹ וּשְׂמֹאלוֹ
  choice: 举起右手和左手
  rationale: 原文分别点明左右两手，译文保留这一庄严的起誓动作。
- source_word: בְּחֵי הָעוֹלָם
  choice: 指着那永远活着的起誓
  rationale: 符合汉语起誓表达，也保留原文对永活者的含蓄神圣指称。
- source_word: לְמוֹעֵד מוֹעֲדִים וָחֵצִי
  choice: 要经过一时、二时、半时
  rationale: 保留末世异象用语的含混性，不在正文中直接确定为三年半；“二时”按复数在这一固定表达中的通常理解传达。
- source_word: נַפֵּץ יַד עַם קֹדֶשׁ
  choice: 圣民的力量被粉碎殆尽
  rationale: יַד字面为“手”，此处转喻力量或权势；“粉碎殆尽”保留נַפֵּץ及完成性结构的强烈语气。
- source_word: תִּכְלֶינָה כָל אֵלֶּה
  choice: 这一切就都结束了
  rationale: 表达所预告之事达到终点，并自然衔接中文时间从句。
theological_decisions:
- issue: 末世时间公式 לְמוֹעֵד מוֹעֲדִים וָחֵצִי 的具体长度
  choice: 正文译作“一时、二时、半时”，不明确指定年月单位
  alternative: 一载、二载、半载；或一个定期、若干定期和半个定期
  rationale: 原文没有在本节明说计时单位。正文保留其象征性和解释空间，脚注说明常见理解而不将其定为唯一解释。
- issue: יַד在圣民受难描述中的含义
  choice: 按转喻译作“力量”
  alternative: 直译为“手”，或译作“权势”
  rationale: 现代汉语中的“手被粉碎”容易被误解为身体伤害；“力量”准确传达希伯来语以“手”表示能力或权势的用法，同时不削弱受压迫的严重程度。
- issue: נַפֵּץ结构中施动者是否明说
  choice: 采用“被粉碎殆尽”的无施动者被动表达
  alternative: 译作“他粉碎圣民的力量”
  rationale: 希伯来文在此没有明确点出施动者；被动表达避免擅自认定是异象中的某一人物、敌对势力或上帝亲自施行。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“右手和左手”有意保留原文逐一列举双手的形式；引号使誓言内容清楚，但不增添说话者身份或具体年代等解释。英文咨询层把[a]误置在“linen”之后；本稿依其脚注实际内容，将[a]置于时间公式之后。
