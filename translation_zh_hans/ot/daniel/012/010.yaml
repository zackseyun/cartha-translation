id: DAN.12.10
reference: Daniel 12:10
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: יִ֠תְבָּֽרֲרוּ וְ/יִֽתְלַבְּנ֤וּ וְ/יִצָּֽרְפוּ֙ רַבִּ֔ים וְ/הִרְשִׁ֣יעוּ רְשָׁעִ֔ים וְ/לֹ֥א יָבִ֖ינוּ כָּל רְשָׁעִ֑ים וְ/הַ/מַּשְׂכִּלִ֖ים יָבִֽינוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/012/010.yaml
  text: Many will purify themselves and make themselves white and be refined[a], but the wicked will act wickedly; and none of the wicked will understand[b], but those who have insight will understand.
translation:
  language: zh_hans
  text: 许多人必洁净自己，使自己洁白，并受熬炼[a]；恶人却必行恶。恶人没有一个会明白，惟有有见识的人[b]会明白。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“许多人必被洁净、被洗白，并受熬炼。”前两个希伯来语动词可以带被动意味，其形式也容许正文所表达的反身意味。
    reason: alternative_reading
  - marker: b
    text: “有见识的人”或译“智慧人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתְבָּרֲרוּ
  choice: 必洁净自己
  rationale: 此处 התפעל 形式可有反身或中间语态意味；译作“洁净自己”既保留人的参与，也不把经文未明说的施事者补入正文。
- source_word: יִתְלַבְּנוּ
  choice: 使自己洁白
  rationale: 保留“变白、洁白”的具体意象，并以反身表达反映 התפעל 形式；不将其抽象化为单纯的“得洁净”。
- source_word: יִצָּרְפוּ
  choice: 受熬炼
  rationale: 此词的 נפעל 形式带被动或中间语态意味，原有金属经火炼净的意象；“受熬炼”在现代汉语中自然，也保留试炼与炼净的双重联想。
- source_word: רַבִּים
  choice: 许多人
  rationale: 作为不定复数主语，译作“许多人”清楚自然，不额外限定其群体身份。
- source_word: הִרְשִׁיעוּ רְשָׁעִים
  choice: 恶人却必行恶
  rationale: 原文以同根词强化恶人的恶行；“恶人行恶”在汉语中保留这种呼应，同时简洁庄重。
- source_word: כָּל רְשָׁעִים וְלֹא יָבִינוּ
  choice: 恶人没有一个会明白
  rationale: 希伯来语以“所有”配合否定动词表达全称否定；汉语用“没有一个”更自然准确。
- source_word: הַמַּשְׂכִּלִים
  choice: 有洞见的人
  rationale: 该分词指有见识、能辨明的人；此译保留其主动辨识的意味，也与下文“会明白”形成清楚联系，而不把词义泛化为一般的智慧。
- source_word: יָבִינוּ
  choice: 会明白
  rationale: בין 在此表示理解、辨明；“明白”直接而自然，并清楚呈现恶人与有洞见者之间的对比。
theological_decisions:
- issue: 前三个动词应译为人的反身行动，还是未明说施事者的被动炼净
  choice: 正文将前两个 התפעל 动词译为“洁净自己、使自己洁白”，将第三个 נפעל 动词译为“受熬炼”
  alternative: 许多人必被洁净，成为洁白，并受熬炼
  rationale: 原文前两个动词容许反身或中间语态理解，第三个更自然地带被动或中间意味。正文保存这种语法层次，不把三者全部统一为被动，也不明说是上帝直接施行。脚注注明被动读法，以保留真实歧义。
- issue: הַמַּשְׂכִּלִים 是强调洞见与辨识，还是泛指智慧人
  choice: 有洞见的人
  alternative: 智慧人
  rationale: 但以理书中该词常指有见识、能辨明的人。正文采用较贴近分词意味的表达，并避免把它扩展为较宽泛的智慧传统类别；可行的传统译法置于脚注。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“使自己洁白”保留原文的具体意象；“受熬炼”保留炼金属的比喻；以“却”和“惟”凸显恶人与有洞见者的对照。
