base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/016.yaml
  text: When she came to her mother-in-law[a], she said, “Who are you, my daughter?” Then she told her all that the man had done for her.
translation:
  language: zh_hans
  text: 她回到婆婆那里[a]，婆婆问：“我女儿，你是谁？”于是，她把那人为她所做的一切都告诉了婆婆。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或意译：“我女儿，事情怎么样？”希伯来文直译是“我女儿，你是谁？”这句话可能是在询问路得的身份是否有了改变，或她与波阿斯见面的结果。
    reason: alternative_reading
lexical_decisions:
- source_word: וַתָּבוֹא
  choice: 她回到
  rationale: 该叙事性动词推进事件次序；结合上下文，路得是从禾场回到拿俄米那里，因此译作“回到”自然准确。
- source_word: אֶל חֲמוֹתָהּ
  choice: 婆婆那里
  rationale: חֲמוֹת专指丈夫的母亲；现代汉语以“婆婆”最自然，处所成分用“那里”补足汉语表达。
- source_word: וַתֹּאמֶר
  choice: 婆婆问
  rationale: 原文直译为“她说”，但其后是疑问句；明确主语为婆婆，并以“问”自然呈现言语功能，同时不改变内容。
- source_word: מִי אַתְּ
  choice: 你是谁
  rationale: 保留希伯来文直义及其不寻常之处，不在正文中擅自解释为“事情怎么样”；其可能涉及路得身份或处境是否改变的含意置于脚注。
- source_word: בִּתִּי
  choice: 我女儿
  rationale: 保留亲属式称呼和拿俄米对路得的亲昵语气；“我女儿”庄重而易懂。
- source_word: וַתַּגֶּד לָהּ
  choice: 于是，她……都告诉了婆婆
  rationale: Hifil词形在此表示告知、述说；“于是”衔接叙事顺序，末尾明确受事者可避免连续女性代词造成歧义。
- source_word: אֵת כָּל אֲשֶׁר
  choice: 所做的一切
  rationale: 自然对应“所有……的事”，完整表达报告内容的总体性。
- source_word: עָשָׂה לָהּ הָאִישׁ
  choice: 那人给她所做的
  rationale: לָהּ在此宜表达有利于她、为她而做之意，故用“给她”；“那人”保留原文此处不直呼波阿斯名字的表达。
theological_decisions:
- issue: 拿俄米所问“你是谁”的含意
  choice: 正文保留直译“你是谁”
  alternative: “我女儿，事情怎么样？”或“我女儿，你现在是什么身份？”
  rationale: 原文措辞确为身份性疑问，却可能在语境中询问会面结果或路得身份是否已有改变。正文不消除这种叙事和神学张力，脚注提供解释性读法。
translation_notes:
  register: 采用现代、庄重而通顺的叙事语言。“婆婆”符合现代标准汉语亲属称谓；为避免“她对她说”等代词含混，适度重复“婆婆”。正文保留“你是谁”的原文异样感，并以脚注说明语境含意。
