base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/012.yaml
  text: And now[a], it is true that I am a redeemer[b], yet there is also a redeemer closer than I.
translation:
  language: zh_hans
  text: 如今，我确实是有赎回责任的亲属[a]；不过，还有一位比我更近、也有赎回责任的亲属[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“家族赎回人”或“负有保护和赎回责任的近亲”。希伯来语指在家族制度中享有并承担特定赎回权责的近亲。
    reason: lexical_alternative
  - marker: b
    text: 这里的“更近”是指亲属关系更近，因而在家族赎回事务上具有优先的赎回资格或责任，并非只是空间上离得更近。
    reason: cultural_note
lexical_decisions:
- source_word: וְעַתָּה
  choice: 现在
  rationale: 既可承接波阿斯前面的话，也自然引出他接下来要说明的现实情况；汉语不必机械译出连接词 וְ。
- source_word: כִּי אָמְנָם כִּי אִם
  choice: 确实是
  rationale: 这一组合在此表示确认或让步：波阿斯承认自己确有相应的亲属身份和责任。译作“确实是”简洁自然，又不额外加强语气。
- source_word: גֹאֵל
  choice: 有赎回责任的亲属
  rationale: גֹאֵל 指在以色列亲属制度中享有并承担家族赎回权责的近亲。此译法保留“赎回”的词义核心，同时向现代读者交代其亲属身份；两次出现均予以译出。
- source_word: אָנֹכִי
  choice: 我
  rationale: 独立人称代词带有明确或强调作用；配合“确实是”即可在现代汉语中自然体现。
- source_word: וְגַם יֵשׁ
  choice: 不过，还有一位
  rationale: וְגַם 既有附加义，也在语境中对前一句形成限制。“不过，还有”同时体现转折性的限定和“也有”的附加意义。
- source_word: קָרוֹב מִמֶּנִּי
  choice: 关系比我更近
  rationale: 这里的“近”主要指亲属关系和相应赎回次序更近，并非空间距离；加入“关系”可避免现代汉语读者误解，同时保留比较表达。
theological_decisions:
- issue: 如何表达 גֹאֵל 的家族法律角色
  choice: 有赎回责任的亲属
  alternative: 救赎者／至近亲属／赎业至亲
  rationale: 本节谈的是以色列家族制度中的亲属赎回权责，而非抽象或专指属灵意义的救赎。“有赎回责任的亲属”兼顾词义、语境和可懂度，不把该角色缩窄为仅赎买土地，也不引入特定宗派解释。
- issue: “更近”的所指
  choice: 关系比我更近
  alternative: 比我更近
  rationale: 语境所说的是亲属关系及由此而来的优先权。主文加“关系”是最低限度的明示，可防止误读为空间距离；脚注进一步说明其文化法律含义。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“有赎回责任的亲属”虽比单一名词稍长，却能让普通读者直接理解古代制度角色；分号和“不过”清楚呈现先确认、后限定的语篇推进。
