  yaml_path: translation/ot/ruth/003/008.yaml
  text: And it happened at midnight that the man trembled and turned himself[a], and behold[b], a woman was lying at his feet.
translation:
  language: zh_hans
  text: 到了半夜，那人猛然一惊，转过身来；不料，有个女人正躺在他脚边[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: “脚边”所译的希伯来语直译为“在他的脚（边）”，也可能泛指他的脚部或小腿附近的位置。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: 到了
  rationale: 承接希伯来叙事进程，并与时间短语自然结合；中文无需机械译出“事情发生了”。
- source_word: בַּחֲצִי הַלַּיְלָה
  choice: 半夜
  rationale: 准确表达“夜晚中间”的时间含义，现代汉语自然简洁。
- source_word: וַיֶּחֱרַד
  choice: 猛然一惊
  rationale: חרד可表示因恐惧、震惊或突然受扰而战栗；此译保留突发的身体与心理反应，又不限定其具体原因。
- source_word: הָאִישׁ
  choice: 那人
  rationale: 在上下文中指波阿斯；“那人”既对应定冠词，也避免把专名补入本节。
- source_word: וַיִּלָּפֵת
  choice: 翻转身体
  rationale: 该动词罕见，所指动作不确定；此译谨慎表达他受惊后的身体转动，不武断限定为弯腰、扭身或伸手。
- source_word: וְהִנֵּה
  choice: 不料
  rationale: 传达 הִנֵּה 所标示的突然发现和意外感，比直译“看哪”更符合现代叙事汉语。
- source_word: אִשָּׁה
  choice: 有个女人
  rationale: 此处指一名女子，并非“妻子”；“有个”配合突然发现的叙事视角。
- source_word: שֹׁכֶבֶת
  choice: 躺在
  rationale: 分词描写被发现时持续的姿态，中文“躺在”自然呈现这一状态。
- source_word: מַרְגְּלֹתָיו
  choice: 他脚边
  rationale: 该词可指双脚，也可泛指脚或小腿所在的位置；“脚边”自然、准确，并避免加入原文未明说的性意味。
theological_decisions:
- issue: 场景是否含有性行为或委婉暗示
  choice: 正文直接译为女人躺在波阿斯脚边，不明说发生了性行为。
  alternative: 将位置译得更含混或带委婉意味，如“在他下身旁”。
  rationale: 希伯来文本没有明确陈述性行为。译文应保留叙事张力，却不把可能的暗示升级为事实或道德判断。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“猛然一惊”呈现突发反应；“不料”保留突然发现的语用力量。脚注说明两个主要词义不确定处，不在正文中消除原文的含混。
