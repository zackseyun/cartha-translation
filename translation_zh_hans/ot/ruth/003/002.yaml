base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/002.yaml
  text: And now[a], is not Boaz our relative, with whose young women you have been? Look[b], he is winnowing barley at the threshing floor tonight.
translation:
  language: zh_hans
  text: 现在，波阿斯不是我们的亲属[a]吗？你先前和他的女工们[b]在一起。看哪，今晚他正在禾场扬大麦。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “亲属”也可译作“族亲”。这个词本义可指相识的人；但在这里指有亲属或宗族关系的人，并不只是一般的熟人。
    reason: lexical_alternative
  - marker: b
    text: “女工们”也可译作“年轻女子”或“女仆”。这里指波阿斯手下从事劳作或服侍的女子。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: 现在
  rationale: 在此作为话语标记，引出拿俄米接下来要说的安排；现代汉语用“现在”即可自然承接上下文。
- source_word: הֲלֹא
  choice: 不是……吗
  rationale: 保留期待对方认同的反问语气。
- source_word: מֹדַעְתָּנוּ
  choice: 我们的亲属
  rationale: 该词可指因亲族或宗族关系而相识的人；本段语境重在波阿斯与拿俄米家的亲族联系。“亲属”比“熟人”更贴合语境，同时以脚注保留词义范围。
- source_word: אֲשֶׁר הָיִית אֶת נַעֲרוֹתָיו
  choice: 你一直跟他的女工在一起
  rationale: 指路得先前随波阿斯手下的年轻女子一同拾穗。“女工”在现代汉语中自然表达其工作身份，又不把她们严格限定为奴婢。
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留提示听者注意眼前情况的语用力量；“看哪”庄重而仍易懂。
- source_word: זֹרֶה
  choice: 正在……扬
  rationale: 分词表示当时或即将进行的动作；“扬”是借风除去谷壳糠秕的传统农事用语。
- source_word: אֶת גֹּרֶן הַשְּׂעֹרִים
  choice: 在禾场扬大麦
  rationale: 希伯来语字面以“禾场”为受词，可理解为转喻禾场上的大麦；汉语若说“扬禾场”会误指禾场本身，因此按所指自然译为“在禾场扬大麦”。
- source_word: הַלָּיְלָה
  choice: 今晚
  rationale: 自然表达该时间状语，指说话当夜。
theological_decisions: []
