id: RUT.3.13
reference: Ruth 3:13
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: לִ֣ינִי הַ/לַּ֗יְלָה וְ/הָיָ֤ה בַ/בֹּ֨קֶר֙ אִם יִגְאָלֵ֥/ךְ טוֹב֙ יִגְאָ֔ל וְ/אִם לֹ֨א יַחְפֹּ֧ץ לְ/גָֽאֳלֵ֛/ךְ וּ/גְאַלְתִּ֥י/ךְ אָנֹ֖כִי חַי יְהוָ֑ה שִׁכְבִ֖י עַד הַ/בֹּֽקֶר׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/013.yaml
  text: Stay here tonight[a], and in the morning, if he will redeem you, good—let him redeem you. But if he does not desire to redeem you, then I myself will redeem you, as Yahweh lives. Lie down until the morning.
translation:
  language: zh_hans
  text: 你今晚就留在这里。到了早晨，如果他肯赎你[a]，好，就让他赎你；如果他不愿意赎你，我必亲自赎你。我凭永活的耶和华起誓！你躺下，直到早晨吧。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的“赎”是家族法律用语，指有资格的近亲为亲属承担赎回产业、维护家族延续等责任；这种人常称为“至亲救赎者”。
    reason: 说明גאל在路得记中的家族法律含义，同时避免在正文中过度展开或把其责任范围限定得过窄。
lexical_decisions:
- source_word: לִינִי הַלַּיְלָה
  choice: 你今晚就留在这里
  rationale: לון指留宿、过夜；结合上下文译为“今晚就留在这里”，既自然，也不加入原文没有明说的含义。
- source_word: וְהָיָה בַבֹּקֶר
  choice: 到了早晨
  rationale: 这是引出次日安排的时间句。“到了早晨”保留叙事顺序，符合现代汉语表达。
- source_word: אִם יִגְאָלֵךְ
  choice: 如果他肯赎你
  rationale: גאל在本书中涉及至亲所承担的家族法律责任。“赎”保留全书的关键词及其救赎意涵；“肯”体现条件句中的意愿因素，具体制度含义由脚注说明。
- source_word: טוֹב יִגְאָל
  choice: 好，就让他赎你
  rationale: טוֹב在这里是简短的认可语，后面的未完成式在语境中带有准许意味；此译保留原文简洁而略带省略的表达。
- source_word: לֹא יַחְפֹּץ לְגָאֳלֵךְ
  choice: 他不愿意赎你
  rationale: חפץ表达愿望或意愿。“不愿意”在现代汉语中自然，并准确呈现其意志层面的含义。
- source_word: וּגְאַלְתִּיךְ אָנֹכִי
  choice: 我必亲自赎你
  rationale: 独立人称代词אָנֹכִי加强主语语气，故用“亲自”；“必”表现波阿斯以誓言作出的坚定承诺。
- source_word: חַי יְהוָה
  choice: 我指着永活的耶和华起誓
  rationale: 这是希伯来语的标准起誓公式。汉语中把隐含的起誓行为明说出来，能自然传达其语用功能；“永活的耶和华”保留原公式对上帝生命的宣告。
- source_word: שִׁכְבִי עַד הַבֹּקֶר
  choice: 你躺到早晨吧
  rationale: שכב意为躺下或躺卧。“躺到早晨”直接保留动作与时间界限，不额外增添地点信息。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文圣经语境中广为人知的神名音译“耶和华”，将其作为专名呈现，而不以“主”这一称号代替。
theological_decisions:
- issue: 路得记家族法律语境中גאל的译法
  choice: 正文保留“赎”这一核心用语，并以脚注说明至亲责任
  alternative: 替他尽至亲救赎者的责任／履行至亲的本分
  rationale: 直接扩写会把制度解释并入正文，并可能过早限定本节所含的财产、家族延续与婚姻等多重背景；保留“赎”可维持全书的词汇联系和神学张力，脚注则帮助现代读者理解其家族法律语境。
- issue: חַי יְהוָה这一誓言公式
  choice: 我指着永活的耶和华起誓
  alternative: 耶和华永活
  rationale: 直译“耶和华永活”虽保留形式，却不易让普通汉语读者立刻识别为誓言。正文明确其起誓功能，同时保留“永活”的原始意象。
- issue: 神名יהוה的呈现
  choice: 耶和华
  alternative: 雅威／主
  rationale: 使用专名而非称号，保留原文直接使用神圣四字名的特点；“耶和华”也是普通中文读者最熟悉的专名形式。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“好，就让他赎你”有意保留希伯来原文简短、略带省略的认可语气；两个命令句分别译作“留在这里”和“躺到早晨吧”，语气坚定但不生硬。
