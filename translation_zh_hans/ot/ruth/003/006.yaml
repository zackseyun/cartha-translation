  yaml_path: translation/ot/ruth/003/006.yaml
  text: So she went down to the threshing floor and did according to all that her mother-in-law had commanded her[a].
translation:
  language: zh_hans
  text: 于是，她下到打谷场，照着婆婆所吩咐她的一切去做。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“随后，她下到打谷场，完全照婆婆所指示她的一切去做。”
    reason: 词义与表达方式的另一种译法；“指示”较“吩咐”柔和，“完全照……一切去做”突出 כֹל 所表达的全面遵从。
lexical_decisions:
- source_word: וַתֵּרֶד
  choice: 于是，她下到
  rationale: 动词 ירד 表示向下移动；“下到”保留方向感，并与目的地“打谷场”自然衔接。句首 וַ 作为叙事连接词译为“于是”，承接前文并推进情节。
- source_word: הַגֹּרֶן
  choice: 打谷场
  rationale: גֹּרֶן 指处理谷物的打谷场；现代汉语通常无需另行表达希伯来语定冠词。
- source_word: וַתַּעַשׂ
  choice: 去做
  rationale: עשה 是宽泛的“做、行”；在“照着……一切”的结构中，“去做”自然表达实际执行吩咐。
- source_word: כְּכֹל אֲשֶׁר
  choice: 照着……的一切
  rationale: 该结构表示完全遵照先前所说的内容；此译法保留 כֹל 的全面性，同时符合现代汉语表达。
- source_word: צִוַּתָּה
  choice: 吩咐
  rationale: צוה 可表示命令或吩咐。此处是婆婆对路得的指示，“吩咐”既保留其权威性，也比“命令”更符合家庭关系和叙事情境。
- source_word: חֲמוֹתָהּ
  choice: 婆婆
  rationale: חֲמוֹת 指女子的丈夫之母；在本语境中明确是路得的婆婆拿俄米。“婆婆”比泛称“岳母/婆母”更自然准确。
