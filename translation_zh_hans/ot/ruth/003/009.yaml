base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/009.yaml
  text: He said[a], “Who are you?” And she said, “I am Ruth, your servant. Spread your wing over your servant[b], for you are a redeemer.”
translation:
  language: zh_hans
  text: 他问：“你是谁？”她回答：“我是你的婢女路得。请把你的翅膀[a]展开在你的婢女身上，因为你是至亲救赎者[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “翅膀”也可译作“衣襟”。希伯来词既可指翅膀，也可指衣服的边角；这里的措辞可能有意兼含寻求保护和提出婚姻请求两层意思。
    reason: lexical_alternative
  - marker: b
    text: “至亲救赎者”指负有公认责任、为亲属采取行动的家族近亲。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי אָתּ
  choice: 你是谁？
  rationale: 直接保留希伯来文的身份询问，符合自然的现代汉语对话。
- source_word: אָנֹכִי רוּת
  choice: 我是你的婢女路得
  rationale: 将无系词的身份陈述自然译出；结合下文的自称，使中文语序流畅。
- source_word: אֲמָתֶךָ / אֲמָתְךָ
  choice: 你的婢女
  rationale: אמה 指女性仆役；“婢女”既保留性别和谦卑自称，也比“女奴”更符合本段礼貌请求的语境。两处用词保持一致。
- source_word: וּפָרַשְׂתָּ
  choice: 请你展开
  rationale: פרשׂ 表示伸展、铺开；加入“请”自然表达希伯来祈使形式在此请求语境中的语用力量。
- source_word: כְנָפֶךָ
  choice: 你的翅膀
  rationale: כנף 可指翅膀，也可指衣服的边角。正文保留“翅膀”的具体意象，脚注说明衣襟之义，以保存保护与婚姻请求之间可能有意形成的双重意味。
- source_word: עַל
  choice: 遮盖
  rationale: 介词本义为“在……上”；与“展开翅膀”组合时，译为“遮盖”可在现代汉语中清楚呈现覆盖关系，而不消解该意象。
- source_word: כִּי
  choice: 因为
  rationale: 明确引出路得提出请求的理由，符合现代汉语因果表达。
- source_word: גֹאֵל
  choice: 至亲救赎者
  rationale: גֹאֵל 在本书中指按亲属责任为家族成员施行赎回的人。“至亲救赎者”同时保留亲属身份与“救赎”这一关键词；脚注进一步说明其制度背景。
theological_decisions:
- issue: “你的翅膀”的隐喻与衣襟含义
  choice: 正文保留“翅膀”，脚注注明也可指衣襟。
  alternative: 把正文译为“请用你的衣襟遮盖你的婢女”。
  rationale: 希伯来词 כנף 兼有“翅膀”和“衣服边角”之义，此处可能有意同时唤起保护意象和婚姻请求。正文采用“翅膀”可与路得记2:12的荫庇意象相呼应，同时不在正文中单方面确定为衣襟。
- issue: גֹאֵל 的家族法律角色
  choice: 译作“至亲救赎者”，并在脚注解释。
  alternative: 译作“救赎者”或“赎业至亲”。
  rationale: 单译“救赎者”在现代中文中容易只被理解为一般或神学意义上的拯救者；“至亲救赎者”较清楚地保留本书所涉及的亲属责任，又不把其具体义务狭窄限定为某一项。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。对话简洁；“婢女”保留路得谦卑而带性别标记的自称。“翅膀”保留原文文学意象，“至亲救赎者”则使本书特有的亲属法律背景对普通读者较为清楚。
