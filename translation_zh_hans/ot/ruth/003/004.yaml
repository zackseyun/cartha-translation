base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/004.yaml
  text: Then[a], when he lies down, note the place where he lies. Then go, uncover his feet, and lie down[b], and he will tell you what you should do.
translation:
  language: zh_hans
  text: 等他躺下后，你要看清他躺在哪里；然后过去，揭开他脚边的遮盖[a]，躺下[b]。他会告诉你该怎么做。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语直译作“他的脚”；也可能指脚周围或身体下端一带。因此，“揭开”可能是指揭开他脚部一带的遮盖。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语书写形式作“我躺下”，但传统读法和上下文理解为“你躺下”。
    reason: textual_variant
lexical_decisions:
- source_word: וִיהִי בְשָׁכְבוֹ
  choice: 等他躺下时
  rationale: וִיהִי在这里承接指示的步骤，ב加不定式结构表示时间；合译为自然的时序表达。
- source_word: וְיָדַעַתְּ אֶת־הַמָּקוֹם
  choice: 你要看清……在哪里
  rationale: ידע本义为“知道”，此处指留意并辨明波阿斯躺卧的位置；“看清”符合具体情境，又不过度扩充。
- source_word: אֲשֶׁר יִשְׁכַּב שָׁם
  choice: 他躺在哪里
  rationale: 关系从句用于确定躺卧地点；汉语无需重复译出שָׁם“那里”。
- source_word: וּבָאת
  choice: 然后过去
  rationale: בוא可依叙事视角译作“来”或“去”；拿俄米吩咐路得前往波阿斯所在之处，译作“过去”自然，并保留动作次序。
- source_word: וְגִלִּית מַרְגְּלֹתָיו
  choice: 掀开他脚边的盖物
  rationale: גלה表示揭开；מַרְגְּלוֹתָיו指脚或脚周围、下端的位置。语境中需有可被掀开的覆盖物，故用“脚边的盖物”，同时用脚注保留词义范围。
- source_word: וְשָׁכָבְתִּי / וְשָׁכַבְתְּ
  choice: 躺下
  rationale: 书写形式为第一人称“我躺下”，传统读法及上下文则为第二人称阴性单数“你躺下”；正文按语境中的指令对象路得翻译，文本差异见脚注。
- source_word: וְהוּא יַגִּיד לָךְ
  choice: 他会告诉你
  rationale: נגד的使役形通常表示“告诉、说明”；显明主语“他”，保留原文轻微的强调。
- source_word: אֵת אֲשֶׁר תַּעַשִׂין
  choice: 该怎么做
  rationale: 该从句在这里含有指示意味；“该怎么做”是自然、准确的现代汉语表达。
theological_decisions:
- issue: 掀开波阿斯脚边并躺下这一指示可能具有性暗示
  choice: 正文保留具体动作及其叙事含混性，不明说是性行为，也不将其解释成完全无暧昧的实用举动。
  alternative: 将该动作明确解释为性接近，或明确解释为仅为唤醒波阿斯。
  rationale: 希伯来语叙述本身带有张力和含混性；翻译不应代替文本作出定论。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“看清”“过去”“该怎么做”自然口语化但不随便；“盖物”避免擅自指定毯子、衣襟等原文未明说的物件。
