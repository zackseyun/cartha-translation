  text: וַ/יֹּ֗אמֶר בְּרוּכָ֨ה אַ֤תְּ לַֽ/יהוָה֙ בִּתִּ֔/י הֵיטַ֛בְתְּ חַסְדֵּ֥/ךְ הָ/אַחֲר֖וֹן מִן הָ/רִאשׁ֑וֹן לְ/בִלְתִּי לֶ֗כֶת אַחֲרֵי֙ הַ/בַּ֣חוּרִ֔ים אִם דַּ֖ל וְ/אִם עָשִֽׁיר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/010.yaml
  text: And he said[a], “May you be blessed by Yahweh, my daughter. You have made this last kindness greater than the first by not going after the young men, whether poor or rich.”
translation:
  language: zh_hans
  text: 他说：“我女儿，愿雅威赐福给你！你后来的慈爱[a]胜过先前的，因为你没有追求年轻男子，不论贫穷或富有。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “慈爱”也可译作“忠爱”“忠诚的爱”或“恩慈”。希伯来语חֶסֶד在这里兼有忠诚与仁爱的意味。
    reason: 说明חֶסֶד的丰富词义，并保留原文在忠诚、恩慈和关系责任之间的语义张力。
lexical_decisions:
- source_word: בְּרוּכָה אַתְּ לַיהוָה
  choice: 愿雅威赐福给你
  rationale: 这是带有祝福语气的表述；用“愿……赐福给你”自然传达希伯来语的祝愿意味，并将神名 יְהוָה 音译为“雅威”。
- source_word: בִּתִּי
  choice: 我女儿
  rationale: 保留波阿斯以年长者身份对路得所用的亲切称呼，也体现年龄和社会关系上的差异。
- source_word: הֵיטַבְתְּ חַסְדֵּךְ הָאַחֲרוֹן מִן הָרִאשׁוֹן
  choice: 你这后来的慈爱比先前的更大
  rationale: 表达希伯来语的比较结构，将路得眼下的忠诚行动与她先前所行的相比较；“更大”比生硬的“更好”更适合修饰“慈爱”。
- source_word: חַסְדֵּךְ
  choice: 你的慈爱
  rationale: חֶסֶד 在此指以忠诚和恩慈落实于行动的关爱。“慈爱”保留其深厚的关系性含义；脚注列出“忠爱”等可行理解。
- source_word: לְבִלְתִּי לֶכֶת אַחֲרֵי
  choice: 因为你没有追求
  rationale: 该不定式结构说明后来的慈爱何以更大；在婚姻语境中，“追求”自然传达“跟随、寻求作为婚配对象”的意思。
- source_word: הַבַּחוּרִים
  choice: 年轻男子
  rationale: 指路得本可选择的适婚年轻男性；译文保持原文所强调的年轻身份，而不额外明确他们必定比波阿斯年轻。
- source_word: אִם דַּל וְאִם עָשִׁיר
  choice: 无论贫穷还是富有
  rationale: 直接呈现涵盖各种经济状况的两极表达。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以常见的现代汉语音译呈现四字神名，保留其作为以色列之神专名的性质，而不以称号替代。
theological_decisions:
- issue: 叙事称许中 חֶסֶד 的译法
  choice: 慈爱
  alternative: 忠爱、忠诚的爱、恩慈
  rationale: 本节称许路得为拿俄米家族所采取的忠诚行动，而不是追求浪漫或经济利益。“慈爱”在现代中文圣经语体中自然、庄重，并保留恩慈与忠诚相结合的意味；脚注承认其他词义可能。
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华、上主
  rationale: 原文直接使用四字神名。音译“雅威”保留专名性质，不以称号替代。
- issue: “后来的慈爱”具体所指
  choice: 保持概括，不在正文中明确解释
  alternative: 明确解释为路得寻求家族救赎或对拿俄米的忠诚
  rationale: 原文只比较“后来”与“先前”的 חֶסֶד，并未在本节中明说各自具体所指；正文保留这种叙事含蓄，避免把解释写进译文。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“我女儿”保留人物关系中的亲切和长幼语气；“追求年轻男子”按婚配语境自然表达，却不增添原文未明说的动机。
