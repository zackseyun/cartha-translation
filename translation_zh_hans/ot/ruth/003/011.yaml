base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/011.yaml
  text: And now[a], my daughter, do not fear. All that you say, I will do for you[b], for all the gate of my people knows that you are a woman of noble character.
translation:
  language: zh_hans
  text: 现在，我女儿啊，不要害怕。凡你所说的，我都必照着办，因为我民中人人都知道你是个有才德的女子[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“我民的整个城门”。“城门”是城中公众聚集、处理事务并进行司法裁决的地方；这里借指我民中公开知情并认可此事的群体。
    reason: cultural_note
lexical_decisions:
- source_word: בִּתִּי
  choice: 我女儿
  rationale: 保留原文的亲切称呼；这里表达波阿斯温和、保护性的态度，并不表示路得是他的亲生女儿。
- source_word: אַל תִּירְאִי
  choice: 不要怕
  rationale: 准确表达否定词加未完成式在此所构成的劝慰或禁止，中文简洁自然。
- source_word: כֹּל אֲשֶׁר תֹּאמְרִי אֶעֱשֶׂה לָּךְ
  choice: 凡你所说的，我都必为你做
  rationale: 保留“说”这一动词及原句宽泛直接的语气，不将其收窄为“所求的”；“必”体现说话者明确的承诺。
- source_word: כָּל שַׁעַר עַמִּי
  choice: 我本城的人全都
  rationale: “城门”在此借代城中的公共群体。主文采用自然的现代汉语表达其指称，脚注保留城门作为公共生活与司法场所的文化背景。
- source_word: אֵשֶׁת חַיִל
  choice: 有才德的女子
  rationale: חַיִל的语义包括能力、力量、价值和卓越品格。“有才德”兼顾能力与德行，也保留本短语与《箴言》31章的词语呼应；“女子”符合路得在本节中的称谓。
theological_decisions:
- issue: אֵשֶׁת חַיִל所称许的范围
  choice: 有才德的女子
  alternative: 贤德的女子；杰出的女子；刚强有为的女子
  rationale: 原词不只指道德端正，也包含能力、力量和受人认可的价值。“有才德”避免把称许局限于单一的道德或家庭角色，同时不在此语境中过度采用军事色彩。
- issue: “城门”的借代意义
  choice: 我本城的人全都
  alternative: 我城门口的众人都；我民的整个城门都
  rationale: 原文以“城门”借代在公共场合形成并表达共同认知的城中群体。译文传达其实际所指，脚注说明原有意象，避免把范围误解为当时恰好站在城门口的人。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“我女儿”保留古代叙事中的亲切称呼；“凡你所说的”略具正式感，但自然清楚。“有才德”既延续圣经用语的互文联系，也可为当代读者理解。
