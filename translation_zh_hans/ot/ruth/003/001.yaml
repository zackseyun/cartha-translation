base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/001.yaml
  text: Then Naomi her mother-in-law said to her[a], “My daughter, should I not seek a resting place for you, that it may go well with you?”
translation:
  language: zh_hans
  text: 后来，路得的婆婆拿俄米对她说：“女儿啊，我不是应当为你寻个安身之处[a]，使你过得好吗？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“安歇之所”“安稳”或“归宿”。按上下文，拿俄米是在为路得谋求安定幸福的生活，很可能要借着婚姻实现；但希伯来原文只说“安息／安歇之处”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: 后来……说
  rationale: 叙事性连续式推进情节；“后来”自然表达事件次序，又不把连接关系说得过强。
- source_word: נָעֳמִי
  choice: 拿俄米
  rationale: 采用现代中文圣经读者熟悉的人名音译。
- source_word: חֲמוֹתָהּ
  choice: 路得的婆婆
  rationale: 原文为“她的婆婆”；中文明确说“路得的婆婆”，可避免代词连续造成指代含混，同时准确保留亲属关系。
- source_word: בִּתִּי
  choice: 女儿啊
  rationale: 保留亲昵的称呼和呼格语气，不额外添加“亲爱的”等原文未明说的感情色彩。
- source_word: הֲלֹא
  choice: 我不是应当……吗
  rationale: 保留预期肯定回答的反问语气，且符合现代汉语表达。
- source_word: אֲבַקֶּשׁ
  choice: 寻
  rationale: 表达主动寻找、谋求之意，同时不提前限定拿俄米将采取的具体行动。
- source_word: מָנוֹחַ
  choice: 安身之处
  rationale: 兼顾“安息”与安定居所的含义，也与本段婚姻所带来的安稳生活相契合，但不直接把“丈夫”写入正文。
- source_word: אֲשֶׁר יִיטַב לָךְ
  choice: 使你得享福祉
  rationale: 表达所寻安身之处将使路得过得好、蒙受益处；“福祉”庄重而能涵盖整体生活安好。
theological_decisions:
- issue: מָנוֹחַ是否在正文中明确译作婚姻或丈夫
  choice: 保留为“安身之处”，并用脚注交代语境
  alternative: 译作“归宿”“丈夫”或“婚姻归宿”
  rationale: 上下文很可能指借婚姻获得安稳，但希伯来文只明说“安息／安身之处”。正文不把语境推论替代原文措辞，可保留意象及其解释张力。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“女儿啊”体现长辈亲昵的称呼；“安身之处”保留原文比喻，并以脚注说明“安稳、归宿”及婚姻语境。
