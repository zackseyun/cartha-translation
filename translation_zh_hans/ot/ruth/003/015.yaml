base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/015.yaml
  text: Then he said[a], “Bring the cloak that is on you and hold it out.” So she held it out, and he measured six measures of barley and put it on her[b]. Then he went into the city.
translation:
  language: zh_hans
  text: 他又说：“把你身上的披巾拿过来，抓紧它。”她就抓紧披巾。他量了六份大麦[a]，放在她身上。随后，他进城去了。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“六大麦”；原文没有说明计量单位，因此正文译作“六份大麦”。
    reason: lexical_alternative
  - marker: b
    text: 一些古代译本和许多译本作“随后，她进城去了”。马所拉文本作“随后，他进城去了”。
    reason: textual_variant
lexical_decisions:
- source_word: הָבִי
  choice: 拿过来
  rationale: 这是对女性单数说的命令，意思是把某物递来或拿来；结合后面的动作，“拿过来”符合现代汉语表达。
- source_word: הַמִּטְפַּחַת
  choice: 外衣
  rationale: 此词指披在身上的衣物或裹布，并在这里用来承装大麦。“外衣”自然易懂，也避免“面纱”在现代汉语中可能造成的误解。
- source_word: וְאֶחֳזִי בָהּ
  choice: 兜住它
  rationale: 动词本义是抓住、拿住；上下文表明路得要提住外衣以承接大麦。“兜住”简洁地表达了这一动作和用途。
- source_word: וַיָּמָד
  choice: 量了
  rationale: 保留动词“量”的基本含义，体现有意量取并分给大麦的动作。
- source_word: שֵׁשׁ שְׂעֹרִים
  choice: 六份大麦
  rationale: 希伯来文直说“六大麦”，没有注明计量单位。“六份”是为现代汉语清晰度所作的最低限度补足，不擅自指定为细亚等具体单位。
- source_word: וַיָּשֶׁת עָלֶיהָ
  choice: 放在她身上
  rationale: 原文的单数宾语可统指量好的大麦；此译保留把这袋状粮食安放到她身上以便携带的具体动作。
- source_word: וַיָּבֹא הָעִיר
  choice: 他进城去了
  rationale: 马所拉文本的动词为阳性单数，因此正文以“他”为主语；其他古代版本所反映的“她”保留在脚注中。
theological_decisions:
- issue: 末句 וַיָּבֹא הָעִיר 的主语
  choice: 他进城去了
  alternative: 她进城去了
  rationale: 这主要是文本和叙事解释问题，而非教义判断。所给WLC马所拉文本使用阳性单数动词，正文据此译作“他”；鉴于部分古代译本及许多现代译本采用“她”，脚注如实列出异文。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“兜住”贴合实际动作；“六份”避免虚构具体计量单位。正文依马所拉文本保留末句阳性主语，并以脚注呈现重要异文。
