  text: And she said to her[a], “All that you say, I will do.”
translation:
  language: zh_hans
  text: 她对她说：“你所说的一切，我都会照办。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: 她……说
  rationale: 该叙事形式推进情节；中文以“她说”自然表达即可，不必机械译出连接词。
- source_word: אֵלֶיהָ
  choice: 对她
  rationale: 介词加第三人称阴性单数后缀表示说话所指向的对象；“对她”准确而自然。
- source_word: כֹּל אֲשֶׁר
  choice: 所说的一切
  rationale: 保留“全部”与关系从句的结构，明确表达路得愿意遵从拿俄米全部吩咐的意思。
- source_word: תֹּאמְרִי
  choice: 你所说的
  rationale: 第二人称阴性单数未完成式在此指对方给出的吩咐；译文不添加原文没有明说的宾语“我”。
- source_word: אֶעֱשֶׂה
  choice: 我都会照办
  rationale: 第一人称单数未完成式表达意愿与决心。“照办”在现代汉语中自然承接前面的吩咐，也体现“去做”的语义。
