  text: וַ/תֹּ֨אמֶר֙ שְׁבִ֣י בִתִּ֔/י עַ֚ד אֲשֶׁ֣ר תֵּֽדְעִ֔י/ן אֵ֖יךְ יִפֹּ֣ל דָּבָ֑ר כִּ֣י לֹ֤א יִשְׁקֹט֙ הָ/אִ֔ישׁ כִּֽי אִם כִּלָּ֥ה הַ/דָּבָ֖ר הַ/יּֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/018.yaml
  text: Then she said[a], “Wait, my daughter, until you learn how the matter will fall out[b], for the man will not rest unless he has settled the matter today.”
translation:
  language: zh_hans
  text: 她说：“我女儿，你先等着，直到知道这事会怎样发展，因为那人今天不把这事办完，就不会停下来。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׁבִי
  choice: 你先等着
  rationale: 该命令字面可指“坐下、留下”，在此语境中是嘱咐路得留在原处等候结果；“先等着”自然传达其语用含义。
- source_word: בִתִּי
  choice: 我女儿
  rationale: 保留原文明确的所有格和拿俄米亲切的家庭称呼。
- source_word: עַד אֲשֶׁר תֵּדְעִין
  choice: 直到知道
  rationale: ידע在此指将来获知结果；汉语“直到知道”简洁保留这一前瞻意义。
- source_word: אֵיךְ יִפֹּל דָּבָר
  choice: 这事会怎样发展
  rationale: 原文直译为“事情会怎样落定”；“会怎样发展”是自然现代汉语，同时保留事情结果尚未明朗的意味。
- source_word: הָאִישׁ
  choice: 那人
  rationale: 原文使用定指的“那人”，语境所指是波阿斯，但本节没有直呼其名，因此译文也不补出名字。
- source_word: לֹא יִשְׁקֹט
  choice: 不会停下来
  rationale: שׁקט本义涉及安静、静止；这里表示他在事情办妥以前不会停止行动。
- source_word: כִּי אִם כִּלָּה הַדָּבָר
  choice: 不把这事办完，就
  rationale: כִּי אִם表达排除性条件，כִּלָּה表示完成；用“不……就……”自然呈现他必定完成此事才会停下的意思。
- source_word: הַיּוֹם
  choice: 今天
  rationale: 直接保留原文的时间限定。
