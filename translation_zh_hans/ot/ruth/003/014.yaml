base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/014.yaml
  text: So she lay at his feet until morning[a], and she got up before one man could recognize another. And he said[b], “Do not let it be known that the woman came to the threshing floor.”
translation:
  language: zh_hans
  text: 她就在他脚边躺到早晨，趁人还不能彼此辨认时[a]就起来了。他说[b]：“不要让人知道有女人到过禾场。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“在一人能认出他的同伴以前。”意思是天色还很昏暗，人们尚不能彼此看清。
    reason: lexical_alternative
  - marker: b
    text: 从上下文看，说话者很可能是波阿斯，但希伯来文只说“他说”。
    reason: alternative_reading
lexical_decisions:
- source_word: מרגלתיו
  choice: 在他脚边
  rationale: 该词指脚或腿所在之处，即波阿斯躺卧处的脚端；“在他脚边”自然、准确，又不额外限定床铺或姿势。
- source_word: בטרום יכיר איש את רעהו
  choice: 趁人还不能彼此辨认时
  rationale: 这一时间表达直译为“在人认出同伴以前”，所指是晨光微弱、人与人尚难相认的时候；译文保留“辨认”的核心含义，并以自然汉语表达其时间关系。
- source_word: אל יוודע
  choice: 不要让人知道
  rationale: 否定祈使意味的被动式表达禁止事情被人知晓；此译法既符合现代汉语，也保留了不公开此事的语气。
- source_word: האשה
  choice: 有女人
  rationale: 希伯来文带定冠词，语境中指路得这位特定女子；但在汉语“让人知道有女人到过……”的存在句中，用“有女人”最自然，并不表示身份不确定。
- source_word: הגרן
  choice: 禾场
  rationale: 指打谷、簸扬谷物的场地；“禾场”是简洁而庄重的常用对应词。
- source_word: ויאמר
  choice: 他说
  rationale: 原文只用阳性单数动词表达“他说”，没有明说姓名；译文同样不补出“波阿斯”。
theological_decisions:
- issue: ויאמר的说话者身份
  choice: 正文译为“他说”，不直接补出波阿斯的名字。
  alternative: 为求明确而译作“波阿斯说”。
  rationale: 上下文极可能表明说话者是波阿斯，但本节希伯来文本身没有明说姓名；保留代词可避免增加原文未明示的具体信息。
- issue: 路得躺在波阿斯脚边可能具有的性或道德含义
  choice: 只按空间意义译作“在他脚边躺”，不加解释。
  alternative: 用暗示发生性关系的措辞，或加入明确否认性关系的说明。
  rationale: 本节只交代她所在的位置和离开的时间，既未明说发生性行为，也未在此明说没有发生；译文应保留叙事张力，不替原文裁定争议。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“脚边”“彼此辨认”“不要让人知道”均为当代标准汉语；“禾场”保留古代农业场景，又不显生僻。正文不补足原文未明说的说话者姓名，也不解释路得躺卧行为的道德或性含义。
