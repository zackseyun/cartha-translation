base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/007.yaml
  text: And Boaz ate and drank[a], and his heart was merry, and he went to lie down at the end of the grain heap. Then she came quietly, uncovered his feet[b], and lay down.
translation:
  language: zh_hans
  text: 波阿斯吃了，也喝了[a]，心里欢畅，就到粮堆边上躺下。路得悄悄走来，揭开盖在他脚上的遮盖物[b]，躺了下来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “心里欢畅”也可译作“心里高兴”或“心情愉快”。这个希伯来习语表示欢喜，本身并不表示波阿斯喝醉了。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“使他的脚露出来”。有人认为这只是字面动作，也有人认为其中可能含有暗示意味；希伯来文措辞本身很克制，并未明确描述性行为。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאכַל
  choice: 吃了
  rationale: 按希伯来叙事中的连续动作直译为自然的汉语过去事件，不必处理为先过去时。
- source_word: וַיֵּשְׁתְּ
  choice: 喝了
  rationale: 直接表达“喝”，不擅自补出所喝之物，也不暗示醉酒。
- source_word: וַיִּיטַב לִבּוֹ
  choice: 心里欢畅
  rationale: 保留“心变得舒畅、喜悦”的希伯来习语含义；现代汉语自然庄重，又不将其解释为醉酒。
- source_word: וַיָּבֹא לִשְׁכַּב
  choice: 就到……躺下
  rationale: בוא在此表示前往某处，לשכב指躺卧而非明确入睡；译文保留这一分别。
- source_word: בִּקְצֵה הָעֲרֵמָה
  choice: 粮堆边上
  rationale: קצה是边缘、尽头，עֲרֵמָה是堆；结合打谷场语境明确为粮堆，但不增加更具体的谷物种类。
- source_word: בַלָּט
  choice: 悄悄
  rationale: 表达隐秘、安静地接近，符合场景且不附加负面道德判断。
- source_word: וַתְּגַל מַרְגְּלֹתָיו
  choice: 掀开他脚上的盖物
  rationale: 原文直指“使他的脚部露出”。汉语若仅说“掀开他的脚”不自然，因此以“脚上的盖物”表达动作所作用的遮盖，同时用脚注保留原文字面形式及可能含义的争议。
- source_word: וַתִּשְׁכָּב
  choice: 躺了下来
  rationale: 直译“躺下”，不将动作解释为发生性行为。
theological_decisions:
- issue: 本节是否应明示路得的动作具有性行为含义
  choice: 正文只叙述她悄悄前来、使波阿斯脚部露出并躺下，不明示性行为。
  alternative: 采用解释性译法，暗示引诱或性接触。
  rationale: 希伯来文措辞克制，并未明确陈述性行为；译文应保存叙事中的含蓄与张力，不替原文作出裁断。
translation_notes:
  register: 采用现代、自然而庄重的叙事汉语。“心里欢畅”保留希伯来习语色彩；“粮堆边上”清楚交代场景；正文中的[a]、[b]均与脚注对应。
