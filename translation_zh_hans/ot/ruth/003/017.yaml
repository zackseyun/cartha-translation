lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: 她说
  rationale: 叙事中的 wayyiqtol 形式，引出路得向拿俄米转述波阿斯的话；现代汉语无需机械译出连接词 וַ。
- source_word: שֵׁשׁ הַשְּׂעֹרִים הָאֵלֶּה
  choice: 这六份大麦
  rationale: 原文明确说“六”和“大麦”，却未注明计量单位。正文用量词“份”使现代汉语自然可懂，同时以脚注保留原文未说明单位这一点。
- source_word: נָתַן לִי
  choice: 他给了我
  rationale: 忠实表达 Qal 完成式第三人称阳性单数及第一人称单数间接受词。
- source_word: כִּי
  choice: 因为
  rationale: 引出波阿斯赠送大麦的理由，符合此处的解释关系。
- source_word: אָמַר
  choice: 他说
  rationale: 以自然的汉语直接引出嵌套引语。
- source_word: אַל תָּבוֹאִי
  choice: 不要……回……去
  rationale: אַל 加未完成式表达否定命令；בוא 表示前往或来到。按波阿斯对路得返回婆婆那里的说话视角，译作“回……去”自然，并明确上下文中的返回动作。
- source_word: רֵיקָם
  choice: 空着手
  rationale: 此副词表示空无所有地前往；“空着手”准确传达没有礼物或供应可带回去的意思。
- source_word: אֶל חֲמוֹתֵךְ
  choice: 你婆婆那里
  rationale: חֲמוֹת 指丈夫的母亲，即婆婆；结合移动动词，现代汉语自然表达为“回你婆婆那里去”。
