  yaml_path: translation/ot/ruth/003/003.yaml
  text: Wash yourself[a], anoint yourself, and put your cloak on; then go down to the threshing floor[c][b]. Do not make yourself known to the man until he has finished eating and drinking.
translation:
  language: zh_hans
  text: 你要沐浴[a]，给自己抹上膏油，穿上外衣[b]，然后下到打谷场去[c]。在他吃喝完毕以前，不要让那人认出你来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“洗净身体。”希伯来语动词既可指洗身，也可指沐浴。
    reason: lexical_alternative
  - marker: b
    text: 或译：“穿上你的衣服。”希伯来语泛指衣服或外衣；有些译本更具体地理解为盛装或最好的衣服。
    reason: lexical_alternative
  - marker: c
    text: 这里希伯来语辅音文本的动词形式异常；按照上下文，通常理解为拿俄米继续吩咐路得：“下到打谷场去。”
    reason: textual_variant
lexical_decisions:
- source_word: וְרָחַצְתְּ
  choice: 你要沐浴
  rationale: רחץ可指洗身或沐浴；此处是一连串整装行动，用“沐浴”自然明确，同时以脚注保留“洗净身体”的词义幅度。
- source_word: וָסַכְתְּ
  choice: 抹上膏油
  rationale: סוך指用油或膏抹身。“抹上膏油”比“洒香水”更贴近原文，也符合古代生活语境。
- source_word: וְשַׂמְתְּ שמלתך עָלַיִךְ
  choice: 穿上外衣
  rationale: שִׂמְלָה泛指衣服，常可指披在身上的外衣；不将其具体化为原文没有明说的“最好的衣服”或“节日盛装”。
- source_word: וירדתי הַגֹּרֶן
  choice: 然后下到打谷场去
  rationale: 辅音文本的动词形式异常，按上下文和传统读法理解为对路得的阴性单数指令。“然后”自然连接连续动作；גֹּרֶן译为“打谷场”。
- source_word: אַל תִּוָּדְעִי לָאִישׁ
  choice: 不要让那人知道你在那里
  rationale: ידע的Niphal形式在此表达不让自己被那人察觉。直译“不要被那人知道”在现代汉语中生硬，故作必要的语用补足，但仍保留“那人”，不直接改成“波阿斯”或泛化为“任何人”。
- source_word: עַד כַּלֹּתוֹ לֶאֱכֹל וְלִשְׁתּוֹת
  choice: 等他吃喝完毕
  rationale: כלה加不定式表示动作完成；“等他吃喝完毕”简洁、自然地传达时间界限。
