base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/019.yaml
  text: So the two of them went on until they came to Bethlehem. And when they came to Bethlehem[a], the whole town was stirred because of them, and the women said, “Is this Naomi?”
translation:
  language: zh_hans
  text: 于是，她们二人继续前行，直到来到伯利恒。她们来到伯利恒时，全城都因她们而骚动起来；妇女们说：“这是拿俄米吗？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֵּלַכְנָה שְׁתֵּיהֶם
  choice: 她们二人继续前行
  rationale: 动词是阴性复数，所指为拿俄米和路得；“继续前行”自然表达叙事中行程的推进，而“二人”保留原文对同行二人的强调。
- source_word: עַד בֹּאָנָה
  choice: 直到来到
  rationale: עַד 与 בוא 的组合标明旅程终点；“直到来到”贴近原文，又符合现代汉语表达。
- source_word: בֵּית לָחֶם
  choice: 伯利恒
  rationale: 按现代中文圣经地名的通行译法音译，不按字面译作“粮食之家”。
- source_word: וַיְהִי כְּבֹאָנָה
  choice: 她们来到……时
  rationale: 以自然的时间从句传达希伯来叙事结构，不生硬直译 וַיְהִי 为“事情发生了”。
- source_word: וַתֵּהֹם כָּל הָעִיר
  choice: 全城都……轰动起来
  rationale: המה 在此表示群体受到震动而产生骚动或喧嚷；“轰动起来”保留反应强烈和全城议论纷纷的意味，又不必断定是喜悦或不安。
- source_word: עֲלֵיהֶן
  choice: 因她们而
  rationale: עַל 在此表示引发全城反应的缘由，即二人的到来。
- source_word: וַתֹּאמַרְנָה
  choice: 妇女们说
  rationale: 动词形态为阴性复数，明确说话者是多名妇女；中文需明说主语才能保留这一性别信息。
- source_word: הֲזֹאת נָעֳמִי
  choice: 这是拿俄米吗？
  rationale: 直接保留带惊讶意味的辨认问句，不额外加入“真是”或“难道”等解释性成分。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“轰动起来”承载原文所含的集体骚动感，同时不把这种反应限定为欢迎、惊喜或惊慌。说话者的阴性复数信息已在正文中译为“妇女们”，因此无需脚注。
