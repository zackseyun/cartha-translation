id: RUT.1.21
reference: Ruth 1:21
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אֲנִי֙ מְלֵאָ֣ה הָלַ֔כְתִּי וְ/רֵיקָ֖ם הֱשִׁיבַ֣/נִי יְהוָ֑ה לָ֣/מָּה תִקְרֶ֤אנָה לִ/י֙ נָעֳמִ֔י וַֽ/יהוָה֙ עָ֣נָה בִ֔/י וְ/שַׁדַּ֖י הֵ֥רַֽע לִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/021.yaml
  text: I went away full[a], but Yahweh has brought me back empty. Why do you call me Naomi[b], when Yahweh has testified against me and the Almighty has brought calamity on me?
translation:
  language: zh_hans
  text: 我满满地出去，耶和华却使我空空地回来。你们为什么还叫我拿俄米呢？耶和华已经作证反对我[a]，全能者已经使我遭受灾祸[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“回应我”或“作证不利于我。”希伯来语动词在这里可有回应或出面作证反对某人的意思。
    reason: lexical_alternative
  - marker: b
    text: 或译：“降祸于我。”希伯来语表达指使拿俄米遭遇灾祸或逆境。
    reason: lexical_alternative
lexical_decisions:
- source_word: מְלֵאָה
  choice: 满满地
  rationale: 作谓语性形容词，描述拿俄米离去时生命充盈的状态；采用“满满地”以保留与“空空地”的鲜明对照，又不把所指限缩为财物。
- source_word: הָלַכְתִּי
  choice: 我……离去
  rationale: 该动词本义为“去、行走”；上下文强调她从伯利恒出走，译作“离去”自然且准确。
- source_word: וְרֵיקָם
  choice: 空空地
  rationale: 该词在此作副词性用法，可指“空着、空手”；译作“空空地”保留原文与“满满地”的对称，也避免只解释为物质上一无所有。
- source_word: הֱשִׁיבַנִי
  choice: 使我……回来
  rationale: שׁוב 的使役式表达“使返回、带回来”，此译保留耶和华作为行动主体的直接性。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的形式音译以色列上帝的专名，不以称号替代。
- source_word: לָמָּה תִקְרֶאנָה לִי נָעֳמִי
  choice: 你们为什么还叫我拿俄米呢
  rationale: 复数阴性动词表明拿俄米对伯利恒的妇女们说话；“还”自然体现上下文中她拒绝这个名字的语气，但不把名字含义直接写进正文。
- source_word: נָעֳמִי
  choice: 拿俄米
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: עָנָה בִי
  choice: 指证我
  rationale: 该结构可带法庭语境中的“作证反对”之意；“指证我”简洁保留这种司法色彩，并与下句“使我遭受灾祸”区分。
- source_word: שַׁדַּי
  choice: 全能者
  rationale: 将神圣称号译出其传统意义，而非仅作音译。
- source_word: הֵרַע לִי
  choice: 使我遭受灾祸
  rationale: רעע 的使役式在此表示使人遭遇祸患或逆境；此译保留直接的神圣施动性，同时不误导读者以为经文在断言上帝行了道德意义上的恶。
theological_decisions:
- issue: 拿俄米把自己的苦难归于上帝的行动
  choice: 保留“耶和华……使我回来”“耶和华已经指证我”“全能者已经使我遭受灾祸”的直接神圣施动表达。
  alternative: 弱化为“耶和华容许我空空回来”或“全能者容许灾祸临到我”。
  rationale: 希伯来文直接把拿俄米的逆境归于耶和华和全能者的行动。译文应保留说话者话语中的神学张力，而不把直接施动改释为单纯许可。
- issue: הֵרַע לִי 是否暗示上帝行道德之恶
  choice: 译作“使我遭受灾祸”。
  alternative: 译作“向我行恶”或“害了我”。
  rationale: 上下文所指是临到拿俄米的灾祸与逆境。译作“灾祸”既忠实保留严厉措辞，又避免在现代汉语中额外断言上帝犯了道德意义上的恶。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“满满地／空空地”刻意保留原文简洁强烈的反差；“指证”略带司法语域，与该希伯来短语可能具有的法庭含义相称。所有脚注标记均置于其所解释的具体短语之后。
