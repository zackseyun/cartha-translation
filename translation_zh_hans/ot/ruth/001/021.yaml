revisions:
- from: 我满满地离去，耶和华却使我空空地回来。你们为什么还叫我拿俄米呢？耶和华已经指证我[a]，全能者已经使我遭受灾祸[b]。
  to: 我满满地出去，耶和华却使我空空地回来。你们为什么还叫我拿俄米呢？耶和华已经作证反对我[a]，全能者已经使我遭受灾祸[b]。
  rationale: 修订仅改善中文搭配并更清楚呈现原文语义。“出去”强化原文叙事中的离开与归回对照；“作证反对我”保留 עָנָה בִי 的法庭性解释，且不把它与下句造成灾祸的表达混同。保留“还”以传达拿俄米拒绝继续以此名被称呼的语境性语气；保留“满满地／空空地”的强烈对称和对神直接施动的表述。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T05:21:49Z'
review_pass:
  verdict: revise
  source_fidelity: 译文总体忠实保留了原文的对照、耶和华使其归回的直接施动性，以及“作证反对”与“降祸”两个彼此有别的表达。建议将“离去”改为“出去”，更贴合此处从伯利恒出走、如今归回的空间对照；将“指证我”改为“作证反对我”，更明确而自然地表达 עָנָה בִי 所可能含有的法庭性“作证不利于”之意。
  naturalness: “满满地／空空地”虽带有刻意的文学对称，但在庄重的经文叙事语体中自然可接受。“我满满地出去”比“我满满地离去”更符合中文圣经语境中的出走—归回对照。“作证反对我”比“指证我”搭配更自然，且避免“指证”可能偏向检举或指认罪证的现代语感。
  terminology: “耶和华”“拿俄米”“全能者”均一致、通行且适合本段。“灾祸”准确表达 הֵרַע לִי 所指的患难/祸患，未不当引申为道德意义的恶。脚注 a、b 的锚点均置于所说明的短语之后，结构正确。
