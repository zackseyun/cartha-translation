revisions:
- from: 你死在哪里，我也要死在那里，也要葬在那里。愿雅威这样待我，并且加倍惩罚我[a]！若有死亡以外的事使你我分离[b]，愿他如此待我。
  to: 你死在哪里，我也要死在那里；我也要葬在那里。愿雅威这样待我，并且再加添：若有死亡以外的事使你我分离。
  rationale: 修订避免把未明说的誓言后果译成“惩罚”并定量为“加倍”，以保留原文公式的省略性和庄严语气；补足“我”以对应第一人称被动动词；同时校正脚注 b 对末句表层表达及其惯常誓言含义的说明。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T05:22:33Z'
review_pass:
  verdict: revise
  source_fidelity: 译文整体准确传达地点、死亡与安葬的平行，以及末句“死亡以外的事”才会造成分离的誓言含义。惟“加倍惩罚我”把原文未明说的惩罚内容明确化，且将“加添”定量为“加倍”，超出了希伯来语 כֹּה...וְכֹה יֹסִיף 的保留表达。
  naturalness: 正文庄重通顺，但“也要葬在那里”缺少第一人称主语，略易被误读为主动埋葬；补出“我”更清楚。修订后的誓言公式以自然的汉语保留其省略和强化。
  terminology: “雅威”适当地对应 יְהוָה，并与项目神名政策一致。“死亡”“分离”等用语准确且符合现代标准汉语。
  issues:
  - severity: medium
    issue: “加倍惩罚我”过度具体化誓言公式。
    rationale: 原文只说“愿雅威这样待我，并且再加添”，没有说明所加添的是惩罚，也没有“加倍”的数量概念。虽该公式确属自我咒诅式誓言，正文应保留其未明言的内容；可在脚注说明其通常的审判含义。
  - severity: low
    issue: “也要葬在那里”主语不够明确。
    rationale: אֶקָּבֵר 为第一人称单数、带被动意义；“我也要葬在那里”既准确又更自然清晰。
  - severity: low
    issue: 脚注 b 所称“较直译”不够准确。
    rationale: “如果死亡使你我分离”并非对整个原文句法的充分直译，且容易让读者误会死亡本身是誓言违背的条件。脚注应说明原文表层为“因为／若死亡使你我分离”，并交代在此誓言公式中的惯常理解。
  revised_text: 你死在哪里，我也要死在那里；我也要葬在那里。愿雅威这样待我，并且再加添：若有死亡以外的事使你我分离。
  revised_footnotes:
  - marker: a
    text: 直译：“愿雅威这样待我，并且这样加给我。”这是希伯来语的自我咒诅式誓言套语；所指的灾祸或审判没有明说。
    reason: lexical_alternative
  - marker: b
    text: 原文表层可译为：“因为／若死亡使你我分离。”在此誓言语境中，通常理解为：除了死亡，任何事都不可使二人分离。
    reason: alternative_reading
  revision_rationale: 修订避免把未明说的誓言后果译成“惩罚”并定量为“加倍”，以保留原文公式的省略性和庄严语气；补足“我”以对应第一人称被动动词；同时校正脚注 b 对末句表层表达及其惯常誓言含义的说明。
