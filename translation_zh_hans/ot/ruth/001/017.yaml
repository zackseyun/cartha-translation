  text: בַּ/אֲשֶׁ֤ר תָּמ֨וּתִי֙ אָמ֔וּת וְ/שָׁ֖ם אֶקָּבֵ֑ר כֹּה֩ יַעֲשֶׂ֨ה יְהוָ֥ה לִ/י֙ וְ/כֹ֣ה יֹסִ֔יף כִּ֣י הַ/מָּ֔וֶת יַפְרִ֖יד בֵּינִ֥/י וּ/בֵינֵֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/017.yaml
  text: Where you die[a], I will die, and there I will be buried. May Yahweh do so to me, and more also[b], if anything but death separates me from you.
translation:
  language: zh_hans
  text: 你死在哪里，我也要死在那里；我也要葬在那里。愿雅威这样待我，并且再加添：若有死亡以外的事使你我分离。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּאֲשֶׁר
  choice: 在哪里
  rationale: 介词 בְּ 与关系词 אֲשֶׁר 合用，表示“在……的地方”；“在哪里”自然地保留了地点含义。
- source_word: תָּמוּתִי / אָמוּת
  choice: 你死……我也要死
  rationale: 保留两个同源动词构成的庄严平行句；“也要”表达路得坚定承诺的语气。
- source_word: וְשָׁם אֶקָּבֵר
  choice: 也要葬在那里
  rationale: אֶקָּבֵר 是 קבר 的尼法勒未完成式，含被动义；中文按自然语序表达为“葬在那里”。
- source_word: כֹּה יַעֲשֶׂה יְהוָה לִי וְכֹה יֹסִיף
  choice: 愿雅威这样待我，并且加倍惩罚我
  rationale: 这是自我咒诅式的希伯来誓言套语。“这样待我”保留原文未明说惩罚内容的表达，“加倍惩罚”则自然传达 וְכֹה יֹסִיף 所加强的审判意味。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代中文常见音译呈现四字神名，保留其作为以色列之神专名的性质，而不以称号替代。
- source_word: הַמָּוֶת יַפְרִיד בֵּינִי וּבֵינֵךְ
  choice: 有死亡以外的事使你我分离
  rationale: 按誓言语境补出省略的条件含义，表达死亡是唯一可容许的分离原因；同时用脚注保留原文表层句法可能产生的另一种理解。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；正文采用较贴近学界通行重构读音 Yahweh 的中文音译“雅威”，不以“主”等称号代替。
- issue: 路得誓言末句的条件范围
  choice: 若有死亡以外的事使你我分离
  alternative: 如果死亡使你我分离
  rationale: 在自我咒诅的誓言套语中，该句通常表达“除死亡外，任何事都不可使我们分离”。然而原文表层只明说“死亡使你我分离”，因此以脚注保存较直译的可能性，不消除原有的语言张力。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“你我分离”简洁自然；誓言部分保留古代誓约的严肃感，同时避免过度文言化。正文中的每个脚注标记均与脚注对应。
