source:
  edition: WLC
  text: וַ/תֹּ֗אמֶר הִנֵּה֙ שָׁ֣בָה יְבִמְתֵּ֔/ךְ אֶל עַמָּ֖/הּ וְ/אֶל אֱלֹהֶ֑י/הָ שׁ֖וּבִי אַחֲרֵ֥י יְבִמְתֵּֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/015.yaml
  text: And she said[a], “Look, your sister-in-law has gone back to her people and to her gods[b]. Go back after your sister-in-law.”
translation:
  language: zh_hans
  text: 她说：“看哪，你的妯娌已经回到她的族人和她的众神[a]那里去了。你回去吧，跟随你的妯娌。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文作“她的众神”。也有人译作“她的神”，但此处很可能指摩押人所敬拜的诸神。
    reason: alternative_reading
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: 她说
  rationale: 希伯来叙事中的常规承接形式；中文省去机械的“于是”更自然，代词在上下文中指拿俄米。
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留提示听者注意眼前情形的语气，同时保持庄重而易懂的经文语体。
- source_word: שָׁבָה / שׁוּבִי
  choice: 已经回到……去了 / 回去吧
  rationale: 两处均译出 שוב 的“返回”含义，并以共同词根“回”保留原文的重复；完成式与命令式分别自然表达。
- source_word: יְבִמְתֵּךְ
  choice: 你嫂子
  rationale: 该词指利未婚姻亲属关系中的女性姻亲；按本段关系，俄珥巴是路得亡夫兄弟的妻子，现代汉语通常称“嫂子”。
- source_word: אֶל עַמָּהּ
  choice: 回到她的族人……那里
  rationale: עַם 在这里指俄珥巴所属的民族共同体，不只指近亲；“族人”比“人民”更符合中文亲属与族群语境。
- source_word: וְאֶל אֱלֹהֶיהָ
  choice: 和她的神明那里
  rationale: אֱלֹהִים 带第三人称阴性单数后缀，语境所指为摩押的宗教崇拜。“神明”在中文可作集合性表达，不强行判定形式上可能存在的单复数理解；脚注说明。
- source_word: אַחֲרֵי
  choice: 跟着
  rationale: 表达“在……之后、循其所走之路”的意思，比直译“在……后面”更符合现代汉语直接引语。
theological_decisions:
- issue: אֱלֹהֶיהָ 指摩押崇拜对象时的数
  choice: 正文译作“她的神明”，保留中文中的数目开放性
  alternative: 她的众神；她的神
  rationale: 该形式可见为复数“她的诸神”，但 אֱלֹהִים 在希伯来语中也可有单数用法。上下文明确是返回摩押的宗教归属，却不必在中文正文中把数目解释得超过原文证据；脚注列明较可能的复数理解。
translation_notes:
  register: 采用现代、自然而庄重的叙事中文。“看哪”保留原文提示语气；以两次“回”呼应 שוב 的重复。正文中的脚注标记置于相关宗教用语之后。
