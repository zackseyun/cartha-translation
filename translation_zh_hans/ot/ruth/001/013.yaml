  text: הֲ/לָהֵ֣ן תְּשַׂבֵּ֗רְנָה עַ֚ד אֲשֶׁ֣ר יִגְדָּ֔לוּ הֲ/לָהֵן֙ תֵּֽעָגֵ֔נָה לְ/בִלְתִּ֖י הֱי֣וֹת לְ/אִ֑ישׁ אַ֣ל בְּנֹתַ֗/י כִּֽי מַר לִ֤/י מְאֹד֙ מִ/כֶּ֔ם כִּֽי יָצְאָ֥ה בִ֖/י יַד יְהוָֽה׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/013.yaml
  text: Would you wait for them until they were grown? Would you refrain from belonging to a man for them? No[a], my daughters, for it is much more bitter for me than for you, because the hand of Yahweh has gone out against me.
translation:
  language: zh_hans
  text: 难道你们会一直等到他们长大吗？难道你们会为等他们而不嫁人吗？不，我的女儿们，因为我所受的苦比你们的重得多[a]，雅威的手已经伸出来攻击我。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“我因你们而极其痛苦”。希伯来语“从你们”（מִכֶּם）通常按比较义理解为“比你们的”，也可理解为表示缘由。
    reason: 原文 מִכֶּם 的另一种句法理解；标记移至实际受注释的比较短语之后。
lexical_decisions:
- source_word: תְּשַׂבֵּרְנָה
  choice: 要等
  rationale: 该词在此表示等候、期待；上下文所说的是等待假想中的儿子长大，因此译为“等”最自然。
- source_word: עַד אֲשֶׁר יִגְדָּלוּ
  choice: 等他们长大
  rationale: 保留时间关系，并清楚表达这些假想的儿子达到适婚年龄。
- source_word: תֵּעָגֵנָה לְבִלְתִּי הֱיוֹת לְאִישׁ
  choice: 为了他们守着不嫁人
  rationale: עגן是罕见动词，其确切语感有不确定性；后接短语“不给男人/丈夫”说明此处指克制自己、不进入婚姻。“守着不嫁人”在现代汉语中自然，也保留为未来丈夫等待的语境。
- source_word: אַל בְּנֹתַי
  choice: 不，我的女儿们
  rationale: אַל在这里不是单纯发布禁令，而是拿俄米带着感情否定前述可能，因此用“不”表达其话语功能。
- source_word: כִּי מַר לִי מְאֹד מִכֶּם
  choice: 我的苦楚远比你们深重
  rationale: מַר表达“苦”的处境或感受，מִכֶּם在此具有比较意味；该译法自然呈现拿俄米认为自己所受之苦更重。
- source_word: יָצְאָה בִי יַד יְהוָה
  choice: 雅威的手伸出来攻击我了
  rationale: 保留“手伸出”的希伯来意象，并明确בִי在此所含的敌对方向，表达拿俄米对自身苦难的理解。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译呈现四字神名，保留其作为专名的性质。
theological_decisions:
- issue: 拿俄米将自己的苦难归于神的作为
  choice: 因为雅威的手伸出来攻击我了
  alternative: 因为雅威的手转而攻击我
  rationale: 原文直陈雅威的手向拿俄米而出。译文不淡化其对神施行苦难的理解，也不替叙述者判断她的解释是否完整。
- issue: “我的苦楚远比你们深重”的比较对象
  choice: 保留拿俄米认为自己的苦楚比两个儿媳更深重
  alternative: 我因你们的缘故极其痛苦
  rationale: מִכֶּם在语法上也可能引发“因你们/为你们”的理解，但上下文及常见比较用法支持“比你们”。正文采用比较义，以脚注提示另一种可能。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“守着不嫁人”避免生硬直译“不给男人”，同时保留等待婚姻对象的含义；“雅威的手伸出来攻击我”保留原文鲜明的身体意象和神学张力。
