  yaml_path: translation/ot/ruth/001/014.yaml
  text: Then they lifted up their voices and wept again. Orpah kissed her mother-in-law[a], but Ruth clung to her.
translation:
  language: zh_hans
  text: 她们又放声哭了。俄珥巴亲吻了婆婆，路得[a]却紧紧依附着她。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“俄珥巴亲吻了她的婆婆，路得紧紧依附着她。”希伯来文的连接词可直译为“和”或“而”；本译文按上下文译为“却”，以表达两者的对比。
    reason: 保留希伯来文连接词可作一般承接的可能，同时说明译文采用“却”是基于语境的对比。
lexical_decisions:
- source_word: וַתִּשֶּׂנָה קוֹלָן
  choice: 她们放声
  rationale: 这是表示高声发出哀哭之声的希伯来语习语；译作“放声”既自然，也保留可听见的哀恸意味。
- source_word: וַתִּבְכֶּינָה
  choice: 哭了
  rationale: 该动词指哭泣；与“放声”合译为“放声哭了”，符合现代汉语叙事表达。
- source_word: עוֹד
  choice: 又
  rationale: 承接前文已经发生过的哭泣，表示动作再次发生。
- source_word: וַתִּשַּׁק
  choice: 亲吻了
  rationale: 直接表达亲吻的动作，不作额外扩展。
- source_word: לַחֲמוֹתָהּ
  choice: 婆婆
  rationale: 该名词特指丈夫的母亲；现代汉语用“婆婆”最自然准确。
- source_word: דָּבְקָה בָּהּ
  choice: 紧紧跟随她
  rationale: דבק表示紧贴、依附或不离开；此处重点是路得坚持与拿俄米同去。“紧紧跟随”自然传达持续依附与忠诚同行，同时避免仅理解为身体上的抓抱。
- source_word: וְ
  choice: 却
  rationale: 该连词形式上通常是“和”，但上下文把俄珥巴的亲吻与路得的不离不弃相对照，译作“却”明确表达隐含的转折；脚注保留形式上的另一种读法。
- source_word: עָרְפָּה
  choice: 俄珥巴
  rationale: 按现代中文圣经人名惯例音译。
- source_word: רוּת
  choice: 路得
  rationale: 采用现代中文读者熟悉的传统圣经人名译法。
