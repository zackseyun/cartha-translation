base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/001.yaml
  text: It happened in the days when the judges judged that there was a famine in the land[c][b][a], and a man went from Bethlehem of Judah to sojourn in the fields of Moab—he and his wife and his two sons.
translation:
  language: zh_hans
  text: 士师执政[a]的日子，那地发生了饥荒。有一个人带着妻子和两个儿子，从犹大的伯利恒前往摩押的田野寄居[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文连续使用“审判／士师”这一同一词根，字面可译为“士师审判的时候”。这里也可指士师的治理。
    reason: lexical_alternative
  - marker: b
    text: “摩押的田野”也可指“摩押地区”或“摩押境内”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: 发生了
  rationale: 这是叙事性的 ויהי，用来引出事件；现代汉语以“发生了”自然表达，不另加原文没有的“如今”。
- source_word: בִּימֵי שְׁפֹט הַשֹּׁפְטִים
  choice: 士师执政的日子
  rationale: שׁפט 在此兼有审判、治理之义。汉语若直译为“士师施行审判的日子”容易限缩为司法活动；“执政”自然表达士师治理时期，脚注保留原文同根重复。
- source_word: רָעָב
  choice: 饥荒
  rationale: 指影响一地的严重粮食短缺，“饥荒”准确且通行。
- source_word: בָּאָרֶץ
  choice: 境内
  rationale: 定冠词所指之地由叙事背景限定，可能是犹大或以色列地；“境内”在中文中简洁自然，又不强行补出具体地名。
- source_word: אִישׁ
  choice: 有一个人
  rationale: 保留阳性单数人物指称；此人下一节才具名。
- source_word: מִבֵּית לֶחֶם יְהוּדָה
  choice: 从犹大的伯利恒出发
  rationale: “犹大的伯利恒”保留地点限定，用以区别其他同名地点；“出发”承接 וילך，使汉语句法自然。
- source_word: לָגוּר
  choice: 寄居
  rationale: גור 表示以外来者身份居住，通常含非永久定居的意味；“寄居”在现代中文中仍清楚而庄重。
- source_word: בִּשְׂדֵי מוֹאָב
  choice: 到摩押乡间
  rationale: שְׂדֵי 字面为“田野”，复数构式也可指一片地区；“乡间”保留农耕地域色彩，同时符合汉语地理表达。
- source_word: הוּא וְאִשְׁתּוֹ וּשְׁנֵי בָנָיו
  choice: 带着妻子和两个儿子
  rationale: 原文逐项列出同行家人；中文用“带着”自然说明他们与该男子一同前往，不改变人物关系。
theological_decisions:
- issue: 士师时期 שׁפט 的语义范围
  choice: 正文译作“执政”，脚注说明字面同根结构
  alternative: 士师施行审判
  rationale: 该动词可涵盖审判和治理；正文避免让现代读者误解为仅指司法判案，同时脚注保存原文的词根呼应和语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“寄居”虽略带经文语体，但能准确传达以外来者身份暂住的含义。脚注标记按其对应词语放置，避免英文咨询层中标记次序与正文所指不清的问题。
