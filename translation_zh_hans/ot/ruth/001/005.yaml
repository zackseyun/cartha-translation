  yaml_path: translation/ot/ruth/001/005.yaml
  text: Then both of them also died[a], Mahlon and Chilion, and the woman was left without her two children and without her husband.
translation:
  language: zh_hans
  text: 后来，玛伦和基连两人也都死了；那妇人失去了她的两个孩子[a]和丈夫，留了下来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“两个儿子”。希伯来文作“两个孩子”，所用词也可泛指儿女或后代。
    reason: 保留יְלָדִים较宽的词义，同时说明在本段具体人物关系中译作“儿子”也成立。
lexical_decisions:
- source_word: וַיָּמ֥וּתוּ
  choice: 后来……死了
  rationale: 该叙事时态推动事件向前发展；“后来……死了”自然表达继前事而发生的死亡。
- source_word: גַם
  choice: 也
  rationale: 表明这两人的死是在以利米勒先前死亡之外又发生的丧亡。
- source_word: שְׁנֵיהֶם
  choice: 两人……都
  rationale: 明确保留原文对两个人共同命运的强调。
- source_word: מַחְלוֹן וְכִלְיוֹן
  choice: 玛伦和基连
  rationale: 采用现代中文圣经中通行且易于辨认的人名音译。
- source_word: וַתִּשָּׁאֵר
  choice: 留了下来
  rationale: שׁאר表示“留下、剩下”；此处指妇人在亲人相继去世后仍然存留，同时避免加入“独自”等原文未明说的内容。
- source_word: הָאִשָּׁה
  choice: 这妇人
  rationale: 原文称“那妇人”，没有直呼拿俄米之名；“这妇人”保留叙述者的称谓，并符合庄重的现代中文表达。
- source_word: מִשְּׁנֵי יְלָדֶיהָ
  choice: 失去了两个孩子
  rationale: 介词与“留下”连用表达分离和丧失；יְלָדִים本义为“孩子、儿女”，虽在此具体指成年的儿子，正文仍保留较宽泛的原词。
- source_word: וּמֵאִישָׁהּ
  choice: 和丈夫
  rationale: 带所属后缀的אִישׁ在此关系语境中指“她的丈夫”；与前面的“失去了”连读，自然表达丧偶。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。分号保留原文先叙两子死亡、再聚焦妇人所受丧失的结构；不使用“独自留下”，因为儿媳仍在，原文也未明确说她孤身一人。
