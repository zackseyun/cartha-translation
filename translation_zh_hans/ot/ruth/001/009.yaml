base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/009.yaml
  text: May Yahweh grant that you find rest[a], each of you in the house of her husband." Then she kissed them, and they lifted up their voices and wept.
translation:
  language: zh_hans
  text: 愿耶和华使你们各自在丈夫家里得享安稳[a]！”于是，拿俄米亲吻了她们；她们就放声大哭了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“安歇”“安居”。这里指在丈夫家中得到安定、有保障的生活。
    reason: 说明 מְנוּחָה 的词义范围及其在本节中的具体语境。
lexical_decisions:
- source_word: יִתֵּן
  choice: 愿……使
  rationale: 该形式在这里表达拿俄米的祝愿；“愿……使”既自然，又保留祝福语气。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 直接译出神的专名，不以“主”替代；“耶和华”是现代中文圣经读者最熟悉的专名形式。
- source_word: וּמְצֶאןָ
  choice: 使你们……得享
  rationale: 此动词承接前面的祝愿。中文将其纳入“愿耶和华使……”的结构，比逐字译作“并找到”更自然。
- source_word: מְנוּחָה
  choice: 安稳
  rationale: 该词本义涉及安歇、安宁；本节具体指在婚姻和家庭中获得安定、有保障的生活。“安稳”兼顾词义与语境，不把它缩减为单纯的身体休息。
- source_word: אִשָּׁה בֵּית אִישָׁהּ
  choice: 你们各自在丈夫家里
  rationale: 原文以单数形式逐一指向两位女子，具有分配意义；“你们各自”在中文中清楚表达这一点。原文只说“丈夫”，因此正文不添加“新的”或“未来的”。
- source_word: וַתִּשַּׁק לָהֶן
  choice: 于是，拿俄米亲吻她们
  rationale: 叙事动词表示接续发生的动作。中文补出主语“拿俄米”，避免连续女性代词造成歧义。
- source_word: וַתִּשֶּׂאנָה קוֹלָן וַתִּבְכֶּינָה
  choice: 她们便放声大哭
  rationale: 希伯来语直译为“她们扬起声音并哭泣”，是表示出声哀哭的惯用语；“放声大哭”准确而自然地传达整个表达。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；主
  rationale: 原文明确使用四字神名，故正文保留专名而不以称号“主”代替。“耶和华”在现代中文基督教语境中辨识度最高；“雅威”较贴近学术界对古代发音的重构，但尚未成为普通中文读者最通行的形式。
- issue: מְנוּחָה 在婚姻语境中的含义
  choice: 安稳
  alternative: 安歇；安居；安身之处
  rationale: 拿俄米所祝愿的不只是休息，而是在丈夫家中获得安定生活。正文采用“安稳”，脚注保留“安歇”等词义空间，避免将经文解释成某一种完整的婚姻神学主张。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“愿……”保留祝福口吻；“放声大哭”将希伯来语哀哭惯用语自然汉化。正文中的脚注标记[a]与脚注一致。
