  text: וַ/תָּ֤קָם הִיא֙ וְ/כַלֹּתֶ֔י/הָ וַ/תָּ֖שָׁב מִ/שְּׂדֵ֣י מוֹאָ֑ב כִּ֤י שָֽׁמְעָה֙ בִּ/שְׂדֵ֣ה מוֹאָ֔ב כִּֽי פָקַ֤ד יְהוָה֙ אֶת עַמּ֔/וֹ לָ/תֵ֥ת לָ/הֶ֖ם לָֽחֶם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/006.yaml
  text: Then she arose with her daughters-in-law and returned from the fields of Moab[a], because in the field of Moab she had heard that Yahweh had visited his people to give them food.
translation:
  language: zh_hans
  text: 于是，她便和两个儿媳起身，要从摩押的乡间返回，因为她在摩押的乡间听说，雅威眷顾了他的百姓，赐给他们粮食[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “粮食”原文直译为“饼”，也可泛指食物。
    reason: 保留לֶחֶם的字面义及其较广泛的语义范围。
lexical_decisions:
- source_word: וַתָּקָם
  choice: 于是……动身
  rationale: קום的叙事性连续式推进下一事件；结合后面的返回行动，译为“动身”比直译“起来”更符合现代汉语，同时保留“于是”的叙事推进。
- source_word: וְכַלֹּתֶיהָ
  choice: 她和两个儿媳
  rationale: 该词意为“她的儿媳们”；上下文表明共有两人，因此用“两个儿媳”自然明确。
- source_word: וַתָּשָׁב
  choice: 要……回去
  rationale: שׁוב意为“返回、回去”。下一节显示她们随后才踏上归途，因此用“动身，要……回去”表达此处开始返回的行动，避免误示旅程已经完成。
- source_word: מִשְּׂדֵי מוֹאָב / בִּשְׂדֵה מוֹאָב
  choice: 从摩押乡间 / 在摩押乡间
  rationale: שׂדה可指田野、乡间或地域。译作“乡间”既保留具体的地域意象，也比“田野”更自然地表达她们居住和离开的摩押地区。
- source_word: כִּי
  choice: 因为
  rationale: 此处引出拿俄米返回的原因，现代汉语用“因为”清楚自然。
- source_word: שָׁמְעָה
  choice: 听说
  rationale: 该完成式提供先于动身行动的背景消息；汉语“听说”本身即可自然表达得知消息，无须另加时态标记。
- source_word: פָקַד
  choice: 眷顾
  rationale: פקד在此表示雅威有利地关注并介入他百姓的处境。“眷顾”保留神主动临到、施恩帮助的含义，又不把具体方式解释得过满。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，保留其作为以色列之神专名的性质，而不以称号替代。
- source_word: עַמּוֹ
  choice: 他的百姓
  rationale: עם在这里具有群体及关系含义；“百姓”符合庄重的现代汉语宗教叙事语体。
- source_word: לָתֵת לָהֶם לָחֶם
  choice: 赐粮食给他们
  rationale: לֶחֶם字面可指饼，也常泛指食物。饥荒语境强调恢复供应，“粮食”既贴合语境，也保留与谷物、饼相关的具体色彩；字面义另见脚注。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名。正文采用“雅威”作为较贴近通常学术重建读音的汉语音译，保留专名而不改成“主”等称号。
- issue: פקד所表达的神的行动
  choice: 眷顾
  alternative: 看顾；援助
  rationale: 此处语境明确是有利的临到与供应，但原词本身并未详述行动方式。“眷顾”既表达恩惠性的介入，又避免将其窄化为某一种援助。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“动身，要……回去”与下一节的实际启程衔接；“乡间”保留שׂדה的田野地域意象，同时避免生硬直译。
