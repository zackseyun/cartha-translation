base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/004.yaml
  text: And they took for themselves Moabite wives. The name of the one was Orpah[a], and the name of the other was Ruth. And they lived there about ten years.
translation:
  language: zh_hans
  text: 他们娶了摩押女子为妻[a]；一个名叫俄珥巴，另一个名叫路得。他们在那里住了约十年。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们与摩押女子结婚。”希伯来原文直译为“他们为自己娶了摩押妻子”。
    reason: 说明希伯来语娶妻惯用语的字面形式及可采用的意译。
lexical_decisions:
- source_word: וַיִּשְׂאוּ לָהֶם
  choice: 他们娶了……为妻
  rationale: נָשָׂא与“女子／妻子”连用，是娶妻的惯用表达；译作“娶了……为妻”既自然地表达婚姻含义，也保留“取为妻”的希伯来语意象。לָהֶם所含“为自己”的意味在汉语“娶……为妻”中已自然体现，脚注补明其字面形式。
- source_word: נָשִׁים מֹאֲבִיּוֹת
  choice: 摩押女子
  rationale: 该短语指来自摩押的女性；与“娶了……为妻”组合，既清楚表明其族属，也避免汉语“娶摩押妻子”不自然的搭配。
- source_word: שֵׁם הָאַחַת
  choice: 一个名叫
  rationale: 以现代汉语自然的点名句式表达“一个的名字是”，保留两人之间的对举。
- source_word: עָרְפָּה
  choice: 俄珥巴
  rationale: 采用现代中文圣经传统中通行的人名音译。
- source_word: וְשֵׁם הַשֵּׁנִית
  choice: 另一个名叫
  rationale: הַשֵּׁנִית字面为“第二个”；在仅有两人的并列结构中，现代汉语用“另一个”更自然，并准确保持与“一个”的对应关系。
- source_word: רוּת
  choice: 路得
  rationale: 采用现代中文圣经传统中通行的人名音译。
- source_word: וַיֵּשְׁבוּ שָׁם
  choice: 他们在那里住了
  rationale: יָשַׁב在此表示居住；“住了”自然贴合延续约十年的语境。
- source_word: כְּעֶשֶׂר שָׁנִים
  choice: 约十年
  rationale: 前缀כְּ在此表示约数，因此译为“约十年”，不将时长绝对化。
theological_decisions: []
