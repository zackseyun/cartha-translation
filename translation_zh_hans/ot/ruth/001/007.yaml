base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/007.yaml
  text: So she went out from the place where she had been[a], and her two daughters-in-law with her, and they went on the way to return to the land of Judah.
translation:
  language: zh_hans
  text: 于是，她和两个儿媳从她原来住的地方出来[a]；她们上路，要回犹大地去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“离开她原来住的地方。”希伯来语动词字面意为“出去”。
    reason: 说明“出来”对希伯来语动词的较直译表达，并提供自然的动态译法；“原来住的地方”反映该处是她先前居留之地。
lexical_decisions:
- source_word: וַתֵּצֵא
  choice: 于是，她离开了
  rationale: 该叙事形式推动情节发展；“于是”自然承接上文。“离开”在现代汉语中比直译“出去”更自然，同时保留从原居地动身之意，具体字面义在脚注说明。
- source_word: מִן־הַמָּקוֹם אֲשֶׁר הָיְתָה שָׁמָּה
  choice: 原来居住的地方
  rationale: 关系从句指拿俄米先前停留、居住之处；“原来居住的地方”自然表达其从该地离开的叙事转换。
- source_word: וּשְׁתֵּי כַלֹּתֶיהָ עִמָּהּ
  choice: 两个儿媳也和她一起
  rationale: כַּלָּה在此家庭关系中指“儿媳”；保留“两位”和“与她同去”的信息，用现代汉语自然表达。
- source_word: וַתֵּלַכְנָה בַדֶּרֶךְ
  choice: 她们上路
  rationale: 阴性复数动词包括拿俄米和两个儿媳；“上路”简洁自然地表达她们行在路上的具体旅行场景。
- source_word: לָשׁוּב
  choice: 要回
  rationale: שׁוּב意为返回；“回”保留《路得记》第1章反复出现的“归回”主题，又符合现代叙事用语。
- source_word: אֶל־אֶרֶץ יְהוּדָה
  choice: 犹大地去
  rationale: 明确译出אֶרֶץ为“地”，不简化成单独的“犹大”，并自然标示目的地。
