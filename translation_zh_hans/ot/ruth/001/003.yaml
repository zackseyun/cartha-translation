  yaml_path: translation/ot/ruth/001/003.yaml
  text: Then Elimelech[a], Naomi’s husband, died, and she was left, and her two sons.
translation:
  language: zh_hans
  text: 于是，拿俄米的丈夫以利米勒死了；拿俄米和她的两个儿子留了下来。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּמָת
  choice: 后来……死了
  rationale: 未完成式连续体推动叙事向前；“后来”在现代汉语中自然表达事件的先后承接，而不机械重复“于是/并且”。
- source_word: אֱלִימֶלֶךְ
  choice: 以利米勒
  rationale: 按普通话圣经人名的通行音译处理专名。
- source_word: אִישׁ נָעֳמִי
  choice: 拿俄米的丈夫
  rationale: אִישׁ与女子姓名构成属格关系，在此语境中明确指“丈夫”；这一译法自然且准确。
- source_word: וַתִּשָּׁאֵר
  choice: 只留下
  rationale: שׁאר在死亡造成的丧亲语境中表示存留下来；“只留下”既呈现结果，也传达失去亲人的语境。
- source_word: הִיא וּשְׁנֵי בָנֶיהָ
  choice: 她和两个儿子
  rationale: 保留原文并列的两个主项，即“她”和“她的两个儿子”，避免译成“她带着两个儿子”而改变句法关系；汉语中在亲属称谓前省略重复的“她的”自然清楚。
