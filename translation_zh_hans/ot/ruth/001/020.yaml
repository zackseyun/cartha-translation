  text: וַ/תֹּ֣אמֶר אֲלֵי/הֶ֔ן אַל תִּקְרֶ֥אנָה לִ֖/י נָעֳמִ֑י קְרֶ֤אןָ לִ/י֙ מָרָ֔א כִּי הֵמַ֥ר שַׁדַּ֛י לִ֖/י מְאֹֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/020.yaml
  text: But she said to them[a], “Do not call me Naomi; call me Mara, for the Almighty has made me very bitter.”
translation:
  language: zh_hans
  text: 她却对她们说：“不要叫我拿俄米[a]，要叫我玛拉，因为全能者使我十分痛苦。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “拿俄米”这个名字含有“可喜、甜美”的意思；“玛拉”意为“苦”。
    reason: 说明原文两个人名之间的文字对比，以及下半句“苦”的呼应。
lexical_decisions:
- source_word: וַתֹּאמֶר אֲלֵיהֶן
  choice: 她却对她们说
  rationale: 叙事性连接词在此承接伯利恒妇女的话，并引出拿俄米的纠正；“却”自然体现语境中的转折。“她们”保留阴性复数所指。
- source_word: אַל תִּקְרֶאנָה לִי נָעֳמִי
  choice: 不要叫我拿俄米
  rationale: קרא在这里指以某名称呼某人；采用现代汉语自然说法，并将人名音译。
- source_word: קְרֶאןָ לִי מָרָא
  choice: 要叫我玛拉
  rationale: 与前句保持平行和名称对比；מָרָא作为替代称号音译，其“苦”的含义在脚注说明。
- source_word: כִּי
  choice: 因为
  rationale: 明确引出拿俄米要求改称的理由，符合现代汉语因果表达。
- source_word: הֵמַר ... לִי מְאֹד
  choice: 使我饱尝苦楚
  rationale: הֵמַר是מרר的使役形，表达使某人的境遇变苦；“饱尝苦楚”既自然传达强烈程度，也保留与“玛拉（苦）”的语义呼应，同时避免把心理状态作为唯一解释。
- source_word: שַׁדַּי
  choice: 全能者
  rationale: 这是神的称号而非普通人名；译出传统上所表达的意义，简洁且庄重。
theological_decisions:
- issue: 神圣称号שַׁדַּי的译法
  choice: 全能者
  alternative: 沙代
  rationale: 此处按称号译义，可让普通读者直接理解，并避免将其误作专名；同时不额外引入任何宗派性解释。
- issue: הֵמַר לִי所表达的苦
  choice: 使我饱尝苦楚
  alternative: 使我变得非常苦／严厉地苦待我
  rationale: 原文可以侧重使境况变苦或苦涩经历。所选译法保留拿俄米将苦难归于全能者的强烈陈述，又不把它过度限定为性情变化或道德意义上的恶待。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“饱尝苦楚”略带文学色彩，但在当代汉语中通顺，并能体现מְאֹד的加强语气及名字双关。
