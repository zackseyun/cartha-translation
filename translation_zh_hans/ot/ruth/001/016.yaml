  text: וַ/תֹּ֤אמֶר רוּת֙ אַל תִּפְגְּעִי בִ֔/י לְ/עָזְבֵ֖/ךְ לָ/שׁ֣וּב מֵ/אַחֲרָ֑יִ/ךְ כִּ֠י אֶל אֲשֶׁ֨ר תֵּלְכִ֜י אֵלֵ֗ךְ וּ/בַ/אֲשֶׁ֤ר תָּלִ֨ינִי֙ אָלִ֔ין עַמֵּ֣/ךְ עַמִּ֔/י וֵ/אלֹהַ֖יִ/ךְ אֱלֹהָֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/016.yaml
  text: But Ruth said[a], “Do not press me to leave you, to turn back from following after you. For where you go, I will go; and where you lodge, I will lodge. Your people will be my people[d][c][b], and your God my God.”
translation:
  language: zh_hans
  text: 路得说[a]：“不要劝我离开你，转身不再跟随你。你往哪里去，我也往哪里去；你在哪里过夜，我也在哪里过夜[b]。你的民族就是我的民族，你的上帝就是我的上帝[c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “劝我”也可译作“恳求我”或“执意劝我”。
    reason: lexical_alternative
  - marker: b
    text: “过夜”也可译作“住宿”或“留宿”。
    reason: lexical_alternative
  - marker: c
    text: 希伯来语“你的民族——我的民族；你的上帝——我的上帝”两句都没有明写系词，因此也可按语境译成“将成为”或“是”。
    reason: alternative_reading
lexical_decisions:
- source_word: תִּפְגְּעִי בִי
  choice: 催我
  rationale: פגע 与 ב 连用在这里表示恳求、催促或执意劝说。“催我”自然地表达拿俄米反复劝路得离开的语境，又不误解为身体接触或敌意。
- source_word: לְעָזְבֵךְ
  choice: 离开你
  rationale: עזב 在此指离开；“离开”符合现代汉语，也不额外加重为“抛弃”所可能带出的道德或盟约色彩。
- source_word: לָשׁוּב מֵאַחֲרָיִךְ
  choice: 转身不再跟随你
  rationale: שׁוב 表示转回，מֵאַחֲרָיִךְ 字面为“从你后面”，即不再跟随。“转身不再跟随你”保留转回与跟随两层意思，且汉语自然。
- source_word: כִּי
  choice: 省略显式连词
  rationale: כִּי 在此引出路得拒绝离开的理由。汉语直接接续誓言式陈述即可清楚表达因果，若硬译“因为”反而使长句略显滞重。
- source_word: אֶל אֲשֶׁר תֵּלְכִי אֵלֵךְ
  choice: 你往哪里去，我也往哪里去
  rationale: 准确表达目的地关系，并以“也”自然呈现路得跟随拿俄米的平行结构。
- source_word: וּבַאֲשֶׁר תָּלִינִי אָלִין
  choice: 你在哪里过夜，我也在哪里过夜
  rationale: לון 主要指留宿、过夜。“过夜”比“住宿”更明确保留词义，同时适合现代汉语。
- source_word: עַמֵּךְ עַמִּי
  choice: 你的民族就是我的民族
  rationale: עַם 指人民、族群。此处用“民族”突出路得归入拿俄米所属群体的认同；“就是”既能承载郑重认同，也不把希伯来语无系词句限定为纯现在或纯将来。
- source_word: וֵאלֹהַיִךְ אֱלֹהָי
  choice: 你的上帝就是我的上帝
  rationale: 上下文和带单数所属后缀的形式指拿俄米所敬奉的上帝。“就是”以简洁、郑重的汉语重现无系词告白，不另行规定其时间意义。
theological_decisions:
- issue: 两个无系词认同句的时态与语气
  choice: 两句均用“就是”表达：“你的民族就是我的民族，你的上帝就是我的上帝”
  alternative: 译作“你的民族必成为我的民族，你的上帝必成为我的上帝”，或用一般现在式“是”
  rationale: 希伯来语两句均无明示系词，因此本身未明确区分现在与将来。汉语“就是”既保留誓言般的坚定认同，又避免强行补入只属于将来或现在的时态解释，并保持两句对称。
- issue: אֱלֹהַיִךְ 的单复数理解
  choice: 译作单数“你的上帝”
  alternative: 译作“你的众神”
  rationale: 所属后缀形式、对应的 אֱלֹהָי 以及叙事语境共同支持单数所指，即路得认同拿俄米所敬奉的上帝。
translation_notes:
  register: 采用现代、庄重而易懂的叙事与直接引语风格。保留原文的平行结构和誓言般的简洁力度，避免古奥措辞；以“上帝”对应 אֱלֹהִים。
