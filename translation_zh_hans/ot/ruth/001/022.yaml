base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/022.yaml
  text: So Naomi returned[a], and Ruth the Moabite, her daughter-in-law, with her, who returned from the fields of Moab. And they came to Bethlehem at the beginning of the barley harvest.
translation:
  language: zh_hans
  text: 于是，拿俄米回来了；她的儿媳、摩押女子路得也和她一同回来。路得是从摩押的田野[a]回来的。她们来到伯利恒时，正值大麦收割开始的时候。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “摩押的田野”也可按上下文意译为“摩押地区”或“摩押境内”；希伯来文直译为“摩押的田野”。
    reason: 说明“田野”的字面意象得以保留，同时该地理用语在语境中也可泛指摩押一带。
lexical_decisions:
- source_word: וַתָּשָׁב
  choice: 回来了
  rationale: שׁוב表示返回；“回来了”自然简洁，也符合叙事以伯利恒为落点的视角。
- source_word: הַמּוֹאֲבִיָּה
  choice: 摩押女子
  rationale: 这是阴性族属称谓；“摩押女子”既保留路得的族裔身份，又比“摩押人路得”更明确地体现阴性形式。
- source_word: כַלָּתָהּ
  choice: 她的儿媳
  rationale: 直接表达原文所指的姻亲关系。
- source_word: עִמָּהּ
  choice: 也和她一起
  rationale: 保留路得陪同拿俄米的含义；“也”使并列关系在现代汉语中更顺畅。
- source_word: הַשָּׁבָה
  choice: 回来
  rationale: 阴性单数分词在句法上最自然地指向路得；汉语借助“路得也……回来”的主谓结构保留这一指向，同时避免生硬的“那位回来者”。
- source_word: מִשְּׂדֵי מוֹאָב
  choice: 从摩押的田野
  rationale: שָׂדֶה的复数构造形式直译为“田野”；正文保留原文意象，脚注说明其较宽泛的地域含义。
- source_word: וְהֵמָּה
  choice: 她们
  rationale: 独立代词带有轻微强调；汉语以明确复数主语“她们”自然承接叙事。
- source_word: בָּאוּ
  choice: 来到
  rationale: 常用移动动词；“来到伯利恒”符合叙事视角，也比单纯“到”更完整。
- source_word: בֵּית לֶחֶם
  choice: 伯利恒
  rationale: 采用现代中文圣经传统中通行的地名译法。
- source_word: בִּתְחִלַּת
  choice: 开始
  rationale: 表达“起初、开端”的时间含义，并与“收割”组成自然的现代汉语表达。
- source_word: קְצִיר שְׂעֹרִים
  choice: 大麦开始收割
  rationale: 该构造链指大麦的收割季节；译文明确呈现收割刚开始这一时间点。
theological_decisions:
- issue: 阴性单数分词הַשָּׁבָה的所指
  choice: 按其语法性别将“回来”关联于路得
  alternative: 将返回的描述笼统理解为拿俄米和路得二人
  rationale: 分词为阴性单数，最直接的先行项是同为阴性单数的路得；译文保留这种语法指向，不因路得原非犹大居民而消解原文张力。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“于是”承接前文；分号帮助读者分辨拿俄米与路得的并列动作。“正值大麦开始收割”以自然汉语呈现季节背景，同时保留“开始”的时间信息。
