  text: וַ/תֹּ֤אמֶר נָעֳמִי֙ לִ/שְׁתֵּ֣י כַלֹּתֶ֔י/הָ לֵ֣כְנָה שֹּׁ֔בְנָה אִשָּׁ֖ה לְ/בֵ֣ית אִמָּ֑/הּ יעשה יְהוָ֤ה עִמָּ/כֶם֙ חֶ֔סֶד כַּ/אֲשֶׁ֧ר עֲשִׂיתֶ֛ם עִם הַ/מֵּתִ֖ים וְ/עִמָּדִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/008.yaml
  text: And Naomi said to her two daughters-in-law[a], “Go, return, each to her mother’s house. May Yahweh show you kindness, as you have shown it to the dead and to me.”
translation:
  language: zh_hans
  text: 拿俄米对两个儿媳说：“你们去吧，回去吧，各自回娘家去。愿雅威以慈爱待你们[a]，正如你们曾以慈爱待死者和我一样。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “慈爱”也可译作“忠贞的爱”“信实之爱”或“盟约信实”；希伯来语为 hesed（חֶסֶד）。
    reason: 说明 חֶסֶד 丰富且难以由单一汉语词完全涵盖的语义范围。
lexical_decisions:
- source_word: כַלֹּתֶיהָ
  choice: 两个儿媳
  rationale: כַּלָּה在本语境中指儿子的妻子；“儿媳”是现代汉语中自然、准确的对应表达。
- source_word: לֵכְנָה שֹּׁבְנָה
  choice: 你们去吧，回去吧
  rationale: 分别译出两个复数阴性命令式，保留拿俄米反复劝说、催促她们离开的语气。
- source_word: אִשָּׁה לְבֵית אִמָּהּ
  choice: 各自回娘家去
  rationale: אִשָּׁה在这里具有逐一分配的意思；“各自”准确传达这一点。“娘家”自然表达“母亲的家”，也保留她们返回原生家庭的含义。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来语四字神名作音译，保留经文所用的上帝专名，而不以头衔替代。
- source_word: חֶסֶד
  choice: 慈爱
  rationale: חֶסֶד兼有仁慈、忠贞和信实之爱的含义；“慈爱”在祝福语境中自然庄重，其更丰富的语义由脚注说明。
- source_word: עֲשִׂיתֶם עִם הַמֵּתִים וְעִמָּדִי
  choice: 像你们待死去的人和我一样
  rationale: עשה עם在此表示怎样对待某人；“死去的人”保留希伯来语复数而不在正文中限定具体所指，并由前面的“慈爱待”自然补足行为内容。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；音译为“雅威”可保留其专名性质，避免用称号消解原文表达。
- issue: חֶסֶד的语义范围
  choice: 正文译作“慈爱”，脚注保留“忠贞的爱、信实之爱”等可能含义
  alternative: 恩待；忠贞之爱；盟约信实
  rationale: 本节既涉及善意行动，也可能带有忠贞和关系信实的色彩；正文采用通顺而宽广的“慈爱”，脚注提示其语义张力，不把盟约含义强行写死。
- issue: “死去的人”的具体所指
  choice: 不在正文中具体指明
  alternative: 她们已故的丈夫和以利米勒
  rationale: 原文只说“死去的人”，虽可由上下文推知主要包括她们已故的丈夫，甚至可能包括以利米勒，但正文保留原文概括性的复数表达。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“你们去吧，回去吧”保留原文两个命令式；“娘家”比直译“母亲的家”更符合现代汉语习惯。脚注标记紧接其所解释的“慈爱待你们”。
