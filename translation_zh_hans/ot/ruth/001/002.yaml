base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/002.yaml
  text: The man's name was Elimelech[a], and his wife's name was Naomi, and the names of his two sons were Mahlon and Chilion. They were Ephrathites from Bethlehem in Judah[c][b]. They came to the fields of Moab and were there.
translation:
  language: zh_hans
  text: 那人名叫以利米勒，他妻子名叫拿俄米；他的两个儿子名叫玛伦和基连。他们是犹大伯利恒的以法他人。他们来到摩押乡间[a]，就在那里[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“摩押地”或“摩押境内”；希伯来文直译为“摩押的田野”。
    reason: lexical_alternative
  - marker: b
    text: 或译“便留在那里”或“便住在那里”；希伯来文直译为“他们在那里”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשֵׁם הָאִישׁ
  choice: 那人名叫
  rationale: 保留希伯来文的命名句式，同时采用自然、简洁的现代汉语表达。
- source_word: אֱלִימֶלֶךְ
  choice: 以利米勒
  rationale: 按现代中文圣经人名的通行译名音译。
- source_word: נָעֳמִי
  choice: 拿俄米
  rationale: 按现代中文圣经人名的通行译名音译。
- source_word: שְׁנֵי בָנָיו מַחְלוֹן וְכִלְיוֹן
  choice: 他的两个儿子，一个名叫玛伦，一个名叫基连
  rationale: 原文直陈两个儿子的名字；汉语加入对称的“一个名叫”使关系清楚，不增添实质信息。
- source_word: אֶפְרָתִים
  choice: 以法他人
  rationale: 指与以法他相关的人，并由下文“犹大伯利恒”进一步限定；避免误译为以法莲人。
- source_word: מִבֵּית לֶחֶם יְהוּדָה
  choice: 犹大伯利恒的
  rationale: 自然表达伯利恒位于犹大，也保留其来源或归属关系。
- source_word: שְׂדֵי מוֹאָב
  choice: 摩押乡间
  rationale: שָׂדֶה 的复数结构字面为“摩押的田野”，在此可泛指摩押的乡野或地域；“乡间”兼顾具体意象与地域含义。
- source_word: וַיִּהְיוּ שָׁם
  choice: 就住在那里
  rationale: 字面为“他们就在那里”；叙事语境涉及迁居，“住在那里”是自然汉语，同时脚注保留更贴近字面的译法。
