base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/012.yaml
  text: Turn back[a], my daughters; go on, for I am too old to belong to a husband. Even if I were to say[b], ‘There is still hope for me’—even if I were with a husband tonight and even bore sons—
translation:
  language: zh_hans
  text: 我女儿们，回去吧！走吧！我年纪太大，不能再嫁人了。[a] 即使我会说：“我还有指望”——即使我今晚就有了丈夫，甚至生下儿子——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “不能再嫁人了”所译的希伯来语字面为“年老，不能再成为/归于一个男人（丈夫）”。也可译作“不能再有丈夫”。
    reason: 说明希伯来语的关系表达及其“有丈夫／嫁人”的语义范围。
lexical_decisions:
- source_word: שֹׁבְנָה
  choice: 回去吧
  rationale: 阴性复数命令式；结合拿俄米劝路得和俄珥巴不要再随行的语境，“回去”保留明确的返回方向。
- source_word: בְנֹתַי
  choice: 我女儿们
  rationale: 保留亲属称谓及拿俄米对儿媳的亲爱情感，同时维持庄重语气。
- source_word: לֵכְנָה
  choice: 走吧
  rationale: 第二个阴性复数命令式。直译为“走吧”简洁自然，与前面的“回去吧”共同表达让她们各自上路。
- source_word: זָקַנְתִּי מִהְיוֹת לְאִישׁ
  choice: 我年纪太大，不能再嫁人了
  rationale: זָקַנְתִּי 表示年老的现状；לְאִישׁ 在此婚姻语境中指成为某人的妻子。汉语“不能再嫁人”自然传达整体含义，并避免生硬复制希伯来语关系结构。
- source_word: כִּי אָמַרְתִּי
  choice: 即使我说
  rationale: 在这一连串不现实的设想中，כִּי 引入假设；“即使”呈现其让步和递进的修辞作用。
- source_word: יֶשׁ לִי תִקְוָה
  choice: 我还有指望
  rationale: 自然表达希伯来语存在句“对我有指望”，并以“还有”体现语境中所设想的残余可能。
- source_word: גַּם הָיִיתִי הַלַּיְלָה לְאִישׁ
  choice: 即使我今晚就有丈夫
  rationale: 保留“今晚”的时间强调及 לְאִישׁ 的婚姻含义，不额外断定具体婚礼程序或单指性关系。
- source_word: וְגַם יָלַדְתִּי בָנִים
  choice: 甚至生下儿子
  rationale: ילד 指生育，בָנִים 明确指儿子；“甚至”延续假设条件逐步增强的语势。
theological_decisions:
- issue: 在涉及家族延续和婚姻安排的语境中是否保留男性后代用语
  choice: 儿子
  alternative: 孩子
  rationale: 原文 בָנִים 明确为男性复数，且拿俄米的论证涉及未来可供两位儿媳成婚的儿子，因此不宜中性化为“孩子”。
- issue: 拿俄米关于当夜“属于男人”的假设应如何表达
  choice: 有丈夫
  alternative: 今晚就嫁人／今晚与男人同房
  rationale: “有丈夫”保留婚姻关系的基本含义，同时不把原文未明确说明的结婚仪式或性行为单独定为唯一解释。
translation_notes:
  register: 采用现代、庄重且口语可懂的叙事语言。“我女儿们”保留亲昵称呼；破折号保留本节未完的假设链，使句意自然延续到下一节。
