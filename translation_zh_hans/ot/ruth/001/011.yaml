  text: וַ/תֹּ֤אמֶר נָעֳמִי֙ שֹׁ֣בְנָה בְנֹתַ֔/י לָ֥/מָּה תֵלַ֖כְנָה עִמִּ֑/י הַֽ/עֽוֹד לִ֤/י בָנִים֙ בְּֽ/מֵעַ֔/י וְ/הָי֥וּ לָ/כֶ֖ם לַ/אֲנָשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/011.yaml
  text: But Naomi said[a], “Turn back, my daughters. Why would you go with me? Do I still have sons in my womb, that they may become husbands for you?”
translation:
  language: zh_hans
  text: 拿俄米却说：“回去吧，我的女儿们[a]！你们为什么要跟我走呢？难道我腹中还有儿子，能作你们的丈夫吗？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “我的女儿们”是原文的直译；拿俄米在这里以亲昵的家人称谓称呼她的两个儿媳。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: 拿俄米却说
  rationale: 叙事性连接词 וַ 在此承接上下文，同时拿俄米的话与两个儿媳要跟随她的意愿形成转折；用“却”自然传达这一语篇关系。
- source_word: שֹׁבְנָה
  choice: 回去吧
  rationale: שוב 的复数阴性祈使式表示返回原处；“回去吧”符合现代汉语劝说语气，也保留方向含义。
- source_word: בְנֹתַי
  choice: 我的女儿们
  rationale: 原文直译为“我的女儿们”。拿俄米以亲昵的家人称谓称呼两个儿媳，因此正文保留原有称呼，并以脚注说明语境。
- source_word: לָמָּה תֵלַכְנָה עִמִּי
  choice: 你们为什么要跟我走呢
  rationale: 未完成式在反问中带有意愿和可能性的语气；“为什么要……呢”自然表达拿俄米的劝阻。
- source_word: הַעוֹד לִי
  choice: 难道……还有
  rationale: 疑问词 הַ 与 עוֹד 构成反问，表达“我是否仍有”；“难道……还有”保留强烈的修辞疑问语气。
- source_word: בָנִים
  choice: 儿子
  rationale: 原文明确指男性后代；这与随后“作你们的丈夫”直接相关，不宜泛化为“孩子”。
- source_word: בְּמֵעַי
  choice: 我腹中
  rationale: מֵעִים 可指内脏、腹部或母腹；生育语境中“腹中”自然、庄重，并保留原文身体意象。
- source_word: וְהָיוּ לָכֶם לַאֲנָשִׁים
  choice: 能作你们的丈夫吗
  rationale: אֲנָשִׁים 在此婚姻语境中意为“丈夫”；“能作”把该从句纳入前面的假设性反问，同时不额外断定具体婚姻制度。
theological_decisions:
- issue: 拿俄米反问所涉及的婚姻与家族延续背景
  choice: 保留“儿子”和“丈夫”的明确对应，不在正文中补入制度名称或解释
  alternative: 将其明说为代兄弟留后的婚姻安排
  rationale: 本节原文本身只借反问表达儿子可能成为两个儿媳的丈夫；明确制度名称会加入经文未直说的解释，并可能过早消除叙事中的张力。
translation_notes:
  register: 采用现代、庄重而口语自然的叙事语体。“回去吧”“为什么要……呢”“难道……吗”连贯呈现拿俄米劝阻性的反问；脚注标记紧跟其实际所解释的“我的女儿们”。
