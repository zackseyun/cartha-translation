  text: When she saw that she was determined to go with her[a], she stopped speaking to her.
translation:
  language: zh_hans
  text: 拿俄米看出路得决意要和她一同去，就不再对她说什么了。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或按字面译：“就停止对她说话。”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּרֶא
  choice: 拿俄米见
  rationale: 叙事中的连续式推进情节；按上下文补出主语“拿俄米”，使现代汉语指代清楚。“见”在此表示看出、察觉。
- source_word: כִּי
  choice: （引出所察觉的内容）
  rationale: 此处引出拿俄米所看出的事实，汉语可直接衔接“见……决意”，不必另译“因为”。
- source_word: מִתְאַמֶּצֶת הִיא
  choice: 路得决意
  rationale: אמץ的Hitpael形式表示使自己刚强、坚定下来；“决意”自然凝练地传达坚定不移的意志。独立代词הִיא带有主语强调，按上下文明确译出“路得”。
- source_word: לָלֶכֶת אִתָּהּ
  choice: 要和她一起走
  rationale: הלך在行程语境中是“走、前往”；אִתָּהּ表示陪同拿俄米。“和她一起走”符合现代汉语表达。
- source_word: וַתֶּחְדַּל לְדַבֵּר אֵלֶיהָ
  choice: 就不再劝她了
  rationale: 字面为“便停止对她说话”。结合上文拿俄米一再劝路得回去，此处意为不再劝说；正文采用语境化表达，并以脚注保留较形式对应的译法。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。为避免连续两个“她”造成歧义，按上下文明确写出“拿俄米”和“路得”；正文以“不再劝她”呈现语用含义，脚注保留原文较字面的表达。
