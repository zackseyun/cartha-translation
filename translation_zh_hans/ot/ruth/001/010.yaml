  text: וַ/תֹּאמַ֖רְנָה לָּ֑/הּ כִּי אִתָּ֥/ךְ נָשׁ֖וּב לְ/עַמֵּֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/010.yaml
  text: But they said to her[a], “No, we will return with you to your people.”
translation:
  language: zh_hans
  text: 她们却对拿俄米说：“不，我们要和你一起回到你的族人那里。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较直译：“因为我们要和你一起回到你的族人那里。”
    reason: 保留 כִּי 可按其常见连接意义译为“因为／实在”的可能性，避免完全消除原文在强调与说明之间的张力。
lexical_decisions:
- source_word: וַתֹּאמַרְנָה
  choice: 她们却……说
  rationale: 未完成式连续体推进叙事；结合上下文，用“却”自然表达她们对拿俄米劝阻的反驳，同时保留叙事衔接。
- source_word: לָּהּ
  choice: 对拿俄米
  rationale: 介词 ל 加第三人称阴性单数后缀标示说话对象。正文明确所指为拿俄米，可避免汉语代词指向不清。
- source_word: כִּי
  choice: 不
  rationale: כִּי 在此直接引语和反驳语境中可表达强调与坚持；译作“不”符合现代汉语对劝阻的直接回应，但其较直译的连接或强调意味保留在脚注中。
- source_word: אִתָּךְ
  choice: 和你一起
  rationale: 介词 אֵת 加第二人称阴性单数后缀表达陪同关系；“和你一起”是自然清楚的现代汉语。
- source_word: נָשׁוּב
  choice: 回到
  rationale: שׁוּב 表示返回、回转；“回到”保留本章反复出现的“归回”主题，也能与目的地自然搭配。
- source_word: לְעַמֵּךְ
  choice: 你的族人那里
  rationale: עַם 在此指拿俄米所属的民族共同体，不仅是近亲；“族人”比单说“人民”更符合现代汉语叙事语境。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“拿俄米”在正文中补明代词所指；“族人”表达民族与群体归属。脚注标记置于整句引语之后。
