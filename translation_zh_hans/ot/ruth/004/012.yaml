  text: וִ/יהִ֤י בֵֽיתְ/ךָ֙ כְּ/בֵ֣ית פֶּ֔רֶץ אֲשֶׁר יָלְדָ֥ה תָמָ֖ר לִֽ/יהוּדָ֑ה מִן הַ/זֶּ֗רַע אֲשֶׁ֨ר יִתֵּ֤ן יְהוָה֙ לְ/ךָ֔ מִן הַֽ/נַּעֲרָ֖ה הַ/זֹּֽאת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/012.yaml
  text: And may your house be like the house of Perez[a], whom Tamar bore to Judah[b], from the offspring that Yahweh will give you by this young woman.
translation:
  language: zh_hans
  text: 愿雅威借着这位年轻女子赐给你后裔[b]，使你的家族[a]像他玛为犹大所生的法勒的家族一样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“家”；这里指家庭、家族或延续的家系，并非仅指房屋。
    reason: cultural_note
  - marker: b
    text: “后裔”原文为“种子”；希伯来语常用“种子”指儿女或后代。
    reason: lexical_alternative
lexical_decisions:
- source_word: וִיהִי
  choice: 愿……一样
  rationale: 此处是祝福中的祈愿表达；现代汉语用“愿”自然传达希伯来语的祈愿语气。
- source_word: בֵיתְךָ / כְּבֵית פֶּרֶץ
  choice: 你的家族 / 法勒的家族
  rationale: בַּיִת 在这里不是单指房屋，而指家庭、宗族及延续的家系；“家族”在现代汉语中清楚保留其谱系含义。
- source_word: אֲשֶׁר יָלְדָה תָמָר לִיהוּדָה
  choice: 他玛给犹大生的
  rationale: 直接表达 ילד 的生育含义及 לִיהוּדָה 的关系，符合汉语家谱叙述习惯。
- source_word: מִן הַזֶּרַע
  choice: 借着……后裔
  rationale: מִן 在此说明这个家族得以兴盛、如同法勒家族的途径或来源；“借着”避免强加纯粹因果含义。זֶרַע 字面为“种子”，此处是“后裔”的常见用法。
- source_word: אֲשֶׁר יִתֵּן יְהוָה לְךָ
  choice: 雅威要……赐给你的
  rationale: 保留 נתן 所表达的神所赐予，并用“要”呈现祝福语境中所期待的将来行动。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译呈现希伯来文中的神名，不以称号替代。
- source_word: מִן הַנַּעֲרָה הַזֹּאת
  choice: 从这位年轻女子
  rationale: נַעֲרָה 指年轻女子；“从”保留后裔由她而出的来源关系，“这位”则符合现代汉语对人的得体指称。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；正文采用“雅威”这一现代汉语音译，以区别于“主”等称号，同时脚注不必介入特定宗派解释。
- issue: 祝福中 בֵּית 的范围
  choice: 家族
  alternative: 家、家室、家系
  rationale: 上下文关注婚姻、生育和后代；“家族”既不局限于住宅，也不把含义收窄为政治王朝。
- issue: מִן הַזֶּרַע 与整句祝福的关系
  choice: 借着……后裔
  alternative: 因着……后裔；从……后裔
  rationale: 原文介词短语可表达来源或凭借，句法关系略显宽泛；“借着”保留这种开放性，不把它完全定为原因。
translation_notes:
  register: 采用现代、庄重而易懂的祝福语体。人名使用通行圣经译名“他玛、犹大、法勒”；语序略作调整，使“借着……后裔”与整个家族祝福的关系在汉语中清楚，同时不消除原文介词 מִן 所保留的来源／凭借张力。
