base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/009.yaml
  text: Then Boaz said to the elders and all the people[b][a], “You are witnesses today that I have acquired from the hand of Naomi all that belonged to Elimelech and all that belonged to Chilion and Mahlon.”
translation:
  language: zh_hans
  text: 波阿斯对长老和全体民众说：“今天你们就是见证人：我已经从拿俄米手中取得了[a]原来属于以利米勒的一切，以及原来属于基连和玛伦的一切。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “取得”也可译作“买下”或“购得”；希伯来文这个动词在法律交易中可指通过购买而取得。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 未将叙事性的连接词机械译作“然后”或“于是”；中文上下文可自然表达事件推进，而“说”准确保留主句动作。
- source_word: לַזְּקֵנִים וְכָל הָעָם
  choice: 对长老和全体民众
  rationale: 保留两个受话群体；“全体民众”是现代、清楚且庄重的表达。
- source_word: עֵדִים אַתֶּם הַיּוֹם
  choice: 今天你们就是见证人
  rationale: 保留希伯来文名词谓语“见证人”，并以“就是”体现公开法律声明的郑重语气。
- source_word: כִּי
  choice: 冒号引出见证内容
  rationale: 此处引出他们所见证之事，不宜译成表示原因的“因为”；中文用冒号最自然。
- source_word: קָנִיתִי
  choice: 我已经取得
  rationale: 该动词在此法律交易语境中表示取得权利或产业；“取得”不把具体交易方式限定为现金买卖。
- source_word: אֵת כָּל אֲשֶׁר לֶאֱלִימֶלֶךְ
  choice: 所有原属以利米勒的
  rationale: 希伯来文直译为“所有属于以利米勒的”；“原属”自然表达该产业在转移前的归属。
- source_word: וְאֵת כָּל אֲשֶׁר לְכִלְיוֹן וּמַחְלוֹן
  choice: 以及所有原属基连和玛伦的
  rationale: 与前一分句保持平行，并保留两人的共同关联，未擅自细分各自份额。
- source_word: מִיַּד נָעֳמִי
  choice: 拿俄米手中
  rationale: 保留原文“从……手中”的法律性习语；在中文中也可自然表示由某人掌有或控制。
theological_decisions:
- issue: 波阿斯所进行交易的性质
  choice: 用“取得”描述产业或权利的法律转移
  alternative: “买下”或“购得”
  rationale: 原文动词可以指购买，但本节没有明说付款方式；“取得”既保留法律交易含义，也避免暗示波阿斯购买了人。
- issue: “所有原属……”所指范围
  choice: 不在正文中擅自限定为土地、遗产或某一种具体财产
  alternative: 译作“全部田产”或“全部产业”
  rationale: 原文只说“所有属于……的”，保持概括性可避免加入本节没有明说的范围。
translation_notes:
  register: 采用现代、庄重而易懂的法律见证语体。“全体民众”避免过于古雅的“众民”；人名采用现代中文圣经中通行的译名。正文保留“见证人”“取得”“手中”等原文的法律性表达，同时借助脚注说明词义范围和习语。
