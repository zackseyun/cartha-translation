  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/אֲנִ֨י אָמַ֜רְתִּי אֶגְלֶ֧ה אָזְנְ/ךָ֣ לֵ/אמֹ֗ר קְ֠נֵה נֶ֥גֶד הַֽ/יֹּשְׁבִים֮ וְ/נֶ֣גֶד זִקְנֵ֣י עַמִּ/י֒ אִם תִּגְאַל֙ גְּאָ֔ל וְ/אִם לֹ֨א יִגְאַ֜ל הַגִּ֣ידָ/ה לִּ֗/י ו/אדע כִּ֣י אֵ֤ין זוּלָֽתְ/ךָ֙ לִ/גְא֔וֹל וְ/אָנֹכִ֖י אַחֲרֶ֑י/ךָ וַ/יֹּ֖אמֶר אָנֹכִ֥י אֶגְאָֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/004.yaml
  text: So I thought I should inform you[a], saying, ‘Buy it in the presence of those sitting here and in the presence of the elders of my people. If you will redeem it, redeem it; but if he will not redeem it, tell me, so that I may know, for there is no one besides you to redeem it, and I am after you.’ And he said[b], ‘I will redeem it.’
translation:
  language: zh_hans
  text: 我想该把这事告诉你[a]，说：‘你可以在在座的人和我民中的长老面前买下它。你若肯赎回，就赎回吧；他若不赎回[b]，请告诉我，让我知道，因为除你以外，没有别人可以赎回，而我排在你之后。’他回答说：‘我来赎回。’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“揭开你的耳朵”，是“告诉你”或“让你知道”的习语。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文作“他若不赎回”；有些人按上下文理解为“你若不赎回”，以使人称与前句一致。
    reason: alternative_reading
lexical_decisions:
- source_word: אֶגְלֶה אָזְנְךָ
  choice: 把这事告诉你
  rationale: 这是字面为“揭开你的耳朵”的希伯来语习语，意为使对方知情；译为“把这事告诉你”自然清楚，并以脚注保留原文意象。
- source_word: קְנֵה
  choice: 买下它
  rationale: קנה可指取得或购买；在本节公开办理土地权益的语境中，“买下”既通俗自然，也保留交易含义。宾语“它”承接上文所说的土地。
- source_word: נֶגֶד הַיֹּשְׁבִים
  choice: 当着在座众人的面
  rationale: נגד在这里表示在场者面前，具有公开见证的意味；“在座众人”也反映了分词“坐着的人”。
- source_word: זִקְנֵי עַמִּי
  choice: 我民的长老
  rationale: 直译“我民的长老”，指群体中受承认的领袖；不擅自将עַמִּי限缩为家族或宗族。
- source_word: תִּגְאַל ... גְּאָל
  choice: 你若肯赎回，就赎回吧
  rationale: 保留同一词根的重复和催促语气；“赎回”适合本段亲属依法收回产业的语境，又不把完整的制度解释塞入正文。
- source_word: וְאִם לֹא יִגְאַל
  choice: 他若不赎回
  rationale: 马所拉文本动词为第三人称阳性单数，虽然从前面的第二人称突然转为第三人称，正文仍保留这一真实的语法张力，并在脚注说明按语境理解为第二人称的可能。
- source_word: הַגִּידָה לִּי
  choice: 请告诉我
  rationale: 准确表达直接命令，同时用“请”使现代汉语对话自然庄重。
- source_word: אֵין זוּלָתְךָ לִגְאוֹל
  choice: 除你以外，没有别人可以赎回
  rationale: זוּלָתְךָ表达排他性；“没有别人”清楚呈现其优先顺位，未额外加入原文没有的制度性称号。
- source_word: וְאָנֹכִי אַחֲרֶיךָ
  choice: 而我排在你之后
  rationale: 此处说的是赎回权或责任的先后次序；“排在你之后”比空间性的“在你后面”更清楚。
- source_word: אָנֹכִי אֶגְאָל
  choice: 我来赎回
  rationale: 简洁表达对方接受赎回之权责的答复；宾语由上下文补足。
theological_decisions:
- issue: 亲属与产业法律语境中גאל的译法
  choice: 赎回
  alternative: 尽至亲赎业的责任；买回
  rationale: “赎回”保留גאל的法律、亲属和救赎语义联系，又避免在每次出现时加入“至亲赎业者”等解释性称号。具体制度含义由上下文承载。
- issue: 第二人称转为第三人称的语法张力
  choice: 正文译作“他若不赎回”
  alternative: “你若不赎回”
  rationale: 正文依照WLC所载马所拉文本的第三人称形式，不为行文顺畅而默改人称；脚注同时给出按上下文理解为第二人称的可能。
translation_notes:
  register: 采用现代、庄重而易懂的叙事与法律交涉用语。“我民的长老”略带正式色彩，以贴近原文群体称谓；“赎回”在全节保持一致。正文保留原文第三人称的突变，不静默消解歧义。
