  to: 我想该把这事告诉你[a]，说：‘你可以在在座的人和我民中的长老面前买下它。你若肯赎回，就赎回吧；他若不赎回[b]，请告诉我，让我知道，因为除你以外，没有别人可以赎回，而我排在你之后。’他回答说：‘我来赎回。’
  rationale: 修订仅改善现代标准汉语的句法和行文，并使两个公开见证群体的并列关系更清楚。保留“买下”“赎回”、第三人称“他若不赎回”及相应脚注，从而维持原文的法律语境、术语一致性和文本歧义。
