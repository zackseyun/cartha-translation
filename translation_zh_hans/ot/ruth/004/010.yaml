id: RUT.4.10
reference: Ruth 4:10
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/גַ֣ם אֶת ר֣וּת הַ/מֹּאֲבִיָּה֩ אֵ֨שֶׁת מַחְל֜וֹן קָנִ֧יתִי לִ֣/י לְ/אִשָּׁ֗ה לְ/הָקִ֤ים שֵׁם הַ/מֵּת֙ עַל נַ֣חֲלָת֔/וֹ וְ/לֹא יִכָּרֵ֧ת שֵׁם הַ/מֵּ֛ת מֵ/עִ֥ם אֶחָ֖י/ו וּ/מִ/שַּׁ֣עַר מְקוֹמ֑/וֹ עֵדִ֥ים אַתֶּ֖ם הַ/יּֽוֹם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/010.yaml
  text: And also Ruth the Moabite[a], the wife of Mahlon, I have acquired for myself as a wife, to raise up the name of the dead over his inheritance, so that the name of the dead may not be cut off from among his brothers and from the gate of his place[c][b]. You are witnesses today.
translation:
  language: zh_hans
  text: 我也为自己取得了[a]摩押女子路得，就是玛伦的妻子，为妻，好在死者的产业上为他立名[b]，免得死者的名从他的弟兄中和他本地的城门口断绝[c]。今天你们都是见证人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我为自己买得了她。”希伯来语动词在法律交易中可以有买得、取得的意思。
    reason: lexical_alternative
  - marker: b
    text: 意思是使死者的家系得以延续，并使他的名字和法律地位继续与其承受的产业相连。
    reason: cultural_note
  - marker: c
    text: 城门口是公开处理、见证并裁定法律事务的场所。
    reason: cultural_note
lexical_decisions:
- source_word: וְגַם
  choice: 我也
  rationale: 保留承接上一项法律交易的附加语气，在现代汉语中自然简洁。
- source_word: רוּת הַמֹּאֲבִיָּה
  choice: 摩押女子路得
  rationale: 以现代汉语自然表达其族属和姓名，不采用古奥称谓。
- source_word: אֵשֶׁת מַחְלוֹן
  choice: 玛伦的妻子
  rationale: 原文直说“玛伦的妻子”，并未使用“寡妇”一词，故保留原文表述。
- source_word: קָנִיתִי לִי לְאִשָּׁה
  choice: 我也为自己取得了……作我的妻子
  rationale: קנה具有取得、购得的法律交易含义；“取得”保留法律性质，而“作我的妻子”明确其婚姻目的，避免把路得单独表述为商品。
- source_word: לְהָקִים שֵׁם הַמֵּת עַל נַחֲלָתוֹ
  choice: 好在死者的产业上为他立名
  rationale: 保留“立起名字”的原文意象，并显明死者之名与其世袭产业之间的法律关联。
- source_word: וְלֹא יִכָּרֵת
  choice: 使……不……断绝
  rationale: “断绝”对应 כרת 的严肃法律和家族语境，也符合自然的圣经汉语表达。
- source_word: מֵעִם אֶחָיו
  choice: 不从他的弟兄中
  rationale: 原文直译为“他的弟兄”；虽然语境可能涉及较广的宗族成员，正文不将其解释性扩大。
- source_word: וּמִשַּׁעַר מְקוֹמוֹ
  choice: 也不从他本地的城门口
  rationale: 保留“城门”这一公共法律场所的具体意象；“本地”自然表达 מְקוֹמוֹ。
- source_word: עֵדִים אַתֶּם הַיּוֹם
  choice: 今天你们都是见证人
  rationale: 清楚表达波阿斯向在场众人所作的正式法律宣告。
theological_decisions:
- issue: 波阿斯对路得所采取行动的法律与婚姻性质
  choice: 译作“为自己取得了……作我的妻子”
  alternative: “买了路得作妻子”或“娶了路得”
  rationale: 单译“买了”容易过度突出商品化，单译“娶了”又会淡化 קנה 的交易和赎回背景；所选译法同时保留法律取得和婚姻目的。
- issue: “为死者立名”的含义
  choice: 保留“在死者的产业上为他立名”的意象，并以脚注说明家系和法律地位
  alternative: 直接意译为“延续死者的后代”
  rationale: 原文把名字、产业和公共身份联系起来，不只涉及生育后代；正文保留其神学与法律张力，不缩减为单一解释。
- issue: אֶחָיו 的范围
  choice: 弟兄
  alternative: 亲族或族人
  rationale: 原文采用阳性复数亲属词“弟兄”；即使宗族语境可能使范围较广，也不在正文中自行扩展。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。正文保留“取得”“立名”“断绝”“城门口”等法律及文化意象，并用脚注帮助普通读者理解古代婚姻赎回、产业继承和城门审理的背景。
