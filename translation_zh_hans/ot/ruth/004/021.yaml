  text: And Salmon fathered Boaz[a], and Boaz fathered Obed.
translation:
  language: zh_hans
  text: 撒门生[a]波阿斯；波阿斯生俄备得。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“作波阿斯的父亲”。希伯来语动词是家谱中的惯用词，意思是“生”或“作……的父亲”。
    reason: 词义替代
lexical_decisions:
- source_word: וְ/שַׂלְמוֹן
  choice: 撒门
  rationale: 句首连接词 וְ 承接家谱序列；现代汉语逐句列举家谱时无需机械译出“和”，省译更自然，而连续关系仍清楚。人名按中文圣经通行译名译为“撒门”。
- source_word: הוֹלִיד
  choice: 生
  rationale: 使役形态的 ילד 在家谱中表示“生了、作……的父亲”。“生”是现代中文家谱表达中简洁而通行的用语，并保留父系谱系含义；脚注说明也可译作“作……的父亲”。
- source_word: אֶת
  choice: 不译
  rationale: אֶת 是确定直接宾语标记，现代汉语没有对应词。
- source_word: בֹּעַז
  choice: 波阿斯
  rationale: 采用中文圣经中通行的人名译法。
- source_word: וּ/בֹעַז
  choice: 波阿斯
  rationale: 连接词 וּ 表明家谱链条继续；汉语用逗号并重复人名即可自然表达这种并列承接，无需另加“又”或“和”。
- source_word: הוֹלִיד
  choice: 生
  rationale: 与前一处同一动词保持一致，清楚呈现连续的父系家谱。
- source_word: עוֹבֵד
  choice: 俄备得
  rationale: 采用中文圣经中通行的人名译法。
