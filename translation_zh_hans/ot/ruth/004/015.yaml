id: RUT.4.15
reference: Ruth 4:15
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/הָ֤יָה לָ/ךְ֙ לְ/מֵשִׁ֣יב נֶ֔פֶשׁ וּ/לְ/כַלְכֵּ֖ל אֶת שֵׂיבָתֵ֑/ךְ כִּ֣י כַלָּתֵ֤/ךְ אֲֽשֶׁר אֲהֵבַ֨תֶ/ךְ֙ יְלָדַ֔תּ/וּ אֲשֶׁר הִיא֙ ט֣וֹבָה לָ֔/ךְ מִ/שִּׁבְעָ֖ה בָּנִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/015.yaml
  text: And he will be to you a restorer of life and a sustainer of your old age[a], for your daughter-in-law, who loves you[c][b], has borne him—she who is better to you than seven sons.
translation:
  language: zh_hans
  text: 他必使你重获生气[a]，并扶持你的晚年[b]；因为那爱你的儿媳生了他——她对你比七个儿子还好[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “生气”原文为“生命／性命”；也可译为“使你的生命复苏”。
    reason: lexical_alternative
  - marker: b
    text: “晚年”原文直译为“白发”。
    reason: lexical_alternative
  - marker: c
    text: “七个儿子”中的“七”常象征圆满、充足；这里是说，路得对拿俄米的价值胜过理想中众多儿子所带来的福分。
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיָה
  choice: 他必……
  rationale: 此处完成式带连接词，在妇女对孩子的祝福中表达将来的结果；“必”保留预期和肯定的语气。
- source_word: לְמֵשִׁיב נֶפֶשׁ
  choice: 使你的生命复苏
  rationale: מֵשִׁיב 表示使恢复、使回转；נֶפֶשׁ 在此指生命或整个人，而非专指非物质的“灵魂”。加入“你的”符合希伯来语关系结构在上下文中的所指。
- source_word: וּלְכַלְכֵּל
  choice: 供养你
  rationale: כלכל 在此有维持、供应、养活之意；现代汉语“供养”自然地表达孩子将照料拿俄米晚年的意思。
- source_word: אֶת שֵׂיבָתֵךְ
  choice: 在你年老时
  rationale: שֵׂיבָה 字面指白发，也转指老年；译为时间短语，符合现代汉语习惯。
- source_word: כִּי
  choice: 因为
  rationale: 引出前述祝福的理由，明确保留因果关系。
- source_word: כַלָּתֵךְ
  choice: 你的儿媳
  rationale: 按路得与拿俄米的亲属关系，标准含义是“儿媳”。
- source_word: אֲשֶׁר אֲהֵבַתֶךְ
  choice: 那爱你的
  rationale: 完成式描述已经由行动显明并持续存在的爱；汉语现在时表达自然。
- source_word: יְלָדַתּוּ
  choice: 生了他
  rationale: 阳性单数后缀指前文所说的男婴；不额外补入原文此处没有明说的“儿子”。
- source_word: אֲשֶׁר הִיא טוֹבָה לָךְ
  choice: 她对你……还好
  rationale: טוֹבָה 与比较介词 מן 连用，表示对拿俄米而言更好、更有益；保留关系性的比较。
- source_word: מִשִּׁבְעָה בָּנִים
  choice: 比七个儿子
  rationale: 原文明说“儿子”；“七”在语境中带有圆满、充足的意味，但正文保留具体数字和性别。
theological_decisions:
- issue: נֶפֶשׁ 的译法
  choice: 生命
  alternative: 灵魂；整个人
  rationale: 上下文谈的是拿俄米生命境况的恢复与晚年的供养，并非对灵魂本质作教义陈述；“生命”保留具体、整体性的含义。
- issue: מִשִּׁבְעָה בָּנִים 的性别表达
  choice: 七个儿子
  alternative: 七个孩子
  rationale: 希伯来语明确为“儿子”，且比较建立在古代社会对儿子延续家族和供养老人的期待上，不宜中性化。
- issue: 孩子作为“使生命复苏者”的表达
  choice: 他必使你的生命复苏
  alternative: 愿他使你的生命复苏
  rationale: 语法和语境可带祝福色彩，但此处更自然地陈述妇女预言性的期待；译文不把这种作用扩展为属灵救赎的专门术语。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“使你的生命复苏”保留希伯来语的恢复意象；“供养你”以自然汉语传达晚年照料。拆分末句以避免过长的嵌套定语，并清楚突出路得与“七个儿子”的比较。所有脚注标记均置于相关正文之后。
