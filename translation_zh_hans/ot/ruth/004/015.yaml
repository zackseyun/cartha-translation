  to: 他必使你重获生气[a]，并扶持你的晚年[b]；因为那爱你的儿媳生了他——她对你比七个儿子还好[c]。
  rationale: 修订保留原文对新生男婴的未来性期待（“他必”），以“重获生气”自然表达“恢复生命／性命”，并以“扶持你的晚年”准确对应“维持你的老年”。破折号将路得的身份、爱以及比较性评价维持在同一连贯句法结构中。脚注分别锚定生命、晚年和“七个儿子”的相关说明。
