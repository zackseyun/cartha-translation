  text: וַ/יֹּ֣אמֶר בֹּ֔עַז בְּ/יוֹם קְנוֹתְ/ךָ֥ הַ/שָּׂדֶ֖ה מִ/יַּ֣ד נָעֳמִ֑י וּ֠/מֵ/אֵת ר֣וּת הַ/מּוֹאֲבִיָּ֤ה אֵֽשֶׁת הַ/מֵּת֙ קניתי לְ/הָקִ֥ים שֵׁם הַ/מֵּ֖ת עַל נַחֲלָתֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/005.yaml
  text: Then Boaz said[a], “On the day you acquire the field from the hand of Naomi, you also acquire Ruth the Moabite, the wife of the dead man[c][b], in order to raise up the name of the dead on his inheritance.”
translation:
  language: zh_hans
  text: 波阿斯说[a]：“你从拿俄米手中购得这块田的那一天，也要娶摩押女子路得，就是死者的妻子[b]，好使死者的名在他的产业上得以延续[c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文本后半句按字面可读作“我取得了（或：我购得了）摩押女子路得”；但该句句法存在困难，许多人根据上下文理解为“你也要娶”。
    reason: textual_variant
  - marker: b
    text: 或译：“死者之妻”。
    reason: lexical_alternative
  - marker: c
    text: 意思是延续死者的家系和名分，并维系他与其祖业的关系。
    reason: cultural_note
lexical_decisions:
- source_word: בְּיוֹם קְנוֹתְךָ
  choice: 你……购得……的那一天
  rationale: 保留希伯来语的时间表达和法律交易语气；“购得”既自然，也适合田产赎买的语境。
- source_word: הַשָּׂדֶה מִיַּד נָעֳמִי
  choice: 从拿俄米手中购得这块田
  rationale: “这块田”指当前正在商议的特定田产；“从……手中”保留由其掌管或占有之下转移的法律意味。
- source_word: וּמֵאֵת רוּת הַמּוֹאֲבִיָּה … קניתי
  choice: 也要娶摩押女子路得
  rationale: 马所拉文本的句法及第一人称形式 קניתי 存在困难。叙事语境表明，波阿斯是在说明近亲赎业者购田时一并承担娶路得的义务。中文用“娶”自然表达这里涉及婚姻，而不把人表述为可购买的财物；原文第一人称读法收入脚注。
- source_word: אֵשֶׁת הַמֵּת
  choice: 死者的妻子
  rationale: 直接保留原文“死者之妻”的表达，不用解释性较强的“寡妇”。
- source_word: לְהָקִים שֵׁם הַמֵּת
  choice: 好使死者的名……得以延续
  rationale: 该习语涉及延续死者的家系、名分及其与祖业的关系。“使……得以延续”在现代汉语中自然，并保存核心含义。
- source_word: עַל נַחֲלָתוֹ
  choice: 在他的产业上
  rationale: 较贴近介词 עַל 与“产业”的组合，保留死者之名与其世袭产业相连的法律和家族意涵。
theological_decisions:
- issue: 涉及路得及 קניתי 的文本与句法难题
  choice: 正文按上下文译为对至近亲的要求：购得田产，也要娶路得。
  alternative: 按马所拉文本的元音直译为“我购得了（或：我要娶）摩押女子路得”；也可将“从路得”以不同方式连接到购田分句。
  rationale: קניתי 按马所拉元音是第一人称单数，但上下文中波阿斯是在告知至近亲赎业所附带的责任。正文采用叙事逻辑明确、中文可读的语境义，同时以脚注保存马所拉文本的形式，避免掩盖真实的文本张力。
- issue: “使死者的名在他的产业上得以延续”的文化与神学含义
  choice: 正文保留“名”与“产业”的关联，不直接释为“延续血脉”。
  alternative: 意译为“延续死者的家系，并保住他在祖业中的权益”。
  rationale: 原文同时涉及家系、名分和祖业权利；正文保留其复合意象，脚注提供文化说明，避免将意义缩减为单一的生育或产权概念。
translation_notes:
  register: 采用现代、庄重而通俗的法律叙事语体。“购得”用于田产，“娶”用于路得，避免中文中“购买女子”的不当含义。正文保留“从……手中”“死者的名”“在他的产业上”等原文意象，并以脚注交代文本异读和文化背景。
