  yaml_path: translation/ot/ruth/004/016.yaml
  text: Then Naomi took the child and laid him in her lap[a], and she became his nurse.
translation:
  language: zh_hans
  text: 拿俄米拿起孩子，放在自己怀中，作了他的养育者[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“乳母”或“养母”。希伯来语指照料、抚养孩子的女性；这不一定表示她亲自哺乳，也不表示现代法律意义上的收养关系。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּקַּח
  choice: 抱过来
  rationale: לקח本义为“拿、取”，但宾语是婴孩，现代汉语用“抱过来”既自然，也保留实际接过孩子的动作。
- source_word: הַיֶּלֶד
  choice: 孩子
  rationale: יֶלֶד可指孩子或男孩；上下文所指为新生婴孩，“孩子”更符合年龄和叙事焦点。
- source_word: וַתְּשִׁתֵהוּ בְחֵיקָהּ
  choice: 搂在怀中
  rationale: שׁית表示放置，חֵיק指胸怀或膝怀一带；“搂在怀中”以自然汉语表达亲身安放并抱持婴孩的画面，不将其限定为“膝上”或“胸前”。
- source_word: וַתְּהִי לוֹ
  choice: 作他的
  rationale: היה + ל在此表示进入一种角色或关系；“作他的”简洁地体现这一结果。
- source_word: לְאֹמֶנֶת
  choice: 养母
  rationale: אֹמֶנֶת指照料、养育孩子的女性，可译乳母、养母或照料者。“养母”在现代汉语中较自然，且能表达持续抚养的角色；脚注说明其词义范围，避免误解为现代法律意义上的收养关系。
theological_decisions:
- issue: 拿俄米与孩子关系的性质
  choice: 译作“作他的养母”，强调照料养育的角色
  alternative: 译作“作他的乳母”或“照料他”
  rationale: 原文אֹמֶנֶת描述养育照料者，并未明确断言拿俄米亲自哺乳，也未规定现代法律意义上的收养身份；正文采用自然简洁的“养母”，脚注保留词义张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“抱过来，搂在怀中”符合汉语照料婴孩的自然表达；“养母”避免将אֹמֶנֶת误听为现代医疗职业，同时以脚注交代其他可能译法和语义界限。
