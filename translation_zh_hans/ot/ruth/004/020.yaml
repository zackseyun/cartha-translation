base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/020.yaml
  text: Amminadab fathered Nahshon[a], and Nahshon fathered Salmah.
translation:
  language: zh_hans
  text: 亚米拿达生拿顺，拿顺生撒玛[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文作“撒玛”；有些译本为与平行家谱一致，译作“撒门”。
    reason: 说明本节希伯来文本的人名形式与部分平行家谱及译本所采用的传统形式不同。
lexical_decisions:
- source_word: עַמִּינָדָב
  choice: 亚米拿达
  rationale: 人名按现代中文圣经中通行且易辨认的形式音译。
- source_word: הוֹלִיד
  choice: 生
  rationale: 在父系家谱语境中表示“生了、成为……的父亲”；中文家谱用语“生”简洁自然，也保留原文的男性世系含义。
- source_word: אֶת
  choice: 不单独译出
  rationale: 这是直接宾语标记，现代汉语以语序体现其语法功能。
- source_word: נַחְשׁוֹן
  choice: 拿顺
  rationale: 依希伯来语人名音译，并采用中文圣经读者较熟悉的形式。
- source_word: וְ
  choice: ，
  rationale: 此处连接两个连续的家谱分句；现代汉语用逗号并列比重复“又”更自然，同时不改变原文关系。
- source_word: שַׂלְמָה
  choice: 撒玛
  rationale: 直接反映本节马所拉文本 שַׂלְמָה（Salmah）的形式，不因平行家谱中的传统名称而改作“撒门”。
