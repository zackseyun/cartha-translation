  yaml_path: translation/ot/ruth/004/002.yaml
  text: Then he took ten men from the elders of the city and said[a], “Sit here,” and they sat down.
translation:
  language: zh_hans
  text: 波阿斯从城里的长老中选了[a]十个人，对他们说：“坐在这里。”他们就坐下了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“带来十个人。”原文动词通常意为“拿、带”；在这里可指为办理公开事务而从长老中选定或召集他们。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: 选了
  rationale: לקח的基本义是“拿、取”，在本节城门口办理公开事务的语境中，是为特定目的从长老中选出十人；译作“选了”比直译“带了”更符合现代汉语，同时保留其目的性。
- source_word: עֲשָׂרָה אֲנָשִׁים
  choice: 十个人
  rationale: 原文明确指十名男性；由于后面的“长老”在该历史语境中已经表明其身份，现代汉语用“十个人”自然且不误解为泛指所有性别。
- source_word: מִזִּקְנֵי הָעִיר
  choice: 从城里的长老中
  rationale: 介词מִן具有部分意义，即从全城长老这一群体中选出十人；“城里的长老”也自然表达其公认的城市领袖身份。
- source_word: וַיֹּאמֶר
  choice: 对他们说
  rationale: 直译为“说”；汉语补出受话对象“他们”，使引语衔接自然，不增添实质信息。
- source_word: שְׁבוּ פֹה
  choice: 请坐在这里
  rationale: 复数祈使式שְׁבוּ意为“坐下”，פֹה意为“这里”。加入礼貌词“请”符合现代汉语公开邀请就座的表达，不改变命令或请求的内容。
- source_word: וַיֵּשֵׁבוּ
  choice: 他们就坐下了
  rationale: 保留与前一句“坐”的词语复现；“就”自然表现叙事中的随即响应。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而通顺的叙事语体。“城里的长老”保留古代公共治理背景；“请坐在这里”符合当代普通读者的自然表达。脚注标记[a]置于与词义选择相关的“说”之后，以对应整句前半所述的选人行动。
