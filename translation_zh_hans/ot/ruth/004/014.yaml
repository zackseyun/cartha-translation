base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/014.yaml
  text: Then the women said to Naomi[a], “Blessed be Yahweh, who has not left you without a redeemer today[c][b], and may his name be renowned in Israel.”
translation:
  language: zh_hans
  text: 妇女们对拿俄米说：“雅威当受称颂！他今日没有让你缺少一位救赎者[a][b]。愿他的名在以色列中被传扬[c]！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “救赎者”（希伯来文 go'el）可译作“亲属救赎者”或“保护救赎者”，指在家族法律关系中维护亲属权益、产业或家族延续的近亲。
    reason: lexical_alternative
  - marker: b
    text: 这里的“救赎者”可能特指刚出生的孩子；也有人结合本章中波阿斯所承担的角色，理解为波阿斯，或理解为他借这孩子所带来的救赎。
    reason: alternative_reading
  - marker: c
    text: 希伯来文直译为“愿他的名在以色列中被称说”；这可指他的名被人知晓、传扬或尊崇。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמַרְנָה הַנָּשִׁים אֶל־נָעֳמִי
  choice: 妇女们对拿俄米说
  rationale: 以自然的现代汉语承接叙事；动词阴性复数与“妇女们”一致，定冠词表明是场景中已知的那些妇女。
- source_word: בָּרוּךְ יְהוָה
  choice: 雅威当受称颂
  rationale: 保留希伯来语祝颂公式的庄重语气，并将神的专名 יהוה 音译为“雅威”，不以称号替代。
- source_word: אֲשֶׁר לֹא הִשְׁבִּית לָךְ
  choice: 他……没有使你缺少
  rationale: 较贴近使役式“使停止、使断绝”的结构，同时符合现代汉语表达，意思是雅威没有让拿俄米处于没有救赎者的境地。
- source_word: גֹּאֵל
  choice: 至近亲属救赎者
  rationale: 该词在《路得记》中具有亲属、家族责任及法律救赎含义；此译比单用“救赎者”更能显示亲属角色，又不把具体所指限定为波阿斯或新生儿。
- source_word: הַיּוֹם
  choice: 今天
  rationale: 直接、自然地表达时间副词。
- source_word: וְיִקָּרֵא שְׁמוֹ בְּיִשְׂרָאֵל
  choice: 愿他的名在以色列中受传扬
  rationale: 保留祈愿语气，并表达“他的名被称说”的语用含义；脚注同时说明更直译的形式及其可能涵义。
theological_decisions:
- issue: גֹּאֵל（救赎者）的具体所指
  choice: 正文不明确限定所指，以男性单数代词“他的”延续原文表达。
  alternative: 可专指刚出生、将使拿俄米生命复兴的孩子；也可结合全章理解为履行至近亲属救赎责任的波阿斯。
  rationale: 出生事件及下一节对孩子作用的描述支持以新生儿为近指对象；但全章反复称波阿斯为至近亲属救赎者。希伯来文本没有在本节消除这种张力，译文也不替原文作最终裁断。
- issue: “他的名被称说”的含义
  choice: 译作“愿他的名……受传扬”，正文呈现其名被人称说、知晓的祝愿。
  alternative: 也可较直译为“愿他的名在以色列中被称说”，或理解为“愿他在以色列中享有名声”。
  rationale: קרא 的被动式与“名”连用时，可涉及名字被称说、传扬或受到尊重；采用自然汉语但以脚注保留字面形式和语义范围。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“雅威当受称颂”保留祝颂体；“至近亲属救赎者”虽较长，却有助于呈现 גֹּאֵל 在本书中的家族法律内涵。脚注标记均紧随相关词句，且避免在正文中消解救赎者所指的真实歧义。
