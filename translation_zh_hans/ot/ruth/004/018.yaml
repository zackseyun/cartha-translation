  text: 'These are the generations of Perez: Perez fathered Hezron[a].'
translation:
  language: zh_hans
  text: 以下是法勒斯的后代[a]：法勒斯生希斯仑。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“家系”或“家谱”。
    reason: תּוֹלְדוֹת在家谱语境中既可指所列的后代，也可指家系或家谱记录。
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: 以下是
  rationale: וְ与指示词אֵלֶּה在此引出新的家谱段落。“以下是”以自然的现代汉语表达其篇章衔接和指示功能，不把ו机械译作“和”，也不添加时间意义。
- source_word: תּוֹלְדוֹת
  choice: 后代
  rationale: 该词可指后代、家系或家谱记录。本节随即列出法勒斯的世系，因此“后代”简明自然，同时以脚注保留“家系／家谱”的可能表达。
- source_word: פָּרֶץ
  choice: 法勒斯
  rationale: 采用现代中文圣经读者熟悉的希伯来人名译法。
- source_word: הוֹלִיד
  choice: 生
  rationale: 使役式在家谱中表示“成为……的父亲／生了”。汉语家谱表达用“生”简洁自然，并保留父系谱系的含义。
- source_word: אֶת
  choice: 不另译
  rationale: 该词是希伯来语确定直接宾语标记，现代汉语无须对应词。
- source_word: חֶצְרוֹן
  choice: 希斯仑
  rationale: 采用现代中文圣经读者熟悉的人名译法。
