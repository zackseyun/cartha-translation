base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/007.yaml
  text: 'This was formerly the custom in Israel concerning redemption and exchange[a], to confirm any matter: a man removed his sandal and gave it to his neighbor[c][b], and this was the attestation in Israel.'
translation:
  language: zh_hans
  text: 从前[a]，在以色列，关于赎回和交换，为要确认一切事项[b]，一个人就脱下自己的鞋，交给对方；这就是在以色列作凭证的方式[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在先前的日子里”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“为要确认每一笔交易”。
    reason: lexical_alternative
  - marker: c
    text: 或译：“这就是在以色列所作的见证”。
    reason: lexical_alternative
lexical_decisions:
- source_word: לְפָנִים
  choice: 从前
  rationale: 该词引出对以色列早先习俗的说明；“从前”简洁自然，准确表达过去的时间意义。
- source_word: הַגְּאוּלָּה
  choice: 赎回
  rationale: 在本章亲属土地法律的语境中，指依亲属权利将产业买赎回来；“赎回”保留核心法律含义，又不加入原文未明说的细节。
- source_word: הַתְּמוּרָה
  choice: 转让
  rationale: 该词可指交换或替换；此处属于交易习俗说明，“转让”在现代汉语法律语境中自然，同时脚注保留“交换”这一较贴近字面的可能。
- source_word: לְקַיֵּם כָּל דָּבָר
  choice: 为了确认任何事项
  rationale: לְקַיֵּם 表示确立、确认，כָּל דָּבָר 含义宽泛；此译保留其概括性的法律效力，不把它限定为某一种交易。
- source_word: שָׁלַף
  choice: 脱下
  rationale: 该动词本义为抽出、取下；以鞋为宾语时，“脱下”是现代汉语最自然的表达。
- source_word: נַעֲלוֹ
  choice: 自己的鞋
  rationale: נַעַל 指脚上穿的鞋履，文化背景中可能是凉鞋；正文用较通行的“鞋”，避免不必要地限定样式。
- source_word: לְרֵעֵהוּ
  choice: 交给对方
  rationale: רֵעַ 可指同伴、邻舍或相关的另一人；在这项双方行为中，“对方”清楚表达其关系，同时不暗示现代意义上的邻居。
- source_word: הַתְּעוּדָה
  choice: 作凭证的方式
  rationale: 此词在这里指使交易得到确认的见证或凭据；结合“这就是……”的句式，译为“作凭证的方式”能自然说明脱鞋交付这一程序的证明作用。
