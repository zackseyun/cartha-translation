base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/022.yaml
  text: And Obed fathered Jesse[a], and Jesse fathered David.
translation:
  language: zh_hans
  text: 俄备得生耶西[a]，耶西生大卫。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“生了”；希伯来语家谱中的这个词也可表达“成为……的父亲”。
    reason: 词义替代译法
lexical_decisions:
- source_word: וְ
  choice: （不单独译出）
  rationale: 此处连接家谱末句与前文；现代汉语在连续家谱中无需逐一译作“又”或“和”，省略更自然，衔接关系仍然清楚。
- source_word: עֹבֵד
  choice: 俄备得
  rationale: 采用现代中文圣经中通行、易辨认的人名译法。
- source_word: הוֹלִיד
  choice: 生
  rationale: 使役式 ילד 在家谱中表示“生下、成为……的父亲”。“生”是简洁自然的现代汉语家谱用语，并保留父系血统关系；脚注说明也可译作“生了”或“成为……的父亲”。
- source_word: אֶת
  choice: （不单独译出）
  rationale: 这是直接宾语标记，在汉语中没有独立对应词，其语法功能由语序体现。
- source_word: יִשַׁי / יִשָׁי
  choice: 耶西
  rationale: 采用现代中文圣经中通行的人名译法。
- source_word: דָּוִד
  choice: 大卫
  rationale: 采用现代中文圣经中通行的人名译法。
theological_decisions:
- issue: 家谱动词的译法
  choice: 生
  alternative: 生了；成为……的父亲
  rationale: 本节是以大卫为终点的直系家谱。“生”忠实表达希伯来语的父系家谱含义，语言简洁，也不加入原文以外的神学判断。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语，保持家谱结语的凝练节奏；人名使用简体中文圣经读者熟悉的传统译名。
