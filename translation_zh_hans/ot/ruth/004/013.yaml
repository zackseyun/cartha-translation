  naturalness: “她就作了他的妻子”虽可懂，但现代标准汉语以“她就成了他的妻子”更自然。其余叙事语体庄重、清楚；“同房”恰当地保留了原文委婉语。
  terminology: “雅威”一致呈现 יהוה 的专名性质，合宜。“受孕”比“怀孕”更准确对应此处雅威所赐的 conception；脚注也应避免不够自然的“赐她怀孕”。
