base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/013.yaml
  text: So Boaz took Ruth[a], and she became his wife. He went in to her, and Yahweh granted her conception, and she bore a son.
translation:
  language: zh_hans
  text: 波阿斯娶了路得，她就成了他的妻子。他与她同房，雅威使她受孕[a]，她便生了一个儿子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“雅威赐给她妊娠。”或译：“雅威使她能够受孕。”
    reason: 原文 וַיִּתֵּן יְהוָה לָהּ הֵרָיוֹן 字面为雅威“赐给她妊娠”；正文采用自然汉语“使她受孕”，同时保留雅威为赐下受孕者的明确施动性。
lexical_decisions:
- source_word: וַיִּקַּח
  choice: 娶了
  rationale: לקח的基本义是“取、带走”，在婚姻语境中表示娶妻。现代汉语若直译为“取了路得”会造成误解，因此译作“娶了”，并由下句继续明确婚姻关系。
- source_word: וַתְּהִי לוֹ לְאִשָּׁה
  choice: 她就作了他的妻子
  rationale: 这一表达说明正式的婚姻身份；“作了他的妻子”既自然，也保留希伯来叙事的承接次序。
- source_word: וַיָּבֹא אֵלֶיהָ
  choice: 他与她同房
  rationale: 这是希伯来语指夫妻性结合的委婉表达。“同房”在现代汉语圣经语体中庄重、含蓄，且意义清楚。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以通行的现代汉语音译呈现四字神名，保留原文所用的专名，而不以称号替代。
- source_word: וַיִּתֵּן יְהוָה לָהּ הֵרָיוֹן
  choice: 雅威使她怀孕
  rationale: 原文直陈雅威赐给她妊娠。汉语“使她怀孕”自然清楚，并保留神主动赐下生育的语义；脚注列出更贴近形式的译法。
- source_word: וַתֵּלֶד בֵּן
  choice: 她便生了一个儿子
  rationale: 准确表达“生下儿子”，并以“便”自然承接怀孕与生产的叙事进程。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用以色列之神的四字神名。译作“雅威”保留其专名性质，不用一般称号取代，也不在经文中加入额外神学解释。
- issue: 路得怀孕中的神圣施动者
  choice: 雅威使她怀孕
  alternative: 雅威赐她怀孕；雅威使她能够怀孕
  rationale: 原文明确以雅威为赐下妊娠的施动者。正文保留这一点，同时避免进一步解释生理机制或推导原文未明说的教义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“娶了”避免机械直译造成歧义；“同房”保持原文的委婉；句子以“就、便”呈现希伯来叙事链的推进。
