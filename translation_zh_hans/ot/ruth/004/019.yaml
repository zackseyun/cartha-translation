  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/חֶצְרוֹן
  choice: 希斯仑
  rationale: 人名按现代中文圣经中通行、易辨识的形式音译；句首的连接词在家谱连续列举中不另译，以符合自然中文表达。
- source_word: הוֹלִיד
  choice: 生
  rationale: 使役形态的 ילד 在家谱语境中表示生育、成为某人的父亲；中文家谱用“生”简洁自然，也保留父系谱系的含义。
- source_word: אֶת
  choice: 不单独译出
  rationale: 这是直接宾语标记，在中文中没有独立的对应词，其语法功能由语序体现。
- source_word: רָם
  choice: 兰
  rationale: 人名采用现代中文圣经中较通行的音译形式，避免误解为普通名词。
- source_word: וְ/רָם
  choice: 兰
  rationale: 前缀连接词连接第二个家谱分句；中文用分号已清楚表达并列承接关系，因此不必机械译作“又”或“和”。
- source_word: הוֹלִיד
  choice: 生
  rationale: 与前一分句保持一致，准确而简洁地表达家谱中的父子承接。
- source_word: עַמִּינָדָב
  choice: 亚米拿达
  rationale: 人名采用现代中文圣经中通行且易辨识的音译。
