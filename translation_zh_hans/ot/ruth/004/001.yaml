base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/001.yaml
  text: Boaz had gone up to the gate and sat down there[a], and behold, the kinsman-redeemer of whom Boaz had spoken was passing by. So he said, "Turn aside, sit down here[b], so-and-so." And he turned aside and sat down.
translation:
  language: zh_hans
  text: 波阿斯上到城门口，坐在那里[a]。看哪，波阿斯所说的那位有赎回权的亲属正经过。波阿斯就说：“某某[b]，请转到这边来，坐在这里。”他便转过来坐下了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 古代以色列城门口是公开处理法律和城中事务的场所。
    reason: cultural_note
  - marker: b
    text: 希伯来文作“פְּלֹנִי אַלְמֹנִי”（Peloni Almoni），是类似“某某”的惯用语，刻意不说出此人的姓名。
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלָה הַשַּׁעַר
  choice: 上到城门口
  rationale: עָלָה保留“上去”的方向感；“城门口”在现代汉语中自然指城门区域，而不把其法律功能直接写入正文。
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留原文提示读者注意突发情节的叙事标记及其鲜明感，不将其淡化为单纯的时间连接词。
- source_word: הַגֹּאֵל
  choice: 有赎回权的亲属
  rationale: גֹּאֵל在本书语境中既涉及亲属身份，也涉及赎回的法律权利与责任；此译法比单译“救赎者”更准确，也避免只译“亲属”而丢失法律含义。
- source_word: עֹבֵר
  choice: 正从那里经过
  rationale: 用“正……经过”表达分词所呈现的进行中动作。
- source_word: אֲשֶׁר דִּבֶּר בֹּעַז
  choice: 波阿斯所说的
  rationale: 自然表达此人就是波阿斯先前提到的那一位，同时不补入原文未明说的对象或时间。
- source_word: סוּרָה
  choice: 请转到这边来
  rationale: 保留סור离开原行进路线、转向一旁的含义；“到这边来”使中文直接呼语自然。
- source_word: שְׁבָה פֹה
  choice: 坐在这里
  rationale: 直接、自然地表达命令式和地点副词。
- source_word: פְּלֹנִי אַלְמֹנִי
  choice: 某某
  rationale: 这是有意不说出姓名的占位表达；“某某”在现代汉语中简洁自然，并保留人物匿名这一叙事特征。
- source_word: וַיָּסַר וַיֵּשֵׁב
  choice: 他便转过来坐下了
  rationale: “转过来”呼应波阿斯先前的命令，“坐下”则自然呈现连续完成的动作。
theological_decisions:
- issue: גֹּאֵל的亲属与赎回法律含义
  choice: 有赎回权的亲属
  alternative: 赎回者；至近的亲属
  rationale: 原词在《路得记》的情境中兼具亲属关系和法律赎回角色。正文同时表达两方面，不把它窄化为一般属灵意义的“救赎者”，也不只保留血缘关系。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“看哪”保留原文突显新发展的一刻；直接引语使用礼貌的“请”，符合自然中文而不改变命令内容。脚注标记分别紧随“城门口”场景说明所对应的句段和匿名称呼“某某”。
