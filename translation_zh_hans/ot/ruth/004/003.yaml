base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/003.yaml
  text: Then he said to the redeemer[a], “Naomi, who has returned from the fields of Moab[c][b], is selling the portion of the field that belonged to our brother Elimelech.”
translation:
  language: zh_hans
  text: 他对那位有赎业权的至亲说：“从摩押乡间[c]回来的拿俄米，正在出售[b]原属我们弟兄以利米勒的那份田地[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“那块地产”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“已经卖了”。希伯来语形式可以表示已经完成的行动；正文按正在进行的法律商议译为“正在出售”。
    reason: alternative_reading
  - marker: c
    text: 希伯来语直译“摩押的田野”，是指摩押之地或摩押乡间。
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 他……说
  rationale: 未重复前文已明确的说话者姓名，保留希伯来文第三人称叙事衔接；汉语无需另译连接词也能自然推进叙事。
- source_word: לַגֹּאֵל
  choice: 对那位有赎业权的至亲
  rationale: גֹּאֵל在本段指按宗族关系享有并承担赎回家产责任的人。“有赎业权的至亲”兼顾亲属身份和法律职能，也避免把该词仅理解为一般意义上的“救赎者”。
- source_word: חֶלְקַת הַשָּׂדֶה
  choice: 那份田地
  rationale: חֶלְקָה指划分出来的一份或一块地产；“那份田地”贴近原文，且符合现代汉语土地交易语境。
- source_word: אֲשֶׁר לְאָחִינוּ לֶאֱלִימֶלֶךְ
  choice: 原属我们弟兄以利米勒
  rationale: 介词לְ表达归属关系。“弟兄”保留宗族称谓的宽泛性，不限定为同胞兄弟；“原属”自然表达该田产与以利米勒的关系。
- source_word: מָכְרָה
  choice: 正在出售
  rationale: 该完成式可指已经卖出，也可在当前法律交涉中陈述正在办理的出售事项。正文依场景译为“正在出售”，并以脚注保留“已经卖了”的可能。
- source_word: נָעֳמִי הַשָּׁבָה
  choice: 回来的拿俄米
  rationale: 定冠词分词הַשָּׁבָה修饰拿俄米，指明她是已经返回的那一位；“回来的”简洁自然。
- source_word: מִשְּׂדֵה מוֹאָב
  choice: 从摩押乡间
  rationale: 原文直译为“从摩押的田野”，在此是指摩押地域或乡野。“摩押乡间”既保留田野意象，又符合现代汉语表达。
