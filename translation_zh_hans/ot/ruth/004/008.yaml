  yaml_path: translation/ot/ruth/004/008.yaml
  text: So the redeemer said to Boaz[b][a], “Buy it for yourself,” and he took off his sandal.
translation:
  language: zh_hans
  text: 于是，那位有赎回权的近亲[a]对波阿斯说：“你自己买下吧。”他就脱下自己的鞋[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“赎业至亲”。希伯来语指负有赎回家族产业或维护家族延续责任的近亲。
    reason: lexical_alternative
  - marker: b
    text: 脱鞋是这项交易中确认交易的惯常法律标志；参看4:7。
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 于是……说
  rationale: 叙事性的连续式推动情节发展；“于是”自然表达前后承接。
- source_word: הַגֹּאֵל
  choice: 那位赎业至亲
  rationale: 该词在《路得记》中指有责任赎回家族产业、维护家族延续的近亲。“赎业至亲”在正文中简洁呈现法律与亲属双重含义。
- source_word: לְבֹעַז
  choice: 对波阿斯
  rationale: 按介词与专名的通常句法处理，专名采用现代中文圣经通行译名。
- source_word: קְנֵה
  choice: 买下
  rationale: 命令式，在产业交易语境中译作“买下”直接、自然。
- source_word: לָךְ
  choice: 你自己
  rationale: 强调由波阿斯为自己承接这项购买，保留希伯来语代词结构在语境中的反身意味。
- source_word: וַיִּשְׁלֹף
  choice: 就脱下了
  rationale: 该动词本义为抽出、移除；用于鞋时，“脱下”是现代汉语最自然的表达。
- source_word: נַעֲלוֹ
  choice: 自己的鞋
  rationale: 指古代所穿的鞋履；中文“鞋”自然且不过度限定具体样式。反身领属明确指出是那位至亲的鞋。
theological_decisions:
- issue: הַגֹּאֵל的法律与亲属含义
  choice: 正文译为“赎业至亲”
  alternative: “救赎者”或“至近的亲属”
  rationale: “救赎者”在现代中文中容易被理解为纯粹的神学称号；仅译“至近的亲属”又会遗漏其赎回家产的法律职责。“赎业至亲”兼顾本段语境中的两层意义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“说完”是为使主语与动作衔接清楚所作的轻度显化，不改变事件顺序。脚注标记均置于正文相关词语之后。
