base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/006.yaml
  text: Then the redeemer said[a], “I cannot redeem it for myself, lest I ruin my own inheritance. Redeem for yourself my right of redemption[b], for I cannot redeem it.”
translation:
  language: zh_hans
  text: 于是，那赎业人说[a]：“我不能为自己赎回这产业，免得损害我自己的产业。你自己行使我的赎业权[b]吧，因为我不能赎回。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “赎业人”指比波阿斯亲缘更近、因而享有优先赎业资格的亲属；传统译法也有“至近的亲属”。
    reason: cultural_note
  - marker: b
    text: 也可较直译为“你自己赎回我的赎业”。这里的希伯来语名词既可涉及赎业的权利，也可涉及相应的责任。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַגֹּאֵל
  choice: 赎业人
  rationale: 该词是动词 גאל 的分词，指有权利或责任赎回家族产业的人。“赎业人”简洁保留核心词义；其亲属身份由上下文说明，不强行加入原词本身未明说的成分。
- source_word: לִגְאֹל / גְּאַל / גְּאֻלָּתִי
  choice: 赎回 / 行使赎业权
  rationale: 动词统一译为“赎回”，保留 גאל 词族的重复；名词 גְּאֻלָּה 在本节法律语境中指赎业的权利或责任，译作“赎业权”较自然，也避免被误解为抽象的宗教救赎。
- source_word: לִי
  choice: 为自己
  rationale: 这里表示行为对说话者自身利益和产业的影响，“为自己”准确传达这一受益关系。
- source_word: פֶּן
  choice: 免得
  rationale: 表达说话者所担心的后果，既贴近原文，又符合现代汉语习惯。
- source_word: אַשְׁחִית
  choice: 损害
  rationale: 该使役形式在此指给自己的产业或继承份造成经济、法律上的不利，并非字面毁灭；“损害”准确而不过度推断损失程度。
- source_word: נַחֲלָתִי
  choice: 我自己的产业
  rationale: 指家族承受并传留的产业。“产业”适合本段土地与继承语境；“自己的”显出与将要赎回之产业的对照。
- source_word: לְךָ אַתָּה
  choice: 你自己
  rationale: 独立人称代词 אַתָּה 加强语气，译作“你自己”自然保留强调。
- source_word: כִּי
  choice: 因为
  rationale: 引出他让波阿斯行使赎业权的理由，并重申自己不能赎回。
theological_decisions:
- issue: גְּאֻלָּתִי 所表示的是权利、责任，还是较抽象的“赎业”
  choice: 正文采用“我的赎业权”，脚注保留较直译的可能
  alternative: 我的赎业；我的赎业责任
  rationale: 本段法律交易语境强调此人可转让给波阿斯的优先资格，但希伯来名词本身并未把“权利”和“责任”严格分开，因此正文求清楚，脚注保留其词义张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。保留“赎回／赎业权”的法律性词汇及原文词族重复；“这产业”是依据上下文补出的宾语，使汉语表达完整清楚。
