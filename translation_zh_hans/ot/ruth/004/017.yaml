base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/017.yaml
  text: Then the neighbor women gave him a name[a], saying, “A son has been born to Naomi.” And they named him Obed. He was the father of Jesse, the father of David.
translation:
  language: zh_hans
  text: 邻舍的妇女给他取名，说：“一个儿子为拿俄米而生了[a]。”她们给他取名叫俄备得。他是耶西的父亲，耶西是大卫的父亲。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“一个儿子为拿俄米而生。”妇女们是从路得所生的孩子使拿俄米的家系得以恢复这一角度说的，并不是说拿俄米是孩子的生母。
    reason: 说明 לְנָעֳמִי 所标示的受益者／家族归属关系，并防止将庄重的直译误解为拿俄米亲自生育。
lexical_decisions:
- source_word: הַשְּׁכֵנוֹת
  choice: 邻舍的妇女
  rationale: 该阴性复数名词特指住在附近的妇女；此译同时保留地域关系和性别信息，并符合庄重、自然的现代汉语。
- source_word: וַתִּקְרֶאנָה לוֹ שֵׁם
  choice: 给他取名
  rationale: 原文直译近于“为他叫一个名字”；“给他取名”自然表达命名行为，也保留间接受词 לוֹ 所体现的“给他”。
- source_word: לֵאמֹר
  choice: 说
  rationale: 作为引出下文话语内容的引用式不定词，译作“说”简明自然。
- source_word: יֻלַּד בֵּן לְנָעֳמִי
  choice: 拿俄米有了一个儿子
  rationale: 被动式 יֻלַּד 配合介词 לְ，表达一个儿子“为/给拿俄米而生”。汉语译为“拿俄米有了一个儿子”，既自然，也保留妇女们从拿俄米家系得恢复的角度所作的宣告；脚注说明这不是指拿俄米亲自生育。
- source_word: וַתִּקְרֶאנָה שְׁמוֹ עוֹבֵד
  choice: 她们给他取名叫俄备得
  rationale: 这是常见的希伯来语命名公式；此译为自然现代汉语，同时保留原文在本节中两次提及命名的结构。
- source_word: עוֹבֵד
  choice: 俄备得
  rationale: 按中文圣经通行译名音译该专名，不将其可能含有的“服事者”等词义直接译入正文。
- source_word: אֲבִי
  choice: 父亲
  rationale: 该词在某些语境可泛指祖先，但此处紧接的家谱关系表明两处都宜按直接父子关系译为“父亲”。
- source_word: יִשַׁי
  choice: 耶西
  rationale: 采用现代中文圣经中广为通行的专名译法。
- source_word: דָוִד
  choice: 大卫
  rationale: 采用现代中文圣经中广为通行的专名译法。
theological_decisions:
- issue: “有一个儿子为拿俄米而生”所表达的拿俄米与新生儿的关系
  choice: 正文保留“拿俄米有了一个儿子”，不改写成生物学意义更明确的关系。
  alternative: “拿俄米有了一个孙子”或“拿俄米得着了一个儿子”
  rationale: 原文借邻舍妇女之口，从路得所生的孩子使拿俄米家系得到恢复的角度宣告此事，并非声称拿俄米是孩子的生母。译成“孙子”会消除原文刻意保留的家族与文学张力；译成“得着了”则可能过度解释其关系。因此正文保留张力，脚注加以必要说明。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。专名使用中文圣经通行形式；保留原文两次命名的叙述结构，并以脚注说明“拿俄米有了一个儿子”中的真实歧义与文学张力。
