  text: וַ/יֹּ֤אמֶר בֹּ֨עַז֙ לְ/נַעֲר֔/וֹ הַ/נִּצָּ֖ב עַל הַ/קּֽוֹצְרִ֑ים לְ/מִ֖י הַ/נַּעֲרָ֥ה הַ/זֹּֽאת־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/005.yaml
  text: Then Boaz said to his young man who was set over the reapers[a], “Whose young woman is this?”
translation:
  language: zh_hans
  text: 波阿斯问那位管理收割工人的青年：“这位年轻女子是谁家的？”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这位年轻女子属于谁？”希伯来文是在询问她与谁或哪一家户有关。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 问
  rationale: 该动词本义为“说”，但后接直接问句，现代汉语用“问”更自然，也准确表达此处言语行为；叙事顺承关系由上下文自然体现。
- source_word: בֹּעַז
  choice: 波阿斯
  rationale: 按现代中文圣经人名的通行音译处理。
- source_word: לְנַעֲרוֹ
  choice: 那位……青年
  rationale: נַעַר可指青年、仆人或随从。此处保留年龄与身份并未完全确定的“青年”，其职能由后面的修饰语表达；所属关系在汉语语境中不必生硬译成“他的”。
- source_word: הַנִּצָּב עַל הַקּוֹצְרִים
  choice: 管理收割工人的
  rationale: נצב的Niphal分词与עַל连用，表示被安排在众人之上、负责监督；“管理”自然传达其职能。קֹצְרִים译为“收割工人”，比单说“收割者”更符合现代汉语。
- source_word: לְמִי
  choice: 是谁家的
  rationale: 该表达询问女子归属哪个家庭、家户或社会关系，而不必表示物权。“谁家的”是自然中文，并保留这种关系归属含义。
- source_word: הַנַּעֲרָה הַזֹּאת
  choice: 这位年轻女子
  rationale: נַעֲרָה指年轻女性；“年轻女子”庄重、现代，也不额外认定她是婢女。“这位”自然对应指示词הַזֹּאת。
theological_decisions:
- issue: לְמִי所表达的归属关系
  choice: 译作“是谁家的”，理解为询问家庭或家户关系
  alternative: “这位年轻女子属于谁？”
  rationale: 希伯来语字面结构可表达“归谁”，但在本叙事的社会语境中重点是她与哪一家户或群体有关，并非把她当作财物；正文采用自然且不物化的表达，脚注保留较贴近形式的另一译法。
translation_notes:
  register: 采用现代、清楚而庄重的叙事语言。“青年”保留原词可能兼指年轻随从的宽度，“管理收割工人的”明确其监督职责；问句避免古雅的“谁家女子”，但仍保留古代家户归属的社会背景。
