base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/023.yaml
  text: So she stayed close to Boaz's young women to glean[a], until the end of the barley harvest and the wheat harvest[b]. And she lived with her mother-in-law.
translation:
  language: zh_hans
  text: 于是，她一直紧随波阿斯的女工[a]拾穗，直到大麦收割和小麦收割都结束。她与婆婆同住[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “紧随”所译的希伯来语动词也可译作“紧紧依附于”或“与……紧密相随”，强调亲近而持续的关系。
    reason: lexical_alternative
  - marker: b
    text: “与婆婆同住”也可译作“留在婆婆身边”。原文动词可表示停留、居住或继续住下去。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּדְבַּק
  choice: 紧跟着
  rationale: דבק有“紧贴、依附、紧随”之意；此处表示路得持续与波阿斯的女工在一起。“紧跟着”既保留关系紧密的意味，也符合现代汉语叙事表达。
- source_word: בְּנַעֲרוֹת בֹּעַז
  choice: 波阿斯的女工
  rationale: נַעֲרוֹת字面指年轻女子，结合收割场景是波阿斯手下的女性工人；译作“女工”简明自然，并交代其身份。
- source_word: לְלַקֵּט
  choice: 拾取遗落的麦穗
  rationale: לקט在本书的农业和律法背景中指捡拾收割后遗落的庄稼；此译比单说“拾取”更清楚地传达“拾穗”的具体含义。
- source_word: עַד כְּלוֹת קְצִיר הַשְּׂעֹרִים וּקְצִיר הַחִטִּים
  choice: 直到大麦和小麦都收割完毕
  rationale: עַד כְּלוֹת表示一直延续到完成；此译自然地保留两个先后相接的收割季及整段时间跨度。
- source_word: וַתֵּשֶׁב אֶת חֲמוֹתָהּ
  choice: 她与婆婆同住
  rationale: ישב可表示坐、停留或居住；在这里与“婆婆”连用，最自然的语境意义是共同居住。保留脚注说明“留在……身边”这一可能理解。
theological_decisions: []
