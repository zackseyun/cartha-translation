base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/020.yaml
  text: Naomi said to her daughter-in-law[a], “Blessed be he by Yahweh, whose kindness has not forsaken the living or the dead.” Then Naomi said to her, “The man is a close relative of ours[b]; he is one of our redeemers.”
translation:
  language: zh_hans
  text: 拿俄米对儿媳说：“愿那人蒙耶和华赐福！耶和华没有向活人和死人收回他的慈爱。[a]”拿俄米又对她说：“那人是我们的近亲；他是我们的一位代赎者。[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本句也可理解为：“愿那人蒙耶和华赐福！他没有向活人和死人收回他的慈爱。”按这种理解，“他的慈爱”指波阿斯的恩慈，而不是耶和华的慈爱。
    reason: alternative_reading
  - marker: b
    text: “代赎者”指近亲中按当时制度有权利或责任赎回家族成员或产业的人；也可译作“赎业至亲”或“有权代赎的亲属”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ הוּא לַיהוָה
  choice: 愿那人蒙耶和华赐福
  rationale: 这是一个无系词的祝福语。译作祝愿，既贴合希伯来语功能，也符合现代汉语表达；לַיהוָה 在此表明赐福的来源。
- source_word: חַסְדּוֹ
  choice: 他的慈爱
  rationale: חֶסֶד 可表示恩慈、忠贞之爱或信实的厚待。本节既涉及上帝的眷顾，也涉及借人施行的善待；“慈爱”保留其关系性与神学分量。正文将代词所指理解为耶和华，另一可能见脚注。
- source_word: לֹא עָזַב
  choice: 没有撇弃
  rationale: עָזַב 的基本义是离开、丢弃或撇弃。“没有撇弃……慈爱”较贴近原文意象，并保留关系性的力度。
- source_word: אֶת הַחַיִּים וְאֶת הַמֵּתִים
  choice: 活人和死人
  rationale: 按希伯来语并列结构直译为“活人和死人”，涵盖两者，不额外解释所指人物。
- source_word: קָרוֹב לָנוּ
  choice: 我们的近亲
  rationale: קָרוֹב 在这里指亲属关系上的亲近，而非空间距离；“近亲”简洁自然。
- source_word: מִגֹּאֲלֵנוּ
  choice: 我们的一位代赎者
  rationale: גֹּאֵל 指在以色列亲属制度中有权利或责任为家族成员或产业赎回、维护权益的人。“代赎者”保留核心动词意义，具体法律与亲属含义由脚注说明。
theological_decisions:
- issue: 祝福语中代词的所指：慈爱属于耶和华还是波阿斯
  choice: 正文将“他的慈爱”理解为耶和华的慈爱，并在汉语中重复“耶和华”以使句子清楚。
  alternative: 可将“他的慈爱”理解为波阿斯的恩慈，即愿耶和华赐福给那位没有停止善待活人和死人的人。
  rationale: 关系从句在语法上可以回指较近的“耶和华”，也可能结合上下文指波阿斯。正文采用前者，因为它自然承接祝福公式，并契合全书中上帝借人的行动显出慈爱的主题；脚注保留真实歧义。
- issue: גֹּאֵל 的亲属法律含义
  choice: 正文译作“代赎者”，并以脚注说明其亲属身份及权利或责任。
  alternative: 可译作“赎业至亲”或“有权代赎的亲属”。
  rationale: “代赎者”较简洁，并避免把经文在此处未逐项说明的具体法律职能全部写入正文；脚注补足古代制度背景。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“儿媳”“近亲”均为普通读者熟悉的表达；“代赎者”保留希伯来语法律亲属术语的核心意义，并由脚注解释。正文不加上原文没有的具体人物名称，也不消除祝福语中代词所指的争议。
