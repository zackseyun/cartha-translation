base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/001.yaml
  text: Naomi had a relative of her husband[a], a man of great worth, from the clan of Elimelech[b], and his name was Boaz.
translation:
  language: zh_hans
  text: 拿俄米丈夫的亲属中，有一位是以利米勒宗族的人；他颇有才干和地位，名叫波阿斯。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּלְנָעֳמִי
  choice: 拿俄米……有一个
  rationale: 希伯来语以连词引入新的叙事资料；现代汉语无需另加“那时”或“现在”，即可自然承接上文。
- source_word: מידע לְאִישָׁהּ
  choice: 丈夫那边有一个亲族
  rationale: 该表达指与拿俄米丈夫有联系、为其所认识的人；随后的“以利米勒宗族”使亲属关系成为本处最合语境的理解。“丈夫那边”也保留这层关系是经由她丈夫而来的。
- source_word: אִישׁ גִּבּוֹר חַיִל
  choice: 他很有实力和声望
  rationale: 这一宽泛褒义表达可涵盖能力、实力、财富和社会地位。路得记此处不是军事语境，因此不采用容易使人联想到战士的“勇士”，也不把含义缩窄为单指财富。
- source_word: מִמִּשְׁפַּחַת אֱלִימֶלֶךְ
  choice: 是以利米勒宗族的人
  rationale: מִשְׁפָּחָה通常可指比核心家庭更广的亲属群体；“宗族”符合本叙事所涉及的亲属结构。
- source_word: וּשְׁמוֹ בֹּעַז
  choice: 名叫波阿斯
  rationale: 按现代汉语叙事习惯简洁引入人物姓名。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“丈夫那边”比生硬的“她丈夫的亲族”更自然，并准确表明关系来自拿俄米的丈夫。“有实力和声望”保留原文复合表达的宽度，不将其军事化或仅解释为富有。
