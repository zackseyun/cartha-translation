  naturalness: “她起来去拾取麦穗时”和“他的青年工人”可理解，但“起来拾取……时”及“手下的年轻人”更符合自然、庄重的现代叙事汉语。
  terminology: “波阿斯”“禾捆”“拾取”“羞辱”均恰当。“手下的年轻人”保留נְעָרָיו的男性、年轻人指称，并由上下文交代其为田间属员，避免“青年工人”的生硬职业标签。
