base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/015.yaml
  text: When she rose to glean[a], Boaz commanded his young men, saying, “Let her glean even among the sheaves[b], and do not humiliate her.”
translation:
  language: zh_hans
  text: 她起来拾取时，波阿斯吩咐手下的年轻人说：“即使在禾捆之间，也让她拾取；不可羞辱她。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתָּקָם לְלַקֵּט
  choice: 她起来去拾取麦穗时
  rationale: קום表示起身，לקט在收割背景中指拾取遗落的穗子；用“……时”自然衔接路得的行动与波阿斯随后的吩咐。
- source_word: וַיְצַו ... לֵאמֹר
  choice: 吩咐……说
  rationale: צוה带有权威性的指令意味；“吩咐”既保留其力度，也符合波阿斯对属下说话的现代汉语表达。“说”保留希伯来语引语公式。
- source_word: נְעָרָיו
  choice: 他的青年工人
  rationale: נַעַר可指青年男子、仆役或随从；本段所指是波阿斯手下的男性田间工人。“青年工人”兼顾年龄、性别和工作身份。
- source_word: גַּם
  choice: 就是……也
  rationale: גַּם在这里扩展通常许可的范围，带有“甚至、连……也”的强调意味；“就是……也”自然表达这种递进。
- source_word: בֵּין הָעֳמָרִים
  choice: 在禾捆中间
  rationale: בֵּין本义为“在……之间/中间”，עֳמָרִים指捆好的禾束；“禾捆中间”准确且符合收割场景。
- source_word: תְּלַקֵּט
  choice: 可以让她拾取
  rationale: 未完成式在直接命令中具有准许性的祈使语气；“可以让她”表明波阿斯命令工人容许路得拾取。
- source_word: וְלֹא תַכְלִימוּהָ
  choice: 不可羞辱她
  rationale: כלם的使役形表示使人蒙羞、受辱；“羞辱”保留其社会性和公开贬损的力度，不弱化为仅仅使人尴尬。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“拾取麦穗”帮助普通读者明确古代收割背景中的动作；“青年工人”比单说“青年人”更清楚地交代他们与波阿斯及田间劳作的关系。原文在本节没有必须借脚注保留的神学或句法歧义。
