base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/008.yaml
  text: 'Then Boaz said to Ruth, “Listen, my daughter: do not go to glean in another field, and also do not go away from here, but stay close with my young women.”'
translation:
  language: zh_hans
  text: 波阿斯对路得说：“女儿，你听见了吗？不要到别的田里拾穗，也不要离开这里；要紧跟着我的年轻女工。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֲלוֹא שָׁמַעַתְּ
  choice: 你听我说
  rationale: 字面近于“你岂没有听见吗”，但在此处是引起注意并劝告的惯用表达；译为“你听我说”自然传达语用功能，又保留郑重语气。
- source_word: בִּתִּי
  choice: 女儿
  rationale: 保留波阿斯对路得亲切而带保护意味的称呼，并非亲生关系的说明。
- source_word: לִלְקֹט
  choice: 拾取麦穗
  rationale: “拾取”指在收割者之后捡拾遗落的庄稼；补出“麦穗”使现代读者容易理解本段具体场景。
- source_word: לֹא תַעֲבוּרִי מִזֶּה
  choice: 不要离开这里
  rationale: 该表达可指“不要从这里走开／转到别处”；此译简洁自然，并与前句不得去别田相承。
- source_word: תִדְבָּקִין עִם נַעֲרֹתָי
  choice: 要跟紧我的女工
  rationale: דבק 表示紧跟、依附或留在一起；נַעֲרוֹת 在收割场景中指波阿斯手下的年轻女工。“跟紧”保留行动与归属上的贴近。
