revisions:
- from: 波阿斯回答她说：“你丈夫死后为婆婆所做的一切，以及你怎样离开父亲、母亲和故乡，去到一个你从前[a]并不熟悉的民族中，这些事都有人详详细细告诉我了。”
  to: 波阿斯回答她说：“你丈夫死后为婆婆所做的一切，以及你怎样离开父亲、母亲和故乡，去到一个你从前[a]并不熟悉的民族那里，我都已详尽地听人说过了。”
  rationale: 修订只改善现代汉语搭配和语体：将“民族中”改为“民族那里”，准确表达前往陌生族群；将较口语化的“详详细细告诉我了”改为“详尽地听人说过了”，保留原文被动报告及强调意味。其余内容、语序关系和脚注均维持不变。
