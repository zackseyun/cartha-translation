base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/011.yaml
  text: Then Boaz answered and said to her[a], “I have been fully told all that you have done for your mother-in-law after the death of your husband, and how you left your father and your mother and the land of your birth, and went to a people whom you did not know before.”
translation:
  language: zh_hans
  text: 波阿斯回答她说：“你丈夫死后为婆婆所做的一切，以及你怎样离开父亲、母亲和故乡，去到一个你从前[a]并不熟悉的民族那里，我都已详尽地听人说过了。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “从前”原文直译为“昨天或前天”。
    reason: 保留希伯来语时间习语的字面表达，同时使正文自然易懂。
lexical_decisions:
- source_word: הֻגֵּד הֻגַּד לִי
  choice: 都有人详详细细告诉我了
  rationale: 不定式绝对式与同根的霍普阿勒式动词连用，加强“被告知”的语气。此译保留消息由他人传给波阿斯的被动含义，并以“详详细细”自然表达强调。
- source_word: כֹּל אֲשֶׁר עָשִׂית אֶת חֲמוֹתֵךְ
  choice: 你为婆婆所做的一切
  rationale: “一切”对应כֹּל；结合上下文，将宾语标记下的“做”自然译为“为婆婆所做”，表达路得对婆婆的照顾与付出，但不增添具体行为。
- source_word: אַחֲרֵי מוֹת אִישֵׁךְ
  choice: 你丈夫死后
  rationale: 准确表达时间关系，在现代汉语中比名词化的“在你丈夫死后”更简洁自然，同时保持庄重。
- source_word: וַתַּעַזְבִי
  choice: 你怎样离开
  rationale: “离开”是עזב在此叙事语境中的自然对应词，不采用带有强烈贬义的“抛弃”。
- source_word: אָבִיךְ וְאִמֵּךְ
  choice: 父亲、母亲
  rationale: 分别保留原文对父母双方的明确提及，不合并为“父母”。
- source_word: וְאֶרֶץ מוֹלַדְתֵּךְ
  choice: 故乡
  rationale: מוֹלֶדֶת在这里指本土、出生之地；“故乡”简明自然，符合路得离开摩押本乡的语境。
- source_word: וַתֵּלְכִי אֶל עַם
  choice: 去到一个……民族中
  rationale: “去到”保留הלך所表达的离开原居地而前往另一群体的视角；“民族”在此表达具有共同身份的族群，避免现代政治国家的含义。
- source_word: אֲשֶׁר לֹא יָדַעַתְּ
  choice: 你……并不熟悉
  rationale: ידע在此表示此前没有交往、并不相识，而非缺乏事实知识；对一个群体说“并不熟悉”符合现代汉语。
- source_word: תְּמוֹל שִׁלְשׁוֹם
  choice: 从前
  rationale: 这是表示先前、以往的时间习语；正文用“从前”传达语义，字面形式则收入脚注。
theological_decisions: []
