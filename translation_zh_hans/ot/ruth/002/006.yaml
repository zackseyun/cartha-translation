  yaml_path: translation/ot/ruth/002/006.yaml
  text: Then the young man who was set over the reapers answered and said[a], “She is a young Moabite woman who returned with Naomi from the fields of Moab.”
translation:
  language: zh_hans
  text: 那位负责管理收割者的青年回答说：“她是个年轻的摩押女子，是跟拿俄米从摩押的田野[a]回来的。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“从摩押的田地”；希伯来文为单数，也可集合性地指摩押的田野或农耕地区。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן
  choice: 回答
  rationale: ענה在叙事引语公式中通常表示“回答、回应”；译作“回答”既保留原文惯用表达，也能与后面的“说”自然衔接。
- source_word: הַנַּעַר
  choice: 青年
  rationale: נַעַר可指青年或仆役；本句另以分词短语说明其管理职责，因此不把“管事”等职称直接加入这个名词。
- source_word: הַנִּצָּב עַל הַקּוֹצְרִים
  choice: 管理收割者的
  rationale: נצב与עַל连用，在此语境表示被安排在收割者之上、负有监管职责；“管理……的”以自然现代汉语表达这一职能关系。
- source_word: הַקּוֹצְרִים
  choice: 收割者
  rationale: 该词是קצר的分词名词用法，指从事谷物收割的人；“收割者”直接而清楚。
- source_word: וַיֹּאמַר
  choice: 说
  rationale: אמר的叙事性连续式，译作“说”，与“回答”组成现代汉语自然的引语引介式“回答说”。
- source_word: נַעֲרָה מוֹאֲבִיָּה
  choice: 摩押女子
  rationale: נַעֲרָה指年轻女子，מוֹאֲבִיָּה是阴性族属词；“摩押女子”保留其性别与族属，同时避免“少女”可能带来的年龄过度限定。
- source_word: הִיא
  choice: 她是个
  rationale: 独立代词用于身份说明；汉语以“她是个”自然表达这一识别句。
- source_word: הַשָּׁבָה
  choice: 回来的
  rationale: שוב表示返回；定冠词分词在这里修饰并进一步识别这名女子，译作“回来的”保留其关系从句功能。
- source_word: עִם נָעֳמִי
  choice: 跟拿俄米
  rationale: עִם表示伴随；“跟拿俄米”是清楚自然的现代汉语。
- source_word: מִשְּׂדֵה מוֹאָב
  choice: 从摩押田野
  rationale: שְׂדֵה是单数构造形式，可指一片田地，也可集合性地指某地的田野或农耕地区；正文用“田野”保留农业地域色彩，并以脚注说明单数理解。
