base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/010.yaml
  text: Then she fell on her face and bowed to the ground and said to him[a], “Why have I found favor in your eyes, that you should take notice of me, though I am a foreign woman?”
translation:
  language: zh_hans
  text: 她就俯伏在地，向他下拜，说：“我既是个外族女子，为什么竟能在你眼中蒙恩，蒙你这样留意我[a]呢？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “留意我”也可译作“认出我”、“看重我”或“理会我”。
    reason: 原词 לְהַכִּירֵנִי 在此具有认出、注意、看重或理会等相近含义，正文不宜消除这一词义幅度。
lexical_decisions:
- source_word: וַתִּפֹּל עַל־פָּנֶיהָ
  choice: 她就俯伏在地
  rationale: 希伯来语直译为“伏在自己的脸上”，表示以脸朝地的姿势俯伏。中文用“俯伏在地”自然表达这一谦卑、敬重的动作。
- source_word: וַתִּשְׁתַּחוּ אָרְצָה
  choice: 向他下拜
  rationale: 该动词在此叙事语境中指向地俯身行礼；“下拜”保留敬重与臣服的姿态，却不把它误解为对神的敬拜。宾语“他”依上下文补明。
- source_word: מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: 在你眼中蒙恩
  rationale: 保留希伯来语“在某人眼中找到恩惠”的意象。“蒙恩”在现代中文中仍清楚可懂，也适合此处人际恩待的语境。
- source_word: לְהַכִּירֵנִי
  choice: 使你这样留意我
  rationale: נכר 的使役式在此可表示认出、注意、看重或理会。“留意我”最贴合路得惊讶于波阿斯特别关注她的语境，同时以脚注保留其词义幅度。
- source_word: וְאָנֹכִי נָכְרִיָּה
  choice: 我不过是个外族女子
  rationale: 连接词在语境中带让步或反差意味；“不过”自然显出她的外来身份与波阿斯恩待之间的张力。“外族女子”保留阴性形式，又避免“外邦”可能附带的宗教化色彩。
theological_decisions:
- issue: וַתִּשְׁתַּחוּ 是否含有宗教敬拜之意
  choice: 译作人际礼仪中的“下拜”
  alternative: 译作“敬拜”
  rationale: 上下文描写路得对波阿斯表示深切敬重，并非向神献上敬拜；因此不加入原文在此没有明确表达的宗教含义。
- issue: חֵן 在此是否应作教义化的“恩典”理解
  choice: 译作“蒙恩”，按人际恩惠理解
  alternative: 译作“蒙青睐”或带救恩含义的“得恩典”
  rationale: 这里直接指波阿斯对路得的善意与优待。“蒙恩”保留原文惯用表达，但不把该词限定为系统神学意义上的救恩恩典。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“俯伏在地”“下拜”“在你眼中蒙恩”保留希伯来语的动作与意象；“外族女子”准确表达身份和性别，不使用可能过度宗教化的称谓。
