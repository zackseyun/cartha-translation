  register: 采用现代、庄重而口语自然的叙事表达。“女儿啊”保留亲切称呼；“女工们”适合田间劳动语境。正文以“欺负”表达安全风险，同时用脚注保留希伯来语动词在中性“遇见”与有害接触之间的语义张力。
