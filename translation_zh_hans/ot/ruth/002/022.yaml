base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/022.yaml
  text: Then Naomi said to Ruth her daughter-in-law[a], “It is good, my daughter, that you go out with his young women, so that they do not come upon you in another field.”
translation:
  language: zh_hans
  text: 拿俄米对儿媳路得说：“女儿啊，你和他的女工们一同出去是好的，免得在别的田里有人欺负你[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“免得有人在别的田里遇上你／骚扰你。”希伯来语动词既可泛指“遇见”，也可指带有敌意或伤害性的接触；这里拿俄米担心路得的安全，较可能含有负面意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: 说
  rationale: 叙事中的连续式推进情节；现代汉语无需机械加入“然后”，语序本身已自然承接上文。
- source_word: כַּלָּתָהּ
  choice: 儿媳
  rationale: 准确表达路得与拿俄米的亲属关系；与人名组合成“儿媳路得”符合现代汉语表达。
- source_word: טוֹב
  choice: 是好的
  rationale: 保留原文简单的肯定评价，不强化为“最好”。
- source_word: בִּתִּי
  choice: 女儿啊
  rationale: 这是亲昵的家庭称呼，并非说明亲生关系；语气词“啊”自然传达直接称呼。
- source_word: כִּי
  choice: （引出）你跟着……出去
  rationale: 此处引出拿俄米认为“好”的具体内容；汉语可直接用主谓结构表达，无须硬译为“因为”。
- source_word: תֵצְאִי
  choice: 出去
  rationale: 忠实保留动词“出去”的一般含义，不把上下文中的“拾取麦穗”直接加入动词。
- source_word: נַעֲרוֹתָיו
  choice: 他的女工们
  rationale: 所指是波阿斯手下参与田间劳动的年轻女子；“女工们”在本语境中自然，也比“婢女”更少预设其社会身份。
- source_word: וְלֹא יִפְגְּעוּ בָךְ
  choice: 免得有人……欺负你
  rationale: פגע可指遇见，也可在语境中指带来伤害的接触。拿俄米关心路得在别处的安全，故正文采用较宽泛的负面表达“欺负”；原文复数主语没有明示所指，汉语用“有人”自然保留其不确定性。
- source_word: בְּשָׂדֶה אַחֵר
  choice: 在别的田里
  rationale: 直接表达地点和“另一处”的意思，不误解为“别人的田”。
theological_decisions: []
