    issue: “扛起来”过度限定携带方式。
    rationale: וַתִּשָּׂא意为举起、拿起或携带，并未说明路得将物品扛在肩上。应以“带着”或“拿起”保留原文的开放性。
  - severity: low
    issue: “这些”在单节阅读中指代不够明确。
    rationale: 原文宾语由上下文承接；中文可用“所拾的粮食”明确其所带之物，而不改变意义。
  - severity: low
    issue: 脚注所谓“较直译”的表述不够准确自然。
    rationale: “从自己的饱足中所留下的”在中文中既生硬，也将所有格和介词结构作了误导性的字面化处理。脚注宜只提示“吃饱后”这一语境性表达可译作“吃够了以后”。
