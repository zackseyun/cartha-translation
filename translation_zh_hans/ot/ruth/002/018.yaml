base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/018.yaml
  text: She picked it up and went into the city[a], and her mother-in-law saw what she had gleaned. Then she brought out and gave her what she had left over after she was satisfied.
translation:
  language: zh_hans
  text: 她带着所拾的粮食进了城；她的婆婆看见了她所拾取的。路得又拿出她吃饱后剩下的食物[a]，给了婆婆。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“她吃够了以后所留下的食物”。
    reason: “吃饱后”反映 מִשָּׂבְעָהּ 在此处与剩余食物相关的语境含义；此译法提示同一表达可作“吃够了以后”而不虚构字面结构。
lexical_decisions:
- source_word: וַתִּשָּׂא
  choice: 她把这些扛起来
  rationale: נשׂא表示举起、背负或搬运。上文说明路得已把拾来的大麦打了出来，因此用“扛起来”自然呈现她把所得粮食带回城里的动作；“这些”承接上文，避免添加原文此处未明说的宾语。
- source_word: הָעִיר
  choice: 城
  rationale: עִיר通常指有聚居规模的城邑。译作“城”忠实于常用词义，也与伯利恒这一叙事地点相称。
- source_word: חֲמוֹתָהּ
  choice: 婆婆
  rationale: חמות指丈夫的母亲。现代汉语叙事中“婆婆”比“岳母”或较生硬的亲属说明更准确自然。
- source_word: אֵת אֲשֶׁר לִקֵּטָה
  choice: 她拾来的粮食
  rationale: לקט在本章特指跟在收割者后面拾取遗落的庄稼。结合上文路得已将大麦打出，译作“拾来的粮食”既保留拾穗背景，也符合此时婆婆所看到的成品形态。
- source_word: וַתּוֹצֵא
  choice: 她又拿出
  rationale: יצא的使役式在此意为“拿出、带出”。“拿出”符合路得从随身所带之物中取出食物的场景。
- source_word: וַתִּתֶּן לָהּ
  choice: 给了婆婆
  rationale: 原文阴性代词指路得的婆婆。汉语若连续使用“她”容易混淆施受双方，因此复现“婆婆”，不改变所指。
- source_word: אֵת אֲשֶׁר הוֹתִרָה
  choice: 剩下的食物
  rationale: יתר的使役式表示使某物留下或留有剩余。上下文所指是路得在田间吃饭时留下的食物，故明示“食物”以使现代汉语清楚自然。
- source_word: מִשָּׂבְעָהּ
  choice: 自己吃饱后
  rationale: שׂבע表示饱足，前置介词מִן在这里表达达到饱足以后仍有剩余。译作“吃饱后”准确传达语境含义，“自己”明确该后缀所指为路得。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事用语。“扛起来”体现粮食具有一定分量；“拾来的粮食”保持本章拾穗主题，同时顾及上文已经脱粒的情境。为避免两个阴性代词在汉语中产生歧义，末句用“婆婆”明确受事者。
