  text: וְ/הִנֵּה בֹ֗עַז בָּ֚א מִ/בֵּ֣ית לֶ֔חֶם וַ/יֹּ֥אמֶר לַ/קּוֹצְרִ֖ים יְהוָ֣ה עִמָּ/כֶ֑ם וַ/יֹּ֥אמְרוּ ל֖/וֹ יְבָרֶכְ/ךָ֥ יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/004.yaml
  text: And behold[a], Boaz came from Bethlehem and said to the reapers, “Yahweh be with you.” And they said to him[b], “May Yahweh bless you.”
translation:
  language: zh_hans
  text: 看哪[a]，波阿斯从伯利恒来了，对收割的人说：“愿雅威与你们同在！”他们回答他说：“愿雅威赐福给你[b]！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “看哪”是引人注意的叙事用语，提示波阿斯此时进入场景。
    reason: discourse_marker
  - marker: b
    text: 希伯来语表达祝愿，也可译作：“雅威赐福给你。”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 希伯来语叙事标记使读者注意新人物进入场景；“看哪”简洁而庄重，并保留原文的现场感。
- source_word: בֹּעַז
  choice: 波阿斯
  rationale: 按现代中文圣经人名的通行音译处理。
- source_word: בָּא מִבֵּית לֶחֶם
  choice: 从伯利恒来
  rationale: 直接保留动作与出发地点；原文并未明说“到田里”，因此不予补入。
- source_word: לַקּוֹצְרִים
  choice: 对收割的人
  rationale: 准确表达由 קצר 而来的职业性分词，同时比“收割者”更符合现代汉语口吻。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以中文音译呈现四字神名，而不以“主”这一称号替代。
- source_word: יְהוָה עִמָּכֶם
  choice: 愿雅威与你们同在
  rationale: 原文是无动词短句，字面为“雅威与你们”；在问候兼祝福的语境中，以“愿……同在”自然传达祈愿意味，同时由脚注保留其形式上的开放性。
- source_word: יְבָרֶכְךָ יְהוָה
  choice: 愿雅威赐福给你
  rationale: 未完成式在此具有祈愿或祝福功能；“愿”清楚表现这一语气，第二人称单数“你”对应波阿斯。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文使用神的专名，音译为“雅威”可使专名与称号相区别；不据此加入经文未明说的神学解释。
- issue: יְהוָה עִמָּכֶם 的语气
  choice: 理解为祝愿：“愿雅威与你们同在”
  alternative: 理解为陈述：“雅威与你们同在”
  rationale: 田间问候及工人的对应祝福支持祈愿读法；但希伯来语本身没有明示动词，所以在脚注中保留陈述式的可能。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。对话保留田间问候与祝福的简洁感；不补出原文未明说的目的地或动作。
