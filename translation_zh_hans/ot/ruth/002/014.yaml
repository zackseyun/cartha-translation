base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/014.yaml
  text: At mealtime Boaz said to her[a], “Come here and eat some bread, and dip your piece in the sour wine.” So she sat beside the reapers, and he passed her roasted grain. She ate and was satisfied, and she had some left over.
translation:
  language: zh_hans
  text: 到了吃饭的时候，波阿斯对路得说：“到这里来，吃些饼，把你那一块饼蘸在酸酒里。[a]”她就在收割的人旁边坐下。波阿斯递给她烘过的谷物；她吃了，吃饱了，还剩下一些。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “酸酒”或译“醋”。希伯来语 חֹמֶץ 可指醋，也可指酸酒；在田间用餐的语境中，这里较可能指酸酒。
    reason: lexical_alternative
lexical_decisions:
- source_word: לְעֵת הָאֹכֶל
  choice: 到了吃饭的时候
  rationale: 按工人用餐的时间理解这一时间短语；译文自然，同时保留原文的时间推进。
- source_word: גֹּשִׁי הֲלֹם
  choice: 到这里来
  rationale: 命令式动词与方位副词共同表达靠近说话者的邀请；此译简明自然。
- source_word: וְאָכַלְתְּ מִן הַלֶּחֶם
  choice: 吃些饼
  rationale: 介词 מִן 在食物前有部分义；“些”准确表达取食其中一部分。לֶחֶם 在此具体用餐语境中译作“饼”比泛称“食物”更合适。
- source_word: וְטָבַלְתְּ פִּתֵּךְ בַּחֹמֶץ
  choice: 把你的一块饼蘸在酸酒里
  rationale: פַּת 指一块或一口食物，语境中承接前面的饼；חֹמֶץ 可指醋或酸酒，此处田间工人的餐饮背景较支持“酸酒”，并以脚注保留词义歧义。
- source_word: מִצַּד הַקּוֹצְרִים
  choice: 在收割的人旁边
  rationale: 忠实表达位于收割者一侧的位置，也保留农业场景。
- source_word: וַיִּצְבָּט לָהּ קָלִי
  choice: 波阿斯递给她烘过的麦粒
  rationale: 罕见动词在此表示伸手递送或拿给；קָלִי 是烘烤过的谷物。为使中文叙事清楚，以“波阿斯”明示延续的男性主语。
- source_word: וַתִּשְׂבַּע
  choice: 吃饱了
  rationale: 该动词表示吃到饱足；“吃饱了”比抽象的“满足了”更贴合饮食语境。
- source_word: וַתֹּתַר
  choice: 还有剩下的
  rationale: 保留动词“剩余”的含义，却不擅自明确剩下的是她留存的食物还是一般意义上的余物；中文根据上下文可自然理解。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“收割的人”较“收割者”更口语自然；“烘过的麦粒”便于普通读者理解古代田间食物。脚注标记置于相关引语句末，并保留 חֹמֶץ 的真实词义范围。
