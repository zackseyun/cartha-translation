  text: יְשַׁלֵּ֥ם יְהוָ֖ה פָּעֳלֵ֑/ךְ וּ/תְהִ֨י מַשְׂכֻּרְתֵּ֜/ךְ שְׁלֵמָ֗ה מֵ/עִ֤ם יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁר בָּ֖את לַ/חֲס֥וֹת תַּֽחַת כְּנָפָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/012.yaml
  text: May Yahweh repay your work[a], and may your reward be full from Yahweh, the God of Israel, under whose wings you have come to seek refuge.
translation:
  language: zh_hans
  text: 愿雅威按你所做的报答你；愿你从以色列的上帝雅威那里得到十足的报偿[a]，就是你来在他翅膀下寻求庇护的那一位。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “报偿”或译“工价”。译作“十足”和“报答”的两个希伯来词源自同一词根。
    reason: 保留 מַשְׂכֻּרְתֵּךְ 可指工价或报偿的词义范围，并说明原文中 שׁלם 词根的呼应。
lexical_decisions:
- source_word: יְשַׁלֵּם
  choice: 愿……报答
  rationale: 此处的强化词干形式在波阿斯的祝愿中带有祈愿语气；“愿……报答”既表达祝愿，也保留按行为给予回报的含义。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以通行的现代汉语音译呈现上帝的专名，不以称号替代。
- source_word: פָּעֳלֵךְ
  choice: 你所做的
  rationale: 原词可指工作、行为或所做之事；在此指路得忠诚的行动，“你所做的”自然且不把含义缩窄为受雇劳动。
- source_word: מַשְׂכֻּרְתֵּךְ
  choice: 你的报偿
  rationale: 原词可指工价或酬报；这里所说的是来自上帝的回报，因此“报偿”较合语境，同时脚注保留“工价”这一词义。
- source_word: שְׁלֵמָה
  choice: 十足的
  rationale: 表达完整、充分的意思；“十足的报偿”符合现代汉语，也与前句“报答”形成可感知的呼应。
- source_word: מֵעִם
  choice: 从……那里
  rationale: 这里表示报偿的来源，以“从……那里”清楚、自然地呈现。
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: 以色列的上帝
  rationale: 按原文的属格结构直译，并与专名“雅威”构成同位关系。
- source_word: לַחֲסוֹת
  choice: 来投靠
  rationale: 原词意为寻求或取得庇护；“投靠”兼具趋向与寻求保护之意，适合此处语境。
- source_word: תַּחַת כְּנָפָיו
  choice: 在他的翅膀下
  rationale: 保留原文生动的翅膀意象，不将其释义化为抽象的“保护”。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；采用“雅威”音译，以专名呈现，而不替换为“主”等称号。
- issue: “翅膀”意象的处理
  choice: 保留“在他的翅膀下”
  alternative: 译作“受他的保护”
  rationale: 原文以翅膀描绘雅威的庇护；直保留意象可避免将其神学与文学内涵过早解释为单一抽象概念。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“照你所做的报答你”保留行为与回报的对应；破折号承接原文关系从句，使“来投靠在他的翅膀下”修饰并说明前述“以色列的上帝雅威”，同时避免擅自明确为因果关系。
