  yaml_path: translation/ot/ruth/002/007.yaml
  text: She said[a], ‘Please let me glean and gather among the sheaves after the reapers.’ So she came and has remained from morning until now; she has sat in the house only a little.
translation:
  language: zh_hans
  text: 她说：“请让我跟在收割的人后面，在禾捆之间拾取并收集。”于是她来了，从早晨到现在一直在这里；她在房子里坐着的时间很短。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本句末尾的希伯来原文含义困难。或译：“她只在遮蔽处歇了一小会儿。”“房子”也可能指田间供工人休息的遮蔽处。
    reason: alternative_reading
lexical_decisions:
- source_word: אֲלַקֳטָה נָּא
  choice: 请让我……拾取
  rationale: 意愿式与礼貌语气词共同表达恭敬的请求；“请让我”符合现代汉语，“拾取”也保留了在收割后捡拾遗穗的农业语境。
- source_word: וְאָסַפְתִּי
  choice: 并收集麦穗
  rationale: 与前面的“拾取”有所区别，表达把拾得之物收拢起来；补出“麦穗”使汉语自然，但不改变语境所指。
- source_word: בָעֳמָרִים
  choice: 在禾捆之间
  rationale: עֳמָרִים 指捆扎好的庄稼；“禾捆”准确而通俗，“之间”体现介词在此处的空间含义。
- source_word: אַחֲרֵי הַקּוֹצְרִים
  choice: 跟在收割的人后面
  rationale: 明确保留空间上的“在……后面”，也自然呈现拾穗者跟随收割者的场景。
- source_word: וַתָּב֣וֹא וַֽתַּעֲמֹד
  choice: 于是她来了……一直留在这里
  rationale: תעמד 字面可指“站着”，但与“从早晨直到现在”的持续时段连用时，语境更可能表示一直停留或持续劳作；译为“一直留在这里”避免不自然地暗示她整天站立。
- source_word: מֵאָז הַבֹּקֶר וְעַד עַתָּה
  choice: 从早晨直到现在
  rationale: 直接保留起点和终点，简洁表达持续至说话当下的时段。
- source_word: זֶה שִׁבְתָּהּ הַבַּיִת מְעָט
  choice: 只在棚子里坐了一小会儿
  rationale: 原文句法和个别词义困难；此译按“她在棚屋中停坐的时间很少”理解。הַבַּיִת 字面为“房子”，在田间场景中可能指工人歇息的棚子，故正文采用更合语境的“棚子”，并以脚注保留困难与另一种译法。
