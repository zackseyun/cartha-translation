base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/002.yaml
  text: And Ruth the Moabite said to Naomi[a], “Please let me go to the field and glean among the ears of grain after him in whose eyes I find favor.” And she said to her, “Go[b], my daughter.”
translation:
  language: zh_hans
  text: 摩押女子路得对拿俄米说：“请让我到田里去，我在谁眼中蒙恩，就跟在谁身后拾取麦穗。”拿俄米对她说：“去吧，我女儿。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַמּוֹאֲבִיָּה
  choice: 摩押女子
  rationale: 这是标明路得族属的阴性称谓；“摩押女子”既保留叙事对她外族身份的强调，又比生硬的“摩押妇人”更适合此处语境。
- source_word: אֵלְכָה נָּא
  choice: 请让我……去
  rationale: 意愿式动词与נָא共同表达带敬意的请求，不只是陈述将来的行动。
- source_word: הַשָּׂדֶה
  choice: 田里
  rationale: 指收割庄稼的田地；汉语在“到……去”结构中用“田里”自然且准确。
- source_word: וַאֲלַקֳטָּה
  choice: 拾取
  rationale: לקט在收割背景下指跟随收割者捡拾遗落的庄稼；“拾取”保留具体动作，也符合现代汉语。
- source_word: בַשִּׁבֳּלִים
  choice: 麦穗
  rationale: שִׁבֳּלִים指谷物的穗，而非已捆扎的禾捆。“麦穗”是普通读者易懂的惯用表达，虽不限定具体谷物品种。
- source_word: אַחַר אֲשֶׁר אֶמְצָא חֵן בְּעֵינָיו
  choice: 跟在谁的后面……只要我在他眼中蒙恩
  rationale: 保留אַחַר的跟随含义、关系表达的不定性，以及第三人称阳性单数后缀；同时用“在他眼中蒙恩”保存希伯来语惯用意象。
- source_word: חֵן
  choice: 恩
  rationale: 此处表示得到某人的善意、接纳和准许；放在“在他眼中蒙恩”的固定表达中自然，也不必赋予超出社会语境的系统神学含义。
- source_word: לְכִי בִתִּי
  choice: 去吧，我女儿
  rationale: 简明呈现命令语气和拿俄米亲昵温暖的称呼。
theological_decisions:
- issue: “蒙恩”是否带有专门的救恩含义
  choice: 保留“在他眼中蒙恩”这一希伯来式表达
  alternative: 得到他的善待／得到他的许可
  rationale: 本节首先描述人际关系中的好意与接纳。“蒙恩”可自然表达这一含义，同时保留原文意象；不将其解释为专门的救恩术语。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。保留路得的外族身份、请求的礼貌语气和“在他眼中蒙恩”的希伯来语意象；不添加原文没有的地主、监工或收割者等身份说明。
