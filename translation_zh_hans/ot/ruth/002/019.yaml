base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/019.yaml
  text: And her mother-in-law said to her[a], “Where did you glean today, and where have you worked? Blessed be the one who took notice of you.” So she told her mother-in-law with whom she had worked, and she said, “The name of the man with whom I worked today is Boaz.”
translation:
  language: zh_hans
  text: 她婆婆问她：“你今天在哪里拾取麦穗？在哪里做工？愿那留意你的人蒙福！”于是，她把自己同那人做工的事[a]告诉婆婆，说：“我今天跟他做工的那个人，名叫波阿斯。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语较直译为“她与他所做的事”；下句则为“我今天与他做了〔事〕的那个人”。这里按田间劳作的上下文译作“做工”。
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲמוֹתָהּ
  choice: 她婆婆
  rationale: 在本段明确指丈夫的母亲；“婆婆”是现代汉语中自然、准确的亲属称谓。
- source_word: לִקַּטְתְּ
  choice: 拾取麦穗
  rationale: 该动词在这里特指收拾田间遗落的庄稼；结合路得记的收割场景，“拾取麦穗”既清楚又保留其农业和社会背景。
- source_word: וְאָנָה עָשִׂית
  choice: 在哪里做工
  rationale: עָשִׂית 字面义较宽，可译“做了什么”，但与上下文的田间劳作相连，译作“做工”自然且不改变所指活动。
- source_word: יְהִי מַכִּירֵךְ בָּרוּךְ
  choice: 愿那留意你的人蒙福
  rationale: מַכִּירֵךְ 表示认出、注意或留意她的人；“留意你”保留个人关注之意，也符合波阿斯优待路得的语境。
- source_word: אֵת אֲשֶׁר עָשְׂתָה עִמּוֹ
  choice: 自己跟谁做了工
  rationale: 希伯来语形式上是“她与他所做的事”，但下句随即指出那人的姓名；按田间劳作的语境，以“跟谁做了工”表达实际意义，同时用脚注保留字面结构。
- source_word: אֲשֶׁר עָשִׂיתִי עִמּוֹ
  choice: 我今天跟他做工的
  rationale: עָשִׂיתִי עִמּוֹ 字面为“我与他做了〔事〕”，此处指在与该男子相关的田地中劳作；“跟他做工”是清楚、自然的现代汉语。
- source_word: בֹּעַז
  choice: 波阿斯
  rationale: 采用中文圣经传统中通行且易于辨认的人名音译。
