base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/003.yaml
  text: So she went and came and gleaned in the field behind the reapers[a], and she happened to come to the portion of the field belonging to Boaz, who was from the family of Elimelech.
translation:
  language: zh_hans
  text: 于是她去了，来到田间，跟在收割的人后面捡拾遗落的谷穗。她恰巧[a]来到波阿斯的那一片田地；波阿斯是以利米勒家族的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文以“发生（或临到）”和同根的“偶然际遇”构成习语，强调在人看来是偶然发生的事；本书更广的叙事也引导读者从中看见神的眷顾。
    reason: 说明原文同根词构成的习语，同时保留正文“恰巧”所表达的表面偶然与全书叙事所暗示之眷顾之间的张力。
lexical_decisions:
- source_word: וַתֵּלֶךְ וַתָּבוֹא
  choice: 她去了，来到
  rationale: 保留希伯来叙事中“去—来”的连续动作和鲜明节奏，同时采用自然的现代汉语表达。
- source_word: וַתְּלַקֵּט
  choice: 捡拾遗落的谷穗
  rationale: לקט在收割语境中指跟在收割者后面拾取遗落的庄稼。“捡拾遗落的谷穗”比单说“捡拾”更清楚，又不擅自限定为某一种谷物。
- source_word: בַּשָּׂדֶה
  choice: 在田间
  rationale: 定冠词所指的是正在进行收割的田地区域；“田间”符合现代汉语叙事习惯。
- source_word: אַחֲרֵי הַקֹּצְרִים
  choice: 跟在收割的人后面
  rationale: 此处אַחֲרֵי主要表示空间位置，即路得在收割者身后拾穗；这一译法具体、自然且易懂。
- source_word: וַיִּקֶר מִקְרֶהָ
  choice: 她恰巧来到
  rationale: 原文以同根动词和名词构成强调偶合的习语。“恰巧”自然传达人看来偶然发生的意味，并保留叙事反讽。
- source_word: חֶלְקַת הַשָּׂדֶה לְבֹעַז
  choice: 属于波阿斯的那块田地
  rationale: חֶלְקַת表示一块或一片田地，לְ在这里表示归属；译文明确表达这一土地与波阿斯的关系。
- source_word: אֲשֶׁר מִמִּשְׁפַּחַת אֱלִימֶלֶךְ
  choice: 波阿斯是以利米勒家族的人
  rationale: מִשְׁפָּחָה可指家族或宗族。“家族”既能表达超出核心家庭的亲属群体，也比技术色彩较强的“氏族”自然。
theological_decisions:
- issue: 表面上的偶然与神的眷顾之间的叙事张力
  choice: 正文译作“她恰巧来到”
  alternative: 直译为“她的巧合巧遇了”，或解释性地明说这是神的安排
  rationale: 希伯来文从人的观察角度使用表示偶合的习语，而全书较大的叙事脉络又引导读者体会神的眷顾。正文保留“恰巧”的表层说法，不在翻译中把这种张力预先解释掉。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“收割的人”比“收割者”更口语易懂；“捡拾遗落的谷穗”清楚呈现古代拾穗场景。脚注标记紧随“恰巧”，对应其所解释的希伯来习语。
