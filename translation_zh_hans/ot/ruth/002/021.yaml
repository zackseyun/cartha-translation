  text: וַ/תֹּ֖אמֶר ר֣וּת הַ/מּוֹאֲבִיָּ֑ה גַּ֣ם כִּי אָמַ֣ר אֵלַ֗/י עִם הַ/נְּעָרִ֤ים אֲשֶׁר לִ/י֙ תִּדְבָּקִ֔י/ן עַ֣ד אִם כִּלּ֔וּ אֵ֥ת כָּל הַ/קָּצִ֖יר אֲשֶׁר לִֽ/י׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/021.yaml
  text: Then Ruth the Moabite said[a], “He also said to me, ‘You are to stay close by my young women until they have finished all my harvest.’”
translation:
  language: zh_hans
  text: 摩押女子路得又说：“他还对我说：‘你要一直跟着我手下的年轻人[a]，直到他们把我所有的庄稼都收完。’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “年轻人”：希伯来文为阳性复数，也可指男仆或青年工人。2:8和2:22使用阴性复数，意为“年轻女子”，在这里的劳作场景中可指女工。
    reason: 说明本节阳性复数与相邻经文阴性复数之间的文本张力，并保留语境中的合理词义范围，不将其无说明地协调化。
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: 又说
  rationale: וַ־推动叙事继续发展；结合 גַּם（“还”）所表达的补充信息，用“又说”自然衔接上文，而不把简单的叙事连接处理得过重。
- source_word: רוּת הַמּוֹאֲבִיָּה
  choice: 摩押女子路得
  rationale: 准确保留人物姓名和族属；“摩押女子”是自然、庄重的现代汉语表达，也避免使用生硬或古旧的女性族称。
- source_word: גַּם כִּי אָמַר אֵלַי
  choice: 他还对我说
  rationale: גַּם在这里补充波阿斯先前所说的话；“还”清楚表达递进和追加信息。
- source_word: עִם הַנְּעָרִים אֲשֶׁר לִי
  choice: 跟着我手下的年轻人
  rationale: נְעָרִים是阳性复数，直指“年轻人”，在此也可指波阿斯手下的男仆或青年工人；“我手下的”自然表达其从属关系。介词 עִם 与 דבק 连用，表达保持相随、留在近旁。
- source_word: תִּדְבָּקִין
  choice: 你要一直跟着
  rationale: דבק表示紧随、贴近或不离开；“一直跟着”在此处自然表达持续留在收割人员近旁的实际要求，并与后面的时间终点相呼应。
- source_word: עַד אִם כִּלּוּ
  choice: 直到他们……都收完
  rationale: 准确表达动作持续至某一终点；“都收完”也体现完成含义。
- source_word: אֵת כָּל הַקָּצִיר אֲשֶׁר לִי
  choice: 把我所有的庄稼都收完
  rationale: קָצִיר可指收割、收成或待收的庄稼；在“完成全部收割”的语境中，这一译法自然地保留全部范围和波阿斯的所有关系。
theological_decisions:
- issue: 本节“年轻人”与上下文“使女”的张力
  choice: 正文依照马所拉文本的阳性复数，译为“年轻人”
  alternative: 按2:8及2:22的上下文译为“年轻女子”或“使女”
  rationale: 希伯来文本本节明确使用阳性复数 הַנְּעָרִים，而下一节拿俄米使用阴性复数。译文不以和谐化方式消除这一叙事或文本张力，也不据此引入额外的神学解释。
translation_notes:
  register: 采用现代、清楚而庄重的叙事语言。“又说”“还对我说”保持对话的自然推进；“一直跟着”比字面化的“黏附”更符合当代汉语，同时保留持续贴近、不离开的含义。
