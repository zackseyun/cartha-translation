base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/017.yaml
  text: So she gleaned in the field until evening[a], and beat out what she had gleaned, and it was about an ephah of barley.
translation:
  language: zh_hans
  text: 她在田里拾穗，直到傍晚；又将所拾取的穗子打出谷粒，所得约有一伊法[a]大麦。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “伊法”是古代的干量单位，一伊法约合20—22升。
    reason: cultural_note
lexical_decisions:
- source_word: וַתְּלַקֵּט
  choice: 她……拾取麦穗
  rationale: לָקַט在本段特指跟在收割者后面拾取遗落的穗子；“拾取麦穗”既保留当时的农业习俗含义，也比泛指的“收集”更准确。
- source_word: בַּשָּׂדֶה
  choice: 在田里
  rationale: שָׂדֶה在这里指路得劳作的那块田；现代汉语用“在田里”自然明确。
- source_word: עַד הָעָרֶב
  choice: 直到傍晚
  rationale: 忠实表达她劳作持续到傍晚这一时间界限。
- source_word: וַתַּחְבֹּט
  choice: 打下谷粒
  rationale: חבט指拍打或敲打麦穗，使谷粒脱落；“打下谷粒”具体呈现动作，也避免“脱粒”可能带来的机械化联想。
- source_word: אֵת אֲשֶׁר לִקֵּטָה
  choice: 拾来的麦穗
  rationale: 原文直译为“她所拾取的”；结合动作对象补明“麦穗”，使现代汉语清楚自然。
- source_word: וַיְהִי
  choice: 所得的……有
  rationale: 按上下文将希伯来语结果性叙述自然译为所得数量，同时不额外增添因果含义。
- source_word: כְּאֵיפָה
  choice: 约有一伊法
  rationale: 前缀כְּ表示约数；保留古代容量单位“伊法”，并在脚注说明其大致现代容量。
- source_word: שְׂעֹרִים
  choice: 大麦
  rationale: שְׂעֹרִים明确指大麦；放在“所得的”之后，符合现代汉语表达习惯。
