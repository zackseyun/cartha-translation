base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/009.yaml
  text: Keep your eyes on the field where they are harvesting[a], and follow behind them. Have I not commanded the young men not to touch you? When you are thirsty, go to the jars and drink from what the young men have drawn.
translation:
  language: zh_hans
  text: 你要看着她们收割的那块田地，跟在她们后面。我不是已经吩咐那些年轻人不许碰你[a]吗？你渴了，就到水罐那里，喝年轻人打来的水。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“碰你”；按这里的语境，也可理解为“不得侵犯你”，可能包括骚扰或侵害。
    reason: 保留נגע的字面意义，同时说明其在本段保护性语境中可能具有的较强含义，而不将其限定为单一具体行为。
lexical_decisions:
- source_word: עֵינַיִךְ בַּשָּׂדֶה אֲשֶׁר יִקְצֹרוּן
  choice: 你要留心看她们收割的那块田
  rationale: “你的眼睛”在这里构成含蓄的指令；译作“留心看”既符合现代汉语，也保留专注察看的意思。关系从句说明她们正在收割的是哪块田。
- source_word: וְהָלַכְתִּ אַחֲרֵיהֶן
  choice: 跟在她们后面
  rationale: אַחֲרֵיהֶן带阴性复数后缀，指前文的女工；“跟在她们后面”保留了性别所指和空间关系。
- source_word: הֲלוֹא צִוִּיתִי
  choice: 我不是已经吩咐……吗
  rationale: 保留הֲלוֹא的反问形式及其安慰、保证的语气；“吩咐”自然体现波阿斯对工人的权柄。
- source_word: הַנְּעָרִים
  choice: 年轻人
  rationale: 此处指波阿斯手下的男性青年工人；结合前句的“她们”，汉语语境足以体现群体区别。
- source_word: לְבִלְתִּי נָגְעֵךְ
  choice: 不可碰你
  rationale: 正文保留נגע“触碰”的直接含义，不把语境中可能包含的骚扰或侵害强度直接写死；较强的语境含义放入脚注。
- source_word: וְצָמִת
  choice: 你渴了
  rationale: 以自然的汉语条件表达呈现预期会发生的情形。
- source_word: הַכֵּלִים
  choice: 水罐
  rationale: כֵּלִים泛指器皿；在取水、饮水的场景中，“水罐”是清楚而符合语境的具体表达。
- source_word: וְשָׁתִית מֵאֲשֶׁר יִשְׁאֲבוּן הַנְּעָרִים
  choice: 喝年轻人打来的水
  rationale: “打水”是现代汉语对从井或水源汲水的自然说法；补出宾语“水”是由语境明确提供的信息。
