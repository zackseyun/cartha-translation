base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/016.yaml
  text: And also[a], you must surely pull out some for her from the bundles and leave it, so that she may gather it[b], and you must not rebuke her.
translation:
  language: zh_hans
  text: 你们还要特意从禾捆[a]中抽出一些来，留给她拾取[b]；不可斥责她。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“成捆的禾秆”。希伯来语所指的是收拢成捆的一束束禾秆。
    reason: lexical_alternative
  - marker: b
    text: 或译“让她拾穗”。这个希伯来语动词通常指在收割过的田里拾取遗穗。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: 还
  rationale: 承接上一节的吩咐，并表达进一步追加命令的语气。
- source_word: שֹׁל תָּשֹׁלּוּ
  choice: 务要特意……抽出
  rationale: 以“务要”体现不定式绝对式与限定动词连用的加强语气，以“特意”表明这是有意为路得抽出，而非偶然掉落。
- source_word: לָהּ
  choice: 为她
  rationale: 此处介词表示受益者，即工人要为路得的益处抽出禾穗。
- source_word: מִן הַצְּבָתִים
  choice: 从禾捆里
  rationale: צְבָתִים指收拢成捆的一束束禾秆；“禾捆”简洁自然，也保留收割场景。
- source_word: וַעֲזַבְתֶּם
  choice: 留在那里
  rationale: 指把特意抽出的禾穗留下，好让路得随后拾取；“在那里”使动作关系在中文中更清楚。
- source_word: וְלִקְּטָה
  choice: 让她拾取
  rationale: לקט是田间收割后拾取遗穗的常用词；正文用自然易懂的“拾取”，脚注保留“拾穗”这一较专门的表达。
- source_word: וְלֹא תִגְעֲרוּ בָהּ
  choice: 不可斥责她
  rationale: גער表示严厉责备或呵斥；“斥责”保留其力度，同时保持庄重。
