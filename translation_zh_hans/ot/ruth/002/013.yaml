  text: וַ֠/תֹּאמֶר אֶמְצָא חֵ֨ן בְּ/עֵינֶ֤י/ךָ אֲדֹנִ/י֙ כִּ֣י נִֽחַמְתָּ֔/נִי וְ/כִ֥י דִבַּ֖רְתָּ עַל לֵ֣ב שִׁפְחָתֶ֑/ךָ וְ/אָנֹכִי֙ לֹ֣א אֶֽהְיֶ֔ה כְּ/אַחַ֖ת שִׁפְחֹתֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/013.yaml
  text: Then she said[a], “May I find favor in your eyes, my lord, because you have comforted me and because you have spoken to the heart of your servant, though I am not like one of your female servants.”
translation:
  language: zh_hans
  text: 她说：“我主啊，愿我在你眼中蒙恩！因为你安慰了我，又亲切地对你婢女说话[a]，尽管我并不像你的一个婢女那样。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“又宽慰了你的婢女。”希伯来语直译为“又对你婢女的心说话”。
    reason: 保留希伯来语惯用表达的字面意象，并说明其在本句中可表示亲切或宽慰的话语。
lexical_decisions:
- source_word: אֶמְצָא חֵן
  choice: 愿我……蒙恩
  rationale: 此处第一人称未完成式用于谦恭地表达愿望；“蒙恩”准确传达获得恩待之意，也符合庄重而自然的现代汉语。
- source_word: בְּעֵינֶיךָ
  choice: 在你眼中
  rationale: 保留希伯来语关于评价与恩宠的常见意象，在现代汉语中也易于理解。
- source_word: אֲדֹנִי
  choice: 我主啊
  rationale: 这是路得对波阿斯的尊称，并非神的称号；此译保留其社会处境中的恭敬语气。
- source_word: נִחַמְתָּנִי
  choice: 你安慰了我
  rationale: נחם在此表达对处境脆弱之人的安慰与宽慰，“安慰”直接、自然。
- source_word: דִבַּרְתָּ עַל־לֵב
  choice: 亲切地……说话
  rationale: 该惯用语字面为“对……的心说话”，语境中表示温柔、体贴或令人宽慰地说话；正文采用自然汉语，字面意象列入脚注。
- source_word: שִׁפְחָתֶךָ / שִׁפְחֹתֶיךָ
  choice: 你婢女／你的一个婢女
  rationale: שפחה明确指女性仆役。“婢女”兼顾性别、较低社会身份和路得自称时的谦卑语气，并在两处保持词汇联系。
- source_word: וְאָנֹכִי לֹא אֶהְיֶה כְּאַחַת
  choice: 尽管我连……也不如
  rationale: 该分句在语义上构成让步，强调波阿斯施恩与路得自觉身份低微之间的反差；此译自然表达这种比较和自谦。
