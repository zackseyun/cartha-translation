  text: וְ/סָפְדָ֣ה הָ/אָ֔רֶץ מִשְׁפָּח֥וֹת מִשְׁפָּח֖וֹת לְ/בָ֑ד מִשְׁפַּ֨חַת בֵּית דָּוִ֤יד לְ/בָד֙ וּ/נְשֵׁי/הֶ֣ם לְ/בָ֔ד מִשְׁפַּ֤חַת בֵּית נָתָן֙ לְ/בָ֔ד וּ/נְשֵׁי/הֶ֖ם לְ/בָֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/012/012.yaml
  text: 'And the land will mourn[a], each family by itself: the family of the house of David by itself, and their wives by themselves; the family of the house of Nathan by itself[b], and their wives by themselves.'
translation:
  language: zh_hans
  text: 这地[a]必哀哭，各宗族各自哀哭[b]：大卫家的宗族独自哀哭，他们的妻子也独自哀哭；拿单家的宗族独自哀哭，他们的妻子也独自哀哭。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “这地”也可译作“大地”；按不同语境也可译作“全地”。
    reason: alternative_reading
  - marker: b
    text: 希伯来文重复“宗族”一词，表达“各宗族逐一、分别”的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָפְדָה
  choice: 必哀哭
  rationale: ספד指为死者或灾难哀悼、悲号；“哀哭”既保留公开表达悲痛的意味，又符合现代汉语的庄重语体。未具体化为丧礼仪式。
- source_word: הָאָרֶץ
  choice: 这地
  rationale: אֶרֶץ可指“地、土地、国土”或“全地”。上下文聚焦犹大和耶路撒冷及其宗族，因此译作“这地”，指当地或国土范围，同时以脚注保留“全地”的可能。
- source_word: מִשְׁפָּחוֹת מִשְׁפָּחוֹת
  choice: 一家一家
  rationale: 名词重复具有逐一、分配的作用。“一家一家”以自然汉语再现各家分别哀哭的意思；脚注说明希伯来文的重复形式。
- source_word: לְבָד
  choice: 各自／独自
  rationale: לבד强调分开、单独。总述中用“各自”，列举各宗族和妻子时用“独自”，在汉语中自然地保留原文反复强调彼此分开的效果。
- source_word: מִשְׁפַּחַת בֵּית דָּוִיד
  choice: 大卫家的宗族
  rationale: 该结构指大卫王室家系中的宗族群体。“大卫家”保留王朝家系意味，“宗族”比一般的“家庭”更能表达这里的扩展亲族单位。
- source_word: וּנְשֵׁיהֶם
  choice: 他们的妻子
  rationale: אִשָּׁה可指“女人”或“妻子”；带复数所有格且处于宗族语境中，译作“他们的妻子”最为贴切，并保留男女分开哀哭的描写。
- source_word: מִשְׁפַּחַת בֵּית נָתָן
  choice: 拿单家的宗族
  rationale: 按与“大卫家”相同的结构处理，表达名为拿单的家系或宗族；不在正文中进一步判定拿单的身份。
theological_decisions:
- issue: הָאָרֶץ在预言语境中的范围
  choice: 这地
  alternative: 全地／大地
  rationale: 邻近经文列举犹大和耶路撒冷的特定家系，语境较支持当地或国土范围。此译法不把哀哭扩展为全世界性的事件，同时用脚注保留词语本身较广的可能范围。
- issue: “拿单家”的具体身份
  choice: 保留为“拿单家的宗族”，不作身份说明
  alternative: 明确解释为大卫之子拿单的后裔，或先知拿单的家系
  rationale: 本节本身没有明说拿单是谁；直译家系名称可保存原文的开放性，避免把一种解释写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。为使省略结构在汉语中清楚，在各分句补出“哀哭”；以“各自／独自”的适度变化保留原文四次לְבָד所强调的分开哀哭。人名按现代中文圣经常用译名写作“大卫”“拿单”。
