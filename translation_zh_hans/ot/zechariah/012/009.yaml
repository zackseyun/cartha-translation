base_translation:
  language: en
  yaml_path: translation/ot/zechariah/012/009.yaml
  text: And on that day I will seek to destroy all the nations that come against Jerusalem[a].
translation:
  language: zh_hans
  text: 到那日，我必定意除灭所有前来攻打耶路撒冷的列国。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我必寻求除灭。”希伯来语动词在这里可强调坚定的意图，并非仅指寻找。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: 到……日
  rationale: 这是先知话语中引出未来事件的惯用格式。汉语以“到那日”自然承载这一功能，无须生硬译出“事情将会发生”。
- source_word: בַּיּוֹם הַהוּא
  choice: 到那日
  rationale: 保留先知性时间公式及其未明确界定的指向；“到那日”符合现代汉语圣经语体。
- source_word: אֲבַקֵּשׁ
  choice: 我必定意
  rationale: 该动词在此并非表示尚未找到目标而“寻找”，而是强调有意采取行动、决意达成后接不定式所表达的目标。“定意”既保留意向性，也符合庄重而自然的汉语。
- source_word: לְהַשְׁמִיד
  choice: 除灭
  rationale: 使役式不定词表示使之毁灭。“除灭”力度充分且适合审判语境，又不额外限定毁灭的具体程度或方式。
- source_word: כָּל הַגּוֹיִם
  choice: 所有……列国
  rationale: “所有”保留整体范围；“列国”指各外国族群或国家，不引入后期“外邦人”的身份对立。
- source_word: הַבָּאִים
  choice: 前来
  rationale: 分词修饰列国，描述它们正以敌对行动临近耶路撒冷；译作“前来”简洁自然。
- source_word: עַל יְרוּשָׁלִָם
  choice: 攻打耶路撒冷
  rationale: 介词 עַל 在本语境中具有敌对方向。补出“攻打”可用自然汉语明确这种敌意，而非含混地译为“到耶路撒冷”。
theological_decisions:
- issue: 审判中神的说话者身份与行动主体
  choice: 保留第一人称直接宣告：“我必定意除灭。”
  alternative: 改为非人格化的“他们必被除灭”
  rationale: 希伯来文第一人称单数清楚表明神是说话者，也是对攻击耶路撒冷之列国施行审判的主体，不应弱化或转为被动表达。
- issue: 先知性／末世性时间公式
  choice: 译为“到那日”，不解释具体应验时间。
  alternative: 将“那日”明确解释为某一特定末世时间表中的日期
  rationale: 原文具有先知性分量，却没有在本节界定时间系统；译文保留公式本身，避免加入特定末世论框架。
- issue: אֲבַקֵּשׁ 所表达的意向强度
  choice: 正文采用“定意”，脚注保留较贴近字面的“寻求”。
  alternative: 正文直译为“寻求除灭”
  rationale: 该词确有“寻求”这一词汇核心，但与“除灭”连用时侧重坚定意图。正文传达语境功能，脚注保留词义张力，避免把它绝对化为仅有“决意”一种可能。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“到那日”保留先知书惯用表达；“列国”比“外邦人”更贴近此处国家群体的含义；“除灭”保留审判语气。脚注标记置于整句末，且正文与脚注均使用 [a] 对应。
