  yaml_path: translation/ot/zechariah/012/014.yaml
  text: all the families that remain[a], family by family by themselves, and their wives by themselves.
translation:
  language: zh_hans
  text: 所有余下的家族，各家各自分开；他们的妻子[a]也各自分开。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “妻子”或译“妇女”。这里的希伯来词在本语境中较自然地指各家的妻子。
    reason: 保留 אִשָּׁה 在复数形式中“妻子／妇女”的词义可能性。
lexical_decisions:
- source_word: כֹּל הַמִּשְׁפָּחוֹת הַנִּשְׁאָרוֹת
  choice: 其余所有的家族
  rationale: כֹּל涵盖全部群体，הַנִּשְׁאָרוֹת表示余下、剩余的人；“其余所有的家族”在现代汉语中简洁自然，又不把“余下”过度解释为“幸存”。
- source_word: מִשְׁפָּחֹת מִשְׁפָּחֹת
  choice: 各家
  rationale: 名词重复在这里表示逐一分配，即一个家族一个家族地；“各家”自然表达这种分配意义，避免生硬直译为“家族家族”。
- source_word: לְבָד
  choice: 单独一处
  rationale: 表示彼此分开、各自独处。结合本段分组哀哭的语境，“单独一处”既保留分隔之意，也在不补出原文省略动词的情况下形成自然汉语。
- source_word: וּנְשֵׁיהֶם
  choice: 他们的妻子
  rationale: אִשָּׁה的复数附属形式在家庭语境中最自然地指“妻子”；同时保留希伯来文明确表达的男女分开。
- source_word: לְבָד
  choice: 也单独一处
  rationale: 再次译出重复的לְבָד，以保留原文对妻子另行分开的强调。
theological_decisions:
- issue: 哀哭时男女分开
  choice: 正文保留“他们的妻子也单独一处”
  alternative: 译作“妇女也单独一处”
  rationale: 原文明确区分家族群体与他们的妻子，并两次使用לְבָד。正文不淡化这种分别，也不补充其动机或礼仪含义。
translation_notes:
  register: 采用现代、庄重而易懂的表达。“各家单独一处……也单独一处”保留原文的分配式重复和两次“分开”的强调；不从上文补入“哀哭”等动词，使本节与希伯来原文相同，作为前文句法的延续。
