base_translation:
  language: en
  yaml_path: translation/ot/zechariah/012/003.yaml
  text: And on that day I will make Jerusalem a heavy stone for all the peoples[a]. All who lift it will surely injure themselves[c][b], and all the nations of the earth will gather against her.
translation:
  language: zh_hans
  text: 到那日，我必使耶路撒冷成为万民的一块沉重石头[a]；凡搬抬它的，必被严重割伤[b]。地上万国[c]都必聚集起来攻击她。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“一块供人搬抬的重石”。
    reason: lexical_alternative
  - marker: b
    text: 直译可作：“必被重重割伤。”希伯来文以同根的不定式绝对式和限定动词连用，加强“被割伤”的语气。
    reason: lexical_alternative
  - marker: c
    text: 或译：“那地的万国”。
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה בַיּוֹם הַהוּא
  choice: 到那日
  rationale: 这是先知话语中引出事件的惯用时间表达；“到那日”简洁自然，并保留其预告意味。
- source_word: אָשִׂים
  choice: 我必使
  rationale: שׂים在此带有使耶路撒冷成为某种事物的结果含义；“使”准确表达这一宾语补足结构。
- source_word: אֶת יְרוּשָׁלִַם
  choice: 耶路撒冷
  rationale: 采用现代汉语通行的专名译法。
- source_word: אֶבֶן מַעֲמָסָה
  choice: 一块沉重石头
  rationale: 该短语描绘供人搬抬却沉重危险的石头；正文突出具体形象，脚注保留“使人负重的石头”这一较形式对应的译法。
- source_word: לְכָל הָעַמִּים
  choice: 万民
  rationale: עַמִּים指众多族群或人民；译作“万民”既自然庄重，也与后文גּוֹיִם“万国”保持词汇区别。
- source_word: כָּל עֹמְסֶיהָ
  choice: 凡抬它的
  rationale: עמס表示装载、负载或抬起重物；在石头的具体比喻中，“抬它”最直接。
- source_word: שָׂרוֹט יִשָּׂרֵטוּ
  choice: 必被严重割伤
  rationale: 同根不定式绝对形与限定动词连用，加强动作语气；שׂרט表示划破、割伤。“必被严重割伤”保留被动形式和强烈程度。
- source_word: וְנֶאֶסְפוּ עָלֶיהָ
  choice: 都必聚集起来攻击她
  rationale: אָסף与עַל在此军事性语境中表示敌对聚集；“攻击她”自然明确地传达敌对方向，同时保留耶路撒冷的阴性拟人。
- source_word: כֹּל גּוֹיֵי הָאָרֶץ
  choice: 地上万国
  rationale: 在本段国际性预言语境中，הָאָרֶץ较自然地指全地或世界；“地上万国”简洁传达广泛范围，较局部的“那地”置于脚注。
theological_decisions:
- issue: 聚集攻击耶路撒冷者的范围
  choice: 地上万国
  alternative: 那地的万国
  rationale: הָאָרֶץ既可表示“地/全地”，也可在特定语境中表示“那地”。本节的普世性列国场景支持“地上”，但脚注保留较局部的可能读法，避免把词义歧义教义化。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“万民”与“万国”分别对应עַמִּים与גּוֹיִם；用“她”延续希伯来文对耶路撒冷的阴性拟人。所有脚注标记均置于相关词语之后。
