  source_fidelity: 译文准确呈现了耶和华将“灵”倾倒在大卫家和耶路撒冷居民身上的行动，也保留了马所拉文本从“我”转为“他”的显著人称张力。“恩惠和恳求的灵”、为独生子和长子所作的哀悼比喻均与原文相符。惟“就是他们所刺的”在现代汉语中缺少明确中心词，容易被理解为“他们所刺的事物”，未能清楚承载原文中被刺的个人指涉。
