  terminology: “大卫家”“耶路撒冷的居民”“灵”“独生子”“长子”均恰当。“恩惠和恳求的灵”保留了该短语并非必须指称“圣灵”的开放性；不宜擅自改为“圣灵”。人称转换应继续以脚注说明。
