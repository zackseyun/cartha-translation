  to: 我要把恩惠和恳求的灵浇灌在大卫家和耶路撒冷的居民身上。他们必看向我[a]，就是他们所刺的人；他们要为他哀哭[b]，如同为独生子哀哭，又要为他痛哭，如同为长子痛哭一样。
  rationale: 修订仅作两项安全且必要的表达调整：将“他们所刺的”改为“他们所刺的人”，使原文的个人指涉在现代汉语中明确；将“仰望我”改为较直接的“看向我”，并在脚注保留传统译法。其余措辞保留，以维持原文的比喻、庄重语体，以及“我／他”未被协调的人称张力。
