id: ZEC.12.10
reference: Zechariah 12:10
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/שָׁפַכְתִּי֩ עַל בֵּ֨ית דָּוִ֜יד וְ/עַ֣ל יוֹשֵׁ֣ב יְרוּשָׁלִַ֗ם ר֤וּחַ חֵן֙ וְ/תַ֣חֲנוּנִ֔ים וְ/הִבִּ֥יטוּ אֵלַ֖/י אֵ֣ת אֲשֶׁר דָּקָ֑רוּ וְ/סָפְד֣וּ עָלָ֗י/ו כְּ/מִסְפֵּד֙ עַל הַ/יָּחִ֔יד וְ/הָמֵ֥ר עָלָ֖י/ו כְּ/הָמֵ֥ר עַֽל הַ/בְּכֽוֹר־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/012/010.yaml
  text: And I will pour out on the house of David and on the inhabitants of Jerusalem a spirit of grace and pleas for mercy[a], and they will look to me, the one whom they pierced, and they will mourn for him as one mourns for an only son[c][b], and weep bitterly for him as one weeps bitterly for a firstborn.
translation:
  language: zh_hans
  text: 我要把恩惠和恳求的灵浇灌在大卫家和耶路撒冷的居民身上。他们必看向我[a]，就是他们所刺的人；他们要为他哀哭[b]，如同为独生子哀哭，又要为他痛哭，如同为长子痛哭一样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“仰望我”或“看我”。
    reason: “看向我”表达该动词与介词所表示的朝向性观看；“仰望我”和“看我”均为可行的汉语译法。
  - marker: b
    text: 希伯来文在这里从“我”转为“他”；本译文保留这一人称转换。
    reason: 说明原文中的显著人称张力，避免读者误以为是中文笔误。
lexical_decisions:
- source_word: שָׁפַכְתִּי
  choice: 我要……浇灌
  rationale: 保留“倾倒、浇灌”的比喻，并以中文自然表达将来的神圣行动。
- source_word: רוּחַ חֵן וְתַחֲנוּנִים
  choice: 恩惠和恳求的灵
  rationale: “恩惠”保留 חֵן 的恩宠含义；“恳求”准确而通俗地表达 תַחֲנוּנִים。译作“灵”而不明确写成“圣灵”，以保留所指的开放性。
- source_word: יוֹשֵׁב יְרוּשָׁלִַם
  choice: 耶路撒冷的居民
  rationale: 原文虽用单数形式的集合表达，所指为耶路撒冷的居民整体，中文宜用集合名词。
- source_word: וְהִבִּיטוּ אֵלַי
  choice: 他们必仰望我
  rationale: “仰望”既表达朝向说话者观看，也可包含专注、转向之意；脚注保留较直接的“看我”。
- source_word: אֵת אֲשֶׁר דָּקָרוּ
  choice: 就是他们所刺的
  rationale: 用“就是”连接并标明前面的“我”是被刺者，保留原文关系结构；“刺”不额外限定器具或伤势。
- source_word: וְסָפְדוּ עָלָיו
  choice: 他们要为他哀哭
  rationale: “哀哭”符合为死者举哀的语境；“为他”自然表达 עָלָיו。
- source_word: הַיָּחִיד
  choice: 独生子
  rationale: 在男性语境和丧子比喻中，“独生子”自然传达唯一孩子的重大损失。
- source_word: וְהָמֵר עָלָיו
  choice: 要为他痛哭
  rationale: “痛哭”自然体现原词所含的深切、苦痛哀恸，并与前面的“哀哭”形成递进。
- source_word: הַבְּכוֹר
  choice: 长子
  rationale: 在此丧子比喻中，中文“长子”自然表达男性头生者及其文化分量。
theological_decisions:
- issue: “我”与“他”之间的人称转换
  choice: 保留“仰望我……为他哀哭”
  alternative: 统一译成“仰望我……为我哀哭”，或改为“仰望他……为他哀哭”
  rationale: 马所拉文本从第一人称转为第三人称；正文保留这一突兀而重要的张力，不以解释性协调消除它。
- issue: רוּחַ 是否明确指圣灵
  choice: 译为“灵”，不增译“圣”
  alternative: 译为“恩惠和恳求的圣灵”
  rationale: 原文可能包含神所赐的属灵作用，但没有明说“圣灵”；不加限定可保留词义和神学上的开放性。
- issue: 本节后来形成的基督论解读
  choice: 直接翻译希伯来文本，不在正文加入“弥赛亚”等称谓
  alternative: 在正文明确指出被刺者为弥赛亚
  rationale: 译文应允许经文在更广正典语境中的基督论理解，却不把后来的明确身份称谓增入本节原文。
translation_notes:
  register: 采用现代、庄重且易懂的书面普通话。保留“浇灌”的先知性比喻，以“恩惠和恳求”兼顾准确与可读性；正文中的“我／他”转换按马所拉文本原样保留，并用脚注说明。
