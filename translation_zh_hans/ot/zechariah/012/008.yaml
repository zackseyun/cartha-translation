source:
  edition: WLC
  text: בַּ/יּ֣וֹם הַ/ה֗וּא יָגֵ֤ן יְהוָה֙ בְּעַד֙ יוֹשֵׁ֣ב יְרוּשָׁלִַ֔ם וְ/הָיָ֞ה הַ/נִּכְשָׁ֥ל בָּ/הֶ֛ם בַּ/יּ֥וֹם הַ/ה֖וּא כְּ/דָוִ֑יד וּ/בֵ֤ית דָּוִיד֙ כֵּֽ/אלֹהִ֔ים כְּ/מַלְאַ֥ךְ יְהוָ֖ה לִ/פְנֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/012/008.yaml
  text: On that day Yahweh will shield the inhabitants of Jerusalem[a], and the one who stumbles among them on that day will be like David, and the house of David like God, like the angel of Yahweh before them.
translation:
  language: zh_hans
  text: 到那日，耶和华必护卫耶路撒冷的居民；到那日，他们中间跌倒的必像大卫，大卫家必像上帝，又像在他们前面的耶和华的使者。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “像上帝”也可译作“像众神”或“像神圣的存在”。希伯来语 אֱלֹהִים 在不同语境中可有这些含义；这里较可能是单数的比较。
    reason: 保存原文在 אֱלֹהִים 一词上的真实语义歧义。
lexical_decisions:
- source_word: יָגֵן
  choice: 护卫
  rationale: 该动词表示以遮护、抵御的方式保护；“护卫”自然庄重，并保留防御意味。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名形式译出四字神名，不以称号替代。
- source_word: יוֹשֵׁב יְרוּשָׁלִַם
  choice: 耶路撒冷的居民
  rationale: 单数分词在此具有集合意义，指城中的居民整体。
- source_word: הַנִּכְשָׁל
  choice: 跌倒的
  rationale: 保留 כשל 的具体比喻，不先行限定为“软弱的”或“踉跄的”。
- source_word: בָּהֶם
  choice: 他们中间
  rationale: 介词短语在此表达群体内部的关系。
- source_word: כְּדָוִיד
  choice: 像大卫
  rationale: 直接保留以大卫为比较对象的简洁表达。
- source_word: בֵית דָּוִיד
  choice: 大卫家
  rationale: 保留家族与王朝的双重内涵，符合中文圣经惯用表达。
- source_word: כֵּאלֹהִים
  choice: 像上帝
  rationale: 紧接的单数性比较“像耶和华的使者”较支持指上帝；同时原词也可能有其他含义，故以脚注保存歧义。
- source_word: כְּמַלְאַךְ יְהוָה
  choice: 像耶和华使者
  rationale: מַלְאָךְ 本义为使者，在该固定表达中可指超自然使者；“耶和华使者”既忠实词义，也保留其身份上的经文张力。
- source_word: לִפְנֵיהֶם
  choice: 走在他们前面的
  rationale: 将“在他们前面”的空间表达自然化，同时保留引领或先行的可能意味。
theological_decisions:
- issue: אֱלֹהִים 在大卫家之比较中的含义
  choice: 上帝
  alternative: 众神；神明；神圣的存在
  rationale: 上下文把大卫家与“耶和华使者”并列比较，较可能是单数、崇高的比较，但希伯来词本身可有复数或泛指神性存在的用法，因此不应消除其语义张力。
- issue: מַלְאַךְ יְהוָה 的指称
  choice: 耶和华使者
  alternative: 耶和华的天使
  rationale: 原词既可指一般使者，也可指天使；采用较形式对应的“使者”，避免在正文中提前断定其本体身份。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“到那日”重复两次，以保留原文的强调与节奏；分号呈现两个紧密相连的预言分句。
