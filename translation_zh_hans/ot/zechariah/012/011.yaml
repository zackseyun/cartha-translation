  text: בַּ/יּ֣וֹם הַ/ה֗וּא יִגְדַּ֤ל הַ/מִּסְפֵּד֙ בִּ/יר֣וּשָׁלִַ֔ם כְּ/מִסְפַּ֥ד הֲדַדְ רִמּ֖וֹן בְּ/בִקְעַ֥ת מְגִדּֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/012/011.yaml
  text: On that day the mourning in Jerusalem will become great[a], like the mourning of Hadad-rimmon in the plain of Megiddo.
translation:
  language: zh_hans
  text: 那日，耶路撒冷的哀悼必越发深重，如同米吉多平原上哈达临门[a]的哀悼。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “哈达临门”可能是米吉多附近的一个地方，或许与为约西亚王所发的哀悼有关（参代下35:22–25）；也可能指另一种当时广为人知的哀悼传统。
    reason: 保留该专名所指不明的主要解释可能，并避免将“哀悼传统”限定为歌曲形式。
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: 那日
  rationale: 这是先知书中常见的时间用语；“那日”简洁自然，也保留了原文指向特定未来时刻的意味。
- source_word: יִגְדַּל
  choice: 必越发深重
  rationale: גדל可指“变大、增长”。与“哀悼”搭配时，“越发深重”自然地表达哀悼程度加深，同时保留动态含义。
- source_word: הַמִּסְפֵּד
  choice: 哀悼
  rationale: מִסְפֵּד常指因死亡而有的公开哀悼或哀哭；“哀悼”庄重、通顺，也能涵盖群体性的悲恸与哀哭。
- source_word: בִּירוּשָׁלִַם
  choice: 耶路撒冷
  rationale: 采用现代中文圣经及通行译名；介词含义由句法“耶路撒冷的哀悼”自然体现。
- source_word: כְּמִסְפַּד
  choice: 如同……的哀悼
  rationale: 比较前缀כְּ译作“如同”；附属结构译作“……的哀悼”，避免擅自确定这是“为某人”而哀悼。
- source_word: הֲדַד רִמּוֹן
  choice: 哈达临门
  rationale: 按通行中文音译保留专名，不在正文中断定它是地点、人物、神祇或某种哀悼传统。
- source_word: בְּבִקְעַת מְגִדּוֹן
  choice: 米吉多平原上
  rationale: בִּקְעָה指宽阔的谷地或平原；此处译作“平原”符合地形含义，“上”使现代汉语表达自然。
theological_decisions:
- issue: “哈达临门”的所指
  choice: 正文保留专名，仅说“哈达临门的哀悼”，不明确其历史背景。
  alternative: 解释为在米吉多附近为约西亚王举行的哀悼，或解释为与哈达—临门相关的另一种著名哀歌传统。
  rationale: 希伯来文本只提到该名称，并未说明其所指。保留这种含混可避免把有争议的历史或宗教解释写进正文。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“越发深重”传达动词所含的增长意味；重复“哀悼”呼应原文同一词根的重复。脚注标记紧随存在解释歧义的专名。
