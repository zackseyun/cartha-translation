base_translation:
  language: en
  yaml_path: translation/ot/zechariah/012/006.yaml
  text: On that day I will make the clans of Judah like a firepot among wood[a], and like a flaming torch among sheaves; and they will consume all the surrounding peoples, on the right and on the left. And Jerusalem will again dwell in her own place[b], in Jerusalem.
translation:
  language: zh_hans
  text: '那日，我必使犹大的首领[a]像木柴中的火盆，又像禾捆中的火把；他们必向左右吞灭四围的一切民族。耶路撒冷仍必在自己的地方居住，就是在耶路撒冷。


    [a] “首领”也可译作“宗族”或“宗族首领”；原词可指群体的领袖，也可指其所代表的宗族单位。


    [b] 原文直译为“在她自己下面”，是指在自己的地方居住的惯用表达。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “首领”也可译作“宗族”或“宗族首领”；原词可指群体的领袖，也可指其所代表的宗族单位。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“在她自己下面”，是指在自己的地方居住的惯用表达。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַלֻּפֵי יְהוּדָה
  choice: 犹大的首领
  rationale: אַלּוּף可指宗族或军事群体的领袖，也可能借领袖指其宗族单位。撒迦利亚书12章的近邻经文以这些人思量、发言并受耶和华坚固，较支持有行动能力的“首领”；脚注保留“族长”及宗族单位的可能性。
- source_word: כְּכִיּוֹר אֵשׁ בְּעֵצִים
  choice: 像木柴中的火盆
  rationale: כִּיּוֹר本指盆或容器，在“火”与“木柴”的语境中指盛火、足以点燃周围燃料的火盆；译文保留容器和燃烧的双重意象。
- source_word: וּכְלַפִּיד אֵשׁ בְּעָמִיר
  choice: 又像禾捆中的火把
  rationale: לַפִּיד אֵשׁ是燃烧的火把；עָמִיר可指禾捆或堆积的庄稼秸秆。“禾捆”自然、具体，并保留农业意象。
- source_word: וְאָכְלוּ
  choice: 吞灭
  rationale: 该动词字面为“吃”，此处以火焰吞噬燃料比喻毁灭。“吞灭”既保留吞噬感，也符合庄严的战争语境。
- source_word: עַל יָמִין וְעַל שְׂמֹאול
  choice: 向右向左
  rationale: 保留原文的方向性表达，不将其直接释为较概括的“四面八方”。
- source_word: כָּל הָעַמִּים סָבִיב
  choice: 四围的一切民族
  rationale: עַמִּים是复数“民、民族”，不必限定为现代政治意义的国家；סָבִיב描写他们围绕在四周。
- source_word: וְיָשְׁבָה יְרוּשָׁלַם
  choice: 耶路撒冷仍必安居
  rationale: ישׁב可指居住、坐落或安居。以城为主语带有人格化色彩；“安居”在现代汉语中自然，并表达恢复稳定居所的语境。
- source_word: עוֹד תַּחְתֶּיהָ
  choice: 仍……在自己的原处
  rationale: תַּחְתֶּיהָ字面是“在她自己下面”，在此为留在或恢复于本位的惯用说法；正文译出语义，脚注保存字面形式。
- source_word: בִּירוּשָׁלַם
  choice: 就是耶路撒冷
  rationale: 原文末尾再次说“在耶路撒冷”，形成强调性的重复。汉语用“就是”衔接，避免误读为另一个地点，同时保留重复所强调的本城本地。
theological_decisions:
- issue: אַלֻּפֵי יְהוּדָה所指的群体身份
  choice: 正文译为“犹大的首领”
  alternative: “犹大的宗族（或各族）”
  rationale: 该词确有领袖与宗族单位之间的词义张力。近邻语境把他们描写为思量、发言并被坚固的主体，因此正文采用“首领”，但不把预言的应许限定为精英个人；脚注明示他们也可作为宗族群体的代表。
- issue: 耶路撒冷“居住”的主语与含义
  choice: 保留城市人格化，译作“耶路撒冷仍必安居”
  alternative: “耶路撒冷仍必有人居住”
  rationale: 原文以耶路撒冷为语法主语，而不是使用无人称或被动结构。保留人格化可呈现先知文本中城市作为共同体的形象，又不额外判定此处专指居民、城址或政治实体。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“火盆—木柴”和“火把—禾捆”的平行意象均予保留；“向右向左”维持原文方向感；末句用“就是耶路撒冷”保存希伯来文刻意重复，同时使汉语关系清楚。
