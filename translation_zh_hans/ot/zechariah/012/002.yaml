source:
  edition: WLC
  text: הִנֵּ֣ה אָ֠נֹכִי שָׂ֣ם אֶת יְרוּשָׁלִַ֧ם סַף רַ֛עַל לְ/כָל הָ/עַמִּ֖ים סָבִ֑יב וְ/גַ֧ם עַל יְהוּדָ֛ה יִֽהְיֶ֥ה בַ/מָּצ֖וֹר עַל יְרוּשָׁלִָֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/012/002.yaml
  text: Behold[a], I am about to make Jerusalem a cup of staggering to all the surrounding peoples[b]; and it will also be against Judah in the siege against Jerusalem.
translation:
  language: zh_hans
  text: 看哪，我将使耶路撒冷成为使四围万民昏醉踉跄的杯[a]；在围困耶路撒冷的时候，这事也必临到犹大[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“使人踉跄的杯”。希伯来语 סַף 也可较直译为“盆”或“门槛”，但在这里的语境中，最可能是指使人因醉酒而摇晃的器皿。
    reason: lexical_alternative
  - marker: b
    text: 本句希伯来原文含义较难确定。也可译作“犹大也将同耶路撒冷一起被围困”，或“围困耶路撒冷时，这杯也必临到犹大”；也有人理解为犹大参与围困耶路撒冷。
    reason: alternative_reading
lexical_decisions:
- source_word: הִנֵּה
  choice: 看哪
  rationale: 引出庄严而突出的先知宣告，保留原文唤起注意的语气，同时符合现代中文圣经体的庄重表达。
- source_word: אָנֹכִי
  choice: 我
  rationale: 独立人称代词带有强调意味；中文用明确的“我”已能自然表达神亲自行动，不必加上较显累赘的“我自己”。
- source_word: שָׂם
  choice: 将使
  rationale: 该分词与“看哪”连用，在先知话语中具有即将发生的将来意味；“将使”既传达临近的行动，也保持中文自然。
- source_word: סַף רַעַל
  choice: 昏醉摇晃的杯
  rationale: סַף 可指门槛，也可指盆、杯一类的容器；结合 רַעַל 与审判语境，此处最可能指使饮者昏醉踉跄的器皿。“昏醉摇晃”兼顾醉态及站立不稳的含义。
- source_word: לְכָל הָעַמִּים סָבִיב
  choice: 四围万民
  rationale: 简洁表达所有周边族群；“万民”在此是集合性复数，不限定为现代民族国家。
- source_word: וְגַם עַל יְהוּדָה יִהְיֶה
  choice: 这事也必临到犹大
  rationale: 原句压缩且指代不明。“这事”承接以耶路撒冷为中心的审判景象，“临到”保留 עַל 可能表示落在、施及犹大的含义，而不武断界定犹大的具体角色。
- source_word: בַמָּצוֹר עַל יְרוּשָׁלִָם
  choice: 在围困耶路撒冷的时候
  rationale: מָצוֹר 表示围城或围困；עַל 表示敌对行动所针对的对象。此译自然呈现军事背景。
theological_decisions:
- issue: וְגַם עַל־יְהוּדָה יִהְיֶה בַמָּצוֹר עַל־יְרוּשָׁלִָם 这一困难分句的解释
  choice: 在围困耶路撒冷的时候，这事也必临到犹大
  alternative: 犹大也将同耶路撒冷一起被围困；或犹大也将参与围困耶路撒冷
  rationale: 希伯来文句法紧缩，既可能表示围城之祸也落到犹大，也可能表示犹大在针对耶路撒冷的围城中受到牵连或参与其中。正文采用较开放的表达，不明确断定犹大是被围者还是围城者，并用脚注保留主要异读。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“看哪”保留先知宣告的肃穆语气；“昏醉摇晃”以具体动态表达审判意象。困难的后半句刻意保持一定开放性，并以脚注说明主要可能读法。
