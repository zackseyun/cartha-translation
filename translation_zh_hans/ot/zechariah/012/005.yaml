  text: וְ/אָֽמְר֛וּ אַלֻּפֵ֥י יְהוּדָ֖ה בְּ/לִבָּ֑/ם אַמְצָ֥ה לִ/י֙ יֹשְׁבֵ֣י יְרוּשָׁלִַ֔ם בַּ/יהוָ֥ה צְבָא֖וֹת אֱלֹהֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/012/005.yaml
  text: Then the clans of Judah will say in their hearts[a], ‘The inhabitants of Jerusalem are my strength in Yahweh of Armies[b], their God.’
translation:
  language: zh_hans
  text: 犹大的各宗族[a]必在心里说：“耶路撒冷的居民因万军之耶和华[b]——他们的上帝——而成为我的力量。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“犹大的各首领”或“犹大的各族长”。希伯来语אַלֻּפֵי既可指宗族，也可指宗族的首领。
    reason: lexical_alternative
  - marker: b
    text: 也可译作：“耶路撒冷的居民在万军之耶和华——他们的上帝——里面，是我的力量。”这里的介词既可表示“在……里面”的领域，也可表示所凭借的途径或力量的根基。
    reason: alternative_reading
lexical_decisions:
- source_word: וְאָמְרוּ
  choice: 必……说
  rationale: 在先知性宣告的上下文中，以“必”自然表达将来确定会发生的事；连接词不另译，以免汉语累赘。
- source_word: אַלֻּפֵי יְהוּדָה
  choice: 犹大的各宗族
  rationale: אַלּוּף既可指宗族单位，也可指宗族首领。本节将犹大与耶路撒冷作为群体并列，因此正文采用“各宗族”，同时以脚注保留“首领”的可能。
- source_word: בְּלִבָּם
  choice: 在心里
  rationale: 这是表示内心言语或确信的希伯来语惯用语；现代汉语用单数集合表达更自然。
- source_word: אַמְצָה לִי
  choice: 是我的力量
  rationale: 保留“力量”的简洁表达，也保留第一人称单数“我”，反映各宗族分别如此说的分配性含义。
- source_word: יֹשְׁבֵי יְרוּשָׁלִַם
  choice: 耶路撒冷的居民
  rationale: 准确、自然地表达居住在耶路撒冷的人。
- source_word: בַּיהוָה צְבָאוֹת
  choice: 在万军之耶和华……里面
  rationale: 正文保留介词בְּ所可能表达的领域或根基意味，并用现代中文传统且透明的神圣称号“万军之耶和华”；脚注说明也可理解为凭借或倚靠。
- source_word: אֱלֹהֵיהֶם
  choice: 他们的上帝
  rationale: 按原文保留第三人称复数所有关系，所指为耶路撒冷居民的上帝。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 采用现代中文圣经读者最熟悉的专名“耶和华”，而非以“主”替代，从而明确保留原文的盟约神名。
- issue: צְבָאוֹת 的译法
  choice: 万军
  alternative: 众军
  rationale: “万军之耶和华”是自然、庄重且广为理解的中文称号，保留上帝统领天上和地上一切军旅的意象。
- issue: 力量与耶和华之间的关系
  choice: 在万军之耶和华里面，是我的力量
  alternative: 靠着万军之耶和华，是我的力量
  rationale: 希伯来介词בְּ既可表示领域，也可表示凭借或根基。正文采用较贴近形式且不完全消解其张力的“在……里面”，脚注保留工具性理解。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“在……里面，是我的力量”刻意保留原文压缩而略显突兀的结构；破折号标明“他们的上帝”是对“万军之耶和华”的同位说明。
