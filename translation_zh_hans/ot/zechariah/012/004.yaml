source:
  edition: WLC
  text: בַּ/יּ֨וֹם הַ/ה֜וּא נְאֻם יְהוָ֗ה אַכֶּ֤ה כָל סוּס֙ בַּ/תִּמָּה֔וֹן וְ/רֹכְב֖/וֹ בַּ/שִּׁגָּע֑וֹן וְ/עַל בֵּ֤ית יְהוּדָה֙ אֶפְקַ֣ח אֶת עֵינַ֔/י וְ/כֹל֙ ס֣וּס הָֽ/עַמִּ֔ים אַכֶּ֖ה בַּֽ/עִוָּרֽוֹן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/012/004.yaml
  text: On that day[a], declares Yahweh, I will strike every horse with panic, and its rider with madness. But over the house of Judah I will keep my eyes open[b], and I will strike every horse of the peoples with blindness.
translation:
  language: zh_hans
  text: 到那日[a]，耶和华宣告说：“我必使所有的马惊惶，使骑马的人发狂；但我必留意犹大家[b]，使万民所有的马都瞎眼。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “到那日”是先知书中常见的表达，指耶和华所定、采取行动的时刻；本句本身没有说明这日持续多久。
    reason: discourse_context
  - marker: b
    text: 原文直译“我要向犹大家睁开我的眼睛”，指留意、关注；在本上下文中可能带有有利看顾的含义。
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: 到那日
  rationale: 保留先知文献中指向特定未来时刻的惯用表达；“到那日”自然、庄重，也不额外限定时间。
- source_word: נְאֻם יְהוָה
  choice: 耶和华宣告说
  rationale: 这是标明神圣话语权威的先知公式。“宣告说”符合现代汉语表达，并保留其郑重语气。
- source_word: אַכֶּה
  choice: 我必使……；我必使……
  rationale: נכה 的使役形在本节与惊惶、瞎眼搭配，表达使之遭受某种状态；按汉语习惯译为“使……”，避免误解为物理击打，也不增添死亡含义。
- source_word: כָל סוּס
  choice: 所有的马
  rationale: כָל 加单数集合名词表示全体；“所有的马”在汉语中自然，并保留范围的完整性。
- source_word: בַּתִּמָּהוֹן
  choice: 惊惶
  rationale: 该词可指震骇、困惑或慌乱；军事审判语境中“惊惶”兼具恐慌和失措之意。
- source_word: וְרֹכְבוֹ בַּשִּׁגָּעוֹן
  choice: 使骑马的人发狂
  rationale: 后缀指前述马匹的骑乘者。汉语不宜逐一重复“每匹马的骑手”，故用集合表达；“发狂”保留 שִׁגָּעוֹן 所指的精神错乱或疯狂。
- source_word: וְעַל בֵּית יְהוּדָה אֶפְקַח אֶת עֵינַי
  choice: 但我必睁眼眷顾犹大家
  rationale: 直译为“我要向犹大家睁开我的眼睛”。“睁眼眷顾”保留眼睛的意象，同时传达上下文中留意、恩顾的含义；“但”明确其与临到敌方的审判形成的语境反差。
- source_word: בֵּית יְהוּדָה
  choice: 犹大家
  rationale: 保留“家”这一群体及盟约性称谓，而不简化为地名“犹大”。
- source_word: כֹל סוּס הָעַמִּים
  choice: 万民所有的马
  rationale: הָעַמִּים 是复数，可译“万民”或“列国”。“万民”较贴近原词的人民群体含义，并在此自然指围攻者所属的各族。
- source_word: בַּעִוָּרוֹן
  choice: 瞎眼
  rationale: 直接表达失去视力的审判结果，与前文“惊惶”“发狂”的状态平行；比抽象名词“失明”更适合“使……”句式。
theological_decisions:
- issue: 耶和华向犹大家“睁眼”的含义
  choice: 译作“睁眼眷顾”，保留身体意象并表达有利的关注
  alternative: 较直译为“向犹大家睁开我的眼睛”，或较解释性地译为“看顾犹大家”
  rationale: 上下文把神对犹大的态度与对万民马匹的击打相对照，因此这种关注很可能带有恩顾意味；但译文保留“睁眼”意象，没有把它扩展成经文未明说的全面保护应许。
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威；主
  rationale: “耶和华”是现代简体中文圣经语境中最广为人知的专名形式，能够区别于称号“主”，且不在本节中引入额外解释。
- issue: 对马匹和骑手的神圣审判
  choice: 保留为神主动使其惊惶、发狂并瞎眼
  alternative: 弱化为他们自行陷入混乱或失明
  rationale: 三个分句都以第一人称动词 אַכֶּה 为支配性表达，主体明确是耶和华；译文不淡化原文关于神施行审判的陈述。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。引语以“耶和华宣告说”引入；三个审判结果用整齐的使役结构呈现。保留“犹大家”和“睁眼”的原文意象，同时用“眷顾”帮助普通读者理解该习语在本语境中的有利关注。
