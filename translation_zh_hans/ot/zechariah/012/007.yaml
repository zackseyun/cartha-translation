id: ZEC.12.7
reference: Zechariah 12:7
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/הוֹשִׁ֧יעַ יְהוָ֛ה אֶת אָהֳלֵ֥י יְהוּדָ֖ה בָּ/רִֽאשֹׁנָ֑ה לְמַ֨עַן לֹֽא תִגְדַּ֜ל תִּפְאֶ֣רֶת בֵּית דָּוִ֗יד וְ/תִפְאֶ֛רֶת יֹשֵׁ֥ב יְרוּשָׁלִַ֖ם עַל יְהוּדָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/012/007.yaml
  text: And Yahweh will save the tents of Judah first[b][a], so that the glory of the house of David and the glory of the inhabitants of Jerusalem may not be magnified over Judah.
translation:
  language: zh_hans
  text: 耶和华必先拯救犹大的帐棚[a]，使大卫家的荣耀和耶路撒冷居民的荣耀不至高过犹大[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “帐棚”也可译作“住处”。原文直译为“犹大的帐棚”，可能是以此指犹大各地的居所或外围聚落，与耶路撒冷和大卫家形成对照。
    reason: lexical_alternative
  - marker: b
    text: “不至高过犹大”也可译作“不至在犹大之上显得更为尊荣”。
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/הוֹשִׁיעַ
  choice: 必拯救
  rationale: 使役形词义为“拯救、解救”；“必”自然表达未完成式在此预言语境中的将来确定性。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文圣经语域中对四字神名的通行音译，保留其作为专名的功能，而不以称号替代。
- source_word: אָהֳלֵי יְהוּדָה
  choice: 犹大的帐棚
  rationale: 直译并保留“帐棚”的具体意象；它与大卫家和耶路撒冷形成对照，也可能指犹大境内的居所或外围聚落。
- source_word: בָּ/רִאשֹׁנָה
  choice: 先
  rationale: 表达次序上的优先，中文简洁自然。
- source_word: לְמַעַן
  choice: 使
  rationale: 明确引出目的从句，同时符合现代汉语表达。
- source_word: תִגְדַּל
  choice: 不至高过
  rationale: גדל在此与“荣耀”和介词עַל连用，表示变得更大、更显赫；“高过”自然保留相对优越之意。
- source_word: תִּפְאֶרֶת
  choice: 荣耀
  rationale: 兼顾光荣、尊荣和显赫地位等语义，不把它缩减为单纯的夸口。
- source_word: בֵּית דָּוִיד
  choice: 大卫家
  rationale: 既保留原文“家”的表达，也可自然指大卫王朝或宗族。
- source_word: יֹשֵׁב יְרוּשָׁלִַם
  choice: 耶路撒冷居民
  rationale: 希伯来文单数分词具有集合意义；中文用“居民”可自然涵盖整体，不必强行保留形式上的单数。
- source_word: עַל יְהוּדָה
  choice: 高过犹大
  rationale: עַל在此表达相对于犹大的优越或抬高；与תִגְדַּל合译为“高过”最为顺畅。
theological_decisions:
- issue: 上帝子民内部的社会与政治对照
  choice: 译文保留犹大帐棚先蒙拯救，以及大卫家和耶路撒冷不被抬高到犹大之上的目的关系。
  alternative: 只把“先”理解为时间顺序，不强调王室、城市与犹大其余群体之间的对照。
  rationale: “犹大的帐棚”与“大卫家”“耶路撒冷居民”的并置，加上目的从句，显示经文不只陈述先后，也防止王室和首都所得的荣耀凌驾于犹大；译文保留这一张力而不进一步推定具体社会阶层。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“帐棚”保留先知文本的具体意象；“居民”按集合单数处理；句式尽量简明，并保留目的关系和内部对照。
