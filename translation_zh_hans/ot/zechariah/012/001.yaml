id: ZEC.12.1
reference: Zechariah 12:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: מַשָּׂ֥א דְבַר יְהוָ֖ה עַל יִשְׂרָאֵ֑ל נְאֻם יְהוָ֗ה נֹטֶ֤ה שָׁמַ֨יִם֙ וְ/יֹסֵ֣ד אָ֔רֶץ וְ/יֹצֵ֥ר רֽוּחַ אָדָ֖ם בְּ/קִרְבּֽ/וֹ־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/012/001.yaml
  text: 'An oracle[a], the word of Yahweh concerning Israel: the declaration of Yahweh, who stretches out the heavens, lays the foundation of the earth[b], and forms the spirit of man within him.'
translation:
  language: zh_hans
  text: 关于以色列的默示[a]，就是雅威的话。雅威宣告：他铺展诸天，奠定大地的根基，并塑造人里面的灵[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “关于以色列”也可译作“攻击以色列”；这里的介词既可表示所论及的对象，在某些语境中也可表示所针对的对象。
    reason: 保留 עַל 在本句中的真实语义歧义。
  - marker: b
    text: 原文直译为“塑造人的灵，在他里面”；“他”回指泛指的“人”。“人的灵”也可译作“人类的灵”。
    reason: 说明 אָדָם 的单数泛指及 בְּקִרְבּוֹ 的回指，同时保留词语范围。
lexical_decisions:
- source_word: מַשָּׂא
  choice: 默示
  rationale: 在先知书标题中指郑重而有分量的神谕；“默示”符合中文圣经语体，也避免将其误解为字面的“重担”。
- source_word: דְבַר יְהוָה
  choice: 雅威的话
  rationale: 保留“话”这一先知启示的正式表达，并直接译出神名。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以常见的中文音译呈现四字神名，保留其专名性质，而不以称号替代。
- source_word: עַל
  choice: 关于
  rationale: 这里较自然地标明默示涉及的对象；下文兼有审判与拯救，因此不在本节预先限定为“攻击”。
- source_word: נְאֻם יְהוָה
  choice: 雅威宣告
  rationale: 以自然、庄重的现代汉语表达先知性的宣告公式；虽将名词结构转为动词表达，但不改变其功能。
- source_word: נֹטֶה שָׁמַיִם
  choice: 铺展诸天
  rationale: 保留分词所呈现的创造者形象；“铺展”准确而富有庄重感。
- source_word: וְיֹסֵד אָרֶץ
  choice: 奠立大地
  rationale: 体现 יָסַד 的立基、奠定之意，同时比“给大地立根基”更简洁自然。
- source_word: וְיֹצֵר רוּחַ אָדָם
  choice: 塑造人的灵
  rationale: “塑造”保留 יֹצֵר 所含的陶匠式成形意象；“人的灵”既对应单数泛指的 אָדָם，也符合现代汉语。
- source_word: בְּקִרְבּוֹ
  choice: 在人里面
  rationale: 阳性单数后缀回指 אָדָם；中文用“在人里面”清楚保留灵位于人内在的意思。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文使用四字神名；正文以“雅威”作音译，保留其作为立约之神专名的性质。
- issue: 介词 עַל 的语义
  choice: 关于以色列
  alternative: 攻击以色列
  rationale: עַל 可表示“关于”或“攻击、针对”；鉴于后续预言同时包含审判和拯救，正文采用较中性的“关于”，并在脚注保留另一可能。
- issue: אָדָם 的泛指范围
  choice: 人
  alternative: 人类／一个人
  rationale: 此处是单数泛指，指人之为人，并非仅限男性；中文“人”既保留单数形式，也自然涵盖一般人类。
- issue: רוּחַ 的所指
  choice: 人的灵
  alternative: 人的气息
  rationale: 创造语境容许“灵”与“气息”的语义联想，但“在人里面塑造”较自然地指人的内在之灵；不进一步界定其神学构成。
translation_notes:
  register: 采用庄重而清晰的现代标准汉语。“默示”保留先知书标题的传统辨识度；其余句法适度现代化。正文两处脚注标记均已对应脚注。
