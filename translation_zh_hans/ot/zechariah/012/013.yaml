base_translation:
  language: en
  yaml_path: translation/ot/zechariah/012/013.yaml
  text: the family of the house of Levi by itself[a], and their wives by themselves; the family of the Shimeites by itself, and their wives by themselves.
translation:
  language: zh_hans
  text: 利未家的宗族独自一处，他们的妻子也独自一处；示每族[a]独自一处，他们的妻子也独自一处。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“示每家的宗族。”希伯来文很可能是指示每族，即与示每有关的宗族。
    reason: 说明“示每族”为族称，也保留可将该表达展开为“示每家的宗族”的译法。
lexical_decisions:
- source_word: מִשְׁפַּחַת
  choice: 宗族
  rationale: 这里指以共同祖先或家系相连的群体；“宗族”比现代汉语中的“家庭”更能表达扩展亲族的含义。
- source_word: בֵּית לֵוִי
  choice: 利未家
  rationale: “家”保留 בֵּית 所表达的家系、宗族传承含义，也符合现代中文圣经语体。
- source_word: לְבָד
  choice: 独自一处
  rationale: 既表达各群体彼此分开，也保留原文四次重复所形成的哀悼节奏；在中文中比单用“独自”更清楚地表示分别而居。
- source_word: וּנְשֵׁיהֶם
  choice: 他们的妻子
  rationale: נָשִׁים 可指女人或妻子；这里带第三人称复数所有格，并与家族中的男性群体相对，译作“他们的妻子”最切合语境。
- source_word: הַשִּׁמְעִי
  choice: 示每族
  rationale: 该形式带定冠词，是由“示每”形成的族群称谓，宜理解为与示每相关或由其而出的宗族。
theological_decisions:
- issue: 哀悼时男女分开
  choice: 明确保留宗族与“他们的妻子”各自分开的表述
  alternative: 概括为“各家各自哀哭，男女分开”
  rationale: 原文反复区分家族群体和他们的妻子；直陈这种区分可保留经文的社会情境与强调，而不将其泛化或赋予额外的教义解释。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“独自一处”四次重复，保留希伯来文排比式节奏；专名按通行形式译作“利未”“示每”。脚注标记置于实际存在词义选择的“示每族”之后。
