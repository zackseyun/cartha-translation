source:
  edition: WLC
  text: פְּתַ֥ח לְבָנ֖וֹן דְּלָתֶ֑י/ךָ וְ/תֹאכַ֥ל אֵ֖שׁ בַּ/אֲרָזֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/011/001.yaml
  text: Open your doors[a], Lebanon, so that fire may consume your cedars.
translation:
  language: zh_hans
  text: 黎巴嫩哪，打开你的门[a]，让火吞灭你的香柏树！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“黎巴嫩哪，打开你的城门，火就必吞灭你的香柏树！”
    reason: “门”也可在较宽泛的建筑语境中理解为“城门”；命令式之后的未完成式也可表达将要发生的结果。
lexical_decisions:
- source_word: פְּתַח
  choice: 打开
  rationale: 这是动词 פתח 的第二人称阳性单数命令式，直接向拟人化的黎巴嫩发出命令。“打开”准确自然，不额外强化为“敞开”。
- source_word: לְבָנוֹן
  choice: 黎巴嫩
  rationale: 专有地名，按现代汉语通行译名处理；本句将其拟人化并直接呼告，因此加“哪”以自然呈现呼语。
- source_word: דְּלָתֶיךָ
  choice: 你的门
  rationale: דֶּלֶת 的基本义是“门、门扇”；复数及第二人称单数所有格均予保留。译作“城门”也有可能，但会比原词更具体。
- source_word: וְתֹאכַל
  choice: 让……吞灭
  rationale: 这是 אכל 的第三人称阴性单数未完成式，以“火”为主语；接在命令式之后，可表达目的或结果。“让”保留这种关系，“吞灭”则传达火焚毁树木的强烈诗性意象。
- source_word: אֵשׁ
  choice: 火
  rationale: 采用该词直接而基本的词义。
- source_word: בַּאֲרָזֶיךָ
  choice: 你的香柏树
  rationale: אֶרֶז 指香柏树，带第二人称单数所有格。介词 בְּ 可有“在……中、在……间”之意，但与“吞灭”连用时，现代汉语自然地把树木表达为受毁灭的对象。
theological_decisions:
- issue: 拟人化与先知性意象
  choice: 保留对黎巴嫩的直接呼告，把它呈现为拥有“门”和“香柏树”的拟人化对象。
  alternative: 把“门”明确解释为山口、森林入口或城门，或把黎巴嫩明确解释为某种政治势力。
  rationale: 原文保持诗性和象征空间，并未在本节内说明这些意象的具体所指；译文不替读者限定为地理、政治或其他神学解释。
- issue: 命令式后未完成式的关系
  choice: 译为“打开……让火吞灭……”，按目的或结果来表达。
  alternative: 译为“打开……火就必吞灭……”，突出随后必然发生的结果。
  rationale: 希伯来语连接词加未完成式容许目的/结果与预告结果之间的张力，正文采用自然的目的—结果表达，脚注保留较明确的结果性读法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留简短有力的先知性呼告和拟人化意象；“吞灭”比一般的“烧掉”更贴近 אכל 所具有的吞吃式毁灭色彩。
