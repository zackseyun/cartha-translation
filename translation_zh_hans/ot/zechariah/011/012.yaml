  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וָ/אֹמַ֣ר אֲלֵי/הֶ֗ם אִם ט֧וֹב בְּ/עֵינֵי/כֶ֛ם הָב֥וּ שְׂכָרִ֖/י וְ/אִם לֹ֣א חֲדָ֑לוּ וַ/יִּשְׁקְל֥וּ אֶת שְׂכָרִ֖/י שְׁלֹשִׁ֥ים כָּֽסֶף־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/011/012.yaml
  text: 'Then I said to them[a], “If it is good in your eyes, give me my wages; but if not, refrain.” So they weighed out my wages: thirty pieces of silver.'
translation:
  language: zh_hans
  text: 我对他们说：“你们若看为好，就把我的工钱给我；若不然，就算了。”于是，他们称出三十块银子[a]作为我的工钱。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“三十银”；可能指“三十舍客勒银子”。
    reason: 说明原文省略货币或重量单位，并保留可能的具体解释。
lexical_decisions:
- source_word: וָאֹמַר אֲלֵיהֶם
  choice: 我对他们说
  rationale: וַ־推动叙事向前；现代汉语无须另加“然后”也能自然表达顺承。אֲלֵיהֶם按其第三人称阳性复数后缀译为“对他们”。
- source_word: אִם טוֹב בְּעֵינֵיכֶם
  choice: 你们若看为好
  rationale: 保留“在你们眼中为好”的希伯来语意象，同时采用自然、庄重的现代汉语表达，不将其强化为赞同或喜悦。
- source_word: הָבוּ שְׂכָרִי
  choice: 就把我的工钱给我
  rationale: הָבוּ是“给”的命令式；שְׂכָרִי指因劳作或服事所得的报酬，译作“我的工钱”符合牧人受酬的语境。
- source_word: וְאִם לֹא חֲדָלוּ
  choice: 若不然，就算了
  rationale: חָדַל表示停止、不再做。这里是说若他们不认为合宜，便不必支付；“就算了”在现代汉语中简洁自然，又不增添拒绝或亏欠等含义。
- source_word: וַיִּשְׁקְלוּ
  choice: 于是，他们称出
  rationale: שׁקל具体指按重量称量，尤其用于银子；“称出”保留古代以重量支付银子的实际方式。
- source_word: שְׁלֹשִׁים כָּסֶף
  choice: 三十块银子
  rationale: 希伯来文直译为“三十银”，没有明说计量单位。“块”使汉语可读，又不在正文中断定为舍客勒；可能的具体单位在脚注说明。
- source_word: אֶת שְׂכָרִי שְׁלֹשִׁים כָּסֶף
  choice: 称出三十块银子作为我的工钱
  rationale: 按现代汉语重组宾语与同位数量短语，清楚表明这三十块银子就是所付工钱，同时保留“称量”的动作。
theological_decisions:
- issue: 付款金额是否明确为舍客勒
  choice: 正文译为“三十块银子”
  alternative: 三十舍客勒银子
  rationale: 原文仅有שְׁלֹשִׁים כָּסֶף，没有明确写出שֶׁקֶל。正文不补入未明说的单位，以免因新约呼应或传统译法而过度具体化；“舍客勒”作为可能解释保留在脚注。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准普通话。“你们若看为好”适度保留原文“在你们眼中为好”的意象；“就算了”自然传达“不必给、停止此事”，语气不古奥。脚注标记紧随其实际说明的金额短语，而不置于“他们”之后。
