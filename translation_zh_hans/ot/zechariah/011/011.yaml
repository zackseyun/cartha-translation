  text: וַ/תֻּפַ֖ר בַּ/יּ֣וֹם הַ/ה֑וּא וַ/יֵּדְע֨וּ כֵ֜ן עֲנִיֵּ֤י הַ/צֹּאן֙ הַ/שֹּׁמְרִ֣ים אֹתִ֔/י כִּ֥י דְבַר יְהוָ֖ה הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/011/011.yaml
  text: So it was broken on that day[b][a], and thus the afflicted of the flock who were watching me knew that it was the word of Yahweh.
translation:
  language: zh_hans
  text: 它就在那一天被折断了[a]；羊群中那些困苦的人，就是留意我的人，就知道这是雅威的话。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“被废除”或“被撤销”，着重上文中折断杖所表达的盟约失效之意。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֻּפַר
  choice: 被废除了
  rationale: 该词是 פרר 的被动式，所指承接上文以杖的折断象征废除盟约。正文采用“废除”，自然表达盟约失效的含义；脚注保留“折断”这一具体意象。
- source_word: בַּיּוֹם הַהוּא
  choice: 就在那一天
  rationale: 这是标准的时间表达；“就在那一天”既符合现代汉语，也保留先知叙述中的时间标记。
- source_word: וַיֵּדְעוּ כֵן
  choice: 于是……知道
  rationale: כֵן 在此表示“这样、因此”，译为“于是”明确呈现行动与认知之间的逻辑联系。
- source_word: עֲנִיֵּי הַצֹּאן
  choice: 羊群中困苦的人
  rationale: עֲנִיֵּי 可指困苦、贫穷或谦卑的人。“困苦”在此较能涵盖他们受压的处境，又不把含义限于经济贫穷。
- source_word: הַשֹּׁמְרִים אֹתִי
  choice: 那些留意我的人
  rationale: שׁמר 的分词带第一人称宾语，可表示注视、观察或留意说话者。“留意我的人”在现代汉语中自然，也保留其持续关注的意味。
- source_word: כִּי דְבַר יְהוָה הוּא
  choice: 知道这是雅威的话
  rationale: 该分句把这一行动或事件认定为雅威的话语，译文保留这种先知性确认。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。译作“雅威”以音译方式呈现这一名字，避免用称号取代，同时不在本节中加入额外的宗派性解释。
- issue: וַתֻּפַר 所表达的盟约意象
  choice: 正文译作“被废除了”，脚注注明“被折断了”
  alternative: 正文译作“被折断了”
  rationale: 上文实际折断的是杖，而这一动作象征盟约被废除。正文表达盟约层面的效力，脚注保留具体动作，使两层意象均可见而不强行消除其张力。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“那约”依据前文明确补出 וַתֻּפַר 的所指，避免汉语中无明确先行词的“它”；用“就是”将“那些留意我的人”处理为对“羊群中困苦的人”的同位说明。
