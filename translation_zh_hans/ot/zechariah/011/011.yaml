revisions:
- from: 那约就在那一天被废除了[a]。于是，羊群中困苦的人[b]，就是那些留意我的人，知道这是雅威的话。
  to: 它就在那一天被折断了[a]；羊群中那些困苦的人，就是留意我的人，就知道这是雅威的话。
  rationale: 将正文的“那约被废除了”改为“它……被折断了”，使译文首先对应原文动词的具体意象，并不预先排除其由上下文产生的盟约性含义；该含义在脚注中作为词汇替代译法说明。为使脚注锚点与正文一致，已在“被折断了”后保留 a 标记；b 标记所对应的词语在本节译文中不需要另行标记，因其为同一词的词汇替代说明。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T08:17:12Z'
