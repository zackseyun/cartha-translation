source:
  edition: WLC
  text: הֵילֵ֤ל בְּרוֹשׁ֙ כִּֽי נָ֣פַל אֶ֔רֶז אֲשֶׁ֥ר אַדִּרִ֖ים שֻׁדָּ֑דוּ הֵילִ֨ילוּ֙ אַלּוֹנֵ֣י בָשָׁ֔ן כִּ֥י יָרַ֖ד יַ֥עַר ה/בצור־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/011/002.yaml
  text: Wail[a], cypress, for the cedar has fallen, for the majestic ones have been destroyed. Wail, oaks of Bashan[c][b], for the thick forest has come down.
translation:
  language: zh_hans
  text: 哀号吧，柏树[a]！因为香柏树已经倒下，那些雄伟的树木[b]已遭毁灭。哀号吧，巴珊的橡树！因为茂密的森林[c]已经倒下。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “柏树”或译“冷杉”。
    reason: lexical_alternative
  - marker: b
    text: “雄伟的树木”或译“强有力者”；本句也可译作“那些强有力者已遭摧毁”。
    reason: lexical_alternative
  - marker: c
    text: “茂密的森林”也可能译作“难以进入的森林”或“设防的森林”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵילֵל / הֵילִילוּ
  choice: 哀号吧
  rationale: 两个命令式都要求发出悲痛或惊惧的呼声。“哀号”自然、庄重，也保留先知诗歌中的哀鸣语气。
- source_word: בְּרוֹשׁ
  choice: 柏树
  rationale: 该树名的确切树种不确定，常指柏类针叶树；“柏树”符合与香柏树、橡树并列的树木意象。
- source_word: כִּי
  choice: 因为
  rationale: 两处均引出哀号的原因；现代汉语用“因为”能清楚表达因果关系。
- source_word: נָפַל
  choice: 已经倒下
  rationale: 直译为“倒下”，不把经文没有明说的砍伐者或致倒原因加入正文。
- source_word: אֶרֶז
  choice: 香柏树
  rationale: 这是该词在圣经语境中的通行译法，并保留其高大、尊荣的诗歌意象。
- source_word: אַדִּרִים
  choice: 那些雄伟者
  rationale: 该复数名词化形式可指雄伟、威严或强有力者。“雄伟者”既呼应树木意象，又不把它限定为树木或人间权贵。
- source_word: שֻׁדָּדוּ
  choice: 已遭毁灭
  rationale: 被动形式表达暴力造成的毁坏；“遭毁灭”兼容眼前的树木图景及其可能具有的象征意义。
- source_word: אַלּוֹנֵי בָשָׁן
  choice: 巴珊的橡树
  rationale: 这是传统且容易识别的译法，表现巴珊以高大强健树木著称的意象。
- source_word: יָרַד
  choice: 已经倒下
  rationale: 原义为“下去、降下”；用于森林时，“倒下”自然地传达其倾覆，却不额外明说是被砍伐或被谁击倒。
- source_word: יַעַר
  choice: 森林
  rationale: 该词通常指森林或林地；“森林”直接清楚。
- source_word: הבצור
  choice: 茂密的
  rationale: 末尾词形和语义较难，可能表达稠密而难以进入、险阻或设防之意。“茂密的森林”在现代汉语中自然，并与不可进入的密林含义相合，同时以脚注保留其他可能。
theological_decisions:
- issue: 是否在正文中把树木意象明确解释为统治者或权势人物
  choice: 保留树木意象，并用“雄伟者”维持其可能的双关
  alternative: 将香柏树、橡树或“雄伟者”直接解释为君王、领袖或权贵
  rationale: 经文很可能借高大树木象征领袖或强权，但希伯来文本直接呈现树木图景。正文不把隐喻对象说死，以保留原文的神学张力和解释空间。
translation_notes:
  register: 采用现代、庄重而可朗读的先知诗歌语体。重复“哀号吧”和“已经倒下”以保留原文的平行结构；不在正文中将树木隐喻直接释为政治或宗教领袖。所有异文或词义不确定处均以脚注标明。
