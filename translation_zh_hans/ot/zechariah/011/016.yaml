source:
  edition: WLC
  text: כִּ֣י הִנֵּֽה אָנֹכִי֩ מֵקִ֨ים רֹעֶ֜ה בָּ/אָ֗רֶץ הַ/נִּכְחָד֤וֹת לֹֽא יִפְקֹד֙ הַ/נַּ֣עַר לֹֽא יְבַקֵּ֔שׁ וְ/הַ/נִּשְׁבֶּ֖רֶת לֹ֣א יְרַפֵּ֑א הַ/נִּצָּבָה֙ לֹ֣א יְכַלְכֵּ֔ל וּ/בְשַׂ֤ר הַ/בְּרִיאָה֙ יֹאכַ֔ל וּ/פַרְסֵי/הֶ֖ן יְפָרֵֽק־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/011/016.yaml
  text: For behold[a], I am raising up a shepherd in the land who will not attend to the perishing, will not seek the straying, will not heal the broken, will not sustain the healthy[c][b], but will eat the flesh of the fat ones and tear off their hooves.
translation:
  language: zh_hans
  text: 看哪，我必在这地兴起一个牧人。他不照料将亡的[b]，不寻找走失的[a]，不医治受伤的，也不扶持仍能站立的[c]；反倒吃肥壮的羊的肉，把它们的蹄子撕下来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“幼小的”。希伯来语 הַנַּעַר 通常可指年轻者或幼小者；在这里的牧群语境中，也常被理解为走失或弱小的羊。
    reason: lexical_alternative
  - marker: b
    text: “将亡的”也可译作“失落的”“被剪除的”或“正在灭亡的”。
    reason: lexical_alternative
  - marker: c
    text: 直译“站立的”；在语境中可能指仍能站立、尚且健壮的羊。
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵקִים
  choice: 兴起
  rationale: 使役形在这里表示使之出现或设立；“兴起”既保留上帝的主动作为，也不把含义限定为正式任命。
- source_word: רֹעֶה
  choice: 牧人
  rationale: 这是牧养牲畜的常用词，在先知语境中也可指领袖；“牧人”保留其字面与比喻双重意味。
- source_word: הַנִּכְחָדוֹת
  choice: 将亡的
  rationale: 该形式指正在消失、被剪除或走向灭亡的；“将亡的”保留其危险和毁灭意味，而不径直解释为单纯走失。
- source_word: יִפְקֹד
  choice: 照料
  rationale: פקד可表示探望、关注或照管；在牧养语境中，“照料”自然且不过度缩窄其含义。
- source_word: הַנַּעַר
  choice: 走失的
  rationale: נער通常可指年轻者，但此处处于羊群成员的排比中，并与“寻找”搭配；正文采用语境上较通顺的“走失的”，同时用脚注保留“幼小的”这一更直接的词义。
- source_word: יְבַקֵּשׁ
  choice: 寻找
  rationale: 准确表达 בקש 的基本意义，也符合牧人寻找羊只的图景。
- source_word: הַנִּשְׁבֶּרֶת
  choice: 受伤的
  rationale: שבר 的被动分词字面为“破碎的”；用于羊只时，“受伤的”是自然中文，并仍可承载比喻意味。
- source_word: יְרַפֵּא
  choice: 医治
  rationale: רפא 的直接含义是医治；未采用“包扎”，以免引入本节没有明说的动作。
- source_word: הַנִּצָּבָה
  choice: 还站立的
  rationale: 该词来自 נצב，直指仍站着的；此译保留原文形象，不把它完全解释为“健壮的”或“健康的”。
- source_word: יְכַלְכֵּל
  choice: 供养
  rationale: כלכל可指维持、供给或养活；“供养”涵盖喂养和维持所需，不限于单一动作。
- source_word: הַבְּרִיאָה
  choice: 肥羊
  rationale: בריא可指肥壮、健康或饱食；在恶牧人吞吃羊肉的图景中，“肥羊”最自然地表达其掠食对象。
- source_word: פַרְסֵיהֶן
  choice: 它们的蹄子
  rationale: פרסה指蹄或蹄部；此译直接保留具体而残酷的牧群图景。
- source_word: יְפָרֵק
  choice: 撕裂
  rationale: פרק在此可指扯开、拆裂或撕下；“撕裂”表达暴力动作，同时避免断定究竟是扯下还是劈开蹄部。
theological_decisions:
- issue: 牧人的身份
  choice: 正文只称其为“一个牧人”，不指认具体的历史人物或末世人物。
  alternative: 译作“恶牧人”“无用的牧人”，或直接标明某一特定敌对人物。
  rationale: 本节借行为清楚刻画这牧人的残酷，也表明是上帝使他兴起，但本节本身没有给他命名；保持原有称谓可避免把后来的神学认定写进经文。
- issue: 上帝兴起残酷牧人的含义
  choice: 保留“我要……兴起”的直接陈述，不添加许可、赞同或定罪等解释。
  alternative: 改写为“我要容许一个牧人兴起”或“我要任命一个邪恶牧人”。
  rationale: 原文明确保留上帝的主动作为及其与审判之间的张力；译文不应以解释性措辞消解这种张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“因为，看哪”保留 כִּי הִנֵּה 的因果衔接和先知宣告语气；连续的“不……”保持原文排比，分号后的“反倒”突出由失职转向吞吃和毁坏的强烈对比。
