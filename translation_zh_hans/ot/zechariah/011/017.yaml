  text: ה֣וֹי רֹעִ֤י הָֽ/אֱלִיל֙ עֹזְבִ֣י הַ/צֹּ֔אן חֶ֥רֶב עַל זְרוֹע֖/וֹ וְ/עַל עֵ֣ין יְמִינ֑/וֹ זְרֹע/וֹ֙ יָב֣וֹשׁ תִּיבָ֔שׁ וְ/עֵ֥ין יְמִינ֖/וֹ כָּהֹ֥ה תִכְהֶֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/011/017.yaml
  text: Woe to the worthless shepherd[a], who abandons the flock! A sword is against his arm and against his right eye. His arm will completely wither, and his right eye will be utterly dimmed.
translation:
  language: zh_hans
  text: 那无用的、离弃羊群的牧人[a]有祸了！刀剑要临到他的膀臂和右眼。他的膀臂必完全枯干，他的右眼必昏暗无光。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“偶像般的牧人”或“虚空的牧人”。这里的希伯来词可表示无用、虚空，也可指偶像。
    reason: 保留אֱלִיל在“无用”和“偶像”之间的词义可能。
lexical_decisions:
- source_word: הוֹי
  choice: 有祸了
  rationale: 这是宣告审判、也带有哀叹色彩的感叹词；“有祸了”自然地保留先知性谴责的语气。
- source_word: רֹעִי הָאֱלִיל
  choice: 毫无用处的牧人
  rationale: אֱלִיל可表示虚无、无用，也常指偶像。上下文着重牧人离弃羊群、失职无用，因此正文采用自然清楚的“毫无用处”，并以脚注保留“偶像般/虚空”的词义张力。
- source_word: עֹזְבִי הַצֹּאן
  choice: 离弃羊群
  rationale: 分词刻画这牧人的特征；“离弃”既表达抛下不顾，也符合庄重的先知书语体。
- source_word: חֶרֶב עַל זְרוֹעוֹ וְעַל עֵין יְמִינוֹ
  choice: 刀剑要临到他的膀臂和右眼
  rationale: 原文是无动词判断句。“要临到”保留审判宣告的力度，而不把它明确改写成祈愿或命令；“膀臂”和“右眼”照原有意象保留。
- source_word: זְרֹעוֹ יָבוֹשׁ תִּיבָשׁ
  choice: 他的膀臂必完全枯干
  rationale: 不定式绝对式与限定动词连用构成强调；“必完全枯干”同时传达确定性与彻底性。
- source_word: וְעֵין יְמִינוֹ כָּהֹה תִכְהֶה
  choice: 他的右眼必昏暗无光
  rationale: 重复结构加强“昏暗”之意。“昏暗无光”保留视力衰退的图像，不武断译作完全失明。
theological_decisions:
- issue: 牧人称谓中אֱלִיל的译法
  choice: 毫无用处的牧人
  alternative: 偶像般的牧人；虚空的牧人
  rationale: 该词兼有“无用、虚无”和“偶像”的语义关联。此处紧接“离弃羊群”，正文突出领袖失职无用；脚注保留偶像或虚空的可能意味，避免消除原文的词义张力。
- issue: “刀剑临到”是宣告还是咒愿
  choice: 作为将临审判的宣告
  alternative: 译为“愿刀剑击打……”的咒愿
  rationale: 希伯来文为无动词结构，未明确标示祈愿语气；“要临到”保留其神谕式判断，又不把含混之处过度确定化。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“有祸了”“离弃”“临到”维持先知审判宣告的语体；避免使用过度古雅的措辞。
