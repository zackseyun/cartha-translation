reference: Zechariah 11:6
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּ֠י לֹ֣א אֶחְמ֥וֹל ע֛וֹד עַל יֹשְׁבֵ֥י הָ/אָ֖רֶץ נְאֻם יְהוָ֑ה וְ/הִנֵּ֨ה אָנֹכִ֜י מַמְצִ֣יא אֶת הָ/אָדָ֗ם אִ֤ישׁ בְּ/יַד רֵעֵ֨/הוּ֙ וּ/בְ/יַ֣ד מַלְכּ֔/וֹ וְ/כִתְּתוּ֙ אֶת הָ/אָ֔רֶץ וְ/לֹ֥א אַצִּ֖יל מִ/יָּדָֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/011/006.yaml
  text: For I will no longer have compassion on the inhabitants of the land[a], declares Yahweh. Behold, I am handing over the people, each into the hand of his neighbor and into the hand of his king, and they will crush the land[c][b], and I will not deliver it from their hand.
translation:
  language: zh_hans
  text: 因为我不再怜悯这地的居民[a]。这是雅威的宣告。看哪，我要使众人各自落在自己邻舍和君王的手中[b]。他们必摧毁这地；我不会从他们手中救出这地[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “这地”也可译作“大地”；希伯来词既可指某一地域，也可指全地。
    reason: alternative_reading
  - marker: b
    text: 希伯来文直译为“使人各自落在自己邻舍的手中和自己君王的手中”；“在……手中”表示受其权势支配。
    reason: lexical_alternative
  - marker: c
    text: 末句希伯来文没有明说“救出”的对象；可承接前文理解为“这地”，也可能指这地的居民。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶחְמֹל
  choice: 怜悯
  rationale: חמל兼有怜惜、施怜悯或饶恕之意；“怜悯”自然庄重，并保留情感与审判两方面的含义。
- source_word: יֹשְׁבֵי הָאָרֶץ
  choice: 这地的居民
  rationale: יֹשְׁבֵי指居住者；上下文较支持特定地域，故将הָאָרֶץ译为“这地”，同时以脚注保留“全地”的可能。
- source_word: נְאֻם יְהוָה
  choice: 这是雅威的宣告
  rationale: 保留先知书中庄严的宣告公式，并将神名יְהוָה音译为“雅威”。
- source_word: מַמְצִיא
  choice: 交出来，使……落在……手中
  rationale: 此处Hiphil表达使人进入他人权下；该译法兼顾使役意义和“手中”的支配权意象。
- source_word: הָאָדָם אִישׁ
  choice: 众人……各人
  rationale: הָאָדָם在此可作集合意义，而אִישׁ具有逐一分配的作用；“众人……各人”同时表达群体与个体。
- source_word: בְיַד
  choice: 落在……手中
  rationale: 保留希伯来语以“手”表示权势、控制的惯用意象，并符合现代汉语表达。
- source_word: רֵעֵהוּ
  choice: 邻舍
  rationale: רֵעַ可指邻舍、同伴或朋友；社会崩解的语境中，“邻舍”范围较宽，也不预设友善关系。
- source_word: מַלְכּוֹ
  choice: 君王
  rationale: 原词明确指王；“君王”比“统治者”更准确地保留政治称谓。
- source_word: וְכִתְּתוּ
  choice: 摧毁
  rationale: כתת表示击碎、打烂；以土地为宾语时，“摧毁”自然且保留强烈的暴力审判意味。
- source_word: הָאָרֶץ
  choice: 这地
  rationale: 与本节前半保持一致，按局部地域理解；“这地”也比单独的“地”更自然。
- source_word: אַצִּיל
  choice: 救出
  rationale: Hiphil נצל意为拯救、解救；“救出”与מִיָּדָם“从他们手中”搭配自然。
- source_word: מִיָּדָם
  choice: 从他们手中
  rationale: 保留与前文“手中”呼应的权势意象。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；音译“雅威”明确保留专名性质，不以称号替代。
- issue: הָאָרֶץ的范围
  choice: 这地
  alternative: 全地；大地
  rationale: 撒迦利亚书11章的直接语境较适合指眼前受审判的地域，但原词也可能有更广范围，故在脚注中保留。
- issue: הָאָדָם אִישׁ的群体与分配关系
  choice: 众人……各人
  alternative: 每一个人；世人各自
  rationale: 译文既呈现הָאָדָם可能具有的集合意义，又保留אִישׁ所表达的逐一分配，不将其限定为仅指男性。
- issue: 末句未明说的宾语
  choice: 正文补作“这地”并加注
  alternative: 他们；不明说宾语
  rationale: 希伯来文末句只说“我不从他们手中救出”，没有明示所救对象；承接前句可理解为“这地”，但也可能指居民，因此用脚注公开此歧义。
translation_notes:
  register: 采用现代、庄重而清楚的先知书语体。“看哪”保留警示性的篇章标记；用短句呈现宣告与审判的推进。所有补足和重要歧义均以脚注说明。
