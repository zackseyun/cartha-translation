  yaml_path: translation/ot/zechariah/011/015.yaml
  text: Then Yahweh said to me[a], “Take again for yourself the equipment of a foolish shepherd.”
translation:
  language: zh_hans
  text: 耶和华对我说：“你再拿起愚昧牧人的器具〔a〕。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 又……说
  rationale: 该叙事形式承接并推进上下文；结合 עוֹד，译作“又……说”符合现代汉语叙事习惯。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文圣经语境中广为人知的专名形式，保留这是以色列之上帝名字而非普通称号的性质。
- source_word: אֵלָי
  choice: 对我
  rationale: 介词与第一人称单数后缀在“说”这一语境中自然译为“对我”。
- source_word: עוֹד
  choice: 又
  rationale: 表示再次或进一步采取行动；“又”简洁地传达先知将进行另一个象征性行动。
- source_word: קַח לְךָ
  choice: 你去拿
  rationale: קַח 是“拿、取”的命令式；לְךָ 表明受命者亲自参与。汉语“你去拿”自然体现这一指向，又避免生硬的“为自己拿”。
- source_word: כְּלִי
  choice: 一套……用具
  rationale: 该词可泛指器具、装备或物件；在牧人语境中，“一套……用具”自然表达相关器具的集合，而不把具体物件说死。
- source_word: רֹעֶה
  choice: 牧人
  rationale: 这是该分词在本语境中的标准名词性用法，指牧放羊群的人。
- source_word: אֱוִלִי
  choice: 愚昧
  rationale: 该形容词表示愚蠢、缺乏判断，也可带道德上的昏昧意味；“愚昧”比“无用”更贴近词义，并保留其道德色彩。
theological_decisions:
- issue: 象征性牧人的身份
  choice: 仅译作“愚昧牧人”，不进一步指明其身份
  alternative: 特定历史统治者、以色列腐败领袖的总体象征，或末世性的反牧人形象
  rationale: 本节希伯来文本只给出象征性称谓，没有明确认定具体人物；保持描述性译法可保留经文本身的开放性与神学张力。
translation_notes:
  register: 采用现代、庄重而口语顺畅的普通话。“一套……用具”传达 כְּלִי 的集合性和宽泛性；不添加脚注，因为正文已能自然保留其宽泛含义。
