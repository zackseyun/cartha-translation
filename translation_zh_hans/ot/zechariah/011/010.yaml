base_translation:
  language: en
  yaml_path: translation/ot/zechariah/011/010.yaml
  text: Then I took my staff Favor and cut it in two[a], to break my covenant that I had made with all the peoples.
translation:
  language: zh_hans
  text: 于是，我拿起我的杖——“恩惠”——把它砍断，为要废除我与万民[a]所立的约。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“列国”。希伯来语原词为复数，可指各族人民，也可指各国。
    reason: lexical_alternative
lexical_decisions:
- source_word: מַקְלִי
  choice: 我的杖
  rationale: מַקֵּל指杖或棍；这里是牧人所用且具有象征意义的杖，“杖”自然、简洁。
- source_word: נֹעַם
  choice: “恩惠”
  rationale: 该词在此用作杖的名称，基本义涵盖可喜、和悦与恩宠；“恩惠”既保留名称所表达的善意，也符合本段的立约语境。
- source_word: וָאֶגְדַּע אֹתוֹ
  choice: 把它砍断
  rationale: גדע表示砍下、砍断；“砍断”准确呈现以截断杖作为象征行动，不额外限定断成几截。
- source_word: לְהָפֵיר
  choice: 为要废除
  rationale: הפר用于约时可表示破坏、废止或使之失效；“废除”清楚表达这项象征行动旨在使约终止。
- source_word: בְּרִיתִי
  choice: 我的约
  rationale: בְּרִית是立约语境中的标准用词；现代汉语以“约”表达自然，并保留其神学分量。
- source_word: כָּרַתִּי
  choice: 所立的
  rationale: כרת ברית是“立约”的固定搭配；汉语用“立约”，无需直译其中“切割”的字面意象。
- source_word: כָּל הָעַמִּים
  choice: 万民
  rationale: 原文为复数，意为所有人民或民族群体；“万民”简洁保留其广泛范围，脚注提示“列国”这一可能译法。
theological_decisions:
- issue: “与万民所立的约”的范围
  choice: 保留“万民”的宽泛措辞，不在正文中把对象限定为以色列或周边敌国。
  alternative: 与列国所立的约；与他们周围各族所立的约
  rationale: 本节原文只说“所有的民/各民族”，没有进一步界定所指范围；译文应保留这种解释空间。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“恩惠”加引号以明确它是杖的名称；语序依照自然汉语表达，同时保留目的关系和立约措辞。
