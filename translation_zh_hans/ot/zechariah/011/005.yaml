  text: אֲשֶׁ֨ר קֹנֵי/הֶ֤ן יַֽהֲרְגֻ/ן֙ וְ/לֹ֣א יֶאְשָׁ֔מוּ וּ/מֹכְרֵי/הֶ֣ן יֹאמַ֔ר בָּר֥וּךְ יְהוָ֖ה וַ/אעְשִׁ֑ר וְ/רֹ֣עֵי/הֶ֔ם לֹ֥א יַחְמ֖וֹל עֲלֵי/הֶֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/011/005.yaml
  text: whose buyers slaughter them and are not held guilty[a], and whose sellers say, “Blessed be Yahweh[b], for I have become rich,” and their shepherds have no compassion on them.
translation:
  language: zh_hans
  text: 买羊的宰杀它们，却不被定罪[a]；卖羊的说：“雅威当受称颂，因为我发了财！”它们的牧人也不怜惜它们[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“却不负罪责”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“也不饶过它们”。
    reason: lexical_alternative
lexical_decisions:
- source_word: קֹנֵיהֶן
  choice: 买羊的
  rationale: קנה表示购买或取得；与下文“卖羊的”相对，保留买卖羊群的商业剥削意象。
- source_word: יַהֲרְגֻן
  choice: 宰杀
  rationale: 该动词基本义为“杀”，在羊群语境中译作“宰杀”自然，并突出残酷处置。
- source_word: וְלֹא יֶאְשָׁמוּ
  choice: 却不被定罪
  rationale: אשם可指负罪或被判有罪；此译保留原文在罪责与追究之间的张力，脚注列出另一种可能。
- source_word: וּמֹכְרֵיהֶן
  choice: 卖羊的
  rationale: 与“买羊的”构成明确对举，同时以自然现代汉语表达所属关系。
- source_word: בָּרוּךְ יְהוָה
  choice: 雅威当受称颂
  rationale: 保留希伯来语祝颂公式的感叹和颂赞语气，并直接音译神名。
- source_word: וָאֶעְשִׁר
  choice: 因为我发了财
  rationale: 该使役词形在此表达变得富有；“发了财”符合卖方自鸣得意的口吻，也准确传达结果状态。
- source_word: וְרֹעֵיהֶם
  choice: 牧养它们的
  rationale: 保留牧羊意象，又避免“牧师”所带来的后期教会职分含义；此处可指负责照管羊群者。
- source_word: לֹא יַחְמֹל עֲלֵיהֶן
  choice: 不怜惜它们
  rationale: חמל兼有怜悯与饶惜之意；“怜惜”在中文中可自然涵盖两者，脚注保留“不饶过”的可能。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；采用较贴近学界通行重构读音的“雅威”，不以称号替代专名。
- issue: רֹעִים 的牧羊隐喻
  choice: 牧养它们的
  alternative: 牧人／首领
  rationale: 不把隐喻解释成泛称“首领”，也不采用容易让人联想到教会职分的“牧师”，从而保留先知文本的羊群意象。
- issue: וְלֹא יֶאְשָׁמוּ 的罪责含义
  choice: 不被定罪
  alternative: 不负罪责／不受惩罚
  rationale: 原词既可强调成为有罪，也可涉及被追究罪责；正文选用“不被定罪”，脚注保存主动意义，避免把含义仅限于刑罚后果。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以分号呈现三组施害者及其行为；“发了财”保留卖方借宗教祝颂为获利辩护的尖锐反讽。所有代词按羊群语境译为“它们”。
