  source_fidelity: 原文为先知宣告公式：“雅威／耶和华，我的上帝，如此说”，继以第二人称单数命令“牧养”。צֹאן הַהֲרֵגָה 是带定冠词的集合表达，直译近于“那群宰杀的羊／供宰杀的羊群”，在语境中指将遭宰杀的羊群。修订避免把这一关系过度固定为纯将来被动，同时保留脚注说明。
  naturalness: 原文草案的“雅威我的上帝如此说”在现代汉语中缺少必要停顿，容易误读为一个连续名词短语。“雅威——我的上帝——如此说”清楚呈现“我的上帝”对神名的同位说明。以“你要”表达汉语命令式更自然、明确。
  terminology: “雅威”准确保留神名；“我的上帝”保留第一人称单数词尾；“牧养”维持本章牧人意象。“供宰杀的羊”既通顺，也比“将被宰杀的羊”更贴近原文简练而可含目的、命定意味的名词关系。
