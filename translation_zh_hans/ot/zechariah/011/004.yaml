  yaml_path: translation/ot/zechariah/011/004.yaml
  text: 'Thus says Yahweh my God: Shepherd the flock for slaughter[a].'
translation:
  language: zh_hans
  text: 雅威——我的上帝——如此说：“你要牧养那群供宰杀的羊[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“宰杀的羊群”，即将遭宰杀的羊群。
    reason: 保留 הַהֲרֵגָה 与 צֹאן 之间紧缩关系的较字面译法，并说明其在语境中的所指。
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: 如此说
  rationale: 这是先知传达神谕的固定引语格式；“如此说”简洁、庄重，也符合现代中文表达。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来语四字神名直接音译，保留其作为以色列之神专名的性质，而不以称号代替。
- source_word: אֱלֹהָי
  choice: 我的上帝
  rationale: 保留第一人称单数词尾“我的”，表明说话者称雅威为自己的上帝。
- source_word: רְעֵה
  choice: 牧养
  rationale: 第二人称阳性单数命令式；“牧养”既自然，又保留本章贯穿始终的牧人意象。
- source_word: צֹאן הַהֲרֵגָה
  choice: 这群将被宰杀的羊
  rationale: צֹאן 是集合名词；הַהֲרֵגָה 字面形成“宰杀之羊群”一类紧缩表达，语境指面临或注定遭宰杀的羊。正文以自然中文表达这一关系，同时用脚注保留较贴近字面的译法。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文使用神的专名，音译“雅威”可避免把专名改为称号，同时不额外引入宗派性解释。
- issue: “宰杀之羊群”所表达的命定意味
  choice: 将被宰杀的羊
  alternative: 供宰杀的羊；宰杀之羊群
  rationale: 希伯来语结构简练，可指供人宰杀或注定遭宰杀的羊群。正文表达被动前景，但不说明是谁宰杀，也不进一步界定神学上的预定关系；脚注保留形式更贴近原文的译法。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“雅威我的上帝如此说”保留先知宣告的正式语气；“牧养”延续全章的牧人意象。
