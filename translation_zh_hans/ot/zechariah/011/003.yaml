  text: ק֚וֹל יִֽלְלַ֣ת הָ/רֹעִ֔ים כִּ֥י שֻׁדְּדָ֖ה אַדַּרְתָּ֑/ם ק֚וֹל שַׁאֲגַ֣ת כְּפִירִ֔ים כִּ֥י שֻׁדַּ֖ד גְּא֥וֹן הַ/יַּרְדֵּֽן׃ס
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/011/003.yaml
  text: The sound of the shepherds’ wailing[a], for their splendor is ruined; the sound of the young lions’ roaring[b], for the majesty of the Jordan is ruined.
translation:
  language: zh_hans
  text: 牧人哀号的声音，因为他们的荣美[a]遭到毁坏；少壮狮子咆哮的声音，因为约旦河的威荣[b]遭到毁坏。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “荣美”也可译作“华美”或“尊荣”。该希伯来语词也可具体指华美的外衣或披风。
    reason: lexical_alternative
  - marker: b
    text: “约旦河的威荣”也可译作“约旦河的骄傲”。这个说法可能具体指约旦河两岸茂密的灌木丛。
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֚וֹל
  choice: 听！
  rationale: 该词本义为“声音、声响”；在这两行诗句开头用“听！”自然地突出传来的哀号与咆哮，同时保留两个分句的平行结构。
- source_word: יִֽלְלַ֣ת
  choice: 哀号
  rationale: 源自动词 ילל，表示因悲痛而号哭；用于牧人时，“哀号”既传达强烈悲恸，也符合庄重的先知诗歌语体。
- source_word: הָרֹעִ֔ים
  choice: 牧人
  rationale: 保留该词的基本意象，不直接解释为领袖或统治者。
- source_word: שֻׁדְּדָ֖ה / שֻׁדַּ֖ד
  choice: 已遭毁坏
  rationale: שׁדד 可指劫掠、摧毁或使荒废。两个分句采用相同译法，以保留原文的平行和反复。
- source_word: אַדַּרְתָּ֑ם
  choice: 他们的荣美
  rationale: אַדֶּרֶת 可指华美、威仪，也可具体指华美外衣。“荣美”在正文中保留抽象而宽广的诗意，具体词义另见脚注。
- source_word: שַׁאֲגַ֣ת
  choice: 咆哮
  rationale: 该词特指狮子的吼叫；“咆哮”准确而有力度，并与前行的“哀号”形成听觉上的平行。
- source_word: כְּפִירִ֔ים
  choice: 少壮狮子
  rationale: כפיר 指已经强健有力的幼狮或年轻狮子；“少壮狮子”比“幼狮”更能避免让读者误以为是尚弱小的狮崽。
- source_word: גְּא֥וֹן הַיַּרְדֵּֽן
  choice: 约旦河的威荣
  rationale: גאון 可指威严、尊荣或骄傲；这里不必带负面的道德含义。“威荣”保留原文的诗性表达，而不在正文中直接改译为沿岸丛林。
theological_decisions:
- issue: 是否明确牧人和少壮狮子的象征对象
  choice: 正文保留牧人与少壮狮子的字面意象
  alternative: 将其解释性地译为领袖、统治者或压迫者
  rationale: 本节没有明说这些形象所代表的对象。保留原文意象，可避免把一种可能的解释写入正文。
- issue: 如何理解“约旦河的威荣”
  choice: 保留“威荣”这一抽象诗性表达
  alternative: 直接译作“约旦河边的茂密丛林”或“约旦河的骄傲”
  rationale: 该短语可能具体指约旦河沿岸茂密、可供狮子栖身的灌木林，但原词本身是“威荣、尊荣、骄傲”。正文保留其语义张力，具体地理意象收入脚注。
translation_notes:
  register: 采用现代、庄重而清楚的普通话。“听！”重现两行开头 קוֹל 所带出的现场听觉效果；分号和重复句式保存希伯来诗歌的平行结构。
