  text: וָֽ/אֶגְדַּע֙ אֶת מַקְלִ֣/י הַ/שֵּׁנִ֔י אֵ֖ת הַ/חֹֽבְלִ֑ים לְ/הָפֵר֙ אֶת הָֽ/אַחֲוָ֔ה בֵּ֥ין יְהוּדָ֖ה וּ/בֵ֥ין יִשְׂרָאֵֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/011/014.yaml
  text: Then I cut in pieces my second staff[a], Union, to break the brotherhood between Judah and Israel.
translation:
  language: zh_hans
  text: 于是，我砍断了我的第二根杖[a]，就是“联合”，要破坏犹大与以色列之间的弟兄情谊。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “联合”所译的希伯来语也可理解为“绳索”“捆绑者”或使事物连结之物，含有捆绑在一起的意象。
    reason: 保留第二根杖名称的词义范围与象征性歧义。
lexical_decisions:
- source_word: וָאֶגְדַּע
  choice: 于是，我砍断了
  rationale: גדע常指砍下、砍断；在折断牧杖的象征行动中，“砍断”既保留切断的具体动作，也符合现代汉语表达。
- source_word: מַקְלִי הַשֵּׁנִי
  choice: 我的第二根杖
  rationale: מַקֵּל意为杖、棍；הַשֵּׁנִי明确为“第二”，并与上下文两根有名字的杖相呼应。
- source_word: הַחֹבְלִים
  choice: 联合
  rationale: 此词是第二根杖的名称。其词形可使人联想到绳索、捆绑者或使事物连结之物；结合本节犹大与以色列之间的关系，“联合”自然地传达其象征功能，而脚注保留字面语义范围。
- source_word: לְהָפֵר
  choice: 要破坏
  rationale: הפר可指破坏、废除或使失效。宾语是犹大与以色列之间的弟兄情谊，因此“破坏”能自然表达关系被瓦解，同时不把意义限定为正式废约。
- source_word: הָאַחֲוָה
  choice: 弟兄情谊
  rationale: אַחֲוָה表示兄弟关系、手足情谊或由此而来的团结。“弟兄情谊”保留原文明确的兄弟隐喻及其群体政治意味，且比单用“兄弟关系”更自然。
- source_word: בֵּין יְהוּדָה וּבֵין יִשְׂרָאֵל
  choice: 犹大与以色列之间
  rationale: 直译原文的双方结构，保留先知象征中犹大和以色列的历史政治区分，不增添“其余”等解释。
theological_decisions:
- issue: 象征性杖名הַחֹבְלִים的译法
  choice: 联合
  alternative: 绳索；捆绑者；连结
  rationale: 上下文把它作为杖名，并以杖的砍断象征犹大与以色列之间的联系遭破坏。“联合”清楚表达象征作用；脚注则保留希伯来词关于捆绑、连结的真实歧义。
- issue: אַחֲוָה中的兄弟隐喻
  choice: 弟兄情谊
  alternative: 手足关系；团结；情谊
  rationale: 原词明确源于“兄弟”概念，具有亲族与共同体双重意味。译作“弟兄情谊”不将其泛化为抽象的“团结”，也不额外规定这关系的神学性质。
- issue: לְהָפֵר所表达的关系性行动
  choice: 破坏
  alternative: 废除；使失效；打破
  rationale: 原词可用于约或安排被废止，也可表示使某事受挫、遭破坏。此处没有明说“约”，因此采用较宽的“破坏”，避免把弟兄情谊直接等同于一项正式盟约。
translation_notes:
  register: 采用现代、庄重且易懂的叙事语体。“砍断”保留象征动作的具体性；杖名加引号以表明专名；“弟兄情谊”保留原文亲族隐喻。所有脚注标记均已在正文中出现。
