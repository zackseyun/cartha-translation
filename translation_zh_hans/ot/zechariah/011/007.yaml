base_translation:
  language: en
  yaml_path: translation/ot/zechariah/011/007.yaml
  text: So I shepherded the flock doomed to slaughter, namely the afflicted of the flock. Then I took for myself two staffs; one I named Favor, and the other I named Union, and I shepherded the flock.
translation:
  language: zh_hans
  text: 于是我牧养那群待宰的羊，也就是羊群中困苦的羊。[a] 我为自己取了两根牧杖：一根我称为“恩惠”，另一根我称为“联结”；我就牧养羊群。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “也就是”所对应的希伯来语通常译作“所以”或“因此”。马所拉文本在此处的句法较难：后面的“羊群中困苦的羊”也可被理解为与前句并列的独立成分，而非对“待宰的羊”的同位说明。
    reason: 保留 לָכֵן 的通常词义及本句句法歧义，不将同位说明视为毫无疑问的唯一解释。
lexical_decisions:
- source_word: צֹאן הַהֲרֵגָה
  choice: 注定被宰杀的羊
  rationale: 直译为“被宰杀的羊群”；此处定冠词结构表明羊群正面临或被指定遭受宰杀。“注定”自然表达这种处境，但不额外指定是谁作出的判决。
- source_word: עֲנִיֵּי הַצֹּאן
  choice: 羊群中困苦的羊
  rationale: עָנִי 可指贫穷、受苦、卑微或受压迫的人；“困苦”保留物质匮乏与受苦两方面的语义，不把含义限缩为单纯贫穷或特定形式的压迫。
- source_word: נֹעַם
  choice: 恩惠
  rationale: 该词可指美好、可喜、悦纳或恩宠；在杖名及本段象征语境中，“恩惠”简明自然，并保留受眷顾之意。
- source_word: חֹבְלִים
  choice: 联结
  rationale: 该复数名词在本段与第14节的“弟兄关系”相连，基本意象是绳索、捆绑或纽带；“联结”既能作为杖名，也不提前把象征具体化为政治或宗教制度。
- source_word: מַקְלוֹת
  choice: 杖
  rationale: מַקֵּל 指手杖、棍或牧杖；上下文明确是牧羊人的象征性用具，简洁译作“杖”最自然。
theological_decisions:
- issue: “羊群中困苦的羊”与“注定被宰杀的羊群”的关系
  choice: 以“也就是”理解为进一步说明被牧养的对象
  alternative: 按 לָכֵן 的通常意义译作“所以/因此”，使“羊群中困苦的”成为后续独立成分
  rationale: 马所拉文本的 לָכֵן 通常意为“所以/因此”，但在这里照常义直译会造成句法突兀。结合上下文及古代译本证据，将后语视为对牧养对象的说明较为通顺；同时以脚注保留原文真实的句法和释义不确定性。
- issue: 两根杖名称的象征意义
  choice: 采用“恩惠”和“联结”，不在正文中解释其具体神学所指
  alternative: 译为“美善/悦纳”和“绳索/联合”，或直接解释为盟约、民族团结等
  rationale: 正文应保留先知行动本身的象征张力；具体意义会在后文逐步显明，不宜在本节预先落实为某一教义体系。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“牧养”保留先知以牧人为象征的核心动词；杖名加引号，使其作为专名清楚可辨。避免使用过度教会化的术语，也不擅自说明牧人或羊群分别代表谁。
