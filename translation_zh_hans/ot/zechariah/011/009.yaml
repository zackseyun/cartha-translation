  text: וָ/אֹמַ֕ר לֹ֥א אֶרְעֶ֖ה אֶתְ/כֶ֑ם הַ/מֵּתָ֣ה תָמ֗וּת וְ/הַ/נִּכְחֶ֨דֶת֙ תִּכָּחֵ֔ד וְ/הַ֨/נִּשְׁאָר֔וֹת תֹּאכַ֕לְנָה אִשָּׁ֖ה אֶת בְּשַׂ֥ר רְעוּתָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/011/009.yaml
  text: So I said[a], “I will not shepherd you. Let the dying die, and let the perishing perish[b]. And let those who remain each devour the flesh of the other.”
translation:
  language: zh_hans
  text: 我就说：“我不牧养你们。将死的，就让它死；将要灭亡的，就让它灭亡；剩下的[a]，就让它们各自吞吃同伴的肉[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“幸存的”；希伯来文直译为“剩下的”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译近于“一个（阴性个体）吃她同伴的肉”。这是分配式说法，意为各自吞吃同伴的肉；阴性语法形式与本段羊群的意象相呼应。
    reason: cultural_note
lexical_decisions:
- source_word: אֶרְעֶה
  choice: 牧养
  rationale: רעה在本章指牧人的行动。“牧养”既自然，又保留贯穿上下文的牧人和羊群意象，不缩减为单纯的“喂养”。
- source_word: הַמֵּתָה תָמוּת
  choice: 要死的，就让它死
  rationale: 以“要……的，就让……”再现分词加同根限定动词的简洁重复，也表达牧人任其结局临到的决绝语气。
- source_word: הַנִּכְחֶדֶת תִּכָּחֵד
  choice: 要灭亡的，就让它灭亡
  rationale: כחד在此表示被除灭、消亡；“灭亡”保留同根重复及强烈后果，同时避免加入“被歼灭”等更具体的施事含义。
- source_word: הַנִּשְׁאָרוֹת
  choice: 剩下的
  rationale: 直接表达שׁאר“留下、剩余”的分词含义；“幸存者”虽可理解，却会较明确地加入已经逃过灾难的意味。
- source_word: תֹּאכַלְנָה
  choice: 吞吃
  rationale: 基本义是“吃”，但宾语为“肉”，语境描写残酷的彼此毁灭；“吞吃”自然保留其暴烈形象。
- source_word: אִשָּׁה אֶת בְּשַׂר רְעוּתָהּ
  choice: 各自吞吃同伴的肉
  rationale: 原文采用阴性单数的分配式表达，字面近于“一个（阴性个体）吃她同伴的肉”；阴性形式与羊群意象相合。中文以“各自……同伴”传达分配关系，而不误译成专指女人。
theological_decisions:
- issue: 是否在拒绝照管的宣告中明确保留牧人意象
  choice: 我不再牧养你们
  alternative: 我不再喂养你们
  rationale: 本章的象征行动以牧人和羊群为核心。“牧养”保留该隐喻；“不再”则自然表达לֹא加未完成式在此所指的拒绝继续牧养。
- issue: 如何呈现末句吃肉的骇人图像
  choice: 就让它们各自吞吃同伴的肉
  alternative: 就让剩下的彼此残害
  rationale: 原文具体写到吃同伴的肉，表现极端的内部毁灭。译文不将这一图像抽象化或弱化，同时用“它们”承接羊群意象。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。用“它”指羊群中的个体，以维持本章牧人—羊群的象征框架；保留两组同根重复的节奏和末句不加缓和的暴烈意象。
