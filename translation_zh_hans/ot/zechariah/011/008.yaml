  text: וָ/אַכְחִ֛ד אֶת שְׁלֹ֥שֶׁת הָ/רֹעִ֖ים בְּ/יֶ֣רַח אֶחָ֑ד וַ/תִּקְצַ֤ר נַפְשִׁ/י֙ בָּ/הֶ֔ם וְ/גַם נַפְשָׁ֖/ם בָּחֲלָ֥ה בִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/011/008.yaml
  text: So I removed the three shepherds in one month[a], and my soul grew impatient with them[c][b], and their soul also loathed me.
translation:
  language: zh_hans
  text: 我在一个月内除掉了那三个牧人[a]。我心里厌烦他们[b]，他们也厌恶我。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “除掉”也可译作“毁灭”或“剪除”；原文动词可指使他们消失或被清除。“三个牧人”究竟指谁，原文没有说明，历来解释不一。
    reason: 词义选择及指代未定
  - marker: b
    text: “我心里厌烦”直译近于“我的心灵对他们变短了”，是表示忍耐耗尽、深感厌烦的希伯来语惯用语。
    reason: 希伯来语惯用表达
lexical_decisions:
- source_word: וָאַכְחִד
  choice: 除掉
  rationale: 使役形可表示使之消失、清除或毁灭。“除掉”体现行动的果断性，同时不武断判定这些牧人是被杀、被罢黜，还是以其他方式退出。
- source_word: שְׁלֹשֶׁת הָרֹעִים
  choice: 那三个牧人
  rationale: 保留本章核心的“牧人”隐喻，不在正文中解释为某类领袖；定冠词以“那”自然表达。
- source_word: בְּיֶרַח אֶחָד
  choice: 在一个月内
  rationale: 准确表达事情发生在一个月这一时限之内，并保留原文强调的时间紧迫感。
- source_word: וַתִּקְצַר נַפְשִׁי בָּהֶם
  choice: 我心里厌烦他们
  rationale: 短语“灵魂变短”是表达忍耐耗尽、厌烦或憎恶的希伯来语惯用语。“我心里厌烦”在现代汉语中自然，并保留内在情感的强度。
- source_word: וְגַם נַפְשָׁם בָּחֲלָה בִי
  choice: 他们也厌恶我
  rationale: בחל 表示厌恶、憎恶。“厌恶”保持原文的强烈语气；汉语以复数主语表达，比直译“他们的魂”更自然。
theological_decisions:
- issue: “三个牧人”的身份
  choice: 保留“那三个牧人”，不加以指认
  alternative: 解释为三位具体历史人物、先知祭司君王三类领袖，或腐败领导群体的象征数目
  rationale: 希伯来文本没有说明其身份；正文若明确指认，会把有争议的解释写进译文。脚注说明这一未决性。
- issue: 双方情感关系的强度与对应
  choice: 译作“我心里厌烦他们，他们也厌恶我”
  alternative: 将前后两句统一弱化为彼此不满，或统一强化为彼此憎恶
  rationale: 原文前句是“心灵变短”的惯用语，后句使用明确表示厌恶的 בחל；译文保留两者相关却不完全相同的强度。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“除掉”保留先知性象征行动的决断意味而不限定具体手段；前后分句分别用“心里厌烦”和“厌恶”，既便于普通读者理解，也保留希伯来语两个不同表达的力度差异。
