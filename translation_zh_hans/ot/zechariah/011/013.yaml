  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֵלַ֗/י הַשְׁלִיכֵ֨/הוּ֙ אֶל הַ/יּוֹצֵ֔ר אֶ֣דֶר הַ/יְקָ֔ר אֲשֶׁ֥ר יָקַ֖רְתִּי מֵֽ/עֲלֵי/הֶ֑ם וָֽ/אֶקְחָ/ה֙ שְׁלֹשִׁ֣ים הַ/כֶּ֔סֶף וָ/אַשְׁלִ֥יךְ אֹת֛/וֹ בֵּ֥ית יְהוָ֖ה אֶל הַ/יּוֹצֵֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/011/013.yaml
  text: Then Yahweh said to me[a], “Throw it to the potter—the magnificent price at which I was valued by them.” So I took the thirty pieces of silver and threw it into the house of Yahweh[b], to the potter.
translation:
  language: zh_hans
  text: 耶和华对我说：“把它扔给陶匠[a]吧——这堂皇的价钱，就是他们给我定的！”于是我拿起那三十块银子，在耶和华的殿里把它扔给了陶匠。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文此处及本节末尾两处都是“陶匠”。由于上下文难解，有人建议改读为“库房”，但马所拉文本两处均作“陶匠”。
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的专名译法，明确表达希伯来文的神名，而非以“主”替代。
- source_word: הַשְׁלִיכֵהוּ
  choice: 把它扔给
  rationale: 这是带第三人称阳性单数后缀的命令式；上下文所指是银子或价钱，中文用“它”自然，并保留“扔”的轻蔑力度。
- source_word: הַיּוֹצֵר
  choice: 陶匠
  rationale: יוצר通常指塑造陶器的人。尽管语境困难，且有人建议改读为“库房”，马所拉文本两处均为“陶匠”，正文予以保留。
- source_word: אֶדֶר הַיְקָר
  choice: 堂皇价钱
  rationale: 此短语兼有壮丽、尊贵与价值之意，在本节明显带反讽。“堂皇价钱”保留了高调措辞与三十块银子之间的张力。
- source_word: יָקַרְתִּי מֵעֲלֵיהֶם
  choice: 他们给我估定
  rationale: 按语境表达说话者受到他们估价；主动式中文比生硬的“我被他们估价”自然，同时不改变施事关系。
- source_word: שְׁלֹשִׁים הַכֶּסֶף
  choice: 那三十块银子
  rationale: 原文直译为“那三十银子”，未明说舍客勒；“块银子”自然且避免过度具体化币制。
- source_word: בֵּית יְהוָה
  choice: 耶和华的殿
  rationale: 此处“耶和华的家”指圣殿；中文译作“殿”清楚自然，也准确传达地点。
- source_word: אֶל הַיּוֹצֵר
  choice: 给了陶匠
  rationale: 保留马所拉文本末尾重复的“陶匠”；结合“在耶和华的殿里”，使动作的地点与趋向在中文中清楚可辨。
theological_decisions:
- issue: 困难语句中的“陶匠”以及对三十块银子的反讽性估价
  choice: 正文两处均保留“陶匠”，并将 אֶדֶר הַיְקָר 译为带反讽色彩的“堂皇价钱”
  alternative: 依推测改作“库房”，或把估价短语平直译成“好价钱”
  rationale: 马所拉文本两次明确写“陶匠”。不因语境困难或新约引用而暗中修订希伯来文本；同时以“堂皇”保存原文高昂措辞与低廉估价之间的讽刺张力。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“扔”保留动作的轻蔑感；“堂皇价钱”以简洁中文传达原文可能的讽刺。脚注只说明重要的文本解释难点，不借新约用法改写本节正文。
