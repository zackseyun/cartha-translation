base_translation:
  language: en
  yaml_path: translation/ot/zechariah/004/006.yaml
  text: 'Then he answered and said to me[a], “This is the word of Yahweh to Zerubbabel: ‘Not by might, nor by power[b], but by my Spirit,’ says Yahweh of Armies.”'
translation:
  language: zh_hans
  text: 他回答我说：“这是雅威给所罗巴伯的话：‘不是靠实力[a]，也不是靠力量，而是靠我的灵。’万军之雅威[b]说。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “实力”也可译作“军力”或“军队”；希伯来语词可指一般实力，也可专指军事力量。
    reason: lexical_alternative
  - marker: b
    text: 传统译法为“万军之耶和华”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן וַיֹּאמֶר אֵלַי לֵאמֹר
  choice: 他回答我说
  rationale: 以自然的现代汉语保留叙事次序和“回答、说”的言语引介功能；לֵאמֹר不机械重复译作“说道”。
- source_word: זֶה דְבַר יְהוָה
  choice: 这是雅威……所说的话
  rationale: דָּבָר在此是先知性话语；“所说的话”自然清楚，并保留其作为神谕的意味。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来语四字神名作音译，保留其专名性质，而不以称号替代。
- source_word: אֶל זְרֻבָּבֶל
  choice: 对所罗巴伯
  rationale: אֶל在此标明话语的对象；“对”比“给”更符合现代汉语的言语表达。
- source_word: לֹא בְחַיִל
  choice: 不是靠势力
  rationale: חַיִל可指实力、财富、军力或军队；“势力”保持较宽语义，同时不排除军事含义。
- source_word: וְלֹא בְכֹחַ
  choice: 也不是靠能力
  rationale: כֹּחַ表示力量或能力；“能力”与前句形成自然平行，又避免与“势力”完全同义。
- source_word: כִּי אִם
  choice: 而是
  rationale: 准确表达否定之后的强烈转折和排他性对照。
- source_word: בְרוּחִי
  choice: 靠我的灵
  rationale: 介词בְּ在三组平行结构中表示凭借或手段；“靠”保留同一工具性对比。רוּחַ在此指雅威的灵。
- source_word: אָמַר יְהוָה צְבָאוֹת
  choice: 万军之雅威说
  rationale: אָמַר按先知公式译作“说”；צְבָאוֹת译为“万军”，保留神圣称号中军旅与天军的广泛意涵。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；音译为“雅威”可保留其作为以色列之神专名的性质，不把专名默默改成称号。
- issue: רוּחִי所指及中文书写
  choice: 我的灵
  alternative: 我的气息；我的风
  rationale: רוּחַ本可指风、气息或灵，但此处说话者是雅威，并与人的势力和能力相对，语境最适合“我的灵”；中文不以大写形式额外界定其位格问题。
- issue: צְבָאוֹת在神圣称号中的表达
  choice: 万军之雅威
  alternative: 军队之雅威；万军之耶和华
  rationale: “万军”是简洁、庄重且可涵盖地上军队与天上众军的表达；不进一步限定这些“军队”具体指谁，以保留原文张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“不是靠……也不是靠……而是靠……”保留原文三重介词结构及鲜明对照；不补入“方能成事”等原文未明说的结果语。
