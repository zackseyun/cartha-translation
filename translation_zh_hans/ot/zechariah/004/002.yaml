base_translation:
  language: en
  yaml_path: translation/ot/zechariah/004/002.yaml
  text: And he said to me, “What do you see?” And I said, “I see, and behold, a lampstand all of gold, with its bowl on top of it, and seven lamps on it, with seven and seven spouts for the lamps that are on top of it.”
translation:
  language: zh_hans
  text: 他问我：“你看见什么？”我说：“我看见一座全金的灯台，灯台顶上有一个碗，台上有七盏灯；每盏灯各有七个管口[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“七个又七个管口，给灯台顶上的灯”；也可译作“管道”“导油管”或“注油口”。重复的数词通常理解为七盏灯各有七个，但其具体构件和分配方式仍有讨论。
    reason: 原文采用重复数词，且מוּצָקוֹת所指构件的确切形状及其分配方式不完全确定；脚注保留字面形式与主要理解空间。
lexical_decisions:
- source_word: מְנוֹרַת זָהָב כֻּלָּהּ
  choice: 一座全金的灯台
  rationale: מְנוֹרָה指设有灯盏的灯台；כֻּלָּהּ强调灯台整体为金质，译为“全金”简洁而准确。
- source_word: גֻלָּהּ
  choice: 油碗
  rationale: 此词在异象中指灯台顶部容纳并供应灯油的碗状器皿；补出“油”有助于现代读者理解其功能。
- source_word: נֵרֹתֶיהָ
  choice: 灯
  rationale: נֵר在这里是灯台上的七盏油灯，不是现代意义上的灯泡；量词“盏”符合汉语习惯。
- source_word: מוּצָקוֹת
  choice: 管道
  rationale: 该词在本节所指构件的具体形状并不完全确定，可能是输送灯油的管、槽或注油口；“管道”保留其连接和输送功能，又避免过度限定。
- source_word: שִׁבְעָה וְשִׁבְעָה
  choice: 每盏灯各有七根
  rationale: 希伯来语重复数词通常具有逐一分配的含义，即七盏灯各配七根；正文采用自然汉语表达，并以脚注保留原文形式及可能的理解空间。
theological_decisions:
- issue: 七根管道的分配方式
  choice: 理解为七盏灯每盏各有七根管道
  alternative: 理解为七盏灯合计只有七根管道，或把“七根又七根”视作不明确的强调说法
  rationale: שִׁבְעָה וְשִׁבְעָה的数词重复最自然地表达逐一分配；这也忠实保留异象中格外丰盛的供油结构，不以神学象征解释替代器物描写。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“我看见”承接异象语境；分号将灯台主体结构与管道细节区分开，便于朗读。避免加入象征意义或宗派性解释。
