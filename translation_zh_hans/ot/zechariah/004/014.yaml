  text: וַ/יֹּ֕אמֶר אֵ֖לֶּה שְׁנֵ֣י בְנֵֽי הַ/יִּצְהָ֑ר הָ/עֹמְדִ֖ים עַל אֲד֥וֹן כָּל הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/004/014.yaml
  text: And he said[a], “These are the two sons of oil[b], who stand by the Lord of all the earth.”
translation:
  language: zh_hans
  text: 他说：“这两个是油之子[a]，侍立在全地之主身旁[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译作“两个受膏者”。直译为“两个新油之子”。
    reason: lexical_alternative
  - marker: b
    text: 或译作“侍立在全地之主面前”。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 他就说
  rationale: 叙事性未完成式承接前文并引出解释；“就说”自然表达连续动作，不额外补入“回答”等原文未明说的含义。
- source_word: אֵלֶּה שְׁנֵי
  choice: 这就是那两个
  rationale: 复数指示词在无系词句中作表语，并回指异象中已经提到的两个对象；汉语以“这就是那两个”清楚表达。
- source_word: בְּנֵי הַיִּצְהָר
  choice: 油之子
  rationale: 保留希伯来语“……之子”的罕见隐喻，不在正文中直接解释为“受膏者”。יִצְהָר特指油，通常是新榨的橄榄油；其较完整的字面信息及常见解释置于脚注。
- source_word: הָעֹמְדִים
  choice: 侍立
  rationale: 分词表示持续站立，并在君王或主人的语境中含有在旁服侍、候命之意；“侍立”比单纯“站着”更贴合此处身份关系。
- source_word: עַל
  choice: 在……身旁
  rationale: 与“站立”连用时可表示在尊长身边或面前侍候；正文采用自然的“身旁”，同时在脚注保留“面前”这一可行译法。
- source_word: אֲדוֹן כָּל הָאָרֶץ
  choice: 全地之主
  rationale: 保留原文的主权称号和范围；“全地之主”简洁、庄重，也不把“地”擅自限定为某一地区。
theological_decisions:
- issue: בְּנֵי הַיִּצְהָר所指身份
  choice: 正文译作“两个油之子”，保留原文隐喻
  alternative: 两个受膏者
  rationale: 原文并未使用通常表示“受膏者”的词，而是字面说“油之子”。直保留这一异象性表达，可避免过早断定二者的具体身份；常见解释在脚注中说明。
- issue: עַל אֲדוֹן所表达的位置或关系
  choice: 译作“侍立在……身旁”
  alternative: 侍立在……面前
  rationale: 该短语可描写臣仆在主旁边侍候，也可着重其在主面前候命。正文选用自然且符合异象画面的“身旁”，脚注保留具有宫廷语感的“面前”。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“油之子”刻意保留原文不寻常的异象性隐喻；“侍立”则自然传达在至高者身边站立候命的关系。脚注标记均置于相应词语之后。
