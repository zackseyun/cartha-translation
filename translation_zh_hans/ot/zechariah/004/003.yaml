  text: וּ/שְׁנַ֥יִם זֵיתִ֖ים עָלֶ֑י/הָ אֶחָד֙ מִ/ימִ֣ין הַ/גֻּלָּ֔ה וְ/אֶחָ֖ד עַל שְׂמֹאלָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/004/003.yaml
  text: And two olive trees were beside it[b][a], one on the right of the bowl and one on its left.
translation:
  language: zh_hans
  text: 旁边有两棵橄榄树[a]：一棵在油碗[b]的右边，一棵在它的左边。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “旁边”或译“在其上”或“在其上方”。希伯来语介词含义较宽，但下文所说的左右位置更支持“旁边”。
    reason: lexical_alternative
  - marker: b
    text: 指灯台异象中碗状的盛油器。
    reason: cultural_note
lexical_decisions:
- source_word: וּ/שְׁנַיִם זֵיתִים
  choice: 有两棵橄榄树
  rationale: וְ承接上一节的异象描述，中文无须机械译出“并且”；זֵיתִים在此空间场景中指橄榄树，而非橄榄果。
- source_word: עָלֶיהָ
  choice: 旁边
  rationale: 介词עַל空间义较宽，可指在其上、靠着或在旁边；下文分别说明左右位置，因此正文采用自然且符合场景的“旁边”，同时以脚注保留其他可能。
- source_word: הַגֻּלָּה
  choice: 油碗
  rationale: גֻּלָּה在本异象中指灯台上碗状的盛油器；译作“油碗”既简明，也交代其功能。
- source_word: אֶחָד מִ/ימִין ... וְ/אֶחָד עַל שְׂמֹאלָהּ
  choice: 一棵在……的右边，一棵在它的左边
  rationale: 保留希伯来文对称的分配结构，并以现代汉语清楚表达两棵树各自的位置。
theological_decisions: []
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“旁边有……”比逐字译作“并且两棵橄榄树在其旁”更符合汉语叙述习惯；脚注标记均置于其所说明的词语之后。
