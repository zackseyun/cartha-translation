  text: Then I answered and said to him[a], “What are these two olive trees on the right of the lampstand and on its left?”
translation:
  language: zh_hans
  text: 于是我回答他，说：“灯台右边和左边的这两棵橄榄树是什么？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאַעַן וָאֹמַר אֵלָיו
  choice: 于是我又对他说
  rationale: 原文依次使用“回答”和“说”两个动词，构成希伯来语常见叙事表达。译文用“于是”体现连续动作，用“又”承接先前的询问，并以现代汉语自然的“对他说”表达说话对象；脚注保留较为直译的形式。
- source_word: מַה
  choice: 是什么
  rationale: 疑问词询问两棵橄榄树的身份或含义；“是什么”保留原文的开放性，不提前解释其象征意义。
- source_word: שְׁנֵי הַזֵּיתִים הָאֵלֶּה
  choice: 这两棵橄榄树
  rationale: זֵיתִים在本节指橄榄树，而非下一节另行提到的枝条；“棵”是现代汉语中树木的自然量词。
- source_word: עַל יְמִין הַמְּנוֹרָה וְעַל שְׂמֹאולָהּ
  choice: 灯台右边和左边的
  rationale: 两个עַל在这里表达相对于灯台的空间位置，并不必然表示树在灯台上面；汉语“右边和左边”自然、明确地保留两侧的位置关系。
- source_word: הַמְּנוֹרָה
  choice: 灯台
  rationale: מְנוֹרָה是承托灯盏的器具，译作“灯台”既保留普通名词意义，也符合本段异象语境。
theological_decisions:
- issue: 两棵橄榄树的象征身份
  choice: 仅译为“是什么”，不在正文中解释
  alternative: 译为“代表什么”或直接点明其象征对象
  rationale: 本节的问题本身保持开放，解释在后文展开；正文不应预先消除原文的叙事悬念或神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“灯台右边和左边的这两棵橄榄树”依照汉语习惯将方位定语前置；不添加“代表”或具体身份，以保存原文问题的开放性。
