  text: Then the angel who was speaking with me returned and woke me[a], like a man who is awakened from his sleep.
translation:
  language: zh_hans
  text: 那位与我说话的天使回来，唤醒了我，像一个人从睡梦中被唤醒一样。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“像一个人从睡梦中醒来一样。”希伯来语动词可理解为被动或反身的“被唤醒”，也可按不及物用法译为“醒来”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: 又来
  rationale: שוב表示返回或再次行动；结合异象叙事，用“又来”自然表达天使重新与先知互动，而不把空间方向说得过死。
- source_word: הַמַּלְאָךְ
  choice: 天使
  rationale: מלאך本可指“使者”，但在先知异象中这里是属天的中介者，译作“天使”最清楚自然。
- source_word: הַדֹּבֵר בִּי
  choice: 与我说话的
  rationale: 分词结构刻画这位天使为一直与撒迦利亚说话的那一位；“与我说话的”既简洁，也保留介词所表达的互动关系。
- source_word: וַיְעִירֵנִי
  choice: 唤醒我
  rationale: עור的使役词干表示使人醒来；“唤醒我”准确而庄重，并与后面的比喻形成呼应。
- source_word: כְּאִישׁ
  choice: 仿佛……一个……的人
  rationale: כְּ引出比喻，אִישׁ为单数的人；汉语用“仿佛……一个……的人”自然表达，不必机械突出男性性别。
- source_word: אֲשֶׁר יֵעוֹר מִשְּׁנָתוֹ
  choice: 唤醒一个睡着的人
  rationale: Niphal形式可有被动或反身色彩。正文按被动理解，并以自然汉语表达“从睡眠中被唤醒”；脚注保留自主醒来的可能。
