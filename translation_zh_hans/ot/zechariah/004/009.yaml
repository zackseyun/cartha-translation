base_translation:
  language: en
  yaml_path: translation/ot/zechariah/004/009.yaml
  text: The hands of Zerubbabel laid the foundation of this house[a], and his hands will complete it[b]. Then you will know that Yahweh of Armies has sent me to you.
translation:
  language: zh_hans
  text: “所罗巴伯的双手为这殿[a]奠了根基；他的双手也必把它建成。这样，你就会知道，是万军之耶和华[b]差遣我到你们这里来的。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “这殿”指圣殿。
    reason: cultural_note
  - marker: b
    text: “万军”也可译作“众军”或“军队”，指耶和华所统领的众军。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְדֵי זְרֻבָּבֶל
  choice: 所罗巴伯的双手
  rationale: 保留原文反复出现的“手”这一形象，并以现代汉语自然的“双手”突出所罗巴伯亲自承担并完成工程。
- source_word: יִסְּדוּ
  choice: 奠了根基
  rationale: יסד在建殿语境中指奠基；“奠了根基”准确、自然，也与后文的建成相呼应。
- source_word: הַבַּיִת הַזֶּה
  choice: 这殿
  rationale: בַּיִת字面为“房屋／家”，但本段明确指圣殿；汉语用“殿”既简洁又准确，不会使读者误解为普通住宅。
- source_word: וְיָדָיו תְּבַצַּעְנָה
  choice: 他的双手也必把它建成
  rationale: 重复“双手”以保留原文的修辞照应；תְּבַצַּעְנָה表示把工程做完，在建筑语境中译作“建成”最为清楚。
- source_word: וְיָדַעְתָּ
  choice: 这样，你就会知道
  rationale: 原文第二人称单数，并带有结果意味；“这样……就”自然表达圣殿建成之后所证实的结论。
- source_word: יְהוָה צְבָאוֹת
  choice: 万军之耶和华
  rationale: 用汉语圣经传统中清楚而庄重的称号表达神名与צְבָאוֹת；脚注补明后者的字面含义。
- source_word: שְׁלָחַנִי אֲלֵיכֶם
  choice: 差遣我到你们这里来
  rationale: 保留“我”作为受差遣者，并用“你们”明确原文复数受众；“到你们这里来”符合现代汉语表达。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: “耶和华”是现代汉语读者最熟悉且庄重的专名形式；不以“主”替代，从而保留原文所用的神名。
- issue: 称号צְבָאוֹת的理解
  choice: 万军
  alternative: 众军／军队
  rationale: “万军”保留该称号在汉语中的传统辨识度；脚注说明其含义，避免将“军”狭义理解为仅指人间军队。
- issue: “你”与“你们”的数差异
  choice: 你就会知道……到你们这里来
  alternative: 你们就会知道……到你们这里来
  rationale: 原文וְיָדַעְתָּ为第二人称单数，而אֲלֵיכֶם为复数。正文保留这一真实差异，不把单数和复数强行统一。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“双手”与“双手”的重复刻意保留原文修辞；“必把它建成”传达预言性的确定语气。正文区分单数“你”和复数“你们”，以反映希伯来文的人称数变化。
