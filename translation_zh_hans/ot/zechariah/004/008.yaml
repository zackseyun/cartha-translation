base_translation:
  language: en
  yaml_path: translation/ot/zechariah/004/008.yaml
  text: Then the word of Yahweh came to me[a], saying,
translation:
  language: zh_hans
  text: 耶和华的话又临到我，说：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: 又临到
  rationale: 该形式承接上下文，引入新的启示进展；与“话”搭配译作“临到”，符合希伯来先知书的固定表达，也自然体现本节与前文的延续。
- source_word: דְבַר
  choice: 话
  rationale: 在“耶和华的话”这一构词结构中，指特定的神圣传言；保留“话”可与先知书反复出现的公式保持一致。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 这是四字神名；采用现代中文圣经读者熟悉的专名“耶和华”，而不以一般称号替代。
- source_word: אֵלַי
  choice: 到我
  rationale: 介词及第一人称单数词尾表示“向我／到我”；在中文固定表达“话临到我”中自然译作“到我”。
- source_word: לֵאמֹר
  choice: 说
  rationale: 该不定式引出随后神谕的内容，现代中文以“说”简洁、自然地表达。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。中文稿保留为专名，并采用中文圣经传统中广为人知的“耶和华”；“雅威”是较贴近学术重构发音的另一译法。
- issue: וַיְהִי 的衔接关系
  choice: 又临到
  alternative: 于是临到
  rationale: 本节在同一异象段落中引入再次临到先知的话。“又”自然呈现重复或延续，但不额外说明启示的时间间隔。
translation_notes:
  register: 采用现代、庄重而易懂的先知书表述。“耶和华的话临到……说”保留原文公式结构；不用较古雅的“有……的话晓谕我”。
