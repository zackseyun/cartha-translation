base_translation:
  language: en
  yaml_path: translation/ot/zechariah/004/010.yaml
  text: For who has despised the day of small things? For these seven will rejoice and will see the plumb stone in the hand of Zerubbabel—these are the eyes of Yahweh[a], ranging through all the earth.
translation:
  language: zh_hans
  text: 谁藐视这微小之事的日子呢？他们必欢喜，也必看见所罗巴伯手中的准绳坠[a]。这七个就是雅威的眼睛，巡行全地。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “准绳坠”原文也可直译为“锡石”；传统译作“线锤”。在这里的建造语境中，很可能指用来校准垂直的坠子。
    reason: lexical_alternative
lexical_decisions:
- source_word: בַז
  choice: 藐视
  rationale: 该动词指轻看、视为无足轻重；“藐视”保留反问的力度，也符合庄重的现代汉语。
- source_word: לְיוֹם קְטַנּוֹת
  choice: 这微小之事的日子
  rationale: 原文直译近于“微小之事的日子”；不限定为“开端”，以免将语义缩窄为小小的开始。
- source_word: וְשָׂמְחוּ וְרָאוּ
  choice: 他们看见……就必欢喜
  rationale: 两个并列动词在语境中可自然表达看见与欢喜之间的时间和结果关系；中文以“看见……就必欢喜”保持二者，同时避免生硬直译。
- source_word: הָאֶבֶן הַבְּדִיל
  choice: 准绳坠
  rationale: בְּדִיל通常可指锡，但在建造语境中更可能是用来校准垂直的坠子；“准绳坠”清楚呈现其建筑用途，并在脚注保留字面可能。
- source_word: בְּיַד זְרֻבָּבֶל
  choice: 所罗巴伯手中的
  rationale: 自然表达原文“在所罗巴伯手中”，突出他亲自参与工程。
- source_word: שִׁבְעָה אֵלֶּה
  choice: 这七个
  rationale: 保留指示语及数目，并与下文“雅威的眼睛”构成同位说明。
- source_word: עֵינֵי יְהוָה
  choice: 雅威的眼睛
  rationale: 保留异象中具有神学意义的“眼睛”意象，并将四字神名按专名音译为“雅威”。
- source_word: מְשׁוֹטְטִים בְּכָל הָאָרֶץ
  choice: 遍察全地
  rationale: 分词本义含往来巡行；“遍察”在中文中自然地传达遍行并察看的意象，同时保持其覆盖全地的范围。
theological_decisions:
- issue: “这七个”的所指
  choice: 将“这七个”与“雅威的眼睛”处理为同位关系
  alternative: 理解为前文的七盏灯，随后再间接与雅威的眼睛相联系
  rationale: 希伯来语将“这七个”紧接在“雅威的眼睛”之前，最自然地形成同位说明；译文保留象征关系，不进一步界定其机制。
- issue: 欢喜者的身份
  choice: 以“他们”保留未明说的复数主语
  alternative: 将主语明确为“这些七个”或“众人”
  rationale: 原文两个复数动词的主语并未明示，句法衔接存在难点；不把“这七个”提前充当主语，也不擅自补成特定人群，可较好保存原文的含混。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“微小之事的日子”有意保留原文不寻常的表达；后半节分句以句号区分，减少把未明说的复数主语误认作“这七个”的风险。
