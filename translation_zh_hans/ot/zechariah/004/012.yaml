base_translation:
  language: en
  yaml_path: translation/ot/zechariah/004/012.yaml
  text: Then I answered a second time and said to him[a], “What are these two olive branches that are beside the two golden pipes[c][b], which pour out the gold from themselves?”
translation:
  language: zh_hans
  text: 我第二次回答，对他说：“那在两根金管[b]旁边、把金子[c]倾流出来的两个橄榄枝簇[a]是什么？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“两个橄榄穗（或枝簇）”。这里的希伯来词用法罕见，可能指结着果实的橄榄嫩枝，而不是较粗大的树枝。
    reason: lexical_alternative
  - marker: b
    text: 或译“两条金制管道”或“两根金导管”。原文所用的名词十分罕见。
    reason: lexical_alternative
  - marker: c
    text: 很可能指“金色的油”；希伯来文直译为“金子”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאַעַן שֵׁנִית וָאֹמַר אֵלָיו
  choice: 我又开口对他说
  rationale: ענה在叙事中承接前文，שֵׁנִית表示再次、第二次；中文用“又”自然表达重复。“开口对他说”保留“回答/发言”的意味，而不把陈述动词直接解释为“问”。
- source_word: שְׁתֵּי שִׁבֲּלֵי הַזֵּיתִים
  choice: 两簇橄榄枝
  rationale: שִׁבֳּלִים通常指穗、簇或穗状部分，在此是罕见的植物意象，可能指结实的橄榄嫩枝或枝簇。“两簇橄榄枝”兼顾其簇状意味与现代中文的可理解性，并以脚注保留其他可能。
- source_word: אֲשֶׁר בְּיַד
  choice: 在……旁边
  rationale: 字面为“在……手边/手中”；用于空间关系时可表示“在旁边”。此处对象均为异象中的器物，译作“旁边”较自然。
- source_word: שְׁנֵי צַנְתְּרוֹת הַזָּהָב
  choice: 两根金管
  rationale: צַנְתְּרוֹת是仅见于此处的罕见词，指输送液体的管、槽或导管。“金管”简洁表达材质和导流功能；脚注保留“金制管道”等译法。
- source_word: הַמְרִיקִים מֵעֲלֵיהֶם
  choice: 从自身倾出
  rationale: הַמְרִיקִים为阳性复数，与前面的橄榄枝相应，含使之流出、倒空之意；מֵעֲלֵיהֶם字面较难，约为“从它们上面/由它们”。“从自身倾出”保留橄榄枝作为来源的语法线索，不具体断定异象装置的运作方式。
- source_word: הַזָּהָב
  choice: 金子
  rationale: 希伯来文直说“金子/黄金”。尽管语境很可能指金色的油，正文仍保留异象的原有措辞，以脚注说明可能所指。
theological_decisions:
- issue: 灯台异象中“金子”的所指
  choice: 正文保留“金子”
  alternative: 译为“金色的油”或“金油”
  rationale: 原文使用הַזָּהָב“金子”，而非通常表示油的词。保留字面意象可避免把很可能正确、却仍属解释性的“油”直接写入正文。
translation_notes:
  register: 采用现代、庄重且可朗读的普通话。“我又开口对他说”保持叙事衔接；问句调整为中文自然语序。正文有意保留“金子”这一异象性表达，并用脚注说明其可能指金色的油。
