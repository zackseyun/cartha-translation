base_translation:
  language: en
  yaml_path: translation/ot/zechariah/004/007.yaml
  text: Who are you[a], O great mountain? Before Zerubbabel you will become a plain. And he will bring out the top stone amid shouts of, ‘Grace[b], grace to it!’
translation:
  language: zh_hans
  text: 大山哪，你算什么？在所罗巴伯面前，你必成为平地。他必带出顶石[a]；在“愿恩惠[b]归给它！愿恩惠归给它！”的欢呼声中。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“冠石”；原文直译为“头石”。
    reason: lexical_alternative
  - marker: b
    text: “恩惠”也可译作“宠爱”或“美好”。原文 חֵן 可按语境表示恩惠、宠爱、秀美或可爱。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי אַתָּה הַר הַגָּדוֹל
  choice: 大山哪，你算什么？
  rationale: 保留对巨大障碍的直接诘问；“你算什么”自然传达希伯来语“你是谁”的挑战语气，而“大山哪”体现呼语。
- source_word: לְמִישֹׁר
  choice: 你必成为平地
  rationale: מִישׁוֹר指平坦之地；此译保留大山变为平地的鲜明转化意象。
- source_word: וְהוֹצִיא
  choice: 他必把……搬出来
  rationale: 使役式表示使某物出来；上下文最自然的主语是所罗巴伯。“搬出来”符合建筑场景，又不过度限定具体安放动作。
- source_word: הָאֶבֶן הָרֹאשָׁה
  choice: 顶石
  rationale: 字面为“头石”，在建筑语境中可指置于顶部或标志完工的石头；“顶石”简明并保留空间意象，另以脚注注明“冠石”这一可能译法。
- source_word: תְּשֻׁאוֹת
  choice: 众人要欢呼
  rationale: 该词表示高声呼喊或喝彩；将隐含的呼喊者译作泛指“众人”，使现代汉语完整自然，但不指定特定群体。
- source_word: חֵן חֵן לָהּ
  choice: 愿恩惠归给它！愿恩惠归给它！
  rationale: חֵן可表示恩惠、宠爱或美好；“愿恩惠归给它”保留祝愿或宣告的开放性，重复两次以再现原文强调，阴性代词指向石头。
theological_decisions:
- issue: 欢呼中חֵן的含义
  choice: 把它译为对石头所代表工程的恩惠祝愿或欢庆
  alternative: 将其理解为称赞石头美丽可爱
  rationale: חֵן兼有恩惠、宠爱与美好之义；圣殿重建语境支持“恩惠”，但脚注保留“美好”这一词义可能，避免把呼声收窄为特定教义命题。
- issue: וְהוֹצִיא的主语
  choice: 承接近处的所罗巴伯，以“他”表达
  alternative: 理解为耶和华或不明说的行动者
  rationale: 句法与后续经文中所罗巴伯完成圣殿的语境最自然地支持所罗巴伯为主语，同时不额外解释该行动的神学机制。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“大山哪，你算什么”保留先知话语的力度；“平地”“顶石”“欢呼”保持具体意象。引语重复原文两次，不以汉语合并，从而保留强调与礼仪性呼喊。
