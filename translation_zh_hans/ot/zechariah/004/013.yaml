  text: וַ/יֹּ֤אמֶר אֵלַ/י֙ לֵ/אמֹ֔ר הֲ/ל֥וֹא יָדַ֖עְתָּ מָה אֵ֑לֶּה וָ/אֹמַ֖ר לֹ֥א אֲדֹנִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/004/013.yaml
  text: Then he said to me[a], “Do you not know what these are?” And I said, “No, my lord.”
translation:
  language: zh_hans
  text: 他对我说：“你不知道这些是什么吗？”我说：“不知道，我主[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“先生”。希伯来语 אֲדֹנִי 意为“我的主／我主”，是表示尊敬的称呼；这里指异象中与先知交谈、为他解说的那一位，并非神的专名。
    reason: 说明“我主”的字面敬称意义及可用的现代汉语替代译法，并澄清其在本处不是神的专名。
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלַי לֵאמֹר
  choice: 他对我说
  rationale: 以自然的现代汉语引出直接引语；וַיֹּאמֶר 推进叙事，אֵלַי 表示“对我”，而 לֵאמֹר 的引语功能已由冒号和引号体现，无须另译“说”。
- source_word: הֲלוֹא יָדַעְתָּ
  choice: 你不知道……吗
  rationale: 保留疑问词与否定词构成的反问形式，以及问题预期肯定回答的语气；יָדַעְתָּ 在此表示当下的“知道”。
- source_word: מָה אֵלֶּה
  choice: 这些是什么
  rationale: 直接表达疑问代词 מָה 与复数指示词 אֵלֶּה 的所指，不额外说明“这些”具体指什么。
- source_word: וָאֹמַר לֹא
  choice: 我说：“不知道”
  rationale: 原文回答只有否定词 לֹא；汉语对话中补出由上文省略的“知道”，比单说“不”更自然，同时不增加实质信息。
- source_word: אֲדֹנִי
  choice: 大人
  rationale: 此处是对异象中交谈者的尊称。“大人”在汉语中能表达恭敬称呼，又可避免把该词误认为神的专名或明确的神性称号。
theological_decisions:
- issue: אֲדֹנִי 是对异象中交谈者的尊称，还是神性称号
  choice: 大人
  alternative: 我主；先生
  rationale: 上下文中撒迦利亚正与为他解说异象者交谈。此词在这里是恭敬的称呼，不是耶和华的专名；译作“大人”既保留尊敬意味，也避免用“主”造成不必要的神性认定。
translation_notes:
  register: 采用简洁、庄重而易懂的现代标准汉语。保留原文反问的语气和“这些”所指的开放性；用“大人”表达尊称，并以脚注交代较直译的“我主”。
