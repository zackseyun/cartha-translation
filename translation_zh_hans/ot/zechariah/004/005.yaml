base_translation:
  language: en
  yaml_path: translation/ot/zechariah/004/005.yaml
  text: Then the angel who was speaking with me answered and said to me[a], “Do you not know what these are?” And I said, “No[b], my lord.”
translation:
  language: zh_hans
  text: 那与我说话的天使回答我说[a]：“你不知道这些是什么吗？”我说：“不知道[b]，我主。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“那一直与我交谈的天使”。原文这一表达描述天使正在持续与撒迦利亚交谈。
    reason: lexical_alternative
  - marker: b
    text: “我主”也可译作“先生”，是对这位天使的尊称，并不是指耶和华。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן
  choice: 回答
  rationale: ענה在这一叙事对话格式中表示“回答、回应”；“回答”既贴近原文，也自然衔接后面的“说”。
- source_word: הַמַּלְאָךְ
  choice: 天使
  rationale: מַלְאָךְ可指“使者”或“天使”；在撒迦利亚的异象叙事中，此处是负责解释异象的天上使者，故译“天使”。
- source_word: הַדֹּבֵר בִּי
  choice: 与我说话的
  rationale: 分词דֹּבֵר配合介词בְ在本书中描述持续与撒迦利亚交谈的天使。“与我说话的”自然表达这一关系，同时保留其描述性。
- source_word: וַיֹּאמֶר אֵלַי
  choice: 对我说
  rationale: אמר אל的常规对应，忠实保留直接引语的引入方式；中文合并为“回答我说”，避免重复累赘。
- source_word: הֲלוֹא
  choice: 你不知道……吗
  rationale: 疑问词与否定词构成带反问色彩的问题；此译保留问句形式，不擅自强化为“你当然知道”。
- source_word: יָדַעְתָּ
  choice: 知道
  rationale: ידע的基本义为“知道”；这里虽可按语境理解为“明白”，但“知道”更贴近原词且中文自然。
- source_word: מָה הֵמָּה אֵלֶּה
  choice: 这些是什么
  rationale: 询问异象中事物的身份或意义；“这些是什么”简洁自然，也保留原文的开放性。
- source_word: לֹא
  choice: 不知道
  rationale: 希伯来文仅用否定词简短作答；中文若只译“不是”或“不”容易生硬或歧义，因此补出上文隐含的“知道”。
- source_word: אֲדֹנִי
  choice: 我主
  rationale: 此处是撒迦利亚对天使的敬称，并非指耶和华。“我主”保留字面和尊敬语气，脚注说明也可理解为现代汉语的“先生”。
theological_decisions:
- issue: אֲדֹנִי的所指和语气
  choice: 作为对解释异象之天使的敬称，译作“我主”
  alternative: 先生；主人
  rationale: 上下文表明说话对象是天使而非耶和华。保留“我主”可体现原文的敬称力度，同时用脚注防止读者误认为是对上主的称呼。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“那与我说话的天使”延续撒迦利亚书异象叙事中的固定称呼；问答保持简洁。正文保留“我主”以反映敬称，借脚注消除神性称号方面的歧义。
