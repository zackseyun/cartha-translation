base_translation:
  language: en
  yaml_path: translation/ot/zechariah/004/004.yaml
  text: Then I answered and said to the angel who was speaking with me[a], “What are these, my lord?”
translation:
  language: zh_hans
  text: 于是我问那位与我说话的天使[a]：“大人，这些是什么？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“曾与我说话的”。这一希伯来语表达在撒迦利亚书中反复出现，指陪伴先知、为他解释异象的天使。
    reason: 说明分词表达的译法选择，以及这一表达在撒迦利亚书中作为解释异象之天使的反复公式。
lexical_decisions:
- source_word: וָאַעַן וָאֹמַר
  choice: 于是我问
  rationale: 希伯来文直译为“我回答并说”，是叙事中引出回应的双动词表达；此处内容实际是提问，现代汉语合并为“于是我问”更自然，同时保留承接上文的语气。
- source_word: הַמַּלְאָךְ
  choice: 天使
  rationale: מַלְאָךְ 可指“使者”或“天使”；在撒迦利亚的异象语境中，这是陪伴并解释异象的天上使者，因此译作“天使”。
- source_word: הַדֹּבֵר בִּי
  choice: 与我说话的
  rationale: 这一在撒迦利亚书中反复出现的表达，指天使同先知交谈。介词 בְּ 在此按语境译作“与”，而不机械直译为“在……里面”。
- source_word: לֵאמֹר
  choice: 不单独译出
  rationale: 该词用于引出直接引语；汉语在“问”后直接接引号已充分表达其功能，另译“说”会显得重复。
- source_word: מָה אֵלֶּה
  choice: 这些是什么
  rationale: 忠实表达疑问词与复数指示词；“这些”所指对象由异象上下文确定，无须补入“东西”。
- source_word: אֲדֹנִי
  choice: 我主啊
  rationale: 这是对眼前天使的恭敬称呼，并非上帝的专称。译作“我主啊”保留原文的敬称及庄重语气。
theological_decisions:
- issue: אֲדֹנִי 是指上帝，还是用于称呼解释异象的天使
  choice: 作为对天使的恭敬称呼，译为“我主啊”
  alternative: 译为表示上帝称号的“主啊”，或较弱的“先生”
  rationale: 直接受话者是“与我说话的天使”。原文在这里使用普通敬称 אֲדֹנִי，而非神名；“我主啊”既保留其字面和庄重色彩，也不把天使等同于上帝。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“于是”体现叙事推进；将希伯来文“回答并说”自然整合为“问”。保留“我主啊”的郑重称呼，同时借上下文明确其受话者是天使。
