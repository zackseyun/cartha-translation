base_translation:
  language: en
  yaml_path: translation/ot/zechariah/014/006.yaml
  text: 'And it will happen on that day: there will be no light[a]; the glorious ones will congeal.'
translation:
  language: zh_hans
  text: 那日，必没有光；辉耀之物必凝结[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或按另一种传统解法译作：“必没有光，也没有寒冷和冰霜。”本节末句的希伯来文含义不明，历来有多种解释。
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה
  choice: 到那日，必……
  rationale: 这是先知话语中引入未来事件的常用表达；结合后面的时间短语，以自然简洁的现代汉语表达其预告语气。
- source_word: בַּיּוֹם הַהוּא
  choice: 到那日
  rationale: 保留先知文学中具有标志性的时间表达，同时符合现代汉语习惯。
- source_word: לֹא יִהְיֶה אוֹר
  choice: 必没有光
  rationale: 直接表达否定存在句，不增添光消失或变暗等原文未明确说明的含义。
- source_word: יְקָרוֹת
  choice: 辉耀之物
  rationale: 该词可指贵重、华美或明亮之物；在此语境中可能关乎天体之光，但所指不明确，因此用“辉耀之物”兼顾光辉意象和指称上的含混。
- source_word: יקפאון
  choice: 都要凝结
  rationale: 按马所拉文本所示形式，保留该动词与凝固、冻结有关的具体意象，不改译成较具解释性的“变暗”或“减弱”。
theological_decisions:
- issue: 末句 יְקָרוֹת יקפאון 的解释
  choice: 按马所拉文本较直译为“辉耀之物都要凝结”
  alternative: “必没有光，也没有寒冷和冰霜”或“众光必变暗”
  rationale: 希伯来文的词义、句法及传统读法均十分困难，各译本分歧明显。正文尽量贴近马所拉文本，并以脚注保留重要的传统异读，避免替读者消除原文的真实歧义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“辉耀之物”有意保留原文罕见而含混的表达；脚注说明主要异读。
