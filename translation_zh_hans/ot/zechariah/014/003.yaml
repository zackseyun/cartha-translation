source:
  edition: WLC
  text: וְ/יָצָ֣א יְהוָ֔ה וְ/נִלְחַ֖ם בַּ/גּוֹיִ֣ם הָ/הֵ֑ם כְּ/י֥וֹם הִֽלָּחֲמ֖/ו בְּ/י֥וֹם קְרָֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/014/003.yaml
  text: Then Yahweh will go out and fight against those nations[a], as when he fights in a day of battle.
translation:
  language: zh_hans
  text: 那时，雅威必出去，与那些国家交战，如同他在争战之日作战时那样。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“如同他曾在争战之日作战时那样。”希伯来文的不定式本身没有明确标示这里所比较的争战是过去的还是一般性的。
    reason: 保留原文比较结构中的时态歧义。
lexical_decisions:
- source_word: וְיָצָא
  choice: 那时……必出去
  rationale: 先知性叙事中的连接形式承接上文，表示随后发生的行动；“那时”自然体现次序，“必”表达这里的将来指向。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以常用现代汉语音译保留希伯来文中的上帝专名，不用称号替代。
- source_word: וְנִלְחַם
  choice: 与……交战
  rationale: לחם 的尼法勒形式在此表示投入战斗；“交战”简明庄重，也适合与表示敌对对象的介词短语搭配。
- source_word: בַּגּוֹיִם הָהֵם
  choice: 与那些国家
  rationale: 介词 ב 与 לחם 连用时标示交战对象；גּוֹיִם 在国际性的语境中译作“国家”，הָהֵם 的指示意义由“那些”保留。
- source_word: כְּיוֹם הִלָּחֲמוֹ
  choice: 正如他……作战时一样
  rationale: 比较词 כ、名词“日”以及带第三人称单数后缀的不定式共同构成时间性的比较；汉语用“……时一样”自然表达其意义，同时不把比较锁定为某一特定历史事件。
- source_word: בְּיוֹם קְרָב
  choice: 在战斗之日
  rationale: קְרָב 指战斗、交锋；“战斗之日”保留原文庄重的战争意象，也避免擅自指定某一场已知战役。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 正文保留上帝在希伯来文中的专名，采用现代汉语中直接反映 YHWH 常见学术读音的“雅威”，不以“主”等称号替换。
- issue: 比较所指战斗的时态
  choice: 以“作战时”保留未明确限定的时间关系
  alternative: 译为“曾经作战时”，明确指向过去
  rationale: הִלָּחֲמוֹ 是不定式结构，本身没有明确标示过去或将来；上下文可使人联想到雅威以往的争战，但正文不强行限定，脚注列出过去时理解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。“那时”衔接上文，“与那些国家交战”清楚表达敌对关系；末句略保留“战斗之日”的先知文学色彩。正文中的脚注标记与脚注完全对应。
