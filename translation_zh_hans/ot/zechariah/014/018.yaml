id: ZEC.14.18
reference: Zechariah 14:18
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/אִם מִשְׁפַּ֨חַת מִצְרַ֧יִם לֹֽא תַעֲלֶ֛ה וְ/לֹ֥א בָאָ֖ה וְ/לֹ֣א עֲלֵי/הֶ֑ם תִּֽהְיֶ֣ה הַ/מַּגֵּפָ֗ה אֲשֶׁ֨ר יִגֹּ֤ף יְהוָה֙ אֶת הַ/גּוֹיִ֔ם אֲשֶׁר֙ לֹ֣א יַֽעֲל֔וּ לָ/חֹ֖ג אֶת חַ֥ג הַ/סֻּכּֽוֹת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/014/018.yaml
  text: And if the family of Egypt does not go up and does not come[c][b][a], then the plague will not be upon them—the plague with which Yahweh strikes the nations that do not go up to celebrate the Feast of Booths.
translation:
  language: zh_hans
  text: 如果埃及这一家族不上去，也不来，灾殃就不会临到他们[a]——这灾殃是雅威用来击打那些不上去守住棚节的列国的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文本按字面可译为“灾殃不会在他们身上”；随后又称这灾殃为雅威击打那些不上去守住棚节之列国的灾殃。此说法与上一节关于不降雨的审判形成难解的张力。有些解释认为埃及不倚赖雨水，因而应受灾殃；但马所拉文本在这里的表层句法是“灾殃不会临到他们”。
    reason: 原文句法与上下文关系存在歧义
lexical_decisions:
- source_word: מִשְׁפַּחַת מִצְרַיִם
  choice: 埃及这一族
  rationale: 保留单数集合名词“族、家族”的表达，不把它简化为单指国名“埃及”；“这一族”在现代汉语中较自然。
- source_word: תַעֲלֶה
  choice: 上去
  rationale: עלה是前往耶路撒冷及朝圣过节的惯用动词；“上去”既保留方向意象，也符合现代汉语。
- source_word: וְלֹא בָאָה
  choice: 也不来
  rationale: 保留原文“上去”和“来”两个动词的并列，不将其合并，以呈现加强朝圣行动之意的可能性。
- source_word: וְלֹא עֲלֵיהֶם
  choice: 他们那里也不会有
  rationale: 原文在此省略了“有”的事物，仅为“也不在他们之上/那里”；译文保留省略，并以脚注说明其与上节“雨”的可能联系，避免擅自补定。
- source_word: הַמַּגֵּפָה
  choice: 灾殃
  rationale: מַגֵּפָה指因击打而来的灾祸或瘟疫；此处未说明具体为疫病，“灾殃”比“瘟疫”涵盖面更准确，并与后面的נָגַף形成语义呼应。
- source_word: יִגֹּף
  choice: 击打
  rationale: 直译נָגַף的核心意义，并保留“灾殃”是雅威击打列国之手段或结果的联系。
- source_word: הַגּוֹיִם
  choice: 列国
  rationale: 此处泛指各国，不引入后期“外邦人”的宗教群体对比。
- source_word: לָחֹג
  choice: 守
  rationale: 在节期语境中，“守节”是自然、庄重的现代汉语，也兼含遵行和庆祝之意。
- source_word: חַג הַסֻּכּוֹת
  choice: 住棚节
  rationale: “住棚节”是准确而通行的汉语名称，保留סֻכּוֹת“棚子”的意象。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以音译呈现四字神名，不以称号替代专名。
theological_decisions:
- issue: 本节与上一节“不降雨”之间的关系及希伯来文的省略
  choice: 正文保留“他们那里也不会有”的未完成表达，并用脚注说明可能省略“雨”；随后明确译出“必有灾殃”
  alternative: 补译为“他们那里也不会有雨”；或把前后词语连为“灾殃不会临到他们”
  rationale: 马所拉文本在“他们那里也不会有”处没有明说“雨”，而后面明确出现“灾殃”。直接补上“雨”会消除原文的省略；把“灾殃”接到否定句中则会造成“灾殃不会临到他们”，与上下文关系尤其困难。正文保留省略和张力，脚注列明主要理解。
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名，音译“雅威”可保留其专名性质。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“埃及这一族”保留原文单数集合表达；“上去，也不来”刻意保留两个朝圣动词；在关键省略处不替原文消除歧义。
