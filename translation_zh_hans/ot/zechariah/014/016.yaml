revisions:
- from: 那时，所有从那些前来攻打耶路撒冷的列国中存留下来的人，都要年年上去敬拜君王——万军之耶和华[a]，并守住棚节[b]。
  to: 那时，所有从前来攻打耶路撒冷的列国中存留下来的人，都要年年上去敬拜君王——万军之耶和华[a]，并庆祝住棚节[b]。
  rationale: 将“守住棚节”改为“庆祝住棚节”，以准确表达 חגג 的节庆、举行之义，并消除“守住”的现代汉语歧义；同时删去“那些”，使“所有列国”的范围在中文中更明确。其余译文保留原有的预言语气、朝圣性的“上去”、君王称号及末世图景的解释开放性。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T08:17:29Z'
review_pass:
  verdict: revise
  source_fidelity: 译文整体准确保留了预言性的未来结果、列国中幸存者、上耶路撒冷敬拜君王以及庆祝住棚节的图景；“前来攻打”可恰当表达 עַל 在此处的敌对军事语境。惟“守住棚节”中的“守住”在现代汉语中通常意为“守住、保住”，不表示遵守或庆祝节期，需改正。
  naturalness: 除“守住棚节”外，语句庄重、清楚且符合现代书面普通话。“从所有前来攻打耶路撒冷的列国中存留下来的人”比“从那些……列国中”更明确对应原文两次的“所有”。
  terminology: “耶和华”“万军之耶和华”“住棚节”均为中文圣经语境中稳妥、通行的译法。“庆祝住棚节”准确对应 חגג，且不额外限定节期实践。脚注保留“雅威”和“帐棚节”作为可行异译即可。
  issues:
  - severity: medium
    issue: “并守住棚节”用词错误且语义含混。
    rationale: “守住”通常表示保全或坚持守住某物，并非“守节／庆祝节期”的常用表达；原文 וְלָחֹג 意为庆祝、举行节期。应改为“并庆祝住棚节”或“并守住棚节”（后者不可取）。
  - severity: low
    issue: “那些前来攻打……的列国”未充分显出原文“所有列国”。
    rationale: 原文 מִכָּל הַגּוֹיִם 明示“从所有列国中”；改为“从所有前来攻打耶路撒冷的列国中”更完整，且中文仍自然。
  revised_text: 那时，所有从前来攻打耶路撒冷的列国中存留下来的人，都要年年上去敬拜君王——万军之耶和华[a]，并庆祝住棚节[b]。
  revised_footnotes:
