source:
  edition: WLC
  text: וְ/הָיָ֗ה כָּל הַ/נּוֹתָר֙ מִ/כָּל הַ/גּוֹיִ֔ם הַ/בָּאִ֖ים עַל יְרֽוּשָׁלִָ֑ם וְ/עָל֞וּ מִ/דֵּ֧י שָׁנָ֣ה בְ/שָׁנָ֗ה לְ/הִֽשְׁתַּחֲוֺת֙ לְ/מֶ֨לֶךְ֙ יְהוָ֣ה צְבָא֔וֹת וְ/לָ/חֹ֖ג אֶת חַ֥ג הַ/סֻּכּֽוֹת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/014/016.yaml
  text: Then all who remain from all the nations that came against Jerusalem shall go up year after year to worship the King[a], Yahweh of Armies[b], and to celebrate the Feast of Booths.
translation:
  language: zh_hans
  text: 那时，所有从前来攻打耶路撒冷的列国中存留下来的人，都要年年上去敬拜君王——万军之耶和华[a]，并庆祝住棚节[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “耶和华”也译“雅威”；“万军之耶和华”也可译作“众军之雅威”。
    reason: 说明神名及 צְבָאוֹת 称号的可行译法。
  - marker: b
    text: “住棚节”也称“帐棚节”。
    reason: 提供该节期名称的传统中文异译。
lexical_decisions:
- source_word: וְהָיָה
  choice: 那时……都要
  rationale: 承接先知预言的进程并引出未来结果；“那时”自然表达篇章推进，“都要”保留将来语气。
- source_word: כָּל הַנּוֹתָר
  choice: 所有……存留下来的人
  rationale: 保留分词所指的幸存、余留之人，同时避免把他们抽象化为“余民”。
- source_word: מִכָּל הַגּוֹיִם
  choice: 从……列国中
  rationale: 明确表达这些人来自列国之中；“列国”符合国际群体的语境。
- source_word: הַבָּאִים עַל יְרוּשָׁלִָם
  choice: 前来攻打耶路撒冷的
  rationale: עַל 在此军事语境中表示敌对进逼；中文用“攻打”自然显明敌意，但不细化战事阶段。
- source_word: וְעָלוּ
  choice: 上去
  rationale: 保留前往耶路撒冷时惯用的“上去”，兼具地理与朝圣意味。
- source_word: מִדֵּי שָׁנָה בְשָׁנָה
  choice: 年年
  rationale: 简洁自然地表达逐年持续、定期重复。
- source_word: לְהִשְׁתַּחֲוֺת
  choice: 敬拜
  rationale: 该词本指俯伏，但在此礼仪语境中表示敬拜；译文传达宗教行为的实际含义。
- source_word: לְמֶלֶךְ
  choice: 敬拜君王
  rationale: 保留“君王”这一重要称号，并按中文句法与“敬拜”直接搭配。
- source_word: יְהוָה צְבָאוֹת
  choice: 万军之耶和华
  rationale: “耶和华”在现代中文圣经语域中是神圣四字名的通行音译；“万军之”保留 צְבָאוֹת 的传统、庄严称号及天上与军事群体的宽广含义。
- source_word: וְלָחֹג
  choice: 并守
  rationale: חגג 表示举行、庆守节期；“守”与中文“节”自然搭配，也包含按期庆祝遵行之意。
- source_word: חַג הַסֻּכּוֹת
  choice: 住棚节
  rationale: “住棚节”是现代中文对该以临时棚舍为标志之节期的通行名称，清楚而不生硬。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用神圣四字名。正文采用现代中文圣经读者最熟悉的音译“耶和华”，并以脚注列出更贴近学术重构读音的“雅威”，不以“主”替代专名。
- issue: 称号 צְבָאוֹת 的范围
  choice: 万军之
  alternative: 众军之
  rationale: 采用庄严且通行的中文表达；此称号可能涵盖天上众军及军事力量，译文不把所指限定为某一种军队。
- issue: 列国朝圣的末世范围
  choice: 保留列国幸存者年年上耶路撒冷敬拜、守节的预言图景
  alternative: 将其明确解释为未来字面朝圣，或普世敬拜的象征
  rationale: 经文本身没有在本节判定该图景应严格按字面、预表或启示性象征理解，因此译文不替读者消解这一张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。以“那时……都要”呈现预言进程，以“年年上去”保留朝圣语感；破折号标明“君王”与“万军之耶和华”同位。正文中的脚注标记[a]、[b]均与脚注对应。
