source:
  edition: WLC
  text: וְ/נַסְתֶּ֣ם גֵּֽיא הָרַ֗/י כִּֽי יַגִּ֣יעַ גֵּי הָרִים֮ אֶל אָצַל֒ וְ/נַסְתֶּ֗ם כַּ/אֲשֶׁ֤ר נַסְתֶּם֙ מִ/פְּנֵ֣י הָ/רַ֔עַשׁ בִּ/ימֵ֖י עֻזִּיָּ֣ה מֶֽלֶךְ יְהוּדָ֑ה וּ/בָא֙ יְהוָ֣ה אֱלֹהַ֔/י כָּל קְדֹשִׁ֖ים עִמָּֽ/ךְ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/014/005.yaml
  text: And you will flee by the valley of my mountains[a], for the valley of the mountains will reach to Azal. Yes, you will flee as you fled from before the earthquake in the days of Uzziah king of Judah. Then Yahweh my God will come[b], and all the holy ones with him.
translation:
  language: zh_hans
  text: 你们要沿着我众山间的山谷逃跑，因为众山的山谷必延伸到亚萨。你们要逃跑，正如你们在犹大王乌西雅的日子因地震而逃跑一样。随后，雅威——我的上帝——必来，所有圣者[b]都与你同在[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些文本作“与他同在”。
    reason: textual_variant
  - marker: b
    text: “圣者”可能指天上的侍从；也有人理解为“圣徒”或“天使”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנַסְתֶּם
  choice: 你们要逃跑
  rationale: נוּס通常表示“逃跑”；下文以当年躲避地震而逃作比较，进一步支持这一含义。
- source_word: גֵּיא הָרַי
  choice: 我众山之间的谷
  rationale: 保留הָרַי明确的第一人称单数所属义“我的众山”，并用自然汉语表达山间谷地。
- source_word: כִּי יַגִּיעַ גֵּי הָרִים אֶל אָצַל
  choice: 因为这山谷必延伸到亚萨
  rationale: כִּי引出逃跑路线得以通达的原因；יַגִּיעַ在此表示空间上的延伸或达到。אָצַל按地名音译为“亚萨”。
- source_word: מִפְּנֵי הָרַעַשׁ
  choice: 躲避地震而逃
  rationale: 以自然现代汉语传达“从地震面前逃离”的希伯来语意象，同时避免生硬直译。
- source_word: וּבָא יְהוָה אֱלֹהַי
  choice: 随后，我的上帝雅威必来
  rationale: וּבָא在语境中推进事件次序，译作“随后……必来”；保留神名雅威及“我的上帝”的第一人称所属关系。
- source_word: כָּל קְדֹשִׁים
  choice: 所有圣者
  rationale: קְדֹשִׁים可泛指分别为圣者，包括天上侍从，但原文没有明确限定为天使或得赎的人，因此采用保持开放性的“圣者”。
- source_word: עִמָּךְ
  choice: 与你同来
  rationale: WLC正文为第二人称单数“与你”；主文优先照此翻译，并以脚注说明“与他同来”的文本异读。
theological_decisions:
- issue: 随雅威而来的“圣者”是谁
  choice: 所有圣者
  alternative: 所有圣徒；所有圣天使
  rationale: 希伯来语没有明确判定他们是天使还是属上帝的人；主文保留其神学张力，不替读者作出限定。
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名，音译为“雅威”可保留其专名性质，而不以称号代替。
- issue: 末句代词的文本差异
  choice: 与你同来
  alternative: 与他同来
  rationale: WLC所列正文עִמָּךְ为“与你”；另有文本证据支持第三人称“与他”，故将后者列入脚注，不在主文中消除这一差异。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“沿着……谷逃跑”清楚表达谷地是逃生通道，避免“从谷逃跑”可能造成逃离谷地的误解；句式保留先知性叙述的推进感。
