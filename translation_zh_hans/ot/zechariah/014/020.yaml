id: ZEC.14.20
reference: Zechariah 14:20
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: בַּ/יּ֣וֹם הַ/ה֗וּא יִֽהְיֶה֙ עַל מְצִלּ֣וֹת הַ/סּ֔וּס קֹ֖דֶשׁ לַֽ/יהוָ֑ה וְ/הָיָ֤ה הַ/סִּירוֹת֙ בְּ/בֵ֣ית יְהוָ֔ה כַּ/מִּזְרָקִ֖ים לִ/פְנֵ֥י הַ/מִּזְבֵּֽחַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/014/020.yaml
  text: On that day[a], there will be on the bells of the horses[c][b], “Holy to Yahweh,” and the pots in the house of Yahweh will be like the bowls before the altar.
translation:
  language: zh_hans
  text: 到那日，马铃上必有“归耶和华为圣”[a]；耶和华殿里的锅，也必像祭坛前的碗[b]一样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“圣洁归于耶和华。”这句话呼应大祭司金牌上的铭文（出埃及记28:36）。
    reason: 说明固定礼仪用语的另一种译法及其经文呼应。
  - marker: b
    text: “碗”或译“盆”，指圣殿礼仪中使用的器皿。
    reason: 保留מִזְרָקִים在器形上的词义可能性，并交代其礼仪背景。
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: 到那日
  rationale: 保留先知书常见的末后指向性时间公式，同时符合现代汉语圣经语体。
- source_word: עַל מְצִלּוֹת הַסּוּס
  choice: 马铃上
  rationale: מְצִלּוֹת最可能指马具上会发出清脆声响的小金属件；“马铃”简洁自然。单数הַסּוּס在此作类称，汉语无需显式复数。
- source_word: קֹדֶשׁ לַיהוָה
  choice: “归耶和华为圣”
  rationale: 既传达分别为圣，也保留לַיהוָה所表达的归属、奉献关系，并呼应出埃及记28:36大祭司金牌上的铭文。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文圣经传统中对四字神名的通行音译，使神名与普通称号有所区别。
- source_word: הַסִּירוֹת
  choice: 锅
  rationale: 该词指煮食或煮祭物所用的器皿；“锅”准确、通俗，不额外限定具体用途。
- source_word: בְּבֵית יְהוָה
  choice: 耶和华殿里
  rationale: “殿”自然表达此处“耶和华的家”所指的圣殿，避免现代读者误解为普通房屋。
- source_word: כַּמִּזְרָקִים לִפְנֵי הַמִּזְבֵּחַ
  choice: 像祭坛前的碗一样
  rationale: מִזְרָקִים指礼仪中使用的碗形或盆形器皿；“碗”较为通俗，空间关系“祭坛前”则直接保留原文。
theological_decisions:
- issue: 圣洁由祭司礼仪器物扩展至日常器物
  choice: 让马铃带有“归耶和华为圣”的铭文，并把殿里的锅比作祭坛前的碗
  alternative: 仅笼统表达普遍蒙福，不突出圣俗界限的变化
  rationale: 原文明确采用祭司金牌的圣洁用语，又将普通锅与礼仪器皿并列，显示异象中的圣洁延伸；译文呈现这一张力而不在正文中加以神学解释。
translation_notes:
  register: 采用庄重而清晰的现代标准汉语。“到那日”“归耶和华为圣”保留先知及礼仪语体；其余措辞尽量通俗。正文不补入原文未明说的“刻着”等动作。
