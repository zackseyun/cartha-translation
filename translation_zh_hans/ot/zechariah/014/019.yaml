source:
  edition: WLC
  text: זֹ֥את תִּהְיֶ֖ה חַטַּ֣את מִצְרָ֑יִם וְ/חַטַּאת֙ כָּל הַ/גּוֹיִ֔ם אֲשֶׁר֙ לֹ֣א יַֽעֲל֔וּ לָ/חֹ֖ג אֶת חַ֥ג הַ/סֻּכּֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/014/019.yaml
  text: This will be the punishment of Egypt[b][a], and the punishment of all the nations that do not go up to celebrate the Festival of Booths.
translation:
  language: zh_hans
  text: 这将是埃及所受的惩罚[a]，也是所有不上去庆祝住棚节[b]的列国所受的惩罚。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “惩罚”或译“刑罚”。这个希伯来词在别处也可指“罪”，但在这里是指不上去庆祝节期所招致的审判。
    reason: lexical_alternative
  - marker: b
    text: 希伯来名称直译为“棚屋节”。
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת תִּהְיֶה
  choice: 这将是
  rationale: 保留指向上文所述后果的指示语和未完成式在本语境中的将来、结果含义。
- source_word: חַטַּאת
  choice: 所受的惩罚
  rationale: 该词常可指“罪”或“赎罪祭”，但本节承接上文的灾罚，指拒绝上去守节所招致的惩罚；加入“所受的”使现代汉语关系清楚。
- source_word: מִצְרָיִם
  choice: 埃及
  rationale: 采用该国名的现代汉语标准译法。
- source_word: כָּל הַגּוֹיִם
  choice: 所有……的列国
  rationale: 这里泛指各国；“列国”符合先知书语体，又不限定为某一族群。
- source_word: אֲשֶׁר לֹא יַעֲלוּ
  choice: 不上去
  rationale: 保留前往耶路撒冷朝圣时“上去”的空间和宗教惯用表达；不额外强化为主观“拒绝”。
- source_word: לָחֹג
  choice: 守
  rationale: 希伯来语指庆祝、遵守朝圣节期；“守节”是自然简洁的现代汉语表达。
- source_word: חַג הַסֻּכּוֹת
  choice: 住棚节
  rationale: 采用现代汉语中清楚而通行的节期名称，同时以脚注说明其字面意象。
theological_decisions:
- issue: 末世审判语境中 חַטַּאת 的含义
  choice: 惩罚
  alternative: 罪；刑罚；赎罪祭
  rationale: 本节总结埃及和列国不参加节期所招致的审判后果。“惩罚”最符合14:18—19的上下文，同时以脚注保留该希伯来词通常也可表示“罪”的词义张力。
- issue: חַג הַסֻּכּוֹת 的节期名称
  choice: 住棚节
  alternative: 棚屋节
  rationale: “住棚节”是现代汉语中通行、易懂的名称；脚注补明希伯来名称的字面意象，不引入宗派性解释。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。句中重复“所受的惩罚”，对应原文两次出现的 חַטַּאת，并清楚表明埃及与列国同受这一后果；“不上去”保留朝圣上耶路撒冷的表达。
