base_translation:
  language: en
  yaml_path: translation/ot/zechariah/014/013.yaml
  text: And on that day a great panic from Yahweh will be among them[a], and each man will seize the hand of his neighbor[b], and his hand will rise against the hand of his neighbor.
translation:
  language: zh_hans
  text: 到那日，他们中间必有耶和华所降的大恐慌[a]；各人必抓住同伴的手；他的手必举起，攻击同伴的手[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “恐慌”也可译作“混乱”或“骚乱”。原文可指耶和华所降、使人陷入失序和惊惧的状态；“他们中间”也可译作“临到他们”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“他的手必举起，攻击同伴的手”，以重复“手”的鲜明说法描写他们转而彼此动武。
    reason: lexical_alternative
lexical_decisions:
- source_word: מְהוּמַת יְהוָה רַבָּה
  choice: 耶和华所降的大恐慌
  rationale: מְהוּמָה表示混乱、惊惶或骚乱；结合彼此攻击的军事性语境，“大恐慌”自然地表达由上帝介入而产生的惊乱。“所降”体现该状态源于耶和华，同时脚注保留其他词义可能。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经传统中辨识度最高的上帝专名译法，区别于一般称号“主”。
- source_word: בָּהֶם
  choice: 他们中间
  rationale: 介词ב在这里最自然地表示恐慌发生在这群人当中，并与下文内部互相攻击相衔接；也可能理解为临到他们。
- source_word: וְהֶחֱזִיקוּ
  choice: 抓住
  rationale: חזק的使役式在此表示用力抓牢；“抓住”既通俗自然，又保留动作的强烈和紧迫感。
- source_word: אִישׁ
  choice: 各人
  rationale: 源文以单数作分配用法；“各人”准确表达群体中一个个的人，又比机械重复男性代词更符合现代汉语。
- source_word: רֵעֵהוּ
  choice: 同伴
  rationale: 此处指同一群体中的另一个人；“同伴”比“邻舍”更贴合军阵或敌对群体内部的语境。
- source_word: וְעָלְתָה יָדוֹ עַל יַד רֵעֵהוּ
  choice: 各人的手必举起来攻击同伴的手
  rationale: 保留希伯来文两次出现“手”的具体意象及“举起……攻击”的敌对含义，不直接改写成较抽象的“彼此残杀”。
theological_decisions:
- issue: 混乱与耶和华的关系
  choice: 译为“耶和华所降的大恐慌”，表明这是耶和华施行审判所造成的惊乱。
  alternative: 可译为“从耶和华来的大混乱”或“耶和华的大骚乱”，较少明确表达主动降下。
  rationale: מְהוּמַת יְהוָה这一结构自然表示源自耶和华的恐慌；下文的互相攻击说明这种审判表现为群体内部失序，但译文不进一步解释其机制。
- issue: 分配性阳性名词אִישׁ的表达
  choice: 译为“各人”。
  alternative: 可译为“每个男人”或“人人”。
  rationale: “各人”保留分配性含义，也符合汉语以无性别标记名词泛指群体成员的正常表达；这里不需要额外强化生理性别。
- issue: 彼此攻击的具体意象
  choice: 保留“手……攻击同伴的手”的重复。
  alternative: 意译为“人人都转而攻击同伴”或“彼此残杀”。
  rationale: 源文刻意重复“手”，形成直接肢体冲突的鲜明画面；保留这一张力，避免把动作程度扩大为经文未明说的“残杀”。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“到那日”保留先知文学的固定时间表达；分号呈现神所降恐慌及其后果之间的紧密关系。译文保留末句略显突出的“手……手”意象，并以脚注帮助普通读者理解。
