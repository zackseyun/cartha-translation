  text: וְ֠/הָיָה כָּל סִ֨יר בִּ/ירוּשָׁלִַ֜ם וּ/בִֽ/יהוּדָ֗ה קֹ֚דֶשׁ לַ/יהוָ֣ה צְבָא֔וֹת וּ/בָ֨אוּ֙ כָּל הַ/זֹּ֣בְחִ֔ים וְ/לָקְח֥וּ מֵ/הֶ֖ם וּ/בִשְּׁל֣וּ בָ/הֶ֑ם וְ/לֹא יִהְיֶ֨ה כְנַעֲנִ֥י ע֛וֹד בְּ/בֵית יְהוָ֥ה צְבָא֖וֹת בַּ/יּ֥וֹם הַ/הֽוּא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/014/021.yaml
  text: And every pot in Jerusalem and in Judah will be holy to Yahweh of hosts[a], and all who sacrifice will come and take from them and boil in them. And there will no longer be a Canaanite in the house of Yahweh of hosts on that day.
translation:
  language: zh_hans
  text: 耶路撒冷和犹大的一切锅，都必归万军之耶和华为圣；凡献祭的都必来，拿取其中的锅，并在其中烹煮。到那日，万军之耶和华的殿中必不再有迦南人[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “迦南人”或译“商人”或“做买卖的人”；这个希伯来词在某些语境中可有此义。
    reason: 保留 כְנַעֲנִי 在此处可能具有的商业含义。
lexical_decisions:
- source_word: סִיר
  choice: 锅
  rationale: 指用于煮食的器皿；“锅”是自然、准确的现代汉语，并与后文的烹煮动作呼应。
- source_word: קֹדֶשׁ
  choice: 归……为圣
  rationale: 此处作谓语，表示这些锅被分别出来、属于耶和华并供圣用；“归……为圣”保留其礼仪和神学含义。
- source_word: יְהוָה צְבָאוֹת
  choice: 万军之耶和华
  rationale: 保留神名“耶和华”，并以汉语圣经传统中清楚而庄重的称号表达 צְבָאוֹת。
- source_word: הַזֹּבְחִים
  choice: 凡献祭的
  rationale: 将名词化分词自然地译为从事献祭的人，不额外限定其身份。
- source_word: מֵהֶם
  choice: 拿取其中的锅
  rationale: 代词回指前述一切锅；“其中的”表达从这些锅中拿取，避免汉语“从它们拿”所产生的含混。
- source_word: וּבִשְּׁלוּ בָהֶם
  choice: 用来烹煮
  rationale: 表达在这些锅中煮食的动作，同时不补出原文没有明说的宾语，如“祭肉”。
- source_word: כְנַעֲנִי
  choice: 迦南人
  rationale: 该词通常指迦南人；正文保留其直接、具正典联想的含义，同时以脚注说明在某些语境中可能有“商人”的意思。
- source_word: בְּבֵית יְהוָה צְבָאוֹת
  choice: 万军之耶和华的殿中
  rationale: בַּיִת 直译为“房屋”，但在此明确指圣殿；现代汉语用“殿”更自然，也不改变所指。
- source_word: בַּיּוֹם הַהוּא
  choice: 到那日
  rationale: 自然表达先知书常见的末后性时间公式，并保留其指向性。
theological_decisions:
- issue: 末句 כְנַעֲנִי 的含义
  choice: 正文译作“迦南人”
  alternative: 商人；做买卖的人
  rationale: 希伯来词既可按通常词义理解为“迦南人”，在某些上下文中也可指“商人”。正文保留字面民族称谓及其关于洁净、排除亵渎的强烈意象；脚注则保留商业含义的可能性，不替读者消解歧义。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。分号呈现前后两层宣告；“归……为圣”保留圣洁与专属关系，“用来烹煮”避免添加原文未明说的宾语。脚注标记紧接真正存在词义歧义的“迦南人”。
