  to: 耶路撒冷和犹大的一切锅，都必归万军之耶和华为圣；凡献祭的都必来，拿取其中的锅，并在其中烹煮。到那日，万军之耶和华的殿中必不再有迦南人[a]。
  rationale: 仅作轻微的句法性修订：以“并在其中烹煮”对应原文“取用它们，并在它们里面烹煮”的连续动作和介词关系。其余措辞、神名、礼仪术语及脚注均可保留。
