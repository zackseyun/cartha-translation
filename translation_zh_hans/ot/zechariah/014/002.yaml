source:
  edition: WLC
  text: וְ/אָסַפְתִּ֨י אֶת כָּל הַ/גּוֹיִ֥ם אֶֽל יְרוּשָׁלִַם֮ לַ/מִּלְחָמָה֒ וְ/נִלְכְּדָ֣ה הָ/עִ֗יר וְ/נָשַׁ֨סּוּ֙ הַ/בָּ֣תִּ֔ים וְ/הַ/נָּשִׁ֖ים תשגלנה וְ/יָצָ֞א חֲצִ֤י הָ/עִיר֙ בַּ/גּוֹלָ֔ה וְ/יֶ֣תֶר הָ/עָ֔ם לֹ֥א יִכָּרֵ֖ת מִן הָ/עִֽיר־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/014/002.yaml
  text: And I will gather all the nations against Jerusalem for battle[a], and the city will be captured, and the houses plundered, and the women raped, and half of the city will go out into exile[b]; but the rest of the people will not be cut off from the city.
translation:
  language: zh_hans
  text: 我要聚集万国来攻打耶路撒冷；城必被攻陷，房屋必被抢掠，妇女必遭强奸[a]。城里一半的人必被掳去[b]，但其余的百姓不会从城中被剪除[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文用词直白，指战争中的性侵犯；也有译本较委婉地译作“受凌辱”或“受污辱”。
    reason: 说明希伯来语粗直措辞及传统委婉译法。
  - marker: b
    text: 直译“半座城必出去流亡”，意思是城中一半的人将被强行迁离。
    reason: 保留原文集合性表达和“流亡”的字面意象。
  - marker: c
    text: “被剪除”也可能指“被灭绝”；这里也可理解为其余百姓不会全被赶出城。
    reason: 保留כרת在除去与毁灭之间的真实歧义。
lexical_decisions:
- source_word: וְאָסַפְתִּי
  choice: 我要聚集
  rationale: 第一人称单数完成式在先知性话语中表达将来的行动；“聚集”保留神主动召集列国的含义。
- source_word: כָּל הַגּוֹיִם
  choice: 万国
  rationale: גּוֹיִם在此指参与军事行动的各国；“万国”自然、庄重，也准确表达“所有列国”。
- source_word: אֶל יְרוּשָׁלִַם לַמִּלְחָמָה
  choice: 来攻打耶路撒冷
  rationale: אֶל本义为“向、到”，但军事语境明确带有敌对方向；汉语用“来攻打”比直译“到……争战”更自然。
- source_word: וְנִלְכְּדָה הָעִיר
  choice: 城必被攻陷
  rationale: לכד的尼发勒式表示城在战争中被夺取；“被攻陷”符合现代汉语军事语境。
- source_word: וְנָשַׁסּוּ הַבָּתִּים
  choice: 房屋必被抢掠
  rationale: 动词表示掠夺战利品；“抢掠”保留战争暴行的力度，并比“洗劫”稍为庄重。
- source_word: וְהַנָּשִׁים תשגלנה
  choice: 妇女必遭强奸
  rationale: 书写形式使用粗直的词，明确指战争中的性暴力；译文不以委婉语淡化暴行。
- source_word: וְיָצָא חֲצִי הָעִיר בַּגּוֹלָה
  choice: 城里一半的人必被掳去
  rationale: “半座城”在语义上指城中一半人口；בַּגּוֹלָה表示被迫离境、流亡。中文“被掳去”清楚表达强制迁徙，并以脚注保留“流亡”的表达。
- source_word: וְיֶתֶר הָעָם
  choice: 但其余的百姓
  rationale: יֶתֶר是“剩余、其余”，此处不必译作可能带有特定神学色彩的“余民”。上下文形成转折，故用“但”。
- source_word: לֹא יִכָּרֵת מִן הָעִיר
  choice: 不会从城中被剪除
  rationale: 保留כרת“剪除”的形象及其在“除去”与“灭绝”之间的语义张力，不在正文中武断消解歧义。
theological_decisions:
- issue: 战争中性暴力的表达
  choice: 妇女必遭强奸
  alternative: 妇女必受凌辱／污辱
  rationale: 希伯来语书写形式明确而粗直；直接翻译可避免弱化经文所描述的暴行。
- issue: לֹא יִכָּרֵת מִן הָעִיר的含义
  choice: 不会从城中被剪除
  alternative: 不会从城中被赶尽／不会被灭绝
  rationale: 该短语可能侧重从城中除去，也可能包含毁灭之意；正文保留原文隐喻，脚注说明较强的灭绝义。
- issue: “一半的城”所指
  choice: 城里一半的人
  alternative: 半座城
  rationale: 下文提到“其余的百姓”，显示这里指城中人口而非建筑区域；采用自然中文明确所指，但脚注保留较形式化的译法。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。叙述战争暴行时措辞直接而不渲染；用“百姓”维持经文语体，用“剪除”保留原文形象和未决语义。所有脚注标记均已置于正文相应位置。
