  text: וְ/כֵ֨ן תִּֽהְיֶ֜ה מַגֵּפַ֣ת הַ/סּ֗וּס הַ/פֶּ֨רֶד֙ הַ/גָּמָ֣ל וְ/הַ/חֲמ֔וֹר וְ/כָ֨ל הַ/בְּהֵמָ֔ה אֲשֶׁ֥ר יִהְיֶ֖ה בַּ/מַּחֲנ֣וֹת הָ/הֵ֑מָּה כַּ/מַּגֵּפָ֖ה הַ/זֹּֽאת־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/014/015.yaml
  text: And so the plague will be on the horse[a], the mule, the camel, the donkey, and every animal that is in those camps—the same plague as this.
translation:
  language: zh_hans
  text: 马、骡、骆驼、驴，以及那些营中所有的动物，也必遭受与这场瘟疫相同的瘟疫。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译作“临到马、骡、骆驼、驴，以及那些营中所有动物的瘟疫，也必像这场瘟疫一样”。句末的希伯来文比较结构回指上文所描述的瘟疫。
    reason: 说明כַּמַּגֵּפָה הַזֹּאת的比较意义及其对上文的回指。
lexical_decisions:
- source_word: וְכֵן
  choice: 也……这样
  rationale: 表示本节与前述审判相对应；融入“也必遭受这样的瘟疫”，符合现代汉语表达，同时保留“同样如此”的连接作用。
- source_word: תִּהְיֶה מַגֵּפַת
  choice: 必遭受……瘟疫
  rationale: מַגֵּפָה在上下文中指击打人的灾疫；汉语用“遭受瘟疫”比直译为“瘟疫必在……”更自然，也没有把יהיה过度解释为别的动作。
- source_word: הַסּוּס הַפֶּרֶד הַגָּמָל וְהַחֲמוֹר
  choice: 马、骡、骆驼、驴
  rationale: 依次采用这些动物名称的现代汉语标准对应词；希伯来文单数在此具有类别性的集合用法，汉语无需另加复数标记。
- source_word: וְכָל הַבְּהֵמָה
  choice: 以及……所有的牲畜
  rationale: בְּהֵמָה可泛指动物或特指家畜；结合前列马、骡、骆驼、驴及军营场景，“牲畜”准确、自然，又能概括所列役畜。
- source_word: אֲשֶׁר יִהְיֶה בַּמַּחֲנוֹת הָהֵמָּה
  choice: 那些营中
  rationale: מַחֲנוֹת直译为复数的“营”；不把它解释性地译成“军队”。“那些营中”简洁地限定其中的牲畜。
- source_word: כַּמַּגֵּפָה הַזֹּאת
  choice: 这样的瘟疫
  rationale: כְּ表达比较或对应，הַזֹּאת回指上文刚描述的灾疫。“这样的瘟疫”自然保留这种回指和对应关系。
theological_decisions:
- issue: 敌对营地中牲畜所受审判的性质
  choice: 译为实际临到牲畜的“瘟疫”
  alternative: 较宽泛地译为“灾祸”或“击打”
  rationale: 本节重复使用מַגֵּפָה，并明确将动物所受之灾与上文临到敌人的灾疫相比；因此保留具体而严厉的“瘟疫”，不予弱化。
translation_notes:
  register: 采用庄重而流畅的现代标准汉语。用“牲畜”概括军营中的各类家畜，用“遭受这样的瘟疫”避免生硬的系词结构，并清楚表达这些动物也在审判范围之内。
