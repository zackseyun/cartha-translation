id: ZEC.14.4
reference: Zechariah 14:4
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/עָמְד֣וּ רַגְלָ֣י/ו בַּ/יּוֹם הַ֠/הוּא עַל הַ֨ר הַ/זֵּתִ֜ים אֲשֶׁ֨ר עַל פְּנֵ֥י יְרוּשָׁלִַם֮ מִ/קֶּדֶם֒ וְ/נִבְקַע֩ הַ֨ר הַ/זֵּיתִ֤ים מֵֽ/חֶצְי/וֹ֙ מִזְרָ֣חָ/ה וָ/יָ֔מָּ/ה גֵּ֖יא גְּדוֹלָ֣ה מְאֹ֑ד וּ/מָ֨שׁ חֲצִ֥י הָ/הָ֛ר צָפ֖וֹנָ/ה וְ/חֶצְי/וֹ נֶֽגְבָּ/ה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/014/004.yaml
  text: On that day his feet will stand on the Mount of Olives[a], which is before Jerusalem on the east; and the Mount of Olives will be split in two from east to west into a very great valley[b], with half of the mountain moving northward and half of it southward.
translation:
  language: zh_hans
  text: 那一天，他的双脚必站在橄榄山上；这山在耶路撒冷东面，与城相对[a]。橄榄山必从中间向东向西裂开，形成一道极大的山谷[b]；山的一半向北挪移，另一半向南挪移。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这山在耶路撒冷前面，位于东边。”
    reason: 希伯来语עַל־פְּנֵי可表示“在……前面”或“与……相对”；此处与东面的方位说明连用。
  - marker: b
    text: “裂开”也可译作“被劈开”；下文说明山的两半向相反方向挪开。
    reason: 说明希伯来语被动词形及后文对裂开结果的具体描写。
lexical_decisions:
- source_word: וְעָמְדוּ רַגְלָיו
  choice: 他的双脚必站
  rationale: 保留原文具体的身体意象；在先知性语境中以“必”表达将来的事件，不将其释义为“临在”或“显现”。
- source_word: בַּיּוֹם הַהוּא
  choice: 那一天
  rationale: 采用现代汉语中自然庄重的先知性时间表达。
- source_word: הַר הַזֵּתִים
  choice: 橄榄山
  rationale: 采用该地名通行且准确的中文译法。
- source_word: אֲשֶׁר עַל פְּנֵי יְרוּשָׁלִַם מִקֶּדֶם
  choice: 这山在耶路撒冷东面，与城相对
  rationale: “在东面”表达מִקֶּדֶם的方位，“与城相对”保留עַל־פְּנֵי所含的在前方、面对或相对之意。
- source_word: וְנִבְקַע
  choice: 必……裂开
  rationale: 尼פעל词形表示山被裂开；中文不必机械使用被动式，仍保留山体开裂的意象。
- source_word: מֵחֶצְיוֹ מִזְרָחָה וָיָמָּה
  choice: 从中间向东向西
  rationale: 直接反映山从中部朝东、西两个方向裂开的空间描述，避免把它简化为仅表示东西走向。
- source_word: גֵּיא גְּדוֹלָה מְאֹד
  choice: 一道极大的山谷
  rationale: “山谷”准确传达גֵּיא，“极大”保留מְאֹד的强意。
- source_word: וּמָשׁ
  choice: 挪移
  rationale: 该动词表示移开或退移；“挪移”既表达山体两半的位移，也保持庄重语体。
- source_word: צָפוֹנָה / נֶגְבָּה
  choice: 向北 / 向南
  rationale: 准确表达两个带方向词尾的方位副词。
theological_decisions:
- issue: 上下文中神圣人物的拟人化描写
  choice: 保留“他的双脚必站”
  alternative: 他的临在必停留；他必显现在橄榄山上
  rationale: 希伯来文明确使用具体的身体语言；译文不以抽象释义消解其神学张力。
- issue: 山裂开的方向与所形成山谷的关系
  choice: 译为“从中间向东向西裂开，形成一道极大的山谷”
  alternative: 从东到西裂成两半，成为一道极大的山谷
  rationale: 原文更具体地说裂口从山的中部向东、西延伸；“形成”自然表达后接“极大的山谷”的结果关系，同时不额外规定其地质机制。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“必”保留先知宣告的语气；分号呈现裂山、成谷与两半移开的连续图景。脚注标记均置于对应正文处。
