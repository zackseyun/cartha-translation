source:
  edition: WLC
  text: וְ/זֹ֣את תִּֽהְיֶ֣ה הַ/מַּגֵּפָ֗ה אֲשֶׁ֨ר יִגֹּ֤ף יְהוָה֙ אֶת כָּל הָ֣/עַמִּ֔ים אֲשֶׁ֥ר צָבְא֖וּ עַל יְרוּשָׁלִָ֑ם הָמֵ֣ק בְּשָׂר֗/וֹ וְ/הוּא֙ עֹמֵ֣ד עַל רַגְלָ֔י/ו וְ/עֵינָי/ו֙ תִּמַּ֣קְנָה בְ/חֹֽרֵי/הֶ֔ן וּ/לְשׁוֹנ֖/וֹ תִּמַּ֥ק בְּ/פִי/הֶֽם׀־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/014/012.yaml
  text: 'And this will be the plague with which Yahweh will strike all the peoples that wage war against Jerusalem: while he is standing on his feet[a], his flesh will rot away, his eyes will rot away in their sockets, and his tongue will rot away in his mouth.'
translation:
  language: zh_hans
  text: 这将是雅威用来击打所有出兵攻打耶路撒冷的族群[a]的灾祸：当他们仍站立着时，他们的肉会腐烂，眼睛会在眼眶里腐烂，舌头也会在口中腐烂[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“所有国家”或“所有民族”。希伯来语עַמִּים可按语境指族群、民族或国家。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语字面为“他的舌头会在他们的口中腐烂”，单复数并不一致；正文按群体中各人的分配关系译出。
    reason: textual_grammar
lexical_decisions:
- source_word: הַמַּגֵּפָה
  choice: 灾祸
  rationale: 该词可指瘟疫、灾殃或击打所造成的祸患；“灾祸”既自然，又不把这里的审判机制限定为传染病。
- source_word: יִגֹּף
  choice: 击打
  rationale: נגף表示击打、重创或使受灾；“击打”保留雅威主动施行审判的含义，也避免与名词הַמַּגֵּפָה重复译作“降瘟疫”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来语四字神名的通行学术拟音音译为“雅威”，保留其作为专名的性质，不以称号替代。
- source_word: כָּל־הָעַמִּים
  choice: 所有……族群
  rationale: עַמִּים可指诸民族、列国或各族群；“族群”保留其复数群体含义，并不预先断定这些群体是否都是政治意义上的国家。
- source_word: צָבְאוּ עַל
  choice: 出兵攻打
  rationale: צבא在此具有集结军队、从事战争的含义；“出兵攻打”清楚表达军事行动，比单译“聚集”更符合上下文。
- source_word: הָמֵק / תִּמַּקְנָה / תִּמַּק
  choice: 腐烂
  rationale: 反复出现的מקק描写肉体消解、朽坏；统一译作“腐烂”，保留原文重复而骇人的具体形象。
- source_word: בְּשָׂרוֹ
  choice: 各人的肉
  rationale: בשר具体指肉身或肌肉；译作“肉”而非较笼统的“身体”，并用“各人”显明由复数群体转入分配性的单数描写。
- source_word: וְהוּא עֹמֵד עַל־רַגְלָיו
  choice: 他们还站在自己脚上时
  rationale: 分词结构描绘灾祸在人仍直立时临到；“还……时”传达动作同时发生的突然性，“站在自己脚上”保留原文具体说法。
- source_word: בְחֹרֵיהֶן
  choice: 在眼眶里
  rationale: חֹרִים在此指眼睛所在的孔穴；现代汉语以“眼眶”表达最自然准确。
- source_word: וּלְשׁוֹנוֹ תִּמַּק בְּפִיהֶם
  choice: 舌头也会在口中腐烂
  rationale: 正文按群体中各人的分配关系自然表达，同时以脚注说明希伯来语中“他的舌头”与“他们的口”在数上不一致，避免掩盖原文形式。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用神的专名；音译为“雅威”保留专名性质，不以传统读法或称号取代。
- issue: 审判景象的性质
  choice: 照原文保留肉、眼睛和舌头腐烂的具体描写
  alternative: 淡化为象征性的败亡；明确解释成某种疾病
  rationale: 经文没有说明这是神迹、疾病还是战争后果；译文保留其强烈形象，不替原文判定发生机制。
- issue: 由“所有族群”转入阳性单数身体描写
  choice: 按分配关系译为“他们……各人的”
  alternative: 全程使用单数“他”；全程笼统使用复数而省去个体关系
  rationale: 希伯来语以复数群体为先行对象，随后用单数描写其中每一个人；中文用“各人”既自然，也保留从整体到个体的视角。
translation_notes:
  register: 采用现代、庄重而直接的书面普通话。保留原文骇人的身体意象和三次“腐烂”的重复；避免“瘟疫”等会过度限定机制的词。标点将总述与三项身体变化清楚连接。
