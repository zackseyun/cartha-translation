  yaml_path: translation/ot/zechariah/014/001.yaml
  text: Behold[a], a day is coming for Yahweh, when your plunder will be divided in your midst.
translation:
  language: zh_hans
  text: 看哪[a]，归耶和华的一日将要来到；你的战利品必在你中间被瓜分。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或按较传统的译法：“看哪，耶和华的日子将要来到。”希伯来文直译为“看哪，有一日为（或归于）耶和华而来”。
    reason: alternative_reading
lexical_decisions:
- source_word: הִנֵּה
  choice: 看哪
  rationale: 作为庄严预言开头的提示语，“看哪”既保留引人注意的力量，也符合现代中文圣经语体。
- source_word: יוֹם בָּא
  choice: 有一个……日子……来
  rationale: יוֹם 无冠词，译作“有一个……日子”；分词 בָּא 在预言语境中表示将来临的事件，中文用“而来的”自然传达此意。
- source_word: לַיהוָה
  choice: 为耶和华而来
  rationale: 保留介词 ל 的关系或归属意味，不直接将其同化为传统的“耶和华的日子”；较传统的表达收入脚注。
- source_word: וְחֻלַּק
  choice: 必……被瓜分
  rationale: 保留 Pual 被动语态及预言中的将来意义；“瓜分”贴合战利品在敌军中分配的场景。
- source_word: שְׁלָלֵךְ
  choice: 你的战利品
  rationale: 明确表达战争中掠得的财物；第二人称阴性单数指向被拟人化为女性的耶路撒冷。
- source_word: בְּקִרְבֵּךְ
  choice: 在你中间
  rationale: 保留发生于城内、当着城中居民之面的空间和修辞意味，同时避免将所指过早解释得过窄。
theological_decisions:
- issue: לַיהוָה 与先知书中“耶和华的日子”公式的关系
  choice: 为耶和华而来的日子
  alternative: 耶和华的日子来临了
  rationale: 原文使用介词 לַ 而非更直接的属格结构。正文尽量保留“为、归于、关乎耶和华”的张力，脚注则说明传统且语义相关的译法。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“看哪”维持先知宣告的肃穆语气；“战利品”“瓜分”使战争场景对普通读者明确。正文保留 לַיהוָה 的非常规表达，并以脚注交代传统译法。
