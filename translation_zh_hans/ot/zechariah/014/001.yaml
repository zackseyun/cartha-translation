  terminology: “耶和华”与项目既定名称一致；“战利品”准确表达 שָׁלָל 的战争掠获物；“瓜分”可表达分配，且不必预先限定分配者。脚注保留传统“耶和华的日子”的译法，避免正文抹平 ל 的句法张力。
