source:
  edition: WLC
  text: וְ֠/הָיָה אֲשֶׁ֨ר לֹֽא יַעֲלֶ֜ה מֵ/אֵ֨ת מִשְׁפְּח֤וֹת הָ/אָ֨רֶץ֙ אֶל יְר֣וּשָׁלִַ֔ם לְ/הִֽשְׁתַּחֲוֺ֔ת לְ/מֶ֖לֶךְ יְהוָ֣ה צְבָא֑וֹת וְ/לֹ֥א עֲלֵי/הֶ֖ם יִהְיֶ֥ה הַ/גָּֽשֶׁם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/014/017.yaml
  text: And if any of the families of the earth does not go up to Jerusalem to worship the King[a], Yahweh of Armies[b], there will be no rain on them.
translation:
  language: zh_hans
  text: 地上各族中，凡不上耶路撒冷敬拜[a]君王——万军之雅威[b]的，必不得雨水。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“俯伏下拜”。
    reason: 保留לְהִשְׁתַּחֲוֺת所描写的具体身体动作。
  - marker: b
    text: “万军之雅威”传统译作“万军之耶和华”。
    reason: 保留四字神名及神圣称号在汉语圣经传统中的常见译法。
lexical_decisions:
- source_word: וְהָיָה אֲשֶׁר
  choice: 凡……的，……就……
  rationale: 这一希伯来语结构在此引出条件及其结果。汉语用“凡……的，……就……”既自然，也保留普遍条件的语气；无需生硬补出“将来会发生”。
- source_word: לֹא יַעֲלֶה
  choice: 不上
  rationale: עלה用于前往耶路撒冷时兼有地势和朝圣意义；“上耶路撒冷”在汉语中简洁保留这一方向感。
- source_word: מֵאֵת מִשְׁפְּחוֹת הָאָרֶץ
  choice: 地上各族中
  rationale: מִשְׁפָּחוֹת可指家族、宗族或族群；本章涉及列国，译作“各族”比现代汉语中的“各家”更不易误解。הָאָרֶץ依上下文取普世范围，译为“地上”。
- source_word: לְהִשְׁתַּחֲוֺת
  choice: 敬拜
  rationale: 该动词本义为俯伏、下拜，在向神而行的语境中表达敬拜；正文采用自然的宗教用语“敬拜”，脚注保留动作层面的译法。
- source_word: לְמֶלֶךְ
  choice: 大君王
  rationale: “君王”比“国王”更适合作为神的尊称；加“大”是现代汉语中表达至高王权的自然称谓，并未另立一位不同的王。破折号表明下文神名和称号与“君王”同指一位。
- source_word: יְהוָה צְבָאוֹת
  choice: 万军之雅威
  rationale: “雅威”直接音译四字神名；צְבָאוֹת保留其军旅、天军的复数集合意味，采用汉语传统且庄重的“万军”。
- source_word: וְלֹא עֲלֵיהֶם יִהְיֶה הַגָּשֶׁם
  choice: 他们那里就必不降雨
  rationale: 保留עֲלֵיהֶם所表达的临到对象，同时按自然汉语表述无雨的审判结果。“必”传达未完成式在此条件结果中的确定性。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用神的专名。正文采用较贴近通行学术重构读音的“雅威”，而不以“主”替代专名；传统汉语形式在脚注中保留。
- issue: הָאָרֶץ 的范围
  choice: 地上
  alternative: 那地
  rationale: 撒迦利亚书14章的上下文谈到列国和各族前来敬拜，因此此处宜保留普世范围，而不将所指局限于以色列地。
- issue: מֶלֶךְ 与 יְהוָה צְבָאוֹת 的关系
  choice: 大君王——万军之雅威
  alternative: 大君王、万军之雅威
  rationale: 二者在原文中为同位关系。破折号清楚表明“大君王”就是“万军之雅威”，但不添加原文没有的神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“地上各族中，凡……”形成清楚的条件句；“上耶路撒冷”保留朝圣和地势意象；破折号标示同位称谓。所有脚注标记均置于正文相应词语之后。
