  text: וְ/הָיָ֣ה יוֹם אֶחָ֗ד ה֛וּא יִוָּדַ֥ע לַֽ/יהוָ֖ה לֹא י֣וֹם וְ/לֹא לָ֑יְלָה וְ/הָיָ֥ה לְ/עֵֽת עֶ֖רֶב יִֽהְיֶה אֽוֹר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/014/007.yaml
  text: And it will be one day[a], known to Yahweh, neither day nor night[c][b]; but at evening time there will be light.
translation:
  language: zh_hans
  text: 将有一日[a]，为耶和华所知；不是白昼，也不是黑夜；到了傍晚，却有光明。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“一日”；在本处也可能含有“独特的一日”或“仅此一日”的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: 将有
  rationale: 在先知性语境中表达将来的情形；“将有”既自然，也保留希伯来语引出未来事件的作用。
- source_word: יוֹם אֶחָד
  choice: 一日[a]
  rationale: 直译为“一日”，既可指某一个日子，也可能强调这是独特、非同寻常的一日；正文不把这种语义张力单向落实。
- source_word: יִוָּדַע לַיהוָה
  choice: 为耶和华所知
  rationale: 保留被动形式及其关系表达，不擅自解释为只有耶和华知道其日期、性质或过程。
- source_word: לֹא יוֹם וְלֹא לָיְלָה
  choice: 不是白昼，也不是黑夜
  rationale: 紧贴原文对两种时段的分别否定，保留其反常而悖论性的描写。
- source_word: לְעֵת עֶרֶב
  choice: 到了傍晚
  rationale: 自然表达“在傍晚时分”，并与随后出人意料的光明形成清楚对照。
- source_word: יִהְיֶה אוֹר
  choice: 却有光明
  rationale: 准确表达届时将有光，并用“却”显出傍晚出现光明的转折，但不增添光的来源或象征含义。
theological_decisions:
- issue: 这一日的性质
  choice: 描写一个非同寻常、为耶和华所知的日子，但不界定其具体末世时间表或实现机制。
  alternative: 将其限定为某种天文现象、纯象征性的拯救图景，或特定千禧年体系中的阶段。
  rationale: 原文明确呈现一个特殊的日子及傍晚有光的反常景象，却没有在本节说明其物理机制或完整预言体系，因此保留其神学张力。
- issue: “为耶和华所知”的范围
  choice: 保留简洁的被动表达，不说明耶和华所知道的究竟是日期、性质还是全部情形。
  alternative: 译成“惟有耶和华知道何时”或“这是耶和华所认可的日子”。
  rationale: 这些替代说法都补入了原文没有明说的限定或神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以分号保持原文各短句的并列推进，并以“却”凸显傍晚有光的反常转折。神名 יהוה 译作“耶和华”。
