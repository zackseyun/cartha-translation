base_translation:
  language: en
  yaml_path: translation/ot/zechariah/014/009.yaml
  text: And Yahweh will be king over all the earth[a]. On that day Yahweh will be one[b], and his name one.
translation:
  language: zh_hans
  text: 雅威必作全地的王。在那日，雅威必是独一的[a]，他的名也必是独一的[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“唯有雅威”，或“雅威必独一无二”。希伯来文直译为“一”；此词也可表达唯一、排他性或独特性。
    reason: lexical_alternative
  - marker: b
    text: 或译：“唯有他的名”，或“他的名必独一无二”。希伯来文直译为“一”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: 必作
  rationale: 该形式在先知性话语中具有将来指向；“必作”自然表达预告及确定性，并与后面的王权身份相接。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文四字神名的读音转写为“雅威”，保留其作为神之专名的性质，不以称号替代。
- source_word: לְמֶלֶךְ
  choice: 作……的王
  rationale: 介词 לְ 在这里表示身份或职分；“作全地的王”符合现代汉语表达，也保留王权含义。
- source_word: עַל כָּל הָאָרֶץ
  choice: 全地
  rationale: עַל 与“王”连用表达统治范围；在本章末世性的普世语境中，הָאָרֶץ 以“全地”表达比“全境”更合适。
- source_word: בַּיּוֹם הַהוּא
  choice: 到那日
  rationale: 这是先知书常见的时间公式；“到那日”既自然，也保留其指向将来特定日子的语气。
- source_word: יִהְיֶה יְהוָה אֶחָד
  choice: 雅威必为一
  rationale: אֶחָד 的直接意义是“一”，在此也可能表达唯一、独一或排他性。“必为一”保留原文简洁而富张力的措辞，不在正文中限定其神学含义。
- source_word: וּשְׁמוֹ אֶחָד
  choice: 他的名也必为一
  rationale: 照应前句的 אֶחָד，保留原文平行结构；“也”自然呈现连接关系，而“为一”避免擅自只取“唯一”或“独一”一种解释。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名，因此以现代汉语音译“雅威”保留其专名性质，而不改作称号。
- issue: “雅威必为一”的含义
  choice: 正文保留“一”
  alternative: 雅威必独一无二；唯有雅威；雅威必为独一
  rationale: אֶחָד 在此可涵盖合一、唯一、独特及排他性承认等意味。正文保留“一”，脚注列出可能译法，以免过早消解原文的神学张力。
- issue: “他的名也必为一”的含义
  choice: 正文保留“一”
  alternative: 唯有他的名；他的名必独一无二
  rationale: 原文让两个 אֶחָד 形成鲜明平行。保留相同译词能呈现这种修辞和神学联系，同时由脚注说明可能的排他或独特含义。
translation_notes:
  register: 采用现代、庄重而简洁的普通话。“作全地的王”自然表达普世王权；两处“必为一”略带凝练的经文语体，以保留希伯来文的平行结构、真实歧义和神学张力。所有脚注标记均已置于对应正文之后。
