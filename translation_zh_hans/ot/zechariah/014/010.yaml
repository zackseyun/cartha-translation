- from: 这一带全地都要变得像平原[a]，从迦巴直到耶路撒冷以南的临门。耶路撒冷却要高高耸立，仍在原处；城的范围从便雅悯门直到第一门的旧址，再到角门，又从哈楠业楼直到王的酒榨。
  to: 全地都要变得像平原[a]，从迦巴直到耶路撒冷以南的临门。耶路撒冷却要被高举，仍安居在原处；从便雅悯门到第一门所在之处，再到角门；又从哈楠业楼到王的酒榨。
  rationale: 修订移除“旧址”和“城的范围”这两处超出原文明确陈述的解释，保留地标范围与地貌改变的图景；以“被高举”更准确对应耶路撒冷相对于周围平地的升高。脚注继续保留“亚拉巴”作为专名和普通地貌词之间的歧义。
