    rationale: מְקוֹם שַׁעַר הָרִאשֹׁון意为“第一门所在之处／地点”。它或许能暗示该门不在，但经文本身并未断言为“旧址”。中性译法可保留歧义。
  - severity: low
    issue: “城的范围”是补入的解释。
    rationale: 原文直接列出耶路撒冷安居于原处所涉及的地标范围；加入“城的范围”虽合理，却不是必要的明示信息。
  - severity: low
    issue: “高高耸立”较偏主动姿态，弱化了“被高举”的地貌变化意味。
    rationale: וְרָאֲמָה在此与周边土地平坦化形成对照，译为“被高举”更直接体现结果性和对照。
