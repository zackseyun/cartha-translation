  source_fidelity: 译文总体准确呈现了土地平坦化、耶路撒冷被抬高及城市地标范围。惟“第一门的旧址”将“第一门所在之处”具体化为旧址，原文的מְקוֹם只说明地点，未明说该门已经毁坏或不存，宜改为中性表达。另“城的范围”并非原文措辞，删去可避免加入解释性成分。
  naturalness: 整体庄重、现代、通顺。将“耶路撒冷却要高高耸立”调整为“耶路撒冷却要被高举”，更贴近原文在地貌对照中的结果／被动意味；“仍安居在原处”既自然也保留城市安居于原位的意象。
  terminology: 迦巴、临门、便雅悯门、角门、哈楠业楼等名称一致且适合现代中文圣经语体。“王的酒榨”可作为集合性表达保留。脚注应将亚拉巴的通常地貌义限定为平原地带／谷地或旷野地带，不宜把词义简单等同于“平原”。
  issues:
