source:
  edition: WLC
  text: יִסּ֨וֹב כָּל הָ/אָ֤רֶץ כָּ/עֲרָבָה֙ מִ/גֶּ֣בַע לְ/רִמּ֔וֹן נֶ֖גֶב יְרֽוּשָׁלִָ֑ם וְֽ/רָאֲמָה֩ וְ/יָשְׁבָ֨ה תַחְתֶּ֜י/הָ לְ/מִ/שַּׁ֣עַר בִּנְיָמִ֗ן עַד מְק֞וֹם שַׁ֤עַר הָֽ/רִאשׁוֹן֙ עַד שַׁ֣עַר הַ/פִּנִּ֔ים וּ/מִגְדַּ֣ל חֲנַנְאֵ֔ל עַ֖ד יִקְבֵ֥י הַ/מֶּֽלֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/014/010.yaml
  text: All the land will be turned into a plain[a], from Geba to Rimmon south of Jerusalem. But Jerusalem will be raised up and will remain in its place, from the Benjamin Gate to the place of the First Gate, to the Corner Gate, and from the Tower of Hananel to the king’s winepresses.
translation:
  language: zh_hans
  text: 全地都要变得像平原[a]，从迦巴直到耶路撒冷以南的临门。耶路撒冷却要被高举，仍安居在原处；从便雅悯门到第一门所在之处，再到角门；又从哈楠业楼到王的酒榨。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“全地都要变得像亚拉巴。”希伯来语“亚拉巴”可指特定的亚拉巴谷地，也可泛指平原地带或旷野地带。
    reason: 保留כָּעֲרָבָה究竟指亚拉巴这一地名还是一般地貌的词义歧义。
lexical_decisions:
- source_word: יִסּוֹב כָּל הָאָרֶץ
  choice: 这一带全地都要变得
  rationale: סבב在此描述地貌发生变化；边界地名表明הָאָרֶץ指耶路撒冷周边地域，而非整个地球。“这一带全地”既保留“全地”，也自然限定地域范围。
- source_word: כָּעֲרָבָה
  choice: 像平原
  rationale: כְּ本义为“像、如同”，עֲרָבָה既可指亚拉巴这一特定地带，也可泛指平原或旷野。正文采用普通读者易懂的“像平原”，脚注保留专名可能。
- source_word: מִגֶּבַע לְרִמּוֹן נֶגֶב יְרוּשָׁלִָם
  choice: 从迦巴直到耶路撒冷以南的临门
  rationale: “耶路撒冷以南”在希伯来语中紧随“临门”，自然理解为限定该地名，以区别其他同名地点。
- source_word: וְרָאֲמָה
  choice: 却要高高耸立
  rationale: 此词在上下文中表示耶路撒冷升高，与周围土地成为平原形成鲜明对照；“耸立”自然表达城市地势高起。
- source_word: וְיָשְׁבָה תַחְתֶּיהָ
  choice: 仍在原处
  rationale: 该短语字面近于“安居在自己的地方”，此处表示城稳定地处于其原有位置；“仍在原处”简明自然。
- source_word: מְקוֹם שַׁעַר הָרִאשׁוֹן
  choice: 第一门的旧址
  rationale: מְקוֹם强调门所在的地点，可能暗示该门当时已不复存在；“旧址”准确而简洁地传达这一空间含义，但不断言其毁坏细节。
- source_word: שַׁעַר הַפִּנִּים
  choice: 角门
  rationale: הַפִּנִּים与角隅有关；“角门”是简明、语义清楚的地名译法。
- source_word: מִגְדַּל חֲנַנְאֵל
  choice: 哈楠业楼
  rationale: 将专名חֲנַנְאֵל音译为“哈楠业”，מִגְדָּל按城防建筑语境译为“楼”。
- source_word: יִקְבֵי הַמֶּלֶךְ
  choice: 王的酒榨
  rationale: יֶקֶב指压榨葡萄的酒榨或相关榨酒设施；原文为复数，但现代汉语集合性名词“酒榨”在此自然涵盖整组设施。
theological_decisions:
- issue: 地貌变化的范围
  choice: 理解为耶路撒冷周边、由地名界定的整片地域
  alternative: 理解为整个地球
  rationale: 经文本身随即以迦巴、临门和耶路撒冷等地理界标限定范围，因此译作“这一带全地”，避免把末世地貌变化的范围扩大到原文未明确断定的全球。
- issue: 耶路撒冷升高的表达
  choice: 保留为实际地貌升高的图景
  alternative: 仅理解为属灵地位或荣耀的提升
  rationale: 上下文集中描写土地变为平原、城市边界及具体地点，首先支持地貌意义；译文不排除象征含义，但不将其直接写入正文。
translation_notes:
  register: 采用庄重而现代的标准普通话。以“却”突出耶路撒冷与周围平地的对比；地名采用常见圣经汉语形式。正文保持地理描写的清晰度，并用一处脚注保存“亚拉巴”的专名可能。
