base_translation:
  language: en
  yaml_path: translation/ot/zechariah/014/014.yaml
  text: 'And Judah also will fight at Jerusalem[a], and the wealth of all the surrounding nations will be gathered: gold and silver and garments, in very great abundance.'
translation:
  language: zh_hans
  text: 犹大也必在耶路撒冷争战[a]；四围各国的财富都必被聚集，就是金、银和衣服，数量极多。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“犹大也必攻击耶路撒冷。”希伯来语介词通常意为“在”，但有人根据上下文将这里理解为敌对关系。
    reason: alternative_reading
lexical_decisions:
- source_word: וְגַם
  choice: 也
  rationale: 连接词与附加语气词表示承接和增添；中文用“也”自然保留其附加意味。
- source_word: יְהוּדָה
  choice: 犹大
  rationale: 按现代中文圣经传统音译这一民族或地区名称。
- source_word: תִּלָּחֵם
  choice: 必……争战
  rationale: לחם 的尼法勒式在此表示投入战斗；“争战”庄重而清楚，且不额外限定作战方式。
- source_word: בִּירוּשָׁלִָם
  choice: 在耶路撒冷
  rationale: 介词 בְּ 的通常意义是“在”；主文保留最直接的地点义，而将按上下文理解为“攻击”的可能性收入脚注。
- source_word: וְאֻסַּף
  choice: 都必聚集起来
  rationale: 被动完成式接续于预言语境，表达将来的事件；“聚集起来”保留被动意义，并适合描述财物汇集。
- source_word: חֵיל
  choice: 财富
  rationale: 该词可指力量、军队或财力；后列金、银、衣服，表明此处所指为物质财富。
- source_word: כָּל הַגּוֹיִם סָבִיב
  choice: 四围各国的
  rationale: “四围各国”简洁自然，保留 סָבִיב 的空间含义。
- source_word: זָהָב וָכֶסֶף וּבְגָדִים
  choice: 金、银和衣服
  rationale: 直接呈现贵重物品的清单；“衣服”是普通现代读者最容易理解的表达。
- source_word: לָרֹב מְאֹד
  choice: 数量极其丰盛
  rationale: 同时表达 רֹב 的大量和 מְאֹד 的强化作用，中文自然且不削弱原文强度。
theological_decisions:
- issue: בִּירוּשָׁלִָם 是指犹大在耶路撒冷争战，还是攻击耶路撒冷
  choice: 犹大也必在耶路撒冷争战
  alternative: 犹大也必攻击耶路撒冷
  rationale: 介词 בְּ 最自然是地点义“在”；但本章上下文使一些人将其理解为敌对对象。主文采用通常的语法意义，脚注保留另一种理解，不武断消除经文张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“争战”符合先知性经文语体；分号将犹大的争战与列国财富的聚集清楚分开。
