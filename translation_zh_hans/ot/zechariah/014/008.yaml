base_translation:
  language: en
  yaml_path: translation/ot/zechariah/014/008.yaml
  text: And on that day living waters will flow out from Jerusalem[a], half of them to the eastern sea and half of them to the western sea[c][b]; it will be so in summer as well as in winter.
translation:
  language: zh_hans
  text: 到那日，必有活水从耶路撒冷流出[a]：一半流向东边的海[b]，一半流向西边的海[c]；无论夏季还是冬季，都必如此。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “活水”也可指新鲜或流动的水；希伯来语作“活水”，在此语境中也可能含有赐生命的意涵。
    reason: lexical_alternative
  - marker: b
    text: 指耶路撒冷以东的海，传统上认定为死海。
    reason: cultural_note
  - marker: c
    text: 指耶路撒冷以西的海，传统上认定为地中海。
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיָה בַּיּוֹם הַהוּא
  choice: 到那日
  rationale: 这是先知话语中常见的未来时间公式。“到那日”既自然凝练，也保留其预告未来事件的语气。
- source_word: יֵצְאוּ
  choice: 流出
  rationale: 该动词本义为“出去、出来”；以水为主语时，现代汉语自然表达为“流出”。
- source_word: מַיִם חַיִּים
  choice: 活水
  rationale: “活水”是简洁而有尊严的汉语圣经用语，既可指流动、新鲜、使人得生的水，也保留先知语境中可能存在的神学意蕴。
- source_word: מִירוּשָׁלִַם
  choice: 从耶路撒冷
  rationale: 直接表达水流的起点，忠实对应希伯来语介词。
- source_word: חֶצְיָם
  choice: 一半
  rationale: 上下文已清楚说明所指为活水，汉语用“一半”即可自然表达，无须重复“其中”。
- source_word: הַיָּם הַקַּדְמוֹנִי
  choice: 东海
  rationale: קַדְמוֹנִי 在此表示东方。“东海”保留原文的方位称呼，不在正文中过度限定其地理身份。
- source_word: הַיָּם הָאַחֲרוֹן
  choice: 西海
  rationale: 该短语与“东海”相对，指西面的海。“西海”清楚保留原文的方向性表达。
- source_word: בַּקַּיִץ וּבָחֹרֶף
  choice: 无论夏季冬季
  rationale: 原文列出夏季和冬季，意在表明水流终年不断；“无论……都是……”在现代汉语中自然传达这种持续性。
- source_word: יִהְיֶה
  choice: 都是如此
  rationale: 希伯来语单数动词表达这种状况将持续存在；“都是如此”承接前文，避免硬译造成语意残缺，也不强行改成复数主语。
theological_decisions:
- issue: “活水”可能兼具物理和象征意涵
  choice: 正文保留“活水”，不将其解释为纯粹自然水源或纯粹属灵象征。
  alternative: 译作“流动的水”或“清新的水”，或在正文中明确解释为赐生命的属灵之水。
  rationale: 希伯来语惯用表达可指流动、新鲜的水，但在先知语境中也可能带有赐生命的神学意蕴。保留“活水”可以维持原文的张力与开放性。
- issue: 东西两海的具体地理身份
  choice: 正文使用原文的方位名称“东海”“西海”，具体传统认定放入脚注。
  alternative: 正文直接译为“死海”和“地中海”。
  rationale: 原文使用方向性称谓，而非专名。正文不应把传统地理认定提升为原文明确说出的名称。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“到那日”保留先知性语体；“流向”使两条水流的方向关系清晰；末句用“无论夏季冬季，都是如此”自然表达终年持续。所有脚注标记均置于相应正文词语之后。
