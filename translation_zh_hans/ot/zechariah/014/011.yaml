  text: וְ/יָ֣שְׁבוּ בָ֔/הּ וְ/חֵ֖רֶם לֹ֣א יִֽהְיֶה ע֑וֹד וְ/יָשְׁבָ֥ה יְרוּשָׁלִַ֖ם לָ/בֶֽטַח־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/014/011.yaml
  text: And they will dwell in it[a], and there will no longer be anything devoted to destruction, and Jerusalem will dwell securely.
translation:
  language: zh_hans
  text: 人必住在其中，不再有任何被定为毁灭的事物[a]；耶路撒冷必安然居住。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“再也没有咒诅。”希伯来语 חֵרֶם 也可指被置于禁令之下或被定为毁灭的人或物。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָשְׁבוּ בָהּ
  choice: 人必住在其中
  rationale: ישׁב意为“居住、定居”；第三人称复数的主语在希伯来文中未明说。中文补出泛指的“人”，使表达自然，同时不限定居民身份。
- source_word: חֵרֶם
  choice: 什么会被定为毁灭
  rationale: חֵרֶם可指被禁、归于毁灭之物，或受咒诅的状态。正文用“被定为毁灭”表达置于毁灭之下的含义，又以脚注保留“咒诅”的可能解释。
- source_word: לֹא יִהְיֶה עוֹד
  choice: 再也没有
  rationale: 准确表达某种状况今后不再出现，符合现代汉语习惯。
- source_word: וְיָשְׁבָה יְרוּשָׁלִַם
  choice: 耶路撒冷必……居住
  rationale: 保留耶路撒冷作为语法主语的拟人表达，并与前面的“住在”形成呼应。
- source_word: לָבֶטַח
  choice: 安然
  rationale: 表示安全、无惧的状态；“安然居住”简洁、庄重且自然。
theological_decisions:
- issue: 末世复兴语境中חֵרֶם的含义
  choice: 正文译为“什么会被定为毁灭”
  alternative: “再也没有咒诅”或“再也没有禁令”
  rationale: 该词不仅可指抽象的“咒诅”，也可指被置于禁令之下、归于毁灭的人或物。正文保留审判和毁灭的具体意涵，脚注则呈现真实的词义歧义，避免把含义单一化。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“人必住在其中”自然补足希伯来文隐含的复数主语；分号呈现本节后两项应许之间的层次。
