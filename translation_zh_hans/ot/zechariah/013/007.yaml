source:
  edition: WLC
  text: חֶ֗רֶב עוּרִ֤י עַל רֹעִ/י֙ וְ/עַל גֶּ֣בֶר עֲמִיתִ֔/י נְאֻ֖ם יְהוָ֣ה צְבָא֑וֹת הַ֤ךְ אֶת הָֽ/רֹעֶה֙ וּ/תְפוּצֶ֣יןָ הַ/צֹּ֔אן וַ/הֲשִׁבֹתִ֥י יָדִ֖/י עַל הַ/צֹּעֲרִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/013/007.yaml
  text: Awake[a], O sword, against my shepherd, against the man who is my companion, declares Yahweh of Armies. Strike the shepherd, and the sheep will be scattered[c][b]; and I will turn my hand against the little ones.
translation:
  language: zh_hans
  text: “刀剑啊，醒来！攻击我的牧人，攻击那与我亲近的人[a]！”这是万军之耶和华[b]的宣告。“击打牧人，羊群就必四散；我必把手转向那些弱小的人[c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “那与我亲近的人”也可译作“那与我相交的人”，或可能译作“那与我相等的人”。希伯来语这个词指与另一方关系密切的人。
    reason: lexical_alternative
  - marker: b
    text: “万军之耶和华”也可译作“统领众军的耶和华”。这里的“军”可包括天上的军队。
    reason: lexical_alternative
  - marker: c
    text: 直译“我必把我的手转向那些弱小的人”。这句话可以表示对他们采取不利行动，也可能较宽泛地表示再次介入或处置他们的处境。
    reason: alternative_reading
lexical_decisions:
- source_word: חֶרֶב עוּרִי
  choice: 刀剑啊，醒来
  rationale: 保留对单数“刀剑”的直接呼唤和拟人表达；“醒来”对应阴性单数命令式 עוּרִי，不把行动含义过度意译出来。
- source_word: רֹעִי
  choice: 我的牧人
  rationale: 直接保留名词性分词及第一人称单数所属后缀所表达的关系。
- source_word: גֶּבֶר עֲמִיתִי
  choice: 那作我同伴的人
  rationale: 保留 גֶּבֶר 的“人”以及 עֲמִיתִי 所表达的密切关联；“同伴”不把该词强化为本体意义上的“同等者”。
- source_word: נְאֻם יְהוָה צְבָאוֹת
  choice: 这是万军之耶和华的宣告
  rationale: 用现代汉语自然表达先知性的宣告公式；“万军之耶和华”保留神名与 צְבָאוֹת 的传统且清楚的表达。
- source_word: הַךְ
  choice: 击打
  rationale: 准确传达 נכה 命令式的有力动作，并与牧人意象自然搭配。
- source_word: וּתְפוּצֶיןָ הַצֹּאן
  choice: 羊群就必四散
  rationale: 保留羊的群体意象；“四散”自然表达被驱散、分散的结果。
- source_word: וַהֲשִׁבֹתִי יָדִי עַל
  choice: 我必转手攻击
  rationale: 正文按上下文采用不利行动的可能含义，同时以脚注保留该习语较为中性的解释空间。
- source_word: הַצֹּעֲרִים
  choice: 弱小者
  rationale: 该词可涉及年幼、弱小或地位低微；“弱小者”避免把所指仅限定为幼年者，也不擅自补入原文没有明说的“羊”。
theological_decisions:
- issue: עֲמִיתִי 所表达的牧人与耶和华之间的关系
  choice: 作我同伴的人
  alternative: 与我亲近的人；与我相等的人
  rationale: 正文表达密切关系，却不把后来的神学结论直接写入词义；脚注保留“相等”这一较强但可能的理解。
- issue: “把手转向弱小者”这一习语的行动性质
  choice: 转手攻击弱小者
  alternative: 把手转向弱小者，泛指再次处置或介入他们的处境
  rationale: 击打与四散的直接语境支持不利行动，但习语本身并未排除更宽泛的“转向、重新处置”，因此不应消除其张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留刀剑拟人、牧人与羊群的意象，以及末句习语的歧义；引号区分耶和华的直接宣告与叙述公式。
