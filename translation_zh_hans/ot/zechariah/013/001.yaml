  text: בַּ/יּ֣וֹם הַ/ה֗וּא יִֽהְיֶה֙ מָק֣וֹר נִפְתָּ֔ח לְ/בֵ֥ית דָּוִ֖יד וּ/לְ/יֹשְׁבֵ֣י יְרֽוּשָׁלִָ֑ם לְ/חַטַּ֖את וּ/לְ/נִדָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/013/001.yaml
  text: On that day a fountain will be opened for the house of David and for the inhabitants of Jerusalem[c][b][a], for sin and for impurity.
translation:
  language: zh_hans
  text: 在那日，必有一处泉源[a]为大卫家和耶路撒冷的居民开启，用以洗除罪恶[b]和污秽[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “泉源”也可译作“泉”或“水源”。
    reason: lexical_alternative
  - marker: b
    text: “罪恶”所对应的希伯来词也可指“赎罪祭”，不过本节洁净的语境更支持“罪恶”。
    reason: lexical_alternative
  - marker: c
    text: “污秽”也可译作“不洁”；原文可特指经期所致的不洁，也可泛指礼仪上的污秽。
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: 到那日
  rationale: 这是先知书中常见的时间表达；“到那日”符合现代汉语习惯，也保留其指向将来特定时刻的语气。
- source_word: יִהְיֶה מָקוֹר נִפְתָּח
  choice: 必有泉源……敞开
  rationale: 将存在动词与被动分词合译为自然的汉语预言句式，既保留“泉源”的意象，也明确表达泉源将被开启、可供使用。
- source_word: מָקוֹר
  choice: 泉源
  rationale: 该词可指泉、水源或涌流之源。“泉源”在现代汉语中自然庄重，并适合本节洁净的水流意象。
- source_word: לְבֵית דָּוִיד וּלְיֹשְׁבֵי יְרוּשָׁלִָם
  choice: 为大卫家和耶路撒冷的居民
  rationale: 介词 לְ 在这里表示受益或供应对象；“为”比单纯表示方向的“向”更准确。“居民”自然表达居住在耶路撒冷的人。
- source_word: לְחַטָּאת
  choice: 用来洁除罪恶
  rationale: חַטָּאת 可表示“罪”或“赎罪祭”。与泉源及 נִדָּה 并列时，语境侧重罪的洁除；汉语若直译“为罪”语意残缺，因此以“用来洁除”自然表达语境所含的用途，同时用脚注保留词义歧义。
- source_word: וּלְנִדָּה
  choice: 和污秽
  rationale: נִדָּה 可特指经期所致的礼仪不洁，也可泛指礼仪上的污秽。本处采用较宽泛的“污秽”，避免无根据地缩窄含义。
theological_decisions:
- issue: 先知性洁净意象的具体机制
  choice: 保留泉源洁除罪恶和污秽的意象，不在正文中说明其具体救赎机制
  alternative: 把泉源直接解释为赎罪、弥赛亚的血或其他后期神学概念
  rationale: 本节明确宣告有洁净的供应，却没有在本节中界定其机制。译文应保留经文本身的开放性和神学张力。
- issue: חַטָּאת 的“罪”与“赎罪祭”歧义
  choice: 正文译作“罪恶”，脚注保留“赎罪祭”的可能
  alternative: 正文译作“赎罪祭”
  rationale: 泉源与“污秽”并列的洁净语境更支持“罪恶”，但该希伯来词确有祭物义，不宜完全排除。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“到那日”保留先知性宣告的语气；“必有……敞开”兼顾希伯来文的将来指向和被动意义；“用来洁除”使目的关系在汉语中完整自然，但不额外说明洁净的神学机制。
