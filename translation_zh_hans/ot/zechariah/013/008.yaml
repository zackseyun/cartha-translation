  text: וְ/הָיָ֤ה בְ/כָל הָ/אָ֨רֶץ֙ נְאֻם יְהוָ֔ה פִּֽי שְׁנַ֣יִם בָּ֔/הּ יִכָּרְת֖וּ יִגְוָ֑עוּ וְ/הַ/שְּׁלִשִׁ֖ית יִוָּ֥תֶר בָּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/013/008.yaml
  text: And it will happen in all the land, declares the LORD, that two-thirds in it will be cut off and die, but one-third will be left in it.
translation:
  language: zh_hans
  text: 耶和华宣告：在全地，必有这样的事：其中三分之二的人将被剪除、丧命；三分之一的人却会存留下来。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְכָל־הָאָרֶץ
  choice: 在全地
  rationale: 保留原文“全地”的范围表达，不擅自限定为某一地区或改作“全国”。
- source_word: נְאֻם יְהוָה
  choice: 耶和华宣告
  rationale: 以现代汉语中庄重、清楚的先知宣告公式表达，并将四字神名译作“耶和华”。
- source_word: פִּי שְׁנַיִם
  choice: 三分之二的人
  rationale: 该希伯来语固定表达指“三分之二”；补出“人”以使中文自然，并依后续“死亡”明确其所指。
- source_word: יִכָּרְתוּ יִגְוָעוּ
  choice: 将被剪除、死亡
  rationale: 分别保留两个并列动词：前者带有被除去或毁灭的意象，后者明确指死亡，避免合并而损失强调。
- source_word: וְהַשְּׁלִשִׁית יִוָּתֶר
  choice: 三分之一的人却会存留下来
  rationale: “却”呈现转折；“存留下来”表达被留下、幸存之意，同时不增添施事者。
theological_decisions:
- issue: “全地”的范围
  choice: 保留“全地”
  alternative: 全境／全国
  rationale: הָאָרֶץ 可指土地、地区或大地，单凭本节无法完全消除范围歧义，因此不在正文中缩窄解释。
- issue: 余民是否被明确描述为蒙拯救
  choice: 译为“存留下来”
  alternative: 得救／蒙保全
  rationale: 原文只明确说三分之一被留下；采用中性表达，以免预先加入本节未明说的完整救恩含义。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。保留先知宣告的节奏和三分之二与三分之一的鲜明对照；不添加原文没有的解释性脚注。
