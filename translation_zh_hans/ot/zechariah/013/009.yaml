  text: וְ/הֵבֵאתִ֤י אֶת הַ/שְּׁלִשִׁית֙ בָּ/אֵ֔שׁ וּ/צְרַפְתִּי/ם֙ כִּ/צְרֹ֣ף אֶת הַ/כֶּ֔סֶף וּ/בְחַנְתִּ֖י/ם כִּ/בְחֹ֣ן אֶת הַ/זָּהָ֑ב ה֣וּא יִקְרָ֣א בִ/שְׁמִ֗/י וַֽ/אֲנִי֙ אֶעֱנֶ֣ה אֹת֔/וֹ אָמַ֨רְתִּי֙ עַמִּ֣/י ה֔וּא וְ/ה֥וּא יֹאמַ֖ר יְהוָ֥ה אֱלֹהָֽ/י־־־׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/013/009.yaml
  text: And I will bring the third part through the fire[a], and I will refine them as silver is refined, and test them as gold is tested. He will call on my name, and I will answer him. I will say, ‘He is my people,’ and he will say, ‘Yahweh is my God.’
translation:
  language: zh_hans
  text: 我要使那三分之一进入火中，熬炼他们，如同熬炼银子；试验他们，如同试验金子。他必求告我的名，我必应允他。我要说：“他是我的子民[a]。”他也要说：“雅威是我的上帝。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文从前面的复数“他们”转为单数“他”，以单数代表作为整体的余民；按集合意义也可顺译为“他们是我的子民”。
    reason: 说明原文具有解释意义的单复数转换，并提供更顺畅的集合性译法。
lexical_decisions:
- source_word: הַשְּׁלִשִׁית
  choice: 那三分之一
  rationale: 定冠词修饰的阴性序数词承接上一节存留下来的三分之一；“那三分之一”既明确其比例含义，也自然地回指前文。
- source_word: בָּאֵשׁ
  choice: 进入火中
  rationale: 介词短语与“使……来、带入”（הֵבֵאתִי）连用，首先表达进入火中的动作；保留炼净苦难的金属冶炼意象，不额外把结果解释为必然“穿过”火。
- source_word: וּצְרַפְתִּים
  choice: 熬炼他们
  rationale: צרף是炼净金属的常用动词；“熬炼”在现代汉语中兼有冶炼和经受磨炼的意味，与下文银子的明喻吻合。
- source_word: כִּצְרֹף אֶת־הַכֶּסֶף
  choice: 如同熬炼银子
  rationale: כ加不定式结构表达比较；采用汉语主动式泛指说法，简洁保留冶金图景。
- source_word: וּבְחַנְתִּים
  choice: 试验他们
  rationale: בחן表示检验、察验真伪；“试验”清楚表达鉴定成色的含义，并与金子的比喻相称。
- source_word: כִּבְחֹן אֶת־הַזָּהָב
  choice: 如同试验金子
  rationale: 与前一银子分句保持平行，保留检验贵金属真伪或纯度的意象。
- source_word: הוּא יִקְרָא בִשְׁמִי
  choice: 他必求告我的名
  rationale: קרא בשם在此表示呼求、求告某人的名，常用于祷告或敬拜；“求告我的名”是自然且庄重的汉语表达。
- source_word: וַאֲנִי אֶעֱנֶה אֹתוֹ
  choice: 我必应允他
  rationale: “应允”准确表达上帝回应求告；保留希伯来文由复数“他们”转为代表性单数“他”的形式。
- source_word: עַמִּי הוּא
  choice: 他是我的子民
  rationale: 原文以单数代词הוּא配合具有集合意义的“我的子民”；译文有意保留这种略显突出的代表性单数，不改写成复数。
- source_word: יְהוָה
  choice: 雅威
  rationale: 采用对四字神名YHWH的现代汉语音译“雅威”，保留其作为专名的性质，不以“主”等称号替代。
- source_word: אֱלֹהָי
  choice: 我的上帝
  rationale: 直接呈现第一人称所属关系，保留个人性的盟约宣认。
theological_decisions:
- issue: 末尾盟约公式中的单复数转换
  choice: 保留代表性单数：“他是我的子民”……“雅威是我的上帝”
  alternative: 按集合意义顺译为：“他们是我的子民”……“雅威是我们的上帝”
  rationale: 原文先以复数“他们”指余民，随后改用单数“他”；这种转换可能把余民整体作为一个代表性个体来述说。保留这一张力，避免替读者消解其解释空间。
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。译作专名“雅威”能够区别于称号，并较直接地反映通常重构的读音。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“熬炼—试验”保持两个希伯来动词的区别；末尾故意保留原文从复数到单数的突转，并以脚注说明。“雅威”作为神名音译，不用称号替代。
