reference: Zechariah 13:2
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/הָיָה֩ בַ/יּ֨וֹם הַ/ה֜וּא נְאֻ֣ם יְהוָ֣ה צְבָא֗וֹת אַכְרִ֞ית אֶת שְׁמ֤וֹת הָֽ/עֲצַבִּים֙ מִן הָ/אָ֔רֶץ וְ/לֹ֥א יִזָּכְר֖וּ ע֑וֹד וְ/גַ֧ם אֶת הַ/נְּבִיאִ֛ים וְ/אֶת ר֥וּחַ הַ/טֻּמְאָ֖ה אַעֲבִ֥יר מִן הָ/אָֽרֶץ׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/013/002.yaml
  text: And it shall happen in that day[a], declares Yahweh of hosts, that I will cut off the names of the idols from the land, and they shall be remembered no more[b]. And also I will remove from the land the prophets and the unclean spirit.
translation:
  language: zh_hans
  text: “到那日，万军之耶和华宣告：我必从这地除灭偶像的名号，偶像的名号不再被记念；我也必从这地除去先知[a]和污秽之灵[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的“先知”按上下文是指与偶像崇拜和污秽有关、迷惑人的先知；原文没有明说“假先知”。
    reason: cultural_note
  - marker: b
    text: “污秽之灵”也可译作“污秽的灵”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: 到……（这一切）必发生
  rationale: 这是引出未来事件的先知性表达；汉语以“到那日”配合后文的“必”自然传达其将来含义，无须机械译出系动词。
- source_word: בַיּוֹם הַהוּא
  choice: 到那日
  rationale: 保留先知文学中具有特定指向的时间公式，同时符合现代汉语习惯。
- source_word: נְאֻם יְהוָה צְבָאוֹת
  choice: 万军之耶和华宣告
  rationale: “宣告”传达 נְאֻם 的郑重神谕语气；“耶和华”对应神名 יהוה，“万军之”对应 צְבָאוֹת。
- source_word: אַכְרִית
  choice: 我必……除灭
  rationale: 该使役形在这里表示彻底断绝、清除；“除灭”保留其强烈而决绝的力度。
- source_word: שְׁמוֹת הָעֲצַבִּים
  choice: 偶像的名号
  rationale: 明确保留原文的“名”，表明被消除的不只是偶像实体，也包括其名声与记忆；עֲצַבִּים 在此指偶像。
- source_word: מִן הָאָרֶץ
  choice: 从这地
  rationale: 上下文谈到从立约群体所在之地清除偶像和不洁，故取具体地域义“这地”，而非范围更广的“全地”或“世界”。
- source_word: וְלֹא יִזָּכְרוּ עוֹד
  choice: 使它们不再被人记念
  rationale: 保留 Niphal 的被动含义；“被人记念”是自然汉语，也体现偶像及其名号将从群体记忆中消失。
- source_word: וְגַם
  choice: 我也必
  rationale: “也”保留附加关系，并以符合现代汉语的语序衔接第二项洁净行动。
- source_word: הַנְּבִיאִים
  choice: 先知
  rationale: 原文只有“先知”，没有“假”这一修饰语；正文不补入原文未明说的定性，由上下文及脚注说明其负面所指。
- source_word: רוּחַ הַטֻּמְאָה
  choice: 污秽之灵
  rationale: 保留“灵”与“污秽”的属格结构及原文可能具有的属灵位格含义，同时不把含义限定为纯粹抽象的“不洁风气”。
- source_word: אַעֲבִיר
  choice: 我必……除去
  rationale: 该使役形在此意为使之离开、消失；“除去”清楚自然，并与前面的“除灭”形成语义呼应而不完全重复。
theological_decisions:
- issue: 是否把 הַנְּבִיאִים 明译为“假先知”
  choice: 正文译作“先知”，并以脚注交代语境所指
  alternative: 假先知
  rationale: 偶像和污秽之灵的语境表明这里所说的是不正当、迷惑人的先知，但希伯来文没有“假”这一形容词。保留原文措辞可避免在正文中消解其张力。
- issue: רוּחַ הַטֻּמְאָה 指非位格力量还是属灵存在
  choice: 污秽之灵
  alternative: 污秽的风气／不洁的精神
  rationale: 原文可以表示以污秽为特征的灵；“污秽之灵”保留较可能的属灵含义，又没有进一步断言其身份或性质。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“到那日”“万军之耶和华宣告”等表达保留先知文学语气；避免文言式“必成就”等生硬措辞。脚注标记放在其实际说明的词语之后，以纠正咨询层中标记位置与脚注内容不相对应的问题。
