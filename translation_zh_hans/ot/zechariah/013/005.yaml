  to: 他必说：“我不是先知；我是耕种土地的人，因为我自幼就归人所有[a]。”
  rationale: 修订仅改善末句的汉语自然度并更审慎地保留原文关于取得／所有关系的歧义；保留预言语境中的将来式、对先知身份的否认，以及说话者自称从事耕作的内容。
