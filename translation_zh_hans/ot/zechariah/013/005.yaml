source:
  edition: WLC
  text: וְ/אָמַ֕ר לֹ֥א נָבִ֖יא אָנֹ֑כִי אִישׁ עֹבֵ֤ד אֲדָמָה֙ אָנֹ֔כִי כִּ֥י אָדָ֖ם הִקְנַ֥/נִי מִ/נְּעוּרָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/013/005.yaml
  text: And he will say[a], ‘I am not a prophet; I am a man who works the ground, for the land has been my possession from my youth.’
translation:
  language: zh_hans
  text: 他必说：“我不是先知；我是耕种土地的人，因为我自幼就归人所有[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“因为有人从我幼年起就买下了我”或“因为有人从我幼年起就拥有我”。希伯来语动词可指取得、买下或拥有；此处具体的社会关系未予说明。
    reason: 原文 הִקְנַנִי 可指取得、购买或拥有，且与“自幼”搭配的精确关系存在歧义；脚注保留这些可能，正文不将其定为买卖、奴役或训练。
lexical_decisions:
- source_word: וְאָמַר
  choice: 他必说
  rationale: 在“到那日”的预言语境中，连接词加完成式承接将来所要发生的事；“必说”既体现将来指向，也符合庄重的现代汉语。
- source_word: נָבִיא
  choice: 先知
  rationale: 这是该希伯来词在本段关于预言与先知身份语境中的标准译法。
- source_word: אִישׁ עֹבֵד אֲדָמָה
  choice: 耕地的人
  rationale: 保留 אִישׁ“人”和分词 עֹבֵד“劳作、耕作”的含义，也直接表达 אֲדָמָה 在此处的土地、土壤义；比单译“农夫”更贴近原文结构。
- source_word: כִּי
  choice: 因为
  rationale: 引出说话者声称自己是耕地之人的理由，明确保留原文的解释关系。
- source_word: אָדָם
  choice: 人
  rationale: 原文以单数 אָדָם 作 הִקְנַנִי 的主语；汉语用不定指的“人”，不擅自确定其具体身份。
- source_word: הִקְנַנִי
  choice: 把我收为己有
  rationale: קנה 的词义范围涉及取得、买下和占有。“收为己有”在现代汉语中较自然，并保留取得或归属关系，而不强行断定具体是买卖或奴役。
- source_word: מִנְּעוּרָי
  choice: 从幼年起
  rationale: 直接表达从年幼时期开始并延续至后的时间含义，语体自然而庄重。
theological_decisions:
- issue: 说话者否认先知身份的性质
  choice: 仅译出他否认自己是先知并声称从事耕作，不判断这番话是真诚弃绝虚假预言，还是为自保而隐瞒身份。
  alternative: 明确称其为假先知，或明确称其为已经悔改、放弃先知身份的人。
  rationale: 上下文涉及先知蒙羞并否认其身份，但本节本身没有说明这项声明是否诚实，因此不在译文中替叙事作出判决。
- issue: הִקְנַנִי 所表达的社会关系
  choice: 译为“把我收为己有”，宽泛保留取得、买下或占有的可能。
  alternative: 译为“买下了我”“使我作仆人”或“训练我耕田”。
  rationale: 原词能够表达取得、购买或拥有，而本句没有清楚说明具体法律或社会关系；宽泛译法避免把奴隶买卖、雇佣或职业训练等重构写进正文。
translation_notes:
  register: 采用现代、庄重且易懂的标准普通话。“耕地的人”贴近原文而不显古奥；末句保留原文略显突兀的归属关系，不依照后来的职业解释改写为“教我放牧”或“训练我务农”。
