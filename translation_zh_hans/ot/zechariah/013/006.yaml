  text: וְ/אָמַ֣ר אֵלָ֔י/ו מָ֧ה הַ/מַּכּ֛וֹת הָ/אֵ֖לֶּה בֵּ֣ין יָדֶ֑י/ךָ וְ/אָמַ֕ר אֲשֶׁ֥ר הֻכֵּ֖יתִי בֵּ֥ית מְאַהֲבָֽ/י׃ס
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/013/006.yaml
  text: And if one says to him[a], “What are these wounds between your hands?” he will say[c][b], “Those with which I was wounded in the house of those who love me.”
translation:
  language: zh_hans
  text: 若有人问他：“你两手之间的这些伤是怎么回事？”[a] 他就回答：“这些伤是我在爱我的人的家中受的。”[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语直译为“在你两手之间”。这可能是指两臂之间，即胸部或躯干部位。
    reason: lexical_alternative
  - marker: b
    text: “爱我的人”也可理解为“我的亲近者”或“我的亲密同伴”；较直译地也可说“我的爱慕者”。
    reason: lexical_alternative
  - marker: c
    text: 有些基督徒解释者把这些伤理解为弥赛亚所受的伤；但本节本身并未明确这样说。
    reason: alternative_reading
lexical_decisions:
- source_word: וְאָמַר אֵלָיו
  choice: 若有人问他
  rationale: 希伯来语字面为“他对他说”，但在这段预言性对话中，发问者并未具体指明；用“若有人问他”明确汉语所需的主语，并按上下文表达假设性的问答情境。
- source_word: הַמַּכּוֹת הָאֵלֶּה
  choice: 这些伤
  rationale: מַכּוֹת 可指击打，也可指击打造成的伤；这里询问的是可见痕迹，因此译作“伤”最合语境。
- source_word: בֵּין יָדֶיךָ
  choice: 你两手之间
  rationale: 保留希伯来语“在你的双手之间”的具体措辞及其不寻常之处，不在正文中直接解释为胸部或躯干；可能的惯用含义置于脚注。
- source_word: וְאָמַר
  choice: 他就回答
  rationale: 此处承接直接问话，用现代汉语“回答”比重复“说”更自然；“就”体现问答的顺接关系。
- source_word: אֲשֶׁר הֻכֵּיתִי
  choice: 这是我……受的伤
  rationale: הֻכֵּיתִי 是 נכה 的被动式，可译“我被击打”或“我受伤”；结合前面的“伤”，汉语采用关系结构，使回答清楚而自然。
- source_word: בֵּית מְאַהֲבָי
  choice: 在爱我的人家中
  rationale: בֵּית 直指“家、房屋”，מְאַהֲבָי 字面指“爱我的人”；此译保留地点和关系含义，不擅自缩窄为朋友、亲属或情人。
theological_decisions:
- issue: 是否在译文中直接把说话者认定为弥赛亚，并把这些伤认定为受难或钉十字架的伤
  choice: 正文不作明确的弥赛亚身份认定，只翻译经文本身的问答。
  alternative: 按基督论理解，将这些伤直接表述为弥赛亚或耶稣受难的伤。
  rationale: 本节希伯来文本只提到可见的伤及其来源，没有明说弥赛亚、十字架或受难。为保存经文本身的开放性和神学张力，基督论解释仅在脚注中说明。
- issue: מְאַהֲבָי 所指关系的性质
  choice: 译作“爱我的人”，不限定为朋友、亲密伴侣或其他特定群体。
  alternative: 译作“我的朋友”“我的亲友”或“我的情人”。
  rationale: 原词可涵盖爱慕者、亲近者或亲密同伴；正文采用较宽的表达，以免加入原文没有明确规定的关系性质。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“是怎么回事”使问句自然，同时仍指向伤的性质或来由；“家中”保留 בֵּית 的地点意象。脚注标记均置于正文相应位置。
