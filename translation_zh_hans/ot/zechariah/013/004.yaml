  text: וְ/הָיָ֣ה בַּ/יּ֣וֹם הַ/ה֗וּא יֵבֹ֧שׁוּ הַ/נְּבִיאִ֛ים אִ֥ישׁ מֵ/חֶזְיֹנ֖/וֹ בְּ/הִנָּֽבְאֹת֑/וֹ וְ/לֹ֧א יִלְבְּשׁ֛וּ אַדֶּ֥רֶת שֵׂעָ֖ר לְמַ֥עַן כַּחֵֽשׁ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/013/004.yaml
  text: And on that day the prophets will each be ashamed of his vision when he prophesies[b][a], and they will not put on a hairy cloak in order to deceive.
translation:
  language: zh_hans
  text: 在那日，先知们各人在说预言时，都必因自己的异象而羞愧；他们也不再披上毛制外袍[a]来欺骗人[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“毛披风”；这是粗糙的外衣，与先知的装束有关。
    reason: lexical_alternative
  - marker: b
    text: 或译“来说谎”。希伯来语这个词可指虚假或欺骗；这里是指借先知的装束误导他人。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה בַּיּוֹם הַהוּא
  choice: 到那日
  rationale: 这是先知书常见的未来时间公式；“到那日”自然、庄重，并保留其预告性质。
- source_word: יֵבֹשׁוּ
  choice: 都必……羞愧
  rationale: 该动词表示羞愧或蒙羞；此译法不武断限定为内心羞耻或外在受辱。
- source_word: הַנְּבִיאִים אִישׁ
  choice: 先知们各人
  rationale: 保留“先知”这一原文字眼，不增添“假”；“各人”体现 אִישׁ 在此的逐一分配意义。
- source_word: מֵחֶזְיֹנוֹ
  choice: 因自己的异象
  rationale: 介词 מִן 与羞愧类动词连用，可指出羞愧所因或所关涉之事；“因……异象”符合现代汉语表达。
- source_word: בְּהִנָּבְאֹתוֹ
  choice: 在说预言时
  rationale: 介词 בְּ 加不定词结构在此具有时间意义；译文保留“说预言时”的关系。
- source_word: וְלֹא יִלְבְּשׁוּ
  choice: 也不再披上
  rationale: יִלְבְּשׁוּ 表示穿戴；“披上”适合外袍，并体现有意采用某种装束。上下文中的未来情境使“不再”自然地表达这种行为的停止。
- source_word: אַדֶּרֶת שֵׂעָר
  choice: 毛制外袍
  rationale: 指带毛或以毛制成的粗糙披风式外衣，可能与先知的典型装束有关；“毛制外袍”既保留具体形象，也避免误解为现代毛衣。
- source_word: לְמַעַן כַּחֵשׁ
  choice: 来欺骗人
  rationale: כחש 可表示说谎、虚假或欺骗；此处涉及借先知装束误导他人，“欺骗人”最贴合语境，同时以脚注保留“说谎”的可能译法。
theological_decisions:
- issue: 是否在正文中明确称这些人为“假先知”
  choice: 保留“先知们”
  alternative: 假先知们
  rationale: 上下文表明这些先知的宣称受到否定，但本节希伯来文只使用“先知”一词。正文不增添“假”，让上下文表达其性质。
- issue: “异象”是否应直接改写为虚假异象
  choice: 保留“自己的异象”
  alternative: 自己虚假的异象
  rationale: 经文以他们的羞愧及欺骗行为暗示异象有问题，却未在名词前直接加“虚假”；保留原文措辞可避免消除这种含蓄张力。
translation_notes:
  register: 采用现代、庄重而通顺的标准普通话。“说预言”“异象”“外袍”等词为普通读者可理解的圣经语域；句法尽量贴近希伯来文，同时避免生硬直译。
