  to: 将来，若仍有人说预言[a]，生他的父母必对他说：“你不得存活，因为你奉雅威的名说了谎话。”生他的父母必在他说预言时刺透他[b]。
  rationale: 修订使未来引介、神名和“刺穿”的具体动作更贴近希伯来原文及英文POB审校决定；同时保留文本对父母行动和死亡宣告的严厉描述，不将“说预言”预先解释为“说假预言”。脚注锚点[a]、[b]均保留并与正文对应。
