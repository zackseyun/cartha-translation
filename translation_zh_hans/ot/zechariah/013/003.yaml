  naturalness: “若仍有人说预言”“你不得存活”及“刺透他”在现代标准汉语中庄重、清楚，并较好保留原文的宣判和暴力动作。重复使用“生他的父母”虽略显重复，却对应原文有意重复的亲属身份。
  terminology: “说预言”不预先加入“假”字，正确保留原文展开；“雅威”对应Yahweh，避免以称号替代专名。
