id: ZEC.13.3
reference: Zechariah 13:3
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/הָיָ֗ה כִּֽי יִנָּבֵ֣א אִישׁ֮ עוֹד֒ וְ/אָמְר֣וּ אֵ֠לָי/ו אָבִ֨י/ו וְ/אִמּ֤/וֹ יֹֽלְדָי/ו֙ לֹ֣א תִֽחְיֶ֔ה כִּ֛י שֶׁ֥קֶר דִּבַּ֖רְתָּ בְּ/שֵׁ֣ם יְהוָ֑ה וּ/דְקָרֻ֜/הוּ אָבִ֧י/הוּ וְ/אִמּ֛/וֹ יֹלְדָ֖י/ו בְּ/הִנָּבְאֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/013/003.yaml
  text: And it will happen that if a man still prophesies[a], his father and his mother who bore him will say to him, ‘You shall not live, because you have spoken lies in the name of Yahweh’[b]; and his father and his mother who bore him will pierce him through when he prophesies.
translation:
  language: zh_hans
  text: 将来，若仍有人说预言[a]，生他的父母必对他说：“你不得存活，因为你奉雅威的名说了谎话。”生他的父母必在他说预言时刺透他[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “若仍有人说预言”也可译作“若又有人说预言”。希伯来语“仍／又”可指行为持续，也可指行为再次发生。
    reason: lexical_alternative
  - marker: b
    text: “刺透他”也可译作“刺穿他”或“刺他”。原文动词指用武器刺入或刺穿。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: 到那时
  rationale: 此结构引出将来的情形；结合上下文，用“到那时”比逐字译作“事情将是”更自然庄重。
- source_word: כִּי יִנָּבֵא אִישׁ עוֹד
  choice: 若还有人说预言
  rationale: כִּי在此引出可能发生的情形，译作“若”；עוֹד表示在清除假先知的背景下仍继续或再次发生，故译“还有”。不在“说预言”一词中预先加入“假”字，因为下文已明确指出其话是谎言。
- source_word: יֹלְדָיו
  choice: 生他的／亲生父母
  rationale: 该形式直指使他出生的父母。首次译作“生他的父母”保留原文具体表达，后句用“亲生父母”自然地重现这一强调。
- source_word: לֹא תִחְיֶה
  choice: 你不可存活
  rationale: 保留原文严厉、近于司法宣判的语气，而不弱化为社会排斥。
- source_word: שֶׁקֶר דִּבַּרְתָּ
  choice: 你说了谎话
  rationale: 准确表达虚假言说，也是现代汉语自然说法；其所指为冒用神名所说的虚假预言。
- source_word: בְּשֵׁם יְהוָה
  choice: 奉耶和华的名
  rationale: “奉……的名”自然表达凭其权柄、以其名义说话；将四字神名按项目要求译为“耶和华”。
- source_word: וּדְקָרֻהוּ
  choice: 把他刺死
  rationale: דקר指用利器刺穿；与前面的“不可存活”相连，“刺死”在中文中简洁明确地传达致命行动，并以脚注保留较贴近动作形态的译法。
- source_word: בְּהִנָּבְאוֹ
  choice: 在他说预言时
  rationale: 介词בְּ加不定词结构在此表达时间或伴随情境；“在……时”清楚保留其时间关系。
theological_decisions:
- issue: 父母对冒用神名说谎者所采取行动的严厉程度
  choice: 保留父母宣告他不可存活并将他刺死的直接陈述
  alternative: 弱化为断绝关系、拒绝他，或仅使他受伤
  rationale: 原文同时使用“你不可存活”和表示刺穿的动词，不能把这幅严厉的审判图景缓和为单纯的社会排斥。
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威；主
  rationale: 原文明确使用四字神名。中文经文传统中“耶和华”辨识度高，并保留专名性质，而非以称号取代。
- issue: 说预言的行为是否应直接标为“假预言”
  choice: 正文保留中性的“说预言”，由后文“说了谎话”判明其虚假
  alternative: 直接译作“说假预言”
  rationale: 原文动词本身是“说预言”，其虚假性由后面的指控表达；保留这一展开可避免把解释提前写入动词。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“你不可存活”保留宣判式语气；“奉耶和华的名”符合中文宗教语境且不显古奥。正文中的[a]、[b]均与脚注对应。
