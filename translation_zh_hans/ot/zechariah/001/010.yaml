  text: וַ/יַּ֗עַן הָ/אִ֛ישׁ הָ/עֹמֵ֥ד בֵּין הַ/הַדַסִּ֖ים וַ/יֹּאמַ֑ר אֵ֚לֶּה אֲשֶׁ֣ר שָׁלַ֣ח יְהוָ֔ה לְ/הִתְהַלֵּ֖ךְ בָּ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/001/010.yaml
  text: Then the man who was standing among the myrtle trees answered and said[b][a], “These are the ones whom Yahweh has sent to walk throughout the earth.”
translation:
  language: zh_hans
  text: 站在香桃木丛中的那人回答说：“这些是雅威派去在大地[b]上往来行走[a]的。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“巡行”或“在地上来往行走”。
    reason: lexical_alternative
  - marker: b
    text: “大地”也可译作“这地”，取决于所指的是全世界还是某一地域。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמַר
  choice: 回答说
  rationale: 希伯来语连用“回答”和“说”引出回应；“回答说”既保留其回应性质，也符合现代汉语叙事习惯。
- source_word: הָאִישׁ הָעֹמֵד
  choice: 站在……中的那人
  rationale: 分词说明这人的位置和身份；汉语关系结构自然地保留其持续站立的画面。
- source_word: בֵּין הַהַדַסִּים
  choice: 在香桃木丛中
  rationale: הֲדַסִּים指myrtle；“香桃木”是较明确的现代植物名称，“丛中”自然表达置身多棵树木之间。
- source_word: אֵלֶּה אֲשֶׁר
  choice: 这些就是……的
  rationale: 指向前文所见的骑者；汉语以“这些就是……的”保留原文简洁的指认语气，不额外限定其具体身份。
- source_word: יְהוָה
  choice: 雅威
  rationale: 直接音译四字神名，保留其作为以色列之上帝专名的功能，而不以称号代替。
- source_word: לְהִתְהַלֵּךְ
  choice: 巡行
  rationale: 该词的Hitpael形态表达四处或往来行走；“巡行”简洁自然，并切合使者察看各处的异象语境，同时脚注保留较少解释性的译法。
- source_word: בָּאָרֶץ
  choice: 大地
  rationale: אֶרֶץ既可指全地，也可指某一地域；正文依异象的广阔范围译作“大地”，脚注保留“这地”的可能。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较贴近学界通常采用的发音重构，并明确保留专名性质。
- issue: אֶרֶץ所指范围
  choice: 大地
  alternative: 这地
  rationale: 上下文可理解为众使者察看普世，也可能聚焦于某片土地；正文采用较广义的读法，但以脚注保留地域性解释，避免消除原文歧义。
translation_notes:
  register: 采用庄重而流畅的现代标准汉语。“回答说”保留希伯来叙事公式；“香桃木”避免现代读者把传统译名“番石榴树”误解为guava。脚注标记紧随各自所注释的词语。
