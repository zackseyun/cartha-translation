source:
  edition: WLC
  text: וַֽ/יַּעֲנ֞וּ אֶת מַלְאַ֣ךְ יְהוָ֗ה הָֽ/עֹמֵד֙ בֵּ֣ין הַ/הֲדַסִּ֔ים וַ/יֹּאמְר֖וּ הִתְהַלַּ֣כְנוּ בָ/אָ֑רֶץ וְ/הִנֵּ֥ה כָל הָ/אָ֖רֶץ יֹשֶׁ֥בֶת וְ/שֹׁקָֽטֶת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/001/011.yaml
  text: And they answered the angel of Yahweh who was standing among the myrtle trees and said[a], “We have gone throughout the earth, and behold[b], all the earth is at rest and quiet.”
translation:
  language: zh_hans
  text: 他们回答那站在香桃木丛中的雅威的使者，说：“我们已经巡行[a]全地；看哪，全地都安居而平静。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“走遍全地”或“在全地来回行走”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲנוּ ... וַיֹּאמְרוּ
  choice: 他们回答……说
  rationale: 保留希伯来文“回答……并说”的叙事结构；中文以“回答……说”自然表达同一动作序列。
- source_word: מַלְאַךְ יְהוָה
  choice: 雅威使者
  rationale: מַלְאָךְ兼有“使者”和“天使”的含义；“使者”既适合异象语境，也不先行消除原文的词义张力。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见的音译直接呈现四字神名，而不以称号代替专名。
- source_word: הָעֹמֵד
  choice: 站在
  rationale: 分词描写使者在异象场景中持续站立的位置；中文定语结构简洁自然。
- source_word: בֵּין הַהֲדַסִּים
  choice: 在番石榴树中间
  rationale: בֵּין在一群树木的场景中可自然译作“中间”；הֲדַסִּים指番石榴树。
- source_word: הִתְהַלַּכְנוּ
  choice: 已经巡行
  rationale: 该词在前文骑乘者奉差察看全地并回来报告的语境中，表示在一片区域往来行走；“巡行”兼顾动作方式和执行察看任务的语境。
- source_word: בָאָרֶץ / כָל הָאָרֶץ
  choice: 全地 / 全地
  rationale: 后句的“全地”表明视野并非只限于某一地方；中文“全地”保留“地、土地、世界”之间的语义宽度。
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留引人注意的先知性话语标记及其庄重语气。
- source_word: יֹשֶׁבֶת וְשֹׁקָטֶת
  choice: 安居平静
  rationale: יֹשֶׁבֶת描写安然居住、处于安定状态，שֹׁקָטֶת表示平静无扰；“安居平静”既自然，又维持两个词的区别。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；音译“雅威”保留其专名性质，不以称号取代。
- issue: מַלְאַךְ在“מַלְאַךְ יְהוָה”中的译法
  choice: 使者
  alternative: 天使
  rationale: 原词可指一般使者，也可指天上使者；译作“使者”保留原文可能具有的身份张力，而不在本节中额外判定其本体身份。
- issue: 全地安居平静所表达的状态
  choice: 安居平静
  alternative: 坐着不动，安静无扰；安歇平静
  rationale: 此处报告列国所处的安定状态，但不对这种平静作正面或负面的神学评价；译文保持异象上下文中的张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“看哪”保留先知文学语体；其余表达避免过度古雅。“番石榴树”按植物名称明译，“安居平静”则以自然汉语呈现希伯来文两个并列分词。
