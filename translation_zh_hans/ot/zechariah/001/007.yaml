    rationale: 希伯来文重复使用“儿子”，家谱中可涵盖后代关系，但本节并未明说“孙子”。译作“易多的儿子”更贴近原文，也不排除家谱术语的弹性。
  - severity: low
    issue: 正文将“先知”处理为“那位先知”，易使其明确指向撒迦利亚
    rationale: הַנָּבִיא 在该家谱链末尾，其具体所修饰对象有句法讨论空间。正文宜采用不强行消除歧义的“易多的儿子撒迦利亚先知”，并以脚注说明可能关联易多。
  - severity: low
    issue: 月份脚注加入不必要且不够稳妥的替代音译及历法背景
    rationale: 英文审计轨迹仅提示 Shevat 这一替代拼写。中文脚注宜简洁说明“舍巴特”也可译作“舍瓦特”；本节无须扩展巴比伦历背景。
