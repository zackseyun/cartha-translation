  text: בְּ/יוֹם֩ עֶשְׂרִ֨ים וְ/אַרְבָּעָ֜ה לְ/עַשְׁתֵּֽי עָשָׂ֥ר חֹ֨דֶשׁ֙ הוּא חֹ֣דֶשׁ שְׁבָ֔ט בִּ/שְׁנַ֥ת שְׁתַּ֖יִם לְ/דָרְיָ֑וֶשׁ הָיָ֣ה דְבַר יְהוָ֗ה אֶל זְכַרְיָה֙ בֶּן בֶּ֣רֶכְיָ֔הוּ בֶּן עִדּ֥וֹא הַ/נָּבִ֖יא לֵ/אמֹֽר־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/001/007.yaml
  text: 'On the twenty-fourth day of the eleventh month (that is[a], the month Shebat), in the second year of Darius, the word of Yahweh came to Zechariah son of Berechiah, son of Iddo the prophet[b], saying:'
translation:
  language: zh_hans
  text: 大流士第二年十一月二十四日，就是舍巴特月[a]，雅威的话临到比利家的儿子、易多的儿子撒迦利亚先知[b]，说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “舍巴特”也可音译作“舍瓦特”。
    reason: 说明该月份名的常见替代音译。
  - marker: b
    text: “先知”也可能与“易多”相连，作“先知易多”；希伯来语语序容许两种理解。
    reason: 保留 הַנָּבִיא 所指对象的句法歧义。
lexical_decisions:
- source_word: בְּיוֹם עֶשְׂרִים וְאַרְבָּעָה
  choice: 二十四日
  rationale: 希伯来语以介词和基数词组成日期表达；现代汉语自然地译作“二十四日”。
- source_word: לְעַשְׁתֵּי עָשָׂר חֹדֶשׁ
  choice: 十一月
  rationale: 保留原文按序数标明月份的历法表达。
- source_word: הוּא חֹדֶשׁ שְׁבָט
  choice: 就是舍巴特月
  rationale: הוּא 在这里说明第十一个月的名称；“就是”自然保留其解释作用。“舍巴特”按希伯来语音译。
- source_word: בִּשְׁנַת שְׁתַּיִם לְדָרְיָוֶשׁ
  choice: 大流士第二年
  rationale: 采用现代汉语常见的君王纪年格式。
- source_word: הָיָה דְבַר יְהוָה אֶל
  choice: 雅威的话临到
  rationale: 这是先知书中表示神启示的固定表达；“临到”既自然，也保留其庄重语体。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，不以称号替代专名。
- source_word: זְכַרְיָה בֶּן בֶּרֶכְיָהוּ בֶּן עִדּוֹא
  choice: 撒迦利亚，就是比利家的儿子、易多的孙子
  rationale: 保留两代家系关系，并用同位说明使现代汉语易于理解；第二个 בֶּן 在家谱链中自然译为“孙子”。
- source_word: הַנָּבִיא
  choice: 那位先知
  rationale: 保留定冠词的特指作用，同时用脚注提示该称号在希伯来语语序中的修饰对象存在句法歧义。
- source_word: לֵאמֹר
  choice: 说
  rationale: 以“说：”引出后续直接话语，符合希伯来语引语公式及现代汉语习惯。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文使用神的专名，正文以音译“雅威”保留专名性质，避免改换成称号。
- issue: “先知”所指的人物
  choice: 正文按撒迦利亚的称号处理，并以脚注保留歧义
  alternative: 把“先知”理解为紧邻的易多
  rationale: הַנָּבִיא 位于整段家系之后，传统上常作撒迦利亚的称号，但其位置也容许与最近的“易多”相连；不应无提示地排除另一种句法理解。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。日期按汉语纪年习惯排列；人名和月份名采用音译。正文避免古奥虚词，并用脚注保留“先知”所指对象的真实歧义。
