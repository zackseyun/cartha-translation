  rationale: 修订以“转向”在两个分句中一致翻译 שׁוּב，既保存原文的词汇呼应和关系恢复含义，也避免将神的“归向”译得生硬。引号调整为由开头发言公式统领的连续神谕；中间的“宣告”和结尾的“如此说”仍完整保留，分别反映 נְאֻם 与 אָמַר 的重复。
