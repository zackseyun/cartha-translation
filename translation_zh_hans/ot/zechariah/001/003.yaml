  text: וְ/אָמַרְתָּ֣ אֲלֵ/הֶ֗ם כֹּ֤ה אָמַר֙ יְהוָ֣ה צְבָא֔וֹת שׁ֣וּבוּ אֵלַ֔/י נְאֻ֖ם יְהוָ֣ה צְבָא֑וֹת וְ/אָשׁ֣וּב אֲלֵי/כֶ֔ם אָמַ֖ר יְהוָ֥ה צְבָאֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/001/003.yaml
  text: 'Therefore say to them[a], ‘Thus says Yahweh of hosts: Return to me,’ declares Yahweh of hosts, ‘and I will return to you,’ says Yahweh of hosts.'
translation:
  language: zh_hans
  text: 所以，你要对他们说：“万军之雅威如此说：‘你们要转向我，’万军之雅威宣告，‘我就转向你们。’万军之雅威如此说。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: 所以，你要对他们说
  rationale: וְ承接上文关于雅威发怒的陈述；用“所以”自然表达因果衔接。“你要……说”保留第二人称单数命令的指向。
- source_word: כֹּה אָמַר
  choice: 如此说
  rationale: 保留先知传信公式的庄重语气，也符合现代中文表达。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文直接呈现上帝的专名，而不以“主”这一称号替代；“雅威”是现代汉语对 Yahweh 的常见音译。
- source_word: צְבָאוֹת
  choice: 万军之
  rationale: 在神圣称号中采用中文已有且语义宽广的“万军之”，既可涵盖天上的众军，也传达统帅万军的主权，避免将其限缩为地上的军队。
- source_word: שׁוּבוּ אֵלַי
  choice: 你们要归向我
  rationale: שׁוּב可表示转回、返回；“归向”兼顾方向、关系恢复和悔改语境，又不额外加入“悔改”等解释性词语。
- source_word: נְאֻם
  choice: 这是……的宣告
  rationale: 此词标示权威性的神谕话语；译为“宣告”与前后的אָמַר“说”有所区别，并使中文句法完整。
- source_word: וְאָשׁוּב אֲלֵיכֶם
  choice: 我就归向你们
  rationale: 两处שׁוּב采用相同译词“归向”，保留原文刻意形成的人神对应关系；וְ在此语境中译作“就”，清楚表达前后呼应。
- source_word: אָמַר יְהוָה צְבָאוֹת
  choice: 万军之雅威如此说
  rationale: 保留本节结尾再次出现的发言公式及其重复强调，同时采用庄重而清楚的现代中文。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文使用专名，而非“主”的称号。“雅威”较直接地音译 Yahweh，也避免以传统替代读法掩盖专名。
- issue: שׁוּב所表达的悔改与关系恢复
  choice: 归向我……我就归向你们
  alternative: 转向我……我就转向你们；回到我这里……我就回到你们那里
  rationale: 原文没有直接使用“悔改”一词，而是两次使用同一动词。译文保留“归向”的开放性及双方动作的对称，不把神“归向”人具体解释为某一种恩惠或临在方式。
- issue: 人的归向与神的归向之间的关系
  choice: 以“就”呈现回应关系，但不进一步说明其机制
  alternative: 译成明确的条件句“如果……我就……”
  rationale: 原文以两个命令／陈述分句并列，具有明显回应关系，却没有显式条件词；“就”在中文中自然呈现这种关系，同时不将其系统化为更强的条件公式。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。保留三次“万军之雅威”及两种发言公式的重复，以呈现原文的强调和先知宣告节奏；引号分层处理神谕内容，避免中文长句产生发言者不清的问题。
