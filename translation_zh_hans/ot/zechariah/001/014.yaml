  text: וַ/יֹּ֣אמֶר אֵלַ֗/י הַ/מַּלְאָךְ֙ הַ/דֹּבֵ֣ר בִּ֔/י קְרָ֣א לֵ/אמֹ֔ר כֹּ֥ה אָמַ֖ר יְהוָ֣ה צְבָא֑וֹת קִנֵּ֧אתִי לִ/ירוּשָׁלִַ֛ם וּ/לְ/צִיּ֖וֹן קִנְאָ֥ה גְדוֹלָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/001/014.yaml
  text: 'Then the angel who was speaking with me said to me[a], “Proclaim, saying, ‘Thus says Yahweh of hosts: I am exceedingly jealous for Jerusalem and for Zion.’”'
translation:
  language: zh_hans
  text: 那与我说话的天使对我说：“你要宣告说：‘万军之耶和华如此说：我为耶路撒冷和锡安大发嫉妒[a]。’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我为耶路撒冷和锡安大有热忱。”希伯来文以同一词根的动词和名词连用，加强语气。
    reason: 说明קנא兼有“嫉妒、热忱”的语义，并交代同根词重复所产生的强调。
lexical_decisions:
- source_word: הַמַּלְאָךְ הַדֹּבֵר בִּי
  choice: 那与我说话的天使
  rationale: בִּי在撒迦利亚书这一异象语境中是“与我说话”的惯用表达；分词译作“说话的”，自然保留持续性。
- source_word: קְרָא לֵאמֹר
  choice: 你要宣告说
  rationale: קרא在先知语境中指公开传告；“宣告”保留传令性质，“说”对应לֵאמֹר并引出信息。
- source_word: כֹּה אָמַר
  choice: 如此说
  rationale: 保留希伯来先知书中庄重、固定的使者公式。
- source_word: יְהוָה צְבָאוֹת
  choice: 万军之耶和华
  rationale: “耶和华”对应神名，按现代中文圣经传统具有较高辨识度；“万军之”保留צְבָאוֹת所含天上或军事众军的意象，避免释为抽象的“全能”。
- source_word: קִנֵּאתִי
  choice: 我……大发嫉妒
  rationale: “嫉妒”保留קנא用于上帝时的盟约性张力，不弱化为单纯“热心”；与后面的同根名词合并为中文强化表达。
- source_word: לִירוּשָׁלִַם וּלְצִיּוֹן
  choice: 为耶路撒冷和锡安
  rationale: 介词ל在此表示关切所指向的对象，译作“为”；两个地名并列保留原文。
- source_word: קִנְאָה גְדוֹלָה
  choice: 大发
  rationale: 原文以同根动词和名词并用并加“大”来加强语气；“大发嫉妒”是自然而庄重的中文强化表达。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: “耶和华”在现代中文基督教读者中最具公共辨识度，也明确呈现专名；“雅威”更接近学界常用的拟音，但不据此改动正文。
- issue: 上帝的קנא / קנאה如何表达
  choice: 大发嫉妒
  alternative: 大有热忱／极其热切
  rationale: 原文明确使用兼具“嫉妒”和“热忱”语义的同一词根。正文保留“嫉妒”所呈现的盟约性和神学张力，不将其柔化；脚注交代另一可能语感。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。“万军之耶和华如此说”保留先知宣告的正式语体；“你要宣告说”明确命令语气。正文脚注标记[a]已置于相关表达之后。
