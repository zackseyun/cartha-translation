  text: ע֣וֹד קְרָ֣א לֵ/אמֹ֗ר כֹּ֤ה אָמַר֙ יְהוָ֣ה צְבָא֔וֹת ע֛וֹד תְּפוּצֶ֥ינָה עָרַ֖/י מִ/טּ֑וֹב וְ/נִחַ֨ם יְהוָ֥ה עוֹד֙ אֶת צִיּ֔וֹן וּ/בָחַ֥ר ע֖וֹד בִּ/ירוּשָׁלִָֽם׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/001/017.yaml
  text: 'Call out again[a], saying, ‘Thus says Yahweh of hosts: My cities will again overflow with prosperity, and Yahweh will again comfort Zion and again choose Jerusalem.’'
translation:
  language: zh_hans
  text: 你要再宣告说：“万军之雅威如此说：我的城邑必再因福祉而扩展[a]；雅威必再安慰锡安，再拣选耶路撒冷。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“必再满溢着福祉”，也可译“必再因美物而向外铺展”。
    reason: 原文动词可指散开、扩展，而“因福祉”这一短语也可能使整句话带有丰盛、充盈之意。
lexical_decisions:
- source_word: עוֹד
  choice: 再
  rationale: 该副词在本节反复出现，强调审判之后宣告、赐福、安慰和拣选的恢复与更新；“再”在现代汉语中简洁自然。
- source_word: קְרָא לֵאמֹר
  choice: 宣告说
  rationale: קְרָא是命令式，带有公开传达信息的意味；לֵאמֹר引出所宣告的话。“宣告说”既保留先知性语体，也符合现代汉语表达。
- source_word: כֹּה אָמַר
  choice: 如此说
  rationale: 保留希伯来先知信息中固定的使者公式，同时保持庄重、清晰。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以常见的现代汉语音译呈现四字神名，保留其作为专名的性质，而不以称号替代。
- source_word: צְבָאוֹת
  choice: 万军
  rationale: “万军之雅威”是庄重且易于理解的称号，能够表达天上众军与诸军势力的广泛含义。
- source_word: תְּפוּצֶינָה
  choice: 扩展
  rationale: 该动词基本意象是向外散开或铺展开来；在城邑蒙福复兴的语境中，“扩展”比“分散”自然，又没有把含义完全收窄为物质充盈。
- source_word: עָרַי
  choice: 我的城邑
  rationale: 明确保留第一人称单数词尾，表明这些城邑属于雅威；“城邑”适合先知书的庄重语域。
- source_word: מִטּוֹב
  choice: 因福祉
  rationale: טוֹב在此指有益的美善、丰盛和繁荣；介词מִן可表达扩展的原因。“福祉”兼顾物质兴盛与更广泛的恩惠。
- source_word: וְנִחַם
  choice: 必再安慰
  rationale: 在受审判后复兴的语境中，נחם表达安慰、抚慰；“安慰”直接保留其牧养性和关系性意味。
- source_word: וּבָחַר
  choice: 再拣选
  rationale: בחר表示选择；“拣选”保留其盟约语境中的庄重意味，但不进一步界定具体的系统神学含义。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。译作“雅威”能以专名形式呈现，并避免以称号“主”取代神名。
- issue: 雅威再次选择耶路撒冷的含义
  choice: 再拣选耶路撒冷
  alternative: 重新选择耶路撒冷；再次悦纳耶路撒冷
  rationale: 原文使用בחר，直接表达再次选择。“拣选”保留盟约性的张力，不将其解释为仅仅喜爱、悦纳，也不导入特定教派的拣选论。
- issue: 城邑因福祉而扩展的图景
  choice: 因福祉而扩展
  alternative: 满溢着福祉；因美物而向外铺展
  rationale: 动词与介词短语的组合可以侧重空间扩张，也可在语境中理解为丰盛充盈。正文采用贴近动词基本意象的译法，并用脚注保留其他合理理解。
translation_notes:
  register: 采用现代、庄重而易懂的先知书语体。“如此说”和“城邑”略具经典庄严感，但仍属现代标准汉语；句法避免过度古雅。脚注标记[a]已置于相关短语之后。
