- from: 大流士第二年八月，雅威[a]的话临到撒迦利亚，就是比利家的儿子、易多的孙子、那位先知，说：
  to: 大流士第二年，第八个月，雅威[a]的话临到撒迦利亚；他是比利家的儿子、易多的儿子，是先知。雅威说：
  rationale: 修订保留原文的纪年次序和两次“儿子”的谱系结构，避免把谱系关系过度具体化。“是先知”置于全名之后，以现代汉语自然表达 הַנָּבִיא，同时尽量不裁定其同位语范围。末尾“雅威说：”明确对应“说”，并自然引向下一节的直接引语。
