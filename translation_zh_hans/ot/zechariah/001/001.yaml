  text: בַּ/חֹ֨דֶשׁ֙ הַ/שְּׁמִינִ֔י בִּ/שְׁנַ֥ת שְׁתַּ֖יִם לְ/דָרְיָ֑וֶשׁ הָיָ֣ה דְבַר יְהוָ֗ה אֶל זְכַרְיָה֙ בֶּן בֶּ֣רֶכְיָ֔ה בֶּן עִדּ֥וֹ הַ/נָּבִ֖יא לֵ/אמֹֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/001/001.yaml
  text: In the eighth month[a], in the second year of Darius, the word of Yahweh came to Zechariah son of Berechiah, son of Iddo the prophet, saying,
translation:
  language: zh_hans
  text: 大流士第二年，第八个月，雅威[a]的话临到撒迦利亚；他是比利家的儿子、易多的儿子，是先知。雅威说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“耶和华”；希伯来文为神名 YHWH。
    reason: 说明神名的另一种中文译法，并交代原文形式。
lexical_decisions:
- source_word: בַּחֹדֶשׁ הַשְּׁמִינִי
  choice: 八月
  rationale: 这是以序数表示月份的纪年格式；“八月”是现代汉语自然、准确的表达。
- source_word: בִּשְׁנַת שְׁתַּיִם לְדָרְיָוֶשׁ
  choice: 大流士第二年
  rationale: 按君王在位年数纪年；“大流士第二年”符合现代汉语的历史纪年习惯。
- source_word: הָיָה דְבַר יְהוָה אֶל
  choice: 雅威的话临到
  rationale: 先知书常用的启示公式；“临到”既保留原文表达，又自然地传达神的话传给先知。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文辅音神名 YHWH 音译，保留其作为专名的性质，而不以头衔代替。
- source_word: זְכַרְיָה בֶּן בֶּרֶכְיָה בֶּן עִדּוֹ
  choice: 撒迦利亚，就是比利家的儿子、易多的孙子
  rationale: 采用通行中文人名，并把连续两个“儿子”关系按汉语亲属称谓自然表达为“儿子、孙子”。
- source_word: הַנָּבִיא
  choice: 那位先知
  rationale: 定冠词表明这是带限定的称谓；“那位先知”保留其在谱系之后作同位语的结构。
- source_word: לֵאמֹר
  choice: 说：
  rationale: 该词引出下一节的直接话语，汉语以“说：”自然衔接。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文使用神的专名 YHWH；正文采用“雅威”音译，并以脚注说明中文传统译名。
- issue: “先知”所指的人物
  choice: 在谱系之后译作“那位先知”
  alternative: 明确译作“先知撒迦利亚”或“先知易多”
  rationale: 原文把“那位先知”置于“易多”之后，但整个名称链以撒迦利亚为中心；不直接改排为“先知撒迦利亚”，以免完全消除修饰关系在形式上可能产生的张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“大流士第二年八月”保持纪年公式简洁；末尾“说：”显示本句延续至下一节。
