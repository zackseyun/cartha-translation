  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: רָאִ֣יתִי הַ/לַּ֗יְלָה וְ/הִנֵּה אִישׁ֙ רֹכֵב֙ עַל ס֣וּס אָדֹ֔ם וְ/ה֣וּא עֹמֵ֔ד בֵּ֥ין הַ/הֲדַסִּ֖ים אֲשֶׁ֣ר בַּ/מְּצֻלָ֑ה וְ/אַחֲרָי/ו֙ סוּסִ֣ים אֲדֻמִּ֔ים שְׂרֻקִּ֖ים וּ/לְבָנִֽים׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/001/008.yaml
  text: I saw in the night[a], and behold, a man riding on a red horse! He was standing among the myrtle trees that were in the ravine, and behind him were red, sorrel[b], and white horses.
translation:
  language: zh_hans
  text: 我在夜间看见：看哪，有一个人骑着一匹红马！他正站在洼地[a]的桃金娘树中间；在他后面还有红色、红褐色[b]和白色的马。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“深处”或“低陷处”；希伯来文所指很可能是一处低洼的地方。
    reason: lexical_alternative
  - marker: b
    text: 或译“杂色”“斑点色”；也可能指另一种偏红褐的马匹毛色。原文所指的确切颜色不确定。
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאִיתִי הַלַּיְלָה
  choice: 我在夜间看见
  rationale: רָאִיתִי是ראה的Qal完成式第一人称单数，直译为“我看见”；异象性质由上下文表达，不把动词扩译为“得了异象”。הַלַּיְלָה在这里自然表达夜间的场景。
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留希伯来文提示读者注意、使异象画面骤然展开的语篇功能，同时符合庄重的现代汉语表达。
- source_word: אִישׁ
  choice: 一个人
  rationale: 原词通常指男性个体；本节没有明说他的身份，因此不译作“天使”或其他带解释性的称谓。
- source_word: רֹכֵב עַל סוּס אָדֹם
  choice: 骑着一匹红马
  rationale: 自然而贴切地表达分词加介词עַל所描写的骑乘状态；אָדֹם明确表示红色。
- source_word: וְהוּא עֹמֵד
  choice: 他停在
  rationale: 分词描写异象中持续的静止状态。中文若说骑马的人“站在”某处，容易误解为已经下马，故用“停在”表达人与坐骑驻立不动的画面。
- source_word: בֵּין הַהֲדַסִּים
  choice: 桃金娘树中间
  rationale: הֲדַסִּים指myrtle，即桃金娘；בֵּין用于一丛树木时译作“中间”自然准确。
- source_word: בַּמְּצֻלָה
  choice: 洼地
  rationale: 该词表示深处、低陷之地；在此地貌语境中，“洼地”简洁自然，同时以脚注保留其他可能译法。
- source_word: וְאַחֲרָיו
  choice: 在他后面
  rationale: 按异象画面理解为空间位置，即其他马匹位于领头者后方。
- source_word: סוּסִים אֲדֻמִּים שְׂרֻקִּים וּלְבָנִים
  choice: 红色、红褐色和白色的马
  rationale: 首尾两个颜色词分别明确为红色和白色；שְׂרֻקִּים所指的具体毛色不确定，正文采用较可能且易懂的“红褐色”，脚注说明其他可能。
theological_decisions:
- issue: 红马骑士的身份
  choice: 仅译作“一个人”，不在本节指明其超自然或基督论身份。
  alternative: 译作“耶和华的使者”、象征性的骑士，或基督降生前的显现。
  rationale: 本节的希伯来文只称他为אִישׁ（“一个人”）。其身份应由后文逐步呈现，不宜把后续解释或特定神学认定直接写进本节。
- issue: וְהוּא עֹמֵד所描写的对象和姿态
  choice: 以“他停在”承接前述骑马的人，同时避免暗示他已经下马。
  alternative: 译作“他站在”，或把静止状态明确归于马。
  rationale: 语法上的阳性单数代词承接“一个人”最自然，但骑乘场景中的“站着”在意义上也涉及坐骑。译作“停在”保留整个骑乘者驻立的画面，不作过度细分。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“看哪”保留异象叙事的突显语气；“桃金娘树”使用现代植物名称；句式尽量贴近希伯来文画面的展开，同时避免生硬直译。英文咨询层把脚注[a]误置于“夜间”之后，但脚注内容实际对应בַּמְּצֻלָה，因此本稿将[a]正确标在“洼地”之后。
