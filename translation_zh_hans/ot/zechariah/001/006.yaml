id: ZEC.1.6
reference: Zechariah 1:6
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אַ֣ךְ דְּבָרַ֣/י וְ/חֻקַּ֗/י אֲשֶׁ֤ר צִוִּ֨יתִי֙ אֶת עֲבָדַ֣/י הַ/נְּבִיאִ֔ים הֲ/ל֥וֹא הִשִּׂ֖יגוּ אֲבֹתֵי/כֶ֑ם וַ/יָּשׁ֣וּבוּ וַ/יֹּאמְר֗וּ כַּ/אֲשֶׁ֨ר זָמַ֜ם יְהוָ֤ה צְבָאוֹת֙ לַ/עֲשׂ֣וֹת לָ֔/נוּ כִּ/דְרָכֵ֨י/נוּ֙ וּ/כְ/מַ֣עֲלָלֵ֔י/נוּ כֵּ֖ן עָשָׂ֥ה אִתָּֽ/נוּ׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/001/006.yaml
  text: But did not my words and my statutes[a], which I commanded my servants the prophets, overtake your fathers? Then they turned back and said, ‘As Yahweh of Armies planned to do to us, according to our ways and according to our deeds[c][b], so he has dealt with us.’
translation:
  language: zh_hans
  text: 然而，我的话和我的律例，就是我吩咐我仆人——众先知的，岂没有追上你们的祖先吗？于是他们回转[a]，说：‘万军之耶和华[b]定意要怎样照我们的行径和所作所为对待我们，他就怎样对待了我们。’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “回转”也可译作“悔改”。希伯来语动词既可表示转回、返回，也可在此类语境中表示悔改。
    reason: 保留词义及神学上的歧义。
  - marker: b
    text: “耶和华”也常按现代重构读音译作“雅威”；“万军之耶和华”传统上也译作“万军之主”。
    reason: 说明神名及称号的主要译法。
lexical_decisions:
- source_word: אַךְ
  choice: 然而
  rationale: 承接上文“人会过去”与“上帝的话和律例必追上人”的对比；“然而”在现代汉语中庄重而自然。
- source_word: דְּבָרַי וְחֻקַּי
  choice: 我的话和我的律例
  rationale: 分别保留“话语”和所颁定之规条两个相关但有区别的概念。
- source_word: צִוִּיתִי אֶת־עֲבָדַי הַנְּבִיאִים
  choice: 我吩咐我仆人众先知的
  rationale: 贴近希伯来语直接宾语结构，即上帝吩咐先知；不在正文中加入解释性的“借着”。
- source_word: הִשִּׂיגוּ
  choice: 追上
  rationale: 保留原文中追赶并赶上的鲜明比喻，表达上帝所宣告的审判最终临到祖先。
- source_word: וַיָּשׁוּבוּ
  choice: 于是他们回转
  rationale: 保留 שׁוב 的空间性意象及其可能的悔改含义，不把正文明确限定为内在悔改。
- source_word: זָמַם
  choice: 定意
  rationale: 表达经过意志决定的筹划，比单纯“想要”更符合语境，又不添加原文没有的细节。
- source_word: יְהוָה צְבָאוֹת
  choice: 万军之耶和华
  rationale: 以“耶和华”呈现圣名，以汉语传统且可理解的“万军”表达 צְבָאוֹת 的军旅及天上众军意象。
- source_word: כִדְרָכֵינוּ וּכְמַעֲלָלֵינוּ
  choice: 照我们的行径和所作所为
  rationale: “行径”体现 דֶּרֶךְ 在道德语境中的生活行为，“所作所为”自然表达 מַעֲלָלִים 所指带道德分量的行为。
- source_word: כֵּן עָשָׂה אִתָּנוּ
  choice: 他果然就怎样对待了我们
  rationale: 用自然汉语呈现对应结构，并以“果然”传达 כֵּן 所表示的应验吻合。
theological_decisions:
- issue: וַיָּשׁוּבוּ 是否明确译为悔改
  choice: 于是他们回转
  alternative: 于是他们悔改
  rationale: 该动词既可表示返回、回转，也可在语境中表示悔改。正文保留其意象和歧义，脚注说明可能的悔改含义，避免断定其内在属灵状态。
- issue: 神圣名字 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文明确使用四字神名。正文采用普通中文读者最熟悉、且作为专名处理的“耶和华”；“雅威”是按现代学界常见重构音译的替代译法。
- issue: 祖先所承认的是审判与其行为相称
  choice: 照我们的行径和所作所为对待我们
  alternative: 按我们的道路和行为向我们施行
  rationale: 保留原文因人的行为而有相应处置的表述，不额外界定其系统神学性质。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“追上”刻意保留原文比喻；引语以对应句式呈现上帝的定意与实际处置。正文中的脚注标记均与脚注对应。
