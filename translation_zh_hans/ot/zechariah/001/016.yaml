base_translation:
  language: en
  yaml_path: translation/ot/zechariah/001/016.yaml
  text: 'Therefore, thus says the LORD: I have returned to Jerusalem with compassion; my house will be built in her, declares the LORD of hosts, and a measuring line will be stretched out over Jerusalem.'
translation:
  language: zh_hans
  text: 所以，耶和华如此说：“我已怀着怜悯回到耶路撒冷。我的殿必在其中建造；这是万军之耶和华的宣告。准绳必拉在耶路撒冷之上。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָכֵן
  choice: 所以
  rationale: 自然表达承接上文的因果关系。
- source_word: שַׁבְתִּי
  choice: 我已……回到
  rationale: 保留完成式所表达的确定行动，并用现代汉语自然呈现。
- source_word: בְּרַחֲמִים
  choice: 怀着怜悯
  rationale: 介词短语可表示伴随的态度或方式；此译保留耶和华以怜悯转向耶路撒冷的含义。
- source_word: בֵּיתִי
  choice: 我的殿
  rationale: 在耶路撒冷复建语境中，‘我的家/房屋’特指耶和华的圣殿，译作‘殿’清楚而不失庄重。
- source_word: בָּהּ
  choice: 在其中
  rationale: 阴性代词回指耶路撒冷；汉语城市通常不以‘她’指称，‘其中’既准确又自然。
- source_word: נְאֻם יְהוָה צְבָאוֹת
  choice: 这是万军之耶和华的宣告
  rationale: 将先知宣告公式译为自然、庄重的现代汉语，同时保留神圣称号。
- source_word: וְקָו יִנָּטֶה
  choice: 准绳必拉
  rationale: קָו 是建造时用于丈量、校准的绳线；‘准绳’能体现重建工程的语境，被动式则以‘必拉’自然表达。
theological_decisions:
- issue: ‘回到耶路撒冷’的完成式与圣殿将来重建之间的时态张力
  choice: ‘我已……回到’与‘必……重建’并列保留
  alternative: 统一译作将来时，如‘我必回到……我的殿必重建’
  rationale: 希伯来文本明确以完成式 שַׁבְתִּי 陈述回归，而以未完成式表达建殿和拉准绳；保留这种张力，避免将神的临在与后续工程合并解释。
- issue: ‘准绳拉在耶路撒冷之上’的象征意义
  choice: 直译为重建丈量的图景
  alternative: 释义为‘耶路撒冷必被重建’或理解为审判的量度
  rationale: 本节上下文倾向复兴与重建，但原文仍使用具体意象；正文不把象征意义完全释明，以免消除其诗性和潜在张力。
- issue: 神名 יהוה 的呈现
  choice: 耶和华
  alternative: 上主
  rationale: 采用现代简体中文圣经读者熟悉的专名形式，并与‘万军之耶和华’称号保持一致。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。保留先知宣告的节奏，以引号标明直接话语，并把宣告公式置于句末。避免以‘她’拟人化城市，也不额外解释准绳的神学象征。
