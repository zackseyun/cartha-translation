  yaml_path: translation/ot/zechariah/001/005.yaml
  text: Your fathers—where are they? And the prophets[a], do they live forever?
translation:
  language: zh_hans
  text: 你们的祖先[a]在哪里？那些先知会永远活着吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“你们的父辈”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲבֹתֵיכֶם
  choice: 你们的先祖
  rationale: 该词字面为“你们的父辈”，在这里指听众以前的世代；“先祖”在现代汉语中自然、明确，也保留了代际指向。
- source_word: אַיֵּה הֵם
  choice: 在哪里呢
  rationale: 疑问副词与强调性第三人称复数代词合用；汉语不必另译“他们”，句末“呢”自然呈现追问语气。
- source_word: וְהַנְּבִאִים
  choice: 那些先知
  rationale: 定冠词所指的是语境中已知的先知群体；“那些”在汉语中承接前一问并保持两组人物的并列。
- source_word: הַלְעוֹלָם
  choice: 永远
  rationale: 介词与该名词在疑问句中表达无限延续，即“永远”。
- source_word: יִחְיוּ
  choice: 岂能……活着吗
  rationale: Qal未完成式第三人称阳性复数在此构成反问，询问先知是否会一直活着；“岂能……吗”准确传达预期否定的修辞力量，而不限定为单纯将来时。
theological_decisions:
- issue: “先知”所指及反问的神学作用
  choice: 本节强调先祖和先知同属必死的人，并以反问为下一节作铺垫。
  alternative: 只把两问看作对已死先祖与昔日先知的并列询问，不突出人的必死性。
  rationale: 希伯来文本直接追问先知是否永远活着，答案显然是否定的；但本节本身没有明说先知的信息是否长存，因此不把下一节关于上帝话语的结论提前译入。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“先祖”比字面的“父辈”更能涵盖此前各代；两个问句保留希伯来文的修辞并列。正文中的[a]与脚注标记一致。
