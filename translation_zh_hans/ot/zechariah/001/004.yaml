source:
  edition: WLC
  text: אַל תִּהְי֣וּ כַ/אֲבֹֽתֵי/כֶ֡ם אֲשֶׁ֣ר קָרְאֽוּ אֲלֵי/הֶם֩ הַ/נְּבִיאִ֨ים הָ/רִֽאשֹׁנִ֜ים לֵ/אמֹ֗ר כֹּ֤ה אָמַר֙ יְהוָ֣ה צְבָא֔וֹת שׁ֤וּבוּ נָא֙ מִ/דַּרְכֵי/כֶ֣ם הָ/רָעִ֔ים ו/מעלילי/כם הָֽ/רָעִ֑ים וְ/לֹ֥א שָׁמְע֛וּ וְ/לֹֽא הִקְשִׁ֥יבוּ אֵלַ֖/י נְאֻם יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/001/004.yaml
  text: 'Do not be like your fathers[a], to whom the former prophets proclaimed, saying, “Thus says Yahweh of hosts: Turn back, please, from your evil ways and your evil deeds.” But they did not listen or pay attention to me, declares Yahweh.'
translation:
  language: zh_hans
  text: 不要像你们的父辈[a]；从前的先知曾向他们宣告说：“万军之耶和华如此说：请回头，离开你们邪恶的道路和邪恶的行为。”可是他们不听，也不留心听我。这是耶和华的宣告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“祖先”。希伯来文直译为“你们的父亲们”，这里指先前的世代。
    reason: 说明字面形式及上下文中的广义所指。
lexical_decisions:
- source_word: אַל תִּהְיוּ
  choice: 不要像
  rationale: אַל加未完成式在此构成禁令；与后面的比较介词连译为“不要像”，最符合现代汉语表达。
- source_word: כַאֲבֹתֵיכֶם
  choice: 像你们的父辈
  rationale: אָבוֹת字面为“父亲们”，此处指先前世代；“父辈”既保留男性复数的形式痕迹，也自然表达历代先人之意。
- source_word: קָרְאוּ אֲלֵיהֶם
  choice: 曾向他们宣告
  rationale: קרא可指呼喊或宣告；其后紧接先知信息的直接引语，因此“宣告”贴合正式的先知传信语境。
- source_word: הַנְּבִיאִים הָרִאשֹׁנִים
  choice: 从前的先知
  rationale: הָרִאשֹׁנִים在此表示时间上较早；“从前的先知”清楚自然，并避免读成特定的正典分类术语。
- source_word: כֹּה אָמַר יְהוָה צְבָאוֹת
  choice: 万军之耶和华如此说
  rationale: 保留标准的先知使者公式；“万军之耶和华”传达יהוה צבאות，并以“耶和华”音译神名。
- source_word: שׁוּבוּ נָא
  choice: 请回头
  rationale: שוב在劝人悔改的语境中兼有返回和转离原路之意；נָא表达恳请语气，故译“请”，不把它误解为单纯的时间副词“现在”。
- source_word: מִדַּרְכֵיכֶם הָרָעִים
  choice: 离开你们邪恶的道路
  rationale: דֶּרֶךְ可比喻生活方式和行径；“道路”保留原文意象，“离开”自然承接“回头”及介词מִן。
- source_word: וּמַעֲלִילֵיכֶם הָרָעִים
  choice: 和邪恶的行为
  rationale: מַעֲלָלִים指行为、作为或惯常行径；“行为”是现代汉语中准确而易懂的表达。
- source_word: וְלֹא שָׁמְעוּ
  choice: 可是他们不听
  rationale: שמע可指听见、听从或服从；“不听”保留听与听从之间的语义张力，不直接扩译为“不顺服”。
- source_word: וְלֹא הִקְשִׁיבוּ אֵלַי
  choice: 也不留心听我
  rationale: הקשיב表示专心听、留意或侧耳听；“留心听我”保留其听觉意象和第一人称宾语。
- source_word: נְאֻם יְהוָה
  choice: 这是耶和华的宣告
  rationale: נְאֻם是确认神谕权威的公式；译为独立句既庄重清楚，也与前面的“如此说”有所区别。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。中文正文采用读者广泛熟悉的专名“耶和华”，不以“主”替代，从而保留这是神的专名这一点；“雅威”是按现代学术重构读音的可行替代。
- issue: אָבוֹת指“父辈”还是泛指“祖先”
  choice: 父辈
  alternative: 祖先
  rationale: 原词为阳性复数，字面指“父亲们”，在上下文中泛指先前世代。“父辈”在正文中兼顾原文形式和实际所指，并以脚注说明其较广含义。
- issue: שמע是否明确译成“顺服”
  choice: 不听
  alternative: 不听从／不顺服
  rationale: 该词可包含服从含义，但又与表示留心的הקשיב并列。译作“不听”保留听闻、听从和拒绝回应之间的张力，不把含义收窄为单一的伦理术语。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“万军之耶和华如此说”和“这是耶和华的宣告”保留先知文体的公式感；其余句法适度汉语化，避免古奥措辞。
