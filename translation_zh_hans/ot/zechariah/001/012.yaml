source:
  edition: WLC
  text: וַ/יַּ֣עַן מַלְאַךְ יְהוָה֮ וַ/יֹּאמַר֒ יְהוָ֣ה צְבָא֔וֹת עַד מָתַ֗י אַתָּה֙ לֹֽא תְרַחֵ֣ם אֶת יְרוּשָׁלִַ֔ם וְ/אֵ֖ת עָרֵ֣י יְהוּדָ֑ה אֲשֶׁ֣ר זָעַ֔מְתָּה זֶ֖ה שִׁבְעִ֥ים שָׁנָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/001/012.yaml
  text: Then the angel of Yahweh answered and said[a], “O Yahweh of hosts, how long will you have no compassion on Jerusalem and on the cities of Judah[c][b], against which you have been angry these seventy years?”
translation:
  language: zh_hans
  text: 耶和华的天使[a]回应说：“万军之耶和华啊，你不怜悯耶路撒冷和犹大的城邑，还要到几时呢？你向它们发怒，已经七十年了。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “天使”也可译作“使者”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: 耶和华的天使
  rationale: מַלְאַךְ既可指“使者”，也可指“天使”；在先知异象中译作“天使”最自然，同时以脚注保留词义上的另一可能。
- source_word: יְהוָה צְבָאוֹת
  choice: 万军之耶和华
  rationale: 保留צְבָאוֹת所表达的众军、军旅意象，并采用庄重而通行的现代汉语称号。
- source_word: וַיַּעַן וַיֹּאמַר
  choice: 回应说
  rationale: 希伯来语以“回答并说”引出回应；“回应说”既自然，也保留对话中的应答性质。
- source_word: עַד מָתַי
  choice: 还要到几时呢
  rationale: 这是哀诉和代求中常见的时限问句；加入“还要”准确传达持续至今的语气。
- source_word: לֹא תְרַחֵם
  choice: 不怜悯
  rationale: רחם表示怜悯、同情；“不怜悯”简洁保留原文的否定形式及神学分量。
- source_word: אֶת יְרוּשָׁלִַם וְאֵת עָרֵי יְהוּדָה
  choice: 耶路撒冷和犹大的城邑
  rationale: 两者都是“怜悯”的对象；汉语无需重复介词，关系仍清楚。“城邑”兼具庄重感与可懂度。
- source_word: אֲשֶׁר זָעַמְתָּה
  choice: 你向它们发怒
  rationale: זעם表达愤怒、震怒或忿恨；“发怒”是自然现代汉语，并明确耶路撒冷和犹大诸城是怒气所向。
- source_word: זֶה שִׁבְעִים שָׁנָה
  choice: 已经七十年了
  rationale: 该表达指延续到说话当下的七十年；“已经……了”自然传达这一持续时段和指示语气。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 现代简体中文圣经语境中“耶和华”是广为人知的专名形式，可明确呈现四字神名，而不以“主”取代。
- issue: מַלְאַךְ יְהוָה所指者的身份
  choice: 耶和华的天使
  alternative: 耶和华的使者
  rationale: 正文按异象语境译作“天使”，但不进一步断定其本体身份；脚注保留“使者”这一真实词义可能，避免导入经文本身未说明的教义认定。
- issue: 神的怜悯与发怒之间的张力
  choice: 同时直陈“不怜悯”与“发怒”
  alternative: 将前者弱化为“尚未施恩”，或将后者解释为惩罚
  rationale: 原文以代求问句并置神暂不怜悯和持续发怒，不宜在译文中淡化或解释性消解这一张力。
translation_notes:
  register: 采用现代、庄重且容易理解的普通话。“万军之耶和华”“城邑”保留经文称号和先知文体的庄严感；其余句法尽量自然流畅。
