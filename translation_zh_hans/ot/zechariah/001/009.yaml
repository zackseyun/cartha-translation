  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וָ/אֹמַ֖ר מָה אֵ֣לֶּה אֲדֹנִ֑/י וַ/יֹּ֣אמֶר אֵלַ֗/י הַ/מַּלְאָךְ֙ הַ/דֹּבֵ֣ר בִּ֔/י אֲנִ֥י אַרְאֶ֖/ךָּ מָה הֵ֥מָּה אֵֽלֶּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/001/009.yaml
  text: Then I said[a], “What are these, my lord?” And the angel who was speaking with me said to me[b], “I will show you what these are.”
translation:
  language: zh_hans
  text: 于是我问：“我主[a]，这些是什么？”那位与我说话的天使对我说[b]：“我要指给你看这些是什么。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “我主”也可译作“先生”或“大人”；这里的希伯来语是表示尊敬的称呼，并不是上帝的名号。
    reason: lexical_alternative
  - marker: b
    text: “与我说话的”，直译是“在我里面说话的”；这里是指天使在异象中与先知交谈。
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר
  choice: 于是我问
  rationale: 该叙事性动词承接上文并推进事件；因后接疑问句，现代汉语用“问”比直译“说”更自然，“于是”保留其顺承作用。
- source_word: מָה אֵלֶּה
  choice: 这些是什么
  rationale: מָה与指示词אֵלֶּה构成辨识性问句；“这些是什么”简洁自然，无须补出“东西”。
- source_word: אֲדֹנִי
  choice: 我主
  rationale: 此处是先知对解说异象之天使的敬称，并非神名；“我主”保留אדון的尊称意味与庄重语体，同时以脚注防止读者误解为对上帝的称呼。
- source_word: הַמַּלְאָךְ
  choice: 天使
  rationale: מַלְאָךְ本可指使者，但在异象中这位角色负责与先知交谈并解说，译作“天使”最符合语境和通行的圣经用语。
- source_word: הַדֹּבֵר בִּי
  choice: 与我说话的
  rationale: 介词בְּ字面可作“在……里面”，但这是撒迦利亚书中描述天使与先知沟通的惯用表达；汉语译作“与我说话”可准确表达对话关系。
- source_word: אֲנִי אַרְאֶךָּ
  choice: 我要指给你看
  rationale: ראה的使役形表示“使……看见、指给……看”；“我要指给你看”既保留视觉性，也自然体现明确的第一人称应答。
- source_word: מָה הֵמָּה אֵלֶּה
  choice: 这些是什么
  rationale: 原文以显式代词הֵמָּה复述先知的问题；汉语若逐词重复会显得累赘，译为“这些是什么”保留所问内容而行文自然。
theological_decisions:
- issue: אֲדֹנִי所指对象及称呼力度
  choice: 译作“我主”，理解为对解说异象之天使的敬称
  alternative: 可译“先生”或“大人”，也有人可能将“我主”误读为神圣称号
  rationale: 上下文明确是先知向与他交谈的天使发问；译文保留敬称的庄重与词源联系，但脚注说明这不是上帝的名号，避免把该天使与耶和华作出经文本身未作的等同。
- issue: הַדֹּבֵר בִּי中בִּי的意义
  choice: 按语境译为“与我说话”
  alternative: 较字面的“在我里面说话”
  rationale: 本书反复使用这一表达描述天使与先知的沟通。若译为“在我里面说话”，容易引入内在启示或附体式发言的观念，而异象场景呈现的是对话。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“于是”体现希伯来叙事的顺承关系；“我主”维持原文敬称力度，并由脚注消除神学误读；整体避免生硬逐词对应。
