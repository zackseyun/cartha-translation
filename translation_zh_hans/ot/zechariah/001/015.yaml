base_translation:
  language: en
  yaml_path: translation/ot/zechariah/001/015.yaml
  text: And I am exceedingly angry with the nations that are at ease[a]; for I was only a little angry[d][c][b], but they helped forward the disaster.
translation:
  language: zh_hans
  text: 我对那些安逸的列国极其恼怒[a]；因为我不过稍微发怒[b]，他们却助长了祸害[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “安逸的”也可译作“自满安逸的”。
    reason: lexical_alternative
  - marker: b
    text: “不过稍微发怒”也可理解为“只发怒片刻”；希伯来语可指程度有限，也可指时间短暂。
    reason: alternative_reading
  - marker: c
    text: 直译可作“他们帮助作恶”；这里指他们助长、加剧了祸害。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקֶצֶף גָּדוֹל אֲנִי קֹצֵף
  choice: 我极其恼怒
  rationale: 名词“盛怒”与形容词“大”加强后面的分词“恼怒”；汉语用程度副词表达，既自然，也保留神当前强烈愤怒的语气。
- source_word: עַל הַגּוֹיִם
  choice: 那些列国
  rationale: 此处指压迫犹大的外邦国家；“列国”直接而庄重，又不引入后期宗教身份术语。
- source_word: הַשַּׁאֲנַנִּים
  choice: 安逸的
  rationale: 原词表示安稳、无忧的状态，并可能含自满意味；正文采用较少解释性的“安逸”，让语境传达负面色彩。
- source_word: קָצַפְתִּי מְעָט
  choice: 我只是稍微发怒
  rationale: מְעָט可指程度小，也可能指时间短；上下文与列国加重灾祸形成程度上的鲜明对比，故正文采用“稍微”，同时以脚注保留时长解释。
- source_word: וְהֵמָּה
  choice: 他们却
  rationale: 独立代词具有强调作用；“却”自然呈现神有限的怒气与列国行为之间的反差。
- source_word: עָזְרוּ לְרָעָה
  choice: 加重了灾祸
  rationale: 字面为“帮助趋向祸害”，语境指列国促成并扩大伤害；“加重了灾祸”简洁地表达其主动助长恶果的含义。
theological_decisions:
- issue: 神的怒气与列国责任之间的关系
  choice: 经文将神对其子民有限度的怒气，与列国加重灾祸的行为相对照。
  alternative: 列国只是执行神的审判，并未越过其限度。
  rationale: “我只是……他们却……”的对比结构突出列国对灾祸的助长，因此既不淡化神的主动作为，也不免除列国的责任。
- issue: מְעָט所限定的是程度还是时长
  choice: 正文理解为怒气程度较小。
  alternative: 可理解为神发怒的时间较短。
  rationale: 程度解释更贴合本节前后分句的对比，但希伯来语本身容许时长解释，故在脚注中保留。
translation_notes:
  register: 采用现代、庄重而清楚的普通话。“极其恼怒”保留原文强烈情绪；“列国”符合先知书语域；分号与“因为……却……”清楚呈现因果和对比。所有脚注标记均置于相应正文词句之后。
