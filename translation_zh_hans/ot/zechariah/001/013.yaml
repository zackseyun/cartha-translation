  text: וַ/יַּ֣עַן יְהוָ֗ה אֶת הַ/מַּלְאָ֛ךְ הַ/דֹּבֵ֥ר בִּ֖/י דְּבָרִ֣ים טוֹבִ֑ים דְּבָרִ֖ים נִחֻמִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/001/013.yaml
  text: And Yahweh answered the angel who was speaking with me with good words[b][a], comforting words.
translation:
  language: zh_hans
  text: 雅威就用美好的话[a]、安慰的话，回答那位与我说话的天使[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“好话”。“美好的话”和“安慰的话”也可合译为“美好的安慰之言”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“那位与我说话的天使”，指在撒迦利亚的异象中与他交谈并为他解说的天使。
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַן
  choice: 回答
  rationale: ענה在此叙事语境中表示回应、作答；“回答”保留了异象中的对话关系，也符合现代汉语表达。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文四字神名的常见现代汉语音译处理，保留其作为上帝专名的性质，不以称号替代。
- source_word: הַמַּלְאָךְ
  choice: 天使
  rationale: מלאך可指“使者”或“天使”；本节处于撒迦利亚的异象语境，所指是超自然使者，因此译为“天使”。
- source_word: הַדֹּבֵר בִּי
  choice: 那位与我说话的
  rationale: 分词דֹּבֵר体现持续进行的交谈；介词ב在这里表达与先知交谈，译文保留了这种持续而互动的关系。
- source_word: דְּבָרִים טוֹבִים
  choice: 美好的话
  rationale: 直译其正面而宽广的含义，既可指内容良善，也可指带着善意或有利的信息，同时保留原文“话”的重复。
- source_word: דְּבָרִים נִחֻמִים
  choice: 安慰的话
  rationale: נחם词族表达安慰、慰藉；此译自然清楚，并与前面的“美好的话”构成原文式的并列或同位关系。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较贴近其通常重构的读音，并明确保留专名性质。
- issue: “美好的话”与“安慰的话”的关系
  choice: 以并列短语呈现，不明确判定二者是同位解释还是两类话语
  alternative: 美好的话，也就是安慰的话
  rationale: 希伯来文连续两次使用דְּבָרִים，既可理解为同位说明，也可视作并列强化；译文保留这种修辞与解释空间。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语；保留原文两次“话”的重复以及两个短语之间可能是并列、也可能是同位解释的张力。
