  text: קָצַ֧ף יְהוָ֛ה עַל אֲבֽוֹתֵי/כֶ֖ם קָֽצֶף־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/001/002.yaml
  text: Yahweh was very angry with your fathers[a].
translation:
  language: zh_hans
  text: 雅威曾对你们的祖先极其愤怒。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “祖先”直译为“父辈”或“父亲们”，这里指你们以前的世代。
    reason: 保留 אֲבֹתֵיכֶם 的字面形式及其语境含义。
lexical_decisions:
- source_word: קָצַף ... קָצֶף
  choice: 极其愤怒
  rationale: 动词 קָצַף 后接同根名词 קָצֶף，构成强调表达，字面近似“发怒，怒气”；译作“极其愤怒”既体现强调语气，也符合现代汉语习惯。
- source_word: יְהוָה
  choice: 雅威
  rationale: 原文直接使用四字神名；“雅威”按其通行拟音保留专名性质，不以称号替代。
- source_word: עַל
  choice: 对
  rationale: 与表示愤怒的词连用时，עַל 标明怒气所针对的对象；“对……愤怒”是自然、准确的现代汉语表达。
- source_word: אֲבֹתֵיכֶם
  choice: 你们的祖先
  rationale: 该词字面为“你们的父辈／父亲们”，在先知话语中指听众以前的世代；正文译作“祖先”可自然表达此处的群体历史含义，并以脚注保留字面形式。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 此处原文使用以色列上帝的专名，而非“主”这一称号；采用“雅威”保留专名，并较直接地反映学界通常接受的读音。
- issue: 同根词强调结构的表达
  choice: 极其愤怒
  alternative: 发怒，满有怒气
  rationale: 原文的动词与同根名词叠用，强调雅威怒气之强烈；采用程度副词传达其力度，同时避免把希伯来语结构生硬照搬成不自然的汉语。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“极其愤怒”传达原文同根词叠用的强烈语气；“曾”点明所述为过去发生的事。
