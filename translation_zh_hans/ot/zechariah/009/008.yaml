base_translation:
  language: en
  yaml_path: translation/ot/zechariah/009/008.yaml
  text: And I will encamp at my house as a guard[a], so that none may pass to and fro, and no oppressor will pass over them again[c][b]; for now I have seen with my own eyes.
translation:
  language: zh_hans
  text: 我要为我的家安营，作为守备[a]，以防有人往来经过[b]；欺压者[c]必不再从他们那里经过，因为如今我已经亲眼看见。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “守备”也可译作“守卫”或“岗哨”；原词指驻扎的守卫、岗哨或守备力量。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“从那经过的和那返回的而来”，可能指敌对力量向两个方向往返通行。
    reason: lexical_alternative
  - marker: c
    text: “欺压者”也可译作“征敛者”或“监工”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְחָנִיתִי לְבֵיתִי
  choice: 我要为我的家安营
  rationale: חנה意为“安营”；לְבֵיתִי直译“为我的家”，既表达保护之意，也保留“我的家”可能指圣殿或与耶和华之殿相关群体的开放性。
- source_word: מִצָּבָה
  choice: 驻守
  rationale: 该词指驻扎的守卫、岗哨或守备力量。“安营驻守”在现代汉语中自然，并保留军事防卫的意象。
- source_word: מֵעֹבֵר וּמִשָּׁב
  choice: 防备来往经过的人
  rationale: 原文以“经过者”和“返回者”描写两个方向的移动，语境可能指敌军往返通行；译文保留人物与往返动态，但不明确限定为某一支军队。
- source_word: וְלֹא יַעֲבֹר עֲלֵיהֶם עוֹד
  choice: 必不再经过他们
  rationale: 保留עבר“经过、越过”与前句的词语呼应；在军事语境中可含越境、横行或蹂躏之意，但正文不把这一形象改写得过窄。
- source_word: נֹגֵשׂ
  choice: 欺压者
  rationale: 该分词可指驱使者、征敛者或压迫者。“欺压者”涵盖政治、军事和经济压迫，且为普通读者易懂。
- source_word: כִּי עַתָּה רָאִיתִי בְעֵינָי
  choice: 因为如今我已经亲眼看见
  rationale: כִּי引出应许保护的理由；“亲眼看见”自然传达בְעֵינָי所强调的直接察看。
theological_decisions:
- issue: “我的家”的所指
  choice: 正文保留“我的家”，不限定为圣殿或百姓中的某一个所指
  alternative: 明确译作“我的圣殿”，或广义改写为“我的子民”
  rationale: “家”可唤起圣殿，也可能涵盖属于耶和华的群体；后文复数“他们”使广义关联成为可能。保留原文措辞可避免消解这一张力。
- issue: 耶和华“亲眼看见”的对象
  choice: 不补出具体宾语
  alternative: 补译为看见百姓的苦难、敌人的暴行或当下局势
  rationale: 原文没有明说所看见的对象；正文保留省略，避免替经文确定单一解释。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“安营驻守”保留先知话语中的军事保护意象；分号呈现保护行动与欺压终止之间的推进关系。所有代词均依原文保留，不擅自明确“他们”的具体范围。
