source:
  edition: WLC
  text: וְ/הִכְרַתִּי רֶ֣כֶב מֵ/אֶפְרַ֗יִם וְ/סוּס֙ מִ/יר֣וּשָׁלִַ֔ם וְ/נִכְרְתָה֙ קֶ֣שֶׁת מִלְחָמָ֔ה וְ/דִבֶּ֥ר שָׁל֖וֹם לַ/גּוֹיִ֑ם וּ/מָשְׁל/וֹ֙ מִ/יָּ֣ם עַד יָ֔ם וּ/מִ/נָּהָ֖ר עַד אַפְסֵי אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/009/010.yaml
  text: And I will cut off the chariot from Ephraim and the horse from Jerusalem[a], and the battle bow will be cut off; and he will speak peace to the nations, and his dominion will be from sea to sea[b], and from the River to the ends of the earth.
translation:
  language: zh_hans
  text: “我要从以法莲除掉战车，从耶路撒冷除掉战马；争战的弓也必被除掉。他必向列国宣告和平；他的统治必从海到海，从大河[a]直到地极。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “大河”很可能指幼发拉底河。
    reason: cultural_note
lexical_decisions:
- source_word: וְהִכְרַתִּי
  choice: 我要……除掉
  rationale: 使役形在这里表示除去、消灭；“除掉”既保留其力度，也不额外限定毁灭的方式。
- source_word: רֶכֶב
  choice: 战车
  rationale: 单数在此具有集合意义；“战车”自然地指军事战车力量。
- source_word: מֵאֶפְרַיִם
  choice: 从以法莲
  rationale: 直译介词结构，并保留“以法莲”作为北方地区或北国代表的地理政治含义。
- source_word: וְסוּס מִירוּשָׁלִַם
  choice: 从耶路撒冷除掉战马
  rationale: “马”在上下文中是军用马匹，译作“战马”显明军事语境；重复“除掉”使汉语平行结构清楚。
- source_word: וְנִכְרְתָה
  choice: 也必被除掉
  rationale: 保留与前句同一词根的重复，并体现被动意义。
- source_word: קֶשֶׁת מִלְחָמָה
  choice: 争战的弓
  rationale: 贴近希伯来语属格结构，指用于战争的弓，同时保持庄重的先知文体。
- source_word: וְדִבֶּר שָׁלוֹם
  choice: 他必……宣告和平
  rationale: דבר 的加强词干可表示说出或宣告；“宣告和平”在现代汉语中自然，并保留和平作为所说内容。
- source_word: לַגּוֹיִם
  choice: 向列国
  rationale: 指广泛的各国各族，不采用后来带有技术性宗教含义的“外邦人”。
- source_word: וּמָשְׁלוֹ
  choice: 他的统治
  rationale: 原文是带第三人称后缀的名词“他的统治/统治权”，不是有限动词；此译保留名词结构。
- source_word: מִיָּם עַד יָם
  choice: 从这海直到那海
  rationale: 既传达“从海到海”的广阔范围，又以自然汉语表达两端之间的延伸。
- source_word: וּמִנָּהָר עַד אַפְסֵי אָרֶץ
  choice: 从大河直到地极
  rationale: “大河”保留圣经地理称谓而不在正文中过度明确；“地极”简洁传达大地尽头的普世范围。
theological_decisions:
- issue: “他必宣告”及“他的统治”中第三人称单数所指
  choice: 按人称表达，指向前一节所述将要来到的王
  alternative: 采用非人称表达，如“和平必被宣告”或“统治必延伸”
  rationale: 经文由上帝第一人称的“我要除掉”转为第三人称单数，最自然地承接9节的王；保留“他”和“他的”呈现王权图景，却不加入经文本身未说明的后期教义细节。
- issue: 这位王统治的范围
  choice: 保留“从这海直到那海……直到地极”所表达的普世广度
  alternative: 将其限制性解释为仅指古代以色列周边的区域性统治
  rationale: 两组平行的地理表达刻意展现极广的统治范围；译文保留这种张力，不替读者规定其实现方式。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。军事意象使用“战车、战马、争战的弓”，保持原文平行和词根重复；王权语句使用“统治”，避免过度神学化，同时保留原文由上帝第一人称转向王的第三人称这一结构。
