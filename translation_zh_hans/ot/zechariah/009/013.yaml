id: ZEC.9.13
reference: Zechariah 9:13
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּֽי דָרַ֨כְתִּי לִ֜/י יְהוּדָ֗ה קֶ֚שֶׁת מִלֵּ֣אתִי אֶפְרַ֔יִם וְ/עוֹרַרְתִּ֤י בָנַ֨יִ/ךְ֙ צִיּ֔וֹן עַל בָּנַ֖יִ/ךְ יָוָ֑ן וְ/שַׂמְתִּ֖י/ךְ כְּ/חֶ֥רֶב גִּבּֽוֹר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/009/013.yaml
  text: For I have bent Judah as my bow; I have filled it with Ephraim. I will stir up your sons[a], Zion, against your sons, Greece, and make you like a warrior’s sword.
translation:
  language: zh_hans
  text: 因为我已把犹大当作我的弓拉开，又以以法莲充满这弓。锡安哪，我要激起你的众子，攻击你的众子——雅完[a]；我要使你如勇士的刀剑。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文为“雅完”；这里指希腊民族或希腊世界。
    reason: 说明专名的原文形式及其历史所指。
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，为先前的应许提供根据或说明；“因为”自然保留其因果、解释功能。
- source_word: דָרַכְתִּי לִי יְהוּדָה קֶשֶׁת
  choice: 我已把犹大拉开作我的弓
  rationale: דרך与“弓”连用，指把弓拉开、预备使用；לִי以“我的”表达归属或为己所用。
- source_word: מִלֵּאתִי אֶפְרַיִם
  choice: 把以法莲搭在弓上
  rationale: 原文直译近于“以以法莲充满〔弓〕”，具体意象有所省略。结合弓的比喻，以法莲显然构成弓上的攻击力量；“搭在弓上”使中文可懂，同时不明确补入原文没有的“箭”。
- source_word: וְעוֹרַרְתִּי
  choice: 我要激起
  rationale: 表达唤起并动员投入争战；在此预言语境中采用将来时，衔接随后即将发生的行动。
- source_word: בָנַיִךְ צִיּוֹן
  choice: 锡安哪，我要激起你的众子
  rationale: 阴性单数后缀把锡安人格化为母亲；“众子”保留原文的性别和军事语境。
- source_word: עַל בָּנַיִךְ יָוָן
  choice: 攻击你的众子——雅完
  rationale: עַל在争战语境中表示“攻击、对抗”；保留专名“雅完”，既反映希伯来原文，也避免把古代所指范围无提示地等同于现代国家。
- source_word: וְשַׂמְתִּיךְ
  choice: 我要使你
  rationale: 在“如……”的比喻结构中，“使你如”是自然且准确的现代汉语。
- source_word: כְּחֶרֶב גִּבּוֹר
  choice: 如勇士的刀剑
  rationale: גִּבּוֹר在军事语境中指勇士或大能战士；“勇士的刀剑”简洁保留原有战斗意象。
theological_decisions:
- issue: יָוָן的所指与译法
  choice: 正文译“雅完”，脚注说明此处指希腊民族或希腊世界
  alternative: 正文直接译“希腊”
  rationale: “雅完”保留专名形式以及其在希伯来传统中的关联；脚注交代此处历史语境中的实际所指，使现代读者不会误解，同时避免将古代民族—地域概念完全现代化。
- issue: 预言语篇中完成式动词的时间力量
  choice: 前两项预备行动译为“已”，后续动员和塑造译为“要”
  alternative: 全部译为将来时，或全部译为过去／完成时
  rationale: 这种处理保留语篇从已经完成的神圣备战，推进到即将实施之行动的修辞走势，也不把希伯来预言完成式机械地固定为单一汉语时态。
- issue: מִלֵּאתִי אֶפְרַיִם中省略的弓箭意象
  choice: 译作“把以法莲搭在弓上”
  alternative: “以以法莲充满它”或“把以法莲作为箭搭上”
  rationale: 原文没有明说“箭”，却以弓的语境暗示以法莲是装上或充实弓的攻击力量。正文保持意象清楚而不把“箭”提升为明示内容。
translation_notes:
  register: 采用现代、庄重而可朗读的普通话。以“锡安哪”标明呼语，以破折号凸显“你的众子”之间的平行对峙；保留弓与刀剑的连续战争意象。
