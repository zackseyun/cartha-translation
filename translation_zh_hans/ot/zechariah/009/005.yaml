revisions:
- from: 亚实基伦看见了就必惧怕；迦萨也必极其痛苦；以革伦也必如此，因为她所盼望的蒙了羞[a]。君王必从迦萨消失，亚实基伦必无人居住。
  to: 亚实基伦看见，必惧怕；迦萨必极其痛苦；以革伦也必如此，因为她所盼望的蒙了羞[a]。迦萨的君王必灭亡，亚实基伦必无人居住。
  rationale: 修订仅处理时体／句法语气及“君王灭亡”的词义力度，保留原文中以革伦在“极其痛苦”后的省略式并列，故以“也必如此”表达而不强加新的具体动词。脚注锚点及内容保持有效。
