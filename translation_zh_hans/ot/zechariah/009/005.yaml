base_translation:
  language: en
  yaml_path: translation/ot/zechariah/009/005.yaml
  text: Ashkelon will see and fear[a]; Gaza also will writhe greatly, and Ekron, because her hope has been put to shame. A king will perish from Gaza[b], and Ashkelon will not be inhabited.
translation:
  language: zh_hans
  text: 亚实基伦看见，必惧怕；迦萨必极其痛苦；以革伦也必如此，因为她所盼望的蒙了羞[a]。迦萨的君王必灭亡，亚实基伦必无人居住。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为她所期待的落了空。”
    reason: מֶבָּטָהּ与הֹבִישׁ的组合既可突出盼望受羞辱，也可着重期待落空的结果。
lexical_decisions:
- source_word: תֵּרֶא ... וְתִירָא
  choice: 看见了就必惧怕
  rationale: 两个未完成式依次表达看见审判后产生惧怕；希伯来文未明说宾语，中文也不补出具体对象，以保留上下文所指。
- source_word: וְתָחִיל מְאֹד
  choice: 必极其痛苦
  rationale: חיל可表示战栗、翻腾或如产痛般的剧烈痛苦；此处用“极其痛苦”保留强烈程度，同时使现代中文自然庄重。
- source_word: מֶבָּטָהּ
  choice: 她所盼望的
  rationale: 该词可指期待、盼望或所仰赖的对象；用“所盼望的”保留它既可指盼望本身、也可指盼望对象的空间。
- source_word: הֹבִישׁ
  choice: 蒙了羞
  rationale: 使役形在这里表达其盼望遭羞辱、落空；“蒙了羞”较贴近字面上的羞耻意象，另以脚注说明结果性的“落空”。
- source_word: וְאָבַד מֶלֶךְ מֵעַזָּה
  choice: 君王必从迦萨消失
  rationale: 直译מן所表达的“从……中离去、不复存在”，并避免把无冠词的מֶלֶךְ强行限定为某一位特定君王。
- source_word: לֹא תֵשֵׁב
  choice: 必无人居住
  rationale: ישב以城为主语时常指有人定居或居住；中文用“无人居住”自然表达该城不再被居住。
- source_word: אַשְׁקְלוֹן / עַזָּה / עֶקְרוֹן
  choice: 亚实基伦／迦萨／以革伦
  rationale: 采用现代中文圣经读者较熟悉的传统地名译法。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的先知性语体；以分号保持原文逐城宣告的节奏。城市在希伯来文中用阴性形式指称，中文保留“她”，使以革伦拟人化的表达清楚可见。
