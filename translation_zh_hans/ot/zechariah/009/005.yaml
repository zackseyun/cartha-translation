review_pass:
  verdict: revise
  source_fidelity: 译文基本准确传达了各城面对审判的惧怕、痛苦和荒凉。但“亚实基伦看见了就必惧怕”中“了……就”略改变两个未完成式的预言性并列；“君王必从迦萨消失”也弱化了אָבַד的“灭亡”含义，且中文搭配不够自然。
  naturalness: 整体庄重流畅，地名采用常见中文圣经形式。改为“亚实基伦看见，必惧怕”更符合先知宣告的节奏；“迦萨的君王必灭亡”较“从迦萨消失”自然明确。
  terminology: “蒙了羞”可恰当表达הֹבִישׁ所含的受羞辱／盼望落空；脚注保留了结果性的替代译法。地名“亚实基伦、迦萨、以革伦”一致且可接受。
  issues:
  - severity: medium
    issue: “看见了就必惧怕”使用完成助词“了”和条件／承接式“就”。
    rationale: 希伯来文为“将看见，且将惧怕”的两个并列未完成式；虽可表达逻辑关联，但不宜把前一动作表述得像已经完成。
  - severity: medium
    issue: “君王必从迦萨消失”弱化且不自然。
    rationale: אָבַד主要指灭亡、毁灭或消亡，不只是中性地“消失”。“从迦萨”在中文也易产生地点移动的理解；以“迦萨的君王必灭亡”自然表达该城将失去君王。
  revised_text: 亚实基伦看见，必惧怕；迦萨必极其痛苦；以革伦也必如此，因为她所盼望的蒙了羞[a]。迦萨的君王必灭亡，亚实基伦必无人居住。
  revised_footnotes:
