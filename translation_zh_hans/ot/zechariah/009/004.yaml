base_translation:
  language: en
  yaml_path: translation/ot/zechariah/009/004.yaml
  text: Behold[a], the Lord will dispossess her and strike her wealth into the sea, and she will be consumed by fire.
translation:
  language: zh_hans
  text: 看哪，主必夺取她，在海上击毁她的势力[a]；她必被火吞噬。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“财富”“力量”或“军力”。希伯来语这个词可指财富、资源、力量或军队；鉴于上一节提到推罗的金银，也可译作“财富”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留先知宣告中引人注意的指示语气和庄重感；“看哪”虽属较高语体，在现代中文圣经文体中仍清楚自然。
- source_word: אֲדֹנָי
  choice: 主
  rationale: 原文是神的称号 Adonai，并非四字神名；译作“主”准确而自然。
- source_word: יוֹרִשֶׁנָּה
  choice: 必使她失去产业
  rationale: ירש 的使役式可表达使人丧失所有、被逐离产业或被剥夺占有物。此译法在中文中自然，并保留推罗遭剥夺的审判含义，而不限定具体的征服方式。
- source_word: וְהִכָּה
  choice: 将……击入
  rationale: נכה 的基本含义是击打；与“海中”连用时，“击入”能自然表达推罗资源被打落、毁灭于海中的图景，又不额外加入杀戮含义。
- source_word: בַּיָּם
  choice: 海中
  rationale: 介词形式本可理解为“在海中”，但结合“击打”及审判语境，中文“击入海中”更通顺，也呈现其势力或财富被推入海中的方向性图景。
- source_word: חֵילָהּ
  choice: 她的财富
  rationale: חַיִל 可指财富、资源、力量或军队。上节刚提到推罗积聚金银，因此正文采用“财富”，并以脚注保留其他真实可能。
- source_word: וְהִיא
  choice: 她
  rationale: 希伯来文为阴性单数，指语境中被人格化的推罗城；中文用“她”保留这一文学形象。
- source_word: בָּאֵשׁ
  choice: 被火
  rationale: 这里的介词表示毁灭的媒介；“被火吞噬”是自然、庄重的现代中文表达。
- source_word: תֵּאָכֵל
  choice: 必被……吞噬
  rationale: אכל 的受动式与火连用，形象地表示被吞灭；“吞噬”保留原文隐喻，比单译“烧毁”更贴近原文。
theological_decisions:
- issue: 阴性后缀和代词所指
  choice: 将这些阴性形式理解为指向语境中的推罗城，并以人格化的“她”表达。
  alternative: 把城市非人格化地译作“它”，或在每处重复“推罗”。
  rationale: 希伯来文连续使用阴性单数形式，符合先知文学将城市人格化的惯例。保留“她”维持原文的文学和宣告力量，不引入额外教义判断。
- issue: יוֹרִשֶׁנָּה 的审判方式
  choice: 译为“使她失去产业”，表达推罗遭剥夺。
  alternative: 译为“把她赶出去”或“占有她”。
  rationale: 该动词的使役式容许被逐、被剥夺或遭占有等相近含义；正文避免把审判方式过度具体化，同时以自然中文呈现其核心结果。
translation_notes:
  register: 采用现代、庄重而易懂的先知书语体。“看哪”保留宣告的肃穆感；分号呈现两个相继的审判行动。避免古奥措辞，同时保留推罗城人格化及“被火吞噬”的原文意象。
