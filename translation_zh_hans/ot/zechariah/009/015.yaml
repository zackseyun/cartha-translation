    rationale: וְשָׁתוּ意为“他们喝”，原文没有“血”；כְּמוֹ יַיִן是“像酒一样”的比较。即使上下文可能唤起血的意象，也不足以在正文中作出排他性补充。
  - severity: medium
    issue: “祭坛的四角”将原文的“角”具体化为“四角”。
    rationale: זָוִיּוֹת为复数“角／角落”；祭坛通常有角，但本节未以数词明说“四”。译作“祭坛的角”既自然又保留原文范围。
  revised_text: 万军之耶和华必保护他们；他们必吞吃，并践踏投石器的石弹。他们必喝，像喝了酒一样喧嚷；他们必充满，如同祭祀用的碗，又如祭坛的角。
