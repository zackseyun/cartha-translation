base_translation:
  language: en
  yaml_path: translation/ot/zechariah/009/015.yaml
  text: The LORD of Armies will shield them, and they will devour and trample the sling stones; they will drink and roar as if with wine, and they will be filled like a bowl, like the corners of the altar.
translation:
  language: zh_hans
  text: 万军之耶和华必保护他们；他们必吞吃，并践踏投石器的石弹。他们必喝，像喝了酒一样喧嚷；他们必充满，如同祭祀用的碗，又如祭坛的角。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: 万军之耶和华
  rationale: 保留神名与“众军之统帅”的称号；这是中文圣经传统中自然、庄重且较贴近原文的表达。
- source_word: יָגֵן עֲלֵיהֶם
  choice: 必保护他们
  rationale: 动词意为遮护、护卫；“保护”在现代汉语中清楚自然。
- source_word: וְאָכְלוּ
  choice: 他们必吞灭仇敌
  rationale: 字面为“他们必吞吃”；此处是战胜敌人的形象性说法。宾语在希伯来文中省略，译文以“仇敌”补明语境，但不将其与后面的“石弹”强行合并。
- source_word: וְכָבְשׁוּ אַבְנֵי קֶלַע
  choice: 践踏投石器的石弹
  rationale: כָּבַשׁ可指制服、压服或践踏；在争战图景中译作“践踏”保留具体而有力的意象。אַבְנֵי קֶלַע指投石器所发射的石块。
- source_word: וְשָׁתוּ הָמוּ כְּמוֹ יָיִן
  choice: 他们必喝血，喧嚷如同醉酒
  rationale: “喝”的宾语未明说，结合上一节“血如尘土”的语境补作“血”；הָמוּ表示喧腾、喧嚷，“如同醉酒”自然传达“像酒一样”所描绘的兴奋状态。
- source_word: כַּמִּזְרָק
  choice: 如献祭的碗
  rationale: מִזְרָק是祭祀礼仪中盛接并洒血的碗；加“献祭的”可使现代读者明白其用途。
- source_word: כְּזָוִיּוֹת מִזְבֵּחַ
  choice: 如祭坛的四角
  rationale: זָוִיּוֹת字面为角、角落；复数在祭坛语境中指其各角，译作“四角”表达整体沾满祭牲之血的图景。
theological_decisions:
- issue: “喝”的省略宾语
  choice: 按上下文补为“血”
  alternative: 仅译“他们必喝”，或理解为喝酒
  rationale: 第14节的争战图景紧接“血如尘土”，而本节随后又提到盛血的献祭碗和祭坛四角，因此“血”最符合上下文；同时“如同醉酒”表明酒是比喻，而非实际宾语。
- issue: 暴力意象的处理
  choice: 保留吞灭、践踏、喝血等先知性争战意象
  alternative: 弱化为一般性的胜利和欢庆
  rationale: 原文刻意使用强烈的战争与祭祀意象，不宜因现代读者感受而淡化；译文也不额外赋予其特定末世或宗派解释。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。保留本节战争与祭坛献血意象之间的强烈衔接；对希伯来文省略的宾语作最低限度的语境补充。
