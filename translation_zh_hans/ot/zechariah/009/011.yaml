id: ZEC.9.11
reference: Zechariah 9:11
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: גַּם אַ֣תְּ בְּ/דַם בְּרִיתֵ֗/ךְ שִׁלַּ֤חְתִּי אֲסִירַ֨יִ/ךְ֙ מִ/בּ֔וֹר אֵ֥ין מַ֖יִם בּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/009/011.yaml
  text: As for you also[a], because of the blood of your covenant[b], I have sent out your prisoners from the pit in which there is no water.
translation:
  language: zh_hans
  text: 至于你，也因着你立约的血[a]，我已经把你的囚徒从无水的坑[b]里释放出来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “因着你立约的血”也可译为“借着你立约的血”。希伯来语介词在这里既可表示原因或根据，也可表示凭借或手段。
    reason: lexical_alternative
  - marker: b
    text: “坑”也可译为“蓄水池”或“地牢”，指一个无水、可用来拘禁人的坑穴。
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם אַתְּ
  choice: 至于你，也
  rationale: 保留גַּם的附加、承接意味，并以自然的现代汉语表达对拟人化锡安之女的直接称呼；希伯来语阴性单数在汉语中不另作标示。
- source_word: בְּדַם בְּרִיתֵךְ
  choice: 因着你立约的血
  rationale: “立约的血”保留血与约的紧密关联；介词בְּ在此可表原因或凭借，正文采用较自然的原因性表达，并在脚注保留工具性译法。
- source_word: שִׁלַּחְתִּי
  choice: 我已经……释放出来
  rationale: 以“释放出来”表达使被囚者离开拘禁之地的含义；“已经”对应完成式，不把时态擅自改成将来。
- source_word: אֲסִירַיִךְ
  choice: 你的囚徒
  rationale: 直接表达被捆绑、囚禁的人，并与“坑”的拘禁意象相配。
- source_word: מִבּוֹר
  choice: 从……坑里
  rationale: בּוֹר可指坑、蓄水池，也可指用作拘禁处的地坑；正文选用含义较宽的“坑”，具体可能性见脚注。
- source_word: אֵין מַיִם בּוֹ
  choice: 无水的
  rationale: 简洁自然地保留“其中没有水”的描述，修饰前面的坑。
theological_decisions:
- issue: “你立约的血”所指的约
  choice: 正文保留一般性的立约之血表述，不指明某一特定的约
  alternative: 明确解释为西奈之约的血，或解释为对新约的预表
  rationale: 原文带有以血立约的神学意象，却没有在本节明说具体是哪一次立约；保留开放性可避免把某一教义解释写入正文。
- issue: 释放行动的时间表达
  choice: 按希伯来语完成式译为“我已经……释放出来”
  alternative: 按先知性完成式理解，译为“我必……释放出来”
  rationale: 完成式可能从不同语境角度理解；正文贴近其形式，不在翻译中直接判定为预告性的将来。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“至于你，也”保留原文与上文应许之间的承接和强调；“立约的血”保留圣经传统用语及其神学张力，同时不锁定具体所指。
