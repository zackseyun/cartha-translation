  text: גִּילִ֨י מְאֹ֜ד בַּת צִיּ֗וֹן הָרִ֨יעִי֙ בַּ֣ת יְרוּשָׁלִַ֔ם הִנֵּ֤ה מַלְכֵּ/ךְ֙ יָ֣בוֹא לָ֔/ךְ צַדִּ֥יק וְ/נוֹשָׁ֖ע ה֑וּא עָנִי֙ וְ/רֹכֵ֣ב עַל חֲמ֔וֹר וְ/עַל עַ֖יִר בֶּן אֲתֹנֽוֹת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/009/009.yaml
  text: Rejoice greatly[a], daughter Zion! Shout in triumph, daughter Jerusalem! Look, your king is coming to you—righteous and victorious is he, humble and riding on a donkey, on a colt[c][b], the foal of a she-donkey.
translation:
  language: zh_hans
  text: 锡安的女儿啊，要大大欢喜！耶路撒冷的女儿啊，要欢呼！看哪，你的王正来到你这里；他公义，蒙拯救[a]，谦卑[b]，骑着驴，骑着驴驹，就是母驴的驹子[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “蒙拯救”也可译作“得胜”或“具有救恩”。希伯来语采用被动形式，可描述这位王蒙上帝解救，因而得胜。
    reason: alternative_reading
  - marker: b
    text: “谦卑”也可译作“卑微”“贫穷”或“受苦”；原词既可描述态度，也可描述身份或处境。
    reason: lexical_alternative
  - marker: c
    text: “骑着驴，骑着驴驹，就是母驴的驹子”很可能是诗歌平行表达，从两个角度描述同一头牲畜。
    reason: literary_note
lexical_decisions:
- source_word: גִּילִי מְאֹד
  choice: 要大大欢喜
  rationale: 保留阴性单数命令语气及 מְאֹד 的加强作用；“大大欢喜”自然、庄重，也适合先知诗歌。
- source_word: בַּת צִיּוֹן / בַּת יְרוּשָׁלִַם
  choice: 锡安的女儿 / 耶路撒冷的女儿
  rationale: 保留城市及其居民被人格化为“女儿”的先知性意象，不改写成解释性的“锡安居民”。
- source_word: הָרִיעִי
  choice: 要欢呼
  rationale: 该动词表示高声呼喊，常带欢庆或胜利喝彩的意味；此处王来临的语境使“欢呼”比中性的“呼喊”更贴切。
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留引人注意和宣告临近事件的功能；“看哪”在现代中文圣经文体中仍清楚而庄重。
- source_word: מַלְכֵּךְ יָבוֹא לָךְ
  choice: 你的王正来到你这里
  rationale: 以“正来到”表达未完成式所具有的先知性临场感，并保留 לָךְ 的方向和受益关联，不将其弱化为单纯的“来了”。
- source_word: צַדִּיק
  choice: 公义
  rationale: 既表达君王正直、公正的品格，也保留该词在盟约与神学语境中的厚度。
- source_word: וְנוֹשָׁע
  choice: 而且得胜
  rationale: 该词是 ישׁע 的被动分词，可指蒙拯救、获救而得胜；在君王来临的语境中，“得胜”自然表达蒙神解救后的胜利状态，同时以脚注保留被动形式的歧义。
- source_word: עָנִי
  choice: 谦卑
  rationale: 该词可指贫穷、受苦、卑微或谦和；这里与君王骑驴而来的形象相配，“谦卑”较自然，但脚注保留其他可能。
- source_word: וְרֹכֵב עַל חֲמוֹר וְעַל עַיִר בֶּן אֲתֹנוֹת
  choice: 骑着驴，骑着驴驹，就是母驴的驹子
  rationale: 保留希伯来诗句的两重表述，并用“就是”自然提示后句很可能进一步说明同一头牲畜，而不武断消除诗歌平行结构。
theological_decisions:
- issue: 弥赛亚君王预言中 וְנוֹשָׁע 的含义
  choice: 得胜
  alternative: 蒙拯救；具有救恩
  rationale: 被动词形首先容许“蒙拯救”的理解，而王权语境也容许从结果着眼译为“得胜”。正文采用自然的“得胜”，脚注明确神所施行之拯救的可能含义，避免把被动意义或神的作为抹去。
- issue: 来临之王被称为 עָנִי
  choice: 谦卑
  alternative: 卑微；贫穷；受苦
  rationale: 骑驴的非炫耀性形象支持“谦卑”，但原词也可能描述社会处境或受苦状态，因此不把该词仅限于内在品德，并在脚注中保留其语义张力。
- issue: 驴与驴驹是否指两头牲畜
  choice: 以同位说明方式呈现，但保留完整平行表达
  alternative: 理解为两头不同的牲畜
  rationale: 希伯来诗歌平行结构很可能从两个角度描述同一头驴驹；正文中的“就是”帮助现代读者理解，同时脚注说明这是很可能而非唯一可能的句法判断。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话，保留先知诗歌中的呼语、人格化意象和王权宣告。“看哪”略具经文色彩，但在此能有效传达 הִנֵּה 的引人注意功能。正文脚注标记均置于相关词句之后。
