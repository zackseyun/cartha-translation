  to: 那日，耶和华他们的上帝必拯救他们，像拯救自己百姓的羊群一样；因为他们如冠冕上的宝石[b]，高悬在他的土地之上，熠熠生辉[a]。
  rationale: 修订将羊群比喻直接连于拯救行动，避免“把他们当作”所造成的解释性转换；将冠冕宝石和动词脚注分别锚定在相关短语之后；并以“高悬在……之上”较完整反映末句的空间与显扬意象。脚注保留动词及“冠冕”一词的词汇歧义，正文不强加特定神学解释。
