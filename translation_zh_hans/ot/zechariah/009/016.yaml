id: ZEC.9.16
reference: Zechariah 9:16
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְֽ/הוֹשִׁיעָ֞/ם יְהוָ֧ה אֱלֹהֵי/הֶ֛ם בַּ/יּ֥וֹם הַ/ה֖וּא כְּ/צֹ֣אן עַמּ֑/וֹ כִּ֚י אַבְנֵי נֵ֔זֶר מִֽתְנוֹסְס֖וֹת עַל אַדְמָתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/009/016.yaml
  text: And Yahweh their God will save them on that day as the flock of his people[b][a], for they will sparkle like the stones of a crown over his land.
translation:
  language: zh_hans
  text: 那日，耶和华他们的上帝必拯救他们，像拯救自己百姓的羊群一样；因为他们如冠冕上的宝石[b]，高悬在他的土地之上，熠熠生辉[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “熠熠生辉”或译“被高举、醒目地展示”。希伯来语动词不只可使人想到闪耀，也可表示像旗帜一样被举起或显明。
    reason: lexical_alternative
  - marker: b
    text: “冠冕上的宝石”也可译“冠冕的宝石”；“冠冕”一词有时也带有分别为圣的含义，因此另有人理解为“分别为圣的石头”，但在这里可能性较小。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹשִׁיעָם
  choice: 必拯救他们
  rationale: 使役式在此表示拯救、解救；“拯救”既保留脱离危难之意，也不把含义限缩为军事胜利。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经传统中对四字神名的通行音译，清楚区别于称号“主”。
- source_word: אֱלֹהֵיהֶם
  choice: 他们的上帝
  rationale: 直接保留所属关系，体现上帝与这群人的关系。
- source_word: בַּיּוֹם הַהוּא
  choice: 那日
  rationale: 这是先知文学中自然、庄重且简洁的时间表达。
- source_word: כְּצֹאן עַמּוֹ
  choice: 把他们当作自己的羊群
  rationale: 希伯来语字面近于“如他百姓的羊群”。此译将比拟自然地归于上帝拯救、看顾自己的百姓，同时不消除羊群意象。
- source_word: כִּי
  choice: 因为
  rationale: 保留其说明或给出根据的连接作用。
- source_word: אַבְנֵי נֵזֶר
  choice: 冠冕上的宝石
  rationale: נֵזֶר通常指冠冕或华冠，也可带分别为圣的关联；本诗句与宝石显耀的意象最相合，但其他可能性收入脚注。
- source_word: מִתְנוֹסְסוֹת
  choice: 熠熠生辉
  rationale: 该词可表示高举、显扬或醒目展示；在冠冕宝石的语境中，“熠熠生辉”自然传达其耀眼显明的一面，同时以脚注保留“被高举”的词义可能。
- source_word: עַל אַדְמָתוֹ
  choice: 在他的土地上
  rationale: אַדָמָה指土地、地土；介词עַל可依图像译作“在……上”或“高悬于……之上”。“他的”最自然地回指耶和华。
theological_decisions:
- issue: 羊群比喻的句法关系
  choice: 将百姓视为上帝自己的羊群，并把比拟连于他的拯救与看顾
  alternative: 译作“拯救他们，如同拯救他百姓的羊群”或较字面地译作“作为他百姓的羊群”
  rationale: 上下文最自然地把蒙拯救者描述为属于上帝的羊群；此译避免暗示经文另有一群未明说的羊。
- issue: 冠冕宝石的意象
  choice: 百姓如冠冕上的宝石，在上帝的土地上显耀
  alternative: 将其理解为被高举展示的宝石，或与分别为圣有关的石头
  rationale: 宝石与冠冕的诗意组合支持光辉显耀的理解，但动词本身也容许高举、展示之意，因此不将这一可能性从译注中删除。
- issue: “他的土地”中代词的指向
  choice: 保留“他的”，让其最自然地指向耶和华
  alternative: 解释为百姓的土地或赐给百姓的土地
  rationale: 原文用阳性单数后缀，邻近且主要的单数指称是耶和华；直译能保留土地既属于上帝、又与其百姓相关的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“那日”“必拯救”保留先知话语的凝练感；“熠熠生辉”使末句在中文中自然成诗，同时脚注保留原动词关于高举、展示的真实歧义。所有脚注标记均置于相关意象之后。
