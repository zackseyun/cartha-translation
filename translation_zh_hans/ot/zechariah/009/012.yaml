  text: שׁ֚וּבוּ לְ/בִצָּר֔וֹן אֲסִירֵ֖י הַ/תִּקְוָ֑ה גַּם הַ/יּ֕וֹם מַגִּ֥יד מִשְׁנֶ֖ה אָשִׁ֥יב לָֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/009/012.yaml
  text: Return to the stronghold[a], prisoners of hope[b]; even today I declare that I will restore double to you.
translation:
  language: zh_hans
  text: 你们这些盼望的囚徒[a]啊，要回到堡垒！就在今天，我也宣告：我要加倍归还给你[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“被盼望所拘系的人”，也可理解为“怀有盼望的被囚者”。原文的比喻可同时使人想到受困与被盼望支撑。
    reason: lexical_alternative
  - marker: b
    text: 或译“我要把双份归还给你”或“我要加倍偿还你”。
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוּבוּ
  choice: 回到……来
  rationale: 这是复数命令式，既可指实际返回，也可能带有回转的盟约意味；译文不进一步限定。
- source_word: לְבִצָּרוֹן
  choice: 堡垒
  rationale: 该词指设防之地或坚固据点。“堡垒”保留具体意象，同时容许其在预言语境中的比喻意义。
- source_word: אֲסִירֵי הַתִּקְוָה
  choice: 盼望的囚徒
  rationale: 原文为构造词组，直译近于“盼望的囚徒”。这一表达保留了囚禁与盼望并存的醒目张力，没有将其平化为“怀有盼望的被囚者”。
- source_word: גַּם הַיּוֹם
  choice: 就在今天……也
  rationale: 既保留 גַּם 的“也、甚至”语气，也以“就在”传达当下宣告的强调意味。
- source_word: מַגִּיד
  choice: 我也宣告
  rationale: 分词与随后第一人称动词连用，在此自然表达当前的郑重宣告；主语“我”由下文第一人称动词确定。
- source_word: מִשְׁנֶה
  choice: 加倍
  rationale: 该词可指“双倍”或“双份”。“加倍”简洁地保留数量意义，且不擅自补出所归还之物。
- source_word: אָשִׁיב לָךְ
  choice: 归还给你
  rationale: 使役词形在此有使之返回、恢复或偿还之意。“归还”保留与本节开头“回到”相呼应的词根关系，也避免把应许完全处理成交易性的赔偿。原文第二人称阴性单数以“你”保留。
theological_decisions:
- issue: לָךְ 所指的单数女性受话者
  choice: 保留单数“你”，不在正文中明确其身份
  alternative: 译为“你们”，视为对所有囚徒的集体称呼；或明确译作“锡安”
  rationale: 原文词尾为阴性单数，可能指人格化的锡安、耶路撒冷或作为整体的立约群体。保留“你”既反映语法形式，也不把可能的所指固定为某一种解释。
- issue: “盼望的囚徒”的关系
  choice: 保留属格式的比喻表达
  alternative: 解释为“怀有盼望的被囚者”或“被盼望所拘束的人”
  rationale: 希伯来语容许“以盼望为特征的囚徒”及更强烈的“被盼望拘系”意象；正文保留这种张力。
- issue: מִשְׁנֶה 的应许性质
  choice: 译为“加倍归还”，不补明归还的内容
  alternative: “赐还双份福分”或“加倍补偿”
  rationale: 原文没有明说所归还的是福分、产业还是补偿；不补出宾语可避免提前限定应许的神学内涵。
translation_notes:
  register: 采用现代、庄重而可朗读的普通话。“盼望的囚徒”刻意保留原文不寻常的比喻；感叹号体现复数命令和呼语的力度。后半句改用单数“你”，对应希伯来语阴性单数词尾，并保留从众囚徒到人格化受话者的语法转换。
