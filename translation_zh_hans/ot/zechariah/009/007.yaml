source:
  edition: WLC
  text: וַ/הֲסִרֹתִ֨י דָמָ֜י/ו מִ/פִּ֗י/ו וְ/שִׁקֻּצָי/ו֙ מִ/בֵּ֣ין שִׁנָּ֔י/ו וְ/נִשְׁאַ֥ר גַּם ה֖וּא לֵֽ/אלֹהֵ֑י/נוּ וְ/הָיָה֙ כְּ/אַלֻּ֣ף בִּֽ/יהוּדָ֔ה וְ/עֶקְר֖וֹן כִּ/יבוּסִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/009/007.yaml
  text: I will remove his blood from his mouth and his detestable things from between his teeth[a]. Then he too will be a remnant for our God; he will be like a clan leader in Judah[c][b], and Ekron will be like the Jebusite.
translation:
  language: zh_hans
  text: 我要从他口中除去血，从他牙缝中除去可憎之物[a]。他也必归给我们的上帝，成为余民[b]；他必像犹大的一位族长，以革伦必像耶布斯人[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “可憎之物”很可能指与偶像崇拜或礼仪不洁有关的东西，也可能包括异教祭祀中的食物。
    reason: 文化背景与词义说明
  - marker: b
    text: “成为余民”也可译作“存留下来”或“被留下，归给我们的上帝”。希伯来语动词本身可泛指存留，但这里也带有先知书中“余民”的意味。
    reason: 词义备选
  - marker: c
    text: “像耶布斯人”可能表示以革伦将被纳入犹大，不再作为敌对势力独立存在；耶布斯人后来被吸收在耶路撒冷的居民中。
    reason: 历史文化背景
lexical_decisions:
- source_word: וַהֲסִרֹתִי
  choice: 我要……除去
  rationale: 使役式在这里表示上帝主动使这些污秽之物离开；“除去”自然清楚，并适用于后面的两个宾语。
- source_word: דָמָיו מִפִּיו
  choice: 从他口中除去血
  rationale: 保留“血”和“口”的具体意象，不在正文中将其限定解释为饮血、祭祀食物或流血罪。
- source_word: וְשִׁקֻּצָיו מִבֵּין שִׁנָּיו
  choice: 从他牙缝中除去可憎之物
  rationale: “可憎之物”保留 שִׁקּוּץ 对偶像崇拜或礼仪污秽之物的强烈贬义，同时不把所指范围缩得过窄；“牙缝中”自然地保留原文鲜明的身体意象。
- source_word: וְנִשְׁאַר גַּם הוּא
  choice: 他也必成为余民
  rationale: שׁאר 的被动式可指“留下、存留”；“成为余民”保留先知文学中的余民意味，而“也”对应 גַּם，表明这位原属敌对群体者也被包括在内。
- source_word: לֵאלֹהֵינוּ
  choice: 归给我们的上帝
  rationale: 介词 לְ 在此表达归属或关系；“归给”比单纯的“为”更自然地传达其属于以色列之上帝的含义。
- source_word: כְּאַלֻּף בִּיהוּדָה
  choice: 在犹大像一位族长
  rationale: אַלּוּף 在此最可能指部族或宗族领袖；“族长”简洁、易懂，并保留其地位显要的意味。
- source_word: וְעֶקְרוֹן כִּיבוּסִי
  choice: 以革伦也必像耶布斯人
  rationale: 保留原文简洁的类比，不在正文中直接说明其被吸收、归并或降服的具体方式。
theological_decisions:
- issue: 非利士人的洁净与身份转变
  choice: 保留从口中除去血和可憎之物、继而归给上帝的次序，呈现洁净并被纳入上帝子民的图景。
  alternative: 仅将本节理解为政治征服或臣服。
  rationale: “除去血和可憎之物”以及“归给我们的上帝”共同指向宗教和群体身份上的改变，但正文仍保留单数代词及象征性意象，不强行界定这是个人还是群体代表。
- issue: וְנִשְׁאַר 的余民含义
  choice: 正文采用“成为余民”。
  alternative: 译作“存留下来”或“被留下”。
  rationale: 该动词本身允许较一般的“存留”之义，但在先知语境中具有余民共鸣；脚注保留较中性的译法，以免掩盖词义弹性。
- issue: “像耶布斯人”的含义
  choice: 正文只保留类比，脚注说明它可能暗示被纳入犹大。
  alternative: 在正文中直接译为“被并入犹大”。
  rationale: 历史背景支持归并的理解，但原文没有明确说出归并方式，故不在正文中消除其含蓄性。
translation_notes:
  register: 采用现代、庄重而通俗的书面汉语。“牙缝中”使原文意象自然可感；“可憎之物”“余民”“族长”保留先知文本的宗教与社会语汇。所有解释性限定均放入脚注，正文维持希伯来语的单数、意象和神学张力。
