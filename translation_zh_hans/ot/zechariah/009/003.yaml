base_translation:
  language: en
  yaml_path: translation/ot/zechariah/009/003.yaml
  text: Tyre built herself a fortress[a], and piled up silver like dust[b], and gold like the mud of the streets.
translation:
  language: zh_hans
  text: 推罗为自己建造了堡垒[a]，又堆积白银如尘土、黄金[b]如街道上的泥泞。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“坚固城防”。希伯来语 מָצוֹר 可指堡垒或防御工事。
    reason: lexical_alternative
  - marker: b
    text: 或译“精金”。希伯来语 חָרוּץ 在某些语境中可特指精炼的金子。
    reason: lexical_alternative
lexical_decisions:
- source_word: צֹר
  choice: 推罗
  rationale: 这是腓尼基城名；“推罗”是现代汉语圣经及一般中文中通行的译名。
- source_word: וַתִּבֶן
  choice: 建造了
  rationale: 该叙事性动词形式表示已发生的行动；“建造了”准确而自然。
- source_word: מָצוֹר
  choice: 堡垒
  rationale: 此处指为城市提供防御的坚固设施；“堡垒”清楚传达军事防护之意，同时脚注保留“坚固城防”等可能表达。
- source_word: לָהּ
  choice: 为自己
  rationale: 阴性单数代词与拟人化的推罗城相应；“为自己”保留了希伯来文的受益及反身意味。
- source_word: וַתִּצְבָּר
  choice: 堆积
  rationale: 该动词描写大量积聚；“堆积”保留具体意象，并与后面的尘土、泥土比喻呼应。
- source_word: כֶּסֶף
  choice: 银子
  rationale: 上下文与金子并列，所指是贵金属而非泛指钱财；“银子”自然且明确。
- source_word: כֶּעָפָר
  choice: 如尘土
  rationale: 保留原文以尘土形容数量极多的简洁比喻。
- source_word: חָרוּץ
  choice: 金子
  rationale: 此处指黄金；“金子”符合普通现代汉语，至于是否特别强调精炼或上等品质，则在脚注中保留。
- source_word: כְּטִיט חוּצוֹת
  choice: 如街上的泥土
  rationale: 直观保留街道泥土随处可见、数量众多的意象，表达自然易懂。
theological_decisions: []
