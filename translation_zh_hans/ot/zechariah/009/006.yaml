  text: וְ/יָשַׁ֥ב מַמְזֵ֖ר בְּ/אַשְׁדּ֑וֹד וְ/הִכְרַתִּ֖י גְּא֥וֹן פְּלִשְׁתִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/009/006.yaml
  text: A mixed people will dwell in Ashdod[a], and I will cut off the pride of the Philistines.
translation:
  language: zh_hans
  text: 混杂的人[a]必住在亚实突；我必剪除非利士人的骄傲。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“非婚生的人”。希伯来语“מַמְזֵר”含义较难确定，可能指身份混杂或受排斥的人；此处也可能具有概括意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשַׁב
  choice: 住
  rationale: 该动词常指居住、定居；这里描述亚实突居民的更替，用“住”自然简洁。
- source_word: מַמְזֵר
  choice: 混杂的人
  rationale: 此词词义较难确定，可指非婚生者，也可能指身份混杂或被排斥的人。在本段有关城邑与族群受审判的语境中，“混杂的人”保留其社会或群体身份含混的意味，又不把解释限于现代所理解的非婚生身份。
- source_word: בְּאַשְׁדּוֹד
  choice: 在亚实突
  rationale: 介词 בְּ 表示地点；“在亚实突”准确表达居于城中。
- source_word: הִכְרַתִּי
  choice: 我必剪除
  rationale: כרת 的使役形在审判语境中表示除掉、消灭；“剪除”保留希伯来语鲜明的切断意象和先知性语体。
- source_word: גְּאוֹן
  choice: 骄傲
  rationale: 该词可指威荣、自高或骄傲；在针对非利士人的审判宣告中，负面的“骄傲”最切合语境。
- source_word: פְּלִשְׁתִּים
  choice: 非利士人
  rationale: 原文指非利士这一族群，而不是其地域，因此译作“非利士人”。
theological_decisions:
- issue: 审判宣告中 מַמְזֵר 的所指与含义
  choice: 译作具有概括意味的“混杂的人”
  alternative: “非婚生的人”或“外族人”
  rationale: 本节涉及亚实突人口与非利士人身份、权势的改变。原词可能是单数个体称谓，也可能在语境中概括某类身份混杂或受排斥的人。正文采用“混杂的人”，脚注保留“非婚生的人”这一词典上可能的解释，不把经文含义过度限定。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“剪除”保留先知审判宣告的力度；分号呈现两个平行而相关的宣告。
