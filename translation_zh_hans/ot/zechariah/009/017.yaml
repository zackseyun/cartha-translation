  text: כִּ֥י מַה טּוּב֖/וֹ וּ/מַה יָפְי֑/וֹ דָּגָן֙ בַּֽחוּרִ֔ים וְ/תִיר֖וֹשׁ יְנוֹבֵ֥ב בְּתֻלֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/009/017.yaml
  text: For how great is his goodness[a], and how great his beauty! Grain will make the young men flourish[c][b], and new wine the young women.
translation:
  language: zh_hans
  text: 因为，他的美善何其美好，他的荣美何其华美[a]！谷物使青年男子茁壮，新酒使年轻女子[b]焕发活力。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他的”最可能指耶和华，但也有人理解为以色列或锡安复兴后的景况，或本章先前提到的王。希伯来文直译为“他的美善”和“他的荣美”，也可译作“他何其美善，何其荣美”。
    reason: 保留第三人称后缀所指的歧义，并说明原文使用抽象名词。
  - marker: b
    text: “年轻女子”或译“处女”。希伯来词可更具体地指未婚的处女；这里可能主要作为“青年男子”的女性对应称谓。
    reason: 保留词语较具体的词义选项。
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 保留本节承接上一节的解释关系，同时不额外加强语气。
- source_word: מַה טּוּבוֹ
  choice: 他的美善何其大
  rationale: 保留感叹结构、抽象名词“美善”及第三人称阳性单数后缀，不将其改写成单纯的形容词句。
- source_word: וּמַה יָפְיוֹ
  choice: 他的荣美何其盛
  rationale: 以“荣美”表达美丽、华美或荣光，并与前一分句保持平行；“何其盛”在现代中文中自然而庄重。
- source_word: דָּגָן
  choice: 五谷
  rationale: 指各类谷物或粮食，并非特指现代意义的玉米；“五谷”在中文中简洁地表达丰收与供应。
- source_word: בַּחוּרִים
  choice: 青年男子
  rationale: 这里与后半句的年轻女子成对，指处于青春年华的男子。
- source_word: יְנוֹבֵב
  choice: 使……茁壮／焕发
  rationale: 该动词罕见，语境中带有使人兴旺、充满活力的使动含义；依中文搭配分别译为“茁壮”和“焕发”，并让后半句承接同一动词。
- source_word: וְתִירוֹשׁ
  choice: 新酒
  rationale: תִּירוֹשׁ通常指新酿或新出的酒，与五谷共同构成丰饶祝福的图景。
- source_word: בְּתֻלוֹת
  choice: 年轻女子
  rationale: 该词可特指处女或未婚女子；本诗句中它与“青年男子”相对，正文采用自然的群体称谓，较具体的词义保留在脚注。
theological_decisions:
- issue: “他的美善”和“他的荣美”中第三人称后缀的所指
  choice: 正文保留“他的”，不直接点明所指；按上下文最可能指耶和华。
  alternative: 也可能指以色列或锡安复兴后的美好景况，或本章先前提到的王。
  rationale: 上一节以耶和华的拯救为中心，因此指向耶和华最为连贯；但希伯来文本没有明说先行词，故不在正文中消除这种歧义。
translation_notes:
  register: 采用现代、庄重而易懂的诗体中文。“何其大／何其盛”保留希伯来文的双重感叹和平行结构；后半句以“茁壮／焕发”呈现同一罕见动词对两个宾语的省略式支配，同时使中文搭配自然。
