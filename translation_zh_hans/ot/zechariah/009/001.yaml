id: ZEC.9.1
reference: Zechariah 9:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: מַשָּׂ֤א דְבַר יְהוָה֙ בְּ/אֶ֣רֶץ חַדְרָ֔ךְ וְ/דַמֶּ֖שֶׂק מְנֻחָת֑/וֹ כִּ֤י לַֽ/יהוָה֙ עֵ֣ין אָדָ֔ם וְ/כֹ֖ל שִׁבְטֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/009/001.yaml
  text: 'An oracle: the word of Yahweh is against the land of Hadrach[a], and Damascus is its resting place[d][c][b]; for the eye of man and of all the tribes of Israel is toward Yahweh.'
translation:
  language: zh_hans
  text: 宣告：耶和华的话临到哈得拉地[a]；大马士革是它安歇之处[b]。因为世人和以色列各支派的眼目都仰望耶和华[c][d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“论哈得拉地”，也可直译为“在哈得拉地”。这里的希伯来介词在先知性标题中可以标示宣告所针对的对象。
    reason: alternative_reading
  - marker: b
    text: 或译：“大马士革是他的安歇之处。”希伯来语后缀既可理解为“它的”，也可理解为“他的”，所指并不明确。
    reason: lexical_alternative
  - marker: c
    text: “世人”也可译作“人类”。原文的“人”在这里很可能是泛指。
    reason: lexical_alternative
  - marker: d
    text: 本句也有人理解为：“因为耶和华的眼目察看世人和以色列各支派。”希伯来原文十分凝缩，容许不止一种句法理解。
    reason: alternative_reading
lexical_decisions:
- source_word: מַשָּׂא
  choice: 宣告
  rationale: 该词在先知书标题中指带有权威的先知性宣言；“宣告”自然庄重，也不把“重担”这一可能的词源意味误作本句主旨。
- source_word: דְבַר יְהוָה
  choice: 耶和华的话
  rationale: 保留标准先知性表达，并将四字神名译作“耶和华”。
- source_word: בְּאֶרֶץ חַדְרָךְ
  choice: 临到哈得拉地
  rationale: 介词字面为“在”，但在先知宣告标题中可标示信息所针对或临到的地方；“临到”既符合现代汉语经文语体，也避免过早断定为单纯的敌对宣判。
- source_word: חַדְרָךְ
  choice: 哈得拉
  rationale: 按地名音译，并采用现代中文圣经读者较易辨认的形式。
- source_word: מְנֻחָתוֹ
  choice: 是它安歇之处
  rationale: 名词意为“安歇之处”；阳性单数后缀的先行词不明确。正文以“它”承接前面的“话／宣告”，同时用脚注保留“他的”这一可能。
- source_word: לַיהוָה עֵין אָדָם
  choice: 世人的眼目都仰望耶和华
  rationale: 希伯来语高度凝缩。正文将“眼目”理解为主语，将 לַיהוָה 理解为朝向耶和华；“世人”表达 אָדָם 在此可能具有的泛指意义。
- source_word: וְכֹל שִׁבְטֵי יִשְׂרָאֵל
  choice: 和以色列各支派的眼目
  rationale: 在汉语中补出共享的“眼目”，清楚表达世人与以色列各支派都仰望耶和华。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名；“耶和华”是现代简体中文读者最熟悉、且作为专名处理的传统形式。
- issue: אָדָם 的泛指范围
  choice: 世人
  alternative: 人
  rationale: 此处很可能泛指人类，而非仅指某一男性；“世人”自然传达其集合性，同时不扩大为原文没有明说的特定群体。
- issue: “眼目”从属关系的句法解释
  choice: 世人和以色列各支派仰望耶和华
  alternative: 耶和华察看世人和以色列各支派
  rationale: 词序较直接支持“眼目”为主语、לַיהוָה 为所朝向的对象，但原句压缩而有争议，因此将另一种重要理解列入脚注。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。“宣告”保留先知书标题的正式感；正文不以标点或解释性增词消除原文中后缀及末句句法的真实歧义，相关可能性均在脚注中说明。
