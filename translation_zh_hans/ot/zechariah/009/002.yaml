source:
  edition: WLC
  text: וְ/גַם חֲמָ֖ת תִּגְבָּל בָּ֑/הּ צֹ֣ר וְ/צִיד֔וֹן כִּ֥י חָֽכְמָ֖ה מְאֹֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/009/002.yaml
  text: and also Hamath[a], which borders on it; Tyre and Sidon, because they are very wise.
translation:
  language: zh_hans
  text: 哈马也与它接壤[a]；推罗和西顿，因为其极有智慧。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “它”指上文所提的地点。希伯来文末句“极有智慧”的谓语为阴性单数；可理解为指推罗（西顿与之并列），也可按推罗和西顿这一并列城名理解为“因为它们极有智慧”。
    reason: 说明“它”的上下文所指，并保留末句阴性单数谓语与并列城名之间的句法歧义。
lexical_decisions:
- source_word: וְ/גַם
  choice: 以及
  rationale: 兼顾连接词与附加语气，把本节同前面的审判对象相连，并自然表达“也包括”。
- source_word: חֲמָת
  choice: 哈马
  rationale: 采用现代中文圣经地名的通行译名。
- source_word: תִּגְבָּל בָּהּ
  choice: 与它接壤
  rationale: גבל表示接界、毗邻；介词短语בָּהּ保留阴性单数所指，以“与它接壤”自然表达地域邻接关系。
- source_word: צֹר וְ/צִידוֹן
  choice: 推罗和西顿
  rationale: 采用现代中文圣经地名的通行译名，并保留并列关系。
- source_word: כִּי
  choice: 因为
  rationale: 保留原文的原因或解释关系，不将其弱化为单纯的补充说明。
- source_word: חָכְמָה מְאֹד
  choice: 她极有智慧
  rationale: 原文谓语为阴性单数；以“她”保留这一数与性的形式，同时不擅自判定只指西顿、集合性的城邑，还是其他阴性单数所指。מְאֹד译作“极”，语言简洁庄重。
theological_decisions:
- issue: 推罗和西顿分句中כִּי的句法作用
  choice: 译作“因为”，保留因果或解释关系
  alternative: 译作“因”或处理为附带说明“它们非常有智慧”
  rationale: 原文明确使用כִּי；直译其关系可保留经文张力，又不扩写为何智慧构成被提及或受审判的原因。
- issue: חָכְמָה的阴性单数与并列城名之间的不协调
  choice: 正文保留单数“她”，并用脚注说明可能的复数理解
  alternative: 按推罗和西顿合译为“它们极有智慧”，或按最近先行词译为“西顿极有智慧”
  rationale: 希伯来文形式明确为阴性单数，而其确切指向并不明确。正文保留形式上的歧义，脚注交代自然的集合性理解，避免静默消解原文的不协调。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。正文尽量贴近希伯来文的结构与单数形式；用分号划分哈马与推罗、西顿两个压缩的分句，并以脚注呈现较顺畅的复数理解。
