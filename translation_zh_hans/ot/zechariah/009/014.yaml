  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַֽ/יהוָה֙ עֲלֵי/הֶ֣ם יֵֽרָאֶ֔ה וְ/יָצָ֥א כַ/בָּרָ֖ק חִצּ֑/וֹ וַֽ/אדֹנָ֤/י יְהֹוִה֙ בַּ/שּׁוֹפָ֣ר יִתְקָ֔ע וְ/הָלַ֖ךְ בְּ/סַעֲר֥וֹת תֵּימָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/009/014.yaml
  text: Then Yahweh will appear over them[a], and his arrow will go out like lightning[b]; and the Lord GOD will sound the trumpet and march in the whirlwinds of the south.
translation:
  language: zh_hans
  text: 雅威必在他们上方显现，他的箭必如闪电射出；主雅威必吹响号角[a]，在南方的旋风中行进。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的“号角”指羊角号，用于作战信号或礼仪场合。
    reason: cultural_note
  - marker: b
    text: “在南方的旋风中”也可译作“在提幔的旋风中”；“提幔”可作地名，也可表示南方。
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 采用神圣名字的现代汉语音译，而不以“上主”或“主”这一称号代替专名。
- source_word: עֲלֵיהֶם
  choice: 在他们上方
  rationale: 保留介词的空间意象，也不强行判定“他们”是神的百姓还是敌方。
- source_word: יֵרָאֶה
  choice: 显现
  rationale: 准确表达ראה的尼法勒式在神显现语境中的含义，语言庄重自然。
- source_word: וְיָצָא כַבָּרָק חִצּוֹ
  choice: 他的箭必如闪电射出
  rationale: “射出”在汉语中自然呈现箭发出的动作，“如闪电”保留迅疾而明亮的比喻。
- source_word: אֲדֹנָי יְהוִה
  choice: 主雅威
  rationale: 分别保留“主”这一称号和“雅威”这一专名，不因汉语习惯而省去其中一项。
- source_word: בַּשּׁוֹפָר יִתְקָע
  choice: 吹响号角
  rationale: שופר是用于礼仪或作战信号的角号；正文用普通读者易懂的“号角”，脚注补充其具体性质。
- source_word: וְהָלַךְ
  choice: 行进
  rationale: 比笼统的“行走”更符合本节神圣战士的场景，同时没有扩写为明确的攻击行动。
- source_word: בְּסַעֲרוֹת תֵימָן
  choice: 在南方的旋风中
  rationale: סערות用“旋风”保留强烈的风暴意象；תימן可指“南方”，但也可能是地名“提幔”，故将另一读法收入脚注。
theological_decisions:
- issue: 神名יְהוָה及组合אֲדֹנָי יְהוִה的译法
  choice: 雅威……主雅威
  alternative: 耶和华……主耶和华；上主……主上帝
  rationale: 正文保留神的专名，并在组合称谓中同时呈现“主”和专名，不以称号取代原文的四字神名。
- issue: “他们”所指及雅威显现的位置或对象
  choice: 在他们上方显现
  alternative: 向他们显现；攻击他们
  rationale: 原文עֲלֵיהֶם本身没有明确解决“他们”是神的百姓还是敌人；空间性的译法保留神临于战场上方的图景和指代上的张力。
- issue: תֵימָן是方向词还是地名
  choice: 南方
  alternative: 提幔
  rationale: 在风暴和神圣战士的诗歌图景中，“南方”通顺且合乎该词用法；但地名解释在词汇上真实可行，因此不应被消除。
translation_notes:
  register: 采用现代、庄重而清楚的书面汉语。句式保持先知诗歌的紧凑和战场神显意象；避免古奥表达，也不把原文中“他们”的指代或“提幔／南方”的歧义写死。
