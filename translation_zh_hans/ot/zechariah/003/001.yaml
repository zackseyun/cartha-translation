  text: וַ/יַּרְאֵ֗/נִי אֶת יְהוֹשֻׁ֨עַ֙ הַ/כֹּהֵ֣ן הַ/גָּד֔וֹל עֹמֵ֕ד לִ/פְנֵ֖י מַלְאַ֣ךְ יְהוָ֑ה וְ/הַ/שָּׂטָ֛ן עֹמֵ֥ד עַל יְמִינ֖/וֹ לְ/שִׂטְנֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/003/001.yaml
  text: Then he showed me Joshua the high priest standing before the angel of Yahweh[a], and the Accuser standing at his right hand to accuse him.
translation:
  language: zh_hans
  text: 他让我看见大祭司约书亚站在耶和华的使者面前；那控告者站在约书亚的右边，要控告他。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “那控告者……控告他”也可译作“撒但……敌对他”。希伯来文为“那撒但”；这个带定冠词的词可作称号，意为“控告者”或“敌对者”。
    reason: 保留 הַשָּׂטָן 可理解为称号或专名的可能性，并反映其与“控告”同根的动词用法。
lexical_decisions:
- source_word: וַיַּרְאֵנִי
  choice: 他又让我看见
  rationale: 使役式在此意为“使我看见、让我看见”。用“又”承接异象叙事，表达自然，同时不过度限定为严格的时间先后。
- source_word: יְהוֹשֻׁעַ
  choice: 约书亚
  rationale: 按希伯来文专名 יְהוֹשֻׁעַ 采用现代中文圣经中通行且易懂的译名“约书亚”。
- source_word: הַכֹּהֵן הַגָּדוֹל
  choice: 大祭司
  rationale: 这是该以色列宗教职分在现代中文中的标准译法，准确而自然。
- source_word: עֹמֵד לִפְנֵי
  choice: 站在……面前
  rationale: 保留分词所描写的站立状态，并以“面前”传达空间位置及可能的审理场景意味，而不将后者明说。
- source_word: מַלְאַךְ יְהוָה
  choice: 耶和华的使者
  rationale: מַלְאָךְ 的基本义为“使者”，在异象语境中可指天使；“使者”保留原词的语义宽度。神名 יְהוָה 依现代中文惯例音译为“耶和华”。
- source_word: הַשָּׂטָן
  choice: 那控告者
  rationale: 该词带定冠词，在此更自然地表示一种角色或称号。上下文具有审理色彩，同根动词也指控告，故译作“那控告者”，同时以脚注保留“撒但／敌对者”的可能表达。
- source_word: עַל יְמִינוֹ
  choice: 站在约书亚的右边
  rationale: 希伯来文代词所指在句法上可能引起轻微歧义；按场景最自然地理解为约书亚的右边。正文明确所指以避免中文代词含混，但不进一步解释该位置的法律意义。
- source_word: לְשִׂטְנוֹ
  choice: 要控告他
  rationale: 该不定式与 הַשָּׂטָן 同根，在当前审理语境中“控告”最贴切；“要”自然表达目的。
theological_decisions:
- issue: הַשָּׂטָן 是专名还是角色称号
  choice: 正文译作“那控告者”
  alternative: “撒但”或“那敌对者”
  rationale: 定冠词和同根动词 לְשִׂטְנוֹ 都支持在本节凸显“控告者”这一角色。这样不预先断定其仅为专名，也不否认读者可能将其认作撒但；其他译法列入脚注。
- issue: מַלְאַךְ 在此译作“使者”还是“天使”
  choice: 耶和华的使者
  alternative: 耶和华的天使
  rationale: 原词兼有“使者”和“天使”的语义。“使者”更形式对应，也保留其身份表达上的宽度，不额外解决经文本身未明说的问题。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。以分号呈现异象中的两个并列人物和动作；第二处以“约书亚”替代可能含混的“他”，使中文指代清楚。脚注标记置于相关整句之后。
