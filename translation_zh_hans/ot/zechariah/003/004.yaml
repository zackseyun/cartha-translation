base_translation:
  language: en
  yaml_path: translation/ot/zechariah/003/004.yaml
  text: And he answered and said to those standing before him[a], “Remove the filthy garments from upon him.” Then he said to him, “See, I have taken your iniquity away from upon you[b], and I will clothe you with fine garments.”
translation:
  language: zh_hans
  text: 他回答，对站在他面前的那些人[a]说：“把他身上的污秽衣服脱下来。”他又对约书亚说：“看，我已经除去了你的罪孽；我要给你穿上华美的衣服[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “站在他面前的那些人”很可能是异象中天上的侍立者；希伯来文没有进一步说明他们的身份。
    reason: 保留描述性原文，并说明语境所暗示但未明说的身份。
  - marker: b
    text: “华美的衣服”也可译作“华贵的衣服”。本句的希伯来文形式也有人理解为命令：“要给他穿上华美的衣服。”
    reason: 说明מַחֲלָצוֹת的词义范围，并保留וְהַלְבֵּשׁ在句法和元音划分上的真实歧义。
lexical_decisions:
- source_word: וַיַּעַן וַיֹּאמֶר
  choice: 他回应……说
  rationale: 保留ענה所表达的“回应”语气，同时用现代汉语自然的叙事句式，避免生硬重复为“回答说”。
- source_word: הָעֹמְדִים לְפָנָיו
  choice: 站在他面前的那些人
  rationale: 按希伯来文作描述性翻译，不直接增译为“天使”或“侍从”，以保留其身份在本节中的含蓄性。
- source_word: הַבְּגָדִים הַצֹּאִים
  choice: 污秽的衣服
  rationale: צֹאִים表示极其肮脏、不洁；“污秽”既保留强烈意象，也适合本节礼仪与道德象征相互关联的语境。
- source_word: הָסִירוּ ... מֵעָלָיו
  choice: 把他身上……脱下来
  rationale: 以自然汉语表达复数命令和“从他身上除去”的具体动作，并保留衣物被脱去的画面。
- source_word: רְאֵה
  choice: 看
  rationale: 保留命令式提示语，呼唤约书亚注意外在行动所宣告的意义。
- source_word: הֶעֱבַרְתִּי מֵעָלֶיךָ עֲוֺנֶךָ
  choice: 我已经除去了你的罪孽
  rationale: העביר在此表示使之离去、除去；עון可指罪孽、罪责或罪罚，“罪孽”保留较宽的道德与责任内涵，不把意义缩窄为单一概念。
- source_word: מַחֲלָצוֹת
  choice: 华美的礼服
  rationale: 该复数名词指贵重、庄重的服装；“华美的礼服”表达尊荣与正式性质，又不擅自限定为某一种祭司服饰。
- source_word: וְהַלְבֵּשׁ אֹתְךָ
  choice: 我要给你穿上
  rationale: 按上下文把这一形式理解为说话者继续宣告将为约书亚穿衣；正文采用通顺汉语，形态上的解释空间另见脚注。
theological_decisions:
- issue: 更换衣服的象征意义
  choice: 保留“脱去污秽衣服—除去罪孽—穿上华美礼服”的经文意象，不加入系统神学术语
  alternative: 直接解释为称义、赦罪或祭司职分的恢复
  rationale: 本节本身明确把脱去污秽衣服与除去罪孽联系起来，但没有在此将其完整界定为某一后期教义范畴。
- issue: 站在他面前者的身份
  choice: 描述为“站在他面前的那些人”
  alternative: 译作“侍从”或“天使”
  rationale: 异象语境很可能指天上的侍立者，但希伯来文本在这里使用的是描述性短语，并未明说其身份。
- issue: וְהַלְבֵּשׁ的句法与施事者
  choice: 正文译为第一人称宣告“我要给你穿上”
  alternative: 理解为对众侍立者的命令：“要给他穿上”
  rationale: 马所拉元音所示形式可按不定式绝对形与前句相承理解，支持说话者继续宣告；但古代译本及可能的另一种元音划分支持复数命令，因此以脚注保留异读。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“回应……说”“除去罪孽”保留经文叙事与神学分量；“脱下来”“给你穿上”使衣物意象在汉语中具体自然。明确重复“约书亚”，以消除连续男性代词在汉语中的指向歧义；此人名由上下文确定，并未改变所指。
