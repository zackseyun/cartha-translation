  yaml_path: translation/ot/zechariah/003/006.yaml
  text: Then the angel of Yahweh solemnly charged Joshua[a], saying,
translation:
  language: zh_hans
  text: 雅威的天使[a]郑重嘱咐约书亚说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“使者”。希伯来语מַלְאָךְ既可指“天使”，也可指一般的“使者”；这里的异象语境较适合译作“天使”。
    reason: 保留原词的词义范围及其在本节中的真实歧义。
lexical_decisions:
- source_word: וַיָּעַד
  choice: 郑重告诫
  rationale: 该动词在此表示正式而严肃地提出告诫或嘱咐；“郑重告诫”既传达话语的分量，也符合现代汉语表达。叙事承接关系由语序自然体现，不另加“然后”。
- source_word: מַלְאַךְ יְהוָה
  choice: 雅威的天使
  rationale: מַלְאַךְ既可指一般“使者”，也可指天上的“天使”；在先知异象的语境中，“天使”较为自然，同时以脚注保留另一种可能。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以“雅威”音译四字神名，表明原文直接使用了以色列上帝的圣约之名。
- source_word: בִּיהוֹשֻׁעַ
  choice: 告诫约书亚
  rationale: 介词ב与动词יעד连用，可标示接受告诫的人；汉语用直接宾语“约书亚”最自然。
- source_word: לֵאמֹר
  choice: 说
  rationale: 这是引出下文直接引语的常用希伯来语格式；“说”简洁保留了与下一节话语的衔接。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华／上主
  rationale: 原文使用四字神名，音译“雅威”可直接保留其专名性质，而不以头衔替代。
- issue: מַלְאַךְ的身份表达
  choice: 天使
  alternative: 使者
  rationale: 异象场景支持“天使”，但该词本身并不排除“使者”的词义，因此不在正文或脚注中进一步界定其身份。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“郑重告诫”体现正式、严肃的语气；句末用冒号承接下一节的直接引语。
