  text: שְֽׁמַֽע נָ֞א יְהוֹשֻׁ֣עַ הַ/כֹּהֵ֣ן הַ/גָּד֗וֹל אַתָּה֙ וְ/רֵעֶ֨י/ךָ֙ הַ/יֹּשְׁבִ֣ים לְ/פָנֶ֔י/ךָ כִּֽי אַנְשֵׁ֥י מוֹפֵ֖ת הֵ֑מָּה כִּֽי הִנְ/נִ֥י מֵבִ֛יא אֶת עַבְדִּ֖/י צֶֽמַח־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/003/008.yaml
  text: Hear now[a], Joshua the high priest, you and your companions who sit before you, for they are men of a sign; for behold, I am bringing my servant, the Branch.
translation:
  language: zh_hans
  text: “大祭司约书亚啊，你和坐在你面前的同伴，现在要听：他们是作为预兆的人[a]。看哪，我要带来我的仆人‘苗芽’。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“作为记号的人”或“预兆之人”。
    reason: 保留 אַנְשֵׁי מוֹפֵת 的紧凑结构，并提示 מוֹפֵת 可指记号、预兆或奇异之事。
lexical_decisions:
- source_word: שְׁמַע נָא
  choice: 现在请听
  rationale: 命令式加语气词 נָא 构成郑重而迫切的呼唤；“现在请听”兼顾语气与现代汉语自然度。
- source_word: יְהוֹשֻׁעַ הַכֹּהֵן הַגָּדוֹל
  choice: 大祭司约书亚
  rationale: 采用现代中文通行人名和祭司职衔；呼格以“啊”明确呈现。
- source_word: וְרֵעֶיךָ
  choice: 你的同伴
  rationale: רֵעַ 在此指与约书亚共同在场、相关联的人，不必限定为亲密朋友。
- source_word: הַיֹּשְׁבִים לְפָנֶיךָ
  choice: 坐在你面前的
  rationale: 保留空间或侍立听命层面的开放性，不具体解释其职位。
- source_word: אַנְשֵׁי מוֹפֵת
  choice: 预兆性的人物
  rationale: מוֹפֵת 可指征兆、奇事或预兆；此译表达这些人本身具有象征、预示作用，同时以脚注保存较直译的可能。
- source_word: הִנְנִי
  choice: 看哪
  rationale: 保留神谕宣告的郑重、引人注意的语气。
- source_word: מֵבִיא
  choice: 我必使……来到
  rationale: הִנְנִי 加分词表达即将发生且确定的行动；中文用“必”传达确定性，以“使……来到”表达 bring 的使动意味。
- source_word: עַבְדִּי
  choice: 我的仆人
  rationale: 准确表达受差遣、服事者的身份，不额外引入奴役含义。
- source_word: צֶמַח
  choice: ‘苗裔’
  rationale: צֶמַח 本义涉及萌芽、生长之物，在先知语境中又具有称号性；“苗裔”兼顾植物意象、后裔联想与中文圣经语体，引号提示称号用法而不直接扩展其身份。
theological_decisions:
- issue: צֶמַח 是称号还是普通名词
  choice: 译作带引号的称号“苗裔”
  alternative: 嫩芽；枝子；苗
  rationale: 本节与“我的仆人”并列，并与先知书中对将来人物的用法呼应，具有称号性；但不在译文中直接加上“弥赛亚”或“大卫之王”等解释。
- issue: אַנְשֵׁי מוֹפֵת 的象征性质如何表达
  choice: 预兆性的人物
  alternative: 作为预兆的人；奇兆之人；成为记号的人
  rationale: 原文紧凑且可涵盖“他们是预兆”或“他们具有预兆意义”；正文采用自然但不过度展开的表达，脚注列出主要语义可能。
- issue: מֵבִיא 的时态和体貌
  choice: 我必使……来到
  alternative: 我正在使……来到；我要带来
  rationale: 希伯来语 הִנְנִי 加分词兼具临近感和确定性。现代中文难以同时完整呈现，采用“必”强调神谕中的确定性，不武断限定具体时间。
translation_notes:
  register: 采用现代、庄重而易懂的先知书语体。“看哪”保留神谕色彩；“苗裔”作为称号置于引号内。正文中的脚注标记 [a] 与脚注完全对应。
