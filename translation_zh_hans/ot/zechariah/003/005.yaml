  text: וָ/אֹמַ֕ר יָשִׂ֛ימוּ צָנִ֥יף טָה֖וֹר עַל רֹאשׁ֑/וֹ וַ/יָּשִׂימוּ֩ הַ/צָּנִ֨יף הַ/טָּה֜וֹר עַל רֹאשׁ֗/וֹ וַ/יַּלְבִּשֻׁ֨/הוּ֙ בְּגָדִ֔ים וּ/מַלְאַ֥ךְ יְהוָ֖ה עֹמֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/003/005.yaml
  text: Then I said[a], “Let them put a clean turban on his head.” So they put the clean turban on his head and clothed him with garments[c][b], while the angel of Yahweh was standing by.
translation:
  language: zh_hans
  text: 我就说[a]：“要把一顶洁净的冠巾戴在他头上。”于是，他们把那顶洁净[b]的冠巾戴在他头上，又给他穿上衣服；当耶和华的使者[c]站在旁边的时候。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我又说。”希伯来语连接词可简单译为“又”或“和”；正文的“就”体现叙事的推进。
    reason: lexical_alternative
  - marker: b
    text: “洁净”也可译为“纯净”，这里侧重礼仪上的洁净。
    reason: lexical_alternative
  - marker: c
    text: “耶和华的使者”按原文直译。对于这位使者是受造的天使，还是耶和华的一次显现，解释者看法不一。
    reason: alternative_reading
lexical_decisions:
- source_word: וָאֹמַר
  choice: 我就说
  rationale: 叙事性的连续式推动情节发展；“就”自然表达先后进展，同时保留第一人称。
- source_word: יָשִׂימוּ
  choice: 要给他……戴
  rationale: 第三人称复数祈愿式表达请求或命令；汉语用“要”简洁自然地传达这一语气。
- source_word: צָנִיף
  choice: 冠巾
  rationale: 该词指缠裹于头上的头饰，在本段具有祭司或官职语境；“冠巾”既保留头巾形制，也具有庄重语体，且不把它过度限定为后世特定礼冠。
- source_word: טָהוֹר
  choice: 洁净
  rationale: 在祭司复职场景中主要表达礼仪上的洁净；“洁净”比单纯表示外观干净更能保留其礼仪含义。
- source_word: עַל רֹאשׁוֹ
  choice: 在他头上
  rationale: 直接保留原文的方位关系。
- source_word: וַיָּשִׂימוּ
  choice: 于是，他们……戴
  rationale: 连续式表示所吩咐之事随即实现；“于是”使汉语叙事顺畅，并呈现行动结果。
- source_word: הַצָּנִיף הַטָּהוֹר
  choice: 那顶洁净的冠巾
  rationale: 保留定指和前句词语的重复，以维持原文的强调和叙事连贯。
- source_word: וַיַּלְבִּשֻׁהוּ בְּגָדִים
  choice: 又给他穿上衣服
  rationale: 使役动词表示使某人穿衣；此译符合现代汉语，同时保留复职、恢复尊荣的动作意象。
- source_word: בְּגָדִים
  choice: 衣服
  rationale: 该名词本身泛指衣物；不译作“祭司礼服”，以免加入本句未明确说明的限定。
- source_word: וּמַלְאַךְ יְהוָה
  choice: 耶和华的使者
  rationale: 按字面透明翻译，不预先判定这位使者是受造天使还是耶和华的显现。连接词结合分词可理解为伴随情形。
- source_word: עֹמֵד
  choice: 站在旁边
  rationale: 分词表示持续姿态；“站在旁边”既体现动作持续，也表达其在场守候。
theological_decisions:
- issue: מַלְאַךְ יְהוָה（耶和华的使者）的身份
  choice: 直译为“耶和华的使者”，不进一步界定其身份
  alternative: 将其明确解释为受造的天使，或明确解释为耶和华亲自显现
  rationale: 希伯来语短语本身未在本节解决这一神学问题；直译可保留文本中的真实张力，避免把某一种解释写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。叙事连接用“就”“于是”“又”保持自然流畅；“冠巾”保留古代头饰的庄重感而不过度具体化；“衣服”避免擅自增添“祭司礼服”等原文此处未明说的信息。所有注脚标记均置于对应正文词语之后。
