  naturalness: 整体庄重、可朗读。“因为，看哪”在先知宣告体中可以成立；“在一日之间”略显书面，但自然且准确。“雕刻它的纹饰”虽未逐字重现同根表达，中文正文可接受，宜以脚注交代原文的同根措辞。
  terminology: “约书亚”“罪孽”“万军”均合适。为遵循本项目对יהוה的专名处理及英语审校轨迹，“万军之耶和华”应改为“万军之雅威”。“宣告说”比单独的“说”更能体现נְאֻם这一先知宣告公式。
