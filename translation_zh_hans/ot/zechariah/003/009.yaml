source:
  edition: WLC
  text: כִּ֣י הִנֵּ֣ה הָ/אֶ֗בֶן אֲשֶׁ֤ר נָתַ֨תִּי֙ לִ/פְנֵ֣י יְהוֹשֻׁ֔עַ עַל אֶ֥בֶן אַחַ֖ת שִׁבְעָ֣ה עֵינָ֑יִם הִנְ/נִ֧י מְפַתֵּ֣חַ פִּתֻּחָ֗/הּ נְאֻם֙ יְהוָ֣ה צְבָא֔וֹת וּ/מַשְׁתִּ֛י אֶת עֲוֺ֥ן הָ/אָֽרֶץ הַ/הִ֖יא בְּ/י֥וֹם אֶחָֽד׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/003/009.yaml
  text: For behold[a], the stone that I have set before Joshua—on one stone are seven eyes. Behold, I myself will engrave its engraving, declares Yahweh of Armies[b], and I will remove the iniquity of that land in a single day.
translation:
  language: zh_hans
  text: 因为，看哪[a]，我安放在约书亚面前的那块石头——在一块石头上有七只眼睛。看哪，我要亲自雕刻它的纹饰——万军之雅威宣告说[b]——并且要在一日之间除去那地的罪孽。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “看哪”是先知话语中用来提醒人注意的庄重用语。
    reason: 说明现代读者可能觉得古雅的语篇标记。
  - marker: b
    text: “万军之雅威”中的“雅威”对应希伯来文的神名；“万军”可指天上或地上的众军。原文“雕刻它的纹饰”使用同根词，直译可作“雕刻它的雕刻”。
    reason: 说明神名及称号的译法，并交代“雕刻它的纹饰”所保留的原文同根措辞。
lexical_decisions:
- source_word: כִּי הִנֵּה
  choice: 因为，看哪
  rationale: כִּי承接并说明上文，译作“因为”；הִנֵּה是引人注意的先知性提示语，保留庄重的“看哪”而不弱化为普通的“看”。
- source_word: הָאֶבֶן אֲשֶׁר נָתַתִּי לִפְנֵי יְהוֹשֻׁעַ
  choice: 我安放在约书亚面前的那块石头
  rationale: נתן在此结合לִפְנֵי表示放置、安放；“安放”自然且保留有意设置之意。定冠词以“那块”体现。
- source_word: עַל אֶבֶן אַחַת שִׁבְעָה עֵינָיִם
  choice: 在这一块石头上有七只眼睛
  rationale: 照原文保留突兀而象征性的“石头”与“七只眼睛”，不在译文中解释其所指；אַחַת强调是一块石头，译作“这一块”。
- source_word: הִנְנִי מְפַתֵּחַ פִּתֻּחָהּ
  choice: 看哪，我要亲自雕刻它的纹饰
  rationale: הִנְנִי带有强调和即将行动的语气，以“看哪，我要亲自”表达；分词在此取临近将来意义。מְפַתֵּחַ与פִּתֻּחָהּ为同根表达，中文若机械重复会生硬，故以“雕刻它的纹饰”兼顾动作与刻成的图纹，同时在脚注说明直译。
- source_word: נְאֻם יְהוָה צְבָאוֹת
  choice: 万军之耶和华说
  rationale: נְאֻם是先知宣告公式，汉语以“说”自然表达；יְהוָה按专名译作“耶和华”，צְבָאוֹת采用汉语圣经传统且通顺的“万军之”。
- source_word: וּמַשְׁתִּי אֶת עֲוֺן הָאָרֶץ הַהִיא
  choice: 并且要……除去那地的罪孽
  rationale: 该动词在此语境表示移除；עָוֹן可指罪孽、罪责或刑罚，选“罪孽”保留其道德与责任层面的宽度，不缩窄为主观罪疚。הַהִיא明确译为“那地”。
- source_word: בְּיוֹם אֶחָד
  choice: 在一日之间
  rationale: 既体现“一日”之限定，也以自然汉语传达行动将在单独一天内完成。
theological_decisions:
- issue: 石头和七只眼睛的象征意义
  choice: 在正文中按字面保留“石头”和“七只眼睛”，不指明其象征对象。
  alternative: 在译文中直接解释为弥赛亚或耶和华的全知。
  rationale: 希伯来文本在本节没有明说象征所指；直译意象可保存经文的含混性和神学张力，避免将解释写入正文。
- issue: עָוֹן的语义范围
  choice: 罪孽
  alternative: 罪责
  rationale: 该词能够涵盖罪恶行为、罪责及其后果；“罪孽”在本句中保留较宽的道德含义，而“罪责”会更偏向法律地位。
- issue: 神名יְהוָה צְבָאוֹת的处理
  choice: 万军之耶和华
  alternative: 万军之主／军队之雅威
  rationale: “耶和华”在现代中文圣经语境中是该专名广为人知的表达，“万军之”传达צְבָאוֹת，同时不把专名改成称号“主”。
translation_notes:
  register: 采用现代、庄重而可朗读的普通话。保留先知宣告中的“看哪”和象征意象；用破折号呈现原文较突兀的插入式宣告。所有脚注标记均已置于正文对应位置。
