source:
  edition: WLC
  text: כֹּה אָמַ֞ר יְהוָ֣ה צְבָא֗וֹת אִם בִּ/דְרָכַ֤/י תֵּלֵךְ֙ וְ/אִ֣ם אֶת מִשְׁמַרְתִּ֣/י תִשְׁמֹ֔ר וְ/גַם אַתָּה֙ תָּדִ֣ין אֶת בֵּיתִ֔/י וְ/גַ֖ם תִּשְׁמֹ֣ר אֶת חֲצֵרָ֑/י וְ/נָתַתִּ֤י לְ/ךָ֙ מַהְלְכִ֔ים בֵּ֥ין הָ/עֹמְדִ֖ים הָ/אֵֽלֶּה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/003/007.yaml
  text: 'Thus says Yahweh of hosts: If you walk in my ways and if you keep my charge[a], then you also shall govern my house and also keep my courts, and I will give you free access among these who are standing here.'
translation:
  language: zh_hans
  text: 万军之雅威如此说：“你若遵行我的道路，若谨守我的职守，你也必治理我的殿，也必看守我的院落；我还要让你在这些侍立者中自由出入。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “自由出入”或译“可在这些侍立者中通行”。这句希伯来文也可理解为“使你成为在这些侍立者中行走的人”，或“赐给你可在这些侍立者中行走的地方”。
    reason: 希伯来文מַהְלְכִים罕见，其词义和句法关系存在多种合理解释。
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: 万军之雅威
  rationale: 用“雅威”音译神的专名，以区别于“主”等称号；“万军之”保留צְבָאוֹת在神圣称号中的广泛含义，不局限于地上的军队。
- source_word: בִּדְרָכַי תֵּלֵךְ
  choice: 遵行我的道路
  rationale: 保留“道路”这一盟约伦理隐喻，同时用“遵行”自然表达按神的道路生活，而非仅指实际步行。
- source_word: מִשְׁמַרְתִּי תִשְׁמֹר
  choice: 谨守我所托付你的职责
  rationale: מִשְׁמֶרֶת在祭司语境中可指受托的职守或责任；此译法比泛称“命令”更能体现受托履职的含义。
- source_word: תָּדִין אֶת־בֵּיתִי
  choice: 治理我的殿
  rationale: דִּין在此可表示审理、管理或治理；上下文涉及圣殿祭司职分，“治理”能涵盖管理监督，不将意义缩窄为司法审判。“殿”则自然体现בֵּיתִי在本段的圣殿所指。
- source_word: תִשְׁמֹר אֶת־חֲצֵרָי
  choice: 看守我的院宇
  rationale: חֲצֵרַי指圣殿的院落；“院宇”庄重而可懂，“看守”保留受托照管、守卫之意。
- source_word: מַהְלְכִים
  choice: 自由出入
  rationale: 该词罕见且有争议。结合神圣议庭中“侍立者”的场景，“自由出入”自然表达获准通行、接近神面前的特权，但不把其具体机制说得过死。
- source_word: בֵּין הָעֹמְדִים הָאֵלֶּה
  choice: 在这些侍立者中
  rationale: “侍立者”既保留站立的形象，也体现这些存在在异象中侍候于神面前；不在正文中明说他们必定是天使，以免超出原文。
- source_word: וְגַם ... וְגַם
  choice: 也必……也必
  rationale: 重复“也必”保留原文递进、强调的应许结构。
theological_decisions:
- issue: וְנָתַתִּי לְךָ מַהְלְכִים בֵּין הָעֹמְדִים הָאֵלֶּה所表达的应许
  choice: 神将准许约书亚在这些侍立者中自由出入
  alternative: 神赐给他在侍立者中行走的人，或赐他可在其中行走的地方
  rationale: 异象场景支持“获准进入或通行于天上侍立者中”的理解，但מַהְלְכִים的形式和具体所指确有争议，因此正文采用较可能且自然的读法，脚注保留其他语法和词义可能。
- issue: “这些侍立者”的身份
  choice: 正文仅称“侍立者”
  alternative: 明确译作“天使”或“天上的侍从”
  rationale: 上下文很可能指神面前的天上侍从，但本节没有直接使用“天使”一词；保留原文称谓可避免把合理推断写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“谨守我所托付你的职责”体现祭司受托职分；“治理我的殿”“看守我的院宇”保持圣殿语境。“自由出入”是自然汉语，同时借脚注保存原文难点。
