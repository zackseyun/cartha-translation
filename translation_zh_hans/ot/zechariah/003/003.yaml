base_translation:
  language: en
  yaml_path: translation/ot/zechariah/003/003.yaml
  text: Joshua was clothed with filthy garments and was standing before the angel[a][b][c].
translation:
  language: zh_hans
  text: 约书亚[a]穿着污秽[b]的衣服，站在那位天使[c]面前。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“而约书亚”。希伯来语句首的连接词用于承接叙事；汉语正文也可不把它明说出来。
    reason: lexical_alternative
  - marker: b
    text: “污秽”所译的词形容衣服处于极其肮脏、不洁的状态；也可译作“肮脏”，但语气可能稍弱。
    reason: lexical_alternative
  - marker: c
    text: 或译：“那位使者”。在这个异象的语境中，译作“天使”更自然。
    reason: alternative_reading
lexical_decisions:
- source_word: וִ/יהוֹשֻׁעַ
  choice: 约书亚
  rationale: וְ在这里承接异象叙事；现代汉语可凭上下文自然衔接，不必添加原文没有的明确时间词。“约书亚”采用通行的圣经人名译法。
- source_word: הָיָה
  choice: （由“穿着”体现过去状态）
  rationale: 此处היה是系词，描述约书亚当时所处的状态，并非表示他变成了某种状态；汉语无需另译“是”。
- source_word: לָבֻשׁ
  choice: 穿着
  rationale: 表达被动、持续的着装状态；现代汉语中“穿着”自然清楚，也保留状态性的含义。
- source_word: בְּגָדִים
  choice: 衣服
  rationale: 这是泛指衣物的普通名词；“衣服”准确自然，“袍服”会把词义限定得过窄。
- source_word: צוֹאִים
  choice: 污秽
  rationale: 该词表示严重、令人厌恶的不洁；“污秽”比“弄脏”更有力度，又不直接加入礼仪或神学层面的解释。
- source_word: וְ/עֹמֵד
  choice: 站着
  rationale: 分词表示与穿衣状态同时持续的姿态；汉语“站着”自然体现持续性，句中的逗号也足以承接前一分句。
- source_word: לִ/פְנֵי
  choice: 在……面前
  rationale: 准确表达处于某位对象面前或其临在之中的空间关系，也符合异象场景。
- source_word: הַ/מַּלְאָךְ
  choice: 那位天使
  rationale: מלאך本可指“使者”，但在此异象的天上场景中译作“天使”最自然；“那位”体现定冠词及上下文中已出现的特定对象。
theological_decisions:
- issue: הַמַּלְאָךְ所指对象的身份
  choice: 那位天使
  alternative: 那位使者；或结合上下文理解为“耶和华的使者”
  rationale: 本节原文只写带定冠词的“天使／使者”，没有在本节中再次加上“耶和华的”，因此正文不进一步认定其神学身份，保留上下文解释空间。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“污秽”保留原文强烈的不洁意象；“那位天使”体现特指，却不在本节中擅自补入更明确的神学身份。句式简洁，符合异象叙事的推进方式。
