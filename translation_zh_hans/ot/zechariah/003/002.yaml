  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל הַ/שָּׂטָ֗ן יִגְעַ֨ר יְהוָ֤ה בְּ/ךָ֙ הַ/שָּׂטָ֔ן וְ/יִגְעַ֤ר יְהוָה֙ בְּ/ךָ֔ הַ/בֹּחֵ֖ר בִּ/ירֽוּשָׁלִָ֑ם הֲ/ל֧וֹא זֶ֦ה א֖וּד מֻצָּ֥ל מֵ/אֵֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/003/002.yaml
  text: And Yahweh said to the Accuser[a], “Yahweh rebuke you, O Accuser! Indeed, Yahweh, who has chosen Jerusalem[b], rebuke you! Is not this a brand snatched from the fire?”
translation:
  language: zh_hans
  text: 雅威对那控告者[a]说：“控告者啊，愿雅威斥责你！愿拣选耶路撒冷的雅威斥责你！这岂不是从火中救出来的一根柴[b]吗？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 传统译作“撒但”。希伯来文在这里带定冠词，意思是“那控告者”。
    reason: alternative_reading
  - marker: b
    text: 也可译作“从火中救出的一根燃木”或“火把”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 以音译保留上帝向以色列启示的专名，不以“主”这一称号替代。
- source_word: הַשָּׂטָן
  choice: 那控告者／控告者啊
  rationale: 原文带定冠词，在异象的审判场景中首先表示职分或称号，而不只是专名；“控告者”既传达词义，也符合上下文。
- source_word: יִגְעַר
  choice: 愿……斥责你
  rationale: 该动词在此表示带有权威的严厉申斥；未完成式在直接话语中具有祈愿或命令意味，因此用“愿”保留其语气。
- source_word: הַבֹּחֵר בִּירוּשָׁלִָם
  choice: 拣选耶路撒冷的
  rationale: 带冠词的分词用作对雅威的限定，表达其具有标志性的拣选行动；此译法自然且不强行限定为过去或现在时。
- source_word: הֲלוֹא
  choice: 这岂不是……吗
  rationale: 保留期待肯定回答的反问语气。
- source_word: אוּד
  choice: 一根焦木
  rationale: 指尚在燃烧或已经烧焦的木柴；“焦木”在现代汉语中简洁地呈现几乎被火焚尽的意象。
- source_word: מֻצָּל מֵאֵשׁ
  choice: 从火中抢救出来的
  rationale: 原文为被动形式，基本义是“被搭救”；“抢救出来”兼顾被动结果与险中获救的鲜明画面。
theological_decisions:
- issue: הַשָּׂטָן 是专名还是职分称号
  choice: 正文译作“那控告者”
  alternative: “撒但”或“那敌对者”
  rationale: 希伯来文带定冠词，并在法庭式异象中发挥控告的角色；正文保留称号的词义，传统专名译法列入脚注。
- issue: 雅威亲自说“愿雅威斥责你”的第三人称表达
  choice: 保留两次“愿雅威斥责你”，不改写人称，也不合并重复
  alternative: 改为“我斥责你”或将两句合并
  rationale: 原文明确保留雅威之名并重复斥责公式，具有庄严、司法性的强调；不应为行文顺畅而消除其中的神学张力。
- issue: הַבֹּחֵר 的时间指向
  choice: 译作“拣选耶路撒冷的”，不添加明确时态
  alternative: “曾拣选耶路撒冷的”或“正在拣选耶路撒冷的”
  rationale: 希伯来分词可描述特征性或持续性的行动；中文无时态标记的定语结构可保留这种开放性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“斥责”保留权威性的司法语气；用两个感叹句再现原文重复的力度。脚注标记均置于相应词语之后。
