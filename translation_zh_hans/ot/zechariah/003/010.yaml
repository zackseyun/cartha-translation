base_translation:
  language: en
  yaml_path: translation/ot/zechariah/003/010.yaml
  text: On that day[a], declares Yahweh of Armies[d][c][b], each of you will invite his neighbor under the vine and under the fig tree.
translation:
  language: zh_hans
  text: 在那日，万军之耶和华宣告：“你们各人都要邀请邻舍到葡萄树和无花果树下。”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “邀请”直译为“呼叫”；这里按上下文也可译作“各人都要招呼邻舍”。
    reason: lexical_alternative
  - marker: b
    text: 原文没有“自己的”一词。葡萄树和无花果树下的图景象征和平、安稳与兴盛；另见列王纪上4:25；弥迦书4:4。
    reason: textual_clarity_and_cross_reference
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: 到那日
  rationale: 这是先知书中常见的时间用语，指向上帝将来施行作为之时；“到那日”自然、庄重，也保留了预言公式的色彩。
- source_word: נְאֻם יְהוָה צְבָאוֹת
  choice: 万军之耶和华宣告说
  rationale: נְאֻם是先知性的宣告公式，译为“宣告说”；יהוה以音译“耶和华”呈现其专名，צְבָאוֹת采用中文圣经传统且通顺的“万军”。
- source_word: תִּקְרְאוּ
  choice: 你们……都要邀请
  rationale: 该动词基本义为“呼叫”，但与“各人向邻舍”及其后的地点短语连用，在此语境中自然表达邀请之意；“你们”保留第二人称复数。
- source_word: אִישׁ לְרֵעֵהוּ
  choice: 各人……邻舍
  rationale: אִישׁ在这里具有逐一分配的意义，译作“各人”；רֵעַ可指朋友、同伴或邻舍，此处“邻舍”适合共同享受和平安稳的图景。
- source_word: אֶל תַּחַת גֶּפֶן וְאֶל תַּחַת תְּאֵנָה
  choice: 到葡萄树和无花果树下
  rationale: 重复的אֶל与תַּחַת组合含有朝向某处的意味，因此用“到……下”。原文没有物主代词，不补入“自己的”。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 保留现代中文圣经读者最熟悉的专名形式“耶和华”，而不以“主”替代；“雅威”是较接近学术重构发音的另一选择。
- issue: 称号צְבָאוֹת的译法
  choice: 万军
  alternative: 众军
  rationale: “万军”是庄重而广为理解的中文称号，能涵盖天上和地上的军旅；“众军”更直白，却不如前者自然稳固。
- issue: 葡萄树与无花果树意象
  choice: 保留原有具体意象，不在正文中解释
  alternative: 意译为安享和平与繁荣
  rationale: 这些树下的安坐构成和平、安全和兴盛的经文意象；正文保留具象表达，以免把象征意义直接化约为解释。
translation_notes:
  register: 采用现代、庄重、易懂的普通话书面语。正文保留第二人称复数及“各人”的分配意味；不添加原文没有的物主代词，并用引号清楚标示耶和华的直接宣告。
