base_translation:
  language: en
  yaml_path: translation/ot/zechariah/005/002.yaml
  text: And he said to me[a], “What do you see?” And I said, “I see a flying scroll. Its length is twenty cubits, and its width is ten cubits.”
translation:
  language: zh_hans
  text: 他对我说：“你看见什么？”我说：“我看见一卷正在飞行的书卷，长二十肘[a]，宽十肘。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “肘”是古代常用的长度单位，大致相当于从肘部到指尖的距离。
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלַי
  choice: 他对我说
  rationale: 未完成式连续结构推进叙事；中文无需机械加入“然后”，用“他对我说”自然承接上文。
- source_word: מָה אַתָּה רֹאֶה
  choice: 你看见什么？
  rationale: 分词 רֹאֶה 在异象问答中表示当下所见；“你看见什么”符合现代汉语习惯。
- source_word: וָאֹמַר אֲנִי רֹאֶה
  choice: 我说：“我看见
  rationale: 保留第一人称回答和当下感知，不把分词过度处理为进行体。
- source_word: מְגִלָּה עָפָה
  choice: 一卷飞行的书卷
  rationale: מְגִלָּה 指卷起的文书，译为“书卷”；עָפָה 描绘其飞行状态，保留异象的鲜明画面。量词“卷”使中文表达自然。
- source_word: אָרְכָּהּ עֶשְׂרִים בָּאַמָּה
  choice: 长二十肘
  rationale: 以简洁、自然的中文尺寸表达对应“它的长度为二十肘”，并保留原文古代长度单位。
- source_word: וְרָחְבָּהּ עֶשֶׂר בָּאַמָּה
  choice: 宽十肘
  rationale: 与“长二十肘”形成清楚对称，准确表达宽度并保留原单位。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言；保留“书卷”这一经文语境中通行且准确的词，同时用“长……宽……”避免生硬的翻译腔。脚注标记置于“肘”之后，使文化说明与所注单位直接对应。
