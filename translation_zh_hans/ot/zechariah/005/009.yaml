  text: וָ/אֶשָּׂ֨א עֵינַ֜/י וָ/אֵ֗רֶא וְ/הִנֵּה֩ שְׁתַּ֨יִם נָשִׁ֤ים יֽוֹצְאוֹת֙ וְ/ר֣וּחַ בְּ/כַנְפֵי/הֶ֔ם וְ/לָ/הֵ֥נָּה כְנָפַ֖יִם כְּ/כַנְפֵ֣י הַ/חֲסִידָ֑ה וַ/תִּשֶּׂ֨אנָה֙ אֶת הָ֣/אֵיפָ֔ה בֵּ֥ין הָ/אָ֖רֶץ וּ/בֵ֥ין הַ/שָּׁמָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/005/009.yaml
  text: Then I lifted up my eyes and saw[a], and behold, two women were coming out, and the wind was in their wings. They had wings like the wings of a stork[b], and they lifted up the ephah between the earth and the heavens.
translation:
  language: zh_hans
  text: 随后，我举目观看，只见两个女人正出来，风吹动着她们的翅膀。她们的翅膀像鹳鸟的翅膀；她们把伊法量器[a]抬到天地之间。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “伊法”是古代的标准干量单位；这里指异象中所见的量器，也可译作“量篮”。
    reason: 说明古代度量衡名称及其在异象中指容器的用法。
lexical_decisions:
- source_word: וָאֶשָּׂא עֵינַי
  choice: 随后，我举目观看
  rationale: 保留希伯来异象叙事中“举目”的惯用表达，同时用“随后”体现叙事次序，使现代汉语自然连贯。
- source_word: וָאֵרֶא וְהִנֵּה
  choice: 只见
  rationale: “只见”在现代汉语中自然地传达看见与 הִנֵּה 所带出的突然呈现场景，避免生硬重复“我看见，看哪”。
- source_word: שְׁתַּיִם נָשִׁים יֹצְאוֹת
  choice: 两个妇人出来
  rationale: 保留原文明确的数目、性别和进行中的视觉动作；“妇人”比“女人”略显庄重，又是普通读者熟悉的圣经叙事用语。
- source_word: וְרוּחַ בְּכַנְפֵיהֶם
  choice: 风吹在她们的翅膀中
  rationale: רוּחַ 可指“风”或“灵”；飞行、翅膀及鹳鸟的上下文首先支持“风”。译文尽量保留“在翅膀中”的具体图像，而不增添“托住”或“鼓动”等原文未明说的作用。
- source_word: וְלָהֵנָּה כְנָפַיִם כְּכַנְפֵי הַחֲסִידָה
  choice: 她们的翅膀像鹳鸟的翅膀
  rationale: 将希伯来语的领有结构化为自然汉语，并明确保留鹳鸟的比喻。
- source_word: וַתִּשֶּׂאנָה
  choice: 她们把……抬到
  rationale: נשׂא 可表示抬起或携带；此处描写空中运送，用“抬到”既体现上举动作，也与后面的空间位置自然衔接。
- source_word: אֶת־הָאֵיפָה
  choice: 伊法量器
  rationale: אֵיפָה 本是干量单位，在异象中也指相应的容器。“伊法量器”既保留关键专名和上下文连续性，又比单用音译“伊法”更便于普通读者理解。
- source_word: בֵּין הָאָרֶץ וּבֵין הַשָּׁמָיִם
  choice: 天地之间
  rationale: 这是希伯来语“地与天之间”的自然、凝练汉译；此处是宇宙性的空间对照，不宜把 הָאָרֶץ 译为某片“土地”。
theological_decisions:
- issue: 异象运送场景中 רוּחַ 的含义
  choice: 风
  alternative: 灵
  rationale: 翅膀、鹳鸟以及把量器抬到空中的连续图像首先指向实际的风。译作“灵”会在文本没有明确要求时强化神学性解释；保留“风”更符合眼前的具象场景。
- issue: 异象中 אֵיפָה 的译法
  choice: 伊法量器
  alternative: 篮子；量篮；伊法
  rationale: 原词首先是标准干量单位，又在本段指异象中的容器。主文保留“伊法”可维持关键意象的词汇连续性，加上“量器”则避免纯音译造成不必要的晦涩；脚注进一步说明其双重用法。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“举目观看”保留先知异象的表达色彩；“只见”自然传达场景突然显现。避免把异象符号作教派性解释，也不把“风”神学化为“灵”。脚注标记置于“伊法量器”之后，与注释内容准确对应。
