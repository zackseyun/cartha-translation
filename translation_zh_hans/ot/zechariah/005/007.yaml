  yaml_path: translation/ot/zechariah/005/007.yaml
  text: And behold[a], a lead disk was lifted up[b], and this was one woman sitting inside the ephah.
translation:
  language: zh_hans
  text: 看哪，一块铅制的圆盘[a]被举了起来；这是一位女子，坐在伊法量器里面[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“一块圆形铅块”“一块铅盘”；更直译可作“一他连得的铅”。希伯来语可指圆形的沉重铅块；在这里，它似乎用作伊法量器的盖子。
    reason: lexical_alternative
  - marker: b
    text: “伊法”是古代的一种干量单位，也可转指具有这一容量的容器，因此有些译本译作“篮子”。
    reason: cultural_note
lexical_decisions:
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留异象叙事中突然引出新景象的指示和感叹语气；用语庄重，也为现代读者所熟悉。
- source_word: כִּכַּר עֹפֶרֶת
  choice: 一块铅制的圆盘
  rationale: כִּכָּר可指圆形或饼状的重物；结合异象场景，译作“铅制的圆盘”既呈现其形状，也避免把它直接解释成“盖子”。其重量单位义和可能作为盖子的作用留在脚注中说明。
- source_word: נִשֵּׂאת
  choice: 被举了起来
  rationale: 按尼法勒被动形式表达圆盘被抬起的动作；“举了起来”自然呈现向上的动态。
- source_word: וְזֹאת
  choice: 而这里有
  rationale: 希伯来文是省略系词的指示结构，用来引出圆盘下显露的景象；“而这里有”在中文中自然，同时不额外判定动作主体。
- source_word: אִשָּׁה אַחַת
  choice: 一个女人
  rationale: 明确保留אַחַת“一”的成分，不弱化为泛指，也不解释为“某个”。
- source_word: יוֹשֶׁבֶת
  choice: 正坐着
  rationale: 直接表达分词所描写的持续姿态，并与异象中眼前所见的场景相称。
- source_word: בְּתוֹךְ הָאֵיפָה
  choice: 在伊法量器里面
  rationale: 保留אֵיפָה这一古代容量单位的专名，同时加“量器”表明此处也指盛装该容量的容器；“里面”自然表达בְּתוֹךְ。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而清楚的异象叙事语体。“看哪”保留先知文本的突显效果；“伊法量器”兼顾原文化术语与普通读者的可理解性。标点以分号区分圆盘被举起与女人显露这两个紧密相连的画面。
