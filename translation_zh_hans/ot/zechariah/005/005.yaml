base_translation:
  language: en
  yaml_path: translation/ot/zechariah/005/005.yaml
  text: Then the angel who was speaking with me went out and said to me[c][b][a], “Please lift up your eyes and see what this is that is coming out.”
translation:
  language: zh_hans
  text: 那位与我说话[b]的天使出来[a]，对我说：“请举目观看，这正在出来的是什么？[c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“出去”；原文动词יָצָא可表示“出来”或“出去”，方向取决于观察视角。
    reason: lexical_alternative
  - marker: b
    text: 原文直译是“在我里面说话”；这里是“与我说话”的惯用表达。
    reason: lexical_alternative
  - marker: c
    text: 也可译作：“这正在出去的是什么？”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: 出来
  rationale: יָצָא是常见的移动动词，可按观察视角译为“出来”或“出去”。异象叙事没有明说移动的起点和方向，因此正文采用自然的“出来”，并以脚注保留另一可能。
- source_word: הַמַּלְאָךְ
  choice: 天使
  rationale: מַלְאָךְ既可指一般的“使者”，也可指天使；这里是撒迦利亚异象中与先知交谈并作引导的超自然使者，译作“天使”符合上下文。
- source_word: הַדֹּבֵר בִּי
  choice: 与我说话
  rationale: 字面结构是“在我里面说话”，但这是本书反复出现的表达，语境所指是天使与先知交谈。译作“与我说话”符合现代汉语，同时以脚注说明原文形式。分词所表达的持续或特征性动作，由“说话的”自然体现。
- source_word: וַיֹּאמֶר אֵלַי
  choice: 对我说
  rationale: 采用现代汉语叙事中自然、准确的对应表达。
- source_word: שָׂא נָא עֵינֶיךָ
  choice: 请举目
  rationale: “举目”保留希伯来语“抬起你的眼睛”的意象，又是现代读者易懂的庄重表达；“请”体现语气词נָא。
- source_word: וּרְאֵה
  choice: 观看
  rationale: רָאָה在此是要求先知留意异象中新出现的事物；“观看”与“举目”衔接自然，并保留视觉动作。
- source_word: מָה הַיּוֹצֵאת הַזֹּאת
  choice: 这正在出来的是什么
  rationale: 保留疑问词“什么”、阴性指示词“这”以及阴性单数分词所表达的进行中动作。汉语不标语法性别，也不提前点明下一节才确认的物件。
theological_decisions:
- issue: 是否提前说明出来的物件是什么
  choice: 保留“这……的是什么”的未定表达
  alternative: 依据下一节补作“这个量器/这件东西是什么”
  rationale: 本节原文本身以阴性指示词指向正在出现但尚未辨明的对象；不提前补明可保留异象逐步揭示的叙事张力。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“举目观看”略带经文语体，但含义清楚；问句不补入“东西”或下一节的具体名称，以忠实保留原文的指示性与悬念。
