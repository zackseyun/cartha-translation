base_translation:
  language: en
  yaml_path: translation/ot/zechariah/005/001.yaml
  text: Then I turned and lifted my eyes and saw[a], and behold[b], a flying scroll.
translation:
  language: zh_hans
  text: 我转过身来[b]，抬眼观看；看哪，有一卷书正在飞[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“看哪，有一卷飞行的书。”
    reason: 希伯来语分词 עָפָה 可作谓语性描述，译为“正在飞”，也可作定语，译为“飞行的”。
  - marker: b
    text: “转过身来”也可译为“又转身”或“再次转身”；此处可引入下一个异象场景。
    reason: 希伯来语 וָאָשׁוּב 可指转身、转回，也可能带有再次的叙事意味。
lexical_decisions:
- source_word: וָאָשׁוּב
  choice: 又
  rationale: שׁוב在连续叙事中可表示“转回、再次”。这里引入下一个异象场景；汉语用“又”自然承接前文，同时不必生硬补出具体的转身动作。
- source_word: וָאֶשָּׂא עֵינַי
  choice: 抬眼
  rationale: 保留“举目”的希伯来语意象，并采用现代汉语中自然、庄重的表达。
- source_word: וָאֶרְאֶה
  choice: 观看
  rationale: ראה在此指先知在异象中的视觉感知；与“抬眼”连用时，“观看”比重复使用“看见”更符合汉语表达。
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: הִנֵּה用于鲜明呈现眼前景象并引起注意；“看哪”保留其突显作用和经文语体。
- source_word: מְגִלָּה
  choice: 一卷书
  rationale: מְגִלָּה指卷成卷轴的书写材料。“一卷书”在现代汉语圣经语境中清楚自然，也表达其卷轴形态。
- source_word: עָפָה
  choice: 在飞
  rationale: 阴性单数分词与מְגִלָּה一致，描述书卷正在飞行；“在飞”清楚保留进行中的动态。
theological_decisions: []
