  text: הוֹצֵאתִ֗י/הָ נְאֻם֙ יְהוָ֣ה צְבָא֔וֹת וּ/בָ֨אָה֙ אֶל בֵּ֣ית הַ/גַּנָּ֔ב וְ/אֶל בֵּ֛ית הַ/נִּשְׁבָּ֥ע בִּ/שְׁמִ֖/י לַ/שָּׁ֑קֶר וְ/לָ֨נֶה֙ בְּ/ת֣וֹךְ בֵּית֔/וֹ וְ/כִלַּ֖תּ/וּ וְ/אֶת עֵצָ֥י/ו וְ/אֶת אֲבָנָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/005/004.yaml
  text: I have sent it out[a], declares Yahweh of hosts, and it will enter the house of the thief and the house of the one who swears falsely by my name, and it will remain within his house and consume it[b], both its timber and its stones.
translation:
  language: zh_hans
  text: 万军之雅威宣告：“我已把它发出去[a]。它必进入盗贼的家，也必进入那指着我的名起假誓之人的家；它必留在他的家中[b]，毁灭那家，连同其中的木料和石头。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“我已使它出来”。这个希伯来语动词较直译可如此表达；在本句中，它也含有把咒诅发出去执行审判的意思。
    reason: lexical_alternative
  - marker: b
    text: 或译“它必在他的家中留宿”或“过夜”。希伯来语动词的字面意思可指投宿、过夜；这里强调它进入以后仍留在屋内。
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹצֵאתִיהָ
  choice: 我已将它发出
  rationale: 使役词形表示说话者使阴性宾语出去；阴性后缀回指上一节的书卷或咒诅。现代汉语对无生命之物不标语法性别，故用“它”。“发出”既保留雅威主动差遣，也符合咒诅出去施行审判的语境。
- source_word: נְאֻם יְהוָה צְבָאוֹת
  choice: 万军之雅威宣告
  rationale: נְאֻם是先知话语中庄重的宣告公式；“宣告”自然而正式。יְהוָה按其专名音译为“雅威”，צְבָאוֹת译作传统且凝练的“万军”。
- source_word: וּבָאָה אֶל בֵּית
  choice: 它必进入……的家
  rationale: בוא与אֶל及“家”连用，在此表示进入屋内；“进入”比仅译“来到”更明确地呈现咒诅侵入房屋的图景。
- source_word: בֵּית הַגַּנָּב
  choice: 盗贼的家
  rationale: גַּנָּב指偷窃者；“盗贼”庄重、清楚，也不把含义收窄为使用暴力的强盗。
- source_word: הַנִּשְׁבָּע בִּשְׁמִי לַשָּׁקֶר
  choice: 那指着我的名起假誓之人的家
  rationale: 保留“指着我的名”这一神圣名号被用于虚假誓言的要点；“起假誓”是现代汉语中清楚而庄重的表达。
- source_word: וְלָנֶה בְּתוֹךְ בֵּיתוֹ
  choice: 它必留在他的家中
  rationale: לון本可指投宿或过夜；此处拟人化地描写咒诅进入后持续留在屋内，直至完成毁灭。“留在”自然呈现这种持续性，又由脚注保留更具体的词义。
- source_word: וְכִלַּתּוּ
  choice: 把那家……都毁尽
  rationale: כלה的加强词干表示使之完结、耗尽或彻底毁灭。“毁尽”传达完全毁坏，也与随后列举木料和石头相呼应。
- source_word: עֵצָיו וְאֶת אֲבָנָיו
  choice: 连同木料和石头
  rationale: 房屋语境中的עֵץ指建屋所用木料，אֶבֶן则是石头；两者并列强调连建筑材料也无一幸免。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名。采用“雅威”以音译其较普遍认可的读音，并与称号“万军”区分，不以“主”替代专名。
- issue: 审判媒介的指代
  choice: 它
  alternative: 她
  rationale: 希伯来语宾语后缀为阴性，是因其先行词具有阴性语法性别，并不要求把书卷或咒诅人格化为女性；现代汉语以“它”指无生命之物最为自然。
- issue: 咒诅在罪人家中停留的图景
  choice: 保留其拟人化行动，不解释为某种具体灾害
  alternative: 把它明确解释为神所降的灾祸
  rationale: 原文让“它”进入、停留并毁坏房屋，却没有界定具体施行方式；译文保留这一神学张力和意象，不作超出经文的说明。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。句式保留先知宣告的力度，并以分号呈现咒诅进入、停留、毁灭的递进。脚注标记均放在对应词语之后；第二个标记按其所解释的希伯来语动词置于“留在他的家中”之后。
