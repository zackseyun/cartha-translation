  text: וַ/יֹּ֨אמֶר֙ זֹ֣את הָ/רִשְׁעָ֔ה וַ/יַּשְׁלֵ֥ךְ אֹתָ֖/הּ אֶל תּ֣וֹךְ הָֽ/אֵיפָ֑ה וַ/יַּשְׁלֵ֛ךְ אֶת אֶ֥בֶן הָ/עֹפֶ֖רֶת אֶל פִּֽי/הָ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/005/008.yaml
  text: And he said[a], “This is Wickedness,” and he threw her into the middle of the ephah basket[c][b], and he threw the lead weight onto its opening.
translation:
  language: zh_hans
  text: 他便说：“这就是邪恶。”随后，他把她扔进量器里面，又把那块铅石扔在量器口上。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “量器”原文为“伊法”，既是一种干量单位，也可指相应的容器；这里指异象中篮筐状的容器。“铅石”直译为“铅的石块”，在这里压在量器的开口上。
    reason: cultural_and_lexical_note
lexical_decisions:
- source_word: הָרִשְׁעָה
  choice: 邪恶
  rationale: 这是带定冠词的阴性抽象名词，在异象中被人格化并与妇人等同。“邪恶”保留抽象意义，不将其过度解释为“邪恶的女人”；后文用“她”显明人格化。
- source_word: וַיַּשְׁלֵךְ אֹתָהּ
  choice: 把她扔回
  rationale: שׁלך意为“扔、掷”。阴性宾语后缀指异象中的妇人。结合上一节妇人曾从量器中显现的语境，“回”自然表达她被重新投入其中，虽属语境明示而非该动词本身的词义。
- source_word: תּוֹךְ הָאֵיפָה
  choice: 量器中间
  rationale: תּוֹךְ表示内部或中间；אֵיפָה原指一伊法容量及相应容器。正文用普通读者易懂的“量器”，脚注说明原文术语和异象中的容器形态。
- source_word: אֶבֶן הָעֹפֶרֶת
  choice: 那块铅石
  rationale: 直译为“铅的石块”。“铅石”保留原文具体而略显奇特的意象，不先行解释为砝码或盖子；“那块”承接上一节已经出现的铅制圆盖。
- source_word: אֶל־פִּיהָ
  choice: 在量器口上
  rationale: פֶּה直义为“口”，用于容器即开口。阴性后缀指אֵיפָה；中文重复“量器”可避免“她的口”所造成的指代误解。介词与运动动词合用，表示铅石被扔到开口处并压在其上。
theological_decisions:
- issue: 异象中邪恶的人格化
  choice: 以抽象名词“邪恶”称呼该妇人，并保留阴性代词“她”
  alternative: 译作“这就是那邪恶”或解释为“这就是邪恶的女人”
  rationale: 希伯来文把妇人与阴性抽象名词רִשְׁעָה等同。中文无需借助首字母大写；引语中的“邪恶”配合后文“她”，既呈现人格化，也不把抽象名词改写成对妇人的品德描述。
translation_notes:
  register: 采用现代、庄重且易懂的叙事语体。“他便说……随后……又……”保留连续动作；避免音译“伊法”直接进入正文造成理解障碍，同时在脚注保存原文文化信息。
