  text: וַ/יֹּ֣אמֶר אֵלַ֔/י זֹ֚את הָֽ/אָלָ֔ה הַ/יּוֹצֵ֖את עַל פְּנֵ֣י כָל הָ/אָ֑רֶץ כִּ֣י כָל הַ/גֹּנֵ֗ב מִ/זֶּה֙ כָּמ֣וֹ/הָ נִקָּ֔ה וְ/כָל הַ/נִּ֨שְׁבָּ֔ע מִ/זֶּ֖ה כָּמ֥וֹ/הָ נִקָּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/005/003.yaml
  text: Then he said to me[a], “This is the curse that goes out over the face of the whole land, for everyone who steals will be purged away according to what is written on this side of it[c][b], and everyone who swears falsely will be purged away according to what is written on that side of it.”
translation:
  language: zh_hans
  text: 他对我说：“这咒诅要遍行全地[a]：凡偷窃的人，都要按照卷这一面所写的话被除掉[b]；凡起假誓的人[c]，也都要按照卷那一面所写的话被除掉。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “全地”也可译作“全世界”。希伯来语אֶרֶץ可指一片土地，也可指大地或世界。
    reason: alternative_reading
  - marker: b
    text: 本句希伯来语十分省略，直译近似“从这边，照着它……从这边，照着它”。正文根据飞卷的上下文，将其理解为卷的两面及其所写的话；第二处原文并未用不同的词来明确说“那一面”。“被除掉”也可译作“被清除”。
    reason: lexical_alternative
  - marker: c
    text: 原文直译为“凡起誓的人”；下一节表明这里所指的是奉上帝之名起假誓的人。
    reason: contextual_clarification
lexical_decisions:
- source_word: הָאָלָה
  choice: 咒诅
  rationale: 该词可指由誓言引发的咒诅；在飞卷施行审判的异象中，“咒诅”最直接地表达其含义和司法效力。
- source_word: הַיּוֹצֵאת
  choice: 发出、遍及
  rationale: 分词表示正在向外运行的行动；“发出、遍及”既保留咒诅从飞卷发出的动态，也使“遍及全地”的中文表达自然。
- source_word: עַל־פְּנֵי כָל־הָאָרֶץ
  choice: 遍及全地
  rationale: עַל־פְּנֵי 表示覆盖某地表面或范围；“遍及”比直译“在……面上”更符合现代汉语。הָאָרֶץ 可指当地或全地，正文保留简洁的“全地”，脚注说明歧义。
- source_word: הַגֹּנֵב
  choice: 凡偷窃的
  rationale: 实词化分词泛指所有实施偷窃的人；这一译法比“每个贼”更自然，也保留对行为者的普遍指称。
- source_word: מִזֶּה ... כָּמוֹהָ
  choice: 照卷上这一面的判语
  rationale: 希伯来语原句高度省略，直译近似“从这边，照着它”。结合前文的飞卷及本节平行结构，正文补出卷面和判语，使意象可理解；补足部分及另一种直译在脚注中交代。
- source_word: נִקָּה
  choice: 被除去
  rationale: נקה 的尼法勒形在此咒诅和审判语境中不宜理解为宣告无罪；“被除去”表达罪犯受咒诅而从群体中清除，同时避免比原文更具体地说明惩罚方式。
- source_word: הַנִּשְׁבָּע
  choice: 凡起假誓的
  rationale: 该分词本身只说“起誓的”，但与偷窃并列，且下一节明确提到奉上帝之名起假誓，表明这里所指是虚假起誓；脚注保留其字面形式。
- source_word: מִזֶּה ... כָּמוֹהָ
  choice: 照卷上另一面的判语
  rationale: 马所拉文本第二处仍是“从这边，照着它”，但平行句通常被理解为指飞卷另一面。正文采用这一最可能的空间关系，同时在脚注中说明原文两处措辞相同。
theological_decisions:
- issue: הָאָרֶץ 的范围
  choice: 全地
  alternative: 全世界
  rationale: 该词既可指以色列所在之地，也可指整个世界。异象首先面向复归后的群体，因此正文用可按语境理解为当地疆域的“全地”，不把范围明确扩大为全球；脚注保留广义可能。
- issue: נִקָּה 在审判语境中的含义
  choice: 被除去
  alternative: 被判无罪／得洁净
  rationale: 本节描述咒诅临到违犯者，若译作“被判无罪”会逆转语境中的审判方向。“被除去”保留司法性和惩罚性，却不擅自规定具体刑罚。
- issue: הַנִּשְׁבָּע 是否包含“假”
  choice: 起假誓的
  alternative: 起誓的
  rationale: 本词单独看只是“起誓者”，但第4节明确说明罪行是奉上帝之名起假誓。正文按近距离语境表达实际所指，脚注同时保存字面歧义。
- issue: 两处 מִזֶּה 所指
  choice: 飞卷的这一面与另一面
  alternative: 两处都直译为“从这边，照着它”
  rationale: 两组罪名的平行安排很可能对应飞卷两面的文字，但希伯来文本第二处并未使用表示“另一边”的不同词。正文采用可读的上下文解释，脚注明示这一补足，避免把推断冒充明文。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“判语”用于说明飞卷文字具有司法审判性质；“被除去”保持警告的力度，同时不把原文未说明的刑罚方式具体化。句式以冒号和分号呈现两个平行罪名，便于普通读者把握异象结构。
