source:
  edition: WLC
  text: וָ/אֹמַ֖ר מַה הִ֑יא וַ/יֹּ֗אמֶר זֹ֤את הָֽ/אֵיפָה֙ הַ/יּוֹצֵ֔את וַ/יֹּ֕אמֶר זֹ֥את עֵינָ֖/ם בְּ/כָל הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/005/006.yaml
  text: And I said[a], “What is it?” And he said, “This is the basket that is going out.” And he said[b], “This is their appearance in all the land.”
translation:
  language: zh_hans
  text: 我问：“这是什么？”他说：“这是正在出去的量器[a]。”他又说：“这是他们在全地显出的样貌[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文为“伊法”，是一种干物容量单位，也可指按这一容量制作的量器或容器。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译为“这是他们在全地的眼”。这里也可理解为“他们在全地显出的样貌”或“全地所见的他们”；另有异读或解释作“这是他们在全地的罪孽”。
    reason: alternative_reading
lexical_decisions:
- source_word: אֵיפָה
  choice: 量器
  rationale: “伊法”本是干物容量单位，也可转指相应的盛量容器。异象中所见的是具体容器；译作“量器”既自然，又不武断限定其材质或形制。
- source_word: הַיּוֹצֵאת
  choice: 正在出去的
  rationale: 带冠词的分词作定语，描写量器正向外而去；“正在出去的”保留其进行中的动态。
- source_word: עֵינָם
  choice: 他们显出的样貌
  rationale: 马所拉文本直译为“他们的眼”，此处含义晦涩。“显出的样貌”采用“眼”可引申为外观、所见之状的理解，同时不把“罪孽”这一异读直接写入正文。
- source_word: בְּכָל הָאָרֶץ
  choice: 在全地
  rationale: הָאָרֶץ既可指某片土地，也可指全地或世界。“全地”保留范围上的一定开放性，不强行断定为犹大地或整个世界。
- source_word: מַה הִיא
  choice: 这是什么？
  rationale: 阴性代词与后文阴性名词אֵיפָה呼应；现代汉语询问物体自然译为“这是什么”。
theological_decisions:
- issue: 末句עֵינָם的解释
  choice: 正文译作“他们在全地显出的样貌”
  alternative: 直译“他们在全地的眼”；或按异读、传统解释译作“这是他们在全地的罪孽”
  rationale: 马所拉文本明确是“他们的眼”，但语境中的意义困难。正文采用可由“眼”引申而来的可见外貌之义，不改动底本；“罪孽”虽是重要传统读法，却涉及异读或解释，因此列入脚注，以保留文本与神学上的张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“量器”避免生硬音译，也避免把容器具体限定为编织的筐。“他又说”反映原文第二个וַיֹּאמֶר。末句保留原文复数所属形式“他们”，不擅自补明其所指。
