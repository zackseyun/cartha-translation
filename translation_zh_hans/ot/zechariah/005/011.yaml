  text: וַ/יֹּ֣אמֶר אֵלַ֔/י לִ/בְנֽוֹת לָ֥/הֿ בַ֖יִת בְּ/אֶ֣רֶץ שִׁנְעָ֑ר וְ/הוּכַ֛ן וְ/הֻנִּ֥יחָה שָּׁ֖ם עַל מְכֻנָתָֽ/הּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/005/011.yaml
  text: And he said to me[a], “To build a house for her in the land of Shinar; and when it is prepared[b], she will be set there on her base.”
translation:
  language: zh_hans
  text: 他对我说：“要在示拿地[b]为她建造一座房屋；房屋预备妥当后，她[a]将被安置在那里，放在她的基座上。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“它将被安置在那里，放在它的基座上。”希伯来语的阴性形式可以指前文被称为“邪恶”的妇人，也可以较抽象地指量器或其中之物。
    reason: alternative_reading
  - marker: b
    text: “示拿”是旧约中与巴比伦地区相关的古地名。
    reason: cross_reference
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלַי
  choice: 他对我说
  rationale: 按希伯来叙事体自然表达连续动作；“对我”对应原文明确的间接受词。
- source_word: לִבְנוֹת לָהּ בַּיִת
  choice: 为她建造一座房屋
  rationale: 不定式带 ל 表示目的，“为她”保留间接受词含义；בַּיִת 直译为“房屋”，避免未经明示便译作“殿宇”。
- source_word: בְּאֶרֶץ שִׁנְעָר
  choice: 在示拿地
  rationale: 保留旧约地名 שִׁנְעָר 的音译及“地”的表达，不直接解释为巴比伦。
- source_word: וְהוּכַן
  choice: 房屋建成后
  rationale: כון 的 Hophal 形可指“被预备、被建成或被设立”；阳性形式最自然地回指阳性名词“房屋”。用时间性表达呈现动作次序。
- source_word: וְהֻנִּיחָה
  choice: 她就会被安置在那里
  rationale: 保留阴性单数形式与前文被称为“邪恶”的妇人之间的呼应，同时以被动式自然表达安置的结果。
- source_word: עַל מְכֻנָתָהּ
  choice: 放在自己的基座上
  rationale: מְכוּנָה 指固定的底座、台座或基座；“基座”直接而自然。“自己的”保留阴性后缀所表达的所属关系，同时不额外强化偶像崇拜的解释。
theological_decisions:
- issue: 末句阴性形式所指为何
  choice: 以“她……自己的基座”延续异象中妇人化的“邪恶”形象
  alternative: 也可较抽象地理解为量器或其中之物，译作“它会被安置在那里，放在它的基座上”
  rationale: 前文（5:8）明确以量器中的妇人代表“邪恶”，因此阴性动词和后缀自然延续这一人格化形象；但希伯来语所指仍可有不同理解，故在脚注保留歧义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“房屋”较“殿宇”更贴近 בַּיִת，也避免把可能存在的宗教性暗示直接写入正文；“基座”兼顾准确性与异象画面的清晰度。脚注标记置于各自所解释的词语之后。
