revisions:
- from: 他对我说：“要在示拿地[b]为她建造一座房屋；房屋建成后，她[a]就会被安置在那里，放在自己的基座上。”
  to: 他对我说：“要在示拿地[b]为她建造一座房屋；房屋预备妥当后，她[a]将被安置在那里，放在她的基座上。”
  rationale: 修订仅收窄两处不必要的解释性表达：以“预备妥当”对应 וְהוּכַן 的较广语义，避免断定房屋已经建成；并微调末句语序以改善汉语行文。保留阴性代词“她”及其脚注所呈现的文本歧义，保留“示拿”音译和原有脚注锚点。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T08:16:58Z'
