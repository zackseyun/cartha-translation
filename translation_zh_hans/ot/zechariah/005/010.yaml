  text: Then I said to the angel who was speaking with me[a], “Where are they taking the ephah?”
translation:
  language: zh_hans
  text: 我对那与我说话的天使说：“她们把伊法[a]带到哪里去？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“量器”或“量篮”。“伊法”原是一种标准的干量单位；这里指异象中所见的容器。
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר
  choice: 我问
  rationale: 该叙事形式推进异象中的对话；因后接直接问句，现代汉语用“我问”比直译“我说”更自然，同时不改变言语行为。
- source_word: הַמַּלְאָךְ
  choice: 天使
  rationale: מַלְאָךְ可指“使者”或“天使”；在撒迦利亚异象中，这是向先知讲解异象的超自然使者，译作“天使”最清楚。
- source_word: הַדֹּבֵר בִּי
  choice: 与我说话的
  rationale: 这是撒迦利亚书反复出现的表达，בִּי在此按惯用结构表示“与我”，分词则表现持续或特征性的动作。
- source_word: אָנָה
  choice: 到哪里去
  rationale: 该疑问副词询问目的地；“到哪里去”在现代汉语中自然，并明确保留方向含义。
- source_word: הֵמָּה
  choice: 她们
  rationale: 独立阴性复数代词指上一节的两个妇人；汉语用“她们”既交代性别，也自然承接前文。
- source_word: מוֹלִכוֹת
  choice: 要把……带到
  rationale: 这是הלך的使役式阴性复数分词，在此表示使伊法移动、将其运往某处；“把……带到”适合目的地问句，也不过度限定为手提或肩扛。
- source_word: אֶת הָאֵיפָה
  choice: 那伊法
  rationale: אֵיפָה本指标准干量单位，在异象中也指相应的量器或容器。正文保留音译“伊法”，以维持原文术语和上下文连贯；用“那”指向此前已经出现的伊法。
