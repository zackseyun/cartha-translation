id: ZEC.8.13
reference: Zechariah 8:13
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/הָיָ֡ה כַּ/אֲשֶׁר֩ הֱיִיתֶ֨ם קְלָלָ֜ה בַּ/גּוֹיִ֗ם בֵּ֤ית יְהוּדָה֙ וּ/בֵ֣ית יִשְׂרָאֵ֔ל כֵּ֚ן אוֹשִׁ֣יעַ אֶתְ/כֶ֔ם וִ/הְיִיתֶ֖ם בְּרָכָ֑ה אַל תִּירָ֖אוּ תֶּחֱזַ֥קְנָה יְדֵי/כֶֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/008/013.yaml
  text: And it shall happen that just as you were a curse among the nations[a], O house of Judah and house of Israel, so I will save you, and you shall be a blessing. Do not fear[c][b]; let your hands be strong.
translation:
  language: zh_hans
  text: 正如你们从前在列国中成了咒诅[a]，犹大家和以色列家啊，将来我也必照样拯救你们[b]，你们必成为祝福。不要惧怕；你们的手要刚强起来[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“成为人咒诅的对象”，也可能指列国在咒诅别人时用他们的遭遇或名字作咒语。
    reason: lexical_alternative
  - marker: b
    text: 或译“解救你们”。希伯来文这个动词可广泛表示从危难中救出或施行拯救。
    reason: lexical_alternative
  - marker: c
    text: 直译“你们的手要刚强”。这是希伯来语的表达，意思是要鼓起勇气，坚定地采取行动。
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיָה
  choice: 将来
  rationale: 该表达引出先知所宣告的未来情形或结果；“将来”在现代汉语中自然地传达前瞻意义，避免采用生硬的“事情必将发生”。
- source_word: כַּאֲשֶׁר ... כֵּן
  choice: 正如……也要照样
  rationale: 保留希伯来文前后呼应的比较结构，清楚呈现从昔日受咒诅到将来蒙拯救的对应与逆转。
- source_word: הֱיִיתֶם
  choice: 你们从前……成了
  rationale: 结合上下文表达过去的处境；“成了”与表语“咒诅”搭配自然，也不排除其作为既成状态的含义。
- source_word: קְלָלָה
  choice: 咒诅
  rationale: 直接保留该名词的强烈意象，可指他们被列国视为受咒诅者，也可能指其名被用作咒诅语；具体语用含义置于脚注说明。
- source_word: בַּגּוֹיִם
  choice: 在列国中
  rationale: “列国”符合先知文学语域，指以色列以外的众民族，又不引入后期“犹太人—外邦人”的框架。
- source_word: בֵּית יְהוּדָה וּבֵית יִשְׂרָאֵל
  choice: 犹大家和以色列家啊
  rationale: 保留“家”所表达的群体和盟约身份；句末“啊”自然体现直接呼语。
- source_word: אוֹשִׁיעַ
  choice: 我要……拯救你们
  rationale: “拯救”涵盖从困境中救出并恢复的广义，不将其局限为军事或政治层面的解救。
- source_word: וִהְיִיתֶם בְּרָכָה
  choice: 使你们成为福分
  rationale: 表达他们不但蒙福，也成为福分的承载者或来源；“福分”比单说“祝福”更适合作名词表语，同时保留盟约性的回响。
- source_word: אַל תִּירָאוּ
  choice: 不要惧怕
  rationale: 简洁、庄重地表达标准的否定命令。
- source_word: תֶּחֱזַקְנָה יְדֵיכֶם
  choice: 你们的手要刚强起来
  rationale: 保留原文“手刚强”的具体意象，同时“刚强起来”传达鼓起勇气、坚定行动的劝勉。
theological_decisions:
- issue: אוֹשִׁיעַ 所指神拯救的范围
  choice: 我要拯救你们
  alternative: 我要解救你们
  rationale: 上下文涉及犹大和以色列从列国中的羞辱转为福分。“拯救”保留该动词在困境、复兴和盟约关系上的宽广含义，既不缩减为政治解放，也不强加本节未明说的后期救恩细节。
- issue: 犹大与以色列的群体身份
  choice: 犹大家和以色列家
  alternative: 犹大和以色列
  rationale: 保留两处“家”，呈现原文所强调的整体群体与盟约身份，而不把名称仅仅理解为地域称呼。
- issue: 成为“福分”的含义
  choice: 使你们成为福分
  alternative: 使你们蒙福
  rationale: 原文不是单说他们领受福气，而是说他们将“成为福分”；译文保留这种较强且带有盟约回响的表述，不替原文限定其实现方式。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以“正如……也要照样”突出全节的逆转结构；保留“犹大家和以色列家”“成为福分”及“手要刚强”等原文意象，并用脚注解释现代读者可能不熟悉的咒诅用法和身体隐喻。
