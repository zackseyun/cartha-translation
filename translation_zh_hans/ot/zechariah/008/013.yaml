revisions:
- from: 正如你们从前在列国中成了咒诅[a]，犹大家和以色列家啊，将来我也要照样拯救你们[b]，使你们成为福分。不要惧怕；你们的手要刚强起来[c]。
  to: 正如你们从前在列国中成了咒诅[a]，犹大家和以色列家啊，将来我也必照样拯救你们[b]，你们必成为祝福。不要惧怕；你们的手要刚强起来[c]。
  rationale: 修订仅处理两处安全且必要的表达问题：将“使你们成为福分”改为“你们必成为祝福”，以贴合原文非使动的结果陈述并消除“福分”可能造成的受福含义；同时润饰脚注a。其余措辞、比较结构、群体称谓和“手要刚强”的意象均可保留。
  reviewer_model: gpt-5.6-terra
