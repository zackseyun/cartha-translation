  terminology: “列国”“犹大家和以色列家”“拯救”“咒诅”均与先知文学语域和原文用语相称。“祝福”在此作为名词表语，能保留בְּרָכָה的意义及其盟约性的语义回响；不应译为仅仅“蒙福”。
