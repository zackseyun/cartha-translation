  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה שַׁ֚בְתִּי אֶל צִיּ֔וֹן וְ/שָׁכַנְתִּ֖י בְּ/ת֣וֹךְ יְרֽוּשָׁלִָ֑ם וְ/נִקְרְאָ֤ה יְרוּשָׁלִַ֨ם֙ עִ֣יר הָֽ/אֱמֶ֔ת וְ/הַר יְהוָ֥ה צְבָא֖וֹת הַ֥ר הַ/קֹּֽדֶשׁ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/008/003.yaml
  text: 'Thus says Yahweh: I have returned to Zion and will dwell in the midst of Jerusalem[a], and Jerusalem will be called the City of Truth, and the mountain of Yahweh of Armies[b], the Holy Mountain.'
translation:
  language: zh_hans
  text: 雅威如此说：“我已经回到锡安，要住在耶路撒冷中。耶路撒冷必称为‘真理之城’[a]，万军之雅威[b]的山必称为‘圣山’。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “真理之城”也可译作“信实之城”或“可靠之城”；希伯来语 אֱמֶת 可表示真理、真实、可靠或信实。
    reason: lexical_alternative
  - marker: b
    text: “万军之雅威”传统上也译作“万军之耶和华”；“万军”也常译作“万军之主”中的“万军”，指众军或军队。
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: 雅威如此说
  rationale: 保留先知宣告常用的使者公式；以“雅威”呈现四字神名，而不以称号替代。
- source_word: שַׁבְתִּי אֶל צִיּוֹן
  choice: 我已经回到锡安
  rationale: 完成式表达已经实现且对当前仍有影响的返回；“锡安”采用现代汉语通行地名。
- source_word: וְשָׁכַנְתִּי בְּתוֹךְ יְרוּשָׁלִָם
  choice: 要住在耶路撒冷城中
  rationale: 在上下文中作前瞻性的结果来理解；“城中”体现 בְּתוֹךְ 所表达的内部、其中之意，同时保持汉语自然。
- source_word: וְנִקְרְאָה יְרוּשָׁלִַם
  choice: 耶路撒冷必称为
  rationale: 将 Niphal 未完成式自然译作将来的被动称名。
- source_word: עִיר הָאֱמֶת
  choice: 信实之城
  rationale: אֱמֶת 可指真实、可靠或忠信；此处“信实”自然表达复兴后圣城可靠、忠诚的品格，同时以脚注保留“真理之城”的可能。
- source_word: הַר יְהוָה צְבָאוֹת
  choice: 万军之雅威的山
  rationale: 保留神名与 צְבָאוֹת 的军事群体含义；“万军之雅威”沿用庄重而可理解的圣经称号。
- source_word: הַר הַקֹּדֶשׁ
  choice: 圣山
  rationale: 简洁、直接地表达该山分别为圣的性质，也是现代汉语中自然庄重的说法。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；“雅威”较直接地呈现其可能读音，并避免用称号取代专名。
- issue: שַׁבְתִּי ... וְשָׁכַנְתִּי 的时间关系
  choice: 我已经回到……要住在
  alternative: 我回到……并住在；我已经回到……并已经住在
  rationale: 前一动词表达已经成就的返回，后一动词在语境中表达随之而来的居住，保留先知话语中已然与将然并存的张力。
- issue: אֱמֶת 在城名中的含义
  choice: 信实
  alternative: 真理；真实
  rationale: 该词兼有真理、可靠和忠信等义；正文选择符合城市道德与盟约品格的“信实”，脚注则保留其真实或真理层面的歧义。
translation_notes:
  register: 采用现代、庄重且适合公开诵读的标准普通话。句式尽量贴近希伯来文的宣告结构，同时为汉语清晰起见，在末句补出共享的谓语“必称为”。
