  text: כֵּ֣ן שַׁ֤בְתִּי זָמַ֨מְתִּי֙ בַּ/יָּמִ֣ים הָ/אֵ֔לֶּה לְ/הֵיטִ֥יב אֶת יְרוּשָׁלִַ֖ם וְ/אֶת בֵּ֣ית יְהוּדָ֑ה אַל תִּירָֽאוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/008/015.yaml
  text: So now I have returned and purposed in these days to do good to Jerusalem and to the house of Judah. Do not fear.
translation:
  language: zh_hans
  text: 照样，如今我已转而定意，要在这些日子善待耶路撒冷和犹大家。你们不要惧怕。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֵּן
  choice: 照样
  rationale: 承接上文的对照结构，表示“正如先前……，照样如今……”，比单纯译作“所以”更能体现希伯来文的呼应关系。
- source_word: שַׁבְתִּי זָמַמְתִּי
  choice: 我已转而定意
  rationale: שַׁבְתִּי在此与זָמַמְתִּי连用，表达行动方向的转变以及坚定的意图；“转而定意”既保留两个动词的作用，也符合现代汉语表达。
- source_word: לְהֵיטִיב אֶת
  choice: 善待
  rationale: 表示向耶路撒冷和犹大家行善、赐福；“善待”自然简洁，同时保留施益于对象的含义。
- source_word: בֵּית יְהוּדָה
  choice: 犹大家
  rationale: “家”在此指犹大群体或家族共同体，采用圣经语境中清楚且常见的表达。
- source_word: אַל תִּירָאוּ
  choice: 你们不要惧怕
  rationale: 原文为复数命令式，明确补出“你们”，并以庄重自然的“惧怕”传达劝勉。
theological_decisions:
- issue: שַׁבְתִּי所表达的神之行动转变
  choice: 译作“转而”，指神所定行动方向由先前的降祸转为施恩
  alternative: 译作“回心转意”或“回来”
  rationale: “回心转意”容易暗示反复无常或承认先前决定错误；单译“回来”则在中文中对象和方向不明。“转而”保留经文中真实的对照与转变，却不额外加入神学判断。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“照样”连接上文，“如今”凸显当前时期；句式简洁，适合公开诵读。
