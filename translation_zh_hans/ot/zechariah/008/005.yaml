  text: And the streets of the city will be filled with boys and girls playing in its streets[a].
translation:
  language: zh_hans
  text: 城里的街道必充满男孩和女孩；他们在街上玩耍[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“城里的广场必充满男孩和女孩；他们在广场上玩耍。”希伯来语这个词可指宽阔的街道，也可指公共广场。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּרְחֹבוֹת / בִּרְחֹבֹתֶיהָ
  choice: 街道／街上
  rationale: רְחֹבוֹת可指城中宽阔的街道或公共广场；正文采用现代汉语自然的“街道”，末句用“街上”避免生硬重复，同时保留地点呼应。另一可能译法见脚注。
- source_word: הָעִיר
  choice: 城里
  rationale: עִיר通常指“城、城市”；“城里”在本句中自然地表达所属和地点关系。
- source_word: יִמָּלְאוּ
  choice: 必满是
  rationale: 这是מלא的尼法勒未完成式，表达将来的充满状态；“必满是”既传达未来确定性，也符合现代汉语表达。
- source_word: יְלָדִים וִילָדוֹת
  choice: 男孩女孩
  rationale: 阳性与阴性复数在此相对并列，分别译为“男孩”和“女孩”，保留原文明确的性别配对。
- source_word: מְשַׂחֲקִים
  choice: 玩耍
  rationale: שׂחק的分词在此描写孩子们在复兴之城中的活动；“玩耍”准确、自然，并体现安宁喜乐的日常景象。
