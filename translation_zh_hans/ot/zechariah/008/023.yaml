revisions:
- from: 万军之耶和华如此说：“在那些日子，列国各种语言的人中，必有十个人抓住一个犹太人的衣襟；他们要紧紧抓住，说：‘请让我们跟你们一起去，因为我们听说上帝与你们同在。’”[a]
  to: 万军之耶和华如此说：“在那些日子，列国各种语言的人中，必有十个人抓住一个犹太人的衣角，紧紧抓住不放，说：‘让我们跟你们一起去，因为我们听说上帝与你们同在。’”[a]
  rationale: 以“衣角”替换容易被理解为前襟的“衣襟”，并将重复的“抓住”译为“紧紧抓住不放”，使其对象明确且保留原文强调。其余措辞及复数“你们”维持不变。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T08:17:02Z'
