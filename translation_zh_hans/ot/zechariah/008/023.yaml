language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כֹּ֥ה אָמַר֮ יְהוָ֣ה צְבָאוֹת֒ בַּ/יָּמִ֣ים הָ/הֵ֔מָּה אֲשֶׁ֤ר יַחֲזִ֨יקוּ֙ עֲשָׂרָ֣ה אֲנָשִׁ֔ים מִ/כֹּ֖ל לְשֹׁנ֣וֹת הַ/גּוֹיִ֑ם וְֽ/הֶחֱזִ֡יקוּ בִּ/כְנַף֩ אִ֨ישׁ יְהוּדִ֜י לֵ/אמֹ֗ר נֵֽלְכָה֙ עִמָּ/כֶ֔ם כִּ֥י שָׁמַ֖עְנוּ אֱלֹהִ֥ים עִמָּ/כֶֽם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/008/023.yaml
  text: 'Thus says Yahweh of Armies: In those days ten men from every language of the nations will take hold—yes[a], they will take hold of the garment edge of a Jewish man, saying, ‘Let us go with you[c][b], for we have heard that God is with you.’'
translation:
  language: zh_hans
  text: 万军之耶和华如此说：“在那些日子，列国各种语言的人中，必有十个人抓住一个犹太人的衣角，紧紧抓住不放，说：‘让我们跟你们一起去，因为我们听说上帝与你们同在。’”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “犹太人”也可译作“犹大人”。原文“衣角”可指衣服的边缘或角落。
    reason: 保留 יְהוּדִי 的族群／地域语义可能性，并说明 כָּנָף 所指衣物边角的具体意象。
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: 万军之耶和华
  rationale: “耶和华”保留神的专名；“万军”以现代中文中已广为人知的圣经表达传达 צְבָאוֹת 所指的众军，整体庄重自然。
- source_word: בַּיָּמִים הָהֵמָּה
  choice: 在那些日子
  rationale: 直接保留希伯来语的时间表达，同时符合现代汉语习惯。
- source_word: עֲשָׂרָה אֲנָשִׁים מִכֹּל לְשֹׁנוֹת הַגּוֹיִם
  choice: 列国各种语言的人中，必有十个人
  rationale: לְשֹׁנוֹת 在此指语言；“列国各种语言的人中”呈现跨越列国和语言群体的范围，并保留“十个人”的阳性复数表达。
- source_word: יַחֲזִיקוּ ... וְהֶחֱזִיקוּ
  choice: 抓住……他们要紧紧抓住
  rationale: 保留原文动词的重复，以“紧紧”自然表现后一次重复所产生的强调效果。
- source_word: בִּכְנַף
  choice: 衣襟
  rationale: כָּנָף 的基本义可指翅膀、边缘或角；用于衣服时，“衣襟”在中文中具体自然，又不限定为某种特定服装。
- source_word: אִישׁ יְהוּדִי
  choice: 一个犹太人
  rationale: 在此语境中 יְהוּדִי 主要是族群身份；中文“犹太人”已经自然包含人的意思，无须生硬重复“一个犹太男子”。
- source_word: נֵלְכָה עִמָּכֶם
  choice: 请让我们跟你们一起去
  rationale: 用请求式表达希伯来语 cohortative 的意愿和恳求色彩；复数“你们”忠实反映 עִמָּכֶם，虽抓住的是一个人，话却面向他所属的群体。
- source_word: כִּי שָׁמַעְנוּ אֱלֹהִים עִמָּכֶם
  choice: 因为我们听说上帝与你们同在
  rationale: “听说”自然表达“听见了某事”的语义；“与你们同在”直接保存神临在于该群体的陈述。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 采用现代中文圣经读者最熟悉的专名形式“耶和华”，既把它作为名字呈现，也不以称号“上主”取代原文神名。
- issue: יְהוּדִי 的身份范围
  choice: 犹太人
  alternative: 犹大人
  rationale: 此处是列国归向神子民的预言性场景，“犹太人”能自然表达较广的族群—信仰身份；“犹大人”也可能强调与犹大地域或群体的关联，故以脚注保留。
- issue: עִמָּכֶם 的复数所指
  choice: 你们
  alternative: 你
  rationale: 原文两处均为阳性复数，显示列国的人虽抓住一个犹太人，却把他视为群体代表；译文不将这一张力消解为单数。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。用分号和重复句式保留希伯来文“抓住……又抓住”的强调；保留“你们”的复数形式，使个人与群体之间的原文张力可见。
