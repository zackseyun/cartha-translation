  naturalness: 整体庄重流畅。改为“衣角，紧紧抓住不放”既符合现代标准汉语，也明确呈现希伯来文重复的“抓住”所带出的执着强调。
  terminology: “耶和华”“万军”“犹太人”“上帝”均可保留。“犹大人”作为 יְהוּדִי 的可能地域性译法，宜保留脚注。“衣角”比“衣襟”准确；脚注说明其也可作衣服边缘或角落。
