    rationale: כָּנָף 用于衣物指边缘、角或下摆一类的末端；中文“衣襟”通常是前襟，过度限定且偏离具体意象。
  - severity: low
    issue: 重复动词的第二处译为“他们要紧紧抓住”，宾语悬空。
    rationale: 原文第二次“抓住”仍以“一个犹太人的衣服边角”为对象；补作“紧紧抓住不放”可自然保留重复及强调。
  revised_text: 万军之耶和华如此说：“在那些日子，列国各种语言的人中，必有十个人抓住一个犹太人的衣角，紧紧抓住不放，说：‘让我们跟你们一起去，因为我们听说上帝与你们同在。’”[a]
  revised_footnotes:
