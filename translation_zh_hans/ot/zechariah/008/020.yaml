  yaml_path: translation/ot/zechariah/008/020.yaml
  text: 'Thus says Yahweh of hosts: Yet peoples shall come[a], and the inhabitants of many cities,'
translation:
  language: zh_hans
  text: 万军之雅威如此说：“将来还会有各民族[a]和多座城的居民前来，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“列国”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: 如此说
  rationale: 这是先知宣告常用的传信公式；译为“如此说”既贴近原文，也保持庄重而自然的现代汉语表达。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文直接音译上帝的专名，不以“主”这一称号代替。
- source_word: צְבָאוֹת
  choice: 万军之
  rationale: 在“雅威”的称号中采用汉语圣经传统而凝练的表达，保留其统领众军的广泛意涵，不限定为地上的军队。
- source_word: עֹד אֲשֶׁר יָבֹאוּ
  choice: 将来还会……前来
  rationale: עֹד表示还有进一步之事将要发生；结合后面的未完成式动词，译为“将来还会……前来”自然地传达延续和未来含义。
- source_word: עַמִּים
  choice: 各族之民
  rationale: 复数形式指多个族群或民族；“各族之民”避免只按现代政治实体理解，同时保留“列国”这一可能译法于脚注。
- source_word: וְיֹשְׁבֵי
  choice: 和……的居民
  rationale: 该构造式分词指居住在某地的人；“居民”简洁、自然。
- source_word: עָרִים רַבּוֹת
  choice: 许多城
  rationale: רַבּוֹת在这里最自然地表示数量多，而非城市规模宏大。
theological_decisions:
- issue: 如何翻译上帝的专名 יהוה
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；“雅威”按较通行的学术重构音译该专名，既不以称号取代，也不采用较晚形成的混合读音。
- issue: עַמִּים所指的群体范围
  choice: 各族之民
  alternative: 列国
  rationale: 原词可指不同民族、族群或列国。正文用“各族之民”保留其以人群为中心的宽泛意义，并用脚注列出“列国”这一成立的译法。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“万军之雅威如此说”保留先知宣告的正式语气；“将来还会”自然表达原文的延续性未来意义。本节句意延续至下一节，因此末尾保留逗号和未闭合引号。
