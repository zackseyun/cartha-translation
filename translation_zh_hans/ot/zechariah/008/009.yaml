  text: כֹּֽה אָמַר֮ יְהוָ֣ה צְבָאוֹת֒ תֶּחֱזַ֣קְנָה יְדֵי/כֶ֔ם הַ/שֹּֽׁמְעִים֙ בַּ/יָּמִ֣ים הָ/אֵ֔לֶּה אֵ֖ת הַ/דְּבָרִ֣ים הָ/אֵ֑לֶּה מִ/פִּי֙ הַ/נְּבִיאִ֔ים אֲ֠שֶׁר בְּ/י֞וֹם יֻסַּ֨ד בֵּית יְהוָ֧ה צְבָא֛וֹת הַ/הֵיכָ֖ל לְ/הִבָּנֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/008/009.yaml
  text: 'Thus says Yahweh of Armies: Let your hands be strong[c][b][a], you who in these days are hearing these words from the mouth of the prophets who were present on the day the house of Yahweh of Armies was founded for the temple to be built.'
translation:
  language: zh_hans
  text: 万军之耶和华如此说：“你们这些如今正从众先知口中听见这些话的人，你们的手要刚强[a]！这些先知是在万军之耶和华的殿奠基、为要建造圣殿的那一天在场的[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “你们的手要刚强”是希伯来语的劝勉性表达，指要有勇气、坚定胆量，并有力量做工。也可译作“要使你们的手刚强”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语这一关系从句十分紧缩。也可理解为：“那些在万军之耶和华的殿奠基、为要建造圣殿的那一天传讲信息的先知。”原文未明确说明先知与那一天的具体关系。
    reason: alternative_reading
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: 如此说
  rationale: 保留先知传信公式的庄重语气，同时符合现代汉语表达。
- source_word: יְהוָה צְבָאוֹת
  choice: 万军之耶和华
  rationale: 以“耶和华”对应神的专名，以“万军”表达 צְבָאוֹת 所含天上众军及军旅意象；这也是中文读者熟悉且庄重的表达。
- source_word: תֶּחֱזַקְנָה יְדֵיכֶם
  choice: 双手要刚强
  rationale: 保留希伯来语以“手刚强”劝人鼓起勇气、坚定做工的形象，不将其缩减为抽象的“勇敢”。
- source_word: הַשֹּׁמְעִים ... בַּיָּמִים הָאֵלֶּה
  choice: 你们这些如今正……听见……的人
  rationale: 用“正”体现分词所表达的持续、当下动作；“如今”自然地传达“在这些日子”。
- source_word: מִפִּי הַנְּבִיאִים
  choice: 从众先知口中
  rationale: 保留原文“从……口中”的具体意象，也清楚表示领受先知亲自传讲的信息。
- source_word: יֻסַּד
  choice: 奠基
  rationale: 准确表达 יסד 的被动含义；汉语中“殿奠基”自然，并明确关联建筑工程。
- source_word: בֵּית יְהוָה צְבָאוֹת הַהֵיכָל לְהִבָּנוֹת
  choice: 万军之耶和华的殿——就是那要建造的圣殿——
  rationale: 将“殿宇/房屋”与“圣殿”理解为同位关系，并以“要建造的”保留不定式的目的、预期色彩。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。中文正文采用广为人知的专名“耶和华”，而不以普通称号替代，藉此保留其盟约专名性质。
- issue: צְבָאוֹת 的意象
  choice: 万军
  alternative: 众军
  rationale: “万军”在现代中文圣经语域中庄重且易懂，能够涵盖神统领天上众军及一切军旅的主权意象，而不把范围限定为地上的军队。
- issue: אֲשֶׁר 所引关系从句的连接
  choice: 这些先知……传讲这些话
  alternative: 这些先知当日亲自在场
  rationale: 希伯来语关系从句高度紧缩，明说先知与奠基之日有关，却省略了汉语所需的谓语。正文依上下文补出“传讲这些话”，但以脚注保留“当日在场”的另一种合理理解。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“如此说”“从……口中”“双手要刚强”保留先知话语的节奏和希伯来语意象；破折号标明“耶和华的殿”与“圣殿”的同位关系，避免汉语读者误解为两座不同建筑。
