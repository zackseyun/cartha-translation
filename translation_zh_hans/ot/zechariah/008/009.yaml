revisions:
- from: 万军之耶和华如此说：“你们这些如今正从众先知口中听见这些话的人，双手要刚强[a]！这些先知是在万军之耶和华的殿——就是那要建造的圣殿——奠基之日传讲这些话的[b]。”
  to: 万军之耶和华如此说：“你们这些如今正从众先知口中听见这些话的人，你们的手要刚强[a]！这些先知是在万军之耶和华的殿奠基、为要建造圣殿的那一天在场的[b]。”
  rationale: 修订避免把原文紧缩而有歧义的关系从句擅自定为“先知在奠基日传讲这些话”。正文采用“在场”这一可行理解，脚注保留“在那日传讲”的替代读法，并改善“手要刚强”的汉语表达。
