  text: וְ/אִ֣ישׁ אֶת רָעַ֣ת רֵעֵ֗/הוּ אַֽל תַּחְשְׁבוּ֙ בִּ/לְבַבְ/כֶ֔ם וּ/שְׁבֻ֥עַת שֶׁ֖קֶר אַֽל תֶּאֱהָ֑בוּ כִּ֧י אֶת כָּל אֵ֛לֶּה אֲשֶׁ֥ר שָׂנֵ֖אתִי נְאֻם יְהוָֽה׀־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/008/017.yaml
  text: And let no man devise evil against his neighbor in his heart[a], and do not love a false oath, for all these are what I hate, declares Yahweh.
translation:
  language: zh_hans
  text: 你们谁都不可在心里图谋加害邻舍[a]，也不可喜爱虚假的誓言；因为这一切都是我所恨恶的。这是雅威的宣告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译近于：“各人不可在你们心里图谋针对他邻舍的恶事。”原文以复数“你们”向全体说话，同时用单数“各人”逐一指向其中每个人。
    reason: 保留原文单数个体与复数群体并置的分配式表达，并澄清“恶”是针对邻舍的恶事。
lexical_decisions:
- source_word: וְאִישׁ
  choice: 你们谁都不可
  rationale: אִישׁ 是单数“人、各人”，但后面的禁令使用复数形式，表示对群体中的每一个人分别发出命令。“你们谁都不可”在现代汉语中自然地保留这种逐一适用的语气。
- source_word: רָעַת רֵעֵהוּ
  choice: 害自己的邻舍
  rationale: רָעָה 在此指意图施加于他人的恶或伤害，רֵעַ 指邻舍、同伴。“害自己的邻舍”简洁表达其人际伦理含义，而不把“邻舍”缩窄为亲密朋友。
- source_word: תַּחְשְׁבוּ בִּלְבַבְכֶם
  choice: 在心里图谋
  rationale: חשב 可指思想、筹划或图谋；与针对邻舍的恶相连时，“图谋”准确传达蓄意谋划的含义。“在心里”保留 לֵבָב 所强调的内在意念。
- source_word: שְׁבֻעַת שֶׁקֶר
  choice: 虚假的誓言
  rationale: 该结构直译为“虚假之誓”。“虚假的誓言”既自然，又保留其法律与伦理色彩，不将其限定为某种特定司法罪名。
- source_word: תֶּאֱהָבוּ
  choice: 喜爱
  rationale: אהב 的基本义是“爱、喜爱”。此处保留强烈的意愿与价值取向，表明禁令不只针对发假誓，也针对内心对这种行为的认同。
- source_word: כִּי אֶת כָּל אֵלֶּה אֲשֶׁר שָׂנֵאתִי
  choice: 因为这一切都是我所恨恶的
  rationale: 保留 אֶת כָּל אֵלֶּה 对上述一切行为的总括与强调，并以“我所恨恶的”传达第一人称神谕的力度。
- source_word: נְאֻם יְהוָה
  choice: 这是雅威的宣告
  rationale: נְאֻם 是先知书中常见的神谕公式；“宣告”庄重而清楚。יְהוָה 以“雅威”音译，明确呈现经文中的神圣名字。
theological_decisions:
- issue: 神圣名字 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。译作“雅威”可将其作为专名呈现，并避免以称号取代原文中的名字。
- issue: 上帝所恨恶之事的范围
  choice: “这一切”总括本节所禁的谋害邻舍与虚假誓言
  alternative: 只把“恨恶”联系于紧邻的虚假誓言
  rationale: כָּל אֵלֶּה（“这一切”）自然回指复数的上述禁令，因此不将神的恨恶缩限于后一项。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“图谋害自己的邻舍”避免生硬复制希伯来语结构；分号划分两项禁令，末句以先知性宣告公式收束。
