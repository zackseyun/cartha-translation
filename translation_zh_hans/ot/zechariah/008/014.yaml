base_translation:
  language: en
  yaml_path: translation/ot/zechariah/008/014.yaml
  text: 'For thus says Yahweh of Armies: Just as I purposed to do harm to you when your fathers provoked me to wrath[a], says Yahweh of Armies, and I did not relent[c][b],'
translation:
  language: zh_hans
  text: 因为万军之耶和华如此说：“你们的祖先惹我发怒时，我怎样定意降祸给你们[a]，万军之耶和华说，我没有改变心意[b]——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “降祸给你们”也可译作“使灾祸临到你们”或“加害于你们”。
    reason: lexical_alternative
  - marker: b
    text: “没有改变心意”也可译作“没有转意”或“没有后悔”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的专名形式“耶和华”，以专名而非“主”这一称号来对应四字神名。
- source_word: צְבָאוֹת
  choice: 万军之
  rationale: “万军之耶和华”是庄重、通行的中文称号，也保留了希伯来语所含军旅与天军的广阔意象。
- source_word: כִּי כֹה אָמַר
  choice: 因为……如此说
  rationale: 保留כִּי与上文的论证联系，并以“如此说”呈现先知传信公式的正式语气。
- source_word: כַּאֲשֶׁר
  choice: 怎样
  rationale: 与下一节预期的“照样”形成对应；在本节未完的比较句中，“怎样”比孤立的“正如”更合乎中文句法。
- source_word: זָמַמְתִּי
  choice: 我……定意
  rationale: 表达经过考虑的意图与决断，比单纯“想要”更有意志强度。
- source_word: לְהָרַע לָכֶם
  choice: 降祸给你们
  rationale: 这里指施行灾祸或审判，并非道德意义上的作恶；“降祸”简洁地保留负面行动的力度。
- source_word: בְּהַקְצִיף אֲבֹתֵיכֶם אֹתִי
  choice: 你们的祖先惹我发怒时
  rationale: 将ב理解为时间或情境标记，并保留使役动词“惹……发怒”的强度。
- source_word: אֲבֹתֵיכֶם
  choice: 你们的祖先
  rationale: 上下文指先前世代；现代汉语用“祖先”自然涵盖这一群体，而“父辈”可作为较直译的备选。
- source_word: וְלֹא נִחָמְתִּי
  choice: 并不收回原意
  rationale: 在已定审判的语境中，נחם指改变既定行动或作罢；此译避免让现代读者误解为因道德过错而“悔改”。
theological_decisions:
- issue: לְהָרַע所表达的神圣审判
  choice: 降祸给你们
  alternative: 加害于你们；使灾祸临到你们
  rationale: 保留神主动施行不利审判的张力，同时避免“作恶”在现代汉语中暗示神有道德邪恶。
- issue: וְלֹא נִחָמְתִּי中的拟人性语言
  choice: 并不收回原意
  alternative: 并不后悔；并不改变心意；并不回心转意
  rationale: 原文可涉及后悔、改变心意或中止行动。正文按审判语境译为“不收回原意”，脚注保留其词义幅度，不据此建立额外的神学论断。
- issue: 本节与下一节之间的比较结构
  choice: 以“怎样”保留未完比较句
  alternative: 正如……
  rationale: 第14节的כַּאֲשֶׁר引向第15节的כֵּן，语义在下一节才完成；不把本节独立改写为完整结论，以保存原文结构。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。保留先知传信公式和本节延续到下一节的比较结构；破折号用于标示插入的“这是万军之耶和华说的”，避免中文读者误认其为引语结束。所有脚注标记均置于正文相应位置。
