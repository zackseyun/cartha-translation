  text: כֹּ֤ה אָמַר֙ יְהוָ֣ה צְבָא֔וֹת הִנְ/נִ֥י מוֹשִׁ֛יעַ אֶת עַמִּ֖/י מֵ/אֶ֣רֶץ מִזְרָ֑ח וּ/מֵ/אֶ֖רֶץ מְב֥וֹא הַ/שָּֽׁמֶשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/008/007.yaml
  text: 'Thus says Yahweh of hosts: Behold[b][a], I will save my people from the land of the east and from the land of the setting of the sun.'
translation:
  language: zh_hans
  text: 万军之雅威如此说：“看哪，我要从日出之地和日落之地[b]拯救我的子民[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “我要……拯救”：原文用分词，在先知性的宣告中可以表示即将发生或确定必成的行动；也可译作“我正在拯救”或“我必拯救”。
    reason: lexical_alternative
  - marker: b
    text: “日出之地和日落之地”直译原文，指东西两端，概括遥远的东方和西方各地。
    reason: cultural_note
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: 如此说
  rationale: 保留先知传信公式的庄重语气，同时符合现代汉语表达。
- source_word: יְהוָה צְבָאוֹת
  choice: 万军之雅威
  rationale: 以“雅威”音译神的专名，并用汉语圣经传统中清楚而庄重的“万军之”表达 צְבָאוֹת 所指受神统领的众军。
- source_word: הִנְנִי
  choice: 看哪，我要
  rationale: הִנְנִי 强调说话者本人及其即将采取的行动；“看哪”保留先知话语中的郑重提示，“我要”使后接分词在本句中的将来指向自然明确。
- source_word: מוֹשִׁיעַ
  choice: 拯救
  rationale: 直接反映 ישׁע 词根的解救、拯救意义；结合 הִנְנִי，此处可表示即将发生或确定必成的行动。
- source_word: עַמִּי
  choice: 我的子民
  rationale: 自然表达盟约性的归属关系，又不超出原文含义。
- source_word: מֵאֶרֶץ מִזְרָח
  choice: 从日出之地
  rationale: מִזְרָח 可指东方或日出方向；此译保留与后半句“日落之地”的诗意对称。
- source_word: וּמֵאֶרֶץ מְבוֹא הַשָּׁמֶשׁ
  choice: 和日落之地
  rationale: 贴近原文“太阳落下之地”的表达，同时在现代汉语中简洁可懂，并与“日出之地”构成东西两端的对应。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较贴近学界通常重构的读音，并保留其作为专名的性质，不以称号取代。
- issue: הִנְנִי מוֹשִׁיעַ 的时态与体貌
  choice: 看哪，我要拯救
  alternative: 看哪，我正在拯救／看哪，我必拯救
  rationale: 希伯来语分词在先知宣告中可表达临近或确定的未来行动。“我要拯救”在现代汉语中自然地呈现将来指向，同时由脚注保留其体貌上的开放性，避免断定行动已经开始或特意强化为绝对语气。
- issue: 东西两端的地理表达
  choice: 日出之地和日落之地
  alternative: 东方和西方
  rationale: 保留原文的形象和诗意，并不把这一概括性两极表达限定为两个特定国家或地区。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“如此说”和“看哪”保留先知宣告的正式语域；“日出之地和日落之地”保留原文诗性意象。为使“拯救……从某地”在汉语中语义完整，将方向结果自然表达为“使他们……归回”，其含义由原文介词短语所蕴含，未指定原文未明说的目的地。
