source:
  edition: WLC
  text: כִּֽי זֶ֣רַע הַ/שָּׁל֗וֹם הַ/גֶּ֜פֶן תִּתֵּ֤ן פִּרְיָ/הּ֙ וְ/הָ/אָ֨רֶץ֙ תִּתֵּ֣ן אֶת יְבוּלָ֔/הּ וְ/הַ/שָּׁמַ֖יִם יִתְּנ֣וּ טַלָּ֑/ם וְ/הִנְחַלְתִּ֗י אֶת שְׁאֵרִ֛ית הָ/עָ֥ם הַ/זֶּ֖ה אֶת כָּל אֵֽלֶּה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/008/012.yaml
  text: 'For there will be the seed of peace: the vine will give its fruit[a], the land will give its produce, and the heavens will give their dew; and I will cause the remnant of this people to inherit all these things.'
translation:
  language: zh_hans
  text: 因为必有平安的种子[a]：葡萄树必结出果实，土地必出产作物，诸天必降下甘露；我要使这百姓的余民承受这一切。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“兴盛的种子”“播种必平安”，或“福祉的种子”。希伯来语原句十分凝练，可能是对农业恢复、丰收蒙福这一整幅景象的概括。
    reason: 说明 זֶרַע הַשָּׁלוֹם 的多种可能理解，保留原文真实的词义张力。
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，说明前述应许的缘由；“因为”保留了解释性的连接作用。
- source_word: זֶרַע הַשָּׁלוֹם
  choice: 平安的种子
  rationale: 原文表达紧凑，זֶרַע可指种子、播种或后裔，שָׁלוֹם涵盖平安、健全、福祉与兴盛。上下文以葡萄、土地和甘露描写农业复兴，直译为“平安的种子”既保留农业意象，也不缩减其神学内涵。
- source_word: הַגֶּפֶן תִּתֵּן פִּרְיָהּ
  choice: 葡萄树必结出果实
  rationale: 中文以“结出果实”表达葡萄树给予其果实最自然，同时准确传达丰产的应许。
- source_word: יְבוּל
  choice: 作物
  rationale: 指土地所出产之物；“作物”符合农业语境，又不局限于某一种收成。
- source_word: הַשָּׁמַיִם יִתְּנוּ טַלָּם
  choice: 诸天必降下甘露
  rationale: “诸天”保留希伯来文复数形式；“降下甘露”在现代中文中比逐字的“给出甘露”自然，并维持具体的赐福图景。
- source_word: וְהִנְחַלְתִּי
  choice: 我要使……承受
  rationale: 保留使役意义，也保留 נחל 所含的继承、领受产业之意；“承受”在中文圣经语体中庄重而可懂。
- source_word: שְׁאֵרִית הָעָם הַזֶּה
  choice: 这百姓的余民
  rationale: “余民”准确对应先知书中留下来的一群人，既有字面意义，也不抹去其神学色彩。
- source_word: אֶת כָּל אֵלֶּה
  choice: 这一切
  rationale: 自然概括前面所列葡萄结果、土地出产和诸天降露等福分。
theological_decisions:
- issue: 农业赐福语境中 שָׁלוֹם 的语义范围
  choice: 正文译作“平安的种子”
  alternative: 可理解为“兴盛的种子”“平安的播种”或“带来福祉的种子”
  rationale: שָׁלוֹם 不仅指没有冲突，也包括完整、安康与兴盛。保留“平安”能呈现原文的宽广含义，避免将应许仅仅经济化。
- issue: וְהִנְחַלְתִּי 的产业承受意涵
  choice: 译作“我要使……承受”
  alternative: “我要把这一切赐给……为业”或“我要使……拥有”
  rationale: 使役式动词带有使人继承、取得产业的含义；“使……承受”保留盟约赐予和产业继承的回响，而不只表达普通的占有。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“结出果实”“出产作物”“降下甘露”形成自然的农业赐福图景；“余民”“承受”保留先知书和产业继承语境中的重要用语。
