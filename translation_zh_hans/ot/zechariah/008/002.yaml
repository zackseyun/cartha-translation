base_translation:
  language: en
  yaml_path: translation/ot/zechariah/008/002.yaml
  text: 'Thus says Yahweh of hosts: I am jealous for Zion with great jealousy[b][a], and with great wrath I am jealous for her.'
translation:
  language: zh_hans
  text: 万军之雅威[a]如此说：“我为锡安大发热心[b]；我以极大的烈怒为她热心。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威”音译希伯来文上帝的名字יהוה（YHWH）；传统译本常译作“耶和华”或以“主”代替。
    reason: alternative_reading
  - marker: b
    text: “大发热心”也可译作“怀着极大的嫉妒”。希伯来文在这里把同一词根的动词和名词连用，强调雅威对锡安强烈、专一的盟约性热忱；本节末尾再次使用同一动词。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 以音译保留上帝向以色列启示的专名，而不以“主”这一称号替代。
- source_word: צְבָאוֹת
  choice: 万军之
  rationale: 用于固定称号“万军之雅威”，保留其统领众军的广泛含义，不限于地上的军队。
- source_word: קִנֵּאתִי / קִנְאָה
  choice: 妒爱／大发妒爱
  rationale: 原文动词与同根名词连用，强调雅威对锡安强烈而专一的盟约之爱。“妒爱”兼顾嫉妒与热忱两层含义，并以重复保留原文的修辞力度。
- source_word: לְצִיּוֹן
  choice: 为锡安
  rationale: 介词在此表示这份妒爱所指向和维护的对象；“为锡安”符合现代汉语表达。
- source_word: וְחֵמָה גְדוֹלָה
  choice: 怀着极大的烈怒
  rationale: חֵמָה表示炽烈的愤怒；“烈怒”保留其强度，“极大的”对应גְדוֹלָה。
- source_word: לָהּ
  choice: 她
  rationale: 阴性单数代词回指锡安；译作“她”保留锡安作为女性形象的拟人表达。
theological_decisions:
- issue: 如何表达雅威的“嫉妒／热忱”
  choice: 采用“妒爱”，并在脚注保留“热切爱护”的可能译法
  alternative: 我为锡安大发热心／我热切爱护锡安
  rationale: קנא兼有嫉妒与热忱的语义。正文保留上帝对锡安专一、强烈的盟约性情感及其张力，不把它淡化为一般的关心；脚注则说明其积极的热忱含义，避免读者只按有罪的人性嫉妒理解。
- issue: 烈怒与妒爱的关系
  choice: 保留“怀着极大的烈怒妒爱她”
  alternative: 我因锡安而大发烈怒
  rationale: 原文把“极大的烈怒”与第二次“我妒爱她”直接相连，却没有明说烈怒针对谁；译文保留这种开放性，不擅自补出烈怒的对象。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“万军之雅威如此说”保留先知宣告的庄严公式；两次使用“妒爱”对应原文重复，避免为求汉语变化而削弱强调。
