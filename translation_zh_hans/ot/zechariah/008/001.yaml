base_translation:
  language: en
  yaml_path: translation/ot/zechariah/008/001.yaml
  text: And the word of Yahweh of hosts came[a], saying[b],
translation:
  language: zh_hans
  text: 万军[b]之雅威的话临到[a]，说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 较为形式对应的译法是：“事情发生了：万军之雅威的话临到，说。”
    reason: lexical_alternative
  - marker: b
    text: “万军”也可译作“众军”或“军队”；这一称号强调雅威统管天上地下的一切力量。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: 传来
  rationale: 这里的连续式 וַיְהִי 引出叙事中的下一项事件，并与后面的“雅威的话”共同构成先知书常见的启示公式。译作“传来”比直译“事情发生了”更符合现代汉语，同时保留事件推进的作用。
- source_word: דְּבַר
  choice: 话
  rationale: 在先知启示公式中，דְּבַר 指来自上帝的话语或信息。“话”既贴近原文，也保留这一固定表达的庄重感。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以音译呈现四字神名，保留其作为以色列之上帝专名的性质，不以一般称号代替。
- source_word: צְבָאוֹת
  choice: 万军之
  rationale: צְבָאוֹת 字面涉及众军、众军队；在神圣称号中译作“万军之”既是庄重而通行的汉语表达，也保留其统管天上地下众军的意象。
- source_word: לֵאמֹר
  choice: 说
  rationale: 该不定式用来引出随后直接记述的神谕；汉语以“说：”自然地承接下文。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。音译“雅威”较直接地保留专名性质；“上主”是称号替代，“耶和华”则源于较晚形成的传统读音。
- issue: 称号 יְהוָה צְבָאוֹת 的译法
  choice: 万军之雅威
  alternative: 军队之雅威；全能的主
  rationale: “万军之雅威”保留 צְבָאוֹת 的军事及宇宙性意象，也避免把该称号解释性地改写为“全能”。
translation_notes:
  register: 采用现代、庄重而简洁的先知书语体。“传来”使启示公式在现代汉语中自然通顺；保留句末“说：”，以便直接引出下一节的神谕。
