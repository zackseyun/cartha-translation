base_translation:
  language: en
  yaml_path: translation/ot/zechariah/008/004.yaml
  text: 'Thus says Yahweh of hosts: Old men and old women will yet sit in the streets of Jerusalem[a], each with his staff in his hand because of great age.'
translation:
  language: zh_hans
  text: 万军之耶和华如此说：“将来还会有老年男女坐在耶路撒冷的街道上[a]；各人都因年事已高，手里拿着杖。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“广场上”。
    reason: 希伯来词 רְחֹבוֹת 可指宽阔的街道，也可指城中的广场或公共空地。
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: 如此说
  rationale: 保留先知传信公式的庄重语气，同时符合现代汉语表达。
- source_word: יְהוָה צְבָאוֹת
  choice: 万军之耶和华
  rationale: “耶和华”直接呈现神名在现代汉语圣经传统中的通行音译；“万军之”保留称号的广阔含义，不限定为地上的军队。
- source_word: עֹד
  choice: 将来还会
  rationale: 在这里指向复兴之后这种景象将再次出现；“还会”保留“又、仍、还”的语义空间，“将来”使应许的时间指向清楚。
- source_word: יֵשְׁבוּ
  choice: 坐
  rationale: 上下文描绘老年人在公共场所安坐的具体景象，故取具体义“坐”，而不译作“居住”。
- source_word: זְקֵנִים וּזְקֵנוֹת
  choice: 老年男女
  rationale: 两个词分别指年老的男性和女性，并非担任职分的“长老”；此译简洁而明确地保留两性并列。
- source_word: בִּרְחֹבוֹת
  choice: 在……街道上
  rationale: 该词可指宽阔街道或广场；正文采用自然的“街道”，脚注保留“广场”这一可信替代译法。
- source_word: וְאִישׁ
  choice: 他们每个人
  rationale: אִישׁ在此作分配用法，意为“各人、每一个”；补出“他们”使中文指代老年男女双方，避免被误解为只指男性。
- source_word: מִשְׁעַנְתּוֹ בְּיָדוֹ
  choice: 手里拄着杖
  rationale: 以自然汉语呈现“他的杖在他的手中”的具体画面；“拄着”清楚表达杖作为年老者支撑物的作用。
- source_word: מֵרֹב יָמִים
  choice: 因年事已高
  rationale: 希伯来语直义为“因日子众多”，是高龄的习语；此译保留原因关系，并符合庄重自然的现代汉语。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。正文不以“主”这一称号替代，而采用现代简体中文圣经读者最熟悉的神名音译“耶和华”；“雅威”更接近学术界常用的拟定读音，但在普通中文语境中通行度较低。
- issue: “万军”所指范围
  choice: 万军之耶和华
  alternative: 军队之耶和华
  rationale: צְבָאוֹת在神圣称号中可能涵盖天上众军及一切受统领的力量；“万军”保留其传统广度，不将含义缩窄为人间军队。
translation_notes:
  register: 采用现代、庄重且便于普通读者理解的书面汉语。“将来还会有”传达复兴应许，“手里拄着杖”保持画面生动并避免生硬重复男性代词。引号标示耶和华直接宣告的内容。
