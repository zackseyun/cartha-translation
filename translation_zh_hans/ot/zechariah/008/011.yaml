source:
  edition: WLC
  text: וְ/עַתָּ֗ה לֹ֣א כַ/יָּמִ֤ים הָ/רִֽאשֹׁנִים֙ אֲנִ֔י לִ/שְׁאֵרִ֖ית הָ/עָ֣ם הַ/זֶּ֑ה נְאֻ֖ם יְהוָ֥ה צְבָאֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/008/011.yaml
  text: But now I will not be to the remnant of this people as in the former days[b][a], declares Yahweh of Armies.
translation:
  language: zh_hans
  text: 但如今，我对这百姓的余民，已不再如先前的日子[a]。这是万军之耶和华[b]的宣告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文在“我”之后采用省略式，未明说具体谓语。也可译作：“我不会再像先前的日子那样对待这百姓的余民。”
    reason: alternative_reading
  - marker: b
    text: “万军之耶和华”也常译作“万军之主”；“万军”可包括天上的众军。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: 但如今
  rationale: 在语境中承接先前的困苦并转入上帝如今不同的作为；“但如今”自然表达其转折意味。
- source_word: כַיָּמִים הָרִאשֹׁנִים
  choice: 像从前那些日子那样
  rationale: כְּ表示比较；“从前那些日子”既贴近原文复数形式，也自然指向上文所述的艰难时期。
- source_word: לִשְׁאֵרִית הָעָם הַזֶּה
  choice: 对这百姓的余民
  rationale: לְ在此表达上帝与余民之间的关系，可自然译为“对”；“余民”保留 שְׁאֵרִית 在先知书中的重要意象，עָם则按集合名词译为单数“百姓”。
- source_word: נְאֻם
  choice: 宣告
  rationale: 这是先知信息中庄严的神谕公式；名词化表达“这是……的宣告”符合现代汉语，也保留其正式语气。
- source_word: יְהוָה צְבָאוֹת
  choice: 万军之耶和华
  rationale: “耶和华”对应神名 יהוה；“万军”保留 צְבָאוֹת 所含的军旅及天上众军意象，并采用中文读者熟悉的庄严称谓。
theological_decisions:
- issue: אֲנִי 后缺少明说的谓语
  choice: 译作“我对这百姓的余民，不会再像从前那些日子那样”，不补明上帝具体在哪一方面不同
  alternative: “我不会再像从前那些日子那样对待这百姓的余民”
  rationale: 原文是省略结构，语境表明上帝对余民的处境和作为将有改变，却没有明确写出“对待”等谓语。正文用自然汉语保留这种开放性，脚注再说明可能的补足理解。
- issue: יְהוָה צְבָאוֹת 的称号表达
  choice: 万军之耶和华
  alternative: 万军之主
  rationale: 译出神名与“众军”的称号，避免把 יהוה 泛化为普通称谓，同时不限定“军”仅指地上的军队。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“不会再像……那样”使希伯来文省略句在汉语中可读，同时不擅自说明上帝究竟在哪一方面不再如从前；“这是……的宣告”保留先知神谕公式的正式感。
