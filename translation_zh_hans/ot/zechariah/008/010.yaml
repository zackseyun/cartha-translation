- from: 因为在那些日子以前，人没有工钱，牲畜也没有报酬；出入的人因敌对者而不得平安[a][b]。我使众人彼此为敌。[c]
  to: 因为在那些日子以前，人没有工钱，牲畜也没有报酬；出入的人因仇敌的缘故不得平安[a][b]。我使众人彼此为敌。[c]
  rationale: 修订将“敌对者”调整为更自然的“仇敌”，并重写脚注 c，使其准确说明原文动词及“各人对抗邻舍”的分配性结构。其余正文保留原译对原文语义、神学张力和现代汉语语体的恰当处理。
