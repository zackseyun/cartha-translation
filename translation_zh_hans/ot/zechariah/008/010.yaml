source:
  edition: WLC
  text: כִּ֗י לִ/פְנֵי֙ הַ/יָּמִ֣ים הָ/הֵ֔ם שְׂכַ֤ר הָֽ/אָדָם֙ לֹ֣א נִֽהְיָ֔ה וּ/שְׂכַ֥ר הַ/בְּהֵמָ֖ה אֵינֶ֑/נָּה וְ/לַ/יּוֹצֵ֨א וְ/לַ/בָּ֤א אֵין שָׁלוֹם֙ מִן הַ/צָּ֔ר וַ/אֲשַׁלַּ֥ח אֶת כָּל הָ/אָדָ֖ם אִ֥ישׁ בְּ/רֵעֵֽ/הוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/008/010.yaml
  text: For before those days there was no wage for man[a], and no wage for beast; and for the one going out and the one coming in there was no peace because of the adversary[c][b], and I set every man against his neighbor.
translation:
  language: zh_hans
  text: 因为在那些日子以前，人没有工钱，牲畜也没有报酬；出入的人因仇敌的缘故不得平安[a][b]。我使众人彼此为敌。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “平安”也可译作“安全”或“安稳”；希伯来语 שָׁלוֹם 可包括和平、安全和福祉。
    reason: lexical_alternative
  - marker: b
    text: “仇敌”也可译作“敌对者”或“敌人”；原文也可理解为“因仇敌而不得平安”。
    reason: lexical_alternative
  - marker: c
    text: 直译：“我使（或差遣）众人，各人攻击自己的邻舍。”这里表达上帝使他们陷入彼此敌对的状态。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上下文，为先前的困境作解释，保留原文的因果或说明作用。
- source_word: לִפְנֵי הַיָּמִים הָהֵם
  choice: 在那些日子以前
  rationale: 直接保留原文的时间表达和“日子”这一意象，同时符合现代汉语习惯。
- source_word: שְׂכַר הָאָדָם לֹא נִהְיָה
  choice: 人没有工钱
  rationale: שְׂכַר 指劳动所得的工钱或报酬；הָאָדָם 在与牲畜对举时泛指人类劳动者，汉语“人”自然涵盖这一代表性用法。
- source_word: וּשְׂכַר הַבְּהֵמָה אֵינֶנָּה
  choice: 牲畜也没有报酬
  rationale: 保留人与牲畜劳动所得之间的平行结构；“牲畜”准确表达 בְּהֵמָה 的家畜范围，“报酬”比“工钱”用于牲畜更自然。
- source_word: וְלַיּוֹצֵא וְלַבָּא
  choice: 出入的人
  rationale: 以简洁的汉语保留原文“出去和进来的人”这一成对惯用语，泛指日常往来、出行的人。
- source_word: אֵין שָׁלוֹם
  choice: 不得平安
  rationale: שָׁלוֹם 可涵盖和平、安全和安稳；正文采用传统且宽广的“平安”，并以脚注说明其语义范围。
- source_word: מִן הַצָּר
  choice: 因敌对者
  rationale: הַצָּר 在此最可能指造成道路不安的仇敌或敌对者；מִן 按语境表达原因。正文不把所指进一步限定为军队或某个具体敌人。
- source_word: וַאֲשַׁלַּח אֶת כָּל הָאָדָם אִישׁ בְּרֵעֵהוּ
  choice: 我使众人彼此为敌
  rationale: 保留上帝作为行动主体以及人与人相敌的神学张力；用自然汉语表达“各人与同伴相对”的分配性结构。
theological_decisions:
- issue: אָדָם 的泛指范围
  choice: 人／众人
  alternative: 男人／全人类
  rationale: 本节对比人和牲畜，所指是人类劳动者，并非只指男性；现代汉语“人”和“众人”既忠于泛指意义，也不额外引入性别限定。
- issue: 社会冲突中的上帝能动性
  choice: 我使众人彼此为敌
  alternative: 众人彼此为敌
  rationale: 原文明确以上帝为 וַאֲשַׁלַּח 的主语。正文不删减或弱化这一因果关系，同时不扩写其方式，以保留原文的神学张力。
- issue: וַאֲשַׁלַּח 的具体力度
  choice: 使……彼此为敌
  alternative: 差遣／任凭……彼此为敌
  rationale: 该动词字面有“发送、放出”之意，在此结构中表示使众人相互敌对。正文表达结果，却不擅自判定这是直接煽动还是审判性的任凭；脚注保留较直译形式。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“工钱／报酬”保留人与牲畜劳动所得的平行关系；“出入的人”沿用普通读者易懂的成对表达；“彼此为敌”避免生硬直译，同时明确保留上帝的行动主体地位。
