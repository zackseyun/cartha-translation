  text: אֵ֥לֶּה הַ/דְּבָרִ֖ים אֲשֶׁ֣ר תַּֽעֲשׂ֑וּ דַּבְּר֤וּ אֱמֶת֙ אִ֣ישׁ אֶת רֵעֵ֔/הוּ אֱמֶת֙ וּ/מִשְׁפַּ֣ט שָׁל֔וֹם שִׁפְט֖וּ בְּ/שַׁעֲרֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/008/016.yaml
  text: 'These are the things that you must do: speak truth to one another[c][b][a]; judge with truth and a judgment of peace in your gates.'
translation:
  language: zh_hans
  text: 你们当做的事是这些：彼此说实话；在你们的城门口[a]，施行真实而促进和平的审判。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “城门口”是古代城镇审理案件、作出判决的公共场所。
    reason: cultural_note
  - marker: b
    text: 也可译作“按真理作出带来和平的判决”。
    reason: alternative_reading
lexical_decisions:
- source_word: אֵלֶּה הַדְּבָרִים אֲשֶׁר תַּעֲשׂוּ
  choice: 你们当做的事是这些
  rationale: דְּבָרִים在这里引出具体伦理要求，译作“事”比“话”更切合；“当”自然表达上下文中的义务语气。
- source_word: דַּבְּרוּ אֱמֶת אִישׁ אֶת־רֵעֵהוּ
  choice: 彼此说实话
  rationale: 准确传达命令及אִישׁ אֶת־רֵעֵהוּ的相互关系；现代汉语中“彼此”比逐字译为“各人对邻舍”更自然，而“说实话”保留诚信言语的伦理重点。
- source_word: אֱמֶת וּמִשְׁפַּט שָׁלוֹם שִׁפְטוּ
  choice: 要按真理作出带来和平的判决
  rationale: “按真理”保留אֱמֶת作为审判准则的意义；“作出……判决”符合司法语境；“带来和平”表达שָׁלוֹם对判决性质或结果的修饰，同时不把紧凑的希伯来语结构过度确定化。
- source_word: בְּשַׁעֲרֵיכֶם
  choice: 在你们的城门口
  rationale: 明确这是各城的城门区域，并保留古代司法场所的具体意象；文化背景以脚注说明。
theological_decisions:
- issue: 伦理命令中阳性代表单数אִישׁ的表达
  choice: 彼此
  alternative: 各人对自己的邻舍
  rationale: 该结构在上下文中表达群体成员之间相互说真话；“彼此”在现代汉语中自然、准确，也不把代表性阳性单数误解为只针对男性。
- issue: 司法短语中שָׁלוֹם的作用
  choice: 带来和平的判决
  alternative: 真实而和平的判决
  rationale: 希伯来语名词串结构紧凑，既可理解为和平性质的判决，也可强调促成和平的结果。正文采用自然且符合语境的结果性表达，脚注保留另一种读法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“彼此说实话”简洁有力；后半句保留司法语境和“真理—和平”之间的张力。所有脚注标记均置于正文相关位置。
