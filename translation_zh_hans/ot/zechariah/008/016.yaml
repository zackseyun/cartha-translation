  source_fidelity: “彼此说实话”准确传达דברו אמת איש את־רעהו的群体互相性，且适合现代汉语。后半句“按真理作出带来和平的判决”基本可通，但将אמת明确处理为审判所依据的准则、将שלום限定为判决所产生的结果；原文紧凑的名词结构更宜保留为判决本身真实且与和平相关的性质。
  naturalness: 整体庄重、清楚。“在你们的城门口施行真实而促进和平的审判”在现代普通话中自然，也保留古代城门作为司法场所的意象。
  terminology: “审判／判决”适合משפט与שפט的司法语境；“真实而促进和平的审判”比“按真理作出带来和平的判决”较少预先界定两个名词的语法关系。
  issues:
