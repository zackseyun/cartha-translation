base_translation:
  language: en
  yaml_path: translation/ot/zechariah/008/008.yaml
  text: I will bring them[a], and they will dwell in the midst of Jerusalem; and they will be my people, and I will be their God[c][b], in truth and in righteousness.
translation:
  language: zh_hans
  text: 我必带他们来，他们就必住在耶路撒冷中间[a]。他们要作我的子民，我要作他们的上帝；这要在真实[b]和公义[c]中实现。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“在耶路撒冷中间”，也可译作“在耶路撒冷以内”。
    reason: lexical_alternative
  - marker: b
    text: “真实”也可译作“信实”或“诚实”。原文中“在真实和公义中”的修饰范围并不明确，也可理解为描述整个盟约关系。
    reason: lexical_alternative_and_scope_ambiguity
  - marker: c
    text: “公义”也可译作“正义”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵבֵאתִי
  choice: 我要把他们领来
  rationale: 使役式在这里表示“带来、领来”。不增译“领回来”，因为“回来”虽符合复兴语境，却不是本词明说的内容。
- source_word: וְשָׁכְנוּ
  choice: 使他们住
  rationale: שׁכן 指居住、定居；现代汉语用“住”自然清楚，并保留安居之意。
- source_word: בְּתוֹךְ יְרוּשָׁלִָם
  choice: 在耶路撒冷城中
  rationale: 保留 בְּתוֹךְ“在……中间、内部”的空间含义；“城中”比单说“在耶路撒冷”更具体，也符合现代汉语。
- source_word: וְהָיוּ לִי לְעָם
  choice: 他们要作我的子民
  rationale: 保留希伯来圣经中固定的盟约表达，同时使用庄重而易懂的汉语。
- source_word: וַאֲנִי אֶהְיֶה לָהֶם לֵאלֹהִים
  choice: 我要作他们的上帝
  rationale: 对应固定的盟约公式，不改写为解释性的关系用语。
- source_word: בֶּאֱמֶת
  choice: 以信实
  rationale: אֱמֶת 可指真实、信实或可靠；在盟约语境中“信实”自然，但脚注保留“真实”的可能。
- source_word: וּבִצְדָקָה
  choice: 和公义
  rationale: צְדָקָה 可表示公义、正义；正文采用较能维持盟约及神学关联的“公义”，脚注保留另一译法。
theological_decisions:
- issue: 盟约公式
  choice: 译为“他们要作我的子民，我要作他们的上帝”
  alternative: 解释为“他们要属于我，我要像上帝一样照顾他们”
  rationale: 原文采用固定的盟约公式，应保存其跨经卷联系，不加入原文未明说的解释。
- issue: בֶּאֱמֶת וּבִצְדָקָה 的修饰范围
  choice: 译为“我必以信实和公义与他们相待”
  alternative: 较形式地译作“在真实和公义中”，使其可修饰整个盟约关系
  rationale: 汉语若直译“在信实和公义中”较生硬；正文以自然表达说明上帝建立并维系这一关系的方式，但该短语在希伯来文中的确切修饰范围并非完全封闭，因此脚注提示其也可理解为描述整个盟约关系。
translation_notes:
  register: 采用现代、庄重且易懂的标准普通话。“子民”保留盟约语体；“上帝”符合本项目用语。分为两句以增强可读性。
