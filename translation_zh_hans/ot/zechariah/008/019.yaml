  text: כֹּֽה אָמַ֞ר יְהוָ֣ה צְבָא֗וֹת צ֣וֹם הָ/רְבִיעִ֡י וְ/צ֣וֹם הַ/חֲמִישִׁי֩ וְ/צ֨וֹם הַ/שְּׁבִיעִ֜י וְ/צ֣וֹם הָ/עֲשִׂירִ֗י יִהְיֶ֤ה לְ/בֵית יְהוּדָה֙ לְ/שָׂשׂ֣וֹן וּ/לְ/שִׂמְחָ֔ה וּֽ/לְ/מֹעֲדִ֖ים טוֹבִ֑ים וְ/הָ/אֱמֶ֥ת וְ/הַ/שָּׁל֖וֹם אֱהָֽבוּ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/008/019.yaml
  text: 'Thus says Yahweh of hosts: The fast of the fourth month[a], and the fast of the fifth, and the fast of the seventh, and the fast of the tenth, shall become for the house of Judah joy and gladness and good appointed feasts[c][b]. Therefore love truth and peace.'
translation:
  language: zh_hans
  text: 万军之耶和华如此说：“四月的禁食、五月的禁食、七月的禁食和十月的禁食[a]，都要成为犹大家的欢喜、快乐和美好的节期[c]。”你们要喜爱真理与和平。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作：“第四个禁食、第五个禁食、第七个禁食和第十个禁食。”希伯来文以序数词称这些禁食，按语境很可能是指月份。
    reason: lexical_alternative
  - marker: c
    text: “节期”所译的词可指指定的时间，常特指规定的宗教节期。
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: 万军之耶和华
  rationale: 以“耶和华”音译神的专名，以“万军”保留 צְבָאוֹת 所涵盖的天上与地上众军；整体也是现代中文圣经语体中庄重而易懂的称号。
- source_word: צ֣וֹם ... הָרְבִיעִי / הַחֲמִישִׁי / הַשְּׁבִיעִי / הָעֲשִׂירִי
  choice: 四月的禁食、五月的禁食、七月的禁食和十月的禁食
  rationale: 希伯来文逐项重复“禁食”，序数词按语境指月份。正文补出“月”，使现代读者容易理解，同时在脚注保留“四次禁食”的形式可能。
- source_word: יִהְיֶה
  choice: 都要成为
  rationale: 该动词本义为“要成为／要是”。上下文表明原来的禁食将转为欢庆，故译作“要成为”；“都”自然统摄前列四项。
- source_word: לְבֵית יְהוּדָה
  choice: 犹大家
  rationale: 保留“家”的群体、宗族和圣约共同体色彩，避免简化为地名“犹大”。
- source_word: לְשָׂשׂוֹן וּלְשִׂמְחָה
  choice: 欢喜快乐的日子
  rationale: “欢喜快乐”自然保留两个近义喜乐词形成的修辞叠用；补出“日子”使其与前述禁食日期及后面的节期衔接顺畅。
- source_word: וּלְמֹעֲדִים טוֹבִים
  choice: 和美好的节期
  rationale: מוֹעֵד 可指指定的时间，尤其指宗教节期；“节期”兼顾历法和礼仪含义，“美好的”直接对应 טוֹבִים。
- source_word: וְהָאֱמֶת וְהַשָּׁלוֹם אֱהָבוּ
  choice: 所以，你们要喜爱真理与和平
  rationale: 命令“喜爱”明确；补出主语“你们”符合现代汉语。句首连接词字面为“和”，在此处承接应许转入劝勉，译作“所以”表达语篇关系，同时在神学说明中保留“并且”的可能。
- source_word: אֱמֶת
  choice: 真理
  rationale: 此处指应当喜爱的真实、正直原则；“真理”是直接且庄重的译法，但也可能含“诚信”之义。
- source_word: שָׁלוֹם
  choice: 和平
  rationale: 在伦理与群体关系的劝勉中，“和平”自然贴切，同时不排除该词所含平安、健全与福祉的较广意义。
theological_decisions:
- issue: 禁食与节期之间的转变
  choice: 译为禁食“都要成为”欢喜快乐的日子和美好节期，表达其功用与性质的转变。
  alternative: 可较形式化地译为“对犹大家来说，都要是欢喜快乐和美好的节期”。
  rationale: 原文并未明说这些禁食被废除或由另一制度取代，只宣告它们将为犹大家带来喜乐并成为节期；因此不加入更强的制度性结论。
- issue: 末句连接词的逻辑力度
  choice: 译作“所以”，将应许与随后的伦理命令连接起来。
  alternative: 可译作“并且，你们要喜爱真理与和平”，较直接保留 וְ 的并列形式。
  rationale: “所以”符合上下文由应许转向回应的语篇走向，但不把它解释为完整的条件交换或救恩因果关系。
- issue: “真理”的伦理内涵
  choice: 正文保留“真理”，不限定为抽象教义或单纯诚实。
  alternative: 可按伦理语境译作“诚信”或“真实”。
  rationale: אֱמֶת 的语义可涵盖真理、真实和信实；保留较宽的“真理”可避免将其神学与伦理张力过早收窄。
translation_notes:
  register: 采用现代、庄重而通顺的简体中文。“万军之耶和华”“犹大家”“节期”保留先知书的圣经语域；列举禁食时保持原文重复形成的郑重节奏。脚注标记均置于相关正文位置。
