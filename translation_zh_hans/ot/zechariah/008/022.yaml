  text: וּ/בָ֨אוּ עַמִּ֤ים רַבִּים֙ וְ/גוֹיִ֣ם עֲצוּמִ֔ים לְ/בַקֵּ֛שׁ אֶת יְהוָ֥ה צְבָא֖וֹת בִּ/ירוּשָׁלִָ֑ם וּ/לְ/חַלּ֖וֹת אֶת פְּנֵ֥י יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/008/022.yaml
  text: And many peoples and mighty nations will come to seek Yahweh of hosts in Jerusalem and to entreat the favor of Yahweh[a].
translation:
  language: zh_hans
  text: 许多民族和强大的国家都将前来，在耶路撒冷寻求万军之耶和华，并求耶和华施恩[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“恳求耶和华的恩宠。”希伯来语字面为“恳求耶和华的面”；这是求恩的习语，并保留来到他面前的意象。
    reason: 说明חלה את־פני יהוה的字面意象和惯用含义，避免将“临在”作为本处习语的同等直接译法。
lexical_decisions:
- source_word: וּבָאוּ
  choice: 都将前来
  rationale: 在这一预言语境中，带连接词的完成式表达将来的行动；“将前来”自然地保留预告意味，“都”呼应后面的众多群体。
- source_word: עַמִּים רַבִּים
  choice: 许多民族
  rationale: עַמִּים指多个族群或人民共同体；译作“民族”可与下文表示政治性国家群体的גּוֹיִם有所区别。
- source_word: וְגוֹיִם עֲצוּמִים
  choice: 和强盛的邦国
  rationale: גּוֹיִם在此指列国；עֲצוּמִים强调强大有力。“强盛的邦国”保留其政治共同体及实力的含义，并避免与前面的“民族”重复。
- source_word: לְבַקֵּשׁ אֶת יְהוָה צְבָאוֹת
  choice: 寻求万军之耶和华
  rationale: בקשׁ带直接宾语，意为寻求；“万军之耶和华”保留神名及צְבָאוֹת所含天上或军事众军的称号意象。
- source_word: בִּירוּשָׁלִָם
  choice: 在耶路撒冷
  rationale: 介词בְּ在此为地点用法，直译且符合朝圣场景。
- source_word: וּלְחַלּוֹת אֶת פְּנֵי יְהוָה
  choice: 并恳求耶和华施恩
  rationale: חלה את־פני是恳求某人垂顾、求其恩惠的习语；正文采用自然汉语表达其祈求含义，脚注保留“面”及“临在”的源语意象。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 正文采用现代中文圣经读者最熟悉、可明确识别为四字神名的“耶和华”；这不是把神名泛化为“主”。“雅威”较接近学术界常见的拟音，可作为可能的译写，但本节无需脚注重复说明。
- issue: 称号צְבָאוֹת的译法
  choice: 万军之
  alternative: 全能的
  rationale: “万军之”保留原文众军、军旅的具体意象；“全能的”表达相关神学属性，却不是该词在此处的直接词义。
- issue: חלה את־פני所表达的祈求对象
  choice: 恳求耶和华施恩
  alternative: 寻求耶和华的面／临在
  rationale: 该习语可侧重求恩惠，也保留寻求其面或临在的形象。正文传达通常的习语意义，脚注提示原文意象，不把两者强行割裂。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“许多民族”和“强盛的邦国”保留עַמִּים与גּוֹיִם之间可感知的区别；句法略作汉语化处理，但维持两项目的并列结构。
