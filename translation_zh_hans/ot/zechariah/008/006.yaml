    rationale: 该译法保留了“非凡”的词义，却使反问的语用功能在汉语中不够清楚；上下文的对照是人所认为难成之事与神的能力，而非神是否也觉得某事奇妙。译为“太难”更贴合此处的语境和修辞。
  - severity: low
    issue: “这余民”未清晰表达 שְׁאֵרִית הָעָם הַזֶּה 的属格关系
    rationale: 原文是“这百姓中所余剩的人”，而“这余民”在现代汉语中可被读成“这个余民”。明确所属关系可提高准确性和可读性。
  revised_text: 万军之耶和华如此说：“若在那些日子，这事在这百姓中余剩的人看来太难[a]，难道在我看来也太难吗？”这是万军之耶和华的宣告。
  revised_footnotes:
