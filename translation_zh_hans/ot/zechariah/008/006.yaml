  text: כֹּ֤ה אָמַר֙ יְהוָ֣ה צְבָא֔וֹת כִּ֣י יִפָּלֵ֗א בְּ/עֵינֵי֙ שְׁאֵרִית֙ הָ/עָ֣ם הַ/זֶּ֔ה בַּ/יָּמִ֖ים הָ/הֵ֑ם גַּם בְּ/עֵינַ/י֙ יִפָּלֵ֔א נְאֻ֖ם יְהוָ֥ה צְבָאֽוֹת־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/008/006.yaml
  text: 'Thus says Yahweh of hosts: If it is marvelous in the eyes of the remnant of this people in those days[a], should it also be marvelous in my eyes? declares Yahweh of hosts.'
translation:
  language: zh_hans
  text: 万军之耶和华如此说：“若在那些日子，这事在这百姓中余剩的人看来太难[a]，难道在我看来也太难吗？”这是万军之耶和华的宣告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“奇妙”或“非凡”。这个希伯来语动词可指非凡、奇妙，也可指太难或超出人的能力。
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: 如此说
  rationale: 保留先知传信公式的庄重节奏，同时符合现代汉语表达。
- source_word: יְהוָה צְבָאוֹת
  choice: 万军之耶和华
  rationale: “耶和华”直接标示神名；“万军”保留צְבָאוֹת所涵盖的天上、地上众军之广度，也是中文圣经语境中清楚而庄重的称号。
- source_word: כִּי
  choice: 若
  rationale: 此处引出条件性或让步性的前件，并与后面的反问构成对照；“若”简洁自然。
- source_word: יִפָּלֵא
  choice: 显得奇妙
  rationale: פלא的被动词干可指非凡、奇妙，也可指难以做到。正文保留“奇妙”这一较开放的含义，并以脚注说明“太难、不能实现”的可能语义。
- source_word: בְּעֵינֵי
  choice: 在……眼中
  rationale: 保留希伯来语评价视角的惯用表达，并维持前后两句的平行结构。
- source_word: שְׁאֵרִית הָעָם הַזֶּה
  choice: 这余民
  rationale: “余民”保留先知书中经历审判后被存留之群体的术语意义；中文无需重复译出“百姓的”，即可自然表达所指。
- source_word: בַּיָּמִים הָהֵם
  choice: 在那些日子
  rationale: 保留原文复数时间表达及其预言性、复兴语境。
- source_word: גַּם בְּעֵינַי יִפָּלֵא
  choice: 难道在我眼中也显得奇妙吗
  rationale: 以反问呈现原文重复结构和גם所表达的对比，同时不在正文中直接补出否定答案。
- source_word: נְאֻם יְהוָה צְבָאוֹת
  choice: 这是万军之耶和华的宣告
  rationale: “宣告”体现נְאֻם作为庄严神谕确认语的性质，较单纯的“说”更能与句首公式区分。
theological_decisions:
- issue: 反问句是否否认神实现复兴的能力受到限制
  choice: 译作反问：“难道在我眼中也显得奇妙吗？”
  alternative: 直陈为“在我眼中也显得奇妙”
  rationale: 上下文将余民的眼光与耶和华的眼光相对照，反问最能传达隐含的否定答案；同时不额外加入正文未明说的系统性教义陈述。
- issue: יִפָּלֵא在此强调“奇妙”还是“太难”
  choice: 正文译“显得奇妙”，脚注保留“太难、不能实现”
  alternative: 正文直接译“太难”或“不可能”
  rationale: 该词的语义范围同时涉及非凡与超出能力；正文保留词义张力，脚注帮助读者理解本节与神能力之对比。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“如此说”“万军之耶和华”“宣告”维持先知话语的肃穆感；以“这余民”避免生硬的“这百姓的余民”，并保留核心神学术语。
