id: ZEC.8.18
reference: Zechariah 8:18
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יְהִ֛י דְּבַר יְהוָ֥ה צְבָא֖וֹת אֵלַ֥/י לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/008/018.yaml
  text: 'And the word of Yahweh of hosts came to me[a], saying:'
translation:
  language: zh_hans
  text: 万军之雅威的话临到我，说：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: 临到
  rationale: 这里的 וַיְהִי 是承接叙事的常用形式；汉语将其与“话”合译为“话临到”，既自然，也保留先知书的固定表达。
- source_word: דְּבַר
  choice: 话
  rationale: 在先知领受启示的公式中，דְּבַר 指来自上帝的具体言语或信息；“话”比“信息”更贴近原文，也符合庄重的经文语体。
- source_word: יְהוָה
  choice: 雅威
  rationale: 采用对四字神名的音译，以保留其作为上帝专名的性质，而不以“主”等称号替代。
- source_word: צְבָאוֹת
  choice: 万军之
  rationale: 在 יְהוָה צְבָאוֹת 这一称号中，“万军之”保留原文关于众军的意象，也延续现代中文圣经读者熟悉的庄重表达。
- source_word: אֵלַי
  choice: 临到我
  rationale: 介词短语表明先知是这话的领受者；与“话”搭配译为“临到我”准确而自然。
- source_word: לֵאמֹר
  choice: 说：
  rationale: 这是引出随后直接话语的固定形式；冒号清楚表明内容接续于下一节。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用以色列上帝的专名。译作“雅威”保留专名性质；不采用“上主”，以免将名字改成称号。
- issue: 称号 יְהוָה צְבָאוֹת 的译法
  choice: 万军之雅威
  alternative: 雅威万军之主；全能的雅威
  rationale: “万军之雅威”较直接地保留属格结构及“众军”的意象，不把它解释性地改写为“全能者”。
translation_notes:
  register: 采用简洁、庄重而易懂的现代标准汉语，并保留先知书中“……的话临到我，说”的传统启示公式。英文咨询层所附脚注的位置与内容不相符，且希伯来文本在此没有相应异读，因此未收入正文或脚注。
