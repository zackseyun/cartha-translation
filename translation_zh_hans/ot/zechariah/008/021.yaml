base_translation:
  language: en
  yaml_path: translation/ot/zechariah/008/021.yaml
  text: And the inhabitants of one city will go to another, saying, ‘Let us surely go to entreat the favor of the LORD and to seek the LORD of hosts.’ ‘I myself am going too.’
translation:
  language: zh_hans
  text: 一城的居民要到另一城去，说：“我们一定要去恳求耶和华施恩，寻求万军之耶和华。”“我自己也要去。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יֹשְׁבֵי אַחַת אֶל אַחַת
  choice: 一城的居民要到另一城去
  rationale: 原文两处阴性数词“一个”省略了“城”，由上下文补出；译文自然表达城与城之间的往来。
- source_word: נֵלְכָה הָלוֹךְ
  choice: 我们一定要去
  rationale: 未定式绝对形הָלוֹךְ与限定动词连用，强化去的决心或行动力度；“一定要去”保留这种强调。
- source_word: לְחַלּוֹת אֶת־פְּנֵי יְהוָה
  choice: 恳求耶和华施恩
  rationale: 该习语字面涉及“使……的面柔和”，实际表示恳切求取恩惠；此译法既自然，也保留向耶和华恳求恩待的含义。
- source_word: יְהוָה צְבָאוֹת
  choice: 万军之耶和华
  rationale: 采用现代中文圣经语体中通行且庄重的称谓，保留צְבָאוֹת所表达的众军/天军权能意象。
- source_word: אֵלְכָה גַּם־אָנִי
  choice: 我也要去
  rationale: 独立人称代词אָנִי带有强调作用；中文以“我也”自然体现说话者亲自加入的意味。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 采用普通简体中文读者最熟悉的传统专名，不将其泛化为“主”，同时不借译名引入特定宗派立场。
- issue: 末句与前面引语的说话关系
  choice: 另立引号译为“我也要去”
  alternative: 将末句并入同一段引语
  rationale: 原文没有现代标点，末句既可视为所述话语的延续，也可理解为听者的响应；另立引号依照咨询层的篇章理解，同时不增添说话者身份。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准普通话。保留原文“我们”到“我”的人称转换和行动决心，不补充原文未明说的城市名称或说话者身份。
