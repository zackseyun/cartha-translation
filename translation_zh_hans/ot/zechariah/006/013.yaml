id: ZEC.6.13
reference: Zechariah 6:13
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ֠/הוּא יִבְנֶ֞ה אֶת הֵיכַ֤ל יְהוָה֙ וְ/הֽוּא יִשָּׂ֣א ה֔וֹד וְ/יָשַׁ֥ב וּ/מָשַׁ֖ל עַל כִּסְא֑/וֹ וְ/הָיָ֤ה כֹהֵן֙ עַל כִּסְא֔/וֹ וַ/עֲצַ֣ת שָׁל֔וֹם תִּהְיֶ֖ה בֵּ֥ין שְׁנֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/006/013.yaml
  text: Yes[a], he will build the temple of Yahweh, and he will bear majesty, and he will sit and rule on his throne. And he will be a priest on his throne[c][b], and the counsel of peace will be between the two of them.
translation:
  language: zh_hans
  text: 正是他必建造雅威的殿；他必承载威荣[c]，坐在自己的宝座上掌权。他也必在自己的宝座上作祭司[a]；这两者之间必有和平的谋议[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在他的宝座上必有一位祭司。”希伯来语也容许把祭司与坐宝座的统治者理解为两位不同人物。
    reason: alternative_reading
  - marker: b
    text: “这两者”可能指君王与祭司两种职分，也可能指统治者与祭司两位不同人物。
    reason: alternative_reading
  - marker: c
    text: “威荣”也可译作“尊荣”或“荣美”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵיכַל יְהוָה
  choice: 雅威的殿
  rationale: הֵיכָל可指宫殿或圣殿；本段明确涉及为雅威建造的圣所，因此译作“殿”自然准确，并保留神名“雅威”。
- source_word: וְהוּא
  choice: 正是他
  rationale: 此处代词带有强调作用；译作“正是他”比单纯的“他”更能传达希伯来语的强调，也避免把它误解为表示肯定回答的“是的”。
- source_word: יִשָּׂא הוֹד
  choice: 必承载威荣
  rationale: נשא保留“承担、承载”的动词意象；הוֹד兼有尊荣、威严和荣美之意，“威荣”可简洁表达其君王语境中的庄严光彩。
- source_word: וְיָשַׁב וּמָשַׁל עַל כִּסְאוֹ
  choice: 坐在自己的宝座上掌权
  rationale: 保留坐于宝座和施行统治两个要素，以自然现代汉语表达登座执政的图景。
- source_word: וְהָיָה כֹהֵן עַל כִּסְאוֹ
  choice: 他也必在自己的宝座上作祭司
  rationale: 按最自然的语法承接前面的同一位阳性单数主体，同时保留“在宝座上作祭司”这一刻意而突出的表述。
- source_word: וַעֲצַת שָׁלוֹם
  choice: 必有和平的谋议
  rationale: עֵצָה可指谋议、筹划或主张；“和平的谋议”既保留其商议意味，也不把它过度限定为单纯的计划或结果。
- source_word: בֵּין שְׁנֵיהֶם
  choice: 这两者之间
  rationale: 原文没有明说“两者”具体是谁或是什么；此译法保持其简洁和指代上的开放性。
theological_decisions:
- issue: 作祭司者是否与坐宝座掌权者为同一位
  choice: 正文按连续的单数主体译为“他也必在自己的宝座上作祭司”
  alternative: 译为“在他的宝座旁必有一位祭司”，把祭司理解为与统治者不同的第二位人物
  rationale: 希伯来语句法最自然地延续同一主体，但末句“这两者之间”又造成真实的解释张力。正文遵循较直接的语法，脚注则保留区分两位人物的可能。
- issue: “这两者”所指为何
  choice: 不在正文中明确所指
  alternative: 明确解释为君王与祭司两种职分，或统治者与祭司两个人物
  rationale: 原文只说“两者”，可能指君王和祭司的职分，也可能指两位不同人物；明确指定任何一种都会超出文本本身。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“雅威”音译四字神名；“正是他”传达句首强调。“谋议”略具经文庄重感，但仍为现代读者可理解，并保留原文在商议与筹划之间的语义空间。脚注标记分别放在其实际说明的词句之后。
