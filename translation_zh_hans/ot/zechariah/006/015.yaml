id: ZEC.6.15
reference: Zechariah 6:15
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וּ/רְחוֹקִ֣ים יָבֹ֗אוּ וּ/בָנוּ֙ בְּ/הֵיכַ֣ל יְהוָ֔ה וִ/ידַעְתֶּ֕ם כִּֽי יְהוָ֥ה צְבָא֖וֹת שְׁלָחַ֣/נִי אֲלֵי/כֶ֑ם וְ/הָיָה֙ אִם שָׁמ֣וֹעַ תִּשְׁמְע֔וּ/ן בְּ/ק֖וֹל יְהוָ֥ה אֱלֹהֵי/כֶֽם׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/006/015.yaml
  text: And those who are far off will come and build in the temple of Yahweh[a], and you will know that Yahweh of Armies has sent me to you[b]. And this will happen if you diligently obey the voice of Yahweh your God.
translation:
  language: zh_hans
  text: 远方的人[a]必来，参与建造雅威的殿[b]。你们就会知道，万军的雅威差遣我到你们这里来。如果你们确实听从雅威——你们上帝的话，这事就必实现。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “远方的人”可能指身处远地的流亡者，也可能具有更广的含义；原文没有指明他们属于哪个群体。
    reason: alternative_reading
  - marker: b
    text: 原文也可较直译为“在雅威的殿中建造”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּרְחוֹקִים
  choice: 远方的人
  rationale: 该复数形容词在此作名词使用，指身处远方的人；译文不限定他们是流亡者、外邦人或其他群体。
- source_word: יָבֹאוּ וּבָנוּ
  choice: 必来参与……建造
  rationale: 未完成式与承接性的完成式共同表达将来的连续行动；“必来……建造”保留预言语气，“参与”使中文能够自然表达后接介词短语的结构。
- source_word: בְּהֵיכַל יְהוָה
  choice: 参与雅威殿的建造
  rationale: הֵיכָל在此指圣殿；介词בְ字面可译“在……中”，这里按建造语境采用自然中文，同时以脚注保留其字面表达和句法上的开放性。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代中文常见音译呈现四字神名，区别于作为称号的“主”。
- source_word: וִידַעְתֶּם
  choice: 你们就会知道
  rationale: 表达前述事件所带来的将来认识；“就”自然呈现上下文的结果关系，但不额外强化逻辑。
- source_word: יְהוָה צְבָאוֹת
  choice: 万军之雅威
  rationale: צְבָאוֹת表示众军、军队；“万军之雅威”既保留传统可辨识性，也传达神统率众军的称号。
- source_word: שְׁלָחַנִי אֲלֵיכֶם
  choice: 差了我到你们这里来
  rationale: 完成式表示差遣已经发生；中文用“差了”保留完成性，并准确表达אֲלֵיכֶם的方向。
- source_word: וְהָיָה
  choice: 这事就必成就
  rationale: 该表达在条件句中指前述之事得以发生；“成就”符合预言语境，同时不具体限定条件只关联哪一项前述应许。
- source_word: אִם שָׁמוֹעַ תִּשְׁמְעוּן
  choice: 如果你们确实听从
  rationale: 同根不定式绝对形与限定动词连用以加强语气；“确实”体现强调，“听从”兼顾聆听与顺服的盟约语境。
- source_word: בְּקוֹל יְהוָה אֱלֹהֵיכֶם
  choice: 雅威你们上帝的话
  rationale: “听从某人的声音”在此表示听从其权威性吩咐；现代中文以“听从……的话”更自然。
theological_decisions:
- issue: “远方的人”的身份和范围
  choice: 保留为泛称“远方的人”
  alternative: 明确译作远方的外邦人，或从远地归来的犹大流亡者
  rationale: 希伯来文本没有明确指认这一群体；泛称既可涵盖地理上的远方，也不排除更广的先知性含义。
- issue: 末尾条件句与前述应许的关系
  choice: 译作真实条件：“如果……，这事就必成就”
  alternative: 将其视为独立劝勉，或只限定“你们就会知道”这一句
  rationale: 句法自然地将条件置于前述预言之后，但没有精确说明条件只作用于其中哪一部分；译文保留这种张力。
- issue: 神名与“万军”称号
  choice: 分别译为“雅威”和“万军之雅威”
  alternative: 以“耶和华”或“万军之主”等传统替代称呼表达
  rationale: 直接呈现专名有助于读者区分神的名字与称号；“万军”保留צְבָאוֹת的军事及宇宙统辖意象。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“必来”“成就”保留先知话语的郑重感；避免古奥虚词。将“听从……的声音”自然化为“听从……的话”，并以“确实”体现希伯来语加强结构。
