  text: אֲשֶׁר בָּ֞/הּ הַ/סּוּסִ֣ים הַ/שְּׁחֹרִ֗ים יֹֽצְאִים֙ אֶל אֶ֣רֶץ צָפ֔וֹן וְ/הַ/לְּבָנִ֔ים יָצְא֖וּ אֶל אַֽחֲרֵי/הֶ֑ם וְ/הַ֨/בְּרֻדִּ֔ים יָצְא֖וּ אֶל אֶ֥רֶץ הַ/תֵּימָֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/006/006.yaml
  text: The black horses in it are going out to the land of the north[a], and the white ones have gone out after them, and the dappled ones have gone out to the land of the south.
translation:
  language: zh_hans
  text: 其中的黑马正往北方之地去，白马已经跟在它们后面出去，带斑点的马则往南方之地去。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “南方”或译“提幔”，若将 תֵּימָן 理解为地名，而不是表示方向的“南方”。
    reason: 保留希伯来词既可表示南方、也可指地名提幔的歧义。
lexical_decisions:
- source_word: אֲשֶׁר בָּהּ
  choice: 其中套着……的车
  rationale: 关系短语回指上一节的战车。中文补出“车”，并以“套着”自然表达马与车的关系，避免把马误解为单纯位于车内。
- source_word: הַסּוּסִים הַשְּׁחֹרִים
  choice: 黑马
  rationale: 按原文直译颜色和名词；中文无需保留定冠词。
- source_word: יֹצְאִים
  choice: 正驶向
  rationale: 分词表现异象中正在进行的动作；“驶”适合由马牵引的战车，并结合方向补语自然表达“出去前往”。
- source_word: אֶל אֶרֶץ צָפוֹן
  choice: 向北方之地
  rationale: 保留原文“地／地区”的表达及方向意象，同时采用庄重而易懂的现代汉语。
- source_word: וְהַלְּבָנִים
  choice: 白马的车
  rationale: 希伯来文省略“马”，但中文为明确各组马所牵引的战车而补出“马的车”，与上文所指相接。
- source_word: יָצְאוּ אֶל אַחֲרֵיהֶם
  choice: 跟在它们后面驶出
  rationale: 完成式与前一分词形成体貌差异；“跟在它们后面”保留 אַחֲרֵיהֶם 可指空间跟随或行动次序的含义。
- source_word: וְהַבְּרֻדִּים
  choice: 斑点马的车
  rationale: בְּרֻדִּים 指杂色、带斑点的毛色；“斑点马”是清楚自然的中文表达。
- source_word: אֶל אֶרֶץ הַתֵּימָן
  choice: 向南方之地
  rationale: 与“北方之地”形成方向上的平行，故正文取“南方”；“提幔”地名的可能性收入脚注。
theological_decisions:
- issue: 异象中 הַתֵּימָן 的含义
  choice: 南方
  alternative: 提幔
  rationale: 本节将其与“北方之地”平行，方向区域的解释更符合行文结构；但该词也可作为以东地区的地名“提幔”，因此不排除这一真实歧义，并在脚注中注明。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。为使异象画面清楚，依据上文补出“车”，并用“套着……的车”表达马拉战车；正文保留“北方之地／南方之地”的平行结构。
