lexical_decisions:
- source_word: וַיְהִי
  choice: 临到
  rationale: 该叙事形式在这里引出接续事件，并与后面的主语“耶和华的话”共同构成先知书常见表达；中文用“临到”自然承载其语篇推进作用，无须直译为“事情发生了”。
- source_word: דְבַר
  choice: 话
  rationale: 在固定先知公式 דְבַר יְהוָה 中译作“话”，既贴近原文，又保留圣经先知宣告的传统表达及互文联系。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者最熟悉的专名形式呈现四字神名，区别于“主”这一称号。
- source_word: אֵלַי
  choice: 我
  rationale: 介词加第一人称单数后缀表示话语所临到的对象；在中文“临到我”中准确而自然。
- source_word: לֵאמֹר
  choice: 说
  rationale: 该不定式引出随后神谕的内容；中文先知公式用“说”简洁、庄重，也与下一节直接衔接。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。中文正文采用已广泛通行并可被普通读者识别的专名“耶和华”，不以称号“主”替代；“雅威”则是更贴近学界常见拟音的另一选择。
translation_notes:
  register: 采用现代、庄重且自然的先知书惯用句式“耶和华的话临到我，说”，保留原文公式化结构，并以冒号提示话语内容将在下一节展开。
