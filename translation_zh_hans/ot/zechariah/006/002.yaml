  text: 第一辆车套着红马，第二辆车套着黑马。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּמֶּרְכָּבָה
  choice: 车有
  rationale: מֶרְכָּבָה指马拉的战车或车辆；ב在异象叙述中表示马与车的所属或配置关系。现代汉语用“车有……马”比直译“在车里”自然，也不致让人误以为马位于车厢内部。
- source_word: הָרִאשֹׁנָה
  choice: 第一辆
  rationale: 阴性序数词与阴性名词מֶרְכָּבָה一致，表示异象中车辆的先后次序；汉语以量词“辆”自然表达。
- source_word: סוּסִים
  choice: 马
  rationale: 该词是“马”的复数；现代汉语名词通常无需以形态标示复数，语境已表明不止一匹。
- source_word: אֲדֻמִּים
  choice: 红
  rationale: 基本颜色词，直接译为“红”，保留异象鲜明的颜色描写。
- source_word: וּבַמֶּרְכָּבָה
  choice: 第二辆车有
  rationale: 保留ו所连接的平行分句，并用自然汉语表达ב所表示的配置或所属关系。
- source_word: הַשֵּׁנִית
  choice: 第二辆
  rationale: 序数词表示下一辆车，配合汉语车辆量词“辆”。
- source_word: שְׁחֹרִים
  choice: 黑
  rationale: 基本颜色词，译为“黑”，与前句的“红”形成视觉对照。
