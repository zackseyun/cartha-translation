  text: וּ/בַ/מֶּרְכָּבָ֥ה הַ/שְּׁלִשִׁ֖ית סוּסִ֣ים לְבָנִ֑ים וּ/בַ/מֶּרְכָּבָה֙ הָ/רְבִעִ֔ית סוּסִ֥ים בְּרֻדִּ֖ים אֲמֻצִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/006/003.yaml
  text: and in the third chariot[a], white horses; and in the fourth chariot, dappled horses, strong ones.
translation:
  language: zh_hans
  text: 第三辆车套着白马；第四辆车套着有斑点的马，都是强壮的。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“第四辆车套着有斑点的马，另有强壮的马。”这种理解把“强壮的”视为另一组，而不是对第四辆车之马的第二项描述。
    reason: 保留希伯来文末尾 אֲמֻצִּים 在句法上的另一种可能理解。
lexical_decisions:
- source_word: וּבַמֶּרְכָּבָה
  choice: ……辆车套着……马
  rationale: 介词 ב 可表示“在……中/上”；结合马车队的场景，现代汉语用“车套着马”自然表达这些马属于相应的车，同时避免把车与马等同。
- source_word: הַשְּׁלִשִׁית / הָרְבִעִית
  choice: 第三辆 / 第四辆
  rationale: 两个序数词都修饰阴性名词“车”，按希伯来文次序直译。
- source_word: סוּסִים לְבָנִים
  choice: 白马
  rationale: לְבָנִים 是常见的白色形容词；汉语合译为“白马”简洁自然。
- source_word: בְּרֻדִּים
  choice: 有斑点的
  rationale: 该词表示斑驳、带斑点的外观；“有斑点的马”是清楚、通俗且适合马匹的现代汉语表达。
- source_word: אֲמֻצִּים
  choice: 都是强壮的
  rationale: 该词源于 אמץ，表达强健、有力量。此处以补充谓语保留它位于“有斑点的马”之后的原文次序，并自然地把它理解为对第四组马的进一步描述。
theological_decisions:
- issue: אֲמֻצִּים 是进一步描述第四辆车的斑点马，还是另指一组马
  choice: 正文理解为第四辆车的马既有斑点，又很强壮。
  alternative: 也可能断作“有斑点的马，另有强壮的马”，把“强壮的”理解为另一组。
  rationale: 希伯来文在“马”之后连续出现 בְּרֻדִּים 和 אֲמֻצִּים，中间没有再次出现“马”，较自然的理解是两个词共同描述第四辆车的马。不过，句法也容许把末词视为另一个类别，因此在脚注中保留这一歧义。
translation_notes:
  register: 采用现代、庄重而通俗的叙事语言。“套着”符合汉语对马车与马匹关系的通常说法；分号保留两个平行分句，正文亦尽量体现原文末尾两个描述词的先后次序。
