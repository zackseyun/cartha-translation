  text: וַ/יַּ֥עַן הַ/מַּלְאָ֖ךְ וַ/יֹּ֣אמֶר אֵלָ֑/י אֵ֗לֶּה אַרְבַּע֙ רֻח֣וֹת הַ/שָּׁמַ֔יִם יוֹצְא֕וֹת מֵֽ/הִתְיַצֵּ֖ב עַל אֲד֥וֹן כָּל הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/006/005.yaml
  text: Then the angel answered and said to me[a], “These are the four winds of heaven, going out from standing before the Lord of all the earth.”
translation:
  language: zh_hans
  text: 天使回答我说：“这是天上的四风[a]，它们侍立在全地之主面前之后，正从那里出去。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“四灵”。希伯来语中的这个词既可指“风”，也可指“灵”。
    reason: 保留原文רֻחוֹת的真实词义歧义。
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר אֵלַי
  choice: 回答我说
  rationale: 保留希伯来叙事中“回答……说”的表达结构，同时符合现代汉语的自然语序。
- source_word: הַמַּלְאָךְ
  choice: 天使
  rationale: 在先知异象中，此词指负责解释异象的天上使者；译作“天使”最清楚自然。
- source_word: אַרְבַּע רֻחוֹת הַשָּׁמַיִם
  choice: 天上的四风
  rationale: רוּחוֹת兼有“风”和“灵”的含义；正文采用与四辆战车向各方出动的异象较贴合的“四风”，并以脚注保留“四灵”的可能。
- source_word: יוֹצְאוֹת
  choice: 正……出去
  rationale: 分词表达正在进行的行动，“正……出去”在现代汉语中清楚体现这一动态。
- source_word: מֵהִתְיַצֵּב עַל
  choice: 侍立在……面前之后，正从那里
  rationale: התייצב在君王或主宰面前表示站立候命、呈身侍立；此译既体现从主面前受命而出的意象，也避免把עַל机械译成空间意义的“在……之上”。
- source_word: אֲדוֹן כָּל הָאָרֶץ
  choice: 全地之主
  rationale: “主”表达神对全地的主权；“全地”保留异象的普世范围，措辞庄重而简洁。
theological_decisions:
- issue: 异象中רֻחוֹת的含义
  choice: 四风
  alternative: 四灵
  rationale: 希伯来词本身容许“风”与“灵”两种理解。正文“四风”保留宇宙性和向四方运行的画面，脚注则保留它们也可能是天上灵体或执行神旨意之力量的含义，不消除原文的神学张力。
translation_notes:
  register: 采用现代、庄重且易懂的标准普通话。“侍立”表达在主宰面前候命的正式场景；句法略具经文庄重感，但避免生硬直译。
