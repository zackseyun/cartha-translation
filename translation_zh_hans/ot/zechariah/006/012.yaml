review_pass:
  verdict: revise
  source_fidelity: “苗裔”通常指后代、子孙，不是 צֶמַח 在本节所用的植物性名号“枝子／嫩芽”；这会改变意象，并使其与后文动词的词根呼应不够准确。其余主要成分，包括“万军之耶和华”“看哪”、男性单数所指、建造耶和华的殿及不明确建殿者身份，均忠实于原文。
  naturalness: “名叫‘枝子’；他要从自己的地方生长起来”是现代标准汉语中自然且庄重的先知宣告语体。“枝子／生长起来”能以可读的中文保留原文名号与动词之间的植物意象关联。
  terminology: 以“耶和华”对应神名、以“万军之耶和华”对应 יהוה צבאות，均合适。“枝子”比“苗裔”准确，也与中文圣经传统及该处称号性的用法相符；不借此明说弥赛亚身份。
  issues:
  - severity: medium
    issue: “苗裔”不适合对应 צֶמַח。
    rationale: “苗裔”在现代汉语主要意为子孙后代，不能直接表达本节的“枝、芽、萌芽”植物意象；而原文以 צֶמַח 作此人的名号，并紧接同根动词 יִצְמָח。改为“枝子”既保留称号性，也可与“生长起来”形成可感知的呼应。
  revised_text: 你要对他说：“万军之耶和华如此说：‘看哪，有一个人，名叫“枝子”；他要从自己的地方生长起来，并要建造耶和华的殿。’”
  revised_footnotes:
