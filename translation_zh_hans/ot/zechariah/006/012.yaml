    text: 也可直译：“他要从他下面生长出来。”原文的空间表达简约，可能指从他所在之处生长起来。
    reason: 保留 וּמִתַּחְתָּיו 的较字面译法及其在语境中的简约、略具歧义的空间含义。
  revision_rationale: 将“苗裔”改为“枝子”，以避免“后代”义造成的词义偏移，并保留名号与“生长起来”的植物性呼应。脚注继续呈现“从他下面”的较字面可能性；正文不指定该人物是约书亚或弥赛亚。
