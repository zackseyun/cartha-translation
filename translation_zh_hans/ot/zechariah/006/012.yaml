revisions:
- from: 你要对他说：“万军之耶和华如此说：‘看哪，有一个人，名叫“苗裔”。他要从自己所在之处萌发[a]，并要建造耶和华的殿。’”
  to: 你要对他说：“万军之耶和华如此说：‘看哪，有一个人，名叫“枝子”；他要从自己的地方生长起来，并要建造耶和华的殿。’”
  rationale: 将“苗裔”改为“枝子”，以避免“后代”义造成的词义偏移，并保留名号与“生长起来”的植物性呼应。脚注继续呈现“从他下面”的较字面可能性；正文不指定该人物是约书亚或弥赛亚。
