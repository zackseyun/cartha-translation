base_translation:
  language: en
  yaml_path: translation/ot/zechariah/006/012.yaml
  text: 'And say to him[a], ‘Thus says Yahweh of Armies: Behold, a man—Branch is his name—and he will branch out from his place and build the temple of Yahweh.’'
translation:
  language: zh_hans
  text: 你要对他说：“万军之耶和华如此说：‘看哪，有一个人，名叫“枝子”；他要从自己的地方生长起来，并要建造耶和华的殿。’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的专名音译来表达四字神名，不以“主”这一称号替代。
- source_word: צְבָאוֹת
  choice: 万军之
  rationale: “万军之耶和华”是自然、庄重且广为理解的中文表达，保留统领众军的意象。
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留先知宣告中引人注意的感叹语气，并符合庄重的现代中文文体。
- source_word: אִישׁ
  choice: 有一个人
  rationale: 准确保留阳性单数所指的一个具体男子，同时使中文句法自然。
- source_word: צֶמַח
  choice: 苗裔
  rationale: 在中文中可作为称号使用，也保留植物萌生及后裔的双重联想；配合后面的“萌发”，呈现原文词根呼应，而不直接增译为“弥赛亚”。
- source_word: שְׁמוֹ
  choice: 名叫
  rationale: 以自然中文表达命名公式，并清楚表明“苗裔”是此人的名号。
- source_word: וּמִתַּחְתָּיו
  choice: 从自己所在之处
  rationale: 原文是压缩而略有歧义的表达；正文采用通顺且不过度解释的空间性译法，较直译形式置于脚注。
- source_word: יִצְמָח
  choice: 萌发
  rationale: 保留植物生长意象，并与称号“苗裔”形成原文中 צֶמַח／יִצְמָח 的词根呼应。
- source_word: וּבָנָה
  choice: 并要建造
  rationale: 上下文具有预告性质；补出“要”可在现代中文中自然表达未然动作。
- source_word: הֵיכַל
  choice: 殿
  rationale: 在此语境中指耶和华的圣殿；“耶和华的殿”简洁、庄重，也符合中文圣经用语。
theological_decisions:
- issue: צֶמַח 的弥赛亚意涵
  choice: 在正文中把它译作称号性的“苗裔”，不进一步明说此人就是弥赛亚。
  alternative: 译作普通名词“嫩芽”或“幼苗”，或直接增译为“弥赛亚”。
  rationale: “名叫……”的句法支持称号性理解，而先知书中的相关用法带有弥赛亚共鸣；译文保留这种共鸣，却不加入原文没有明说的身份解释。
- issue: 建殿者的具体身份
  choice: 按原文只称“一个人”及“他”，不指明是约书亚还是弥赛亚。
  alternative: 明确认定此人为约书亚，或明确认定此人为弥赛亚。
  rationale: 本节的象征对象存在解释分歧；原文本身没有在此处进一步点明，因此译文保留其张力与歧义。
translation_notes:
  register: 采用庄重而易懂的现代标准普通话。保留先知宣告的引语层次及“看哪”的郑重语气；以“苗裔／萌发”尽量再现希伯来文的植物意象和词根呼应。
