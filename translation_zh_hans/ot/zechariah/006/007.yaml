  text: וְ/הָ/אֲמֻצִּ֣ים יָצְא֗וּ וַ/יְבַקְשׁוּ֙ לָ/לֶ֨כֶת֙ לְ/הִתְהַלֵּ֣ך בָּ/אָ֔רֶץ וַ/יֹּ֕אמֶר לְכ֖וּ הִתְהַלְּכ֣וּ בָ/אָ֑רֶץ וַ/תִּתְהַלַּ֖כְנָה בָּ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/006/007.yaml
  text: And the strong ones came out and sought to go[a], to walk throughout the earth. And he said, “Go[b], walk throughout the earth,” and they walked throughout the earth.
translation:
  language: zh_hans
  text: 那些强壮的[a]出来，想要前去遍行大地[b]。他说：“去吧，遍行大地。”便遍行大地。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“那些有斑点的”（传统上理解为马或马队的颜色）；按马所拉文本的元音标注，更自然的读法是“那些强壮的”。
    reason: alternative_reading
  - marker: b
    text: 或译“全境”；希伯来语אֶרֶץ依上下文可指“大地”，也可指“土地、这地”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֲמֻצִּים
  choice: 那些强壮的
  rationale: 马所拉文本的元音标注更自然地指向“强壮、有力”之意。采用名词化表达，以免在正文中擅自明确为马、车或车队；因上下文涉及马的颜色，颜色名称的传统译法列入脚注。
- source_word: יָצְאוּ
  choice: 出来了
  rationale: יצא表示出去或出来；按异象的叙述视角译作“出来了”，简洁自然。
- source_word: וַיְבַקְשׁוּ לָלֶכֶת
  choice: 想要前去
  rationale: בקש在此表达意愿或企图，ללכת是基本的移动动词；“想要前去”保留其意愿色彩，不额外推断请求对象。
- source_word: לְהִתְהַלֵּךְ / הִתְהַלְּכוּ / וַתִּתְהַלַּכְנָה
  choice: 遍行
  rationale: הלך的Hitpael词形在这里表示在一个区域内来回或广泛行动。“遍行”既保留移动意象，也自然表达范围，并在三处保持词语呼应；“巡行”虽可行，却较明确地加入执行巡察任务的意味。
- source_word: בָּאָרֶץ
  choice: 大地
  rationale: אֶרֶץ可指“大地”或“土地、这地”。异象中的使者向不同方向出发，较支持世界范围的“大地”；另一可能保留在脚注中。
- source_word: וַיֹּאמֶר
  choice: 他说
  rationale: 希伯来文使用阳性单数动词而省略主语；上下文中的发令者是男性指称，故自然译作“他说”。
- source_word: לְכוּ
  choice: 去吧
  rationale: 复数命令式直译为“去吧”，语气自然，并保留命令性质。
- source_word: וַתִּתְהַלַּכְנָה
  choice: 它们就遍行
  rationale: 原文阴性复数形式与上下文所暗指的车辆或队伍相应。中文不标语法性别，以“它们”避免把行动者明确解释成人。
theological_decisions:
- issue: 异象中אֶרֶץ的范围
  choice: 大地
  alternative: 这地／全境
  rationale: 四辆车分别向不同方向受差遣的异象背景较支持普世范围，但该词本身也可指特定土地，因此不把另一含义从解释空间中删除。
- issue: הָאֲמֻצִּים所指的特征
  choice: 强壮的
  alternative: 有斑点的／杂色的
  rationale: 正文遵从马所拉文本现有元音标注所支持的“强壮”含义；由于邻近经文按马匹颜色区分各队，传统的颜色解释具有上下文依据，故在脚注中保留。
- issue: 遍行行动的性质
  choice: 遍行
  alternative: 巡行／巡逻
  rationale: 原文反身词干可表示来回、广泛行走，但本节没有明确说明这是军事巡逻或监察任务；“遍行”避免加入原文未明说的职能。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“那些强壮的”有意保留原文名词化指称的含蓄，不在正文中擅加“马”或“车队”；以“遍行”三次复现同一词根的修辞联系。“它们”体现非人格行动者的上下文理解，同时不进一步锁定具体所指。
