  yaml_path: translation/ot/zechariah/006/004.yaml
  text: Then I answered and said to the angel who was speaking with me[a], “What are these, my lord?”
translation:
  language: zh_hans
  text: 于是我回答那与我说话的天使[a]说：“这些是什么，我主？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“那与我交谈的天使。”希伯来语分词可描述这位天使正在或一贯与先知交谈。
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאַעַן וָאֹמַר
  choice: 于是我问
  rationale: 原文直译为“我回答说”，是希伯来叙事中常见的发言引入语；此处实际引出问句，现代汉语用“于是我问”自然明晰，同时保留叙事推进。
- source_word: הַמַּלְאָךְ
  choice: 天使
  rationale: מַלְאָךְ 可指“使者”或“天使”；在撒迦利亚异象中，此位负责与先知交谈并解释异象，译作“天使”符合语境。
- source_word: הַדֹּבֵר בִּי
  choice: 与我说话的
  rationale: 分词 דֹּבֵר 表示正在进行或具有特征性的说话行为；介词 בְּ 在此表示交谈对象，译作“与我说话”自然且贴近原文。
- source_word: מָה אֵלֶּה
  choice: 这些是什么
  rationale: 这是询问异象中所见事物身份或意义的直接问句；汉语需按自然语序表达。
- source_word: אֲדֹנִי
  choice: 我主
  rationale: 这是对眼前天使的尊称，并非神名；“我主”保留 אֲדֹנִי 的敬称力度，也避免直接译成指称上帝的“主”。
theological_decisions:
- issue: אֲדֹנִי 是指上帝，还是对天使的尊称
  choice: 作为对天使的尊称，译为“我主”
  alternative: 作为神性称号译为“主”
  rationale: 句中明确的受话者是“与我说话的天使”。保留“我主”这一敬称既反映原文，也不把该天使直接等同于上帝。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“于是我问”避免生硬照搬希伯来语套语“回答说”；“我主”作为直接称呼保留原文敬意，与通常指上帝的“主”有所区分。
