  terminology: “天使”符合撒迦利亚异象语境；“我主”恰当地保留了 אֲדֹנִי 对天使的敬称力度，而不将其处理为上帝的专有称号。脚注中的“曾与我交谈”不宜作为分词的替代译法，因为“曾”无根据地把该描述限定为过去完成；应改为不预设时态的“与我交谈”。
