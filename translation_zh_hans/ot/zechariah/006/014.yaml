base_translation:
  language: en
  yaml_path: translation/ot/zechariah/006/014.yaml
  text: And the crowns shall be for Helem[a], Tobijah, Jedaiah, and Hen son of Zephaniah, as a memorial in the temple of Yahweh.
translation:
  language: zh_hans
  text: 这些冠冕要为希连[a]、多比雅、耶大雅和西番雅的儿子贤留作纪念，放在雅威的殿中。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希连在撒迦利亚书6:10称为“黑玳”；这可能是同一个名字的不同形式。
    reason: 说明相邻经文中的人名异形，避免在正文中强行统一。
lexical_decisions:
- source_word: הָעֲטָרֹת
  choice: 这些冠冕
  rationale: 原文名词为复数，故保留“冠冕”的复数含义；“这些”自然承接上文所制作的冠冕。
- source_word: תִּהְיֶה
  choice: 要……留在
  rationale: 未完成式在此表达将来或安排所产生的结果；结合句末地点和用途，译为“要……留在”符合现代汉语，也清楚表达冠冕将存放于殿中的意思。
- source_word: לְחֵלֶם וּלְטוֹבִיָּה וְלִידַעְיָה וּלְחֵן
  choice: 要归给希连、多比雅、耶大雅和……亨
  rationale: 介词לְ表示归属或关联，译作“归给”；四项按本节马所拉文本作为人名音译，不与邻近经文强行统一，也不把חֵן译成抽象名词“恩惠”。
- source_word: בֶּן צְפַנְיָה
  choice: 西番雅的儿子
  rationale: 按希伯来语父子关系结构直译，以“西番雅”采用通行的中文圣经人名形式。
- source_word: לְזִכָּרוֹן
  choice: 作为纪念
  rationale: 表达冠冕存放的纪念用途；“作为纪念”自然、庄重，并保留原文的纪念性含义。
- source_word: בְּהֵיכַל יְהוָה
  choice: 在雅威的殿中
  rationale: 在神名的限定下，הֵיכָל指圣殿；以“殿”简洁呈现。יהוה音译为“雅威”，保留神的专名而不以称号替代。
theological_decisions:
- issue: 本节人名与撒迦利亚书6:10的形式不同
  choice: 按本节马所拉文本译作“希连”和“亨”
  alternative: 将“希连”统一为6:10的“黑玳”，或将“亨”解释为普通名词“恩惠”
  rationale: 本节的元音标注文本将二者呈现为人名，尤其“亨”后接“西番雅的儿子”。正文保留本节自身的读法，对“希连／黑玳”的差异以脚注说明，不擅自调和。
- issue: 冠冕的单复数
  choice: 译作复数含义的“这些冠冕”
  alternative: 译作单数“这冠冕”
  rationale: הָעֲטָרֹת在形态上是复数；虽上下文可能使人联想到一个礼仪性冠冕，正文仍忠实保留本节马所拉文本的复数。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“归给……留在……”将希伯来语的归属对象、存放地点和纪念用途连贯表达；人名采用中文音译，其中“亨”刻意作为人名处理，避免误解为“恩惠”。
