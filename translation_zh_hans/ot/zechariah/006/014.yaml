revisions:
- from: 这些冠冕要归给希连[a]、多比雅、耶大雅和西番雅的儿子亨，留在雅威的殿中作为纪念。
  to: 这些冠冕要为希连[a]、多比雅、耶大雅和西番雅的儿子贤留作纪念，放在雅威的殿中。
  rationale: 修订保留原文冠冕的复数、人名的本节读法及其在雅威殿中作为纪念的功能。以“为……留作纪念，放在……”避免将介词关系过度具体化为实际交付，也使中文句法更自然。将“亨”改为通行中文人名“贤”，但仍明确按人名而非普通名词理解。
