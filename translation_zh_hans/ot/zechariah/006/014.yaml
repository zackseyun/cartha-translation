  - severity: low
    issue: 人名“亨”不符合较通行的中文圣经人名形式。
    rationale: 此处应保留为人名而非译为“恩惠”；采用通行译名“贤”有助于与中文圣经语境及西番雅之子的身份相衔接，不改变马所拉文本的读法。
  revised_text: 这些冠冕要为希连[a]、多比雅、耶大雅和西番雅的儿子贤留作纪念，放在雅威的殿中。
  revised_footnotes:
