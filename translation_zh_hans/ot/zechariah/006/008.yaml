base_translation:
  language: en
  yaml_path: translation/ot/zechariah/006/008.yaml
  text: Then he called out to me and spoke to me[a], saying, “See, those going out to the land of the north have set my Spirit at rest in the land of the north.”
translation:
  language: zh_hans
  text: 他向我高声呼喊，对我说：“看哪，那些前往北方之地的，已经使我的灵在北方之地安息了[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “使我的灵……安息”也可译为“使我的灵得安息”，并可理解为“使我的心绪平静”；在此异象的语境中，也可能含有上帝对北方的怒气或审判之不悦已经平息的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּזְעֵק אֹתִי
  choice: 他又大声呼唤我
  rationale: זעק表示高声呼喊或呼唤；“大声呼唤”保留声音响亮、引人注意的意味，而不额外指定情绪。“又”承接叙事中的连续动作。
- source_word: וַיְדַבֵּר אֵלַי לֵאמֹר
  choice: 对我说
  rationale: 这是常见的希伯来语引语公式。汉语不必机械重复“对我讲话，说”，简洁译为“对我说”更自然。
- source_word: רְאֵה
  choice: 看哪
  rationale: 命令式用于唤起注意。“看哪”庄重而仍为现代读者所懂，比单独“看”更能表达提示语气。
- source_word: הַיּוֹצְאִים אֶל אֶרֶץ צָפוֹן
  choice: 那些往北方之地去的
  rationale: 分词保留正在出发或执行行动的意味；“往……去”自然表达方向。אֶרֶץ צָפוֹן直译为“北方之地”，并与后半句保持重复。
- source_word: הֵנִיחוּ
  choice: 已经使……安息了
  rationale: 使役形式表达“使之歇息、安定或平静”。“使……安息”保留其使役结构和完成意味，也避免直接把潜在的审判或怒气含义写入正文。
- source_word: רוּחִי
  choice: 我的灵
  rationale: רוּחַ可指灵、气息、风或心绪；此处有第一人称所属后缀，译作“我的灵”最能保留原文的神学分量与歧义，不直接释作“我的怒气”。
- source_word: בְּאֶרֶץ צָפוֹן
  choice: 在北方之地
  rationale: 保留原文对“北方之地”的重复，以呈现地理指向和修辞强调。
theological_decisions:
- issue: “我的灵安息”的含义
  choice: 正文译为“使我的灵……安息”，保留这是上帝自己的灵或心绪获得平静的表述。
  alternative: 可理解为“使我的心绪平静”，并可能特指上帝的怒气或施行审判的不悦在北方得到平息。
  rationale: 原文רוּחִי和הֵנִיחוּ容许“灵得安息”“心绪平静”等理解；异象语境也可能暗示审判执行后怒气止息。正文不将רוּחַ直接窄化为“怒气”，而以脚注说明这种语义可能。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“看哪”和“北方之地”略带经文语体，以保留先知异象的郑重感；其余句法尽量自然。脚注标记[a]置于引语前的“对我说”之后，与所说明的整句宣告相连。
