  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וָ/אָשֻׁ֗ב וָ/אֶשָּׂ֤א עֵינַ/י֙ וָֽ/אֶרְאֶ֔ה וְ/הִנֵּ֨ה אַרְבַּ֤ע מַרְכָּבוֹת֙ יֹֽצְא֔וֹת מִ/בֵּ֖ין שְׁנֵ֣י הֶֽ/הָרִ֑ים וְ/הֶ/הָרִ֖ים הָרֵ֥י נְחֹֽשֶׁת׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/006/001.yaml
  text: Then I turned and lifted up my eyes and saw[a], and behold[b], four chariots were coming out from between two mountains—and the mountains were mountains of bronze.
translation:
  language: zh_hans
  text: 我转过身来，举目观看，只见四辆战车正从两座山[a]之间出来；那两座山是青铜山[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“从那两座山之间。”希伯来原文中的“山”带定冠词。
    reason: lexical_alternative
  - marker: b
    text: “青铜”也可译作“铜”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאָשֻׁב
  choice: 我转过身来
  rationale: שׁוב可表示“返回”或“转身”。在异象叙述中，这里自然地表达先知转身再观看的动作；译作“转过身来”既保留动作感，也不额外断定他回到了某处。
- source_word: וָאֶשָּׂא עֵינַי
  choice: 举目观看
  rationale: 这是希伯来语中表示抬眼、定睛观看的常用说法。“举目观看”保留原文意象，也符合现代汉语庄重而自然的叙事语体。
- source_word: וָאֶרְאֶה וְהִנֵּה
  choice: 只见
  rationale: ראה表示看见，הִנֵּה用来生动地引出眼前景象。“只见”在现代汉语中自然地兼顾两者的叙事功能与突现感。
- source_word: אַרְבַּע מַרְכָּבוֹת
  choice: 四辆战车
  rationale: מַרְכָּבָה在此指战车；量词“辆”符合现代汉语用法。
- source_word: יֹצְאוֹת
  choice: 正……出来
  rationale: 分词描绘异象中正在发生的动作；“正……出来”体现持续、展现中的动态。
- source_word: מִבֵּין שְׁנֵי הֶהָרִים
  choice: 从两座山之间
  rationale: 原文是“从那两座山之间”，名词带定冠词。汉语正文用“两座山”较自然，随后一句立即将其特指为“那两座山”；定指差异在脚注中说明。
- source_word: וְהֶהָרִים הָרֵי נְחֹשֶׁת
  choice: 那两座山是青铜山
  rationale: 保留原文重复“山”的强调结构。נְחֹשֶׁת可指铜或青铜；正文采用适合宏伟金属意象的“青铜”，同时在脚注保留另一译法。
theological_decisions:
- issue: נְחֹשֶׁת所指的金属
  choice: 青铜
  alternative: 铜
  rationale: 这主要是词义问题，并非教义判断。该词可指铜或铜合金；正文采用圣经宏大异象语境中较明确的“青铜”，同时以脚注保留“铜”的可能。
- issue: 两座山的定指性
  choice: 正文译作“两座山”，随后称“那两座山”
  alternative: 从那两座山之间
  rationale: 希伯来文在“山”前有定冠词，但此前并未在本段点明这两座山。正文按自然汉语表达，且下一分句明确回指；脚注保留原文的定指形式。
translation_notes:
  register: 采用现代、庄重而易懂的异象叙事语体。“举目观看”保留先知文学的表达色彩；“只见”自然传达וְהִנֵּה引人注意、使景象突现的功能。正文保留“山……山”的重复，以反映原文强调。所有脚注标记均放在相关词语之后。
