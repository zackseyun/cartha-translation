  text: וְ/לָקַחְתָּ֥ כֶֽסֶף וְ/זָהָ֖ב וְ/עָשִׂ֣יתָ עֲטָר֑וֹת וְ/שַׂמְתָּ֗ בְּ/רֹ֛אשׁ יְהוֹשֻׁ֥עַ בֶּן יְהוֹצָדָ֖ק הַ/כֹּהֵ֥ן הַ/גָּדֽוֹל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/006/011.yaml
  text: Take silver and gold[a], make crowns, and set them on the head of Joshua son of Jehozadak, the high priest.
translation:
  language: zh_hans
  text: 你要取银子和金子，做成冠冕[a]，戴在约萨答的儿子、大祭司约书亚头上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文作“冠冕”（复数）。有些人认为这里指一个由多部分组成的冠冕，因此译作“一个冠冕”。
    reason: 保留原文复数与单一组合冠冕这一可能解释之间的歧义。
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: 你要取
  rationale: 该形式为第二人称单数完成式，带连接词，在此先知性指令中具有命令功能；译作“你要取”既自然，也保留指令语气。
- source_word: כֶסֶף וְזָהָב
  choice: 银子和金子
  rationale: 两个名词明确指银与金这两种材料；“银子和金子”是现代汉语中清楚自然的表达。
- source_word: וְעָשִׂיתָ עֲטָרוֹת
  choice: 做成冠冕
  rationale: עֲטָרוֹת 在形态上是复数，但现代汉语名词通常不以形态标明单复数；“冠冕”可自然保留数目上的开放性，并由脚注说明希伯来文复数及单一组合冠冕的可能理解。
- source_word: וְשַׂמְתָּ בְּרֹאשׁ
  choice: 戴在……头上
  rationale: 字面为“放在……头上”；用于冠冕时，“戴在……头上”更符合现代汉语习惯，同时准确表达实际安放的动作。
- source_word: יְהוֹשֻׁעַ בֶּן יְהוֹצָדָק
  choice: 约萨答的儿子……约书亚
  rationale: 采用现代中文圣经人名的通行形式，并按自然汉语语序表达父子关系。
- source_word: הַכֹּהֵן הַגָּדוֹל
  choice: 大祭司
  rationale: 这是该希伯来职衔在现代汉语中的标准对应，清楚指明首要祭司的职分。
theological_decisions:
- issue: 复数 עֲטָרוֹת 与将其戴在约书亚一人头上的张力
  choice: 正文用数目不作形态标记的“冠冕”，脚注明确希伯来文为复数
  alternative: 正文译作“一个冠冕”或“几顶冠冕”
  rationale: 原文明确使用复数，但汉语“冠冕”本身可指单数或复数。若加入“一个”会消解原文复数，加入“几顶”又可能过度具体化。因此正文保持自然且开放的表达，脚注保存原文形式及组合冠冕的解释可能。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留先知性命令的直接语气；人名和职衔使用简体中文圣经语境中的通行形式。
