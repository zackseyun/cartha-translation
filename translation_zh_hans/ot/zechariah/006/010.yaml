revisions:
- from: 你要从被掳归来的人中，就是从希勒代、陀比雅和耶大雅那里收取；当天你要亲自到西番雅的儿子约西亚家里去。他们是从巴比伦来的。[a]
  to: 你要从被掳的人中收取，就是从黑玳、多比雅和耶大雅那里收取；当天你要亲自到西番雅的儿子约西亚家里去。他们是从巴比伦来的。[a]
  rationale: 修订删除原文未在前半句明说的“归来”，并采用中文圣经中通行的人名形式。保留“亲自”以反映强调代词，也保留末句作为独立短句以清楚呈现其复数指代；脚注则以较审慎的措辞说明该指代。
  reviewer_model: gpt-5.6-terra
