review_pass:
  verdict: revise
  source_fidelity: 译文整体准确保留了命令语气、אַתָּה的强调、同日行动，以及末句复数动词所指向的前述数人。惟“被掳归来的人”把“归回”这一语义提前加入了הַגּוֹלָה；经文本身在此处称他们为被掳者／被掳群体，至句末才说他们从巴比伦而来。宜避免在前半句预断“归来”。
  naturalness: 句法庄重通顺。“从……那里收取”虽省略受词，仍可自然承接下一节所说明的金银。“当天你要亲自到……家里去”恰当地表达连续的两个行动和强调代词。
  terminology: 为与现代中文圣经中通行的人名形式及读者辨识相衔接，建议采用“黑玳、多比雅、耶大雅”。“约西亚”“西番雅”维持不变。末句的“他们”与脚注应说明其为复数且最自然地回指三位具名者，而不将这一回指说成毫无余地的唯一语法可能。
  issues:
  - severity: medium
    issue: “被掳归来的人”补入“归来”
    rationale: הַגּוֹלָה在此指被掳者／被掳群体，不必在该短语中明说其已归回；“从巴比伦而来”是末句另行提供的信息。删除“归来”可更紧贴原文的渐进表达。
  - severity: low
    issue: 人名译法与中文通行圣经名称不一致
    rationale: “希勒代、陀比雅”可作音译，但“黑玳、多比雅”是中文圣经读者较通行、也更易辨识的对应名称；采用通行形式有助于术语一致性，且不影响原文所指。
  - severity: low
    issue: 脚注将复数关系从句的指代表述得过于确定
    rationale: 复数形式强烈支持回指前三人，故正文可作此自然理解；但脚注宜以“最自然地指”说明，保留该相对从句在句法连接上的讨论空间。
