base_translation:
  language: en
  yaml_path: translation/ot/zechariah/006/010.yaml
  text: Take from the exiles—from Heldai[a], from Tobijah, and from Jedaiah—and you yourself shall go on that day and enter the house of Josiah the son of Zephaniah[d][c][b], who have come from Babylon.
translation:
  language: zh_hans
  text: 你要从被掳的人中收取，就是从黑玳、多比雅和耶大雅那里收取；当天你要亲自到西番雅的儿子约西亚家里去。他们是从巴比伦来的。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他们”最自然地指前面提到的黑玳、多比雅和耶大雅；原文“来”是复数形式。
    reason: alternative_reading
lexical_decisions:
- source_word: לָקוֹחַ
  choice: 收取
  rationale: 该词是用作命令的绝对不定式；“收取”既保留命令语气，也不过早补明下一节才交代的具体物品。
- source_word: מֵאֵת הַגּוֹלָה
  choice: 从被掳归来的人中
  rationale: הַגּוֹלָה在这里指被掳者或归回者群体，而不是抽象的“被掳”状态；结合他们已从巴比伦来到此地的语境，译为“被掳归来的人”较自然。
- source_word: חֶלְדַּי
  choice: 希勒代
  rationale: 按希伯来语人名音译，并采用现代中文圣经语境中清楚、庄重的形式。
- source_word: טוֹבִיָּה
  choice: 陀比雅
  rationale: 音译保留词尾-yāh所反映的形式。
- source_word: יְדַעְיָה
  choice: 耶大雅
  rationale: 按希伯来语人名音译。
- source_word: וּבָאתָ אַתָּה
  choice: 你要亲自到……去
  rationale: בוא可随叙述视角译作“来”或“去”；此处是撒迦利亚前往另一地点，用“到……去”自然，并以“亲自”体现独立代词אַתָּה的强调。
- source_word: בַּיּוֹם הַהוּא
  choice: 当天
  rationale: 该表达在此命令序列中指同一天；“当天”简洁自然，也保留时间上的明确性。
- source_word: וּבָאתָ בֵּית
  choice: 到……家里去
  rationale: 重复的בוא表示前往约西亚的家；“到……家里去”符合现代汉语，不额外强化为必然“进入屋内”。
- source_word: יֹאשִׁיָּה בֶן צְפַנְיָה
  choice: 西番雅的儿子约西亚
  rationale: 按现代汉语自然次序表达希伯来语父子关系。
- source_word: אֲשֶׁר בָּאוּ מִבָּבֶל
  choice: 他们是从巴比伦来的
  rationale: 动词בָּאוּ为复数，最自然地回指前述希勒代、陀比雅和耶大雅三人；独立成句可避免误读为只修饰单数的约西亚。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留命令的简洁力度和“你亲自”的强调；将末尾复数关系从句拆为短句，以清楚呈现其最自然的指代，同时不把约西亚误列为从巴比伦来的三人之一。
