  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: ה֣וֹי ה֗וֹי וְ/נֻ֛סוּ מֵ/אֶ֥רֶץ צָפ֖וֹן נְאֻם יְהוָ֑ה כִּ֠י כְּ/אַרְבַּ֞ע רוּח֧וֹת הַ/שָּׁמַ֛יִם פֵּרַ֥שְׂתִּי אֶתְ/כֶ֖ם נְאֻם יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/002/010.yaml
  text: Up! Up! Flee from the land of the north[a], declares Yahweh, for I have spread you abroad to the four winds of the heavens[b], declares Yahweh.
translation:
  language: zh_hans
  text: “快！快！[a]你们要从北方之地逃走！”雅威宣告，“因为我已把你们分散开来，如同天上的四风[b]。”雅威宣告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文也可较直译为“喂！喂！”这是紧急的招呼，不是哀叹。
    reason: lexical_alternative
  - marker: b
    text: 或译：“我已把你们分散到天的四方。”希伯来语既可理解为比较——“如同四风”，也可理解为表示方向——“向四方”。
    reason: alternative_reading
lexical_decisions:
- source_word: הוֹי הוֹי
  choice: 快！快！
  rationale: 这里的重复感叹词用于紧急招呼并催促行动，不是哀叹。“快！快！”以自然现代汉语传达迫切性；另在脚注说明较直译的招呼形式。
- source_word: וְנֻסוּ
  choice: 你们要……逃走
  rationale: 这是נוּס的复数祈使式，要求听众立即逃离；“逃走”直接保留命令的紧迫感。
- source_word: מֵאֶרֶץ צָפוֹן
  choice: 从北方之地
  rationale: 保留希伯来语“地／国土”与“北方”的结构及其地理意涵，同时采用庄重而可懂的汉语。
- source_word: נְאֻם יְהוָה
  choice: 雅威宣告
  rationale: 这是先知书常见的神谕公式；“宣告”庄重自然，יְהוָה按其专名译作“雅威”。
- source_word: כִּי
  choice: 因为
  rationale: 自然引出前述逃离命令的理由。
- source_word: כְּאַרְבַּע רוּחוֹת הַשָּׁמַיִם
  choice: 如同天上的四风
  rationale: 前缀כְּ最直接表达比较义“如同”；“四风”保留原文意象。该结构也可能表达向四方分散，故以脚注保留歧义。
- source_word: פֵּרַשְׂתִּי אֶתְכֶם
  choice: 我已把你们分散开来
  rationale: פרשׂ的基本图像是铺开、展开；在此以“分散开来”自然表达百姓被散布各处，又不过度强化暴力驱散的含义。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文两次直接使用四字神名。音译“雅威”保留其作为圣约专名的性质，也避免以称号代替专名。
- issue: “四风”结构所表达的散布方式
  choice: 正文保留比较义“如同天上的四风”
  alternative: “向天的四方／四风分散你们”
  rationale: כְּ通常标示比较，但整句也可按方向性惯用语理解。正文采用形态上较直接的读法，脚注保留另一种合理解释，不消解原文张力。
translation_notes:
  register: 采用现代、庄重且可朗读的普通话。“快！快！”突出紧急召唤；两个“雅威宣告”均予保留，以呈现原文重复的先知性公式。
