  text: רָנִּ֥י וְ/שִׂמְחִ֖י בַּת צִיּ֑וֹן כִּ֧י הִנְ/נִי בָ֛א וְ/שָׁכַנְתִּ֥י בְ/תוֹכֵ֖/ךְ נְאֻם יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/002/014.yaml
  text: Sing for joy and rejoice[a], daughter Zion, for behold, I am coming, and I will dwell in your midst[c][b], declares Yahweh.
translation:
  language: zh_hans
  text: 锡安的女儿[a]啊，欢呼吧，喜乐吧！看哪，我要来，并要住在你中间[b]。这是雅威[c]的宣告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “锡安的女儿”是诗歌中把锡安／耶路撒冷人格化的称呼。
    reason: cultural_note
  - marker: b
    text: “你”在希伯来文中是阴性单数，指人格化的锡安；“在你中间”表达雅威在锡安及其居民当中的临在。
    reason: lexical_alternative
  - marker: c
    text: “雅威”对应希伯来文神名 YHWH；传统上也译作“耶和华”。
    reason: alternative_reading
lexical_decisions:
- source_word: רָנִּי
  choice: 要欢呼
  rationale: 该阴性单数命令式表示因喜乐而高声呼喊；“欢呼”自然、简洁，并保留声音响亮和庆贺的意味。
- source_word: וְשִׂמְחִי
  choice: 要喜乐
  rationale: 保留第二个并列命令式，与“欢呼”构成递进而不合并两词。
- source_word: בַּת צִיּוֹן
  choice: 锡安的女儿啊
  rationale: 保留希伯来诗歌对锡安／耶路撒冷的女性人格化称呼；“啊”明确呼语功能。
- source_word: כִּי הִנְנִי בָא
  choice: 看哪，我要来
  rationale: “看哪”传达 הִנְנִי 的郑重提示作用；分词 בָא 在此呈现即将发生、鲜明迫近的行动，译作“我要来”符合现代汉语。
- source_word: וְשָׁכַנְתִּי
  choice: 住
  rationale: 在“我要来”的统摄下表达后续行动；“住”是现代汉语中自然且庄重的说法，也保留神临在并居住的主题。
- source_word: בְתוֹכֵךְ
  choice: 在你中间
  rationale: 原文第二人称阴性单数指锡安；此译既保留单数称呼，也表达在其居民当中的空间和群体含义。
- source_word: נְאֻם יְהוָה
  choice: 这是雅威说的
  rationale: 以自然、郑重的现代汉语表达先知性的宣告公式，并将四字神名按其专名音译为“雅威”。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。音译“雅威”使读者看见这是专名，而不以称号替代；脚注说明传统译法。
- issue: 神住在锡安中间的表述
  choice: 住在你中间
  alternative: 居住在你里面；住在你们当中
  rationale: 保留原文对锡安的阴性单数称呼及其群体／空间含义，不把这句话限定为个人内在经验，也不预先套入后来的神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的先知书语体。并列命令“要欢呼，要喜乐”保留原文节奏；“看哪”保留宣告的郑重感。主文本不加后世神学限定，并以脚注交代锡安人格化、单数代词的群体含义及神名译法。
