  text: וָ/אֹמַ֗ר אֶל הַ/מַּלְאָ֛ךְ הַ/דֹּבֵ֥ר בִּ֖/י מָה אֵ֑לֶּה וַ/יֹּ֣אמֶר אֵלַ֔/י אֵ֤לֶּה הַ/קְּרָנוֹת֙ אֲשֶׁ֣ר זֵר֣וּ אֶת יְהוּדָ֔ה אֶת יִשְׂרָאֵ֖ל וִ/ירוּשָׁלָֽם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/002/002.yaml
  text: And I said to the angel who was speaking with me[a], “What are these?” And he said to me, “These are the horns that scattered Judah, Israel, and Jerusalem.”
translation:
  language: zh_hans
  text: 我问那位与我说话的天使：“这些是什么？”他回答我：“这些就是使犹大、以色列和耶路撒冷四散的角[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或理解为“势力”或“王国”；希伯来文直译为“角”，这是先知书中常用来象征力量或统治权的意象。
    reason: 说明“角”的可能象征含义，同时保留正文的字面意象。
lexical_decisions:
- source_word: הַמַּלְאָךְ
  choice: 天使
  rationale: מַלְאָךְ既可指一般的“使者”，也可指“天使”；本段异象中，这是一位向先知解释异象的天上使者，因此译作“天使”最符合语境。
- source_word: הַדֹּבֵר בִּי
  choice: 正跟我说话的
  rationale: 分词דֹּבֵר与בְּ加代词后缀在撒迦利亚书中指向与先知交谈、解释异象的天使；“跟我说话”是自然的现代汉语表达，也避免把介词机械译成“在我里面”。
- source_word: מָה אֵלֶּה
  choice: 这些是什么？
  rationale: 直接保留疑问词与复数指示语的结构，表达简洁自然。
- source_word: הַקְּרָנוֹת
  choice: 角
  rationale: קֶרֶן的字面意思是“角”，在先知异象中常象征力量或统治权；正文保留原有意象，不以解释取代图像。
- source_word: זֵרוּ
  choice: 使……四散
  rationale: זרה表示驱散、使分散，有时带扬谷般吹散的图景；此处以使动式“使……四散”自然表达这些“角”对犹大、以色列和耶路撒冷所造成的结果。
- source_word: יְהוּדָה ... יִשְׂרָאֵל ... וִירוּשָׁלָם
  choice: 犹大、以色列和耶路撒冷
  rationale: 依原文保留三个专名及其并列次序，不将其中任何名称合并或解释化。
theological_decisions:
- issue: “角”的象征意义
  choice: 正文保留“角”这一字面图像
  alternative: 势力；列国；政权
  rationale: 原文称异象中的对象为“角”，而没有在本节正文中直接将其等同于某一种势力或政权。保留图像可维护异象本身的含混性，并避免把解释写进正文。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“正跟我说话”体现分词所描写的持续交谈场景；“使……四散”兼顾希伯来语动词的使动关系和汉语可读性。脚注标记置于“角”之后，与脚注实际解释的词对应。
