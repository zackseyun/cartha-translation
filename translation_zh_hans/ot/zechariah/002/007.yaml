  text: וְ/הִנֵּ֗ה הַ/מַּלְאָ֛ךְ הַ/דֹּבֵ֥ר בִּ֖/י יֹצֵ֑א וּ/מַלְאָ֣ךְ אַחֵ֔ר יֹצֵ֖א לִ/קְרָאתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/002/007.yaml
  text: And behold[a], the angel who was speaking with me went out, and another angel went out to meet him.
translation:
  language: zh_hans
  text: 看哪，那位与我说话的天使[a]出去，另一位天使也出去迎接他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “那位与我说话的天使”也可译作“那位与我交谈的天使”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留הִנֵּה引起注意、使异象场景显得鲜明的篇章功能；“看哪”庄重而清楚。
- source_word: הַמַּלְאָךְ
  choice: 天使
  rationale: מַלְאָךְ本可泛指“使者”，但本节处于异象叙事，并出现两位属天人物，因此译作“天使”最符合语境。
- source_word: הַדֹּבֵר בִּי
  choice: 那位与我说话的
  rationale: 分词结构指明这位天使在叙事中持续承担的角色；“与我说话”自然表达בִּי在撒迦利亚书这一惯用语中的互动含义。
- source_word: יֹצֵא
  choice: 走了出去
  rationale: 该分词在叙事中发挥动词作用，描写人物离开原处；完成体式的汉语表达符合上下文的动作推进。
- source_word: וּמַלְאָךְ אַחֵר
  choice: 另有一位天使也
  rationale: אַחֵר表示又一位有别于前者的天使；“另有一位”清楚保留两者的区分而不过度强调差异。
- source_word: לִקְרָאתוֹ
  choice: 出去迎接他
  rationale: ל加不定词表达目的；“迎接他”自然呈现第二位天使朝第一位而去、与他会合的动作。
theological_decisions:
- issue: 两位天使的身份
  choice: 只按经文分别称为“那位与我说话的天使”和“另有一位天使”，不进一步指认其身份。
  alternative: 把第一位明确称为“解释异象的天使”，并为第二位指定特定使命或身份。
  rationale: 本节只借角色和先后动作区分二者；译文不引入经文本身未明说的天使论或身份判断。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“看哪”保留先知异象的鲜明语气；句式按动作次序展开，并保留两位天使之间的指代关系。
