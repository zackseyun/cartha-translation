  yaml_path: translation/ot/zechariah/002/009.yaml
  text: And I myself will be for her a wall of fire all around[a], declares Yahweh, and I will be glory in her midst.
translation:
  language: zh_hans
  text: 雅威宣告：“我必亲自作她四围的火墙，也必在她中间作荣耀[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“也必在她中间成为一种荣耀。”原文“荣耀”一词没有冠词；它可作直接的谓语名词，也可理解为不定的谓语。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: 我必亲自
  rationale: 独立人称代词 אָנִי 与第一人称动词并用，带有强调意味；“亲自”在现代汉语中自然地保留这一强调。连接词 וַ 按中文引语和句流不必另译。
- source_word: אֶהְיֶה לָהּ
  choice: 作她……的
  rationale: היה 与 ל 连用，表达雅威将为这座被拟人化为女性的城充当保护；“作她……的”比生硬的“对她成为”更自然。
- source_word: נְאֻם יְהוָה
  choice: 雅威宣告
  rationale: נְאֻם 是庄重的先知宣告套语；יְהוָה 按其专名译作“雅威”，不以称号替代。中文将宣告语前置，使句子清楚自然。
- source_word: חוֹמַת אֵשׁ
  choice: 火墙
  rationale: 该组合表示“由火构成的墙”；“火墙”简洁保留神圣保护的鲜明比喻。
- source_word: סָבִיב
  choice: 四围
  rationale: 表达环绕全城之意；“四围”庄重而易懂，也与“火墙”的意象自然搭配。
- source_word: וּלְכָבוֹד אֶהְיֶה
  choice: 也必……成为荣耀
  rationale: 保留 כָבוֹד 的名词性和原文突出的谓语表达，不弱化为形容词“荣耀的”。לְ 在此引出所成为的身份或作用。
- source_word: בְתוֹכָהּ
  choice: 在她中间
  rationale: 保留阴性单数后缀所体现的城市女性拟人，也准确表达在城内、在其中心的临在。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；采用“雅威”保留其作为以色列之神专名的性质，不以称号“主”替代。
- issue: 耶路撒冷／锡安的女性拟人
  choice: 保留“她”
  alternative: 译作中性的“它”；补出“耶路撒冷”
  rationale: 原文两处后缀均为阴性单数，延续对该城的女性拟人；保留“她”既忠实于语法和文学形象，也不补入本节未明说的名称。
- issue: כָבוֹד 作谓语时的限定性
  choice: 成为荣耀
  alternative: 成为她的荣耀；成为一道荣光
  rationale: 希伯来语未用冠词，既可突出雅威本身就是城中的“荣耀”，也容许较不限定的理解。正文不擅自增加领属或量词，并以脚注提示另一种表达。
translation_notes:
  register: 采用现代、庄重而易懂的先知宣告语体。“亲自”保留独立代词的强调；“火墙”“四围”维持原文简洁有力的保护意象。神名译作“雅威”，城市的阴性拟人则以“她”保留。
