  yaml_path: translation/ot/zechariah/002/005.yaml
  text: And I lifted up my eyes and saw[a], and behold, a man, and in his hand a measuring line.
translation:
  language: zh_hans
  text: 我举目观看，看哪，有一个男子，手里拿着一根量绳[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“测量线”。希伯来语 חֶבֶל 可具体指用于测量的绳索。
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשָּׂא עֵינַי
  choice: 我举目
  rationale: 这是希伯来语“举起眼睛”的视觉叙事惯用语；“举目”既保留原文意象，也符合现代中文庄重而自然的表达。
- source_word: וָאֵרֶא
  choice: 观看
  rationale: ראה在此描述先知的视觉行动。与“举目”连用为“举目观看”，自然呈现他转眼察看异象的动作，同时避免重复使用两个“看”。
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 这是引人注意、突出异象中新出现景象的话语标记；“看哪”保留其突现感和先知文学的庄重语气。
- source_word: אִישׁ
  choice: 一个人
  rationale: 原词为阳性单数，在此指异象中的一名男子；直译为“一个人”准确、自然，不预先判定其身份。
- source_word: וּבְיָדוֹ
  choice: 手里拿着
  rationale: 原文直指“在他手中”。中文以“手里拿着”自然呈现可见姿态，并未增加动作或用途方面的解释。
- source_word: חֶבֶל מִדָּה
  choice: 一根量绳
  rationale: 该词组指用于测量的绳或线。חֶבֶל较具体地表示绳索，“量绳”简洁、自然，并保留器具的具体形态；“测量线”作为可行译法列入脚注。
theological_decisions: []
