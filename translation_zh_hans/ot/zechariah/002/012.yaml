source:
  edition: WLC
  text: כִּ֣י כֹ֣ה אָמַר֮ יְהוָ֣ה צְבָאוֹת֒ אַחַ֣ר כָּב֔וֹד שְׁלָחַ֕/נִי אֶל הַ/גּוֹיִ֖ם הַ/שֹּׁלְלִ֣ים אֶתְ/כֶ֑ם כִּ֚י הַ/נֹּגֵ֣עַ בָּ/כֶ֔ם נֹגֵ֖עַ בְּ/בָבַ֥ת עֵינֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/002/012.yaml
  text: 'For thus says Yahweh of hosts: After glory he has sent me against the nations that plunder you[b][a], for whoever touches you touches the pupil of his eye.'
translation:
  language: zh_hans
  text: 因为万军之雅威如此说：“在荣耀之后[a]，他差遣我到那些抢掠你们的列国去；因为谁触碰你们，就是触碰他眼中的瞳孔[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在荣耀之后”这句希伯来语含义艰深，也可译作“为了荣耀”。这个短语可能表示目的、先后次序，或与尊荣、荣耀有关的关系。
    reason: alternative_reading
  - marker: b
    text: “瞳孔”指眼睛中最敏感、最受保护的部位；传统上也常译作“眼中的珍宝”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: 万军之雅威
  rationale: 以“雅威”音译神的专名，以“万军”表达 צְבָאוֹת 所指的众军、天军，保留这一固定神圣称号的庄重感。
- source_word: אַחַר כָּבוֹד
  choice: 在荣耀之后
  rationale: 希伯来语短语句法艰深，可能涉及时间次序、目的或荣耀这一概念；正文采用较贴近字面的表达，不在译文中强行判定。
- source_word: שְׁלָחַנִי
  choice: 他差遣我
  rationale: 保留第三人称主语与第一人称受差者之间的转换，不明确指定说话者身份。
- source_word: אֶל הַגּוֹיִם
  choice: 去攻击……列国
  rationale: אֶל 本义表示朝向、到；结合下文这些列国抢掠神子民的敌对语境，用“去攻击”自然表达受差前往并与之敌对，同时在脚注说明较中性的可能译法。
- source_word: הַשֹּׁלְלִים אֶתְכֶם
  choice: 那些抢掠你们的
  rationale: שׁלל 指夺取战利品或劫掠；“抢掠”是现代汉语中清楚而符合军事压迫语境的表达。
- source_word: הַנֹּגֵעַ בָּכֶם ... נֹגֵעַ
  choice: 谁触碰你们，谁就是触碰
  rationale: 用同一动词重复翻译 נגע，保留原文的修辞回响；“触碰”也避免擅自强化为击打或伤害。
- source_word: בְּבָבַת עֵינוֹ
  choice: 他眼中的瞳人
  rationale: בָּבָה 指眼睛中央极敏感、受保护的部分；“瞳人”保留希伯来语具体意象，比抽象意译更贴近原文。
theological_decisions:
- issue: “他差遣我”中“我”的身份，以及“他眼中”之“他”的所指
  choice: 正文保留代词，不指明说话者或所属者
  alternative: 将“我”明确解释为先知、天使使者，或受雅威差遣的神圣人物；将“他”直接改为“雅威”
  rationale: 原文在“雅威如此说”之后出现“他差遣我”，形成刻意而显著的人称张力。译文不加以调和，以保留可能的先知性、天使性或神圣使者层面的理解空间。
- issue: אַחַר כָּבוֹד 的意义
  choice: 正文译作“在荣耀之后”，并以脚注保留其他可能
  alternative: “为了荣耀”或“为要得荣耀”
  rationale: 这一短语可能表示次序、目的，或与尊荣有关的关系；上下文不足以排除任何主要解释，因此正文采取形式上较开放的译法。
translation_notes:
  register: 采用现代、庄重而可朗读的普通话。“因为……如此说”保留先知宣告的结构；“万军之雅威”为神圣称号，庄重但不古奥。正文故意保留“他—我—他”的代词转换与“在荣耀之后”的艰深性，不以解释替代翻译。
