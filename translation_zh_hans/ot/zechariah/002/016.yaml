id: ZEC.2.16
reference: Zechariah 2:16
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/נָחַ֨ל יְהוָ֤ה אֶת יְהוּדָה֙ חֶלְק֔/וֹ עַ֖ל אַדְמַ֣ת הַ/קֹּ֑דֶשׁ וּ/בָחַ֥ר ע֖וֹד בִּ/ירוּשָׁלִָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/002/016.yaml
  text: And Yahweh will inherit Judah as his portion in the holy land[b][a], and he will again choose Jerusalem.
translation:
  language: zh_hans
  text: 耶和华必在圣地[b]承受犹大为自己的份[a]，并要再次拣选耶路撒冷。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“取得犹大作为自己的产业。”原文使用了承受产业的措辞，而不是一般表示占有的动词。
    reason: lexical_alternative
  - marker: b
    text: 直译：“在圣洁的土地上。”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָחַל
  choice: 必承受
  rationale: נחל在此指承受或取得产业。译作“承受”以保留原文的产业继承意象，而不淡化为一般的“占有”；前缀连接词在汉语句式中由全句衔接自然体现。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代简体中文读者熟悉的形式音译四字神名，保留其作为专名的性质，不以称号替代。
- source_word: אֶת יְהוּדָה
  choice: 犹大
  rationale: 直接译出专名；既可指犹大群体，也带有地域关联，原文未要求在两者之间作进一步限定。
- source_word: חֶלְקוֹ
  choice: 为自己的份
  rationale: חלק指分得的份、份额或产业。“自己的份”既保留分配和归属的意象，也避免与“承受”形成过度重复。
- source_word: עַל אַדְמַת הַקֹּדֶשׁ
  choice: 在圣地
  rationale: 原文直译为“在圣洁的土地上”。“在圣地”自然表达其地理和分别为圣的含义，脚注保留字面形式。
- source_word: וּבָחַר
  choice: 并要拣选
  rationale: בחר意为选择、拣选；“拣选”在庄重的宗教语境中自然，并保留其主动选择的意味。
- source_word: עוֹד
  choice: 再次
  rationale: 在复兴语境中表示重新、再一次采取行动；“再次”清楚传达这一时间意义。
- source_word: בִּירוּשָׁלָם
  choice: 耶路撒冷
  rationale: 采用现代中文通行的专名译法。
theological_decisions:
- issue: 以承受产业的语言描述耶和华与犹大的关系
  choice: 保留“承受犹大为自己的份”的表述
  alternative: 取得犹大作为自己的产业
  rationale: 原文把通常用于承受产业和分得份额的词用于耶和华，形成耶和华、犹大和土地彼此归属的张力。译文不把它简化为一般性的占有。
- issue: אַדְמַת הַקֹּדֶשׁ的表达
  choice: 圣地
  alternative: 圣洁的土地；圣土
  rationale: “圣地”简洁自然，能表达这片土地分别为圣的地位；脚注同时呈现原文较具体的“土地”措辞，避免掩盖其字面意象。
- issue: “再次拣选耶路撒冷”的神学时态
  choice: 保留“再次”而不解释拣选如何更新
  alternative: 仍要拣选耶路撒冷
  rationale: עוֹד可表示再次、仍旧或还要；复兴语境支持“再次”，但译文不进一步界定这是否指恢复、重申或新的行动。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。“承受……为自己的份”略带经文语体，以保留原文不寻常的产业意象；其余句法力求简洁自然。
