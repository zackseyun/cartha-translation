  text: וַ/יֹּ֣אמֶר אֵלָ֔/ו רֻ֗ץ דַּבֵּ֛ר אֶל הַ/נַּ֥עַר הַלָּ֖ז לֵ/אמֹ֑ר פְּרָזוֹת֙ תֵּשֵׁ֣ב יְרוּשָׁלִַ֔ם מֵ/רֹ֥ב אָדָ֛ם וּ/בְהֵמָ֖ה בְּ/תוֹכָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/002/008.yaml
  text: And he said to him[a], “Run, speak to that young man, saying[b], ‘Jerusalem will dwell as open country because of the multitude of man and livestock within her.’”
translation:
  language: zh_hans
  text: 他对他说：“你跑去告诉那个年轻人：‘耶路撒冷必如无城墙的村庄[a]般有人居住，因为城中人[b]和牲畜众多。’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“如同开阔之地。”原文为复数，亦可指“无城墙的村庄”。
    reason: 原文פְּרָזוֹת可表达无墙聚落或开放、向外延展的居住地；保留其词义范围。
  - marker: b
    text: 原文作“人”，在这里是集合用法，指人口或众人。
    reason: 说明אָדָם与“牲畜”相对时指整体人群，而非某一人。
lexical_decisions:
- source_word: רֻץ
  choice: 你跑去
  rationale: 保留命令式所表达的迅速行动和紧迫感；“跑去”比单纯的“赶快”更贴近原词的具体动作。
- source_word: דַּבֵּר אֶל
  choice: 告诉
  rationale: 在带有传话内容的语境中，“告诉”是自然的现代汉语表达，同时准确传达“向……说”的意思。
- source_word: הַנַּעַר הַלָּז
  choice: 那个年轻人
  rationale: נַעַר可指男孩或年轻男子；此处译作“年轻人”符合异象中的人物语境，并以“那个”保留指示词。
- source_word: פְּרָזוֹת
  choice: 没有城墙的乡村
  rationale: 该复数名词指无墙的聚落或开阔居住地；此译保留其无城墙、开放扩展的核心意象，也符合复数所呈现的村落图景。
- source_word: תֵּשֵׁב
  choice: 有人居住
  rationale: ישב在此表示定居、居住。汉语以“有人居住”自然表达耶路撒冷人口充盈的状态，而不机械直译为“坐”。
- source_word: מֵרֹב
  choice: 因为……众多
  rationale: 介词מִן与רֹב在此表达原因，即耶路撒冷呈现无墙聚落般的形态，是由于人口和牲畜数量庞大。
- source_word: אָדָם
  choice: 人
  rationale: 此处אָדָם是集合用法，与牲畜相对，泛指当地人口；现代汉语“人”既简洁自然，也保留原文的人类类别概念。
- source_word: וּבְהֵמָה
  choice: 牲畜
  rationale: בְּהֵמָה在这里集合性地指家养动物；“牲畜”比“动物”准确，也不像“牛”那样范围过窄。
- source_word: בְּתוֹכָהּ
  choice: 其中
  rationale: 阴性单数后缀回指耶路撒冷；汉语“其中”自然表达“在她里面”，无需生硬保留城市的阴性代词。
theological_decisions:
- issue: אָדָם的集合意义
  choice: 人
  alternative: 人类；人口
  rationale: 原词在此泛指与牲畜相对的人群。“人”在现代汉语中可自然作集合称呼，既不限定为男性，也不额外引入人口统计色彩。
- issue: פְּרָזוֹת所描绘的末后城市形态
  choice: 像没有城墙的乡村一样有人居住
  alternative: 如同开阔地；像无城墙的村庄
  rationale: 原文既可突出无墙聚落，也可强调开放、向外扩展的居住形态。正文采用自然且具体的“没有城墙的乡村”，脚注保留“开阔地”的词义可能，避免把异象过度限定为单一空间图景。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“你跑去”保留命令的急迫和动作感；引语中调整为汉语顺畅的因果句式。城市的希伯来语阴性指代不机械译为“她”，而用“其中”回指耶路撒冷。
