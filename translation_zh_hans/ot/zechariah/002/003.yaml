  text: וַ/יַּרְאֵ֣/נִי יְהוָ֔ה אַרְבָּעָ֖ה חָרָשִֽׁים׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/002/003.yaml
  text: Then Yahweh showed me four craftsmen[a].
translation:
  language: zh_hans
  text: 于是，雅威让我看见四个工匠[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“四个铁匠”。希伯来语这个词可特指铁匠等有技艺的工人，也可泛指工匠或手艺人。
    reason: 词义范围较宽；异象本身没有明确指出是哪一种工匠。
lexical_decisions:
- source_word: וַיַּרְאֵנִי
  choice: 于是……让我看见
  rationale: 这是ראה的使役形叙事形式，带第一人称单数宾语后缀，直译为“使我看见”。“于是”自然表达异象叙事的推进。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来语四字神名的常见拟音译出其专名，不以称号替代。
- source_word: אַרְבָּעָה
  choice: 四个
  rationale: 阳性基数词，修饰其后的阳性复数名词。
- source_word: חָרָשִׁים
  choice: 工匠
  rationale: 该词泛指有技艺的手工业者，也可特指铁匠等工匠；正文采用较宽泛的“工匠”，避免过度限定其行业。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；采用较贴近学界通常复原读音的“雅威”，保留其作为专名的性质。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“让我看见”较“给我看”更贴近希伯来语使役表达，也适合先知异象的语境。
