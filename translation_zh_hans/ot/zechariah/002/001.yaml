  text: And I lifted up my eyes and saw[a], and behold, four horns.
translation:
  language: zh_hans
  text: 我举目观看，看哪，有四个角[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“四个强权”。希伯来文直译为“角”；“角”在圣经中常用来象征力量或统治权，正文保留原有意象。
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשָּׂא אֶת־עֵינַי
  choice: 我举目
  rationale: 按希伯来语“举起双眼”的惯用表达译为自然、庄重的现代汉语“举目”，既保留原文意象，也表达把目光投向异象的动作。
- source_word: וָאֵרֶא
  choice: 观看
  rationale: ראה在此叙事序列中表示先知看见异象；与“举目”合为“举目观看”，避免汉语中“我举目，我看见”的生硬重复。
- source_word: וְהִנֵּה
  choice: 只见
  rationale: הִנֵּה用于鲜明地引出眼前所见。“只见”在现代汉语异象叙述中自然地保留其引人注意和突然呈现的功能。
- source_word: אַרְבַּע
  choice: 四只
  rationale: 准确表达数目“四”；量词“只”表明这里的“角”是兽角般的形象，而不是几何上的角或角落。
- source_word: קְרָנוֹת
  choice: 角
  rationale: 保留希伯来文“角”的具体异象，不在正文中提前解释为“强权”或“力量”，让后文说明其象征意义。
theological_decisions:
- issue: 先知异象中“角”的象征意义
  choice: 正文保留“四只角”的字面意象。
  alternative: 四个强权
  rationale: 本节先呈现异象符号，后文才加以解释。若直接译为“强权”，会过早限定其含义，并把解释写进异象本身。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“举目观看，只见”保留异象叙事的鲜明感；“四只角”清楚呈现兽角意象，并避免“四个角”被误解为角落。
