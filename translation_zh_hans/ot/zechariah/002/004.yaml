source:
  edition: WLC
  text: וָ/אֹמַ֕ר מָ֛ה אֵ֥לֶּה בָאִ֖ים לַֽ/עֲשׂ֑וֹת וַ/יֹּ֣אמֶר לֵ/אמֹ֗ר אֵ֣לֶּה הַ/קְּרָנ֞וֹת אֲשֶׁר זֵ֣רוּ אֶת יְהוּדָ֗ה כְּ/פִי אִישׁ֙ לֹא נָשָׂ֣א רֹאשׁ֔/וֹ וַ/יָּבֹ֤אוּ אֵ֨לֶּה֙ לְ/הַחֲרִ֣יד אֹתָ֔/ם לְ/יַדּ֞וֹת אֶת קַרְנ֣וֹת הַ/גּוֹיִ֗ם הַ/נֹּשְׂאִ֥ים קֶ֛רֶן אֶל אֶ֥רֶץ יְהוּדָ֖ה לְ/זָרוֹתָֽ/הּ־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/002/004.yaml
  text: Then I said[a], “What are these coming to do?” And he said, “These are the horns that scattered Judah, so that no one lifted up his head; and these have come to terrify them[c][b], to cast down the horns of the nations that lifted up a horn against the land of Judah to scatter her.”
translation:
  language: zh_hans
  text: 我问：“这些来做什么？”他回答说：“这些角，就是使犹大四散、以致无人抬得起头来的角。这些人前来，要使它们惊恐[a]，并打落列国的角[b]；那些国曾向犹大地扬起角来，要使她四散。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“使它们战栗”。
    reason: 词义可涵盖惊恐与发抖，正文采用较自然的“惊恐”。
  - marker: b
    text: “角”象征力量或进攻性的权势；正文保留异象原有的形象。“打落”也可译作“掷下”。
    reason: 说明象征意象，并注明罕见动词 לְיַדּוֹת 的译法不确定性。
lexical_decisions:
- source_word: קְּרָנוֹת / קֶרֶן
  choice: 角
  rationale: 保留先知异象中的具体象征，不在正文中直接解释为“势力”或“国家”；单复数依原文语境表达。
- source_word: זֵרוּ / לְזָרוֹתָהּ
  choice: 使……四散
  rationale: 该动词表示驱散、分散；“使……四散”自然地传达犹大遭受侵袭、流散的图景。
- source_word: כְּפִי אִישׁ לֹא נָשָׂא רֹאשׁוֹ
  choice: 以致无人抬得起头来
  rationale: 原文直译较生硬，此处是受压迫、屈辱而无力抬头的惯用表达；“抬得起”明确传达语境所含的无力感。
- source_word: לְהַחֲרִיד
  choice: 使它们惊恐
  rationale: 该词有使人战栗、惊惧之意；宾语指前述使犹大四散的“角”，中文用“它们”与象征形象相应。
- source_word: לְיַדּוֹת
  choice: 打落
  rationale: 这是罕见且释义有争议的动词；在此处表示把敌对的角掷下或击落。“打落”既贴合角的图像，也保留动作力度。
- source_word: הַגּוֹיִם
  choice: 列国
  rationale: 指与犹大敌对的外邦国家；“列国”符合现代中文圣经体裁且简洁。
- source_word: הַנֹּשְׂאִים קֶרֶן
  choice: 向……扬起角来
  rationale: 保留希伯来文以扬角表示逞强、攻击的隐喻，避免在正文中抽象化为“施展权势”。
- source_word: וַיָּבֹאוּ אֵלֶּה
  choice: 这些人来
  rationale: 此处“这些”在异象中指工匠，中文补出量词性称谓“人”，使其与作为对象的“角”区别清楚，同时不额外加入原文此节未重述的身份名称。
theological_decisions:
- issue: 是否解释“角”的象征意义
  choice: 正文保留“角”这一异象形象
  alternative: 译作“势力”或“列国的权势”
  rationale: 本段异象以角及前文的工匠构成完整图像；直接解释会缩窄象征意义，并削弱文学连贯性。
- issue: “无人抬头”是否表达能力上的不能
  choice: 译作“无人抬得起头来”
  alternative: 译作“无人抬起头来”
  rationale: 上下文描写犹大被彻底压制；中文的可能补语自然表达这种受辱和无力，但不进一步断定其具体原因。
- issue: 犹大的阴性代词
  choice: 译作“她”
  alternative: 译作“它”或省略代词
  rationale: 原文以阴性单数后缀回指犹大地；“她”保留犹大被人格化的表达，也与前文“犹大地”清楚对应。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留“角”“扬起角”等异象语言；用“列国”保持先知书语体。正文中的脚注标记均紧随相关词句。
