base_translation:
  language: en
  yaml_path: translation/ot/zechariah/002/013.yaml
  text: For behold[a], I am about to wave my hand over them, and they will become plunder for their own servants[c][b]. Then you will know that Yahweh of Armies has sent me.
translation:
  language: zh_hans
  text: 因为，看哪，我正要向他们挥动我的手，他们必成为自己奴仆[b]的掠物。于是你们就知道，万军之耶和华差遣了我。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本句说话者称“万军之耶和华差遣了我”，却没有在本句中明确说明自己的身份；译文保留了这种开放性。
    reason: alternative_reading
  - marker: b
    text: “奴仆”所译的希伯来词也可译作“仆人”。这里采用“奴仆”，以突出昔日受他们支配的人反过来取得掠物的权势逆转。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，为前面的宣告说明根据；现代汉语用“因为”能自然保留这一话语联系。
- source_word: הִנְנִי
  choice: 看哪，我要
  rationale: “看哪”保留其引人注意的先知性语气，“我要”结合后面的分词表达即将采取的行动。
- source_word: מֵנִיף אֶת־יָדִי עֲלֵיהֶם
  choice: 向他们挥动我的手
  rationale: 保留原文“挥动手”的具体形象及 עֲלֵיהֶם 的方向关系；敌对含义由上下文显明，不改写为较具解释性的“攻击”。
- source_word: וְהָיוּ
  choice: 他们就必成为
  rationale: 表达前一行动所造成的结果；“必”也符合预言宣告的确定语气。
- source_word: שָׁלָל
  choice: 掠物
  rationale: 指战争中被夺取的人或财物；此处以人称复数为主语，“掠物”比单指财物的“战利品”更合适。
- source_word: לְעַבְדֵיהֶם
  choice: 自己奴仆的
  rationale: עבד 可指仆人或奴隶；上下文强调权势颠倒，故用“奴仆”兼顾从属地位与庄重文体。“自己”明确物主代词所体现的反转。
- source_word: וִידַעְתֶּם
  choice: 于是你们就知道
  rationale: 将其表达为前述事件产生的结果，同时保留复数第二人称。
- source_word: יְהוָה צְבָאוֹת
  choice: 万军之耶和华
  rationale: 以现代中文圣经语域中清楚而庄重的方式翻译神名及称号；“万军”保留 צְבָאוֹת 所指的众军意象。
- source_word: שְׁלָחָנִי
  choice: 差遣了我
  rationale: 准确表达已经完成的委派；不在译文中补明说话者身份。
theological_decisions:
- issue: 说“万军之耶和华差遣了我”的说话者身份
  choice: 保留第一人称陈述，不在正文中指明说话者是谁。
  alternative: 将说话者明确解释为先知撒迦利亚、天使使者，或具有神性／弥赛亚性质的角色。
  rationale: 希伯来文没有在本句中明确辨认说话者。直接保留“差遣了我”，可保存上下文真实存在的身份张力，避免把某一种神学解释写进正文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“看哪”保留先知宣告的醒目语气；“万军之耶和华”延续中文圣经中自然可辨的神圣称号。脚注标记均置于正文相应位置；身份说明放在整句之后，以免将其误系于单一词语。
