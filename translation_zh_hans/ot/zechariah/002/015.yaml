id: ZEC.2.15
reference: Zechariah 2:15
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/נִלְווּ֩ גוֹיִ֨ם רַבִּ֤ים אֶל יְהוָה֙ בַּ/יּ֣וֹם הַ/ה֔וּא וְ/הָ֥יוּ לִ֖/י לְ/עָ֑ם וְ/שָׁכַנְתִּ֣י בְ/תוֹכֵ֔/ךְ וְ/יָדַ֕עַתְּ כִּי יְהוָ֥ה צְבָא֖וֹת שְׁלָחַ֥/נִי אֵלָֽיִ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/002/015.yaml
  text: And many nations will join themselves to Yahweh in that day[a], and they will be my people. And I will dwell in your midst[b], and you will know that Yahweh of Armies has sent me to you.
translation:
  language: zh_hans
  text: 到那日，许多民族必归附耶和华，成为我的子民。我必住在你中间[a]；你就会知道，是万军之耶和华差遣我[b]到你这里来的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “你”在原文中是阴性单数，承接上下文中作为受话者的锡安。
    reason: grammatical_clarification
  - marker: b
    text: 本节没有明确说明这里的“我”是谁；说话者称万军之耶和华差遣了“我”，译文保留这一含混之处。
    reason: theological_ambiguity
lexical_decisions:
- source_word: וְנִלְווּ
  choice: 必归附
  rationale: 该词为לוה的尼法勒式，在这里表示加入、依附并归向；“归附”既体现主动归属，也保留盟约忠诚的意味。
- source_word: גוֹיִם רַבִּים
  choice: 许多民族
  rationale: גוֹיִם在此强调众多国家和族群的普世范围；“民族”比“外邦人”更直接，也不额外引入犹太人与外邦人的对照。
- source_word: אֶל יְהוָה
  choice: 耶和华
  rationale: 介词אֶל与“归附”连用，表示归向和归属于耶和华；中文依专名惯例译作“耶和华”。
- source_word: בַּיּוֹם הַהוּא
  choice: 到那日
  rationale: 保留先知文学常见的时间公式，同时采用自然、庄重的现代汉语表达。
- source_word: וְהָיוּ לִי לְעָם
  choice: 成为我的子民
  rationale: 尽管主语是“许多民族”，原文עָם为单数，体现众民族共同成为一个盟约群体；“我的子民”保留这一盟约公式。
- source_word: וְשָׁכַנְתִּי בְתוֹכֵךְ
  choice: 我必住在你中间
  rationale: שׁכן指居住、安居；“在你中间”准确反映阴性单数第二人称后缀，并延续对锡安的直接称呼。
- source_word: וְיָדַעַתְּ
  choice: 你就会知道
  rationale: 译出阴性单数第二人称及上下文中的结果关系；“知道”保留先知书的确认公式。
- source_word: יְהוָה צְבָאוֹת
  choice: 万军之耶和华
  rationale: 这是该神圣称号在中文圣经传统中清楚而庄重的表达；“万军”传达צְבָאוֹת所指的众军或天上军旅。
- source_word: שְׁלָחַנִי אֵלָיִךְ
  choice: 差遣我到你这里来
  rationale: 保留完成态所表达的差遣行动及其当前可被确认的意义；“到你这里来”自然呈现方向和阴性单数受词。
theological_decisions:
- issue: “万军之耶和华差遣我”中说话者的身份
  choice: 保留第一人称“我”，不在正文中说明其身份
  alternative: 将“我”明确解释为天使、先知，或具有神性／弥赛亚身份者
  rationale: 希伯来文本只说万军之耶和华差遣“我”，并未在本节明确界定说话者。直译这一人称关系，可保存原文刻意呈现的神学张力，避免以释义代替翻译。
- issue: 众多民族与单数“子民”的关系
  choice: 译作“许多民族……成为我的子民”
  alternative: 译作“成为我的众子民”
  rationale: 原文在复数主语之后使用单数עָם，强调众民族被纳入一个共同的盟约群体，而非继续作为彼此分开的多个子民。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“归附”体现加入和归属；“子民”保留盟约语感；分号呈现两项应许与随后确认公式之间的推进关系。
