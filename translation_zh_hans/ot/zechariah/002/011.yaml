base_translation:
  language: en
  yaml_path: translation/ot/zechariah/002/011.yaml
  text: Up[a], Zion! Escape, you who dwell with Daughter Babylon.
translation:
  language: zh_hans
  text: 锡安哪，快逃吧！你这住在巴比伦之女中间的。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הוֹי
  choice: 哪，快……吧
  rationale: 此处感叹词用于急切呼唤并催促行动，而非哀叹。用“哪”标示呼语，以“快”传达紧迫感，符合现代汉语表达。
- source_word: צִיּוֹן
  choice: 锡安
  rationale: 采用现代中文圣经中通行的专名音译；上下文将锡安拟人化为女性。
- source_word: הִמָּלְטִי
  choice: 逃
  rationale: 该词为阴性单数命令式，要求从危险处脱身；“逃”自然简洁，既表达离开，也保留逃脱危险的意味。
- source_word: יוֹשֶׁבֶת
  choice: 你这住在……那里的
  rationale: 保留阴性单数分词的呼语功能，并以自然现代汉语说明被呼唤者所处之地。
- source_word: בַּת בָּבֶל
  choice: 巴比伦女子
  rationale: 直译为“巴比伦之女”。“巴比伦女子”保留先知文学中的女性拟人意象，同时避免把它直接解释为普通女子。
theological_decisions:
- issue: 阴性单数呼语的指称对象
  choice: 将锡安作为被拟人化的女性来呼唤，并保留她住在“巴比伦女子”那里的表述。
  alternative: 可理解为呼唤一位象征性的女性居民，或理解为锡安所代表的流亡群体身处巴比伦。
  rationale: 希伯来文的阴性单数命令式和分词与“锡安”的女性拟人相协调；译文不把这一形象直接化约为“流亡者”，从而保留原文的指称张力。
- issue: בַּת בָּבֶל 的句法和意象
  choice: 正文译作“巴比伦女子”，脚注提供“巴比伦之女”。
  alternative: 译作“巴比伦城”或把该短语理解为巴比伦所属的地区或居民。
  rationale: 保留构造短语的女性拟人，不以解释性地名替换原文意象。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“锡安哪”保留先知性呼语，“快逃吧”传达急切命令；正文与脚注共同保存“巴比伦之女”的拟人表达。
