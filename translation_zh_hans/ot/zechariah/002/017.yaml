  text: הַ֥ס כָּל בָּשָׂ֖ר מִ/פְּנֵ֣י יְהוָ֑ה כִּ֥י נֵע֖וֹר מִ/מְּע֥וֹן קָדְשֽׁ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/002/017.yaml
  text: Be silent[a], all flesh, before Yahweh[b], for he has roused himself from his holy dwelling.
translation:
  language: zh_hans
  text: 凡有血肉的，都当在雅威面前静默[a]，因为他已从自己的圣洁居所起来[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “凡有血肉的”也可译作“全人类”。希伯来文直译为“所有血肉”，强调人在神面前是有限的受造者。
    reason: lexical_alternative
  - marker: b
    text: “起来”也可译作“醒来”或“被唤起”。希伯来文以从安歇中转而行动的形象来描绘雅威。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַס
  choice: 静默
  rationale: 这是要求肃静的感叹式命令；“静默”庄重而自然，准确表达人在神面前止声肃立。
- source_word: כָּל בָּשָׂר
  choice: 凡有血肉的
  rationale: 保留“血肉”这一先知性表达，同时用“凡……的”使现代汉语读者容易理解其范围指一切世人，并保留受造者脆弱有限的意味。
- source_word: מִפְּנֵי
  choice: 在……面前
  rationale: 此处是“在某者面前／临在中”的惯用表达；“在……面前”简洁自然。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文以音译呈现神的专名，不用称号替代。
- source_word: כִּי
  choice: 因为
  rationale: 引出静默命令的原因，现代汉语用“因为”清楚保留因果关系。
- source_word: נֵעוֹר
  choice: 奋然起来
  rationale: 该动词描绘从静止状态被唤起而开始行动；“奋然起来”既避免暗示神实际睡眠，又保留起身行动的动态意象。
- source_word: מִמְּעוֹן קָדְשׁוֹ
  choice: 从自己的圣所
  rationale: מָעוֹן 指居所；与“圣”连用时，“圣所”在中文中自然庄重，并保留神圣居所的空间意象。“自己的”明确反映第三人称单数所属后缀。
theological_decisions:
- issue: “凡有血肉的”的范围与意象
  choice: 保留“血肉”，并以“凡有血肉的”表达广泛范围
  alternative: 全人类／所有人
  rationale: 原文可惯用地泛指全人类，但字面意象同时突出人在神面前受造、有限的身份；译文不将这种张力化约为单纯的集合称谓。
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华／主
  rationale: 以通行的学术音译呈现四字神名，保存其作为专名的性质，不以称号替代。
- issue: נֵעוֹר 所描绘的神圣行动
  choice: 奋然起来
  alternative: 醒来／被唤醒／已经起来
  rationale: 原文的形象是从安静或不行动的状态转而行动；译文保留动态感，却不把比喻解释成神实际沉睡，也不预先限定他将采取何种行动。
translation_notes:
  register: 采用现代、庄重而可朗读的先知性语体。“凡有血肉的”有意保留希伯来原文的具体意象；“静默”比口语化的“别出声”更符合敬畏场景。“圣所”在此指雅威神圣的居所，并不刻意限定为地上的圣殿或天上的居所。
