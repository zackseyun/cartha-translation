  yaml_path: translation/ot/zechariah/002/006.yaml
  text: And I said[a], “Where are you going?” And he said to me, “To measure Jerusalem[b], to see how wide it is and how long it is.”
translation:
  language: zh_hans
  text: 我说：“你往哪里去？[a]”他对我说：“去量耶路撒冷，[b]看看它有多宽、多长。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你去哪里？”原文更形式化地说：“你往哪里去？”
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译：“看看它的宽度有多少，长度有多少。”这是指看看它有多宽、多长。
    reason: lexical_alternative
lexical_decisions:
- source_word: אָנָה
  choice: 哪里
  rationale: 这是询问去向或目的地的疑问副词；“你要去哪里”是自然的现代汉语，同时保留其方向含义。
- source_word: הֹלֵךְ
  choice: 要去
  rationale: הלך表示“去、行走”；本句询问目的地，分词与人称代词连用，以“要去”表达当前行动意向最为自然。
- source_word: לָמֹד
  choice: 去量
  rationale: מדד意为“量、测量”；“量”保留了原文具体的测量行动，比“勘测”更直接。
- source_word: יְרוּשָׁלִַם
  choice: 耶路撒冷
  rationale: 采用该城名通行的现代汉语译名。
- source_word: לִרְאוֹת
  choice: 看看
  rationale: ראה本义为“看”；此处表示测量的目的。“看看”既保留原文意象，也符合现代汉语表达。
- source_word: כַּמָּה רָחְבָּהּ
  choice: 它有多宽
  rationale: 原文由“多少”与带第三人称阴性单数后缀的“宽度”组成；代词指耶路撒冷，译为“它有多宽”自然且准确。
- source_word: וְכַמָּה אָרְכָּהּ
  choice: 多长
  rationale: 这是与前一尺寸平行的表达，直指耶路撒冷的长度；与“有多宽”并列译为“多长”简洁自然。
