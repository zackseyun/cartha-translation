revisions:
- from: 我的怒火向那些牧人[a]燃烧；我必惩罚那些公山羊。因为万军之耶和华已经眷顾自己的羊群，就是犹大家[b]，要使他们如同他在战场上威武的战马。
  to: 我的怒气向牧人发作[a]；我必惩罚公山羊。因为万军之耶和华已经眷顾自己的羊群，就是犹大家[b]，要使他们如同他在战场上威武的战马。
  rationale: 仅作必要的汉语表达修订：将不自然的“怒火向……燃烧”改为“怒气向……发作”，并使脚注a对隐喻的说明更审慎。其余译文忠实、自然，保留原文的词汇联系、意象和先知书语体。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T08:17:13Z'
review_pass:
  verdict: revise
  source_fidelity: 译文准确保留了牧人、羊群、公山羊及战马的连续意象；两次 פקד 按上下文分别译为“惩罚”和“眷顾”，恰当呈现审判与眷顾的对照。“犹大家”可对应“犹大家族／犹大家”，并由脚注澄清。末句“如同他在战场上威武的战马”可接受地表达 כְּסוּס הוֹדוֹ בַּמִּלְחָמָה，未强加特定神学解释。
  naturalness: “我的怒火向那些牧人燃烧”不合现代汉语通常搭配；怒火可以“燃起”或“燃烧”，但不自然地“向某人燃烧”。改为“我的怒气向牧人发作”既自然庄重，又保留原文对牧人的敌对怒意和强烈语气。
