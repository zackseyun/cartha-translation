id: ZEC.10.3
reference: Zechariah 10:3
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: עַל הָֽ/רֹעִים֙ חָרָ֣ה אַפִּ֔/י וְ/עַל הָ/עַתּוּדִ֖ים אֶפְק֑וֹד כִּֽי פָקַד֩ יְהוָ֨ה צְבָא֤וֹת אֶת עֶדְר/וֹ֙ אֶת בֵּ֣ית יְהוּדָ֔ה וְ/שָׂ֣ם אוֹתָ֔/ם כְּ/ס֥וּס הוֹד֖/וֹ בַּ/מִּלְחָמָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/010/003.yaml
  text: My anger burns against the shepherds[a], and I will punish the male goats; for Yahweh of Armies has attended to his flock, the house of Judah[b], and will make them like his majestic horse in battle.
translation:
  language: zh_hans
  text: 我的怒气向牧人发作[a]；我必惩罚公山羊。因为万军之耶和华已经眷顾自己的羊群，就是犹大家[b]，要使他们如同他在战场上威武的战马。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “牧人”在此可比喻领袖；下文“公山羊”也可比喻显贵或带头的人。
    reason: 说明牧养与动物意象可能的比喻所指，同时保留正文的字面图像和修辞开放性。
  - marker: b
    text: “犹大家”也可译作“犹大一族”。
    reason: 说明 בֵּית יְהוּדָה 所表达的群体、家族含义，避免被误解为一栋房屋。
lexical_decisions:
- source_word: הָרֹעִים
  choice: 那些牧人
  rationale: 保留“牧人”的先知性比喻；在上下文中所指是群体的领袖，同时与后文羊群和公山羊的意象相连。
- source_word: חָרָה אַפִּי
  choice: 我的怒火……燃烧
  rationale: 这是表达强烈愤怒的希伯来语惯用语；此译法既保留“燃烧”的强度，也符合现代汉语表达。
- source_word: הָעַתּוּדִים
  choice: 那些公山羊
  rationale: 保留字面的动物意象，不在正文中直接消解为“首领”；该词在此可比喻显贵或领袖。
- source_word: אֶפְקֹד
  choice: 我必惩罚
  rationale: פקד 在敌对语境中指追究、惩治；“惩罚”清楚表达此处负面的临到。
- source_word: פָקַד
  choice: 已经眷顾
  rationale: 同一动词在此转为有利于羊群的介入。“眷顾”表达关注、照管并采取行动，也保留与前一分句语义上的张力。
- source_word: יְהוָה צְבָאוֹת
  choice: 万军之耶和华
  rationale: “耶和华”呈现专名 יהוה；“万军之”是 צבאות 在汉语圣经语体中清楚、庄重且带有军事意味的表达。
- source_word: עֶדְרוֹ
  choice: 自己的羊群
  rationale: 顺应牧人意象译为“羊群”；“自己的”自然表达第三人称反身领属。
- source_word: בֵּית יְהוּדָה
  choice: 犹大家
  rationale: “家”保留 בֵּית 的家族、群体含义，而不是简化为地名“犹大”。
- source_word: וְשָׂם אוֹתָם
  choice: 要使他们
  rationale: 把此处的动作理解为眷顾所带来的后续结果；“使”自然引出后面的比喻。
- source_word: כְּסוּס הוֹדוֹ בַּמִּלְחָמָה
  choice: 如同他在战场上威武的战马
  rationale: “威武”表达 הוֹד 的威荣与气势；“战马”结合 סוּס 与“在战场上”的直接语境，形成自然汉语，同时不额外加入超出原文的细节。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 正文采用现代中文读者广泛识别的专名“耶和华”，而不以“主”替代，从而保留原文的盟约专名性质。
- issue: עַתּוּדִים 是否直接解释为领袖
  choice: 正文保留“公山羊”，脚注说明其比喻义
  alternative: 首领／权贵
  rationale: 原词首先是动物名称，在先知语境中可指居领导地位的人。保留意象可维系本节牧人、羊群、公山羊和战马的连续画面，并避免过早消除隐喻。
- issue: פקד 两次出现的不同语境色彩
  choice: 分别译为“惩罚”和“眷顾”
  alternative: 两处均译为“察看”或“临到”
  rationale: 同一词根在前一处带审判性，在后一处带拯救和照管性。按语境分别翻译，可准确呈现经文本身刻意并置的审判与眷顾。
translation_notes:
  register: 采用庄重而现代的标准普通话。“怒火燃烧”“眷顾”“威武的战马”具有先知书所需的力度，又能为普通读者直接理解；保留牧人、公山羊、羊群和战马构成的连续意象。
