  text: וְ/אֶזְרָעֵ/ם֙ בָּֽ/עַמִּ֔ים וּ/בַ/מֶּרְחַקִּ֖ים יִזְכְּר֑וּ/נִי וְ/חָי֥וּ אֶת בְּנֵי/הֶ֖ם וָ/שָֽׁבוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/010/009.yaml
  text: I will sow them among the peoples[a], and in distant places they will remember me[b]; they and their children will live, and they will return.
translation:
  language: zh_hans
  text: 我要将他们播撒在列族中[a]；他们在远方必记念我。他们和儿女都必存活[b]，并且归回。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“把他们分散在列族中”。原文动词的本义是“撒种”，既可含分散之意，也可表达有目的地播种、日后增多。
    reason: lexical_alternative
  - marker: b
    text: 也可译“他们必与儿女一同存活”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶזְרָעֵם
  choice: 我要将他们播撒
  rationale: זָרַע本义是“撒种”。“播撒”保留种植、繁衍的意象，也容纳分散在列邦中的含义，不把经文单纯解释为审判性的驱散。
- source_word: בָּעַמִּים
  choice: 在万民中
  rationale: עַמִּים是“众民、列族”的复数；“万民”在现代中文圣经语体中自然，也避免使人只联想到现代民族国家。
- source_word: וּבַמֶּרְחַקִּים
  choice: 在远方
  rationale: מֶרְחַקִּים指遥远之处；“在远方”简洁地保留其地点含义。
- source_word: יִזְכְּרוּנִי
  choice: 必记念我
  rationale: זכר加第一人称单数后缀直译为“记念我”；不增添原文没有明说的地点副词。
- source_word: וְחָיוּ
  choice: 都必存活
  rationale: חיה在此指活着、存活，也可能含恢复生机之意；“存活”保留生命得以延续的宽泛含义。
- source_word: אֶת־בְּנֵיהֶם
  choice: 他们和儿女
  rationale: 此处אֶת宜按伴随用法理解；译作“他们和儿女”清楚表达父母与儿女一同存活，同时不把它误作直接宾语标记。
- source_word: וָשָׁבוּ
  choice: 并且归回
  rationale: שוב可指回来或回转；“归回”既适合复兴、返乡的语境，又不把含义限定为悔改。
theological_decisions:
- issue: 复兴语境中“播撒”比喻的含义
  choice: 保留既有分散、又有如撒种般带着目的和未来增长的双重意味。
  alternative: 只理解为审判中的驱散，或只理解为在万民中栽植增多。
  rationale: 上下文关乎复兴，而“撒种”意象本身也涉及分布；采用“播撒”可保留这种张力，不偏向其中一种解释。
- issue: אֶת־בְּנֵיהֶם与“存活”的关系
  choice: 把“他们和儿女”理解为共同存活的主体。
  alternative: 译为“他们必与儿女一同存活”。
  rationale: 两种表达都可体现伴随关系；正文采用并列主体结构，在现代汉语中更清楚，也符合此处אֶת的伴随性理解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“播撒”保存希伯来文的农业意象；“记念”“归回”保留经文语体和可能具有的盟约意味，但不作教派化解释。脚注[b]置于其实际所说明的“他们和儿女都必存活”之后。
