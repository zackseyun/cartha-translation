base_translation:
  language: en
  yaml_path: translation/ot/zechariah/010/012.yaml
  text: I will strengthen them in Yahweh[b][a], and in his name they will walk,” declares Yahweh.
translation:
  language: zh_hans
  text: “我必使他们因雅威而刚强[a]；他们必奉他的名而行[b]。”这是雅威的宣告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我必使他们靠雅威强盛。”
    reason: lexical_alternative
  - marker: b
    text: “奉他的名而行”也可能含有“凭他的权柄”或“在他所启示的品格之下”的意思；“行”也可指生活、行事为人。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגִבַּרְתִּים
  choice: 我要使他们……刚强
  rationale: 该动词带有使役、加强的意味，并含第一人称单数主语和第三人称阳性复数宾语。“使他们刚强”既保留使役力量，也符合现代汉语表达。
- source_word: בַּיהוָה
  choice: 在雅威里
  rationale: 介词 ב 可表示范围、根基或凭借。“在雅威里”保留这种开放性，没有单一定为“靠”或“借着”；神名 יְהוָה 音译为“雅威”。
- source_word: וּבִשְׁמוֹ
  choice: 在他的名里
  rationale: שֵׁם 的基本义是“名”，也可蕴含名声、权柄和所启示的品格。直译保留这些可能含义。
- source_word: יִתְהַלָּכוּ
  choice: 他们必……行走
  rationale: הלך 的 Hitpael 形式可指来往行走，也可引申为生活、行事为人。保留“行走”这一意象，避免将含义缩限为伦理行为。
- source_word: נְאֻם יְהוָה
  choice: 这是雅威的宣告
  rationale: 这是先知书常见的神圣宣告公式；此译清楚、庄重，并保留其权威性。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。采用“雅威”以呈现其专名性质，而非以称号替代。
- issue: “在他的名里行走”的解释力度
  choice: 保留“名”与“行走”的原文意象
  alternative: 奉他的权柄行事；靠他的名生活
  rationale: 原文可能涵盖生活方式、效忠、权柄及在雅威所启示的品格之下行动。保留意象可避免只选定其中一层。
- issue: “在雅威里”所表达的关系
  choice: 保留范围、根基或凭借之间的含混性
  alternative: 靠雅威；借着雅威
  rationale: 介词 ב 在此不必只作工具义；“在雅威里”保留刚强以雅威为范围或根基的神学张力。
translation_notes:
  register: 采用现代、庄重而可懂的简体中文。“在雅威里”和“在他的名里行走”略带经文语体，以保留希伯来文的介词关系及“行走”隐喻；脚注说明较自然但解释性更强的译法。
