  text: וְ/הָי֨וּ כְ/גִבֹּרִ֜ים בּוֹסִ֨ים בְּ/טִ֤יט חוּצוֹת֙ בַּ/מִּלְחָמָ֔ה וְ/נִ֨לְחֲמ֔וּ כִּ֥י יְהוָ֖ה עִמָּ֑/ם וְ/הֹבִ֖ישׁוּ רֹכְבֵ֥י סוּסִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/010/005.yaml
  text: They will be like mighty men[a], trampling the mire of the streets in battle; they will fight, because Yahweh is with them, and they will put horsemen to shame.
translation:
  language: zh_hans
  text: 他们必像勇士[a]，在战场上践踏街上的泥泞；他们必争战，因为雅威与他们同在；他们必使骑兵蒙羞。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“战士”。希伯来语使用阳性复数词，指英勇强健的战士。
    reason: 词义替代，并说明原文的阳性军事用语。
lexical_decisions:
- source_word: וְהָיוּ
  choice: 他们必像
  rationale: 连词加完成式用于先知性话语，表达将来的情形；中文以“必”自然体现预告和确定性，不必机械译出句首“并且”。
- source_word: כְגִבֹּרִים
  choice: 像勇士
  rationale: גִּבּוֹרִים指强健英勇的战士；“勇士”保留阳性军事形象，又符合现代汉语圣经语体。
- source_word: בּוֹסִים בְּטִיט חוּצוֹת
  choice: 把敌人践踏得如同街上的泥泞
  rationale: בוס表示践踏，בְּטִיט חוּצוֹת描绘街上泥泞的具体形象。原文未明说“敌人”，但战斗语境和及物意象表明被践踏者是敌军；中文补出“敌人”可避免误解为勇士只是在泥里行走，同时用“如同”保留其被视作泥泞而践踏的图景。
- source_word: בַּמִּלְחָמָה
  choice: 在战场上
  rationale: 此处指具体交战情景；“在战场上”比“在战争中”更自然，也与践踏敌军的画面契合。
- source_word: וְנִלְחֲמוּ
  choice: 他们必争战
  rationale: נלחם在此表示投入战斗；“争战”庄重而清楚，承接先知性的将来语气。
- source_word: כִּי יְהוָה עִמָּם
  choice: 因为雅威与他们同在
  rationale: כִּי具有因果作用；“雅威”音译神圣四字名，保留专名而不以称号替代。
- source_word: וְהֹבִישׁוּ
  choice: 他们必使……蒙羞
  rationale: 使役式表达使对方受羞辱、败退失威；“使……蒙羞”保留使役意义，并适合军事语境。
- source_word: רֹכְבֵי סוּסִים
  choice: 骑兵
  rationale: 字面为“骑马的人”，在军事语境中“骑兵”是简洁准确的现代汉语对应词。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。采用“雅威”作为现代汉语音译，保留其专名性质，不以“主”这一称号替换。
- issue: גִּבֹּרִים 的阳性军事意象
  choice: 勇士
  alternative: 英勇的人；战士
  rationale: “勇士”既保留原词所指的阳性、强健战士形象，也不额外加入特定军阶或神学解释。
- issue: 践踏对象在原文中的省略
  choice: 正文补出“敌人”，并以“如同”连接泥泞意象
  alternative: 践踏街上的泥泞
  rationale: 希伯来语的表达可形式上读作“践踏街上的泥泞”，但战斗语境通常理解为践踏敌人如践踏街泥。中文若直译容易变成单纯踩泥，削弱胜敌图景；补出隐含对象可清楚传意，同时不改变神学重点。
translation_notes:
  register: 采用现代、庄重且便于普通读者理解的书面汉语。“必”体现先知性宣告；分号保留原句的推进层次。正文避免古奥词语，同时保留“勇士”“争战”“蒙羞”等经文语体。
