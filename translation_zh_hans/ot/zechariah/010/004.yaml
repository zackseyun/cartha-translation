  text: מִמֶּ֤/נּוּ פִנָּה֙ מִמֶּ֣/נּוּ יָתֵ֔ד מִמֶּ֖/נּוּ קֶ֣שֶׁת מִלְחָמָ֑ה מִמֶּ֛/נּוּ יֵצֵ֥א כָל נוֹגֵ֖שׂ יַחְדָּֽו־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/010/004.yaml
  text: From him will come the cornerstone[a], from him the tent peg, from him the battle bow[b]; from him every ruler will go out together.
translation:
  language: zh_hans
  text: 从他而出的是房角石，从他而出的是帐篷的橛子，从他而出的是争战的弓[b]；所有掌权者[a]也都一同从他而出。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“所有压迫者”或“所有监工”。这个希伯来词可指驱使人、强征劳役或贡赋的人；在此上下文中，也可能较广泛地指从犹大兴起的掌权者。
    reason: alternative_reading
  - marker: b
    text: “房角石”“帐篷的橛子”和“争战的弓”都是比喻，分别呈现从犹大而来的稳固、支撑和军事力量。
    reason: cultural_note
lexical_decisions:
- source_word: מִמֶּנּוּ
  choice: 从他而出
  rationale: 原文四次使用带第三人称阳性单数后缀的“从……”，所指承接上文的犹大。译文保留单数形式和反复句式，不擅自改为“从他们”。
- source_word: פִנָּה
  choice: 房角石
  rationale: 该词可指角或房角石；在这一组象征稳固、支撑和力量的意象中，“房角石”具体而自然，也不增添原文没有的“首要”等限定。
- source_word: יָתֵד
  choice: 帐篷的橛子
  rationale: 该词指橛子或桩，常用于固定帐篷；明确译作“帐篷的橛子”，可保留其稳固、支撑的具体意象。
- source_word: קֶשֶׁת מִלְחָמָה
  choice: 争战的弓
  rationale: 这是表示用于战争之弓的组合，译文保留“弓”的具体军事意象，并以自然中文表达其战争用途。
- source_word: יֵצֵא
  choice: 而出
  rationale: יצא的基本意思是出去、出来；“而出”简洁保留原文动作，并适合本节反复而庄重的句式。
- source_word: כָל נוֹגֵשׂ
  choice: 一切掌权者
  rationale: נֹגֵשׂ常指驱使人、征收劳役或贡赋者，也可在此语境中泛指执掌权力的人。本节整体正面描写从犹大兴起的稳固、支撑、军事力量和治理，因此正文采用较中性的“掌权者”，负面或劳役管理方面的含义收入脚注。
- source_word: יַחְדָּו
  choice: 都一同
  rationale: 该副词表达共同、一起；“都一同”既呼应前面的“一切”，也保留这些掌权者共同而出的含义。
theological_decisions:
- issue: כָל נוֹגֵשׂ在本节应取正面、中性还是负面含义
  choice: 正文译作“一切掌权者”
  alternative: “一切压迫者”或“一切监工”
  rationale: 房角石、帐篷橛子和争战之弓共同构成稳固、支撑和力量的正面图景，末项在平行结构中较可能指从犹大兴起的治理者。不过，该希伯来词在别处常带驱使、压迫或强征劳役的意味，故不消除其词义张力，而在脚注中保留其他可能。
- issue: מִמֶּנּוּ的所指和语法数
  choice: 保留阳性单数为“从他而出”，承接上文的犹大
  alternative: 按集合意义译为“从他们而出”或按地域译为“从那里而出”
  rationale: 原文形式为阳性单数，虽可把犹大理解为群体或地域，正文仍保留其语法形式，避免将集合性解释直接写入经文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以“从他而出”的反复保留原文排比；“房角石”“帐篷的橛子”“争战的弓”保持具体意象，不在正文中展开解释。脚注标记均置于相关词语或意象之后。
