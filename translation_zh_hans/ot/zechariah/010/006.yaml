id: ZEC.10.6
reference: Zechariah 10:6
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/גִבַּרְתִּ֣י אֶת בֵּ֣ית יְהוּדָ֗ה וְ/אֶת בֵּ֤ית יוֹסֵף֙ אוֹשִׁ֔יעַ וְ/הֽוֹשְׁבוֹתִי/ם֙ כִּ֣י רִֽחַמְתִּ֔י/ם וְ/הָי֖וּ כַּ/אֲשֶׁ֣ר לֹֽא זְנַחְתִּ֑י/ם כִּ֗י אֲנִ֛י יְהוָ֥ה אֱלֹהֵי/הֶ֖ם וְ/אֶעֱנֵֽ/ם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/010/006.yaml
  text: I will strengthen the house of Judah[a], and I will save the house of Joseph. I will restore them, because I have had compassion on them, and they will be as though I had not rejected them; for I am Yahweh their God[b], and I will answer them.
translation:
  language: zh_hans
  text: “我要使犹大家刚强，并拯救约瑟家[a]。我要使他们归回[b]，因为我怜悯他们；他们必像我从未弃绝过他们一样，因为我是耶和华他们的神，我必回应他们。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “约瑟家”指约瑟的后裔；在先知书中，这一称呼常可统指北方各支派。
    reason: cultural_note
  - marker: b
    text: 所给原文书写形式可译为“使他们居住”或“使他们安居”；传统校读作“使他们归回”。
    reason: textual_note
lexical_decisions:
- source_word: וְגִבַּרְתִּי
  choice: 我要使……刚强
  rationale: גבר 的皮耶勒式表达使之强盛、使之刚强；此译保留使动含义，又不额外限定为军事力量。
- source_word: בֵּית יְהוּדָה
  choice: 犹大家
  rationale: 保留“家”这一表示宗族及群体的称谓，不简化为“犹大”。
- source_word: בֵּית יוֹסֵף
  choice: 约瑟家
  rationale: 忠实保留原文的群体称谓；其在先知语境中常指约瑟后裔，尤其可涵盖北方支派，另以脚注说明。
- source_word: אוֹשִׁיעַ
  choice: 拯救
  rationale: ישׁע 的希使斐勒式表示救助、解救；“拯救”直接而自然，也保留其神学分量。
- source_word: וְהוֹשְׁבוֹתִים
  choice: 我要使他们归回
  rationale: 按 שוב 的希使斐勒式理解为“使归回、带回来”；在流散与复兴语境中，“使他们归回”保留了明确的返回意象。
- source_word: כִּי רִחַמְתִּים
  choice: 因为我怜悯了他们
  rationale: רחם 表示怜悯、慈悲；译文保留完成式所呈现的、作为随后行动依据的怜悯。
- source_word: וְהָיוּ כַּאֲשֶׁר לֹא זְנַחְתִּים
  choice: 他们必像从未被我弃绝一样
  rationale: 保留原文反事实式的比较；זנח 译为“弃绝”，既清楚又不强化为彻底遗弃。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名“耶和华”呈现四字神名，而不以“主”等称号替代。
- source_word: וְאֶעֱנֵם
  choice: 我必回应他们
  rationale: ענה 的基本义是回答、回应；“回应”比“垂听”更直接保留词义，也不预先限定回应的具体方式。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。中文正文采用广为人知且具专名功能的“耶和华”，避免用“主”替代；“雅威”则是较贴近现代学界拟音的可行译法。
- issue: “约瑟家”的群体所指
  choice: 正文保留“约瑟家”
  alternative: 直接释为“北方支派”或“以法莲”
  rationale: 原文使用约瑟之名，既具有历史宗族含义，也可能在语境中统称北方支派；正文不把这一复合指向收窄，脚注仅提供背景。
- issue: 归回与复兴的关系
  choice: 使他们归回
  alternative: 复兴他们
  rationale: 原动词可在复兴语境中产生较宽的恢复含义，但“归回”更直接保留 שוב 的空间与流散背景；脚注注明较宽译法。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“犹大家”“约瑟家”保留原文的群体表达；“像从未被我弃绝一样”以现代句式传达原文的反事实比较。脚注标记按其实际所注内容重新安置，避免英文咨询层中标记与注释内容错位的问题。
