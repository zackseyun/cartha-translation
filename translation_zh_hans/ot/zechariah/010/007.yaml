base_translation:
  language: en
  yaml_path: translation/ot/zechariah/010/007.yaml
  text: Ephraim will be like a mighty warrior[a], and their heart will rejoice as with wine; their children will see and rejoice[b]; their heart will exult in Yahweh.
translation:
  language: zh_hans
  text: 以法莲人必如勇士一般；他们的心[b]必欢喜，仿佛因酒而欢喜。他们的儿女[a]必看见，也必欢喜；他们的心必因雅威而欢腾。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文作“儿子们”；在这里也可泛指儿女或后代。
    reason: lexical_alternative
  - marker: b
    text: 原文“心”为单数形式，按集体意义指众人的心。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיוּ כְגִבּוֹר אֶפְרַיִם
  choice: 以法莲人必如勇士一般
  rationale: 复数动词与作为集体名称的“以法莲”呼应；כְּ保留为“如……一般”，גִּבּוֹר按上下文译为具有战斗意味的“勇士”。
- source_word: וְשָׂמַח לִבָּם
  choice: 他们的心必欢喜
  rationale: 保留“心”的集体单数表达，也传达内在整体的喜乐；未改写成较弱的“高兴”。
- source_word: כְּמוֹ יָיִן
  choice: 仿佛因酒而欢喜
  rationale: 原文比较极为简练；此译显明所比较的是酒所带来的欢喜，同时避免把“心”直接等同于酒。
- source_word: וּבְנֵיהֶם
  choice: 他们的儿女
  rationale: בנים字面可指“儿子”，在此家族与后代的集体语境中可泛指儿女或后代；正文采用自然且包容语境的“儿女”，脚注保留字面可能。
- source_word: יִרְאוּ וְשָׂמֵחוּ
  choice: 看见了，也必欢喜
  rationale: 希伯来文未明说“看见”的宾语，中文也不补出具体对象，以保留所见之事的含蓄性；“了”使省略宾语的中文表达较自然，并非改变时态。
- source_word: יָגֵל לִבָּם
  choice: 他们的心必……欢腾
  rationale: גיל比一般的“欢喜”更有雀跃、洋溢之意，译作“欢腾”以区别前面的שמח。
- source_word: בַּיהוָה
  choice: 因雅威而
  rationale: ב可表达喜乐的根据或所在领域；中文用“因……而”自然表达他们的欢腾以雅威为根由。神名יהוה音译为“雅威”。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；音译“雅威”保留其专名性质，不以称号取代，也不借此加入额外的宗派解释。
- issue: 以法莲的集体指称
  choice: 以法莲人
  alternative: 以法莲
  rationale: 复数动词显示“以法莲”在此集体指其百姓；加“人”使现代中文清楚自然，但不进一步限定为某一政治或末世解释。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“必”传达先知性将来语气；分号保持本节两组喜乐陈述的平行结构。对“看见”的宾语不作补充，以保留原文含蓄；两个不同的喜乐动词分别译为“欢喜”和“欢腾”。
