  to: 以法莲人必如勇士一般；他们的心[b]必欢喜，仿佛因酒而欢喜。他们的儿女[a]必看见，也必欢喜；他们的心必因雅威而欢腾。
  rationale: 仅将“看见了，也必欢喜”改为“必看见，也必欢喜”，使两个并列动词与上下文的预言性将来语气一致，并保留原文没有明示“看见”宾语的含蓄性。其余译文及脚注可保留。
