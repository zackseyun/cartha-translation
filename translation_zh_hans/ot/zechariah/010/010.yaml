  text: וַ/הֲשִֽׁיבוֹתִי/ם֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם וּ/מֵֽ/אַשּׁ֖וּר אֲקַבְּצֵ֑/ם וְ/אֶל אֶ֨רֶץ גִּלְעָ֤ד וּ/לְבָנוֹן֙ אֲבִיאֵ֔/ם וְ/לֹ֥א יִמָּצֵ֖א לָ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/010/010.yaml
  text: I will bring them back from the land of Egypt[a], and gather them from Assyria; I will bring them into the land of Gilead and Lebanon, and no room will be found for them.
translation:
  language: zh_hans
  text: 我要把他们从埃及地带回来，从亚述招聚他们；我要把他们带到基列地和黎巴嫩，也没有地方容得下他们。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 较直译：“也不会为他们找到地方。”原文没有明说所找的是什么；这里按语境理解为容身的地方。
    reason: 说明原文省略的宾语，并保留较直译的被动表达。
lexical_decisions:
- source_word: וַהֲשִׁיבוֹתִים
  choice: 我要把他们……带回来
  rationale: שוב 的使役式表示使人返回；“带回来”在现代汉语中自然，并保留从流散之地返回的空间含义。
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: 从埃及地
  rationale: 明确译出 אֶרֶץ（地），保留地理表述及其可能引发的出埃及回响。
- source_word: וּמֵאַשּׁוּר אֲקַבְּצֵם
  choice: 从亚述招聚他们
  rationale: קבץ 在流散者复归的语境中指把分散的人聚集起来；“招聚”庄重、清楚，也与普通的物品“收集”有别。
- source_word: וְאֶל אֶרֶץ גִּלְעָד וּלְבָנוֹן אֲבִיאֵם
  choice: 我要把他们带到基列地和黎巴嫩
  rationale: ביא 的使役式直译为“带到”；“基列地和黎巴嫩”自然呈现目的地，同时保留原文明确出现的“地”。
- source_word: וְלֹא יִמָּצֵא לָהֶם
  choice: 那里将容纳不下他们
  rationale: 原文没有明说被“找到”的对象，语境暗示地方或空间不足。“容纳不下他们”以自然汉语表达这一含义，同时在脚注保留原文的省略和被动措辞。
theological_decisions:
- issue: וְלֹא יִמָּצֵא לָהֶם 中省略的对象
  choice: 正文译作“那里将容纳不下他们”，表达归回者众多、地方不足的语境含义
  alternative: 较直译为“也不会为他们找到地方”，或完全保留省略而译成不完整的“也不会为他们找到”
  rationale: 希伯来文未明说“地方”，因此不把“地方不足”包装成原文明说的内容；正文采用可懂的汉语，脚注则交代较直译形式，以保存原文的含蓄。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“招聚”延续先知书中聚集流散百姓的语域；分号呈现两组彼此对应的神圣行动，末句保留并列关系，不擅自译成目的或结果从句。
