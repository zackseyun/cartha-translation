base_translation:
  language: en
  yaml_path: translation/ot/zechariah/010/008.yaml
  text: I will whistle for them and gather them[a], for I have redeemed them[b], and they will be as many as they were before.
translation:
  language: zh_hans
  text: 我要吹哨召唤他们，把他们聚集起来[a]，因为我已经救赎了他们；他们必重新增多，像从前那样[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “吹哨”也可译作“发信号”；这里的希伯来语动词可指吹哨或发出嘶声来召唤。
    reason: lexical_alternative
  - marker: b
    text: 较贴近原文可译作“他们必增多，像他们曾经增多那样”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶשְׁרְקָה לָהֶם
  choice: 我要吹哨召唤他们
  rationale: שׁרק指吹哨或发出嘘声作为召集信号；现代汉语用“吹哨召唤”既保留具体意象，也清楚表达לָהֶם所指的召唤对象。
- source_word: וַאֲקַבְּצֵם
  choice: 把他们聚集起来
  rationale: קבץ表示将分散的人聚拢、招聚；“聚集起来”自然地保留先知语境中的归聚含义。
- source_word: כִּי פְדִיתִים
  choice: 因为我已经救赎了他们
  rationale: כִּי在此引出召集的理由；פדה表示从奴役、困境或权势下赎回，“救赎”保留其盟约与拯救色彩，而不额外说明救赎机制。
- source_word: וְרָבוּ
  choice: 他们必增多
  rationale: רבה在此指人数增多；在先知性语境中，完成式承接前文而具有将来指向，因此译作“必增多”。
- source_word: כְּמוֹ רָבוּ
  choice: 像从前一样
  rationale: 希伯来文直译近于“像他们曾经增多／众多那样”。正文采用自然汉语表达恢复以往人数的通常理解，并用脚注保留原文措辞及其可能的动态含义。
theological_decisions:
- issue: 救赎之后的归聚与人数恢复
  choice: 译文呈现上帝因已经施行救赎而召集、聚拢百姓，并使他们重新增多。
  alternative: 把本节限定为某一种末世方案，或纯粹解释为属灵性的聚集。
  rationale: 原文明确关联召唤、聚集、救赎与增多，却没有在本节交代更具体的时间表或实现机制；译文因此保留其民族与盟约复兴意象，不引入经文之外的体系。
- issue: 末句比较结构的含义
  choice: 正文译作“他们必增多，像从前一样”，表达恢复到以往众多的状态。
  alternative: 较贴近词形地译作“他们必增多，像他们曾经增多那样”，着重增多的过程。
  rationale: כְּמוֹ רָבוּ既可使人想到过去众多的状态，也可按动词字面理解为过去增多的过程；正文采用自然且符合语境的表达，脚注保留另一可能。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“吹哨召唤”保留原文鲜明意象并避免单用“嘘声”在现代汉语中的负面联想；分号清楚呈现救赎根据与随后人数恢复之间的推进关系。
