source:
  edition: WLC
  text: שַׁאֲל֨וּ מֵ/יְהוָ֤ה מָטָר֙ בְּ/עֵ֣ת מַלְק֔וֹשׁ יְהוָ֖ה עֹשֶׂ֣ה חֲזִיזִ֑ים וּ/מְטַר גֶּ֨שֶׁם֙ יִתֵּ֣ן לָ/הֶ֔ם לְ/אִ֖ישׁ עֵ֥שֶׂב בַּ/שָּׂדֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/010/001.yaml
  text: Ask Yahweh for rain in the time of the latter rain[a]; Yahweh makes storm clouds, and he will give them showers of rain[b], to each man vegetation in the field.
translation:
  language: zh_hans
  text: 你们要在晚雨时节向雅威求雨[a]。雅威造出雷雨云[b]；他必赐给他们雨水，也赐给各人田野里的草木。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “晚雨”也可译作“春雨”，即收获前降下的后期雨。
    reason: 说明 מַלְקוֹשׁ 的农业季节含义及可选译法。
  - marker: b
    text: “雷雨云”也可译作“闪电”。
    reason: חֲזִיזִים 可指风暴云层，也可指闪电，原词具有词义歧义。
lexical_decisions:
- source_word: שַׁאֲלוּ מֵיְהוָה מָטָר
  choice: 你们要向雅威求雨
  rationale: 复数命令式译为“你们要……求”，מִן 表示所求的来源；现代汉语用“向雅威求雨”自然表达这一关系。
- source_word: בְּעֵת מַלְקוֹשׁ
  choice: 在晚雨时节
  rationale: מַלְקוֹשׁ 指农耕年度后期、收获前的雨；“晚雨”贴近其相对于早雨的名称，“时节”明确 בְּעֵת 的季节含义。脚注补充“春雨”这一按当地季节表达的译法。
- source_word: עֹשֶׂה חֲזִיזִים
  choice: 造出雷雨云
  rationale: חֲזִיזִים 在此可指伴随降雨的风暴现象，也可具体指闪电。“雷雨云”符合上下文且保留风暴图景，脚注列出“闪电”这一真实词义可能。
- source_word: וּמְטַר גֶּשֶׁם יִתֵּן לָהֶם
  choice: 他必赐雨水给他们
  rationale: 将未完成式按命令之后的应许语气译为“必赐”；“雨水”自然表达 מְטַר גֶּשֶׁם 的实质，而不武断限定为暴雨或阵雨。保留原文从第二人称“你们”转为第三人称“他们”的转换。
- source_word: לְאִישׁ עֵשֶׂב בַּשָּׂדֶה
  choice: 使各人的田野长出草木
  rationale: אִישׁ 在此作逐一分配用法，汉语“各人”准确而自然；עֵשֶׂב 范围比“草”更广，故译“草木”。“使……长出”明示上下文中雨水供应与田野生长之间的关系，避免生硬的双重“赐给”结构。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。采用“雅威”以音译方式保留盟约之名，不用称号替代。
- issue: לְאִישׁ 的逐一分配含义
  choice: 各人
  alternative: 每一个男人；每个人
  rationale: אִישׁ 是阳性单数，但在此用于逐一分配。现代汉语“各人”既保留个体分配力，也不添加原文没有强调的生理性别。
- issue: 雨与田野草木的句法关系
  choice: 使各人的田野长出草木
  alternative: 赐雨给他们，赐田野的草木给各人
  rationale: 希伯来语表达紧凑，可理解为雅威把雨赐给众人，从而使各人的田野有草木。正文采用自然汉语显明语境中的结果关系，但不把草木改成特定庄稼。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。命令句直接有力；“晚雨时节”“雷雨云”“草木”等词兼顾源文意象与现代可读性。标点将命令与随后的应许分开，并保留原文“你们／他们”的人称转换。
