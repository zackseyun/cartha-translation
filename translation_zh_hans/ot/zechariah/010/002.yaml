source:
  edition: WLC
  text: כִּ֧י הַ/תְּרָפִ֣ים דִּבְּרוּ אָ֗וֶן וְ/הַ/קּֽוֹסְמִים֙ חָ֣זוּ שֶׁ֔קֶר וַֽ/חֲלֹמוֹת֙ הַ/שָּׁ֣וא יְדַבֵּ֔רוּ הֶ֖בֶל יְנַֽחֵמ֑וּ/ן עַל כֵּן֙ נָסְע֣וּ כְמוֹ צֹ֔אן יַעֲנ֖וּ כִּֽי אֵ֥ין רֹעֶֽה־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/010/002.yaml
  text: For the household idols speak wickedness[a], and the diviners see lies; they speak empty dreams and give vain comfort. Therefore they wander like sheep[b]; they are afflicted because there is no shepherd.
translation:
  language: zh_hans
  text: 因为家神所说的是虚妄[a]，占卜者所见的是谎言；他们讲述虚妄的梦，给人空洞的安慰。因此，众人如羊群般流离，因没有牧人而受苦[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “家神”原文为“特拉芬”，指家庭或家族中用于祭祀、求问的神像。
    reason: lexical_alternative
  - marker: b
    text: “受苦”也可译作“受压迫”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַתְּרָפִים
  choice: 家神
  rationale: 此词指家庭或家族中用于祭祀、求问的神像，而非泛指一切偶像。“家神”简洁自然，并保留其家庭崇拜背景。
- source_word: דִּבְּרוּ אָוֶן
  choice: 所说的是虚妄
  rationale: אָוֶן可指邪恶、虚妄或欺诈；本节与“谎言”“虚假的梦”平行，译作“虚妄”既保留道德否定，也不过度限定为某一种欺骗。
- source_word: הַקּוֹסְמִים
  choice: 占卜者
  rationale: 准确表达借占卜寻求超自然指引的人，符合现代汉语的圣经语域。
- source_word: חָזוּ שֶׁקֶר
  choice: 所见的是谎言
  rationale: 保留“看见”这一异象性用语，同时表明其所谓启示是虚假的。
- source_word: חֲלֹמוֹת הַשָּׁוְא יְדַבֵּרוּ
  choice: 他们讲述虚假的梦
  rationale: “讲述”自然表达对梦境的宣讲；הַשָּׁוְא在此强调梦的不实与虚妄，译作“虚假的”切合上下文。
- source_word: הֶבֶל יְנַחֵמוּן
  choice: 给人空洞的安慰
  rationale: הֶבֶל表示空虚、无实质或徒然；“空洞的安慰”既自然，也传达这种安慰毫无可靠内容。
- source_word: נָסְעוּ כְמוֹ צֹאן
  choice: 众人如羊群般流离
  rationale: נָסַע本义可指拔营、启程；在无牧人的羊群意象中，“流离”表现他们失去引导、四处辗转的处境，同时避免将动词仅处理为无目的的漫游。
- source_word: יַעֲנוּ
  choice: 受苦
  rationale: 该形式可表达受压迫、受苦或遭困苦。“受苦”保持宽泛含义，不擅自限定苦难的具体性质。
- source_word: אֵין רֹעֶה
  choice: 没有牧人
  rationale: 直译存在句，并保留牧羊人兼具引导者与领袖的隐喻空间。
theological_decisions:
- issue: 被谴责的宗教对象与求问方式
  choice: 明确译出家神、占卜者和虚假的梦，呈现经文对虚假指引来源的谴责。
  alternative: 把“家神”泛化为普通偶像，或把整节仅解释为政治领袖失职。
  rationale: 原文列举具体的祭祀和占卜媒介，结尾才转入无牧人的群羊意象；译文保留两层图景，不把“牧人”预先限定为某一类领袖。
- issue: 无牧人的羊群所指
  choice: 以“众人”承接原文未明说的复数主语，并保留牧人意象。
  alternative: 明确译成“百姓”或某个特定群体。
  rationale: 上下文很可能指百姓，但本节希伯来文本没有明说名词主语；用“众人”维持可读性，也避免加入原文未明确给出的身份。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“家神”“占卜者”“牧人”保留古代宗教与牧养意象；句式体现原文从虚假启示转向群羊困境的因果推进。
