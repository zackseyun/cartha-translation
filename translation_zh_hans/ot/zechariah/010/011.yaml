source:
  edition: WLC
  text: וְ/עָבַ֨ר בַּ/יָּ֜ם צָרָ֗ה וְ/הִכָּ֤ה בַ/יָּם֙ גַּלִּ֔ים וְ/הֹבִ֕ישׁוּ כֹּ֖ל מְצוּל֣וֹת יְאֹ֑ר וְ/הוּרַד֙ גְּא֣וֹן אַשּׁ֔וּר וְ/שֵׁ֥בֶט מִצְרַ֖יִם יָסֽוּר׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/010/011.yaml
  text: He will pass through the sea of distress and strike the waves of the sea[a], and all the depths of the Nile will dry up. The pride of Assyria will be brought down[c][b], and the scepter of Egypt will depart.
translation:
  language: zh_hans
  text: 他必经过苦难之海[a]，击打海中的波涛；尼罗河[b]所有的深处都必干涸。亚述的骄傲必被降卑，埃及的权杖[c]必离去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“经过一片苦难之海”，或“经过动荡的海”。希伯来语原句十分紧凑，可能唤起出埃及的意象，并不一定只指某一片实际的海。
    reason: lexical_alternative
  - marker: b
    text: “尼罗河”：希伯来语也可泛指“河”；在埃及语境中通常指尼罗河。
    reason: lexical_alternative
  - marker: c
    text: 或译：“埃及的杖”。这里的“权杖”可能表示埃及的统治权势。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָבַר
  choice: 他必经过
  rationale: 该动词是单数形式，在先知性语境中承接上下文所应许的行动，宜用将来语气。“经过”保留穿越的动态意象；“他”不在正文中进一步指名，以免超出希伯来文显明的信息。
- source_word: בַּיָּם צָרָה
  choice: 经过苦难之海
  rationale: 这一紧凑短语可理解为“苦难之海”，也可能是“经过海中的苦难”或“经过动荡的海”。正文采用自然而仍具意象性的表达，并以脚注保留歧义及可能的出埃及回响。
- source_word: וְהִכָּה בַיָּם גַּלִּים
  choice: 击打海中的波涛
  rationale: נכה 按通常意义译为“击打”；“海中的波涛”贴近原文介词结构，也符合现代汉语表达。
- source_word: וְהֹבִישׁוּ כֹּל מְצוּלוֹת יְאֹר
  choice: 尼罗河所有的深处都必干涸
  rationale: 在水域语境中，יבש 的使役形表示使之干涸；中文以结果状态表达较自然。מְצוּלוֹת 指深处或深水之处，יְאֹר 在埃及语境中通常指尼罗河。
- source_word: וְהוּרַד גְּאוֹן אַשּׁוּר
  choice: 亚述的骄傲必被降下
  rationale: גְּאוֹן 可指骄傲、威荣或高傲；审判语境支持“骄傲”。הוּרַד 是使役被动形式，故译作“必被降下”，保留被动和降低的意象。
- source_word: וְשֵׁבֶט מִצְרַיִם יָסוּר
  choice: 埃及的权杖必消逝
  rationale: שֵׁבֶט 可指杖、棍或权杖；与帝国权势受审判的平行语境相合，“权杖”较能体现统治权。יָסוּר 表示离去、除去，译为“必消逝”自然地表达其统治终止。
theological_decisions:
- issue: 连续动作的主语及隐含施事者
  choice: 以单数“他”承接上下文，理解为上帝施行拯救和审判
  alternative: 部分动作的主语也可能被理解为复兴后的百姓，或把“苦难”看作后置主语
  rationale: 马所拉文本的单数动词序列及上下文中的神圣拯救行动，较支持上帝为隐含主语；但正文不直接增译“耶和华”，避免消除原文仅以动词形式和语境提示主语的特点。
- issue: 海的意象是否专指出埃及事件
  choice: 保留“苦难之海”的诗性表达，不明说红海或芦苇海
  alternative: 明确译作出埃及时所过的海，或纯粹理解为一般困境
  rationale: 经文可能唤起出埃及传统，但没有直接点明具体海域；保持意象可兼顾历史回响与未来拯救的诗性张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。句式保留希伯来诗歌中海、河与帝国权势并列受制伏的节奏；避免古奥词汇，也不把可能的出埃及暗示具体化为原文未明说的地名。
