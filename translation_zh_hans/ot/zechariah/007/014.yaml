  text: וְ/אֵ֣סָעֲרֵ֗/ם עַ֤ל כָּל הַ/גּוֹיִם֙ אֲשֶׁ֣ר לֹֽא יְדָע֔וּ/ם וְ/הָ/אָ֨רֶץ֙ נָשַׁ֣מָּה אַֽחֲרֵי/הֶ֔ם מֵֽ/עֹבֵ֖ר וּ/מִ/שָּׁ֑ב וַ/יָּשִׂ֥ימוּ אֶֽרֶץ חֶמְדָּ֖ה לְ/שַׁמָּֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/007/014.yaml
  text: And I scattered them with a storm wind among all the nations that they had not known[a], and the land was left desolate behind them, with no one passing through or returning[b]; thus they made the pleasant land a desolation.
translation:
  language: zh_hans
  text: 我用暴风把他们吹散到他们素不认识的列国中[a]。他们离去后，那地便荒凉了，无人经过，也无人返回；他们就这样使佳美之地[b]成为荒凉之地。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我把他们如旋风般卷到他们素不认识的列国中。”原文动词带有风暴席卷的意象，不只是普通的“分散”。
    reason: lexical_alternative
  - marker: b
    text: “佳美之地”也可译作“可喜爱之地”或“令人向往之地”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵסָעֲרֵם
  choice: 我用暴风把他们吹散
  rationale: סער的加强词干带有鲜明的风暴意象，不只是一般意义上的“分散”。这一译法既保留上帝施行驱散的主动性，也保留原文的气象意象。
- source_word: עַל כָּל הַגּוֹיִם
  choice: 到……列国中
  rationale: 介词עַל在驱散语境中表达分布所到之处；现代汉语用“到……中”自然地表明他们被驱赶到各国之中。
- source_word: אֲשֶׁר לֹא יְדָעוּם
  choice: 他们素不认识的
  rationale: 关系从句修饰“列国”，宾语后缀指向这些国家或民族。“素不认识”简洁表达此前并不熟悉。
- source_word: וְהָאָרֶץ נָשַׁמָּה
  choice: 那地便荒凉了
  rationale: נשׁם表示成为荒凉或遭到荒废；“便荒凉了”自然呈现驱散之后形成的结果状态。
- source_word: אַחֲרֵיהֶם
  choice: 他们离去后
  rationale: 原文可直译为“在他们身后”，在此指他们被驱散以后留下的景象；按现代汉语表达为“他们离去后”更清楚。
- source_word: מֵעֹבֵר וּמִשָּׁב
  choice: 无人经过，也无人返回
  rationale: 两个分词构成成对表达，描写双向人迹断绝。“无人”明确传达介词结构所含的缺失意义，同时保留“经过”与“返回”的对应。
- source_word: וַיָּשִׂימוּ
  choice: 他们就这样使
  rationale: 保留复数主语，把土地荒废的责任归于百姓，同时用“就这样”呈现前文与结果之间的承接关系。
- source_word: אֶרֶץ חֶמְדָּה
  choice: 佳美之地
  rationale: חֶמְדָּה含有令人喜爱、向往或珍视之意。“佳美”在庄重现代汉语中自然，并与下文“荒场”形成鲜明反差。
- source_word: לְשַׁמָּה
  choice: 成为荒场
  rationale: 名词שַׁמָּה表示荒废、毁坏后的状态。“荒场”保留其名词性结果表达，也与“佳美之地”形成修辞对照。
theological_decisions:
- issue: 审判与土地荒凉的施事者
  choice: 首句明确以上帝为驱散百姓的第一人称施事者，末句则保留复数“他们”，表明百姓使土地成为荒场。
  alternative: 将驱散写成无人称或被动事件，或把末句也完全归于上帝。
  rationale: 希伯来文首句的第一人称动词明确指出上帝的行动，末句复数动词又明确指向百姓的责任；译文保留这两方面，不把其中任何一方淡化或合并。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。以“暴风”“吹散”保留原文生动意象；以“佳美之地／荒场”的对照再现原句修辞。句中所有脚注标记均置于其所说明的词语之后。
