id: ZEC.7.12
reference: Zechariah 7:12
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/לִבָּ֞/ם שָׂ֣מוּ שָׁמִ֗יר מִ֠/שְּׁמוֹעַ אֶת הַ/תּוֹרָ֤ה וְ/אֶת הַ/דְּבָרִים֙ אֲשֶׁ֨ר שָׁלַ֜ח יְהוָ֤ה צְבָאוֹת֙ בְּ/רוּח֔/וֹ בְּ/יַ֖ד הַ/נְּבִיאִ֣ים הָ/רִֽאשֹׁנִ֑ים וַֽ/יְהִי֙ קֶ֣צֶף גָּד֔וֹל מֵ/אֵ֖ת יְהוָ֥ה צְבָאֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/007/012.yaml
  text: They made their hearts like diamond-hard stone[a], so as not to hear the law and the words that Yahweh of Armies had sent by his Spirit through the former prophets[c][b]. So great wrath came from Yahweh of Armies.
translation:
  language: zh_hans
  text: 他们使自己的心硬如金刚石[a]，以致不肯听从律法[b]和万军之雅威[c]借着自己的灵、通过从前的先知所传的话。于是，万军之雅威发了大怒。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “金刚石”所译的希伯来词 שָׁמִיר 指一种极其坚硬的物质，传统上也译作“硬石”，可能指“燧石”；具体为何种石质并不确定。
    reason: lexical_alternative
  - marker: b
    text: “律法”也可译作“教诲”。
    reason: lexical_alternative
  - marker: c
    text: “万军之雅威”传统上常译作“万军之耶和华”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִבָּם שָׂמוּ שָׁמִיר
  choice: 他们使自己的心硬如金刚石
  rationale: 保留“心”作为意志和内在态度的中心，并以现代汉语清楚表达 שָׁמִיר 所强调的极端坚硬；具体石质并不确定，故加注说明。
- source_word: מִשְּׁמוֹעַ
  choice: 不肯听从
  rationale: 此处不只是听见声音，而是拒绝听取并顺从；“不肯”也体现其硬心所造成的主动抗拒。
- source_word: הַתּוֹרָה
  choice: 律法
  rationale: 保留该词在圣约和先知语境中的权威性；其较宽泛的“教诲”义在脚注中注明。
- source_word: הַדְּבָרִים
  choice: 所传的话
  rationale: דְּבָרִים 指上帝经先知传达的话语；“所传的话”自然表达 שָׁלַח 与先知媒介之间的关系。
- source_word: יְהוָה צְבָאוֹת
  choice: 万军之雅威
  rationale: “雅威”直接呈现神名；“万军”简洁保留 צְבָאוֹת 所表达的天上与军事众军之主的称号含义。
- source_word: בְּרוּחוֹ
  choice: 借着他的灵
  rationale: 在此语境中，神的灵是他向先知传话的施事媒介；汉语不以大小写预先限定更细的系统神学解释。
- source_word: בְּיַד הַנְּבִיאִים הָרִאשֹׁנִים
  choice: 藉从前的先知
  rationale: “藉”自然转达“借……之手”的媒介含义；“从前的先知”指较早时期的先知，不导入正典分类的专门名称。
- source_word: וַיְהִי קֶצֶף גָּדוֹל מֵאֵת
  choice: 于是，万军之雅威大发烈怒
  rationale: “于是”保留叙事连接及结果意味而不过度强化逻辑推论；汉语以“大发烈怒”自然表达“大怒从……而来”。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较直接反映通常重构的读音，脚注保留中文传统译名。
- issue: רוּחוֹ 是指上帝的灵，还是非人格性的风或动力
  choice: 他的灵
  alternative: 他的气息／他的风
  rationale: 上下文说上帝借此将话语传给先知，“他的灵”最能表达这里的神圣施事作用，同时不加入经文未明说的进一步界定。
- issue: צְבָאוֹת 的表达
  choice: 万军
  alternative: 众军
  rationale: “万军”是现代中文读者可理解且庄重的称号，保留上帝统领众军的含义。
- issue: 拒绝“听”律法是否包含拒绝顺从
  choice: 不肯听从
  alternative: 不肯听
  rationale: 希伯来语“听”在此道德语境中包含听取和服从；“听从”没有消除其听闻层面，又清楚表达百姓的抗拒。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“硬如金刚石”保留先知性比喻的力度；“不肯听从”使希伯来语的拒绝意味在汉语中自然显明；全句避免古奥虚词，但保留“万军之雅威”“烈怒”等经文所需的庄严语域。
