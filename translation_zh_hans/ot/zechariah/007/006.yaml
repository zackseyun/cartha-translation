  verdict: revise
  source_fidelity: 译文准确传达了两组“吃／喝”及反问句，并保留了原文独立人称代词所带的强调。惟“不都是……”较易被理解为对复数事项作总括量化；原文的 הֲלוֹא 更直接地引出“岂不正是你们”的反问。
  naturalness: “你们吃的时候，喝的时候”虽可理解，但在现代汉语中略显顿挫。“你们吃喝的时候”更自然，且不改变其泛指、惯常行为的时间性。
  terminology: “吃”“喝”及“你们自己”的处理恰当；无需引入“为自己”或其他对动机的解释。
  issues:
