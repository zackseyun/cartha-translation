  text: וְ/כִ֥י תֹאכְל֖וּ וְ/כִ֣י תִשְׁתּ֑וּ הֲ/ל֤וֹא אַתֶּם֙ הָ/אֹ֣כְלִ֔ים וְ/אַתֶּ֖ם הַ/שֹּׁתִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/007/006.yaml
  text: And when you eat and when you drink[a], is it not you who are eating, and you who are drinking?
translation:
  language: zh_hans
  text: 你们吃喝的时候，不正是你们自己在吃、自己在喝吗？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכִי תֹאכְלוּ
  choice: 你们吃的时候
  rationale: כִּי 在这里与上一节论禁食的语境相接，可自然理解为时间关系；未完成式表达一般性、惯常性的行为。
- source_word: וְכִי תִשְׁתּוּ
  choice: 喝的时候
  rationale: 重复的 וְכִי 与前半句构成平行；中文省去重复主语仍能保持简洁而清楚的对应结构。
- source_word: הֲלוֹא
  choice: 不……吗
  rationale: 用中文反问句表达原文预期肯定回答的修辞力量。
- source_word: אַתֶּם הָאֹכְלִים
  choice: 你们自己在吃
  rationale: 独立人称代词与带冠词的分词共同形成强调；“你们自己”保留其着重指出行为主体的作用。
- source_word: וְאַתֶּם הַשֹּׁתִים
  choice: 自己在喝
  rationale: 与前一分句保持平行，并以“自己”传达第二个独立人称代词的强调；中文不必机械重复“你们”。
theological_decisions:
- issue: 本节反问在上下文中的指向
  choice: 保留“你们自己”的强调，显明吃喝是为他们自己，却不在正文中进一步解释动机
  alternative: 仅作中性的陈述：“是你们在吃、你们在喝”
  rationale: 原文重复独立代词并使用实体化分词，明显强调行为主体；上下文将其与上一节为自己禁食相并列。不过，译文不额外加入“为自己享受”等原文未明说的内容。
translation_notes:
  register: 采用现代、庄重而自然的普通话。以“不都是……吗”再现反问，以两次“自己”保留希伯来文人称代词的强调和平行，同时避免生硬直译为“岂不是你们是那些吃的人”。
