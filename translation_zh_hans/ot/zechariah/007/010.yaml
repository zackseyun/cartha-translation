  text: וְ/אַלְמָנָ֧ה וְ/יָת֛וֹם גֵּ֥ר וְ/עָנִ֖י אַֽל תַּעֲשֹׁ֑קוּ וְ/רָעַת֙ אִ֣ישׁ אָחִ֔י/ו אַֽל תַּחְשְׁב֖וּ בִּ/לְבַבְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/007/010.yaml
  text: Do not oppress the widow[a], the fatherless, the sojourner, or the poor[c][b], and do not devise evil in your hearts against one another.
translation:
  language: zh_hans
  text: 不可欺压寡妇、孤儿[a]、寄居者[b]和穷人；谁都不可在心里图谋加害别人的恶事。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “孤儿”原文特别可指失去父亲、因而缺乏社会保障的孩子。
    reason: lexical_alternative
  - marker: b
    text: “寄居者”指住在以色列人中间、却不是本地族群成员的外来居民。
    reason: cultural_note
  - marker: c
    text: 直译可作：“你们不可在心里图谋各人弟兄的恶。”这里可指图谋加害弟兄（即同胞或他人）的恶事。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַלְמָנָה
  choice: 寡妇
  rationale: 准确、自然地指丈夫已去世的妇女，也是希伯来圣经中常见的弱势群体用语。
- source_word: יָתוֹם
  choice: 孤儿
  rationale: 现代汉语中最自然的对应词；此词在古代社会法律语境中尤其可指失去父亲、缺乏保障的孩子。
- source_word: גֵּר
  choice: 寄居者
  rationale: 保留其住在以色列群体中、却非本地族群成员的受保护居民身份，避免套用现代移民类别。
- source_word: עָנִי
  choice: 贫穷人
  rationale: 在这一弱势群体并列结构中，经济贫困与社会脆弱性是主要含义。
- source_word: תַּעֲשֹׁקוּ
  choice: 欺压
  rationale: 涵盖对弱势者在经济、法律及社会层面的压迫和剥削，符合现代汉语圣经语体。
- source_word: רָעַת
  choice: 恶事
  rationale: 保留原文的道德分量；结合动词与对象，在句中也包含加害之意。
- source_word: תַּחְשְׁבוּ
  choice: 图谋
  rationale: 上下文并非仅指思想中出现恶念，而是心中盘算、筹划恶事。
- source_word: אִישׁ אָחִיו
  choice: 谁也不可……彼此相害
  rationale: 原文是阳性单数的分配式习语，字面为“各人对自己的弟兄”；汉语用“谁也不可”和“彼此”自然表达群体内部相互关系，同时以脚注保留字面形式。
- source_word: בִּלְבַבְכֶם
  choice: 心里
  rationale: 自然表达希伯来语中作为意念、意图与筹划所在的“心”，而汉语无需机械保留复数形式。
theological_decisions:
- issue: אִישׁ אָחִיו 的性别化分配式表达
  choice: 谁也不可心里图谋恶事，彼此相害
  alternative: 各人不可在心里图谋恶事加害自己的弟兄
  rationale: 原文的阳性形式在这里承担群体伦理中的分配与相互关系功能，并不明确把命令限于男性。正文采用自然的普遍表达，脚注保存较字面的形式和可能的理解。
- issue: “恶事”与受害对象之间的句法关系
  choice: 图谋恶事，彼此相害
  alternative: 图谋恶事攻击自己的弟兄
  rationale: 希伯来语可直译为“不可在你们心里图谋各人弟兄的恶”，其中“恶”可理解为针对他人的恶事或伤害。译文既保留“恶”的道德力度，也清楚表达其针对群体中他人的方向。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“不可”保持先知训诫的正式力度；“欺压”“图谋恶事”传达原文的法律伦理和内在意图。“寄居者”虽略带经文语体，但能准确区别于短暂停留的旅客和现代意义上的一般外国人。
