  to: 不可欺压寡妇、孤儿[a]、寄居者[b]和穷人；谁都不可在心里图谋加害别人的恶事。[c]
  rationale: 修订以“图谋加害别人的恶事”对应原文“在你们心里图谋……恶”，既保留“恶”的道德含义，也避免把其针对他人的方向处理成独立的第二个动作。“穷人”是对 עָנִי 更自然的现代汉语表达。脚注c保留原文分配式构造，并以说明呈现其在汉语中不易直接复制的关系含义。
