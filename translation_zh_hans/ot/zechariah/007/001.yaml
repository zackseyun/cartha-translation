  text: וַֽ/יְהִי֙ בִּ/שְׁנַ֣ת אַרְבַּ֔ע לְ/דָרְיָ֖וֶשׁ הַ/מֶּ֑לֶךְ הָיָ֨ה דְבַר יְהוָ֜ה אֶל זְכַרְיָ֗ה בְּ/אַרְבָּעָ֛ה לַ/חֹ֥דֶשׁ הַ/תְּשִׁעִ֖י בְּ/כִסְלֵֽו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/007/001.yaml
  text: And in the fourth year of King Darius[a], the word of Yahweh came to Zechariah on the fourth day of the ninth month, in Kislev.
translation:
  language: zh_hans
  text: 大流士王第四年九月初四，即基斯流月初四[a]，雅威的话临到撒迦利亚。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “基斯流月”是希伯来历的第九个月。
    reason: 文化背景说明：帮助现代读者识别音译的希伯来月份名称，并与正文中的“基斯流月”准确对应。
lexical_decisions:
- source_word: וַיְהִי
  choice: （融入日期引导句，不单独译出）
  rationale: 该叙事连接形式在此引入新的时间背景。现代汉语直接以日期开篇最自然，也保留了其篇章功能，无须使用“事情发生了”之类生硬措辞。
- source_word: בִּשְׁנַת אַרְבַּע לְדָרְיָוֶשׁ הַמֶּלֶךְ
  choice: 大流士王第四年
  rationale: 这是标准的君王纪年公式；这一译法简洁自然，并准确保留“第四年”的纪年结构。
- source_word: הָיָה דְבַר יְהוָה אֶל זְכַרְיָה
  choice: 雅威的话临到撒迦利亚
  rationale: 希伯来文直译近于“雅威的话到了/向着撒迦利亚而有”，但这是先知书常见的启示公式；“临到”是庄重而清楚的现代汉语表达。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译四字神名，保留经文中的专有神名，而不以“主”这一称号代替。
- source_word: בְּאַרְבָּעָה לַחֹדֶשׁ הַתְּשִׁיעִי
  choice: 九月……初四
  rationale: 原文是“第九月的第四（日）”。汉语日期习惯将月份置前，并用“初四”清楚表达该月第四日。
- source_word: בְּכִסְלֵו
  choice: 就是基斯流月
  rationale: 音译月份名称，并以“就是”说明“九月”与“基斯流月”指同一个月份，避免读者误以为是两个日期。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用以色列上帝的专有名。译作“雅威”旨在保留这一专名的性质；不采用称号“主”，也不在正文中消解为其他表达。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。日期按汉语语序表达；“雅威的话临到”保留先知书启示公式的庄严感。脚注标记置于“基斯流月”之后，使其与注释对象准确对应。
