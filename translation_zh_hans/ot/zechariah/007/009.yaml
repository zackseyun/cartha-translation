base_translation:
  language: en
  yaml_path: translation/ot/zechariah/007/009.yaml
  text: 'Thus says Yahweh of hosts[a], saying: Render true judgments, and show steadfast love and compassion[b], each man to his brother.'
translation:
  language: zh_hans
  text: 万军之耶和华如此说：“你们要施行真实的审判[a]；各人要以忠贞之爱和怜悯对待自己的弟兄[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“要作出真实的判决”。原文把“审判（或公正）”与“真实”连在一起，要求裁断合乎事实、诚实正直。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“各人对自己的弟兄”，是阳性代表式说法，强调共同体成员之间应当这样相待。
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: 如此说
  rationale: 保留先知宣告的固定格式，同时符合现代汉语庄重表达。
- source_word: יְהוָה צְבָאוֹת
  choice: 万军之耶和华
  rationale: 直接音译神名，并以传统且清楚的“万军”表达 צְבָאוֹת 所指的众军或天军。
- source_word: לֵאמֹר
  choice: 以冒号和引号表达
  rationale: 该不定式引出话语内容；汉语用标点比重复“说”更自然，且不损失语义。
- source_word: מִשְׁפַּט אֱמֶת שְׁפֹטוּ
  choice: 要按真实施行审判
  rationale: 保留“审判/裁断”与“真实”两个语义成分，也反映复数命令的群体指向；不把司法含义泛化为笼统的行公义。
- source_word: חֶסֶד
  choice: 忠贞之爱
  rationale: 兼顾 חֶסֶד 的仁爱、忠诚与持久关系内涵，避免仅译“恩慈”而削弱其忠贞色彩。
- source_word: רַחֲמִים
  choice: 怜悯
  rationale: 自然表达由内心体恤而生的慈悲，与 חֶסֶד 并列而不混同。
- source_word: עֲשׂוּ
  choice: 以……相待
  rationale: 与“忠贞之爱和怜悯”搭配时，这是现代汉语对“行/做”的自然语境化表达。
- source_word: אִישׁ אֶת־אָחִיו
  choice: 彼此
  rationale: 该分配式短语字面为“各人对自己的弟兄”，在命令语境中表达群体成员相互相待；正文用“彼此”自然呈现其功能，脚注保存字面亲属称谓。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 采用现代中文读者最熟悉的专名形式，同时明确这是专有神名，而不是以“主”替代。
- issue: מִשְׁפַּט אֱמֶת 的关系
  choice: 按真实施行审判
  alternative: 作出真实的判决
  rationale: 原文可理解为以真实、诚信为特征的审判或裁断；所选译法保留修饰关系的张力，不把它收窄为单次判决。
- issue: אִישׁ אֶת־אָחִיו 的群体范围
  choice: 彼此
  alternative: 各人对自己的弟兄
  rationale: 原文使用阳性代表式及亲属语言，强调共同体成员间的相待；正文自然表达其互惠功能，脚注交代字面形式，而不将其神学范围扩展为原文未明说的所有人。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“万军之耶和华如此说”保留先知宣告语气；命令句直接有力。正文避免生硬重复“说”，以中文引语标点承载 לֵאמֹר。
