  text: וַ/יְהִ֛י דְּבַר יְהוָ֥ה צְבָא֖וֹת אֵלַ֥/י לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/007/004.yaml
  text: Then the word of Yahweh of hosts came to me[a], saying,
translation:
  language: zh_hans
  text: 万军之雅威[a]的话临到我，说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文神名为“YHWH”；“雅威”为其常用音译。
    reason: 说明正文“雅威”所对应的四字神名，并使脚注与正文译名一致。
lexical_decisions:
- source_word: וַיְהִי
  choice: 临到
  rationale: 该叙事性连接形式在先知书公式中引出随后发生的启示；中文以“临到”配合“话”，自然表达事件的推进，无须直译为“事情发生了”。
- source_word: דְּבַר
  choice: 话
  rationale: 在先知启示公式中指上帝传达的话语；保留“话”这一具体而传统的表达，避免用较具解释性的“信息”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 这是四字神名YHWH；以“雅威”音译，保留其作为以色列之神专名的性质，而不以称号替代。
- source_word: צְבָאוֹת
  choice: 万军之
  rationale: 在神圣称号中表示众军、众天军；“万军之雅威”是简洁庄重的中文表达，并保留原文所含统领众军的广阔意象。
- source_word: אֵלַי
  choice: 临到我
  rationale: 介词短语指出先知是神谕的领受者；中文先知书惯用“话临到我”，准确且自然。
- source_word: לֵאמֹר
  choice: 说
  rationale: 该不定式引出下一节的直接引语；译作“说”既贴近原文，也适合现代中文。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名YHWH。译作“雅威”旨在保留专名及其圣约语境，不以“主”这一称号取代；脚注说明其希伯来文形式。
- issue: 称号יְהוָה צְבָאוֹת的理解
  choice: 万军之雅威
  alternative: 万军的雅威；雅威万军之主
  rationale: 采用结构贴近原文的属格式表达，不把“众军”的范围限定为地上的军队，也不额外补入原文没有明说的“主”。
translation_notes:
  register: 采用现代、庄重而简洁的先知书语体。“话临到我”保留希伯来先知启示公式；冒号提示直接引语将在下一节出现。
