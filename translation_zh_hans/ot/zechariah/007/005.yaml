source:
  edition: WLC
  text: אֱמֹר֙ אֶל כָּל עַ֣ם הָ/אָ֔רֶץ וְ/אֶל הַ/כֹּהֲנִ֖ים לֵ/אמֹ֑ר כִּֽי צַמְתֶּ֨ם וְ/סָפ֜וֹד בַּ/חֲמִישִׁ֣י וּ/בַ/שְּׁבִיעִ֗י וְ/זֶה֙ שִׁבְעִ֣ים שָׁנָ֔ה הֲ/צ֥וֹם צַמְתֻּ֖/נִי אָֽנִי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/007/005.yaml
  text: 'Speak to all the people of the land and to the priests[a], saying: When you fasted and mourned in the fifth month and in the seventh, for these seventy years, was it really for me that you fasted?'
translation:
  language: zh_hans
  text: “你要对这地所有的百姓和祭司说：‘这七十年来，你们在五月和七月禁食哀悼，难道你们禁食真是为了我吗？[a]’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文采用强调式结构，并在句末另加独立的“我”，可译作：“你们禁食，真是为了我——为了我——而禁食吗？”
    reason: 说明希伯来文反问中的强调结构及句末独立代词。
lexical_decisions:
- source_word: עַם הָאָרֶץ
  choice: 这地所有的百姓
  rationale: כָּל 表示“所有”；עַם הָאָרֶץ 在本语境中泛指当地居民，并非特指某一社会阶层。
- source_word: הַכֹּהֲנִים
  choice: 祭司
  rationale: כֹּהֵן 的标准对应词，语境中无需变换。
- source_word: צַמְתֶּם
  choice: 你们禁食
  rationale: 直接表达 צום 的 Qal 完成式第二人称阳性复数，指百姓所实行的禁食。
- source_word: וְסָפוֹד
  choice: 哀悼
  rationale: ספד 指哀悼、悲叹，常涉及礼仪性的悲哀；“哀悼”既自然，又不把具体表现说得过满。
- source_word: בַּחֲמִישִׁי וּבַשְּׁבִיעִי
  choice: 在五月和七月
  rationale: 原文以序数词指历法中的第五月和第七月；中文补出“月”以清楚表达。
- source_word: וְזֶה שִׁבְעִים שָׁנָה
  choice: 这七十年来
  rationale: 保留 זֶה 所表达的截至当前的时间跨度，现代中文自然地说“这七十年来”。
- source_word: הֲצוֹם צַמְתֻּנִי
  choice: 难道你们禁食真是为了我吗
  rationale: 不定式绝对形与限定动词连用带有强调作用；疑问词 הֲ 构成反问，“真是”传达其强调语气，后缀所指对象译为“为了我”。
- source_word: אָֽנִי
  choice: 我（以整句重读的“为了我”体现）
  rationale: 句末独立代词进一步强调“我”；正文用“真是为了我”自然传达此重音，脚注说明原文结构。
- source_word: אֱמֹר ... לֵאמֹר
  choice: 你要对……说
  rationale: 这是希伯来语常见的引语引入格式；现代中文无需机械重复两个“说”，以一个“说”即可准确、自然地引出话语。
theological_decisions:
- issue: 关于禁食的反问所针对的是什么
  choice: 质问这些禁食是否真正是为上帝而行
  alternative: 把这句话理解为彻底否定这些禁食本身的效力或真实性
  rationale: 原文承认他们实行了禁食和哀悼，却以强调性的反问追究其指向和动机。译文保留这种张力，不额外作出更广泛的教义判断。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“这地所有的百姓”保留原文的地域表达；“五月和七月”按古代历法理解为第五月和第七月。正文避免生硬复制希伯来语的重复句式，脚注则保留其强调信息。
