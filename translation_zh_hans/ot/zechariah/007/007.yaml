  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: הֲ/ל֣וֹא אֶת הַ/דְּבָרִ֗ים אֲשֶׁ֨ר קָרָ֤א יְהוָה֙ בְּ/יַד֙ הַ/נְּבִיאִ֣ים הָ/רִֽאשֹׁנִ֔ים בִּ/הְי֤וֹת יְרוּשָׁלִַ֨ם֙ יֹשֶׁ֣בֶת וּ/שְׁלֵוָ֔ה וְ/עָרֶ֖י/הָ סְבִיבֹתֶ֑י/הָ וְ/הַ/נֶּ֥גֶב וְ/הַ/שְּׁפֵלָ֖ה יֹשֵֽׁב־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/007/007.yaml
  text: Are these not the words that Yahweh proclaimed by the former prophets[a], when Jerusalem was inhabited and at ease, with her surrounding cities[c][b], and the Negev and the Shephelah were inhabited?
translation:
  language: zh_hans
  text: 难道这不是雅威借先前的众先知[a]所宣告的话吗？那时，耶路撒冷有人居住，安宁无扰[b]；周围的城邑也有人居住，南地和示非拉[c]同样有人居住。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “借先前的众先知”：原文直译为“借先前众先知的手”。“先前”指较早时期，并不一定是指希伯来圣经中称为“前先知书”的类别。
    reason: lexical_alternative
  - marker: b
    text: “安宁无扰”也可译作“安逸稳妥”；原词可包括平静、安全和不受侵扰的意味。
    reason: lexical_alternative
  - marker: c
    text: “示非拉”指犹大西部的低地和丘陵地带。
    reason: cultural_note
lexical_decisions:
- source_word: הֲלוֹא אֶת הַדְּבָרִים
  choice: 难道不正是这些话吗
  rationale: הֲלוֹא引出预期肯定回答的反问；“不正是……吗”在现代汉语中自然地保留这一语用力量。“这些话”承接上下文中已经提及的信息。
- source_word: קָרָא
  choice: 宣告
  rationale: 此处指雅威借先知公开而有权威地传达信息；“宣告”比直译为“呼喊”更符合先知性言说的语境。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以“雅威”音译四字神名，保留原文所使用的专名。
- source_word: בְּיַד הַנְּבִיאִים הָרִאשֹׁנִים
  choice: 借先前的众先知
  rationale: “在……手中”是表示媒介或代理的希伯来语习语；“借”自然传达雅威通过先知发言。הָרִאשֹׁנִים在此表示较早时期的先知，而非特指希伯来圣经中名为“前先知书”的分类。
- source_word: בִּהְיוֹת
  choice: 那时
  rationale: 该结构表达时间背景；拆作下一分句的“那时”可使较长的中文句子清楚流畅。
- source_word: יְרוּשָׁלִַם יֹשֶׁבֶת
  choice: 耶路撒冷有人居住
  rationale: ישׁב用于城市时表示有人定居、居住；此译法自然且避免生硬拟人化。
- source_word: וּשְׁלֵוָה
  choice: 安宁无扰
  rationale: שׁלה兼有安逸、平静、安全而不受侵扰的含义；“安宁无扰”保留其范围，而不把意义限于经济繁荣。
- source_word: וְעָרֶיהָ סְבִיבֹתֶיהָ
  choice: 周围的城邑也有人居住
  rationale: 在中文中不以阴性代词指代耶路撒冷更自然；补出“也有人居住”明确表达原文所描绘的整体状态。
- source_word: וְהַנֶּגֶב
  choice: 南地
  rationale: הַנֶּגֶב在此是犹大南部的地理区域。“南地”既保留地域含义，也比单纯音译更易为普通中文读者理解。
- source_word: וְהַשְּׁפֵלָה
  choice: 示非拉
  rationale: 该词在此是犹大西部低地与丘陵带的专名；采用常见音译，并以脚注说明地理含义。
- source_word: יֹשֵׁב
  choice: 有人居住
  rationale: 阳性单数分词统摄“南地”和“示非拉”两个并列地域，具有集合性；中文以“同样有人居住”自然表达。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较贴近学界通常重构的读音，同时不以称号替代专名。
- issue: 雅威与先知话语的关系
  choice: 雅威曾借先前的众先知宣告
  alternative: 先前的众先知曾宣告
  rationale: 保留原文以雅威为宣告主体、众先知为传达媒介的结构，不削弱神圣发言与人类使者之间的张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。以反问句保留原文修辞力量，并用分号和重复“有人居住”厘清长句结构。地名“南地”意译，“示非拉”音译加注，兼顾可读性与地理准确性。
