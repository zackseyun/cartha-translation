source:
  edition: WLC
  text: וַ/יְמָאֲנ֣וּ לְ/הַקְשִׁ֔יב וַ/יִּתְּנ֥וּ כָתֵ֖ף סֹרָ֑רֶת וְ/אָזְנֵי/הֶ֖ם הִכְבִּ֥ידוּ מִ/שְּׁמֽוֹעַ׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/007/011.yaml
  text: But they refused to pay attention[a], turned a stubborn shoulder[b], and made their ears heavy so as not to hear.
translation:
  language: zh_hans
  text: 他们却不肯留心听从，倔强地转过肩去[a]，又使自己的耳朵发沉[b]，不肯听见。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译近似“给出一个倔强（或悖逆）的肩膀”，是形容顽固抗拒的习语。
    reason: lexical_alternative
  - marker: b
    text: 或译“使自己的耳朵迟钝”或“堵住自己的耳朵”。希伯来文直译为“使自己的耳朵沉重”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמָאֲנוּ לְהַקְשִׁיב
  choice: 不肯留心听从
  rationale: מָאֵן表示有意拒绝或不愿意；הִקְשִׁיב指专心听、留意。“不肯留心听从”既保留主动抗拒的意味，也表明这里不只是听到声音，而是拒绝理会先知的信息。
- source_word: וַיִּתְּנוּ כָתֵף סֹרָרֶת
  choice: 倔强地转过肩去
  rationale: 原文直译近似“给出一个悖逆的肩膀”，是以身体动作描写顽固抗拒的习语。“转过肩去”保留肩膀的意象，同时以现代汉语表达拒绝配合、背转抗命的动作。
- source_word: סֹרָרֶת
  choice: 倔强地
  rationale: 该词表示顽梗、悖逆的抗拒。“倔强”在现代汉语中自然，并在上下文中具有明确的负面道德意味。
- source_word: וְאָזְנֵיהֶם הִכְבִּידוּ
  choice: 使自己的耳朵发沉
  rationale: 原文具体说他们“使耳朵沉重”。译文保留这一身体隐喻，并用“发沉”使表达较为自然；反身性的“自己的”也显明这是他们主动造成的状态。
- source_word: מִשְּׁמוֹעַ
  choice: 不肯听见
  rationale: 介词מִן加不定词在这里表达阻止或避免听见的结果。“不肯听见”与全句所强调的蓄意拒绝相呼应，同时避免将其误解为单纯的生理失聪。
theological_decisions:
- issue: 以肩膀和沉重耳朵描写悖逆的身体隐喻
  choice: 在可读的现代汉语中保留“肩”和“耳朵发沉”的具体意象
  alternative: 他们顽梗悖逆，塞住耳朵不听
  rationale: 原文借身体动作强调百姓主动、顽固地抗拒上帝的话。若完全抽象化为“不顺服”，会削弱先知话语的修辞力度；若直接译成“塞住耳朵”，又会把“使耳朵沉重”的隐喻具体化为原文没有明说的动作。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“不肯”突出有意拒绝；“转过肩去”和“耳朵发沉”保留原文连续的身体意象，并以脚注解释不易直接理解的希伯来习语。脚注标记按其实际所解释的短语放置。
