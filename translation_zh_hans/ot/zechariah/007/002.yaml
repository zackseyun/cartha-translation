base_translation:
  language: en
  yaml_path: translation/ot/zechariah/007/002.yaml
  text: Bethel sent Sharezer and Regem-melech and his men to entreat the favor of Yahweh[b][a],
translation:
  language: zh_hans
  text: 伯特利[b]派了沙利色、利坚米勒和他的人，去恳求雅威施恩[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“去寻求雅威的恩待。”希伯来语习语字面上含有“雅威的面”的说法，意为恳求或寻求他的恩待。
    reason: lexical_alternative
  - marker: b
    text: 希伯来原文作“伯特利”；这里最可能是地名，也有人理解为“神的家”。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: 派了
  rationale: 该叙事动词表示过去发生的差遣行动；“派了”在现代汉语中简洁自然，不另添原文没有的“那时”或“现在”。
- source_word: בֵּית אֵל
  choice: 伯特利
  rationale: 此处最自然地指地名及其居民群体，并在句中作差遣者；采用通行的中文圣经地名译法。
- source_word: שַׂר אֶצֶר
  choice: 沙利色
  rationale: 这是人名，采用通行的中文音译，不按词源意义翻译。
- source_word: רֶגֶם מֶלֶךְ
  choice: 利坚米勒
  rationale: 这里最自然地是复合人名，采用通行中文音译，避免误解为“王的官员”等称号。
- source_word: וַאֲנָשָׁיו
  choice: 和他的人
  rationale: 三单阳性后缀直译为“他”，最自然地回指邻近的男性人物；“他的人”保留原文对这些随行者身份及所指对象的简略表达。
- source_word: לְחַלּוֹת אֶת־פְּנֵי
  choice: 去恳求……施恩
  rationale: 该习语表示恳切求取某人的恩待。“恳求……施恩”既传达祈求意味，也以自然汉语表达原文涉及“面”的惯用说法。
- source_word: יְהוָה
  choice: 雅威
  rationale: 原文使用四字神名，正文采用其现代汉语音译“雅威”，而不以称号代替专名。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用以色列上帝的专名；音译为“雅威”可保留专名性质，不把它改写成称号。
- issue: בֵּית אֵל 的身份
  choice: 把“伯特利”理解为发出使者的地点或群体
  alternative: 译作“上帝的殿”；理解为个人或宗族名称
  rationale: 句法和语境最支持地名用法，但用脚注保留该希伯来形式也可按字面理解为“上帝的家”的信息。
- issue: וַאֲנָשָׁיו 中代词的所指
  choice: 译为“他的人”，不进一步指明“他”是谁
  alternative: 他同行的人；伯特利的人；他们的人
  rationale: 希伯来语后缀是阳性单数，但具体回指可能引起讨论；正文保留单数形式和原文的含混，不擅自明确其人物归属。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“派了”符合叙事语体；“恳求雅威施恩”避免生硬照译“恳求……的面”，同时由脚注保留原文意象。人名、地名采用简体中文圣经传统中较通行的形式。
