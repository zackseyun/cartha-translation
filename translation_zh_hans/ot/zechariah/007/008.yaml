  yaml_path: translation/ot/zechariah/007/008.yaml
  text: And the word of Yahweh came to Zechariah[a], saying,
translation:
  language: zh_hans
  text: 耶和华[a]的话临到撒迦利亚，说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文为神的名字“YHWH”（四字神名）；传统上常译作“耶和华”或“上主”。
    reason: 说明神名的原文形式及常见中文译法。
lexical_decisions:
- source_word: וַיְהִי
  choice: 临到
  rationale: 在先知书固定表达“耶和华的话临到……”中，以“临到”自然传达信息从神而来并到达领受者，无须逐字译成“发生了”。
- source_word: דְּבַר
  choice: 话
  rationale: 在“耶和华的话”这一先知性公式中，“话”既贴近原文，又比“信息”更能保留反复出现的固定表达。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神名音译“耶和华”，并以脚注说明原文为四字神名YHWH。
- source_word: אֶל זְכַרְיָה
  choice: 临到撒迦利亚
  rationale: 希伯来语介词 אֶל 标明神谕的领受者；中文与“临到”搭配即可自然表达方向关系。
- source_word: לֵאמֹר
  choice: 说
  rationale: 该词引出下一节的直接引语；“说：”简洁、正式，并保留句子向后承接的结构。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 原文直接使用四字神名。正文采用中文传统且广为人知的音译“耶和华”，不以称号取代专名；脚注交代原文形式，以保留文本信息。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“耶和华的话临到……”保留先知书惯用公式；冒号表明话语内容将在下一节展开。
