base_translation:
  language: en
  yaml_path: translation/ot/zechariah/007/003.yaml
  text: to say to the priests of the house of Yahweh of Armies[a], and to the prophets, saying, “Should I weep in the fifth month[b], abstaining as I have done for these many years?”
translation:
  language: zh_hans
  text: 对万军之雅威[a]的殿里的祭司，以及对先知说：“我应当在五月哀哭、禁戒[b]，像我这些年来所做的一样吗？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 传统译法作“万军之耶和华”；“万军”也可理解为天上的众军。
    reason: lexical_alternative
  - marker: b
    text: 或译“使自己分别出来”；希伯来语所指的礼仪性禁戒，含义比单纯禁食更广。
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵאמֹר
  choice: 说
  rationale: 此不定式承接上文，表明使团前来所要传达或询问的内容；汉语用“说”自然衔接。
- source_word: אֶל הַכֹּהֲנִים אֲשֶׁר לְבֵית יְהוָה צְבָאוֹת
  choice: 对万军之雅威殿中的祭司
  rationale: 介词结构表明祭司与圣殿的关联；“殿中的祭司”在现代汉语中自然，也不把该短语仅限于偶然所在的位置。
- source_word: יְהוָה צְבָאוֹת
  choice: 万军之雅威
  rationale: “雅威”直接呈现神名；“万军”保留צְבָאוֹת所含的军旅及天上众军之意。
- source_word: הַנְּבִיאִים
  choice: 先知
  rationale: 按其公认职分直译，无须释义性改写。
- source_word: הַאֶבְכֶּה
  choice: 我应当……哀哭……吗
  rationale: 第一人称未完成式在此构成商议性问句，询问是否应继续举行哀悼礼仪。
- source_word: בַּחֹדֶשׁ הַחֲמִשִׁי
  choice: 在五月
  rationale: 保留原文的序数月份表达，不代入原文未写出的后期月份名称。
- source_word: הִנָּזֵר
  choice: 禁戒
  rationale: נזר的尼法勒不定式表示使自己分别出来或实行礼仪性克制；“禁戒”比单译“禁食”更能保留其较宽语义。
- source_word: כַּאֲשֶׁר עָשִׂיתִי זֶה כַּמֶּה שָׁנִים
  choice: 像这些年来所做的一样
  rationale: 自然表达延续多年的惯例，并保留זֶה的指示意味。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；音译“雅威”明确呈现盟约之名，而不以称号替代。
- issue: צְבָאוֹת在神圣称号中的含义
  choice: 万军
  alternative: 万军之主；众军
  rationale: “万军”保留称号的军事及宇宙性张力，又避免把原文扩写成未明说的“主”。
- issue: 哀哭与禁戒的礼仪性质
  choice: 并列译作“哀哭、禁戒”
  alternative: 哀哭禁食
  rationale: 上下文与禁食有关，但הִנָּזֵר本身含义比禁食更宽；译文不将其语义缩窄。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“殿中的祭司”简洁表达祭司与圣殿的隶属或所在关系；问句保留原文的商议语气，不替说话者预断答案。
