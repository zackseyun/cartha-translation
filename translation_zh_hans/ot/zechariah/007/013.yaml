  text: וַ/יְהִ֥י כַ/אֲשֶׁר קָרָ֖א וְ/לֹ֣א שָׁמֵ֑עוּ כֵּ֤ן יִקְרְאוּ֙ וְ/לֹ֣א אֶשְׁמָ֔ע אָמַ֖ר יְהוָ֥ה צְבָאֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/007/013.yaml
  text: And just as he called and they would not listen[a], so they will call and I will not listen, says Yahweh of Armies.
translation:
  language: zh_hans
  text: “正如他呼唤，他们不肯听；照样，他们将呼唤，我也不听。”万军之雅威[a]说。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “万军之雅威”传统译作“万军之耶和华”。
    reason: 提供יהוה צְבָאוֹת这一神圣称号的传统汉语译法。
lexical_decisions:
- source_word: וַיְהִי כַאֲשֶׁר ... כֵּן
  choice: 正如……照样……
  rationale: 保留希伯来文前后呼应的比较结构，同时使现代汉语流畅自然。
- source_word: קָרָא / יִקְרְאוּ
  choice: 呼唤／呼唤
  rationale: 两处采用同一译词，保留原文刻意形成的对称：他曾呼唤，他们不听；他们将呼唤，他也不听。
- source_word: וְלֹא שָׁמֵעוּ
  choice: 他们不肯听
  rationale: שׁמע在此不只是听见声音，而是听从、理会；“不肯听”传达上下文中的执意拒绝。
- source_word: וְלֹא אֶשְׁמָע
  choice: 我也不听
  rationale: 与前句“不肯听”形成报应性的对应；“听”在这里指垂听和回应，而非听觉能力。
- source_word: אָמַר
  choice: 说
  rationale: 简洁自然地表达先知宣告末尾的发言公式，不额外强化为原文未明说的“宣告”。
- source_word: יְהוָה צְבָאוֹת
  choice: 万军之雅威
  rationale: “雅威”音译上帝的专名יהוה；“万军之”沿用清楚而庄重的汉语称号，表达他统领众军的权能。
theological_decisions:
- issue: יהוה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 采用较贴近יהוה通常学术重构读音的现代汉语音译，并以脚注保留读者熟悉的传统译名。
- issue: 前半句第三人称与后半句第一人称的转换
  choice: 保留“他呼唤……我也不听”
  alternative: 统一为“我呼唤……我也不听”
  rationale: 希伯来原文确有第三人称קָרָא转为第一人称אֶשְׁמָע的变化；译文不擅自消除这一人称转换及其修辞张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“正如……照样……”保留原文严整的对应关系；重复“呼唤”和“听”以呈现本节的报应性修辞。
