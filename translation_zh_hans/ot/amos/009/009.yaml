  text: כִּֽי הִנֵּ֤ה אָֽנֹכִי֙ מְצַוֶּ֔ה וַ/הֲנִע֥וֹתִי בְ/כָֽל הַ/גּוֹיִ֖ם אֶת בֵּ֣ית יִשְׂרָאֵ֑ל כַּ/אֲשֶׁ֤ר יִנּ֨וֹעַ֙ בַּ/כְּבָרָ֔ה וְ/לֹֽא יִפּ֥וֹל צְר֖וֹר אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/009/009.yaml
  text: For look, I am commanding, and I will shake the house of Israel among all the nations, as one shakes with a sieve, yet not a pebble will fall to the ground.
translation:
  language: zh_hans
  text: 看哪，我必下令，使以色列家在万国中被筛动，正如人用筛子筛动东西一样；一颗小石子也不会落在地上。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留先知宣告中引人注意、强调即将行动的语气；现代读者能够理解，也符合庄重文体。
- source_word: מְצַוֶּה
  choice: 发令
  rationale: 该分词表示神正在下令、命令某行动发生；“发令”自然凝练，并保留未明说受命者的特点。
- source_word: וַהֲנִעוֹתִי
  choice: 筛
  rationale: 字面核心是使之摇动；结合下句筛具的明喻，此处译作“筛”可在中文中清楚呈现同一动作及其审判意象。
- source_word: בְכָל־הַגּוֹיִם
  choice: 在万国之中
  rationale: 保留介词所表达的范围或所在领域，不具体化为流放到某一地点。
- source_word: כַּאֲשֶׁר יִנּוֹעַ בַּכְּבָרָה
  choice: 就像人用筛子筛一样
  rationale: 希伯来文使用无人称式动作；中文补出泛指的“人”，使比喻自然，同时不指定行动者。
- source_word: צְרוֹר
  choice: 石子
  rationale: 此词在筛分语境中最自然地指小石块或石粒；“石子”准确而通俗。
theological_decisions:
- issue: 筛动中“石子”不落地的含义
  choice: 保留“连一颗石子也不会落在地上”的陈述，不解释石子代表义人、罪人或其他群体
  alternative: 将其释义为义人一个也不会灭亡，或罪人一个也不能逃脱
  rationale: 本节意象本身存在解释张力；译文应保留先知比喻，不把后续经文或特定神学解释直接写入正文。
- issue: 神所发命令的执行者
  choice: 译为“我必发令”，不补出执行者
  alternative: 补作“我必命令列国”或“我必命令筛子”
  rationale: 原文没有明说命令的对象；不补足可避免无根据地消除歧义。
translation_notes:
  register: 采用现代、庄重而易懂的先知宣告语体。“看哪”保留原文强调语气；“筛在万国之中”维持筛分意象及地理范围。正文不加脚注，因为关键歧义可由较为直译的表达直接保留。
