review_pass:
  verdict: revise
  source_fidelity: 草案准确保留了神的命令、以色列家在万国中的处境、筛子的比喻及“一颗石子也不会落地”的限定。不过，וַהֲנִעוֹתִי 的基本动作是“使……摇动／筛动”，而非直接“筛出”；“把以色列家筛在万国之中”既弱化了该动词的摇动意义，也使中文搭配不自然。
  naturalness: “把……筛在万国之中”在现代汉语中不够通顺；改为“使以色列家在万国中被筛动”可保留原文的被动性、动作性和比喻，同时保持庄重的先知性语体。
  terminology: “看哪”“下令”“以色列家”“万国”“筛子”和“石子”均适切。“小石子”比“石子”更明确对应筛分语境下的 צְרוֹר，且不改变其未加解释的比喻意义。
  issues:
  - severity: medium
    issue: “筛在万国之中”未充分表达“使……摇动／筛动”，且中文动宾搭配生硬。
    rationale: וַהֲנִעוֹתִי 表示使以色列家摇动；下半节以筛子中的筛动说明该动作。译文宜将“在万国中”连接于以色列家被筛动的处境，而不把“万国”误作“筛”的直接结果或容器。
  - severity: low
    issue: “就像人用筛子筛一样”重复“筛”但动作指向略不明确。
    rationale: 改作“正如人用筛子筛动东西一样”能更自然地呈现比较句；“人”和“东西”均为汉语表达无人称筛动所作的泛指补足，不指定执行者或被筛之物。
  revised_text: 看哪，我必下令，使以色列家在万国中被筛动，正如人用筛子筛动东西一样；一颗小石子也不会落在地上。
