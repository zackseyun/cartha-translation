  text: so that they may possess the remnant of Edom and all the nations who are called by my name,” declares Yahweh[b][a], who does this.
translation:
  language: zh_hans
  text: 为要使他们占有以东的余民，以及所有称为我名下的列国[a]。”这是行这事的耶和华说的。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译为“我的名被称在他们之上的”。这个希伯来惯用语表示他们属于耶和华，或为他所认领。
    reason: lexical_alternative
  - marker: b
    text: 《使徒行传》15:17所引用的本节希腊文本与这里的希伯来文本有明显差异，大意是：“使余下的人，就是所有称为我名下的列国，都寻求主。”
    reason: textual_variant
lexical_decisions:
- source_word: לְמַעַן
  choice: 好让
  rationale: 表达承接上文复兴应许的目的或结果；现代汉语自然，同时保留目的意味。
- source_word: יִירְשׁוּ
  choice: 拥有
  rationale: ירשׁ可指取得并持有土地或群体；此处宾语为以东余民和列国，“拥有”比单纯“继承”更贴合，同时不消除其承受产业及征服语感。
- source_word: שְׁאֵרִית אֱדוֹם
  choice: 以东的余民
  rationale: “余民”保留先知文学中经历审判后所剩之人的重要意涵；“以东”为标准地名译法。
- source_word: וְכָל הַגּוֹיִם
  choice: 以及所有……列国
  rationale: גּוֹיִם在此泛指以色列以外的各民族或国家；“列国”符合旧约先知文体，且避免预先套入后世术语。
- source_word: אֲשֶׁר נִקְרָא שְׁמִי עֲלֵיהֶם
  choice: 称为我名下的
  rationale: 以自然汉语表达“我的名被称在他们之上”这一归属惯用语，保留他们属于耶和华或为他所认领的含义；较直译形式置于脚注。
- source_word: נְאֻם יְהוָה
  choice: 这是……耶和华所宣告的
  rationale: 清楚表达先知宣告公式，并按原文使用神的专名“耶和华”。
- source_word: עֹשֶׂה זֹּאת
  choice: 施行此事的
  rationale: 分词指明耶和华是成就这项应许的行动者；“施行”庄重自然，又不强行限定为现在或将来时。
theological_decisions:
- issue: 复兴神谕中以色列与以东及列国的关系
  choice: 按马所拉文本保留“拥有以东的余民……列国”的直接措辞。
  alternative: 依据《使徒行传》15:17所引希腊文本译作“使余下的人寻求主”等包容性措辞。
  rationale: WLC所代表的希伯来文本明确使用“拥有”以及“以东的余民”。正文应首先反映该文本，不将希腊传统的不同读法倒入正文；文本传统之间的张力以脚注说明。
- issue: 列国与神之名的关系
  choice: 译为“称为我名下的”，表达归属或被认领。
  alternative: 直译为“我的名被称在他们之上的”。
  rationale: 该希伯来惯用语可表示归属于耶和华；正文采用可懂的现代汉语，脚注保留字面结构，避免过度阐释这种归属的具体性质。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“余民”“列国”保留先知文学语域；“耶和华”用于יהוה。脚注标记均在正文出现，并按其所解释内容安放：词语说明紧接相关短语，文本异文置于整节之后。
