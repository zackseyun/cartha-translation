source:
  edition: WLC
  text: רָאִ֨יתִי אֶת אֲדֹנָ֜/י נִצָּ֣ב עַֽל הַ/מִּזְבֵּ֗חַ וַ/יֹּאמֶר֩ הַ֨ךְ הַ/כַּפְתּ֜וֹר וְ/יִרְעֲשׁ֣וּ הַ/סִּפִּ֗ים וּ/בְצַ֨עַ/ם֙ בְּ/רֹ֣אשׁ כֻּלָּ֔/ם וְ/אַחֲרִיתָ֖/ם בַּ/חֶ֣רֶב אֶהֱרֹ֑ג לֹֽא יָנ֤וּס לָ/הֶם֙ נָ֔ס וְ/לֹֽא יִמָּלֵ֥ט לָ/הֶ֖ם פָּלִֽיט־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/009/001.yaml
  text: 'I saw the Lord standing beside the altar[a], and he said: Strike the capital, so that the thresholds may shake; shatter them on the heads of all of them. And I will kill their survivors with the sword; not one who flees among them will get away[d][c][b], and not one who escapes among them will be delivered.'
translation:
  language: zh_hans
  text: '我看见主站在祭坛上[a]。他说：


    “击打柱顶[b]，


    使门槛震动；


    把它们砸在众人头上[c]。


    他们中剩下的人[d]，我要用刀杀死；


    他们中逃跑的，无一能逃脱；


    他们中逃脱的，无一能获救。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“站在祭坛旁。”希伯来介词通常可译为“在……上”；按场景也可能理解为站在祭坛旁、准备施行审判。
    reason: lexical_alternative
  - marker: b
    text: “柱顶”也可译作“柱头”或“顶端饰件”；希伯来词在这里指建筑物顶部的构件。
    reason: lexical_alternative
  - marker: c
    text: 希伯来原文较难，较直译为：“把它们砍断（或砸碎）在众人的头上。”所描绘的可能是建筑构件碎裂，并砸落在其中众人头上的景象。
    reason: textual_difficulty
  - marker: d
    text: 也可译：“他们的余民。”这里按上下文指最初毁灭后仍活着的人，并不含蒙保全的意思。
    reason: alternative_reading
lexical_decisions:
- source_word: אֲדֹנָי
  choice: 主
  rationale: 这是神圣主权的称号，并非四字神名；“主”既符合现代中文圣经语体，也保留其作为审判者的权威。
- source_word: נִצָּב עַל הַמִּזְבֵּחַ
  choice: 站在祭坛旁
  rationale: נִצָּב表示站立或就位；עַל在此可表示在上面或临近。“祭坛旁”较自然地呈现准备施行审判的场景，同时以脚注保留“祭坛上”的可能。
- source_word: הַךְ הַכַּפְתּוֹר
  choice: 击打柱顶
  rationale: הַךְ是强有力的命令；כַּפְתּוֹר在此最可能指建筑顶部的构件。“柱顶”比专业性较强的“柱头”更易懂，且保持建筑意象。
- source_word: הַסִּפִּים
  choice: 门槛
  rationale: 该词可指门槛、门框底部或相关入口构件；“门槛”是其常见而具体的中文表达。
- source_word: וּבְצַעַם בְּרֹאשׁ כֻּלָּם
  choice: 把它们砸碎，落在众人头上
  rationale: 原文句法和动词含义困难；按建筑倒塌的语境，以“砸碎”表达破裂，并补出碎裂构件落到众人头上的隐含关系，同时用脚注提示原文的直译形态。
- source_word: וְאַחֲרִיתָם
  choice: 他们中剩下的人
  rationale: 在全面审判的语境中指初次毁灭后仍存活的人；此译法避免把“余民”可能带有的盼望意味带入本句。
- source_word: בַּחֶרֶב אֶהֱרֹג
  choice: 我要用刀杀死
  rationale: 直接保留第一人称的神圣审判宣告；“刀”可自然表示战争兵器与暴力死亡。
- source_word: לֹא יָנוּס לָהֶם נָס
  choice: 他们中逃跑的，无一能逃脱
  rationale: 希伯来文以同根词强化“逃跑却不能逃脱”；中文以重复相关词义和“无一”传达强调。
- source_word: וְלֹא יִמָּלֵט לָהֶם פָּלִיט
  choice: 他们中躲避的，无一能获救
  rationale: 与前句平行，又避免中文完全重复；“获救”保留מלט所含的脱险、得以保全之意。
theological_decisions:
- issue: 异象中的神圣称号
  choice: 主
  alternative: 主人／主宰
  rationale: אֲדֹנָי是对神的主权称号，而不是四字神名。“主”准确、庄重且不引入额外的宗派含义。
- issue: 审判后“剩下的人”的含义
  choice: 他们中剩下的人
  alternative: 他们的余民
  rationale: 本节宣告无人逃脱，故这里不是带有救赎盼望的“余民”概念，而是指建筑倒塌后尚存活、继而遭刀杀的人。
translation_notes:
  register: 采用现代、庄重而清晰的先知性诗体。保留短行和命令—结果—全面审判的推进；避免古雅的“击杀、刀剑、逃遁”等词，也避免把困难的建筑术语解释得过度确定。所有脚注标记均置于对应正文之后。
