  terminology: “主”“祭坛”“柱顶”“门槛”均合适。“用刀”忠实且符合现代中文圣经语体。保留“剩下的人”并以脚注说明，不把此处审判语境中的 אַחֲרִיתָם预设为蒙保全的“余民”。
