revisions:
- from: 主耶和华—万军之主[a]触摸大地，大地就消融；地上所有居民都悲哀。大地全都像尼罗河一样涨起，又像埃及的尼罗河一样沉下去。
  to: 主、万军的耶和华[a]触摸大地，大地就消融；其中所有居民都哀恸。整片大地都像尼罗河涨起，又像埃及的尼罗河沉下去。
  rationale: 修订复合神圣称号的结构和标点，使其在中文中可直接作全句主语，并以“哀恸”准确表达“哀悼”。同时将“大地全都”调整为更自然的“整片大地都”，其余保留原有的先知性涨落图像、神名译法和术语。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T08:16:24Z'
