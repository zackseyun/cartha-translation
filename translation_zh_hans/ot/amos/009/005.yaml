language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/אדֹנָ֨/י יְהוִ֜ה הַ/צְּבָא֗וֹת הַ/נּוֹגֵ֤עַ בָּ/אָ֨רֶץ֙ וַ/תָּמ֔וֹג וְ/אָבְל֖וּ כָּל י֣וֹשְׁבֵי בָ֑/הּ וְ/עָלְתָ֤ה כַ/יְאֹר֙ כֻּלָּ֔/הּ וְ/שָׁקְעָ֖ה כִּ/יאֹ֥ר מִצְרָֽיִם־
base_translation:
  language: en
  yaml_path: translation/ot/amos/009/005.yaml
  text: And the Lord GOD of hosts is the one who touches the earth[a], and it melts, and all who dwell in it mourn; and all of it rises like the Nile and sinks like the Nile of Egypt.
translation:
  language: zh_hans
  text: 主、万军的耶和华[a]触摸大地，大地就消融；其中所有居民都哀恸。整片大地都像尼罗河涨起，又像埃及的尼罗河沉下去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来原文直译为“主、耶和华、万军（之主）”；“耶和华”代表希伯来文神名 YHWH。
    reason: 说明复合神圣称号的原文结构及神名的译法。
lexical_decisions:
- source_word: וַאדֹנָי יְהוִה
  choice: 主耶和华
  rationale: 这是אֲדֹנָי与神名YHWH组成的复合称号。“主耶和华”既保留“主”的称谓，也以现代中文圣经读者熟悉的形式呈现神名。
- source_word: הַצְּבָאוֹת
  choice: 万军之主
  rationale: 该称号表达上帝统管天上和地上一切军旅与众军。“万军”保留其广泛而庄严的意涵，不把所指限定为人间军队。
- source_word: הַנּוֹגֵעַ
  choice: 触摸
  rationale: 分词描写上帝具有持续性的行动特征；采用基本词义“触摸”，让后文自行呈现其毁灭性的结果，不提前强化为“击打”。
- source_word: בָּאָרֶץ
  choice: 大地
  rationale: אֶרֶץ既可指“土地”也可指“大地”。本节具有宇宙性神显意象，并提到其上一切居民，因此“大地”更符合语境。
- source_word: וַתָּמוֹג
  choice: 消融
  rationale: מוּג可表示融化、瓦解或因震惧而崩溃。“消融”保留先知文学中鲜明的融化意象，又比单说“融化”更适合描写大地。
- source_word: וְאָבְלוּ
  choice: 悲哀
  rationale: אבל表示因灾祸而哀伤、哀悼。“悲哀”自然庄重，不额外加强为号啕或哀号。
- source_word: כָּל יֹשְׁבֵי בָהּ
  choice: 地上所有居民
  rationale: 简明呈现“所有住在其中的人”，并清楚交代代词所指，符合现代中文表达。
- source_word: וְעָלְתָה כַיְאֹר כֻּלָּהּ
  choice: 大地全都像尼罗河一样涨起
  rationale: 阴性单数动词和后缀回指大地；“全都”对应כֻּלָּהּ。“尼罗河”明确呈现יְאֹר在此处的特定所指及其涨水意象。
- source_word: וְשָׁקְעָה
  choice: 沉下去
  rationale: שׁקע表示下沉或回落。“沉下去”保留与大地起伏相配的强烈图像，同时不把含义收窄为河水单纯退去。
- source_word: כִּיאֹר מִצְרָיִם
  choice: 像埃及的尼罗河一样
  rationale: 明确指出这里比较的是埃及的尼罗河，使现代读者不至于把יְאֹר理解为泛指河流。
theological_decisions:
- issue: 神名YHWH的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名YHWH。“耶和华”是现代中文圣经语境中广为人知且庄重的神名形式；脚注说明原文构造，避免将复合称号误解为两个不同对象。
- issue: הַצְּבָאוֹת所指范围
  choice: 万军之主
  alternative: 众军之神／天军之主
  rationale: “万军之主”保留称号对天上、地上一切力量的统管意味，不将“众军”仅限定为天使或人类军队。
translation_notes:
  register: 采用现代、庄重而清楚的普通话书面语。保留原文连续动作和大地如尼罗河涨落的先知性图像；以分号区分触地消融与大地起伏两个紧密相连的画面。
