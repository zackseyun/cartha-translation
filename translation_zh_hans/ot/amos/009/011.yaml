    issue: “扶起它的废墟”不符合现代汉语常用搭配。
    rationale: 原文‘我将使它的毁坏处／废墟立起’本身带有强烈而略显突兀的修复意象；中文仍应避免将‘扶起’直接施于‘废墟’所造成的语义不通。改作‘使它的废墟重新立起’可保留原文的‘立起’动词意象和与前文重复的效果。
  - severity: low
