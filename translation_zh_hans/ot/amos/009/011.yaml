id: AMO.9.11
reference: Amos 9:11
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: בַּ/יּ֣וֹם הַ/ה֔וּא אָקִ֛ים אֶת סֻכַּ֥ת דָּוִ֖יד הַ/נֹּפֶ֑לֶת וְ/גָדַרְתִּ֣י אֶת פִּרְצֵי/הֶ֗ן וַ/הֲרִֽסֹתָי/ו֙ אָקִ֔ים וּ/בְנִיתִ֖י/הָ כִּ/ימֵ֥י עוֹלָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/009/011.yaml
  text: In that day I will raise up the fallen shelter of David[a], and I will wall up its breaches[c][b], and I will raise up its ruins and rebuild it as in the days of old.
translation:
  language: zh_hans
  text: “到那日，我必使大卫倒塌的棚屋重新立起[a]；我要堵住其中的破口[b]，使它的废墟重新立起，并照古时的样子重建它[c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “棚屋”也可译作“棚子”；传统上常译“帐幕”。希伯来语所描绘的是临时搭建的遮蔽处，在这里用来比喻倾颓的大卫家或大卫王朝。
    reason: lexical_alternative
  - marker: b
    text: “堵住其中的破口”也可译作“封住它的缺口”或“修补它的裂口”。
    reason: lexical_alternative
  - marker: c
    text: “古时”指从前的日子或久远的年代，不一定表示抽象意义上的永恒。
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: 到那日
  rationale: 保留先知书中常见的时间公式，现代汉语自然简洁，又不具体限定所指的时间。
- source_word: אָקִים
  choice: 使……重新立起／扶起
  rationale: קום的使役形有“使站立、扶起、建立”之意。译文在首处用“使……重新立起”，后处随“废墟”调整为“扶起”，保留复兴倒塌之物的具体意象，同时避免生硬重复。
- source_word: סֻכַּת דָּוִיד
  choice: 大卫的棚屋
  rationale: סֻכָּה指棚子、棚屋或临时遮蔽处。“棚屋”既保留其脆弱、简陋的具体形象，又不把隐喻直接解释成“大卫王朝”，也避免“帐幕”可能带来的礼仪性联想。
- source_word: הַנֹּפֶלֶת
  choice: 倒塌的
  rationale: 该分词可表示“正在倒下”或“处于倒塌状态”。在修复语境中，“倒塌的”最符合自然汉语，并保留其状态含义。
- source_word: וְגָדַרְתִּי
  choice: 我要堵住
  rationale: גדר本义涉及筑墙、围住；与“破口”连用时，“堵住”自然地表达封补缺口，同时保留建筑修复图景。
- source_word: פִּרְצֵיהֶן
  choice: 其中的破口
  rationale: פֶּרֶץ指裂口、缺口或城墙破口。希伯来语后缀在形态上为阴性复数，与近处名词的对应并不规整；“其中的”既表达归属，又不强行消除原文的指代张力。
- source_word: וַהֲרִסֹתָיו
  choice: 它的废墟
  rationale: הֲרִיסָה可指被拆毁之处或废墟。“废墟”简洁、现代，并维持倒塌后重建的建筑意象。
- source_word: וּבְנִיתִיהָ
  choice: 把它重建
  rationale: בנה本为“建造”，但上下文明确是倒塌后的恢复，故译为“重建”更符合现代汉语。代词仍指向棚屋意象，不将其明说为王朝或国家。
- source_word: כִּימֵי עוֹלָם
  choice: 像古时一样
  rationale: 此处עוֹלָם表示久远的过去、古时，并非抽象意义上的永恒。“像古时一样”保留向昔日状态恢复的比较。
theological_decisions:
- issue: “大卫的棚屋”所指为何
  choice: 保留“大卫的棚屋”这一具体隐喻，让经文本身暗示大卫家或大卫王权在倾颓后得到恢复
  alternative: 直接译为“大卫家／大卫王朝”，或理解为与大卫有关的实体礼仪帐幕
  rationale: 原文特意采用סֻכָּה这一脆弱棚屋的形象。直保隐喻可以呈现其大卫王权含义，却不把可能的历史、王朝或弥赛亚层面提前固定为某一种教义解释。
- issue: 倒塌状态的时间意味
  choice: 译为“倒塌的”
  alternative: 译为“正在倒下的”
  rationale: 分词本身容许过程或状态的色彩；修复语境较自然地指已经倾颓的状态，但译文不额外界定其历史应验时间。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“棚屋”保留原文简陋而脆弱的形象；分号划分连续修复动作，保持先知宣告的节奏。所有代词与建筑措辞均尽量保留原文隐喻，不在正文中将其释义化为特定王朝论或教会论。
