  to: “到那日，我必使大卫倒塌的棚屋重新立起[a]；我要堵住其中的破口[b]，使它的废墟重新立起，并照古时的样子重建它[c]。”
  rationale: 修订仅解决“扶起废墟”的现代汉语搭配问题，并澄清末句比较结构。译文继续逐项保留原文的建筑隐喻、重复的‘立起’动作和未明确化的指代；脚注标记及其所附信息均完整保留。
