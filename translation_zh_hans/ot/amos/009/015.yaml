  text: וּ/נְטַעְתִּ֖י/ם עַל אַדְמָתָ֑/ם וְ/לֹ֨א יִנָּתְשׁ֜וּ ע֗וֹד מֵ/עַ֤ל אַדְמָתָ/ם֙ אֲשֶׁ֣ר נָתַ֣תִּי לָ/הֶ֔ם אָמַ֖ר יְהוָ֥ה אֱלֹהֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/009/015.yaml
  text: I will plant them on their land[a], and they will never again be uprooted from the land that I have given them, says Yahweh your God.
translation:
  language: zh_hans
  text: “我要把他们栽种在他们的土地上；他们再也不会从我赐给他们的土地上被拔出来。”雅威——你的上帝[a]——说。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来原文是单数的“你的上帝”。这可能是把以色列全体当作一个整体来称呼；也有人按上下文较顺地理解为“他们的上帝”。
    reason: 说明原文在上下文复数代词之间突然转为第二人称单数，并保留一种常见的顺译理解。
lexical_decisions:
- source_word: וּנְטַעְתִּים
  choice: 我要把他们栽种
  rationale: נָטַע的本义是“栽种”。这里延续土地与复兴的意象，不宜淡化为单纯的“安置”；“栽种”也与下文“拔出来”形成鲜明呼应。
- source_word: עַל אַדְמָתָם
  choice: 在自己的土地上
  rationale: אֲדָמָה可指土壤、地面或土地；在复兴和归回的语境中译作“土地”最自然。“自己的”清楚表达第三人称复数所有格，又符合现代汉语习惯。
- source_word: וְלֹא יִנָּתְשׁוּ עוֹד
  choice: 他们再也不会……被拔出来
  rationale: נָתַשׁ的Nifal形表示“被拔除、被扯出”。“被拔出来”保留与“栽种”相连的植物隐喻，也表达不再被强行逐离土地。
- source_word: מֵעַל אַדְמָתָם
  choice: 从……土地上
  rationale: מֵעַל直译为“从……上面”，现代汉语以“从……土地上”表达最为自然，并保留原文重复“土地”的强调。
- source_word: אֲשֶׁר נָתַתִּי לָהֶם
  choice: 我赐给他们的
  rationale: 完成式נָתַתִּי在此陈述上帝已经作出的赐予。“赐给”符合施予者为上帝的语境，并保留关系从句的修饰结构。
- source_word: אָמַר יְהוָה
  choice: 这是雅威……说的
  rationale: 这是先知话语中常见的神谕结语。汉语用“这是……说的”自然地呈现其宣告功能；יְהוָה按其专名音译为“雅威”。
- source_word: אֱלֹהֶיךָ
  choice: 你的上帝
  rationale: 马所拉文本的后缀为第二人称阳性单数，直译为“你的上帝”。虽然上下文所指群体使用复数形式，正文仍保留这个单数称呼。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。译作“雅威”以专名形式呈现该名，不以称号“主”替代，也不采用后起的混合读音“耶和华”。
- issue: אֱלֹהֶיךָ的人称与数
  choice: 你的上帝
  alternative: 他们的上帝
  rationale: 希伯来文本明确使用第二人称阳性单数后缀。它可理解为对以色列这一整体的直接称呼；尽管“他们的上帝”与前面的复数代词衔接更平顺，正文不据此改写原文，另在脚注说明。
- issue: 应许中“不再被拔出”的绝对措辞
  choice: 再也不会……被拔出来
  alternative: 不再……被拔出来
  rationale: לֹא与עוֹד共同表达强烈的“不再”之意。译文保留这种绝对性的应许，不额外限定其时间或实现方式。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“栽种／拔出来”保留原文贯穿全句的土地与植物意象；分号呈现应许的两部分，破折号突出“你的上帝”这一带有人称转换的同位语。
