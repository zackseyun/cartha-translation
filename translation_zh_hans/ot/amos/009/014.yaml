  text: וְ/שַׁבְתִּי֮ אֶת שְׁב֣וּת עַמִּ֣/י יִשְׂרָאֵל֒ וּ/בָנ֞וּ עָרִ֤ים נְשַׁמּוֹת֙ וְ/יָשָׁ֔בוּ וְ/נָטְע֣וּ כְרָמִ֔ים וְ/שָׁת֖וּ אֶת יֵינָ֑/ם וְ/עָשׂ֣וּ גַנּ֔וֹת וְ/אָכְל֖וּ אֶת פְּרִי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/009/014.yaml
  text: I will restore the fortunes of my people Israel[a], and they will rebuild ruined cities and inhabit them; they will plant vineyards and drink their wine; they will make gardens and eat their fruit.
translation:
  language: zh_hans
  text: 我要扭转我子民以色列的境况[a]；他们要重建荒废的城邑，住在其中；栽种葡萄园，喝其中所产的酒；开辟园子，吃其中的果实。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我要使我子民以色列被掳的人归回。”也可译：“我要恢复我子民以色列被掳的境况。”这个希伯来语复兴用语既可指被掳者归回，也可泛指困境得到扭转。
    reason: 保留希伯来语固定用语在具体归回与广义复兴之间的语义幅度。
lexical_decisions:
- source_word: וְשַׁבְתִּי אֶת שְׁבוּת
  choice: 我要使……恢复原状
  rationale: 这是一个表示复兴的固定搭配，既可指被掳者归回，也可泛指困境得到扭转。正文采用自然、宽泛的“恢复原状”，并在脚注保留被掳归回的含义。
- source_word: עַמִּי יִשְׂרָאֵל
  choice: 我的子民以色列
  rationale: 保留立约关系中的“我的子民”以及“以色列”这一同位称谓；“子民”在现代中文中庄重而易懂。
- source_word: וּבָנוּ עָרִים נְשַׁמּוֹת
  choice: 他们要重建荒废的城邑
  rationale: 动词本义为“建造”，但与已经荒废的城邑搭配时，“重建”自然体现复兴语境；“荒废”准确传达 נְשַׁמּוֹת。
- source_word: וְיָשָׁבוּ
  choice: 住在其中
  rationale: ישׁב 在此表示居住；“其中”明确回指城邑，表达自然。
- source_word: וְנָטְעוּ כְרָמִים
  choice: 栽种葡萄园
  rationale: 直接呈现农业复兴的图景，符合现代汉语搭配。
- source_word: וְשָׁתוּ אֶת יֵינָם
  choice: 喝园中所产的酒
  rationale: 代词后缀回指葡萄园。中文若直译为“喝它们的酒”不自然，故明确为葡萄园所产的酒，同时不增添新的意义。
- source_word: וְעָשׂוּ גַנּוֹת
  choice: 开辟果园
  rationale: עשה 字面为“做、建成”；与园圃搭配时，“开辟”是自然中文。根据下一句的“果子”，译作“果园”比泛称“园子”更连贯。
- source_word: וְאָכְלוּ אֶת פְּרִיהֶם
  choice: 吃园中的果子
  rationale: 后缀回指所开辟的园子；“果子”直接对应 פְּרִי，并保留其可泛指园中出产的语义。
theological_decisions:
- issue: 复兴公式 שׁוּב שְׁבוּת 的译法
  choice: 使……恢复原状
  alternative: 使……被掳的人归回／扭转……被掳的境况
  rationale: 该短语既可能唤起从被掳之地归回的具体图景，也可表示整体困境的逆转。下文涉及城邑、葡萄园和果园的全面复兴，因此正文采用较宽泛的译法，同时用脚注保留另一层可能含义，避免消解原文张力。
translation_notes:
  register: 采用现代、庄重而通俗的书面语。分号保留原句并列推进的节奏；“城邑”较“城市”更适合古代语境，但仍为普通读者熟悉。
