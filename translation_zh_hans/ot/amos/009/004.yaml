  naturalness: “在仇敌面前被掳而去”“命令刀剑杀戮他们”“定睛在他们身上”均属可接受的庄重书面语。将首句改为“如果他们在仇敌面前被掳去”，并将末句改为“降灾给他们，不降福给他们”，更自然、明晰，同时保持原文意象。
  terminology: “仇敌”“被掳”“刀剑”“定睛”“降灾”“降福”均适合先知书的现代庄重语体。“降灾”恰当表达 רָעָה 在此的灾祸性审判，而非道德意义的邪恶。
