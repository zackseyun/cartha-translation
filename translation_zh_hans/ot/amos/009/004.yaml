revisions:
- from: 即使他们在仇敌面前被掳而去，我也要从那里命令刀剑杀戮他们；我要定睛在他们身上，是要降灾，而不是赐福。[a]
  to: 如果他们在仇敌面前被掳去，我必从那里命令刀剑杀死他们；我必定睛在他们身上，降灾给他们，不降福给他们。[a]
  rationale: 修订“即使”为“如果”，以保留原文条件连接词的基本语义，避免把语境中的强调预先限定为让步结构；同时调整末句，使灾祸和福祉明确指向“他们”。“从那里”“命令刀剑”“定睛”等原文意象均予保留。
