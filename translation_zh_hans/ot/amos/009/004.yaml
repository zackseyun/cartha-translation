base_translation:
  language: en
  yaml_path: translation/ot/amos/009/004.yaml
  text: And if they go into captivity before their enemies[a], from there I will command the sword, and it will kill them; and I will set my eyes on them for harm and not for good.
translation:
  language: zh_hans
  text: 如果他们在仇敌面前被掳去，我必从那里命令刀剑杀死他们；我必定睛在他们身上，降灾给他们，不降福给他们。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “降灾”也可译作“加害”或“降祸”。这里的希伯来语指灾祸或带来伤害的审判，并不是指道德上的邪恶。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: 即使
  rationale: 承接上文一连串无法逃脱的审判情形；在汉语中用“即使”能自然表达让步性的条件语气。
- source_word: יֵלְכוּ בַשְּׁבִי
  choice: 被掳而去
  rationale: הלך本义为“去”，与שבי连用表示进入被掳状态。“被掳而去”既保留移动含义，也自然表达俘虏处境。
- source_word: לִפְנֵי אֹיְבֵיהֶם
  choice: 在仇敌面前
  rationale: 保留“在……面前”的希伯来语意象，表示他们当着仇敌、落在仇敌权下被掳。
- source_word: מִשָּׁם
  choice: 从那里
  rationale: 直接保留地点指示，强调即便到了被掳之地，他们仍不能躲过审判。
- source_word: אֲצַוֶּה אֶת־הַחֶרֶב וַהֲרָגָתַם
  choice: 命令刀剑杀戮他们
  rationale: 保留把刀剑人格化为奉命执行审判者的生动表达；“杀戮”符合庄重语体。
- source_word: וְשַׂמְתִּי עֵינִי עֲלֵיהֶם
  choice: 我要定睛在他们身上
  rationale: 保留神将目光指向他们的原文隐喻，并由下文说明这种关注是为了审判而非福祉。
- source_word: לְרָעָה וְלֹא לְטוֹבָה
  choice: 是要降灾，而不是赐福
  rationale: רָעָה在此指灾祸或有害的审判，并非道德邪恶；“降灾”与神的行动相合，“赐福”则自然传达טוֹבָה在此处的正面结果。
theological_decisions:
- issue: 如何表达神所施行的רָעָה
  choice: 降灾
  alternative: 加害／降祸／作恶
  rationale: 上下文所说的是审判性的灾祸。“降灾”保留严厉的神圣审判，同时避免使读者误以为经文宣称神施行道德邪恶。
- issue: “定睛”这一神圣关注的性质
  choice: 保留“定睛”隐喻，并由后句限定为降灾而非赐福
  alternative: 意译为“我要监视他们”
  rationale: 原文刻意保留同一神圣关注既可带来福也可带来祸的张力；不将其缩减为单纯监视。
translation_notes:
  register: 采用现代、庄重且易懂的书面汉语。“被掳而去”“命令刀剑”“定睛”保留原文意象；“降灾，而不是赐福”避免生硬直译，同时维持审判与福祉之间的对照。
