  source_fidelity: 译文基本准确地保留了两组宇宙建筑意象、召唤并倾倒海水的动作，以及以“雅威”为名的结语。惟原译将两个平行分词都处理为独立的“那……的”结构，造成汉语句法上的重复，并使结尾“他的名”所指略显游移。修订以一个“那位”统摄全部描述，更贴近希伯来文由分词连续刻画同一位行动者的结构。
  naturalness: “那在……、那召来……”在现代庄重汉语中不够顺畅。改为“那位……、……、……的——雅威是他的名”可保留颂赞式铺陈和结尾突出的效果，同时读起来更自然。
  terminology: “雅威”正确保留神名。“楼阁”与“穹顶”可以作为对争议性宇宙建筑词汇的审慎表达；脚注应将“高层”改为更明确的“上层房间”，避免现代汉语中指楼层高度的含混说法。
  issues:
