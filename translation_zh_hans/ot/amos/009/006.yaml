source:
  edition: WLC
  text: הַ/בּוֹנֶ֤ה בַ/שָּׁמַ֨יִם֙ מעלות/ו וַ/אֲגֻדָּת֖/וֹ עַל אֶ֣רֶץ יְסָדָ֑/הּ הַ/קֹּרֵ֣א לְ/מֵֽי הַ/יָּ֗ם וַֽ/יִּשְׁפְּכֵ֛/ם עַל פְּנֵ֥י הָ/אָ֖רֶץ יְהוָ֥ה שְׁמֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/009/006.yaml
  text: He who builds his upper chambers in the heavens[a], and has founded his vault upon the earth[b], who calls for the waters of the sea and pours them out upon the face of the earth—Yahweh is his name.
translation:
  language: zh_hans
  text: 那位在天上建造自己楼阁、在地上奠立自己穹顶，召唤海水并把它们倾倒在地面上的——雅威是他的名。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַבּוֹנֶה
  choice: 那……建造……的
  rationale: 带冠词的Qal主动分词具有实体化作用，用“那……的”引出描述雅威恒常作为的关系结构，也保留颂赞式语气。
- source_word: מַעֲלוֹתָיו
  choice: 自己的楼阁
  rationale: 该词可指上升之处、台阶或高层房间；本节采用宇宙建筑意象，“楼阁”自然地表达位于天上高处的建筑，同时以脚注保留其他可能。
- source_word: וַאֲגֻדָּתוֹ
  choice: 自己的穹顶
  rationale: 该名词基本意象是捆合、束合之物；在这里似指奠立于大地之上的宇宙结构。“穹顶”可传达拱覆式建筑意象，但原词罕见且含义有争议，因此加注说明。
- source_word: יְסָדָהּ
  choice: 奠立
  rationale: יסד表示立根基、建立；“奠立”既保留建造和创世意象，也能自然搭配“穹顶”。阴性单数宾语后缀理解为回指阴性名词 אֲגֻדָּה。
- source_word: הַקֹּרֵא לְמֵי הַיָּם
  choice: 那召来海水的
  rationale: 分词与前面的 הַבּוֹנֶה 平行；קרא 后接 לְ 在此表达召唤、调遣，“召来”体现对海水的主权。
- source_word: וַיִּשְׁפְּכֵם
  choice: 把水倾倒
  rationale: שפך的基本义是倾倒、浇出；“倾倒”保留原文强烈而具体的动态意象。
- source_word: עַל פְּנֵי הָאָרֶץ
  choice: 在地面上
  rationale: 这是希伯来语常见表达，直指大地表面；现代汉语用“地面上”简洁自然，并避免重复“大地”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译呈现四字神名，而不以“主”这一称号替代，使结尾保留神名的直接宣告。
- source_word: שְׁמוֹ
  choice: 他的名是
  rationale: 按希伯来语名词句的功能译出，在末尾形成庄严而有力的身份宣告。
theological_decisions:
- issue: מַעֲלוֹתָיו与אֲגֻדָּתוֹ的宇宙建筑意象
  choice: 正文译作“楼阁”和“穹顶”，保留古代宇宙建筑图景。
  alternative: 可较直译为“阶梯／高处”和“束合之物／结构”，也可更解释性地译作“天上宫殿”和“穹隆”。
  rationale: 经文以建筑语言赞颂雅威是宇宙的创造者和统治者。正文应让现代读者看见这一意象，却不把它改写成现代科学描述；脚注则保存罕见词语的词义张力。
- issue: יְסָדָהּ中阴性宾语后缀的指向
  choice: 理解为回指阴性名词אֲגֻדָּה，即雅威把“穹顶”奠立在大地之上。
  alternative: 部分理解可能将相关结构与“大地”联系得更紧，译成“把大地立为其结构的根基”等。
  rationale: 语法上阴性后缀自然回指紧邻的阴性名词אֲגֻדָּה，且“在大地之上”适合作奠立地点；但原句凝练，脚注所述词义仍不宜被过度具体化。
- issue: 海水被召来并倾倒的含义
  choice: 不在正文中明说是降雨、洪水或审判，只保留召水和倾倒的图像。
  alternative: 可解释为降雨循环，或联系上下文理解为审判性的洪水。
  rationale: 原文陈述神支配海水，却没有明确限定具体机制或事件；保留开放性可避免消解创世主权与审判语境之间的张力。
- issue: 神名יהוה的呈现
  choice: 译作“雅威”。
  alternative: 可按汉语传统译作“耶和华”，或以“主”代称。
  rationale: 原文直接使用四字神名；音译“雅威”比称号替代更能保留其专名性质，并与较受认可的读音相符。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。前两行以平行的“那……的”结构对应两个希伯来语分词，末行用破折号引出神名宣告。保留建筑与倾水意象，不以现代宇宙论或水循环术语改写。
