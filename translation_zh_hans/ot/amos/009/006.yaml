  rationale: 修订不改变原文的宇宙建筑图像或海水意象，也不将其限定为降雨、洪水或特定宇宙模型。以单一关系结构连贯呈现同一位行动者，并保留结尾神名宣告的庄严强调；同时微调脚注a，使词义替代项在现代汉语中更清晰。
