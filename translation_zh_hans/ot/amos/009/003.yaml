  to: 即使他们藏在迦密山顶，我也要从那里搜出他们，把他们带走；即使他们在海底躲避我的眼目，我也要从那里吩咐蛇，蛇就必咬他们。
  rationale: 修订仅消除第二条件句的句法歧义并改善“命令那蛇”的现代汉语搭配，不改变原文的空间意象、第一人称神谕、审判确定性或蛇的普通词义。原文在此没有需要以脚注保留的实质性文本歧义。
