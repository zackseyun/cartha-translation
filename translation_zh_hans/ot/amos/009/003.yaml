  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/אִם יֵחָֽבְאוּ֙ בְּ/רֹ֣אשׁ הַ/כַּרְמֶ֔ל מִ/שָּׁ֥ם אֲחַפֵּ֖שׂ וּ/לְקַחְתִּ֑י/ם וְ/אִם יִסָּ֨תְר֜וּ מִ/נֶּ֤גֶד עֵינַ/י֙ בְּ/קַרְקַ֣ע הַ/יָּ֔ם מִ/שָּׁ֛ם אֲצַוֶּ֥ה אֶת הַ/נָּחָ֖שׁ וּ/נְשָׁכָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/009/003.yaml
  text: And if they hide themselves on the summit of Carmel[a], from there I will search them out and take them; and if they conceal themselves from before my eyes on the floor of the sea, from there I will command the serpent[b], and it will bite them.
translation:
  language: zh_hans
  text: 即使他们藏在迦密山顶，我也要从那里搜出他们，把他们带走；即使他们在海底躲避我的眼目，我也要从那里吩咐蛇，蛇就必咬他们。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יֵחָבְאוּ
  choice: 藏
  rationale: 该词为尼法勒未完成式，在这里表示主动设法隐藏自己；汉语“藏在”自然地表达这一含义。
- source_word: בְּרֹאשׁ הַכַּרְמֶל
  choice: 在迦密山顶
  rationale: רֹאשׁ 在此指最高处；“迦密山顶”既保留空间意象，也符合现代汉语对该地名的通常表达。
- source_word: אֲחַפֵּשׂ
  choice: 搜出
  rationale: חפשׂ 的皮耶勒词形带有彻底搜寻的意味；“搜出”同时体现搜寻及最终找到。
- source_word: וּלְקַחְתִּים
  choice: 把他们带走
  rationale: לקח 基本义较宽，为“拿、取、带走”；此译保留审判语境中的拘取意味，又不具体限定为逮捕或擒获。
- source_word: יִסָּתְרוּ
  choice: 藏
  rationale: סתר 在此表示把自己隐藏起来。汉语若刻意与前一隐藏动词使用不同措辞会显得生硬，因此采用自然重复。
- source_word: מִנֶּגֶד עֵינַי
  choice: 避开我的眼目
  rationale: 保留原文“在我眼前”的具体拟人意象，同时用“避开”表达他们企图不被看见，并不暗示其企图能够成功。
- source_word: בְּקַרְקַע הַיָּם
  choice: 在海底
  rationale: קַרְקַע 指地面或底部；“海底”是准确而自然的现代汉语，也保留上下两处藏身地点的强烈对照。
- source_word: אֲצַוֶּה
  choice: 命令
  rationale: צוה 的通常意义是“命令”，直接表现说话者对这生物的权柄。
- source_word: הַנָּחָשׁ
  choice: 那蛇
  rationale: נָחָשׁ 可指蛇；“那蛇”保留希伯来语定冠词和先知话语中的威胁意象，又不额外引入创世记象征或体型含义。
- source_word: וּנְשָׁכָם
  choice: 它就必咬他们
  rationale: נשׁך 意为“咬”；补出单数主语“它”，使现代汉语指代清楚，“必”传达此审判行动的确定性。
theological_decisions:
- issue: 以拟人化语言表达无人能逃避的神圣察看与审判
  choice: 保留“我的眼目”这一具体意象
  alternative: 译为较抽象的“避开我的视线”或“使我看不见”
  rationale: 原文借“我的眼目”强调任何藏身之处都不能脱离说话者的察看和审判范围；保留该意象，不将其改写为抽象神学陈述。
- issue: 本节是否补出神的名号
  choice: 延续第一人称神谕，不补入“耶和华”
  alternative: 为明确说话者而增译“耶和华说”
  rationale: 本节在上下文中延续神的直接发言，希伯来文本此处没有再次出现神名；不增补主语更忠于原文。
- issue: 蛇的形象是否带有特定象征意义
  choice: 按普通词义译为“那蛇”
  alternative: 译作“大蛇”或赋予创世记中的象征含义
  rationale: 本节重点是神能命令海中危险生物施行审判；文本本身没有明确要求特定神话或创世记关联，故不作神学扩充。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“即使……也要……”重现两个让步条件句的平行结构；“山顶”与“海底”形成清晰的垂直空间对照。句末“它就必咬他们”保持先知审判宣告的确定和力度。
