source:
  edition: WLC
  text: הֲ/ל֣וֹא כִ/בְנֵי֩ כֻשִׁיִּ֨ים אַתֶּ֥ם לִ֛/י בְּנֵ֥י יִשְׂרָאֵ֖ל נְאֻם יְהוָ֑ה הֲ/ל֣וֹא אֶת יִשְׂרָאֵ֗ל הֶעֱלֵ֨יתִי֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם וּ/פְלִשְׁתִּיִּ֥ים מִ/כַּפְתּ֖וֹר וַ/אֲרָ֥ם מִ/קִּֽיר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/009/007.yaml
  text: Are you not like the Cushites to me[a], O sons of Israel? declares Yahweh. Did I not bring up Israel from the land of Egypt, and the Philistines from Caphtor[c][b], and Aram from Kir?
translation:
  language: zh_hans
  text: “以色列子孙哪，你们对我来说，不是像古实人[a]一样吗？”这是耶和华的宣告。“我不是曾把以色列从埃及地领上来，把非利士人从迦斐托[b]领上来，也把亚兰人[c]从吉珥领上来吗？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “古实人”指古实的人民；有时也译作“埃塞俄比亚人”，但古实与现代埃塞俄比亚并不能简单等同。
    reason: lexical_alternative
  - marker: b
    text: “迦斐托”是地名，许多人传统上认为与克里特有关，但确切地点仍有争议。
    reason: cultural_note
  - marker: c
    text: 原文作“亚兰”，既可指亚兰人，也可指亚兰这一地区或民族整体。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלוֹא
  choice: 不是……吗
  rationale: 这是期待肯定回答的反问；现代汉语用“不是……吗”自然保留其修辞力量。
- source_word: כִבְנֵי כֻשִׁיִּים
  choice: 像古实人一样
  rationale: כִּ表示比较，בְּנֵי在此按族群称谓理解；“古实人”直接对应希伯来 ethnogeographic 名称，避免径直等同于现代国家。
- source_word: אַתֶּם לִי
  choice: 你们对我来说
  rationale: 保留לִי所表达的关系与上帝的视角，不将其缩减为单纯的“在我眼中”。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列子孙哪
  rationale: “子孙”既保留“以色列之子”的民族称谓，又比“以色列的儿子们”更符合庄重、自然的现代汉语；“哪”标明呼语。
- source_word: נְאֻם יְהוָה
  choice: 耶和华宣告说
  rationale: 保留先知性宣告公式的庄严语气，并明确发言者。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经语境中对四字神名的通行音译。
- source_word: הֶעֱלֵיתִי
  choice: 领……上来
  rationale: 保留עלה使役式“使上来”的方向感；加“领”使三组民族迁徙的并列在汉语中自然清楚。
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: 从埃及地上来
  rationale: 保留原文明确出现的“地”，并与后两项出发地形成平行。
- source_word: פְלִשְׁתִּיִּים
  choice: 非利士人
  rationale: 采用该古代民族在现代中文中的通行名称。
- source_word: כַּפְתּוֹר
  choice: 迦斐托
  rationale: 按专名音译，不在正文中把有争议的地点直接确定为克里特。
- source_word: אֲרָם
  choice: 亚兰人
  rationale: 上下文将其与以色列和非利士人并列，故正文按民族理解；同时以脚注保留“亚兰”可指地区或整体名称的可能。
- source_word: קִיר
  choice: 吉珥
  rationale: 采用该地点专名的通行中文音译。
theological_decisions:
- issue: 以色列与古实人比较的力度
  choice: 直译为“你们对我来说，不是像古实人一样吗”
  alternative: 将比较限定为地理迁徙上的相似
  rationale: 反问直接冲击以色列凭族裔和出埃及经历自恃特殊地位的观念；下文又把上帝引导民族迁徙的作为扩展到其他民族。译文保留这种神学张力，不替正文限定比较范围。
- issue: בְּנֵי יִשְׂרָאֵל的表达
  choice: 以色列子孙哪
  alternative: 以色列人哪；以色列的儿子们哪
  rationale: 原文是阳性复数民族称谓。“以色列子孙”保留其家族—民族意象，也符合庄重自然的中文表达。
- issue: 三次民族迁徙与上帝主权的平行
  choice: 在三个分句中重复“领……上来”
  alternative: 仅在第一项译出动词，后两项省略
  rationale: 希伯来文以后两项与前一动词并列。汉语重复动词能清楚呈现上帝对三组民族的同样主动作为，而不增添原文没有的因果解释。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。以“不是……吗”保留两重反问，以重复“领……上来”呈现希伯来文三项平行结构；专名采用中文圣经传统中较通行的译法，并用脚注保留地点与族名的真实不确定性。
