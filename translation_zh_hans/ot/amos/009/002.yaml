  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אִם יַחְתְּר֣וּ בִ/שְׁא֔וֹל מִ/שָּׁ֖ם יָדִ֣/י תִקָּחֵ֑/ם וְ/אִֽם יַעֲלוּ֙ הַ/שָּׁמַ֔יִם מִ/שָּׁ֖ם אוֹרִידֵֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/009/002.yaml
  text: Though they dig into Sheol[a], from there my hand will take them; and though they climb up to the heavens, from there I will bring them down.
translation:
  language: zh_hans
  text: 即使他们挖进阴间[a]，我的手也必从那里把他们取走；即使他们爬到天上，我也必从那里把他们带下来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “阴间”或译“坟墓”或“亡者之境”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחְתְּרוּ
  choice: 挖进
  rationale: 保留חתר挖掘、掘穿的具体意象，并与逃往阴间的语境自然衔接。
- source_word: בִשְׁאוֹל
  choice: 阴间
  rationale: שְׁאוֹל指亡者所在之境，不宜缩窄为坟墓，也不应套入后期更具体的教义概念；“阴间”是现代中文圣经语境中较为简明而庄重的对应词。
- source_word: יָדִי
  choice: 我的手
  rationale: 保留原文拟人化表达，突出上帝的能力与触及范围，不将其抽象化为“我的能力”。
- source_word: תִּקָּחֵם
  choice: 把他们抓出来
  rationale: לקח本义宽泛，可指拿取或抓住；此处“抓”体现无法逃脱，“出来”则按中文习惯明示从阴间被取出的方向，但不加强为更猛烈的“擒获”。
- source_word: יַעֲלוּ
  choice: 爬上
  rationale: 比“上到”更有具体动作感，与“挖进”形成鲜明平行，也不采用较文言的“升到”。
- source_word: הַשָּׁמַיִם
  choice: 诸天
  rationale: 保留希伯来语复数和宇宙两极的诗歌色彩，同时采用现代读者能够理解的庄重表达。
- source_word: אוֹרִידֵם
  choice: 把他们拉下来
  rationale: 准确表达ירד使役式“使之下来”；“拉下来”与前句“我的手”意象协调，又不额外加入“摔下”等暴力色彩。
- source_word: אִם ... וְאִם
  choice: 即使……即使
  rationale: 这里是让步而非单纯假设，强调无论逃到何处都不能躲避；“即使”在现代汉语中清楚自然。
theological_decisions:
- issue: שְׁאוֹל的译法
  choice: 阴间
  alternative: 坟墓；亡者之境；音译“示奥尔”
  rationale: 经文以阴间和诸天构成宇宙性的两极，表达无人能逃避上帝的审判。“阴间”保留亡者领域的概念，又不把它缩窄为个别坟墓，或直接等同于后期神学中的地狱。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“挖进／爬上”和“抓出来／拉下来”保持两组动作的诗性平行；保留“我的手”的具体意象及“阴间／诸天”的宇宙两极。
