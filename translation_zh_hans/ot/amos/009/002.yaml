revisions:
- from: 即使他们挖进阴间[a]，我的手也必从那里把他们抓出来；即使他们爬上诸天，我也必从那里把他们拉下来。
  to: 即使他们挖进阴间[a]，我的手也必从那里把他们取走；即使他们爬到天上，我也必从那里把他们带下来。
  rationale: 修订避免以“抓”“拉”限定原文并未说明的动作方式，以“取走／带下来”分别对应לקח和ירד的使役式；将“诸天”调整为更自然的现代汉语“天上”，同时保留阴间与天上的诗歌性两极及让步语气。
