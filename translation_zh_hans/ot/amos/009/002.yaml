review_pass:
  verdict: revise
  source_fidelity: 草稿总体准确地保留了让步结构、阴间与天上的宇宙两极，以及“我的手”的拟人表达。但“抓出来”和“拉下来”分别把中性的“取／带走”和使役的“使下来”具体化为“抓”和“拉”，增添了原文未明说的动作方式与力度。
  naturalness: “即使……即使……”和“挖进阴间”通顺自然。“诸天”虽可理解，但在现代标准汉语中不如“天上”自然；“爬到天上”也比“爬上诸天”更符合普通话搭配。
  terminology: “阴间”可作为שְׁאוֹל的简明、庄重译法；脚注恰当地保留“坟墓”和“亡者之境”等词义可能性，避免将其等同于后期教义中的地狱。
  issues:
  - severity: medium
    issue: “把他们抓出来”加强并具体化了תִּקָּחֵם。
    rationale: לקח在此为“取、带走”，并未指定“抓”的方式；“出来”也将“从那里”明确处理为从内部向外的移动。改为“从那里把他们取走”较中性，并保留原文的不可逃避之意。
  - severity: medium
    issue: “把他们拉下来”加入了原文未指定的“拉”这一方式。
    rationale: אוֹרִידֵם是使役式“使他们下来／把他们带下来”，并不特别指拉拽。改为“把他们带下来”可保留使役意义而不增添动作细节。
  - severity: low
    issue: “诸天”在此不如“天上”符合现代普通话。
    rationale: 希伯来语复数在汉语中通常无需逐一形式对应；“天上”自然表达该宇宙性高度，并与“阴间”形成清楚对照。
  revised_text: 即使他们挖进阴间[a]，我的手也必从那里把他们取走；即使他们爬到天上，我也必从那里把他们带下来。
  revised_footnotes:
