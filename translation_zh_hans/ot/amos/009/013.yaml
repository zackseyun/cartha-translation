base_translation:
  language: en
  yaml_path: translation/ot/amos/009/013.yaml
  text: Behold[a], days are coming, declares Yahweh, when the plowman will overtake the reaper, and the one who treads grapes the one who sows the seed; the mountains will drip sweet wine[c][b], and all the hills will melt.
translation:
  language: zh_hans
  text: “看哪，日子将到，”耶和华宣告，“那时，耕地的必紧接着收割的，踹葡萄的必紧接着撒种的；群山必滴下甜酒[a]，所有丘陵都必消融[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“新酒”。这里描绘收成极其丰盛，以致一个农季的工作尚未结束，下一个农季的工作已经开始。
    reason: 词义备选及文化背景说明
  - marker: b
    text: “消融”也可理解为丘陵仿佛流淌起来，形容酒液丰盛。
    reason: 诗歌意象说明
lexical_decisions:
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留先知话语中唤起注意的庄重语气；“看哪”在现代中文圣经语体中清楚而自然。
- source_word: יָמִים בָּאִים
  choice: 日子将到
  rationale: 贴近这一预告未来作为的先知惯用语，同时符合现代汉语表达。
- source_word: נְאֻם יְהוָה
  choice: 耶和华宣告
  rationale: נְאֻם 表示庄严的神谕宣告；将四字神名译作“耶和华”，保留其专名性质。
- source_word: וְנִגַּשׁ
  choice: 必紧接着
  rationale: 本义为临近、靠近；在农事语境中描绘一个季节的工作尚未结束，下一个季节的工作已经接上。此译法既表达紧迫相接，也不强化为竞逐意义。
- source_word: חוֹרֵשׁ בַּקֹּצֵר
  choice: 耕地的必紧接着收割的
  rationale: 保留两个农业劳动者的对举，并自然表达收成极其丰盛、农时彼此重叠的图景。
- source_word: וְדֹרֵךְ עֲנָבִים
  choice: 踹葡萄的
  rationale: 保留古代用脚踩压葡萄以取汁酿酒的具体形象。
- source_word: בְּמֹשֵׁךְ הַזָּרַע
  choice: 撒种的
  rationale: 字面涉及“拉出／牵出种子”，但语境所指是播种者；采用自然中文表达，并避免把难以理解的字面结构带入正文。
- source_word: וְהִטִּיפוּ הֶהָרִים עָסִיס
  choice: 群山必滴下甜酒
  rationale: 保留“滴下”的拟人化丰饶意象；עָסִיס 指新鲜压出的浓甜酒液，可译“甜酒”或“新酒”。
- source_word: תִּתְמוֹגַגְנָה
  choice: 都必消融
  rationale: 该动词本义为熔化、消融；保留诗歌中丘陵仿佛因酒液丰盛而融化的强烈意象。
theological_decisions:
- issue: 复兴应许中的农业丰饶意象
  choice: 按具体而夸张的农业图景翻译，不限定其应验方式
  alternative: 将其限定为某一末世时期的字面农业预言，或完全改写为属灵福分
  rationale: 希伯来文本用农时重叠、群山滴酒和丘陵消融来描绘复兴中的丰盛。译文应保留这些具体诗性意象，让其应验范围与方式保持可讨论性。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。正文保留先知宣告的节奏与希伯来诗歌的惊人意象；“紧接着”比“追上”更贴近 נגש 的临近之义，也自然传达农时重叠。所有脚注标记均置于正文相应位置。
