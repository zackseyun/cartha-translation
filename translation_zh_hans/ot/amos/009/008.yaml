  rationale: 修订仅处理两个低风险问题：以“那”代替带近指意味的“这个”，并将脚注语法术语改为规范的“有限动词”。同时将“地面上”简化为经文汉语中自然且忠实的“地上”。其余措辞保留原译对原文语义、神名及审判与保全张力的准确呈现。
