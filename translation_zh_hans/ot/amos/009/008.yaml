id: AMO.9.8
reference: Amos 9:8
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: הִנֵּ֞ה עֵינֵ֣י אֲדֹנָ֣/י יְהוִ֗ה בַּ/מַּמְלָכָה֙ הַֽ/חַטָּאָ֔ה וְ/הִשְׁמַדְתִּ֣י אֹתָ֔/הּ מֵ/עַ֖ל פְּנֵ֣י הָ/אֲדָמָ֑ה אֶ֗פֶס כִּ֠י לֹ֣א הַשְׁמֵ֥יד אַשְׁמִ֛יד אֶת בֵּ֥ית יַעֲקֹ֖ב נְאֻם יְהוָֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/009/008.yaml
  text: Look[a], the eyes of the Lord GOD are on the sinful kingdom, and I will destroy it from the face of the earth. Yet I will not utterly destroy the house of Jacob," declares Yahweh.
translation:
  language: zh_hans
  text: “看哪，主耶和华的眼目正注视那有罪的国；我要把它从地上除灭。但我绝不会把雅各家彻底除灭[a]。”这是耶和华的宣告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“但我不会把雅各家灭绝净尽”。希伯来文以同根的不定式绝对式和有限动词连用来加强语气；在这里，它强调雅各家不会被彻底毁灭。
    reason: 说明希伯来文强调结构，并保留其否定全然毁灭、却不否定审判本身的含义。
lexical_decisions:
- source_word: הִנֵּה
  choice: 看哪
  rationale: 这是引人注意并引出庄严宣告的指示词；“看哪”简洁、庄重，也保留先知话语的宣告力量。
- source_word: עֵינֵי אֲדֹנָי יְהוִה
  choice: 主耶和华的眼目
  rationale: 保留“眼目”的希伯来意象，表达上帝专注察看、即将施行审判；复合神名译为中文惯用的“主耶和华”。
- source_word: בַּמַּמְלָכָה הַחַטָּאָה
  choice: 正注视这个有罪的国
  rationale: 介词与“眼目”连用，表示目光所向；上下文赋予这种注视审判意味。“有罪的国”准确保留形容性表达。
- source_word: וְהִשְׁמַדְתִּי אֹתָהּ
  choice: 我要把它……除灭
  rationale: 使役词形表达毁灭、清除；“除灭”力度充分，并可与后半句同一词根的重复相呼应。
- source_word: מֵעַל פְּנֵי הָאֲדָמָה
  choice: 从地面上
  rationale: 自然呈现希伯来语“从土地之面”的惯用说法，既不把范围限定为某一片土地，也避免生硬照译“地的脸面”。
- source_word: אֶפֶס כִּי
  choice: 但
  rationale: 此短语对前面的全面审判作强烈限定；“但”在现代汉语中自然清楚地标示转折。
- source_word: לֹא הַשְׁמֵיד אַשְׁמִיד
  choice: 绝不会……彻底除灭
  rationale: 不定式绝对形与限定动词同用以加强语气；在否定句中，这里强调所否定的是彻底毁灭。
- source_word: אֶת בֵּית יַעֲקֹב
  choice: 雅各家
  rationale: 保留指雅各后裔、以色列民的传统盟约性称谓及其经文互文联系。
- source_word: נְאֻם יְהוָה
  choice: 这是耶和华的宣告
  rationale: 以现代、庄重的汉语呈现先知书常用的神谕结束语，并直接保留神名。
theological_decisions:
- issue: 对有罪之国的审判与对雅各家的保存
  choice: 明确说有罪之国将被除灭，同时否定雅各家遭到彻底除灭
  alternative: 把后半句弱化为一般性的减轻刑罚
  rationale: 希伯来文有意并置严厉审判与不使雅各家全然灭绝的应许；译文保留二者之间的张力，不把任何一面淡化。
- issue: 同一节中神名 יְהוָה 的表达
  choice: אֲדֹנָי יְהוִה 译作“主耶和华”，独立出现的 יְהוָה 译作“耶和华”
  alternative: 将神名统一替换为“主”或在复合称号中译作“主上帝”
  rationale: 这样既区分 אֲדֹנָי 与神名，也避免“主主”的重复，并保留原文的盟约神名。
- issue: 否定句中不定式绝对形的强调范围
  choice: 译为“绝不会……彻底除灭”
  alternative: 译为“必不除灭”或“不会完全毁灭”
  rationale: 原文强调性结构处于否定词之后，重点是否定对雅各家的全然毁灭，而不是否定一切审判；译文不据此推断具体会存留多少人。
translation_notes:
  register: 采用现代、庄重而易懂的先知宣告语体。“看哪”和“雅各家”保留必要的经文风格；“正注视”“彻底除灭”使句义对普通现代读者清楚。引号按本节作为上帝直接发言的结构处理，宣告公式置于引号之后。
