  text: בַּ/חֶ֣רֶב יָמ֔וּתוּ כֹּ֖ל חַטָּאֵ֣י עַמִּ֑/י הָ/אֹמְרִ֗ים לֹֽא תַגִּ֧ישׁ וְ/תַקְדִּ֛ים בַּעֲדֵ֖י/נוּ הָ/רָעָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/009/010.yaml
  text: By the sword all the sinners of my people will die—those who say, ‘The disaster will not overtake us or come against us.’
translation:
  language: zh_hans
  text: 我子民中所有的罪人都必死在刀下，就是那些说：“灾祸不会逼近我们，也不会迎面袭来”的人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּחֶרֶב
  choice: 死在刀下
  rationale: 介词בְּ表示手段；“死在刀下”自然表达遭刀剑杀戮，同时保留审判语气。
- source_word: כֹּל חַטָּאֵי עַמִּי
  choice: 我子民中所有犯罪的人
  rationale: חַטָּאֵי是“罪人”的复数构造形式；此译法避免将“我的百姓”整体等同于罪人，并准确表达其中的所有罪人。
- source_word: תַגִּישׁ
  choice: 临近
  rationale: 该词在此处以“灾祸”为主语，表达灾祸逼近、临到；“临近”保留其空间隐喻。
- source_word: תַקְדִּים בַּעֲדֵינוּ
  choice: 迎面而来
  rationale: 该短语较为罕见，核心意象是灾祸在前面来到、与人相遇；“迎面而来”保留方向感而不强行消除原文张力。
theological_decisions:
- issue: “我子民”与“犯罪的人”的关系
  choice: 译为“我子民中所有犯罪的人”
  alternative: “我子民所有的罪人”
  rationale: 两者语义接近；所选表达更清楚表明审判对象是百姓中的罪人，不暗示全体百姓无一例外都被定罪。
- issue: 否认灾祸的两组动词是否合并
  choice: 分别译为“不会临近我们，也不会迎面而来”
  alternative: 合并为“不会临到我们”
  rationale: 保留原文两个并列动词及其递进、近义张力，不将先知对虚假安全感的刻画压缩为单一表达。
translation_notes:
  register: 采用庄重、清晰的现代普通话。“死在刀下”符合先知书审判语境；引语保持自然口语感，同时以“临近”“迎面而来”保留希伯来文的空间意象和并列结构。
