revisions:
- from: 我子民中所有犯罪的人都必死在刀下，就是那些说：‘灾祸不会临近我们，也不会迎面而来。’的人。
  to: 我子民中所有的罪人都必死在刀下，就是那些说：“灾祸不会逼近我们，也不会迎面袭来”的人。
  rationale: 修正引语嵌入定语时的结构性标点问题；以“罪人”对应原文名词；以“逼近……迎面袭来”保留两个否认灾祸临到的并列动词及其空间张力。未加入任何教义性解释。
  reviewer_model: gpt-5.6-terra
