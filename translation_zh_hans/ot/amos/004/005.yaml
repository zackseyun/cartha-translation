  source_fidelity: 译文总体保留了两组命令、讽刺性的表面劝令、祭祀术语及先知宣告公式。“主耶和华”准确对应 אֲדֹנָי יְהוִה。惟“把有酵之物献上焚烧，作感谢祭”的句法使“有酵之物”看似直接就是被焚烧的感谢祭，关系略显生硬；改为“用有酵之物焚烧献上感谢祭”可更直接表达 מֵחָמֵץ 与 תודה 的关联，同时不裁定其究竟表示材料、伴随物还是修饰关系。
  naturalness: “以色列人哪”及“这是主耶和华的宣告”庄重自然。“把它们传扬出去”可理解，但“宣扬出来”更贴合使人听见／公开发布的意思。末句改作“你们喜爱的正是这样做”，比“正是这些”更贴近 כֵן（如此、这样）并避免将其所指限定为若干事物。
  terminology: “感谢祭”“甘心祭”均为适当且通行的祭祀术语。“主耶和华”保留称号“主”和神名，适合本段现代中文圣经语体。
