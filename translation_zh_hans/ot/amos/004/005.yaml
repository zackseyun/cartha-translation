source:
  edition: WLC
  text: וְ/קַטֵּ֤ר מֵֽ/חָמֵץ֙ תּוֹדָ֔ה וְ/קִרְא֥וּ נְדָב֖וֹת הַשְׁמִ֑יעוּ כִּ֣י כֵ֤ן אֲהַבְתֶּם֙ בְּנֵ֣י יִשְׂרָאֵ֔ל נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/004/005.yaml
  text: And burn a thank offering from leavened bread[a], and proclaim freewill offerings—announce them! For this is what you have loved, O sons of Israel[b], declares the Lord GOD.
translation:
  language: zh_hans
  text: 又要用有酵之物焚烧献上感谢祭[a]；要宣告甘心祭，把它们宣扬出来！因为以色列人哪，你们喜爱的正是这样做[b]。这是主耶和华的宣告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “用有酵之物焚烧献上感谢祭”也可理解为“把有酵之物焚烧献上，作感谢祭”或“献上有酵饼的感谢祭”；希伯来语把有酵之物与感谢祭联系起来，但两者的具体关系并不完全明确。
    reason: lexical_alternative
  - marker: b
    text: 直译“因为你们喜爱如此”；“这样做”指前面所说的献祭和公开宣扬等行为。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקַטֵּר
  choice: 又要……献上焚烧
  rationale: 该词为皮埃勒命令式，指使祭物在坛上焚烧冒烟；此译保留祭祀动作及上下文中带讽刺意味的命令语气。
- source_word: מֵחָמֵץ תּוֹדָה
  choice: 把有酵之物献上焚烧，作感谢祭
  rationale: מֵחָמֵץ 可指“出于有酵之物”“用有酵之物”或“有酵的”；如此译避免武断判定有酵之物与感谢祭之间究竟是构成还是伴随关系，并以脚注保留歧义。
- source_word: תּוֹדָה
  choice: 感谢祭
  rationale: 在祭祀语境中是专门用语，指为感谢而献的祭。
- source_word: וְקִרְאוּ נְדָבוֹת הַשְׁמִיעוּ
  choice: 要宣告甘心祭，把它们传扬出去
  rationale: קרא 表示公开宣告，השמיעו 字面为“使人听见”，后句加强公开张扬之意；“它们”承接复数的甘心祭。
- source_word: כִּי כֵן אֲהַבְתֶּם
  choice: 你们所喜爱的正是这些
  rationale: כֵן 的所指可涵盖前述宗教行为；此译以“这些”承接上下文，保留责备和讽刺力度，并用完成式所表达的既成倾向来译“所喜爱的”。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人哪
  rationale: 字面为“以色列的众子”，但在此为对以色列群体的呼语；现代汉语用“以色列人哪”自然且不误导为仅指男性。
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: 这是主耶和华的宣告
  rationale: נְאֻם 是先知性宣告公式；“主耶和华”区分 אֲדֹנָי 与神名 יהוה，并符合现代中文圣经语体。
theological_decisions:
- issue: 复合称号 אֲדֹנָי יְהוִה 中神名的译法
  choice: 主耶和华
  alternative: 主上帝；主雅威
  rationale: 原文同时使用“主”与四字神名。译作“主耶和华”保留两个成分，在普通现代中文读者中也较易识别；不以“上帝”抹去专名，也不强行采用尚未普遍通行的音译。
- issue: 先知命令的语气
  choice: 保留表面命令及其讽刺效果
  alternative: 改译为直接禁止或谴责
  rationale: 上下文借命令语气讽刺以色列人所热爱的宗教行为；不把潜在语用意义改写成明说的禁令，以保留神学张力。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。以重复的命令句保留先知话语的讽刺锋芒；“甘心祭”“感谢祭”保留祭祀术语，同时借脚注解释关键歧义。所有脚注标记均已置于正文。
