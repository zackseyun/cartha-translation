  text: הִכֵּ֣יתִי אֶתְ/כֶם֮ בַּ/שִּׁדָּפ֣וֹן וּ/בַ/יֵּרָקוֹן֒ הַרְבּ֨וֹת גַּנּוֹתֵי/כֶ֧ם וְ/כַרְמֵי/כֶ֛ם וּ/תְאֵנֵי/כֶ֥ם וְ/זֵיתֵי/כֶ֖ם יֹאכַ֣ל הַ/גָּזָ֑ם וְ/לֹֽא שַׁבְתֶּ֥ם עָדַ֖/י נְאֻם יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/amos/004/009.yaml
  text: I struck you with blight and mildew; your many gardens and your vineyards[a], your fig trees and your olive trees, the locust devoured; yet you did not return to me, declares Yahweh.
translation:
  language: zh_hans
  text: 我曾用枯萎和霉害打击你们；蝗虫[a]吞吃了你们众多的园圃、葡萄园、无花果树和橄榄树；但你们仍没有归向我——这是雅威的宣告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “蝗虫”所译的希伯来词指一种啃食、毁坏庄稼的昆虫，传统上理解为某类蝗虫；也可译作“剪食蝗虫”或“啃食蝗虫”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הִכֵּיתִי
  choice: 我……打击你们
  rationale: 保留动词“击打”的主动审判意味，同时采用现代汉语中较自然的“打击”，不使用古雅的“击杀”。
- source_word: בַּשִּׁדָּפוֹן וּבַיֵּרָקוֹן
  choice: 用枯萎病和霉病
  rationale: 前者指使作物枯萎的灾害，可能包含热风灼伤的意味；后者指植物发黄、霉坏一类的病害。此译简明呈现两种农业灾害，又不把其具体成因说得过死。
- source_word: הַרְבּוֹת גַּנּוֹתֵיכֶם
  choice: 你们众多的园圃
  rationale: 把הַרְבּוֹת理解为表示数量众多，并以“园圃”表达栽培果蔬树木的园地，比现代汉语中的一般“花园”更符合农业语境。
- source_word: כַרְמֵיכֶם
  choice: 葡萄园
  rationale: 直接对应种植葡萄的园地。
- source_word: תְאֵנֵיכֶם וְזֵיתֵיכֶם
  choice: 无花果树和橄榄树
  rationale: 上下文列举遭虫害的栽培植物，译作树木比只译果实名称更清楚。
- source_word: יֹאכַל הַגָּזָם
  choice: 都被蝗虫吞吃了
  rationale: גָּזָם指毁坏庄稼的啃食昆虫，传统上视为某类蝗虫；“吞吃”传达其破坏性。希伯来语以单数未完成式描写，但本节回顾已经发生的灾祸，汉语采用完成表达。
- source_word: וְלֹא שַׁבְתֶּם עָדַי
  choice: 可是，你们仍没有归向我
  rationale: “归向”保留שׁוּב在先知书中回转、悔改并恢复对上帝忠诚的宽广含义，不将其缩减为单纯内心懊悔。
- source_word: נְאֻם יְהוָה
  choice: 这是雅威说的
  rationale: 用自然而庄重的现代汉语表达先知宣告公式，并直接音译上帝的圣名。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；“雅威”较贴近其通常重构的读音，也避免以称号“主”取代专名。
- issue: שַׁבְתֶּם עָדַי在盟约语境中的含义
  choice: 归向我
  alternative: 回到我这里；向我悔改
  rationale: “归向我”同时保留方向性的回转、悔改和恢复忠诚等意涵，不把先知话语的神学张力限定为某一种解释。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“园圃”避免“花园”可能引起的观赏性联想；“可是……仍没有”突出灾祸之后百姓依旧不归向上帝的反差。
