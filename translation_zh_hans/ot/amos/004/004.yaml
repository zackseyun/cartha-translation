  text: בֹּ֤אוּ בֵֽית אֵל֙ וּ/פִשְׁע֔וּ הַ/גִּלְגָּ֖ל הַרְבּ֣וּ לִ/פְשֹׁ֑עַ וְ/הָבִ֤יאוּ לַ/בֹּ֨קֶר֙ זִבְחֵי/כֶ֔ם לִ/שְׁלֹ֥שֶׁת יָמִ֖ים מַעְשְׂרֹֽתֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/004/004.yaml
  text: Come to Bethel—and transgress; to Gilgal—and multiply transgression. Bring your sacrifices every morning[a], your tithes every three days,
translation:
  language: zh_hans
  text: 你们到伯特利去犯罪吧！到吉甲去，多多犯罪吧！每天早晨献上你们的祭物，每三天献上你们的十分之一[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“第三天”或“三天后”。
    reason: 原文时间短语 לִשְׁלֹשֶׁת יָמִים 含义有歧义，可表示周期、第三日或三日之后。
lexical_decisions:
- source_word: בֹּאוּ
  choice: 去
  rationale: 复数祈使式，表示前往敬拜地点。现代汉语从先知对听众发话的视角用“去”最自然，同时保留命令语气。
- source_word: בֵית אֵל
  choice: 伯特利
  rationale: 沿用该地名通行的中文音译，不按字面译为“上帝之家”。
- source_word: וּפִשְׁעוּ
  choice: 犯罪吧
  rationale: פשע可指越轨、悖逆；此处用“犯罪”清楚自然，并以“吧”配合上下文表达先知带讽刺意味的命令，而不额外解释讽刺。
- source_word: הַגִּלְגָּל
  choice: 到吉甲去
  rationale: 承接前句的移动含义，补出汉语所需的“到……去”；地名采用通行音译。
- source_word: הַרְבּוּ לִפְשֹׁעַ
  choice: 加倍犯罪吧
  rationale: 使役词干祈使式加不定式表达增多、加剧。“加倍犯罪”既简洁，也保留先知尖锐的反讽。
- source_word: וְהָבִיאוּ
  choice: 献上
  rationale: 在祭祀语境中，הביא不是普通地“带来”，而是把祭物带来奉献；“献上”更符合现代汉语宗教语境。
- source_word: לַבֹּקֶר
  choice: 每天早晨
  rationale: 语境中很可能具有逐日、分配性的含义，描写频繁而讲究的礼仪行为。
- source_word: זִבְחֵיכֶם
  choice: 你们的祭物
  rationale: זבח指宰献的祭牲或祭献；“祭物”简明庄重，并适合此处与“献上”搭配。
- source_word: לִשְׁלֹשֶׁת יָמִים
  choice: 每三天
  rationale: 此时间短语含义有争议；正文采用能体现频繁献纳、符合本段讽刺语境的“每三天”，其他可能译法收入脚注。
- source_word: מַעְשְׂרֹתֵיכֶם
  choice: 你们的十分之一
  rationale: 该词指献作礼物的十分之一。“十分之一”比教会术语“什一奉献”更直接，也避免加入超出原文的制度性表述。
theological_decisions:
- issue: 祈使句中的先知性反讽
  choice: 保留直接命令形式：“去犯罪吧……加倍犯罪吧”
  alternative: 明说“尽管去犯罪”或“继续犯罪好了”
  rationale: 希伯来文以真正的祈使式构成讽刺性的谴责。正文不把讽刺完全解释出来，以保留原文修辞张力；句末“吧”使现代汉语表达自然，但不消除其尖锐性。
- issue: 时间短语 לִשְׁלֹשֶׁת יָמִים
  choice: 正文译作“每三天”
  alternative: “第三天”或“三天后”
  rationale: 原短语确有歧义。“每三天”较符合阿摩司对频繁礼仪热忱的讽刺，但其他时间关系在语法上仍有可能，因此以脚注保留。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。平行祈使句保留原文节奏和反讽；地名使用中文圣经传统通行译名。脚注标记紧接其所说明的“每三天”。
