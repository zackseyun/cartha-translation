id: AMO.4.8
reference: Amos 4:8
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/נָע֡וּ שְׁתַּיִם֩ שָׁלֹ֨שׁ עָרִ֜ים אֶל עִ֥יר אַחַ֛ת לִ/שְׁתּ֥וֹת מַ֖יִם וְ/לֹ֣א יִשְׂבָּ֑עוּ וְ/לֹֽא שַׁבְתֶּ֥ם עָדַ֖/י נְאֻם יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/004/008.yaml
  text: So two or three cities staggered to one city to drink water[a], but they were not satisfied; yet you did not return to me[b], declares Yahweh.
translation:
  language: zh_hans
  text: 于是，两三座城的人踉跄着[a]走到同一座城去喝水，却还是喝不够；然而，你们仍不归向我[b]。这是雅威的宣告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“摇摇晃晃地”或“辗转”。这个希伯来动词可表示不稳或来回移动，在这里描绘人们为寻找水而艰难奔走。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“向我回转”。“归向”在《阿摩司书》的语境中含有离开原来的道路、重新转向上帝的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָעוּ
  choice: 踉跄着走
  rationale: 动词 נוע 可表示摇摆、来回或不稳地移动。旱灾语境突出人们因缺水而艰难奔走；“踉跄着走”既保留动态意象，也比单纯的“去”更贴近原文。
- source_word: שְׁתַּיִם שָׁלֹשׁ עָרִים
  choice: 两三座城的人
  rationale: “二、三”是表示少数的不定数目。原文以“城”为主语，借城指其中的居民；汉语补出“的人”，使动作主体自然清楚，同时保留城市之间的对照。
- source_word: אֶל עִיר אַחַת
  choice: 走到同一座城
  rationale: 多个城镇的居民汇集到一个有水之处；“同一座城”自然表达原文数城趋向“一城”的聚合意味。
- source_word: לִשְׁתּוֹת מַיִם
  choice: 去喝水
  rationale: 按目的不定式直译，简洁自然。
- source_word: וְלֹא יִשְׂבָּעוּ
  choice: 却还是喝不够
  rationale: שׂבע 表示吃喝后得到饱足或满足。结合“喝水”的直接语境，“喝不够”用现代汉语清楚表达水量不足，同时不把它窄化为单纯的主观口渴感。
- source_word: וְלֹא שַׁבְתֶּם עָדַי
  choice: 然而，你们仍不归向我
  rationale: שׁוב 在先知语境中兼有返回和悔改转向上帝之意。“归向我”在中文中保留关系性和盟约性的方向，又不直接改写为“悔改”。
- source_word: נְאֻם יְהוָה
  choice: 这是雅威的宣告
  rationale: 以庄重而自然的现代汉语表达先知书常见的神谕公式，并保留圣名。
- source_word: יְהוָה
  choice: 雅威
  rationale: 音译四字神名，保留其作为以色列之上帝专名的性质，不以称号替代。
theological_decisions:
- issue: שׁוב 的悔改与返回双重意味
  choice: 归向我
  alternative: 回到我这里／向我回转
  rationale: 上下文显然涉及百姓在管教中仍未转向上帝，但原文没有直接使用“悔改”一词。“归向”能表达属灵和盟约层面的转回，同时保留动词本身的方向性。
- issue: 四字神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华／主
  rationale: 原文使用上帝的专名；“雅威”按较通行的学术重构音译，避免用“主”这一称号取代专名。
- issue: 以“城”为动作主体的转喻
  choice: 两三座城的人
  alternative: 两三座城
  rationale: 原文以城市代居民。中文若说“城踉跄着走”会形成不合预期的拟人效果，因此明确为居民，但不改变所指群体。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“却还是喝不够”贴近日常表达，使旱灾造成的匮乏清晰可感；“这是雅威的宣告”则维持先知话语的正式语气。标点将灾情陈述与神圣判语清楚分开。
