language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: נִשְׁבַּ֨ע אֲדֹנָ֤/י יְהוִה֙ בְּ/קָדְשׁ֔/וֹ כִּ֛י הִנֵּ֥ה יָמִ֖ים בָּאִ֣ים עֲלֵי/כֶ֑ם וְ/נִשָּׂ֤א אֶתְ/כֶם֙ בְּ/צִנּ֔וֹת וְ/אַחֲרִיתְ/כֶ֖ן בְּ/סִיר֥וֹת דּוּגָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/004/002.yaml
  text: 'The Lord GOD has sworn by his holiness: For behold[a], days are coming upon you when they will lift you away with hooks[b], and your posterity with fishhooks.'
translation:
  language: zh_hans
  text: 主耶和华凭自己的圣洁起誓说：“看哪，日子将临到你们；人必用钩子把你们带走，连你们中最后剩下的人[a]也必用鱼钩带走[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “最后剩下的人”所译的希伯来语词可指末后、结局、后代或余剩；此处按上下文译为最后留下的人。
    reason: lexical_alternative
  - marker: b
    text: “钩子”和“鱼钩”所对应的希伯来语词义较难确定；也有人理解为带刺的器具，或泛指像捕鱼工具一样用来拖走人的尖锐器具。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: 保留复合神圣称号的两个成分；用现代中文圣经语体中通行且庄重的“主耶和华”，避免生硬重复。
- source_word: נִשְׁבַּע
  choice: 起誓
  rationale: 完成式在先知宣告中表达已经确立、现今仍有效的庄严誓言；中文以“起誓说”自然引出誓言内容。
- source_word: בְּקָדְשׁוֹ
  choice: 凭自己的圣洁
  rationale: 此处 קֹדֶשׁ 最自然地指上帝自身的圣洁，而非圣所；“凭”符合中文起誓表达。
- source_word: כִּי הִנֵּה
  choice: 看哪
  rationale: 传达 הִנֵּה 的指示和警示力度；在庄重但可懂的现代中文经文语体中仍然自然。כִּי 在引述誓言内容时无需机械译出。
- source_word: יָמִים בָּאִים עֲלֵיכֶם
  choice: 日子将临到你们
  rationale: 保留先知宣告的固定表达及 עַל 所含威胁临身的意味，不明确添加原文未说明的具体日期。
- source_word: וְנִשָּׂא אֶתְכֶם
  choice: 人必……把你们钩走
  rationale: 三单动词在语境中可作不定施事者；中文用泛指“人”自然表达，不武断指定上帝或某一敌军为语法主语。
- source_word: בְּצִנּוֹת
  choice: 用钩子
  rationale: 该词意义有困难，但与下句捕鱼器具的平行及掳走意象支持“钩子”；具体材质和形制不作过度限定。
- source_word: וְאַחֲרִיתְכֶן
  choice: 连你们中最后剩下的人
  rationale: אַחֲרִית 可指末后、结局或剩余部分；在全民被掳的语境中，此译凸显连最后留下者也不能幸免，同时用脚注保留其他可能。
- source_word: בְּסִירוֹת דּוּגָה
  choice: 用鱼钩钩走
  rationale: 短语词义有争议；与前句“钩子”的平行支持捕鱼用钩具的理解。重复“钩走”使省略的动词在中文中清楚。
theological_decisions:
- issue: 复合称号 אֲדֹנָי יְהוִה 中神名的译法
  choice: 主耶和华
  alternative: 主上帝；主雅威
  rationale: “主耶和华”在现代中文读者中辨识度高，既保留 אֲדֹנָי 的“主”，又以专名形式呈现四字神名；不将二者压缩成单一称号。
- issue: 上帝凭其圣洁起誓的含义
  choice: 直译为“凭自己的圣洁起誓”
  alternative: 凭自己的圣所起誓
  rationale: 语境和先知书中的类似表达支持“圣洁”这一神的属性；译文不进一步解释誓言如何以圣洁作担保。
- issue: 掳走行动的施事者
  choice: 采用不定施事者“人”
  alternative: 他必把你们带走；敌人必把你们带走
  rationale: 原文虽为三单形式，但可作非人称或不定主语。避免在神的主权和人间执行者之间作原文未明说的神学裁决。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“看哪”保留先知宣告的警示语气；“钩走”强化原文具体而严厉的被掳图像。主文本中的脚注标记应与脚注完全对应。
