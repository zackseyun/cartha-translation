id: AMO.4.12
reference: Amos 4:12
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: לָ/כֵ֕ן כֹּ֥ה אֶעֱשֶׂה לְּ/ךָ֖ יִשְׂרָאֵ֑ל עֵ֚קֶב כִּֽי זֹ֣את אֶֽעֱשֶׂה לָּ֔/ךְ הִכּ֥וֹן לִ/קְרַאת אֱלֹהֶ֖י/ךָ יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/004/012.yaml
  text: Therefore[a], thus I will do to you, Israel; because I will do this to you, prepare to meet your God, Israel.
translation:
  language: zh_hans
  text: 因此，我要这样待你，以色列；因为我要这样待你，你要预备迎见你的上帝，以色列！[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “迎见”也可译作“面对”。按上下文，这次相遇是上帝宣告审判之后令人畏惧的对质。
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: 因此
  rationale: 承接上文一再临到以色列的惩罚，表达由此得出的结论，符合先知宣告的转折。
- source_word: כֹּה אֶעֱשֶׂה לְּךָ
  choice: 我要这样待你
  rationale: כֹּה 指向所宣告的行动；עשה לך 字面较宽泛。译作“这样待你”既自然，也不把上下文中的敌对行动具体化到原文未明说的程度。
- source_word: עֵקֶב כִּי
  choice: 因为
  rationale: 引出随后命令的缘由；保留原文重复“我要这样待你”所形成的强调和紧迫感。
- source_word: הִכּוֹן
  choice: 你要预备
  rationale: 该命令式表达做好准备。补出主语“你”，使现代汉语清楚自然。
- source_word: לִקְרַאת
  choice: 迎见
  rationale: 表达走向并面对一次相遇；“迎见”庄重且保留相遇本身的措辞，不在正文中直接增译“受审判”。
- source_word: אֱלֹהֶיךָ
  choice: 你的上帝
  rationale: 保留第二人称单数领属形式，以及上帝与以色列之间直接而带有约的关系的称呼。
- source_word: יִשְׂרָאֵל
  choice: 以色列
  rationale: 采用现代汉语圣经传统通行的专名译法，并保留本节首尾两次呼告。
theological_decisions:
- issue: “预备迎见你的上帝”的语气
  choice: 正文保留简洁命令，脚注说明在本段语境中这是面对审判的可畏相遇
  alternative: 直接译成“预备面对你的上帝的审判”，或理解为中性、盼望性的敬拜或悔改邀请
  rationale: 上文列举惩罚，本节又宣告上帝将继续行动，因此主要语气是迫近的审判和对质；但希伯来文本身只说“迎见”，未明确写出“审判”，故不把解释加入正文。
- issue: כֹּה 所指行动的具体内容
  choice: 译作“这样待你”，保持指示内容的开放性
  alternative: 具体译成“这样惩罚你”或“攻击你”
  rationale: 审判性质从上下文十分明显，但 עשה 本身宽泛；保留其含蓄性可避免超出原文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“这样待你”比生硬的“这样向你行”更自然，同时维持原文的概括性；分号和末尾感叹号呈现宣告与警告的力度。脚注标记置于整节末尾，对应“迎见”的词义及语境说明。
