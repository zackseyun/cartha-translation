base_translation:
  language: en
  yaml_path: translation/ot/amos/004/003.yaml
  text: And through the breaches you will go out[a], each woman straight ahead of her[b], and you will be cast out toward Harmon,” declares Yahweh.
translation:
  language: zh_hans
  text: 你们要从破口出去，各个女人都径直向前[a]；你们要被抛到哈摩拿[b]。——这是雅威的宣告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“女人在她面前（或：与她相对）”。这里很可能是分配性的说法，指各个女人都从自己正前方的破口出去。
    reason: lexical_alternative
  - marker: b
    text: “哈摩拿”所对应的希伯来词含义及所指不明；也可能译作“堡垒”或“黑门”。本分句的动词形式和句法也较难确定。
    reason: alternative_reading
lexical_decisions:
- source_word: וּפְרָצִים
  choice: 从城墙的破口
  rationale: פְרָצִים指墙上的裂口或缺口；上下文描写人从被攻破的城中出去，因此补出“城墙”可自然表达隐含场景。
- source_word: תֵּצֶאנָה
  choice: 你们要……出去
  rationale: 这是יצא的Qal未完成式第二人称阴性复数，基本义为“出去”；保留主动形式，不把上下文所暗示的强迫流放写进动词本身。
- source_word: אִשָּׁה נֶגְדָּהּ
  choice: 各人径直向前
  rationale: אִשָּׁה在这里具有逐一分配的作用；נֶגְדָּהּ直译为“在她面前／与她相对”，语境中很可能指每个人从自己正前方的破口直行出去。
- source_word: וְהִשְׁלַכְתֶּנָה
  choice: 你们要被抛往
  rationale: 词形及句法较难确定；按上下文采用非人称或近似被动的理解，表达妇女遭驱逐，却不指明施事者。
- source_word: הַהַרְמוֹנָה
  choice: 哈摩拿
  rationale: 该词含义和所指不明，可能是地名，也可能另有解释；音译可避免武断地确定为“堡垒”或“黑门”。词尾方向形式以“往”表达。
- source_word: נְאֻם יְהוָה
  choice: 这是雅威的宣告
  rationale: נְאֻם是先知话语中常见的宣告公式；将神名יְהוָה按其专名译作“雅威”。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华／上主
  rationale: 原文直接使用四字神名；采用现代汉语常见的音译“雅威”，保留其作为专名的性质。
- issue: 被驱逐的施事者
  choice: 不指明施事者
  alternative: 明确写成雅威或敌军把她们抛出去
  rationale: 原文在这一分句中没有明确说出施事者；被动式中文保留这种开放性，避免增加原文未明说的神学或历史判断。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“城墙的破口”使场景清楚，但不扩写城破细节；“径直向前”传达逐人从眼前缺口出去的画面；对晦涩的הַהַרְמוֹנָה采用音译，并以脚注保存其他可能。
