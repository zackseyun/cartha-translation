source:
  edition: WLC
  text: וְ/גַם אֲנִי֩ נָתַ֨תִּי לָ/כֶ֜ם נִקְי֤וֹן שִׁנַּ֨יִם֙ בְּ/כָל עָ֣רֵי/כֶ֔ם וְ/חֹ֣סֶר לֶ֔חֶם בְּ/כֹ֖ל מְקוֹמֹֽתֵי/כֶ֑ם וְ/לֹֽא שַׁבְתֶּ֥ם עָדַ֖/י נְאֻם יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/004/006.yaml
  text: And I also gave you cleanness of teeth in all your cities[a], and lack of bread in all your places; yet you did not return to me, declares Yahweh.
translation:
  language: zh_hans
  text: 我也使你们在所有城中牙齿洁净[a]，在你们各处缺少粮食；你们却没有回转归向我。这是雅威的宣告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“牙齿洁净”，是指没有东西可吃，所以牙齿保持干净。
    reason: 解释希伯来语习语，同时保留正文中的原始意象。
lexical_decisions:
- source_word: וְגַם אֲנִי
  choice: 我也
  rationale: 保留וְגַם的递加强调和独立代词אֲנִי的强调作用，同时采用自然的现代汉语语序。
- source_word: נָתַתִּי לָכֶם
  choice: 使你们
  rationale: 本句所“给”的是饥荒造成的处境；译作“使你们”既保留上帝主动施行审判的含义，也避免“给你们牙齿干净”在汉语中的生硬表达。
- source_word: נִקְיוֹן שִׁנַּיִם
  choice: 牙齿干净
  rationale: 保留希伯来文鲜明的字面意象；其含义是无食物可吃，因此牙齿保持干净，并由脚注说明。
- source_word: בְּכָל עָרֵיכֶם
  choice: 你们所有城里的人
  rationale: 准确表达“在你们所有的城中”，并补出“人”以使“牙齿干净”的主语在现代汉语中清楚自然。
- source_word: וְחֹסֶר לֶחֶם
  choice: 缺少食物
  rationale: לֶחֶם可指面包、粮食或一般食物；此处与饥饿意象平行，译作“食物”比字面的“饼”更符合现代汉语，同时不把它直接窄化为“饥荒”。
- source_word: בְּכֹל מְקוֹמֹתֵיכֶם
  choice: 你们各处
  rationale: 保留מְקוֹמוֹת比“城”更宽泛的范围，也维持两行之间的平行而不重复译成“各城”。
- source_word: וְלֹא שַׁבְתֶּם עָדַי
  choice: 你们却没有回转归向我
  rationale: “回转归向”兼顾שׁוּב的转回动作和עָדַי所表达的归向目标，不将其仅解释为内心悔改。
- source_word: נְאֻם יְהוָה
  choice: 这是雅威的宣告
  rationale: “宣告”体现先知话语的固定公式；“雅威”按该希伯来专名的可能发音音译，保留经文直接使用神圣名字这一特点。
theological_decisions:
- issue: 神圣名字יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；音译为“雅威”保留其专名性质，并避免以称号替代。
- issue: 是否在正文中直接解释נִקְיוֹן שִׁנַּיִם
  choice: 保留“牙齿干净”的意象，并以脚注解释
  alternative: 没有东西吃；挨饿
  rationale: 下半句“缺少食物”已提示其含义；保留原有意象能维持先知话语的修辞力度，而不把隐喻完全化解。
- issue: שׁוּב עַד所包含的回转含义
  choice: 回转归向我
  alternative: 向我悔改；回到我这里
  rationale: 该表达既可包含悔改，也强调重新归向上帝；译文保留这层较宽的盟约性张力。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“牙齿干净”刻意保留原文突出的饥饿意象；分号呈现审判与百姓仍不回转之间的转折。
