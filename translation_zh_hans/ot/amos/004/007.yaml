id: AMO.4.7
reference: Amos 4:7
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/גַ֣ם אָנֹכִי֩ מָנַ֨עְתִּי מִ/כֶּ֜ם אֶת הַ/גֶּ֗שֶׁם בְּ/ע֨וֹד שְׁלֹשָׁ֤ה חֳדָשִׁים֙ לַ/קָּצִ֔יר וְ/הִמְטַרְתִּי֙ עַל עִ֣יר אֶחָ֔ת וְ/עַל עִ֥יר אַחַ֖ת לֹ֣א אַמְטִ֑יר חֶלְקָ֤ה אַחַת֙ תִּמָּטֵ֔ר וְ/חֶלְקָ֛ה אֲשֶֽׁר לֹֽא תַמְטִ֥יר עָלֶ֖י/הָ תִּיבָֽשׁ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/004/007.yaml
  text: And I also withheld the rain from you when there were still three months until the harvest; and I caused it to rain on one city[a], but on another city I did not cause it to rain. One field received rain, but the field on which it did not rain dried up.
translation:
  language: zh_hans
  text: “离收割还有三个月的时候，我也使你们得不到雨水；我使雨降在一座城，却不使雨降在另一座城。一块田地得了雨；另一块没有雨降在上面的田地便枯干了。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְגַם אָנֹכִי
  choice: 我也
  rationale: 保留גַם的递进、追加意味，并以明确的第一人称承接上下文中的审判；独立代词אָנֹכִי所带的强调由“我也”在汉语语序中自然体现。
- source_word: מָנַעְתִּי מִכֶּם אֶת הַגֶּשֶׁם
  choice: 扣住雨，不让雨降给你们
  rationale: מנע与מן连用表示扣留、不给；此译既保留主动施事者，也以自然汉语说明以色列人被剥夺雨水。
- source_word: בְּעוֹד שְׁלֹשָׁה חֳדָשִׁים לַקָּצִיר
  choice: 离收割还有三个月的时候
  rationale: 准确表达בְּעוֹד所指尚余的一段时间，也保留旱灾发生在收割前关键时期的农业背景。
- source_word: וְהִמְטַרְתִּי
  choice: 我使雨降在
  rationale: 保留Hiphil使役形的因果意义和上帝主动掌管降雨的表述。
- source_word: עַל עִיר אֶחָת ... וְעַל עִיר אַחַת לֹא אַמְטִיר
  choice: 雨降在一座城，却不使雨降在另一座城
  rationale: 保留两座城之间刻意而鲜明的平行对比，并重复“城”，贴近希伯来文结构。
- source_word: חֶלְקָה אַחַת
  choice: 一块田地
  rationale: חֶלְקָה指划分出来的一片土地；在降雨和收割的语境中，“田地”清楚自然，同时以脚注保留较宽泛的“地块”译法。
- source_word: תִּמָּטֵר
  choice: 得了雨
  rationale: 以自然汉语表达Niphal被动意义，同时与下句未得雨的田地形成对照。
- source_word: וְחֶלְקָה אֲשֶׁר לֹא תַמְטִיר עָלֶיהָ
  choice: 另一块没有雨降在其上的田地
  rationale: 按语义表达雨没有降在该地上，避免把希伯来文阴性动词形式误解为田地主动降雨，同时不额外指定未明说的施事者。
- source_word: תִּיבָשׁ
  choice: 就干枯了
  rationale: 表达因缺雨而变干、枯竭的结果；用于田地及其作物均自然。
theological_decisions:
- issue: 选择性降雨与旱灾中的神圣行动
  choice: 明确译出第一人称主动行动：“我也扣住雨”“我使雨降在”“不使雨降在”
  alternative: 采用非人称表达，如“雨没有降下”或“有雨降在”
  rationale: 希伯来文反复使用第一人称动词，强调说话者直接施行这场审判；译文不将其淡化为普通天气现象。
- issue: 末句未降雨表达中的施事者
  choice: 译为“没有雨降在其上”，不在该分句补入“我”
  alternative: 译为“我没有使雨降在其上”
  rationale: 该处原文形式与前面的明确第一人称使役动词不同；当前译法保留语义及语法张力，不擅自把前文的第一人称形式补进末句。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以分号划分总述与选择性降雨的展开，以“却”和“另一块”凸显对比。正文保留上帝直接行动的力度，同时避免生硬照搬希伯来语被动结构。
