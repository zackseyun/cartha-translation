- from: “离收割还有三个月的时候，我也扣住雨，不让雨降给你们；我使雨降在一座城，却不使雨降在另一座城。一块田地[a]得了雨，另一块没有雨降在其上的田地就干枯了。”
  to: “离收割还有三个月的时候，我也使你们得不到雨水；我使雨降在一座城，却不使雨降在另一座城。一块田地得了雨；另一块没有雨降在上面的田地便枯干了。”
  rationale: 仅作自然汉语表达的安全修订：以“使你们得不到雨水”替换不自然的“扣住雨，不让雨降给你们”，保留原文第一人称主动扣留雨水的含义；并调整末句语序和连接词，使“得雨／未得雨而枯干”的对照更清楚。脚注的词义说明及其锚点均可保留。
