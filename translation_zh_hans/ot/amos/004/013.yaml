id: AMO.4.13
reference: Amos 4:13
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּ֡י הִנֵּה֩ יוֹצֵ֨ר הָרִ֜ים וּ/בֹרֵ֣א ר֗וּחַ וּ/מַגִּ֤יד לְ/אָדָם֙ מַה שֵּׂח֔/וֹ עֹשֵׂ֥ה שַׁ֨חַר֙ עֵיפָ֔ה וְ/דֹרֵ֖ךְ עַל בָּ֣מֳתֵי אָ֑רֶץ יְהוָ֥ה אֱלֹהֵֽי צְבָא֖וֹת שְׁמֽ/וֹ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/amos/004/013.yaml
  text: For behold[a], the one who forms the mountains and creates the wind, and declares to man what his thought is, who makes the dawn darkness and treads on the heights of the earth—Yahweh, the God of hosts[c][b], is his name.
translation:
  language: zh_hans
  text: 因为，看哪！那塑造群山、创造风[a]，向人[b]指明他心中的意念[c]，使晨曦变为幽暗，又踏在大地高处的——他的名是雅威，万军的上帝。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “风”也可译作“灵”或“气息”；希伯来语 רוּחַ 兼有这些含义。
    reason: lexical_alternative
  - marker: b
    text: “人”也可译作“人类”；希伯来文使用具有代表性的单数 אָדָם。
    reason: lexical_alternative
  - marker: c
    text: 或译“他心里所想的”或“他的沉思”。希伯来语 שֵׂחַ 可指内在的思想、沉思，也可指言谈或诉说；这里通常理解为指那人心中的意念。
    reason: ambiguity
lexical_decisions:
- source_word: כִּי הִנֵּה
  choice: 因为，看哪！
  rationale: כִּי承接上文，说明先前警告的根据；הִנֵּה带有鲜明、庄严的提示语气。分别译出二者。
- source_word: יוֹצֵר הָרִים
  choice: 塑造群山
  rationale: יוֹצֵר含有像工匠一样有意塑形的意味；“塑造”保留这一具体形象。“群山”自然表达带定冠词的复数。
- source_word: וּבֹרֵא רוּחַ
  choice: 创造风
  rationale: רוּחַ可指风、气息或灵；在群山、晨曦和大地高处等宇宙性图景中，“风”最贴切，同时用脚注保留“灵”的可能。
- source_word: וּמַגִּיד לְאָדָם
  choice: 向人指明
  rationale: מַגִּיד表示宣告、告知或揭示；“指明”在此既庄重又自然。אָדָם为代表性的单数，正文保留“人”。
- source_word: מַה שֵּׂחוֹ
  choice: 他的意念
  rationale: שֵׂחַ可表示内在的思想、沉思，也可能涉及言谈或诉说；“意念”保留其内在思想色彩，而“他的”照录希伯来文代词，不在正文中强行消除所指上的含混。
- source_word: עֹשֵׂה שַׁחַר עֵיפָה
  choice: 使晨曦变为幽暗
  rationale: עֵיפָה指黑暗或昏暗；“使……变为……”自然表达这里晨光被转成黑暗的审判性逆转图景。
- source_word: וְדֹרֵךְ עַל בָּמֳתֵי אָרֶץ
  choice: 又踏在大地高处
  rationale: דֹרֵךְ有踩踏、行走之意；בָּמֳתֵי在此与宇宙主权的图景相合，宜译作地势上的“高处”，不解作祭祀的邱坛。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代中文中常见的音译呈现四字神名，保留其作为以色列之上帝专名的性质，不以称号代替。
- source_word: אֱלֹהֵי צְבָאוֹת
  choice: 万军之上帝
  rationale: צְבָאוֹת可指众军或天上的万军；“万军之上帝”保留原文的军事与天军意象，也符合庄重的现代中文表达。
- source_word: שְׁמוֹ
  choice: 他的名是
  rationale: 希伯来文为名词句；中文补出“是”，使高潮性的身份宣告清楚自然。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名。采用“雅威”作为较贴近学界通常重构读音的现代音译，既不以“主”等称号代替，也不把有争议的传统音译写入正文。
- issue: רוּחַ在创造语境中的含义
  choice: 风
  alternative: 灵
  rationale: 本节连续描绘群山、晨曦和大地等受造界景象，因此“风”最符合上下文；但原词确实也可表示“灵”，故以脚注保留神学与词义张力。
- issue: לְאָדָם的范围
  choice: 向人
  alternative: 向人类
  rationale: אָדָם是代表性的单数，可以泛指人类。正文以简洁的“人”对应其形式，脚注说明集合性理解。
- issue: שֵׂחוֹ中第三人称代词的所指
  choice: 保留为“他的意念”
  alternative: 人心里所想的
  rationale: 原文形式本身只说“他的”，通常可理解为那人的内在意念；正文不加原文没有的明确名词，以免过度消解代词所指的含混，脚注说明通常理解。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“看哪”保留先知宣告的强烈提示语气；“塑造群山”“使晨曦变为幽暗”“踏在大地高处”维持原文连续分词所形成的宏大节奏。破折号突出末尾神名与称号的高潮性揭示。
