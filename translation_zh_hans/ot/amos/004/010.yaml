source:
  edition: WLC
  text: שִׁלַּ֨חְתִּי בָ/כֶ֥ם דֶּ֨בֶר֙ בְּ/דֶ֣רֶךְ מִצְרַ֔יִם הָרַ֤גְתִּי בַ/חֶ֨רֶב֙ בַּח֣וּרֵי/כֶ֔ם עִ֖ם שְׁבִ֣י סֽוּסֵי/כֶ֑ם וָ/אַעֲלֶ֞ה בְּאֹ֤שׁ מַחֲנֵי/כֶם֙ וּֽ/בְ/אַפְּ/כֶ֔ם וְ/לֹֽא שַׁבְתֶּ֥ם עָדַ֖/י נְאֻם יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/004/010.yaml
  text: I sent among you a plague in the manner of Egypt[a]; I killed your young men with the sword, along with your captured horses, and I made the stench of your camps rise even into your nostrils; yet you did not return to me[b], declares Yahweh.
translation:
  language: zh_hans
  text: “我把瘟疫降在你们中间，按埃及所受的灾祸[a]；我用刀剑杀了你们的青年人，连同你们被掳的马匹[b]。我使你们营地的恶臭升到你们鼻中；可是你们仍没有回到我这里。”这是雅威的宣告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译可作“按埃及的方式”或“照埃及的道路”；在本句语境中，很可能指埃及所遭受的灾祸。
    reason: 原文בְּדֶרֶךְ מִצְרַיִם中的“道路/方式”具有词义上的伸缩性；正文按上下文采用“按埃及所受的灾祸”，脚注保留其字面表达而不将较不可能的道路义当作同等译法。
  - marker: b
    text: 希伯来文直译近于“连同你们马匹的被掳”。这凝练地描述军事败亡；青年人被杀与马匹被掳的确切句法关系未充分展开。
    reason: 保留עִם שְׁבִי סוּסֵיכֶם的压缩性与解释余地，不把其关系确定为单一的时间或因果关系。
lexical_decisions:
- source_word: שִׁלַּחְתִּי בָכֶם דֶּבֶר
  choice: 降瘟疫在你们中间
  rationale: שׁלח与灾祸连用表示使灾祸临到；בָכֶם在这里自然理解为“在你们中间”。“瘟疫”准确表达דֶּבֶר所指的致命疫病，也符合现代汉语。
- source_word: בְּדֶרֶךְ מִצְרַיִם
  choice: 照埃及的方式
  rationale: דֶּרֶךְ既可指道路，也可指方式。上下文很可能是在唤起埃及所受的灾祸，但原文的凝练和歧义值得保留，因此正文采用较贴近原文的表达，并以脚注说明。
- source_word: הָרַגְתִּי בַחֶרֶב בַּחוּרֵיכֶם
  choice: 我用刀剑杀了你们的青年人
  rationale: 直译הרג的严厉语气；בַּחוּרִים通常指正值壮年的青年人，军事语境虽暗示他们可能是战士，正文不把词义收窄为“勇士”。
- source_word: עִם שְׁבִי סוּסֵיכֶם
  choice: 你们的马也被掳去
  rationale: 原文是压缩的名词结构，直译近于“连同你们马匹的被掳”。汉语用被动分句表达同一场军事败亡，同时避免把马拟人化为“被俘”。
- source_word: וָאַעֲלֶה בְּאֹשׁ מַחֲנֵיכֶם וּבְאַפְּכֶם
  choice: 我使你们营地的恶臭上腾，直冲你们的鼻孔
  rationale: 保留“使……上腾”的因果结构和אַף在气味语境中的具体义“鼻孔”；“直冲”自然呈现气味上达鼻孔的强烈画面。
- source_word: וְלֹא שַׁבְתֶּם עָדַי
  choice: 可是你们仍没有回到我这里
  rationale: שׁוב在此具有悔改归向的盟约含义，但字面动作是“回来、归回”；译文保留这一意象，不扩写成教义性释义。
- source_word: נְאֻם יְהוָה
  choice: 这是雅威的宣告
  rationale: נְאֻם是先知话语中庄严的宣告公式；יְהוָה按专名音译为“雅威”，不以称号替代。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文明确使用四字神名。采用较接近YHWH学术重构读音的现代汉语音译“雅威”，保留其专名性质，不以“主”这一称号替换。
- issue: וְלֹא שַׁבְתֶּם עָדַי中的悔改含义
  choice: 你们仍没有回到我这里
  alternative: 你们仍没有悔改归向我
  rationale: “回到我这里”既保留שׁוב的基本空间隐喻，也让其在审判语境中的悔改含义自然显现，而不在正文中加上原文没有明说的双重动词。
- issue: 灾祸中的神圣施事
  choice: 保留“我降……我杀……我使……”
  alternative: 改用弱化施事关系的被动表达
  rationale: 希伯来文连续使用第一人称动词，将这些审判行动明确归于说话者；译文不回避或缓和这一神学张力。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。保留先知审判宣告的直接、强烈语气；避免文言化的“瘟殁、少壮、归向”等表达，也不以解释性措辞消除原文在“埃及的方式”和“马匹被掳”两处的含混。
