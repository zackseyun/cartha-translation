id: AMO.4.11
reference: Amos 4:11
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: הָפַ֣כְתִּי בָ/כֶ֗ם כְּ/מַהְפֵּכַ֤ת אֱלֹהִים֙ אֶת סְדֹ֣ם וְ/אֶת עֲמֹרָ֔ה וַ/תִּהְי֕וּ כְּ/א֖וּד מֻצָּ֣ל מִ/שְׂרֵפָ֑ה וְ/לֹֽא שַׁבְתֶּ֥ם עָדַ֖/י נְאֻם יְהוָֽה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/amos/004/011.yaml
  text: I overthrew some among you as God overthrew Sodom and Gomorrah[a], and you became like a brand snatched from the burning; yet you did not return to me[c][b], declares Yahweh.
translation:
  language: zh_hans
  text: 我在你们中间施行倾覆[a]，如同上帝倾覆所多玛和蛾摩拉一样[b]；你们却成了从火中抢救出来的一根柴[c]。然而你们仍没有归向我。这是耶和华的宣告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可理解为“我倾覆了你们中间的一些人”；希伯来文介词本身没有明确说出“一些人”。
    reason: 保留 בָכֶם 是否应明确作部分义的歧义。
  - marker: b
    text: 直译作“如同上帝对所多玛和蛾摩拉所施行的倾覆”。
    reason: 说明 כְּמַהְפֵּכַת אֱלֹהִים 的名词结构及其自然的动词化译法。
  - marker: c
    text: 也可译作“像一根从烈火中抽出来的柴”或“像一根从大火中救出的焦木”。
    reason: 说明 אוּד 和 מֻצָּל מִשְּׂרֵפָה 的具体火中木柴意象及自然表达的差异。
lexical_decisions:
- source_word: הָפַכְתִּי
  choice: 我倾覆了
  rationale: 在审判语境中，הפך 表示彻底倾覆、毁灭；“倾覆”既贴近词义，也保留与所多玛、蛾摩拉叙事的呼应。
- source_word: בָכֶם
  choice: 你们中间的一些人
  rationale: ב 加复数代词后缀在此可作部分义，表示审判临到以色列群体中的一部分人；正文明确表达这一自然理解，同时以脚注保留较不明确的读法。
- source_word: כְּמַהְפֵּכַת אֱלֹהִים
  choice: 如同上帝倾覆……一样
  rationale: 希伯来文是“如同上帝的倾覆”这一名词结构，语义上指上帝施行的倾覆；汉语改为动词结构较自然。
- source_word: סְדֹם וְאֶת עֲמֹרָה
  choice: 所多玛和蛾摩拉
  rationale: 采用现代中文圣经传统中通行且易识别的地名译法。
- source_word: וַתִּהְיוּ
  choice: 你们就像
  rationale: 此处 היה 表示审判之后形成的结果状态；结合后面的比喻，译为“你们就像”自然地体现“成为”的结果义。
- source_word: כְּאוּד
  choice: 像……一根柴
  rationale: אוּד 指火中燃烧或烧焦的木柴。现代汉语“柴”清楚自然，配合“从烈火中抽出来”保留火中余木的意象。
- source_word: מֻצָּל מִשְּׂרֵפָה
  choice: 从烈火中抽出来的
  rationale: מֻצָּל 是 נצל 的被动形式，表示从危险中被救出；“抽出来”贴合迅速从火中取出木柴的具体图像。מִשְּׂרֵפָה 指燃烧或大火，译作“烈火”符合汉语表达。
- source_word: וְלֹא שַׁבְתֶּם עָדַי
  choice: 然而你们仍没有归向我
  rationale: שׁוב 与 עַד 连用表示回到上帝这里，包含悔改和恢复关系的广泛意义；“归向我”保留先知性和关系性的表达。
- source_word: נְאֻם יְהוָה
  choice: 这是耶和华的宣告
  rationale: נְאֻם 是庄重的先知宣告公式；“这是……的宣告”自然且保留其权威语气。יהוה 采用中文读者熟悉的专名“耶和华”，而不以称号替代。
theological_decisions:
- issue: יהוה 的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 原文直接使用四字神名。中文正文用广为人知的专名“耶和华”，既表明这是名字而非一般称号，也符合现代普通读者的辨识习惯。
- issue: 先知语境中 שׁוב 的含义
  choice: 归向我
  alternative: 回到我这里；向我悔改
  rationale: “归向”既包含行为转回，也包含悔改及关系恢复，不把原文宽广的圣约性呼召缩窄为内在懊悔。
- issue: 审判与余民图像的张力
  choice: 保留“从烈火中抽出来的一根柴”
  alternative: 从灾难中获救的余民
  rationale: 原文借具体比喻同时表达近乎毁灭与侥幸蒙救的张力；不将其解释性改写成抽象的“余民”概念。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“倾覆”保留先知审判语气；“从烈火中抽出来的一根柴”使用普通读者可理解的具体图像；“归向我”保留圣经先知语言的凝练感。所有脚注标记均置于其所解释的正文之后。
