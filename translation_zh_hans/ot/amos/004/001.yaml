  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: שִׁמְע֞וּ הַ/דָּבָ֣ר הַ/זֶּ֗ה פָּר֤וֹת הַ/בָּשָׁן֙ אֲשֶׁר֙ בְּ/הַ֣ר שֹֽׁמְר֔וֹן הָ/עֹשְׁק֣וֹת דַּלִּ֔ים הָ/רֹצְצ֖וֹת אֶבְיוֹנִ֑ים הָ/אֹמְרֹ֥ת לַ/אֲדֹֽנֵי/הֶ֖ם הָבִ֥יאָ/ה וְ/נִשְׁתֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/004/001.yaml
  text: Hear this word[a], you cows of Bashan, who are on the mountain of Samaria, who oppress the poor, who crush the needy, who say to their masters, “Bring[b], that we may drink.”
translation:
  language: zh_hans
  text: 你们这些在撒玛利亚山上的巴珊的母牛[b]啊，要听这话！你们欺压贫寒人，压碎穷乏人，对自己的主人[a]说：“拿来吧，让我们喝！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “主人”也可译作“丈夫”。希伯来词可按语境指主人、主或丈夫。
    reason: alternative_reading
  - marker: b
    text: 巴珊位于约旦河东，以土地肥沃、牲畜肥壮著称；这里用“巴珊的母牛”讥刺那些生活奢华却欺压穷人的妇女。
    reason: cultural_note
lexical_decisions:
- source_word: שִׁמְעוּ הַדָּבָר הַזֶּה
  choice: 要听这话
  rationale: 复数祈使语气保留先知宣告的直接力度；“这话”贴近 דָּבָר，并比“这个信息”更庄重凝练。
- source_word: פָּרוֹת הַבָּשָׁן
  choice: 巴珊的母牛
  rationale: פָּרוֹת 明指雌性牛；直译保留针对撒玛利亚富贵妇女的尖锐贬斥性比喻。
- source_word: בְּהַר שֹׁמְרוֹן
  choice: 住在撒玛利亚山上
  rationale: 介词短语表示所在地；补出“住”使现代汉语自然，同时保留单数 הַר 的“山”。
- source_word: הָעֹשְׁקוֹת דַּלִּים
  choice: 欺压贫寒人
  rationale: עָשַׁק 表示压迫、剥削；“欺压”兼顾社会与经济层面的侵害。דַּלִּים 译作“贫寒人”，并与下一分句的“穷乏人”稍作区分。
- source_word: הָרֹצְצוֹת אֶבְיוֹנִים
  choice: 压碎穷乏人
  rationale: “压碎”保留 רָצַץ 强烈而具象的暴力隐喻，不弱化为一般的“虐待”。
- source_word: לַאֲדֹנֵיהֶם
  choice: 对自己的主人
  rationale: אֲדֹנִים 可指主人、主或丈夫；正文采用词义较宽的“主人”，不在正文中锁定婚姻关系。
- source_word: הָבִיאָה וְנִשְׁתֶּה
  choice: 拿来吧，让我们喝
  rationale: 原文未说明所拿之物，译文同样不补宾语；“让我们喝”自然表达随后意愿，并保留命令与饮宴要求之间的紧密关系。
theological_decisions:
- issue: “巴珊的母牛”所指对象
  choice: 保留阴性复数形式所支持的理解，即以尖锐比喻直接斥责撒玛利亚养尊处优、参与压迫的富贵妇女。
  alternative: 把它泛指撒玛利亚所有奢华的权贵阶层，而不限于妇女。
  rationale: 本节的名词、分词和动词均使用阴性复数形式，因此妇女是最直接的语法所指；但正文只保留比喻，不额外加入身份说明。
- issue: לַאֲדֹנֵיהֶם 的关系含义
  choice: 主人
  alternative: 丈夫；主子
  rationale: 希伯来词本身没有在此明确限定为丈夫。采用较宽的“主人”，并以脚注保存“丈夫”这一合乎语境的可能解释。
translation_notes:
  register: 采用现代、庄重而有先知谴责力度的普通话。保留“母牛”“压碎”等刺耳意象，不加以柔化。脚注标记置于全节末尾，分别对应“主人”的歧义和“巴珊的母牛”的文化背景。
