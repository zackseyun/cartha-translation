  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה עַל שְׁלֹשָׁה֙ פִּשְׁעֵ֣י אֱד֔וֹם וְ/עַל אַרְבָּעָ֖ה לֹ֣א אֲשִׁיבֶ֑/נּוּ עַל רָדְפ֨/וֹ בַ/חֶ֤רֶב אָחִי/ו֙ וְ/שִׁחֵ֣ת רַחֲמָ֔י/ו וַ/יִּטְרֹ֤ף לָ/עַד֙ אַפּ֔/וֹ וְ/עֶבְרָת֖/וֹ שְׁמָ֥רָ/ה נֶֽצַח־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/001/011.yaml
  text: 'Thus says Yahweh: “For three transgressions of Edom[a], and for four, I will not revoke its punishment, because he pursued his brother with the sword and destroyed his compassion; his anger tore continually[c][b], and he kept his wrath forever.”'
translation:
  language: zh_hans
  text: '雅威如此说：


    “以东犯了三样过犯，甚至四样，

    我必不撤回[a]对他的惩罚；


    因为他持刀追赶自己的兄弟[b]，

    泯灭了自己的怜悯之心；


    他的怒气不断地撕裂[c]，

    他永远持守自己的烈怒。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译近于“我必不使它返回”；可指雅威不撤回已经宣告的审判。
    reason: lexical_alternative
  - marker: b
    text: “兄弟”很可能令人想起以东与以色列的亲缘关系：以东源于以扫，以色列源于雅各。
    reason: cross_reference
  - marker: c
    text: 或译：“他在怒气中不断撕裂吞噬。”原文采用猛兽撕裂猎物的鲜明意象；“他的怒气”也可理解为撕扯的主语。
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语中常见的音译保留上帝的专名，不以称号替代。
- source_word: פִּשְׁעֵי
  choice: 背叛
  rationale: 该词指严重的越界与反叛；在阿摩司的审判套语中，“背叛”能保留其道德及关系层面的力度。
- source_word: לֹא אֲשִׁיבֶנּוּ
  choice: 我必不撤回对他的惩罚
  rationale: 原文直译近于“我必不使它返回”，宾语所指并未明说；正文补出语境所含的“惩罚”，使汉语清楚，脚注保留原文的开放性。
- source_word: אֱדוֹם
  choice: 以东
  rationale: 采用该民族和国家名称的标准汉译。
- source_word: רָדְפוֹ בַחֶרֶב
  choice: 他持刀追赶
  rationale: 保留单数形式和以东被人格化的表达；“持刀”自然传达以刀剑追杀的意思。
- source_word: אָחִיו
  choice: 自己的兄弟
  rationale: 直译亲属称谓，不在正文中改成解释性的“兄弟民族”，从而保留其历史暗示。
- source_word: שִׁחֵת רַחֲמָיו
  choice: 泯灭了自己的怜悯之心
  rationale: רַחֲמִים 表示怜悯、同情；“泯灭”表达将本应有的骨肉怜悯摧毁或压灭。
- source_word: וַיִּטְרֹף לָעַד אַפּוֹ
  choice: 他的怒气不断撕扯
  rationale: 保留 טָרַף 如猛兽撕裂猎物的鲜明意象，并将 לָעַד 表达为持续不断；不把隐喻平化为单纯“发怒”。
- source_word: וְעֶבְרָתוֹ שְׁמָרָה נֶצַח
  choice: 他的烈怒永远不息
  rationale: 以自然汉语表达“把烈怒永远保留”的持续含义，并与前句形成平行。
theological_decisions:
- issue: 以东作为国家却使用阳性单数形式
  choice: 以单数男性代词“他”人格化以东
  alternative: 使用“它”或复数“他们”指以东及其人民
  rationale: 原文持续采用阳性单数形式；保留“他”可维持先知话语中对以东的拟人化控诉，并使“自己的兄弟”这一亲族指控更鲜明。
- issue: “兄弟”的历史所指
  choice: 正文保留“兄弟”，脚注提示以扫与雅各的亲缘背景
  alternative: 正文解释为“兄弟民族以色列”
  rationale: 原文没有直接写出以色列；保留字面称谓既保存历史暗示，也避免把可能的所指完全锁定在解释性措辞中。
- issue: לֹא אֲשִׁיבֶנּוּ 的省略宾语
  choice: 正文译为“不撤回对他的惩罚”，脚注说明直译可能
  alternative: 直译为“我必不使它返回”或译为“我必不收回”
  rationale: 上下文指向已经宣告的审判，但希伯来文宾语本身含混；正文以可懂的汉语传达语用意义，脚注保存形式与解释空间。
- issue: 怒气“撕扯”的句法与意象
  choice: 译为“他的怒气不断撕扯”
  alternative: 译为“他在怒气中不断撕裂吞噬”
  rationale: 马所拉文本最自然地可把“他的怒气”理解为撕扯的主语；正文保留这种紧张而鲜明的拟人化，脚注列出另一种句法理解。
translation_notes:
  register: 采用庄重而清晰的现代标准汉语。诗行保留审判宣告的节奏和平行结构；“三番四次”自然呈现“三次……四次……”这一递增套语。“泯灭怜悯之心”与“怒气不断撕扯”兼顾可读性及原文强烈意象。
