  text: So I will send fire upon the wall of Gaza[a], and it will consume her citadels.
translation:
  language: zh_hans
  text: 我必降火在迦萨的城墙上；火必吞噬她的宫殿[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “宫殿”也可指设防的宫殿或堡垒；原文用词常指王室或权贵的建筑，并可含坚固、防御性的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁלַּחְתִּי
  choice: 所以，我要把……降在
  rationale: פיעל式第一人称单数表达耶和华亲自施行的行动；句首连接词结合审判宣告的上下文译为“所以”，并以“把火降在”构成自然的现代汉语。
- source_word: אֵשׁ
  choice: 火
  rationale: 保留原文直义及先知书中审判的意象，不作解释性改写。
- source_word: בְּחוֹמַת עַזָּה
  choice: 在迦萨的城墙上
  rationale: 介词ב在“降火”结构中表示火临到并攻击城墙；“在……上”既贴近原文，也符合现代汉语表达。עַזָּה采用通行地名“迦萨”。
- source_word: וְאָכְלָה
  choice: 火必吞噬
  rationale: 该阴性单数动词以“火”为主语，在审判预言中表达随之发生的结果；重复“火”可在汉语中清楚标明主语，“吞噬”保留原词强烈而具象的毁灭意味。
- source_word: אַרְמְנֹתֶיהָ
  choice: 她的宫堡
  rationale: אַרְמוֹן可指宫殿，也可侧重有防御性质的权贵建筑或堡垒；“宫堡”兼顾宫室与坚固据点两层含义。阴性单数后缀译作“她的”，保留对迦萨城的拟人化。
theological_decisions:
- issue: 迦萨城的阴性单数代词后缀
  choice: 她的宫堡
  alternative: 迦萨的宫堡／城中的宫堡
  rationale: 原文以阴性单数后缀指代迦萨，体现先知话语中对城市的拟人化；译作“她的”保留这一修辞特征，并不附加额外教义含义。
- issue: 火的作用是直接焚毁还是拟人化吞噬
  choice: 火必吞噬
  alternative: 火必烧毁
  rationale: 原动词אָכַל本义为“吃、吞吃”，用于火时表示烧尽。“吞噬”在现代汉语中自然，也保留原文的具象张力；“烧毁”虽清楚，却削弱了该意象。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“所以”承接前文审判理由；分号突出降火与吞噬之间的结果关系。“她”有意保留原文对城市的拟人化。“宫堡”虽不如“宫殿”常见，但能较凝练地保存原词兼具宫室与堡垒色彩的语义范围，并以脚注说明替代译法。
