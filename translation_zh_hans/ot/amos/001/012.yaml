  text: וְ/שִׁלַּ֥חְתִּי אֵ֖שׁ בְּ/תֵימָ֑ן וְ/אָכְלָ֖ה אַרְמְנ֥וֹת בָּצְרָֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/amos/001/012.yaml
  text: So I will send fire upon Teman[a], and it will consume the citadels of Bozrah.
translation:
  language: zh_hans
  text: 我必向提幔降下火；这火必吞灭波斯拉的堡垒[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “堡垒”或译“宫殿”。希伯来语这个词可指宫殿式住所，也可指设防的坚固建筑。
    reason: 保留אַרְמְנוֹת在宫殿式建筑与坚固防御建筑之间的词义幅度。
lexical_decisions:
- source_word: וְ/שִׁלַּחְתִּי
  choice: 所以，我要……降
  rationale: שׁלח在此为“差遣、发出”；与“火”搭配时，现代汉语自然表达为“降火”。句首连接词וְ承接上文罪状并引出审判结果，译作“所以”体现其语境中的承接和结果意味。
- source_word: אֵשׁ
  choice: 火
  rationale: 按其通常义直译为“火”，保留阿摩司审判宣告中具体而强烈的意象，不将其抽象化为一般性的灾祸。
- source_word: בְּ/תֵימָן
  choice: 向提幔
  rationale: תֵימָן为地名，音译作“提幔”。介词בְ在“降火”的审判语境中表示火所针对的地点，汉语以“向提幔”最为自然。
- source_word: וְ/אָכְלָה
  choice: 火必吞灭
  rationale: אכל本义为“吃”，以火为主语时表示“吞噬、烧尽”。译作“吞灭”既合乎现代汉语，也保留原文拟人化的毁灭力度；明说“火”可清楚呈现阴性动词所回指的主语。
- source_word: אַרְמְנוֹת
  choice: 堡垒
  rationale: 该词可指宫殿式建筑、权贵住所或设防的坚固建筑。正文采用“堡垒”，突出审判临到城中坚固防御中心；以脚注保留“宫殿”这一真实词义可能。
- source_word: בָּצְרָה
  choice: 波斯拉的
  rationale: בָּצְרָה为以东的重要城名，音译作“波斯拉”；它与前词构成所属关系，故译为“波斯拉的堡垒”。
theological_decisions:
- issue: 先知审判宣告中的火
  choice: 保留上帝直接降火、火吞灭堡垒的具体表述
  alternative: 将“火”解释性地改译为泛指的毁灭或灾难
  rationale: 原文采用固定而具体的审判宣告形式，没有要求译者判定火仅为隐喻；直译其意象可避免削弱上帝施行审判的力度，同时不额外规定其实现方式。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“向……降火”符合汉语审判宣告语感；“吞灭”保留原文火如同吞吃的形象。脚注标记置于其实际说明的“堡垒”之后。
