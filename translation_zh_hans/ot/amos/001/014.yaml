base_translation:
  language: en
  yaml_path: translation/ot/amos/001/014.yaml
  text: I will kindle a fire in the wall of Rabbah[a], and it will consume her citadels, with a battle cry on the day of war[c][b], with a storm on the day of tempest.
translation:
  language: zh_hans
  text: 我要在拉巴的城墙中放火；那火必吞灭她的堡垒[a]，在争战之日，伴着呐喊[b]；在暴风之日，以狂风相伴[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “堡垒”也可译为“宫殿”或“城堡”。
    reason: lexical_alternative
  - marker: b
    text: “呐喊”所译的希伯来词也可指高声的警报，有时与号角声相联。
    reason: lexical_alternative
  - marker: c
    text: 这里的风暴图像既符合战争毁灭的场景，也可能使人联想到耶和华如神圣战士般施行审判。
    reason: cross_reference
lexical_decisions:
- source_word: וְהִצַּתִּי אֵשׁ
  choice: 我要……点火
  rationale: 使役形动词在先知性审判宣告中表达将来的行动；“点火”自然、直接，并保留使役含义。
- source_word: בְּחוֹמַת רַבָּה
  choice: 在拉巴的城墙上
  rationale: 介词 בְּ 可依语境表示“在……中/上”；这里描写城防遭火焚烧。“拉巴”按地名音译。
- source_word: וְאָכְלָה
  choice: 那火必吞灭
  rationale: 希伯来文以阴性单数动词回指阴性名词“火”；明说“那火”使现代汉语指代清楚，“吞灭”保留火焰吞噬的生动意象。
- source_word: אַרְמְנוֹתֶיהָ
  choice: 她的城堡
  rationale: 该词可指宫殿或设防的坚固建筑；在攻城语境中，“城堡”兼顾宏伟建筑与防御设施。阴性后缀译为“她的”，保留城市拟人化。
- source_word: בִּתְרוּעָה
  choice: 伴着呐喊
  rationale: תְּרוּעָה 可指高声呼喊、警报声，也可与号角声有关；“呐喊”适合战争语境，同时不把声音来源限定为号角。
- source_word: בְּיוֹם מִלְחָמָה
  choice: 在争战之日
  rationale: 直译时间短语，并采用庄重而仍易懂的表达；“争战”保留 מִלְחָמָה 较广的战争含义。
- source_word: בְּסַעַר בְּיוֹם סוּפָה
  choice: 在暴风之日伴着狂风
  rationale: סַעַר 与 סוּפָה 都属风暴语汇。“狂风”与“暴风”既保留诗性强化和近义平行，也避免在汉语中完全重复同一个词。
theological_decisions:
- issue: 审判图像的性质
  choice: 译文同时保留军事毁灭与风暴图像，不断定风暴只是比喻，也不把它明确限定为神显。
  alternative: 将风暴语言明确解释为耶和华以神圣战士身份显现并施行审判。
  rationale: 经文把“呐喊、争战之日”与“狂风、暴风之日”并置；译文应保留两组图像及其可能的神学呼应，而不替原文消除张力。
- issue: אַרְמְנוֹתֶיהָ 中阴性后缀的所指
  choice: 译作“她的”，指拉巴城。
  alternative: 译作中性的“它的”。
  rationale: 希伯来文常以阴性指称城市；“她的”保留原文对拉巴的拟人化。
translation_notes:
  register: 采用现代、庄重而通俗的普通话。句式保留原文由火焚城、战争喧声到风暴意象逐步推进的诗性结构；地名“拉巴”使用常见音译，城市以“她”拟人化。
