  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה עַל שְׁלֹשָׁה֙ פִּשְׁעֵ֣י בְנֵֽי עַמּ֔וֹן וְ/עַל אַרְבָּעָ֖ה לֹ֣א אֲשִׁיבֶ֑/נּוּ עַל בִּקְעָ/ם֙ הָר֣וֹת הַ/גִּלְעָ֔ד לְמַ֖עַן הַרְחִ֥יב אֶת גְּבוּלָֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/001/013.yaml
  text: 'Thus says Yahweh: “For three transgressions of the sons of Ammon[a], and for four, I will not revoke it[b], because they ripped open the pregnant women of Gilead in order to enlarge their border.”'
translation:
  language: zh_hans
  text: 耶和华如此说：“因亚扪人三番四次的罪过，我必不撤回惩罚；因为他们剖开基列的孕妇，为要扩张自己的疆界。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: 耶和华如此说
  rationale: 保留先知宣告的使者公式；以“耶和华”音义约定译出神名 יְהוָה，表达庄重且为现代中文读者熟悉。
- source_word: עַל שְׁלֹשָׁה פִּשְׁעֵי ... וְעַל אַרְבָּעָה
  choice: 三番四次悖逆
  rationale: 以自然中文再现“三次……四次”的递进修辞，表示罪行累积、恶贯已满，而不把数字机械地理解为确数；“悖逆”保留 פֶּשַׁע 的反叛与道德过犯意味。
- source_word: בְנֵי עַמּוֹן
  choice: 亚扪人
  rationale: 希伯来语直译为“亚扪之子”，这里是民族称谓；“亚扪人”在现代中文中准确自然。
- source_word: לֹא אֲשִׁיבֶנּוּ
  choice: 我必不撤回惩罚
  rationale: 动词字面为“不使它返回／不收回它”，代词所指在上下文中省略。中文补出“惩罚”以清楚表达所宣告的审判，同时不将其解释为神情绪上的改变。
- source_word: בִּקְעָם הָרוֹת הַגִּלְעָד
  choice: 他们剖开基列的孕妇
  rationale: 准确保留暴行的强烈画面；“基列的孕妇”自然表达受害者与基列的关联。
- source_word: לְמַעַן הַרְחִיב אֶת גְּבוּלָם
  choice: 为要扩张自己的疆界
  rationale: לְמַעַן 加不定式表达目的；“疆界”兼顾 גְּבוּל 的边界含义及这里争夺领土的语境。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 采用中文圣经传统中广为人知且庄重的专名译法，不以“主”替代原文专名，也不附加宗派性解释。
- issue: לֹא אֲשִׁיבֶנּוּ 中代词所指
  choice: 补明为“惩罚”
  alternative: 直译为“我必不将它收回”
  rationale: 原文保留指代上的省略，语境指向针对亚扪罪行的审判。中文若只说“它”指向不明，故在正文中作最低限度的语义补足；不进一步限定惩罚的具体形式。
translation_notes:
  register: 采用庄重、简洁、可朗读的现代标准汉语。“三番四次”传达阿摩司书反复出现的数字递进公式；暴行描写不弱化，也不额外渲染。
