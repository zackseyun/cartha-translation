  text: וְ/הָלַ֥ךְ מַלְכָּ֖/ם בַּ/גּוֹלָ֑ה ה֧וּא וְ/שָׂרָ֛י/ו יַחְדָּ֖ו אָמַ֥ר יְהוָֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/amos/001/015.yaml
  text: And their king shall go into exile[a], he and his officials together, says Yahweh.
translation:
  language: zh_hans
  text: 他们的王和他的官员必一同被掳去[a]。这是耶和华说的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“米勒公必被掳去。”米勒公是亚扪人的神；有人认为本句是说，亚扪人的神将与其祭司或官员一同被掳。
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָלַךְ
  choice: 必被掳去
  rationale: 该动词在先知审判宣告中具有将来指向；结合“流放”这一目的地，用现代汉语的被动表达可自然传达被征服后遭押解的含义。
- source_word: מַלְכָּם
  choice: 他们的王
  rationale: 马所拉读音及其附属代词最自然地表示“他们的王”，也与下文“他的官员”形成顺畅搭配；但辅音形式亦可理解为亚扪人的神米勒公，因此保留脚注。
- source_word: בַּגּוֹלָה
  choice: 被掳去
  rationale: 该短语表示因征服而遭流放、迁徙；“被掳去”在现代中文圣经语体中清楚表达非自愿离境及其方向。
- source_word: הוּא
  choice: 他
  rationale: 独立代词重申并强调前面的王；中文用“他和他的官员”自然保留这一同位强调。
- source_word: וְשָׂרָיו
  choice: 和他的官员
  rationale: שָׂרִים可指首领、贵族或官员；王室语境中译为“官员”清楚、现代，也不过度限定其具体爵位。
- source_word: יַחְדָּו
  choice: 都一同
  rationale: 既表达王与官员共同遭受流放，也在中文中保留原文强调全体一同被掳的语气。
- source_word: אָמַר יְהוָה
  choice: 这是耶和华说的
  rationale: 采用自然、庄重的现代汉语先知宣告格式；神名 יהוה 音译为“耶和华”。
theological_decisions:
- issue: מַלְכָּם是指亚扪人的人间君王，还是神祇米勒公
  choice: 正文作“他们的王”
  alternative: “米勒公”，即亚扪人的神；按此理解，是该神与其祭司或官员一同被掳
  rationale: 马所拉元音及紧接的“他和他的官员”支持人间君王的读法；然而无元音辅音也容许神名“米勒公”，且亚扪语境使这一异读具有实质意义，故不在正文中武断消除，而以脚注保存。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“必被掳去”保留先知审判宣告的确定语气；第二次补出“被掳”，使中文句意完整自然。脚注标记[a]置于相关歧义词组之后。
