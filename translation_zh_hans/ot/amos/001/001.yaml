base_translation:
  language: en
  yaml_path: translation/ot/amos/001/001.yaml
  text: The words of Amos[a], who was among the shepherds from Tekoa, which he saw concerning Israel in the days of Uzziah king of Judah and in the days of Jeroboam son of Joash, king of Israel[b], two years before the earthquake.
translation:
  language: zh_hans
  text: 这是阿摩司所见的、有关以色列的话[a]。阿摩司是提哥亚的牧羊人之一；这事发生在犹大王乌西雅和以色列王约阿施的儿子耶罗波安在位的日子，地震前两年。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “有关以色列”也可译作“攻击以色列”。这里的希伯来介词在先知性语境中可表达这两种意思。
    reason: alternative_reading
lexical_decisions:
- source_word: דִּבְרֵי עָמוֹס
  choice: 阿摩司……的话
  rationale: דִּבְרֵי 是复数构造形式，在先知书标题中自然译作“……的话”；按现代汉语语序调整，但保留其统摄全书信息的功能。
- source_word: בַנֹּקְדִים מִתְּקוֹעַ
  choice: 提哥亚的牧羊人中
  rationale: נֹקְדִים 可特指饲养或繁育羊的人，但“牧羊人”在现代汉语中更自然；“中”保留 ב 表示阿摩司属于这一群体，מִתְּקוֹעַ 则表达其来自提哥亚。
- source_word: חָזָה
  choice: 见了
  rationale: 保留先知性启示所用动词“看见”的基本意象，不扩写为“在异象中领受”。
- source_word: עַל יִשְׂרָאֵל
  choice: 有关以色列
  rationale: עַל 在先知语境中可表示“有关”或“攻击”；正文采用涵盖面较广的“有关”，并以脚注保留另一可能。
- source_word: בִּימֵי ... וּבִימֵי
  choice: 在……执政的日子、……执政的日子
  rationale: 保留希伯来文“在……的日子”的标题体表达，并加入“执政”使君王年代在现代汉语中清楚自然。
- source_word: שְׁנָתַיִם לִפְנֵי הָרָעַשׁ
  choice: 在地震前两年
  rationale: 直接表达原文时间关系；定指的“地震”表明这是读者所知的一次事件。
theological_decisions:
- issue: “见了”的语法宾语是“话”
  choice: 译作“见了以下有关以色列的话”
  alternative: 译作“所得有关以色列的异象”或拆为“以下是……的话；他曾看见……”
  rationale: 原文把“看见”直接用于“话”，融合了先知信息的言说与异象性领受。中文保留这种张力，不把它限定为纯粹视觉异象。
- issue: עַל יִשְׂרָאֵל 的方向性
  choice: 有关以色列
  alternative: 攻击以色列
  rationale: 标题既可概括针对以色列的审判，也可泛指以色列相关信息；采用较宽泛的译法，并在脚注中保留较强的敌对含义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。为避免“阿摩司的话……是他所看见的”造成生硬歧义，按汉语信息结构重排句子，同时保留“见了……话”这一先知书标题中的特殊搭配。
