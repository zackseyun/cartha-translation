id: AMO.1.9
reference: Amos 1:9
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה עַל שְׁלֹשָׁה֙ פִּשְׁעֵי צֹ֔ר וְ/עַל אַרְבָּעָ֖ה לֹ֣א אֲשִׁיבֶ֑/נּוּ עַֽל הַסְגִּירָ֞/ם גָּל֤וּת שְׁלֵמָה֙ לֶ/אֱד֔וֹם וְ/לֹ֥א זָכְר֖וּ בְּרִ֥ית אַחִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/001/009.yaml
  text: 'Thus says Yahweh: “For three transgressions of Tyre[a], and for four, I will not revoke its punishment[c][b], because they delivered up an entire population of exiles to Edom and did not remember a covenant of brotherhood.”'
translation:
  language: zh_hans
  text: '雅威如此说：

    “推罗三番四次犯罪，

    我必不撤回对它的惩罚[a]；

    因为他们把全体被掳的人交给以东[b]，

    也不记念弟兄之约[c]。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“我必不使它返回”；希伯来文没有明说“它”指什么，这里按上下文理解为已经宣告的惩罚。
    reason: lexical_alternative
  - marker: b
    text: 也可译“整批被掳的人”或“全部被掳的群体”。希伯来语指一个完整的被掳群体。
    reason: lexical_alternative
  - marker: c
    text: 直译“弟兄的约”。具体可指建立在兄弟关系上的盟约或邦交，原文没有进一步说明。
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: 雅威如此说
  rationale: 保留先知宣告的使者公式，并将四字神名 יְהוָה 音译为“雅威”，用语庄重而自然。
- source_word: עַל שְׁלֹשָׁה פִּשְׁעֵי צֹר וְעַל אַרְבָּעָה
  choice: 推罗三番四次犯罪
  rationale: “三番四次”自然传达希伯来文“三次……四次”的递进惯用语，同时保留反复犯罪、罪责累积的意味。
- source_word: לֹא אֲשִׁיבֶנּוּ
  choice: 我必不撤回对它的惩罚
  rationale: 希伯来文直译为“我必不使它返回”，宾语的具体所指没有明说；正文按上下文明确为不会撤回对推罗的惩罚，并以脚注保存原文的含蓄性。
- source_word: הַסְגִּירָם
  choice: 他们把……交给
  rationale: 使役形在此指把人交付给另一势力；“交给”简明、自然，并保留控诉的严重性。
- source_word: גָּלוּת שְׁלֵמָה
  choice: 全体被掳的人
  rationale: גָּלוּת 在此可指被掳者的群体，שְׁלֵמָה 表示完整、全体；此译法表达他们整批遭到交付，而不把所指过度限定为某种特定人口单位。
- source_word: וְלֹא זָכְרוּ
  choice: 也不记念
  rationale: 保留 זכר“记念”的基本词义；在盟约语境中，这也含有不顾念、不按约行事的伦理意味。
- source_word: בְּרִית אַחִים
  choice: 弟兄之约
  rationale: 紧贴“弟兄的约”这一希伯来结构，保留亲族关系或兄弟邦盟的意象，不将其弱化为一般友好协议。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用以色列上帝的圣约名字；“雅威”较贴近学界通常采用的拟音，同时不以头衔替代专名。
- issue: לֹא אֲשִׁיבֶנּוּ 中未明说的宾语
  choice: 正文译作“我必不撤回对它的惩罚”，脚注说明直译
  alternative: 我必不使它返回
  rationale: 上下文指已宣告的审判不会撤销，但希伯来文没有明说“惩罚”；正文确保现代读者理解，脚注则保存原文真实的语义留白。
- issue: בְּרִית אַחִים 所指关系
  choice: 弟兄之约
  alternative: 兄弟之盟
  rationale: 原文没有说明这是血缘关系、邦国间的兄弟关系，还是历史盟约；采用较直译的表达，避免替原文判定具体历史对象。
translation_notes:
  register: 采用现代、庄重且适合公开诵读的普通话。诗行按控诉结构分行；“三番四次”保留数目递进的修辞功能，“记念”和“弟兄之约”则保留先知文体及盟约色彩。
