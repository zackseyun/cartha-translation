base_translation:
  language: en
  yaml_path: translation/ot/amos/001/002.yaml
  text: 'And he said: Yahweh roars from Zion and gives his voice from Jerusalem[a]; the pastures of the shepherds mourn[c][b], and the summit of Carmel dries up.'
translation:
  language: zh_hans
  text: 他说：“雅威[a]从锡安吼叫，从耶路撒冷发声[b]；牧人的草场悲哀[c]，迦密的山顶枯干。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威”是希伯来文神名 יהוה（YHWH）的音译；传统汉译常作“耶和华”。
    reason: divine_name
  - marker: b
    text: 原文直译为“发出他的声音”，也可译作“扬声”。
    reason: lexical_alternative
  - marker: c
    text: “悲哀”是把草场人格化；这里也含有草场衰败、枯萎的景象。
    reason: poetic_personification
lexical_decisions:
- source_word: וַיֹּאמַר
  choice: 他说
  rationale: 承接上一节的叙述，引出阿摩司所传达的话；中文无需机械保留句首连接词，仍能自然表达希伯来文的行文推进。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译神名 YHWH，表明原文使用的是专名，而不是普通称号“主”。
- source_word: יִשְׁאָג
  choice: 吼叫
  rationale: 该动词常指狮子吼叫，保留审判宣告中鲜明而有威势的意象。
- source_word: יִתֵּן קוֹלוֹ
  choice: 发声
  rationale: 原文直译为“发出他的声音”；“发声”在现代汉语中自然简洁，也保留与“吼叫”的平行关系，不把它进一步解释为“打雷”。
- source_word: נְאוֹת הָרֹעִים
  choice: 牧人的草场
  rationale: נְאוֹת 在牧人语境中指放牧之地；译作“草场”比“住处”更切合土地枯旱的图景。
- source_word: וְאָבְלוּ
  choice: 悲哀
  rationale: 保留原文把草场人格化的诗意表达；若译作“枯萎”，虽说明实际后果，却会削弱这一修辞。
- source_word: רֹאשׁ הַכַּרְמֶל
  choice: 迦密的山顶
  rationale: רֹאשׁ 字面为“头”，用于地貌时指顶部或山顶；补出“山”使现代中文读者清楚这是迦密高处。
- source_word: וְיָבֵשׁ
  choice: 也枯干了
  rationale: 表达土地和植被失去水分、干枯的景象；“也”自然衔接两个并列的灾变结果。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用以四个辅音组成的神圣专名 YHWH。“雅威”较直接地反映学界通常复原的读音，并避免把专名改成称号；脚注保留华语读者熟悉的传统译名。
- issue: יִשְׁאָג 与 יִתֵּן 的时态语气
  choice: 使用不标明时态的“吼叫、发声”
  alternative: 必吼叫、必发声；正在吼叫、正在发声
  rationale: 希伯来文未完成式在先知话语中可具有现在宣告、将来预告或生动呈现的力量。汉语裸动词不强行限定时间，有助于保留这种张力。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。保留“吼叫—发声”的诗体平行和“草场悲哀”的人格化，不用生硬的逐词结构；“迦密的山顶”明确地理所指，同时不额外加入原文没有明说的解释。
