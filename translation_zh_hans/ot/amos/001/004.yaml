base_translation:
  language: en
  yaml_path: translation/ot/amos/001/004.yaml
  text: So I will send fire upon the house of Hazael[a], and it will consume the citadels of Ben-hadad.
translation:
  language: zh_hans
  text: 所以，我要向哈薛家降火；这火必吞灭便·哈达的宫殿[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“堡垒”或“设防的坚固据点”；这里的希伯来语可指王宫建筑，也可指设防的坚固据点。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁלַּחְתִּי
  choice: 所以，我要……降
  rationale: שׁלח的皮勒式第一人称单数意为“差遣、发出”。句首连接词承接上一节的罪状与判决，译作“所以”能自然表达后果关系，同时保留其连接作用。
- source_word: אֵשׁ
  choice: 火
  rationale: 保留原文具体的“火”之意象，不直接释作战争、毁灭或审判。
- source_word: בְּבֵית חֲזָאֵל
  choice: 向哈薛家
  rationale: 介词בְּ在“降火”这一结构中标明审判的对象；“家”既可指哈薛的居所，也可涵盖他的王室或王朝，保留原文的语义宽度。
- source_word: חֲזָאֵל
  choice: 哈薛
  rationale: 按现代中文圣经人名的通行形式音译。
- source_word: וְאָכְלָה
  choice: 这火必吞灭
  rationale: אכל本义为“吃”，以火为主语时表示“吞噬、烧毁”。“吞灭”保留拟人化的猛烈意象；补出“这火”使现代汉语的指代清楚。
- source_word: אַרְמְנוֹת
  choice: 宫堡
  rationale: 该词可指宫殿，也可指坚固设防的堡垒。“宫堡”兼顾王室建筑和防御据点两方面，并以脚注注明其他可行译法。
- source_word: בֶּן הֲדָד
  choice: 便·哈达
  rationale: 按专名音译，并以间隔号呈现复合名称；原文可能指某位君王，也可能具有王朝称号性质，正文不作限定。
theological_decisions:
- issue: “哈薛家”的所指
  choice: 用“家”保留居所、王室与王朝的多重可能
  alternative: 明确译作“哈薛的宫殿”或“哈薛王朝”
  rationale: 先知审判语境中的“家”常可延伸指统治家族或王朝，但原文并未排除建筑层面的含义，因此不在正文中收窄。
- issue: 火的性质
  choice: 保留具体的“火”作为审判意象
  alternative: 意译为军事毁灭或上帝的审判
  rationale: 原文直接使用“火”，应保留其先知性意象，避免把可能的历史实现方式写进正文。
- issue: “便·哈达”的身份
  choice: 仅按专名翻译，不判定为某一特定君王或纯粹的王朝称号
  alternative: 明确解释为某位便·哈达王或一个王朝称号
  rationale: 希伯来文本本身只给出该名称，具体身份在本节中并不明确。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“向……降火”符合先知审判宣告的语体；分号和“这火”使两个并列分句的逻辑与指代清晰。“宫堡”略带文学色彩，但可简洁保留原词兼具宫殿与堡垒的含义，并由脚注辅助普通读者理解。
