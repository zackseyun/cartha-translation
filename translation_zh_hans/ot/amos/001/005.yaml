  rationale: 修订仅调整两处：以“必被迁到”更明确地传达被掳流放的语义，并以“雅威说”取代不自然的“这是雅威说的”。同时将“亚兰人”微调为“亚兰的人民”，更贴合原文集合性表达。地名正文和两则脚注均保留原有的谨慎性与歧义。
