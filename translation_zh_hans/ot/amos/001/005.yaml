id: AMO.1.5
reference: Amos 1:5
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/שָֽׁבַרְתִּי֙ בְּרִ֣יחַ דַּמֶּ֔שֶׂק וְ/הִכְרַתִּ֤י יוֹשֵׁב֙ מִ/בִּקְעַת אָ֔וֶן וְ/תוֹמֵ֥ךְ שֵׁ֖בֶט מִ/בֵּ֣ית עֶ֑דֶן וְ/גָל֧וּ עַם אֲרָ֛ם קִ֖ירָ/ה אָמַ֥ר יְהוָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/amos/001/005.yaml
  text: I will break the gate-bar of Damascus[a], and I will cut off the inhabitant from the Valley of Aven and the one who holds the scepter from Beth-eden[b]; and the people of Aram will go into exile to Kir,” says Yahweh.
translation:
  language: zh_hans
  text: '“我必折断大马士革的门闩，


    从亚文谷[a]剪除居民，


    从伯伊甸[b]剪除执掌权杖的人；


    亚兰的人民必被迁到吉珥。”


    雅威说。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “亚文”可能使人联想到意为“邪恶”或“祸患”的希伯来词；这里很可能是地名，也可能含有先知性的双关。
    reason: lexical_alternative
  - marker: b
    text: “伯伊甸”也可按字面译作“伊甸之家”；有些人认为此地就是历史上的比特阿迪尼。
    reason: alternative_reading
lexical_decisions:
- source_word: וְשָׁבַרְתִּי
  choice: 我必折断
  rationale: 该完成式在连续的审判宣告中表达将来的行动；“折断”自然保留毁坏城防设施的具体意象。
- source_word: בְּרִיחַ
  choice: 门闩
  rationale: 指固定城门或门扇的横闩；“门闩”简洁明确地呈现防御工事的意象。
- source_word: דַּמֶּשֶׂק
  choice: 大马士革
  rationale: 采用现代汉语通行地名。
- source_word: וְהִכְרַתִּי
  choice: 剪除
  rationale: 保留希伯来语“切断、除去”的审判性隐喻，也符合庄重的先知文体。
- source_word: יוֹשֵׁב
  choice: 居民
  rationale: 该单数分词可作集合性或代表性用法；译作“居民”不额外断定其专指统治者。
- source_word: מִבִּקְעַת אָוֶן
  choice: 从亚文谷
  rationale: בִּקְעָה意为谷地或平原，אָוֶן在此很可能用作地名，同时可能含有先知性的双关；正文音译，词义见脚注。
- source_word: וְתוֹמֵךְ שֵׁבֶט
  choice: 执掌权杖的人
  rationale: תמך意为握持、扶持，שֵׁבֶט在此指统治者的杖或权杖；译文保留具体意象及其统治含义。
- source_word: מִבֵּית עֶדֶן
  choice: 从伯伊甸
  rationale: 正文按地名处理并采用简明音译；字面理解和可能的历史对应留在脚注中。
- source_word: וְגָלוּ
  choice: 必流亡
  rationale: 该动词表示离乡被迁或进入流亡状态；“流亡”保留原句未明说施事者的特点。
- source_word: עַם אֲרָם
  choice: 亚兰人
  rationale: 自然表达“亚兰的人民”，并保留希伯来文的古代族群与地域名称，不以后来的“叙利亚”替代。
- source_word: קִירָה
  choice: 到吉珥
  rationale: 词尾־ָה表示趋向某地；“吉珥”采用通行的中文圣经地名译法。
- source_word: אָמַר יְהוָה
  choice: 这是雅威说的
  rationale: 自然呈现先知传信公式，并直接译出神名יהוה。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；“雅威”较贴近学界通常重构的读音，并保留其作为专名的性质，而不以称号替代。
- issue: “亚文谷”中אָוֶן的地名与词义张力
  choice: 正文保留地名“亚文”，脚注说明可能的双关
  alternative: 邪恶谷；祸患谷
  rationale: 该词在上下文中很可能是地名，但也可让人联想到“邪恶”或“祸患”；不在正文中将这种张力单向解释。
- issue: יוֹשֵׁב是否专指统治者
  choice: 居民
  alternative: 统治者；居住的人
  rationale: 该词本义为居住者，单数可集合性地指当地人口；尽管与后句的权杖持有者形成平行，原词本身并未明确限定为统治者。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。诗行结构保留审判宣告的平行节奏；使用“剪除”“权杖”等具有先知书色彩但仍通俗可解的词语。脚注标记均紧随其所解释的地名。
