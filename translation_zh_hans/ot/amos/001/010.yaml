base_translation:
  language: en
  yaml_path: translation/ot/amos/001/010.yaml
  text: So I will send fire upon the wall of Tyre[a], and it will consume her citadels.
translation:
  language: zh_hans
  text: 所以，我要把火降在推罗的城墙上；这火必烧毁她的堡垒[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“她的宫殿”。希伯来词可指宫殿，也可指堡垒或其他宏伟的设防建筑。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁלַּחְתִּי
  choice: 所以，我要降
  rationale: 第一人称单数动词带连接词，延续上一节罪状之后的审判宣告。“所以”自然体现因果性的篇章衔接；“降火”是现代汉语中庄重而自然的搭配。
- source_word: אֵשׁ
  choice: 火
  rationale: 保留原文直接的审判意象，不进一步解释为战争、焚烧或纯粹比喻。
- source_word: בְּחוֹמַת
  choice: 在……的城墙上
  rationale: 介词 ב 在这一审判公式中表示火临到或攻击城墙；此译法贴近原文，同时符合现代汉语表达。
- source_word: צֹר
  choice: 推罗
  rationale: 采用该腓尼基城邦名称在现代中文圣经及一般中文中的通行译名。
- source_word: וְאָכְלָה
  choice: 烧毁
  rationale: 该动词本义为“吃、吞吃”，以火为主语时表示吞噬、烧毁。“烧毁”清楚自然，并保留彻底毁坏的力度。
- source_word: אַרְמְנֹתֶיהָ
  choice: 她的堡垒
  rationale: אַרְמוֹן 可指宫殿，也可指设防的宏伟建筑或堡垒。此处与城墙和军事毁灭的语境相合，译作“堡垒”；阴性代词按城市拟人化译为“她的”。
theological_decisions:
- issue: 审判之火的性质
  choice: 保留为上帝所降、烧毁城防建筑的“火”，不说明其具体实现方式
  alternative: 明确解释为实际火灾、敌军焚城，或仅是毁灭的比喻
  rationale: 原文只宣告上帝将降火，并说火会吞噬城中的建筑；译文不越过原文判定其究竟是直接的神迹、军事行动还是象征性说法。
translation_notes:
  register: 采用现代、庄重、易懂的标准普通话。句式简洁，保留先知审判宣告的力度；“她”承接希伯来语对城市的阴性指代。未加脚注，因为正文“堡垒”已在当前语境中清楚表达较合适的词义，而“宫殿”虽是可能义项，却不构成必须标示的文本歧义。
