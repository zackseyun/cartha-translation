  rationale: 改用“把火降在”使表达符合现代汉语，并补出“这火”以明确保持原文“火……吞噬”的主语关系。“所以”保留草案及英文审校轨迹所体现的、承接前文罪状与审判宣告的篇章关系。为保留אַרְמְנוֹתֶיהָ的合理词汇范围，增设“宫殿”替代义脚注，不判定该火的具体实现方式。
