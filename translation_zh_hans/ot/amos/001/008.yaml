  text: וְ/הִכְרַתִּ֤י יוֹשֵׁב֙ מֵֽ/אַשְׁדּ֔וֹד וְ/תוֹמֵ֥ךְ שֵׁ֖בֶט מֵֽ/אַשְׁקְל֑וֹן וַ/הֲשִׁיב֨וֹתִי יָדִ֜/י עַל עֶקְר֗וֹן וְ/אָֽבְדוּ֙ שְׁאֵרִ֣ית פְּלִשְׁתִּ֔ים אָמַ֖ר אֲדֹנָ֥/י יְהוִֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/amos/001/008.yaml
  text: And I will cut off the inhabitant from Ashdod[a], and the one who holds the scepter from Ashkelon; I will turn my hand against Ekron[b], and the remnant of the Philistines shall perish,” says the Lord GOD.
translation:
  language: zh_hans
  text: “我必剪除亚实突的居民，也剪除亚实基伦手执权杖的人[a]；我必转回手来攻击以革伦[b]，非利士人所剩下的必灭亡。”主耶和华说。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “手执权杖的人”指掌权者，也可译作“统治者”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译近于“我必使我的手转回攻击以革伦”。这是一种施行审判的表达；也可译作“我必转过手来攻击以革伦”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִכְרַתִּי
  choice: 我必剪除
  rationale: 使役形在审判语境中表示除掉、消灭；“剪除”既保留原文意象，也符合庄重的先知语体。
- source_word: יוֹשֵׁב
  choice: 居民
  rationale: 字面义为“居住者”，单数可作集合性表达，指城中的居民；不把它擅自限定为统治者。
- source_word: וְתוֹמֵךְ שֵׁבֶט
  choice: 那手执权杖的人
  rationale: 保留“执持权杖”的具体意象，同时让现代读者看出所指是掌权者。
- source_word: וַהֲשִׁיבוֹתִי יָדִי עַל
  choice: 我必转手攻击
  rationale: 原文直译近于“使我的手转回到……之上”，在此是施行或再次施行审判的惯用表达；译文保留“手”的隐喻和敌对方向。
- source_word: וְאָבְדוּ
  choice: 必灭亡
  rationale: 保留动词的不及物结果义，表达其最终消亡，而不明确添加施事者。
- source_word: שְׁאֵרִית פְּלִשְׁתִּים
  choice: 非利士人中余下的
  rationale: 自然表达 שְׁאֵרִית 的“剩余者、余民”含义，并避免“余民”在此负面审判语境中可能引起的救赎性联想。
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: 分别呈现 אֲדֹנָי 的“主”和圣名 יהוה；“耶和华”是现代中文圣经语境中广为人知的传统译名。
theological_decisions:
- issue: אֲדֹנָי יְהוִה 中神名的译法
  choice: 主耶和华
  alternative: 主雅威；主上帝
  rationale: 原文明确同时使用“主”和四字神名。译作“主耶和华”保留两项，不以“上帝”替换专名，也避免译成重复的“主主”。
- issue: “余下的”是否暗示得救的余民
  choice: 按本节审判语境译为将要灭亡的残余者
  alternative: 将其理解为蒙保守的余民
  rationale: 本句谓语 וְאָבְדוּ 明说他们必灭亡，因此不能把 שְׁאֵרִית 在别处可能具有的积极神学含义带入本节。
translation_notes:
  register: 采用现代、庄重而易懂的先知宣告语体。“剪除”“权杖”保留原文审判与王权意象；地名采用中文圣经中通行的“亚实突、亚实基伦、以革伦”。引语后用“这是主耶和华说的”，自然呈现原文末尾的神谕公式。
