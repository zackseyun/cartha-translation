source:
  edition: WLC
  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה עַל שְׁלֹשָׁה֙ פִּשְׁעֵ֣י עַזָּ֔ה וְ/עַל אַרְבָּעָ֖ה לֹ֣א אֲשִׁיבֶ֑/נּוּ עַל הַגְלוֹתָ֛/ם גָּל֥וּת שְׁלֵמָ֖ה לְ/הַסְגִּ֥יר לֶ/אֱדֽוֹם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/001/006.yaml
  text: 'Thus says Yahweh: “For three transgressions of Gaza[a], and for four, I will not revoke its punishment[b], because they carried away an entire population into exile to hand them over to Edom.”'
translation:
  language: zh_hans
  text: '耶和华如此说：


    “加沙的罪过有三样，

    甚至有四样，

    我必不撤回对它的惩罚[a]；

    因为他们把整群人掳去[b]，

    交给以东。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“我不使它返回”；在这里的审判宣告中，意思是耶和华不会撤销所宣告的惩罚。
    reason: lexical_alternative
  - marker: b
    text: 或译“掳去一整批被掳者”或“使整个群体被掳”。原文强调被掳群体的完整性。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的专名形式，明确呈现希伯来文本中的神名，而不以“主”替代。
- source_word: עַל שְׁלֹשָׁה ... וְעַל אַרְבָּעָה
  choice: 三番四次
  rationale: 这是自然、庄重的现代汉语表达，保留希伯来文由“三”递进到“四”、强调罪行累积满盈的修辞作用，而不把它误解为严格计数。
- source_word: פִּשְׁעֵי
  choice: 犯罪
  rationale: “犯罪”在此概括违逆和严重罪行的含义，符合先知对列国的审判语境；“悖逆”虽更贴近词根的反叛意味，却在现代汉语中容易被过度限定为政治或宗教反叛。
- source_word: עַזָּה
  choice: 加沙
  rationale: 采用该地名通行的现代汉语译名。
- source_word: לֹא אֲשִׁיבֶנּוּ
  choice: 我必不撤回对它的惩罚
  rationale: 原文直译为“我不使它返回”，宾语所指没有明说；在阿摩司书的审判宣告套语中，语义是不会撤销所宣告的惩罚。正文补明“惩罚”，脚注保留原文的含蓄性。
- source_word: הַגְלוֹתָם גָּלוּת שְׁלֵמָה
  choice: 他们把全体居民掳走
  rationale: 这一同源结构强调掳掠或放逐的完整范围。“全体居民”自然表达整个群体遭掳的意思，同时以脚注注明较贴近形式的译法。
- source_word: לְהַסְגִּיר
  choice: 交给
  rationale: 准确表达把被掳者转交到另一方控制之下的意思，语言简洁自然。
- source_word: לֶאֱדוֹם
  choice: 以东
  rationale: 采用该民族和地域名称的通行中文译名。
theological_decisions:
- issue: לֹא אֲשִׁיבֶנּוּ中未明说的宾语
  choice: 正文译为“我必不撤回对它的惩罚”
  alternative: “我必不使它返回”或“我必不撤回”
  rationale: 希伯来文没有明确说出被撤回的是什么，因此脚注保留直译；但上下文的审判宣告套语表明所指是针对加沙的惩罚。补出“惩罚”使现代中文清楚通顺，又不把它具体化为原文未明说的“烈怒”等概念。
- issue: גָּלוּת שְׁלֵמָה所涵盖的范围
  choice: 理解为整个居民群体被掳走
  alternative: “完整的一批俘虏”或“所有被掳的人”
  rationale: 该短语重点在被掳群体的完整性，但可指整个居民群体，也可理解为整批俘虏。正文采用语境中自然的“全体居民”，脚注保留较宽的替代译法，避免掩盖词义范围。
translation_notes:
  register: 采用现代、庄重而易懂的先知宣告体。以分行保留诗性节奏；“三番四次”呈现希伯来文的数字递进修辞，“掳走”“交给”则保持直接有力。所有解释性补足均尽量简短，并借脚注保留原文真实的含蓄与词义张力。
