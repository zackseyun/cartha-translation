  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה עַל שְׁלֹשָׁה֙ פִּשְׁעֵ֣י דַמֶּ֔שֶׂק וְ/עַל אַרְבָּעָ֖ה לֹ֣א אֲשִׁיבֶ֑/נּוּ עַל דּוּשָׁ֛/ם בַּ/חֲרֻצ֥וֹת הַ/בַּרְזֶ֖ל אֶת הַ/גִּלְעָֽד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/001/003.yaml
  text: 'Thus says Yahweh: “For three transgressions of Damascus[a], and for four, I will not revoke it, because they threshed Gilead with threshing sledges of iron.”'
translation:
  language: zh_hans
  text: '耶和华如此说：


    “大马士革三番四次的罪过，

    我必不收回这判决；

    因为他们用铁制的打谷橇蹂躏基列。”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: 耶和华如此说
  rationale: 保留先知宣告中常见的使者公式，并将四字神名按其专名译作“耶和华”。
- source_word: עַל שְׁלֹשָׁה פִּשְׁעֵי דַמֶּשֶׂק וְעַל אַרְבָּעָה
  choice: 大马士革三番四次悖逆
  rationale: “三番四次”以自然的现代汉语传达希伯来文“三次……四次”的递增修辞；“悖逆”体现 פֶּשַׁע 所含的反叛、冒犯之意。
- source_word: לֹא אֲשִׁיבֶנּוּ
  choice: 我必不收回
  rationale: 原文直译近于“我不使它返回／不将它收回”，宾语仅由代词表达，所指没有明说。正文不补出“惩罚”或“判决”，以保留其简练和含混性。
- source_word: עַל דּוּשָׁם
  choice: 因为他们……碾压
  rationale: 第二个 עַל 表原因；דושׁ 本指打谷，这里描绘残酷碾压，故结合后面的打谷器具译为“碾压”。
- source_word: בַּחֲרֻצוֹת הַבַּרְזֶל
  choice: 用铁制的打谷橇
  rationale: חֲרֻצוֹת 指用于打谷的器具或橇；“铁制的打谷橇”既保留具体意象，也说明其材质。
- source_word: אֶת הַגִּלְעָד
  choice: 基列
  rationale: 保留地区名称；原文把该地区及其居民作为整体来描述。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名；采用现代中文圣经读者最熟悉的专名形式“耶和华”，而不以“主”替代。
- issue: לֹא אֲשִׁיבֶנּוּ 中未明说的宾语
  choice: 我必不收回
  alternative: 我必不撤销对它的惩罚
  rationale: 希伯来文没有明确说出被收回的是惩罚、判决还是怒气。正文保留省略，脚注说明语境可能所指，避免把解释写进经文。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“三番四次”呈现递增公式的修辞力量；分行保留先知神谕的诗体节奏。“打谷橇”虽不是日常器物，但能准确保留原文具体而强烈的农业暴力意象。
