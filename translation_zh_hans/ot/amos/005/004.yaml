  text: כִּ֣י כֹ֥ה אָמַ֛ר יְהוָ֖ה לְ/בֵ֣ית יִשְׂרָאֵ֑ל דִּרְשׁ֖וּ/נִי וִֽ/חְיֽוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/005/004.yaml
  text: 'For thus says Yahweh to the house of Israel: Seek me and live[a].'
translation:
  language: zh_hans
  text: 因为耶和华对以色列家如此说：“你们要寻求我，并要存活[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你们要寻求我，好使你们存活”，或“你们要寻求我，就必存活”。希伯来文可理解为紧迫的并列命令，也可带有目的或应许结果的意味。
    reason: 保留 וִחְיוּ 作为命令式的基本形式，并说明其在此结构中可能带有目的或结果的语用含义。
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，为先前的哀歌与宣告说明根据；现代汉语用“因为”可自然保留这一连接作用。
- source_word: כֹה אָמַר
  choice: 如此说
  rationale: 保留先知传信公式的庄重语气，同时符合现代汉语表达。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代简体中文圣经读者熟悉的形式音译神的专名，不以“主”等称号替代。
- source_word: לְבֵית יִשְׂרָאֵל
  choice: 对以色列家
  rationale: “对”体现 לְ 的受话对象功能；“以色列家”保留原文的群体性、盟约性表达。
- source_word: דִּרְשׁוּנִי
  choice: 你们要寻求我
  rationale: דרש 在此不只是询问，而是转向神并寻求他；补出复数主语“你们”可清楚传达命令对象。
- source_word: וִחְיוּ
  choice: 就必存活
  rationale: 将 waw 加命令式理解为紧迫命令之后的应许性结果；“存活”不限定为仅指肉身幸存或属灵生命。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名；译文保留专名而不以称号代替。“耶和华”是现代标准汉语中广为人知且庄重的音译形式。
- issue: “寻求我”与“存活”的关系
  choice: 你们要寻求我，就必存活
  alternative: 你们要寻求我，好使你们存活；你们要寻求我，并且存活
  rationale: 希伯来文可表达连续命令，也可让第二个命令带出应许的结果。正文采用自然的条件—结果表达，脚注保留目的或并列命令的可能，不把“生命”的范围缩限为肉身或属灵层面。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“如此说”保留先知公式的正式感；“以色列家”保留原文的群体称谓；全句避免限定“存活”的神学范围。
