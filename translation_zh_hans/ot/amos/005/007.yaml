base_translation:
  language: en
  yaml_path: translation/ot/amos/005/007.yaml
  text: you who turn justice into wormwood and cast righteousness down to the earth:[a][b]
translation:
  language: zh_hans
  text: 你们把公正变为苦艾[a]，把公义丢在地上。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “苦艾”是一种味苦的植物；这里也可意译为“苦涩”。
    reason: lexical_alternative
  - marker: b
    text: “公义”也可译作“正义”；末句也可译为“把正义扔到地上”。
    reason: alternative_reading
lexical_decisions:
- source_word: הַהֹפְכִים
  choice: 你们把……变为
  rationale: 带冠词的分词在此承接先知直接责备的语气；用第二人称复数表达其呼语作用，较“那些……的人”更贴合上下文。
- source_word: לַעֲנָה
  choice: 苦艾
  rationale: 该词指一种味苦的植物，并在此作比喻；“苦艾”保留具体而尖锐的先知性意象。
- source_word: מִשְׁפָּט
  choice: 公正
  rationale: 在社会与司法伦理语境中，指正当的司法和群体秩序；“公正”自然且与下句“公义”有所区分。
- source_word: וּצְדָקָה
  choice: 公义
  rationale: 此词可指公义或正义；与 מִשְׁפָּט 并列时保留“公义”，可呈现两个彼此相关却不完全相同的概念。
- source_word: לָאָרֶץ
  choice: 在地上
  rationale: 保留空间性的贬抑图像，表示公义被置于低下、受践踏的位置；现代汉语中“丢在地上”较自然。
- source_word: הִנִּיחוּ
  choice: 丢在
  rationale: 使役形在此有放下、搁置之意；结合“地上”，译作“丢在”既保留动作图像，也传达轻弃公义的负面语气，而不将含义收窄为抽象的“抛弃”。
theological_decisions:
- issue: 先知伦理语境中 צְדָקָה 的译法
  choice: 公义
  alternative: 正义
  rationale: 该词与司法及社会正义有语义重叠，但这里与 מִשְׁפָּט 配对。正文分别译作“公正”和“公义”，避免把两个相关概念合并为同一用词；脚注保留“正义”这一可能译法。
translation_notes:
  register: 采用现代、庄重而直白的先知责备语气。“苦艾”保留希伯来文的具体植物意象；“丢在地上”比书面化的“弃于地上”更易懂，同时维持原文的降卑与轻弃图像。
