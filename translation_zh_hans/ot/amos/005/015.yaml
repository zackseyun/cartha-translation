  text: שִׂנְאוּ רָע֙ וְ/אֶ֣הֱבוּ ט֔וֹב וְ/הַצִּ֥יגוּ בַ/שַּׁ֖עַר מִשְׁפָּ֑ט אוּלַ֗י יֶֽחֱנַ֛ן יְהוָ֥ה אֱלֹהֵֽי צְבָא֖וֹת שְׁאֵרִ֥ית יוֹסֵֽף־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/amos/005/015.yaml
  text: Hate evil[a], and love good, and establish justice in the gate; perhaps Yahweh, the God of hosts[c][b], will be gracious to the remnant of Joseph.
translation:
  language: zh_hans
  text: 要恨恶邪恶，喜爱良善，在城门口确立公正[a]；或许雅威——万军之上帝——会施恩给约瑟的余民[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 古代以色列的城门口是长老和官员审理案件、处理公共事务的地方；这里要求在那里确立公正。
    reason: cultural_note
  - marker: b
    text: “约瑟”在这里指约瑟的后裔，尤其指北国以色列；“约瑟的余民”就是审判之后剩下的人。
    reason: cross_reference
lexical_decisions:
- source_word: שִׂנְאוּ רָע
  choice: 恨恶邪恶
  rationale: 保留复数命令式的强烈语气，以及“邪恶”与“良善”的伦理对照；不弱化为“拒绝”。
- source_word: וְאֶהֱבוּ טוֹב
  choice: 喜爱良善
  rationale: “喜爱”自然表达 אהב 的命令语气；将作名词用的形容词 טוֹב 译为“良善”，与“邪恶”形成庄重而清楚的对照。
- source_word: וְהַצִּיגוּ ... מִשְׁפָּט
  choice: 秉公行义
  rationale: 原文直义近于“使公正立定”。结合城门审判的司法语境，“秉公行义”表达使公正落实并维持的要求，而非仅作抽象宣告。
- source_word: בַשַּׁעַר
  choice: 在城门口
  rationale: 明确指古代城市办理诉讼与公共事务的地点，同时保留原文的空间意象。
- source_word: אוּלַי
  choice: 或许
  rationale: 保留希望而不确定的语气，不把悔改后的施恩表达成必然结果。
- source_word: יֶחֱנַן
  choice: 会施恩给
  rationale: 贴近 חנן 所表达的恩待、施惠之意，并与“或许”组成自然的现代汉语。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以通行的现代汉语音译呈现四字神名，保留其专名性质，不以称号替代。
- source_word: אֱלֹהֵי צְבָאוֹת
  choice: 万军之上帝
  rationale: 采用清楚、庄重且有圣经传统延续性的固定称号；“万军”不将其范围狭义限定为人间军队。
- source_word: שְׁאֵרִית יוֹסֵף
  choice: 约瑟的余民
  rationale: “余民”保留先知书中审判之后剩余之人的关键词意义；“约瑟”在此为群体称呼。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华／主
  rationale: 原文直接使用神的专名；音译“雅威”保留专名身份，避免以“主”这一称号替代。
- issue: אוּלַי יֶחֱנַן 所表达的施恩是否确定
  choice: 或许……会施恩
  alternative: 就必施恩／愿……施恩
  rationale: 原文保留盼望与不确定性；译文不把人的回应与上帝施恩处理成自动或必然的因果关系。
- issue: “约瑟的余民”的所指
  choice: 正文保留“约瑟的余民”，脚注说明其群体含义
  alternative: 北国剩下的人
  rationale: 保留原文的祖先名称及先知性“余民”用语，不在正文中过度解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“恨恶邪恶，喜爱良善”保留原文鲜明的对偶；“在城门口秉公行义”将司法语境自然传达出来。破折号标明“万军之上帝”是对“雅威”的同位说明。所有脚注标记均已置于正文。
