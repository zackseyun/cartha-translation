base_translation:
  language: en
  yaml_path: translation/ot/amos/005/019.yaml
  text: It will be as when a man flees from before the lion[a], and the bear meets him; then he enters the house and leans his hand on the wall[b], and the snake bites him.
translation:
  language: zh_hans
  text: 这就像一个人从狮子面前逃跑，熊却迎面碰上他；他进到屋里，把手靠在墙上，蛇却咬了他。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: 这就像
  rationale: 保留引出比喻的比较作用，并以自然中文承接上一节对耶和华之日的描述。
- source_word: יָנוּס אִישׁ מִפְּנֵי הָאֲרִי
  choice: 一个人躲避狮子逃跑
  rationale: יָנוּס表示因危险而逃跑；מִפְּנֵי字面为“从……面前”，这里译作“躲避”更符合现代汉语，同时保留紧迫感。אִישׁ按原文单数译为“一个人”。
- source_word: וּפְגָעוֹ הַדֹּב
  choice: 却遇上了熊
  rationale: פגע可表示遇见、碰上，也可在语境中带有袭击意味；“遇上”保留词义弹性，而熊所带来的威胁由上下文本身表明。“却”突出刚逃过一种危险又碰上另一种危险的反转。
- source_word: וּבָא הַבַּיִת
  choice: 他进到屋里
  rationale: בוא在此处表示进入房屋；译文明确主语，使叙事在中文中流畅。
- source_word: וְסָמַךְ יָדוֹ עַל הַקִּיר
  choice: 把手靠在墙上
  rationale: סמך有倚靠、支撑或放置其上的意思；这一译法保留具体动作和进入安全之处后稍作倚靠的画面。
- source_word: וּנְשָׁכוֹ הַנָּחָשׁ
  choice: 蛇却咬了他
  rationale: 按现代汉语语序将动词后的主语提前；“却”表现看似已经安全、危险仍突然临到的反差。נָחָשׁ采用通俗而准确的“蛇”。
theological_decisions:
- issue: 比喻所表达的不可逃避性
  choice: 保留连续遭遇危险的具体画面，不在正文中加入解释
  alternative: 明说这是无人能逃脱的审判
  rationale: 本节通过狮子、熊和蛇的递进场景传达意义；直译意象可保留与上一节的联系及先知话语的张力，避免把解释写入经文。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。以“这就像”自然引出比喻；用“却”两次呈现接连反转和无处可逃的力度。脚注标记置于其实际说明的“熊”和“蛇”之后。
