  naturalness: 原句“你们的偶像基云，就是你们神的星”在现代汉语中容易被误解为“基云”本身是“偶像”的定语或名称，且“这些都是”与前句的连接稍显突兀。用破折号标示同位成分，并将“偶像”改为较贴近 צֶלֶם 的“神像”，表达更清晰自然。
