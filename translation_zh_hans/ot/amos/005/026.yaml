id: AMO.5.26
reference: Amos 5:26
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וּ/נְשָׂאתֶ֗ם אֵ֚ת סִכּ֣וּת מַלְכְּ/כֶ֔ם וְ/אֵ֖ת כִּיּ֣וּן צַלְמֵי/כֶ֑ם כּוֹכַב֙ אֱלֹ֣הֵי/כֶ֔ם אֲשֶׁ֥ר עֲשִׂיתֶ֖ם לָ/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/005/026.yaml
  text: And you carried Sikkuth your king[a], and Kiyyun your images, the star of your god[c][b], which you made for yourselves.
translation:
  language: zh_hans
  text: 你们抬着西库特——你们的王[a]，又抬着基云——你们的神像，即你们神的星[b][c]；这些都是你们为自己造的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “你们的王”或作“你们的摩洛”。希伯来文本直译为“你们的王”，但许多解释者认为这里指摩洛神；使徒行传7:43也反映了这种理解。
    reason: alternative_reading
  - marker: b
    text: “西库特”和“基云”都是罕见名称，可能与星辰崇拜有关，但其确切所指无法确定。
    reason: cultural_note
  - marker: c
    text: “你们神的星”也可能理解为“你们众神的星”，不过马所拉读音支持单数“神”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּנְשָׂאתֶם
  choice: 你们抬着
  rationale: נשׂא的Qal完成式第二人称阳性复数，带连接词；这里指携带敬拜用品。“抬着”自然地表达搬抬、携带具象物件的动作。
- source_word: סִכּוּת
  choice: 西古特
  rationale: 这是罕见且含义不确定的词，与“基云”平行，可能是神祇或祭祀名称；音译可避免武断地译为“神龛”等解释。
- source_word: מַלְכְּכֶם
  choice: 你们的王
  rationale: 马所拉文本按字面为“你们的王”。虽有传统将其理解为神祇摩洛，但正文保留希伯来文本的直接读法，并在脚注交代另一种理解。
- source_word: כִּיּוּן
  choice: 基云
  rationale: 这是另一个罕见专名，可能与星辰崇拜有关；采用简明音译，不在正文中强行确定其具体身份。
- source_word: צַלְמֵיכֶם
  choice: 你们的偶像
  rationale: צֶלֶם可指形像或雕像；本节明确处于异教敬拜语境，“偶像”在现代汉语中自然，也能表达这些形像的祭祀用途。
- source_word: כּוֹכַב אֱלֹהֵיכֶם
  choice: 你们神的星
  rationale: 保留原文的属格结构；按马所拉读音，אֱלֹהֵיכֶם在此理解为单数“你们的神”，而不将短语扩写成解释性的“你们所敬拜的星神”。
- source_word: אֲשֶׁר עֲשִׂיתֶם לָכֶם
  choice: 这些都是你们为自己造的
  rationale: “为自己”保留לָכֶם的反身意味；以“这些”承接前述祭祀物件，使中文指代清楚，同时不限定关系从句只修饰最后一个名词。
theological_decisions:
- issue: מַלְכְּכֶם应译作普通名词“你们的王”，还是认定为神名“摩洛”
  choice: 你们的王
  alternative: 你们的摩洛
  rationale: 马所拉文本直接读作“你们的王”，并未在此明确拼写神名。使徒行传7:43及古老传统反映了“摩洛”的理解，但不宜据此在正文中消除希伯来文本的歧义，故列入脚注。
- issue: 是否解释性翻译סִכּוּת与כִּיּוּן
  choice: 将二者作为专名音译为“西古特”和“基云”
  alternative: 把西古特译为“神龛”，或直接认定二者为特定星神
  rationale: 两词罕见，具体所指尚不确定。音译既保留其可能的专名性质，也避免把有争议的历史辨认写进正文。
- issue: אֱלֹהֵיכֶם在此按单数还是复数理解
  choice: 你们的神
  alternative: 你们众神
  rationale: 马所拉读音支持单数意义；复数理解在语义上并非全无可能，故以脚注保留。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。句首不机械翻出连接词“和”；重复“又抬着”以清楚呈现两个并列宾语。“就是”表达“你们神的星”与前述祭祀对象之间可能的同位关系，同时不进一步认定具体星神。所有脚注标记均已置于正文，且相关标记紧随对应词语。
