  text: הַ/זְּבָחִ֨ים וּ/מִנְחָ֜ה הִֽגַּשְׁתֶּם לִ֧/י בַ/מִּדְבָּ֛ר אַרְבָּעִ֥ים שָׁנָ֖ה בֵּ֥ית יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/005/025.yaml
  text: Did you bring me sacrifices and offerings in the wilderness for forty years[a], O house of Israel?
translation:
  language: zh_hans
  text: 以色列家啊，你们在旷野四十年间，曾把祭牲和供物[a]献给我吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “供物”也可译作“素祭”。在祭祀语境中，希伯来语这个词可特指以谷物献上的祭。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַזְּבָחִים
  choice: 祭牲
  rationale: זֶבַח通常指宰杀献上的祭物；“祭牲”既体现其祭祀语境，也与后面的“供物”形成清楚区别。
- source_word: וּמִנְחָה
  choice: 和供物
  rationale: מִנְחָה可泛指礼物、贡物，在祭祀语境中也可特指素祭。正文用较宽泛自然的“供物”，脚注保留“素祭”这一更具体的可能。
- source_word: הִגַּשְׁתֶּם
  choice: 曾把……献给
  rationale: נגשׁ的使役形在此指把祭物带来、呈献；“献给”符合现代汉语祭祀语境，并保留动作的对象关系。
- source_word: לִי
  choice: 给我
  rationale: 明确保留第一人称间接宾语，表明所献对象是说话者耶和华。
- source_word: בַמִּדְבָּר
  choice: 在旷野
  rationale: “旷野”是以色列出埃及与漂流背景中的常用对应词，也保留经文互文色彩。
- source_word: אַרְבָּעִים שָׁנָה
  choice: 四十年间
  rationale: 用“年间”自然表达持续时段，而不增加原文没有明说的限定。
- source_word: בֵּית יִשְׂרָאֵל
  choice: 以色列家啊
  rationale: 保留先知话语中的集体称呼和呼语语气；“家”也维持该固定表达的形式。
theological_decisions:
- issue: 本节反问的力度及其隐含答案
  choice: 译成直接反问：“曾……吗？”，不把隐含的否定答案写入正文。
  alternative: 明译为“你们并没有真正……”，或处理成不带反问色彩的普通询问。
  rationale: 希伯来文疑问结构和上下文构成尖锐挑战，但原文本身没有明说答案；保留问句可维持其修辞力度与神学张力。
- issue: 旷野时期献祭问题与其他经文的关系
  choice: 不在译文中解释这句话是绝对否定、相对轻看，还是针对敬拜对象或方式的责问。
  alternative: 通过增词明确为“你们从未献祭”，或“你们献的并不是真正献给我”。
  rationale: 本节措辞容许上下文层面的进一步讨论；翻译不应替读者预先解决经文之间及本段内部的张力。
translation_notes:
  register: 采用现代、庄重而易懂的先知性语言。“以色列家啊”保留正式呼语；“曾……吗”呈现反问而不显得过度古雅。脚注标记[a]已置于正文相应词后。
