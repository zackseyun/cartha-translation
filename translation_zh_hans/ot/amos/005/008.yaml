revisions:
- from: 那造昴星和参星[a]，使幽暗[b]变为清晨，使白昼黑暗如夜，召来海水，把水倾倒在大地之上的——雅威[c]是他的名。
  to: 那位造昴星和参星[a]，使幽暗[b]变为清晨，使白昼变暗成为黑夜，召来海水，把水倾倒在大地之上的——雅威[c]是他的名。
  rationale: 修订仅解决中文长定语链的句法问题，并将白昼与黑夜的表达调整为更贴近原文的转变意象；未改变星名、神名或“幽暗”的既有译法与脚注信息。
