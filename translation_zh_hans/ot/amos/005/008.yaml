id: AMO.5.8
reference: Amos 5:8
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: עֹשֵׂ֨ה כִימָ֜ה וּ/כְסִ֗יל וְ/הֹפֵ֤ךְ לַ/בֹּ֨קֶר֙ צַלְמָ֔וֶת וְ/י֖וֹם לַ֣יְלָה הֶחְשִׁ֑יךְ הַ/קּוֹרֵ֣א לְ/מֵֽי הַ/יָּ֗ם וַֽ/יִּשְׁפְּכֵ֛/ם עַל פְּנֵ֥י הָ/אָ֖רֶץ יְהוָ֥ה שְׁמֽ/וֹ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/amos/005/008.yaml
  text: He who made the Pleiades and Orion[a], and turns deep darkness into morning, and darkens day into night[b], who calls for the waters of the sea and pours them out over the face of the earth—Yahweh is his name.
translation:
  language: zh_hans
  text: 那位造昴星和参星[a]，使幽暗[b]变为清晨，使白昼变暗成为黑夜，召来海水，把水倾倒在大地之上的——雅威[c]是他的名。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “昴星”和“参星”传统上分别被认作昴宿星团和猎户座。
    reason: identification
  - marker: b
    text: “幽暗”或译“死荫”。
    reason: lexical_alternative
  - marker: c
    text: 希伯来文作“YHWH”，是上帝的名字；也常译作“耶和华”。
    reason: alternative_rendering
lexical_decisions:
- source_word: עֹשֵׂה
  choice: 那造……的
  rationale: 阳性单数主动分词在此作实体性用法，引出对上帝作为的描述；中文用“那……的”自然保留其连续描述的功能，不强行限定为一次性的过去动作。
- source_word: כִימָה
  choice: 昴星
  rationale: 该词传统上且颇有根据地被认作昴宿星团；“昴星”是现代中文读者较熟悉的天文及圣经用语。
- source_word: כְסִיל
  choice: 参星
  rationale: 与“昴星”并列时指猎户座；“参星”沿用中文传统星名，又能清楚表达天体所指，而不按其普通词根误译为“愚人”。
- source_word: וְהֹפֵךְ
  choice: 使……变为
  rationale: 分词表达转变；此译清楚呈现幽暗转成清晨的逆转意象。
- source_word: צַלְמָוֶת
  choice: 幽暗
  rationale: 该词可指浓重的黑暗，也可带有“死荫”的意味；昼夜宇宙图景中“幽暗”自然贴切，同时以脚注保留较传统的词义可能。
- source_word: וְיוֹם לַיְלָה הֶחְשִׁיךְ
  choice: 使白昼黑暗如夜
  rationale: 保留חשׁך使之变暗的使役意味，并自然表达“白昼—黑夜”的对照；“如夜”避免生硬的中文“把白昼黑暗成夜”。
- source_word: הַקּוֹרֵא לְמֵי הַיָּם
  choice: 召来海水
  rationale: קרא与介词ל在这里表达发令召唤；“召来”既简洁，又体现海水听命而来的诗意。
- source_word: וַיִּשְׁפְּכֵם
  choice: 把水倾倒
  rationale: 动词指倾倒，复数宾语后缀回指海水；中文补出“水”，避免代词所指含混。
- source_word: עַל־פְּנֵי הָאָרֶץ
  choice: 在大地之上
  rationale: 自然传达希伯来语“大地表面”这一空间表达，并保持诗歌的庄重语体。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来四字神名YHWH的通行学术拟音直接呈现上帝的专名，而不以“主”这一称号代替；脚注说明希伯来形式及另一常见中文译名。
theological_decisions:
- issue: 如何译出神名יְהוָה
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文明确使用四字神名而非“主”的称号。“雅威”较直接反映YHWH的通行拟音；“耶和华”作为常见中文形式列入脚注，既保留原文的专名性质，也不把某一称号代入正文。
- issue: צַלְמָוֶת在此处是“幽暗”还是“死荫”
  choice: 幽暗
  alternative: 死荫
  rationale: 上下文描写清晨、白昼和黑夜的宇宙转换，因此正文采用直接的黑暗义；但该词可含死亡阴影的联想，脚注保留“死荫”这一传统译法，不消除其语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的诗体中文。以一连串动词短语呈现原文对创造主的连续描写，并用破折号引出末尾“雅威是他的名”这一宣告。正文避免生硬直译，也不补入原文没有的因果或教义解释。
