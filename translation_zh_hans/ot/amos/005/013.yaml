source:
  edition: WLC
  text: לָ/כֵ֗ן הַ/מַּשְׂכִּ֛יל בָּ/עֵ֥ת הַ/הִ֖יא יִדֹּ֑ם כִּ֛י עֵ֥ת רָעָ֖ה הִֽיא׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/005/013.yaml
  text: Therefore the prudent man keeps silent at that time[a], for it is an evil time.
translation:
  language: zh_hans
  text: 所以，明智的人[a]在那时保持沉默，因为那是险恶的时世。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “明智的人”也可译为“有见识的人”或“谨慎的人”。希伯来语为阳性单数，这里可作代表性表达。
    reason: 说明词义范围及原文的语法性别与代表性用法。
lexical_decisions:
- source_word: לָכֵן
  choice: 所以
  rationale: 承接上文对社会不公的控诉，明确表达由此得出的结论；“所以”在现代汉语中自然且保留推论关系。
- source_word: הַמַּשְׂכִּיל
  choice: 明智的人
  rationale: 该词是 שכל 的使役词干分词，指有见识、行事审慎的人。“明智的人”兼顾洞察力与实际判断，也符合现代汉语表达。
- source_word: בָּעֵת הַהִיא
  choice: 在那时
  rationale: 指向上下文所说的特定时期；“在那时”简洁、准确。
- source_word: יִדֹּם
  choice: 保持沉默
  rationale: דמם 表示静默、不出声；这里的未完成式可描写在这种处境中的持续或典型反应。“保持沉默”体现有意克制，而不额外说明其动机。
- source_word: כִּי
  choice: 因为
  rationale: 引出保持沉默的原因，现代汉语中用“因为”关系明确、语气自然。
- source_word: עֵת רָעָה
  choice: 险恶的时世
  rationale: רָעָה 可兼有道德败坏与祸患危险的意味；“险恶”保留这两方面的张力，“时世”则自然表达一种受社会处境塑造的时期。
- source_word: הִיא
  choice: 那是
  rationale: 阴性代词回指阴性名词 עֵת；汉语以“那是”回指前述特定时候，表达自然。
theological_decisions:
- issue: הַמַּשְׂכִּיל 的性别与代表性
  choice: 明智的人
  alternative: 明智的男子；有见识的人
  rationale: 希伯来语形式为阳性单数，但在本句中可代表具有这种特质的人。汉语“人”本身不标明性别，既没有无根据地限定为男性，也保留了单数代表性表达。
- issue: “保持沉默”的评价性质
  choice: 不明说这种沉默是赞许、无奈还是自保
  alternative: 因谨慎而闭口不言
  rationale: 原文说明险恶的时世是沉默的原因，却没有明确判定这种沉默的道德性质或具体动机；译文保留这一张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“险恶的时世”略带文学色彩，但普通读者容易理解，并能同时传达社会道德败坏与处境危险。脚注标记紧随其所解释的“明智的人”。
