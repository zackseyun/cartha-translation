base_translation:
  language: en
  yaml_path: translation/ot/amos/005/017.yaml
  text: And in all the vineyards there will be wailing[b][a], for I will pass through your midst," says Yahweh.
translation:
  language: zh_hans
  text: 所有葡萄园里也必有哀号[a]，因为我要从你中间经过[b]。”这是耶和华说的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “哀号”也可译作“哀悼”或“悲叹”。原文所指的是公开表达的悲痛，往往伴有哭号声。
    reason: lexical_alternative
  - marker: b
    text: “我要从你中间经过”可能呼应较早经文中神临到施行审判的说法；参看《出埃及记》12:12。本节本身没有明确指出这一呼应。
    reason: cross_reference
lexical_decisions:
- source_word: וּ/בְ/כָל כְּרָמִים
  choice: 所有葡萄园里也
  rationale: 介词、全称量词和复数名词表示哀哭遍及所有葡萄园；“也”承接上文连续列举的哀悼场景。
- source_word: מִסְפֵּד
  choice: 必有哀号
  rationale: 该名词指公开的哀悼，常伴有可听见的哭号；希伯来语无系词，中文补出“必有”，既自然又保留预告语气。
- source_word: כִּי
  choice: 因为
  rationale: 引出葡萄园中哀号的原因。
- source_word: אֶעֱבֹר בְּ/קִרְבְּ/ךָ
  choice: 我要从你中间经过
  rationale: 保留“经过/穿行”及“中间”的空间意象，也保留第二人称单数对以色列整体的称呼；不在正文中明说可能的出埃及记呼应。
- source_word: אָמַר יְהוָה
  choice: 这是耶和华说的
  rationale: 以自然、庄重的现代汉语表达先知宣告公式；将神名直接译为“耶和华”。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名；中文正文采用读者广泛熟悉的专名“耶和华”，而不是以“主”代替，从而保留其专名性质。
- issue: 神在审判中的行动
  choice: 我要从你中间经过
  alternative: 我要行经你们当中
  rationale: 直陈神亲自临到并施行审判，同时不把可能与出埃及记12:12的联系写成确定的明引，保留文本本身的含蓄与神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。“葡萄园”“哀号”“从你中间经过”保留原文的具体场景、听觉力度和空间意象；脚注标记均置于相关正文之后。
