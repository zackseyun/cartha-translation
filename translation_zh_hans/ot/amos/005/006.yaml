  to: 你们要寻求耶和华，就必存活[a]；免得他[b]如火一般在约瑟家中爆发，将约瑟家吞灭；也没有人能为伯特利扑灭这火[c]。
  rationale: 修订不改变主要释义：耶和华如火临到约瑟家，且无人能够扑灭。它补足了隐含主语的脚注锚点，并将伯特利前的介词关系译作“为伯特利”，避免无依据地定为“在伯特利”。为使现代普通话清晰，将原文省略的“约瑟家”和“火”在相应动词后明示；二者均由紧邻上下文明确提供。
