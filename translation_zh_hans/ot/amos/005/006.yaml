id: AMO.5.6
reference: Amos 5:6
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: דִּרְשׁ֥וּ אֶת יְהוָ֖ה וִֽ/חְי֑וּ פֶּן יִצְלַ֤ח כָּ/אֵשׁ֙ בֵּ֣ית יוֹסֵ֔ף וְ/אָכְלָ֥ה וְ/אֵין מְכַבֶּ֖ה לְ/בֵֽית אֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/005/006.yaml
  text: Seek Yahweh and live[a], lest he break out like fire in the house of Joseph, and it consume[b], with no one to quench it for Bethel.
translation:
  language: zh_hans
  text: 你们要寻求耶和华，就必存活[a]；免得他[b]如火一般在约瑟家中爆发，将约瑟家吞灭；也没有人能为伯特利扑灭这火[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你们要寻求耶和华，要存活。”希伯来文简洁地并列两个复数命令，也可理解为前一行动带来后一结果。
    reason: alternative_reading
  - marker: b
    text: 原文这个动词的主语没有明说。正文按上下文理解为耶和华；也可译作“免得火如火一般在约瑟家中爆发”。
    reason: alternative_reading
  - marker: c
    text: 原文直译近于：“也没有为伯特利扑灭者。”伯特利是北国的重要圣所；此处介词所表达的关系含混，也可理解为“没有人为伯特利扑灭这火”。
    reason: cultural_note
lexical_decisions:
- source_word: דִּרְשׁוּ
  choice: 寻求
  rationale: 该复数命令式在先知和盟约语境中指转向并寻求上帝，而不只是向他求问；“寻求”简洁自然。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经传统中对四字神名的通行音译，保留其作为以色列上帝之专名的性质，而不改成一般称号。
- source_word: וִחְיוּ
  choice: 就必存活
  rationale: 命令式后的连接结构可表达结果；此译自然传达“寻求便得以活”的应许，同时脚注保留较贴近并列命令的译法。
- source_word: פֶּן
  choice: 免得
  rationale: 引出应当避免的后果，符合先知警告的语气。
- source_word: יִצְלַח
  choice: 他……突然烧起
  rationale: 该动词与“火”连用时表示突然冲出或爆发；正文把隐含主语理解为前句的耶和华，并以“突然烧起”呈现火势爆发的意象。
- source_word: כָּאֵשׁ
  choice: 如火
  rationale: 直接保留希伯来文的比较意象，中文凝练自然。
- source_word: בֵּית יוֹסֵף
  choice: 约瑟家
  rationale: 保留指称北国、尤其以法莲诸支派的先知性称谓，也维持“家”的集体含义。
- source_word: וְאָכְלָה
  choice: 将其吞灭
  rationale: 阴性动词与“火”相呼应；“其”保留宾语在原文中省略的特点，并自然指向约瑟家。
- source_word: וְאֵין מְכַבֶּה
  choice: 无人能扑灭
  rationale: 表达没有人可以或在场扑灭火势；“扑灭”是现代中文与火搭配的自然用语。
- source_word: לְבֵית אֵל
  choice: 伯特利无人能扑灭
  rationale: 将伯特利理解为北国的重要圣所和地名。希伯来介词关系较难直译，中文通过前置地点表达与伯特利相关的无人扑灭之意，并在脚注说明其字面结构。
theological_decisions:
- issue: “突然烧起”的隐含主语
  choice: 正文以耶和华为主语：“他如火……突然烧起”
  alternative: 以火或非人称情形为主语：“免得有火……突然烧起”
  rationale: 上一分句明确提到耶和华，且先知审判语境常把耶和华描绘为如火临到；但原文没有明说主语，故以脚注保留歧义。
- issue: “伯特利”的含义
  choice: 作为北国宗教中心的地名“伯特利”
  alternative: 按普通名词短语译作“上帝的殿”
  rationale: 《阿摩司书》的历史和文学语境明确把伯特利作为受审判的北国圣所；地名读法最为合适。
translation_notes:
  register: 采用庄重而清晰的现代标准普通话。“约瑟家”保留先知书对北国的历史性称谓；“突然烧起—吞灭—扑灭”维持贯穿全句的火焰意象。正文流畅表达主要读法，脚注则保留原文在动词主语、命令关系及伯特利介词结构上的真实歧义。
