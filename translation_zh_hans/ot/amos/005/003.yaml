source:
  edition: WLC
  text: כִּ֣י כֹ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה הָ/עִ֛יר הַ/יֹּצֵ֥את אֶ֖לֶף תַּשְׁאִ֣יר מֵאָ֑ה וְ/הַ/יּוֹצֵ֥את מֵאָ֛ה תַּשְׁאִ֥יר עֲשָׂרָ֖ה לְ/בֵ֥ית יִשְׂרָאֵֽל׃ס
base_translation:
  language: en
  yaml_path: translation/ot/amos/005/003.yaml
  text: 'For thus says the Lord GOD: The city that marches out a thousand will have a hundred left[a], and the one that marches out a hundred will have ten left, for the house of Israel.'
translation:
  language: zh_hans
  text: 因为主雅威如此说：以色列家中，出兵一千的城，只剩一百；出兵一百的，只剩十个。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “出兵”直译为“出去”；这里所列人数表明，很可能是指出去作战。
    reason: 说明词语的字面意义及语境所支持的军事含义，保留原文可能具有的宽泛性。
lexical_decisions:
- source_word: כִּי כֹה אָמַר
  choice: 因为……如此说
  rationale: 保留כִּי与上文的因果衔接，并以现代汉语中庄重自然的先知宣告句式表达。
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: אֲדֹנָי译作“主”，神名יהוה按普通中文圣经读者熟悉的形式译作“耶和华”，同时保留复合称号的两个要素。
- source_word: הָעִיר הַיֹּצֵאת אֶלֶף
  choice: 出兵一千的城
  rationale: 分词הַיֹּצֵאת字面为“出去的”；结合人数与战争审判语境，译作“出兵”自然地传达军事行动，但不添加原文没有的“壮丁”等成分。
- source_word: תַּשְׁאִיר
  choice: 只剩
  rationale: 使役式本可直译为“留下”，但此处以城为主语，汉语用“只剩”更自然，也准确表达遭毁灭后仅有少数存留的结果。
- source_word: לְבֵית יִשְׂרָאֵל
  choice: 以色列家中
  rationale: 前置为范围语，使整句在现代汉语中清楚顺畅；“以色列家”保留其民族—群体称谓，而不简化为“以色列”。
theological_decisions:
- issue: 复合神圣称号אֲדֹנָי יְהוִה的译法
  choice: 主耶和华
  alternative: 主雅威
  rationale: “主耶和华”在现代中文圣经语境中庄重且易懂，并保留“主”与神名两个组成部分；“雅威”较接近现代学界对神名的拟音，但普通读者熟悉度较低。
- issue: 存留数字所表达的审判程度
  choice: 按原文保留一千剩一百、一百剩十的陈述
  alternative: 概括为“仅有十分之一存留”
  rationale: 原文用两个具体例子形成强烈的先知性修辞；不将其抽象化，也不进一步解释为特定的余民教义。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“以色列家中”置于句首以避免句末关系短语含混；用分号呈现两组平行递减数字。脚注标记置于整节末尾，对两次“出兵”一并说明。
