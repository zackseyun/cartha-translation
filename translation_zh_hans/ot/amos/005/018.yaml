  text: ה֥וֹי הַ/מִּתְאַוִּ֖ים אֶת י֣וֹם יְהוָ֑ה לָ/מָּה זֶּ֥ה לָ/כֶ֛ם י֥וֹם יְהוָ֖ה הוּא חֹ֥שֶׁךְ וְ/לֹא אֽוֹר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/005/018.yaml
  text: Woe to those who long for the day of Yahweh! Why would you have the day of Yahweh? It is darkness[a], and not light.
translation:
  language: zh_hans
  text: 祸哉，那些渴望雅威之日的人！雅威之日对你们有什么益处呢？[a] 那日是黑暗，不是光明。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作：“你们为什么想要雅威之日呢？”希伯来语的说法简略，带有修辞性。
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹי
  choice: 祸哉
  rationale: 这是先知宣告灾祸并带有哀叹色彩的感叹词；“祸哉”保留其严厉、庄重的警告语气。
- source_word: הַמִּתְאַוִּים
  choice: 那些渴望……的人
  rationale: Hitpael 分词描写一群持续热切盼望的人；“渴望”既自然，又能承载此处反讽性的责问。
- source_word: יוֹם יְהוָה
  choice: 雅威之日
  rationale: 保留先知文学中的核心表达“雅威之日”，并直接音译神圣四字名 יְהוָה。
- source_word: לָמָּה זֶּה לָכֶם
  choice: 对你们有什么益处呢
  rationale: 原文简略且带修辞性，直译近于“这对你们为什么/有何用”；此译传达先知的挑战：他们以为那日会给自己带来什么好处。
- source_word: הוּא חֹשֶׁךְ וְלֹא אוֹר
  choice: 那日是黑暗，不是光明
  rationale: 将 הוּא 所回指的“那日”明示出来，使中文清楚自然，同时保留“黑暗—光明”的鲜明字面比喻和绝对对照。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用神圣四字名；“雅威”按较通行的学术重构音译，保留其作为立约之神专名的性质。
- issue: “雅威之日”的性质
  choice: 保留“黑暗，不是光明”的断言
  alternative: 解释为审判之日或灾祸之日
  rationale: 经文本身以反讽纠正听众对这日的期待，却没有在本节将比喻展开；直译可保留其神学张力，不在正文中加入解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“祸哉”保留先知宣告的肃穆语气；其余句式避免古奥。“雅威之日”作为固定先知性表达予以保留。
