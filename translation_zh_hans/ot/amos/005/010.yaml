base_translation:
  language: en
  yaml_path: translation/ot/amos/005/010.yaml
  text: They hate the one who reproves in the gate[b][a], and they abhor the one who speaks with integrity.
translation:
  language: zh_hans
  text: 他们恨恶在城门口[a]责备人的人，也厌恶说正直话的人[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “城门口”是古代城邑审理案件、作出公共裁决的惯常场所。
    reason: cultural_note
  - marker: b
    text: “说正直话”也可译作“说话正直”或“说无可指摘之话”。
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂנְאוּ
  choice: 他们恨恶
  rationale: 该词是完成式第三人称复数，在先知对当下社会常态的描述中，用现代汉语一般现在时“恨恶”自然表达持续性的行为。
- source_word: בַשַּׁעַר
  choice: 在城门口
  rationale: “城门口”在古代城邑中是审理案件和进行公共议事的场所；译文保留地点意象，脚注补明其司法和公共背景。
- source_word: מוֹכִיחַ
  choice: 责备人的
  rationale: 该分词可指纠正、责备或在司法场合提出指正的人；“责备人的”简明自然，也保留原文对人的指称。
- source_word: וְדֹבֵר
  choice: 也……说……的人
  rationale: 该分词与前一分词构成平行；中文以“……的人”对应两者，并用“也”自然连接两个并列分句。
- source_word: תָּמִים
  choice: 正直话
  rationale: 该词可表示完整、无可指摘或正直；与“说”搭配时，“说正直话”保留其可能修饰言语内容的句法，同时表达诚实正直的公共发言。
- source_word: יְתָעֵבוּ
  choice: 厌恶
  rationale: Piel未完成式表达强烈反感。“厌恶”在现代汉语中有足够力度，并与前句“恨恶”形成对应而不显重复。
theological_decisions:
- issue: תָּמִים修饰的语义重点
  choice: 正文译作“说正直话的人”
  alternative: “说话正直的人”或“说无可指摘之话的人”
  rationale: 希伯来语可理解为所说的话正直、无可指摘，也可侧重说话者以正直诚实的方式发言。正文采用自然且贴近字面结构的表达，脚注保留其他可能。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。两个分句都用“……的人”保持希伯来文分词结构的平行；“城门口”保留原文社会司法场景，并以脚注解释。
