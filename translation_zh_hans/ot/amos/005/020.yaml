  text: הֲ/לֹא חֹ֛שֶׁךְ י֥וֹם יְהוָ֖ה וְ/לֹא א֑וֹר וְ/אָפֵ֖ל וְ/לֹא נֹ֥גַֽהּ לֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/005/020.yaml
  text: Is not the day of Yahweh darkness[a], and not light, and gloom with no brightness in it?
translation:
  language: zh_hans
  text: 雅威的日子岂不是黑暗，不是光明；一片幽暗，毫无光辉吗？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较直译为：“雅威的日子岂不是黑暗，不是光明；幽暗，毫无属于它的光辉吗？”
    reason: 保留希伯来语重复否定，以及介词短语לוֹ较形式的“属于它／为它”表达；正文按现代汉语译为“毫无光辉”。
lexical_decisions:
- source_word: הֲלֹא
  choice: 岂不是
  rationale: 引出预期肯定回答的反问，既保留疑问形式，也符合现代汉语的庄重表达。
- source_word: חֹשֶׁךְ
  choice: 黑暗
  rationale: 采用名词性表达，与后面的“光明”形成鲜明对照。
- source_word: יוֹם יְהוָה
  choice: 雅威的日子
  rationale: 保留先知书中这一固定表达的源语结构，并将四字神名音译为“雅威”。
- source_word: וְלֹא אוֹר
  choice: 而非光明
  rationale: 保留否定及与“黑暗”的对举；“而非”在现代汉语中比逐字译作“并不是光”更自然。
- source_word: וְאָפֵל
  choice: 是幽暗
  rationale: “幽暗”传达 אָפֵל 较浓重的昏暗意象，同时保留并列递进的诗性结构。
- source_word: וְלֹא נֹגַהּ לוֹ
  choice: 其中毫无光辉
  rationale: נֹגַהּ 指光辉或亮光；לוֹ 回指“日子”，译为“其中”符合汉语习惯，“毫无”体现否定的彻底性。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 源文直接使用四字神名；采用较贴近其通行学术复原读音的“雅威”，避免以称号代替专名。
- issue: “雅威的日子”的性质
  choice: 不增添“审判”等解释语
  alternative: 雅威审判的日子
  rationale: 上下文确有审判意味，但本节原文只说“雅威的日子”；直译可保留先知性表达的神学张力，避免把解释写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的反问句式；以分号呈现希伯来诗句的并列推进，并保留“黑暗／光明”“幽暗／光辉”的对照。
