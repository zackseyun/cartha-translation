  text: דִּרְשׁוּ ט֥וֹב וְ/אַל רָ֖ע לְמַ֣עַן תִּֽחְי֑וּ וִ/יהִי כֵ֞ן יְהוָ֧ה אֱלֹהֵֽי צְבָא֛וֹת אִתְּ/כֶ֖ם כַּ/אֲשֶׁ֥ר אֲמַרְתֶּֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/005/014.yaml
  text: Seek good and not evil[a], so that you may live; and so Yahweh, the God of hosts, will be with you, as you have said.
translation:
  language: zh_hans
  text: 你们要寻求善，不要寻求恶，好使你们存活；这样，耶和华——万军之神——就必与你们同在，正如你们所说[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“照你们所说。”希伯来语的完成式可能指他们先前宣称耶和华与他们同在。
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּרְשׁוּ
  choice: 寻求
  rationale: 该动词可表示寻找、求问或追求；在先知的劝诫中，“寻求”既自然，也保留了主动追求与圣约呼召的意味。
- source_word: טוֹב וְאַל רָע
  choice: 善，不要寻求恶
  rationale: “善”与“恶”在此作名词性用法，形成简洁鲜明的道德对比；汉语补出第二个“寻求”，使否定命令清楚自然。
- source_word: לְמַעַן תִּחְיוּ
  choice: 好使你们存活
  rationale: לְמַעַן 表示目的或结果。“存活”保留语境中免受审判、继续生存的含义，又不把它扩展解释为更宽泛的兴盛。
- source_word: וִיהִי כֵן
  choice: 这样……就必
  rationale: 该表达承接前面的命令，表示由此产生或所期望的结果；“这样……就必”在现代汉语中清楚体现其后果性。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文读者熟悉的专名形式来呈现四字神名，而不单以“主”这一称号替代。
- source_word: אֱלֹהֵי צְבָאוֹת
  choice: 万军之上帝
  rationale: “万军”保留 צְבָאוֹת 的广泛含义，不把它限定为地上的军队或天军；“上帝”对应 אֱלֹהֵי。
- source_word: אִתְּכֶם
  choice: 与你们同在
  rationale: 介词与代词后缀直接表达临在和陪伴，“与你们同在”准确且符合中文圣经语体。
- source_word: כַּאֲשֶׁר אֲמַרְתֶּם
  choice: 正如你们所说的
  rationale: 完成式可指向他们先前宣称耶和华与他们同在；“所说的”保留这种回顾意味，同时也容许一般性的“你们这样说”之理解。
theological_decisions:
- issue: “耶和华……与你们同在”是无条件的现状宣告，还是寻求善之后的结果
  choice: 译为有条件的后果：“这样……就必与你们同在”
  alternative: 较静态地译为“这样……便与你们同在”或理解为当前事实
  rationale: 本节的命令、目的句和后续表达把存活及上帝的同在与寻求善联系起来；末句又呼应百姓自己的宣称，因此不宜将其处理为对他们现状的无条件肯定。
- issue: כַּאֲשֶׁר אֲמַרְתֶּם 的时间指向
  choice: 保留为“正如你们所说的”
  alternative: “正如你们常说的”或“照你们所宣称的”
  rationale: 希伯来语完成式可能指他们先前的说法，但本身未说明语气是否带讽刺；译文避免擅自加入“妄称”等判断。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“寻求善，不要寻求恶”保留原文简洁的对仗；“好使你们存活”避免过度阐释“活”的范围。破折号标示“万军之上帝”是对“耶和华”的同位说明。
