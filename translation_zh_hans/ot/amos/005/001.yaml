  yaml_path: translation/ot/amos/005/001.yaml
  text: 'Hear this word that I am taking up over you as a lament[a], O house of Israel:'
translation:
  language: zh_hans
  text: 以色列家啊，要听这话：我向你们唱起一首哀歌[a]：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我论到你们唱起一首挽歌。”希伯来文直译为“我在你们之上举起一首哀歌”；“举起”在这里指唱起或吟诵哀歌。
    reason: 说明נשא与קינה的习语搭配，并保留על可表示“在……之上、论到、为着”的语义幅度，避免将其定为单一的敌对或哀悼含义。
lexical_decisions:
- source_word: שִׁמְעוּ
  choice: 要听
  rationale: 复数命令式，在先知宣告中带有郑重召唤的语气；“要听”简洁自然。
- source_word: הַדָּבָר הַזֶּה
  choice: 这篇哀歌（在句法中由后文统摄）
  rationale: דבר本义为“话、信息”；本句后面的“哀歌”说明所要听的内容。汉语将其整合为“这篇哀歌”，可避免生硬重复，同时保持所指。
- source_word: אֲשֶׁר אָנֹכִי נֹשֵׂא
  choice: 我……所作的
  rationale: נשא字面为“举起、承担”，与哀歌连用时指唱起、发出哀歌；现代汉语“作哀歌”自然庄重，但字面意象另见脚注。
- source_word: עֲלֵיכֶם
  choice: 为你们
  rationale: על在哀歌语境中可指向哀悼的对象，即“为某人、论到某人”；此处保留关系上的含混，不强化为“攻击你们”。
- source_word: קִינָה
  choice: 哀歌
  rationale: 指哀悼之歌，常具有挽歌性质；“哀歌”准确、通俗，并适合先知文学的庄重语体。
- source_word: בֵּית יִשְׂרָאֵל
  choice: 以色列家啊
  rationale: 此处是直接呼语；“家”保留群体、家族共同体的表达，“啊”清楚标示呼告。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重且易懂的先知性呼告。“以色列家啊”前置，符合自然汉语呼语习惯；冒号承接下一节的哀歌内容。
