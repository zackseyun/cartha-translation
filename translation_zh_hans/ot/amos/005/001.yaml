  terminology: 保留“以色列家”“哀歌”。“唱起”在哀歌语境中自然表达נשא与קינה的习语性搭配；“向你们”在正文中不把על预先定为敌对的“攻击”，脚注保留“在……之上／论到／为着”的语义张力。
