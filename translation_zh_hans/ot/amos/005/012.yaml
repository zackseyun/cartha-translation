id: AMO.5.12
reference: Amos 5:12
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּ֤י יָדַ֨עְתִּי֙ רַבִּ֣ים פִּשְׁעֵי/כֶ֔ם וַ/עֲצֻמִ֖ים חַטֹּֽאתֵי/כֶ֑ם צֹרְרֵ֤י צַדִּיק֙ לֹ֣קְחֵי כֹ֔פֶר וְ/אֶבְיוֹנִ֖ים בַּ/שַּׁ֥עַר הִטּֽוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/005/012.yaml
  text: For I know how many your transgressions are, and how great your sins are—oppressors of the righteous[a], takers of a bribe[b], and those who turn aside the needy in the gate.
translation:
  language: zh_hans
  text: 因为我知道，你们的过犯何其多，你们的罪何其重！你们欺压义人，收受贿赂，又在城门口[a]把穷乏人撇在一边[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 古代以色列的城门口是审理案件、作出公共决定的地方。
    reason: cultural_note
  - marker: b
    text: 按这里的司法语境，也可译作“使穷乏人得不到公正”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，说明先知警告和审判宣告的缘由；现代汉语中“因为”自然保留了解释关系。
- source_word: יָדַעְתִּי
  choice: 我知道
  rationale: 该完成式表达耶和华确定、充分的认识；汉语现在时最自然。
- source_word: רַבִּים פִּשְׁעֵיכֶם
  choice: 你们的过犯何其多
  rationale: 保留原文前置形容词所带的强调和感叹色彩；“过犯”可表达蓄意越界、悖逆的意味。
- source_word: וַעֲצֻמִים חַטֹּאתֵיכֶם
  choice: 你们的罪何其重
  rationale: עֲצֻמִים在这里强调罪的强大、严重和分量，不只是数量；“何其重”与上一分句平行。
- source_word: צֹרְרֵי צַדִּיק
  choice: 你们欺压义人
  rationale: 分词描述对义人的敌对压迫；补出“你们”使汉语清楚，同时保留对受众的直接指控。צַדִּיק可兼有道德正直与诉讼中无辜、占理之人的含义，“义人”未将其限制为单一司法意义。
- source_word: לֹקְחֵי כֹפֶר
  choice: 收受贿赂
  rationale: כֹפֶר本可指赎价或补偿金，但司法腐败的语境支持“贿赂”；“收受”符合庄重的现代汉语表达。
- source_word: וְאֶבְיוֹנִים
  choice: 穷乏人
  rationale: 指经济贫困、社会处境脆弱的人；“穷乏人”既易懂，也保持先知文学的庄重语体。
- source_word: בַּשַּׁעַר
  choice: 在城门口
  rationale: 这里不是普通门口，而是古代城门区，即审理案件和处理公共事务之处；正文适度明示“城”。
- source_word: הִטּוּ
  choice: 撇在一边
  rationale: 使役形动词的基本意象是使之偏离、转开；“撇在一边”保留原文没有明说“公正”或“案件”的含蓄性，法律语境由“城门口”和脚注说明。
theological_decisions:
- issue: צַדִּיק在社会伦理及司法语境中的称谓
  choice: 义人
  alternative: 无辜的人；占理的人
  rationale: “义人”保留该词较广的道德和法律语义，不把它仅限于法庭上的无罪身份。
- issue: 末句是否明说穷乏人被剥夺公正
  choice: 把穷乏人撇在一边
  alternative: 使穷乏人在城门口得不到公正；在城门口屈枉穷乏人
  rationale: 原文动词表达“使偏离、撇开”，宾语是穷乏人，并未明说“公正”；正文保留这种简约和张力，脚注交代语境所含的司法意义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“何其多……何其重”重现原文形容词前置的强调；后三项以并列动词短语呈现原文分词和末尾限定动词的连续指控。正文避免把司法含义全部解释出来，以保留原文的凝练和语义张力。
