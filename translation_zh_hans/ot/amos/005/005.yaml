base_translation:
  language: en
  yaml_path: translation/ot/amos/005/005.yaml
  text: But do not seek Bethel[a], and do not enter Gilgal, and do not cross over to Beersheba; for Gilgal will surely go into exile, and Bethel will become nothingness.
translation:
  language: zh_hans
  text: 但不要寻求伯特利[a]，不要进入吉甲，也不要到别是巴去；因为吉甲必被掳去，伯特利必化为虚无。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “伯特利”意为“神的家”。本节末尾也可能译作“伯特利必成为伯亚文”，保留希伯来语的双关：“伯亚文”可理解为“虚无之家”“罪恶之家”或“灾祸之家”。
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּדְרְשׁוּ
  choice: 寻求
  rationale: 该词可指“寻求”或“求问”。这里以圣所城镇为宾语，含有前往求助、敬拜的宗教意味；译作“寻求”也保留了与上下文“寻求耶和华”的呼应。
- source_word: בֵּית אֵל
  choice: 伯特利
  rationale: 专有地名采用现代中文圣经中通行的音译；其字面义“神的家”与本节末尾的讽刺性双关相关，另在脚注说明。
- source_word: תָבֹאוּ
  choice: 进入
  rationale: 该动词基本义为“来、进入”。以吉甲这一目的地为背景，“进入”自然表达前往该敬拜中心之意。
- source_word: הַגִּלְגָּל
  choice: 吉甲
  rationale: 专有地名采用通行音译。
- source_word: תַעֲבֹרוּ
  choice: 越过边界到
  rationale: עבר的具体含义是“经过、越过”。别是巴位于南方，前往那里涉及越境；此译法比单纯的“去”更能保留原文动词的空间感，但“边界”是语境所含而非明说。
- source_word: בְאֵר שֶׁבַע
  choice: 别是巴
  rationale: 专有地名采用现代中文圣经中通行的音译。
- source_word: גָּלֹה יִגְלֶה
  choice: 必被掳去
  rationale: 不定式绝对形与限定动词连用，强化事情的确定性；“必”体现强调，“被掳去”保留先知书中的流亡主题。
- source_word: יְהִיֶה לְאָוֶן
  choice: 必化为虚无
  rationale: אָוֶן可表示虚无、罪恶或灾祸。此处与吉甲被掳的审判平行，并可能暗含“伯特利／伯亚文”的双关；“化为虚无”保留毁灭与归于无有之意，而不把多义词限定为道德邪恶或灾难。
theological_decisions:
- issue: לְאָוֶן所表达的伯特利之结局
  choice: 伯特利必化为虚无
  alternative: 伯特利必成为罪恶／灾祸；或“伯特利必成为伯亚文”
  rationale: 希伯来语可能同时具有“虚无、邪恶、灾祸”的语义，并讽刺性地呼应“伯亚文”这个名称。正文采用自然、可懂且不过度限定的“化为虚无”，脚注保留双关及其他语义可能。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“不要……不要……也不要……”保留三重禁令；“必……必……”再现审判宣告的确定语气。正文保留地名音译，以脚注解释伯特利与אָוֶן之间难以直接移植到中文的文字游戏。
