source:
  edition: WLC
  text: הַ/מַּבְלִ֥יג שֹׁ֖ד עַל עָ֑ז וְ/שֹׁ֖ד עַל מִבְצָ֥ר יָבֽוֹא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/005/009.yaml
  text: He who brings sudden destruction upon the strong[b][a], so that destruction comes upon the fortress.
translation:
  language: zh_hans
  text: 他使毁灭骤然临到强者[a]，使毁灭临到堡垒[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“使毁灭向强者迸发。”这里的希伯来语动词罕见且难解，也有人作其他理解。
    reason: lexical_alternative
  - marker: b
    text: “堡垒”也可译作“要塞”或“坚固之地”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּבְלִיג
  choice: 使……骤然临到
  rationale: 这是带定冠词、作实体用法的使役分词，指“那使……发生的一位”。此动词罕见，具体含义有争议；结合“毁灭”及下半句，译文采用突然引发毁灭之意，以“骤然临到”表达其突发性，同时在脚注保留其他可能。
- source_word: שֹׁד
  choice: 毁灭
  rationale: 此词可指暴力造成的毁坏、灾祸或劫掠；本节描述强者和堡垒被摧毁，“毁灭”最清楚地传达这里的破坏性结果。
- source_word: עַל
  choice: 临到
  rationale: 介词在两处都标明毁灭所针对的对象；汉语用“临到”既自然，也保留灾祸降在某对象之上的意象。
- source_word: עָז
  choice: 强者
  rationale: 形容词在此作名词使用，可指强有力的人或势力；“强者”简洁，并保留原文未明确说明其具体身份的概括性。
- source_word: וְשֹׁד
  choice: 使毁灭
  rationale: 连接词引出与前句紧密平行的第二分句。译文不强行明确为结果关系，而以并列的“使”保持希伯来文的简约和诗歌平行。
- source_word: מִבְצָר
  choice: 堡垒
  rationale: 该名词指设防的坚固地点；“堡垒”自然、形象，符合本节的军事意象。
- source_word: יָבֹוא
  choice: 临到
  rationale: 动词基本义为“来、进入”。以“毁灭”为主语、堡垒为目标时，“临到”是自然的现代汉语表达，也保留原文简明的动作。
theological_decisions:
- issue: 主语的身份
  choice: 用“他”承接上下文，隐含指向耶和华，但本节不重复神名。
  alternative: 译作“那使毁灭……的”，以形式上保留希伯来语实体化分词。
  rationale: 阿摩司书5:8—9的上下文是对耶和华能力的描述，因此神是最自然的主语。现代汉语若直译为“那使……的”会使本节显得残缺；用“他”使句子自然，却不添加原文没有的神学称号。
- issue: 两分句之间的关系
  choice: 按并列平行表达，两次使用“使毁灭临到”。
  alternative: 将连接词解释为结果关系，译作“以致毁灭临到堡垒”。
  rationale: 希伯来语连接词本身可以承载多种语篇关系，但本节没有必须明确为结果关系的形式标记；采用并列结构可避免过早消除原文的含混，并突出诗歌平行。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“骤然”传达原文疑难动词在本语境中最可能具有的突发意味；句式保留上下两行的诗歌平行。脚注标记分别紧随所解释的“骤然临到强者”和“堡垒”。
