  text: נָֽפְלָה֙ לֹֽא תוֹסִ֣יף ק֔וּם בְּתוּלַ֖ת יִשְׂרָאֵ֑ל נִטְּשָׁ֥ה עַל אַדְמָתָ֖/הּ אֵ֥ין מְקִימָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/005/002.yaml
  text: Fallen[a], virgin Israel will not rise again; abandoned on her own land[b], she has no one to raise her up.
translation:
  language: zh_hans
  text: 以色列的处女已经跌倒，不再起来；她被遗弃在自己的土地上，无人将她扶起。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נָפְלָה
  choice: 跌倒了
  rationale: 该词是 נפל 的 Qal 完成式第三人称阴性单数，描写已经发生且结果持续的倾覆。“跌倒了”自然、凝练，并与下文“起来／扶起”构成连贯意象。
- source_word: לֹא תוֹסִיף קוּם
  choice: 再也不能起来
  rationale: יסף 的 Hiphil 形式与不定式 קום 组成“不再做某事”的惯用表达。结合哀歌式审判语境，“再也不能起来”传达其决定性，同时没有把字面意义改写成复兴等解释性概念。
- source_word: בְּתוּלַת יִשְׂרָאֵל
  choice: 以色列处女
  rationale: בְּתוּלָה 在此是对以色列民族的诗性人格化称谓。“以色列处女”保留原文隐喻和先知文学语体，而不将其弱化为“少女”或解释性意译。
- source_word: נִטְּשָׁה
  choice: 被撇弃
  rationale: 这是 נטש 的 Niphal 完成式，表示被丢下、遗弃。“被撇弃”既保留被动含义，也符合庄重的哀歌语气。
- source_word: עַל אַדְמָתָהּ
  choice: 在自己的土地上
  rationale: אֲדָמָה 可指地面、土壤或土地；结合阴性单数所有格后缀及民族语境，此处译作“自己的土地”最自然，并明确保留所属关系。
- source_word: אֵין מְקִימָהּ
  choice: 无人将她扶起
  rationale: אֵין 加 קום 的 Hiphil 分词及宾语后缀，意为没有使她起来的人。“扶起”符合倒地者的具体画面，并与前文“起来”保留 קום 的词根呼应。
theological_decisions:
- issue: 审判神谕中称以色列为“处女”的隐喻
  choice: 直接保留“以色列处女”这一人格化称谓
  alternative: 以色列少女；年轻的以色列
  rationale: 原文以女性形象人格化整个民族；直接保留可呈现其诗性、脆弱与倾覆的悲剧感，同时不把它解释为对实际性经历的陈述。
- issue: לֹא תוֹסִיף קוּם 所表达的审判终局性
  choice: 译为“再也不能起来”
  alternative: 不再起来；不会再次起来
  rationale: 此处是哀歌式预告，表达彻底倒下、无力自起。译文维持审判的强度，也与末句“无人将她扶起”形成张力，而不额外断定更广泛的系统神学结论。
translation_notes:
  register: 采用现代、庄重而易懂的普通话，保留希伯来诗歌简短有力的三段结构，以及“跌倒—起来—扶起”的意象和词义呼应。原文没有需要在正文中标示的文本异读；“以色列处女”的人格化性质可由语境清楚辨认，因此不另设脚注。
