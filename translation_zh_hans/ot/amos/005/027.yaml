  text: וְ/הִגְלֵיתִ֥י אֶתְ/כֶ֖ם מֵ/הָ֣לְאָה לְ/דַמָּ֑שֶׂק אָמַ֛ר יְהוָ֥ה אֱלֹהֵֽי צְבָא֖וֹת שְׁמֽ/וֹ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/amos/005/027.yaml
  text: Therefore I will send you into exile beyond Damascus,” says Yahweh[a], whose name is the God of hosts.
translation:
  language: zh_hans
  text: “所以，我必把你们放逐[a]到大马士革以外。”雅威说；他的名是“万军之上帝”。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我必将你们掳到大马士革以外。”
    reason: 原动词为“使……流亡／被掳”的使役形式；主文用“放逐”突出施行放逐的行为，替译用“掳到”保留强制迁徙的含义。
lexical_decisions:
- source_word: וְהִגְלֵיתִי
  choice: 所以，我必把……放逐
  rationale: גלה 的使役形表示使人离乡、进入流亡状态；“把……放逐”在现代汉语中自然地保留了使役意义。句首的 וְ 依上文审判语境译为“所以”。
- source_word: אֶתְכֶם
  choice: 你们
  rationale: 宾格标记附第二人称阳性复数词尾；汉语自然译为“你们”。
- source_word: מֵהָלְאָה לְדַמָּשֶׂק
  choice: 到大马士革以外
  rationale: מֵהָלְאָה 表示越过某处、到更远之地；结合 לְדַמָּשֶׂק，译作“到大马士革以外”，保留目的地在大马士革之外的含义。
- source_word: אָמַר
  choice: 说
  rationale: 先知宣告公式中的完成式在此具有当下宣告的功能；汉语用“说”简洁自然。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文直接音译四字神名，不用称号替代专名。
- source_word: אֱלֹהֵי צְבָאוֹת
  choice: 万军之上帝
  rationale: צְבָאוֹת 可指众军、万军；“万军之上帝”保留其广度，不限定为地上的军队或天军。
- source_word: שְׁמוֹ
  choice: 他的名是
  rationale: 保留希伯来文明确的名词句，使“万军之上帝”作为其名号呈现。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文使用四字神名；“雅威”较直接反映学界通常采用的发音重构，并保留其专名性质。
- issue: צְבָאוֹת 在神圣称号中的范围
  choice: 万军
  alternative: 众军／天军
  rationale: 原词本身没有在本节限定为地上军队或天上军旅，因此采用范围较宽的“万军”。
- issue: 末句 אֱלֹהֵי צְבָאוֹת שְׁמוֹ 的句法
  choice: 他的名是“万军之上帝”
  alternative: 名为万军之上帝／万军之上帝是他的名
  rationale: 保留原文“他的名”这一明确成分，同时用自然汉语表达该称号与神名的关系，不把句子默默改写成“雅威是万军之上帝”。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“放逐”准确传达强制流亡；“大马士革以外”简洁保留空间方向。分号维持“雅威说”与末尾名号句之间的紧密关系。
