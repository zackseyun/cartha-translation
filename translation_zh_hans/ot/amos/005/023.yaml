base_translation:
  language: en
  yaml_path: translation/ot/amos/005/023.yaml
  text: Take away from me the noise of your songs[a], and I will not listen to the melody of your harps.
translation:
  language: zh_hans
  text: 把你歌曲的喧闹声从我面前除掉！你琴瑟[a]所发的乐声，我不听。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “琴瑟”译自原文所指的一类古代弦乐器；其确切形制及对应的现代乐器，不能确定。
    reason: lexical_alternative
lexical_decisions:
- source_word: הָסֵר
  choice: 除掉
  rationale: 使役式命令语气强烈，要求将所说之物移开；“除掉”简洁庄重，并保留直接斥拒的力度。
- source_word: מֵעָלַי
  choice: 从我面前
  rationale: 希伯来语直译近于“从我之上／离开我”；此处表达说话者要求将声音移离自己。“从我面前”是自然的中文表达，也突显拒绝。
- source_word: הֲמוֹן
  choice: 喧嚷
  rationale: 此词可指众多、嘈杂声或轰响；在被拒绝的敬拜歌声语境中，“喧嚷”保留其嘈杂且带贬斥意味的声音形象。
- source_word: שִׁרֶיךָ
  choice: 你歌唱的
  rationale: 原文为“你的歌／歌唱”。与“喧嚷”组合为“你歌唱的喧嚷”，既自然，又不把复数机械译成量词结构。
- source_word: וְזִמְרַת
  choice: 乐声
  rationale: 可指歌声、乐曲或音乐声。结合后面的弦乐器，“乐声”能与前句“歌唱”区分，同时保留泛指音乐声响的语义。
- source_word: נְבָלֶיךָ
  choice: 你的琴瑟
  rationale: נבל指古代弦乐器，确切对应的现代乐器不确定。“琴瑟”在现代中文圣经语体中可自然泛指此类古弦乐器，但以脚注说明不确定性。
- source_word: לֹא אֶשְׁמָע
  choice: 我不听
  rationale: 否定未完成式在此表达上帝拒绝理会这些音乐。“我不听”比“我听不见”更准确地传达主动拒绝，也保留希伯来语简短有力的语气。
theological_decisions:
- issue: 上帝拒绝敬拜音乐的语气
  choice: 以“喧嚷”“除掉”“我不听”直陈强烈拒绝
  alternative: 将 הֲמוֹן 中性地译作“声音”，或将 לֹא אֶשְׁמָע 译作“我听不见”
  rationale: 上下文谴责与公义脱节的敬拜；本节本身的措辞带有明确斥拒意味。译文保留这种先知性的力度，但不在正文中额外加入“虚伪”等解释性定性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“把……除掉”保留命令力度；倒装式“你琴瑟的乐声，我不听”贴近希伯来语的强调次序，并使末句斩截有力。所有第二人称形式在原文中均为阳性单数，语境中可代表作为整体的以色列。
