  text: לָ֠/כֵן יַ֣עַן בּוֹשַׁסְ/כֶ֞ם עַל דָּ֗ל וּ/מַשְׂאַת בַּר֙ תִּקְח֣וּ מִמֶּ֔/נּוּ בָּתֵּ֥י גָזִ֛ית בְּנִיתֶ֖ם וְ/לֹא תֵ֣שְׁבוּ בָ֑/ם כַּרְמֵי חֶ֣מֶד נְטַעְתֶּ֔ם וְ/לֹ֥א תִשְׁתּ֖וּ אֶת יֵינָֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/005/011.yaml
  text: Therefore[a], because you trample on the poor and take a grain tax from him, you have built houses of cut stone, but you will not live in them; you have planted delightful vineyards[c][b], but you will not drink their wine.
translation:
  language: zh_hans
  text: 因此，因你们践踏穷人，向他征收粮食税[a]，你们建造了用凿成的石头建造的房屋[b]，却不得住在其中；栽种了佳美的葡萄园[c]，却不得喝其中所产的酒。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“向他索取粮食贡赋”或“从他征收粮食。”原文指强加在穷人身上、以粮食缴纳的负担或贡赋。
    reason: lexical_alternative
  - marker: b
    text: 或译：“凿石房屋”或“用琢石建造的房屋。”原文指用凿削加工过的石料建成的房屋。
    reason: lexical_alternative
  - marker: c
    text: 或译：“可喜爱的葡萄园”或“上好的葡萄园”。
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן יַעַן
  choice: 所以……既
  rationale: 将结果词与原因词合并为自然的现代汉语因果结构，同时保留先陈罪、后宣判的先知性语气。
- source_word: בּוֹשַׁסְכֶם עַל דָּל
  choice: 你们践踏贫寒人
  rationale: 保留动词的践踏意象，不弱化为一般性的“欺压”；“贫寒人”兼顾经济困顿和弱势处境。
- source_word: וּמַשְׂאַת בַּר תִּקְחוּ מִמֶּנּוּ
  choice: 又向他征收粮食
  rationale: מַשְׂאַת בַּר 指以粮食构成的强制负担或贡赋；正文用通顺而不过度限定制度性质的表达，脚注保留“粮食贡赋”的可能译法。
- source_word: בָּתֵּי גָזִית
  choice: 凿石房屋
  rationale: גָזִית 是经过凿削加工的石料；此译保留昂贵建筑材料的具体形象，又不增译为“豪宅”。
- source_word: וְלֹא תֵשְׁבוּ בָם
  choice: 却不得住在其中
  rationale: 这里是审判宣告，并非单纯预测；“不得”自然表达他们终将无缘享用所建房屋。
- source_word: כַּרְמֵי חֶמֶד
  choice: 佳美的葡萄园
  rationale: חֶמֶד 表示可喜爱、令人向往之物；“佳美”保留其优美、珍贵的意味，而不具体化为品种等级。
- source_word: וְלֹא תִשְׁתּוּ אֶת יֵינָם
  choice: 却喝不到园中的酒
  rationale: 自然表达葡萄园所产的酒将不为栽种者享用，并保留审判中反转期待的讽刺意味。
theological_decisions:
- issue: 审判话语的性质
  choice: 保留为针对剥削行为的直接先知性审判宣告
  alternative: 译成关于不义必受报的一般道德格言
  rationale: 上下文及第二人称复数表明，这不是抽象箴言，而是对具体压迫者宣告：他们借剥削所得的产业，自己不得享用。
- issue: “不得住／喝不到”的语气
  choice: 以确定的结果表达将来的剥夺
  alternative: 理解为法律禁令或道德劝诫
  rationale: 希伯来语未完成式在此承接审判语境，表达将临的结果；译文避免将其误作单纯命令。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。保留“践踏”的强烈意象和房屋、葡萄园两组平行结构；不增添具体宗派术语，也不将“凿石房屋”解释性扩写为“豪宅”。
