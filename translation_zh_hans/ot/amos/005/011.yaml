- from: 所以，你们既践踏贫寒人，又向他征收粮食[a]；你们虽建造了凿石房屋[b]，却不得住在其中；虽栽种了佳美的葡萄园[c]，却喝不到园中的酒。
  to: 因此，因你们践踏穷人，向他征收粮食税[a]，你们建造了用凿成的石头建造的房屋[b]，却不得住在其中；栽种了佳美的葡萄园[c]，却不得喝其中所产的酒。
  rationale: 修订以“因此，因……”清楚呈现先知宣告中罪行与判决的因果关系，并以两个平行分句直接对应“建造／不得住”和“栽种／不得喝”。同时改用较自然的现代汉语，并保留粮食负担、加工石料及葡萄园之酒的具体意象。
