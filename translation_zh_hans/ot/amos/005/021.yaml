  text: שָׂנֵ֥אתִי מָאַ֖סְתִּי חַגֵּי/כֶ֑ם וְ/לֹ֥א אָרִ֖יחַ בְּ/עַצְּרֹֽתֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/005/021.yaml
  text: I hate[a], I reject your festivals, and I will not delight in your solemn assemblies.
translation:
  language: zh_hans
  text: 我恨恶，厌弃你们的节期；在你们的严肃会中，我也不喜悦[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“在你们的严肃会中，我也不闻”。这里借“闻”的祭祀性意象，表达不悦纳、也不以之为悦。
    reason: 保留 אָרִיחַ 的字面嗅觉意象及 בְּעַצְּרֹתֵיכֶם 的场域意义，并说明其在敬拜语境中的含义。
lexical_decisions:
- source_word: שָׂנֵאתִי
  choice: 我恨恶
  rationale: 该词是 שׂנא 的 Qal 完成式第一人称单数，在先知宣告中表达耶和华强烈而直接的憎恶；汉语用现在状态式“我恨恶”最能保留其冲击力。
- source_word: מָאַסְתִּי
  choice: 我厌弃
  rationale: מאס 表示视为不可接受而拒绝、摒弃。“厌弃”既保留主动拒斥之意，也与前面的“恨恶”形成有力的并列，而不完全重复。
- source_word: חַגֵּיכֶם
  choice: 你们的节期
  rationale: חג 指宗教节庆，常包括朝圣节期。“节期”是现代中文圣经语境中清楚、庄重且范围合宜的表达。
- source_word: וְלֹא
  choice: 我也不
  rationale: 连接词与否定词承接前两项斥责；“也不”自然表现希伯来文逐步推进的否定。
- source_word: אָרִיחַ
  choice: 不喜悦
  rationale: 该动词字面与“闻”有关，在献祭和敬拜语境中可借闻香气表达悦纳或以之为乐。因其所关联的是“严肃会”，直译“闻”在现代汉语中较晦涩，正文译出“不喜悦”的语用含义，并以脚注保留原文意象。
- source_word: בְּעַצְּרֹתֵיכֶם
  choice: 你们的严肃会
  rationale: עֲצָרָה／עֲצֶרֶת 指正式召集的宗教性聚会。“严肃会”保留其敬拜场合和庄重语体；句中采用话题结构，使中文自然，同时仍反映介词 ב 所标示的聚会场域。
theological_decisions:
- issue: 以“闻”描写上帝是否悦纳敬拜的拟人化祭祀语言
  choice: 正文译作“你们的严肃会，我也不喜悦”，脚注说明字面意象
  alternative: 直译作“在你们的严肃会中，我也不闻”或扩译为“我也不悦纳你们严肃会中的馨香”
  rationale: 原文借“闻”这一祭祀语汇表达上帝不以这些聚会为悦、也不予悦纳。纯粹直译在中文中容易令人误解为嗅觉陈述，而加入“馨香”又会补入原文未明说的名词。正文保留其否定喜悦的核心含义，脚注则让读者看见原文的具体意象，不把“喜悦”与“悦纳”之间的语义张力绝对化。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“我恨恶，我厌弃”保留原文短促而强烈的并列；分号划分对节期与严肃会的两层斥责。“严肃会”沿用清楚的宗教礼仪用语，但全句以自然的话题结构避免生硬。
