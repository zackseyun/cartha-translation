base_translation:
  language: en
  yaml_path: translation/ot/amos/005/024.yaml
  text: But let justice roll down like waters[b][a], and righteousness like an ever-flowing stream.
translation:
  language: zh_hans
  text: 惟愿公平如众水滚滚流淌，公义如长流不息的溪流。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “长流不息”或译“强劲”。原文可指持久、常年不干涸，也可能强调水流强盛。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִגַּל
  choice: 惟愿……滚滚而来
  rationale: 未完成式在此带愿望或劝令色彩；“惟愿”保留先知式呼吁，“滚滚而来”传达水势不断涌流的动态意象。
- source_word: כַּמַּיִם
  choice: 如众水
  rationale: מַיִם 在希伯来语中为复数形式；“众水”既保留其形式和丰沛意象，也符合庄重的中文表达。
- source_word: מִשְׁפָּט
  choice: 公平
  rationale: 此处指社会与司法生活中合乎正道的秩序；“公平”在现代中文中自然明确，并与后面的“公义”保持词义区分。
- source_word: וּצְדָקָה
  choice: 公义
  rationale: 保留该词道德及关系层面的正直含义，也不把它与 מִשְׁפָּט 合并成同一个中文词。
- source_word: כְּנַחַל
  choice: 如……河川
  rationale: נַחַל 可指溪流、河谷水道或急流；“河川”通俗而庄重，并能承载下文持续有水的意象。
- source_word: אֵיתָן
  choice: 长流不息
  rationale: 在修饰 נַחַל 时主要表达持久、常年不断、不致干涸；“长流不息”自然地呈现这种含义，同时不排除“强劲”的词义可能。
theological_decisions:
- issue: מִשְׁפָּט 与 צְדָקָה 这一伦理词组的译法
  choice: 公平……公义
  alternative: 正义……公正；审判……公义
  rationale: “公平……公义”保留两个希伯来词的区别，兼顾公共社会秩序与道德正直，不将经文限制在单一司法判决或某种特定教义体系中。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“惟愿”呈现先知呼吁的语气；“众水滚滚而来”和“长流不息的河川”保留原文平行结构及鲜明的水流意象。脚注用于保存 אֵיתָן 的真实词义幅度。
