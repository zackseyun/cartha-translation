  terminology: 保留“耶和华”“万军的上帝”“主”三个相邻称号，不将其合并。以“善于哀哭的人”对应“懂得哀哭者”，并在脚注中谨慎说明其可能为熟练或专职的哀悼者，避免把身份或职责当作明说事实。
