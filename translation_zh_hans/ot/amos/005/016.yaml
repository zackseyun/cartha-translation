  to: 因此，耶和华——万军的上帝、主——如此说：各广场都必有哀号；各街道上，人要说：“哀哉！哀哉！”他们要召农夫来哀悼，也召善于哀哭的人[a]来哀号。
  rationale: 修订只处理原文未明说的“主持”角色和将“哀哭”限缩为“哀歌”的问题，并略作现代汉语措辞调整；其余意义、庄重语体及神圣称号均予保留。
