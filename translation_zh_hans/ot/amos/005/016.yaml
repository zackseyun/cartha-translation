id: AMO.5.16
reference: Amos 5:16
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: לָ֠/כֵן כֹּֽה אָמַ֨ר יְהוָ֜ה אֱלֹהֵ֤י צְבָאוֹת֙ אֲדֹנָ֔/י בְּ/כָל רְחֹב֣וֹת מִסְפֵּ֔ד וּ/בְ/כָל חוּצ֖וֹת יֹאמְר֣וּ הוֹ ה֑וֹ וְ/קָרְא֤וּ אִכָּר֙ אֶל אֵ֔בֶל וּ/מִסְפֵּ֖ד אֶל י֥וֹדְעֵי נֶֽהִי־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/005/016.yaml
  text: 'Therefore[a], thus says Yahweh, the God of hosts, the Lord: In all the squares there will be wailing, and in all the streets they will say, “Alas! Alas!” They will call the farmer to mourning[b], and those who know lamentation to wailing.'
translation:
  language: zh_hans
  text: 因此，耶和华——万军的上帝、主——如此说：各广场都必有哀号；各街道上，人要说：“哀哉！哀哉！”他们要召农夫来哀悼，也召善于哀哭的人[a]来哀号。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译“懂得哀哭的人”，可能指熟练的或专职的哀悼者。
    reason: cultural_note
lexical_decisions:
- source_word: לָכֵן
  choice: 因此
  rationale: 承接前文的控诉与警告，清楚表达推论关系。
- source_word: כֹּה אָמַר
  choice: 如此说
  rationale: 保留先知传信公式的庄重与简洁。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文读者熟悉的专名形式，明确呈现四字神名，不以“主”替代。
- source_word: אֱלֹהֵי צְבָאוֹת
  choice: 万军之上帝
  rationale: 保留“众军之神”的广泛含义，不限定为地上或天上的军队。
- source_word: אֲדֹנָי
  choice: 主
  rationale: 作为与前述神名及称号同位的神圣头衔，译为自然庄重的“主”。
- source_word: בְּכָל רְחֹבוֹת
  choice: 所有广场上
  rationale: רְחֹבוֹת 指城中的宽阔公共空间，“广场”比泛称“街道”更准确。
- source_word: מִסְפֵּד
  choice: 哀号
  rationale: 表现公开、可听见的丧悼声，与全城哀恸的场景相符。
- source_word: בְּכָל חוּצוֹת
  choice: 条条街道上
  rationale: חוּצוֹת 在此指城中的户外道路，与前面的广场形成自然对应。
- source_word: הוֹ הוֹ
  choice: 哀哉！哀哉！
  rationale: 传达丧悼时的悲声，而不是把它处理成针对他人的灾祸宣告。
- source_word: אִכָּר
  choice: 农夫
  rationale: 现代中文中对耕作者最清楚自然的称呼；希伯来文单数在此具有泛指、集合意义。
- source_word: אֶל אֵבֶל
  choice: 来哀悼
  rationale: 自然表达被召来参与丧悼活动的意思。
- source_word: יֹדְעֵי נֶהִי
  choice: 熟悉哀歌的人
  rationale: 直译其“懂得哀歌者”的含义，同时保留他们可能是专门哭丧者而文本并未明说的余地。
theological_decisions:
- issue: 神圣称号 יְהוָה אֱלֹהֵי צְבָאוֹת אֲדֹנָי 的处理
  choice: 耶和华——万军之上帝、主——
  alternative: 主耶和华——万军之上帝——
  rationale: 原文依次出现四字神名、万军之上帝和“主”。译文保留三项并列同位关系，避免合并或省略称号；破折号使中文句法清楚。
- issue: יֹדְעֵי נֶהִי 是否明确译作职业哭丧者
  choice: 正文译“熟悉哀歌的人”，脚注说明可能指专门哭丧的人
  alternative: 职业哭丧者
  rationale: 原文强调他们“懂得/熟悉”哀歌，虽很可能指有专门技能者，却未直接说明其职业身份，因此正文保留这一含蓄性。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。“条条街道”自然表达希伯来文“所有街道”的遍及性；末句重复“召”以补足中文句法，并清楚显示农夫与熟悉哀歌的人都被召来参与哀悼。
