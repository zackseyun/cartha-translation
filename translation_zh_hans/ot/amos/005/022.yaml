  text: כִּ֣י אִם תַּעֲלוּ לִ֥/י עֹל֛וֹת וּ/מִנְחֹתֵי/כֶ֖ם לֹ֣א אֶרְצֶ֑ה וְ/שֶׁ֥לֶם מְרִיאֵי/כֶ֖ם לֹ֥א אַבִּֽיט־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/005/022.yaml
  text: For even if you offer up to me burnt offerings and your grain offerings[a], I will not accept them; and I will not look upon the peace offerings of your fattened animals.
translation:
  language: zh_hans
  text: 即使你们向我献上燔祭和素祭，我也不悦纳；你们用肥畜献的平安祭[a]，我也不看顾。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “平安祭”也可理解为“团契祭”。希伯来语指一种与福祉、和好及共同享用有关的特定祭类。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: 即使
  rationale: 本处结合上下文表达让步关系；现代汉语用“即使”自然明确。句首连接意味可由上下文承接，无须生硬加入“因为”。
- source_word: תַּעֲלוּ לִי
  choice: 向我献上
  rationale: עלה的使役式与祭物连用时指在坛上献祭；“献上”既保留祭祀含义，也符合现代汉语表达。
- source_word: עֹלוֹת
  choice: 燔祭
  rationale: 这是全部焚烧献上的特定祭类；“燔祭”是准确且通行的中文圣经术语。
- source_word: וּמִנְחֹתֵיכֶם
  choice: 和素祭
  rationale: מִנְחָה在本祭祀语境中指以谷物为主的特定祭类；“素祭”简洁地保留其礼仪专名性质。
- source_word: לֹא אֶרְצֶה
  choice: 我也不悦纳
  rationale: רצה在祭祀语境中表示带着喜悦或认可而接纳；“悦纳”同时传达认可与接受，且宾语可由上句祭物自然补足。
- source_word: וְשֶׁלֶם
  choice: 平安祭
  rationale: 该词指与福祉、和好及共同享用有关的特定祭类；采用通行的“平安祭”，并以脚注提示其共享相交的含义。
- source_word: מְרִיאֵיכֶם
  choice: 你们用肥畜献的
  rationale: מְרִיאִים指养肥的牲畜；此表达准确自然，并清楚表明这些牲畜是平安祭的祭牲。
- source_word: לֹא אַבִּיט
  choice: 我也不看顾
  rationale: נבט本义为观看，此处含重视、垂顾之意；“不看顾”保留视觉意象，也传达拒绝眷顾和认可。
theological_decisions:
- issue: 是否保留各类祭物的礼仪专名
  choice: 分别译作“燔祭”“素祭”和“平安祭”
  alternative: 概括译作“祭物”或“供物”
  rationale: 原文逐一列举特定祭类。保留这些类别可呈现先知谴责的具体对象，避免把经文泛化，也不额外引入后来的教义解释。
- issue: 如何表达上帝对祭物的拒绝
  choice: 以“不悦纳”和“不看顾”保留两个不同动词
  alternative: 两处都译作“不接受”
  rationale: 原文先用רצה表达不予认可或喜悦接纳，后用נבט表达不予注视或重视。区别翻译可保留诗性平行中的语义变化。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。保留“燔祭、素祭、平安祭”等必要的礼仪术语；句式简洁，两个“我也不……”形成对应，贴近希伯来文的平行结构。
