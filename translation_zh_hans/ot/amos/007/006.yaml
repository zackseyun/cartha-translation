  source_fidelity: 译文准确传达了נִחַם（就此改变所宣布的行动）、עַל זֹאת（就这事）、גַּם הִיא（这事也）和לֹא תִהְיֶה（不会发生）的语义，也正确区分了单独出现的神名“耶和华”与称谓组合“主耶和华”。但“回心转意”在现代汉语中常带有改正原先不当想法或行为的语感；用于神时虽可理解，却不如“改变了心意”中性，较易额外引出原文未明说的含义。
