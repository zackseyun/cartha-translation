  to: 耶和华就这事改变了心意[a]。主耶和华说：“这事也不会发生。”
  rationale: 将“回心转意”改为“改变了心意”，更中性地对应נִחַם，并保留原文所呈现的耶和华因代求而不施行所宣布之事的关系性、拟人化表达。相应调整脚注，使其先提供较贴近语境的替代译法，且不把神学结论强加于正文。
