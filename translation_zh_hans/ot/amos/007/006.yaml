base_translation:
  language: en
  yaml_path: translation/ot/amos/007/006.yaml
  text: 'Yahweh relented concerning this also: “It too shall not happen,” said the Lord GOD[a].'
translation:
  language: zh_hans
  text: 耶和华就这事改变了心意[a]。主耶和华说：“这事也不会发生。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“耶和华就这事不再施行”。希伯来文以拟人化语言描述耶和华对代求的回应。
    reason: lexical_alternative
lexical_decisions:
- source_word: נִחַם
  choice: 回心转意
  rationale: 此处尼法勒形态表示耶和华回应阿摩司的代求，不再施行所示的灾祸；“回心转意”保留希伯来文拟人化、关系性的表达，又不暗示先前有道德过错。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经传统中通行的神圣名字译法，区别于表示称号的“主”。
- source_word: עַל זֹאת
  choice: 为这事
  rationale: 指关于异象中所示灾祸的决定；“为这事”符合中文习惯，并能与“回心转意”自然搭配。
- source_word: גַּם הִיא
  choice: 这事也
  rationale: 阴性代词回指所示的灾祸，גַּם 表示这是继前一异象之后同样不会实现的事。
- source_word: לֹא תִהְיֶה
  choice: 不会发生
  rationale: 字面为“不会有”，在此语境中指灾祸不会成为事实；译作“不会发生”清楚自然。
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: 分别保留 אֲדֹנָי 的称号“主”和 יְהוָה 的名字“耶和华”，避免把组合称谓解释性扩展为“至高的主”等。
theological_decisions:
- issue: נִחַם 对上帝使用的拟人化语言
  choice: 保留为“回心转意”，并以脚注提示也可表达为“不再降下这灾”。
  alternative: 后悔；怜悯；不再施行
  rationale: 原文直接描写耶和华回应先知代求而改变所宣布的行动方向。正文保留这种关系性表达及其神学张力，不借译文预先消解；脚注帮助读者避免把它理解成承认道德错误。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。保留前半句叙述、后半句直接引语的结构；用“耶和华”呈现神名，用“主耶和华”呈现组合称谓。
