  text: וַ/יֹּ֤אמֶר אֲמַצְיָה֙ אֶל עָמ֔וֹס חֹזֶ֕ה לֵ֥ךְ בְּרַח לְ/ךָ֖ אֶל אֶ֣רֶץ יְהוּדָ֑ה וֶ/אֱכָל שָׁ֣ם לֶ֔חֶם וְ/שָׁ֖ם תִּנָּבֵֽא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/007/012.yaml
  text: Then Amaziah said to Amos[a], “Seer, go, flee away to the land of Judah, and eat bread there, and prophesy there.”
translation:
  language: zh_hans
  text: 亚玛谢对阿摩司说：“先见哪，走吧！逃到犹大地去，在那里吃饭[a]，也在那里说预言。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在那里谋生”；原文直译为“在那里吃饼”，这里可能指靠说预言维持生计。
    reason: 说明字面表达及其可能的惯用含义，保留亚玛谢话语中的含混和轻蔑语气。
lexical_decisions:
- source_word: חֹזֶה
  choice: 先见
  rationale: 这是对能看见异象之人的特定称呼，有别于较常见的“先知”；“先见”保留了原词与视觉启示相关的含义，也适合作为直接称呼。
- source_word: לֵךְ בְּרַח לְךָ
  choice: 走吧！逃到……去
  rationale: 两个祈使形式连续出现；“走吧”保留 לֵךְ，“逃到……去”表达 ברח 与附加 לְךָ 所带的赶快离去、为自己逃走的语气。
- source_word: אֶרֶץ יְהוּדָה
  choice: 犹大地
  rationale: 保留 אֶרֶץ 的地域和政治疆域含义，同时符合现代汉语圣经语体。
- source_word: וֶאֱכָל שָׁם לֶחֶם
  choice: 在那里吃饭
  rationale: 原文直译为“在那里吃饼”。现代汉语“吃饭”自然地表达日常谋生意味，又没有在正文中把亚玛谢暗含的指控完全解释出来；脚注说明其可能含义。
- source_word: תִּנָּבֵא
  choice: 说预言
  rationale: 准确表达 נבא 的尼法勒式在此所指的先知性宣告，语言通俗清楚。
- source_word: וַיֹּאמֶר
  choice: 亚玛谢对阿摩司说
  rationale: 汉语叙事中无需机械译出句首连接词；直接进入言说事件，既自然又保留叙事推进。
theological_decisions:
- issue: 是否把“吃饭”明确译成靠说预言谋生
  choice: 正文保留“在那里吃饭”，用脚注说明谋生含义
  alternative: 译作“在那里谋生”或“在那里靠说预言糊口”
  rationale: 上下文很可能带有轻蔑意味，把阿摩司视为靠说预言谋生的人；但希伯来文本明说的是“吃饼”。保留具体说法可避免在正文中过度坐实亚玛谢的指控，同时让脚注呈现可能的惯用含义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“先见”保留专门的先知称谓；以短促祈使句传达亚玛谢驱赶阿摩司的语气。脚注标记紧随相关词语。
