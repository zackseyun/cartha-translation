base_translation:
  language: en
  yaml_path: translation/ot/amos/007/003.yaml
  text: 'Yahweh relented concerning this: “It will not happen,” said Yahweh[a].'
translation:
  language: zh_hans
  text: 雅威就这事改变了心意[a]。“这事不会发生。”雅威说。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“雅威对这事回心转意”，也可译：“雅威为这事感到遗憾。”希伯来语这个动词按语境可表示改变心意、感到遗憾，或改变原拟采取的行动。
    reason: 词义有多种可能，并涉及对神使用拟人化语言的表达。
lexical_decisions:
- source_word: נִחַם
  choice: 回心转意
  rationale: 该动词在此为尼法勒式，结合先知代求和审判异象的语境，表示雅威不再实施原先宣告的行动。“回心转意”保留神改变拟行之事这一拟人化表达，同时不像“后悔”那样容易让现代读者误解为承认犯错。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常用音译呈现四字神名，保留其作为以色列之神专名的性质，不以称号“主”代替。
- source_word: עַל זֹאת
  choice: 对这事
  rationale: 指回前文异象所呈现的审判；译法简洁自然，也不额外限定其所指。
- source_word: לֹא תִהְיֶה
  choice: 这事不会发生
  rationale: 阴性单数动词所指是上下文中拟议的灾祸或事件。“这事不会发生”以自然现代汉语表达将来的否定，又不把隐含对象具体化为原文未明说的“灾”。
- source_word: אָמַר יְהוָה
  choice: 雅威说
  rationale: 按普通陈述动词直译，不加强为公式化的“雅威宣告”。
theological_decisions:
- issue: נִחַם יְהוָה 对神使用拟人化、拟情化的语言
  choice: 译作“雅威对这事回心转意”，保留经文所描写的神撤回原拟施行之审判。
  alternative: “雅威对这事改变了心意”或“雅威为这事后悔了”
  rationale: 原文容许“回心转意、改变心意、感到遗憾”等语义色彩。正文既不应消除神回应代求而改变拟行之事的张力，也不应让“后悔”在现代汉语中暗示神犯了道德错误；脚注因此保留其他可能译法。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“这事”承接上文异象，不擅自补出“灾祸”；重复“雅威”以保留原文两次出现神名的强调。
