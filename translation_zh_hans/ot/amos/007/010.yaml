  rationale: 修订将政治性指控由较具体的“图谋背叛你”改为更贴近原文介词关系且语义较开放的“密谋反对你”。同时以“派人去禀报”清楚表达差遣传信，并以“容不下他所说的一切话”自然保留原文“不能容纳/承受”的修辞双关。脚注继续提供“结党谋反”及“承受/忍受”等可行替代译法。
