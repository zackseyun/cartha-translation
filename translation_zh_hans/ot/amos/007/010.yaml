  text: וַ/יִּשְׁלַ֗ח אֲמַצְיָה֙ כֹּהֵ֣ן בֵּֽית אֵ֔ל אֶל יָרָבְעָ֥ם מֶֽלֶךְ יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר קָשַׁ֨ר עָלֶ֜י/ךָ עָמ֗וֹס בְּ/קֶ֨רֶב֙ בֵּ֣ית יִשְׂרָאֵ֔ל לֹא תוּכַ֣ל הָ/אָ֔רֶץ לְ/הָכִ֖יל אֶת כָּל דְּבָרָֽי/ו־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/007/010.yaml
  text: Then Amaziah[a], the priest of Bethel, sent word to Jeroboam king of Israel, saying, “Amos has conspired against you in the midst of the house of Israel[c][b]; the land is not able to bear all his words.”
translation:
  language: zh_hans
  text: 于是，伯特利的祭司亚玛谢派人去禀报以色列王耶罗波安，说：“阿摩司在以色列家中密谋反对你[a]；这地容不下他所说的一切话[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“图谋反对你”或“结党谋反”。希伯来语动词在政治语境中可指策划阴谋或结党谋反。
    reason: lexical_alternative
  - marker: b
    text: 或译：“这地承受不了他所说的一切话”或“这地无法忍受他所说的一切话”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: 派人去见
  rationale: 原文直译为“差遣”，未明说所差之人；下接“说”，表明这是传递消息。译作“派人去见”符合现代汉语，又不把亚玛谢本人误作前往者。
- source_word: כֹּהֵן בֵּית־אֵל
  choice: 伯特利的祭司
  rationale: 保留原文所属关系，可指与伯特利圣所相关的祭司职分；汉语表达自然庄重。
- source_word: קָשַׁר עָלֶיךָ
  choice: 图谋背叛你
  rationale: קשר在政治语境中常指结党、谋反或策划阴谋。此处是亚玛谢向王提出的政治指控；“图谋背叛”既传达严重性，也保留其指控性质。
- source_word: בְּקֶרֶב בֵּית יִשְׂרָאֵל
  choice: 在以色列家中
  rationale: בקרב有“在……中间、内部”之意；“以色列家”保留先知文学中的民族—群体称谓，而不简化为“以色列”。
- source_word: הָאָרֶץ
  choice: 这地
  rationale: 语境指以色列国土或国中社会，并非全世界；“这地”贴近定冠词所指的当地政治共同体。
- source_word: לְהָכִיל
  choice: 承受不了
  rationale: 该动词表达容纳、承载或忍受的能力。此处兼有无法容纳其言论及无法忍受其冲击的修辞意味，“承受不了”自然地保留二者。
- source_word: כָּל־דְּבָרָיו
  choice: 他这一切的话
  rationale: 保留“所有”和复数“话语”的总体性；“这一切的话”符合现代汉语。
theological_decisions:
- issue: 亚玛谢对阿摩司的指控是否为叙述者认可的事实
  choice: 按直接引语译为亚玛谢所作的政治指控：“图谋背叛你”
  alternative: “密谋反对你”或“结党谋反”
  rationale: 经文仅报道亚玛谢向王所说的话，并未由叙述者确认阿摩司确实谋反。译文保留指控的力度，同时不替叙述者裁定其真伪。
- issue: “这地不能容纳”所表达的是物理容量还是社会忍受
  choice: 译作“这地承受不了”
  alternative: “这地容不下”或“这地无法忍受”
  rationale: 原词可涵盖容纳与忍受；“承受不了”保留这种修辞张力，不将意义限定为单纯空间或情绪上的不能忍受。
translation_notes:
  register: 采用现代标准汉语，语气庄重而清晰。“于是”承接叙事，“派人去见……说”自然表达希伯来语的差遣传话结构。保留“以色列家”这一先知文学常用称谓，并用脚注呈现关键动词的真实语义范围。
