id: AMO.7.17
reference: Amos 7:17
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: לָ/כֵ֞ן כֹּה אָמַ֣ר יְהוָ֗ה אִשְׁתְּ/ךָ֞ בָּ/עִ֤יר תִּזְנֶה֙ וּ/בָנֶ֤י/ךָ וּ/בְנֹתֶ֨י/ךָ֙ בַּ/חֶ֣רֶב יִפֹּ֔לוּ וְ/אַדְמָתְ/ךָ֖ בַּ/חֶ֣בֶל תְּחֻלָּ֑ק וְ/אַתָּ֗ה עַל אֲדָמָ֤ה טְמֵאָה֙ תָּמ֔וּת וְ/יִ֨שְׂרָאֵ֔ל גָּלֹ֥ה יִגְלֶ֖ה מֵ/עַ֥ל אַדְמָתֽ/וֹ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/amos/007/017.yaml
  text: 'Therefore[a], this is what Yahweh says: ‘Your wife will prostitute herself in the city, and your sons and your daughters will fall by the sword, and your land will be divided by measuring line; and you yourself will die on unclean land[c][b], and Israel will surely go into exile from its land.’'
translation:
  language: zh_hans
  text: 所以，雅威如此说：“你的妻子必在城中卖淫；你的儿女必倒在刀下；你的土地必被丈量绳分割[a]；你自己必死在不洁净之地；以色列必定流亡，离开自己的土地[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“用绳分割”，指用来丈量并划分土地的绳索。
    reason: lexical_alternative
  - marker: b
    text: “必定流亡”所译的希伯来文采用同词根的不定式绝对式与限定动词连用，强调这事必定发生。
    reason: source_emphasis
lexical_decisions:
- source_word: לָכֵן
  choice: 所以
  rationale: 承接亚玛谢对阿摩司的敌对言行，引出审判后果；“所以”自然保留推论关系。
- source_word: כֹּה אָמַר יְהוָה
  choice: 雅威如此说
  rationale: 保留先知宣告的使者公式，并按项目惯例将神名 יְהוָה 译为“雅威”。
- source_word: תִּזְנֶה
  choice: 必……卖淫
  rationale: זנה 在此直指卖淫；译文保留审判宣告的尖锐与羞辱性，不弱化为笼统的性不道德。
- source_word: וּבָנֶיךָ וּבְנֹתֶיךָ
  choice: 你的儿女
  rationale: 希伯来文明确并列“儿子和女儿”；现代汉语“儿女”简洁且完整涵盖这对性别并列。
- source_word: בַּחֶרֶב יִפֹּלוּ
  choice: 必倒在刀下
  rationale: 保留希伯来文常见的战争死亡意象，同时符合庄重的现代汉语表达。
- source_word: בַּחֶבֶל תְּחֻלָּק
  choice: 必被人用准绳分割
  rationale: חֶבֶל 在分地语境中指丈量土地的绳索；“准绳”保留具体意象，被动式则对应 תְּחֻלָּק。
- source_word: וְאַתָּה
  choice: 你自己
  rationale: 独立人称代词具有强调作用，“你自己”将其体现出来。
- source_word: עַל אֲדָמָה טְמֵאָה
  choice: 在不洁净之地
  rationale: 直译关键概念而不在正文中断定其仅指礼仪、道德或外邦地域意义。
- source_word: גָּלֹה יִגְלֶה
  choice: 必被掳
  rationale: 同词根不定式绝对式与限定动词连用，强化被掳这一事件的确定性；汉语以“必”自然表达。
- source_word: מֵעַל אַדְמָתוֹ
  choice: 离开自己的土地
  rationale: מֵעַל 表示从其土地之上离开；“离开自己的土地”自然体现被迁离本土。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 采用较贴近四字神名的通行音译，并保留先知公式中的专名性质。
- issue: “不洁净之地”的所指
  choice: 正文保留“不洁净之地”
  alternative: 明确解释为外邦之地或礼仪上不洁净的土地
  rationale: 上下文暗示流亡异地，但原文没有进一步说明“不洁净”的确切层面，因此不在正文中替文本消解其礼仪与盟约含义。
- issue: גָּלֹה יִגְלֶה 的强调
  choice: 以“必被掳”表达确定性
  alternative: 直译为“被掳，必被掳”
  rationale: 原结构强调被掳的确定性；用现代汉语“必”传达强调，避免生硬重复。
translation_notes:
  register: 采用现代、庄重而直接的先知审判语体。分号呈现原文连续并列的灾祸宣告；不淡化“卖淫”“倒在刀下”等强烈措辞，也不额外解释妻子卖淫究竟出于强迫、战争处境或其他原因。
