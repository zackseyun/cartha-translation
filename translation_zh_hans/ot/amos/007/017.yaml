    issue: “必被掳”将 גָּלֹה יִגְלֶה 处理为被动的“被掳”。
    rationale: 原文为 גלה 的不定式绝对式加未完成式，基本义为“必定流亡／必定进入流亡”，着重确定性；文本本身在此不使用“被掳”的被动表达。
  - severity: low
    issue: “必被掳离开自己的土地”搭配不够自然。
    rationale: 改为“必定流亡，离开自己的土地”既顺畅，又保留 מֵעַל אַדְמָתוֹ 所表达的离开本土。
  - severity: low
    issue: “准绳”在现代汉语中容易优先理解为行为标准。
    rationale: 在土地划分的上下文中，“丈量绳”更明确地传达 חֶבֶל 的具体物象，且不增加解释性内容。
