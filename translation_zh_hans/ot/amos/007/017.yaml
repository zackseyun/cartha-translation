revisions:
- from: 所以，雅威如此说：“你的妻子必在城中卖淫；你的儿女必倒在刀下；你的土地必被人用准绳分割[a]；你自己必死在不洁净之地；以色列必被掳离开自己的土地[b]。”
  to: 所以，雅威如此说：“你的妻子必在城中卖淫；你的儿女必倒在刀下；你的土地必被丈量绳分割[a]；你自己必死在不洁净之地；以色列必定流亡，离开自己的土地[b]。”
  rationale: 仅修订末句以避免将原文的流亡动词不必要地转为被动“被掳”，并相应更新强调式脚注；同时以“丈量绳”明确土地划分所用的具体绳索。其余措辞保留原稿的现代、庄重语体及其对原文强烈审判语言的忠实呈现。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T08:16:06Z'
review_pass:
  verdict: revise
  source_fidelity: 译文总体准确保留了审判宣告的并列结构、明确的性别对举、刀剑死亡、土地被划分、死于不洁净之地，以及不定式绝对式所表达的确定性。惟末句的 גָּלֹה יִגְלֶה 是“必定流亡／必定被迁徙”（去流亡）的强调式，并非严格意义上的被动“必被掳”；改用“必定流亡”更贴合原文，同时仍保留流亡通常伴随强制迁离的历史含义。
  naturalness: “以色列必被掳离开自己的土地”在现代汉语中搭配略显生硬。“以色列必定流亡，离开自己的土地”更自然、庄重，也清楚表达迁离本土。将“准绳”明确为“丈量绳”可避免现代汉语中“准绳”常指规范、标准的联想。
  terminology: “雅威”“不洁净之地”“卖淫”“儿女”“倒在刀下”均可保留。“丈量绳”准确对应此处分地语境中的 חֶבֶל；“流亡”比“被掳”更直接对应 גלה 的基本语义。
  issues:
