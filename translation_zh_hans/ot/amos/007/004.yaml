  text: כֹּ֤ה הִרְאַ֨/נִי֙ אֲדֹנָ֣/י יְהוִ֔ה וְ/הִנֵּ֥ה קֹרֵ֛א לָ/רִ֥ב בָּ/אֵ֖שׁ אֲדֹנָ֣/י יְהוִ֑ה וַ/תֹּ֨אכַל֙ אֶת תְּה֣וֹם רַבָּ֔ה וְ/אָכְלָ֖ה אֶת הַ/חֵֽלֶק־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/007/004.yaml
  text: 'This is what the Lord GOD showed me: behold[a], the Lord GOD was calling for a judgment by fire[b], and it consumed the great deep and was consuming the land.'
translation:
  language: zh_hans
  text: 这样，主雅威使我看见：看哪，主雅威呼唤火来施行审判[a]；火吞没了浩瀚的深渊，并继续吞噬那一份[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “施行审判”或译“以火争辩”或“以火诉讼”；希伯来语 ריב 带有争端、诉讼和司法裁断的意味。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“那一份”或“那部分”；可能指所分得的土地、领地或产业份额。
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה הִרְאַנִי
  choice: 让我看见这样的景象
  rationale: כֹּה引出异象报告，הִרְאַנִי是ראה的使役式；此译既表达“使我看见”，又自然说明所见为异象。
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: 保留אֲדֹנָי的称号“主”和四字神名的传统汉语音译“耶和华”，避免合并两个成分。
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留异象突然呈现时的指示和强调作用，也符合庄重的先知文体。
- source_word: קֹרֵא לָרִב בָּאֵשׁ
  choice: 召来火施行审判
  rationale: קֹרֵא表达召唤，ריב含争辩、诉讼或司法裁断意味；用“施行审判”传达司法语感，同时不把场景限定为字面的法庭诉讼。
- source_word: וַתֹּאכַל
  choice: 火吞灭了
  rationale: 阴性动词所指为前文的“火”；汉语明示主语以免歧义，“吞灭”保留אָכל的吞噬意象。
- source_word: תְּהוֹם רַבָּה
  choice: 浩瀚的深渊
  rationale: תְּהוֹם指深渊或深水，רַבָּה表示巨大、广阔；“浩瀚”自然体现其规模而不引入后期观念。
- source_word: וְאָכְלָה
  choice: 又开始吞噬
  rationale: 与前一完成动作形成推进，使异象中的火势呈现继续展开之感。
- source_word: הַחֵלֶק
  choice: 那一份土地
  rationale: חֵלֶק本义是“一份、分得之地”；译文兼顾字面上的“份”和此处可能指土地或所分领地的语境，避免直接消除歧义。
theological_decisions:
- issue: 复合神名אֲדֹנָי יְהוִה的译法
  choice: 主耶和华
  alternative: 主上帝；主雅威
  rationale: “主耶和华”在现代中文圣经语境中清楚、庄重，并分别呈现称号与专名；不以“上帝”取代神名。
- issue: ריב的司法含义
  choice: 施行审判
  alternative: 以火争辩；以火提出诉讼
  rationale: 语境显然涉及神借火裁断，但原词也可指争辩或诉讼；正文采用自然的司法表达，脚注保留其他可能。
- issue: הַחֵלֶק的指称
  choice: 那一份土地
  alternative: 那一份；那片土地；所分得的产业
  rationale: 原词没有明说“土地”，但上下文很可能指分得的地域；采用兼容式表达，并在脚注中保留较字面的读法。
translation_notes:
  register: 采用现代、庄重而易懂的先知异象文体。“看哪”保留原文的突显效果；两处“吞”形成递进。“那一份土地”刻意保留הַחֵלֶק在“份额”与“地域”之间的语义张力。
