  text: וָ/אֹמַ֗ר אֲדֹנָ֤/י יְהוִה֙ חֲדַל נָ֔א מִ֥י יָק֖וּם יַעֲקֹ֑ב כִּ֥י קָטֹ֖ן הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/007/005.yaml
  text: Then I said[a], “Lord GOD, please cease[b]. How can Jacob stand? For he is small.”
translation:
  language: zh_hans
  text: 于是我说：“主耶和华[a]啊，求你止息吧！雅各怎能站立得住呢？[b]因为他微小。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文是“主耶和华”（אֲדֹנָי יְהוִה），由“主”和上帝的专名 יהוה 组成。
    reason: lexical_alternative
  - marker: b
    text: 或译：“谁能使雅各站起来呢？”原文措辞简练，既可理解为雅各怎能存立，也可理解为谁能使雅各重新起来。
    reason: alternative_reading
lexical_decisions:
- source_word: וָאֹמַר
  choice: 于是我说
  rationale: וַ־连续式推进叙事；“于是”自然表达前后相承的动作。
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: 分别保留 אֲדֹנָי（主）与上帝的专名 יהוה；这是现代中文圣经语体中清楚而庄重的组合称谓。
- source_word: חֲדַל נָא
  choice: 求你住手吧
  rationale: חֲדַל 是停止行动的命令式，נָא 表示恳求；“求你住手吧”在中文中自然地传达阿摩司急切的代求。
- source_word: מִי יָקוּם יַעֲקֹב
  choice: 雅各怎能站立得住呢？
  rationale: 在审判异象的语境中，将简练的疑问理解为雅各无法承受、存立；“站立得住”保留 קום 的站立意象，同时以脚注注明另一种句法理解。
- source_word: יַעֲקֹב
  choice: 雅各
  rationale: 保留原文用于指称以色列民族的专名及其盟约色彩，不直接改译为“以色列”。
- source_word: כִּי קָטֹן הוּא
  choice: 因为他弱小
  rationale: כִּי 引出代求的理由；קָטֹן 基本义为小、微小，此处指雅各作为民族力量微弱，“弱小”比生硬的“很小”更符合现代中文，同时不过度扩展为特定政治或军事解释。
theological_decisions:
- issue: 复合神名 אֲדֹנָי יְהוִה 的译法
  choice: 主耶和华
  alternative: 主上帝
  rationale: “主耶和华”同时反映称号 אֲדֹנָי 与专名 יהוה，不把专名无声地改成一般称谓；脚注说明其构成而不引入宗派性解释。
- issue: מִי יָקוּם יַעֲקֹב 的主语与语义
  choice: 雅各怎能站立得住呢？
  alternative: 谁能使雅各站起来呢？
  rationale: 原文极其简练，מִי 通常是“谁”，而 קום 可指站立、起来，也可在某些结构中带有使其兴起的理解。上下文支持“雅各如何存立”的反问，但不应抹去“谁能使雅各起来”的可能性，故将后者列入脚注。
translation_notes:
  register: 采用现代、庄重而易懂的中文。“求你住手吧”保留代求的急切语气；“站立得住”和“弱小”保持原文意象及雅各被人格化的单数表达。
