  naturalness: “耶和华对我说”比“耶和华问我”更合乎叙事引语的现代中文表达，也更准确地涵盖后面的问话。“看哪，我正把……”能较好呈现 הִנְנִי שָׂם 的宣告性、进行性画面；全句仍保持庄重自然。
