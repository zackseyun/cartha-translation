  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֵלַ֗/י מָֽה אַתָּ֤ה רֹאֶה֙ עָמ֔וֹס וָ/אֹמַ֖ר אֲנָ֑ךְ וַ/יֹּ֣אמֶר אֲדֹנָ֗/י הִנְ/נִ֨י שָׂ֤ם אֲנָךְ֙ בְּ/קֶ֨רֶב֙ עַמִּ֣/י יִשְׂרָאֵ֔ל לֹֽא אוֹסִ֥יף ע֖וֹד עֲב֥וֹר לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/007/008.yaml
  text: And Yahweh said to me[a], “What do you see, Amos?” And I said, “A plumb line.” Then the Lord said, “Look, I am setting a plumb line in the midst of my people Israel[b]; I will not again pass by them.”
translation:
  language: zh_hans
  text: 耶和华对我说：“阿摩司，你看见什么？”我说：“一条铅垂线[a]。”主说：“看哪，我正把铅垂线放在我子民以色列中间；我不再放过他们[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “铅垂线”所译的希伯来词含义不完全确定，也可能指锡、铅、铅锤，或与铅垂线有关的测量器具或材料。
    reason: lexical_alternative
  - marker: b
    text: “我不再放过他们”可能是说：“我不再宽容他们”，或“我不再忽略他们的罪。”
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文通行的专名“耶和华”表达四字神名，并与本节后文的称号“主”相区别。
- source_word: מָה אַתָּה רֹאֶה
  choice: 你看见什么
  rationale: 自然地表达异象场景中针对眼前所见的提问。
- source_word: אֲנָךְ
  choice: 铅垂线
  rationale: 上下文指检验垂直准直的器具；该词的确切词源和所指仍有争议，可能与锡、铅或铅锤有关，因此在脚注保留歧义。
- source_word: אֲדֹנָי
  choice: 主
  rationale: 这里是对上帝的称号，不是四字神名；译作“主”以保留两者区别。
- source_word: הִנְנִי
  choice: 看哪，我要
  rationale: “看哪”保留提示注意和宣告的语气；“我要”符合中文中对即将施行之行动的自然表达。
- source_word: שָׂם
  choice: 放在
  rationale: 简洁表达把准绳置于以色列中间的动作，保持异象的空间意象。
- source_word: בְּקֶרֶב
  choice: 在……中间
  rationale: 保留该物被置于以色列内部的空间含义，而不弱化为泛指“在他们当中”。
- source_word: לֹא אוֹסִיף עוֹד עֲבוֹר לוֹ
  choice: 我不再放过他们
  rationale: “放过”既与希伯来语“经过/越过”的意象有联系，也自然传达上下文中不再宽容、免除审判的含义；代词在希伯来语中为单数，但其所指是作为整体的以色列民，中文用复数“他们”更清楚。
theological_decisions:
- issue: 神名与称号的区别
  choice: 将 יְהוָה 译为“耶和华”，将 אֲדֹנָי 译为“主”
  alternative: 两者都译为“主”，或将前者音译为“雅威”
  rationale: 原文在同一节中有意使用神名和称号两种形式；中文译文予以区分，以保存源文本的细微差别。
- issue: לֹא אוֹסִיף עוֹד עֲבוֹר לוֹ 的审判含义
  choice: 正文译为“我不再放过他们”，脚注说明也可理解为不再宽容或忽略其罪
  alternative: 直译为“我不再从他们旁边经过”，或明确意译为“我不再饶恕他们”
  rationale: “放过”在现代中文中自然传达停止宽容的审判语境，同时没有把含义强化为原文未明确使用的“饶恕”；脚注保留其习语性质和解释空间。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“耶和华”与“主”分别呈现神名和称号；“铅垂线”是普通读者可理解的建筑测量用语；正文简洁保留异象与审判的力度，词义不确定处用脚注说明。
