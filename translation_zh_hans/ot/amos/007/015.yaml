base_translation:
  language: en
  yaml_path: translation/ot/amos/007/015.yaml
  text: But Yahweh took me from following the flock[a], and Yahweh said to me, “Go[b], prophesy to my people Israel.”
translation:
  language: zh_hans
  text: 雅威却把我从牧放羊群的工作中带出来[a]，又对我说：“去，向我的子民以色列说预言[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“从羊群后面”；这是指跟随、牧放羊群的生活或工作。
    reason: lexical_alternative
  - marker: b
    text: 原文是“向我的子民以色列”；上下文中的预言包含审判，但本节没有明确说“攻击”或“反对”。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקָּחֵנִי
  choice: 把我……带走
  rationale: לקח的基本义是“取、带走”。这里指雅威使阿摩司离开原先牧放羊群的生活，进入先知职分；“带走”自然直接，又不额外强调强制意味。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以“雅威”音译四字神名，保留其作为以色列之上帝专名的性质，而不以称号替代。
- source_word: מֵאַחֲרֵי הַצֹּאן
  choice: 从羊群后面
  rationale: 较直接地保留希伯来语“从羊群后面”的牧放意象；中文虽略带源语色彩，但清楚可懂，也避免将其完全解释为职业性的“牧羊”。
- source_word: הַצֹּאן
  choice: 羊群
  rationale: צֹאן统指成群的小型牲畜，可能包括绵羊和山羊；“羊群”在现代汉语中自然，并保留集合意义。
- source_word: וַיֹּאמֶר אֵלַי
  choice: 对我说
  rationale: 直接对应אמר与介词אֶל的结构，是自然庄重的现代汉语表达。
- source_word: לֵךְ
  choice: 去
  rationale: 简明保留命令式的差遣语气。
- source_word: הִנָּבֵא
  choice: 说预言
  rationale: נבא的Nifal命令式指以先知身份传达信息。“说预言”通俗易懂，并保留先知宣告的含义。
- source_word: אֶל עַמִּי יִשְׂרָאֵל
  choice: 向我的子民以色列
  rationale: אֶל通常表示方向“向、对”。此译保留神对以色列“我的子民”的认领，也不把上下文中的审判意味擅自写成“攻击”。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。音译“雅威”可保留专名性质；“主”是称号替换，“耶和华”则是另一种传统音译。
- issue: 先知使命对以色列的方向或敌对意味
  choice: 向我的子民以色列说预言
  alternative: 攻击我的子民以色列说预言
  rationale: 原文使用אֶל，最自然表示“向、对”。即使上下文的信息包含审判，本节本身也没有明确使用“攻击”的介词，因此不将敌对意味加入正文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“从羊群后面”有意保留希伯来语牧者跟在羊群后面的具体意象；用脚注说明其实际所指。“我的子民以色列”保留原文的圣约性认领与语序重心。
