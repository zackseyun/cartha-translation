  text: וְ/נָשַׁ֨מּוּ֙ בָּמ֣וֹת יִשְׂחָ֔ק וּ/מִקְדְּשֵׁ֥י יִשְׂרָאֵ֖ל יֶחֱרָ֑בוּ וְ/קַמְתִּ֛י עַל בֵּ֥ית יָרָבְעָ֖ם בֶּ/חָֽרֶב־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/amos/007/009.yaml
  text: The high places of Isaac will be made desolate[a], and the sanctuaries of Israel will be laid waste[c][b]; and I will rise against the house of Jeroboam with the sword.
translation:
  language: zh_hans
  text: 以撒的丘坛必荒凉[a]，以色列的圣所必成为废墟；我必起来，用刀攻击耶罗波安的家。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“必变得荒凉。”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָשַׁמּוּ
  choice: 必荒废
  rationale: שׁמם 的尼法勒形在此表示陷入荒凉、遭到毁坏的结果；“必荒废”简洁自然，也保留其结果性，至于是自成荒凉还是被毁而荒凉，则不强行限定。
- source_word: בָּמוֹת
  choice: 丘坛
  rationale: בָּמוֹת 指设在高处或被称为“高处”的祭祀场所；“丘坛”是现代中文圣经语境中准确而简练的礼仪用语。
- source_word: יִשְׂחָק
  choice: 以撒
  rationale: 按原文保留专名“以撒”，不以“以色列”替换，从而保存这里诗性的祖先称谓及其盟约联想。
- source_word: וּמִקְדְּשֵׁי
  choice: 圣所
  rationale: מִקְדָּשׁ 指分别为圣、用于敬拜的场所；“圣所”比泛称“圣地”更准确地表达宗教礼仪含义。
- source_word: יֶחֱרָבוּ
  choice: 必成为废墟
  rationale: חרב 在此表示被毁坏、荒凉；“成为废墟”传达严重毁灭的结果，并与前句“荒废”形成自然变化。
- source_word: וְקַמְתִּי עַל
  choice: 我必……攻击
  rationale: קום 与 עַל 连用，在此具有敌对、审判性的行动意味；结合后面的“刀”，译作“攻击”比字面“起来反对”更符合现代汉语，同时保留神亲自施行审判的力度。
- source_word: בֵּית יָרָבְעָם
  choice: 耶罗波安家
  rationale: בֵּית 可指家室、家族或王朝；“耶罗波安家”保留原文家族性表达，也容纳王朝含义而不过度解释。
- source_word: בֶּחָרֶב
  choice: 拔刀
  rationale: 原文直译为“用刀”；在“攻击”语境中，“拔刀攻击”是自然、庄重的现代汉语，明确表达以刀兵施行审判，但不具体限定执行方式。
theological_decisions:
- issue: “以撒”的所指
  choice: 正文保留“以撒”，视为对北方盟约之民的诗性称呼。
  alternative: 为求直白而译作“以色列”。
  rationale: 希伯来文本有意使用“以撒”；替换为“以色列”会抹平文学与盟约色彩，并把解释写入正文。
- issue: “我必起来攻击”的神圣行动
  choice: 译为“我必拔刀攻击”，表达上帝亲自采取敌对的审判行动。
  alternative: 弱化为“我必采取行动反对”。
  rationale: קום על 加上“刀”构成鲜明的司法—军事意象；译文不应削弱其直接性和严厉性。
- issue: “耶罗波安家”的范围
  choice: 保留“家”，使其可涵盖家室、后裔及王朝。
  alternative: 明确译为“耶罗波安王朝”。
  rationale: “王朝”虽可能符合历史语境，却缩窄了 בֵּית 的语义范围；保留“家”更能保存原文张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“丘坛”“圣所”保留必要的宗教文化术语；句式简洁，维持先知审判宣告的力度。正文保留“以撒”和“耶罗波安家”的原文表达，不用解释性替换。
