base_translation:
  language: en
  yaml_path: translation/ot/amos/007/014.yaml
  text: Then Amos answered and said to Amaziah[a], “I am not a prophet, nor am I a son of a prophet; rather[b], I am a herdsman and a dresser of sycamore figs.”
translation:
  language: zh_hans
  text: 阿摩司回答亚玛谢说：“我不是先知，也不是先知之子[a]；我是牧牛人，也照料[b]桑叶无花果。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “先知之子”也可能指先知团体中的成员，不一定指先知的亲生儿子。
    reason: lexical_alternative
  - marker: b
    text: “照料”也可译作“修整”或“划刺果实”。这里所指的具体作业方式尚不确定，可能是为使桑叶无花果成熟而栽培或处理其果实。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: 回答……说
  rationale: 保留希伯来叙事中“回答—说”的双重表达，同时符合现代汉语引出直接引语的习惯。
- source_word: לֹא נָבִיא אָנֹכִי
  choice: 我不是先知
  rationale: 直接保留无动词判断句及 אָנֹכִי 所体现的第一人称强调，不把它解释为“我原本不是”或“我不是职业先知”。
- source_word: וְלֹא בֶן נָבִיא אָנֹכִי
  choice: 也不是先知之子
  rationale: 保留“先知之子”这一希伯来习语及其可能兼有的字面与团体身份含义，不在正文中将其限定为血缘关系或先知团体成员。
- source_word: כִּי
  choice: 而是
  rationale: 此处引出与前两项否定相对的自我描述；“而是”自然表达其转折、说明作用。
- source_word: בוֹקֵר
  choice: 牧牛人
  rationale: 该词指照管牛群的人；“牧牛人”比泛称“牧人”更准确，也避免误解为专指牧羊人。
- source_word: וּבוֹלֵס שִׁקְמִים
  choice: 又是照料桑叶无花果树的
  rationale: בולס 的具体作业方式不完全确定，可能包括划刺或修整果实；正文采用较宽泛的“照料”，既表达农业职业，又不武断限定技术细节。שִׁקְמִים 指桑叶无花果树，并非现代通常所说的悬铃木。
theological_decisions:
- issue: 阿摩司是否绝对否认自己是先知
  choice: 正文直译为“我不是先知”，保留陈述与他实际奉上帝之命说预言之间的张力。
  alternative: 解释为“我不是职业先知”或“我原本不是先知”。
  rationale: 希伯来原文没有明说“职业”或过去时；上下文虽可支持这类理解，译文却不宜代替原文消解其含义张力。
- issue: “先知之子”是血缘称谓还是先知团体身份
  choice: 正文保留“先知之子”这一习语，并以脚注说明其可能含义。
  alternative: 正文直接译为“先知团体的一员”或“先知的门徒”。
  rationale: 直译可同时保留字面亲子关系与群体成员身份两种可能，不把不确定的社会制度解释写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“先知之子”有意保留原文习语；“桑叶无花果树”采用较准确的植物名称，以免与普通桑树或悬铃木混淆。
