source:
  edition: WLC
  text: וְ/הָיָ֗ה אִם כִּלָּה֙ לֶֽ/אֱכוֹל֙ אֶת עֵ֣שֶׂב הָ/אָ֔רֶץ וָ/אֹמַ֗ר אֲדֹנָ֤/י יְהוִה֙ סְֽלַֽח נָ֔א מִ֥י יָק֖וּם יַֽעֲקֹ֑ב כִּ֥י קָטֹ֖ן הֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/007/002.yaml
  text: And when it had finished eating the vegetation of the land[a], I said, “Lord GOD, please forgive! How can Jacob stand? For he is small.”
translation:
  language: zh_hans
  text: 它吃尽那地的草木时，我说：“主雅威啊，求你赦免！雅各怎能站立得住呢？[a]他实在弱小。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“谁会使雅各站起来呢？”
    reason: 原句 מִי יָקוּם יַעֲקֹב 通常按语境理解为雅各难以存立；此处保留可能被理解为“使雅各站起”的替代读法，但不加入原文未明说的“重新”含义。
lexical_decisions:
- source_word: וְהָיָה אִם
  choice: ……时
  rationale: 此处承接异象叙事，אִם 与 וְהָיָה 连用具有时间意味；译作“……时”比条件式“如果”更符合上下文，也使现代汉语自然流畅。
- source_word: כִּלָּה לֶאֱכוֹל
  choice: 吃尽
  rationale: כלה 加不定式表示动作完成；“吃尽”简洁地传达吞食完毕的意思。主语承接上一节的蝗虫群，汉语用复数代词“它们”补明。
- source_word: עֵשֶׂב הָאָרֶץ
  choice: 地上的草木
  rationale: עֵשֶׂב 可泛指青草、草本植物或植被；“草木”在此能自然表达土地上的植物，而不把范围限于草。הָאָרֶץ 按本段国家与土地的语境译为“地上”，不是指整个地球。
- source_word: אֲדֹנָי יְהוִה
  choice: 主雅威
  rationale: 保留 אֲדֹנָי 的称谓“主”，并以“雅威”呈现神的专名，避免两个“主”叠用。
- source_word: סְלַח נָא
  choice: 求你赦免
  rationale: נָא 表达恳求语气；“求你赦免”既自然庄重，也保留阿摩司迫切代求的意味。
- source_word: מִי יָקוּם יַעֲקֹב
  choice: 雅各怎能站立得住呢？
  rationale: 直译结构存在困难；按审判异象的语境，这个反问最自然地表示雅各无法承受或存留。“站立得住”保留 קום 的站立意象。可能的使役、复兴含义另在脚注保留。
- source_word: יַעֲקֹב
  choice: 雅各
  rationale: 保留原文所用的盟约群体名称，不直接解释为“以色列”；代词“他”承接这一拟人化的集体称呼。
- source_word: כִּי קָטֹן הוּא
  choice: 他实在弱小
  rationale: קָטֹן 表示微小、弱小或势单力薄。“弱小”在此自然涵盖雅各人数、力量和处境上的低微；“实在”体现 כִּי 所引出的理由与强调。
theological_decisions:
- issue: אֲדֹנָי יְהוִה 中神名的译法
  choice: 主雅威
  alternative: 主耶和华
  rationale: 原文明确使用四字神名；“雅威”直接呈现其专名性质，而“主”对应 אֲדֹנָי。
- issue: מִי יָקוּם יַעֲקֹב 的含义
  choice: 雅各怎能站立得住呢？
  alternative: 谁能使雅各重新站起来呢？
  rationale: 上下文首先支持雅各无法承受灾祸的反问，但 קום 也可能带出使之站起或恢复的理解。正文采用较符合语境的存立义，脚注保留复兴义，避免消除原文张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“草木”“站立得住”“弱小”保持经文意象，又避免生硬直译。脚注标记紧随其所说明的疑难短语之后。
