base_translation:
  language: en
  yaml_path: translation/ot/amos/007/013.yaml
  text: But at Bethel you must not prophesy any longer[a], for it is the king’s sanctuary[b], and it is a royal house.
translation:
  language: zh_hans
  text: 但在伯特利，你不可再说预言[a]，因为那里是王的圣所，也是王国的宫殿[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不要再说预言”，或“不再继续说预言”。希伯来文直译为“不要再增添去说预言”。
    reason: lexical_alternative
  - marker: b
    text: “王国的宫殿”直译为“王国的家”；或译：“王室的宫室”。这里可能是说，伯特利是王国政权所属的机构。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בֵית אֵל
  choice: 但在伯特利
  rationale: ו 承接上一节亚玛谢叫阿摩司往犹大去的命令，此处语意带转折；בֵית אֵל 是地名，按处所义译为“在伯特利”。
- source_word: לֹא תוֹסִיף עוֹד לְהִנָּבֵא
  choice: 你不可再说预言
  rationale: יסף 与 עוד 及不定式连用，表示不再继续或重复某行动；“不可再说预言”自然地保留禁令语气，也不排除“不要再说预言”或“不再继续说预言”的理解。
- source_word: כִּי
  choice: 因为
  rationale: 引出亚玛谢禁止阿摩司在伯特利说预言的理由。
- source_word: מִקְדַּשׁ מֶלֶךְ
  choice: 王的圣所
  rationale: מִקְדַּשׁ 指分别为圣的场所或圣所，与“王”构成属格关系；直译既呈现其宗教性质，也保留其受王权支配或与王相关的含义。
- source_word: וּ/בֵית מַמְלָכָה
  choice: 也是王国的殿宇
  rationale: בֵית מַמְלָכָה 直译为“王国之殿/王国之家”。“殿宇”在本语境中既可指具有公共、制度性质的建筑，也与前句“圣所”协调；脚注保留“王室的殿宇”等可能译法。
- source_word: הוּא ... הוּא
  choice: 那里是……也是……
  rationale: 两个 הוּא 构成重复而有强调作用的判断句；中文以“是……也是……”保留平行结构。“那里”明确所指为伯特利。
theological_decisions:
- issue: 亚玛谢对伯特利的政治—宗教定位
  choice: 译作“王的圣所”和“王国的殿宇”，作为亚玛谢话语中的描述
  alternative: 译作“王室圣所”和“国家的神殿”
  rationale: 经文是在转述亚玛谢为禁止阿摩司说预言而提出的理由，并不因此认可伯特利敬拜的正当性。较直译的措辞保留政治权力与宗教场所之间的张力，避免把解释性的“国家神殿”直接写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“说预言”比“预言”作为动词更自然；“王的圣所／王国的殿宇”保留希伯来文两个并列的政治—宗教称谓及其张力。
