source:
  edition: WLC
  text: כֹּ֤ה הִרְאַ֨/נִי֙ אֲדֹנָ֣/י יְהוִ֔ה וְ/הִנֵּה֙ יוֹצֵ֣ר גֹּבַ֔י בִּ/תְחִלַּ֖ת עֲל֣וֹת הַ/לָּ֑קֶשׁ וְ/הִ֨נֵּה לֶ֔קֶשׁ אַחַ֖ר גִּזֵּ֥י הַ/מֶּֽלֶךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/007/001.yaml
  text: 'This is what the Lord GOD showed me: behold[a], he was forming locusts at the beginning of the spring crop''s coming up, and behold[b], it was the spring crop after the king''s mowings.'
translation:
  language: zh_hans
  text: 主耶和华使我看见这样的景象：看哪，在晚茬[a]刚开始长出来的时候，他正在造蝗虫；看哪，王的割取[b]之后的晚茬。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “晚茬”也可译作“后长的庄稼”或“第二茬”。希伯来词指先前割取后较晚长出的草木或作物。
    reason: lexical_alternative
  - marker: b
    text: “王的割取”可能指先割取一批草或饲料，作为王室应得的份额；其后才有这晚茬生长。
    reason: cultural_note
lexical_decisions:
- source_word: כֹּה הִרְאַנִי
  choice: 让我看见这样的景象
  rationale: כֹּה引出异象报告，הִרְאַנִי是ראה的使役式。“让我看见这样的景象”既表达“使我看见”的使役含义，也符合现代汉语叙述习惯。
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: 保留复合神圣称号的两个成分：אֲדֹנָי译作“主”，四字神名יְהוִה按现代中文圣经通行形式译作“耶和华”。
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 原文两次使用该词，营造异象突然呈现于眼前的鲜明感；两处均译出，以保留重复和庄严语气。
- source_word: יוֹצֵר
  choice: 正在造
  rationale: 分词表示异象中正在进行的动作；“正在造”保留其进行性，也保留יצר所含的塑造、形成之意。
- source_word: גֹּבַי
  choice: 蝗虫
  rationale: 该词在农业灾害语境中指吞食作物的蝗虫；中文以集合意义的“蝗虫”自然表达。
- source_word: בִּתְחִלַּת עֲלוֹת
  choice: 刚开始长起来时
  rationale: 同时传达“开始”和“上长、萌发”的含义，以自然汉语标明蝗虫形成时作物正处于初生阶段。
- source_word: הַלָּקֶשׁ / לֶקֶשׁ
  choice: 晚茬 / 晚茬
  rationale: לקש指较晚、在先前割取后长出的第二轮草木或作物。“晚茬”简洁而具有农业含义；原词重复两次，译文也重复。
- source_word: גִּזֵּי הַמֶּלֶךְ
  choice: 王割草
  rationale: גִּזֵּי源于“剪、割”，在此指割取草料。正文采用自然简洁的表达，至于它是否指作为王室应纳份额的首次割取，则在脚注说明。
theological_decisions:
- issue: 复合称号אֲדֹנָי יְהוִה中神名的译法
  choice: 主耶和华
  alternative: 主雅威
  rationale: “耶和华”是现代中文普通读者最熟悉的四字神名形式；与“主”并列可保留原文两个称号，避免把专名化为一般称谓。
- issue: “正在造蝗虫”的主语
  choice: 他正在造蝗虫
  alternative: 蝗虫正在形成
  rationale: יוֹצֵר是阳性单数主动分词，语境上最自然地回指主耶和华，因此译出“他”；这保留异象中上帝主动形成审判工具的语法表达，而不把它改写成无施事者的自然过程。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“看哪”保留先知异象的现场感；“晚茬”是普通读者可理解的农业用语，并以脚注交代其具体含义和其他译法。句式保持原文两次“看哪”及两次“晚茬”的重复，不消除其修辞结构。
