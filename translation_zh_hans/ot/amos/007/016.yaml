  text: וְ/עַתָּ֖ה שְׁמַ֣ע דְּבַר יְהוָ֑ה אַתָּ֣ה אֹמֵ֗ר לֹ֤א תִנָּבֵא֙ עַל יִשְׂרָאֵ֔ל וְ/לֹ֥א תַטִּ֖יף עַל בֵּ֥ית יִשְׂחָֽק־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/007/016.yaml
  text: 'And now[a], hear the word of Yahweh: You say, ‘Do not prophesy against Israel, and do not preach against the house of Isaac.’'
translation:
  language: zh_hans
  text: 现在，你要听雅威的话：你说：“不可针对以色列说预言，也不可针对以撒家传讲[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “传讲”所译的希伯来语动词字面是“滴下”；这里用作发表先知性言论的习语。也可译作“宣讲”或“滴下言语”。
    reason: 说明 נטף 的字面意象及其在本节中的先知性习语用法。
lexical_decisions:
- source_word: וְעַתָּה
  choice: 所以现在
  rationale: 承接亚摩司此前的回应，并引出眼前直接的宣告；既保留连接成分，也符合现代汉语表达。
- source_word: שְׁמַע
  choice: 你要听
  rationale: 这是对亚玛谢所用的阳性单数祈使式；加上“你要”可在汉语中清楚传达直接命令。
- source_word: דְּבַר יְהוָה
  choice: 雅威的话
  rationale: 保留先知书中“话”所承载的启示分量，并将四字神名按其专名译为“雅威”。
- source_word: אַתָּה אֹמֵר
  choice: 你说
  rationale: 保留显明主语的代词所带的强调，并以简洁的现在时引出亚玛谢先前的禁令。
- source_word: לֹא תִנָּבֵא עַל יִשְׂרָאֵל
  choice: 不可说预言攻击以色列
  rationale: 否定词与未完成式在这里表达禁令；上下文中的 עַל 带有敌对、针对之意，“攻击”比单纯的“向”更能体现亚玛谢所禁止的是谴责性的预言。
- source_word: וְלֹא תַטִּיף
  choice: 也不可……倾吐预言
  rationale: נטף 的使役词干字面与“滴下、流出”有关，在此是发表先知性言论的习语。“倾吐预言”保留其形象，也避免与前一动词完全同译。
- source_word: בֵּית יִשְׂחָק
  choice: 以撒家
  rationale: 保留先知话语中指称以色列的宗族与盟约性表达，不将其解释性改写为“以色列国”或“以撒的后代”。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；“雅威”在现代汉语中较直接地音译这一专名，而不以称号取代。
- issue: עַל 所表达的预言与以色列的关系
  choice: 攻击以色列；向以撒家倾吐预言
  alternative: 向以色列／以撒家说预言；论到以色列／以撒家说预言
  rationale: 上下文显示亚玛谢禁止的是针对北国的谴责性预言。第一分句明译为“攻击”以呈现敌对意味；第二分句因汉语搭配采用“向”，而“倾吐预言”及平行结构仍保留其针对性。
- issue: נטף 的先知性习语
  choice: 倾吐预言
  alternative: 传讲；滴下言语；说预言
  rationale: 该词既有“滴下、流出”的具体意象，也在先知语境中指发表预言。正文兼顾意象和语境，脚注说明其字面意义，不把它化约为一般讲道活动。
translation_notes:
  register: 采用现代、庄重而直接的先知话语风格。“所以现在”承接上下文，“你要听”强化当面对质的语气。保留“以撒家”这一诗性称谓，并用脚注解释较难直译的 נטף。
