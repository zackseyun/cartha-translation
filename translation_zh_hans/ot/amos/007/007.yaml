base_translation:
  language: en
  yaml_path: translation/ot/amos/007/007.yaml
  text: 'This is what he showed me: behold[a], the Lord was standing by a wall made with a plumb line, with a plumb line in his hand.'
translation:
  language: zh_hans
  text: 他向我显示的是这样：看哪，主站在一道用准绳[a]筑成的墙上，手里拿着准绳。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “准绳”所译的希伯来词含义不确定；它可能指准绳或铅锤，也可能指铅、锡等制造这类工具的金属。这里“用准绳筑成的墙”是对原文困难短语的一种理解；原文较直译为“准绳之墙”。
    reason: 保留罕见词 אֲנָךְ 及构造短语 חוֹמַת אֲנָךְ 的词义和句法不确定性，并使脚注覆盖该词的两次出现。
lexical_decisions:
- source_word: כֹּה
  choice: 是这样
  rationale: 保留指示性的异象报告句式，并与“他让我看见的”组成自然的现代汉语。
- source_word: הִרְאַנִי
  choice: 他让我看见
  rationale: 该词是ראה的使役式；此译法保留“使我看见”的使役意味，也符合先知异象语境。
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 表达画面突然呈现及引人注目的功能，同时保持庄重语体。
- source_word: אֲדֹנָי
  choice: 主
  rationale: 按神圣称号翻译，不作音译；简体中文圣经语境中“主”自然而庄重。
- source_word: נִצָּב
  choice: 站在
  rationale: 分词描绘异象中正在呈现的姿态；汉语无需另加进行标记。
- source_word: עַל
  choice: 在……旁
  rationale: עַל可表示在、靠着或临近；此处译作墙旁，形成检验墙体的自然画面，但不把空间关系解释得过细。
- source_word: חוֹמַת אֲנָךְ
  choice: 一道按准绳筑成的墙
  rationale: 该组合含义困难；此译把אֲנָךְ理解为建筑或校验垂直度所用的准绳，并以自然汉语表达构造关系。
- source_word: אֲנָךְ
  choice: 准绳
  rationale: 上下文重复该词，并描写主手持此物，最适合理解为用于测定垂直的线具；“准绳”也能自然衔接下一节的检验意象。
- source_word: וּבְיָדוֹ
  choice: 手里拿着
  rationale: 将希伯来语的“在他手中”自然转换为汉语持物表达，不改变画面。
theological_decisions:
- issue: 神圣称号 אֲדֹנָי 的译法
  choice: 主
  alternative: 主宰
  rationale: 原文使用称号而非四字神名；“主”直接、庄重，也不额外加入统治含义的解释。
- issue: אֲנָךְ 所代表的审判意象
  choice: 仅译作“准绳”，不在正文说明其象征意义
  alternative: 译成带有“审判标准”解释的表达
  rationale: 本节首先呈现异象物件；其神学功能由后文展开，正文不应提前消解意象的张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“看哪”保留先知异象的突现感；“按准绳筑成”较“准绳之墙”自然，但用脚注说明原文难点及其他可能。
