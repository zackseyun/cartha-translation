  text: כִּי כֹה֙ אָמַ֣ר עָמ֔וֹס בַּ/חֶ֖רֶב יָמ֣וּת יָרָבְעָ֑ם וְ/יִ֨שְׂרָאֵ֔ל גָּלֹ֥ה יִגְלֶ֖ה מֵ/עַ֥ל אַדְמָתֽ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/amos/007/011.yaml
  text: 'For this is what Amos has said: ‘Jeroboam will die by the sword[a], and Israel will surely go into exile from its land.’'
translation:
  language: zh_hans
  text: 因为阿摩司这样说：‘耶罗波安必死在刀下，以色列必定要离开自己的土地，流亡在外[a]。’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“必定被掳去”或“必定流亡”。希伯来文用同一词根的不定式绝对形和限定动词连用，以加强语气。
    reason: 说明גָּלֹה יִגְלֶה的可行译法及其强调结构。
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上一节亚玛谢对阿摩司的指控，引出他提出指控的依据。
- source_word: כֹה אָמַר עָמוֹס
  choice: 阿摩司这样说
  rationale: 自然表达报告先前言论的语境，同时保留“这样说”这一公式的结构。
- source_word: בַּחֶרֶב יָמוּת
  choice: 必死在刀下
  rationale: “死在刀下”是现代汉语中自然、庄重的表达，保留刀剑作为致死方式的含义；“必”表达未完成式在预言语境中的确定性。
- source_word: יָרָבְעָם
  choice: 耶罗波安
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: וְיִשְׂרָאֵל
  choice: 以色列
  rationale: 保留原文的集体性国名，不在正文中进一步限定为北国或其人民。
- source_word: גָּלֹה יִגְלֶה
  choice: 必被掳
  rationale: 不定式绝对形与限定动词连用以加强语气；“必”传达强调，“被掳”准确表达此处被迫流亡的语境。
- source_word: מֵעַל אַדְמָתוֹ
  choice: 离开自己的土地
  rationale: מֵעַל含有从原有位置离开的意思，אַדָמָה在国家被掳语境中指土地；“自己的”对应指向集体性以色列的第三人称阳性单数后缀。
theological_decisions:
- issue: “以色列”及“自己的土地”的所指
  choice: 将以色列作为单数集体实体，译作“以色列……自己的土地”
  alternative: 译作“以色列人……他们的土地”
  rationale: 原文以单数形式把以色列视为一个整体；正文保留这种国家与群体的集体性，不把它改写为个体复数。
- issue: גָּלֹה יִגְלֶה的语态与流亡性质
  choice: 译作“必被掳”
  alternative: 译作“必定流亡”或“必被迁徙”
  rationale: 该结构本身强调动作确定发生，而上下文指被迫离开国土；“被掳”既保留强制性，也不额外说明具体执行者。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“死在刀下”和“被掳”保留先知性宣告的力度；脚注标记置于其所解释的“被掳离开自己的土地”之后。
