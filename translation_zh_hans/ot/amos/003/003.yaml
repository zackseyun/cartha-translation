  yaml_path: translation/ot/amos/003/003.yaml
  text: Do two walk together unless they have agreed to meet?[a]
translation:
  language: zh_hans
  text: 两个人若没有约好，岂能同行？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“若没有相约”，或“若没有约定会面”。希伯来语动词含有事先约定、相约会合的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲ/יֵלְכוּ
  choice: 岂能……同行
  rationale: 疑问词 הֲ 与未完成式构成修辞问句，表达一般性的常理；“岂能”自然传达预期否定回答，而“同行”简洁保留“走在一起”的含义。
- source_word: שְׁנַיִם
  choice: 两个人
  rationale: 该基数词意为“两个”；汉语为使所指清楚，按语境补出量词和泛指人的名词“个人”。
- source_word: יַחְדָּו
  choice: 同行
  rationale: יַחְדָּו 意为“一起、共同”；与 הלך 合译为“同行”，是自然、凝练的现代汉语表达。
- source_word: בִּלְתִּי אִם
  choice: 若没有
  rationale: 这一组合表示排除性条件，相当于“除非”；置于汉语修辞问句中译作“若没有”，句式更自然。
- source_word: נוֹעָדוּ
  choice: 约好
  rationale: יעד 的尼法勒式在此含有事先约定、相约会合的意思。“约好”既保留相互约定的语义，又避免把未明说的具体安排表达得过满。
theological_decisions: []
translation_notes:
  register: 采用现代、凝练而庄重的箴言式修辞问句。“岂能同行”符合普通话习惯，并保留原文的一般性与反问力度；脚注说明 נוֹעָדוּ 可兼指相约或约定会面，避免在正文中过度限定。
