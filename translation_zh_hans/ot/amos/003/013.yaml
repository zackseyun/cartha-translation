  text: שִׁמְע֥וּ וְ/הָעִ֖ידוּ בְּ/בֵ֣ית יַֽעֲקֹ֑ב נְאֻם אֲדֹנָ֥/י יְהוִ֖ה אֱלֹהֵ֥י הַ/צְּבָאֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/003/013.yaml
  text: Hear and testify against the house of Jacob[a], declares the Lord GOD[b], the God of hosts.
translation:
  language: zh_hans
  text: 你们要听，要指证雅各家；主雅威、万军之神宣告说。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שִׁמְעוּ
  choice: 你们要听
  rationale: 这是复数命令式；“要听”保留先知召唤的庄重语气，也明确呼告对象不止一人。
- source_word: וְהָעִידוּ בְּבֵית יַעֲקֹב
  choice: 并要向雅各家作证
  rationale: העיד 的使役词干在此有正式作证、提出证言的司法色彩；介词 ב 可按语境理解为“向、在……中”或“针对”。正文采用较不预先判定敌对方向的“向……作证”，脚注保留“作证指控”的可能。
- source_word: בֵּית יַעֲקֹב
  choice: 雅各家
  rationale: 直译这一指称以色列群体的盟约性名称，简洁并保留经文互文。
- source_word: נְאֻם
  choice: 这是……的宣告
  rationale: 以自然而庄重的现代汉语表达标准先知公式，突出话语的神圣权威。
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: 分别表达 אֲדֹנָי 的“主”和四字神名 יהוה 的传统中文形式“耶和华”，避免把复合称号压缩为单一称谓。
- source_word: אֱלֹהֵי הַצְּבָאוֹת
  choice: 万军之上帝
  rationale: “万军”保留 צבאות 可涵盖众军、天军等群体的宽度；“上帝”表达 אֱלֹהִים，并使整个神圣称号庄重清楚。
theological_decisions:
- issue: וְהָעִידוּ בְּבֵית יַעֲקֹב 中证言的指向
  choice: 向雅各家作证
  alternative: 作证指控雅各家
  rationale: 上下文具有审判和法庭色彩，故“指控”很有可能；但介词 ב 本身并不强制敌对含义。正文保留较宽的表达，以脚注呈现司法性、敌对性的解释。
- issue: 复合神名 אֲדֹנָי יְהוִה 的译法
  choice: 主耶和华
  alternative: 主上帝
  rationale: “主耶和华”在中文中同时呈现主权称号与专名，较直接对应希伯来文的复合结构；脚注说明原文构成，避免读者误以为这是单一词项。
- issue: אֱלֹהֵי הַצְּבָאוֹת 中“万军”的范围
  choice: 不限定为地上军队或天上军队
  alternative: 天军之上帝
  rationale: צבאות 的所指具有广度，正文不作原文未明说的限定，以保留神掌管一切众军的称号张力。
translation_notes:
  register: 采用现代、庄重、可朗读的标准普通话。以引号标示神谕内容，并用破折号组织较长的神圣称号。正文保留司法语境中的真实歧义，脚注说明可能更强的“指控”读法。所有脚注标记均已置于正文。
