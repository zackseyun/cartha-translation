  rationale: 修订将“认识”在此处的关系性语义以自然的中文“承认”表达，同时借脚注保留原文字面和可能的拣选含义，未将其限定为单一神学术语。“地上的一切宗族”更紧密对应原文“从地上一切家族/宗族中”。保留“因此”“惩罚”“一切的罪孽”，维持原文审判因果和司法力度。
