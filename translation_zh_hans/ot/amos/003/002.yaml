  text: רַ֚ק אֶתְ/כֶ֣ם יָדַ֔עְתִּי מִ/כֹּ֖ל מִשְׁפְּח֣וֹת הָ/אֲדָמָ֑ה עַל כֵּן֙ אֶפְקֹ֣ד עֲלֵי/כֶ֔ם אֵ֖ת כָּל עֲוֺנֹֽתֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/003/002.yaml
  text: You only have I known from among all the families of the earth[b][a]; therefore I will punish you for all your iniquities.
translation:
  language: zh_hans
  text: “地上的一切宗族中，我只承认你们[a]；因此，我必因你们一切的罪孽惩罚你们[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文作“认识”。这里可指特别的承认或拣选，带有盟约关系的意味。
    reason: lexical_alternative
  - marker: b
    text: 直译作“我必向你们追究你们一切的罪孽”，即要你们为这些罪孽承担责任。
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: 只
  rationale: 位于句首，突出以色列在万族中的独特地位；“只”简洁自然地表达排他性。
- source_word: יָדַעְתִּי
  choice: 认识
  rationale: 保留希伯来语“知道、认识”的基本意象及其关系性含义，不在正文中直接窄化为“拣选”；上下文可使其盟约性的特殊承认显明。
- source_word: מִכֹּל מִשְׁפְּחוֹת הָאֲדָמָה
  choice: 在地上万族之中
  rationale: מִשְׁפְּחוֹת在此泛指人类各族群；הָאֲדָמָה指全地。“在……之中”符合中文表达，也准确传达比较范围。
- source_word: עַל־כֵּן
  choice: 因此
  rationale: 清楚保留独特关系与随之而来的审判之间的因果联系。
- source_word: אֶפְקֹד עֲלֵיכֶם
  choice: 惩罚你们
  rationale: פקד语义较广，但与“罪孽”同现于审判语境时，表示追究并施罚；“惩罚”是现代中文中清楚自然的表达。
- source_word: עֲוֺנֹתֵיכֶם
  choice: 你们一切的罪孽
  rationale: “罪孽”兼具道德过犯和罪责的分量，比一般的“罪”更贴近עָוֹן；保留כָּל的全称意味。
theological_decisions:
- issue: יָדַע（认识）的盟约含义
  choice: 正文保留“认识”，由脚注说明其可含“拣选、承认”的关系性和盟约性意味。
  alternative: 正文直接译为“拣选”或“承认”。
  rationale: 原文所用动词是“认识”。保留这一措辞可维持词义透明度和神学张力：上帝对以色列的独特拣选与盟约关系由语境暗示，却不被译文过早限定为单一术语。
- issue: פקד的司法含义
  choice: 正文译作“惩罚你们”。
  alternative: 译作“追讨你们”或“向你们追究”。
  rationale: 这里的对象是以色列的一切罪孽，语境明确指向审判。“惩罚”能让普通现代读者直接理解其司法后果；脚注补充较贴近字面的“追究”。
- issue: 盟约特权与审判责任之间的关系
  choice: 用“因此”明确保留原文因果关系。
  alternative: 弱化为一般承接词“所以”或不译连接词。
  rationale: 本节的张力正在于：独特的关系并不免除审判，反而构成追究罪孽的理由。译文不应削弱这一逻辑。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“万族”凝练地表达全地各族；“罪孽”保留道德和司法分量。两个脚注标记均置于其所说明的正文词句之后。
