  text: הַשְׁמִ֨יעוּ֙ עַל אַרְמְנ֣וֹת בְּ/אַשְׁדּ֔וֹד וְ/עַֽל אַרְמְנ֖וֹת בְּ/אֶ֣רֶץ מִצְרָ֑יִם וְ/אִמְר֗וּ הֵאָֽסְפוּ֙ עַל הָרֵ֣י שֹׁמְר֔וֹן וּ/רְא֞וּ מְהוּמֹ֤ת רַבּוֹת֙ בְּ/תוֹכָ֔/הּ וַ/עֲשׁוּקִ֖ים בְּ/קִרְבָּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/003/009.yaml
  text: Proclaim to the citadels of Ashdod and to the citadels in the land of Egypt[a], and say, “Assemble on the mountains of Samaria, and see the many tumults within her[d][c][b], and the oppressed in her midst.”
translation:
  language: zh_hans
  text: 你们要向亚实突的宫堡[a]宣告，也要向埃及地的宫堡宣告，说：“你们要聚集在撒玛利亚的群山[b]上，观看城中种种骚乱[c]，以及其中受欺压的人[d]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “宫堡”或译“宫殿”；希伯来语所用的词可指宏伟而设防的权贵居所。
    reason: lexical_alternative
  - marker: b
    text: “群山”或译“山丘”。
    reason: lexical_alternative
  - marker: c
    text: “种种骚乱”或译“极大的动荡”或“许多混乱”。
    reason: lexical_alternative
  - marker: d
    text: “受欺压的人”或译“欺压之事”；希伯来语可有较抽象的理解，但按词形和上下文，译作受欺压者更为自然。
    reason: alternative_reading
lexical_decisions:
- source_word: הַשְׁמִיעוּ
  choice: 宣告
  rationale: 该词为שׁמע的使役式命令语气，在这里指公开传达、使人听见；“宣告”自然保留命令和公开传召的意味。
- source_word: אַרְמְנוֹת
  choice: 宫堡
  rationale: 该名词可指宏伟的宫殿，也可指设防的权贵居所；“宫堡”兼顾华贵与防御性，适合此处把外邦权贵据点召作见证者的语境。
- source_word: בְּאַשְׁדּוֹד
  choice: 在亚实突的宫堡中
  rationale: 介词בְּ具有地点意义；中文如此表达既明确宣告发生的地点，也保持修饰关系自然。
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: 在埃及地的宫堡中
  rationale: 保留原文“埃及地”的完整说法及其先知性庄重节奏。
- source_word: הֵאָסְפוּ
  choice: 聚集
  rationale: אסף的尼法勒命令式在此是召集旁观者前来观看；“聚集”简洁自然。
- source_word: הָרֵי שֹׁמְרוֹן
  choice: 撒玛利亚的群山
  rationale: הַר可指山或丘陵；“群山”直接反映复数，也保留从高处观看撒玛利亚的空间意象。
- source_word: מְהוּמוֹת רַבּוֹת
  choice: 种种骚乱
  rationale: 该短语表示混乱、喧扰或社会动荡；“种种骚乱”保留复数意味，又不把混乱的具体形式解释得过细。
- source_word: בְּתוֹכָהּ
  choice: 城中
  rationale: 阴性单数后缀回指撒玛利亚城；中文以“城中”明确所指，避免生硬照搬阴性城市拟人。
- source_word: עֲשׁוּקִים
  choice: 受欺压的人
  rationale: 该形式最自然地理解为被动分词的名词化用法，指遭受欺压者；补出“人”使现代中文清楚自然。
- source_word: בְּקִרְבָּהּ
  choice: 其中
  rationale: 该词表示在她内部或当中，仍回指撒玛利亚；“其中”与前面的“城中”形成自然变化，同时保留空间意义。
theological_decisions:
- issue: 撒玛利亚城中所见之事的指向
  choice: 译为社会骚乱和受欺压的人，凸显城中可见的受害者。
  alternative: 将עֲשׁוּקִים理解为抽象的“欺压之事”或“压迫行为”。
  rationale: עֲשׁוּקִים按形态最自然可作名词化的被动分词，指受欺压者。这是词法和句法判断，并非增加教义内容，也符合阿摩司书揭露社会不义的上下文；脚注保留抽象读法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“宫堡”用于兼顾宫殿与堡垒两层语义；“种种骚乱”保持原文复数和开放性；以“城中／其中”自然表达指向撒玛利亚的两个阴性地点短语。所有脚注标记均置于相应正文词语之后。
