source:
  edition: WLC
  text: כִּ֣י לֹ֧א יַעֲשֶׂ֛ה אֲדֹנָ֥/י יְהוִ֖ה דָּבָ֑ר כִּ֚י אִם גָּלָ֣ה סוֹד֔/וֹ אֶל עֲבָדָ֖י/ו הַ/נְּבִיאִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/003/007.yaml
  text: For the Lord GOD does nothing unless he reveals his secret to his servants the prophets[a].
translation:
  language: zh_hans
  text: 因为主耶和华若不把自己的秘密[a]启示给他的仆人——众先知，就绝不行事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “秘密”也可译作“密议”或“隐秘的计划”。希伯来语原词可指隐秘之事、机密商议，或在亲密圈子中分享的密谈与谋议。
    reason: 保留סוֹד的词义范围，避免正文将其限定为单纯的商议或完整、确定的计划。
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 本词在此承接上文并说明理由；“因为”自然保留其解释性、因果性的篇章功能。
- source_word: לֹא ... כִּי אִם
  choice: 若不……就绝不会
  rationale: 这一否定加例外结构表示：除非先有后述的启示，否则耶和华不采取行动；此译法既符合现代汉语，也保留原文的强烈否定。
- source_word: יַעֲשֶׂה ... דָּבָר
  choice: 行事
  rationale: עָשָׂה与דָּבָר合用，泛指“做一件事、采取行动”；“行事”简洁自然，又不把所指限缩为某一种作为。
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: 分别体现אֲדֹנָי的“主”和四字神名יהוה；“主耶和华”是现代中文圣经语境中清楚、庄重且可辨识的复合称号。
- source_word: גָּלָה
  choice: 启示
  rationale: 本义为“揭开、显露”。在上帝向先知传达隐秘内容的语境中，“启示”自然准确，同时保留主动披露之意。
- source_word: סוֹדוֹ
  choice: 自己的密议
  rationale: סוֹד可指秘密、机密商议或隐秘谋划。“密议”兼顾隐秘性与商议、谋划的语义色彩；以脚注保留其他合理理解。
- source_word: עֲבָדָיו הַנְּבִיאִים
  choice: 他的仆人，就是众先知
  rationale: 将“众先知”理解为“他的仆人”的同位说明，清楚呈现定冠词复数名词与所属短语的关系，并避免生硬的“仆人众先知”。
theological_decisions:
- issue: 复合神名אֲדֹנָי יְהוִה的译法
  choice: 主耶和华
  alternative: 主雅威；主上帝
  rationale: 译文同时保留“主”的称号和יהוה这一专名，不把两者合并为单一称谓；采用中文读者熟悉的“耶和华”，不借此经文处理神名读音的争议。
- issue: סוֹד所指的范围
  choice: 密议
  alternative: 秘密；隐秘的计划
  rationale: 原词既可表示隐秘之事，也可表示机密商议或谋划。译作“密议”保留其关系性和谋议色彩，但不将其系统化为某种特定的神学教义；脚注说明其真实歧义。
- issue: 上帝行动与先知启示的关系
  choice: 若不……就绝不会
  alternative: 无论做什么，总先启示
  rationale: 原文采用否定—例外结构，表达上帝行动与向先知披露之间的紧密关系。译文不额外加入“所有未来细节”“完整预告”等限定，以免超出本句所说。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“绝不会行事”保留原文概括性命题的力度；“他的仆人，就是众先知”用同位结构清楚表达先知作为上帝仆人的身份。
