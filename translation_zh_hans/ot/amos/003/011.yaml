source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה צַ֖ר וּ/סְבִ֣יב הָ/אָ֑רֶץ וְ/הוֹרִ֤ד מִמֵּ/ךְ֙ עֻזֵּ֔/ךְ וְ/נָבֹ֖זּוּ אַרְמְנוֹתָֽיִ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/003/011.yaml
  text: 'Therefore[a], thus says the Lord GOD: An adversary shall surround the land, and he shall bring down your strength from you[b], and your citadels shall be plundered.'
translation:
  language: zh_hans
  text: '因此，主耶和华如此说：


    “有敌人[a]要四面包围这地；


    他要使你的力量衰落，


    你的堡垒[b]必遭抢掠。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “敌人”也可译作“敌对者”或“仇敌”。
    reason: lexical_alternative
  - marker: b
    text: “堡垒”也可译作“宫殿”；原词可指宫殿或设防的坚固建筑。
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: 因此
  rationale: 承接上文所列的罪恶及其后果，简洁表达因果关系。
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: “主”表达 אֲדֹנָי 的尊称，“耶和华”沿用现代中文圣经读者熟悉的专名形式来对应四字神名 יְהוִה，并保留双重称谓。
- source_word: צַר
  choice: 敌人
  rationale: 此处指实施围困和劫掠的敌对势力；“敌人”自然易懂，也不预先断定具体是哪一个国家或军队。
- source_word: וּסְבִיב הָאָרֶץ
  choice: 要四面包围这地
  rationale: 原文是简练的省略式表达，字面近于“并在这地周围”；结合“敌人”补出动作“包围”，准确传达军事围困的语境。“这地”指当前受审判的地域，而非全世界。
- source_word: וְהוֹרִד מִמֵּךְ עֻזֵּךְ
  choice: 他要夺去你的力量
  rationale: הוֹרִיד 是“使下降、使衰落”，与 מִמֵּךְ（从你那里）连用，表示敌人使受话者失去力量；“夺去”在中文中自然传达权势被削落和移除。
- source_word: וְנָבֹזּוּ
  choice: 必遭抢掠
  rationale: 被动形态表示这些建筑将被入侵者劫掠；“遭抢掠”符合战争和审判的语境。
- source_word: אַרְמְנוֹתָיִךְ
  choice: 你的堡垒
  rationale: 该词可指宫殿，也可指设防的高大建筑或堡垒；围困语境中“堡垒”较贴切，同时以脚注保留“宫殿”的可能。
theological_decisions:
- issue: 复合神圣称号 אֲדֹנָי יְהוִה 的译法
  choice: 主耶和华
  alternative: 主雅威
  rationale: 保留 אֲדֹנָי 的“主”以及 יְהוִה 作为神的专名，避免把两个词合并成单一称号；“耶和华”是普通现代中文读者较熟悉且庄重的传统形式。
- issue: 是否明确敌人的具体身份
  choice: 保留为未指明的“敌人”
  alternative: 明确译成某一入侵帝国或军队
  rationale: 本节原文本身没有点明敌人的国籍；不根据后来的历史背景将其具体化，以保留预言在此处的开放性。
translation_notes:
  register: 采用庄重而清楚的现代标准书面语；以诗行呈现宣告的节奏。用“有敌人要四面包围”自然补足希伯来文的省略结构，同时不增加敌人的具体身份。
