  text: וְ/לֹֽא יָדְע֥וּ עֲשׂוֹת נְכֹחָ֖ה נְאֻם יְהוָ֑ה הָ/אֽוֹצְרִ֛ים חָמָ֥ס וָ/שֹׁ֖ד בְּ/אַרְמְנֽוֹתֵי/הֶֽם־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/amos/003/010.yaml
  text: They do not know how to do what is right—oracle of Yahweh—those who store up violence and destruction in their citadels[a][b].
translation:
  language: zh_hans
  text: “他们不懂得行正直的事，”雅威宣告，“他们把暴力和毁灭[a]积存在自己的宫殿[b]中。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “毁灭”或译“劫掠”。
    reason: lexical_alternative
  - marker: b
    text: “宫殿”或译“城堡”或“堡垒”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יָדְעוּ
  choice: 不懂得
  rationale: ידע与不定式“行”连用，表示他们不懂得如何实行正直，既保留认知层面的措辞，也传达道德败坏所造成的实践无知。
- source_word: עֲשׂוֹת נְכֹחָה
  choice: 行正直的事
  rationale: נְכֹחָה指正直、端正的行为；此译自然而庄重，并保留原文对实际行事的强调。
- source_word: נְאֻם יְהוָה
  choice: 雅威宣告
  rationale: נְאֻם是先知话语中的神圣宣告公式；“宣告”符合现代汉语表达，雅威则直接呈现神名。
- source_word: הָאֹצְרִים
  choice: 这些人把……积存在
  rationale: אצר意为储存、积聚；分词用于刻画这群人的持续性行为。
- source_word: חָמָס
  choice: 暴力
  rationale: חָמָס常指暴力、压迫性的恶行；“暴力”直接保留先知谴责的力度。
- source_word: שֹׁד
  choice: 劫掠
  rationale: שֹׁד可指劫掠或毁灭；在“积存”这一意象下，“劫掠”可自然理解为靠暴力掠得之物，同时以脚注保留“毁灭”的可能。
- source_word: בְּאַרְמְנוֹתֵיהֶם
  choice: 在自己的宫堡里
  rationale: אַרְמוֹן兼有宫殿与设防建筑之义；“宫堡”同时传达权贵居所及其防御性，不偏废其中一面。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较贴近学界通常采用的拟音，并避免以称号替代专名。
- issue: “不懂得行正直的事”是无知还是道德无能
  choice: 保留“懂得”与“行”的结合
  alternative: 不知道什么是正直
  rationale: 原文并非单说他们不知道正直的定义，而是说他们不懂得实行正直；译文不把这种道德败坏进一步解释为绝对无能。
- issue: שֹׁד 是劫掠还是毁灭
  choice: 正文作“劫掠”
  alternative: 毁灭
  rationale: 两个义项均有词汇依据；“积存劫掠”更能形成积聚不义之财的具体意象，但脚注保留结果性含义“毁灭”。
translation_notes:
  register: 采用现代、庄重而易懂的先知书语体。以引号和插入的“雅威宣告”理清原文句法，同时保留先知谴责的力度。所有脚注标记均置于正文。
