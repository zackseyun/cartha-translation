  yaml_path: translation/ot/amos/003/008.yaml
  text: A lion has roared—who will not fear? The Lord GOD has spoken—who will not prophesy?[a][b]
translation:
  language: zh_hans
  text: 狮子已经吼叫，谁能不惧怕？主耶和华已经说话，谁能不说预言？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “主耶和华”原文为“阿多奈·YHWH”；YHWH也常音译为“雅威”。
    reason: alternative_reading
lexical_decisions:
- source_word: אַרְיֵה
  choice: 狮子
  rationale: 普通名词，直接译为“狮子”；汉语无需添加不定冠词。
- source_word: שָׁאָג
  choice: 吼叫
  rationale: Qal完成式，表示狮子已经发出吼声；汉语用无时态标记的“吼叫”，可由上下文自然表达已然事件及其即时后果。
- source_word: מִי לֹא יִירָא
  choice: 谁能不惧怕？
  rationale: “谁……不……”是期待否定答案的反问；加入“能”自然表达这种反应的不可避免性，而“惧怕”保持庄重语体。
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: 复合称号由“主”和神名YHWH构成；“主耶和华”既保留两部分，也符合现代中文圣经语境中广为人知的表达。
- source_word: דִּבֶּר
  choice: 说话
  rationale: Piel完成式，意为“说了话／发言”；译作“说话”与前句“吼叫”形成紧密平行，并让汉语上下文承载完成意义。
- source_word: מִי לֹא יִנָּבֵא
  choice: 谁能不说预言？
  rationale: Nifal未完成式在此表示先知性发言；“谁能不……”保留反问的必然语气，“说预言”比单独“预言”更清楚地指受神言语驱使而宣告。
theological_decisions:
- issue: 复合称号 אֲדֹנָי יְהוִה 中神名的译法
  choice: 主耶和华
  alternative: 主雅威；主上帝
  rationale: 原文明确保留YHWH神名。正文采用中文读者熟悉的“耶和华”，同时保留前面的 אֲדֹנָי“主”；脚注列出较接近现代学界拟音的“雅威”，不把神名泛化为称谓。
- issue: “谁能不说预言”的主体与强制意味
  choice: 保留反问，不补明主体或机制
  alternative: 人怎能不传讲；谁都必须说预言
  rationale: 原文仅以“谁”提出反问，并通过狮吼与神言建立类比。译文不限定为阿摩司一人，也不把修辞上的不可避免性扩写成系统性的强制教义。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。两句保持原文对称结构：“狮子吼叫／主耶和华说话”与“谁能不惧怕／谁能不说预言”彼此呼应。唯一脚注标记已置于正文。
