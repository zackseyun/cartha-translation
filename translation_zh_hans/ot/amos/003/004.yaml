base_translation:
  language: en
  yaml_path: translation/ot/amos/003/004.yaml
  text: Does a lion roar in the forest when it has no prey? Does a young lion raise its voice from its den unless it has caught something?[a][b]
translation:
  language: zh_hans
  text: 狮子没有猎物，岂会在林中吼叫？少壮狮子若没有捕获什么，岂会从洞穴中发出吼声？[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “洞穴”或译“巢穴”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“若没有捕获”；所捕获的对象由上下文暗示。
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׁאַג
  choice: 吼叫
  rationale: 该动词指狮子发出的响亮叫声；“吼叫”是现代汉语中自然、准确的对应表达。
- source_word: אַרְיֵה
  choice: 狮子
  rationale: 直接对应普通的动物名称，并与下半句“少壮狮子”形成平行。
- source_word: בַּיַּעַר
  choice: 在林中
  rationale: יַעַר通常指森林或林地；“在林中”简洁自然，也保留原文场景。
- source_word: טֶרֶף
  choice: 猎物
  rationale: 此词可指被撕裂的食物或猎物；在狮子捕猎的语境中，“猎物”最贴切。
- source_word: אֵין לוֹ
  choice: 没有
  rationale: 该结构表达某物不为主体所有或不存在；汉语用“没有猎物”自然清楚。
- source_word: יִתֵּן קוֹלוֹ
  choice: 发出吼声
  rationale: 原文直译为“发出它的声音”，在狮子的语境中译作“发出吼声”既传达其惯用含义，也与上句呼应。
- source_word: כְּפִיר
  choice: 少壮狮子
  rationale: 该词指年轻而有力的狮子，并非幼小的狮崽；“少壮狮子”比“幼狮”更能体现这一点。
- source_word: מִמְּעֹנָתוֹ
  choice: 从洞穴中
  rationale: מְעוֹנָה指居所，在此特指狮子的栖身处；“洞穴”符合汉语习惯，脚注保留“巢穴”这一可能译法。
- source_word: בִּלְתִּי אִם
  choice: 若没有
  rationale: 这一组合引出例外条件，相当于“除非”；按汉语反问句式译作“若没有……岂会”，逻辑清晰自然。
- source_word: לָכָד
  choice: 捕获什么
  rationale: 该动词意为捕捉、抓获；原文未明说宾语，译文用不定代词“什么”使汉语完整，同时避免把隐含对象限定得过死。
theological_decisions: []
