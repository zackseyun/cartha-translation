id: AMO.3.1
reference: Amos 3:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: שִׁמְע֞וּ אֶת הַ/דָּבָ֣ר הַ/זֶּ֗ה אֲשֶׁ֨ר דִּבֶּ֧ר יְהוָ֛ה עֲלֵי/כֶ֖ם בְּנֵ֣י יִשְׂרָאֵ֑ל עַ֚ל כָּל הַ/מִּשְׁפָּחָ֔ה אֲשֶׁ֧ר הֶעֱלֵ֛יתִי מֵ/אֶ֥רֶץ מִצְרַ֖יִם לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/003/001.yaml
  text: 'Hear this word that Yahweh has spoken against you[a], sons of Israel, against the whole family that I brought up from the land of Egypt, saying:'
translation:
  language: zh_hans
  text: 你们以色列的子孙[b]啊，要听雅威针对你们[a]、针对我从埃及地领上来的整个家族所说的这话：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “针对你们”也可译作“论到你们”。这里的上下文带有审判意味。
    reason: 保留希伯来介词על在不利指向与一般论及之间的语义幅度。
  - marker: b
    text: “以色列的子孙”也可译作“以色列人”；希伯来文直译为“以色列的众子”，是带有家族和盟约意味的群体称呼。
    reason: 说明原文的阳性复数形式及其群体性、家族性用法，避免误解为只指男性。
lexical_decisions:
- source_word: שִׁמְעוּ
  choice: 你们要听
  rationale: 保留复数命令语气以及先知宣告中郑重呼召人聆听的意味。
- source_word: הַדָּבָר הַזֶּה
  choice: 这话
  rationale: דבר在先知语境中指来自上帝的言语或宣告；“这话”自然简洁，也保留原文的言语意象。
- source_word: דִּבֶּר יְהוָה
  choice: 雅威……所说
  rationale: 以现代汉语关系从句表达希伯来语完成式，并把四字神名音译为“雅威”，保留其专名性质。
- source_word: עֲלֵיכֶם
  choice: 针对你们
  rationale: על既可表示“论到”，在审判语境中又带有不利于听众的指向；“针对”保留其对抗性，另以脚注注明较中性的译法。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列的子孙
  rationale: “子孙”既保留以色列后裔这一家族性、盟约性称谓，又比逐字译作“众子”更符合现代汉语。
- source_word: עַל כָּל הַמִּשְׁפָּחָה
  choice: 针对……全家
  rationale: 重复“针对”以反映原文重复的על并维持审判语气；“全家”保留מִשְׁפָּחָה的亲族共同体意象。
- source_word: הֶעֱלֵיתִי מֵאֶרֶץ מִצְרַיִם
  choice: 我从埃及地领上来
  rationale: “领上来”保留עלה使役式在出埃及叙事中的方向性惯用语，也清楚表达上帝带领的行动。
- source_word: לֵאמֹר
  choice: 所说的话：
  rationale: 用冒号标明下节将接续宣告内容，同时以自然汉语承接原文的引语公式。
theological_decisions:
- issue: 四字神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文使用上帝的专名；“雅威”较直接地按通行学术重构音译，不以“主”这一称号替代。
- issue: עַל在审判宣告中的语气
  choice: 针对
  alternative: 论到
  rationale: 上下文是先知向以色列发出的审判宣告，因此采用带对抗色彩的“针对”；但介词本身也容许较中性的“论到”，故以脚注保留。
- issue: בְּנֵי יִשְׂרָאֵל的家族性称谓
  choice: 以色列的子孙
  alternative: 以色列人
  rationale: 选择“子孙”以保留原文把共同体描写为以色列后裔的家族与盟约意象，同时不把所指限于成年男性。
- issue: 雅威第三人称与“我”第一人称的转换
  choice: 保留“雅威……我……”的转换
  alternative: 将“我”明确改为“他”
  rationale: 原文先说“雅威所说”，随后使用第一人称“我领上来”，体现宣告公式向神谕话语的转换；不宜为求表面顺畅而消除这一语气变化。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“你们要听”保留先知呼召的力度；两次“针对”有意对应原文重复的介词并维持司法、审判色彩。句末冒号表示神谕内容在下一节继续。
