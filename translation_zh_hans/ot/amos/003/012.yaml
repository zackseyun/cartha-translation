  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כֹּה֮ אָמַ֣ר יְהוָה֒ כַּ/אֲשֶׁר֩ יַצִּ֨יל הָ/רֹעֶ֜ה מִ/פִּ֧י הָ/אֲרִ֛י שְׁתֵּ֥י כְרָעַ֖יִם א֣וֹ בְדַל אֹ֑זֶן כֵּ֣ן יִנָּצְל֞וּ בְּנֵ֣י יִשְׂרָאֵ֗ל הַ/יֹּֽשְׁבִים֙ בְּ/שֹׁ֣מְר֔וֹן בִּ/פְאַ֥ת מִטָּ֖ה וּ/בִ/דְמֶ֥שֶׁק עָֽרֶשׂ־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/003/012.yaml
  text: 'Thus says Yahweh: As the shepherd rescues from the mouth of the lion two legs or a piece of an ear[b][a], so will the sons of Israel who dwell in Samaria be rescued—with the corner of a bed and the cover of a couch.'
translation:
  language: zh_hans
  text: 耶和华如此说：“牧人怎样从狮子口中抢回两条腿或一小片耳朵，住在撒马利亚的以色列人也必照样被救出来——连同床的一角和大马士革的榻[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本句末尾的希伯来文含义很难确定。按马所拉文本的元音，直译近于“连同床的一角和大马士革的榻”。“大马士革”也有人理解为“锦缎”，因而译作“床的一角和榻上的锦缎”；也可能把这些介词短语理解为地点性表达，如“在床角和在大马士革的榻上”。
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神圣名字译法，而不以“主”这一称号代替专名。
- source_word: כַּאֲשֶׁר ... כֵּן
  choice: 怎样……也必照样
  rationale: 保留希伯来文清楚的比较结构，并使中文句势自然。
- source_word: יַצִּיל / יִנָּצְלוּ
  choice: 抢回／被救出来
  rationale: 两处均表达 נצל 的救出含义；前者按牧人从狮口夺回残骸的具体场景译为“抢回”，后者保留被动式。
- source_word: הָרֹעֶה
  choice: 牧人
  rationale: 中文泛指单数通常不需冠词，“牧人”简洁而庄重。
- source_word: מִפִּי הָאֲרִי
  choice: 从狮子口中
  rationale: 贴近原文意象，也符合现代中文表达。
- source_word: שְׁתֵּי כְרָעַיִם
  choice: 两条羊腿
  rationale: 原文为动物的两条小腿或腿部；补出“羊”可让牧人与狮子的场景清楚，又不改变残余肢体的意象。
- source_word: בְדַל אֹזֶן
  choice: 一片耳朵
  rationale: בְדַל 指割裂下来的一小块，“一片”自然传达微不足道的残骸。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 这是现代中文对该民族—盟约群体称谓最自然且准确的表达；逐字译作“以色列的儿子们”会造成误解。
- source_word: הַיֹּשְׁבִים בְּשֹׁמְרוֹן
  choice: 住在撒马利亚的
  rationale: 保留分词所表达的居住状态及地点。
- source_word: בִּפְאַת מִטָּה
  choice: 只带着床的一角
  rationale: 介词可表伴随；“只带着”在中文中显出被救出的不过是微薄残余，同时不把它解释成完整获救。
- source_word: וּבִדְמֶשֶׁק עָרֶשׂ
  choice: 和大马士革的榻
  rationale: 按马所拉文本及其元音首先保留地名“大马士革”；עָרֶשׂ 译作“榻”，与前面的“床”有所区别。由于短语含义和句法极难确定，其他主要理解列入脚注。
theological_decisions:
- issue: 这里的“被救出来”是否表示大规模、圆满的拯救
  choice: 保留只有零碎残余被抢回的反讽性比喻
  alternative: 将本句笼统处理为以色列人会从审判中幸存
  rationale: 牧人从狮口抢回的只是两条腿或一片耳朵，说明所谓获救极其有限；译文不将严厉的审判信息软化为得胜式的拯救。
- issue: 如何处理末尾含义不明的短语
  choice: 正文保留马所拉文本可直接读出的“大马士革”，脚注说明其他可能
  alternative: 正文直接译为“锦缎铺面的榻”或“在大马士革的榻上”
  rationale: 原文的词义关系与句法均有真实的不确定性；正文不以推测取代文本，脚注则向读者公开主要解释。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。正文保持先知宣告的简洁力度，并以具体、略带惨烈的意象呈现审判；对末句不作过度润色，以脚注保留原文的真正歧义。
