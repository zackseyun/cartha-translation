source:
  edition: WLC
  text: אִם יִתָּקַ֤ע שׁוֹפָר֙ בְּ/עִ֔יר וְ/עָ֖ם לֹ֣א יֶחֱרָ֑דוּ אִם תִּהְיֶ֤ה רָעָה֙ בְּ/עִ֔יר וַ/יהוָ֖ה לֹ֥א עָשָֽׂה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/003/006.yaml
  text: If a trumpet is blown in a city[a], do not the people tremble? If disaster happens in a city, has not Yahweh done it?
translation:
  language: zh_hans
  text: 城中若吹响号角，百姓岂不战兢？城中若发生灾祸[a]，岂不是耶和华所行的吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “灾祸”或译“祸患”。希伯来语这个词也可表示“恶”，但这里指灾难或审判，并非道德上的邪恶。
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתָּקַע שׁוֹפָר
  choice: 吹响号角
  rationale: שׁוֹפָר指用于发出警报的角号；“号角”既符合古代器物，也能在现代汉语中自然表达全城警讯。中文以“吹响”表达原文被动式的事件意义，比生硬的“号角被吹响”更自然。
- source_word: בְּעִיר
  choice: 城中
  rationale: עִיר是城、城邑；两处均译“城中”，保留原文重复及两问之间的平行结构。
- source_word: וְעָם
  choice: 百姓
  rationale: 这里指城中的民众。“百姓”是自然、庄重的现代汉语表达，不额外限定族群身份。
- source_word: יֶחֱרָדוּ
  choice: 战兢
  rationale: חרד兼有因恐惧或警报而震颤、惊惧之意；“战兢”保留身体与情绪两方面的力度。
- source_word: רָעָה
  choice: 灾祸
  rationale: רָעָה语义可包括恶、祸患、灾难；本节处于警报和审判语境，所指是临到城中的灾祸，而非道德上的邪恶。
- source_word: תִּהְיֶה
  choice: 发生
  rationale: היה与“灾祸”连用时表示灾祸出现或临到；“发生”符合现代汉语习惯，并未额外说明其具体方式。
- source_word: וַיהוָה
  choice: 耶和华
  rationale: 以中文圣经读者熟悉的形式音译神名יהוה，明确保留原文的专名性质。
- source_word: עָשָׂה
  choice: 所行的
  rationale: עשה是宽泛的“做、行”；“所行的”贴近原文直接归于耶和华的行动，同时避免用“导致”或“降下”进一步解释其机制。
theological_decisions:
- issue: רָעָה与耶和华行动之间的含义
  choice: 译作“灾祸”，不译作“恶”
  alternative: 恶；祸患；灾难
  rationale: 上下文以城中号角所发的警报为平行，指向审判性的灾祸。这样既不把道德邪恶归于耶和华，又不削弱经文关于他施行审判的陈述。
- issue: 第二问中的神圣行动主体
  choice: “岂不是耶和华所行的吗？”
  alternative: 岂不是耶和华使它发生的吗？；岂不是耶和华降下的吗？
  rationale: 原文עשה直接把行动归于耶和华。“所行的”保留这一鲜明归因及其神学张力，却不把原文宽泛动词窄化为某一种因果机制。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“城中……城中……”保留希伯来文的重复和平行；两个“岂不／岂不是”保留反问语气。脚注标记置于其实际说明的“灾祸”之后。
