  text: וְ/הִכֵּיתִ֥י בֵית הַ/חֹ֖רֶף עַל בֵּ֣ית הַ/קָּ֑יִץ וְ/אָבְד֞וּ בָּתֵּ֣י הַ/שֵּׁ֗ן וְ/סָפ֛וּ בָּתִּ֥ים רַבִּ֖ים נְאֻם יְהוָֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/amos/003/015.yaml
  text: And I will strike the winter house along with the summer house[a], and the houses of ivory will perish, and many houses will come to an end," declares Yahweh.
translation:
  language: zh_hans
  text: “我要击打冬季的住所和夏季的住所；象牙的房屋[a]必灭亡，许多房屋也必不复存在。”这是雅威的宣告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “象牙的房屋”也可更明确地译作“以象牙装饰的房屋”；所指很可能是镶嵌象牙的豪宅，并非用象牙建成的房屋。
    reason: 说明希伯来语意象可能指象牙镶饰，而非建筑材料。
lexical_decisions:
- source_word: וְהִכֵּיתִי
  choice: 我要击打
  rationale: נכה表示击打；“击打”保留神施行审判的力度，又不把本句动词本身过度明确为“彻底摧毁”。
- source_word: בֵית הַחֹרֶף
  choice: 冬宫
  rationale: 指冬季居住的房屋。“冬宫”与下文“夏宫”形成简洁、自然的季节性住所对称，并显出富人拥有多处住宅的背景。
- source_word: עַל
  choice: 也击打
  rationale: 此处连接两个受击打的对象，表达夏宫与冬宫一同遭受审判；汉语重复动词比直译介词更清楚自然。
- source_word: בֵּית הַקָּיִץ
  choice: 夏宫
  rationale: 指夏季居住的房屋，与“冬宫”保持平行。
- source_word: וְאָבְדוּ
  choice: 必消失
  rationale: אבד在此为不及物，可指灭亡、消失；“必消失”保留其结果意义，不擅自补入毁灭的具体方式。
- source_word: בָּתֵּי הַשֵּׁן
  choice: 象牙宫
  rationale: 字面为“象牙的房屋”，很可能指以象牙镶饰的豪宅。“象牙宫”保留希伯来文鲜明意象，具体含义置于脚注说明。
- source_word: וְסָפוּ
  choice: 必归于无有
  rationale: סוף在此表示终结、完结；“归于无有”自然地传达这些房屋不复存在，同时不指定火烧或战争等机制。
- source_word: בָּתִּים רַבִּים
  choice: 许多房屋
  rationale: רַבִּים最直接的意义是数量众多；不按语境推断为“宏伟的房屋”，从而保留原词的通常量化意义。
- source_word: נְאֻם יְהוָה
  choice: 这是雅威的宣告
  rationale: 保留先知书中庄重的宣告公式，并将יהוה按神名音译为“雅威”。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华／上主
  rationale: 原文直接使用四字神名；“雅威”以现代汉语常见音译保留其作为以色列之神专名的性质，而不以称号替代。
- issue: בָּתִּים רַבִּים是“许多房屋”还是“宏伟的房屋”
  choice: 许多房屋
  alternative: 宏伟的房屋
  rationale: “宏伟”符合富豪住宅的上下文，但不是רַבִּים最直接的词义；正文保留数量意义，避免把语境推论写入经文。
translation_notes:
  register: 采用现代、庄重而易懂的先知宣告语体。用“冬宫／夏宫”保持紧凑的诗性平行；分号呈现审判对象由季节性住所扩展到象牙豪宅和许多房屋的层进结构。
