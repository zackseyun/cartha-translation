id: AMO.3.14
reference: Amos 3:14
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּ֗י בְּ/י֛וֹם פָּקְדִ֥/י פִשְׁעֵֽי יִשְׂרָאֵ֖ל עָלָ֑י/ו וּ/פָֽקַדְתִּי֙ עַל מִזְבְּח֣וֹת בֵּֽית אֵ֔ל וְ/נִגְדְּעוּ֙ קַרְנ֣וֹת הַ/מִּזְבֵּ֔חַ וְ/נָפְל֖וּ לָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/003/014.yaml
  text: For on the day when I punish Israel for his transgressions[a], I will also punish the altars of Bethel[b]; the horns of the altar will be cut off and fall to the ground.
translation:
  language: zh_hans
  text: 因为，在我因以色列的悖逆而惩罚他的那一天[a]，我也必惩罚伯特利的众祭坛；祭坛的角[b]必被砍断，落在地上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在我追讨以色列悖逆之罪的那一天。”希伯来语动词也可译为“察访”；在这里指追究罪责或施行惩罚。
    reason: lexical_alternative
  - marker: b
    text: “角”指祭坛四角状如角的突出部分，与祭坛的神圣性和礼仪用途有关。
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，说明前述审判宣告的缘由，保留因果、解释语气。
- source_word: בְּיוֹם פָּקְדִי
  choice: 在我……追讨……的那一天
  rationale: 既保留“日子”的希伯来表达，也传达审判发生之时；“追讨”体现פקד在此处追究罪责、施行惩罚的司法含义。
- source_word: פִשְׁעֵי
  choice: 悖逆之罪
  rationale: פשע不只是一般过错，还含有反叛合法权柄的意味；“悖逆之罪”兼顾其道德与盟约色彩。
- source_word: יִשְׂרָאֵל עָלָיו
  choice: 向以色列追讨他……
  rationale: 介词短语及阳性单数后缀指向作为单数集合体的以色列；用“他”保留先知话语中对该民族人格化的称呼。
- source_word: וּפָקַדְתִּי עַל
  choice: 我也必追讨
  rationale: 与前一个פקד采用相同译词，显明对以色列罪行的追讨也临到伯特利的祭坛；“也”体现连接词在语境中的递进关系。
- source_word: מִזְבְּחוֹת בֵּית אֵל
  choice: 伯特利的祭坛
  rationale: 按原文复数译为“祭坛”，并以通行中文地名“伯特利”表达构造关系。
- source_word: וְנִגְדְּעוּ
  choice: 必被砍断
  rationale: גדע表示强力砍下或截断；被动表达保留原文所强调的祭坛角遭毁坏的结果。
- source_word: קַרְנוֹת הַמִּזְבֵּחַ
  choice: 祭坛的角
  rationale: 直译这一具体礼仪设施，不把“角”的形象泛化为普通凸起。
- source_word: וְנָפְלוּ לָאָרֶץ
  choice: 落在地上
  rationale: 自然、准确地表达被砍断的祭坛角随后坠地的结果。
theological_decisions:
- issue: 如何表达作为单数集合体的以色列
  choice: 向以色列追讨他悖逆之罪
  alternative: 向以色列追讨其悖逆之罪
  rationale: 希伯来文用阳性单数后缀回指“以色列”。“他”保留民族被人格化、被当作盟约责任主体的表达；“其”虽可行，却会削弱这种人格色彩。
- issue: 是否按字面保留祭坛之“角”的礼仪意象
  choice: 祭坛的角
  alternative: 祭坛四角的凸起
  rationale: 原文所指是祭坛角落状如角的突出部分，具有礼仪意义。保留“角”既准确，也避免把先知所描绘的圣所象征性权能遭破坏这一画面解释得过平。
- issue: פקד两次出现时是否统一译法
  choice: 两处均译为“追讨”
  alternative: 第一处译“惩罚”，第二处译“毁坏”
  rationale: 重复用词保留原文将以色列受审与伯特利祭坛受审紧密相连的修辞结构，同时“追讨”仍含追究罪责并施行惩罚之意。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“追讨”兼具司法审判色彩，并保留原文同一动词前后复现的结构；分号呈现审判宣告由祭坛整体转向祭坛之角被毁的推进。
