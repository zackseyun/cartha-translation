  rationale: 修订以“惩罚”清楚表达两处פקד在审判语境中的含义，并以重复的“也必惩罚”保留原文动词复现和连结关系。将“祭坛”修为“众祭坛”，明确反映原文复数。脚注a改为真正的词汇替代和语义说明，不改变正文的审判含义；脚注b保留原有准确文化说明。
