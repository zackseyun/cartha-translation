base_translation:
  language: en
  yaml_path: translation/ot/amos/003/005.yaml
  text: Does a bird fall into a trap on the ground when there is no snare for it? Does a trap spring up from the ground when it has caught nothing at all?[a][b]
translation:
  language: zh_hans
  text: 鸟若没有为它设下的诱捕物，岂会落入地上的捕鸟器呢？捕鸟器若没有捕到任何东西，岂会从地上弹起呢？[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “诱捕物”也可译作“给它的诱饵”或“使捕鸟器触发的装置”。原文所用的词可以更具体地指引诱猎物或启动捕鸟器的东西。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“而捕捉，它并没有捕捉”，用重复的结构加强语气，意思是“什么也没有捕到”或“若没有捕到任何东西”。
    reason: lexical_alternative
lexical_decisions:
- source_word: תִפֹּל
  choice: 落入
  rationale: 保留 נפל“落下”的基本意义；在捕鸟语境中，“落入……捕鸟器”自然表达陷入圈套，而不直接改译为“被捕”。
- source_word: צִפּוֹר
  choice: 鸟
  rationale: 此词在本节泛指鸟，并未限定为麻雀等具体鸟类。
- source_word: פַּח
  choice: 捕鸟器
  rationale: 指捕捉鸟兽的器具；结合 צִפּוֹר 译作“捕鸟器”，既清楚又能与 מוֹקֵשׁ 所指的诱捕装置有所区别。
- source_word: הָאָרֶץ / הָאֲדָמָה
  choice: 地上 / 从地上
  rationale: 两词在这里都描写设于地面的捕鸟场景；现代汉语用“地上”自然明确，同时以介词区别静态位置和向上弹起的起点。
- source_word: מוֹקֵשׁ
  choice: 诱捕它的机关
  rationale: 此词可指诱饵、扳机或使猎物中计的捕捉装置。正文采用较宽泛的“诱捕……的机关”，避免与 פַּח 都笼统译作“网罗”，也不把有争议的具体机械结构定死。
- source_word: אֵין לָהּ
  choice: 没有诱捕它的机关
  rationale: לָהּ 的阴性单数后缀指向“鸟”；“诱捕它”在汉语中明确保留了这个所指。
- source_word: יַעֲלֶה
  choice: 弹起
  rationale: עלה 的基本意义是“上升”；用于捕鸟器触发的场景，“弹起”自然呈现器具由地面向上动作的形象。
- source_word: וְלָכוֹד לֹא יִלְכּוֹד
  choice: 若什么也没有捕到
  rationale: 希伯来文以不定式绝对形配合限定动词，强化“捕捉”这一概念；汉语以“什么也没有捕到”表达捕获结果完全不存在，并使反问关系清楚。
