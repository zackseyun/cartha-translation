source:
  edition: WLC
  text: הַ/יְרֻצ֤וּ/ן בַּ/סֶּ֨לַע֙ סוּסִ֔ים אִֽם יַחֲר֖וֹשׁ בַּ/בְּקָרִ֑ים כִּֽי הֲפַכְתֶּ֤ם לְ/רֹאשׁ֙ מִשְׁפָּ֔ט וּ/פְרִ֥י צְדָקָ֖ה לְ/לַעֲנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/006/012.yaml
  text: Do horses run on rock? Does one plow there with oxen? Yet you have turned justice into poison[c][b][a], and the fruit of righteousness into wormwood.
translation:
  language: zh_hans
  text: 马能在岩石上奔跑吗？人会用牛在那里耕地吗？可是，你们竟把公平变成毒物[a]，把公义[c]的果实变成苦艾[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “毒物”也可译作“苦胆”或“苦毒的植物”；希伯来词 רֹאשׁ 可指有毒或味极苦的物质、植物。
    reason: lexical_alternative
  - marker: b
    text: “苦艾”是一种味道极苦的植物，在这里比喻道德败坏及其苦涩后果。
    reason: cultural_note
  - marker: c
    text: “公义”也可译作“公平”；希伯来词 צְדָקָה 在此既可有道德含义，也可有社会和司法含义。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיְרֻצוּן בַּסֶּלַע סוּסִים
  choice: 马能在岩石上奔跑吗
  rationale: 未完成式用于反问，表达这种行为荒谬而不可行；“岩石上”保留 סֶלַע 的坚硬岩地意象。
- source_word: אִם יַחֲרוֹשׁ בַּבְּקָרִים
  choice: 人会用牛在那里耕地吗
  rationale: אִם 在此引出并列的第二个反问，而非条件句；“牛”符合 בקר 在耕作语境中的役畜含义。“在那里”承接前句的岩石地面，使希伯来文省略而语境暗示的地点在中文中清楚自然。
- source_word: כִּי
  choice: 可是
  rationale: 此处引出对听众的直接指控；“可是”传达反问与现实行为之间强烈的反差，同时不拘泥于常见的原因义。
- source_word: הֲפַכְתֶּם
  choice: 你们竟把……变成
  rationale: 第二人称复数完成式是直接控诉；“竟”突出其荒谬性，并与前面的反问衔接。
- source_word: מִשְׁפָּט
  choice: 公平
  rationale: 在先知对社会与司法败坏的谴责中，该词指应当施行的公正秩序；“公平”是现代中文中自然清楚的表达。
- source_word: רֹאשׁ
  choice: 毒物
  rationale: 该词可指有毒或极苦的植物、物质；“毒物”保留危害性的核心意象，又避免把其具体植物种类说得过死。
- source_word: פְרִי צְדָקָה
  choice: 公义的果实
  rationale: 保留原文“果实”的具体比喻；צְדָקָה 可涵盖道德正直及社会司法层面的正义，正文采用较宽广的“公义”。
- source_word: לַעֲנָה
  choice: 苦艾
  rationale: לַעֲנָה 是以强烈苦味著称的植物，先知书中常象征道德败坏及其苦果；保留具体植物意象。
theological_decisions:
- issue: צְדָקָה 在本节是道德“公义”还是社会司法意义的“公平”
  choice: 正文译作“公义”
  alternative: “公平”
  rationale: 该词与 מִשְׁפָּט 并列，既可强调正直，也可带司法与社会公正色彩。正文用“公义”保留较宽的伦理含义，脚注注明另一种可能，不把两者之间的张力消解掉。
- issue: רֹאשׁ 所指是毒性还是苦味
  choice: 正文译作“毒物”
  alternative: “苦胆”或某种苦毒植物
  rationale: 原词兼有苦与毒的语义关联，具体所指并不确定；正文强调败坏公平所产生的致害性，脚注保留苦味植物或“苦胆”的可能。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。两个短促反问保留先知话语的冲击力；后半句用平行结构呈现“公平—毒物”和“公义的果实—苦艾”的强烈反转。
