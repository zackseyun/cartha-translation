id: AMO.6.1
reference: Amos 6:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: ה֚וֹי הַ/שַּׁאֲנַנִּ֣ים בְּ/צִיּ֔וֹן וְ/הַ/בֹּטְחִ֖ים בְּ/הַ֣ר שֹׁמְר֑וֹן נְקֻבֵי֙ רֵאשִׁ֣ית הַ/גּוֹיִ֔ם וּ/בָ֥אוּ לָ/הֶ֖ם בֵּ֥ית יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/006/001.yaml
  text: Woe to those who are at ease in Zion[a], and to those who feel secure on the mountain of Samaria, the distinguished men of the foremost of the nations[c][b], to whom the house of Israel comes.
translation:
  language: zh_hans
  text: '祸哉！那些在锡安安逸无忧的人，

    那些在撒玛利亚山上自以为安稳的人！

    他们是列国中居首之国的显要人物[a][b]；

    以色列家都到他们那里去。[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “显要人物”直译可作“被点名的人”或“被指定的人”，也可理解为“有名望的人”。
    reason: lexical_alternative
  - marker: b
    text: “列国中居首之国”也可译作“列国之首”或“列国中最重要的国”。原文没有说明这是公认的地位还是人的自许。
    reason: lexical_alternative
  - marker: c
    text: 本句希伯来文很简练，直译为“以色列家来到他们那里”；“他们”指前述显要人物。
    reason: syntax_clarification
lexical_decisions:
- source_word: הוֹי
  choice: 祸哉
  rationale: 这是先知宣告审判、兼含哀叹的感叹词；“祸哉”庄重而有警告力度。
- source_word: הַשַּׁאֲנַנִּים
  choice: 安逸无忧的人
  rationale: שׁאנן表示安逸、安然，也可带自满和麻木之意；此译保留其表面安逸及上下文中的负面语气。
- source_word: בְּצִיּוֹן
  choice: 在锡安
  rationale: 按地点义直译，保留对南国权力中心的明确指称。
- source_word: וְהַבֹּטְחִים
  choice: 自以为安稳的人
  rationale: בטח可指信靠或感到安全；本节责备虚假的安全感，“自以为安稳”能体现其负面语境，又不另行指定其倚靠对象。
- source_word: בְּהַר שֹׁמְרוֹן
  choice: 在撒玛利亚山
  rationale: 保留地理表达及其与锡安的平行结构，不把它处理成现代固定专名“撒玛利亚山脉”。
- source_word: נְקֻבֵי
  choice: 显要人物
  rationale: 该词本义涉及被点名、被指定，语境中指有名望或受推重的人；正文采用自然汉语表达其社会地位，字面可能性收入脚注。
- source_word: רֵאשִׁית הַגּוֹיִם
  choice: 这列国中居首之国
  rationale: רֵאשִׁית可表示最先、首要或居首；译文保持其“首位”意味，同时不把这种自许或称号解释成客观事实。
- source_word: וּבָאוּ לָהֶם
  choice: 都到他们那里去
  rationale: 希伯来文是简练的第三人称复数表达，直陈以色列家来到这些人那里；中文保留原文由第二人称称呼转为第三人称叙述的张力。
- source_word: בֵּית יִשְׂרָאֵל
  choice: 以色列家
  rationale: 保留希伯来文的家族—民族称谓及其群体意味，不简化为“以色列人”。
theological_decisions:
- issue: 锡安与撒玛利亚所指的受责备者
  choice: 按平行结构理解为同时责备锡安和撒玛利亚中安逸、自恃的显要人物。
  alternative: 全节只针对北国领袖，锡安只是修辞上的并列对象，或其文本曾有变动。
  rationale: 现存希伯来文本明确并列两个地点；译文直接保留，不把二者合并，也不凭文本以外的推测删改。
- issue: “列国中居首之国”的性质
  choice: 保留为原文对该国首要地位的称说，不判定这是先知认可、领袖自诩，还是讽刺性称呼。
  alternative: 明确译成“自称居列国之首”，或明确断定以色列确为最尊贵的国家。
  rationale: 原文没有明说这种首要地位是谁的判断；加入“自称”或神学性的肯定都会消除真实歧义。
- issue: 以色列家到显要人物那里去的目的
  choice: 只译作“到他们那里去”。
  alternative: 译作“向他们求助”“听他们裁决”或“投奔他们”。
  rationale: 原文只说“来到他们那里”，未说明目的；不宜把政治倚靠、司法求见等可能解释写入正文。
translation_notes:
  register: 采用现代、庄重而可朗读的先知性文体。“祸哉”保留审判宣告的力度；“安逸无忧／自以为安稳”形成平行。正文不替原文补出以色列家前来的具体目的，并以脚注说明“显要人物”和“居首”的词义歧义。
