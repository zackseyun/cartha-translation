  text: וּ/נְשָׂא֞/וֹ דּוֹד֣/וֹ וּ/מְסָרְפ֗/וֹ לְ/הוֹצִ֣יא עֲצָמִים֮ מִן הַ/בַּיִת֒ וְ/אָמַ֞ר לַ/אֲשֶׁ֨ר בְּ/יַרְכְּתֵ֥י הַ/בַּ֛יִת הַ/ע֥וֹד עִמָּ֖/ךְ וְ/אָמַ֣ר אָ֑פֶס וְ/אָמַ֣ר הָ֔ס כִּ֛י לֹ֥א לְ/הַזְכִּ֖יר בְּ/שֵׁ֥ם יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/006/010.yaml
  text: Then his uncle[a], the one who burns him, will carry him out to bring the bones out of the house, and he will say to the one who is in the innermost part of the house, “Is there still anyone with you?” And he will say, “No one.” Then he will say[c][b], “Hush! For we must not mention the name of Yahweh.”
translation:
  language: zh_hans
  text: 死者的叔父[a]，也就是焚烧他的人[b]，要把他抬走，将骸骨搬出屋外。他会问那在屋子最深处的人：“你那里还有人吗？”那人会回答：“没有了。”他就说：“嘘！我们不可提雅威的名。”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“死者的亲属”。希伯来语所用的词可指男性近亲；在这里译作“叔父”较为具体。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语直译为“焚烧他的人”。这种说法很不寻常，可能指审判灾难中与处理尸体有关的焚烧。
    reason: cultural_note
  - marker: c
    text: 或译：“不要提雅威的名。”希伯来语表达十分简略，既可理解为直接禁令，也可理解为陈述一种不得不遵守的禁忌。
    reason: alternative_reading
lexical_decisions:
- source_word: דּוֹדוֹ
  choice: 死者的叔父
  rationale: דּוֹד 在这里最自然是指负责处理尸体的男性近亲，常可特指叔父；用“死者的”明确汉语中的指代关系，同时以脚注保留“亲属”的可能。
- source_word: וּמְסָרְפוֹ
  choice: 也就是焚烧他的人
  rationale: 该词来自 שׂרף（焚烧），原文措辞罕见。译文保留“焚烧”的具体含义和审判场景中的突兀感，不将其泛化为“安葬的人”。
- source_word: לְהוֹצִיא עֲצָמִים
  choice: 将骸骨搬出屋外
  rationale: עֲצָמִים 直指“骨头”；“骸骨”在现代汉语中自然、庄重，也保留尸体处理的具体意象。
- source_word: בְּיַרְכְּתֵי הַבַּיִת
  choice: 在屋子最深处
  rationale: יַרְכָּה 表示内部偏远、深处的空间；“最深处”清楚传达有人躲在房屋内侧角落的画面。
- source_word: הַעוֹד עִמָּךְ
  choice: 你那里还有人吗
  rationale: 原文询问是否仍有人与对方同在；补出“人”符合汉语表达，也不限定所问的是幸存者还是尸体。
- source_word: אָפֶס
  choice: 没有了
  rationale: אָפֶס 在对话中是省略式否定，表示再没有任何人；“没有了”简短自然，并带出“已经无人剩下”的语气。
- source_word: הָס
  choice: 嘘
  rationale: 这是突然要求噤声的感叹词；“嘘”保留其短促和恐惧感。
- source_word: לֹא לְהַזְכִּיר בְּשֵׁם יְהוָה
  choice: 我们不可提雅威的名
  rationale: 这一不定式结构简短而含混，可表达禁令或必要性。“我们不可”自然传达其禁止意味，同时不解释为何不可提名。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以“雅威”音译四字神名，保留其作为以色列之神专名的性质，而不以称号替代。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名。译作“雅威”是现代汉语中依据较通行学术复原的音译，可保留专名性质；“耶和华”是传统形式，但反映的是另一种历史读法。
- issue: כִּי לֹא לְהַזְכִּיר בְּשֵׁם יְהוָה 的语气
  choice: 我们不可提雅威的名
  alternative: 不要提雅威的名
  rationale: 希伯来语使用不定式，语气简略，可理解为陈述某种禁忌或直接禁止。正文采用“我们不可”，脚注保留直接命令的可能，不进一步说明禁忌的神学原因。
- issue: 焚烧尸体这一罕见表述
  choice: 保留为“焚烧他的人”
  alternative: 预备安葬他的人
  rationale: 以色列通常实行土葬，使此处“焚烧”显得异常；但这种异常很可能属于审判灾难的可怕图景。译文不以一般安葬习俗消解原文张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。以短句和直接对话保留灾后搜寻尸体时的紧张、压抑气氛；不补充瘟疫、礼仪禁忌或神学动机等原文未明说的解释。
