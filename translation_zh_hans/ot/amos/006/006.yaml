base_translation:
  language: en
  yaml_path: translation/ot/amos/006/006.yaml
  text: who drink wine from bowls and anoint themselves with the finest oils[b][a], but are not grieved over the ruin of Joseph—
translation:
  language: zh_hans
  text: 那些用大碗喝酒、把上等的膏油涂抹在身上[a]，却不为约瑟所遭的破败[b]忧伤[c]的人——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“把最上乘的膏油涂抹在身上”；原文直译为“油中的上等部分”。
    reason: lexical_alternative
  - marker: b
    text: “约瑟”在这里是对以色列民、尤其北国以色列的诗性称呼。
    reason: cultural_note
  - marker: c
    text: “忧伤”所译的原文动词也可指“患病、衰弱”；这里含有因别人的灾难而痛苦的意思。
    reason: lexical_ambiguity
lexical_decisions:
- source_word: הַשֹּׁתִים
  choice: 那些……的人
  rationale: 带定冠词的分词延续上文对受祸者的描述；用“那些……的人”保留其承接性，不擅自改为直接称呼。
- source_word: בְּמִזְרְקֵי יַיִן
  choice: 用大碗喝酒
  rationale: מִזְרָק 指碗、盆一类较大的器皿，也见于礼仪场景；此处不明说其为祭器，以“大碗”自然呈现奢纵豪饮的画面。
- source_word: וְרֵאשִׁית שְׁמָנִים
  choice: 上等的膏油
  rationale: רֵאשִׁית 本义为“起初、首要部分”，在这里指最上乘的部分；“上等的膏油”既自然，又保留奢华意味。
- source_word: יִמְשָׁחוּ
  choice: 抹身
  rationale: משׁח 常指“膏抹”；本处语境是把膏油涂抹在自己身上享用，并非礼仪性的受膏，因此译为“抹身”。
- source_word: וְלֹא נֶחְלוּ
  choice: 却不……忧伤
  rationale: חלה 的尼法勒式可指生病、衰弱，也可引申为因悲痛而痛苦；正文采用合乎本段道德责备语境的“忧伤”，脚注保留较字面的可能。
- source_word: עַל שֵׁבֶר יוֹסֵף
  choice: 为约瑟的破败
  rationale: שֵׁבֶר 的核心意象是破裂、崩毁，延伸指灾祸或毁败；“破败”保留这一意象。יוֹסֵף 按原文保留为“约瑟”，不在正文中释作“以色列”。
theological_decisions:
- issue: “约瑟”的转喻所指
  choice: 正文保留“约瑟”，脚注说明其诗性所指。
  alternative: 直接译成“以色列”或“约瑟家”。
  rationale: 保留先知原有的支派与盟约意象，避免把具有一定语境弹性的称谓在正文中单一化。
- issue: נֶחְלוּ 所表达的悲痛程度
  choice: 正文译为“不……忧伤”。
  alternative: 译为“不因……病倒”或“不为……痛苦”。
  rationale: “忧伤”能自然表达对同胞灾难缺乏悲悯的责备，同时借脚注保留动词“患病、衰弱”的较字面色彩。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“大碗喝酒”与“膏油抹身”形成鲜明的奢纵画面；句末破折号表示本节的描述承接上文，并引向下一节的审判宣告。
