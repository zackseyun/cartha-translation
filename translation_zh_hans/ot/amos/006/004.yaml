  text: those who lie on beds of ivory and sprawl on their couches[b][a], and eat lambs from the flock and calves from the stall—
translation:
  language: zh_hans
  text: 那些躺在象牙床上、舒展着躺卧在榻上的人[a]，吃羊群中的羊羔和肥育棚里的牛犊[b]——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “舒展着躺卧”也可译作“伸展着躺卧”或“懒散地躺着”。
    reason: lexical_alternative
  - marker: b
    text: “肥育棚”也可译作“畜栏”；原文所用的词可指圈养、育肥牲畜的棚圈。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשֹּׁכְבִים
  choice: 那些躺……的人
  rationale: 分词在此作名词用，承接上文受祸者的描述；“那些……的人”保留其持续、惯常的意味。
- source_word: מִטּוֹת שֵׁן
  choice: 象牙床
  rationale: 直译为“象牙的床”，很可能指以象牙装饰或镶嵌的豪华床榻；正文采用简洁、自然的对应表达，不额外限定制作方式。
- source_word: וּסְרֻחִים
  choice: 舒展四肢卧着
  rationale: 该词描绘恣意伸展、安逸躺卧的姿态；此译既传达奢靡闲散之感，也避免仅用“躺”而丢失与前一分词的区别。
- source_word: עַל עַרְשׂוֹתָם
  choice: 在榻上
  rationale: עֶרֶשׂ可指床或卧榻；用“榻”与前面的“床”形成词汇区分，也符合宴饮享乐的场景。
- source_word: וְאֹכְלִים
  choice: 吃
  rationale: 用现代汉语一般现在式自然表达分词所呈现的惯常行为。
- source_word: כָּרִים
  choice: 羊羔
  rationale: 指幼羊，也可理解为小公羊；“羊羔”是清楚而常用的对应词，精选牲畜的意味由奢华语境体现。
- source_word: מִצֹּאן
  choice: 群中的
  rationale: 保留从羊群中选取牲畜的画面；结合“羊羔”译作“群中的”自然简洁。
- source_word: וַעֲגָלִים
  choice: 牛犊
  rationale: 直接对应幼牛，突显食用鲜嫩牲畜的奢侈。
- source_word: מִתּוֹךְ מַרְבֵּק
  choice: 肥育棚里的
  rationale: מַרְבֵּק指圈养并肥育牲畜的棚圈；译出“肥育”可保留该词较“棚”更具体的饲养用途。
