  text: עִבְר֤וּ כַֽלְנֵה֙ וּ/רְא֔וּ וּ/לְכ֥וּ מִ/שָּׁ֖ם חֲמַ֣ת רַבָּ֑ה וּ/רְד֣וּ גַת פְּלִשְׁתּ֗ים הֲ/טוֹבִים֙ מִן הַ/מַּמְלָכ֣וֹת הָ/אֵ֔לֶּה אִם רַ֥ב גְּבוּלָ֖/ם מִ/גְּבֻלְ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/006/002.yaml
  text: Cross over to Calneh and see[a]; and from there go to Hamath the great; then go down to Gath of the Philistines[b]. Are they better than these kingdoms? Or is their territory greater than your territory?
translation:
  language: zh_hans
  text: 你们要前往甲尼[b]察看，再从那里往大城哈马去，然后下到非利士人的迦特。它们比这些王国更好吗？[a]还是它们的疆域比你们的疆域更大呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你们比这些王国更好吗？”原文“更好”没有明说主语，因此既可指前面提到的城市或王国，也可指这里受到责问的人。
    reason: alternative_reading
  - marker: b
    text: “甲尼”是地名。有人认为它是叙利亚北部或美索不达米亚的一座城，但确切地点不能确定。
    reason: cultural_note
lexical_decisions:
- source_word: עִבְרוּ
  choice: 前往
  rationale: 该复数命令式表示越过、经过或前往某处；此处与目的地“甲尼”连用，译作“前往”符合现代汉语，同时保留连续考察各地的行动感。
- source_word: כַלְנֵה
  choice: 甲尼
  rationale: 按现代中文圣经地名惯例音译；其确切位置仍有争议。
- source_word: וּרְאוּ
  choice: 察看
  rationale: ראה的命令式在此不只是偶然看见，而是要求亲自观察、比较；“察看”简洁而符合修辞语境。
- source_word: וּלְכוּ מִשָּׁם
  choice: 再从那里……去
  rationale: 保留连接词和地点推进关系，以自然汉语表达一连串命令。
- source_word: חֲמַת רַבָּה
  choice: 大哈马
  rationale: רַבָּה意为“大”；“大哈马”既保留修饰意义，也符合简洁自然的中文地名表达。
- source_word: וּרְדוּ
  choice: 然后下到
  rationale: ירד表示下行或下到某地；“下到”保留地理方向，“然后”明确行动次序。
- source_word: גַת פְּלִשְׁתִּים
  choice: 非利士人的迦特
  rationale: 按原文属格结构，说明迦特属于或由非利士人居有，避免仅译为笼统地区名。
- source_word: הֲטוֹבִים מִן הַמַּמְלָכוֹת הָאֵלֶּה
  choice: 它们比这些王国更好吗
  rationale: “更好”的阳性复数形容词没有明说主语；正文依最近的复数所指，将其理解为前述诸城或诸国，并以脚注保留另一种理解。מַמְלָכוֹת直译为“王国”。
- source_word: אִם
  choice: 还是
  rationale: 这里引出并列反问的第二项，现代汉语用“还是”最自然。
- source_word: רַב גְּבוּלָם מִגְּבֻלְכֶם
  choice: 它们的疆域比你们的疆域更大
  rationale: גְּבוּל在政治领土比较中指疆界所涵盖的地域，译作“疆域”比单指边界线的“边界”准确。
theological_decisions:
- issue: “更好”的隐含主语
  choice: 正文理解为前述城市或王国，以“它们”表达
  alternative: 理解为受话者，即“你们比这些王国更好吗？”
  rationale: 原文形容词为阳性复数，却没有显明主语；最近的所指支持“它们”，但语法允许将主语理解为先知所责问的人，因此用脚注保留这项真实歧义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。连续使用“前往—再从那里—然后下到”呈现原文逐地推进的命令；地名采用常见中文译名。反问句保留原文比较语气，并通过脚注说明隐含主语的歧义。
