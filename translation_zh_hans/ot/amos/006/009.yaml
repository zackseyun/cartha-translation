    rationale: 希伯来语仅以复数代词和动词说“他们必死”；汉语“他们必死”已自然指向该十人。
  - severity: medium
    issue: 脚注称其他人“离去或死亡以后”仍被留下。
    rationale: יִוָּתְרוּ表示被留下、剩余，但该词本身不说明其他人为何不在；“死亡”应避免作为词汇释义加入。
