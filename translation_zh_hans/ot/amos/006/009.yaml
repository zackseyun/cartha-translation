  text: וְ/הָיָ֗ה אִם יִוָּ֨תְר֜וּ עֲשָׂרָ֧ה אֲנָשִׁ֛ים בְּ/בַ֥יִת אֶחָ֖ד וָ/מֵֽתוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/006/009.yaml
  text: And it will happen that if ten men remain in one house[a], they will die.
translation:
  language: zh_hans
  text: 将来若一所房子里剩下十个人，他们也必死。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “剩下”也可译作“被留下”。希伯来语动词指在其他人不在后仍然留下或剩余。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: （由“如果……必……”的句式表达）
  rationale: 此处“וְ + היה”的完成式引出将要发生的情形。汉语不必机械译为“事情将是”，条件—结果句式已能自然表达其承接与未来意味。
- source_word: אִם
  choice: 如果
  rationale: 该虚词在此最自然地引入条件。“如果”保留原文的条件性；译作“当……时”会使语气显得更为确定。
- source_word: יִוָּתְרוּ
  choice: 还剩下
  rationale: יתר的尼法勒形表示“被留下、剩余”。“还剩下”既自然，又保留先前已有其他人不在了的含义；不译作“幸存”，以免加入永久逃过灾难的解释。
- source_word: עֲשָׂרָה אֲנָשִׁים
  choice: 十个人
  rationale: אֲנָשִׁים在此指一组人。现代汉语用“十个人”比“十个男人”自然，也未必抹去原文语法上的阳性形式；上下文重点在人数与无人逃脱。
- source_word: בְּבַיִת אֶחָד
  choice: 一所房子里
  rationale: 按空间性的具体含义翻译，指一栋房屋之内；不译作“一户人家”，避免把建筑场所解释为家庭单位。
- source_word: וָמֵתוּ
  choice: 他们也都必死
  rationale: 该形式陈述条件成立后的未来结果。“必死”体现结果的确定性；“都”明确指前述十人无一例外，“也”承接本段灾祸中其他人的死亡。
theological_decisions:
- issue: 灾祸中余剩者是否等同于最终得救的“余民”
  choice: 仅译为“还剩下”，并明确他们仍必死亡
  alternative: 译为“幸存的十个人”或把他们理解为得救的余民
  rationale: 原文只说这些人被留下或仍然剩余，并随即说他们会死；不应把“剩下”自动赋予神学上的最终拯救含义。
translation_notes:
  register: 采用现代、庄重而简洁的普通话。“一所房子里”保持具体空间意象；句末加“也都”使汉语衔接自然，并凸显十人无一能免，但不额外说明死亡的方式或原因。
