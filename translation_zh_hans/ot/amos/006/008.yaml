id: AMO.6.8
reference: Amos 6:8
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: נִשְׁבַּע֩ אֲדֹנָ֨/י יְהוִ֜ה בְּ/נַפְשׁ֗/וֹ נְאֻם יְהוָה֙ אֱלֹהֵ֣י צְבָא֔וֹת מְתָאֵ֤ב אָֽנֹכִי֙ אֶת גְּא֣וֹן יַֽעֲקֹ֔ב וְ/אַרְמְנֹתָ֖י/ו שָׂנֵ֑אתִי וְ/הִסְגַּרְתִּ֖י עִ֥יר וּ/מְלֹאָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/006/008.yaml
  text: 'The Lord GOD has sworn by himself—oracle of Yahweh[a], the God of Armies: I abhor the pride of Jacob, and I hate his citadels[c][b]; and I will hand over the city and all that fills it.'
translation:
  language: zh_hans
  text: '主雅威指着自己起誓——这是雅威——万军的上帝[b]——的宣告：


    “我厌恶雅各的骄傲[a]，


    憎恨他的堡垒[c]；


    我要把城和其中的一切都交出去。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “骄傲”也可译作“威荣”。希伯来词既可表示高贵威荣，也可表示傲慢；这里的审判语境较支持负面含义。
    reason: 保留 גָּאוֹן 的词义歧义。
  - marker: b
    text: “万军”指众多军旅或天上的众军；这一称号传统上也译作“万军之神”。
    reason: 说明 צְבָאוֹת 的军事意象及传统译法。
  - marker: c
    text: “堡垒”也可译作“宫殿”；原词可指设防的宫殿或宫堡。
    reason: 保留 אַרְמוֹן 在宫殿与坚固城堡之间的语义范围。
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: 主雅威
  rationale: 以“主”译 אֲדֹנָי，以“雅威”音译上帝的专名 יהוה，既保留复合称号的两个成分，也避免把专名化为普通头衔。
- source_word: נִשְׁבַּע ... בְּנַפְשׁוֹ
  choice: 指着自己起誓
  rationale: 希伯来语字面涉及“自己的生命／自身”，实际表达以自己为誓言凭据；此译符合现代汉语起誓用语。
- source_word: נְאֻם יְהוָה אֱלֹהֵי צְבָאוֹת
  choice: 这是雅威、万军之上帝的宣告
  rationale: נְאֻם 是先知话语中的庄严宣告公式；“万军之上帝”保留 צְבָאוֹת 的群军意象，同时采用汉语圣经语体中可理解的表达。
- source_word: מְתָאֵב
  choice: 我厌恶
  rationale: 表达强烈的反感与排斥，并与下句“憎恨”形成自然而有力度的并列。
- source_word: גְּאוֹן יַעֲקֹב
  choice: 雅各的骄傲
  rationale: גָּאוֹן 可指威荣，也可指傲慢；审判语境和“厌恶”支持负面的“骄傲”，同时用脚注保留另一可能。
- source_word: אַרְמְנֹתָיו
  choice: 他的堡垒
  rationale: 该词可指宫殿，也可指设防的宫堡；“堡垒”突出本段审判语境中的权势与防御性，另一译法列入脚注。
- source_word: שָׂנֵאתִי
  choice: 憎恨
  rationale: 完成式在这里表达雅威坚定、既定的态度，汉语现在时式的直接陈述最为有力。
- source_word: וְהִסְגַּרְתִּי
  choice: 我要……交出去
  rationale: 使役词形在此表示把对象交在他者权下；保留连接词的并列关系，不额外加入因果含义。
- source_word: עִיר וּמְלֹאָהּ
  choice: 城和其中的一切
  rationale: מְלֹא 指充满城的所有事物，可涵盖居民、财物等；此译自然简洁，又不擅自限定范围。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文使用四字神名，音译“雅威”保留其作为盟约专名的性质；不以普通称号替代。
- issue: גְּאוֹן יַעֲקֹב 的褒贬含义
  choice: 雅各的骄傲
  alternative: 雅各的威荣
  rationale: 该词本身可有正面的威荣或负面的骄傲之义；本节处于审判宣告中，并受“厌恶”支配，因此正文采用负面义，但在脚注中保留真实歧义。
- issue: “雅各”的所指
  choice: 保留“雅各”
  alternative: 意译为“以色列”
  rationale: 这里可能以祖先之名代指以色列民，但保留原有称呼可维持先知语言的历史与神学关联，不将转喻明说为单一解释。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“指着自己起誓”和“交出去”自然易懂；诗行分排保留宣告的节奏与力度。正文不补出攻城者，也不把“城中一切”缩限为居民或财物。所有脚注标记均置于对应词语之后。
