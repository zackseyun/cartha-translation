  text: הַ/פֹּרְטִ֖ים עַל פִּ֣י הַ/נָּ֑בֶל כְּ/דָוִ֕יד חָשְׁב֥וּ לָ/הֶ֖ם כְּלֵי שִֽׁיר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/006/005.yaml
  text: who strum on the mouth of the harp, and like David invent for themselves instruments of song—
translation:
  language: zh_hans
  text: 你们在琴上随意弹奏，像大卫一样为自己创制乐器——
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַפֹּרְטִים
  choice: 随意弹奏
  rationale: 该分词指拨弦、弹奏，语境中可能含漫不经心地乱弹之意；“随意弹奏”保留先知讽刺性的语气，又不把动作限定得过死。
- source_word: עַל־פִּי הַנָּבֶל
  choice: 在琴声中
  rationale: 字面近于“在琴的口上/按着琴口”；这是希伯来语中较难确定的表达。中文采用自然说法，表达伴随琴声弹奏，同时避免生硬直译“琴口”。
- source_word: חָשְׁבוּ
  choice: 创制
  rationale: 此处可指设计、构想或发明。“创制”既能表达有意构想并制作，也适合乐器这一宾语。
- source_word: כְּלֵי שִׁיר
  choice: 乐器
  rationale: 字面为“歌唱/音乐的器具”，在本句中自然指用于奏乐的器具，即乐器。
theological_decisions:
- issue: “像大卫一样”的比较范围与语气
  choice: 保留直接比较，不说明其为真实仿效还是讽刺性的自比
  alternative: 译作“自以为像大卫一样”
  rationale: 原文仅说“像大卫”，没有明说“自以为”；经文本身可能带讽刺意味，但不宜在译文中替作者明确解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。破折号保留本节与下一节连续列举的未完语势。“琴”作为 נֵבֶל 的通俗对应，不进一步指定古代乐器形制。
