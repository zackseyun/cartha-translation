  text: you who put far away the evil day and bring near the seat of violence[a][b].
translation:
  language: zh_hans
  text: 你们把灾祸之日推得很远，却使强暴的座位临近[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “把灾祸之日推得很远”或译“把灾祸之日往后推”。
    reason: lexical_alternative
  - marker: b
    text: “强暴的座位”或译“强暴的宝座”或“强暴的统治”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמְנַדִּים
  choice: 推远
  rationale: 按使动、主动的分词理解，保留“使之远离”的具体意象和对听众的指责；不将其解释性地弱化为“忽视”。
- source_word: לְיוֹם רָע
  choice: 灾祸之日
  rationale: יוֹם רָע在先知语境中指将临的患难或审判。“灾祸之日”既自然，又保留其预言性含义，不额外限定为某一种审判。
- source_word: וַתַּגִּישׁוּן
  choice: 却使……临近
  rationale: 按נגשׁ的使动意义译出“使临近”；“却”凸显原句将“推远”与“临近”并置所形成的反讽，而没有解释反讽的具体所指。
- source_word: שֶׁבֶת
  choice: 座位
  rationale: 保留其座席、权位或统治中心的形象；正文不用更具体的“宝座”或更抽象的“统治”，并在脚注列出这些可能。
- source_word: חָמָס
  choice: 强暴
  rationale: חָמָס常指暴力、残害及蛮横不义。“强暴”具有先知性语体，也能涵盖暴力与压迫性的恶行。
theological_decisions:
- issue: 本节反讽的解释
  choice: 译文指责安逸者自以为把灾祸之日推远，同时使强暴的权位或统治临近。
  alternative: 也可理解为他们推迟面对审判，却使导致审判的暴力秩序坐大；或他们以为灾难尚远，实际却使暴力之日临近。
  rationale: 希伯来文高度凝练，“强暴的座位”与“灾祸之日”的关系没有明说。正文保留这种张力，不将其单独定为社会压迫或末后审判。
translation_notes:
  register: 采用现代、庄重而简洁的普通话。“推远”与“临近”形成鲜明对照；“灾祸之日”比直译“恶日”更符合现代汉语习惯。“强暴的座位”略带陌生感，但有意保存原文意象，并由脚注说明可能含义。
