source:
  edition: WLC
  text: כִּֽי הִנֵּ֤ה יְהוָה֙ מְצַוֶּ֔ה וְ/הִכָּ֛ה הַ/בַּ֥יִת הַ/גָּד֖וֹל רְסִיסִ֑ים וְ/הַ/בַּ֥יִת הַ/קָּטֹ֖ן בְּקִעִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/006/011.yaml
  text: For behold[a], Yahweh commands, and the great house will be struck into fragments, and the small house into pieces.
translation:
  language: zh_hans
  text: 看哪，雅威下令：大房屋必被击碎成碎片，小房屋必被击得裂开。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他必把大房屋击成碎片，把小房屋击得裂开。”原文动词为第三人称阳性单数主动式；在“雅威下令”之后，实际执行击打者没有另行说明。
    reason: 保留原文主动动词的形式，并说明其动作主体可能存在的歧义。
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 在这里承接上文，为先前的宣告说明缘由；“因为”清楚保留这一论述关系。
- source_word: הִנֵּה
  choice: 看哪
  rationale: 这是先知话语中唤起注意的表达；“看哪”虽略带庄重色彩，却能保留原文突然而鲜明的语气。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文四字神名作现代汉语音译，保留其专名性质。
- source_word: מְצַוֶּה
  choice: 下令
  rationale: 该分词表达雅威正在发出或即将发出具有权威的命令；“下令”在现代汉语中简洁自然。
- source_word: וְהִכָּה
  choice: 就要被击成／也要被打出
  rationale: 原文是第三人称阳性单数主动形式，但紧接“雅威下令”之后，实际执行击打者没有另外点明。正文用被动结构保留审判结果而不擅自指定执行者，脚注列出较贴近形式的主动译法。
- source_word: הַבַּיִת הַגָּדוֹל
  choice: 大房屋
  rationale: 保留“房屋”及大小对比，不将其具体化为宫殿或富人住宅；“大”也容许规模和地位两方面的联想。
- source_word: רְסִיסִים
  choice: 碎片
  rationale: 表示被猛烈击碎后形成的细碎部分；“碎片”准确、清楚，并保留破坏的强烈程度。
- source_word: הַבַּיִת הַקָּטֹן
  choice: 小房屋
  rationale: 与“大房屋”构成直接平行，不额外解释其社会身份。
- source_word: בְּקִעִים
  choice: 裂缝
  rationale: 该词可指裂口、裂缝或裂开的部分；译作“裂缝”保留它与前一分句“碎片”的用词差异，避免把两词合并为同一概念。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名。正文采用接近 Yahweh 的现代汉语音译“雅威”，不以称号替代专名。
- issue: וְהִכָּה 的动作主体
  choice: 正文采用被动表达，不明确指定执行击打者
  alternative: “他必把大房屋击成碎片，把小房屋打出裂缝”
  rationale: 动词在语法上是第三人称阳性单数，最自然的上文关联可能是雅威，但“下令”也容许由受命者执行。正文不消除这一张力，主动形式则置于脚注。
translation_notes:
  register: 采用现代、庄重而易懂的先知性语言。“看哪”有意保留原文的警示语气；“大房屋／小房屋”维持诗句的平行结构，不加入阶层或建筑类型方面的解释。
