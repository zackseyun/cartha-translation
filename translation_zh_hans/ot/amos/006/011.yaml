revisions:
- from: 因为，看哪，雅威下令，大房屋就要被击成碎片，小房屋也要被打出裂缝。[a]
  to: 看哪，雅威下令：大房屋必被击碎成碎片，小房屋必被击得裂开。[a]
  rationale: 删去“因为”，以免中文在脱离上文时形成不自然的悬接；原文的 כִּי 仍可在连续经文的篇章关系中理解为承接上文的说明。“看哪”保留 הִנֵּה 的警示性。改用“必”表达预言性审判；“击碎成碎片／击得裂开”分别对应 רְסִיסִים 与 בְּקִעִים，不将二者混同。脚注保留主动式和未明说执行者的句法歧义。
