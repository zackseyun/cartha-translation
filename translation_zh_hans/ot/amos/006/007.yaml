  yaml_path: translation/ot/amos/006/007.yaml
  text: Therefore now they will go into exile at the head of the exiles[a], and the revelry of those who sprawl will pass away.
translation:
  language: zh_hans
  text: 所以，他们如今必首先被掳去，列在被掳者之首；横卧之人的宴乐[a]也必止息。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“舒展躺卧之人的宴席”，或“横卧之人的狂欢”。希伯来语表达十分凝练，很可能呼应上一节躺卧在床榻上的情景。
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: 所以
  rationale: 承接上文对安逸权贵的斥责，引出审判的后果；“所以”在现代汉语中清楚自然。
- source_word: עַתָּה
  choice: 现在
  rationale: 保留审判已迫近的时间意味，不把它强化为原文未明确表达的“立刻”。
- source_word: יִגְלוּ
  choice: 必……流亡
  rationale: גלה在此指离乡被放逐；“流亡”简洁表达这一处境，而“必”体现先知宣告的确定性。
- source_word: בְּרֹאשׁ
  choice: 首先
  rationale: 原义为“在首位、在前头”，这里讽刺居首的权贵也将在流亡者中居首；“首先”自然传达其先行被放逐之意。
- source_word: גֹּלִים
  choice: 流亡者
  rationale: 这是与יִגְלוּ同根的分词名词化用法；“流亡者”与“流亡”相互呼应，尽量保留原文的词根重复。
- source_word: וְסָר
  choice: 也必消逝
  rationale: סור可指离去、消除或止息；结合宴饮场景，“消逝”表达他们享乐终结，同时保留其离去的动态意味。
- source_word: מִרְזַח
  choice: 宴乐
  rationale: 该词可指宴席、饮宴或狂欢聚会；“宴乐”既包含宴饮，也传达放纵享乐的语境，并保留一定词义宽度。
- source_word: סְרוּחִים
  choice: 伸腿躺卧之人
  rationale: 该分词描绘舒展开来、懒散躺卧的人，与上一节躺在床榻上的画面相呼应；此译法具体而不额外添加道德判断。
