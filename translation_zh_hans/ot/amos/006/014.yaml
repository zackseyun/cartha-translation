id: AMO.6.14
reference: Amos 6:14
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּ֡י הִנְ/נִי֩ מֵקִ֨ים עֲלֵי/כֶ֜ם בֵּ֣ית יִשְׂרָאֵ֗ל נְאֻם יְהוָ֛ה אֱלֹהֵ֥י הַ/צְּבָא֖וֹת גּ֑וֹי וְ/לָחֲצ֥וּ אֶתְ/כֶ֛ם מִ/לְּב֥וֹא חֲמָ֖ת עַד נַ֥חַל הָ/עֲרָבָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/amos/006/014.yaml
  text: For behold[a], I am raising up against you a nation, O house of Israel, declares Yahweh, the God of hosts[b], and they will oppress you from Lebo-hamath to the Wadi of the Arabah.
translation:
  language: zh_hans
  text: “因为，看哪，以色列家啊，我必兴起一国来攻击你们，”万军之上帝耶和华宣告，“他们必从哈马口[a]直到亚拉巴溪谷[b]欺压你们。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“哈马的入口”。希伯来语可理解为地名“哈马口”，也可理解为描述边界的短语。
    reason: 保留地名与描述性边界短语之间的真实歧义。
  - marker: b
    text: 或译“亚拉巴溪”。这里的词可指溪流、季节性水道或其溪谷。
    reason: 说明 נחל 在当地地貌语境中的词义范围。
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，说明审判临到的根据，保留原文的因果衔接。
- source_word: הִנְנִי
  choice: 看哪，我必
  rationale: “看哪”保留先知宣告中引人注意的语气；“必”结合后面的分词，表达上帝即将采取的确定行动。
- source_word: מֵקִים
  choice: 兴起
  rationale: 使役词形表示使某国兴起、登上历史舞台，并清楚保留上帝的主动权。
- source_word: עֲלֵיכֶם
  choice: 来攻击你们
  rationale: 在军事审判语境中，介词具有敌对意味；加“来”使现代汉语表达自然。
- source_word: בֵּית יִשְׂרָאֵל
  choice: 以色列家啊
  rationale: 保留集体称呼和直接呼告的先知语气。
- source_word: נְאֻם יְהוָה
  choice: 耶和华宣告
  rationale: 以庄重而自然的现代汉语呈现固定的先知宣告公式，并以专名表达四字神名。
- source_word: אֱלֹהֵי הַצְּבָאוֹת
  choice: 万军之上帝
  rationale: 保留“众军”可能兼指天上与地上军旅的宽广含义，不将其限缩为某一类军队。
- source_word: גּוֹי
  choice: 一国
  rationale: 原文为单数，指上帝兴起作为审判工具的外邦国家。
- source_word: וְלָחֲצוּ
  choice: 他们必欺压
  rationale: 该动词表达持续施压、压迫和使人困苦；“欺压”适合国家征服的语境。
- source_word: מִלְּבוֹא חֲמָת
  choice: 从哈马口
  rationale: “哈马口”既可作为传统地名式边界称谓，也保留“哈马入口”的字面意象；脚注说明其歧义。
- source_word: נַחַל הָעֲרָבָה
  choice: 亚拉巴河谷
  rationale: נחל可指季节性水道及其河谷；“河谷”符合该地理语境，同时以脚注保留“溪流”的可能译法。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: “耶和华”是现代中文读者最熟悉的专名形式，明确呈现神名，而不以“主”替代；“雅威”较接近常见学术重构读音，但在普通中文中辨识度较低。
- issue: אֱלֹהֵי הַצְּבָאוֹת 中“众军”的范围
  choice: 万军之上帝
  alternative: 军队的上帝
  rationale: 原文没有限定这些“军旅”仅为地上军队或天上众军，因此采用涵盖性较强的传统表达，避免缩窄其神学张力。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“看哪”“宣告”保留先知话语的力度；用引号和插入式发言公式，使直接呼告与耶和华的宣告关系清晰。脚注标记均置于其所解释的地理表达之后。
