revisions:
- from: “因为，看哪，我必兴起一国来攻击你们。以色列家啊，”万军之上帝耶和华宣告，“他们必欺压你们，从哈马口[a]直到亚拉巴河谷[b]。”
  to: “因为，看哪，以色列家啊，我必兴起一国来攻击你们，”万军之上帝耶和华宣告，“他们必从哈马口[a]直到亚拉巴溪谷[b]欺压你们。”
  rationale: 修正引号和发言公式的句法结构，使“以色列家啊”明确属于耶和华对受众的直接呼告；并将“亚拉巴河谷”改为“亚拉巴溪谷”，以避免将 נַחַל 单一化为谷地，同时保留脚注中的词义范围。其余措辞忠实、自然，无须更动。
