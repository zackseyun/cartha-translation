base_translation:
  language: en
  yaml_path: translation/ot/amos/006/013.yaml
  text: you who rejoice over nothing[a], who say[b], “Have we not by our own strength taken horns for ourselves?”
translation:
  language: zh_hans
  text: 你们这些为无有之物[a]欢喜、又说：“我们不是靠自己的力量为自己夺得了双角[b]吗？”的人，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “无有之物”也可能谐指地名“罗底巴”；这个名字听起来像“无物”或“没有什么”。本句或讽刺他们竟因攻占这样一座城而欢喜。
    reason: lexical_alternative
  - marker: b
    text: “双角”也可能译作“加宁”：‘我们不是靠自己的力量为自己攻取了加宁吗？’译作“双角”的希伯来词也可使人联想到地名“加宁”，可能借此把军事力量与攻城之功构成双关。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשְּׂמֵחִים
  choice: 你们这些……而欢喜的人
  rationale: 复数分词承接上下文对以色列人的直接斥责；用带呼语色彩的结构，既保留句法关系，又符合现代汉语表达。
- source_word: לְלֹא דָבָר
  choice: 因虚无之事
  rationale: 原文可直译为“因并非一物之事”或“因无物”，在此首先表达他们为虚空、无价值的成就欢喜；同时可能谐指地名罗底巴，故以脚注保留双关。
- source_word: הָאֹמְרִים
  choice: 竟说
  rationale: 第二个复数分词与前一分词平行。“说”保留基本意义；“竟”自然传达先知对其狂妄自夸的责斥语气，但不改变命题内容。
- source_word: הֲלוֹא
  choice: 不是……吗
  rationale: 对应预期肯定回答的反问，表现说话者洋洋自得的确信。
- source_word: בְחָזְקֵנוּ
  choice: 靠自己的力量
  rationale: חֹזֶק表示力量，带第一人称复数词尾；“自己的”清楚呈现他们将功绩归于自身力量的夸口。
- source_word: לָקַחְנוּ
  choice: 取得了
  rationale: לָקַח语义宽泛，可指拿取、获得，也可在军事语境中指攻取；“取得”不把可能的隐喻或地名解释限定为某一种。
- source_word: קַרְנָיִם
  choice: 双角
  rationale: 该词为“角”的双数形式，角在希伯来语意象中象征力量；也可能谐指城名加宁。正文保留具体而反常的“双角”意象，脚注说明地名双关。
theological_decisions:
- issue: 人的力量与自我夸耀
  choice: 保留“靠自己的力量”的第一人称夸口，不在正文添加上帝方面的解释
  alternative: 译成“凭我们的威势赢得了权力”等解释性表达
  rationale: 经文本身以讽刺性的反问揭露以色列人的自恃；直译其夸口可保留先知话语的神学张力，而不替读者先行解释。
translation_notes:
  register: 采用现代、庄重而易懂的先知性斥责语体。“虚无之事”比口语化的“没什么”更适合经文语域，也能容纳抽象意义与地名双关；“双角”保留希伯来文双数及力量象征，不在正文中将其平滑改写为“权势”。所有脚注标记均已置于正文相应位置。
