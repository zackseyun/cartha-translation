revisions:
- from: 看哪，我正使你们脚下受压[a]，就像满载禾捆的车使下面受压一样。
  to: 看哪，我正在你们下面施压[a]，如同满载禾捆的车压着车下的东西。
  rationale: 修订删除原文没有的“脚”，以“在你们下面施压”直接保留 תַּחְתֵּיכֶם 的空间关系；后半句改为“压着车下的东西”，使车与其下受压之物的关系在汉语中明确，并维持与前半句相应的施压意象。脚注继续呈现“压在原处”及未来／重压等可行理解，而不在正文中把争议性句法完全定解。
