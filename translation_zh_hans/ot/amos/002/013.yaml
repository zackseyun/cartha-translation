  text: הִנֵּ֛ה אָנֹכִ֥י מֵעִ֖יק תַּחְתֵּי/כֶ֑ם כַּ/אֲשֶׁ֤ר תָּעִיק֙ הָ/עֲגָלָ֔ה הַֽ/מְלֵאָ֥ה לָ֖/הּ עָמִֽיר׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/002/013.yaml
  text: Look[a], I am pressing down beneath you[b], as a cart presses down when it is full of sheaves.
translation:
  language: zh_hans
  text: 看哪，我正在你们下面施压[a]，如同满载禾捆的车压着车下的东西。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这句话也可理解为：“我正把你们压在原处”或“我要使你们不堪重负。”这里的希伯来语可指施加压力或重压；动词形式既可作鲜明的当前宣告，也可指即将发生的事。
    reason: 原文对受压者及“在你们下面”的关系表达简略，且动词的具体含义和时间语气容许不同理解。
lexical_decisions:
- source_word: הִנֵּה
  choice: 看哪
  rationale: 引出带有强调意味的宣告；“看哪”庄重而仍为现代读者所熟悉。
- source_word: אָנֹכִי
  choice: 我
  rationale: 独立人称代词强调说话者是耶和华；汉语在“看哪，我……”的结构中已能自然体现这一强调。
- source_word: מֵעִיק
  choice: 正使……受压
  rationale: 该词表达施加压力或重压；采用使动结构，既呼应后半句同根动词，又避免擅自补出原文没有明说的直接宾语。“正”体现分词的鲜明、正在临到的宣告语气。
- source_word: תַּחְתֵּיכֶם
  choice: 你们脚下
  rationale: 保留 תַּחַת 的空间义“在……下面”，并用自然汉语表达；不在正文中径直采用解释性的“在你们所在之处”。
- source_word: כַּאֲשֶׁר
  choice: 就像……一样
  rationale: 清楚引出比喻，并符合现代汉语表达习惯。
- source_word: תָּעִיק
  choice: 使下面受压
  rationale: 与前半句 מֵעִיק 采用相同的“使……受压”，保留希伯来文的词根重复；“下面”对应比喻中车重压其下之物，但不具体补明原文未说出的对象。
- source_word: הָעֲגָלָה
  choice: 车
  rationale: 指运载农作物的车辆；结合“禾捆”已足以显出农用载货车的场景，无须使用可能显得古旧的专门称谓。
- source_word: הַמְלֵאָה לָהּ
  choice: 满载
  rationale: 以简洁自然的汉语表达车辆装得满满的状态；לָהּ 不宜机械直译。
- source_word: עָמִיר
  choice: 禾捆
  rationale: 指收割后捆扎或聚集的谷物茎秆；“禾捆”准确保留农业图景，也比单说“庄稼”具体。
theological_decisions:
- issue: 审判动作的直接对象与空间关系
  choice: 使你们脚下受压
  alternative: 把你们压在原处／把你们压倒
  rationale: 希伯来文没有明说“你们”是动词的直接宾语，而 תַּחְתֵּיכֶם 直指“你们下面”。正文因此保留空间关系和原文略显异常的图像，不把它完全解释成“压倒你们”；脚注说明常见的审判性理解。
- issue: 动作的时间语气
  choice: 正使
  alternative: 将要使
  rationale: 分词可作生动的当前宣告，也可指即将发生的行动；正文用“正”保留迫近而鲜明的语气，脚注交代将来时理解。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。正文保留原文“你们下面”的空间图像及前后同根动词的重复，同时以脚注呈现“把你们压在原处／使你们不堪重负”的解释可能，避免把有争议的句法与意象静默定解。
