id: AMO.2.15
reference: Amos 2:15
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/תֹפֵ֤שׂ הַ/קֶּ֨שֶׁת֙ לֹ֣א יַעֲמֹ֔ד וְ/קַ֥ל בְּ/רַגְלָ֖י/ו לֹ֣א יְמַלֵּ֑ט וְ/רֹכֵ֣ב הַ/סּ֔וּס לֹ֥א יְמַלֵּ֖ט נַפְשֽׁ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/002/015.yaml
  text: And the one who grasps the bow will not stand[a], and the swift of foot will not escape[c][b], and the rider of the horse will not save his life.
translation:
  language: zh_hans
  text: 持弓的必站立不住[a]；脚步快的也不能逃脱，骑马的也不能保全性命[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“必不能站稳”或“必守不住阵地”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“不能逃命”。
    reason: lexical_alternative
lexical_decisions:
- source_word: תֹפֵשׂ הַקֶּשֶׁת
  choice: 持弓的
  rationale: 原文直译为“抓住／操持弓的人”，在军事语境中指弓箭手。“持弓的”既保留原文意象，也不作过度具体化。
- source_word: לֹא יַעֲמֹד
  choice: 必站立不住
  rationale: עמד 的基本义是“站立”；在战争与审判语境中含有无法站稳或守住阵地之意。“站立不住”保留字面意象，同时自然表达其语境含义。
- source_word: קַל בְּרַגְלָיו
  choice: 脚步快的
  rationale: 贴近原文“在双脚上敏捷的人”，用现代汉语自然表达善于疾走、逃跑迅速的人。
- source_word: לֹא יְמַלֵּט
  choice: 不能逃脱
  rationale: מלט 在此指从危险中脱身；“逃脱”简洁自然，并符合审判临到时无人能够逃走的语境。
- source_word: רֹכֵב הַסּוּס
  choice: 骑马的
  rationale: 忠实保留原文单数的“骑马者”，现代汉语表达简洁自然。
- source_word: לֹא יְמַלֵּט נַפְשׁוֹ
  choice: 不能保全性命
  rationale: נפשׁ 在此指人的生命；整句意为无法使自己的性命脱离危险。“保全性命”清楚传达希伯来语习语。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。三个分句保持原文递进并列的节奏；前两项用“也”衔接，突出即使持弓、善跑或骑马的人都无法逃过审判。
