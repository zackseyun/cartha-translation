base_translation:
  language: en
  yaml_path: translation/ot/amos/002/016.yaml
  text: Even the stouthearted among the warriors will flee naked on that day,” declares Yahweh[a].
translation:
  language: zh_hans
  text: 勇士中勇敢的人，在那日也必赤身逃跑。”雅威宣告。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַמִּיץ לִבּוֹ
  choice: 最有胆量的
  rationale: 原文直译近于“心里刚强的”，在此指勇敢、果决的人。“最有胆量的”以自然现代汉语表达该习语；结合“勇士中”的范围，最高级语气恰当地传达其中尤为勇敢者也无法逃脱审判。
- source_word: בַּגִּבּוֹרִים
  choice: 勇士中
  rationale: גִּבּוֹרִים在本段军事语境中指强健善战的人。“勇士”简洁自然，并保留军事含义。
- source_word: עָרוֹם
  choice: 赤身
  rationale: 保留“裸体、赤裸”的直接含义及仓皇逃命、蒙受羞辱的强烈画面，不解释为较含混的“身无长物”或“卸去装备”。
- source_word: יָנוּס
  choice: 必……逃跑
  rationale: נוס意为逃离、逃跑；结合预言语境，以“必”表达未完成式在此所指向的确定未来。
- source_word: בַּיּוֹם הַהוּא
  choice: 在那日
  rationale: 采用现代汉语中庄重而常见的先知性时间表达，准确保留原文的指示语。
- source_word: נְאֻם יְהוָה
  choice: 这是雅威的宣告
  rationale: נְאֻם是庄严的先知宣告套语；“这是……的宣告”自然清楚。יהוה按其专名音译为“雅威”，而不以称号代替。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。音译“雅威”保留其专名性质，不以“上主”这一称号替代；“耶和华”虽为中文传统译名，但较不贴近该名称通常重构的读音。
- issue: “赤身逃跑”的具体含义
  choice: 保留字面画面，不说明其成因
  alternative: 解作丢盔弃甲、被剥去衣服或毫无战利品地逃跑
  rationale: 原文只说“赤身”，可以暗示极度仓皇和羞辱，却未交代为何赤身；正文不把其中任何一种解释写死。
translation_notes:
  register: 采用庄重、简明的现代标准汉语。“赤身逃跑”保留原文突兀而有力的审判意象；句末引号承接前文整段神谕，随后以宣告公式收束。
