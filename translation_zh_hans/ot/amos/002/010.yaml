  text: וְ/אָנֹכִ֛י הֶעֱלֵ֥יתִי אֶתְ/כֶ֖ם מֵ/אֶ֣רֶץ מִצְרָ֑יִם וָ/אוֹלֵ֨ךְ אֶתְ/כֶ֤ם בַּ/מִּדְבָּר֙ אַרְבָּעִ֣ים שָׁנָ֔ה לָ/רֶ֖שֶׁת אֶת אֶ֥רֶץ הָ/אֱמֹרִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/002/010.yaml
  text: Yet I brought you up from the land of Egypt[a], and I led you in the wilderness forty years, to take possession of the land of the Amorites.
translation:
  language: zh_hans
  text: 然而，是我把你们从埃及地领上来，又带领你们在旷野四十年，为要占领亚摩利人的土地[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文“亚摩利人”采用单数形式，作为集合称谓，指整个亚摩利族群。
    reason: 说明希伯来语集合单数与现代汉语自然表达之间的差异。
lexical_decisions:
- source_word: וְאָנֹכִי
  choice: 然而，是我
  rationale: 连词在上下文中带有转折意味，独立代词 אָנֹכִי 又加强主语语气；“然而，是我”兼顾这种对比和强调。
- source_word: הֶעֱלֵיתִי אֶתְכֶם
  choice: 把你们……领上来
  rationale: עלה 的使役式用于出埃及事件，既有“带领”的意思，也保留从埃及“上来”的方向性表达。
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: 从埃及地
  rationale: 原文明确含有“地”一词；“埃及地”准确而自然。
- source_word: וָאוֹלֵךְ אֶתְכֶם
  choice: 又带领你们
  rationale: הלך 的使役式在此表示使人前行、引领；译作“带领”符合现代汉语，也体现上帝的引导。
- source_word: בַּמִּדְבָּר
  choice: 在旷野
  rationale: 介词 בְּ 直译为“在”；“旷野”是出埃及与漂流语境中 מִדְבָּר 的自然对应词。
- source_word: אַרְבָּעִים שָׁנָה
  choice: 四十年
  rationale: 直接保留原文的时间数量。
- source_word: לָרֶשֶׁת
  choice: 为要占领
  rationale: ירשׁ 在土地与征服定居的语境中表示取得并占有；“占领”保留其主动取得土地的含义，而不预先限定为“承受产业”。
- source_word: אֶרֶץ הָאֱמֹרִי
  choice: 亚摩利人的土地
  rationale: 原文“亚摩利人”为单数集合名词；现代汉语用“亚摩利人”可自然表达该族群的集合意义。
theological_decisions:
- issue: “亚摩利人”的集合单数
  choice: 正文译作“亚摩利人的土地”，以自然汉语表达族群集合意义
  alternative: 亚摩利人的地（按原文形式凸显单数集合用法）
  rationale: 希伯来语 הָאֱמֹרִי 在形式上是单数，在这里却集体指亚摩利族群。采用自然的汉语族称不改变历史所指，并以脚注保留原文的语法特点。
- issue: לָרֶשֶׁת 的目的与语义
  choice: 为要占领
  alternative: 为要得着；为要承受
  rationale: 此处回顾进入并取得迦南地的历史行动。“占领”体现 ירשׁ 的主动取得含义，同时避免把“继承产业”的神学内涵直接加进本节。
translation_notes:
  register: 采用现代、庄重且易懂的叙述语体。“然而，是我”凸显上下文中的反差和主语强调；“领上来”“旷野”“四十年”保留出埃及叙事的传统措辞。脚注标记紧随其实际说明的“亚摩利人的土地”，避免误附于“埃及地”。
