  text: וְ/עַל בְּגָדִ֤ים חֲבֻלִים֙ יַטּ֔וּ אֵ֖צֶל כָּל מִזְבֵּ֑חַ וְ/יֵ֤ין עֲנוּשִׁים֙ יִשְׁתּ֔וּ בֵּ֖ית אֱלֹהֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/002/008.yaml
  text: And on garments taken in pledge they stretch themselves out beside every altar[c][b][a], and in the house of their God they drink the wine of those they have fined.
translation:
  language: zh_hans
  text: 他们在各祭坛旁，躺卧在扣作抵押的衣服上[a]；又在他们的神殿[c]中，喝着用罚款买来的酒[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们在各祭坛旁舒展身体，躺在作抵押的衣服上。”
    reason: lexical_alternative
  - marker: b
    text: 原文直译可作“受罚者的酒”或“被处罚之人的酒”。
    reason: lexical_alternative
  - marker: c
    text: “他们的神”也可理解为“他们的众神”。希伯来语אֱלֹהִים虽为复数形式，也常用来指单一的神；此处的单、复数所指仍有争议。
    reason: alternative_reading
lexical_decisions:
- source_word: בְּגָדִים חֲבֻלִים
  choice: 抵押来的衣服
  rationale: בְּגָדִים泛指衣物，חֲבֻלִים是חבל的被动分词，指作为担保而收取的物品。译为“抵押来的衣服”既自然，又保留其法律和经济背景。
- source_word: יַטּוּ
  choice: 躺
  rationale: 此处描写人在祭坛旁伸展身体、躺卧的动作。“躺”符合现代汉语表达；其更具体的“舒展身体”意象在脚注中保留。
- source_word: אֵצֶל כָּל מִזְבֵּחַ
  choice: 在各祭坛旁
  rationale: אֵצֶל表示“在……旁边”，כָּל加单数名词具有逐一或遍及之意；“各祭坛”自然地传达这种分布性。
- source_word: יֵין עֲנוּשִׁים
  choice: 用罚款得来的酒
  rationale: עֲנוּשִׁים源于ענשׁ，可指受罚者或被罚取的款项。中文若直译为“受罚者的酒”不够自然，因此在正文中表达为酒是用罚款所得，同时以脚注保留字面结构和歧义。
- source_word: בֵּית אֱלֹהֵיהֶם
  choice: 他们神的殿里
  rationale: אֱלֹהִים虽为复数形态，却常以复数形式指单一的神；带第三人称复数所有格时，形式本身不能单独裁定是“他们的神”还是“他们的众神”。上下文也可理解为以色列人在敬拜中犯罪，故正文采用自然且不额外引入多神含义的“他们神的殿”，并在脚注注明另一可能。
theological_decisions:
- issue: אֱלֹהֵיהֶם应理解为“他们的神”还是“他们的众神”
  choice: 正文译作“他们神的殿”
  alternative: “他们众神的殿”
  rationale: 该词在形态上是复数词干加第三人称阳性复数后缀，但אֱלֹהִים经常以复数形式表达单数“神”。因此，不能仅凭形态断定所指必为多位神。正文采用符合希伯来语常见用法、也适合本段以色列敬拜场景的单数表达，同时用脚注保存复数理解的可能性。
- issue: עֲנוּשִׁים所表达的是受罚的人还是罚取之物
  choice: 正文译作“用罚款得来的酒”
  alternative: “受罚者的酒”或“被处罚之人的酒”
  rationale: 构造关系允许较字面的“受罚者的酒”，但在语境中很可能指通过罚金或处罚所得而置办的酒。正文传达其经济剥削含义，脚注则保留字面可能。
translation_notes:
  register: 采用现代、庄重而易懂的叙述。前半句调整为自然汉语语序，以“身下铺着”明确衣物与躺卧动作的关系；分号保留两个并列罪行的节奏。脚注标记均置于正文相应位置。
