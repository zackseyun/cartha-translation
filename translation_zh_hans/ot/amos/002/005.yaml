base_translation:
  language: en
  yaml_path: translation/ot/amos/002/005.yaml
  text: So I will send fire upon Judah[a], and it will devour the citadels of Jerusalem.
translation:
  language: zh_hans
  text: 我必向犹大降火；这火必吞灭耶路撒冷的宫殿[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“堡垒”或“城堡”。此希伯来词可指宫殿，也可指设防的建筑。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁלַּחְתִּי
  choice: 所以，我要降
  rationale: שׁלח的使役式在此意为“差遣、发出”。结合“火”，现代汉语用“降火”自然表达上帝使火临到；句首“所以”体现连接前文审判宣告的结果意味。
- source_word: אֵשׁ
  choice: 火
  rationale: 直译为“火”，既可指实际焚烧，也可作为毁灭性审判的意象；不限定其具体机制。
- source_word: בִּיהוּדָה
  choice: 在犹大
  rationale: 介词ב在此表示火临到并作用于犹大。“在犹大”保留原文较宽泛的空间关系，避免以“攻击犹大”过度解释敌对方向。
- source_word: וְאָכְלָה
  choice: 吞灭
  rationale: אכל本义为“吃”，以火为主语时表示吞噬、烧尽。“吞灭”保留生动意象，也符合现代汉语的庄重表达。
- source_word: אַרְמְנוֹת
  choice: 宫堡
  rationale: 该词可指宫殿，也可指设防的坚固建筑。“宫堡”兼顾宫殿性质与防御意味；因并非日常高频词，以脚注列出较熟悉的可能译法。
- source_word: יְרוּשָׁלִָם
  choice: 耶路撒冷
  rationale: 采用现代中文圣经及一般汉语通行地名。
theological_decisions:
- issue: 所宣告之火的性质
  choice: 直接保留上帝降火施行审判的图像，不说明火是纯粹实际的、比喻性的，还是借军事入侵而临到。
  alternative: 明确译作实际焚烧，或解释为入侵所带来的毁灭。
  rationale: 经文本身明确宣告上帝的审判，却没有限定其实施方式；译文因此保留这一神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“降火”符合先知审判宣告的汉语表达；“宫堡”略具书面色彩，但能较简洁地兼顾原词的宫殿与防御两层含义。
