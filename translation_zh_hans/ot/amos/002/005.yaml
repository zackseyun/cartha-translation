- from: 所以，我要降火在犹大，吞灭耶路撒冷的宫堡[a]。
  to: 我必向犹大降火；这火必吞灭耶路撒冷的宫殿[a]。
  rationale: “向犹大降火”自然表达审判性临到，而不把介词的语义过度限定为单纯地点或军事攻击。“这火必吞灭”明确保持原文火作为吞灭者的句法关系。“宫殿”是现代汉语中最自然的正文译法；脚注保留该词可能带有的设防、堡垒意味。
