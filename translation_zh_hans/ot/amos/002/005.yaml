  source_fidelity: 译文准确传达了第一人称的神圣审判、火的毁灭作用以及耶路撒冷相关建筑遭吞灭的意思。惟“我要降火在犹大，吞灭……”在现代汉语中主语衔接不够清晰，容易使“我”而非“火”成为“吞灭”的语法主语。
  naturalness: “宫堡”虽试图兼顾宫殿与防御性，却不是现代普通话中自然、通行的建筑名称，略显生造。以“宫殿”为正文，并在脚注说明其可能的设防／堡垒含义，更清楚自然。
  terminology: “犹大”“耶路撒冷”均为通行且适切的圣经地名。“降火”和“吞灭”保持先知宣告的庄重力度；将“火”明确重述为后一分句的主语，既忠于原文也避免歧义。
