  text: וְ/הִכְרַתִּ֥י שׁוֹפֵ֖ט מִ/קִּרְבָּ֑/הּ וְ/כָל שָׂרֶ֛י/הָ אֶהֱר֥וֹג עִמּ֖/וֹ אָמַ֥ר יְהוָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/amos/002/003.yaml
  text: And I will cut off the judge from her midst[a], and I will kill all her officials with him,” says Yahweh.
translation:
  language: zh_hans
  text: 雅威说：“我要从她中间剪除统治者[a]，并把她所有的官长和他一同杀死。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“审判者”。原文这个词既可指负责审判的人，在这里也可泛指治理国家的掌权者。
    reason: 保留 שׁוֹפֵט 在司法职分与广义统治权之间的词义可能。
lexical_decisions:
- source_word: וְהִכְרַתִּי
  choice: 我要……剪除
  rationale: 使役形的 כרת 表示彻底除去、剪除；“剪除”保留原文审判用语的力度，又不把含义过度限定为某一种毁灭方式。
- source_word: שׁוֹפֵט
  choice: 统治者
  rationale: 该词基本义为“审判者”，但在古代政治语境中也可指履行治理职能的掌权者；此处与“官长”并列，“统治者”较自然地表达最高治理者，同时用脚注保留“审判者”的可能。
- source_word: מִקִּרְבָּהּ
  choice: 从她中间
  rationale: 保留阴性单数后缀对摩押的拟人表达，并贴近“从其内部、当中”的空间与群体含义。
- source_word: וְכָל שָׂרֶיהָ
  choice: 她所有的官长
  rationale: שָׂר 可指首领、官员或贵族；“官长”兼顾政治领导层的含义和庄重的经文语体，又不必断定其为世袭王族。
- source_word: אֶהֱרֹג
  choice: 杀死
  rationale: 直接表达 הרג 的通常含义，清楚而不过度修饰。
- source_word: עִמּוֹ
  choice: 和他一同
  rationale: 阳性单数代词最自然地回指前面的“统治者”，表明众官长与他遭受同样的结局。
- source_word: אָמַר יְהוָה
  choice: 雅威说
  rationale: 将先知宣告公式简洁地译出，并以“雅威”呈现原文中的神圣名字 יהוה。
theological_decisions:
- issue: 神圣名字 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；“雅威”以现代汉语常见音译呈现该名字，而不以称号“主”替代。
- issue: שׁוֹפֵט 在此处是司法官还是治理者
  choice: 正文译作“统治者”，脚注保留“审判者”
  alternative: 正文译作“审判者”
  rationale: 该词的司法基本义真实存在，但在摩押政治领袖及其官长一同受审判的语境中，也可能泛指执政者。正文采用较宽的政治含义，脚注明确保留原文的词义张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“剪除”“官长”保留先知审判宣告的凝练力度；“从她中间”延续原文把摩押拟人化为女性的表达。
