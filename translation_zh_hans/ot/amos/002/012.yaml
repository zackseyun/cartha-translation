  text: וַ/תַּשְׁק֥וּ אֶת הַ/נְּזִרִ֖ים יָ֑יִן וְ/עַל הַ/נְּבִיאִים֙ צִוִּיתֶ֣ם לֵ/אמֹ֔ר לֹ֖א תִּנָּבְאֽוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/002/012.yaml
  text: But you made the Nazirites drink wine[a], and you commanded the prophets, saying[b], ‘Do not prophesy.’
translation:
  language: zh_hans
  text: 但你们却让拿细耳人喝酒[a]，又命令先知说：“不可说预言[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“分别为圣的人”。“拿细耳人”指许愿特别归给上帝的人，其誓愿包括禁酒。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“不要说预言”或“你们不得说预言”。
    reason: alternative_reading
lexical_decisions:
- source_word: וַתַּשְׁקוּ
  choice: 让……喝
  rationale: 使役式表达使某人饮用；“让……喝”在现代汉语中自然，也保留了百姓促使拿细耳人饮酒的责任。
- source_word: הַנְּזִרִים
  choice: 拿细耳人
  rationale: 保留这一特定的盟约文化身份，不把它泛化为一般的“奉献者”；脚注说明其分别为圣及禁酒背景。
- source_word: יָיִן
  choice: 酒
  rationale: 准确对应原文；在拿细耳人的背景下，饮酒正触犯其分别为圣的要求。
- source_word: וְעַל הַנְּבִיאִים צִוִּיתֶם
  choice: 又命令先知
  rationale: 介词עַל在此与“命令”连用，表示命令施加于先知；汉语无需逐字译出介词。
- source_word: לֵאמֹר
  choice: 说
  rationale: 自然引出直接引语，并保留原文的引语结构。
- source_word: לֹא תִּנָּבְאוּ
  choice: 不可说预言
  rationale: 否定未完成式在此表达强制性的禁令；“不可”既简洁又保留“不要／不得”的语气范围。
theological_decisions:
- issue: 如何译出נזירים所指的特殊奉献身份
  choice: 拿细耳人
  alternative: 分别为圣的人
  rationale: 采用专名可保留以色列制度和本节罪责的具体性；脚注补明其含义，避免读者误解。
- issue: 如何表达对先知的禁令
  choice: 不可说预言
  alternative: 不要说预言／你们不得说预言
  rationale: 原文可作为直接禁令理解；“不可”保留命令力度，同时不额外限定为恳求或法规措辞。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“但……却”凸显本节与上文上帝兴起拿细耳人和先知之恩相反；“拿细耳人”保留文化专名，并借脚注解释。所有脚注标记均置于相关正文之后。
