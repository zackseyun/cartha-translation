  text: וְ/אָבַ֤ד מָנוֹס֙ מִ/קָּ֔ל וְ/חָזָ֖ק לֹא יְאַמֵּ֣ץ כֹּח֑/וֹ וְ/גִבּ֖וֹר לֹא יְמַלֵּ֥ט נַפְשֽׁ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/002/014.yaml
  text: Flight will perish from the swift[a], and the strong will not strengthen his power[d][c][b], and the warrior will not save his life.
translation:
  language: zh_hans
  text: 敏捷的人必无路可逃[a]；强壮的人也无法使出自己的力量[b]；勇士也救不了自己的性命[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“逃脱必从敏捷的人那里消失”；也可译“敏捷的人必失去逃脱的机会”。
    reason: 说明原文以“逃脱”作主语的表达，并保留מָנוֹס可指逃跑或逃脱可能性的语义。
  - marker: b
    text: 或译“强壮的人也无法鼓起力量”；较直译为“也不能使自己的力量强健”。
    reason: יְאַמֵּץ כֹּחוֹ可较直译为使力量强健，也可按语境理解为调动、鼓起或发挥力量。
  - marker: c
    text: 原文为“救不了自己的נַפְשׁוֹ”；此处该词指“性命”或“自己”，并非特指“灵魂”。
    reason: 防止把נֶפֶשׁ在生死语境中的整体生命含义误解为专指非物质灵魂。
lexical_decisions:
- source_word: אָבַד מָנוֹס מִקָּל
  choice: 敏捷的人必无路可逃
  rationale: 原文直陈“逃路/逃脱必从敏捷者那里消失”。汉语用“无路可逃”自然表达逃脱可能性完全丧失，同时保留审判语境中的必然性。
- source_word: חָזָק
  choice: 强壮的人
  rationale: 形容词在此作名词使用，指有力量的人；译为“强壮的人”，并与下文更具军事色彩的“勇士”区分。
- source_word: לֹא יְאַמֵּץ כֹּחוֹ
  choice: 也使不上自己的力气
  rationale: 字面为“不使自己的力量强健/坚固”。在此审判语境中，重点是强者无法调动或发挥其力量；“使不上自己的力气”比直译更符合现代汉语，同时没有把含义扩展为力量本身消失。
- source_word: גִּבּוֹר
  choice: 勇士
  rationale: 该词在军事语境中常指英勇善战、有能力的战士；“勇士”简洁并符合本节由敏捷者、强者到战士的排列。
- source_word: לֹא יְמַלֵּט נַפְשׁוֹ
  choice: 也救不了自己的性命
  rationale: מלט 的使役义是使逃脱、搭救；נפש 在面临死亡的语境中指人的生命或本人，因此译作“救不了自己的性命”。
theological_decisions:
- issue: נפש 的含义
  choice: 性命
  alternative: 灵魂
  rationale: 这里谈的是战败和死亡危险中的保命，并非特指与身体相对的非物质“灵魂”；译作“性命”避免加入原文没有的二元人观。
translation_notes:
  register: 采用庄重、简洁的现代标准汉语。三个分句保持平行结构，以“敏捷的人—强壮的人—勇士”呈现原文递进，并以“必、也、也”传达预告审判时无人能凭个人能力逃脱的力度。
