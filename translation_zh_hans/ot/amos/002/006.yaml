  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה עַל שְׁלֹשָׁה֙ פִּשְׁעֵ֣י יִשְׂרָאֵ֔ל וְ/עַל אַרְבָּעָ֖ה לֹ֣א אֲשִׁיבֶ֑/נּוּ עַל מִכְרָ֤/ם בַּ/כֶּ֨סֶף֙ צַדִּ֔יק וְ/אֶבְי֖וֹן בַּ/עֲב֥וּר נַעֲלָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/002/006.yaml
  text: 'Thus says Yahweh: “For three transgressions of Israel[a], and for four, I will not revoke the punishment, because they sell the righteous for silver, and the needy for a pair of sandals.”'
translation:
  language: zh_hans
  text: 耶和华如此说：“以色列三番四次悖逆，我必不收回刑罚[a]；因为他们为银子卖了义人，为一双鞋卖了穷乏人。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译：“我必不将它收回”；“它”所指的是已经宣告的刑罚或审判。
    reason: 保留 לֹא אֲשִׁיבֶנּוּ 中宾语所指省略的原文特点，并说明正文的解释性补足。
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: 耶和华如此说
  rationale: 保留先知书中庄重的使者宣告公式，并以“耶和华”音译上帝的圣名。
- source_word: עַל שְׁלֹשָׁה פִּשְׁעֵי יִשְׂרָאֵל וְעַל אַרְבָּעָה
  choice: 以色列三番四次悖逆
  rationale: “三番四次”自然传达希伯来文递增数语，同时“悖逆”保留 פֶּשַׁע 的道德及盟约性分量。
- source_word: לֹא אֲשִׁיבֶנּוּ
  choice: 我必不收回刑罚
  rationale: 动词本义为“使之返回、收回”，宾语在希伯来文中仅以代词出现而所指省略；正文按上下文补出“刑罚”以便现代读者理解，并用脚注保留原文的省略性。
- source_word: מִכְרָם
  choice: 因为他们……卖了
  rationale: 将带后缀的不定式结构自然转化为表明审判缘由的汉语分句；完成体可表达其已犯之罪。
- source_word: בַּכֶּסֶף
  choice: 为银子
  rationale: 保留 כֶּסֶף 的具体字义，不泛化为“钱财”。
- source_word: צַדִּיק
  choice: 义人
  rationale: 既保留与“义”相关的词汇联系，也容纳此处“在司法上有理或无辜者”的含义。
- source_word: אֶבְיוֹן
  choice: 穷乏人
  rationale: 表达贫困且有所缺乏的人，比笼统的“穷人”更贴近原词。
- source_word: בַּעֲבוּר נַעֲלָיִם
  choice: 为一双鞋
  rationale: נַעֲלַיִם 是双数形式；“一双鞋”在现代汉语中自然，也显出交易代价之低微。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 采用中文圣经传统中广为人知的专名形式，使其保持为盟约之神的名字，而非以“主”替代。
- issue: 阿摩司反复句 לֹא אֲשִׁיבֶנּוּ 中省略宾语的解释
  choice: 我必不收回刑罚
  alternative: 我必不将它收回
  rationale: 上下文表明所收回的是已经宣告的惩罚或审判；正文补明“刑罚”以保证汉语清晰，但脚注说明原文仅作“它”，不把省略所带来的张力完全隐藏。
- issue: צַדִּיק 在社会司法语境中的范围
  choice: 义人
  alternative: 无辜的人／有理的人
  rationale: “义人”保存原词的神学及词汇关联，同时此处也可能特指司法上无辜或有理者，因此不在正文中缩窄其意义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“三番四次”保留先知宣告的修辞递进；两个“为……”构成平行句式，重现原文对社会不义的有力控诉。
