id: AMO.2.11
reference: Amos 2:11
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וָ/אָקִ֤ים מִ/בְּנֵי/כֶם֙ לִ/נְבִיאִ֔ים וּ/מִ/בַּחוּרֵי/כֶ֖ם לִ/נְזִרִ֑ים הַ/אַ֥ף אֵֽין זֹ֛את בְּנֵ֥י יִשְׂרָאֵ֖ל נְאֻם יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/002/011.yaml
  text: And I raised up some of your sons to be prophets[a], and some of your young men to be Nazirites. Is this not so[b], O sons of Israel? declares Yahweh.
translation:
  language: zh_hans
  text: 我从你们的儿子中兴起先知，也从你们的青年男子中兴起拿细耳人[a]。以色列子孙[b]啊，难道不是这样吗？这是雅威的宣告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “拿细耳人”指许了拿细耳愿、特别分别归给上帝的人；也可译作“献身者”。
    reason: cultural_note
  - marker: b
    text: 原文直译为“以色列的儿子们”，这里是对以色列民族的称呼。
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאָקִים
  choice: 我……兴起
  rationale: קום的使役形在此表示上帝使人起来承担特定职分；“兴起”既保留主动任命的意味，也符合现代中文的先知语体。
- source_word: מִבְּנֵיכֶם לִנְבִיאִים
  choice: 从你们的儿子中兴起先知
  rationale: 介词מִן表达从群体中选取的部分意义，לְ表示所担任的角色；此译保留原文“从……中”的结构及男性所指。
- source_word: וּמִבַּחוּרֵיכֶם
  choice: 也从你们的青年男子中
  rationale: בָּחוּר指正值青春壮年的男性；“青年男子”比泛指的“青年”更准确地体现原文性别，也避免误解为“被拣选的人”。
- source_word: לִנְזִרִים
  choice: 兴起拿细耳人
  rationale: נָזִיר在此是以色列中因拿细耳愿而特别归给上帝之人的专称；采用中文圣经传统中通行的音译，并以脚注说明。
- source_word: הַאַף אֵין זֹאת
  choice: 难道不是这样吗
  rationale: 这是期待肯定回答的反问；“难道不是这样吗”自然传达其强调和质询语气，不额外限定所指事件。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列子孙
  rationale: 直译为“以色列的儿子们”，实际作为对整个以色列民族的契约性称呼；“以色列子孙”兼顾原文形象和中文可读性。
- source_word: נְאֻם יְהוָה
  choice: 这是雅威的宣告
  rationale: נְאֻם יְהוָה是先知书中的权威宣告公式；“雅威”直接呈现四字神名，“宣告”保留该公式庄重、权威的性质。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文明确使用四字神名。采用“雅威”直接呈现其专名性质，不以称号“主”替代，也不把较晚形成的混合读音置入正文。
- issue: נְזִרִים应作专称还是描述性翻译
  choice: 拿细耳人
  alternative: 献身者；许拿细耳愿的人
  rationale: 此词指以色列中一种明确的奉献身份。保留专称可避免把它泛化为所有献身者，同时用脚注提供必要文化背景。
- issue: בְּנֵי יִשְׂרָאֵל的民族性称呼
  choice: 以色列子孙
  alternative: 以色列人；以色列的儿子们
  rationale: 该短语既有字面的男性复数形式，又在呼语中指向整个民族。“以色列子孙”保留血缘与契约称谓的色彩，而脚注说明其实际所指。
translation_notes:
  register: 采用现代、庄重而易懂的先知书语体。平行分句重复“兴起”，以呈现希伯来文结构和上帝主动设立两类人的重点；用“啊”清楚标示呼语，并以反问保留原文要求听众承认事实的力度。
