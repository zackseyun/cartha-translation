  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה עַל שְׁלֹשָׁה֙ פִּשְׁעֵ֣י יְהוּדָ֔ה וְ/עַל אַרְבָּעָ֖ה לֹ֣א אֲשִׁיבֶ֑/נּוּ עַֽל מָאֳסָ֞/ם אֶת תּוֹרַ֣ת יְהוָ֗ה וְ/חֻקָּי/ו֙ לֹ֣א שָׁמָ֔רוּ וַ/יַּתְעוּ/ם֙ כִּזְבֵי/הֶ֔ם אֲשֶׁר הָלְכ֥וּ אֲבוֹתָ֖/ם אַחֲרֵי/הֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/002/004.yaml
  text: 'Thus says Yahweh: “For three transgressions of Judah[a], and for four, I will not turn it back, because they have rejected the law of Yahweh and have not kept his statutes; and their lies have led them astray[c][b], after which their fathers walked.”'
translation:
  language: zh_hans
  text: 耶和华如此说：“犹大三番四次悖逆，我必不收回[a]；因为他们厌弃耶和华的律法[b]，不遵守他的律例。他们的虚妄[c]使他们走迷了；他们的祖先也曾随从这些虚妄。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译近于“我必不使它返回”或“我必不收回它”；“它”没有明说，可能指已经宣布的判罚。
    reason: 保留审判公式中宾语的省略与可能译法。
  - marker: b
    text: “律法”也可译作“教导”或“训诲”。
    reason: 说明תּוֹרָה在此处可能具有比法规更宽的语义范围。
  - marker: c
    text: “他们的虚妄”可能特指假神、偶像或虚妄的敬拜，就是他们祖先所随从的。
    reason: 保留כִּזְבֵיהֶם在先知语境中的潜在指涉，同时不改动正文的字面广度。
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名“耶和华”呈现四字神名，而不以“主”这一称号代替。
- source_word: פִּשְׁעֵי
  choice: 悖逆
  rationale: 该词指严重的越界与反叛；“悖逆”既保留盟约关系中的反叛色彩，也适合阿摩司书反复出现的宣判格式。
- source_word: עַל שְׁלֹשָׁה ... וְעַל אַרְבָּעָה
  choice: 三番四次
  rationale: 这是递增数目的修辞格式，表达罪行接连累积；中文“四次”不宜被误读为精确计数，故采用自然的成语式表达。
- source_word: לֹא אֲשִׁיבֶנּוּ
  choice: 我必不收回判罚
  rationale: שוב与宾语后缀构成省略性表达，意为不撤回已经宣布的审判。正文补出“判罚”以使现代中文通顺，同时脚注说明原文宾语未明说。
- source_word: מָאֳסָם
  choice: 他们厌弃
  rationale: “厌弃”比一般的“拒绝”更能体现该动词所含的蔑弃与排斥意味，又保持庄重自然。
- source_word: תּוֹרַת יְהוָה
  choice: 耶和华的律法
  rationale: תּוֹרָה在此处具有盟约规范的语境，“律法”清楚且为中文读者熟悉；其较宽泛的“教导、训诲”义保留在脚注中。
- source_word: חֻקָּיו
  choice: 他的律例
  rationale: “律例”是法律与盟约语境中自然、庄重的对应词，并与“律法”有所区分。
- source_word: שָׁמָרוּ
  choice: 遵守
  rationale: 在规范性命令的语境中，שמר表示谨守实行；中文“遵守”比字面的“守护”更自然。
- source_word: וַיַּתְעוּם
  choice: 使他们走迷了
  rationale: 希伯来语使役形式表示使人偏离正路；“使……走迷”保留行路意象及道德、宗教层面的误导。
- source_word: כִּזְבֵיהֶם
  choice: 他们的虚假
  rationale: 字面义为“虚假、谎言”。“虚假”既保留抽象性，也容许其在先知语境中暗指虚假的神明或敬拜对象，而不在正文中提前限定。
- source_word: אֲשֶׁר הָלְכוּ אֲבוֹתָם אַחֲרֵיהֶם
  choice: 他们的祖先也曾随从这些虚假
  rationale: “随从”自然传达“走在……之后”的惯用意义。补出“这些虚假”以明确关系代词的所指，并保留父辈与当代人延续同一路径的联系。
theological_decisions:
- issue: לֹא אֲשִׁיבֶנּוּ中未明说宾语的审判公式
  choice: 正文译作“我必不收回判罚”，并以脚注交代原文的省略性
  alternative: 我必不使它返回；我必不撤销；我必不转意
  rationale: 现代中文若直译“它”会因缺少明确先行词而晦涩。上下文所指最可能是已宣布的判罚，但原文没有明说，因此正文采取最低限度的补足，并在脚注保存形式上的含混。
- issue: כִּזְבֵיהֶם的具体所指
  choice: 正文译为“他们的虚假”
  alternative: 他们的假神；他们的偶像；他们的谎言
  rationale: 该词本义是虚假或谎言，在先知文献中可能转指假神、偶像或虚妄的敬拜。正文不把潜在所指定死，脚注提示其宗教语境中的可能含义。
- issue: תּוֹרָה的语义范围
  choice: 正文译为“律法”
  alternative: 教导；训诲
  rationale: 犹大受责备的语境包含盟约义务，适合用“律法”；但该词并不限于成文法规，所以脚注保留“教导、训诲”的语义可能。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“三番四次”自然呈现希伯来语递增数字公式；“判罚”避免口语化，又比“刑罚”略宽。正文所有脚注标记均依次出现，并将祖先随从虚假的关系明确表达。
