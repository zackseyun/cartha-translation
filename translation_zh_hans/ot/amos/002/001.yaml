base_translation:
  language: en
  yaml_path: translation/ot/amos/002/001.yaml
  text: 'Thus says Yahweh: “For three transgressions of Moab[a], and for four, I will not revoke it[b], because he burned the bones of the king of Edom to lime.”'
translation:
  language: zh_hans
  text: 雅威如此说：“因摩押三番悖逆，甚至四番，我必不撤回[a]；因为它把以东王的骸骨烧成石灰[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“我必不使它返回”；也可理解为“我必不撤销已经宣告的审判”。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“烧作石灰”或“烧成灰泥”；希伯来文表示骸骨被彻底焚烧，化为石灰。
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: 雅威如此说
  rationale: 保留先知传信的固定公式；将神名 יְהוָה 音译为“雅威”，与原文直接使用圣约之名相应。
- source_word: עַל שְׁלֹשָׁה פִּשְׁעֵי מוֹאָב וְעַל אַרְבָּעָה
  choice: 摩押三次悖逆，甚至四次
  rationale: 保留阿摩司书“三次……四次”的递进数语格式；“悖逆”体现 פֶּשַׁע 所含的反叛和道德过犯之意。
- source_word: לֹא אֲשִׁיבֶנּוּ
  choice: 我必不撤回
  rationale: 希伯来文直义接近“我不使它返回”；“撤回”在现代汉语中自然表达不撤销已宣告之审判，同时正文不擅自补明原文未明说的宾语。
- source_word: עַל שָׂרְפוֹ
  choice: 因为摩押……焚烧
  rationale: עַל 在此引出审判的缘由。动词不定式所带后缀为阳性单数，原文将摩押作为一个整体人格化；汉语重复“摩押”比使用“他”更清楚自然。
- source_word: עַצְמוֹת מֶלֶךְ אֱדוֹם
  choice: 以东王的骸骨
  rationale: 准确保留原文所属结构及遭亵渎的对象；“骸骨”适合王者遗骨的庄重语境。
- source_word: לַשִּׂיד
  choice: 烧成石灰
  rationale: שִׂיד 指石灰，也可用于灰泥，并非泛指灰烬；“烧成石灰”清楚表达骸骨被彻底焚化的结果。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；音译“雅威”保留其作为上帝圣约之名的性质，而不以称号替代。
- issue: לֹא אֲשִׁיבֶנּוּ 所指为何
  choice: 正文保留“我必不撤回”的含蓄表达
  alternative: 我必不撤回对摩押的刑罚
  rationale: 原文有阳性单数宾语后缀，却未在本句明确说出其所指；上下文通常理解为已宣告的审判或刑罚，但正文不将这一解释直接写死。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“三次……甚至四次”保留先知文体的递进节奏；分号划分判决宣告与判决缘由。所有脚注标记均置于对应词句之后。
