  text: הַ/שֹּׁאֲפִ֤ים עַל עֲפַר אֶ֨רֶץ֙ בְּ/רֹ֣אשׁ דַּלִּ֔ים וְ/דֶ֥רֶךְ עֲנָוִ֖ים יַטּ֑וּ וְ/אִ֣ישׁ וְ/אָבִ֗י/ו יֵֽלְכוּ֙ אֶל הַֽ/נַּעֲרָ֔ה לְמַ֥עַן חַלֵּ֖ל אֶת שֵׁ֥ם קָדְשִֽׁ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/002/007.yaml
  text: those who trample the head of the poor into the dust of the earth[a], and turn aside the way of the humble; and a man and his father go in to the same girl[d][c][b], so as to profane my holy name.
translation:
  language: zh_hans
  text: 他们把穷人的头踩进地上的尘土里[a]，扭曲困苦人的道路[b]；一个人和他的父亲都与同一个年轻女子同房[c][d]，以致亵渎我的圣名。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们贪求穷人头上地上的尘土。”原文动词更直译可指“急切喘求”，但在这里很可能描写残酷的压迫。
    reason: lexical_alternative
  - marker: b
    text: “困苦人”也可译作“谦卑人”或“温顺人”；整句也可译作“把困苦人的路推到一边”。
    reason: lexical_alternative
  - marker: c
    text: 原文直译为“到那年轻女子那里去”，在这里是性行为的委婉说法。“年轻女子”也可译作“少女”。
    reason: lexical_alternative
  - marker: d
    text: 本节没有明确说这名年轻女子是宗教妓女、女奴或婢女，尽管有些解释根据上下文推断她受到这类剥削。
    reason: alternative_reading
lexical_decisions:
- source_word: הַשֹּׁאֲפִים עַל עֲפַר אֶרֶץ בְּרֹאשׁ דַּלִּים
  choice: 把穷人的头践踏在地上的尘土中
  rationale: שׁאף通常可表示“喘息、渴求”，但在这里与穷人的头和地上尘土相连，语境明显指残酷的压迫与羞辱。“践踏”在现代汉语中自然传达这一含义，同时保留“头”和“尘土”的具体意象；较直译的理解列入脚注。
- source_word: וְדֶרֶךְ עֲנָוִים יַטּוּ
  choice: 使困苦人的道路偏离正轨
  rationale: דרך保留“道路”的比喻，נטה的使役形式译为“使……偏离正轨”。ענוים兼有困苦、卑微、谦和等含义；此处社会压迫语境中选“困苦人”，并在脚注保留其他可能。
- source_word: וְאִישׁ וְאָבִיו
  choice: 男人和他的父亲都
  rationale: 忠实保留单数结构，表明父子二人牵涉同一桩性方面的罪行；“都”只说明两人均有此行为，不暗示同时发生。
- source_word: יֵלְכוּ אֶל הַנַּעֲרָה
  choice: 与同一个少女同房
  rationale: “到……那里去”在本句中是性行为的委婉语，译作“同房”既明确又庄重。נערה可指少女或年轻女子；“少女”保留其年轻、易受伤害的意味。“同一个”将定冠词在上下文中所指的共同对象自然表达出来。
- source_word: לְמַעַן חַלֵּל
  choice: 以致亵渎
  rationale: למען在此可表达目的或结果。“以致”保留行为与亵渎之间的紧密联系，而不武断判定他们主观上以亵渎为目的。
- source_word: אֶת שֵׁם קָדְשִׁי
  choice: 我的圣名
  rationale: 这是现代汉语中自然、庄重的表达，准确保留原文“我神圣的名”的神学分量。
theological_decisions:
- issue: 父子与同一名נערה发生关系的具体罪行性质
  choice: 正文只说明男人和他的父亲都与同一个少女发生性关系，并将此事与亵渎上帝的圣名相连。
  alternative: 这名少女可能是女奴、婢女或宗教仪式中的妓女；也可能重点在于近乎乱伦的家族羞辱。
  rationale: 希伯来文本没有明确说明她的身份，也没有明说宗教卖淫、奴役或正式的乱伦关系，因此不在正文中加入这些解释。
- issue: למען所表达的是目的还是结果
  choice: 译作“以致”，侧重该行为造成亵渎圣名的结果。
  alternative: 也可译作“为要”，理解为目的。
  rationale: 原文容许目的或结果色彩；“以致”避免声称行为人主观上刻意追求亵渎，同时仍保留先知所指出的神学后果。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“践踏”“偏离正轨”“同房”“亵渎我的圣名”兼顾先知谴责的力度与公共诵读的得体性。正文不补入原文未明说的少女身份或宗教背景，并用脚注保留首句动词、ענוים及性委婉语的真实歧义。
