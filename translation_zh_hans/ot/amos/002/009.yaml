source:
  edition: WLC
  text: וְ/אָ֨נֹכִ֜י הִשְׁמַ֤דְתִּי אֶת הָֽ/אֱמֹרִי֙ מִ/פְּנֵי/הֶ֔ם אֲשֶׁ֨ר כְּ/גֹ֤בַהּ אֲרָזִים֙ גָּבְה֔/וֹ וְ/חָסֹ֥ן ה֖וּא כָּֽ/אַלּוֹנִ֑ים וָ/אַשְׁמִ֤יד פִּרְי/וֹ֙ מִ/מַּ֔עַל וְ/שָׁרָשָׁ֖י/ו מִ/תָּֽחַת־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/002/009.yaml
  text: Yet I destroyed the Amorite before them[a], whose height was like the height of cedars, and he was strong like the oaks[b]; I destroyed his fruit above and his roots beneath.
translation:
  language: zh_hans
  text: 然而，是我从他们面前除灭了亚摩利人[a]；他高大如香柏树，强壮如橡树。我毁灭了他上面的果子和下面的根[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “亚摩利人”在希伯来文中是单数形式，在这里作为集合称谓，指整个亚摩利族。
    reason: lexical_alternative
  - marker: b
    text: “果子”和“根”延续树木的比喻，表示从上到下彻底毁灭。
    reason: cultural_note
lexical_decisions:
- source_word: וְאָנֹכִי
  choice: 然而，是我
  rationale: 连接词与强调代词共同带出与上下文相对照的强调；“然而，是我”既保留转折，也突出上帝亲自施行此事。
- source_word: הִשְׁמַדְתִּי
  choice: 除灭了
  rationale: 使役形表达使之毁灭、彻底消除；“除灭”力度明确，又符合庄重的现代汉语。
- source_word: הָאֱמֹרִי
  choice: 亚摩利人
  rationale: 希伯来文用单数定冠词形式统称整个族群。汉语“亚摩利人”本身可作集合称谓，并在后文保留单数拟人化代词。
- source_word: מִפְּנֵיהֶם
  choice: 从他们面前
  rationale: 保留希伯来文空间意象，表示上帝将亚摩利人从以色列人面前除去。
- source_word: אֲשֶׁר כְּגֹבַהּ אֲרָזִים גָּבְהוֹ
  choice: 他高大如香柏树
  rationale: 自然传达其高度如香柏树的比较；汉语无需机械重复“高度”，仍保留原意和树木意象。
- source_word: וְחָסֹן הוּא כָּאַלּוֹנִים
  choice: 强壮如橡树
  rationale: חָסֹן表示强健、坚实；אַלּוֹנִים在此最自然地译作“橡树”，与香柏树构成并列形象。
- source_word: וָאַשְׁמִיד
  choice: 我毁灭了
  rationale: 再次表达毁灭，延续原文的重复与修辞力度；此处配合果子和根的意象，用“毁灭”自然明确。
- source_word: פִּרְיוֹ מִמַּעַל
  choice: 他上面的果子
  rationale: 保留树木隐喻中的“果子”，不在正文中直接解释为后代或成果。
- source_word: וְשָׁרָשָׁיו מִתָּחַת
  choice: 下面的根
  rationale: 与“上面的果子”形成上下对应，表达从顶部到底部的彻底毁灭。
theological_decisions:
- issue: “亚摩利人”的集合单数及其拟人化意象
  choice: 用“亚摩利人”作为集合称谓，后文保留“他／他的”所体现的单数拟人化。
  alternative: 全句改用复数意义表达，如“他们高大……他们的果子和根”。
  rationale: 原文以单数形式把亚摩利族塑造成一棵高大强壮的树。保留单数代词可维持这一鲜明修辞，同时脚注说明其集合用法，避免误解为某一个人。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。以“然而，是我”体现强调和转折；保留“他”的集合单数拟人化及果子、根的树木意象，并用脚注澄清。
