base_translation:
  language: en
  yaml_path: translation/ot/amos/002/002.yaml
  text: So I will send fire upon Moab[a], and it will consume the citadels of Kerioth; and Moab will die amid tumult, amid shouting[c][b], amid the sound of a trumpet.
translation:
  language: zh_hans
  text: 所以，我要向摩押降下火来；火必烧毁加略的堡垒[a]。摩押必在喧嚣中死去，在呐喊中，在号角声中。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “加略的堡垒”也可译作“加略的宫殿”或“加略的城堡”；“加略”也可能意为“众城”，但这里更可能是地名。
    reason: lexical_alternative_and_alternative_reading
lexical_decisions:
- source_word: וְשִׁלַּחְתִּי
  choice: 所以，我要降
  rationale: 连接前文连续的审判宣告；“所以”体现承接和结果关系，“我要”保留上帝亲自施行审判的第一人称表达。与“火”搭配时，“降火”比机械直译“发送火”更符合现代汉语。
- source_word: אֵשׁ בְּמוֹאָב
  choice: 火在摩押
  rationale: ב在这里表示火所临到、攻击的对象或范围；整句译作“降火在摩押”，既保留介词意象，也自然表达敌对性的审判。
- source_word: וְאָכְלָה
  choice: 烧毁
  rationale: 该动词以“火”为主语，字面有“吞吃”之意；“烧毁”在汉语中自然呈现火焰彻底毁坏的结果，同时保留先知审判意象。
- source_word: אַרְמְנוֹת
  choice: 堡垒
  rationale: 此词可指宫殿、城堡或设防的权贵建筑；“堡垒”突出防御性，符合战争审判语境。其他可能译法收入脚注。
- source_word: הַקְּרִיּוֹת
  choice: 加略
  rationale: 按地名Kerioth理解，较符合摩押城邑的语境；将其理解为普通名词“众城”仍有可能，故列入脚注。
- source_word: וּמֵת
  choice: 摩押必死
  rationale: 完成式在先知预告的连续语境中表达确定的将来事件；以国家“摩押”为拟人化主语，保留原文强烈而直接的“死”。
- source_word: בְּשָׁאוֹן
  choice: 在喧嚷中
  rationale: 该词表示喧嚣、骚动或混乱的响声；“喧嚷”兼顾声音与动乱场景。
- source_word: בִּתְרוּעָה
  choice: 在呐喊中
  rationale: תְּרוּעָה可表示呼喊、战斗呐喊或号声。下句已明确提到号角，因此正文采用“呐喊”，并以脚注保留“战斗的喊声”这一更具体的可能。
- source_word: בְּקוֹל שׁוֹפָר
  choice: 在号角声中
  rationale: שׁוֹפָר指用于战争、集会等场合的角号，通常为羊角号；“号角声”是清楚、庄重且自然的现代汉语表达。
theological_decisions:
- issue: 摩押作为“死”的主语
  choice: 保留国家拟人化：“摩押必死”
  alternative: “摩押必灭亡”
  rationale: 原文直接使用“死”而非一般性的“灭亡”。保留拟人化可传达审判宣告的力度，也不额外界定这究竟专指居民、政权还是国家整体。
translation_notes:
  register: 采用现代、庄重而易懂的先知宣告体。三个以ב开头的声响/情境短语在汉语中整合为“在喧嚷中，在呐喊和号角声中”，保留层层推进的战争声景，同时避免生硬重复。所有脚注标记均置于相关正文词组之后。
