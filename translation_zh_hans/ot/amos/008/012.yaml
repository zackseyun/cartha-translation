id: AMO.8.12
reference: Amos 8:12
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/נָעוּ֙ מִ/יָּ֣ם עַד יָ֔ם וּ/מִ/צָּפ֖וֹן וְ/עַד מִזְרָ֑ח יְשֽׁוֹטְט֛וּ לְ/בַקֵּ֥שׁ אֶת דְּבַר יְהוָ֖ה וְ/לֹ֥א יִמְצָֽאוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/008/012.yaml
  text: They will wander from sea to sea[a], and from north to east; they will roam about seeking the word of Yahweh[b], but they will not find it.
translation:
  language: zh_hans
  text: 他们必从这海漂泊到那海[a]，从北方到东方，四处奔走，寻求耶和华的话[b]，却寻不着。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “漂泊”所译的希伯来语也可表示“摇晃”或“踉跄”。本节描写他们从一处到另一处寻索。
    reason: lexical_alternative
  - marker: b
    text: “耶和华的话”在这里可指来自耶和华的信息或启示。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָעוּ
  choice: 漂泊
  rationale: נוּעַ可表示摇摆、踉跄或漂泊；本节描写人跨越各地绝望寻索，“漂泊”既保留无定向、不得安顿之感，也不强行引入醉酒意象。
- source_word: מִיָּם עַד יָם
  choice: 从这海到那海
  rationale: 贴近希伯来语“从海到海”的地理表达；汉语用“这海……那海”自然传达由一海至另一海的广阔范围，而不擅自确定具体海域。
- source_word: וּמִצָּפוֹן וְעַד מִזְרָח
  choice: 从北方到东方
  rationale: מִזְרָח本义与日出之地相关，通常指东方；直译方向次序，不把它改写成完整四方或推定路线。
- source_word: יְשׁוֹטְטוּ
  choice: 四处奔走
  rationale: 该词表示来回巡行、奔走；“四处奔走”自然表现急切而反复的搜寻，并保留“来回奔走”这一可选理解。
- source_word: לְבַקֵּשׁ
  choice: 寻求
  rationale: 保留不定式所表达的目的，即奔走是为了寻找神的话。
- source_word: דְּבַר יְהוָה
  choice: 耶和华的话
  rationale: דָּבָר可指话语、信息或启示；先保留先知传统中的形式表达“……的话”，脚注说明其语境含义。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者最熟悉的专名“耶和华”呈现四字神名，避免在正文中以称号替代专名。
- source_word: וְלֹא יִמְצָאוּ
  choice: 却寻不着
  rationale: 希伯来语以连接词引出结果；汉语“却”清楚体现期待与结局之间的反差，宾语由上文自然承接，无须重复。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用神的专名。正文采用现代中文基督教语境中辨识度最高且庄重的“耶和华”；“雅威”较接近学界常见的拟音，但中文公众接受度较低。
- issue: דְּבַר יְהוָה 的含义范围
  choice: 耶和华的话
  alternative: 耶和华的信息／从耶和华而来的启示
  rationale: 保留原文“话”的开放性及先知用语，不把它限缩为某一种传达形式；脚注交代此处可指来自神的信息或启示。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“从这海到那海”保留原文宽泛的地理意象；“四处奔走”传达反复、急切搜寻的动态。正文中的[a]、[b]均与脚注对应。
