  yaml_path: translation/ot/amos/008/004.yaml
  text: Hear this[a], you who trample the needy and bring the poor of the land to an end,
translation:
  language: zh_hans
  text: 你们这些践踏穷乏人、要使这地的困苦人消失的人，要听这话！
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שִׁמְעוּ זֹאת
  choice: 要听这话
  rationale: 复数命令式加指示代词，构成先知直接而郑重的传召；中文用“要听这话”既自然，也保留命令语气。
- source_word: הַשֹּׁאֲפִים
  choice: 践踏
  rationale: שׁאף 的分词在此描写贪婪而暴烈的压迫，可有“追逐、喘着气扑向、吞噬”等意象；正文用“践踏”清楚表达社会经济压迫，其他可能义项保留在脚注。
- source_word: אֶבְיוֹן
  choice: 穷乏人
  rationale: 指缺乏生活资源、需要援助的人；“穷乏人”与下句“贫苦人”略作区分，并符合先知文学的庄重语体。
- source_word: וְלַשְׁבִּית
  choice: 要使……绝迹
  rationale: שבת 的使役式不定词表达“使停止、使不复存在”；“使……绝迹”在中文中简洁有力，保留其使役和彻底排除的意味。
- source_word: ענוי אָרֶץ
  choice: 这地的贫苦人
  rationale: 所指是在压迫下卑微困苦的人；אָֽרֶץ 在语境中指本地社会共同体，译作“这地”比“全地”或“地球”更贴切。
