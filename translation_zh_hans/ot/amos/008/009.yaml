base_translation:
  language: en
  yaml_path: translation/ot/amos/008/009.yaml
  text: And it shall happen in that day[a], declares the Lord GOD, that I will make the sun go down at noon, and I will darken the earth in broad daylight.
translation:
  language: zh_hans
  text: '到那日，必有这样的事发生——这是主耶和华的宣告：


    “我要使太阳在正午落下，


    使大地[a]在白昼变暗。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“这地”。希伯来语 אֶרֶץ 既可泛指“大地”，也可指某一特定地域。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה בַּיּוֹם הַהוּא
  choice: 到那日
  rationale: 这是先知话语中常见的未来时间表达；“到那日”自然、庄重，也保留其预告性质。句子的“必发生”之意由随后直接引出的宣告体现，无须另加生硬的套语。
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: 主耶和华宣告
  rationale: נְאֻם 是先知书中的神谕宣告公式；译作“宣告”简洁自然。复合称号 אֲדֹנָי יְהוִה 译作中文圣经传统中清楚可辨的“主耶和华”，避免译成重复的“主主”。
- source_word: וְהֵבֵאתִי הַשֶּׁמֶשׁ
  choice: 我要使太阳……落下
  rationale: 使役形态配合“太阳”表示使太阳下落或落山；此译法保留上帝主动施行的含义，并避免将其弱化为太阳自行落下。
- source_word: בַּצָּהֳרָיִם
  choice: 在正午
  rationale: 准确表达“中午、正午”，并突出太阳在本不应落下的时刻沉落这一反常景象。
- source_word: וְהַחֲשַׁכְתִּי
  choice: 使……变暗
  rationale: 原词为使役形态，表示使某处陷入黑暗；“使……变暗”符合现代汉语表达。
- source_word: לָאָרֶץ
  choice: 大地
  rationale: אֶרֶץ 既可指整个大地，也可指特定地域。上下文的太阳异象支持“大地”，但“这地”仍是可能读法，故加注保留歧义。
- source_word: בְּיוֹם אוֹר
  choice: 在光天化日之时
  rationale: 字面为“在光明的日子/白昼中”，强调明亮白昼突然变暗的逆转；“光天化日之时”在现代汉语中有力度，也保留“白昼正明”的反差。
theological_decisions:
- issue: 复合神名 אֲדֹנָי יְהוִה 的译法
  choice: 主耶和华
  alternative: 主雅威
  rationale: 原文同时使用“主”和四字神名。正文采用中文读者熟悉且能区分两者的“主耶和华”；“主雅威”虽更接近一种现代学术拟音，但在普通现代汉语中辨识度较低。此处不把神名泛化为单独的“主”。
- issue: 黑暗景象的范围
  choice: 大地
  alternative: 这地
  rationale: 正午太阳下落带有宇宙性意象，支持较广的“大地”；然而 אֶרֶץ 也可指以色列地或某一地域，因此不把范围绝对化，并以脚注保留另一读法。
translation_notes:
  register: 采用现代、庄重而易懂的先知宣告语体。诗行按两个相应的神圣行动排列；“正午”与“光天化日”共同强化白昼骤暗的震撼反差。
