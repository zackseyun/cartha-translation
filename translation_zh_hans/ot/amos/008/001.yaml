base_translation:
  language: en
  yaml_path: translation/ot/amos/008/001.yaml
  text: 'This is what the Lord GOD showed me: behold[a], a basket of summer fruit.'
translation:
  language: zh_hans
  text: 这是主耶和华使我看见的：看哪，有一篮夏果[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“成熟的果子”。原文作“夏果”，并与下一节的“结局”构成近音文字游戏。
    reason: 说明词义备选，并保存本节为下一节文字游戏所作的铺垫。
lexical_decisions:
- source_word: כֹּה
  choice: 这景象
  rationale: 在异象报告的引介语中承接后文所见之物；与“使我看见”连用，现代汉语自然，并保留指示意味。
- source_word: הִרְאַנִי
  choice: 使我看见
  rationale: ראה的使役式，直译为“使我看见”；此处保留先知领受异象的表达。
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: 分别表达אֲדֹנָי的称号“主”和四字神名יְהוִה；避免译成不自然的“主上主”。
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留异象中事物突然呈现的指示性和先知文体的庄重语气；汉语省去连接词“和”更自然。
- source_word: כְּלוּב
  choice: 篮
  rationale: 该词可指笼或篮；与夏果搭配时，盛果实的篮子最合语境。
- source_word: קָיִץ
  choice: 夏果
  rationale: 指夏季收获、已经成熟的果实；“夏果”保留原词形式，也为下一节קֵץ“结局”的近音文字游戏留下空间。
theological_decisions:
- issue: 复合神名אֲדֹנָי יְהוִה的译法
  choice: 主耶和华
  alternative: 主上主；主雅威
  rationale: “主耶和华”既区分称号与专名，也符合现代中文圣经语域；原文确实使用四字神名，不将其两个成分合并或重复为同一称号。
translation_notes:
  register: 采用自然而庄重的现代标准汉语。“看哪”保留先知异象叙述的鲜明指示语气；“夏果”虽较凝练，却易懂，并能最大限度保留希伯来文的文字游戏。
