base_translation:
  language: en
  yaml_path: translation/ot/amos/008/003.yaml
  text: And the songs of the palace will become wailing in that day[a], declares the Lord GOD. Many will be the corpses[b]; in every place they will throw them out—silence!
translation:
  language: zh_hans
  text: “到那日，宫殿里的歌声必变为哀号[a]。”主耶和华宣告说，“尸体很多；到处都有人把尸体抛弃。肃静！[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“圣殿里的歌声必变为哀号。”希伯来语“הֵיכָל”既可指“宫殿”，也可指“圣殿”。
    reason: alternative_reading
  - marker: b
    text: 或译：“住声！”“别出声！”结尾的希伯来语“הָס”是突然发出的止声命令，可能表达面对惨状时的震骇或恐惧。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵילִילוּ שִׁירוֹת
  choice: 歌声必变为哀号
  rationale: ילל的使役式与复数主语“歌”相连，描绘歌声转成哀号；如此译法既保留意象，也符合现代汉语表达。
- source_word: הֵיכָל
  choice: 宫殿
  rationale: 该词可指宫殿或圣殿；本章审判社会权贵与公共生活的语境使“宫殿”较为贴切，同时在脚注保留“圣殿”这一真实歧义。
- source_word: בַּיּוֹם הַהוּא
  choice: 到那日
  rationale: 保留先知书常见的时间宣告语气，同时比生硬的“在那日”更符合现代汉语。
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: 主耶和华宣告说
  rationale: נְאֻם是先知性宣告套语；“主耶和华”对应复合称号אֲדֹנָי יְהוִה，并保留神的名字。
- source_word: רַב הַפֶּגֶר
  choice: 尸横遍地
  rationale: 原文直意为“尸体众多”。汉语成语式表达凝练、自然，也传达大量尸体散布各处的惨状。
- source_word: בְּכָל מָקוֹם הִשְׁלִיךְ
  choice: 人把尸体四处抛弃
  rationale: 动词虽为第三人称阳性单数，却可作无人称或集合性用法；“人”不指定具体行动者，“尸体”则从上文补出，以满足汉语语法。
- source_word: הָס
  choice: 肃静！
  rationale: 这是突兀而强烈的止声语，置于结尾保留原文因死亡惨状而产生的震骇与沉寂。
theological_decisions:
- issue: 复合神名 אֲדֹנָי יְהוִה 的译法
  choice: 主耶和华
  alternative: 主上帝
  rationale: “主耶和华”在简体中文中清楚区分称号אֲדֹנָי与立约之名יהוה，也避免把专名泛化为称谓。
- issue: הֵיכָל所指的场所
  choice: 正文译作“宫殿”
  alternative: 圣殿
  rationale: 词义与语境无法彻底排除任何一项；正文按社会审判语境采用“宫殿”，脚注明确保留“圣殿”，不将歧义作教义化处理。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。以“必变为哀号”“宣告说”保留先知性语体；末句短促突兀，重现原文的震撼效果。正文中的[a]、[b]均与脚注对应。
