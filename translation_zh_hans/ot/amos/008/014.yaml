- from: 那些指着撒马利亚的罪孽[a]起誓，并说：“但哪，你的神永活[b]！”又说：“别是巴之道永存[c]！”他们必倒下，再也不能起来。
  to: 那些指着撒马利亚的罪孽[a]起誓，并说：“但啊，你的神活着！”又说：“别是巴的路活着！”的人，必倒下，再也不能起来。
  rationale: 修订统一两处誓言公式对חֵי的翻译为“活着”，避免加入原文未明说的“永恒”含义，并保留第二句把“路”当作可起誓对象的反常表达。将“但哪”改为“但啊”，使呼语在现代汉语中更自然。脚注保留“但的神”以及“别是巴的路”的不同理解。
