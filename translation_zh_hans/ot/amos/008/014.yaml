  text: הַ/נִּשְׁבָּעִים֙ בְּ/אַשְׁמַ֣ת שֹֽׁמְר֔וֹן וְ/אָמְר֗וּ חֵ֤י אֱלֹהֶ֨י/ךָ֙ דָּ֔ן וְ/חֵ֖י דֶּ֣רֶךְ בְּאֵֽר שָׁ֑בַע וְ/נָפְל֖וּ וְ/לֹא יָק֥וּמוּ עֽוֹד־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/amos/008/014.yaml
  text: Those who swear by the guilt of Samaria and say[a], ‘As your god, Dan, lives,’ and[c][b], ‘As the way of Beer-sheba lives,’ will fall and never rise again.
translation:
  language: zh_hans
  text: 那些指着撒马利亚的罪孽[a]起誓，并说：“但啊，你的神活着！”又说：“别是巴的路活着！”的人，必倒下，再也不能起来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “罪孽”也可译作“罪”；有人认为这里指与撒马利亚有关的偶像或神祇。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנִּשְׁבָּעִים
  choice: 那些……起誓
  rationale: 将实词化分词译为现代汉语关系结构，明确这是将要受审判的一群人。
- source_word: בְּאַשְׁמַת שֹׁמְרוֹן
  choice: 指着撒马利亚的罪孽
  rationale: אַשְׁמָה通常表示罪责或罪孽；介词ב在此引出起誓所凭借或指着的对象。“罪孽”既保留常用词义，也容许它转喻撒马利亚有罪的祭祀或崇拜对象。
- source_word: חֵי
  choice: ……永活／永存
  rationale: 这是希伯来语起誓惯用语。用于“神”时译作“永活”，用于抽象的“道”时译作“永存”，使汉语可懂，同时保留第二个誓言刻意反常的表达。
- source_word: אֱלֹהֶיךָ דָּן
  choice: 但哪，你的神
  rationale: 按希伯来语词序和马所拉重音，将“但”理解为呼语，即“但哪，你的神”；不在正文中强行改成“但的神”，并以脚注保留该可能解释。
- source_word: דֶּרֶךְ בְּאֵר שָׁבַע
  choice: 别是巴之道
  rationale: דֶּרֶךְ的基本义是道路、道。正文保留其含混性，不直接限定为朝圣路线或当地宗教礼仪。
- source_word: וְנָפְלוּ וְלֹא יָקוּמוּ עוֹד
  choice: 他们必倒下，再也不能起来
  rationale: “必”体现先知审判宣告的确定性；“再也不能起来”自然表达לֹא…עוֹד所强调的终局性。
theological_decisions:
- issue: “撒马利亚的罪孽”所指为何
  choice: 正文译作普通名词“罪孽”，容许其转喻有罪的崇拜对象或祭祀体系
  alternative: “撒马利亚的罪”；或将其视为神祇名称，译作“撒马利亚的亚示玛”
  rationale: 普通名词义有充分词汇依据，也最能避免未经文本确认便指定某一偶像；脚注保留其他解释。
- issue: אֱלֹהֶיךָ דָּן的句法关系
  choice: 将“但”视为呼语：“但哪，你的神永活”
  alternative: 将“但”与“你的神”相连，理解为“但的神永活”
  rationale: 马所拉重音及表面词序支持呼语读法，但压缩的句法仍可能指但地所敬奉的神，因此以脚注保留另一读法。
- issue: “别是巴之道”的含义
  choice: 正文保留直译“别是巴之道”
  alternative: 别是巴的朝圣路线、朝圣活动，或当地的祭祀礼仪
  rationale: 原文使用普通词“道路／道”，却在祭祀起誓语境中可能有专门所指。保留字面表达可避免消除原文的神学讽刺和语义张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“指着……起誓”符合中文圣经语体，也清楚传达ב所引出的起誓对象；两个引语保留希伯来誓言公式的简短、强烈和第二句不寻常的拟生命表达。地名采用通行译名“撒马利亚、但、别是巴”。
