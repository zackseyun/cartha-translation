base_translation:
  language: en
  yaml_path: translation/ot/amos/008/010.yaml
  text: I will turn your feasts into mourning[a], and all your songs into lamentation; I will bring sackcloth on every waist and baldness on every head; I will make it like mourning for an only son[d][c][b], and its end like a bitter day.
translation:
  language: zh_hans
  text: 我要使你们的节期变为哀恸[a]，使你们所有的歌变为哀歌[b]；我要使人人腰间束上麻布，每个头都光秃；我要使这情形如同为独子哀恸[c]，它的结局如同苦涩的一日[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “节期”或译“节庆”。
    reason: lexical_alternative
  - marker: b
    text: “哀歌”也可译作“挽歌”。
    reason: lexical_alternative
  - marker: c
    text: 希伯来文直译“如同为唯一的一个哀恸”；这里通常理解为为独子哀恸。
    reason: lexical_alternative
  - marker: d
    text: “苦涩的一日”也可译作“充满苦楚的一日”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָפַכְתִּי
  choice: 我要使……变为
  rationale: 此处 הָפַךְ 表示使一种状态转变为另一种状态；这样译出上帝的主动作为，并自然呈现由欢庆转为悲哀的强烈反差。
- source_word: חַגֵּיכֶם
  choice: 你们的节期
  rationale: חַג 指群体庆祝的宗教节庆，常可指朝圣节期；“节期”在现代中文圣经语境中自然、庄重，也比“筵席”更准确。
- source_word: לְאֵבֶל
  choice: 变为哀恸
  rationale: אֵבֶל 特指丧亲式的哀悼状态；“哀恸”兼具情感与丧礼色彩。
- source_word: שִׁירֵיכֶם
  choice: 你们所有的歌
  rationale: 直接保留复数与 כָל 的总体范围。
- source_word: לְקִינָה
  choice: 变为哀歌
  rationale: קִינָה 是正式、常带丧礼性质的挽歌或哀歌；“哀歌”简洁且保留体裁意味。
- source_word: וְהַעֲלֵיתִי עַל כָּל מָתְנַיִם שָׂק
  choice: 我要使人人腰束麻布
  rationale: עלה 的使役形式在此表示使麻布临到或披在腰间；中文以“腰束麻布”自然表达普遍的哀悼装束，而“人人”传达 כָּל 的范围。
- source_word: וְעַל כָּל רֹאשׁ קָרְחָה
  choice: 个个头顶光秃
  rationale: קָרְחָה 指秃处或光秃，在本节是哀悼标志；译文保留先知话语中鲜明而突兀的身体意象，不额外限定为剃头。
- source_word: וְשַׂמְתִּיהָ
  choice: 我要使这一切
  rationale: 阴性后缀的具体所指并不明确，可能概括前述局面，也可能暗指土地、城或节庆；“这一切”自然承接整个灾难场景而不强定某一名词。
- source_word: כְּאֵבֶל יָחִיד
  choice: 如同为独子哀恸
  rationale: יָחִיד 字面是“唯一的一个”，此固定哀悼意象通常指失去独子；正文采用自然且符合语境的“独子”，脚注保留字面宽度。
- source_word: וְאַחֲרִיתָהּ
  choice: 其结局
  rationale: אַחֲרִית 可指末后、结局或结果；“其结局”兼顾时间推进与最终结果。代词仍未明确指定先行词。
- source_word: כְּיוֹם מָר
  choice: 如同苦涩之日
  rationale: מָר 描述这日充满苦楚；“苦涩之日”保持凝练、庄重的先知文体，也保留形容词表达的开放性。
theological_decisions:
- issue: וְשַׂמְתִּיהָ 与 וְאַחֲרִיתָהּ 中阴性后缀的所指
  choice: 以“这一切”概括前述哀悼局面，随后用“其”承接
  alternative: 明确译为“这地／她”，或具体指“节期”
  rationale: 希伯来文阴性后缀可能指隐含的阴性集合概念，如土地、城或整个情势，也可能回指语境中的某项内容。译为“这一切……其结局”可在自然中文中尽量保留所指的不确定性，不把审判对象擅自缩窄。
- issue: כְּאֵבֶל יָחִיד 中 יָחִיד 的含义
  choice: 正文译为“为独子哀恸”
  alternative: 译为“为唯一的一个哀恸”或“为独生子女哀恸”
  rationale: 在先知书的丧亲意象中，这一短语惯常表达失去独子的极深悲痛；正文采用语境意义，脚注说明希伯来文字面，避免赋予此处基督论或其他教派性含义。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。以“节期—哀恸”“歌—哀歌”的平行结构保留原文节奏；“人人……个个……”传达两个 כָּל 的全面性；后半句避免把阴性后缀武断落实为“这地”或“城”。所有脚注标记均已置于正文对应位置。
