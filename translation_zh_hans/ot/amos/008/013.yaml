  text: In that day the beautiful virgins and the young men will faint from thirst[a].
translation:
  language: zh_hans
  text: 那日，美丽的处女和年轻男子都必因干渴而昏厥。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “昏厥”或译“发昏”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: 到那日
  rationale: 这是先知书常见的时间用语；“到那日”自然、庄重，并保留希伯来文的指示意味。
- source_word: תִּתְעַלַּפְנָה
  choice: 必……昏厥
  rationale: עלף 的 Hitpael 形式表示因虚弱而昏倒或失去知觉；“昏厥”准确而简洁，也与口渴造成的身体衰弱相称。
- source_word: הַבְּתוּלֹת
  choice: 处女
  rationale: בְּתוּלָה 通常特指处女或未婚少女；译作“处女”保留原词的词义特征，避免宽泛化为“年轻女子”。
- source_word: הַיָּפוֹת
  choice: 美丽的
  rationale: 该形容词修饰“处女”；“美丽的”是现代汉语中清楚、自然的对应表达。
- source_word: וְהַבַּחוּרִים
  choice: 和年轻男子
  rationale: בָּחוּר 常指正值壮年的年轻男子；“年轻男子”自然且保留性别和年龄信息。
- source_word: בַּצָּמָא
  choice: 因口渴
  rationale: 介词 ב 在此表示导致昏厥的原因或状态；“因口渴”清楚传达因果关系。
