  text: 'Yahweh has sworn by the pride of Jacob: Surely I will never forget any of their deeds[a][b].'
translation:
  language: zh_hans
  text: 耶和华指着雅各的骄傲起誓：“我绝不会忘记他们所做的任何一件事[a][b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “骄傲”也可译作“荣耀”“荣美”或“威荣”。这个希伯来语词组可能带有讽刺意味，指雅各所夸耀的，也可能指上帝是雅各真正的荣耀。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为：“如果我永远忘记他们所做的一切……”这是誓言中的省略表达，意思是：“我绝不会忘记他们所做的任何一件事。”
    reason: source_form
lexical_decisions:
- source_word: נִשְׁבַּע
  choice: 起誓
  rationale: 该词为 שׁבע 的尼法勒式，是“起誓”的常用表达；现代汉语用“起誓”庄重而自然。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文读者熟悉的神名音译“耶和华”，而不以称号“主”替代专名。
- source_word: בִּגְאוֹן
  choice: 指着……的骄傲
  rationale: 介词 בְּ 在起誓语境中表示起誓所凭借或指着的对象；גָּאוֹן 可指骄傲、荣耀、威荣或卓越。正文采用较直接的“骄傲”，并以脚注保留其他可能。
- source_word: יַעֲקֹב
  choice: 雅各
  rationale: 保留专名“雅各”，在此作为以色列民族的盟约性称谓，延续先知书的措辞。
- source_word: אִם אֶשְׁכַּח
  choice: 我绝不会忘记
  rationale: אִם 在誓言后引出省略了咒诅后果的条件句，字面为“如果我忘记……”，实际表达强烈否定；“绝不会忘记”自然传达其誓言效力。
- source_word: לָנֶצַח
  choice: 绝不会
  rationale: לָנֶצַח 本义为“永远”；与“忘记”及誓言否定结合时，汉语以“绝不会忘记”表达最自然。
- source_word: כָּל מַעֲשֵׂיהֶם
  choice: 他们所做的任何一件事
  rationale: כָּל 表示整体或无一例外；在否定句中译作“任何一件”可清楚表达一件也不遗漏。מַעֲשֶׂה 在审判语境中指行为或所做之事。
theological_decisions:
- issue: “雅各的骄傲”在誓言中的所指
  choice: 正文保留“雅各的骄傲”，不明确其所指
  alternative: 译作“雅各的荣耀/荣美”，或将其理解为雅各真正的荣耀——上帝
  rationale: 希伯来语 גְּאוֹן 可带贬义的“骄傲”，也可指荣耀、威荣或卓越；此处可能讽刺以色列所夸耀的事物，也可能间接指上帝。正文不替读者消解这种真实的词义和神学张力。
- issue: 誓言条件句的表达
  choice: 正文译出誓言的实际语力：“我绝不会忘记”
  alternative: 按形式直译为“如果我永远忘记……”
  rationale: 原文是省略咒诅后果的自我诅咒式誓言；单独直译成汉语条件句会显得残缺并可能造成误解。脚注保留其字面结构。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“指着……起誓”符合中文圣经语体且能准确体现 בְּ 的誓言用法；“所做的任何一件事”比“所有行为”更自然地传达否定范围内 כָּל 的无一遗漏之意。
