id: AMO.8.11
reference: Amos 8:11
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: הִנֵּ֣ה יָמִ֣ים בָּאִ֗ים נְאֻם֙ אֲדֹנָ֣/י יְהוִ֔ה וְ/הִשְׁלַחְתִּ֥י רָעָ֖ב בָּ/אָ֑רֶץ לֹֽא רָעָ֤ב לַ/לֶּ֨חֶם֙ וְ/לֹֽא צָמָ֣א לַ/מַּ֔יִם כִּ֣י אִם לִ/שְׁמֹ֔עַ אֵ֖ת דִּבְרֵ֥י יְהוָֽה׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/008/011.yaml
  text: Behold[a], days are coming, declares the Lord GOD, when I will send a famine on the land—not a famine for bread, nor a thirst for water, but for hearing the words of Yahweh.
translation:
  language: zh_hans
  text: “看哪，日子将到，”主耶和华宣告说，“那时，我要使这地遭遇饥荒——不是没有饼吃，也不是没有水喝，而是听不到耶和华的话[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“而是要听耶和华的话。”希伯来语直译为“而是听耶和华的话”；“听不到”所表达的匮乏之意来自本句的“饥荒”比喻。
    reason: 保留 לִשְׁמֹעַ 的形式直译及其与上下文关系的歧义。
lexical_decisions:
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留先知宣告中郑重唤起注意的语气；在现代中文中仍庄重且易懂。
- source_word: יָמִים בָּאִים
  choice: 日子将到
  rationale: 对应希伯来语常见的先知性未来宣告，简洁自然，并保留原文意象。
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: 主耶和华宣告说
  rationale: נְאֻם 是神谕宣告套语；“宣告说”既显明发言权威，也符合现代中文表达。אֲדֹנָי יְהוִה 译为“主耶和华”，避免生硬重复。
- source_word: וְהִשְׁלַחְתִּי רָעָב בָּאָרֶץ
  choice: 那时，我要使这地遭遇饥荒
  rationale: 将连接词按上下文表达为“那时”，使“日子将到”与神将采取的行动自然衔接；“使……遭遇饥荒”保留神主动施行审判的含义。בָּאָרֶץ 在阿摩司书语境中较自然地指受审判的“这地”，而非整个世界。
- source_word: לֹא רָעָב לַלֶּחֶם וְלֹא צָמָא לַמַּיִם
  choice: 不是没有饼吃，也不是没有水喝
  rationale: 以自然中文表达原文对字面饥荒和干渴的否定，同时保留“饼”和“水”的具体意象。
- source_word: כִּי אִם לִשְׁמֹעַ אֵת דִּבְרֵי יְהוָה
  choice: 而是听不到耶和华的话
  rationale: כִּי אִם 表示强烈转折；“听不到”把“饥荒”所蕴含的匮乏关系自然地传达出来。דִּבְרֵי 为复数构造式，中文用集合性的“话”既自然，也可涵盖耶和华的多次言语或信息。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经传统中广为人知的专名形式，以区别于普通称谓“主”，并保留原文使用神圣名号的特点。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华；与 אֲדֹנָי 连用时译作“主耶和华”
  alternative: 雅威；上主
  rationale: “耶和华”在简体中文读者中辨识度较高，并清楚表现专名；“主耶和华”对应 אֲדֹנָי יְהוִה，又不造成“主主”的重复。
- issue: 所宣告之饥荒的性质
  choice: 不是食物或水的匮乏，而是无法听到耶和华的话
  alternative: 在字面饥荒之外另有属灵匮乏
  rationale: 原文明确否定饼的饥荒和水的干渴，继而以听耶和华的话作为对照。译文不额外加入字面饥荒与属灵饥荒并存的解释。
- issue: לִשְׁמֹעַ 中匮乏含义的表达
  choice: 听不到
  alternative: 听；要听
  rationale: 希伯来语不定式本身是“听”，但它受“饥荒”统摄，语境表达的是听闻机会的匮乏。“听不到”使中文语义完整；脚注保留更贴近形式的译法，避免遮蔽原文结构。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“看哪”“宣告说”保留先知话语的郑重语体；正文避免古奥句式。破折号凸显字面饥荒与听不到神话语之间的对照。
