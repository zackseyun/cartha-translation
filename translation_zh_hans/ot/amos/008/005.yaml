  text: לֵ/אמֹ֗ר מָתַ֞י יַעֲבֹ֤ר הַ/חֹ֨דֶשׁ֙ וְ/נַשְׁבִּ֣ירָה שֶּׁ֔בֶר וְ/הַ/שַּׁבָּ֖ת וְ/נִפְתְּחָה בָּ֑ר לְ/הַקְטִ֤ין אֵיפָה֙ וּ/לְ/הַגְדִּ֣יל שֶׁ֔קֶל וּ/לְ/עַוֵּ֖ת מֹאזְנֵ֥י מִרְמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/008/005.yaml
  text: saying[a], “When will the new moon be over, so that we may sell grain, and the Sabbath, so that we may offer wheat for sale—making the ephah small and the shekel large[b], and distorting deceitful scales?”
translation:
  language: zh_hans
  text: 说[a]：“新月节什么时候才过去，好让我们卖粮；安息日什么时候才过去，好让我们把麦子拿出来卖？我们要把伊法量器做小，把舍客勒加重[b]，还要弄歪欺诈的天平。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “新月节”也可译作“月份”；这里的上下文更可能是指新月节期，而不是历法上的月份。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“把伊法弄小，把舍客勒加重”，意思是少给货物，却多收钱。伊法是容量单位，舍客勒在这里是称量银钱的重量标准。
    reason: cultural_note
lexical_decisions:
- source_word: הַחֹדֶשׁ
  choice: 新月节
  rationale: 在商贸与宗教节期的语境中，此词指新月节，而非单指历月；商人盼望节期结束，以便恢复交易。
- source_word: וְנַשְׁבִּירָה שֶּׁבֶר
  choice: 好让我们卖粮
  rationale: שׁבר 的使役式在此表示出售粮食或口粮；译文采用自然、清楚的现代汉语。
- source_word: וְהַשַּׁבָּת
  choice: 安息日
  rationale: 保留这一公认的宗教日名称，呈现商人厌烦圣日妨碍买卖的语境。
- source_word: וְנִפְתְּחָה בָּר
  choice: 好让我们把麦子拿出来卖
  rationale: פתח 与 בָּר 在此表达开仓或开袋售卖；“拿出来卖”传达实际商贸动作，“麦子”保留与前句“粮”的词汇区别。
- source_word: לְהַקְטִין אֵיפָה
  choice: 把伊法弄小
  rationale: 保留古代干量单位“伊法”，同时呈现故意缩小容量、少给货物的欺诈行为。
- source_word: וּלְהַגְדִּיל שֶׁקֶל
  choice: 把舍客勒加重
  rationale: 舍客勒在此是称量银钱的重量标准；加重意味着向买主收取更多，且与“伊法弄小”形成平行。
- source_word: וּלְעַוֵּת מֹאזְנֵי מִרְמָה
  choice: 把欺诈的天平做歪
  rationale: עוה 有弄弯、扭曲之意；“做歪”既保留天平被动手脚的具体图像，也表达欺诈的道德性质。
theological_decisions:
- issue: 经济贪婪谴责中的宗教节期
  choice: 将 חֹדֶשׁ 和 שַׁבָּת 分别译为“新月节”和“安息日”
  alternative: 将 חֹדֶשׁ 仅译为历法意义的“月”
  rationale: 经文责备商人因圣日妨碍获利而急于其结束；保留节期含义能准确呈现先知的批判，又不加入额外教义。
- issue: 欺诈手段的具体性
  choice: 保留“伊法弄小、舍客勒加重、天平做歪”的物质图像
  alternative: 概括译为“缺斤少两、抬高价钱、使用假秤”
  rationale: 直译式图像保存原文的排比与古代市场场景，脚注则向现代读者解释其实际含义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“什么时候才过去”自然表达商人的不耐烦；保留“伊法”和“舍客勒”以维持古代市场意象，并用脚注解释。
