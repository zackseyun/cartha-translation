base_translation:
  language: en
  yaml_path: translation/ot/amos/008/008.yaml
  text: Because of this[a], will not the land tremble, and every one who dwells in it mourn? All of it will rise like the Nile[b]; it will be driven along and sink like the Nile of Egypt.
translation:
  language: zh_hans
  text: 这地[a]岂不因此震动？所有住在其中的人岂不都悲哀吗？全地必像尼罗河一样涨起[b]，被冲荡，又像埃及的尼罗河一样回落。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “这地”也可译作“大地”。希伯来语 אֶרֶץ 两种意思都可以表达；这里因经文聚焦受审判的地域及其中居民，正文采用“这地”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来原文两次以尼罗河作比。这里借尼罗河每年涨起、回落的景象，描绘席卷全地的剧烈动荡。
    reason: cultural_note
lexical_decisions:
- source_word: הַעַל זֹאת
  choice: 岂不因此
  rationale: עַל זֹאת 表明原因；与疑问词 הֲ 合起来译为“岂不因此”，既保留因果关系，也呈现原文的反问语气。
- source_word: תִרְגַּז
  choice: 震动
  rationale: רגז 可指颤抖、震荡或惊惧；以“这地”为主语时，“震动”既适合地表动荡的意象，也不排除审判所引起的恐惧。
- source_word: הָאָרֶץ
  choice: 这地
  rationale: אֶרֶץ 可指某片土地，也可指大地；上下文聚焦受审判的地域及其中居民，因此正文采用“这地”，并以脚注保留“大地”的可能。
- source_word: וְאָבַל
  choice: 悲哀
  rationale: אבל 表示哀悼、悲恸；“悲哀”自然庄重，并与全体居民因审判而受苦的语境相称。
- source_word: כָּל יוֹשֵׁב בָּהּ
  choice: 所有住在其中的人
  rationale: 准确表达“其中每一个居住者”的总体范围，同时符合现代汉语表达。
- source_word: וְעָלְתָה כָאֹר כֻּלָּהּ
  choice: 全地必像尼罗河一样涨起
  rationale: כֻּלָּהּ 回指整片土地；אֹר 在埃及语境中指尼罗河。用“涨起”呈现河水上涨及全地剧烈起伏的比喻。
- source_word: וְנִגְרְשָׁה
  choice: 翻涌
  rationale: גרשׁ 的被动形式在洪水意象中有被驱动、冲荡之意；“翻涌”能自然呈现水势与土地被冲荡的动态，又不把它误解为单纯的驱逐。
- source_word: וְנשקה
  choice: 回落
  rationale: 本句与尼罗河涨落的意象及阿摩司书9:5的平行句相呼应，所指是上涨后的下沉、消退；“回落”清楚呈现这一运动。
- source_word: כִּיאוֹר מִצְרָיִם
  choice: 像埃及的尼罗河一样
  rationale: 直明所比拟的是埃及尼罗河，措辞清楚，并保留原文重复强调的结构。
