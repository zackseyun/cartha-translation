  text: to buy the poor for silver[a], and the needy for a pair of sandals, and sell the sweepings of the grain.
translation:
  language: zh_hans
  text: 为要用银子买下穷人，用一双鞋买下穷乏人，并出售谷物的残渣[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “谷物的残渣”也可译作“谷物的废料”或“掉落的谷粒”；希伯来文很可能指被当作货物出售的劣质谷物余料。
    reason: lexical_alternative
lexical_decisions:
- source_word: לִקְנוֹת
  choice: 买下
  rationale: 这是קנה的Qal不定式附属形，承接上一节，表达商人的企图。“买下”保留直接的交易含义，也自然显出他们把困苦者当作可以买卖之人的剥削行为，但不在正文中进一步限定其具体法律形式。
- source_word: בַּכֶּסֶף
  choice: 用银子
  rationale: 介词短语表示交易所付的价款。“银子”保留希伯来文具体用词及先知话语的色彩，而不泛化为“钱”。
- source_word: דַּלִּים
  choice: 穷人
  rationale: דַּל可指贫穷或社会地位弱小的人；在经济压迫的语境中，“穷人”自然清楚。
- source_word: וְאֶבְיוֹן
  choice: 贫寒人
  rationale: אֶבְיוֹן指贫困、匮乏的人。“贫寒人”既与“穷人”形成平行，又避免把两个近义词完全译成同一表达。
- source_word: בַּעֲבוּר נַעֲלָיִם
  choice: 用一双鞋
  rationale: 短语表示所付的微薄代价；נַעֲלַיִם为双数，因此译作“一双鞋”，保留困苦者竟因极小价值而遭买卖的尖锐意味。
- source_word: וּמַפַּל בַּר
  choice: 连谷物的残渣也
  rationale: מַפַּל指掉落物或被丢下的东西，与בַּר连用，可能指劣质的谷物余料、扫拢之物或落粒。“谷物的残渣”以自然中文表达其低劣性质，同时用脚注保留词义的不确定性。
- source_word: נַשְׁבִּיר
  choice: 拿来卖
  rationale: שׁבר的Hiphil在商业语境中意为出售粮食。“拿来卖”符合现代汉语表达，并清楚承接前面的宾语。
theological_decisions:
- issue: “买下穷人”是否明确指债务奴役
  choice: 保留“买下”的人物交易意象，不在正文中明确补出“作奴隶”
  alternative: 译为“买穷人作奴隶”
  rationale: 上下文强烈暗示经济压迫，可能涉及因债沦为奴仆，但本节希伯来文本身没有明说“作奴隶”；保留其张力可避免把合理推论写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“为要”承接上一节的意图表达；重复“买下”保留希伯来诗句的平行结构。“连……也……”突出商人甚至出售劣质余料的贪婪。脚注标记紧随其所解释的“谷物的残渣”相关分句。
