id: AMO.8.2
reference: Amos 8:2
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר מָֽה אַתָּ֤ה רֹאֶה֙ עָמ֔וֹס וָ/אֹמַ֖ר כְּל֣וּב קָ֑יִץ וַ/יֹּ֨אמֶר יְהוָ֜ה אֵלַ֗/י בָּ֤א הַ/קֵּץ֙ אֶל עַמִּ֣/י יִשְׂרָאֵ֔ל לֹא אוֹסִ֥יף ע֖וֹד עֲב֥וֹר לֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/008/002.yaml
  text: And he said[a], “What do you see, Amos?” And I said, “A basket of summer fruit.” Then Yahweh said to me, “The end has come upon my people Israel[b]; I will not again pass by them.”
translation:
  language: zh_hans
  text: 他问：“阿摩司，你看见什么？”我说：“一筐夏果。[a]”雅威又对我说：“结局已经临到我的子民以色列；我必不再放过他们。[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “夏果”的希伯来语是qayits，“结局”是qets，两词读音相近；这个双关把异象与随后的审判宣告联系起来。
    reason: 说明原文无法在中文正文中重现的语音双关。
  - marker: b
    text: “放过”所译的希伯来语字面可作“经过”或“越过”；本句也可译为“我必不再宽恕他们”。
    reason: 保留עֲבוֹר לוֹ的字面意象和审判语境中的另一种译法。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 他问
  rationale: אמר本义为“说”；因其后是直接问句，现代汉语用“问”更自然，也不增添原文没有的内容。主语承接异象中说话者。
- source_word: מָה אַתָּה רֹאֶה
  choice: 你看见什么
  rationale: 以自然的现代汉语表达分词所呈现的当前视觉经验。
- source_word: עָמוֹס
  choice: 阿摩司
  rationale: 采用现代中文圣经语境中通行的人名音译。
- source_word: כְּלוּב קָיִץ
  choice: 一筐夏果
  rationale: כְּלוּב指盛装物品的筐篮，קָיִץ指夏季成熟、采收的果实；“夏果”简洁保留其季节含义，并便于脚注说明它与“结局”的希伯来语双关。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以中文音译呈现四字神名，而不以“主”这一称号替代。
- source_word: בָּא הַקֵּץ
  choice: 结局已经临到
  rationale: 完成式בָּא在先知宣告中把结局说成已经来到；“结局”对应带定冠词的הַקֵּץ，也与前句的异象解释相连。
- source_word: אֶל עַמִּי יִשְׂרָאֵל
  choice: 我的子民以色列
  rationale: “临到”已自然承载介词אֶל的方向与降临意味；保留“我的子民”所表达的盟约关系，并将“以色列”作为同位称呼。
- source_word: לֹא אוֹסִיף עוֹד
  choice: 我必不再
  rationale: 该结构表示同一行动不再重复；“必”符合庄重的审判宣告语气。
- source_word: עֲבוֹר לוֹ
  choice: 放过他们
  rationale: עבר的字面意象是“经过、越过”，在此审判语境中表示不再越过而不惩治，即不再放过。中文主句采用可理解的习语，字面表达及“宽恕”的可能含义在脚注保留。集体名词“子民”在中文中自然用复数“他们”回指。
theological_decisions:
- issue: 如何译出神名יְהוָה
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；音译“雅威”保留其专名性质，不以称号替代，也不把后期传统读音写入正文。
- issue: עֲבוֹר לוֹ在审判语境中的含义
  choice: 我必不再放过他们
  alternative: 我必不再从他们身旁经过；我必不再宽恕他们
  rationale: “放过”既符合本段终止容忍、审判临到的语境，又隐约保留“越过”的底层意象；脚注列出字面译法和“宽恕”这一语义可能，避免把有张力的习语解释得过死。
- issue: 先知完成式בָּא所表达的时间与确定性
  choice: 已经临到
  alternative: 即将临到
  rationale: 正文保留完成式将未来审判宣告为已然来到的强烈确定性，不将它弱化为单纯预告。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准普通话。“一筐夏果”简练且具异象画面感；“结局已经临到”保留先知宣告的迫切与确定性。标点与引语层次按现代简体中文规范处理。
