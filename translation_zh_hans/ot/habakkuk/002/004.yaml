  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: הִנֵּ֣ה עֻפְּלָ֔ה לֹא יָשְׁרָ֥ה נַפְשׁ֖/וֹ בּ֑/וֹ וְ/צַדִּ֖יק בֶּ/אֱמוּנָת֥/וֹ יִחְיֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/002/004.yaml
  text: 'Look: his soul is puffed up; it is not upright within him, but the righteous will live by his faithfulness.'
translation:
  language: zh_hans
  text: 看哪，那人自高自大，心里并不正直；但义人必因他的忠信而活。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “忠信”也可译作“信靠”或“信心”。“他的”通常可理解为指义人，也有人理解为指上帝，即“因上帝的信实”。
    reason: 原词אֱמוּנָה及其第三人称单数后缀在词义和所指上存在真实的解释空间，需保留而不在正文中武断消除。
lexical_decisions:
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留希伯来语引人注意的指示语气，同时采用庄重而通行的现代汉语表达。
- source_word: עֻפְּלָה
  choice: 自高自大
  rationale: 该词在此指骄傲、膨胀的状态；译作“自高自大”自然地传达与下句“不正直”的对照。
- source_word: נַפְשׁוֹ
  choice: 心里
  rationale: נפש在此指人的内在生命或性情；直译“灵魂”在现代汉语中易产生身心二分的额外含义，因此按语境译作“心里”。
- source_word: יָשְׁרָה
  choice: 正直
  rationale: 保留词根所表达的正、直、端正之意，并与人的内在状态相配。
- source_word: צַדִּיק
  choice: 义人
  rationale: 采用圣经汉语中清楚、凝练且广为理解的对应语。
- source_word: בֶּאֱמוּנָתוֹ
  choice: 因他的忠信
  rationale: אֱמוּנָה可表示忠信、坚定、信实，也可涉及信靠；本处用“忠信”保留品格与持守层面的核心语义，并在脚注说明代词与词义的真实歧义。
- source_word: יִחְיֶה
  choice: 必……活
  rationale: 未完成式在此表达确定的结果或应许；“必活”保留简洁有力的语气，且不擅自限定为今生存活或末世生命。
theological_decisions:
- issue: “他的忠信”中代词所指
  choice: 正文保留“他的”，按最直接句法可指义人本人
  alternative: 理解为上帝的信实，译作“因上帝的信实”
  rationale: 希伯来语阳性单数后缀本身未明说所指；正文不补入“上帝”，以免消除原文可能保留的张力，并用脚注提示另一种理解。
- issue: אֱמוּנָה的神学范围
  choice: 译作“忠信”
  alternative: 译作“信心”或“信靠”
  rationale: “忠信”较能体现希伯来词在本语境中的坚定、可靠、持守之意；同时脚注承认“信靠/信心”的可能含义，避免因后来的引用传统而把原文词义压缩为单一概念。
- issue: “活”的范围
  choice: 不加限定地译作“活”
  alternative: 解释为“存活”“得生命”或“永远活着”
  rationale: 原文没有明示生命的时间或性质，故保留其开放性，不在正文中加入特定救恩论解释。
translation_notes:
  register: 采用现代、庄重、易懂的书面汉语。“看哪”保留先知性宣告的力度；分号突出骄傲者与义人的对比。正文避免过度解释，以脚注交代关键歧义。
