  naturalness: 译文庄重、顺畅，符合现代标准汉语的圣经书面语体。“看哪”保留宣告和提示注意的语气；分号清楚标出两类人的对照。“自高自大”与“心里并不正直”搭配自然。
  terminology: “义人”“忠信”“活”均为恰当且稳定的圣经汉语用语。“忠信”适合本节אֱמוּנָה在语境中所含的坚定、可靠、持守之义；脚注同时列出“信靠/信心”以及后缀所指的解释空间，未将具争议的理解强加于正文。脚注锚点[a]存在且内容对应正文关键词。
