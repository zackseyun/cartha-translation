  text: כִּ֣י חֲמַ֤ס לְבָנוֹן֙ יְכַסֶּ֔/ךָּ וְ/שֹׁ֥ד בְּהֵמ֖וֹת יְחִיתַ֑/ן מִ/דְּמֵ֤י אָדָם֙ וַ/חֲמַס אֶ֔רֶץ קִרְיָ֖ה וְ/כָל יֹ֥שְׁבֵי בָֽ/הּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/002/017.yaml
  text: For the violence done to Lebanon will cover you[a], and the destruction of beasts will terrify you, because of the blood of man and the violence done to the land, to the city[b], and to all who dwell in it.
translation:
  language: zh_hans
  text: '因为对黎巴嫩的暴行必遮盖你[a]；

    对野兽的毁灭必使它们惊恐[b]。

    这是因流人的血，

    也因对大地、城邑和其中所有居民的暴行。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “遮盖”也可译作“淹没”或“笼罩”；原文保留了被覆盖、被吞没的意象。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“使它们惊恐”，“它们”最自然地指野兽；也有人根据与上句“你”的平行关系理解为“使你惊恐”。
    reason: textual_ambiguity
lexical_decisions:
- source_word: חֲמַס לְבָנוֹן
  choice: 黎巴嫩所受的暴行
  rationale: חָמָס表示暴力、强暴或残酷的不义；这里把黎巴嫩理解为暴行的承受者，与下半节大地、城邑和居民所受的暴行平行。
- source_word: יְכַסֶּךָּ
  choice: 必遮盖你
  rationale: כסה的基本意象是“遮盖”。此处指报应反过来笼罩施暴者；正文保留先知诗歌的具体意象，不直接释为“淹没”或“压倒”。
- source_word: שֹׁד בְּהֵמוֹת
  choice: 野兽所遭的毁灭
  rationale: שֹׁד可指暴力造成的毁灭、残害或劫掠；בְּהֵמוֹת泛指野兽或动物。译文不把范围缩窄为牲畜，也不限定为军事劫掠。
- source_word: יְחִיתַן
  choice: 必使它们惊恐
  rationale: 按所给马所拉文本，动词带第三人称复数宾语后缀，最自然的先行词是“野兽”；חתת的使役式可表示使惊恐、使丧胆。
- source_word: מִדְּמֵי אָדָם
  choice: 因人所流的血
  rationale: 介词מִן在此表原因；复数形式דָּמִים在语境中指流血或血债。אָדָם为单数集合性用法，现代汉语的“人”自然保留其代表性。
- source_word: וַחֲמַס אֶרֶץ קִרְיָה וְכָל יֹשְׁבֵי בָהּ
  choice: 也因大地、城邑和其中所有居民所受的暴行
  rationale: 重复的חָמָס继续表达施加于受害对象的暴行；קִרְיָה可指城邑，并可能呼应2:12。译文保留大地、城邑及居民这一连串对象。
theological_decisions:
- issue: יְחִיתַן的宾语所指
  choice: 它们（指野兽）
  alternative: 你（指受审判的施暴者）
  rationale: 马所拉文本的后缀是第三人称复数，故正文按字形译作“它们”，不因与前句第二人称“你”的平行关系而静默改写；脚注说明语境中常见的另一理解。
- issue: אָדָם的代表性含义
  choice: 人
  alternative: 人类
  rationale: 希伯来文单数אָדָם在这里具有集合或代表性含义。汉语“人所流的血”既贴近原文形式，也可自然涵盖一般人类，无须加入性别限定。
- issue: 报应与罪行之间的因果关系
  choice: 这是因……也因……
  alternative: 从人的血和对大地等的暴行而来
  rationale: מִן在上下文中最自然地表示受审判的原因。译文明确因果，却不增添原文未明说的审判执行者。
translation_notes:
  register: 采用现代、庄重而易懂的先知诗歌语体，按原文四行展开。以“暴行”“毁灭”“惊恐”保持审判语气，并保留“遮盖”的原始比喻。所有脚注标记均已置于正文相应位置。
