source:
  edition: WLC
  text: עַל מִשְׁמַרְתִּ֣/י אֶעֱמֹ֔דָה וְ/אֶֽתְיַצְּבָ֖ה עַל מָצ֑וֹר וַ/אֲצַפֶּ֗ה לִ/רְאוֹת֙ מַה יְדַבֶּר בִּ֔/י וּ/מָ֥ה אָשִׁ֖יב עַל תּוֹכַחְתִּֽ/י־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/002/001.yaml
  text: I will stand at my guard post and station myself on the rampart[a]; I will keep watch to see what he will speak in me[b], and what I should answer concerning my complaint.
translation:
  language: zh_hans
  text: 我要站在我的守望岗位，立在防御墙上[a]；我要守望，看他要对我说什么[b]，又看我该怎样就我的申诉作答[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “防御墙”也可译作“堡垒”或“围城工事”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译可作“在我里面说”；这可能指先知在内里领受的话语。
    reason: alternative_reading
  - marker: c
    text: “我的申诉”也可译作“对我的责备”或“我的辩词”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁמַרְתִּי
  choice: 我的守望处
  rationale: 该词既可指守望的职责，也可指守望的位置；此处与“站”和“立”连用，具体地点义更合语境。“守望处”既保留哨兵意象，也符合现代汉语。
- source_word: אֶעֱמֹדָה
  choice: 我要站
  rationale: 未完成式带有意愿或决意色彩，译为“我要站”自然表达先知有意等候的姿态。
- source_word: וְאֶתְיַצְּבָה
  choice: 立在
  rationale: Hitpael形式表示使自己站定、占据位置；“立在”简洁地传达坚定就位，并避免汉语中累赘的反身表达。
- source_word: מָצוֹר
  choice: 堡垒
  rationale: 该词可指围城工事或防御工事；本节描绘登高守望的地点，“堡垒”能自然表达设防的高处，同时以脚注保留“围城工事”的可能。
- source_word: וַאֲצַפֶּה
  choice: 我要守望
  rationale: 动词含持续、警醒地观看之意；“守望”比单纯“观看”更能表现期待答复的状态。
- source_word: לִרְאוֹת
  choice: 看
  rationale: 这是表目的的不定式，指守望以察知将得到的回应；汉语用“看”衔接后面的间接问句最自然。
- source_word: מַה יְדַבֶּר בִּי
  choice: 他要在我里面说什么
  rationale: בִּי直译为“在我里面”，可暗示临到先知内里的话语；虽也可按语境理解为“对我说”，正文保留原文较不寻常的表达，并用脚注说明另一种理解。
- source_word: אָשִׁיב
  choice: 我该怎样回应
  rationale: Hiphil形式在此具有作答、回应之意；“该怎样回应”表达先知领受话语后思量如何答复的语气。
- source_word: עַל תּוֹכַחְתִּי
  choice: 回应我的申诉
  rationale: תּוֹכַחַת语义可涵盖责备、辩论、申诉；结合上一章先知向上帝提出的质问，“申诉”较自然，也保留了一定的论辩色彩。
theological_decisions:
- issue: בִּי所指的话语方式
  choice: 正文译为“在我里面说”，保留内在先知性话语的可能
  alternative: “对我说”，理解为上帝向先知说话
  rationale: 介词ב的通常空间意义支持“在我里面”，而上下文等候上帝答复也支持“对我”。正文采用较贴近原文的表达，脚注保留自然的受话者理解，不排除任何一种。
- issue: תּוֹכַחְתִּי的说话主体与语义
  choice: “我的申诉”，理解为先知先前提出的质问或案件
  alternative: “对我的责备”，理解为先知将受到的责备；或“我的辩词”
  rationale: 第一章末尾的抗辩使“我的申诉”在上下文中较顺，但希伯来词本身也可表示责备或论辩，因此用脚注保留这些可能，避免消除原文张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“守望处—堡垒—守望”保留原文哨兵与高处等候的连贯意象；正文保留בִּי的反常空间表达，并通过脚注帮助普通读者理解。
