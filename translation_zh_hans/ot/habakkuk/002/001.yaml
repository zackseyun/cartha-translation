revisions:
- from: 我要站在我的守望处，立在堡垒上[a]；我要守望，看他要在我里面说什么[b]，也看我该怎样回应我的申诉[c]。
  to: 我要站在我的守望岗位，立在防御墙上[a]；我要守望，看他要对我说什么[b]，又看我该怎样就我的申诉作答[c]。
  rationale: 修订以自然现代汉语表达经文，同时不将有争议的בִּי限定为单一的内在话语理解：正文采用上下文顺畅的“对我说”，脚注保留“在我里面说”的字面及解释可能。并调整“作答”短语以清楚体现先知是就自己的申诉思量答复。
