  text: ה֗וֹי בֹּצֵ֛עַ בֶּ֥צַע רָ֖ע לְ/בֵית֑/וֹ לָ/שׂ֤וּם בַּ/מָּרוֹם֙ קִנּ֔/וֹ לְ/הִנָּצֵ֖ל מִ/כַּף רָֽע־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/002/009.yaml
  text: Woe to him who gains evil profit for his house, to set his nest on high, to escape from the grasp of harm.
translation:
  language: zh_hans
  text: 祸哉！那为自己的家攫取不义之财、把自己的窝安在高处、好逃脱祸患之手的人！
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֹּצֵעַ בֶּצַע רָע
  choice: 攫取不义之财
  rationale: 同根词连用强调以贪婪、非法手段牟利；“攫取”传达强取色彩，“不义之财”自然表达所得在道德上的邪恶。
- source_word: לְבֵיתוֹ
  choice: 为自己的家
  rationale: 保留“家”既可指家庭、家室，也可延伸指王朝或家族的语义空间，不擅自限定。
- source_word: לָשׂוּם בַּמָּרוֹם קִנּוֹ
  choice: 把自己的窝安在高处
  rationale: 保留原文“窝/巢”的形象及高处所象征的安全与不可侵犯感。
- source_word: מִכַּף רָע
  choice: 灾祸之手
  rationale: כף直译为“手掌、掌握”，此处表示势力或控制；רָע可指恶、伤害或灾祸，语境侧重企图躲避临到的祸患。
theological_decisions:
- issue: “家”的所指
  choice: 保留为“自己的家”
  alternative: 自己的家族／王朝
  rationale: 原文בֵּית可兼指家庭、家室、家族或王朝；正文不将其缩窄为特定政治含义。
- issue: רָע在末句的含义
  choice: 灾祸
  alternative: 邪恶／伤害
  rationale: “逃脱……之手”的搭配在此更自然地指避开临到的祸患，但不否认该词与前句道德之恶形成呼应。
translation_notes:
  register: 采用庄重而通俗的现代汉语。“祸哉”保留先知谴责宣告的力度；三个连续成分维持原文紧凑的因果推进，并保留“窝安在高处”的生动隐喻。
