  terminology: “祸哉”符合先知宣告的庄重文体；“不义之财”“自己的家”“窝”“高处”均没有不当神学预设。“祸患之手”比“灾祸之手”更合乎现代汉语，且与英文审校轨迹的“harm”相称。
