  source_fidelity: 译文准确传达了“为自己的家获取邪恶/不义之利”、将巢安置高处，以及企图逃离祸害控制的连续意象。“不义之财”恰当表达בֶּצַע רָע（邪恶的利益）；“家”保留了בֵּית可指家室、家族或家业的开放性。末句的רָע可指恶、伤害或灾祸；按此处“从……之手逃脱”的语境，译作“祸患”较为贴切，亦不强行消除其与前句“恶”的呼应。
