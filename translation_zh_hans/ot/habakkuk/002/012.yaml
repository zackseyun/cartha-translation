base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/002/012.yaml
  text: Woe to him who builds a city with bloodshed and establishes a town by injustice[a][b].
translation:
  language: zh_hans
  text: 那以流血[a]建造城池、以不义建立城邑[b]的人有祸了！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“以诸血”；这一复数表达通常指流血杀人，也可带有血债之意。
    reason: lexical_alternative
  - marker: b
    text: “建立城邑”也可译作“奠立城邑”或“使城邑稳固”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹי
  choice: 有祸了
  rationale: 这是引出审判宣告的感叹词，可兼具哀叹与谴责意味；“有祸了”在现代中文中保留先知警告的力度。
- source_word: בֹּנֶה
  choice: 建造
  rationale: Qal主动分词在这里描述受谴责之人的持续或典型行为；放在“那……的人”结构中自然明确。
- source_word: עִיר
  choice: 城池
  rationale: 该词通常指城市；“城池”既庄重易懂，也与下半句的近义词“城邑”形成诗体对应。
- source_word: בְּדָמִים
  choice: 以流血
  rationale: 原文复数形式“血”常用作流血杀人或血债的习语；介词表达手段，因此译作“以流血”。
- source_word: וְכוֹנֵן
  choice: 建立
  rationale: 该动词含设立、奠定或使之稳固之意；“建立”既能涵盖这些含义，也与上半句“建造”构成平行而不过度限定。
- source_word: קִרְיָה
  choice: 城邑
  rationale: 这是与עִיר近义的城市用语；译为“城邑”可保留希伯来诗歌中的词汇变化。
- source_word: בְּעַוְלָה
  choice: 以不义
  rationale: 该名词指不公、邪恶或不正当行为；“不义”简洁庄重，并保留其道德与司法层面的广度。
theological_decisions:
- issue: 祸哉宣告的性质
  choice: 译作针对以暴力和不义营建城邦者的先知性审判宣告
  alternative: 理解为对城市腐败的一般哀叹
  rationale: “有祸了”保留הוֹי兼有哀叹与谴责的语气，但上下文中的“流血”和“不义”表明重点是审判性的控诉；译文不把对象限定为某一后世政权或神学体系。
- issue: 建城行为与罪恶手段的关系
  choice: “以”明确流血和不义是建造、建立城邑的手段或基础
  alternative: 将其弱化为城中伴随发生的暴力与不公
  rationale: 两处בְ最自然地表达凭借或通过某种手段；这样保留原文对暴力扩张和不义权力结构的直接谴责。
translation_notes:
  register: 采用现代、庄重而易懂的先知文学语体。以“那……的人有祸了”自然表达希伯来文的分词结构和祸哉宣告；“城池／城邑”保留两组近义词的诗歌平行，避免将两者人为解释为不同规模的聚落。
