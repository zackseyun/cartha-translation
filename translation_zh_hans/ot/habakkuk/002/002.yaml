  text: וַ/יַּעֲנֵ֤/נִי יְהוָה֙ וַ/יֹּ֔אמֶר כְּת֣וֹב חָז֔וֹן וּ/בָאֵ֖ר עַל הַ/לֻּח֑וֹת לְמַ֥עַן יָר֖וּץ ק֥וֹרֵא בֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/002/002.yaml
  text: 'Then Yahweh answered me and said: “Write the vision; make it plain on tablets[a], so that one who reads it may run.”'
translation:
  language: zh_hans
  text: 于是，耶和华回答我说：“把这异象写在板上，要写得清楚，使读的人可以奔跑。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文中通行的专名“耶和华”呈现四字神名，而不以“主”这一称号替代。
- source_word: וַיַּעֲנֵנִי
  choice: 回答我
  rationale: ענה在此指回应、答复；保留第一人称单数宾语“我”。
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 与“回答我”组成自然的中文叙事表达“回答我说”，避免生硬重复连接词。
- source_word: כְּתוֹב חָזוֹן
  choice: 把这异象写下来
  rationale: כתב是“写”，חזון指先知所得的异象或启示信息；根据语境以“这异象”指当前所论的特定异象。“写下来”自然地表达记录之意。
- source_word: וּבָאֵר
  choice: 清楚地写
  rationale: באר的加强语态在此要求使文字清楚、鲜明；因其后紧接书写媒介，译作“清楚地写”比抽象的“说明白”更贴合语境。
- source_word: עַל הַלֻּחוֹת
  choice: 在版上
  rationale: לֻחוֹת指供书写的板、版；原文没有说明材质，故不增译“石版”。中文“版”既保留书写载体之意，也避免现代电子“平板”的联想。
- source_word: לְמַעַן
  choice: 使
  rationale: 引出目的或预期结果；“使……可以”是自然、庄重的现代中文。
- source_word: יָרוּץ
  choice: 可以奔跑
  rationale: רוץ的直接意义是“跑、奔跑”；保留原文鲜明动作，不在正文中补入未明说的宾语或方式。
- source_word: קֹרֵא בוֹ
  choice: 读的人
  rationale: 分词קֹרֵא作名词性用法，指阅读者；בוֹ在此与“读”相连，中文无需另译代词也能明确指所写的异象。
theological_decisions:
- issue: 目的从句לְמַעַן יָרוּץ קֹרֵא בוֹ的解释
  choice: 使读的人可以奔跑
  alternative: 使读的人可以带着它奔跑；使人能迅速读完
  rationale: 希伯来语结构紧凑，最直接的句法是以“读的人”为“奔跑”的主语。正文保留这一形象及其开放性，不擅自补出“带着它”，也不把“奔跑”完全转化为阅读速度；其他合理理解收入脚注。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“于是”承接上文叙事；“版”保留古代书写板的宽泛含义。正文尽量贴近原文意象，并以脚注保存末句真实存在的歧义。
