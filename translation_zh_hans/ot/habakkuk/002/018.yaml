revisions:
- from: 雕刻的偶像有什么益处呢？雕刻它的工匠竟信靠它——这铸成的像、传授谎言的师傅[a]；他造的不过是不能说话的偶像[b]。
  to: 雕刻的偶像有什么益处呢？制作者把它雕刻出来；它是铸成的像，是传授谎言的教师[a]。制作者竟信靠自己所造的，去制造不能说话的偶像[b]。
  rationale: 修订恢复原文的两段论证：先指出偶像由制作者雕刻，且是铸成的像与“谎言的教师”；再说明制作者竟信靠所造之物，并制造不能说话的偶像。保留原有脚注所说明的指涉争议和 אֱלִילִים 的贬义，同时使用自然、庄重的现代汉语。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T08:16:02Z'
