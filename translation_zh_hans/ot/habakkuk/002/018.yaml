  text: מָֽה הוֹעִ֣יל פֶּ֗סֶל כִּ֤י פְסָל/וֹ֙ יֹֽצְר֔/וֹ מַסֵּכָ֖ה וּ/מ֣וֹרֶה שָּׁ֑קֶר כִּ֣י בָטַ֞ח יֹצֵ֤ר יִצְר/וֹ֙ עָלָ֔י/ו לַ/עֲשׂ֖וֹת אֱלִילִ֥ים אִלְּמִֽים־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/002/018.yaml
  text: What profit is an idol when its maker has carved it— a cast image and a teacher of lies? For the one who formed it trusts in it[d][c][b][a], making mute idols.
translation:
  language: zh_hans
  text: 雕刻的偶像有什么益处呢？制作者把它雕刻出来；它是铸成的像，是传授谎言的教师[a]。制作者竟信靠自己所造的，去制造不能说话的偶像[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “传授谎言的教师”把偶像人格化，表示它会误导敬拜它的人；也有人把这称呼理解为制造偶像的人。
    reason: preserve_syntactic_and_referential_ambiguity
  - marker: b
    text: “偶像”一词也可带有“虚无之物”或“毫无价值的神像”的贬义。
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה הוֹעִיל
  choice: 有什么益处呢
  rationale: 以反问表达毫无用处的讽刺语气，既贴近希伯来文，也符合现代汉语。
- source_word: פֶּסֶל
  choice: 雕刻的偶像
  rationale: 兼顾该词所指的崇拜对象及其雕刻制作方式，避免只译“像”而弱化宗教语境。
- source_word: כִּי פְסָלוֹ יֹצְרוֹ
  choice: 雕刻它的工匠
  rationale: 保留“雕刻”动作和制造者身份；句法上将 כִּי 所引出的解释性内容融入反问后的陈述。
- source_word: מַסֵּכָה
  choice: 铸成的像
  rationale: 准确表达用熔融材料浇铸成像的含义，现代汉语自然清楚。
- source_word: וּמוֹרֶה שָּׁקֶר
  choice: 传授谎言的师傅
  rationale: 保留偶像被人格化为“教师”的鲜明比喻，并使其与“工匠”有所区分。
- source_word: כִּי בָטַח יֹצֵר יִצְרוֹ עָלָיו
  choice: 雕刻它的工匠竟信靠它
  rationale: 直陈制作者信靠自己所制之物的荒谬；“竟”传达原句论辩中的讽刺，却未增添实质命题。
- source_word: לַעֲשׂוֹת אֱלִילִים אִלְּמִים
  choice: 他造的不过是不能说话的偶像
  rationale: “不能说话”准确表达 אִלְּמִים；“不过”体现 אֱלִילִים 的贬抑色彩与上下文的讽刺。
theological_decisions:
- issue: “传授谎言的师傅”所指为何
  choice: 将其理解为与“铸成的像”同位，拟人化地描述偶像怎样误导敬拜者
  alternative: 理解为制造偶像的工匠或相关的假教师
  rationale: 希伯来文中“铸成的像”和“传授谎言的师傅”并列，最自然地共同描述偶像；脚注保留另一种理解，不将争议静默消除。
- issue: 制造者所信靠的对象
  choice: 工匠信靠他所雕刻的偶像本身
  alternative: 较概括地译为信靠自己的手艺或作品
  rationale: עָלָיו 的单数代词直接回指所造之物，故主文明确译为“信靠它”。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。主文保留先知式反问和讽刺，并用破折号标示同位说明；避免传统译语“哑巴偶像”可能产生的现代歧义，改用“不能说话的偶像”。
