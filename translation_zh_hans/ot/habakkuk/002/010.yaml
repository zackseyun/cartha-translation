  text: יָעַ֥צְתָּ בֹּ֖שֶׁת לְ/בֵיתֶ֑/ךָ קְצוֹת עַמִּ֥ים רַבִּ֖ים וְ/חוֹטֵ֥א נַפְשֶֽׁ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/002/010.yaml
  text: You have devised shame for your house by cutting off many peoples[a], and have sinned against your own life.
translation:
  language: zh_hans
  text: 你因剪除许多民族，为自己的家图谋羞耻，也得罪了自己的性命[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “自己的性命”也可译作“自己”或“自己的魂”。
    reason: 保留נֶפֶשׁ在此处“生命、自身、魂”的词义范围。
lexical_decisions:
- source_word: יָעַצְתָּ
  choice: 谋来
  rationale: 该词为יעץ的Qal完成时第二人称阳性单数，在此指有意谋划；结合“羞辱”这一结果，译作“谋来”既保留蓄意性，也使现代汉语自然。
- source_word: בֹּשֶׁת
  choice: 羞辱
  rationale: 表示羞耻、耻辱，兼具道德败坏与公开蒙羞的意味；“羞辱”可自然地与“为自己的家谋来”搭配。
- source_word: לְבֵיתֶךָ
  choice: 为自己的家
  rationale: בַּיִת可指房屋、家族或王朝；“家”保留其语义宽度，不限定为住宅、家属或 dynastic line。
- source_word: קְצוֹת
  choice: 剪除
  rationale: 此处意为使之终止、铲除或灭绝；“剪除”保留先知文体的力度，也能表达对众多民族的毁灭性行动。
- source_word: עַמִּים רַבִּים
  choice: 许多民族
  rationale: עַמִּים是多个人民共同体；“民族”在现代汉语中自然，且不像“国家”那样引入现代国家概念。
- source_word: וְחוֹטֵא
  choice: 也得罪了
  rationale: Qal主动分词在完成时动词之后具有连续的谓语作用；译为并列谓语，保留控诉语气。
- source_word: נַפְשֶׁךָ
  choice: 自己的性命
  rationale: נֶפֶשׁ可指生命、性命、自身或魂；审判语境强调其恶行反害自身生命。“性命”具体而不引入后期身魂二分观。
theological_decisions:
- issue: 先知审判语境中נֶפֶשׁ的含义
  choice: 自己的性命
  alternative: 自己的魂；自己
  rationale: 上下文指出暴行最终反噬施暴者；“性命”传达具体的生命后果，同时脚注保留“自己”等可能译法，避免把该词固定为技术性的人论术语。
- issue: “家”的指涉范围
  choice: 自己的家
  alternative: 自己的家族；自己的王朝
  rationale: 原文可涵盖居所、家族、家业或王朝。正文采用宽泛的“家”，不将审判对象过早限定为某一种含义。
translation_notes:
  register: 采用庄重而清晰的现代标准汉语。“剪除”保留先知审判语言的力度；“家”和“性命”避免过度解释。脚注标记[a]置于相关短语之后。
