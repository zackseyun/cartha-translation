  text: וַֽ/יהוָ֖ה בְּ/הֵיכַ֣ל קָדְשׁ֑/וֹ הַ֥ס מִ/פָּנָ֖י/ו כָּל הָ/אָֽרֶץ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/002/020.yaml
  text: But Yahweh is in his holy temple[c][b][a]; let all the earth be silent before him.
translation:
  language: zh_hans
  text: 但雅威在他的圣殿中；全地当在他面前肃静！[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “肃静”也可译作“静默”或“不要作声”。
    reason: lexical_alternative
  - marker: b
    text: “全地”也可能在较窄的语境中指“整个国土”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיהוָה
  choice: 但雅威
  rationale: 连接词在此承接上一节对无生命偶像的讽刺，宜按语境译为转折性的“但”；יהוה按其专名译作“雅威”。
- source_word: בְּהֵיכַל קָדְשׁוֹ
  choice: 在他的圣殿中
  rationale: הֵיכָל可指殿、宫殿或圣所；这里与偶像庙宇形成对照，“圣殿”既自然又保留敬拜语境，同时不限定为地上的或天上的具体场所。希伯来语无系词句在中文中可直接表达。
- source_word: הַס
  choice: 肃静
  rationale: 该感叹词带有命令意味，要求人在神面前安静无声；“肃静”兼具简洁、庄严和敬畏色彩。
- source_word: מִפָּנָיו
  choice: 在他面前
  rationale: 按希伯来语“面／临在”的惯用表达译出，既自然，也保留处于神临在之中的意味。
- source_word: כָּל הָאָרֶץ
  choice: 全地
  rationale: אֶרֶץ既可指全地，也可较窄地指一片土地；本句作为神谕高潮，很可能具有普世范围，但正文采用“全地”以保留中文中相近的范围弹性。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；音译“雅威”保留其作为盟约专名的性质，避免以称号取代专名。
- issue: הֵיכָל所指的神之居所
  choice: 圣殿
  alternative: 圣所；圣宫
  rationale: “圣殿”符合先知书的敬拜语境及与偶像的对照，同时不武断判定这里专指地上圣殿还是天上居所。
- issue: כָּל הָאָרֶץ的范围
  choice: 全地
  alternative: 全世界；整个国土
  rationale: 原词可有普世或地域性含义；“全地”忠实保留这种潜在张力，而语境自然容许读作普世性的呼召。
translation_notes:
  register: 采用现代、庄严而易懂的普通话。“但”突显与上一节哑默偶像的对比；末句用感叹号传达 הַס 作为命令性呼声的力度。所有脚注标记均置于相关正文之后。
