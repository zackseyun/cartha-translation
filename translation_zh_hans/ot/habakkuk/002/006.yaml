  text: הֲ/לוֹא אֵ֣לֶּה כֻלָּ֗/ם עָלָי/ו֙ מָשָׁ֣ל יִשָּׂ֔אוּ וּ/מְלִיצָ֖ה חִיד֣וֹת ל֑/וֹ וְ/יֹאמַ֗ר ה֚וֹי הַ/מַּרְבֶּ֣ה לֹּא ל֔/וֹ עַד מָתַ֕י וּ/מַכְבִּ֥יד עָלָ֖י/ו עַבְטִֽיט־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/002/006.yaml
  text: Will not all of these take up a taunt against him[a], with mockery and riddles about him, and say, “Woe to him who heaps up what is not his—how long?—and loads himself with pledged goods!”
translation:
  language: zh_hans
  text: '这些人岂不都要吟唱讥讽他的话，以讥讽的谜语攻击他，说：


    “祸哉！那堆积非己之物的人——要到几时呢？


    又使自己背负抵押之物的人！[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “抵押之物”或译“厚泥”。原文这个词十分罕见，可能在债务抵押物与压在人身上的沉重泥块之间形成双关。
    reason: lexical_alternative
lexical_decisions:
- source_word: מָשָׁל
  choice: 讥讽的话
  rationale: 在先知审判语境中，此词并非普通箴言，而是针对压迫者的嘲讽性言辞；此译既保留其言说形式，也表达贬斥功能。
- source_word: יִשָּׂאוּ
  choice: 编出
  rationale: 与 מָשָׁל 连用，表示提出、吟诵或说出一段正式言辞；汉语“编出……的话”自然地传达众人构成并发出讥讽之语。
- source_word: מְלִיצָה חִידוֹת
  choice: 嘲弄和谜语
  rationale: 两词共同描写带有讥刺意味、含蓄尖锐而如谜的言辞；并列翻译保留原文表达的层次和“谜语”的意象。
- source_word: הוֹי
  choice: 祸哉
  rationale: 这是先知书中兼具哀叹与宣告审判意味的感叹词；“祸哉”庄重且能保留祸患宣告的语气。
- source_word: הַמַּרְבֶּה לֹּא לוֹ
  choice: 那堆积非己之物的人
  rationale: 保留“增多、积聚”及“不属于自己”的道德指向，突出不义攫取。
- source_word: עַד מָתַי
  choice: 要到几时呢？
  rationale: 保留原文突然插入的抗议性问句及其不耐、控诉的力度。
- source_word: וּמַכְבִּיד עָלָיו
  choice: 那把……重重压在自己身上的人
  rationale: 保留使其沉重、加在自己身上的反讽意象：压迫者所积聚之物最终成为自己的重担。
- source_word: עַבְטִיט
  choice: 抵押之物
  rationale: 这是罕见词；按借贷、抵押的语境理解，契合本段对掠夺和剥削性积聚的谴责，同时以脚注保留“厚泥”的传统释法及可能的双关。
theological_decisions:
- issue: 罕见词 עַבְטִיט 的解释
  choice: 正文采用经济意象“抵押之物”
  alternative: “厚泥”
  rationale: 上下文谴责靠掠夺、勒索而积聚财富，经济性解释较为贴切；但词义并不确定，“厚泥”又可能保留所积之物反成重担的双关，因此不在正文中排除，而列入脚注。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。正文以诗行呈现祸患宣告；“祸哉”保留先知性审判语气，“要到几时呢？”保留原文突兀的插问。脚注标记已置于相关诗句末尾。
