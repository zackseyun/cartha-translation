  text: שָׂבַ֤עְתָּ קָלוֹן֙ מִ/כָּב֔וֹד שְׁתֵ֥ה גַם אַ֖תָּה וְ/הֵֽעָרֵ֑ל תִּסּ֣וֹב עָלֶ֗י/ךָ כּ֚וֹס יְמִ֣ין יְהוָ֔ה וְ/קִיקָל֖וֹן עַל כְּבוֹדֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/002/016.yaml
  text: You have had your fill of shame instead of glory. Drink, you also, and show your uncircumcision! The cup from the LORD’s right hand will come around to you, and utter disgrace will be upon your glory.
translation:
  language: zh_hans
  text: 你已饱受羞辱，而非荣耀。你也喝吧，显出你未受割礼的样子！[a]耶和华右手的杯必转向你；极大的耻辱必加在你的荣耀之上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “显出你未受割礼的样子”：原文为罕见的命令形式，按马所拉文本可理解为显露未受割礼的状态；另有文本和释义传统将其理解为“踉跄”或“摇晃”。
    reason: 此处词形与词义存在重要的文本及释义分歧。正文依所给马所拉文本，同时以脚注保留另一种可能，避免将争议消隐。
lexical_decisions:
- source_word: שָׂבַעְתָּ קָלוֹן מִכָּבוֹד
  choice: 你饱受羞辱，荣耀尽失
  rationale: שׂבע 表示“饱足、充满”；מִן 在这里构成羞辱与荣耀的强烈反差。此译保留“饱受”的意象，并用“荣耀尽失”自然表达“所得不是荣耀，而是羞辱”。
- source_word: וְהֵעָרֵל
  choice: 露出你未受割礼之处
  rationale: 按马所拉文本，词形来自“未受割礼”，语境又涉及醉酒后的暴露，因此用具体而不粗俗的表达传达命令语气。
- source_word: כּוֹס יְמִין יְהוָה
  choice: 耶和华右手中的杯
  rationale: 保留“杯”作为审判与所受命运的意象，也保留“右手”这一原文细节。
- source_word: וְקִיקָלוֹן
  choice: 极大的耻辱
  rationale: 这是罕见词，基本含义为可耻、羞辱；以“极大的”表达其强化色彩，不把有争议的词源联想写进正文。
- source_word: עַל כְּבוֹדֶךָ
  choice: 遮盖你的荣耀
  rationale: עַל 的字面空间关系是“在……之上”；“遮盖”在中文中自然呈现耻辱压在并掩没荣耀之上的图景。
theological_decisions:
- issue: “耶和华右手中的杯”的审判主体
  choice: 保留耶和华亲自递出审判之杯的形象
  alternative: 泛化为“灾祸将临到你”
  rationale: 原文明确把杯与耶和华的右手相连；不应淡化神施行审判的表述。
- issue: וְהֵעָרֵל 的文本歧义
  choice: 正文依照WLC马所拉文本译为“露出你未受割礼之处”
  alternative: 按少数字母次序调整及部分古译理解为“踉跄”或“摇晃”
  rationale: 以所给希伯来文本为正文依据，同时用脚注说明真实存在的文本与释义分歧，不以释经判断静默取代原文。
translation_notes:
  register: 采用现代、庄重而清楚的普通话。“露出你未受割礼之处”刻意保留原文涉及醉酒、赤裸与羞耻的尖锐意象；全节以“羞辱—荣耀—耻辱—荣耀”的反复维持修辞张力。神名按中文圣经通行形式译作“耶和华”。
