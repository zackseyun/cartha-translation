id: HAB.2.3
reference: Habakkuk 2:3
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּ֣י ע֤וֹד חָזוֹן֙ לַ/מּוֹעֵ֔ד וְ/יָפֵ֥חַ לַ/קֵּ֖ץ וְ/לֹ֣א יְכַזֵּ֑ב אִם יִתְמַהְמָהּ֙ חַכֵּה ל֔/וֹ כִּֽי בֹ֥א יָבֹ֖א לֹ֥א יְאַחֵֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/002/003.yaml
  text: For the vision is still for the appointed time[a]; it hastens toward the end and will not lie. If it delays, wait for it, for it will surely come[b]; it will not be late.
translation:
  language: zh_hans
  text: 因为这异象仍关乎所定的时期；它迫切地趋向终局[a]，绝不虚假。即使迟延，也要等候它[b]；因为它必定来到，绝不误期。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “迫切地趋向”所译的希伯来语动词含义较难确定；也可理解为“喘息着奔向终局”或“宣告终局”。正文表达异象迫切趋向所定应验的意思。
    reason: lexical_alternative
  - marker: b
    text: 或译：“也要等候他。”希伯来语代词是阳性单数，按本节语境最自然地回指“异象”；但也可作人格化理解。《希伯来书》10:37以人格化方式应用这句话。
    reason: alternative_reading
lexical_decisions:
- source_word: חָזוֹן
  choice: 异象
  rationale: 这是先知性启示的常用译法，也与上文要求哈巴谷把异象写下来的语境相符。
- source_word: לַמּוֹעֵד
  choice: 等到指定的时间
  rationale: מוֹעֵד指预先确定的时刻；此译法既保留时间已被指定的含义，也符合现代汉语表达。
- source_word: וְיָפֵחַ
  choice: 急奔
  rationale: 该动词含义有疑难，可能描写喘息、迫切前行，也可能表示说出或宣告。正文采用带有拟人色彩的“急奔”，表达异象正迫切趋向实现；其他可能译法收入脚注。
- source_word: לַקֵּץ
  choice: 向着终局
  rationale: קֵץ指终点、结局或应验之时；“终局”既可指事件的终结，也可指异象最终实现的时刻。
- source_word: וְלֹא יְכַזֵּב
  choice: 绝不虚假
  rationale: 原文直指不说谎、不落空；“绝不虚假”保留异象被拟人化的表达，并说明其内容可靠。
- source_word: אִם יִתְמַהְמָהּ
  choice: 即使迟延
  rationale: 动词表示耽搁、迟延。条件句在语境中带让步意味；“即使”自然呈现人看来似乎延迟与下文绝不误期之间的张力。
- source_word: חַכֵּה לוֹ
  choice: 要等候它
  rationale: 阳性单数代词在本节语境中最自然地回指同为阳性单数的“异象”。汉语用“它”表达非人格所指，同时在脚注保留人格化理解。
- source_word: כִּי בֹא יָבֹא
  choice: 因为它必定来到
  rationale: 不定式绝对式与限定动词连用，加强必然性；“必定来到”传达这一强调。
- source_word: לֹא יְאַחֵר
  choice: 绝不误期
  rationale: 原文意为不迟到、不延误。“误期”与前面的“指定的时间”呼应，也保留表面迟延却不会错过所定时刻的张力。
theological_decisions:
- issue: 本节后半部分代词的所指
  choice: 正文主要理解为异象及其应验，用“它”表示。
  alternative: 也可作人格化理解，译为“他”；《希伯来书》10:37以人格化方式引用或应用这句话。
  rationale: 希伯来文中最近的先行词חָזוֹן（“异象”）是阳性单数名词，因此在哈巴谷书本身的语境里，回指异象最为自然。后来的经文接受史具有神学意义，但不应反过来取代本节正文最直接的语法所指，故将人格化读法保留在脚注。
- issue: “迟延”与“绝不误期”的表面张力
  choice: 保留两者，不将前句弱化为纯粹主观感受。
  alternative: 可译作“即使看似迟延”，以明确说明只是在人看来迟延。
  rationale: 原文先说可能迟延，随后又断言不会延误；这种张力强调人必须等候，同时异象必按所定时间实现。正文不额外加入“看似”，避免替原文消解张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“异象”“指定的时间”“终局”等词保留先知文本的正式语体；“急奔”延续原文对异象的拟人化。“即使迟延……绝不误期”刻意保留原文的修辞与神学张力。脚注标记均已在正文相应位置出现。
