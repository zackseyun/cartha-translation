  yaml_path: translation/ot/habakkuk/002/011.yaml
  text: For a stone will cry out from the wall, and a beam from the woodwork will answer it.
translation:
  language: zh_hans
  text: 因为墙中的石头必呼喊，木构中的梁必回应它。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֶבֶן מִקִּיר
  choice: 墙里的石头
  rationale: מִן在此表示石头发声之处；译作“墙里的”比生硬的“从墙中”更符合现代汉语，同时保留石头作为见证者呼喊的意象。
- source_word: תִּזְעָק
  choice: 必呼喊
  rationale: 该动词表示大声呼叫、喊冤或求告；“呼喊”保留强烈而拟人化的语气。未完成式在本句警告语境中表达必然发生之事，故用“必”。
- source_word: כָפִיס מֵעֵץ
  choice: 木构中的横梁
  rationale: כָפִיס是建筑中的木质构件，具体形制不完全确定；结合מֵעֵץ，译为“木构中的横梁”，既传达建筑语境，也避免过度限定为椽子等特定构件。
- source_word: יַעֲנֶנָּה
  choice: 必回应它
  rationale: ענה在此意为回答；阴性宾语后缀指前面的“石头”。“回应它”自然呈现两个建筑构件彼此作证的拟人画面。
theological_decisions:
- issue: 建筑材料呼喊并彼此回应的拟人意象
  choice: 按字面意象译出，不解释其所指控的罪或见证方式
  alternative: 意译为“墙和木料都要作证控告你”
  rationale: 原文以石头呼喊、木梁回答的诗性形象表达审判见证；直译可保留先知话语的张力，并避免将经文中隐含的解释直接写入正文。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“木构”简洁指建筑中的木质结构；全句保持两分句平行和拟人化的审判语气。
