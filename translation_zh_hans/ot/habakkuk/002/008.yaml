  terminology: “抢掠”在首尾重复，良好保留同源动词的修辞反转。“国家／各族”适度反映 גּוֹיִם 与 עַמִּים 的词汇转换。“使人流血”和脚注避免把 אָדָם 误限为男性，表述妥当。
