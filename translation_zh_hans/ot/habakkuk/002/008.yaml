base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/002/008.yaml
  text: Because you have plundered many nations[a], all the remnant of the peoples will plunder you—because of human blood and violence done to the land, to the city, and to all who dwell in it.
translation:
  language: zh_hans
  text: 因为你抢掠了许多国家，各族中所有剩下的人都必抢掠你；这是因你使人流血[a]，又以暴力摧残土地、城邑和其中所有居民。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “使人流血”直译为“人的血”，也可译作“杀害人命”。
    reason: 保留 דְּמֵי אָדָם 的字面血液意象及其“流血杀人”的惯用含义。
lexical_decisions:
- source_word: שַׁלּוֹתָ / יְשָׁלּוּךָ
  choice: 抢掠了／必抢掠你
  rationale: 两个动词同源，均指以武力夺取财物；前后使用同一译词，保留“抢掠者反被抢掠”的报应性反转。
- source_word: גּוֹיִם רַבִּים
  choice: 许多国家
  rationale: 这里处于列国与帝国争战的语境，“国家”自然表达其政治群体含义。
- source_word: כָּל יֶתֶר עַמִּים
  choice: 各族所有余剩的人
  rationale: “余剩的人”保留 יֶתֶר 所指的剩余者，并用“各族”反映 עַמִּים 与前句 גּוֹיִם 的词汇变化。
- source_word: מִדְּמֵי אָדָם
  choice: 因你使人流血
  rationale: מן 按因果关系译为“因”；希伯来语复数“血”在此是流血杀人的惯用表达，译作“使人流血”既自然，也保留行为及其罪责。
- source_word: וַחֲמַס
  choice: 又以暴力摧残
  rationale: חָמָס 可指暴力、强暴和严重不义；“以暴力摧残”在汉语中自然交代它与后列对象的关系。
- source_word: אֶרֶץ קִרְיָה וְכָל יֹשְׁבֵי בָהּ
  choice: 大地、城邑和其中所有居民
  rationale: 依次保留三个受暴力侵害的对象；“城邑”庄重而通晓，“其中”按就近关系指城邑。
theological_decisions:
- issue: דְּמֵי אָדָם 的泛指人类表达
  choice: 使人流血
  alternative: 人的血／杀害人命
  rationale: אָדָם 在这里泛指人，并非特指男性；“使人流血”忠实传达希伯来语的血债意象，同时避免在现代汉语中造成性别限定。
- issue: 暴力所针对对象的范围
  choice: 大地、城邑和其中所有居民均为“摧残”的对象
  alternative: 把“大地的暴力”理解为发生在地上的暴行
  rationale: 希伯来语短语较为省略；并列结构最自然地把土地、城邑及居民都视作暴力侵害的对象，但不进一步限定为某一特定城市或国家。
translation_notes:
  register: 采用现代、庄重且易懂的书面汉语。“抢掠”保留经文首尾的同词反转；分号呈现罪行与报应之间的因果关系。
