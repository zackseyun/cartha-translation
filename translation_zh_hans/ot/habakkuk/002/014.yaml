id: HAB.2.14
reference: Habakkuk 2:14
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּ֚י תִּמָּלֵ֣א הָ/אָ֔רֶץ לָ/דַ֖עַת אֶת כְּב֣וֹד יְהוָ֑ה כַּ/מַּ֖יִם יְכַסּ֥וּ עַל יָֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/002/014.yaml
  text: For the earth will be filled with the knowledge of the glory of Yahweh[a], as the waters cover the sea.
translation:
  language: zh_hans
  text: 因为大地必充满对耶和华荣耀的认识，正如水覆盖海洋。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “大地”也可译作“这地”或“土地”；这里按本节较为普世的语境译作“大地”。
    reason: 保留הָאָרֶץ既可指全地、也可指特定地域的词义范围。
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，为先前的审判宣告提供依据或解释；“因为”在现代汉语中自然保留其因果连接作用。
- source_word: תִּמָּלֵא
  choice: 必充满
  rationale: 该词为未完成时尼法勒式，表达将来的被动或结果状态；“必充满”既保留将来确定性，也符合中文表达。
- source_word: הָאָרֶץ
  choice: 大地
  rationale: אֶרֶץ也可指一片地域，但本节的异象具有普世幅度；“大地”自然表达整体世界，同时保留庄重语体。
- source_word: לָדַעַת אֶת כְּבוֹד
  choice: 对……荣耀的认识
  rationale: 不定式结构在“充满”之后具有名词性含义；译作“对耶和华荣耀的认识”，比直接译为“知道”更贴近原文结构。
- source_word: כְּבוֹד
  choice: 荣耀
  rationale: 用于耶和华时，כבוד指其彰显的尊荣、威严和荣美；“荣耀”是准确而通行的对应词。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代简体中文读者熟悉的专名形式呈现四字神名，使其与“主”这一称号有所区别。
- source_word: כַּמַּיִם יְכַסּוּ עַל יָם
  choice: 正如水覆盖海洋
  rationale: 保留比较句及其一般性图景；עַל不必机械译作“在……之上”，因“覆盖海洋”已自然传达其空间关系。
theological_decisions:
- issue: הָאָרֶץ的范围
  choice: 译为具有普世意义的“大地”
  alternative: 译为地域性的“这地”或“土地”
  rationale: 海水覆盖海洋的比喻及本节宏阔的先知性图景支持普世范围；不过原词本身也可指特定地域，因此以脚注保留这一词义可能。
- issue: 神名יְהוָה的呈现
  choice: 耶和华
  alternative: 雅威；以“主”代称
  rationale: 正文保留专名性质而不以称号替代；“耶和华”是现代中文圣经语境中最易识别且庄重的形式，不据此引入额外的宗派立场。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“必充满”表达先知宣告的确定性；“正如”使比喻衔接清楚。脚注标记置于整节末尾，说明“大地”的另一种可能译法。
