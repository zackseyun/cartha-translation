  yaml_path: translation/ot/habakkuk/002/007.yaml
  text: Will not your creditors suddenly rise[a], and those who make you tremble awake? Then you will become plunder for them.
translation:
  language: zh_hans
  text: 那些向你讨债的，岂不突然起来[a]？使你战栗的人，岂不醒来？那时，你必成为他们的掠物。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “向你讨债的”希伯来文直译为“咬你的人”。这里可能有意兼具咬噬的攻击者和追索债款者两层意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלוֹא
  choice: 岂不
  rationale: 引出预期肯定回答的反问，并与后面的未完成式动词相配，保留审判必将临到的语气。
- source_word: פֶתַע
  choice: 突然
  rationale: 简洁自然地表达事情猝然发生。
- source_word: יָקוּמוּ
  choice: 起来
  rationale: 保留קום的基本动作意象；语境自然含有起来攻击之意，无须在正文中增译。
- source_word: נֹשְׁכֶיךָ
  choice: 那些向你讨债的
  rationale: 该词源于“咬”，但在此可指追索债务的人；“向你讨债的”既符合掠夺者遭报应的上下文，也保留动作感。字面的咬噬意象收入脚注。
- source_word: וְיִקְצוּ
  choice: 醒来
  rationale: 按יקץ“醒来”理解，与“起来”构成诗歌平行，并描绘敌对者忽然行动。
- source_word: מְזַעְזְעֶיךָ
  choice: 那些使你战栗的
  rationale: 体现使人震动、惊惧的使役意味，同时保持生动而不过度解释。
- source_word: וְהָיִיתָ
  choice: 那时，你必成为
  rationale: “那时”自然表达前两问所导致的结果；“必”传达反问所强调的确定性。
- source_word: לִמְשִׁסּוֹת
  choice: 掠物
  rationale: 指被夺取的战利品或劫掠之物；“掠物”简洁地呈现掠夺者反成被掠者的逆转。
- source_word: לָמוֹ
  choice: 他们的
  rationale: 以现代汉语所属结构自然表达“给他们、归他们作掠物”的关系。
