  text: הֲ/ל֣וֹא הִנֵּ֔ה מֵ/אֵ֖ת יְהוָ֣ה צְבָא֑וֹת וְ/יִֽיגְע֤וּ עַמִּים֙ בְּ/דֵי אֵ֔שׁ וּ/לְאֻמִּ֖ים בְּ/דֵי רִ֥יק יִעָֽפוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/002/013.yaml
  text: Is it not indeed from Yahweh of hosts that peoples labor for fire[b][a], and nations weary themselves for emptiness?
translation:
  language: zh_hans
  text: 看哪，这岂不是出于万军之雅威吗？万民为火劳碌[a]；列邦为虚空而疲惫[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“为那火劳碌。”此语也可指他们劳碌的成果终将被火吞灭。
    reason: lexical_alternative
  - marker: b
    text: 或译：“徒然”或“为一无所有而疲惫”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלוֹא הִנֵּה
  choice: 看，这岂不正是
  rationale: “岂不”保留期待肯定回答的反问语气；“看”和“正是”共同传达 הִנֵּה 的提示与强调作用，同时避免过于古雅的表达。
- source_word: מֵאֵת
  choice: 出于
  rationale: 表示来源或所定结局的出处；“出于”在现代汉语中自然，也不把经文扩展成对恶念之道德来源的说明。
- source_word: יְהוָה צְבָאוֹת
  choice: 万军之雅威
  rationale: “雅威”直接音译神圣四字名；“万军”保留 צְבָאוֹת 的广泛含义，不将其限缩为地上的军队。
- source_word: וְיִיגְעוּ עַמִּים
  choice: 众民劳碌
  rationale: “劳碌”体现费力劳作；“众民”与下句的“列邦”形成平行而有区别的对应。
- source_word: בְּדֵי אֵשׁ
  choice: 所得只供火烧
  rationale: 该短语表达劳作最终成为火的材料或被火吞灭；正文用自然汉语显出徒劳的结局，脚注保留较直译的可能。
- source_word: וּלְאֻמִּים ... יִעָפוּ
  choice: 列邦竭力至疲
  rationale: יִעָפוּ 表达因竭力而疲乏、耗尽自己；“竭力至疲”保留主动劳苦及其结果。
- source_word: בְּדֵי רִיק
  choice: 却归于虚空
  rationale: רִיק 可指空无、徒然或毫无所得；“归于虚空”既保留意象，也表达列邦劳苦的无效结局。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；采用“雅威”以音译方式保留其专名性质，不以头衔代替。
- issue: “出于万军之雅威”的因果力度
  choice: 保留结局出于雅威的陈述，不说明雅威是列邦恶行的道德作者
  alternative: 弱化为雅威仅仅知道此事，或强化为雅威直接产生列邦的恶欲
  rationale: מֵאֵת 表示来源，而反问强调这一现实出于雅威；上下文指向神所定的审判结局。译文保留这种神学张力，不在正文中作超出原文的解释。
- issue: 列邦劳作与毁灭、虚空的关系
  choice: 将其劳苦呈现为最终被火吞灭并归于虚空
  alternative: 理解为列邦有意以火或虚空为劳作目标
  rationale: 平行结构着重其劳作的徒然结局；译文表达结果，但以脚注保存更贴近字面的形式。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“看，这岂不正是”保留先知话语的强调性反问；“众民／列邦”维持希伯来平行句中两个群体名词的词汇区别。
