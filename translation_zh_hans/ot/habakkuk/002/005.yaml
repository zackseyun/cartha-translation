id: HAB.2.5
reference: Habakkuk 2:5
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/אַף֙ כִּֽי הַ/יַּ֣יִן בּוֹגֵ֔ד גֶּ֥בֶר יָהִ֖יר וְ/לֹ֣א יִנְוֶ֑ה אֲשֶׁר֩ הִרְחִ֨יב כִּ/שְׁא֜וֹל נַפְשׁ֗/וֹ וְ/ה֤וּא כַ/מָּ֨וֶת֙ וְ/לֹ֣א יִשְׂבָּ֔ע וַ/יֶּאֱסֹ֤ף אֵלָי/ו֙ כָּל הַ/גּוֹיִ֔ם וַ/יִּקְבֹּ֥ץ אֵלָ֖י/ו כָּל הָ/עַמִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/002/005.yaml
  text: Moreover[a], wine betrays; an arrogant man does not remain at rest. He enlarges his appetite like Sheol, and he is like death and is never satisfied[c][b]. He gathers to himself all the nations and collects to himself all the peoples.
translation:
  language: zh_hans
  text: 况且[a]，酒是诡诈的；狂傲的人不得安居[b]。他使自己的胃口大如阴间[c]，又像死亡一样永不满足。他把列国全都聚到自己那里，把万民全都聚拢到自己那里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“的确”。原文开头的连接语简洁，可表示递进或强调。
    reason: lexical_alternative
  - marker: b
    text: 或译“不能安定下来”“不住在家中”。原文动词含义有难度，可指居住、停留或安定。
    reason: lexical_alternative
  - marker: c
    text: “阴间”指死者所在的领域；也可译作“坟墓”。
    reason: cultural_note
lexical_decisions:
- source_word: וְאַף כִּי
  choice: 况且
  rationale: 这一组合在此主要起递进、强调和承接作用；“况且”自然地引出进一步的指控，又不把它强解为因果关系。
- source_word: הַיַּיִן בּוֹגֵד
  choice: 酒是诡诈的
  rationale: 保留原文明确提到的“酒”，并以拟人化表达呈现 בּוֹגֵד 所含的欺骗、背信意味；没有把酒与狂傲征服者之间的关系解释得过死。
- source_word: גֶּבֶר יָהִיר
  choice: 狂傲的人
  rationale: גֶּבֶר 在这里泛指受审判的人；יָהִיר 带有自大、放肆的贬义，“狂傲”能传达其道德色彩。
- source_word: וְלֹא יִנְוֶה
  choice: 不得安居
  rationale: 该动词含义有难度，可指居住、停留或安定；“不得安居”既保留居处层面的可能含义，也符合上下文中躁动扩张、不能自足的形象。
- source_word: הִרְחִיב כִּשְׁאוֹל נַפְשׁוֹ
  choice: 使自己的胃口大如阴间
  rationale: הִרְחִיב 表示使之宽大；נֶפֶשׁ 在此指吞噬性的欲求。“胃口”以自然汉语传达贪得无厌的比喻，同时“阴间”保留死亡领域永不餍足的源语意象。
- source_word: וְהוּא כַמָּוֶת וְלֹא יִשְׂבָּע
  choice: 又像死亡一样永不满足
  rationale: 直接保留与死亡的明喻；“永不满足”表达未完成式所呈现的持续、惯常状态。
- source_word: וַיֶּאֱסֹף אֵלָיו כָּל הַגּוֹיִם וַיִּקְבֹּץ אֵלָיו כָּל הָעַמִּים
  choice: 把列国全都聚到自己那里，把万民全都招集到自己那里
  rationale: 保留两个近义平行分句及反复出现的“到自己那里”，呈现征服者不断吞并各国各民的图景。
theological_decisions:
- issue: שְׁאוֹל 的译法
  choice: 阴间
  alternative: 坟墓；死者的领域
  rationale: 这里指以色列古代语言中死者所在的领域，并借其永不满足来作比喻。“阴间”是现代中文圣经语境中较简洁而熟悉的对应词，且比“坟墓”更少缩减原文的广度。
- issue: 酒与狂傲者之间的关系
  choice: 以分号并列，保留两者关联而不明确等同
  alternative: 把“酒”直接解释为征服者因酒而狂妄，或把“酒”视为文本问题而弱化
  rationale: 原文简短且句法不易确定。译文保留“酒是诡诈的”这一明文，同时让下句转向狂傲者，避免擅自确定酒究竟是独立箴言、致使其狂妄的因素，还是征服者的象征。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“诡诈”“狂傲”“阴间”保留先知诗歌的严肃语气；“胃口大如阴间”则用自然汉语呈现吞噬性欲望。两个末尾分句保持平行和重复，以延续希伯来诗句的节奏。
