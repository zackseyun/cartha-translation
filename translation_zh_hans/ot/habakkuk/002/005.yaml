  naturalness: 整体庄重自然。“不得安居”在经文语体中可接受，并且脚注恰当地说明了该困难动词的其他理解。末尾两句改为“聚拢”后更顺畅，也保留原文两个近义动词的平行。
  terminology: “阴间”适合保留שְׁאוֹל所指的死者领域，脚注的文化说明也足够中性。“狂傲”“诡诈”“列国”“万民”均符合先知文本的现代中文庄重语域。
