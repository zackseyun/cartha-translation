id: HAB.2.15
reference: Habakkuk 2:15
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: ה֚וֹי מַשְׁקֵ֣ה רֵעֵ֔/הוּ מְסַפֵּ֥חַ חֲמָתְ/ךָ֖ וְ/אַ֣ף שַׁכֵּ֑ר לְמַ֥עַן הַבִּ֖יט עַל מְעוֹרֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/002/015.yaml
  text: Woe to him who makes his neighbor drink[a], pouring out your wrath and even making him drunk[c][b], in order to look on their nakedness.
translation:
  language: zh_hans
  text: 祸哉！那使邻舍喝酒的人，又加上你的烈怒[a]，甚至使他喝醉[b]，为要观看他们的赤身[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “烈怒”也可译作“毒液”。这一短语的希伯来文较难；也有人按不同理解译作“加上你的瓶子”等。原文在第三人称叙述中突然用了“你的”。
    reason: 保留 חֵמָה 的词义范围、מְסַפֵּחַ 的解释困难及人称转换。
  - marker: b
    text: 原文直译为“甚至使之喝醉”；受词没有明说，按上文译作“他”。
    reason: 说明希伯来文省略受词，中文为通顺而补出代词。
  - marker: c
    text: “赤身”也可译作“私处”。原文这里用复数“他们的”，与前面的单数“邻舍”和“他”并不一致。
    reason: 保留该词更具体的身体含义，并指出原文数的转换。
lexical_decisions:
- source_word: הוֹי
  choice: 祸哉
  rationale: 这是先知宣告审判时的感叹词；“祸哉”庄重、简明，也符合现代中文圣经语体。
- source_word: מַשְׁקֵה
  choice: 叫……喝酒
  rationale: 使役分词表示使某人饮用；上下文随即提到醉酒，因此明说“酒”可自然传达所指，同时保留使役意味。
- source_word: רֵעֵהוּ
  choice: 邻舍
  rationale: 该词可指邻人、同伴或身边的人；“邻舍”保留先知伦理谴责中的人际关系意味。
- source_word: מְסַפֵּחַ
  choice: 掺进去
  rationale: 此词形和句法较难，基本意象可能是添加、附加或倒入某物；“掺进去”贴合使人饮酒的场景，又不把动作说得过于确定。
- source_word: חֲמָתְךָ
  choice: 你的烈怒
  rationale: חֵמָה通常表示烈怒、怒气或热力，也可能带有毒液之意；正文采用常见义，并以脚注保留语境中的另一可能。
- source_word: וְאַף שַׁכֵּר
  choice: 甚至使他喝醉
  rationale: וְאַף带有递进、加强语气，שַׁכֵּר表示使人醉；此译清楚呈现行为的升级。
- source_word: לְמַעַן הַבִּיט
  choice: 为要观看
  rationale: לְמַעַן明确表达目的，הַבִּיט表示观看、注视；“为要观看”保留蓄意窥视和羞辱的意味。
- source_word: מְעוֹרֵיהֶם
  choice: 他们的赤身
  rationale: 该词指暴露的裸体，可能更具体地涉及私处；“赤身”既保留羞辱性裸露的含义，也避免无根据地进一步具体化。
theological_decisions:
- issue: 第三人称祸哉句中突然出现 חֲמָתְךָ 的第二人称后缀
  choice: 正文保留“你的烈怒”的人称转换
  alternative: 按文意调整为“他的烈怒”，或把该词理解为与酒器、毒液有关的表达，以消除人称突变
  rationale: 马所拉文本确有醒目的第二人称形式。保留这一转换，不暗中校正经文，同时用脚注说明原文困难及其他理解。
- issue: 从单数“邻舍／他”转为复数 מְעוֹרֵיהֶם“他们的赤身”
  choice: 保留“使他喝醉”与“他们的赤身”之间的数变化
  alternative: 为中文顺畅统一译作“他的赤身”
  rationale: 原文确实由单数对象转为复数后缀，可能具有集合性或文本上的困难；正文不擅自统一。
- issue: 醉酒与裸露所构成的羞辱意象
  choice: 译作“为要观看他们的赤身”
  alternative: “为要观看他们的私处”或“为要观看他们的羞耻”
  rationale: 原文谴责蓄意使人醉倒、暴露并观看其裸体的行为；所选译法保留道德与羞辱力度，却不额外加入经文未说明的性行为或教义解释。
translation_notes:
  register: 采用现代、庄重而易懂的先知性宣告语体。“祸哉”保留审判神谕的力度；句中避免古奥倒装。正文尽量保存马所拉文本的人称与数变化，并把词义和句法上的真实困难放入脚注。
