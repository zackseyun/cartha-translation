  to: 祸哉！那使邻舍喝酒的人，又加上你的烈怒[a]，甚至使他喝醉[b]，为要观看他们的赤身[c]。
  rationale: 仅作必要的措辞和脚注澄清。“又加上你的烈怒”保留原文困难处及其隐喻力度，避免原译“掺进去”的悬空宾语和过强的混合动作；其余的人称、数的突变及裸露羞辱意象均维持不变。
