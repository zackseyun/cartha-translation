  text: ה֣וֹי אֹמֵ֤ר לָ/עֵץ֙ הָקִ֔יצָ/ה ע֖וּרִי לְ/אֶ֣בֶן דּוּמָ֑ם ה֣וּא יוֹרֶ֔ה הִנֵּה ה֗וּא תָּפוּשׂ֙ זָהָ֣ב וָ/כֶ֔סֶף וְ/כָל ר֖וּחַ אֵ֥ין בְּ/קִרְבּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/002/019.yaml
  text: Woe to the one who says to wood[a], “Wake up!” and to silent stone, “Arise!” Can it teach? Look— it is overlaid with gold and silver, yet there is no breath at all within it.
translation:
  language: zh_hans
  text: 祸哉，那对木头说“醒来吧！”，又对无声的石头说“起来吧！”的人！它能教导人吗？看哪，它外面包着金银，里面却毫无气息[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“灵”。这里的希伯来词也可指“风”或“灵”；本句强调偶像里面没有生命。
    reason: 保留רוּחַ的词义歧义，并说明本处选择“气息”的语境依据。
lexical_decisions:
- source_word: הוֹי
  choice: 祸哉
  rationale: 引出先知性的谴责与审判宣告；“祸哉”既保留原文的强烈语气，也符合庄重的现代汉语经文体。
- source_word: אֹמֵר
  choice: 那……说……的人
  rationale: 将实词化分词译为具有特征性行为的单数人物，表达自然，并保留原文对拜偶像者的指斥。
- source_word: לָעֵץ
  choice: 对木头
  rationale: 这里指制造偶像的木质材料；直译“木头”简洁清楚，也与下文“石头”形成平行。
- source_word: הָקִיצָה
  choice: 醒来吧
  rationale: 这是对偶像发出的命令，带有讽刺意味；现代汉语中自然地表达从睡眠中醒来的命令。
- source_word: עוּרִי
  choice: 起来吧
  rationale: 与“醒来吧”平行而不完全重复，保留希伯来诗句中两个命令词的变化。
- source_word: לְאֶבֶן דּוּמָם
  choice: 对无声的石头
  rationale: דּוּמָם表示沉默、不能出声；“无声”清楚保留偶像无法说话回应的讽刺。
- source_word: הוּא יוֹרֶה
  choice: 它能教导人吗？
  rationale: 按上下文译作反问句，揭露期待偶像给予指引的荒谬；补出“人”使“教导”在汉语中更自然，但不限定具体对象。
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留原文引人注意的指示作用，并维持庄重而有力的语体。
- source_word: תָּפוּשׂ זָהָב וָכֶסֶף
  choice: 它包着金银
  rationale: 表达偶像被金银覆盖或包裹的状态；“包着”通俗自然，又避免过度指定具体的镀制工艺。
- source_word: וְכָל רוּחַ אֵין בְּקִרְבּוֹ
  choice: 里面却毫无气息
  rationale: רוּחַ在此主要强调偶像毫无生命；“气息”保留生命之气的意象，“毫无”传达כָל所加强的全然否定。
theological_decisions:
- issue: 末句רוּחַ的含义
  choice: 气息
  alternative: 灵；风
  rationale: 反偶像语境着重指出偶像没有生命，“气息”最直接地呈现这一对比，同时以脚注保留该希伯来词可指“灵”或“风”的词义范围，避免作不必要的形而上限定。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“祸哉”“看哪”保留先知宣告的力度；其余措辞尽量自然简洁。两个命令“醒来吧／起来吧”保留诗句的平行变化和对无生命偶像的讽刺。
