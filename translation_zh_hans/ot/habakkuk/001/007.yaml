source:
  edition: WLC
  text: אָיֹ֥ם וְ/נוֹרָ֖א ה֑וּא מִמֶּ֕/נּוּ מִשְׁפָּט֥/וֹ וּ/שְׂאֵת֖/וֹ יֵצֵֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/001/007.yaml
  text: It is dreadful and fearsome; its justice and authority[a] come from itself.
translation:
  language: zh_hans
  text: 这民族可怕又可畏；它的裁断和权威[a]都出于自己。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“它的法度和尊荣都出于自己。”
    reason: “裁断”（מִשְׁפָּט）也可指法度；“权威”（שְׂאֵת）也可指尊荣、威势或崇高地位。
lexical_decisions:
- source_word: אָיֹם
  choice: 可怕
  rationale: 表达令人恐惧、胆寒之意，符合迦勒底人带来威胁的语境。
- source_word: וְנוֹרָא
  choice: 又可畏
  rationale: 与“可怕”并列，加强恐惧感，同时保留原文两个形容词的结构。
- source_word: הוּא
  choice: 这民族
  rationale: 原文为阳性单数，承接上文作为集合整体的迦勒底民族；明说“这民族”既保持单数集合视角，也使现代汉语指代清楚。
- source_word: מִמֶּנּוּ
  choice: 出于自己
  rationale: 介词表示来源，强调其裁断标准和权威并非来自更高的外在权柄，而是由自身产生。
- source_word: מִשְׁפָּטוֹ
  choice: 它的裁断
  rationale: מִשְׁפָּט可指审判、公断或法度；“裁断”在此突出该民族自行判定和施行统治的含义，同时不把它正面评价为公义。
- source_word: וּשְׂאֵתוֹ
  choice: 和权威
  rationale: שְׂאֵת可指尊荣、威势或崇高地位；在与“裁断”平行的政治语境中，“权威”自然传达其自立的统治权势，另在脚注保留“尊荣”这一词义可能。
- source_word: יֵצֵא
  choice: 都出于
  rationale: 原文动词表示出来、发出；汉语“出于”与前置的来源短语自然配合。“都”用于统摄并列的两个名词，不改变原文意义。
theological_decisions:
- issue: 该民族权柄的自我来源
  choice: 直译为“都出于自己”
  alternative: 解释为其权柄得到上帝许可或授权
  rationale: 本节直接描述这个民族自行产生裁断和权威；译文不加入原文未明说的神学解释，以保留先知书中人的自大与上帝主权之间的张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“可怕又可畏”保留希伯来文近义并列的加强效果；“这民族”明确集合单数所指，后文以“它”保持一致。
