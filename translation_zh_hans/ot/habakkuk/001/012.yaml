base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/001/012.yaml
  text: Are you not from of old, O Yahweh my God, my Holy One? We will not die.[a] O Yahweh, you have appointed him for judgment, and you, O Rock, have established him for reproof.
translation:
  language: zh_hans
  text: 耶和华我的上帝、我的圣者啊，你不是自古以来就存在吗？我们必不至死。[a] 耶和华啊，你派定他施行审判；磐石啊，你立定他施行惩戒。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或按某些传统所保留的另一读法译作：“你不死。”希伯来文马所拉文本作“我们必不至死”。
    reason: alternative_reading
lexical_decisions:
- source_word: הֲלֹוא
  choice: 你不是……吗
  rationale: 保留期待肯定回答的反问语气，使先知的申诉自然有力。
- source_word: מִקֶּדֶם
  choice: 自古就有
  rationale: 表达上帝自远古以来的存在，同时避免把原词直接强化为明确的形而上术语“自永恒”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文读者熟悉的神名音译，不以头衔代替原文专名。
- source_word: אֱלֹהַי
  choice: 我的上帝
  rationale: 准确保留第一人称单数所属关系和直接称呼。
- source_word: קְדֹשִׁי
  choice: 我的圣者
  rationale: 原文形容词名词化并带第一人称后缀；“我的圣者”保留其作为尊称的形式。
- source_word: לֹא נָמוּת
  choice: 我们必不至死
  rationale: 马所拉文本的元音和动词形态为第一人称复数；中文“必不至死”兼顾信靠宣告的语气与庄重文体。
- source_word: לְמִשְׁפָּט
  choice: 施行审判
  rationale: 此处表示上帝设立迦勒底人为审判的工具；补出“施行”使中文目的结构清楚。
- source_word: שַׂמְתּוֹ
  choice: 你立他
  rationale: שׂים在此表示为特定任务而设立；“立他”简洁地传达任命与安置之意。
- source_word: צוּר
  choice: 磐石
  rationale: 保留指向上帝稳固、可靠和有力的传统称号。
- source_word: לְהוֹכִיחַ
  choice: 施行责罚
  rationale: יכח在这里兼有纠正、责备与惩治色彩；“责罚”较自然地体现审判语境，又不局限为单纯毁灭。
- source_word: יְסַדְתּוֹ
  choice: 你设立他
  rationale: יסד表示奠定、确立；此处指上帝坚定地指定该工具承担某种目的。
theological_decisions:
- issue: לֹא נָמוּת的主语和含义
  choice: 我们必不至死
  alternative: 你永不死亡
  rationale: 马所拉文本的读音与词形支持第一人称复数，因此正文保留先知关于群体不至灭绝的宣告。部分传统保存了指向上帝不死性的另一读法，故列入脚注而不取代正文，以保留文本传统中的张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“耶和华我的上帝，我的圣者”保留连续呼语；后半节用“施行审判／施行责罚”形成平行结构。
