revisions:
- from: 你不是自古就有的吗，耶和华我的上帝，我的圣者？我们必不至死。[a] 耶和华啊，你立他施行审判；磐石啊，你设立他施行责罚。
  to: 耶和华我的上帝、我的圣者啊，你不是自古以来就存在吗？我们必不至死。[a] 耶和华啊，你派定他施行审判；磐石啊，你立定他施行惩戒。
  rationale: 修订使呼语和反问在现代庄重普通话中更流畅；保留马所拉文本“我们必不至死”及其脚注中的替代读法。后半节以“派定／立定”对应两个设立动词，并以“惩戒”避免将“责备／纠正”的原文语义限定为单纯刑罚。
