  text: כִּֽי הִנְ/נִ֤י מֵקִים֙ אֶת הַ/כַּשְׂדִּ֔ים הַ/גּ֖וֹי הַ/מַּ֣ר וְ/הַ/נִּמְהָ֑ר הַֽ/הוֹלֵךְ֙ לְ/מֶרְחֲבֵי אֶ֔רֶץ לָ/רֶ֖שֶׁת מִשְׁכָּנ֥וֹת לֹּא לֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/001/006.yaml
  text: For behold[a], I am raising up the Chaldeans, that bitter and hasty nation[b], which marches through the broad places of the earth to seize dwelling places not its own.
translation:
  language: zh_hans
  text: 因为，看哪，我要兴起迦勒底人[a]，那凶残而迅猛的民族[b]；他们走遍大地辽阔之地，要夺取不属于自己的住处。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “迦勒底人”也可按历史语境称为“巴比伦人”。希伯来文作“迦勒底人”，指与新巴比伦政权相关的族群。
    reason: lexical_alternative
  - marker: b
    text: “凶残而迅猛”也可译作“苦毒而急速”。前一词本义为“苦”，此处形容其严酷凶狠；后一词指急速，也可含急切冒进之意。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，引出上帝回应中对其作为的解释，保留因果和说明作用。
- source_word: הִנְנִי
  choice: 看哪，我要
  rationale: 保留指示和强调语气；“看哪”庄重而仍为现代读者熟悉，与后面的第一人称行动相连。
- source_word: מֵקִים
  choice: 兴起
  rationale: 使役词形表示使之起来、使之行动；“兴起”既保留上帝的主动作用，也不额外界定其具体方式。
- source_word: הַכַּשְׂדִּים
  choice: 迦勒底人
  rationale: 按希伯来文保留历史族名，不以解释性的“巴比伦人”取代；后者列入脚注。
- source_word: הַגּוֹי
  choice: 民族
  rationale: 这里指具有政治和族群性质的群体；“民族”在中文中自然，并与集合性的单数相称。
- source_word: הַמַּר
  choice: 残酷
  rationale: 本义为“苦”，用于民族性情时表达使人受苦的凶狠严酷；直译“苦毒”在现代中文中容易被理解为内心怨恨，因此采用语境对等表达。
- source_word: וְהַנִּמְהָר
  choice: 急躁
  rationale: 保留 מהר 所含的迅速、急切和冒进色彩，而不缩减为单纯的“迅速”。
- source_word: הַהוֹלֵךְ
  choice: 横行
  rationale: 分词本义是行走、前行；军事征服语境中的“横行”自然表达其四处推进，并含原文描绘的威胁感。
- source_word: לְמֶרְחֲבֵי אֶרֶץ
  choice: 在大地辽阔之处
  rationale: 较贴近“地的宽阔之处”，保留空间广袤和活动范围广大的意象。
- source_word: לָרֶשֶׁת
  choice: 夺取
  rationale: ירשׁ 可指取得、占有，且常涉及征服；这里用“夺取”体现军事侵占。
- source_word: מִשְׁכָּנוֹת
  choice: 住处
  rationale: 直接表达居住之地，现代、清楚，同时不限定为私人住宅或城市。
- source_word: לֹא לוֹ
  choice: 不属于自己的
  rationale: 保留对非法占有的强调；以集合性民族为主语时，中文“自己的”自然且无须强行标明单复数。
theological_decisions:
- issue: 上帝与迦勒底人兴起之间的关系
  choice: 我要兴起迦勒底人
  alternative: 我要激动迦勒底人
  rationale: 希伯来文明确将该民族的起来和行动归于上帝的作为；译文保留这一神学张力，不弱化神圣主动性，也不进一步说明上帝如何使其兴起。
translation_notes:
  register: 采用现代、庄重而易懂的先知书文体。“看哪”保留原文的强调；“兴起”保留上帝主动使其起来的表达；句法略作中文化处理，但维持原文由民族特征转入其扩张和侵占行动的推进。脚注标记均在正文中出现。
