  naturalness: 原句“那是残酷而急躁的民族”中“那是”不合此处同位语的自然中文表达；应改为“那凶残而迅猛的民族”。将行动表述为“走遍大地辽阔之地”较自然，也更贴近原文的广阔地域意象。
  terminology: “迦勒底人”保留了原文族名，脚注以“巴比伦人”说明其新巴比伦时期的历史关联，处理恰当。“兴起”“夺取”“住处”均适合庄重的现代先知书文体。将“残酷而急躁”改为“凶残而迅猛”，可更连贯地表达“严酷／苦涩”与“急速”的语境含义；脚注保留字面与语义范围。
