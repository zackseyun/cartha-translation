  to: 因为，看哪，我要兴起迦勒底人[a]，那凶残而迅猛的民族[b]；他们走遍大地辽阔之地，要夺取不属于自己的住处。
  rationale: 修订中文句法和措辞，以更贴近希伯来文的同位描述与“前进／行走”的基本语义，同时避免“横行”所增加的方式性评价。保留原译对神圣主动性、历史族名和征服性占有的忠实表达，并将形容词说明脚注移至相应词组后。
