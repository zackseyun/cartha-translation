  text: הַ֥/עַל כֵּ֖ן יָרִ֣יק חֶרְמ֑/וֹ וְ/תָמִ֛יד לַ/הֲרֹ֥ג גּוֹיִ֖ם לֹ֥א יַחְמֽוֹל׃ס
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/001/017.yaml
  text: Will he therefore keep emptying his net and continually slaughtering nations without mercy?[a][b]
translation:
  language: zh_hans
  text: 难道他因此就不断把他的网[a]倒空，并不停地杀戮列国，毫不怜惜[b]吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他的拖网”。原文所指的是捕鱼用的网具。
    reason: lexical_alternative
  - marker: b
    text: 或译：“毫不顾惜”。原文动词也可表示“顾惜”或“怜悯”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַעַל כֵּן
  choice: 难道他因此就
  rationale: הֲ构成反问，עַל־כֵּן表示承接上文的推论；“难道……因此就”同时保留反问和因果承接的语气。
- source_word: יָרִיק
  choice: 不断把……倒空
  rationale: ריק的使役形在捕鱼语境中指把网倒空；未完成式结合上下文可表达反复、持续的行动，因此译作“不断”。
- source_word: חֶרְמוֹ
  choice: 他的网
  rationale: חֵרֶם在本段捕鱼比喻中指一种渔网；正文用现代汉语自然的“网”，并在脚注注明较具体的译法“拖网”。
- source_word: וְתָמִיד
  choice: 并不停地
  rationale: תָמִיד强调持续不断，且וְ连接前后动作；“并不停地”自然地传达这种连续性。
- source_word: לַהֲרֹג
  choice: 杀戮
  rationale: הרג意为杀死；在列国遭受大规模暴力的语境中，“杀戮”比一般的“杀死”更贴合其残酷程度。
- source_word: גּוֹיִם
  choice: 列国
  rationale: גּוֹיִם在此指被征服的各国或各族群；“列国”符合先知文学语体，又不误导为专指宗教意义上的外邦人。
- source_word: לֹא יַחְמֹל
  choice: 毫不怜惜
  rationale: חמל可指怜悯或顾惜；“毫不怜惜”保留否定和冷酷无情的含义，脚注另列“毫不顾惜”这一较贴近“饶过、不加伤害”的可能表达。
