  text: וַ/תַּעֲשֶׂ֥ה אָדָ֖ם כִּ/דְגֵ֣י הַ/יָּ֑ם כְּ/רֶ֖מֶשׂ לֹא מֹשֵׁ֥ל בּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/001/014.yaml
  text: You make man like the fish of the sea[a], like creeping things that have no ruler over them.
translation:
  language: zh_hans
  text: 你使人如海里的鱼[a]，如没有统治者管辖的爬行之物。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “人”也可译作“人类”。希伯来文 אָדָם 是单数，但在这里可统指全人类。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעֲשֶׂה
  choice: 你使
  rationale: 这是带连接词的未完成式，在先知向上帝发出的申诉中可描述当前情形。中文用“你使”自然地保留直接称呼和责问语气；不必机械译出句首连接词。
- source_word: אָדָם
  choice: 人
  rationale: 此处单数名词具有集合和代表意义，指人类；现代汉语“人”既保留单数形式，也可自然表达泛指。
- source_word: כִּדְגֵי הַיָּם
  choice: 如海里的鱼
  rationale: 准确表达比较关系及属格结构，同时符合现代汉语诗体表达。
- source_word: כְּרֶמֶשׂ
  choice: 如……爬物
  rationale: רֶמֶשׂ泛指在地上爬行或活动的小动物。“爬物”简洁并保留较宽泛的生物类别，不具体限定为昆虫或爬行动物。
- source_word: לֹא מֹשֵׁל בּוֹ
  choice: 无人管辖的
  rationale: מֹשֵׁל是分词，意为管辖者或统治者；“无人管辖”自然保留缺乏治理者的意思。בּוֹ为单数，与作为集合整体的先行概念相应。
theological_decisions:
- issue: אָדָם在此处的泛指人类含义
  choice: 人
  alternative: 人类
  rationale: “人”更贴近希伯来文语法上的单数形式，同时在汉语中能够自然泛指全体人类，不必把集合意义明说为“人类”。
translation_notes:
  register: 采用现代、庄重而易懂的申诉语体。“海里的鱼”比“海鱼”更能保留原文结构和诗意；“爬物”呼应圣经自然界分类用语，但较日常的替代译法可作“爬行的生物”。
