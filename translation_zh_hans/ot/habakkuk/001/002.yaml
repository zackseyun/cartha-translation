id: HAB.1.2
reference: Habakkuk 1:2
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: עַד אָ֧נָה יְהוָ֛ה שִׁוַּ֖עְתִּי וְ/לֹ֣א תִשְׁמָ֑ע אֶזְעַ֥ק אֵלֶ֛י/ךָ חָמָ֖ס וְ/לֹ֥א תוֹשִֽׁיעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/001/002.yaml
  text: How long, O LORD, have I cried for help and you do not hear? I cry out to you, “Violence!” and you do not save.
translation:
  language: zh_hans
  text: 耶和华啊，要到几时呢？我呼求帮助，你却不听；我向你呼喊：“暴力！”你却不拯救。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַד אָ֧נָה
  choice: 要到几时呢
  rationale: 保留先知哀诉中追问苦难将持续多久的语气，以现代汉语自然表达。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的专名译法，明确对应四字神名。
- source_word: שִׁוַּעְתִּי
  choice: 我呼求帮助
  rationale: 该动词表示在困境中高声求助；用“呼求帮助”兼顾呼喊动作和求援含义。
- source_word: וְלֹא תִשְׁמָע
  choice: 你却不听
  rationale: 直译未完成式所呈现的持续或未发生的回应；“却”自然表达控诉中的反差，不把“听”解释性扩展为“应允”。
- source_word: חָמָס
  choice: 暴力
  rationale: 此词指暴行、强暴或不法侵害；在独立呼喊中译作“暴力”可保留其简短而震撼的控告。
- source_word: וְלֹא תוֹשִׁיעַ
  choice: 你却不拯救
  rationale: 保留“拯救、施救”的核心含义及其神学张力，不弱化为一般性的“帮助”。
theological_decisions:
- issue: 先知所说“你不听”是否应解释为上帝没有应允
  choice: 你却不听
  alternative: 你却不应允
  rationale: 希伯来文使用“听”这一动词；直译保留哀诉的尖锐张力，同时不预先断定神是否以另一种方式听见却暂未回应。
- issue: “不拯救”是否应缓和为“尚未施救”
  choice: 你却不拯救
  alternative: 你仍不施救
  rationale: 原文直接否定拯救行为。译文保留先知当下经验中的控诉，不以解释性措辞缓和其张力。
- issue: 完成式 שִׁוַּעְתִּי 的时间表达
  choice: 我呼求帮助
  alternative: 我一直呼求帮助
  rationale: 上下文和“要到几时”暗示呼求已经持续一段时间，但原动词本身未明说“一直”；正文不额外强化持续副词，以保留时体上的开放性。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“耶和华啊”保留直接呼告；两个“你却不……”形成平行句式，再现希伯来诗句的对照和哀诉力度。
