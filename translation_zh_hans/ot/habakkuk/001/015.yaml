base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/001/015.yaml
  text: He brings all of them up with a hook[a]; he drags him away with his net, and gathers him in with his dragnet[b]. Therefore he rejoices and exults.
translation:
  language: zh_hans
  text: 他用钩子把他们全都钓上来[a]，用自己的网把他拖走，又把他收进自己的拖网里。因此，他欢喜雀跃。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文先把被捕者作为一个整体来指称，随后改用单数“他”；这里保留了这种转换。
    reason: lexical_alternative
lexical_decisions:
- source_word: כֻּלֹּה
  choice: 他们全都
  rationale: 原文形式为单数并带后缀，但在上下文中集合性地指前文那些如鱼一般被捕获的人；译为“他们全都”自然传达集合意义。
- source_word: בְּחַכָּה
  choice: 用钩子
  rationale: חַכָּה 指捕鱼用的钩；“钩子”自然清楚，并保留捕鱼比喻。
- source_word: הֶעֱלָה
  choice: 钓上来
  rationale: 使役形在此表示使捕获物从水中上来；与“钩子”搭配译作“钓上来”符合现代汉语。
- source_word: יְגֹרֵהוּ
  choice: 把他拖走
  rationale: 动词表示拖、拉，且宾语后缀为第三人称阳性单数；保留“他”，呈现原文由集合对象转为单数对象的意象变化。
- source_word: בְחֶרְמוֹ
  choice: 用自己的网
  rationale: חֵרֶם 在此指捕鱼的网；用通称“网”既清楚，也与下一个网具名词有所区别。
- source_word: וְיַאַסְפֵהוּ
  choice: 又把他收拢
  rationale: אָסַף 表示聚集、收取；“收拢”贴合用网聚拢猎物的画面，并保留单数宾语。
- source_word: בְּמִכְמַרְתּוֹ
  choice: 用自己的拖网
  rationale: מִכְמֶרֶת 指网具，可能是拖网或围网；“拖网”可与前面的普通“网”区分，反映原文使用两个不同词。
- source_word: עַל כֵּן
  choice: 因此
  rationale: 标明捕掠成功所产生的结果，保持原文的因果关系。
- source_word: יִשְׂמַח וְיָגִיל
  choice: 欢喜雀跃
  rationale: 两个喜乐动词并列，后者语气更强；“欢喜雀跃”既保留递进感，也符合庄重而自然的现代汉语。
theological_decisions:
- issue: 捕鱼意象的所指
  choice: 保留征服者捕鱼、众民如鱼被捕的政治隐喻，不在正文中明说所指
  alternative: 将本节理解为没有政治所指的字面捕鱼场景
  rationale: 哈巴谷书1:14—17的语境把捕鱼语言用于描写帝国征服与暴力；直译意象可避免过度解释。
- issue: 集合对象与单数宾语的转换
  choice: 先译“他们全都”，随后按原文译作“他”
  alternative: 为汉语指代一致而全部译为复数“他们”
  rationale: יְגֹרֵהוּ 与 וְיַאַסְפֵהוּ 均有第三人称阳性单数后缀。保留转换可呈现原文真实的语法张力，同时用脚注帮助读者理解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“钓上来—拖走—收拢”保持连续的捕鱼动作；“网”和“拖网”区分两个希伯来语网具词。
