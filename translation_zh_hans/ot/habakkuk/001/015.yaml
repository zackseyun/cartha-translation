revisions:
- from: 他用钩子把他们全都钓上来[a]，用自己的网把他拖走，又用自己的拖网把他收拢。因此，他欢喜雀跃。
  to: 他用钩子把他们全都钓上来[a]，用自己的网把他拖走，又把他收进自己的拖网里。因此，他欢喜雀跃。
  rationale: 仅作一处安全的汉语表达调整：“收进自己的拖网里”比“用自己的拖网把他收拢”更自然、具体地表达把猎物聚入网中的动作。其余译文保留原有的集合—单数转换、网具词汇区分、隐喻及语体。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T08:16:01Z'
