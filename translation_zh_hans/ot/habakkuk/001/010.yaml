base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/001/010.yaml
  text: He mocks kings[a], and rulers are a laughingstock to him. He laughs at every fortress; he heaps up earth and captures it.
translation:
  language: zh_hans
  text: 他嘲弄君王，统治者在他看来不过是笑柄。他嗤笑每一座堡垒；堆起土来[a]，然后攻取它。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译为“堆起尘土（或泥土）”；这里描绘的是堆筑土坡，以攻取设防之地。
    reason: cultural_note
lexical_decisions:
- source_word: יִתְקַלָּס
  choice: 嘲弄
  rationale: 该词在此表达轻蔑的讥嘲；“嘲弄”简洁自然，并与下句“成了笑柄”形成对应。
- source_word: רֹזְנִים
  choice: 统治者
  rationale: 指掌权者或高级权贵；“统治者”在现代汉语中清楚、宽泛，不限于某种特定爵位。
- source_word: מִשְׂחָק לוֹ
  choice: 在他眼中成了笑柄
  rationale: 原文名词表示供人讥笑的对象；此译保留轻蔑意味，也符合现代汉语表达。
- source_word: מִבְצָר
  choice: 堡垒
  rationale: 指设防坚固之处；“堡垒”保留军事语境，且用语简明。
- source_word: יִשְׂחָק
  choice: 嗤笑
  rationale: 该动词在此表示带有蔑视意味的发笑；“嗤笑”既保留笑的意象，也体现敌军的不屑。
- source_word: וַיִּצְבֹּר עָפָר
  choice: 他堆起土来
  rationale: 直译保留堆积泥土的具体画面；其攻城坡道的文化背景放入脚注说明，避免在正文中增添原文未明说的名词。
- source_word: וַיִּלְכְּדָהּ
  choice: 就攻取了堡垒
  rationale: 动词表示夺取、攻占；阴性单数后缀回指前面的堡垒。汉语重复“堡垒”比使用可能指代不清的“它”更自然。
- source_word: הוּא
  choice: 他
  rationale: 代词承接上下文中作为单数整体并被人格化描述的迦勒底军队；译作“他”保留希伯来文话语形式。
