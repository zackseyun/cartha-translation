source:
  edition: WLC
  text: טְה֤וֹר עֵינַ֨יִם֙ מֵ/רְא֣וֹת רָ֔ע וְ/הַבִּ֥יט אֶל עָמָ֖ל לֹ֣א תוּכָ֑ל לָ֤/מָּה תַבִּיט֙ בּֽוֹגְדִ֔ים תַּחֲרִ֕ישׁ בְּ/בַלַּ֥ע רָשָׁ֖ע צַדִּ֥יק מִמֶּֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/001/013.yaml
  text: Your eyes are too pure to look on evil[a], and you cannot gaze at wrongdoing[c][b]. Why then do you look on the treacherous and keep silent when the wicked swallows up one more righteous than he?
translation:
  language: zh_hans
  text: 你的眼目太纯洁，不能看邪恶[a]；你不能注视恶行[b]。那么，你为何注视背信之徒？当恶人吞灭比自己更义的人[c]时，你为何默不作声？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“看见邪恶”；希伯来语直译近于“眼目太纯洁，以至不能看邪恶”。
    reason: lexical_alternative
  - marker: b
    text: “恶行”也可译为“苦难”“祸患”或“奸恶”。
    reason: lexical_alternative
  - marker: c
    text: 希伯来语是“比他更义的人”，表达相对比较，并不必然宣称此人绝对无罪。
    reason: lexical_alternative
lexical_decisions:
- source_word: טְהוֹר עֵינַיִם מֵרְאוֹת רָע
  choice: 你的眼目太纯洁，不看邪恶
  rationale: 保留“眼目纯洁”的希伯来诗歌意象，并以自然中文表达 מִן 加不定式所传达的隔绝、不相容之意；不把它扩展为关于上帝绝不能察看邪恶的哲学命题。
- source_word: וְהַבִּיט אֶל עָמָל לֹא תוּכָל
  choice: 你也不能注视恶行
  rationale: הביט 表示定睛察看、注视；עמל 在本节不公义的语境中取道德性的“恶行”，同时以脚注保留“苦难、祸患、奸恶”等可能含义。
- source_word: לָמָּה תַבִּיט בּוֹגְדִים
  choice: 你为何还注视背信之徒
  rationale: בוגדים 指行事不忠、背信或诡诈的人；“背信之徒”简洁而庄重。“还”体现前后句的反诘对照，但不消除其中的张力。
- source_word: תַּחֲרִישׁ
  choice: 默不作声
  rationale: חרש 的使役词形在此表示静默、不发言；“默不作声”自然地呈现先知所感受到的上帝不介入。
- source_word: בְּבַלַּע רָשָׁע
  choice: 当恶人吞灭……时
  rationale: 介词 בְּ 加不定式构成时间或伴随情境；“吞灭”保留原文强烈的掠食性图像。
- source_word: צַדִּיק מִמֶּנּוּ
  choice: 比自己更义的人
  rationale: 比较用的 מִן 表明此处说的是相对而言比恶人更公义，并不必然宣称被吞灭者绝对无罪；“自己”明确比较对象是恶人。
theological_decisions:
- issue: 上帝的纯洁与察看邪恶之间的张力
  choice: 按先知的诗性反诘译为“眼目太纯洁，不看邪恶”以及“为何还注视”，保留经文本身的张力。
  alternative: 译成“你不能容忍邪恶”，从而把“看”解释为容忍或认可。
  rationale: 前后两句刻意同时使用察看的语言：先断言上帝的纯洁与邪恶不相容，随后追问他为何注视背信者。译文不把诗性表达绝对化为上帝无法知晓邪恶，也不以解释性措辞预先化解先知的质问。
- issue: 被吞灭者的义是否为绝对无罪
  choice: 译作“比自己更义的人”，明确保留比较关系。
  alternative: 译作“义人”，可能被理解为绝对无罪或毫无限定的义。
  rationale: צַדִּיק מִמֶּנּוּ 在语法上是“比他更义”；译文应保留相对比较，不导入超出经文的无罪论断。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“眼目”“背信之徒”“吞灭”保留先知诗歌的凝练与力度；两个问句重现原文的反诘结构。脚注标记[a]、[b]、[c]均已置于正文相应位置。
