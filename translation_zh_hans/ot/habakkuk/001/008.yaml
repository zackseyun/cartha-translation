  yaml_path: translation/ot/habakkuk/001/008.yaml
  text: His horses are swifter than leopards and fiercer than wolves at dusk[a]. His horsemen spread out; his horsemen come from far away. They fly like an eagle hurrying to devour.
translation:
  language: zh_hans
  text: 他的马比豹子更快，比黄昏时的狼更凶猛。他的骑兵四散开来；他的骑兵从远方而来。他们飞驰，如鹰[a]急着吞吃。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“如秃鹫”。希伯来语“נֶשֶׁר”可泛指大型猛禽或食腐鸟，不一定专指现代动物分类中的鹰。
    reason: lexical_alternative
lexical_decisions:
- source_word: קַלּוּ מִנְּמֵרִים
  choice: 比豹子更快
  rationale: קלל在此表示轻快、迅捷；与豹子比较时，译为“更快”最自然，也保留比较结构。נמר通常指豹子。
- source_word: וְחַדּוּ מִזְּאֵבֵי עֶרֶב
  choice: 比黄昏时的狼更凶猛
  rationale: חדד在这里以锋利比喻凶狠；“更凶猛”符合猛兽语境。זְאֵבֵי עֶרֶב直指黄昏时出没、饥饿凶猛的狼。
- source_word: וּפָשׁוּ פָּרָשָׁיו
  choice: 他的骑兵四散驰骋
  rationale: פוש的确切军事动态略有不确定，可表示散开、广泛出动；“四散驰骋”保留展开行动的画面，同时避免具体化为某种阵形。
- source_word: פָּרָשָׁיו
  choice: 他的骑兵
  rationale: פָּרָשׁ可指骑马作战的人；“骑兵”在现代汉语中自然，并在原文两次出现处重复保留。
- source_word: מֵרָחוֹק יָבֹאוּ
  choice: 从远方而来
  rationale: 直接保留空间距离和来临动作，语言简洁庄重。
- source_word: יָעֻפוּ
  choice: 飞奔
  rationale: 字面为“飞”，在骑兵与猛禽的明喻中，“飞奔”既符合汉语对骑兵疾驰的表达，也保留如飞般迅疾的形象。
- source_word: כְּנֶשֶׁר
  choice: 如鹰
  rationale: נֶשֶׁר可指鹰，也可能泛指大型猛禽或食腐鸟；正文采用传统且符合迅疾捕食意象的“鹰”，并以脚注保留“秃鹫”等可能。
- source_word: חָשׁ לֶאֱכוֹל
  choice: 急着吞吃
  rationale: חשׁ表达急速、急切，לאכל字面为吃；在捕食语境中，“吞吃”自然呈现暴烈意味，又不把动作过度解释为特定捕杀方式。
