  to: 他的马比豹子更快，比黄昏时的狼更凶猛。他的骑兵四散开来；他的骑兵从远方而来。他们飞驰，如鹰[a]急着吞吃。
  rationale: 仅作两项低风险的措辞调整：“四散开来”较中性地对应骑兵散布／展开；“飞驰，如鹰急着吞吃”使“飞”的疾速形象及其后的鹰之明喻在现代汉语中更清楚自然。其余内容和脚注均可保留。
