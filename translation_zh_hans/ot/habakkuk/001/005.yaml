source:
  edition: WLC
  text: רְא֤וּ בַ/גּוֹיִם֙ וְֽ/הַבִּ֔יטוּ וְ/הִֽתַּמְּה֖וּ תְּמָ֑הוּ כִּי פֹ֨עַל֙ פֹּעֵ֣ל בִּֽ/ימֵי/כֶ֔ם לֹ֥א תַאֲמִ֖ינוּ כִּ֥י יְסֻפָּֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/001/005.yaml
  text: Look among the nations and see[a]; be astonished, be astounded[b]. For I am doing a work in your days that you would not believe if it were told.
translation:
  language: zh_hans
  text: 你们要在列国中观看，仔细察看[a]；要惊奇，要惊愕不已！因为我正在你们的日子施行一件事[b]；即使有人把这事讲给你们听，你们也不会相信[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在列国中”也可理解为“看向列国”或“观看列国”。
    reason: 介词ב在此可表示察看的范围或对象；正文保留其“在……中／ among”的可能性。
  - marker: b
    text: 希伯来文此分句没有独立写出“我”；“我”由本段说话者耶和华的语境补足。也可按字面句法译作“有一件事正在施行”。
    reason: 说明第一人称施事者的语境依据，并保留原句未明写代词的形式特点。
  - marker: c
    text: 直译可作：“这事若被述说，你们也不会相信。”
    reason: 说明כִּי与被动动词יְסֻפָּר所构成短语可按条件句表达。
lexical_decisions:
- source_word: רְאוּ בַגּוֹיִם
  choice: 察看列国
  rationale: רְאוּ是复数命令式，בַגּוֹיִם可表示“在列国中”或以列国为察看的范围、对象。正文采用自然的现代汉语“察看列国”，并以脚注保留介词的另一种理解。
- source_word: וְהַבִּיטוּ
  choice: 留心观看
  rationale: הביט强调定睛、专注地看；“留心观看”既与前面的“察看”形成配对，也避免生硬重复。
- source_word: וְהִתַּמְּהוּ תְּמָהוּ
  choice: 要惊奇，惊愕不已
  rationale: 两个同根动词连续出现，形成强烈的强调效果。“惊奇，惊愕不已”保留双重命令及递进力度，同时符合现代汉语表达。
- source_word: פֹעַל פֹּעֵל
  choice: 有一件事正在成就
  rationale: 原文是名词与分词的同根结构，强调一件正在发生或施行的事；希伯来文此处没有明说主语，因此正文采用不明确施事者的表达。
- source_word: בִּימֵיכֶם
  choice: 在你们的日子
  rationale: 直译并保留先知话语的庄重语体，也表达这事发生在听众所处的时代。
- source_word: לֹא תַאֲמִינוּ כִּי יְסֻפָּר
  choice: 即使有人讲给你们听，你们也不会相信
  rationale: 将未完成式与后接的被动叙述从句译成自然汉语，让步式“即使……也……”准确传达此事难以置信的语意；脚注保留较贴近形式的译法。
theological_decisions:
- issue: “正在成就”之事的施事者是否明说为上帝
  choice: 有一件事正在成就
  alternative: 因为我正在你们的日子成就一件事
  rationale: 上下文可将说话者理解为耶和华，但本节希伯来文的פֹעַל פֹּעֵל没有显式第一人称主语。正文不补出“我”，以保留原句的语法含混；脚注说明上下文所支持的另一译法。
- issue: 末句的逻辑关系
  choice: 即使有人讲给你们听，你们也不会相信
  alternative: 这事若被述说，你们也不会相信
  rationale: כִּי在这里可按语境表达条件或让步关系。正文采用流畅且保留惊人意味的让步表达，不将其变成关于信心性质的神学断言。
translation_notes:
  register: 采用现代、庄重而易懂的先知性语体。“察看—观看”和“惊奇—惊愕不已”保留原文成对命令的节奏与力度；标点强化呼召和震撼感，但不加入原文没有的宗派性解释。
