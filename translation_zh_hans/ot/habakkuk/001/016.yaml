base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/001/016.yaml
  text: Therefore he sacrifices to his net and burns incense to his dragnet[a], because by them his portion is rich and his food is plentiful.
translation:
  language: zh_hans
  text: 因此，他向自己的网献祭，向自己的拖网烧香，因为借着这些，他所得丰厚，食物丰美[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为借着这些，他的份额肥厚，食物肥美。”希伯来文以“肥厚、肥美”的形象表达富足和兴盛。
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: 因此
  rationale: 保留与上文之间的推论和结果关系，表达自然而庄重。
- source_word: יְזַבֵּחַ
  choice: 献祭
  rationale: 此处是献祭用语，并非普通宰杀；简洁保留敬拜意象。
- source_word: לְחֶרְמוֹ
  choice: 向自己的网
  rationale: חֵרֶם 在上下文的捕鱼比喻中指捕捉用的网；无需另加“渔”字。
- source_word: וִיקַטֵּר
  choice: 烧香
  rationale: קטר 的 Piel 词形在此表示焚香或献烟祭，明确保留偶像崇拜的礼仪色彩。
- source_word: לְמִכְמַרְתּוֹ
  choice: 向自己的拖网
  rationale: מִכְמֶרֶת 指较大的围捕之网；“拖网”可与前面的“网”有所区别。
- source_word: כִּי בָהֵמָּה
  choice: 因为他靠这些
  rationale: ב 加第三人称阳性复数代词表达工具或手段，说明其财富是借这些工具取得的。
- source_word: שָׁמֵן חֶלְקוֹ
  choice: 得了肥厚的份
  rationale: 保留 שָׁמֵן“肥”的具体意象，同时“肥厚”在现代汉语中可表达丰裕；将名词句自然处理为所得。
- source_word: וּמַאֲכָלוֹ בְּרִיאָה
  choice: 吃的是丰美的食物
  rationale: בְּרִיאָה 可指肥美、丰盛或上好的；“丰美”兼顾数量充足与品质优良，避免过度限定。
theological_decisions:
- issue: 把敬拜用语用于军事或捕鱼工具
  choice: 直接译出征服者向网献祭并烧香
  alternative: 将其仅解释为过度倚仗军事力量
  rationale: 希伯来文明确使用献祭和焚香术语，正文应保留其敬拜和偶像崇拜意象；对力量的倚仗可由这一形象自然显明，不宜在翻译中取代原有措辞。
translation_notes:
  register: 采用现代标准普通话的庄重书面语。“献祭”“烧香”保留宗教礼仪色彩；“网／拖网”维持两种捕鱼器具的区别；“肥厚／丰美”尽量保留希伯来文关于肥硕丰裕的意象，同时确保普通读者容易理解。
