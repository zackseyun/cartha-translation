  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: עַל כֵּן֙ תָּפ֣וּג תּוֹרָ֔ה וְ/לֹֽא יֵצֵ֥א לָ/נֶ֖צַח מִשְׁפָּ֑ט כִּ֤י רָשָׁע֙ מַכְתִּ֣יר אֶת הַ/צַּדִּ֔יק עַל כֵּ֛ן יֵצֵ֥א מִשְׁפָּ֖ט מְעֻקָּֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/001/004.yaml
  text: Therefore the law grows numb, and justice never goes forth. For the wicked surrounds the righteous; therefore justice goes forth twisted.
translation:
  language: zh_hans
  text: 因此，律法失去效力，公正始终无法伸张；因为恶人围困义人，所以判决出来时，竟是歪曲的。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תָּפוּג
  choice: 失去效力
  rationale: 该动词本义涉及变得迟钝、衰弱或失效；在“律法”作主语的语境中，译作“失去效力”自然表达律法不能发挥作用，又不过度具体化为废除。
- source_word: תּוֹרָה
  choice: 律法
  rationale: 保留该词在先知书中对上帝训诲与规范性律法的传统称谓。
- source_word: מִשְׁפָּט
  choice: 公正／判决
  rationale: 同一希伯来词先指应当得到伸张的公正，后指实际作出的司法裁断；依上下文分别译出，以呈现语义推进。
- source_word: לֹא־יֵצֵא לָנֶצַח
  choice: 始终无法伸张
  rationale: לָנֶצַח在此可表达持续、总不发生，而不是严格的形而上“永远”；“伸张”符合公正在司法场景中得以实现的汉语表达。
- source_word: מַכְתִּיר
  choice: 围困
  rationale: 该词可指环绕、包围；此处表达恶人从四面压制义人的敌对态势，“围困”比中性的“围绕”更合语境。
- source_word: מְעֻקָּל
  choice: 被扭曲了
  rationale: 该词指弯曲、歪曲；用于判决时表示司法结果遭歪曲，同时保留原文的形象性。
theological_decisions:
- issue: תּוֹרָה的范围
  choice: 译作“律法”，不限定为某一套法典或一般社会法律
  alternative: 训诲／法律
  rationale: 原文可兼具上帝训诲和规范性律法的含义；传统而宽泛的“律法”保留这种张力。
- issue: 义人与恶人的性质
  choice: 保留“恶人”和“义人”的道德—盟约性称谓
  alternative: 坏人和好人／有罪者和无辜者
  rationale: צַדִּיק与רָשָׁע不只是法律程序中的有罪或无罪，也带有道德和信仰关系层面的评价，不宜缩窄。
- issue: מִשְׁפָּט的两次用法
  choice: 分别译为“公正”和“判决”
  alternative: 两处均译“公正”或“审判”
  rationale: 这样既体现同词反复所形成的讽刺张力，也用现代汉语清楚显示：本应伸张的公正没有实现，实际产生的裁决反被扭曲。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语；保留因果链条和司法语境。分号对应诗句内部的推进，避免加入原文没有明说的施事者或制度背景。
