  text: לָ֣/מָּה תַרְאֵ֤/נִי אָ֨וֶן֙ וְ/עָמָ֣ל תַּבִּ֔יט וְ/שֹׁ֥ד וְ/חָמָ֖ס לְ/נֶגְדִּ֑/י וַ/יְהִ֧י רִ֦יב וּ/מָד֖וֹן יִשָּֽׂא׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/001/003.yaml
  text: Why do you make me see wrongdoing[a], and why do you look at trouble? Destruction and violence are before me; strife comes to be[c][b], and contention rises up.
translation:
  language: zh_hans
  text: 你为什么使我看见罪孽[a]，又为什么注视苦难？毁灭[b]和暴力就在我面前；争端兴起，纷争抬头[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “罪孽”也可译作“邪恶”或“不义”。
    reason: lexical_alternative
  - marker: b
    text: “毁灭”也可译作“毁坏”或“劫掠”。
    reason: lexical_alternative
  - marker: c
    text: 也可译作“争端发生，纷争兴起”。
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָה
  choice: 为什么
  rationale: 用现代汉语最自然的原因疑问词，保留哀诉直接质问的语气。
- source_word: תַרְאֵנִי
  choice: 使我看见
  rationale: 保留ראה使役形的使役意味，不将其弱化为单纯的“让我看见”或误解为“看见我”。
- source_word: אָוֶן
  choice: 罪孽
  rationale: 此处语境强调社会中的邪恶与不义；“罪孽”既保留道德含义，也符合庄重的先知性语体。
- source_word: וְעָמָל
  choice: 苦难
  rationale: עָמָל在这里不是中性的劳作，而是由邪恶和压迫造成的患难、祸害；“苦难”自然且能涵盖这种结果。
- source_word: תַּבִּיט
  choice: 注视
  rationale: 表达“看着、察看”的持续关注意味，同时不擅自增添“容忍”或“不干预”等解释。
- source_word: שֹׁד
  choice: 毁灭
  rationale: 该词可指暴力造成的毁坏、劫掠或蹂躏；与“暴力”并列时，“毁灭”清楚呈现其破坏性结果。
- source_word: חָמָס
  choice: 暴力
  rationale: 这是先知文献中常见的暴力与不公之词；“暴力”是现代汉语中直接、透明的对应。
- source_word: לְנֶגְדִּי
  choice: 就在我面前
  rationale: 保留这些恶事呈现在先知眼前的空间意象；“就在”也传达其迫近和触目可见。
- source_word: וַיְהִי רִיב
  choice: 争端不断
  rationale: ויהי表示争端出现、发生或持续存在；汉语“不断”自然表达眼前反复发生的社会冲突，同时避免生硬的“争端成为”。
- source_word: מָדוֹן יִשָּׂא
  choice: 纷争四起
  rationale: יִשָּׂא字面有被举起、升起之意；“四起”保留纷争兴起、爆发的动态意象，并与前句形成自然平行。
theological_decisions:
- issue: 开头的质问是否应弱化上帝与先知看见邪恶之间的关系
  choice: 保留直接称呼和使役语气：“你为什么使我看见……？为什么注视……？”
  alternative: 译为“你为什么容许我看见……？为什么容忍……？”
  rationale: 希伯来文直接向上帝发问，首个动词为使役形，第二个动词只说“看、注视”。译文不加入“容许”“容忍”或上帝不干预等解释，以保存先知哀诉中原有的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。前两句保持先知向上帝直接质问的力度；后半句用两个四字结构呈现希伯来诗句的平行与动态，但不把רִיב限定为诉讼，也不把מָדוֹן仅限于口角。
