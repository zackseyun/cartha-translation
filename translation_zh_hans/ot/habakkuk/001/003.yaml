    rationale: וַיְהִי在此表达争端出现、发生或形成；原文并未明确说其“不停”发生。宜译为“争端兴起”或“争端发生”。
  - severity: low
    issue: “纷争四起”强化了空间性和复数感。
    rationale: יִשָּׂא表达被举起、兴起或爆发；“四起”虽可通，却容易使读者理解为各处同时发生。以“抬头”保留兴起的动态而较少扩展原义。
  - severity: low
    issue: 原脚注c所列替代译法与正文的语义方向相近，但正文应先避免加入“不断”这一额外含义。
    rationale: 调整正文为“争端兴起，纷争抬头”后，脚注可保留较直译的“争端发生，纷争兴起”，说明其为可选表达。
  revised_text: 你为什么使我看见罪孽[a]，又为什么注视苦难？毁灭[b]和暴力就在我面前；争端兴起，纷争抬头[c]。
