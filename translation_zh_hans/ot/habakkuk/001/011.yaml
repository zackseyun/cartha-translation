base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/001/011.yaml
  text: Then he sweeps by like the wind and passes on—he becomes guilty[b][a]; this strength of his is his god.
translation:
  language: zh_hans
  text: 那时，他如风[b]席卷而过，继续前行；他就有罪：他把自己的力量当作神。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他有罪，把这力量归给他的神”；又或：“他的力量属于他的神。”希伯来文末句十分凝练，可有不同理解。
    reason: alternative_reading
  - marker: b
    text: “风”所译的希伯来词也可指“灵”；这里的语境较支持如风一般迅猛前进的意象。
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: 那时
  rationale: 表示叙述进入下一阶段；“那时”自然、庄重，也保留时间推进关系。
- source_word: חָלַף רוּחַ
  choice: 如风席卷而过
  rationale: רוּחַ 可指“风”或“灵”；这里与快速、猛烈地经过相连，语境较支持“风”。“如”补明希伯来文凝练的比拟关系，“席卷而过”体现侵略者迅猛推进的气势。
- source_word: וַיַּעֲבֹר
  choice: 继续前行
  rationale: 承接前面的快速运动，表达越过之后仍向前推进，同时避免与“而过”机械重复。
- source_word: וְאָשֵׁם
  choice: 却因此有罪
  rationale: אָשֵׁם 表示承担罪责或成为有罪者。“却”显出从军事得势转向道德定罪的反差；“因此”按主要句法理解将罪责与下句所述的偶像化自恃相连，但脚注保留其他可能。
- source_word: זוּ כֹחוֹ לֵאלֹהוֹ
  choice: 他以自己的力量为神
  rationale: 原文极其凝练。此译把 לְ 理解为表认定或视作，即他将自身军力当作神；这与上下文对骄横自恃的谴责相合，同时在脚注中保留其他句法解释。
theological_decisions:
- issue: 末句 זוּ כֹחוֹ לֵאלֹהוֹ 的解释
  choice: 他因把自己的力量当作神而有罪
  alternative: 他有罪，把这力量归给他的神；或：他的力量属于他的神
  rationale: 希伯来文末句缺少明示的系词，介词 לְ 的关系也可有不同理解。正文采用最能衔接“有罪”并符合上下文中帝国骄横、自恃其力的读法；因其他解释在语法上仍有可能，故不将歧义抹去，而收入脚注。
translation_notes:
  register: 采用现代标准书面汉语，保持先知文体的简洁、力度与庄重。正文顺序使脚注标记按 [b]、[a] 分别紧随相关词句，以对应“风”的词义问题和末句的句法歧义。
