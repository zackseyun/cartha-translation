  text: The oracle that Habakkuk the prophet saw:[a]
translation:
  language: zh_hans
  text: 先知哈巴谷所看见的神谕：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַמַּשָּׂא
  choice: 默示
  rationale: 该词在先知书标题中指从上帝而来的庄重信息，往往涉及审判。“默示”符合现代中文圣经语体，也能表达其先知性和分量；脚注保留“重担、宣告”等词义可能。
- source_word: אֲשֶׁר
  choice: 所
  rationale: 关系词连接“默示”与“看见”，译为“所”符合自然、简洁的中文标题句式。
- source_word: חָזָה
  choice: 看见
  rationale: 直译源文的视觉动词，保留先知领受启示时“看见”的隐喻，不擅自明确启示的具体方式。
- source_word: חֲבַקּוּק
  choice: 哈巴谷
  rationale: 采用现代中文圣经中通行的人名译法。
- source_word: הַנָּבִיא
  choice: 先知
  rationale: 准确表达哈巴谷的身份，并采用自然的中文称谓。
theological_decisions:
- issue: 先知书标题 מַשָּׂא 的译法
  choice: 默示
  alternative: 重担；宣告
  rationale: “默示”能体现这是先知领受的庄重信息，又不把该信息限定为先知主观承受的心理重担，也不预先断定其内容完全属于审判。
- issue: חָזָה 所表达的启示方式
  choice: 看见
  alternative: 在异象中看见；领受
  rationale: 保留原文的视觉表达及其可能的先知性含义，不将原文未明说的启示方式具体化。
translation_notes:
  register: 采用简洁、庄重而易懂的现代标准汉语。“先知哈巴谷所看见的默示”保留希伯来文标题结构与“看见”的源文意象；冒号表明后文是该默示的内容。
