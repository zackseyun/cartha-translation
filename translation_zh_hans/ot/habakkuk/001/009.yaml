base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/001/009.yaml
  text: All of them come for violence[a]; the set of their faces is forward[c][b], and they gather captives like sand.
translation:
  language: zh_hans
  text: 他们全都为施暴而来；他们的面容都朝向前方[a]；他们聚拢[b]俘虏[c]，多如沙粒。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“他们的面容都朝向东方”。原文较难确定：קָדִימָה 可指“向前”或“向东”，מְגַמַּת 可表示“趋向”“意向”或“方向”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文作单数动词“他聚拢”，把整支入侵军视为一个集合整体。
    reason: lexical_alternative
  - marker: c
    text: “俘虏”也可译作抽象意义的“被掳”或“俘虏状态”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כֻּלֹּה
  choice: 他们全都
  rationale: 阳性单数后缀在上下文中统指整支入侵军队；汉语用“他们全都”自然表达集合中的全体。
- source_word: לְחָמָס
  choice: 为施暴
  rationale: חָמָס 指以强力实施的暴行、残害；“为施暴”保留介词 לְ 所表达的目的意味及原文的简练。
- source_word: יָבוֹא
  choice: 而来
  rationale: 采用 בוא 的基本义“来”，不额外加入“进军”等上下文推断。
- source_word: מְגַמַּת פְּנֵיהֶם
  choice: 他们脸面所向
  rationale: 罕见名词 מְגַמַּת 可表示趋向、意向或方向；此译保留“脸面”的具体意象，也避免把它完全解释为内心意图。
- source_word: קָדִימָה
  choice: 直指前方
  rationale: 该词既可指“向前”，也可指“向东”；正文按军事推进的语境取“前方”，并以脚注保留方位解释。
- source_word: וַיֶּאֱסֹף
  choice: 他们聚拢
  rationale: 动词在希伯来文中为单数，把入侵军视为一个集合整体；现代汉语动词不标数，按上下文用复数代词最自然，同时在脚注说明原文形式。
- source_word: שֶׁבִי
  choice: 俘虏
  rationale: 该名词既可指被掳的人，也可抽象地指被掳或掳物；与“聚拢”搭配时，指人较为自然。
- source_word: כַּחוֹל
  choice: 多如沙粒
  rationale: 将原文“像沙”按现代汉语数量比喻自然表达为“多如沙粒”，传达俘虏数量众多。
