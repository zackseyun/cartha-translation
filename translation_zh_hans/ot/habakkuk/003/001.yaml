  text: 先知哈巴谷的祷告，按示吉约诺特[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或作“用示吉约诺特”或“论示吉约诺特”。这可能是一个音乐或礼仪术语，指某种风格、曲调，或一种激情洋溢的诗歌；确切含义不明。
