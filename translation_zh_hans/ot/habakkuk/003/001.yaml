lexical_decisions:
- source_word: תְּפִלָּה
  choice: 祷告
  rationale: 该名词可指祷告或祷告之歌；用于标题时，“祷告”简洁自然，也保留原文体裁标示。
- source_word: לַחֲבַקּוּק
  choice: 哈巴谷的
  rationale: 标题中的前缀 לְ 常表示作者身份或归属；译为“哈巴谷的”最符合现代汉语标题表达，同时不排除关联之意。
- source_word: הַנָּבִיא
  choice: 先知
  rationale: 这是说明哈巴谷身份的同位称号；置于姓名前，形成自然庄重的现代汉语“先知哈巴谷”。
- source_word: עַל
  choice: 按
  rationale: 在音乐或礼仪标题中，עַל 可表示依据某曲调、风格或演唱方式；“按”保留标题式指示，又不把具体关系限定得过死。
- source_word: שִׁגְיֹנוֹת
  choice: 示吉约诺特
  rationale: 此词罕见，准确含义不确定，可能是音乐或礼仪术语，并与诗篇7篇标题中的单数形式相关。采用音译可避免误作确定的曲调或诗歌类型。
