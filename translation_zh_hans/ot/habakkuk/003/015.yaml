  text: You marched through the sea with your horses[a], through the heap of mighty waters.
translation:
  language: zh_hans
  text: 你带着你的马匹踏过海，踏过浩瀚众水的翻腾[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “翻腾”所对应的希伯来语词含义不确定；也可指众水的“堆积”或“成团的水体”。
    reason: lexical_alternative
lexical_decisions:
- source_word: דָּרַכְתָּ
  choice: 踏过
  rationale: 该动词本义是“踩、踏、行进”。“踏过”既保留足下行进的具体意象，也符合神显诗中威严推进的画面。
- source_word: בַיָּם
  choice: 海洋
  rationale: 介词ב在运动语境中可表达经过某处；与“踏过”结合，自然传达穿越海洋之意。
- source_word: סוּסֶיךָ
  choice: 驾着你的马
  rationale: 原文直译为“你的马”。汉语以“驾着你的马”自然表达这些马伴随并承载神威严前行的图景，但不进一步说明是战车或骑乘。
- source_word: חֹמֶר
  choice: 汹涌
  rationale: 此词在本节含义疑难，可能指堆积、翻腾或浑浊成团的水体。“汹涌”在正文中自然呈现水势翻腾的诗意，同时以脚注保留“水堆／水团”的可能。
- source_word: מַיִם רַבִּים
  choice: 浩瀚水域
  rationale: 字面为“众水／多水”。“浩瀚水域”兼顾水量广大和诗歌语体，避免把“多”过度限定为单纯的力量。
theological_decisions:
- issue: 诗歌神显中的神圣战士意象
  choice: 保留神驾马踏海而行的具体图景
  alternative: 把马解释为云彩或天使，或改写为神制伏海洋的一般陈述
  rationale: 原文以具体而张力鲜明的诗歌形象描绘神威严前行；译文不将其寓意化，也不化约为抽象教义。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语体。以“踏过……踏过……”重现原句推进感；脚注标记置于相关难词所在分句之后。
