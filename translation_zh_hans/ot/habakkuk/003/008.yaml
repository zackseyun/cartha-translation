source:
  edition: WLC
  text: הֲ/בִ/נְהָרִים֙ חָרָ֣ה יְהוָ֔ה אִ֤ם בַּ/נְּהָרִים֙ אַפֶּ֔/ךָ אִם בַּ/יָּ֖ם עֶבְרָתֶ֑/ךָ כִּ֤י תִרְכַּב֙ עַל סוּסֶ֔י/ךָ מַרְכְּבֹתֶ֖י/ךָ יְשׁוּעָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/003/008.yaml
  text: Was your anger against the rivers[a], Yahweh? Was your wrath against the rivers, or your fury against the sea, that you rode on your horses, on your chariots of salvation?
translation:
  language: zh_hans
  text: 耶和华啊，你是向江河发怒吗？你的怒气是向江河发作吗？你的烈怒是向海发作吗？因为你骑着你的马，驾着你的救恩战车[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“驾着你得胜的战车。”希伯来语“救恩”在这里也可含“解救”或“胜利”的意思。
    reason: 保留 יְשׁוּעָה 在军事性神显语境中的词义幅度，并说明名词组合的另一可行理解。
lexical_decisions:
- source_word: הֲ/בִ/נְהָרִים חָרָה
  choice: 你是向江河发怒吗
  rationale: 疑问词与介词בְּ共同询问神发怒的对象；将חָרָה按其“怒火燃起”的惯用义译为“发怒”，自然且保留力度。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文读者熟悉的专名形式来呈现四字神名，不以“主”这一称号替代。
- source_word: אַפֶּךָ
  choice: 你的怒气
  rationale: אַף本义为“鼻子”，在此惯指愤怒；“怒气”与前句相承，同时保持诗歌排比。
- source_word: עֶבְרָתֶךָ
  choice: 你的烈怒
  rationale: עֶבְרָה表达更强烈、奔涌的愤怒，“烈怒”体现其递进力度。
- source_word: בַּיָּם
  choice: 向海洋
  rationale: 直译海的意象，并与“江河”构成平行；“海洋”在中文诗体中自然庄重。
- source_word: כִּי תִרְכַּב עַל סוּסֶיךָ
  choice: 你竟骑上你的马
  rationale: רכב直译为“骑”；כִּי在此可说明前述反问所指的景象，“竟”体现反问转入壮阔行动的语气，但不把因果关系说死。
- source_word: מַרְכְּבֹתֶיךָ יְשׁוּעָה
  choice: 驾着你施行拯救的战车
  rationale: 名词并置关系简洁而有歧义；正文以“施行拯救”表达战车与救援行动的关联，同时用脚注保留“得胜战车”的可能解释。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名；中文正文保留专名而不以“主”替换。“耶和华”是现代简体中文圣经语境中最为通行、易识别的形式。
- issue: 军事性神显语境中יְשׁוּעָה的含义
  choice: 拯救
  alternative: 胜利
  rationale: 该词在语境中可指带来拯救的胜利；正文保留更宽广的“拯救”含义，不把它限缩为军事得胜，脚注说明另一可能。
- issue: כִּי与前面反问的关系
  choice: 以“竟”衔接神骑马驾车的景象
  alternative: 因为你骑上你的马
  rationale: כִּי可作解释性连接，但本句诗歌句法容许不同理解；避免在正文中过度固定为严格因果。
translation_notes:
  register: 采用现代、庄重而易懂的诗体中文。三重反问用“发怒／怒气发作／烈怒倾泻”呈现递进和平行；末句保留神骑马驾战车施救的宏大意象。脚注标记[a]已置于正文对应位置。
