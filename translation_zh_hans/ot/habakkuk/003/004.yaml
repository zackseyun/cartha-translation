base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/003/004.yaml
  text: His brightness was like the light; rays were from his hand[a], and there his power was hidden.
translation:
  language: zh_hans
  text: 他的光辉如光；光芒从他手中而出[a]；他的威能隐藏在那里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “光芒”原文直译为“角”（双数）：“角从他手中而出。”这里“角”是指向外伸展的光束。
    reason: 保留קַרְנַיִם的字面形象及其在本节中的比喻性解释，并准确反映“从他手中”的来源含义。
lexical_decisions:
- source_word: נֹגַהּ
  choice: 光辉
  rationale: 该词表示明亮、光辉或光彩。“光辉”自然庄重，并与后面的“如同日光”形成诗意呼应。
- source_word: כָּאוֹר
  choice: 如同日光
  rationale: 前缀כְּ表示比较，אוֹר意为“光”。在此显现异象中，“日光”以自然汉语传达鲜明的光亮意象，同时保留明喻。
- source_word: תִּהְיֶה
  choice: 如同（省去明说系词）
  rationale: 该未完成式在诗歌异象中描写所见景象。汉语名词谓语“光辉如同日光”无需另加“是”或明确时态，既自然又不强行限定为过去或将来。
- source_word: קַרְנַיִם
  choice: 光芒
  rationale: 该词字面为“角”（双数形式），在此处比喻向外伸展的光束。“光芒”清楚传达上下文中的形象；字面意义保留在脚注中。
- source_word: מִיָּדוֹ
  choice: 从他手中
  rationale: יָד通常意为“手”，מִן表示来源。保留身体意象，不将其抽象化。
- source_word: לוֹ
  choice: 他的（由上下文关系表达）
  rationale: 该代词的句法关系较难确定。译文借“他的光辉”及“从他手中”表达其指向神显中的那一位，避免生硬地直译为“归他”或“为他”。
- source_word: וְשָׁם
  choice: 就……在那里
  rationale: 保留地点副词“在那里”，并用“就”连接可见的光芒与隐藏的威能，使汉语诗句连贯。
- source_word: חֶבְיוֹן
  choice: 隐藏
  rationale: 该名词表示隐藏处、隐蔽或遮蔽。转译为谓语“隐藏”，符合现代汉语表达，同时保留原意。
- source_word: עֻזּוֹ
  choice: 他的威能
  rationale: עֹז表示力量、能力或威力。“威能”适合神显语境，兼具力量与庄严感，又不额外规定这种能力如何施展。
theological_decisions:
- issue: 神显中的拟人身体意象
  choice: 保留“从他手中”
  alternative: 译为较抽象的“从他身旁”
  rationale: 原文明确使用“手”的身体意象。保留这一诗性神显描写忠于原文，也不要求读者把它理解为对神形体的教义界定。
- issue: 可见光辉与隐藏威能之间的张力
  choice: 保留“他的威能就隐藏在那里”
  alternative: 解释为“光芒显明了他的威能”
  rationale: 原文将耀眼的显现与能力的隐藏并置。译文不将“隐藏”改写为“显明”，以保存这一真实的诗歌和神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“光辉”“日光”“威能”保持诗歌与神显场景的尊严；句式简洁，不添加原文没有的动作细节。脚注标记[a]已置于正文相应位置。
