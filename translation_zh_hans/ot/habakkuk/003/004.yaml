revisions:
- from: 他的光辉如同日光；光芒从他手中发出[a]，他的威能就隐藏在那里。
  to: 他的光辉如光；光芒从他手中而出[a]；他的威能隐藏在那里。
  rationale: 修订仅处理两处可安全校正之处：将“日光”还原为不限定来源的“光”，并使脚注不再加入“伸出”这一原文未明说的动作；同时删去略带解释性的“就”。其余保留原译对“手”、光束及隐藏威能之诗性张力的忠实表达。
