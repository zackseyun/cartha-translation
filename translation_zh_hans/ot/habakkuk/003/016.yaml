  to: '我听见了，内腑就颤抖；

    一听到那声音，我的嘴唇便发颤。

    腐朽侵入我的骨头，

    我的双腿在我身下发抖。

    我安静等候[a]灾难之日，

    等那侵袭我们的民前来[b]。'
  rationale: 修订保留先知由听见异象／声响而产生的内在震颤、嘴唇发颤和骨中腐朽等强烈身体意象；以“在我身下发抖”较贴近脚下不稳的原文画面。末句恢复来犯之民“前来／上来”的动作，避免把灾难的临到错误地施加在侵袭者身上。脚注仅保留动词与简略句法的可行歧义，不引入特定历史或教义解释。
