source:
  edition: WLC
  text: שָׁמַ֣עְתִּי וַ/תִּרְגַּ֣ז בִּטְנִ֗/י לְ/קוֹל֙ צָלֲל֣וּ שְׂפָתַ֔/י יָב֥וֹא רָקָ֛ב בַּ/עֲצָמַ֖/י וְ/תַחְתַּ֣/י אֶרְגָּ֑ז אֲשֶׁ֤ר אָנ֨וּחַ֙ לְ/י֣וֹם צָרָ֔ה לַ/עֲל֖וֹת לְ/עַ֥ם יְגוּדֶֽ/נּוּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/003/016.yaml
  text: I heard[a], and my inward parts trembled; at the sound my lips quivered. Rot enters into my bones, and beneath me I tremble, as I wait quietly for the day of distress[b], for the coming up of the people who will invade us.
translation:
  language: zh_hans
  text: '我听见了，内腑就颤抖；

    一听到那声音，我的嘴唇便发颤。

    腐朽侵入我的骨头，

    我的双腿在我身下发抖。

    我安静等候[a]灾难之日，

    等那侵袭我们的民前来[b]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “安静等候”也可译作“安歇”。这个希伯来语动词可表示安歇、停住或安静下来。
    reason: alternative_reading
  - marker: b
    text: 直译“等那侵袭我们的民上来”。“上来”可指来犯之军推进、前来；本句希伯来语结构简略。
    reason: syntactical_ambiguity
lexical_decisions:
- source_word: שָׁמַעְתִּי
  choice: 我听见了
  rationale: 以完成式表达先知听见之后的即时反应；“听见了”在现代汉语中自然，并保留原文简洁的第一人称陈述。
- source_word: וַתִּרְגַּז בִּטְנִי
  choice: 内腑就颤抖
  rationale: בטן本指腹部，也可指人的内在脏腑；“内腑”保留强烈的身体感，又比单说“肚腹”更适合庄重诗体。
- source_word: לְקוֹל
  choice: 一听到那声音
  rationale: קוֹל既可指声音，也可指嗓音；这里承接“听见”，采用范围较宽的“声音”，不限定其具体来源。
- source_word: צָלֲלוּ שְׂפָתַי
  choice: 我的嘴唇便哆嗦
  rationale: צָלֲלוּ在此描写因惊惧而震颤；“哆嗦”是自然的现代汉语身体反应词，并保留嘴唇实际颤动的画面。
- source_word: יָבוֹא רָקָב בַּעֲצָמַי
  choice: 腐朽侵入我的骨头
  rationale: רָקָב指腐朽、朽坏；“侵入”传达恐惧仿佛进入骨中的动态意象，没有将其弱化为一般的无力。
- source_word: וְתַחְתַּי אֶרְגָּז
  choice: 我也在原地战抖
  rationale: תַחְתַּי字面与“在我下面”或“我所在之处”有关；此处用“在原地”表达立足不稳的身体状态，同时保留אֶרְגָּז的第一人称动作。
- source_word: אֲשֶׁר אָנֻוּחַ
  choice: 我安静等候
  rationale: נוּחַ可指安歇、停住或安静下来；上下文同时包含惊惧与等候，因此译为“安静等候”，避免把它说成轻松安歇。
- source_word: לְיוֹם צָרָה
  choice: 灾难之日
  rationale: צָרָה可指困苦、患难或灾祸；“灾难之日”简洁庄重，适合这里临近审判的语境。
- source_word: לַעֲלוֹת לְעַם יְגוּדֶנּוּ
  choice: 等灾难临到那侵袭我们的民
  rationale: 将לַעֲלוֹת理解为前述灾难之日“上到、临到”某民，יְגוּדֶנּוּ则说明该民侵袭“我们”。这符合希伯来语介词结构，但句法简略，另一个可能读法在脚注中保留。
theological_decisions:
- issue: אֲשֶׁר אָנֻוּחַ表达安歇还是安静等候
  choice: 先知在恐惧中安静等候所定的灾难之日
  alternative: 先知将在灾难之日得安歇
  rationale: נוּחַ本身容许两种理解。正文选“安静等候”，使它与本节的身体战栗及随后信靠的语境相连，同时以脚注保留“安歇”的词义可能，不把经文强化为明确的获救应许。
- issue: 末句中的灾难临到谁
  choice: 灾难临到侵袭以色列的民
  alternative: 侵袭以色列的民上来，带来灾难之日
  rationale: לַעֲלוֹת לְעַם较自然地可理解为“上到／临到那民”，而יְגוּדֶנּוּ为“侵袭我们的”。但压缩的诗歌句法也容许把“上来”的主语理解为入侵者，因此用脚注保存这一张力。
translation_notes:
  register: 采用现代、庄重而可朗读的诗体汉语；以短句和分行保留原文连续的身体反应。“内腑”“腐朽”“灾难之日”保留先知诗歌的强烈意象；对两个主要歧义不在正文中展开解释，而以脚注保存。
