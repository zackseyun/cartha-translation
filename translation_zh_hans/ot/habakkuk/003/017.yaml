source:
  edition: WLC
  text: כִּֽי תְאֵנָ֣ה לֹֽא תִפְרָ֗ח וְ/אֵ֤ין יְבוּל֙ בַּ/גְּפָנִ֔ים כִּחֵשׁ֙ מַעֲשֵׂה זַ֔יִת וּ/שְׁדֵמ֖וֹת לֹא עָ֣שָׂה אֹ֑כֶל גָּזַ֤ר מִ/מִּכְלָה֙ צֹ֔אן וְ/אֵ֥ין בָּקָ֖ר בָּ/רְפָתִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/003/017.yaml
  text: Though the fig tree does not blossom[a], and there is no produce on the vines; the yield of the olive fails, and the fields produce no food; the flock is cut off from the fold, and there is no herd in the stalls[b],
translation:
  language: zh_hans
  text: 即使无花果树不发芽[a]，葡萄树不结果，橄榄树的收成落空[b]，田地不出粮食；羊群从圈中被剪除，棚里也没有牛群，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为无花果树不发芽……”。希伯来语开头的词既可表示原因（“因为”），也可在这里表示让步（“即使”）。“不发芽”也可译作“不开花”。
    reason: alternative_reading
  - marker: b
    text: 直译“橄榄树的出产失信”或“证明虚假”；这是指预期的橄榄收成未能实现。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 即使
  rationale: 该词可表示原因，也可在此诗歌语境中引出让步情形；下节以“然而”转入喜乐的宣告，因此译作“即使”最自然，同时以脚注保留“因为”的可能。
- source_word: תְאֵנָה לֹא תִפְרָח
  choice: 无花果树不发芽
  rationale: תְאֵנָה 指无花果树；פרח 可指萌芽、开花。译作“不发芽”自然地涵盖树木未能进入结果过程，另以脚注说明“不开花”的可能。
- source_word: וְאֵין יְבוּל בַּגְּפָנִים
  choice: 葡萄树不结果
  rationale: יְבוּל 指出产、收成；在葡萄树的语境中，“不结果”简洁自然，并保留作物歉收的具体意象。
- source_word: כִּחֵשׁ מַעֲשֵׂה זַיִת
  choice: 橄榄树的出产落空
  rationale: 字面近于“橄榄的产物失信/证明虚假”，是指预期的橄榄收成未能实现；“出产落空”既保留原文的失望色彩，也符合现代汉语。
- source_word: וּשְׁדֵמוֹת לֹא עָשָׂה אֹכֶל
  choice: 田地不出粮食
  rationale: שְׁדֵמוֹת 指耕地，עָשָׂה אֹכֶל 字面为“产生食物”；“不出粮食”是自然、具体的农业表达。
- source_word: גָּזַר מִמִּכְלָה צֹאן
  choice: 羊群从圈中断绝
  rationale: גזר 表示被剪除、断绝；צֹאן 是可包括绵羊和山羊的小型牲畜集合名词。“羊群”在汉语中自然且保持集合意义，“断绝”保留原文强烈而突兀的损失感。
- source_word: וְאֵין בָּקָר בָּרְפָתִים
  choice: 棚里也没有牛群
  rationale: בָּקָר 是牛的集合名词，רְפָתִים 指牲畜棚舍；译文保留与前句“圈中”的平行结构。
theological_decisions:
- issue: 开头 כִּי 的语篇关系
  choice: 译作让步性的“即使”
  alternative: “因为”
  rationale: 原词本身允许因果解释，但本节列举全面匮乏，并由下一节转入仍要喜乐的宣告，让步读法更符合上下文。脚注保留因果读法，避免消除原文歧义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话，保留诗句层层列举灾荒的节奏。以分号区分作物与牲畜两组意象；句末逗号承接下一节。避免用过度古雅的“无”“结实”等表达。
