base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/003/019.yaml
  text: 'The LORD, my Lord, is my strength; he makes my feet like the deer’s, and he causes me to tread on my heights.


    For the choir director: with my stringed instruments.'
translation:
  language: zh_hans
  text: '主耶和华是我的力量；他使我的脚像母鹿的脚，使我行在我的高处。


    交给乐长：用我的弦乐器。'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוִהּ אֲדֹנָי
  choice: 主耶和华
  rationale: 保留神名与“主”的并置；用现代中文圣经读者熟悉的“耶和华”表达四字神名，并以“主”对应 אֲדֹנָי。
- source_word: חֵילִי
  choice: 我的力量
  rationale: חַיִל 在此指力量、能力；直译自然，也与诗歌语境相符。
- source_word: כָּאַיָּלוֹת
  choice: 稳健如母鹿的蹄
  rationale: אַיָּלוֹת 是阴性复数，指母鹿；原文直说“使我的脚像母鹿”，中文补出“稳健”“蹄”以传达其在险峻之处脚步敏捷稳固的比喻。
- source_word: בָּמוֹתַי
  choice: 我的高处
  rationale: 保留第一人称所有格及“高处”的空间意象，不将其解释性改写为胜利、避难所或山岭。
- source_word: יַדְרִכֵנִי
  choice: 使我行
  rationale: 该使役形式可指使人踏行、引导其行走；此处采用简洁而不额外限定方向的译法。
- source_word: לַמְנַצֵּחַ בִּנְגִינוֹתָי
  choice: 交给乐长，用我的弦乐器伴奏
  rationale: לַמְנַצֵּחַ 作为诗篇式音乐题注译为“交给乐长”；נְגִינוֹת 通常指弦乐或弦乐伴奏，第一人称后缀译作“我的”。
theological_decisions:
- issue: יְהוִהּ אֲדֹנָי 两个神圣称谓的关系
  choice: 主耶和华
  alternative: 耶和华，我的主
  rationale: 马所拉文本的 אֲדֹנָי 无第一人称后缀，形式上不是“我的主”；因此不依英语咨询层添加“我的”。“主耶和华”保留两个称谓，又符合庄重的现代中文表达。
- issue: “我的高处”的含义
  choice: 保留“我的高处”
  alternative: 我的山岭／得胜的高处
  rationale: 原文可能描绘在险峻高地安然行走，也可能带有得胜或掌控之意；正文不替读者消解这一诗意张力。
- issue: 末句是否属于先知祷歌正文
  choice: 另起一段，作为音乐指示
  alternative: 与正文连续排列
  rationale: 其措辞与诗篇标题、结语中的音乐指示相近；分段反映功能差异，但不将其移出经文。
translation_notes:
  register: 采用庄重、清楚的现代标准普通话。“稳健如母鹿的蹄”以适度意译恢复希伯来比喻在中文中的自然含义；末句保持简洁的礼仪音乐用语。
