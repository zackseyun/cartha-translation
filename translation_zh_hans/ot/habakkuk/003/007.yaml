  yaml_path: translation/ot/habakkuk/003/007.yaml
  text: I saw the tents of Cushan under affliction; the tent curtains of the land of Midian were trembling.
translation:
  language: zh_hans
  text: 我看见古珊的帐棚陷在苦难中；米甸地的帐幔颤抖。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תַּחַת אָוֶן
  choice: 遭受苦难
  rationale: תחת 的具体关系在此可理解为“处于……之下”，与 אָוֶן（苦难、患难）合译为自然的现代汉语“遭受苦难”，同时不把苦难的具体性质说死。
- source_word: אָהֳלֵי כוּשָׁן
  choice: 古珊的帐棚
  rationale: 按专名处理 כּוּשָׁן，音译为“古珊”；“帐棚”保留 אָהֳלֵי 的游牧生活意象。
- source_word: יְרִיעוֹת
  choice: 帐幔
  rationale: 该词指构成或覆盖帐棚的幔幅；“帐幔”既准确又能与前句“帐棚”形成诗歌对应。
- source_word: יִרְגְּזוּן
  choice: 颤抖
  rationale: 该动词可表达震动、战栗或惊惶；“颤抖”保留自然震动与恐惧反应之间的诗意张力。
theological_decisions:
- issue: 苦难与帐棚之间的句法关系
  choice: 古珊的帐棚遭受苦难
  alternative: 我在苦难之下看见古珊的帐棚
  rationale: 将 תַּחַת אָוֶן 与“帐棚”关联，符合平行句中米甸帐幔颤抖的受影响景象，也与所给审定层一致；但不进一步说明苦难来自何者，以免加入经文未明说的因果。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语；保留希伯来诗歌中“帐棚／帐幔”和“苦难／颤抖”的平行结构。
