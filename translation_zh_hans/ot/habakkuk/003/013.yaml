base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/003/013.yaml
  text: You went out for the salvation of your people[a], for the salvation of your anointed one; you crushed the head of the house of the wicked, laying bare the foundation up to the neck[c][b]. Selah
translation:
  language: zh_hans
  text: 你出来，为要拯救你的子民[a]，为要拯救你的受膏者[b]；你击碎了恶人之家的头，显露根基，直至颈项[c]。细拉
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文两次重复“为要拯救”，分别与“你的子民”和“你的受膏者”相连。
    reason: lexical_alternative
  - marker: b
    text: “你的受膏者”可能指大卫王系的君王、代表百姓的人物或人格化的百姓，也可预表性地指向弥赛亚；希伯来文在这里没有限定为单一解释。
    reason: alternative_reading
  - marker: c
    text: 或译：“剥露根基，直至颈项。”这里的希伯来文意象较难理解，可能把拆毁房屋与显露身体的画面交织在一起。
    reason: lexical_alternative
lexical_decisions:
- source_word: יָצָאתָ
  choice: 你出来
  rationale: 该词是יצא的Qal完成式第二人称阳性单数，描写耶和华出来采取决定性的行动。“出来”直接保留原文措辞；“出征”虽符合战争语境，却增加了解释。
- source_word: לְיֵשַׁע
  choice: 为要拯救
  rationale: יֵשַׁע意为拯救、救助。汉语用动词短语比“为了……的拯救”自然，同时在两个平行分句中重复“为要拯救”，保留希伯来文的结构和强调。
- source_word: עַמֶּךָ
  choice: 你的子民
  rationale: 表达带第二人称阳性单数后缀的群体概念；“子民”自然保留圣约群体的语感。
- source_word: לְיֵשַׁע אֶת מְשִׁיחֶךָ
  choice: 为要拯救你的受膏者
  rationale: 保留第二个לְיֵשַׁע与前句的平行重复。מְשִׁיחֶךָ按描述性含义译作“你的受膏者”，不直接定为专名“弥赛亚”。
- source_word: מָחַצְתָּ
  choice: 你击碎了
  rationale: מחץ在战争语境中表示击碎、打碎；“击碎”既保留暴力力度，也能自然搭配“头”。
- source_word: רֹּאשׁ מִבֵּית רָשָׁע
  choice: 恶人之家的头
  rationale: 贴近原文次序，并保留“头”究竟偏向建筑顶部、家族首领或身体意象的含混性。“恶人之家”不把רָשָׁע过度具体化为某一个特定的邪恶人物。
- source_word: עָרוֹת
  choice: 显露
  rationale: 该词表达揭开、使裸露，可表示击碎之后伴随发生的动作或结果。“显露”在现代汉语中自然，又不替困难意象作过度说明。
- source_word: יְסוֹד
  choice: 根基
  rationale: “根基”直接对应建筑意象，也能与后面的身体意象形成原文所有的突兀张力。
- source_word: עַד צַוָּאר
  choice: 直至颈项
  rationale: 按字面保留这一困难而强烈的意象，不擅自判定它究竟描述彻底拆毁还是身体被剥露。
- source_word: סֶלָה
  choice: 细拉
  rationale: 沿用中文圣经传统音译，因为该词的确切功能仍不确定，意译会造成过度确定。
theological_decisions:
- issue: “你的受膏者”的所指
  choice: 正文采用描述性的“你的受膏者”，不进一步限定身份。
  alternative: 可理解为大卫王系的君王、代表百姓的人物、人格化的百姓，或预表性地指向弥赛亚。
  rationale: 希伯来文מְשִׁיחֶךָ具有君王和神学意涵，但本节没有强迫读者接受唯一所指；译文应保留这种张力，而不在正文中直接改为专名“弥赛亚”。
- issue: “恶人之家的头”的意象
  choice: 保留“头”与“家”的复合意象。
  alternative: 可解释为恶人之家的首领，或建筑的顶部。
  rationale: 原文可能交叠使用人体与建筑意象；具体化为“首领”或“屋顶”都会消除其真实含混性。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。两个“为要拯救”刻意保留原文平行重复；“受膏者”保持描述性，不直接使用专名“弥赛亚”；“头—家—根基—颈项”的混合意象按原文保留。
