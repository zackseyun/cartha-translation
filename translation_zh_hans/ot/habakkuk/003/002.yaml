id: HAB.3.2
reference: Habakkuk 3:2
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: יְהוָ֗ה שָׁמַ֣עְתִּי שִׁמְעֲ/ךָ֮ יָרֵאתִי֒ יְהוָ֗ה פָּֽעָלְ/ךָ֙ בְּ/קֶ֤רֶב שָׁנִים֙ חַיֵּ֔י/הוּ בְּ/קֶ֥רֶב שָׁנִ֖ים תּוֹדִ֑יעַ בְּ/רֹ֖גֶז רַחֵ֥ם תִּזְכּֽוֹר׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/003/002.yaml
  text: Yahweh[a], I have heard the report of you; I stand in awe. Yahweh, revive your work in the midst of the years; in the midst of the years make it known[e][d][c][b]; in wrath remember mercy.
translation:
  language: zh_hans
  text: '耶和华[a]啊，我听见了关于你的消息[b]，便心生敬畏[c]。


    耶和华啊，求你在年岁之中使你的作为重现生机[d]，


    在年岁之中使人知晓；


    在震怒中[e]，求你记得施怜悯[f]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “耶和华”对应希伯来文神名 יהוה（YHWH）；也常音译为“雅威”。
    reason: divine_name
  - marker: b
    text: 或译“你的声名”“关于你的消息”。希伯来文指人所听见的关于耶和华的事。
    reason: lexical_alternative
  - marker: c
    text: 或译“我就惧怕”。希伯来文可表达恐惧，也可表达敬畏。
    reason: lexical_alternative
  - marker: d
    text: 希伯来文直译为“使它活”；也可译“使它存活”或“使它复兴”。
    reason: lexical_alternative
  - marker: e
    text: 或译“在激愤中”“在动荡中”。此词可指震怒，也可指强烈扰动。
    reason: lexical_alternative
  - marker: f
    text: 希伯来文也可理解为“求你记得怜悯”或“求你记得要怜悯”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的专名形式，明确呈现以色列上帝的盟约之名；脚注说明其对应的希伯来文神名。
- source_word: שָׁמַעְתִּי שִׁמְעֲךָ
  choice: 我听见了关于你的传闻
  rationale: 保留同源词所表达的“听见有关你的事”这一含义；“传闻”在此指所听到的消息或声名，并不预断其具体内容。
- source_word: יָרֵאתִי
  choice: 便心生敬畏
  rationale: 该动词既可表示害怕，也可表示面对上帝时的敬畏；正文以“敬畏”贴合祷告语境，脚注保留“惧怕”的可能。
- source_word: פָּעָלְךָ
  choice: 你的作为
  rationale: “作为”自然涵盖上帝在历史中的行动和功业，同时不把所指限定为某一件事。
- source_word: בְּקֶרֶב שָׁנִים
  choice: 在年岁之中
  rationale: 较为贴近希伯来文空间性诗歌表达，保留所指时期并不完全确定的特点，避免直接释为“在我们的时代”。
- source_word: חַיֵּהוּ
  choice: 使你的作为重现生机
  rationale: 对应“使它活”的使役命令形式，以自然中文表达使上帝的作为重新活跃、彰显的祈求；脚注保留更直译的可能。
- source_word: תּוֹדִיעַ
  choice: 使它显明
  rationale: 表达使役式“使之被知道”，在中文诗歌语境中比“使它被人知道”更凝练，又不额外指定认识者。
- source_word: בְּרֹגֶז
  choice: 在震怒中
  rationale: 上下文将它与怜悯相对，较支持“怒气、震怒”；脚注保留“动荡、激愤”等词义范围。
- source_word: רַחֵם תִּזְכּוֹר
  choice: 求你记得施怜悯
  rationale: 按希伯来语次序和语义呈现“记得”与“怜悯”的结合，同时用“施怜悯”反映 רַחֵם 的动词性质。
theological_decisions:
- issue: 先知听见有关耶和华之事后的反应
  choice: 译为“心生敬畏”，同时保留惧怕成分
  alternative: “我就惧怕”或“我害怕了”
  rationale: 祷告和颂赞语境支持敬畏之意，但希伯来动词确实也可表示恐惧，因此以脚注避免消除敬畏与惧怕之间的张力。
- issue: 求上帝使其作为“活”的含义
  choice: 理解为求上帝使自己的作为重现生机
  alternative: 求上帝保全其作为，使其存活
  rationale: 宾语后缀回指“你的作为”，但经文本身没有明确限定是哪一项作为；正文表达更新、复兴之意，不具体指定某种救赎事件。
- issue: 震怒与怜悯的并置
  choice: 保留二者同时出现的祈求
  alternative: 将“震怒”弱化为一般的动荡或困境
  rationale: 本节刻意把上帝的怒气与怜悯并置；译文不把怜悯解释为取消震怒，也不把震怒解释为纯粹的人间局势。
translation_notes:
  register: 采用现代、庄重而可朗读的祷告体。“年岁之中”保留原文诗性和时间上的开放性；两次重复照原文保留。“重现生机”较自然地传达“使它活”，并以脚注呈现更形式对应的译法。所有脚注标记均紧随相关词句。
