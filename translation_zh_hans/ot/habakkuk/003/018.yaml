  text: וַ/אֲנִ֖י בַּ/יהוָ֣ה אֶעְל֑וֹזָה אָגִ֖ילָה בֵּ/אלֹהֵ֥י יִשְׁעִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/003/018.yaml
  text: Yet I will rejoice in Yahweh[b][a]; I will exult in the God of my salvation.
translation:
  language: zh_hans
  text: 然而，我要因雅威欢欣；我要因我救恩的上帝喜乐。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַאֲנִי
  choice: 然而，我
  rationale: 连词加独立人称代词突出先知本人的立场，与上一节所述的荒凉形成鲜明对比；“然而，我”自然传达转折和强调。
- source_word: בַּיהוָה
  choice: 因雅威
  rationale: 介词 ב 在此指出欢欣所基于或指向的对象；译作“因”符合现代汉语表达。יהוה 按其专名音译为“雅威”。
- source_word: אֶעְלוֹזָה
  choice: 我要……欢欣
  rationale: 该动词表示雀跃、欢欣；“欢欣”既有诗意，也适合庄重而通俗的经文语体。
- source_word: אָגִילָה
  choice: 我要……喜乐
  rationale: גיל 表示欢腾、喜悦，与前一动词近义并形成诗歌平行；用“喜乐”保留近义变化，避免机械重复。
- source_word: בֵּאלֹהֵי יִשְׁעִי
  choice: 因救我的上帝
  rationale: 直译可作“因我救恩的上帝”。“救我的上帝”以自然汉语表达构造关系，既可涵盖上帝施行拯救，也保留个人性的“我的”。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”以现代常见的学术性音译保留其专名性质，不以称号替代。
- issue: אֱלֹהֵי יִשְׁעִי 的关系
  choice: 救我的上帝
  alternative: 我救恩的上帝
  rationale: 原文构造短语可直译为“我救恩的上帝”。正文采用自然现代汉语“救我的上帝”，不将“救恩”限定为抽象事物；脚注保留较形式对应的译法。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言；两小句保持希伯来诗歌的平行结构，并用“欢欣／喜乐”呈现两个近义动词的递进呼应。
