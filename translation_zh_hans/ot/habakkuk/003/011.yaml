  text: שֶׁ֥מֶשׁ יָרֵ֖חַ עָ֣מַד זְבֻ֑לָ/ה לְ/א֤וֹר חִצֶּ֨י/ךָ֙ יְהַלֵּ֔כוּ לְ/נֹ֖גַהּ בְּרַ֥ק חֲנִיתֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/003/011.yaml
  text: Sun and moon stood in their lofty place[a]; at the light of your arrows they went[c][b], at the brightness of the flash of your spear.
translation:
  language: zh_hans
  text: 日月停驻在高处的居所[a]；在你箭矢光芒的照耀下前行[b]，在你长矛闪光的照耀下前行[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“日月停驻在自己的居所。”希伯来语 זְבֻלָה 可指高处的居所或崇高之地。
    reason: lexical_alternative
  - marker: b
    text: 希伯来原文十分凝练：“前行”的主语可能指日月，也可能、且更可能指上帝的箭矢和长矛飞驰。
    reason: alternative_reading
  - marker: c
    text: 或译：“在你长矛的电光下。”
    reason: lexical_alternative
lexical_decisions:
- source_word: שֶׁמֶשׁ יָרֵחַ
  choice: 日月
  rationale: 以简洁而庄重的诗歌表达保留两个天体并列的形式；现代汉语“日月”自然凝练。
- source_word: עָמַד
  choice: 停驻
  rationale: 该动词可表示站立、停住或保持不动；“停驻”兼顾静止之意与诗歌语体，不额外解释其机制。
- source_word: זְבֻלָה
  choice: 在高天
  rationale: זְבוּל可指高处的居所或崇高之地。“高天”保留其高远空间感，又避免强行引入特定宇宙观；另见脚注中的词义选择。
- source_word: לְאוֹר חִצֶּיךָ
  choice: 在你箭矢的光芒中
  rationale: 保留介词短语及箭矢发光的武器意象，并与下半句的辉光形成平行。
- source_word: יְהַלֵּכוּ
  choice: 它们前行
  rationale: 动词表达行进或移动。补出汉语所需的代词，但不明确其所指，从而保留希伯来诗句中主语指向的压缩与歧义。
- source_word: לְנֹגַהּ בְּרַק חֲנִיתֶךָ
  choice: 在你长矛闪耀的辉光中
  rationale: נֹגַהּ表示光辉，בָּרָק可表示闪光或闪电；此处用“闪耀的辉光”自然呈现兵器明亮闪动的视觉效果，“长矛”准确表达חֲנִית。
theological_decisions:
- issue: “它们前行”的主语所指
  choice: 正文保留代词“它们”，不明说是日月还是神的兵器。
  alternative: 明确译作“箭矢飞驰”，或理解为日月因神兵器的光而运行。
  rationale: 希伯来文结构简约，语法上可承接前句的日月，意象上又很可能描写箭矢和长矛飞驰。正文不替原诗消除这种张力，脚注说明主要可能。
translation_notes:
  register: 采用现代、庄重而凝练的诗歌语体。“停驻”“箭矢”“长矛”清楚易懂，同时保留神显场景的宏阔感。分号和并列介词短语呈现原文的诗行推进；代词所指不作过度澄清。
