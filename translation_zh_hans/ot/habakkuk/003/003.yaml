source:
  edition: WLC
  text: אֱל֨וֹהַ֙ מִ/תֵּימָ֣ן יָב֔וֹא וְ/קָד֥וֹשׁ מֵֽ/הַר פָּארָ֖ן סֶ֑לָה כִּסָּ֤ה שָׁמַ֨יִם֙ הוֹד֔/וֹ וּ/תְהִלָּת֖/וֹ מָלְאָ֥ה הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/003/003.yaml
  text: God comes from Teman[a], and the Holy One from Mount Paran. Selah. His splendor covers the heavens[d][c][b], and his praise fills the earth.
translation:
  language: zh_hans
  text: 神从提幔[a]而来，圣者从巴兰山而来。细拉[b]。他的威荣遮盖诸天[c][d]，他的颂赞充满大地。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “提幔”也可较广义地理解为“南方”；但这里与“巴兰山”平行，更可能是地名。
    reason: lexical_alternative
  - marker: b
    text: “细拉”是一个含义不确定的礼仪或音乐术语，传统上通常音译而不翻译。
    reason: cultural_note
  - marker: c
    text: “威荣”也可译作“威严”“荣美”或“光辉”。
    reason: lexical_alternative
  - marker: d
    text: 希伯来语的诗体动词形式也可按过去或将来理解，如“遮盖了……充满了……”或“必遮盖……必充满……”。
    reason: alternative_reading
lexical_decisions:
- source_word: אֱלוֹהַ
  choice: 神
  rationale: 该单数名词直接指神；“神”是现代汉语中自然、庄重且不增添原文未明说含义的译法。
- source_word: מִתֵּימָן
  choice: 从提幔
  rationale: “提幔”既可能关联南方，也可作地名；本句与“巴兰山”平行，故正文采用地名，并以脚注保留“南方”的可能。
- source_word: יָבוֹא
  choice: 而来
  rationale: 未完成式在这段神显诗歌中可表达生动呈现；汉语“而来”不强行限定为过去、现在或将来，适合保留诗歌的时间张力。
- source_word: וְקָדוֹשׁ
  choice: 圣者
  rationale: 形容词在此名词化，并与“神”平行，作为指向同一位神的称号；“圣者”简洁而庄重。
- source_word: מֵהַר פָּארָן
  choice: 从巴兰山
  rationale: 按地理名称直译，保留原诗的地域意象及与“提幔”的平行。
- source_word: סֶלָה
  choice: 细拉
  rationale: 此礼仪或音乐术语的确切含义不明，采用传统音译，避免将其武断解释为“停顿”等。
- source_word: כִּסָּה
  choice: 遮盖
  rationale: 该动词描写神的威荣遍及诸天；汉语无时态屈折，因而可自然保留诗歌中现在、过去或将来的开放性。
- source_word: שָׁמַיִם
  choice: 诸天
  rationale: “诸天”对应希伯来语形式，并保持崇高的诗体语域及宇宙性范围。
- source_word: הוֹדוֹ
  choice: 他的威荣
  rationale: הוֹד 可指威严、荣美或光辉；“威荣”兼顾尊威与荣光，适合神显语境，同时脚注列出其他可译法。
- source_word: וּתְהִלָּתוֹ
  choice: 颂赞他的声音
  rationale: 字面结构为“他的颂赞”，既可能指向他发出的赞美，也可能指归给他的赞美；结合诸天与大地充满神显彰显的平行意象，译为“颂赞他的声音”使现代汉语清楚，同时不将其抽象化为单纯属性。
- source_word: מָלְאָה הָאָרֶץ
  choice: 充满大地
  rationale: 阴性动词以“颂赞”为主语；“大地”与上句“诸天”相对，表达宇宙性的范围。
theological_decisions:
- issue: 神显事件的时间呈现
  choice: 采用不标明时态的汉语诗句“而来、遮盖、充满”
  alternative: 明确译作过去的“曾来、遮盖了、充满了”，或未来的“必来、必遮盖、必充满”
  rationale: 希伯来诗歌在回顾并重新呈现神的显现；汉语动词可不标时态，正好保存其生动临在感以及过去、现在和未来之间的张力。
- issue: “圣者”的所指
  choice: 视为与“神”平行、指向同一位神的称号
  alternative: 理解为另一位独立的神圣人物
  rationale: 两行的同义平行有力表明两者所指相同；译作“圣者”既保留称号，也不引入原文未支持的区分。
- issue: “他的颂赞”的语义指向
  choice: 译作“颂赞他的声音”，理解为遍地对神的颂赞
  alternative: 直译“他的颂赞”，或理解为神自身发出的赞美、名声或可赞美之处
  rationale: “他的颂赞”在汉语中容易含混且不自然；所选译文体现 תְּהִלָּה 常见的“赞美、颂赞”义，但原结构所容许的其他理解仍值得注意。
translation_notes:
  register: 采用现代、庄重而可朗读的诗体汉语。“而来”保持两行平行；“诸天／大地”呈现宇宙性对举。正文所有脚注标记均已对应列出，并将“细拉”的说明紧接其后。
