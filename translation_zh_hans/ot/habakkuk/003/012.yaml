  yaml_path: translation/ot/habakkuk/003/012.yaml
  text: In wrath you marched through the earth[b][a]; in anger you threshed the nations.
translation:
  language: zh_hans
  text: 你在盛怒中踏过大地[a]；你在怒气中打谷般践踏列国[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“土地”；希伯来语אֶרֶץ既可泛指大地，也可指某一片土地。
    reason: lexical_alternative
  - marker: b
    text: 或译“你践踏列国”；希伯来语该动词有打谷之意，而打谷常以踩踏进行。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּזַעַם
  choice: 在盛怒中
  rationale: 将介词 ב 与名词 זַעַם 合译为方式状语；“盛怒”自然有力，也与下半句形成诗性平行。
- source_word: תִּצְעַד
  choice: 踏遍
  rationale: צעד 表示迈步、行进；“踏遍”在中文中既体现有力而有目的的步伐，也自然表达行动遍及大地。
- source_word: אָרֶץ
  choice: 大地
  rationale: אֶרֶץ 可指全地，也可指特定土地。本段为神显与审判的宏阔诗歌场景，故正文采用“大地”，同时以脚注保留“那地”的可能。
- source_word: בְּאַף
  choice: 在怒气中
  rationale: אַף 本义为“鼻子”，在此为表达发怒的惯用语；“在怒气中”准确自然，并与“在盛怒中”平行。
- source_word: תָּדוּשׁ
  choice: 打谷般践踏
  rationale: דושׁ 的核心图像是打谷，古代常以踩踏完成。“打谷般践踏”保留农业隐喻，同时让普通中文读者清楚感受到动作方式。
- source_word: גּוֹיִם
  choice: 列国
  rationale: גּוֹיִם 指诸国或各民族；“列国”简洁、庄重，符合诗歌语体，且不引入后期的“外邦人”范畴。
theological_decisions:
- issue: 神显审判场景中 אָרֶץ 的范围
  choice: 大地
  alternative: 那地／土地
  rationale: 上下文呈现宏阔的神显和对列国的审判，“大地”较符合诗歌范围；但希伯来词本身也可指特定地域，因此不排除较窄解释。
- issue: תָּדוּשׁ 的审判意象
  choice: 保留打谷并践踏的复合意象
  alternative: 单译“践踏”或“打谷”
  rationale: 经文以打谷描绘对列国的审判。译文不把它抽象化为单纯“毁灭”，也不将比喻解释成特定历史事件，从而保留诗歌张力。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“踏遍大地”与“打谷般践踏列国”形成强烈动作画面；两个脚注标记均在正文出现，并保留原文的词义开放性。
