  text: Your bow is laid bare[a]; the rods are sworn by command. Selah[b]. You split the earth with rivers.
translation:
  language: zh_hans
  text: '你的弓完全显露出来；


    众杖的誓言，照着所说的话。[a]


    细拉。[b]


    你以江河劈开大地。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本句希伯来文极为简练，句法和含义均有争议。它包含“誓言”“杖／支派”和“话语／所说的话”等要素；也可理解为“向众支派所说的誓言”，或作类似译法。
    reason: alternative_reading
  - marker: b
    text: “细拉”是音译；这个词的确切含义和作用不确定，可能是诗歌或礼仪中的标记。
    reason: term_uncertainty
lexical_decisions:
- source_word: עֶרְיָה תֵעוֹר
  choice: 完全显露
  rationale: 这两个词叠加强调弓被揭开、显露出来；译作“完全显露”既保留强调语气，也不额外引入弓囊等原文未明说的意象。
- source_word: קַשְׁתֶּךָ
  choice: 你的弓
  rationale: 直接保留对上帝说话的第二人称和军事意象。
- source_word: שְׁבֻעוֹת
  choice: 立誓
  rationale: 该词通常指“誓言”；因本句高度省略，采用动词化表达，使中文成句，同时保留起誓的核心含义。
- source_word: מַטּוֹת
  choice: 众杖
  rationale: 该词可指“杖”，也可指“支派”。正文采用“众杖”，以呼应本段的武力意象；另一可能保留在脚注中。
- source_word: אֹמֶר
  choice: 奉命
  rationale: 字面义为“话语、所说的话”；在这一紧缩诗句中译作“奉命”，表达话语作为命令的力量，但不把命令的具体内容补入正文。
- source_word: סֶלָה
  choice: 细拉
  rationale: 其确切意义不明，采用传统音译，避免把不确定的礼仪或音乐功能定死。
- source_word: נְהָרוֹת
  choice: 以江河
  rationale: 保留复数河流意象，并将其理解为劈开大地的凭借或方式。
- source_word: תְּבַקַּע
  choice: 劈开
  rationale: 该加强语干表达强力裂开；“劈开”在现代中文中清楚有力。
- source_word: אָרֶץ
  choice: 大地
  rationale: 在宇宙性的显现诗歌中，“大地”比局部性的“土地”更符合上下文规模，同时仍保留其诗性。
theological_decisions:
- issue: שְׁבֻעוֹת מַטּוֹת אֹמֶר 的句法和意义
  choice: 众杖奉命立誓
  alternative: 所说的是向众支派所起的誓；或：众杖按话语起誓
  rationale: 原文极为紧缩，三个核心概念可分别指誓言、杖或支派、话语或命令。正文保留这些要素而不指定誓言内容；脚注明示另一重要读法，避免把有争议的句法解释成特定神学主张。
- issue: 河流与劈开大地的关系
  choice: 你以江河劈开大地
  alternative: 你把大地劈成江河
  rationale: 希伯来诗句容许工具性或结果性的理解。正文采用工具性读法，与所提供的审校层一致，但不把另一种可能提升为确定含义。
translation_notes:
  register: 采用现代、庄重而可诵读的诗体。用“完全显露”保留原文强调，用“众杖奉命立誓”有意维持难句的陌生感，并以脚注呈现真实歧义；“细拉”保留传统音译。
