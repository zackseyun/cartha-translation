base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/003/005.yaml
  text: Before him goes pestilence[b][a], and plague comes out at his feet.
translation:
  language: zh_hans
  text: 瘟疫行在他前面；热病[a]在他脚下[b]而出。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “热病”也可译作“灼热的瘟疫”或“疫病”；这里也可能诗意地影射名为 Resheph 的瘟疫神。
    reason: lexical_alternative
  - marker: b
    text: 直译“在他脚下”；也可理解为“随他的脚步而出”或“跟在他后面”。
    reason: lexical_alternative
lexical_decisions:
- source_word: לְפָנָיו
  choice: 在他前面
  rationale: 该短语表示位于某人面前或前方；译文保留神圣战士行进时有力量在前开路的空间意象。
- source_word: יֵלֶךְ
  choice: 行
  rationale: הלך在此以未完成式描绘诗歌中的生动画面；“行”简洁庄重，并与下半句“发出”形成动态对应。
- source_word: דָּבֶר
  choice: 瘟疫
  rationale: דָּבֶר常指带来死亡的瘟疫，尤其见于审判语境；“瘟疫”准确且符合庄严的诗体。
- source_word: וְיֵצֵא
  choice: 发出
  rationale: יצא意为出去、出来；结合“从他脚下”，译作“发出”自然地呈现这种毁灭力量随其行进而涌出的画面。
- source_word: רֶשֶׁף
  choice: 热病
  rationale: רֶשֶׁף可表示灼热、火焰、热病或疫病，也可能含有对古代瘟疫神Resheph的诗性影射。“热病”保留灼热与疾病两方面的联想，又不在正文中过度确定神话背景。
- source_word: לְרַגְלָיו
  choice: 从他脚下
  rationale: 原文直指“在/向他的脚”；配合יצא，中文用“从他脚下发出”既保留具体意象，也可让人联想到随其脚步或队列而出的力量。
theological_decisions:
- issue: רֶשֶׁף是否应作神名
  choice: 正文按普通名词译为“热病”
  alternative: 音译为“利舍弗”，视为古代瘟疫神的名称
  rationale: 马所拉文本的元音形式及其与דָּבֶר的平行关系支持普通名词理解。诗句或许借用了古代近东的拟人化意象，但正文不宜断定这里明确指一位神祇；该可能性留在脚注中。
- issue: לְרַגְלָיו所表达的行进关系
  choice: 保留具体身体意象，译为“从他脚下”
  alternative: 解释性地译为“跟在他后面”或“随他的脚步而来”
  rationale: 直译可保存原诗的鲜明画面，同时不排除它表示跟随在后、随行而来的含义。
translation_notes:
  register: 采用简洁、庄重而易懂的现代汉语诗体。“行在他前面”与“从他脚下发出”保留原文平行结构和神显行进的动态意象；脚注说明关键希伯来词的真实歧义，不在正文中强行消解。
