  text: נָקַ֤בְתָּ בְ/מַטָּי/ו֙ רֹ֣אשׁ פרז/ו יִסְעֲר֖וּ לַ/הֲפִיצֵ֑/נִי עֲלִ֣יצֻתָ֔/ם כְּמוֹ לֶ/אֱכֹ֥ל עָנִ֖י בַּ/מִּסְתָּֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/003/014.yaml
  text: You pierced the head of his warriors with his own staffs; they stormed out to scatter me[a], their exultation like one about to devour the poor in secret.
translation:
  language: zh_hans
  text: 你用他自己的杖刺穿了他战士们[a]的头；他们如暴风般冲来，要驱散我；他们得意欢腾，仿佛要暗中吞吃穷苦人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“他村庄的头”或“他成群部众的头”。这里的希伯来词含义难定，许多人较笼统地理解为敌人的队伍或首领。
    reason: alternative_reading
lexical_decisions:
- source_word: נָקַבְתָּ
  choice: 刺穿了
  rationale: נקב在此表达刺透、穿破；“刺穿”保留鲜明的战争意象。
- source_word: בְמַטָּיו
  choice: 用他自己的杖
  rationale: מַטֶּה的基本义是“杖、棍”；三单阳性后缀译为“他自己的”，凸显敌人反被自己的器具击败这一反讽。
- source_word: רֹאשׁ
  choice: 头
  rationale: רֹאשׁ既可指实际的头，也可引申为首领或前锋；直译“头”保留原文意象及其开放性。
- source_word: פְּרָזָיו
  choice: 他众战士
  rationale: 此词形和含义均有争议；上下文是敌军猛冲攻击，因此正文采用符合军事场景的“众战士”，并用脚注保留其他可能。
- source_word: יִסְעֲרוּ
  choice: 如暴风般冲来
  rationale: סער含猛烈如风暴般冲击、狂奔之意；此译兼顾风暴意象和进攻动作。
- source_word: לַהֲפִיצֵנִי
  choice: 要驱散我
  rationale: פוץ的使役形表示使分散、驱散；“驱散我”直接表达其宾语和攻击目的。
- source_word: עֲלִיצֻתָם
  choice: 他们欢欣雀跃
  rationale: 该名词指兴高采烈、得意欢腾；动词化表达在现代汉语中自然，同时传出敌人自得而残酷的喜悦。
- source_word: כְּמוֹ לֶאֱכֹל
  choice: 仿佛要……吞吃
  rationale: 保留比较结构及不定式所表达的意图，并呈现捕食般的暴力形象。
- source_word: עָנִי
  choice: 穷苦人
  rationale: עָנִי可指贫穷者或受苦、困乏者；“穷苦人”兼顾贫困与受压迫的意味。
- source_word: בַּמִּסְתָּר
  choice: 在隐秘处
  rationale: 该词可指藏身之处或隐秘状态；“在隐秘处”保留其地点色彩，也不限定究竟是谁藏匿。
theological_decisions:
- issue: 军事语境中疑难词פְּרָזָיו的解释
  choice: 他众战士
  alternative: 他的村庄／他的成群部众；整句也可理解为“他村庄（或部众）的头”
  rationale: 本节描绘敌人猛冲而来，要驱散说话者并吞吃穷苦人，军事所指最合近处语境；但希伯来词确有困难，故不将其他古老或可能的理解从读者面前隐去。
translation_notes:
  register: 采用现代、庄重而易懂的诗体散文；以“如暴风般冲来”“吞吃”保留原文强烈的战争与捕食意象。脚注标记紧随争议词“战士”，使注释对象清楚。
