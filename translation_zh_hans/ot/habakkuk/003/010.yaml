  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: רָא֤וּ/ךָ יָחִ֨ילוּ֙ הָרִ֔ים זֶ֥רֶם מַ֖יִם עָבָ֑ר נָתַ֤ן תְּהוֹם֙ קוֹל֔/וֹ ר֖וֹם יָדֵ֥י/הוּ נָשָֽׂא׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/003/010.yaml
  text: The mountains saw you and writhed[a]; a torrent of waters swept by. The deep gave its voice[c][b]; it lifted its hands on high.
translation:
  language: zh_hans
  text: 群山看见你就震颤[a]；洪流奔涌而过[b]。深渊发出声音，向高处举起双手[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“战抖”“扭动”或“痛苦翻腾”。这个希伯来动词可表示震动，也可带有如产痛般扭动的意味。
    reason: lexical_alternative
  - marker: b
    text: 较直译为“经过”。“奔涌而过”按洪流的语境表达其迅猛之势。
    reason: lexical_alternative
  - marker: c
    text: 原文直译为“向高处举起它的手”。有些人认为，“手”在这里比喻深渊涌起的波浪。
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאוּךָ
  choice: 看见你
  rationale: 这是 ראה 的 Qal 完成式，带第二人称阳性单数后缀，直译为“看见你”；保留受造界面对上帝显现而作出反应的拟人画面。
- source_word: יָחִילוּ
  choice: 震颤
  rationale: חול/חיל 可指颤抖、扭动或如产痛般战栗。“震颤”适合形容群山，既表达震动，也保留强烈而痛苦的动态感；其他可能译法见脚注。
- source_word: הָרִים
  choice: 群山
  rationale: 复数名词带定冠词；“群山”是自然、凝练的现代汉语诗体表达。
- source_word: זֶרֶם מַיִם
  choice: 洪流
  rationale: זֶרֶם 可指急流、倾泻或汹涌的水流，与 מַיִם 连用强调大量急速奔流的水。“洪流”简洁而有力度。
- source_word: עָבָר
  choice: 奔涌而过
  rationale: עבר 的基本义是“经过、越过”。以洪流为主语时，“奔涌而过”既保留“经过”的语义，也呈现水势；脚注注明较直译的可能。
- source_word: נָתַן תְּהוֹם קוֹלוֹ
  choice: 深渊发出声音
  rationale: 原文直义为“深渊发出它的声音”。译文采用自然汉语，同时保留深渊被拟人化并发声的意象。
- source_word: תְּהוֹם
  choice: 深渊
  rationale: 此词指深处或浩瀚深水。“深渊”在本节宇宙性水域意象中贴切，也不额外限定为某种后期神学概念。
- source_word: רוֹם
  choice: 向高处
  rationale: רוֹם 表示“高处、高空”，在这里修饰举手的动作；“向高处”清楚表达方向。
- source_word: יָדֵיהוּ נָשָׂא
  choice: 举起双手
  rationale: 原文按字面说深渊“举起它的手”。保留拟人化的“手”，不在正文中直接解释成波浪；汉语以“双手”自然表达成对的手。
theological_decisions:
- issue: 神显场景中受造界的拟人化描写
  choice: 保留群山看见并震颤、深渊发声并举手的拟人画面。
  alternative: 将全节处理成纯粹的自然现象，例如“山岭震动，波浪高涨”。
  rationale: 希伯来诗歌把群山和深渊描绘为对上帝显现作出回应。保留这种拟人化既忠于原文，也避免把富有神学张力的诗意形象化约为气象描述。
translation_notes:
  register: 采用现代、庄重而富有诗意的简体中文。“群山”“洪流”“深渊”形成凝练的神显场景；句法尽量贴近希伯来诗行，同时通过“奔涌而过”“向高处”等表达保持自然可读。
