  text: עָמַ֣ד וַ/יְמֹ֣דֶד אֶ֗רֶץ רָאָה֙ וַ/יַּתֵּ֣ר גּוֹיִ֔ם וַ/יִּתְפֹּֽצְצוּ֙ הַרְרֵי עַ֔ד שַׁח֖וּ גִּבְע֣וֹת עוֹלָ֑ם הֲלִיכ֥וֹת עוֹלָ֖ם לֽ/וֹ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/003/006.yaml
  text: He stood and measured the earth[a]; he looked and made nations tremble. The ancient mountains were shattered; the everlasting hills sank low[b]. His ways are everlasting.
translation:
  language: zh_hans
  text: 他站立，量了大地；他观看，使列国惊惶[a]。亘古的山岭崩裂；永远的冈陵下沉。 他的行进永存[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“使列国惊惶”，也可能译作“驱散列国”。这里的希伯来语动词含义不易确定，确切细微差别仍有争议。
    reason: lexical_alternative
  - marker: b
    text: 或译：“他的道路永远长存”或“他的路径永恒”。
    reason: lexical_alternative
lexical_decisions:
- source_word: עָמַד
  choice: 他站立
  rationale: 按基本义译为“站立”，保留神显诗歌中庄严而有力的临在感，不额外加入“摆开阵势”等解释。
- source_word: וַיְמֹדֶד אֶרֶץ
  choice: 量了大地
  rationale: מדד最常见的意义是“量、丈量”；虽有“使震动”的解释传统，但正文优先依据辅音文本和通常词义。
- source_word: רָאָה
  choice: 他一看
  rationale: רָאָה可译“看”或“看见”；“一看”自然呈现连续而迅疾的诗性动作。
- source_word: וַיַּתֵּר גּוֹיִם
  choice: 就使列国震动
  rationale: 该动词词义困难且有争议；此译表达列国因神显而惊动、战栗的效果，并在脚注保留其他可能。
- source_word: וַיִּתְפֹּצְצוּ
  choice: 崩裂
  rationale: 该反身形态描绘猛烈破裂；“崩裂”适合山岭意象，也保留宇宙性神显的力度。
- source_word: הַרְרֵי עַד
  choice: 亘古的山岭
  rationale: עַד在此强调久远和恒存；“亘古”既庄重又与诗体相称。
- source_word: שַׁחוּ
  choice: 沉下
  rationale: 该词可指下沉或俯伏；用于冈陵时，“沉下”保留自然界降低的画面，同时不排除在神面前降服的诗意。
- source_word: גִּבְעוֹת עוֹלָם
  choice: 永存的冈陵
  rationale: עוֹלָם在平行结构中突出久远、看似恒存；“永存”保留这种张力。
- source_word: הֲלִיכוֹת עוֹלָם לוֹ
  choice: 他的道路亘古常存
  rationale: הֲלִיכוֹת可指行走、行程、道路或作为；此译自然凝练，同时保留其可能指神行进方式或恒久作为的开放性。
theological_decisions:
- issue: 拟人化与宇宙性神显语言
  choice: 作为神显诗歌，直接保留神站立、观看以及受造界和列国震动的宏大图景。
  alternative: 把所有动作仅解释为国家政治事件的比喻，或把每个诗歌意象都规定为严格字面的宇宙事件。
  rationale: 本章以崇高诗体描写神在历史与受造界中的显现和行动；译文应保存其真实力度与诗性张力，不将其缩减或过度体系化。
- issue: הֲלִיכוֹת עוֹלָם לוֹ的时间与行动含义
  choice: 译作“他的道路亘古常存”，兼顾神恒久的道路与行动方式。
  alternative: 译作“他的行进自古就有”或“他的路径永远长存”。
  rationale: 原文既可能着重神的行进，也可能概括其恒久的作为和道路；正文避免将其限定为单一教义命题，脚注保留较直译表达。
translation_notes:
  register: 采用现代、庄重而可懂的普通话诗体。“亘古—永存—亘古常存”的用词呼应原文עַד与עוֹלָם的平行和末句总结；标点分出神的动作、受造界的反应及结语。所有脚注标记均已置于正文。
