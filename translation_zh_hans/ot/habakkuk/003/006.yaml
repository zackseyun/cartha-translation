  terminology: “大地、列国、亘古的山岭、永远的冈陵”均适合庄重的现代中文诗体。“冈陵”虽较书面，但在此诗歌体裁中可接受。脚注应将不自然的“惊跳”改为“使列国惊惶”，并保留“驱散列国”的争议性可能。
