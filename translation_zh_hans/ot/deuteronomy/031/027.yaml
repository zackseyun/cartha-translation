base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/027.yaml
  text: For I know your rebellion and your stiff neck[a]. Look, while I am still alive with you today, you have been rebellious against Yahweh[b]; and how much more after my death!
translation:
  language: zh_hans
  text: 因为我知道你的悖逆和刚硬的颈项[a]。看哪，我今天还活着、仍与你们同在的时候，你们尚且悖逆雅威[b]，何况我死后呢！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“刚硬的颈项”，是形容顽固、执拗、不肯顺服的惯用说法。
    reason: lexical_alternative
  - marker: b
    text: “悖逆雅威”中的希伯来文介词通常意为“与”；在这里与“悖逆”连用，意思是与雅威敌对、反抗雅威。
    reason: lexical_alternative
lexical_decisions:
- source_word: מֶרְיְךָ
  choice: 你的悖逆
  rationale: מֶרִי表示悖逆、反抗，尤其可指对盟约之主的抗拒；保留名词形式，也与后文的动词表达相呼应。
- source_word: עָרְפְּךָ הַקָּשֶׁה
  choice: 刚硬的颈项
  rationale: 直译并保留希伯来文以颈项刚硬比喻顽梗不服的形象；脚注说明其惯用含义。
- source_word: הֵן
  choice: 看哪
  rationale: 作为引人注意并加强语气的话语标记，“看哪”庄重而清楚，也保留原文的强调作用。
- source_word: בְּעוֹדֶנִּי חַי
  choice: 我还活着……的时候
  rationale: 自然表达“在我仍然活着期间”的时间含义，并保留“还”的延续语气。
- source_word: מַמְרִים הֱיִתֶם
  choice: 你们尚且悖逆
  rationale: 分词与היה的组合描述持续或一贯的状态；“尚且”结合上下文突出从现今到死后的递进推论。
- source_word: עִם יְהוָה
  choice: 悖逆雅威
  rationale: עִם通常意为“与……同在/一起”，但与“悖逆”连用时在此表示敌对的对象；汉语直接以“悖逆雅威”表达，脚注保留字面结构的可能性。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，保留其作为以色列之神专名的性质，而不以称号代替。
- source_word: וְאַף כִּי
  choice: 何况
  rationale: 该组合在此从较轻情形推及更甚情形；“尚且……何况……”自然呈现原文的递进和反问力度。
- source_word: אַחֲרֵי מוֹתִי
  choice: 我死后
  rationale: 简洁自然地表达“在我的死亡之后”，符合现代汉语习惯。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；采用“雅威”保留其专名性质，避免用称号替换。
- issue: עִם יְהוָה在“悖逆”后的关系含义
  choice: 悖逆雅威（表示反抗雅威）
  alternative: 与雅威一起／同雅威
  rationale: 介词עִם本义通常是“与”，但由支配它的“悖逆”及上下文可知，这里表达敌对关系。正文采用合乎汉语的对象结构，脚注提示原文字面形式，以免掩盖语言张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。正文保留“刚硬的颈项”这一源语比喻，并以脚注解释；用“尚且……何况……”重现原文的递进反问。原文先以第二人称单数把以色列视为一个整体，后转为复数称呼众人，译文相应保留“你／你们”的转换。
