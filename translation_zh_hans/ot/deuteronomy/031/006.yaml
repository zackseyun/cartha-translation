  text: חִזְק֣וּ וְ/אִמְצ֔וּ אַל תִּֽירְא֥וּ וְ/אַל תַּעַרְצ֖וּ מִ/פְּנֵי/הֶ֑ם כִּ֣י יְהוָ֣ה אֱלֹהֶ֗י/ךָ ה֚וּא הַ/הֹלֵ֣ךְ עִמָּ֔/ךְ לֹ֥א יַרְפְּ/ךָ֖ וְ/לֹ֥א יַעַזְבֶֽ/ךָּ־־׀׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/006.yaml
  text: Be strong and courageous[a]. Do not fear or be terrified because of them, for Yahweh your God is the one who goes with you[b]; he will not fail you or forsake you.
translation:
  language: zh_hans
  text: 你们要刚强勇敢[a]；不要因他们而惧怕，也不要惊恐，因为雅威——你的上帝——亲自与你同行；他必不放手，也不离弃你[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “你们要刚强勇敢”在原文是两个复数命令；从“你的上帝”起则转用第二人称单数，把以色列全体作为一个整体来劝勉。
    reason: grammatical_number
  - marker: b
    text: “不放手”所译的希伯来语字面可指不松手、不放松扶持；其意是雅威不会撤去对你的扶持。
    reason: lexical_alternative
lexical_decisions:
- source_word: חִזְקוּ וְאִמְצוּ
  choice: 你们要刚强勇敢
  rationale: 两个复数命令式构成固定的劝勉搭配；“刚强勇敢”在现代汉语中简洁自然，并保留力量与勇气两方面。
- source_word: אַל תִּירְאוּ וְאַל תַּעַרְצוּ
  choice: 不要……害怕，也不要惊恐
  rationale: 分别表达一般的惧怕和更强烈的惊恐，保留原文递进语气。
- source_word: מִפְּנֵיהֶם
  choice: 因他们
  rationale: 字面与“在他们面前”有关，此处自然表达引发恐惧的原因。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以通行的现代汉语音译呈现四字神名，保留其作为专名的性质。
- source_word: אֱלֹהֶיךָ
  choice: 你们的上帝
  rationale: 希伯来语形式为第二人称单数，但摩西对全体百姓说话；汉语主文按群体受话语境使用“你们”，并在脚注说明形式差异。
- source_word: הוּא הַהֹלֵךְ עִמָּךְ
  choice: 亲自与你们同行
  rationale: 独立代词加分词带有强调；“亲自”体现“他正是那位”的强调，“同行”自然传达持续同在。
- source_word: לֹא יַרְפְּךָ
  choice: 他不会撇下你
  rationale: רפה使役式可表示松手、任其软弱或不再扶持；“撇下”在汉语中表达不放任、不丢下，同时与下一个动词有所区别。
- source_word: וְלֹא יַעַזְבֶךָ
  choice: 也不会离弃你
  rationale: עזב表示离开、抛弃；“离弃”保留庄重的盟约保证语气。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用神的专名；音译为“雅威”既保留专名性质，也避免以称号替代。
- issue: 两个保证动词 יַרְפְּךָ 与 יַעַזְבֶךָ 的区分
  choice: 不会撇下你，也不会离弃你
  alternative: 不会丢下你，也不会抛弃你；不会使你失望，也不会离弃你
  rationale: 前者有松手、不再扶持之意，后者侧重离开或抛弃；译文保留双重保证，而不把两者完全合并。
- issue: 受话对象的数变化
  choice: 命令使用复数“你们”，后半句按群体语境译作“你们”，保证语保留单数“你”
  alternative: 全节统一译为“你们”
  rationale: 原文先以复数命令全体百姓，随后转用单数，把以色列整体视作一个受话者。汉语主文兼顾自然表达，并以脚注揭示这一修辞变化。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“惊恐”体现第二个恐惧动词较强的力度；神名译作“雅威”。主文在群体称谓与原文单数保证之间保留张力，并用脚注交代希伯来语数的转换。
