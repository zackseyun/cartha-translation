  naturalness: 建议以“他们的儿女，就是那些未曾知晓的”表达原文的同位限定，并把“那地”及其“渡过约旦河要去取得为业”的修饰关系明确呈现。修订后语序自然，仍保持庄重的现代汉语经文语体。
  terminology: “雅威”“上帝”“敬畏”“儿女”和“取得为业”均合宜。保留“雅威”作为四字神名的音译；“敬畏”恰当保留ירא在申命记盟约语境中的分量。
