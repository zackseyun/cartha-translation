  text: וּ/בְנֵי/הֶ֞ם אֲשֶׁ֣ר לֹֽא יָדְע֗וּ יִשְׁמְעוּ֙ וְ/לָ֣מְד֔וּ לְ/יִרְאָ֖ה אֶת יְהוָ֣ה אֱלֹהֵי/כֶ֑ם כָּל הַ/יָּמִ֗ים אֲשֶׁ֨ר אַתֶּ֤ם חַיִּים֙ עַל הָ֣/אֲדָמָ֔ה אֲשֶׁ֨ר אַתֶּ֜ם עֹבְרִ֧ים אֶת הַ/יַּרְדֵּ֛ן שָׁ֖מָּ/ה לְ/רִשְׁתָּֽ/הּ־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/013.yaml
  text: And their children[a], who have not known[c][b], shall hear and learn to fear Yahweh your God all the days that you live on the land that you are crossing the Jordan to possess.
translation:
  language: zh_hans
  text: 他们的儿女[a]，就是那些未曾知晓的，也要聆听并学习敬畏雅威[b]——你们的上帝，在你们活在那地的一切日子里；那地是你们渡过约旦河要去取得为业[c]的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“儿子”。希伯来语这个词既可特指儿子，也可泛指儿女或后代。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文为上帝的名字YHWH；中文传统上常译作“耶和华”。
    reason: alternative_reading
  - marker: c
    text: 也可译“占有那地”或“承受那地”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵיהֶם
  choice: 他们那些……的儿女
  rationale: בנים既可特指儿子，也可泛指儿女或后代；本节着眼于尚未受教的下一代，因此正文采用不局限于男性的“儿女”，并以脚注保留“儿子”这一较窄译法。
- source_word: אֲשֶׁר לֹא יָדְעוּ
  choice: 还不知晓的
  rationale: ידע的完成式表示他们此前尚未获得相关知识或经历。“还不知晓”既保留先前未知的意味，也符合现代汉语表达。
- source_word: יִשְׁמְעוּ וְלָמְדוּ
  choice: 也要听，并……学习
  rationale: 两个动词构成先听后学的连续行动；“要”表达此处面向下一代的预期和目的，而不把语气过度限定为单纯未来或直接命令。
- source_word: לְיִרְאָה
  choice: 学习敬畏
  rationale: ירא在申命记的盟约语境中兼有惧怕、尊崇和顺服的分量。“敬畏”是自然且有神学厚度的中文表达，没有弱化为单纯尊敬。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文四字神名YHWH的常见学术拟音译出上帝的专名，而不以称号替代；脚注说明传统中文译法。
- source_word: כָּל הַיָּמִים אֲשֶׁר אַתֶּם חַיִּים עַל הָאֲדָמָה
  choice: 在你们生活于那片土地上的一切日子里
  rationale: 保留“所有日子”的持续性以及עַל הָאֲדָמָה所指的应许之地，同时采用自然、庄重的现代汉语语序。
- source_word: אֲשֶׁר אַתֶּם עֹבְרִים אֶת הַיַּרְדֵּן שָׁמָּה
  choice: 你们正渡过约旦河，前去
  rationale: “正渡过”体现分词所表达的进行中行动，“前去”传达שָׁמָּה的方向意味。
- source_word: לְרִשְׁתָּהּ
  choice: 取得那地为业
  rationale: ירשׁ在申命记中兼有取得、占有和承受产业的含义。“取得……为业”保留实际占有与产业两方面的意味，脚注列出较简洁的替代译法。
theological_decisions:
- issue: 四字神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用盟约之神的专名。正文采用YHWH的常见拟音“雅威”，避免以称号“上主”替代专名；同时在脚注交代中文传统译名“耶和华”。
- issue: בנים在盟约教导中的范围
  choice: 儿女
  alternative: 儿子
  rationale: 上下文论及未曾知晓律法的下一代，所指并非显然只限男性。“儿女”体现该词在此处可能具有的广义、代表性用法，同时以脚注保留字面较窄的可能。
- issue: “敬畏”所表达的盟约关系
  choice: 敬畏
  alternative: 尊崇
  rationale: “敬畏”保留原词既含畏惧又含尊崇、顺服的张力；仅译作“尊崇”会削弱其严肃性。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“一切日子”略带经文语体，用来保留原文持续终身的强调；句末分号后的分句清楚交代“那片土地”的方位与目的，又避免过长的前置定语。所有脚注标记均紧随其所解释的词语。
