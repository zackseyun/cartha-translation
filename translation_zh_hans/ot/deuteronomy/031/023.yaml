source:
  edition: WLC
  text: וַ/יְצַ֞ו אֶת יְהוֹשֻׁ֣עַ בִּן נ֗וּן וַ/יֹּאמֶר֮ חֲזַ֣ק וֶֽ/אֱמָץ֒ כִּ֣י אַתָּ֗ה תָּבִיא֙ אֶת בְּנֵ֣י יִשְׂרָאֵ֔ל אֶל הָ/אָ֖רֶץ אֲשֶׁר נִשְׁבַּ֣עְתִּי לָ/הֶ֑ם וְ/אָנֹכִ֖י אֶֽהְיֶ֥ה עִמָּֽ/ךְ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/023.yaml
  text: And he commanded Joshua son of Nun and said[a], “Be strong and courageous, for you will bring the sons of Israel into the land that I swore to them, and I will be with you.”
translation:
  language: zh_hans
  text: 他吩咐嫩的儿子约书亚说：“你要刚强勇敢，因为你必带领以色列子孙[a]进入我向他们起誓应许的那地；我必与你同在。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“以色列人”或“以色列民”。希伯来语直译为“以色列的众子”。
    reason: 说明原文亲属称谓的字面形式及可采用的自然集体译法。
lexical_decisions:
- source_word: וַיְצַו
  choice: 吩咐
  rationale: צוה 的 Piel 词干表示郑重命令或嘱咐；“吩咐”既保留权威性，也符合现代汉语的差遣语境。
- source_word: יְהוֹשֻׁעַ בִּן נוּן
  choice: 嫩的儿子约书亚
  rationale: 采用中文圣经传统中通行的人名译法，并明确保留父子称谓。
- source_word: חֲזַק וֶאֱמָץ
  choice: 你要刚强勇敢
  rationale: 两个并列祈使词分别强调坚强和勇毅；这一译法简洁、庄重，也保留固定劝勉语的力度。
- source_word: כִּי
  choice: 因为
  rationale: 此处引出前述劝勉的根据，用“因为”清楚表达因果关系。
- source_word: תָּבִיא
  choice: 你必带领……进入
  rationale: בוא 的 Hiphil 形式有“使进入、带入”之意；对群体而言，“带领……进入”是自然且准确的现代汉语。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列子孙
  rationale: 保留希伯来语亲属群体称谓的家族与盟约色彩，同时比生硬直译“以色列的众子”更符合现代汉语。
- source_word: הָאָרֶץ
  choice: 那地
  rationale: 定冠词和上下文指向已经应许之地；“那地”保留其特指性，并与申命记的土地主题相连。
- source_word: אֲשֶׁר נִשְׁבַּעְתִּי לָהֶם
  choice: 我向他们起誓应许的
  rationale: 原文直说“我向他们起誓”；汉语用“起誓应许”自然表达誓言所具有的承诺性质，又不在正文中明确补入原文未写出的“赐给”。
- source_word: וְאָנֹכִי אֶהְיֶה עִמָּךְ
  choice: 我必与你同在
  rationale: 保留重要的同在应许公式；“必”表达未完成式在此处的承诺语气，独立代词 אָנֹכִי 的强调由句首“我”和语境承载。
theological_decisions:
- issue: וַיְצַו / וַיֹּאמֶר 的隐含主语
  choice: 正文译作“他”，不补出专名
  alternative: 译作“耶和华”
  rationale: 本节希伯来文本仅有第三人称阳性单数主语，未在句内明说名字。后面的第一人称誓言和同在应许显示说话者是上帝，但正文仍保留原文的指代方式，避免把上下文信息直接加入本节。
- issue: בְּנֵי יִשְׂרָאֵל 的群体称谓
  choice: 以色列子孙
  alternative: 以色列人；以色列民；以色列的众子
  rationale: “以色列子孙”既保留原文以“众子”描述盟约群体的家族意象，也能在现代汉语中自然指全体以色列民，不把所指范围缩限为男性。
- issue: 誓言从句中省略的应许内容
  choice: 我向他们起誓应许的那地
  alternative: 我起誓要赐给他们的那地
  rationale: “赐给”符合上下文，却不是本节该从句明说的词。所选译文保留原句的简约和开放性，同时让现代汉语读者明白这里是带有誓言的应许。
translation_notes:
  register: 采用现代、庄重而清楚的叙事语体。“刚强勇敢”和“我必与你同在”保留经文劝勉与应许的凝练节奏；标点采用简体中文规范。
