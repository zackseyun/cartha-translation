  text: Then Moses went and spoke these words to all Israel[a].
translation:
  language: zh_hans
  text: 随后[a]，摩西前去，向全以色列说了这些话。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“摩西前去，向全以色列说了这些话。”句首连接词更形式对应地可译为“而”或“于是”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: 去
  rationale: הלך在此为叙事体未完成式连续形式，基本义是“去、行走”。虽然原文未说明目的地，仍保留“去”，不把它意译为“接着”或“继续”。
- source_word: מֹשֶׁה
  choice: 摩西
  rationale: 采用现代汉语圣经传统中通行的人名译法。
- source_word: וַיְדַבֵּר
  choice: 说了
  rationale: דבר的皮勒词干在这里表示“说、讲”。“说了这些话”既自然，也保留其与“这些话”之间的明确宾语关系。
- source_word: אֶת הַדְּבָרִים הָאֵלֶּה
  choice: 这些话
  rationale: 该短语直译为“这些话”，指向随后所述的具体言语内容；不泛化为“这些事”或“这番信息”。
- source_word: אֶל
  choice: 向
  rationale: 介词אֶל在这里标明说话所面向的对象，现代汉语用“向”表达自然准确。
- source_word: כָּל יִשְׂרָאֵל
  choice: 全以色列
  rationale: 保留以色列作为整体民族和盟约群体的集合表达，避免改成偏重个体成员的“所有以色列人”。
- source_word: וַ
  choice: 随后
  rationale: 句首连接词在希伯来叙事中推进事件次序；“随后”符合现代汉语叙事习惯，同时保留顺承作用。
