  text: וַֽ/יהוָ֞ה ה֣וּא הַ/הֹלֵ֣ךְ לְ/פָנֶ֗י/ךָ ה֚וּא יִהְיֶ֣ה עִמָּ֔/ךְ לֹ֥א יַרְפְּ/ךָ֖ וְ/לֹ֣א יַֽעַזְבֶ֑/ךָּ לֹ֥א תִירָ֖א וְ/לֹ֥א תֵחָֽת׀׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/008.yaml
  text: And Yahweh himself is the one going before you[a]. He himself will be with you; he will not fail you or forsake you. Do not fear or be dismayed.
translation:
  language: zh_hans
  text: 雅威亲自走在你前面。他必与你同在，绝不会放开你[a]，也绝不会离弃你。不要惧怕，也不要惊惶。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “放开你”也可译作“松开手不扶持你”。
    reason: רפה的使役式在此可指松手、任其下沉，或不再扶持；此译法保留其扶持／松手的形象，且不加入「孤立」这一原文未明说的概念。
lexical_decisions:
- source_word: וַיהוָה
  choice: 雅威
  rationale: 直接音译四字神名，保留经文所使用的上帝之约名。
- source_word: הוּא
  choice: 亲自／他
  rationale: 独立人称代词在首句有强调作用，译作“亲自”；次句以“他”承接，中文已能自然表达强调，无须生硬重复。
- source_word: הַהֹלֵךְ לְפָנֶיךָ
  choice: 走在你前面
  rationale: 分词描写雅威正在并持续走在约书亚前面；中文表达兼具引领与先行之意。
- source_word: יִהְיֶה עִמָּךְ
  choice: 必与你同在
  rationale: 准确保留将来时语境中的应许及同在语言。
- source_word: יַרְפְּךָ
  choice: 绝不会放开你
  rationale: רפה的使役式可指松手、任其下沉或不再扶持；“放开你”保留形象，也与下句“离弃”有所区分。
- source_word: יַעַזְבֶךָּ
  choice: 绝不会离弃你
  rationale: 表达עזב的离开、抛弃之义，并保持庄重的盟约语体。
- source_word: לֹא תִירָא
  choice: 不要惧怕
  rationale: 此处未完成式具有禁止、劝勉功能；译文简洁庄重。
- source_word: וְלֹא תֵחָת
  choice: 也不要惊惶
  rationale: חתת的被动词干可表示因威胁而惊惶、丧胆或崩溃；“惊惶”既自然，又不与“惧怕”完全重复。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华／上主
  rationale: 原文直接使用四字神名；“雅威”较贴近学界普遍重构的读音，并保留其作为专名的功能，不以称号替代。
- issue: רפה与עזב构成的双重应许
  choice: 放开你／离弃你
  alternative: 撇下你／丢弃你
  rationale: 采用两个不同动词，尽量保留原文先说不松手、不任其失去扶持，继而说不抛弃的语义张力，避免将二者完全合并。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。第二人称单数依中文习惯译作“你”，对象是约书亚。句式保留原文的强调与递进，同时避免不自然的希伯来语式重复。
