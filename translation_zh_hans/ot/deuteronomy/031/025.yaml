  text: 摩西吩咐抬运雅威的约柜的利未人，说：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְצַו
  choice: 吩咐
  rationale: 该动词表示发出命令或郑重嘱咐；“吩咐”既准确，也适合摩西向利未人下达指示的语境。
- source_word: הַלְוִיִּם
  choice: 利未人
  rationale: 这是现代中文圣经语境中对该支派群体的标准称呼。
- source_word: נֹשְׂאֵי
  choice: 抬……的
  rationale: 分词作定语，说明这些利未人承担抬约柜的职责；中文用关系结构表达自然，同时保留其描述性。
- source_word: אֲרוֹן בְּרִית
  choice: 约柜
  rationale: 原文为“约的柜”，在圣所与立约语境中，“约柜”是准确、凝练且通行的中文表达。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译呈现四字神名，保留其作为以色列之上帝专名的性质，而不以称号代替。
- source_word: לֵאמֹר
  choice: 说：
  rationale: 这是引出下一节直接引语的常用公式；“说”忠实简洁，冒号符合现代中文标点习惯。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。译作“雅威”保留专名性质，并采用现代汉语中较贴近通常学术重构读音的音译；不以“主”这一称号取代原文专名。
- issue: נֹשְׂאֵי 是当下动作还是职责性称谓
  choice: 在正文中译作“抬……的”，不限定为当时正在抬
  alternative: 抬柜人；负责抬……的人
  rationale: 希伯来语分词既可作一般定语，也可带有职责或称谓意味。正文保持简洁的描述结构，脚注说明较具称谓色彩的译法，避免过度限定。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“吩咐”体现命令语气；“抬约柜”符合中文惯用表达。句末用冒号，表明下一节接续摩西的直接话语。
