  text: וְ/חָרָ֣ה אַפִּ֣/י ב֣/וֹ בַ/יּוֹם הַ֠/הוּא וַ/עֲזַבְתִּ֞י/ם וְ/הִסְתַּרְתִּ֨י פָנַ֤/י מֵ/הֶם֙ וְ/הָיָ֣ה לֶֽ/אֱכֹ֔ל וּ/מְצָאֻ֛/הוּ רָע֥וֹת רַבּ֖וֹת וְ/צָר֑וֹת וְ/אָמַר֙ בַּ/יּ֣וֹם הַ/ה֔וּא הֲ/לֹ֗א עַ֣ל כִּֽי אֵ֤ין אֱלֹהַ/י֙ בְּ/קִרְבִּ֔/י מְצָא֖וּ/נִי הָ/רָע֥וֹת הָ/אֵֽלֶּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/017.yaml
  text: Then my anger will burn against them on that day[a], and I will forsake them and hide my face from them, and they will be devoured, and many evils and troubles will find them. And he will say on that day[b], ‘Is it not because my God is not among me that these evils have found me?’
translation:
  language: zh_hans
  text: 那一天，我的怒气必向他们发作；我要离弃他们，向他们掩面；他们必成为可吞吃之物[a]。许多灾祸和患难必临到他们。那一天，他必说：“这些灾祸临到我，岂不是因为我的上帝不在我中间吗？”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文很简洁，字面近于“成为供吞吃的”，可指遭吞吃或毁灭。
    reason: lexical_alternative
  - marker: b
    text: 原文是“我的上帝不在我中间”。这里用单数，把以色列整体描写成一个说话的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְחָרָה אַפִּי
  choice: 我的怒气必……发作
  rationale: 保留怒气强烈发动的意象，同时采用自然、庄重的现代汉语；“发作”比直译“燃烧”更符合汉语习惯。
- source_word: בּוֹ
  choice: 向他们
  rationale: 希伯来语形式为集合单数，但所指为作为整体的以色列；叙述中用复数更符合现代汉语。
- source_word: וַעֲזַבְתִּים
  choice: 我要离弃他们
  rationale: “离弃”准确表达约关系中撤回眷顾的严肃意味，又不额外解释其具体方式。
- source_word: וְהִסְתַּרְתִּי פָנַי מֵהֶם
  choice: 向他们掩面
  rationale: 保留原文重要的“隐藏面容”意象；“向他们掩面”简洁自然，也没有将其解释性地改写为单纯离开。
- source_word: וְהָיָה לֶאֱכֹל
  choice: 使他们成为可吞吃之物
  rationale: 原文极为压缩，字面近于“成为供吞吃的”；此译保留被毁灭、任凭吞吃的被动脆弱性，也避免擅自补出吞吃者。
- source_word: וּמְצָאֻהוּ / מְצָאוּנִי
  choice: 临到他们／临到我
  rationale: 动词字面为“找到”，在灾祸作主语的语境中，汉语“临到”更自然；前后采用同一译法，保留重复联系。
- source_word: רָעוֹת רַבּוֹת וְצָרוֹת
  choice: 许多灾祸和患难
  rationale: 此处 רָעוֹת 指降临的祸患，而 צָרוֹת 指困厄患难；这一搭配既区分两词，又符合语境。
- source_word: וְאָמַר
  choice: 他必说
  rationale: 保留希伯来语单数，让以色列作为一个整体被人格化发言。
- source_word: הֲלֹא עַל כִּי
  choice: 岂不是因为……吗
  rationale: 自然地保留原文反问及其因果意味。
- source_word: אֵין אֱלֹהַי בְּקִרְבִּי
  choice: 我的上帝不在我中间
  rationale: 保留第一人称单数和“在我中间”的集合人格化表达，不改成较顺口但会消除原文修辞的“在我们中间”。
theological_decisions:
- issue: 以色列的集合单数与复数
  choice: 在上帝对以色列采取行动的叙述中使用“他们”，在以色列自述中保留“他／我”的单数人格化。
  alternative: 全节一律使用单数，或全节一律使用复数。
  rationale: 这样既使叙述符合现代汉语，又在引语中保留原文显著的集合人格化和由此产生的张力。
- issue: 上帝“掩面”的含义
  choice: 保留“向他们掩面”的意象。
  alternative: 译为“转脸不顾他们”或“从他们中间撤去同在”。
  rationale: 原文意象包含审判、关系撤回及隐藏同在等多重含义；直保意象可避免把神学张力缩减为单一解释。
- issue: “我的上帝不在我中间”是否等同于悔改认罪
  choice: 只翻译人物对灾祸原因的判断，不补写其是否真正悔改。
  alternative: 解释为明确认罪，或解释为仅仅抱怨。
  rationale: 经文本身没有在本节解决其话语的属灵性质，译文应保留这种开放性。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“掩面”“离弃”保留经文核心意象；“灾祸和患难”避免古奥。“可吞吃之物”略带源语质感，借脚注说明原文的压缩表达。
