base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/018.yaml
  text: And I myself will surely hide my face on that day because of all the evil that he has done[a], because he has turned to other gods.
translation:
  language: zh_hans
  text: 而我必定在那日隐藏我的脸[a]，因为他所行的一切恶事，因为他转向了别的神。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“我的同在”。希伯来文直译为“我的脸”；这是一个惯用表达，表示神撤回眷顾或同在。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָנֹכִי
  choice: 至于我
  rationale: אָנֹכִי是带强调意味的第一人称单数代词；“至于我”在现代汉语中既承接上文，也突出说话者，避免用生硬的“我自己”。
- source_word: הַסְתֵּר אַסְתִּיר
  choice: 必定隐藏
  rationale: 不定式绝对形与限定动词连用，加强动作的确定性；“必定隐藏”自然地保留这一强调。
- source_word: פָּנַי
  choice: 我的脸
  rationale: 原文直译为“我的脸”。正文保留具体的拟人表达，不直接释作“我的同在”或“我的恩宠”。
- source_word: בַּיּוֹם הַהוּא
  choice: 到那日
  rationale: 这是明确的时间表达；“到那日”符合现代汉语习惯，并保留指示意味。
- source_word: עַל כָּל הָרָעָה
  choice: 因为……这一切恶事
  rationale: עַל在此表示原因或缘由；הָרָעָה在语境中指道德上的恶，而非单纯的灾祸。
- source_word: אֲשֶׁר עָשָׂה
  choice: 他行了
  rationale: 动词为第三人称阳性单数。虽然所指是作为整体的以色列，译文仍保留单数拟人形式。
- source_word: כִּי
  choice: 因为
  rationale: כִּי在此引出理由或解释；“因为”保留其因果关系，同时不额外界定两项理由之间的逻辑层次。
- source_word: פָנָה אֶל
  choice: 转向了
  rationale: 该短语可表示在效忠或敬拜上转向某一对象；“转向了”保留这一含义而不作扩展解释。
- source_word: אֱלֹהִים אֲחֵרִים
  choice: 别的神
  rationale: 直译为“别的神”，指耶和华以外的神明；这一译法直接且符合现代汉语。
theological_decisions:
- issue: 神隐藏自己的脸这一拟人表达
  choice: 正文保留“隐藏我的脸”
  alternative: 收回我的同在／不再施恩
  rationale: 希伯来文使用具体的“脸”这一意象。保留字面表达，可让读者看见神撤回眷顾或同在的含义，同时不在正文中把这一神学意涵单一化。
- issue: 以单数指称以色列
  choice: 译作“他行了……他转向了”
  alternative: 他们行了……他们转向了
  rationale: 原文两个动词均为阳性单数，体现把以色列整体拟人化为单一主体的表达；保留单数可忠实呈现原文形式。
- issue: 两个原因从句的关系
  choice: 两次保留“因为”
  alternative: 把第二个כִּי译作“也就是”或“原来”
  rationale: 第二个כִּי既可视为进一步说明恶事，也可视为再次陈明神掩面的理由。重复“因为”保留原文的因果推进，不把关系限定为纯粹同位解释。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“至于我”体现主语强调；正文保留“隐藏我的脸”的具体意象及以单数拟人化指称以色列的形式。
