  yaml_path: translation/ot/deuteronomy/031/024.yaml
  text: And when Moses had finished writing the words of this law in a book[a], until they were complete,
translation:
  language: zh_hans
  text: 当摩西把这律法的话写在书卷[a]上，直至全部写完时，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文的句子延续到下一节。本节直译可作：“当摩西把这律法的话写在书卷上，直至全部写完时，……”；“书卷”所译的希伯来文可指书写文献或卷轴，并不一定指现代装订书籍。
    reason: 句法及文化说明
lexical_decisions:
- source_word: וַיְהִי
  choice: 事情是这样
  rationale: וַיְהִי承接叙事并引出下文；本节在希伯来文中是延续到下一节的时间结构，译作“事情是这样”既保留叙事转换，也避免把它误当作完整事件句。
- source_word: כְּכַלּוֹת
  choice: ……写完
  rationale: כְּ加כלה不定式构成时间从句，表示动作完成；汉语用“直到全部写完”自然表达完成界限。
- source_word: מֹשֶׁה
  choice: 摩西
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: לִכְתֹּב
  choice: 写
  rationale: 该不定式说明摩西完成的动作，现代汉语以“把……写……”表达最自然。
- source_word: דִּבְרֵי
  choice: ……的话
  rationale: דבר在此指成文内容；“话”保留其言语与文字内容的双重色彩。
- source_word: הַתּוֹרָה הַזֹּאת
  choice: 这律法
  rationale: תורה可指教导或律法；申命记的盟约—法律语境支持“律法”，同时保留指示词“这”。
- source_word: עַל סֵפֶר
  choice: 写在卷册上
  rationale: עַל字面为“在……上”，סֵפֶר指书写载体或文书，古代语境中常为卷册；此译比现代装订书籍的“书”更具历史准确性，又不把材质限定为某一种卷轴。
- source_word: עַד תֻּמָּם
  choice: 直到全部写完
  rationale: עַד表示达到某一界限，תֻּמָּם带复数宾语后缀，回指“这些话”，强调它们全都完成；汉语明确补出“全部写完”以自然传达该指代。
theological_decisions:
- issue: 本节与下一节的句法关系
  choice: 以“事情是这样：”标示叙事引入，并保留本节未完待续的结构
  alternative: 译成独立完整句：“摩西写完了……”
  rationale: 希伯来文וַיְהִי כְּכַלּוֹת构成“当……完成时，事情发生了……”的框架，主句在下一节出现。译文不应把24节改造成独立陈述，也不预先补入下一节内容。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“卷册”避免让读者误以为是现代装订书，同时保留סֵפֶר可泛指书写文献的宽度。主文调整语序以符合汉语信息推进，并用冒号与脚注提示希伯来文句子在本节尚未结束。
