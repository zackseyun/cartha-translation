  text: לָקֹ֗חַ אֵ֣ת סֵ֤פֶר הַ/תּוֹרָה֙ הַ/זֶּ֔ה וְ/שַׂמְתֶּ֣ם אֹת֔/וֹ מִ/צַּ֛ד אֲר֥וֹן בְּרִית יְהוָ֖ה אֱלֹהֵי/כֶ֑ם וְ/הָֽיָה שָׁ֥ם בְּ/ךָ֖ לְ/עֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/026.yaml
  text: Take this Book of the Law and place it beside the ark of the covenant of Yahweh your God[b][a], and let it remain there as a witness against you.
translation:
  language: zh_hans
  text: 你们要拿这部律法书[a]，放在雅威你们上帝的约柜旁边，使它留在那里，作为指证你们的证人[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“这卷律法书”。希伯来语 סֵפֶר 可指卷轴或书写成的文献。
    reason: lexical_alternative
  - marker: b
    text: 也就是说，如果你们违背这约，这部律法书就会成为指证你们的见证。
    reason: cultural_note
lexical_decisions:
- source_word: לָקֹחַ
  choice: 要拿
  rationale: 此处虽为不定式绝对形，却具有命令语气；译为“要拿”既保留指令力度，也符合现代汉语表达。
- source_word: סֵפֶר הַתּוֹרָה הַזֶּה
  choice: 这部律法书
  rationale: סֵפֶר 指书写成的文献，在当时通常是卷轴；תּוֹרָה 在这里指已经写下的盟约训诲或律法。“律法书”兼顾上下文、传统称谓和现代可懂度，并以脚注说明文物形态。
- source_word: וְשַׂמְתֶּם אֹתוֹ
  choice: 放
  rationale: שׂוּם 的基本意义是“放置、安放”；“放”简洁自然，准确表达具体动作。
- source_word: מִצַּד
  choice: 在……旁边
  rationale: 该词组表示位于约柜的一侧，即约柜外面的旁边，而非约柜里面。
- source_word: אֲרוֹן בְּרִית
  choice: 约柜
  rationale: 希伯来语直译为“约的柜”；“约柜”是简明且广为理解的固定称谓。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译呈现四字神名，保留其作为专名而非称号的性质。
- source_word: אֱלֹהֵיכֶם
  choice: 你们上帝
  rationale: 准确保留复数第二人称所属形式，并与神名构成盟约语境中的称谓。
- source_word: וְהָיָה שָׁם
  choice: 使它留在那里
  rationale: 原文形式上是“它要在那里”，承接前面的放置命令，表达放置后持续留存的结果；此译自然地呈现这一目的和状态。
- source_word: לְעֵד בְּךָ
  choice: 作控告你们的证人
  rationale: עֵד 的基本意义是“证人”；在申命记的盟约和审判语境中，בְּךָ 带有不利于受话者的指证意味。汉语用“控告你们”清楚呈现这种司法性功能。
theological_decisions:
- issue: 律法书作为见证的功能
  choice: 律法书作为控告以色列人的证人
  alternative: 律法书仅作为中性的纪念或见证物
  rationale: לְעֵד בְּךָ 在本章有关以色列悖逆的上下文中具有司法和不利证词的意味；这里按文本语境翻译，同时用脚注说明它在违约时发挥这种作用。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“这部律法书”和“约柜”保持经文语域的凝练；“作控告你们的证人”保留原文将书人格化为司法证人的形象。第二人称复数“你们”对应受命群体；原文末尾虽用单数后缀，语境中是把以色列视为一个整体来称呼，汉语继续用“你们”以免造成受话对象突变。
