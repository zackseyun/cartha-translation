  text: וְ֠/הָיָה כִּֽי תִמְצֶ֨אןָ אֹת֜/וֹ רָע֣וֹת רַבּוֹת֮ וְ/צָרוֹת֒ וְ֠/עָנְתָה הַ/שִּׁירָ֨ה הַ/זֹּ֤את לְ/פָנָי/ו֙ לְ/עֵ֔ד כִּ֛י לֹ֥א תִשָּׁכַ֖ח מִ/פִּ֣י זַרְע֑/וֹ כִּ֧י יָדַ֣עְתִּי אֶת יִצְר֗/וֹ אֲשֶׁ֨ר ה֤וּא עֹשֶׂה֙ הַ/יּ֔וֹם בְּ/טֶ֣רֶם אֲבִיאֶ֔/נּוּ אֶל הָ/אָ֖רֶץ אֲשֶׁ֥ר נִשְׁבָּֽעְתִּי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/021.yaml
  text: And when many evils and troubles come upon him[a], this song will answer before him as a witness, for it will not be forgotten from the mouth of his offspring; for I know his inclination, what he is doing today[d][c][b], before I bring him into the land that I swore to give.
translation:
  language: zh_hans
  text: 将来，许多灾祸和患难临到他[a]时，这首歌必在他面前[b]回应，作为见证；因为它必不会从他后代的口中被遗忘。我早在领他进入我所起誓的那地[d]以前，就知道他今天所怀的意念[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “临到他”也可译作“遇上他”或“追上他”。
    reason: lexical_alternative
  - marker: b
    text: “在他面前”按语境也可较强地理解为“对他不利”或“指证他”，因为这首歌发挥见证的作用。
    reason: lexical_alternative
  - marker: c
    text: “意念”所译的希伯来语也可指“倾向”“意向”或“构想”，指内在的趋向或意图。
    reason: lexical_alternative
  - marker: d
    text: 希伯来语直译为“我所起誓的那地”；誓言的具体内容在本节未明说。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: 将来……时
  rationale: 以自然的现代汉语表达希伯来语对未来情形的引入，同时保留时间框架。
- source_word: תִמְצֶאןָ אֹתוֹ
  choice: 临到他
  rationale: מצא以灾祸和患难为主语，在这里表示不利之事遇上、追及某人；“临到”自然且保留其力度。
- source_word: רָעוֹת רַבּוֹת וְצָרוֹת
  choice: 许多灾祸和患难
  rationale: רעות在此指有害的事件或灾难，并非抽象的道德邪恶；“灾祸和患难”符合语境。
- source_word: וְעָנְתָה
  choice: 回应他
  rationale: 保留ענה“回答、回应”的基本意象；随后“作见证”说明这回应所发挥的司法性作用。
- source_word: לְפָנָיו לְעֵד
  choice: 在他面前……作见证
  rationale: 保留לְפָנָיו“在他面前”的空间或司法表达，不在正文中径直解释成“控告他”；לְעֵד明确歌曲的见证作用。
- source_word: לֹא תִשָּׁכַח מִפִּי זַרְעוֹ
  choice: 这首歌必不至于从他后代的口中被遗忘
  rationale: 尽量保留“从口中遗忘”的希伯来语形象，强调后代仍会口头传诵；“后代”表达זרע的集合单数。
- source_word: יִצְרוֹ
  choice: 他……所怀的意念
  rationale: יצר可指内在形成的意向、倾向或构想；“所怀的意念”能表达内在趋向，又不引入后期神学术语。
- source_word: אֲשֶׁר הוּא עֹשֶׂה הַיּוֹם
  choice: 他今天所怀的
  rationale: 按其与יצרו的紧密关系处理为以色列今日正在形成、怀有的内在意向；中文避免生硬直译为“正在做的倾向”。
- source_word: בְּטֶרֶם אֲבִיאֶנּוּ
  choice: 甚至在我领他进入……以前，我就已经知道了
  rationale: 明确表达בטרם的先时关系，并让中文自然呈现上帝预先知道以色列内在意向的意思。
- source_word: אֶל הָאָרֶץ אֲשֶׁר נִשְׁבָּעְתִּי
  choice: 进入我起誓要赐给他的那地
  rationale: 原文末尾直译为“我所起誓的地”，受词内容依盟约语境省略；中文补出“要赐给他的”以构成自然完整的句子，并以脚注说明。
theological_decisions:
- issue: יצרו在上帝预知与人的道德倾向语境中的译法
  choice: 他今天所怀的意念
  alternative: 他的倾向／他的构想
  rationale: 该词涉及以色列内在形成的意向，但本节并未系统阐述人性论；采用“意念”保留道德与意志层面的分量，不将其限定为某一宗派的人性教义。
- issue: לְפָנָיו作为见证用语的方向性
  choice: 在他面前
  alternative: 控告他／ against him
  rationale: 上下文容许见证具有不利于以色列的作用，但介词本身仍可表示“在他面前”；正文保留原文张力，脚注提示更强的理解。
- issue: 上帝知道以色列意念的时间关系
  choice: 在领他进入那地以前就已经知道
  alternative: 将“以前”仅与以色列当日行为相连
  rationale: 按希伯来语句法让בטרם从句修饰“我知道”，呈现神的预知，同时不对这种预知与人的责任之间的关系作额外解释。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“灾祸和患难”避免把רעות误读成纯粹的道德邪恶；“回应他，作见证”有意保留ענה的回答意象及לְעֵד的司法意味。以男性单数“他”承接作为整体的以色列，符合本节原文的集合性指称。
