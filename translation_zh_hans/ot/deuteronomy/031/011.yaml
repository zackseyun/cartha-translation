id: DEU.31.11
reference: Deuteronomy 31:11
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: בְּ/ב֣וֹא כָל יִשְׂרָאֵ֗ל לֵ/רָאוֹת֙ אֶת פְּנֵי֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ בַּ/מָּק֖וֹם אֲשֶׁ֣ר יִבְחָ֑ר תִּקְרָ֞א אֶת הַ/תּוֹרָ֥ה הַ/זֹּ֛את נֶ֥גֶד כָּל יִשְׂרָאֵ֖ל בְּ/אָזְנֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/011.yaml
  text: when all Israel comes to appear before Yahweh your God at the place that he will choose[a], you shall read this law before all Israel in their hearing.
translation:
  language: zh_hans
  text: 当全以色列人来到耶和华你的上帝所要选择的地方，朝见耶和华你的上帝时[a]，你要在全以色列人面前宣读这律法，使他们听见。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“看耶和华你（单数）的上帝的面”，这是指来到他面前朝见他的惯用说法；这里的单数“你”以以色列整体为对象。
    reason: 保留原文措辞、第二人称单数形式及其朝圣敬拜语境中的惯用含义。
lexical_decisions:
- source_word: בְּבוֹא כָל־יִשְׂרָאֵל
  choice: 当全以色列人来到……时
  rationale: 介词 בְּ 加不定式附属形构成时间从句；这样译成现代汉语自然，并保留“全以色列”这一集合性表达。
- source_word: לֵרָאוֹת אֶת־פְּנֵי יְהוָה אֱלֹהֶיךָ
  choice: 来到耶和华你们的上帝面前……朝见他
  rationale: 原文直译为“看耶和华你上帝的面”，在敬拜与朝圣语境中表示来到上帝面前朝见他。中文以“朝见”传达惯用义，脚注保留原文意象。原文对以色列使用第二人称单数，中文为避免被误解为只对一个人说，按集体所指译作“你们的上帝”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神名音译“耶和华”，明确保留专名，而不以称号代替。
- source_word: בַּמָּקוֹם אֲשֶׁר יִבְחָר
  choice: 在他将要选择的地方
  rationale: 保留申命记中由上帝拣选敬拜地点的主题，并将未完成式依上下文表达为将来。
- source_word: תִּקְרָא אֶת־הַתּוֹרָה הַזֹּאת
  choice: 你要……宣读这律法
  rationale: קרא 在此以律法为宾语，指公开朗读；“宣读”比单说“读”更清楚地表达面向会众、大声诵读的场景。תורה 在此指约法规范，译作通行且易懂的“律法”。
- source_word: נֶגֶד כָּל־יִשְׂרָאֵל בְּאָזְנֵיהֶם
  choice: 在全以色列人面前……给他们听
  rationale: נֶגֶד 表示在聚集的百姓面前；“在他们耳中”是希伯来语听觉惯用语，现代汉语自然表达为“给他们听”。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 两者都是对四字神名的音译。“耶和华”在现代简体中文圣经语境中辨识度最高，同时保留其作为以色列上帝专名的功能。
- issue: “看耶和华的面”的理解
  choice: 正文译作“来到……面前……朝见他”，脚注保留直译
  alternative: 直译作“看耶和华的面”
  rationale: 该表达在此朝圣敬拜语境中指到上帝面前朝见，并非断言人以肉眼观看上帝的面；正文传达惯用义，脚注保存原文意象，避免消除其语言特色。
- issue: 第二人称单数 אֱלֹהֶיךָ 与 תִּקְרָא
  choice: “你们的上帝”与“你要”
  alternative: 全部译作单数“你的上帝”“你要”
  rationale: 原文以单数形式把以色列视为一个整体；中文“你们的上帝”清楚呈现实际受众，“你要”则保留对负责公开宣读者的单数命令。此处不强行判定具体宣读者身份。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“朝见”适合正式敬拜场景，“宣读……给他们听”明确表达公开朗读。正文中的“你们的上帝”呈现集体受众，而“你要”保留原文命令的单数形式。
