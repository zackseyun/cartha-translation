base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/007.yaml
  text: Then Moses called Joshua and said to him in the sight of all Israel[a], “Be strong and courageous, because you will go with this people into the land that Yahweh swore to their fathers to give them[b], and you will give it to them as an inheritance.”
translation:
  language: zh_hans
  text: 摩西召来约书亚，在全以色列人面前对他说：“你要刚强勇敢，因为你要与这百姓一同进入[a]雅威曾向他们的列祖起誓要赐给他们的那地；你要使他们承受那地为产业。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你要领这百姓进入那地。”希伯来语可理解为约书亚与百姓一同进入，也可理解为他带领百姓进入；本节正文保留前一种理解，下一分句则明确说他要使他们承受那地为产业。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקְרָא מֹשֶׁה לִיהוֹשֻׁעַ
  choice: 摩西召来约书亚
  rationale: קרא 在叙事语境中表示叫来或召来；“召来”自然庄重，也清楚表达摩西把约书亚叫到面前。
- source_word: לְעֵינֵי כָל יִשְׂרָאֵל
  choice: 在全以色列人眼前
  rationale: 保留“在……眼前”的形象化表达，强调这番嘱咐公开进行，并为全体以色列人所见证。
- source_word: חֲזַק וֶאֱמָץ
  choice: 你要刚强勇敢
  rationale: 这是领导与争战语境中的固定劝勉；“刚强勇敢”在现代汉语中自然、庄重，并分别传达力量与勇气。
- source_word: תָּבוֹא אֶת הָעָם הַזֶּה
  choice: 你要和这百姓一同进入
  rationale: בוא 加 אֶת־הָעָם 在此可理解为约书亚与百姓共同进入，而非明确的使役“领进去”；正文保留这一较贴近句法的理解，不与邻近经文自动调和。
- source_word: הָאָרֶץ
  choice: 那地
  rationale: “地”延续申命记中应许之地与圣约的用语；指示词“那”对应有定冠词并适合既知所指。
- source_word: נִשְׁבַּע יְהוָה
  choice: 雅威……起誓
  rationale: נשבע 表示起誓；将四字神名 יְהוָה 音译为“雅威”，保留其作为以色列之神圣约名字的性质。
- source_word: לַאֲבֹתָם
  choice: 向他们的祖先
  rationale: אָבוֹת 在这里指以色列历代先祖，尤其承受应许的族长；现代汉语“祖先”准确表达集体历史所指，避免“父亲们”可能造成仅指上一代生父的误解。
- source_word: תַּנְחִילֶנָּה אוֹתָם
  choice: 你要使他们承受那地为产业
  rationale: נחל 的使役式表示使人取得产业或使人承受为业；该译法保留使役结构及圣约性的“产业”概念。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华／上主
  rationale: 原文直接使用四字神名；音译“雅威”保留专名性质，不以称号代替，也不采用较晚形成的混合读音。
- issue: תָּבוֹא אֶת הָעָם 是否表示约书亚与百姓同去，还是领百姓进去
  choice: 你要和这百姓一同进入
  alternative: 你要领这百姓进入
  rationale: 本节的结构可将 אֶת 理解为伴随关系，且下一分句另以使役动词明确约书亚使百姓承受产业。正文保留两种表达之间的区别，不把此处自动改成邻近经文较明确的“领进去”。
- issue: אֲבֹתָם 的汉语表达
  choice: 他们的祖先
  alternative: 他们的父辈
  rationale: 此处所指是承受土地应许的历代先祖；“祖先”既准确覆盖族长及先辈，也符合现代普通读者的理解，不改变该词在上下文中的历史与圣约所指。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。“召来”“刚强勇敢”“承受……为产业”等措辞维持经文的公开任命与圣约语域；不另加脚注，因为正文已自然保留关键句法理解，且没有必须借注释才能呈现的文本异读。
