source:
  edition: WLC
  text: וַ/יֵּרָ֧א יְהוָ֛ה בָּ/אֹ֖הֶל בְּ/עַמּ֣וּד עָנָ֑ן וַ/יַּעֲמֹ֛ד עַמּ֥וּד הֶ/עָנָ֖ן עַל פֶּ֥תַח הָ/אֹֽהֶל־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/015.yaml
  text: And Yahweh appeared in the tent in a pillar of cloud[b][a], and the pillar of cloud stood at the entrance of the tent.
translation:
  language: zh_hans
  text: 雅威在帐篷[a]里、在云柱中显现；云柱停立在帐篷门口[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“会幕”；原文只说“帐篷”，按上下文很可能指会幕。
    reason: lexical_alternative
  - marker: b
    text: 或译“帐篷门口上方”；希伯来语介词也可表示“在……上面／上方”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרָא
  choice: 显现
  rationale: ראה 的尼斐勒形在这里指可见的显现；“显现”自然地保留神显的含义，又不进一步解释显现的方式。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来神名的通行拟音译出四字神名，保留其作为以色列之神专名的性质，而不以称号代替。
- source_word: בָּאֹהֶל
  choice: 在帐篷里
  rationale: אֹהֶל 的基本义是“帐篷”。上下文很可能指会幕，但正文不把这一语境判断直接写入译文。
- source_word: בְּעַמּוּד עָנָן
  choice: 在云柱中
  rationale: 保留介词 בְּ 所表达的空间或媒介关系，并维持云柱作为显现形态或媒介的神秘张力。汉语不强行补出不定冠词。
- source_word: וַיַּעֲמֹד
  choice: 停立
  rationale: עמד 的基本义是“站立”。“停立”适合描述云柱固定在一处，同时保留具体形象。
- source_word: עַמּוּד הֶעָנָן
  choice: 云柱
  rationale: 这是清楚简练的现代汉语表达，并与前句的同一形象相呼应。
- source_word: עַל פֶּתַח הָאֹהֶל
  choice: 在帐篷门口
  rationale: עַל 在此空间语境中可表示位于门口或门口上方；正文采用自然且不失场景感的“在……门口”，脚注保留更贴近常见字面的另一可能。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 采用较直接对应 Yahweh 的现代汉语拟音，保留盟约之神的专名，不以称号“主”替换。
- issue: 神显与云柱的关系
  choice: 在帐篷里、在云柱中显现
  alternative: 在帐篷那里借着云柱显现；显为云柱
  rationale: 原文同时使用两个带 בְּ 的短语，但未明确说明云柱只是工具，还是显现的具体形态；译文保留这种关系上的含混，不把雅威等同于云柱，也不将其仅解释为工具。
- issue: 云柱相对帐篷入口的位置
  choice: 在帐篷门口
  alternative: 在帐篷门口上方
  rationale: עַל 可表达“在、靠着”或“在……上方”。正文采用符合汉语场景表达的译法，脚注提示较为字面的空间理解。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“帐篷”保留原词的一般意义，“显现”“云柱”“停立”维持经文具体而神秘的神显图景；标点用分号清楚呈现两个连续动作。
