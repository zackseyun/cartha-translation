  text: הַקְהִ֧ילוּ אֵלַ֛/י אֶת כָּל זִקְנֵ֥י שִׁבְטֵי/כֶ֖ם וְ/שֹׁטְרֵי/כֶ֑ם וַ/אֲדַבְּרָ֣ה בְ/אָזְנֵי/הֶ֗ם אֵ֚ת הַ/דְּבָרִ֣ים הָ/אֵ֔לֶּה וְ/אָעִ֣ידָה בָּ֔/ם אֶת הַ/שָּׁמַ֖יִם וְ/אֶת הָ/אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/028.yaml
  text: Gather to me all the elders of your tribes and your officers[a], that I may speak these words in their hearing and call heaven and earth to witness against them.
translation:
  language: zh_hans
  text: 你们要把各支派的所有长老和你们的官长召集到我这里来，好让我把这些话说给他们听，并召天地[a]作证控告他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“诸天和大地”。这是申命记中常见的盟约见证用语。
    reason: 说明הַשָּׁמַיִם在形式上为复数，并交代这一固定表达的盟约背景。
lexical_decisions:
- source_word: הַקְהִילוּ
  choice: 召集
  rationale: 这是קהל的使役式复数祈使语气，要求听众把领袖们聚集起来；“召集”自然地保留了使役和正式集合的含义。
- source_word: אֵלַי
  choice: 到我这里来
  rationale: 介词加第一人称后缀直指“到我这里”；此译比“在我面前”更贴近原文方向性。
- source_word: זִקְנֵי שִׁבְטֵיכֶם
  choice: 各支派的所有长老
  rationale: 保留“你们的各支派”与其所属长老的结构，并以“所有”对应כָּל。
- source_word: שֹׁטְרֵיכֶם
  choice: 你们的官长
  rationale: 该词在申命记的行政语境中指承担治理职责的官员或下级领袖；“官长”庄重而不把职能窄化为文士。
- source_word: וַאֲדַבְּרָה
  choice: 好让我……说
  rationale: 鼓励式表达摩西在召集之后所要采取的行动；“好让我”自然呈现这里的目的关系。
- source_word: בְּאָזְנֵיהֶם
  choice: 说给他们听
  rationale: 原文直译为“在他们耳中”，是指让他们亲耳听见；中文用此表达清楚而自然。
- source_word: אֵת הַדְּבָרִים הָאֵלֶּה
  choice: 这些话
  rationale: דְּבָרִים在直接讲话的语境中指将要宣告的话语。
- source_word: וְאָעִידָה בָּם
  choice: 并召……作证控告他们
  rationale: עוּד的使役式在此具有盟约诉讼色彩，表示传唤见证者作出不利于他们的见证；此译保留“作证”与“控告”的法律力度。
- source_word: אֶת הַשָּׁמַיִם וְאֶת הָאָרֶץ
  choice: 天地
  rationale: 这是申命记中固定的盟约见证表达；“天地”是自然、庄重的中文对应，同时保留宇宙性见证的意象。
theological_decisions:
- issue: 盟约见证的法律意象
  choice: 召天地作证控告他们
  alternative: 以天地为证警告他们
  rationale: 原文把天地置于盟约诉讼的见证者位置，并以בָּם表达见证对他们不利；所选译法不把“见证”弱化为一般性的警告。
translation_notes:
  register: 采用现代、庄重而清楚的普通话。“官长”体现行政领袖身份；“说给他们听”自然传达希伯来语“在他们耳中”的习语。脚注标记置于其实际解释的“天地”之后。
source_grounding:
  english_pob_role: consult_only
