  text: Then Moses spoke the words of this song in the hearing of all the assembly of Israel[a], until they were finished.
translation:
  language: zh_hans
  text: 摩西把这首歌的话说给以色列全会众听，直到这些话都说完。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“直到他把这些话都说完”，即摩西把这首歌的话全部说完。
    reason: 原文形式可理解为这些话已经完毕，也可按语境表达为摩西完成了诵述。
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 摩西……说
  rationale: 未完成式加转换式前缀承接并推进叙事；汉语按自然语序表达即可，无须机械加入“然后”。
- source_word: בְּאָזְנֵי
  choice: 说给……听
  rationale: 希伯来语字面为“在……耳中”，是指让听众亲耳听见的惯用语；“说给……听”自然且保留公开宣讲的意味。
- source_word: כָּל קְהַל יִשְׂרָאֵל
  choice: 以色列全会众
  rationale: קהל 指聚集起来的共同体；“全会众”简洁、庄重，也避免引入特定宗派色彩。
- source_word: אֶת דִּבְרֵי הַשִּׁירָה הַזֹּאת
  choice: 这首歌的话
  rationale: 原文明确包含“话/言词”，不宜简化为仅仅“这首歌”；此译也自然体现歌的具体内容。
- source_word: עַד תֻּמָּם
  choice: 直到这些话说完了
  rationale: 三复数后缀最自然地回指复数的“话”；用“说完了”表达诵述完成，同时以脚注保留可理解为摩西主动说完的可能。
