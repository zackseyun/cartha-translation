source:
  edition: WLC
  text: כִּ֣י יָדַ֗עְתִּי אַחֲרֵ֤י מוֹתִ/י֙ כִּֽי הַשְׁחֵ֣ת תַּשְׁחִת֔וּ/ן וְ/סַרְתֶּ֣ם מִן הַ/דֶּ֔רֶךְ אֲשֶׁ֥ר צִוִּ֖יתִי אֶתְ/כֶ֑ם וְ/קָרָ֨את אֶתְ/כֶ֤ם הָֽ/רָעָה֙ בְּ/אַחֲרִ֣ית הַ/יָּמִ֔ים כִּֽי תַעֲשׂ֤וּ אֶת הָ/רַע֙ בְּ/עֵינֵ֣י יְהוָ֔ה לְ/הַכְעִיס֖/וֹ בְּ/מַעֲשֵׂ֥ה יְדֵי/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/029.yaml
  text: For I know that after my death you will surely act corruptly and turn aside from the way that I commanded you[a], and evil will befall you in the latter days, because you will do what is evil in the eyes of Yahweh[c][b], provoking him to anger by the work of your hands.
translation:
  language: zh_hans
  text: 因为我知道，我死后，你们必定会败坏[a]，偏离我吩咐你们走的道路。到了末后的日子[c]，灾祸[b]必临到你们，因为你们会做雅威眼中看为恶的事，以你们手所做的事惹他发怒。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你们必定会败坏自己”或“你们必定会变得败坏”。希伯来文以同根词连用加强语气；这里的动词可理解为反身用法，也可理解为不及物用法。
    reason: lexical_alternative
  - marker: b
    text: “灾祸”也可译作“祸患”或“恶事”。希伯来词רָעָה既可指道德上的恶，也可指临到人的灾难。
    reason: lexical_alternative
  - marker: c
    text: “末后的日子”也可译作“将来的日子”或“日后”。这个短语指向未来；是否带有更强的末世含义，须由语境判断。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי יָדַעְתִּי
  choice: 因为我知道
  rationale: כִּי承接上文，说明摩西提出警告的理由；完成式יָדַעְתִּי在此表达摩西确定的认识，用现代汉语“我知道”最自然。
- source_word: אַחֲרֵי מוֹתִי
  choice: 我死后
  rationale: 准确表达“在我死后”，同时比名词式的“我的死后”更符合现代汉语。
- source_word: הַשְׁחֵת תַּשְׁחִתוּן
  choice: 你们必定会败坏
  rationale: 不定绝对式与限定动词并用，加强确定性；“败坏”保留该动词在此可能为反身或不及物的含义，不擅自补出受事。
- source_word: וְסַרְתֶּם מִן־הַדֶּרֶךְ
  choice: 偏离……道路
  rationale: 保留盟约语境中离开所吩咐生活道路的惯用意象。
- source_word: אֲשֶׁר צִוִּיתִי אֶתְכֶם
  choice: 我吩咐你们走的
  rationale: 原文直译为“我吩咐你们的”，汉语补出“走”以清楚连接“道路”，但不改变命令的内容。
- source_word: וְקָרָאת אֶתְכֶם הָרָעָה
  choice: 灾祸必临到你们
  rationale: קרא与רָעָה构成“灾祸临到”的表达；“灾祸”符合此处不利事件的语义，并避免汉语“恶临到”可能造成的误解。
- source_word: בְּאַחֲרִית הַיָּמִים
  choice: 到了末后的日子
  rationale: 保留该固定短语的未来指向及其可能具有的末世意味，同时用“到了”使汉语句子自然。
- source_word: כִּי תַעֲשׂוּ אֶת־הָרַע
  choice: 因为你们会做……看为恶的事
  rationale: 表达行为在神的判断中为恶，并避免生硬的“做那恶”。
- source_word: בְּעֵינֵי יְהוָה
  choice: 雅威眼中看为
  rationale: 保留希伯来语“在……眼中”的评价性惯用语，并以自然汉语表达。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来语四字神名的通行学术拟音处理为专名，而不以“主”这一称号替代。
- source_word: לְהַכְעִיסוֹ
  choice: 惹他发怒
  rationale: 自然表达使役词形“使他发怒”的含义。
- source_word: בְּמַעֲשֵׂה יְדֵיכֶם
  choice: 以你们手所做的
  rationale: 保留“手所做的”这一具体而有意含混的说法，不直接限定为偶像或其他作品。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用神的专名。译作“雅威”旨在保留其专名性质，并较贴近YHWH的现代拟音；不以称号“主”替换，也不据此加入额外的教派性解释。
- issue: בְּאַחֲרִית הַיָּמִים是否专指末世
  choice: 末后的日子
  alternative: 将来的日子；日后
  rationale: 保留原短语可能具有的末世分量，但不把它限定为某套具体的末世时间表；脚注说明它也可泛指将来。
- issue: “你们手所做的”是否明确指偶像
  choice: 保留原文含混表达
  alternative: 你们亲手制造的偶像
  rationale: 上下文可能令人联想到偶像，但本节本身没有明说“偶像”，因此不在正文中补入。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“必定会”传达希伯来文的加强语气；以“败坏”保留语法上的含混，以“灾祸”清楚表达临到人的不利事件。“雅威眼中看为恶”保留圣经惯用意象而仍易于普通读者理解。所有脚注标记均置于相应正文词语之后。
