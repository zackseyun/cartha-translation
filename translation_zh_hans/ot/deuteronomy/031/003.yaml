revisions:
- from: 雅威你的上帝要亲自在你前面过去[a]。他必从你面前毁灭这些国，你必占领他们的地[b]。约书亚也要亲自在你前面过去，正如雅威所说的。
  to: 雅威——你的上帝——要亲自在你前面过去[a]。他必从你面前除灭这些民族；你必使他们失去所占之地[b]。约书亚也要亲自在你前面过去，正如雅威所说。
  rationale: 修订使“从你面前”明确关联于除灭这些民族，并以自然汉语传达 וִירִשְׁתָּם 对人的直接宾语及其在征服语境中的“使其失去所占之地”含义。保留神名、人名、分词的临近／确定将来语气，以及雅威与约书亚两处平行的强调。
