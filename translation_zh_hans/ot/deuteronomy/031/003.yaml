reference: Deuteronomy 31:3
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: יְהוָ֨ה אֱלֹהֶ֜י/ךָ ה֣וּא עֹבֵ֣ר לְ/פָנֶ֗י/ךָ הֽוּא יַשְׁמִ֞יד אֶת הַ/גּוֹיִ֥ם הָ/אֵ֛לֶּה מִ/לְּ/פָנֶ֖י/ךָ וִֽ/ירִשְׁתָּ֑/ם יְהוֹשֻׁ֗עַ ה֚וּא עֹבֵ֣ר לְ/פָנֶ֔י/ךָ כַּ/אֲשֶׁ֖ר דִּבֶּ֥ר יְהוָֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/003.yaml
  text: Yahweh your God himself is crossing over before you[a]. He himself will destroy these nations from before you, and you will dispossess them. Joshua himself is crossing over before you[b], just as Yahweh has spoken.
translation:
  language: zh_hans
  text: 雅威——你的上帝——要亲自在你前面过去[a]。他必从你面前除灭这些民族；你必使他们失去所占之地[b]。约书亚也要亲自在你前面过去，正如雅威所说。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“走在你前面”或“必在你前面过去”。希伯来语分词可以表示正在进行、即将发生或确定会发生的行动。
    reason: lexical_alternative
  - marker: b
    text: 或译：“你必占有他们”或“你必取得他们的土地”。希伯来语原文的直接宾语是“他们”；这里的动词在征服语境中常指使原占有者失去产业，从而取得其土地。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译上帝的专名，避免用“主”这一称号代替原文的专名，也避免采用源于 Jehovah 的传统音译。
- source_word: אֱלֹהֶיךָ
  choice: 你的上帝
  rationale: 保留第二人称阳性单数后缀及盟约语境中的直接称呼。
- source_word: הוּא
  choice: 亲自
  rationale: 独立代词在两处都有强调作用；“亲自”自然地保留雅威与约书亚各自作为主语时的强调。
- source_word: עֹבֵר לְפָנֶיךָ
  choice: 要在你前面过去
  rationale: 分词可表达正在发生、即将发生或确定将发生的行动；此处结合过河语境，用“要……过去”保留临近将来的意味和空间意象。
- source_word: יַשְׁמִיד
  choice: 必……毁灭
  rationale: 使役词干表示使之毁灭；“毁灭”保持原文力度，又不额外断定超出语境的绝对程度。
- source_word: הַגּוֹיִם הָאֵלֶּה
  choice: 这些国
  rationale: 在申命记的征服语境中，גּוֹיִם 指迦南各民族政治群体；“这些国”简洁自然。
- source_word: מִלְּפָנֶיךָ
  choice: 从你面前
  rationale: 保留 מִן 与 לִפְנֵי 组合所表达的移除及空间方向。
- source_word: וִירִשְׁתָּם
  choice: 你必占领他们的地
  rationale: ירשׁ 在征服语境中常指通过使原居民失去占有而取得土地。汉语不能自然地说“占领他们”，故明确补出语境隐含的“地”，并以脚注保留词义范围。
- source_word: יְהוֹשֻׁעַ
  choice: 约书亚
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: כַּאֲשֶׁר דִּבֶּר יְהוָה
  choice: 正如雅威所说的
  rationale: דִּבֶּר 的基本义是“说”；不译作“应许”，以免加入原文未明说的解释。
theological_decisions:
- issue: 神圣专名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；音译为“雅威”可保留其专名性质，不以称号替换，也与较可能的希伯来语读音相符。
- issue: 雅威与约书亚之间的施事强调
  choice: 两处 הוּא 都译作“亲自”
  alternative: 只译为普通的“他”或省略
  rationale: 保留原文重复的强调：雅威亲自走在以色列前面，约书亚也按神的吩咐亲自领在前面；不消解神与受命领袖并列而层次不同的行动关系。
- issue: וִירִשְׁתָּם 的征服含义
  choice: 占领他们的地
  alternative: 赶走他们；取代他们；承受他们
  rationale: 该动词兼有取得产业与使原占有者失去占有的张力。正文采用自然汉语表达土地占有，脚注说明其逐字宾语及排除原居民的含义。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“要……必……”呈现临近行动与确定结果；两次“亲自”保留原文平行强调。“雅威”作为专名使用，不另加尊称。
