  yaml_path: translation/ot/deuteronomy/031/010.yaml
  text: And Moses commanded them[a], saying, “At the end of every seven years, at the appointed time of the year of release[c][b], at the Feast of Booths,”
translation:
  language: zh_hans
  text: 摩西吩咐他们说：“每逢七年期满，在豁免年所定的时候，在住棚节，[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “住棚节”直译为“棚子节”；传统也称“帐棚节”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: 吩咐
  rationale: צוה表示下达命令或嘱咐；“吩咐”既保留指令力度，也符合现代中文叙事语体。
- source_word: אוֹתָם
  choice: 他们
  rationale: 原文为阳性复数直接宾语代词，其所指由上下文确定。
- source_word: לֵאמֹר
  choice: 说
  rationale: 以自然的中文引出直接引语。
- source_word: מִקֵּץ שֶׁבַע שָׁנִים
  choice: 每逢七年期满
  rationale: מִקֵּץ意为“到……尽头/期满”；律法历法语境表明这是循环发生的七年周期，故用“每逢”自然表达。
- source_word: בְּמוֹעֵד
  choice: 所定的时候
  rationale: מוֹעֵד指指定或固定的时间，在此带有节期意味；“所定的时候”准确且庄重。
- source_word: שְׁנַת הַשְּׁמִטָּה
  choice: 豁免年
  rationale: שְׁמִטָּה指第七年所实行的免除或豁免；“豁免年”直接表达词义，并避免仅以传统术语代替。
- source_word: בְּחַג הַסֻּכּוֹת
  choice: 就是住棚节
  rationale: חַג为节期，סֻכּוֹת为棚子；“住棚节”是现代中文中清楚而通行的名称。“就是”自然说明所定时间具体落在该节期。
