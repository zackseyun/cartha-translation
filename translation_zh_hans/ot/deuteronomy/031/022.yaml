base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/022.yaml
  text: So Moses wrote this song on that day and taught it to the sons of Israel[a].
translation:
  language: zh_hans
  text: 于是，摩西在那一天写下了这首歌，并把这首歌教给以色列人[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“以色列的众子”，这是对以色列百姓的惯常称呼；也可译作“以色列子民”。
    reason: 说明希伯来语的字面形式及其群体性含义。
lexical_decisions:
- source_word: וַיִּכְתֹּב
  choice: 写下了
  rationale: כתב的Qal叙事形式表示“写、写下”。“写下了”自然地表达将歌曲记录成文，并保留连续叙事语气。
- source_word: הַשִּׁירָה הַזֹּאת
  choice: 这首歌
  rationale: שִׁירָה在此指下文的诗歌性篇章；“这首歌”既符合希伯来文的文学称谓，也符合现代汉语习惯。
- source_word: בַּיּוֹם הַהוּא
  choice: 在那一天
  rationale: 直译常见时间短语，不额外断定为“就在同一天”，从而保留原文表达的范围。
- source_word: וַיְלַמְּדָהּ
  choice: 并教给
  rationale: למד的Piel形式意为“教导”；阴性单数后缀指向“这首歌”。汉语以“教给”自然呈现动作及其受事。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 该短语字面为“以色列的众子”，但在此是对以色列全体百姓的惯用共同体称谓。“以色列人”在现代汉语中准确、自然，也不会误导读者以为只包括男性。
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל的性别形式与群体所指
  choice: 以色列人
  alternative: 以色列的众子／以色列的子孙
  rationale: 希伯来语使用阳性复数构词，却惯常指整个圣约群体，而非只指男性。正文采用自然的群体称谓“以色列人”，脚注说明原文形式，以同时保留语义范围和源语信息。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“于是”承接前文叙事；“写下了……并教给……”保持两个连续动作。脚注标记已置于正文相应位置。
