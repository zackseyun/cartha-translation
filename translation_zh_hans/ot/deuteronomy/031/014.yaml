  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה הֵ֣ן קָרְב֣וּ יָמֶי/ךָ֮ לָ/מוּת֒ קְרָ֣א אֶת יְהוֹשֻׁ֗עַ וְ/הִֽתְיַצְּב֛וּ בְּ/אֹ֥הֶל מוֹעֵ֖ד וַ/אֲצַוֶּ֑/נּוּ וַ/יֵּ֤לֶךְ מֹשֶׁה֙ וִֽ/יהוֹשֻׁ֔עַ וַ/יִּֽתְיַצְּב֖וּ בְּ/אֹ֥הֶל מוֹעֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/014.yaml
  text: And Yahweh said to Moses[a], “Behold, your days are drawing near for you to die. Call Joshua, and present yourselves in the tent of meeting, that I may command him.” So Moses and Joshua went and presented themselves in the tent of meeting.
translation:
  language: zh_hans
  text: 雅威对摩西说：“看哪，你死的日子临近了。把约书亚叫来，你们要站在会幕里，我好嘱咐他[a]。”于是，摩西和约书亚前去，站在会幕里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“吩咐他”或“委任他”。希伯来语动词可指命令、郑重托付或授予任务；本处语境涉及约书亚承接职任。
    reason: 说明 צוה 的词义范围，并保留它在本节究竟侧重命令、托付还是委任的张力。
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来语四字神名的通行拟音译出其专名性质，不以“主”这一称号代替，也不采用源自“Jehovah”的“耶和华”读法。
- source_word: הֵן
  choice: 看哪
  rationale: 保留引人注意、强调随后宣告的语气，同时符合庄重的现代汉语圣经文体。
- source_word: קָרְבוּ יָמֶיךָ לָמוּת
  choice: 你死的日子临近了
  rationale: 保留“日子临近”和“不定式‘死’”的希伯来语表达核心；汉语自然凝练，又不把它完全改写成“你快要死了”。
- source_word: קְרָא אֶת־יְהוֹשֻׁעַ
  choice: 把约书亚叫来
  rationale: 准确表达命令召来约书亚的意思，比单说“叫约书亚”更符合现代汉语。
- source_word: וְהִתְיַצְּבוּ / וַיִּתְיַצְּבוּ
  choice: 你们要站在 / 站在
  rationale: 该反身词形表示来到指定位置站立或呈身；直译为“站在”既保留动作，也避免加入原文未明说的“在我面前”。前后同一动词采用一致译法。
- source_word: בְּאֹהֶל מוֹעֵד
  choice: 在会幕里
  rationale: “会幕”是该圣所名称在现代汉语中的简明惯用译法；“里”对应介词 בְ 的空间含义。
- source_word: וַאֲצַוֶּנּוּ
  choice: 我好嘱咐他
  rationale: צוה 可表示命令、郑重托付或授予任务；“嘱咐”在本处既能表达神正式交代约书亚，又不把“委任”这一语境含义直接写死。
- source_word: וַיֵּלֶךְ מֹשֶׁה וִיהוֹשֻׁעַ
  choice: 于是，摩西和约书亚前去
  rationale: “于是”自然表达叙事推进及对命令的响应，“前去”则保留原文的行走动作。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文使用神的专名；“雅威”直接按 Yahweh 拟音，保留专名身份，避免用称号替代。
- issue: צוה 在约书亚承接职分语境中的含义
  choice: 嘱咐他
  alternative: 吩咐他；委任他
  rationale: 上下文确实涉及约书亚承接领袖职分，但该动词本身通常表示命令或郑重托付。“嘱咐”保留这一词义幅度；脚注说明可能译法，避免正文过早将其限定为正式委任。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“看哪”保留神谕宣告的郑重感；其余句法尽量自然简洁。脚注标记紧随其实际解释的“嘱咐他”，而非置于“摩西”之后。
