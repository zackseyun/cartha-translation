  text: כִּֽי אֲבִיאֶ֜/נּוּ אֶֽל הָ/אֲדָמָ֣ה אֲשֶׁר נִשְׁבַּ֣עְתִּי לַ/אֲבֹתָ֗י/ו זָבַ֤ת חָלָב֙ וּ/דְבַ֔שׁ וְ/אָכַ֥ל וְ/שָׂבַ֖ע וְ/דָשֵׁ֑ן וּ/פָנָ֞ה אֶל אֱלֹהִ֤ים אֲחֵרִים֙ וַ/עֲבָד֔וּ/ם וְ/נִ֣אֲצ֔וּ/נִי וְ/הֵפֵ֖ר אֶת בְּרִיתִֽ/י־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/020.yaml
  text: For when I bring him into the land that I swore to his fathers[a], a land flowing with milk and honey, and he eats and is satisfied and grows fat, then he will turn to other gods and serve them[b], and spurn me and break my covenant.
translation:
  language: zh_hans
  text: 因为我必领他进入我向他列祖起誓要赐给他的土地，就是流奶与蜜之地；他吃了，得了饱足，变得肥壮，就必转向别神，事奉它们；他们[a]必藐视我[b]，他必违背我的约。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文在这里由单数“他”转为复数“他们”，把以色列既看作一个整体，也看作由众人组成的群体；在“他必违背”处又回到单数。
    reason: 语法说明；保留原文对以色列所作的单复数转换。
  - marker: b
    text: “藐视”也可译作“厌弃”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 本节说明前文警告的缘由；后续动词本身已清楚表达将来的时序，因此用“因为”自然保留其因果作用。
- source_word: אֲבִיאֶנּוּ
  choice: 我将他领进
  rationale: 使役词形表示“使他进入／把他带进”。宾语为阳性单数，以“他”保留把以色列视为一个整体民族的表达。
- source_word: הָאֲדָמָה
  choice: 土地
  rationale: 语境指上帝应许赐给以色列的地域，不只是一般的泥土或土壤。
- source_word: נִשְׁבַּעְתִּי לַאֲבֹתָיו
  choice: 我向他列祖起誓应许的
  rationale: “列祖”保留盟约语境中的传统亲缘称谓；补出“应许”使汉语明确表达此处起誓所承诺的是赐地，而不增加新的内容。
- source_word: זָבַת חָלָב וּדְבַשׁ
  choice: 流奶与蜜之地
  rationale: 采用现代中文圣经语体中清楚而庄重的固定意象，表达土地丰饶。
- source_word: וְאָכַל וְשָׂבַע וְדָשֵׁן
  choice: 他吃得饱足，长得肥壮
  rationale: 既表达吃饱满足，也保留“肥壮”这一具体意象及其所暗示的富足安逸，不将其抽象改写为“富裕”。
- source_word: וּפָנָה אֶל אֱלֹהִים אֲחֵרִים
  choice: 就会转向别神
  rationale: “转向”准确保留方向改变及背离盟约的动作；“别神”比“外国的神”更贴近“其他的神”。
- source_word: וַעֲבָדוּם
  choice: 事奉它们
  rationale: עבד在宗教语境中兼有服事、敬拜之意；“事奉”保留效忠和宗教侍奉的宽度。希伯来语此处仍以集合单数的以色列为主语，并以复数代词指别神。
- source_word: וְנִאֲצוּנִי
  choice: 他们会藐视我
  rationale: 该动词表达轻蔑、鄙弃，且主语突然转为复数；译文以“他们”显出这一数的变化。
- source_word: וְהֵפֵר אֶת־בְּרִיתִי
  choice: 而他会违背我的约
  rationale: הפר表示破坏、废弃盟约义务；“违背我的约”自然准确。动词又回到单数，因此恢复“他”。
theological_decisions:
- issue: 以色列作为集合体时单数与复数的转换
  choice: 保留“他……他们……他”的转换
  alternative: 全节统一译为“他们”，或全节统一译为“他”
  rationale: 希伯来文先把以色列作为一个整体用阳性单数叙述，在“藐视我”处转成复数，随后“违背”又回到单数。译文不将这种真实而突出的语法张力抹平。
- issue: 背约与偶像崇拜的表述
  choice: 译为“转向别神，事奉它们”
  alternative: 概括为“拜偶像”或“背道”
  rationale: 原文以具体动作描述不忠；译文保留这些动作，不额外加入神学概括。
- issue: נִאֵץ的情感与盟约力度
  choice: 藐视我
  alternative: 厌弃我；亵渎我；激怒我
  rationale: “藐视”最直接表达以轻蔑态度对待上帝，同时避免把词义收窄为言语亵渎或仅仅造成上帝发怒。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。“流奶与蜜”“列祖”“事奉”“约”保留经文的盟约语域。刻意保留原文不寻常的单复数转换，并以脚注说明，避免读者误以为排印有误。
