  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה הִנְּ/ךָ֥ שֹׁכֵ֖ב עִם אֲבֹתֶ֑י/ךָ וְ/קָם֩ הָ/עָ֨ם הַ/זֶּ֜ה וְ/זָנָ֣ה אַחֲרֵ֣י אֱלֹהֵ֣י נֵֽכַר הָ/אָ֗רֶץ אֲשֶׁ֨ר ה֤וּא בָא שָׁ֨מָּ/ה֙ בְּ/קִרְבּ֔/וֹ וַ/עֲזָבַ֕/נִי וְ/הֵפֵר֙ אֶת בְּרִיתִ֔/י אֲשֶׁ֥ר כָּרַ֖תִּי אִתּֽ/וֹ־־׀׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/016.yaml
  text: And Yahweh said to Moses[a], “Behold, you are about to lie down with your fathers. Then this people will rise up and prostitute themselves after the foreign gods of the land into whose midst they are entering[b]. They will forsake me and break my covenant that I made with them.”
translation:
  language: zh_hans
  text: 耶和华对摩西说：“看哪，你将要与列祖同睡。此后，这百姓必起来，随从他们将要进入其中的那地的外邦神明行淫[a]；他们必离弃我，违背我与他们所立的约[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“随从外邦神明行淫”。这里以性方面的不忠比喻百姓拜偶像、背弃盟约。
    reason: 说明原文强烈的性不忠隐喻，避免将“行淫”误解为仅指字面行为。
  - marker: b
    text: 原文在“进入”和“与……立约”处使用单数形式，把以色列百姓视为一个整体；正文按现代中文习惯译作复数。
    reason: 交代集体单数的语法现象及正文代词处理。
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文中通行的专名“耶和华”译出四字神名，而不以“主”这一称号代替。
- source_word: הִנְּךָ שֹׁכֵב עִם אֲבֹתֶיךָ
  choice: 看哪，你将要与列祖同睡
  rationale: “看哪”保留 הִנְּךָ 的郑重提示力；“将要”表达临近的将来；“与列祖同睡”保留希伯来文指死亡的委婉说法。
- source_word: וְקָם
  choice: 此后，这百姓必起来
  rationale: 按摩西死后的预告次序译为将来；“起来”保留动词本身的开放性，不预先添入“反叛”等解释。
- source_word: וְזָנָה אַחֲרֵי
  choice: 随从……卖淫
  rationale: 保留以性不忠比喻拜偶像和背约的强烈措辞；中文“随从……卖淫”也呈现 אַחֲרֵי 的追随含义。
- source_word: אֱלֹהֵי נֵכַר הָאָרֶץ
  choice: 那地的外族神明
  rationale: 将 נֵכַר 理解为外来的、属于异族的；“神明”在中文中自然指异教诸神，并避免误读为真神的多个形态。
- source_word: אֲשֶׁר הוּא בָא שָׁמָּה בְּקִרְבּוֹ
  choice: 他们将要进入的那地
  rationale: 希伯来文以单数形式把百姓视为一个整体；中文改用复数“他们”明确实际所指，同时自然表达进入那地之中。
- source_word: וַעֲזָבַנִי
  choice: 他们必离弃我
  rationale: “离弃”具有庄重的盟约语域，并按预言语境译作将来。
- source_word: וְהֵפֵר אֶת בְּרִיתִי
  choice: 违背我……的约
  rationale: הפר 在盟约语境中表示破坏、违反；“违背……约”是清楚自然的现代中文。
- source_word: אֲשֶׁר כָּרַתִּי אִתּוֹ
  choice: 我与他们所立的约
  rationale: כרת ברית 按中文惯用语译为“立约”；原文单数后缀是指作为整体的百姓，中文用“他们”明确所指。
theological_decisions:
- issue: 以性行为比喻拜偶像和盟约不忠
  choice: 保留“卖淫”这一强烈比喻
  alternative: 译为“行邪淫”或淡化为“背信不忠”
  rationale: 原文 זנה 有意使用令人不适的性不忠意象来揭示拜偶像的严重性；直保留比喻比概括为普通的不忠更忠实，但用脚注说明其盟约含义。
- issue: 以集体单数指以色列百姓
  choice: 正文按自然中文用复数“他们”
  alternative: 机械保留为“他将进入……我与他所立的约”
  rationale: 原文将百姓作为一个集体而用单数，所指仍是全体以色列人；中文复数不改变所指或神学含义，并可避免误以为指某个男子。
- issue: “那地的外族神明”的关系
  choice: 理解为与以色列将进入之地相关联的外族神明
  alternative: 译作“异地的神明”或“外国的神”
  rationale: 该结构自然地把这些神明同那地及其外族居民的宗教环境联系起来；不进一步断言其本体或地理辖域。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“看哪”“列祖”“离弃”“立约”保留经文的肃穆语域，但句法力求自然；“卖淫”刻意保留原文的尖锐力度，并以脚注解释其盟约隐喻。
