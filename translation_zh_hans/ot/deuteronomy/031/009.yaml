  text: וַ/יִּכְתֹּ֣ב מֹשֶׁה֮ אֶת הַ/תּוֹרָ֣ה הַ/זֹּאת֒ וַֽ/יִּתְּנָ֗/הּ אֶל הַ/כֹּהֲנִים֙ בְּנֵ֣י לֵוִ֔י הַ/נֹּ֣שְׂאִ֔ים אֶת אֲר֖וֹן בְּרִ֣ית יְהוָ֑ה וְ/אֶל כָּל זִקְנֵ֖י יִשְׂרָאֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/009.yaml
  text: So Moses wrote this law and gave it to the priests[a], the sons of Levi, who carry the ark of the covenant of Yahweh[c][b], and to all the elders of Israel.
translation:
  language: zh_hans
  text: 摩西把这律法[a]写下来，交给抬着耶和华的约柜[b]的祭司，就是利未的子孙[c]，又交给以色列的众长老。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “律法”也可译为“这教导”，或音译为“这《妥拉》”。
    reason: lexical_alternative
  - marker: b
    text: “耶和华”对应希伯来文神名YHWH；也常译作“雅威”，或按传统以“上主”代称。
    reason: alternative_reading
  - marker: c
    text: 原文直译“利未的儿子们”，即利未的子孙；有些译本简译为“利未人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְתֹּב
  choice: 写下来
  rationale: כתב在此直接表示书写；“写下来”自然地体现把内容形成书面文本的叙事动作。
- source_word: הַתּוֹרָה הַזֹּאת
  choice: 这律法
  rationale: תּוֹרָה可指律法、教导或训诲；本节语境是摩西写成并交付的盟约法律文本，因此“这律法”最贴切，同时不把范围扩定为后来的整部《妥拉》。
- source_word: וַיִּתְּנָהּ
  choice: 交给
  rationale: נתן在交付文本的语境中译为“交给”比字面“给”更自然；宾语仍回指阴性名词תּוֹרָה。
- source_word: הַכֹּהֲנִים
  choice: 祭司
  rationale: כֹּהֲנִים是祭司的标准称谓。
- source_word: בְּנֵי לֵוִי
  choice: 利未的子孙
  rationale: 保留希伯来语“利未之子”的亲属—族裔表达，又比现代汉语的字面“儿子”更准确自然。
- source_word: הַנֹּשְׂאִים
  choice: 抬
  rationale: נשׂא在约柜这一具体宾语前指抬负、搬运；“抬”简洁自然，且符合约柜由人抬运的情景。
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: 耶和华约柜
  rationale: 该结构指与耶和华之约相关的柜；“耶和华约柜”是自然、凝练的现代汉语圣经表达，不额外判定其只能理解为“耶和华之约的柜”或“耶和华的约柜”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的专名形式“耶和华”，并以脚注说明其对应希伯来文四字神名YHWH。
- source_word: כָּל זִקְנֵי יִשְׂרָאֵל
  choice: 以色列的众长老
  rationale: 准确表达以色列领导群体中的所有长老；“众长老”在现代庄重汉语中自然。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 原文直接使用四字神名。正文采用中文圣经传统中辨识度高的“耶和华”，脚注交代YHWH及其他常见处理方式，避免把专名无说明地改成称号。
- issue: 本节תּוֹרָה的范围与含义
  choice: 这律法
  alternative: 这教导；这《妥拉》
  rationale: 在申命记的近距语境中，它是摩西写下并交付的盟约性法律与训诲文本。“律法”保留其规范性，但不在译文中进一步断定它具体涵盖本书哪一部分。
- issue: בְּנֵי לֵוִי与“祭司”的关系
  choice: 祭司，就是利未的子孙
  alternative: 利未祭司；祭司和利未人
  rationale: 原文以“利未的子孙”同位说明这些祭司，并非另列第二群人。用“就是”明确同位关系，同时不将范围泛化为所有利未人。
- issue: 关系分句הַנֹּשְׂאִים的修饰对象
  choice: 交给抬……约柜的祭司
  alternative: 交给祭司；利未的子孙负责抬约柜
  rationale: 按原文语法，分词短语修饰前述“祭司，就是利未的子孙”。译文保持这一关系，不把职责拆成独立陈述。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。以“写下来、交给、抬”保持叙事清晰；用“就是”呈现“祭司”与“利未的子孙”的同位结构。所有脚注标记均已置于正文相应位置。
