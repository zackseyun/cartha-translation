  yaml_path: translation/ot/deuteronomy/031/005.yaml
  text: And the LORD will give them over to you, and you shall do to them according to all the commandment that I have commanded you.
translation:
  language: zh_hans
  text: 耶和华必把他们交给你们；你们要照我所吩咐你们的一切命令处置他们。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּנְתָנָם יְהוָה לִפְנֵיכֶם
  choice: 耶和华必把他们交在你们面前
  rationale: 保留“交付”与“在你们面前”的原文意象；“他们”承接上下文所指的列国。
- source_word: וַעֲשִׂיתֶם לָהֶם
  choice: 你们要……处置他们
  rationale: 原义为“你们要对他们行”，现代汉语用“处置”自然表达按命令对待他们，同时不在本节中额外详述具体行动。
- source_word: כְּכָל הַמִּצְוָה
  choice: 照……一切命令
  rationale: מִצְוָה 为单数集合用法，指所吩咐的全部规定；译作“一切命令”符合现代汉语习惯。
- source_word: אֲשֶׁר צִוִּיתִי אֶתְכֶם
  choice: 我所吩咐你们的
  rationale: 直接保留第一人称说话者与第二人称复数受命者。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威／上主
  rationale: 采用现代中文圣经读者熟悉的专名“耶和华”，明确原文使用的是神的专名，不增添宗派性解释。
- issue: “命令”的范围
  choice: 保留概括性表达，不在本节展开具体内容
  alternative: 明确译出毁灭或灭绝他们
  rationale: 本节原文本身只回指此前的命令；译文保留这种上下文依赖，避免把相邻经文的细节直接添入本节。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“交在你们面前”略带原文意象但仍易懂；分号清楚呈现神的行动与以色列应当采取的行动。
