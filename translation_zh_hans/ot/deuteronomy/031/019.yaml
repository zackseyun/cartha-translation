  text: וְ/עַתָּ֗ה כִּתְב֤וּ לָ/כֶם֙ אֶת הַ/שִּׁירָ֣ה הַ/זֹּ֔את וְ/לַמְּדָ֥/הּ אֶת בְּנֵי יִשְׂרָאֵ֖ל שִׂימָ֣/הּ בְּ/פִי/הֶ֑ם לְמַ֨עַן תִּהְיֶה לִּ֜/י הַ/שִּׁירָ֥ה הַ/זֹּ֛את לְ/עֵ֖ד בִּ/בְנֵ֥י יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/019.yaml
  text: And now[a], write this song for yourselves, and teach it to the sons of Israel; put it in their mouths[b], so that this song may be a witness for me against the sons of Israel.
translation:
  language: zh_hans
  text: “现在，你们要为自己写下这首歌；你要把它教给以色列人[a]，并放在他们口中，好使这首歌为我作见证，指证以色列人[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“以色列的众子”；这里指以色列人这一民族共同体。
    reason: lexical_alternative
  - marker: b
    text: “指证以色列人”也可译作“在以色列人中作见证”。原文介词可以表示“在……中”，但本段的盟约警告语境支持“指证”的理解。
    reason: alternative_reading
lexical_decisions:
- source_word: וְעַתָּה
  choice: 现在
  rationale: 既承接上文，又引出眼前的命令；现代汉语用“现在”即可自然表达这种转折和紧迫感。
- source_word: כִּתְבוּ לָכֶם
  choice: 你们要为自己写下
  rationale: 保留复数命令和לָכֶם的受益、反身意味；“写下”在汉语中自然表明将歌记录成文。
- source_word: הַשִּׁירָה הַזֹּאת
  choice: 这首歌
  rationale: שִׁירָה通常指“歌”；量词“首”符合现代汉语习惯，也不妨碍下章具有诗歌体裁。
- source_word: וְלַמְּדָהּ
  choice: 你要把它教给
  rationale: 动词为阳性单数命令，故在前一句复数“你们”之后明确转为单数“你”；宾语代词指前面的“这首歌”。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 该表达字面为“以色列的众子”，但在这里是对以色列民族的常规称呼；“以色列人”在现代汉语中准确、自然，也不会被误解为只包括男性。字面形式列入脚注。
- source_word: שִׂימָהּ בְּפִיהֶם
  choice: 放在他们口中
  rationale: 保留希伯来文具体鲜明的意象，表示使百姓能记住并诵唱这歌，而不把隐含意义直接改写进正文。
- source_word: לְמַעַן
  choice: 好使
  rationale: 自然表达目的关系，同时保持庄重语体。
- source_word: תִּהְיֶה לִּי ... לְעֵד
  choice: 为我作见证
  rationale: 保留“为我”的关系和עֵד“见证、证人”的司法色彩，避免把它单纯弱化为一般性“证明”。
- source_word: בִּבְנֵי יִשְׂרָאֵל
  choice: 指证以色列人
  rationale: 结合盟约警告和下文，这里的ב最可能带有不利于其对象的含义；汉语“指证”自然表达见证针对以色列的功能。较字面的空间性理解保留在脚注。
theological_decisions:
- issue: 命令动词由复数转为单数
  choice: “你们要……；你要……”
  alternative: 全句统一译作“你们要……”或省略主语
  rationale: 希伯来文先用复数כִּתְבוּ，随后用两个单数命令וְלַמְּדָהּ、שִׂימָהּ。正文保留这一真实而可能令人注意的数变化，不擅自把称呼对象统一。
- issue: בְּנֵי יִשְׂרָאֵל的表达
  choice: 以色列人
  alternative: 以色列的众子；以色列子孙
  rationale: 此处是民族共同体的惯用称呼，并非教导只限于男性。现代汉语“以色列人”能准确传达所指范围，而脚注保留原文形式。
- issue: 见证句中ב的语义
  choice: 指证以色列人
  alternative: 在以色列人中作见证
  rationale: 上下文描述以色列将来违约以及这歌承担控诉功能，因此逆向、针对性的解释较合语境；不过介词本身也可按空间关系理解，故在脚注中注明。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。用分号显出命令主语由复数转为单数；保留“放在他们口中”的原文意象，并以“作见证、指证”呈现本节的司法和盟约语气。
