base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/002.yaml
  text: And he said to them[a], “I am one hundred twenty years old today. I can no longer go out and come in, and Yahweh has said to me, ‘You shall not cross this Jordan.’”
translation:
  language: zh_hans
  text: 他对他们说：“我今天一百二十岁了，不能再出入[a]；雅威曾对我说：‘你不可渡过这条约旦河。’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“出去和进来”；这个说法既可指日常活动，也可指带领百姓。
    reason: 保留原文习语的词义范围，避免正文过早选定一种解释。
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵהֶם
  choice: 他对他们说
  rationale: 按希伯来语叙事体自然承接上文，不额外限定为时间或因果关系。
- source_word: בֶּן מֵאָה וְעֶשְׂרִים שָׁנָה אָנֹכִי הַיּוֹם
  choice: 我今天一百二十岁了
  rationale: 将字面为“一百二十岁之子”的希伯来语年龄表达转换为自然的现代汉语，并保留“今天”的时间强调和 אָנֹכִי 的明确第一人称。
- source_word: לֹא אוּכַל עוֹד
  choice: 不能再
  rationale: 准确表达 יכל 的能力意义及 עוֹד 所表示的“不再”。
- source_word: לָצֵאת וְלָבוֹא
  choice: 出入
  rationale: “出入”简洁保留“出去和进来”的希伯来语表达，也可容纳日常活动与履行领袖职分两种语境可能，不在正文中缩窄解释。
- source_word: וַיהוָה
  choice: 雅威
  rationale: 直接音译四字神名 יְהוָה，以保留经文中的立约之名。
- source_word: אָמַר אֵלַי
  choice: 也曾对我说
  rationale: “曾”表示先前说出而对当前仍有效的话；“也”自然连接摩西自身的限度与雅威的宣告。
- source_word: לֹא תַעֲבֹר
  choice: 你不可渡过
  rationale: 保留否定表达兼具禁令与确定宣告的力度，不将其单纯化为预测。
- source_word: אֶת הַיַּרְדֵּן הַזֶּה
  choice: 这约旦河
  rationale: 保留指示词“这”，并按现代汉语惯用方式明确约旦为河流。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；采用“雅威”保留其专名性质，不以称号“主”替代。
- issue: “不能再出入”的含义
  choice: 在正文中保留含混性
  alternative: 明确译为“不能再带领你们”或“不能再自由行动”
  rationale: 该短语既可能指一般行动，也可能在领袖语境中指带领百姓；原文本身未在此处明确消除这种张力。
- issue: “你不可渡过”的语气
  choice: 保留禁令与宣告之间的张力
  alternative: 你不会渡过；你不准渡过
  rationale: 希伯来语否定未完成式在神的话语中可兼具禁止和对结果的确定宣告；“不可”较能同时承载二者。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“出入”保留原文简洁习语；“渡过这约旦河”比“越过这约旦”更符合普通读者的现代汉语习惯。
