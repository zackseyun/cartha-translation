source:
  edition: WLC
  text: הַקְהֵ֣ל אֶת הָ/עָ֗ם הָֽ/אֲנָשִׁ֤ים וְ/הַ/נָּשִׁים֙ וְ/הַ/טַּ֔ף וְ/גֵרְ/ךָ֖ אֲשֶׁ֣ר בִּ/שְׁעָרֶ֑י/ךָ לְמַ֨עַן יִשְׁמְע֜וּ וּ/לְמַ֣עַן יִלְמְד֗וּ וְ/יָֽרְאוּ֙ אֶת יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם וְ/שָֽׁמְר֣וּ לַ/עֲשׂ֔וֹת אֶת כָּל דִּבְרֵ֖י הַ/תּוֹרָ֥ה הַ/זֹּֽאת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/012.yaml
  text: Assemble the people—the men[a], the women, the little children, and the sojourner within your gates—so that they may hear, and so that they may learn and fear Yahweh your God[d][c][b], and be careful to do all the words of this law.
translation:
  language: zh_hans
  text: 你要召集百姓，就是男人、女人、幼童，以及住在你城镇中的寄居者[a][b]，好叫他们听见，并学习敬畏雅威你们的上帝[c]，谨慎遵行这律法的一切话语[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “寄居者”也可译作“外来居民”，指住在以色列人中间、并非本地出生的居民。
    reason: lexical_alternative
  - marker: b
    text: “住在你城镇中”原文直译为“在你城门内”；“城门”在这里借指城镇或当地社区。
    reason: cultural_note
  - marker: c
    text: “敬畏”也可译作“惧怕”或“尊崇”；原文动词包含带着顺服的畏惧和崇敬。
    reason: lexical_alternative
  - marker: d
    text: “律法”也可译作“教导”；希伯来语תּוֹרָה可兼有这两层意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקְהֵל
  choice: 召集
  rationale: 这是קהל的使役词干祈使式，要求使百姓聚集成会；“召集”简洁自然，也保留正式召聚的语气。
- source_word: הָעָם
  choice: 百姓
  rationale: 此处指以色列整个圣约群体；“百姓”符合申命记语境和现代中文习惯。
- source_word: הָאֲנָשִׁים וְהַנָּשִׁים וְהַטַּף
  choice: 男人、女人、幼童
  rationale: 原文逐一列出群体，不宜概括处理。טַף通常指年幼的孩子或受抚养者，“幼童”保留其年龄较小的意味。
- source_word: וְגֵרְךָ
  choice: 寄居者
  rationale: גֵר指住在以色列人中间、并非本地出生的居民；“寄居者”保留其社会和圣约法律语境，脚注补充“外来居民”这一含义。
- source_word: אֲשֶׁר בִּשְׁעָרֶיךָ
  choice: 住在你城内的
  rationale: 字面为“在你城门内”，申命记中“城门”常借指城镇及其辖区。正文采用自然中文表达，脚注保留原文意象。
- source_word: לְמַעַן יִשְׁמְעוּ וּלְמַעַן יִלְמְדוּ
  choice: 使他们可以听见，可以学习
  rationale: 保留两个并列目的：先听见所宣读的律法，再从中学习；中文重复“可以”体现原文累加结构而不显生硬。
- source_word: וְיָרְאוּ אֶת יְהוָה אֱלֹהֵיכֶם
  choice: 敬畏雅威你们的上帝
  rationale: ירא在圣约语境中兼有惧怕、尊崇和顺服的意味，“敬畏”能较完整地传达这一张力。יהוה作为专名音译为“雅威”。
- source_word: וְשָׁמְרוּ לַעֲשׂוֹת
  choice: 并谨慎遵行
  rationale: שמר加不定式表达留心持守并付诸行动；“谨慎遵行”自然地兼顾慎重看守和实际顺服。
- source_word: כָּל דִּבְרֵי הַתּוֹרָה הַזֹּאת
  choice: 这律法的一切话
  rationale: 保留דִּבְרֵי的“一切话”，而不概括为“一切规定”。תּוֹרָה也可指教导，但在本段圣约文献语境中译作“律法”较贴切。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名。正文以现代汉语音译“雅威”呈现其专名性质，而不以“主”这一称号替代；“耶和华”是中文传统中广为人知的另一种形式。
- issue: ירא所表达的态度
  choice: 敬畏
  alternative: 惧怕；尊崇
  rationale: 此词在圣约语境中既不只是恐惧，也不只是尊敬，还关联顺服；“敬畏”保留这些含义之间的张力。
- issue: 集会成员的明确列举
  choice: 男人、女人、幼童
  alternative: 所有人，包括男女和孩子
  rationale: 原文明确逐项列举各群体，译文照样保留，强调全体圣约群体都要听见律法。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“就是”自然引出对“百姓”的逐项说明；“听见—学习—敬畏—遵行”保留原文由聆听到行动的推进。神名译作“雅威”，使读者看出此处是专名，而不是称号。
