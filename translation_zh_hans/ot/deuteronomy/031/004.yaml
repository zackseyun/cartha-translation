  yaml_path: translation/ot/deuteronomy/031/004.yaml
  text: And the LORD will do to them just as he did to Sihon and Og, the kings of the Amorites, and to their land, when he destroyed them.
translation:
  language: zh_hans
  text: 耶和华必照着他从前对亚摩利人的两个王西宏和噩，以及对他们的土地所做的那样对待他们；当他毁灭他们时，也是如此。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经中广为人知的专名形式，明确对应希伯来文四字神名。
- source_word: וְעָשָׂה ... לָהֶם
  choice: 必……处置他们
  rationale: 这里的 עשה ל 表示“对……施行、处置”；结合战争与毁灭的语境，“处置”比泛泛的“对待”更明确，同时未提前重复“灭尽”。
- source_word: כַּאֲשֶׁר עָשָׂה
  choice: 照他从前怎样……也同样
  rationale: 保留比较结构，并用“从前”清楚表达所指的既往事件。
- source_word: הִשְׁמִיד
  choice: 灭尽
  rationale: 该使役动词在此指彻底毁灭；“灭尽”既贴近语义，也符合庄重的历史叙事语体。
theological_decisions:
- issue: 关系从句 אֲשֶׁר הִשְׁמִיד אֹתָם 的指向与语义关系
  choice: 译作独立补述“那时，他把他们灭尽了”
  alternative: “就是他所灭尽的”或“当他灭尽他们时”
  rationale: אֲשֶׁר 可引入关系性或情境性补充。译作“那时”保留英语审校层所采用的时间理解，又避免中文中误让“所灭尽的”只修饰紧邻的“土地”。“他们”仍保留原文复数代词可能回指诸王或诸王及其势力的张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。以分号分开比较主句和末尾补述，避免原文连续关系结构在中文里产生修饰歧义。
