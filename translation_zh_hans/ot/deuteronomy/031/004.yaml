revisions:
- from: 耶和华必照他从前怎样处置亚摩利人的两个王西宏和噩，以及他们的土地，也同样处置他们；那时，他把他们灭尽了。
  to: 耶和华必照着他从前对亚摩利人的两个王西宏和噩，以及对他们的土地所做的那样对待他们；当他毁灭他们时，也是如此。
  rationale: 修订以“对待／所做的”保留原文两次“施行”的宽泛表达，并避免“处置土地”的不自然搭配。末尾仍译出时间性补述，同时保留“他们”可回指西宏、噩及其所属势力的原有弹性。
  reviewer_model: gpt-5.6-terra
