  text: וְ/זָֽכַרְתָּ֙ אֶת יְהוָ֣ה אֱלֹהֶ֔י/ךָ כִּ֣י ה֗וּא הַ/נֹּתֵ֥ן לְ/ךָ֛ כֹּ֖חַ לַ/עֲשׂ֣וֹת חָ֑יִל לְמַ֨עַן הָקִ֧ים אֶת בְּרִית֛/וֹ אֲשֶׁר נִשְׁבַּ֥ע לַ/אֲבֹתֶ֖י/ךָ כַּ/יּ֥וֹם הַ/זֶּֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/018.yaml
  text: But you shall remember Yahweh your God[a], for it is he who gives you power to gain wealth, so that he may establish his covenant that he swore to your fathers[c][b], as it is this day.
translation:
  language: zh_hans
  text: 但你要记得雅威你的上帝，因为正是他赐给你获得财富的能力，为要坚立他向你列祖所起誓的约，正如今日所显明的。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “获得财富”也可译作“创造财富”，或较宽泛地译作“取得成就”。
    reason: lexical_alternative
  - marker: b
    text: “正如今日所显明的”对应希伯来语习语“如同今日这一天”，意思是“正如今天所显明的”或“正如现今的情形”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזָכַרְתָּ
  choice: 但你要记得
  rationale: 该形式在训诫语境中带命令或强烈劝勉意味；“但”承接上一节不可把财富归功于自己的警告。
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: 耶和华你的上帝
  rationale: 以现代中文通行形式音译神的专名，并保留“你的上帝”所表达的盟约关系。
- source_word: כִּי הוּא הַנֹּתֵן לְךָ כֹּחַ
  choice: 因为正是他赐给你……的能力
  rationale: “正是他”体现独立代词 הוּא 的强调；分词表达上帝持续而具特征性的赐予。
- source_word: לַעֲשׂוֹת חָיִל
  choice: 获得财富
  rationale: 结合第17节的直接语境，חָיִל 在此主要指财富或资财；“获得”自然表达受赐能力而取得财富，并在脚注保留较宽泛的可能含义。
- source_word: לְמַעַן הָקִים אֶת־בְּרִיתוֹ
  choice: 为要坚立……所立的约
  rationale: לְמַעַן 表目的；קום 的使役式在此表示使盟约落实、确立并有效施行。“坚立”避免误解为此前没有盟约。
- source_word: אֲשֶׁר נִשְׁבַּע לַאֲבֹתֶיךָ
  choice: 他向你列祖起誓所立的
  rationale: 中文“向……起誓所立的约”自然补足希伯来语中由语境理解的立约内容；“列祖”指以色列的盟约先祖。
- source_word: כַּיּוֹם הַזֶּה
  choice: 正如今日这样
  rationale: 保留申命记常见的时间习语，指这约在当下已有可见的落实或明证。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用四字神名。中文正文采用读者最熟悉且仍作为专名使用的“耶和华”，不以“主”这一称号替代神名；“雅威”是另一种可能音译。
- issue: חָיִל 在本节的范围
  choice: 财富
  alternative: 成就／兴盛
  rationale: 第17节明确谈到所得的财富，因此正文采用经济意义；该词较宽的成功、实力或兴盛含义留在脚注中。
- issue: הָקִים 与盟约的关系
  choice: 坚立
  alternative: 证实／持守
  rationale: 此词可涉及确立、落实或履行盟约。“坚立”既保留行动性，也不暗示上帝此时才首次缔结该约。
- issue: אֲבֹתֶיךָ 的所指
  choice: 你的列祖
  alternative: 你的祖先
  rationale: 这里并非泛指所有先人，而主要指上帝与之立约并起誓的先祖；“列祖”保留这一特定的盟约背景。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“正是他”保留原文强调；“列祖”虽较书面，但在盟约语境中准确且易于理解。脚注标记均置于相关整句末尾，避免打断正文阅读。
