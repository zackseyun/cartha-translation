base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/006.yaml
  text: So you shall keep the commandments of Yahweh your God[b][a], by walking in his ways and by fearing him.
translation:
  language: zh_hans
  text: 所以[a]，你要遵守雅威——你的上帝——的诫命，行在他的道中，并敬畏他[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或作“并且，你要遵守……”。希伯来文连词也可仅表示并列；不过结合上文，这里很可能表示推论。
    reason: lexical_alternative
  - marker: b
    text: “敬畏他”指在上帝面前怀有含尊崇之意的畏惧；也可译为“尊崇他”，但后者较弱化原文“惧怕”的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַרְתָּ
  choice: 所以，你要遵守
  rationale: שׁמר在盟约语境中指遵守、持守诫命；前缀连词וְ结合上文可表达推论，故正文译为“所以”，同时以脚注保留单纯并列的可能。
- source_word: מִצְוֺת
  choice: 诫命
  rationale: 该词为复数构造形式，指上帝所吩咐的盟约义务；“诫命”保留其法律和盟约色彩。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文直接音译四字神名，保留其作为以色列上帝之专名的性质，而不以头衔替代。
- source_word: אֱלֹהֶיךָ
  choice: 你上帝
  rationale: 构造形式带第二人称阳性单数后缀，直译为“你的上帝”；置于神名之后时，现代中文习惯表达为“雅威你上帝”。
- source_word: לָלֶכֶת בִּדְרָכָיו
  choice: 行他的道
  rationale: “行走”在此为比喻性用法，指按照上帝所规定的道路生活行事；“行他的道”自然、庄重，并保留原文意象。
- source_word: וּלְיִרְאָה אֹתוֹ
  choice: 并敬畏他
  rationale: ירא用于对上帝的态度时既保留“惧怕”的力度，又含恭敬尊崇之意；“敬畏”在现代中文中能较好承载这两方面。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。音译“雅威”较贴近现有语言学重构，也避免把专名改成头衔。
- issue: 对上帝“畏惧”的含义
  choice: 敬畏他
  alternative: 惧怕他；尊崇他
  rationale: “敬畏”既不把ירא弱化为单纯尊重，也表明这里是在盟约关系中对上帝怀有畏惧与尊崇；脚注进一步说明其语义张力。
- issue: 两个不定式与“遵守诫命”的关系
  choice: 行他的道，并敬畏他
  alternative: 借着行他的道并敬畏他；为要行他的道并敬畏他
  rationale: 希伯来文ל不定式可说明遵守诫命的具体表现，也可带有目的或结果色彩。中文并列结构避免过度限定其句法关系。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“行他的道”保留希伯来文的道路意象；全句以简洁并列结构呈现，避免人为消除不定式所容许的方式、目的或结果关系。
