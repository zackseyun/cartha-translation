revisions:
- from: 他在旷野把你祖先不认识的吗哪给你吃，为要使你谦卑，也为要考验你，使你最终得福。[a]
  to: 他在旷野把你祖先未曾认识的吗哪给你吃，为要使你谦卑，也为要考验你，使你日后得益处。[a]
  rationale: The revision retains the source’s sequence of feeding, humbling, testing, and eventual benefit. It replaces “得福” with the semantically broader “得益处,” improves the relative clause’s Mandarin idiom, and keeps a footnote anchored to the final temporal/outcome expression without resolving its lexical ambiguity.
  reviewer_model: gpt-5.6-terra
