  text: הַ/מַּֽאֲכִ֨לְ/ךָ֥ מָן֙ בַּ/מִּדְבָּ֔ר אֲשֶׁ֥ר לֹא יָדְע֖וּ/ן אֲבֹתֶ֑י/ךָ לְמַ֣עַן עַנֹּֽתְ/ךָ֗ וּ/לְמַ֨עַן֙ נַסֹּתֶ֔/ךָ לְ/הֵיטִֽבְ/ךָ֖ בְּ/אַחֲרִיתֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/016.yaml
  text: who fed you manna in the wilderness[a], which your fathers had not known, in order to humble you and in order to test you[b], to do you good in the end.
translation:
  language: zh_hans
  text: 他在旷野把你祖先未曾认识的吗哪给你吃，为要使你谦卑，也为要考验你，使你日后得益处。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “日后”或译“最终”“在你的结局”。
    reason: 保留 בְּאַחֲרִיתֶךָ 可指后来、最终结果或结局的词义幅度。
lexical_decisions:
- source_word: הַמַּאֲכִלְךָ
  choice: 把……给你吃
  rationale: 希伯来语使役分词承接上一节对上帝的描述；此译自然表达“使你吃、供你食用”的含义。
- source_word: מָן
  choice: 吗哪
  rationale: 采用现代中文圣经语境中这一旷野食物的通行音译。
- source_word: בַּמִּדְבָּר
  choice: 在旷野
  rationale: 准确表达荒野、旷野地带，并符合出埃及叙事的惯用语境。
- source_word: אֲשֶׁר לֹא יָדְעוּן אֲבֹתֶיךָ
  choice: 你祖先不认识的
  rationale: 关系从句修饰“吗哪”；“不认识”在此表示从未见识、并不熟悉。
- source_word: אֲבֹתֶיךָ
  choice: 你祖先
  rationale: 原文直译为“你的父辈”，在本语境泛指先辈；中文用“祖先”自然且不误导为亲生父亲。
- source_word: לְמַעַן
  choice: 为要
  rationale: 清楚保留目的关系，并适合两个并列目的不定式。
- source_word: עַנֹּתְךָ
  choice: 使你谦卑
  rationale: ענה 的 Piel 可指使人受苦或降卑；上下文强调借艰难使以色列谦卑，同时不完全排除苦难维度。
- source_word: נַסֹּתֶךָ
  choice: 考验你
  rationale: 表达 נסה 的检验、试验含义，符合旷野中的盟约性考验主题。
- source_word: לְהֵיטִבְךָ
  choice: 使你……得福
  rationale: יטב 的 Hiphil 表示善待、使得益处；“得福”在此自然表达上帝最终使其获益。
- source_word: בְּאַחֲרִיתֶךָ
  choice: 最终
  rationale: אַחֲרִית 带第二人称后缀，可指后来、结局或最终结果；“最终”在中文中自然，又保留时间与结果上的开放性。
theological_decisions:
- issue: 旷野艰难的目的
  choice: 保留“使你谦卑”和“考验你”的严肃性，并以“使你最终得福”表达其善意目的。
  alternative: 将谦卑和考验理解为纯粹惩罚。
  rationale: 两个目的短语最后落在使以色列得益处上；译文不淡化艰难，也不把它描述成仅仅惩罚。
- issue: בְּאַחֲרִיתֶךָ 的所指
  choice: 译为“最终”，让它可指后来的结果或最终结局。
  alternative: 译为“日后”“在你的结局”或“末了”。
  rationale: 原词具有时间和结局方面的语义幅度；中文“最终”较自然，并避免把它不必要地限定为死亡、末世或某一特定时点。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。将“父辈”按语境译为“祖先”；句法尽量保留原文连续的目的结构，同时避免生硬直译。
