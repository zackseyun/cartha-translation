- source_word: אֶרֶץ
  choice: 出产……之地
  rationale: 既保留“地”的核心意义，也以现代汉语自然表达这片土地以这些作物著称；原文两次出现，本译文也重复保留其修辞结构。
- source_word: חִטָּה וּשְׂעֹרָה
  choice: 小麦、大麦
  rationale: 准确采用这两种谷物在现代汉语中的通行名称。
- source_word: גֶּפֶן
  choice: 葡萄
  rationale: 该词字面可指葡萄树，在作物清单中以“葡萄”表达其农产意义更符合自然汉语，又不改变所指。
- source_word: תְּאֵנָה
  choice: 无花果
  rationale: 该词通常指无花果树；在此土地物产清单中译作“无花果”自然清楚，果树及其果实的关联由语境涵盖。
- source_word: רִמּוֹן
  choice: 石榴
  rationale: 该词可指石榴或石榴树；“石榴”在汉语物产清单中简洁自然，并保留词义范围。
- source_word: זֵית שֶׁמֶן
  choice: 橄榄油
  rationale: 该结构由“橄榄”和“油”构成，可涉及产油的橄榄或其油；“橄榄油”在本句农产语境中清楚自然。
- source_word: דְּבָשׁ
  choice: 蜂蜜
  rationale: 这是该词常见而宽泛的对应词；在描述土地物产时也可能指甜浆，尤其是椰枣糖浆，因此用脚注保留这一可能。
