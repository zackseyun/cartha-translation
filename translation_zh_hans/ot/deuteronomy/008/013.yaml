base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/013.yaml
  text: and your herds and your flocks multiply[a], and silver and gold increase for you[b], and all that is yours increases—
translation:
  language: zh_hans
  text: 你的牛群[a]和羊群增多，你的金银也增多[b]，你所有的一切都增多——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “牛群”原文特指牛类牲畜；后面的“羊群”则是绵羊、山羊等小型牲畜的集合称呼。
    reason: lexical_clarification
  - marker: b
    text: 直译：“金银为你增多。”
    reason: translation_alternative
lexical_decisions:
- source_word: וּבְקָרְךָ
  choice: 你的牛群
  rationale: בקר是牛类牲畜的集合称呼；“牛群”在现代汉语中自然，并与下文“羊群”形成对应。
- source_word: וְצֹאנְךָ
  choice: 和羊群
  rationale: צאן集合性地指绵羊、山羊等小型牲畜；“羊群”保留集合意义，且不把原文未逐项列出的动物写入正文。
- source_word: יִרְבְּיוּן
  choice: 增多
  rationale: רבה在此表示数量增加；“增多”适用于牛羊，也准确传达复数主语的增长。
- source_word: וְכֶסֶף וְזָהָב יִרְבֶּה לָּךְ
  choice: 你的金银也增多
  rationale: 原文名词本身没有第二人称物主词尾，但לָךְ表明金银是为“你”增加、归于“你”的；汉语用“你的”自然表达这一关系，避免生硬的“金银为你增多”。
- source_word: וְכֹל אֲשֶׁר לְךָ
  choice: 你所有的一切
  rationale: 该短语概括属于受话者的全部财物；“你所有的一切”简明地保留其总括性和所属关系。
- source_word: יִרְבֶּה
  choice: 都增多
  rationale: רבה再次描述增长；配合“所有的一切”，加“都”使汉语总括关系清楚自然。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。保留原文三个并列增长分句及句末未完的语势，以破折号衔接下一节；不额外解释财富增长的神学意义。
