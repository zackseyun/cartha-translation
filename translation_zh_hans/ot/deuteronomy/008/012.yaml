  text: lest[a], when you have eaten and are satisfied, and have built good houses and lived in them,
translation:
  language: zh_hans
  text: 免得你吃饱了[a]，建造美好的房屋，住在其中，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“吃了，得了饱足”。原文的动词既可强调身体吃饱，也可强调充分满足。
    reason: 保留 שׂבע 在身体饱足与充分满足之间的词义幅度。
lexical_decisions:
- source_word: פֶּן
  choice: 免得
  rationale: 承接上一节，引出需要警惕的后果；“免得”简洁保留了希伯来语的劝诫和警告语气。
- source_word: תֹּאכַל וְשָׂבָעְתָּ
  choice: 你吃饱了
  rationale: 将“吃”和“饱足”合为现代汉语自然的表达，同时保留人在丰足中得到饱足的意思。
- source_word: וּבָתִּים טוֹבִים
  choice: 美好的房屋
  rationale: טוֹבִים 基本义为“好的”；此处结合富足的语境译作“美好的”，表达房屋优良宜居，却不擅自强化为奢华。
- source_word: תִּבְנֶה
  choice: 建造
  rationale: 与后面的“住”并列，呈现警告情境中接续发生的行为；汉语无需另加将来或完成标记。
- source_word: וְיָשָׁבְתָּ
  choice: 住在其中
  rationale: ישׁב 在此指居住；“其中”根据前面的复数“房屋”补出，使现代汉语语意完整自然。
