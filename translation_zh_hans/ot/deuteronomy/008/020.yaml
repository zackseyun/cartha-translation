base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/020.yaml
  text: Like the nations that Yahweh is destroying before you[a], so you will perish, because you did not listen to the voice of Yahweh your God.
translation:
  language: zh_hans
  text: 你们也必像耶和华从你们面前除灭的列国一样灭亡，因为你们不听从耶和华你们上帝的话[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “听从……的话”直译为“听……的声音”；这个希伯来语说法通常也含有服从的意思。
    reason: 说明希伯来语习语兼具聆听与顺服的含义。
lexical_decisions:
- source_word: כַּגּוֹיִם
  choice: 像……列国一样
  rationale: כְּ表示比较；גּוֹיִם在本段指迦南地的各国。“列国”既符合申命记语境，也与后面的“你们”构成清楚对比。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名“耶和华”对应四字神名，保留其作为以色列之上帝立约之名的性质，而不以称号替代。
- source_word: מַאֲבִיד
  choice: 除灭
  rationale: 这是אבד的使役分词，表示耶和华正在使列国灭亡；“除灭”在本语境中自然，并能表达从以色列人面前清除的含义。
- source_word: מִפְּנֵיכֶם
  choice: 从你们面前
  rationale: 较直接地保留希伯来语“从……面前”的空间意象，指列国在以色列人进军时被清除。
- source_word: כֵּן תֹאבֵדוּן
  choice: 你们也必……一样灭亡
  rationale: 用“像……一样……也”自然再现כַּ...כֵּן的对应比较结构；תֹאבֵדוּן是复数未完成式，在警告中表达确定的将来后果。
- source_word: עֵקֶב
  choice: 因为
  rationale: 在此引出灭亡的原因；“因为”是清楚自然的现代汉语表达。
- source_word: לֹא תִשְׁמְעוּן בְּקוֹל
  choice: 不听从……的话
  rationale: שׁמע בקול兼有听取与服从之意。中文“听从……的话”保留听闻意象，也自然传达顺服含义，避免仅译“听见”或完全改写为“遵守”。
- source_word: אֱלֹהֵיכֶם
  choice: 你们上帝
  rationale: 与耶和华同位，明确指以色列的上帝；“你们上帝”简洁保留第二人称复数关系。
theological_decisions:
- issue: 四字神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用上帝的专名而非称号。正文采用现代简体中文圣经传统中最通行、普通读者最易识别的“耶和华”，同时保留专名性质。
- issue: שׁמע בקול应侧重“听”还是“顺服”
  choice: 不听从……的话
  alternative: 不听……的声音／不顺服
  rationale: 该希伯来习语同时包含聆听和服从。译作“听从……的话”在现代汉语中兼顾两层含义，不把它缩减为单纯听觉行为，也不完全抹去原文的“听”意象。
- issue: לֹא תִשְׁמְעוּן的时间与体貌
  choice: 不听从
  alternative: 没有听从／不肯听从
  rationale: 未完成式在这段劝诫警告中可概括持续或将来的悖逆。中文用无时态标记的“不听从”保留这种开放性，不按英语审校层的过去时处理。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“除灭／灭亡”保留同一希伯来词根在使役式与基本式之间的语义联系；句式以“像……一样……也”清楚呈现原文首尾呼应的比较结构。
