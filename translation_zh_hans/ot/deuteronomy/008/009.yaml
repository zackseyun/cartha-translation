base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/009.yaml
  text: a land in which you will not eat bread in poverty[a], in which you will lack nothing; a land whose stones are iron[b], and from whose hills you will quarry copper.
translation:
  language: zh_hans
  text: 在那地，你不会在贫困中吃饼[a]，什么也不会缺；那地的石头是铁，你将从那地的山中开采铜[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“在匮乏中”或“在穷困中”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语“נְחֹשֶׁת”可指“铜”或“青铜”；这里说的是从山中开采的物质，因此译作“铜”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְמִסְכֵּנֻת
  choice: 在贫困中
  rationale: 该词表示贫困、匮乏或穷困的处境。译作“在贫困中”保留了原文的具体表达，也避免与下一句“什么也不会缺”重复。
- source_word: לֶחֶם
  choice: 饼
  rationale: 基本义是“饼、食饼”，虽可泛指食物，此处保留具体意象，并符合圣经时代的饮食语境。
- source_word: תֶחְסַר כֹּל
  choice: 什么也不会缺
  rationale: 这一表达强调完全充足；该译法自然、清楚，并保留了 כֹּל 的总括意味。
- source_word: אֲבָנֶיהָ בַרְזֶל
  choice: 那地的石头是铁
  rationale: 原文是简练的名词句“它的石头〔是〕铁”。直译保留其鲜明意象，同时可让读者理解为含铁的石头或铁矿石。
- source_word: תַּחְצֹב
  choice: 开采
  rationale: 该动词有凿取、采掘之意。“开采”在现代汉语中自然，也适合从山中取得矿物的语境。
- source_word: נְחֹשֶׁת
  choice: 铜
  rationale: 该词可指铜或青铜；这里说从山中开采天然资源，因此“铜”比作为合金的“青铜”更合适。
theological_decisions: []
