base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/002.yaml
  text: And you shall remember all the way that Yahweh your God has led you these forty years in the wilderness[a], in order to humble you, to test you, to know what was in your heart, whether you would keep his commandments or not.
translation:
  language: zh_hans
  text: 你要记住耶和华你的上帝这四十年来在旷野带领你走过的全程；他这样做，是要使你谦卑，考验你，为要知道[a]你心里所存的：你是否会遵守他的诫命。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“为要显明你心里所存的。”希伯来文直译为“为要知道你心里所存的”，正文保留了这一表达。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזָכַרְתָּ
  choice: 你要记住
  rationale: 在训诲语境中表达命令或劝诫；“你要”自然保留其约的劝勉语气。
- source_word: כָּל הַדֶּרֶךְ
  choice: 走过的全部路程
  rationale: 这里指以色列人在旷野中的整个历程，不只是某一条道路；此译法既贴近原文，又符合现代汉语。
- source_word: הֹלִיכֲךָ
  choice: 领你走过
  rationale: הל字根的使役式在此表示带领前行；“领你走过”自然传达上帝一路引领的意思。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代简体中文圣经读者熟悉的专名形式呈现四字神名，不以头衔替代。
- source_word: אֱלֹהֶיךָ
  choice: 你的上帝
  rationale: 保留第二人称所属关系及其圣约意味。
- source_word: זֶה אַרְבָּעִים שָׁנָה
  choice: 这四十年来
  rationale: 自然表达持续四十年的时间范围，并与“领你走过”协调。
- source_word: בַּמִּדְבָּר
  choice: 在旷野中
  rationale: מִדְבָּר 指人烟稀少、荒凉之地；“旷野”是准确且语境丰富的常用译法。
- source_word: לְמַעַן
  choice: 他这样做，是要
  rationale: 明确表达后续不定式的目的关系，同时使长句在现代汉语中清楚自然。
- source_word: עַנֹּתְךָ
  choice: 使你谦卑
  rationale: ענה 在本段指借困苦使人降卑；“使你谦卑”保留上下文的道德与属灵含义。
- source_word: לְנַסֹּתְךָ
  choice: 考验你
  rationale: נסה 表示试验、验证；“考验”是现代汉语中清楚且庄重的对应词。
- source_word: לָדַעַת
  choice: 好知道
  rationale: 直接保留 ידע“知道”的措辞，不把原文的拟人表达解释成“显明”。
- source_word: אֶת אֲשֶׁר בִּלְבָבְךָ
  choice: 你心里怎样
  rationale: 自然表达“你心里有什么/如何”，其中“心”涵盖思想、意志和内在倾向。
- source_word: הֲתִשְׁמֹר מצותו אִם־לֹא
  choice: 看你是否会遵守他的诫命
  rationale: 疑问结构表达考验所关乎的事项；“是否”准确呈现“还是不”的选择。
theological_decisions:
- issue: “好知道你心里怎样”所含的拟人化神学张力
  choice: 保留“好知道”
  alternative: 好显明你心里怎样
  rationale: 希伯来文直接使用“知道”，翻译不应为化解关于上帝全知的疑问而改写为“显明”。脚注提示一种可能的解释，但正文保留原文张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。用“全部路程”概括旷野四十年的整体经历；分号及“他这样做”帮助读者辨明目的关系。正文中的[a]置于整节末，明确对应关于“好知道”的脚注。
