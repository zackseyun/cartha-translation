id: DEU.8.19
reference: Deuteronomy 8:19
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/הָיָ֗ה אִם שָׁכֹ֤חַ תִּשְׁכַּח֙ אֶת יְהוָ֣ה אֱלֹהֶ֔י/ךָ וְ/הָֽלַכְתָּ֗ אַחֲרֵי֙ אֱלֹהִ֣ים אֲחֵרִ֔ים וַ/עֲבַדְתָּ֖/ם וְ/הִשְׁתַּחֲוִ֣יתָ לָ/הֶ֑ם הַעִדֹ֤תִי בָ/כֶם֙ הַ/יּ֔וֹם כִּ֥י אָבֹ֖ד תֹּאבֵדֽוּ/ן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/019.yaml
  text: And if you indeed forget Yahweh your God and go after other gods and serve them and bow down to them[a], I testify against you today that you will surely perish.
translation:
  language: zh_hans
  text: 如果你真的忘记[a]耶和华——你的上帝，随从别的神，侍奉它们，向它们下拜，我今天郑重地指证你们[b]：你们必定灭亡。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “真的忘记”：希伯来文以“忘记”的同根不定式绝对形与限定动词连用，加强语气。
    reason: 说明原文同根不定式绝对形的强调作用；锚点紧贴受注释的词语。
  - marker: b
    text: 原文此处带有正式见证、指证的语气；本节前半段以单数“你”称呼以色列，到这里和“你们必定灭亡”转为复数。
    reason: 说明“指证”的法律性语气，并保留、解释原文第二人称由单数转为复数的变化。
lexical_decisions:
- source_word: וְהָיָה אִם
  choice: 如果
  rationale: 引出带有严重后果的条件句；现代汉语用“如果”自然承接上文，无须机械译出“事情将是”。
- source_word: שָׁכֹחַ תִּשְׁכַּח
  choice: 真的忘记
  rationale: 不定式绝对形与限定动词连用，强调“忘记”这一行动；“真的”保留强调，又不擅自解释为“完全”。
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: 耶和华你的上帝
  rationale: 直接音译圣名，并保留第二人称单数所属关系所表达的盟约关联。
- source_word: וְהָלַכְתָּ אַחֲרֵי
  choice: 随从
  rationale: 该习语表示跟随、归附；“随从”在现代汉语中自然表达对其他神明的追随与效忠。
- source_word: אֱלֹהִים אֲחֵרִים
  choice: 别的神
  rationale: 直译形容词“别的／其他的”，不加入原文没有明说的“外邦”含义。
- source_word: וַעֲבַדְתָּם
  choice: 侍奉它们
  rationale: 保留 עבד“服事、侍奉”的基本含义，并与下一动词所表达的俯伏敬拜相区别。
- source_word: וְהִשְׁתַּחֲוִיתָ לָהֶם
  choice: 向它们下拜
  rationale: 体现俯身下拜、表示尊崇的具体动作，也保留其宗教敬拜含义。
- source_word: הַעִדֹתִי בָכֶם הַיּוֹם
  choice: 我今天郑重警告你们
  rationale: 该结构在此具有正式作证并警告对方的法律性语气；汉语若直译为“向你们作证”容易误解为替他们作证，因此以“郑重警告”传达其实际语用力量。
- source_word: כִּי אָבֹד תֹּאבֵדוּן
  choice: 你们必定灭亡
  rationale: 不定式绝对形配合未完成式强烈确认结局；“必定灭亡”既表达确定性，也保留动词可指走向毁灭、消亡的结果性。
theological_decisions:
- issue: 圣名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。正文采用现代中文圣经读者最熟悉且庄重的“耶和华”，不以“主”替代，从而保留专名及其盟约语境。
- issue: “侍奉”与“下拜”的区分
  choice: 分别译作“侍奉它们，向它们下拜”
  alternative: 合并或都译作“敬拜它们”
  rationale: 原文连续使用两个不同动词，分别涉及服事与俯伏致敬；保留两者可避免压平经文对偶式的警告，也不额外界定偶像崇拜的具体形式。
translation_notes:
  register: 采用现代、庄重而清楚的标准普通话。条件句前半保留对群体作单数称呼的语感，后半明确译出复数“你们”；以脚注提示这一原文转换。代称“它们”用于“别的神”，避免赋予其真实神性的暗示，同时保持自然汉语。
