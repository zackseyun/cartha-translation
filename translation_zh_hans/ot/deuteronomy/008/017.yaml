base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/017.yaml
  text: and you say in your heart[a], ‘My power and the strength of my hand have gotten me this wealth,’
translation:
  language: zh_hans
  text: 你便在心里说：“我的力量和我手的能力使我获得了这笔财富[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“这富足”。希伯来语 חַיִל 可按语境表示财富、资源、力量或能力。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתָּ
  choice: 你便……说
  rationale: 该形式在警告语境中表达随之可能发生的想法；“便”承接上文，又保留希伯来语连接词的推进作用。
- source_word: בִּלְבָבֶךָ
  choice: 在心里
  rationale: 保留希伯来语“心”的意象，同时在现代汉语中自然表达内心思量或自言自语。
- source_word: כֹּחִי
  choice: 我的力量
  rationale: כֹּחַ表示力量、能力或能耐；“力量”简洁且与下一个短语形成自然搭配。
- source_word: וְעֹצֶם יָדִי
  choice: 和我手的能力
  rationale: 保留“手”的具体意象，并以“能力”表达עֹצֶם在此处所指的强力或本领，避免将其完全抽象化。
- source_word: עָשָׂה לִי
  choice: 为我取得了
  rationale: עָשָׂה字面为“做、造”，但与לִי及财富语境结合时，表示凭自身能力获得或造就；“为我取得了”既自然又保留受益者含义。
- source_word: הַחַיִל הַזֶּה
  choice: 这财富
  rationale: חַיִל语义范围包括财富、资源、实力和能力；申命记第8章的物质丰足语境支持“财富”，指示词译作“这”以对应单数形式。
theological_decisions:
- issue: 盟约警告语境中חַיִל的含义
  choice: 财富
  alternative: 富足；实力
  rationale: 上下文聚焦土地出产、牲畜、金银及财物增多，警告以色列人不可把物质成就归功于自己，因此“财富”最切合；脚注保留较宽的“富足”含义。
- issue: 人的能力与所得之间的自我归因
  choice: 保留说话者把财富归于自身力量的直接表述
  alternative: 意译为“我凭自己的本事致富”
  rationale: 直译式表达保留“力量”和“手”的双重意象，也不提前加入下一节关于上帝赐能力的解释，从而维持经文本身的警告张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“我手的能力”有意保留原文的身体意象；脚注标记置于其实际说明的“财富”之后。
