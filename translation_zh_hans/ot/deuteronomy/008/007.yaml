base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/007.yaml
  text: For Yahweh your God is bringing you into a good land[a], a land of streams of water, springs[c][b], and depths flowing out in the valley and in the hill country.
translation:
  language: zh_hans
  text: 因为雅威——你的神正带你进入一片美地；那里有溪流[a]、泉源和深水[b]，在谷地和山地中涌出[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “溪流”也可译作“水道”“急流”或“季节性河谷”；这个希伯来词的所指随地形和水量而异。
    reason: lexical_alternative
  - marker: b
    text: “深水”也可译作“水的深处”，可能指地下水或深层水源。
    reason: lexical_alternative
  - marker: c
    text: “谷地和山地”也可译作“平原和群山”。这里的两个希伯来词都可泛指一类地貌。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文并引出理由；现代汉语用“因为”能自然保留其解释性连接作用。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来语四字神名的读音译出专名，不以“主”这一称号代替。
- source_word: אֱלֹהֶיךָ
  choice: 你的神
  rationale: 保留第二人称阳性单数后缀及其盟约语境中的直接称呼。
- source_word: מְבִיאֲךָ
  choice: 正带你进入
  rationale: 分词表达正在进行或即将实现的行动；“正带你进入”既保留生动感，也符合现代汉语。
- source_word: אֶל־אֶרֶץ טוֹבָה
  choice: 进入一片美地
  rationale: “进入”与带领的方向相合；“美地”简洁保留土地美好、宜人的评价，不作额外发挥。
- source_word: אֶרֶץ נַחֲלֵי מָיִם
  choice: 那里有溪流
  rationale: נַחַל 可指溪流、急流、水道或季节性河谷；正文采用清楚自然的“溪流”，并以脚注保留其词义范围。
- source_word: עֲיָנֹת
  choice: 泉源
  rationale: 指天然涌水之处；“泉源”在现代汉语中自然且庄重。
- source_word: וּתְהֹמֹת
  choice: 和深处的水
  rationale: 该词可指深水、深渊或地下深处的水；此译法保留水文意象，同时避免断定具体所指。
- source_word: יֹצְאִים
  choice: 涌出
  rationale: 描写水从源头或地下出来；“涌出”符合泉水及深层水源的语境。
- source_word: בַּבִּקְעָה וּבָהָר
  choice: 从谷地和山地
  rationale: בִּקְעָה 可指谷地或平原，הָר 在此可集合性地指山地；正文保留两类地貌的对照，脚注列出可行异译。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。正文以“雅威”音译，保留其作为以色列之神专名的性质，而不以称号“主”替代；“耶和华”是传统汉语形式，但并非此处采用的读音转写。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“一片美地”自然表达 אֶרֶץ טוֹבָה；分号划分总述与土地水源的具体描写。正文不把 תְהֹמֹת 明确限定为地下水，并用脚注保留水文与地貌词汇的真实歧义。
