base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/010.yaml
  text: And you shall eat and be satisfied[a], and you shall bless Yahweh your God for the good land that he has given you.
translation:
  language: zh_hans
  text: 你吃饱了，就要因雅威你的上帝赐给你的美地而称颂他。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “称颂”或译“感谢”或“赞美”。希伯来文直译为“祝福”；用于上帝时，是指怀着感恩说颂扬他的话。
    reason: 说明希伯来语 ברך 以上帝为对象时的圣经惯用表达，并保留其词义范围。
lexical_decisions:
- source_word: וְאָכַלְתָּ וְשָׂבָעְתָּ
  choice: 你吃了，得以饱足
  rationale: 两个带连接词的完成式在此构成结果与劝诫的次序。译作“吃了，得以饱足”既保留先后关系，也自然引出“就要”，并使 שׂבע 的饱足、满足之意不局限于口语化的“吃饱”。
- source_word: וּבֵרַכְתָּ
  choice: 称颂
  rationale: ברך 以上帝为宾语时，指怀着感恩说颂扬上帝的话。“称颂”在现代汉语中自然、庄重，并比单译“感谢”或“赞美”更能保留原词的语义范围；脚注交代其希伯来语字面表达。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来辅音神名 YHWH 的通行中文音译处理，保留经文中的专名，不以“主”这一称号替代。
- source_word: אֱלֹהֶיךָ
  choice: 你的上帝
  rationale: 准确表达带第二人称阳性单数后缀的归属及盟约关系。
- source_word: עַל
  choice: 因
  rationale: 此处引出称颂上帝的缘由；“因……而称颂”符合现代汉语习惯，也保留其因由关系。
- source_word: הָאָרֶץ הַטֹּבָה
  choice: 美地
  rationale: “美地”简洁保留土地的美好性质及其盟约主题，不把“好”限缩为肥沃或宜人等某一方面。
- source_word: אֲשֶׁר נָתַן לָךְ
  choice: 赐给你的
  rationale: 主语由前面的“雅威你的上帝”自然承接；“赐给”体现土地作为上帝恩赐的含义，同时符合现代汉语表达。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。音译“雅威”保留其作为以色列之上帝盟约名字的性质，避免用称号“主”取代专名。
- issue: ברך 以上帝为对象时如何翻译
  choice: 称颂
  alternative: 祝福；感谢；赞美
  rationale: “祝福上帝”虽接近希伯来语字面形式，却容易使现代汉语读者误解为人向上帝赐福。“称颂”保留说上帝为美、向他表达感恩与赞美的核心含义，又不把语义窄化为单纯感谢或赞美。脚注保存字面形式与其他可能译法。
- issue: 动词序列的语气
  choice: 你吃了，得以饱足，就要……
  alternative: 你将吃，并且饱足，并且……；当你吃饱时……
  rationale: 原文的完成式连串在本段劝诫语境中兼有预期结果和责任要求。“就要”自然呈现由领受恩赐到称颂上帝的义务，同时不将全句处理成纯粹预测。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“得以饱足”略带经文语体，但仍属自然表达；“因……而称颂”清楚呈现因由关系。脚注标记紧随“称颂他”，避免误指前面的“饱足”。
