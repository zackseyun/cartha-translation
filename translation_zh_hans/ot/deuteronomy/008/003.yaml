  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַֽ/יְעַנְּ/ךָ֮ וַ/יַּרְעִבֶ/ךָ֒ וַ/יַּֽאֲכִֽלְ/ךָ֤ אֶת הַ/מָּן֙ אֲשֶׁ֣ר לֹא יָדַ֔עְתָּ וְ/לֹ֥א יָדְע֖וּ/ן אֲבֹתֶ֑י/ךָ לְמַ֣עַן הוֹדִֽעֲ/ךָ֗ כִּ֠י לֹ֣א עַל הַ/לֶּ֤חֶם לְ/בַדּ/וֹ֙ יִחְיֶ֣ה הָֽ/אָדָ֔ם כִּ֛י עַל כָּל מוֹצָ֥א פִֽי יְהוָ֖ה יִחְיֶ֥ה הָ/אָדָֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/003.yaml
  text: And he humbled you and let you hunger and fed you the manna[a], which you had not known, nor had your fathers known, so that he might make you know that man does not live by bread alone[b], but man lives by every word that comes from the mouth of Yahweh.
translation:
  language: zh_hans
  text: 他使你谦卑，任你饥饿，又把你和你祖先都不认识的吗哪给你吃，为要使你知道：人活着，不是单靠食物，而是靠耶和华口里所出的一切[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“耶和华口里所出的每一句话。”原文“所出的一切”含义较宽，也可按上下文理解为耶和华所说的话。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְעַנְּךָ
  choice: 使你谦卑
  rationale: ענה的Piel形式可指使人受苦或降卑；本节处于旷野管教与教导的语境中，“使你谦卑”保留其目的性，也不把含义局限为身体痛苦。
- source_word: וַיַּרְעִבֶךָ
  choice: 任你饥饿
  rationale: רעב的Hiphil形式表达使役意义；“任你饥饿”既自然，也保留上帝主动让以色列经历饥饿的含义。
- source_word: וַיַּאֲכִלְךָ אֶת־הַמָּן
  choice: 把……吗哪给你吃
  rationale: אכל的Hiphil形式意为使吃、喂养；此译符合现代汉语表达，并保留供给食物的使役含义。
- source_word: אֲשֶׁר לֹא יָדַעְתָּ וְלֹא יָדְעוּן אֲבֹתֶיךָ
  choice: 你和你祖先都不认识的
  rationale: ידע在这里指未曾接触、不了解这种食物；合并为汉语并列结构，清楚表达双方此前都不认识吗哪。
- source_word: לְמַעַן הוֹדִעֲךָ
  choice: 为要使你知道
  rationale: 保留ידע之Hiphil形式的使役和目的意味，比单译“教导你”更贴近原文。
- source_word: הָאָדָם
  choice: 人
  rationale: 此处אָדָם泛指人类；现代汉语“人”本身没有男性限定，准确传达代表全人类的通则。
- source_word: הַלֶּחֶם
  choice: 食物
  rationale: לֶחֶם可具体指饼，也可泛指食物；本节讨论维持生命所需，译作“食物”在现代汉语中直接表达其语境意义，同时避免将命题误解为仅谈一种食品。
- source_word: כָּל־מוֹצָא פִי יְהוָה
  choice: 耶和华口里所出的一切
  rationale: מוֹצָא字面指“所出来的”；原文未明说“话”，因此采用较宽的表达，以保存它既可指神的言语、也可泛指从神口中所出之事物的语义张力。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的专名形式，明确对应四字神名，而不以普通称号代替。
theological_decisions:
- issue: אָדָם在普遍性生命命题中的指称
  choice: 人
  alternative: 世人／人类
  rationale: “人”在现代汉语中自然地泛指所有人，保留原文单数代表性表达，不造成仅限男性的误解。
- issue: מוֹצָא פִי יְהוָה的范围
  choice: 耶和华口里所出的一切
  alternative: 耶和华口里所出的每一句话
  rationale: מוֹצָא比“话”本身更宽泛。上下文容许把它理解为神的命令或话语，但不宜在正文中默默缩窄原文范围，因此采用形式较贴近且自然可懂的译法，并以脚注说明。
- issue: לֶחֶם的语境意义
  choice: 食物
  alternative: 饼
  rationale: 这里的对比关乎人赖以生存的来源，而不是特指某种烘焙食品；“食物”传达לֶחֶם在此作为基本口粮、饮食的广义用法。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。保留“使你谦卑”“为要使你知道”等原文的因果与教导结构；使用“吗哪”和“耶和华”等中文圣经传统中通行且易懂的名称。
