source:
  edition: WLC
  text: כָּל הַ/מִּצְוָ֗ה אֲשֶׁ֨ר אָנֹכִ֧י מְצַוְּ/ךָ֛ הַ/יּ֖וֹם תִּשְׁמְר֣וּ/ן לַ/עֲשׂ֑וֹת לְמַ֨עַן תִּֽחְי֜וּ/ן וּ/רְבִיתֶ֗ם וּ/בָאתֶם֙ וִֽ/ירִשְׁתֶּ֣ם אֶת הָ/אָ֔רֶץ אֲשֶׁר נִשְׁבַּ֥ע יְהוָ֖ה לַ/אֲבֹתֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/001.yaml
  text: You shall carefully keep every commandment that I am commanding you today[c][b][a], so that you may live and multiply and enter and possess the land that Yahweh swore to your fathers.
translation:
  language: zh_hans
  text: “我今天吩咐你[d]的一切诫命[a]，你们都要谨守遵行，好使你们存活，人数增多，进去得着[b]雅威向你们列祖[c]起誓要赐的那地。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “一切诫命”原文为单数集合形式，也可译作“整套诫命”。
    reason: lexical_alternative
  - marker: b
    text: “得着”也可译作“承受为业”或“占有”。
    reason: lexical_alternative
  - marker: c
    text: “列祖”指以色列的先祖，包括族长们。
    reason: referent_clarification
  - marker: d
    text: 原文在“吩咐你”处用单数，随后改用复数“你们”；单数是把以色列作为一个整体来称呼。
    reason: source_form
lexical_decisions:
- source_word: כָּל הַמִּצְוָה
  choice: 一切诫命
  rationale: 希伯来文用单数集合表达，指所吩咐之诫命的整体；现代汉语用“一切诫命”自然地表达其总括意义，同时以脚注保留“整套诫命”的可能理解。
- source_word: מְצַוְּךָ
  choice: 我今天吩咐你
  rationale: 分词形式带有当前、持续吩咐的意味。后缀为第二人称阳性单数，因此译作“你”，保留摩西把以色列视为一个整体来称呼的形式。
- source_word: תִּשְׁמְרוּן לַעֲשׂוֹת
  choice: 你们都要谨守遵行
  rationale: שׁמר表示留心守住，לַעֲשׂוֹת补明必须付诸实行；“谨守遵行”是自然、庄重的现代汉语，也保留从看守到实行的完整含义。
- source_word: לְמַעַן
  choice: 好使
  rationale: 清楚表达后续存活、增多和得地的目的或结果关系，不把两者过度限定为单一类别。
- source_word: תִּחְיוּן
  choice: 存活
  rationale: 在这段盟约语境中，动词可指活着或继续生存；“存活”比抽象的“得生命”更贴近原文。
- source_word: וּרְבִיתֶם
  choice: 人数增多
  rationale: 这里指群体变得众多；加上“人数”可避免现代汉语把“增多”误解为财富或疆域的增加。
- source_word: וּבָאתֶם
  choice: 进去
  rationale: 直接表达进入前文语境中的应许之地，语义朴素而清楚。
- source_word: וִירִשְׁתֶּם
  choice: 得着
  rationale: ירשׁ可表示承受、占有或取得产业。“得着”兼顾领受和取得土地的含义，不预先排除“承受为业”的色彩。
- source_word: הָאָרֶץ
  choice: 那地
  rationale: 指雅威起誓要赐给列祖的特定土地；“那地”保留申命记中的应许之地语感。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译直接呈现四字神名，而不以“主”这一称号代替。
- source_word: נִשְׁבַּע
  choice: 起誓要赐
  rationale: נשׁבע明确表示起誓；“要赐”是由“那地”及盟约语境补出的汉语关系语，使句子自然，但不削弱誓言的约束力。
- source_word: אֲבֹתֵיכֶם
  choice: 你们列祖
  rationale: 保留原文阳性的亲属称谓，并清楚指向以色列群体的先祖。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名。正文采用较贴近学界常见重构读音 Yahweh 的“雅威”，不以头衔取代其专名。
- issue: כָּל הַמִּצְוָה 的单数集合意义
  choice: 一切诫命
  alternative: 整套诫命
  rationale: “一切诫命”在现代汉语中最自然地传达全部命令；脚注明示希伯来文为单数集合形式，以免把律法整体性完全拆散。
- issue: 第二人称由单数转为复数
  choice: 保留“你”到“你们”的转换
  alternative: 全句统一译作“你们”
  rationale: 原文先以单数称呼以色列，随后以复数发出劝命并说明结果。正文保留这一形式变化，脚注解释其群体性用法，不把可能具有修辞意义的张力抹平。
- issue: 土地动词 ירשׁ 的盟约含义
  choice: 得着
  alternative: 承受为业；占有
  rationale: 该词兼有继承、取得和占有的语义。“得着”保持一定开放性，脚注列出较具体的可能译法，避免单方面强调继承权或军事占领。
translation_notes:
  register: 采用庄重而易懂的现代标准普通话。“谨守遵行”保留申命记盟约劝诫的正式语气；“存活，人数增多，进去得着”维持原文连续动词的推进感。正文刻意保留“你／你们”的数变化，并用脚注帮助普通读者理解。
