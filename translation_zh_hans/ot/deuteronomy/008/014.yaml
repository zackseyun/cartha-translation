base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/014.yaml
  text: then your heart is lifted up[a], and you forget Yahweh your God, who brought you from the land of Egypt, from the house of slaves.
translation:
  language: zh_hans
  text: 你的心就高傲起来，忘记雅威你的上帝——就是把你从埃及地、从奴隶之家[a]领出来的那一位。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或按意译为“为奴之家”或“奴役之所”。希伯来文直译为“奴隶之家”。
    reason: 说明原文具体措辞，并提供不把“家”改作“地”的较自然汉语替代译法。
lexical_decisions:
- source_word: וְרָם לְבָבֶךָ
  choice: 你的心就高傲起来
  rationale: 保留“心升高”的基本意象及其在警告语境中的骄傲含义；“心高傲起来”在现代汉语中自然清楚，也不把“心”所指的内在意志和倾向抽象化。
- source_word: וְשָׁכַחְתָּ
  choice: 忘记
  rationale: 该完成式承接上下文的条件—结果序列，并非单纯叙述过去事件；汉语用“就……忘记”自然表达可能出现的结果，而不强行限定为过去或将来时。
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: 雅威你的上帝
  rationale: “雅威”音译四字神名，保留经文使用的专名；“你的上帝”准确表达第二人称单数所属关系。
- source_word: הַמּוֹצִיאֲךָ
  choice: 正是他把你……领了出来
  rationale: 带冠词的分词以雅威施行出埃及拯救的行动来指明他的身份；“正是他”体现其识别和强调作用，“领了出来”自然传达使人离开某地的含义。
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: 从埃及地
  rationale: 保留希伯来文完整的“埃及之地”表达及出埃及公式的庄重节奏。
- source_word: מִבֵּית עֲבָדִים
  choice: 从奴隶之家
  rationale: 尽量保留 בֵּית“家、房屋”和 עֲבָדִים“奴隶”这一具体复数名词，呈现以色列人在埃及的真实奴隶身份，而不只用抽象的“奴役”。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名，音译为“雅威”可保留其作为以色列之上帝圣约之名的性质，不以称号取代专名。
- issue: מִבֵּית עֲבָדִים 的具体或抽象表达
  choice: 奴隶之家
  alternative: 为奴之家；受奴役之地
  rationale: 原文使用复数具体名词“奴隶”，正文据此保留具体社会身份；脚注列出较自然但更偏解释性的汉语说法，以免掩盖原文表达。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。分号区分“忘记上帝”的警告与随后对上帝身份和拯救行动的说明；“正是他”使带冠词分词的识别功能在汉语中清晰可感。
