  text: וְ/יָדַעְתָּ֖ עִם לְבָבֶ֑/ךָ כִּ֗י כַּ/אֲשֶׁ֨ר יְיַסֵּ֥ר אִישׁ֙ אֶת בְּנ֔/וֹ יְהוָ֥ה אֱלֹהֶ֖י/ךָ מְיַסְּרֶֽ/ךָּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/005.yaml
  text: So know in your heart that[a], just as a man disciplines his son, Yahweh your God disciplines you.
translation:
  language: zh_hans
  text: 所以你要心里明白：人怎样管教自己的儿子，雅威你的上帝也照样管教你。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “管教”也可译作“惩戒”或“纠正”；这个希伯来语动词既可指纠正性的处罚，也可指塑造人的教导。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדַעְתָּ
  choice: 所以你要……明白
  rationale: 该完成式带连接词，承接上文并具有劝勉、推论的语气；“所以你要……明白”在现代汉语中自然地表达这种力量。
- source_word: עִם לְבָבֶךָ
  choice: 心里
  rationale: 这是表示内在认识和确认的惯用语；“心里明白”比直译“与你的心一同知道”自然准确。
- source_word: כִּי
  choice: 冒号所引出的内容
  rationale: 此处引出应当明白的内容；汉语用冒号比硬译为“就是”或“因为”更清楚自然。
- source_word: כַּאֲשֶׁר
  choice: 怎样……也照样
  rationale: 以对应结构明确保留人的管教与上帝管教之间的比较关系。
- source_word: יְיַסֵּר / מְיַסְּרֶךָּ
  choice: 管教
  rationale: 词根 יסר 可涵盖纠正性的惩戒和塑造性的教导；“管教”兼顾二者，并在两处重复使用，以保留原文的词语呼应。
- source_word: אִישׁ
  choice: 人
  rationale: 原文是一般性的“人、男子”，并未直接使用“父亲”；“自己的儿子”已经表明父子关系。
- source_word: בְּנוֹ
  choice: 自己的儿子
  rationale: 准确保留“儿子”的具体所指；“自己的”自然表达第三人称男性单数所属关系。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译呈现四字神名，而不以“主”这一称号替代；“雅威”也比源自另一套传统读法的译名更贴近通常重构的读音 Yahweh。
- source_word: אֱלֹהֶיךָ
  choice: 你的上帝
  rationale: 保留第二人称单数所属形式及其与神名构成的同位性盟约称谓。
theological_decisions:
- issue: 上帝管教的性质
  choice: 管教
  alternative: 惩戒；纠正；训导
  rationale: “管教”既不把该行动限缩为惩罚，也不把其力度淡化为单纯教导，能够保留纠正与塑造并存的含义。
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名，因此正文采用音译而非称号；同时选择较贴近 Yahweh 的现代汉语形式。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“心里明白”保留内在确认的意味；“怎样……也照样”使比较关系清晰。脚注标记置于整句末尾，适用于句中两次出现的“管教”。
