base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/015.yaml
  text: who led you through the great and fearsome wilderness[a], with fiery serpents and scorpions and thirsty ground where there was no water; who brought out water for you from the flinty rock[b],
translation:
  language: zh_hans
  text: 他领你走过那广大而可怕的旷野，那里有火蛇[a]、蝎子和焦旱无水之地[b]；他又为你使水从坚硬如燧石的磐石中流出来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“毒蛇”。希伯来语这一说法传统上译作“火蛇”，可能是指被咬后伤处有灼烧感的蛇。
    reason: lexical_alternative
  - marker: b
    text: “焦旱无水之地”也可译作“干旱之地”或“干渴”。希伯来语原词表示无水之处的焦旱、干渴。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמּוֹלִיכֲךָ
  choice: 他领你走过
  rationale: 使役主动分词在上下文中指耶和华带领以色列走过旷野；用“领你走过”自然表达持续带领并穿越的意思。
- source_word: בַּמִּדְבָּר הַגָּדֹל וְהַנּוֹרָא
  choice: 那广大而可怕的旷野
  rationale: מִדְבָּר指荒野地区，不必限定为沙漠；“广大而可怕”保留两个并列形容词及其令人畏惧的语气。
- source_word: נָחָשׁ שָׂרָף
  choice: 火蛇
  rationale: 保留希伯来语“蛇—燃烧者”的鲜明表达；可能指蛇咬后产生灼烧感，而非字面上燃烧的蛇，因此附注说明另一译法。
- source_word: וְעַקְרָב
  choice: 蝎子
  rationale: 直接对应原词，并按汉语习惯以类称单数表达泛指。
- source_word: וְצִמָּאוֹן אֲשֶׁר אֵין מָיִם
  choice: 无水的干渴之地
  rationale: צִמָּאוֹן可指干渴、焦旱；结合“没有水”的限定，译为具体的“干渴之地”，既保留环境意象，也不把它仅处理为人的口渴感。
- source_word: הַמּוֹצִיא לְךָ מַיִם
  choice: 他又为你使水……流出来
  rationale: 使役主动分词表示使水出来；“使水……流出来”在现代汉语中清楚呈现神使水出自磐石的行动。
- source_word: מִצּוּר הַחַלָּמִישׁ
  choice: 从燧石般坚硬的磐石中
  rationale: צוּר指磐石，חַלָּמִישׁ指燧石或极坚硬的岩石；此译同时保留磐石意象与燧石的坚硬特征。
theological_decisions:
- issue: 旷野危险的性质
  choice: 按以色列旷野行程中的具体危险来翻译
  alternative: 把“火蛇”等解释为象征，或笼统译作各种危险
  rationale: 经文本身列举蛇、蝎子和无水之地等实际危害；译文保留历史叙述的具体意象，不加入经文没有明说的寓意。
- issue: “火蛇”的含义
  choice: 正文保留传统且贴近字面的“火蛇”，脚注说明可能是毒蛇或因咬伤产生灼痛而得名
  alternative: 正文直接译为“毒蛇”
  rationale: שָׂרָף的确切指向存在词义张力；正文保留原文形象，脚注呈现合理解释，避免把不确定性悄然消除。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。“广大而可怕”保留原文的并列力度；“燧石般坚硬的磐石”避免生硬的“燧石磐石”，同时传达岩石异常坚硬。脚注标记均放在其实际解释的词语之后。
