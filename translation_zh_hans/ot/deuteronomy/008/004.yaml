  yaml_path: translation/ot/deuteronomy/008/004.yaml
  text: Your clothing did not wear out on you[a], and your foot did not swell[b], these forty years.
translation:
  language: zh_hans
  text: 这四十年来，你身上的衣服没有穿坏[a]，你的脚也没有肿胀[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你的衣裳没有穿坏。”
    reason: lexical_alternative
  - marker: b
    text: 或译：“你的脚没有肿。”有人认为这里的动词更具体地指脚没有起泡。
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂמְלָתְךָ
  choice: 你身上的衣服
  rationale: שִׂמְלָה可指一件衣裳或泛指衣服。结合מֵעָלֶיךָ译作“你身上的衣服”，既自然，也保留衣服穿在人身上的含义，不强行限定为外袍。
- source_word: בָלְתָה
  choice: 没有穿破
  rationale: בלה在此表示衣物因长期使用而磨损、破旧。“穿破”是现代汉语中描述衣服耗损的自然说法。
- source_word: מֵעָלֶיךָ
  choice: 你身上的
  rationale: 该词组字面为“从你上面”，在本句中指衣服穿在身上期间并未损坏；汉语用“你身上的”表达最顺畅。
- source_word: וְרַגְלְךָ
  choice: 你的脚也
  rationale: 原文为单数“你的脚”。汉语以单数“脚”作类称自然，并以“也”恰当地连接两个否定陈述。
- source_word: בָצֵקָה
  choice: 没有肿
  rationale: בצק在本处通常理解为肿胀。“没有肿”简洁自然，同时不把词义过度具体化为“起泡”。
- source_word: זֶה אַרְבָּעִים שָׁנָה
  choice: 这四十年来
  rationale: 原文以“这”配合四十年的时段。“这四十年来”既保留指示意味，也符合现代汉语对延续时段的表达习惯。
