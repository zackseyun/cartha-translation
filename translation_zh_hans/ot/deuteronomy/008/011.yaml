  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: הִשָּׁ֣מֶר לְ/ךָ֔ פֶּן תִּשְׁכַּ֖ח אֶת יְהוָ֣ה אֱלֹהֶ֑י/ךָ לְ/בִלְתִּ֨י שְׁמֹ֤ר מִצְוֺתָי/ו֙ וּ/מִשְׁפָּטָ֣י/ו וְ/חֻקֹּתָ֔י/ו אֲשֶׁ֛ר אָנֹכִ֥י מְצַוְּ/ךָ֖ הַ/יּֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/011.yaml
  text: Be careful lest you forget Yahweh your God by failing to keep his commandments and his judgments and his statutes[b][a], which I am commanding you today.
translation:
  language: zh_hans
  text: 你要谨慎，免得忘记耶和华[a]你的上帝，不遵守他的诫命、典章和律例，就是我今天吩咐你的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “耶和华”是希伯来文上帝之名יְהוָה（YHWH）的传统中文译名；也可译作“雅威”。
    reason: alternative_reading
lexical_decisions:
- source_word: הִשָּׁמֶר לְךָ
  choice: 你要谨慎
  rationale: 该警告句式直译有“你要为自己谨慎”之意；“你要谨慎”在现代汉语中自然、庄重，也保留命令语气。
- source_word: פֶּן תִּשְׁכַּח
  choice: 免得忘记
  rationale: פֶּן引出应当避免的危险后果；“免得”准确保留其警戒意味。
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: 耶和华你的上帝
  rationale: 以“耶和华”音译四字神名，并按希伯来语保留“你的上帝”这一立约关系称谓。
- source_word: לְבִלְתִּי שְׁמֹר
  choice: 不遵守
  rationale: 该不定式结构可说明“忘记”具体表现为不遵守，也可能与前句形成并列性的否定内容；正文采用简洁自然的“不遵守”，不额外加入因果解释。
- source_word: מִצְוֺתָיו וּמִשְׁפָּטָיו וְחֻקֹּתָיו
  choice: 他的诫命、典章和律例
  rationale: 分别对应申命记常见的三组立约法律术语，采用现代中文圣经语体中清楚而庄重的固定表达。
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: 就是我今天吩咐你的
  rationale: 保留摩西当下吩咐的即时性；“就是”使关系从句在中文中衔接自然。
theological_decisions:
- issue: 四字神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 正文采用现代中文读者最熟悉的专名形式“耶和华”，同时以脚注列出较接近学界常见拟音的“雅威”，不把神名改译为称号。
- issue: “忘记”与“不遵守”的关系
  choice: 保留为紧接的“不遵守”，不明确添加“因为”或“表现为”
  alternative: 因不遵守……而忘记；忘记……，也不遵守……
  rationale: לְבִלְתִּי שְׁמֹר可被理解为忘记上帝的具体表现或相关结果。正文避免过度界定逻辑关系，以保留原文张力。
translation_notes:
  register: 采用现代、庄重、易懂的普通话书面语。“诫命、典章和律例”保留申命记的法律—立约语域；全句使用单数“你”，对应原文对以色列整体所作的第二人称单数劝诫。
