  yaml_path: translation/ot/deuteronomy/025/014.yaml
  text: You shall not have in your house an ephah and an ephah[a], a large and a small.
translation:
  language: zh_hans
  text: 你家里不可有两个伊法[a]量器，一个大，一个小。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “伊法”是古代希伯来人的一种干量单位。
    reason: cultural_note
lexical_decisions:
- source_word: לֹא יִהְיֶה לְךָ
  choice: 你……不可有
  rationale: 希伯来文以否定的未完成式配合表示领有的介词结构，形成法律性的禁令；“你……不可有”既自然，也保留禁止持有之意。
- source_word: בְּבֵיתְךָ
  choice: 家里
  rationale: בַּיִת在此指存放量器的实际住所或房屋；“家里”符合现代汉语表达，又不抽象化为“家庭”。
- source_word: אֵיפָה וְאֵיפָה
  choice: 两种伊法
  rationale: אֵיפָה是古代干量单位。译名“伊法”保留具体单位；“两种”自然传达原文重复“伊法和伊法”所表示的两套不同量器，并与上节的双重砝码相呼应。
- source_word: גְּדוֹלָה וּקְטַנָּה
  choice: 一个大，一个小
  rationale: 两个阴性形容词均修饰“伊法”，指大小不一的两种量器；此译保留原文简洁、对称的法律措辞。
theological_decisions: []
translation_notes:
