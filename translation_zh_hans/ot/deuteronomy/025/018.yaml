review_pass:
  verdict: revise
  source_fidelity: 首句希伯来文 קָרְךָ 的基本义为“在路上遇见你／临到你”，而非“袭击你”。敌对袭击的动作由随后 וַיְזַנֵּב בְּךָ 明确表达；将两者都译为攻击会抹去原文的动作区分，也偏离英文审校轨迹的“met”。其余内容准确传达了从队伍后方针对落伍者下手、以色列人疲惫困乏，以及亚玛力不敬畏上帝。
  naturalness: 原译整体庄重易懂。“从后面攻击你队伍中所有掉队的人”虽可理解，但“你后方所有掉队的人”更直接对应“在你后面”的空间关系，表达也更紧凑。将末句与前一分句用逗号连结，可更清楚呈现同一施事者的连续描述。
  terminology: “掉队的人”“疲倦又困乏”“不敬畏上帝”均合乎现代标准汉语及本段庄重叙事语体。“上帝”对应 אֱלֹהִים 可接受。
  issues:
  - severity: medium
    issue: 将 קָרְךָ 译为“袭击你”
    rationale: 该词在此首先指“遇见／碰上”；后面的 וַיְזַנֵּב 才说明其从后方发动攻击。译作“袭击”使首句预先加入后文才表达的敌对动作，并取消了原文的词义层次。
  revised_text: 他怎样在路上遇见你，从后面攻击你后方所有掉队的人；那时你又疲倦又困乏，他也不敬畏上帝。
