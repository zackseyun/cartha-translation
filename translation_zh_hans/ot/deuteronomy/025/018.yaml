base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/018.yaml
  text: how he met you on the way and attacked all the stragglers behind you, when you were weary and worn out; and he did not fear God.
translation:
  language: zh_hans
  text: 他怎样在路上遇见你，从后面攻击你后方所有掉队的人；那时你又疲倦又困乏，他也不敬畏上帝。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קָרְךָ
  choice: 袭击你
  rationale: 该词在此处不只表示中性的“遇见”，结合亚玛力敌对行动的语境，译作“袭击”更自然，也保留其突然临到之意。
- source_word: וַיְזַנֵּב בְּךָ
  choice: 从后面攻击你队伍中
  rationale: 动词源于“尾部”，在此指从队伍后方下手；译文将这一形象转化为现代汉语可清楚理解的军事动作。
- source_word: הַנֶּחֱשָׁלִים
  choice: 掉队的人
  rationale: 指因软弱、疲惫而落在队伍后面的人；“掉队的人”简洁且贴合上下文。
- source_word: עָיֵף וְיָגֵעַ
  choice: 又疲倦又困乏
  rationale: 用两个近义表达对应希伯来文叠加的身体耗竭状态，同时保持庄重自然。
- source_word: וְלֹא יָרֵא אֱלֹהִים
  choice: 他不敬畏上帝
  rationale: 按希伯来文直译，并明确主语承接亚玛力；“敬畏上帝”保留其道德与神学含义。
theological_decisions:
- issue: 末句“不敬畏上帝”的主语
  choice: 理解为亚玛力
  alternative: 理解为以色列
  rationale: 最近且连贯的施事者是实施袭击的亚玛力；本节是在描述其行为及其对上帝毫无敬畏。
- issue: 亚玛力行为的具体程度
  choice: 译作“攻击”，不增补“杀死”或“击杀”
  alternative: 译作“击杀所有掉队的人”
  rationale: וַיְזַנֵּב 表明从后方袭击或截击，但本词本身未明确陈述所有受袭者均被杀，因此不作过度限定。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“从后面攻击你队伍中所有掉队的人”适度明示队伍关系，使中文顺畅，同时未加入原文没有的伤亡结果。
