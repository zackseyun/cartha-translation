  rationale: 仅将首个动作改为“遇见”，以忠实保留 קָרְךָ 的通常意义及其与后续“从后面攻击”的区别；并微调后方落伍者的语序和标点，使其更贴合原文结构且自然通顺。未增添杀害或伤亡的含义。
