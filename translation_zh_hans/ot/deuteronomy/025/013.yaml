  language: zh_hans
  text: 你的袋里不可有两样砝码：一大一小[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“一块石头和一块石头”，指交易称量时所用的石制砝码。
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא יִהְיֶה לְךָ
  choice: 你……不可有
  rationale: 希伯来语直译为“不可为你有”，在律法禁令中用现代汉语“你不可有”既自然，也保留明确的禁止语气。
- source_word: בְּכִיסְךָ
  choice: 袋里
  rationale: כִּיס指可装钱财或称重器具的袋子、囊袋；“袋里”通俗自然，并符合交易场景。
- source_word: אֶבֶן וָאָבֶן
  choice: 两样的砝码
  rationale: 字面为“一块石头和一块石头”，这里指交易称量所用的石制砝码。译作“两样的砝码”传达两套不同重量标准，同时以脚注保留原文意象。
- source_word: גְּדוֹלָה וּקְטַנָּה
  choice: 一大一小
  rationale: 直接保留原文鲜明的大小对比，并自然修饰“两样的砝码”。
