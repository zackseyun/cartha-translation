  yaml_path: translation/ot/deuteronomy/025/008.yaml
  text: Then the elders of his city shall call him and speak to him[a], and if he stands and says, “I do not desire to take her,”
translation:
  language: zh_hans
  text: 那时，他所在城的长老要召他来，同他谈话；他若仍坚持说：“我不愿意娶她[a]”，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“取她”，这里是指娶她为妻。
    reason: 说明原文的婚姻惯用语，并保留其字面信息。
lexical_decisions:
- source_word: וְקָרְאוּ לוֹ
  choice: 要召他来
  rationale: 在这段法律程序中，该短语表示长老传召当事人；“召他来”既自然，也保留正式的程序意味。
- source_word: זִקְנֵי עִירוֹ
  choice: 他本城的长老
  rationale: “长老”指当地公认的治理者或领袖；“本城”自然表达其所属城镇，而不刻意限定聚落规模。
- source_word: וְדִבְּרוּ אֵלָיו
  choice: 跟他谈话
  rationale: 原文仅说明长老直接同他说话，并未明说是劝告、训诫或审问；译文保留这一开放性。
- source_word: וְעָמַד
  choice: 如果他仍坚持
  rationale: 字面为“而他站立”，在此法律语境中表示当事人在长老与他谈话后仍持定原先立场；“仍坚持”自然传达语境功能。
- source_word: לֹא חָפַצְתִּי
  choice: 我不愿意
  rationale: חפץ可表示喜悦、想要或愿意；这里是正式表明不愿履行娶寡嫂的责任，“不愿意”比“不喜欢”更切合语境，同时不额外推断动机。
- source_word: לְקַחְתָּהּ
  choice: 娶她
  rationale: לקח用于男子与女子的关系时常是“娶为妻”的惯用表达；现代汉语用“娶她”能清楚、自然地表达此处含义，脚注说明其字面形式。
