translation:
  language: zh_hans
  text: 你要砍掉她的手[a]；你的眼不可顾惜[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“她的手掌”。希伯来语 כַּפָּהּ 中的 כַּף 可特指手掌，也可泛指手。
    reason: lexical_alternative
  - marker: b
    text: “你的眼不可顾惜”是希伯来语惯用说法，表示不可因怜悯而宽容或宽赦。
    reason: idiom_clarification
lexical_decisions:
- source_word: וְקַצֹּתָה
  choice: 你要砍掉
  rationale: קצץ表示切断、砍下；“砍掉”直接保留法律命令的具体性和严厉性，不作弱化。
- source_word: אֶת
  choice: 不译
  rationale: 这是希伯来语直接宾语标记，现代汉语没有对应词。
- source_word: כַּפָּהּ
  choice: 她的手
  rationale: כַּף既可特指“手掌”，也可泛指“手”；与“砍掉”连用时，“手”在现代汉语中更自然，同时以脚注保留“手掌”这一词义可能。
- source_word: לֹא
  choice: 不可
  rationale: 在法律禁令中，“不可”自然、庄重，准确表达否定命令。
- source_word: תָחוֹס
  choice: 顾惜
  rationale: חוס可表示怜惜、顾惜或饶恕；“顾惜”能与“眼”构成较贴近原文的表达，并保留怜悯与免除刑罚之间的语义张力。
- source_word: עֵינֶךָ
  choice: 你的眼
  rationale: 原文明确提到“眼”，构成申命记中反复出现的法律惯用语；直译可保留其鲜明意象，避免简化为“你”。
theological_decisions:
- issue: 刑罚条文的具体性与严厉性
  choice: 保留“砍掉她的手”这一直接命令
  alternative: 意译或弱化为较笼统的惩罚表述
  rationale: 原文陈述的是具体的法律刑罚。译文不应因其严厉而加以淡化，也不应添加原文没有说明的解释。
- issue: “眼不可顾惜”的法律惯用语
  choice: 保留“你的眼”这一身体意象
  alternative: 译作“不可怜悯她”或“不可饶恕她”
  rationale: 保留原文意象有助于呈现申命记法律语言的形式；脚注则说明其惯用含义，而不把“怜惜”与“饶恕”之间的语义范围静默限定为一种。
translation_notes:
  register: 采用现代、庄重而简洁的法律语体。“你要”传达对单数听者的命令；“砍掉”保持原文的具体动作，“你的眼不可顾惜”则有意保留希伯来语的身体意象和法律惯用格式。
