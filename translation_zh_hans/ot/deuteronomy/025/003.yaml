base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/003.yaml
  text: He may strike him forty times[a], but no more[b], lest he go on to strike him with many more blows than these and your brother be degraded before your eyes.
translation:
  language: zh_hans
  text: 最多可以打他四十下[a]，不可超过；免得在这数目之外又多打他许多下，使你的弟兄[b]在你眼前受辱。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“四十鞭”或“四十次击打”。原文规定数目为四十，但本节没有说明所用刑具或每一下的具体形式。
    reason: lexical_alternative
  - marker: b
    text: “你的弟兄”在这里指盟约群体中的同胞。律法限制刑罚，使受罚者不致被当作卑贱可鄙的人。
    reason: cultural_note
lexical_decisions:
- source_word: אַרְבָּעִים יַכֶּנּוּ
  choice: 最多可以打他四十下
  rationale: 希伯来文直陈“打他四十”，在本段司法语境中规定体罚的上限；补出“最多”可自然表达许可及限制。“下”只表示击打次数，不限定刑具。
- source_word: לֹא יֹסִיף
  choice: 不可超过
  rationale: יסף本义为“增加、再加”；这里禁止超过前述四十下，译为“不可超过”简洁明确。
- source_word: פֶּן יֹסִיף לְהַכֹּתוֹ
  choice: 免得再多打他
  rationale: פן引出所要避免的后果；יסף加不定式表示继续或增加某项行动。
- source_word: עַל אֵלֶּה מַכָּה רַבָּה
  choice: 许多下
  rationale: 字面结构近于“在这些之外一次重大的／大量的击打”；מכה虽为单数，在此可作集合意义。译文保留超量击打的重点，不把刑具具体化。
- source_word: וְנִקְלָה
  choice: 受辱
  rationale: קלה的Niphal形表达被轻视、受贬抑或失去尊严；“受辱”自然凝练，并保留公开降格的含义。
- source_word: אָחִיךָ
  choice: 你的弟兄
  rationale: 直译亲属称谓，同时保留申命记中盟约群体成员之间的伦理关系；即使受罚者仍被视为弟兄。
- source_word: לְעֵינֶיךָ
  choice: 在你眼前
  rationale: 贴近原文，也自然表达当众、在共同体亲眼所见之下发生的羞辱。
theological_decisions:
- issue: 司法惩罚中受罚者的盟约身份与尊严
  choice: 你的弟兄
  alternative: 你的同胞／你的以色列同胞
  rationale: 保留希伯来文的家庭性称谓及其伦理张力：有罪受罚的人仍是群体中的“弟兄”，不可因过量刑罚而被视为卑贱。
translation_notes:
  register: 采用现代、庄重而易懂的法律语体。“打……下”符合现代汉语计数习惯；“最多”“不可超过”清楚呈现法定上限。“弟兄”有意保留原文阳性亲属称谓及盟约伦理含义。
