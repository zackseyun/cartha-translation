source:
  edition: WLC
  text: וְ/אִם לֹ֤א יַחְפֹּץ֙ הָ/אִ֔ישׁ לָ/קַ֖חַת אֶת יְבִמְתּ֑/וֹ וְ/עָלְתָה֩ יְבִמְתּ֨/וֹ הַ/שַּׁ֜עְרָ/ה אֶל הַ/זְּקֵנִ֗ים וְ/אָֽמְרָה֙ מֵאֵ֨ין יְבָמִ֜/י לְ/הָקִ֨ים לְ/אָחִ֥י/ו שֵׁם֙ בְּ/יִשְׂרָאֵ֔ל לֹ֥א אָבָ֖ה יַבְּמִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/007.yaml
  text: But if the man does not want to take his brother’s widow[a], then his brother’s widow shall go up to the gate, to the elders, and say, ‘My brother-in-law refuses to raise up a name for his brother in Israel[b]; he is not willing to perform the duty of a brother-in-law to me.’
translation:
  language: zh_hans
  text: 但若那人不愿娶他兄弟的遗孀，他兄弟的遗孀就应当到城门口去见长老，说：‘我丈夫的兄弟不肯为他兄弟在以色列中延续名分[a]；他不愿按亡夫兄弟的本分娶我[b]。’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译为“为他兄弟兴起一个名”。这是指使已故兄弟的家系和名分在以色列中得以延续。
    reason: 说明希伯来语习语在本法律语境中的含义。
  - marker: b
    text: 原文在这里使用一个专门动词，指亡夫的兄弟按当时的制度娶遗孀，以承担延续亡者家系的责任。
    reason: 说明现代汉语中没有直接对应词的法律及婚姻制度术语。
lexical_decisions:
- source_word: יַחְפֹּץ
  choice: 愿
  rationale: חפץ在此表示意愿；“若不愿”自然地保留了法律语境中的主观意愿。
- source_word: לָקַחַת
  choice: 娶
  rationale: לקח字面可译为“取”，但在这里以兄弟遗孀为宾语，明确涉及婚娶；现代汉语用“娶”既清楚又符合语境。
- source_word: יְבִמְתּוֹ
  choice: 他兄弟的遗孀
  rationale: 该词在此特指利未婚制度下兄弟所留下的寡妇；“遗孀”准确显示其丈夫已经去世，而“兄弟”不擅自判断长幼。
- source_word: וְעָלְתָה ... הַשַּׁעְרָה אֶל הַזְּקֵנִים
  choice: 就要到城门口去见长老
  rationale: 原文含“上到城门”的方向表达；汉语若直译“上到”较生硬，因此按其司法场景自然表达，同时保留城门与长老两个要素。
- source_word: מֵאֵן
  choice: 不肯
  rationale: 该词表达拒绝；“不肯”适合女子向长老正式申诉时的语气。
- source_word: לְהָקִים ... שֵׁם
  choice: 留名
  rationale: 原文为“兴起／建立名号”的习语，指使死者的名字和家系得以延续；“留名”简洁自然，并以脚注说明其文化含义。
- source_word: לֹא אָבָה
  choice: 不愿
  rationale: אבה表示愿意或同意；译作“不愿”与前面的“不肯”略作区分，也保留原文重复陈述其拒绝的结构。
- source_word: יַבְּמִי
  choice: 对我履行亡夫兄弟的义务
  rationale: 这是由יבם构成的技术性动词，指亡夫的兄弟按当时制度娶遗孀并延续死者家系；正文采用清楚的法律亲属用语，具体制度由脚注补明。
theological_decisions:
- issue: 如何表达兄弟续娶遗孀的制度术语
  choice: 正文使用“他兄弟的遗孀”和“履行亡夫兄弟的义务”等明白的亲属及义务用语
  alternative: 直接采用“利未婚”“转房婚”等专业术语，或字面译作“作我的夫兄弟”
  rationale: 本节是法律条文，重点是亲属责任。正文避免普通读者陌生且可能产生误解的专门术语，同时不把义务缩减为一般照顾；脚注明确说明其涉及婚娶及延续亡者家系。
- issue: שֵׁם在本节中的含义
  choice: 译作“留名”，并在脚注说明包括延续亡者家系及其在以色列中的名分
  alternative: 直接意译为“延续后代”
  rationale: “名”是原文明确使用的核心意象，其意义不只生育后代，也涉及死者的家系和社会名分；保留“名”可避免把含义收窄。
translation_notes:
  register: 采用现代、庄重而易懂的法律叙事语体。“兄弟”保留希伯来语未指明长幼的关系，避免误译为“哥哥”或“弟弟”；“城门口”体现古代城门作为长老审理事务场所的背景。
