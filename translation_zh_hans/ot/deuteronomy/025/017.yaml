base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/017.yaml
  text: Remember what Amalek did to you on the way when you came out from Egypt:[a]
translation:
  language: zh_hans
  text: 你要记住：你们出埃及[a]时，亚玛力在路上怎样对待你。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你们从埃及出来时”。
    reason: lexical_alternative
lexical_decisions:
- source_word: זָכוֹר
  choice: 你要记住
  rationale: זכר的Qal命令式单数，表达直接命令；“要记住”自然、庄重，并保留其郑重的记念意味。
- source_word: אֵת אֲשֶׁר
  choice: 怎样
  rationale: 宾格标记与关系词共同引出所要记住的内容；与“对待你”搭配译作“怎样”，符合现代汉语习惯。
- source_word: עָשָׂה לְךָ
  choice: 怎样对待你
  rationale: עשה加介词ל及第二人称单数后缀，在本语境中指亚玛力向以色列采取的行动；“对待你”自然表达行动所指向的对象，同时不在本节内提前详述其敌对行为。
- source_word: עֲמָלֵק
  choice: 亚玛力
  rationale: 采用现代中文圣经传统中通行的人名音译。
- source_word: בַּדֶּרֶךְ
  choice: 在路上
  rationale: דרך前加ב，指旅程途中；“在路上”简洁自然。
- source_word: בְּצֵאתְכֶם
  choice: 你们出……时
  rationale: יצא的不定词附属形加ב及第二人称复数后缀，表示时间背景；“你们出……时”保留复数指称，并清楚表达时间关系。
- source_word: מִמִּצְרַיִם
  choice: 出埃及
  rationale: מן表示来源；现代汉语通常说“出埃及”，既简洁，也与יצא的“出来”之义自然结合。
theological_decisions:
- issue: 第二人称数的转换
  choice: 保留“你”与“你们”的转换
  alternative: 全部统一译为“你们”
  rationale: 原文命令זָכוֹר和לְךָ均为单数，而בְּצֵאתְכֶם为复数。译文保留这一转换，使以色列既作为一个整体受命，也作为群体被回顾，不替原文消除其语法张力。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“你要记住”保留希伯来文单数命令，后文“你们出埃及时”保留复数形式；用冒号清楚引出记念的内容。
