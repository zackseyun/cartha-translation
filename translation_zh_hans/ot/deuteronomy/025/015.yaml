revisions:
- from: 你要有足量公正的砝码，也要有足量公正的伊法[a]，好使你在耶和华你的上帝赐给你的土地上长久生活。
  to: 你要有足量而公正的砝码，也要有足量而公正的伊法[a]量器，使你的日子在雅威你上帝赐给你的土地上得以长久。
  rationale: 修订统一了四字神名的项目规定译法，并以“伊法量器”澄清古代计量术语在本句中的实际所指。“足量而公正的”更符合现代汉语搭配；“使你的日子……得以长久”保留原文的目的关系和“日子延长”表达，未将其强化为无条件保证。
