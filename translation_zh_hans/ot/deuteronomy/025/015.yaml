  source_fidelity: 译文总体准确地保留了两项并列的商业计量要求、其目的从句，以及“土地”与上帝赐地的关系。但“耶和华”没有遵循本项目对 יְהוָה 一律译为 Yahweh 的审校轨迹；中文宜相应作“雅威”。此外，“足量公正的伊法”容易把伊法这一单位本身说成具有道德属性；原文在此实际指足额、公正的伊法量器/量度。
  naturalness: “足量公正的”缺少连接成分，略显生硬；改为“足量而公正的”更合乎现代书面汉语。“使你的日子得以长久”既自然，也较贴近希伯来文“你的日子延长”的表达。
  terminology: “砝码”准确反映 אֶבֶן 在贸易语境中的所指。“伊法”可保留音译并以脚注说明。四字神名应统一为“雅威”，以对应项目规定的 Yahweh，而不使用传统译名“耶和华”。
