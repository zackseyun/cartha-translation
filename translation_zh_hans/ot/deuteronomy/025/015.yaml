base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/015.yaml
  text: You shall have a full and just weight; you shall have a full and just ephah[a], so that your days may be long on the land that Yahweh your God is giving you.
translation:
  language: zh_hans
  text: 你要有足量而公正的砝码，也要有足量而公正的伊法[a]量器，使你的日子在雅威你上帝赐给你的土地上得以长久。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “伊法”是古代的干量单位；这里指伊法量器。
    reason: ancient_measure
lexical_decisions:
- source_word: אֶבֶן
  choice: 砝码
  rationale: 字面义为“石头”，但在商业语境中指用作衡量标准的石制砝码；“砝码”准确传达其实际用途。
- source_word: שְׁלֵמָה וָצֶדֶק
  choice: 足量公正的
  rationale: שְׁלֵמָה 表示完整、不短缺，צֶדֶק 表示合乎公正；合译既表达计量充足，也保留道德层面的公平要求。
- source_word: יִהְיֶה לָּךְ
  choice: 你要有
  rationale: 希伯来文直译为“要归你所有”，在律法语境中具有命令效力；“你要有”自然明确。
- source_word: אֵיפָה
  choice: 伊法
  rationale: 指古代特定的干量单位，现代汉语没有精确简短的对应单位，因此采用音译并加脚注说明。
- source_word: לְמַעַן
  choice: 好使
  rationale: 保留目的或结果关系，并符合庄重而自然的现代汉语表达。
- source_word: יַאֲרִיכוּ יָמֶיךָ
  choice: 长久生活
  rationale: 希伯来语字面为“你的日子得以长久”；此处用自然汉语表达长寿之意，同时不增加原文未明说的内容。
- source_word: עַל הָאֲדָמָה
  choice: 在……土地上
  rationale: 在申命记语境中指上帝赐予以色列的土地；此译保留 עַל 的空间意象。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文中广为人知的专名形式来呈现四字神名，而不以头衔替代。
- source_word: נֹתֵן לָךְ
  choice: 赐给你的
  rationale: 分词表达正在进行、临近实现或具有持续特征的赐予；汉语定语结构自然保留这一赐地陈述。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用上帝的专名。中文正文保留专名而不改作“主”；“耶和华”在现代中文读者中辨识度高，“雅威”则更接近部分学界的拟音。
- issue: 顺服与长寿之关系
  choice: 好使……长久生活
  alternative: 这样……就必长久生活
  rationale: לְמַעַן 与未完成式可表达目的及预期结果；采用“好使”保留这种关系，而不把句子强化为机械、无条件的保证。
translation_notes:
  register: 采用庄重、清晰的现代标准汉语。“足量公正”呼应本段禁止大小不一的砝码和量器；句式尽量保留原文两项并列要求及其后的目的从句。
