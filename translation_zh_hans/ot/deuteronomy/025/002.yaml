base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/002.yaml
  text: then[a], if the wicked man deserves to be beaten, the judge shall make him lie down and have him beaten before him, according to his wickedness, by number.
translation:
  language: zh_hans
  text: 如果那恶人该受责打，审判官就要让他躺下，在自己面前按他罪行的轻重，照数[a]责打他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“按数目责打他”；意思是责打的次数要按罪行轻重计算。
    reason: 说明 בְּמִסְפָּר 的简练表达，以及责打次数须按罪责比例计数。
lexical_decisions:
- source_word: בִּן הַכּוֹת
  choice: 该受责打
  rationale: 这是一个希伯来语习语，字面为“责打之子”，在司法语境中表示应受或当受肉体刑罚。“该受责打”自然传达其法律含义。
- source_word: הָרָשָׁע
  choice: 那恶人
  rationale: 该词在此指审判中被判有罪的一方，同时保留道德与法律层面的“恶”之含义；用“那恶人”也承接上一节的司法语境。
- source_word: וְהִפִּילוֹ
  choice: 让他伏下
  rationale: נפל 的使役式在此表示使受罚者倒下或伏下，以接受责打；“让他伏下”简洁而符合程序性场景。
- source_word: הַשֹּׁפֵט
  choice: 审判官
  rationale: 指负责裁断并监督执行刑罚的司法官员；“审判官”较“法官”更符合经文语体，同时仍为现代读者所理解。
- source_word: וְהִכָּהוּ
  choice: 责打他
  rationale: 动词表示击打或殴打；在司法刑罚语境中，“责打”既保留肉体击打之意，也表明这是依法执行的惩罚，不额外断定由审判官亲手还是命人施行。
- source_word: לְפָנָיו
  choice: 在自己面前
  rationale: 直译为“在他面前”，所指最自然地是审判官，强调刑罚在其当面监督下执行；“自己”消除中文代词指向不明。
- source_word: כְּדֵי רִשְׁעָתוֹ
  choice: 按他罪行的轻重
  rationale: 该短语表达刑罚与罪责相称。“按他罪行的轻重”在现代汉语中自然呈现这种比例关系，同时保留司法与道德含义。
- source_word: בְּמִסְפָּר
  choice: 照数
  rationale: 原文简练，表示责打的次数须计算并限定。“照数”贴近原文，也与下一节规定上限的内容衔接。
theological_decisions:
- issue: 执行责打者是否必为审判官本人
  choice: 使用“审判官就要……责打他”的连续句式，不明说亲手执行或命人执行
  alternative: 译为“审判官要叫人责打他”
  rationale: 希伯来语语法以审判官为动词主语，但司法语境可包含授权执行。译文不加入原文未明确说明的执行人员，以保留这一开放性。
translation_notes:
  register: 采用现代、庄重而易懂的司法用语。“责打”比“鞭打”范围更宽，避免在原文未明说器具时擅自限定；“伏下”比生硬的“使他躺下”更符合受刑场景。脚注标记置于其所解释的“照数责打”之后。
