  text: וְ/נִגְּשָׁ֨ה יְבִמְתּ֣/וֹ אֵלָי/ו֮ לְ/עֵינֵ֣י הַ/זְּקֵנִים֒ וְ/חָלְצָ֤ה נַעֲל/וֹ֙ מֵ/עַ֣ל רַגְל֔/וֹ וְ/יָרְקָ֖ה בְּ/פָנָ֑י/ו וְ/עָֽנְתָה֙ וְ/אָ֣מְרָ֔ה כָּ֚כָה יֵעָשֶׂ֣ה לָ/אִ֔ישׁ אֲשֶׁ֥ר לֹא יִבְנֶ֖ה אֶת בֵּ֥ית אָחִֽי/ו־־
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/009.yaml
  text: then his brother’s widow shall come near to him in the sight of the elders[a], remove his sandal from on his foot, spit in his face, and answer and say[b], ‘This is what shall be done to the man who will not build up his brother’s house.’
translation:
  language: zh_hans
  text: 于是，他兄弟的遗孀要当着长老们的面走到他跟前，脱下他脚上的鞋，向他脸上吐唾沫[a]，并回应说：“不肯为兄弟建立家室[b]的人，必受这样的对待。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在他面前吐唾沫。”有些解经者认为，希伯来文是指在那男子面前吐唾沫，而不是直接吐在他脸上。
    reason: lexical_alternative
  - marker: b
    text: “为兄弟建立家室”是指通过迎娶已故兄弟的遗孀，延续该兄弟的家系和家户。
    reason: cultural_note
lexical_decisions:
- source_word: יְבִמְתּוֹ
  choice: 他兄弟的遗孀
  rationale: 该词在此特指死者兄弟的妻子；译为“他兄弟的遗孀”比泛称“嫂子”或“弟媳”更准确，也不预设兄弟之间的长幼关系。
- source_word: לְעֵינֵי הַזְּקֵנִים
  choice: 当着长老们的面
  rationale: 保留原文“在长老眼前”的公开见证意味，同时符合现代汉语表达。
- source_word: וְחָלְצָה נַעֲלוֹ מֵעַל רַגְלוֹ
  choice: 脱下他脚上的鞋
  rationale: חָלַץ在这里指脱去鞋履；原文“鞋”为单数，汉语无需另加“一只”也可自然表达单数动作。
- source_word: וְיָרְקָה בְּפָנָיו
  choice: 向他脸上吐唾沫
  rationale: 按介词短语的直接含义，表达针对本人脸面的羞辱行为；另一个传统理解“在他面前吐唾沫”收入脚注，以保留真实的释义分歧。
- source_word: וְעָנְתָה וְאָמְרָה
  choice: 并回应说
  rationale: 保留原文“回应并说”的正式法律叙述语气；“回应说”在现代汉语中比机械直译“回答并说”自然。
- source_word: כָּכָה יֵעָשֶׂה לָאִישׁ
  choice: 这样的人，必受这样的对待
  rationale: 将希伯来语被动宣告句自然转为汉语，同时保留“这样处置此人”的正式和公开性质。
- source_word: לֹא יִבְנֶה אֶת בֵּית אָחִיו
  choice: 不肯为兄弟建立家室
  rationale: 保留“建立……家”的原文比喻；在本法例中，它指借兄弟婚延续死者的家系与家户。“不肯”也呼应前文该男子明确拒绝履责的语境。
theological_decisions:
- issue: בְּפָנָיו所描述的吐唾沫动作是否直接朝向男子的脸
  choice: 向他脸上吐唾沫
  alternative: 在他面前吐唾沫
  rationale: 正文采用该介词短语在此处较直接的含义，不淡化羞辱仪式；同时以脚注保留另一种有传统依据的理解，避免掩盖词义与句法上的争议。
translation_notes:
  register: 采用现代、庄重而易懂的法律叙事语体。“长老”“遗孀”“建立家室”等用语兼顾古代制度背景与当代可读性；脚注标记均置于其实际解释的词句之后。
