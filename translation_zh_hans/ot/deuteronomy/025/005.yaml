  text: כִּֽי יֵשְׁב֨וּ אַחִ֜ים יַחְדָּ֗ו וּ/מֵ֨ת אַחַ֤ד מֵ/הֶם֙ וּ/בֵ֣ן אֵֽין ל֔/וֹ לֹֽא תִהְיֶ֧ה אֵֽשֶׁת הַ/מֵּ֛ת הַ/ח֖וּצָ/ה לְ/אִ֣ישׁ זָ֑ר יְבָמָ/הּ֙ יָבֹ֣א עָלֶ֔י/הָ וּ/לְקָחָ֥/הּ ל֛/וֹ לְ/אִשָּׁ֖ה וְ/יִבְּמָֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/005.yaml
  text: If brothers dwell together[a], and one of them dies and has no son, the wife of the dead man shall not be married outside the family to a stranger[d][c][b]. Her husband's brother shall go in to her and take her as his wife and perform the duty of a brother-in-law to her.
translation:
  language: zh_hans
  text: “兄弟同住，其中一人死了，没有儿子，死者的妻子不可外嫁给外人。[a]她丈夫的兄弟要与她同房，娶她为妻，履行夫兄弟的义务。[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “外人”指不承担这项亲属义务的人，不一定是异族人；原文直译为“死者的妻子不可在外归给外人”。
    reason: lexical_alternative
  - marker: b
    text: 这里说的是后来通常称为夫兄弟婚的制度：亡夫的兄弟娶其遗孀，并履行相应的亲属义务。
    reason: cultural_note
lexical_decisions:
- source_word: אַחִים יַחְדָּו
  choice: 兄弟同住
  rationale: אַחִים通常指男性兄弟；יַחְדָּו表示共同居住或紧密的家庭生活。“兄弟同住”简洁保留了这项法律的前提，没有擅自限定为同一栋房屋。
- source_word: וּבֵן אֵין לוֹ
  choice: 没有儿子
  rationale: 原文明确使用בֵּן“儿子”，而非泛指“孩子”，因此正文保留其较窄的字面表达，不替读者解决其法律适用范围。
- source_word: אֵשֶׁת הַמֵּת
  choice: 死者的妻子
  rationale: 贴近希伯来语“死者之妻”的结构；虽可自然理解为寡妇，但原文没有使用专指“寡妇”的词。
- source_word: הַחוּצָה לְאִישׁ זָר
  choice: 嫁到外面，给一个外人
  rationale: “外面”保留原文的空间—社会对照；זָר在此指这项亲属义务之外的人，不必然指异族或外国人。“嫁”在汉语中自然表达此法律语境下归属另一男子的意思。
- source_word: יְבָמָהּ
  choice: 她丈夫的兄弟
  rationale: 该词特指亡夫的兄弟。如此翻译比“兄弟姻亲”明确，也避免现代汉语“姐夫、妹夫、内兄”等多种姻亲称谓造成歧义。
- source_word: יָבֹא עָלֶיהָ
  choice: 与她同房
  rationale: 这是希伯来语表示性结合的委婉语。“与她同房”在现代中文圣经语体中庄重、清楚，又不过分露骨。
- source_word: וּלְקָחָהּ לוֹ לְאִשָּׁה
  choice: 娶她为妻
  rationale: 自然而准确地表达字面上的“把她取来归自己为妻”，避免生硬照搬希伯来语结构。
- source_word: וְיִבְּמָהּ
  choice: 向她尽夫兄弟的本分
  rationale: 该专门动词指履行亡夫兄弟在此制度中的婚姻义务。“尽夫兄弟的本分”保留法律义务色彩，同时避免在正文使用陌生的技术术语。
theological_decisions:
- issue: “没有儿子”的适用范围
  choice: 正文保留“没有儿子”
  alternative: 译作“没有孩子”
  rationale: 希伯来文明确说“儿子”。采用较宽的“孩子”会在翻译中预先裁定这项法律是否也适用于留下女儿的情形，因此保留原文张力。
- issue: 夫兄弟婚制度的术语表达
  choice: 使用关系和义务用语“她丈夫的兄弟……尽夫兄弟的本分”
  alternative: 在正文采用“利未婚”“转房婚”等技术称谓
  rationale: 原文使用专门亲属名词和动词，却没有后世汉语制度名称。正文以普通读者能懂的方式表达，并在脚注说明制度背景，避免引入可能带特定学术或文化联想的术语。
- issue: “到外面”所指的社会边界
  choice: 保留“嫁到外面，给一个外人”
  alternative: 明确译成“嫁到家族以外”
  rationale: 上下文显然涉及亲属义务以内与以外的对照，但原文只明说“外面”和“外人”。正文不把边界具体限定为家庭、宗族或支派，以保存原文一定程度的含混。
translation_notes:
  register: 采用现代、庄重而易懂的法律叙述语体。“同住”“同房”“娶她为妻”“尽……本分”均为自然现代汉语，同时保留原文的亲属关系和义务色彩。脚注标记均置于正文相关位置。
