base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/011.yaml
  text: If men are fighting together[a], a man and his brother, and the wife of one comes near to rescue her husband from the hand of the one striking him, and she reaches out her hand and seizes his genitals[d][c][b],
translation:
  language: zh_hans
  text: 如果两个男人互相争斗，就是一人与他的弟兄争斗[a]，其中一人的妻子上前，要从那击打她丈夫的人手中救出丈夫，便伸手抓住那人的下体[b]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弟兄”在这里不一定指亲生兄弟，也可指同胞或同族的人。
    reason: cultural_note
  - marker: b
    text: 原文用委婉的说法指男性的私处。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי יִנָּצוּ אֲנָשִׁים יַחְדָּו
  choice: 如果两个男人互相争斗
  rationale: כִּי在个案律例中引出假设情形，译作“如果”；יִנָּצוּ表示身体上的争斗；יַחְדָּו在此表达彼此交战。
- source_word: אִישׁ וְאָחִיו
  choice: 就是一人与他的弟兄争斗
  rationale: 保留“弟兄”的原文意象；此法律语境中的“弟兄”未必指亲生兄弟，也可指同胞或同族之人。补出“争斗”使汉语句法清楚。
- source_word: וְקָרְבָה אֵשֶׁת הָאֶחָד
  choice: 其中一人的妻子上前
  rationale: “其中一人”明确הָאֶחָד指争斗双方之一；“上前”自然表达קָרְבָה的靠近动作。
- source_word: לְהַצִּיל אֶת אִישָׁהּ
  choice: 要……救出丈夫
  rationale: הַצִּיל指从危险或控制中搭救；אִישָׁהּ在婚姻语境中自然译为“她丈夫”，后文简作“丈夫”避免累赘。
- source_word: מִיַּד מַכֵּהוּ
  choice: 从那击打她丈夫的人手中
  rationale: 保留“从……手中”的希伯来语具体意象，并明确מַכֵּהוּ是正在击打其丈夫的人。
- source_word: וְשָׁלְחָה יָדָהּ וְהֶחֱזִיקָה
  choice: 便伸手抓住
  rationale: “伸手”自然对应伸出她的手这一惯用表达；“抓住”传达הֶחֱזִיקָה用手牢牢拿住的动作。
- source_word: בִּמְבֻשָׁיו
  choice: 那人的下体
  rationale: 该词是指男性私处的委婉表达；“下体”在现代汉语中庄重、清楚，同时保留委婉性。
