  text: וְ/הָיָ֗ה הַ/בְּכוֹר֙ אֲשֶׁ֣ר תֵּלֵ֔ד יָק֕וּם עַל שֵׁ֥ם אָחִ֖י/ו הַ/מֵּ֑ת וְ/לֹֽא יִמָּחֶ֥ה שְׁמ֖/וֹ מִ/יִּשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/006.yaml
  text: And it shall be that the firstborn whom she bears shall rise up in the name of his dead brother[a], so that his name may not be blotted out from Israel.
translation:
  language: zh_hans
  text: 她所生的长子要承继那已故兄弟的名[a]，免得他的名从以色列中被涂抹。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“要立在他已故兄弟的名上。”这是法律—家族语境中的习语，指延续已故者的名及家系，并不一定是采用其个人名字。
    reason: 说明“立在……的名上”的字面形式和习语含义，保留其法律—家族背景，避免将其限缩为取用死者的个人名字。
lexical_decisions:
- source_word: הַבְּכוֹר
  choice: 长子
  rationale: 该词在这里指头生的男性后代；“长子”既自然，也保留律法和家族语境中的身份意义。
- source_word: תֵּלֵד
  choice: 她所生的
  rationale: 阴性单数动词以寡妇为主语；此译明确保留母亲这一主语，又符合现代汉语表达。
- source_word: יָקוּם עַל שֵׁם
  choice: 承继……的名分
  rationale: 该法律性表达指延续死者的名、家系及其在以色列中的地位，并非仅指取同一个人名；“承继……的名分”自然传达这种延续关系。
- source_word: אָחִיו הַמֵּת
  choice: 已故兄弟
  rationale: 直译为“他死去的兄弟”；“已故兄弟”庄重、简洁，并避免现代汉语中“死兄弟”的歧义或生硬感。
- source_word: יִמָּחֶה
  choice: 被涂抹
  rationale: 保留 מחה 的被动态和“抹去、涂去”的意象，也符合圣经中名字或记念被除去的表达。
- source_word: מִיִּשְׂרָאֵל
  choice: 从以色列中
  rationale: 介词 מן 表示从群体中被除去；“从以色列中”准确指向以色列共同体。
theological_decisions:
- issue: “יָקוּם עַל שֵׁם אָחִיו הַמֵּת”在娶寡嫂律例中的含义
  choice: 译作“承继已故兄弟的名分”，表达孩子延续死者的名、家系与群体地位。
  alternative: 译作“以已故兄弟的名字立起来”，或理解为孩子须直接取死者的个人名字。
  rationale: 希伯来语在此法律语境中的重点是保存死者在以色列中的家系和名号。正文采用可懂而不过度展开的表达，脚注保留原文较为具体且有张力的措辞。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“承继……的名分”传达律法语境中的家系延续；“涂抹”保留原文意象。
