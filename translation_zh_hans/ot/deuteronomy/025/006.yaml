- from: 她所生的长子要承继已故兄弟的名分[a]，免得他的名从以色列中被涂抹。
  to: 她所生的长子要承继那已故兄弟的名[a]，免得他的名从以色列中被涂抹。
  rationale: 以“承继……的名”取代“承继……的名分”，更准确对应 שֵׁם，同时仍可由脚注交代该习语所涉及的家系延续。加入“那”改善中文指代的即时可读性，不改变原文在上下文中确定该已故兄弟身份的表达方式。
