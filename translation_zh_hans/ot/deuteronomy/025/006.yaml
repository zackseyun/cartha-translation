    rationale: שֵׁם 的字面核心是“名／名号”；“名分”增加了汉语中身份、地位的含义，虽与语境有关，却不够贴切。
  - severity: low
    issue: “已故兄弟”的指代可能暂时歧义
    rationale: 紧随“她所生的长子”后，中文读者可能先按邻近原则理解为孩子的兄弟。加“那”可更清楚地回指上下文所述已死的兄弟，而不作不必要的解释性补足。
  - severity: low
    issue: 脚注的解释略有过度展开
    rationale: “家系、名号和地位”可作为该法律习语的背景性说明，但原文并未逐项明说；宜以“延续其名及家系”作较克制的解释。
  revised_text: 她所生的长子要承继那已故兄弟的名[a]，免得他的名从以色列中被涂抹。
