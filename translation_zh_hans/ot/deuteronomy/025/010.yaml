  text: And his name shall be called in Israel[a], ‘The house of him whose sandal was removed.’
translation:
  language: zh_hans
  text: 在以色列中，他的名要被称为“鞋被脱去之人的家”[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或更直译：“被脱下的鞋之家。”希伯来文把这一仪式性的羞辱称号压缩成一个简短的表达。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִקְרָא
  choice: 要称为
  rationale: 该词是קרא的尼法勒式，在命名公式中表被动；“要称为”既保留法律语体，也符合现代汉语表达。
- source_word: שְׁמוֹ
  choice: 他的名
  rationale: 保留原文第三人称阳性单数后缀以及公开称号、名声的意味。
- source_word: בְּיִשְׂרָאֵל
  choice: 在以色列中
  rationale: 介词ב表示这一称号流传和使用的社会范围；“在以色列中”准确传达该范围。
- source_word: בֵּית
  choice: 之家
  rationale: 此处不只指房屋，也可指家室、家族；放在称号末尾的“之家”简洁庄重，并保留家族性羞辱称号的性质。
- source_word: חֲלוּץ הַנָּעַל
  choice: 被脱鞋者
  rationale: חֲלוּץ为被动分词，在本段仪式语境中指鞋被脱去的人；“被脱鞋者”避免误解为他自己脱鞋，同时保留原文紧缩的称号形式。
- source_word: הַנָּעַל
  choice: 鞋
  rationale: נַעַל指脚上穿的鞋类；现代汉语“鞋”自然清楚，且本节重点在仪式动作，并不要求限定具体鞋型。
