    rationale: זֵכֶר的核心义为记忆、记念、纪念/留念；本节的“名号”是可能的解释性转喻，不能作为不加说明的直接词汇替代。英文审校轨迹也只给出“memory”作为替代。
  - severity: low
    issue: 条件从句中土地短语的位置略易造成修饰关系停顿。
    rationale: 原译并无实质误译，但改为先述“摆脱……得享安宁”，再以“在……土地上”引出主命令，更符合汉语句法，也保留原文土地短语与命令的关联。
  revised_text: 当雅威你的上帝使你摆脱四围的一切仇敌、得享安宁时，在雅威你的上帝赐给你作产业、让你占有的土地上，你要把亚玛力的记忆[a]从天底下抹去。不可忘记。
