revisions:
- from: 当雅威你的上帝使你在他赐给你作产业、让你占有的土地上，摆脱四周所有仇敌，得享安宁时，你要把对亚玛力的记忆[a]从天下抹去。不可忘记。
  to: 当雅威你的上帝使你摆脱四围的一切仇敌、得享安宁时，在雅威你的上帝赐给你作产业、让你占有的土地上，你要把亚玛力的记忆[a]从天底下抹去。不可忘记。
  rationale: 修订仅校正脚注的词汇边界，并微调语序与“天底下”的表达以提升现代汉语的清晰度和贴近原文意象；未改变经文的命令性、历史指涉或“抹去记忆”与“不可忘记”之间的刻意张力。
  reviewer_model: gpt-5.6-terra
