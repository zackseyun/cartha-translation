  text: וְ/הָיָ֡ה בְּ/הָנִ֣יחַ יְהוָ֣ה אֱלֹהֶ֣י/ךָ לְ֠/ךָ מִ/כָּל אֹ֨יְבֶ֜י/ךָ מִ/סָּבִ֗יב בָּ/אָ֨רֶץ֙ אֲשֶׁ֣ר יְהוָֽה אֱ֠לֹהֶי/ךָ נֹתֵ֨ן לְ/ךָ֤ נַחֲלָה֙ לְ/רִשְׁתָּ֔/הּ תִּמְחֶה֙ אֶת זֵ֣כֶר עֲמָלֵ֔ק מִ/תַּ֖חַת הַ/שָּׁמָ֑יִם לֹ֖א תִּשְׁכָּֽח׀־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/019.yaml
  text: And when Yahweh your God gives you rest from all your enemies around you[a], in the land that Yahweh your God is giving you as an inheritance to possess, you shall blot out the remembrance of Amalek from under heaven. Do not forget.
translation:
  language: zh_hans
  text: 当雅威你的上帝使你摆脱四围的一切仇敌、得享安宁时，在雅威你的上帝赐给你作产业、让你占有的土地上，你要把亚玛力的记忆[a]从天底下抹去。不可忘记。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “记忆”也可译作“记念”或“纪念”。
    reason: 希伯来词 זֵכֶר 指记忆、记念或纪念；此处保留其范围，不将其直接限定为“名号”或其他解释性含义。
lexical_decisions:
- source_word: וְהָיָה בְּהָנִיחַ
  choice: 当……使你……得享安宁时
  rationale: 以自然的汉语时间从句表达未来情境，并保留使役含义：是雅威使以色列摆脱仇敌而得安宁。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文四字神名音译，保留经文中的上帝之名，不以称号替代。
- source_word: מִכָּל אֹיְבֶיךָ מִסָּבִיב
  choice: 摆脱四周所有仇敌
  rationale: 同时保留“所有”的总括范围和“四周”的空间含义；与“使你……得享安宁”连用，符合现代汉语。
- source_word: נַחֲלָה לְרִשְׁתָּהּ
  choice: 作产业、让你占有
  rationale: “产业”保留盟约之地作为承受所得之业的含义，“占有”则明确表达 ירשׁ 在此指取得并持有这地。
- source_word: תִּמְחֶה
  choice: 抹去
  rationale: 保留 מחה 擦除、除去的形象和命令的庄严力度。
- source_word: זֵכֶר
  choice: 记忆
  rationale: 该词可指记忆、纪念或留名；正文用普通读者易懂的“记忆”，不把含义收窄为单纯的族名或实体余民。
- source_word: מִתַּחַת הַשָּׁמָיִם
  choice: 从天下
  rationale: 保留希伯来语“从天之下”的传统空间意象和全面范围，同时使用自然凝练的汉语。
- source_word: לֹא תִּשְׁכָּח
  choice: 不可忘记
  rationale: 保留原文简短、直接且带命令性的结句，并维持“抹去记忆”与“你不可忘记”之间刻意形成的张力。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用以色列上帝的专名；音译“雅威”既反映较通行的学术复原，也避免以称号代替专名。
- issue: 抹去亚玛力的“记忆”与以色列“不可忘记”的张力
  choice: 保留两者的字面并置
  alternative: 将前者解释性译成“余民”或“名号”以减弱表面张力
  rationale: 原文先命令抹去 זֵכֶר，随后又命令听者不可忘记；译文不替作者消解这一修辞与神学张力。
translation_notes:
  register: 采用现代、庄重而清楚的普通话。长句依照希伯来文的条件—命令结构组织，但调整语序，使土地背景、脱离仇敌和得享安宁之间的关系在汉语中清晰。末句独立成句，以保留原文突出的警戒语气。
