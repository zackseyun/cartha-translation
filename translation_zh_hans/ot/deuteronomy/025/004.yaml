  text: You shall not muzzle an ox while it is threshing[a].
translation:
  language: zh_hans
  text: 牛打谷的时候，不可笼住它的嘴[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“牛踹谷的时候。”希伯来文直译为“在它打谷时”。
    reason: 说明 דישׁ 在此农业语境中可具体指牛踩踏谷物使谷粒脱落，同时保留原文较为概括的字面表达。
lexical_decisions:
- source_word: לֹא
  choice: 不可
  rationale: 否定词在此引出法律禁令；“不可”简洁、庄重，也符合现代汉语法规式表达。
- source_word: תַחְסֹם
  choice: 笼住……的嘴
  rationale: חסם 指封住或限制牲畜的嘴，使其不能进食。“笼住……的嘴”直接表达给役畜戴笼嘴的动作，并避免泛化为一般性的“约束”。
- source_word: שׁוֹר
  choice: 牛
  rationale: שׁוֹר 在此指用于农业劳动的牛。现代汉语用“牛”最自然，也不必把原文未明确的信息具体化为阉牛或公牛。
- source_word: בְּדִישׁוֹ
  choice: 牛打谷的时候
  rationale: בְּ 加 דישׁ 及第三人称阳性单数后缀，字面为“在它打谷时”。主文以自然的时间从句表达，同时保留“打谷”这一较宽泛的原文用语。
