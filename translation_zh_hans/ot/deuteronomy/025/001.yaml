reference: Deuteronomy 25:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּֽי יִהְיֶ֥ה רִיב֙ בֵּ֣ין אֲנָשִׁ֔ים וְ/נִגְּשׁ֥וּ אֶל הַ/מִּשְׁפָּ֖ט וּ/שְׁפָט֑וּ/ם וְ/הִצְדִּ֨יקוּ֙ אֶת הַ/צַּדִּ֔יק וְ/הִרְשִׁ֖יעוּ אֶת הָ/רָשָֽׁע־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/001.yaml
  text: If there is a dispute between men[a], and they come to court, and the judges decide between them, then they shall acquit the righteous and condemn the wicked[c][b],
translation:
  language: zh_hans
  text: 人与人之间若有争讼[a]，他们就要来到审判处[b]；审判官要审断他们，判有理者为义，定恶者有罪[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作：“人与人之间有争讼时”。
    reason: 原文כִּי在个案律法中既可用条件式“若”，也可用时间式“当……时”。
  - marker: b
    text: 原文直译为“来到审判那里”，即来到审判处或进入司法审理。
    reason: 说明מִשְׁפָּט在这里所指的是司法审理或审判处，而不只是抽象的“审判”。
  - marker: c
    text: “判有理者为义”和“定恶者有罪”是法庭用语；原文直译为“使义人为义，判恶者为恶／有罪”。这里指判定谁在本案中有理，谁应被定罪，并非指使人在道德上成为义人或恶人。
    reason: 保留צדק与רשע及其使役动词的对称，并澄清其在本节中的司法意义。
lexical_decisions:
- source_word: כִּי יִהְיֶה
  choice: 若有
  rationale: 这里引出个案律法的条件。“若有”符合现代汉语法律语体，也保留条件含义；原文也可理解为时间性的“有……时”。
- source_word: רִיב
  choice: 争讼
  rationale: 该词在此指进入司法审理的争端或案件。“争讼”既体现争议，也清楚传达法律背景。
- source_word: בֵּין אֲנָשִׁים
  choice: 人与人之间
  rationale: 原文为阳性复数，指争讼的当事人。汉语“人与人之间”自然地表达双方关系，不额外限定案件性质。
- source_word: וְנִגְּשׁוּ
  choice: 双方来到
  rationale: 原义是“走近、来到”。根据上下文补出“双方”，明确其所指而不改变原意。
- source_word: אֶל הַמִּשְׁפָּט
  choice: 来到法庭
  rationale: 字面为“来到审判”，在本语境中指进入司法审理。“法庭”是自然清楚的现代汉语表达，脚注保留原文形式。
- source_word: וּשְׁפָטוּם
  choice: 审判者就要审断他们
  rationale: 原文是主动复数“他们审判他们”，但未明说主语。上下文所隐含的主语是负责审判的人；译作“审判者”避免误以为争讼双方彼此审判。
- source_word: וְהִצְדִּיקוּ אֶת הַצַּדִּיק
  choice: 宣判有理的一方无罪
  rationale: 在司法语境中，词组表示判定案件中占理者为无罪或正确的一方，而不是使其在道德上成为义人。
- source_word: וְהִרְשִׁיעוּ אֶת הָרָשָׁע
  choice: 宣判有罪的一方有罪
  rationale: 使役形在法庭语境中表示定罪或宣告有罪。译文保留原文与前半句对称的判决结构。
theological_decisions:
- issue: צדק与רשע在本节中是司法意义还是一般道德意义
  choice: 按司法判决理解，译为“宣判有理的一方无罪，宣判有罪的一方有罪”
  alternative: 按一般道德身份译为“称义人为义，定恶人为恶”
  rationale: 上下文明确涉及争讼、来到审判处和审断，因此这组词首先表达法庭对案件双方的裁决。这样既不把司法用语误解为道德改造，也不引入后来的教义术语；脚注同时保留原文“义人／恶人”的字面对应。
translation_notes:
  register: 采用现代、庄重而易懂的法律叙述语体。“争讼、法庭、审断、宣判”使司法场景清楚；避免以神学化的“称义”作为正文用语，同时通过脚注呈现希伯来文“义／恶”的对称结构。
