    reason: 说明מִשְׁפָּט在这里所指的是司法审理或审判处，而不只是抽象的“审判”。
  - marker: c
    text: “判有理者为义”和“定恶者有罪”是法庭用语；原文直译为“使义人为义，判恶者为恶／有罪”。这里指判定谁在本案中有理，谁应被定罪，并非指使人在道德上成为义人或恶人。
    reason: 保留צדק与רשע及其使役动词的对称，并澄清其在本节中的司法意义。
