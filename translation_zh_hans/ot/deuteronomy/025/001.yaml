revisions:
- from: 人与人之间若有争讼[a]，双方来到法庭[b]，审判者就要审断他们，宣判有理的一方无罪，宣判有罪的一方有罪[c]。
  to: 人与人之间若有争讼[a]，他们就要来到审判处[b]；审判官要审断他们，判有理者为义，定恶者有罪[c]。
  rationale: 修订末句以消除“有罪的一方有罪”的循环表达，并更贴近原文“宣告为义／定为有罪”的成对司法措辞。将“法庭”改为“审判处”，使之更接近“来到审判”的原文表达，同时保留现代汉语的可理解性。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T04:58:37Z'
review_pass:
  verdict: revise
  source_fidelity: 译文准确交代争讼双方进入司法审理、由审判者裁断，并把צדק／רשע理解为司法语境中的判决用语。可是“宣判有罪的一方有罪”把原文中作为被定罪对象的“恶者／有罪者”预先表述为已被判有罪的一方，形成不自然的同语反复；“有理的一方无罪”也略将“宣告为义／证明其理”收窄为现代刑事法意义的无罪。
  naturalness: 整体庄重清楚，但末句“宣判有理的一方无罪，宣判有罪的一方有罪”不够自然，且两个分句均把裁决结果预设在受判者的称谓中。改用“判有理者为义，定恶者有罪”，并以脚注说明其为本案的司法判断，可保留原文的对称、避免循环表述。
  terminology: “争讼”“审判处”“审断”适合本段法律语体。“审判者”可用，但“审判官”在此更简洁、自然。正文保留“有理者／恶者”的对应，脚注说明并非泛指道德身份或后来教义意义。
  issues:
  - severity: medium
    issue: 末句把判决对象预先定义为“有罪的一方”，造成循环表述。
    rationale: וְהִרְשִׁיעוּ אֶת־הָרָשָׁע意为审判者定恶者为罪／判其有罪；译作“宣判有罪的一方有罪”使“有罪”同时成为判决前的界定和判决结果，汉语不自然，也弱化了原文的司法宣告动作。
  - severity: low
    issue: “有理的一方无罪”稍偏向刑事法上的无罪判决。
    rationale: הִצְדִּיק在此是司法上宣告为义、证明有理或予以申明；“无罪”可作为解释，但正文以“判有理者为义”较完整保留与下句的词汇对称及案件裁断的广义。
  revised_text: 人与人之间若有争讼[a]，他们就要来到审判处[b]；审判官要审断他们，判有理者为义，定恶者有罪[c]。
