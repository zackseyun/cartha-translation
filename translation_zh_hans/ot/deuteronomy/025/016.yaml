  text: For everyone who does these things[a], everyone who does injustice, is an abomination to Yahweh your God.
translation:
  language: zh_hans
  text: 因为凡做这些事的人，凡行不义[a]的人，都是雅威——你的上帝所憎恶的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “行不义”也可译作“做不正的事”或“行不公”。希伯来语 עָוֶל 可指不义、不公或不正；本段尤其指使用不诚实的砝码和量器进行欺诈。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文关于诚实法码和升斗的规定，明确引出理由。
- source_word: תוֹעֲבַת
  choice: 所憎恶的
  rationale: 表达某人或某事为上帝所厌恶、视为可憎；中文谓语结构自然，同时保留强烈的道德与盟约意味。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文直接音译上帝的专名，不以称号替代。
- source_word: אֱלֹהֶיךָ
  choice: 你上帝
  rationale: 保留第二人称阳性单数及申命记常见的盟约表达。
- source_word: כָּל עֹשֵׂה אֵלֶּה
  choice: 凡做这些事的人
  rationale: 以“凡……的人”表达 כָּל 加分词所指的一般类别；“这些事”回指上文所述的不诚实交易。
- source_word: כֹּל עֹשֵׂה עָוֶל
  choice: 凡行不义的人
  rationale: 保留原文重复的“凡……的人”结构；“行不义”既涵盖不公与不正，也适合本段关于欺诈度量衡的语境。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华／上主
  rationale: 原文使用四字神名，音译“雅威”可保留其作为以色列之上帝盟约专名的性质。
- issue: תוֹעֲבַת 的语法与道德力度
  choice: 都是雅威你上帝所憎恶的
  alternative: 在雅威你上帝眼中都是可憎的
  rationale: 采用自然中文表达上帝对这类行为者的强烈否定，不把原文仅限缩为对行为本身的评价。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“凡……凡……”保留希伯来文的重复与强调；句末脚注说明“不义”在本段中的具体语境。
