  text: יוֹלֵ֨ךְ יְהוָ֜ה אֹֽתְ/ךָ֗ וְ/אֶֽת מַלְכְּ/ךָ֙ אֲשֶׁ֣ר תָּקִ֣ים עָלֶ֔י/ךָ אֶל גּ֕וֹי אֲשֶׁ֥ר לֹא יָדַ֖עְתָּ אַתָּ֣ה וַ/אֲבֹתֶ֑י/ךָ וְ/עָבַ֥דְתָּ שָּׁ֛ם אֱלֹהִ֥ים אֲחֵרִ֖ים עֵ֥ץ וָ/אָֽבֶן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/036.yaml
  text: Yahweh will bring you and the king whom you set over yourself to a nation that neither you nor your fathers have known[a], and there you will serve other gods[b], wood and stone.
translation:
  language: zh_hans
  text: 耶和华必把你和你所立来治理你的王带到一个你和你列祖都不认识的国[a]；在那里，你必事奉别的神[b]，就是木头和石头。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“一个你和你列祖从未知道的民族”。
    reason: “国”（גּוֹי）也可指民族或民众，“认识”在此也可译作“知道、熟悉”；“列祖”对应希伯来语“父亲们”。
  - marker: b
    text: 或译：“在那里，你必敬拜别的神”；希伯来语动词的本义是“服事”。
    reason: 说明עבד在宗教语境中的词义范围。
lexical_decisions:
- source_word: יוֹלֵךְ
  choice: 必把……带到
  rationale: 这是הלך的使役形，表示使人前往；在盟约咒诅的语境中，“带到”自然准确，又不额外加入原文未明说的“掳走”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文中通行的专名“耶和华”直接表达四字神名，而不以“主”等称号替代。
- source_word: מַלְכְּךָ אֲשֶׁר תָּקִים עָלֶיךָ
  choice: 你所立来治理你的王
  rationale: תקים表示设立或任命，עָלֶיךָ含有置于你之上掌权的意思；此译兼顾原文结构与现代中文的清晰度。
- source_word: גּוֹי
  choice: 国
  rationale: 此处指一个陌生的外邦国家；“国”在流放语境中简洁自然。
- source_word: אֲשֶׁר לֹא יָדַעְתָּ אַתָּה וַאֲבֹתֶיךָ
  choice: 你和你祖先都不认识的
  rationale: ידע在此表示对该国不熟悉；“祖先”在现代汉语中自然涵盖历代先人，并保留历史性的群体指向。
- source_word: וְעָבַדְתָּ שָׁם
  choice: 在那里，你必事奉
  rationale: עבד的基本义是“服事”；以神为宾语时也包含敬拜之意。“事奉”保留其词义联系及宗教语境。
- source_word: אֱלֹהִים אֲחֵרִים
  choice: 别的神
  rationale: 直译盟约文本中的固定表达，不将其解释性地改为“外邦的神”。
- source_word: עֵץ וָאָבֶן
  choice: 就是木头和石头
  rationale: 原文以同位语揭示这些神像的材质。“就是”使中文关系清楚，同时保留对偶像仅为木石的贬抑意味。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 中文圣经传统与普通读者最熟悉的专名是“耶和华”；它作为专名保留神名功能，而非用称号替换。
- issue: עבד与其他神连用时的含义
  choice: 事奉
  alternative: 敬拜
  rationale: “敬拜”能表达语境含义，但会收窄עבד的基本义；“事奉”既保留字面词义，也自然包含宗教效忠和敬拜。
- issue: 木头和石头与“别的神”的关系
  choice: 用“就是”明确为同位说明
  alternative: 保留无连接词的“别的神，木头和石头”
  rationale: 希伯来文为同位结构；现代中文若完全并置容易生硬或产生歧义，加“就是”只显明语法关系，不额外判定这些神的存在论地位。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“必”体现预告式咒诅的确定语气；以分号呈现两个结果分句。所有脚注标记均置于正文对应位置。
