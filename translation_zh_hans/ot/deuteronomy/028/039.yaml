base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/039.yaml
  text: You will plant vineyards and cultivate them[a], but you will not drink the wine or gather it, because the worm will eat it.
translation:
  language: zh_hans
  text: 你要栽种葡萄园，也要栽培，却不能喝酒，也不能收存[a]收成，因为虫子会把收成吃掉。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “收存”也可译作“收集”或“储藏”。希伯来语动词可指聚集、收取或储存。
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּרָמִים
  choice: 葡萄园
  rationale: 复数名词，指种植葡萄的园地；汉语可用集合性的“葡萄园”，无需机械标出复数。
- source_word: תִּטַּע
  choice: 你栽种
  rationale: נטע的Qal未完成式第二人称阳性单数；在盟约咒诅的预告中采用将来含义，但现代汉语不必另加“将要”。
- source_word: וְעָבָדְתָּ
  choice: 也辛勤耕作
  rationale: עבד在农业语境中指耕作、料理土地；隐含宾语是葡萄园。“辛勤”自然传达付出劳作而最终落空的语境，但不增添新的结果。
- source_word: יַיִן
  choice: 酒
  rationale: 指葡萄园所产的葡萄酒；承接“葡萄园”，现代汉语用“酒”自然明确。
- source_word: לֹא תִשְׁתֶּה
  choice: 却喝不到
  rationale: 否定未完成式在咒诅序列中表示预告的结果；“喝不到”比生硬的“必不喝”更自然，并表达产物被毁而无法享用。
- source_word: וְלֹא תֶאֱגֹר
  choice: 也收存不了出产
  rationale: אגר可指收集、聚拢或储存。译作“收存”保留收取与储藏两层可能；补出隐含的葡萄园出产，避免汉语把阳性单数代词误解为前面的酒。
- source_word: כִּי
  choice: 因为
  rationale: 清楚引出不能享用或收存出产的原因。
- source_word: תֹאכְלֶנּוּ
  choice: 必把它吃掉
  rationale: Qal未完成式第三人称阴性单数，带第三人称阳性单数宾语后缀；“吃掉”保留直接意象，并自然表达毁坏殆尽。
- source_word: הַתֹּלָעַת
  choice: 虫子
  rationale: 该词广指虫、蠕虫或幼虫类害虫，具体物种不明；“虫子”在现代汉语中自然且不作过度限定。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以结果式“喝不到”“收存不了”呈现盟约咒诅的未来后果；保留害虫种类的不确定性。脚注标记已置于对应正文之后。
