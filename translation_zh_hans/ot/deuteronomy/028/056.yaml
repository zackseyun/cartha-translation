base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/056.yaml
  text: The tender and delicate woman among you[a], who has not ventured to set the sole of her foot on the ground because of delicacy and tenderness, her eye will be evil toward the husband of her embrace[b], and toward her son and her daughter—
translation:
  language: zh_hans
  text: 你们中间那娇嫩、娇贵的妇人[a]，因养尊处优、娇弱，连脚掌落在地上都不曾试过；她必以恶眼相待[b]她怀中的丈夫[c]，也相待自己的儿子和女儿——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “娇嫩、娇贵”也可译为“柔弱、养尊处优”。这两个词描绘她极其娇弱、受娇养的处境。
    reason: lexical_alternative
  - marker: b
    text: “以恶眼相待”直译为“她的眼对……为恶”，是希伯来语习语，可指敌视，也可指自私吝惜、不肯分享。
    reason: lexical_alternative
  - marker: c
    text: “她怀中的丈夫”直译为“她怀里的男人”，是对丈夫的亲密称呼。
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרַכָּה וְהָעֲנֻגָּה
  choice: 娇嫩柔弱
  rationale: 两个阴性形容词分别突出柔软、娇弱以及养尊处优所形成的娇嫩；合译为“娇嫩柔弱”，自然而保留叠加强调。
- source_word: אֲשֶׁר לֹא נִסְּתָה כַף רַגְלָהּ הַצֵּג עַל הָאָרֶץ
  choice: 连脚掌也不曾尝试踏在地上
  rationale: 保留“脚掌”“尝试”和“地上”等具体意象，表现她娇弱到了甚至没有试着亲自踏地的程度。
- source_word: מֵהִתְעַנֵּג וּמֵרֹךְ
  choice: 因娇嫩柔弱
  rationale: 介词短语具有原因意味，并呼应句首两个形容词；重复用语也保存希伯来文的修辞联系。
- source_word: תֵּרַע עֵינָהּ
  choice: 恶眼看待
  rationale: 尽量保留“她的眼变恶／以恶眼相向”的鲜明希伯来语习语，不将其含义单一化为敌视、吝惜或嫉恨；脚注说明其语义范围。
- source_word: בְּאִישׁ חֵיקָהּ
  choice: 她怀中的丈夫
  rationale: אִישׁ在此指丈夫，חֵיקָהּ直指她的怀抱、胸怀；“怀中的丈夫”保留亲密关系的反差，又符合中文表达。
- source_word: וּבִבְנָהּ וּבְבִתָּהּ
  choice: 以及自己的儿子和女儿
  rationale: 分别保留“儿子”和“女儿”，不概括为“孩子”；“自己的”使所属关系在中文中清楚自然。
theological_decisions:
- issue: “恶眼”习语所表达的态度
  choice: 正文保留“恶眼看待”，脚注列出敌视与自私吝惜等可能含义
  alternative: 直接译为“恶狠狠地看”或“舍不得给”
  rationale: 上下文涉及围城饥荒中的亲属关系，但本节自身没有把该习语严格限定为一种心理或行为；保留张力可避免过早解释。
translation_notes:
  register: 采用现代、庄重且可朗读的普通话。句法贴近希伯来文的递进结构，并以破折号承接下一节。所有脚注标记均已置于正文；脚注a处理人物性状的词义范围，脚注b集中说明亲密称谓及“恶眼”习语。
