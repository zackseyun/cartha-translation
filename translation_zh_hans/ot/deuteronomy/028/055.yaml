  naturalness: “他不肯……因为……。在……时，他就会这样”的断句使本节与上文相连的从属结构显得松散。“在各城中”配合说明“城门”的借代义，更符合现代书面汉语。
  terminology: “儿子们”准确对应阳性复数 בָנָיו；“肉”应保留。将 מָצוֹר וּמָצוֹק译为“围困和困苦”，并明确这是仇敌所加的处境，较为准确自然。
