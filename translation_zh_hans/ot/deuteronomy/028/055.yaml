base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/055.yaml
  text: so that he will not give to any of them any of the flesh of his sons that he is eating[a], because he has nothing left[b], in the siege and in the distress with which your enemy will oppress you within all your gates.
translation:
  language: zh_hans
  text: 以致他不肯把自己正在吃的儿子们[a]的肉分给他们中任何一个，因为没有任何东西剩给他；这事发生在你仇敌在你各城中加给你的围困和困苦之中。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来原文作“他的儿子们”；这里明确使用阳性称谓，并非较笼统的“孩子们”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִתֵּת לְאַחַד מֵהֶם
  choice: 不肯……分一点给他们中的任何一个
  rationale: מִן接נתן的不定式承接上文，表达扣留、不愿给予；“不肯……给任何一个”在现代汉语中自然地传达其分配性和拒绝之意。
- source_word: מִבְּשַׂר בָּנָיו
  choice: 儿子们的肉
  rationale: בָּשָׂר具体指“肉”，应保留诅咒场景的骇人力度；בָּנָיו明确为阳性复数“他的儿子们”，不泛化为“孩子们”。
- source_word: אֲשֶׁר יֹאכֵל
  choice: 自己正在吃的
  rationale: 未完成式在预告的围城情景中描绘正在发生的行动；“正在吃”保留其生动、同时发生的意味。
- source_word: מִבְּלִי הִשְׁאִיר לוֹ כֹּל
  choice: 因为他已经一无所有
  rationale: 该短语说明他拒绝分给亲人的原因，即没有任何东西留给自己；“一无所有”简洁传达彻底匮乏。
- source_word: בְּמָצוֹר וּבְמָצוֹק
  choice: 围困……陷入困境
  rationale: מָצוֹר指围城或围困，מָצוֹק指窘迫、困苦；调整为自然汉语句式，同时保留二者的客观围困与严重困境。
- source_word: אֲשֶׁר יָצִיק לְךָ אֹיִבְךָ
  choice: 你仇敌……使你……陷入困境
  rationale: צוּק的使役形表达使人受压、陷入困苦；此译法明确仇敌是施压者，又避免加入原文没有的具体手段。
- source_word: בְּכָל שְׁעָרֶיךָ
  choice: 在各城门内
  rationale: 直译保留“城门”的希伯来意象；此处“城门”可借代各城镇，故以脚注说明。
