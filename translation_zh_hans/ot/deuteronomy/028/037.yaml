base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/037.yaml
  text: And you shall become an object of horror[a], a proverb[c][b], and a taunt among all the peoples where Yahweh will drive you.
translation:
  language: zh_hans
  text: 你必在雅威赶你去[c]的万民中，成为令人惊骇的对象[a]、笑谈和讥讽[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“令人诧异的对象”。希伯来词可指因遭受严重毁坏而使人惊骇或诧异的事物。
    reason: lexical_alternative
  - marker: b
    text: “笑谈和讥讽”也可译为“话柄和嘲弄”。希伯来文使用两个相关但不同的词，分别侧重被人传说的话和尖刻的嘲弄。
    reason: lexical_alternative
  - marker: c
    text: “赶你去”或译“领你去”。原文动词兼有“带领”和“驱赶”的意思；咒诅与流亡的语境支持正文所用的强制意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיִיתָ
  choice: 你必……成为
  rationale: 在这一连串咒诅中，带连接词的完成式表达将来的结果；“必……成为”自然传达所达到的境况。
- source_word: לְשַׁמָּה
  choice: 令人惊骇的景象
  rationale: שַׁמָּה在审判语境中指一种惨不忍睹、使人惊骇或诧异的情形；此译既表达旁观者的反应，也符合汉语习惯。
- source_word: לְמָשָׁל
  choice: 人们口中的俗语
  rationale: מָשָׁל可指箴言、俗语或话柄；这里处于咒诅语境，与后面的讥讽并列，因此用“人们口中的俗语”保留其言语流传的含义，又不与下一词合并。
- source_word: וְלִשְׁנִינָה
  choice: 讥讽的话
  rationale: שְׁנִינָה指尖刻、嘲弄人的说法；“讥讽的话”突出公开言语羞辱的意味。
- source_word: בְּכֹל הָעַמִּים
  choice: 在……各族中
  rationale: עַמִּים是“众民、各族”的复数；“各族”比“列国”更直接对应原词，并适合离散处境。
- source_word: אֲשֶׁר יְנַהֶגְךָ שָׁמָּה
  choice: 赶你去的
  rationale: נהג可指带领或驱赶；本节属于被迫流亡的咒诅语境，“赶”较能表达强制意味。目的地副词שָׁמָּה自然融入汉语“去的”之中。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文四字神名作音译，以保留这里直接使用的上帝之名，而不以称号替代。
theological_decisions:
- issue: 如何译出神名יְהוָה
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；“雅威”是对应YHWH的现代汉语音译，避免把专名改成称号。
- issue: נהג在流亡咒诅中的力度
  choice: 赶你去
  alternative: 领你去
  rationale: 该动词本身容许“带领”和“驱赶”两义；上下文是强制性的审判与离散，正文采用“赶”，脚注保留较中性的可能。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“令人惊骇的景象”避免生硬的“惊骇之物”；“人们口中的俗语和讥讽的话”保留原文两个并列言语名词的区别。
