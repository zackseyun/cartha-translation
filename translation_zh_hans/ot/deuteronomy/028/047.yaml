base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/047.yaml
  text: because you did not serve Yahweh your God with joy and with gladness of heart[a], because of the abundance of all things[b],
translation:
  language: zh_hans
  text: 因为你没有在一切丰盛之中[b]欢欢喜喜、心中愉悦[a]地侍奉耶和华你的上帝，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “心中愉悦”原文直译近于“心地美好”或“心的美好”；这里也可理解为“内心欢畅”。
    reason: lexical_alternative
  - marker: b
    text: “在一切丰盛之中”原文也可译作“因一切都丰足”或“当你样样丰足时”。这里强调：你享有丰富供应，却没有这样侍奉上帝。
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּחַת אֲשֶׁר
  choice: 因为……却……
  rationale: 此处引出盟约咒诅的原因；汉语用“因为……却……”既表达因果，也凸显人在丰足中仍未尽本分的反差。
- source_word: עָבַדְתָּ
  choice: 侍奉
  rationale: 以神为宾语时，此词涵盖敬拜、忠诚与顺服；“侍奉”比单说“敬拜”更能保留其宽广含义。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代汉语圣经传统中对四字神名的通行音译，保留其作为以色列之神专名的性质，而不以称号替代。
- source_word: אֱלֹהֶיךָ
  choice: 你的上帝
  rationale: 保留第二人称阳性单数的盟约称呼；“上帝”是自然、庄重的现代标准汉语表达。
- source_word: בְּשִׂמְחָה
  choice: 欢欢喜喜
  rationale: 表达侍奉时喜乐的方式；叠词自然清楚，并与后面的内在心境相配。
- source_word: וּבְטוּב לֵבָב
  choice: 心中愉悦
  rationale: 原文直译近于“心的美好/良善”，在此与喜乐并列，语境上指内心欣悦；此译自然，同时以脚注保留字面含义。
- source_word: מֵרֹב כֹּל
  choice: 虽样样丰足
  rationale: 该短语描写以色列拥有丰富供应时仍未侍奉神的处境；“虽”明确呈现语境中的让步反差，而脚注保留介词短语可能较直译的表达。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 两者都是对四字神名的音译；正文采用普通简体中文读者最熟悉的传统形式“耶和华”，不以“主”这一称号替代专名。
- issue: עבד 所表达的盟约服事
  choice: 侍奉
  alternative: 敬拜
  rationale: “侍奉”保留对神忠诚、顺服和敬拜的综合意义，避免把原词缩窄为礼仪性的敬拜。
- issue: מֵרֹב כֹּל 与未侍奉之间的逻辑关系
  choice: 虽样样丰足
  alternative: 因样样丰足
  rationale: 原文形式可直译为“由于/从一切的丰盛”，但上下文重点是以色列在丰富供应中仍不喜乐侍奉；让步表达避免暗示丰足本身机械地导致不顺服。
translation_notes:
  register: 采用现代、庄重且易懂的简体中文。“欢欢喜喜”使方式状语自然有力；“心中愉悦”与之形成由外在表现到内在心境的并列。经文是后续咒诅句的原因从句，因此末尾保留逗号。
