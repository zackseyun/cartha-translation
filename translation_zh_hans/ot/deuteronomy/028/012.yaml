  to: 耶和华必为你敞开他美好的宝库[a]，就是天，赐你的地按时降雨，并赐福你手所做的一切。你必借给许多国，却不借。
  rationale: 修订收敛了“丰美”对“美好”的语义强化，删除原文未明说的“向他们”，并将降雨短语调整为自然且贴近原文的中文。保留“天”作为“宝库”的同位说明，以及唯一脚注的锚点与词汇替代信息。
