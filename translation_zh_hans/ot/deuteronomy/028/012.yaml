base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/012.yaml
  text: Yahweh will open to you his good storehouse[a], the heavens, to give the rain of your land in its season and to bless all the work of your hand. You will lend to many nations, but you will not borrow.
translation:
  language: zh_hans
  text: 耶和华必为你敞开他美好的宝库[a]，就是天，赐你的地按时降雨，并赐福你手所做的一切。你必借给许多国，却不借。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他美好的储藏室。”希伯来语所用的词可指宝库或储藏室；这里的语境是从天降雨、使地出产。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文中通行且庄重的专名译法呈现四字神名，保留其作为立约之神名字的功能。
- source_word: יִפְתַּח
  choice: 必……敞开
  rationale: Qal未完成式在祝福语境中表达将来的确定行动；“敞开”保留具体意象。
- source_word: אוֹצָרוֹ הַטּוֹב
  choice: 他丰美的宝库
  rationale: אוֹצָר可指宝库或储藏室；“宝库”适合天作为雨水储藏之所的比喻。“丰美”在自然中文中传达טוֹב的正面、丰足意味，脚注保留较直译的可能。
- source_word: הַשָּׁמַיִם
  choice: 就是天
  rationale: 将其视为与“宝库”同位的成分；“就是”明确同位关系，而“天”自然表达希伯来语形式，不把它抽象化为属灵居所。
- source_word: לָתֵת מְטַר אַרְצְךָ בְּעִתּוֹ
  choice: 好按时降雨在你的地上
  rationale: 以自然中文表达目的结构及雨水适时临到土地的意思；“按时”保留农业周期的重点。
- source_word: כָּל מַעֲשֵׂה יָדֶךָ
  choice: 你手所做的一切
  rationale: 保留“手”的希伯来语劳动意象，同时使中文流畅易懂。
- source_word: וְהִלְוִיתָ גּוֹיִם רַבִּים
  choice: 你必借给许多国
  rationale: לוה的Hiphil在此意为借出；גּוֹיִם在国家性的盟约语境中译作“国”。
- source_word: וְאַתָּה לֹא תִלְוֶה
  choice: 却不向他们借贷
  rationale: Qal形式意为借入；“却”呈现两句间的对比，“向他们”由平行语境自然补出，并不改变对象范围。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 正文采用现代中文圣经读者最熟悉的专名“耶和华”，直接呈现神名而非以“主”替代；“雅威”是较接近学术重构读音的另一选择。
- issue: “宝库”与“天”的关系
  choice: 将“天”理解为同位说明，即天就是上帝的宝库
  alternative: 将“天”理解为上帝在天上的宝库
  rationale: 希伯来语中אֶת הַשָּׁמַיִם紧接“他丰美的宝库”，最自然可作同位语；译文保留这一图像，不另加“在”来改变句法关系。
translation_notes:
  register: 采用庄重而清楚的现代标准普通话。“敞开宝库”“你手所做的一切”等表达保留原文意象；句法适度调整，以避免生硬直译。正文中的脚注标记[a]与脚注完全对应。
