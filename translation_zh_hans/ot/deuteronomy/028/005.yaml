  text: Blessed shall be your basket and your kneading bowl[a].
translation:
  language: zh_hans
  text: 你的筐和揉面盆都必蒙福。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“揉面槽”。这个希伯来词指预备面团时使用的器皿。
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ
  choice: 必蒙福
  rationale: 该词是ברך的被动分词，在盟约祝福系列中作谓语，表达确定宣告而非愿望；“必蒙福”自然传达其将来指向和宣告语气。
- source_word: טַנְאֲךָ
  choice: 你的筐
  rationale: טֶנֶא指篮筐，常用于盛装或搬运农产品；“筐”简洁自然，也不加入原文未明说的用途或材质。
- source_word: וּמִשְׁאַרְתֶּךָ
  choice: 和揉面盆
  rationale: מִשְׁאֶרֶת指预备面团时使用的揉面器皿；“揉面盆”在现代汉语中清楚易懂，并保留其具体用途。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而通俗的表达。“筐”和“揉面盆”构成日常粮食与家用供应的具体意象；以“都必蒙福”统摄两个并列名词，使中文流畅，同时保留盟约祝福的确定语气。
