base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/030.yaml
  text: You will become engaged to a wife[a], but another man will lie with her; you will build a house, but you will not live in it; you will plant a vineyard[c][b], but you will not begin to use its fruit.
translation:
  language: zh_hans
  text: 你要与一个女子订婚[a]，另一个男人却要与她性交[b]；你要建造房屋，却不能住在里面；你要栽种葡萄园，却不能开始享用园中的果实[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较正式地译作“聘定一个女子为妻”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文的书写形式使用粗直的性行为用语；传统诵读形式则为较常见的“与她同寝”。有些译本采用“强暴她”或“蹂躏她”等更强烈的表达；这里没有把该词本身未明确标出的强迫性质写入正文。
    reason: textual_and_lexical_alternative
  - marker: c
    text: 原文直译为“使它成为俗用”，这是开始把葡萄园的果实作日常食用的说法；参《利未记》19:23—25。
    reason: lexical_alternative
lexical_decisions:
- source_word: תְאָרֵשׂ אִשָּׁה
  choice: 与一个女子订婚
  rationale: ארשׂ指正式缔结婚约；现代汉语“订婚”自然清楚，也保留婚姻法律背景。אִשָּׁה在此是订婚对象，译作“女子”比直接称“妻子”更符合尚未成婚的阶段。
- source_word: אִישׁ אַחֵר
  choice: 另一个男人
  rationale: 直接保留原文中此人与受话者之间的对比。
- source_word: ישגלנה
  choice: 与她性交
  rationale: שׁגל是粗直的性行为用语。“性交”明确而不委婉，同时不把该词本身未明确标出的强迫性质写入正文。
- source_word: תֵשֵׁב בּוֹ
  choice: 住在里面
  rationale: ישב用于房屋时意为居住；此译法符合现代汉语习惯。
- source_word: כֶּרֶם
  choice: 葡萄园
  rationale: כֶּרֶם的标准、自然对应词。
- source_word: תְחַלְּלֶנּוּ
  choice: 开始享用园中的果实
  rationale: חלל的强化词干用于葡萄园时，是指经过不可食用或分别为圣的时期后，开始把果实作日常食用；此处译出该习语的实际含义。
theological_decisions:
- issue: ישגלנה是否明确表示强暴
  choice: 正文译作“与她性交”，不明确加入强迫含义
  alternative: “强暴她”或“蹂躏她”
  rationale: 该动词语气粗直，语境描写严重的夺取与羞辱，但其形态本身并未明确编码强迫；脚注保留更强译法的可能性，避免消除原文张力。
- issue: תְחַלְּלֶנּוּ的礼仪及农业背景
  choice: 以“开始享用园中的果实”表达实际所指
  alternative: 直译“使它成为俗用”或泛译“享用它”
  rationale: 这里可能呼应利未记19:23—25关于果树果实的规定。直译在现代汉语中难以理解，而单说“享用”又会丢失“开始作普通用途”的技术含义。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。三个分句保持原文反复出现的“你要……却……”诅咒结构；性行为用语保持原文的直白程度，但避免无根据地明确加入暴力。
