base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/023.yaml
  text: And the heavens above your head shall be bronze[a], and the earth beneath you iron.
translation:
  language: zh_hans
  text: 你头顶的天必变为铜[a]，你脚下的地必变为铁。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “铜”也可译作“青铜”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיוּ
  choice: 必变成
  rationale: 在盟约咒诅的预告语境中，该形式具有将来指向；“必变成”既体现结果状态，也保留庄严而确定的警告语气。
- source_word: שָׁמֶיךָ אֲשֶׁר עַל רֹאשְׁךָ
  choice: 你头上的天
  rationale: שָׁמַיִם 在此指头顶的天空、气候领域；中文“你头上的天”自然保留领属关系、方位意象和与下句的平行结构。
- source_word: נְחֹשֶׁת
  choice: 铜
  rationale: 该词可指铜或青铜。现代中文用“铜”可自然涵盖此处的金属意象，同时避免在原文无法确定合金成分时过度限定。
- source_word: וְהָאָרֶץ אֲשֶׁר תַּחְתֶּיךָ
  choice: 你脚下的地
  rationale: אֶרֶץ 在与“天”对举时可指大地；“你脚下的地”以自然中文保留上下对称和切身方位感。
- source_word: בַּרְזֶל
  choice: 铁
  rationale: 该词的标准对应词，保留坚硬、不出产的咒诅意象。
theological_decisions:
- issue: 咒诅图像的隐喻力量
  choice: 正文保留“铜”和“铁”的金属图像，不直接解释为干旱或土地坚硬。
  alternative: 意译为天空不降雨、土地干硬。
  rationale: 原文以鲜明的金属比喻表达盟约咒诅；保留图像可避免把隐含意义当作明说内容。
- issue: נְחֹשֶׁת 的金属类别
  choice: 正文译“铜”，脚注注明也可译“青铜”。
  alternative: 正文译“青铜”。
  rationale: 希伯来词本身可涵盖铜或青铜，语境不能完全排除任一项；正文采用现代中文较宽泛的“铜”，脚注保存词义歧义。
translation_notes:
  register: 采用简洁、庄重的现代标准汉语；“你头上的天／你脚下的地”形成清楚的上下平行，“必变成”传达咒诅预告的确定性。
