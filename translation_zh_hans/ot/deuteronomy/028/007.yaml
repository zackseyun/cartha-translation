  text: יִתֵּ֨ן יְהוָ֤ה אֶת אֹיְבֶ֨י/ךָ֙ הַ/קָּמִ֣ים עָלֶ֔י/ךָ נִגָּפִ֖ים לְ/פָנֶ֑י/ךָ בְּ/דֶ֤רֶךְ אֶחָד֙ יֵצְא֣וּ אֵלֶ֔י/ךָ וּ/בְ/שִׁבְעָ֥ה דְרָכִ֖ים יָנ֥וּסוּ לְ/פָנֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/007.yaml
  text: Yahweh will give your enemies who rise up against you defeated before you[a]. By one way they will come out against you[b], and by seven ways they will flee before you.
translation:
  language: zh_hans
  text: 耶和华必使那些起来攻击你的仇敌在你面前被击败[a]。他们从一条路来攻击你，却要在你面前从七条路逃跑[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作：“耶和华必把那些起来攻击你的仇敌交在你手中，使他们在你面前被击败。”
    reason: 原文“给”在军事语境中可表示“交出、交在……手中”；正文采用结果式表达。
  - marker: b
    text: 原文作“从一条路……从七条路”，形象地描写敌军一同前来，却四散溃逃。
    reason: 说明希伯来语数字与道路意象所形成的对比，同时不排除“七”带有完全性的意味。
lexical_decisions:
- source_word: יִתֵּן
  choice: 必使……败下阵来
  rationale: נתן的基本义是“给、交出”；在此军事语境中与“被击败的”连用，表达耶和华使敌人被交在以色列人面前、遭到失败。中文用“使……败下阵来”自然传达结果，同时不把动作具体化为杀戮。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 直接译出四字神名；“耶和华”是现代简体中文圣经语境中最通行、最易识别的音译。
- source_word: אֹיְבֶיךָ הַקָּמִים עָלֶיךָ
  choice: 那些起来攻击你的仇敌
  rationale: קום על表示怀着敌意起来反对或攻击某人；“起来攻击”既保留原文意象，也明确军事语境。
- source_word: נִגָּפִים לְפָנֶיךָ
  choice: 在你面前败下阵来
  rationale: נִגָּפִים是נָגַף的被动分词，表示被击败；“败下阵来”自然体现军事失败，לְפָנֶיךָ则译为“在你面前”。
- source_word: בְּדֶרֶךְ אֶחָד
  choice: 从一条路
  rationale: 直译“一条路”，并与后文“七条路”形成鲜明对照。
- source_word: יֵצְאוּ אֵלֶיךָ
  choice: 出来攻击你
  rationale: יצא אל在战争语境中指向某人出战；“出来攻击你”清楚表达上下文中的敌对含义。
- source_word: וּבְשִׁבְעָה דְרָכִים
  choice: 却要从七条路
  rationale: 保留“七条路”的原文图像及与“一条路”的平行对照；“却”显明进攻整齐与溃逃四散之间的反差。
- source_word: יָנוּסוּ
  choice: 逃跑
  rationale: נוס的常用义为“逃走、逃跑”；这里描写败军溃逃，比“撤退”更有力度。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用神的专名而非称号。译文保留专名，并采用普通现代中文读者最熟悉的“耶和华”；“雅威”可更直接反映当代常见的学术拟音，但在中文圣经传统中的普及度较低。
- issue: “一条路”与“七条路”的含义
  choice: 在正文中保留具体道路意象，以脚注说明其修辞作用
  alternative: 正文意译为“从一个方向来，却向四面八方逃跑”
  rationale: 原文以一与七作对照，既描绘敌军一同进攻而四散溃逃，也可能带有“七”所表达的完全性。保留字面图像可避免只固定为一种解释。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“败下阵来”清楚传达军事失败；保留“一条路／七条路”的对偶意象，并用脚注帮助普通读者理解。所有第二人称单数阳性形式依中文习惯译作“你”。
