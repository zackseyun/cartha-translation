revisions:
- from: 耶和华必使那些起来攻击你的仇敌在你面前败下阵来[a]。他们从一条路出来攻击你，却要从七条路在你面前逃跑[b]。
  to: 耶和华必使那些起来攻击你的仇敌在你面前被击败[a]。他们从一条路来攻击你，却要在你面前从七条路逃跑[b]。
  rationale: 以“被击败”直接对应原文的被动分词，避免将战败状态提前具体化为败退；微调末句语序以符合现代普通话。脚注a将“交给你”改为更惯用的“交在你手中”，并保留其作为对原文“给”的军事语境释义。
