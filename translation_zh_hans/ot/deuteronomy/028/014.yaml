base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/014.yaml
  text: And do not turn aside from any of the words that I am commanding you today[a], to the right or to the left[b], to go after other gods to serve them.
translation:
  language: zh_hans
  text: 不可偏离我今日吩咐你们的任何话，或向右或向左，去随从别的神[a]，侍奉它们[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“走在……后面”；此处是“随从”的惯用表达。
    reason: lexical_alternative
  - marker: b
    text: 或译“敬拜它们”。原词指服事；用于神祇时带有敬拜和效忠的含义。
    reason: lexical_alternative
lexical_decisions:
- source_word: תָסוּר
  choice: 偏离
  rationale: סור表示转离、偏离；“偏离”在现代汉语中自然地表达背离所吩咐之道的意思。
- source_word: מִכָּל הַדְּבָרִים
  choice: 任何话
  rationale: 否定词与מכל连用，表示不可偏离其中任何一项；保留דברים的基本意义“话”，不直接改写为“诫命”。
- source_word: מְצַוֶּה אֶתְכֶם הַיּוֹם
  choice: 我今天吩咐你们
  rationale: 分词在摩西当前讲话的语境中带有现时意味；此语序符合现代汉语，也保留“今天”的盟约现场感。
- source_word: יָמִין וּשְׂמֹאול
  choice: 向右或向左
  rationale: 保留希伯来语表示朝任何方向偏离的空间比喻。
- source_word: לָלֶכֶת אַחֲרֵי
  choice: 去跟随
  rationale: הלך אחרי字面为“走在……后面”，惯用义为“跟随”；“去跟随”兼顾原文行动意象与现代汉语自然度。
- source_word: אֱלֹהִים אֲחֵרִים
  choice: 别的神
  rationale: 直接对应“其他的神”，不加上“外邦”等原文未明说的限定。
- source_word: לְעָבְדָם
  choice: 侍奉它们
  rationale: עבד用于神祇时兼有服事、效忠和敬拜意味；“侍奉”保留较宽的宗教效忠含义，而不缩限为单一敬拜行为。
theological_decisions:
- issue: 盟约警告中对其他神祇的称呼
  choice: 别的神
  alternative: 外邦的神；假神
  rationale: 原文仅说“别的神”。译文保留申命记的原有表述，不在本节中判定这些神祇的本体地位，也不增添其族群归属。
- issue: לָלֶכֶת与前句禁令的逻辑关系
  choice: 而去跟随
  alternative: 以致去跟随；为了跟随
  rationale: 原文不定式可表达偏离命令后所走向的行为，但目的与结果之间并非完全明确；“而去”保持连接关系而不将其严格限定为目的或结果。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。“任何话”保留原文用词，“向右或向左”保留希伯来语比喻；整体避免古奥句式及宗派性解释。
