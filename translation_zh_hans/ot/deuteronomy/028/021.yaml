base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/021.yaml
  text: Yahweh will make the plague cling to you until he has wiped you out from the land that you are entering to possess[a][b].
translation:
  language: zh_hans
  text: 耶和华必使瘟疫[a]缠住你，直到他把你从你正要进去取得为业的那地上除灭[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “瘟疫”也可译作“疫病”。希伯来语这个词可指作为审判而临到的致命流行病。
    reason: lexical_alternative
  - marker: b
    text: “直到他把你……除灭”也可译作“直到瘟疫将你灭尽”，即把“瘟疫”理解为这一分句的隐含主语。
    reason: alternative_reading
lexical_decisions:
- source_word: יַדְבֵּק
  choice: 必使……紧紧缠住
  rationale: 使役式表达“使……黏附、紧随不离”；“紧紧缠住”在现代汉语中自然地保留了灾病持续附着、不肯离去的形象。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经传统中对神圣四字名的通行音译，以名字而非称号呈现。
- source_word: הַדָּבֶר
  choice: 瘟疫
  rationale: 该词在盟约咒诅语境中指致命的流行性灾病；“瘟疫”准确、庄重，也为现代读者所理解。
- source_word: עַד כַּלֹּתוֹ אֹתְךָ
  choice: 直到他把你……除灭
  rationale: כלה表示使之终结、耗尽或毁灭；“除灭”保留彻底消灭的力度，并按主句自然承接“耶和华”为隐含主语。
- source_word: מֵעַל הָאֲדָמָה
  choice: 从……土地上
  rationale: מֵעַל含“从……上”之意，而אֲדָמָה在进入并占领的语境中指土地；该译法兼顾形式与自然表达。
- source_word: אֲשֶׁר אַתָּה בָא שָׁמָּה
  choice: 你将要进去的
  rationale: בוא与方向词שמה合用，按汉语自然表达为“进去”；分词在此指即将发生的进入。
- source_word: לְרִשְׁתָּהּ
  choice: 占领
  rationale: ירש在申命记的土地语境中表示取得并拥有土地；“占领”突出实际取得土地，简洁自然。
theological_decisions:
- issue: 盟约咒诅中דבר的译法
  choice: 瘟疫
  alternative: 疫病
  rationale: “瘟疫”既能表达严重、致命且具有群体传播性质的灾病，也不超出本词在审判语境中的语义范围。
- issue: כַּלֹּתוֹ的隐含主语
  choice: 以耶和华为隐含主语：“直到他……除灭”
  alternative: 以瘟疫为隐含主语：“直到瘟疫把你除灭”
  rationale: 主句明确以耶和华为主语，继续以他为不定式结构的隐含主语在上下文中较为自然；脚注保留以“瘟疫”为主语的真实句法可能性。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“紧紧缠住”保留原文使役结构和鲜明意象；“除灭”比口语化的“消灭干净”更适合经文语体。两个脚注标记均置于相关句末，以保存词义及隐含主语的歧义。
