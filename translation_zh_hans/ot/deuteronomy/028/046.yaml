base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/046.yaml
  text: And they will be on you and on your offspring as a sign and a wonder forever[a][b].
translation:
  language: zh_hans
  text: 这些[b]必临到你和你的后裔[a]，作为记号和奇事，直到永远。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“和你的子孙”；希伯来文直译为“种子”，在这里集合性地指一个人的后代。
    reason: lexical_alternative
  - marker: b
    text: “这些”指上下文所述的咒诅。
    reason: cross_reference
lexical_decisions:
- source_word: וְהָיוּ
  choice: 这些必……成为
  rationale: 该形式承接上文所述的未来后果。用“必”表达确定将发生的结果；“这些”保留复数指代，不把所指对象直接写成“咒诅”。
- source_word: בְךָ
  choice: 临到你
  rationale: 介词表示上文后果落在或附着于受话者身上；现代汉语用“临到”自然表达灾祸加在某人身上的含义。
- source_word: לְאוֹת
  choice: 成为记号
  rationale: אוֹת 指具有指示作用的记号或标志；“记号”准确、通俗，也与下文“奇事”构成传统而自然的搭配。
- source_word: וּלְמוֹפֵת
  choice: 和奇事
  rationale: מוֹפֵת 可指奇事、异象或令人惊异的征兆；“奇事”保留其异常、引人惊异的含义，而不额外限定为凶兆。
- source_word: וּבְזַרְעֲךָ
  choice: 和你的后裔
  rationale: זֶרַע 在此集合性地指后代。汉语“后裔”自然涵盖子孙后代，并避免直译“种子”造成误解；重复的介词关系由并列结构清楚表达。
- source_word: עַד עוֹלָם
  choice: 直到永远
  rationale: 这是该短语自然且庄重的汉语对应，表达持续不止的时限，同时不在译文中另行界定其哲学意义。
theological_decisions:
- issue: 复数主语所指
  choice: 正文用“这些”承接上文，并以脚注说明指上文的咒诅
  alternative: 正文直接译作“这些咒诅”或泛指全部盟约制裁
  rationale: 希伯来文本本节没有明说复数主语；保留指代形式可避免把上下文推断直接写入正文，同时脚注帮助读者辨明所指。
- issue: עַד עוֹלָם 的时限含义
  choice: 译作“直到永远”，不进一步界定是否指形而上意义上的绝对无尽
  alternative: 世世代代；永久
  rationale: 原文在盟约审判语境中强调长久持续。标准表达“直到永远”保留原文力度，也不附加经文本身未说明的教义界定。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“临到”符合灾祸或审判落在人身上的汉语表达；句法保留原文的并列推进。“记号和奇事”既体现原文固定搭配，又不过度解释“奇事”为特定性质的凶兆。
