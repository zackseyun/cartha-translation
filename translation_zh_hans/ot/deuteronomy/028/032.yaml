base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/032.yaml
  text: Your sons and your daughters will be given to another people[a], while your eyes look on and fail with longing for them all day long, but your hand will be powerless.
translation:
  language: zh_hans
  text: 你的儿子和女儿必被交给别的民族；你的眼目看着他们，终日因思念他们而望眼欲穿，你却无能为力。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你的手中却没有力量。”原文以“手”表示能力；其中的 אֵל 在此习语中不指神明。
    reason: 说明希伯来语习语的较直译形式，并防止把其中的 אֵל 误解为神明称谓。
lexical_decisions:
- source_word: בָּנֶיךָ וּבְנֹתֶיךָ
  choice: 你的儿子和女儿
  rationale: 原文分别明说儿子和女儿；不笼统译作“儿女”或“孩子”，以保留咒诅措辞的具体性。
- source_word: נְתֻנִים
  choice: 必被交给
  rationale: 被动分词在这一预告咒诅的语境中具有将来意味。“被交给”既保留被动形式，也比“被掳走”少一层原文未明说的解释。
- source_word: לְעַם אַחֵר
  choice: 给别的民族
  rationale: עַם 指一个群体或民族，אַחֵר 是“别的、另一个”。“别的民族”在现代汉语中自然，也不强化为特定政治意义上的“国家”。
- source_word: וְעֵינֶיךָ רֹאוֹת
  choice: 你只能眼睁睁地看着
  rationale: 原文以“你的眼睛看着”生动描写亲眼目睹却无法阻止；“眼睁睁地看着”自然传达这种无助感。“只能”由全句所表达的无力处境得出。
- source_word: וְכָלוֹת אֲלֵיהֶם
  choice: 思念他们，望眼欲穿
  rationale: כלה 在这里描写双眼因朝向儿女而耗尽、衰残。“望眼欲穿”保留眼睛耗损的意象，“思念他们”则明示这一表达在上下文中的情感指向。
- source_word: כָּל הַיּוֹם
  choice: 终日
  rationale: 简洁而庄重地表达持续一整天的意思。
- source_word: וְאֵין לְאֵל יָדֶךָ
  choice: 却无能为力
  rationale: 这是表示手中没有能力或力量的希伯来语习语。“无能为力”准确传达其功能意义，并避免把 אֵל 在此误解为对神明的指称。
theological_decisions:
- issue: וְאֵין לְאֵל יָדֶךָ 中 אֵל 的理解
  choice: 按表示缺乏能力的习语译作“却无能为力”
  alternative: 较直译为“你的手中没有力量”
  rationale: 此处不是关于神或某位神明的神学陈述，而是说当事人没有能力采取行动。正文采用自然汉语，脚注保留较贴近字面的表达。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“眼睁睁地看着”和“望眼欲穿”保留原文以双眼描写无助目睹与耗尽思念的强烈画面；分号呈现前后处境与反应的关系。脚注标记置于其所解释的末句之后。
