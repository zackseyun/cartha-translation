base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/027.yaml
  text: Yahweh will strike you with the boils of Egypt[a], and with tumors, and with scabs, and with itch, from which you cannot be healed.
translation:
  language: zh_hans
  text: 耶和华必用埃及的疮疖、肿块[a]、疮痂和瘙痒击打你；你不能得医治。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“痔疮”。这个希伯来词的确切含义不确定，可能更具体地指肛门部位的肿胀。
    reason: 词义存在不确定性，需保留较具体的传统理解。
lexical_decisions:
- source_word: יַכְּכָה
  choice: 必……击打你
  rationale: נכה的使役式在这里表示直接击打或降灾；“击打”保留原文力度，“必”体现未完成式在咒诅宣告中的确定将来含义。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代汉语圣经传统中对四字神名最通行、易识别的音译，保留其作为专名的功能，而不以称号替代。
- source_word: בִּשְׁחִין מִצְרַיִם
  choice: 用埃及的疮
  rationale: שְׁחִין指发炎的疮或疮疖；“埃及的疮”保留原文属格结构及其可能唤起的埃及灾祸背景。
- source_word: וּבְעפלים
  choice: 肿瘤
  rationale: 该词所指不完全确定，广义“肿瘤”避免在正文中过度限定；可能特指肛门部位的肿胀，另以脚注说明。
- source_word: וּבַגָּרָב
  choice: 疥疮
  rationale: גָּרָב指带痂或粗糙的皮肤病；“疥疮”是自然、具体的现代汉语病名，同时不过度采用现代医学诊断术语。
- source_word: וּבֶחָרֶס
  choice: 瘙痒
  rationale: 该名词指引起发痒的皮肤病症；“瘙痒”简明地保留核心症状，而不武断确定为湿疹等具体疾病。
- source_word: אֲשֶׁר לֹא תוּכַל לְהֵרָפֵא
  choice: 使你无法痊愈
  rationale: 保留原文“不能得到医治”的被动、不可治愈之意，并以自然现代汉语表达其结果。
theological_decisions:
- issue: 四字神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: “耶和华”是简体中文读者最熟悉的专名形式，明确保留神的名字而非改译为“主”；“雅威”是更贴近学界常见拟音的可行替代。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“用……击打你”保留原文连续使用介词列举灾病的结构；四种病症以顿号并列。脚注标记紧随其实际说明的“肿瘤”，避免误指“埃及的疮”。
