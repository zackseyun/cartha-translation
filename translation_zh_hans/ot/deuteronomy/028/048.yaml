  text: וְ/עָבַדְתָּ֣ אֶת אֹיְבֶ֗י/ךָ אֲשֶׁ֨ר יְשַׁלְּחֶ֤/נּוּ יְהוָה֙ בָּ֔/ךְ בְּ/רָעָ֧ב וּ/בְ/צָמָ֛א וּ/בְ/עֵירֹ֖ם וּ/בְ/חֹ֣סֶר כֹּ֑ל וְ/נָתַ֞ן עֹ֤ל בַּרְזֶל֙ עַל צַוָּארֶ֔/ךָ עַ֥ד הִשְׁמִיד֖/וֹ אֹתָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/048.yaml
  text: And you shall serve your enemies[a], whom Yahweh will send against you, in hunger and in thirst and in nakedness and in lack of everything[b]; and he will put an iron yoke on your neck until he has destroyed you.
translation:
  language: zh_hans
  text: 你必在饥饿、干渴、赤身、缺乏一切的境况中，服侍雅威派来攻击你的仇敌；他必把铁轭加在你的颈项上，直到将你毁灭。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他必把……直到将你毁灭”中的主语，也可理解为前文的“仇敌”；正文则把雅威视为延续的主语。
    reason: alternative_reading
lexical_decisions:
- source_word: וְעָבַדְתָּ
  choice: 你必……服侍
  rationale: 此处指在敌人权下被迫服役，并非敬拜；“必”保留盟约咒诅的宣告和预告语气。
- source_word: אֹיְבֶיךָ
  choice: 你的仇敌
  rationale: 直接表达敌对者之意，也符合庄重而自然的现代汉语。
- source_word: אֲשֶׁר יְשַׁלְּחֶנּוּ יְהוָה בָּךְ
  choice: 雅威派来攻击你的
  rationale: בָּךְ在这里表示敌对方向；“攻击你”清楚传达雅威差遣仇敌临到以色列施行敌对行动。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译直接呈现四字神名。
- source_word: בְּרָעָב וּבְצָמָא וּבְעֵירֹם וּבְחֹסֶר כֹּל
  choice: 在饥饿、干渴、赤身、缺乏一切的境况中
  rationale: 保留四项匮乏层层累加的结构；加入“境况中”使连续的בְּ结构在现代汉语中清楚自然。
- source_word: וְנָתַן
  choice: 他必把……加在
  rationale: “加在颈项上”是轭这一意象的自然汉语表达；正文让“他”承接前句的雅威，同时以脚注保留主语歧义。
- source_word: עֹל בַּרְזֶל
  choice: 铁轭
  rationale: 简洁保留“铁制的轭”这一严酷奴役和辖制的具体意象。
- source_word: עַל צַוָּארֶךָ
  choice: 在你的颈项上
  rationale: 直接保留负轭受制的身体意象；“颈项”符合经文庄重语体。
- source_word: עַד הִשְׁמִידוֹ אֹתָךְ
  choice: 直到将你毁灭
  rationale: 准确表达שׁמד使役形的严重含义，不另行加强为“灭绝”；省略重复代词使汉语流畅，主语歧义由脚注说明。
theological_decisions:
- issue: וְנָתַן和הִשְׁמִידוֹ的主语
  choice: 正文将雅威视为延续的主语：“他必……直到将你毁灭。”
  alternative: 也可将前文的仇敌理解为主语：“仇敌必……直到将你毁灭。”
  rationale: 最近的明确单数主语是雅威，后续单数动词可自然承接；但希伯来文并未再次明说主语，仇敌作为实施者在语法和语境上也有可能，因此用脚注保留歧义。
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较贴近当代学界通常采用的拟音，同时不以称号替代专名。
translation_notes:
  register: 采用庄重、清晰的现代标准汉语。句首集中呈现四重匮乏，以顿号保留原文的累积力度；“服侍”在此按受敌人奴役、服役理解。没有为“铁轭／铁制的轭”另设脚注，因为两种说法在汉语中没有实质意义差别。
