  naturalness: 修订后的“消耗性疾病”虽较书面，但在疾病名称未能精确确定的语境中自然、清楚；“这些灾祸必追赶你”符合庄重的现代汉语和原文复数动词。
  terminology: 采用“雅威”以落实对 יהוה 的既定译名。“消耗性疾病”避免将 שַׁחֶפֶת 误限于结核病；“焦枯”和“霉病”分别对应农作物的枯焦性灾害与霉害，保留原词在具体病因上的不确定性。
