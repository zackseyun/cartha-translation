revisions:
- from: 耶和华必用痨病[a]、热病、炎症、灼热、刀剑、旱风和霉病击打你；这些灾祸必追赶你，直到你灭亡。[b]
  to: 雅威必用消耗性疾病[a]、热病、炎症、灼热、刀剑、焦枯和霉病击打你；这些灾祸必追赶你，直到你灭亡。[b]
  rationale: 将神名改为“雅威”，使中文与 Yahweh 的项目既定译法一致。将“痨病”改为“消耗性疾病”，避免不当的现代医学特指，并同步修改脚注。将“旱风”改为“焦枯”，较准确表达 שִׁדָּפוֹן 所指的灼热造成的农作物枯焦／灾害，而不把它限定为一种风。其余结构、并列项目和复数回指均予保留。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T04:57:35Z'
