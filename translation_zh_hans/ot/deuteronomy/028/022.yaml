base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/022.yaml
  text: Yahweh will strike you with wasting disease[a], with fever, with inflammation, with burning heat, with the sword, with blight, and with mildew[b]; and they will pursue you until you perish.
translation:
  language: zh_hans
  text: 雅威必用消耗性疾病[a]、热病、炎症、灼热、刀剑、焦枯和霉病击打你；这些灾祸必追赶你，直到你灭亡。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“消瘦病”；原词指使人消瘦衰弱的疾病，并不必然专指肺结核。
    reason: lexical_alternative
  - marker: b
    text: 原文“追赶”使用复数形式，所指是前面列举的各种疾病和灾祸。
    reason: grammatical_clarification
lexical_decisions:
- source_word: יַכְּכָה
  choice: 必……击打你
  rationale: נכה 的使役形在此表示“击打、打击”；保留直接针对第二人称单数的惩罚语气。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的专名“耶和华”呈现四字神名，而不以称号代替。
- source_word: שַׁחֶפֶת
  choice: 痨病
  rationale: 指使人衰弱消瘦的疾病；“痨病”简明且不武断地限定为现代医学上的肺结核。
- source_word: קַּדַּחַת
  choice: 热病
  rationale: 表示发热性疾病；“热病”自然清楚，并与后面的炎症、灼热有所区分。
- source_word: דַּלֶּקֶת
  choice: 炎症
  rationale: 该词与燃烧、发炎有关；“炎症”直接传达其常见含义。
- source_word: חַרְחֻר
  choice: 灼热
  rationale: 这是罕见词，可能指灼人的热气或灼热病症；采用较宽泛的“灼热”以保留不确定性。
- source_word: חֶרֶב
  choice: 刀剑
  rationale: 按通常词义直译，并可自然涵盖战争或暴力死亡。
- source_word: שִׁדָּפוֹן
  choice: 旱风
  rationale: 指因灼热、干燥条件造成的庄稼枯萎灾害；“旱风”保留其自然灾害意象，并与霉病区分。
- source_word: יֵרָקוֹן
  choice: 霉病
  rationale: 在农作物语境中指使植物变黄、败坏的病害；“霉病”是清楚而不过度具体的对应。
- source_word: וּרְדָפוּךָ
  choice: 这些灾祸必追赶你
  rationale: 希伯来语动词为复数，回指前列的疾病与灾害；补出“这些灾祸”，使中文自然并保留复数所指。
- source_word: עַד אָבְדֶךָ
  choice: 直到你灭亡
  rationale: אבד 表示灭亡、归于毁灭；此译保持直接称呼和结果的严厉性。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。中文正文采用长期通行且普通读者熟悉的专名“耶和华”，不以“主”等称号取代；“雅威”是另一种可能的音译。
- issue: 追赶者的所指
  choice: 这些灾祸必追赶你
  alternative: 它们必追赶你
  rationale: 原文动词为复数，最自然地回指前面列举的疾病和灾害。明确译作“这些灾祸”避免中文代词指向不清，但不把它们人格化为独立行动者。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。疾病和农业灾害按原文逐项并列；对罕见词 חַרְחֻר 不作过度医学化处理。正文补出“这些灾祸”，既符合现代汉语，又反映复数动词。
