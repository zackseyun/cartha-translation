base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/006.yaml
  text: Blessed shall you be when you come in[b][a], and blessed shall you be when you go out.
translation:
  language: zh_hans
  text: 你进来必蒙福，你出去也必蒙福。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文的“你”是单数，作为整体称呼以色列。“进来……出去”也可译作“在你进来的时候……在你出去的时候”；这组表达可能泛指生活和活动的全过程。
    reason: 说明语法上的集体单数，并保留该首尾式表达的词义范围。
lexical_decisions:
- source_word: בָּרוּךְ
  choice: 必蒙福
  rationale: 该词是 ברך 的被动分词，在盟约祝福语境中作谓语；“必蒙福”既表达被动受福，也体现本段宣告将来结果的语气。
- source_word: אַתָּה
  choice: 你
  rationale: 原文为第二人称阳性单数，以单数形式把以色列作为整体来称呼；现代汉语“你”保留这一形式。
- source_word: בְּבֹאֶךָ
  choice: 你进来
  rationale: 由介词 ב、בוא 的不定词构造式及第二人称阳性单数后缀组成，表示“在你进来时”；译作“你进来”自然简洁，并保留实际进出的意象。
- source_word: וּבָרוּךְ
  choice: 也必蒙福
  rationale: 保留连接词及重复的祝福宣告，同时用“也”形成自然、对称的汉语平行句。
- source_word: בְּצֵאתֶךָ
  choice: 你出去
  rationale: 由介词 ב、יצא 的不定词构造式及第二人称阳性单数后缀组成，表示“在你出去时”；与“进来”相对，可合指日常生活和一切活动。
theological_decisions:
- issue: 以单数称呼作为整体的以色列
  choice: 正文保留单数“你”，并以脚注说明其集体指向。
  alternative: 译成“你们”，或明确改写为“以色列”。
  rationale: 希伯来文使用第二人称阳性单数，这是申命记中以盟约对象的身份称呼以色列整体的常见方式；保留“你”可避免在正文中作解释性扩写。
- issue: “进来／出去”的表达范围
  choice: 正文保留具体而对称的“进来／出去”，脚注说明这组表达可概括生活与活动的全过程。
  alternative: 直接意译为“你无论做什么都必蒙福”或“你一生都必蒙福”。
  rationale: 原文的首尾式表达既有字面行动意象，也可能泛指全部日常生活；保留原有张力比直接限定为某一种解释更合适。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“必蒙福”保持盟约祝福宣告的节奏；两句结构对称。脚注标记置于整节末尾，涵盖单数称呼及“进来／出去”两项说明。
