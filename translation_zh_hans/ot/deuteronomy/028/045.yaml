  rationale: 仅作必要的汉语语法与脚注表述修订。“你的上帝”使领属关系符合现代标准汉语；破折号保留“雅威”与“你的上帝”的同位称谓。以“以遵守”衔接不定式，既忠于原文，也不强行裁定其细微句法功能。
