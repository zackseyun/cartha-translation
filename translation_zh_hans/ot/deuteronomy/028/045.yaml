source:
  edition: WLC
  text: וּ/בָ֨אוּ עָלֶ֜י/ךָ כָּל הַ/קְּלָל֣וֹת הָ/אֵ֗לֶּה וּ/רְדָפ֨וּ/ךָ֙ וְ/הִשִּׂיג֔וּ/ךָ עַ֖ד הִשָּֽׁמְדָ֑/ךְ כִּי לֹ֣א שָׁמַ֗עְתָּ בְּ/קוֹל֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ לִ/שְׁמֹ֛ר מִצְוֺתָ֥י/ו וְ/חֻקֹּתָ֖י/ו אֲשֶׁ֥ר צִוָּֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/045.yaml
  text: And all these curses will come upon you and pursue you and overtake you[a], until you are destroyed, because you did not listen to the voice of Yahweh your God, to keep his commandments and his statutes that he commanded you.
translation:
  language: zh_hans
  text: 这一切咒诅都必临到你，追赶你，赶上你，直到你被毁灭；因为你没有听从雅威——你的上帝——的声音，以遵守他所吩咐你的诫命和律例。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “听从雅威——你的上帝——的声音，以遵守……”也可译作“顺服雅威你的上帝，遵守他所吩咐你的诫命和律例”。希伯来文直译为“听从……的声音”；这一说法常含有顺服之意。
    reason: 说明 שָׁמַע בְּקוֹל 的习语意义，同时保留正文的听觉意象。
lexical_decisions:
- source_word: וּבָאוּ עָלֶיךָ כָּל הַקְּלָלוֹת הָאֵלֶּה
  choice: 这一切咒诅都必临到你
  rationale: 在盟约警告的语境中，连词加完成式指向将来的后果；“必临到你”既传达未来性，也保留庄重而确定的语气。
- source_word: וּרְדָפוּךָ וְהִשִּׂיגוּךָ
  choice: 追赶你，赶上你
  rationale: 保留两个连续动词及其递进画面：咒诅先追赶，继而赶上；“赶上”比抽象的“临到”更准确地呈现 נשׂג。
- source_word: עַד הִשָּׁמְדָךְ
  choice: 直到你被毁灭
  rationale: 不定式结构表达终点或结果；采用被动式，不额外指定毁灭的直接施行者。
- source_word: כִּי לֹא שָׁמַעְתָּ בְּקוֹל
  choice: 因为你没有听从……的声音
  rationale: שׁמע בקול兼有聆听与服从之义；“听从……的声音”在现代汉语中自然，并保留希伯来文的听觉意象。
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: 雅威你上帝
  rationale: 以“雅威”音译四字神名，保留经文直接使用的盟约之名；“你上帝”保持第二人称单数的盟约称谓。
- source_word: לִשְׁמֹר מִצְוֺתָיו וְחֻקֹּתָיו
  choice: 遵守他的诫命和律例
  rationale: לִשְׁמֹר说明听从的具体内容或表现；“诫命”和“律例”保留两个相关而有区别的法律术语。
- source_word: אֲשֶׁר צִוָּךְ
  choice: 他所吩咐你的
  rationale: 作为关系从句修饰“诫命和律例”，明确这些规范出于上帝的吩咐，同时符合自然汉语语序。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；以“主”代称
  rationale: 原文直接使用四字神名；音译“雅威”较直接地保留其专名性质，避免以称号代替，也不把较晚形成的“耶和华”读音带入正文。
- issue: שָׁמַע בְּקוֹל 是译作“听从声音”还是仅译作“顺服”
  choice: 听从雅威你上帝的声音
  alternative: 不顺服雅威你的上帝
  rationale: “听从”能表达顺服含义，同时保留原文以听见声音描绘盟约回应的修辞，不将其完全抽象化。
- issue: לִשְׁמֹר 与前句的句法关系
  choice: 正文以“遵守”承接“听从”，脚注说明也可理解为“借着遵守”
  alternative: 明确译成“为要遵守”或“借着遵守”
  rationale: 希伯来文不定式可表达听从的内容、目的或实际表现；正文保持简洁和一定开放性，脚注交代较明确的顺服性理解。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“咒诅—追赶—赶上—毁灭”的连续动作完整保留原文力度；使用第二人称单数“你”，不添加性别词。脚注标记置于整句末，所注释的是后半句“听从……的声音，遵守……”的表达。
