base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/068.yaml
  text: And Yahweh will bring you back to Egypt in ships[a], by the way of which I said to you, ‘You shall never see it again.’ And there you will offer yourselves for sale to your enemies as male slaves and female slaves, but there will be no buyer.
translation:
  language: zh_hans
  text: 耶和华必使你们乘船回到埃及，走我曾对你们说：“你们再也不会见到这条路”的那条路。在那里，你们要把自己卖给仇敌，作男奴和女奴[a]，却无人购买。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “把自己卖给仇敌，作男奴和女奴”也可译作“被卖给仇敌，作男奴和女奴”。这里的希伯来语动词既可理解为反身意义，也可较宽泛地表示沦为奴隶。
    reason: lexical_alternative
lexical_decisions:
- source_word: וֶהֱשִׁיבְךָ
  choice: 必使你们……回到
  rationale: 使役形态表达耶和华使以色列人返回；中文用“使……回到”保留使役意义。希伯来文以单数“你”集体指以色列，正文按现代汉语自然表达译为“你们”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 直接音译四字神名，采用现代简体中文圣经语境中通行且庄重的形式，不以称号替代专名。
- source_word: מִצְרַיִם
  choice: 埃及
  rationale: 标准地名译法。
- source_word: בָּאֳנִיּוֹת
  choice: 乘船
  rationale: 介词加复数“船”在此表示运输方式；“乘船”是自然、准确的现代汉语。
- source_word: בַּדֶּרֶךְ אֲשֶׁר אָמַרְתִּי לְךָ
  choice: 就是我曾对你们说……的那条路
  rationale: 保留“路”与后接关系从句的联系，也让中文句法清楚自然。
- source_word: לֹא תֹסִיף עוֹד לִרְאֹתָהּ
  choice: 你们再也不会见到
  rationale: יסף与עוד构成不再重复某动作的习语；“再也不会见到”准确传达其强烈否定。宾语阴性后缀按先行词“路”处理。
- source_word: וְהִתְמַכַּרְתֶּם
  choice: 要把自己卖给
  rationale: Hitpael形态可作反身或中间意义；正文以“把自己卖给”保留反身色彩，但不暗示交易必然成交，因为下文明确说无人购买。脚注说明另一种可能。
- source_word: לַעֲבָדִים וְלִשְׁפָחוֹת
  choice: 作奴隶和婢女
  rationale: 保留原文男性奴隶与女性奴隶的并列区分；“婢女”在此明确指女性奴隶，并非普通女仆。
- source_word: וְאֵין קֹנֶה
  choice: 却无人购买
  rationale: 原文直译为“没有买主”；“却无人购买”自然承接前面的卖身行为，并突出连奴隶也卖不出去的极端困境。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。中文正文保留为专名；采用“耶和华”是因其在现代标准汉语圣经传统中最通行、最易为普通读者识别，并不以“主”等称号取代。
- issue: 返回埃及与先前应许之间的张力
  choice: 保留“再也不会见到”的绝对措辞
  alternative: 弱化为“不必再走这条路”
  rationale: 原文以强烈否定表达先前的话，本节则宣告审判性的逆转；译文不替读者消解这一神学张力。
- issue: וְהִתְמַכַּרְתֶּם的语态意义
  choice: 把自己卖给
  alternative: 被卖给
  rationale: 该动词形态可有反身或较宽泛的进入奴役之意。正文选反身表达，脚注保留被动理解，避免把有争议的语态解释绝对化。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。保留原文的审判力度、性别配对及“卖身却无人购买”的反常张力；不作解释性扩写。
