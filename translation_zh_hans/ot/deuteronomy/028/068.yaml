revisions:
- from: 耶和华必使你们乘船回到埃及，就是我曾对你们说“你们再也不会见到”的那条路。在那里，你们要把自己卖给仇敌作奴隶和婢女[a]，却无人购买。
  to: 耶和华必使你们乘船回到埃及，走我曾对你们说：“你们再也不会见到这条路”的那条路。在那里，你们要把自己卖给仇敌，作男奴和女奴[a]，却无人购买。
  rationale: 修正“就是”导致的句法误读，明确人们是回到埃及并走那条先前被禁止再见的路；将性别成对的奴隶术语改为“男奴和女奴”，以更准确、现代地反映原文。其余内容及脚注所保留的动词语态歧义不变。
