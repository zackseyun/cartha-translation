base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/050.yaml
  text: a fierce-faced nation[c][b][a], one that shows no regard for the old and shows no favor to the young.
translation:
  language: zh_hans
  text: 一个面目凶狠的民族[a]，不尊重老人[b]，也不恩待年轻人[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“一个脸面刚强（或凶猛）的民族。”
    reason: lexical_alternative
  - marker: b
    text: 或译：“不顾惜老人。”希伯来语习语直译是“不抬起老人的脸”。
    reason: lexical_alternative
  - marker: c
    text: 或译：“不怜悯年轻人。”
    reason: lexical_alternative
lexical_decisions:
- source_word: גּוֹי
  choice: 民族
  rationale: 此词指民族或族群；在盟约咒诅的上下文中，指前来侵略的外族势力。“民族”既准确又符合现代汉语表达。
- source_word: עַז פָּנִים
  choice: 面目凶狠
  rationale: 原文直译近于“脸面刚强/凶猛”。“面目凶狠”保留“脸面”的形象，同时自然传达其冷酷强悍的神态。
- source_word: אֲשֶׁר
  choice: （以逗号引出说明）
  rationale: 关系词引出描述该民族的从句。汉语无需另译“它是一个……的”，直接用逗号承接更自然。
- source_word: לֹא יִשָּׂא פָנִים לְזָקֵן
  choice: 不尊重老人
  rationale: נָשָׂא פָּנִים字面为“抬起脸”，可表示顾惜、尊重或施以优待。这里以老人和年轻人对举，“不尊重老人”清楚表达其不因年长而有所顾念。
- source_word: זָקֵן
  choice: 老人
  rationale: 单数在此作类别性的泛指。“老人”简洁自然，也不必限定为某一位男性老人。
- source_word: וְנַעַר
  choice: 年轻人
  rationale: נַעַר可指孩童、少年或青年；与“老人”对举时，“年轻人”最能保留其较宽的年龄范围。
- source_word: לֹא יָחֹן
  choice: 不恩待
  rationale: חנן的核心意义是施恩、施惠或怜恤。“不恩待”保留“施恩”的词义，并与前句形成平衡；脚注注明“怜悯”这一语境上较强的可能译法。
theological_decisions: []
