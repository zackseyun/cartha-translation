  text: וְ/אָכַלְתָּ֣ פְרִֽי בִטְנְ/ךָ֗ בְּשַׂ֤ר בָּנֶ֨י/ךָ֙ וּ/בְנֹתֶ֔י/ךָ אֲשֶׁ֥ר נָֽתַן לְ/ךָ֖ יְהוָ֣ה אֱלֹהֶ֑י/ךָ בְּ/מָצוֹר֙ וּ/בְ/מָצ֔וֹק אֲשֶׁר יָצִ֥יק לְ/ךָ֖ אֹיְבֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/053.yaml
  text: And you will eat the fruit of your womb[a], the flesh of your sons and daughters whom Yahweh your God has given you[b], in the siege and in the distress with which your enemy will oppress you.
translation:
  language: zh_hans
  text: 你必吃你腹中所生的[a]，就是雅威你神赐给你的儿子和女儿的肉；在仇敌围困你、使你陷入困苦[b]时，你必如此行。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“你腹中的果实”，即你亲生的后代。
    reason: lexical_alternative
  - marker: b
    text: “困苦”也可译作“窘迫”或“痛苦”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָכַלְתָּ
  choice: 你必吃
  rationale: 连词加Qal完成式第二人称阳性单数，在盟约咒诅的语境中表达将来必然发生的结果；“必吃”兼顾预告与严肃语气。
- source_word: פְרִי בִטְנְךָ
  choice: 自己腹中所生的
  rationale: 原文直译为“你腹中的果实”，指亲生后代。正文采用自然的现代汉语表达，并以脚注保留原文意象。
- source_word: בְּשַׂר בָּנֶיךָ וּבְנֹתֶיךָ
  choice: 你儿女的肉
  rationale: 原文明说“儿子和女儿的肉”。汉语“儿女”准确涵盖两者，“肉”保留围城食人语境中刻意而严酷的表达。
- source_word: אֲשֶׁר נָתַן לְךָ יְהוָה אֱלֹהֶיךָ
  choice: 雅威你神赐给你的
  rationale: 保留关系从句以及儿女是神所赐的含义，从而保存咒诅话语中的反差和力度。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文四字神名的常见学术拟音译出专名，不以“主”替代，也不采用源自另一种传统读法的“耶和华”。
- source_word: בְּמָצוֹר וּבְמָצוֹק
  choice: 围困你、使你陷入窘境时
  rationale: 两个名词分别表达围城与极度窘迫；转换为自然的汉语时间结构，同时保留两层处境。
- source_word: אֲשֶׁר יָצִיק לְךָ אֹיְבֶךָ
  choice: 仇敌围困你、使你陷入
  rationale: צוּק的使役形表达施压、逼迫或使人陷入困境；结合围城语境译为敌人造成围困和窘迫。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用以色列神的专名。译作“雅威”保留专名性质及较通行的学术拟音，避免用称号取代，也不把有争议的传统发音当作确定读音。
- issue: 盟约咒诅中食子的直白描写
  choice: 明确译作“吃……儿女的肉”
  alternative: 以“吞食自己的儿女”等较概括说法弱化
  rationale: 原文有意使用“肉”这一强烈词语，揭示围城审判的惨烈；译文不淡化，也不添加原文没有的解释。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“必”体现咒诅预告的确定性；“儿女”自然对应原文明确提到的儿子和女儿。末句补出“你必这样做”，使中文语法完整，并回指前述吃儿女之肉的行为，不增加新的事件。
