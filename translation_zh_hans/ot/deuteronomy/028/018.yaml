base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/018.yaml
  text: Cursed shall be the fruit of your womb[a], and the fruit of your ground[b], the offspring of your herds and the young of your flocks.
translation:
  language: zh_hans
  text: 你腹中的果子、你土地的果实[a]、你牛群所生的和羊群所生的[b]，都必受咒诅。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“你土地的出产”。希伯来文直译为“你土地的果实”，与前面的“你腹中的果子”形成平行。
    reason: lexical_alternative
  - marker: b
    text: 这里的两个希伯来语表达特指牲畜所生的幼畜或牲畜的增殖，分别涉及牛群和羊群。
    reason: cultural_note
lexical_decisions:
- source_word: אָרוּר
  choice: 都必受诅咒
  rationale: 这是盟约咒诅中的述语形容词。用“必受诅咒”表达宣告的效力及上下文所指向的结果，并以句末总括整列对象，符合现代汉语表达。
- source_word: פְּרִי בִטְנְךָ
  choice: 你腹中的果子
  rationale: 直译并保留“果子”的比喻，指人的后代，也与下句土地的“果实”形成原文中的平行。
- source_word: וּפְרִי אַדְמָתֶךָ
  choice: 你土地的果实
  rationale: אַדָמָה指土地、土壤或耕地；“土地的果实”保留原文与“腹中的果子”共享פְּרִי一词的修辞联系，同时在现代汉语中可理解为地里的出产。
- source_word: שְׁגַר אֲלָפֶיךָ
  choice: 你牛群所生的
  rationale: שְׁגַר指牛牲所生的幼畜或增殖，אֲלָפֶיךָ在此指牛牲；此译法明确表达牲畜繁衍，而不局限于某一种性别或年龄的幼牛。
- source_word: וְעַשְׁתְּרֹת צֹאנֶךָ
  choice: 和羊群繁衍的
  rationale: 该固定表达指小型牲畜所生的幼畜或群畜的增殖；“羊群繁衍的”传达其语境义，并避免把עַשְׁתְּרֹת误解为神祇名称。
