base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/028.yaml
  text: Yahweh will strike you with madness and blindness and confusion of heart[a].
translation:
  language: zh_hans
  text: 雅威必以癫狂、失明和心中的迷乱[a]击打你。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“心中的困惑”，或“心中的惊惶”。
    reason: תִמְהוֹן可指迷乱、困惑或惊惶；“心”对应לֵבָב，原文未将其含义限定为仅指情感或理智。
lexical_decisions:
- source_word: יַכְּכָה
  choice: 必……击打你
  rationale: נכה的使役式在盟约咒诅语境中表示击打或降灾；“击打”保留原文力度，“必”体现未完成式在此处的确定将来意义。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常用音译呈现四字神名，保留其作为以色列之神专名的性质，不以称号代替。
- source_word: בְּשִׁגָּעוֹן
  choice: 用癫狂
  rationale: שִׁגָּעוֹן指疯狂、精神失常；“癫狂”简洁而有尊严，也符合此处灾祸性语境。
- source_word: וּבְעִוָּרוֹן
  choice: 失明
  rationale: עִוָּרוֹן直指盲目或失明；不增译为精神上的盲目，以免消除原文可能保留的字面意义。
- source_word: וּבְתִמְהוֹן לֵבָב
  choice: 内心的迷乱
  rationale: תִמְהוֹן可表示困惑、惊惶或错乱，לֵבָב涵盖内在思想、意志与情感；“内心的迷乱”自然地保留这一宽泛意象。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；采用“雅威”作为音译，既保留专名，也避免用称号替代。
- issue: עִוָּרוֹן 是否解释为属灵或心智上的盲目
  choice: 失明
  alternative: 心眼昏暗；心智盲目
  rationale: 原文未限定其为比喻意义，且“心”只明确修饰最后一个名词，因此不作神学化扩展。
- issue: לֵבָב 的语义范围
  choice: 内心
  alternative: 心智；心
  rationale: 此词可涵盖思维、意志和情感；“内心”既自然，又不把含义局限为现代意义上的情感或理智。
translation_notes:
  register: 采用现代、庄重且易懂的简体中文。并列三种灾祸，保留盟约咒诅的强烈语气；将共同的介词 בְ 依汉语习惯统摄为“用”，避免生硬重复。
