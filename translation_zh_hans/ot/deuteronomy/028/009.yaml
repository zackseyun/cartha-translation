base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/009.yaml
  text: Yahweh will establish you for himself as a holy people[a], just as he swore to you, if you keep the commandments of Yahweh your God and walk in his ways.
translation:
  language: zh_hans
  text: 耶和华必照他向你所起的誓，立你为归他自己的圣洁子民；只要[a]你谨守耶和华你上帝的诫命，行他的道。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “只要”或译“因为”，即“因为你谨守耶和华你上帝的诫命，行他的道”。希伯来语连词可表示原因，但这里的上下文较支持条件义。
    reason: alternative_reading
lexical_decisions:
- source_word: יְקִימְךָ
  choice: 立你作
  rationale: 使役形态在此指使以色列确立并保持某种盟约身份，不是身体上的“扶起”；“立你作”自然表达由上帝确立其身份。
- source_word: לּוֹ
  choice: 归他自己的
  rationale: 保留与耶和华的归属关系，表明这子民被分别出来属于他。
- source_word: לְעַם קָדוֹשׁ
  choice: 圣洁子民
  rationale: 表达所得的身份；“圣洁”既含分别归属上帝之意，也保留该词的宗教伦理内涵。
- source_word: כַּאֲשֶׁר נִשְׁבַּע לָךְ
  choice: 照他向你所起的誓
  rationale: 体现当前应许与先前誓言之间的对应和依据。
- source_word: כִּי
  choice: 只要
  rationale: 本节祝福语境及申命记祝福与咒诅的整体结构支持条件义；“只要”在现代汉语中清楚自然。
- source_word: תִשְׁמֹר אֶת מִצְוֺת
  choice: 谨守……的诫命
  rationale: שׁמר与诫命连用时指留意遵行；“谨守”保留盟约和律法语体。
- source_word: וְהָלַכְתָּ בִּדְרָכָיו
  choice: 行他的道
  rationale: 保留希伯来文以行路喻生活行为的意象，同时符合庄重而通顺的现代中文表达。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经传统中对四字神名的专名译法，而不以称号替代。
- source_word: אֱלֹהֶיךָ
  choice: 你的上帝
  rationale: 准确传达盟约关系中的第二人称所属表达，并采用现代标准普通话用字。
theological_decisions:
- issue: 祝福从句中 כִּי 的条件性质
  choice: 译作“只要你谨守……”，将以色列被确立为圣洁子民与盟约顺服相联系。
  alternative: 也可理解为原因：“因为你谨守……”。
  rationale: 本节句法和申命记二十八章祝福—咒诅的框架较支持条件义；脚注保留原因义的真实可能，不借翻译消解其中的神学张力。
translation_notes:
  register: 采用自然、庄重、易懂的现代标准普通话。“立你作归他自己的圣洁子民”保留盟约身份与归属含义；“谨守”和“行他的道”延续经文的律法语体及道路隐喻。脚注标记置于整句末，所注释的是后半句“只要”的连词解释。
