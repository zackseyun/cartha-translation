base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/026.yaml
  text: Your carcass will become food for every bird of the sky and for the beasts of the earth[c][b][a], and there will be no one to frighten them away.
translation:
  language: zh_hans
  text: 你的尸首[a]必给空中一切飞鸟和地上的走兽作食物[b]，无人把它们吓走[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“尸体”。这里的希伯来语在审判语境中带有贬抑、受辱的意味。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“空中的飞鸟和地上的走兽”；这是天空与大地相对的固定表达，强调尸首完全暴露、蒙受羞辱。
    reason: cultural_note
  - marker: c
    text: 即无人赶走那些正在吃食尸首的飞鸟和走兽。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה
  choice: 必……作
  rationale: 在这一连串咒诅中，带连接词的完成式表达将临到的结果；结合“作食物”，译为“必……作”既自然，也保留确定的未来后果。
- source_word: נִבְלָתְךָ
  choice: 你的尸首
  rationale: נְבֵלָה指死尸，在审判语境中带有受辱、弃置的意味。“尸首”比“遗体”更能保留原文严厉而不尊荣的语气。
- source_word: לְמַאֲכָל
  choice: 作食物
  rationale: 该名词意为食物或可吃之物；介词לְ在此表达结果或用途，汉语“作食物”准确而简洁。
- source_word: לְכָל עוֹף הַשָּׁמַיִם
  choice: 给空中一切飞鸟
  rationale: עוֹף在此为集合用法，指飞禽；“空中”符合现代汉语，也避免把שָּׁמַיִם误解为神居的“天上”。
- source_word: וּלְבֶהֱמַת הָאָרֶץ
  choice: 和地上的走兽
  rationale: בְּהֵמָה在此集合性地指陆地动物。“走兽”与“飞鸟”构成自然、庄重的搭配，并保留威胁性的语气。
- source_word: וְאֵין מַחֲרִיד
  choice: 无人把它们吓走
  rationale: חרד的使役分词表示使之惊惧；上下文隐含的对象是啄食尸首的飞鸟和走兽，汉语中明说“它们”可清楚表达此意。
