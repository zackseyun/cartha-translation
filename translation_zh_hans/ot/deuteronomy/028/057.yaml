source:
  edition: WLC
  text: וּֽ/בְ/שִׁלְיָתָ֞/הּ הַ/יּוֹצֵ֣ת מִ/בֵּ֣ין רַגְלֶ֗י/הָ וּ/בְ/בָנֶ֨י/הָ֙ אֲשֶׁ֣ר תֵּלֵ֔ד כִּֽי תֹאכְלֵ֥/ם בְּ/חֹֽסֶר כֹּ֖ל בַּ/סָּ֑תֶר בְּ/מָצוֹר֙ וּ/בְ/מָצ֔וֹק אֲשֶׁ֨ר יָצִ֥יק לְ/ךָ֛ אֹיִבְ/ךָ֖ בִּ/שְׁעָרֶֽי/ךָ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/057.yaml
  text: and toward her afterbirth that comes out from between her legs[a], and toward her children whom she bears, because she will eat them secretly, in the lack of everything[c][b], during the siege and distress with which your enemy will oppress you within your gates.
translation:
  language: zh_hans
  text: 她甚至连从她两腿之间出来的胞衣[a]，以及她所生的儿女，也不肯分给人；因为在你仇敌围困你、使你在城中[b]陷入窘迫时，她因什么都缺乏[c]，就会暗中把他们吃掉。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “胞衣”指分娩时排出的胎盘及相关组织，也可译作“胎盘”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“在你的城门里”，这里指城门所围护的城镇之内。
    reason: cultural_note
  - marker: c
    text: 也可译作“因缺乏一切”或“由于什么都缺乏”，指围城时极端的物资匮乏。
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁלְיָתָהּ
  choice: 她的胞衣
  rationale: 该词指分娩后排出的胎盘及胎膜等组织。“胞衣”在现代汉语中虽略带书面色彩，却比单说“胎盘”更能涵盖原词，也适合经文庄重而骇人的语境。
- source_word: הַיֹּצֵת מִבֵּין רַגְלֶיהָ
  choice: 从她两腿之间出来的
  rationale: 保留希伯来文直接、具体的分娩描写；此处 רַגְלַיִם 按语境译作“两腿”，而非字面但易误解的“两脚”。
- source_word: וּבְבָנֶיהָ אֲשֶׁר תֵּלֵד
  choice: 也不肯给她所生的儿女
  rationale: בָּנִים 在此泛指后代，译作“儿女”比“儿子”更合语境。介词 בְּ 承接前节“恶眼相待／舍不得给”的结构，汉语补出“不肯给”，使本节作为续句自然完整。
- source_word: כִּי תֹאכְלֵם
  choice: 因为……她……会暗中把他们吃掉
  rationale: כִּי 表明她不肯分享的原因；אכל 是普通而直接的“吃”，应保留其令人震惊的具体性。复数宾语“他们”在希伯来文中可回指胞衣和儿女，不把范围缩窄。
- source_word: בְּחֹסֶר כֹּל
  choice: 因一无所有
  rationale: 表达围城中全面、极端的匮乏。汉语用因果结构自然传达介词短语在此所表示的处境或缘由。
- source_word: בַּסָּתֶר
  choice: 暗中
  rationale: 准确表达隐秘进行的副词意义，简洁自然。
- source_word: בְּמָצוֹר וּבְמָצוֹק
  choice: 围困……陷入窘迫
  rationale: מָצוֹר 是围城或围困，מָצוֹק 是受压迫而陷入的困境；在汉语句法中拆开处理，仍保留二者的语义配对。
- source_word: אֲשֶׁר יָצִיק לְךָ אֹיִבְךָ
  choice: 你仇敌围困你、使你……陷入窘迫
  rationale: צוּק 的使役形表达施加压力、逼入困境。结合前面的“围困”，如此译法具体呈现仇敌造成的压迫。
- source_word: בִּשְׁעָרֶיךָ
  choice: 在城中
  rationale: 字面是“在你的城门里”，但该惯用语指城门所代表并围护的城镇范围；直译“城门内”在现代汉语中容易被理解为门洞附近。
theological_decisions:
- issue: 复数宾语“他们”的所指
  choice: 保留复数代词，使其可回指胞衣和儿女
  alternative: 明确译成“把胞衣和儿女吃掉”或只译“把儿女吃掉”
  rationale: 希伯来文 תֹאכְלֵם 使用阳性复数宾语后缀，在协调结构中可以统摄前述对象。保留代词既符合语法，也不替原文消除其骇人而略有张力的指涉。
- issue: 本节开头与前节的句法联系
  choice: 用“甚至不肯给……也不肯给……”补明承接关系
  alternative: 孤立直译为“对着她的胞衣……和她的儿女……”
  rationale: 本节以两个 וּבְ 短语继续28:56“她的眼对……为恶／吝惜”的结构。现代汉语若不补出承接成分会语意残缺；“不肯给”也与后文暗中独食的语境吻合，但不加入额外教义解释。
translation_notes:
  register: 采用现代、庄重且普通读者可懂的书面汉语。原文是承接上一节的长句，因此补出“不肯给”以恢复汉语中的句法联系；同时保留分娩、饥荒与食人的直接而严酷的措辞，不作淡化。
