base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/069.yaml
  text: These are the words of the covenant that Yahweh commanded Moses to make with the sons of Israel in the land of Moab[a], besides the covenant that he made with them at Horeb.
translation:
  language: zh_hans
  text: 以下是耶和华吩咐摩西在摩押地与以色列人立约[a]的话；另有他在何烈山与他们所立的约。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “立约”的希伯来语字面意思是“切约”；本节后面“所立的约”所用的动词也是这一表达。
    reason: 说明希伯来语盟约习语的字面形式，同时在正文中采用自然的现代汉语。
lexical_decisions:
- source_word: אֵלֶּה דִבְרֵי הַבְּרִית
  choice: 以下是……立约的话
  rationale: 保留“这些是……约的话”这一标题式结构，同时按现代汉语语序将修饰成分前置，使句子自然清楚。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的上帝专名译法，明确保留原文的专名，而不以头衔代替。
- source_word: צִוָּה
  choice: 吩咐
  rationale: 准确表达צוה的命令含义；在上帝对摩西说话的语境中，“吩咐”庄重而自然。
- source_word: לִכְרֹת ... הַבְּרִית / כָּרַת
  choice: 立约／所立的约
  rationale: 希伯来语直译为“切约”，属于固定习语；中文用“立约”最自然，并在脚注说明其字面形式。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 该词组字面为“以色列的众子”，此处整体指以色列民族；“以色列人”既准确又符合现代汉语习惯，避免误解为仅指雅各的亲生儿子。
- source_word: בְּאֶרֶץ מוֹאָב
  choice: 在摩押地
  rationale: 保留“地”这一地理表达及盟约订立的地点。
- source_word: מִלְּבַד
  choice: 在……之外另立的
  rationale: 表达这约是在何烈山之约以外所立的另一约；“之外”保留原文的区分或附加关系，不将两约的神学关系作进一步解释。
- source_word: בְּחֹרֵב
  choice: 于何烈山
  rationale: 保留原文地名“何烈”，不与“西奈”协调；加“山”符合通行中文地名形式。
theological_decisions:
- issue: “以色列的众子”是按字面翻译还是按群体所指翻译
  choice: 以色列人
  alternative: 以色列的众子
  rationale: 该短语在这里是民族整体称谓，而非强调性别或家族中的亲生儿子；译作“以色列人”在现代汉语中准确、清楚，也不改变所指范围。
- issue: 摩押之约与何烈之约的关系
  choice: 在……所立的约之外另立的
  alternative: 不同于……所立的约
  rationale: מִלְּבַד表示“除……之外／此外”，原文本身没有详述两个约是完全分离、更新还是延续；译文只表明区分和附加关系，保留神学张力。
- issue: 后半句“他”所指为何
  choice: 明确译为“耶和华”
  alternative: 与他们所立的约
  rationale: 希伯来语动词的主语承接本句中的耶和华。中文若省略，可能被理解为摩西；重复“耶和华”可消除由目标语造成、而非原文固有的歧义。
translation_notes:
  register: 采用庄重、流畅的现代标准汉语。句式保留原文的标题性质；“立约”“何烈山”等用语延续中文圣经传统，但避免文言化。
