  to: 以下是耶和华吩咐摩西在摩押地与以色列人立约[a]的话；另有他在何烈山与他们所立的约。
  rationale: 修订仅调整后半句的句法和衔接：以“另有”直接对应原文“除了／此外”，并明确何烈之约是并列提及的另一约，避免把“另立的”误系于“话”。不预断两约之间更具体的神学或历史关系。
