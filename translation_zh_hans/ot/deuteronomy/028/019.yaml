  yaml_path: translation/ot/deuteronomy/028/019.yaml
  text: Cursed shall you be when you come in[a], and cursed shall you be when you go out.
translation:
  language: zh_hans
  text: 你进来时必受咒诅，出去时也必受咒诅[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译是“在你进来时……在你出去时”。这是希伯来语的一种成对说法，概括日常生活的整个过程。
    reason: cultural_note
lexical_decisions:
- source_word: אָרוּר
  choice: 必受咒诅
  rationale: 该词为被动分词或形容词，意为“被咒诅的”。结合申命记二十八章盟约咒诅的宣告语境，用“必受咒诅”既自然庄重，也传达宣告的确定性；并在两句中重复，以保留原文的强调和平行结构。
- source_word: אַתָּה
  choice: 你
  rationale: 原文是第二人称阳性单数，盟约形式中以单数直接称呼以色列；现代汉语用“你”可自然保留这一单数称呼。
- source_word: בְּבֹאֶךָ
  choice: 你进来
  rationale: 由介词 בְּ、动词 בוא 的不定式构造及第二人称阳性单数后缀组成，直译为“在你进来的时候”。译作“你进来”符合现代汉语表达，并与后面的“出去”构成成对说法。
- source_word: וְ
  choice: 也
  rationale: 原文连词连接两个平行分句。汉语在第二句用“也”，既表达并列，也使重复句式自然流畅。
- source_word: בְּצֵאתֶךָ
  choice: 出去
  rationale: 由介词 בְּ、动词 יצא 的不定式构造及第二人称阳性单数后缀组成，直译为“在你出去的时候”。译作“出去”与“进来”形成原文的对应表达。
theological_decisions:
- issue: 如何以自然汉语保留盟约咒诅公式的庄重和强调
  choice: 你进来必受咒诅，出去也必受咒诅。
  alternative: 你进来的时候是受咒诅的，出去的时候也是受咒诅的。
  rationale: 原文两次把“受咒诅”置于分句开头，形成庄严而强调的盟约宣告。汉语若机械前置会显得生硬，因此用两次“必受咒诅”保留重复和确定语气，同时使句子自然易懂。
- issue: “进来……出去”这一对表达的范围
  choice: 正文保留具体的“进来……出去”，脚注说明其惯用含义
  alternative: 无论日常做什么，你都必受咒诅。
  rationale: 原文使用一对方向相反的动作，可能概括日常生活的整个过程。正文保留原有意象和修辞张力，不把隐含范围直接展开为解释性译文。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“必受咒诅”适合盟约制裁的正式语境；保留“进来……出去”的平行结构，并用脚注解释其希伯来语惯用含义。
