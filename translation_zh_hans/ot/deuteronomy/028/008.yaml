base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/008.yaml
  text: Yahweh will command the blessing on you in your storehouses and in all the work of your hand[c][b][a], and he will bless you in the land that Yahweh your God is giving you.
translation:
  language: zh_hans
  text: 雅威必吩咐福气临到你的仓库[a]和你手所做的一切事[b]上；他必在雅威你的上帝正在赐给你的[c]土地上赐福给你。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“粮仓”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译“你手所伸向的一切”，是指你一切的工作或所经营的事。
    reason: lexical_alternative
  - marker: c
    text: “正在赐给”也可译作“赐给”或“将要赐给”；这里的希伯来语分词可有不同的时间表达。
    reason: alternative_reading
lexical_decisions:
- source_word: יְצַו
  choice: 必吩咐
  rationale: 保留צוה的“命令、吩咐”义及希伯来文鲜明的拟人表达，表明福气遵从雅威的命令，而不弱化为一般的“赐下”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见的音译呈现四字神名，避免用称号代替专名。
- source_word: אִתְּךָ אֶת הַבְּרָכָה
  choice: 福气与你同在
  rationale: אִתְּךָ基本义为“与你同在”；结合“吩咐福气”的结构，译文保留福气被命令与受众同在的形象。
- source_word: הַבְּרָכָה
  choice: 福气
  rationale: 在汉语中“福气”自然地表达具体临到人的福分；定冠词的特指作用由上下文体现，不生硬添加“那福气”。
- source_word: בַּאֲסָמֶיךָ
  choice: 你的仓库
  rationale: אָסָם指储藏粮食等物资的库房；“仓库”既自然又不把含义限制为某一种农业建筑。
- source_word: וּבְכֹל מִשְׁלַח יָדֶךָ
  choice: 你手所做的一切事
  rationale: 保留“手”的具体意象，同时以自然汉语表达该习语所指的一切工作或经营。
- source_word: וּבֵרַכְךָ
  choice: 他也必……赐福给你
  rationale: 将连接的完成式理解为延续前句的将来意义，并明示雅威仍是施事者。
- source_word: בָּאָרֶץ
  choice: 在……土地上
  rationale: “土地”保留申命记中这片受赐之地的盟约语境，不泛化为“国家”。
- source_word: נֹתֵן לָךְ
  choice: 正在赐给你的
  rationale: 用“正在”体现分词所表达的进行中或临近实现的赐予，同时以脚注保留一般现在或将来的可能译法。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 采用神名的现代汉语音译，以表明经文所说的是以色列的立约之神，而非仅用一个称号替代。
- issue: “土地”的盟约含义
  choice: 土地
  alternative: 地方；国家
  rationale: 保留申命记中上帝赐地的语境，不额外加入“应许之地”等解释性措辞。
- issue: 雅威“吩咐福气”的表达
  choice: 保留命令福气的拟人形象
  alternative: 雅威必赐福给你
  rationale: 原文把福气描绘为受雅威差遣或命令；保留这一张力，比直接改写成普通的赐福陈述更贴近原文。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“吩咐福气与你同在”有意保留原文鲜明的命令与拟人意象；后半句用“使……都蒙福”使仓库与手中工作两个范围在汉语中关系清楚。所有脚注标记均紧随其所说明的词语或短语。
