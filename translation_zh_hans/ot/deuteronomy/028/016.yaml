  text: אָר֥וּר אַתָּ֖ה בָּ/עִ֑יר וְ/אָר֥וּר אַתָּ֖ה בַּ/שָּׂדֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/016.yaml
  text: Cursed are you in the city[a], and cursed are you in the field.
translation:
  language: zh_hans
  text: 你在城里受咒诅[a]，在田野也受咒诅。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“处在咒诅之下”。
    reason: 词义替代译法；说明אָרוּר所表达的受咒诅状态。
lexical_decisions:
- source_word: אָרוּר
  choice: 受咒诅
  rationale: 该被动分词在无系词句中作表语，宣告立约审判下的状态。“受咒诅”简洁、自然，并保留被动含义与郑重语气。
- source_word: אַתָּה
  choice: 你
  rationale: 原文明确使用第二人称阳性单数独立代词；汉语以“你”直接表达，不另加原文没有的时态或语气成分。
- source_word: בָּעִיר
  choice: 在城里
  rationale: 介词表示地点；“在城里”是现代汉语中直接自然的表达，并与“在田野”形成对应。
- source_word: וְ
  choice: 也
  rationale: 连接两个平行分句；汉语用“也”自然呈现咒诅在两个生活领域中同样成立的累加和平行关系。
- source_word: בַּשָּׂדֶה
  choice: 在田野
  rationale: שָׂדֶה指田地或开阔的农业地带。“田野”既保留具体的乡野场景，也与“城里”共同涵盖日常生活的不同领域。
theological_decisions:
- issue: 立约咒诅公式的语气与范围
  choice: 两句均译作直接的状态宣告：“你……受咒诅”。
  alternative: “你在城里必受咒诅，在田野也必受咒诅”或“愿你……受咒诅”。
  rationale: 希伯来文是重复使用被动分词和代词的无系词表语结构，并非明确的将来预测或祈愿句。译文不加“必”或“愿”，以保留立约制裁宣告的直接性，也避免额外限定其时态或语气。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。两个分句保持紧凑平行；以“城里／田野”呈现原文覆盖城乡生活领域的对举。脚注标记置于第一次出现“受咒诅”之后。
