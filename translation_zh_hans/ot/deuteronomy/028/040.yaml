base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/040.yaml
  text: You will have olive trees throughout all your territory[a], but you will not anoint yourself with oil, because your olives will fall off.
translation:
  language: zh_hans
  text: 你的全境将有橄榄树，但你不能用油涂抹自己，因为你的橄榄[a]会掉落。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你的橄榄果／橄榄收成会掉落”，或“你的橄榄树会落果”。希伯来语以单数“你的橄榄”作集合性用法。
    reason: 保留 זֵיתֶךָ 可指橄榄果、橄榄收成，或与橄榄树落果现象相关的歧义；锚点对应正文中的“橄榄”。
lexical_decisions:
- source_word: זֵיתִים
  choice: 橄榄树
  rationale: 该复数名词可指橄榄果或橄榄树；与“全境”搭配时，理解为遍布境内的树木更符合本节农业语境。
- source_word: יִהְיוּ לְךָ
  choice: 都会有
  rationale: 希伯来语结构表达拥有或存在；“都会有”在现代汉语中自然，并保留预告将来情形的语气。
- source_word: בְּכָל גְּבוּלֶךָ
  choice: 全境
  rationale: גְּבוּל既可指边界，也可指边界以内的领土；此处指整个辖境，“全境”简洁自然。
- source_word: וְשֶׁמֶן
  choice: 油
  rationale: 原文只说“油”；上下文已明确是橄榄油，无须在正文中增补。
- source_word: לֹא תָסוּךְ
  choice: 不能用油抹身
  rationale: סוך指把油涂抹在身体上。“抹身”传达古代日常用油护理身体的行为，也避免“膏抹”可能带来的专门礼仪色彩。
- source_word: כִּי
  choice: 因为
  rationale: 清楚表达后半句是不能用油抹身的原因。
- source_word: יִשַּׁל
  choice: 会掉落
  rationale: 该动词在此描写果实从树上脱落；“掉落”自然、直观，同时不额外断定是否因早熟或其他原因。
- source_word: זֵיתֶךָ
  choice: 你的橄榄
  rationale: 原文使用单数集合名词，可指橄榄果、橄榄收成，也可能指橄榄树及其落果现象；正文采用自然的集合性“橄榄”，并以脚注保留歧义。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而通俗的标准普通话。“却不能”突出虽有遍地橄榄树、仍无法享用其油的反差；“用油抹身”按日常身体护理理解，不赋予额外礼仪含义。
