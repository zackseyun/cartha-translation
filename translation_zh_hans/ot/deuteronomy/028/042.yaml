  text: The cricket shall take possession of all your trees and the fruit of your ground[a].
translation:
  language: zh_hans
  text: 鸣虫[a]必侵夺你所有的树木和地里的出产。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“蝗虫”“蚱蜢”或“蟋蟀”；也可泛指“发出嗡鸣声的昆虫”。希伯来语“צְלָצַל”所指的确切昆虫无法确定。
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל עֵצְךָ
  choice: 你所有的树木
  rationale: כָּל表示整体范围；עֵץ在农业语境中指树木。用“你所有的树木”自然表达原文的集合意义。
- source_word: וּפְרִי אַדְמָתֶךָ
  choice: 和地里的出产
  rationale: פְרִי可指果实或出产，אֲדָמָה指土地、土壤。“地里的出产”既保留农业意象，也比逐字译作“土地的果实”更符合现代汉语。
- source_word: יְיָרֵשׁ
  choice: 占据
  rationale: 该词源于ירשׁ，基本义为取得、占有或使原有者失去产业。以害虫为主语时，“占据”保留了原文强烈的占有意味，没有直接释义为“吃尽”。
- source_word: הַצְּלָצַל
  choice: 鸣虫
  rationale: 该昆虫名称的确切物种无法确定，可能与其发出的声响有关。“鸣虫”保留昆虫及声音方面的线索，同时避免在正文中武断确定为某一物种；具体可能译法列于脚注。
