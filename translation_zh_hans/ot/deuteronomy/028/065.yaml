  text: וּ/בַ/גּוֹיִ֤ם הָ/הֵם֙ לֹ֣א תַרְגִּ֔יעַ וְ/לֹא יִהְיֶ֥ה מָנ֖וֹחַ לְ/כַף רַגְלֶ֑/ךָ וְ/נָתַן֩ יְהוָ֨ה לְ/ךָ֥ שָׁם֙ לֵ֣ב רַגָּ֔ז וְ/כִלְי֥וֹן עֵינַ֖יִם וְ/דַֽאֲב֥וֹן נָֽפֶשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/065.yaml
  text: And among those nations you will find no rest[a], and there will be no resting place for the sole of your foot; and there Yahweh will give you a trembling heart, failing eyes[c][b], and anguish of soul.
translation:
  language: zh_hans
  text: 在那些国中，你不得安歇[a]，你的脚掌也没有安息之处；雅威必在那里使你心中惊颤、眼目衰残[b]、心灵痛苦[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你不得安定下来。”
    reason: lexical_alternative
  - marker: b
    text: 直译：“眼目的衰残（或耗尽）。”这里可能不只指视力衰退，也可描写因绝望等候而眼目耗损。
    reason: lexical_alternative
  - marker: c
    text: 或译：“心灵忧伤”或“生命痛楚”。
    reason: lexical_alternative
lexical_decisions:
- source_word: תַרְגִּיעַ
  choice: 不得安歇
  rationale: 该词为 רגע 的使役式，在本处表示安定下来、得享安歇；“不得安歇”自然简洁，也保留流亡中无法安顿的含义。
- source_word: מָנוֹחַ לְכַף רַגְלֶךָ
  choice: 你的脚掌也没有安息之处
  rationale: מָנוֹחַ 可指安歇之处，כַף רֶגֶל 特指脚掌；直译其具体意象，同时保持现代汉语可读性。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，保留其作为以色列之神专名的性质，而不以称号替代。
- source_word: לֵב רַגָּז
  choice: 心中惊颤
  rationale: רַגָּז 包含颤抖、骚动和不安之意；“心中惊颤”兼顾身体意象与内心恐惧。
- source_word: כִּלְיוֹן עֵינַיִם
  choice: 眼目衰残
  rationale: כִּלְיוֹן 表示耗损、衰败或消逝；“眼目衰残”保留原文较强的耗损意象，而不限定为单纯视力下降。
- source_word: דַּאֲבוֹן נָפֶשׁ
  choice: 心灵痛苦
  rationale: דַּאֲבוֹן 可指痛苦、忧伤；נֶפֶשׁ 在此指人的内在生命。“心灵痛苦”自然庄重，并保留其较宽泛的情感与生命层面。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；音译“雅威”保留专名性质，并依据较通行的学术重构读音。
- issue: וְנָתַן 的灾祸施予表达
  choice: 使你……
  alternative: 赐给你……
  rationale: 原文明确以雅威为主语，表明这些境况属于盟约咒诅；汉语“使你”保留神的主动作用，又避免“赐给”在现代汉语中常有的正面色彩。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。句式保留原文三重灾苦的并列节奏；“脚掌”“眼目”保留希伯来文的身体意象，并用脚注呈现词义范围，不把含义限定为某一种生理或心理状态。
