base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/010.yaml
  text: Then all the peoples of the earth will see that the name of Yahweh is called upon you[a], and they will fear you.
translation:
  language: zh_hans
  text: 地上万民都会看见耶和华的名归在你身上[a]，就会惧怕你。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你是奉耶和华的名被称呼的。”希伯来语字面说，耶和华的名“被称在／称于你之上”，表示立约中的身份和归属。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאוּ
  choice: 都会看见
  rationale: 在本段祝福的连续语境中，带连接词的完成式表达将来的结果；中文用“都会看见”自然承接上文，无须机械译出“然后”。
- source_word: כָּל עַמֵּי הָאָרֶץ
  choice: 地上万民
  rationale: עַמֵּי为复数“众民、各民族”，而הָאָרֶץ在国际性语境中指全地；“地上万民”简洁而保留普世范围。
- source_word: שֵׁם יְהוָה
  choice: 耶和华的名
  rationale: 保留希伯来语所属结构，并以现代中文读者熟悉的“耶和华”音译四字神名。
- source_word: נִקְרָא עָלֶיךָ
  choice: 加在你身上
  rationale: 该被动习语直译为“被称在／置于你之上”，表示公开归属和立约身份；“加在你身上”保留原有意象，又比生硬的“被称在你身上”更自然。
- source_word: וְיָרְאוּ מִמֶּךָּ
  choice: 就会惧怕你
  rationale: יִרְאוּ在此指万民因耶和华对以色列的显明眷顾而产生的畏惧；“惧怕”保留敬畏与害怕之间的语义张力，מִמֶּךָּ按中文习惯译作宾语“你”。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。中文正文采用历史悠久且普通读者熟悉的“耶和华”，不以“主”替代专名；同时不据此加入任何宗派性解释。
- issue: נִקְרָא עָלֶיךָ这一习语的含义
  choice: 耶和华的名加在你身上
  alternative: 你是称为耶和华名下的人
  rationale: 正文尽量保存“名在其上”的希伯来意象以及被动形式，让归属、身份和公开标记等含义共同存在；脚注提供更解释性的自然中文读法。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“地上万民”保持经文气韵；“加在你身上”有意保留原文习语的具体意象，并以脚注解释其归属含义。
