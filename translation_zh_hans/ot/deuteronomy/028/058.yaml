base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/058.yaml
  text: If you are not careful to do all the words of this law that are written in this book[c][b][a], to fear this glorious and awesome name—Yahweh your God—
translation:
  language: zh_hans
  text: 你若不谨慎遵行这书[a]上所写的这律法的一切话，不敬畏[b]这荣耀而可畏的名——雅威[c]你的上帝——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“这卷书”。
    reason: lexical_alternative
  - marker: b
    text: “敬畏”所译的希伯来语兼有尊崇和惧怕之意。
    reason: lexical_alternative
  - marker: c
    text: 希伯来文作“YHWH”（יהוה）；传统上也译作“耶和华”，或以“主”代称。
    reason: alternative_reading
lexical_decisions:
- source_word: תִשְׁמֹר לַעֲשׂוֹת
  choice: 谨慎遵行
  rationale: שׁמר与עשׂה不定式连用，表示留心持守并付诸实行；“谨慎遵行”兼顾审慎留意与实际顺服。
- source_word: כָּל דִּבְרֵי הַתּוֹרָה הַזֹּאת
  choice: 这一律法的一切话
  rationale: 保留דִּבְרֵי“话、言语”的具体表达；תּוֹרָה在本节申命记的盟约语境中译为“律法”。
- source_word: הַכְּתוּבִים בַּסֵּפֶר הַזֶּה
  choice: 这书上所写的
  rationale: 准确表达被动分词“所写的”及文本载于书卷之中的意思；“书”符合现代汉语，并以脚注保留“书卷”的可能译法。
- source_word: לְיִרְאָה
  choice: 敬畏
  rationale: ירא在盟约语境中同时包含尊崇与惧怕；“敬畏”是自然且有分量的汉语表达，脚注进一步说明其惧怕层面。
- source_word: הַשֵּׁם
  choice: 名
  rationale: 保留原文以“名”指向上帝所启示的身份、声誉和临在的表达，不改写为泛称。
- source_word: הַנִּכְבָּד וְהַנּוֹרָא
  choice: 荣耀而可畏
  rationale: “荣耀”表达נכבד的尊荣与分量，“可畏”表达נורא所带来的敬惧和震慑。
- source_word: יְהוָה
  choice: 雅威
  rationale: 采用汉语中对四字神名YHWH的常见音译，以保留其作为上帝专名的性质；脚注注明原文形式及传统译法。
- source_word: אֱלֹהֶיךָ
  choice: 你的上帝
  rationale: 直接保留第二人称单数所属关系，显明“雅威”与听众之间的盟约关系。
theological_decisions:
- issue: 如何翻译神名יְהוָה
  choice: 雅威
  alternative: 耶和华；耶和华（传统上也以“主”代称）
  rationale: 原文直接使用四字神名；正文采用音译“雅威”，避免以称号取代专名，同时用脚注交代原文和传统译法。
- issue: ירא应表达“敬畏”还是较弱的“尊崇”
  choice: 敬畏
  alternative: 尊崇；惧怕
  rationale: “敬畏”保留该词兼具尊崇与惧怕的张力，既不将其软化为单纯敬重，也不缩减为纯粹恐惧。
- issue: 条件句在本节末尾未完结
  choice: 以破折号收束本节
  alternative: 以句号结束
  rationale: 本节是“若……”条件从句，结果要到下一节才出现；破折号保留原文跨节延续的句法，不将本节误作完整陈述。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“谨慎遵行”体现盟约劝诫语气；“荣耀而可畏”保留庄严与震慑并存的张力。句末破折号显示条件句延续至下一节。
