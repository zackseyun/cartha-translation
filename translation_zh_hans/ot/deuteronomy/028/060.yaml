  text: וְ/הֵשִׁ֣יב בְּ/ךָ֗ אֵ֚ת כָּל מַדְוֵ֣ה מִצְרַ֔יִם אֲשֶׁ֥ר יָגֹ֖רְתָּ מִ/פְּנֵי/הֶ֑ם וְ/דָבְק֖וּ בָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/060.yaml
  text: And he will bring back upon you all the diseases of Egypt that you dreaded[c][b][a], and they will cling to you.
translation:
  language: zh_hans
  text: 耶和华必使你所惧怕的埃及一切疾病重临你身，并且这些疾病必缠住你。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהֵש״יב בְּךָ
  choice: 必使……重临你身
  rationale: שׁוב 的使役式表示“使返回、使再次来到”；结合介词 בְּךָ 和灾病语境，“使……重临你身”既保留“回来”的含义，也符合现代汉语表达。
- source_word: כָּל מַדְוֵה מִצְרַיִם
  choice: 埃及一切疾病
  rationale: מַדְוֶה 指疾病、病患；“埃及一切疾病”直接保留原文范围与所属关系，不把它过度限定为某几种灾病。
- source_word: אֲשֶׁר יָגֹרְתָּ מִפְּנֵיהֶם
  choice: 你所惧怕的
  rationale: יגר 表示害怕、畏惧；关系从句中的复数代词回指“疾病”。“你所惧怕的”自然简洁，也保留恐惧的语义力度。
- source_word: וְדָבְקוּ בָּךְ
  choice: 并且这些疾病必缠住你
  rationale: דבק 表示粘附、紧贴、不离开。“缠住”在现代汉语中生动表达疾病持续附着、难以摆脱的形象；补出“这些疾病”以明确复数主语。
theological_decisions:
- issue: וְהֵשִׁיב 的主语是否明说
  choice: 译出“耶和华”
  alternative: 译作“他”或省略主语
  rationale: 本节希伯来文动词为第三人称阳性单数，主语由上文延续，指施行盟约咒诅的耶和华。中文若只说“他”在单节呈现中指代不清，因此明确译出，但不添加原文之外的神学解释。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“重临你身”保留使役式“使之返回”的意味；“缠住你”传达 דבק 的持续附着意象。未照搬英文脚注，因为“疾病”“惧怕”“缠住”已直接而充分地呈现原文，此处无需另列对出版理解帮助有限的近义说法。
