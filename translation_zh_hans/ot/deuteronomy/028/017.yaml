lexical_decisions:
- source_word: אָרוּר
  choice: 必受诅咒
  rationale: 希伯来语为被动分词，用于无系词的咒诅宣告。译作“必受诅咒”既体现盟约咒诅的确定性，也符合现代汉语表达。
- source_word: טַנְאֲךָ
  choice: 你的篮子
  rationale: טֶנֶא 指篮子，常用于盛放收获的农产品；“篮子”准确且不过度限定其用途。
- source_word: וּמִשְׁאַרְתֶּךָ
  choice: 和揉面盆
  rationale: מִשְׁאֶרֶת 指揉制面团所用的容器。“揉面盆”在现代汉语中清楚自然，并保留日常食物制作的含义。
