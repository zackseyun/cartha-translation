  text: יִתֶּנְ/ךָ֨ יְהוָ֥ה נִגָּף֮ לִ/פְנֵ֣י אֹיְבֶי/ךָ֒ בְּ/דֶ֤רֶךְ אֶחָד֙ תֵּצֵ֣א אֵלָ֔י/ו וּ/בְ/שִׁבְעָ֥ה דְרָכִ֖ים תָּנ֣וּס לְ/פָנָ֑י/ו וְ/הָיִ֣יתָ לְ/זַעֲוָ֔ה לְ/כֹ֖ל מַמְלְכ֥וֹת הָ/אָֽרֶץ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/025.yaml
  text: Yahweh will give you over as defeated before your enemies. You will go out against them by one way[a], and by seven ways you will flee before them, and you will become a horror to all the kingdoms of the earth.
translation:
  language: zh_hans
  text: 雅威必使你在仇敌面前败北。你要沿着一条路出去迎战他们，却要沿着七条路从他们面前逃跑；你必成为使地上万国惊骇的对象[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“成为地上万国的恐怖。”这个希伯来词既可表示“惊骇、恐怖”，也可指引起惊骇的对象。
    reason: 保留 זַעֲוָה 可表示感受本身或造成该感受之对象的词义幅度。
lexical_decisions:
- source_word: יִתֶּנְךָ נִגָּף
  choice: 必使你……败北
  rationale: 直译结构是“把你交付为被击败的”；在本节军事语境中，现代汉语用“使你……败北”自然表达被交给失败结局的含义。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来语神名的通行学术读音音译为“雅威”，保留专名，不以称号替代。
- source_word: לִפְנֵי אֹיְבֶיךָ
  choice: 在仇敌面前
  rationale: 保留原文“在……面前”的战场意象，表示在敌军面前遭到击败。
- source_word: בְּדֶרֶךְ אֶחָד
  choice: 从一条路
  rationale: 保留“一条路”与后文“七条路”的鲜明对照，表现整齐出战与四散溃逃。
- source_word: תֵּצֵא אֵלָיו
  choice: 出去迎战他们
  rationale: יצא אל在军事语境中表示出战迎敌；代词依其复数先行词“仇敌”译为“他们”，符合现代汉语表达。
- source_word: וּבְשִׁבְעָה דְרָכִים
  choice: 却要从七条路
  rationale: 保留具体数字和道路意象；“七条路”在对比中传达彻底溃散，也不排除字面图像。
- source_word: תָּנוּס לְפָנָיו
  choice: 从他们面前逃跑
  rationale: נוס明确表示逃跑；“从……面前”保留原文介词关系和战败溃逃的场景。
- source_word: וְהָיִיתָ לְזַעֲוָה
  choice: 你必成为……惊骇的对象
  rationale: זַעֲוָה可指惊骇、恐怖，也可指引发这种感受的对象；正文采用自然汉语明确其对列国造成的震骇，脚注保留较直接的另一译法。
- source_word: לְכֹל מַמְלְכוֹת הָאָרֶץ
  choice: 地上万国
  rationale: מַמְלְכוֹת הָאָרֶץ在此具有广泛国际范围；“地上万国”简洁庄重，并符合申命记咒诅语境。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；正文以“雅威”音译其较通行的学术读音，保留圣约神名而不改译为头衔。
- issue: לְזַעֲוָה 所描绘的咒诅后果
  choice: 成为……惊骇的对象
  alternative: 成为……的恐怖
  rationale: 译文只呈现以色列的败亡将震骇列国这一公开后果，不引入原文未明说的后期神学范畴；脚注保留该词可作抽象名词理解的张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“一条路／七条路”保留原文排比；以“却”显明整齐出战与四散溃逃的反差。
