  text: בַּ/בֹּ֤קֶר תֹּאמַר֙ מִֽי יִתֵּ֣ן עֶ֔רֶב וּ/בָ/עֶ֥רֶב תֹּאמַ֖ר מִֽי יִתֵּ֣ן בֹּ֑קֶר מִ/פַּ֤חַד לְבָֽבְ/ךָ֙ אֲשֶׁ֣ר תִּפְחָ֔ד וּ/מִ/מַּרְאֵ֥ה עֵינֶ֖י/ךָ אֲשֶׁ֥ר תִּרְאֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/067.yaml
  text: In the morning you will say[a], “If only it were evening!” and in the evening you will say, “If only it were morning!” because of the dread of your heart that you will dread[b], and because of the sight your eyes will see.
translation:
  language: zh_hans
  text: 早晨，你会说[a]：“巴不得是晚上！”晚上，你会说：“巴不得是早晨！”因为你心中所惧怕的恐惧[b]，也因为你将看见的景象。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“谁能给我晚上／早晨？”这是表达渴望的习语，因此译作“巴不得是晚上／早晨！”
    reason: lexical_alternative
  - marker: b
    text: 或译：“因为你心中的恐惧……也因为你将看见的事。”
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּבֹּקֶר
  choice: 早晨
  rationale: 这是带定冠词的时间短语；汉语用“早晨”自然简洁，并与下文“晚上”形成对应。
- source_word: תֹּאמַר
  choice: 你会说
  rationale: Qal未完成式第二人称阳性单数在咒诅语境中表示将来的情形，而非命令。
- source_word: מִי יִתֵּן
  choice: 巴不得现在是
  rationale: 该希伯来习语字面为“谁能给……”，实际表达强烈愿望；“巴不得”既自然又保留迫切的渴望，“现在”明确昼夜难熬、盼望时刻转换的语境含义。
- source_word: עֶרֶב / בֹּקֶר
  choice: 晚上 / 早晨
  rationale: 采用现代汉语常用时间词，保留原文早晚相对的平行结构。
- source_word: מִפַּחַד לְבָבְךָ אֲשֶׁר תִּפְחָד
  choice: 因为你心里所惧怕的恐惧
  rationale: מִן按因果关系译为“因为”；“心里”自然表达 לְבָבְךָ。“惧怕的恐惧”刻意保留原文名词与同根动词的重复及其强烈语气。
- source_word: וּמִמַּרְאֵה עֵינֶיךָ אֲשֶׁר תִּרְאֶה
  choice: 也因为你亲眼将看见的景象
  rationale: מַרְאֶה在此指令人惊恐的所见景象；“亲眼看见”自然而鲜明地保留“你的眼睛……看见”的具体性，避免生硬直译。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。正文保留原文的早晚平行、因果结构和“惧怕／恐惧”的同根重复；对“眼睛所见”则以自然的“亲眼看见”表达其具体性。
