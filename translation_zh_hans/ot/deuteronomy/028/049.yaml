  text: יִשָּׂ֣א יְהוָה֩ עָלֶ֨י/ךָ גּ֤וֹי מֵ/רָחוֹק֙ מִ/קְצֵ֣ה הָ/אָ֔רֶץ כַּ/אֲשֶׁ֥ר יִדְאֶ֖ה הַ/נָּ֑שֶׁר גּ֕וֹי אֲשֶׁ֥ר לֹא תִשְׁמַ֖ע לְשֹׁנֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/049.yaml
  text: Yahweh will raise up against you a nation from far away[a], from the end of the earth[b], as the eagle swoops down—a nation whose language you will not understand.
translation:
  language: zh_hans
  text: 耶和华必使一国从远方、从地极而来攻击你，如鹰疾飞而来；这国的语言你听不懂。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִשָּׂא
  choice: 兴起……来攻击
  rationale: 该动词本义为“举起、带来”，与עַל连用时在此表示耶和华使一国起来攻击以色列；此译既保留神主动施行审判的含义，也符合现代汉语表达。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的专名“耶和华”音译四字神名，保留其作为立约之神名字的性质，而不以称号代替。
- source_word: גּוֹי
  choice: 一国
  rationale: 这里指前来入侵的外国政治共同体，“一国”比泛称“一个民族”更切合盟约咒诅的战争语境。
- source_word: מֵרָחוֹק
  choice: 从远方
  rationale: 直接传达空间上的遥远，表达自然简洁。
- source_word: מִקְצֵה הָאָרֶץ
  choice: 从地极
  rationale: 这是表示极远之处的惯用语；“地极”保留原文意象，也符合庄重而通顺的中文圣经语体。
- source_word: כַּאֲשֶׁר יִדְאֶה הַנָּשֶׁר
  choice: 如鹰疾飞而来
  rationale: יִדְאֶה强调快速飞动，也可能含猛扑之势；“疾飞而来”保留速度与威胁感，同时避免把原文未明确表达的向下动作定死。
- source_word: לֹא תִשְׁמַע לְשֹׁנוֹ
  choice: 这国的语言是你听不懂的
  rationale: 字面为“你听不明白它的舌头”；שׁמע在语言语境中包含理解之意，因此译作“听不懂”既贴近听觉表达，也清楚传达不能理解其语言的意思。
theological_decisions:
- issue: 四字神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用神的专名。中文正文采用传统且广为普通读者识别的“耶和华”，不以“主”等称号替换，从而保留立约之名的性质；“雅威”是另一种较贴近学术重构读音的音译。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“从远方、从地极”保留原文递进式的距离强调；“如鹰疾飞而来”传达迅猛逼近的比喻；末句用“听不懂”自然呈现希伯来语“听”在此所含的“理解”义。
