revisions:
- from: 耶和华必从远方、从地极兴起一国来攻击你，如鹰疾飞而来；这国的语言是你听不懂的。
  to: 耶和华必使一国从远方、从地极而来攻击你，如鹰疾飞而来；这国的语言你听不懂。
  rationale: 修订仅调整首句语序，以明确耶和华使该国从极远之处前来攻击；保留“地极”的修辞意象、“鹰”的常规译法及“疾飞而来”对迅疾飞行的表达。末句改为更自然的现代汉语，不增添“俯冲”等原文未明说的细节。
