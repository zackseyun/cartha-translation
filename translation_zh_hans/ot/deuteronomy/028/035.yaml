base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/035.yaml
  text: Yahweh will strike you with severe boils on the knees and on the legs[a], from which you cannot be healed, from the sole of your foot to the crown of your head.
translation:
  language: zh_hans
  text: 雅威必以严重的疮击打你，疮长在你的膝盖和小腿[a]上；从脚掌直到头顶，你都无法得医治。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“胫部”；希伯来语所指更具体地说是膝盖以下的腿部。
    reason: lexical_alternative
lexical_decisions:
- source_word: יַכְּכָה
  choice: 必使你……长出
  rationale: נכה的使役形在这里表示雅威直接降下疾病。结合中文对疮病的自然表达，译为“使你……长出”，既保留神主动施行灾祸的力度，又避免生硬的“用疮击打”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常用音译呈现四字神名，保留其专名性质，不以“主”等称号替代。
- source_word: בִּשְׁחִין רָע
  choice: 严重的疮
  rationale: שְׁחִין指发炎的疮、疖或皮肤溃疡；单数在此可作集合意义。רָע表示其严重、恶劣，故译为“严重的疮”。
- source_word: עַל הַבִּרְכַּיִם
  choice: 膝盖
  rationale: 准确而自然地表达所指身体部位。
- source_word: וְעַל הַשֹּׁקַיִם
  choice: 和小腿
  rationale: שׁוֹק在此指膝盖以下的腿部；“小腿”比笼统的“腿”更精确，也符合现代汉语习惯。脚注保留“胫部”这一更具体的可能表达。
- source_word: אֲשֶׁר לֹא תוּכַל לְהֵרָפֵא
  choice: 无法治愈
  rationale: 该关系从句说明这种疮不能得到医治；中文省略重复的主语，简洁而不改变被动、无可医治的含义。
- source_word: מִכַּף רַגְלְךָ
  choice: 从你的脚掌
  rationale: כַּף与“脚”连用时指脚底、脚掌；“脚掌”准确自然。
- source_word: וְעַד קָדְקֳדֶךָ
  choice: 到头顶
  rationale: קָדְקֹד指头的顶部；与“脚掌”构成从下到上的全身范围。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 采用贴近学界通常重构读音的现代汉语音译，保留这是以色列之神的专名；“耶和华”是传统汉译形式，但较不贴近该读音。
- issue: 疾病与雅威行动之间的关系
  choice: 明确译为雅威主动使疾病临到
  alternative: 弱化为疾病自然发生
  rationale: 希伯来文以נכה的使役形明确以雅威为施行者，因此不淡化经文所呈现的直接神圣审判。
translation_notes:
  register: 采用现代、庄重且易懂的简体中文。“这疮会……蔓延”把末尾从脚掌到头顶的范围关系明说出来，使中文连贯，同时保留原文疾病遍及全身的意象。
