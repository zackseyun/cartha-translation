  text: וְ/הָיִ֜יתָ מְמַשֵּׁ֣שׁ בַּֽ/צָּהֳרַ֗יִם כַּ/אֲשֶׁ֨ר יְמַשֵּׁ֤שׁ הָ/עִוֵּר֙ בָּ/אֲפֵלָ֔ה וְ/לֹ֥א תַצְלִ֖יחַ אֶת דְּרָכֶ֑י/ךָ וְ/הָיִ֜יתָ אַ֣ךְ עָשׁ֧וּק וְ/גָז֛וּל כָּל הַ/יָּמִ֖ים וְ/אֵ֥ין מוֹשִֽׁיעַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/029.yaml
  text: And you will grope at noon as the blind gropes in the darkness[a], and you will not prosper in your ways; and you will be only oppressed and robbed all the days[c][b], with no one to save you.
translation:
  language: zh_hans
  text: 你在正午也要摸索，像盲人在黑暗中摸索一样[a]；你所走的道路必不亨通[b]。你必终日只会受欺压、遭抢夺，无人搭救[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “摸索”或译“用手探寻”；原文动词指因看不见而凭触摸寻找。
    reason: lexical_alternative
  - marker: b
    text: “必不亨通”或译“必不能成功”。
    reason: lexical_alternative
  - marker: c
    text: “搭救”或译“解救”或“拯救”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מְמַשֵּׁשׁ / יְמַשֵּׁשׁ
  choice: 摸索
  rationale: 该动词指因看不见而用手探寻。“摸索”既保留触摸探寻的具体动作，也能表达无所适从的处境。
- source_word: בַּצָּהֳרַיִם
  choice: 在正午
  rationale: 指一天中光线最明亮的时候，与后文“在黑暗中”形成强烈反差。
- source_word: הָעִוֵּר
  choice: 盲人
  rationale: 原文为阳性单数形容词名词化，在此作泛指；现代汉语用“盲人”自然、庄重，也不额外限定某个具体人物。
- source_word: בָּאֲפֵלָה
  choice: 在黑暗中
  rationale: 准确传达黑暗或幽暗之意，并与“正午”保持鲜明对照。
- source_word: תַצְלִיחַ אֶת דְּרָכֶיךָ
  choice: 你所走的道路必不亨通
  rationale: “亨通”涵盖成功、进展顺利之意；“所走的道路”保留原文“道路”的人生与行事意象。
- source_word: אַךְ
  choice: 必
  rationale: 该语气词在此具限制和强调作用；结合诅咒宣告的语气，以“必”突出此处境的确定性，而“终日”与并列灾祸共同传达其持续、别无其他结果的意味。
- source_word: עָשׁוּק
  choice: 受欺压
  rationale: 被动分词表示持续处于压迫、盘剥或强暴之下；“受欺压”范围宽广且符合经文语体。
- source_word: גָזוּל
  choice: 遭抢夺
  rationale: 被动分词指财物被抢走或遭掠夺；“遭抢夺”清楚保留受害者的被动处境。
- source_word: כָּל הַיָּמִים
  choice: 终日
  rationale: 原义为“所有的日子”，在本句强调不断持续；“终日”是自然凝练的现代汉语表达。
- source_word: וְאֵין מוֹשִׁיעַ
  choice: 却无人搭救
  rationale: 表明没有任何施救者。“搭救”在此是一般性的解救用语，不预设后来的称号或特定神学含义。
theological_decisions:
- issue: 非弥赛亚性盟约诅咒语境中 מוֹשִׁיעַ 的译法
  choice: 搭救
  alternative: 拯救；解救；无人作救主
  rationale: 该词在这里指从欺压和抢夺中施行援救的人。译作“搭救”保留实际救援的含义，同时避免把该分词直接处理为后来发展出的神学称号。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“正午—黑暗”的对照和两次“摸索”均予保留；分号连接失去方向与行事不亨通，句号后突出持续受害且无人援救的结局。
