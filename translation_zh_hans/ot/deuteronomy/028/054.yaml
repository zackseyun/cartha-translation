base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/054.yaml
  text: The man who is tender among you and very delicate—his eye will be hostile toward his brother[a], toward the wife of his bosom[b], and toward the rest of his children whom he has left.
translation:
  language: zh_hans
  text: 你们中间那娇嫩、极其养尊处优的男人，必以恶眼看待自己的弟兄、怀中的妻子，以及他所余下的儿女[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “以恶眼看待”是希伯来语习语，可表示敌视、吝惜，或不肯与人分享。
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאִישׁ
  choice: 男人
  rationale: 原文为阳性单数，且下一节与女人形成对应，因此明确译为“男人”。
- source_word: הָרַךְ
  choice: 娇嫩
  rationale: 该词表示柔软、柔弱或娇嫩；此处与围城中的残酷行为形成强烈反差。
- source_word: וְהֶעָנֹג מְאֹד
  choice: 极其养尊处优
  rationale: 该短语描写生活安逸、娇贵讲究的人；此译比单纯的“柔弱”更能与前一形容词区分，同时自然传达其奢适背景。
- source_word: תֵּרַע עֵינוֹ
  choice: 必恶眼看待
  rationale: 保留希伯来语“眼变恶”的显著意象；脚注说明它在语境中可同时涉及敌视、吝惜和不肯分享。
- source_word: בְאָחִיו
  choice: 他的弟兄
  rationale: 按通常的亲属意义译出；“弟兄”可指亲兄弟，不泛化为族人。
- source_word: אֵשֶׁת חֵיקוֹ
  choice: 怀中的妻子
  rationale: 保留“怀中”这一亲密关系的身体意象，指与他最亲近的妻子。
- source_word: יֶתֶר בָּנָיו
  choice: 他所剩下的儿女
  rationale: בנים在这里可统指后代；“儿女”自然表达包容性含义，而יֶתֶר表示剩余的人。
- source_word: אֲשֶׁר יוֹתִיר
  choice: 所剩下的
  rationale: 动词表示留下、剩余；此译保留“仍留给他”与“幸存下来”的语境含义，不把它具体化为“他所饶过的”。
theological_decisions:
- issue: “恶眼”习语所表达的行为
  choice: 正文保留“恶眼看待”，脚注列明其语义范围
  alternative: 直接译为“敌视”或“舍不得分给”
  rationale: 原文习语在围城语境中兼有敌意、吝惜及不肯分享的意味；只选其中一种会过早消除原文张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“养尊处优”自然呈现其一贯娇贵安逸的生活状态；“恶眼看待”刻意保留原文意象，并用脚注避免现代读者误解。
