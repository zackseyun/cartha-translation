base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/066.yaml
  text: Your life will hang in doubt before you[a]; you will fear night and day[b], and you will have no assurance of your life.
translation:
  language: zh_hans
  text: 你的性命必悬在你面前，岌岌可危[a]；你必昼夜恐惧，对自己的性命毫无把握[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你的性命必悬在你面前。”希伯来文描绘性命悬而未定的景象，表示人始终不能确定自己能否存活。
    reason: lexical_alternative
  - marker: b
    text: 或译：“你必不能确信自己还能活着”，也可译：“你必不能信赖自己的性命。”
    reason: lexical_alternative
lexical_decisions:
- source_word: חַיֶּיךָ
  choice: 你的性命
  rationale: 该词虽为复数形式，但这里是指个人的生命存续；“性命”比“生命”更自然地突出能否活下去这一语境。
- source_word: תְּלֻאִים
  choice: 悬着，岌岌可危
  rationale: 保留 תלה“悬挂”的具体意象，同时以“岌岌可危”传达生命处于持续不安和危险之中的含义。
- source_word: לְךָ מִנֶּגֶד
  choice: 在你面前
  rationale: 按其空间意象直译，表达自己的性命仿佛悬在眼前、随时可能失去。
- source_word: וּפָחַדְתָּ
  choice: 你必……恐惧
  rationale: 直接表达 פחד 的惧怕、惊恐之意，不额外强化到原文未必要求的程度。
- source_word: לַיְלָה וְיוֹמָם
  choice: 昼夜
  rationale: 以自然凝练的现代汉语表达“夜晚和白日”，表示恐惧持续不断；汉语惯用语序不必机械保留希伯来语次序。
- source_word: לֹא תַאֲמִין בְּחַיֶּיךָ
  choice: 对自己的性命毫无把握
  rationale: אמן 的使役式在此可表示确信、信赖或有把握；结合宾语“性命”，所指是无法确信自己能继续活着，而非宗教意义上的相信。
theological_decisions: []
