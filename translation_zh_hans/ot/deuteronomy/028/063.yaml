  text: וְ֠/הָיָה כַּ/אֲשֶׁר שָׂ֨שׂ יְהוָ֜ה עֲלֵי/כֶ֗ם לְ/הֵיטִ֣יב אֶתְ/כֶם֮ וּ/לְ/הַרְבּ֣וֹת אֶתְ/כֶם֒ כֵּ֣ן יָשִׂ֤ישׂ יְהוָה֙ עֲלֵי/כֶ֔ם לְ/הַאֲבִ֥יד אֶתְ/כֶ֖ם וּ/לְ/הַשְׁמִ֣יד אֶתְ/כֶ֑ם וְ/נִסַּחְתֶּם֙ מֵ/עַ֣ל הָֽ/אֲדָמָ֔ה אֲשֶׁר אַתָּ֥ה בָא שָׁ֖מָּ/ה לְ/רִשְׁתָּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/063.yaml
  text: And it shall be that[a], just as Yahweh rejoiced over you to do you good and to multiply you, so Yahweh will rejoice over you to destroy you and to wipe you out[b]; and you will be torn away from upon the land that you are entering there to possess it.
translation:
  language: zh_hans
  text: 事情必将如此：耶和华从前怎样以善待你们、使你们增多为乐，耶和华也必照样以毁灭你们、将你们除尽为乐。你们必从你[a]将要进入、得为业的土地上被拔除[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本句原文的“你”是单数，把以色列作为一个整体来称呼；前文的“你们”则是复数。
    reason: cultural_note
  - marker: b
    text: “被拔除”或译“被连根拔起”，表示被强行从土地上移走。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: 事情必将如此
  rationale: 作为结果或后果的引入语，保留其面向未来的语气，同时采用自然、庄重的现代汉语。
- source_word: שָׂשׂ / יָשִׂישׂ
  choice: 从前……欢喜／也必……欢喜
  rationale: 前后使用同一词根，保留祝福与审判之间刻意而令人不安的平行结构。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代汉语圣经传统中通行的神名译法。
- source_word: לְהֵיטִיב אֶתְכֶם
  choice: 要善待你们
  rationale: 直接表达使人得好处、向人施好的广义含义，不将其窄化为物质上的兴旺。
- source_word: וּלְהַרְבּוֹת אֶתְכֶם
  choice: 使你们增多
  rationale: 保留五经盟约祝福中使子民人数增多的用语。
- source_word: לְהַאֲבִיד אֶתְכֶם
  choice: 毁灭你们
  rationale: 准确传达使之灭亡的使役含义，并符合盟约咒诅的强烈语气。
- source_word: וּלְהַשְׁמִיד אֶתְכֶם
  choice: 将你们除尽
  rationale: 与前面的“毁灭”有所区分，同时保留彻底消灭的严厉含义。
- source_word: וְנִסַּחְתֶּם
  choice: 被拔除
  rationale: 表达从土地上被强行移走的意象；“拔除”在现代汉语中自然，也能保留近似连根拔起的力度。
- source_word: מֵעַל הָאֲדָמָה
  choice: 从……土地上
  rationale: 以自然汉语保留“从土地表面被移除”的介词关系。
- source_word: אֲשֶׁר אַתָּה בָא שָׁמָּה לְרִשְׁתָּהּ
  choice: 你所要进去占领的土地
  rationale: 保留原文单数第二人称，把以色列作为一个整体来称呼；“进去占领”表达方向和取得该地为业的含义。
theological_decisions:
- issue: 耶和华在审判中的欢喜
  choice: 明确保留“耶和华也必照样因你们而欢喜，要毁灭你们”
  alternative: 弱化为“耶和华也必定意毁灭你们”或“任凭你们被毁灭”
  rationale: 希伯来文刻意用同一动词对应耶和华赐福时的欢喜与施行审判时的欢喜。译文不消解这一神学张力。
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 采用简体中文普通读者最熟悉且庄重的传统音译，同时明确其为盟约神名。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。前后重复“因你们而欢喜”，刻意保存原文祝福与审判的修辞平行；末句以“你们……你”呈现希伯来文从复数转为单数的变化，并用脚注说明。
