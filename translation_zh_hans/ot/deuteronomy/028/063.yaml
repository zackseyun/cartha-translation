revisions:
- from: 事情必将如此：耶和华从前怎样因你们而欢喜，要善待你们，使你们增多，耶和华也必照样因你们而欢喜，要毁灭你们，将你们除尽。你们必从你[a]所要进去占领的土地上被拔除[b]。
  to: 事情必将如此：耶和华从前怎样以善待你们、使你们增多为乐，耶和华也必照样以毁灭你们、将你们除尽为乐。你们必从你[a]将要进入、得为业的土地上被拔除[b]。
  rationale: 修订将两处“欢喜”明确连于其后的行动事项，保留希伯来文前后完全对应的修辞结构，既不弱化审判中的严厉表述，也避免将其误解为仅仅“因以色列而欢喜”。末句以“得为业”表达进入并取得土地的申命记惯用含义；单数代词脚注和“被拔除”的词汇说明均予保留。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T04:57:43Z'
review_pass:
  verdict: revise
  source_fidelity: “因你们而欢喜”在汉语中容易表示耶和华因以色列本身而喜乐，未能清楚表达希伯来文两个不定式所表明的目的／事项：他以施恩使他们增多，以及以毁灭除尽他们为乐。改为“以……为乐”可保留原文刻意的平行与令人不安的张力。末句的单数“你”及土地意象均可保留。
  naturalness: 原译整体庄重通顺，但“因你们而欢喜，要……”的搭配略有歧义。以“以善待你们、使你们增多为乐”及对应的审判表达，更符合现代标准汉语，也更清晰地体现修辞对称。
  terminology: “耶和华”“毁灭”“除尽”恰当，并能区分两个毁灭动词的连用。“占领”可用，但“得为业”更贴近 לְרִשְׁתָּהּ 在申命记土地应许语境中取得土地为产业的含义，且不额外强调军事征服。
  issues:
  - severity: medium
    issue: “因你们而欢喜”模糊了“欢喜”与后接不定式之间的目的／事项关系。
    rationale: שָׂשׂ/יָשִׂישׂ עַל… לְ… 在本节前后平行，指耶和华以向以色列施恩和使他们增多、以及毁灭和除尽他们为乐；并非单纯因他们这个对象而欢喜。
  - severity: low
    issue: “占领”略偏向征服动作。
    rationale: לְרִשְׁתָּהּ 的常见五经语境为承受、取得土地为业；“得为业”保留该语义而不超出文本。
  revised_text: 事情必将如此：耶和华从前怎样以善待你们、使你们增多为乐，耶和华也必照样以毁灭你们、将你们除尽为乐。你们必从你[a]将要进入、得为业的土地上被拔除[b]。
  revised_footnotes:
  - marker: a
    text: 本句原文的“你”是单数，把以色列作为一个整体来称呼；前文的“你们”则是复数。
