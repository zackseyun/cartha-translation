base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/003.yaml
  text: Blessed shall you be in the city[a], and blessed shall you be in the field.
translation:
  language: zh_hans
  text: 你在城里必蒙福，在田间也必蒙福。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你在城里是蒙福的，在田间也是蒙福的。”
    reason: 原文为无系词句，可理解为直接宣告蒙福，也可按上下文表达将来的应许。
lexical_decisions:
- source_word: בָּרוּךְ
  choice: 蒙福
  rationale: 这是动词 ברך 的被动分词，在盟约祝福语境中表示领受福分。“蒙福”自然、庄重，并保留福分来自赐福者的被动含义。
- source_word: אַתָּה
  choice: 你
  rationale: 第二人称阳性单数代词，以单数形式称呼作为盟约对象的以色列；汉语“你”可直接保留这一单数称呼。
- source_word: בָּעִיר
  choice: 在城里
  rationale: 介词 ב 加 עִיר 表示所在之处；“在城里”准确自然，并与“在田间”构成生活领域上的对照。
- source_word: וּבָרוּךְ
  choice: 也必蒙福
  rationale: 保留重复的祝福谓语，以体现希伯来文平衡的并列结构；将连接词 וּ 译为“也”，符合现代汉语表达。
- source_word: בַּשָּׂדֶה
  choice: 在田间
  rationale: שָׂדֶה 可指田地、野外或乡野；此处与城里相对，“在田间”既保留农业意象，也自然简洁。
theological_decisions:
- issue: 无系词祝福句的时态和语气
  choice: 你在城里必蒙福，在田间也必蒙福
  alternative: 你在城里是蒙福的，在田间也是蒙福的
  rationale: 希伯来文原句没有明示系词，既可作现状宣告，也可在申命记28章的盟约祝福序列中理解为应许。正文用“必”表达上下文中的应许力量，脚注保留宣告式理解，避免掩盖原文形式上的歧义。
translation_notes:
  register: 采用现代、庄重而通俗的普通话。“城里／田间”保持原文城市与农田的对称；重复“蒙福”以再现希伯来文的平行结构。脚注标记置于整句之后，涵盖两分句的替代译法。
