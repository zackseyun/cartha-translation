base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/043.yaml
  text: The foreigner who is among you will rise higher and higher above you[a], and you will go down lower and lower.
translation:
  language: zh_hans
  text: 在你中间寄居的外族人[a]，必在你之上越升越高；你却必越降越低。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“寄居者”或“外侨”。希伯来语 גֵּר 指住在以色列人中间的非本地人。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַגֵּר
  choice: 寄居的外族人
  rationale: גֵּר指住在以色列群体中的非本地人。“寄居的外族人”既表达其外来身份，也保留其居住在民中的特点；脚注列出较简短的译法。
- source_word: אֲשֶׁר בְּקִרְבְּךָ
  choice: 你中间
  rationale: 自然表达该人身处以色列群体内部，简洁对应בְּקִרְבְּךָ。
- source_word: יַעֲלֶה עָלֶיךָ
  choice: 必升到你之上
  rationale: 保留“上升”及“在你之上”的空间隐喻，不把其范围局限为经济、政治或社会地位中的某一种。
- source_word: מַעְלָה מָּעְלָה
  choice: 越来越高
  rationale: 以现代汉语的递进表达再现重复副词所强调的持续上升。
- source_word: וְאַתָּה
  choice: 你却
  rationale: וְ字面为连接词，但上下两句形成鲜明逆转；“却”自然显明语境中的对比。
- source_word: תֵרֵד
  choice: 必降
  rationale: 与“升”构成直接反义和平行，保留原文的下降隐喻。
- source_word: מַטָּה מָּטָּה
  choice: 越来越低
  rationale: 与“越来越高”形成整齐对照，并体现重复副词的渐进强化。
theological_decisions:
- issue: 咒诅语境中的社会—盟约地位逆转
  choice: 将经文译为住在以色列中的非本地人升到以色列之上，而以色列不断下降的广义地位逆转。
  alternative: 将上升和下降限于经济兴衰，或只解释为政治统治。
  rationale: 原文使用宽泛的升降隐喻，并未限定具体领域；译文保留这种开放性，避免加入经文没有明说的 narrower interpretation。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“升到你之上”与“降得越来越低”保留原文鲜明的上下对照；使用单数“你”，与本节希伯来语对以色列整体的单数称呼一致。
