  text: וֶ/הֱפִֽיצְ/ךָ֤ יְהוָה֙ בְּ/כָל הָ֣/עַמִּ֔ים מִ/קְצֵ֥ה הָ/אָ֖רֶץ וְ/עַד קְצֵ֣ה הָ/אָ֑רֶץ וְ/עָבַ֨דְתָּ שָּׁ֜ם אֱלֹהִ֣ים אֲחֵרִ֗ים אֲשֶׁ֧ר לֹא יָדַ֛עְתָּ אַתָּ֥ה וַ/אֲבֹתֶ֖י/ךָ עֵ֥ץ וָ/אָֽבֶן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/064.yaml
  text: And Yahweh will scatter you among all the peoples[a], from one end of the earth to the other end of the earth[b], and there you will serve other gods that neither you nor your fathers have known—wood and stone.
translation:
  language: zh_hans
  text: 雅威必把你分散在万民中，从大地的一端直到大地的另一端[a]。你在那里必侍奉别的神，就是你和你祖先都不认识的木头和石头[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “大地”也可译作“土地”或“国土”。希伯来语 אֶרֶץ 可有这些含义；本节因提到分散在万民中，正文采用范围较广的“大地”。
    reason: lexical_alternative
  - marker: b
    text: “木头和石头”指用这些材料制成的偶像。
    reason: cultural_note
lexical_decisions:
- source_word: וֶהֱפִיצְךָ
  choice: 必把你分散
  rationale: 使役形表达使人分散、流散；“把你分散”在盟约咒诅语境中直接自然，“必”体现未完成式在预告中的确定性。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，保留其作为专名的性质，不以称号替代。
- source_word: בְּכָל הָעַמִּים
  choice: 在万民中
  rationale: עַמִּים 指众多族群或人民；“万民”简洁、庄重，也比“万国”更少政治实体色彩。
- source_word: מִקְצֵה הָאָרֶץ וְעַד קְצֵה הָאָרֶץ
  choice: 从大地的一端直到大地的另一端
  rationale: 保留原文对“地”和“端”的重复，同时以自然汉语表达遍及全部地域的范围；אֶרֶץ 的“地／大地”与“土地／国土”歧义另见脚注。
- source_word: וְעָבַדְתָּ
  choice: 必侍奉
  rationale: עבד 用于神明时包含服事和敬拜归属；“侍奉”保留动词本义及宗教语境，不直接缩窄为礼仪性的“敬拜”。
- source_word: אֱלֹהִים אֲחֵרִים
  choice: 别的神
  rationale: 直译固定表达，不额外限定为民族性的“外邦神”。
- source_word: אֲשֶׁר לֹא יָדַעְתָּ אַתָּה וַאֲבֹתֶיךָ
  choice: 你和你祖先都不认识的
  rationale: 保留 ידע 的“认识”含义；“都不”自然对应你与祖先两方均未认识。
- source_word: עֵץ וָאָבֶן
  choice: 木头和石头
  rationale: 保留原文简短有力的材质并列，并让它作为“别的神”的同位说明；其所指另以脚注解释。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文使用神的专名，故采用音译而非“主”等称号；“雅威”较直接对应学界通常重构的读音 Yahweh。
- issue: הָאָרֶץ 在分散公式中的范围
  choice: 大地
  alternative: 土地／国土
  rationale: “在万民中”支持较广的地理范围，但 אֶרֶץ 本身可指地、土地或国土，因此正文采用“大地”，并在脚注保留较窄理解的可能。
- issue: “侍奉别的神”是主动敬拜还是受迫服事
  choice: 保留“侍奉”的宽度
  alternative: 敬拜别的神
  rationale: 原文 עבד 可涵盖敬拜和效忠；不在译文中判断这里更具体的行为方式，以保留咒诅陈述中的张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“万民”“侍奉”保持经文语体，但不使用生僻古语；句号分开分散与侍奉两项咒诅结果，使长句清晰，同时保持原文顺序。
