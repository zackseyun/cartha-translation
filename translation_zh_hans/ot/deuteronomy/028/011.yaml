  text: וְ/הוֹתִֽרְ/ךָ֤ יְהוָה֙ לְ/טוֹבָ֔ה בִּ/פְרִ֧י בִטְנְ/ךָ֛ וּ/בִ/פְרִ֥י בְהַמְתְּ/ךָ֖ וּ/בִ/פְרִ֣י אַדְמָתֶ֑/ךָ עַ֚ל הָ/אֲדָמָ֔ה אֲשֶׁ֨ר נִשְׁבַּ֧ע יְהוָ֛ה לַ/אֲבֹתֶ֖י/ךָ לָ֥/תֶת לָֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/011.yaml
  text: And Yahweh will make you abound in prosperity[a], in the fruit of your womb, in the fruit of your livestock, and in the fruit of your ground[c][b], on the land that Yahweh swore to your fathers to give you.
translation:
  language: zh_hans
  text: 雅威必使你富足兴旺[a]：你腹中所生的[b]、牲畜所生的，以及土地的出产[c]，都必丰盛。这一切必发生在雅威向你祖先起誓要赐给你的土地上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “富足兴旺”或译“有余，得享福祉”或“有余，得着好处”。
    reason: lexical_alternative
  - marker: b
    text: “你腹中所生的”：希伯来文直译为“你腹中的果实”，指儿女或后代。
    reason: lexical_alternative
  - marker: c
    text: “土地的出产”或译“土壤的收成”；希伯来文直译为“土地的果实”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹתִרְךָ
  choice: 必使你富足……都必丰盛
  rationale: 该词是 יתר 的使役形，表示雅威使受话者拥有余裕、增多而有余。中文以“使你富足”表达使役含义，并以“都必丰盛”自然统摄后列三方面的增长。
- source_word: לְטוֹבָה
  choice: 兴旺
  rationale: 字面可译“为好处／福祉”。在祝福语境中，“兴旺”表达这种有益、带来福祉的富足，同时不把它限定为纯粹的物质财富。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常用音译呈现四字神名，保留其作为以色列之神立约名字的性质，不以称号替代。
- source_word: בִּפְרִי בִטְנְךָ
  choice: 你腹中所生的
  rationale: 这是指儿女或后代的希伯来语惯用表达。中文采用传统而可懂的对应说法，既避免生硬的“腹中的果实”，也保留生育意象。
- source_word: וּבִפְרִי בְהַמְתְּךָ
  choice: 牲畜所生的
  rationale: 指家畜的后代和繁殖增长。“牲畜”准确涵盖集体名词 בְּהֵמָה，并与前项“所生的”形成平行。
- source_word: וּבִפְרִי אַדְמָתֶךָ
  choice: 土地的出产
  rationale: אֲדָמָה 在此侧重耕作的土壤；“土地的出产”是自然的现代汉语，也准确表达农作物和地里的收成。
- source_word: עַל הָאֲדָמָה
  choice: 在……土地上
  rationale: 这里指上述祝福实现的地点，即应许之地；译文保留介词 עַל 的空间关系。
- source_word: אֲשֶׁר נִשְׁבַּע יְהוָה לַאֲבֹתֶיךָ לָתֶת לָךְ
  choice: 雅威向你祖先起誓要赐给你的
  rationale: 关系从句修饰“土地”。此译法清楚保留向祖先所起的誓与赐地给当下受话者之间的关系，同时不额外判定该应许是否也以祖先为直接领受者。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用立约神名。采用“雅威”保留专名性质，也较接近学界通常重构的读音；不用“主”这一称号替代。
- issue: 是否把“腹中的果实”直接解释为“儿女”
  choice: 译作“你腹中所生的”，并以脚注说明字面形式
  alternative: 你的儿女；你腹中的果实
  rationale: “所生的”在现代汉语中自然清楚，保留生育意象，却不以“儿女”把含义完全解释化；脚注则呈现原文与全节“果实／出产”意象的联系。
- issue: לְטוֹבָה 的福祉含义是否仅指物质繁荣
  choice: 译作“兴旺”，不限定为金钱或物质财富
  alternative: 为你好；在福祉上；在财富上
  rationale: 上下文确实列举后代、牲畜和土地产出等具体祝福，但该词本身表示好处、福祉。译文保留较宽广的含义，避免将祝福缩减为财富。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“富足兴旺”与“都必丰盛”共同表达原文使役动词及其后三个 בִּפְרִי 短语的统摄关系；冒号凸显总述与分述。三项分别用“所生的／所生的／出产”构成自然平行，并由脚注补明原文反复出现的“果实”意象。
