revisions:
- from: 他必围困你所有的城门，直到你遍地所倚靠的高大坚固城墙全都倒塌；他必在耶和华你上帝赐给你的遍地，围困你所有的城门。
  to: 他必在你各城门那里围困你，直到你所倚靠、在你全境内的高耸坚固城墙都倒塌；他必在雅威你上帝赐给你的全境内，在你各城门那里围困你。
  rationale: 修订保留原文两次“围困”、两次“城门”以及全境范围的重复结构。“在……城门那里围困你”按汉语语序表达围城行动，同时不把“城门”直接改为“城邑”。“在你全境内”放在城墙结构中，明确其范围功能；神名改为“雅威”，与 Yahweh 的英语审校决定一致。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T04:57:41Z'
review_pass:
  verdict: revise
  source_fidelity: 经文两次的 וְהֵצַר 均应保留为军事性的“围困”，且“城门”宜保留其具体意象。草稿基本传达了这些要点，但“高大”略加入原文未明说的体量义，且“遍地所倚靠的”会使“遍地”与“倚靠”构成不够清晰的关系。四字神名应与英语审校轨迹的 Yahweh 对应，译为“雅威”。
  naturalness: “围困……城门”虽比“围困城邑”略带字面感，但在围城语境中可理解，也保留原文修辞。调整为“在你各城门那里围困你”能更自然地保留“城门”及其作为受围困城邑的转喻。
  terminology: 将 יְהוָה 译为“雅威”，对应 Yahweh，而不是“耶和华”。将 הַגְּבֹהוֹת 译为“高耸”，避免“高大”所附加的“大”义；将 בְּצֻרוֹת 译为“坚固”，保留防御工事的语境。
  issues:
  - severity: medium
    issue: 四字神名译作“耶和华”
    rationale: 英语 POB 审校轨迹明确采用 Yahweh；中文宜以“雅威”对应该专名，避免与既定译名政策不一致。
  - severity: low
    issue: “高大”超出“高”的明确语义
    rationale: הַגְּבֹהוֹת 的核心义为“高”；“高耸”自然且不额外引入“体量大”的含义。
  - severity: low
    issue: “遍地所倚靠的”修饰关系不清
    rationale: 原文的“在你全地”说明城墙倒塌所涉及的全境范围，不是“倚靠”的地点性限定；改写可更清楚保留范围。
  revised_text: 他必在你各城门那里围困你，直到你所倚靠、在你全境内的高耸坚固城墙都倒塌；他必在雅威你上帝赐给你的全境内，在你各城门那里围困你。
  revised_footnotes: []
