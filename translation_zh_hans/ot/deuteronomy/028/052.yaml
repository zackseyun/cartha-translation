base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/052.yaml
  text: And he will besiege you in all your gates until your high and fortified walls, in which you trust, come down throughout all your land; and he will besiege you in all your gates throughout all your land that Yahweh your God has given you.
translation:
  language: zh_hans
  text: 他必在你各城门那里围困你，直到你所倚靠、在你全境内的高耸坚固城墙都倒塌；他必在雅威你上帝赐给你的全境内，在你各城门那里围困你。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהֵצַר
  choice: 他必围困你
  rationale: 该词是 צור 的使役形，在城门、城墙和敌军进攻的语境中指军事围困；两次出现均一致译为“围困”。
- source_word: שְׁעָרֶיךָ
  choice: 你所有的城门
  rationale: 字面义为“你的城门”。城门可转指城邑，但保留“城门”更能呈现原文具体的围城图景。
- source_word: עַד רֶדֶת
  choice: 直到……全都倒塌
  rationale: רדת 字面为“下去”，用于遭围攻的城墙时意指倒下、坍塌；汉语译作“倒塌”自然清楚。“全都”表达复数城墙及遍地范围所形成的整体结果。
- source_word: חֹמֹתֶיךָ הַגְּבֹהוֹת וְהַבְּצֻרוֹת
  choice: 高大坚固城墙
  rationale: 保留“高”和“设防坚固”两个特征；“高大坚固城墙”符合现代汉语表达，也明确其防御性质。
- source_word: אֲשֶׁר אַתָּה בֹּטֵחַ בָּהֵן
  choice: 你……所倚靠的
  rationale: בטח ב 表示把信心或安全感寄托于某物；“倚靠”既自然，也保留对防御工事的信赖意味。
- source_word: בְּכָל אַרְצֶךָ
  choice: 遍地
  rationale: בכל 在此具有遍及全部疆域的分布意义；“遍地”简洁呈现全面范围。
- source_word: אֲשֶׁר נָתַן יְהוָה אֱלֹהֶיךָ לָךְ
  choice: 耶和华你上帝赐给你的
  rationale: 忠实表达土地是由以色列的上帝赐予的既成事实；“赐给”符合庄重而通俗的现代汉语。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文圣经传统中广为人知的神名形式“耶和华”，作为四字神名的音译，而非以称号替代。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 两者都是对神名的音译。“耶和华”在现代中文读者中辨识度更高，并明确保留其专名性质；原文并非一般称号“主”。
- issue: 对城墙的“信靠”如何表达
  choice: 倚靠
  alternative: 信靠
  rationale: 原文 בטח 表达依赖和安全感；“倚靠”在此避免让无生命的防御设施显得过度人格化，同时不削弱经文对人把保障寄托于城墙的批判张力。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。保留“城门”的具体意象，并用分号对应原文两次“围困”的重复结构。前半句将“遍地”置于关系结构中，使其自然修饰分布在全境、为人所倚靠的城墙；后半句保留“耶和华你上帝赐给你的遍地”这一土地赐予公式。
