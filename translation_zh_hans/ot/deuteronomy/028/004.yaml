base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/004.yaml
  text: Blessed shall be the fruit of your womb[a], and the fruit of your ground, and the fruit of your livestock—the offspring of your herds and the young of your flocks.
translation:
  language: zh_hans
  text: 你腹中所生的、土地所产的、牲畜所生的，就是你牛群和羊群所繁殖的后代[a]，都必蒙福。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “牛群和羊群所繁殖的后代”对应希伯来语中与牛群、羊群相连的两个传统牲畜用语，通常指牲畜繁殖的增多；也可译作“牛群所增添的和羊群所生的幼畜”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ
  choice: 都必蒙福
  rationale: 这是盟约祝福语境中的表语形容词；“必蒙福”既体现祝福宣告的语气和将来性，也符合现代汉语表达。
- source_word: פְּרִי
  choice: 所生的／所产的
  rationale: 原文三次重复“果实”，把人、土地和牲畜并列起来。汉语若三处直译为“果实”会显得生硬，因此按对象分别译作“所生的”和“所产的”，同时保留三项平行结构。
- source_word: בִטְנְךָ
  choice: 你腹中
  rationale: 此处指孕育儿女的腹中；“腹中所生的”保留原文的具体身体意象，又是自然、庄重的汉语。
- source_word: אַדְמָתְךָ
  choice: 土地
  rationale: 指生产农作物的土壤或耕地，而非整个国家或疆域；“土地所产的”在现代汉语中清楚自然。
- source_word: בְהֶמְתֶּךָ
  choice: 牲畜
  rationale: 这是涵盖各种家养牲畜的广义词，随后以牛群和羊群加以具体说明。
- source_word: שְׁגַר אֲלָפֶיךָ
  choice: 牛群繁生的
  rationale: 这是传统牲畜繁殖用语，指牛所生的幼畜或牛群的增殖；采用“繁生的”可在简洁表达中保留生育增长之意。
- source_word: עַשְׁתְּרֹת צֹאנֶךָ
  choice: 羊群繁生的
  rationale: 这是与群畜繁殖有关的传统表达，所指包括绵羊、山羊等小型牲畜所生的幼畜；“羊群”是自然的集合称呼，“繁生的”与前项形成平行。
