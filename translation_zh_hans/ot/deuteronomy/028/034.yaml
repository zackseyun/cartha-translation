  yaml_path: translation/ot/deuteronomy/028/034.yaml
  text: And you will be driven mad by the sight your eyes see[a].
translation:
  language: zh_hans
  text: 你必因亲眼所见的景象而发疯。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 较形式对应的译法是：“你必因你眼所看见的景象而发疯。”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיִיתָ
  choice: 你必……
  rationale: 在这一连串咒诅中，带连接词的完成式具有将来、结果性的语气；用“必”自然表达确定将发生的结果。
- source_word: מְשֻׁגָּע
  choice: 发疯
  rationale: 该词是源自 שׁגע 的被动分词，表示陷入疯狂或被逼至疯狂的状态。“发疯”在现代汉语中自然，并保留状态转变及结果意味。
- source_word: מִמַּרְאֵה
  choice: 因……所见的一切
  rationale: 介词 מִן 在此表示原因，即眼前景象导致疯狂；译作“因”清楚而简洁。מַרְאֶה 指所见的景象，结合下文关系从句译为“所见的一切”，避免生硬重复。
- source_word: עֵינֶיךָ
  choice: 亲眼
  rationale: 将“你的眼睛”自然转化为现代汉语的“亲眼”，保留视觉感官和本人直接目睹的强调。
- source_word: אֲשֶׁר תִּרְאֶה
  choice: 所见的
  rationale: 关系从句直指受话者将看见的景象；“所见的”符合现代汉语表达，同时保留原文含义。
theological_decisions: []
