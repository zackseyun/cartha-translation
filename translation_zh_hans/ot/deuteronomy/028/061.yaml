  text: גַּ֤ם כָּל חֳלִי֙ וְ/כָל מַכָּ֔ה אֲשֶׁר֙ לֹ֣א כָת֔וּב בְּ/סֵ֖פֶר הַ/תּוֹרָ֣ה הַ/זֹּ֑את יַעְלֵ֤/ם יְהוָה֙ עָלֶ֔י/ךָ עַ֖ד הִשָּׁמְדָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/061.yaml
  text: Also every sickness and every affliction that is not written in the book of this law[a], Yahweh will bring upon you until you are destroyed.
translation:
  language: zh_hans
  text: 此外，凡没有写在这律法书上的疾病和灾祸[a]，雅威也必降在你身上，直到你被消灭。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “灾祸”或译“瘟疫”；希伯来语这个词也可指击打、创伤或使人受害的灾殃。
    reason: 保留מַכָּה在本语境中可能涵盖的多重词义，避免正文把它限缩为疾病或肉体击打。
lexical_decisions:
- source_word: גַּם
  choice: 此外……也
  rationale: 保留原文在前述咒诅清单上继续追加的语气；用“此外……也”符合现代汉语表达。
- source_word: כָּל חֳלִי
  choice: 凡……疾病
  rationale: חֳלִי泛指疾病或患病状态；“疾病”简明自然，也不把含义限于某一种病。
- source_word: וְכָל מַכָּה
  choice: 和灾祸
  rationale: מַכָּה可指击打、创伤、瘟疫或造成伤害的灾殃；上下文为盟约咒诅，“灾祸”能较宽泛地表达其惩罚性灾难含义，同时以脚注保留其他可能译法。
- source_word: אֲשֶׁר לֹא כָתוּב
  choice: 没有写在
  rationale: 贴近原文被动分词的表述，在现代汉语中也自然清楚。
- source_word: בְּסֵפֶר הַתּוֹרָה הַזֹּאת
  choice: 在这律法书上
  rationale: סֵפֶר既可指书卷，也可指书；“这律法书”保留其盟约文书的指向，而不刻意采用古雅的“书卷”。
- source_word: יַעְלֵם
  choice: 必降
  rationale: 这是עלה的使役形，并带复数宾语后缀，意为使上述疾病和灾祸临到；“降在你身上”自然表达施加灾祸的意思。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译呈现四字神名，而不以“主”等称号替代。
- source_word: עָלֶיךָ
  choice: 在你身上
  rationale: 与“降”搭配，准确表达灾祸临到受审判者。
- source_word: עַד הִשָּׁמְדָךְ
  choice: 直到你被消灭
  rationale: 保留原文被动式不定词所表达的终点，也不在句法上额外明说施动者。
theological_decisions:
- issue: 四字神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用神的专名；采用“雅威”作为较贴近YHWH惯常重构读音的汉语音译，既保留专名性质，也避免用称号替换。
- issue: “直到你被消灭”的施动者
  choice: 保留被动表达，不在末句另加施动者
  alternative: 直到雅威把你消灭
  rationale: 上下文清楚表明审判来自雅威，但原文הִשָּׁמְדָךְ采用被动形式；保留被动可避免把语法中隐含的信息改写为明说。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。句式尽量贴近希伯来原文的追加语气和被动结尾，同时避免生硬直译；正文中的脚注标记与脚注条目一致。
