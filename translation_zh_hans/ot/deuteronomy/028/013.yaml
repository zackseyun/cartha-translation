base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/013.yaml
  text: And Yahweh will make you the head and not the tail[a], and you will be only above, and you will not be beneath, if you listen to the commandments of Yahweh your God that I am commanding you today, to keep and to do them.
translation:
  language: zh_hans
  text: 雅威必使你作首，不作尾；你必只居上，不居下；如果你听从[a]雅威你的神的诫命，就是我今日吩咐你谨守遵行的诫命。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“听”。希伯来语直译为“听”，但在这里的盟约语境中也包含顺服的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּנְתָנְךָ יְהוָה
  choice: 雅威必使你作
  rationale: נתן在带有表语“首、不作尾”的结构中具有使役意味；“使你作”既自然，又保留了雅威使以色列处于这一地位的含义。
- source_word: לְרֹאשׁ וְלֹא לְזָנָב
  choice: 作首不作尾
  rationale: 保留“首／尾”的原文比喻及鲜明对照，不将其解释性地改写为“领先／落后”。
- source_word: וְהָיִיתָ רַק לְמַעְלָה וְלֹא תִהְיֶה לְמָטָּה
  choice: 你只居上，不居下
  rationale: “居上／居下”自然地保留空间方位所表达的地位比喻；“只”对应强调排他性的רַק。
- source_word: כִּי תִשְׁמַע אֶל
  choice: 只要你听从
  rationale: כִּי在祝福语境中引出条件；“只要”清楚表达条件关系。“听从”兼顾שמע的听闻本义和盟约语境中的顺服含义。
- source_word: מִצְוֺת
  choice: 诫命
  rationale: 这是申命记盟约条款的常用庄重表达，准确对应מצוה的复数。
- source_word: יְהוָה
  choice: 雅威
  rationale: 采用神圣名号的现代汉语音译，保留原文专名性质，不以“主”这一称号替代。
- source_word: אֱלֹהֶיךָ
  choice: 你神
  rationale: 直接呈现盟约称谓“雅威你神”；现代汉语中简洁自然。
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: 就是我今天吩咐你的
  rationale: 保留摩西当下发言的即时性和申命记中具有盟约意义的“今天”。
- source_word: לִשְׁמֹר וְלַעֲשׂוֹת
  choice: 谨守遵行
  rationale: 分别体现“守”和“做”两个动词；“谨守遵行”是自然、庄重且易懂的现代汉语表达。
theological_decisions:
- issue: כִּי所引出的盟约关系
  choice: 只要你听从
  alternative: 因为你听从
  rationale: 本段祝福的语境表明כִּי引出应许实现的条件。“只要”保留这一盟约逻辑，同时不进一步断定顺服与祝福之间超出经文所说的功德关系。
- issue: שמע אל中的“听”与“顺服”
  choice: 听从
  alternative: 听／服从
  rationale: 原词以“听”为基本意义，但在盟约语境中包含照所听见的去行；“听从”能同时承载这两层意思，且后文“谨守遵行”进一步明确其实践维度。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。保留“首／尾、上／下”两组原文比喻和排比；以“雅威”呈现神圣名号。脚注标在“听从”之后，使其与所解释的词语准确对应。
