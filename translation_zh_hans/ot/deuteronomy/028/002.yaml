base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/002.yaml
  text: And all these blessings will come upon you and overtake you[a], if you obey the voice of Yahweh your God.
translation:
  language: zh_hans
  text: 这一切福分都必临到你，也必追上你，若你听从雅威——你的上帝的话。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“若你听雅威——你上帝的声音”。希伯来语“听……的声音”常含有以顺服作出回应的意思。
    reason: 说明 שׁמע בְּקוֹל 的惯用语义，并保留“听”的较直译表达。
lexical_decisions:
- source_word: וּבָאוּ עָלֶיךָ
  choice: 都要临到你
  rationale: 动词完成式在本段祝福与条件结构中表达将来的结果；“临到你”自然传达介词 עַל 所表示的方向，并保留庄重语气。
- source_word: כָּל הַבְּרָכוֹת הָאֵלֶּה
  choice: 这一切福分
  rationale: 直接保留全称限定和指示成分；“福分”在现代汉语中自然，也符合盟约祝福的语境。
- source_word: וְהִשִּׂיגֻךָ
  choice: 追上你
  rationale: נשׂג 的使役词干在这里有赶上、追及之意；“追上你”保留福分仿佛从后面赶来并及于人的生动意象。
- source_word: כִּי
  choice: 只要
  rationale: 结合28:1及本节的祝福结构，此处引出条件。“只要”以自然汉语清楚表达条件关系，同时不把它误读为单纯的因果说明。
- source_word: תִשְׁמַע בְּקוֹל
  choice: 听从……的话
  rationale: 该希伯来语惯用语不只指听见声音，也包含顺服回应。“听从……的话”在现代汉语中兼顾聆听和服从，且比“服从声音”自然。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按较接近希伯来语四字神名的现代汉语音译处理，将其作为上帝的专名，而不以称号替代。
- source_word: אֱלֹהֶיךָ
  choice: 你上帝
  rationale: 保留第二人称单数所属形式，体现对以色列整体以单数“你”发出的盟约宣告。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。采用“雅威”旨在保存其专名性质并贴近通常重建的读音，而不是用称号代替；正文不进一步断定古代元音细节。
- issue: שׁמע בְּקוֹל 的语义力度
  choice: 听从……的话
  alternative: 听……的声音；服从……
  rationale: 原文同时具有“听”和顺服回应的含义。“听从”不把它弱化为单纯听见，也不完全抹去聆听这一原始意象。
- issue: כִּי 在本节中的关系
  choice: 只要（条件）
  alternative: 因为；当……时
  rationale: 28:1已经明示顺服为祝福的条件，本节继续说明相应结果，因此条件义最符合上下文；脚注保留希伯来表达在形式与语义上的空间。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“临到你，追上你”保留原文的平行节奏和追及意象；“你”维持希伯来语第二人称单数对盟约群体的集体称呼。
