  terminology: “耶和华”符合项目对四字神名的既定译法。将 אָבָק וְעָפָר 译为“尘土和尘埃”保留两个近义的干燥细粒物质名词及其强化效果；原脚注的“泥土”可能暗示湿泥，不适合此处旱灾和降尘的意象，应改为“尘土和土（或浮土）”一类的替代说明。
