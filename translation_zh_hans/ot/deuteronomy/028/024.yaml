base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/024.yaml
  text: Yahweh will make the rain of your land dust and powder[a]; from the heavens it will come down on you until you are destroyed.
translation:
  language: zh_hans
  text: 耶和华必使你那地的雨变为尘土和尘埃[a]；尘土和尘埃必从天上降在你身上，直到你被毁灭。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“尘土和土（或浮土）”。希伯来文并列两个指干燥细碎物质的近义词（אָבָק、עָפָר），强化雨水变为旱灾与毁坏之物的景象。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的专名形式“耶和华”，将四字神名作为名字表达，而不以“主”这一称号替代。
- source_word: יִתֵּן
  choice: 必使……变为
  rationale: 该动词字面为“给”，但在此结构和灾祸语境中表示使本应降下的雨成为尘土；“使……变为”在中文中清楚自然。
- source_word: מְטַר אַרְצְךָ
  choice: 你地上的雨
  rationale: 保留“雨”与“你的土地”的所属关系；“你地上的雨”符合现代汉语表达。
- source_word: אָבָק וְעָפָר
  choice: 尘土和尘沙
  rationale: 两个近义词都指干燥细碎物质。“尘土和尘沙”保留成对强化的意象，同时避免把两词合并为一个概念。
- source_word: מִן הַשָּׁמַיִם
  choice: 从天上
  rationale: 希伯来语虽为复数形式，但中文“天上”自然且庄重，不必机械体现形态上的复数。
- source_word: יֵרֵד עָלֶיךָ
  choice: 它们必……降在你身上
  rationale: 依上下文让尘土和尘沙成为降下之物。中文以复数代词回指并配合“降在你身上”，画面明确自然。
- source_word: עַד הִשָּׁמְדָךְ
  choice: 直到你被毁灭
  rationale: 准确表达该不定式结构所指的终点，并不额外指定实施毁灭的主语。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: “耶和华”是现代中文圣经传统中最广为人知的神名形式，保留专名功能；不以称号替代，也不借此加入额外教义解释。
- issue: “直到你被毁灭”的施事者
  choice: 保留被动，不明说施事者
  alternative: 直到他毁灭你
  rationale: 原文表达紧凑，没有在末句另行明示主语；被动译法保留这种语法含蓄性，避免替文本强行补足。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。分号保留两幅连续画面：雨变为尘土，以及尘土从天降下。脚注标记已在正文相应位置列出。
