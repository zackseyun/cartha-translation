  text: ה֣וּא יַלְוְ/ךָ֔ וְ/אַתָּ֖ה לֹ֣א תַלְוֶ֑/נּוּ ה֚וּא יִהְיֶ֣ה לְ/רֹ֔אשׁ וְ/אַתָּ֖ה תִּֽהְיֶ֥ה לְ/זָנָֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/044.yaml
  text: He will lend to you[a], but you will not lend to him; he will be the head[b], and you will be the tail.
translation:
  language: zh_hans
  text: 他要借给你[a]，你却不能借给他[b]；他要作头，你却要作尾。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他”指上一节所说的寄居者。
    reason: cross_reference
  - marker: b
    text: 原文在前后两句使用同一个动词，意思都是“借给、贷款给”，强调经济依赖和地位的逆转。
    reason: lexical_clarification
lexical_decisions:
- source_word: יַלְוְךָ / תַלְוֶנּוּ（לוה，Hiphil）
  choice: 借给你 / 借给他
  rationale: 使役词干在本节表示“借出、贷款给”，两处形成鲜明对照，突出债权人与债务人的经济地位逆转；译作“借给”也避免误解为“向……借”。
- source_word: הוּא
  choice: 他
  rationale: 该阳性单数代词承接上一节的“寄居者”，保留原文具有代表性的单数表达。
- source_word: לְרֹאשׁ
  choice: 作头
  rationale: 保留希伯来文以“头”象征居上、占优势的鲜明比喻，并与本章前文的措辞相呼应。
- source_word: לְזָנָב
  choice: 作尾
  rationale: 保留与“作头”对应的比喻，表达居下和受支配的地位。
- source_word: יִהְיֶה / תִּהְיֶה
  choice: 要作
  rationale: 在咒诅语境中表示将来的结果或处境；“要作”自然地表达未来状态，不过度强化为必然性的解释。
- source_word: וְאַתָּה
  choice: 你却
  rationale: 重复“你”并用“却”显明两组平行分句中的强烈反差。
theological_decisions:
- issue: 阳性单数所指
  choice: 正文保留单数“他”和“你”，并用脚注说明“他”的先行词
  alternative: 将其复数化为“他们”，或在正文中重复“寄居者”
  rationale: 希伯来文使用阳性单数，承接上一节作为代表性个体的寄居者；保留代词既忠于语法，也不把原文的单数表达泛化。
- issue: “头”与“尾”的地位隐喻
  choice: 保留“作头／作尾”的原文比喻
  alternative: 意译为“居上位／居下位”或“占支配地位／受人支配”
  rationale: 原文以身体部位构成对举，既表达经济和社会地位的逆转，也呼应申命记28章较早出现的同一措辞；不宜在正文中把隐喻限定为某一种具体权力关系。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“借给”清楚呈现债权方向；“作头／作尾”略带经文语体，但在现代汉语中仍可理解，并能完整保留原文的对称隐喻。脚注[b]置于第二个“借给”之后，以准确对应其词汇说明。
