  text: וְ/הִפְלָ֤א יְהוָה֙ אֶת מַכֹּ֣תְ/ךָ֔ וְ/אֵ֖ת מַכּ֣וֹת זַרְעֶ֑/ךָ מַכּ֤וֹת גְּדֹלוֹת֙ וְ/נֶ֣אֱמָנ֔וֹת וָ/חֳלָיִ֥ם רָעִ֖ים וְ/נֶאֱמָנִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/059.yaml
  text: then Yahweh will make your plagues and the plagues of your offspring extraordinary—great and lasting plagues[b][a], and severe and lasting sicknesses.
translation:
  language: zh_hans
  text: 雅威必使你和你后代所受的灾殃异乎寻常[a]，就是重大而持久[b]的灾殃，以及严重而持久的疾病。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“令人惊骇”。希伯来语动词可表示使某事非同寻常或引人惊异；这里形容审判格外严厉。
    reason: lexical_alternative
  - marker: b
    text: “持久”所译的希伯来语词也可表示“稳固、长存、持续不退”；原文用同一个词分别形容灾殃和疾病。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִפְלָא
  choice: 必使……异乎寻常
  rationale: 该词是פלא的使役形，在这里表示使灾殃变得非同寻常、令人惊骇；“异乎寻常”保留其异常、惊人的强化意味，同时避免“奇妙”可能带来的正面色彩。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文四字神名作音译，保留这是上帝向以色列启示的专名，而不以称号替代。
- source_word: מַכֹּתְךָ / מַכּוֹת
  choice: 你所受的灾殃／灾殃
  rationale: מכה可指击打、创伤或灾祸；在盟约咒诅的语境中，“灾殃”自然表达上帝所降的沉重祸患，并与后面的“疾病”形成平行。
- source_word: זַרְעֶךָ
  choice: 你的后代
  rationale: זרע在此为集合意义，指人的子孙后裔；“后代”是现代汉语中自然、清楚的表达。
- source_word: גְּדֹלוֹת
  choice: 重大
  rationale: 该形容词基本义为“大”；修饰灾殃时表示其规模或严重程度很大。“重大”既保留原义，也符合现代汉语搭配。
- source_word: נֶאֱמָנוֹת / נֶאֱמָנִים
  choice: 持久
  rationale: 两处词形同源，语境中表示稳固、持续、不轻易消退；统一译为“持久”，保留希伯来文的重复。
- source_word: חֳלָיִם
  choice: 疾病
  rationale: 该复数名词指各种疾病；汉语“疾病”可作集合表达，与“灾殃”并列自然。
- source_word: רָעִים
  choice: 严重
  rationale: רַע基本义为坏、恶或有害；用来形容疾病时，“严重”准确传达其凶险和痛苦程度，而不误解为道德上的邪恶。
theological_decisions:
- issue: 四字神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 采用接近YHWH学术重构读音的现代汉语音译，保留其专名功能；不以“主”这一称号替换。
- issue: 审判语境中פלא的语气
  choice: 使……异乎寻常
  alternative: 使……令人惊骇；使……奇妙
  rationale: 原词强调这些灾殃异常、非凡；在咒诅语境中并无正面赞叹之意，因此避免容易产生褒义的“奇妙”，同时不把原文直接收窄为单纯的“加重”。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“你和你后代所受的灾殃”使希伯来语宾语关系在中文中清楚自然；保留“灾殃—疾病”的平行结构，并以两次“持久”再现原文有意的重复。
