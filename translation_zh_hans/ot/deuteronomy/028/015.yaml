  text: וְ/הָיָ֗ה אִם לֹ֤א תִשְׁמַע֙ בְּ/קוֹל֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ לִ/שְׁמֹ֤ר לַ/עֲשׂוֹת֙ אֶת כָּל מִצְוֺתָ֣י/ו וְ/חֻקֹּתָ֔י/ו אֲשֶׁ֛ר אָנֹכִ֥י מְצַוְּ/ךָ֖ הַ/יּ֑וֹם וּ/בָ֧אוּ עָלֶ֛י/ךָ כָּל הַ/קְּלָל֥וֹת הָ/אֵ֖לֶּה וְ/הִשִּׂיגֽוּ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/015.yaml
  text: But if you do not listen to the voice of Yahweh your God[a], to keep and to do all his commandments and his statutes that I am commanding you today[b], then all these curses will come upon you and overtake you.
translation:
  language: zh_hans
  text: 但是，如果你不听从雅威你的上帝的话[a]，不谨守遵行他的一切诫命和律例——就是我今天吩咐你的[b]，那么，这一切咒诅都必临到你，追上你。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“听雅威你上帝的声音”；这个说法包含听而顺从的意思，也可译作“顺服雅威你的上帝”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“谨守遵行他的一切诫命和律例，就是我今天吩咐你的。”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה אִם לֹא
  choice: 但是，如果……那么
  rationale: 本句与前面的祝福形成对照；用“但是，如果……那么”自然表达希伯来语的转折和条件结构。
- source_word: תִשְׁמַע בְּקוֹל
  choice: 听从……的话
  rationale: 该习语兼有聆听和顺从之意。“听从……的话”既保留听觉意象，也传达顺服的含义。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来语四字神名作音译，保留其作为以色列上帝之立约名字的性质，不以称号替代。
- source_word: אֱלֹהֶיךָ
  choice: 你上帝
  rationale: 准确保留第二人称阳性单数后缀和立约称谓；现代汉语中简洁自然。
- source_word: לִשְׁמֹר לַעֲשׂוֹת
  choice: 谨守遵行
  rationale: 分别体现“守住、遵守”和“实行”的双重表达，并采用现代中文圣经法律语境中庄重而易懂的说法。
- source_word: כָּל מִצְוֺתָיו וְחֻקֹּתָיו
  choice: 他的一切诫命和律例
  rationale: 保留 מִצְוָה 与 חֹק 的词汇区分及申命记的立约法律语域。
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: 就是我今天吩咐你的
  rationale: 表达关系从句对前述诫命和律例的限定；“今天”保留摩西当下宣告的现场感。
- source_word: וּבָאוּ עָלֶיךָ
  choice: 都必临到你
  rationale: 自然表达咒诅降临在人身上的希伯来语惯用法。
- source_word: וְהִשִּׂיגוּךָ
  choice: 追上你
  rationale: 保留动词所含追赶并赶上的鲜明意象，避免弱化为一般性的“发生”。
theological_decisions:
- issue: 如何译出立约神名 יְהוָה
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；音译“雅威”保留专名性质，不把它默默改成称号。
- issue: “听……的声音”所表达的顺服含义
  choice: 听从雅威你上帝的话
  alternative: 听雅威你上帝的声音；顺服雅威你的上帝
  rationale: “听从……的话”同时保存聆听和顺服两层意义，不将原文的具体听觉意象完全抽象化。
- issue: לִשְׁמֹר לַעֲשׂוֹת 的双重措辞
  choice: 谨守遵行
  alternative: 留心实行；遵守并实行
  rationale: 保留两个不定式所强调的遵守与实践，不将其合并成单一的“服从”。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。以“谨守遵行”“诫命和律例”维持申命记的立约法律语域，同时用“临到你，追上你”保存原文有力的追逐意象。全节的“你”按希伯来文为阳性单数，在语境中指作为立约群体被整体称呼的以色列。
