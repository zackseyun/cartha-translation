base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/033.yaml
  text: A people whom you have not known will eat the fruit of your land and all your labor[b][a], and you will be only oppressed and crushed all your days.
translation:
  language: zh_hans
  text: 你土地的出产和你一切劳碌的成果[a]，必被一个你不认识的民族吃掉；你必终日受欺压、遭摧残。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你一切的劳碌”。
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּרִי אַדְמָתְךָ
  choice: 你土地的出产
  rationale: פְּרִי本义为“果实”，与“土地”连用时指土地所出的物产；译作“出产”在现代汉语中自然，也保留农业语境。
- source_word: כָל יְגִיעֲךָ
  choice: 你一切劳碌所得的
  rationale: יְגִיעַ既可指劳碌，也可指劳碌的成果。因其在此作“吃”的宾语，译出“所得的”可使汉语语义通顺，同时以脚注保留“劳碌”的较形式对应译法。
- source_word: יֹאכַל
  choice: 吃尽
  rationale: 基本义是“吃”。这里宾语包括土地出产和劳碌所得，汉语“吃尽”自然表达被他族消费殆尽；“尽”体现整体宾语的语境效果，而非额外强化为“吞噬”。
- source_word: עַם אֲשֶׁר לֹא יָדָעְתָּ
  choice: 你不认识的民族
  rationale: עַם是集合性的“民、民族”；ידע在此表示此前不认识、不熟悉。译文保持关系从句及外来民族的含义。
- source_word: רַק עָשׁוּק וְרָצוּץ
  choice: 只会受欺压、被摧残
  rationale: רַק强调处境别无其他；עָשׁוּק表示受压迫或剥削，רָצוּץ表示被压碎、打垮。汉语采用“受欺压、被摧残”，既有力度又不过度具体化。
- source_word: כָל הַיָּמִים
  choice: 你一生
  rationale: 字面为“所有的日子”，在对个人的警告中表示终其一生；“你一生”是简洁自然的现代汉语表达。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。前半句保留农业和劳作成果被陌生民族夺食的具体图景；后半句以并列被动表达持续受压迫、遭摧残的状态。脚注标记置于相关短语之后。
