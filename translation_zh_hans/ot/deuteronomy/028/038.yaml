  yaml_path: translation/ot/deuteronomy/028/038.yaml
  text: You will carry much seed out to the field[a], but you will gather in little, because the locust will consume it.
translation:
  language: zh_hans
  text: 你要带许多种子到田里，却只收进很少，因为蝗虫必把它吃尽。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זֶרַע רַב
  choice: 许多种子
  rationale: זֶרַע指播种用的种子，רַב表示数量多；“许多种子”保留具体的农耕意象，并与后文“很少”形成鲜明对比。
- source_word: תּוֹצִיא
  choice: 带……到
  rationale: יצא的使役形在此直译为“带出去”，指把种子带到田里播撒；“带……到”在现代汉语中较自然，同时保留原文没有直接使用“播种”一词的表达。
- source_word: הַשָּׂדֶה
  choice: 田里
  rationale: שָׂדֶה在这里指耕种的田地；结合汉语方位表达译作“田里”。
- source_word: וּמְעַט תֶּאֱסֹף
  choice: 收进来的却很少
  rationale: אָסַף意为收集、收聚，在农耕语境中指收获；“收进来”贴近原词，“却”自然体现“许多”与“很少”之间的反差。
- source_word: כִּי
  choice: 因为
  rationale: כִּי在此引出收成很少的原因，译作“因为”清楚自然。
- source_word: יַחְסְלֶנּוּ
  choice: 必把它吃尽
  rationale: חסל表示彻底吃光或毁尽；“吃尽”既适合蝗虫侵食的语境，也保留其强烈程度。代词“它”对应希伯来文的单数宾语后缀，其具体所指仍由上下文理解。
- source_word: הָאַרְבֶּה
  choice: 蝗虫
  rationale: אַרְבֶּה是通常表示蝗虫的词；带定冠词的单数在此具有集合意义，汉语“蝗虫”无需另加复数标志即可表达。
