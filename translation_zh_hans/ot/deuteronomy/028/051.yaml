  text: וְ֠/אָכַל פְּרִ֨י בְהֶמְתְּ/ךָ֥ וּ/פְרִֽי אַדְמָתְ/ךָ֮ עַ֣ד הִשָּֽׁמְדָ/ךְ֒ אֲשֶׁ֨ר לֹֽא יַשְׁאִ֜יר לְ/ךָ֗ דָּגָן֙ תִּיר֣וֹשׁ וְ/יִצְהָ֔ר שְׁגַ֥ר אֲלָפֶ֖י/ךָ וְ/עַשְׁתְּרֹ֣ת צֹאנֶ֑/ךָ עַ֥ד הַאֲבִיד֖/וֹ אֹתָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/051.yaml
  text: It will consume the offspring of your livestock and the produce of your land until you are destroyed; it will leave you no grain[a], new wine, or oil, no calves of your herd or lambs of your flock, until it has destroyed you.
translation:
  language: zh_hans
  text: 它必吞吃你牲畜所生的和你土地的出产，直到你被毁灭。它不给你留下五谷、新酒和油，也不给你留下牛群所生的牛犊和羊群所生的幼畜[a]，直到它把你灭掉。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “羊群所生的幼畜”：原文所用词的确切含义有争议，可能泛指羊群繁殖所得。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָכַל
  choice: 它必吞吃
  rationale: אכל本义为“吃”，在敌国耗尽资源的咒诅语境中，“吞吃”既保留形象，也自然表达强行掠尽之意；单数主语承接前文的入侵之国。
- source_word: פְּרִי בְהֶמְתְּךָ
  choice: 你牲畜所生的
  rationale: פְּרִי用于动物时指其所生的后代；בְהֵמָה泛指家畜。“牲畜所生的”准确而不局限于某一种牲畜。
- source_word: וּפְרִי אַדְמָתְךָ
  choice: 你土地的出产
  rationale: פְּרִי与אַדָמָה搭配，指土地的农产；“土地的出产”符合现代汉语，也保留农业语境。
- source_word: עַד הִשָּׁמְדָךְ
  choice: 直到你被毁灭
  rationale: 该不定式结构表示吞吃行动持续到受话者遭毁灭为止；被动表达贴合希伯来文形式和咒诅语气。
- source_word: אֲשֶׁר לֹא יַשְׁאִיר לְךָ
  choice: 它不给你留下
  rationale: 关系从句继续描写敌国的行动；此译自然表达完全剥夺，同时保留“留下”的核心意义。
- source_word: דָּגָן
  choice: 五谷
  rationale: דָּגָן泛指谷物收成；“五谷”在现代中文圣经语域中自然，并非限定为恰好五种谷物。
- source_word: תִּירוֹשׁ
  choice: 新酒
  rationale: תִּירוֹשׁ通常指新产的酒或葡萄汁液；“新酒”是准确而简洁的对应。
- source_word: יִצְהָר
  choice: 油
  rationale: 在“五谷、新酒、油”的固定农产组合中，יִצְהָר指橄榄油；正文用“油”简洁且符合传统语境。
- source_word: שְׁגַר אֲלָפֶיךָ
  choice: 牛群所生的牛犊
  rationale: שְׁגַר指牛群所生的幼畜或增产；“牛群所生的牛犊”清楚传达其繁殖所得，也比抽象的“增产”更易懂。
- source_word: וְעַשְׁתְּרֹת צֹאנֶךָ
  choice: 羊群所生的幼畜
  rationale: עַשְׁתְּרֹת含义有争议，在与牛群繁殖所得并列的语境中，宜理解为羊群所生或繁殖的产出。“幼畜”不把צֹאן过度限定为绵羊羔，并以脚注说明词义。
- source_word: עַד הַאֲבִידוֹ אֹתָךְ
  choice: 直到把你灭掉
  rationale: אבד的使役式意为“使灭亡、毁灭”；“把你灭掉”保留使役和宾语结构，并与前半句形成有力度的呼应。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以“它”承接前文所说的敌国，避免擅自补出本节未明说的名词；保留两次“直到”的重复，以呈现原文咒诅语句逐步推进的力度。
