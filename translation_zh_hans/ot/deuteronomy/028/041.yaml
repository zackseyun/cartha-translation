  yaml_path: translation/ot/deuteronomy/028/041.yaml
  text: You will father sons and daughters[a], but they will not remain yours[b], because they will go into captivity.
translation:
  language: zh_hans
  text: 你会生儿育女，他们却不再属于你[a]，因为他们将被掳去[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“他们却不属于你。”
    reason: lexical_alternative
  - marker: b
    text: 或直译：“因为他们要进入被掳的境地。”原文动词为主动形式“去”，并明确指向被俘、被掳的处境。
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּנִים וּבָנוֹת
  choice: 儿女
  rationale: 原文明确并列“儿子和女儿”。现代汉语“儿女”自然、庄重，也保留了男女后代并举的含义。
- source_word: תּוֹלִיד
  choice: 生
  rationale: 这是 ילד 的使役式第二人称阳性单数，表示生育、使之出生。汉语“生儿育女”符合男性受话者也可使用的自然表达，并避免“生下”可能使人误解为专指母亲分娩。
- source_word: וְלֹא יִהְיוּ לָךְ
  choice: 他们却不再属于你
  rationale: 原文直译为“他们却不属于你／不归你所有”。结合下句被掳的原因，“不再属于你”自然表达因被掳而失去儿女的关系与拥有状态，同时以脚注保留更严格的字面译法。
- source_word: כִּי
  choice: 因为
  rationale: 此处引出儿女不再属于受话者的原因，用现代汉语因果连词“因为”最清楚。
- source_word: יֵלְכוּ
  choice: 将被掳去
  rationale: 该动词字面为主动的“他们将去”。但与 בַּשֶּׁבִי 连用时表示作为俘虏离去；汉语“被掳去”自然呈现这一整体含义。脚注保留原文主动表达的形式。
- source_word: בַּשֶּׁבִי
  choice: 被掳
  rationale: שֶׁבִי 特指战争或强制迁徙背景下的被俘、掳掠，而不只是一般流亡。“被掳”比“流亡”更准确地保留强制性。
theological_decisions: []
translation_notes:
  register: 采用现代、通顺而庄重的普通话。“生儿育女”适合对男性单数受话者说；“被掳去”在汉语中清楚传达战争中被强行带走的含义。两个脚注分别保留“他们不属于你”的字面结构，以及原文“去”的主动形式。
