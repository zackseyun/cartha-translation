base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/062.yaml
  text: And you will be left few in number[a], though you had become as numerous as the stars of the heavens[c][b], because you did not listen to the voice of Yahweh your God.
translation:
  language: zh_hans
  text: 你们必剩下很少的人[a]；尽管你们曾多如天上的星[b]，因为你没有听从雅威——你的上帝——的声音[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“少数的人”，是表示人数极少的习语。
    reason: lexical_alternative
  - marker: b
    text: 也可译作：“而你们原曾多如天上的星。”
    reason: alternative_reading
  - marker: c
    text: “听从……的声音”是申命记中的盟约用语，也含有“顺服、听命”的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִשְׁאַרְתֶּם
  choice: 你们所剩的
  rationale: 该词是 שׁאר 的尼法勒式，表示在损失或审判之后“被留下、剩下”；译文保留这种结果意味。
- source_word: בִּמְתֵי מְעָט
  choice: 人数必很少
  rationale: 这是表示人数稀少的习语，并非特指男性；如此翻译自然且准确。
- source_word: תַּחַת אֲשֶׁר
  choice: 尽管
  rationale: 此处突出从先前繁多到后来稀少的强烈反差；“尽管”以自然汉语表达让步意味，同时以脚注保留“而／原本”的另一种理解。
- source_word: הֱיִיתֶם
  choice: 你们曾多
  rationale: היה 在这里描述以色列已经达到的繁多状态；“曾”清楚表现过去与将来结局的对照。
- source_word: כְּכוֹכְבֵי הַשָּׁמַיִם לָרֹב
  choice: 多如天上的星
  rationale: 保留星辰比喻及数量众多的重点，也符合自然、庄重的现代汉语。
- source_word: כִּי לֹא שָׁמַעְתָּ בְּקוֹל
  choice: 因为你没有听从……的声音
  rationale: שׁמע בקול 既保有“听声音”的词汇意象，也含有听命、顺服之意；译文保留这两层意味，不将其简化为单一解释。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，保留其作为以色列之上帝的专名，而不以称号代替。
- source_word: אֱלֹהֶיךָ
  choice: 你上帝
  rationale: 准确表达第二人称单数所属关系，并与本节后半句对以色列整体使用单数称呼相一致。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”按其较可能的读音音译，保留神的盟约专名。
- issue: 本节由复数第二人称转为单数第二人称
  choice: 前半句用“你们”，后半句用“你”
  alternative: 全句统一译为“你们”
  rationale: 原文先用复数形式 וְנִשְׁאַרְתֶּם、הֱיִיתֶם，随后用单数 שָׁמַעְתָּ、אֱלֹהֶיךָ；保留这一转换，呈现申命记把以色列众人视为一个整体来称呼的特点。
- issue: שׁמע בקול 的盟约含义
  choice: 听从……的声音
  alternative: 顺服／听命于
  rationale: 该表达可指实际聆听，也常含遵从之意；译文保留“声音”的原文意象，同时用“听从”传达其顺服内涵。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。前半句以“你们”对应希伯来文复数，后半句以“你”对应集体单数；不抹平原文的人称数转换。“多如天上的星”保留盟约语境中的传统意象。
