  text: שׁוֹרְ/ךָ֞ טָב֣וּחַ לְ/עֵינֶ֗י/ךָ וְ/לֹ֣א תֹאכַל֮ מִמֶּ/נּוּ֒ חֲמֹֽרְ/ךָ֙ גָּז֣וּל מִ/לְּ/פָנֶ֔י/ךָ וְ/לֹ֥א יָשׁ֖וּב לָ֑/ךְ צֹֽאנְ/ךָ֙ נְתֻנ֣וֹת לְ/אֹיְבֶ֔י/ךָ וְ/אֵ֥ין לְ/ךָ֖ מוֹשִֽׁיעַ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/031.yaml
  text: Your ox will be slaughtered before your eyes[a], but you will not eat any of it; your donkey will be seized from before you and will not be returned to you; your flock will be given to your enemies[b], and there will be no one to save you.
translation:
  language: zh_hans
  text: 你的牛必在你眼前被宰杀，你却吃不到一点；你的驴必从你面前被抢走，再也回不到你这里；你的羊群必被交给你的仇敌，也没有人来救你。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שׁוֹרְךָ
  choice: 你的牛
  rationale: שׁוֹר 指牛类牲畜，语境中可能是役用牛；现代汉语用“牛”自然且不无根据地限定性别或用途。
- source_word: טָבוּחַ
  choice: 必被宰杀
  rationale: טבח 的被动分词表示牲畜遭屠宰，而非泛指被杀；在盟约咒诅的连续陈述中以“必”表达将来的确定结果。
- source_word: לְעֵינֶיךָ
  choice: 在你眼前
  rationale: 直译并自然表达事情公开发生在当事人亲眼可见之处，强化其无力与羞辱。
- source_word: וְלֹא תֹאכַל מִמֶּנּוּ
  choice: 你却吃不到一点
  rationale: מן 加代词后缀字面为“从它”，在“吃”的语境中表示不能吃到其中任何部分；“一点”明确传达全然无份。
- source_word: חֲמֹרְךָ גָּזוּל
  choice: 你的驴必……被抢走
  rationale: גזל 表示以强力夺取或抢掠；“抢走”比单纯“偷走”更能保留暴力剥夺的意味。
- source_word: מִלְּפָנֶיךָ
  choice: 从你面前
  rationale: 保留原文“从你面前／当着你的面”的空间性与现场感。
- source_word: וְלֹא יָשׁוּב לָךְ
  choice: 再也回不到你这里
  rationale: 原文动词是主动式“回来”；此译保留该语法视角，同时用“再也”自然表达否定的最终性。
- source_word: צֹאנְךָ
  choice: 你的羊群
  rationale: צֹאן 是羊类小牲畜的集合称谓，可包括绵羊和山羊；“羊群”在汉语中自然，并避免只限定为某一种羊。
- source_word: נְתֻנוֹת לְאֹיְבֶיךָ
  choice: 必被交给你的仇敌
  rationale: נתן 的被动分词表示被给予或交付；“交给”在敌对处境中比机械的“给”更自然，又不额外加入原文没有的细节。
- source_word: וְאֵין לְךָ מוֹשִׁיעַ
  choice: 也没有人来救你
  rationale: מוֹשִׁיעַ 是“施救者、搭救者”；“没有人来救你”符合现代汉语，并保留个人救援者缺席的含义。
theological_decisions:
- issue: 末句救援用语是否带有专门的属灵救恩含义
  choice: 也没有人来救你
  alternative: 你没有搭救者
  rationale: ישׁע 词根可用于“拯救、搭救”，但本节直接语境是牲畜被敌人夺去而无人施以现实援救。“救你”保留原词力度，却不把它擅自限定为永恒救恩。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“必……却……”呈现盟约咒诅的确定性及反差；三段并列结构尽量保持原文节奏。未设置脚注，因为关键语义可在正文中自然表达，且不存在必须向读者标出的文本异文。
