source:
  edition: WLC
  text: וְ/הָיָ֗ה אִם שָׁמ֤וֹעַ תִּשְׁמַע֙ בְּ/קוֹל֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ לִ/שְׁמֹ֤ר לַ/עֲשׂוֹת֙ אֶת כָּל מִצְוֺתָ֔י/ו אֲשֶׁ֛ר אָנֹכִ֥י מְצַוְּ/ךָ֖ הַ/יּ֑וֹם וּ/נְתָ֨נְ/ךָ֜ יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ עֶלְי֔וֹן עַ֖ל כָּל גּוֹיֵ֥י הָ/אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/001.yaml
  text: And it shall be[a], if you diligently obey the voice of Yahweh your God, being careful to do all his commandments that I am commanding you today, then Yahweh your God will set you high above all the nations of the earth.
translation:
  language: zh_hans
  text: “你若留心听从耶和华你上帝的话，谨慎遵行他的一切诫命，就是我今天吩咐你的，耶和华你的上帝就必使你高过地上万国。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“你若实实在在地听从耶和华你上帝的声音”；这是希伯来语以同根词重复来加强语气的表达，指专心聆听并顺从。
    reason: 说明希伯来语同根强化结构，并保留原文“声音”在“听从……的话”这一译法中的对应意象。
lexical_decisions:
- source_word: וְהָיָה
  choice: （不单独译出）
  rationale: 这里引出条件句及其结果。现代汉语用“若……就……”已自然表达这一结构；另译“事情将是这样”会显得累赘。
- source_word: אִם שָׁמוֹעַ תִּשְׁמַע בְּקוֹל
  choice: 你若真的听从……的话
  rationale: 不定式绝对形与限定动词连用，强化“听”的动作；在盟约语境中，“听”也包含顺从之意。“真的听从”兼顾强调语气、听从的惯用意义及“声音/话”的源语意象。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代简体中文读者熟悉的专名形式翻译四字神名，而不以普通称号“主”替代。
- source_word: אֱלֹהֶיךָ
  choice: 你的上帝
  rationale: 保留第二人称单数所有关系和盟约称谓。
- source_word: לִשְׁמֹר לַעֲשׂוֹת
  choice: 谨慎遵行
  rationale: 该搭配表达留心守住并付诸实行；“谨慎遵行”在自然汉语中同时保留认真看守与实际执行的含义。
- source_word: כָּל מִצְוֺתָיו
  choice: 他的一切诫命
  rationale: “诫命”保持盟约和律法语域；“一切”准确表达 כָּל。
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: 就是我今天吩咐你的
  rationale: “就是”清楚连接前面的“一切诫命”；“今天”保留摩西当下讲话的即时性。
- source_word: וּנְתָנְךָ יְהוָה אֱלֹהֶיךָ עֶלְיוֹן
  choice: 耶和华你的上帝就必使你超越
  rationale: נתן 与表地位的 עֶלְיוֹן 连用，表示使以色列处于更高地位，而非简单“赐给”；“就必”表达条件结果和确定的将来意义。
- source_word: עַל כָּל גּוֹיֵי הָאָרֶץ
  choice: 地上万国
  rationale: 此处与所有列国比较，הָאָרֶץ 宜按广义译为“地上”，而非局部的“那地”；“万国”自然表达“所有列国”。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用神的盟约专名。中文正文保留专名，并采用现代中文圣经传统中最广为普通读者识别的“耶和华”；不以“主”代替，也不借此裁定希伯来语古代读音的学术争议。
- issue: שָׁמוֹעַ תִּשְׁמַע בְּקוֹל 的听从与顺服含义
  choice: 真的听从……的话
  alternative: 切实顺服
  rationale: 原文以“听声音”的表达承载顺从含义。“听从……的话”保留听觉意象和盟约中的服从要求；“真的”传达同根强化结构，而不把它解释成特定程度或功德标准。
- issue: 条件与应许的关系
  choice: 若……就必……
  alternative: 如果……那么……
  rationale: 明确保留原文的条件句结构，使祝福与所陈述的听从和遵行相连，但不额外推演救恩论或功德论结论。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。以“若……就必……”构成流畅的条件句；“谨慎遵行”“诫命”“万国”维持申命记的盟约—律法语域。脚注标记置于整节末尾，对应正文“真的听从……的话”。
