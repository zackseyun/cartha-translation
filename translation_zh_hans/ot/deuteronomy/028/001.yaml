- from: “你若真的听从耶和华你上帝的话，谨慎遵行他的一切诫命，就是我今天吩咐你的，耶和华你的上帝就必使你超越地上万国。”[a]
  to: “你若留心听从耶和华你上帝的话，谨慎遵行他的一切诫命，就是我今天吩咐你的，耶和华你的上帝就必使你高过地上万国。”[a]
  rationale: 修订仅调整同根强化、比较性地位和脚注直译的表达，使译文更贴近希伯来原文并更符合现代标准汉语；条件关系、神名、盟约—律法语域及原有意义均予保留。
