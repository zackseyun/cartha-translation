  text: יְשַׁלַּ֣ח יְהוָ֣ה בְּ֠/ךָ אֶת הַ/מְּאֵרָ֤ה אֶת הַ/מְּהוּמָה֙ וְ/אֶת הַ/מִּגְעֶ֔רֶת בְּ/כָל מִשְׁלַ֥ח יָדְ/ךָ֖ אֲשֶׁ֣ר תַּעֲשֶׂ֑ה עַ֣ד הִשָּֽׁמֶדְ/ךָ֤ וְ/עַד אֲבָדְ/ךָ֙ מַהֵ֔ר מִ/פְּנֵ֛י רֹ֥עַ מַֽעֲלָלֶ֖י/ךָ אֲשֶׁ֥ר עֲזַבְתָּֽ/נִי׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/020.yaml
  text: Yahweh will send on you the curse[a], the confusion, and the rebuke in every undertaking of your hand that you do, until you are destroyed and until you perish quickly, because of the evil of your deeds by which you have forsaken me.
translation:
  language: zh_hans
  text: 雅威必在你所做的一切事上，使咒诅、慌乱和斥责临到你，直到你被毁灭、迅速灭亡；因为你离弃我所行的恶事。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 以通行的现代汉语音译呈现四字神名，保留其专名性质，不以称号替代。
- source_word: יְשַׁלַּח ... בְּךָ
  choice: 必使……临到你
  rationale: 保留雅威主动施行盟约惩罚的施事关系；“临到你”自然表达这些灾祸以受话者为目标。
- source_word: הַמְּאֵרָה
  choice: 咒诅
  rationale: 此处指盟约中的具体惩罚；“咒诅”既保留名词形式，也符合申命记本章的语境。
- source_word: הַמְּהוּמָה
  choice: 慌乱
  rationale: 该词可指混乱、惊慌或骚动；“慌乱”兼顾心理恐慌与行动失序，适合此处各项事务受挫的语境。
- source_word: הַמִּגְעֶרֶת
  choice: 斥责
  rationale: 源于גער，表达强烈的责斥，在这里保留神亲自审判、责罚的意味。
- source_word: בְּכָל מִשְׁלַח יָדְךָ אֲשֶׁר תַּעֲשֶׂה
  choice: 使你手中所做的一切事都受其害
  rationale: 该希伯来语惯用语字面涉及“手的伸出”，实指人着手经营的一切；正文以自然汉语表达其后果，并在脚注保留原文意象。
- source_word: עַד הִשָּׁמֶדְךָ וְעַד אֲבָדְךָ מַהֵר
  choice: 直到你被毁灭，直到你迅速灭亡
  rationale: 重复“直到”以保留原文平行结构，并用“被毁灭／灭亡”区分两个近义动词。
- source_word: מִפְּנֵי רֹעַ מַעֲלָלֶיךָ אֲשֶׁר עֲזַבְתָּנִי
  choice: 这是因为你行恶，离弃了我
  rationale: 清楚表达审判的因由，同时不把“离弃我”削弱为与恶行无关的附带说明。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；采用“雅威”保留其作为以色列之神盟约专名的功能，而不以称号“主”替代。
- issue: 盟约审判的施事者
  choice: 雅威主动使咒诅、慌乱和斥责临到人
  alternative: 将灾祸译为自行发生的非人格力量
  rationale: 希伯来文以雅威为动词明确的主语，因此不淡化或隐藏神直接施行审判的语法与神学张力。
- issue: “离弃了我”与恶行的关系
  choice: 并列呈现为审判的因由：“你行恶，离弃了我”
  alternative: 明确解释为离弃雅威就是全部恶行，或解释为与恶行完全分开的另一原因
  rationale: 原文关系词可使“离弃我”说明或关联前面的恶行；译文保持紧密联系，但不作超出句法证据的排他性解释。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“必使……临到你”保留宣告审判的力度；“手中所做的一切事”使用普通读者熟悉的表达，脚注补足希伯来语意象。
