base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/019.yaml
  text: Every firstborn male that is born among your herd and among your flock you shall consecrate to Yahweh your God[a]. You shall not work with the firstborn of your ox[b], nor shear the firstborn of your flock.
translation:
  language: zh_hans
  text: 凡你牛群和羊群中所生的头胎公畜，都要分别为圣，归给雅威你的上帝[a]。不可用你头生的牛做工，也不可剪你羊群中头生牲畜的毛。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威”译自希伯来文神名יהוה（YHWH）；传统上也译作“耶和华”或以“上主”代称。
    reason: 说明神名的原文形式及主要译法。
lexical_decisions:
- source_word: כָּל הַבְּכוֹר ... הַזָּכָר
  choice: 凡……头胎的公畜
  rationale: כָּל与单数“头胎”在这里具有逐一、总括的意义；“凡……都”是自然的现代汉语表达。后置的הַזָּכָר明确限定为公畜。
- source_word: אֲשֶׁר יִוָּלֵד
  choice: 所生
  rationale: ילד的Niphal形式在此表示被生下来；“所生”简洁地保留被动意义，并适合牲畜语境。
- source_word: בִּבְקָרְךָ וּבְצֹאנְךָ
  choice: 你牛群和羊群中
  rationale: בקר指大牲畜，语境中主要是牛；צאן指成群的小牲畜，可包括绵羊和山羊。“牛群和羊群”保留两类牲畜的对举，并符合现代汉语习惯。
- source_word: תַּקְדִּישׁ לַיהוָה
  choice: 分别为圣，归给雅威
  rationale: קדש的Hiphil形式表示使之成为圣、专供神圣用途；“分别为圣，归给”兼顾礼仪含义和归属关系。
- source_word: יהוה
  choice: 雅威
  rationale: 按希伯来文四字神名YHWH作音译，直接呈现经文中的盟约之名，不以称号代替。
- source_word: לֹא תַעֲבֹד בִּבְכֹר שׁוֹרֶךָ
  choice: 不可用你头生的牛做工
  rationale: עבד配合介词ב表示把该牛用于劳作；“用……做工”清楚表达禁止役使头生牛的意思。
- source_word: וְלֹא תָגֹז בְּכוֹר צֹאנֶךָ
  choice: 也不可剪你羊群中头生牲畜的毛
  rationale: גזז意为剪毛；补出“毛”符合现代汉语搭配。“羊群中头生牲畜”避免把צאן严格限缩为绵羊。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名YHWH。“雅威”较直接地按通行学术重构音译；“耶和华”是历史悠久但基于混合元音的形式，“上主”则以称号替代专名。正文保留专名，并以脚注说明。
- issue: “分别为圣”的礼仪含义
  choice: 分别为圣，归给雅威
  alternative: 献给雅威；奉献给雅威
  rationale: תַּקְדִּישׁ首先表示将对象置于神圣归属和用途之中，不必在本节内把具体处置方式解释成某一种献祭行为。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“凡……都”表达希伯来文的逐一总括；“分别为圣，归给”保留礼仪语义，又让普通读者容易理解。后半句用“做工”和“剪……的毛”，保持农牧语境中的具体性。
