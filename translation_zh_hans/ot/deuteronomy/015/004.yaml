  text: אֶ֕פֶס כִּ֛י לֹ֥א יִֽהְיֶה בְּ/ךָ֖ אֶבְי֑וֹן כִּֽי בָרֵ֤ךְ יְבָֽרֶכְ/ךָ֙ יְהוָ֔ה בָּ/אָ֕רֶץ אֲשֶׁר֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ נֹֽתֵן לְ/ךָ֥ נַחֲלָ֖ה לְ/רִשְׁתָּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/004.yaml
  text: However[a], there should be no poor among you, because Yahweh will surely bless you in the land that Yahweh your God is giving you as an inheritance to possess,
translation:
  language: zh_hans
  text: 不过[a]，你中间不会有穷人，因为在雅威—你的上帝赐给你作产业、供你占有的土地上，雅威必定赐福给你，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “不过”也可译作“然而”“只是”或“除外”；希伯来语 אֶפֶס 在这里对前面的规定作限制或补充。
    reason: 词义存在可成立的替代译法，且该词承担重要的篇章限定功能。
lexical_decisions:
- source_word: אֶפֶס
  choice: 不过
  rationale: 该词对前文关于债务豁免的规定作限制或转折。“不过”符合现代汉语篇章衔接，同时不把转折程度说得过强。
- source_word: אֶבְיוֹן
  choice: 穷人
  rationale: 指经济上贫穷、缺乏生活资源的人；“穷人”自然、宽泛，也便于普通读者理解。
- source_word: כִּי
  choice: 因为
  rationale: 第二个 כִּי 引出前述话语的原因，即雅威所赐的福；“因为”清楚表达因果关系。
- source_word: בָרֵךְ יְבָרֶכְךָ
  choice: 必定赐福给你
  rationale: 不定式绝对式与限定动词连用，加强“赐福”的语气；“必定”保留强调而不额外加入“丰丰富富”等原文未明说的程度。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译直接呈现四字神名，保留其专名性质，不以“主”这一称号代替。
- source_word: נֹתֵן
  choice: 赐给
  rationale: 该分词在应许之地的语境中表达上帝正在实施或确定要实施的赐予；汉语“赐给”自然体现施予者是上帝。
- source_word: נַחֲלָה
  choice: 产业
  rationale: 这是表示所分配之承受物的盟约土地用语；“产业”在汉语圣经语域中兼具土地、法定份额和代际承受的意味。
- source_word: לְרִשְׁתָּהּ
  choice: 让你取得
  rationale: 源自动词 ירשׁ，表示取得并占有土地；在“作产业”之后译作“让你取得”，避免机械重复，又保留实际接收土地的动作。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名。正文采用“雅威”这一较贴近 Yahweh 的现代汉语音译，以保留盟约神名的专名性质，而不以称号替代。
- issue: לֹא יִהְיֶה 的陈述语气
  choice: 不会有
  alternative: 不该有
  rationale: 希伯来语未完成体在这里可被理解为对蒙福结果的陈述，也可带有理想或规范意味。正文选用“不会有”，贴近其直陈形式，并让下一节所给条件以及本章第11节形成的张力保留下来，不在本节中提前化解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“你中间”保留盟约群体内部的空间性表达；“作产业、让你取得”兼顾法律土地语义与自然汉语。句末保留逗号，因为本句的思想和条件结构延续到下一节。
