  text: רַ֥ק אֶת דָּמ֖/וֹ לֹ֣א תֹאכֵ֑ל עַל הָ/אָ֥רֶץ תִּשְׁפְּכֶ֖/נּוּ כַּ/מָּֽיִם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/023.yaml
  text: Only[a], you shall not eat its blood; you shall pour it out on the ground like water.
translation:
  language: zh_hans
  text: 只是不可吃它的血[a]；要把血倒在地上，像倒水一样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “它的血”也可表达为“这牲畜的血”；希伯来文直译“它的血”。
    reason: 说明希伯来文第三人称单数词尾所指的是前文所说的牲畜，避免中文“它”可能产生的指代疑问。
lexical_decisions:
- source_word: רַק
  choice: 只是
  rationale: 表示对前文许可的限制或例外；“只是”在现代汉语中简洁自然，也保留了原文的限制语气。
- source_word: אֶת דָּמוֹ
  choice: 它的血
  rationale: אֶת 是直接宾语标记，דָּמוֹ 直译为“它的血”，指所述牲畜的血；不译作“生命之血”，以免加入本节未明说的解释。
- source_word: לֹא תֹאכֵל
  choice: 不可吃
  rationale: 未完成式在律法语境中表达禁令；“不可吃”既保留法律命令的语气，也符合庄重自然的现代汉语。
- source_word: עַל הָאָרֶץ
  choice: 在地上
  rationale: 本处指把血倒在土地、地面上；“在地上”比“在大地上”或“在那地上”更符合具体语境。
- source_word: תִּשְׁפְּכֶנּוּ
  choice: 要把血倒
  rationale: 该动词表示倾倒、倒出；为避免汉语代词指向含混，复现“血”，同时准确表达处理血的动作。
- source_word: כַּמָּיִם
  choice: 像倒水一样
  rationale: 保留原文“像水”的明喻，并按现代汉语习惯补出比较中省略的动作，使表达自然清楚。
theological_decisions:
- issue: 饮食律法中对血的处理
  choice: 直接译为禁止食用牲畜的血，并命令将血倒在地上
  alternative: 译作“生命之血”，从而突出血与生命的关联
  rationale: 本节本身只陈述具体禁令和处理方式，并未明说其神学理由；因此不把五经其他经文中血与生命的联系增添到正文中。
translation_notes:
  register: 采用现代、庄重而通俗的律法文体。“不可”保留命令语气；后半句用“要”与前半句禁令相配。“像倒水一样”使希伯来文简洁明喻在汉语中自然可懂。
