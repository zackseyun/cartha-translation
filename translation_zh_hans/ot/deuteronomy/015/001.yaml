  text: מִ/קֵּ֥ץ שֶֽׁבַע שָׁנִ֖ים תַּעֲשֶׂ֥ה שְׁמִטָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/001.yaml
  text: At the end of every seven years you shall make a release[a].
translation:
  language: zh_hans
  text: 每逢七年期满，你要施行豁免[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“免除”或“免债”；希伯来语“豁免”指第七年债务律例所施行的免除。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקֵּץ
  choice: 期满
  rationale: מִקֵּץ表示到一段时期的终点。结合“七年”，译作“七年期满”自然、庄重，并保留周期终结之时的时间含义，不强行判定是第七年末的某一刻还是周期届满之际。
- source_word: שֶׁבַע שָׁנִים
  choice: 每逢七年
  rationale: 原文直译为“七年”；在这条反复施行的律例中，“每逢”清楚表达周期性，也符合现代汉语习惯。
- source_word: תַּעֲשֶׂה
  choice: 你要施行
  rationale: עשה本义宽泛，可指“做、实行”。此处宾语是制度性的שְׁמִטָּה，译作“施行”既体现律法命令的效力，又比“做一个豁免”自然。
- source_word: שְׁמִטָּה
  choice: 豁免
  rationale: 该词含放下、免除之意，在后文具体指第七年债务律例所规定的免债。“豁免”简洁且适合现代法律语境，同时让后文进一步说明其对象；“免除债务”则在本节略显提前释义。
theological_decisions:
- issue: שְׁמִטָּה在本节是否直接明说为债务取消
  choice: 正文采用较宽的“豁免”，由后文界定其为债务方面的豁免。
  alternative: 译作“免除债务”或“债务取消”。
  rationale: 原文本节仅使用制度名称שְׁמִטָּה，并未在句内出现“债务”一词。保留较宽表达可避免把后文说明提前嵌入正文，也保存该词“释放、免除”的语义幅度。
translation_notes:
  register: 采用现代、庄重而易懂的律法语言。“每逢七年期满”表达周期性；“施行豁免”保留制度性措辞，脚注补充词义及上下文所指。
