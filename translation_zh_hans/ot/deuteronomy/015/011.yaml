  rationale: 修订将“在你地中”置于并列对象之前，使其在汉语中自然地涵盖原文所列的弟兄、困苦者和穷乏者；同时以“穷乏人”对应第二个贫困术语，保留其与“困苦人”的并列而不夸大二者差异。脚注标记保留在“弟兄[a]”“困苦人[b]”后，分别锚定相应术语。
