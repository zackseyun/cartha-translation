  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּ֛י לֹא יֶחְדַּ֥ל אֶבְי֖וֹן מִ/קֶּ֣רֶב הָ/אָ֑רֶץ עַל כֵּ֞ן אָנֹכִ֤י מְצַוְּ/ךָ֙ לֵ/אמֹ֔ר פָּ֠תֹחַ תִּפְתַּ֨ח אֶת יָדְ/ךָ֜ לְ/אָחִ֧י/ךָ לַ/עֲנִיֶּ֛/ךָ וּ/לְ/אֶבְיֹנְ/ךָ֖ בְּ/אַרְצֶֽ/ךָ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/011.yaml
  text: For the poor will never cease from the midst of the land[a]; therefore I am commanding you, saying, ‘You must surely open your hand to your brother, to your afflicted one[b], and to your poor one in your land.’
translation:
  language: zh_hans
  text: 因为这地中总不会没有穷人，所以我吩咐你说：“你务要向在你地中的弟兄、困苦人和穷乏人张开手。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，为施行慷慨的命令说明理由；“因为”自然保留了解释关系。
- source_word: לֹא יֶחְדַּל אֶבְיוֹן
  choice: 总不会没有穷人
  rationale: 否定式未完成态表达持续的现实。“总不会没有”在现代汉语中自然地传达“穷人不会断绝”，并将单数 אֶבְיוֹן 按集合意义处理。
- source_word: מִקֶּרֶב הָאָרֶץ
  choice: 这地中
  rationale: קֶרֶב 表示“中间、当中”；申命记的语境指所赐的约地，因此译作“这地”，不泛化为全世界。
- source_word: עַל כֵּן
  choice: 所以
  rationale: 清楚表达由前句理由引出的结论，符合现代汉语。
- source_word: אָנֹכִי מְצַוְּךָ לֵאמֹר
  choice: 我吩咐你说
  rationale: 保留直接命令以及希伯来文 לֵאמֹר 的引语引介形式，同时避免生硬的进行体。
- source_word: פָּתֹחַ תִּפְתַּח אֶת יָדְךָ
  choice: 你务要……张开手
  rationale: 同源不定式与限定动词的组合加强命令语气；“务要”体现强调，“张开手”保留慷慨施予的原文隐喻。
- source_word: לְאָחִיךָ
  choice: 向你的弟兄
  rationale: 保留男性单数亲属称谓及其盟约共同体色彩；其代表性的同胞含义由脚注说明。
- source_word: לַעֲנִיֶּךָ
  choice: 向你地上困苦的人
  rationale: עָנִי 可指贫穷、卑微或受苦者；“困苦的人”既保留语义张力，也与同句 אֶבְיוֹן 区分。
- source_word: וּלְאֶבְיֹנְךָ
  choice: 和贫穷的人
  rationale: 译出与 עָנִי 并列的第二个称谓，并延续本节前半句 אֶבְיוֹן 的“穷人”概念。
- source_word: בְּאַרְצֶךָ
  choice: 你地上
  rationale: 指以色列人在约中所得之地；按汉语语序前置，使它自然地统摄后面的困苦者和贫穷者。
theological_decisions:
- issue: 盟约共同体中的亲属称谓
  choice: 你的弟兄
  alternative: 你的以色列同胞
  rationale: 原文使用阳性单数“弟兄”，具有亲属和盟约共同体双重色彩。正文保留这一比喻和语法形式，脚注说明其代表性含义，不将它直接扁平化为中性集体称谓。
- issue: הָאָרֶץ 与 אַרְצֶךָ 的范围
  choice: 这地／你地上
  alternative: 世上／你的国家里
  rationale: 申命记的直接语境是赐给以色列的约地；此译法保留历史与盟约背景，同时不把本句抽象化为关于整个地球的陈述。
- issue: עָנִי 与 אֶבְיוֹן 的语义重叠
  choice: 困苦的人和贫穷的人
  alternative: 贫穷的人和穷乏的人
  rationale: 两个词的语义范围重叠，却并非完全相同。分别译作“困苦”和“贫穷”，保留前者可能侧重受压、卑微或贫困的张力，不将两者合并。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“务要”保留加强命令的力度而不过分古雅；“张开手”保留原文关于慷慨施予的身体隐喻。两处“地”维持申命记的约地语境。
