  text: בִּ/שְׁעָרֶ֖י/ךָ תֹּאכֲלֶ֑/נּוּ הַ/טָּמֵ֤א וְ/הַ/טָּהוֹר֙ יַחְדָּ֔ו כַּ/צְּבִ֖י וְ/כָ/אַיָּֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/022.yaml
  text: You may eat it within your gates[a]; the unclean and the clean alike may eat it[b], as the gazelle and the deer.
translation:
  language: zh_hans
  text: 你可以在各城里吃它[a]；不洁净的人和洁净的人都可以吃[b]，就像吃羚羊和鹿一样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“在你的城门以内”；这是指在所属的城镇或当地社区中。
    reason: cultural_note
  - marker: b
    text: 即礼仪上不洁净的人和礼仪上洁净的人都可以吃。
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּשְׁעָרֶיךָ
  choice: 在各城里
  rationale: 字面为“在你的城门以内”。“城门”在此代指城镇及其管辖范围；正文采用现代汉语自然表达“在各城里”，脚注保留原文意象。
- source_word: תֹּאכֲלֶנּוּ
  choice: 你可以吃它
  rationale: 第二人称阳性单数动词带第三人称阳性单数宾语，所指承接上文的牲畜或其肉；结合上下文译为许可性的“可以吃”。
- source_word: הַטָּמֵא וְהַטָּהוֹר
  choice: 不洁净的人和洁净的人
  rationale: 这组词指礼仪身份而非道德品格；补出“人”使现代汉语表意清楚，同时保留申命记常见的“洁净／不洁净”术语。
- source_word: יַחְדָּו
  choice: 都可以
  rationale: 此处强调两类人同样获准食用，并非必须同时进食；“都可以”自然传达其共同适用的含义。
- source_word: כַּצְּבִי
  choice: 像吃羚羊
  rationale: צְבִי通常指羚羊；比较的重点是按食用野味的方式食用，汉语补出“吃”以显明省略的比较关系。
- source_word: וְכָאַיָּל
  choice: 和鹿一样
  rationale: אַיָּל指鹿，也可特指雄鹿；“鹿”是清楚、通用的现代译法，并与“羚羊”构成自然并列。
theological_decisions:
- issue: “洁净／不洁净”的性质
  choice: 正文保留“不洁净的人和洁净的人”，脚注说明是礼仪状态
  alternative: 礼仪上不洁净的人和礼仪上洁净的人
  rationale: 原文使用简洁的礼仪术语。正文保留其经文用语及张力，脚注防止读者误解为道德上的善恶评价。
- issue: 与羚羊和鹿的比较对象
  choice: 译作“就像吃羚羊和鹿一样”
  alternative: 像羚羊和鹿一样
  rationale: 上下文讨论食肉；原文的简略比较若直译，汉语可能误读为人像动物一样进食。补出“吃”只显明语境中已有的省略，不增添祭祀方面的解释。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“在各城里”避免生硬照搬希伯来语习语；“洁净／不洁净”保留申命记的核心礼仪词汇，并用脚注澄清。
