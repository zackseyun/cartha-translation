base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/013.yaml
  text: And when you send him away free from you[a], you shall not send him away empty-handed.
translation:
  language: zh_hans
  text: 当你让他以自由之身离开你时，不可让他空手离去。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/כִֽי
  choice: ……的时候
  rationale: 该连词组合既可表示条件“如果”，也可表示时间“当……的时候”。本条律例承接前文所规定的释放，正文采用自然的时间表达，同时以脚注保留条件性读法。
- source_word: תְשַׁלְּחֶנּוּ
  choice: 使他……离开／让他……离去
  rationale: שלח 的皮尔式在此表示打发、遣走或让其离开；两个分句均保留“离去/离开”的动作，既符合释放奴仆的语境，也避免加入原文没有明说的“服役”等内容。
- source_word: חָפְשִׁי
  choice: 自由
  rationale: 该形容词表示脱离奴役、成为自由；译为“自由”简洁地保留其身份和处境上的含义。
- source_word: מֵעִמָּךְ
  choice: 离开你
  rationale: 原意近于“从你那里”或“从与你同在之处”；“离开你”在现代汉语中自然直接，不扩译为“离开你的服役”或“离开你的家”。
- source_word: לֹא
  choice: 不可
  rationale: 希伯来语否定词与未完成式在律法语境中构成禁令；“不可”兼具明确的规范力量和庄重、自然的汉语表达。
- source_word: רֵיקָם
  choice: 空手
  rationale: 该副词意为“空着、毫无所得地”；在离去时给予物资的上下文中，“空手”是准确而自然的汉语习语。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重且易懂的律法语体。“使他自由离开”贴近希伯来语的使役/遣离表达；“不可让他空手离去”则以自然汉语传达禁令。代词“他”依照本节希伯来语阳性单数形式；前文另有对男女奴仆的规定。
