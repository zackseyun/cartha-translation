  text: וְ/הָיָה֙ כִּֽי יֹאמַ֣ר אֵלֶ֔י/ךָ לֹ֥א אֵצֵ֖א מֵ/עִמָּ֑/ךְ כִּ֤י אֲהֵֽבְ/ךָ֙ וְ/אֶת בֵּיתֶ֔/ךָ כִּי ט֥וֹב ל֖/וֹ עִמָּֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/016.yaml
  text: And if he says to you[a], ‘I will not go out from you,’ because he loves you and your household, because it is good for him with you[b],
translation:
  language: zh_hans
  text: 如果他对你说：“我不离开你[a]”，因为他爱你和你的家人[b]，也因为他在你那里过得很好，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“我不从你这里出去”；按这里释放仆人的语境，也可译作“我不愿离开你”或“我不愿自由离去”。
    reason: lexical_alternative
  - marker: b
    text: 原文为“你的家”，这里指家中的人和家庭共同体，不只是房屋。
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: 如果
  rationale: 这是律法中引出可能情形的惯用结构；译作“如果”符合现代汉语条件句，也保留上下文的法律论述脉络。
- source_word: יֹאמַר אֵלֶיךָ
  choice: 他对你说
  rationale: 未完成式在个案律法中表示可能发生的情形；现代汉语用一般现在表达最自然。
- source_word: לֹא אֵצֵא מֵעִמָּךְ
  choice: 我不愿离开你
  rationale: יָצָא本义为“出去”，在这里指仆人获释后离开主人。结合直接引语的意愿语境，译作“不愿离开你”自然表达其拒绝离去，同时由脚注保留原文“出去”的意象。
- source_word: כִּי אֲהֵבְךָ
  choice: 因为他爱你
  rationale: כִּי在此说明仆人不愿离开的原因，直译为“因为”。
- source_word: וְאֶת־בֵּיתֶךָ
  choice: 和你家里的人
  rationale: בַּיִת在此主要指主人家中的成员及其家庭共同体，而不仅是房屋；“家里的人”清楚而自然。
- source_word: כִּי טוֹב לוֹ עִמָּךְ
  choice: 也因为他跟你在一起过得很好
  rationale: 保留第二个כִּי所引出的并列原因；“跟你在一起”体现עִמָּךְ的相伴关系，“过得很好”自然传达טוֹב לוֹ。
theological_decisions:
- issue: 仆人不离开的表述是否强调法律上的自由、空间上的出去或关系上的离开
  choice: 正文采用“我不愿离开你”，脚注说明原文字面意义及获释语境
  alternative: “我不出去离开你”或“我不愿从你这里获得自由”
  rationale: 原文动词字面为“出去”，在本章语境中涉及获释，但话语本身突出仆人因爱和生活良好而选择留下。正文不把“出去”单一解释成抽象的“获得自由”，从而保留法律与关系两方面的张力。
translation_notes:
  register: 采用现代、庄重而易懂的律法叙述语体。直接引语用“不愿离开你”体现自愿选择；两个“因为”分别保留原文两项理由。句末逗号表明本节句法在下一节继续。
