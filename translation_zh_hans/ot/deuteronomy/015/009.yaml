source:
  edition: WLC
  text: הִשָּׁ֣מֶר לְ/ךָ֡ פֶּן יִהְיֶ֣ה דָבָר֩ עִם לְבָבְ/ךָ֨ בְלִיַּ֜עַל לֵ/אמֹ֗ר קָֽרְבָ֣ה שְׁנַֽת הַ/שֶּׁבַע֮ שְׁנַ֣ת הַ/שְּׁמִטָּה֒ וְ/רָעָ֣ה עֵֽינְ/ךָ֗ בְּ/אָחִ֨י/ךָ֙ הָֽ/אֶבְי֔וֹן וְ/לֹ֥א תִתֵּ֖ן ל֑/וֹ וְ/קָרָ֤א עָלֶ֨י/ךָ֙ אֶל יְהוָ֔ה וְ/הָיָ֥ה בְ/ךָ֖ חֵֽטְא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/009.yaml
  text: Be careful lest there be in your heart a wicked thought[a], saying, ‘The seventh year, the year of release, is near,’ and your eye be evil toward your poor brother and you give him nothing; then he may cry out against you to Yahweh[c][b], and it will be sin in you.
translation:
  language: zh_hans
  text: 你要谨慎，免得心里生出邪恶的念头，说：“第七年，就是豁免年[a]，临近了。”以致你以恶眼看待你穷乏的弟兄[b]，什么也不给他；他就会向雅威呼求，控告你，你就有罪了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “豁免年”也可译作“免债年”或“债务解除年”，指每逢第七年实行的债务豁免。
    reason: lexical_alternative
  - marker: b
    text: “以恶眼看待”直译为“你的眼目邪恶”。这是希伯来语惯用说法，指吝啬、心有不甘，不肯帮助有需要的人。“弟兄”在这里指同属盟约群体的人，不一定是亲生兄弟。
    reason: cultural_note
lexical_decisions:
- source_word: הִשָּׁמֶר לְךָ
  choice: 你要谨慎
  rationale: 该结构是带反身意味的警告，现代汉语用“你要谨慎”自然表达自我防备之意。
- source_word: דָבָר עִם לְבָבְךָ בְלִיַּעַל
  choice: 心里生出邪恶的念头
  rationale: דָבָר 在此由后面的“说”引出具体内容，指内在的念头或盘算；בְלִיַּעַל 在这里是性质描述，意为邪恶、卑劣，并非专名。
- source_word: שְׁנַת הַשְּׁמִטָּה
  choice: 豁免年
  rationale: 本章语境是第七年对债务的豁免；“豁免年”简洁、易懂，也保留其制度性称谓。
- source_word: וְרָעָה עֵינְךָ
  choice: 用恶眼看
  rationale: 保留希伯来语“眼恶”的形象，以呈现原文的文学质感；脚注说明其吝啬、不情愿相助的惯用含义。
- source_word: בְּאָחִיךָ הָאֶבְיוֹן
  choice: 你的穷苦弟兄
  rationale: “弟兄”保留 אָח 的盟约群体亲属语言；“穷苦”表达 אֶבְיוֹן 所指的贫困和缺乏。
- source_word: וְלֹא תִתֵּן לוֹ
  choice: 什么也不给他
  rationale: 把否定式的实际结果直接译出，符合上下文中拒绝提供借贷或援助的情境。
- source_word: וְקָרָא עָלֶיךָ אֶל יְהוָה
  choice: 他就会向雅威呼求，控告你
  rationale: “呼求”保留 קרא 的动作，“控告你”表达 עָלֶיךָ 在此所含的申诉、指控意味。
- source_word: וְהָיָה בְךָ חֵטְא
  choice: 罪便归到你身上
  rationale: 这一表达既自然，又保留原文“罪在你身上”的责任归属意味。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以“雅威”音译四字神名，明确保留原文所用的上帝之名。
theological_decisions:
- issue: 是否保留“恶眼”的希伯来语惯用形象
  choice: 正文译作“用恶眼看”，并用脚注解释
  alternative: 吝啬地对待；不情愿帮助
  rationale: 原文以“眼恶”描绘因豁免年临近而不肯援助穷人的心态。保留形象可呈现原文措辞，脚注则保障现代读者理解。
- issue: אָחִיךָ 的群体含义
  choice: 你的穷苦弟兄
  alternative: 你穷苦的同胞；你穷苦的以色列同胞
  rationale: “弟兄”忠实保留原文的家庭性称呼，同时不把它误限为亲生兄弟；脚注交代其盟约群体语境。
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名，音译为“雅威”可保留其专名性质，不以称号替代。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。正文保留“恶眼”“弟兄”等原文的重要形象与群体语言，同时借脚注消除可能的误解；句法按汉语习惯调整，但保留警告、内心盘算、拒绝援助、向神申诉和罪责归属的因果推进。
