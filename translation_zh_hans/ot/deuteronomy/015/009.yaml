  to: 你要谨慎，免得心里生出邪恶的念头，说：“第七年，就是豁免年[a]，临近了。”以致你以恶眼看待你穷乏的弟兄[b]，什么也不给他；他就会向雅威呼求，控告你，你就有罪了。
  rationale: 修订仅改善汉语表达并更紧密对应原文的句法与责任表述：以“以致”连接临近豁免年所引发的吝啬反应；保留“恶眼”意象并以脚注解释；以“你就有罪了”自然表达罪责在当事人身上。未改变神名、豁免制度或“弟兄”的群体含义。
