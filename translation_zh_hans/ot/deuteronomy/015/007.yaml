  rationale: 修订仅调整城镇短语和“闭手”意象的汉语表达，使其更合乎现代标准汉语，同时保留原文的条件结构、城门／城镇转喻、圣约亲属称谓和拒绝施予的具体意象。脚注锚点及内容均保留并与所附词语对应。
