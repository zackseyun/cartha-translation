  terminology: “耶和华”“上帝”“弟兄”“穷乏人”等用语庄重、通行，并与原文的神名、亲属式圣约语言及贫困语义相称。以“穷乏人”前后一致，可避免“穷人／贫穷的”交替带来的轻微不整齐。
