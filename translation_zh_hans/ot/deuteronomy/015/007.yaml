source:
  edition: WLC
  text: כִּֽי יִהְיֶה֩ בְ/ךָ֨ אֶבְי֜וֹן מֵ/אַחַ֤ד אַחֶ֨י/ךָ֙ בְּ/אַחַ֣ד שְׁעָרֶ֔י/ךָ בְּ/אַ֨רְצְ/ךָ֔ אֲשֶׁר יְהוָ֥ה אֱלֹהֶ֖י/ךָ נֹתֵ֣ן לָ֑/ךְ לֹ֧א תְאַמֵּ֣ץ אֶת לְבָבְ/ךָ֗ וְ/לֹ֤א תִקְפֹּץ֙ אֶת יָ֣דְ/ךָ֔ מֵ/אָחִ֖י/ךָ הָ/אֶבְיֽוֹן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/007.yaml
  text: If there is a poor man among you[a], one of your brothers, within one of your gates in your land that Yahweh your God is giving you[b], you shall not harden your heart or shut your hand against your poor brother.
translation:
  language: zh_hans
  text: “如果在耶和华你上帝赐给你的地上、在你任何一座城中[a]，有一个穷乏人，是你弟兄中的一人[b]，你不可硬着心，也不可对你这穷乏的弟兄把手攥紧。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译是“在你的一座城门内”；“城门”在这里可指城镇。
    reason: lexical_alternative
  - marker: b
    text: 这里的“弟兄”是亲属式称呼，指圣约群体中的成员。
    reason: cultural_note
lexical_decisions:
- source_word: כִּי יִהְיֶה
  choice: 如果……有
  rationale: 在律例的个案式表述中引出假设情形；“如果”保留条件意味，“有”则自然表达一般性规定。
- source_word: אֶבְיוֹן
  choice: 穷人／贫穷的
  rationale: 该词指贫穷、匮乏而需要帮助的人；中文用“穷人”及后文“贫穷的弟兄”既准确又自然。
- source_word: מֵאַחַד אַחֶיךָ
  choice: 是你的弟兄之一
  rationale: 保留希伯来文以家庭关系表达圣约群体成员关系的措辞，避免直接解释成“同胞”或“以色列人”。
- source_word: בְּאַחַד שְׁעָרֶיךָ
  choice: 无论哪一座城里
  rationale: “城门”在此转喻城镇；译出实际所指比直译“在你的一座城门内”更符合现代汉语，并以脚注注明原文意象。
- source_word: בְּאַרְצְךָ אֲשֶׁר יְהוָה אֱלֹהֶיךָ נֹתֵן לָךְ
  choice: 在耶和华你上帝赐给你的地上
  rationale: 保留土地是耶和华所赐的圣约框架；“赐给”自然传达分词所表示的赐予行动。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经传统中对四字神名最通行、最易识别的音译。
- source_word: לֹא תְאַמֵּץ אֶת לְבָבְךָ
  choice: 不可硬着心
  rationale: 保留“心变硬、不肯怜悯”的身体意象，同时符合自然现代汉语。
- source_word: וְלֹא תִקְפֹּץ אֶת יָדְךָ
  choice: 也不可……握紧手
  rationale: 保留原文把手闭合、拒绝施予的鲜明意象；“握紧手”在中文中可自然表达不肯伸手帮助。
- source_word: מֵאָחִיךָ הָאֶבְיוֹן
  choice: 向你贫穷的弟兄
  rationale: 介词在此指向拒绝施助的对象；“向”与“握紧手”搭配自然，并保留“弟兄”的关系性语言。
theological_decisions:
- issue: 圣约亲属称谓 אַחֶיךָ / אָחִיךָ 的处理
  choice: 弟兄之一／弟兄
  alternative: 同胞；以色列同族；亲族
  rationale: 原文用男性单数及复数的家庭称谓描述圣约群体内的成员。正文保留“弟兄”，脚注说明其群体含义，不把原文直接改写为解释性称谓。
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: “耶和华”是简体中文圣经语境中广为人知的专名形式，可使读者明确看出此处是以色列上帝的神名，而非普通称号。
- issue: 对穷乏者的责任所针对的范围
  choice: 保留“弟兄”的圣约群体范围
  alternative: 泛化为所有贫穷的人
  rationale: 本节直接谈圣约群体内部的贫穷成员；不应在翻译中把范围扩大或缩小。此处理并不推断其他经文对群体之外穷人的教导。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“硬着心”和“握紧手”保留希伯来文相互呼应的身体意象；调整地点短语至句首，使较长的律例句在中文中层次清楚。
