  text: לִ/פְנֵי֩ יְהוָ֨ה אֱלֹהֶ֤י/ךָ תֹאכֲלֶ֨/נּוּ֙ שָׁנָ֣ה בְ/שָׁנָ֔ה בַּ/מָּק֖וֹם אֲשֶׁר יִבְחַ֣ר יְהוָ֑ה אַתָּ֖ה וּ/בֵיתֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/020.yaml
  text: You and your household shall eat it before Yahweh your God year by year in the place that Yahweh will choose[a].
translation:
  language: zh_hans
  text: 你和你的全家要年年在雅威——你的上帝面前〔a〕，在雅威将选择的地方吃它。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִפְנֵי
  choice: 在……面前
  rationale: 该介词短语可表示“在……面前”或“在……同在中”；此处指在上帝临在之处举行敬拜筵席。“在……面前”自然简洁，并保留原文的空间与礼仪意味。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代汉语圣经读者熟悉的专名“耶和华”对应四字神名，而不以“主”这一称号替代。
- source_word: אֱלֹהֶיךָ
  choice: 你的上帝
  rationale: 准确表达带第二人称阳性单数后缀的盟约称谓；采用现代通行的“上帝”。
- source_word: תֹאכֲלֶנּוּ
  choice: 要……吃它
  rationale: 未完成式在律法语境中表达指示或义务，宾语后缀指上文所说的头生牲畜；“要……吃它”符合现代汉语规范性语体，又不强化为绝对命令。
- source_word: שָׁנָה בְּשָׁנָה
  choice: 年年
  rationale: 这是表示逐年重复的分配式短语；“年年”简洁自然，并保留反复举行的含义。
- source_word: בַּמָּקוֹם אֲשֶׁר יִבְחַר יְהוָה
  choice: 在耶和华将要选择的地方
  rationale: 保留申命记中关于中央敬拜地点的固定表达，并用“将要选择”呈现未完成式在语境中的前瞻性。
- source_word: אַתָּה וּבֵיתֶךָ
  choice: 你和你的全家
  rationale: 这里的“家”指家庭共同体，而非房屋；“全家”是自然的现代汉语，也能涵盖同属一家的人。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用上帝的专名而非“主”这一称号。中文正文采用传统且广为人知的专名“耶和华”，既保留专名性质，也便于普通现代读者理解。
- issue: לִפְנֵי 的礼仪含义
  choice: 在耶和华你上帝面前
  alternative: 在耶和华你上帝的同在中
  rationale: “面前”保留原文惯用语的具体表达和敬拜语境；“同在中”虽能阐明含义，却更偏解释性，故不纳入正文。
translation_notes:
  register: 采用自然、庄重的现代标准汉语和律法指示语气。调整语序，把“你和你的全家”置于句首，并将“年年”和地点短语置于谓语前，以符合汉语表达习惯；不增加原文未明说的祭司、圣所或家庭成员范围。
