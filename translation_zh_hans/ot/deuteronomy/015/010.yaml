  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: נָת֤וֹן תִּתֵּן֙ ל֔/וֹ וְ/לֹא יֵרַ֥ע לְבָבְ/ךָ֖ בְּ/תִתְּ/ךָ֣ ל֑/וֹ כִּ֞י בִּ/גְלַ֣ל הַ/דָּבָ֣ר הַ/זֶּ֗ה יְבָרֶכְ/ךָ֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ בְּ/כָֽל מַעֲשֶׂ֔/ךָ וּ/בְ/כֹ֖ל מִשְׁלַ֥ח יָדֶֽ/ךָ־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/010.yaml
  text: You shall surely give to him[a], and your heart shall not be troubled when you give to him[c][b], because on account of this thing Yahweh your God will bless you in all your work and in every undertaking of your hand.
translation:
  language: zh_hans
  text: 你一定要给他；给他的时候，你心里不要不情愿[a]。因为这件事，雅威——你的上帝必在你一切的工作和你手所办的一切事上[c]赐福给你。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “你心里不要不情愿”也可译作“心里不要舍不得”“心里不要难受”或“不要心怀不满”。
    reason: lexical_alternative
  - marker: c
    text: “你手所办的一切事”直译为“你手所伸出去做的一切”，意思是你着手办理或经营的一切。
    reason: lexical_alternative
lexical_decisions:
- source_word: נָתוֹן תִּתֵּן
  choice: 你一定要给
  rationale: 不定式绝对形与未完成式连用，加强命令语气；“一定要给”在现代汉语中自然地保留这一强调，又不额外加入“慷慨”等原文未明说的内容。
- source_word: לּוֹ
  choice: 给他
  rationale: 希伯来文为阳性单数代词，承接上文所说的贫困同胞。
- source_word: וְלֹא יֵרַע לְבָבְךָ
  choice: 心里不要舍不得
  rationale: 该短语描写施与时内心负面、勉强或吝惜的反应；“舍不得”符合本节经济与施济语境，并保留其内在态度的重点。
- source_word: בְּתִתְּךָ לוֹ
  choice: 给他的时候
  rationale: 介词 בְּ 加不定式结构在此表达时间或伴随情形，译作“……的时候”自然清楚。
- source_word: כִּי בִּגְלַל הַדָּבָר הַזֶּה
  choice: 因为这件事
  rationale: בִּגְלַל 表原因，הַדָּבָר הַזֶּה 指前述的施与之举；“因为这件事”既贴近字面，也能自然承接上文。
- source_word: יְבָרֶכְךָ
  choice: 必……赐福给你
  rationale: ברך 是常用的“赐福”；“必”传达此处未完成式在应许语境中的确定性。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译呈现四字神名 YHWH，不用称号代替专名；脚注注明中文传统译法。
- source_word: אֱלֹהֶיךָ
  choice: 你的上帝
  rationale: 直接表达带第二人称单数后缀的盟约性称谓。
- source_word: בְּכָל מַעֲשֶׂךָ
  choice: 在你一切工作……上
  rationale: מַעֲשֶׂה 范围较广，可指所做的事或工作；此处与经济生活相关，“工作”自然且不过度限缩。
- source_word: וּבְכֹל מִשְׁלַח יָדֶךָ
  choice: 和你手所办的一切事上
  rationale: 该习语字面涉及“手的伸出/派出”，实际指人着手经营或办理的事；正文采用可懂的汉语，同时用“手”保留原文意象。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；“耶和华”你的上帝
  rationale: 原文直接使用四字神名，而非“主”这一称号。“雅威”是依据常见学术重建的现代音译；因确切古音不能完全确定，脚注保留传统译名。
- issue: 受助者的单数阳性代词
  choice: 他
  alternative: 那人；他们
  rationale: 原文后缀明确为阳性单数，并承接上文个别的贫困同胞；正文保留单数，不将其泛化为复数。
- issue: 赐予与蒙福之间的因果表述
  choice: 因为这件事……必……赐福给你
  alternative: 正因你这样做……会赐福给你
  rationale: 保留 בִּגְלַל 明示的因果关系，不把经文系统化为某种功德论，也不削弱其应许语气。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“一定要”明确传达希伯来文加强命令的结构；“舍不得”较口语化但准确呈现施与时内心吝惜或勉强的状态。句子保留原文从命令、内心态度到赐福应许的推进，也保留“一切工作”与“你手所办的一切事”的并列。
