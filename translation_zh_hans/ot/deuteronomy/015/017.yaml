base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/017.yaml
  text: then you shall take the awl and put it through his ear and into the door[a], and he shall be your slave permanently. And you shall do the same for your female slave.
translation:
  language: zh_hans
  text: 你就要拿锥子，穿过他的耳朵，刺入门中；他便永久作你的奴隶[a]。对你的女奴也要这样做。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“终身”。原文所用的词可表示长久、无预定终点；在这一法律语境中，也可理解为终身。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּרְצֵעַ
  choice: 锥子
  rationale: מַרְצֵעַ指用于钻孔或刺穿的尖头工具；“锥子”是现代汉语中准确、自然的对应词。
- source_word: וְנָתַתָּה בְאָזְנוֹ וּבַדֶּלֶת
  choice: 穿过他的耳朵，刺入门中
  rationale: 原文直译近于“把它放入他的耳朵和门中”。结合锥子的用途及仪式语境，这里明确表达锥子穿耳并进入门内，同时保留耳朵与门两个并列要素。
- source_word: עֶבֶד
  choice: 奴隶
  rationale: 本节描述经法律仪式确立的受奴役身份；“奴隶”比“仆人”更准确地保留其社会法律性质。
- source_word: עוֹלָם
  choice: 永久
  rationale: עוֹלָם表示持续而无预定终点的状态；在此法律语境中，“永久”既表达长期固定的效力，又避免让“永远”必然带上形而上的无限含义。脚注保留“终身”这一语境性理解。
- source_word: אֲמָתְךָ
  choice: 女奴
  rationale: אָמָה指女性奴隶或婢女；“女奴”与本节对男性使用的“奴隶”保持社会身份上的一致，也比“婢女”更少弱化受奴役性质。
- source_word: וְאַף
  choice: 也
  rationale: 该词将同一规定扩展到女奴；现代汉语用“也”简洁、自然地表达其附加意义。
- source_word: תַּעֲשֶׂה כֵּן
  choice: 要这样做
  rationale: 这是“照同样方式办理”的常用表达；译文自然，并保留命令语气。
theological_decisions:
- issue: 以色列奴役法规中的身份用语
  choice: 译作“奴隶／女奴”
  alternative: 仆人／婢女
  rationale: 经文所说的是由正式仪式确认的受奴役身份。“奴隶／女奴”保留原文的社会法律力度，而不以较柔和的称谓淡化这种关系；同时不据此引入后世制度或宗派性的判断。
- issue: עוֹלָם在本法律条文中的时限
  choice: 正文译“永久”，并以脚注列出“终身”
  alternative: 永远／终身
  rationale: 该词本身可表示长久、无预定终点或持续至相关时期终结。正文不把它扩大为形而上的无限时间，脚注则保留在此法律语境中理解为“终身”的可能性。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“刺入门中”比生硬的“放在门里”更符合锥子穿刺的动作；分号呈现仪式行为与其法律结果之间的紧密关系。
