  yaml_path: translation/ot/deuteronomy/015/003.yaml
  text: You may press a foreigner for payment[c][b][a], but whatever of yours is with your brother your hand shall release.
translation:
  language: zh_hans
  text: 你可以向外族人追讨债务[a]；但你弟兄[b]所欠你的债，你都要放手，不再追讨[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你可以向外族人催讨债务。”希伯来语动词在债务语境中指催讨或要求还债。
    reason: lexical_alternative
  - marker: b
    text: 这里的“弟兄”指以色列圣约群体中的同胞。
    reason: cultural_note
  - marker: c
    text: 原文直译近于“你的手要释放”；此处指在豁免年放弃追讨，免除自己的债权。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנָּכְרִי
  choice: 外族人
  rationale: 在本节的法律语境中，נָכְרִי 指以色列圣约群体以外的人。“外族人”自然地保留了这里与“弟兄”相对的社会及法律身份。
- source_word: תִּגֹּשׂ
  choice: 追讨债务
  rationale: נגשׂ 在债务语境中指催逼或要求偿还。“追讨债务”清楚表达法律上的索偿行为，而不额外暗示暴力。
- source_word: וַאֲשֶׁר יִהְיֶה לְךָ
  choice: 欠你的一切
  rationale: 该短语字面较开放，指属于债权人、在其弟兄那里的东西；结合债务豁免的上下文，“欠你的一切”在现代汉语中清楚自然。
- source_word: אָחִיךָ
  choice: 你弟兄
  rationale: 保留希伯来文的亲属称谓及其圣约群体色彩，而不在正文中直接解释为“以色列同胞”。
- source_word: תַּשְׁמֵט יָדֶךָ
  choice: 放手免除
  rationale: 原文直译近于“你的手要放开”，在安息年债务豁免语境中表示放弃索偿权。“放手免除”兼顾具体意象与法律含义。
theological_decisions:
- issue: “你弟兄”在申命记律法中的范围
  choice: 正文保留“你弟兄”这一圣约性的亲属称谓
  alternative: 译作“你的以色列同胞”或“本族同胞”
  rationale: 本节将外族人与“弟兄”对举，后者在这里指以色列圣约群体中的成员。保留原文称谓可避免在正文中过度阐释，范围则由脚注说明。
- issue: 债务豁免动作的表达
  choice: 译作“放手免除”，同时保留手放开的意象与免除债权的意义
  alternative: 仅译作“免除债务”或直译作“你的手要放开”
  rationale: 单纯意译会失去希伯来文的身体意象，纯直译又可能令现代读者不明所以；合并表达较能保存两方面。
translation_notes:
  register: 采用现代、庄重而易懂的法律性叙述。“外族人”与“你弟兄”保留原文的群体对照；分号呈现两项规定的转折。“放手免除”保留希伯来语意象，并借脚注澄清其债务豁免含义。
