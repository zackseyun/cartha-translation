  rationale: 修订仅调整末句的汉语句法与搭配，使“足够的”作为借贷内容，并以“照他所缺乏的”表达其额度应与对方的缺乏相称。这样既避免不自然的“补他的缺乏”，也不添加原文没有限定的援助种类或需要标准。
