  yaml_path: translation/ot/deuteronomy/015/008.yaml
  text: Instead[a], you must open your hand to him and surely lend him enough for whatever he lacks.
translation:
  language: zh_hans
  text: 相反[a]，你一定要向他敞开你的手，并且务必照他所缺乏的，借给他足够的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“敞开，你要敞开……借给，你要借给”；这种同根动词重复的结构用来加强语气。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 相反
  rationale: 结合上节禁止硬心、攥手不帮穷困弟兄的语境，此处具有转折对比作用；“相反”自然地呈现这种篇章关系。
- source_word: פָתֹחַ תִּפְתַּח
  choice: 一定要……敞开
  rationale: 不定式绝对形与未完成式同根连用，强化命令；“一定要”表达其强调和义务性，同时保留“敞开手”的具体意象。
- source_word: יָדְךָ
  choice: 你的手
  rationale: 直译为“手”，保留希伯来文以敞手表示慷慨相助的形象；汉语“向他敞开手”虽带古雅色彩，但清楚且适合经文语体。
- source_word: לוֹ
  choice: 向他
  rationale: 标明敞手相助的对象，承接上文所说贫穷的弟兄。
- source_word: וְהַעֲבֵט תַּעֲבִיטֶנּוּ
  choice: 务必借给他
  rationale: 再次出现不定式绝对形与同根限定动词，强调必须切实借给对方；“务必”保留强调，又不把借贷擅自改写为一般施舍。
- source_word: דֵּי
  choice: 足够
  rationale: 表达满足需要的充分数量或程度。
- source_word: מַחְסֹרוֹ
  choice: 补他的缺乏
  rationale: 保留名词“缺乏／所需”与随后同根动词的语义呼应，也表明借出的数额应足以应付其需要。
- source_word: אֲשֶׁר יֶחְסַר לוֹ
  choice: 就是他所缺少的
  rationale: 较贴近原文的关系从句，并保留 מַחְסֹרוֹ 与 יֶחְסַר 的同根重复，而不将两者合并得完全不可见。
theological_decisions:
- issue: 命令所要求的是借贷还是泛指慷慨给予
  choice: 保留“借给”
  alternative: 帮助／供给
  rationale: עבט 的使役形式在此明确指借出；不将其泛化为施舍，以免改变经文所规定的具体行动。
- issue: 援助范围是否仅为最低生存需求
  choice: 译作“足够补他的缺乏，就是他所缺少的”
  alternative: 足够维持他的基本生活
  rationale: 原文以“他的缺乏／他所缺少的”开放表达需要的范围，并未明说只限最低生存标准，因此保留其宽度和可能的张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“向他敞开手”保留原文意象；“一定要……务必……”对应两处强调结构。末句略保留原文的同根重复，以免把“缺乏／缺少”的修辞关系完全抹平。
