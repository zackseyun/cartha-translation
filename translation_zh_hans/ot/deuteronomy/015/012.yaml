base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/012.yaml
  text: If your brother[a], a Hebrew man or a Hebrew woman, is sold to you and serves you six years, then in the seventh year you shall send him out free from you.
translation:
  language: zh_hans
  text: 你的弟兄——无论是希伯来男子还是希伯来女子——若被卖给你，服侍你六年，到了第七年，你要释放他[a]，使他脱离你而得自由。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文在“希伯来男子还是希伯来女子”之后，使用阳性单数的宾语后缀，直译为“释放他”。这一阳性单数概括性地指获释的人；这条律例适用于希伯来男子或女子。
    reason: 说明原文的性别语法形式及律例的涵盖范围。
lexical_decisions:
- source_word: יִמָּכֵר
  choice: 被卖给你
  rationale: 尼法勒形态在这里表示被动或反身意义；译作“被卖给你”最贴近原文形式，也不擅自判定他是自卖还是由别人卖出。
- source_word: אָחִיךָ
  choice: 你的弟兄
  rationale: 保留原文带有盟约群体和亲属色彩的“弟兄”，不将其弱化为单纯的民族或社会称谓。后面的并列说明明确涵盖男子和女子。
- source_word: הָעִבְרִי ... הָעִבְרִיָּה
  choice: 希伯来男子……希伯来女子
  rationale: 两个词分别是阳性和阴性的“希伯来人”，本身并非通常表示奴仆的名词；译文保留其民族及性别信息，由上下文表达受约束服侍的处境。
- source_word: וַעֲבָדְךָ
  choice: 服侍你
  rationale: עבד在此指为对方服劳役或效力；“服侍你”既自然，也不额外限定具体劳动性质。
- source_word: שֵׁשׁ שָׁנִים
  choice: 六年
  rationale: 直接对应原文的数字和时间表达。
- source_word: וּבַשָּׁנָה הַשְּׁבִיעִת
  choice: 到了第七年
  rationale: 以自然汉语呈现六年服侍之后进入第七年的法律时序。
- source_word: תְּשַׁלְּחֶנּוּ
  choice: 你就要让他……离开
  rationale: 保留שלח“使离去、送走”的动作意象，同时以现代汉语自然表达解除服役关系。原文宾语后缀为阳性单数，译文用“他”反映这一形式，并以脚注说明其适用范围。
- source_word: חָפְשִׁי
  choice: 自由
  rationale: 该词在释放奴仆的语境中表示获得自由身份；“自由”简洁准确。
- source_word: מֵעִמָּךְ
  choice: 离开你
  rationale: 原义为“从与你同在之处离开”；“离开你”保留其直接表达，并在上下文中指脱离对方的役使。
theological_decisions:
- issue: 先提到希伯来男子或女子，随后释放命令却使用阳性单数后缀
  choice: 正文保留阳性单数代词“他”，脚注说明此处概括性地指前述男子或女子。
  alternative: 译作“他或她”或不分性别的“其人”，使适用对象在正文中直接明确。
  rationale: 原文明确并列男女，却在后文转用阳性单数形式。保留这一语法张力，既不抹去原文形式，也不误导读者以为律例只适用于男子。
translation_notes:
  register: 采用现代、庄重而易懂的法律叙述语体。“若……到了……就要……”清楚呈现条件、期限与义务；破折号用于自然容纳原文对“弟兄”的男女并列说明。
