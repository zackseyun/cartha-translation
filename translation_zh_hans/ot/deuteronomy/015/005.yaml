  text: רַ֚ק אִם שָׁמ֣וֹעַ תִּשְׁמַ֔ע בְּ/ק֖וֹל יְהוָ֣ה אֱלֹהֶ֑י/ךָ לִ/שְׁמֹ֤ר לַ/עֲשׂוֹת֙ אֶת כָּל הַ/מִּצְוָ֣ה הַ/זֹּ֔את אֲשֶׁ֛ר אָנֹכִ֥י מְצַוְּ/ךָ֖ הַ/יּֽוֹם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/005.yaml
  text: if only you carefully listen to the voice of the LORD your God, being careful to do all this commandment that I am commanding you today.
translation:
  language: zh_hans
  text: 只要你切实听从耶和华你上帝的话，谨守遵行我今天吩咐你的这一切诫命。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רַק אִם
  choice: 只要
  rationale: 表达限制兼条件关系，与上文应许相连；比单纯“如果”更能体现希伯来语的强调，又不把条件改成愿望。
- source_word: שָׁמוֹעַ תִּשְׁמַע
  choice: 切实听从
  rationale: 同根不定式绝对形加限定动词表示强调；“听从”也保留听见并顺服的语义。
- source_word: בְּקוֹל יְהוָה אֱלֹהֶיךָ
  choice: 耶和华你上帝的话
  rationale: “听从……的声音”在现代汉语中自然表达为“听从……的话”；神名按中文圣经传统音译为“耶和华”。
- source_word: לִשְׁמֹר לַעֲשׂוֹת
  choice: 谨守遵行
  rationale: 两个不定式依次表达留心持守与付诸实行，采用自然且庄重的对应表达。
- source_word: אֶת כָּל הַמִּצְוָה הַזֹּאת
  choice: 这一切诫命
  rationale: 希伯来语“诫命”为集合性单数，由“全部”修饰；中文用“这一切诫命”自然传达整体内容。
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: 我今天吩咐你的
  rationale: 保留第一人称说话者、当日颁布和对第二人称单数的直接吩咐。
theological_decisions:
- issue: 顺服与祝福之间的条件关系
  choice: 以“只要”保留本节的限制性条件
  alternative: “惟愿”或“但如果”
  rationale: 原文 רַק אִם 在本语境中限定前述不会有穷人的应许；译文不将其弱化为愿望，也不额外说明因果机制。
- issue: 神名的译法
  choice: 耶和华
  alternative: 雅威／上主
  rationale: 原文明确使用四字神名 יהוה；采用现代简体中文读者熟悉的传统音译，不以称号取代专名。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“切实听从”呈现原文强调结构，“谨守遵行”保留双重行动要求；句式简洁，适合公开诵读。
