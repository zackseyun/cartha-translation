  text: וְ/כִֽי יִהְיֶ֨ה ב֜/וֹ מ֗וּם פִּסֵּ֨חַ֙ א֣וֹ עִוֵּ֔ר כֹּ֖ל מ֣וּם רָ֑ע לֹ֣א תִזְבָּחֶ֔/נּוּ לַ/יהוָ֖ה אֱלֹהֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/021.yaml
  text: But if it has a defect—being lame or blind[a], any bad defect—you shall not sacrifice it to Yahweh your God.
translation:
  language: zh_hans
  text: 但如果它有缺陷，无论是瘸腿、瞎眼，还是任何严重的缺陷[a]，就不可把它献给雅威——你的上帝。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译“任何坏的缺陷”，指任何严重或使祭牲不合格的身体缺陷。
    reason: 说明原文字面措辞及其在祭祀律例中的含义。
lexical_decisions:
- source_word: וְכִי
  choice: 但如果
  rationale: 既引出条件，也与上一节献上头生牲畜的命令形成转折。
- source_word: יִהְיֶה בּוֹ מוּם
  choice: 它有残疾
  rationale: 希伯来文直译为“其中有缺陷”；中文用“有残疾”自然地表达牲畜身体上的祭祀禁忌。
- source_word: פִּסֵּחַ אוֹ עִוֵּר
  choice: 比如瘸腿、瞎眼
  rationale: 两词列举具体的身体缺陷；加入“比如”表明它们是后面总括语之前的例子。
- source_word: כֹּל מוּם רָע
  choice: 任何严重的缺陷
  rationale: רָע 字面可作“坏的”，此处不是指道德邪恶，而是指足以使祭牲不合格的严重身体缺陷。
- source_word: לֹא תִזְבָּחֶנּוּ
  choice: 就不可把它献给
  rationale: 否定未完成式在律法语境中表达禁令；“献给”在上下文中自然传达宰杀为祭的含义。
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: 雅威你的上帝
  rationale: 以“雅威”音译圣名，保留其作为以色列之上帝的盟约称谓；“你的”保留希伯来文单数直接称呼。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；采用较贴近常见学术重构读音的“雅威”，不以称号替代专名。
- issue: מוּם רָע 所表达的性质
  choice: 严重的缺陷
  alternative: 坏的缺陷；恶的残疾
  rationale: 这里的“坏/恶”修饰祭牲的身体缺陷及其不可接受性，并非作道德判断；译为“严重”可避免误解，同时以脚注保留字面信息。
translation_notes:
  register: 采用现代、庄重而易懂的律法文体。“不可”表达明确禁令；“瘸腿、瞎眼”保持具体直白。脚注标记置于其所解释的总括短语之后。
