  text: לֹא יִקְשֶׁ֣ה בְ/עֵינֶ֗/ךָ בְּ/שַׁלֵּֽחֲ/ךָ֙ אֹת֤/וֹ חָפְשִׁי֙ מֵֽ/עִמָּ֔/ךְ כִּ֗י מִשְׁנֶה֙ שְׂכַ֣ר שָׂכִ֔יר עֲבָֽדְ/ךָ֖ שֵׁ֣שׁ שָׁנִ֑ים וּ/בֵֽרַכְ/ךָ֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ בְּ/כֹ֖ל אֲשֶׁ֥ר תַּעֲשֶֽׂה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/018.yaml
  text: It shall not seem hard to you when you send him away free from you[a], because for six years he has served you for double the wages of a hired worker; and Yahweh your God will bless you in all that you do.
translation:
  language: zh_hans
  text: 当你让他自由离开你时，不必觉得为难，因为他服侍你六年，抵得上雇工双倍的工价[a]；雅威——你的上帝——必在你所做的一切事上赐福给你。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为他服侍你六年，相当于雇工双倍的工价。”希伯来语的简略表达将他六年的服侍与雇工的工价作比较，强调其劳动价值或成本，并未说明他实际所得的报酬。
    reason: 保留 מִשְׁנֶה שְׂכַר שָׂכִיר 的简略比较关系，同时避免把原文误解为受释者领取双倍工价。
lexical_decisions:
- source_word: יִקְשֶׁה בְעֵינֶיךָ
  choice: 不要觉得为难
  rationale: 这是希伯来语习语，直译为“在你眼中是艰难的”，表示主观上觉得难以接受、舍不得或感到负担。“不要觉得为难”自然地保留了这种评价意味。
- source_word: בְּשַׁלֵּחֲךָ אֹתוֹ חָפְשִׁי מֵעִמָּךְ
  choice: 你让他自由离开你的时候
  rationale: 介词加不定式表示时间或情境；חָפְשִׁי 指获得自由，而不只是被打发走。“离开你”保留 מֵעִמָּךְ 的关系性表达，不擅自补成“离开你的家”或“结束服役”。
- source_word: מִשְׁנֶה שְׂכַר שָׂכִיר
  choice: 抵得上雇工双倍的工价
  rationale: מִשְׁנֶה 表示双倍，שְׂכַר שָׂכִיר 是雇工的工价。译文表达六年服侍的劳动价值，同时用脚注保留原句可能的另一种理解。
- source_word: עֲבָדְךָ שֵׁשׁ שָׁנִים
  choice: 他服侍你六年
  rationale: 该形式在句中作动词，强调已经提供的服侍。受约束的身份由上下文说明，本节不额外加入“奴隶”以免把动词名词化。
- source_word: וּבֵרַכְךָ יְהוָה אֱלֹהֶיךָ
  choice: 雅威你的上帝必……赐福给你
  rationale: 此处是带应许意味的将来表达。专名 יְהוָה 音译为“雅威”，保留经文直接使用的圣约之名。
- source_word: בְּכֹל אֲשֶׁר תַּעֲשֶׂה
  choice: 在你所做的一切事上
  rationale: 保留原文范围广泛的表达，涵盖受话者所做的一切，并与“赐福给你”自然搭配。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名。采用与 Yahweh 对应的现代汉语音译“雅威”，而不以称号替代专名。
- issue: 是否在 עֲבָדְךָ 中明说受奴役身份
  choice: 他服侍你
  alternative: 你的奴仆服侍你
  rationale: 该词形在本句中是动词“服侍你”，本节重心在六年的劳动价值。身份可由整段释放条例确定，因此不在此处把动词改译为身份名词。
- issue: “双倍工价”所表达的比较关系
  choice: 六年服侍的价值抵得上雇工双倍的工价
  alternative: 他服侍六年，所得是雇工双倍的工价
  rationale: 上下文给出的理由是主人不应因释放而觉得为难，较可能强调已获得的劳动价值；但希伯来语表达简略，故以脚注保存可能侧重报酬的理解。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“为难”“雇工”“工价”“赐福”等词兼顾律法语境与普通读者的可理解性；句式尽量贴近希伯来文的因果与应许结构。
