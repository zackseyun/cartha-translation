base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/006.yaml
  text: For Yahweh your God has blessed you just as he promised you[a], and you will lend to many nations, but you will not borrow; and you will rule over many nations, but they will not rule over you.
translation:
  language: zh_hans
  text: 因为耶和华你的上帝已经照着他对你的应许赐福给你[a]；你必借给许多国，却不向人借贷；你必统治许多国，他们却必不统治你。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“正如他对你所说的。”希伯来文直译为“正如他对你所说的”；在这里的盟约语境中，这话具有“应许”的含义。
    reason: 词义替代译法
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的专名“耶和华”译出四字神名，而不以“主”这一称号代替。
- source_word: בֵּרַכְךָ
  choice: 已经……赐福给你
  rationale: 希伯来语完成式表示已然并持续产生结果的赐福；“已经……赐福”在中文中自然体现这一点。
- source_word: כַּאֲשֶׁר דִּבֶּר לָךְ
  choice: 照他所应许你的
  rationale: דבר 字面为“说”，但在此盟约语境中所说的话具有应许的效力；正文采用自然的“应许”，脚注保留字面译法。
- source_word: וְהַעֲבַטְתָּ
  choice: 你必借给
  rationale: עבט 的使役式在这里指借出、提供贷款；“借给”简洁并与下句“借贷”形成对照。
- source_word: גּוֹיִם רַבִּים
  choice: 许多国
  rationale: 这里涉及经济和政治关系，גוים 指多个国家或民族共同体；“许多国”最贴合上下文。
- source_word: לֹא תַעֲבֹט
  choice: 不用向人借贷
  rationale: עבט 的基本式在此指借入；补出“向人”使现代中文顺畅，但不限定具体对象。
- source_word: וּמָשַׁלְתָּ
  choice: 你必统治
  rationale: משל 表示掌权、管辖；“统治”直接传达国家之间的支配关系。
- source_word: וּבְךָ לֹא יִמְשֹׁלוּ
  choice: 他们却不能统治你
  rationale: 复数动词回指前面的“许多国”；用“他们”明确中文指代。“不能”表达预告中的否定结果。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用神的专名而非“主”这一称号；中文采用广为人知且具有专名功能的“耶和华”，同时不把它泛化为头衔。
- issue: כַּאֲשֶׁר דִּבֶּר לָךְ 是否明确译作应许
  choice: 照他所应许你的
  alternative: 照他对你所说的
  rationale: 上下文把上帝先前的话视为可靠的盟约承诺，因此正文译出“应许”的语用含义；脚注保留“说”的字面可能，避免掩盖原词。
- issue: 祝福、借贷与统治语句的时态和语气
  choice: 以已经赐福为根据，后两组用“必”表达确定结果
  alternative: 将全句统一译作将来条件或命令
  rationale: בֵּרַכְךָ 是完成式，后续形式在语境中陈述由赐福带来的结果，不是命令；译文维持这种因果及时间张力。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。“借给……却不用向人借贷”和“统治……却不能统治你”保留原文两组鲜明对偶；“耶和华你的上帝”维持原文紧密的盟约称谓。
