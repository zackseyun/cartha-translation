base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/014.yaml
  text: You shall surely furnish him from your flock[a], from your threshing floor, and from your winepress; from what Yahweh your God has blessed you with, you shall give to him.
translation:
  language: zh_hans
  text: 你务要从你的羊群、禾场和榨酒池中供给他[a]；要从雅威——你上帝赐福给你的一切中给他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你务要丰丰富富地供给他。”希伯来语在这里使用加强语气的动词结构；所用动词在释放奴仆的语境中也可含丰厚供应之意。
    reason: 说明强调结构，并保留该动词有关供应丰厚程度的词义选择。
lexical_decisions:
- source_word: הַעֲנֵיק תַּעֲנִיק
  choice: 你务要……供给他
  rationale: 动词不定式绝对式与限定动词连用，强化命令。“务要”在现代汉语中自然地表达强调语气；“供给”也比普通的“给”更能体现为获释者预备所需之物。至于该动词可能含有“丰厚供应”的意味，则在脚注中保留。
- source_word: מִצֹּאנְךָ
  choice: 从你的羊群
  rationale: צֹאן是绵羊和山羊等小型牲畜的集合称谓；“羊群”简洁自然，并保留农业语境。
- source_word: וּמִגָּרְנְךָ
  choice: 禾场
  rationale: גֹּרֶן本指打谷、扬谷的场地，并可转指那里所得的谷物。“禾场”保留原文具体意象及三项来源的并列结构。
- source_word: וּמִיִּקְבֶךָ
  choice: 榨酒池
  rationale: יֶקֶב指榨葡萄汁的设施或承接汁液的池槽；“榨酒池”清楚保留原文的农业图景。
- source_word: אֲשֶׁר בֵּרַכְךָ יְהוָה אֱלֹהֶיךָ
  choice: 雅威你的上帝赐福给你的
  rationale: 以自然汉语表达关系从句，说明所赠之物来自上帝先前所赐的福，同时不把句意强行限定为严格按比例给予。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来语四字神名的常见学术拟音译出其专名性质，而不以称号代替。
- source_word: תִּתֶּן לוֹ
  choice: 你要拿出来给他
  rationale: “拿出来给他”承接前面的“从……中”，明确这些供应要取自上帝所赐之物，也保留原文末尾再次命令“给他”的结构。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。译作“雅威”保留其专名性质，并较贴近现代学界对该名称读音的重构；不以“上主”这一称号替代。
- issue: 供应的丰厚程度
  choice: 正文以“务要……供给”表达强调，脚注说明也可理解为丰丰富富地供给
  alternative: 正文直接译作“务要丰丰富富地供给”
  rationale: הַעֲנֵיק תַּעֲנִיק既有强调句式，也可能在此语境含丰厚供应之意。正文避免将丰厚程度说得过死，脚注则保留这一有词汇依据的理解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“务要”保留律法命令的郑重语气；“禾场”和“榨酒池”保留原文具体的农业意象。句末重复“给他”，呼应希伯来文的重申结构。
