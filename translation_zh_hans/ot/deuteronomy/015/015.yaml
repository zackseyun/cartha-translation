  text: וְ/זָכַרְתָּ֗ כִּ֣י עֶ֤בֶד הָיִ֨יתָ֙ בְּ/אֶ֣רֶץ מִצְרַ֔יִם וַֽ/יִּפְדְּ/ךָ֖ יְהוָ֣ה אֱלֹהֶ֑י/ךָ עַל כֵּ֞ן אָנֹכִ֧י מְצַוְּ/ךָ֛ אֶת הַ/דָּבָ֥ר הַ/זֶּ֖ה הַ/יּֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/015.yaml
  text: And you shall remember that you were a slave in the land of Egypt[a], and Yahweh your God redeemed you[c][b]; therefore I am commanding you this today.
translation:
  language: zh_hans
  text: 你要记得，你在埃及地曾作过奴隶[a]，耶和华你的上帝救赎了你[b]；因此，我今天向你吩咐这件事[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “奴隶”或译“仆人”。希伯来词 עֶבֶד 可指两者，但这里说的是在埃及受奴役的处境。
    reason: lexical_alternative
  - marker: b
    text: “救赎了你”也可译作“把你赎出来”，指从奴役中赎出，使你得自由。
    reason: lexical_alternative
  - marker: c
    text: 直译“这件事”。希伯来词 דָּבָר 可指事情、事项或话语；这里指正在给予的吩咐。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזָכַרְתָּ
  choice: 你要记得
  rationale: 在律法劝诫语境中，这一形式带有命令意味；“你要记得”既自然，也保留其劝诫力度。
- source_word: עֶבֶד
  choice: 奴隶
  rationale: 该词可指奴仆或奴隶，但这里回顾的是以色列人在埃及受奴役的处境，因此“奴隶”更准确地传达其受辖制的身份。
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: 在埃及地
  rationale: 保留希伯来文“埃及之地”的具体表达，同时符合现代汉语的圣经叙事语体。
- source_word: וַיִּפְדְּךָ
  choice: 救赎了你
  rationale: פדה表示从奴役或困境中赎出；“救赎”保留赎回与解救两方面含义，并与本节的盟约历史背景相称。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代简体中文读者最熟悉的专名形式音译四字神名，明确其为上帝的名，而非普通称号。
- source_word: אֱלֹהֶיךָ
  choice: 你的上帝
  rationale: 直接表达第二人称单数所属关系；“上帝”是现代标准汉语中庄重且通行的称呼。
- source_word: עַל כֵּן
  choice: 因此
  rationale: 清楚标明从上帝的救赎行动推导出当前命令的因果关系。
- source_word: אָנֹכִי מְצַוְּךָ
  choice: 我……吩咐你
  rationale: 参与式结构配合显式代词强调说话者当下所发的命令；汉语用“我今天吩咐你”自然传达这一现场感。
- source_word: אֶת הַדָּבָר הַזֶּה
  choice: 这件事
  rationale: דבר本义宽泛，可指事情、话语或事项；“这件事”保留这种宽度，不把它过度限定为单一命令。
- source_word: הַיּוֹם
  choice: 今天
  rationale: 直接而自然地保留盟约劝诫的当下性。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文明确使用四字神名。中文正文保留专名而不以“主”替代；“耶和华”在现代中文圣经传统及普通读者中辨识度最高。“雅威”则较贴近学界常见的拟定发音。
- issue: 以色列在埃及的身份 עֶבֶד
  choice: 奴隶
  alternative: 仆人
  rationale: 上下文强调受辖制和获释放，译作“奴隶”能保留历史处境及伦理劝诫的力度；“仆人”可能弱化强迫性。
- issue: פדה 的救赎意涵
  choice: 救赎了你
  alternative: 把你赎了出来
  rationale: “救赎”保留从奴役中赎出的语义及其神学张力，但不说明原文未明说的赎价或方式；较具象的替代译法可突出脱离奴役。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。保留“埃及地”“救赎”等具有经文历史与神学分量的表达，同时避免生硬照搬希伯来语序。正文中脚注标记均紧随所说明的词语。
