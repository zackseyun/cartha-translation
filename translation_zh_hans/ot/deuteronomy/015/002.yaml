  text: וְ/זֶה֮ דְּבַ֣ר הַ/שְּׁמִטָּה֒ שָׁמ֗וֹט כָּל בַּ֨עַל֙ מַשֵּׁ֣ה יָד֔/וֹ אֲשֶׁ֥ר יַשֶּׁ֖ה בְּ/רֵעֵ֑/הוּ לֹֽא יִגֹּ֤שׂ אֶת רֵעֵ֨/הוּ֙ וְ/אֶת אָחִ֔י/ו כִּֽי קָרָ֥א שְׁמִטָּ֖ה לַֽ/יהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/002.yaml
  text: 'And this is the matter of the release: every creditor shall release what his hand has lent to his neighbor[a]. He shall not press his neighbor or his brother[b], because a release to Yahweh has been proclaimed.'
translation:
  language: zh_hans
  text: 豁免的规定如下：凡债权人，都要免除自己所持、借给邻舍的债权[a]。他不可向邻舍和弟兄[b]催讨，因为已经宣告了归雅威的豁免[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “豁免”也可译作“免除”或“取消债权”；希伯来语שְׁמִטָּה指在安息年放下债权、不再追索债务的正式规定。
    reason: lexical_alternative
  - marker: b
    text: “弟兄”在这里指盟约群体中的同胞，也可较解释性地译作“以色列同胞”。
    reason: lexical_alternative
  - marker: c
    text: “归雅威”也可理解为“为雅威施行”或“属于雅威的”；原文以介词短语表明这项豁免与雅威有关，但其确切关系可有不同理解。
    reason: theological_ambiguity
lexical_decisions:
- source_word: דְּבַר הַשְּׁמִטָּה
  choice: 豁免的条例
  rationale: דָּבָר在这里指即将说明的法规或规定，而不只是一个“话语”；“条例”符合本节的法律语境。
- source_word: הַשְּׁמִטָּה / שְׁמִטָּה
  choice: 豁免
  rationale: 该词指安息年中放弃债权、免除债务要求的制度；“豁免”既保留法律意味，也较适合现代汉语。
- source_word: שָׁמוֹט
  choice: 都要免去
  rationale: 不定词绝对形在此加强命令语气；汉语不机械重复词根，而以“都要”体现其概括性和规定性。
- source_word: כָּל בַּעַל מַשֵּׁה יָדוֹ
  choice: 凡债权人
  rationale: 这一习语指持有贷款债权的人；“债权人”自然、准确地表达其法律身份。
- source_word: אֲשֶׁר יַשֶּׁה בְּרֵעֵהוּ
  choice: 自己借给同伴的债务
  rationale: 使役词形在此表示借贷并使对方负债；译文以现代汉语清楚表达债权的来源。
- source_word: לֹא יִגֹּשׂ
  choice: 不可……催讨
  rationale: 该动词表示逼迫债务人偿还或索取欠款；“催讨”保留债务语境而不额外限定具体手段。
- source_word: רֵעֵהוּ
  choice: 同伴
  rationale: רֵעַ指社会或群体中的同伴、邻舍；此处法律语境中的“同伴”较自然，也避免把含义限于住处相邻者。
- source_word: אָחִיו
  choice: 弟兄
  rationale: 原文为阳性单数“兄弟”，在这里同时具有盟约群体成员的社会含义；正文保留其字面措辞，并以脚注说明。
- source_word: כִּי קָרָא
  choice: 因为已经宣告
  rationale: 原文采用无人称表达，意思是某项豁免已经公开宣布；汉语被动含义由“已经宣告”自然传达。
- source_word: לַיהוָה
  choice: 归雅威
  rationale: 介词ל可表达归属、指向或为某对象而行；“归雅威”保留豁免与雅威之间的奉献或归属关系，同时以脚注提示其他可能表达。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。采用“雅威”音译，以保留其作为以色列之神盟约名字的性质，不以称号代替。
- issue: אָחִיו在盟约法律语境中的范围
  choice: 弟兄
  alternative: 同胞；以色列同胞
  rationale: 正文保留原文的男性亲属称谓及其盟约群体色彩，不在正文中把所指范围解释性地固定为“以色列人”；脚注交代其群体含义。
- issue: לַיהוָה所表达的关系
  choice: 归雅威的豁免
  alternative: 为雅威施行的豁免；向雅威宣告的豁免
  rationale: 介词短语存在关系上的张力，可能强调归属、奉献或为雅威而施行。正文采用简洁的“归雅威”，脚注保留其他理解，避免过度定论。
translation_notes:
  register: 采用现代、庄重而易懂的法律叙述语体。“条例如下”“凡……都要”“不可”等措辞体现律法条文的规范性；保留“弟兄”和神名“雅威”的源文色彩，并用脚注说明其语境。
