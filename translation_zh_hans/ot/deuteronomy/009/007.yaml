  text: זְכֹר֙ אַל תִּשְׁכַּ֔ח אֵ֧ת אֲשֶׁר הִקְצַ֛פְתָּ אֶת יְהוָ֥ה אֱלֹהֶ֖י/ךָ בַּ/מִּדְבָּ֑ר לְ/מִן הַ/יּ֞וֹם אֲשֶׁר יָצָ֣אתָ מֵ/אֶ֣רֶץ מִצְרַ֗יִם עַד בֹּֽאֲ/כֶם֙ עַד הַ/מָּק֣וֹם הַ/זֶּ֔ה מַמְרִ֥ים הֱיִיתֶ֖ם עִם יְהוָֽה־־־־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/007.yaml
  text: Remember—do not forget—how you provoked Yahweh your God to wrath in the wilderness[a]. From the day you came out of the land of Egypt until you came to this place[b], you have been rebellious against Yahweh.
translation:
  language: zh_hans
  text: 你要记住，不可忘记，你曾怎样在旷野惹耶和华你的上帝发怒。[a]从你离开埃及地的那天起，直到你们来到这地方，你们一直悖逆耶和华。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你曾怎样在旷野激怒耶和华你的上帝。”
    reason: lexical_alternative
  - marker: b
    text: “悖逆耶和华”原文直译为“与耶和华悖逆”；这里的意思是与耶和华作对。
    reason: lexical_alternative
lexical_decisions:
- source_word: זְכֹר אַל תִּשְׁכַּח
  choice: 你要记住，不可忘记
  rationale: 保留希伯来文肯定命令与否定劝诫相连所形成的强调，而不合并为单一表达。
- source_word: הִקְצַפְתָּ
  choice: 惹……发怒
  rationale: 体现קצף使役形的致使含义；现代汉语自然，同时保留行为引发上帝怒气的力度。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名音译呈现四字神名，不用称号替代。
- source_word: אֱלֹהֶיךָ
  choice: 你的上帝
  rationale: 直接呈现第二人称单数所属关系，并采用现代标准普通话常用写法。
- source_word: בַּמִּדְבָּר
  choice: 在旷野
  rationale: 符合出埃及传统语境；“旷野”不局限于沙漠地貌。
- source_word: לְמִן הַיּוֹם אֲשֶׁר יָצָאתָ מֵאֶרֶץ מִצְרַיִם
  choice: 从你离开埃及地的那天起
  rationale: 自然表达时间跨度的起点，并保留原文此处第二人称单数。
- source_word: עַד בֹּאֲכֶם עַד הַמָּקוֹם הַזֶּה
  choice: 直到你们来到这地方
  rationale: 保留原文转为第二人称复数的变化；中文“来到”自然传达抵达之意。
- source_word: מַמְרִים הֱיִיתֶם
  choice: 你们一直悖逆
  rationale: “悖逆”体现对权威的反抗；“一直”表达从出埃及至当前地点的持续模式。
- source_word: עִם יְהוָה
  choice: 悖逆耶和华
  rationale: עִם通常为“与”，但与מרה连用时关系具有敌对性；正文用符合汉语搭配的“悖逆耶和华”，并在脚注保留字面歧义。
theological_decisions:
- issue: 四字神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用上帝的专名；“耶和华”是现代简体中文圣经传统中最易识别且庄重的专名形式，同时不以“主”这一称号代替。
- issue: 以色列悖逆的时间延续性
  choice: 你们一直悖逆
  alternative: 你们曾悖逆
  rationale: 前面的“从……直到……”描述贯穿整段时期的反复模式；“一直”传达持续性，但不额外断言此后仍继续。
- issue: עִם יְהוָה的关系含义
  choice: 悖逆耶和华
  alternative: 与耶和华悖逆
  rationale: 介词字面为“与”，但在“悖逆”的语义环境中表达敌对指向。正文采用自然汉语，脚注注明字面形式，以保存语言张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留“记住／不可忘记”的强调组合，以及原文从第二人称单数“你”转为复数“你们”的变化。
