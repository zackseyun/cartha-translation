  text: אַל תֹּאמַ֣ר בִּ/לְבָבְ/ךָ֗ בַּ/הֲדֹ֣ף יְהוָה֩ אֱלֹהֶ֨י/ךָ אֹתָ֥/ם מִ/לְּ/פָנֶי/ךָ֮ לֵ/אמֹר֒ בְּ/צִדְקָתִ/י֙ הֱבִיאַ֣/נִי יְהוָ֔ה לָ/רֶ֖שֶׁת אֶת הָ/אָ֣רֶץ הַ/זֹּ֑את וּ/בְ/רִשְׁעַת֙ הַ/גּוֹיִ֣ם הָ/אֵ֔לֶּה יְהוָ֖ה מוֹרִישָׁ֥/ם מִ/פָּנֶֽי/ךָ־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/004.yaml
  text: Do not say in your heart[a], when Yahweh your God drives them out from before you, saying, ‘Because of my righteousness Yahweh has brought me in to possess this land,’ while because of the wickedness of these nations Yahweh is dispossessing them before you.
translation:
  language: zh_hans
  text: 当耶和华你的上帝把他们从你面前赶出去时，你心里不可说[a]：‘耶和华领我进来占有这片土地，是因为我的义。’耶和华把他们从你面前赶出去，是因为这些民族的邪恶。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “心里说”也可译作“心里想”。原文直译为“在你心里说”。
    reason: 说明希伯来语内心自语的习语，同时保留主文本中的原文意象。
lexical_decisions:
- source_word: אַל תֹּאמַר בִּלְבָבְךָ
  choice: 你不要心里说
  rationale: אַל加未完成式表达禁止；“心里说”既保留希伯来语“在心中”的意象，也自然表达内心自语。
- source_word: בַּהֲדֹף
  choice: 把……赶出去的时候
  rationale: 介词בְּ加不定词结构表示时间背景；נדף在征服语境中指驱赶、赶走。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代汉语读者熟悉的专名形式译出四字神名，而不以称号替代。
- source_word: בְּצִדְקָתִי
  choice: 因为我的义
  rationale: 保留צְדָקָה的神学和道德含义，并准确呈现以色列人可能作出的因果归功。
- source_word: הֱבִיאַנִי
  choice: 领我进来
  rationale: 使役形表达“使我进入/把我带进”；“领我进来”符合进入应许之地的语境。
- source_word: לָרֶשֶׁת אֶת הָאָרֶץ הַזֹּאת
  choice: 占有这片土地
  rationale: ירשׁ在此强调取得并持有土地；“占有”比“继承”更直接地呈现当前征服和得地的语境。
- source_word: וּבְרִשְׁעַת הַגּוֹיִם הָאֵלֶּה
  choice: 其实，……是因为这些民族邪恶
  rationale: 连接词在语境中引出对错误自义说法的纠正；“其实”自然呈现对比，同时保留邪恶是驱逐原因的陈述。
- source_word: מוֹרִישָׁם
  choice: 把他们……赶走
  rationale: Hiphil形在此表示使这些民族失去土地、将其逐出；结合中文语境用“赶走”表达，避免生硬重复“使其失去产业”。
theological_decisions:
- issue: 四字神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用神的专名；译文采用现代中文圣经传统中最广为人知的专名形式，不改译为“主”。
- issue: 以色列是否凭自身功义得地
  choice: 保留引语“因为我的义”，随后以“其实”加以纠正
  alternative: 把“义”解释性改译为“我做得对”或“我的功劳”
  rationale: 原文刻意保留צְדָקָה的神学张力，并否定以色列凭自身义得地的推断；不应在词汇层面淡化这一点。
- issue: 列国邪恶与以色列得地之间的关系
  choice: 译作“因为这些民族邪恶，才把他们……赶走”
  alternative: 译作“但由于这些民族邪恶”
  rationale: 保留经文明确给出的原因，同时不额外推断以色列本身的地位或功德；下一节将进一步展开否定。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“才”突出说话者错误声称的因果关系及随后给出的真实原因；两次“从你面前”保留原文空间意象。
