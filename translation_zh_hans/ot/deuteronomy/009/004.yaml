revisions:
- from: 耶和华你的上帝把他们从你面前赶出去的时候，你不要心里说[a]：‘耶和华是因为我的义，才领我进来占有这片土地。’其实，耶和华是因为这些民族邪恶，才把他们从你面前赶走。
  to: 当耶和华你的上帝把他们从你面前赶出去时，你心里不可说[a]：‘耶和华领我进来占有这片土地，是因为我的义。’耶和华把他们从你面前赶出去，是因为这些民族的邪恶。
  rationale: 修订删除解释性较强的“其实”，以两个平行的因果陈述呈现原文对以色列自义主张与列国邪恶之间的对照；同时微调语序和“的”，使中文更自然。
