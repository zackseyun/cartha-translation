  text: וָ/אֶתְפַּלֵּ֣ל אֶל יְהוָה֮ וָ/אֹמַר֒ אֲדֹנָ֣/י יְהוִ֗ה אַל תַּשְׁחֵ֤ת עַמְּ/ךָ֙ וְ/נַחֲלָ֣תְ/ךָ֔ אֲשֶׁ֥ר פָּדִ֖יתָ בְּ/גָדְלֶ֑/ךָ אֲשֶׁר הוֹצֵ֥אתָ מִ/מִּצְרַ֖יִם בְּ/יָ֥ד חֲזָקָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/026.yaml
  text: So I prayed to Yahweh and said[a], “Lord GOD, do not destroy your people and your inheritance, whom you redeemed by your greatness[b], whom you brought out of Egypt with a strong hand.”
translation:
  language: zh_hans
  text: 我就向耶和华祷告说：“主耶和华啊，求你不要毁灭你的子民和你的产业，就是你以你的伟大[a]所救赎、用有力的手从埃及领出来的。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “以你的伟大”也可理解为“以你的大能”。
    reason: 原文 גֹּדֶל 基本义为“伟大、宏大”，在此语境中也可侧重神所彰显的大能。
lexical_decisions:
- source_word: וָאֶתְפַּלֵּל אֶל־יְהוָה וָאֹמַר
  choice: 我就向耶和华祷告说
  rationale: 连续的叙事形式承接上文；“就”自然表达进展关系，“向……祷告说”忠实保留祷告对象和引语的引入。
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: 保留复合称号的两个组成部分，既表达 אֲדֹנָי 的主权称谓，也直接呈现神名 יְהוָה；现代中文读来庄重自然。
- source_word: אַל־תַּשְׁחֵת
  choice: 求你不要毁灭
  rationale: “不要毁灭”直接表达否定祈使；加“求你”符合中文祷告语境，但不削弱原文严肃的恳求。
- source_word: עַמְּךָ וְנַחֲלָתְךָ
  choice: 你的子民和你的产业
  rationale: 保留原文两个并列称呼；“产业”体现 נַחֲלָה 所含归属、承受之业的盟约意涵，而不把二者明确解释成不同群体。
- source_word: אֲשֶׁר פָּדִיתָ
  choice: 就是你……所救赎
  rationale: “救赎”准确传达 פדה 在出埃及语境中的解救含义，并保留其重要的神学用语色彩。
- source_word: בְּגָדְלֶךָ
  choice: 以自己的伟大
  rationale: 按名词 גֹּדֶל 的基本意义译作“伟大”，避免直接将其窄化为“能力”；“自己的”清楚表达第二人称所属。
- source_word: אֲשֶׁר הוֹצֵאתָ מִמִּצְרַיִם
  choice: 从埃及领出来
  rationale: 符合出埃及叙事中 הוציא 的常见用法，也比机械的“使出来”更合乎现代汉语。
- source_word: בְּיָד חֲזָקָה
  choice: 用有力的手
  rationale: 贴近“手”与“强壮、有力”的字面意象，同时在中文中清楚表达施行拯救的大能。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 采用现代中文圣经读者最熟悉且庄重的专名形式，并将其作为神的盟约之名呈现，而不是以普通称号代替。
- issue: 复合称号 אֲדֹנָי יְהוִה 的表达
  choice: 主耶和华
  alternative: 主雅威
  rationale: 保留“主”与神名两个要素，不采用会造成“主主”重复的译法，也不把神名改写成泛称。
- issue: “子民”和“产业”的关系
  choice: 保留并列称呼
  alternative: 译为“你的子民，就是你的产业”以明确同位关系
  rationale: 原文以连接词并列两个称呼，语境很可能指同一群体，但没有使用明确的同位标记；正文因此不把这种关系绝对化。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。“求你”使否定祈使在汉语中自然；整体保留出埃及传统中的“救赎”“产业”和“手”等关键意象。
