base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/002.yaml
  text: 'a great and tall people[a], the sons of Anak, whom you know, and of whom you have heard: ‘Who can stand before the sons of Anak?’'
translation:
  language: zh_hans
  text: 一个庞大而身材高大的民族——亚衲的子孙[a]；你知道他们，也听说过这话：‘谁能在亚衲的子孙面前站立得住呢？’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“亚衲族人”。希伯来文直译为“亚衲的子孙”。
    reason: lexical_alternative
lexical_decisions:
- source_word: עַם
  choice: 民族
  rationale: 这里指具有共同身份的群体；“民族”比“人民”更自然地表达这一族群含义。
- source_word: גָּדוֹל
  choice: 强大
  rationale: 该词可指“大”或“强盛”；本节着重描述令以色列人畏惧的族群，“强大”既符合语境，也避免与随后的身高描述重复。
- source_word: וָרָם
  choice: 高大
  rationale: 在人物体格的语境中指身材高；“高大”是现代汉语自然而庄重的表达。
- source_word: בְּנֵי עֲנָקִים / בְּנֵי עֲנָק
  choice: 亚衲的子孙
  rationale: 保留希伯来语“……之子”的亲属表达，并将专名 עֲנָק 音译为“亚衲”；脚注说明可作族群名称理解。
- source_word: אֲשֶׁר אַתָּה יָדַעְתָּ
  choice: 他们是你所知道的
  rationale: 直接保留“你知道”的陈述，不额外限定以色列人是亲见还是仅知其名。
- source_word: וְאַתָּה שָׁמַעְתָּ
  choice: 你也听人说过
  rationale: 结合后面的引语，补出汉语所需的“人说”，自然表达以色列人曾听到这一流传说法。
- source_word: מִי יִתְיַצֵּב לִפְנֵי
  choice: 谁能在……面前站立得住
  rationale: 既保留“站在……面前”的形象，又以“站立得住”表达面对强敌时能够抵挡的语用含义。
