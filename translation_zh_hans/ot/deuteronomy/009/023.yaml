source:
  edition: WLC
  text: וּ/בִ/שְׁלֹ֨חַ יְהוָ֜ה אֶתְ/כֶ֗ם מִ/קָּדֵ֤שׁ בַּרְנֵ֨עַ֙ לֵ/אמֹ֔ר עֲלוּ֙ וּ/רְשׁ֣וּ אֶת הָ/אָ֔רֶץ אֲשֶׁ֥ר נָתַ֖תִּי לָ/כֶ֑ם וַ/תַּמְר֗וּ אֶת פִּ֤י יְהוָה֙ אֱלֹ֣הֵי/כֶ֔ם וְ/לֹ֤א הֶֽאֱמַנְתֶּם֙ ל֔/וֹ וְ/לֹ֥א שְׁמַעְתֶּ֖ם בְּ/קֹלֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/023.yaml
  text: And when Yahweh sent you from Kadesh-barnea[a], saying, 'Go up and take possession of the land that I have given you,' you rebelled against the command of Yahweh your God[c][b], and you did not believe him or listen to his voice.
translation:
  language: zh_hans
  text: 雅威从加低斯·巴尼亚差遣你们的时候，对你们说：“你们上去，占领我赐给你们的那片土地。”你们却违抗雅威你们上帝的命令[a]，不信他[b]，也不听他的声音[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语直译为“悖逆雅威你们上帝的口”；这里“口”指他所说的话或命令。
    reason: lexical_alternative
  - marker: b
    text: 或译：“不信靠他。”
    reason: lexical_alternative
  - marker: c
    text: “听他的声音”在这里也有听从、服从他的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִשְׁלֹחַ
  choice: ……差遣你们的时候
  rationale: 介词加不定式结构表达时间背景；这样译成现代汉语自然，并保留句首连接前文的叙事关系。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常用音译呈现四字神名，保留其作为专名的性质，不以称号替代。
- source_word: מִקָּדֵשׁ בַּרְנֵעַ
  choice: 从加低斯·巴尼亚
  rationale: 按希伯来语地名音译，并用间隔号清楚标示复合地名。
- source_word: עֲלוּ וּרְשׁוּ
  choice: 你们上去，占领
  rationale: “上去”保留עלה所表达的上行移动；ירשׁ在进入应许之地的语境中指取得并占有土地，“占领”简明呈现行动含义。
- source_word: הָאָרֶץ אֲשֶׁר נָתַתִּי לָכֶם
  choice: 我赐给你们的那片土地
  rationale: 完成式“赐给”呈现这份授予已确定的视角；“那片土地”符合具体所指，也不额外加入解释性称谓。
- source_word: וַתַּמְרוּ אֶת־פִּי
  choice: 你们却违抗……的命令
  rationale: 字面为“悖逆……的口”，是指违抗权威所发之言的希伯来语习语；正文译出其自然含义，字面形象收入脚注。
- source_word: וְלֹא הֶאֱמַנְתֶּם לוֹ
  choice: 不信他
  rationale: אמן的使役词干在此兼有相信与信靠之意；正文采用较贴近句法且保持开放性的“不信他”，脚注提示“信靠”的可能语义。
- source_word: וְלֹא שְׁמַעְתֶּם בְּקֹלוֹ
  choice: 也不听他的声音
  rationale: 保留“听……声音”的原文表达，使“听见/听从”的语义张力不被正文单方面消解；脚注说明服从含义。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。音译为“雅威”可保留其专名身份；不以“主”替代，也不采用较晚形成的混合读音“耶和华”。
- issue: נָתַתִּי所表达的土地授予
  choice: 我赐给你们的
  alternative: 我要赐给你们的；我曾赐给你们的
  rationale: 希伯来语完成式把授予视为已经确定；中文用“赐给”即可表达，不把它改成将来时，也不额外建构时间或教义体系。
- issue: הֶאֱמַנְתֶּם לוֹ的相信与信靠含义
  choice: 不信他
  alternative: 不信靠他
  rationale: 正文保留对上帝之言“不信”的直接关系，脚注同时承认该动词可强调信赖，避免排除其关系性含义。
- issue: שְׁמַעְתֶּם בְּקֹלוֹ的听与顺服含义
  choice: 不听他的声音
  alternative: 不听从他；不服从他的声音
  rationale: 原文习语兼具聆听和服从的意味；正文保留声音意象，脚注说明在语境中也指顺服。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“差遣”“赐给”“违抗”保持经文语体的分量；正文保留“上去”和“听他的声音”等源语意象，同时用脚注解释可能不够直观的希伯来语习语。
