revisions:
- from: 你进去取得他们的土地，并不是因为你的义，也不是因为你心里正直；而是因为这些国邪恶，耶和华你的上帝才从你面前赶走他们[a]，也是为了坚立耶和华向你列祖——亚伯拉罕、以撒和雅各——所起誓应许的话[b][c]。
  to: 你进去占有他们的土地，并不是因为你的义，也不是因为你内心正直；而是因为这些国民的邪恶，雅威你的上帝在你面前把他们逐出[a]，又为要坚立雅威向你列祖——亚伯拉罕、以撒和雅各——所起誓的话[b][c]。
  rationale: 修订统一神名译法，并改善两个影响忠实度与中文自然度的表达：“这些国民的邪恶”明确原文所属关系；“在你面前把他们逐出”准确表达使役动词及其空间短语。保留“为要坚立”以反映 וּלְמַעַן 的目的意义，保留“所起誓的话”以贴近“话”，并在脚注交代其应许语境。
