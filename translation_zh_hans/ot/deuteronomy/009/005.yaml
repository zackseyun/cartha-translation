  text: לֹ֣א בְ/צִדְקָתְ/ךָ֗ וּ/בְ/יֹ֨שֶׁר֙ לְבָ֣בְ/ךָ֔ אַתָּ֥ה בָ֖א לָ/רֶ֣שֶׁת אֶת אַרְצָ֑/ם כִּ֞י בְּ/רִשְׁעַ֣ת הַ/גּוֹיִ֣ם הָ/אֵ֗לֶּה יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ מוֹרִישָׁ֣/ם מִ/פָּנֶ֔י/ךָ וּ/לְמַ֜עַן הָקִ֣ים אֶת הַ/דָּבָ֗ר אֲשֶׁ֨ר נִשְׁבַּ֤ע יְהוָה֙ לַ/אֲבֹתֶ֔י/ךָ לְ/אַבְרָהָ֥ם לְ/יִצְחָ֖ק וּֽ/לְ/יַעֲקֹֽב־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/005.yaml
  text: It is not because of your righteousness or the uprightness of your heart that you are going in to possess their land[a], but because of the wickedness of these nations Yahweh your God is driving them out before you, and in order to confirm the word that Yahweh swore to your fathers, to Abraham, to Isaac[c][b], and to Jacob.
translation:
  language: zh_hans
  text: 你进去占有他们的土地，并不是因为你的义，也不是因为你内心正直；而是因为这些国民的邪恶，雅威你的上帝在你面前把他们逐出[a]，又为要坚立雅威向你列祖——亚伯拉罕、以撒和雅各——所起誓的话[b][c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “把他们逐出”也可译作“使他们失去土地”。这里的希伯来语动词不仅可强调驱逐，也可强调使他们丧失对土地的占有。
    reason: lexical_alternative
  - marker: b
    text: “所起誓的话”直译为“所起誓的话”；在这里指以誓言保证的话，也就是应许。
    reason: lexical_alternative
  - marker: c
    text: 这里的“列祖”具体指随后列出的亚伯拉罕、以撒和雅各。
    reason: cultural_note
lexical_decisions:
- source_word: בְצִדְקָתְךָ
  choice: 因为你的义
  rationale: 介词 בְּ 在否定句中表原因；“义”简洁保留 צְדָקָה 的道德与正当含义。
- source_word: וּבְיֹשֶׁר לְבָבְךָ
  choice: 因为你心里正直
  rationale: 保留“心”所表达的内在道德倾向，同时用现代汉语自然表达 יֹשֶׁר 的正直、端正之意。
- source_word: בָא לָרֶשֶׁת אֶת־אַרְצָם
  choice: 进去取得他们的土地
  rationale: בוא 表示进入，לרשת 表示取得并占有产业；此译兼顾进入该地和取得所有权。
- source_word: בְרִשְׁעַת הַגּוֹיִם הָאֵלֶּה
  choice: 因为这些国邪恶
  rationale: 将 בְּ 译为原因，“邪恶”传达 רִשְׁעָה 的罪恶含义；“国”对应 גּוֹיִם。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文读者熟悉的圣名音译，明确保留原文的专名性质，而不以一般称号代替。
- source_word: מוֹרִישָׁם מִפָּנֶיךָ
  choice: 从你面前赶走他们
  rationale: 使役形可指使其失去土地或将其逐出；正文采用自然的“赶走”，脚注保留“使他们失去土地”的词义层面。
- source_word: וּלְמַעַן הָקִים
  choice: 也是为了坚立
  rationale: לְמַעַן 明示目的；הקים 在誓言语境中指使所说的话成立、兑现，“坚立”保留其正式语气。
- source_word: הַדָּבָר אֲשֶׁר נִשְׁבַּע
  choice: 所起誓应许的话
  rationale: “话”贴近 דָּבָר；加“应许”使其在起誓语境中的承诺含义在汉语中清楚，同时不将该词单纯改写为抽象的“应许”。
- source_word: לַאֲבֹתֶיךָ
  choice: 向你列祖
  rationale: 下文明确列举亚伯拉罕、以撒、雅各；“列祖”准确指向这些男性先祖，并符合庄重的现代圣经语域。
theological_decisions:
- issue: 以色列取得土地的根据
  choice: 同时保留列国的邪恶和耶和华信守向列祖所起之誓这两个理由
  alternative: 只突出列国的邪恶，或只突出盟约应许
  rationale: 原文以 כִּי 从正面说明列国的邪恶，又以 וּלְמַעַן 引出坚立誓言的目的；两者都不可省略或合并。
- issue: 否定以色列自身的功德
  choice: “并不是因为你的义，也不是因为你心里正直”
  alternative: 将其弱化为以色列并非完全公义
  rationale: 原文直接否定以色列的义和内心正直是得地的原因；译文保留这一明确否定，不作缓和。
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；主
  rationale: 正文保留神的专名而非一般称号；“耶和华”是现代标准汉语中最广为人知且庄重的音译。
translation_notes:
  register: 采用现代、庄重而清楚的普通话。“你进去取得”保留入地和占有的双重动作；以分号呈现原文从否定人的功德转向神行动与誓言的结构。所有脚注标记均置于相关正文之后。
