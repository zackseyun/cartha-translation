  source_fidelity: “恐怕他毁灭你们”把 לְהַשְׁמִיד（“要／为要毁灭你们”）改写为摩西对一种可能结果的担忧，弱化并改变了原文所表达的毁灭意向。四字神名在本项目的既定译法为 Yahweh；中文应采用对应的“雅威”，而非传统上通常对应 Jehovah 的“耶和华”。其余主要语义，包括叠加的愤怒用语和雅威听从摩西，均得到保留。
  naturalness: 修订后的句子保持现代普通话的庄重、清晰风格。“雅威向你们所发的怒气和烈怒，要毁灭你们”在圣经叙述语体中自然，并让“要毁灭你们”维持原文的目的／意向关系。“垂听了我”可自然表达在代求语境中带有有利回应意味的“听”。
  terminology: 将 יהוה 统一为“雅威”，以对应项目指定的 Yahweh。保留“怒气和烈怒”以反映 אַף 与 חֵמָה 的强化并列；保留“垂听”而不扩展为“应允我的祷告”。
  issues:
