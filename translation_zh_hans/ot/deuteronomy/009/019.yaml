language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּ֣י יָגֹ֗רְתִּי מִ/פְּנֵ֤י הָ/אַף֙ וְ/הַ֣/חֵמָ֔ה אֲשֶׁ֨ר קָצַ֧ף יְהוָ֛ה עֲלֵי/כֶ֖ם לְ/הַשְׁמִ֣יד אֶתְ/כֶ֑ם וַ/יִּשְׁמַ֤ע יְהוָה֙ אֵלַ֔/י גַּ֖ם בַּ/פַּ֥עַם הַ/הִֽוא׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/019.yaml
  text: For I was afraid because of the anger and the wrath with which Yahweh was angry against you[a], to destroy you[b]. But Yahweh listened to me also at that time.
translation:
  language: zh_hans
  text: 因为我惧怕雅威向你们所发的怒气和烈怒，要毁灭你们；但那一次，雅威也垂听了我。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יָגֹרְתִּי
  choice: 我惧怕
  rationale: 该词为Qal完成式第一人称单数，表达惧怕、畏惧；“我惧怕”简洁庄重，也保留摩西亲身感受到的恐惧。
- source_word: מִפְּנֵי
  choice: 因为
  rationale: 此处是原因用法，说明摩西惧怕的缘由；不按字面译作“从……面前”。
- source_word: הָאַף וְהַחֵמָה
  choice: 怒气和烈怒
  rationale: 两个近义词叠加，强调耶和华震怒的强烈程度；“怒气和烈怒”既保留重复张力，也符合现代汉语。
- source_word: אֲשֶׁר קָצַף יְהוָה עֲלֵיכֶם
  choice: 耶和华向你们所发的
  rationale: קצף表达强烈发怒；结合前面的两个愤怒名词，译为定语结构可避免生硬的三重重复，同时保留怒气针对以色列人的含义。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代简体中文圣经语境中通行且可辨识的专名“耶和华”翻译四字神名。
- source_word: לְהַשְׁמִיד אֶתְכֶם
  choice: 恐怕他毁灭你们
  rationale: לְ加不定式在此说明神发怒可能导致的结果或意向；“恐怕”自然地将该短语与摩西的惧怕相连，同时保留毁灭威胁的严厉性。
- source_word: וַיִּשְׁמַע יְהוָה אֵלַי
  choice: 但耶和华垂听了我
  rationale: שמע与אֶל连用，在代求语境中不只是听见，也含有应允、接受恳求之意；“垂听”保留敬虔而庄重的语体，但不明说具体回应方式。
- source_word: גַּם בַּפַּעַם הַהִוא
  choice: 那一次……也
  rationale: 保留גַּם的附加意义，指出这也是耶和华垂听摩西的一次；“那一次”比“那时候”更贴合פַּעַם所指的一次事件。
theological_decisions:
- issue: 四字神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用神的专名。中文正文采用读者最熟悉的传统音译“耶和华”，不以“主”这一称号替代，也不在正文中解决其古代发音的不确定性。
- issue: 神愤怒用语的强度
  choice: 怒气和烈怒
  alternative: 怒气和愤恨
  rationale: 原文连续使用אַף、חֵמָה和קצף，形成强烈的震怒语义场；译文保留两个并列名词及“发怒”的含义，不淡化毁灭性的审判威胁。
- issue: לְהַשְׁמִיד与神旨意的关系
  choice: 恐怕他毁灭你们
  alternative: 要毁灭你们
  rationale: 该不定式可理解为怒气的目的，也可从摩西惧怕的角度理解为所担心的结果。“恐怕”保留句法上的一定张力，避免过度断定该短语只表达不可改变的旨意。
- issue: 耶和华“听”摩西的含义
  choice: 垂听了我
  alternative: 听了我的话
  rationale: 上下文涉及摩西代求，动词暗示有利回应；但原文只说“听向我”，所以不扩写成“答应了我的祈求”，以免消除原文简洁表达留下的空间。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以“发怒”“毁灭”“垂听”等圣经语境中自然且清楚的词汇，兼顾希伯来语结构和汉语可读性；不添加原文未明说的代求结果。
