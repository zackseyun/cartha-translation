    issue: “恐怕他毁灭你们”误导了 לְהַשְׁמִיד 的句法和语义力度。
    rationale: 此不定式说明雅威向以色列发怒所关联的毁灭意向／目的；“恐怕”使其成为摩西主观担心的未定结果，且添加了原文没有的情态缓和。应译为“要毁灭你们”。
  - severity: medium
    issue: “耶和华”未对齐本项目将 יהוה 译为 Yahweh 的术语决定。
    rationale: 英文审校轨迹和项目术语要求保留神名 Yahweh。中文采用“雅威”可直接对应该指定译名；这不是以“主”替代神名。
