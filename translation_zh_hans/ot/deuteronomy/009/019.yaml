revisions:
- from: 因为我惧怕耶和华向你们所发的怒气和烈怒，恐怕他毁灭你们。但那一次，耶和华也垂听了我。
  to: 因为我惧怕雅威向你们所发的怒气和烈怒，要毁灭你们；但那一次，雅威也垂听了我。
  rationale: 修订仅处理两项会影响忠实度和项目术语一致性的内容：以“要毁灭你们”恢复原文不定式的意向／目的关系，避免“恐怕”引入不必要的不确定性；以“雅威”对应既定的 Yahweh。保留原译的愤怒强度、附加性的“也”、以及不把“听”过度释义为明确应允的处理。
