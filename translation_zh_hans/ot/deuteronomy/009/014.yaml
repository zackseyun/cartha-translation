base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/014.yaml
  text: Leave me alone[a], so that I may destroy them and blot out their name from under the heavens[b]; and I will make you into a nation mightier and more numerous than they are.
translation:
  language: zh_hans
  text: 你不要拦阻我，好让我消灭他们，把他们的名从天下抹去[a]；我要使你成为一个比这民族更强盛、人数更多的民族。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“从诸天之下”。这是一种表示从地上除去、使其不再存留于世或为人记念的说法。
    reason: 说明原文空间习语及“诸天”的字面形式，同时不把解释性含义加入正文。
lexical_decisions:
- source_word: הֶרֶף מִמֶּנִּי
  choice: 你且由我
  rationale: רפה 与 מן 及人称后缀连用，是命令对方停止干预、任由说话者行动。“你且由我”在现代汉语中自然庄重，也保留摩西可能介入的语境含意，而不额外解释。
- source_word: וְאַשְׁמִידֵם
  choice: 让我消灭他们
  rationale: שׁמד 表示毁灭、消灭。命令式之后的连接形式可表达随之而来的目的或结果；“让我”自然呈现这一语义关系，同时避免把句法可能性说得过死。
- source_word: וְאֶמְחֶה אֶת־שְׁמָם
  choice: 把他们的名……抹去
  rationale: מחה 在此与“名”搭配，指彻底除去其名号、记忆与存续。“抹去”既贴近擦除的形象，也符合现代汉语惯用表达。
- source_word: מִתַּחַת הַשָּׁמַיִם
  choice: 从诸天之下
  rationale: 保留 הַשָּׁמַיִם 的复数形式及“从……之下”的空间表达；中文虽可说“天下”，但“诸天之下”更直接反映原文形式。
- source_word: וְאֶעֱשֶׂה אֹתְךָ לְגוֹי
  choice: 我却要使你成为一个……民族
  rationale: עשה + 宾语 + ל 表示使某人成为某种身份或实体。“使你成为一个民族”清楚表达由摩西产生一个民族的转变意义；“却”呈现被灭之民与由摩西而出的民族之间的对照。
- source_word: עָצוּם
  choice: 更强大
  rationale: עָצוּם 可指强盛、有势力；因后有比较结构 מִמֶּנּוּ，译成比较级“更强大”。
- source_word: וָרָב
  choice: 人数更多
  rationale: רַב 在民族比较中可指数量众多。“人数更多”明确表达人口规模，并与“更强大”构成自然并列。
- source_word: מִמֶּנּוּ
  choice: 比他们
  rationale: 希伯来语后缀为单数，集体指称当前的以色列民族；中文用“他们”承接前文复数宾语最自然，同时保留其集体所指。
theological_decisions:
- issue: 上帝宣告审判，并应许使摩西成为更大的民族
  choice: 按叙事中的直接宣告如实翻译，不淡化毁灭性的审判，也不在译文中说明这是试验或纯粹的修辞。
  alternative: 在正文中把这番话处理为对摩西的试验或修辞性宣告。
  rationale: 希伯来文本直接陈述上帝的审判意向和对摩西的应许。译文应保留由此产生的神学张力，不替读者预先解决其意图与性质的解释争议。
- issue: וְאַשְׁמִידֵם 中连接词与未完成式的关系
  choice: 译作“让我消灭他们”，按命令之后的目的或结果理解。
  alternative: 译作“我就要消灭他们”，将其作为直接并列的未来行动。
  rationale: 两种理解在语法和语境上均有依据；正文采用更符合现代汉语话语流程的目的式表达，并以脚注保留并列式可能。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“你且由我”保持神谕语气而不过分古雅；“诸天之下”有意保留原文复数形态，并借脚注解释其习语意义。
