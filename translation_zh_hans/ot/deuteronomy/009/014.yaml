  terminology: “消灭”“抹去”“民族”“更强盛、人数更多”均适合此处庄重叙事语体。避免加入“却”，因为原文此处的连接词本身不必明确标为转折。以“这民族”对应单数但集体指称的 מִמֶּנּוּ，较为准确。
