source:
  edition: WLC
  text: פֶּן יֹאמְר֗וּ הָ/אָרֶץ֮ אֲשֶׁ֣ר הוֹצֵאתָ֣/נוּ מִ/שָּׁם֒ מִ/בְּלִי֙ יְכֹ֣לֶת יְהוָ֔ה לַ/הֲבִיאָ֕/ם אֶל הָ/אָ֖רֶץ אֲשֶׁר דִּבֶּ֣ר לָ/הֶ֑ם וּ/מִ/שִּׂנְאָת֣/וֹ אוֹתָ֔/ם הוֹצִיאָ֖/ם לַ/הֲמִתָ֥/ם בַּ/מִּדְבָּֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/028.yaml
  text: Otherwise the land from which you brought us out will say[a], ‘Because Yahweh was not able to bring them into the land that he promised them, and because he hated them[b], he brought them out to put them to death in the wilderness.’
translation:
  language: zh_hans
  text: 免得你领我们出来的那地的人说[a]：‘雅威不能把他们带进他应许给他们的那地；又因为他恨他们，就领他们出来，要使他们死在旷野。’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“免得你领我们出来的那地说”；这里以“那地”借指那地的居民。
    reason: cultural_note
lexical_decisions:
- source_word: פֶּן
  choice: 免得
  rationale: 引出摩西所担忧的后果，既保留希伯来文的防范意味，也符合现代汉语表达。
- source_word: הָאָרֶץ אֲשֶׁר הוֹצֵאתָנוּ מִשָּׁם
  choice: 你领我们出来的那地的人
  rationale: 希伯来文直译为“你领我们出来的那地”，其中“地”借指当地居民；汉语若让“地”直接“说”会显得突兀，因此正文明确其所指，并以脚注保留原文形式。
- source_word: מִבְּלִי יְכֹלֶת יְהוָה
  choice: 雅威不能
  rationale: 简明表达该结构所指的无力或不能；这是那地居民可能作出的诽谤性判断，并非叙述者对神能力的断言。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以常见的现代汉语音译呈现四字神名，保留其专名性质。
- source_word: לַהֲבִיאָם
  choice: 把他们带进
  rationale: 宾语后接目的地，使用“把……带进”自然清楚，并体现进入那地的方向。
- source_word: אֶל הָאָרֶץ אֲשֶׁר דִּבֶּר לָהֶם
  choice: 他向他们应许的那地
  rationale: דבר字面为“说”，但在此语境指神曾向他们说到并许下那地；“应许”自然传达盟约语境中的话语效力。
- source_word: וּמִשִּׂנְאָתוֹ אֹתָם
  choice: 又因为他恨他们
  rationale: 介词表达原因；直译保留列国所指控的动机及其尖锐语气。
- source_word: הוֹצִיאָם
  choice: 就领他们出来
  rationale: 与本节前半的“领我们出来”呼应，保持出埃及主题的词汇连贯。
- source_word: לַהֲמִתָם
  choice: 要使他们死
  rationale: 体现מות使役式不定词的使役含义，比口语化的“杀死”更贴近原文句法和庄重语体。
- source_word: בַּמִּדְבָּר
  choice: 在旷野
  rationale: “旷野”是适合以色列漂流语境的标准译法，也保留圣经叙事的庄重色彩。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较直接地呈现学界通常重构的读音，并保留专名性质。
- issue: דִּבֶּר לָהֶם应按字面译为“向他们说”还是按语境译为“向他们应许”
  choice: 向他们应许
  alternative: 向他们说过
  rationale: 原文仍以“说”为基本词义，但在此处所说的内容是把那地赐给以色列的承诺；正文采用“应许”传达语境功能，不把它扩展为原文未明说的完整句子。
- issue: “雅威不能”是否会被理解为叙述者的神学判断
  choice: 保留在引语中，不另行弱化
  alternative: 雅威没有能力
  rationale: 这是预想中外邦居民的说法，而不是经文叙述者对雅威能力的断言；引语结构已经清楚标明其话语身份。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。正文略微展开希伯来文的转喻，以避免汉语中“土地开口说话”的非预期拟人效果；脚注保留原文的字面形式。引语中的因果关系与对雅威的诽谤性指控均不作神学弱化。
