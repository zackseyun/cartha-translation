  text: וַ/יִּתֵּ֨ן יְהוָ֜ה אֵלַ֗/י אֶת שְׁנֵי֙ לוּחֹ֣ת הָֽ/אֲבָנִ֔ים כְּתֻבִ֖ים בְּ/אֶצְבַּ֣ע אֱלֹהִ֑ים וַ/עֲלֵי/הֶ֗ם כְּֽ/כָל הַ/דְּבָרִ֡ים אֲשֶׁ֣ר דִּבֶּר֩ יְהוָ֨ה עִמָּ/כֶ֥ם בָּ/הָ֛ר מִ/תּ֥וֹךְ הָ/אֵ֖שׁ בְּ/י֥וֹם הַ/קָּהָֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/010.yaml
  text: And Yahweh gave me the two stone tablets[a], written with the finger of God[b], and on them were all the words that Yahweh had spoken to you on the mountain from the midst of the fire on the day of the assembly.
translation:
  language: zh_hans
  text: 雅威把两块石版交给我；石版上是上帝用手指写的，上面写着雅威在会众聚集的那一天，在山上从火中对你们所说的一切话。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “对你们所说”，原文直译作“与你们所说”。
    reason: 保留介词 עִם 的字面语义，同时让正文符合现代汉语习惯。
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 以常见的中文音译呈现四字神名，保留原文中的立约之名，不以称号代替。
- source_word: וַיִּתֵּן
  choice: 交给
  rationale: נתן基本义为“给”；此处指把石版授予摩西，“交给”符合现代汉语叙事语境。
- source_word: שְׁנֵי לוּחֹת הָאֲבָנִים
  choice: 两块石版
  rationale: 准确表达两块石制书写板；“石版”自然简洁，并保留材质与用途。
- source_word: כְּתֻבִים בְּאֶצְבַּע אֱלֹהִים
  choice: 石版是上帝用指头写成的
  rationale: 保留“上帝的指头”这一鲜明的拟人性意象，并将工具性的介词自然译作“用”。
- source_word: וַעֲלֵיהֶם כְּכָל הַדְּבָרִים
  choice: 上面写着……一切话
  rationale: 原文后半句省略谓语；中文补出“写着”，使石版上的内容与前文“写成的”衔接清楚。כְּ在此表示内容相符或涵盖，译作“一切话”自然。
- source_word: אֲשֶׁר דִּבֶּר יְהוָה עִמָּכֶם
  choice: 雅威……对你们所说的
  rationale: עִם字面为“与”，但在“说话”结构中，现代汉语以“对……说”最自然；脚注保留其较直译的表达。
- source_word: מִתּוֹךְ הָאֵשׁ
  choice: 从火中
  rationale: 简明保留“从……中间出来”的空间意象，无须在中文中增添“中央”。
- source_word: בְּיוֹם הַקָּהָל
  choice: 在会众聚集的那一天
  rationale: קָהָל在此指以色列群体的聚集；动态表达为“会众聚集的那一天”，既清楚又保留群体性。
theological_decisions:
- issue: 上帝行动的拟人性表达
  choice: 上帝用指头写成的
  alternative: 由上帝的能力写成的／上帝亲自写成的
  rationale: 原文明确使用“上帝的指头”，译文保留具体意象，不将其解释为抽象的能力，也不消解其神学张力。
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华／主
  rationale: 原文直接使用四字神名；音译“雅威”可区分专名与“主”等称号，并贴近较普遍认可的读音。
- issue: 雅威与以色列人说话的关系表达
  choice: 对你们所说
  alternative: 与你们所说
  rationale: 原文介词עִם本义为“与”，可能带有面对群体说话的互动色彩；正文采用自然汉语“对你们说”，脚注提示原文字面形式，避免完全掩盖这一细节。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“石版”“用指头写成”“从火中”等表述保留原文的具体意象；调整语序，使时间、地点和说话方式在中文中层次分明。
