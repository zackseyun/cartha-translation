  text: וַ/יְהִ֗י מִ/קֵּץ֙ אַרְבָּעִ֣ים י֔וֹם וְ/אַרְבָּעִ֖ים לָ֑יְלָה נָתַ֨ן יְהוָ֜ה אֵלַ֗/י אֶת שְׁנֵ֛י לֻחֹ֥ת הָ/אֲבָנִ֖ים לֻח֥וֹת הַ/בְּרִֽית־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/011.yaml
  text: And at the end of forty days and forty nights[a], Yahweh gave me the two stone tablets, the tablets of the covenant.
translation:
  language: zh_hans
  text: 四十昼夜结束时，雅威把两块石版，就是约版，给了我。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי מִקֵּץ
  choice: ……结束时
  rationale: וַיְהִי在这里承接叙事，מִקֵּץ指一段时期达到终点；汉语用“……结束时”自然表达这一时间界限，无须生硬译出“事情发生了”。
- source_word: אַרְבָּעִים יוֹם וְאַרְבָּעִים לָיְלָה
  choice: 四十昼夜
  rationale: “四十昼夜”是自然、庄重的现代汉语，也完整表达四十天和四十夜。
- source_word: נָתַן
  choice: 给了
  rationale: 采用该常用动词的基本义，不额外加入“递交”或“授予”等语气。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，保留其专名性质，不以称号代替。
- source_word: שְׁנֵי לֻחֹת הָאֲבָנִים
  choice: 两块石版
  rationale: 准确表达数量、材质和器物类别；量词“块”符合现代汉语习惯。
- source_word: לֻחֹת הַבְּרִית
  choice: 就是约版
  rationale: 保留希伯来文对“版”的重复，并用“就是”清楚表达同位说明：这两块石版即承载或标志盟约的版。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用以色列上帝的四字神名。译作“雅威”可保留专名，不把它转换为称号；同时不借此加入任何宗派性解释。
- issue: לֻחֹת הַבְּרִית中“约”的关系
  choice: 约版
  alternative: 刻有约的版；盟约的版
  rationale: 原文属格结构可涵盖与约相关、承载约文等意义；简洁译作“约版”保留这种关系的概括性，避免把未明说的内容具体化。
translation_notes:
  register: 采用现代、清楚而庄重的叙事语体。“四十昼夜”简练自然；“两块石版，就是约版”保留原文同位重复。英文咨询层所列脚注“或作‘雅威给了我’”与所给WLC正文并未形成可辨识的实质异读，且该意思已在正文中明确表达，因此不设置无信息增量的脚注。
