source:
  edition: WLC
  text: וְ/יָדַעְתָּ֣ הַ/יּ֗וֹם כִּי֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ הֽוּא הָ/עֹבֵ֤ר לְ/פָנֶ֨י/ךָ֙ אֵ֣שׁ אֹֽכְלָ֔ה ה֧וּא יַשְׁמִידֵ֛/ם וְ/ה֥וּא יַכְנִיעֵ֖/ם לְ/פָנֶ֑י/ךָ וְ/הֽוֹרַשְׁתָּ֤/ם וְ/הַֽאַבַדְתָּ/ם֙ מַהֵ֔ר כַּ/אֲשֶׁ֛ר דִּבֶּ֥ר יְהוָ֖ה לָֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/003.yaml
  text: So know today that Yahweh your God is the one crossing over before you[a], a consuming fire. He will destroy them, and he will subdue them before you; and you will dispossess them and make them perish quickly[d][c][b], just as Yahweh has spoken to you.
translation:
  language: zh_hans
  text: 所以，你今天要知道：耶和华你的上帝正越过、走在你前面[a]；他是吞噬的烈火[b]。他必毁灭他们，使他们在你面前屈服；你必赶出他们[c]，迅速使他们灭亡，正如耶和华对你所说的[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “正越过、走在你前面”也可译作“在你前面越过去”或“走在你前面”。希伯来文分词描写耶和华正在以色列前面行动。
    reason: lexical_alternative
  - marker: b
    text: “吞噬的烈火”也可译作“吞吃的火”或“吞噬的火”。
    reason: lexical_alternative
  - marker: c
    text: “赶出他们”也可译作“使他们失去产业”或“逐出他们”。
    reason: lexical_alternative
  - marker: d
    text: “正如耶和华对你所说的”也可译作“照耶和华从前对你说的”；这里指事情将按耶和华先前的话发生。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדַעְתָּ הַיּוֹם
  choice: 所以，你今天要知道
  rationale: 承接上文，并把完成式在语境中的劝告语气自然地译出。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代简体中文读者熟悉的形式呈现四字神名，不以称号替代专名。
- source_word: הוּא הָעֹבֵר לְפָנֶיךָ
  choice: 正走在你前面
  rationale: 分词表达正在进行、鲜明迫近的行动；此处的עבר可指越过或行在前面，正文采用自然中文，并以脚注保留“走在前面／越过去”的具体歧义。
- source_word: אֵשׁ אֹכְלָה
  choice: 吞噬的烈火
  rationale: 保留火“吞吃”的强烈意象及神圣审判的分量，同时符合现代汉语表达。
- source_word: יַשְׁמִידֵם
  choice: 毁灭他们
  rationale: 准确表达使之遭毁灭的使役意义，力度明确而不过度现代化。
- source_word: יַכְנִיעֵם
  choice: 使他们……屈服
  rationale: 在军事语境中表示使敌方降服、被压制，比内在意义较强的“使谦卑”更贴切。
- source_word: וְהוֹרַשְׁתָּם
  choice: 夺去他们的地
  rationale: 在占领土地的语境中传达使原居民失去产业、以色列取得其地的领土含义；脚注保留“赶走他们”的可能译法。
- source_word: וְהַאֲבַדְתָּם
  choice: 使他们灭亡
  rationale: 保留אבד使役形的意义，并与前面的שׁמד“毁灭”在中文措辞上有所区别。
- source_word: מַהֵר
  choice: 迅速
  rationale: 表达行动或结果发生得快；不擅自改译为时间点意义更强的“不久”。
- source_word: כַּאֲשֶׁר דִּבֶּר יְהוָה לָךְ
  choice: 正如耶和华对你所说的
  rationale: 保留“说”的宽泛意义和先前话语的指向，不把它明确收窄为“应许”。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 正文采用现代中文圣经传统中最广为普通读者识别的神名形式，同时将其作为专名而非“主”这一称号来翻译。
- issue: אֵשׁ אֹכְלָה的神圣战争与审判意象
  choice: 吞噬的烈火
  alternative: 烈火
  rationale: 保留原文将上帝临在描绘为吞噬之火的强烈比喻，不淡化其审判和毁灭意味。
- issue: 上帝行动与以色列行动并列
  choice: 先陈述上帝毁灭、使其屈服，再陈述以色列夺地、使其灭亡
  alternative: 把全部行动概括为上帝赐胜
  rationale: 保留原文对神的主导行动和以色列随后行动之间的张力，不以神学概括消除双方在句法上的施事关系。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“吞噬的烈火”“使他们屈服”等保留原文的力度；句子依照希伯来文推进次序展开，同时适当加入中文标点以增强可读性。所有脚注标记均置于相关正文词组之后。
