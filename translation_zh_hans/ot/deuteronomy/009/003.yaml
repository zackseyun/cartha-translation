  to: 所以，你今天要知道：耶和华你的上帝正越过、走在你前面[a]；他是吞噬的烈火[b]。他必毁灭他们，使他们在你面前屈服；你必赶出他们[c]，迅速使他们灭亡，正如耶和华对你所说的[d]。
  rationale: 修订仅纠正原文宾语的保留及脚注中不必要的扩展：将“夺去他们的地”改为“赶出他们”，以对应动词的直接宾语；将脚注b改为不添加原文没有的“人”；收束脚注a，使其不把上下文推论当作该词的字面内容。
