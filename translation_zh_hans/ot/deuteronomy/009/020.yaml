  text: וּֽ/בְ/אַהֲרֹ֗ן הִתְאַנַּ֧ף יְהוָ֛ה מְאֹ֖ד לְ/הַשְׁמִיד֑/וֹ וָֽ/אֶתְפַּלֵּ֛ל גַּם בְּעַ֥ד אַהֲרֹ֖ן בָּ/עֵ֥ת הַ/הִֽוא־
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/020.yaml
  text: And Yahweh was very angry with Aaron[a], to destroy him; and I also prayed for Aaron at that time.
translation:
  language: zh_hans
  text: 耶和华也向亚伦大发烈怒，要毁灭他；那时，我也为亚伦祷告。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְאַהֲרֹן
  choice: 也向亚伦
  rationale: 介词 בְ 与怒气动词连用，在汉语中自然表达为“向亚伦”；句首 וּ 结合上下文译作“也”，表明亚伦同样成为烈怒的对象。
- source_word: הִתְאַנַּף ... מְאֹד
  choice: 大发烈怒
  rationale: התאנף 表示发怒，מאד 加强程度；“大发烈怒”既保留强烈语气，也符合庄重、自然的现代汉语。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经传统中通行的神名音译“耶和华”，明确保留专名性质，而不以“主”等称号替代。
- source_word: לְהַשְׁמִידוֹ
  choice: 要毁灭他
  rationale: לְ 在此引出怒气所趋向的行动或意图；“要毁灭他”保留原文的严厉程度，不额外限定毁灭方式。
- source_word: וָאֶתְפַּלֵּל
  choice: 我也……祷告
  rationale: פלל 的 Hitpael 形式通常指祷告；由后面的 בְּעַד 表明这是代求，无须把动词本身扩译为“代求”。
- source_word: גַּם בְּעַד אַהֲרֹן
  choice: 也为亚伦
  rationale: גם 表示摩西除先前所述祷告外，也为亚伦祷告；בעד 在祷告语境中自然译作“为”。
- source_word: בָּעֵת הַהִוא
  choice: 那时
  rationale: 简洁、自然地指回正在叙述的那一时期，与原文时间短语相符。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用以色列上帝的专名。中文正文采用读者最熟悉且长期通行的音译“耶和华”，同时不以称号“主”替代专名。
- issue: לְהַשְׁמִידוֹ 所表达的是意图还是结果
  choice: 要毁灭他
  alternative: 以致毁灭他
  rationale: 不定式可表达怒气所趋向的意图或目的；“要”保留这种指向，同时不暗示毁灭已经实际发生。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“大发烈怒”保留原文的强烈程度；后半句按汉语信息顺序将“那时”前置。经核对，此节无需脚注；英文脚注所提示的“with/against”差异在中文“向亚伦发怒”中不构成有意义的歧义。
