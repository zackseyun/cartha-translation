  text: זְכֹר֙ לַ/עֲבָדֶ֔י/ךָ לְ/אַבְרָהָ֥ם לְ/יִצְחָ֖ק וּֽ/לְ/יַעֲקֹ֑ב אַל תֵּ֗פֶן אֶל קְשִׁי֙ הָ/עָ֣ם הַ/זֶּ֔ה וְ/אֶל רִשְׁע֖/וֹ וְ/אֶל חַטָּאתֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/027.yaml
  text: Remember your servants[a], Abraham, Isaac, and Jacob. Do not turn your attention to the stubbornness of this people, or to their wickedness[b], or to their sin.
translation:
  language: zh_hans
  text: 求你记念你的仆人——亚伯拉罕、以撒和雅各。不要留意[a]这百姓的顽固[b]、邪恶和罪。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “留意”原文有“转向”之意；也可译作“察看”或“顾念”。
    reason: lexical_alternative
  - marker: b
    text: 或译“刚硬”“顽梗”。原文表示坚硬或固执，不是本书别处译作“硬着颈项”的那个特定说法。
    reason: lexical_alternative
lexical_decisions:
- source_word: זְכֹר
  choice: 求你记念
  rationale: 这是摩西向上帝发出的祈求式命令。“记念”既准确表达 זכר，也保留盟约代求语境；加上“求你”使现代汉语祷告语气自然而庄重。
- source_word: לַעֲבָדֶיךָ
  choice: 你的仆人
  rationale: עבד 可指仆人或奴仆；此处是对族长与上帝之关系的尊称，并非强调受奴役的身份，因此译作“仆人”。
- source_word: לְאַבְרָהָם לְיִצְחָק וּלְיַעֲקֹב
  choice: 亚伯拉罕、以撒和雅各
  rationale: 采用简体中文圣经传统中通行的人名译法，并以破折号表明三人是“你的仆人”的同位说明。
- source_word: אַל תֵּפֶן אֶל
  choice: 不要留意
  rationale: פנה 与 אֶל 连用，字面有“转向”之意，在此祈求语境中指把注意力放在某事上。“不要留意”自然表达其语用意义，字面意象及其他译法列入脚注。
- source_word: קְשִׁי
  choice: 顽固
  rationale: 该名词表示坚硬、固执。“顽固”是现代汉语中清楚自然的道德性表达，也避免误引本书别处“硬着颈项”的不同希伯来语惯用语。
- source_word: הָעָם הַזֶּה
  choice: 这百姓
  rationale: עם 在此指作为群体的百姓；“这百姓”保留指示语气及盟约群体含义。
- source_word: רִשְׁעוֹ
  choice: 邪恶
  rationale: רשע 在此表示道德上的恶。希伯来语第三人称单数后缀回指集合名词“百姓”；汉语用“这百姓的邪恶”即可自然表达，无须另加单复数代词。
- source_word: חַטָּאתוֹ
  choice: 罪
  rationale: חטאת 在此指百姓的罪。“罪”保留原文单数的概括性，并与“顽固、邪恶”构成自然并列。
theological_decisions:
- issue: 族长称为 עבד 时的身份含义
  choice: 你的仆人
  alternative: 你的奴仆
  rationale: 此处是在代求中尊称亚伯拉罕、以撒和雅各为属于上帝、事奉上帝的人，重点不在受奴役或财产身份；“仆人”较符合语境，同时不否认该词在其他上下文可有“奴仆”之义。
- issue: 上帝“不要留意”百姓罪恶的代求措辞
  choice: 保持祈求原貌，不解释为上帝忽视或否认罪
  alternative: 不要追究这百姓的顽固、邪恶和罪
  rationale: 原文使用“不要转向／留意”而非明确的法律性“不要追究”。译文保留其祷告中的张力，不擅自说明上帝如何处理罪。
- issue: 集合名词“百姓”所带单数后缀的表达
  choice: 这百姓的顽固、邪恶和罪
  alternative: 这百姓各人的顽固、邪恶和罪
  rationale: 原文把百姓视为一个集合整体。汉语所有格结构可自然保留这种集体指涉；添加“各人”会把原文未明确的个体化含义带入译文。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。“求你记念”保留代求口吻；“顽固”比“顽梗”更符合现代通用汉语，而脚注保留后者作为词义选项。破折号清楚标示三位族长与“你的仆人”的同位关系。
