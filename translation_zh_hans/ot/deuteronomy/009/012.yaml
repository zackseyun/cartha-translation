  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֵלַ֗/י ק֣וּם רֵ֤ד מַהֵר֙ מִ/זֶּ֔ה כִּ֚י שִׁחֵ֣ת עַמְּ/ךָ֔ אֲשֶׁ֥ר הוֹצֵ֖אתָ מִ/מִּצְרָ֑יִם סָ֣רוּ מַהֵ֗ר מִן הַ/דֶּ֨רֶךְ֙ אֲשֶׁ֣ר צִוִּיתִ֔/ם עָשׂ֥וּ לָ/הֶ֖ם מַסֵּכָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/012.yaml
  text: And Yahweh said to me[a], 'Arise, go down quickly from here, because your people, whom you brought out from Egypt, have corrupted themselves. They have quickly turned aside from the way that I commanded them; they have made for themselves a cast image.'
translation:
  language: zh_hans
  text: 耶和华对我说：“起来，赶快从这里下去，因为你从埃及领出来的百姓已经败坏了。他们很快就偏离了我吩咐他们遵行的道路，为自己造了一尊铸像[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“熔铸的像”。希伯来语指用熔化的金属浇铸成的像。
    reason: 说明原词所强调的金属浇铸工艺，并提供较直观的替代译法。
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的专名形式，明确保留原文中的上帝之名，而不以“主”替代。
- source_word: קוּם רֵד מַהֵר מִזֶּה
  choice: 起来，赶快从这里下去
  rationale: 保留连续命令的急迫感、下行方向和“从这里”的指示意义，同时符合现代汉语表达。
- source_word: שִׁחֵת
  choice: 败坏了自己
  rationale: 在本语境中表示百姓因背道而陷入败坏；此译法保留行为及其落在自身之上的意味，又不额外解释其后果。
- source_word: עַמְּךָ
  choice: 你的百姓
  rationale: 直译第二人称所属关系，以保留上帝对摩西说“你的百姓”所产生的责备和疏离语气。
- source_word: אֲשֶׁר הוֹצֵאתָ מִמִּצְרָיִם
  choice: 你从埃及领出来的
  rationale: “领出来”自然表达使役性的出离动作，也保留经文将出埃及行动归于摩西的直接措辞。
- source_word: סָרוּ מַהֵר מִן הַדֶּרֶךְ
  choice: 很快就偏离了……道路
  rationale: 保留“很快”的重复以及偏离规定道路的比喻；“偏离道路”在现代汉语中自然清楚。
- source_word: אֲשֶׁר צִוִּיתִם
  choice: 我吩咐他们遵行的
  rationale: 原文是“我吩咐他们的道路”；补出“遵行”使汉语关系明确，同时不改变这道路代表上帝所命定行为规范的意思。
- source_word: מַסֵּכָה
  choice: 铸像
  rationale: 该词具体指以熔化金属浇铸而成的像；“铸像”比泛称“偶像”更准确地保留制作方式。
theological_decisions:
- issue: “你的百姓，是你从埃及领出来的”所表达的修辞性疏离
  choice: 保留“你……的百姓”和“你……领出来”的第二人称措辞
  alternative: 改写为“我的百姓”或“我从埃及领出来的百姓”
  rationale: 原文刻意以第二人称向摩西发出责备；译文不将这种神学张力按通常的出埃及叙述加以缓和。
- issue: שִׁחֵת 的败坏含义
  choice: 败坏了自己
  alternative: 行事败坏；变得败坏
  rationale: 此处既可着眼于败坏的行为，也可包含自身陷入败坏的结果；“败坏了自己”保留原文在本语境中的强烈责备，不将其弱化为一般的不当行为。
- issue: מַסֵּכָה 所指的拜偶像之物
  choice: 铸像
  alternative: 偶像；熔铸的像
  rationale: 原词突出像的制作方式，并未仅使用泛指偶像的词；译文保留这一具体性，脚注说明其材质和工艺。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。以短促的命令句呈现急迫语气，保留“很快”与前句“赶快”的呼应；避免文言化的“速速”“下去吧”等措辞。
