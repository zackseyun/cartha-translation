revisions:
- from: 耶和华对我说：“起来，赶快从这里下去，因为你从埃及领出来的百姓败坏了自己。他们很快就偏离了我吩咐他们遵行的道路，为自己造了一尊铸像[a]。”
  to: 耶和华对我说：“起来，赶快从这里下去，因为你从埃及领出来的百姓已经败坏了。他们很快就偏离了我吩咐他们遵行的道路，为自己造了一尊铸像[a]。”
