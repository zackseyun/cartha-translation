base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/015.yaml
  text: So I turned and came down from the mountain[a], and the mountain was burning with fire[b], and the two tablets of the covenant were in my two hands.
translation:
  language: zh_hans
  text: 于是我转身下了山；那山[a]正在火中燃烧，两块约版在我双手上[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作：“于是我转身下了山，当时那山正在火中燃烧。”原文以普通连接词连接这两句，既可表示简单并列，也可按语境理解为伴随情形。
    reason: alternative_reading
  - marker: b
    text: 直译：“在我的两手之上。”
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֵפֶן
  choice: 于是我转身
  rationale: פנה在连续叙事形式中表示“转身”；“于是”自然体现动作的承接关系。
- source_word: וָאֵרֵד מִן־הָהָר
  choice: 下山
  rationale: ירד意为“下去”；结合מִן־הָהָר，在汉语中简洁自然地译为“下山”。
- source_word: וְהָהָר בֹּעֵר בָּאֵשׁ
  choice: 山正被火烧着
  rationale: 保留בֹּעֵר的持续状态和בָּאֵשׁ明确提到的“火”；用分号并列，不把连接词限定为纯时间关系。
- source_word: וּשְׁנֵי לֻחֹת הַבְּרִית
  choice: 约的两块版
  rationale: לֻחֹת指书写用的版，הַבְּרִית是“约”；此译法保留所属关系及原文明确的“两块”，也不在本节正文中增添“石”这一未明说的材料。
- source_word: עַל שְׁתֵּי יָדָי
  choice: 在我两手上
  rationale: עַל直译为“在……上”；此处指摩西用两手拿着版。“在我两手上”既能理解，也保留原文的空间表达和“两手”。
theological_decisions:
- issue: 山燃烧这一分句与摩西下山的关系
  choice: 以并列句表达，并用“正”呈现同时进行的状态
  alternative: 译为“下山时，山正被火烧着”
  rationale: 希伯来文只用连接词וְ，既可作简单并列，也可按语境理解为伴随情形；正文不把这种关系明确限定为时间从属，脚注说明另一种自然理解。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“约版”避免冗长，同时保持申命记语境中的立约含义；正文保留原文连接关系的含混性，并以脚注交代可能的伴随理解。
