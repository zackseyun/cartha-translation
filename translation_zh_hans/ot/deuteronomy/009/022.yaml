base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/022.yaml
  text: And at Taberah[a], and at Massah, and at Kibroth-hattaavah, you kept provoking Yahweh to anger.
translation:
  language: zh_hans
  text: 在他备拉、玛撒和基博罗·哈他瓦[a]，你们一直惹雅威发怒。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “基博罗·哈他瓦”是地名，字面意思是“贪欲的坟墓”或“欲望的坟墓”。
    reason: 说明复合地名的字面意义，并保留 תַּאֲוָה 可指贪欲或欲望的词义幅度；“坟墓”对应原文复数。
lexical_decisions:
- source_word: וּבְתַבְעֵרָה
  choice: 在他备拉
  rationale: 介词 בְ 在地点列举中译为“在”；专名 תַבְעֵרָה 按希伯来语音译为“他备拉”。
- source_word: וּבְמַסָּה
  choice: 在玛撒
  rationale: 介词表示地点；מַסָּה 作为地名音译为“玛撒”。
- source_word: וּבְקִבְרֹת הַתַּאֲוָה
  choice: 在基博罗·哈他瓦[a]
  rationale: 这是旷野叙事中的固定地名，正文采用音译，并以脚注说明其字面意义；间隔号帮助现代读者辨认复合地名。
- source_word: מַקְצִפִים
  choice: 惹……发怒
  rationale: קצף 的使役分词表示使某人发怒；“惹……发怒”既保留使役意义，也符合现代汉语表达。
- source_word: הֱיִיתֶם מַקְצִפִים
  choice: 你们不断惹……发怒
  rationale: היה 与分词构成迂回式表达，在这里描述过去持续或反复发生的行为；“不断”自然传达这一体貌。
- source_word: אֶת־יְהוָה
  choice: 雅威
  rationale: אֶת 标明直接宾语，无须另译；神名 יהוה 采用“雅威”，保留经文本身使用的专名。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。译作“雅威”以专名形式呈现该名，不以称号替代，也不额外加入原文没有的词。
- issue: 以色列人行为的持续性
  choice: 不断惹……发怒
  alternative: 惹……发怒；当时正惹……发怒
  rationale: הֱיִיתֶם 与使役分词的组合带有持续或反复色彩；“不断”保留这种责备的力度，同时不把它限定为单次事件。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。地点列举合并为汉语惯用的“在……、……和……”，避免机械重复“并在”；“不断惹雅威发怒”清楚传达原文的持续性和使役意义。脚注标记依其内容置于“基博罗·哈他瓦”之后。
