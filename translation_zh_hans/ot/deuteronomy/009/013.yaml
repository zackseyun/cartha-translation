  naturalness: “雅威又对我说”及“硬着颈项的百姓”庄重、通顺，适合经文语体。“看哪，这百姓是……”比“看哪，这是……”指代更明确，也更自然地重现原文对同一“百姓”的重复判定。
  terminology: “雅威”一致对应 יְהוָה；“百姓”恰当表达 עַם 的集合意义；“硬着颈项”保留了 קְשֵׁה עֹרֶף 的圣经性形象和惯用译法，未将其过度释义为单纯“顽固”。
