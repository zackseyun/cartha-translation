source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר יְהוָ֖ה אֵלַ֣/י לֵ/אמֹ֑ר רָאִ֨יתִי֙ אֶת הָ/עָ֣ם הַ/זֶּ֔ה וְ/הִנֵּ֥ה עַם קְשֵׁה עֹ֖רֶף הֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/013.yaml
  text: Then Yahweh said to me[a], saying, ‘I have seen this people, and behold, it is a stiff-necked people.’
translation:
  language: zh_hans
  text: 雅威又对我说：“我看见了[a]这百姓；看哪，这百姓是硬着颈项的百姓。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我已经看见了”。
    reason: 希伯来语完成式 רָאִיתִי 可直译为“我看见了”，也可在此语境中译作强调既成观察的“我已经看见了”。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 又……说
  rationale: 承接前文并推进叙事；“又”比逐字译作“于是”更符合本段连续讲话的语境。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文四字神名作音译，保留其作为专名的功能，不以称号替代。
- source_word: אֵלַי לֵאמֹר
  choice: 对我说
  rationale: 汉语中“对我说，说”显得重复，因此用自然的引语结构表达希伯来语的发言公式。
- source_word: רָאִיתִי
  choice: 我已经看清
  rationale: 完成式在此表达雅威观察后所得的明确判断；“看清”自然传达这种语境含义，同时以脚注保留较直译的可能。
- source_word: הָעָם הַזֶּה
  choice: 这百姓
  rationale: 保留 עַם 的集合性单数和指示语气；“百姓”在庄重的现代汉语中自然。
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留 הִנֵּה 引人注意并加强断言的语篇作用及庄重语气。
- source_word: עַם קְשֵׁה עֹרֶף
  choice: 硬着颈项的百姓
  rationale: 保留希伯来语“颈项坚硬”的身体隐喻及其顽梗、抗拒管束的含义，不简化为抽象的“顽固”。
- source_word: הוּא
  choice: 这是
  rationale: 以汉语判断句自然对应与集合名词 עַם 呼应的阳性单数代词，同时避免不必要地改成复数。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较贴近学界通常重构的读音，并明确保留专名性质。
- issue: “硬着颈项”的隐喻
  choice: 保留身体隐喻
  alternative: 顽固的百姓
  rationale: 原文以不肯低头或转颈的形象刻画百姓的顽梗与悖逆；保留隐喻可避免把其神学张力压缩为一般性性格描述。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。用“看哪”保留原文的强调语气，用“硬着颈项”保留核心圣经隐喻；发言公式则按自然汉语简化。
