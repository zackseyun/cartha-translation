  yaml_path: translation/ot/deuteronomy/009/024.yaml
  text: You have been rebellious against Yahweh from the day I knew you[a].
translation:
  language: zh_hans
  text: 从我认识你们的那天起，你们就一直悖逆雅威[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “悖逆雅威”按字面可译为“与雅威同在悖逆中”；这里的“与”表达对抗关系，即悖逆、反对雅威。
    reason: lexical_alternative
lexical_decisions:
- source_word: מַמְרִים
  choice: 作对
  rationale: 该词源于 מרה，表示悖逆、抗拒权威；与介词 עִם 连用时，“与……作对”在现代汉语中自然地表达持续反抗的意思。
- source_word: הֱיִיתֶם
  choice: 一直
  rationale: 这是 היה 的第二人称复数完成式；结合“从……那天起”，用“就一直”表达从过去起延续至摩西说话之时的状态。
- source_word: עִם
  choice: 与
  rationale: עִם 的基本义是“与、同”；在 מרה 的语境中表示与耶和华处于对抗关系，因此整句译作“与耶和华作对”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的专名音译来呈现四字神名，而不以“主”这一称号替代。
- source_word: מִיּוֹם
  choice: 从……那天起
  rationale: 准确表达时间起点，并与汉语中的持续状态“就一直”自然配合。
- source_word: דַּעְתִּי אֶתְכֶם
  choice: 我认识你们
  rationale: ידע 在这里指摩西开始认识、接触以色列人；“认识你们”保留原文简洁表达，不额外限定为初次见面或纯粹的知识性了解。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；主
  rationale: 原文使用神的专名。译文保留专名而不改用称号“主”；“耶和华”是现代中文读者最熟悉的专名形式。
- issue: עִם 与 מרה 所表达的关系
  choice: 与耶和华作对
  alternative: 悖逆耶和华；同耶和华
  rationale: 原文介词字面为“与、同”，但整项搭配表示对抗。译作“与……作对”既保留介词的关系结构，也清楚传达敌对含义。
translation_notes:
  register: 采用庄重而通俗的现代标准汉语。“从……那天起……就一直”清楚呈现持续性；“作对”比单用“反叛”更自然地保留 עִם（“与、同”）所构成的关系表达。
