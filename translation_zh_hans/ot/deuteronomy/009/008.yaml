base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/008.yaml
  text: Even at Horeb you provoked Yahweh to wrath[b][a], and Yahweh was angry with you enough to destroy you.
translation:
  language: zh_hans
  text: 甚至在何烈山[a]，你们也惹雅威发怒；雅威向你们发怒，要毁灭你们[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“在何烈山”或“而在何烈山”；希伯来语连词可以只是承接上文，但在这里很可能含有强调意味。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“雅威向你们发怒，以致要毁灭你们”或“雅威向你们大发烈怒，甚至要毁灭你们”。希伯来语把雅威的愤怒与要毁灭你们紧密相连。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְחֹרֵב
  choice: 甚至在何烈山
  rationale: וּ承接上文，在本句语境中可带强调意味；“甚至在”用自然的现代汉语表达这种强调，同时保留地名“何烈山”。
- source_word: הִקְצַפְתֶּם
  choice: 你们也惹……发怒
  rationale: קצף的使役式表示使对方动怒；“惹……发怒”既保留使役含义，也符合现代汉语表达。
- source_word: אֶת יְהוָה
  choice: 雅威
  rationale: 原文直接使用四字神名יהוה；采用“雅威”音译，以区别于作为称号的“主”。宾格标记אֶת不另译。
- source_word: וַיִּתְאַנַּף
  choice: 发怒
  rationale: אנף表示强烈的愤怒；“发怒”庄重自然，且不额外规定其强烈程度。
- source_word: בָּכֶם
  choice: 向你们
  rationale: 介词ב与表示发怒的动词连用时，指出怒气所针对的对象；“向你们发怒”是自然准确的汉语表达。
- source_word: לְהַשְׁמִיד אֶתְכֶם
  choice: 要毁灭你们
  rationale: שׁמד的使役式表示毁灭或消灭；לְ加不定式把雅威的怒气与毁灭的意向或结果紧密相连。“要毁灭你们”直接而庄重。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文使用神的专名יהוה。音译为“雅威”可保留其专名性质，也避免与称号“主”混同。
- issue: 神的愤怒与毁灭之间的关系
  choice: “向你们发怒，要毁灭你们”
  alternative: “向你们大发烈怒，甚至要毁灭你们”
  rationale: 原文לְהַשְׁמִיד可表达目的或趋向的结果；正文保留二者的直接联系，却不把它明确限定为怒气达到某种程度。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。分号呈现原文两个并列分句；“惹……发怒”保留使役语义，“要毁灭你们”保留目的与结果之间的开放性。所有脚注标记均置于相关正文之后。
