  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: בַּ/עֲלֹתִ֣/י הָ/הָ֗רָ/ה לָ/קַ֜חַת לוּחֹ֤ת הָֽ/אֲבָנִים֙ לוּחֹ֣ת הַ/בְּרִ֔ית אֲשֶׁר כָּרַ֥ת יְהוָ֖ה עִמָּ/כֶ֑ם וָ/אֵשֵׁ֣ב בָּ/הָ֗ר אַרְבָּעִ֥ים יוֹם֙ וְ/אַרְבָּעִ֣ים לַ֔יְלָה לֶ֚חֶם לֹ֣א אָכַ֔לְתִּי וּ/מַ֖יִם לֹ֥א שָׁתִֽיתִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/009.yaml
  text: When I went up the mountain to receive the stone tablets[a], the tablets of the covenant that Yahweh made with you, I remained on the mountain forty days and forty nights[c][b]; I ate no bread and drank no water.
translation:
  language: zh_hans
  text: 当我上山去领受[a]石版[b]，就是雅威与你们所立之约[c]的版时，我在山上停留了四十昼夜；我没有吃饼，也没有喝水。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“拿取”；这里指摩西上山领受所赐的版。
    reason: lexical_alternative
  - marker: b
    text: 直译为“石头的版”。
    reason: lexical_alternative
  - marker: c
    text: “立约”原文直译为“切约”，是希伯来语表示订立盟约的固定说法。
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּעֲלֹתִי
  choice: 我上山
  rationale: בְּ加不定式附属形和第一人称单数词尾构成时间从句；“我上山”自然表达“当我上山时”，并保留向山上行进之意。
- source_word: לָקַחַת
  choice: 领取
  rationale: 该词通常意为“拿、取”，但此处摩西上山是要取得上帝交给他的版；“领取”既保留主动前往取版的语气，也符合受领之意。
- source_word: לוּחֹת הָאֲבָנִים
  choice: 石版
  rationale: 原文是“石头的版”；“石版”简洁自然，准确说明材质，又不擅自加入上下文中的“两块”。
- source_word: לוּחֹת הַבְּרִית
  choice: 约版
  rationale: 原文以同位语重复说明这些石版是“约的版”。译作“约版”保留其身份及希伯来文的强调。
- source_word: אֲשֶׁר כָּרַת יְהוָה עִמָּכֶם
  choice: 雅威与你们立约
  rationale: כרת在此属于“切立盟约”的固定表达，现代汉语自然译为“立约”；关系从句按语义最自然地连接到“约版”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 采用神圣四字名的现代汉语音译，保留原文所用的上帝之名，而不以称号替代。
- source_word: וָאֵשֵׁב
  choice: 我在山上停留了
  rationale: ישׁב可指坐、居住或停留；此处紧接四十昼夜的时长，重点是摩西留在山上的时间。
- source_word: אַרְבָּעִים יוֹם וְאַרְבָּעִים לַיְלָה
  choice: 四十昼夜
  rationale: 这是自然、庄重的现代汉语表达，完整传达“四十日和四十夜”的连续时段。
- source_word: לֶחֶם לֹא אָכַלְתִּי
  choice: 没有吃饼
  rationale: לֶחֶם可泛指食物，也具体指饼；此处保留具体词义“饼”，不扩大为“食物”。
- source_word: וּמַיִם לֹא שָׁתִיתִי
  choice: 也没有喝水
  rationale: 直接表达原文，并以“也”保持与前句否定结构的平行。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。音译“雅威”较接近学界通常重构的读音，并保留其作为专名的性质；不以“上主”等称号取代。
- issue: “立约”中 כרת 的表达
  choice: 立约
  alternative: 切约
  rationale: “切约”虽可反映希伯来语字面形式，却不是自然现代汉语；“立约”准确传达这一固定习语，同时用脚注保留其字面背景。
translation_notes:
  register: 采用现代、清楚而庄重的叙事语体。“领取”兼顾 לָקַחַת 的“取”与语境中的受领；“约版”保留原文同位语的重复和盟约重点；句末两个否定分句保持简洁平行。
