  text: וָֽ/אֶתְנַפַּ֞ל לִ/פְנֵ֣י יְהוָ֗ה אֵ֣ת אַרְבָּעִ֥ים הַ/יּ֛וֹם וְ/אֶת אַרְבָּעִ֥ים הַ/לַּ֖יְלָה אֲשֶׁ֣ר הִתְנַפָּ֑לְתִּי כִּֽי אָמַ֥ר יְהוָ֖ה לְ/הַשְׁמִ֥יד אֶתְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/025.yaml
  text: So I fell down before Yahweh for forty days and forty nights[a], because Yahweh had said he would destroy you.
translation:
  language: zh_hans
  text: 于是，我在雅威面前俯伏了四十昼夜[a]；我这样俯伏，是因为雅威说要毁灭你们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我在雅威面前伏倒了四十天四十夜。”原文动词可着重表示为代求而俯伏在地。
    reason: 词义备选；说明该动词既可译作“俯伏”，也可较直译为“伏倒”。
lexical_decisions:
- source_word: וָאֶתְנַפַּל / הִתְנַפָּלְתִּי
  choice: 俯伏／我这样俯伏
  rationale: התפעל形态的 נפל 在这里描写摩西伏在雅威面前代求。“俯伏”既保留身体伏下的动作，也符合庄重的现代汉语；后半句用“我这样俯伏”体现原文动词的重复，同时避免生硬地重复整段时间表达。
- source_word: לִפְנֵי יְהוָה
  choice: 在雅威面前
  rationale: לִפְנֵי 表示“在……面前／临在中”；按本项目对神名的处理，将 יהוה 音译为“雅威”。
- source_word: אֵת אַרְבָּעִים הַיּוֹם וְאֶת אַרְבָּעִים הַלַּיְלָה
  choice: 四十昼夜
  rationale: 两个带定冠词的时间短语在此作时长宾语。“四十昼夜”是自然、凝练的汉语，并完整表达四十天和四十夜。
- source_word: כִּי
  choice: 因为
  rationale: 此处引出摩西俯伏代求的原因。
- source_word: אָמַר יְהוָה לְהַשְׁמִיד אֶתְכֶם
  choice: 雅威说要毁灭你们
  rationale: לְהַשְׁמִיד 表达雅威所宣告的行动意向；“说要毁灭”在现代汉语中自然，也不把“毁灭”强化为“彻底灭绝”。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华／上主
  rationale: 原文直接使用四字神名；采用“雅威”以保留其专名性质，不以称号替代。
- issue: 摩西俯伏的含义
  choice: 正文只陈述俯伏，不明说“代求”
  alternative: 为你们代求
  rationale: 上下文显示这是代求行为，但本节原文本身以身体动作表达；不在正文中增补解释，以保留原文的叙述方式。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“于是”承接上文并表达结果关系；分号后的“我这样俯伏”保留希伯来文重复动词所产生的回指和强调，同时避免机械重复“四十昼夜”。脚注标记已置于相关短语之后。
