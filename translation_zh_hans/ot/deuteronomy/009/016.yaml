  text: וָ/אֵ֗רֶא וְ/הִנֵּ֤ה חֲטָאתֶם֙ לַ/יהוָ֣ה אֱלֹֽהֵי/כֶ֔ם עֲשִׂיתֶ֣ם לָ/כֶ֔ם עֵ֖גֶל מַסֵּכָ֑ה סַרְתֶּ֣ם מַהֵ֔ר מִן הַ/דֶּ֕רֶךְ אֲשֶׁר צִוָּ֥ה יְהוָ֖ה אֶתְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/016.yaml
  text: 'And I looked[a], and behold, you had sinned against Yahweh your God: you had made for yourselves a cast-metal calf. You had turned aside quickly from the way that Yahweh had commanded you.'
translation:
  language: zh_hans
  text: 我一看，只见你们得罪了耶和华你们的神，为自己铸造了一头牛犊；你们很快就偏离了耶和华吩咐你们当行的道路。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאֵרֶא וְהִנֵּה
  choice: 我一看，只见
  rationale: ראה表示看见、察看，הִנֵּה用来引人注意眼前事实。“我一看，只见”自然保留了观察动作和强调效果。
- source_word: חֲטָאתֶם לַיהוָה אֱלֹהֵיכֶם
  choice: 你们得罪了耶和华你们的神
  rationale: חטא与介词ל连用，在此表示对神犯罪或得罪神；“得罪了”符合现代汉语叙事，也保留其道德与盟约含义。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经传统中通行且可辨识的神名译法，作为四字神名的专名表达，而不以“主”这一称号代替。
- source_word: עֲשִׂיתֶם לָכֶם עֵגֶל מַסֵּכָה
  choice: 为自己铸造了一头牛犊
  rationale: לָכֶם表示为自己，מַסֵּכָה指用熔化金属铸成的物件或偶像；“铸造”已清楚表达其制作方式。
- source_word: סַרְתֶּם מַהֵר מִן הַדֶּרֶךְ
  choice: 你们很快就偏离了……道路
  rationale: סור与“道路”构成偏离正道的比喻；מַהֵר译作“很快”，保留迅速背离的责备意味。
- source_word: אֲשֶׁר צִוָּה יְהוָה אֶתְכֶם
  choice: 耶和华吩咐你们当行的
  rationale: 原文直译为“耶和华吩咐你们的道路”。中文补出“当行”可明确道路是受命遵行的生活方式，而不改变命令的内容。
theological_decisions:
- issue: 四字神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用神的专名，而非一般称号。正文保留中文读者最熟悉的专名“耶和华”；“雅威”是较接近学界常见重构发音的另一译法，但原始确切元音并无定论。
- issue: “道路”的盟约伦理含义
  choice: 吩咐你们当行的道路
  alternative: 吩咐你们的道路
  rationale: “道路”既保留原文比喻，也指神所命定的行为与生活方向；补出“当行”使现代汉语清楚通顺，但不把它缩减为某一条具体诫命。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“我一看，只见”保留叙事的现场感；分号呈现罪行与迅速偏离之间的紧密关系。未设置脚注，因为“铸造”已在正文充分传达מַסֵּכָה的金属浇铸含义。
