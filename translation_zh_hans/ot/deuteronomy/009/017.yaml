base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/017.yaml
  text: So I took hold of the two tablets and threw them from my two hands and shattered them before your eyes[a].
translation:
  language: zh_hans
  text: 于是，我抓住那两块石版，从我双手中把它们扔出去，在你们眼前把它们打碎了[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“把它们打破了。”希伯来语动词可较宽泛地译为“打破”；正文的“打碎”结合了石版被扔出的语境。
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶתְפֹּשׂ
  choice: 我抓住
  rationale: תפשׂ表示抓住、握住；“抓住”自然直接，保留了明确的肢体动作，又不像“夺过”那样增添原文没有的对象转换或暴力意味。
- source_word: בִּשְׁנֵי הַלֻּחֹת
  choice: 那两块石版
  rationale: לֻחוֹת指版；定冠词表明是上下文已知的两块版。中文以“石版”清楚指回本章前文所述的约版，避免单说“两块版”的生硬；“石”虽未在本节重复，却是已明确的语境信息。
- source_word: וָאַשְׁלִכֵם
  choice: 把它们……扔下去
  rationale: שלך意为投、扔。“扔下去”符合现代汉语，也表达从手中向下掷出的动作，不采用较古雅的“掷下”。
- source_word: מֵעַל שְׁתֵּי יָדָי
  choice: 从双手中
  rationale: 原文直译近于“从我的两手之上”。“从双手中”在中文里自然，并保留原文对两只手的明确强调；主语已经是“我”，无须重复“我的”。
- source_word: וָאֲשַׁבְּרֵם
  choice: 把它们摔碎了
  rationale: שׁבר基本义为打破、折断。结合前面的扔下动作和石版的材质，“摔碎”自然呈现语境中很可能发生的破碎结果，同时用脚注保留较宽泛的译法。
- source_word: לְעֵינֵיכֶם
  choice: 在你们眼前
  rationale: 这是表示当着某人面、在其亲眼见证之下的惯用语；“在你们眼前”既贴近希伯来语意象，也符合现代中文表达。
theological_decisions: []
