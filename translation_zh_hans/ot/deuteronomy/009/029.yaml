base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/029.yaml
  text: But they are your people and your inheritance[b][a], whom you brought out by your great power and by your outstretched arm.
translation:
  language: zh_hans
  text: 但[a]他们是你的子民，是你的产业；你曾用你的大能和伸出的膀臂[b]把他们领出来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们是你的子民，是你的产业。”希伯来语连接词也可以只表示一般的承接；正文的“但”体现摩西恳求中的转折语气。
    reason: lexical_alternative
  - marker: b
    text: “伸出的膀臂”是出埃及叙事中常用的表达，描绘上主施展大能、拯救他的子民。
    reason: cross_reference
lexical_decisions:
- source_word: וְהֵם
  choice: 但他们是
  rationale: וְ可表示一般连接，也可依语境带有转折意味。这里摩西在恳求上主不要毁灭以色列之后，以“但”自然呈现申辩中的对比，同时用脚注保留“他们是”的可能。
- source_word: עַמְּךָ
  choice: 你的子民
  rationale: עַם在此指属于上主的群体；“子民”既自然庄重，也能表达此处的关系意味，而不把它弱化为一般的“民族”。
- source_word: וְנַחֲלָתֶךָ
  choice: 你的产业
  rationale: נַחֲלָה可指承受之业、分得之业或所属产业。“产业”保留其归属和盟约语境中的意味，也符合汉语圣经表达。
- source_word: אֲשֶׁר הוֹצֵאתָ
  choice: 你曾……把他们领出来
  rationale: הוֹצֵאתָ是יצא的使役式，表示使其出来；“领出来”在汉语中自然地表达上主带领以色列出离的行动。“曾”点明这是先前已经发生的拯救。
- source_word: בְּכֹחֲךָ הַגָּדֹל
  choice: 用你的大能
  rationale: 介词בְּ在此表示手段；כֹּחַ加גָּדוֹל直指强大的能力。“大能”简洁、庄重，并贴近原文。
- source_word: וּבִזְרֹעֲךָ הַנְּטוּיָה
  choice: 和伸出的膀臂
  rationale: 保留זְרוֹעַ的身体意象以及נְטוּיָה“伸出的”含义，使出埃及叙事中惯用的拯救图像不被抽象化。
theological_decisions:
- issue: 上帝行动的拟人化表达
  choice: 保留“伸出的膀臂”这一具体意象。
  alternative: 意译为“你大能的作为”或“你施展的大能”。
  rationale: 原文刻意采用身体意象来描绘上主施行拯救的力量；直译能保存其文学力度和出埃及传统中的神学关联，而不是把意象化为抽象概念。
- issue: נַחֲלָה所表达的归属关系
  choice: 译为“产业”。
  alternative: 译为“基业”“所有物”或“承受之业”。
  rationale: 摩西在此以以色列属于上主这一关系作为恳求依据。“产业”既保留归属意味，也不额外界定这种关系的具体神学机制。
- issue: 句首וְ的逻辑关系
  choice: 正文译作转折性的“但”。
  alternative: 译作一般连接的“而”或不明示连接词。
  rationale: 上下文中摩西刚恳求上主不要毁灭百姓，转折读法能自然呈现申辩语气；然而希伯来语连接词本身也可仅表示连接，因此以脚注保留其歧义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“子民”“产业”“大能”“伸出的膀臂”保留经文的盟约归属与出埃及意象；句式调整为自然汉语，但未消解句首连接词的语义歧义。
