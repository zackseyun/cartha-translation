  text: וְֽ/אֶת חַטַּאתְ/כֶ֞ם אֲשֶׁר עֲשִׂיתֶ֣ם אֶת הָ/עֵ֗גֶל לָקַחְתִּי֮ וָ/אֶשְׂרֹ֣ף אֹת֣/וֹ בָּ/אֵשׁ֒ וָ/אֶכֹּ֨ת אֹת֤/וֹ טָחוֹן֙ הֵיטֵ֔ב עַ֥ד אֲשֶׁר דַּ֖ק לְ/עָפָ֑ר וָֽ/אַשְׁלִךְ֙ אֶת עֲפָר֔/וֹ אֶל הַ/נַּ֖חַל הַ/יֹּרֵ֥ד מִן הָ/הָֽר־־־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/021.yaml
  text: And I took your sin[a], the calf that you had made, and burned it with fire; then I crushed it, grinding it thoroughly until it was as fine as dust, and I threw its dust into the stream that comes down from the mountain.
translation:
  language: zh_hans
  text: 我拿了你们的罪，就是你们造的那头牛犊，用火焚烧；又把它捣碎，彻底磨细，直到细如尘土，然后把它的尘末扔进从山上流下来的溪流[a]里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “溪流”或译“旱溪”。希伯来语נחל可指溪流、急流的河床，或季节性干涸的河谷。
    reason: 保留נחל的地貌与水文含义范围；虽然上下文描述水从山上流下，该词本身并不只指常年有水的小溪。
lexical_decisions:
- source_word: חַטַּאתְכֶם
  choice: 你们的罪
  rationale: 此处以“罪”直接指称牛犊这件偶像，希伯来文随后以“你们造的那牛犊”作同位说明；保留这种严厉而突出的认定，不弱化为“犯罪之物”，也不误译为“赎罪祭”。
- source_word: הָעֵגֶל
  choice: 那牛犊
  rationale: עֵגֶל通常指牛犊；加“那”自然地指向上下文中已经提及的金牛犊。
- source_word: וָאֶשְׂרֹף אֹתוֹ בָּאֵשׁ
  choice: 用火焚烧
  rationale: 保留“以火/在火中烧”的具体表达；“焚烧”在现代中文中庄重、清楚。
- source_word: וָאֶכֹּת אֹתוֹ
  choice: 把它捣碎
  rationale: 动词本义涉及击打；结合随后研磨的动作，“捣碎”既体现击打方式，也交代粉碎结果。
- source_word: טָחוֹן הֵיטֵב
  choice: 彻底磨细
  rationale: טָחוֹן说明以研磨方式继续处理，הֵיטֵב加强动作程度；“彻底磨细”自然呈现其过程与完全性。
- source_word: עַד אֲשֶׁר דַּק לְעָפָר
  choice: 直到细如尘土
  rationale: 表现研磨达到极细、如尘土一般的程度，并保留原文由动作推进到结果的结构。
- source_word: עֲפָרוֹ
  choice: 它的尘末
  rationale: 指牛犊被磨碎后的细末；“尘末”比“灰烬”更宽泛，避免将其限定为燃烧后的灰，同时与前句“尘土”相呼应。
- source_word: הַנַּחַל
  choice: 溪流
  rationale: נחל可指溪流、急流的河道或旱溪；正文采用普通读者最易理解且符合此处有水流动语境的“溪流”，以脚注保留其范围。
- source_word: הַיֹּרֵד מִן הָהָר
  choice: 从山上流下来的
  rationale: 分词描写水流从山而下的持续状态；“流下来”在中文中比直译“下来”更明确自然。
theological_decisions:
- issue: 牛犊被直接称为以色列人的“罪”
  choice: 你们的罪，就是你们造的那牛犊
  alternative: 你们所造的罪物，就是那牛犊
  rationale: 原文以“你们的罪”和“你们造的那牛犊”构成同位关系，刻意把偶像本身称作他们的罪。正文保留这种神学分量，不将其解释性地软化。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“就是”清楚标示同位关系；“焚烧—捣碎—磨细—撒进”保留原文连续、强烈的动作推进。脚注标记置于“溪流”之后，与其所解释的词直接对应。
