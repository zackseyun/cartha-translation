  naturalness: 语体总体庄重、清楚。修订后以“那头牛犊”使名词短语更合乎现代汉语习惯，并以“扔进”更自然、准确地表达“投掷进水道”，避免“撒进”可能暗示有意撒布而非投掷。
  terminology: “罪”“牛犊”“焚烧”“尘末”均恰当；不应将“罪”改作“赎罪祭”或软化为单纯“罪物”。“溪流”可作正文用词，脚注适当说明נחל也可指旱溪、急流河床或季节性河谷。
