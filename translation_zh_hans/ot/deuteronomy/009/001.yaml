base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/001.yaml
  text: 'Hear[a], Israel: today you are crossing the Jordan to go in to dispossess nations greater and mightier than you[b], with cities great and fortified up to the heavens.'
translation:
  language: zh_hans
  text: 以色列啊，你要听！今天你要过约旦河，进去占领[a]比你更大、更强的列国；那里有又大又坚固的城邑，城墙高耸入天[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“得为业”或“占有”。这里的希伯来语动词可指取得并占有产业；在征服的语境中，也含有使原有居民失去占有的意思。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译为“在天上”，是形容城防极高的夸张说法。
    reason: cultural_note
lexical_decisions:
- source_word: שְׁמַע
  choice: 你要听
  rationale: 译出单数命令式及申命记中庄重的呼召语气；“你”把以色列作为一个整体来称呼。
- source_word: עֹבֵר הַיּוֹם
  choice: 今天你要过
  rationale: 分词与“今天”连用，表示当前即将发生的行动；此译法自然地保留时间重点。
- source_word: אֶת־הַיַּרְדֵּן
  choice: 约旦河
  rationale: 采用现代汉语中通行的地名形式；补出“河”符合汉语习惯。
- source_word: לָבֹא
  choice: 进去
  rationale: 承接“过约旦河”，表达进入那地的方向意义。
- source_word: לָרֶשֶׁת
  choice: 赶走
  rationale: ירשׁ在征服语境中可指夺取产业并使原有居民失去占有；因其宾语是“列国”，正文用“赶走”最合乎汉语搭配，同时以脚注保留“占有、得为业”的词义范围。
- source_word: גּוֹיִם
  choice: 列国
  rationale: 指各个民族政治群体；“列国”庄重、清楚，并符合申命记语域。
- source_word: גְּדֹלִים וַעֲצֻמִים מִמֶּךָּ
  choice: 比你更大、更强
  rationale: 分别保留两个比较形容词所表达的规模或地位与力量，并保留以色列和列国之间的直接比较。
- source_word: עָרִים גְּדֹלֹת וּבְצֻרֹת
  choice: 城邑又大又坚固
  rationale: “城邑”适合庄重叙事语体；“又大又坚固”清楚表达城市规模及防御状况。
- source_word: בַּשָּׁמָיִם
  choice: 高耸入天
  rationale: 保留希伯来文“在天上／直达天上”的夸张意象，同时使中文表达自然。
theological_decisions:
- issue: 如何表达城防“在天上”的夸张描述
  choice: 高耸入天
  alternative: 高得仿佛直达天空；城墙高可参天
  rationale: 不把这一修辞性意象弱化为单纯的“非常高”，也不将其误解为关于城邑实际位于天上的陈述。
- issue: ירשׁ在征服语境中的含义
  choice: 正文译为“赶走”，脚注说明也可译为“占有”或“得为业”
  alternative: 占领；得为业
  rationale: 直接宾语为“列国”，因此“赶走”较符合本句句法和征服语境；脚注保留该词关于取得并占有产业的语义张力，避免将词义缩窄为单一解释。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“以色列啊，你要听”保留盟约呼召的力度；分号使“列国”与其城邑的描述关系清楚。脚注标记已放在各自实际说明的词语之后，以免沿用咨询层中错置的标记。
