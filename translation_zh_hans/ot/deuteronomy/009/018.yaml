  text: וָֽ/אֶתְנַפַּל֩ לִ/פְנֵ֨י יְהוָ֜ה כָּ/רִאשֹׁנָ֗ה אַרְבָּעִ֥ים יוֹם֙ וְ/אַרְבָּעִ֣ים לַ֔יְלָה לֶ֚חֶם לֹ֣א אָכַ֔לְתִּי וּ/מַ֖יִם לֹ֣א שָׁתִ֑יתִי עַ֤ל כָּל חַטַּאתְ/כֶם֙ אֲשֶׁ֣ר חֲטָאתֶ֔ם לַ/עֲשׂ֥וֹת הָ/רַ֛ע בְּ/עֵינֵ֥י יְהוָ֖ה לְ/הַכְעִיסֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/018.yaml
  text: Then I fell down before Yahweh[a], as at the first, forty days and forty nights; I ate no bread and drank no water, because of all your sin that you had committed by doing what was evil in the sight of Yahweh, provoking him to anger.
translation:
  language: zh_hans
  text: 我就照先前那样[a]俯伏在雅威面前四十昼夜；我不吃饼，也不喝水，因你们所犯的一切罪，就是行雅威眼中看为恶的事，惹他发怒。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “照先前那样”也可译作“像起初那样”“像先前一样”或“像从前一样”。希伯来语这一短语回指摩西先前在雅威面前俯伏的四十昼夜。
    reason: 说明比较短语כָּרִאשֹׁנָה的可行译法及其回指先前四十昼夜的含义。
lexical_decisions:
- source_word: וָאֶתְנַפַּל
  choice: 我又……俯伏
  rationale: התנפל在此描写摩西伏在上帝面前代求的姿态；“俯伏”既保留身体动作，也符合现代汉语的庄重语体。句首的“又”承接叙事，并表明这是再次发生的行动。
- source_word: לִפְנֵי יְהוָה
  choice: 在雅威面前
  rationale: לִפְנֵי表示在某者面前或临在中；“在……面前”直接保留其空间与关系含义。
- source_word: כָּרִאשֹׁנָה
  choice: 像起初那样
  rationale: 该比较短语回指摩西先前四十昼夜在雅威面前的经历；译文保留其回指性，而不强行限定为某一确切次数。
- source_word: אַרְבָּעִים יוֹם וְאַרְבָּעִים לַיְלָה
  choice: 四十昼夜
  rationale: 这是自然、凝练的汉语表达，完整传达“四十日和四十夜”的时长。
- source_word: לֶחֶם לֹא אָכַלְתִּי
  choice: 不吃饼
  rationale: 原文明确使用לֶחֶם“饼、食物”，这里译作“饼”以保留具体词义，不泛化为“什么也不吃”。
- source_word: וּמַיִם לֹא שָׁתִיתִי
  choice: 也不喝水
  rationale: 直接对应原文，并以“也”自然连接前一否定分句。
- source_word: עַל כָּל חַטַּאתְכֶם
  choice: 因为你们犯了这一切罪
  rationale: עַל在此说明俯伏禁食的缘由；译作“因为”自然清楚。חַטָּאת虽为单数形式，却带集合意义，汉语“一切罪”可传达这一点。
- source_word: לַעֲשׂוֹת הָרַע בְּעֵינֵי יְהוָה
  choice: 做雅威眼中看为恶的事
  rationale: 保留“在……眼中”的评价性意象，同时用“看为恶”使现代汉语表达完整自然。
- source_word: לְהַכְעִיסוֹ
  choice: 惹他发怒
  rationale: הכעיס为使役形式，表示使某者动怒；“惹他发怒”保留使役含义，又不额外判定这里只强调目的还是结果。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。采用“雅威”作为YHWH的现代汉语音译，保留其作为盟约神名的性质，避免以称号代替专名。
- issue: לְהַכְעִיסוֹ的目的或结果色彩
  choice: 惹他发怒
  alternative: 为要激怒他；以致他发怒
  rationale: 希伯来语不定式可带目的、结果或对行为的进一步说明；简洁译为“惹他发怒”，保留这种张力，不把它单一定为蓄意目的或纯粹结果。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“俯伏”“四十昼夜”保持经文语体的凝练；“不吃饼，也不喝水”保留原文的具体措辞。脚注标记置于其实际说明的“像起初那样”之后。
