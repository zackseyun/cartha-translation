base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/006.yaml
  text: So know that it is not because of your righteousness that Yahweh your God is giving you this good land to possess[a], for you are a stiff-necked people.
translation:
  language: zh_hans
  text: 所以你当知道，并不是因你的义，耶和华你的上帝把这美地赐给你为业[a]；因为你是颈项刚硬的百姓。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“占有它”。希伯来语动词可以表示承受产业；但在《申命记》中常包含取得并占有土地的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדַעְתָּ
  choice: 所以你要知道
  rationale: 该形式在上下文中具有劝告、命令意味；וְ承接上文的论证，在汉语中用“所以”自然表达推论关系。
- source_word: לֹא בְצִדְקָתְךָ
  choice: 并不是因为你的义
  rationale: 介词בְ在此表示根据或缘由；译作“因为”明确否定以色列自身的义是得地的依据，同时保留“义”的圣经伦理和盟约语义。
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: 耶和华你的上帝
  rationale: 以“耶和华”音译神名，并按希伯来语第二人称单数保留盟约性的称呼“你的上帝”。
- source_word: נֹתֵן לְךָ
  choice: 把……赐给你
  rationale: 分词在此表达当前或即将实现的赐予行动；“赐给”既自然，也体现土地作为上帝恩赐的语境。
- source_word: הָאָרֶץ הַטּוֹבָה הַזֹּאת
  choice: 这片美地
  rationale: 保留指示词及对土地美好的评价；“美地”是简洁、庄重且易懂的现代汉语表达。
- source_word: לְרִשְׁתָּהּ
  choice: 占有
  rationale: ירשׁ在申命记中常指取得并持有应许之地；“占有”兼顾领受产业与实际取得土地的含义。
- source_word: עַם קְשֵׁה עֹרֶף
  choice: 硬着颈项的百姓
  rationale: 保留希伯来语身体隐喻及其顽梗、抗拒的意味，不直接化约为解释性的“顽固”。
theological_decisions:
- issue: 以色列得地的原因
  choice: 明确否定以色列自身的义是耶和华赐地的根据。
  alternative: 弱化为一般性的谦卑劝告。
  rationale: 原文直接把“不是因为你的义”与上帝赐地及以色列的顽梗并置；译文保留这种盟约中的不配与恩赐之间的张力，不扩展为本节未明说的完整教义。
- issue: 集体性的第二人称单数
  choice: 以汉语单数“你”指作为整体的以色列，并用“百姓”作集合名词。
  alternative: 扩写为“你们”。
  rationale: 希伯来语以第二人称阳性单数向以色列整体说话；保留“你”可体现其集体单数的修辞特点。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“并不是因为你的义”将否定焦点清楚落在得地的根据上；“硬着颈项”保留原文生动的惯用隐喻。
