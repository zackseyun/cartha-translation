  yaml_path: translation/ot/deuteronomy/002/027.yaml
  text: Let me pass through your land; I will go only by the road[a]. I will not turn aside to the right or to the left.
translation:
  language: zh_hans
  text: 请让我经过你的国土；我只沿着道路走[a]，不向右或向左偏离。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“沿着路，沿着路”，用重复加强语气，表示以色列人会严格沿着道路前行。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶעְבְּרָה
  choice: 请让我……经过
  rationale: 第一人称单数祈愿式在这里表达外交语境中的请求；加“请”自然传达礼貌恳求，而非单纯将来时。
- source_word: בְאַרְצֶךָ
  choice: 从你的国土经过
  rationale: 介词 בְ 与 עבר 连用，表示穿越对方领土；“从……经过”符合现代汉语表达，“国土”也适合对君王发言的语境。
- source_word: בַּדֶּרֶךְ בַּדֶּרֶךְ
  choice: 只沿大路走
  rationale: 原文重复“在路上，在路上”以加强语气，表示严格不离路线；正文用“只”体现强调，并以脚注保留原文形式。“大路”不把含义过度限定为现代公路。
- source_word: אֵלֵךְ
  choice: 走
  rationale: הלך 在行旅语境中表示行走、前行；与“沿大路”搭配时，“走”简明自然。
- source_word: לֹא אָסוּר
  choice: 不偏向
  rationale: סור 表示从道路偏离；“不偏向”既保留路径意象，又能自然连接后面的左右方向。
- source_word: יָמִין וּשְׂמֹאול
  choice: 向右……向左
  rationale: 保留希伯来文固定的方向表达，明确表示无论哪一边都不偏离。
