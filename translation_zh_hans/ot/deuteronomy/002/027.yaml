  source_fidelity: 整体准确传达了祈愿式的礼貌请求、穿越领土、重复所表达的严格循路，以及不向两侧偏离。惟“大路”较容易指宽阔的主干道路，而דֶּרֶךְ本身只指“路／道路”，不宜增添道路等级；“不偏向右，也不偏向左”也可更明确表达从路线偏离的动作。
