  text: Then Sihon came out to meet us[a], he and all his people[b], for battle at Jahaz.
translation:
  language: zh_hans
  text: 于是，西宏和他的全体民众都出来，在雅杂迎战我们。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: 出来
  rationale: 叙事中的过去时动作；“出来”自然表达西宏从所在地出动。
- source_word: סִיחֹן
  choice: 西宏
  rationale: 采用现代中文圣经中较通行的人名音译。
- source_word: לִקְרָאתֵנוּ
  choice: 迎战我们
  rationale: 字面可作“来迎接我们”，但与“交战”的军事语境结合时显然表示敌对相遇；“迎战我们”既自然又保留迎面而来的含义。
- source_word: הוּא וְכָל עַמּוֹ
  choice: 西宏和他的全体民众
  rationale: 独立代词重申主语，随后包括他的全部民众；不用“军队”，以免把עַם的范围无根据地缩窄。
- source_word: לַמִּלְחָמָה
  choice: 交战
  rationale: 表达出动的目的，即进行战斗；与中文“在雅杂交战”搭配自然。
- source_word: יָהְצָה
  choice: 雅杂
  rationale: 采用该地名在现代中文圣经中的常见译名。
