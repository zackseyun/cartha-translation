reference: Deuteronomy 2:14
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/הַ/יָּמִ֞ים אֲשֶׁר הָלַ֣כְנוּ מִ/קָּדֵ֣שׁ בַּרְנֵ֗עַ עַ֤ד אֲשֶׁר עָבַ֨רְנוּ֙ אֶת נַ֣חַל זֶ֔רֶד שְׁלֹשִׁ֥ים וּ/שְׁמֹנֶ֖ה שָׁנָ֑ה עַד תֹּ֨ם כָּל הַ/דּ֜וֹר אַנְשֵׁ֤י הַ/מִּלְחָמָה֙ מִ/קֶּ֣רֶב הַֽ/מַּחֲנֶ֔ה כַּ/אֲשֶׁ֛ר נִשְׁבַּ֥ע יְהוָ֖ה לָ/הֶֽם־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/014.yaml
  text: And the days that we traveled from Kadesh-barnea until we crossed the Wadi Zered were thirty-eight years[a], until the entire generation of the men of war had come to an end from the midst of the camp, just as Yahweh had sworn to them.
translation:
  language: zh_hans
  text: 我们从加低斯·巴尼亚出发，直到渡过撒烈谷，共经过了三十八年[a]；到那时，那一代所有能打仗的男子都已从营中消失了，正如耶和华向他们所起的誓。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “撒烈谷”也可译作“撒烈溪”。希伯来语这个词可指旱谷、季节性河道或溪流。
    reason: 保留 נַחַל 的地貌语义范围，避免把其具体形态定得过窄。
lexical_decisions:
- source_word: וְהַיָּמִים אֲשֶׁר הָלַכְנוּ
  choice: 我们……共经过了……年
  rationale: 希伯来文直译为“我们行走的日子”，在此表达旅程持续的时间；汉语用“共经过了三十八年”自然地保留时长含义。
- source_word: מִקָּדֵשׁ בַּרְנֵעַ
  choice: 从加低斯·巴尼亚出发
  rationale: 采用现代中文常见圣经地名译法；“出发”补足汉语行程表达，但不增添实质信息。
- source_word: עַד אֲשֶׁר עָבַרְנוּ
  choice: 直到渡过
  rationale: עבר用于水道时表示越过或渡过；“渡过”符合此处穿越谷地水道的语境。
- source_word: נַחַל זֶרֶד
  choice: 撒烈谷
  rationale: נַחַל可指旱谷、河谷、季节性水道或溪流；“谷”较符合当地地貌，同时以脚注保留“溪”的可能。
- source_word: שְׁלֹשִׁים וּשְׁמֹנֶה שָׁנָה
  choice: 三十八年
  rationale: 按现代汉语规范表达数词。
- source_word: עַד תֹּם
  choice: 到那时……灭尽了
  rationale: תֹּם表达完结、耗尽；结合受审判的一代，用“灭尽”准确传达他们从营中完全消失，且与上下文的死亡含义一致。
- source_word: כָּל הַדּוֹר אַנְשֵׁי הַמִּלְחָמָה
  choice: 那一代所有能打仗的男子
  rationale: 保留“整代”和明确的男性所指；“能打仗的男子”比生硬的“战争之人”更符合现代汉语，也贴合军事年龄群体。
- source_word: מִקֶּרֶב הַמַּחֲנֶה
  choice: 从营中
  rationale: 简洁表达“从营地当中”，保留这些人从群体中消失的意思。
- source_word: כַּאֲשֶׁר נִשְׁבַּע יְהוָה לָהֶם
  choice: 正如耶和华向他们所起的誓
  rationale: 保留明确的起誓语言，并按中文圣经传统将四字神名译作“耶和华”，而非以称号替代。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。现代简体中文普通读者最熟悉“耶和华”；此译法保留专名功能，不以“主”消解神名。
- issue: אַנְשֵׁי הַמִּלְחָמָה 的性别和群体范围
  choice: 能打仗的男子
  alternative: 战士
  rationale: 希伯来文明确为阳性复数，并在上下文指受审判的军事年龄男子；译文保留这一限定，不将其泛化为全体百姓。
- issue: תֹּם 所表达的结局
  choice: 灭尽
  alternative: 消失／终结
  rationale: 上下文表明该世代因审判而死亡。“灭尽”保留严肃的审判意味，但不额外说明死亡方式。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。以分号呈现原文从旅程时长转向受审判世代结局的结构；避免逐字照搬“日子”造成汉语不自然，也不淡化起誓、审判和男性群体等原文要素。
