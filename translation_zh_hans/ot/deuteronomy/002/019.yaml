  text: וְ/קָרַבְתָּ֗ מ֚וּל בְּנֵ֣י עַמּ֔וֹן אַל תְּצֻרֵ֖/ם וְ/אַל תִּתְגָּ֣ר בָּ֑/ם כִּ֣י לֹֽא אֶ֠תֵּן מֵ/אֶ֨רֶץ בְּנֵי עַמּ֤וֹן לְ/ךָ֙ יְרֻשָּׁ֔ה כִּ֥י לִ/בְנֵי ל֖וֹט נְתַתִּ֥י/הָ יְרֻשָּֽׁה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/019.yaml
  text: When you come opposite the sons of Ammon[a], do not harass them or provoke them, for I will not give you any of the land of the sons of Ammon as a possession[c][b], because I have given it as a possession to the sons of Lot.
translation:
  language: zh_hans
  text: 当你来到亚扪人[a]对面时，不可侵扰他们，也不可向他们挑衅，因为我不会把亚扪人的土地分给你作产业[b]；我已经把那地赐给罗得的子孙作产业。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“亚扪之子”；本节下同。
    reason: 说明原文民族称谓所含的亲属表达。
  - marker: b
    text: “产业”也可译作“承受之地”。
    reason: 保留יְרֻשָּׁה兼有产业与承受所得土地的词义范围。
lexical_decisions:
- source_word: וְקָרַבְתָּ מוּל
  choice: 当你接近……的时候
  rationale: קָרַב表示临近，מוּל带有面对、来到对面的空间意味；汉语用“接近”自然表达整体动作，又不擅自理解为已经进入其领土。
- source_word: בְּנֵי עַמּוֹן
  choice: 亚扪人
  rationale: 该短语字面为“亚扪之子”，在这里是民族称谓；现代汉语译作“亚扪人”清楚自然，也保留其族裔含义。
- source_word: אַל תְּצֻרֵם
  choice: 不可侵扰他们
  rationale: 此处צור表示敌对施压，含义可能比正式围城更广；“侵扰”既保留宽泛性，也符合行军语境。
- source_word: וְאַל תִּתְגָּר בָּם
  choice: 也不可与他们争战
  rationale: גרה的hitpael形式在此指挑起或投入敌对冲突；“与他们争战”自然呈现军事语境，又不额外加入目的成分。
- source_word: מֵאֶרֶץ בְּנֵי עַמּוֹן
  choice: 亚扪人的土地
  rationale: 否定句中的מִן具有部分义，即不把其中任何土地赐给以色列；汉语在“不把……土地分给你”的结构中已自然表达这一点。
- source_word: יְרֻשָּׁה
  choice: 产业
  rationale: 该词可指承受所得的土地、产业或所有地；“产业”适合土地分配语境，并保留所赐恒业的色彩。
- source_word: לִבְנֵי לוֹט
  choice: 给罗得的子孙
  rationale: 这里指罗得的后裔；汉语“子孙”比字面“儿子们”更准确地传达民族世系。
- source_word: נְתַתִּיהָ
  choice: 我已经把那地赐给
  rationale: 完成式表示已经确立且仍然有效的赐予；“已经……赐给”清楚表达其既成状态。
theological_decisions:
- issue: 亚扪土地权属的表达
  choice: 神已将那地赐给罗得的子孙作产业
  alternative: 仅说亚扪人当前占有那地
  rationale: 原文明确把土地权属追溯到神已经完成的赐予，因此译文保留这一神圣授予，而不弱化为单纯的现实占领。
- issue: 民族称谓中בְּנֵי的处理
  choice: “亚扪人”与“罗得的子孙”按语境分别处理
  alternative: 两处一律直译为“……之子”
  rationale: בְּנֵי עַמּוֹן是固定民族称谓，译作“亚扪人”自然；בְּנֵי לוֹט则承担说明祖源的作用，译作“罗得的子孙”可保留亲属与世系重点。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“侵扰”保留第一项禁令的宽泛敌对含义，“争战”呈现第二项禁令的军事语境；避免把前者过窄地译成“围困”，也不额外加入原文没有明说的“挑衅他们开战”。
