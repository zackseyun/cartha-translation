base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/001.yaml
  text: Then we turned and set out for the wilderness by the way of the Red Sea[a], just as Yahweh had spoken to me, and we went around Mount Seir for many days.
translation:
  language: zh_hans
  text: 于是，我们转向，向旷野出发，走红海[a]的路，正如雅威对我所说的；我们绕着西珥山走了许多日子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“芦苇海”。希伯来语名称Yam Suph可较直译为此。
    reason: 保留יַם־סוּף的字面词汇可能性，同时在正文采用传统且读者熟悉的地名“红海”。
lexical_decisions:
- source_word: וַנֵּפֶן
  choice: 于是，我们转身
  rationale: פנה的Qal叙事形式表示转向或改变方向；“于是”体现连续叙事，“转身”不额外加入“返回”的含义。
- source_word: וַנִּסַּע הַמִּדְבָּרָה
  choice: 向旷野出发
  rationale: נסע在行旅语境中常指拔营启程；מִדְבָּר所带的方向词尾表示朝向旷野，故译为自然的现代汉语“向旷野出发”。
- source_word: דֶּרֶךְ יַם סוּף
  choice: 沿着通往红海[a]的路
  rationale: דֶּרֶךְ表示道路或路线；此处是经由或朝向יַם־סוּף的路线。“通往……的路”既符合地理行程，也避免让“取道红海”被误解为直接穿越海中。יַם־סוּף的传统地名译法保留为“红海”，字面替代译法收入脚注。
- source_word: כַּאֲשֶׁר דִּבֶּר יְהוָה אֵלַי
  choice: 正如雅威对我所说的
  rationale: כַּאֲשֶׁר表达“正如”；דבר אל表示“对……说话”。汉语“所说的”自然表达该话语先于本节行动。神名יְהוָה音译为“雅威”。
- source_word: וַנָּסָב אֶת־הַר שֵׂעִיר
  choice: 我们绕着西珥山走
  rationale: סבב在此指绕行；结合上下文连续的第一人称复数行动，译作“我们绕着……走”。הַר שֵׂעִיר采用通行地名“西珥山”，同时不把动作强化为完全环绕一周。
- source_word: יָמִים רַבִּים
  choice: 许多日子
  rationale: 这是表示持续时间的短语；直译“许多日子”保留原文具体表达，不解释性地改成“很长时间”。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名。正文以现代汉语音译“雅威”保留其作为专名的性质，而不以“主”这一称号替代；“耶和华”是传统汉译形式，但较不贴近通常重建的读音。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。句法按汉语行程叙述调整，但保留原文的动作次序、第一人称复数视角、神名以及“许多日子”的具体措辞。脚注标记[a]已置于正文对应词后。
