  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֵלַ֗/י אֶל תָּ֨צַר֙ אֶת מוֹאָ֔ב וְ/אַל תִּתְגָּ֥ר בָּ֖/ם מִלְחָמָ֑ה כִּ֠י לֹֽא אֶתֵּ֨ן לְ/ךָ֤ מֵֽ/אַרְצ/וֹ֙ יְרֻשָּׁ֔ה כִּ֣י לִ/בְנֵי ל֔וֹט נָתַ֥תִּי אֶת עָ֖ר יְרֻשָּֽׁה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/009.yaml
  text: And Yahweh said to me[a], “Do not harass Moab or provoke them to war, for I will not give you any of its land as a possession[b], because I have given Ar to the sons of Lot as a possession.”
translation:
  language: zh_hans
  text: 雅威对我说：“不可侵扰摩押，也不可向他们挑起战争[a]，因为我不会把摩押土地的任何一部分赐给你作产业[b]；我已把亚珥赐给罗得的子孙作产业。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不可压迫摩押，也不可与他们交战。”
    reason: צרר和גרה在此可分别侧重敌对的压迫与投入战斗；原文容许这一较直译的理解。
  - marker: b
    text: 本节两处“作产业”也可译作“作基业”。
    reason: יְרֻשָּׁה既可指归人持有的产业，也可突出承受所得的基业。
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文四字神名的常见现代汉语音译处理，保留其作为专名的性质，不以称号替代。
- source_word: אֶל תָּצַר
  choice: 不可侵扰
  rationale: צרר在此禁令中表示敌对地施压、侵逼或骚扰；“侵扰”自然简洁，并与下句公开战争的禁令有所区分。
- source_word: מוֹאָב
  choice: 摩押
  rationale: 采用现代中文圣经传统中通行的专名译法。
- source_word: וְאַל תִּתְגָּר בָּם מִלְחָמָה
  choice: 也不可向他们挑起战争
  rationale: גרה的反身词干结合“战争”可表示激起敌对行动或与对方开战；此译保留主动挑起战事的语气。
- source_word: מֵאַרְצוֹ
  choice: 他们土地的任何一部分
  rationale: 介词מִן在语境中有部分义，即连一部分土地也不赐；单数后缀所指的摩押是集体，中文依语境用“他们”衔接。
- source_word: יְרֻשָּׁה
  choice: 作产业
  rationale: 该词指获分配而持有的土地产业，也带承受产业的含义；“产业”在现代中文中清楚，并可在本节两处一致使用。
- source_word: לִבְנֵי לוֹט
  choice: 罗得的子孙
  rationale: 希伯来文直译为“罗得的众子”，此处实际指其后裔；“子孙”既保留族谱表达，又避免误解为仅限亲生儿子。
- source_word: עָר
  choice: 亚珥
  rationale: 采用该摩押地名的通行中文音译。
theological_decisions:
- issue: 四字神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用神的专名；“雅威”依较通行的学术重构音译该名，避免以“主”这一称号取代，也不采用源自较晚混合读音的“耶和华”。
- issue: יְרֻשָּׁה所表达的土地身份
  choice: 产业
  alternative: 基业
  rationale: 原词兼有持有之产业与承受之份的意味；正文用普通读者较易理解的“产业”，并以脚注保留“基业”这一传统且强调承受意味的译法。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。句式保留两项禁令及两次因果说明；专名使用通行简体中文译名，神名则按原文专名音译为“雅威”。
