base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/033.yaml
  text: And Yahweh our God gave him over to us[a], and we struck him down[b], along with his sons and all his people.
translation:
  language: zh_hans
  text: 雅威——我们的神——把他交给了我们[a]；我们击杀了他、他的儿子[b]和他所有的百姓。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“在我们面前”；在战争语境中，意思是雅威把他交在我们手中。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文辅音文本作“他的儿子”。鉴于上下文，许多人将其理解为集合意义，或译作“他的众子”。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּתְּנֵהוּ ... לְפָנֵינוּ
  choice: 把他交给了我们
  rationale: נתן与לְפָנֵינוּ连用，处于交战语境时表示把敌人交在以色列的权下；译作“把他交给了我们”既自然，也保留“交付”的核心意象。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以常见的现代汉语音译呈现四字神名，而不以称号代替专名。
- source_word: אֱלֹהֵינוּ
  choice: 我们的神
  rationale: 准确表达第一人称复数所属形式，并与“雅威”构成同位说明。
- source_word: וַנַּךְ
  choice: 我们击杀了
  rationale: נכה在战争叙事中可指击倒并杀死；“击杀”比单纯“击打”更符合本段战果陈述，同时比“消灭”少一层扩大解释。
- source_word: בנו
  choice: 他的众子
  rationale: 辅音文本表面可按单数理解，但在这里通常按集合性或复数所指理解；正文采用符合战事清单语境的“众子”，并以脚注保留文本问题。
- source_word: כָּל עַמּוֹ
  choice: 他的全体百姓
  rationale: עַם的直接含义是“人民、百姓”；不限定为“军队”，以免加入原文未明确表达的范围。
theological_decisions:
- issue: 四字神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用神的专名；音译“雅威”能保留其专名性质，而不以“主”这一称号替代。
- issue: 神将西宏交付与以色列及以色列实施击杀之间的张力
  choice: 并列保留神的交付与以色列的行动
  alternative: 将前半句弱化为神仅仅允许战事发生
  rationale: 原文先说雅威交付，后说“我们击杀”，同时陈述神的主权行动和以色列的实际行动；译文不对二者关系作额外解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事用语。“击杀”保留战争语境中的力度；“全体百姓”不擅自缩窄为军队。脚注标记紧随各自所说明的词语。
