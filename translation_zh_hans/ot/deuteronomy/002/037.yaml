source:
  edition: WLC
  text: רַ֛ק אֶל אֶ֥רֶץ בְּנֵי עַמּ֖וֹן לֹ֣א קָרָ֑בְתָּ כָּל יַ֞ד נַ֤חַל יַבֹּק֙ וְ/עָרֵ֣י הָ/הָ֔ר וְ/כֹ֥ל אֲשֶׁר צִוָּ֖ה יְהוָ֥ה אֱלֹהֵֽי/נוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/037.yaml
  text: Only you did not come near the land of the sons of Ammon[a], all along the bank of the Jabbok, and the cities of the hill country[c][b], and all that Yahweh our God had commanded.
translation:
  language: zh_hans
  text: 只是，亚扪子孙之地[a]、雅博河沿岸的任何地方[b]、山区的城邑，以及耶和华我们上帝所吩咐的一切[c]，你都没有靠近。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“亚扪人的地”。直译“亚扪子孙之地”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译近似“雅博河谷的整只手”；“手”在这里是习语，指河流或河谷的一侧、岸边或邻近地带。
    reason: cultural_note
  - marker: c
    text: 原文直译“以及耶和华我们上帝所吩咐的一切”，没有明说所吩咐的对象；上下文可能指与不可接近之区域有关的命令。
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: 只是
  rationale: 标明这是对前文征服范围的限制或例外；“只是”简洁自然，并保留转折限制语气。
- source_word: אֶל אֶרֶץ בְּנֵי עַמּוֹן
  choice: 亚扪人的地
  rationale: 用现代汉语的族群名称表达“亚扪子孙之地”，正文清楚自然，字面结构另见脚注。
- source_word: לֹא קָרַבְתָּ
  choice: 你没有靠近
  rationale: 保留קרב的空间意义，不直接解释成“攻击”或“侵占”；第二人称单数按希伯来文保留，以集体方式指以色列。
- source_word: כָּל יַד נַחַל יַבֹּק
  choice: 雅博河沿岸的任何地方
  rationale: יַד用于水道时是指其一侧、岸边或邻近地带；在否定句中，כָּל自然表达“任何地方”。
- source_word: וְעָרֵי הָהָר
  choice: 山区的城
  rationale: הָהָר在这里指山地或高地地区，而非一座特定的山；“城”对应עָרֵי。
- source_word: וְכֹל אֲשֶׁר צִוָּה
  choice: 以及……所吩咐的一切地方
  rationale: 原文省略了所吩咐之事的具体内容；依上下文补出“地方”，但以脚注说明原文的省略和可能含义。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的专名“耶和华”呈现四字神名，而不以头衔代替。
- source_word: אֱלֹהֵינוּ
  choice: 我们上帝
  rationale: 直接保留第一人称复数所属关系及立约语境中的称谓。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 耶和华
  alternative: 雅威；主
  rationale: 原文直接使用以色列上帝的专名；正文采用现代简体中文圣经语境中广为人知的“耶和华”，避免以“主”这一头衔取代专名。
- issue: 末句省略成分的理解
  choice: 所吩咐的一切地方
  alternative: 禁止我们靠近的一切地方；所吩咐的一切
  rationale: 上下文表明该命令限定以色列不可接近的区域，但希伯来文没有明说“禁止”或“靠近”。正文只按语境补出“地方”，脚注保留原文的简略与解释空间。
translation_notes:
  register: 采用庄重而易懂的现代标准普通话。“靠近”刻意保留原文的空间表达，不扩大为军事行动；“包括”使后列区域与“亚扪人的地”的关系在汉语中清楚。全节保留摩西对以色列整体所用的第二人称单数“你”。
