revisions:
- from: 耶和华对我说：“看，我已经开始把西宏和他的土地交到你手中[a]。你要开始占领他的土地，取得它为业[b]。”
  to: 雅威对我说：“看，我已经开始把西宏和他的土地交到你手中[a]。你要开始取得他的土地为业[b]。”
  rationale: 修订以“雅威”对应原文的专名及英语 POB 的 Yahweh。末句改为“开始取得他的土地为业”，避免“占领……取得它为业”的汉语重复和不必要的军事化细分，同时通过脚注保留希伯来文同词根重复所产生的强调。脚注 a 保留“在你面前”的字面信息，且锚点置于其所说明的“交到你手中”之后。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T04:57:10Z'
