base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/031.yaml
  text: And Yahweh said to me[a], “See, I have begun to give Sihon and his land over to you[b]. Begin to take possession of his land.”
translation:
  language: zh_hans
  text: 雅威对我说：“看，我已经开始把西宏和他的土地交到你手中[a]。你要开始取得他的土地为业[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “交到你手中”原文直译为“交在你面前”；这里指把西宏和他的土地置于你的掌控之下。
    reason: lexical_alternative
  - marker: b
    text: 原文在“开始”之后连续使用同一个表示“取得、占有”的动词词根，以加强语气；也可译作“你要开始占有他的土地”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代汉语圣经读者熟悉的专名形式音译四字神名，保留其作为上帝名字而非称号的性质。
- source_word: רְאֵה
  choice: 看
  rationale: 该命令式在此用于唤起注意；“看”简洁自然，并保留直接语气。
- source_word: הַחִלֹּתִי
  choice: 我已经开始
  rationale: 使役词形在此惯用义为“开始”；完成式表明行动已经启动并正在推进。
- source_word: תֵּת
  choice: 交到
  rationale: 基本义为“给”；结合战争与权力转移的语境，“交到你手中”自然传达置于以色列掌控之下的含义。
- source_word: לְפָנֶיךָ
  choice: 你手中
  rationale: 字面为“你面前”，此处语境指交由对方掌控；正文采用自然汉语表达，字面形式在脚注说明。
- source_word: הָחֵל
  choice: 开始
  rationale: 与前面的“我已经开始”形成有意的呼应：耶和华已经开始交付，以色列也应开始行动。
- source_word: רָשׁ
  choice: 占领
  rationale: ירש在申命记的土地语境中常指实际取得、占有土地；“占领”在此清楚呈现征服行动。
- source_word: לָרֶשֶׁת
  choice: 取得它为业
  rationale: 与前面的命令式同出一根，构成强调性的重复；“取得它为业”既保留重复推进，也体现持续占有土地的含义，而不强行译成另一个不同的希伯来动作。
- source_word: אַרְצוֹ
  choice: 他的土地
  rationale: 此处指西宏统治的领土；“土地”是清楚而宽泛的现代汉语表达。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用上帝的专名。正文采用现代简体中文圣经语境中最广为人知的音译“耶和华”，不以“主”等称号替代，也不借此加入宗派性解释。
- issue: 取得土地的双重动词表达
  choice: 占领他的土地，取得它为业
  alternative: 占有他的土地
  rationale: 原文连续使用同一词根 ירש，既有强调作用，也保留征服与得地为业之间的张力；译文避免把第二个动词明确解释为“赶走居民”，因为原文本句并未另用“赶出”的动词。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“看”保留原文唤起注意的命令语气；“交到你手中”避免生硬直译；末句用两个近义短语呈现希伯来文同词根重复所带来的强调，同时保持可读性。
