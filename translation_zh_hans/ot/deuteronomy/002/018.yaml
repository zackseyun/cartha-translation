base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/018.yaml
  text: You are crossing today the border of Moab at Ar[a].
translation:
  language: zh_hans
  text: 你今天正从亚珥越过摩押的边界。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你今天正越过摩押的边界，即亚珥。”希伯来文在“亚珥”前再次使用直接宾语标记；这可能表示“亚珥”与“摩押的边界”构成同位关系，也可能指明越过边界的地点。
    reason: 句法与词义的另一种可能
lexical_decisions:
- source_word: אַתָּה
  choice: 你
  rationale: 第二人称阳性单数代词；摩西以单数形式把以色列作为一个整体来称呼。中文“你”保留了这一修辞形式。
- source_word: עֹבֵר
  choice: 要越过
  rationale: Qal主动分词与独立代词连用，描述眼前正在发生或即将发生的行动；结合行程语境，“要越过”比单纯“越过”更自然，同时不把时间推得过远。
- source_word: הַיּוֹם
  choice: 今天
  rationale: 常用时间副词，直译为“今天”，保留原文的时间强调。
- source_word: גְּבוּל
  choice: 边界
  rationale: 指摩押地域的界线；“边界”在现代汉语中清楚、自然，也避免把它扩大解释为整个“领土”。
- source_word: מוֹאָב
  choice: 摩押
  rationale: 采用中文圣经传统中通行的专名译法。
- source_word: עָר
  choice: 亚珥
  rationale: 地名，采用中文圣经传统中通行的音译。
- source_word: אֶת ... אֶת
  choice: 摩押的边界，就是亚珥
  rationale: 原文在“摩押的边界”和“亚珥”前重复直接宾语标记，可能表示同位关系。“就是”明确呈现这种可能，同时以脚注保留地点关系的另一种理解。
theological_decisions:
- issue: 对以色列使用单数称呼
  choice: 保留单数“你”
  alternative: 译作“你们”或补出“你以色列”
  rationale: 希伯来文以阳性单数称以色列这个群体。保留“你”可维持原文把全体视为一个整体的修辞，不作解释性扩展。
- issue: “亚珥”与“摩押的边界”的句法关系
  choice: 正文按同位关系译为“就是亚珥”
  alternative: 译为“在亚珥那里越过摩押的边界”
  rationale: 重复的直接宾语标记支持同位理解，但该结构也可被理解为指明越境地点；正文与脚注共同保留这种真实的句法歧义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“越过边界”符合行程语境；“亚珥”沿用通行专名译法。正文保留单数称呼，并用脚注说明原文中同位关系与地点关系之间的歧义。
