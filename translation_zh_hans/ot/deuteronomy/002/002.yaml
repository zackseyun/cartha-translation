  yaml_path: translation/ot/deuteronomy/002/002.yaml
  text: Then Yahweh said to me[a], saying,
translation:
  language: zh_hans
  text: 于是，雅威对我说[a]：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译：“于是，雅威对我说，说。”末尾的“说”用来引出下一节的话；现代汉语正文以冒号表达这一功能。
    reason: 说明原文 לֵאמֹר 的字面形式及其在汉语中的自然表达。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 于是……说
  rationale: 前置的 waw 连续式推动叙事向前；“于是”自然表达事件的承接，同时保留普通的言说动词“说”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 这是上帝的专名四字神名，而非称号；采用现代汉语中可辨识的音译“雅威”，不以“主”替代。
- source_word: אֵלַי
  choice: 对我
  rationale: 介词 אֶל 加第一人称单数词尾，意为“对我／向我”；在“说”的结构中，“对我”最自然。
- source_word: לֵאמֹר
  choice: 冒号
  rationale: 该不定式引出下一节的直接引语。现代汉语通常不重复译作“说”，而用冒号自然、完整地体现其引语导入功能；脚注保留其字面形式。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名。译作“雅威”旨在保留其专名性质，并较直接地反映学界通常重构的读音；“耶和华”是汉语传统中广为人知的另一音译，列为可选译法而不在正文并列。
translation_notes:
  register: 采用现代、简洁而庄重的叙事语言。“于是”承接上文，“对我说”符合当代普通话习惯；以冒号连接下一节的直接引语，避免不自然的“说，说”。
