- from: 至于住在村落[b]、远至迦萨的亚卫人[a]，从迦斐托出来的迦斐托人灭绝了他们，并住在他们的地方。
  to: 至于住在村落中、一直到迦萨的亚卫人[a]，从迦斐托出来的迦斐托人灭绝了他们，并住在他们原来的地方。
  rationale: 仅作两处安全的文体调整：使“直到迦萨”明确表示居住区域的延伸，并以“原来的地方”自然表达原文“在他们的位置上”的替代含义。保留所有专名、毁灭力度及脚注内容；脚注b仍对应正文“村落”。
