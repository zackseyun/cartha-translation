    issue: 地理范围短语的汉语修饰关系不够顺畅。
    rationale: “住在村落、远至迦萨的”缺少使“远至迦萨”明确修饰居住分布范围的连接成分；加入“中、一直到”可提升可读性而不改变原意。
  - severity: low
