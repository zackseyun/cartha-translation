  yaml_path: translation/ot/deuteronomy/002/023.yaml
  text: As for the Avvim[a], who lived in villages as far as Gaza, the Caphtorim, who came out from Caphtor[b], destroyed them and settled in their place.
translation:
  language: zh_hans
  text: 至于住在村落中、一直到迦萨的亚卫人[a]，从迦斐托出来的迦斐托人灭绝了他们，并住在他们原来的地方。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “亚卫人”是族名的音译，也可音译为“亚维人”。
    reason: transliteration_alternative
lexical_decisions:
- source_word: הָעַוִּים
  choice: 亚卫人
  rationale: 这是族群名称，采用现代中文圣经读者较熟悉的音译，并用“人”明确表示族群。
- source_word: הַיֹּשְׁבִים
  choice: 住在
  rationale: ישב在此表示居住；“住在”自然、清楚，也保留定居含义。
- source_word: בַּחֲצֵרִים
  choice: 在村落
  rationale: חֲצֵרִים可指无城墙的村庄、聚落或居住点；正文采用自然的“村落”，脚注保留其较宽泛的语义范围。
- source_word: עַד עַזָּה
  choice: 远至迦萨
  rationale: עַד标明地域延伸的界限；“远至迦萨”简洁地表达“直到／一直到迦萨”。
- source_word: כַּפְתֹּרִים
  choice: 迦斐托人
  rationale: 族名按专名音译，并加“人”表示该族群。
- source_word: הַיֹּצְאִים מִכַּפְתּוֹר
  choice: 从迦斐托出来的
  rationale: 保留יצא所表达的“出来”这一移动意象，不仅泛化为“来自”。
- source_word: הִשְׁמִידֻם
  choice: 灭绝了他们
  rationale: שׁמד的使役形在此表示毁灭、除灭一个族群；“灭绝”保留原文的强烈程度。
- source_word: וַיֵּשְׁבוּ תַחְתָּם
  choice: 并住在他们的地方
  rationale: 直译ישב与תחתם的居住和取代含义；措辞清楚表达迦斐托人接替原居民而居住。
