    rationale: תַחְתָּם表示在他们的位置上、取代他们；“他们原来的地方”以自然中文保留这一含义。
  revised_text: 至于住在村落中、一直到迦萨的亚卫人[a]，从迦斐托出来的迦斐托人灭绝了他们，并住在他们原来的地方。
  revised_footnotes:
