review_pass:
  verdict: revise
  source_fidelity: 正文准确传达了原文的族名、居住地范围、从迦斐托出来、毁灭，以及取代原居民居住等关系。“灭绝”恰当反映הִשְׁמִידֻם的强烈毁灭语义；“从迦斐托出来”也保留了יָצָא的移动意象。
  naturalness: 现有“住在村落、远至迦萨的亚卫人”中“远至迦萨”修饰关系略显生硬，容易暂时读成亚卫人本身“远至”某处。改为“住在村落中、一直到迦萨的亚卫人”更符合现代汉语，同时不缩窄地理范围。“住在他们的地方”可明确为“住在他们原来的地方”，使替代关系自然清楚。
  terminology: “亚卫人”“迦斐托人”“迦斐托”“迦萨”均为可接受且与中文圣经传统相协调的专名形式。脚注保留“亚维人”这一可行的异译；“村落”及其脚注也恰当地保留חֲצֵרִים的语义弹性。
  issues:
