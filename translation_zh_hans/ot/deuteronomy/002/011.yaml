  yaml_path: translation/ot/deuteronomy/002/011.yaml
  text: They too were considered Rephaim[a], like the Anakim; but the Moabites call them Emim.
translation:
  language: zh_hans
  text: 他们也像亚衲人一样，被算作利乏音人[a]；摩押人却称他们为以米人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “利乏音人”或译“巨人”，但这里的希伯来语更自然的理解是保留一个古代族群的名称。
    reason: lexical_alternative
lexical_decisions:
- source_word: רְפָאִים
  choice: 利乏音人
  rationale: 按古代族群名称音译，避免在正文中解释性地译作“巨人”；本节首先是在给这一群体归类。
- source_word: יֵחָשְׁבוּ
  choice: 被算作
  rationale: 保留尼法勒式的被动含义，表达他们被归入某一类群；现代汉语自然且简洁。
- source_word: אַף הֵם
  choice: 他们也
  rationale: 表达补充和包含的强调，即这一群体同样被归入前述类别。
- source_word: כָּעֲנָקִים
  choice: 像亚衲人一样
  rationale: 前缀כ表示比较；将亚衲人保留为古代族群名称。
- source_word: וְהַמֹּאָבִים
  choice: 摩押人却
  rationale: 连接词在此转向摩押人的本地称呼；“却”自然显出分类名称与当地名称之间的对照，但不强化为矛盾。
- source_word: יִקְרְאוּ לָהֶם
  choice: 称他们为
  rationale: 自然表达קרא ל的称名用法。
- source_word: אֵמִים
  choice: 以米人
  rationale: 按摩押人对该古代族群的称名音译；中文加“人”明确这是族群名称。
