revisions:
- from: 从前何利人住在西珥；以扫的子孙却夺取他们的地业，消灭他们，使他们从自己面前除去[a]，并住在他们的地方。以色列也照样对待耶和华赐给他们作产业的土地[b]。
  to: 从前，何利人住在西珥；以扫的子孙却取代了他们，从他们面前除灭他们，住在他们的位置上。以色列对耶和华赐给他们的他产业之地所做的也是这样[a][b]。
  rationale: 修订保留原文强烈的“取代／占有”和“除灭”措辞，不把有争议的历史比较解释为编注或加以协调。“从他们面前除灭他们”保留מִפְּנֵיהֶם的惯用表达；“以色列对……所做的也是这样”则忠实而自然地再现比较句。脚注改为只说明产业之地的可译性及单复数转换，且标记均有明确锚点。
