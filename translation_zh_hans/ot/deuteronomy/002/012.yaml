  text: וּ/בְ/שֵׂעִ֞יר יָשְׁב֣וּ הַ/חֹרִים֮ לְ/פָנִים֒ וּ/בְנֵ֧י עֵשָׂ֣ו יִֽירָשׁ֗וּ/ם וַ/יַּשְׁמִידוּ/ם֙ מִ/פְּנֵי/הֶ֔ם וַ/יֵּשְׁב֖וּ תַּחְתָּ֑/ם כַּ/אֲשֶׁ֧ר עָשָׂ֣ה יִשְׂרָאֵ֗ל לְ/אֶ֨רֶץ֙ יְרֻשָּׁת֔/וֹ אֲשֶׁר נָתַ֥ן יְהוָ֖ה לָ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/012.yaml
  text: And in Seir the Horites formerly lived[a], but the sons of Esau dispossessed them and destroyed them from before them, and settled in their place, just as Israel did to the land of his possession[c][b], which Yahweh gave to them.
translation:
  language: zh_hans
  text: 从前，何利人住在西珥；以扫的子孙却取代了他们，从他们面前除灭他们，住在他们的位置上。以色列对耶和华赐给他们的他产业之地所做的也是这样[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他产业之地”也可译为“他承受的地”或“他的继承之地”。原文以单数称“以色列”及“他的产业”，把以色列看作一个整体。
    reason: lexical_alternative
  - marker: b
    text: 原文随后说耶和华把这地赐给“他们”，由集合单数转为复数，指以色列众民。
    reason: grammatical_clarification
lexical_decisions:
- source_word: הַחֹרִים
  choice: 何利人
  rationale: 采用中文圣经传统中较为通行的族名译法，清楚表明这是居住在西珥的族群。
- source_word: לְפָנִים
  choice: 从前
  rationale: 此处是时间副词，指过去，而非空间上的“在……面前”。
- source_word: יִירָשׁוּם
  choice: 夺取他们的地业
  rationale: ירשׁ在占地语境中兼有取得土地与使原住民失去产业的含义；此译法结合上下文补出“地业”，避免误解为以扫后裔把何利人本身当作产业。
- source_word: וַיַּשְׁמִידוּם
  choice: 消灭他们
  rationale: 保留שׁמד强烈的毁灭意味，同时不额外断言超出经文措辞的细节。
- source_word: מִפְּנֵיהֶם
  choice: 使他们从自己面前除去
  rationale: 保留希伯来语“从他们面前”的意象，并以“除去”表达从其所在之处清除的惯用含义。
- source_word: תַּחְתָּם
  choice: 住在他们的地方
  rationale: 表达以扫后裔取代先前居民而定居，符合语境。
- source_word: כַּאֲשֶׁר עָשָׂה יִשְׂרָאֵל
  choice: 以色列也照样对待
  rationale: 自然表达比较关系，并保留经文把以色列视作集合整体的用法。
- source_word: לְאֶרֶץ יְרֻשָּׁתוֹ
  choice: 作产业的土地
  rationale: יְרֻשָּׁה兼具承受所得之产业与实际占有之地的含义；“产业”保留其盟约土地语汇，又不把意义限缩为一般继承。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文圣经读者最熟悉的专名形式，作为四字神名的音译性传统译法，而非仅以称号代替。
- source_word: לָהֶם
  choice: 赐给他们
  rationale: 保留原文由集合单数“以色列／他的产业”转为复数“他们”的数变化，所指为以色列众民。
theological_decisions:
- issue: “以色列也照样对待……土地”这一比较的历史参照
  choice: 按所传希伯来文本保留为既成行动的历史比较
  alternative: 将此句处理为后期编注，或改译以避免暗示以色列已经取得土地
  rationale: 原文直接将以扫后裔的行动与以色列对其产业之地所做的事相比。译文不替读者解决年代或来源问题，也不作和谐化处理。
- issue: 神名יהוה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 两者都旨在呈现神的专名；正文采用现代中文圣经传统中辨识度最高的“耶和华”，不以“主”这一称号取代专名。
translation_notes:
  register: 采用庄重而清晰的现代标准普通话。以分号和短句保持希伯来叙事的并列推进；“地业／产业”保留土地承受语境中的神学与法律色彩。所有脚注标记均已置于正文。
