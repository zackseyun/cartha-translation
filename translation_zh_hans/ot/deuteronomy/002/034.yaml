source:
  edition: WLC
  text: וַ/נִּלְכֹּ֤ד אֶת כָּל עָרָי/ו֙ בָּ/עֵ֣ת הַ/הִ֔וא וַֽ/נַּחֲרֵם֙ אֶת כָּל עִ֣יר מְתִ֔ם וְ/הַ/נָּשִׁ֖ים וְ/הַ/טָּ֑ף לֹ֥א הִשְׁאַ֖רְנוּ שָׂרִֽיד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/034.yaml
  text: At that time we captured all his cities[a], and we devoted to destruction every inhabited city, with the women and the little children. We left no survivor.
translation:
  language: zh_hans
  text: 那时，我们攻取了他的所有城邑，把每座城中的男子、妇女和幼童都尽行毁灭[a]，一个活口也没有留下。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “尽行毁灭”所译的希伯来语，含有把人或物列为当毁灭之物的意思；也可译作“置于毁灭的禁令之下”。
    reason: 说明חרם的特殊词义，避免只按一般的“毁灭”理解，同时不以生硬术语妨碍正文阅读。
lexical_decisions:
- source_word: וַנִּלְכֹּד
  choice: 我们攻取了
  rationale: לכד在军事语境中指夺取城邑；“攻取”既自然，又明确保留征战背景。
- source_word: כָּל עָרָיו
  choice: 他的所有城邑
  rationale: עיר可指城或城镇；“城邑”适合古代军事叙事，也保留כָּל所表达的全数范围。
- source_word: בָּעֵת הַהִוא
  choice: 那时
  rationale: 直接、自然地表达该时间短语，不作冗余扩展。
- source_word: וַנַּחֲרֵם
  choice: 都尽行毁灭
  rationale: חרם的使役形在此指将对象置于ḥerem之下、归于毁灭。“尽行毁灭”在正文中清楚可懂，并以脚注保留其特殊的禁毁含义。
- source_word: כָּל עִיר מְתִם
  choice: 每座城中的男子
  rationale: מְתִם指男性或男子，并与后面的妇女、幼童构成人群分类。“每座城中的男子”化解希伯来语的紧缩结构，同时不把性别明确的词泛化成“居民”。
- source_word: הַנָּשִׁים
  choice: 妇女
  rationale: 准确对应阴性复数名词，并与“男子、幼童”的列举保持协调。
- source_word: הַטָּף
  choice: 幼童
  rationale: טף指年幼的孩子或幼小家属；“幼童”比宽泛的“孩子”更明确，也符合庄重叙事语体。
- source_word: לֹא הִשְׁאַרְנוּ שָׂרִיד
  choice: 一个活口也没有留下
  rationale: שָׂרִיד指幸存者；“一个活口也没有留下”是现代汉语军事语境中自然而明确的表达，并保留绝无幸存者的力度。
theological_decisions:
- issue: 征服叙事中חרם的表达
  choice: 正文译为“尽行毁灭”，脚注说明其“列为当毁灭之物”的特殊含义
  alternative: 译为“列为当毁灭之物”或“置于禁令之下”
  rationale: 正文需明确呈现实际毁灭而不淡化暴力，同时脚注保留该词超出一般“杀灭”的禁毁或奉献性质；不加入对这一行为的后设神学辩护。
- issue: מְתִם的性别所指
  choice: 男子、妇女和幼童
  alternative: 居民，包括妇女和幼童
  rationale: 希伯来文以מְתִם、הַנָּשִׁים、הַטָּף分别列举男子、妇女和幼童；译文保留这种区分，不将明确的男性所指中性化。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“攻取”“城邑”适合古代战争背景；“一个活口也没有留下”清楚呈现原文的绝对表述。正文不回避男子、妇女和幼童全部被毁灭的严厉内容，也不添加解释或辩护。
