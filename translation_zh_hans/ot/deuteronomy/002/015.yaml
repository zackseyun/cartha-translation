  to: 并且，雅威的手也临到他们，使他们在营中惊惶失措，直到他们灭尽。[a]
  rationale: 修订保留原文的附加强调（“并且……也”）、神名和“手”的形象，以及审判导致该群体终结的结果。“临到他们”在汉语中比“手攻击他们”自然，并在此上下文中仍表达不利的神圣行动；“惊惶失措”较好对应 המם 的使人恐慌、混乱之意。
