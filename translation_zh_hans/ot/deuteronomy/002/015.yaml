  naturalness: “雅威的手也攻击他们”可理解，但“手攻击”在汉语中略不自然；“雅威的手也临到他们”更合乎汉语习惯，同时仍保留原文的拟人习语。将“溃乱”改为“惊惶失措”更自然、清楚。
