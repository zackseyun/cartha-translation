base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/015.yaml
  text: Moreover[a], the hand of Yahweh was against them[b], to throw them into confusion from the midst of the camp until they were finished off.
translation:
  language: zh_hans
  text: 并且，雅威的手也临到他们，使他们在营中惊惶失措，直到他们灭尽。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “使他们惊惶失措”也可译作“使他们混乱”或“击溃他们”；“直到他们灭尽”也可译作“直到他们都消亡”或“直到他们灭亡”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: 并且……也
  rationale: 保留连接上文的附加和强调作用；现代汉语中自然顺畅。
- source_word: יַד יְהוָה
  choice: 雅威的手
  rationale: 保留希伯来语以“手”表示神大能与行动的具体习语，并将神名 יְהוָה 音译为“雅威”。
- source_word: בָם
  choice: 攻击他们
  rationale: 在“雅威的手”这一结构中，בָם 表示敌对行动所指向的对象；“攻击他们”明确表达其不利、审判性的作用。
- source_word: לְהֻמָּם
  choice: 使他们……溃乱
  rationale: המם 的使役形式可指使人惊惶、混乱或溃败；“溃乱”兼顾混乱和败散的语义，又不直接把它等同于死亡。
- source_word: מִקֶּרֶב הַמַּחֲנֶה
  choice: 在营中
  rationale: 结合“使他们溃乱”译成自然汉语，表示这一行动发生在营地内部；希伯来语 מִן 也可与除去、灭绝的结果相连。
- source_word: עַד תֻּמָּם
  choice: 直到他们灭尽
  rationale: 表达该群体走到尽头、完全消失的结果；“灭尽”符合本段审判语境，同时保持简洁庄重。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；采用“雅威”作为较贴近通行学术重构读音的现代汉语音译，不以称号替代专名。
- issue: 神的“手”与审判行动
  choice: 保留“雅威的手”这一拟人性习语
  alternative: 意译为“雅威的大能”或“雅威亲自”
  rationale: 保留原文形象及其神学张力，让上下文说明这是神主动施行审判，而不将隐喻提前解释掉。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体；保留“雅威的手”这一希伯来语形象，并以“溃乱”呈现 המם 所含惊惶、混乱与败散之间的语义幅度。
