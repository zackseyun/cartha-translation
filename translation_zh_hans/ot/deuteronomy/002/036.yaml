  text: מֵֽ/עֲרֹעֵ֡ר אֲשֶׁר֩ עַל שְׂפַת נַ֨חַל אַרְנֹ֜ן וְ/הָ/עִ֨יר אֲשֶׁ֤ר בַּ/נַּ֨חַל֙ וְ/עַד הַ/גִּלְעָ֔ד לֹ֤א הָֽיְתָה֙ קִרְיָ֔ה אֲשֶׁ֥ר שָׂגְבָ֖ה מִמֶּ֑/נּוּ אֶת הַ/כֹּ֕ל נָתַ֛ן יְהוָ֥ה אֱלֹהֵ֖י/נוּ לְ/פָנֵֽי/נוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/036.yaml
  text: From Aroer[a], which is on the edge of the Arnon Valley, and the city that is in the valley, as far as Gilead, there was no town too high for us; Yahweh our God gave all of it before us.
translation:
  language: zh_hans
  text: 从位于亚嫩河谷边的亚罗珥和谷中的那座城，直到基列，没有一座城高到我们无法攻取[a]；耶和华——我们的上帝——把这一切都交给了我们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“没有一座城高过我们”；这里以“高”比喻城防坚固或难以接近。也可译作“没有一座城强大得使我们攻不下”或“没有一座城是我们无法接近的”。
    reason: 说明 שָׂגְבָה מִמֶּנּוּ 的字面空间隐喻及其军事语境中的不同译法。
lexical_decisions:
- source_word: מֵעֲרֹעֵר
  choice: 从亚罗珥
  rationale: 前缀 מִן 标明地理范围的起点；“从亚罗珥”自然、准确。
- source_word: שְׂפַת נַחַל אַרְנֹן
  choice: 亚嫩谷边
  rationale: שָׂפָה 表示“边、岸”；נַחַל 在此指峡谷或谷地。“谷边”既保留地貌含义，也适合现代汉语。
- source_word: וְהָעִיר אֲשֶׁר בַּנַּחַל
  choice: 以及谷中的城
  rationale: 按原文保留简单并列关系，不额外补入“从”或判定该城的具体身份。
- source_word: וְעַד הַגִּלְעָד
  choice: 直到基列
  rationale: עַד 标明地理范围的终点；“直到”简洁清楚。
- source_word: קִרְיָה
  choice: 城
  rationale: 该词可指城镇；本段处于攻城语境，现代汉语用“城”自然且不必夸大规模。
- source_word: שָׂגְבָה מִמֶּנּוּ
  choice: 高得使我们攻不下
  rationale: 保留 שׂגב 的“高”这一空间隐喻，同时以“攻不下”传达此处防御坚固、难以攻取的语境意义。
- source_word: אֶת־הַכֹּל
  choice: 这一切
  rationale: 集合性地指前述整个地区及其中诸城；“这一切”保留原文整体性的表达。
- source_word: יְהוָה אֱלֹהֵינוּ
  choice: 耶和华我们的上帝
  rationale: 以现代中文圣经读者熟悉的“耶和华”音译四字神名，并直译后接“我们的上帝”。
- source_word: לְפָנֵינוּ
  choice: 交在我们面前
  rationale: 保留“在我们面前”的希伯来语意象；“交”体现征服语境中使其落入以色列人掌控的含义。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用神的专名。中文正文采用广为人知且庄重的“耶和华”，不以“主”替代专名；“雅威”是另一种较贴近学术重构读音的译法。
- issue: “高过我们”这一军事隐喻的处理
  choice: 高得使我们攻不下
  alternative: 比我们高／我们无法接近／强大得使我们攻不下
  rationale: 原文直言没有城“高过我们”，在语境中可表示城防高峻、坚固或难以接近。正文保留“高”的隐喻并补明其军事效果，脚注列出语义可能性，避免把它仅限定为一种抽象的“强大”。
translation_notes:
  register: 采用庄重、清晰的现代标准普通话。“亚嫩谷边的那城，以及谷中的城”尽量保存原文略显压缩的地理并列结构，不擅自确认两者关系；分号呈现地理陈述与神学总结之间的转折。
