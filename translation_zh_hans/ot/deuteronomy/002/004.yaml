base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/004.yaml
  text: And command the people[a], saying, ‘You are about to pass through the territory of your brothers, the sons of Esau, who live in Seir; and they will be afraid of you[c][b]. So be very careful.’
translation:
  language: zh_hans
  text: “你要吩咐百姓说：‘你们正要经过[a]你们弟兄——住在西珥的以扫子孙——的领地[b]；他们必惧怕你们。你们务要格外谨慎[c]。’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“你们正在经过”，或“你们将要经过”。这里的希伯来语分词可表示即将发生的行动。
    reason: lexical_alternative
  - marker: b
    text: 或译“边界”。希伯来语词既可指边界线，也可指边界以内的地域。
    reason: lexical_alternative
  - marker: c
    text: 原文在“他们必惧怕你们”和“你们务要格外谨慎”之间只用连接词，亦可按上下文译作“因此，你们务要格外谨慎”。
    reason: ambiguity
lexical_decisions:
- source_word: צַו
  choice: 吩咐
  rationale: 这是צוה的命令式，表示权威性的指示。“吩咐”在现代中文中自然庄重，并保留摩西奉命向百姓下达命令的语气。
- source_word: הָעָם
  choice: 百姓
  rationale: עם在这里集合性地指以色列民；“百姓”符合申命记语境，也比“民族”更自然。
- source_word: אַתֶּם עֹבְרִים
  choice: 你们正要经过
  rationale: 独立代词加分词在本语境中表示即将发生的行动；“正要经过”既体现临近性，也不把语法可能性限定为单纯现在时或将来时。
- source_word: בִּגְבוּל
  choice: 领地
  rationale: גְּבוּל可指边界，也可指边界以内的地域。行程语境下“领地”最通顺，同时以脚注保留“边界”的可能。
- source_word: אֲחֵיכֶם בְּנֵי עֵשָׂו
  choice: 你们弟兄，就是以扫子孙
  rationale: 直译并保留以色列与以东之间刻意突出的亲属关系；“就是”清楚表达“以扫子孙”对“弟兄”的同位说明。
- source_word: הַיֹּשְׁבִים בְּשֵׂעִיר
  choice: 住在西珥
  rationale: ישב的分词表示定居、居住；“住在”是清楚自然的现代汉语。
- source_word: וְיִירְאוּ מִכֶּם
  choice: 必惧怕你们
  rationale: ירא与מן连用，在此表示因以色列人而害怕；“必惧怕你们”保留未完成式在语境中的预告意味。
- source_word: וְנִשְׁמַרְתֶּם מְאֹד
  choice: 因此，你们务要格外谨慎
  rationale: שמר的Nifal形式在此有反身意味，即谨慎自守；“务要格外谨慎”自然表达命令语气和מְאֹד的强调。连接词按上下文译为“因此”，也在脚注中保留与前句并列相接的理解。
theological_decisions:
- issue: 对以东人的亲属称谓
  choice: 你们弟兄，就是以扫子孙
  alternative: 你们的亲族，就是以扫的后裔
  rationale: 原文以“弟兄”说明以色列与以东的家族关系，并以“以扫子孙”进一步界定其身份。保留“弟兄”可呈现这项约束以色列行为的重要亲属关系，而不将其弱化为一般族群称谓。
- issue: 谨慎命令与以东人惧怕之间的关系
  choice: 因此，你们务要格外谨慎
  alternative: 他们必惧怕你们；你们务要格外谨慎
  rationale: 上下文支持将谨慎理解为以对方惧怕为缘由的警戒，但希伯来语只用普通连接词וְ，未明确标出因果。因此正文采用合乎语境的“因此”，脚注保留较少解释性的并列读法，避免消除原文张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事与训令语体。“吩咐”“务要”“惧怕”保留经文的权威和严肃感，但句法仍符合现代普通话。以“你们弟兄，就是以扫子孙”保留原文同位结构及亲属语言；三个脚注分别说明时态体意义、地理词义及连接关系的真实歧义。
