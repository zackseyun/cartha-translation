base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/020.yaml
  text: That also is considered a land of the Rephaim[a]; Rephaim lived in it formerly[b], but the Ammonites call them Zamzummim.
translation:
  language: zh_hans
  text: 那地也算是利乏音人之地[a]；从前利乏音人[b]住在那里，亚扪人称他们为散送冥人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译为“利乏音人的土地”。
    reason: lexical_alternative
  - marker: b
    text: “利乏音人”可能指一个古老族群，传统上认为他们身材高大；有些译本在这里译作“巨人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶרֶץ רְפָאִים
  choice: 利乏音人之地
  rationale: אֶרֶץ意为“地、土地”，与族名רְפָאִים连用，表示利乏音人居住或所属之地。汉语没有冠词，因此不强行区分英语中的定指与不定指。
- source_word: תֵּחָשֵׁב
  choice: 被视为
  rationale: חשׁב的尼法勒形在此表示“被看作、被算作”；“被视为”自然且保留被动含义。
- source_word: אַף הִוא
  choice: 那地也
  rationale: 该短语承接上文，把这片土地也列入同一类别；“那地也”符合现代汉语篇章衔接。
- source_word: רְפָאִים
  choice: 利乏音人
  rationale: 此处作为古代族群名称使用，并与亚扪人的另一称呼相对，因此采用音译，不直接解释为“巨人”。
- source_word: יָשְׁבוּ בָהּ
  choice: 住在那里
  rationale: ישׁב在此指居住；“住在那里”清楚自然，也准确表达阴性代词所指的那地。
- source_word: לְפָנִים
  choice: 从前
  rationale: 该副词表示早先的时期；“从前”简洁而符合现代汉语。
- source_word: וְהָעַמֹּנִים
  choice: 亚扪人
  rationale: וְ在这里连接后续分句。汉语用逗号并列即可自然呈现，无须添加可能强化对比的“但”。
- source_word: יִקְרְאוּ לָהֶם
  choice: 称他们为
  rationale: 未完成式在此表达惯常称谓；“称他们为”准确呈现命名关系，并可自然理解为沿用的称呼。
- source_word: זַמְזֻמִּים
  choice: 散送冥人
  rationale: 这是族群名称，采用汉语圣经传统中较易辨认的音译，并加“人”明确其为族名。
theological_decisions:
- issue: רְפָאִים应译作族名还是“巨人”
  choice: 正文音译为“利乏音人”
  alternative: 巨人
  rationale: 本节将叙述者的族名称谓与亚扪人的称谓并列，显示这里主要作为族名使用。正文保留音译可避免把有关其体格的传统理解直接写入经文，相关可能含义置于脚注。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。“被视为”保留原文被动含义；族名使用通行音译。分号呈现前半句对土地的归类与后半句历史说明之间的结构关系。
