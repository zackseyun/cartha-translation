base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/006.yaml
  text: You shall buy food from them with silver[a], so that you may eat; and you shall also buy water from them with silver, so that you may drink.
translation:
  language: zh_hans
  text: 你们要用银子向他们买食物吃，也要用银子向他们买水喝。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较形式化地译作：“你们要用银子向他们买食物，并且要吃；也要用银子向他们买水，并且要喝。”希伯来语用连接结构表达购买之后的食用和饮用，也可理解为购买的预期用途或结果。
    reason: 保留וַאֲכַלְתֶּם和וּשְׁתִיתֶם在目的、结果或顺承之间的语义张力。
lexical_decisions:
- source_word: אֹכֶל
  choice: 食物
  rationale: 这是泛指可吃之物或供应品，并不局限于谷物；“食物”在现代汉语中自然且范围相当。
- source_word: תִּשְׁבְּרוּ
  choice: 买
  rationale: שׁבר在此指付钱购买食物；“买”清楚、自然，并与本节的交易语境吻合。
- source_word: מֵאִתָּם
  choice: 向他们
  rationale: 表示取得食物和水的来源；汉语购买结构通常说“向他们买”，也显明不可强取。
- source_word: בַּכֶּסֶף
  choice: 用银子
  rationale: 保留כֶּסֶף的具体表达，而不泛化为“钱”；这里指以银子作为支付手段。
- source_word: וַאֲכַלְתֶּם
  choice: 吃
  rationale: 置于“买食物”之后，简洁表达购买后的预期用途或结果，同时不把希伯来语连接关系过度限定为单一逻辑类别。
- source_word: וְגַם
  choice: 也
  rationale: 引出与购买食物平行的第二项吩咐，保留其附加作用。
- source_word: מַיִם
  choice: 水
  rationale: 直接、自然的对应词。
- source_word: תִּכְרוּ
  choice: 买
  rationale: כּרה虽可有“挖掘”之义，但在“向他们”“用银子”以及与买食物平行的语境中，明确指付费取得。
- source_word: וּשְׁתִיתֶם
  choice: 喝
  rationale: 置于“买水”之后，表达购买后的预期用途或结果，并保持汉语自然简练。
theological_decisions:
- issue: 以东资源与付偿义务的伦理和法律效力
  choice: 明确吩咐以色列人用银子购买食物和水，而不是无偿取用。
  alternative: 可将后两个动词形式化译为“并且你们要吃……并且你们要喝”，但汉语较生硬。
  rationale: “向他们买”与“用银子”保留了经文的核心要求：合法付偿，不可强取。“买食物吃／买水喝”则自然呈现希伯来语中购买与随后食用、饮用之间的联系，却不强行判定连接词只能表示目的或只能表示顺承。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“买食物吃／买水喝”是自然的汉语连动结构，既简洁表达预期用途，又避免用“以便”把希伯来语的协调结构解释得过死。脚注标记置于整句末尾，覆盖两组平行结构。
