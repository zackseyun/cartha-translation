  text: And when all the men of war had finished dying from among the people,[a]
translation:
  language: zh_hans
  text: 当所有作战的男子都从百姓中死尽时，[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“所有战士”。希伯来文直译为“所有战争之人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַאֲשֶׁר
  choice: 当……以后
  rationale: וַיְהִי推进叙事，כַאֲשֶׁר引出时间从句；中文用“当……以后”自然表达前一事件完成、后一事件随即发生的关系。
- source_word: תַּמּוּ ... לָמוּת
  choice: 死尽
  rationale: תמם与“死”的不定式连用，表示死亡过程全部完成；“死尽”简洁保留完成和全体无一存留的语义，比“结束死亡”更符合现代汉语。
- source_word: כָּל
  choice: 所有
  rationale: 明确保留原文的全称量词。
- source_word: אַנְשֵׁי הַמִּלְחָמָה
  choice: 能征战的男子
  rationale: 原文字面为“战争之人”，指承担作战任务的成年男子；“能征战的男子”符合本段上下文，也保留男性和军事含义。
- source_word: מִקֶּרֶב הָעָם
  choice: 从百姓中
  rationale: 准确表达这些人从群体内部消亡；“百姓”自然对应此处作为集体的以色列民。
