base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/025.yaml
  text: Today I will begin to put the dread and fear of you on the face of the peoples under all the heavens[b][a], who will hear the report about you and will tremble and writhe because of you.
translation:
  language: zh_hans
  text: 今天，我要开始使普天下各族对你心生恐惧和畏惧。他们听见关于你的消息[a]，就必因你而战栗、痛苦扭动[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“听见你的名声”，或“听见关于你的传闻”。希伯来语这个词可指消息、传闻，或由此形成的名声。
    reason: lexical_alternative
  - marker: b
    text: 或译“陷入痛苦”，或“像产妇一样疼痛扭动”。希伯来语动词描绘强烈的身体痛苦。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיּוֹם הַזֶּה אָחֵל תֵּת
  choice: 今天，我要开始把……加在
  rationale: 保留“今天”和“开始给予／加上”的起始含义；“把……加在……身上”符合现代汉语搭配。
- source_word: פַּחְדְּךָ וְיִרְאָתְךָ
  choice: 对你的恐惧和畏惧
  rationale: 两个带第二人称后缀的名词在这里指各族因以色列而生的惧怕，不是以色列自身的恐惧；用两个近义词保留希伯来文的并列。
- source_word: עַל פְּנֵי הָעַמִּים
  choice: 加在……各族身上
  rationale: עַל־פְּנֵי在此表达临到各族；若直译为“在各族脸上”会在现代汉语中造成误解，因此以自然措辞传达其作用对象。
- source_word: תַּחַת כָּל הַשָּׁמָיִם
  choice: 普天下
  rationale: 这是现代汉语中自然、庄重的表达，传达“所有诸天之下／全天下”的范围。
- source_word: אֲשֶׁר יִשְׁמְעוּן שִׁמְעֲךָ
  choice: 他们听见关于你的消息
  rationale: שֵׁמַע可指消息、传闻或由此形成的名声；正文采用较宽泛的“消息”，并以脚注保留其他可能。
- source_word: וְרָגְזוּ
  choice: 战栗
  rationale: 传达因恐惧而震颤、发抖的含义，并保持庄重简洁。
- source_word: וְחָלוּ
  choice: 痛苦扭动
  rationale: 保留动词所带的强烈身体痛苦和扭动意象，同时不在正文中限定为产痛。
- source_word: מִפָּנֶיךָ
  choice: 因你而
  rationale: 该短语字面与“在你面前／从你面前”有关，此处主要说明他们战栗痛苦的缘由；“因你而”在汉语中清楚自然。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“普天下”保留经文语体但仍为当代读者熟悉；正文不生硬复制“在各族脸上”这一希伯来语意象，而以“加在……身上”准确传意。脚注标记分别紧随其所说明的“消息”和“痛苦扭动”。
