  language: zh_hans
  text: 你们绕这片山地已经够久了[a]；转向北方。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“这座山”。希伯来语הַר既可指一座山，也可指一片山地；这里较广的行程语境更支持译作“山地”。
    reason: lexical_alternative
lexical_decisions:
- source_word: רַב לָכֶם
  choice: 你们……已经够久了
  rationale: 该习语在这里表示某事持续得已经足够或过久；结合后面的“绕”，这样译既自然，也保留了催促停止现状的语气。
- source_word: סֹב
  choice: 绕
  rationale: 源自动词סבב，在此指绕行或环绕；汉语用“绕”简洁自然。
- source_word: הָהָר הַזֶּה
  choice: 这片山地
  rationale: הַר既可指一座山，也可指山区；本节处于以色列人行程的地理语境中，“这片山地”较贴切，同时以脚注保留另一种理解。
- source_word: פְּנוּ
  choice: 转向
  rationale: 这是复数命令式，在行程语境中指改变前进方向；“转向”准确而自然。
- source_word: לָכֶם
  choice: 不单独译出
  rationale: 命令式后的介词短语在此带有与受命者相关的语气，现代汉语若硬译成“为你们自己”会显得生硬，并可能误添强调。
- source_word: צָפֹנָה
  choice: 北方
  rationale: 词尾表示朝向某处的运动；与“转向”搭配后，“北方”已自然表达向北而行。
