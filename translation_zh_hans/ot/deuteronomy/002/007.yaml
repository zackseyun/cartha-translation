revisions:
- from: 因为雅威—你的上帝，在你手所做的一切事上赐福给你。他知道你走过这片大旷野的路程。[a] 这四十年来，雅威—你的上帝与你同在，你什么也没有缺少。
  to: 因为雅威——你的上帝，已经在你一切亲手所做的事上赐福给你。他知道你穿越这片大旷野的行程。[a] 这四十年间，雅威——你的上帝一直与你同在；你什么也没有缺少。
  rationale: 修订仅改善汉语表达并澄清“知道”与“行程”的句法关系：将“在你手所做的一切事上”改为“在你一切亲手所做的事上”，将“走过……的路程”改为“穿越……的行程”，并相应更新脚注引文。补出“一直”是为自然表达原文在“这四十年”时间范围内所隐含的持续同在，未增加超出语境的神学解释。
