  text: כִּי֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ בֵּֽרַכְ/ךָ֗ בְּ/כֹל֙ מַעֲשֵׂ֣ה יָדֶ֔/ךָ יָדַ֣ע לֶכְתְּ/ךָ֔ אֶת הַ/מִּדְבָּ֥ר הַ/גָּדֹ֖ל הַ/זֶּ֑ה זֶ֣ה אַרְבָּעִ֣ים שָׁנָ֗ה יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ עִמָּ֔/ךְ לֹ֥א חָסַ֖רְתָּ דָּבָֽר־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/007.yaml
  text: For Yahweh your God has blessed you in all the work of your hands[a]. He has known your walking through this great wilderness. These forty years Yahweh your God has been with you; you have lacked nothing.
translation:
  language: zh_hans
  text: 因为雅威——你的上帝，已经在你一切亲手所做的事上赐福给你。他知道你穿越这片大旷野的行程。[a] 这四十年间，雅威——你的上帝一直与你同在；你什么也没有缺少。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他知道你穿越……的行程”也可理解为“他一直留意、看顾你穿越这片大旷野的行程”。原文动词直译为“知道”，在这里可以含有关注、照料的意味。
    reason: 说明 יָדַע 的基本词义及其在本语境中可能包含的护理含义。
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 以常见的现代汉语音译呈现四字神名，保留其作为以色列上帝之专名的性质，不以称号代替。
- source_word: בֵּרַכְךָ
  choice: 赐福给你
  rationale: 保留 ברך 的宗教及盟约语义；结合上下文表达已经发生并持续具有意义的恩惠。
- source_word: בְּכֹל מַעֲשֵׂה יָדֶךָ
  choice: 在你手所做的一切事上
  rationale: 原文 יָדֶךָ 为单数“你的手”；译文保留具体的希伯来表达，同时在现代汉语中仍然清楚自然。
- source_word: יָדַע
  choice: 知道
  rationale: 保留 ידע 的基本词义“知道”，不在正文中直接扩展为“看顾”，以保存原文既可指知悉、又可在语境中暗含关怀的张力。
- source_word: לֶכְתְּךָ
  choice: 你走过……的路程
  rationale: 该形式源自动词“行走”，在这里指以色列经过旷野的行程；此译法兼顾词源形象和汉语可读性。
- source_word: אֶת הַמִּדְבָּר הַגָּדֹל הַזֶּה
  choice: 走过这片大旷野
  rationale: 宾格标记 אֶת 在此连接“行走”与旷野；汉语用“走过”自然表达穿行其间的意思。
- source_word: זֶה אַרְבָּעִים שָׁנָה
  choice: 这四十年来
  rationale: 按现代汉语习惯表达延续四十年的时间范围。
- source_word: עִמָּךְ
  choice: 与你同在
  rationale: 原文为介词短语，汉语补足“同在”，准确表达持续的神圣临在。
- source_word: לֹא חָסַרְתָּ דָּבָר
  choice: 你什么也没有缺少
  rationale: 自然呈现希伯来语“不缺任何事物”的全称否定，强调供应充足。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；采用“雅威”以音译专名，避免用“主”等称号取代，同时承认“耶和华”是汉语传统中的另一音译。
- issue: יָדַע 在本节是否明确译作护理性的“看顾”
  choice: 正文译“知道”，脚注说明可理解为“留意、看顾”
  alternative: 一直看顾
  rationale: 动词的基本义为“知道、认识”，语境可含密切关注和照料之意，但不宜在正文中把这一含义绝对化；脚注保存语境性替代解释。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“雅威—你的上帝”以破折号标明同位关系，避免误读；全节使用单数“你”，对应摩西对以色列整体的第二人称单数称呼。
