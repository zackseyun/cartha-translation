base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/028.yaml
  text: You may sell me food for silver[a], so that I may eat, and give me water for silver, so that I may drink[b]; only let me pass through on my feet—
translation:
  language: zh_hans
  text: 请卖给我食物，让我付银子吃；也请卖水给我，让我付银子喝。只要让我徒步经过——
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֹכֶל
  choice: 食物
  rationale: 这是泛指可吃的食物，并非专指粮食或饼；“食物”准确而自然。
- source_word: בַּכֶּסֶף
  choice: 付银子
  rationale: 希伯来语直译为“用／以银子”；在买卖语境中译作“付银子”，既保留具体的“银子”，也清楚表达付款之意。
- source_word: תַּשְׁבִּרֵנִי
  choice: 请把……卖给我
  rationale: שׁבר 的使役式在此指售卖食物；加“请”自然体现请求语气，而不把它处理为强硬命令。
- source_word: וְאָכַלְתִּי / וְשָׁתִיתִי
  choice: 让我吃／让我喝
  rationale: 两个连接词加完成式在请求中表达预期结果或目的；此译法保留这种功能，避免单纯译成未来陈述。
- source_word: תִּתֶּן לִי
  choice: 请给我
  rationale: 直接对应“给我”；上下文中的“付银子”表明这并非索取免费的水。
- source_word: רַק
  choice: 只求
  rationale: 既表达请求范围仅限于通行，也自然承接全句的恳请语气。
- source_word: אֶעְבְּרָה
  choice: 让我……经过
  rationale: 该鼓励式在本语境中具有请求准许的意味，不宜仅译作预测性的“我会经过”。
- source_word: בְרַגְלָי
  choice: 徒步
  rationale: 字面为“用／靠我的双脚”；“徒步”是现代汉语中自然、准确的对应说法。
theological_decisions: []
translation_notes:
