  text: וְ/לֹ֣א אָבָ֗ה סִיחֹן֙ מֶ֣לֶךְ חֶשְׁבּ֔וֹן הַעֲבִרֵ֖/נוּ בּ֑/וֹ כִּֽי הִקְשָׁה֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ אֶת רוּח֗/וֹ וְ/אִמֵּץ֙ אֶת לְבָב֔/וֹ לְמַ֛עַן תִּתּ֥/וֹ בְ/יָדְ/ךָ֖ כַּ/יּ֥וֹם הַ/זֶּֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/030.yaml
  text: But Sihon king of Heshbon was not willing to let us pass through his land[a], because Yahweh your God had hardened his spirit and made his heart stubborn, in order to give him into your hand, as it is this day.
translation:
  language: zh_hans
  text: 但希实本的王西宏不肯让我们从他的领地经过，因为雅威——你的上帝使他的灵刚硬，使他的心顽固[a]，为要把他交在你手中，正如今日所见。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“使他的心坚固／强壮”。希伯来语动词可指“使强壮、使坚固”；但在本句雅威使西宏的灵刚硬、而西宏拒绝通行的语境中，正文译作“使他的心顽固”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אָבָה
  choice: 不肯
  rationale: 该动词表达意愿或同意；“不肯”自然地保留西宏内在的不愿，而不只描述外在拒绝。
- source_word: הַעֲבִרֵנוּ בּוֹ
  choice: 让我们从他的领地经过
  rationale: עבר的使役式在此表示准许经过；בּוֹ按上下文指西宏所辖之地，而非其本人。中文补出“领地”，使隐含的地域所指清楚自然。
- source_word: הִקְשָׁה ... אֶת רוּחוֹ
  choice: 使他的灵刚硬
  rationale: 保留“灵”这一希伯来人论用语，并以“刚硬”表达使役式“使之坚硬”的含义及其神学张力。
- source_word: וְאִמֵּץ אֶת לְבָבוֹ
  choice: 使他的心顽固
  rationale: אמץ本可表示使强壮、使坚定，但在拒绝通行和神使之刚硬的语境中，其作用是使心执拗顽固；此译也避免与前句机械重复。
- source_word: לְמַעַן
  choice: 为要
  rationale: 简洁而明确地表达目的关系，同时符合庄重的现代汉语经文语体。
- source_word: תִּתּוֹ בְיָדְךָ
  choice: 把他交在你手中
  rationale: 保留“在手中”的希伯来惯用意象，表达将西宏置于以色列掌控之下。
- source_word: כַּיּוֹם הַזֶּה
  choice: 正如今日的情形
  rationale: 表达申命记这一惯用语所指的当前、已经显明的事实，避免生硬的逐字直译。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以中文音译呈现神的专名，而不以称号替代。
theological_decisions:
- issue: 神使人刚硬与人的不愿
  choice: 同时直陈西宏“不肯”以及雅威“使他的灵刚硬，使他的心顽固”
  alternative: 把神的作为弱化为仅仅容许，或只强调西宏自己使心刚硬
  rationale: 希伯来文明确并置人的不愿和神主动使之刚硬；译文不替原文消解因果与责任之间的神学张力。
- issue: אמץ在本节中的语义
  choice: 按语境译作“使他的心顽固”
  alternative: 译作“使他的心坚强／坚定”
  rationale: 词根可有“使强壮”的基本义，但与“使他的灵刚硬”及西宏拒绝通行并列时，语境指向固执抗拒；“顽固”传达此处的实际语用效果。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“希实本王西宏”紧贴希伯来语称谓次序；“雅威—你的上帝”用破折号自然标明同位关系。未设置脚注，因为正文已按语境清楚表达领地所指及אמץ的顽固含义；若需保留其词汇歧义，可另加脚注说明也可译为“使他的心坚强”。
