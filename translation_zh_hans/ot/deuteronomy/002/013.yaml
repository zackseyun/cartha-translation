  yaml_path: translation/ot/deuteronomy/002/013.yaml
  text: Now rise up and cross over the Wadi Zered[a]. So we crossed over the Wadi Zered.
translation:
  language: zh_hans
  text: 现在，你们起来，越过撒烈谷。于是我们越过了撒烈谷。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַתָּה
  choice: 现在
  rationale: 作时间话语标记，引出接下来的命令；“现在”自然地保留了原文的即时感。
- source_word: קֻמוּ
  choice: 起来
  rationale: 复数命令式。汉语“起来”既保留命令的力度，也符合现代叙事语体。
- source_word: וְעִבְרוּ
  choice: 过……去
  rationale: 在行程语境中指越过地理障碍；“过……去”自然表达从一边到另一边的方向感。
- source_word: לָכֶם
  choice: 不单独译出
  rationale: 此处是加强命令语气的与格，在现代汉语中若直译为“为你们自己”会显得生硬，故融入命令表达。
- source_word: נַחַל
  choice: 谷
  rationale: 该词可指季节性水道、溪谷或沟谷；在旷野行程语境中，“谷”简洁自然，同时以脚注保留其他可能。
- source_word: זָרֶד
  choice: 撒烈
  rationale: 地名采用中文圣经传统中通行且易识别的音译。
- source_word: וַנַּעֲבֹר
  choice: 于是我们过了
  rationale: 第一人称复数叙事形式表明命令随后得到执行；“于是”自然呈现事件的承接和结果。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“现在，起来”保留原文两个命令成分的力度；前后两次“过”形成呼应。“撒烈谷”避免把季节性水道误解为常年河流，脚注则保留 נחל 的地貌歧义。
