  yaml_path: translation/ot/deuteronomy/002/010.yaml
  text: The Emim formerly lived there[a], a people great and numerous and tall as the Anakim.
translation:
  language: zh_hans
  text: 从前[a]，以米人住在那里；他们是一个庞大、人数众多、身材高大如亚衲人的民族。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“古时”。
    reason: לְפָנִים 是时间副词，可译为“从前”或“古时”；脚注保留另一种自然的时间表达。
lexical_decisions:
- source_word: הָאֵמִים
  choice: 以米人
  rationale: 这是族名，采用中文圣经传统中通行的音译“以米人”，不按可能的词源含义翻译。
- source_word: לְפָנִים
  choice: 从前
  rationale: 此处是时间副词，表示“先前、昔日”；“从前”简明自然，并与上下文的历史回顾相称。
- source_word: יָשְׁבוּ בָהּ
  choice: 住在那里
  rationale: ישׁב 与介词 ב 连用表示居住；阴性单数代词指前文所说的地方或地域，汉语用“那里”自然表达。
- source_word: עַם גָּדוֹל וְרַב
  choice: 强大、人数众多的民族
  rationale: עַם 指一个族群；גָּדוֹל 在这里与人数和身材的描述并列，含规模大、强盛可畏之意，译作“强大”；רַב 明确表达人口众多。
- source_word: וָרָם כָּעֲנָקִים
  choice: 身材像亚衲人一样高大
  rationale: רָם 在人与亚衲人比较的语境中指身材高大；补出“身材”使现代汉语清楚自然，同时保留比较关系。
- source_word: עֲנָקִים
  choice: 亚衲人
  rationale: 族名采用中文圣经传统中通行的音译“亚衲人”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。分号保留原句中族名陈述与同位描述之间的层次；“强大、人数众多”和“身材……高大”分别表达 גָּדוֹל、רַב、רָם，避免把三个形容词含混合并。
