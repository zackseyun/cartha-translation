base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/021.yaml
  text: a people great[a], numerous, and tall like the Anakim. Yahweh destroyed them from before them, and they dispossessed them and lived in their place.
translation:
  language: zh_hans
  text: 这是一个强大、人数众多、像亚衲人[a]一样高大的民族。耶和华从他们面前除灭了这族人；他们便夺取这族人的地，住在原来的地方。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “亚衲人”也可译作“亚衲族”。
    reason: 原文使用族名 עֲנָקִים 的复数形式，中文既可按成员译为“亚衲人”，也可按整体族群译为“亚衲族”。
lexical_decisions:
- source_word: עַם גָּדוֹל וְרַב
  choice: 一个强大、人数众多的民族
  rationale: עַם 是表示群体的单数名词；גָּדוֹל 与 רַב 并列，分别表达强大或规模宏大以及人数众多，译文保留二者的区别。
- source_word: רָם
  choice: 高大
  rationale: 在与亚衲人比较的语境中，此词指人的身材高大，而非抽象意义上的崇高。
- source_word: כָּעֲנָקִים
  choice: 像亚衲人一样
  rationale: 前缀 כ־ 表示比较；עֲנָקִים 是族名的复数形式，音译为“亚衲人”。
- source_word: וַיַּשְׁמִידֵם
  choice: 除灭了这族人
  rationale: שׁמד 的使役形表达使其毁灭、从当地消失；“除灭”保留其强烈含义，又不额外界定具体方式。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 直接呈现四字神名在现代中文圣经传统中通行的专名形式，而不以“主”这一称号替代。
- source_word: מִפְּנֵיהֶם
  choice: 从他们面前
  rationale: 保留希伯来语“从……面前”的空间性表达，意指为他们清除当地居民。
- source_word: וַיִּירָשֻׁם
  choice: 他们便夺取这族人的地
  rationale: ירשׁ 在此表示通过取代原有居民而取得其产业；中文补出“地”，使含义自然明确，但不改变动作主体。
- source_word: וַיֵּשְׁבוּ תַחְתָּם
  choice: 住在原来的地方
  rationale: תַּחְתָּם 表示取代对方的位置；此译法自然表达他们接替原居民而居住。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。正文采用现代中文读者最熟悉的专名形式“耶和华”，保留其作为神之名的性质，不以称号“主”替代。
- issue: 后半节两个复数代词所指
  choice: 保留“他们”，并以“这族人”澄清宾语
  alternative: 将主语明说为“以扫的子孙”
  rationale: 希伯来文仅用复数代词，其先行词来自上文。正文不把上下文中的身份直接增补进本节，以保留原文衔接方式；同时把宾语译为“这族人”，避免中文将主语误解为耶和华。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“除灭”保留经文力度；“夺取这族人的地”将 ירשׁ 在此处隐含的土地对象明示出来，以免“夺取他们”在中文中产生把人当作直接占有对象的歧义。
