  source_fidelity: 译文准确传达了希伯来文对该族群的三重描述（强大、人数众多、身材高大并如亚衲人），以及耶和华在另一群人面前除灭前者、后者继而占据其地并居住的叙述。'夺取这族人的地'自然地表达了 וַיִּירָשֻׁם 在此处的取代和得地含义，未不当扩充事件细节。
