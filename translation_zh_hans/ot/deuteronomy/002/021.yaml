  terminology: “耶和华”是中文圣经中通行且明确的四字神名译法；“亚衲人”作为族名音译一致。“除灭”“夺取……的地”“住在原来的地方”分别恰当地对应毁灭、取代取得和居住于其位置的语义。脚注正确附于“亚衲人”，并恰当说明族名的另一种中文处理方式。
