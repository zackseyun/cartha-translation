base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/008.yaml
  text: So we passed on from our brothers[a], the sons of Esau, who live in Seir, away from the way of the Arabah, from Elath and from Ezion-geber[b]; and we turned and passed by the way of the wilderness of Moab.
translation:
  language: zh_hans
  text: 于是，我们离开住在西珥的弟兄——以扫的子孙[a]，也离开亚拉巴的路[b]、以拉他和以旬迦别，继续前行；随后我们转向，沿着摩押旷野的路前进。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“我们的亲族——以扫的后裔”。希伯来文直译为“我们的弟兄，以扫的子孙”。
    reason: alternative_reading
  - marker: b
    text: 或译“亚拉巴的道路”。“亚拉巴”指死海以南裂谷一带的地区。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנַּעֲבֹר מֵאֵת
  choice: 离开……继续前行
  rationale: עבר与מֵאֵת连用，在此表示旅程中从某人那里离开并继续前进，而非渡过水域。译文兼顾动作的延续性与现代汉语的自然表达。
- source_word: אַחֵינוּ בְנֵי עֵשָׂו
  choice: 我们的弟兄——以扫的子孙
  rationale: 保留希伯来文“弟兄”的亲属称谓，以呈现以色列与以东的亲缘关系；“子孙”在现代汉语中自然表达族群后裔。
- source_word: הַיֹּשְׁבִים בְּשֵׂעִיר
  choice: 住在西珥的
  rationale: ישב的分词表示定居或居住；“住在”简明、现代且准确。
- source_word: מִדֶּרֶךְ הָעֲרָבָה
  choice: 离开亚拉巴大道
  rationale: דֶּרֶךְ可指道路或路线；“大道”适合此处的行旅语境。保留“亚拉巴”为地名，不将其泛化为普通荒原。介词מִן表达离开该道路。
- source_word: מֵאֵילַת וּמֵעֶצְיֹן גָּבֶר
  choice: 也离开……以拉他和以旬迦别
  rationale: 重复的מִן与前文离开之意相连；地名采用现代中文圣经中易辨认的传统译名。
- source_word: וַנֵּפֶן
  choice: 随后我们转向
  rationale: פנה表示改变行进方向；“转向”简洁保留原文动作。
- source_word: וַנַּעֲבֹר דֶּרֶךְ מִדְבַּר מוֹאָב
  choice: 沿着摩押旷野的路前进
  rationale: 将עבר译为旅途中的“前进”，并以“沿着……的路”自然表达דֶּרֶךְ的路径用法；“摩押旷野”直译构词关系。
theological_decisions:
- issue: 对以东人的亲属称谓
  choice: 弟兄——以扫的子孙
  alternative: 亲族——以扫的后裔
  rationale: 原文明确使用“弟兄”和“以扫的子孙”。保留这一措辞，既呈现申命记所强调的亲缘关系，也不将其弱化为泛称。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。以破折号说明“弟兄”与“以扫的子孙”的同位关系；校正咨询层脚注标记与内容错位的问题，使亲属称谓脚注置于[a]，亚拉巴道路脚注置于[b]。
