  text: כַּ/אֲשֶׁ֤ר עָשָׂה֙ לִ/בְנֵ֣י עֵשָׂ֔ו הַ/יֹּשְׁבִ֖ים בְּ/שֵׂעִ֑יר אֲשֶׁ֨ר הִשְׁמִ֤יד אֶת הַ/חֹרִי֙ מִ/פְּנֵי/הֶ֔ם וַ/יִּֽירָשֻׁ/ם֙ וַ/יֵּשְׁב֣וּ תַחְתָּ֔/ם עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/022.yaml
  text: just as he did for the sons of Esau who live in Seir[a], when he destroyed the Horites from before them[c][b], and they dispossessed them and settled in their place to this day.
translation:
  language: zh_hans
  text: 正如他为住在西珥的以扫子孙所做的：他从他们面前除灭了何利人[a]；以扫的子孙便夺取何利人的地，住在他们原来的地方，直到今日。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “从他们面前除灭”是希伯来语表达，意思是把何利人从他们所在的地域清除出去。
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר עָשָׂה
  choice: 正如他……所做的
  rationale: 保留原文与上文之间的比较关系，也保留“做”所指行动的概括性，不作过度具体化。
- source_word: לִבְנֵי עֵשָׂו
  choice: 为……以扫子孙
  rationale: “子孙”在现代汉语中自然表达族裔后代，比直译“儿子们”更符合此处所指。
- source_word: הַיֹּשְׁבִים בְּשֵׂעִיר
  choice: 住在西珥的
  rationale: 用现代、自然的“住在”表达持续居住，避免不必要的古雅措辞。
- source_word: הִשְׁמִיד
  choice: 除灭
  rationale: 表达使某族群遭毁灭并被移除的强烈含义，同时保持庄重的经文语体。
- source_word: מִפְּנֵיהֶם
  choice: 从他们面前
  rationale: 保留希伯来语空间性习语；在本语境中表示从他们所在之地或势力范围中清除。
- source_word: וַיִּירָשֻׁם
  choice: 夺取何利人的地
  rationale: ירשׁ在征服语境中表示剥夺原居民并取得其产业；原文宾语为人称代词，但汉语若直译“夺取他们”容易误解，故明示其实际所指的土地。
- source_word: וַיֵּשְׁבוּ תַחְתָּם
  choice: 住在他们原来的地方
  rationale: 准确表达取代原居民而居住其地的意思，措辞自然清楚。
- source_word: עַד הַיּוֹם הַזֶּה
  choice: 直到今日
  rationale: 采用现代汉语圣经语体中自然且庄重的固定表达。
theological_decisions:
- issue: “做”和“除灭”的隐含主语
  choice: 用第三人称“他”，承接上文所指的耶和华
  alternative: 在本节中直接明说“耶和华”
  rationale: 原文动词为阳性单数，主语由紧邻上下文承接为耶和华；保留“他”既清楚，又不在本节重复原文未重述的神名。
- issue: וַיִּירָשֻׁם 的主语转换
  choice: 明确为“以扫的子孙”
  alternative: 沿用代词“他们”
  rationale: 原文由单数的神圣行动者转为复数的以扫子孙；汉语明确主语可避免把夺地行动误归给前一句的“他”，并不改变原文神施行除灭、人实际占地的张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“西珥”“何利人”沿用通行专名。通过分号和主语复现呈现希伯来语中的行动者转换；避免古奥的“居于”和可能误导的“承受他们”。
