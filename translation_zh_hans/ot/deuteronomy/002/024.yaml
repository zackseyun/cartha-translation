source:
  edition: WLC
  text: ק֣וּמוּ סְּע֗וּ וְ/עִבְרוּ֮ אֶת נַ֣חַל אַרְנֹן֒ רְאֵ֣ה נָתַ֣תִּי בְ֠/יָדְ/ךָ אֶת סִיחֹ֨ן מֶֽלֶךְ חֶשְׁבּ֧וֹן הָֽ/אֱמֹרִ֛י וְ/אֶת אַרְצ֖/וֹ הָחֵ֣ל רָ֑שׁ וְ/הִתְגָּ֥ר בּ֖/וֹ מִלְחָמָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/024.yaml
  text: Rise up[a], set out, and cross over the Arnon Valley. See, I have given into your hand Sihon king of Heshbon, the Amorite, and his land. Begin to take possession of it[c][b], and engage him in battle.
translation:
  language: zh_hans
  text: 你们起来，动身，越过亚嫩河谷[a]。看，我已经把亚摩利人的希实本王西宏和他的地交在你手中。开始占领他的地[b]，与他交战[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “亚嫩河谷”也可译作“亚嫩旱溪谷”或“亚嫩溪”；希伯来语 נחל 可指河谷、季节性河道或溪流。
    reason: lexical_alternative
  - marker: b
    text: “占领他的地”也可译作“取得它”或“占有它”；这里的动词也可含“赶走原占有者”的意思。
    reason: lexical_alternative
  - marker: c
    text: “与他交战”也可译作“与他争战”或“向他挑衅，开战”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֣וּמוּ סְּע֗וּ
  choice: 你们起来，动身
  rationale: 两个复数祈使式依次发出起身和启程的命令；译文保留动作次序，并采用自然、庄重的现代汉语。
- source_word: וְעִבְרוּ֮ אֶת נַ֣חַל אַרְנֹן
  choice: 渡过亚嫩河谷
  rationale: עבר在地理语境中表示越过；נחל可指季节性河道、溪流或其谷地。“河谷”既便于普通读者理解，也避免把该地貌误解为一条常年小溪。
- source_word: רְאֵ֣ה
  choice: 看
  rationale: 这是单数祈使式，转而把以色列作为一个整体来称呼；“看”直接保留引人注意的语气。
- source_word: נָתַ֣תִּי בְיָדְךָ
  choice: 我已经把……交在你手中
  rationale: 完成式保留为已经成就的赐予；“交在你手中”保存希伯来语表示授予权柄和控制的意象。
- source_word: סִיחֹ֨ן מֶֽלֶךְ חֶשְׁבּ֧וֹן הָאֱמֹרִ֛י
  choice: 希实本王亚摩利人西宏
  rationale: 保留西宏的王位、所属城邑和族属；此语序贴近原文同位结构，同时在现代汉语中仍可理解。
- source_word: וְאֶת אַרְצוֹ
  choice: 和他的地
  rationale: אֶרֶץ在这里指西宏统治的土地；“地”简洁，并与后文占领的对象衔接。
- source_word: הָחֵל רָשׁ
  choice: 开始占领他的地
  rationale: החל表示“开始”，ירש在这里以先行的“他的地”为对象，宜译为取得并占有土地；补出宾语可消除汉语指代不清，但不排除该动词含有使原占有者失去土地的意味。
- source_word: וְהִתְגָּר בּוֹ מִלְחָמָה
  choice: 与他交战
  rationale: 该结构表示进入敌对争战；“与他交战”清楚自然，同时在脚注保留“挑战开战”或“挑起战争”的可能语气。
theological_decisions:
- issue: 上帝的赐予与以色列受命采取行动
  choice: 同时译出“我已经……交在你手中”和“开始占领……与他交战”
  alternative: 把完成式弱化为将来应许，或只突出人的军事行动
  rationale: 原文并置上帝已成就的授予和以色列必须执行的命令；译文保留两者之间的张力，不以解释性措辞消解其中任何一面。
- issue: 从复数命令转为单数称呼
  choice: 前半句用“你们”，后半句依原文用“你”
  alternative: 全节统一译成复数“你们”
  rationale: 原文先以复数祈使式命令众人行动，随后用单数“看”和“你手中”把以色列视为一个整体；中文保留这一有意义的语法转换。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。保留“交在你手中”的源语意象，并保留原文从复数“你们”转为集合性单数“你”的称呼变化。所有词汇歧义均以脚注呈现，不在正文中强行消解。
