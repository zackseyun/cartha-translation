  yaml_path: translation/ot/deuteronomy/002/017.yaml
  text: Then Yahweh spoke to me[a], saying,
translation:
  language: zh_hans
  text: 于是，雅威对我说[a]：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文为“YHWH”（יהוה）；传统中文译作“耶和华”。
    reason: 说明四字神名的原文形式及传统中文译名。
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 于是……说
  rationale: 带叙事性连接词的动词形式推进事件次序；“于是”自然表达承接关系。“说”在现代汉语中最自然，也与后面的直接引语相配。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的专名“耶和华”译出四字神名，不以称号替代；脚注注明原文形式。
- source_word: אֵלַי
  choice: 对我
  rationale: 介词 אֶל 加第一人称单数词尾表示话语朝向说话者；中文用“对我说”准确而自然。
- source_word: לֵאמֹר
  choice: 说：
  rationale: 该不定式惯用于引出直接引语；现代汉语通常以“说：”表达，无须机械重复为“说着”。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 原文使用四字神名而非称号。正文采用中文圣经传统中最通行、普通读者最易识别的专名“耶和华”，同时借脚注保留其原文形式，避免把神名改译为称号。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“于是”承接前文并推进叙事；以冒号自然引出下一节的直接话语。
