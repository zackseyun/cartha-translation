  yaml_path: translation/ot/deuteronomy/002/035.yaml
  text: Only the livestock we took as plunder for ourselves[a], along with the spoil of the cities that we captured.
translation:
  language: zh_hans
  text: 我们只把牲畜和我们攻取的城邑中的战利品掠为己有。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רַק
  choice: 只
  rationale: 承接上文，表示限制：人被尽行毁灭，但牲畜和城中财物被保留下来作为战利品。
- source_word: הַבְּהֵמָה
  choice: 牲畜
  rationale: 此处指可作为战利品的家畜；“牲畜”比泛称“动物”更准确。
- source_word: בָּזַזְנוּ לָנוּ
  choice: 掠来，归自己所有
  rationale: בזז表达掠夺战利品，לנו表示所得归己；此译既保留动作，也明确受益者含义。
- source_word: וּשְׁלַל הֶעָרִים
  choice: 和所攻取各城的财物
  rationale: שׁלל指战争中所得的战利品；译作“财物”在现代汉语中自然，并由动词“掠来”保留战利品语境。
- source_word: אֲשֶׁר לָכָדְנוּ
  choice: 所攻取
  rationale: לכד在军事语境中表示攻占、夺取；“攻取”与“城”搭配自然，并保留战争背景。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。将希伯来语中共同受动词支配的“牲畜”和“各城的财物”并列处理，避免英文脚注所提示的结构歧义；原文语法更自然地支持二者都是掠来归己的对象。
