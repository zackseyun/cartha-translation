source:
  edition: WLC
  text: אַל תִּתְגָּר֣וּ בָ֔/ם כִּ֠י לֹֽא אֶתֵּ֤ן לָ/כֶם֙ מֵֽ/אַרְצָ֔/ם עַ֖ד מִדְרַ֣ךְ כַּף רָ֑גֶל כִּֽי יְרֻשָּׁ֣ה לְ/עֵשָׂ֔ו נָתַ֖תִּי אֶת הַ֥ר שֵׂעִֽיר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/005.yaml
  text: Do not provoke them[a], for I will not give you any of their land, not even enough to set the sole of a foot on[c][b], because I have given Mount Seir to Esau as a possession.
translation:
  language: zh_hans
  text: 不可向他们挑起争端[a]，因为我不会把他们的地赐给你们，连脚掌踏足之地也不给[b]；因为我已把西珥山[c]赐给以扫作产业[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “向他们挑起争端”也可译作“与他们争战”或“招惹他们”。
    reason: lexical_alternative
  - marker: b
    text: 直译：“直到脚掌所踏之处”；意思是连极小的一片地也不给。
    reason: idiom_explanation
  - marker: c
    text: “西珥山”也可指西珥山区或西珥山地。
    reason: cultural_note
  - marker: d
    text: “产业”也可译作“基业”或“所拥有的地”。
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּתְגָּרוּ בָם
  choice: 向他们挑起争端
  rationale: 该词组指主动招惹对方、与之发生敌对冲突；“挑起争端”既保留主动挑衅的意味，也不把含义限定为正式开战。
- source_word: לֹא אֶתֵּן לָכֶם מֵאַרְצָם
  choice: 他们的地，我一点也不会赐给你们
  rationale: 介词 מִן 在这里表达部分意义，即他们的土地中没有任何一部分会赐给以色列；此译法自然明确。
- source_word: עַד מִדְרַךְ כַּף רָגֶל
  choice: 连一脚掌可踏之地也不给
  rationale: 原文意象是脚掌所踏之处，用来表示极小的一片土地；译文保留脚掌与踏地的形象，同时传达“丝毫也不给”的强调。
- source_word: יְרֻשָּׁה
  choice: 产业
  rationale: 该词可指承受所得的产业或所拥有的领地；“产业”保留神所赐领地及可承受之业两方面的含义。
- source_word: לְעֵשָׂו
  choice: 给以扫
  rationale: לְ 标明领受者；人名按现代汉语圣经通行形式译为“以扫”。
- source_word: הַר שֵׂעִיר
  choice: 西珥山
  rationale: 直译为“西珥山”，也可泛指西珥的山地；正文采用简洁且通行的地名形式，脚注说明其地域含义。
theological_decisions:
- issue: 以东领土的神圣授予
  choice: 保留两个“因为”所表达的论证：不可挑起争端，因神不把其地赐给以色列，并已将西珥赐给以扫。
  alternative: 将禁令仅理解为政治或军事策略，不突出土地由神分配。
  rationale: 原文两个 כִּי 从句明确把禁令建立在上帝分配土地的行动上；译文忠实保留这一神学依据而不作额外发挥。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“不可”维持律法禁令的肃穆语气；“挑起争端”自然表达主动敌对而不把词义过度限定为正式战争。句中略作前置和复指，以清楚呈现“他们的地中一点也不赐”的部分否定。
