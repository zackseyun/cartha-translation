base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/029.yaml
  text: just as the sons of Esau who live in Seir and the Moabites who live in Ar did for me[a], until I cross the Jordan into the land that Yahweh our God is giving to us.
translation:
  language: zh_hans
  text: 正如住在西珥的以扫子孙和住在亚珥的摩押人怎样对待我一样[a]，直到我渡过约旦河，进入雅威——我们的上帝——正在赐给我们的土地。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“为我做了什么”；希伯来语直译为“为我做了”，在上下文中指准许通行并供应所需。
    reason: 说明原文宽泛措辞的另一种译法及其上下文所指。
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: 正如……那样
  rationale: 明确保留比较关系，并与本节承接上文的句法相配。
- source_word: עָשׂוּ לִי
  choice: 为我所做的
  rationale: 贴近希伯来语“对／为我做”的宽泛表达，不在正文中把具体行为限定为准许通行或供应食物。
- source_word: בְּנֵי עֵשָׂו
  choice: 以扫子孙
  rationale: 保留原文的亲族性称谓，同时在现代汉语中自然地表达以扫的后裔。
- source_word: הַיֹּשְׁבִים בְּשֵׂעִיר
  choice: 住在西珥的
  rationale: ישב的分词在此表示定居，译作“住在”简明自然。
- source_word: וְהַמּוֹאָבִים
  choice: 和……摩押人
  rationale: 直接表达族称复数。
- source_word: הַיֹּשְׁבִים בְּעָר
  choice: 住在亚珥的
  rationale: 与前一处分词结构对应；亚珥按地名音译。
- source_word: עַד אֲשֶׁר אֶעֱבֹר
  choice: 直到我渡过
  rationale: 与“约旦河”搭配时，“渡过”准确而自然。
- source_word: אֶת הַיַּרְדֵּן
  choice: 约旦河
  rationale: 采用现代汉语中通行的地名形式，并明示其为河流。
- source_word: אֶל הָאָרֶץ
  choice: 进入……土地
  rationale: 结合渡河语境，表达越过边界而进入该地的方向。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，保留其作为专名的性质。
- source_word: אֱלֹהֵינוּ
  choice: 我们的上帝
  rationale: 直接表达第一人称复数所属关系和对上帝的称呼。
- source_word: נֹתֵן לָנוּ
  choice: 正在赐给我们的
  rationale: 以进行性措辞反映分词所呈现的当前且确定的赐予行动，同时不译成已经完成。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用神的专名；译作“雅威”以音译保留专名，而不以称号替代。
- issue: נֹתֵן 所表达的赐地时态与体貌
  choice: 正在赐给我们的
  alternative: 赐给我们的
  rationale: 保留希伯来语分词所表达的进行中而又确定的行动，不把赐地表述为已经完全实现。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“正如……那样”保留本节承接上文的从属结构；专名采用“西珥、亚珥、约旦河、雅威”等形式。
