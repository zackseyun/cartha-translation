base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/026.yaml
  text: So I sent messengers from the wilderness of Kedemoth to Sihon king of Heshbon with words of peace[a], saying,
translation:
  language: zh_hans
  text: 于是，我从基底莫旷野派使者到希实本王西宏那里，传达和平的话[a]，说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“提出和平条件”。希伯来语直译为“和平的话”，指和平的外交接触或提议。
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשְׁלַח
  choice: 于是，我……派
  rationale: 该叙事形式推进事件次序；“于是”自然表达承接关系，并保留第一人称行动。
- source_word: מַלְאָכִים
  choice: 使者
  rationale: 语境是人与人之间的外交接触，因此指受差派的人，而非天使；“使者”准确且不过度解释其具体身份。
- source_word: מִמִּדְבַּר קְדֵמוֹת
  choice: 从基底莫旷野
  rationale: מִדְבָּר指荒野或旷野；“基底莫旷野”保留原文的地名修饰关系，并采用现代中文圣经地名的常见音译。
- source_word: אֶל סִיחוֹן מֶלֶךְ חֶשְׁבּוֹן
  choice: 到希实本王西宏那里
  rationale: אֶל标明使者前往的对象；中文将王号置于人名前，表达自然，同时保留西宏为希实本之王的关系。
- source_word: דִּבְרֵי שָׁלוֹם
  choice: 和平的话
  rationale: 直译为“和平的话”，可指和平的信息、提议或交涉条件；正文保留希伯来语意象及其一定的开放性。
- source_word: לֵאמֹר
  choice: 说：
  rationale: 这是引出下文直接引语的固定表达；中文用“说：”清楚表明话语将在下一节继续。
theological_decisions: []
