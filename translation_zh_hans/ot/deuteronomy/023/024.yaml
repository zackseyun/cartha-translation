base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/024.yaml
  text: You shall keep what has gone out from your lips and do it[a], according to what you vowed to Yahweh your God as a freewill offering[b], which you spoke with your mouth.
translation:
  language: zh_hans
  text: 你嘴唇所说出的，要谨守并实行[a]，照着你亲口向雅威你的神所许的愿——自愿献上的供物[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“你嘴唇所说出的，要持守并去做”。这里指忠实履行已经说出口的话。
    reason: lexical_alternative
  - marker: b
    text: 或译“自愿的供物”。原词指甘心献上、非出于强迫的供物。
    reason: lexical_alternative
lexical_decisions:
- source_word: מוֹצָא שְׂפָתֶיךָ
  choice: 你嘴里说出的话
  rationale: מוֹצָא 指“出来之物”，与“嘴唇”连用，具体指已经说出口的话。中文保留口头说出的意象，同时表达自然。
- source_word: תִּשְׁמֹר וְעָשִׂיתָ
  choice: 要谨守并实行
  rationale: שׁמר 在这里是认真持守、遵守，עשה 是付诸实行；并列翻译保留原文从谨守承诺到实际履行的双重强调。
- source_word: כַּאֲשֶׁר נָדַרְתָּ
  choice: 照你……所许的愿
  rationale: כַּאֲשֶׁר 表明履行应当符合所许之愿的内容；“照”简洁保留这一规范关系。
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: 向雅威你的神
  rationale: 将四字神名 יהוה 音译为“雅威”，保留经文直接使用的盟约之名；介词 ל 在许愿语境中译为“向”。
- source_word: נְדָבָה
  choice: 自愿献上的供物
  rationale: נְדָבָה 可指自愿献上的祭物或供物，强调不是出于强迫。正文采用名词性理解，也保留与许愿献礼语境的联系。
- source_word: אֲשֶׁר דִּבַּרְתָּ בְּפִיךָ
  choice: 你亲口承诺
  rationale: 原文直译为“你用口所说的”。“亲口承诺”既保留口头表达的强调，也符合现代汉语谈论许愿的习惯。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较接近学界通常重建的读音，也使读者看出这里是神的专名，而非称号。
- issue: נְדָבָה 与所许之愿的关系
  choice: 理解为自愿献上的供物
  alternative: 理解为副词性的“自愿地许愿”
  rationale: 该词通常可指自愿祭或自愿供物，正文依其名词性常用义处理；但句法容许它强调许愿行为出于自愿，因此在脚注保留另一种理解。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“谨守并实行”保留原文两个并列动词；“亲口”保留经文对口头承诺的重复强调。
