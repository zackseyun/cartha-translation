  yaml_path: translation/ot/deuteronomy/023/012.yaml
  text: And toward evening he shall wash himself with water[b][a], and when the sun sets he may come into the midst of the camp.
translation:
  language: zh_hans
  text: 傍晚时，他要用水洗身；日落时[a]，他可以进入营中[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译为“太阳进去时”；这是希伯来语表示日落的惯用说法。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“进入营地”；希伯来语更具体地说“进入营地内部”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: （不另译）
  rationale: 这里的连接词与“是/成为”构成承接律例指示的惯用结构；中文直接从时间状语起句，更自然，也不损失上下文的顺承关系。
- source_word: לִפְנוֹת עֶרֶב
  choice: 傍晚时
  rationale: פנה 的不定式与“晚上”连用，表示一天转向傍晚之际；“傍晚时”简明自然。
- source_word: יִרְחַץ בַּמָּיִם
  choice: 他要用水洗身
  rationale: רחץ 在此指身体的洗涤；“洗身”表达语境中的反身含义，“用水”保留介词短语。
- source_word: וּכְבֹא הַשֶּׁמֶשׁ
  choice: 日落以后
  rationale: 希伯来语字面为“太阳进去/进来时”，是表示日落的惯用语；结合前文洁净条例，“日落以后”清楚表达可重新入营的时间条件。
- source_word: יָבֹא
  choice: 他就可以进入
  rationale: 此处未完成式处于律例语境中，表示满足洗身和日落条件后获准重新进入；“可以”比单纯将来式更准确地传达许可意味。
- source_word: אֶל תּוֹךְ הַמַּחֲנֶה
  choice: 进入营中
  rationale: תּוֹךְ 表示内部；“营中”既保留进入营地内部的含义，又符合现代汉语表达。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的律例文体。“要”表达规定，“可以”表达在洁净条件满足后的许可；分号呈现洗身与日落后重新入营之间的次序。
