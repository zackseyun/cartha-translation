base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/014.yaml
  text: And you shall have a peg among your equipment[a], and when you sit down outside[c][b], you shall dig with it and turn back and cover your excrement.
translation:
  language: zh_hans
  text: 你要在随身装备[b]中备一根橛子[a]；你在外面坐下[c]时，要用它挖掘，随后转回来，掩盖自己的粪便。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“木桩”；有人按它在本节中的用途理解为挖土工具或小铲。
    reason: lexical_alternative
  - marker: b
    text: “随身装备”原文直译为“在你的耳朵上”。这里很可能是指随身携带的装备或器具。
    reason: lexical_alternative
  - marker: c
    text: 原文直译为“你在外面坐下时”，是对如厕的含蓄说法。
    reason: cultural_note
lexical_decisions:
- source_word: יָתֵד
  choice: 橛子
  rationale: 该词通常指固定帐棚等所用的橛或桩；本节中又作为挖土的器具。“橛子”既保留原词的具体形象，也由下文说明其用途。
- source_word: עַל אֲזֵנֶךָ
  choice: 在随身用具中
  rationale: אֲזֵן 字面为“耳”，但此处的表达显然不是指人体的耳朵；结合军营条例的语境，很可能指随身装备或器具。译为“在随身用具中”可表达语境意义，同时以脚注保留字面形式及解释上的不确定性。
- source_word: בְּשִׁבְתְּךָ חוּץ
  choice: 你到营外蹲下时
  rationale: 原文直译近于“你在外面坐下时”，在本语境中是如厕的含蓄说法。“蹲下”在现代汉语中自然地保留这一委婉表达；“营外”则根据相邻经文的营地语境明确“外面”的所指。
- source_word: וְחָפַרְתָּ בָהּ
  choice: 要用它挖土
  rationale: 阴性代词指回“橛子”。原文只说“用它挖”，并未明说“洞”；“挖土”在中文中自然，又避免增添“洞”这一未明说的宾语。
- source_word: וְשַׁבְתָּ
  choice: 然后转身
  rationale: שׁוב 可表示返回或转回；此处描述挖土、排泄后掩盖的动作次序，“转身”自然传达回过来处理并掩盖的意思。
- source_word: צֵאָתֶךָ
  choice: 自己的粪便
  rationale: 该词指人体排泄物。“粪便”准确、现代且庄重，适合法律条文的语体。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的法规语体。“橛子”保留希伯来词的物件形象；“蹲下”保留原文委婉意味而不直白解释。脚注标记依相关词语依次放置，正文中的[a]说明器具名称，[b]说明“随身用具”背后的特殊原文表达，[c]说明如厕委婉语。
