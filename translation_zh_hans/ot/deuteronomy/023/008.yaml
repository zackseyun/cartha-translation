base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/008.yaml
  text: You shall not abhor an Edomite[a], for he is your brother. You shall not abhor an Egyptian[c][b], for you were a sojourner in his land.
translation:
  language: zh_hans
  text: 不可厌恶以东人[a]，因为他是你的弟兄[b]；不可厌恶埃及人，因为你曾在埃及地寄居[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “厌恶”也可译作“嫌恶”或“视为可憎”。
    reason: lexical_alternative
  - marker: b
    text: “你的弟兄”指以色列与以东的亲缘关系；以东源自以扫，以扫是雅各的哥哥。
    reason: cross_reference
  - marker: c
    text: “寄居”所对应的词指住在本族、本地以外、处于当地居民中的外来人；也可译作“作外来居民”。
    reason: lexical_alternative
lexical_decisions:
- source_word: תְתַעֵב
  choice: 厌恶
  rationale: 该词的加强语态表示把某人视为可憎、令人嫌恶；“厌恶”保留了强烈的排斥意味，同时适合现代汉语。两处采用相同译法，以保存原文的平行和重复。
- source_word: אֲדֹמִי
  choice: 以东人
  rationale: 这是来自“以东”的族称；“以东人”是简体中文圣经语境中清楚、通行的译法。
- source_word: אָחִיךָ
  choice: 你的弟兄
  rationale: 原文使用直接的亲属称谓。保留“弟兄”既反映以色列与以东因以扫而有的亲缘关系，也避免将其解释性地弱化为“亲族”。
- source_word: מִצְרִי
  choice: 埃及人
  rationale: 这是“埃及”的族称；译为现代汉语通行的“埃及人”。
- source_word: גֵר
  choice: 寄居者
  rationale: 该词指离开本族、本地，住在另一群体之中的外来居民。“寄居者”保留其身份和社会处境，较单纯的“外国人”更贴近原义。
- source_word: בְאַרְצוֹ
  choice: 在他的国中
  rationale: 原文带第三人称阳性单数后缀，与代表性单数“埃及人”呼应。“他的国中”在汉语中保留这一单数表达，同时清楚指向埃及。
- source_word: כִּי
  choice: 因为
  rationale: 两次均引出禁令的理由；“因为”在现代汉语中直接、自然，并清楚表达因果关系。
theological_decisions:
- issue: 民族称谓的代表性单数
  choice: 保留单数形式：“以东人”“埃及人”“他”“他的国中”
  alternative: 按汉语习惯复数化为“以东人……埃及人……他们的国”
  rationale: 希伯来文以单数族称代表该民族中的成员。保留单数可反映法律条文对个体的直接要求，也维持两个分句的个人性表达。
- issue: 以东与以色列的亲属关系
  choice: 直译为“你的弟兄”
  alternative: 解释为“你的亲族”或“你的亲属”
  rationale: 原文用亲属语言说明不可厌恶以东人的理由，指向以色列与以东经由雅各和以扫而有的兄弟关系。直译保留了经文的历史神学关联，不替经文消解其张力。
- issue: 以色列在埃及的身份描述
  choice: 译为“曾在他的国中作寄居者”
  alternative: 译为“曾寄居在他的国中”或“曾是外国人”
  rationale: 名词性表达“作寄居者”保留 גֵר 所强调的外来居民身份，而不只描述短暂停留；同时不额外判断埃及经历的性质。
translation_notes:
  register: 采用现代、庄重而易懂的法律训诫语体。以“不可”对应禁令，并保留两次“不可厌恶”的重复结构；用分号呈现两个平行分句。族称和代词维持原文的代表性单数。
