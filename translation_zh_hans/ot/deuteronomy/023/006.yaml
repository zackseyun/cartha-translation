base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/006.yaml
  text: But Yahweh your God was not willing to listen to Balaam, and Yahweh your God turned the curse into a blessing for you, because Yahweh your God loved you.
translation:
  language: zh_hans
  text: 但耶和华你的上帝不肯听巴兰；耶和华你的上帝为你把咒诅变为祝福，因为耶和华你的上帝爱你。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָבָה
  choice: 不肯
  rationale: 该动词表示意愿或同意；“不肯”准确保留意志层面的含义，也符合现代汉语表达。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经传统中对四字神名的通行音译，保留其作为上帝专名的性质，而不以称号代替。
- source_word: אֱלֹהֶיךָ
  choice: 你的上帝
  rationale: 准确表达带第二人称阳性单数后缀的结构；“上帝”庄重而为现代普通读者熟悉。
- source_word: לִשְׁמֹעַ אֶל
  choice: 听
  rationale: 此处惯用语可指听从、理会；“听巴兰”保留原文一定程度的语义开放性，避免过度解释为接受其请求或咒诅。
- source_word: בִּלְעָם
  choice: 巴兰
  rationale: 采用该人名在简体中文圣经中的通行译名。
- source_word: וַיַּהֲפֹךְ
  choice: 反而……变为
  rationale: “变为”表达 הפך 的转变含义；“反而”自然呈现叙事中由咒诅转成祝福的逆转关系。
- source_word: הַקְּלָלָה
  choice: 咒诅
  rationale: 指向原本针对以色列的咒诅；“咒诅”是庄重且通行的圣经用语。
- source_word: לִבְרָכָה
  choice: 变为祝福
  rationale: 介词 ל 在此表示转变的结果，汉语以“把……变为……”自然呈现。
- source_word: כִּי
  choice: 因为
  rationale: 清楚表达后句是耶和华采取上述行动的原因。
- source_word: אֲהֵבְךָ
  choice: 爱你
  rationale: 直译 אָהֵב，保留其简洁、直接及立约语境中的情感力度。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用四字神名。中文正文采用广为读者识别的专名“耶和华”，不以“主”等称号替代，从而保留专名性质；“雅威”是更接近学界常见重构发音的另一译法。
- issue: “不肯听巴兰”的含义范围
  choice: 保留“听”的宽泛表达
  alternative: 不肯听从巴兰／不肯应允巴兰
  rationale: לִשְׁמֹעַ אֶל 可表示听、理会或听从。正文避免具体断定上帝拒绝的是巴兰的命令、请求还是意图，以保留原文的语义张力。
translation_notes:
  register: 采用现代、庄重、易懂的标准普通话。“不肯”保留意愿含义；分号维持两个主要行动之间的紧密关系；“反而”凸显从咒诅到祝福的逆转，但未加入原文没有的神学解释。
