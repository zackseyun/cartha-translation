  text: לֹא יָבֹ֥א מַמְזֵ֖ר בִּ/קְהַ֣ל יְהוָ֑ה גַּ֚ם דּ֣וֹר עֲשִׂירִ֔י לֹא יָ֥בֹא ל֖/וֹ בִּ/קְהַ֥ל יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/003.yaml
  text: No one of illegitimate birth may enter the assembly of Yahweh; even to the tenth generation[a], none of his descendants may enter the assembly of Yahweh.
translation:
  language: zh_hans
  text: 出生身份不合规的人[a]不得进入耶和华的会众；即使到了第十代，他的后代也不得进入耶和华的会众。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 传统常译作“私生子”。希伯来语 מַמְזֵר 指一种因出生身份而受限制的人；它具体包括哪些情形，并不完全确定。
    reason: 说明该词的传统译法及其词义范围的争议，避免将其限定为某一种现代法律或社会类别。
lexical_decisions:
- source_word: מַמְזֵר
  choice: 出身不合资格的人
  rationale: 该词指因出生状况而被排除的人，但其确切范围有争议；这样译避免把它过窄地限定为现代意义的“非婚生子女”，也避免传统称谓在现代汉语中的侮辱色彩。
- source_word: יָבֹא
  choice: 不可加入
  rationale: 原义为“来、进入”；在有关会众资格的律例语境中，“不可加入”自然表达禁止进入或参与的意思。
- source_word: קְהַל יְהוָה
  choice: 耶和华的会众
  rationale: קהל 指聚集起来的群体或共同体；“会众”在现代中文圣经语体中庄重而易懂，并保留其群体含义。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的专名“耶和华”表达四字神名，区别于称号“主”。
- source_word: גַּם דּוֹר עֲשִׂירִי
  choice: 即使到了第十代
  rationale: 保留该希伯来律例公式所表达的延续范围和强调语气。
- source_word: לֹא יָבֹא לוֹ
  choice: 他的后代也不可加入
  rationale: 结合“第十代”的上下文，לוֹ 指与此人相属的后裔谱系；明译为“他的后代”可使现代读者清楚理解其所指。
theological_decisions:
- issue: “耶和华的会众”的范围
  choice: 保留“会众”，不具体解释为礼拜聚会、公民大会或整个盟约群体
  alternative: 译作“耶和华的集会”或在正文中说明具体成员资格
  rationale: קהל 在此处的制度性范围并不完全明确；保留宽泛的“会众”可避免在翻译中替某一种解释作决定。
- issue: מַמְזֵר 所指的出生身份
  choice: 正文采用概括性表达，并以脚注说明可能译法
  alternative: 直接译作“私生子”或“乱伦所生的人”
  rationale: 该词的确切法律范围存在争议，正文不应把它无根据地限定为某一种特定出生情形。
translation_notes:
  register: 采用现代、庄重而易懂的律例文体。“出身不合资格”刻意保持概括性；“加入会众”比字面的“进入会众”更符合现代汉语，同时不进一步断定这种排除具体涉及哪些宗教或社会权利。
