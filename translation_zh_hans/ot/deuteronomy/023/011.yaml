base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/011.yaml
  text: If there is among you a man who is not clean because of a nocturnal emission[a], he shall go outside the camp; he shall not come into the midst of the camp.
translation:
  language: zh_hans
  text: 你们中间若有男子因夜间遗精[a]而不洁净，他就要到营外去，不可进入营中。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“夜间发生的事”，在这里指夜间遗精。
    reason: 说明原文委婉说法及其语境含义。
lexical_decisions:
- source_word: כִּי
  choice: 若
  rationale: 本节是法律条文中的条件句；“若”自然地表达假设情形，不将其限定为时间意义。
- source_word: יִהְיֶה בְךָ אִישׁ
  choice: 你们中间若有人
  rationale: 保留存在句及群体范围。原文单数“你”指向以色列群体，汉语用“你们中间”更自然；后文所述情形明确涉及男性。
- source_word: אֲשֶׁר לֹא יִהְיֶה טָהוֹר
  choice: 不洁净
  rationale: 表达礼仪上的不洁状态，不暗示道德过错。
- source_word: מִקְּרֵה לָיְלָה
  choice: 因夜间遗精
  rationale: 原文字面为“夜间的事件”，在此是指造成礼仪不洁的夜间精液排出；正文采用现代汉语中明确、简洁的对应表达，并以脚注说明其字面形式。
- source_word: וְיָצָא אֶל מִחוּץ לַמַּחֲנֶה
  choice: 他就要到营外去
  rationale: 自然表达从营内移至营外的法律要求，并用“就要”承接条件句。
- source_word: לֹא יָבֹא אֶל תּוֹךְ הַמַּחֲנֶה
  choice: 不可进入营中
  rationale: “营中”保留 תּוֹךְ 所指营地内部的意味，同时符合现代汉语表达。
theological_decisions:
- issue: 本节所说不洁的性质
  choice: 译作礼仪状态上的“不洁净”，不赋予道德罪责含义
  alternative: 把这种不洁理解或表述为道德上的污秽
  rationale: 上下文讨论营地圣洁及身体排出所造成的礼仪状态；经文本身没有把此事定为个人的道德过犯。
translation_notes:
  register: 采用现代、庄重而易懂的法律条文语体。“夜间遗精”准确清楚；“不洁净”维持礼仪范畴；“营外／营中”简洁保留空间对照。
