revisions:
- from: 因为耶和华你的神行走在你的营中，为要搭救你，把你的仇敌交在你手中[a]。所以你的营必须圣洁，免得他在你中间看见什么不雅之物[b]，就转身离开你[c]。
  to: 因为耶和华你的神行走在你的营中，为要搭救你，把你的仇敌交在你手中[a]。所以你的营必须圣洁，免得他在你中间看见任何不雅之事[b]，就转身离开你[c]。
  rationale: 仅作一处安全的词类与语义范围校正：以“任何不雅之事”替换“什么不雅之物”。这避免把原文宽泛的 דָּבָר 限定为物体，同时维持原有的语气、逻辑、脚注锚点和译文含义。
