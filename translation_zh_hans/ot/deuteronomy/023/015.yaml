base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/015.yaml
  text: For Yahweh your God walks in the midst of your camp to deliver you and to give your enemies before you[a]. Therefore your camp must be holy[c][b], so that he may not see in you anything indecent and turn away from you.
translation:
  language: zh_hans
  text: 因为耶和华你的神行走在你的营中，为要搭救你，把你的仇敌交在你手中[a]。所以你的营必须圣洁，免得他在你中间看见任何不雅之事[b]，就转身离开你[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“把你的仇敌交在你面前”；这是希伯来语习语，意思是把他们交在你手中，使你能够制伏他们。
    reason: lexical_alternative
  - marker: b
    text: 或译“什么可耻的事”。原文表达的范围较广，可指使营地受到玷污的羞耻或不洁之事。
    reason: lexical_alternative
  - marker: c
    text: 直译“从你后面转回去”，描绘耶和华不再伴随行进中的营队。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者最熟悉的专名形式，明确保留原文的盟约之名，而不以“主”替代。
- source_word: מִתְהַלֵּךְ
  choice: 行走
  rationale: 保留希伯来文具体而拟人化的行动意象，表达神亲自在营中往来，而不抽象化为“同在”。
- source_word: בְּקֶרֶב מַחֲנֶךָ
  choice: 在你的营中
  rationale: 自然地表达神位于营地内部、在百姓中间的意思。
- source_word: לְהַצִּילְךָ
  choice: 搭救你
  rationale: 符合军事处境，表达从敌人手中救援，且不过度引入后期神学术语。
- source_word: וְלָתֵת אֹיְבֶיךָ לְפָנֶיךָ
  choice: 把你的仇敌交在你手中
  rationale: 将希伯来习语转化为清楚的现代汉语，表达把敌人交由以色列制伏；脚注保留其字面形式。
- source_word: וְהָיָה מַחֲנֶיךָ קָדוֹשׁ
  choice: 所以你的营必须圣洁
  rationale: 上下文表明这是因神临在而产生的规范性要求；“必须”准确传达其命令性作用。
- source_word: עֶרְוַת דָּבָר
  choice: 什么不雅之物
  rationale: 该表达较宽泛，既与本段排泄卫生的直接语境相连，也可涵盖可耻或污秽之事，避免把含义局限于裸露。
- source_word: וְשָׁב מֵאַחֲרֶיךָ
  choice: 就转身离开你
  rationale: 用自然中文表达神不再伴随营队的结果；脚注说明原文更具体的空间意象。
theological_decisions:
- issue: 耶和华临在的拟人化描写
  choice: 保留“行走在你的营中”
  alternative: 译作“与你们同在”或“临在于营中”
  rationale: 原文有意使用具体的行走图像，以神的临近作为营地必须圣洁的根据；保留该图像并不等于断言神具有肉身。
- issue: 营地圣洁条款的语气
  choice: 译作“你的营必须圣洁”
  alternative: 译作“你的营要成为圣洁”或“你的营必圣洁”
  rationale: 此处在语境中具有规范和命令作用，不只是对未来状态的预测。
- issue: 神“转身离开”的含义
  choice: 保留神可能离开营队的严肃警告
  alternative: 弱化为失去帮助或祝福
  rationale: 原文直接描述神因看见营中污秽而转回，不宜用抽象神学解释取代这一张力鲜明的空间图像。
translation_notes:
  register: 采用庄重而自然的现代标准汉语；保留“行走”“圣洁”等核心经文用语，同时用“交在你手中”“不雅之物”等普通读者容易理解的表达。各分句保持因由、要求、警告的逻辑推进。
