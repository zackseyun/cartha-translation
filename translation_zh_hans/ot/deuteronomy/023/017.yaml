base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/017.yaml
  text: He shall live with you[a], in your midst, in the place that he chooses within one of your gates, wherever it is good for him[b]; you shall not oppress him.
translation:
  language: zh_hans
  text: 他要与你同住[a]，在你中间，在你各城中的一处，就是他所选择、对他合宜的地方；你不可欺压他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “同住”也可译作“居住”或“停留”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵשֵׁב
  choice: 同住／住
  rationale: 该动词可指坐下、停留或居住；本节是关于获准定居的律例，译作“同住／住”既自然，也保留持续居住的含义。
- source_word: עִמְּךָ
  choice: 与你
  rationale: 介词短语直译为“与你”；后面的“在你中间”进一步表明是在共同体内部居住。
- source_word: בְּקִרְבְּךָ
  choice: 在你中间
  rationale: 此处表示处在以色列共同体之内；该译法保留原文的空间和群体意象。
- source_word: בַּמָּקוֹם אֲשֶׁר יִבְחַר
  choice: 住在他所选择……的地方
  rationale: 选择者是前一节所说逃来的奴仆，而不是以色列或耶和华；译文明确保留他选择居所的权利。
- source_word: בְּאַחַד שְׁעָרֶיךָ
  choice: 在你的一座城中
  rationale: “城门”在希伯来语中常借代有城门的城镇或当地社群；正文采用现代汉语自然表达，并以脚注说明原文字面意象。
- source_word: בַּטּוֹב לוֹ
  choice: 认为对自己合宜
  rationale: 原文近似“在对他好的〔地方〕”，可表示从他的处境和判断看合宜或好的地方；此译法不把含义缩减为一时的喜好。
- source_word: לֹא תּוֹנֶנּוּ
  choice: 你不可欺压他
  rationale: 该动词在律法语境中有压迫、剥削或亏待弱势者之意；“欺压”准确传达其社会和道德力度。
theological_decisions:
- issue: 阳性单数代词的所指
  choice: 用“他”指前一节逃来的奴仆，并保留原文阳性单数形式。
  alternative: 用“此人”等不标明性别的表达。
  rationale: 希伯来文全节使用阳性单数形式，且语境承接前一节的单数“奴仆”；译文不将其擅自改为复数或性别中性形式。
- issue: 住处选择权的主体
  choice: 明确由逃来的奴仆本人选择居住地点。
  alternative: 理解为由收留他的以色列共同体为他指定地点。
  rationale: אֲשֶׁר יִבְחַר 的阳性单数主语自然承接该奴仆；原文没有另换主语的标记。
translation_notes:
  register: 采用现代、庄重而易懂的律法语体。保留原文对集体以色列使用的第二人称单数“你”，并以“就在”自然连接“与你”和“在你中间”两个相近短语。
