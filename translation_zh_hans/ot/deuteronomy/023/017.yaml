revisions:
- from: 他要与你同住[a]，就在你中间，在你的一座城中[b]，住在他所选择、认为对自己合宜的地方；你不可欺压他。
  to: 他要与你同住[a]，在你中间，在你各城中的一处，就是他所选择、对他合宜的地方；你不可欺压他。
  rationale: 修订使“一个城门／城镇之一”的含义在现代汉语中更明确，并消除重复用词和修饰歧义。脚注 b 保留了原文“城门”的字面意象及其借代用法，且应锚定在“在你各城中的一处”之后。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T04:57:40Z'
review_pass:
  verdict: revise
  source_fidelity: 译文总体准确传达了此人获准在以色列共同体中居住、由他选择居所、且不得受欺压的含义。“欺压”恰当对应 לֹא תּוֹנֶנּוּ。不过“在你的一座城中”虽可理解，却较易被读作泛指某一座城，而未充分显出“你各城中的一处”（בְּאַחַד שְׁעָרֶיךָ）的分配性表达；改为“在你各城中的一处”更自然而贴近原文。
  naturalness: 原文“他要与你同住……住在他所选择……”中“住”重复，且“他所选择、认为对自己合宜的地方”略有并列修饰歧义，仿佛“选择”和“认为”是两个同等动作。将地点短语整合为“就是他所选择、对他合宜的地方”，可更清楚地表达希伯来文“在他认为好的地方”。
  terminology: “同住／居住”“在你中间”“欺压”均符合现代庄重的经文语体。“城门”借指城镇或社群的说明应保留在脚注中；正文采用“各城中的一处”是恰当的功能对等表达。
  issues:
  - severity: low
    issue: “在你的一座城中”的表达不够明确
    rationale: בְּאַחַד שְׁעָרֶיךָ 是“在你的城门〔即城镇〕之一中”，汉语“在你的一座城中”略显生硬，也没有“各……之一”的自然分配感。
  - severity: low
    issue: “住”重复，地点修饰关系略显含混
    rationale: 希伯来文只用一次“居住”；“同住……住在”在汉语中略显累赘。“他所选择、认为对自己合宜的地方”也可优化为直接修饰地点的表达。
  revised_text: 他要与你同住[a]，在你中间，在你各城中的一处，就是他所选择、对他合宜的地方；你不可欺压他。
  revised_footnotes:
  - marker: a
    text: “同住”也可译作“居住”或“停留”。
    reason: lexical_alternative
  - marker: b
    text: “在你各城中的一处”原文直译为“在你的一个城门内”；“城门”在这里借指城镇或当地社群。
    reason: cultural_note
  revision_rationale: 修订使“一个城门／城镇之一”的含义在现代汉语中更明确，并消除重复用词和修饰歧义。脚注 b 保留了原文“城门”的字面意象及其借代用法，且应锚定在“在你各城中的一处”之后。
