  text: כִּֽי תִדֹּ֥ר נֶ֨דֶר֙ לַ/יהוָ֣ה אֱלֹהֶ֔י/ךָ לֹ֥א תְאַחֵ֖ר לְ/שַׁלְּמ֑/וֹ כִּֽי דָּרֹ֨שׁ יִדְרְשֶׁ֜/נּוּ יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ מֵֽ/עִמָּ֔/ךְ וְ/הָיָ֥ה בְ/ךָ֖ חֵֽטְא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/022.yaml
  text: But if you make a vow to Yahweh your God[a], you shall not delay in paying it, for Yahweh your God will surely require it from you, and it will be sin in you.
translation:
  language: zh_hans
  text: 你若向雅威你的上帝许愿，就不可迟延履行所许的愿，因为雅威你的上帝必定会向你追讨；你就有罪了[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译：“罪会在你里面。”也可译作：“你就要担当罪责。”
    reason: 原文 בְךָ חֵטְא 是紧凑的希伯来语表达；主译按现代汉语表达其罪责含义，脚注保留原文的介词结构及另一种自然译法。
lexical_decisions:
- source_word: כִּי
  choice: 你若
  rationale: 此处结合上下文引出条件情形。汉语用“若”即可自然表达条件关系，无须另加生硬的转折词。
- source_word: תִדֹּר נֶדֶר
  choice: 许愿
  rationale: 动词与同根名词连用，意为立下誓愿；“许愿”是现代汉语中自然、简洁的对应表达。
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: 向雅威你的上帝
  rationale: 介词表明誓愿所指向的对象；“雅威”按四字神名的专名读法翻译，而“你的上帝”保留原文的关系性称谓。
- source_word: לֹא תְאַחֵר לְשַׁלְּמוֹ
  choice: 就不可迟延还愿
  rationale: 否定未完成式在律法语境中表达禁令；שלם用于誓愿时指履行所许之愿，汉语“还愿”准确且避免误解为仅仅偿付金钱。
- source_word: דָּרֹשׁ יִדְרְשֶׁנּוּ
  choice: 必定向你追讨
  rationale: 不定式绝对形与限定动词连用，加强语气；“必定”体现强调，“追讨”表达上帝要求许愿者履行所许之愿的法律性和严肃性。
- source_word: מֵעִמָּךְ
  choice: 向你
  rationale: 此处表示上帝要从许愿者本人那里追究并索取所应履行的义务，配合汉语动词“追讨”译作“向你”最自然。
- source_word: וְהָיָה בְךָ חֵטְא
  choice: 你就有罪了
  rationale: 这是原文紧凑表达在现代汉语中的自然译法，说明迟延履行誓愿会使许愿者负罪；脚注保留其较直译的措辞。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名יהוה。“雅威”对应较通行的YHWH学术重构读音，并避免把神名改译为称号；“耶和华”是传统形式，但通常对应Jehovah的历史读法。
- issue: 末句所表达的罪责
  choice: 你就有罪了
  alternative: 这罪就在你身上
  rationale: 主译采用自然现代汉语，明确表达许愿后迟延履行所产生的罪责；脚注保留原文介词结构的形象和可能的语义张力，不进一步规定罪责的机制。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“许愿—还愿”构成自然对应；“不可迟延”和“必定追讨”保留律法语气及原文强调。称谓统一用“雅威你的上帝”，不增添宗派性解释。
