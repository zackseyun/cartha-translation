  text: לֹא יִקַּ֥ח אִ֖ישׁ אֶת אֵ֣שֶׁת אָבִ֑י/ו וְ/לֹ֥א יְגַלֶּ֖ה כְּנַ֥ף אָבִֽי/ו־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/001.yaml
  text: A man shall not take his father’s wife[b][a], nor uncover his father’s skirt.
translation:
  language: zh_hans
  text: 男子不可娶父亲的妻子[a]，也不可揭开父亲的衣角[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“取父亲的妻子。”这里的“取”可指娶为妻。
    reason: lexical_alternative
  - marker: b
    text: “衣角”直译可指衣服的边缘或角。这是涉及性关系的委婉说法，指侵犯父亲的婚姻或性权利；也可理解为“露父亲的赤身”或“侵犯父亲的婚床”。
    reason: alternative_reading
lexical_decisions:
- source_word: יִקַּח
  choice: 娶
  rationale: לָקַח以“妻子”为宾语时可表示娶妻。“娶”在现代汉语中自然地表达这里的婚姻含义；脚注保留较为字面的“取”。
- source_word: אִישׁ
  choice: 人
  rationale: 此处是单数阳性名词，用于法律禁令中的行为主体。汉语“人不可……”自然简洁，并不改变该禁令所针对的男性主体，因为后文“娶父亲的妻子”已明确语境。
- source_word: אֵשֶׁת אָבִיו
  choice: 父亲的妻子
  rationale: 直译该结构，不缩窄为“继母”；后者可能符合常见情形，却比原文更具体。
- source_word: יְגַלֶּה
  choice: 掀开
  rationale: גלה在此以כְּנַף为宾语，表示揭开或掀开。译作“掀开”可保留衣物意象及委婉表达。
- source_word: כְּנַף
  choice: 衣襟
  rationale: כָּנָף可指翼、边缘，也可指衣服的边缘或衣襟。这里是涉及婚姻或性关系的委婉语；“衣襟”既保留具体比喻，也避免直接把原文改写成“下体”或“婚床”。
theological_decisions:
- issue: 是否在正文中明说该委婉语所指的性关系
  choice: 正文保留“掀开父亲的衣襟”这一比喻，并以脚注解释
  alternative: 与父亲的妻子发生性关系；侵犯父亲的婚床；露出父亲的下体
  rationale: 原文没有采用常见的“露下体”完整表达，而使用כְּנַף这一含蓄且具有多义性的衣物意象。保留比喻可避免将其含义过度限定，同时脚注帮助现代读者理解其婚姻及性方面的含意。
- issue: “娶”是否过度明确לָקַח的含义
  choice: 正文译为“娶”，脚注保留字面译法“取”
  alternative: 取父亲的妻子
  rationale: לָקַח与“妻子”连用时通常具有娶为妻的含义。“娶”符合现代汉语法律禁令的表达；脚注则显示原文用词本身较宽。
translation_notes:
  register: 采用庄重、简明的现代汉语法律禁令句式。“父亲的妻子”保留原文关系称谓，不解释性地改成“继母”；“衣襟”保留希伯来文含蓄而略带张力的衣物意象，并通过脚注说明。
