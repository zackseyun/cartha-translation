base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/004.yaml
  text: No Ammonite or Moabite may enter the assembly of Yahweh[a]; even to the tenth generation[b], none of them may enter the assembly of Yahweh forever.
translation:
  language: zh_hans
  text: 亚扪人或摩押人不可进入耶和华的会众[a]；即使到第十代[b]，他们也不可进入耶和华的会众，直到永远。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “会众”也可译作“大会”或“集会”。这里指耶和华子民正式聚集而成的群体。
    reason: lexical_alternative
  - marker: b
    text: 希伯来原文既说“第十代”，又说“永远”。译文保留这两种表达，不用其中一个消解另一个。
    reason: cultural_note
lexical_decisions:
- source_word: יָבֹא
  choice: 可进入
  rationale: 在法律语境中，לֹא加未完成式表达禁止或不准加入；“不可进入”自然传达资格上的排除，也保留“进入”的原文意象。
- source_word: עַמּוֹנִי וּמוֹאָבִי
  choice: 亚扪人或摩押人
  rationale: 采用现代汉语中通行的族名；在否定禁令中用“或”自然表达两类人无论哪一类都在禁令之内。
- source_word: קְהַל יְהוָה
  choice: 耶和华的会众
  rationale: קָהָל在此指正式聚集的圣约群体；“会众”庄重、通顺，并避免把它仅理解为一次普通集会。יְהוָה按其专名译作“耶和华”，而非以“主”这一称号代替。
- source_word: גַּם דּוֹר עֲשִׂירִי
  choice: 即使到了第十代
  rationale: “即使……也……”体现גַּם在这里的加强作用，“到了第十代”保留世代界限的原文表达。
- source_word: לָהֶם
  choice: 他们中间的人
  rationale: 该代词回指亚扪人和摩押人；此译法在汉语中比直译“对他们”清楚，同时不擅自把所指严格限定为某一种亲属关系。
- source_word: עַד עוֹלָם
  choice: 永远
  rationale: 简明保留持续无尽的时间表达，并与“第十代”同时呈现，不把两者合并解释。
theological_decisions:
- issue: “第十代”与“永远”的关系
  choice: 在正文中同时保留“即使到了第十代”和“永远”
  alternative: 把“第十代”直接解释成“永不”，或弱化“永远”
  rationale: 希伯来文本明确并列两种时间表达。译文应保留这种加强语势及其张力，不在翻译中预先判定两者的逻辑关系。
- issue: “耶和华的会众”的范围
  choice: 保留概括性的“会众”
  alternative: 具体化为宗教礼仪集会、公民大会或婚姻共同体
  rationale: קָהָל在本节的确切准入范围存在解释空间；译文不将其收窄为某一种后来的制度性理解。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“不可进入”保持法律条文的语气；分号呈现两句禁令的重复加强结构。正文中的[a]、[b]与脚注一一对应。
