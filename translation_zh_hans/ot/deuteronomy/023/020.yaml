revisions:
- from: 不可向你的弟兄收取利息，无论是钱财的利息、粮食的利息，还是任何可以收取利息之物的利息。
  to: 不可向你的弟兄收取利息：钱的利息、食物的利息，或任何借出而收取利息之物的利息。
  rationale: The revision retains the source’s repeated “interest of …” structure and its broad final category, while clarifying that the final item is something lent out at interest. It also uses terms that more directly reflect money and food without adding interpretive restrictions.
  reviewer_model: gpt-5.6-terra
