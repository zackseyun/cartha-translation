  text: לֹא תַשִּׁ֣יךְ לְ/אָחִ֔י/ךָ נֶ֥שֶׁךְ כֶּ֖סֶף נֶ֣שֶׁךְ אֹ֑כֶל נֶ֕שֶׁךְ כָּל דָּבָ֖ר אֲשֶׁ֥ר יִשָּֽׁךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/020.yaml
  text: You shall not charge your brother interest on money[a], interest on food[c][b], or interest on anything that is lent at interest.
translation:
  language: zh_hans
  text: 不可向你的弟兄收取利息：钱的利息、食物的利息，或任何借出而收取利息之物的利息。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תַשִּׁיךְ
  choice: 向……收取利息
  rationale: 该词是 נשׁך 的使役形，在此法律语境中指向借款人索取或征收利息；这一译法自然地表明禁令针对收息者。
- source_word: לְאָחִיךָ
  choice: 你的弟兄
  rationale: 直译为“你的兄弟”，在申命记的盟约与群体语境中指同胞以色列人；保留亲属称谓可传达原文的家庭—盟约色彩。
- source_word: נֶשֶׁךְ
  choice: 利息
  rationale: 该词泛指贷款或借物所收的利息，并不只指过高或不合法的利息。
- source_word: כֶּסֶף
  choice: 钱财
  rationale: 本义为“银子”，但在法律经济语境中常指货币；“钱财”既自然，也能表达其货币用途。
- source_word: אֹכֶל
  choice: 粮食
  rationale: 该词泛指可食之物；在借贷项目的并列清单中，“粮食”比宽泛的“食物”更符合可借出并按量归还的物资语境。
- source_word: כָּל דָּבָר
  choice: 任何……之物
  rationale: 这是涵盖性的表达，把禁令扩展到钱财和粮食以外的一切可计息借贷物。
- source_word: אֲשֶׁר יִשָּׁךְ
  choice: 可以收取利息之物
  rationale: 关系从句概括任何会产生或被收取利息的对象；译文保留其宽泛性，不限定为某一种贷款形式。
theological_decisions:
- issue: “弟兄”的群体范围
  choice: 正文保留“你的弟兄”
  alternative: 你的以色列同胞／你的族人
  rationale: 原文以亲属语言表达盟约群体关系。直接改成“以色列同胞”会明确其语境所指，却会削弱原文刻意采用的家庭称谓；因此正文保留“弟兄”，不把范围解释直接写入译文。
- issue: נֶשֶׁךְ 是否仅指高利贷
  choice: 译作“利息”
  alternative: 高利贷
  rationale: 原词本身并未把禁令限于过高利率；译作“高利贷”会无根据地缩小法律要求的范围。
translation_notes:
  register: 采用简洁、庄重的现代汉语法律禁令句式。“不可”对应希伯来文否定命令；重复三次“利息”以保留原文列举和强调的修辞结构。正文没有脚注，因此无需脚注标记。
