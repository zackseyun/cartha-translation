base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/009.yaml
  text: Children born to them in the third generation may enter the assembly of Yahweh[a][b].
translation:
  language: zh_hans
  text: 他们第三代的子孙可以进入雅威的会众[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“儿子们”；在这里的法律和谱系语境中，指后代。
    reason: lexical_alternative
  - marker: b
    text: 或译：“第三代要进入。”希伯来文可以作较形式化的这样表达；这里的意思是，从第三代起获准进入。
    reason: alternative_reading
lexical_decisions:
- source_word: בָּנִים
  choice: 子孙
  rationale: 该词字面为“儿子们”，但在这一法律和谱系语境中泛指后代；“子孙”比“儿子”更准确地表达世代延续，也比“孩子”更适合“第三代”的表述。
- source_word: אֲשֶׁר יִוָּלְדוּ לָהֶם
  choice: 他们所生的
  rationale: 忠实表达 ילד 的被动形式及 לָהֶם 所表示的归属关系，同时符合现代汉语习惯。
- source_word: דּוֹר שְׁלִישִׁי
  choice: 到了第三代
  rationale: 表达获准进入所起始的世代节点；相较生硬的“第三代”，这一译法更清楚地传达法律语境中的时间界限。
- source_word: יָבֹא
  choice: 就可以进入
  rationale: 该动词字面为“来、进入”；在准入规定中，“可以进入”自然地表达许可含义，同时以脚注保留较形式对应的“要进入”。
- source_word: בִּקְהַל יְהוָה
  choice: 进入雅威的会众
  rationale: קהל 指聚集的共同体或会众；“会众”保留其盟约和群体含义。介词 ב 在 יָבֹא 的支配下译为“进入”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语中常见的音译呈现四字神名，保留其专名性质，不以称号替代。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较贴近通常重构的读音，并清楚保留这是专名。
- issue: 法律—谱系语境中 בָּנִים 的范围
  choice: 子孙
  alternative: 儿子们
  rationale: 原词为阳性复数，但这里论及后代的世代资格，并不需要将所指限定为男性；“子孙”保留谱系含义而不额外缩窄范围。
- issue: יָבֹא 在准入规定中的语气
  choice: 可以进入
  alternative: 要进入
  rationale: 上下文表达进入会众的资格，故正文采用许可式；同时原文未使用独立的“许可”词，因此以脚注保留形式上更直接的译法。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“到了……就可以……”清楚呈现世代界限和准入含义；脚注保留原文在性别用词及动词语气上的形式特征与歧义。
