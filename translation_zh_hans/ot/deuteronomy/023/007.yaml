base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/007.yaml
  text: You shall not seek their peace or their prosperity all your days forever[a].
translation:
  language: zh_hans
  text: 你一生的日子，永不可为他们谋求和平与福祉。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们的安康与益处。”这两个希伯来语词的语义范围较广，并不只指政治上的和平或经济上的繁荣。
    reason: 说明“和平”与“福祉”所对应的两个希伯来语词均有较宽的语义范围，并提供不缩窄原意的词汇替代。
lexical_decisions:
- source_word: תִדְרֹשׁ
  choice: 谋求
  rationale: דרש可指“寻求、求取、关切”。本句以抽象名词为宾语，“谋求”自然表达主动寻求或促成之意，又不把含义限于询问近况。
- source_word: שְׁלֹמָם
  choice: 他们的和平
  rationale: שָׁלוֹם涵盖和平、安宁、康泰与整体福祉。“和平”保留其核心且广为人知的含义，并与后面的טוֹבָה有所区别。
- source_word: טֹבָתָם
  choice: 他们的福祉
  rationale: טוֹבָה指好处、益处或良好境况。“福祉”比单说“好处”更适合群体处境，也不将其缩窄为经济繁荣。
- source_word: כָּל יָמֶיךָ
  choice: 你一生
  rationale: 希伯来语字面为“你所有的日子”，现代汉语用“你一生”自然表达其持续一生之意，并保留第二人称单数。
- source_word: לְעוֹלָם
  choice: 永远
  rationale: 该词强化禁令持续的时限；“永远”直接保留其强调作用。
theological_decisions:
- issue: “你一生”与“永远”在汉语中看似重复
  choice: 两者都保留，译作“你一生永远”
  alternative: 合并为“你一生都不可”或“你永远不可”
  rationale: 原文连续使用כָּל יָמֶיךָ和לְעוֹלָם，形成刻意的时限叠加。保留两项可反映原文的强调，而不替作者消解张力。
- issue: שָׁלוֹם与טוֹבָה的范围
  choice: 正文译为“和平与福祉”，脚注说明更宽泛的可能含义
  alternative: 译为“安康与好处”或“福利与益处”
  rationale: 两词都涉及良好状态，语义有交叠。“和平与福祉”既保持区分，又避免把前者仅政治化、后者仅经济化。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“不可”承载禁令语气；“谋求”体现主动寻求或促成。正文保留原文“一生／永远”的叠加强调，虽略显重复，却属有意的形式对应。
