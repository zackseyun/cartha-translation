  text: עַל דְּבַ֞ר אֲשֶׁ֨ר לֹא קִדְּמ֤וּ אֶתְ/כֶם֙ בַּ/לֶּ֣חֶם וּ/בַ/מַּ֔יִם בַּ/דֶּ֖רֶךְ בְּ/צֵאתְ/כֶ֣ם מִ/מִּצְרָ֑יִם וַ/אֲשֶׁר֩ שָׂכַ֨ר עָלֶ֜י/ךָ אֶת בִּלְעָ֣ם בֶּן בְּע֗וֹר מִ/פְּת֛וֹר אֲרַ֥ם נַהֲרַ֖יִם לְ/קַֽלְלֶֽ/ךָּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/005.yaml
  text: because they did not meet you with bread and water on the way when you came out from Egypt[a], and because he hired Balaam son of Beor from Pethor of Aram-naharaim against you to curse you.
translation:
  language: zh_hans
  text: 因为他们在路上没有带着饼和水来迎接你们，当你们从埃及出来的时候；又因为他雇用了来自两河亚兰[a]的毗夺、比珥之子巴兰，来咒诅你。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “两河亚兰”传统上被认为是美索不达米亚；这个名称的字面意思是“二河之亚兰”。
    reason: cultural_note
lexical_decisions:
- source_word: עַל דְּבַר
  choice: 因为
  rationale: 此惯用语说明前文禁令的缘由；“因为”自然、准确地表达因果关系。
- source_word: קִדְּמוּ אֶתְכֶם
  choice: 没有拿……来迎接你们
  rationale: קדמ在此指带着供应前来相迎；“迎接”保留相迎之意，而“拿食物和水来”使工具性短语在现代汉语中自然。
- source_word: בַּלֶּחֶם וּבַמַּיִם
  choice: 拿食物和水
  rationale: לחם可具体指饼，也常泛指食物；在“带着供应迎接”的语境中译为“食物”较自然，水则照原文保留。
- source_word: בַּדֶּרֶךְ בְּצֵאתְכֶם מִמִּצְרָיִם
  choice: 在路上……那时你们正从埃及出来
  rationale: 分别保留地点和时间关系，并以现代汉语重组语序，使句意清楚。
- source_word: וַאֲשֶׁר
  choice: 又因为
  rationale: 承接前一项理由，引出并列的第二项理由。
- source_word: שָׂכַר עָלֶיךָ
  choice: 雇了……来敌对你
  rationale: שׂכר意为“雇用”，עַל在此带有敌对方向；同时保留希伯来文由复数“你们”转为单数“你”的法律文体变化。
- source_word: בִּלְעָם בֶּן בְּעוֹר
  choice: 比珥之子巴兰
  rationale: 采用中文圣经传统中通行的人名音译，并明确保留父子关系。
- source_word: מִפְּתֹר אֲרַם נַהֲרַיִם
  choice: 来自两河亚兰毗夺
  rationale: 保留地名“毗夺”，并将区域名称按字面译为“两河亚兰”，不直接以“美索不达米亚”取代原文称谓。
- source_word: לְקַלְלֶךָּ
  choice: 要咒诅你
  rationale: 直接表达不定式所表示的目的，简洁且符合经文语体。
theological_decisions: []
