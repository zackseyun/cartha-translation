  text: לֹא תִהְיֶ֥ה קְדֵשָׁ֖ה מִ/בְּנ֣וֹת יִשְׂרָאֵ֑ל וְ/לֹֽא יִהְיֶ֥ה קָדֵ֖שׁ מִ/בְּנֵ֥י יִשְׂרָאֵל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/018.yaml
  text: There shall not be a cult prostitute from the daughters of Israel[a], and there shall not be a cult prostitute from the sons of Israel.
translation:
  language: zh_hans
  text: 以色列的女子中，不可有与异教祭祀有关的娼妓[a]；以色列的男子中，也不可有与异教祭祀有关的男娼。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “与异教祭祀有关的娼妓／男娼”或译“神庙娼妓／神庙男娼”。这里对应的希伯来语阴、阳性称谓，字面上与“圣别”或“分别出来”有关；传统上理解为与异教崇拜相关的女性和男性性服务者。至于这些称谓是否必然指卖淫，尤其是否指制度化的“神庙卖淫”，仍有争议。
    reason: 说明两个平行称谓的传统译法、字面词根及历史语义的不确定性；“神庙”作为替代译法保留在脚注，不在正文中过度限定原文未明说的地点。
lexical_decisions:
- source_word: קְדֵשָׁה
  choice: 祭祀娼妓
  rationale: 这是阴性名词，与“分别为圣”的词根有关，但在本禁令中传统上指参与异教祭祀性活动的女子。“祭祀娼妓”既显明宗教背景，也避免把该词误解为正面的“圣别女子”。
- source_word: קָדֵשׁ
  choice: 祭祀男娼
  rationale: 这是与 קְדֵשָׁה 平行的阳性名词；译作“祭祀男娼”保留性别区别和祭祀背景，也维持两句的对应关系。
- source_word: לֹא תִהְיֶה / וְלֹא יִהְיֶה
  choice: 不可有／也不可有
  rationale: 该结构在律法语境中表达禁止。“不可有”符合现代汉语法规式语气，并自然对应希伯来文的存在动词。
- source_word: מִבְּנוֹת יִשְׂרָאֵל / מִבְּנֵי יִשְׂרָאֵל
  choice: 以色列的女子中／以色列的男子中
  rationale: 这里的 מִן 表示群体范围，汉语用“……中”比直译“从……出来”自然准确；“女子／男子”保留原文“女儿／儿子”的性别对称，同时避免现代汉语中“以色列的女儿／儿子”可能产生的亲属歧义。
theological_decisions:
- issue: קְדֵשָׁה／קָדֵשׁ 在本禁令中的含义
  choice: 正文按传统语境理解为参与异教祭祀性活动的女性和男性娼妓，并以脚注交代词义上的不确定性。
  alternative: 按词根直译为“圣别的女子／男子”或理解为一般祭祀人员，不明确断定卖淫行为。
  rationale: 该词根本身与“圣别”有关，但在申命记的禁令及相关经文语境中通常被理解为受禁止的异教祭祀角色。由于这些称谓是否必然指制度化的“神庙卖淫”仍有争议，正文采用传统且语境清楚的译法，脚注保留字面含义及学术上的不确定性。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“不可有”保留律法禁令的语气；两分句以“女子中／男子中”和“娼妓／男娼”形成原文的性别平行。避免使用容易被理解为合法或正面身份的“圣女／圣男”，也不在正文中过度限定具体神庙场所。
