source:
  edition: WLC
  text: לֹא תָבִיא֩ אֶתְנַ֨ן זוֹנָ֜ה וּ/מְחִ֣יר כֶּ֗לֶב בֵּ֛ית יְהוָ֥ה אֱלֹהֶ֖י/ךָ לְ/כָל נֶ֑דֶר כִּ֧י תוֹעֲבַ֛ת יְהוָ֥ה אֱלֹהֶ֖י/ךָ גַּם שְׁנֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/019.yaml
  text: You shall not bring the wages of a prostitute or the price of a dog into the house of Yahweh your God for any vow[a], because both of them are an abomination to Yahweh your God.
translation:
  language: zh_hans
  text: 你不可把妓女的酬金或狗的价钱[a]带进雅威你上帝的殿，为履行任何誓愿，因为这两样都是雅威你上帝所憎恶的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “狗”也可能是对男妓的贬称；若如此，这句话可理解为“男妓的价钱”。
    reason: 保留 מְחִיר כֶּלֶב 的争议性解释，同时让正文维持希伯来文的字面措辞。
lexical_decisions:
- source_word: תָבִיא
  choice: 带进
  rationale: 此处使役形表达把某物带入一个地方；“带进”自然地保留了动作及方向。
- source_word: אֶתְנַן זוֹנָה
  choice: 妓女的酬金
  rationale: אֶתְנַן 指付给人的报酬，זוֹנָה 指妓女；“酬金”清楚表达交易所得，又不弱化原文。
- source_word: מְחִיר כֶּלֶב
  choice: 狗的价钱
  rationale: מְחִיר 通常指价钱，כֶּלֶב 的字面意义是“狗”。原文所指存在争议，因此正文保留字面表达，不把特定解释直接写入译文。
- source_word: בֵּית יְהוָה אֱלֹהֶיךָ
  choice: 雅威你上帝的殿
  rationale: בֵּית 字面为“房屋、家”，在敬拜语境中“殿”是自然庄重的汉语表达；יְהוָה 按其专名译为“雅威”。
- source_word: לְכָל נֶדֶר
  choice: 作为还任何愿的献礼
  rationale: 介词短语说明把这些钱带入圣所的用途，与履行所许之愿有关；此译法在汉语中明确自然，同时不限定具体献礼种类。
- source_word: תוֹעֲבַת
  choice: 所憎恶的
  rationale: 该词表示在上帝面前可憎、令人厌恶之物；“所憎恶的”保留其强烈的道德与礼仪判断，并符合现代汉语表达。
- source_word: גַּם שְׁנֵיהֶם
  choice: 这两样都是
  rationale: 明确强调前述两项无一例外都包括在判断之内。
theological_decisions:
- issue: מְחִיר כֶּלֶב 中 כֶּלֶב 的解释
  choice: 正文按字面译为“狗”
  alternative: 理解为对男妓，尤其男性庙妓的贬称
  rationale: כֶּלֶב 的直接词义是“狗”，而其在此是否为男妓的隐语并不确定。正文保留原文的真实歧义，另以脚注说明可能解释。
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；“雅威”较直接地呈现其作为专名的性质，避免以称号取代。
- issue: “这两样”所涵盖的对象
  choice: 指妓女的酬金与狗的价钱两项
  alternative: 若“狗”是男妓的隐语，则指两类性交易所得
  rationale: 语法上 שְׁנֵיהֶם 回指紧邻的两项，但第二项的具体所指仍取决于 כֶּלֶב 的解释；译文不进一步裁定。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“妓女”“酬金”“价钱”直接清楚；“殿”体现敬拜场所语境，但不使用后期特定圣殿名称。句法尽量贴近希伯来文的禁令、用途说明和理由结构。
