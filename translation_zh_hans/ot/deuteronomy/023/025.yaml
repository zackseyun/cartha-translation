base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/025.yaml
  text: When you enter your neighbor’s vineyard[a], you may eat grapes as your appetite desires, until you are satisfied[c][b], but you shall not put any into your container.
translation:
  language: zh_hans
  text: 你进入邻舍的葡萄园时[a]，可以按自己的食欲吃葡萄，直到吃饱[b]；但不可把葡萄放进自己的容器[c]里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“如果你进入邻舍的葡萄园。”希伯来语连接词既可引出时间情形，也可引出条件情形。
    reason: lexical_alternative
  - marker: b
    text: 直译近似“照你的心愿，至于你的饱足”；这是指按自己的食欲吃，直到满足。
    reason: lexical_alternative
  - marker: c
    text: 或译：“器具”或“器皿”。希伯来语泛指器物、用具或容器，并未说明具体是哪一种。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ……时
  rationale: 此处引出法律条款所设想的情形，可表示时间或条件；正文采用自然的“……时”，并以脚注保留“如果”的可能。
- source_word: תָבֹא בְּכֶרֶם
  choice: 进入……的葡萄园
  rationale: בוא 与 בְּ 连用在此表示进入某处；这样译成现代汉语自然，也准确呈现空间关系。
- source_word: רֵעֶךָ
  choice: 邻舍的
  rationale: רֵעַ 可指邻舍、同伴或同胞；在财产法规的语境中，“邻舍”既简洁又符合源词的一般范围。
- source_word: וְאָכַלְתָּ עֲנָבִים
  choice: 可以……吃葡萄
  rationale: 在本条法律语境中，此形式表达许可，而非要求人必须吃；“可以”清楚传达这一法律功能。
- source_word: כְּנַפְשְׁךָ שָׂבְעֶךָ
  choice: 随意吃……直到吃饱
  rationale: 这里的 נֶפֶשׁ 指人的欲望或食欲，שֹׂבַע 指饱足；合起来是按食欲吃到满足，并非“灵魂”的神学用法。
- source_word: כֶּלְיְךָ
  choice: 自己的器具里
  rationale: כְּלִי 是广义的器物、用具或容器；“器具”保留其非特指性，不擅自限定为篮子或袋子。
- source_word: לֹא תִתֵּן
  choice: 不可装进
  rationale: נתן 基本义为给、放置；与器具搭配时，“装进”符合汉语习惯，所装之物由前文的葡萄自然承接。
