base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/021.yaml
  text: You may charge interest to a foreigner[a], but to your brother you shall not charge interest[b], so that Yahweh your God may bless you in all the work of your hand in the land that you are entering to possess.
translation:
  language: zh_hans
  text: 你可以向外族人收取利息[a]，却不可向你的弟兄收取利息[b]，好叫雅威——你的上帝——在你将要进入并取得为业的土地上，在你手所做的一切事上赐福给你。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “收取利息”也可理解为“以收息的方式借贷”或“索取利息”；这里并非专指盘剥性的高利贷。
    reason: lexical_alternative
  - marker: b
    text: 这里的“弟兄”指同属以色列共同体的人；希伯来原文保留了亲属称谓。
    reason: cultural_note
lexical_decisions:
- source_word: לַנָּכְרִי
  choice: 向外族人
  rationale: נָכְרִי 指不属于以色列共同体的外族人，与下文“你的弟兄”形成法律和社会身份上的对比；“外族人”比“陌生人”准确，也避免“外邦人”可能带来的后期宗教色彩。
- source_word: תַשִּׁיךְ / לֹא תַשִּׁיךְ
  choice: 收取利息／不可收取利息
  rationale: נשׁך 的使役式在借贷律例中指要求或收取利息。“收取利息”是现代汉语的自然说法，不预先把一切利息定性为盘剥性的“高利贷”。
- source_word: אָחִיךָ
  choice: 你的弟兄
  rationale: 保留希伯来文的男性亲属称谓及其共同体意象；在本律例语境中，所指是同属以色列共同体的人。
- source_word: לְמַעַן
  choice: 好让
  rationale: 自然表达目的及预期结果，同时保留顺从律例与蒙福之间的关系。
- source_word: יְבָרֶכְךָ יְהוָה אֱלֹהֶיךָ
  choice: 雅威你的上帝……赐福给你
  rationale: 将四字神名 יְהוָה 音译为“雅威”，保留经文中的盟约之名；目的从句中的动词按预期结果译为“赐福给你”。
- source_word: בְּכֹל מִשְׁלַח יָדֶךָ
  choice: 在你手所做的一切事上
  rationale: מִשְׁלַח יָד 是指人所从事或着手的一切工作；译文保留“手”的希伯来意象，同时让现代读者容易理解。
- source_word: עַל הָאָרֶץ
  choice: 在……土地上
  rationale: עַל 字面为“在……之上”，此处按汉语地点表达习惯译作“在……土地上”。
- source_word: אֲשֶׁר אַתָּה בָא שָׁמָּה לְרִשְׁתָּהּ
  choice: 你将要进去占领的
  rationale: בוא 表示进入，לְרִשְׁתָּהּ 表目的，即取得并占有那地；“进去占领”简洁保留了动作与目的。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用盟约神名；“雅威”较贴近学界通常采用的拟音，也不以称号“主”代替专名。
- issue: “弟兄”的共同体含义
  choice: 正文保留“你的弟兄”，脚注说明为同属以色列共同体的人
  alternative: 正文直译为“以色列同胞”
  rationale: 保留律法中亲属语言的修辞和盟约共同体观念，同时以脚注避免现代读者误解为仅指亲生兄弟。
- issue: 准许向外族人收取利息的表述
  choice: 按原文保留明确的准许与禁止对比
  alternative: 将准许弱化为事实描述
  rationale: 希伯来文以肯定式与否定式直接对照；译文不扩展其适用范围，也不把后来的利息伦理判断带入本节。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。句式保留原文“外族人／弟兄”和“可以／不可”的鲜明对照；“在你手所做的一切事上”保留希伯来语的身体意象，但避免过度生硬。
