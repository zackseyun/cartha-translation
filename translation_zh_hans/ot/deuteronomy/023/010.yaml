base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/010.yaml
  text: When you go out as an army against your enemies[a], then keep yourself from every evil thing.
translation:
  language: zh_hans
  text: 你出兵攻打仇敌时，要谨慎自守，远离一切恶事[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“一切不洁之物”或“任何不合宜的事”。这个希伯来语短语含义宽泛；在本段语境中可能包括礼仪上的不洁，但并不限于此。
    reason: 词义存在合理的宽窄差异，需保留原文可能同时涵盖道德、礼仪及一般不当之事的开放性。
lexical_decisions:
- source_word: כִּי
  choice: ……时
  rationale: 这里引出命令所适用的情境；用“……时”自然表达法律训令中的时间或情境关系，而不强化为纯粹假设性的“如果”。
- source_word: תֵצֵא מַחֲנֶה
  choice: 你出兵
  rationale: יצא 的基本意思是“出去”，מַחֲנֶה 可指营地，也可转指扎营作战的军队。结合“攻打仇敌”的军事语境，“出兵”简明自然地传达整句含义，同时不增添具体行军细节。
- source_word: עַל אֹיְבֶיךָ
  choice: 攻打仇敌
  rationale: עַל 在军事语境中具有敌对、针对之意；“攻打”比逐字的“向着”更符合现代汉语表达。אֹיְבֶיךָ 直译为“你的仇敌”，汉语中省略物主词更自然，所指不变。
- source_word: וְנִשְׁמַרְתָּ
  choice: 要谨慎自守
  rationale: שׁמר 的尼法勒式在此有反身性的警戒意味。“谨慎自守”既保留对自身的约束，也符合训令语体。
- source_word: מִכֹּל
  choice: 远离一切
  rationale: 介词 מִן 与 שׁמר 连用，表示防备并避开某物；“远离一切”在汉语中清楚表达这一关系及 כֹּל 的总括范围。
- source_word: דָּבָר רָע
  choice: 恶事
  rationale: דָּבָר 可指事、物或情形，רָע 可指邪恶、不良或不合宜。“恶事”保留短语的宽泛性，不把含义限定为道德罪恶或礼仪不洁。
theological_decisions:
- issue: 营地圣洁法规中 דָּבָר רָע 的范围
  choice: 正文宽泛译作“一切恶事”
  alternative: 一切不洁之物；任何不合宜的事
  rationale: 下文涉及礼仪不洁，但本节的希伯来语措辞本身范围更广。正文不把它限定为礼仪层面，脚注则说明语境中可能包含不洁与不合宜之事，以保留原文的张力。
translation_notes:
  register: 采用现代、庄重而易懂的训令语体。“出兵”“攻打仇敌”交代军事场景，“谨慎自守”保留反身警戒意味；脚注标记置于其实际解释的“一切恶事”之后。
