  text: You shall not hand over to his master a slave who has escaped from his master to you[a].
translation:
  language: zh_hans
  text: 不可把从主人那里逃到你这里来的奴隶交还给他的主人[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“仆人”。希伯来语这个词可指仆人或奴隶；这里采用“奴隶”，因为此人受主人辖制的身份是本条律法的重点。
    reason: lexical_alternative
lexical_decisions:
- source_word: תַסְגִּיר
  choice: 交还
  rationale: 此处使役形表示把人交到另一人的控制之下；结合逃奴与其主人的语境，“交还”自然地表达不得遣返给主人，同时保留法律命令的力度。
- source_word: עֶבֶד
  choice: 奴隶
  rationale: 该人的受辖制身份以及与主人的关系是本条律法的核心；“奴隶”比“仆人”更明确地传达这种依附状态。
- source_word: אֶל אֲדֹנָיו
  choice: 给主人
  rationale: אָדוֹן在此为社会法律关系中的主人，并非神圣称号；“主人”符合现代汉语表达。
- source_word: אֲשֶׁר יִנָּצֵל
  choice: 逃到……来的
  rationale: נצל的尼斐勒形可指获救或逃脱；在离开主人而来到以色列人的语境中，“逃到……来”最贴切，并以关系从句保留אֲשֶׁר的结构作用。
- source_word: אֵלֶיךָ
  choice: 到你这里来
  rationale: 介词אֶל表示朝向受话者的移动；“到你这里来”明确保留方向性。
- source_word: מֵעִם אֲדֹנָיו
  choice: 从主人那里
  rationale: מֵעִם表示脱离原先与主人同在或受其管辖的状态；“从主人那里”是自然且贴近原文的表达。
theological_decisions:
- issue: עֶבֶד所指的社会身份
  choice: 奴隶
  alternative: 仆人
  rationale: 本节所述之人从主人处逃离，且律法禁止将其交还，受辖制的身份是条文重点；采用“奴隶”避免弱化原文，但以脚注保留该词可译“仆人”的词义范围。
- issue: יִנָּצֵל的语义
  choice: 逃到……来的
  alternative: 被解救而来到……的
  rationale: 该动词形式本身可含“获救”或“逃脱”之意；当前语境更自然地指从主人处逃脱。译文采用“逃”，不进一步断定其逃离的原因或主人身份。
translation_notes:
  register: 采用现代、庄重而直接的法律命令语体。“不可”对应禁令；“从主人那里逃到你这里来的”保持原文的来源与方向，不补入原文未明说的外国身份、庇护理由或永久居留含义。
