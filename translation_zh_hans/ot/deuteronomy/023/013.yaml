  text: And you shall have a place outside the camp[a], and you shall go out there, outside.
translation:
  language: zh_hans
  text: 你要在营外有一处地方[a]；你要出去，到营外那个地方去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“手”（יָד，yad）；这里很可能是惯用法，指指定的地方或地点。有些译本根据下一节所提到的挖掘用具，将它译作较具体的“器具”或“木桩”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יָד
  choice: 地方
  rationale: יָד通常意为“手”，但在这里与“在营外”和“到那里去”连用，最可能是指划定的地点。“地方”既符合上下文，也不把下一节所说的挖掘用具提前带入本节。
- source_word: תִּהְיֶה לְךָ
  choice: 你要有
  rationale: היה加לְ可表达归属或供某人使用；译作“你要有”自然地保留了律例的指令语气。
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: 在营外
  rationale: 直接表达该地点位于营地范围之外。
- source_word: וְיָצָאתָ
  choice: 你要出去
  rationale: יצא的基本义为“出去”；此处保留行动指令，并采用现代汉语表达。
- source_word: שָׁמָּה
  choice: 到那里去
  rationale: 方向副词指向前面所说的地点；“到那里去”清楚表达其方向性。
- source_word: חוּץ
  choice: 营外
  rationale: 句末חוּץ再次强调出去的范围。译文重复“营外”，保留原文的强调，同时避免生硬的“出去到那里外面”。
