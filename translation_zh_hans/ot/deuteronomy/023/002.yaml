base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/002.yaml
  text: No man with crushed testicles or a severed penis may enter the assembly of Yahweh[a][b].
translation:
  language: zh_hans
  text: 睾丸被压碎或阴茎被割断的人，不可进入耶和华的会众[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “耶和华的会众”可能指正式参与以色列的圣约共同体；这里所说排除的确切范围存在争议。
    reason: alternative_reading
lexical_decisions:
- source_word: יָבֹא
  choice: 进入
  rationale: בוא的基本义是“来、进入”；在否定律例中，“不可进入”自然地表达禁令，又不额外界定这种进入的具体性质。
- source_word: פְצוּעַ דַּכָּא
  choice: 睾丸被压碎
  rationale: 该词组指男性生殖器官受到压伤；按语境明确译作“睾丸被压碎”，比笼统的“生殖器受伤”更准确。
- source_word: וּכְרוּת שָׁפְכָה
  choice: 或阴茎被割断
  rationale: 该短语指男性器官被切断。“阴茎被割断”直接、现代且明确；וּ在这里连接两种情形，按语义译作“或”。
- source_word: בִּקְהַל
  choice: 会众
  rationale: קהל指聚集的群体或共同体。“会众”是中文圣经语境中自然且庄重的对应词，同时不在正文中限定其为礼仪、公民或婚姻层面的资格。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文读者熟悉的神名音译“耶和华”，保留专名功能，而不以“主”这一称号替代。
- source_word: לֹא
  choice: 不可
  rationale: “不可”符合中文律例文体，清楚表达希伯来文否定禁令的效力。
- source_word: implicit male referent of the participial phrases
  choice: 人
  rationale: 两项身体状况本身已明确限定为男性，不必另加原文没有的“男人”；“……的人”在现代汉语中自然，并未使所指变得含混。
theological_decisions:
- issue: “耶和华的会众”的排除范围
  choice: 正文直译为“不可进入耶和华的会众”，不具体界定排除的制度范围
  alternative: 明确解释为不得参与以色列的敬拜聚会、公民共同体、婚姻共同体或其他圣约资格
  rationale: 经文本身没有在本节说明“进入会众”的全部法律与神学含义；保留原有表达可避免把后来的具体解释写入正文。
translation_notes:
  register: 采用现代、庄重而直接的律例文体。身体部位使用清楚的现代医学常用词，不采用含混委婉语；“不可”保持法律禁令语气。正文脚注标记与脚注完全对应。
