base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/026.yaml
  text: When you come into your neighbor’s standing grain[a], you may pluck heads with your hand[b], but you shall not put a sickle to your neighbor’s standing grain.
translation:
  language: zh_hans
  text: 当你走进邻舍尚未收割的庄稼中时，可以用手摘取穗子[a]，却不可在邻舍尚未收割的庄稼上挥动镰刀[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “穗子”指谷物结籽、可以用手摘下的穗部。
    reason: lexical_clarification
  - marker: b
    text: 或译“不可向邻舍尚未收割的庄稼挥动镰刀”。原文此处的说法指不可下镰收割。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי תָבֹא
  choice: 你……时
  rationale: כִּי在这里引出律例适用的情形；用“时”自然表达情境性的条件，同时不把它强化为命令。
- source_word: בְּקָמַת רֵעֶךָ
  choice: 进到邻舍尚未收割的庄稼中
  rationale: קָמָה指田里仍然直立、尚未收割的庄稼；此译比笼统的“田地”更具体，也使介词בְּ所表达的进入情境自然清楚。
- source_word: וְקָטַפְתָּ
  choice: 可以……摘
  rationale: 该动词形式在这条律例的对比结构中表达获准的行为，并非要求人必须摘取，因此译出许可义。
- source_word: מְלִילֹת
  choice: 穗子
  rationale: 该词指谷物结籽的穗部；“穗子”是现代汉语中简明、准确的农业用语。
- source_word: בְּיָדֶךָ
  choice: 用手
  rationale: 保留原文对获准方式的限定：只可徒手摘取。
- source_word: וְחֶרְמֵשׁ לֹא תָנִיף
  choice: 却不可挥动镰刀割
  rationale: וְ在这里连接鲜明对比，译作“却”；נוּף的使役形有挥动、举动之意，与“镰刀”搭配时指实际下镰收割。“挥动镰刀割”兼顾词面意象和汉语可懂性。
- source_word: עַל קָמַת רֵעֶךָ
  choice: 割邻舍的庄稼
  rationale: עַל在此表示镰刀施加于庄稼之上；汉语用“割”明确工具作用，但不超出上下文所指的收割行为。
theological_decisions:
- issue: 许可与禁令的界线
  choice: 明确区分徒手摘穗的许可和用镰刀收割的禁止
  alternative: 把前半句译为命令式“你要摘”
  rationale: 上下文的律例结构容许有限取食，却禁止正式收割；这一法律张力来自原文本身，不应把许可误译成命令。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“尚未收割的庄稼”首次明示קָמָה的含义，后句用较简洁的“庄稼”避免中文重复累赘；保留徒手摘取与动用镰刀收割之间的法律对比。
