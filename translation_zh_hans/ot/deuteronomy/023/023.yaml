  yaml_path: translation/ot/deuteronomy/023/023.yaml
  text: But if you refrain from making a vow[a], there will be no sin in you.
translation:
  language: zh_hans
  text: 但你若不许愿，就没有罪[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你身上就没有罪责。”
    reason: חֵטְא可指“罪”或“罪责”；בְּךָ在此习语中可表达罪责不归于该人。
lexical_decisions:
- source_word: וְ/כִי
  choice: 但你若
  rationale: 承接上文必须履行所许之愿的规定，并引出与之相对的条件；“但……若”自然表达转折兼条件关系。
- source_word: תֶחְדַּל לִ/נְדֹּר
  choice: 不许愿
  rationale: חדל与不定式连用，表示克制或不去做某事；此处不是停止正在进行的许愿，而是选择不作出誓愿。现代汉语用“不许愿”简洁自然。
- source_word: לֹא יִהְיֶה בְ/ךָ
  choice: 就不算有
  rationale: 否定的存在句连同介词短语，表示某罪不会归在该人身上。“不算有”既符合汉语习惯，也保留法律—道德上的归责意味。
- source_word: חֵטְא
  choice: 罪
  rationale: חֵטְא可指罪，也可侧重罪责。正文采用最直接的“罪”，注脚保留“担当罪责”的可能含义。
theological_decisions:
- issue: 不许愿本身的道德地位
  choice: 不作出誓愿并不构成罪
  alternative: 重点在于不因此担当罪责或法律责任
  rationale: 本节与上文形成对照：许愿后不履行会有罪，而选择不许愿则不被定为有罪。译文不把经文扩展成鼓励或禁止许愿的普遍教义。
translation_notes:
  register: 采用简洁、庄重的现代标准汉语。“许愿”是普通读者熟悉的圣经法律用语；“不算有罪”比生硬的“在你里面没有罪”更自然，同时保留原文的归责意味。
