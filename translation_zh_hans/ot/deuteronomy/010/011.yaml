  to: 雅威[a]对我说：“起来，在百姓前面启程[b]，好让他们进入并取得[c]我向他们的先祖[d]起誓要赐给他们的那地。”
  rationale: 修订删除“带领他们”这一原文未明说的补足语，以“在百姓前面启程”保留 לְמַסַּע לִפְנֵי הָעָם 的行程与在前空间意象。“好让”自然表达后续两个未完成式可有的目的／结果功能；“取得……为业”保留 ירשׁ 在应许之地语境中的取得、拥有含义。保留“他们”的指代，不擅自消除其在句法和话语层面的张力。
