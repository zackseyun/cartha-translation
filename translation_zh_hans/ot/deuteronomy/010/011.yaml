source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֵלַ֔/י ק֛וּם לֵ֥ךְ לְ/מַסַּ֖ע לִ/פְנֵ֣י הָ/עָ֑ם וְ/יָבֹ֨אוּ֙ וְ/יִֽרְשׁ֣וּ אֶת הָ/אָ֔רֶץ אֲשֶׁר נִשְׁבַּ֥עְתִּי לַ/אֲבֹתָ֖/ם לָ/תֵ֥ת לָ/הֶֽם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/011.yaml
  text: And Yahweh said to me[a], “Arise, go before the people for the journey[c][b], so that they may go in and take possession of the land that I swore to their fathers to give to them.”
translation:
  language: zh_hans
  text: 雅威[a]对我说：“起来，在百姓前面启程[b]，好让他们进入并取得[c]我向他们的先祖[d]起誓要赐给他们的那地。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威”是希伯来文上帝之名 יהוה 的音译；传统中文译本多译作“耶和华”，也有译本以“主”代称。
    reason: divine_name
  - marker: b
    text: 原文也可较直译为“为行程走在百姓前面”。
    reason: lexical_alternative
  - marker: c
    text: 也可译作“占有”或“取得为业”。
    reason: lexical_alternative
  - marker: d
    text: 原文直译“他们的父辈”，这里指他们的先祖。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译四字神名，保留其作为上帝专名的性质，不以称号替代。
- source_word: קוּם
  choice: 起来
  rationale: 准确表达命令语气，措辞自然有力，也符合叙事中的庄重语体。
- source_word: לֵךְ לְמַסַּע לִפְנֵי הָעָם
  choice: 你要走在百姓前面，带领他们启程
  rationale: 原文依次表达“去／行进”“为行程”“在百姓前面”。此译保留空间上的“在前面”，并以“带领他们启程”自然传达摩西先行引领百姓上路的语境含义。
- source_word: וְיָבֹאוּ
  choice: 让他们进去
  rationale: 此处连接于命令之后，可表达目的或预期结果；“让”在汉语中自然保留这种从属关系，“进去”也保留进入那地的移动意象。
- source_word: וְיִרְשׁוּ
  choice: 占有
  rationale: ירשׁ在这里指取得并拥有应许之地；“占有”兼顾行动与持有之意，同时不把词义缩窄为后世法律意义的继承。
- source_word: הָאָרֶץ
  choice: 那地
  rationale: 上下文所指明确为应许之地；“那地”符合申命记的叙事指向，也比泛称“国家”准确。
- source_word: נִשְׁבַּעְתִּי
  choice: 我……起誓
  rationale: 保留上帝以誓言作出承诺的盟约性措辞。
- source_word: לַאֲבֹתָם
  choice: 他们的先祖
  rationale: אָבוֹת字面为“父辈／列祖”，此处历史上指以色列人的先祖；“先祖”在现代汉语中清楚而庄重。
- source_word: לָתֵת לָהֶם
  choice: 要赐给他们
  rationale: 保留不定式所表达的誓言内容以及原文复数代词；“赐给”适合以上帝为施予者的语境。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: “雅威”直接音译神名，既区别于称号“主”，也与原文作为专名的用法相符；不据此加入原文未明说的教义解释。
- issue: לַאֲבֹתָם 是否译作性别中性的祖先称谓
  choice: 他们的先祖
  alternative: 他们的父辈；他们的列祖
  rationale: 此处指以色列历史中特定的先祖。“先祖”在现代汉语中自然，并保留家族与历史承继关系；脚注说明原文的字面表达。
- issue: וְיָבֹאוּ וְיִרְשׁוּ 与前述命令的关系
  choice: 译为目的／预期结果：“让他们……”
  alternative: 并列结果：“他们就会……”；并列命令：“让他们……”
  rationale: 希伯来语连接形式可承接命令而表达目的或结果。正文采用自然的目的表达，但不把进入并占有解释成某一特定神学体系中的条件或功绩。
- issue: לָהֶם 的指代
  choice: 保留“他们”的代词形式
  alternative: 明确为“那些先祖”或“百姓”
  rationale: 原文代词在形式上可能回指先祖，也可在话语层面涉及其后裔百姓；中文保留“他们”，避免擅自消除这种指代张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。正文保留“走在百姓前面”的空间意象，以“带领他们启程”使汉语顺畅；避免古奥的“起行”“承受为业”，同时用脚注保留可供查考的直译和词义选择。
