source:
  edition: WLC
  text: בְּ/שִׁבְעִ֣ים נֶ֔פֶשׁ יָרְד֥וּ אֲבֹתֶ֖י/ךָ מִצְרָ֑יְמָ/הּ וְ/עַתָּ֗ה שָֽׂמְ/ךָ֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ כְּ/כוֹכְבֵ֥י הַ/שָּׁמַ֖יִם לָ/רֹֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/022.yaml
  text: Your fathers went down to Egypt with seventy persons[c][b][a], and now Yahweh your God has made you as numerous as the stars of the heavens.
translation:
  language: zh_hans
  text: 你的列祖[b]下到埃及时，共有七十人[a]；如今，雅威你的上帝已经使你多如天上的星[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“七十个生命”；希伯来语נֶפֶשׁ在这里是计算人数的说法。
    reason: lexical_alternative
  - marker: b
    text: “列祖”也可译作“父辈”或“祖先”；希伯来原文明确使用阳性复数“父辈”。
    reason: lexical_alternative
  - marker: c
    text: 也可译作“像天上的星那样众多”。本句比较的重点是数量繁多。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשִׁבְעִים נֶפֶשׁ
  choice: 共有七十人
  rationale: נֶפֶשׁ在此用作计算人数的单位，并非特指人与身体有别的“灵魂”。“共有七十人”既准确表达人数，也符合现代汉语习惯。
- source_word: יָרְדוּ
  choice: 下到
  rationale: 保留ירד“下去、下到”的方向性用语；“下到埃及”也延续了希伯来叙事中前往埃及的惯用表达。
- source_word: אֲבֹתֶיךָ
  choice: 你的列祖
  rationale: 原文是阳性复数“你的父辈”。“列祖”保留其男性祖辈色彩及以色列先祖的历史指向，同时庄重简洁。
- source_word: מִצְרָיְמָה
  choice: 到埃及
  rationale: 词尾表示朝向埃及的移动；汉语以“到埃及”自然表达。
- source_word: וְעַתָּה
  choice: 如今
  rationale: 承接并对照昔日仅七十人的情况与当前人口繁多的结果；“如今”简明自然。
- source_word: שָׂמְךָ
  choice: 已经使你
  rationale: שׂים本义为“安置、放置”，此处表示使以色列成为某种景况。“已经使你”清楚表达已形成的结果。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译直接呈现四字神名，而不以“主”这一称号代替。
- source_word: אֱלֹהֶיךָ
  choice: 你的上帝
  rationale: 准确表达带第二人称阳性单数后缀的称谓，并以现代标准汉语常用的“上帝”呈现。
- source_word: כְּכוֹכְבֵי הַשָּׁמַיִם לָרֹב
  choice: 多如天上的星
  rationale: 比较的重点是数量繁多。“多如天上的星”把כְּ的比拟与לָרֹב的众多之意合并为自然、凝练的汉语。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。音译“雅威”保留其专名性质，不以称号替换；“耶和华”是汉语传统形式，但其语音来源较间接。
- issue: 祖辈称谓אֲבֹתֶיךָ的性别与范围
  choice: 你的列祖
  alternative: 你的祖先；你的父辈
  rationale: 原文明确使用阳性复数“父辈”。“列祖”不将其泛化为无性别的祖先，同时也符合这里指以色列先祖的历史语境。
- issue: “你”的集体指向
  choice: 保留单数“你”
  alternative: 你们
  rationale: 希伯来文后缀均为第二人称阳性单数，摩西以单数称呼以色列这个整体。保留“你”可呈现这种群体单数的修辞。
translation_notes:
  register: 采用现代、庄重而清楚的普通话。“列祖”略带经文语体，但能准确保留原文的男性祖辈称谓；其余句式力求自然。“多如天上的星”凝练呈现原文的比拟及数量众多之意。
