base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/015.yaml
  text: Yet Yahweh set his affection on your fathers[a], to love them, and he chose their offspring after them—you—from all the peoples, as it is this day.
translation:
  language: zh_hans
  text: 然而，耶和华只眷爱你的列祖[a]，爱他们；又从万民中拣选了他们之后的后裔，就是你们，正如今日一样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“耶和华惟独喜爱你的列祖，以爱他们。”
    reason: רַק可作“只／惟独”，חָשַׁק可译“眷爱／喜爱”；不定式“以爱他们”的具体语法关系可作不同表达。
lexical_decisions:
- source_word: רַק
  choice: 然而……只
  rationale: רַק兼有承接上文的转折和限定、强调作用；“然而……只”保留这种张力，也凸显耶和华在拥有天地万有的背景下对列祖特别的眷顾。
- source_word: בַּאֲבֹתֶיךָ חָשַׁק
  choice: 眷爱你的列祖
  rationale: חָשַׁק表示强烈依恋、倾心；与ב连用时指感情所系的对象。“眷爱”自然、庄重，并兼顾 affection 与 delight 的语义。
- source_word: לְאַהֲבָה אֹתָם
  choice: 爱他们
  rationale: 不定式与חָשַׁק紧密相连，可表达目的或结果；直译为“爱他们”，不额外判定二者的精确逻辑关系。
- source_word: וַיִּבְחַר
  choice: 又拣选了
  rationale: בחר是表示选择、拣选的常用词；“拣选”保留经文明确的神圣选择语言。
- source_word: בְּזַרְעָם אַחֲרֵיהֶם
  choice: 他们之后的后裔
  rationale: זֶרַע在此是集合意义，指列祖以后的子孙；“后裔”比字面“种子”更符合现代汉语。
- source_word: בָּכֶם
  choice: 就是你们
  rationale: 该词与前面的“他们的后裔”构成同位说明，明确指向摩西当时的听众。
- source_word: מִכָּל הָעַמִּים
  choice: 使你们从万民中分别出来
  rationale: 介词מן在בחר的搭配中表达从群体中选出；汉语补出“分别出来”，使“拣选……从万民中”的关系清楚，同时不把עַמִּים窄化为现代政治意义的国家。
- source_word: כַּיּוֹם הַזֶּה
  choice: 正如今日一样
  rationale: 保留该惯用语以当时可见现状印证前述选择的意味。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文圣经语境中通行的神名音译，表明原文使用的是专名而非一般称号。
theological_decisions:
- issue: 神的拣选
  choice: 明确保留眷爱、爱和拣选的措辞
  alternative: 淡化为一般偏爱或纯粹历史安排，或扩写成某一后期系统神学的拣选论
  rationale: 原文同时陈述耶和华对列祖的依恋、爱以及对其后裔的选择；译文忠实保留这些陈述，但不说明其超出本节的教义范围。
- issue: רַק与חָשַׁק结构的理解
  choice: 正文译作“然而，耶和华只眷爱你的列祖”
  alternative: “惟有耶和华喜爱你的列祖，要爱他们”
  rationale: רַק既可理解为强调耶和华特别眷顾列祖，也可能较直接地限定整句；正文用自然汉语呈现主要语势，脚注保留另一种句法和词义表达。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。“列祖”“眷爱”“拣选”“万民”保持经文语体，但避免古奥句式。正文中的[a]与脚注对应。
