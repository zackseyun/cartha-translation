base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/002.yaml
  text: And I will write on the tablets the words that were on the first tablets[a], which you broke, and you shall put them in the ark.
translation:
  language: zh_hans
  text: 我要把先前那些、就是你摔碎的版上所写的话[a]，写在这些版上；你要把这些版放在柜中。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “话”也可按这里的语境理解为“诫命”；希伯来文直译为“话”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶכְתֹּב
  choice: 我要……写
  rationale: 这是כתב的Qal未完成式第一人称单数，前接连词；在上帝应许并说明随后行动的语境中，用“我要……写”自然表达将来意义。
- source_word: הַלֻּחֹת
  choice: 这些版
  rationale: לוח指版、板；本节未重述材质，因此不在对应词组中增添“石”，但借“先前那些石版”承接第1节语境，并使现代读者易于识别所指。
- source_word: הַדְּבָרִים
  choice: 话
  rationale: דבר意义宽泛，此处指刻写的盟约言语；译作“话”紧贴原文，也不在正文中解释性地改成“诫命”。
- source_word: אֲשֶׁר הָיוּ
  choice: 先前……上的
  rationale: 将希伯来语关系从句自然整合进汉语定语结构，保留“那些话原在先前石版上”的意思。
- source_word: הָרִאשֹׁנִים
  choice: 先前的
  rationale: 此词指较早、第一套石版；“先前的”在本句中比重复“第一块/第一套”更自然，同时清楚区别于新凿的版。
- source_word: שִׁבַּרְתָּ
  choice: 你摔碎的
  rationale: שבר的Piel完成式第二人称阳性单数表示使之破碎；结合摩西把石版从手中扔下的叙事，“摔碎”准确且自然。
- source_word: וְשַׂמְתָּם
  choice: 你要把这些版放
  rationale: שים表示放置；将阳性复数后缀明确译为“这些版”，符合把实体放入柜中的上下文，避免汉语“它们”指代不清。
- source_word: בָּאָרוֹן
  choice: 进柜里
  rationale: ארון本义为柜、箱，此处指为存放石版而造的神圣柜；“柜”保留普通词义，避免仅靠传统专名表达，方向性的“进……里”自然呈现放入的动作。
theological_decisions:
- issue: וְשַׂמְתָּם中复数代词后缀的所指
  choice: 在正文中明确为“这些版”
  alternative: 理解为写在版上的“话／诫命”
  rationale: 语法上，阳性复数后缀可回指“版”或“话”，但放进柜里的实体在申命记10:1—5的上下文中显然是石版。译文明确所指，以免现代汉语代词产生不必要的含混。
- issue: הַדְּבָרִים应译为“话”还是“诫命”
  choice: 正文译“话”
  alternative: 译“诫命”
  rationale: 这里固然指上帝所颁布的诫命，但原词是范围较广的דברים。正文保留其字面称谓与经文内部的神学表达，脚注提示语境性译法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。用“石版”而不用较古雅的“石版碑”或“石板”；用“柜”表达אָרוֹן的基本意义。为避免汉语长定语过重，将原文一个并列复句分成两句，并明确第二个“版”的所指。
