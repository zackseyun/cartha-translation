    rationale: 石版见于紧邻的第1节，所指虽无误，但本节仅说“版”；为贴近原文，不在此处补入“石”。
  - severity: medium
    issue: “那先前的版是你摔碎的”未自然保留原文关系从句对“版”的修饰。
    rationale: 原文的“你摔碎的”直接修饰“先前的版”。改为“先前那些、就是你摔碎的版”能清楚表达两组版的对比及修饰关系。
  - severity: low
    issue: “放进柜里”将בָּאָרוֹן的“在柜中”表达成了明确的趋向动作。
    rationale: 中文“放在柜中”既自然，也更贴合原文及英文审计文本的处所表达。
  revised_text: 我要把先前那些、就是你摔碎的版上所写的话[a]，写在这些版上；你要把这些版放在柜中。
