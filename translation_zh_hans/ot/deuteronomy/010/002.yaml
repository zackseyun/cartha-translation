- from: 我要把先前那些石版上的话，写在这些版上[a]；那先前的版是你摔碎的。你要把这些版放进柜里。
  to: 我要把先前那些、就是你摔碎的版上所写的话[a]，写在这些版上；你要把这些版放在柜中。
  rationale: 修订使“先前的”与“你摔碎的”一同修饰旧版，避免拆句造成的不自然表达；不补入本节未明说的“石”，并以“放在柜中”贴近原文处所结构。保留“这些版”以明确复数代词所指为新版，而非写在其上的话。
