base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/018.yaml
  text: He executes justice for the fatherless and the widow[a], and loves the sojourner[c][b], giving him food and clothing.
translation:
  language: zh_hans
  text: 他为孤儿[a]和寡妇主持公道，也爱寄居者[b]，赐给寄居者食物[c]和衣服。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “孤儿”所译的希伯来语特指失去父亲的人，也可译作“无父的人”。
    reason: lexical_alternative
  - marker: b
    text: “寄居者”指住在以色列人中间的外来人，并非仅指短暂停留的陌生人；也可译作“外来居民”。
    reason: lexical_alternative
  - marker: c
    text: “食物”原文直译为“饼”；这里指维持生活所需的食物。
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹשֶׂה מִשְׁפַּט
  choice: 主持公道
  rationale: 该搭配表示施行、维护应有的公正；“主持公道”在现代汉语中自然地保留了司法与社会公义的含义。
- source_word: יָתוֹם
  choice: 孤儿
  rationale: 希伯来语特指失去父亲、因而缺乏保障的人；“孤儿”是现代汉语中最自然的社会类别称谓，具体语义由脚注说明。
- source_word: אַלְמָנָה
  choice: 寡妇
  rationale: 准确对应原文所指的弱势社会群体。
- source_word: אֹהֵב
  choice: 爱
  rationale: 直接保留原文对上帝主动关爱的陈述，不把它弱化为单纯的善待或怜悯。
- source_word: גֵּר
  choice: 寄居者
  rationale: 指居住在以色列人中间、并非本地出生的人，而不是短暂停留的过客；“寄居者”保留其社会和法律身份色彩。
- source_word: לָתֶת לוֹ
  choice: 赐给他
  rationale: 不定式说明这份爱所表现出的具体行动；“赐给”符合上帝作为施予者的语境，同时保持原文简洁。
- source_word: לֶחֶם
  choice: 食物
  rationale: 字面为“饼”，此处与衣服并列，泛指维持生活所需的食物。
- source_word: שִׂמְלָה
  choice: 衣服
  rationale: 现代汉语中自然、宽泛地表达原文的衣物或外衣。
theological_decisions:
- issue: 上帝对弱势群体的关怀
  choice: 同时呈现上帝为弱势者主持公道、爱寄居者并供应其生活需要的行动。
  alternative: 只突出法律上的维护，或只突出情感上的怜悯。
  rationale: 原文把司法行动、爱的态度和物质供应并置；译文保留这几个层面，不以其中一个取代其他层面。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“主持公道”传达 עֹשֶׂה מִשְׁפַּט 的司法与公义含义；“寄居者”虽带圣经语体色彩，但仍易懂，并由脚注界定。代词“他”依照希伯来语单数形式保留。
