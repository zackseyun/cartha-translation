  yaml_path: translation/ot/deuteronomy/010/016.yaml
  text: So circumcise the foreskin of your heart[c][b][a], and do not stiffen your neck any longer.
translation:
  language: zh_hans
  text: 所以，你们要割除自己心里的包皮[a][b]，不可再使颈项刚硬[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你们要割除自己心里的包皮。”句首连词也可只表示承接；不过，上下文也支持“所以”或“因此”的推论含义。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译为“你们心的包皮”，以割礼为喻，表示除去内心对上帝的抗拒。
    reason: cultural_note
  - marker: c
    text: 或译：“不可再硬着颈项”或“不可再顽梗不化”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמַלְתֶּם
  choice: 所以，你们要……行割礼
  rationale: 该词为第二人称复数完成式，前接连词；在上下文的劝诫中具有命令作用。译作“所以”体现承接前文而得出的推论，同时以“要”自然表达命令语气。
- source_word: עָרְלַת לְבַבְכֶם
  choice: 你们心的包皮
  rationale: 原文是具体的属格结构，直译为“你们心的包皮”。保留这一较强烈的身体隐喻，维持割礼所含的盟约意象，不将其消解为“除去内心的顽梗”等解释性改写。
- source_word: לְבַבְכֶם
  choice: 你们的心
  rationale: לֵבָב可指人的思想、意志和内在生命；“心”既是现代汉语可理解的对应词，也能保留此处与割礼结合的原文意象。
- source_word: וְעָרְפְּכֶם
  choice: 颈项
  rationale: עֹרֶף指颈部或后颈。“颈项”庄重而清楚，并能与“硬着”组成汉语中可理解的顽梗意象。
- source_word: לֹא תַקְשׁוּ עוֹד
  choice: 不可再硬着
  rationale: קשׁה的使役式在这里表示使之坚硬；与“颈项”连用时，译作“硬着颈项”直接保留希伯来语惯用比喻。עוֹד在禁令中自然译为“再”。
theological_decisions:
- issue: 内心受割礼的盟约隐喻
  choice: 明确保留“给心的包皮行割礼”
  alternative: 洁净你们的心；除去你们内心的顽梗
  rationale: 经文本身以身体割礼描写内在的道德与盟约回应。直保留该隐喻，既呈现外在记号与内在顺服之间的张力，也避免加入更狭窄的教义解释。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“心的包皮”虽不属日常表达，但为忠实保留原文刻意而鲜明的盟约隐喻；脚注说明其含义。“硬着颈项”保留原文身体意象，同时以替代译法帮助普通读者理解。
