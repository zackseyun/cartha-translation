  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יִּכְתֹּ֨ב עַֽל הַ/לֻּחֹ֜ת כַּ/מִּכְתָּ֣ב הָ/רִאשׁ֗וֹן אֵ֚ת עֲשֶׂ֣רֶת הַ/דְּבָרִ֔ים אֲשֶׁ֣ר דִּבֶּר֩ יְהוָ֨ה אֲלֵי/כֶ֥ם בָּ/הָ֛ר מִ/תּ֥וֹךְ הָ/אֵ֖שׁ בְּ/י֣וֹם הַ/קָּהָ֑ל וַ/יִּתְּנֵ֥/ם יְהוָ֖ה אֵלָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/004.yaml
  text: And he wrote on the tablets[a], like the first writing, the Ten Words that Yahweh had spoken to you on the mountain from the midst of the fire on the day of the assembly; and Yahweh gave them to me.
translation:
  language: zh_hans
  text: 雅威照先前所写的，在石版上写下了十句话[a]；这些话是雅威在集会那天，在山上从火中对你们说的。雅威把这些交给了我。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 传统称为“十诫”。希伯来语直译为“十句话”。
    reason: 说明原文直译与传统称法之间的差异。
lexical_decisions:
- source_word: וַיִּכְתֹּב
  choice: 写下了
  rationale: 该词是כתב的叙事性过去时形式，表示接续发生的动作。“写下”自然清楚，也与下文“先前所写的”保持词义联系；石版虽可说“刻下”，但原词本身通常就是“写”。
- source_word: הַלֻּחֹת
  choice: 版
  rationale: לֻחוֹת在本语境指承载盟约文字的版。“版”简洁自然；本节没有明说“石”，因此不补作“石版”。
- source_word: כַּמִּכְתָּב הָרִאשׁוֹן
  choice: 照先前所写的
  rationale: 前缀כ表达比较或依照，מִכְתָּב指所写的文字或字样。此译保留“与第一次所写相同”的意思，同时避免把它过度具体化为某种特殊“铭文”。
- source_word: עֲשֶׂרֶת הַדְּבָרִים
  choice: 十句话
  rationale: 希伯来语直译为“十句话”或“十言”。正文采用普通现代读者容易理解的“十句话”，传统称法“十诫”列入脚注。
- source_word: אֲשֶׁר דִּבֶּר יְהוָה אֲלֵיכֶם
  choice: 这些话是雅威……对你们说的
  rationale: 关系从句说明这十句话先由雅威向百姓宣告，随后写在版上。汉语用“这些话是……说的”清楚呈现这一先后关系。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以“雅威”音译四字神名，保留其作为以色列之上帝的专名性质，而不以称号替代。
- source_word: מִתּוֹךְ הָאֵשׁ
  choice: 从火中
  rationale: 简洁保留话语从火焰当中发出的空间意象；无需扩展为解释性表达。
- source_word: בְּיוֹם הַקָּהָל
  choice: 在集会那天
  rationale: קָהָל指以色列民聚集的大会。“集会那天”是自然的现代汉语，也保留这是特定历史事件的意味。
- source_word: וַיִּתְּנֵם
  choice: 又把它们交给了
  rationale: נָתַן基本义为“给”。此处“交给”符合版由雅威给摩西的场景；“它们”保留原文代词的概括性，不强行消除其所指在版与其上话语之间的语义联系。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名。正文采用较贴近学界通行重构读音的“雅威”，不以“主”等称号替换专名。
- issue: עֲשֶׂרֶת הַדְּבָרִים的译法
  choice: 十句话
  alternative: 十诫
  rationale: 原文的דְּבָרִים是“话、言语”，并非通常表示“诫命”的词。正文保留原文措辞，脚注提供传统名称，以免读者不知所指。
- issue: 书写者的身份
  choice: 雅威
  alternative: 他
  rationale: 希伯来语动词是第三人称阳性单数，紧接上文的主语是雅威，本节后半也明确说雅威把它们交给摩西。独立呈现本节时用“雅威”消除汉语代词所指不明，并未改变上下文认定的主体。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“十句话”比“十言”更便于普通读者理解；分号连接书写与先前宣告的内容，末句保留叙事推进。“版”不擅自补入本节未明说的材质。
