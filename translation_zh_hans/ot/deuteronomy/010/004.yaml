revisions:
- from: 雅威照先前所写的，在版上写下了十句话[a]；这些话是雅威在集会那天，在山上从火中对你们说的。雅威又把它们交给了我。
  to: 雅威照先前所写的，在石版上写下了十句话[a]；这些话是雅威在集会那天，在山上从火中对你们说的。雅威把这些交给了我。
