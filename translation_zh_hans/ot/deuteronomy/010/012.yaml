source:
  edition: WLC
  text: וְ/עַתָּה֙ יִשְׂרָאֵ֔ל מָ֚ה יְהוָ֣ה אֱלֹהֶ֔י/ךָ שֹׁאֵ֖ל מֵ/עִמָּ֑/ךְ כִּ֣י אִם לְ֠/יִרְאָה אֶת יְהוָ֨ה אֱלֹהֶ֜י/ךָ לָ/לֶ֤כֶת בְּ/כָל דְּרָכָי/ו֙ וּ/לְ/אַהֲבָ֣ה אֹת֔/וֹ וְ/לַֽ/עֲבֹד֙ אֶת יְהוָ֣ה אֱלֹהֶ֔י/ךָ בְּ/כָל לְבָבְ/ךָ֖ וּ/בְ/כָל נַפְשֶֽׁ/ךָ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/012.yaml
  text: And now[a], Israel, what does Yahweh your God ask of you, except to fear Yahweh your God, to walk in all his ways, to love him[c][b], and to serve Yahweh your God with all your heart and with all your soul?
translation:
  language: zh_hans
  text: 如今，以色列啊，雅威你的上帝向你要求什么呢？无非是要你敬畏[a]雅威你的上帝，行走在他一切的道路上，爱他，并且以全心和全生命[b]事奉雅威你的上帝。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “敬畏”在这里包括畏惧、崇敬，以及由此产生的忠诚顺服。
    reason: 说明 ירא 在盟约语境中的复合含义，避免读者将它仅理解为害怕或尊敬。
  - marker: b
    text: “全生命”也可译作“全人”或“全魂”；希伯来语 נֶפֶשׁ 可指生命、自己或整个人。
    reason: 保留 נֶפֶשׁ 的语义宽度，并提示其他可能译法。
lexical_decisions:
- source_word: וְעַתָּה
  choice: 如今
  rationale: 作为承接上文并引出劝勉的话语标记；“如今”兼顾连接与转折推进，符合庄重的现代汉语。
- source_word: מָה ... שֹׁאֵל מֵעִמָּךְ
  choice: 向你要求什么
  rationale: שׁאל 与 מֵעִם 连用可表示向人索求或提出带有义务性的要求；此处处于盟约劝勉中，“要求”比单纯的“询问”准确。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译直接呈现四字神名，保留经文所用的专名，而不以“主”这一称号代替。
- source_word: אֱלֹהֶיךָ
  choice: 你的上帝
  rationale: 准确表达带第二人称阳性单数后缀的盟约称呼；摩西把以色列整体作为单数对象来讲话。
- source_word: כִּי אִם
  choice: 无非是要
  rationale: 在反问句后引出唯一的答案，保留“只是、除……以外没有别的”的限制意味，同时使汉语衔接自然。
- source_word: לְיִרְאָה
  choice: 敬畏
  rationale: “敬畏”既保留畏惧与震撼的分量，也能表达面对上帝时的尊崇和顺服，不把原词弱化为一般的尊敬。
- source_word: לָלֶכֶת בְּכָל דְּרָכָיו
  choice: 行在他一切的道路上
  rationale: 保留希伯来语以“行走”比喻生活方式和行为取向的表达，同时在现代汉语中仍清楚可懂。
- source_word: וּלְאַהֲבָה אֹתוֹ
  choice: 爱他
  rationale: 直接表达对雅威的爱，保留其情感与盟约忠诚两方面的含义。
- source_word: וְלַעֲבֹד
  choice: 事奉
  rationale: עבד 在以上帝为对象时涵盖服事、敬拜与忠诚顺服；“事奉”比单指礼仪的“敬拜”范围更广。
- source_word: בְּכָל לְבָבְךָ
  choice: 全心
  rationale: לֵבָב 指人的内在中心，包括思想、意志与情感；“全心”自然表达毫无保留的投入。
- source_word: וּבְכָל נַפְשֶׁךָ
  choice: 全生命
  rationale: נֶפֶשׁ 可指生命、自己或整个人；“全生命”在现代汉语中比容易产生误解的“尽性”更清楚，并保留献上整个生命的力度。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用上帝的专名。正文采用接近学界通常重构读音的音译“雅威”，避免以称号“主”替换专名；“耶和华”虽有悠久汉语传统，却源于较晚形成的混合读法。
- issue: 盟约劝勉中 ירא 的力度
  choice: 敬畏
  alternative: 害怕；尊敬
  rationale: 原词在此既不能缩减为单纯恐惧，也不应淡化为一般尊敬；“敬畏”保留畏惧、崇敬和顺服彼此并存的张力。
- issue: נֶפֶשׁ 在整体奉献表达中的理解
  choice: 生命
  alternative: 灵魂；全人
  rationale: 此处与“心”并列，强调整个人毫无保留地事奉上帝，并非明确划分人的不同实体部分；“生命”保留原词可指生命、自我和整个人的语义范围。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“以色列啊”保留直接呼告；“行在……道路上”保留原文伦理性的行走隐喻；以“全心、全生命”避免传统“尽心尽性”在当代汉语中可能产生的歧义。
