  text: בָּ/עֵ֨ת הַ/הִ֜וא אָמַ֧ר יְהוָ֣ה אֵלַ֗/י פְּסָל לְ/ךָ֞ שְׁנֵֽי לֻוחֹ֤ת אֲבָנִים֙ כָּ/רִ֣אשֹׁנִ֔ים וַ/עֲלֵ֥ה אֵלַ֖/י הָ/הָ֑רָ/ה וְ/עָשִׂ֥יתָ לְּ/ךָ֖ אֲר֥וֹן עֵֽץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/001.yaml
  text: At that time Yahweh said to me[a], ‘Carve for yourself two stone tablets like the first ones, and come up to me on the mountain[b], and make for yourself a wooden ark.’
translation:
  language: zh_hans
  text: 那时，雅威对我说：“你要为自己凿出两块石版，像先前的那两块一样，然后上山到我这里来；你也要为自己做一个木柜[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “木柜”也可译作“木箱”；这里指后来盛放石版的柜。
    reason: 说明אֲרוֹן的词义范围及其上下文所指，同时避免在正文中增添“约”字。
lexical_decisions:
- source_word: בָּעֵת הַהִוא
  choice: 那时
  rationale: 自然、简洁地表达叙事中的时间指示语，并保留“在那个时候”的回指作用。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文直接呈现上帝的专名，而不以“主”这一称号代替；“雅威”是现代汉语中通行且较贴近原名的音译。
- source_word: פְּסָל לְךָ
  choice: 为自己凿出
  rationale: פְּסָל指凿削、制作石料；“凿出”符合石版的语境，לְךָ的受益或反身意味以“为自己”表达。
- source_word: שְׁנֵי לֻוחֹת אֲבָנִים כָּרִאשֹׁנִים
  choice: 两块石版，像先前的那两块一样
  rationale: “石版”是现代汉语中对盟约版的自然称呼；比较结构清楚回指先前的两块版，而不额外说明其遭毁的背景。
- source_word: וַעֲלֵה אֵלַי הָהָרָה
  choice: 然后上山到我这里来
  rationale: 同时表达上行、以山为目的地以及“到我这里”的方向；“来”符合说话者雅威所在位置的视角。
- source_word: וְעָשִׂיתָ לְּךָ אֲרוֹן עֵץ
  choice: 你也要为自己做一个木柜
  rationale: 保留לְךָ的受益或反身意味。“木柜”表达אֲרוֹן עֵץ作为盛放石版之木制容器的基本含义，又不提前把后文完整的约柜概念全部带入本句。
theological_decisions:
- issue: 如何译出神名יְהוָה
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文使用四字神名，而非“主”这一称号，因此正文保留专名。采用“雅威”以反映较通行的学术复原读音，同时避免用称号取代原文。
- issue: אֲרוֹן是否直接译作“约柜”
  choice: 木柜
  alternative: 木箱；木制约柜
  rationale: 本句原文只有“木制的柜（箱）”，没有出现“约”一词。“木柜”保留其实际容器含义及与后文圣物的关联，同时不在本节中增添原文未明说的限定。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。命令句用“你要”清楚呈现希伯来文祈使和连续命令；保留两次“为自己”，以反映原文两处לְךָ。
