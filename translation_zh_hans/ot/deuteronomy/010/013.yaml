  text: to keep the commandments of Yahweh and his statutes that I am commanding you today for your good?[a]
translation:
  language: zh_hans
  text: 遵守雅威今日为使你得益处而吩咐你的诫命和律例吗？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “遵守”也可译作“谨守”或“持守”。
    reason: lexical_alternative
lexical_decisions:
- source_word: לִשְׁמֹר
  choice: 遵守
  rationale: 该词以介词 ל 引出上文所说要求的内容或目的；“遵守”自然表达实际服从，也保留申命记的盟约语境。
- source_word: מִצְוֺת
  choice: 诫命
  rationale: 复数构造形式指雅威所命定的各项义务；“诫命”保留法律与盟约色彩。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文直接音译四字神名，保留这是以色列之神的专名，而不以称号替代。
- source_word: חֻקֹּתָיו
  choice: 他的律例
  rationale: 该词指规定、制定的条例；“律例”在现代中文圣经语体中清楚而庄重，并与“诫命”自然搭配。
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: 就是我今日吩咐你的
  rationale: 关系从句承接前面的“诫命和律例”；用“就是”使中文修饰关系清楚，同时保留“今日”的盟约现场感。
- source_word: לְטוֹב לָךְ
  choice: 为使你得福
  rationale: 该短语表示有益于听者的目的或结果；“得福”简洁自然，涵盖益处与福祉，而不暗示这些命令是为满足神的需要。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文使用四字神名；采用较贴近学界常用复原读音的“雅威”，明确保留专名性质。
- issue: לְטוֹב לָךְ 所表达的益处
  choice: 为使你得福
  alternative: 为使你得益处
  rationale: “得福”自然表达命令旨在使以色列得着福祉；同时不把原文限定为物质利益。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“诫命和律例”保留申命记的法律—盟约语域；全句作为10:12起问句的续接部分，末尾保留问号。
