  naturalness: 原句“遵守……，就是我今日吩咐你的，为使你得福吗？”句法不顺，“就是”后的成分与前面的不定式性动作不能自然衔接。改为将“今日吩咐”及“为使你得益处”前置为定语，语义关系清晰，也保留本节作为10:12延续问句的问号。
  terminology: “雅威”“诫命”“律例”均合适，并保持庄重的盟约—法律语域。“得益处”比“得福”更准确对应 לְטוֹב לָךְ，不额外赋予原文祝福术语的含义。
