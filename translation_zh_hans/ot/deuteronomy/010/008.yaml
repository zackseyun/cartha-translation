base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/008.yaml
  text: At that time Yahweh set apart the tribe of Levi to carry the ark of the covenant of Yahweh, to stand before Yahweh to minister to him, and to bless in his name, to this day.
translation:
  language: zh_hans
  text: 那时，雅威把利未支派分别出来，好叫他们抬运雅威的约柜，侍立在雅威面前事奉他，并奉他的名祝福，直到今日。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִבְדִּיל
  choice: 分别出来
  rationale: 表达为特定职分而分开、选定的含义，同时保持现代汉语的自然表达。
- source_word: יְהוָה
  choice: 雅威
  rationale: 直接音译四字神名，保留其作为以色列之神专名的性质，而不以称号替代。
- source_word: שֵׁבֶט הַלֵּוִי
  choice: 利未支派
  rationale: 准确保留支派名称和以色列支派的语境。
- source_word: לָשֵׂאת
  choice: 抬
  rationale: 约柜是由人扛抬搬运的圣物；“抬”比泛称的“携带”更具体自然。
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: 雅威的约柜
  rationale: 自然表达“雅威之约的柜”；“约柜”是清楚而通行的现代汉语称法。
- source_word: לַעֲמֹד לִפְנֵי יְהוָה
  choice: 侍立在雅威面前
  rationale: 既保留“站在……面前”的形象，也传达此处履行圣职、随侍供职的语境。
- source_word: לְשָׁרְתוֹ
  choice: 事奉他
  rationale: 体现面向神的礼仪性服事，又不额外引入后世宗派性的职分概念。
- source_word: וּלְבָרֵךְ בִּשְׁמוֹ
  choice: 并奉他的名祝福
  rationale: “奉……的名”自然表达凭其名和权柄施行祝福，同时保留祝福对象在原文中未明说的开放性。
- source_word: עַד הַיּוֹם הַזֶּה
  choice: 直到今日
  rationale: 保留叙述者视角下该职分持续有效的时间表达。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；音译“雅威”较好地保留其专名性质，不以称号取代。
- issue: לַעֲמֹד ... לְשָׁרְתוֹ 所指的利未职分
  choice: 侍立在雅威面前事奉他
  alternative: 站在雅威面前服事他
  rationale: “侍立”保留站立在神面前的原文意象并传达圣所供职语境，但不把后来的祭司制度细节读入经文。
- issue: “祝福”的隐含受词
  choice: 并奉他的名祝福
  alternative: 并奉他的名为人祝福
  rationale: 希伯来文没有明说祝福的对象，因此不补出“为人”，以保留原文的简约和开放性。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“让他们”承接集合名词“利未支派”，使三个职责任务在汉语中清楚连贯；不增加原文未明说的礼仪或职分细节。
