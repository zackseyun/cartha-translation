base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/003.yaml
  text: So I made an ark of acacia wood and cut two stone tablets like the first ones[a], and I went up the mountain with the two tablets in my hand.
translation:
  language: zh_hans
  text: 于是，我用金合欢木做了一只约柜，又凿出两块石版，和先前的一样；我手里拿着这两块版，上了山。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲרוֹן
  choice: 约柜
  rationale: 该词本义为柜、箱；在存放约版的语境中，现代中文通常称“约柜”，既准确指明圣约器物，也不增添原文以外的解释。
- source_word: עֲצֵי שִׁטִּים
  choice: 金合欢木
  rationale: 指制作约柜所用的金合欢属木材；“金合欢木”是现代中文清楚、自然的植物名称。
- source_word: וָאֶפְסֹל
  choice: 凿出
  rationale: פסל在此指用凿削方式加工石材、制成石版；“凿出”比泛称“做”更具体，也比“雕刻”更能避免装饰性刻纹的联想。
- source_word: לֻחֹת אֲבָנִים
  choice: 石版
  rationale: 指石制的版；“石版”简洁自然，并与上下文中承载文字的版相符。
- source_word: כָּרִאשֹׁנִים
  choice: 和先前的一样
  rationale: 比较结构指新凿的两块石版与先前的石版相同；“先前的”自然承接上文，不强行限定相同之处。
- source_word: וָאַעַל הָהָרָה
  choice: 上了山
  rationale: עלה与方向词尾共同表达向山上攀登；“上了山”符合现代汉语叙事表达。
- source_word: בְּיָדִי
  choice: 我手里拿着
  rationale: 原文为单数“在我手中”；中文以“手里拿着”自然表达携带之意，同时保留单数形式。
- source_word: וָאַעַשׂ
  choice: 做了
  rationale: עשה是一般性的“做、制造”；译作“做了”直接而自然。
theological_decisions:
- issue: 存放约版之神圣器物的名称
  choice: 约柜
  alternative: 柜子／箱子
  rationale: אֲרוֹן本可泛指柜或箱，但此处特指为存放圣约石版而造的器物；“约柜”是准确且通行的语境化名称，不额外加入教派性解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。保留原文连续动作的次序，并以分号避免中文句子过度拖长；不设置脚注，因为“凿出”已自然而准确地体现פסל在石材加工语境中的含义。
