base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/006.yaml
  text: The sons of Israel journeyed from Beeroth Bene-jaakan to Moserah[a]. There Aaron died, and there he was buried[b]; and Eleazar his son served as priest in his place.
translation:
  language: zh_hans
  text: 以色列人从比录比尼亚干起行，到了摩西拉[a]。亚伦死在那里，也葬在那里；他儿子以利亚撒接替他作祭司[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “比录比尼亚干”可按字面理解为“雅干子孙的众井”，这里将其作为地名音译。
    reason: lexical_alternative
  - marker: b
    text: 或译：“他儿子以利亚撒在他之后作祭司。”原文直译为“在他的位置上”，表示职分的承继。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 这是现代汉语对“以色列众子”的自然民族称谓，准确表达其群体所指；句首连接词 וּ 在此承接叙事，不必机械译出。
- source_word: נָסְעוּ
  choice: 起行
  rationale: נסע 在旷野行程语境中指拔营出发、继续前行；“起行”简洁地保留这一行程用语的意味。
- source_word: מִבְּאֵרֹת בְּנֵי יַעֲקָן
  choice: 从比罗比尼雅干
  rationale: 按旷野行程中的地名处理并音译；前缀 מִן 译为“从”。
- source_word: מוֹסֵרָה
  choice: 到了摩西拉
  rationale: 原文没有显式的目的地介词，但在“从……起行”的行程句式中表示到达的目的地；汉语补出“到了”以使关系清楚自然。
- source_word: שָׁם מֵת אַהֲרֹן וַיִּקָּבֵר שָׁם
  choice: 亚伦死在那里，也葬在那里
  rationale: 保留原文两次 שָׁם 的重复和地点强调；וַיִּקָּבֵר 是被动式，译作“葬在那里”，不擅自补出埋葬者。
- source_word: וַיְכַהֵן
  choice: 作祭司
  rationale: כהן 的动词形式表示履行祭司职分；“作祭司”是清楚、自然的现代汉语表达。
- source_word: אֶלְעָזָר בְּנוֹ תַּחְתָּיו
  choice: 他儿子以利亚撒接替他
  rationale: תַּחְתָּיו 字面为“在他的位置上”，在这里表达职分承继；“接替他”自然传达这一含义，同时不额外规定承继礼仪或时间细节。
theological_decisions:
- issue: 以利亚撒承继亚伦祭司职分的表达
  choice: 接替他作祭司
  alternative: 在他之后作祭司／代替他作祭司
  rationale: 原文 תַּחְתָּיו 强调在亚伦的位置上承继职分。“接替他”保留职分传承的含义，但不引入关于祭司制度的额外教义解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“起行”保留旷野行程的语感；两个“在那里”对应原文的重复强调。人名、地名采用简体中文圣经语境中易识别的音译形式。
