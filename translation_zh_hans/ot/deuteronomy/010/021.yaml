  text: ה֥וּא תְהִלָּתְ/ךָ֖ וְ/ה֣וּא אֱלֹהֶ֑י/ךָ אֲשֶׁר עָשָׂ֣ה אִתְּ/ךָ֗ אֶת הַ/גְּדֹלֹ֤ת וְ/אֶת הַ/נּֽוֹרָאֹת֙ הָ/אֵ֔לֶּה אֲשֶׁ֥ר רָא֖וּ עֵינֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/021.yaml
  text: He is your praise[a], and he is your God[b], who has done for you these great and awe-inspiring things that your eyes have seen.
translation:
  language: zh_hans
  text: 他是你的颂赞[a]，他是你的上帝；他为你行了这些伟大而可畏的事[b]，都是你亲眼见过的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“他是你所颂赞的”，或“他是你所夸耀的”。希伯来语直译为“他是你的颂赞”。
    reason: lexical_alternative
  - marker: b
    text: 或译“令人敬畏的事”或“令人恐惧的事”。希伯来语所用的词指使人产生惧怕和敬畏的作为。
    reason: lexical_alternative
lexical_decisions:
- source_word: תְהִלָּתְךָ
  choice: 你的颂赞
  rationale: 保留希伯来语名词性表语的凝练表达，使上帝既可被理解为以色列颂赞的对象，也可被理解为其颂赞和夸耀的根由；不在正文中把这一张力化约为单一解释。
- source_word: אֱלֹהֶיךָ
  choice: 你的上帝
  rationale: 按现代标准普通话表达圣约关系，并保留第二人称单数对作为整体的以色列所作的直接称呼。
- source_word: עָשָׂה אִתְּךָ
  choice: 为你行了
  rationale: 这里的结构在上下文中具有受益含义，指上帝为以色列施行大事；“为你行了”比逐字译作“与你行了”更自然准确。
- source_word: הַגְּדֹלֹת
  choice: 伟大的事
  rationale: 该形容词作名词使用，泛指规模、能力和意义重大的作为；“伟大”避免把含义仅限于力量。
- source_word: הַנּוֹרָאוֹת
  choice: 可畏的事
  rationale: 该词源于表示惧怕、敬畏的词根，描述使人产生惧怕与敬畏的作为。“可畏”兼顾庄严敬畏和真实威势，不弱化为口语化的“令人惊叹”。
- source_word: הָאֵלֶּה
  choice: 这些
  rationale: 保留指示词的临近感，指向以色列已经亲历的那些作为。
- source_word: רָאוּ עֵינֶיךָ
  choice: 你亲眼见过
  rationale: 以自然汉语保留希伯来语“你的眼睛看见”的亲历和见证意味。
- source_word: הוּא ... וְהוּא
  choice: 他是……他是……
  rationale: 重复“他是”以体现原文代词重复所带的强调，不额外加入“唯有”等排他性成分。
theological_decisions:
- issue: הוּא תְהִלָּתְךָ 的名词性表语
  choice: 他是你的颂赞
  alternative: 他是你所颂赞的；他是你所夸耀的
  rationale: 正文尽量保留原文的神学张力：上帝既是颂赞的对象，也是以色列颂赞与夸耀的根由。较解释性的译法虽更顺畅，却会限定这一表达。
- issue: הַנּוֹרָאוֹת 中惧怕与敬畏的双重色彩
  choice: 可畏的事
  alternative: 令人敬畏的事；令人恐惧的事
  rationale: “可畏”不把词义缩减为负面的恐怖，也不消除其中真实的惧怕意味，适合描述上帝使人震惧敬畏的大能作为。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“你的颂赞”略带诗性，刻意保留原文的紧凑结构和多重含义；“可畏”则保持经文的肃穆感。正文中的第二人称单数对应原文把以色列整体作为一个对象来称呼。
