base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/009.yaml
  text: Therefore Levi has no portion or inheritance with his brothers[a]; Yahweh is his inheritance[b], just as Yahweh your God spoke to him.
translation:
  language: zh_hans
  text: 因此，利未在他的弟兄们中没有份额和产业[a]；雅威就是他的产业[b]，正如雅威你的上帝对他所说的一样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译“与他的弟兄们一起”。单数的“利未”代表利未支派，与以色列其他支派相对。
    reason: cultural_note
  - marker: b
    text: 或译“雅威就是他的份”。原文重复使用“产业”一词，强调利未所得的不是土地，而是雅威自己。
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: 所以
  rationale: 表示由上文得出的结论；“所以”自然、清楚地保留了推论关系。
- source_word: לְלֵוִי
  choice: 利未
  rationale: 原文用单数专名代表利未支派；正文保留原文形式，并在脚注说明其集体含义。
- source_word: חֵלֶק
  choice: 份额
  rationale: 指分配所得的一份，适合土地分配语境，并与“产业”有所区别。
- source_word: נַחֲלָה
  choice: 产业
  rationale: 在申命记中常指承受而得的土地或权益；“产业”兼顾领地与承受所得之物的含义。
- source_word: עִם אֶחָיו
  choice: 在他的弟兄们中
  rationale: 保留阳性复数亲属称谓，同时以自然汉语表达利未与以色列其他支派之间的对照。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以音译呈现四字神名，保留其作为以色列上帝之专名的性质，而不以称号替代。
- source_word: הוּא נַחֲלָתוֹ
  choice: 就是他的产业
  rationale: 重复“产业”以保留原文的词汇呼应，并突出利未没有土地产业、雅威自己却是其产业的张力。
- source_word: כַּאֲשֶׁר דִּבֶּר
  choice: 正如……所说的
  rationale: 忠实表达“说、讲”的基本义，不擅自具体化为“应许”。
- source_word: אֱלֹהֶיךָ
  choice: 你的上帝
  rationale: 保留原文第二人称单数的盟约称谓。
- source_word: לוֹ
  choice: 对他
  rationale: 直接保留单数代词，所指为作为支派代表的利未。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；音译“雅威”保留专名性质，避免以称号取代。
- issue: 利未作为支派的单数代表
  choice: 利未
  alternative: 利未支派
  rationale: 原文使用单数专名；正文保留这种代表性表达，以脚注澄清其集体所指。
- issue: אֶחָיו 的性别与亲属表达
  choice: 他的弟兄们
  alternative: 他的同胞；其他以色列人
  rationale: 原文是阳性复数亲属词；直译保留措辞及各支派同源的意象。
- issue: 雅威作为利未的产业
  choice: 雅威就是他的产业
  alternative: 雅威就是他的份；雅威赐给他产业
  rationale: 原文以雅威自己作主语和产业，不说雅威另赐某物；重复“产业”保留土地产业与雅威自己的鲜明对照。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“份额和产业”保留两个并列名词，“就是”突出原文的对照和断定；句末“正如……所说的”保持原文简洁，不把“说”解释性扩充为“应许”。
