  text: הֵ֚ן לַ/יהוָ֣ה אֱלֹהֶ֔י/ךָ הַ/שָּׁמַ֖יִם וּ/שְׁמֵ֣י הַ/שָּׁמָ֑יִם הָ/אָ֖רֶץ וְ/כָל אֲשֶׁר בָּֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/014.yaml
  text: Behold[a], to Yahweh your God belong the heavens, even the highest heavens, the earth, and all that is in it.
translation:
  language: zh_hans
  text: 看哪，天，连最高的天[a]，地和其中的一切，都属于耶和华你的神。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“天和诸天之天。”
    reason: 保留希伯来语最高级式构造的字面形式。
lexical_decisions:
- source_word: הֵן
  choice: 看哪
  rationale: 这是引人注意并加强语气的话语标记；“看哪”保留了原文庄重的宣告力量，也符合现代中文圣经语体。
- source_word: לַיהוָה
  choice: 都属于耶和华
  rationale: 前置词 לַ 在这里表达归属关系；中文补出“都属于”，清楚传达原文省略谓语的所有权结构。
- source_word: אֱלֹהֶיךָ
  choice: 你的神
  rationale: 保留第二人称阳性单数后缀所表达的直接称呼和盟约语境，不作扩充。
- source_word: הַשָּׁמַיִם
  choice: 天
  rationale: 在宇宙性上下文中指诸天或天空领域；现代中文用“天”自然且范围足够宽广。
- source_word: וּשְׁמֵי הַשָּׁמָיִם
  choice: 连最高的天
  rationale: 原文直译为“诸天之天”，是表达最高程度的构造。“连最高的天”自然传达递进和强化，同时以脚注保留字面形式。
- source_word: הָאָרֶץ
  choice: 地
  rationale: 与“天”平行，并由“其中的一切”进一步界定，所指是整个大地，而非某一片土地。
- source_word: וְכָל אֲשֶׁר בָּהּ
  choice: 和其中的一切
  rationale: 直接表达地上所包含的一切，保持原文的全面范围和简洁结构。
theological_decisions:
- issue: 神圣之名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文明确使用四字神名。中文采用广为人知的专名“耶和华”，而不以“主”替代，从而保留经文中的盟约之名；“雅威”是更贴近现代学界重构发音的可行译法。
- issue: “天和诸天之天”的关系
  choice: 天，连最高的天
  alternative: 天和诸天之天
  rationale: 该构造通常表达范围的递进和最高程度，但原文仍保留两个并列成分。正文用“连”呈现强化关系，不把它解释为不同层级的完整宇宙论；字面结构收入脚注。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准普通话。“看哪”保留经文的郑重语气；整体句式简洁，并以“都属于”使希伯来语的归属结构在中文中清楚完整。
