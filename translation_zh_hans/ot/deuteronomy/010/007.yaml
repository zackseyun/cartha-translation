  yaml_path: translation/ot/deuteronomy/010/007.yaml
  text: From there they set out for Gudgodah[a], and from Gudgodah to Jotbathah, a land of streams of water.
translation:
  language: zh_hans
  text: 他们从那里起程，到了谷歌大；又从谷歌大起程，到了约巴他——一片有溪水之地。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“有水道之地”或“有水流的溪谷之地”。希伯来语“נַחֲלֵי מָיִם”可指有水流的溪道、水道，或溪谷（干谷）中的水流。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשָּׁם
  choice: 从那里
  rationale: 介词与地点副词的组合表示从上一处地点离开；“从那里”自然地承接行程。
- source_word: נָסְעוּ
  choice: 起程
  rationale: נסע在旷野行程语境中常指拔营出发；“起程”简洁保留离开的意味。
- source_word: הַגֻּדְגֹּדָה
  choice: 谷歌大
  rationale: 地名按希伯来语音译；采用适合现代普通话读者的简体中文形式。
- source_word: וּמִן הַגֻּדְגֹּדָה יָטְבָתָה
  choice: 又从谷歌大起程，到了约巴他
  rationale: 原文省略重复的行程动词，中文补出“起程，到了”，使路线关系清楚，同时不增添实质信息。
- source_word: יָטְבָתָה
  choice: 约巴他
  rationale: 地名按常见中文圣经译名形式音译。
- source_word: אֶרֶץ נַחֲלֵי מָיִם
  choice: 那里水溪纵横
  rationale: אֶרֶץ在此同位描述约巴他所在之地；נַחֲלֵי מָיִם可指有水的溪流、河道或谷地。“水溪纵横”以自然中文表达当地有多条水道，同时脚注保留地貌上的词义范围。
