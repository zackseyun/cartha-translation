base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/005.yaml
  text: Then I turned and came down from the mountain[a], and I put the tablets in the ark that I had made; and they are there, just as Yahweh commanded me.
translation:
  language: zh_hans
  text: 于是我转身，下了山，把那些版放进我所造的柜中；那些版就在那里[a]，正如雅威所吩咐我的那样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“它们就在那里”；这句话也可理解为这些版一直留在那里，直到摩西说话的时候。
    reason: 说明希伯来文וַיִּהְיוּ שָׁם既可作状态陈述，也可能含持续至说话时的意味。
lexical_decisions:
- source_word: וָאֵפֶן
  choice: 于是我转身
  rationale: פנה意为“转身、转向”；“于是”自然体现叙事中连续推进的语气。
- source_word: וָאֵרֵד מִן הָהָר
  choice: 下山
  rationale: ירד意为“下去、下来”，מִן הָהָר指“从那座山”；现代汉语用“下山”即可自然、完整地表达。
- source_word: וָאָשִׂם אֶת הַלֻּחֹת
  choice: 把版放进
  rationale: שׂים是“放、安置”，לֻחֹת是复数“版”；“放进”自然表达移入柜中的动作。此句本身未重复说明材质，因此不增译“石”。
- source_word: בָּאָרוֹן
  choice: 柜里
  rationale: אָרוֹן基本义为“柜、箱”；此处指摩西先前所造、用来存放法版的柜。译作“柜”避免在本节原文未使用“约”一词时增添限定。
- source_word: אֲשֶׁר עָשִׂיתִי
  choice: 我所造的
  rationale: 忠实表达修饰“柜”的关系从句，并表明制造者是说话者摩西。
- source_word: וַיִּהְיוּ שָׁם
  choice: 版就在那里
  rationale: 直译保留“在那里”的状态表达，不在正文中强行判定只是当时位于那里，还是一直留到说话之时。
- source_word: כַּאֲשֶׁר צִוַּנִי
  choice: 正如……吩咐我的
  rationale: כַּאֲשֶׁר表示相符或对应，“正如”准确传达“照着、如同”的关系；צִוַּנִי是“吩咐我”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，保留其作为专名的性质，而不以称号替代。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华／上主
  rationale: 原文直接使用四字神名；“雅威”较直接地按通行学术重构音译这一专名，避免改成称号，也不采用较传统但语音依据较弱的“耶和华”。
- issue: וַיִּהְיוּ שָׁם所表达的时间状态
  choice: 版就在那里，并以脚注说明可能含持续之意
  alternative: 版一直留在那里
  rationale: 希伯来文可以陈述版在那里，也可能从说话者视角暗示其持续留存。正文采用较少解释性的表达，以保留这一张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“下山”“放进”清楚易懂；“版”承接上下文所指的法版，不在本节额外加入“石”。分号呈现两个连续动作及其结果。脚注标记置于实际存在歧义的“版就在那里”之后。
