  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּ֚י יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם ה֚וּא אֱלֹהֵ֣י הָֽ/אֱלֹהִ֔ים וַ/אֲדֹנֵ֖י הָ/אֲדֹנִ֑ים הָ/אֵ֨ל הַ/גָּדֹ֤ל הַ/גִּבֹּר֙ וְ/הַ/נּוֹרָ֔א אֲשֶׁר֙ לֹא יִשָּׂ֣א פָנִ֔ים וְ/לֹ֥א יִקַּ֖ח שֹֽׁחַד־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/017.yaml
  text: For Yahweh your God is God of gods and Lord of lords[a], the great, mighty, and awesome God, who shows no partiality and takes no bribe.
translation:
  language: zh_hans
  text: 因为雅威你们的神是万神之神、万主之主，是伟大、大能、令人敬畏[a]的神；他不徇情面，也不收受贿赂。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“可畏的”或“令人畏惧的”。希伯来语指使人心生敬畏的那一位。
    reason: 说明 הַנּוֹרָא 同时包含畏惧与崇敬的语义范围。
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，为先前的劝勉说明理由，保留原文的因果关系。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来语四字神名的通行学术读音音译，保留这是神的专名，而不以称号替代。
- source_word: אֱלֹהֵי/כֶם
  choice: 你们的神
  rationale: 第二人称阳性复数后缀指以色列群体；与雅威连用时，אֱלֹהִים 在此为单数意义。
- source_word: אֱלֹהֵי הָאֱלֹהִים
  choice: 万神之神
  rationale: 采用现代汉语中自然而庄重的构造，保留希伯来语“神之神”的至高与超越意味，不在正文中界定其他“神”的本体地位。
- source_word: וַאֲדֹנֵי הָאֲדֹנִים
  choice: 万主之主
  rationale: 与“万神之神”形成平行结构，表达雅威凌驾一切掌权者的主权。
- source_word: הָאֵל הַגָּדֹל הַגִּבֹּר וְהַנּוֹרָא
  choice: 伟大、大能、令人敬畏的神
  rationale: 保留三个并列称谓的庄重节奏；“令人敬畏”同时传达威严所激发的畏惧与崇敬。
- source_word: אֲשֶׁר לֹא יִשָּׂא פָנִים
  choice: 他不徇情面
  rationale: 原文直译为“不抬举脸面”，是指不偏袒、不因人的身份或关系而改变判断；“不徇情面”在中文中自然并保留司法语境。
- source_word: וְלֹא יִקַּח שֹׁחַד
  choice: 也不收受贿赂
  rationale: 直接表达法律和伦理层面的含义，措辞清楚庄重。
theological_decisions:
- issue: “万神之神、万主之主”是否暗示认可多神论
  choice: 保留“万神之神、万主之主”这一至高权柄公式
  alternative: 至高的神、至高的主
  rationale: 原文的两个属格结构着重宣告雅威无可比拟的至高地位，但没有在本节解释其他所谓神与主的性质；译文不替原文消除这种修辞张力。
- issue: 四字神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: “雅威”较直接反映希伯来神名的可能读音，并清楚表明这里是专名；不用“主”替换，以免与本节的“万主之主”混同。
- issue: הַנּוֹרָא 所含畏惧与崇敬的张力
  choice: 令人敬畏
  alternative: 可畏；令人畏惧
  rationale: 该词指神使人产生畏惧、敬畏；“令人敬畏”避免只表现恐怖，也不把其威严弱化为一般赞叹。
translation_notes:
  register: 采用现代标准普通话的庄重书面语。“万神之神、万主之主”保持对称和经文式节奏；“不徇情面、也不收受贿赂”则用现代读者容易理解的司法伦理表达。
