  text: וַ/אֲהַבְתֶּ֖ם אֶת הַ/גֵּ֑ר כִּֽי גֵרִ֥ים הֱיִיתֶ֖ם בְּ/אֶ֥רֶץ מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/019.yaml
  text: So love the foreigner[a], because you were foreigners in the land of Egypt.
translation:
  language: zh_hans
  text: 所以，你们要爱寄居者[a]，因为你们曾在埃及地作寄居者。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“外来人”“侨居者”。希伯来语指住在以色列人中间、并非当地的人，而不只是短暂停留的旅客。
    reason: 说明גֵּר的词义范围，避免把“寄居者”误解为短暂停留的旅客。
lexical_decisions:
- source_word: וַ/אֲהַבְתֶּם
  choice: 所以，你们要爱
  rationale: וְ连接上文第18节，并使完成式在律法语境中具有命令作用；译作“所以……要爱”既表达承接与推论，也以自然现代汉语传达命令语气。
- source_word: הַ/גֵּר
  choice: 寄居者
  rationale: גֵּר指住在以色列人中间、并非本地出生且社会地位较弱的人，不只是短暂停留的旅客。“寄居者”能较准确保留其居住状态和外来身份；脚注补充现代释义。
- source_word: כִּי
  choice: 因为
  rationale: 此处引出命令的理由，“因为”清楚、自然。
- source_word: גֵרִים
  choice: 寄居者
  rationale: 这是גֵּר的复数形式；与前半句采用同一译词，以保留原文的词语呼应。汉语在“是……者”的结构中不必另加复数标记。
- source_word: הֱיִיתֶם
  choice: 也曾是
  rationale: היה在此表示过去的身份状态。“曾”体现以色列人在埃及的历史经历；“也”突显他们与如今寄居者之间的对应关系，虽属汉语语境中的明示，但不改变原意。
- source_word: בְּ/אֶרֶץ מִצְרָיִם
  choice: 在埃及地
  rationale: 保留אֶרֶץ“地”这一成分，也符合中文圣经历史叙述中自然、庄重的表达。
theological_decisions:
- issue: 盟约律法中גֵּר所指的社会身份
  choice: 寄居者
  alternative: 外来人、侨居者、陌生人
  rationale: 本节以以色列人曾在埃及作为外来居民的经历，作为他们爱护同类弱势外来居民的伦理依据。“寄居者”不把该词误解为普通陌生人或短期旅客，也不套用现代国籍与移民法律类别，同时保留其历史和神学分量。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“所以”承接第18节上帝爱寄居者的陈述；“你们要爱”清楚表达律法命令。前后统一译作“寄居者”，保留原文刻意的词语重复和伦理对应。
