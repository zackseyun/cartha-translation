  text: אֶת יְהוָ֧ה אֱלֹהֶ֛י/ךָ תִּירָ֖א אֹת֣/וֹ תַעֲבֹ֑ד וּ/ב֣/וֹ תִדְבָּ֔ק וּ/בִ/שְׁמ֖/וֹ תִּשָּׁבֵֽעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/020.yaml
  text: You shall fear Yahweh your God[a]; him you shall serve, to him you shall cling[b], and by his name you shall swear.
translation:
  language: zh_hans
  text: 你要敬畏雅威你的上帝[a]，要事奉他，紧紧依附于他[b]，并奉他的名起誓。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“惧怕雅威你的上帝。”这里的“怕”包含尊崇和顺服之意。
    reason: lexical_alternative
  - marker: b
    text: 或译：“紧紧持守他。”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 采用希伯来神名四字母的现代汉语音译，保留其作为以色列之上帝专名的性质，而不以称号代替。
- source_word: אֱלֹהֶיךָ
  choice: 你的上帝
  rationale: 准确表达带第二人称阳性单数后缀的形式，并保留盟约劝诫中的直接称呼。
- source_word: תִּירָא
  choice: 你要敬畏
  rationale: 该动词本义涉及惧怕，在盟约语境中又含尊崇与顺服；“敬畏”在现代汉语中能自然承载这两方面的分量。
- source_word: אֹתוֹ תַעֲבֹד
  choice: 要事奉他
  rationale: 保留前置宾语“他”的强调，并以“事奉”表达 עבד 在此处既是服事、又带敬拜意味的用法。
- source_word: וּבוֹ תִדְבָּק
  choice: 紧紧依附于他
  rationale: דבק 的基本意象是黏住、紧贴；与介词 ב 连用时表达对某人的牢固依附和盟约忠诚。“紧紧依附于他”保留了这一具象力度。
- source_word: וּבִשְׁמוֹ תִּשָּׁבֵעַ
  choice: 并奉他的名起誓
  rationale: 这是希伯来语中以某人的名作为誓言保证的固定表达；“奉他的名起誓”在汉语中清楚保留其法律与盟约意味。
theological_decisions:
- issue: 四个未完成式在律法劝诫语境中的语气
  choice: 统一译为“你要……”，后续动词承接省略主语
  alternative: 译为一连串直接命令：“敬畏……事奉……依附……起誓。”
  rationale: 这些形式在本节承担盟约命令功能；“你要”既明确表达义务，又保持庄重而自然的现代汉语节奏。
- issue: ירא 所表达的惧怕与尊崇之间的张力
  choice: 正文译作“敬畏”
  alternative: 译作“惧怕”
  rationale: 盟约语境不能把该词缩减为单纯恐惧，但也不应消除其中的畏惧分量；正文采用“敬畏”，脚注保留较直接的词义选择。
translation_notes:
  register: 采用现代、庄重而易懂的律法劝诫语体。“雅威”保留神的专名；句中重复“要”以呈现命令力度，同时避免机械复制希伯来语序。
