  to: 至于我，我像先前一样在山上停留了四十天四十夜；那一次，雅威也垂听了我[a]。雅威不愿毁灭你。
  rationale: 作了三项安全修订：以“像先前一样”更贴近比较短语，以“四十天四十夜”保留原文计数公式，并将“听了我的话”改为“垂听了我”，避免增添“话”这一未明说的宾语。脚注保留较宽的译法与语义说明。
