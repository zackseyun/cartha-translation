  text: וְ/אָנֹכִ֞י עָמַ֣דְתִּי בָ/הָ֗ר כַּ/יָּמִים֙ הָ/רִ֣אשֹׁנִ֔ים אַרְבָּעִ֣ים י֔וֹם וְ/אַרְבָּעִ֖ים לָ֑יְלָה וַ/יִּשְׁמַ֨ע יְהוָ֜ה אֵלַ֗/י גַּ֚ם בַּ/פַּ֣עַם הַ/הִ֔וא לֹא אָבָ֥ה יְהוָ֖ה הַשְׁחִיתֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/010.yaml
  text: As for me[a], I stood on the mountain as at the first time, forty days and forty nights, and Yahweh listened to me that time also; Yahweh was not willing to destroy you.
translation:
  language: zh_hans
  text: 至于我，我像先前一样在山上停留了四十天四十夜；那一次，雅威也垂听了我[a]。雅威不愿毁灭你。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“听了我”。这里的希伯来语动词可泛指听取；在摩西代求的语境中，也可表示垂听并作出有利回应。
    reason: 保留שׁמע在一般听取与有利回应之间的词义幅度。
lexical_decisions:
- source_word: וְאָנֹכִי
  choice: 至于我
  rationale: 连词与独立人称代词共同形成轻微的转题和强调；“至于我”自然体现这一语用功能。
- source_word: עָמַדְתִּי
  choice: 停留
  rationale: 该动词本义可指“站立”，但在四十昼夜的持续语境中表示留在某处；“停留”避免使读者误以为摩西一直保持站姿。
- source_word: בָהָר
  choice: 在山上
  rationale: 符合此处介词短语的空间意义和现代汉语习惯。
- source_word: כַיָּמִים הָרִאשֹׁנִים
  choice: 像先前那一次一样
  rationale: 字面为“像起初的那些日子”，实际回指此前同样持续四十昼夜的上山经历；按事件整体表达为“先前那一次”更清楚。
- source_word: אַרְבָּעִים יוֹם וְאַרְבָּעִים לָיְלָה
  choice: 四十昼夜
  rationale: 简洁、准确地表达“四十天和四十夜”的完整时段。
- source_word: וַיִּשְׁמַע יְהוָה אֵלַי
  choice: 雅威也听了我的话
  rationale: שׁמע与אֶל搭配可表示听取某人的话，并在语境中含有积极回应之意；正文保留较宽泛的“听”，脚注说明“垂听”的可能语气。
- source_word: גַּם בַּפַּעַם הַהִוא
  choice: 那一次……也
  rationale: 自然呈现该次经历与前一次之间的重复、对应关系。
- source_word: לֹא אָבָה
  choice: 不愿
  rationale: 直接保留动词所表达的意愿或同意层面的否定。
- source_word: הַשְׁחִיתֶךָ
  choice: 毁灭你
  rationale: 准确表达使役形式的毁灭意义；“你”保留希伯来语将以色列作为整体称呼的第二人称单数。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；音译“雅威”保留其作为专名的性质，不以称号代替。
- issue: וַיִּשְׁמַע יְהוָה אֵלַי所表达的神圣回应
  choice: 雅威也听了我的话
  alternative: 雅威也垂听了我
  rationale: 上下文涉及摩西代求，动词可能包含有利回应的意味；正文采用含义较宽的“听”，避免把回应机制说得过满，并以脚注保留“垂听”的解释。
- issue: 第二人称单数הַשְׁחִיתֶךָ的指向
  choice: 毁灭你
  alternative: 毁灭你们
  rationale: 原文用单数把以色列整体当作一个对象来称呼；保留“你”可呈现这一集体单数，不将其无声改为复数。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“停留”按长时段语境传达עָמַדְתִּי的惯用意义；保留对以色列的第二人称单数称呼，并用分号呈现雅威垂听与不愿毁灭之间的紧密联系。
