  yaml_path: translation/ot/deuteronomy/011/007.yaml
  text: For your own eyes have seen all the great work of Yahweh that he did[a].
translation:
  language: zh_hans
  text: 因为你们亲眼看见了雅威所行的一切大事[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译：“你们的眼睛，就是那些看见的（眼睛）”；这种强调的说法表明他们是亲眼见证者。
    reason: 说明原文以“眼睛”加定语性分词构成的特殊强调句式，以及其目击者强调。
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，为前面的劝勉提出理由；现代汉语中“因为”能自然保留其因果、解释功能。
- source_word: עֵינֵיכֶם הָרֹאֹת
  choice: 是你们亲眼看见了
  rationale: 希伯来文直陈“你们的眼睛”并配以分词，突出听众本人是目击者；汉语用“是你们亲眼看见了”兼顾强调和自然表达。
- source_word: אֶת כָּל מַעֲשֵׂה
  choice: 所行的一切大事
  rationale: מַעֲשֶׂה 在 כָּל 后可集合性地指全部作为；结合 הַגָּדֹל，译为“一切大事”比“一切伟大的工作”更符合现代汉语。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文直接音译四字神名，保留其作为专名的性质，不以称号替代。
- source_word: הַגָּדֹל
  choice: 大
  rationale: 直接保留表示重大、宏伟的修饰意义；在“一切大事”中表达自然。
- source_word: אֲשֶׁר עָשָׂה
  choice: 所行的
  rationale: 以汉语“所”字结构自然表达关系从句；施事“他”由“雅威”清楚承接，无须重复。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文使用四字神名；“雅威”较直接反映通常重建的读音，并保留专名性质。
translation_notes:
  register: 采用现代、庄重而易懂的经文语体。“是你们亲眼看见了”有意突出原文的主语和目击者身份；“所行的一切大事”避免生硬照搬“伟大的工作”。
