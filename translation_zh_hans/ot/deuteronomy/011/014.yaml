base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/014.yaml
  text: then I will give the rain for your land in its season[a], the early rain and the late rain, and you will gather in your grain, your new wine[c][b], and your oil.
translation:
  language: zh_hans
  text: 我必按时使雨降在你们的土地上，就是秋雨和春雨[a]；你就必收聚你的五谷、新酒[b]和油[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “秋雨和春雨”或译“早雨和晚雨”。
    reason: lexical_alternative
  - marker: b
    text: 指当季新产的酒；也可译作“酒”。
    reason: lexical_alternative
  - marker: c
    text: 这里指橄榄油。
    reason: cultural_note
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: 我就……降雨
  rationale: 第一人称单数的完成式在前文条件结构中表达随之而来的应许；“就”自然体现结果关系，并保留上帝亲自赐雨的含义。
- source_word: מְטַר אַרְצְכֶם בְּעִתּוֹ
  choice: 按时给你们的土地降雨
  rationale: בְּעִתּוֹ指合宜、应有的时节；“按时”简洁自然。“土地”保持农业和盟约语境，不现代化为政治意义的“国家”。
- source_word: יוֹרֶה וּמַלְקוֹשׁ
  choice: 秋雨和春雨
  rationale: 两词分别指雨季初期、通常在秋季降下的雨，以及后期、通常在春季降下的雨；采用季节名称能让现代读者直接理解，同时以脚注保留“早雨和晚雨”的传统表达。
- source_word: וְאָסַפְתָּ
  choice: 你就可以收获
  rationale: 该动词指收集、收聚农产；“收获”符合本节农业语境。“可以”自然表达降雨所带来的实际结果，但不把应许改写为抽象因果原则。
- source_word: דְגָנֶךָ
  choice: 五谷
  rationale: דָּגָן泛指谷物出产；“五谷”在现代汉语中自然概括各种粮谷，并符合三联农产品的庄重语体。
- source_word: וְתִירֹשְׁךָ
  choice: 新酒
  rationale: תִּירוֹשׁ通常指当季新产的酒或葡萄汁液；“新酒”保留其农业收成语境，也不武断限定发酵程度。
- source_word: וְיִצְהָרֶךָ
  choice: 油
  rationale: 在“五谷、新酒和油”的固定农产组合中指橄榄油；正文用简洁的“油”，脚注说明具体所指。
theological_decisions:
- issue: 盟约语境中的农业祝福
  choice: 按字面译为上帝应许按季降雨，使以色列人在土地上获得农产。
  alternative: 把雨水主要解释为属灵、圣礼性、末世性或致富意义的象征。
  rationale: 希伯来文本直接描写土地、时雨和农产。译文应保留这一具体的盟约性农业应许，不在正文中加入后来的神学象征。
- issue: 第二人称单复数的转换
  choice: 保留“你们的土地”与“你就可以收获”的转换。
  alternative: 统一改为全复数或全单数。
  rationale: 原文אַרְצְכֶם使用第二人称复数后缀，而וְאָסַפְתָּ及后续物主后缀为第二人称单数，体现把以色列全体视为一个整体的称呼方式；不宜在翻译中抹平。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“按时给……降雨”比逐词译作“赐下……的雨”更自然；分号保持希伯来文从赐雨到收成的推进。正文有意保留第二人称由复数转为单数的集体称谓现象。
