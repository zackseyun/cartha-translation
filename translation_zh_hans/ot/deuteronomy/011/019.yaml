base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/019.yaml
  text: You shall teach them to your children[a], speaking of them when you sit in your house, and when you walk on the road, and when you lie down, and when you rise up.
translation:
  language: zh_hans
  text: 你们要把这些教导给你们的儿女[a]；无论坐在家里，走在路上，躺下，起来，都要谈论这些。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“你们的儿子”。希伯来语使用阳性复数形式，在这里也可代表性地泛指儿女。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִמַּדְתֶּם
  choice: 你们要……教导
  rationale: למד 的 Piel 词干通常意为“教导”。句首连接词承接上文，现代汉语不必机械译作“并且”。原文也没有“殷勤”之意。
- source_word: אֹתָם
  choice: 这些
  rationale: 阳性复数宾格代词回指上下文中的话语或诫命。汉语单用“它们”略显生硬，译作“这些”既保留回指，又不在正文中过度限定所指。
- source_word: אֶת־בְּנֵיכֶם
  choice: 你们的儿女
  rationale: בנים 可狭义指“儿子”，也可代表性地指后代或儿女；在盟约教导的语境中，“儿女”自然表达整体范围，同时以脚注保留较窄的词义可能。
- source_word: לְדַבֵּר בָּם
  choice: 谈论这些
  rationale: 带 ל 的不定式说明教导时伴随的言说内容；בם 在这里自然理解为谈论这些话语或诫命。
- source_word: בְּשִׁבְתְּךָ בְּבֵיתֶךָ
  choice: 坐在家里
  rationale: ב 加不定式构成时间情境，即“当你坐着时”；בביתך 直指“在你家中”。配合后续并列结构，汉语省去重复的“当……时”更流畅。
- source_word: וּבְלֶכְתְּךָ בַדֶּרֶךְ
  choice: 走在路上
  rationale: הלך 是普通的“走、行”；בדרך 表示“在路上”。此译简洁保留日常活动的图景。
- source_word: וּבְשָׁכְבְּךָ
  choice: 躺下
  rationale: שכב 的不定式配 ב 表示“当你躺下时”；直译在现代汉语中自然，并与“起来”构成对应。
- source_word: וּבְקוּמֶךָ
  choice: 起来
  rationale: קום 在此指起身，可能尤其涉及从睡眠或休息中起来；“起来”比“起床”更少作解释，也保留原文的宽度。
theological_decisions:
- issue: בְּנֵיכֶם 的性别与范围
  choice: 你们的儿女
  alternative: 你们的儿子
  rationale: 阳性复数 בנים 在此可代表性地涵盖子女。正文采用“儿女”表达盟约教导面向后代的整体范围，脚注同时保留“儿子”这一较字面的译法，避免消除词汇本身的性别形式。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。后半句将四个时间情境并列，并把“都要谈论这些”置后统摄全句，符合汉语信息结构，也保留原文从居家到出行、从躺下到起来的全面节奏。
