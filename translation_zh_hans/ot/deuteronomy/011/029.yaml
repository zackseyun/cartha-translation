  text: וְ/הָיָ֗ה כִּ֤י יְבִֽיאֲ/ךָ֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ אֶל הָ/אָ֕רֶץ אֲשֶׁר אַתָּ֥ה בָא שָׁ֖מָּ/ה לְ/רִשְׁתָּ֑/הּ וְ/נָתַתָּ֤ה אֶת הַ/בְּרָכָה֙ עַל הַ֣ר גְּרִזִ֔ים וְ/אֶת הַ/קְּלָלָ֖ה עַל הַ֥ר עֵיבָֽל־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/029.yaml
  text: And when Yahweh your God brings you into the land that you are entering to possess[a], you shall set the blessing on Mount Gerizim and the curse on Mount Ebal.
translation:
  language: zh_hans
  text: 当雅威你的上帝领你进入你将要进去占有的那地时，你要将祝福放在基利心山上，将咒诅放在以巴路山上。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你要在基利心山上宣告祝福，在以巴路山上宣告咒诅。”希伯来语直译为“给、放置或设立”；具体礼仪由上下文进一步说明。
    reason: 说明 וְנָתַתָּה 的词义范围，并保留其礼仪动作的可能解释。
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: 当……时
  rationale: 这是引出将来情形的惯用结构；现代汉语用“当……时”自然表达其时间关系，无须生硬译出“事情将是”。
- source_word: יְבִיאֲךָ
  choice: 领你进入
  rationale: בוא 的使役形表示使人进入，即“带入、领入”；“领你进入”既体现使役含义，也符合摩西讲话的庄重语境。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来语四字神名作音译，以区别于“主”等称号，并保留经文中的专名性质。
- source_word: אֱלֹהֶיךָ
  choice: 你的上帝
  rationale: 准确表达附有第二人称单数后缀的结构，也保留立约关系中的直接称呼。
- source_word: הָאָרֶץ
  choice: 那地
  rationale: 上下文特指以色列将要占有的应许之地；“那地”在现代汉语中既自然，也保留定指意味。
- source_word: אֲשֶׁר אַתָּה בָא שָׁמָּה לְרִשְׁתָּהּ
  choice: 你将要进去占有的
  rationale: 分词与方向词表达即将进入，לְרִשְׁתָּהּ 表目的，即进入以占有那地；译文保留进入与占有两个动作。
- source_word: וְנָתַתָּה
  choice: 你要……设在
  rationale: נתן 的基本义为“给、放、设”；此处不直接把具体礼仪解释为“宣告”，以保留原文对行动方式的开放性。
- source_word: הַבְּרָכָה
  choice: 祝福
  rationale: 指上下文中已经提出的立约祝福，与“咒诅”构成明确对举。
- source_word: עַל הַר גְּרִזִים
  choice: 在基利心山上
  rationale: עַל 在此标明与山的空间或礼仪关联；“在……山上”是自然且具体的汉语表达。
- source_word: הַקְּלָלָה
  choice: 咒诅
  rationale: 与“祝福”平行，表达违反盟约所对应的咒诅。
- source_word: עַל הַר עֵיבָל
  choice: 在以巴路山上
  rationale: 与基利心山的短语保持对称，并采用通行的中文地名译法。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文使用的是神的专名，而非“主”这一称号；“雅威”较直接反映学界通常重构的发音，同时不把专名替换成称号。
- issue: 把祝福与咒诅“设在”两座山上的具体含义
  choice: 保留“设在”的具体而未完全解释的说法
  alternative: 译作“在……山上宣告祝福／咒诅”
  rationale: 原文动词 נתן 本身是“给、放、设”，并未明确写出“宣告”；周围经文说明相关礼仪，因此正文不宜先行限定其具体实行方式。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“领你进入”体现使役语态；“设在”保留原文的具体措辞及其歧义。脚注标记置于整句末，说明祝福和咒诅两项平行表达。
