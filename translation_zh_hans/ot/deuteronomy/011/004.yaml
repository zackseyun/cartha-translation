  text: וַ/אֲשֶׁ֣ר עָשָׂה֩ לְ/חֵ֨יל מִצְרַ֜יִם לְ/סוּסָ֣י/ו וּ/לְ/רִכְבּ֗/וֹ אֲשֶׁ֨ר הֵצִ֜יף אֶת מֵ֤י יַם סוּף֙ עַל פְּנֵי/הֶ֔ם בְּ/רָדְפָ֖/ם אַחֲרֵי/כֶ֑ם וַ/יְאַבְּדֵ֣/ם יְהוָ֔ה עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/004.yaml
  text: and what he did to the army of Egypt[a], to its horses and its chariots, when he made the waters of the Red Sea overflow over them as they pursued you, and Yahweh destroyed them to this day,
translation:
  language: zh_hans
  text: 以及他怎样处置埃及的军队、埃及的马匹和战车：他们追赶你们的时候，他使红海[a]的水漫过他们；雅威把他们消灭了，直到今日。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语作“芦苇海”；传统译作“红海”。
    reason: 说明יַם סוּף的字面意义与传统地名译法之间的差异。
lexical_decisions:
- source_word: חֵיל
  choice: 军队
  rationale: 本节以马匹和战车进一步说明埃及的军事力量，因此译作“军队”最符合语境。
- source_word: לְסוּסָיו וּלְרִכְבּוֹ
  choice: 他们的马匹和战车
  rationale: 后缀回指作为集合实体的埃及军队；中文以复数代词“他们的”自然承接，רֶכֶב 在此按具体军事装备译为“战车”。
- source_word: הֵצִיף
  choice: 使……漫过
  rationale: 使役词形表明上帝使海水淹没追兵；“使……漫过”既保留使役意义，也符合现代汉语表达。
- source_word: מֵי יַם סוּף
  choice: 红海的水
  rationale: 正文采用中文传统且通行的地名“红海”；希伯来语字面名称可能是“芦苇海”，在脚注中说明。
- source_word: עַל־פְּנֵיהֶם
  choice: 漫过他们
  rationale: 此处短语表示水覆盖、淹没追兵，不宜机械译作“在他们脸上”。
- source_word: בְּרָדְפָם אַחֲרֵיכֶם
  choice: 他们追赶你们的时候
  rationale: ב 加不定式结构表达同时发生的动作；此译自然保留时间关系。
- source_word: וַיְאַבְּדֵם
  choice: 把他们灭绝
  rationale: 使役语境表示雅威使埃及追兵灭亡；“灭绝”并保留后接“直到今日”所表达的彻底而持续的结果。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代中文音译呈现四字神名，而不以称号替代专名。
- source_word: עַד הַיּוֹם הַזֶּה
  choice: 直到今日
  rationale: 保留希伯来语的时间表达及其从事件延续到讲话当下的视角，不把它改写为仅指当时的一次结果。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；正文以较贴近通常学术重构发音且为现代中文所知的“雅威”呈现专名，不用“主”替代。
- issue: יַם סוּף 的译法
  choice: 正文作“红海”，脚注注明“芦苇海”
  alternative: 正文作“芦苇海”
  rationale: “红海”是中文读者熟悉的传统地理名称，而原文字面所含的“芦苇”意义是真实的词汇问题，故以脚注保留，不武断解决地理认定。
- issue: עַד הַיּוֹם הַזֶּה 与灭绝事件的关系
  choice: “雅威把他们灭绝，直到今日”
  alternative: “雅威彻底消灭了他们，直到今日仍是如此”
  rationale: 原文结构简短，允许“直到今日”修饰灭绝结果的延续；正文保留这种略带张力的表达，不额外解释为特定历史或神学主张。
translation_notes:
  register: 采用现代、庄重且易懂的简体中文。经文是承接上文的并列成分，故以“以及”起句；用冒号划分受事列举与事件叙述，避免中文长句层次不清。
