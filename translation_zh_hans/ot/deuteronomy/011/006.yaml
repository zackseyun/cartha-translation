  text: וַ/אֲשֶׁ֨ר עָשָׂ֜ה לְ/דָתָ֣ן וְ/לַ/אֲבִירָ֗ם בְּנֵ֣י אֱלִיאָב֮ בֶּן רְאוּבֵן֒ אֲשֶׁ֨ר פָּצְתָ֤ה הָ/אָ֨רֶץ֙ אֶת פִּ֔י/הָ וַ/תִּבְלָעֵ֥/ם וְ/אֶת בָּתֵּי/הֶ֖ם וְ/אֶת אָהֳלֵי/הֶ֑ם וְ/אֵ֤ת כָּל הַ/יְקוּם֙ אֲשֶׁ֣ר בְּ/רַגְלֵי/הֶ֔ם בְּ/קֶ֖רֶב כָּל יִשְׂרָאֵֽל־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/006.yaml
  text: and what he did to Dathan and Abiram[a], sons of Eliab son of Reuben—how the earth opened its mouth and swallowed them, their households, their tents, and every living thing at their feet[b], in the midst of all Israel.
translation:
  language: zh_hans
  text: 以及他向达坦和亚比兰所行的事；他们是流便的儿子以利押的儿子。地张开口，在全以色列人中间吞没了他们、他们的家[a]、他们的帐棚，以及一切在他们脚下的所有[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “家”原文直译为“他们的房屋”。此词可指实际住处，也可较广泛地指他们的家户。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“一切在他们脚下的所有”。这短语的具体所指不十分确定，可能包括随从他们的人，以及与他们相关的牲畜或财物。
    reason: lexical_alternative
lexical_decisions:
- source_word: עָשָׂה
  choice: 处置
  rationale: 本节承接上文，回顾上帝对叛逆者所做的事；“处置”在现代汉语中自然，也保留此处带有审判意味的语境。
- source_word: בְּנֵי אֱלִיאָב בֶּן רְאוּבֵן
  choice: 他们是流便之子以利押的儿子
  rationale: 保留希伯来文的家谱式表达，不擅自改写为“流便支派的人”；“子”在家谱语境中也可表示后裔关系。
- source_word: פָּצְתָה הָאָרֶץ אֶת־פִּיהָ
  choice: 地张开口
  rationale: 保留原文鲜明的拟人化意象，比解释性的“地裂开”更贴近希伯来文。
- source_word: וַתִּבְלָעֵם
  choice: 吞下他们
  rationale: 直接保留 בלע“吞咽、吞下”的具体形象。
- source_word: בָּתֵּיהֶם
  choice: 他们的家属
  rationale: 该词字面可指“房屋”或“家”，但后面另列“帐棚”，因此正文采用能指家庭成员或家户的“家属”，并以脚注保留字面可能。
- source_word: אָהֳלֵיהֶם
  choice: 帐棚
  rationale: 符合旷野背景，也直接对应原文。
- source_word: כָּל־הַיְקוּם אֲשֶׁר בְּרַגְלֵיהֶם
  choice: 一切跟随或属于他们的人和物
  rationale: יְקוּם 所指宽泛，בְּרַגְלֵיהֶם 字面为“在他们脚下”，合起来可能涵盖随从、家眷、牲畜或财物；译文保留“跟随”与“属于”两方面，不把范围限定为仅有生命之物。
- source_word: בְּקֶרֶב כָּל־יִשְׂרָאֵל
  choice: 在以色列众人当中
  rationale: 自然表达事件发生在全体以色列人中间的公开性与空间意义。
theological_decisions:
- issue: 被吞下者及其附属者的范围
  choice: 译作“他们的家属……以及一切跟随或属于他们的人和物”
  alternative: 仅译作“他们的房屋……所有活物”
  rationale: 原文 בָּתֵּיהֶם 与 כָּל־הַיְקוּם 的范围并不完全确定；正文不将受审判对象武断限定为建筑物或活物，脚注说明词义张力。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语；保留“地张开口”的原文意象和家谱措辞，同时用脚注呈现“家”及“在他们脚下的一切所有”的词义不确定性。
