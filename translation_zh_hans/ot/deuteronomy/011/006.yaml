revisions:
- from: 以及他怎样处置大坍和亚比兰——他们是流便之子以利押的儿子：地怎样张开口，在以色列众人当中吞下他们、他们的家属[a]、帐棚，以及一切跟随或属于他们的人和物[b]。
  to: 以及他向达坦和亚比兰所行的事；他们是流便的儿子以利押的儿子。地张开口，在全以色列人中间吞没了他们、他们的家[a]、他们的帐棚，以及一切在他们脚下的所有[b]。
  rationale: 修订纠正“达坦”的通行译名，采用较中性的“所行的事”对应 עשה，并将家谱关系表达得更清楚。对“他们的家”和“在他们脚下的一切所有”，正文保留原文可容纳的歧义，具体范围仅在脚注中说明，避免把有争议的解释写死。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T04:57:23Z'
review_pass:
  verdict: revise
  source_fidelity: 草稿大体保留了地张口吞没的拟人意象、家谱关系和公开发生在全以色列中间的场景。但“处置”较“עשה（做／施行）”更强地预设审判性；“跟随或属于他们的人和物”将原文保留的简练而有争议的“在他们脚下的一切”扩展为两个明确的解释，且“人和物”并非原文逐项列出。
  naturalness: 原文主句与“地怎样……”的冒号衔接稍显生硬；“流便之子以利押的儿子”有潜在歧义，容易被读作以利押是“流便之子”这一称号而非流便的儿子。修订以“流便的儿子以利押的儿子”明确家谱链，并以较自然的平行句式表达。
  terminology: 人名宜采用现代中文圣经中通行的“达坦、亚比兰、以利押、流便”。“家”可在正文中保留希伯来文“房屋／家户”的歧义；脚注说明。对 יְקוּם 及“在他们脚下”的短语，正文避免武断限定为随从、归属物或仅活物。
  issues:
  - severity: medium
    issue: “大坍”不是现代中文圣经中该人名的通行译名。
    rationale: דָתָן 通常译作“达坦”；改正有助于名称一致性和读者辨识。
  - severity: medium
    issue: “一切跟随或属于他们的人和物”过度解释 כָּל־הַיְקוּם אֲשֶׁר בְּרַגְלֵיהֶם。
    rationale: 原文直指“在他们脚下的一切所有／存在者”，具体所指有争议。正文并列“跟随或属于”及“人和物”会把脚注中的解释性可能变成确定译文。
  - severity: low
    issue: “处置”强化了原文普通动词“做／施行”的审判色彩。
    rationale: 上下文确有审判背景，但此处 עשה 本身为普通动词；“向……所行的事”更贴近原文且不额外限定。
  - severity: low
    issue: “流便之子以利押的儿子”与冒号句式略有歧义和不顺。
    rationale: 明确为“流便的儿子以利押的儿子”，并调整标点，可更清楚地保留原文的家谱同位语和后续说明。
