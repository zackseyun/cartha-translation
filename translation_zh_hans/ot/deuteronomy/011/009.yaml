base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/009.yaml
  text: so that you may live long on the land that Yahweh swore to your fathers to give to them and to their offspring[b][a], a land flowing with milk and honey.
translation:
  language: zh_hans
  text: 好使你们在耶和华向你们的先祖[a]起誓要赐给他们和他们后裔[b]的那地上得以长久生活；那地是流奶与蜜之地。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“父辈”。希伯来文直译为“你们的父亲们”，在这里指先祖。
    reason: lexical_alternative
  - marker: b
    text: 或译“子孙”；希伯来文直译为“种子”，可集合性地指后代。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְמַעַן
  choice: 好使
  rationale: 引出目的或结果；“好使”自然地承接上文，并保留希伯来语的目的意味。
- source_word: תַּאֲרִיכוּ יָמִים
  choice: 长久生存
  rationale: 原文直译为“延长日子”，是表示长寿、久居的惯用语；“长久生存”既自然，也避免误读为人为延长日期。
- source_word: עַל הָאֲדָמָה
  choice: 在那片土地上
  rationale: 此处 אֲדָמָה 指应许之地，而非一般土壤；“在……土地上”符合现代汉语表达，也反映介词 עַל。
- source_word: אֲשֶׁר נִשְׁבַּע יְהוָה
  choice: 耶和华曾……起誓
  rationale: 明确保留“起誓”的盟约性和庄严性；用“耶和华”呈现神名 יהוה。
- source_word: לַאֲבֹתֵיכֶם
  choice: 向你们的先祖
  rationale: אָבוֹת 字面为“父辈”，在这里指以色列人的列祖；“先祖”是准确且自然的现代汉语集体称谓，同时用脚注保留字面形式。
- source_word: לָתֵת לָהֶם וּלְזַרְעָם
  choice: 要把那地赐给他们和他们的后裔
  rationale: זֶרַע 字面为“种子”，可集合性地指后代；“后裔”在中文中自然，并保留群体及跨世代含义。
- source_word: אֶרֶץ זָבַת חָלָב וּדְבָשׁ
  choice: 那是流奶与蜜之地
  rationale: 保留圣经中描绘土地丰饶的固定意象；破折号与判断句使同位说明在中文中清楚自然。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。中文正文采用读者最熟悉、庄重且明确作为专名的“耶和华”，不以“主”替代，从而保留神名的专名性质。
- issue: 赐地对象中“他们”和“他们的后裔”的并列
  choice: 保留“赐给他们和他们的后裔”
  alternative: 意译为“赐给他们的后裔”
  rationale: 原文明确并列 לָהֶם וּלְזַרְעָם。即使列祖本人对土地的拥有方式存在叙事与神学张力，译文也不将“他们”省略或重新解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“好使”承接上下文；分号标明目的句中的主要结果，破折号引出对那地的同位说明。所有代词及赐地对象均按原文保留。
