base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/016.yaml
  text: Be careful lest your heart be deceived and you turn aside and serve other gods and bow down to them[a].
translation:
  language: zh_hans
  text: 你们要谨慎，免得你们的心受迷惑[a]，你们就转离，服事别的神，向它们下拜。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“受引诱”。希伯来语这个动词可表示被劝诱、受引诱或受欺骗。
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשָּׁמְרוּ לָכֶם
  choice: 你们要谨慎
  rationale: 这是带反身意味的警戒语。现代汉语用“你们要谨慎”即可自然传达复数命令和自我警醒之意，无须生硬地译作“为自己谨慎”。
- source_word: פֶּן
  choice: 免得
  rationale: 引出警告所要防止的结果；“免得”准确、庄重，也符合现代汉语表达。
- source_word: יִפְתֶּה
  choice: 受迷惑
  rationale: פתה 可表示被说服、引诱或欺骗。“受迷惑”保留这种语义幅度，不武断限定迷惑来自欺骗还是诱惑；另一可行含义在脚注说明。
- source_word: לְבַבְכֶם
  choice: 你们的心
  rationale: לֵבָב 指人的内在，包括思想、意志和倾向。“心”保留原文意象及其盟约语境中的丰富含义。
- source_word: וְסַרְתֶּם
  choice: 你们就偏离正道
  rationale: סור 在这里表示离开当行的道路或应守的忠诚。“偏离正道”以自然汉语呈现其路径隐喻，同时不把对象过度明说。
- source_word: וַעֲבַדְתֶּם
  choice: 服事
  rationale: עבד 用于神明时指带有宗教忠诚与敬奉意味的服事。译作“服事”可与下文具体的俯伏动作区别开来。
- source_word: אֱלֹהִים אֲחֵרִים
  choice: 别的神
  rationale: 直接对应“其他的神明”；不增添原文没有明确表达的“外邦”含义。
- source_word: וְהִשְׁתַּחֲוִיתֶם לָהֶם
  choice: 向它们下拜
  rationale: השתחוה 表示俯伏、下拜，常具有敬拜意义。“下拜”保留具体动作，并由上下文清楚显出宗教含义。
theological_decisions:
- issue: 背道警告的推进关系
  choice: 保留从内心受迷惑，到偏离正道，再到服事并下拜别神的递进过程
  alternative: 概括译为“受引诱去敬拜偶像”
  rationale: 原文逐步描写内在迷惑及其外在后果。保留各环节可呈现盟约背离的完整过程，而不以概括性神学术语压平原文。
- issue: פתה 所表达的作用方式
  choice: 正文译“受迷惑”，脚注保留“受引诱”的可能
  alternative: 只译作“受欺骗”或只译作“受引诱”
  rationale: 该动词兼有说服、诱惑和欺骗的语义可能。正文与脚注的安排保留原文真实的词义张力，不指定一个原文未明说的外在行为者。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“服事”保留申命记中盟约忠诚的用语层次；“下拜”呈现具体敬拜动作。复数“你们”贯彻全句，以反映原文对以色列群体的警告。
