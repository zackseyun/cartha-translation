  text: וּ/שְׁמַרְתֶּם֙ אֶת כָּל הַ/מִּצְוָ֔ה אֲשֶׁ֛ר אָנֹכִ֥י מְצַוְּ/ךָ֖ הַ/יּ֑וֹם לְמַ֣עַן תֶּחֶזְק֗וּ וּ/בָאתֶם֙ וִֽ/ירִשְׁתֶּ֣ם אֶת הָ/אָ֔רֶץ אֲשֶׁ֥ר אַתֶּ֛ם עֹבְרִ֥ים שָׁ֖מָּ/ה לְ/רִשְׁתָּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/008.yaml
  text: So keep every commandment that I am commanding you today[c][b][a], so that you may be strong and go in and possess the land that you are crossing over to possess.
translation:
  language: zh_hans
  text: 所以，你们要谨守我今天吩咐你们的一切诫命[a]，使你们得以刚强[b]，进去得着那片你们正要渡过去取得的土地[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文为“全部的诫命”；“诫命”用单数作集合称呼，指全部命令。
    reason: lexical_alternative
  - marker: b
    text: 或译“得以强盛”。原文动词可表示变得刚强，也可按语境理解为获得力量。
    reason: lexical_alternative
  - marker: c
    text: “得着”和“取得”所对应的是同一个希伯来词，也可译为“承受产业”或“占有”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: 所以，你们要谨守
  rationale: שׁמר在盟约和律法语境中指遵守、持守；“谨守”庄重自然，也表达认真遵行之意。句首连接词按上下文的推论关系译为“所以”。
- source_word: כָּל הַמִּצְוָה
  choice: 一切诫命
  rationale: 原文“诫命”是单数集合用法，指整全的命令体系；中文“一切诫命”自然地传达其周全范围。
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: 我今天吩咐你们的
  rationale: 保留“今天”的即时性。希伯来文受词后缀为单数，视以色列为一个整体；现代汉语用复数“你们”配合本节其余复数动词，更自然，同时不改变集体受命的性质。
- source_word: לְמַעַן
  choice: 好使
  rationale: 清楚表达目的或预期结果，又符合庄重的现代汉语。
- source_word: תֶּחֶזְקוּ
  choice: 刚强
  rationale: חזק的Qal词形在此可指变得强壮或获得力量；“刚强”保留主动状态与可能的受力意味，不限缩为军事勇气。
- source_word: וּבָאתֶם
  choice: 进去
  rationale: בוא在进入应许之地的语境中意为进入；“进去”符合听众尚在河东、即将入境的视角。
- source_word: וִירִשְׁתֶּם ... לְרִשְׁתָּהּ
  choice: 得着……取得
  rationale: ירשׁ可表示承受、占有或取得。前处译“得着”保持简洁，后处译“取得”避免中文机械重复，同时保留实际取得土地的动态含义。
- source_word: הָאָרֶץ
  choice: 那片土地
  rationale: 指以色列即将进入的特定土地；“土地”保留地理和盟约语境，“那片”也自然承接后面的定语。
- source_word: אֲשֶׁר אַתֶּם עֹבְרִים שָׁמָּה
  choice: 你们正要渡河前往
  rationale: עברים在上下文指渡过约旦河，שמה带有“往那里”的方向意味；译文以“渡河前往”自然保留两者，而不加入原文未明说的河名。
theological_decisions:
- issue: 盟约命令中单数与复数的集体称呼
  choice: 正文统一采用“你们”，让上下文体现以色列作为集体受命者
  alternative: 用“你”标示מְצַוְּךָ的单数形式，或用“你们众人”突出复数
  rationale: 原文在单数受词后缀和复数动词之间转换，把以色列既视为整体又视为群体。现代汉语若强行切换“你／你们”容易误导为对象改变；统一用“你们”较自然，也不抹去集体性质。
- issue: ירשׁ在土地语境中的含义
  choice: 译为“得着／取得”，并以脚注保留“承受产业／占有”的可能性
  alternative: 统一译为“承受”或“占领”
  rationale: “承受”可能过度突出被动继承，“占领”则可能过度限定为军事征服；“得着／取得”兼顾应许与实际进入占有的张力。
- issue: תֶּחֶזְקוּ的施事与语态意味
  choice: 正文译“刚强”，脚注说明也可理解为“得以强盛”
  alternative: 明确译为“得到力量”或“勇敢起来”
  rationale: 原文Qal可表达变得强壮或处于强盛状态，并未明确说明力量的施予者，也不只指心理勇气；保持较宽泛表达可避免替原文解决神学与语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“谨守”“刚强”保留申命记劝诫语体；“渡河前往”自然呈现方向性，不明加“约旦河”。脚注标记均置于其所说明的正文词语之后。
