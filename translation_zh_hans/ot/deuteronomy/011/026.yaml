  yaml_path: translation/ot/deuteronomy/011/026.yaml
  text: See[a], today I am setting before you a blessing and a curse.
translation:
  language: zh_hans
  text: 看哪，我今天把祝福和咒诅摆[a]在你们面前。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “摆”也可译作“赐下”或“给”。希伯来语动词本义可指“给、放置”；与“在你们面前”连用时，译作“摆在你们面前”更符合现代汉语习惯。
    reason: lexical_alternative
lexical_decisions:
- source_word: רְאֵה
  choice: 看哪
  rationale: 这是阳性单数命令式，在话语中用于唤起全体听众注意。现代汉语“看哪”庄重、清楚，也保留了原文由单数形式转向复数听众的表达。
- source_word: אָנֹכִי
  choice: 我
  rationale: 独立人称代词使主语略带强调；汉语用明确的“我”即可自然表达，不加“亲自”，以免强化过度。
- source_word: נֹתֵן
  choice: 摆
  rationale: נתן基本义可为“给、放置”；与“在你们面前”连用时，“摆在……面前”最自然地表达把两个选择呈给听众。
- source_word: לִפְנֵיכֶם
  choice: 在你们面前
  rationale: 保留复数第二人称，表达在全体听众面前呈示的意思。
- source_word: הַיּוֹם
  choice: 今天
  rationale: 直接、自然地对应时间副词，符合现代标准汉语。
- source_word: בְּרָכָה
  choice: 祝福
  rationale: 与“咒诅”构成对举，保留名词形式及盟约语境，不添加原文没有的限定。
- source_word: וּקְלָלָה
  choice: 和咒诅
  rationale: 用“和”连接两个并列而相反的选项；“咒诅”准确保留该词在申命记语境中的庄重含义。
theological_decisions:
- issue: 祝福与咒诅的性质
  choice: 按原文译为摆在以色列人面前的两个盟约性结果，不在本节内补充解释。
  alternative: 将其泛化为普遍性的善恶报应原则。
  rationale: 本节在申命记上下文中引出盟约的祝福与咒诅；译文应保留这种并列和张力，而不加入后来的教义阐释。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“看哪”保留原文引人注意的命令语气；正文中的“你们”对应复数受众。脚注标记置于整句之后。
