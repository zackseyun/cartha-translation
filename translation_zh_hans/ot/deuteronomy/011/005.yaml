  text: וַ/אֲשֶׁ֥ר עָשָׂ֛ה לָ/כֶ֖ם בַּ/מִּדְבָּ֑ר עַד בֹּאֲ/כֶ֖ם עַד הַ/מָּק֥וֹם הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/005.yaml
  text: and what he did for you in the wilderness until you came to this place—
translation:
  language: zh_hans
  text: 以及他在旷野为你们所做的，直到你们来到这地方——
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַאֲשֶׁר
  choice: 以及……所做的
  rationale: 连词与关系词承接上文所列举的事；用“以及……所做的”既保留关系结构，也自然衔接前文。
- source_word: עָשָׂה
  choice: 所做的
  rationale: עָשָׂה在此指上帝的作为；“所做的”直接、自然，不额外限定这些行动的性质。
- source_word: לָכֶם
  choice: 为你们
  rationale: 介词ל在此表示这些行动关乎并惠及以色列人；“为你们”符合上下文和现代汉语表达。
- source_word: בַּמִּדְבָּר
  choice: 在旷野
  rationale: “旷野”是描述以色列行程所经地区的通行且准确的圣经地理用语，不将其过度限定为沙漠。
- source_word: עַד
  choice: 直到
  rationale: 第一个עַד表示时间延续的终点，“直到”准确呈现上帝在旷野中的作为延续到他们抵达之时。
- source_word: בֹּאֲכֶם
  choice: 你们来到
  rationale: בוא的带后缀不定式在עַד之后自然译为有限分句“你们来到”；“来到”不额外加入进入某一有边界地区的含义。
- source_word: עַד הַמָּקוֹם הַזֶּה
  choice: 来到这地方
  rationale: 第二个עַד表示空间终点。汉语用“来到这地方”自然涵盖抵达终点之意，同时避免生硬重复“直到……到……”。
theological_decisions:
- issue: עָשָׂה的隐含主语
  choice: 在汉语关系结构中省略主语，由上下文指向耶和华
  alternative: 明确译作“他所做的”或“耶和华所做的”
  rationale: 希伯来文动词的主语由上下文承接为耶和华。现代汉语在此可自然省略主语，既避免不必要地重复，也不增添原文未在本节明说的名词。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“以及”承接上文列举；“旷野”为通行圣经用语。句末破折号保留本节尚未完结、继续衔接下文的句法状态。
