  yaml_path: translation/ot/deuteronomy/011/020.yaml
  text: And you shall write them on the doorposts of your house and on your gates[a][b].
translation:
  language: zh_hans
  text: 也要把这些话写在你家的门柱[a]上，也写在你的城门[b]上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“门框”。希伯来语所指的是门口两侧的柱子。
    reason: lexical_alternative
  - marker: b
    text: 或译“城门口”。希伯来语既可指城门本身，也可指城门所在的区域。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְתַבְתָּם
  choice: 也要把这些话写
  rationale: 连词连接前文连续的盟约命令；完成式在此具有指令语气，译作“要……写”。三复数宾语后缀回指前文所说的话，为使中文指代清楚，译作“这些话”。
- source_word: עַל
  choice: 在……上
  rationale: 表示文字书写于某物表面，现代汉语自然译作“在……上”。
- source_word: מְזוּזוֹת
  choice: 门框
  rationale: 该词指门口两侧的门柱。现代汉语“门框”自然易懂，也可译作“门柱”；不采用音译，以免把经文中的普通名词误解为后世特定宗教物件。
- source_word: בֵּיתֶךָ
  choice: 你家
  rationale: בַּיִת在此指个人的房屋及家庭居所；“你家”比“你的房屋”更符合现代汉语，同时保留具体的家庭居所含义。
- source_word: וּבִשְׁעָרֶיךָ
  choice: 和你的城门上
  rationale: שַׁעַר通常指城邑或聚居地的门，也可涵盖城门口区域。结合申命记的社会语境，正文采用“城门”，并以脚注保留“城门口”的可能性。
theological_decisions: []
