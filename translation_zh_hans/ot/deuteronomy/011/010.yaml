base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/010.yaml
  text: For the land that you are entering to possess is not like the land of Egypt[a], from which you came out, where you sowed your seed and watered it with your foot[b], like a vegetable garden.
translation:
  language: zh_hans
  text: 因为你要进去得为业的那地，不像你们所出来的埃及地；在那里，你撒种，用脚浇灌，像浇灌菜园一样。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，为此前的劝勉说明理由；现代汉语用“因为”能自然体现因果关系。
- source_word: הָאָרֶץ
  choice: 那地
  rationale: 申命记中 אֶרֶץ 指以色列将要取得的应许之地；“那地”既简洁，也保留全书反复出现的土地主题。
- source_word: בָא שָׁמָּה
  choice: 要进去
  rationale: 分词表达即将发生的进入行动；“要进去”符合现代汉语，也保留目的地含义。
- source_word: לְרִשְׁתָּהּ
  choice: 得为业
  rationale: ירשׁ 在申命记中常指取得并持有那地；“得为业”保留盟约与产业色彩，又不额外强调血缘继承。
- source_word: לֹא כְאֶרֶץ מִצְרַיִם
  choice: 不像……埃及地
  rationale: 直接保留迦南与埃及之间的明示对比。
- source_word: אֲשֶׁר יְצָאתֶם מִשָּׁם
  choice: 你们出来的
  rationale: 保留“出来”这一出埃及叙事的惯用表达，并按希伯来语复数译作“你们”。
- source_word: אֲשֶׁר תִּזְרַע אֶת זַרְעֲךָ
  choice: 在那里，你撒下种子
  rationale: 保留单数集体称谓“你”和“种子”的具体农业意象；未将其解释性地改成“庄稼”。
- source_word: וְהִשְׁקִיתָ
  choice: 浇灌
  rationale: 准确表达给田地或作物供水，较“灌溉”更贴近日常语言，同时适用于菜园语境。
- source_word: בְרַגְלְךָ
  choice: 靠自己的脚
  rationale: 保留希伯来语具体而略显含混的“脚”意象，不在正文中武断限定为某一种灌溉技术。
- source_word: כְּגַן הַיָּרָק
  choice: 如同浇灌菜园一样
  rationale: “菜园”自然表达 גַן הַיָּרָק 所指的小型精耕园圃；补出“浇灌”使汉语比较关系清楚，其依据来自紧邻的动词。
theological_decisions:
- issue: 出埃及惯用语在盟约语境中的表达
  choice: 你们出来的埃及地
  alternative: 你们离开的埃及地
  rationale: “出来”保留出埃及事件在经文中的叙事与神学呼应，却不在译文中增添解释。
- issue: 第二人称单复数转换
  choice: “你们出来”与“你撒下……靠自己的脚”并存
  alternative: 全句统一译作“你们”
  rationale: 原文在“出来”处用复数，农业活动处用单数集体称谓。保留转换可反映摩西既对全体百姓、又视以色列为一个整体说话的原文形式。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。正文保留“那地”“得为业”“出来”等申命记的重要用语；“靠自己的脚浇灌”刻意保留原文的具体意象与解释空间，并以脚注说明主要可能性。
