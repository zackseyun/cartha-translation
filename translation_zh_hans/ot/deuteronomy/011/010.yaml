revisions:
- from: 因为，你要进去得为业的那地，不像你们出来的埃及地；在那里，你撒下种子，靠自己的脚浇灌[a][b]，如同浇灌菜园一样。
  to: 因为你要进去得为业的那地，不像你们所出来的埃及地；在那里，你撒种，用脚浇灌，像浇灌菜园一样。
  rationale: 调整关系从句和末尾比较结构，以提升现代汉语的自然度，并避免将原文简短的“像菜园”过度扩展。其余关键措辞及两项脚注均忠实保留原文的时态习惯性和灌溉技术歧义。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T04:57:18Z'
review_pass:
  verdict: revise
  source_fidelity: 译文基本保留了进入、得地、从埃及出来、撒种和用脚供水的内容，也保留了农业灌溉方式的歧义。不过末尾“如同浇灌菜园一样”将比较语显性改写为另一重“浇灌”动作，略多于原文；原文是在描述埃及地中以脚供水，其方式/情形“如同菜园”。
  naturalness: “不像你们出来的埃及地”略显生硬，改为“不像你们所出来的埃及地”更合乎庄重现代汉语。“用脚浇灌，像浇灌菜园一样”既自然，也较清楚地承接前面的供水动作。
  terminology: “得为业”“出来”“那地”均适合申命记语域。“用脚浇灌”比“靠自己的脚浇灌”更紧凑，且不预断具体技术。保留“菜园”可准确表达“菜蔬之园”。
  issues:
  - severity: medium
    issue: 末尾比较语被扩展为“如同浇灌菜园一样”。
    rationale: 原文仅有“像菜园”，没有第二个“浇灌”动词。汉语需使比较关系通顺，但宜以“用脚浇灌，像浇灌菜园一样”明确这是对前一动作的比较，而非把“菜园”直接并作另一被浇灌对象或增添新的动作层次。
  - severity: low
    issue: “你们出来的埃及地”关系结构不够自然。
    rationale: “你们所出来的埃及地”更清楚地表达“你们从那里出来的埃及地”，同时保留出埃及的“出来”用语。
  revised_text: 因为你要进去得为业的那地，不像你们所出来的埃及地；在那里，你撒种，用脚浇灌，像浇灌菜园一样。
  revised_footnotes:
  - marker: a
    text: “你撒种……浇灌”也可译作“你总是撒种……浇灌”，表示埃及惯常的耕作和供水方式。
    reason: 希伯来语未完成式在这一过去时语境中可能带有习惯性含义。
  - marker: b
    text: “用脚浇灌”可能指用脚操作灌溉设施，也可能指用脚开闭或引导沟渠中的水。
    reason: 说明古代灌溉的文化背景，同时保留这一表达具体所指的不确定性。
  revision_rationale: 调整关系从句和末尾比较结构，以提升现代汉语的自然度，并避免将原文简短的“像菜园”过度扩展。其余关键措辞及两项脚注均忠实保留原文的时态习惯性和灌溉技术歧义。
