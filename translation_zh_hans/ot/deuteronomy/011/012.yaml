base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/012.yaml
  text: a land that Yahweh your God cares for; the eyes of Yahweh your God are continually on it[a], from the beginning of the year to the end of the year.
translation:
  language: zh_hans
  text: 这地是雅威——你的上帝所眷顾的[a]；雅威——你的上帝的眼目一直注视着这地，从年初直到年终。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“寻求”或“照看”。希伯来语动词可指寻求、查问或关切；在这里表达雅威主动眷顾这地。
    reason: 说明דרש的词义范围，并保留“眷顾”之外真实存在的翻译可能。
lexical_decisions:
- source_word: אֶרֶץ
  choice: 地
  rationale: 上下文指应许之地及其疆土，并非泛指整个大地；“地”简洁自然，也与申命记的常用表达相符。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文直接音译四字神名，保留其作为以色列之上帝的专名，而不以称号代替。
- source_word: אֱלֹהֶיךָ
  choice: 你的上帝
  rationale: 准确表达第二人称阳性单数后缀；“上帝”是现代普通话中清楚、庄重的称谓。
- source_word: דֹּרֵשׁ אֹתָהּ
  choice: 眷顾
  rationale: דרש本可表示寻求、查问或关注；以“地”为宾语时，这里表达雅威主动而持续的关切与照料。“眷顾”自然庄重，同时保留脚注说明其较宽的词义范围。
- source_word: תָּמִיד
  choice: 一直
  rationale: 表达持续不断的状态；“一直”是自然的现代汉语，并与下文“从年初直到年终”相呼应。
- source_word: עֵינֵי יְהוָה אֱלֹהֶיךָ בָּהּ
  choice: 雅威你上帝的眼目一直在这地之上
  rationale: 保留希伯来文“眼目”的拟人化意象，不将其完全释义为抽象的照管；“在这地之上”表达持续关注。
- source_word: מֵרֵשִׁית הַשָּׁנָה וְעַד אַחֲרִית שָׁנָה
  choice: 从年初直到年终
  rationale: 自然准确地呈现由一年开始至一年结束的完整时间跨度。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文使用四字神名。译作“雅威”较直接地呈现该专名，避免以“主”这一称号取代；“耶和华”虽是中文传统形式，但不是此处采用的音译形式。
- issue: 是否弱化“雅威的眼目”这一拟人化表达
  choice: 保留“眼目”意象
  alternative: 译作“雅威始终照看这地”
  rationale: 原文刻意以“眼目在其上”表达警醒而持续的关注；保留该意象可避免将经文的具体表达过度抽象化。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“眷顾”和“眼目”略带经文语体色彩，但仍为当代读者所熟悉；句序基本保留原文由眷顾转向眼目、再转向全年时段的推进。
