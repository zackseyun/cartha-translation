  yaml_path: translation/ot/deuteronomy/011/032.yaml
  text: And you shall be careful to do all the statutes and the judgments that I am setting before you today[a].
translation:
  language: zh_hans
  text: 你们要谨慎遵行我今天摆在你们面前的一切律例和典章[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译作“我今天放在你们面前的一切律例和典章”；这是希伯来语惯用表达，意思是“摆在你们面前”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם לַעֲשׂוֹת
  choice: 要谨慎遵行
  rationale: שׁמר与不定式לַעֲשׂוֹת连用，表示留心、谨慎去实行，而不只是一般意义上的“遵守”；“要”传达盟约律法语境中的指令语气。
- source_word: כָּל
  choice: 一切
  rationale: 表达无一遗漏的整体性，并与后面的复数法律术语自然搭配。
- source_word: הַחֻקִּים
  choice: 律例
  rationale: חֻקִּים指制定并颁布的法规；“律例”保留庄重的盟约法律语体，也与מִשְׁפָּטִים有所区别。
- source_word: הַמִּשְׁפָּטִים
  choice: 典章
  rationale: מִשְׁפָּטִים可指判例、裁决或法规；“典章”在现代中文圣经法律语境中庄重且可理解，并能与“律例”形成词汇区分。
- source_word: אֲשֶׁר אָנֹכִי נֹתֵן לִפְנֵיכֶם
  choice: 我……摆在你们面前的
  rationale: נתן字面为“给”，但与לִפְנֵי连用时是把某事摆在听者面前、交付其选择或遵行的惯用表达；此译法自然地传达整个希伯来语短语。
- source_word: הַיּוֹם
  choice: 今天
  rationale: 直接保留盟约讲话当下的时间迫切性，符合现代汉语表达。
