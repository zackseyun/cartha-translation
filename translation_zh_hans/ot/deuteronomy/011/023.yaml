revisions:
- from: 那么，雅威[a]必从你们面前赶走这一切民族；你们也必赶走那些比你们更强大的民族[b]。
  to: 那么，雅威[a]必从你们面前赶走这一切民族；你们必使比你们更大、更强的民族失去产业[b]。
  rationale: 修订保留首句使役式“赶走”的表达；第二句改为“使……失去产业”，以反映卡尔式 ירשׁ 对列国的剥夺／取代之意，而不把两个不同词形一律处理为“赶走”。“更大、更强”分别对应原文两个形容词。
  reviewer_model: gpt-5.6-terra
