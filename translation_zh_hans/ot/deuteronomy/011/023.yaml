review_pass:
  verdict: revise
  source_fidelity: 首句准确反映 וְהוֹרִישׁ（使役式）的“赶走／使失去产业”之意。第二个 וִירִשְׁתֶּם 是同一词根的卡尔式，直接以“民族”为宾语；草稿同样译作“赶走”虽可在语境中成立，却抹平了使役式与卡尔式的语法和语义区别，也未充分呈现“使其失去所占之地／产业”的意思。原文的两个比较形容词都应在译文中有所体现。
  naturalness: “雅威必从你们面前赶走这一切民族”自然且庄重。“使……失去产业”在此虽较正式，但准确、清楚，且避免把“民族”误译成可被“占有”的物品。将“更大、更强”并列，符合现代标准汉语并保留原文两个形容词。
  terminology: “雅威”恰当地保留 יהוה 作为神名。“民族”适合 גּוֹיִם 的本节政治—族群语境。“产业”在此用于说明 ירשׁ 的失去占有／领地之义，不将其神学化或加入原文未明说的土地细节。
  issues:
  - severity: medium
    issue: 第二个 ירשׁ 与第一个使役式均译为“赶走”。
    rationale: 第一处 וְהוֹרִישׁ 是使役式，雅威使列国失去占有；第二处 וִירִשְׁתֶּם 为卡尔式，以“民族”为宾语，表示以色列使其失去所占之地／产业（即 dispossess）。同译“赶走”可读，却削弱原文的语法对照和第二动词的“夺取／取代”含义。
  - severity: low
    issue: “比你们更强大”将两个比较形容词合并。
    rationale: גְּדֹלִים 与 עֲצֻמִים 分别表达“更大”与“更强盛／强大”；译文宜分别表达，避免遗漏“更大”的维度。
  revised_text: 那么，雅威[a]必从你们面前赶走这一切民族；你们必使比你们更大、更强的民族失去产业[b]。
