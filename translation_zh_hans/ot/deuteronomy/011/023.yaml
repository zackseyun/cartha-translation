base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/023.yaml
  text: then Yahweh will drive out all these nations before you, and you will dispossess nations greater and mightier than you.
translation:
  language: zh_hans
  text: 那么，雅威[a]必从你们面前赶走这一切民族；你们必使比你们更大、更强的民族失去产业[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威”是希伯来文神名 יהוה（YHWH）的音译。
    reason: 说明正文为何使用专名而非“主”等称号。
  - marker: b
    text: “使……失去产业”所译的希伯来词也可表示“占有、取得产业”。此处以“民族”为宾语，指使这些民族失去其所占之地或产业。
    reason: 反映 וִירִשְׁתֶּם 的词义范围及其以“民族”为宾语时的语境含义，并与前一使役式动词有所区分。
lexical_decisions:
- source_word: וְהוֹרִישׁ
  choice: 必……赶走
  rationale: 这是 ירשׁ 的使役式，在此表示使各民族失去所占之地，即“赶走、逐出”。“赶走”符合现代汉语，也清楚表达行动的施行者是雅威。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文四字神名的常见汉语音译处理，保留其作为专名的性质，不以称号替代。
- source_word: כָּל הַגּוֹיִם הָאֵלֶּה
  choice: 这一切民族
  rationale: גּוֹיִם 在征服土地的语境中指具有群体和政治意义的各民族；“这一切民族”既自然又保留指示语和全称范围。
- source_word: מִלִּפְנֵיכֶם
  choice: 从你们面前
  rationale: 较贴近字面“从你们面前／临在之处”，并与“赶走”自然搭配。
- source_word: וִירִשְׁתֶּם
  choice: 你们也必赶走
  rationale: ירשׁ 的直接宾语是民族而非土地，因此在这里宜表达“使其失去占有、将其逐出”。译作“赶走”清楚自然；脚注保留该词也可表示“占有、夺取”的词义张力。
- source_word: גְּדֹלִים וַעֲצֻמִים מִכֶּם
  choice: 比你们更强大
  rationale: 两个形容词共同描写这些民族在规模、地位和力量上胜过以色列。“更强大”在现代汉语中能自然涵盖这种综合比较；不机械重复为“更大、更强”，以免误解为单指人口或体型。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。译作“雅威”保留其专名身份；不以“主”这一称号取代，也不将后期形成的混合读音置于正文。
- issue: וִירִשְׁתֶּם 描述以色列行动的含义
  choice: 赶走
  alternative: 占有；夺取；使……失去产业
  rationale: 由于动词的直接宾语是“民族”，上下文重点是使这些民族失去其所占之地，而非把民族本身当作产业。正文采用自然明确的“赶走”，脚注说明该词的占有／夺取义，以免抹去希伯来词的语义范围。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“那么”承接上一节的条件句；“必”表达未完成式在该条件结果中的确定将来意义。分号呈现雅威赶走各民族与以色列随后赶走他们之间的平行关系。
