base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/011.yaml
  text: But the land that you are crossing over to possess is a land of mountains and valleys[b][a]; it drinks water from the rain of heaven.
translation:
  language: zh_hans
  text: 但你们正要过去得为业的那地，是有山有谷之地；它喝天降的雨水。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “得为业”也可译作“占有”或“承受产业”；此希伯来语动词在盟约语境中兼有取得和承受产业的含义。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָאָרֶץ
  choice: 但……那地
  rationale: 承接上文并与埃及的地貌及灌溉方式形成对比；用“但”自然表达希伯来语连接词在此处的转折功能。
- source_word: עֹבְרִים שָׁמָּה
  choice: 正在渡河去
  rationale: 分词表达正在进行或即将发生的行动；结合申命记语境，“渡河”明确指渡过约旦河，目的地含义由“去”表达。
- source_word: לְרִשְׁתָּהּ
  choice: 取得
  rationale: ירשׁ在此指进入并占有那地，同时可带承受产业的盟约含义；正文采用自然且保留主动行动色彩的“取得”，另以脚注说明语义层次。
- source_word: אֶרֶץ הָרִים וּבְקָעֹת
  choice: 有山有谷之地
  rationale: 准确表达山地与谷地相间的地貌，现代汉语简洁自然。
- source_word: לִמְטַר הַשָּׁמַיִם תִּשְׁתֶּה מָּיִם
  choice: 它靠天降的雨水滋润
  rationale: “天降的雨水”自然传达מְטַר הַשָּׁמַיִם；保留土地为主语，但用“滋润”避免汉语中“地喝水”的生硬感，并准确表达土地从降雨获得水分。
theological_decisions:
- issue: ירשׁ兼具占有与承受产业的含义
  choice: 正文译作“取得”
  alternative: “承受为业”或“占有”
  rationale: “取得”符合以色列人渡河进入那地的主动语境，又不把词义限定为军事占领；脚注保留其盟约性产业含义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“有山有谷”简洁呈现地貌对比；分号保留原句后半句对水源特征的说明。脚注标记置于与“取得”相关的位置所对应的整句末尾，以免打断正文流畅度。
