source:
  edition: WLC
  text: וְ/חָרָ֨ה אַף יְהוָ֜ה בָּ/כֶ֗ם וְ/עָצַ֤ר אֶת הַ/שָּׁמַ֨יִם֙ וְ/לֹֽא יִהְיֶ֣ה מָטָ֔ר וְ/הָ֣/אֲדָמָ֔ה לֹ֥א תִתֵּ֖ן אֶת יְבוּלָ֑/הּ וַ/אֲבַדְתֶּ֣ם מְהֵרָ֗ה מֵ/עַל֙ הָ/אָ֣רֶץ הַ/טֹּבָ֔ה אֲשֶׁ֥ר יְהוָ֖ה נֹתֵ֥ן לָ/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/017.yaml
  text: Then Yahweh’s anger will burn against you[a], and he will shut up the heavens so that there will be no rain, and the ground will not yield its produce; and you will perish quickly from the good land that Yahweh is giving you.
translation:
  language: zh_hans
  text: 那时，雅威的怒气必向你们燃烧[a]；他必封闭诸天，雨就不降下，土地也不出产；你们必很快从雅威赐给你们的美地上消亡。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“雅威的鼻子必向你们燃烧”；“鼻子”在此也引申指“怒气”。这是表示强烈愤怒的希伯来语惯用语。
    reason: 说明原文“鼻子／怒气”与“燃烧”的惯用语意象。
lexical_decisions:
- source_word: וְחָרָה אַף יְהוָה בָכֶם
  choice: 那时，雅威必向你们发烈怒
  rationale: חָרָה与אַף构成怒气燃烧的希伯来语惯用表达。“发烈怒”以自然简洁的现代汉语传达强烈怒气；“那时”体现וְ在上下文中的后果关系。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以常见的汉语音译保留四字神名作为专名，不以称号替代。
- source_word: וְעָצַר אֶת הַשָּׁמַיִם
  choice: 封闭天空
  rationale: 保留“关闭天空”的意象；在本句中指阻止降雨。
- source_word: וְלֹא יִהְיֶה מָטָר
  choice: 使雨不降下
  rationale: 自然表达关闭天空所造成的结果，同时保留无雨的含义。
- source_word: וְהָאֲדָמָה
  choice: 土地
  rationale: 此处指可出产的土壤或地面，并与后文指应许之地的הָאָרֶץ有所区别。
- source_word: לֹא תִתֵּן אֶת יְבוּלָהּ
  choice: 也不出产
  rationale: יְבוּלָהּ指土地的出产；汉语可由语境自然补足宾语，避免生硬的“不给出它的产物”。
- source_word: וַאֲבַדְתֶּם מְהֵרָה
  choice: 你们必很快……灭亡
  rationale: אבד在此表达盟约审判下的灭亡或消失；不具体限定其机制，מְהֵרָה译为“很快”。
- source_word: מֵעַל הָאָרֶץ הַטֹּבָה
  choice: 从……美地上
  rationale: “从……地上”保留מֵעַל所含从其上被除去的空间意味，也符合现代汉语表达。
- source_word: אֲשֶׁר יְהוָה נֹתֵן לָכֶם
  choice: 雅威赐给你们的
  rationale: 分词נֹתֵן表示正在赐予或确定赐予；汉语定语结构自然表达这一事实，而不额外限定时态。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；音译为“雅威”可保留其专名性质，避免以称号代替。
- issue: 神发怒的拟人性惯用语
  choice: 雅威必向你们发烈怒
  alternative: 雅威的怒气必向你们燃烧
  rationale: 原文保留怒气燃烧的强烈意涵，但逐字译成“鼻子燃烧”在现代汉语中难以理解。“发烈怒”不把这怒气弱化为一般不悦。
- issue: אבד所指审判的范围
  choice: 灭亡
  alternative: 被毁灭；从地上消失
  rationale: 原文可涵盖死亡、毁灭或从土地上被除去；“灭亡”维持严厉程度，又不擅自指定流亡或彻底消灭。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“封闭天空”保留盟约咒诅中的具体意象；“土地”与“美地”区分אֲדָמָה和הָאָרֶץ。
