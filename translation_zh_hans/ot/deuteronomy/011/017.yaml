    rationale: 原文 מֵעַל 表示从土地上被除去；汉语“从……上灭亡”不够自然，且“灭亡”易悬空。改作“从……美地上消亡”可保留离开／消失于该地的含义，而不擅自限定为流亡或完全歼灭。
  - severity: low
    issue: 正文未保留 חָרָה אַף 的“燃烧”意象。
    rationale: “发烈怒”可传达含义，但原文和英语审计轨迹均保留怒气燃烧的比喻。中文“怒气必向你们燃烧”自然且更贴近原文。
  - severity: low
    issue: 脚注用“鼻子／怒气”表述可能使读者误解为原文并列两个词。
    rationale: אַף 是单一词语，本义为“鼻子”，也可引申为“怒气”；脚注宜明确这种词义关联。
