source:
  edition: WLC
  text: וְ/הָיָ֗ה אִם שָׁמֹ֤עַ תִּשְׁמְעוּ֙ אֶל מִצְוֺתַ֔/י אֲשֶׁ֧ר אָנֹכִ֛י מְצַוֶּ֥ה אֶתְ/כֶ֖ם הַ/יּ֑וֹם לְ/אַהֲבָ֞ה אֶת יְהוָ֤ה אֱלֹֽהֵי/כֶם֙ וּ/לְ/עָבְד֔/וֹ בְּ/כָל לְבַבְ/כֶ֖ם וּ/בְ/כָל נַפְשְׁ/כֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/013.yaml
  text: And if you indeed listen to my commandments that I am commanding you today[a], to love Yahweh your God and to serve him with all your heart and with all your soul[c][b],
translation:
  language: zh_hans
  text: 如果你们切实听从我今天吩咐你们的诫命[a]，爱雅威——你们的上帝[b]，并且尽心尽性[c]事奉他，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “切实听从”直译为“听，你们必听”；这种希伯来语表达加强语气，也可理解为“认真听从”或“谨慎顺服”。
    reason: 说明不定式绝对式与同根动词构成的强调，并保留“听”所包含的顺服意味。
  - marker: b
    text: “雅威”是希伯来文神名 YHWH 的音译；汉语传统也译作“耶和华”，有些译本以“上主”代替。
    reason: 交代四字神名的译法及常见替代译法。
  - marker: c
    text: “尽性”是固定的圣经表达，这里的“性”并非指性情；原文也可指“生命”“自己”或“整个存在”，因此也可理解为“用全部生命”或“全人”。
    reason: 保留 נֶפֶשׁ 的语义宽度，避免将其狭义化为脱离身体的灵魂或误解为性情。
lexical_decisions:
- source_word: וְהָיָה אִם
  choice: 如果
  rationale: 句首结构引出延续到下一节的条件从句；现代汉语用“如果”自然表达其功能，无须生硬补出“事情将是”。
- source_word: שָׁמֹעַ תִּשְׁמְעוּ
  choice: 切实听从
  rationale: 不定式绝对式与未完成式连用，加强“听”的语气；“切实”体现强调，“听从”兼顾聆听与顺服的含义。
- source_word: אֶל מִצְוֺתַי
  choice: 听从……我的诫命
  rationale: 介词 אֶל 与 שמע 连用，在汉语中自然译作“听从”；“诫命”保留申命记盟约语境中受命义务的庄重意味。
- source_word: אֲשֶׁר אָנֹכִי מְצַוֶּה אֶתְכֶם הַיּוֹם
  choice: 我今天吩咐你们的
  rationale: 分词表达摩西正在进行的吩咐；定语结构符合现代汉语，并保留“今天”这一重要时间标记。
- source_word: לְאַהֲבָה
  choice: 爱
  rationale: 直接表达对上帝的爱，并在汉语句法中与后面的“事奉”并列。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以通行的现代汉语音译呈现四字神名，保留其作为以色列之上帝专名的性质，而不以称号代替。
- source_word: אֱלֹהֵיכֶם
  choice: 你们的上帝
  rationale: 准确保留第二人称复数及盟约归属关系。
- source_word: וּלְעָבְדוֹ
  choice: 事奉他
  rationale: עבד 在此涵盖敬拜、服侍和忠诚顺从；“事奉”比单纯“敬拜”更能保留其宽广含义。
- source_word: בְּכָל לְבַבְכֶם
  choice: 尽心
  rationale: לֵבָב 涉及意志、思想与情感；“尽心”是自然凝练且庄重的汉语表达。
- source_word: וּבְכָל נַפְשְׁכֶם
  choice: 尽性
  rationale: נֶפֶשׁ 可指生命、自我或整个人；“尽性”保留熟悉的圣经表达，其语义范围另以脚注说明。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。正文用“雅威”呈现专名，避免以称号代替；脚注提供汉语传统译名。
- issue: שָׁמֹעַ תִּשְׁמְעוּ 中聆听与顺服的关系
  choice: 切实听从
  alternative: 认真听；谨守遵行
  rationale: 希伯来语既保留“听”的基本意象，也在盟约语境中要求顺服回应。“听从”能兼顾二者，而不把它完全改写为“遵守”。
- issue: נֶפֶשׁ 的人论含义
  choice: 尽性
  alternative: 全心全意；以全部生命；全人
  rationale: 此词不必限定为与身体分离的“灵魂”，可指生命、自我或整个存在；正文保留庄重的固定表达，脚注明确其较宽语义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“切实听从”体现原文强调；“尽心尽性事奉他”保留盟约语言的凝练节奏。句末用逗号，因为本节只是条件从句，主句延续到下一节。
