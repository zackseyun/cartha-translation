base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/003.yaml
  text: and his signs and his deeds that he did in the midst of Egypt[c][b][a], to Pharaoh king of Egypt and to all his land—
translation:
  language: zh_hans
  text: 以及他在埃及境内[b]向[c]埃及王法老和他的全境所行的神迹[a]与作为——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “神迹”或译“记号”。
    reason: lexical_alternative
  - marker: b
    text: “在埃及境内”，希伯来语直译“在埃及当中”。
    reason: lexical_alternative
  - marker: c
    text: “向”或译“对付”；希伯来语介词直译为“向、对”，上下文所说的是上帝施行审判的作为。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹתֹתָיו
  choice: 他的神迹
  rationale: אוֹת的基本意思是可辨识的“记号、征兆”，在本段指上帝在埃及所行、彰显其作为的超常记号。“神迹”符合现代汉语圣经语境且通顺；脚注保留“记号”这一较形式对应的译法。
- source_word: מַעֲשָׂיו
  choice: 他的作为
  rationale: מַעֲשֶׂה指所做之事、行动或事迹。“作为”自然而庄重，并避免把它不必要地限缩为神奇事件。
- source_word: אֲשֶׁר עָשָׂה
  choice: 所行的
  rationale: 以“所行的”构成自然的汉语关系结构，同时修饰“神迹”与“作为”。
- source_word: בְּתוֹךְ מִצְרַיִם
  choice: 在埃及境内
  rationale: בְּתוֹךְ直指“在……当中、内部”。“在埃及境内”既保留事件发生于埃及内部的强调，也比“在埃及当中”更符合现代汉语。
- source_word: לְפַרְעֹה
  choice: 向……法老
  rationale: לְ标示行动所指向或涉及的对象。“向”保留介词本身较宽的语义，不在正文中直接解释为“攻击”；审判性的“对付”由脚注说明。
- source_word: מֶלֶךְ מִצְרַיִם
  choice: 埃及王法老
  rationale: 准确表达希伯来语同位/称谓关系，符合自然汉语次序。
- source_word: וּלְכָל אַרְצוֹ
  choice: 和他全国
  rationale: אֶרֶץ在这里指法老统治的全境。“他全国”简洁表达字面的“他的全地”，在现代汉语中比“他的全地”自然。
- source_word: וְאֶת ... וְאֶת
  choice: 以及……与……
  rationale: אֵת是宾语标记，不单独翻译；开头“以及”承接上一节“你们亲眼看见”，内部用“与”保留两个并列宾语。
theological_decisions:
- issue: לְ所标示的对象是否应明确译为审判性的“对付”
  choice: 正文译“向”，脚注说明“对付”
  alternative: 对付埃及王法老和他全国
  rationale: 上下文清楚涉及上帝施行审判，但介词לְ本身比“对付”宽泛。正文保留原文的语义张力，脚注交代符合语境的理解，不把解释直接写死。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。本节在句法上承接上一节，因此以“以及”起首，并以破折号保留原段落尚未完结的推进感。为使汉语自然，将希伯来语后置的对象“法老和他全国”前移到“所行的”之前，但没有改变其修饰和指向关系。
