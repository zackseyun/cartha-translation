  text: לְמַ֨עַן יִרְבּ֤וּ יְמֵי/כֶם֙ וִ/ימֵ֣י בְנֵי/כֶ֔ם עַ֚ל הָֽ/אֲדָמָ֔ה אֲשֶׁ֨ר נִשְׁבַּ֧ע יְהוָ֛ה לַ/אֲבֹתֵי/כֶ֖ם לָ/תֵ֣ת לָ/הֶ֑ם כִּ/ימֵ֥י הַ/שָּׁמַ֖יִם עַל הָ/אָֽרֶץ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/021.yaml
  text: so that your days and the days of your sons may be multiplied on the land that Yahweh swore to your fathers to give them[b][a], as the days of the heavens above the earth.
translation:
  language: zh_hans
  text: 好使你们和你们儿子[a]的日子，在耶和华向你们列祖起誓要赐给他们的土地上增多，如同天在地上方的日子那样[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“你们儿子”。这里也可理解为“你们的子孙”或“你们的后代”。
    reason: 说明 בנים 的字面男性复数形式，并保留其在此语境中可作跨世代理解的可能。
  - marker: b
    text: 原文较直译为“如同天在地上方的日子”。也可理解为“只要天在地上方，你们的日子就会长久”。
    reason: 保留原文比较性、诗性的结构，同时说明其可表达持久时长的理解。
lexical_decisions:
- source_word: לְמַעַן
  choice: 好使
  rationale: 承接上文，表达目的兼结果；“好使”在现代汉语中简洁而庄重。
- source_word: יִרְבּוּ יְמֵיכֶם וִימֵי בְנֵיכֶם
  choice: 你们和你们子孙在……的日子增多
  rationale: 保留“日子增多”的希伯来语意象，同时用“子孙”表达 בנים 在跨世代应许语境中的自然含义。
- source_word: עַל הָאֲדָמָה
  choice: 在那土地上
  rationale: 此处 אֲדָמָה 指所应许之地；汉语以“在……土地上”比直译“在土地之上”自然。
- source_word: אֲשֶׁר נִשְׁבַּע יְהוָה לַאֲבֹתֵיכֶם
  choice: 那是耶和华向你们列祖起誓……的土地
  rationale: 明确关系从句所修饰的是土地，并保留盟约起誓和“列祖”的家族性语言。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文圣经传统中最易辨识的专名形式，直接呈现四字神名而非以“主”代替。
- source_word: לָתֵת לָהֶם
  choice: 要赐给他们
  rationale: “赐给”符合土地作为神所赐产业的语境；“他们”保留原文代词，指列祖。
- source_word: כִּימֵי הַשָּׁמַיִם עַל הָאָרֶץ
  choice: 只要天覆于地，你们的日子也必长久
  rationale: 该短语是持续时长的比喻性表达；译文保留天地意象，并以自然汉语显明它修饰前述日子的长久。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 两者均用于汉语；“耶和华”是普通现代中文读者最熟悉且具有专名功能的译法，不以称号“主”替代原文神名。
- issue: בְנֵיכֶם 的范围
  choice: 你们子孙
  alternative: 你们儿子
  rationale: 字面为“你们的儿子”，但在这里与世代承受土地和长久居住相连，“子孙”更自然地表达群体及后代含义；脚注保留字面形式。
- issue: 末句是诗性明喻还是时长惯用语
  choice: 按时长表达翻译，同时保留天地意象
  alternative: 像天覆地的日子一样
  rationale: כִּימֵי 可形式化理解为“像……的日子”，整体也可表示“天在地上有多久，就有多久”。正文采用自然的时长读法，脚注保存较贴近形式的译法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“日子增多”刻意保留希伯来语意象；末句略作汉语化以避免生硬。所有脚注标记均已置于正文。
