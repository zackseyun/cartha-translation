  text: וְ/שַׂמְתֶּם֙ אֶת דְּבָרַ֣/י אֵ֔לֶּה עַל לְבַבְ/כֶ֖ם וְ/עַֽל נַפְשְׁ/כֶ֑ם וּ/קְשַׁרְתֶּ֨ם אֹתָ֤/ם לְ/אוֹת֙ עַל יֶדְ/כֶ֔ם וְ/הָי֥וּ לְ/טוֹטָפֹ֖ת בֵּ֥ין עֵינֵי/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/018.yaml
  text: So you shall place these words of mine on your heart and on your soul[a], and you shall bind them as a sign on your hand, and they shall be as frontlets between your eyes.
translation:
  language: zh_hans
  text: 所以，你们要把我这些话放在心上，也放在你们的生命中；要把它们系在手上，作为记号；它们要成为你们两眼之间的额饰[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “额饰”所译的希伯来词较为罕见，确切含义不明；也可译为“经文匣”，指后来犹太传统中所佩戴的小型经文盒。
    reason: 说明罕见词的词义不确定性，并提供与后期犹太实践相关的译法。
lexical_decisions:
- source_word: וְשַׂמְתֶּם
  choice: 所以，你们要把……放在
  rationale: שׂים的基本义是“放、安放”。译作“放在”保留具体意象；句首“所以”承接上文的劝诫。
- source_word: דְּבָרַי אֵלֶּה
  choice: 我这些话
  rationale: 保留第一人称所有关系，并采用自然的现代汉语语序。
- source_word: עַל לְבַבְכֶם
  choice: 放在心上
  rationale: 既贴近介词עַל“在……之上”，又是现代汉语中自然的表达，传达重视并牢记之意。
- source_word: וְעַל נַפְשְׁכֶם
  choice: 也放在心灵中
  rationale: נֶפֶשׁ可指生命、自我或内在的人；此处与“心”并列，译作“心灵”较能保留其内在生命的分量，又不把它收窄为单一哲学概念。
- source_word: וּקְשַׁרְתֶּם אֹתָם
  choice: 要把它们系在
  rationale: קשר意为“系、绑”；“系在”自然地保留了动作的具体性。
- source_word: לְאוֹת
  choice: 作为记号
  rationale: אוֹת可指记号、标志或凭据；“作为记号”保留其象征作用而不过度解释。
- source_word: עַל יֶדְכֶם
  choice: 手上
  rationale: יָד通常指“手”，故采用其直接含义，不扩译为“手臂”。
- source_word: וְהָיוּ
  choice: 使它们成为
  rationale: 在连续指令中表达结果或规定，符合现代汉语句法，同时保留命令序列。
- source_word: לְטוֹטָפֹת
  choice: 额饰
  rationale: טוֹטָפֹת是罕见词，通常理解为戴在额部之物。“额饰”保留具体位置和物件性质，同时不把后期经文匣的实践直接写进正文。
- source_word: בֵּין עֵינֵיכֶם
  choice: 两眼之间
  rationale: 直译希伯来语空间表达，不改写成解释性的“额头上”。
theological_decisions:
- issue: 把这些话系在手上并置于两眼之间，应理解为比喻还是实际佩戴
  choice: 保留具体的身体意象，不判定它仅是比喻、仅是礼仪实践，或两者兼有。
  alternative: 可理解为要求人在思想和行动中时刻谨记诫命；也可理解为后来实际佩戴经文匣之实践的依据。
  rationale: 经文本身使用具体措辞，却未在本节中明确限定其实施方式；译文应保留这种解释张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“放在心上”兼顾希伯来语的具体意象与汉语习惯；身体部位和系戴动作均按原文保留，以免预先裁定其字面或比喻性质。脚注标记置于实际对应的“额饰”之后。
