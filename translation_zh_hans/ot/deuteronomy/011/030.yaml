base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/030.yaml
  text: Are they not beyond the Jordan[a], behind the way of the setting sun, in the land of the Canaanites who dwell in the Arabah, opposite Gilgal[c][b], beside the oaks of Moreh?
translation:
  language: zh_hans
  text: 那两座山岂不是在约旦河对岸[a]，在通往日落方向的路后面[b]，在居住在亚拉巴的迦南人之地、基甲对面、摩利的橡树[c]旁边吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“约旦河的另一边”。希伯来语这一地理说法的具体方位取决于说话者所处的位置。
    reason: lexical_alternative
  - marker: b
    text: 直译是“在太阳落下之路的后面”，所指方向与西方有关；原文中“后面”与“路”的确切空间关系并不完全明确。
    reason: lexical_alternative
  - marker: c
    text: “橡树”也可译作“大树”或“笃耨香树”。这里的希伯来词可能指橡树或笃耨香树一类的大树。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא הֵמָּה
  choice: 那两座山岂不是
  rationale: הֲלֹא引出预期肯定回答的反问；复数代词הֵמָּה承接上一节的两座山。为使现代汉语中的指代自然清楚，明示为“那两座山”。
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: 在约旦河对岸
  rationale: 这是一个取决于观察位置的地理表达。“对岸”保留其相对性，不擅自指定东西方向。
- source_word: אַחֲרֵי דֶּרֶךְ מְבוֹא הַשֶּׁמֶשׁ
  choice: 在通往日落方向的路后面
  rationale: 较贴近原文“在……路后面”的空间措辞，同时以“日落方向”传达מְבוֹא הַשֶּׁמֶשׁ所含的西向意象，不直接把整句收窄为单纯的“向西”。
- source_word: בְּאֶרֶץ הַכְּנַעֲנִי הַיֹּשֵׁב בָּעֲרָבָה
  choice: 位于居住在亚拉巴的迦南人之地
  rationale: 将单数族名按集合意义译为“迦南人”，并保留“亚拉巴”这一地理名称，而不泛化为“平原”。
- source_word: מוּל הַגִּלְגָּל
  choice: 在基甲对面
  rationale: 以现代汉语自然表达地点之间相对、面对的位置关系；地名按惯用译名译作“基甲”。
- source_word: אֵצֶל אֵלוֹנֵי מֹרֶה
  choice: 摩利的橡树旁边
  rationale: אֵצֶל表示邻近；אֵלוֹן的具体树种并不确定，正文采用熟悉且传统的“橡树”，另以脚注保留植物学上的其他可能。
theological_decisions: []
