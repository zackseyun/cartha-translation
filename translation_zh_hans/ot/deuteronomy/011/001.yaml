  text: וְ/אָ֣הַבְתָּ֔ אֵ֖ת יְהוָ֣ה אֱלֹהֶ֑י/ךָ וְ/שָׁמַרְתָּ֣ מִשְׁמַרְתּ֗/וֹ וְ/חֻקֹּתָ֧י/ו וּ/מִשְׁפָּטָ֛י/ו וּ/מִצְוֺתָ֖י/ו כָּל הַ/יָּמִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/001.yaml
  text: Therefore you shall love Yahweh your God and keep his charge[a], his statutes, his judgments[b], and his commandments all your days.
translation:
  language: zh_hans
  text: 所以[a]，你要爱耶和华你的神，终生谨守他所要求的，以及他的律例、典章[b]和诫命。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“并且，你要爱耶和华你的神。”希伯来文的连接词可以单纯译作“并且”；正文根据上文将它理解为带有推论意味。
    reason: alternative_reading
  - marker: b
    text: “典章”或译“法令”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָהַבְתָּ
  choice: 所以，你要爱
  rationale: אָהַב意为“爱”；句首וְ可单纯表示“并且”，也可承接上文而带有推论意味。结合申命记10章末尾的论述，正文用“所以”自然地表达这种承接关系，同时以脚注保留另一种读法。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 这是希伯来文四字神名；“耶和华”是现代汉语圣经传统中广为人知的专名形式，在此不以“主”这一称号取代原文的名字。
- source_word: אֱלֹהֶיךָ
  choice: 你的神
  rationale: 保留第二人称阳性单数后缀所表达的“你的”，呈现经文中的盟约关系和直接称呼。
- source_word: וְשָׁמַרְתָּ
  choice: 谨守
  rationale: שׁמר可指守护、遵守；“谨守”适合盟约和律法语境，也与后面的多项要求自然搭配。
- source_word: מִשְׁמַרְתּוֹ
  choice: 他所要求的
  rationale: מִשְׁמֶרֶת在此指受命守住的责任、职责或要求。“他所要求的”在现代汉语中清楚自然，并避免把它误解为交托保管的物件。
- source_word: חֻקֹּתָיו
  choice: 他的律例
  rationale: חֻקָּה是律法语境中的成文规定；“律例”保留正式法律语域，并与邻近术语有所区别。
- source_word: מִשְׁפָּטָיו
  choice: 他的典章
  rationale: מִשְׁפָּט可指判决、司法规定或法令。“典章”适合此处的法律语境，并保持与“律例”和“诫命”的词汇区分；脚注列出更直白的替代译法。
- source_word: מִצְוֺתָיו
  choice: 他的诫命
  rationale: מִצְוָה通常指命令或诫命；“诫命”准确保留本节庄重的律法用语。
- source_word: כָּל־הַיָּמִים
  choice: 终生
  rationale: 原文直译为“所有的日子”。结合全句对单数听者的持续要求，“终生”以简洁自然的现代汉语表达“一生所有日子”的含义。
theological_decisions:
- issue: 四字神名יְהוָה的译法
  choice: 耶和华
  alternative: 主
  rationale: 原文使用神的专名而非“主”这一称号；正文保留专名，以免抹去该处的盟约性称呼。
- issue: 法律术语מִשְׁפָּטָיו的含义
  choice: 他的典章
  alternative: 他的法令
  rationale: 该词语义范围包括判决、司法规定和法令。正文采用汉语圣经法律语域中自然的“典章”，既不把它局限为单次审判，也不与“律例”“诫命”完全合并；脚注保留“法令”这一可能译法。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“谨守”“律例”“典章”“诫命”保留原文的盟约与法律语域；“他所要求的”则避免生硬直译。正文中的[a]、[b]与脚注逐一对应。
