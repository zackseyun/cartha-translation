  yaml_path: translation/ot/deuteronomy/011/015.yaml
  text: And I will give grass in your field for your livestock[b][a], and you will eat and be satisfied.
translation:
  language: zh_hans
  text: 我必在你的田野里赐下青草[a]，供你的牲畜食用；你必吃得饱足[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“草木”“植物”；希伯来语这个词可泛指生长的草本植物，但这里很可能是指供牲畜食用的饲草。
    reason: lexical_alternative
  - marker: b
    text: 或译“吃饱”；希伯来语这个动词表示吃了以后得饱足或满足。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: 我也必……赐下
  rationale: 该形式在本段应许语境中表达将来之事；“也”承接上文的福分次序，“必”体现应许语气。“赐下”自然表达上帝的供应，又不额外扩展为抽象的繁荣。
- source_word: עֵשֶׂב
  choice: 青草
  rationale: 该词可泛指植物或草本生长物；因本句明确说是供牲畜使用，译作“青草”最符合饲草语境，同时以脚注保留较宽泛的词义。
- source_word: בְּשָׂדְךָ
  choice: 在你的田野里
  rationale: שָׂדֶה在此指具体的田地或野地。“田野”在现代汉语中自然，也保留农业场景和单数领属表达。
- source_word: לִבְהֶמְתֶּךָ
  choice: 供你的牲畜食用
  rationale: בְּהֵמָה在此为集合用法，指家养牲畜。“牲畜”比“牛”更宽，也比泛称“动物”更符合农牧语境；补出“食用”使汉语关系清楚，但未增加实质含义。
- source_word: וְאָכַלְתָּ
  choice: 你必吃
  rationale: 保留第二人称单数“你”，对应希伯来文以代表性单数称呼以色列；“必”适合连续的应许语境。
- source_word: וְשָׂבָעְתָּ
  choice: 得饱足
  rationale: 该动词表示吃后得到饱足或满足。“饱足”兼顾身体吃饱与充分满足的语义，并保持庄重自然。
theological_decisions:
- issue: 以第二人称单数称呼以色列
  choice: 全文保留“你的……你必……”
  alternative: 按群体含义改为“你们的……你们必……”
  rationale: 希伯来文连续使用第二人称阳性单数，在圣约言说中把以色列作为整体来称呼。现代汉语使用单数“你”仍可理解，且能保留原文的修辞形式。
- issue: 所应许福分的性质
  choice: 按普通的圣约农业供应翻译
  alternative: 明确扩展为普遍的兴盛、富足或超自然繁荣
  rationale: 原文具体应许田野为牲畜长出草，人也得以吃饱；译文不把这一具体福分扩展成原文没有明说的繁荣观念。
- issue: 人所吃的食物与前述青草的关系
  choice: 保留“你必吃”的概括表达，不说明人吃青草
  alternative: 补译为“你便有食物吃”或将“青草”直接作为人所吃之物
  rationale: 句法先说牲畜所得的青草，随后概括人将吃而饱足。原文没有明说人吃什么，也不必暗示人吃牲畜的青草，因此保持原有省略与张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“赐下”体现说话者为上帝及其供应行动；“供……食用”比口语化的“给……吃”更适合经文体。以分号呈现牲畜得草与人得饱足之间紧密而有区分的两个分句。
