  text: לֹא יִתְיַצֵּ֥ב אִ֖ישׁ בִּ/פְנֵי/כֶ֑ם פַּחְדְּ/כֶ֨ם וּ/מֽוֹרַאֲ/כֶ֜ם יִתֵּ֣ן יְהוָ֣ה אֱלֹֽהֵי/כֶ֗ם עַל פְּנֵ֤י כָל הָ/אָ֨רֶץ֙ אֲשֶׁ֣ר תִּדְרְכוּ בָ֔/הּ כַּ/אֲשֶׁ֖ר דִּבֶּ֥ר לָ/כֶֽם־׀־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/025.yaml
  text: No man will stand before you[a]. Yahweh your God will put the fear and dread of you on the face of all the land on which you tread[b], just as he spoke to you.
translation:
  language: zh_hans
  text: 没有人能在你们面前站立得住[a]。雅威你们的上帝必把对你们的恐惧和畏惧降在你们所踏足的全地上[b]，正如他对你们所说的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在你们面前站立”是希伯来语表达，也可译作“抵挡你们”或“与你们抗衡”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“在全地的表面上”。“地”也可译作“土地”或“地域”；下文“你们所踏足的”表明这里指以色列将要踏足的疆域。
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא יִתְיַצֵּב אִישׁ בִּפְנֵיכֶם
  choice: 没有人能在你们面前站立得住
  rationale: “在……面前站立”保留希伯来语意象；加上“得住”自然表达此处“抵挡、成功抗衡”的语境含义。אִישׁ在这里是泛指个体，现代汉语用“没有人”比“没有男人”更准确自然。
- source_word: פַּחְדְּכֶם וּמוֹרַאֲכֶם
  choice: 惧怕你们、畏惧你们
  rationale: 两个近义名词构成加强性的并列；采用“惧怕／畏惧”保留重复强化，而不武断划定两词间并不清晰的程度差异。
- source_word: יִתֵּן
  choice: 使……都
  rationale: נתן本义为“给、置于”；在使某地充满对以色列的恐惧这一结构中，汉语以使动表达最自然，也忠实传达语义关系。
- source_word: יְהוָה אֱלֹהֵיכֶם
  choice: 雅威你们的上帝
  rationale: 以“雅威”音译四字神名，保留经文中的专名；“你们的上帝”直接保留盟约关系称谓。
- source_word: עַל־פְּנֵי כָל־הָאָרֶץ
  choice: 全境
  rationale: 字面为“全地的表面／遍及全地”。下接“你们所踏之地”限定其地域范围，因此“全境”在现代汉语中既传达遍及该地，也避免误读为整个世界。
- source_word: אֲשֶׁר תִּדְרְכוּ בָהּ
  choice: 你们所踏之地
  rationale: 保留דרך“踏、踩”的具体意象，并用现代汉语定语结构自然连接所指地域。
- source_word: כַּאֲשֶׁר דִּבֶּר לָכֶם
  choice: 正如他对你们所说的
  rationale: דבר是“说、讲”，未明确使用“应许”一词；译作“所说的”保留原文措辞及其在语境中可能具有的应许意味。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华／上主
  rationale: 原文直接使用神的专名；“雅威”较贴近学界通常重构的读音，并与所给审校层的处理一致。
- issue: אִישׁ 的代表性阳性表达
  choice: 没有人
  alternative: 没有男人
  rationale: 此处命题涉及任何可能抵挡以色列的人，而非强调性别；汉语“人”本身不标示语法性别，因此既不抹除汉语中不存在的性别形式，也避免制造原文语用上没有的男性限定。
- issue: 恐惧的承受者与来源
  choice: 全境都惧怕你们、畏惧你们
  alternative: 把对你们的恐惧和畏惧加在全地之上
  rationale: 构词可直译为“你们的恐惧／畏惧”，但语境指当地居民因以色列而恐惧。正文用自然的使动句表达此关系；脚注提示原文形式，避免过度明确其抽象表达。
translation_notes:
  register: 采用庄重而清晰的现代标准汉语。“站立得住”保留原文意象并传达抵挡之意；“全境”避免生硬照搬“全地的表面”，脚注则保存其字面形式。两个恐惧名词以近义并列呈现，加强语势。
