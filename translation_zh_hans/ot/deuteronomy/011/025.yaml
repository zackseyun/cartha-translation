  naturalness: “没有人能在你们面前站立得住”庄重自然。“把对你们的恐惧和畏惧降在你们所踏足的全地上”既合现代汉语，也较清楚地保留原文的抽象名词和空间意象。
  terminology: “雅威你们的上帝”正确对应 יהוה אֱלֹהיכם，且与本项目指定的神名译法一致。“恐惧”和“畏惧”保留两个并列名词的强化作用；“人”恰当传达代表性单数 אִישׁ，而不在汉语中不必要地限定男性。
