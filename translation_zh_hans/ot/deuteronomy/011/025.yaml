revisions:
- from: 没有人能在你们面前站立得住[a]。雅威你们的上帝必使你们所踏之地的全境[b]都惧怕你们、畏惧你们，正如他对你们所说的。
  to: 没有人能在你们面前站立得住[a]。雅威你们的上帝必把对你们的恐惧和畏惧降在你们所踏足的全地上[b]，正如他对你们所说的。
  rationale: 修订恢复原文的句法关系：雅威是施事者，“对你们的恐惧和畏惧”是被置于或降在某地之上的内容，“全地”是该动作的范围。这样避免把土地直接表述为恐惧的主体，并保留原文抽象而略具空间性的措辞。脚注 b 同时更精确地区分“全地的表面”与其后的限定性关系从句。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T04:57:14Z'
