revisions:
- from: 但如果你们不听从雅威你们上帝的诫命，偏离我今天吩咐你们走的道路，去随从你们素不认识的别神，就必受咒诅。[a]
  to: 咒诅临到你们：如果你们不听从你们的上帝雅威的诫命，偏离我今日吩咐你们的道路，去随从你们素不认识的别神。 [a]
  rationale: 修订取消无明示依据的“但”，并以“咒诅临到你们”保留原文“咒诅”前置、与前节“福”平行的结构。调整神名短语的语序，使其符合现代汉语。保留原有条件、道路隐喻、随从别神及“不认识”的语义，未增添神学解释。
