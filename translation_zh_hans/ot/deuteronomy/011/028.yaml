  text: וְ/הַ/קְּלָלָ֗ה אִם לֹ֤א תִשְׁמְעוּ֙ אֶל מִצְוֺת֙ יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם וְ/סַרְתֶּ֣ם מִן הַ/דֶּ֔רֶךְ אֲשֶׁ֧ר אָנֹכִ֛י מְצַוֶּ֥ה אֶתְ/כֶ֖ם הַ/יּ֑וֹם לָ/לֶ֗כֶת אַחֲרֵ֛י אֱלֹהִ֥ים אֲחֵרִ֖ים אֲשֶׁ֥ר לֹֽא יְדַעְתֶּֽם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/028.yaml
  text: and the curse[a], if you do not listen to the commandments of Yahweh your God, and turn aside from the way that I am commanding you today, to go after other gods that you have not known.
translation:
  language: zh_hans
  text: 咒诅临到你们：如果你们不听从你们的上帝雅威的诫命，偏离我今日吩咐你们的道路，去随从你们素不认识的别神。 [a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译作：“和那咒诅，如果你们不听从……”。句首“那咒诅”与上一节的“那福”平行。
    reason: 说明原文前置名词及其与上一节的平行结构；正文以“咒诅临到你们”作自然的中文表达。
lexical_decisions:
- source_word: וְהַקְּלָלָה
  choice: 但……就必受咒诅
  rationale: 本句与上一节的“福”构成对照；中文用“但”自然承接反向条件，并把名词性标题“咒诅”表达为条件句的结果，使句意完整清楚。
- source_word: אִם לֹא
  choice: 如果……不
  rationale: 保留希伯来文明确的条件结构。
- source_word: תִשְׁמְעוּ אֶל
  choice: 听从
  rationale: “听从”既保留“听”的词义，又自然包含盟约语境中的顺服含义，避免只译作“服从”而抹去原文意象。
- source_word: מִצְוֺת
  choice: 诫命
  rationale: 这是现代中文圣经语域中自然且庄重的盟约用语。
- source_word: יְהוָה אֱלֹהֵיכֶם
  choice: 雅威你们的上帝
  rationale: 以“雅威”音译四字神名，保留其作为盟约之名的性质；所有格按现代汉语表达。
- source_word: וְסַרְתֶּם מִן הַדֶּרֶךְ
  choice: 偏离……道路
  rationale: 保留转离既定道路的空间隐喻，也符合现代汉语习惯。
- source_word: אֲשֶׁר אָנֹכִי מְצַוֶּה אֶתְכֶם הַיּוֹם
  choice: 我今天吩咐你们走的
  rationale: 结合后面的不定式 לָלֶכֶת 处理为修饰“道路”的结构，读起来清楚自然，同时保留“今天”所强调的当下宣告。
- source_word: לָלֶכֶת אַחֲרֵי
  choice: 去随从
  rationale: “随从”准确表达“走在……之后”的追随意象，并符合敬拜别神的语境。
- source_word: אֱלֹהִים אֲחֵרִים
  choice: 别神
  rationale: 简洁保留“其他的神”这一盟约性表达，不额外解释其性质。
- source_word: אֲשֶׁר לֹא יְדַעְתֶּם
  choice: 你们素不认识的
  rationale: “素不认识”表达此前从未认识或没有关系的状态，符合完成式在此处的语境功能。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华／上主
  rationale: 原文直接使用神的专名；音译“雅威”保留盟约之名，并遵循所给术语方针。
- issue: שׁמע 是否直接译为“服从”
  choice: 听从
  alternative: 听／服从
  rationale: “听从”兼顾原词的听闻意象和盟约语境中的顺服内涵，不把二者之间的张力单向消解。
- issue: וְהַקְּלָלָה 的句法呈现
  choice: 但……就必受咒诅
  alternative: 咒诅是：如果……
  rationale: 原文名词短语与上一节平行，语义上指出条件成立时所临到的咒诅；中文条件复句更自然，但仍保留“咒诅”这一核心盟约术语。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“听从”“诫命”“道路”“随从”“别神”等词保留申命记的盟约语汇与路径意象；避免古奥句式，同时不增加宗派性解释。
