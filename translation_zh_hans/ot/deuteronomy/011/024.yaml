base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/024.yaml
  text: Every place where the sole of your foot treads will be yours; from the wilderness and Lebanon[a], from the River, the Euphrates River, as far as the western sea, will be your border.
translation:
  language: zh_hans
  text: 凡你们脚掌所踏之地，都必归你们；你们的疆界必从旷野和黎巴嫩起，从那河，就是幼发拉底河，直到西海[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “西海”所译的词字面为“后面的海”或“最后的海”；按此处的地理用法，通常指地中海。
    reason: 保留אַחֲרוֹן的字面意义，并说明其在本节地理语境中通常的所指，而不将该解释当作该词本身唯一的字面意义。
lexical_decisions:
- source_word: כָּל הַמָּקוֹם
  choice: 凡……之地
  rationale: 表达希伯来语的周遍、分配意义，即每一处地方；用“凡……之地”既自然又庄重。
- source_word: אֲשֶׁר תִּדְרֹךְ כַּף רַגְלְכֶם בּוֹ
  choice: 你们脚掌所踏之地
  rationale: 保留“脚掌”这一具体意象，并以“所踏之地”顺畅表达地点关系。
- source_word: לָכֶם יִהְיֶה
  choice: 都必归你们
  rationale: 准确表达归属与应许语气；“必”体现未完成式在此处的确定将来意义。
- source_word: מִן הַמִּדְבָּר
  choice: 从旷野
  rationale: מִדְבָּר可指旷野或荒漠；“旷野”范围较广，也符合现代中文圣经地理语境。
- source_word: וְהַלְּבָנוֹן
  choice: 和黎巴嫩
  rationale: 保留原文连接词“和”，不擅自补入原文没有明说的“到”，从而保存边界句法的紧缩与些许含混。
- source_word: מִן הַנָּהָר נְהַר פְּרָת
  choice: 从那河，就是幼发拉底河
  rationale: 先译带定冠词的“那河”，再以“就是”呈现后面的同位说明“幼发拉底河”，保留原文结构。
- source_word: וְעַד הַיָּם הָאַחֲרוֹן
  choice: 直到西海
  rationale: אַחֲרוֹן本义为“后面的、末后的”；按古代希伯来人面向东方的方位观，此处通常指西面的海。“西海”清楚自然，脚注保留字面义。
- source_word: יִהְיֶה גְּבֻלְכֶם
  choice: 你们的疆界要……
  rationale: גְּבוּל在这里指领土边界；“疆界”比单纯“边界”更能体现地理疆域语境。
theological_decisions:
- issue: 土地应许的地理范围
  choice: 按经文直译为向以色列人宣告的疆域应许，不说明其后来的实现方式或神学意义。
  alternative: 将其解释为理想疆界、永久而无条件的产业，或预表性的应许。
  rationale: 本节只陈述所应许地域的范围；翻译不应替经文裁定有关实现、持续性或预表的神学争论。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。“凡……之地”“脚掌所踏”“疆界”等表达保留经文的宣告性和具体意象；分号区分归属应许与疆界说明。
