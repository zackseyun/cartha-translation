  text: כִּי֩ אִם שָׁמֹ֨ר תִּשְׁמְר֜וּ/ן אֶת כָּל הַ/מִּצְוָ֣ה הַ/זֹּ֗את אֲשֶׁ֧ר אָנֹכִ֛י מְצַוֶּ֥ה אֶתְ/כֶ֖ם לַ/עֲשֹׂתָ֑/הּ לְ/אַהֲבָ֞ה אֶת יְהוָ֧ה אֱלֹהֵי/כֶ֛ם לָ/לֶ֥כֶת בְּ/כָל דְּרָכָ֖י/ו וּ/לְ/דָבְקָה בֽ/וֹ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/022.yaml
  text: For if you carefully keep all this commandment that I am commanding you to do—to love Yahweh your God[a], to walk in all his ways[c][b], and to cling to him—
translation:
  language: zh_hans
  text: 因为你们若谨慎遵守我所吩咐你们实行的这整条诫命[a]，爱雅威你们的上帝，行在他一切的道路上，并紧紧依附他[b]——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“这整条诫命”；“诫命”为单数，可能统指整个盟约要求。
    reason: 说明原文单数名词所具有的集合性用法，并说明正文保留单数的依据。
  - marker: b
    text: “紧紧依附”也可译作“紧紧持守”或“与他紧密相连”。
    reason: 保留 דבק 在附着、持守和关系亲近之间的词义幅度。
lexical_decisions:
- source_word: כִּי אִם
  choice: 因为……若
  rationale: 既保留与上文的因果衔接，也自然引出带强调意味的条件句。
- source_word: שָׁמֹר תִּשְׁמְרוּן
  choice: 谨慎遵守
  rationale: 不定式绝对形与限定动词连用，加强语气；“谨慎遵守”同时表达强调和留心实践之意。
- source_word: כָּל הַמִּצְוָה הַזֹּאת
  choice: 这一整套诫命
  rationale: 原文“诫命”为单数，却带有整体、集合意义；此译法兼顾单数形式背后的整体约命内涵，并符合现代汉语。
- source_word: אֲשֶׁר אָנֹכִי מְצַוֶּה אֶתְכֶם לַעֲשֹׂתָהּ
  choice: 我吩咐你们实行的
  rationale: 将分词的当前言说作用译为“我吩咐”，并以“实行”自然表达 עשה 的实际履行含义，避免汉语中“吩咐你们去做的这一整套诫命”的累赘。
- source_word: לְאַהֲבָה אֶת יְהוָה אֱלֹהֵיכֶם
  choice: 爱耶和华你们的上帝
  rationale: 保留不定式所列出的诫命内容，并将神名 יהוה 音译为“耶和华”，不以称号替代专名。
- source_word: לָלֶכֶת בְּכָל דְּרָכָיו
  choice: 行他一切的道路
  rationale: 保留“行走/道路”的圣经性行为隐喻，不将其窄化为解释性的“照他的方式生活”。
- source_word: וּלְדָבְקָה בוֹ
  choice: 紧紧依附他
  rationale: דבק 表示紧密附着、忠贞相连；“紧紧依附”保留关系性与盟约性的力度，又比古雅表达更易懂。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名，应保留为专名而非改作“主”；“耶和华”是现代简体中文读者最熟悉且可辨识的专名形式。
- issue: “行他的道路”和“依附他”的盟约隐喻
  choice: 在正文中保留隐喻
  alternative: 按他的一切旨意生活，并忠于他
  rationale: 原文的“道路”与“依附”具有丰富而未完全限定的关系和行为含义；保留隐喻可避免把经文收窄为某一种神学解释。
- issue: 三个不定式与“诫命”的关系
  choice: 译作并列的诫命内容
  alternative: 译作遵守诫命的方法或结果
  rationale: 希伯来语 לְ 可表达目的或内容，句法存在一定张力；中文并列结构保留这种开放性，不明确限定为手段、目的或结果。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。以“这一整套诫命”表达单数集合概念；保留“行……道路”的经文隐喻。句末破折号反映本节条件从句尚未完结，并与下一节相接。
