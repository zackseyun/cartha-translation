  text: וִֽ/ידַעְתֶּם֮ הַ/יּוֹם֒ כִּ֣י לֹ֣א אֶת בְּנֵי/כֶ֗ם אֲשֶׁ֤ר לֹֽא יָדְעוּ֙ וַ/אֲשֶׁ֣ר לֹא רָא֔וּ אֶת מוּסַ֖ר יְהוָ֣ה אֱלֹהֵי/כֶ֑ם אֶת גָּדְל֕/וֹ אֶת יָד/וֹ֙ הַ/חֲזָקָ֔ה וּ/זְרֹע֖/וֹ הַ/נְּטוּיָֽה׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/002.yaml
  text: And know today that that I am not speaking to your children, who have not known and who have not seen the discipline of Yahweh your God[a], his greatness, his strong hand[b], and his outstretched arm—
translation:
  language: zh_hans
  text: 你们今天要知道：我这话不是对你们的儿女说的，因为他们不曾知道，也不曾看见耶和华——你们的上帝——的管教[a]，以及他的伟大、他强有力的手[b]和他伸出的膀臂——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文在这里采用省略说法，直译近于“因为不是你们的儿女——他们不曾知道，也不曾看见……”。意思是：摩西所面对的是亲眼经历过这些事的人，而不是没有这种经历的下一代。
    reason: 说明希伯来文的省略结构及正文为现代汉语所作的补足。
  - marker: b
    text: 或译：“大能的手”。
    reason: “强有力”与“大能”都可表达 חֲזָקָה 在这一惯用语中的含义。
lexical_decisions:
- source_word: וִידַעְתֶּם הַיּוֹם
  choice: 你们今天要知道
  rationale: 将完成式连词结构按语境理解为郑重提醒或劝告，保留“今天”的当下性和复数直接称呼。
- source_word: כִּי לֹא אֶת־בְּנֵיכֶם
  choice: 我这话不是对你们的儿女说的
  rationale: 希伯来文省略了支配“你们的儿女”的成分；根据上下文补出“我这话……说的”，使现代汉语通顺，同时用脚注保留原文的省略性。
- source_word: אֲשֶׁר לֹא יָדְעוּ וַאֲשֶׁר לֹא רָאוּ
  choice: 他们不曾知道，也不曾看见
  rationale: 两个并列关系从句都指儿女缺乏亲身经历；“不曾”体现截至当时未曾经验的含义。
- source_word: מוּסַר
  choice: 管教
  rationale: 该词兼具教导、纠正和惩戒的内涵；“管教”在现代汉语中能较好保留这种教育性与纠正性的张力。
- source_word: יְהוָה אֱלֹהֵיכֶם
  choice: 耶和华你们的上帝
  rationale: 以通行的中文音译“耶和华”呈现神名，并直译盟约称谓“你们的上帝”。
- source_word: גָּדְלוֹ
  choice: 他的伟大
  rationale: 直接表达上帝在大能作为中显出的伟大，不特意缩窄为威严或尊荣。
- source_word: יָדוֹ הַחֲזָקָה
  choice: 他有力的手
  rationale: חֲזָקָה本义为强壮、有力；“有力的手”既贴近词义，也保留表示神施行大能的形象。
- source_word: וּזְרֹעוֹ הַנְּטוּיָה
  choice: 他伸出的膀臂
  rationale: 保留希伯来文具体的身体意象及主动施展能力的惯用表达；“膀臂”庄重且符合中文圣经语体。
theological_decisions:
- issue: “不是你们的儿女”这一省略结构所表达的对比
  choice: 在正文补作“我这话不是对你们的儿女说的”
  alternative: 直译为“因为不是你们的儿女”；或理解为“不是你们的儿女知道并看见……”
  rationale: 原文未明说支配宾语的动词，重点是摩西当前所面对的亲历者与未亲历的儿女之间的对比。正文作最低限度补足以符合现代汉语，脚注则明确指出其省略性，避免把补足误当作原文明说。
- issue: מוּסַר所指的神圣作为
  choice: 管教
  alternative: 教导；惩戒；训诲
  rationale: 本节及后文把上帝的作为视为塑造和纠正以色列的经历。“管教”同时容纳教导与惩戒，不把含义单方面限定为处罚。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。以分号划清“不是对儿女说”与后续说明，以破折号保留本节向下一节延续的未完句势；神名译作“耶和华”，身体意象“手、膀臂”均予保留。
