base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/027.yaml
  text: the blessing[a], if you listen to the commandments of Yahweh your God[b], which I am commanding you today.
translation:
  language: zh_hans
  text: 你们若听从雅威[a]你们的上帝所吩咐你们的诫命，就必蒙福[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威”译自希伯来文的神名 יהוה（YHWH）；传统中文译作“耶和华”。
    reason: divine_name
  - marker: b
    text: 原文承接上一节“祝福和咒诅”的省略结构，较直译可作：“祝福，就是你们听从……的时候。”这里的关系词在上下文中带有条件意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶת הַבְּרָכָה
  choice: 就必蒙福
  rationale: 本节承接上一节“我把祝福和咒诅摆在你们面前”的省略结构。中文补出“蒙”与“必”，自然表达“祝福”作为条件结果，同时不重复上一节的完整句式。
- source_word: אֲשֶׁר
  choice: 若
  rationale: 形式上是关系词，但在此具有条件功能；译作“若”准确传达祝福所对应的条件。
- source_word: תִּשְׁמְעוּ אֶל
  choice: 听从
  rationale: שׁמע与אֶל连用，既有聆听之义，也包含作出顺服回应的语境含义。“听从”在现代汉语中兼顾二者。
- source_word: מִצְוֺת
  choice: 诫命
  rationale: 保留盟约及律法语境中的正式分量，也符合现代中文圣经用语。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的专名形式呈现四字神名，不用称号替代；脚注说明其对应希伯来文神名。
- source_word: אֱלֹהֵיכֶם
  choice: 你们上帝
  rationale: 准确表达第二人称复数所属关系。
- source_word: אֲשֶׁר אָנֹכִי מְצַוֶּה אֶתְכֶם הַיּוֹם
  choice: 就是我今天吩咐你们的
  rationale: 保留关系从句对“诫命”的修饰，并体现摩西当下正在颁布命令的言说情境。
theological_decisions:
- issue: 祝福与听从之间的关系
  choice: 译为条件句“若……就……”
  alternative: 直译为“祝福，就是你们听从……”
  rationale: 希伯来文关系词在上下文中具有条件意味；条件式忠实呈现经文结构，却不进一步断定祝福的机制或范围。
- issue: 神名יְהוָה的呈现
  choice: 耶和华
  alternative: 雅威；主
  rationale: 采用简体中文普通读者最熟悉的神名音译，并以脚注交代原文是四字神名；不以“主”这一称号替代专名。
- issue: שׁמע的顺服含义
  choice: 听从
  alternative: 听；服从
  rationale: “听从”同时保留听见和回应遵行的张力，避免只表达听觉或只剩服从概念。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“听从”兼顾听见与顺服；“就是我今天吩咐你们的”清楚回指“诫命”。本节依赖上一节的句法，译文适度补足“就必蒙福”，便于独立诵读。
