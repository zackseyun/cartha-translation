  text: כִּ֤י אַתֶּם֙ עֹבְרִ֣ים אֶת הַ/יַּרְדֵּ֔ן לָ/בֹא֙ לָ/רֶ֣שֶׁת אֶת הָ/אָ֔רֶץ אֲשֶׁר יְהוָ֥ה אֱלֹהֵי/כֶ֖ם נֹתֵ֣ן לָ/כֶ֑ם וִֽ/ירִשְׁתֶּ֥ם אֹתָ֖/הּ וִֽ/ישַׁבְתֶּם בָּֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/031.yaml
  text: For you are crossing the Jordan to go in to take possession of the land that Yahweh your God is giving you[a], and you will take possession of it and live in it.
translation:
  language: zh_hans
  text: 因为你们将要渡过约旦河，进去取得雅威[a]你们的上帝赐给你们的那地；你们必取得那地，住在其中。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文为 YHWH（יהוה），上帝的专名；此处译作“雅威”。
    reason: 说明神名的原文形式及正文所采用的音译。
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，为前面的劝勉说明理由；中文用“因为”自然保留因果连接。
- source_word: עֹבְרִים
  choice: 将要渡过
  rationale: Qal分词在语境中表示即将发生的行动；“将要渡过”明确表达以色列人尚未过河的临近状态。
- source_word: הַיַּרְדֵּן
  choice: 约旦河
  rationale: 中文惯用地名为“约旦河”，补出“河”符合现代汉语习惯。
- source_word: לָבֹא
  choice: 进去
  rationale: 保留渡河之后进入那地的动作顺序，且比单用“进入”更贴近原文动词链。
- source_word: לָרֶשֶׁת / וִירִשְׁתֶּם אֹתָהּ
  choice: 取得／必取得
  rationale: ירשׁ在此指实际取得并占有土地；“取得”简洁自然，同时避免“继承”可能带来的狭义家产继承含义。前后采用同一词根对应。
- source_word: הָאָרֶץ
  choice: 那片土地／那地
  rationale: 所指是上下文中特定的应许之地；首次用“那片土地”，后用“那地”，清楚且自然。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神名音译，并以脚注说明希伯来文形式及另一常见音译。
- source_word: אֱלֹהֵיכֶם
  choice: 你们的上帝
  rationale: 准确表达第二人称复数所属关系；“上帝”是现代标准汉语中清楚、庄重的称谓。
- source_word: נֹתֵן לָכֶם
  choice: 赐给你们
  rationale: 分词表达正在施行或确定将施行的赐予；中文无需机械标出进行体，“赐给”兼顾神圣语境与自然表达。
- source_word: וִישַׁבְתֶּם בָּהּ
  choice: 并住在那里
  rationale: ישׁב在此表示居住；“住在那里”是自然现代汉语，不额外强化为“定居”。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名，应译作专名而非以“主”这一称号代替。“耶和华”在现代中文中辨识度最高；脚注保留希伯来文YHWH，并提示“雅威”这一常见拟音，以免把具体发音说成毫无疑义。
- issue: ירשׁ 在土地语境中的含义
  choice: 取得
  alternative: 继承
  rationale: 本节兼具上帝赐地与以色列人实际进入占有的张力。“取得”保留人的行动面，也不否认土地是上帝所赐；“继承”在现代汉语中容易被理解为亲属财产承继。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“将要渡过”体现动作的临近性；“进去—取得—住在那里”保留原文连续动作的推进。神名使用“耶和华”并加脚注，不以称号替代专名。
