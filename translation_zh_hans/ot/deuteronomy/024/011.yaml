base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/011.yaml
  text: You shall stand outside[a], and the man to whom you are making the loan shall bring the pledge out to you.
translation:
  language: zh_hans
  text: 你要站在外面；向你借债的那人[a]要把抵押物拿出来交给你。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你借钱给的那人”。希伯来语这一表达既可着重债主借出的行动，也可着重借债者负债的状态。
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחוּץ
  choice: 在外面
  rationale: 该词指屋外；“在外面”自然清楚，也符合上下文禁止债主进入借债者家中取抵押物的规定。
- source_word: תַּעֲמֹד
  choice: 要站
  rationale: עמד的具体含义是“站立”；这里也隐含在外等候之意，但译作“要站”保留了原文的具体命令。
- source_word: וְהָאִישׁ
  choice: 那人
  rationale: איש在此指涉具体的男性借债者。“那人”符合现代汉语法律叙述的自然表达，同时没有将其泛化为抽象的“人”。
- source_word: אֲשֶׁר אַתָּה נֹשֶׁה בוֹ
  choice: 向你借债的
  rationale: 该短语描述债权人与债务人的关系，既可从债主放贷的行动着眼，也可从对方负债的状态着眼。正文采用自然的债务人视角，并以脚注保留另一种理解。
- source_word: יוֹצִיא
  choice: 拿出来
  rationale: יצא的使役式意为“使出来”，在此即由屋内拿到外面；“拿出来”符合抵押物这一具体宾语。
- source_word: אֵלֶיךָ
  choice: 交给你
  rationale: 原文介词表示朝向债主。结合拿出抵押物的动作，译为“交给你”自然表达其方向与交付关系。
- source_word: הָעֲבוֹט
  choice: 抵押物
  rationale: עבוט指为债务担保而交出的物件。“抵押物”在现代汉语中准确、易懂，并保留法律语境。
- source_word: הַחוּצָה
  choice: 出来
  rationale: 方向形式表示“到外面去”。与יוֹצִיא合译为“拿出来”，避免重复“外面”，同时保留从屋内向屋外移动的方向。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的法律叙述语体。“借债”比单说“借”更明确地表达债务关系；分号清楚区分债主在外等候与借债者拿出抵押物这两个动作。
