base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/019.yaml
  text: When you reap your harvest in your field and forget a sheaf in the field[a], you shall not go back to take it. It shall be for the sojourner, the fatherless, and the widow[b], so that Yahweh your God may bless you in all the work of your hands.
translation:
  language: zh_hans
  text: 你在田里收割自己的庄稼时，若有一捆禾忘在田间，就不可回去拿。那捆禾要留给寄居者[a]、孤儿[b]和寡妇，好让雅威你的上帝在你手所做的一切工作上赐福给你。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “寄居者”指住在以色列人中间的非本地居民；也可译作“外来人”或“外侨”。
    reason: 说明גֵּר的社会法律含义及可行译法。
  - marker: b
    text: “孤儿”也可译作“失父者”或“没有父亲的人”。
    reason: יָתוֹם可着重指失去父亲、缺少家庭保障的人。
lexical_decisions:
- source_word: כִּי תִקְצֹר קְצִירְךָ
  choice: 你……收割庄稼，若……
  rationale: כִּי在个案律法中引出一种可能发生的情形；汉语用“若”自然保留条件意味。“收割庄稼”准确表达动词与同根名词的农业语境。
- source_word: עֹמֶר
  choice: 一捆禾
  rationale: 此处指收割后捆起的禾秆或谷物，不是作为容量单位的“俄梅珥”；“一捆禾”比音译清楚，也符合田间场景。
- source_word: לֹא תָשׁוּב לְקַחְתּוֹ
  choice: 不可回去拿
  rationale: 保留“返回”与“拿取”两个动作，并以简明庄重的现代汉语表达禁令。
- source_word: לַגֵּר
  choice: 寄居者
  rationale: גֵּר指住在以色列人中间、却非本地出身的居民；“寄居者”保留其社会和法律身份，不把它泛化为普通陌生人。
- source_word: לַיָּתוֹם
  choice: 孤儿
  rationale: 这是现代汉语中自然易懂的称呼；希伯来词尤其可指失去父亲、因而缺乏家庭保障的人，另义在脚注说明。
- source_word: יִהְיֶה
  choice: 要留给
  rationale: 字面为“要归给／要给”；结合不可返回取走的上下文，“要留给”清楚表达这捆禾应供弱势群体取用，而不额外断定严格的产权转移。
- source_word: לְמַעַן
  choice: 好使
  rationale: 自然表达目的或预期结果，同时保留上帝赐福与顺服此命令之间的经文联系。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名יהוה；“雅威”按较通行的学术重构音译其专名，避免用称号替代。
- issue: גֵּר所指的社会法律身份
  choice: 寄居者
  alternative: 外来人／外侨／陌生人
  rationale: 这里所指并非短暂停留的旅客或泛指陌生人，而是住在以色列群体中、受律法特别保护的非本地居民；译文保留这一身份及其脆弱处境。
- issue: 赐福句的目的与结果张力
  choice: 好使雅威……赐福给你
  alternative: 因此雅威……会赐福给你
  rationale: לְמַעַן可涉及目的或结果；“好使”保留原文表述，不将其改写成机械的因果保证。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。句式保留个案律法的条件结构和禁令语气；“一捆禾”呈现具体农业图景，“要留给”则避免生硬的产权措辞。所有脚注标记均置于相应词语之后。
