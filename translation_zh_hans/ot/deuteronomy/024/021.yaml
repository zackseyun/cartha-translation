base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/021.yaml
  text: When you harvest the grapes of your vineyard[a], you shall not go over it again after yourself; it shall be for the sojourner, the fatherless[c][b], and the widow.
translation:
  language: zh_hans
  text: 你收割葡萄园的葡萄时，不可随后再摘取剩下的[a]；要留给寄居者[b]、孤儿[c]和寡妇。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不可随后再搜摘”，也可译：“不可再摘一遍。”希伯来文动词指初次采收后，再去收取余下的果实。
    reason: lexical_alternative
  - marker: b
    text: “寄居者”指住在以色列人中间、并非本地出身的居民；也可译作“外来居民”。
    reason: cultural_note
  - marker: c
    text: 或译：“无父者。”这里的希伯来词可指失去父亲者，也可泛指孤儿。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ……时
  rationale: 此处引出律法所设想的通常情形；用“……时”比“如果”更符合现代汉语法律训令的表达。
- source_word: תִבְצֹר
  choice: 收割……的葡萄
  rationale: בצר 特指采收葡萄；译文明确补出汉语中自然需要的宾语“葡萄”。
- source_word: כַּרְמְךָ
  choice: 你的葡萄园
  rationale: 准确表达 כֶּרֶם，并保留第二人称单数所属关系。
- source_word: לֹא תְעוֹלֵל אַחֲרֶיךָ
  choice: 不可随后再摘取剩下的
  rationale: 农业语境中的 עולל 指初次采收后再搜摘余下果实；אַחֲרֶיךָ 表示在自己采收之后。此译法清楚表达禁止园主进行第二遍搜摘，又避免“拾取”使人误以为指穷人的捡拾行为。
- source_word: לַגֵּר
  choice: 留给寄居者
  rationale: גֵּר 指居住在以色列人中间、并非本地出身的居民；“寄居者”保留其社会和法律身份内涵。
- source_word: לַיָּתוֹם
  choice: 孤儿
  rationale: יָתוֹם 可指失去父亲者或孤儿；“孤儿”是现代汉语中自然、通行的对应词，脚注保留较字面的可能表达。
- source_word: וְלָאַלְמָנָה
  choice: 和寡妇
  rationale: אַלְמָנָה 明确指寡妇。
- source_word: יִהְיֶה
  choice: 要留给
  rationale: 希伯来文直译为“要归……所有／要给……”；结合不可再次摘取的命令，“要留给”自然表达余下葡萄的指定用途。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的律法语体。“不可……；要……”保留原文命令与安排之间的结构。用“随后再摘取剩下的”表达第二遍搜摘，避免生硬直译“在你后面”，同时不抹去原文强调园主不可回头收尽余果的含义。
