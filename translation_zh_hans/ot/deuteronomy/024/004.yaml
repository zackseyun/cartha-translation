  text: לֹא יוּכַ֣ל בַּעְלָ֣/הּ הָ/רִאשׁ֣וֹן אֲשֶֽׁר שִׁ֠לְּחָ/הּ לָ/שׁ֨וּב לְ/קַחְתָּ֜/הּ לִ/הְי֧וֹת ל֣/וֹ לְ/אִשָּׁ֗ה אַחֲרֵי֙ אֲשֶׁ֣ר הֻטַּמָּ֔אָה כִּֽי תוֹעֵבָ֥ה הִ֖וא לִ/פְנֵ֣י יְהוָ֑ה וְ/לֹ֤א תַחֲטִיא֙ אֶת הָ/אָ֔רֶץ אֲשֶׁר֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ נֹתֵ֥ן לְ/ךָ֖ נַחֲלָֽה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/004.yaml
  text: her first husband[a], who sent her away, may not take her again to be his wife after she has been defiled, for that is an abomination before Yahweh; and you shall not bring sin upon the land that Yahweh your God is giving you as an inheritance.
translation:
  language: zh_hans
  text: 那曾把她送走的第一任丈夫，在她被玷污[a]以后，不可再娶她为妻，因为这在雅威面前是可憎的事。你不可使雅威你的上帝赐给你作产业的地陷入罪中。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“成为不洁”，或“被弄得不洁”。希伯来文说“被玷污”，但没有说明这种玷污的确切性质。
    reason: 保留טמא被动式的词义范围，以及本节对玷污性质未作明确界定的歧义。
lexical_decisions:
- source_word: בַּעְלָהּ הָרִאשׁוֹן
  choice: 她的第一个丈夫
  rationale: בעל在婚姻语境中指“丈夫”，הָרִאשׁוֹן直译为“第一个”，并与后来那位丈夫形成法律上的对照。
- source_word: שִׁלְּחָהּ
  choice: 把她送走
  rationale: 保留שלח“送走”的基本含义；上下文已经明确这是离婚的法律情境，无须在本节把它改释为“休弃”。
- source_word: לָשׁוּב לְקַחְתָּהּ לִהְיוֹת לוֹ לְאִשָּׁה
  choice: 不可再娶她为妻
  rationale: 不定式结构表示重新采取这一行动；在汉语婚姻语境中，“再娶她为妻”自然地表达复婚之意。
- source_word: אַחֲרֵי אֲשֶׁר הֻטַּמָּאָה
  choice: 在她被玷污以后
  rationale: 采用被动表达，保留טמא在此处“被玷污／成为不洁”的宽泛含义，不限定其究竟是礼仪、法律、性或关系层面的污秽。
- source_word: תוֹעֵבָה
  choice: 可憎的事
  rationale: 传达该词强烈的盟约伦理判断，同时使用现代汉语中庄重而易懂的表达。
- source_word: לִפְנֵי יְהוָה
  choice: 在耶和华面前
  rationale: 直接反映“在……面前／临在中”的措辞，并将יהוה译为“耶和华”。
- source_word: וְלֹא תַחֲטִיא אֶת הָאָרֶץ
  choice: 不可使……地陷入罪中
  rationale: 保留חטא使役形所表达的“使陷入罪责／把罪带给”的含义，避免改用原文此处并未出现的“玷污土地”。
- source_word: נֹתֵן לְךָ נַחֲלָה
  choice: 赐给你作产业
  rationale: נחלה指承受而来的产业；此译法简洁保留应许之地作为盟约产业的含义。
theological_decisions:
- issue: “她被玷污以后”的具体含义
  choice: 正文保留宽泛的“被玷污”
  alternative: 成为礼仪上不洁；受到性方面的玷污；因中间一段婚姻而失去复婚资格
  rationale: 希伯来文使用טמא的被动式，却没有在本节说明玷污的确切性质。译文不替原文消除这一法律和神学张力。
- issue: 神名יהוה的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 原文直接使用四字神名；“耶和华”是现代简体中文圣经语境中广为人知且可辨识的专名表达。
translation_notes:
  register: 采用现代、庄重而易懂的法律语体。“送走”贴近原文动作措辞，“再娶她为妻”则以自然汉语明确其婚姻语境。
