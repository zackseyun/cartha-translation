base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/014.yaml
  text: You shall not oppress a hired worker who is poor and needy[a], whether one of your brothers or one of your sojourners who is in your land[b], within your gates.
translation:
  language: zh_hans
  text: 不可欺压贫穷困苦的雇工[a]，无论他是你的弟兄，还是在你境内、在你城门以内的寄居者[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “欺压”也可译作“剥削”或“欺诈”；这里的希伯来语动词包括经济上的压迫，例如克扣或拖欠工钱。
    reason: lexical_alternative
  - marker: b
    text: “在你城门以内”是希伯来语惯用说法，指住在所属城镇或处于当地共同体管辖范围内。
    reason: cultural_note
lexical_decisions:
- source_word: תַעֲשֹׁק
  choice: 欺压
  rationale: 该动词泛指以强势地位压迫或剥削他人，在本段雇佣关系的语境中包含克扣、拖欠应付工钱等经济欺压；“欺压”既保留广度，也保留禁令的道德力度。
- source_word: שָׂכִיר
  choice: 雇工
  rationale: 指受雇领取工钱的人。“雇工”是简洁、自然的现代汉语法律与劳动用语，不会误导为奴仆。
- source_word: עָנִי וְאֶבְיוֹן
  choice: 贫穷困苦
  rationale: 两个近义词并列，强化受雇者在经济与生活上的脆弱处境；译文保留双重描述，而不把二者合并为单一概念。
- source_word: מֵאַחֶיךָ
  choice: 你的弟兄
  rationale: 原文是盟约群体中的亲属称谓，在此指以色列同胞；保留“弟兄”可呈现申命记特有的亲族语言。
- source_word: מִגֵּרְךָ
  choice: 寄居者
  rationale: גֵּר 指住在以色列社会中的非本地居民，是受律法保护的特定社会身份。“寄居者”保留其圣经法律语境，避免套用现代移民法类别。
- source_word: אֲשֶׁר בְּאַרְצְךָ
  choice: 住在你境内
  rationale: 关系从句按单数自然地修饰“寄居者”；“境内”比逐字的“地里”更符合此处领土与司法范围的含义。
- source_word: בִּשְׁעָרֶיךָ
  choice: 你城门以内
  rationale: 保留原文“城门”的意象和法律色彩；该短语在希伯来语中通常涵盖所属城镇及其管辖范围，脚注加以说明。
theological_decisions:
- issue: 盟约律法中的亲属称谓 אַחֶיךָ
  choice: 你的弟兄
  alternative: 你的以色列同胞
  rationale: 译作“弟兄”保留原文明确的亲属隐喻及盟约共同体色彩，不在正文中将其解释性改写为族群称谓。
- issue: 社会法律身份 גֵּר 的表达
  choice: 寄居者
  alternative: 外来居民
  rationale: “寄居者”保留原文所指的受保护外来居民这一圣经社会类别，同时避免把古代身份直接等同于现代法律上的外国人或移民身份。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“不可”保留律法禁令的正式语气；“雇工”“寄居者”准确呈现古代社会法律身份。句中用“无论……还是……”清楚表达两类受保护对象，同时保留“弟兄”与“城门”的原文意象。
