  text: בְּ/יוֹמ/וֹ֩ תִתֵּ֨ן שְׂכָר֜/וֹ וְֽ/לֹא תָב֧וֹא עָלָ֣י/ו הַ/שֶּׁ֗מֶשׁ כִּ֤י עָנִי֙ ה֔וּא וְ/אֵלָ֕י/ו ה֥וּא נֹשֵׂ֖א אֶת נַפְשׁ֑/וֹ וְ/לֹֽא יִקְרָ֤א עָלֶ֨י/ךָ֙ אֶל יְהוָ֔ה וְ/הָיָ֥ה בְ/ךָ֖ חֵֽטְא־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/015.yaml
  text: You shall give him his wages on his day[a], and the sun shall not go down on it, because he is poor and sets his life on it, so that he does not cry out against you to Yahweh, and it becomes sin in you.
translation:
  language: zh_hans
  text: 你要当天把工钱给他，不可等到日落，因为他贫穷，靠这工钱维生[a]；免得他向雅威呼求控告你，你就有了罪。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译近于“他向它举起自己的性命”，意思是他迫切依赖这笔工钱生活。
    reason: 说明希伯来习语的字面意象及其在此处表达的生计依赖。
lexical_decisions:
- source_word: בְּיוֹמוֹ
  choice: 当天
  rationale: 字面为“在他的日子”，在雇工付酬的法律语境中指应在做工的当天支付；“当天”自然、明确地传达即时付薪的要求。
- source_word: תִתֵּן שְׂכָרוֹ
  choice: 把工钱给他
  rationale: שָׂכָר指劳动所得的报酬；“工钱”符合现代汉语中的雇工语境，也保留命令的直接性。
- source_word: וְלֹא תָבוֹא עָלָיו הַשֶּׁמֶשׁ
  choice: 不可等到日落
  rationale: 希伯来文直译近于“太阳不可临到它之上”，表达不可拖延到日落才付工钱；汉语以“不可等到日落”自然呈现这一时限。
- source_word: כִּי עָנִי הוּא
  choice: 因为他贫穷
  rationale: עָנִי在此突出雇工经济上的困乏与脆弱，“贫穷”直接贴合上下文。
- source_word: וְאֵלָיו הוּא נֹשֵׂא אֶת נַפְשׁוֹ
  choice: 靠这工钱维生
  rationale: 该习语字面涉及把“性命”举向工钱，语义是迫切依赖这笔收入生活；正文采用自然汉语，脚注保留原文意象。
- source_word: וְלֹא יִקְרָא עָלֶיךָ אֶל יְהוָה
  choice: 免得他向雅威呼求控告你
  rationale: “免得”体现警戒性的后果；“呼求控告你”兼顾受欺压者向上帝求告及针对欠薪者提出申诉的含义。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，而不以称号替代。
- source_word: וְהָיָה בְךָ חֵטְא
  choice: 你就有了罪
  rationale: 保留“罪在你这里形成／存在”的表达，不将其过度技术化为单纯法律责任；“就”也自然连接前述呼求与结果。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较贴近学界通常重构的读音，并保留其作为专名的性质。
- issue: וְהָיָה בְךָ חֵטְא 所表达的罪责
  choice: 你就有了罪
  alternative: 你就担当罪责
  rationale: 原文说罪“在你里面／归于你”，并未使用专门表示承担刑责的术语，因此采用较贴近原文且不额外体系化的表达。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“当天”“工钱”“维生”符合普通读者习惯；用“免得”保留法律警告的语气，并以分号呈现理由与后果之间的层次。
