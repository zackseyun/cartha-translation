- source_word: וְיָצְאָה מִבֵּיתוֹ
  choice: 她离开他的家
  rationale: יצא与מן表示从某处出去；现代汉语用“离开他的家”自然、完整地表达离开的动作和起点。
- source_word: וְהָלְכָה
  choice: 去
  rationale: הלך在这里推进法律案例中的动作次序；“去”简洁自然，不额外指定行走方式或目的地。
- source_word: וְהָיְתָה לְאִישׁ אַחֵר
  choice: 成为另一个人的妻子
  rationale: 直译为“归于另一个男人/成为另一个男人的”；结合离婚与再婚的语境，היה ל表示进入婚姻关系。补出“妻子”使现代汉语意思清楚，同时以脚注保留原文较简略的表达。
