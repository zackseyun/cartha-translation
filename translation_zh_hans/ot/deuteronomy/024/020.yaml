base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/020.yaml
  text: When you beat your olive tree[a], you shall not go over it again; it shall be for the sojourner, for the fatherless[c][b], and for the widow.
translation:
  language: zh_hans
  text: 你打橄榄树的时候[a]，不可回头再打；剩下的要留给寄居者[b]、孤儿[c]和寡妇。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 指击打橄榄树枝，使橄榄落下。后半句也可译作“不可把身后剩下的摘尽”，意思是不可再采收一遍。
    reason: 说明古代采收方式，并保留罕见短语לֹא תְפָאֵר אַחֲרֶיךָ的译法可能性。
  - marker: b
    text: “寄居者”指住在以色列人中间的外来居民；也可译作“外侨”。
    reason: 交代גֵּר在以色列律法中的社会身份，不把它仅仅理解为短期旅客。
  - marker: c
    text: “孤儿”也可译作“无父的人”。在古代家庭结构中，这个词特别突显失去父亲所带来的无依无靠。
    reason: 保留יָתוֹם可具体指无父者的词义范围。
lexical_decisions:
- source_word: כִּי
  choice: ……的时候
  rationale: 在这一律例语境中引出通常发生的情形；用时间表达比单纯的假设条件更自然。
- source_word: תַחְבֹּט
  choice: 打
  rationale: חבט在此指击打橄榄树枝，使果实掉落；“打”简洁地保留了古代采收动作。
- source_word: זֵיתְךָ
  choice: 你的橄榄树
  rationale: זַיִת既可指橄榄，也可指橄榄树；击打这一动作表明此处指树。中文正文按语境省去不必要的“你的”，不改变第二人称单数所表达的责任。
- source_word: לֹא תְפָאֵר אַחֲרֶיךָ
  choice: 不可回头再打
  rationale: פאר的这一罕见用法与אַחֲרֶיךָ合起来，指首次采收后不可再回去搜取枝上余果。“回头再打”以自然中文表达禁止第二遍采收，同时不把动作泛化为普通拾穗。
- source_word: לַגֵּר
  choice: 给寄居者
  rationale: גֵּר指住在以色列人中间、没有本地宗族土地保障的外来居民；“寄居者”保留其法律与社会身份。
- source_word: לַיָּתוֹם
  choice: 给孤儿
  rationale: יָתוֹם指失去父亲或父母、因而缺乏家庭保障的人；现代中文以“孤儿”最清楚自然。
- source_word: וְלָאַלְמָנָה
  choice: 和寡妇
  rationale: 准确表达אַלְמָנָה所指丧偶而处于社会弱势的妇女。
- source_word: יִהְיֶה
  choice: 剩下的要留给
  rationale: 原文直译为“要归给/要给”；中文补出语境中所指的余下橄榄，并用“留给”清楚表达法律上的保留义务。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的律例语体。“不可”保留禁令力度；分号呈现禁令与余果归属之间的紧密关系。正文避免生硬直译“不可在你身后修枝/摘净”，以“不可回头再打”准确传达不得进行第二遍采收。
