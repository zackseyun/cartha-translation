base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/006.yaml
  text: No one shall take a pair of millstones[a], or even the upper millstone, as a pledge, for he would be taking a life as a pledge.
translation:
  language: zh_hans
  text: 不可拿一对磨石或上磨石作抵押，因为这样就是拿人的性命[a]作抵押。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为这样就是拿人的生计作抵押。”
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחֲבֹל / חֹבֵל
  choice: 拿……作抵押
  rationale: 在本节债务法律语境中，חבל指拿物件作为债务担保；前后采用相同措辞，也保留了原文动词的重复。
- source_word: רֵחַיִם
  choice: 一对磨石
  rationale: 该词为双数形式，指成套的两块磨石；译作“一对磨石”明确表达其形态。
- source_word: וָרָכֶב
  choice: 甚至……上磨石
  rationale: רָכֶב在此指转动的上层磨石。连接词按禁令的递进法律含义译为“甚至”：整套磨石不可取，连其中关键的上磨石也不可取。
- source_word: כִּי
  choice: 因为
  rationale: 自然引出禁令的理由。
- source_word: נֶפֶשׁ
  choice: 人的性命
  rationale: נֶפֶשׁ在此指具体的生命或赖以维生的生计，并非抽象的非物质“灵魂”。磨石用于制作每日食物，拿走它会威胁人的生存；“性命”保留原文强烈的表达。
- source_word: הוּא
  choice: 这等于
  rationale: 原文代词承接取抵押之举及其行为者；中文用“这等于”自然表达该行为实际造成的后果，同时不必补出性别不明的主语。
theological_decisions:
- issue: נֶפֶשׁ在社会法律语境中的含义
  choice: 具体的性命，并以脚注注明“生计”的可能理解
  alternative: 灵魂；人；生计
  rationale: 经文所禁止的是拿走债务人制作基本食物所需的工具，因为这会危及其生存。正文“性命”保存原文的力度，脚注则保留该词在此也可侧重维生手段的语义张力；这属于词义和语境判断，并非对人论作教义性界定。
translation_notes:
  register: 采用现代、庄重而易懂的法律禁令表达。“不可……甚至不可……”清楚呈现禁令的递进关系；“作抵押”符合当代普通读者对债务担保的理解。脚注标记置于整句之后，对应נֶפֶשׁ的词义选择。
