base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/009.yaml
  text: Remember what Yahweh your God did to Miriam on the way when you were coming out of Egypt[a][b].
translation:
  language: zh_hans
  text: 你要记住：你们从埃及出来、在路上的时候，耶和华你的神向米利暗所做的事[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“耶和华你的神对米利暗所行的事。”
    reason: lexical_alternative
  - marker: b
    text: 这是指以色列人出埃及后的行程；参民数记12:1—15。
    reason: cross_reference
lexical_decisions:
- source_word: זָכוֹר
  choice: 你要记住
  rationale: 这是阳性单数的直接命令；用“你要记住”既保留单数对象，也表达郑重的劝诫与盟约性的记念。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 直接译出四字神名；“耶和华”是现代中文圣经语境中通行且易于辨认的专名形式。
- source_word: אֱלֹהֶיךָ
  choice: 你的神
  rationale: 保留第二人称阳性单数后缀，准确呈现经文由单数命令转为复数群体回顾的变化。
- source_word: לְמִרְיָם
  choice: 向米利暗
  rationale: 介词 ל 标明动作所涉及或指向的人；“向米利暗所做的事”保留其宽泛关系，不具体添加惩罚或处置等解释。
- source_word: בַּדֶּרֶךְ
  choice: 在……的路上
  rationale: 既保留“道路、途中”的具体意象，也自然指向以色列出埃及后的行程。
- source_word: בְּצֵאתְכֶם מִמִּצְרָיִם
  choice: 在你们出埃及
  rationale: 不定式结构具有时间意义，第二人称复数后缀译为“你们”；中文“出埃及”简洁自然，并保留出离行动的语义。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文明确使用四字神名而非称号，因此正文采用中文读者最熟悉的专名音译“耶和华”，不以“主”替代。
- issue: 耶和华对米利暗所做之事的性质
  choice: 向米利暗所做的事
  alternative: 怎样处置米利暗
  rationale: 本节没有明说动作的性质；正文保持 עשה 加 ל 的宽泛表达，避免把民数记12章的背景解释直接写进正文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“你要”与“你们”分别对应原文的单数命令和复数出行动作者，不将二者强行统一；句式略作前置调整，使时间背景在中文中清楚自然。
