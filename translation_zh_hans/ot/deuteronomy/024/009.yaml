  rationale: 仅调整时间／处境短语及句子断分，使译文更自然清楚地反映原文“在路上、当你们从埃及出来时”的结构。保留命令对象由单数转为复数、神名，以及对耶和华向米利暗所作之事的刻意宽泛表述。
