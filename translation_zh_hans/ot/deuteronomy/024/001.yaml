  text: כִּֽי יִקַּ֥ח אִ֛ישׁ אִשָּׁ֖ה וּ/בְעָלָ֑/הּ וְ/הָיָ֞ה אִם לֹ֧א תִמְצָא חֵ֣ן בְּ/עֵינָ֗י/ו כִּי מָ֤צָא בָ/הּ֙ עֶרְוַ֣ת דָּבָ֔ר וְ/כָ֨תַב לָ֜/הּ סֵ֤פֶר כְּרִיתֻת֙ וְ/נָתַ֣ן בְּ/יָדָ֔/הּ וְ/שִׁלְּחָ֖/הּ מִ/בֵּיתֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/001.yaml
  text: If a man takes a wife and marries her[a], and it happens that she does not find favor in his eyes because he has found in her some indecency, and he writes her a certificate of divorce, puts it into her hand, and sends her out of his house,
translation:
  language: zh_hans
  text: “如果一个男人娶妻并与她成婚，若她在他眼中不蒙喜爱，因为他发现她有某种不体面的事[a]，他便给她写一份离婚文书，交在她手中，打发她离开自己的家，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“某种可耻的事”或“某件不合宜的事”。希伯来语这一短语含义含混，历来有不止一种解释。
    reason: 说明原文 עֶרְוַת דָּבָר 的词义含混，并提供不将其过度具体化的替代译法。
lexical_decisions:
- source_word: כִּי
  choice: 如果
  rationale: 这里引入案例法的条件句，而不是表达原因；“如果”能自然标明尚未完结的前提。
- source_word: יִקַּח אִישׁ אִשָּׁה וּבְעָלָהּ
  choice: 一个人娶了妻，与她成婚以后
  rationale: 兼顾“娶妻”的希伯来表达和 בעל 在此进入婚姻关系的含义，避免译成带有物权意味的“占有”。
- source_word: לֹא תִמְצָא חֵן בְּעֵינָיו
  choice: 妻子在他眼中不再蒙喜爱
  rationale: 保留“在他眼中”和“蒙喜爱”的源语意象；“不再”符合婚后情境中关系发生变化的语用含义。
- source_word: עֶרְוַת דָּבָר
  choice: 难以启齿的事
  rationale: 该短语字面涉及“裸露、羞耻”与“事情”，所指并不明确；此译保留羞耻性和不确定性，不武断限定为某一种过错。
- source_word: סֵפֶר כְּרִיתֻת
  choice: 休书
  rationale: 指正式解除婚姻关系的文书；“休书”在现代中文圣经语境中简洁易懂，同时保留古代法律背景。
- source_word: וְנָתַן בְּיָדָהּ
  choice: 交在她手中
  rationale: 保留把文书实际交付给女方这一具体法律程序。
- source_word: וְשִׁלְּחָהּ מִבֵּיתוֹ
  choice: 打发她离开自己的家
  rationale: 体现“遣走”及离开男方住所的双重含义，语气与古代案例法相称。
theological_decisions:
- issue: 本节是准许或命令离婚，还是案例法尚未结束的条件部分
  choice: 译为延续到后文的条件性法律情境，不译成命令
  alternative: 可将各动作译成准许或命令离婚的独立规定
  rationale: 申命记24:1–4的句法先连续陈述条件，主要法律裁定到后文才出现。因此本节以“如果”起首并以逗号收束，避免暗示经文在此命令人离婚。
- issue: עֶרְוַת דָּבָר 所指的具体过错
  choice: 保留为含混的“难以启齿的事”
  alternative: 明确译为淫乱、性方面的不检点，或泛指任何令人不悦之事
  rationale: 希伯来语短语本身含义宽泛且历来有不同解释，译文不应替原文消除这一神学与法律上的张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语，保留古代案例法的行文方式。本节只是长条件句的开端，因此末尾保留逗号。脚注标记放在其实际说明的“难以启齿的事”之后。
