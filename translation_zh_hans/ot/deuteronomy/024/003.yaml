base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/003.yaml
  text: and the latter man hates her[a], and writes her a certificate of divorce, and puts it into her hand, and sends her out of his house, or if the latter man dies[c][b], who took her as his wife—
translation:
  language: zh_hans
  text: 后来的那人若恨她[a]，就给她写一份离婚文书[b]，交在她手中，遣她离开他的家；或者，那娶她为妻[c]的后来的那人死了——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“开始恨她。”希伯来语完成式在这里可按法律事件的先后译出；正文保留“恨她”的基本意思。
    reason: lexical_alternative
  - marker: b
    text: 直译“割断的文书”，指正式解除婚姻关系的书面文书。
    reason: lexical_alternative
  - marker: c
    text: 原文是“娶她归自己为妻”，即娶了她。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׂנֵאָהּ
  choice: 若恨她
  rationale: שׂנא 的基本义是“恨”，不弱化为“不喜欢”。这里承接申命记24:1的条件式法律句法，因此用“若”使汉语长句的条件关系清楚；也可理解为后来对她产生厌恶。
- source_word: הָאִישׁ הָאַחֲרוֹן
  choice: 后来那人
  rationale: אַחֲרוֹן 是“后来的、后一个”，与上下文中的先前丈夫相对；保留原文“人”的措辞，不直接改成“第二任丈夫”。
- source_word: וְכָתַב לָהּ סֵפֶר כְּרִיתֻת
  choice: 给她写了休书
  rationale: סֵפֶר כְּרִיתֻת 是解除婚姻关系的正式文书。“休书”是现代汉语仍可理解的固定表达，并保留法律文书性质。
- source_word: וְנָתַן בְּיָדָהּ
  choice: 交在她手中
  rationale: 具体保留原文的程序性动作和“手中”这一空间表达，汉语亦自然。
- source_word: וְשִׁלְּחָהּ מִבֵּיתוֹ
  choice: 打发她离开自己的家
  rationale: שׁלח 在离婚语境中指遣走；译文明确保留 מִבֵּיתוֹ“从他的家中”的含义。
- source_word: אוֹ כִי יָמוּת
  choice: 或者……死了
  rationale: אוֹ 引出法律案例中的另一种可能情况；汉语用“或者”自然连接替代条件。
- source_word: אֲשֶׁר לְקָחָהּ לוֹ לְאִשָּׁה
  choice: 娶她为妻的
  rationale: לקח + לְאִשָּׁה 是娶妻的常用希伯来语表达。“娶她为妻”既准确又自然，无需生硬直译“取她归自己”。
