  text: הָשֵׁב֩ תָּשִׁ֨יב ל֤/וֹ אֶֽת הַ/עֲבוֹט֙ כְּ/בֹ֣א הַ/שֶּׁ֔מֶשׁ וְ/שָׁכַ֥ב בְּ/שַׂלְמָת֖/וֹ וּ/בֵֽרֲכֶ֑/ךָּ וּ/לְ/ךָ֙ תִּהְיֶ֣ה צְדָקָ֔ה לִ/פְנֵ֖י יְהוָ֥ה אֱלֹהֶֽי/ךָ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/013.yaml
  text: You must surely return the pledge to him at sunset[a], so that he may lie down in his cloak and bless you[b]; and it will be righteousness for you before Yahweh your God.
translation:
  language: zh_hans
  text: 日落时，你务必把抵押物[a]还给他，好让他裹着自己的外衣躺下，并祝福你；这在雅威你的上帝面前必成为你的义[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“担保物”，即为借款而收取作担保的物品。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“必算为你的义”或“必算作你的义行”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הָשֵׁב תָּשִׁיב
  choice: 务必要……还给
  rationale: 希伯来语以同词根的不定式绝对形加强限定动词，表达强烈而明确的命令；“务必要”在现代汉语中自然保留这种强调。
- source_word: הַעֲבוֹט
  choice: 抵押物
  rationale: 该词指为债务而收取的担保物。“抵押物”准确、通俗，并符合本段借贷法规的语境。
- source_word: כְּבֹא הַשֶּׁמֶשׁ
  choice: 日落时
  rationale: 字面近于“太阳来到时”，是表示太阳落下的惯用说法；译作“日落时”清楚自然。
- source_word: וְשָׁכַב
  choice: 好让他……躺下
  rationale: 形式上是连接词加完成式动词，但在语境中承接归还衣物的目的或结果；“好让”保留这一关系，同时不把“躺下”扩大解释为“睡着”。
- source_word: בְּשַׂלְמָתוֹ
  choice: 披着自己的外衣
  rationale: שַׂלְמָה 指可用作夜间遮盖的外衣；“披着自己的外衣”既说明实际用途，也保留衣物意象。
- source_word: וּבֵרֲכֶךָּ
  choice: 并祝福你
  rationale: 动词 ברך 的第二人称单数宾语后缀表明，是收回抵押物的人为债主祝福；并列结构简洁地保留原文。
- source_word: וּלְךָ תִּהְיֶה צְדָקָה
  choice: 必成为你的义
  rationale: צְדָקָה 在此表示在上帝面前被视为正直、合宜之事。“成为你的义”贴近原文，并以脚注保留“算为义”与“义行”等可能理解，避免在正文中替读者定夺。
- source_word: לִפְנֵי יְהוָה אֱלֹהֶיךָ
  choice: 在雅威你的上帝面前
  rationale: לִפְנֵי 表示“在……面前／临在中”；此译保留关系性表达，并将专名 יְהוָה 音译为“雅威”。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。正文采用现代汉语中对 Yahweh 的常见音译“雅威”，明确保留专名性质，不以称号替代。
- issue: צְדָקָה 在本节中的含义
  choice: 必成为你的义
  alternative: 必算你为义；必算作你的义行
  rationale: 原文可指这行为在上帝面前成为此人的“义”，也可理解为被认可的正直行为。正文保持简练和张力，脚注列出较解释性的译法，不引入后期神学体系。
translation_notes:
  register: 采用现代、庄重而易懂的法律劝诫语体。“务必要”传达原文命令的强调；“披着自己的外衣躺下”保留具体生活场景；结句刻意保留“义”的语义张力，并用脚注说明可能译法。
