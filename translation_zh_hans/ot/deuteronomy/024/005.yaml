  terminology: “娶了新妻”“随军服役”“任何事务”“免受差役”“使……欢喜”均适合现代庄重的律法语体。以“事务”对应原文宽泛的“任何事”，避免把范围限于差役或军务；“差役”在后句表示前文所排除的职责负担。
