base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/005.yaml
  text: When a man takes a new wife[a], he shall not go out with the army, nor shall any duty be imposed on him. He shall be free for his household for one year[d][c][b], and he shall make his wife whom he has taken rejoice.
translation:
  language: zh_hans
  text: 人若娶了新妻，不可随军服役[a]，也不可把任何事务加在他身上[b]。他要有一年为自己的家免受差役[c]，使他所娶的妻子欢喜[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不可出去打仗。”希伯来语直译为“不可随军出去”，所指可能包括较广泛的军役，不只是在战场上直接作战。
    reason: lexical_alternative
  - marker: b
    text: 或译：“也不可把任何义务加在他身上。”原文所说的范围比军务更广。
    reason: alternative_reading
  - marker: c
    text: 或译：“他要免役，在家一年。”原文既可着重他为家庭而不受公务牵累，也可着重他留在家中。
    reason: lexical_alternative
  - marker: d
    text: 或译：“使他所娶的妻子快乐。”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 若
  rationale: 这里引出律法案例；“若”符合现代汉语法例表达，也保留条件句的形式。
- source_word: יִקַּח אִישׁ אִשָּׁה חֲדָשָׁה
  choice: 人若新娶妻
  rationale: לָקַח 与 אִשָּׁה 连用是“娶妻”的惯用语；“新娶妻”自然表达新婚，而非把 חֲדָשָׁה 误解为与“旧妻”相对。
- source_word: לֹא יֵצֵא בַּצָּבָא
  choice: 不可随军出征
  rationale: 既保留“随军出去”的意象，也清楚表达军事动员；צָבָא 可指军队或军役，不限于直接作战。
- source_word: וְלֹא יַעֲבֹר עָלָיו לְכָל דָּבָר
  choice: 也不可把任何差事派给他
  rationale: 该表达表示不得将任何事务或义务加在他身上；“任何差事”保留其不限于军务的宽泛含义。
- source_word: נָקִי יִהְיֶה לְבֵיתוֹ שָׁנָה אֶחָת
  choice: 他要免除差役，专顾自己的家一年
  rationale: נָקִי 表示不受义务牵累或获得豁免；לְבֵיתוֹ 指向家庭生活。“专顾自己的家”以自然汉语传达这种豁免的家庭取向，但不把“家”局限为房屋。
- source_word: וְשִׂמַּח אֶת אִשְׁתּוֹ
  choice: 使……妻子快乐
  rationale: שׂמח 的使役形明确表示“使……快乐”，故不译成仅指夫妻共同快乐。
- source_word: אֲשֶׁר לָקָח
  choice: 他所娶的
  rationale: 按汉语婚姻用语译作“所娶的”，并与开头“娶妻”形成词语呼应。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而通顺的律法语体。“不可”“要”清楚表达规范性要求；避免生硬直译“为他的家自由”，以“免除差役，专顾自己的家”兼顾法律豁免与家庭目的。所有可能影响范围或语义重心的译法均在脚注中保留。
