  terminology: “利未祭司”是 הַכֹּהֲנִים הַלְוִיִּם 的自然、准确译法。将正文术语改为“皮肤病症”，并保留脚注说明传统“麻风病”及其并非现代汉森病的事实，可避免术语误导而不抹去传统译法。
