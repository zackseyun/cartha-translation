  source_fidelity: 原文的 נֶגַע הַצָּרַעַת 指与皮肤相关的病患／异常情形；正文“麻风病患处”既易将 צָרַעַת 误等同于现代麻风病（汉森病），又把 נֶגַע 过度具体化为身体上的“患处”。改作“皮肤病症”较符合本节语境及英文审校记录的广义处理。其余部分准确保留了警诫、祭司的指示、以及“我怎样吩咐他们，你们就怎样……”的对应关系。
