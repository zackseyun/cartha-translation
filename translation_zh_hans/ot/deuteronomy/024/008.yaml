base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/008.yaml
  text: Be careful in the case of an outbreak of skin disease[a], to observe very carefully and to do according to all that the Levitical priests instruct you; as I have commanded them, so you shall be careful to do.
translation:
  language: zh_hans
  text: “对于皮肤病症[a]，你们要格外谨慎，仔细遵守并实行利未祭司所指示你们的一切；我怎样吩咐他们，你们就要怎样谨慎遵行。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 传统译作“麻风病”。这里的希伯来语所指范围较广，指《妥拉》所规定的多种皮肤异常，并非专指现代医学所说的汉森病。
    reason: 说明传统译法与原文广义礼仪术语之间的差异，避免将其等同于现代特定疾病。
lexical_decisions:
- source_word: הִשָּׁמֶר
  choice: 你要谨慎
  rationale: 该词是 שׁמר 的尼斐尔命令式，在这里表达警戒和劝诫；“你要谨慎”自然地保留了命令语气。
- source_word: בְּנֶגַע הַצָּרַעַת
  choice: 遇到麻风病患处
  rationale: נֶגַע 指患处、病斑或灾病现象；צָרַעַת 是《妥拉》中的广义礼仪分类，不宜等同于现代汉森病。“麻风病”保留读者熟悉的经文术语，并用脚注限定其含义；“患处”体现 נֶגַע。
- source_word: לִשְׁמֹר מְאֹד וְלַעֲשׂוֹת
  choice: 务必留心遵行
  rationale: מְאֹד 加强谨慎留意的程度；汉语“务必留心遵行”既表达强烈要求，也把留意与实行紧密相连，避免生硬重复。
- source_word: כְּכֹל אֲשֶׁר יוֹרוּ אֶתְכֶם
  choice: 指示你们的一切
  rationale: ירה 的使役形在祭司律法指导的语境中意为教导、指示；“指示”兼顾权威性的教导和具体处置。
- source_word: הַכֹּהֲנִים הַלְוִיִּם
  choice: 利未祭司
  rationale: 这是《申命记》中对属于利未支派之祭司的惯用称呼；“利未祭司”简洁自然，不把它误解成两个并列群体。
- source_word: כַּאֲשֶׁר צִוִּיתִם תִּשְׁמְרוּ לַעֲשׂוֹת
  choice: 我怎样吩咐了他们，你们就要怎样谨慎遵行
  rationale: 保留“怎样……就怎样……”的对应结构，也明确前一个复数代词指祭司、后一个复数主语指以色列人；末尾再次译出 שׁמר 与 עשׂה 的谨慎实行之意。
theological_decisions:
- issue: צָרַעַת 的译法
  choice: 正文作“麻风病”，脚注说明其范围更广
  alternative: 皮肤病
  rationale: צָרַעַת 在《妥拉》中不是现代医学所说的汉森病，而是一类可涉及皮肤等处的礼仪性异常。正文沿用现代中文圣经读者熟悉的术语，但脚注明确避免医学上的错误等同。
- issue: הַכֹּהֲנִים הַלְוִיִּם 所指群体
  choice: 利未祭司
  alternative: 祭司和利未人
  rationale: 句法上更自然地指属于利未支派的祭司，而非祭司与利未人两个并列群体；这是词汇句法判断，不加入宗派性祭司观。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“遇到……患处”表达具体案件情形；“务必留心遵行”传达 מְאֹד 的强调，并保持律法劝诫的力度。脚注标记 [a] 已置于正文对应词语之后。
