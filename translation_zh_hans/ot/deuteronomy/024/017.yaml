base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/017.yaml
  text: You shall not pervert the justice due to a sojourner or an orphan[a], nor take a widow’s garment as a pledge.
translation:
  language: zh_hans
  text: 不可屈枉寄居者[a]和孤儿应得的公正，也不可拿寡妇的衣服作抵押。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“外来居民”或“异乡人”。希伯来语指居住在以色列人中间、处于其社会和法律保护之下的非本地人。
    reason: lexical_alternative
lexical_decisions:
- source_word: תַטֶּה
  choice: 屈枉
  rationale: 该词是 נטה 的使役式，在司法语境中指使公正偏离正道；“屈枉”自然表达歪曲或损害司法公正。
- source_word: מִשְׁפַּט
  choice: 应得的公正
  rationale: מִשְׁפַּט 在此既可指公正，也可指依法应有的权利或裁断；“应得的公正”保留司法含义，并显明受保护者的正当诉求。
- source_word: גֵּר
  choice: 寄居者
  rationale: 该词指居住在以色列群体中的非本地人，而非短暂停留的旅客；“寄居者”较能保留其社会和法律身份。
- source_word: יָתוֹם
  choice: 孤儿
  rationale: 该词尤指失去父亲保护的孩子；“孤儿”是现代汉语中清楚、自然的对应表达。
- source_word: תַחֲבֹל
  choice: 拿……作抵押
  rationale: חבל 在此法律语境中指为债务取得物品作为担保；这一译法清楚表达抵押行为。
- source_word: בֶּגֶד
  choice: 衣服
  rationale: בֶּגֶד 是衣物的通称，原文未限定为外衣或斗篷；“衣服”避免过度具体化。
- source_word: אַלְמָנָה
  choice: 寡妇
  rationale: 直接对应原文，保留本节对社会弱势妇女的法律保护。
theological_decisions:
- issue: 受法律保护的社会身份 גֵּר 如何表达
  choice: 寄居者
  alternative: 外来居民；异乡人；外族人
  rationale: 经文所指是住在以色列社会中、受其法律秩序保护的非本地人。“寄居者”保留其居住和依附于当地社会的含义，也避免把该词泛化为所有外国人。
translation_notes:
  register: 采用现代、庄重而易懂的法律伦理表述。“屈枉……应得的公正”兼顾希伯来语司法搭配和自然汉语；“衣服”不擅自限定衣物种类。脚注标记置于其实际说明的“寄居者”之后。
