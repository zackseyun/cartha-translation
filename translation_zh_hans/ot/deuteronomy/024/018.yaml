  text: וְ/זָכַרְתָּ֗ כִּ֣י עֶ֤בֶד הָיִ֨יתָ֙ בְּ/מִצְרַ֔יִם וַֽ/יִּפְדְּ/ךָ֛ יְהוָ֥ה אֱלֹהֶ֖י/ךָ מִ/שָּׁ֑ם עַל כֵּ֞ן אָנֹכִ֤י מְצַוְּ/ךָ֙ לַ/עֲשׂ֔וֹת אֶת הַ/דָּבָ֖ר הַ/זֶּֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/018.yaml
  text: And remember that you were a slave in Egypt, and Yahweh your God redeemed you from there; therefore I am commanding you to do this.
translation:
  language: zh_hans
  text: 要记住，你在埃及曾是奴隶，耶和华你的上帝把你从那里救赎出来；因此，我吩咐你要这样做。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְזָכַרְתָּ
  choice: 要记住
  rationale: 该形式在此语境中具有劝令作用。现代汉语用“要记住”自然明确；不另译连接词，以免句首“并且”显得生硬。
- source_word: כִּי
  choice: （由宾语分句表达）
  rationale: 此处引出所要记住的内容。汉语可直接说“记住，你……”，无需机械译出“即/那”。
- source_word: עֶבֶד
  choice: 奴隶
  rationale: 这里强调以色列人在埃及受奴役的身份；“仆人”会弱化其受束缚的社会现实。
- source_word: בְּמִצְרַיִם
  choice: 在埃及
  rationale: 忠实对应原文，且无需增添“埃及地”。
- source_word: וַיִּפְדְּךָ
  choice: 把你……救赎出来
  rationale: פדה表示从奴役中赎出、解救。“救赎”保留其赎回含义及神学分量，“出来”则与“从那里”自然搭配。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经语境中对四字神名最通行、最易识别的音译，而不以称号替代专名。
- source_word: אֱלֹהֶיךָ
  choice: 你的上帝
  rationale: 直接表达第二人称单数所属关系；“上帝”是庄重而通行的现代标准汉语。
- source_word: מִשָּׁם
  choice: 从那里
  rationale: 自然回指埃及，并保留原文简洁的空间指向。
- source_word: עַל כֵּן
  choice: 因此
  rationale: 明确保留从蒙救赎的历史事实到遵行命令之间的伦理推论。
- source_word: אָנֹכִי מְצַוְּךָ
  choice: 我吩咐你
  rationale: 显式主语 אָנֹכִי 带有强调色彩；汉语以“我吩咐你”简洁自然地传达当下有效的命令，无需生硬表达进行体。
- source_word: לַעֲשׂוֹת
  choice: 要……做
  rationale: 在“吩咐你要这样做”中自然表达目的或命令内容。
- source_word: אֶת הַדָּבָר הַזֶּה
  choice: 这样做
  rationale: 该短语回指前文的具体条例。现代汉语“这样做”比“做这件事”更自然，同时不把它解释性地扩展为“遵守这条命令”。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用神的专名。中文译作“耶和华”既保留专名性质，又是普通现代读者最熟悉的形式；“雅威”较接近学术界常见的拟音，但普及度较低。
- issue: עֶבֶד 对以色列在埃及处境的描述
  choice: 奴隶
  alternative: 仆人
  rationale: 本节以曾受奴役的经历作为关怀弱势者的伦理根据。“奴隶”准确保留这种强制束缚，不以较温和的“仆人”淡化原意。
- issue: פדה 的救赎含义
  choice: 救赎出来
  alternative: 解救出来
  rationale: “救赎”保留从奴役中赎出的词义和本节的神学回响；“解救”更口语，却可能削弱 פדה 的赎回色彩。
translation_notes:
  register: 采用庄重、自然的现代标准汉语。句式保持简洁，并保留“曾受奴役—蒙上帝救赎—因此应当遵行”的逻辑链条；不补入原文没有的“今日”等成分。
