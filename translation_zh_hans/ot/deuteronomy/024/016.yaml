  yaml_path: translation/ot/deuteronomy/024/016.yaml
  text: Fathers shall not be put to death for sons[a], and sons shall not be put to death for fathers[b]; each man shall be put to death for his own sin.
translation:
  language: zh_hans
  text: 父亲不可因儿子而被处死；儿子也不可因父亲而被处死；各人应因自己的罪被处死。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יוּמְתוּ / יוּמָתוּ
  choice: 处死／被处死
  rationale: מות的使役被动式表示“使之死亡、被置于死地”，在本节法律语境中指司法处死，不只是一般意义上的死亡。“处死／被处死”既保留其使役、被动含义，也避免“执行死刑”所增加的现代法律术语色彩。
- source_word: אָבוֹת
  choice: 父亲
  rationale: 该词明确指“父亲”，与下文“儿子”形成对称；不泛化为“父母”。
- source_word: בָּנִים
  choice: 儿子
  rationale: 原文两处均为阳性复数“儿子”。虽然法律原则可具有更广适用范围，正文仍保留原文具体的亲属称谓。
- source_word: עַל
  choice: 因
  rationale: 此处表示处罚所依据的缘由，即“因为、由于某人的缘故”。现代汉语用“因”简洁而自然。
- source_word: אִישׁ
  choice: 各人
  rationale: אִישׁ在此具有逐一、分配性的意义。汉语“各人”自然表达每个个体分别承担责任，不必机械保留语法阳性。
- source_word: בְּחֶטְאוֹ
  choice: 因自己的罪
  rationale: 介词ב在司法语境中表示处罚的根据；第三人称单数所属后缀结合上下文译为“自己的”，凸显不得把罪责转嫁给父子亲属。
theological_decisions:
- issue: 死刑中的个人责任
  choice: 本节规定，不可因父子一方的罪而处死另一方，各人只因自己的罪被处死。
  alternative: 将本节扩展为关于罪的一切跨代后果的普遍陈述。
  rationale: 反复出现的מות使役被动式具体涉及“被处死”，直接语境是司法和死刑责任。译文体现个人担责原则，但不把经文明确范围无声扩大到罪的一切后果。
translation_notes:
  register: 采用现代、庄重而清楚的法律训令语体。“不可……也不可……”保留两句平行结构；末句用“各人只可……”明确与前两句的对照。“因儿子处死父亲”在汉语中表示因儿子的罪或缘故而处死父亲，不是处死动作的对象含混。
