  rationale: 修订统一保留原文三次“被处死”的被动使役表达，并维持父亲、儿子、各人的平行法律句式。“因儿子／因父亲”保留原文未明说“罪”的简洁表述；末句明确为各人按自己的罪受死刑，未将本节扩展为关于一切跨代后果的陈述。
