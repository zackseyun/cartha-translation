  naturalness: 建议统一为庄重、现代且清晰的法律训令句式：“父亲不可……被处死；儿子也不可……被处死；各人应……被处死。”这在现代标准汉语中自然，并保留原文的平行与重点。
  terminology: “父亲”“儿子”恰当保留אָבוֹת与בָּנִים的男性亲属称谓；“各人”自然体现אִישׁ的分配意义；“因自己的罪被处死”准确反映司法语境中的בְּחֶטְאוֹ及מות的使役被动义。无需加入会扩大经文范围的神学说明。
