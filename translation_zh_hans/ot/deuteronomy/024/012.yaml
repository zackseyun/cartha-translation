  text: And if he is a poor man[a], you shall not sleep with his pledge.
translation:
  language: zh_hans
  text: 若他是穷人，你不可扣留他的抵押物过夜。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“你不可带着他的抵押物躺下（睡觉）。”意思是不可把他为借款担保而交出的物品扣留过夜。
    reason: 说明希伯来文“躺下／睡觉”及“带着抵押物”的字面表达，并交代其在本法例中的含义。
lexical_decisions:
- source_word: וְאִם
  choice: 如果
  rationale: 承接上一节，引出进一步的条件情形；现代汉语中省略直译连接词“并且”更自然，条件关系仍然清楚。
- source_word: אִישׁ עָנִי הוּא
  choice: 他是穷人
  rationale: 保留希伯来文单数阳性所指的“他”，并将עָנִי按本法例中的经济处境译为“穷人”。
- source_word: לֹא תִשְׁכַּב
  choice: 不可……睡觉
  rationale: שׁכב本义是“躺下、睡觉”；这里指债权人不可在仍扣留穷人抵押物的情况下过夜。译文保留“睡觉”这一具体表达，同时补足汉语理解所需的语境。
- source_word: בַּעֲבֹטוֹ
  choice: 他的抵押物还留在你手中时
  rationale: עֲבוֹט指为债务提供担保的物品；介词短语在此表示债权人持有该物过夜。“抵押物”准确而通俗，“留在你手中”说明实际含义。
