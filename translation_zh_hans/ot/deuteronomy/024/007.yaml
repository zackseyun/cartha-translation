base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/007.yaml
  text: If a man is found kidnapping one of his brothers from the sons of Israel[a], and he enslaves him and sells him, then that kidnapper shall die[c][b]. So you shall purge the evil from your midst.
translation:
  language: zh_hans
  text: 若发现有人从以色列人中拐走一个弟兄，把他当作奴隶役使，又卖掉他，那拐人的必须处死。你要从你中间除掉这恶。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִמָּצֵא אִישׁ
  choice: 若发现有人
  rationale: 保留尼法勒式“被发现”的法律条件句功能；现代汉语用“若发现有人”比直译“若有一个人被发现”更自然。
- source_word: גֹּנֵב נֶפֶשׁ
  choice: 拐走
  rationale: 该短语字面为“偷取一个人/性命”，在本法律语境中指绑架人口；“拐走”清楚表达其行为，同时由后文役使和出售进一步限定。
- source_word: מֵאֶחָיו מִבְּנֵי יִשְׂרָאֵל
  choice: 自己的一个弟兄，就是一个以色列人
  rationale: 保留אָח的亲属式盟约语言，并用后面的“以色列人”说明这里所指的是同胞，不只限于亲生兄弟。
- source_word: וְהִתְעַמֶּר בּוֹ
  choice: 把他当作奴隶役使
  rationale: עמר的Hitpael在此表示把被拐者当作可支配的财物或奴隶加以利用；译文保留这种奴役和剥削意味，同时以脚注交代词义范围。
- source_word: וּמְכָרוֹ
  choice: 又卖掉他
  rationale: 直接表达מכר及其宾语后缀，并清楚保留贩卖人口这一犯罪环节。
- source_word: וּמֵת הַגַּנָּב הַהוּא
  choice: 那拐人的必须处死
  rationale: 死亡宣判在法律语境中自然译为“必须处死”；“拐人的”明确回指前述偷取人口者，而非普通窃贼。
- source_word: וּבִעַרְתָּ הָרָע מִקִּרְבֶּךָ
  choice: 你要从你中间除掉这恶
  rationale: 保留申命记反复出现的司法公式及“恶”的抽象表达，不擅自改成只指犯罪者。
theological_decisions:
- issue: 盟约群体中的亲属称谓
  choice: 正文保留“弟兄”，并以“就是一个以色列人”说明范围
  alternative: 同胞；以色列同胞
  rationale: 原文以亲属语言描述以色列群体成员之间的关系。保留“弟兄”可呈现其修辞和盟约意味，补充说明则避免误解为仅指亲生兄弟。
- issue: וְהִתְעַמֶּר בּוֹ的奴役与剥削意味
  choice: 把他当作奴隶役使
  alternative: 虐待他；利用他；把他当作财物处置
  rationale: 上下文紧接“卖掉他”，支持把该动词理解为将被拐者置于受支配、被奴役的地位；脚注保留该词可涵盖虐待或任意支配的词义张力。
- issue: 除掉“恶”还是“恶人”
  choice: 除掉这恶
  alternative: 除掉这恶人
  rationale: 原文使用带冠词的形容词/名词化表达הָרָע，可理解为“这恶”或“恶者”。正文不把它窄化为仅指犯罪者，从而保留申命记公式的广度。
translation_notes:
  register: 采用现代、庄重而清楚的法律语体。“若发现有人”呈现条件条款；“拐走”“役使”“卖掉”“必须处死”使罪行及刑罚层次明确。正文中的两个脚注标记[a]、[b]均已对应列出。
