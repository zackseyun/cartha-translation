    rationale: מֵאֶחָיו מִבְּנֵי יִשְׂרָאֵל将“弟兄”限定为以色列人中的同胞。将“从以色列人中”前置更自然，也避免“自己的弟兄”首先被理解为亲兄弟。
  - severity: low
