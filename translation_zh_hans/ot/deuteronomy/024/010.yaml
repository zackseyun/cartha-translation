  yaml_path: translation/ot/deuteronomy/024/010.yaml
  text: When you lend your neighbor anything[a], you shall not go into his house to take his pledge.
translation:
  language: zh_hans
  text: 你借给邻人任何东西时[a]，不可进他家拿取他的抵押物。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你若借给邻人任何东西”。
    reason: כִּי 在个案律法中既可按时间关系译为“……时”，也可按条件关系译为“若”。
lexical_decisions:
- source_word: כִּי
  choice: ……时
  rationale: 此处引出个案律法中的情形；译作“……时”自然表达其法律条件义，同时以脚注保留“若”的可能。
- source_word: תַשֶּׁה
  choice: 借给
  rationale: נשה 的使役形在这里指借出财物或给予信贷；“借给”是现代汉语中准确而自然的表达。
- source_word: בְרֵעֲךָ
  choice: 同胞
  rationale: רֵעַ 在此主要指共同体中的同伴；“同胞”比现代汉语中常指邻居住户的“邻舍”更贴合语境。
- source_word: מַשַּׁאת מְאוּמָה
  choice: 任何东西
  rationale: מַשַּׁאת 指贷款或债务，מְאוּמָה 表示任何事物；结合动词“借给”，译作“任何东西”既避免重复，又保留范围不限之意。
- source_word: לֹא תָבֹא אֶל בֵּיתוֹ
  choice: 不可进他家
  rationale: לֹא 加未完成式在本法律语境中表示禁令；“不可”符合简洁庄重的法规语体。
- source_word: לַעֲבֹט עֲבֹטוֹ
  choice: 拿取他的抵押物
  rationale: עבט 及其同根名词在此指拿取作为债务担保的物件；“抵押物”比单用“抵押”更清楚地指具体物品，而“拿取”不额外加入强行夺取之意。
theological_decisions: []
