  yaml_path: translation/ot/deuteronomy/024/022.yaml
  text: And remember that you were a slave in the land of Egypt[a]; therefore I am commanding you to do this thing.
translation:
  language: zh_hans
  text: 你要记住，你曾在埃及地作过奴隶；因此，我吩咐你去做这件事[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “这件事”也可译作“这项规定”或“这条命令”，指前文所说要为寄居者、孤儿和寡妇留下收成的规定。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזָכַרְתָּ
  choice: 你要记住
  rationale: 该形式在这段律法语境中带有命令、劝诫的语气；“要记住”既自然，也保留命令力度。句首连接关系由上下文和分号衔接体现。
- source_word: כִּי
  choice: （引出“记住”的内容，不另译）
  rationale: 这里引出所要记住的内容；现代汉语可直接说“记住，你曾……”，无需硬译为“因为”或“即”。
- source_word: עֶבֶד
  choice: 奴隶
  rationale: 在以色列身处埃及的语境中，此词指受奴役的身份，并非一般仆役。
- source_word: הָיִיתָ
  choice: 你曾……作过
  rationale: 表达过去的身份状态；“曾……作过”在现代汉语中自然，并明确其历史回顾意味。
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: 在埃及地
  rationale: 保留希伯来文“埃及之地”的具体表达和庄重语感。
- source_word: עַל כֵּן
  choice: 所以
  rationale: 清楚表达从昔日受奴役的经历到当前命令之间的推论关系。
- source_word: אָנֹכִי מְצַוְּךָ
  choice: 我吩咐你
  rationale: 独立代词使“我”略带强调；汉语主语明说即可自然体现。分词表达当前发出的权威命令，“吩咐”符合庄重而易懂的律法语体。
- source_word: לַעֲשׂוֹת אֶת־הַדָּבָר הַזֶּה
  choice: 照这件事去做
  rationale: עשה取“做、实行”之义，דבר保持较宽泛的“事”；“照……去做”比生硬的“做这件事”更自然，同时不把它限定为某一专门术语。
theological_decisions:
- issue: 以色列在埃及的身份
  choice: 译为“奴隶”
  alternative: “仆人”
  rationale: 上下文强调受压迫和被奴役的历史经验，以此要求以色列顾念弱势者；“奴隶”准确保留这一伦理和神学关联。
- issue: “这件事”的指向范围
  choice: 保留宽泛表达，并用脚注说明其回指前文
  alternative: 正文直接译为“这条命令”
  rationale: 希伯来文דבר可指事情、事项或话语；保留“这件事”避免把词义不必要地收窄，同时脚注帮助读者明白它指前文为弱势者留下收成的规定。
translation_notes:
  register: 采用现代、庄重且易懂的律法语体。“你要记住”保留劝诫式命令，“埃及地”保留原文的正式表达；全句以分号呈现记念过去与履行命令之间的逻辑联系。脚注标记置于其实际说明的“这件事”之后。
