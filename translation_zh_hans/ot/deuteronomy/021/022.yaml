base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/022.yaml
  text: And if in a man there is a sin deserving death[a], and he is put to death, and you hang him on a tree[b],
translation:
  language: zh_hans
  text: 如果一个人犯了当受死刑的罪[a]，他被处死后，你就把他挂在树上[b]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“犯了该受死刑的罪”，或“被判处死刑”。希伯来语字面近于“有死刑判决的罪”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“挂在木柱上”。希伯来语直译为“挂在树上”；“树”一词也可指木头或木制物。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כִי
  choice: 如果
  rationale: 引出律法案例中的条件句；现代汉语不必另译句首连接词，表达自然且不损失条件关系。
- source_word: יִהְיֶה בְ/אִישׁ
  choice: 一个人犯了
  rationale: 希伯来语直译近于“在一个人里面有”；汉语用“一个人犯了”自然表达其存在状态和法律案例语气，并保留单数男性法律主体的一般指称。
- source_word: חֵטְא
  choice: 罪
  rationale: 兼具道德与法律含义，不将词义缩窄为纯粹世俗的“罪行”或“犯罪”。
- source_word: מִשְׁפַּט מָוֶת
  choice: 该死的
  rationale: 自然表达此罪应受死刑；脚注保留“死的判决／被判死刑”等可能理解，以反映原文结构的含混。
- source_word: וְ/הוּמָת
  choice: 被处死后
  rationale: מות的使役被动式表示被置于死地；“被处死”符合司法语境，“后”清楚表达随后悬挂尸体的通常语境而不暗示悬挂本身是处决方式。
- source_word: וְ/תָלִיתָ אֹת/וֹ
  choice: 你把他挂
  rationale: 准确保留第二人称单数命令性法律表述及男性宾语。
- source_word: עַל עֵץ
  choice: 在树上
  rationale: עֵץ可指树或木材；正文取最直接的“树”，既避免擅自限定为某种刑具，也保留后续经文互文用语。
theological_decisions:
- issue: 法律案例主体的性别表达
  choice: 一个人……他
  alternative: 有人……此人
  rationale: 原文אִישׁ及男性单数代词明确使用阳性形式；中文保留“他”，同时“一人”在法律案例中可作一般个体表达，不另行强化性别。
- issue: מִשְׁפַּט מָוֶת的关系
  choice: 该死的罪
  alternative: 被判死刑／当受死刑的罪
  rationale: 原文短语字面结构近于“死的判决”，可侧重罪应受死刑，也可侧重人已在死刑判决之下。正文采用自然且传统的资格性表达，脚注明确其他可能译法，不消除原文张力。
- issue: 悬挂与处死的次序
  choice: 被处死后，你把他挂在树上
  alternative: 他被处死，你又把他挂在树上
  rationale: 希伯来语连续表述先处死、后悬挂；明确“后”符合本段陈列尸体的法律背景，但不进一步规定具体执行方式。
- issue: עַל עֵץ的具体所指
  choice: 在树上
  alternative: 在木柱上
  rationale: 保留原词“树／木”的宽度及其经文互文意义，不将其具体化为未经文本明确说明的刑具。
translation_notes:
  register: 采用现代、庄重而易懂的律法案例语体。句式简洁，保留条件结构、司法被动语态和第二人称指令。正文以逗号结尾，以配合本节在下一节继续的完整规定。
