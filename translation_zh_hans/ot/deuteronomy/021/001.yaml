  text: כִּי יִמָּצֵ֣א חָלָ֗ל בָּ/אֲדָמָה֙ אֲשֶׁר֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ נֹתֵ֤ן לְ/ךָ֙ לְ/רִשְׁתָּ֔/הּ נֹפֵ֖ל בַּ/שָּׂדֶ֑ה לֹ֥א נוֹדַ֖ע מִ֥י הִכָּֽה/וּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/001.yaml
  text: If a slain man is found in the land that Yahweh your God is giving you to possess[a], lying in the open field, and it is not known who struck him,
translation:
  language: zh_hans
  text: 若在雅威—你的上帝赐给你作为产业的土地上，发现一个倒在田野里、被杀的人[a]，却不知道是谁击打了他，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文为阳性单数，可直译作“一个被杀的男子”；这里的律例原则涉及身份不明的凶杀案件，一般也可理解为“一个被杀的人”。
    reason: 说明原文的语法性别，并保留其可能具有一般法律适用范围的张力。
lexical_decisions:
- source_word: כִּי
  choice: 若
  rationale: 这里引出个案律法的条件；“若”自然体现假设条件，同时不排除事情实际发生时的适用性。
- source_word: יִמָּצֵא
  choice: 发现
  rationale: 希伯来语为尼法勒式，含“被发现”之意；汉语无主句用“发现”即可自然表达被动意义。
- source_word: חָלָל
  choice: 一个被杀的人
  rationale: 该词指遭暴力杀害的人，不只是一般尸体；此译也保留原文阳性单数的人称表达。
- source_word: בָּאֲדָמָה
  choice: 在……土地上
  rationale: 后面的关系从句表明此处指以色列将要承受的地域，而非泥土本身。
- source_word: אֲשֶׁר יְהוָה אֱלֹהֶיךָ נֹתֵן לְךָ לְרִשְׁתָּהּ
  choice: 雅威—你的上帝赐给你作产业的
  rationale: 既保留赐地和承受产业的盟约用语，也采用现代汉语自然句式。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来语四字神名本身音译，保留其作为上帝圣约之名的性质。
- source_word: נֹפֵל
  choice: 倒在
  rationale: 原义为“倒下、倒卧”；在此描述被杀者尸身所在的状态，“倒在”比单纯“躺在”更贴近原词。
- source_word: בַּשָּׂדֶה
  choice: 田野里
  rationale: 自然表达城镇之外田间或野外的地点，不额外限定土地是否耕种。
- source_word: לֹא נוֹדַע
  choice: 不知道
  rationale: 以汉语无主结构自然传达希伯来语无人知晓的被动含义。
- source_word: מִי הִכָּהוּ
  choice: 是谁击杀了他
  rationale: “击杀”保留 נכה 的击打语义，并结合 חָלָל 已确立的凶杀语境，清楚表明击打导致死亡。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”按其较通行的学术拟音呈现，不以称号替代专名。
- issue: חָלָל 的性别表达
  choice: 一个被杀的人
  alternative: 一个被杀的男子
  rationale: 希伯来语形式为阳性单数，但该律例的原则可泛指身份不明的凶杀受害者；正文用现代汉语可兼具个体性与一般适用性的“人”，脚注说明语法形式，避免无根据地把适用范围限于男性。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。句式保留个案律法的条件结构，以逗号结尾，衔接后续经文；“雅威—你的上帝”用破折号标示同位关系。
