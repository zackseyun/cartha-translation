revisions:
- from: 若在雅威—你的上帝赐给你作产业的土地上，发现一个被杀的人[a]倒在田野里，却不知道是谁击杀了他，
  to: 若在雅威—你的上帝赐给你作为产业的土地上，发现一个倒在田野里、被杀的人[a]，却不知道是谁击打了他，
  rationale: 修订仅改善现代汉语的修饰关系，并将“是谁击杀了他”改为“是谁击打了他”，以保留原文中“遭杀害者”与“谁击打他”的词汇区分。条件句和结尾逗号均保留，以衔接后续经文。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T04:57:36Z'
