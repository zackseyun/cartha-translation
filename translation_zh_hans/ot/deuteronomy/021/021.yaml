base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/021.yaml
  text: Then all the men of his city shall stone him with stones[a], and he shall die. So you shall purge the evil from your midst, and all Israel shall hear and fear.
translation:
  language: zh_hans
  text: 他所在城里的所有男子都要用石头打死他。这样，你要从你中间除去那恶；全以色列人都必听见而惧怕。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּרְגָמֻהוּ
  choice: 用石头打他
  rationale: רגם在司法语境中指以石头击打处死；此译保留具体动作，也符合现代汉语表达。
- source_word: כָּל אַנְשֵׁי עִירוֹ
  choice: 他本城所有的男子
  rationale: אַנְשֵׁי明确为阳性复数“男子”；“本城”自然表达其所属城邑，并不泛化为全体居民。
- source_word: בָאֲבָנִים
  choice: 用石头
  rationale: 保留希伯来文对执行手段的具体表述。
- source_word: וָמֵת
  choice: 使他死
  rationale: 在连续法律命令中表达石击导致死亡的结果；不将其过度解释为独立命令。
- source_word: וּבִעַרְתָּ
  choice: 清除掉
  rationale: בער在申命记的法律套语中意为从群体中除去，而非按字面理解为焚烧；“清除掉”自然且保留肃穆的司法意味。
- source_word: הָרָע
  choice: 那恶
  rationale: 保留带定冠词的单数抽象道德范畴，并与申命记反复出现的公式保持一致。
- source_word: מִקִּרְבֶּךָ
  choice: 从你中间
  rationale: 贴近盟约群体套语的形式；第二人称单数也依原文保留。
- source_word: יִשְׁמְעוּ
  choice: 听见了
  rationale: 直接翻译“听见”，不擅自补入“这事”；汉语中由上下文自然领会其宾语。
- source_word: וְיִרָאוּ
  choice: 就会惧怕
  rationale: 表达司法惩戒所产生的畏惧和警戒作用，未缩窄为单纯惊恐。
theological_decisions:
- issue: 法律语境中的性别化城邑称谓
  choice: 他本城所有的男子
  alternative: 他本城所有的人／居民
  rationale: 原文אַנְשֵׁי在语法和语义上均为阳性“男子”；保留这一限定，不据此推导超出经文的性别角色主张。
- issue: 申命记清除恶的固定套语
  choice: 把那恶从你中间清除掉
  alternative: 把恶人从你们中间除掉／把恶事从你们中间除去
  rationale: 原文הָרָע可指“那恶”，在上下文中也可关联实施恶事者；译文保留抽象表达及其张力，不将其单一化为“恶人”或“恶事”。
- issue: וָמֵת的结果或命令色彩
  choice: 使他死
  alternative: 他就死了／他必须死
  rationale: 该形式在法律序列中可表达结果并带规范性；“使他死”连接石击与死亡，避免把语法明确限定为单独死刑宣告。
translation_notes:
  register: 采用现代、庄重而易懂的法律叙述语体。“用石头打他，使他死”比“用石头打死他”更贴近原文两个连续分句；“那恶”有意保留申命记公式化、抽象的道德法律用语。
