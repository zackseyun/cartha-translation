  yaml_path: translation/ot/deuteronomy/021/019.yaml
  text: then his father and his mother shall seize him and bring him out to the elders of his city and to the gate of his place[a][b].
translation:
  language: zh_hans
  text: 他父亲和母亲要抓住他，把他带出来，带到他所在城的长老那里和当地的城门口[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 城门口是公开处理事务的地方，当地长老通常在那里审理案件。
    reason: cultural_note
  - marker: b
    text: “当地的城门口”或译“他所在城镇的城门口”。希伯来文直译为“他所在之处的门口”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְתָפְשׂוּ בוֹ
  choice: 抓住他
  rationale: תפשׂ与介词ב连用，表示实际抓住并加以控制；“抓住”自然地保留了这一动作的力度。
- source_word: אָבִיו וְאִמּוֹ
  choice: 他父母
  rationale: 原文明确指父亲和母亲共同采取行动；现代汉语以“他父母”表达自然简洁，又不损失双方参与之意。
- source_word: וְהוֹצִיאוּ אֹתוֹ
  choice: 把他带到
  rationale: יצא的使役形表示使其出去或带出去；结合后接的目的地，汉语译作“把他带到”最为顺畅，并保留从家中带往公共审理地点的动作。
- source_word: אֶל זִקְנֵי עִירוֹ
  choice: 到本城的长老那里
  rationale: “长老”保留以色列地方领袖及审理者的制度称谓；“本城”自然表达其所属之城。
- source_word: וְאֶל שַׁעַר מְקֹמוֹ
  choice: 带到当地的城门口
  rationale: שׁער是城门，在法律语境中也是公共审理场所；מקום字面为“地方、所在之处”，“当地”既保留其措辞与“城”不完全重复的特点，也符合现代汉语。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的法律叙事语体。“抓住”体现强制性，“长老”保留古代以色列地方治理称谓；正文使用“当地的城门口”，以自然汉语传达字面“他所在之处的门”，并以脚注保存直译及替代译法。
