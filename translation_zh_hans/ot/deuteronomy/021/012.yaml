  yaml_path: translation/ot/deuteronomy/021/012.yaml
  text: then you shall bring her into your house[a], and she shall shave her head and trim her nails.
translation:
  language: zh_hans
  text: 然后，你要把她带进你的家中；她要剃头，修剪指甲[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“让指甲留长。”希伯来文直译为“她要做她的指甲”，这个表达的确切含义存在争议。
    reason: alternative_reading
lexical_decisions:
- source_word: וַהֲבֵאתָהּ
  choice: 然后，你要把她带进
  rationale: הביא是בוא的使役形，基本义为“带来、带进”；句首连接形式承接上一条法律规定，译作“然后”体现行动次序。“要”保留法律条文的规定语气。
- source_word: אֶל תּוֹךְ בֵּיתֶךָ
  choice: 家中
  rationale: תּוֹךְ指内部，בֵּיתֶךָ意为“你的家/房屋”。“带进家中”既表达进入内部，也比“带到你房屋的中间”更符合现代汉语。
- source_word: וְגִלְּחָה אֶת רֹאשָׁהּ
  choice: 她要剃头
  rationale: גלח意为“剃”；以“头”为宾语时，现代汉语自然表达为“剃头”，不额外加入“剃光”等原文未明确表达的程度。
- source_word: וְעָשְׂתָה אֶת צִפָּרְנֶיהָ
  choice: 修剪指甲
  rationale: 原文直译为“处理/做她的指甲”，是含义有争议的表达。正文采用语境中自然且常见的理解“修剪指甲”，同时以脚注保留“留长指甲”的另一种解释。
theological_decisions:
- issue: וְעָשְׂתָה אֶת צִפָּרְנֶיהָ的语义歧义
  choice: 正文译为“修剪指甲”
  alternative: “留长指甲”
  rationale: 希伯来文只说她要“做/处理”自己的指甲，并未明确说明剪短还是留长。正文需要采用可读的表达，但脚注保留主要异解，以免把原文真实存在的歧义消除。
translation_notes:
  register: 采用现代、庄重而易懂的法律叙述语体。“然后……要……”体现条文的先后次序和规定语气；分号清楚标示动作主体由“你”转为“她”。
