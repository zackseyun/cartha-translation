base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/010.yaml
  text: When you go out to war against your enemies[a], and Yahweh your God gives them into your hand, and you take them captive[b],
translation:
  language: zh_hans
  text: 你出去与仇敌交战时，耶和华你的上帝把他们交在你手中[a]，并掳取俘虏[b]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“把他（或它）交在你手中”；单数宾语很可能把敌军视为一个整体，因此正文译作“他们”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“从他们那里掳取俘虏。”原文用同根的动词和名词表达掳取俘虏。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ……时
  rationale: 这里引出条例所设定的情境；用“……时”符合希伯来律例的表达，也比单纯的“如果”更自然。
- source_word: תֵצֵא לַמִּלְחָמָה עַל אֹיְבֶיךָ
  choice: 你出去与仇敌交战
  rationale: 保留“出去”的具体动作，并把 עַל 在敌对语境中的含义自然表达为“与……交战”。
- source_word: וּנְתָנוֹ
  choice: 若把他们交在
  rationale: נתן 基本义为“给、交”；第三人称单数宾语后缀在此集体指前面的复数“仇敌”，故正文按汉语习惯用“他们”。“若”使本分句在长句中的条件关系清楚，但不改变开头 כִּי 的情境功能。
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: 耶和华你的上帝
  rationale: “耶和华”采用现代中文中对四字神名的通行专名形式；“你的上帝”准确对应带第二人称单数后缀的 אֱלֹהִים。
- source_word: בְּיָדֶךָ
  choice: 在你手中
  rationale: 保留希伯来语“交在手中”的形象；现代汉语可以自然理解为交由某人掌控。
- source_word: וְשָׁבִיתָ שִׁבְיוֹ
  choice: 你也掳了他们中的俘虏
  rationale: 原文使用同根动词和名词，含义是从敌方掳取俘虏。此译法既传达同根结构的语义，又避免误解为把所有敌人都掳走。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用以色列上帝的专名，而非“主”这一称号。正文采用现代简体中文圣经传统中最通行、普通读者最熟悉的专名“耶和华”；“雅威”是较接近学术重构读音的另一译法。
- issue: 敌方宾语的数
  choice: 他们
  alternative: 他／它
  rationale: וּנְתָנוֹ 和 שִׁבְיוֹ 的后缀在形态上是阳性单数，但其所指很可能是作为整体看待的敌军；正文用复数“他们”，脚注保留原文形式上的张力。
translation_notes:
  register: 采用现代、庄重而易懂的律例语体。保留“出去”和“交在你手中”等原文意象；经文以逗号结尾，因为本节是延续到后文的条件句。所有脚注标记均已置于正文对应位置。
