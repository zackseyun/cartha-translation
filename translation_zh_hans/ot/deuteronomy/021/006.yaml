base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/006.yaml
  text: And all the elders of that city nearest to the slain man shall wash their hands over the heifer whose neck was broken in the wadi[a][b].
translation:
  language: zh_hans
  text: 那城中离被杀者[a]最近的众长老，都要在那溪谷[b]中被折断颈项的母牛犊上方洗手。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“被杀之人的尸体”。希伯来语可指被杀的人，也可侧重指被杀者的尸体。
    reason: lexical_alternative
  - marker: b
    text: 或译“谷中”或“河床中”。希伯来语所指的是有水道的谷地、沟谷或季节性溪流河床。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹל
  choice: 所有……都
  rationale: 希伯来语连词承接前文的礼仪程序；כֹל涵盖该城全体相关长老。汉语用“所有……都”自然表达全称与承接关系。
- source_word: זִקְנֵי הָעִיר הַהִוא
  choice: 那城……的长老
  rationale: זִקְנֵי指城中的长老或民政领袖；“那城”保留指示词的特指意义。
- source_word: הַקְּרֹבִים אֶל הֶחָלָל
  choice: 离被杀者最近的
  rationale: קָרוֹב与אֶל表示空间上的接近；חָלָל是遭杀害的人，也可着眼于其尸体。“被杀者”既保留凶杀语境，也不将其仅泛化为普通死者。
- source_word: יִרְחֲצוּ אֶת יְדֵיהֶם
  choice: 都要……洗手
  rationale: 未完成式在本法律程序中具有规定、指令的语气；“要”以自然现代汉语表达其规范性。
- source_word: עַל
  choice: 在……上方
  rationale: 此处表示长老洗手时相对于母牛犊的位置；“上方”比“在……上”更能避免误解为双手直接放在牛身上。
- source_word: הָעֶגְלָה
  choice: 母牛犊
  rationale: עֶגְלָה指幼小的雌牛；“母牛犊”准确而通俗。
- source_word: הָעֲרוּפָה
  choice: 被折断颈项的
  rationale: 该词源自ערף，在此礼仪中表示折断牛的颈项，并非通常的宰杀方式；此译法避免误作砍头。
- source_word: בַנָּחַל
  choice: 在那溪谷中
  rationale: נַחַל可指与水道相连的谷地、季节性溪流河床或沟谷。“溪谷”兼顾地形与水道意象，并与前节的礼仪地点相符。
