base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/015.yaml
  text: If a man has two wives[a], one loved and the other unloved, and both the loved and the unloved have borne him sons, and the firstborn son belongs to the unloved wife,
translation:
  language: zh_hans
  text: 如果一个人有两个妻子，一个是他所爱的，另一个是他不爱的；两个妻子都给他生了儿子，而长子是那不被爱的妻子所生的，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: 如果
  rationale: 这里引出律例中的假设情形；“如果”符合现代汉语条件句和希伯来语案例法的表达作用。
- source_word: תִהְיֶיןָ לְאִישׁ
  choice: 一个人有
  rationale: 原文直译近于“有两个妻子归一个人”，用“一个人有”自然地保留其所属关系。
- source_word: שְׁתֵּי נָשִׁים
  choice: 两个妻子
  rationale: 继承律的婚姻语境表明 נָשִׁים 在此指妻子，而非泛指女人。
- source_word: הָאַחַת אֲהוּבָה
  choice: 一个受宠爱
  rationale: 既保留 אֲהוּבָה“被爱”的被动含义，也用现代汉语自然表达家庭中的偏爱。
- source_word: וְהָאַחַת שְׂנוּאָה
  choice: 另一个不受宠爱
  rationale: שְׂנוּאָה 可有“被恨”的强义，但在此与受宠爱的妻子相对，主要表示不蒙偏爱；脚注保留较强译法。
- source_word: וְיָלְדוּ לוֹ בָנִים
  choice: 都给他生了儿子
  rationale: בָנִים 明确是“儿子”；“都”清楚表明两个妻子各自生子。
- source_word: הָאֲהוּבָה וְהַשְּׂנוּאָה
  choice: 受宠爱的和不受宠爱的
  rationale: 保留原文两个名词化形容词的对称结构，并承接前文所指的妻子。
- source_word: וְהָיָה הַבֵּן הַבְּכוֹר
  choice: 而长子是
  rationale: 自然承接案例中的关键条件；“长子”准确表达 הַבֵּן הַבְּכוֹר。
- source_word: לַשְּׂנִיאָה
  choice: 不受宠爱的妻子所生的
  rationale: 介词结构表示长子与该妻子的亲属关系；用“所生的”在继承语境中比“属于”更准确、自然。
theological_decisions:
- issue: 家庭律例中 שְׂנוּאָה 的表达
  choice: 不受宠爱
  alternative: 被恨；较少受爱
  rationale: 该词本可表达“被恨”，但这里与 אֲהוּבָה 构成妻子受偏爱与不受偏爱的法律性对照。“不受宠爱”不把情感敌意说得过强，同时以脚注保留原词较强的可能含义。
translation_notes:
  register: 采用现代、庄重而易懂的律例语言。“受宠爱／不受宠爱”保持对称，并避免把 שְׂנוּאָה 无提示地弱化；全句以逗号结尾，因为本节的条件句在下一节继续。
