    rationale: רֵאשִׁית意为“开始、开端、最初的部分”，此处指父亲生育力量最初的表现或产出；“果实”虽可表达解释性意思，却不是原文词汇所明示，且“初结”不如“开端”自然。
  - severity: low
    issue: “长子的权利本来属于他”中的“本来”无对应的原文表达。
