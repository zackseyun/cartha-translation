reference: Deuteronomy 21:17
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּי֩ אֶת הַ/בְּכֹ֨ר בֶּן הַ/שְּׂנוּאָ֜ה יַכִּ֗יר לָ֤/תֶת ל/וֹ֙ פִּ֣י שְׁנַ֔יִם בְּ/כֹ֥ל אֲשֶׁר יִמָּצֵ֖א ל֑/וֹ כִּי הוּא֙ רֵאשִׁ֣ית אֹנ֔/וֹ ל֖/וֹ מִשְׁפַּ֥ט הַ/בְּכֹרָֽה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/017.yaml
  text: But he shall acknowledge the firstborn[a], the son of the unloved wife, by giving him a double portion of all that is found to belong to him, for he is the firstfruits of his vigor[c][b]; the right of the firstborn belongs to him.
translation:
  language: zh_hans
  text: 却要承认那不受宠之妻所生的长子[a]，从自己一切所有的财物中给他双份[b]；因为他是父亲力量的开端[c]，长子的权利属于他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “不受宠之妻”也可译作“被恨的妻子”。原文用词较强，但在这里与受宠之妻相对，也可能指较少蒙爱的妻子。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“两个口”，是表示两份继承额的习语。
    reason: lexical_alternative
  - marker: c
    text: 也可译作“他力量的开端”。这表达指长子是父亲生育力量最初的表现或产出。
    reason: lexical_alternative
lexical_decisions:
- source_word: יַכִּיר
  choice: 要承认
  rationale: 该词为 נכר 的使役形，在这里指依法确认真正长子的身份和地位；“承认”比单纯感知意义的“认出”更符合继承法语境。
- source_word: הַבְּכֹר
  choice: 长子
  rationale: 这是表示享有长子继承权的家庭法律用语；现代汉语以“长子”表达最自然，同时由后文“长子的权利”明确其法律含义。
- source_word: בֶּן הַשְּׂנוּאָה
  choice: 那不受宠之妻所生的长子
  rationale: שְׂנוּאָה 字面可指“被恨的”，但在与受宠之妻对举的婚姻语境中，也可表达较不受爱或不受宠；此译保留关系上的对比而避免过度强化敌意。
- source_word: לָתֶת לוֹ פִּי שְׁנַיִם
  choice: 给他双份
  rationale: פִּי שְׁנַיִם 字面为“两个口”，是指两份继承额的习语；“双份”简洁清楚。
- source_word: בְּכֹל אֲשֶׁר יִמָּצֵא לוֹ
  choice: 从自己一切所有的产业中
  rationale: 该短语直指父亲名下所拥有的一切；结合继承语境，加“产业”可自然说明分配对象，同时保留“一切所有”的范围。
- source_word: רֵאשִׁית אֹנוֹ
  choice: 他力量初结的果实
  rationale: 原文把头生子称为父亲力量最初的产出，带有生育能力的含义；此译保留“起初”与“力量”的隐喻，又使中文自然庄重。
- source_word: מִשְׁפַּט הַבְּכֹרָה
  choice: 长子的权利
  rationale: 该短语表示随长子身份而有的法定权益；“长子的权利”准确而通俗。
- source_word: כִּי ... כִּי
  choice: 却……因为
  rationale: 第一个 כִּי 承接上一节，表达与偏爱做法相反的转折；第二个 כִּי 说明必须如此分配的理由。
theological_decisions:
- issue: 法律语境中 שְׂנוּאָה 所表达的婚姻关系
  choice: 不受宠之妻
  alternative: 被恨的妻子／较少蒙爱的妻子
  rationale: 原词确可表示“被恨”，但上下文把两位妻子按受爱程度对举，并非必然断言强烈仇恨。“不受宠”保留关系不对等，也不把含义收窄为绝对敌意。
- issue: רֵאשִׁית אֹנוֹ 的生育隐喻
  choice: 力量初结的果实
  alternative: 力量的开端／精力初生的
  rationale: 这里的“力量”含父亲生育能力，但原文采用含蓄隐喻。译文保留这种张力，不直接改写为生理术语，也不将其解释成某项教义。
translation_notes:
  register: 采用现代、庄重而易懂的法律叙述语体。“却要”承接上一节的禁令形成转折；“产业”“权利”凸显继承法背景。正文脚注依实际语句顺序排列为[a][b][c]。
