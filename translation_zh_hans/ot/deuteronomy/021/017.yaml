  - severity: low
    issue: “产业”可能将父亲“一切所有”收窄为特定类别财产。
    rationale: בְּכֹל אֲשֶׁר יִמָּצֵא לוֹ指父亲所拥有或所发现归其所有的一切；“财物”在此更宽泛而自然。
