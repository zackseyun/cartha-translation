  naturalness: 整体庄重通顺，适合法律叙述。“那不受宠之妻所生的长子”自然。“他力量的开端”比“他力量初结的果实”更符合现代汉语中对这一传统隐喻的表达；以“父亲”明示所属关系，可避免连续代词造成的指代不清。
  terminology: “承认”“长子”“双份”“长子的权利”均妥当。“不受宠之妻”可保留，并以脚注说明“被恨的妻子”这一较字面的可能译法。将“产业”改为“财物”可较准确涵盖原文指父亲所有的一切，而不把范围限于特定类型的产业。
