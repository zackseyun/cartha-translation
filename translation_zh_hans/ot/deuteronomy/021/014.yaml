base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/014.yaml
  text: But if it happens that you do not delight in her[a], then you shall let her go where she wishes; you must certainly not sell her for money. You must not treat her as merchandise[c][b], because you have humiliated her.
translation:
  language: zh_hans
  text: 如果你不喜爱她，就要任她自由离去[a]；绝不可为钱卖她，也不可把她当作货物来牟利[b]，因为你已经凌辱了她[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“把她送走，归她自己”，意思是让她恢复自由，自主离去。
    reason: lexical_alternative
  - marker: b
    text: 这个希伯来语动词很少见，也可译作“不可利用她牟利”或“不可奴役她”。这里可能指把她当作可支配、可获利的对象。
    reason: lexical_alternative
  - marker: c
    text: 或译“侵犯了她”或“使她受苦”。这个希伯来词可按语境表示使人受苦、羞辱或性侵犯。
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה אִם לֹא חָפַצְתָּ בָּהּ
  choice: 如果你不再喜爱她
  rationale: חפץ表示喜爱、愿意或以之为乐。结合前文娶她为妻后的情境，“不再喜爱”自然表达关系发生变化；“不再”虽属语境补足，但未把含义收窄为纯粹性欲。
- source_word: וְשִׁלַּחְתָּהּ לְנַפְשָׁהּ
  choice: 就要让她自由离去
  rationale: 字面近于“把她送走，归她自己”；这里表示释放她，使她能自主离去。“自由离去”比“任她随意”更明确传达解除控制，同时以脚注保留字面结构。
- source_word: וּמָכֹר לֹא תִמְכְּרֶנָּה בַּכָּסֶף
  choice: 绝不可把她卖钱
  rationale: 不定式绝对形与限定动词连用，强化禁令，故用“绝不可”。כֶּסֶף在此指钱财或价款，译作“卖钱”简明自然。
- source_word: לֹא תִתְעַמֵּר בָּהּ
  choice: 也不可把她当作货物牟利
  rationale: התעמר是罕见动词，在此与禁止出售平行，可能指将人当作可支配、可获利的对象。“当作货物牟利”体现其经济剥削和物化意味，但不武断限定为再次奴役；脚注保存其他可能。
- source_word: תַּחַת אֲשֶׁר עִנִּיתָהּ
  choice: 因为你已经凌辱了她
  rationale: תחת אשר在此说明禁令的理由。ענה的Piel形可指使人受苦、羞辱或在性语境中侵犯。“凌辱”保留行为造成的严重屈辱及可能的性意味，又不像“强奸”那样在正文中作出更窄的法律判断。
theological_decisions:
- issue: 对被掳女子之法律规定的伦理力度
  choice: 译文突出男子必须释放女子，并禁止出售和经济性物化，因为他已凌辱她。
  alternative: 把场景处理成普通的双方自愿离婚，或在正文中直接定性为强奸。
  rationale: 希伯来文本限制男子在婚姻或性结合后的权力，并明确以女子所受的凌辱为禁令依据。译文既不淡化被掳背景中的强制性，也不超越词义范围作更具体的法律定性。
- issue: ענה在本节中的道德与性含义
  choice: 正文采用“凌辱”，脚注注明也可理解为“侵犯”或“使她受苦”。
  alternative: 只译为较弱的“使她谦卑”，或只译为特定法律意义的“强奸”。
  rationale: 该词本身具有受苦、受辱及性侵犯等语义可能；语境赋予它明显的性与权力维度，但具体程度仍有真实歧义，应予保留。
translation_notes:
  register: 采用现代、庄重而清楚的普通话。“自由离去”突出女子恢复自主；“绝不可”传达希伯来语强化禁令；“凌辱”保留原文的道德重量与性语境中的歧义。所有脚注标记均置于相关正文之后。
