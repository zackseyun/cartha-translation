base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/016.yaml
  text: And on the day he gives his sons as an inheritance what belongs to him[a], he may not treat the son of the loved wife as firstborn over the son of the hated wife, who is the firstborn.
translation:
  language: zh_hans
  text: 到了他把自己所有的分给儿子们作产业的日子，他不可把所爱之妻的儿子立为长子，越过那被厌恶之妻[a]的儿子，就是长子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “被厌恶之妻”也可译作“不受宠之妻”或“较少受爱之妻”。希伯来文直译为“所爱的”和“被厌恶的”，但在家庭法律语境中，后者可能指相对较不受宠，并不一定表示主动憎恨。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה בְּיוֹם
  choice: 到了……的日子
  rationale: 保留希伯来文法律条文中的时间框架，同时采用自然、庄重的现代汉语表达。
- source_word: הַנְחִילוֹ אֶת בָּנָיו אֵת אֲשֶׁר יִהְיֶה לוֹ
  choice: 他把自己所有的分给儿子们作产业
  rationale: הנחיל 的使役形式表示使人承受产业或分给产业；“自己所有的”对应 אֲשֶׁר יִהְיֶה לוֹ，既保留两个成分，也避免不自然的逐词翻译。
- source_word: לֹא יוּכַל
  choice: 不可
  rationale: 在法律语境中表示没有权利这样做，即禁令，而非单纯能力不足。
- source_word: לְבַכֵּר
  choice: 立为长子
  rationale: 这里指赋予长子身份及相应权利；“立为长子”在汉语中简洁地传达其法律行为含义。
- source_word: בֶּן הָאֲהוּבָה
  choice: 所爱之妻的儿子
  rationale: 保留 אָהב 的“爱”义，并依上下文补出“妻”。
- source_word: עַל פְּנֵי
  choice: 越过……而
  rationale: 在此表示让一人优先于另一人；汉语用“越过……而”能清楚呈现非法改变长子次序的含义。
- source_word: בֶן הַשְּׂנוּאָה
  choice: 被厌恶之妻的儿子
  rationale: שׂנא 字面义较强，为“恨、厌恶”；正文保留这种鲜明对比，同时以脚注说明在家庭关系语境中也可能指较不受宠。
- source_word: הַבְּכֹר
  choice: 就是长子
  rationale: 明确句末词语指被厌恶之妻的儿子才是实际的长子。
theological_decisions:
- issue: 多妻家庭法规中“所爱”与“被厌恶”的关系对比
  choice: 正文采用“所爱之妻”与“被厌恶之妻”
  alternative: “受宠之妻”与“不受宠之妻”，或“所爱之妻”与“较少受爱之妻”
  rationale: 希伯来文使用强烈的反义对照，不宜在正文中无故弱化；但该词在家庭法律语境中可能表达相对失宠，因此以脚注保存这一解释空间。
translation_notes:
  register: 采用现代、庄重而易懂的法律叙述语体。“作产业”“不可”“立为长子”保留经文的制度性语气；调整语序，使实际为长子的对象在汉语中清楚无歧义。
