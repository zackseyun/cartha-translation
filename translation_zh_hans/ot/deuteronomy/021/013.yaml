base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/013.yaml
  text: She shall remove the clothing of her captivity from herself and remain in your house[a], and mourn her father and her mother for a month of days. After that you may go in to her and be her husband, and she shall be your wife.
translation:
  language: zh_hans
  text: 她要脱去她被掳的衣服[a]，住在你家里，为她的父亲和母亲哀哭整整一个月。此后，你可以与她同房，作她的丈夫；她要作你的妻子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“她被掳时所穿的衣服”。原文也可能指与她被掳身份相关的衣服。
    reason: 原文“她被掳的衣服”所用属格关系可作不同理解；脚注说明而不在正文预先限定。
lexical_decisions:
- source_word: וְהֵסִירָה
  choice: 她要脱下
  rationale: 使役形在此表示除去身上的衣服；现代汉语说“脱下”最自然，也保留法规语气。
- source_word: שִׂמְלַת שִׁבְיָהּ מֵעָלֶיהָ
  choice: 被掳时所穿的衣服
  rationale: 原文直译近于“她被掳的衣服，从她身上”；此表达自然地说明衣服与被掳处境相关，同时不武断限定为特定俘虏服装。
- source_word: וְיָשְׁבָה בְּבֵיתֶךָ
  choice: 住在你家里
  rationale: ישב 在此指居住、停留；“住在”符合现代汉语法律叙述。
- source_word: וּבָכְתָה אֶת אָבִיהָ וְאֶת אִמָּהּ
  choice: 为父母哀哭
  rationale: בכה 本义为哭泣，此处对象是父母，具有哀悼意味；“哀哭”兼顾动作与语境。汉语合称“父母”简洁自然，语义无损。
- source_word: יֶרַח יָמִים
  choice: 整整一个月
  rationale: 字面为“一个月的日子”，是表示足月的习语；“整整一个月”既传达完整时段，也符合现代汉语。
- source_word: תָּבֹא אֵלֶיהָ
  choice: 你可以与她同房
  rationale: 这是希伯来语表示性关系的惯用语；“与她同房”在中文圣经语体中清楚而庄重。“可以”体现法规语境中的许可。
- source_word: וּבְעַלְתָּהּ
  choice: 作她的丈夫
  rationale: 该动词在此表示取得丈夫身份；这样翻译保留其与前一性关系表达及后一妻子身份表述的区别，避免误译成单纯占有。
- source_word: וְהָיְתָה לְךָ לְאִשָּׁה
  choice: 她也要作你的妻子
  rationale: 保留原文明确的婚姻身份公式；“也”自然连接双方相应的夫妻身份。
theological_decisions:
- issue: 战争俘虏婚姻法规中的性与婚姻措辞
  choice: 分别译作“与她同房”“作她的丈夫”“她也要作你的妻子”
  alternative: 将三者合并淡化为“娶她为妻”，或强化为带有强制判断的措辞
  rationale: 原文依次区分性关系、丈夫身份和妻子身份。保留三层表达可呈现法规本身的结构与张力，不浪漫化，也不加入原文未明说的伦理或法律判断。
translation_notes:
  register: 采用现代、庄重而易懂的法规语体。“哀哭”“同房”保留经文语境所需的肃穆与明确；不以委婉的“娶她”抹平原文三个连续动作和身份表述。
