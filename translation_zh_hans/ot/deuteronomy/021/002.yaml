  text: then your elders and your judges shall go out and measure to the cities that are around the slain man[a].
translation:
  language: zh_hans
  text: 你的长老和审判官要出去，测量从被杀者所在之处到周围各城的距离。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“量到被杀者周围的各城。”
    reason: 保留原文简略的“量到……各城”结构；正文为符合现代汉语而明示测量起点和距离。
lexical_decisions:
- source_word: וְיָצְאוּ
  choice: 就要出去
  rationale: 连词加完成式在这段律法程序中承接前一步行动；“就要”自然表达顺序和规定性，同时保留“出去”的动作。
- source_word: זְקֵנֶיךָ
  choice: 你的长老
  rationale: 保留第二人称单数后缀和以色列作为整体受话者的表达；“长老”是现代汉语中清楚、庄重的对应词。
- source_word: וְשֹׁפְטֶיךָ
  choice: 和审判官
  rationale: 该词指行使司法权柄的人；“审判官”比泛称“官员”更准确地体现此处的法律职能。
- source_word: וּמָדְדוּ אֶל הֶעָרִים
  choice: 量一量从被杀者那里到……各城的距离
  rationale: 原文直说“量到各城”；汉语补出测量的起点和“距离”，使实际测量关系清楚自然，并未改变程序含义。
- source_word: אֲשֶׁר סְבִיבֹת
  choice: 周围各城
  rationale: 简洁表达这些城位于被杀者四周；“各城”也符合需要逐一比较距离的语境。
- source_word: הֶחָלָל
  choice: 被杀者
  rationale: חָלָל指遭杀害的人；“被杀者”保留该词的受害含义，又不像“谋杀受害者”那样预先判定案件性质，也不必额外限定性别。
