  to: 那城的长老要把那头小母牛牵下去，到一条常年有水、未经耕作也未经播种的溪谷[a]；他们要在那里，在溪谷中折断小母牛的颈项。
  rationale: 修订使中文更自然，并更贴合原文的动词体、牲畜称谓与专门仪式动作。脚注保留נַחַל אֵיתָן的真实词义争议，同时不将英文审计轨迹中“perennial wadi”的理解误作唯一结论。
