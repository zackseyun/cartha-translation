base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/004.yaml
  text: Then the elders of that city shall bring the heifer down to a perennial wadi[a], which is neither worked nor sown, and there in the wadi they shall break the heifer’s neck.
translation:
  language: zh_hans
  text: 那城的长老要把那头小母牛牵下去，到一条常年有水、未经耕作也未经播种的溪谷[a]；他们要在那里，在溪谷中折断小母牛的颈项。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “常年有水的溪谷”也可译为“常流不竭的溪谷”或“水流不断的河谷”。希伯来语“纳哈尔·埃坦”（נַחַל אֵיתָן）中的修饰语也有人理解为指坚固、险峻等地貌特征；其确切含义有争议。
    reason: “溪谷”对应נַחַל；正文采用אֵיתָן指持久水流的常见理解，脚注保留主要词义及地貌解释的争议，避免把一种解释定为无疑。
lexical_decisions:
- source_word: וְהוֹרִדוּ
  choice: 要把……牵下去，带到
  rationale: 使役形表达使母牛犊下到较低之处；“牵下去，带到”既保留向下移动，也符合牵引牲畜的自然汉语。
- source_word: זִקְנֵי הָעִיר הַהִוא
  choice: 那城的长老
  rationale: 准确保留指示语和法律语境中的城邑领袖称谓。
- source_word: הָעֶגְלָה
  choice: 母牛犊
  rationale: 指尚年轻的雌性牛；“母牛犊”比单说“小母牛”更庄重，也能体现性别与年龄。
- source_word: אֶל נַחַל אֵיתָן
  choice: 到一条长流的溪谷[a]
  rationale: נַחַל可指溪谷、河谷或季节性水道，אֵיתָן在此很可能描述水流持久不断；“长流的溪谷”兼顾地貌和常年有水之意，同时用脚注保留词义争议。
- source_word: אֲשֶׁר לֹא יֵעָבֵד בּוֹ וְלֹא יִזָּרֵעַ
  choice: 那溪谷未曾耕作，也未曾撒种
  rationale: 两个被动动词均按农业语境表达；重复“未曾”使并列关系清楚自然。
- source_word: וְעָרְפוּ
  choice: 打断……的颈项
  rationale: 该词在此指以颈部为对象的特殊处置，并非普通的宰杀；此译保留仪式动作的独特性，不泛化为“宰杀”。
- source_word: שָׁם ... בַּנָּחַל
  choice: 在那里，在溪谷中
  rationale: 保留原文地点副词及对溪谷的重复强调。
theological_decisions:
- issue: 母牛犊的处置是否译作一般性的“宰杀”
  choice: 打断母牛犊的颈项
  alternative: 宰杀母牛犊
  rationale: 原文使用专门动词 ערף，而非通常表示宰杀的词；直陈颈部动作可避免把这一仪式与一般献祭用语混同。
translation_notes:
  register: 采用现代、庄重而易懂的法律叙事语体。“溪谷”比音译“旱谷”更适合普通中文读者；“颈项”保持经文语体的庄重感。
