  source_fidelity: 正文准确保留了长老把小母牛带下去、带至未耕未种的נחל，以及在该处折断其颈项等主要内容。不过，“未曾耕作，也未曾撒种”容易表示过去从未发生过的事实，而原文被动未完成式在此更适合译为“未经耕作、也未经播种”。“长流的溪谷”搭配不够自然，且将有争议的אֵיתָן解释得过于生硬。
  naturalness: “母牛犊”在现代汉语中略显重复且不如“小母牛”自然；“牵下去，带到”也有动作重复。“打断……颈项”可改为更准确、庄重的“折断……的颈项”。
  terminology: 将עֶגְלָה译为“小母牛”能清楚表达年轻雌牛。将נחל译为“溪谷”可以保留地貌含义；以“常年有水”表达正文所采取的持久水流理解，并在脚注保留另一种地貌性解释，较稳妥。
