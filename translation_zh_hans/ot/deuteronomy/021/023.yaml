  text: לֹא תָלִ֨ין נִבְלָת֜/וֹ עַל הָ/עֵ֗ץ כִּֽי קָב֤וֹר תִּקְבְּרֶ֨/נּוּ֙ בַּ/יּ֣וֹם הַ/ה֔וּא כִּֽי קִלְלַ֥ת אֱלֹהִ֖ים תָּל֑וּי וְ/לֹ֤א תְטַמֵּא֙ אֶת אַדְמָ֣תְ/ךָ֔ אֲשֶׁר֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ נֹתֵ֥ן לְ/ךָ֖ נַחֲלָֽה־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/023.yaml
  text: His corpse shall not remain all night on the tree[a], but you shall surely bury him that same day, for a hanged man is under God's curse; and you shall not defile your land that Yahweh your God is giving you as an inheritance.
translation:
  language: zh_hans
  text: 他的尸体不可在树上留过夜[a]；你当天务必把他埋葬，因为被挂的人受上帝咒诅；不可玷污你的土地，就是耶和华你的上帝赐给你作产业的土地。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “树”也可泛指木头或木制物。本节后半句也可译作：“因为被挂的人是上帝所咒诅的”；另有理解为：“因为悬挂尸体是对上帝的冒犯。”希伯来语表达简练，可以有不止一种理解。
    reason: 保留עֵץ的词义范围，并说明כִּי קִלְלַת אֱלֹהִים תָּלוּי在属格关系和整句含义上的真实歧义。
lexical_decisions:
- source_word: תָלִין
  choice: 留过夜
  rationale: 该动词在此指整夜停留；“留过夜”自然、准确地保留禁令的时间含义。
- source_word: נִבְלָתוֹ
  choice: 他的尸体
  rationale: נְבֵלָה特指死者的遗体；“尸体”比“身体”更精确。
- source_word: עַל הָעֵץ
  choice: 在木架上
  rationale: עֵץ可指树木或木料；本条律法所说的是悬挂、陈列尸体的木制物。“木架”在现代汉语中较自然，同时脚注保留“树上”的直译可能。
- source_word: קָבוֹר תִּקְבְּרֶנּוּ
  choice: 一定要把他埋葬
  rationale: 同根不定式绝对形与未完成式连用，加强命令语气；“一定要”体现这一强调。
- source_word: בַּיּוֹם הַהוּא
  choice: 当天
  rationale: 简明表达必须在同一天、入夜之前埋葬的要求。
- source_word: קִלְלַת אֱלֹהִים
  choice: 上帝的咒诅
  rationale: 原文构造简练且有歧义；正文将其理解为被悬挂者承受来自上帝的咒诅，其他可能解释收入脚注。
- source_word: תָּלוּי
  choice: 被挂起来的人
  rationale: 被动分词意为“被悬挂的”；此译法自然，并保留其被动含义。
- source_word: תְטַמֵּא
  choice: 玷污
  rationale: 该词在土地洁净语境中兼有礼仪和道德污染意味，“玷污”可以保留这两层色彩。
- source_word: אַדְמָתְךָ
  choice: 你的土地
  rationale: 在应许之地和产业的语境中，אֲדָמָה译作“土地”最贴切。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代简体中文圣经读者熟悉的专名形式音译四字神名，与“上帝”这一称谓相区别。
- source_word: נַחֲלָה
  choice: 作产业
  rationale: 该词指承受而得的持有物；“作产业”自然保留土地作为所赐基业的含义。
theological_decisions:
- issue: כִּי קִלְלַת אֱלֹהִים תָּלוּי的含义
  choice: 被挂起来的人承受着上帝的咒诅
  alternative: 被挂起来的人是上帝所咒诅的；或悬挂尸体是对上帝的冒犯
  rationale: 希伯来语表达高度凝练，属格关系及整句语义存在多种理解。正文采用与上下文较连贯的解释，即悬挂者处于上帝咒诅之下；脚注保留其他解释，不把原文的神学张力消除。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“不可”“玷污”“产业”保持律法文本的正式感；“留过夜”“当天一定要”则避免过度文言化。
