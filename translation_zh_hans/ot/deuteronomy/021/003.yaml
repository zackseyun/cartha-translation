base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/003.yaml
  text: And it shall be that the city nearest to the slain man[c][b][a], the elders of that city shall take a heifer from the herd that has not been worked with and has not pulled in a yoke.
translation:
  language: zh_hans
  text: 那么，离被杀的人[a]最近的那座城的长老，要从牛群中取一头小母牛[b]；这头牛未曾用来做工，也未曾套轭牵引[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“被杀者”或“尸体”。希伯来语这个词指遭杀害的人。
    reason: lexical_alternative
  - marker: b
    text: 或译“一头母牛犊”。原文较完整地指牛群中一头年轻的母牛。
    reason: lexical_alternative
  - marker: c
    text: 直译“未曾在轭中拉过”，意思是从未用来做牵引工作的牛。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: 那么
  rationale: 这是叙事—法律语境中引出下一程序步骤的惯用表达；“那么”在现代汉语中自然地承接上文。
- source_word: הָעִיר הַקְּרֹבָה
  choice: 最近的那座城
  rationale: 按上下文将比较形容词表达为最高程度，指距离被杀者最近的城。
- source_word: אֶל הֶחָלָל
  choice: 离被杀的人
  rationale: חָלָל指遭杀害者；此译保留人的指称，不仅表达为无生命的“尸体”。
- source_word: וְלָקְחוּ זִקְנֵי הָעִיר הַהִוא
  choice: 城里的长老要……取
  rationale: 保留对该城公认领袖所作的法律指示，并以现代汉语自然表达。
- source_word: עֶגְלַת בָּקָר
  choice: 从牛群中取一头小母牛
  rationale: עֶגְלָה是年轻的母牛，בָּקָר说明它属于牛群；“小母牛”通俗明确。
- source_word: אֲשֶׁר לֹא עֻבַּד בָּהּ
  choice: 未曾用来劳作
  rationale: 该被动结构表示人未曾借这头牛做工；此译明确其工具性含义。
- source_word: אֲשֶׁר לֹא מָשְׁכָה בְּעֹל
  choice: 未曾套轭拉过东西
  rationale: מָשַׁךְ意为“拉、牵引”；译文具体说明这头牛从未套轭从事牵引工作。
theological_decisions: []
