base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/009.yaml
  text: So you shall purge the innocent blood from your midst[a], because you shall do what is right in the eyes of Yahweh.
translation:
  language: zh_hans
  text: 这样，你行耶和华眼中看为正的事，就要从你中间除掉无辜人的血债[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“从你中间除掉无辜的血。”希伯来文直译为“无辜的血”；在本段语境中，这可指尚未得到处理的无辜流血事件及群体因此所负的血罪责任。
    reason: 保留原文“血”的具体意象，同时说明其在法律语境中的可能含义。
lexical_decisions:
- source_word: וְ/אַתָּה
  choice: 这样，你就要
  rationale: 连词与独立代词构成强调性的总结和转折；译为“这样，你就要”，自然承接前述礼仪及其结果，并保留对以色列整体的单数称呼。
- source_word: תְּבַעֵר
  choice: 除掉
  rationale: בער 的加强词干在申命记法律语境中常指从群体中清除罪恶或罪责；“除掉”比字面上的“烧尽”更符合此处语义。
- source_word: הַ/דָּם הַ/נָּקִי
  choice: 流无辜人之血的罪
  rationale: 希伯来文直译为“无辜的血”，在本段语境中兼指无辜者被杀及其给群体带来的血罪；正文适度显明这一法律含义，同时由脚注保留较直译的表达。
- source_word: מִ/קִּרְבֶּךָ
  choice: 从你们中间
  rationale: 原文为第二人称阳性单数，集体指以色列；现代汉语用“你们”清楚表达群体含义，“中间”保留申命记常见的群体性司法措辞。
- source_word: כִּי
  choice: 因为
  rationale: 保留原文最直接的因果关系，不改释为单纯的时间关系。
- source_word: תַעֲשֶׂה
  choice: 你要行
  rationale: 未完成式在法律训令中带有规范和预期意味；“要行”兼顾命令语气与结果意味。
- source_word: הַ/יָּשָׁר
  choice: 看为正的事
  rationale: 形容词在此名词化，指合宜、正直之事；与“眼中”连用时，“看为正的事”是自然庄重的汉语表达。
- source_word: בְּ/עֵינֵי יְהוָה
  choice: 耶和华眼中
  rationale: 保留希伯来文“在……眼中”的评价隐喻；将圣名 יְהוָה 音译为汉语圣经传统中通行的“耶和华”。
theological_decisions:
- issue: “无辜的血”是否明确译为群体所负的血罪
  choice: 正文译作“流无辜人之血的罪”，脚注保留“无辜人的血”的直译
  alternative: 直接译作“无辜人的血”
  rationale: 本段处理的是未破命案使土地与群体承担的血罪，但原文仍使用具体的“血”这一意象。正文需让现代读者明白清除的是血罪，脚注则避免抹去原文意象及其语义张力。
- issue: כִּי תַעֲשֶׂה 的逻辑关系
  choice: 译为“因为你要行”
  alternative: 译为“你若行”或“当你行”
  rationale: כִּי 最自然可作原因说明，未完成式也可带规范意味。保留因果表达，避免把原文未经明确标示的条件关系写死。
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: “耶和华”是现代简体中文圣经语域中最通行且普通读者最易识别的专名形式；它作为专名呈现四字神名，而不以“主”替代。
translation_notes:
  register: 采用现代、庄重而易懂的法律—盟约语体。“你们”表达原文集体单数所指的以色列群体；句式保留因果关系和“在耶和华眼中”的希伯来语意象。
