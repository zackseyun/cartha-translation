  text: וְ/נִגְּשׁ֣וּ הַ/כֹּהֲנִים֮ בְּנֵ֣י לֵוִי֒ כִּ֣י בָ֗/ם בָּחַ֞ר יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ לְ/שָׁ֣רְת֔/וֹ וּ/לְ/בָרֵ֖ךְ בְּ/שֵׁ֣ם יְהוָ֑ה וְ/עַל פִּי/הֶ֥ם יִהְיֶ֖ה כָּל רִ֥יב וְ/כָל נָֽגַע־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/005.yaml
  text: And the priests[a], the sons of Levi, shall come forward, for Yahweh your God has chosen them to minister to him and to bless in the name of Yahweh, and by their word every dispute and every injury shall be settled.
translation:
  language: zh_hans
  text: 祭司，就是利未的子孙，要上前来，因为雅威你的上帝拣选了他们，来侍奉他，并奉雅威的名祝福；一切争讼和一切伤害[a]，都要按他们所说的裁定。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “伤害”也可译作“击打”或“灾病”。这个希伯来词含义较广；在这里的法律语境中，可能指涉及人身伤害的案件。
    reason: 保留נֶגַע的宽泛词义，并说明其在当前语境中可能具有的司法含义。
lexical_decisions:
- source_word: וְנִגְּשׁוּ
  choice: 要上前来
  rationale: 该动词在这里表示祭司正式上前参与法律与礼仪程序；“上前来”自然地传达了带有公务性质的接近。
- source_word: הַכֹּהֲנִים בְּנֵי לֵוִי
  choice: 祭司，就是利未的子孙
  rationale: 保留希伯来文“祭司”与“利未的子孙”之间的同位关系，同时使现代中文读者容易理解。
- source_word: כִּי בָם בָּחַר
  choice: 因为……拣选了他们
  rationale: כִּי说明祭司拥有此职分的原因；“拣选了”既表达先前的拣选，也不抹去其持续效力。
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: 雅威你的上帝
  rationale: 按源文直接音译圣名יְהוָה为“雅威”，并保留盟约称谓中的单数第二人称“你的”。
- source_word: לְשָׁרְתוֹ
  choice: 让他们侍奉他
  rationale: שרת在祭司语境中指神圣职务上的服侍；“侍奉”比一般的“服务”更符合此处语域。
- source_word: וּלְבָרֵךְ בְּשֵׁם יְהוָה
  choice: 奉雅威的名祝福
  rationale: “奉……的名”自然表达祭司在雅威所授权柄下施行祝福。
- source_word: וְעַל פִּיהֶם
  choice: 凭他们的话
  rationale: 原文直译为“在他们口上”，是指有权威的口头裁断；“凭他们的话”既保留言语意象，也符合中文表达。
- source_word: יִהְיֶה
  choice: 要……裁定
  rationale: 动词本身是“要成为／要有定准”；结合司法语境译为“裁定”，补足中文所需谓语而不过度说明具体程序。
- source_word: כָּל רִיב
  choice: 一切争讼
  rationale: רִיב可指争执，也常指法律争讼；“争讼”准确体现本段的司法语境。
- source_word: וְכָל נָגַע
  choice: 一切伤患
  rationale: נֶגַע可指击打所致的伤、灾病或其他损害。“伤患”保留其宽泛性，脚注说明在此法律语境中的可能所指。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 源文明确使用四字神名；音译“雅威”直接呈现这一盟约之名，而不以称号替代。
- issue: 祭司裁断权的表达
  choice: 都要凭他们的话裁定
  alternative: 都由他们作最终判决
  rationale: 原文强调事情“按他们口中所出”而定，但没有在本节中详述权限范围；所选译文保留权威性，又避免加入“最终”等源文没有明说的限定。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“祭司，就是利未的子孙”保留源文同位结构；分号划分拣选与权威裁断两层意思。脚注标记置于实际存在词义歧义的“伤患”之后。
