  yaml_path: translation/ot/deuteronomy/021/011.yaml
  text: and you see among the captives a woman beautiful in form[a], and you desire her and take her for yourself as a wife[b],
translation:
  language: zh_hans
  text: 你若在俘虏中看见一个容貌美丽的女子[a]，爱慕她，要娶她为妻[b]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“一个外貌美丽的女子。”
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译：“为自己取她作妻子”，是表示娶妻的惯用语。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאִיתָ בַּשִּׁבְיָה
  choice: 你若在俘虏中看见
  rationale: 这些完成式动词承接前文的条件性法律句式，因此用“若”明确现代汉语中的条件关系；“俘虏中”对应集合意义的 שִׁבְיָה，而不扩大为更具解释性的“战俘”。
- source_word: אֵשֶׁת יְפַת תֹּאַר
  choice: 一个容貌美丽的女子
  rationale: 该结构指外在形貌美丽的女子。“容貌美丽”自然、庄重，也保留 תֹּאַר 对外表的强调。
- source_word: וְחָשַׁקְתָּ בָהּ
  choice: 爱慕她
  rationale: חָשַׁק 表达强烈的倾慕或欲求；“爱慕”在此兼顾其力度与现代汉语的自然表达，不弱化为仅仅“注意到”或“觉得有吸引力”。
- source_word: וְלָקַחְתָּ לְךָ לְאִשָּׁה
  choice: 想娶她为妻
  rationale: 希伯来语字面为“为自己取她作妻子”，是婚娶惯用语。结合本节由前文条件结构统摄、后文继续规定婚娶程序的句法，“想娶她为妻”在汉语中比字面“把她取来归自己作妻子”自然，并避免误示此刻程序已经完成。
theological_decisions:
- issue: 如何翻译具有伦理张力的战争法律情境
  choice: 直陈男子看见、爱慕并想娶被俘女子，不加入赞许、谴责或自愿同意等原文未明说的内容
  alternative: 淡化为“选她作妻子”，或增译为强迫、准许、同意等评价性内容
  rationale: 本节以法律情境的方式陈述行为，并未在这一句中明说其道德评价或女子的意愿。译文应保留这种令人不安的张力，不替文本作神学或伦理裁断。
- issue: “取为妻”是立即成婚还是婚娶意向
  choice: 正文译为“想娶她为妻”，脚注保留较字面的表达
  alternative: 译为“把她娶来作自己的妻子”，表示婚姻已经在本节完成
  rationale: 原文惯用语可概括婚娶，但上下文接着规定带她进家及等候期；在本句中用“想娶”更符合整段程序，同时脚注说明字面形式，以免隐藏原文措辞。
translation_notes:
  register: 采用现代、庄重而易懂的法律叙述语体。以“容貌美丽”传达外在形貌，以“爱慕”保留欲求的力度；不使用古雅的“掳物”“取之为妻”，也不增添原文没有的伦理判断。
