source:
  edition: WLC
  text: כַּפֵּר֩ לְ/עַמְּ/ךָ֨ יִשְׂרָאֵ֤ל אֲשֶׁר פָּדִ֨יתָ֙ יְהוָ֔ה וְ/אַל תִּתֵּן֙ דָּ֣ם נָקִ֔י בְּ/קֶ֖רֶב עַמְּ/ךָ֣ יִשְׂרָאֵ֑ל וְ/נִכַּפֵּ֥ר לָ/הֶ֖ם הַ/דָּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/008.yaml
  text: Make atonement for your people Israel[a], whom you redeemed, O Yahweh, and do not let innocent blood remain among your people Israel. Then the bloodguilt will be atoned for them.
translation:
  language: zh_hans
  text: “耶和华啊，求你为你所救赎的以色列民，就是你的子民，赎罪；不要让无辜人的血留在你的以色列民中。这样，他们所负的流血罪就得以赎除[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“那血就为他们得了赎除。”这里的“血”是法律用语，指流血事件所造成的罪责。
    reason: 说明希伯来原文的字面表达及其司法性转喻，避免正文“流血罪”的明确化掩盖原文措辞。
lexical_decisions:
- source_word: כַּפֵּר
  choice: 赎罪
  rationale: 此处是祈求式命令，处于祭仪与司法语境中。“赎罪”既保留 כפר 的遮罪、除罪及解除罪责含义，也符合现代汉语圣经语体。
- source_word: לְעַמְּךָ יִשְׂרָאֵל
  choice: 为……以色列民，就是你的子民
  rationale: לְ 表明赎罪所惠及的对象；调整汉语语序并以同位结构表达“你的子民以色列”，避免把“以色列”误读为受话者。
- source_word: אֲשֶׁר פָּדִיתָ
  choice: 你所救赎的
  rationale: פדה 指付代价赎回或从奴役、危险、责任中解救；“救赎”保留五经中的盟约性救赎用语。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的专名形式呈现四字神名，保留这是对上帝名字的直接呼求，而非仅用称号替代。
- source_word: וְאַל תִּתֵּן דָּם נָקִי בְּקֶרֶב
  choice: 不要让无辜人的血留在……中
  rationale: תִּתֵּן 字面为“放置、交给”，但本语境祈求无辜流血所带来的责任不要落在并存留于群体中；此译自然表达该习语含义，同时保留“血”的原文意象。
- source_word: דָּם נָקִי
  choice: 无辜人的血
  rationale: 这是希伯来法律用语，指无辜者遭流血杀害；此译比抽象的“无辜之血”更便于普通读者理解。
- source_word: וְנִכַּפֵּר לָהֶם הַדָּם
  choice: 这样，他们所负的流血罪就得以赎除
  rationale: נִכַּפֵּר 是被动或结果性的形式；“这样”显出结论关系。原文以“血”转指流血事件造成的法律责任，正文用“所负的流血罪”明确其司法含义，脚注保留字面表达。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 上主／雅威
  rationale: “耶和华”是现代简体中文中广为人知的神名形式，能让读者看出原文使用的是专名。此选择不把专名化为一般称号，也不据此加入任何宗派性解释。
- issue: 末句 הַדָּם 的司法含义
  choice: 他们所负的流血罪
  alternative: 那血／他们因那血所负的罪责
  rationale: 上下文涉及未破命案给群体带来的责任。“流血罪”传达这种法律责任，但脚注注明原文直译为“血”，以免抹去原文的转喻和可能的语义张力。
- issue: 赎罪的对象与效果
  choice: 为百姓赎罪；流血罪得以赎除
  alternative: 洁净百姓／免除百姓的罪责
  rationale: 保留 כפר 在祭仪和司法之间的语义张力，不将其限定为单纯的内在宽恕、礼仪洁净或行政免责。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。直接呼语“耶和华啊”置于句首以符合汉语祷告语序；“求你”显明希伯来命令式在此为恳求。正文避免生硬照搬“把无辜之血放在民中”，同时保留“血”“赎罪”等本节关键意象与祭仪—司法张力。
