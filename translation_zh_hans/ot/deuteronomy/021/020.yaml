base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/020.yaml
  text: Then they shall say to the elders of his city[a], ‘This son of ours is stubborn and rebellious; he does not listen to our voice; he is a glutton and a drunkard.’
translation:
  language: zh_hans
  text: 他们要对他所在城的长老说：“我们这个儿子顽梗悖逆，不听我们的话[a]，是个贪食又酗酒的人。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“不服从我们”。希伯来原文直译为“不听我们的声音”，其中“听”含有听从、服从的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמְרוּ
  choice: 他们要……说
  rationale: 承接上一节的法律程序；“要”自然表达规定性的后续行动，同时保留连接语的推进作用。
- source_word: זִקְנֵי עִירוֹ
  choice: 他城里的长老
  rationale: “长老”指当地负责治理和审断的领袖；“他城里”保留第三人称后缀所指的归属关系，也符合申命记的行政语境。
- source_word: בְּנֵנוּ זֶה
  choice: 我们这个儿子
  rationale: 自然传达指示词的强调和第一人称复数所属关系。
- source_word: סוֹרֵר
  choice: 顽梗
  rationale: 表示固执、偏离正道而不肯听从；“顽梗”适合正式的法律控诉语境。
- source_word: וּמֹרֶה
  choice: 悖逆
  rationale: 表示主动反抗权威，与“顽梗”并列，保留原文递进而强烈的指控。
- source_word: אֵינֶנּוּ שֹׁמֵעַ בְּקֹלֵנוּ
  choice: 不听我们的话[a]
  rationale: 保留希伯来语“听声音/话”的表达及其“听从、服从”含义；正文用自然现代汉语呈现，脚注说明可译法。
- source_word: זוֹלֵל
  choice: 贪食
  rationale: 与下文“酗酒”构成恶习对举，在此指惯常放纵饮食，而非一般意义的挥霍。
- source_word: וְסֹבֵא
  choice: 酗酒
  rationale: 表示惯常沉溺饮酒；“酗酒”比单次“醉酒”更能体现分词所表达的持续性品行。
