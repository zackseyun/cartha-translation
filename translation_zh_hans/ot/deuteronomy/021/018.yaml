  text: כִּֽי יִהְיֶ֣ה לְ/אִ֗ישׁ בֵּ֚ן סוֹרֵ֣ר וּ/מוֹרֶ֔ה אֵינֶ֣/נּוּ שֹׁמֵ֔עַ בְּ/ק֥וֹל אָבִ֖י/ו וּ/בְ/ק֣וֹל אִמּ֑/וֹ וְ/יסְּר֣וּ אֹת֔/וֹ וְ/לֹ֥א יִשְׁמַ֖ע אֲלֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/018.yaml
  text: If a man has a stubborn and rebellious son who does not listen to the voice of his father or to the voice of his mother[a], and though they discipline him, he does not listen to them[d][c][b],
translation:
  language: zh_hans
  text: 人若有顽梗悖逆的儿子，不听从父亲和母亲的话[a]；父母管教他，他仍不听从他们[b]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“父亲的声音和母亲的声音”，意思是父母所作的权威性吩咐。句首“若”也可译作“当……时”。
    reason: 说明希伯来语习语，并保留个案律法引导词的另一种可能译法。
  - marker: b
    text: “听从”兼有听取和服从的意思。“父母管教他”也可按上下文译作“尽管父母管教他”。
    reason: 说明שׁמע的语义，并保留连接词可按让步关系理解的歧义。
lexical_decisions:
- source_word: כִּי
  choice: 如果
  rationale: 此词引出个案律法的条件，译作“如果”自然准确；也可理解为“当……时”。
- source_word: יִהְיֶה לְאִישׁ
  choice: 一个人有
  rationale: 希伯来文以“有于某人”的结构表达领有关系，现代汉语自然译为“一个人有”。
- source_word: בֵּן
  choice: 儿子
  rationale: 原词明确指男性后代，应保留其性别所指。
- source_word: סוֹרֵר וּמוֹרֶה
  choice: 顽梗悖逆
  rationale: 两个并列词共同描写持续抗拒、不肯顺服；“顽梗悖逆”保留叠加的强调，也符合庄重的律法语体。
- source_word: אֵינֶנּוּ שֹׁמֵעַ
  choice: 不听从
  rationale: שׁמע在这里不只是听见，更含听命、服从之意；“听从”兼顾听与服从。
- source_word: בְּקוֹל אָבִיו וּבְקוֹל אִמּוֹ
  choice: 父亲和母亲的话
  rationale: 原文直译为“父亲的声音和母亲的声音”，这里是指父母带权威的吩咐；译为“话”更符合现代汉语。
- source_word: וְיִסְּרוּ אֹתוֹ
  choice: 父母管教他
  rationale: יסר指纠正性的管教，不必然指身体惩罚。连接词按其直接并列义译出，不在正文中强行处理为让步关系。
- source_word: וְלֹא יִשְׁמַע אֲלֵיהֶם
  choice: 他仍不听从他们
  rationale: 重复“听从”以保留原文שׁמע的复现；“仍”清楚表达管教之后持续拒绝的语境关系。
theological_decisions:
- issue: 父母权威与儿子的拒绝
  choice: 以“听从”表达原文兼含聆听与服从的意义
  alternative: 仅译为“听”或直接译为“服从”
  rationale: 既不把经文弱化为单纯听觉行为，也不完全抹去原文以“听”表达顺服的语义特点。
- issue: 管教的性质
  choice: 译作“管教”
  alternative: 责打、惩罚、训诫
  rationale: 原词范围包括纠正、训导和惩戒；“管教”保留其教育和纠正性质，避免无根据地限定具体手段。
translation_notes:
  register: 采用现代、庄重而易懂的律法语体。“顽梗悖逆”保留原文两个近义词的加强效果；“听从”在两处重复，以反映原文用词复现。正文保留句末逗号，因为本节句法延续至下一节。
