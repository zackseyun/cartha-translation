  text: Then they shall answer and say[a], ‘Our hands did not shed this blood[b], and our eyes did not see it.’
translation:
  language: zh_hans
  text: 他们要回答说：“这血不是我们亲手流的，我们的眼睛也没有看见这事。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָנוּ וְאָמְרוּ
  choice: 他们要回答说
  rationale: 保留“回答”和“说”这一正式宣告用语；在本段礼仪兼司法程序中，“要”自然表达规定的行动。
- source_word: יָדֵינוּ
  choice: 我们的手
  rationale: 保留希伯来文具体的身体部位表达；“手”在这里指亲手实施并承担直接责任。
- source_word: לֹא שָׁפְכָה אֶת־הַדָּם הַזֶּה
  choice: 没有流这血
  rationale: שפך דם是“流血、杀人”的惯用语；直译“这血”保留原文具体而凝练的法律措辞，没有擅自补成“这人的血”或“这桩流血事件”。
- source_word: וְעֵינֵינוּ לֹא רָאוּ
  choice: 我们的眼睛也没有看见
  rationale: 保留“眼睛”这一身体部位表达以及原文未明说宾语的特点；在上下文中，这是对亲眼看见或知悉凶杀经过的否认。
theological_decisions:
- issue: 长老宣告所否认的责任范围
  choice: 保留“手没有流血”与“眼睛没有看见”两层具体表述
  alternative: 概括为“我们没有杀人，也不知道是谁做的”
  rationale: 原文分别否认直接实施和亲眼看见，却没有明确断言他们完全不知道凶手是谁；概括译法会缩小或扩大原文的法律含义。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“回答说”体现正式回应；保留“手”“眼睛”和“这血”的希伯来式具体表达，并借脚注说明其法律语用。
