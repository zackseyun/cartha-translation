  text: 'And of Dan he said: “Dan is a lion’s cub[a]; he leaps out from Bashan.”'
translation:
  language: zh_hans
  text: '论到但，他说：


    “但如幼狮，

    从巴珊跃出。[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他从巴珊一跃而出。”希伯来语动词表示突然跃起或跳出的动作。
    reason: 词义存在可自然表达为“跃出”或“一跃而出”的空间；脚注保留这一动作色彩的译法选择。
lexical_decisions:
- source_word: וּלְדָן
  choice: 论但
  rationale: 介词 לְ 在连续祝福的引介公式中表示“关于、论到”；“论但”简洁自然，也保留了原文转换到下一支派的结构。
- source_word: אָמַר
  choice: 他说
  rationale: 按常用叙述用语直译，清楚保留说话公式。
- source_word: דָּן
  choice: 但
  rationale: 采用该支派及其祖先名字在现代中文圣经中的通行译名。
- source_word: גּוּר אַרְיֵה
  choice: 幼狮
  rationale: 该组合指年幼的狮子；“幼狮”比“狮子崽”更适合庄重诗体，同时准确保留年龄意象。
- source_word: יְזַנֵּק
  choice: 蹿出
  rationale: 此动词描写突然跃起或冲出的动作；“蹿出”生动地保留突发性，又不把动作进一步限定为扑向猎物。
- source_word: מִן הַבָּשָׁן
  choice: 从巴珊
  rationale: מִן 表示动作的来源或起点；“巴珊”采用通行地名译法。
