  text: and with the choicest produce of the sun[a], and with the yield of the months[b],
translation:
  language: zh_hans
  text: '又得太阳所带来的上好物产[a]，

    又得各月所带来的上好出产[b]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“太阳所赐的珍宝”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来原文作“月份”；这个词与“月亮”相关，可能让人联想到随月份循环而生出的物产。
    reason: cultural_note
lexical_decisions:
- source_word: מֶגֶד
  choice: 上好／丰美
  rationale: 该词在祝福语境中表示珍贵、美好而丰盛的出产。两处分别译作“上好”和“丰美”，使汉语自然，又保留平行句的意义对应。
- source_word: תְּבוּאֹת
  choice: 物产
  rationale: 指土地所出产之物，范围比“庄稼”或一次性的“收成”更广，适合这里概括性的农业祝福。
- source_word: שָׁמֶשׁ
  choice: 太阳
  rationale: 按通常词义翻译；在此与作物生长相联系，用“太阳孕育”自然表达其促成生长的作用。
- source_word: גֶּרֶשׁ
  choice: 出产
  rationale: 这是较少见的词，基本意象是被推出、催生出来之物；“出产”能与上句“物产”构成农业语义上的平行，也避免生硬直译。
- source_word: יְרָחִים
  choice: 月月
  rationale: 复数通常指月份，同时与“月亮”一词相关。“月月”既表达按月循环，又在汉语中自然呈现不断有出产的意思；其月亮意象留在脚注说明。
