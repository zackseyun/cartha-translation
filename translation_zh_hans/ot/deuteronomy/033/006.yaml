  yaml_path: translation/ot/deuteronomy/033/006.yaml
  text: May Reuben live and not die[a], and may his men be few.
translation:
  language: zh_hans
  text: 愿流便存活，不致死亡；愿他的族人寥寥无几。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“愿他的族人得以列在数内。”希伯来文末句难解；也有人理解为祈求流便不致变得无足轻重，或不被排除在各支派的统计之外。
    reason: 保留末句在希伯来文中的真实歧义及主要替代读法。
lexical_decisions:
- source_word: יְחִי
  choice: 愿……存活
  rationale: חיה的Qal祈愿式表达祝愿；“愿……存活”既保留祈愿语气，也自然庄重。
- source_word: רְאוּבֵן
  choice: 吕便
  rationale: 采用现代中文圣经中通行的人名音译。此处人名同时代表由他而出的支派。
- source_word: וְאַל יָמֹת
  choice: 不至死亡
  rationale: אַל加祈愿式表达否定愿望；“不至死亡”紧接前句，与“存活”构成清楚的对应，并保留מות的基本意义。
- source_word: וִיהִי
  choice: 愿……
  rationale: 第二个祈愿式引出另一项祝愿；中文再次用“愿”显明其祈愿性质。
- source_word: מְתָיו
  choice: 他的人数
  rationale: מְתָיו通常可理解为“他的人／他的男丁”。与מִסְפָּר连用时，中文合译为“他的人数”较自然；这里指吕便支派的人，而非死者。
- source_word: מִסְפָּר
  choice: 寥寥
  rationale: 该词本义与“数目、可数”有关，在此可指人数少、屈指可数。“寥寥”表达最可能的含义，同时脚注保留“列入数目”的另一种理解。
theological_decisions:
- issue: 末句 וִיהִי מְתָיו מִסְפָּר 的解释
  choice: “愿他的人数寥寥”，即吕便虽人数不多，仍得以存续。
  alternative: “愿他的人被列入数目”，即不从支派的统计或名册中被排除。
  rationale: 马所拉文本简短而难解。将מִסְפָּר理解为“数目有限、可数”，最直接地保留经文中存活却人数稀少的张力；不借文本校订将其改成更有利的祝福。主要替代解释收入脚注。
translation_notes:
  register: 采用现代、庄重而易懂的祝福语体。“存活／死亡”保留原文鲜明的对应；“人数寥寥”比“人数很少”略显凝练，适合诗歌性祝福。脚注标记[a]已置于相关末句之后。
