  terminology: “公义的祭”保留原文可指合宜、正当或公义之祭的开放性，脚注也适当地列出可能理解，未导入特定教义。“众民”可表达多个群体；“珍宝”在诗歌语境中可自然呈现隐藏、埋藏之物所蕴含的财富意象。术语与英文审计轨迹一致，且没有不当消除歧义。
