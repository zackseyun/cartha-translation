source:
  edition: WLC
  text: עַמִּים֙ הַר יִקְרָ֔אוּ שָׁ֖ם יִזְבְּח֣וּ זִבְחֵי צֶ֑דֶק כִּ֣י שֶׁ֤פַע יַמִּים֙ יִינָ֔קוּ וּ/שְׂפוּנֵ֖י טְמ֥וּנֵי חֽוֹל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/019.yaml
  text: They will call peoples to the mountain[a]; there they will sacrifice righteous sacrifices[c][b], for they will draw from the abundance of the seas and from the hidden treasures of the sand.
translation:
  language: zh_hans
  text: 他们要召唤众民上山[a]，在那里献上公义的祭[b]；因为他们要吸取海中的丰盛[c]，以及沙中深藏的珍宝[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“召唤众民到一座山上。”原文没有说明这山是哪一座。
    reason: alternative_reading
  - marker: b
    text: “公义的祭”也可理解为“正当的祭”或“在公义中所献的祭”。
    reason: lexical_alternative
  - marker: c
    text: “吸取”原文直译为“吸吮”，以此比喻从海洋获得供应或财富。
    reason: lexical_alternative
  - marker: d
    text: 原文连续使用两个表示隐藏或埋藏的词；也可译为“沙中隐藏之物”，可能泛指海滨或沙地所蕴藏的资源。
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמִּים
  choice: 众民
  rationale: 保留复数集合名词所指的多个群体，不把范围扩大为原文未明说的“万民”，也不限定为现代政治意义上的“各国”。
- source_word: הַר
  choice: 山
  rationale: 希伯来文未说明是哪一座山；中文“上山”自然表达方向，又不擅自认定为锡安山、西奈山或某处圣山。
- source_word: יִקְרָאוּ
  choice: 召唤
  rationale: קרא在此可表示呼唤、召集或邀请；“召唤”保留其较宽的语义范围。
- source_word: זִבְחֵי צֶדֶק
  choice: 公义的祭
  rationale: 直译构造短语，并保留צֶדֶק可能兼有正当、合宜及公义的含义，不把它限定为某一种后来的教义解释。
- source_word: שֶׁפַע יַמִּים
  choice: 海中的丰盛
  rationale: שֶׁפַע表示丰富、充盈；此译不限定其究竟是海产、贸易收益还是其他财富。复数“众海”在现代中文中生硬，故按集合意义译为“海中”。
- source_word: יִינָקוּ
  choice: 吸取
  rationale: 保留动词“吸吮、吃奶”的诗性意象，同时“吸取”在现代中文中也能自然表示从海洋获得供应或财富。
- source_word: וּשְׂפוּנֵי טְמֻנֵי חוֹל
  choice: 以及沙中深藏的珍宝
  rationale: 两个相近的隐藏、埋藏用语形成强化效果；“深藏”体现这一效果，“珍宝”则自然表达所藏之物，而不具体断定为何种资源。
theological_decisions:
- issue: “公义的祭”的性质
  choice: 保留为“公义的祭”
  alternative: “正当的祭”或“在公义中所献的祭”
  rationale: 原文可强调祭本身合宜蒙悦纳，也可涉及献祭者在公义中献祭；正文不将其纳入某一后期神学体系。
- issue: “山”的所指
  choice: 不指明具体山名
  alternative: 锡安山、山上的圣所或他们境内的山
  rationale: 本节没有明确山的身份，补出专名会消除原文的真实含混。
- issue: 海与沙中财富的具体内容
  choice: 保持概括性的诗歌表达
  alternative: 解释为海产、航海贸易、玻璃原料、紫色染料或其他矿产
  rationale: 原文只描写海的丰盛和沙中所藏之物，不能据此确定具体资源。
translation_notes:
  register: 采用现代、庄重而易懂的普通话，保留希伯来诗歌的平行结构和“吸取”的意象。正文不补出具体山名，也不把海与沙中的资源具体化；分号呈现因果转折前后的诗行关系。
