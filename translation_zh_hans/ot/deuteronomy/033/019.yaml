  source_fidelity: 正文准确反映希伯来文的主要语义与诗歌意象：“召唤众民上山”保留了יִקְרָאוּ的呼唤／召集含义及“山”未获明确指认的状态；“在那里献上公义的祭”对应献祭与צֶדֶק的修饰关系；“吸取海中的丰盛”恰当保留יִינָקוּ（吸吮）的比喻性获益意象；“沙中深藏的珍宝”也传达了连续的“隐藏／埋藏”措辞。没有把山、海洋资源或沙中所藏之物过度具体化。
