base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/003.yaml
  text: Indeed[a], he loves the peoples; all his holy ones are in your hand, and they sit down at your feet[b]; each receives your words.
translation:
  language: zh_hans
  text: '他实在疼爱众民；


    他的一切圣者都在你手中。


    他们坐在你脚前[a]，


    各自领受你的话语[b]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “坐”所译的希伯来词意义不确定，也可理解为“聚集”“蹲伏”，甚至“被击倒”。
    reason: alternative_reading
  - marker: b
    text: 也可译作“各自从你的话语中取受”或“各自承载你的言语”；原文这一表达罕见而难解。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף
  choice: 实在
  rationale: 此处主要是加强语气的肯定语气词；“实在”自然地表达强调，而不把它限定为附加意义的“也”或“甚至”。
- source_word: חֹבֵב
  choice: 疼爱
  rationale: 分词表示持续的爱与眷顾。“疼爱”保留亲切、珍爱的意味，也符合现代汉语诗体表达。
- source_word: עַמִּים
  choice: 众民
  rationale: 原文为复数，可指多个民族或群体。“众民”保留集合性的复数含义，又不预先将所指限定为外邦列国。
- source_word: כָּל קְדֹשָׁיו
  choice: 他所有的圣者
  rationale: “圣者”直接表达分别为圣者，且不具体断定是天使、以色列人或其他群体；后缀按第三人称阳性单数译为“他的”。
- source_word: בְּיָדֶךָ
  choice: 在你手中
  rationale: 保留原文手的意象，也可自然表达处于保护或权能之下；同时保留诗句由第三人称转为第二人称的变化。
- source_word: תֻּכּוּ
  choice: 伏
  rationale: 此词形意义极不确定。结合“在你脚前”及随后领受话语的场景，“伏”可表达俯伏、蹲坐或安坐于脚前的姿态，同时以脚注保留其他解释。
- source_word: לְרַגְלֶךָ
  choice: 在你脚前
  rationale: 这是现代汉语中自然的空间表达，可传达亲近聆听、顺服或俯伏的形象。
- source_word: יִשָּׂא
  choice: 领受
  rationale: 此动词基本义为举起、承担或拿取；与“话语”搭配时，“领受”最能自然表达接受教诲的可能语境。动词为单数，译作“各自”体现群体中每一位领受者。
- source_word: מִדַּבְּרֹתֶיךָ
  choice: 你的话语
  rationale: 该词罕见且结构困难，显然与言说有关。“话语”庄重而易懂；前缀 מִן 可能有“从……中”的部分义，相关可能性在脚注中说明。
theological_decisions:
- issue: 诗句中指称和人称的转换
  choice: 保留“他疼爱……他的圣者……你手中……你脚前……你的话语”的转换
  alternative: 全部统一为第三人称，或全部统一为第二人称
  rationale: 原文在诗歌中确有第三人称与第二人称的转换。统一人称虽然更顺畅，却会消除原文真实存在的张力。
- issue: “圣者”的所指
  choice: 使用宽泛的“圣者”，不进一步指明身份
  alternative: 译为“圣民”“圣徒”或“天使”
  rationale: 上下文本身没有迫使读者只理解为天使或以色列民；宽泛译法避免加入特定神学判断。
- issue: “众民”的范围
  choice: 保留复数而不限定为外邦民族
  alternative: 译为“列国”或仅指以色列各支派
  rationale: עַמִּים 可指多个民族或群体，本节并未明确排除或锁定某一范围，故不在正文中缩窄。
translation_notes:
  register: 采用简洁、庄重而现代的诗体汉语，以分行呈现平行结构。“众民”“圣者”“话语”既容易理解，又保留原文范围与所指的开放性。正文不规整原文的人称转换；两个疑难词的主要替代解释置于脚注。
