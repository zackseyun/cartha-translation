source:
  edition: WLC
  text: אַשְׁרֶ֨י/ךָ יִשְׂרָאֵ֜ל מִ֣י כָמ֗וֹ/ךָ עַ֚ם נוֹשַׁ֣ע בַּֽ/יהוָ֔ה מָגֵ֣ן עֶזְרֶ֔/ךָ וַ/אֲשֶׁר חֶ֖רֶב גַּאֲוָתֶ֑/ךָ וְ/יִכָּֽחֲשׁ֤וּ אֹיְבֶ֨י/ךָ֙ לָ֔/ךְ וְ/אַתָּ֖ה עַל בָּמוֹתֵ֥י/מוֹ תִדְרֹֽךְ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/029.yaml
  text: Blessed are you[a], Israel! Who is like you, a people saved by Yahweh, the shield of your help and the sword of your majesty? Your enemies will come cringing to you[b], and you will tread on their high places.
translation:
  language: zh_hans
  text: 以色列啊，你多么有福！谁能像你？你是蒙雅威拯救的百姓；他是帮助你的盾牌，也是你威荣的刀剑。你的仇敌必向你屈服[a]；你必踏在他们的高地上[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你的仇敌必假意顺服你。”希伯来语动词可表示被迫、畏缩或虚假的归服。
    reason: lexical_alternative
  - marker: b
    text: 或译：“你必践踏他们的高处（或据点）。”有人将这里理解为“他们的背”，但“高处、高地”是这个希伯来语名词较直接的含义。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁרֶיךָ
  choice: 你多么有福
  rationale: אַשְׁרֵי是表达福乐、可羡状态的感叹语；“你多么有福”既体现感叹语气，也保留庄重而正面的祝福色彩。
- source_word: מִי כָמוֹךָ
  choice: 谁能像你
  rationale: 这是表达无可比拟的反问；现代汉语加“能”更自然，不改变原意。
- source_word: עַם נוֹשַׁע בַּיהוָה
  choice: 蒙雅威拯救的百姓
  rationale: נוֹשַׁע是尼法勒分词，描述以色列是由雅威拯救、以此为特征的百姓；“蒙……拯救”自然表达被动含义。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按其作为以色列上帝专名的功能音译，区别于“主”这一称号。
- source_word: מָגֵן עֶזְרֶךָ
  choice: 帮助你的盾牌
  rationale: 原文结构紧凑，意指雅威是施行帮助、保护以色列的盾牌；此译保留盾牌意象，同时比直译“你帮助的盾牌”清楚。
- source_word: וַאֲשֶׁר חֶרֶב גַּאֲוָתֶךָ
  choice: 是使你得尊荣的刀剑
  rationale: 此句承接前面的同位描述，省略的系词在汉语中补出。גַּאֲוָה在此为正面的尊荣、显赫，并非道德意义上的骄傲；“使你得尊荣”也传达这一刀剑与以色列被高举之间的关系。
- source_word: וְיִכָּחֲשׁוּ אֹיְבֶיךָ לָךְ
  choice: 你的仇敌必向你屈服
  rationale: כחשׁ在此语境可指被迫、畏缩或不真诚的归服。“屈服”自然表达主要意义，假意顺服的语义可能性留在脚注中。
- source_word: עַל בָּמוֹתֵימוֹ תִדְרֹךְ
  choice: 你必踏过他们的高地
  rationale: בָּמוֹת的直接含义是高处、高地；在军事诗歌中也可指敌人的据点。译作“高地”保留空间和征服意象，又避免无根据地限定为祭祀场所。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文使用的是神的专名，而非“主”这一称号；“雅威”按较通行的学术复原音译，保留专名性质。
- issue: גַּאֲוָתֶךָ 的褒贬色彩
  choice: 使你得尊荣
  alternative: 你的威荣；你的骄傲；使你高升
  rationale: 上下文是对以色列的祝福，此词在这里表达正面的高举与尊荣。译文避免现代汉语“骄傲”可能带来的负面道德判断，但不将其扩展为原文没有明说的具体教义。
- issue: 仇敌归服是否真诚
  choice: 正文译“屈服”，脚注保留“假意顺服”
  alternative: 直接译作“假意顺服”或“畏缩投降”
  rationale: 希伯来动词可兼有被迫屈服和虚假归顺的意味。正文采用涵盖面较广的表达，脚注说明较尖锐的语义可能，避免过早消除原文张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。以短句和反问保留摩西祝福的诗歌气势；避免生硬照搬希伯来语构造，同时保留盾牌、刀剑和踏过高地等核心意象。所有脚注标记均置于正文相应词句之后。
