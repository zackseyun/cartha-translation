  text: אֵ֥ין כָּ/אֵ֖ל יְשֻׁר֑וּן רֹכֵ֤ב שָׁמַ֨יִם֙ בְ/עֶזְרֶ֔/ךָ וּ/בְ/גַאֲוָת֖/וֹ שְׁחָקִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/026.yaml
  text: There is none like God[a], O Jeshurun, who rides on the heavens to help you[c][b], and in his majesty on the skies.
translation:
  language: zh_hans
  text: 耶书仑[a]啊，没有谁像上帝！他驾行诸天来帮助你[b]，威严地驾行云霄[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “耶书仑”是以色列的诗性名称。
    reason: cultural_note
  - marker: b
    text: 或译：“作你的帮助。”
    reason: lexical_alternative
  - marker: c
    text: “云霄”也可译为“高空”或“云层”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין כָּאֵל
  choice: 没有谁像上帝
  rationale: אֵין是否定存在句，配合比较前缀כ，表达绝对的无可比拟；译为“没有谁像上帝”自然、庄重，也保留诗歌的赞颂力度。
- source_word: יְשֻׁרוּן
  choice: 耶书仑
  rationale: 这是以色列的诗性名称，按专名音译，并以“啊”明确呼格功能。
- source_word: רֹכֵב שָׁמַיִם
  choice: 驾行诸天
  rationale: רֹכֵב为分词，描绘上帝以驾乘者之姿行于天上；“驾行”比单纯“乘坐”更适合这里宏伟而动态的诗歌意象，“诸天”对应复数שָׁמַיִם。
- source_word: בְעֶזְרֶךָ
  choice: 来帮助你
  rationale: 介词ב与“帮助”连用，在本句中可表达目的或使受益的关系；“来帮助你”是清楚自然的现代汉语，同时保留“作你的帮助”这一较形式对应的可能性于脚注。
- source_word: וּבְגַאֲוָתוֹ
  choice: 威严地
  rationale: גַּאֲוָה用于上帝时指崇高、威荣或威严；用状语“威严地”自然修饰下半句省略而承接的“驾行”，避免汉语“在他的威严中”的生硬表达。
- source_word: שְׁחָקִים
  choice: 云霄
  rationale: 该诗性复数词指高空、天空，也可涉及云层；“云霄”既与“诸天”形成平行，又保留崇高诗体。
theological_decisions:
- issue: 诗歌比较句中אֵל的所指与译法
  choice: 作为通用神圣称号译为“上帝”
  alternative: 音译为“埃勒”或译为“大能者”
  rationale: 本节宣告以色列的上帝无可比拟；此处אֵל最自然地用作通用神圣称号，而非要求音译的专名。译为“上帝”既符合上下文，也不额外引入另一位具名神祇。
- issue: יְשֻׁרוּן在句法上是呼语还是与“上帝”构成属格关系
  choice: 按呼语处理：“耶书仑啊”
  alternative: 理解为“耶书仑的上帝”
  rationale: 马所拉重音与常见诗歌句法支持将יְשֻׁרוּן读作直接称呼；这样下文第二人称“你”也有清楚的先行对象。另一种属格理解虽可提出，但较不符合重音划分。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语体。“没有谁像上帝”直陈无可比拟；“驾行诸天／驾行云霄”保留希伯来诗句的平行结构与宏伟意象。下半句在汉语中补出承接的“驾行”，使省略关系清楚而不改变原意。
