base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/008.yaml
  text: 'And of Levi he said: “Your Thummim and your Urim belong to your faithful one[a], whom you tested at Massah[b], with whom you contended at the waters of Meribah.”'
translation:
  language: zh_hans
  text: '论利未，他说：


    “你的土明和乌陵归你的忠信者[a]；


    你曾在玛撒试验他，


    在米利巴水与他争辩[b]。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “忠信者”也可译作“敬虔的人”或“忠贞的人”。希伯来语可指以圣约忠诚为特征的人。
    reason: lexical_alternative
  - marker: b
    text: “玛撒”意为“试验”；“米利巴”与“争辩、争闹”一词相关。参出埃及记17:1—7；民数记20:1—13。
    reason: cross_reference
lexical_decisions:
- source_word: וּלְלֵוִי
  choice: 论利未
  rationale: לְ在连续祝福的引言中标明谈论对象；“论利未”简洁自然，也保留这是对利未支派所发之言的语境。
- source_word: תֻּמֶּיךָ וְאוּרֶיךָ
  choice: 你的土明和乌陵
  rationale: 两词是成对出现的祭司专用术语，具体形制和运作方式并不完全确定，因此采用中文圣经语境中可辨识的音译，不按词源释作“完全”和“光明”。
- source_word: לְאִישׁ חֲסִידֶךָ
  choice: 归你的忠信者
  rationale: 无动词分句以“归”补足汉语句法；חָסִיד表示以忠诚、坚贞为特征的人。“忠信者”既保留单数人物指称，也不擅自断定是亚伦、利未本人或整个支派。
- source_word: אֲשֶׁר נִסִּיתוֹ
  choice: 你曾……试验他
  rationale: נסה的皮埃勒词干在此表示考验、试验；“试验”也与地名玛撒的词源呼应。
- source_word: בְּמַסָּה
  choice: 在玛撒
  rationale: 按专名音译，保留经文对旷野事件的指涉；其“试验”含义交由脚注说明。
- source_word: תְּרִיבֵהוּ
  choice: 与他争辩
  rationale: ריב在此表示争执、争讼或相争；“与他争辩”保持第二人称神与该人物之间直接冲突的语法关系，而不改写事件主体。
- source_word: עַל מֵי מְרִיבָה
  choice: 在米利巴水边
  rationale: עַל在事件地点表达中可作地点性理解；“在……水边”是自然中文，并保留米利巴这一专名。
theological_decisions:
- issue: “你的忠信者”所指何人
  choice: 保持单数而不明确认定具体人物
  alternative: 明确译为亚伦、利未祖先，或利未支派整体
  rationale: 希伯来文使用单数“人/忠信者”，但上下文和相关旷野传统容许多种所指。译文不替原文消除这种神学与历史指涉上的张力。
- issue: 试验与争辩的主语关系
  choice: 依语法保留“你”试验他、与他争辩
  alternative: 按相关叙事解释为以色列人试探上帝，或摩西、亚伦与百姓争执
  rationale: 两个动词均以第二人称单数为主语，并带第三人称单数宾语。尽管相关事件的叙事关系复杂，正文应保留本节本身直接表达的关系。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。保留诗歌行分布和第二人称直述；“土明、乌陵、玛撒、米利巴”均按通行圣经专名处理。脚注标记[a]、[b]均已置于正文对应位置。
