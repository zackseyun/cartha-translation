  text: וַ/יְהִ֥י בִ/ישֻׁר֖וּן מֶ֑לֶךְ בְּ/הִתְאַסֵּף֙ רָ֣אשֵׁי עָ֔ם יַ֖חַד שִׁבְטֵ֥י יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/005.yaml
  text: And he was king in Jeshurun[a], when the heads of the people gathered together[c][b], the tribes of Israel as one.
translation:
  language: zh_hans
  text: 他在耶书仑作王[a]；那时，百姓的首领和以色列各支派一同聚集[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文没有明确指出“他”是谁。或译：“耶和华在耶书仑作王”；也有人理解为：“摩西在耶书仑作王。”“耶书仑”是以色列的诗体名称。
    reason: 保留主语所指的歧义，并解释专名。
  - marker: b
    text: 原文的句式较为紧凑。或译：“那时，百姓的首领聚集，以色列各支派同心合一。”
    reason: 说明压缩诗句中“以色列各支派”与前句的另一种句法关系。
lexical_decisions:
- source_word: וַיְהִי
  choice: 他……作
  rationale: היה与名词谓语“王”连用，可表达“是／作王”。译作“作王”符合现代汉语，也不强行判定是开始作王还是处于王的身份。希伯来文未明说主语是谁，因此保留“他”。
- source_word: בִישֻׁרוּן
  choice: 在耶书仑
  rationale: “耶书仑”是以色列的诗体名称，保留为专名；介词ב按群体或领域意义译为“在……”。
- source_word: מֶלֶךְ
  choice: 王
  rationale: 采用该名词的通常译法；原文只给出谓语“王”，并未明确指出所指人物。
- source_word: בְּהִתְאַסֵּף
  choice: 那时……聚集
  rationale: 带ב的反身式不定词结构在此具有时间意义。“那时……聚集”自然地表达“当……聚集时”。
- source_word: רָאשֵׁי עָם
  choice: 百姓的首领
  rationale: 字面为“百姓的头”，是指领导者的惯用语；“首领”既清楚又保留其正式色彩。
- source_word: יַחַד
  choice: 一同
  rationale: 该副词表示共同、联合；“一同”准确表达聚集时的合一性。
- source_word: שִׁבְטֵי יִשְׂרָאֵל
  choice: 以色列各支派
  rationale: 按通常意义翻译。此短语与“百姓的首领”在压缩的诗句结构中共同关联于聚集，译文用“和”清楚呈现两组参与者，同时以脚注保留另一种句法理解。
theological_decisions:
- issue: “他”及“王”所指何人
  choice: 正文保留“他”，不明确指认为耶和华或摩西
  alternative: “耶和华在耶书仑作王”或“摩西在耶书仑作王”
  rationale: 希伯来文的动词虽为阳性单数，却没有明说主语；上下文容许不同理解。正文应保存这一真实歧义，脚注说明主要解释。
- issue: 以色列联合聚集的性质
  choice: 仅陈述首领和各支派一同聚集
  alternative: 明确解释为登基典礼或立约大会
  rationale: 原文强调聚集和团结，却没有明确界定其政治或礼仪性质，因此不加入特定制度性解释。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“作王”比“成为王”更少限定起始意义，也比单说“是王”更符合汉语圣经语体。正文保留未明说主语的代词，并将专名与句法信息放入紧随对应标记的脚注。
