  text: וְ/זֹ֣את הַ/בְּרָכָ֗ה אֲשֶׁ֨ר בֵּרַ֥ךְ מֹשֶׁ֛ה אִ֥ישׁ הָ/אֱלֹהִ֖ים אֶת בְּנֵ֣י יִשְׂרָאֵ֑ל לִ/פְנֵ֖י מוֹתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/001.yaml
  text: 'This is the blessing with which Moses[a], the man of God, blessed the sons of Israel before his death:'
translation:
  language: zh_hans
  text: 这是摩西——上帝的人——在死前给以色列子孙[a]的祝福：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“以色列的众子”，是统指以色列全体民众的惯用说法。
    reason: 说明原文的性别形式与集体指称范围。
lexical_decisions:
- source_word: וְזֹאת
  choice: 这是
  rationale: וְ在此承接并引出新段落；现代汉语用“这是”自然开启本段，不另加带时间意味的“现在”。
- source_word: הַבְּרָכָה אֲשֶׁר בֵּרַךְ
  choice: 所祝的福
  rationale: 保留名词“福”与同根动词“祝”的呼应，并以“所”字结构自然表达修饰关系。
- source_word: מֹשֶׁה
  choice: 摩西
  rationale: 采用通行的中文圣经人名译法。
- source_word: אִישׁ הָאֱלֹהִים
  choice: 上帝的人
  rationale: 直译这一表示蒙上帝差遣之人的称号；比“神人”更透明，也避免现代汉语中“神人”可能产生的超人或神秘人物联想。
- source_word: אֶת בְּנֵי יִשְׂרָאֵל
  choice: 以色列子孙
  rationale: 保留原文“以色列的众子”所含的家族和后裔意象；中文“子孙”可自然地统指以色列群体。
- source_word: לִפְנֵי מוֹתוֹ
  choice: 在死前
  rationale: 直接表达原文的时间短语，且不把范围缩窄为紧临死亡的时刻。
theological_decisions:
- issue: אִישׁ הָאֱלֹהִים这一称号的表达
  choice: 上帝的人
  alternative: 神人
  rationale: 选择透明的所有关系表达，保留摩西与上帝之间的归属或委任关系，同时不把他描写成具有神性的存在。
- issue: בְּנֵי יִשְׂרָאֵל的性别与群体范围
  choice: 以色列子孙
  alternative: 以色列众子／以色列人
  rationale: “子孙”保留血缘后裔的集体意象，又能按希伯来语惯用法涵盖整个以色列群体；脚注说明其集体用法，避免读者误以为仅指男性。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。“所祝的福”保留原文名词与同根动词的修辞呼应；句末冒号表明下文是祝福的具体内容。
