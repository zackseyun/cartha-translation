- from: 于是，以色列安然独居[b]；雅各的泉源[a]在五谷和新酒之地；他的天空也滴下甘露。
  to: 以色列安然独居[b]；雅各的泉源[a]在五谷和新酒之地；他的天也滴下露水。
  rationale: 修订仅除去较强的连接词“于是”，将“甘露”改为不增义的“露水”，并微调“天空”为诗歌中较紧凑的“天”。同时将脚注中的替代义项改为更直接对应原文单数词的“雅各的眼”。保留原译对“雅各的泉源”及其句法张力的处理。
