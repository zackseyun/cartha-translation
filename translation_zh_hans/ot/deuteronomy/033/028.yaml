  text: וַ/יִּשְׁכֹּן֩ יִשְׂרָאֵ֨ל בֶּ֤טַח בָּדָד֙ עֵ֣ין יַעֲקֹ֔ב אֶל אֶ֖רֶץ דָּגָ֣ן וְ/תִיר֑וֹשׁ אַף שָׁמָ֖י/ו יַֽעַרְפוּ טָֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/028.yaml
  text: So Israel lived in safety[a], alone; Jacob's fountain in a land of grain and new wine[b]; even his heavens dripped dew.
translation:
  language: zh_hans
  text: 以色列安然独居[b]；雅各的泉源[a]在五谷和新酒之地；他的天也滴下露水。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “泉源”所译的希伯来词也可指“眼”，因此也可译作“雅各的眼”。这里按五谷、新酒和露水所构成的丰饶意象译作“泉源”。
    reason: lexical_alternative
  - marker: b
    text: “安然独居”也可译作“安然居住，独自一处”。“独”在这里强调安稳、分别而居，不一定含有孤苦之意。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁכֹּן
  choice: 居
  rationale: שׁכן表示居住、定居；与“安然独居”连用，既贴近原文，又符合现代汉语的庄重诗体。
- source_word: בֶּטַח
  choice: 安然
  rationale: 此处作状语，表示安全、稳妥的居住状态；“安然”简洁自然。
- source_word: בָּדָד
  choice: 独居
  rationale: בָּדָד强调单独、分别而居；上下文是祝福，因此不表达被遗弃或孤苦，而是安稳、不受侵扰的独立状态。
- source_word: עֵין יַעֲקֹב
  choice: 雅各的泉源
  rationale: עֵין既可指“眼睛”，也可指“泉源”。后文提到五谷、新酒和甘露，农业丰饶的意象使“泉源”更合语境，同时以脚注保留另一词义。
- source_word: אֶל אֶרֶץ
  choice: 在……之地
  rationale: אֶל通常表示“向、到”，但诗歌中可表达关联或方位；汉语以“在”连接省略成分的诗句，传达其身处丰饶土地的意义。
- source_word: דָּגָן
  choice: 五谷
  rationale: דָּגָן泛指谷物出产；“五谷”是现代汉语中自然且具有诗意的总称，并不限定为五种具体作物。
- source_word: תִּירוֹשׁ
  choice: 新酒
  rationale: תִּירוֹשׁ常指新酿或新出的酒，“新酒”保留收获与丰饶的意象。
- source_word: אַף
  choice: 也
  rationale: אַף在此递进补充天上的福分；“也”自然呈现土地与天空共同带来丰饶的关系。
- source_word: שָׁמָיו
  choice: 他的天空
  rationale: 保留希伯来文第三人称单数所属后缀；“他的天空”指雅各或以色列上方、与他相关的天空，不额外判定具体所指。
- source_word: יַעַרְפוּ טָל
  choice: 滴下甘露
  rationale: יַעַרְפוּ描写液体滴落，טָל为露水；“滴下甘露”准确且保留祝福诗歌的形象。
theological_decisions:
- issue: עֵין יַעֲקֹב的理解
  choice: 正文译作“雅各的泉源”
  alternative: 雅各的眼目
  rationale: 这是词义和诗歌意象上的歧义，并非教义判断。五谷、新酒、甘露的语境支持“泉源”，但脚注保留“眼目”的可能。
- issue: בָּדָד的语气
  choice: 译作带有安全、分别而居意味的“独居”
  alternative: 独自一处；分别而居
  rationale: 祝福语境表明这里并非负面的孤立或被弃；译文不进一步解释这种分别状态的神学含义。
- issue: 诗句中“雅各的泉源”与前句的句法关系
  choice: 用分号保留松散的并列或同位关系，并以“在”使汉语可读
  alternative: 将“雅各的泉源”明确处理为“以色列”的同位语
  rationale: 希伯来诗句结构紧凑，既可把“雅各的泉源”与以色列紧密相连，也可视作后半句的主语；正文避免加入“就是”等明确同位标记，以保留张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。句式保留希伯来诗歌的紧凑和并列结构；“五谷”“甘露”维持祝福诗歌的质感，但避免生僻古语。
