  text: וְ/זֹ֣את לִֽ/יהוּדָה֮ וַ/יֹּאמַר֒ שְׁמַ֤ע יְהוָה֙ ק֣וֹל יְהוּדָ֔ה וְ/אֶל עַמּ֖/וֹ תְּבִיאֶ֑/נּוּ יָדָי/ו֙ רָ֣ב ל֔/וֹ וְ/עֵ֥זֶר מִ/צָּרָ֖י/ו תִּהְיֶֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/007.yaml
  text: 'And this he said for Judah: “Hear[a], Yahweh, the voice of Judah, and bring him to his people. Let his hands strive for him, and be a help against his adversaries.”'
translation:
  language: zh_hans
  text: '论犹大，他这样说：


    “雅威啊，求你垂听犹大的声音，

    带他到他的百姓中。

    愿他的双手为他争战[a]；

    求你帮助他抵挡仇敌。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“愿他的双手足以应付。”这句希伯来原文含义不明，可有不止一种理解。
    reason: 保留יָדָיו רָב לוֹ这一困难短句的主要替代解释，同时避免将“for him”过度具体化为“自助”。
lexical_decisions:
- source_word: וְזֹאת לִיהוּדָה וַיֹּאמַר
  choice: 论犹大，他这样说
  rationale: 将连接词、指示代词和介词短语按希伯来语祝福段落的引介功能表达，既标明对象，也自然引出摩西的话。
- source_word: שְׁמַע יְהוָה
  choice: 雅威啊，求你垂听
  rationale: שְׁמַע是祈求语气的命令式；“垂听”符合现代汉语祷告语体。יהוה按专名译作“雅威”。
- source_word: קוֹל יְהוּדָה
  choice: 犹大的声音
  rationale: 保留קוֹל的基本意象“声音”，不进一步限定为呼求、祷告或战场上的呐喊。
- source_word: וְאֶל עַמּוֹ תְּבִיאֶנּוּ
  choice: 带他到自己的百姓中
  rationale: 忠实表达使役形态“带……到”，并避免用“带回”预先断定这是出征后的归来。
- source_word: יָדָיו רָב לוֹ
  choice: 愿他的双手为他争战
  rationale: 该短句语法和词义均有困难；正文采用与下句军事语境相符的“争战”，并用“愿”体现祝祷语气，同时以脚注保留另一种主要理解。
- source_word: וְעֵזֶר מִצָּרָיו תִּהְיֶה
  choice: 求你帮助他抵挡仇敌
  rationale: 将隐含的第二人称主语明确为受呼求的雅威；מִן在此按敌对或解救关系译为“抵挡”，צָר译作“仇敌”。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；音译“雅威”保留其作为盟约之神专名的性质，而不以称号代替。
- issue: 难句יָדָיו רָב לוֹ的解释
  choice: 愿他的双手为他争战
  alternative: 愿他的双手足以自助
  rationale: 正文所选解释与后半句求助抵挡仇敌的语境和并行关系较为协调，但原文高度凝缩，不能排除“足够、有能力”的理解，因此在脚注中明确保留歧义。
- issue: “带他到自己的百姓中”是否表示归来
  choice: 不明确加入“回来”
  alternative: 带他回到自己的百姓中
  rationale: 原文动词本身表示“带到”，上下文可能暗示出征后归来，却没有明说；正文不替原文消除这一开放性。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“垂听”“仇敌”保持诗歌祝祷的尊严感；句式简洁，适合公开诵读。脚注标记紧随存在歧义的短句，而非置于无关词语之后。
