  naturalness: 整体庄重、自然，适合诗歌性祝祷语体。“愿他的双手为他争战”虽略带希伯来诗歌的凝缩感，仍可理解，且与脚注所保留的困难性相称。将“自己的百姓”改为“他的百姓”可消除汉语回指歧义。
