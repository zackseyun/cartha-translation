base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/013.yaml
  text: And of Joseph he said[a], “Blessed by Yahweh be his land, with the choicest things of heaven, with dew[b], and from the deep lying beneath,”
translation:
  language: zh_hans
  text: '论到约瑟，他说：


    “愿他的地蒙雅威赐福，


    得享天上宝贵之物[a]、甘露，


    以及伏卧在地下的深水[b]；”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “天上宝贵之物”也可译作“天上的上好之物”或“从天而来的珍贵之物”。
    reason: מֶגֶד指珍贵、上好之物；保留其概括性，避免限定为“礼物”或特定农产。
  - marker: b
    text: 这里的“深水”很可能指土地下面滋养地面的地下水。
    reason: 说明תְּהוֹם在此农业祝福意象中的可能所指，并保留“很可能”的审慎程度。
lexical_decisions:
- source_word: וּלְיוֹסֵף אָמַר
  choice: 论到约瑟，他说
  rationale: לְ与人名连用，引出针对约瑟的祝福；“论到”在现代中文中自然、庄重，也保留了分段引语的结构。
- source_word: מְבֹרֶכֶת יְהוָה אַרְצוֹ
  choice: 愿他的土地蒙雅威赐福
  rationale: 被动分词在祝福诗中可带祝愿语气；“蒙……赐福”自然表达土地是受福者，并将施福者明确为雅威。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文直接音译四字神名，不以称号替代。
- source_word: מִמֶּגֶד שָׁמַיִם
  choice: 得着天上宝贵之物
  rationale: מֶגֶד表示珍贵、美好或上佳之物；采用概括性的“宝贵之物”，避免把原文进一步限定为礼物或农产。
- source_word: מִטָּל
  choice: 就是甘露
  rationale: 把“甘露”理解为前句“天上宝贵之物”的具体说明；原文也可把它视为并列的另一项，因此以脚注保留句法可能性。
- source_word: וּמִתְּהוֹם רֹבֶצֶת תָּחַת
  choice: 也得着伏卧在地下的深水
  rationale: תְּהוֹם在此指深处的水域；“深水”避免把它误解为后世宗教意义上的无底坑。“伏卧”保留רֹבֶצֶת富有生命感的诗歌意象。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文使用以色列上帝的四字神名；“雅威”较贴近学界通常重构的读音，也不把专名改成“主”等称号。
- issue: מְבֹרֶכֶת 的陈述或祝愿语气
  choice: 愿……蒙……赐福
  alternative: 他的土地蒙雅威赐福
  rationale: 无系词的被动分词既可读作“是有福的”，也可在摩西祝福的诗体语境中表达祝愿。正文采用祝福语气，但不把施福内容作教义化扩展。
translation_notes:
  register: 采用现代、庄重而易懂的祝福诗体。分行保留希伯来诗歌的意象推进；“伏卧”刻意保留原文拟人化色彩。所有脚注标记均置于对应词语之后。
