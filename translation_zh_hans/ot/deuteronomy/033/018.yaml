base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/018.yaml
  text: And of Zebulun he said[a], “Rejoice, Zebulun, in your going out, and Issachar, in your tents.”
translation:
  language: zh_hans
  text: 论西布伦，他说：“西布伦哪，你出外时要欢喜[a]；以萨迦啊，你在帐棚里也要欢喜。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在你的出行上。”这里的希伯来语表达既可指西布伦出外的时候，也可指其活动或兴盛的领域。
    reason: 保留介词ב与不定式结构在时间、处境和活动领域之间的词义弹性，避免把原文限定为单一解释。
lexical_decisions:
- source_word: וְלִזְבוּלֻן
  choice: 论西布伦
  rationale: 介词ל在此引出对下一支派的祝福；“论西布伦”既准确表达“关于西布伦”，也符合现代汉语庄重的引语格式。
- source_word: אָמַר
  choice: 他说
  rationale: 按其常用叙事意义直译，并承接摩西对各支派所说的祝福。
- source_word: שְׂמַח
  choice: 要欢喜
  rationale: 保留阳性单数祈使语气；在支派祝福中，支派被视为一个整体来称呼。后半句省略的祈使动词在汉语中补出，以使意思清楚。
- source_word: זְבוּלֻן
  choice: 西布伦
  rationale: 采用现代中文圣经传统中通行的支派名译法。
- source_word: בְּצֵאתֶךָ
  choice: 你出外时
  rationale: 将介词ב与不定式结构自然译为时间或处境表达，同时以脚注保留其也可能表示活动领域或事业范围的含义。
- source_word: וְיִשָּׂשכָר
  choice: 以萨迦啊
  rationale: 与西布伦并列，作为第二个受呼告的支派；语气词“啊”清楚表现直接呼告。
- source_word: בְּאֹהָלֶיךָ
  choice: 你在帐棚里
  rationale: 保留原文复数“帐棚”的具体意象，并与前句“出外”形成对照；单数领属代词按支派整体理解。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留“出外—帐棚”的平行与对照；后半句补出原文省略而由上句统摄的“要欢喜”，使汉语表达完整。
