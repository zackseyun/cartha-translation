source:
  edition: WLC
  text: וַ/יֹּאמַ֗ר יְהוָ֞ה מִ/סִּינַ֥י בָּא֙ וְ/זָרַ֤ח מִ/שֵּׂעִיר֙ לָ֔/מוֹ הוֹפִ֨יעַ֙ מֵ/הַ֣ר פָּארָ֔ן וְ/אָתָ֖ה מֵ/רִבְבֹ֣ת קֹ֑דֶשׁ מִֽ/ימִינ֕/וֹ אשדת לָֽ/מוֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/002.yaml
  text: 'And he said: “Yahweh came from Sinai and dawned from Seir upon them[a]; he shone forth from Mount Paran, and came from myriads of holiness[b]; from his right hand came a fiery law for them.”'
translation:
  language: zh_hans
  text: '他说：


    “雅威从西奈而来，

    从西珥向他们升起；

    他从巴兰山放射光辉，

    从万千圣洁中[a]而来。

    他右手向他们发出火焰[b]。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语也可理解为“从万千圣者中”或“从神圣的万千中”；这里可能指随侍的圣者。
    reason: 保留מֵרִבְבֹת קֹדֶשׁ在抽象“圣洁”与群体“圣者”之间的歧义。
  - marker: b
    text: 本处希伯来词形疑难，意思不能确定；传统译作“火的律法”，也可能指烈火、火光，或从他右手发出的火。
    reason: 说明אשדת的文本及词义不确定性，避免把传统拆词解释无标记地写入正文。
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 以音译保留上帝启示给以色列的专名，不用称号替代。
- source_word: וְזָרַח מִשֵּׂעִיר לָמוֹ
  choice: 从西珥向他们如晨光升起
  rationale: זָרַח常用于日光升起、照耀；此译保留神显诗歌的晨光意象，也表达לָמוֹ所指向的对象。
- source_word: הוֹפִיעַ מֵהַר פָּארָן
  choice: 从巴兰山放射光辉
  rationale: 使役态הוֹפִיעַ表达灿然显现或发光；译文兼顾视觉意象与诗体力度。
- source_word: מֵרִבְבֹת קֹדֶשׁ
  choice: 从万千圣者中
  rationale: רִבְבֹת表示众多、万千；קֹדֶשׁ在此可理解为圣者组成的群体。中文若直译为“万千圣洁”不自然且意义晦涩，因此正文采用合乎语境的“圣者”，并以脚注保留抽象名词式理解。
- source_word: אשדת
  choice: 火焰
  rationale: 该连写形式极为疑难，可能与“火”及其喷发、闪耀有关，也传统上被拆解为“火的律法”。正文采用不过度限定具体形态的“火焰”，脚注说明文本困难及传统译法。
- source_word: לָמוֹ
  choice: 临到他们
  rationale: 表达第三人称复数所指对象，并与从右手发出的神显之火相协调；也可理解为“赐给他们”。
theological_decisions:
- issue: 诗歌神显中主体的身份
  choice: 以“雅威”明确保留旧约经文中的立约之神
  alternative: 使用“耶和华”或“主”，或在译文中加入后来的基督论解释
  rationale: 原文明确使用四字神名；译文应呈现申命记自身的历史与神学语境，不把后来的类型学阐释写入正文。
- issue: מֵרִבְבֹת קֹדֶשׁ所指为何
  choice: 正文作“从万千圣者中”，脚注保留“从万千圣洁中”的形式对应
  alternative: 正文作“从万千圣洁中”或“从神圣的万千中”
  rationale: 此短语可能描绘随侍的神圣众者，也可能按形式理解为“圣洁”。现代中文正文需可理解，但脚注应保留真实的语法与语义张力。
- issue: אשדת的解释
  choice: 正文采用较宽泛的“火焰”，脚注列出“火的律法”等传统解释
  alternative: 火的律法；烈火；火光；火矢
  rationale: 马所拉辅音文本的词形疑难，不宜在正文中把不确定的“דת”确定解释为“律法”，也不宜具体化为“火矢”。“火焰”保留神显之火的核心意象，并公开标示不确定性。
translation_notes:
  register: 采用庄重而自然的现代标准汉语，以分行保留诗歌的平行结构和神显意象。“如晨光升起”“放射光辉”形成递进；“万千”比机械的“万万”更符合当代汉语诗体。所有脚注标记均置于相关正文短语之后。
