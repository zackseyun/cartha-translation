base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/012.yaml
  text: 'And of Benjamin he said: “The beloved of Yahweh dwells in safety by him[a]; he shields him all the day[b], and he dwells between his shoulders.”'
translation:
  language: zh_hans
  text: '论便雅悯，他说：


    “耶和华所爱的人安然住在他身旁；[a]


    耶和华终日覆庇他；


    他住在他的两肩之间。”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在他身旁”也可译为“安然住在他旁边”、“安然住在他下方”或“安然住在他上方”。这里的希伯来语介词含义凝练，既可表示邻近，也可表示从上而来的保护。
    reason: lexical_alternative
  - marker: b
    text: 直译“在他的两肩之间”。末句的主语以及“他的”所指并不完全明确：可理解为耶和华住在便雅悯的“两肩之间”，也可理解为便雅悯住在耶和华的两肩之间。“两肩”还可能比喻便雅悯境内的山坡，或指设在其境内的圣所。
    reason: alternative_reading
lexical_decisions:
- source_word: לְבִנְיָמִן
  choice: 论便雅悯
  rationale: 介词 לְ 在各支派祝福的引语标题中可表示“对、为、论”。“论便雅悯”符合现代汉语的诗歌引介方式，也保留这是关于该支派之祝福的性质。
- source_word: יְדִיד יְהוָה
  choice: 耶和华所爱的人
  rationale: יְדִיד 指蒙爱、亲爱的人；用“所爱的人”自然表达其与耶和华的关系，又不额外限定为个人或整个支派。神名 יְהוָה 音译为“耶和华”，不以称号替代。
- source_word: יִשְׁכֹּן לָבֶטַח
  choice: 安然住
  rationale: שׁכן 表示居住、安居，לָבֶטַח 表示安全稳妥；“安然住”简洁地传达持续安居的诗意。
- source_word: עָלָיו
  choice: 在他身旁
  rationale: עַל 在此处语义紧缩，可指靠近、在上方或受其护佑。“在他身旁”使正文通顺而不过度强化某一空间关系，其他可能性列入脚注。
- source_word: חֹפֵף
  choice: 覆庇
  rationale: 该分词兼有覆盖和保护的意味。“覆庇”既保留覆盖意象，也清楚表达保护，比单纯译作“保护”更贴近诗歌措辞。
- source_word: כָּל הַיּוֹם
  choice: 终日
  rationale: 准确表达“整日、一直”，在现代汉语中简练而具有庄重的诗体色彩。
- source_word: וּבֵין כְּתֵיפָיו שָׁכֵן
  choice: 住在他的两肩之间
  rationale: כָּתֵף 的基本义是肩膀，也可延伸指山坡、侧面。正文保留“两肩之间”的具体意象和 שׁכן 的重复居住主题，不在正文中改译为地形或圣所解释。
theological_decisions:
- issue: 本节各代词及末句主语所指
  choice: 正文把“覆庇”和末句“住”的主语理解为耶和华，把“他”理解为便雅悯，即耶和华所爱的人；因此耶和华覆庇便雅悯，并住在他的两肩之间。
  alternative: 也可理解为便雅悯安居在耶和华身旁或护佑之下，并住在耶和华的两肩之间；另有人把末句联系到位于便雅悯境内的圣所。
  rationale: 希伯来诗句省略主语且反复使用第三人称后缀，允许不同的指代组合。正文采用与“耶和华终日覆庇他”最连贯的读法，但在脚注中明确保留其他语法和神学上可成立的理解。
- issue: “两肩之间”的意象
  choice: 正文直译为“他的两肩之间”。
  alternative: 可按地形理解为便雅悯的山坡之间，或借此指位于便雅悯境内的圣所。
  rationale: 直译保留原诗的人体意象及其解释空间，避免把有争议的地理或圣所解释直接写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。“论便雅悯，他说”保留支派祝福的引介格式；“安然住、终日覆庇、两肩之间”保持原文的平行结构、保护意象和居住主题。正文适度明确句法以便朗读，脚注则保留希伯来文真实存在的空间关系与代词指向歧义。
