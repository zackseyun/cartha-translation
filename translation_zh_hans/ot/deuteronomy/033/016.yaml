base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/016.yaml
  text: and with the choicest things of the earth and its fullness[a], and the favor of the one who dwelt in the bush—may it come on the head of Joseph[b], and on the crown of the head of the one set apart from his brothers.
translation:
  language: zh_hans
  text: 又愿他得地上和其中一切佳美之物，得住在荆棘丛中那一位[a]的恩宠。愿这一切临到约瑟头上，临到那在弟兄中被分别出来之人的头顶[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “住在荆棘丛中那一位”指神，令人想起他在燃烧的荆棘丛中向摩西显现（见出埃及记3章）。
    reason: 解释原文中的典故。
  - marker: b
    text: “在弟兄中被分别出来的人”也可理解为“弟兄中的首领”或“弟兄中被分别为圣的人”。原词强调被分别出来，在这里也可能含有超越弟兄、居于尊位的意思。
    reason: 保留 נְזִיר אֶחָיו 的词义范围和不同理解。
lexical_decisions:
- source_word: מִמֶּגֶד אֶרֶץ וּמְלֹאָהּ
  choice: 得大地和其中一切所有的珍宝
  rationale: מֶגֶד指上好、宝贵之物，在祝福语境中特别包含土地的佳美出产；מְלֹאָהּ是“大地中所充满的／一切所有的”。用“珍宝”概括其丰美出产，并以“一切所有的”自然表达紧凑的诗语。
- source_word: רְצוֹן
  choice: 恩宠
  rationale: 此词指悦纳、善意和眷顾；“恩宠”在现代汉语中庄重自然，也保留这是赐福者善意的含义。
- source_word: שֹׁכְנִי סְנֶה
  choice: 住在荆棘丛中那一位
  rationale: 按分词结构直译为描述性称谓，保留对出埃及记第三章神在荆棘丛中显现的含蓄指涉，而不在正文中扩展说明其身份。
- source_word: תָּבוֹאתָה
  choice: 愿这一切临到
  rationale: 阴性单数动词承接前述整体祝福，且带祈愿语气；“这一切”既使汉语指代清楚，也保留希伯来文把多项福分视为整体的表达。
- source_word: לְרֹאשׁ יוֹסֵף
  choice: 临到约瑟头上
  rationale: 保留祝福“临到头上”的诗性意象和原文介词结构。
- source_word: קָדְקֹד
  choice: 头顶
  rationale: 准确指头的最高处，并与上一分句的“头上”形成希伯来诗歌的平行。
- source_word: נְזִיר אֶחָיו
  choice: 那从弟兄中分别出来之人
  rationale: נְזִיר的核心观念是分别出来或被分别出来；此译法既呼应约瑟与弟兄分离的经历，也不武断限定为“首领”或特定宗教身份。
theological_decisions:
- issue: “住在荆棘丛中那一位”的身份
  choice: 保留为指向神的描述性称谓，并以脚注说明其典故
  alternative: 直接译成“在荆棘丛中向摩西显现的神”
  rationale: 原文借荆棘丛的典故敬称神，却没有在本句明说“向摩西显现”；正文保留含蓄表达，脚注帮助普通读者识别出埃及记第三章的指涉。
- issue: נְזִיר אֶחָיו所表达的约瑟地位
  choice: 正文译作“从弟兄中分别出来之人”
  alternative: “弟兄中的首领”或“弟兄中被分别为圣的人”
  rationale: 该词可以兼有分别、尊荣或居首之意。正文保留词义核心及叙事张力，脚注列出可能的地位性理解，不把其中一种解释写死。
translation_notes:
  register: 采用现代、庄重而易懂的祝福语体。“愿……得……；愿这一切临到……”承接上下文连续的诗性祝福；“荆棘丛”“头上”“头顶”等具体意象予以保留。
