  to: 又愿他得地上和其中一切佳美之物，得住在荆棘丛中那一位[a]的恩宠。愿这一切临到约瑟头上，临到那在弟兄中被分别出来之人的头顶[b]。
  rationale: 修订仅澄清首句中“佳美之物”与“大地及其所充满之物”的语法关系，并避免把约瑟“被分别”的身份性描述误读为单纯从弟兄处离开的经历。保留原有的诗歌祝福语气、神显现于荆棘丛的含蓄典故，以及对 נְזִיר 多重语义的脚注说明。
