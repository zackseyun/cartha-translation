  text: בְּכ֨וֹר שׁוֹר֜/וֹ הָדָ֣ר ל֗/וֹ וְ/קַרְנֵ֤י רְאֵם֙ קַרְנָ֔י/ו בָּ/הֶ֗ם עַמִּ֛ים יְנַגַּ֥ח יַחְדָּ֖ו אַפְסֵי אָ֑רֶץ וְ/הֵם֙ רִבְב֣וֹת אֶפְרַ֔יִם וְ/הֵ֖ם אַלְפֵ֥י מְנַשֶּֽׁה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/017.yaml
  text: His firstborn bull has majesty[a], and his horns are the horns of a wild ox; with them he will gore peoples together to the ends of the earth. These are the myriads of Ephraim[b], and these are the thousands of Manasseh.
translation:
  language: zh_hans
  text: '他的头生公牛大有威荣；


    他的角如野牛的角[a]。


    他要用这双角一同抵撞万民，


    直至地极。


    这双角就是以法莲的万万之众[b]，


    就是玛拿西的千千之众。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “野牛”所译的希伯来语很可能指一种强壮的野生牛类；也可译作“野公牛”。旧译本有译作“独角兽”的。
    reason: lexical_alternative
  - marker: b
    text: “万万之众”也可译作“数万之众”或“以法莲的万万”。希伯来语“万”用复数，常表示数万或极大的数目，并与下句“千千之众”相对。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּכוֹר שׁוֹרוֹ
  choice: 他的头生公牛
  rationale: 保留“头生”与“公牛”的具体意象，也不在正文中断定这形象究竟专指约瑟还是更具体地指以法莲。
- source_word: הָדָר לוֹ
  choice: 大有威荣
  rationale: הָדָר兼有威严、荣美和尊贵之意；“威荣”既凝练，又适合诗歌祝福的庄重语体。
- source_word: קַרְנֵי רְאֵם
  choice: 野牛的角
  rationale: רְאֵם很可能是强壮的野生牛类，而非独角兽；“野牛”通俗清楚，并保留牛角的力量意象。
- source_word: יְנַגַּח
  choice: 抵撞
  rationale: 该动词描述有角动物用角冲撞；“抵撞”保持具体动作，又避免把结果过度明确为刺死。
- source_word: עַמִּים
  choice: 万民
  rationale: 这里是复数群体；“万民”自然、庄重，也符合广阔的诗歌语境。
- source_word: יַחְדָּו
  choice: 一同
  rationale: 保留原文表示共同或整体范围的副词，同时不强行判定它确切修饰动作还是受撞击的众民。
- source_word: אַפְסֵי אָרֶץ
  choice: 地极
  rationale: 这是表示大地最远边界的诗歌惯用语；“地极”简洁且为现代读者熟悉。
- source_word: רִבְבוֹת
  choice: 万万之众
  rationale: 该词可指许多个一万或极庞大的数目；“万万之众”既保留与“千千之众”的数目对仗，也表达数量浩大。
- source_word: אַלְפֵי
  choice: 千千之众
  rationale: 与רִבְבוֹת平行时，数目意义比“宗族”更合适；叠用“千千”保留诗体及与上句的对称。
- source_word: אֶפְרַיִם / מְנַשֶּׁה
  choice: 以法莲／玛拿西
  rationale: 采用现代简体中文圣经语境中通行的人名译法。
theological_decisions:
- issue: 公牛与双角形象所指
  choice: 保留约瑟祝福中的牛角隐喻，并让末句按原文把双角对应于以法莲和玛拿西的众人。
  alternative: 把“头生公牛”直接解释为以法莲，视他为约瑟后裔中居首者。
  rationale: 本节承接对约瑟的祝福，却在末尾明确提到以法莲和玛拿西。正文不把“头生公牛”限定为其中一支，以保留原文指向上的张力。
translation_notes:
  register: 采用现代、庄重而易懂的诗体；通过分行保留祝福诗的平行结构。“威荣”“地极”“万万之众／千千之众”略带典雅色彩，但仍属普通现代读者可理解的表达。所有脚注标记均置于对应词语之后。
