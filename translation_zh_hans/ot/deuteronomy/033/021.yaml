  source_fidelity: 译文总体准确呈现了迦得为自己选择优先/上好之地、该处为“统治者／立法者”的份额所预留、随民众首领而来，以及施行耶和华的公义和其判决等内容。“最好的土地”是 רֵאשִׁית 在土地分配语境下可接受的意义对应；“统治者”并以脚注保留“立法者”和摩西的可能，妥当保留了争议。末句的“他的判决”在汉语中代词先行词不够明确，宜明确为耶和华，且应使“与以色列一同”的修饰关系更顺畅。
