source:
  edition: WLC
  text: וַ/יַּ֤רְא רֵאשִׁית֙ ל֔/וֹ כִּי שָׁ֛ם חֶלְקַ֥ת מְחֹקֵ֖ק סָפ֑וּן וַ/יֵּתֵא֙ רָ֣אשֵׁי עָ֔ם צִדְקַ֤ת יְהוָה֙ עָשָׂ֔ה וּ/מִשְׁפָּטָ֖י/ו עִם יִשְׂרָאֵֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/021.yaml
  text: He chose the best land for himself[a], because there the portion of the ruler was reserved. He came with the heads of the people; he carried out the righteousness of Yahweh[b], and his judgments with Israel.
translation:
  language: zh_hans
  text: 他为自己选了最好的土地，因为统治者的份额保留在那里[a]。他与百姓的领袖一同前来；他施行了耶和华的公义，也与以色列一同施行耶和华的判决。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他为自己选了居首的一份。”希伯来语也可理解为“最先的一份”或“上好的一份”。本句后半也可译：“因为立法者的份额保留在那里。”这里的词可指“统治者”或“立法者”；有人认为是指摩西。
    reason: 保留 רֵאשִׁית 的词义范围，以及 מְחֹקֵק 和整句结构的争议。
lexical_decisions:
- source_word: וַיַּרְא
  choice: 选了
  rationale: 该动词本义为“看见”，但“为自己看中”在这里表达选择之意；译作“选了”符合现代汉语习惯。
- source_word: רֵאשִׁית
  choice: 最好的土地
  rationale: 在迦得所得领土的语境中，指居首、上好的那一份，而不是时间意义上的“开始”；补出“土地”使所指清楚。
- source_word: חֶלְקַת
  choice: 份额
  rationale: 指分配所得的一份土地或产业；“份额”简洁且能保留分配的含义。
- source_word: מְחֹקֵק
  choice: 统治者
  rationale: 此词可指颁布法令者或掌权者。正文采用不特指某人的“统治者”，以免把有争议的对象直接认定为摩西。
- source_word: סָפוּן
  choice: 保留
  rationale: 该被动形式表达存放、藏起或预留；“保留”适合土地份额已被留出的语境。
- source_word: וַיֵּתֵא
  choice: 前来
  rationale: 表达出来、到来之意；与“百姓的领袖一同前来”在汉语中自然。
- source_word: רָאשֵׁי עָם
  choice: 百姓的领袖
  rationale: 直译为“百姓的头”，实际指首领；现代汉语以“领袖”清楚传达其身份。
- source_word: צִדְקַת יְהוָה
  choice: 耶和华的公义
  rationale: 保留希伯来语结构及其可能兼含公正、正义行为的张力，不在正文中限定为抽象品格或具体行动。
- source_word: וּמִשְׁפָּטָיו
  choice: 他的判决
  rationale: 复数名词可指司法判决或典章；“判决”直接保留其司法色彩。
- source_word: עִם יִשְׂרָאֵל
  choice: 与以色列一同
  rationale: 按介词的通常意义译作“与”，表明他和以色列共同参与，同时不改译为带受益含义的“为”。
theological_decisions:
- issue: מְחֹקֵק在“חלקת מחקק ספון”中的含义和所指
  choice: 正文泛译为“统治者”，不明确认定为摩西。
  alternative: 可译“立法者”或“颁布律法者”，并可能理解为摩西。
  rationale: 希伯来语诗句凝练，词义及人物所指均有争议。泛称“统治者”保留领导权威的含义，又避免加入经文本身未明确给出的身份判断。
- issue: צִדְקַת יְהוָה所指的是属性还是行动
  choice: 译为“耶和华的公义”。
  alternative: 可译“耶和华的公正”或“耶和华公义的作为”。
  rationale: 原文既可指公义本身，也可指公义的行动；正文采用较形式对应的表达，并以脚注保留其他可能。
translation_notes:
  register: 采用现代、庄重而清楚的普通话。“最好的土地”按领土分配语境作意义对等处理；“统治者的份额”保留诗歌的凝练和解释空间。末句重复“施行”，使“他的判决”在现代汉语中有明确谓语，同时保留“与以色列一同”的原文关系。
