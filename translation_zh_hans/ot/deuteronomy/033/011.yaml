  text: בָּרֵ֤ךְ יְהוָה֙ חֵיל֔/וֹ וּ/פֹ֥עַל יָדָ֖י/ו תִּרְצֶ֑ה מְחַ֨ץ מָתְנַ֧יִם קָמָ֛י/ו וּ/מְשַׂנְאָ֖י/ו מִן יְקוּמֽוּ/ן־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/011.yaml
  text: Bless[a], O Yahweh, his strength, and accept the work of his hands. Crush the loins of those who rise against him, and of those who hate him[b], so that they do not rise again.
translation:
  language: zh_hans
  text: 耶和华啊，求你赐福给他的力量[a]，悦纳他手所做的；求你击碎起来反对他的人和恨他之人的腰，使他们不能再起来[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “力量”也可译作“财富”“资源”或“军力”；原词含义较广。
    reason: lexical_alternative
  - marker: b
    text: “击碎……的腰”是希伯来语的形象说法；腰可象征力量。末句较直可译为“使他们不能起来”。
    reason: cultural_note
lexical_decisions:
- source_word: בָּרֵךְ
  choice: 赐福给
  rationale: 这是向耶和华发出的祈求；“赐福”直接、自然，也不把语义收窄为“使兴盛”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神名形式“耶和华”，保留其专名性质，不以称号替代。
- source_word: חֵילוֹ
  choice: 他的力量
  rationale: חַיִל 可指力量、财富、资源或军力；“力量”在正文中最能保留其宽泛性，其他可能义置于脚注。
- source_word: וּפֹעַל יָדָיו
  choice: 他手所做的
  rationale: 保留希伯来文“手”的具体意象，同时以自然现代汉语表达其工作和劳作。
- source_word: תִּרְצֶה
  choice: 悦纳
  rationale: 此处祈求上帝认可并接纳利未的服事；“悦纳”适合敬拜和祭司语境，又未把所指限定为祭物。
- source_word: מְחַץ
  choice: 击碎
  rationale: 保留动词“打碎、压碎”的强烈力度及诗歌的简洁感。
- source_word: מָתְנַיִם
  choice: 腰
  rationale: 直译身体意象；希伯来文中腰可象征力量。中文“腰”比“腰胯”自然，也没有直接改写为抽象的“力量”。
- source_word: קָמָיו
  choice: 那些起来攻击他的人
  rationale: 保留 קום“起来”的动词意象，并明确其敌对含义，使现代读者易懂。
- source_word: וּמְשַׂנְאָיו
  choice: 那些恨他的人
  rationale: 直接表达分词所指的持续敌意，不泛化为普通“敌人”。
- source_word: מִן יְקוּמוּן
  choice: 使他们不能再起来
  rationale: 希伯来语结构简略，承接前面的击碎，表示敌人被击倒而不能起来；“再”自然表达语境中的结果含义。
theological_decisions:
- issue: 本节“他”的指代
  choice: 保留单数“他”，按紧邻上下文指向利未
  alternative: 泛指祭司性的仆人，或指利未的代表性职分
  rationale: 申命记33:8–11直接祝福利未。保留原文单数代词，不在正文中扩展成某个特定个人或整个群体。
- issue: 敌人不能“起来”的含义
  choice: 按战争诗歌语境表达为遭击溃后不能再起来
  alternative: 仅译为“阻止他们起来”，不明确是否指再次起来
  rationale: 原文末句较为凝缩，可理解为使敌人无力复起；正文采用自然汉语表达其结果，但脚注提示原文较直的形式，以保留解释空间。
translation_notes:
  register: 采用庄重而清楚的现代标准普通话。祈祷句以“求你”体现希伯来语命令式在向上帝祈求时的语用功能；保留“手”“腰”“起来”等诗歌意象。正文中的[a]、[b]与脚注一一对应。
