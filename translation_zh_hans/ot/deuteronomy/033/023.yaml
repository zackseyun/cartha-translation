  text: וּ/לְ/נַפְתָּלִ֣י אָמַ֔ר נַפְתָּלִי֙ שְׂבַ֣ע רָצ֔וֹן וּ/מָלֵ֖א בִּרְכַּ֣ת יְהוָ֑ה יָ֥ם וְ/דָר֖וֹם יְרָֽשָׁ/ה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/023.yaml
  text: 'And of Naphtali he said: “Naphtali[a], satisfied with favor and full of the blessing of Yahweh, possess the sea and the south.”'
translation:
  language: zh_hans
  text: '论拿弗他利，他说：


    “拿弗他利啊，你饱享恩宠，


    满有雅威的福分；


    要占有海[a]和南方。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “海”也可能译作“西方”，因为在希伯来语中，“海”可以用作表示西方的方向词。
    reason: 保留 יָם 在地域语境中既可指海、也可指西方的词义歧义。
lexical_decisions:
- source_word: וּלְנַפְתָּלִי
  choice: 论拿弗他利
  rationale: 介词 לְ 在各支派祝福的引介格式中标明话语对象或主题；“论……”自然体现这一功能。
- source_word: שְׂבַע רָצוֹן
  choice: 饱享恩宠
  rationale: שְׂבַע 表示饱足、充分得享，רָצוֹן 在此指所蒙的喜悦、接纳或恩惠；“饱享恩宠”既保留饱足的意象，也符合现代汉语表达。
- source_word: וּמָלֵא בִּרְכַּת יְהוָה
  choice: 满得雅威的赐福
  rationale: מָלֵא 与前句“饱享”平行，表示充满；בִּרְכַּת 是“福、赐福”的构造形式，此处译作“赐福”可清楚表达来自雅威的福分。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来语四字神名的通行汉语音译处理，保留其作为专名的性质，而不以称号替代。
- source_word: יָם
  choice: 海
  rationale: 该词的基本义是“海”；因希伯来语中也可借地中海指“西方”，正文保留基本义，并在脚注注明方向义的可能。
- source_word: וְדָרוֹם
  choice: 和南方
  rationale: דָרוֹם 指南方或南部地区；“南方”与前项构成地域并列。
- source_word: יְרָשָׁה
  choice: 要占有
  rationale: 源自动词 ירשׁ，在祝福语境中带命令或祝愿色彩，指取得并拥有地域；“要占有”保留其主动取得产业的力度。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用神的专名。译作“雅威”保留专名性质，并避免以“主”这一称号取代；“耶和华”虽为汉语传统形式，但较不贴近通常重建的发音。
- issue: יָם 是具体水域还是方向词
  choice: 正文译“海”，脚注保留“西方”
  alternative: 正文译“西方”
  rationale: 该词本义为“海”，但在地域描述中可表示“西方”。上下文不足以完全消除歧义，因此不在正文中替读者作单一解释。
- issue: יְרָשָׁה 的语气
  choice: 命令式表达“要占有”
  alternative: 祝愿式“愿你占有”
  rationale: 希伯来语形式具有命令式形态，而整段又属于摩西的祝福；正文保留直接命令语气，同时让祝福语境承载其祝愿意味。
translation_notes:
  register: 采用现代、庄重而易懂的祝福体。“拿弗他利啊”明确呼语关系；诗行分行呈现原文的平行结构。神名统一音译为“雅威”。
