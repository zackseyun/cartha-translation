  text: יוֹר֤וּ מִשְׁפָּטֶ֨י/ךָ֙ לְ/יַעֲקֹ֔ב וְ/תוֹרָתְ/ךָ֖ לְ/יִשְׂרָאֵ֑ל יָשִׂ֤ימוּ קְטוֹרָה֙ בְּ/אַפֶּ֔/ךָ וְ/כָלִ֖יל עַֽל מִזְבְּחֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/010.yaml
  text: They will teach your judgments to Jacob and your law to Israel[b][a]; they will place incense before you and whole burnt offerings on your altar.
translation:
  language: zh_hans
  text: 他们要向雅各教导你的典章，向以色列教导你的律法[a]；他们要把香献在你面前[b]，把全牲的燔祭献在你的祭坛上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “律法”也可译作“训诲”。
    reason: lexical_alternative
  - marker: b
    text: “在你面前”原文直译为“在你的鼻前（或鼻孔前）”，是描写香献到上帝面前的拟人化说法。
    reason: cultural_note
lexical_decisions:
- source_word: יוֹרוּ
  choice: 教导
  rationale: 该词是 ירה 的使役词形，在祭司与律法语境中指教导、训诲；“教导”自然清楚，并同时支配平行的两个宾语。
- source_word: מִשְׁפָּטֶיךָ
  choice: 你的典章
  rationale: מִשְׁפָּט 可指判决、法令或规章；此处是利未人教导以色列的圣约规范，“典章”保留法律意味，也符合庄重的经文语体。
- source_word: וְתוֹרָתְךָ
  choice: 你的律法
  rationale: תּוֹרָה 可泛指训诲，也可指上帝赐下的律法；这里与“典章”平行，采用“律法”以保留圣约法律语境，同时用脚注注明“训诲”这一真实可能。
- source_word: יָשִׂימוּ קְטוֹרָה
  choice: 把香献上
  rationale: שׂים 字面为放置，קְטוֹרָה 为香；在祭祀语境中，现代汉语用“献上香”比“放置香”更自然，且不增加祭物种类。
- source_word: בְּאַפֶּךָ
  choice: 在你面前
  rationale: 字面涉及“鼻子／鼻孔”，在献香语境中是拟人化表达，指香呈到上帝面前；正文按语义译为“在你面前”，字面形象保留于脚注。
- source_word: וְכָלִיל
  choice: 全牲燔祭
  rationale: כָּלִיל 指全部焚烧的祭物；“全牲燔祭”明确表达祭物完全焚烧，且适合与献香并列。
- source_word: עַל מִזְבְּחֶךָ
  choice: 在你的祭坛上
  rationale: 直接表达祭物献于祭坛之上的空间及礼仪关系，符合现代汉语习惯。
theological_decisions:
- issue: 圣约语境中 תּוֹרָה 的译法
  choice: 律法
  alternative: 训诲
  rationale: “律法”保留本节祭司教导上帝圣约规范的法律意味；但原词也含较宽泛的教导、训诲之义，故在脚注中保留此歧义。
- issue: 拟人化表达 בְּאַפֶּךָ 的处理
  choice: 在你面前
  alternative: 在你鼻前／鼻孔前
  rationale: 直译在现代汉语中生硬且容易造成误解；“在你面前”准确传达献香呈到上帝面前的功能，而脚注说明原文身体意象，不进一步解释为某种特定教义。
- issue: כָּלִיל 的数与集合意义
  choice: 全牲燔祭
  alternative: 全牲燔祭祭物／完全焚烧的祭物
  rationale: 希伯来语单数形式可作祭物类别理解；汉语不必强行标明单复数，“全牲燔祭”既保留类别性，也避免无根据地限定为一只祭牲。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。保留诗句的两组平行结构；第二组为使汉语祭祀语境自然，将普通动词“放置”按语境译作“献上／献”。脚注标记紧随相应词语或短语，且不沿用英文材料中次序错置的标记。
