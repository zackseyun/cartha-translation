base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/020.yaml
  text: 'And of Gad he said: “Blessed is he who enlarges Gad[a]. He dwells like a lioness, and tears off arm[c][b], even scalp.”'
translation:
  language: zh_hans
  text: '论迦得，他说：


    “那使迦得扩张的，是有福的[a]！


    迦得像母狮般安卧[b]，


    撕裂臂膀，甚至头顶[c]。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“愿那使迦得扩张的蒙福”。这里所指的可能是上帝，但希伯来文没有明说主语。
    reason: 保留祝福句式及隐含主语的歧义。
  - marker: b
    text: “母狮”也可译作“狮子”；这里的希伯来词也可泛指强壮的狮。
    reason: 说明原词的词义范围，避免将性别含义绝对化。
  - marker: c
    text: 直译：“撕裂臂膀，甚至头顶。”
    reason: 说明原文以一个“撕裂”统摄两个身体部位，并保留其强烈、递进的身体意象。
lexical_decisions:
- source_word: וּלְגָד
  choice: 论迦得
  rationale: 这是引出对迦得支派祝福的惯用公式；“论迦得”在现代中文中简洁、庄重。
- source_word: בָּרוּךְ מַרְחִיב גָּד
  choice: 那使迦得扩张的，是有福的
  rationale: 保留“有福的”这一宣告式祝福，也保留分词“使……扩张”及其未明说的主语，不擅自补出“上帝”。
- source_word: כְּלָבִיא
  choice: 像母狮
  rationale: לָבִיא可指母狮，也可泛指强壮的狮子；正文采用较具体的“母狮”，脚注交代其词义范围。
- source_word: שָׁכֵן
  choice: 安卧
  rationale: 该动词可表示居住、安居或卧下；在狮子的比喻中，“安卧”自然地呈现其占据地盘、蓄势而居的形象。
- source_word: וְטָרַף
  choice: 撕裂
  rationale: 体现טרף所含猛兽捕食、撕扯的强烈动作。
- source_word: זְרוֹעַ
  choice: 臂膀
  rationale: 按具体身体部位理解，与后面的“头顶”并列，并保留诗句的猛烈意象。
- source_word: אַף קָדְקֹד
  choice: 连头顶也撕裂
  rationale: אַף在此起递进、加强作用；קָדְקֹד指头顶或头颅顶部。中文补出第二个“撕裂”，使所支配的两个身体部位关系清楚。
theological_decisions:
- issue: “使迦得扩张的”所指是谁
  choice: 正文不明确说是上帝，只译为“那使迦得扩张的”
  alternative: 译为“使迦得扩张的上帝是当受称颂的”或将其处理为祈愿句
  rationale: 希伯来文没有明说该分词的主语；上下文可能默认指上帝，但译文不应消除原文留下的开放性。
- issue: בָּרוּךְ是宣告还是祈愿
  choice: 采用宣告式“是有福的”
  alternative: 采用祈愿式“愿……蒙福”
  rationale: 原文是谓语形容词，可表达祝福宣告；正文保留这一直接形式，脚注说明另一种合理理解。
translation_notes:
  register: 采用现代、庄重而可朗读的中文诗体。“安卧”兼顾支派安居与狮子卧伏的双重画面；保留原句中扩张者身份未明、狮类称谓有弹性的特点。
