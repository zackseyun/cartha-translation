  yaml_path: translation/ot/deuteronomy/033/025.yaml
  text: Your bars shall be iron and bronze[a], and as your days[b], so shall your strength be.
translation:
  language: zh_hans
  text: 你的门闩必是铁和青铜制的[a]；你的日子如何，你的力量也必如何[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你的鞋（或凉鞋）必是铁和青铜制的。”这个希伯来名词可以指鞋；但鉴于金属意象和安全保障的语境，许多人在这里理解为门闩或门栓。
    reason: lexical_alternative
  - marker: b
    text: 或译：“你的日子如何，你的安歇（或安稳）也必如何。”末尾的希伯来词十分罕见，含义不确定；“力量”是符合祝福语境的传统译法。
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּרְזֶל
  choice: 铁
  rationale: 该词通常指铁；在本句中与נְחֹשֶׁת并列，表示坚固的金属材料。
- source_word: נְחֹשֶׁת
  choice: 青铜
  rationale: 该词可泛指铜或青铜；在圣经时代的金属语境中译作“青铜”，与“铁”并列自然。
- source_word: מִנְעָלֶיךָ
  choice: 你的门闩
  rationale: 该名词也可指鞋或凉鞋；但在铁与青铜的材料意象及祝福所表达的安全保障中，“门闩”较为连贯。因词义有争议，脚注保留另一译法。
- source_word: וּכְיָמֶיךָ
  choice: 你的日子怎样
  rationale: 前缀כְ表示比较或相称关系；这一表达保留“日子”与下文状态彼此相称的结构，而不限定为寿命长短。
- source_word: דָּבְאֶךָ
  choice: 你的力量
  rationale: 此词罕见，确切含义不明。“力量”是传统且符合祝福语境的理解；其他可能含义在脚注中保留。
theological_decisions:
- issue: 祝福意象的解释
  choice: 正文呈现坚固的保障，以及与一生年日相称的力量。
  alternative: 本节也可能描写适合艰难地形的坚固鞋履；末句则可能指与年日相称的安歇或安稳。
  rationale: 这些理解均涉及希伯来词汇上的真实歧义，并无必要在正文中以教义立场强行消除；正文采用语境连贯的传统理解，脚注保留重要替代读法。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“门闩”“青铜”具体清楚；末句保留原文简洁的对应结构，不将“日子”擅自解释为寿命或每日处境。
