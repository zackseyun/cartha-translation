  text: הָ/אֹמֵ֞ר לְ/אָבִ֤י/ו וּ/לְ/אִמּ/וֹ֙ לֹ֣א רְאִיתִ֔י/ו וְ/אֶת אֶחָי/ו֙ לֹ֣א הִכִּ֔יר וְ/אֶת בנ/ו לֹ֣א יָדָ֑ע כִּ֤י שָֽׁמְרוּ֙ אִמְרָתֶ֔/ךָ וּ/בְרִֽיתְ/ךָ֖ יִנְצֹֽרוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/009.yaml
  text: who said of his father and his mother[a], ‘I have not seen him,’ and did not acknowledge his brothers or know his sons; for they kept your word and guarded your covenant.
translation:
  language: zh_hans
  text: 他论到父亲和母亲说：“我没有看见他[a]。”他不认他的弟兄，也不认识他的儿子；因为他们遵守你的话，守护你的约。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“我没有看见他。”原文在“父亲和母亲”之后使用单数代词，语意较为突兀；在此语境中，这句话也可能表示“不顾念他”或“不因亲属关系而特别看待他”。
    reason: 保留ראה的字面义以及原文单数代词所造成的歧义，同时说明语境中可能的关系性含义。
lexical_decisions:
- source_word: הָאֹמֵר
  choice: 他……说
  rationale: 该分词作名词性用法，承接上文的利未；用关系性分句自然表达。
- source_word: לְאָבִיו וּלְאִמּוֹ
  choice: 论到自己的父母
  rationale: אמר与ל连用时，可表示对某人说，也可表示论及某人；结合后面的否认亲属关系，此处译作“论到”较连贯，同时不把话语强行理解为直接对父母说。
- source_word: לֹא רְאִיתִיו
  choice: 我没有顾念他
  rationale: ראה字面为“看见”，但本节语境涉及盟约忠诚优先于亲属关系，故“顾念”能表达不徇亲、不以亲属关系为重的语用含义；脚注保留字面译法。
- source_word: הִכִּיר
  choice: 认
  rationale: 使役形在此指承认或以亲属身份相认；“不认自己的弟兄”简洁自然。
- source_word: אֶחָיו
  choice: 自己的弟兄
  rationale: 原文明确为阳性复数“弟兄”，保留其性别与亲属称谓。
- source_word: בָּנָיו
  choice: 自己的儿子
  rationale: 原文为阳性复数“儿子们”；汉语“儿子”在此可作集合性复数，不必添加“们”。
- source_word: יָדָע
  choice: 认识
  rationale: 保留ידע“知道、认识”的基本词义，同时在平行语境中可自然表达关系上的认可。
- source_word: כִּי
  choice: 因为
  rationale: 引出前述行为的理由，现代汉语中“因为”清楚自然。
- source_word: שָׁמְרוּ
  choice: 遵守
  rationale: שׁמר在诫命和盟约语境中常指遵行、持守；“遵守你的话”自然且准确。
- source_word: אִמְרָתֶךָ
  choice: 你的话
  rationale: אמרה指言语、话语；不窄化为某一条具体命令。
- source_word: בְּרִיתְךָ
  choice: 你的约
  rationale: ברית在此为上帝与其子民所立的约；“约”是简洁、标准的译法。
- source_word: יִנְצֹרוּ
  choice: 守护
  rationale: נצר含看守、保护、谨守之意；译作“守护”与前句的“遵守”有别，也保留平行中的词汇变化。
theological_decisions:
- issue: 本节单数与复数之间的转换
  choice: 前半保留代表利未的单数“他”，后半保留群体性的复数“他们”
  alternative: 全节统一译为单数的利未，或全节统一译为复数的利未人
  rationale: 希伯来文先用单数形式描述代表性人物，随后用复数动词说明群体行为。保留这一转换，既反映利未的整体性，也不消除原文的语法张力。
- issue: 亲属称谓与盟约忠诚的关系
  choice: 以“顾念、不认、不认识”表达亲属关系未获优先考虑
  alternative: 明说“他不徇私”或“他弃绝家人”
  rationale: 原文以强烈但含蓄的亲属否认来表达忠于上帝之约；译文不额外判定其具体历史事件，也不将含义扩写为某种教义结论。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留诗歌中由单数“他”转为复数“他们”的变化；“弟兄”和“儿子”照原文保留阳性亲属称谓。脚注标记已置于相关短语之后。
