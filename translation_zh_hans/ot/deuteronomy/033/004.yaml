base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/004.yaml
  text: Moses commanded a law for us[b][a], an inheritance for the assembly of Jacob.
translation:
  language: zh_hans
  text: 摩西向我们颁布律法[a][b]；这律法是雅各会众的产业。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“摩西向我们颁布律法，就是雅各会众的产业。”希伯来文句法简练，“产业”也可理解为紧接“律法”的同位语。
    reason: alternative_reading
  - marker: b
    text: “律法”也可译作“教导”；“产业”也可译作“基业”或“所承受的财产”。
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹרָה
  choice: 律法
  rationale: “律法”既保留该词在摩西之约背景中的公开、规范性含义，也比音译“妥拉”更便于普通读者理解。“教导”虽是可能译法，但在此处较难充分表达其权威性。
- source_word: צִוָּה
  choice: 颁布
  rationale: 该动词基本义为“吩咐、命令”。现代汉语若直译成“吩咐律法给我们”不自然；“颁布”与“律法”搭配顺畅，并保留权威传达的意味，而不弱化成单纯的“给予”。
- source_word: לָנוּ
  choice: 向我们
  rationale: 介词 ל־在此标明律法传达的对象；“向我们颁布”符合现代汉语习惯，也保留以色列群体作为领受者的含义。
- source_word: מֹשֶׁה
  choice: 摩西
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: מוֹרָשָׁה
  choice: 产业
  rationale: 该词指承受而得、归属群体的恒久财产。“产业”比“遗产”更能涵盖承受、持有和归属之义，也适合此处的圣约语境。
- source_word: קְהִלַּת
  choice: 会众
  rationale: 该词指聚集而成的共同体。“会众”简洁地表达群体性和聚集性，且不必将其解释为后来的特定宗教制度。
- source_word: יַעֲקֹב
  choice: 雅各
  rationale: 原文明确使用“雅各”，故予以保留，不解释性地改译为“以色列”。
theological_decisions:
- issue: 前后两个名词性表达的句法关系
  choice: 用两个紧密相连的分句表达：摩西颁布律法，这律法是雅各会众的产业。
  alternative: “摩西向我们颁布律法，就是雅各会众的产业”，或将“产业”直接作为“律法”的同位语。
  rationale: 希伯来文后半句没有明说系词，结构简练；“产业”很可能说明“律法”的性质。正文以“这律法是……”自然表达这一关系，同时用脚注保留同位语式理解，避免把压缩的诗句句法说得过于确定。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“向我们颁布律法”避免生硬直译，同时保存原文命令性和权威传达的力度；后半句保持诗歌式简洁。“雅各会众”沿用原文群体称谓，不以“以色列”代换。
