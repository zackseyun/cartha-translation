base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/024.yaml
  text: 'And of Asher he said: “Most blessed of sons is Asher[a]; may he be favored by his brothers[c][b], and may he dip his foot in oil.”'
translation:
  language: zh_hans
  text: '论亚设，他说：


    “亚设在众子中最蒙福[a]；


    愿他蒙众弟兄喜爱[b]，


    愿他的脚蘸在油中。[c]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“亚设比众子更蒙福。”希伯来文的比较结构既可理解为比较级，也可理解为最高级。
    reason: lexical_alternative
  - marker: b
    text: “众弟兄”在这里很可能指以色列其余各支派。
    reason: cultural_note
  - marker: c
    text: “脚蘸在油中”很可能描绘油产丰盛、生活兴旺；正文保留希伯来文的具体意象。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְאָשֵׁר אָמַר
  choice: 论亚设，他说
  rationale: 介词 לְ 引出下一支派的祝福。“论亚设”自然保留“关于亚设”的话语结构；אָמַר 采用朴素的“他说”。
- source_word: בָּרוּךְ מִבָּנִים אָשֵׁר
  choice: 亚设在众子中最蒙福
  rationale: מִן 可表达比较，而本句可有最高级或比较级意味。“在众子中最蒙福”在现代汉语中顺畅，并保留亚设相对于其余众子的比较关系；另译列入脚注。
- source_word: יְהִי רְצוּי אֶחָיו
  choice: 愿他得众弟兄的喜爱
  rationale: יְהִי 在祝福语境中表达愿望；רְצוּי 指受到接纳、悦纳或喜爱。此处“得……的喜爱”自然表达他在弟兄中蒙悦纳，而不额外引入神学解释。
- source_word: אֶחָיו
  choice: 众弟兄
  rationale: 保留希伯来文阳性复数和家族意象；语境中这些弟兄也对应以色列其余支派，说明置于脚注。
- source_word: וְטֹבֵל בַּשֶּׁמֶן רַגְלוֹ
  choice: 愿他的脚蘸在油中
  rationale: 分词 טֹבֵל 与前句祝愿平行，可在诗歌中承接愿望语气。“脚”按原文保留单数，“油”不擅自具体化为橄榄油，并保留丰盛意象的开放性。
theological_decisions:
- issue: “脚蘸在油中”这一祝福意象的解释
  choice: 正文保留具体而含蓄的字面意象
  alternative: 直接译为土地盛产橄榄油、生活富裕或安享繁荣
  rationale: 该意象很可能传达油产丰盛或兴旺，但希伯来文并未明确限定具体所指。字面保留可维护诗意及解释空间，可能含义仅在脚注说明。
translation_notes:
  register: 采用现代、庄重而易懂的祝福诗体；分行呈现平行结构。保留“众子”“众弟兄”“脚蘸在油中”等亲族及农业意象，不将其解释性改写为抽象的繁荣宣告。
