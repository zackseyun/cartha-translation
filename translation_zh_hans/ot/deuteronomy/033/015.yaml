  text: and from the choicest things of the ancient mountains[a], and from the abundance of the everlasting hills[b],
translation:
  language: zh_hans
  text: '又有来自古老群山的上好出产[a]，

    又有来自亘古丘陵的丰美物产[b]；'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“来自古老群山的顶峰。”希伯来语可指空间上的“山顶”，也可指定性意义上的“上好部分”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“来自亘古丘陵的珍宝。”
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵרֹאשׁ
  choice: 上好出产
  rationale: רֹאשׁ本义为“头、顶”，在祝福和物产罗列的语境中也可指居首、上好的部分。结合下半句מֶגֶד所指的丰美物产，正文采用定性意义，同时用脚注保留空间意义。
- source_word: הַרְרֵי
  choice: 群山
  rationale: הַר的复数附属形式，指山岳；译作“群山”，并与下句的“丘陵”相区别。
- source_word: קֶדֶם
  choice: 古老
  rationale: קֶדֶם既可指东方，也可指远古。这里与עוֹלָם形成诗歌平行，时间意义更自然。
- source_word: מִמֶּגֶד
  choice: 丰饶物产
  rationale: מֶגֶד可指珍贵之物、佳美出产或丰盛物产。此处译为“丰饶物产”，既体现祝福中的富足，也符合现代汉语表达。
- source_word: גִּבְעוֹת
  choice: 丘陵
  rationale: גִּבְעָה通常指丘陵或小山；译作“丘陵”，与前面的“群山”保持词义区分。
- source_word: עוֹלָם
  choice: 亘古
  rationale: 在描写地貌的诗歌中，עוֹלָם可表达久远年代或恒久延续。“亘古”保留庄重诗意，也与前句“古老”形成有所区别的平行。
theological_decisions: []
translation_notes:
