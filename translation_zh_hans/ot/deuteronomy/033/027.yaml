base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/027.yaml
  text: The God of old is a dwelling place[a], and underneath are everlasting arms. He drove out the enemy before you, and said, ‘Destroy!’
translation:
  language: zh_hans
  text: 亘古的上帝是居所[a]；下方有永恒的膀臂。他从你面前赶走仇敌，并说：“毁灭吧！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“永恒的上帝是你的避难所。”这是传统且可成立的理解；但原文较直接的措辞是“亘古的上帝是居所”。
    reason: 保留אֱלֹהֵי קֶדֶם与מְעֹנָה的传统解释，同时让正文优先反映较直接的词义。
lexical_decisions:
- source_word: מְעֹנָה
  choice: 居所
  rationale: 该名词指住处或庇护之所；“居所”直接保留原文意象，又不把隐喻完全解释成“避难所”。
- source_word: אֱלֹהֵי קֶדֶם
  choice: 亘古的上帝
  rationale: קֶדֶם在此主要指久远的过去。“亘古的上帝”比“永恒的上帝”更直接反映时间久远之义，同时在现代汉语中庄重自然。
- source_word: וּמִתַּחַת
  choice: 下有
  rationale: 保留空间方位及诗歌的凝练表达；按上下文表达在下方承托的意象。
- source_word: זְרֹעֹת עוֹלָם
  choice: 永恒的膀臂
  rationale: “膀臂”保留力量与扶持的身体隐喻；עוֹלָם在此最自然地表达恒久不衰。
- source_word: וַיְגָרֶשׁ
  choice: 他……赶走
  rationale: גרש常指驱逐、赶出；“赶走”清楚有力，适合此处军事语境。
- source_word: מִפָּנֶיךָ
  choice: 从你面前
  rationale: 较直接地反映“从你的面前／临在之处”，也自然表达上帝在以色列前方驱逐敌人。
- source_word: אוֹיֵב
  choice: 仇敌
  rationale: 保留希伯来文形式上的单数，同时汉语“仇敌”也可具有集合意义。
- source_word: וַיֹּאמֶר
  choice: 并说
  rationale: 保留简单的叙事连接；主语根据前句自然理解为上帝。
- source_word: הַשְׁמֵד
  choice: 毁灭吧！
  rationale: 该词为使役式命令，要求彻底毁灭；此译法有力度，又不添加原文未明说的对象或方式。
theological_decisions:
- issue: אֱלֹהֵי קֶדֶם中的קֶדֶם应译为久远时间，还是解释为上帝的永恒性
  choice: 亘古的上帝
  alternative: 永恒的上帝
  rationale: קֶדֶם更直接表示古时、久远以往；“永恒”虽是传统且可成立的解释，却比原词更明确地作了神学阐释，因此放入脚注，以保留翻译张力。
- issue: מְעֹנָה是否应明确解释为庇护性的“避难所”
  choice: 居所
  alternative: 避难所
  rationale: “居所”保存原文的具体意象；上下文本身可使读者体会庇护含义，无须在正文中将隐喻单向解释。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌体。“亘古”“膀臂”略带经文语体色彩，但在现代汉语中仍清楚自然；分号呈现两幅彼此呼应的庇护与承托意象。
