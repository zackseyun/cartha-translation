  text: You shall not test Yahweh your God[b][a], as you tested him at Massah.
translation:
  language: zh_hans
  text: 你们不可试探[a]雅威——你们的神，像你们在玛撒[b]试探他那样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “试探”也可译作“考验”或“置于考验之下”。
    reason: lexical_alternative
  - marker: b
    text: 玛撒是以色列人在旷野试探雅威的地方（出埃及记17:1—7）；“玛撒”这个名称与“试探”一词相关。
    reason: cross_reference
lexical_decisions:
- source_word: לֹא תְנַסּוּ
  choice: 不可试探
  rationale: לֹא与未完成式第二人称复数构成禁令；“不可”简洁庄重。“试探”保留נסה在本节前后两处的词汇呼应，也符合以色列在玛撒挑战、检验神的语境。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以常见的现代汉语音译呈现四字神名，而不以称号替代专名。
- source_word: אֱלֹהֵיכֶם
  choice: 你们的神
  rationale: 准确表达复数第二人称后缀；“你们”也与本节两个动词的复数形式一致。
- source_word: כַּאֲשֶׁר
  choice: 像……那样
  rationale: 自然表达比较关系，连接当前禁令与过去在玛撒发生的事件。
- source_word: נִסִּיתֶם
  choice: 你们……试探
  rationale: 与前面的同一词根נסה一致译为“试探”，保留原文有意的重复。
- source_word: בַּמַּסָּה
  choice: 在玛撒
  rationale: 按地名音译，并用“在”表达地点；名称与“试探”的文字联系在脚注说明，不在正文中扩写。
theological_decisions:
- issue: 四字神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用神的专名；正文采用音译“雅威”，既保留专名性质，也避免用称号代替。
- issue: נסה在本节中的语义
  choice: 试探
  alternative: 考验；置于考验之下
  rationale: “试探”能涵盖人在不信中挑战并检验神的含义，且可在两处保持同词同译；脚注提示“考验”这一可能表达，避免把语义限缩为诱惑犯罪。
- issue: 是否在正文解释玛撒事件
  choice: 只保留地名“玛撒”
  alternative: 玛撒（试探之地）
  rationale: 原文仅出现地名；事件背景及名称所含的文字联系放入脚注，以免把解释增添到正文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“不可”体现律法禁令的语气；两次使用“试探”保留希伯来文的重复和玛撒名称背后的文字联系。
