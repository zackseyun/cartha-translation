base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/022.yaml
  text: And Yahweh gave great and grievous signs and wonders in Egypt[a], against Pharaoh and against all his house[b], before our eyes.
translation:
  language: zh_hans
  text: 耶和华在埃及[a]施行了极大而可怕的[b]神迹奇事，降在法老和他全家身上，在我们眼前。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“向埃及”。希伯来语介词可表示地点；在灾祸的语境中，也可含有这些作为临到埃及的意思。
    reason: lexical_alternative
  - marker: b
    text: 或译“灾难性的”或“有害的”。此词描述这些作为给埃及带来的严重灾害，并非断言耶和华的作为在道德上邪恶。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: 施行了
  rationale: נתן的基本义是“给、置于”，但与“神迹奇事”连用时，现代汉语用“施行”最自然，也准确表达使这些作为发生；直译“给了”会造成误解。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代简体中文圣经语域中通行的专名“耶和华”呈现四字神名，而不以头衔替代。
- source_word: אוֹתֹת וּמֹפְתִים
  choice: 神迹奇事
  rationale: “神迹”表达具有指示意义的אותות，“奇事”表达令人惊异的מפתים；这一固定搭配自然、庄重，也不把后者过度解释为某一类超自然事件。
- source_word: גְּדֹלִים וְרָעִים
  choice: 重大而可怕的
  rationale: גדלים表示规模、程度重大；רעים在此指这些作为对埃及造成灾难性、可怕的后果，而不是说上帝的行为在道德上邪恶。
- source_word: בְּמִצְרַיִם
  choice: 在埃及
  rationale: ב最直接可作地点介词“在”；保留其地点义，避免把“针对埃及”的语境含义写死。
- source_word: בְּפַרְעֹה וּבְכָל־בֵּיתוֹ
  choice: 降在法老和他全家身上
  rationale: 这里的ב标明神迹奇事所临到、打击的对象；“降在……身上”符合汉语灾祸语境。בית指法老的家室或家族群体，译作“全家”简明自然。
- source_word: לְעֵינֵינוּ
  choice: 就在我们眼前
  rationale: 这是表示亲眼目睹的惯用语；“就在”增强原文所强调的直接见证感。
theological_decisions:
- issue: 四字神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用上帝的专名，正文保留专名而不改译为“主”；“耶和华”是现代中文普通读者最熟悉且可辨识的形式。
- issue: רעים用于描述上帝所施行的神迹奇事
  choice: 可怕的
  alternative: 有害的；灾难性的；恶的
  rationale: 此处重点是这些作为对埃及造成的严重灾害。“可怕的”保留其令人畏惧、带来灾祸的张力，又不误导读者以为经文在判定上帝的行为具有道德邪恶。
- issue: 连续介词ב的语义关系
  choice: 在埃及；降在法老和他全家身上
  alternative: 针对埃及、法老和他全家
  rationale: 第一个短语可自然表示地点，后两个则在上下文中标示受灾对象。区别翻译保留希伯来介词的语义弹性，不强行将三处统一解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“施行神迹奇事”符合中文宗教叙事习惯；句子保留原文从地点到受击对象、再到亲眼见证的推进。
