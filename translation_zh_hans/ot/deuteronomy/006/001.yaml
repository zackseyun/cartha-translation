  text: וְ/זֹ֣את הַ/מִּצְוָ֗ה הַֽ/חֻקִּים֙ וְ/הַ/מִּשְׁפָּטִ֔ים אֲשֶׁ֥ר צִוָּ֛ה יְהוָ֥ה אֱלֹהֵי/כֶ֖ם לְ/לַמֵּ֣ד אֶתְ/כֶ֑ם לַ/עֲשׂ֣וֹת בָּ/אָ֔רֶץ אֲשֶׁ֥ר אַתֶּ֛ם עֹבְרִ֥ים שָׁ֖מָּ/ה לְ/רִשְׁתָּֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/001.yaml
  text: This is the commandment—the statutes and the judgments—that Yahweh your God commanded to teach you[a], so that you may do them in the land into which you are crossing[c][b], to possess it.
translation:
  language: zh_hans
  text: 这是诫命——就是律例和典章——是雅威[a]——你们的上帝——吩咐教导你们的，好让你们在那片将要过去、取得为业的土地上遵行。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威”是希伯来文中上帝的专名 יהוה（YHWH）的音译；传统上也译作“耶和华”，或以“主”代称。
    reason: 说明神名的原文形式及常见译法。
lexical_decisions:
- source_word: וְזֹאת
  choice: 这是
  rationale: 本短语承接上文并引出新段落；现代汉语用“这是”自然清楚，不另加原文没有的时间副词。
- source_word: הַמִּצְוָה הַחֻקִּים וְהַמִּשְׁפָּטִים
  choice: 诫命——就是律例和典章——
  rationale: 保留“诫命”的单数，并将后面的复数“律例和典章”表达为解释性同位语，避免把原文统一改成复数。“律例”侧重规定的法令，“典章”保留司法裁断或条例的法律语域。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见形式音译上帝的专名，而不以“主”这一称号替代。
- source_word: אֱלֹהֵיכֶם
  choice: 你们的上帝
  rationale: 准确表达第二人称复数领属形式，并采用普通现代汉语可懂的称谓。
- source_word: אֲשֶׁר צִוָּה ... לְלַמֵּד אֶתְכֶם
  choice: 是……吩咐要教导你们的
  rationale: 保留原文未明说“我”的省略结构，不在正文中补出施教者；“要教导你们”自然表达不定式与“吩咐”的关系。
- source_word: לַעֲשׂוֹת
  choice: 好让你们……遵行
  rationale: 在律法语境中，“遵行”自然表达把所教导的诫命、律例和典章付诸实行；“好让”明确其目的关系。
- source_word: אֲשֶׁר אַתֶּם עֹבְרִים שָׁמָּה
  choice: 将要过去……的那片土地
  rationale: 表达以色列人即将越过边界前往目的地的动作，同时不把原文未明说的“河”直接加入正文。
- source_word: לְרִשְׁתָּהּ
  choice: 取得为业
  rationale: 兼顾该动词在申命记中“取得、占有”与“承受为产业”的语义，不将其弱化为纯粹被动的继承。
theological_decisions:
- issue: 上帝专名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；音译“雅威”保留其专名性质。“耶和华”是传统音译，“主”则是称号性替代。
- issue: 单数“诫命”与复数“律例、典章”的关系
  choice: 保留单数，并用破折号和“就是”表示后项的解释展开
  alternative: 改为并列复数“诫命、律例和典章”
  rationale: 原文刻意以单数 מִצְוָה 引领两个复数法律类别，可能是总称加展开；保留数的差异可避免过早消解其结构张力。
- issue: “教导”的施事者是否补作摩西
  choice: 不在正文补出“我”
  alternative: “吩咐我教导你们”
  rationale: 上下文显示说话者摩西承担教导，但本节希伯来文本身没有明写第一人称宾语；采用无主语表达可保留原文的省略。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“诫命、律例、典章”维持盟约法律语域；句法稍作重组以符合汉语表达，同时保留原文的单复数差异、省略的教导者，以及“取得/承受土地”的语义张力。
