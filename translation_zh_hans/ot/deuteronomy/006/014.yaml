  text: לֹ֣א תֵֽלְכ֔וּ/ן אַחֲרֵ֖י אֱלֹהִ֣ים אֲחֵרִ֑ים מֵ/אֱלֹהֵי֙ הָֽ/עַמִּ֔ים אֲשֶׁ֖ר סְבִיבוֹתֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/014.yaml
  text: You shall not go after other gods[a], the gods of the peoples who are around you.
translation:
  language: zh_hans
  text: 不可随从别的神[a]，就是你们周围各族的神。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不可随从别的神——你们周围各族的任何神。”
    reason: 保留 מִן 可能具有的部分用法，并提供更符合现代汉语习惯的表达。
lexical_decisions:
- source_word: לֹא תֵלְכוּן אַחֲרֵי
  choice: 不可随从
  rationale: הלך אחרי 是“跟在……之后、随从”的惯用语；在本节禁令中指向追随与效忠，而不只是身体上的行走。“不可随从”既自然，也保留原文意象。
- source_word: אֱלֹהִים אֲחֵרִים
  choice: 别的神
  rationale: 直译为以色列的上帝以外的神明；“别的神”清楚自然，也不额外加入“外邦”这一原词未明说的限定。
- source_word: מֵאֱלֹהֵי הָעַמִּים
  choice: 就是……各族的神
  rationale: 此处 מִן 可作部分用法，说明前述“别的神”来自周围各族的神；中文用同位说明表达，可避免生硬的“从……神中”。
- source_word: הָעַמִּים
  choice: 各族
  rationale: עַמִּים 指多个族群或人民共同体；“各族”比“各国”更贴近词义，也符合本节邻近族群的语境。
- source_word: אֲשֶׁר סְבִיבוֹתֵיכֶם
  choice: 你们周围
  rationale: 简洁保留空间意义，并明确这些族群环绕听众而居。
theological_decisions:
- issue: “随从别的神”的含义
  choice: 保留“随从”这一盟约效忠色彩浓厚的表达
  alternative: 明确译为“敬拜别的神”
  rationale: הלך אחרי 在申命记中通常涉及宗教上的追随与效忠，但原文没有直接使用“敬拜”一词；保留“随从”可传达其含义而不把解释写死。
- issue: 周围各族之神与“别的神”的关系
  choice: 用“就是”作为同位说明
  alternative: 译为“你们周围各族的任何神”
  rationale: 原文的 מִן 可理解为部分用法；正文以自然中文说明所指范围，脚注则保留更明确的部分式表达。
translation_notes:
  register: 采用庄重而通俗的现代标准汉语。“不可”体现律法禁令的语气；“随从”保留希伯来语惯用表达中的行动意象和效忠含义。
