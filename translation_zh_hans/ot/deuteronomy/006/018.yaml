base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/018.yaml
  text: And you shall do what is right and good in the eyes of Yahweh[a], so that it may go well for you, and you may go in and take possession of the good land that Yahweh swore to your fathers.
translation:
  language: zh_hans
  text: 你要行在雅威眼中正直、良善的事，好叫你得福，并得以进入并占有[a]那美好的土地，就是雅威向你列祖起誓应许的土地。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“承受那美好的土地”。希伯来语这个动词可表示“承受”“拥有”或“占有”；这里指以色列人进入并占有雅威起誓应许的土地。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: 你要行
  rationale: 在本段训诲语境中表达面向将来的指令；“要行”自然保留盟约命令的语气。
- source_word: הַיָּשָׁר וְהַטּוֹב
  choice: 正直、良善的事
  rationale: 保留“正直”与“良善”两个并列的伦理评价词，并用“的事”使现代汉语表达完整自然。
- source_word: בְּעֵינֵי יְהוָה
  choice: 雅威眼中
  rationale: 保留希伯来语“在……眼中”的评价性比喻，意为符合雅威的判断。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来四字神名的常见拟音译法处理，保留这是专名而非称号。
- source_word: לְמַעַן יִיטַב לָךְ
  choice: 使你可以安好
  rationale: 表达目的或结果以及整体处境良好，避免把含义限缩为物质兴旺。
- source_word: וּבָאתָ וְיָרַשְׁתָּ
  choice: 并且可以进去，占有
  rationale: 保留进入应许之地并取得实际所有权的动作次序；“占有”也保留 ירשׁ 在此处主动取得土地的语气。
- source_word: הָאָרֶץ הַטֹּבָה
  choice: 那片美地
  rationale: “美地”简洁保留该地被评价为“好”的含义；“那片”符合汉语对土地的自然指称。
- source_word: אֲשֶׁר נִשְׁבַּע יְהוָה לַאֲבֹתֶיךָ
  choice: 雅威向你列祖起誓应许的
  rationale: “起誓”明确保留 נשבע 的誓言性质；“应许”补足汉语中对所起之誓内容的自然表达，并未把誓言弱化为普通承诺。
- source_word: לַאֲבֹתֶיךָ
  choice: 向你列祖
  rationale: “列祖”准确反映阳性复数亲属称谓及其在族长之约背景中的历史指向。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名。采用“雅威”以拟音方式保留其专名性质；“耶和华”虽为中文传统译名，但其形式与较晚的 Jehovah 读法相关。
- issue: לַאֲבֹתֶיךָ 的性别与历史指向
  choice: 你列祖
  alternative: 你的祖先
  rationale: “列祖”保留原文阳性复数称谓，并符合此处指向以色列族长及其所领受土地誓约的语境。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“正直、良善”“安好”“列祖”等用语略具经文庄重感，但仍易于普通读者理解；句法尽量贴近原文的命令、目的和结果关系。
