base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/005.yaml
  text: And you shall love Yahweh your God with all your heart and with all your soul and with all your might[a][b].
translation:
  language: zh_hans
  text: 你要尽心、尽性[a]、尽力[b]爱雅威你的神。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里译作“性”的希伯来语词也可指“生命”“自己”或“整个人”。
    reason: lexical_alternative
  - marker: b
    text: 这里译作“力”的希伯来语词本义与“极多、丰盛”有关，可涵盖力量、全副精力或所拥有的资源。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָהַבְתָּ
  choice: 你要……爱
  rationale: 该形式在盟约劝诫语境中具有命令意味；“要”自然表达应当遵行的要求，而不是单纯预告未来。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文四字神名的常见拟音直接译出其专名，不以“主”这一称号代替。
- source_word: אֱלֹהֶיךָ
  choice: 你的神
  rationale: 尽管אֱלֹהִים在形态上是复数形式，此处所指为以色列的神，且带第二人称单数后缀，因此译作“你的神”。
- source_word: בְּכָל
  choice: 尽
  rationale: 三个短语中反复出现的בְּכָל强调毫无保留的全然投入；汉语排比“尽心、尽性、尽力”简洁而有力地保留这种重复和总体性。
- source_word: לְבָבְךָ
  choice: 尽心
  rationale: לֵבָב指人的内在，包括思想、意志和情感；“心”保留其宽广含义，不把它缩窄为单纯的感情或理智。
- source_word: נַפְשְׁךָ
  choice: 尽性
  rationale: נֶפֶשׁ可指生命、自己或整个人。“性”沿用简洁庄重的汉语圣经表达，并以脚注说明其范围，避免将其限定为与身体分离的“灵魂”。
- source_word: מְאֹדֶךָ
  choice: 尽力
  rationale: מְאֹד本义与“极多、丰盛”有关，在这里名词化，涵盖人的力量、能力乃至资源。“尽力”自然简练，同时脚注保留其不寻常而宽广的语义。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用以色列神的专名。译作“雅威”保存其专名性质，而不以称号代换；“耶和华”则基于较晚形成的混合读法。
- issue: “心、性、力”所表达的人观
  choice: 保留三个彼此重叠的整体性用语
  alternative: 分别解释为情感、灵魂和体力三个独立部分
  rationale: 原文并非提出严格划分的人体或心理构成，而是以重叠的词语强调全人的爱与忠诚。因此正文保留排比，脚注提示“性”和“力”的宽广含义，不把它们硬套入现代心理分类。
translation_notes:
  register: 采用现代读者熟悉而庄重的“尽心、尽性、尽力”排比，保留原文三个“全部”的强调。正文简洁适合诵读；两个脚注说明较难在单一汉语词中完整呈现的希伯来语语义。
