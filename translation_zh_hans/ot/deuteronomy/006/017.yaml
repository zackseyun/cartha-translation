base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/017.yaml
  text: You shall diligently keep the commandments of Yahweh your God[a], and his testimonies and his statutes[b], which he has commanded you.
translation:
  language: zh_hans
  text: 你们务要谨守[a]雅威——你们的上帝——的诫命、他的法度[b]和律例，就是他所吩咐你的。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “务要谨守”：原文以“谨守”的绝对不定式与同根动词连用，加强语气；也可译作“必须切实遵守”或“要仔细遵行”。
    reason: lexical_alternative
  - marker: b
    text: “法度”原文也可直译为“见证”，或译作“圣约条款”；这里指具有见证作用的圣约规定。
    reason: lexical_alternative
  - marker: c
    text: 原文前面用复数“你们”，此处转用单数“你”；可能是把以色列全体作为一个整体来称呼。
    reason: textual_clarity
lexical_decisions:
- source_word: שָׁמוֹר תִּשְׁמְרוּן
  choice: 务要谨守
  rationale: 希伯来语以绝对不定式配合同根限定动词来加强语气。“务要”体现强调和命令意味，“谨守”则自然表达忠实遵行、不可违背的圣约责任。
- source_word: מִצְוֺת
  choice: 诫命
  rationale: 该词指上帝所命定的义务；“诫命”既准确，也保留申命记法律与圣约语境的庄重语体。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按其作为上帝专名的功能音译四字神名，不以“主”这一称号代替。
- source_word: אֱלֹהֵיכֶם
  choice: 你们的上帝
  rationale: 保留第二人称复数，并自然呈现申命记常见的圣约称谓。
- source_word: עֵדֹתָיו
  choice: 他的法度
  rationale: 该词可指具有见证作用的圣约规定。“法度”在现代中文宗教—法律语境中较自然，并与“诫命”“律例”有所区别；脚注交代其更直译的含义。
- source_word: חֻקָּיו
  choice: 他的律例
  rationale: 该词指制定并颁布的规定。“律例”庄重、清楚，并能与相邻法律术语区分。
- source_word: אֲשֶׁר צִוָּךְ
  choice: 就是他吩咐你的这一切
  rationale: “这一切”使关系从句自然涵盖前述各类规定；“你”保留马所拉文本由复数称呼转为单数称呼的形式变化，而不擅自统一人称数。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。译作“雅威”保留其专名性质；不以称号“主”替代，也不采用较晚形成的混合读音“耶和华”。
- issue: 第二人称由复数转为单数
  choice: 保留为“你们……你”
  alternative: 全句统一译作“你们”
  rationale: 原文先以复数称呼听众，末尾受词后缀则为单数。申命记常将以色列群体视为一个整体而在单复数之间转换；保留这种变化，避免消除原文的集体性张力。
translation_notes:
  register: 采用现代、庄重而可朗读的普通话。“务要谨守”保留圣约劝诫的力度；“诫命、法度、律例”维持三个相邻法律术语的区别。句末以“这一切”明确关系从句统摄前述规定，同时保留原文人称数的转换。
