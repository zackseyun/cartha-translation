  text: לַ/הֲדֹ֥ף אֶת כָּל אֹיְבֶ֖י/ךָ מִ/פָּנֶ֑י/ךָ כַּ/אֲשֶׁ֖ר דִּבֶּ֥ר יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/019.yaml
  text: to drive out all your enemies from before you[b][a], as Yahweh has spoken.
translation:
  language: zh_hans
  text: 为要把你所有的仇敌从你面前[a]赶走，正如雅威所说的[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译“从你面前”，是指把仇敌从人的前路或所在之处除去。
    reason: cultural_note
  - marker: b
    text: 也可译作“所说过的”。原文动词是“说”，指先前说出、仍然有效的话。
    reason: lexical_alternative
lexical_decisions:
- source_word: לַהֲדֹף
  choice: 为要……赶走
  rationale: 前缀 לְ 加不定式承接上一节，表达目的或结果；הדף 的使役形式表示迫使仇敌退去。“赶走”自然地传达这一军事语境中的动作。
- source_word: כָּל אֹיְבֶיךָ
  choice: 你所有的仇敌
  rationale: 保留 כָּל 的全称意义，以及第二人称阳性单数后缀对以色列整体的直接称呼。
- source_word: מִפָּנֶיךָ
  choice: 从你面前
  rationale: 贴近原文“从你的面前／脸前”，同时保留仇敌从以色列前路或所在之处被除去的希伯来习语。
- source_word: כַּאֲשֶׁר
  choice: 正如
  rationale: 表达现实行动与先前神圣话语之间的对应关系；“正如”在现代汉语中自然且庄重。
- source_word: דִּבֶּר
  choice: 所说的
  rationale: 保留 דבר“说”的基本词义，不将其解释性地改译为“应许”；“所说的”在此可指先前发出、如今仍然有效的话。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，而不以“主”这一称号替代。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用神的专名；“雅威”较直接地按现代学界通常重构的读音音译，并避免用称号代替专名。
- issue: דִּבֶּר 在盟约语境中的语力
  choice: 所说的
  alternative: 所应许的
  rationale: “应许”符合上下文含义，却比原文的“说”更具解释性；正文保留原词的宽度，让先前话语持续有效的意味由语境体现。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“为要”保留本节与上一节之间的目的关系；全句保持片段式承接，不擅自补入上一节的谓语。
