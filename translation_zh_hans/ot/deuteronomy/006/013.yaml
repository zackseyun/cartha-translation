base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/013.yaml
  text: You shall fear Yahweh your God[a], and him you shall serve[b], and by his name you shall swear.
translation:
  language: zh_hans
  text: 你要敬畏耶和华你的上帝[a]，要事奉他[b]，并要指着他的名起誓。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “敬畏”包含尊崇、肃然和畏惧，并不只是害怕。
    reason: lexical_alternative
  - marker: b
    text: 或译“敬拜他”；原文通常指“服事”，在这里也包含以敬拜来事奉。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的专名“耶和华”对应四字神名，保留其作为以色列之上帝的个人名字，而不以“主”这一称号替代。
- source_word: אֱלֹהֶיךָ
  choice: 你的上帝
  rationale: 该词为带第二人称阳性单数后缀的形式，直译为“你的上帝”，符合盟约劝诫中的直接称呼。
- source_word: תִּירָא
  choice: 要敬畏
  rationale: ירא在此包含惧怕、尊崇和 awe 的复合含义；“敬畏”是自然而庄重的现代中文表达，并保留神圣威严所引发的畏惧感。
- source_word: וְאֹתוֹ
  choice: 要……他
  rationale: 保留明确的第三人称宾语，以体现希伯来语的强调；经文未明说“单单”，故不增译。
- source_word: תַעֲבֹד
  choice: 事奉
  rationale: עבד基本义为“服事、效劳”，在对上帝的语境中包含敬拜性的服事；“事奉”既保留行动和忠诚的广度，也符合现代中文宗教语境。
- source_word: וּבִשְׁמוֹ
  choice: 并要指着他的名
  rationale: ב与“名”连用并涉及起誓时，表示起誓所凭借或援引的名；中文惯用“指着……的名起誓”。
- source_word: תִּשָּׁבֵעַ
  choice: 起誓
  rationale: שׁבע的Niphal形式表示“宣誓、起誓”；与“指着他的名”搭配自然准确。
- source_word: אֶת
  choice: 不单独译出
  rationale: 这是直接宾语标记，其语法功能已由中文句法体现，无须另译。
theological_decisions:
- issue: 是否把 תִּירָא 弱化为单纯的“尊崇”
  choice: 正文采用“敬畏”
  alternative: 惧怕；尊崇
  rationale: “敬畏”兼顾畏惧、崇敬和肃然之感，避免把该命令缩减为恐惧或一般性的尊重，保留盟约要求的严肃张力。
- issue: 将 תַעֲבֹד 译为“事奉”还是“敬拜”
  choice: 正文采用“事奉”
  alternative: 敬拜
  rationale: “事奉”更能保留 עבד 所含服事、顺服和忠诚行动的广度；“敬拜”虽符合宗教语境，却可能把意义收窄为礼仪行为。
- issue: 是否在“事奉他”中加入“单单”
  choice: 不加入“单单”
  alternative: 单单事奉他
  rationale: 上下文确有排他性的盟约忠诚要求，但本节希伯来文本没有明说“单单”；因此保留明确代词所形成的强调，而不将语境推论写入正文。
translation_notes:
  register: 采用现代、庄重且易懂的标准普通话。“你要……要……并要……”再现连续命令的结构；“耶和华”作为中文传统中广为人知的神名形式；“上帝”清楚自然。“指着他的名起誓”采用现代中文仍可理解的盟誓表达。
