base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/008.yaml
  text: And you shall bind them as a sign on your hand[a], and they shall be as frontlets between your eyes.
translation:
  language: zh_hans
  text: 你要把这些话系在手上，作为记号；它们要作你两眼之间的额饰[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “额饰”或可译作“额带”；传统上也理解为“经匣”，即后来犹太习俗中佩戴的小匣。希伯来语原词罕见，确切所指不明。
    reason: 说明罕见词的词义不确定性，并保留传统解释而不将其写入正文。
lexical_decisions:
- source_word: וּקְשַׁרְתָּם
  choice: 你要把这些话系
  rationale: 该动词在连续的训诲语境中表达命令；“系”保留具体动作。阳性复数宾语后缀所指为上文的话语，因此为使中文指代清楚，译作“这些话”。
- source_word: לְאוֹת
  choice: 作为记号
  rationale: אוֹת常指“记号、标记”；此处介词לְ表示用途或身份，“作为记号”自然且不额外解释其象征方式。
- source_word: עַל יָדֶךָ
  choice: 在手上
  rationale: יָד的基本义为“手”，虽可延伸指手臂，但此处采用直接词义，避免解释性扩大。
- source_word: וְהָיוּ
  choice: 也要让它们成为
  rationale: 该形式延续命令性语序；这样既保留与前句的并列关系，也符合现代汉语表达。
- source_word: לְטֹטָפֹת
  choice: 额饰
  rationale: טֹטָפֹת是罕见词，通常理解为佩于前额的饰物或带状物。“额饰”简明保留其位置与物件性质，同时不把后来特定的经匣习俗直接写入正文。
- source_word: בֵּין עֵינֶיךָ
  choice: 两眼之间
  rationale: 按希伯来语具体意象直译，不改写为解释性的“额头上”，从而保留其字面、象征或兼具二者的可能性。
theological_decisions:
- issue: 此命令是要求实际佩戴，还是以身体意象表达持续牢记
  choice: 保留具体的身体与佩戴意象，不在译文中判定是字面、象征，还是二者兼有
  alternative: 意译为要常常牢记这些话，或明确译为后来犹太习俗中的经匣
  rationale: 原文使用具体的“手”“两眼之间”和系戴物件的语言，但没有在本节中说明应如何界定其实践方式；译文应保留这种诠释张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“这些话”明示复数代词与上文的衔接；分号呈现两个平行分句。“额饰”虽略具书面色彩，但普通读者可据字面理解，且脚注补充其不确定性与传统译法。
