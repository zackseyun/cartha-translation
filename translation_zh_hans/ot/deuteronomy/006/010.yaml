base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/010.yaml
  text: And when Yahweh your God brings you into the land that he swore to your fathers—to Abraham[a], to Isaac, and to Jacob—to give you, with great and good cities that you did not build,
translation:
  language: zh_hans
  text: 当雅威你的上帝领你进入他向你列祖——亚伯拉罕、以撒、雅各——起誓要赐给你的那片土地时，那里有又大又好的城，是你没有建造的；
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: 当……时
  rationale: 该结构引出将来的情形；用“当……时”自然地承接上文，也保留时间关系。
- source_word: יְבִיאֲךָ
  choice: 领你进入
  rationale: בוא 的使役形表达“使进入、带入”；“领你进入”在现代汉语中自然，并保留使役含义。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文直接音译上帝的专名，不以称号替代。
- source_word: אֱלֹהֶיךָ
  choice: 你的上帝
  rationale: 准确表达第二人称单数所属后缀。
- source_word: הָאָרֶץ
  choice: 那片土地
  rationale: 在申命记的应许语境中指所应许之地；“土地”保留其地域与盟约背景，“那片”使汉语指称自然。
- source_word: אֲשֶׁר נִשְׁבַּע
  choice: 他……起誓
  rationale: 保留 שׁבע 的起誓、立誓含义，不弱化为一般的“应许”。
- source_word: לַאֲבֹתֶיךָ
  choice: 向你列祖
  rationale: “列祖”是庄重而易懂的现代圣经语体，且下文明确列出亚伯拉罕、以撒、雅各，保留父系先祖的具体性。
- source_word: לְאַבְרָהָם לְיִצְחָק וּלְיַעֲקֹב
  choice: 亚伯拉罕、以撒、雅各
  rationale: 采用现代汉语中通行的人名译法；汉语无需逐一重复介词。
- source_word: לָתֶת לָךְ
  choice: 要赐给你
  rationale: 表达不定式所说明的起誓内容；“赐给”符合上帝作为给予者的庄重语境。
- source_word: עָרִים גְּדֹלֹת וְטֹבֹת
  choice: 又大又好的城
  rationale: 分别保留“大”和“好”的基本语义，不额外解释为繁荣或华美。
- source_word: אֲשֶׁר לֹא בָנִיתָ
  choice: 是你没有建造的
  rationale: 直接表达否定关系从句和第二人称单数。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华／主
  rationale: 原文使用四字神名；音译为“雅威”保留其专名性质，而不以称号替代。
- issue: לַאֲבֹתֶיךָ 的亲属称谓
  choice: 你列祖
  alternative: 你的祖先
  rationale: 原词为阳性复数，且随即具体指亚伯拉罕、以撒、雅各；“列祖”保留这一父系先祖的明确所指。
- issue: 城市与土地在句法上的关系
  choice: 译作“那里有……城”
  alternative: 把城市直接处理为“土地”的同位内容
  rationale: 希伯来文在“赐给你的”之后接宾语“城”，并延续至后续经节。汉语加入“那里有”以显明这些城位于所赐之地中，同时不把它们解释成另一项独立应许。
translation_notes:
  register: 采用现代、庄重、普通读者易懂的书面汉语。“列祖”“赐给”保留经文语体但不过度古雅。原句跨越至后续经节，本节末用分号，体现第10节尚未完成的列举结构。
