base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/023.yaml
  text: And he brought us out from there[a], so that he might bring us in, to give us the land that he swore to our fathers.
translation:
  language: zh_hans
  text: 他把我们从那里领出来，为要领我们进去，把他向我们列祖起誓要赐的那地赐给我们。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我们的祖先”。希伯来文直译：“我们的父辈”。
    reason: 说明“列祖”的现代词义替代，并交代原文的阳性亲属称谓。
lexical_decisions:
- source_word: וְאוֹתָנוּ הוֹצִיא מִשָּׁם
  choice: 他把我们从那里领出来
  rationale: 前置宾语在中文中按自然语序处理；“领出来”准确表达使役义，也与后文“领我们进去”形成出与入的对应。
- source_word: לְמַעַן
  choice: 为要
  rationale: 明确保留目的含义，语体庄重而不生硬。
- source_word: הָבִיא אֹתָנוּ
  choice: 领我们进去
  rationale: 保留“使进入”的含义以及与前句“领出来”的紧密对照；目的地由下文“那地”说明。
- source_word: לָתֶת לָנוּ אֶת־הָאָרֶץ
  choice: 把……那地赐给我们
  rationale: “赐”自然体现上帝作为土地授予者；“那地”指语境中所应许之地，并保留原文定指。
- source_word: אֲשֶׁר נִשְׁבַּע
  choice: 他……起誓要赐的
  rationale: 原文直译“他所起誓的”在中文中缺少誓言内容；结合“赐地”这一结构，译为“起誓要赐”既自然又保留誓约力度。
- source_word: לַאֲבֹתֵינוּ
  choice: 向我们列祖
  rationale: “列祖”准确保留复数男性先辈及以色列盟约传统中的先祖含义。
theological_decisions:
- issue: לַאֲבֹתֵינוּ 的性别与盟约指向
  choice: 向我们列祖
  alternative: 向我们的祖先
  rationale: “列祖”保留原文阳性复数和盟约历史中的先祖指向，同时是现代中文圣经语境中可理解的庄重表达。
- issue: נִשְׁבַּע 的誓约含义
  choice: 起誓要赐
  alternative: 应许要赐
  rationale: 选择“起誓”而非仅仅“应许”，保留上帝以誓言确认赐地承诺的神学分量。
- issue: 出与入的目的关系
  choice: 领出来，为要领……进去
  alternative: 救出来，好把……带到
  rationale: 保留原文使役动词之间“出来／进去”的修辞对应，不把“领出”进一步解释为“拯救”，也不消除目的结构。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“列祖”略带经文语体，但在此盟约语境中准确且通行。脚注标记置于整节末尾，所释词语为“列祖”。
