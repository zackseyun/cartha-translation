base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/025.yaml
  text: And it will be righteousness for us if we are careful to do all this commandment before Yahweh our God[b][a], as he has commanded us.
translation:
  language: zh_hans
  text: 若我们在耶和华我们上帝面前谨慎遵行他所吩咐的这一切诫命[b]，这就成为我们的义[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “义”也可译作“公义”或“正义”。这里指在盟约关系中合乎正道。
    reason: lexical_alternative
  - marker: b
    text: “这一切诫命”：原文“诫命”为单数，也可译作“这整套诫命”，把有关训令视为一个统一整体。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּצְדָקָה
  choice: 这就是我们的义
  rationale: צְדָקָה在此指合乎正道、在盟约关系中被视为正；译作“义”保留其道德与法理色彩，也不额外引入“算为”等后期神学术语。
- source_word: תִּהְיֶה לָּנוּ
  choice: 这就是我们的……
  rationale: 希伯来语直译为“这对我们将是……”。中文用“这就是我们的义”自然表达其表语关系，同时避免把它解释成技术性的归算机制。
- source_word: כִּי
  choice: 若
  rationale: 此处引出条件，译作“若”最能呈现经文的条件关系；“因为”会强化因果含义。
- source_word: נִשְׁמֹר לַעֲשׂוֹת
  choice: 谨慎遵行
  rationale: שׁמר带有留心、谨守之意，עשה指实行；“谨慎遵行”简洁保留二者组合所表达的认真履行。
- source_word: כָּל הַמִּצְוָה הַזֹּאת
  choice: 这一切诫命
  rationale: 原文“诫命”为单数，并由“全部”修饰，可能把整套训令视为统一整体。正文采用自然中文“这一切诫命”，脚注说明原文形式及另一译法。
- source_word: לִפְנֵי
  choice: 在他面前
  rationale: 保留“在……面前”的空间与关系意象，表达人在上帝鉴察之下履行盟约要求。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文圣经语域中对四字神名最通行、最易识别的音译，不以头衔替代专名。
- source_word: אֱלֹהֵינוּ
  choice: 我们上帝
  rationale: 准确保留第一人称复数所属关系及盟约关系称谓。
- source_word: כַּאֲשֶׁר צִוָּנוּ
  choice: 所吩咐的
  rationale: 在中文定语结构中自然表达“照他吩咐我们的”，且清楚表明诫命源自上帝先前的吩咐。
theological_decisions:
- issue: 盟约顺服与“义”的关系
  choice: 经文说，谨慎遵行整套诫命就是“我们的义”，保留顺服与在上帝面前为义之间的真实联系。
  alternative: 译成“这就算为我们的义”，或把צְדָקָה仅译为社会层面的“公正”。
  rationale: 原文没有明确使用“归算”一类技术性措辞，也不把该词限定为社会公义；直译其表语关系可保留经文本身的神学张力，而不预先规定后期系统神学机制。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“谨慎遵行”保留两个希伯来动词的合力；调整语序，将“在他面前”置于结论前，使中文关系清楚。正文中的[a][b]均有对应脚注。
