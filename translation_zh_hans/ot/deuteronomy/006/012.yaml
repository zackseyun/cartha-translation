  text: הִשָּׁ֣מֶר לְ/ךָ֔ פֶּן תִּשְׁכַּ֖ח אֶת יְהוָ֑ה אֲשֶׁ֧ר הוֹצִֽיאֲ/ךָ֛ מֵ/אֶ֥רֶץ מִצְרַ֖יִם מִ/בֵּ֥ית עֲבָדִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/012.yaml
  text: Be careful lest you forget Yahweh[a], who brought you out of the land of Egypt, out of the house of slaves.
translation:
  language: zh_hans
  text: 你要谨慎，免得忘记雅威[a]，就是那位把你从埃及地、从奴隶之家领出来的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威”译自上帝的希伯来文名字 יהוה（YHWH）；其古代准确读音不能完全确定，通常拟读为“雅威”。
    reason: 说明神名的转写及其古代读音的不确定性。
lexical_decisions:
- source_word: הִשָּׁמֶר לְךָ
  choice: 你要谨慎
  rationale: 该结构是带反身强调的尼法勒命令式，发出郑重警告。“你要谨慎”在现代汉语中自然，并保留命令语气；上下文中的“你”为阳性单数，指作为整体受 خطاب的以色列。
- source_word: פֶּן תִּשְׁכַּח
  choice: 免得忘记
  rationale: פֶּן引出应当避免的危险后果；“免得”简洁地保留警戒意味，也符合本段庄重语体。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名形式音译四字神名，不以“主”这一称号替代。
- source_word: הוֹצִיאֲךָ
  choice: 领你离开
  rationale: יצא的使役形在出埃及语境中意为使某人出来，即“带领出来”。“领你离开”自然表达拯救行动，同时与后面的两个מִן短语顺畅衔接。
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: 离开埃及地
  rationale: 保留原文明确出现的“地”，并以自然现代汉语表达从该地出来。
- source_word: מִבֵּית עֲבָדִים
  choice: 脱离奴隶之家
  rationale: 原文具体说“奴隶的家/奴隶之家”，עֲבָדִים是复数的“奴隶”，不是抽象名词“奴役”。正文保留这一具体意象，并用脚注说明惯用译法。
theological_decisions:
- issue: 四字神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用上帝的专名而非称号。正文采用现代中文圣经传统中广为人知的“耶和华”，并在脚注注明更接近学界通常拟音的“雅威”，既保留专名，也不掩盖发音方面的不确定性。
- issue: 出埃及公式中עֲבָדִים的具体或抽象表达
  choice: 奴隶之家
  alternative: 为奴之家／受奴役之地
  rationale: 希伯来文使用具体复数名词“奴隶”。正文保留其具体性与“家”的比喻，不将其直接抽象化为“奴役”；脚注提供更符合汉语习惯的理解。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“你”为单数，与希伯来文第二人称阳性单数一致，但在申命记语境中集合性地指以色列。“他曾”使关系从句在汉语中更自然；分号避免连续关系修饰造成歧义。
