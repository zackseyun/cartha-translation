revisions:
- from: 你要谨慎，免得忘记耶和华[a]；他曾领你离开埃及地，脱离奴隶之家。[b]
  to: 你要谨慎，免得忘记雅威[a]，就是那位把你从埃及地、从奴隶之家领出来的。
  rationale: 将神名改为“雅威”，以对应源文 יהוה及英文 POB 的 Yahweh 术语决定；重组后半句，使“从埃及地、从奴隶之家”直接并列修饰“领出来”，更准确反映原文句法。保留“奴隶之家”及其脚注，以维持具体复数名词和“家”的意象。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T04:57:10Z'
review_pass:
  verdict: revise
  source_fidelity: 正文应更清楚地保留两个由“从”引出的并列来源短语，并将关系从句直接连接于“雅威”。“领你离开……脱离……”虽大意可通，却弱化了原文重复的介词结构；“把你从埃及地、从奴隶之家领出来”更贴近原文。
  naturalness: “你要谨慎，免得……”庄重、清楚且符合现代标准汉语。“奴隶之家”略带文献语体，也可能在自然汉语中产生“奴隶的家庭”而非奴役处所的轻微歧义；但为保留原文“房屋／家”和复数“奴隶”的具体表达，可保留，并以脚注说明惯用理解。
  terminology: 原文是四字神名，英文审校轨迹明确采用 Yahweh。中文正文宜采用与之相应的“雅威”，而不是传统但不同音译惯例的“耶和华”。עֲבָדִים为具体复数名词，保留“奴隶”是恰当的；不宜在正文改为抽象的“奴役”。
  issues:
  - severity: medium
    issue: 神名正文采用“耶和华”，与本项目英文审校轨迹规定的 Yahweh 不一致。
    rationale: 源文为 יהוה，英文 POB 明确以 Yahweh 转写而非 Jehovah。中文“雅威”是与 Yahweh 相对应的通行学术拟音；脚注既已说明此拟读，正文使用“耶和华”反而造成术语不一致。
  - severity: low
    issue: “他曾领你离开埃及地，脱离奴隶之家”未显明原文两个并列的“从”短语。
    rationale: הוֹצִיאֲךָ后接“从埃及地、从奴隶之家”。改作“把你从埃及地、从奴隶之家领出来”可自然地保留这一结构，也避免“他曾”在关系从句中造成不必要的断开。
  revised_text: 你要谨慎，免得忘记雅威[a]，就是那位把你从埃及地、从奴隶之家领出来的。
  revised_footnotes:
