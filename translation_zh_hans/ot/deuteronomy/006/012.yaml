    text: “雅威”译自上帝的希伯来文名字 יהוה（YHWH）；其古代准确读音不能完全确定，通常拟读为“雅威”。
    reason: 说明神名的转写及其古代读音的不确定性。
  - marker: b
    text: “奴隶之家”直译希伯来文；也可按惯用表达译为“为奴之家”或“受奴役之地”。
    reason: 保留原文“家／房屋”及具体复数“奴隶”的表达，并说明较自然的汉语理解。
