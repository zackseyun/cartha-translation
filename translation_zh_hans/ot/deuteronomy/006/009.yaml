  text: You shall write them on the doorposts of your house and on your gates[a][b].
translation:
  language: zh_hans
  text: 你要把这些话写在你家门口的门柱上[a]，也写在你的城门上[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“门框上”。原文特指门口两侧的柱子。
    reason: lexical_alternative
  - marker: b
    text: 或译“你的各门口上”或“你的各门柱上”。原文可指门、城门或其入口区域；正文译“城门”是按此处语境的常见理解。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְתַבְתָּם
  choice: 你要把这些话写
  rationale: 该形式在连续命令的语境中表达吩咐；宾语后缀“它们”回指上文所说的这些话。现代汉语用“这些话”明确回指，比直译“把它们写”更自然。
- source_word: מְזוּזֹת
  choice: 门柱
  rationale: 该词具体指门口两侧的柱子；“门柱”准确、简洁，也避免用音译词引入后来的宗教器物含义。
- source_word: בֵּיתֶךָ
  choice: 你家
  rationale: 原词既可指房屋，也可指家庭居所；此处涉及门柱这一实体结构，“你家”在现代汉语中自然，并保留具体居所的含义。
- source_word: וּבִשְׁעָרֶיךָ
  choice: 也写在你的城门上
  rationale: שַׁעַר 可指有结构的出入口、院门或城门及其门区。结合申命记的社会语境，正文采用常见的“城门”，并以脚注保留范围上的歧义。
