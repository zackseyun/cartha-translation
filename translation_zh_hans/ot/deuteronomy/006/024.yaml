base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/024.yaml
  text: And the LORD commanded us to do all these statutes, to fear the LORD our God, for our good always, to keep us alive as it is this day.
translation:
  language: zh_hans
  text: 耶和华吩咐我们遵行这一切律例，敬畏耶和华我们的上帝，为要使我们一生得益，保全我们的性命，如同今日一样。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֻקִּים
  choice: 律例
  rationale: 指颁布并要求遵守的规定；“律例”庄重、通行，也与申命记的法律语境相称。
- source_word: לְיִרְאָה
  choice: 敬畏
  rationale: 既包含敬重，也包含对上帝应有的畏惧与顺服；“敬畏”保留了希伯来词的完整语义范围。
- source_word: לְטוֹב לָנוּ כָּל־הַיָּמִים
  choice: 使我们常得福
  rationale: 直译为“使我们一切日子得好处”；此处用自然汉语表达持续对百姓有益之意，不将“好处”限定为物质利益。
- source_word: לְחַיֹּתֵנוּ
  choice: 保全我们的性命
  rationale: 该使役形式表达“使我们存活、保守我们活着”；此译较“赐生命”更贴近具体语境。
- source_word: כְּהַיּוֹם הַזֶּה
  choice: 像今日一样
  rationale: 保留原文对当下存活状况的指涉，也保留其简洁表达。
theological_decisions:
- issue: 两个目的不定式所表达的关系
  choice: 译作“使我们常得福，并保全我们的性命”
  alternative: “为要使我们常得福，使我们存活”
  rationale: 原文以两个 לְ 短语并列，均可表示目的或结果；正文采用自然的目的—结果表达，但不额外建立两者之间的因果层级。
- issue: 圣名 יהוה 的译法
  choice: 耶和华
  alternative: 上主
  rationale: 采用现代中文圣经读者熟悉的专名形式，并与随后“我们的上帝”所表达的称谓区分开来。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“遵行”“律例”“敬畏”延续申命记的盟约与训诲语域；句式尽量贴近原文的命令、目的与恩惠结构，同时避免生硬逐词直译。
