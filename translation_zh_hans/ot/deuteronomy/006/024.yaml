  source_fidelity: “律例”“敬畏”“保全我们的性命，如同今日一样”均能对应原文。惟“使我们常得福”将 לְטוֹב לָנוּ（为我们的益处）较明显地窄化为“得福”，并略弱化“所有日子”的持续范围。
