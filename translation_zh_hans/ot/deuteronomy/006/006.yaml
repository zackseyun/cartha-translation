base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/006.yaml
  text: And these words that I am commanding you today shall be on your heart[a].
translation:
  language: zh_hans
  text: 我今天吩咐你的这些话，要放在你心上[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在你心里。”希伯来语直译为“在你心上”；此处“心”包括人的思想、意志和情感，指把这些话持守在内心。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיוּ
  choice: 要常在
  rationale: 该形式承接上文命令语境，带有应当如此的训令意味；“要”自然表达这一语气，“常”则在汉语中帮助呈现持续存记于心的语境含义。
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: 这些话
  rationale: דְּבָרִים在此指刚刚宣告并吩咐的话；“这些话”既贴近词义，又避免提前解释为范围更窄的“诫命”。
- source_word: אֲשֶׁר
  choice: （由“我今天吩咐你的”关系分句表达）
  rationale: 希伯来语关系词在现代汉语中无需另译，以前置修饰语自然表达。
- source_word: אָנֹכִי
  choice: 我
  rationale: 独立代词略带强调，但本句汉语用“我”即可清楚、自然地保留说话主体，不必增译“我亲自”。
- source_word: מְצַוְּךָ
  choice: 吩咐你
  rationale: 分词表达当前讲话中的吩咐行为；结合“今天”，汉语“吩咐你”可自然呈现这一即时言语行为。
- source_word: הַיּוֹם
  choice: 今天
  rationale: 准确保留摩西当下讲话的时间指向，且符合现代汉语。
- source_word: עַל לְבָבֶךָ
  choice: 在你心上
  rationale: 保留עַל“在……上”的希伯来语意象，以及לֵבָב所涵盖的思想、意志与情感；正文采用汉语可理解但仍较贴近原文的表达。
theological_decisions:
- issue: לְבָב的人的内在生命用语
  choice: 心
  alternative: 心思；内心
  rationale: 希伯来语“心”同时涉及思想、意志和情感。保留“心”可维持圣经自身的人观，不把含义缩窄为单纯认知。
- issue: עַל לְבָבֶךָ的介词意象
  choice: 在你心上
  alternative: 在你心里
  rationale: “在你心上”较直接保留原文“在/置于心上”的图像；脚注给出更顺畅的汉语表达，避免把两种表达之间的差异隐藏起来。
translation_notes:
  register: 采用现代、庄重而通俗的普通话。“我今天吩咐你的这些话”按汉语习惯以前置关系分句组织；“要常在你心上”兼顾原文训令语气、持续内化的语境和希伯来语意象。
