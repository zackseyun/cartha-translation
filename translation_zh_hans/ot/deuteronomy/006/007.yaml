base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/007.yaml
  text: You shall teach them diligently to your sons[a], and you shall speak of them when you sit in your house, and when you walk on the road, and when you lie down[b], and when you rise.
translation:
  language: zh_hans
  text: 你要殷勤地把这些话教导给你的儿子[a]；无论你坐在家里，走在路上，躺下或起来，都要谈论这些话。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文为阳性复数，直译为“你的儿子们”。所用动词本有“磨利”之意，这里比喻借着反复、用心的教导，使这些话深入人心；按家庭教导的语境，也可延伸理解为家中的儿女。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁנַּנְתָּם
  choice: 把这些话反复教导
  rationale: שׁנן本义与“磨利”有关，此处比喻持续、认真地灌输教导。“反复教导”在现代汉语中自然，也保留了动作的强化和重复意味；宾语代词按上文所指译为“这些话”。
- source_word: לְבָנֶיךָ
  choice: 你的儿子们
  rationale: בנים为阳性复数，带第二人称单数所属后缀，字面是“你的儿子们”。正文保留原文的性别形式，不直接泛化为“儿女”或“孩子们”。
- source_word: וְדִבַּרְתָּ בָּם
  choice: 都要谈论这些话
  rationale: דבר与介词ב及代词后缀连用，在此自然表达“谈论它们”。汉语用“这些话”明确承接上文，比“谈论它们”更自然。
- source_word: בְּשִׁבְתְּךָ בְּבֵיתֶךָ
  choice: 你坐在家里……的时候
  rationale: 带ב的动词不定式结构表示时间情境；译文用统摄四个场景的“……的时候”，简洁地表达日常、习惯性的处境。
- source_word: וּבְלֶכְתְּךָ בַדֶּרֶךְ
  choice: 走在路上
  rationale: דרך可指道路或行程。“走在路上”既贴近字面，也自然涵盖外出行路的日常场景。
- source_word: וּבְשָׁכְבְּךָ
  choice: 躺下
  rationale: 保留原文动作表达，语境中可自然指就寝或卧下。
- source_word: וּבְקוּמֶךָ
  choice: 起来
  rationale: 保留קום的基本动作意义，并与“躺下”形成原文中的对应关系；语境可包括起床，但不将含义限缩为睡醒。
theological_decisions:
- issue: 盟约教导中带性别的子嗣称谓
  choice: 你的儿子们
  alternative: 你的孩子们／你的儿女
  rationale: 希伯来文明确使用阳性复数“儿子们”。正文保留这一形式，以免在翻译中消除原文的性别表达；脚注说明该教导在家庭中的延伸理解。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“你要……都要……”保留命令语气；以分号分隔教导对象和贯穿日常生活的四种情境。脚注标记均置于其实际说明的词语之后，并纠正咨询层中脚注标记与说明内容错位的问题。
