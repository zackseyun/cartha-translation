  text: 'Hear[a], Israel: Yahweh our God, Yahweh is one.'
translation:
  language: zh_hans
  text: 以色列啊，你要听：耶和华是我们的上帝；耶和华是独一的。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“耶和华是我们的上帝；惟有耶和华（是上帝）。”也可译：“耶和华我们的上帝是独一的耶和华。”希伯来原文十分简练，在句法上可以有不止一种合理的理解。
    reason: alternative_reading
lexical_decisions:
- source_word: שְׁמַע
  choice: 你要听
  rationale: 这是对作为整体的以色列所用的阳性单数命令式。“你要听”既保留听见之义，也自然包含留心听从的盟约呼召。
- source_word: יִשְׂרָאֵל
  choice: 以色列
  rationale: 按现代汉语通行形式音译，指立约的群体。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名“耶和华”对应四字神名，保留其作为上帝专名的功能，而不以称号“主”替代。
- source_word: אֱלֹהֵינוּ
  choice: 我们的上帝
  rationale: 该词虽具有复数形式特征，但在此盟约语境中按希伯来语通常用法指以色列的上帝，故译为单数。
- source_word: אֶחָד
  choice: 独一的
  rationale: אֶחָד的基本义是“一”。在本句论及耶和华时，汉语直译“是一个”不自然且容易产生误解；“独一的”自然表达其一体、唯一的宣认，同时不把正文直接改译为仅有排他意义的“惟独”。脚注保留其他句法理解。
theological_decisions:
- issue: “示玛”末句的句法与含义
  choice: 耶和华是我们的上帝；耶和华是独一的
  alternative: 耶和华是我们的上帝，惟独耶和华；或：耶和华我们的上帝是独一的耶和华
  rationale: 希伯来文是紧凑的无系词结构，可作不止一种合理的句法分析。正文采用最少增补、延续传统一神宣认的读法；不在正文中以“惟独”消除原文在“一”与“唯独”之间的张力，并在脚注列出其他可行译法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“以色列啊，你要听”保留呼告和命令的力度；分号呈现两个紧密相连的无系词分句。神名使用中文通行形式“耶和华”。
