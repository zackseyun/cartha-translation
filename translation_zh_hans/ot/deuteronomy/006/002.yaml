  text: לְמַ֨עַן תִּירָ֜א אֶת יְהוָ֣ה אֱלֹהֶ֗י/ךָ לִ֠/שְׁמֹר אֶת כָּל חֻקֹּתָ֣י/ו וּ/מִצְוֺתָי/ו֮ אֲשֶׁ֣ר אָנֹכִ֣י מְצַוֶּ/ךָ֒ אַתָּה֙ וּ/בִנְ/ךָ֣ וּ/בֶן בִּנְ/ךָ֔ כֹּ֖ל יְמֵ֣י חַיֶּ֑י/ךָ וּ/לְמַ֖עַן יַאֲרִכֻ֥/ן יָמֶֽי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/002.yaml
  text: so that you may fear Yahweh your God[a], by keeping all his statutes and his commandments that I am commanding you—you and your son and your grandson—all the days of your life[c][b], and so that your days may be prolonged.
translation:
  language: zh_hans
  text: 为使你敬畏耶和华你的上帝[a]，一生谨守他的一切律例和诫命，就是我吩咐你的——你、你的儿子和你儿子的儿子[b]——也使你的日子得以长久[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “敬畏”也可译作“惧怕”或“尊崇”。希伯来语兼有惧怕、敬重和肃然敬畏之意。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“你、你的儿子和你儿子的儿子”。
    reason: lexical_alternative
  - marker: c
    text: 或译：“使你的日子延长。”
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן תִּירָא
  choice: 为使你敬畏
  rationale: לְמַעַן引出目的或结果；“为使”保留其目的意味。敬畏既包含惧怕，也包含尊崇与敬畏之情。
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: 耶和华你的上帝
  rationale: 以中文通行音译“耶和华”呈现四字神名，并保留“你的上帝”所表达的圣约关系。
- source_word: לִשְׁמֹר
  choice: 谨守
  rationale: 此不定式说明敬畏上帝的具体表现或途径；“谨守”自然地表达留心遵行。
- source_word: חֻקֹּתָיו וּמִצְוֺתָיו
  choice: 他的一切律例和诫命
  rationale: 分别译出两类圣约规定，避免把两个希伯来词合并为一个笼统概念。
- source_word: אֲשֶׁר אָנֹכִי מְצַוֶּךָ
  choice: 就是我吩咐你的
  rationale: 关系从句修饰律例和诫命；“就是”使现代汉语衔接清楚，不添加原文没有的“今日”。
- source_word: אַתָּה וּבִנְךָ וּבֶן בִּנְךָ
  choice: 你、你的儿子和你儿子的儿子
  rationale: 保留原文明确列出的三代，并直译“你儿子的儿子”，不泛化为所有子孙。
- source_word: כֹּל יְמֵי חַיֶּיךָ
  choice: 你一生的日子都这样行
  rationale: “一生的日子”保留原文表达；补出“这样行”承接“谨守”，使汉语结构完整，但不增加新的命令内容。
- source_word: וּלְמַעַן יַאֲרִכֻן יָמֶיךָ
  choice: 也使你的日子得以长久
  rationale: 保留第二个目的或结果分句以及“日子长久”的希伯来语意象，避免直接改写为较概括的“长寿”。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。中文正文采用读者最熟悉且庄重的传统音译“耶和华”，而不以“主”这一称号替代神名。
- issue: 对上帝“敬畏”的含义
  choice: 敬畏
  alternative: 惧怕
  rationale: “敬畏”能同时容纳惧怕、尊崇和肃然敬重，且保留本节把这种态度与顺服相连的神学张力。
- issue: 长久日子的陈述性质
  choice: 也使你的日子得以长久
  alternative: 使你长寿
  rationale: 保留目的与结果之间未完全消解的关系，并沿用原文“日子”的表达，不把它扩展成无条件的普遍保证。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。“律例和诫命”保留圣约语境中的术语区别；破折号呈现三代人的插入性强调。正文所有脚注标记均已对应列出。
