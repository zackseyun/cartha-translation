  text: וּ/בָ֨תִּ֜ים מְלֵאִ֣ים כָּל טוּב֮ אֲשֶׁ֣ר לֹא מִלֵּאתָ֒ וּ/בֹרֹ֤ת חֲצוּבִים֙ אֲשֶׁ֣ר לֹא חָצַ֔בְתָּ כְּרָמִ֥ים וְ/זֵיתִ֖ים אֲשֶׁ֣ר לֹא נָטָ֑עְתָּ וְ/אָכַלְתָּ֖ וְ/שָׂבָֽעְתָּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/011.yaml
  text: and houses full of every good thing that you did not fill[a], and hewn cisterns that you did not hew[b], vineyards and olive trees that you did not plant—and you eat and are satisfied—
translation:
  language: zh_hans
  text: 还有里面装满各样美物、不是你装满的房屋；有凿成的蓄水池[a]，不是你凿的；有不是你栽种的葡萄园和橄榄树；你将吃，并且得饱足[b]——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “蓄水池”也可译作“水井”；这里的希伯来词更确切地可能指凿入岩石、用来储水的池。
    reason: lexical_alternative
  - marker: b
    text: 也可按顺承译作“你吃了，就饱足了”。这里的希伯来语动词延续以色列进入那地后将要发生之事的叙述次序。
    reason: verbal_sequence
lexical_decisions:
- source_word: בָתִּים
  choice: 房屋
  rationale: 保留具体建筑物的含义，并与本节所列各样物质供应协调。
- source_word: מְלֵאִים כָּל טוּב
  choice: 装满各样美物
  rationale: טוּב在此泛指美好、可享用的物资，而不局限于道德意义上的“善”；“各样美物”自然且庄重。
- source_word: אֲשֶׁר לֹא מִלֵּאתָ
  choice: 却不是你装满的
  rationale: 保留第二人称单数及反差：这些丰富供应并非以色列自己预备。
- source_word: בֹרֹת חֲצוּבִים
  choice: 凿成的蓄水池
  rationale: בֹרֹת在此最可能指凿入岩石、用于储水的池；“蓄水池”比“井”更准确，“凿成”体现חצב的石工意象。
- source_word: אֲשֶׁר לֹא חָצַבְתָּ
  choice: 却不是你凿的
  rationale: 与前面的“凿成”保持词汇呼应，同时保留第二人称单数。
- source_word: כְּרָמִים
  choice: 葡萄园
  rationale: 指种植葡萄的园地，而非仅指单株葡萄树。
- source_word: זֵיתִים
  choice: 橄榄树
  rationale: 复数在本语境中指橄榄树或其栽植；“橄榄树”清楚且不额外加入“园”的集体概念。
- source_word: אֲשֶׁר לֹא נָטָעְתָּ
  choice: 不是你栽种的
  rationale: 直接保留反复出现的结构，强调这些资源并非受话者亲手获得。
- source_word: וְאָכַלְתָּ וְשָׂבָעְתָּ
  choice: 你吃了，就饱足了
  rationale: 这些动词在上下文中延续进入应许之地后将发生的事件序列；中文用“吃了，就饱足了”既自然，也保留结果关系和身体得饱足的基本含义。
theological_decisions:
- issue: 应许之丰富的性质
  choice: 按原文直陈以色列将领受并非自己营造的物质供应
  alternative: 在本节内提前加入警告，或暗示这些财物本身是不义取得的
  rationale: 本节列举房屋、水源与栽种之物，重点在所领受的丰富；警告从下一节展开，不应提前写入本节。
- issue: 第二人称单数称呼
  choice: 全节采用单数“你”
  alternative: 改为“你们”以显明集体对象
  rationale: 希伯来文以 covenantal collective singular 的方式把以色列作为一个整体称为“你”；现代汉语“你”可保留这一显著形式。
- issue: 动词的时间与语篇功能
  choice: 译作“你吃了，就饱足了”，并以脚注说明其未来语境
  alternative: 明说“你将要吃，并且吃饱”
  rationale: 希伯来语形式延续上下文的将来事件序列，但本节自身可用中文顺承表达；脚注保留时间解释，避免把形式上的歧义完全抹平。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。重复“不是你……”以保留原文的修辞节奏；“蓄水池”兼顾古代实物的准确性与现代读者的可理解性。末尾破折号保留与下一节警告之间尚未完结的语篇推进。
