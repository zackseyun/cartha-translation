  rationale: 仅作安全的汉语句法与文体调整：“问你说”改为现代汉语更自然的“问你：”；在“吩咐你们”与法律术语之间补出“遵行”，使原文“命令你们”的受命关系在汉语中明确，避免所属关系歧义。保留原文问题的“是什么”、单数“你”、复数“你们”、神名和脚注锚点。
