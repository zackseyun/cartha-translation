base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/020.yaml
  text: When your son asks you in time to come[a], saying[b], ‘What are the testimonies and the statutes and the judgments that Yahweh our God commanded you?’
translation:
  language: zh_hans
  text: 日后[a]，你儿子问你：“雅威我们的上帝吩咐你们遵行的法度、律例和典章是什么？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “日后”原文直译为“明天”；这里是惯用说法，泛指将来的时候。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 日后……问
  rationale: 这里引出预期将会发生的情形；汉语用“日后……问”自然表达，不必另译为条件性的“如果”。
- source_word: יִשְׁאָלְךָ בִנְךָ
  choice: 你儿子问你
  rationale: 保留原文“儿子”的阳性单数和“你”的单数形式，也符合家庭教导的语境。
- source_word: מָחָר
  choice: 日后
  rationale: 该词字面义为“明天”，但在这里惯用地泛指将来的时候；“日后”既保留时间意味，又符合现代汉语。
- source_word: לֵאמֹר
  choice: 说
  rationale: 该不定式引出问题的直接内容；“问你说”略带经文庄重语体，同时清楚自然。
- source_word: מָה
  choice: 是什么
  rationale: 原文直接问“是什么”，没有明说“是什么意思”；此译保留问题本身可能兼具辨认和求解释的开放性。
- source_word: הָעֵדֹת
  choice: 法度
  rationale: 用“法度”表达具有见证、约约性规范意味的 עֵדוֹת，并与后面的两个法律术语保持区分。
- source_word: הַחֻקִּים
  choice: 律例
  rationale: “律例”是 חֻקִּים 的准确而通行的汉语表达，指规定、制定的条例。
- source_word: הַמִּשְׁפָּטִים
  choice: 典章
  rationale: “典章”可表达司法裁定及法律规范的意味，并维持原文三项并列的区分。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译呈现四字神名，而不以“主”这一称号代替原文专名。
- source_word: אֱלֹהֵינוּ
  choice: 我们的上帝
  rationale: 直接保留第一人称复数所属关系，表达以色列群体与上帝的关系。
- source_word: צִוָּה ... אֶתְכֶם
  choice: 吩咐你们
  rationale: 原文宾语是第二人称阳性复数；汉语明确译作“你们”，从而保留父亲是单数而受命群体是复数的代词转换。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文使用上帝的专名。音译“雅威”保留其专名性质，也较接近通常重建的读音；不以称号“主”替代。
- issue: 儿子与受命群体之间的单复数转换
  choice: “你儿子问你”与“吩咐你们”
  alternative: 两处均泛化为不标明单复数的“你”
  rationale: 原文先以单数称呼父亲，问题中却以复数称呼受命的群体；明确译出这一转换，可保留个人家庭教导与群体领受诫命之间的张力。
- issue: 问题是否明确译为询问“意义”
  choice: 是什么
  alternative: 是什么意思
  rationale: 原文只有疑问词 מָה，并未明确出现“意义”一词。“是什么”在汉语中仍可引出解释，同时不替原文限定问题的范围。
translation_notes:
  register: 采用现代、庄重而可朗读的普通话。“法度、律例和典章”保留原文三个法律术语的并列与差异；句法略作汉语化调整，但保留单数“你”和复数“你们”的重要转换。
