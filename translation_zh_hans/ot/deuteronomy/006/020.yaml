  naturalness: “问你说”虽可理解，但现代普通话中“问你：”更自然简洁。将“吩咐你们的”调整为“吩咐你们遵行的”，可使修饰关系清楚，且在法律诫命语境中自然可朗读。
  terminology: “雅威”“我们的上帝”“法度、律例和典章”均庄重、可理解，并保留神名及三个术语的区分。“遵行”只明确律例、法度作为受命遵守之内容，并不引入特定教派解释。
