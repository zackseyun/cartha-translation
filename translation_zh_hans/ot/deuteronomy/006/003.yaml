base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/003.yaml
  text: So hear[a], Israel, and be careful to do it, that it may go well with you and that you may multiply greatly, just as Yahweh, the God of your fathers, has spoken to you[b], in a land flowing with milk and honey.
translation:
  language: zh_hans
  text: 所以，以色列啊，你要听，也要谨慎遵行，好使你得益处，人数大大增多，正如雅威——你列祖的神——对你所说的：那流奶与蜜之地。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “流奶与蜜”形容土地丰饶富足。
    reason: idiom_explanation
  - marker: b
    text: 原文在“对你所说的”之后紧接“流奶与蜜之地”，句式紧凑。此短语可理解为雅威对以色列所说、所应许的内容；也可理解为以色列得益处并大大增多之地。
    reason: alternative_reading
lexical_decisions:
- source_word: וְשָׁמַעְתָּ
  choice: 你要听
  rationale: שׁמע可指“听、听从、顺服”。此处后接“谨慎遵行”，译作“听”既保留原词的听闻义，也让顺服的含义由整个句子呈现。
- source_word: וְשָׁמַרְתָּ לַעֲשׂוֹת
  choice: 也要谨慎遵行
  rationale: שׁמר与עשה的不定式连用，表示留心持守并付诸实行；“谨慎遵行”简洁地兼顾这两层意思。
- source_word: אֲשֶׁר יִיטַב לְךָ
  choice: 使你得福
  rationale: 直译近于“使你顺遂/使你得好处”。“使你得福”在申命记的祝福语境中自然，但不把福分限定为某一种具体利益。
- source_word: וַאֲשֶׁר תִּרְבּוּן מְאֹד
  choice: 人数大大增多
  rationale: רבה在此主要指人口繁衍增多；补出“人数”可避免现代汉语将“增多”误解为财富或物产增加。
- source_word: כַּאֲשֶׁר דִּבֶּר
  choice: 正如……对你所说的
  rationale: 保留דבר“说”的基本意义，不直接解释成“应许”，虽然后者符合上下文所含的承诺意味。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语中常见的音译呈现四字神名，区别于“主”这一称号。
- source_word: אֱלֹהֵי אֲבֹתֶיךָ
  choice: 你列祖的神
  rationale: אבות字面为“父辈、先祖”；“列祖”保留男性先辈的原文表达，也符合庄重而易懂的圣经汉语语体。
- source_word: אֶרֶץ זָבַת חָלָב וּדְבָשׁ
  choice: 那流奶与蜜之地
  rationale: 保留这一固定的盟约性土地描写；“流奶与蜜”在汉语中凝练且可理解。
theological_decisions:
- issue: 四字神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文使用神的专名而非称号；“雅威”较直接地按学界通常重构的读音音译，不以“主”替代。
- issue: אֶרֶץ זָבַת חָלָב וּדְבָשׁ与前句的句法关系
  choice: 正文保留“在那流奶与蜜之地”与前文连接较松的压缩表达，并以脚注说明
  alternative: 译作“正如……应许你的一样：赐给你一片流奶与蜜之地”
  rationale: 希伯来语在“对你说”之后直接出现“流奶与蜜之地”，可以把该短语理解为百姓得福、增多的地点，也可理解为神所说或应许之内容的同位说明；不在正文中完全消除此张力。
translation_notes:
  register: 采用现代、庄重且便于朗读的标准普通话。“以色列啊”保留呼语；“谨慎遵行”“列祖”略带经文语体但仍为普通读者熟悉。正文尽量保留原文末尾短语连接关系的含混，不用标点或增补动词武断地固定其句法。
