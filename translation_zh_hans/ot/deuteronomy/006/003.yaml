revisions:
- from: 所以，以色列啊，你要听，也要谨慎遵行，使你得福，人数大大增多，正如雅威——你列祖的神——对你所说的，在那流奶与蜜之地。[a][b]
  to: 所以，以色列啊，你要听，也要谨慎遵行，好使你得益处，人数大大增多，正如雅威——你列祖的神——对你所说的：那流奶与蜜之地。[a][b]
