  text: כִּ֣י אֵ֥ל קַנָּ֛א יְהוָ֥ה אֱלֹהֶ֖י/ךָ בְּ/קִרְבֶּ֑/ךָ פֶּן יֶ֠חֱרֶה אַף יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ בָּ֔/ךְ וְ/הִשְׁמִ֣ידְ/ךָ֔ מֵ/עַ֖ל פְּנֵ֥י הָ/אֲדָמָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/015.yaml
  text: for Yahweh your God in your midst is a jealous God[b][a], lest the anger of Yahweh your God burn against you and he destroy you from the face of the earth.
translation:
  language: zh_hans
  text: 因为雅威——你的神——在你中间，是忌邪的神[a]；免得雅威你的神向你发怒，把你从地上除灭[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “忌邪”也可译作“嫉妒”或“热心”。这里强调雅威对他子民有专一的圣约要求，不容他们敬拜别神。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译为“从地面之上”，是表示被彻底除去的说法。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上一节的禁令，引出其理由；“因为”在现代汉语中自然、明确。
- source_word: אֵל קַנָּא
  choice: 忌邪的神
  rationale: 表达神对圣约关系的排他要求，以及他不容许百姓敬拜别神；“忌邪”保留传统圣经用语及其神学张力，又避免把它简单理解为人的嫉妒。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文四字神名作音译，保留其作为以色列之神圣约名字的性质，而不以称号替代。
- source_word: אֱלֹהֶיךָ
  choice: 你的神
  rationale: 准确体现第二人称阳性单数后缀；本节以单数“你”把以色列整体作为立约对象来称呼。
- source_word: בְּקִרְבֶּךָ
  choice: 在你中间
  rationale: 保留神临在于其百姓当中的空间与圣约含义，不译成偏向个人内在经验的“在你里面”。
- source_word: פֶּן
  choice: 免得
  rationale: 引出违反禁令可能招致的警告性后果；“免得”符合庄重的律法语境，并与上一节的禁令相连。
- source_word: יֶחֱרֶה אַף
  choice: 发怒
  rationale: 这是表示怒气燃起的希伯来语习语；现代汉语用“发怒”自然传达其强烈含义，避免生硬直译。
- source_word: בָּךְ
  choice: 向你
  rationale: 在发怒的语境中表示怒气所针对的对象；“向你发怒”是自然的现代汉语表达。
- source_word: וְהִשְׁמִידְךָ
  choice: 把你……消灭
  rationale: 使役形表达毁灭、除去；“消灭”保留原文严厉的审判力度。
- source_word: מֵעַל פְּנֵי הָאֲדָמָה
  choice: 从地面上
  rationale: 贴近原文“从土地的表面之上”，同时符合现代汉语习惯；脚注说明这一表达所含的完全除去之意。
theological_decisions:
- issue: 如何翻译神的קַנָּא
  choice: 忌邪的神
  alternative: 嫉妒的神；热心的神
  rationale: 原文强调雅威对圣约子民的专一要求，不容竞争性的敬拜。“忌邪”既保留这种排他性及神学张力，也不把它淡化为一般的“热心”，或误导为有罪的嫉妒。
- issue: 如何翻译神名יהוה
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用神的专名。采用“雅威”音译，保留其专名和圣约名称的性质，不以称号取代。
- issue: 第二人称单数的处理
  choice: 全节使用“你”
  alternative: 你们
  rationale: 希伯来文各后缀均为阳性单数，集体地称呼以色列。保留单数既忠于语法，也呈现立约群体被视为一个整体的表达方式。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留集体单数“你”、神名“雅威”和“忌邪”这一带有圣经语域的关键词；句式用分号连接理由与警告，使跨节承接关系清楚，同时避免过度解释。
