base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/021.yaml
  text: then you shall say to your son[a], ‘We were slaves to Pharaoh in Egypt[b], and Yahweh brought us out from Egypt with a strong hand.’
translation:
  language: zh_hans
  text: 你就要对你儿子说[a]：‘我们在埃及作过法老的奴隶，雅威以强有力的手[b]把我们从埃及带了出来。’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“你要对你儿子说”。原文的连接词可直译为“并且”；这里的“就”表明本句承接上一节所说的情境和次序。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“以大能的手”。这是希伯来语惯用表达，指雅威以强大的力量施行拯救。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתָּ
  choice: 你就要……说
  rationale: וְ 在此承接上一节所述情境，配合完成式的指令用法，表达随后的回应；“就要”既体现顺序，也保留命令意味。
- source_word: לְבִנְךָ
  choice: 对你儿子
  rationale: 原文为阳性单数“你的儿子”，因此不泛化为“孩子”。
- source_word: עֲבָדִים הָיִינוּ לְפַרְעֹה
  choice: 我们……作过法老的奴隶
  rationale: עֲבָדִים 在出埃及语境中指受奴役者；“作过法老的奴隶”自然表达 לְ 所标示的隶属和受辖制关系。
- source_word: וַיּוֹצִיאֵנוּ
  choice: 把我们……带了出来
  rationale: יצא 的使役式意为“使出去、带出来”；此译保留雅威亲自施行拯救的主动性。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译呈现四字神名，而不以“主”这一称号替代。
- source_word: בְּיָד חֲזָקָה
  choice: 用强有力的手
  rationale: 较直接地保留“手”和 חֲזָקָה“强壮、有力”的意象，同时在现代汉语中清楚表达强大的拯救行动。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；“雅威”按其通行学术拟音呈现专名，避免以称号替代，也不采用源于较晚元音组合的“耶和华”。
- issue: עֲבָדִים 所表达的受奴役程度
  choice: 奴隶
  alternative: 仆人
  rationale: 本节回顾以色列人在法老权下的强制性奴役；“奴隶”比“仆人”更准确地保留其历史处境和获救的分量。
- issue: בְּיָד חֲזָקָה 的拟人意象
  choice: 保留“手”的意象
  alternative: 凭大能
  rationale: 原文以“强有力的手”描写雅威施行拯救的能力；保留这一意象，不将其抽象化，也不把它理解为字面上的身体描述。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“作过……的奴隶”适合家庭讲述的口吻；“强有力的手”保留原文具体意象，同时让普通读者容易理解。所有脚注标记均置于所说明的词句之后。
