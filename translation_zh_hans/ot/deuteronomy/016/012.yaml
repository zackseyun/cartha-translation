base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/012.yaml
  text: Remember that you were a slave in Egypt[a], and keep and do these statutes.
translation:
  language: zh_hans
  text: 你要记住，你在埃及曾是奴隶[a]；你要谨守遵行这些律例。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“仆人”。希伯来语 עֶבֶד 可指仆人或奴隶；但这里说的是以色列人在埃及受奴役的处境，因此正文译作“奴隶”。
    reason: 词义存在可译选择，脚注保留较宽泛的替代译法，并说明上下文判断。
lexical_decisions:
- source_word: וְזָכַרְתָּ
  choice: 你要记住
  rationale: 在这一训诲语境中，带连接词的完成式具有命令意味；“你要记住”自然地传达了这一要求。
- source_word: כִּי
  choice: （不单独译出）
  rationale: 这里引出“记住”的内容；现代汉语可直接接宾语从句，无须另译为“因为”或“即”。
- source_word: עֶבֶד
  choice: 奴隶
  rationale: 该词可指仆人或奴隶，但本节追忆以色列人在埃及遭受强制奴役的处境，“奴隶”更准确。
- source_word: הָיִיתָ
  choice: 曾是
  rationale: 表达过去的身份状态；“曾是”在汉语中清楚而简洁。
- source_word: בְּמִצְרָיִם
  choice: 在埃及
  rationale: 忠实对应介词短语，原文没有“地”一词，无须扩译。
- source_word: וְשָׁמַרְתָּ
  choice: 谨守
  rationale: 在律法和圣约语境中，שׁמר表示留心遵守；“谨守”兼具慎重与遵守之意。
- source_word: וְעָשִׂיתָ
  choice: 遵行
  rationale: 与“谨守”并列，强调实际实行；“遵行”比直译“做”更符合现代汉语法律训诲语体。
- source_word: הַחֻקִּים
  choice: 律例
  rationale: 指规定下来的法令或条例；“律例”是准确、庄重且易懂的圣经法律用语。
- source_word: הָאֵלֶּה
  choice: 这些
  rationale: 直接对应指示词，并修饰“律例”。
theological_decisions:
- issue: 以色列在埃及的 עֶבֶד 身份如何表达
  choice: 奴隶
  alternative: 仆人
  rationale: 上下文所指是以色列在埃及受强制辖制的历史处境；“奴隶”保留这种受奴役的社会现实，而“仆人”可能弱化其强制性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“谨守遵行”保留原文两个并列动词的力度；分号呈现从记念历史到履行律例的推进关系。
