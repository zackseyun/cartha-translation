  text: וְ/לֹֽא יֵרָאֶ֨ה לְ/ךָ֥ שְׂאֹ֛ר בְּ/כָל גְּבֻלְ/ךָ֖ שִׁבְעַ֣ת יָמִ֑ים וְ/לֹא יָלִ֣ין מִן הַ/בָּשָׂ֗ר אֲשֶׁ֨ר תִּזְבַּ֥ח בָּ/עֶ֛רֶב בַּ/יּ֥וֹם הָ/רִאשׁ֖וֹן לַ/בֹּֽקֶר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/004.yaml
  text: No leaven is to be seen with you within all your territory for seven days[b][a], and none of the flesh that you sacrifice in the evening on the first day shall remain overnight until morning.
translation:
  language: zh_hans
  text: 七天之内，在你全境都不可见有酵之物；第一天[a]晚上所献祭的肉，一点也不可留到早晨。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “第一天”可能特指节期开始时所献的逾越节祭牲，但希伯来原文在这里没有明说“逾越节羊羔”。
    reason: alternative_reading
lexical_decisions:
- source_word: יֵרָאֶה
  choice: 不可见有
  rationale: 该词为ראה的尼法勒式，在此表达被动的禁令；“不可见有”既保留“被看见”的语义，也符合现代汉语法规语体。
- source_word: שְׂאֹר
  choice: 有酵之物
  rationale: 此词指使面团发酵的酵种或发酵物；“有酵之物”在逾越节律法语境中自然，也避免把含义限缩为现代商品酵母。
- source_word: בְּכָל גְּבֻלְךָ
  choice: 在你全境
  rationale: גְּבוּל在这里表示辖境而非单指边界；“全境”简洁传达地域范围。
- source_word: שִׁבְעַת יָמִים
  choice: 七天之内
  rationale: 自然表达禁令持续七天的时间范围。
- source_word: יָלִין
  choice: 留到早晨
  rationale: לין在此指过夜存留；结合לַבֹּקֶר译作“留到早晨”，清楚传达不得过夜的禁令。
- source_word: מִן הַבָּשָׂר
  choice: 肉，一点也不可
  rationale: בָּשָׂר字面为“肉身、肉”，献祭语境中指祭牲的肉；מִן所表达的部分否定用“一点也不可”自然呈现。
- source_word: אֲשֶׁר תִּזְבַּח
  choice: 所献祭的
  rationale: זבח在礼仪语境中指宰杀献祭；“献祭”比单纯“宰杀”更完整地保留宗教礼仪含义。
- source_word: בָּעֶרֶב
  choice: 晚上
  rationale: 直接而自然地表达该时间短语。
- source_word: בַּיּוֹם הָרִאשׁוֹן
  choice: 第一天
  rationale: 原文只说“第一天”，不在正文补入“节期”或“逾越节”，以免消除所指范围的歧义。
- source_word: לַבֹּקֶר
  choice: 到早晨
  rationale: 此处ל标示存留的时间界限，汉语用“到早晨”最自然。
theological_decisions:
- issue: “第一天”晚上所献祭之肉的具体所指
  choice: 正文笼统译作“所献祭的肉”，不明确指定为逾越节羊羔。
  alternative: 理解为节期开端所献的逾越节祭牲，或较广义地理解为相关节期祭肉。
  rationale: 希伯来文没有明确说“逾越节羊羔”，只说“第一天晚上所献祭的肉”；正文保留这种开放性，不替原文解决解释争议。
translation_notes:
  register: 采用现代、庄重而易懂的律法语体。“不可见有”保留原文被动表达；“有酵之物”兼顾礼仪术语与普通读者的可理解性。脚注标记置于相关整句之后。
