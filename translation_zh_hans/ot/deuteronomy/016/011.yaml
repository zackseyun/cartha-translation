  text: וְ/שָׂמַחְתָּ֞ לִ/פְנֵ֣י יְהוָ֣ה אֱלֹהֶ֗י/ךָ אַתָּ֨ה וּ/בִנְ/ךָ֣ וּ/בִתֶּ/ךָ֮ וְ/עַבְדְּ/ךָ֣ וַ/אֲמָתֶ/ךָ֒ וְ/הַ/לֵּוִי֙ אֲשֶׁ֣ר בִּ/שְׁעָרֶ֔י/ךָ וְ/הַ/גֵּ֛ר וְ/הַ/יָּת֥וֹם וְ/הָ/אַלְמָנָ֖ה אֲשֶׁ֣ר בְּ/קִרְבֶּ֑/ךָ בַּ/מָּק֗וֹם אֲשֶׁ֤ר יִבְחַר֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ לְ/שַׁכֵּ֥ן שְׁמ֖/וֹ שָֽׁם׀׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/011.yaml
  text: And you shall rejoice before Yahweh your God—you[a], your son, your daughter, your male slave, your female slave, the Levite who is within your gates, and the sojourner, the fatherless[c][b], and the widow who are among you—at the place that Yahweh your God will choose for his name to dwell there.
translation:
  language: zh_hans
  text: 你要在雅威你的神面前欢乐——你和你的儿子、女儿、男奴、女奴，以及你城中的利未人和你中间的寄居者[a]、孤儿[b]、寡妇，都要在雅威你的神所选择、使他的名住在那里的地方[c]欢乐。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “寄居者”指生活在以色列人中间的非以色列外来居民；或译“外来居民”。
    reason: lexical_alternative
  - marker: b
    text: 或译“没有父亲的孩子”。
    reason: lexical_alternative
  - marker: c
    text: “使他的名住在那里”直译原文的使役表达；也可译“让他的名住在那里”。
    reason: literal_rendering
lexical_decisions:
- source_word: וְשָׂמַחְתָּ
  choice: 你要……欢乐
  rationale: שׂמח表示欢喜、欢乐；“欢乐”既保留节期庆贺和敬拜的庄重语气，也适合现代汉语。句末补出一次“欢乐”，使较长的名单和地点成分在汉语中清楚连贯。
- source_word: לִפְנֵי
  choice: 在……面前
  rationale: 直译并自然表达在神临在中敬拜、庆贺的含义，不扩展为解释性表述。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以“雅威”音译四字神名，保留其作为以色列之神的专名，不以称号代替。
- source_word: וְעַבְדְּךָ וַאֲמָתֶךָ
  choice: 你的男奴、女奴
  rationale: 原文分别使用男性和女性的受役身份用语；“男奴、女奴”保留社会身份及性别对举，不以较含混的“仆人、婢女”弱化。
- source_word: בִּשְׁעָרֶיךָ
  choice: 你城中的
  rationale: 字面为“在你的城门内”，申命记的法律语境中指所属城镇或社区；译作“你城中的”比“你门内的”更符合现代汉语，同时保留地方共同体含义。
- source_word: וְהַגֵּר
  choice: 寄居者
  rationale: גֵּר指住在以色列社会中、并非本地宗族成员的外来居民；“寄居者”保留其经常性法律身份，避免泛化为临时旅客或陌生人。
- source_word: וְהַיָּתוֹם
  choice: 孤儿
  rationale: יָתוֹם可指失去父亲、缺乏父系保护的孩子；正文采用现代汉语通行的“孤儿”，脚注保留更具体的可能译法。
- source_word: לְשַׁכֵּן שְׁמוֹ שָׁם
  choice: 使他的名住在那里
  rationale: שׁכן的使役式表达“使……居住”；此译法保留原文使役意义及申命记关于神之名居住于所选之地的神学措辞。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；音译“雅威”保留专名性质，避免以“主”这一称号取代。
- issue: עבד／אמה 所指的家庭成员身份
  choice: 男奴／女奴
  alternative: 男仆／女仆；仆人／婢女
  rationale: 本节的家庭与社会法律语境使受奴役身份具有实际意义；正文不将其淡化为一般雇佣或服侍关系。
- issue: “使他的名住在那里”的圣所公式
  choice: 保留使役式：使他的名住在那里
  alternative: 让他的名住在那里；把他的名立在那里
  rationale: 原文为使役形式；该译法既不把“名”简单等同于神的全部临在，也不把它削弱为仅仅题名或标记，保留神超越性与盟约临在之间的张力。
- issue: 欢乐主体的范围
  choice: 将利未人、寄居者、孤儿和寡妇与户主一家并列纳入
  alternative: 把这些群体理解为旁观者或受赠者
  rationale: 原文由连词连续列举所有主体，语法上共同受“欢乐”支配；译文保留共同参与节庆的意义。
translation_notes:
  register: 采用现代、庄重而可朗读的标准普通话。长串并列成分用破折号和“以及”组织，并在句末复现“欢乐”，以避免汉语读者误把地点短语只与最后一个群体相连。保留“雅威”“寄居者”及“使他的名住在那里”等具有圣经语域的关键词，但用“你城中的”取代生硬的“你城门内的”。
