revisions:
- from: 不可和逾越节的祭牲同吃有酵的饼。七天之内，你要和祭牲同吃无酵饼，就是困苦之饼[a]，因为你匆忙离开了埃及地。这样，你一生的日子都可以记得自己离开埃及地的那一天。
  to: 不可配着逾越节的祭牲吃有酵的饼。七天之内，你要配着祭牲吃无酵饼，就是困苦之饼[a]，因为你匆忙离开了埃及地；为要使你一生都记念自己离开埃及地的那一天。
  rationale: 修订仅调整两个表达：以“配着”清楚表达祭牲与饼同席配食的关系；以“为要使你一生都记念”恢复原文目的从句的力度，避免“可以”造成许可或可能的理解。其余内容及脚注均可保留。
