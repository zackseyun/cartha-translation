    rationale: לְמַעַן 后接未完成式表目的，即“为要／使你记念”，并非仅表示容许或能力。
  - severity: low
    issue: “和……同吃”对配食关系略不够明确。
    rationale: 此处 עַל 在逾越节祭宴语境中意为“配着、伴随祭牲”；“配着……吃”可更自然地表达该关系。
