  text: לֹא תֹאכַ֤ל עָלָי/ו֙ חָמֵ֔ץ שִׁבְעַ֥ת יָמִ֛ים תֹּֽאכַל עָלָ֥י/ו מַצּ֖וֹת לֶ֣חֶם עֹ֑נִי כִּ֣י בְ/חִפָּז֗וֹן יָצָ֨אתָ֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם לְמַ֣עַן תִּזְכֹּר֔ אֶת י֤וֹם צֵֽאתְ/ךָ֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם כֹּ֖ל יְמֵ֥י חַיֶּֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/003.yaml
  text: You shall not eat leavened bread with it. Seven days you shall eat with it unleavened bread[a], the bread of affliction, because you came out from the land of Egypt in haste, so that you may remember the day of your coming out from the land of Egypt all the days of your life.
translation:
  language: zh_hans
  text: 不可配着逾越节的祭牲吃有酵的饼。七天之内，你要配着祭牲吃无酵饼，就是困苦之饼[a]，因为你匆忙离开了埃及地；为要使你一生都记念自己离开埃及地的那一天。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“贫穷之饼”或“苦难之饼”。希伯来语可强调与出埃及有关的艰难、匮乏或苦难。
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלָיו
  choice: 和逾越节的祭牲同吃／和祭牲同吃
  rationale: 介词短语在逾越节筵席的语境中表示伴随祭牲一起吃。中文需补明前一节所指的祭牲，避免“和它同吃”的指代生硬或不清。
- source_word: חָמֵץ
  choice: 有酵的饼
  rationale: 此处指筵席中不可食用的有酵食品；译作“有酵的饼”既符合上下文，也避免被理解为单指酵种。
- source_word: מַצּוֹת
  choice: 无酵饼
  rationale: 这是清楚、通行的现代中文对应词，准确表达节期所吃的未发酵饼。
- source_word: לֶחֶם עֹנִי
  choice: 困苦之饼
  rationale: עֹנִי 可涵盖受苦、贫乏和悲惨处境。“困苦”保留其较宽的语义，不把所指局限于经济贫穷。
- source_word: בְחִפָּזוֹן
  choice: 匆忙
  rationale: 表达离开埃及时行动急迫的状态，而不额外加入惊慌或逃亡等解释。
- source_word: לְמַעַן
  choice: 这样……可以
  rationale: 自然地保留目的意味，说明礼仪实践旨在使人持续记念出埃及。
- source_word: תִּזְכֹּר
  choice: 可以记得
  rationale: 与目的连词相配，表达“为要使你记得”，不将其改写成单纯预言或另加命令。
- source_word: יוֹם צֵאתְךָ
  choice: 自己离开埃及地的那一天
  rationale: 用自然中文表达希伯来文“你出来之日”的名词性结构，并保留第二人称的个人参与感。
- source_word: כֹּל יְמֵי חַיֶּיךָ
  choice: 一生的日子都
  rationale: 既保留“所有日子”的持续、遍及含义，也符合现代中文表达。
theological_decisions:
- issue: לֶחֶם עֹנִי 与出埃及纪念的含义
  choice: 困苦之饼
  alternative: 贫穷之饼；苦难之饼
  rationale: 该短语可能唤起奴役中的受苦、物质匮乏以及仓促离境的艰辛。“困苦”保留这些可能性，不把仪式意义缩减为单一层面。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“逾越节的祭牲”承接上一节的明确所指；其后简称“祭牲”，既保持连贯，也避免重复过重。句子按中文信息结构分开，以清楚呈现禁令、七日礼仪、历史原因和记念目的。
