  source_fidelity: 原文将“烹制”和“吃”都明确置于耶和华所选择的地方。草案的“你要煮熟了吃，要在……地方”在句法上使地点短语悬置，未能清楚修饰这两个动作。将בשׁל译为“烹制”可保留其不具体限定烹调方法的含义。
  naturalness: “煮熟了吃，要在……地方”不符合现代汉语的自然句法。改为“要在……地方烹制并吃”清楚、庄重，也保留律法语体。“转身，往你的帐棚去”比“转身回到……去”更贴近“转身并前往”的两个连续动作。
  terminology: “耶和华你上帝”符合既定神名处理；“帐棚”可保留原文的营帐意象及复数集合意义。
