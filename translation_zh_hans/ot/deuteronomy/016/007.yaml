  text: And you shall cook it and eat it in the place that the LORD your God will choose for it, and in the morning you shall turn and go to your tents.
translation:
  language: zh_hans
  text: 你要在耶和华你上帝所选择的地方烹制并吃；到了早晨，你就转身，往你的帐棚去。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבִשַּׁלְתָּ
  choice: 你要煮熟了
  rationale: בשׁל在此指把逾越节祭牲烹制成熟；“煮熟”自然明确，同时不把具体烹调方式限定为水煮。
- source_word: בַּמָּקוֹם אֲשֶׁר יִבְחַר יְהוָה אֱלֹהֶיךָ בּוֹ
  choice: 在耶和华你上帝所选择的地方
  rationale: בּוֹ在希伯来语中回指“地方”，具有地点关系；汉语无需生硬译作“为它”，这样更符合原文句法与自然表达。
- source_word: וּפָנִיתָ
  choice: 你就转身回到
  rationale: 保留“转身/离开”的动作意味，并与后面的הלך共同构成自然汉语。
- source_word: לְאֹהָלֶיךָ
  choice: 你的帐棚
  rationale: 直译复数集合表达；在汉语中“你的帐棚”可指各人住宿之处，也保留旷野传统用语。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 耶和华
  alternative: 雅威／上主
  rationale: 采用现代中文圣经读者熟悉的专名“耶和华”，并与“你上帝”区分；不借译名加入特定宗派解释。
- issue: בּוֹ的所指
  choice: 按地点关系处理，不另译“为它”
  alternative: “所为它选择的地方”
  rationale: 其最自然的先行词是מקום（地方），表示在该处；“为它”会在汉语中暗示上帝为逾越节祭牲选择地方，且表达不自然。
translation_notes:
  register: 采用庄重而清楚的现代标准普通话；保留律法命令语气。句末“回到你的帐棚去”将פנה与הלך合并为自然表达，同时保留“转身”的动作成分。
