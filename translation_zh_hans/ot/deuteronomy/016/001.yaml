source:
  edition: WLC
  text: שָׁמוֹר֙ אֶת חֹ֣דֶשׁ הָ/אָבִ֔יב וְ/עָשִׂ֣יתָ פֶּ֔סַח לַ/יהוָ֖ה אֱלֹהֶ֑י/ךָ כִּ֞י בְּ/חֹ֣דֶשׁ הָֽ/אָבִ֗יב הוֹצִ֨יאֲ/ךָ֜ יְהוָ֧ה אֱלֹהֶ֛י/ךָ מִ/מִּצְרַ֖יִם לָֽיְלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/001.yaml
  text: Observe the month of Abib[a], and keep the Passover to Yahweh your God, because in the month of Abib Yahweh your God brought you out from Egypt by night.
translation:
  language: zh_hans
  text: 你要谨守亚笔月[a]，向雅威你的上帝守逾越节，因为雅威你的上帝在亚笔月的夜间把你从埃及领了出来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “亚笔”与谷物初熟有关；也可译作“春季之月”。
    reason: 说明月份名称的词源意义，并保留其季节性译法。
lexical_decisions:
- source_word: שָׁמוֹר
  choice: 谨守
  rationale: 此处是命令式，要求以实际行动认真遵守节期历法，而不只是记住这个月份；“谨守”保留了命令的力度。
- source_word: חֹדֶשׁ הָאָבִיב
  choice: 亚笔月
  rationale: אָבִיב与谷物初熟、春季有关；在本节的节期律法语境中，它用作历法名称，因此保留音译，并以脚注说明其含义和另一种译法。
- source_word: וְעָשִׂיתָ פֶּסַח
  choice: 守逾越节
  rationale: 字面近于“行逾越节”，实际指履行逾越节的礼仪和规定；“守逾越节”是自然、准确的现代汉语表达。
- source_word: לַיהוָה
  choice: 向雅威
  rationale: 介词 ל 表明这个节期是朝向并归给雅威而守；“向”保留了这种敬拜和奉献的指向。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以中文音译呈现四字神名，而不以“主”这一称号代替；“雅威”较直接对应通常重构的读音 Yahweh。
- source_word: הוֹצִיאֲךָ
  choice: 把你……领了出来
  rationale: 这是 יצא 的使役形，指上帝使以色列人离开埃及；“领了出来”既符合出埃及语境，也自然易懂。
- source_word: לָיְלָה
  choice: 在……夜间
  rationale: 该词在这里说明领出埃及的时间；译作“夜间”保留其时间状语功能，不进一步限定为整夜或某一具体时刻。
theological_decisions:
- issue: 如何译出神名 יְהוָה
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。正文采用“雅威”以保留专名，并避免用称号“主”取代原文神名；“耶和华”是沿袭较早读音传统的常见中文形式。
- issue: 将 אָבִיב 理解为月份名称还是季节
  choice: 作为历法名称译为“亚笔月”
  alternative: 春季之月
  rationale: 本节是关于逾越节日期的律法，חֹדֶשׁ הָאָבִיב 在此具有具体的历法功能；正文保留月名，脚注同时保留其词义及季节性理解。
- issue: “夜间”与出埃及事件的关系
  choice: 按原文将“夜间”修饰“领出”
  alternative: 将其宽泛理解为逾越节在夜间举行
  rationale: 原文词序和句法最自然地把 לָיְלָה 与 הוֹצִיאֲךָ 相连，因此译为雅威在夜间领以色列人出埃及，不把它改作守节时间的规定。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“谨守”体现律法命令的力度；“守逾越节”沿用普通读者容易理解的宗教节期表达。句法尽量贴近希伯来文，同时避免生硬直译。
