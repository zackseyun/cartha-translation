  text: כִּ֠י אִֽם אֶל הַ/מָּק֞וֹם אֲשֶׁר יִבְחַ֨ר יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ לְ/שַׁכֵּ֣ן שְׁמ֔/וֹ שָׁ֛ם תִּזְבַּ֥ח אֶת הַ/פֶּ֖סַח בָּ/עָ֑רֶב כְּ/ב֣וֹא הַ/שֶּׁ֔מֶשׁ מוֹעֵ֖ד צֵֽאתְ/ךָ֥ מִ/מִּצְרָֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/006.yaml
  text: but only at the place that Yahweh your God will choose for his name to dwell—there you shall sacrifice the Passover in the evening[a], at sunset[c][b], at the appointed time of your departure from Egypt.
translation:
  language: zh_hans
  text: 只可在雅威你的上帝所选择、使他的名住在那里的地方[a]，在那里献逾越节的祭[b]；要在傍晚、日落时，在你出埃及时的时刻献上[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“把他的名安置在那里。”
    reason: 原文使役结构可按“使他的名居住”直译，也可按惯用意义译作“安置他的名”。
  - marker: b
    text: 或译：“宰杀逾越节祭牲。”
    reason: 原文动词既可指献祭，也可突出祭牲被宰杀的动作。
  - marker: c
    text: 直译：“你出埃及时的时刻。”
    reason: 原文此处将“时刻”与“你出埃及”相连；“约定的时刻”是可能的替代译法，但正文避免将其解释得过于具体。
lexical_decisions:
- source_word: כִּי אִם
  choice: 只可
  rationale: 承接上一节的禁令，表达强烈的排他和限制语气；简洁自然。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译保留四字神名，避免用称号代替原文中的专名。
- source_word: לְשַׁכֵּן שְׁמוֹ שָׁם
  choice: 使他的名住在那里
  rationale: 保留使役形式和申命记特有的“名居住”意象，不把它解释成上帝本体受空间限制。
- source_word: תִּזְבַּח אֶת הַפֶּסַח
  choice: 献逾越节的祭
  rationale: זבח兼有宰杀和献祭之意；在明确的礼仪语境中译为“献……的祭”，既自然，也显明所指是逾越节祭物。
- source_word: בָּעָרֶב כְּבוֹא הַשֶּׁמֶשׁ
  choice: 在傍晚日落时
  rationale: 将两个紧密相连的时间表达合并成自然汉语，同时保留“傍晚”和“日落”两项信息。
- source_word: מוֹעֵד צֵאתְךָ מִמִּצְרָיִם
  choice: 你出埃及的指定时刻
  rationale: מוֹעֵד表示指定或约定的时刻；译文保留其规定性，也紧贴“出埃及”这一历史事件。
theological_decisions:
- issue: 上帝之名在所选之地居住的表述
  choice: 使他的名住在那里
  alternative: 把他的名立在那里
  rationale: 原文使役形式可理解为“使……居住”，也可按惯用表达理解为“安置”。正文保留“名居住”的神学意象，脚注列出另一种可能，不把它扩展解释为上帝本体被局限在圣所。
- issue: 逾越节作为节期还是祭物
  choice: 逾越节的祭
  alternative: 逾越节；宰杀逾越节祭牲
  rationale: הַפֶּסַח可指节期或祭物，但在זבח作动词并以其为宾语的语境中，祭物含义突出；译文不擅自限定为“羊羔”。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“只可”体现律法语境中的排他命令；“雅威你的上帝”保留希伯来语专名及第二人称单数关系表达。分号用于减轻希伯来语长句在汉语中的负担。
