base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/005.yaml
  text: You may not sacrifice the Passover in any one of your gates that Yahweh your God is giving you[b][a],
translation:
  language: zh_hans
  text: 你不可在耶和华你上帝赐给你的任何一座城中[b]献逾越节的祭物[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“献逾越节祭。”
    reason: lexical_alternative
  - marker: b
    text: 原文直译“在你的任何一个城门中”；“城门”在这里转指城镇或聚居地。
    reason: cultural_note
lexical_decisions:
- source_word: לֹא תוּכַל
  choice: 你不可
  rationale: יכל 加不定式在这里具有律法禁令的作用，并非单指能力不足；“不可”自然、庄重地传达这一语气，也保留第二人称单数 خطاب。
- source_word: לִזְבֹּחַ
  choice: 献……祭物
  rationale: זבח 在祭祀语境中指宰杀并献上祭牲；结合宾语 הַפָּסַח，译作“献……祭物”比单说“宰杀”更明确地表达礼仪含义。
- source_word: הַפָּסַח
  choice: 逾越节的祭物
  rationale: פֶּסַח 可指逾越节、逾越节祭牲或祭物。此处受 זבח 支配，所指显然具有献祭性质；译文明确为“逾越节的祭物”，同时脚注保留较简洁的表达。
- source_word: בְּאַחַד שְׁעָרֶיךָ
  choice: 在……任何一座城中
  rationale: שַׁעַר 字面为“城门”，但在申命记中常以转喻指城镇或聚居地。现代汉语若直译“在任何一个城门里”容易误解为城门建筑内部，因此正文表达其语境所指，并以脚注说明原文意象。
- source_word: אֲשֶׁר יְהוָה אֱלֹהֶיךָ נֹתֵן לָךְ
  choice: 耶和华你上帝赐给你的
  rationale: נֹתֵן 是分词，表达正在赐予或一贯赐予；汉语“赐给你的”在定语结构中自然，并保留土地作为上帝恩赐的含义。יהוה 采用现代中文圣经语域中通行且具有专名功能的“耶和华”。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。中文正文采用广为读者识别的专名“耶和华”，不以“主”替代，从而保留其作为盟约之神专名的功能；“雅威”是较接近学术重建发音的另一译法。
- issue: הַפָּסַח 所指范围
  choice: 逾越节的祭物
  alternative: 逾越节
  rationale: 该词本身可指节期、祭牲或祭物；因本节与“献祭”动词连用，正文显明其祭物含义，但不进一步限定为“羊羔”，以免排除原文未明说的祭牲范围。
translation_notes:
  register: 采用现代、庄重而易懂的律法文体。“你不可”保留对以色列整体的第二人称单数称呼；“任何一座城中”自然传达全面禁止的范围。脚注标记均置于相关短语之后。
