base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/010.yaml
  text: Then you shall celebrate the Feast of Weeks to Yahweh your God with a tribute of a freewill offering from your hand[a], which you shall give according to how Yahweh your God blesses you.
translation:
  language: zh_hans
  text: 那时，你要向雅威你的上帝守七七节，献上你亲手甘心奉献的礼物[a]，分量要照雅威你的上帝赐福给你的程度。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“按你亲手所献的甘心礼物的分量”。原文将“分量”与“甘心礼物”相连；礼物的多少应与雅威所赐给你的福相称。
    reason: 保留מִסַּת נִדְבַת יָדְךָ的较贴近原文结构的译法，并说明其与后文比例限定的关系。
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: 那时，你要……守
  rationale: עשה与“节期”连用时表示守节、庆祝，而不是字面意义的“制作”；“那时”承接上文的时间与次序。
- source_word: חַג שָׁבֻעוֹת
  choice: 七七节
  rationale: 这是该节期在现代中文圣经语境中通行且简洁的名称，也反映希伯来文“周”的复数概念。
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: 向雅威你的上帝
  rationale: 介词ל表达节期归向、献给雅威；直译神名，并保留“你的上帝”这一盟约性称谓。
- source_word: מִסַּת נִדְבַת יָדְךָ
  choice: 亲手献上自愿的礼物
  rationale: נִדְבָה表示出于自愿的奉献，יָדְךָ保留个人亲自献出的意味；罕见词מִסַּת所含的分量或相称之意，通过后句“相应地奉献”表达，同时以脚注保留结构上的另一种理解。
- source_word: אֲשֶׁר תִּתֵּן
  choice: 献上
  rationale: 将关系从句自然融入中文主句，保留“给予、奉献”的命令语气。
- source_word: כַּאֲשֶׁר יְבָרֶכְךָ
  choice: 怎样赐福给你，你就要相应地奉献
  rationale: כַּאֲשֶׁר在此表达奉献应与所得赐福相称；此译法在自然中文中清楚呈现比例关系。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；“雅威”较直接地呈现其专名性质，不以称号替代。
- issue: 奉献的自愿性与律法命令之间的张力
  choice: 既保留“你要”也保留“自愿的礼物”
  alternative: 把整项奉献译成可献可不献
  rationale: 经文命令百姓守节并奉献，同时称礼物为נִדְבָה，强调具体分量出于自愿并与所得赐福相称；译文不消解这两方面的张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“守七七节”为熟悉的经文表达；后半句拆分重组，以自然中文明确呈现奉献与赐福相称的关系。
