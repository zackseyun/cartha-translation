  to: 那时，你要向雅威你的上帝守七七节，献上你亲手甘心奉献的礼物[a]，分量要照雅威你的上帝赐福给你的程度。
  rationale: 修订明确呈现“甘心礼物”的分量，并将“照雅威……赐福给你的程度”直接作为该分量的准则。这样保留了原文的命令语气、礼物的自愿性质，以及按神所赐福分而献的比例关系，且避免中文表达重复。
