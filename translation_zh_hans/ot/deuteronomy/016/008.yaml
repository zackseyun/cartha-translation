base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/008.yaml
  text: For six days you shall eat unleavened bread[a], and on the seventh day there shall be a solemn assembly to Yahweh your God; you shall do no work.
translation:
  language: zh_hans
  text: 六天要吃无酵饼；第七天要为雅威——你的上帝——举行庄严集会[a]，不可做工。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“圣会”，也可能含“节期结束时的集会”之意。原文所用的词指正式的节期聚集，可能带有结束性集会的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׁשֶׁת יָמִים
  choice: 六天
  rationale: 该结构表示持续的时段；中文用“六天”即可自然表达，无须另加“在……期间”。
- source_word: תֹּאכַל
  choice: 要吃
  rationale: 未完成式在律法语境中具有指令作用；“要吃”既保留规定语气，也符合现代汉语。
- source_word: מַצּוֹת
  choice: 无酵饼
  rationale: 在逾越节语境中指未发酵的饼；“无酵饼”是清楚且通行的中文表达。
- source_word: וּבַיּוֹם הַשְּׁבִיעִי
  choice: 第七天
  rationale: 连接词为普通的 waw；分号已自然承接前句，不必强化为转折。
- source_word: עֲצֶרֶת
  choice: 庄严集会
  rationale: 该词指节期中的正式聚集，可能也含节期结束时举行闭会聚集的意味；正文采用不把这一附带含义定死的表达。
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: 为雅威你的上帝
  rationale: 介词 ל 可表示归属、奉献或目的；“为”在中文中自然表达这场集会是归给雅威的。神名 יהוה 以“雅威”音译，区别于称号“主”。
- source_word: לֹא תַעֲשֶׂה מְלָאכָה
  choice: 不可做工
  rationale: 简洁保留律法禁令的力度；מְלָאכָה 在此泛指劳作。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较贴近通常重构的读音，并将专名与“主”这一称号区分开来。
- issue: לַיהוָה 所表达的关系
  choice: 为雅威
  alternative: 向雅威
  rationale: 介词 ל 可表达归属、目的或指向；“为雅威”较自然地传达集会归给上帝的意思，同时不将其限定为单纯朝向上帝的行动。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。“要吃”与“不可做工”保持律法条文的明确语气；将脚注标记置于其实际说明的“庄严集会”之后。
