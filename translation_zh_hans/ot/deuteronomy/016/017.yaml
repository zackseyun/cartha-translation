  text: אִ֖ישׁ כְּ/מַתְּנַ֣ת יָד֑/וֹ כְּ/בִרְכַּ֛ת יְהוָ֥ה אֱלֹהֶ֖י/ךָ אֲשֶׁ֥ר נָֽתַן לָֽ/ךְ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/017.yaml
  text: Each man shall give according to the gift of his hand[a], according to the blessing of Yahweh your God that he has given you.
translation:
  language: zh_hans
  text: 各人要按自己手中可献的礼物[a]，照着耶和华你神所赐给你的福分献上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“他手的礼物”；这是指各人手中所有、能够献上的礼物。
    reason: 保留希伯来语习语的字面意象及其含义。
lexical_decisions:
- source_word: אִישׁ
  choice: 各人
  rationale: 此处单数名词具有逐一分配的意义；“各人”在现代汉语中自然，也不抹去原文所强调的个人责任。
- source_word: כְּמַתְּנַת יָדוֹ
  choice: 按自己所能献的
  rationale: 字面为“按他手的礼物”。“手”在此指一个人手中所有、能够拿出来献上的；正文采用自然汉语表达其习语含义，并以脚注保留原文意象。
- source_word: כְּבִרְכַּת
  choice: 照着……福分
  rationale: 前缀 כ 表示尺度或比例，即所献的应与所得的福分相称；“照着”既保留这一关系，又符合现代汉语表达。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以中文读者熟悉的专名形式音译四字神名，而不以“主”这一称号替代。
- source_word: אֱלֹהֶיךָ
  choice: 你神
  rationale: 保留申命记中常见而紧凑的盟约称谓；与“耶和华”连用时，“耶和华你神”庄重且清楚。
- source_word: אֲשֶׁר נָתַן לָךְ
  choice: 所赐给你的
  rationale: 关系从句修饰“福分”；“赐给”恰当地表达神作为施予者，并不额外限定福分的种类。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 两者都作为专名处理而非译作称号“主”。正文采用现代中文圣经语境中辨识度更高的“耶和华”；“雅威”则更接近当代学界常见的拟音。
- issue: 所献之物与神所赐福分的关系
  choice: 保留“按……照着……”的比例关系
  alternative: 解释为固定数额或特定比例
  rationale: 原文只要求个人所献的与其所得福分相称，并未规定固定金额或百分比，因此不作进一步制度化解释。
- issue: 补出“献上”
  choice: 在句末补出“献上”
  alternative: 仅保留名词短语，不补动词
  rationale: 希伯来文承接上文，省略了动作；汉语独立成节需要补出语境中明确的献礼动作，但不增添献物种类或数量。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“所能献的”解释希伯来语的“手”之习语，同时用脚注保存字面表达；句末补出上文语境隐含的“献上”，使本节可独立朗读。
