base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/002.yaml
  text: And you shall sacrifice the Passover to Yahweh your God[a], from the flock and the herd, at the place that Yahweh will choose to make his name dwell there.
translation:
  language: zh_hans
  text: 你要从羊群和牛群中，向耶和华你的神献逾越节的祭物[a]；要在耶和华将选择、使他的名住在那里的地方献上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里“逾越节的祭物”与“从羊群和牛群中”相连。有人认为，这不但包括逾越节祭牲本身，也包括与逾越节和除酵节相关的节期祭物。
    reason: 说明“逾越节”在本节中可能具有较宽范围，同时保留原文措辞及其解释空间。
lexical_decisions:
- source_word: וְזָבַחְתָּ
  choice: 你要……献……祭物
  rationale: זבח指礼仪性的宰杀献祭，而非一般宰杀；用“献……祭物”既体现祭祀含义，也保留律法指令的语气。
- source_word: פֶּסַח
  choice: 逾越节的祭物
  rationale: פֶּסַח可指逾越节、其礼仪或祭牲。因它在此作“献祭”的宾语，译为“逾越节的祭物”在现代汉语中较清楚，同时不限定它只指某一种祭牲。
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: 向耶和华你的神
  rationale: 介词ל表示祭物奉献的对象或归属；“向……献”符合自然汉语。יהוה按所给神学决策音译为“耶和华”。
- source_word: צֹאן וּבָקָר
  choice: 从羊群和牛群中
  rationale: 两个集合名词分别指小型牲畜群与牛群；“从……中”自然表达祭牲取自这些牲畜类别，并保留原文比单指羊羔或山羊羔更宽的范围。
- source_word: בַּמָּקוֹם אֲשֶׁר יִבְחַר יְהוָה
  choice: 在耶和华所选择……的地方
  rationale: 忠实表达蒙神拣选的指定敬拜地点；“所选择”适合庄重的现代汉语，且不必在汉语中明标相对于摩西讲话时的将来时态。
- source_word: לְשַׁכֵּן שְׁמוֹ שָׁם
  choice: 使他的名居住
  rationale: 保留שׁכן使役式的因果意义和“他的名”这一盟约性神学意象，不将其弱化为仅仅“设立名号”或直接释为“临在”。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。依所提供的项目决策采用“耶和华”，不以“主”替代，从而在正文中保留专名性质。
- issue: “逾越节的祭物”与“羊群和牛群”的范围
  choice: 保留原文较宽的牲畜范围，并加注说明
  alternative: 在正文中解释为“逾越节祭牲和节期祭物”
  rationale: 原文把פֶּסַח与צֹאן וּבָקָר直接相连，其范围与通常所说的羊羔或山羊羔之间存在解释张力。正文不主动协调，脚注列出可能包括相关节期祭物的理解。
- issue: “使他的名居住”的神学意象
  choice: 直译为“使他的名居住”
  alternative: 译为“立他名的地方”或“使他临在的地方”
  rationale: 保留原文关于神之名的表达及其含蓄性，避免把“名”直接等同于临在、所有权或圣所。
translation_notes:
  register: 采用现代、庄重而易懂的律法文体。用“你要”传达指令语气；为避免汉语句子结构含混，在分号后补出“献上”，这是由前句动词自然承接的省略复现。正文保留“使他的名居住”这一不寻常但重要的原文意象。
