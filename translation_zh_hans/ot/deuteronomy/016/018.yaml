  text: שֹׁפְטִ֣ים וְ/שֹֽׁטְרִ֗ים תִּֽתֶּן לְ/ךָ֙ בְּ/כָל שְׁעָרֶ֔י/ךָ אֲשֶׁ֨ר יְהוָ֧ה אֱלֹהֶ֛י/ךָ נֹתֵ֥ן לְ/ךָ֖ לִ/שְׁבָטֶ֑י/ךָ וְ/שָׁפְט֥וּ אֶת הָ/עָ֖ם מִשְׁפַּט צֶֽדֶק־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/018.yaml
  text: You shall appoint judges and officers for yourself in all your gates that Yahweh your God is giving you[a], according to your tribes[b], and they shall judge the people with righteous judgment.
translation:
  language: zh_hans
  text: 你要在雅威你的上帝所赐给你的各城门口[a]，按你各支派设立审判官和官员；他们要以公正的判决[b]审判百姓。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“在你所有的城镇中”。原文直译为“在你所有的城门中”；古代城门区域是处理公共事务和司法案件的场所。
    reason: cultural_note
  - marker: b
    text: 或译“以公义的判决”。
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁפְטִים
  choice: 审判官
  rationale: 该词指负责作出司法裁决的人；“审判官”准确体现其职能，也适合本节的法律行政语境。
- source_word: שֹׁטְרִים
  choice: 官员
  rationale: 该词指参与治理和司法行政的公职人员，具体职责并不完全明确；“官员”保留这种宽泛的制度含义，不将其过度具体化为书记或执法人员。
- source_word: תִּתֶּן
  choice: 设立
  rationale: 该动词字面义为“放置、给予”，此处指使人担任公职；“设立”既贴近原文意象，也符合现代汉语表达。
- source_word: בְּכָל שְׁעָרֶיךָ
  choice: 在……各城门口
  rationale: 原文直译为“在你所有的城门内/口”。古代城门区域兼具公共议事和司法功能，因此正文保留“城门”意象，并以脚注说明也可按转喻理解为各城镇。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以“雅威”音译四字神名，表明原文使用的是上帝的专名，而非“主”这一称号。
- source_word: לִשְׁבָטֶיךָ
  choice: 按着你的各支派
  rationale: 该短语可表达按支派进行分布或组织；“按着你的各支派”保留其组织结构方面的含义，不限定为仅仅“为了各支派”。
- source_word: וְשָׁפְטוּ אֶת־הָעָם
  choice: 他们要……审判百姓
  rationale: 动词在此具有明确的司法意义；译文保留“审判”，与前文“审判官”形成原文同词根的呼应。
- source_word: מִשְׁפַּט צֶדֶק
  choice: 以公正的判决
  rationale: 这一结构把司法裁决与正直、公义结合起来；“公正的判决”在现代汉语中自然，并同时保留法律和伦理层面。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。正文采用与常见学术重构 Yahweh 相应的“雅威”，以保留专名性质；不以“主”这一称号替代，也不采用源自较晚混合读音传统的“耶和华”。
- issue: צֶדֶק 在司法语境中的含义
  choice: 公正
  alternative: 公义
  rationale: 此处修饰“判决”，重点是裁决合乎正直与公平。“公正”最符合现代汉语司法表达，同时不否定该词所含的道德正义维度。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“审判官和官员”保持法律行政语域；“城门口”保留原文文化意象，并用脚注解释其转喻含义。句中保留“按着你的各支派”的修饰关系，以避免把 לִשְׁבָטֶיךָ 的组织或分配含义过度限定。
