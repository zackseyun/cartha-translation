base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/014.yaml
  text: And you shall rejoice in your festival—you and your son and your daughter[a], and your male slave and your female slave, and the Levite, and the sojourner, and the fatherless, and the widow[d][c][b], who are within your gates.
translation:
  language: zh_hans
  text: 你要在你的节期里欢庆[a]：你、你的儿子和女儿、你的男奴和女奴，以及你城中[d]的利未人、寄居者[b]、孤儿[c]和寡妇，都要欢庆。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “节期”也可译作“节庆”。希伯来语 חַג 可指节期本身，也可指节期中的庆祝活动。
    reason: lexical_alternative
  - marker: b
    text: “寄居者”指住在以色列人中间的非本地居民；也可译作“外来居民”。
    reason: lexical_alternative
  - marker: c
    text: 希伯来语此词常译作“孤儿”，也可指“失去父亲的人”；在律法语境中尤其着重失去父亲保护所造成的弱势处境。
    reason: lexical_alternative
  - marker: d
    text: “你城中”直译为“在你的城门以内”，是指住在你所属的城镇或社群范围内。
    reason: cultural_note
lexical_decisions:
- source_word: וְשָׂמַחְתָּ
  choice: 你要……欢乐
  rationale: 该动词形式在律法训令中具有命令意味；“要……欢乐”既保留命令语气，也符合现代汉语表达。句末重述“都要欢乐”，使希伯来语列举结构在汉语中清楚自然。
- source_word: בְּחַגֶּךָ
  choice: 在你的节期中
  rationale: חַג指宗教性的节期及其庆祝活动；“节期”比“筵席”更准确地涵盖此处的朝圣节庆语境，而“中”表达参与和身处庆典之中。
- source_word: וְעַבְדְּךָ וַאֲמָתֶךָ
  choice: 你的男奴和女奴
  rationale: עֶבֶד与אָמָה在此家庭及社会身份清单中指处于奴属地位的男性和女性。“男奴、女奴”不将其弱化为一般的雇工或仆役，并保留原文的性别对应。
- source_word: וְהַלֵּוִי
  choice: 利未人
  rationale: 采用该支派及宗教社会身份的标准中文名称。
- source_word: וְהַגֵּר
  choice: 寄居者
  rationale: גֵּר指居住在以色列人中间、并非本地族群成员的外来居民；“寄居者”保留其长期居留而又非本地人的法律社会身份，避免套用现代移民术语。
- source_word: וְהַיָּתוֹם
  choice: 失去父亲的人
  rationale: יָתוֹם可泛译为“孤儿”，但在律法的社会语境中尤其突出失去父亲所带来的保护与供养缺失；此译法保留这一侧重。
- source_word: וְהָאַלְמָנָה
  choice: 寡妇
  rationale: 准确表达该词所指的丧偶女性及其在经文中的弱势社会身份。
- source_word: אֲשֶׁר בִּשְׁעָרֶיךָ
  choice: 你城中
  rationale: “在你的城门以内”是希伯来语表示住在所属城镇或社群范围内的惯用说法；正文采用自然现代汉语“你城中”，脚注保留字面意象。
theological_decisions:
- issue: 如何翻译 עֶבֶד / אָמָה 所表达的从属身份
  choice: 男奴／女奴
  alternative: 男仆／女仆；男佣人／女佣人
  rationale: 本节列出家庭成员及社会弱势者；原词在此不只是泛指提供服务的人，也包含受奴属约束的身份。译作“奴”避免淡化经文本身的社会现实，同时不对该制度作经文以外的评价。
- issue: 如何表达 גֵּר 的群体身份
  choice: 寄居者
  alternative: 外来居民；侨居者；外族人
  rationale: “寄居者”既显示其并非本地族群成员，也显示其居住在以色列社群之中；这样可保留原文的法律与社会含义，而不等同于短暂停留的旅客或一般外国人。
- issue: 如何表达 יָתוֹם 的脆弱处境
  choice: 失去父亲的人
  alternative: 孤儿
  rationale: “孤儿”在现代汉语中常被理解为父母双亡，而原词在律法语境中可着重指失去父亲及其保护的人。正文采用较明确的表达，并在脚注注明常见译法。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。以“要”呈现律法训令的语气；用分号和句末重述“都要欢乐”承接希伯来语的长列举，避免生硬直译。保留“你的节期”中的第二人称单数语气，并用“男奴、女奴”如实表达社会身份。
