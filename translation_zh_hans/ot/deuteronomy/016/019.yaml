  text: לֹא תַטֶּ֣ה מִשְׁפָּ֔ט לֹ֥א תַכִּ֖יר פָּנִ֑ים וְ/לֹא תִקַּ֣ח שֹׁ֔חַד כִּ֣י הַ/שֹּׁ֗חַד יְעַוֵּר֙ עֵינֵ֣י חֲכָמִ֔ים וִֽ/יסַלֵּ֖ף דִּבְרֵ֥י צַדִּיקִֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/019.yaml
  text: You shall not pervert justice[a]; you shall not show partiality; and you shall not take a bribe[b], for the bribe blinds the eyes of the wise and twists the words of the righteous.
translation:
  language: zh_hans
  text: 你不可歪曲公正；不可偏袒人[a]；也不可收受贿赂，因为贿赂会蒙蔽智者的眼睛，歪曲义人的话[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“认脸”，是指看人的情面、身份或地位而偏袒。
    reason: lexical_alternative
  - marker: b
    text: 或译：“歪曲义人的言辞（或案件）。”希伯来文既可指他们所说的话，在司法语境中也可指他们的申诉或案情。
    reason: alternative_reading
lexical_decisions:
- source_word: תַטֶּה מִשְׁפָּט
  choice: 歪曲公正
  rationale: 使役式动词 נטה 与 מִשְׁפָּט 连用，指在司法裁断中使公正偏离正轨。“歪曲公正”既保留法律语境，也符合现代汉语表达。
- source_word: תַכִּיר פָּנִים
  choice: 徇情偏袒
  rationale: 原文直译为“认脸”，是按人的身份、关系或情面偏待人的司法习语。“徇情偏袒”自然传达其实际含义。
- source_word: שֹׁחַד
  choice: 贿赂
  rationale: 在本节司法语境中，该词指用来影响裁断的利益或馈赠；“贿赂”准确表达其腐败性质。
- source_word: יְעַוֵּר עֵינֵי חֲכָמִים
  choice: 蒙蔽智慧人的眼睛
  rationale: 保留原文“使眼睛失明”的鲜明比喻；“蒙蔽”在汉语中也自然表示判断力受到遮蔽。
- source_word: חֲכָמִים
  choice: 智慧人
  rationale: 该阳性复数泛指有智慧的人，并不必然限定为男性；“智慧人”兼顾圣经语体与现代可懂度。
- source_word: וִיסַלֵּף דִּבְרֵי צַדִּיקִם
  choice: 歪曲义人的话
  rationale: סלף 表示扭曲、歪曲；דִּבְרֵי 的基本义是“话、言辞”，在司法语境中也可能指陈词或案件。正文保留较宽的“话”，并以脚注说明法律语境下的另一种理解。
- source_word: צַדִּיקִם
  choice: 义人
  rationale: 此处可指正直的人，也可指在案件中有理的一方。“义人”保留了原词的道德与法律双重色彩，避免缩窄为“无辜者”。
theological_decisions: []
