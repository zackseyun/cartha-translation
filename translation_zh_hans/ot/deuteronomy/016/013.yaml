base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/013.yaml
  text: You shall keep the Feast of Booths for seven days[a], when you gather in from your threshing floor and from your winepress.
translation:
  language: zh_hans
  text: 你要守住棚节七天；当你从禾场和酒榨收聚出产的时候。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חַג הַסֻּכֹּת
  choice: 住棚节
  rationale: חַג指节期，סֻכּוֹת是“棚子、临时住所”的复数。“住棚节”是现代中文中清楚而通行的节期名称，也保留了住在临时棚屋中的具体意象。
- source_word: תַּעֲשֶׂה לְךָ
  choice: 你要守
  rationale: עׂשה字面为“做、举行”，与节期连用时表示守节或庆祝；“你要守”自然传达律法语境中的义务。לְךָ所表达的个人责任已由“你要”体现。
- source_word: שִׁבְעַת יָמִים
  choice: 七天
  rationale: 直接保留原文所说的节期时长；中文无需另加介词也能自然表达持续时间。
- source_word: בְּאָסְפְּךָ
  choice: 正是在你……收聚……的时候
  rationale: 介词ב与不定式结构在此具有时间意义。“……的时候”保留与收获时节同步的含义，不把它进一步限定为“收完以后”；“正是”使句子衔接自然。
- source_word: מִגָּרְנְךָ
  choice: 从禾场
  rationale: גֹּרֶן具体指打谷、扬谷的场地。“禾场”保留原文的农业图景，并可借场所转指出产。
- source_word: וּמִיִּקְבֶךָ
  choice: 和酒榨
  rationale: יֶקֶב指压榨葡萄的设施或与之相连的酒池。“酒榨”简明地保留具体图景，并与“禾场”形成对应。
- source_word: '[implied object of אָסַף]'
  choice: 出产
  rationale: 原文没有明说收聚的宾语，但“从禾场和酒榨”表明所指是两处所得的农产。“出产”在中文中补足动词所需宾语，而不把范围缩窄为谷物或酒。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的律法体。“住棚节”沿用通行名称；“禾场”和“酒榨”保留原文具体的收获场景。句式避免把时间关系解释为收聚完成之后。
