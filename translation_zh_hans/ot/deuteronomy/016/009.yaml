  yaml_path: translation/ot/deuteronomy/016/009.yaml
  text: You shall count seven weeks for yourself; from the time the sickle begins to be put to the standing grain[a], you shall begin to count seven weeks.
translation:
  language: zh_hans
  text: 你要数算七周。从你开始用镰刀收割庄稼时起，你要开始数算七周。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שִׁבְעָה שָׁבֻעֹת
  choice: 七个七日
  rationale: שָׁבוּעַ 本义是由七日构成的周期，在此节期历法语境中即“七日一周期”。译作“七个七日”既保留希伯来语反复强调“七”的表达，也能让现代读者理解为七周；以脚注说明通常说法。
- source_word: תִּסְפָּר לָךְ
  choice: 你要为自己数算
  rationale: Qal 未完成式在律法语境中表达吩咐；לָךְ 明示与受命者有关，故保留为“为自己”。“数算”符合庄重而清楚的现代中文。
- source_word: מֵהָחֵל
  choice: 从……开始……时起
  rationale: 介词 מִן 与表示“开始”的不定词组合，标明计数的起点；此译法自然表达其时间意义。
- source_word: חֶרְמֵשׁ בַּקָּמָה
  choice: 镰刀开始割禾稼
  rationale: 字面结构是“镰刀开始在/向站立的庄稼”，实际指收割开始。中文用“镰刀开始割禾稼”自然传达这一农耕动作，并保留镰刀与未收庄稼的意象。
- source_word: תָּחֵל לִסְפֹּר
  choice: 你要开始数算
  rationale: Hiphil 形式后接“数算”的不定词，明确表示动作的开始；直译为“开始数算”准确自然。
- source_word: שִׁבְעָה שָׁבֻעוֹת
  choice: 七个七日
  rationale: 与本节开头保持一致，保留原文重复及“七”的结构。
