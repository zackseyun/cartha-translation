  text: וְ/לֹֽא תָקִ֥ים לְ/ךָ֖ מַצֵּבָ֑ה אֲשֶׁ֥ר שָׂנֵ֖א יְהוָ֥ה אֱלֹהֶֽי/ךָ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/022.yaml
  text: And you shall not set up for yourself a pillar[a], which Yahweh your God hates.
translation:
  language: zh_hans
  text: 不可为自己立石柱[a]，就是耶和华你神所恨恶的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“竖立的石头”或“立石”。此希伯来词指竖立的石质物件；在这里的语境中与敬拜有关。
    reason: 说明מַצֵּבָה的基本词义及其在本节的敬拜语境，同时不把“宗教用途”作为正文中未明说的词汇限定。
lexical_decisions:
- source_word: תָקִים
  choice: 立
  rationale: 使役式在这里表示使物体竖立；“立”自然简洁，也符合柱石的语境。
- source_word: לְךָ
  choice: 为自己
  rationale: 保留介词与第二人称后缀所表达的亲身参与或为己而设之意。
- source_word: מַצֵּבָה
  choice: 柱石
  rationale: 指竖立起来的石头或石柱，常用于敬拜；正文用“柱石”避免把语境中的宗教用途直接写入词义，同时通过脚注说明。
- source_word: אֲשֶׁר
  choice: 这是……的
  rationale: 以自然汉语关系结构承接前面的“柱石”，指明立柱石之事或这类柱石为神所恨恶。
- source_word: שָׂנֵא
  choice: 恨恶
  rationale: 直接保留希伯来语所表达的强烈厌恶，不弱化为一般的不喜悦。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的形式音译神的专名，区别于“主”这一称号。
- source_word: אֱלֹהֶיךָ
  choice: 你的神
  rationale: 保留第二人称单数所有格及盟约关系的直接表达。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 两者都是四字神名的中文音译；采用现代中文圣经语境中更广为普通读者认识的“耶和华”，并保留其作为专名而非称号的性质。
- issue: מַצֵּבָה 的祭祀含义
  choice: 正文译“柱石”，脚注说明其敬拜关联
  alternative: 神柱／祭祀石柱
  rationale: 该词本身指竖立的石头，在本节及申命记语境中具有宗教用途；不在正文加入“神圣”可避免把语境含义固化为词义，脚注则防止读者误解为普通建筑柱。
- issue: 关系从句所指
  choice: 译为“这是耶和华你的神所恨恶的”
  alternative: “耶和华你的神恨恶这样的柱石”
  rationale: 保留原文关系从句的简洁和一定的指涉张力，不额外限定神所恨恶的是物件本身、其宗教用途，还是设立之举。
translation_notes:
  register: 采用简洁、庄重的现代标准汉语。“不可”表达禁令；保留“耶和华你的神”的原文次序与盟约式称谓。
