  naturalness: “立柱石”在现代汉语中不如“立石柱”自然，且“柱石”通常另有“支柱、骨干”的比喻义，容易造成不必要歧义。“石柱”是此处较清楚、自然的正文译法。
  terminology: “耶和华你的神”保留神名、称谓和第二人称所属关系，恰当；“恨恶”充分表达שָׂנֵא的强烈否定。正文不加入“神圣”或“祭祀”等限定语是审慎的；其敬拜关联宜置于脚注。
