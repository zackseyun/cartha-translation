source:
  edition: WLC
  text: שָׁל֣וֹשׁ פְּעָמִ֣ים בַּ/שָּׁנָ֡ה יֵרָאֶ֨ה כָל זְכוּרְ/ךָ֜ אֶת פְּנֵ֣י יְהוָ֣ה אֱלֹהֶ֗י/ךָ בַּ/מָּקוֹם֙ אֲשֶׁ֣ר יִבְחָ֔ר בְּ/חַ֧ג הַ/מַּצּ֛וֹת וּ/בְ/חַ֥ג הַ/שָּׁבֻע֖וֹת וּ/בְ/חַ֣ג הַ/סֻּכּ֑וֹת וְ/לֹ֧א יֵרָאֶ֛ה אֶת פְּנֵ֥י יְהוָ֖ה רֵיקָֽם׀־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/016.yaml
  text: 'Three times a year all your males shall appear before Yahweh your God in the place that he will choose: at the Feast of Unleavened Bread[a], at the Feast of Weeks, and at the Feast of Booths[c][b]. No one shall appear before Yahweh empty-handed.'
translation:
  language: zh_hans
  text: 一年三次，你所有的男丁都要在雅威——你上帝所要选择的地方，来到雅威面前朝见[a]：在除酵节、七七节和住棚节[b]。谁也不可空手来到雅威面前[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文也可直译为“在雅威面前被看见”；这里的希伯来语动词是被动或反身形式，在本语境中是指到上帝面前朝见。
    reason: lexical_alternative
  - marker: b
    text: “住棚节”传统上也译作“帐棚节”。
    reason: alternative_reading
  - marker: c
    text: “空手”是指没有带上应献的礼物或供物。
    reason: cultural_note
lexical_decisions:
- source_word: יֵרָאֶה
  choice: 朝见他
  rationale: 该词是 ראה 的尼法勒形态，字面可理解为“被看见”，但在朝圣节期的语境中，是到上帝面前朝见、呈现自己的惯用表达。“朝见他”在现代汉语中自然庄重，并由脚注保留其字面语态的可能性。
- source_word: כָל זְכוּרְךָ
  choice: 你所有的男丁
  rationale: 希伯来文明确指男性，涉及承担朝圣义务的以色列男子；“男丁”准确保留法律范围，也符合本节庄重的法规语体。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以“雅威”音译四字神名，保留其作为以色列之上帝的专名，而不以称号代替。
- source_word: בַּמָּקוֹם אֲשֶׁר יִבְחָר
  choice: 在……所选择的地方
  rationale: 保留申命记关于敬拜地点由上帝亲自拣选的重点；上下文中的未完成式以“所选择的”自然表达，不强行限定选择发生的具体时间。
- source_word: חַג הַמַּצּוֹת
  choice: 除酵节
  rationale: 这是该节期在现代中文圣经语境中清楚、简洁的通行名称，直接对应“无酵饼的节期”。
- source_word: חַג הַשָּׁבֻעוֹת
  choice: 七七节
  rationale: 直译希伯来节名“众周之节”，并避免把后来的希腊语名称“五旬节”带入本节。
- source_word: חַג הַסֻּכּוֹת
  choice: 住棚节
  rationale: 直接反映 סֻכּוֹת 所指的棚舍，也是现代中文中清楚而通行的节名。
- source_word: רֵיקָם
  choice: 空手
  rationale: 在献礼的礼仪语境中，意思是不可不带礼物或供物而来；“空手”简洁保留原文习语，并以脚注说明其文化含义。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文使用四字神名，译作“雅威”可保留其专名性质，而非用称号替代。
- issue: כָל זְכוּרְךָ 所规定义务的性别范围
  choice: 你所有的男丁
  alternative: 你们所有的人；你所有的男子
  rationale: 原文明确限定男性，故不将其泛化为所有人；“男丁”在法规和群体语境中准确而庄重。
- issue: יֵרָאֶה 的语态及朝见含义
  choice: 到他面前朝见他
  alternative: 在他面前被看见；到他面前呈现自己
  rationale: 尼法勒形式保留“被看见”的字面可能，但在朝圣律例中惯用于到上帝面前朝见。正文采用自然的惯用义，脚注明确原文形式，避免抹去其语法张力。
translation_notes:
  register: 采用现代、庄重而易懂的法规语体。“一年三次”前置以贴近原文重点；三个节名保持平行。“朝见”适合敬拜和君王临在的语境，但不使用过度古奥的句法。所有代词均按本节单数第二人称及上帝的单数指称处理。
