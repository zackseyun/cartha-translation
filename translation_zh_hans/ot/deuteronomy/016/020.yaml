base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/020.yaml
  text: Justice[a], justice you shall pursue[b], so that you may live and possess the land that Yahweh your God is giving you.
translation:
  language: zh_hans
  text: 公正[a]，公正，你要追求，使你得以存活，并拥有[b]耶和华——你的上帝——正在赐给你的那片土地。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“公义，公义，你要追求。”希伯来语 צֶדֶק 既可指公正，也可指公义；这里的司法语境更适合译作“公正”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“并承受那片土地。”希伯来语动词 ירשׁ 既可表达拥有、取得，也可表达承受产业。
    reason: lexical_alternative
lexical_decisions:
- source_word: צֶדֶק צֶדֶק
  choice: 公正，公正
  rationale: צֶדֶק兼有公正、公义之意；本节紧接审判官、偏私和贿赂的司法语境，因此正文采用“公正”。保留名词重复及前置语序，以传达希伯来文的强调。
- source_word: תִּרְדֹּף
  choice: 你要追求
  rationale: רדף本义为追赶、追求；这里未完成式承担命令功能。“你要追求”既保留命令语气，也符合现代汉语表达。
- source_word: לְמַעַן
  choice: 好使
  rationale: 表达目的或结果，将追求公正与存活、拥有土地相连。
- source_word: תִּחְיֶה
  choice: 你可以存活
  rationale: 直接保留חיה的生命含义，也容纳在盟约福分中继续生存的语境，不额外加入兴盛等解释。
- source_word: וְיָרַשְׁתָּ
  choice: 并拥有
  rationale: ירשׁ可指占有、取得产业或承受。此处“拥有”自然地表达取得并持有上帝所赐之地；“承受”作为可能译法列入脚注。
- source_word: הָאָרֶץ
  choice: 那片土地
  rationale: “土地”保留申命记中应许之地的盟约含义；指示成分“那片”使关系从句在现代汉语中更清楚。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文读者熟悉的专名形式来呈现四字神名，而不以“主”这一称号替代。
- source_word: אֱלֹהֶיךָ
  choice: 你的上帝
  rationale: 保留第二人称单数形式及其盟约性称谓。
- source_word: נֹתֵן לָךְ
  choice: 正在赐给你的
  rationale: 分词נֹתֵן呈现持续或当前进行的赐予行动；“正在赐给”保留其鲜明的进行意味。
theological_decisions:
- issue: 司法语境中צֶדֶק的译法
  choice: 公正
  alternative: 公义
  rationale: 上下文涉及审判官、徇私与贿赂，公共和司法层面的“公正”在此居首；脚注保留“公义”，以免抹去该词更广的伦理含义。
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用神的专名而非称号；正文采用现代中文圣经传统中最通行、普通读者最易识别的“耶和华”，同时不以“主”替换专名。
- issue: 土地动词וְיָרַשְׁתָּ的语义
  choice: 并拥有
  alternative: 并承受
  rationale: 该动词兼有取得、占有和承受产业的含义；正文突出实际取得并持有土地，脚注保留盟约产业语境中的“承受”。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留原文“公正，公正”的重复和前置，以呈现强烈劝令；第二人称单数统一译作“你”。
