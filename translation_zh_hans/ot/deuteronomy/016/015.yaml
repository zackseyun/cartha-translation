  text: שִׁבְעַ֣ת יָמִ֗ים תָּחֹג֙ לַ/יהוָ֣ה אֱלֹהֶ֔י/ךָ בַּ/מָּק֖וֹם אֲשֶׁר יִבְחַ֣ר יְהוָ֑ה כִּ֣י יְבָרֶכְ/ךָ֞ יְהוָ֣ה אֱלֹהֶ֗י/ךָ בְּ/כֹ֤ל תְּבוּאָֽתְ/ךָ֙ וּ/בְ/כֹל֙ מַעֲשֵׂ֣ה יָדֶ֔י/ךָ וְ/הָיִ֖יתָ אַ֥ךְ שָׂמֵֽחַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/015.yaml
  text: For seven days you shall celebrate a feast to Yahweh your God in the place that Yahweh will choose[a], because Yahweh your God will bless you in all your produce and in all the work of your hands, and you shall be altogether joyful.
translation:
  language: zh_hans
  text: 你要一连七日，在雅威所选择的地方向雅威你的上帝守节；因为雅威你的上帝必在你一切的出产和你手所做的一切上赐福给你，你必定充满喜乐。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你只要喜乐”，或“你必定喜乐”。原文的表达强调充分、纯然的喜乐。
    reason: 保留אך在限制义与强调义之间的词义张力，并说明正文所取译法。
lexical_decisions:
- source_word: שִׁבְעַת יָמִים
  choice: 一连七日
  rationale: 既准确表达七天的时段，也自然体现节期连续举行七日。
- source_word: תָּחֹג
  choice: 守节
  rationale: חגג指守或庆祝朝圣节期；“守节”在现代中文圣经语体中简洁自然，并保留礼仪性，不把它弱化为一般庆祝。
- source_word: לַיהוָה
  choice: 向雅威
  rationale: 介词ל表示节期以雅威为对象、归向雅威；“向雅威……守节”保留这种指向。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代中文常见音译呈现四字神名，保留其专名性质，而不以称号替代。
- source_word: בַּמָּקוֹם אֲשֶׁר יִבְחַר יְהוָה
  choice: 在雅威所选择的地方
  rationale: 贴近原文介词和关系从句，指向由雅威亲自选定的敬拜地点。
- source_word: כִּי
  choice: 因为
  rationale: 这里引出守节并喜乐的理由，明确表达因果关系。
- source_word: יְבָרֶכְךָ
  choice: 必……赐福给你
  rationale: 保留ברך的盟约性祝福用语；“必”自然表达此处未完成式所带的确定将来意味。
- source_word: תְּבוּאָתְךָ
  choice: 你一切的出产
  rationale: תבואה泛指土地或收成所得，并不限于谷物；“出产”保留其广度。
- source_word: מַעֲשֵׂה יָדֶיךָ
  choice: 你手所做的一切事
  rationale: 保留希伯来文“手所做的”这一劳作惯用语，同时使现代读者容易理解。
- source_word: וְהָיִיתָ אַךְ שָׂמֵחַ
  choice: 你就会满心喜乐
  rationale: “就会”承接上文祝福所带来的结果；“满心喜乐”自然表达אך在此强调纯全、充分喜乐的语气，同时以脚注保留其他可能理解。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；译作“雅威”以专名形式呈现，并采用较接近学界通行重构读音的现代中文音译。
- issue: 结句וְהָיִיתָ אַךְ שָׂמֵחַ的语气
  choice: 你就会满心喜乐
  alternative: 你只要喜乐；你必定喜乐
  rationale: אך既可呈限制意味，也可在此加强语气。上下文强调收成、劳作蒙福后节庆之乐，因此正文采用充分、纯然喜乐的理解，但不把其他语法可能性从读者面前删去。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。“守节”保留律法与节期语境；全句维持第二人称单数，以对应原文对以色列整体所作的单数称呼。
