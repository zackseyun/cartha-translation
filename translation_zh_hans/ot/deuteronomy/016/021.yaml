base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/021.yaml
  text: You shall not plant for yourself an Asherah of any kind of tree beside the altar of Yahweh your God that you make for yourself[a].
translation:
  language: zh_hans
  text: 不可在你为自己筑的雅威——你的上帝的祭坛旁，为自己栽种任何树木作为亚舍拉[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“亚舍拉柱”。希伯来语“亚舍拉”可指女神亚舍拉，也可指与其崇拜有关的礼仪物，不一定仅指女神本身。
    reason: 保留原词在女神名称与相关礼仪物之间的语义歧义。
lexical_decisions:
- source_word: תִטַּע
  choice: 栽种
  rationale: 希伯来语 נטע 通常指“栽种”。这里虽涉及敬拜用物，仍保留原文的栽种意象，不径直改译为“设立”。
- source_word: אֲשֵׁרָה
  choice: 亚舍拉
  rationale: 音译该词，以保留它既可与女神亚舍拉有关、也可指相关敬拜物的语义张力；不在正文中限定为“木柱”。
- source_word: כָּל עֵץ
  choice: 任何一种树木
  rationale: 直译为“任何树木”；加“一种”使现代汉语自然，并表达禁令不以树种为限。
- source_word: אֵצֶל
  choice: 旁
  rationale: 准确表达紧邻、靠近的空间关系，在法律禁令中简洁自然。
- source_word: מִזְבַּח
  choice: 祭坛
  rationale: 这是该词在敬拜语境中的标准汉语对应词。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以通行汉语音译呈现上帝的专名，而不以称号替代。
- source_word: אֱלֹהֶיךָ
  choice: 你上帝
  rationale: 保留第二人称单数的盟约性称呼；与专名之间用破折号构成同位说明。
- source_word: אֲשֶׁר תַּעֲשֶׂה לָּךְ
  choice: 你为自己筑的
  rationale: 在祭坛这一宾语下，עשה 自然译为“筑”；“为自己”保留 לָּךְ 的反身意味。
theological_decisions:
- issue: אֲשֵׁרָה 在本节是女神之名还是与她有关的敬拜物
  choice: 正文音译为“亚舍拉”，并以“栽种任何一种树木作亚舍拉”呈现其树木及敬拜物关联
  alternative: 亚舍拉柱；亚舍拉木像；木制敬拜柱
  rationale: 原词在此可能指女神亚舍拉，也可能指与其崇拜有关的树木或木制物。音译并加脚注可避免把有意保留的语义张力缩减为某一种具体器物。
translation_notes:
  register: 采用现代、庄重而易懂的法律禁令语体。“不可”对应禁止式；两个“为自己”分别反映原文两处 לְךָ／לָּךְ。正文保留“栽种”与“亚舍拉”的组合，以免用更顺口的“设立木柱”过早消除原文意象和歧义。
