- from: 它也不在海的那一边[a]，以致你说：“谁能为我们渡到海的那一边，把它取来给我们[b]，让我们听见[c]，好让我们遵行呢？”
  to: 它也并非远在海的那边，叫你不得不说：“谁能为我们渡到海的那边，把它取来给我们[b]，使我们听见它[c]，好让我们遵行呢？”
  rationale: 将“以致你说”改为“叫你不得不说”，以准确而自然地表达原文“并非远到需要你如此说”的否定假设结构；将“让我们听见”改为“使我们听见它”，保留使役式和明确宾语。脚注a仅提供空间表达的替代译法，修订正文未采用该锚点，故不保留该脚注及其锚点。
