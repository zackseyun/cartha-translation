    rationale: לֵאמֹר在此引出因诫命并非遥不可及而无需提出的假设性反问。汉语“它不在……，以致你说”容易读成“因它不在那里，所以你说”，与原意相反或至少不清。
  - severity: low
    issue: 正文“让我们听见”未明确译出宾语“它”。
