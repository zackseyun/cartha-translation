base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/013.yaml
  text: And it is not beyond the sea[a], that you should say, ‘Who will cross over to the other side of the sea for us and get it for us and make us hear it[c][b], so that we may do it?’
translation:
  language: zh_hans
  text: 它也并非远在海的那边，叫你不得不说：“谁能为我们渡到海的那边，把它取来给我们[b]，使我们听见它[c]，好让我们遵行呢？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 直译为“为我们取它”；这里含有把它取得并带到众人可及之处的意思。
    reason: lexical_alternative
  - marker: c
    text: 直译为“使我们听见它”；这是使役表达，也可按语境理解为“讲给我们听”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵעֵבֶר לַיָּם
  choice: 在海的那一边
  rationale: 这一空间表达指海的彼岸；译文保留“那一边”的方位意象，也符合现代汉语习惯。
- source_word: הִוא
  choice: 它
  rationale: 阴性代词承接上文的“诫命”；本节单独呈现时用“它”保留原文的代词衔接，不擅自补出名词。
- source_word: לֵאמֹר
  choice: 以致你说
  rationale: 该词引出假设中的话语；结合前面的否定结构，译作“以致你说”能自然表达“并非远到需要这样说”的语气。
- source_word: יַעֲבָר לָנוּ
  choice: 谁能为我们渡到
  rationale: “渡到”体现跨越海域的动作，“为我们”保留利益与代办含义；“能”符合汉语反问语气。
- source_word: אֶל עֵבֶר הַיָּם
  choice: 海的那一边
  rationale: 明确保留目的地“到海的另一边”，不把它简化为仅仅“渡海”。
- source_word: וְיִקָּחֶהָ לָּנוּ
  choice: 把它取来给我们
  rationale: לקח字面义为“拿、取”；在语境中所取之物须成为百姓可得之物，因此“取来给我们”兼顾字面动作与语境方向。
- source_word: וְיַשְׁמִעֵנוּ אֹתָהּ
  choice: 让我们听见
  rationale: 使役式表达“使我们听见”；译文保留听闻意象，而不直接限定为“宣讲”或“解释”。
- source_word: וְנַעֲשֶׂנָּה
  choice: 好让我们遵行
  rationale: עשׂה在诫命语境中不仅是一般的“做”，而是付诸实行；“遵行”准确表达对诫命的实行，“好让”体现目的或结果关系。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。保留原文从“海的那一边”到“渡到海的那一边”的空间呼应，并保留“使人听见”的使役意象；问句用“谁能”呈现假设性反问。
