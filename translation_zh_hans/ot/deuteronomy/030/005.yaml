  text: וֶ/הֱבִֽיאֲ/ךָ֞ יְהוָ֣ה אֱלֹהֶ֗י/ךָ אֶל הָ/אָ֛רֶץ אֲשֶׁר יָרְשׁ֥וּ אֲבֹתֶ֖י/ךָ וִֽ/ירִשְׁתָּ֑/הּ וְ/הֵיטִֽבְ/ךָ֥ וְ/הִרְבְּ/ךָ֖ מֵ/אֲבֹתֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/005.yaml
  text: And Yahweh your God will bring you into the land that your fathers possessed[a], and you will possess it[b]; and he will prosper you and multiply you more than your fathers.
translation:
  language: zh_hans
  text: 雅威你的神必领你进入你列祖曾占有[a]的土地，你也必占有那地；他必恩待你[b]，使你的人数比你列祖更多。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “占有”也可译作“承受”或“取得为业”。这里与下句“占有”所译的是同一个希伯来语词根。
    reason: lexical_alternative
  - marker: b
    text: “恩待你”也可译作“善待你”或“使你兴盛”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וֶהֱבִיאֲךָ
  choice: 必领你进入
  rationale: 使役式的 בוא 表示“使进入、带入”。译文不添入原动词没有明说的“重新”或“回来”，让复归含义由上下文表达。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译呈现四字神名，不用“主”这一称号代替专名。
- source_word: אֱלֹהֶיךָ
  choice: 你的神
  rationale: 原文为“神”加第二人称阳性单数所属后缀，直接译为“你的神”。
- source_word: הָאָרֶץ
  choice: 土地
  rationale: 这里指列祖曾占有、以色列将再次取得的那片地；“土地”保留地理及立约语境。
- source_word: אֲשֶׁר יָרְשׁוּ אֲבֹתֶיךָ
  choice: 你列祖曾占有的
  rationale: ירשׁ 可指承受、取得或占有。此处描述列祖已经拥有那地，主文用自然明确的“曾占有”，同时以脚注保留其他词义。אֲבֹתֶיךָ 译作“你列祖”，保留阳性先辈称谓及庄重经文语体。
- source_word: וִירִשְׁתָּהּ
  choice: 你也必占有那地
  rationale: 沿用前句同一词根 ירשׁ 的“占有”，显出原文的词语呼应；将代词具体化为“那地”，使现代汉语清楚自然。
- source_word: וְהֵיטִבְךָ
  choice: 他必恩待你
  rationale: 使役式 יטב 在此表示“善待、施恩于”。“恩待”保留宽泛的施福含义，不把它局限为物质兴旺。
- source_word: וְהִרְבְּךָ
  choice: 使你的人数……更多
  rationale: 使役式 רבה 表示使之增多；补出“人数”能在汉语中明确这里所说的是人口增多。
- source_word: מֵאֲבֹתֶיךָ
  choice: 比你列祖更多
  rationale: 介词 מִן 在此为比较用法，表示人数超过列祖；“列祖”与前文保持一致。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文使用神的专名。主文以“雅威”音译其通常重构读音，避免用称号“主”取代专名；“耶和华”是汉语传统形式，但较接近 Jehovah 的历史音译。
- issue: אֲבֹתֶיךָ 的性别及群体指向
  choice: 你列祖
  alternative: 你的祖先
  rationale: 原词是阳性复数“父辈”。“列祖”既保留这一明确形式，也符合庄重而可懂的现代汉语，指以色列的先祖。
- issue: ירשׁ 的承受与占有含义
  choice: 占有
  alternative: 承受；取得为业
  rationale: 该动词兼有承受产业和取得、占有的语义。上下文先说列祖已有那地，继而说以色列将有那地，因此主文采用“占有”，并在脚注保留产业语义的可能性。
translation_notes:
  register: 采用自然、庄重而面向普通读者的现代标准汉语。“列祖”略带经文语体，但含义清楚，并准确保留原文的阳性先辈称谓。句式保留原文三个连续应许的推进关系；以“人数”明示 רבה 在本语境中的人口增长含义。所有脚注标记均已置于正文相应词语之后。
