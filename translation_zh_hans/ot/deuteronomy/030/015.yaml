  yaml_path: translation/ot/deuteronomy/030/015.yaml
  text: See[a], I have set before you today life and good[b], and death and evil.
translation:
  language: zh_hans
  text: 看哪[a]，我今日将生命和善、死亡和恶[b]摆在你面前。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “看哪”也可译作“你看”或“请看”。
    reason: lexical_alternative
  - marker: b
    text: “恶”在某些语境中也可译作“祸害”或“灾祸”；这里希伯来文使它与“善”直接相对。
    reason: lexical_alternative
lexical_decisions:
- source_word: רְאֵה
  choice: 看哪
  rationale: 这是ראה的单数命令式，在此用来唤起听者注意。“看哪”庄重而清楚，保留直接召唤的语气。
- source_word: נָתַתִּי לְפָנֶיךָ
  choice: 我把……摆在你面前
  rationale: נתן基本义为“给、放、置”；与“在你面前”连用时，表达把可供选择的事物陈列于人面前。“摆在你面前”是自然的现代汉语。
- source_word: הַיּוֹם
  choice: 今日
  rationale: 准确表达时间副词；“今日”比“今天”稍显庄重，但仍为现代读者熟悉。
- source_word: הַחַיִּים
  choice: 生命
  rationale: 该词形态上为复数，却常作抽象名词，意为“生命”。
- source_word: הַטּוֹב
  choice: 福祉
  rationale: טוֹב可指善、美好或福乐。此处与“生命”并列，并同“死亡、祸患”形成约的后果性对照；“福祉”既保留正面广度，也避免把它仅理解为道德上的“善”。
- source_word: הַמָּוֶת
  choice: 死亡
  rationale: 直接对应“生命”，形成清晰的对偶。
- source_word: הָרָע
  choice: 祸患
  rationale: רַע可指道德上的恶，也可指灾祸、伤害或不幸。此处与“死亡”并列，且下文涉及背约的后果，译作“祸患”较自然；脚注保留“恶”的可能性。
theological_decisions:
- issue: 约的对比中הַטּוֹב与הָרָע的含义范围
  choice: 福祉／祸患
  alternative: 善／恶
  rationale: 希伯来词既有道德维度，也可表示境况与后果。结合“生命／死亡”的并列以及紧接下文的祝福和灭亡，正文采用“福祉／祸患”，但不把道德含义排除在外，并以脚注保存“善／恶”的直译可能。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“今日”和“看哪”保留申命记劝诫场景的郑重语气；句法保持希伯来原文两组并列对偶。
