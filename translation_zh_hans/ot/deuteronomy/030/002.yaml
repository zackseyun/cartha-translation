base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/002.yaml
  text: and you return to Yahweh your God and obey his voice[a], according to all that I am commanding you today, you and your children, with all your heart and with all your soul[c][b],
translation:
  language: zh_hans
  text: 你和你的儿女若全心全意归向耶和华——你的上帝，并听从他的话[a]，照着我今天所吩咐你的一切去做，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“听他的声音”；这个希伯来语说法常有“听从、服从”的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׁבְתָּ עַד
  choice: 归向
  rationale: שׁוּב与עַד连用，表示回转归向某人；“归向”保留具体的回转意象及盟约语境，又不直接改译为较窄的神学术语“悔改”。
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: 耶和华你的上帝
  rationale: 以现代汉语中通行的专名“耶和华”呈现四字神名，并直译第二人称单数所属关系“你的上帝”。
- source_word: וְשָׁמַעְתָּ בְקֹלוֹ
  choice: 听从他的话
  rationale: שׁמע בקול不只表示听见，更有留意并服从之意；“听从他的话”自然表达顺服的语义，同时保留“听”的希伯来语意象。
- source_word: כְּכֹל אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: 照我今天所吩咐你的一切去做
  rationale: “照……一切”表达完全依从命令的范围；补入“去做”使汉语句意完整，并明确“听从”的实践含义。
- source_word: אַתָּה וּבָנֶיךָ
  choice: 你和你的儿女
  rationale: בנים字面可指“儿子们”，但在此盟约及家庭语境中可泛指后代；“儿女”既保留亲属关系，又避免不必要地限定男性。
- source_word: בְּכָל לְבָבְךָ וּבְכָל נַפְשֶׁךָ
  choice: 全心全意
  rationale: 这一现代汉语成语自然传达以整个内在意志与生命投入的总括意义；但因נפש语义较宽，脚注说明较形式对应的译法。
theological_decisions:
- issue: 四字神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: “耶和华”是现代中文圣经读者最熟悉且可辨识为专名的形式；不以“主”替代原文中的盟约名。
- issue: בָנֶיךָ的指称范围
  choice: 你的儿女
  alternative: 你的儿子们
  rationale: 阳性复数在盟约家庭语境中可以统指子女或后代；译作“儿女”保留这种可能范围，不作仅限男性的断定。
- issue: “心”与נפש并列的整体性
  choice: 全心全意
  alternative: 尽心、尽性
  rationale: 正文采用自然现代汉语表达全然归向与顺服，不把נפש固定解释为独立、技术性的灵魂实体；脚注保留形式对应及其语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。为使30:2作为30:1条件从句的延续自然衔接，加入“若”；句末保留逗号，显示本节句法尚待下文主句完成。“全心全意”避免生硬直译，但脚注仅集中解释最需要说明的希伯来语听从习语。
