base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/017.yaml
  text: But if your heart turns away[a], and you do not listen, and you are drawn away and bow down to other gods and serve them[b],
translation:
  language: zh_hans
  text: 但如果你的心偏离，不听从[a]，又被引离[b]，向别的神俯伏下拜，事奉它们，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “听从”也可译作“听”或“顺服”；希伯来语原词在盟约语境中常兼有听见、留心并照着去行的意思。
    reason: lexical_alternative
  - marker: b
    text: “被引离”也可译作“被拉走”或“被赶离”；希伯来语原词可表示受外力偏离原有方向或忠诚。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: 但如果
  rationale: 承接上文并引出相反的条件，既保留条件关系，也自然表达语境中的转折。
- source_word: יִפְנֶה לְבָבְךָ
  choice: 你的心偏离
  rationale: פנה 表示转向；以“心”为主语时，这里指内在的忠诚发生偏离。“偏离”在现代汉语中自然，并保留离开正确归属的含义。
- source_word: וְלֹא תִשְׁמָע
  choice: 不肯听从
  rationale: שׁמע 兼有听、留心和服从之意。“听从”保留听闻意象，也体现盟约语境中遵行命令的含义；“不肯”表达此处拒绝听从的语气。
- source_word: וְנִדַּחְתָּ
  choice: 又被引离
  rationale: נדח 的尼法勒形可指被赶离、被拉走或被引离。“被引离”保留被动形式和离开原有忠诚对象的动态，同时不擅自指明施动者。
- source_word: וְהִשְׁתַּחֲוִיתָ
  choice: 俯伏下拜
  rationale: 该词首先描写俯伏、下拜这一身体动作，在本语境中构成敬拜。“俯伏下拜”兼顾具体动作和宗教含义。
- source_word: לֵאלֹהִים אֲחֵרִים
  choice: 向别的神
  rationale: 直译申命记中指竞争性神明的惯用表达，不额外解释其性质。
- source_word: וַעֲבַדְתָּם
  choice: 事奉它们
  rationale: עבד 表示服事，在神明语境中包括礼仪性的敬奉。“事奉”保留其服役、侍奉的词义，并由上下文显出宗教意义。
theological_decisions:
- issue: 背离盟约的递进过程
  choice: 依次译出内心偏离、拒绝听从、被引离、向别神下拜及事奉它们。
  alternative: 把“被引离”译为主动意味更强的“任凭自己受诱惑”，或把“不肯听从”直接译为“不顺服”。
  rationale: 希伯来文呈现一连串背离行为，但没有说明“被引离”的施动者，也没有展开其机制。译文保留被动和递进关系，避免加入原文未明说的责任机制或教义判断。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“俯伏下拜”和“事奉”保留经文的礼仪色彩；整体维持原文条件句尚未结束的逗号收尾，以便与下一节衔接。
