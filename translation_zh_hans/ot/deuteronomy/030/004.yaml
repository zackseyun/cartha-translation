base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/004.yaml
  text: If your outcasts are at the end of the heavens[a], from there Yahweh your God will gather you[c][b], and from there he will take you.
translation:
  language: zh_hans
  text: 如果你中被赶散的人[a]在天的尽头[b]，雅威你的神必从那里把你聚集起来，也必从那里把你带走[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“被放逐的人”或“流散的人”。希伯来语指被赶走或分散的人。
    reason: lexical_alternative
  - marker: b
    text: “天的尽头”是希伯来语说法，指所能想象的最遥远之处。
    reason: cultural_note
  - marker: c
    text: 或译“把你带来”。这里的希伯来语动词更直译是“取、带”；本节没有明说目的地。
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: 如果
  rationale: 直接表达条件关系，不把语境中可能含有的“即使”意味写死。
- source_word: נִדַּחֲךָ
  choice: 你中被赶散的人
  rationale: 该词源于 נדח，指被驱逐、赶散的人；第二人称单数后缀以集合意义指向作为整体的以色列。此译法既保留被动结果，也使现代汉语清楚自然。
- source_word: בִּקְצֵה הַשָּׁמָיִם
  choice: 在天的尽头
  rationale: 贴近希伯来语空间意象，并保留其庄重语体；脚注说明这是指极遥远之地的习语。
- source_word: מִשָּׁם
  choice: 从那里
  rationale: 原文两次重复，形成强调；译文相应保留两次。
- source_word: יְקַבֶּצְךָ
  choice: 把你聚集起来
  rationale: קבץ 的 Piel 形式表示聚集、召集；不额外加入原文未明说的“重新”或“回来”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现神的专名，而不以“主”这一称号替代。
- source_word: אֱלֹהֶיךָ
  choice: 你的神
  rationale: 保留第二人称单数的盟约称谓，并与神名构成自然的汉语同位结构。
- source_word: וּמִשָּׁם יִקָּחֶךָ
  choice: 也必从那里把你接回
  rationale: לקח 的基本义是“取、带、接”；结合从流散之地聚集的语境，“接回”在汉语中自然表达行动方向，但以脚注保留更直译的可能。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。采用“雅威”保留其专名性质，避免以称号替换；“耶和华”是另一传统音译。
- issue: 对以色列的集合性单数称呼
  choice: 保留“你／你的”这一单数形式，并用“你中被赶散的人”显示集合意义
  alternative: 改用复数称呼，如“你们／你们中流散的人”
  rationale: 希伯来语以第二人称单数称呼作为整体的以色列。译文保留这一盟约性的集合单数，不将其扁平化为普通复数。
- issue: יִקָּחֶךָ 所表达的方向
  choice: 接回
  alternative: 带走；带来；接走
  rationale: 动词本身宽泛地表示“取、带”，上下文则是神从远方聚集以色列。“接回”符合汉语表达和上下文方向，但脚注明示其较直译的词义，以免掩盖原文的宽泛性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“天的尽头”保留原文意象；“聚集起来”与“接回”符合当代汉语，同时借脚注呈现原词的其他可能。全节保留原文两次“从那里”的强调结构。
