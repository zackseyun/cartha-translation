  text: וְ/הָיָה֩ כִֽי יָבֹ֨אוּ עָלֶ֜י/ךָ כָּל הַ/דְּבָרִ֣ים הָ/אֵ֗לֶּה הַ/בְּרָכָה֙ וְ/הַ/קְּלָלָ֔ה אֲשֶׁ֥ר נָתַ֖תִּי לְ/פָנֶ֑י/ךָ וַ/הֲשֵׁבֹתָ֙ אֶל לְבָבֶ֔/ךָ בְּ/כָל הַ/גּוֹיִ֔ם אֲשֶׁ֧ר הִדִּיחֲ/ךָ֛ יְהוָ֥ה אֱלֹהֶ֖י/ךָ שָֽׁמָּ/ה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/001.yaml
  text: And when all these things come upon you—the blessing and the curse that I have set before you—and you take them to heart among all the nations where Yahweh your God has driven you,[a]
translation:
  language: zh_hans
  text: 当这一切临到你——就是我摆在你面前的祝福和咒诅——而你在耶和华—你的上帝所赶你到的各国中，把这一切放在心上[a]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“使这一切回到你的心里。”
    reason: 说明希伯来语的字面意象，并保留其可兼指回想与认真领会的语义范围。
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: 当……时
  rationale: 该结构引出将来的情形；中文用“当”自然地保留时间关系。
- source_word: יָבֹאוּ עָלֶיךָ
  choice: 临到你
  rationale: 贴近希伯来语“来到……之上”的表达，也自然表示这些境遇发生在听者身上。
- source_word: כָּל הַדְּבָרִים הָאֵלֶּה
  choice: 这一切
  rationale: דברים 在此指前文陈明的全部盟约后果，而不只是言语；“这一切”简洁自然。
- source_word: הַבְּרָכָה וְהַקְּלָלָה
  choice: 祝福和咒诅
  rationale: 保留经文中彼此对举的两类盟约后果。
- source_word: אֲשֶׁר נָתַתִּי לְפָנֶיךָ
  choice: 我摆在你面前的
  rationale: נתן 与“在你面前”连用，意为摆出、置于面前，中文如此表达准确自然。
- source_word: וַהֲשֵׁבֹתָ אֶל לְבָבֶךָ
  choice: 把这一切放在心上
  rationale: 原文直译近于“使之回到你的心”；此处表达在流散之地回想并认真领会这些事。“放在心上”保留“心”的意象，并以脚注说明字面表达。
- source_word: בְּכָל הַגּוֹיִם
  choice: 在……各国中
  rationale: 表示以色列人在外邦各族或各国中的处境；“各国中”符合现代中文。
- source_word: הִדִּיחֲךָ
  choice: 赶你去
  rationale: 该动词有强行驱逐、赶散之意；“赶你去”也自然衔接方向副词 שָׁמָּה。
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: 耶和华—你的上帝
  rationale: 以中文通行的专名“耶和华”呈现四字神名；破折号表明“你的上帝”是同位说明。
- source_word: שָׁמָּה
  choice: 去
  rationale: 原文为方向性的“那里”；与“赶”结合译成“赶你去的”，自然地保留方向含义。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用神的专名。中文正文采用读者最熟悉且明确作为专名的“耶和华”，不以“主”取代专名；“雅威”是可行的学术拟音。
- issue: וַהֲשֵׁבֹתָ אֶל לְבָבֶךָ 所表达的内在行动
  choice: 把这一切放在心上
  alternative: 使这一切回到心里／回想这一切
  rationale: 该短语可侧重回想，也可包含认真领会。正文保留“心”的意象和语义张力，不把它限定为单纯记忆或悔改。
translation_notes:
  register: 采用庄重而现代的普通话。经文是延续至下一节的条件句，因此保留句末逗号。第二人称单数一律译作“你”。
