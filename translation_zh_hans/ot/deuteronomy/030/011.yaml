  text: כִּ֚י הַ/מִּצְוָ֣ה הַ/זֹּ֔את אֲשֶׁ֛ר אָנֹכִ֥י מְצַוְּ/ךָ֖ הַ/יּ֑וֹם לֹֽא נִפְלֵ֥את הִוא֙ מִמְּ/ךָ֔ וְ/לֹ֥א רְחֹקָ֖ה הִֽוא־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/011.yaml
  text: For this commandment that I am commanding you today is not too difficult for you[a], nor is it far away.
translation:
  language: zh_hans
  text: 因为我今天吩咐你的这条诫命，并非你所不能及[a]，离你也不远。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“对你并不太难”或“没有向你隐藏”。希伯来语动词可指非凡、难以接近，或超出人所能掌握。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，为此前的劝勉说明理由；“因为”符合本节在上下文中的解释功能。
- source_word: הַמִּצְוָה הַזֹּאת
  choice: 这条诫命
  rationale: מִצְוָה指命令或诫命；“诫命”保留《申命记》的盟约与律法语体。
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: 我今天吩咐你的
  rationale: 准确表达摩西当日向以色列人颁布命令的直接性；现代汉语无需另行标示希伯来语分词的进行意味。
- source_word: לֹא נִפְלֵאת הִוא מִמְּךָ
  choice: 并非你所不能及
  rationale: פלא在此可表示非凡、难以达到、超出掌握范围；“所不能及”保留可理解为难度或可及性的空间，同时避免把经文仅限于“难懂”或直接断言人的道德能力。
- source_word: וְלֹא רְחֹקָה הִוא
  choice: 离你也不远
  rationale: 保留רָחוֹק的远近意象，并与下文关于上天、过海及“离你甚近”的论述自然衔接。
theological_decisions:
- issue: נִפְלֵאת与人理解、实行盟约诫命之能力的关系
  choice: 译作“并非你所不能及”
  alternative: “对你并不太难”或“没有向你隐藏”
  rationale: 本节强调诫命并非不可接近或超出掌握范围。此译法保留理解与实行两方面的可能含义，不借本节解决后来的神学争论，也不把它扩大为关于人凭自身能力行善的普遍命题。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“这条诫命”保留律法语体；“并非你所不能及”与“离你也不远”形成平衡，并延续后文的远近意象。
