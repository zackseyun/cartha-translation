  text: הִגַּ֤דְתִּי לָ/כֶם֙ הַ/יּ֔וֹם כִּ֥י אָבֹ֖ד תֹּאבֵד֑וּ/ן לֹא תַאֲרִיכֻ֤/ן יָמִים֙ עַל הָ֣/אֲדָמָ֔ה אֲשֶׁ֨ר אַתָּ֤ה עֹבֵר֙ אֶת הַ/יַּרְדֵּ֔ן לָ/בֹ֥א שָׁ֖מָּ/ה לְ/רִשְׁתָּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/018.yaml
  text: I declare to you today that you will surely perish[c][b][a]; you will not prolong your days on the land that you are crossing the Jordan to enter there and possess it.
translation:
  language: zh_hans
  text: 我今日向你们宣告：你们必定灭亡[a]；你们在将要渡过约旦河、进入那里并取得的那片土地上，必不能长久度日。[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文采用同根词重复的强调结构，直译近似“灭亡，你们必灭亡”，表示“必定灭亡”。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“你们不能在那片土地上长久存留”。
    reason: lexical_alternative
  - marker: c
    text: 本节前半句用复数“你们”，后半句则用单数“你”，把以色列视为一个整体；中文正文仍用“你们”以免误解。
    reason: cultural_note
lexical_decisions:
- source_word: הִגַּדְתִּי לָכֶם הַיּוֹם
  choice: 我今日向你们宣告
  rationale: נגד 的使役形表示使人知道、郑重宣告；“宣告”保留盟约警告的庄重语气。לָכֶם 是复数“向你们”，הַיּוֹם 直译为“今日”。
- source_word: כִּי
  choice: ：
  rationale: 此处引出宣告的内容。中文用冒号比机械译作“说”或“就是”更自然，并清楚呈现后续警告。
- source_word: אָבֹד תֹּאבֵדוּן
  choice: 你们必定灭亡
  rationale: 不定式绝对形与同根限定动词连用，强化结果的确定性；“必定灭亡”自然保留这一强调。
- source_word: לֹא תַאֲרִיכֻן יָמִים
  choice: 必不能长久度日
  rationale: 字面为“不能使日子长久”。“长久度日”既保留“日子”的希伯来习语，也用现代中文表达“不能长久生存”的意思。
- source_word: עַל הָאֲדָמָה
  choice: 在……那片土地上
  rationale: 在申命记的语境中，אֲדָמָה 指约旦河彼岸将要取得的应许之地，而非抽象的土壤。
- source_word: אֲשֶׁר אַתָּה עֹבֵר אֶת הַיַּרְדֵּן
  choice: 所要渡过约旦河
  rationale: 分词表达眼前即将进行的行动；现代汉语用“所要渡过”自然体现临近性。希伯来文在此转用单数“你”，将以色列视为一个整体；中文“你们”不区分这一数的变化，故以脚注说明。
- source_word: לָבֹא שָׁמָּה לְרִשְׁתָּהּ
  choice: 进去取得的
  rationale: “进去”表达 בוא 与 שָׁמָּה 的向内、向那里移动；“取得”表达 ירש 在土地语境中的占有、得地含义。土地作为宾语在中文定语结构中已清楚，无须另加代词。
theological_decisions:
- issue: 以色列作为整体所受的单数称呼
  choice: 正文采用自然的中文复数“你们”，脚注说明后半句原文为单数“你”
  alternative: 在正文中生硬地由“你们”改为“你”
  rationale: 原文先用复数 לָכֶם、תֹּאבֵדוּן、תַאֲרִיכֻן，随后以单数 אַתָּה 称呼以色列整体。现代中文若突然改用“你”，容易被误解为对象改变；脚注既保留原文修辞信息，也维持正文清晰。
- issue: 盟约之地的用语
  choice: 将 הָאֲדָמָה 译为“那片土地”
  alternative: “地面”或“土壤”
  rationale: 本节明确指约旦河彼岸以色列将进入并取得的地域；译作“土地”保留叙事和盟约语境，不额外加入宗派解释。
- issue: 灭亡警告的力度
  choice: 译作“必定灭亡”
  alternative: “可能灭亡”或仅作“死亡”
  rationale: 同根不定式绝对形加强确定性，不允许弱化为可能性；“灭亡”也比单指个体死亡更能容纳失去土地、群体败亡等上下文含义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“今日”“宣告”保留盟约讲话的正式感；句法避免仿古和过度直译。脚注标记均置于正文相关位置；[a][b]说明强调结构与词义选择，[c]说明希伯来文由复数转为整体单数的修辞。
