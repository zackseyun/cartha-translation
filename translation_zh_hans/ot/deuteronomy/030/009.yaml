  text: וְ/הוֹתִֽירְ/ךָ֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ בְּ/כֹ֣ל מַעֲשֵׂ֣ה יָדֶ֗/ךָ בִּ/פְרִ֨י בִטְנְ/ךָ֜ וּ/בִ/פְרִ֧י בְהֶמְתְּ/ךָ֛ וּ/בִ/פְרִ֥י אַדְמָתְ/ךָ֖ לְ/טוֹבָ֑ה כִּ֣י יָשׁ֣וּב יְהוָ֗ה לָ/שׂ֤וּשׂ עָלֶ֨י/ךָ֙ לְ/ט֔וֹב כַּ/אֲשֶׁר שָׂ֖שׂ עַל אֲבֹתֶֽי/ךָ׀׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/009.yaml
  text: And Yahweh your God will make you abound in all the work of your hand[a], in the fruit of your womb, in the fruit of your livestock, and in the fruit of your ground, for good; for Yahweh will again rejoice over you for good[b], just as he rejoiced over your fathers.
translation:
  language: zh_hans
  text: 耶和华你的上帝必使你在你手所做的一切事上丰盛有余[a]，又使你腹中所生的、你牲畜所产的和你土地所出的丰盛有余，叫你得福；因为耶和华必再次因你而欢喜，使你得福，正如他因你的列祖而欢喜一样。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “使……丰盛有余”也可译作“使你富足有余”或“使你兴旺”；原文动词含有使人增多、有余的意思。
    reason: lexical_alternative
  - marker: b
    text: “因你而欢喜，使你得福”较直译为“为你好而因你欢喜”。“列祖”原文为“父辈”，指以色列先前的祖辈。
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: וְהוֹתִירְךָ
  choice: 必使你……都丰盛
  rationale: 该词为יתר的使役形，表示使人有余、增多。译作“使……丰盛”保留使役意义，并自然统摄后面的劳作、儿女、牲畜和土地出产。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代汉语中广为人知的专名“耶和华”直接对应四字神名，不以“主”这一称号代替。
- source_word: בְּכֹל מַעֲשֵׂה יָדֶךָ
  choice: 你手中所做的一切
  rationale: 保留“手”的具体意象，同时以自然汉语表达人的一切劳作和经营。
- source_word: בִּפְרִי בִטְנְךָ
  choice: 你腹中所生的
  rationale: 保留“腹中”的身体意象，又以“所生的”清楚表达儿女或后代，避免生硬直译“腹中的果子”。
- source_word: בְהֶמְתְּךָ
  choice: 牲畜
  rationale: 此处泛指家养牲畜，比“牛群”更宽泛，也比“动物”更符合农牧语境。
- source_word: אַדְמָתְךָ
  choice: 土地
  rationale: 指可耕作并有出产的土壤或田地；“土地所出的”是自然且具体的汉语表达。
- source_word: לְטוֹבָה / לְטוֹב
  choice: 使你得福／赐福给你
  rationale: 介词短语表达有益、福祉的结果。按两处不同句法分别译为自然汉语，未将其缩窄为单纯物质繁荣。
- source_word: יָשׁוּב
  choice: 再次
  rationale: שׁוב接不定式表示重新进行某行动；“再次”比逐字译作“返回去”更符合汉语。
- source_word: לָשׂוּשׂ עָלֶיךָ
  choice: 乐意赐福给你
  rationale: שׂושׂ本义为欢喜、欣喜；结合紧随其后的לְטוֹב，译文表达上帝因使人得福而欢喜。此译自然，但在脚注保留更形式对应的表达。
- source_word: אֲבֹתֶיךָ
  choice: 祖先
  rationale: 复数“父辈”在此指以色列先前的列祖或祖先；“祖先”在现代汉语中准确自然，并不否认其阳性形式。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威／上主
  rationale: 原文使用神的专名而非普通称号。中文正文采用传统且通行的“耶和华”，保留专名功能。
- issue: “耶和华再次欢喜”的语义关系
  choice: 耶和华必再次乐意赐福给你
  alternative: 耶和华必再次因使你得福而为你欢喜
  rationale: 原文是“再次欢喜于你，为了福/使之得福”，既可较形式地表达“为你欢喜”，也可理解为他乐意使你得福。正文采用自然汉语，但脚注保存原文较直接的结构和可能张力。
- issue: אֲבֹתֶיךָ的指称范围
  choice: 你的祖先
  alternative: 你的列祖／你的父辈
  rationale: 语境指以色列过去的祖辈，可能特别唤起列祖。现代汉语“祖先”覆盖该范围且不额外限定为某一组人物。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。保留“手中所做”“腹中所生”等希伯来语的具体意象，但避免“腹中的果子”等在现代汉语中生硬或易误解的直译。句式通过重复“使……丰盛”明确首个使役动词统摄整组祝福。
