base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/008.yaml
  text: And you shall return and obey the voice of Yahweh[b][a], and you shall do all his commandments that I am commanding you today.
translation:
  language: zh_hans
  text: 而你必回转[a]，听从耶和华的声音[b]，并遵行他的一切诫命，就是我今天吩咐你的诫命。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “回转”也可译作“返回”；在本段语境中，也可能包含回归盟约、悔改的意思。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译为“听耶和华的声音”；这个惯用语通常含有顺服的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: 而你
  rationale: 保留希伯来文显出的第二人称代词所带的强调；“而”自然承接上文，又不把关系过度解释为强烈转折。
- source_word: תָשׁוּב
  choice: 要回转
  rationale: שׁוּב的基本义是“返回、转回”。“回转”既可指实际归回，也可承载回归盟约和悔改的意味，而不在正文中把含义限定为“悔改”。
- source_word: וְשָׁמַעְתָּ בְּקוֹל יְהוָה
  choice: 听从耶和华的声音
  rationale: שׁמע בְּקוֹל直译为“听……的声音”，在申命记的盟约语境中通常包含顺从之意。“听从……的声音”兼顾希伯来语意象和服从的语用含义，也与下一分句“遵行”保持区别。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文读者熟悉的神圣名字音译，保留专名性质，而不以“主”这一称号替代。
- source_word: וְעָשִׂיתָ
  choice: 遵行
  rationale: עָשָׂה基本义为“做、实行”；以诫命为宾语时，“遵行”是自然庄重的现代汉语，并准确表达把命令付诸实行。
- source_word: כָּל מִצְוֺתָיו
  choice: 他的一切诫命
  rationale: 保留“全部”以及第三人称单数后缀；“诫命”符合申命记的盟约和律法语域。
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: 就是我今天吩咐你的
  rationale: “就是”自然引出修饰“诫命”的关系分句；保留“今天”这一申命记中强调当下盟约责任的重要表达。
theological_decisions:
- issue: 是否把שׁוּב明确译成“悔改”
  choice: 回转
  alternative: 悔改；返回
  rationale: 本节处于复兴、归回和重新顺服的语境中，可能具有盟约性悔改的含义；但原词本身也可指返回。“回转”保留实际归回、盟约回归与悔改之间的张力。
- issue: 是否把שׁמע בְּקוֹל只译为“顺服”
  choice: 听从耶和华的声音
  alternative: 顺服耶和华；听耶和华的声音
  rationale: 该惯用语确实含有顺服之意，但下一分句又明确说“遵行”诫命。正文保留“声音”的希伯来语意象，同时用“听从”传达顺服意味，避免把两个相关但有区别的表达合并。
- issue: 连续完成式的语气
  choice: 要回转……听从……遵行
  alternative: 将回转……听从……遵行
  rationale: 上下文可带预告性，但这些形式也呈现恢复后应有的行动。“要”在中文中保留将来趋向与责任意味，不把句子单纯限定为预测或命令。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“回转”保留原文的多义性；“听从……的声音”兼顾源语形式与中文可懂度；句式简洁，并保留申命记盟约宣告的郑重语气。
