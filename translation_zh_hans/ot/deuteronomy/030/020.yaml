base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/020.yaml
  text: by loving Yahweh your God[a], by listening to his voice, and by holding fast to him; for he is your life and the length of your days, that you may dwell on the land that Yahweh swore to your fathers, to Abraham, to Isaac, and to Jacob[c][b], to give to them.
translation:
  language: zh_hans
  text: 要爱耶和华你的上帝，听从他的声音[a]，紧紧依附他[b]；因为他是你的生命，也是你年日的长久，使你得以住在耶和华向你列祖[c]亚伯拉罕、以撒和雅各起誓要赐给他们的土地上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“听从他的话”。直译为“听他的声音”；这个希伯来语说法通常包含留意并顺服的意思。
    reason: lexical_alternative
  - marker: b
    text: 或译：“紧紧持守他”或“与他紧密相连”。
    reason: lexical_alternative
  - marker: c
    text: “列祖”也可译为“祖先”；原文随后明确列出亚伯拉罕、以撒和雅各。
    reason: lexical_alternative
lexical_decisions:
- source_word: לְאַהֲבָה אֶת־יְהוָה אֱלֹהֶיךָ
  choice: 要爱耶和华你的上帝
  rationale: 不定式承接上一节“选择生命”的劝告，说明其具体内容；汉语用“要爱”比机械重复“借着”更自然，也保留劝勉语气。神名按其希伯来语专名音译为“耶和华”。
- source_word: לִשְׁמֹעַ בְּקֹלוֹ
  choice: 听从他的话
  rationale: שׁמע בקול 是听见并留意、顺从的惯用语；“听从他的话”既表达顺服含义，也保留听取话语的意象。
- source_word: וּלְדָבְקָה־בוֹ
  choice: 紧紧依附他
  rationale: דבק 表示贴近、依附并忠贞持守；“紧紧依附”保留关系性和盟约忠诚的意味，且符合现代汉语。
- source_word: כִּי הוּא חַיֶּיךָ
  choice: 因为他就是你的生命
  rationale: 人称代词 הוּא 最自然地回指耶和华；直译保留强烈的神学表述，不扩写为“生命的源头”。
- source_word: וְאֹרֶךְ יָמֶיךָ
  choice: 也使你长寿
  rationale: 希伯来语名词短语直译为“你年日的长久”在现代汉语中生硬；按其功能译为“使你长寿”，同时不把它泛化为抽象福分。
- source_word: לָשֶׁבֶת עַל־הָאֲדָמָה
  choice: 使你可以住在……土地上
  rationale: 不定式可表达目的或结果；“使你可以住在”在汉语中自然地连接生命、长寿与居住应许之地。אדמה 在此指所应许的地域，译作“土地”。
- source_word: לַאֲבֹתֶיךָ
  choice: 向你列祖
  rationale: 下文明确列出亚伯拉罕、以撒、雅各三位男性先祖，因此保留传统且准确的“列祖”。
- source_word: לָתֵת לָהֶם
  choice: 要赐给他们
  rationale: 保留“给他们”的复数代词以及誓言的授予内容；“赐给”符合上帝赐地语境。
theological_decisions:
- issue: “他就是你的生命”中“他”的所指
  choice: 指耶和华本人
  alternative: 泛指前述爱、听从和依附的盟约生活方式
  rationale: 语法上最近且最显著的单数阳性先行词是耶和华；保留“他就是你的生命”的直接表述，同时不另加解释以排除其与顺服生活的语境关联。
- issue: 长寿与住在应许之地的关系
  choice: 译为上帝是生命并使人长寿，使其得以住在那地
  alternative: 将“年日的长久”与“生命”并列，都直接作为上帝的身份谓语
  rationale: 希伯来语省略系词，形式上可直读为“他是你的生命和你年日的长久”；汉语若说“他是你年日的长久”极不自然，因此以使役表达其实际含义，但不将应许绝对化或脱离盟约语境。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“耶和华”保留神的专名；“上帝”用于 אֱלֹהִים。句法适度重组，以免希伯来语连续不定式和名词谓语在汉语中显得生硬；所有脚注标记均置于其所说明的词语之后。
