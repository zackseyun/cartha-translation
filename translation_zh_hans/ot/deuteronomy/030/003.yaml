base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/003.yaml
  text: then Yahweh your God will restore your fortunes and have compassion on you[c][b][a], and he will gather you again from all the peoples where Yahweh your God has scattered you.
translation:
  language: zh_hans
  text: 那时，耶和华你的神必恢复你的境况[a]，怜悯你；他必再次[b]从耶和华你的神所驱散你到的各民族[c]中召聚你。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“使你被掳的境况归回”。原文是希伯来语惯用语，字面近于“使你的被掳归回”，指使人脱离困境或流亡，恢复其境况。
    reason: lexical_alternative
  - marker: b
    text: 或译：“他必回转，召聚你。”
    reason: alternative_reading
  - marker: c
    text: 或译：“列国”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的专名形式，明确保留以色列之神的盟约名，而不以“主”代替。
- source_word: שָׁב אֶת־שְׁבוּתְךָ
  choice: 扭转你的境况
  rationale: 这是表示困境、流亡状态得到逆转的希伯来语惯用语；此译既传达复兴之意，也避免与下文具体的召聚行动重复。
- source_word: וְרִחֲמֶךָ
  choice: 怜悯你
  rationale: 简洁表达 רחם 所含富于情感的慈悲与眷顾，符合庄重而自然的现代中文。
- source_word: וְשָׁב
  choice: 再次
  rationale: 这里可把 שָׁב 理解为修饰下一个动词，表示神要再次召聚百姓；正文采用较流畅的这一理解，同时以脚注保留“回转”的句法可能。
- source_word: וְקִבֶּצְךָ
  choice: 召聚你
  rationale: קבץ 在流散复归语境中指把分散的人聚集回来；“召聚”兼具自然度和庄重感。
- source_word: מִכָּל הָעַמִּים
  choice: 从……所有民族中
  rationale: עַמִּים 指复数的人群或民族；“所有民族”较贴近其群体意义，“列国”则作为脚注中的可选译法。
- source_word: הֱפִיצְךָ
  choice: 把你驱散
  rationale: פוץ 的使役形表示使之分散；“驱散”在流亡语境中比单纯“分散”更鲜明地体现这一行动。
- source_word: שָׁמָּה
  choice: 到的
  rationale: 原词字面为“那里”，在关系从句中以“把你驱散到的”自然表达其地点指向。
theological_decisions:
- issue: שׁוּב אֶת־שְׁבוּת 的惯用含义
  choice: 扭转你的境况
  alternative: 使你的被掳归回；带回你被掳的人
  rationale: 该短语主要描写百姓困苦或流亡处境的逆转。译作“带回你被掳的人”会把宾语具体化为俘虏，而下半节已经另行说明从各民族中召聚百姓，因此不在正文中作此限定。
- issue: 第二个 וְשָׁב 的句法作用
  choice: 他必再次……召聚你
  alternative: 他必回转，召聚你
  rationale: 希伯来文既可理解为独立动词“回转”，也可理解为与后面的召聚相连，表达“再次”。正文选择较自然的后一种译法，但不排除前一种分析。
translation_notes:
  register: 采用庄重、清晰的现代标准普通话。“扭转你的境况”自然表达希伯来语复兴惯用语；分号保留本节两个相关而有区别的应许。正文中的脚注标记按出现顺序排列，并紧邻相应词语。
