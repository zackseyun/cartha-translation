base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/012.yaml
  text: It is not in heaven[a], that you should say, ‘Who will go up to heaven for us and get it for us and make us hear it, so that we may do it?’
translation:
  language: zh_hans
  text: 它不在天上[a]，你不必说：‘谁能替我们上到天上，把它取来给我们，使我们听见它，好让我们遵行它呢？’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “天上”所译的希伯来词在形式上为复数，也可译作“诸天”。
    reason: 保留原文数形与汉语惯用表达之间的差异。
lexical_decisions:
- source_word: בַשָּׁמַיִם
  choice: 在天上
  rationale: שָׁמַיִם在形式上为复数，但现代汉语通常用“天上”表达这里与近在身边相对的高天领域，既自然又保留空间对比。
- source_word: הִוא
  choice: 它
  rationale: 阴性单数代词回指上文的“诫命”；汉语以“它”自然承接，而不重复补出名词。
- source_word: לֵאמֹר
  choice: 以致你说
  rationale: 该不定式引出假设中的话语；“以致你说”贴合“不在天上”之后的句法关系，也不把它过度解释为明确的目的。
- source_word: מִי יַעֲלֶה לָּנוּ
  choice: 谁能替我们升上去
  rationale: עלה表示向上移动，לָנוּ带有为我们、替我们的受益含义；结合后面的目的地，在正文中译作“替我们升到天上”。“能”符合汉语反问语气，并表达所设想任务的不可企及性。
- source_word: הַשָּׁמַיְמָה
  choice: 到天上
  rationale: 方向词尾-ה表示朝向某处，故译为“到天上”。
- source_word: וְיִקָּחֶהָ לָּנוּ
  choice: 把它取来给我们
  rationale: לקח基本义为拿、取；在从天上取得并带给百姓的语境中，“取来给我们”清楚保留动作和受益对象。
- source_word: וְיַשְׁמִעֵנוּ אֹתָהּ
  choice: 使我们听见
  rationale: שמע的使役式直译为“使我们听见”；保留使役力量，不进一步解释为“宣讲”。
- source_word: וְנַעֲשֶׂנָּה
  choice: 好让我们照着行
  rationale: עשה在诫命语境中指实行、遵行。“照着行”自然表达以所听见的内容为行动准则，“好让”体现此处的目的或结果关系。
theological_decisions:
- issue: 阴性代词所指
  choice: 以“它”回指上文的诫命
  alternative: 在正文补译为“这诫命”或“这话”
  rationale: 希伯来文只用代词，所指可由上下文确定；保留代词可避免在本节中额外限定为“诫命”或“话”，同时维持原文的衔接。
- issue: “行”的含义
  choice: 照着行
  alternative: 遵守它／实行它
  rationale: 原文עשה本义宽泛，语境中带有遵行命令之意；“照着行”既传达顺服实践，也不加入特定宗派术语。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。问句用“谁能……呢”呈现假设性反问；“取来给我们”“使我们听见”“照着行”依次保留原文的动作链条。
