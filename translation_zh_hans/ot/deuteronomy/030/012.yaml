  naturalness: 除“以致你说”外，句子总体庄重自然。“你不必说”更符合现代标准汉语，也使引号内的反问与前句衔接清楚。
  terminology: “天上”“取来给我们”“使我们听见它”“遵行它”均能恰当对应原文；“遵行”在诫命语境中是中性、自然的现代书面语。脚注准确说明希伯来语形式复数与汉语惯用译法的差别。
