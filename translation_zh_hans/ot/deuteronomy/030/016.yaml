  text: אֲשֶׁ֨ר אָנֹכִ֣י מְצַוְּ/ךָ֮ הַ/יּוֹם֒ לְ/אַהֲבָ֞ה אֶת יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ לָ/לֶ֣כֶת בִּ/דְרָכָ֔י/ו וְ/לִ/שְׁמֹ֛ר מִצְוֺתָ֥י/ו וְ/חֻקֹּתָ֖י/ו וּ/מִשְׁפָּטָ֑י/ו וְ/חָיִ֣יתָ וְ/רָבִ֔יתָ וּ/בֵֽרַכְ/ךָ֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ בָּ/אָ֕רֶץ אֲשֶׁר אַתָּ֥ה בָא שָׁ֖מָּ/ה לְ/רִשְׁתָּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/016.yaml
  text: 'which I am commanding you today: to love Yahweh your God[a], to walk in his ways, and to keep his commandments, his statutes, and his judgments, so that you may live and multiply[d][c][b], and Yahweh your God may bless you in the land that you are entering there to possess it.'
translation:
  language: zh_hans
  text: 就是我今天所吩咐你的：要爱耶和华你的神，行在他的道路上，谨守他的诫命、律例和典章[a]；这样，你就得以存活、繁衍增多[b]，耶和华你的神也必在你将要进入并取得为业的那地上赐福给你[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “典章”也可译作“法令”或“裁断”。
    reason: מִשְׁפָּטָיו可指司法裁断，也可指法律规定或规范；“典章”在此概括其法律语境中的含义。
  - marker: b
    text: 也可译作：“你必存活、繁衍增多；耶和华你的神也必赐福给你。”希伯来文的动词次序可理解为遵命所带来的结果，也可理解为未来的应许。
    reason: 保留希伯来文连续动词在结果与未来应许之间的句法／语义弹性。
  - marker: c
    text: “取得为业”也可译作“占有”或“承受为业”。
    reason: לְרִשְׁתָּהּ在土地应许语境中可指取得、占有，并带有承受产业的意味。
lexical_decisions:
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: 就是我今天所吩咐你的
  rationale: 本节承接上一节，אֲשֶׁר引出所吩咐的内容；用“就是”保留承接关系，同时使现代汉语自然。分词מְצַוְּךָ在此表达当前郑重的吩咐。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代简体中文圣经读者熟悉的专名“耶和华”呈现四字神名，而不以称号替代。
- source_word: לָלֶכֶת בִּדְרָכָיו
  choice: 遵行他的道路
  rationale: 保留“道路”的生活行为隐喻；“遵行”比直译“行走在”更符合自然汉语，也表达按其道路生活。
- source_word: לִשְׁמֹר
  choice: 谨守
  rationale: 在盟约和律法语境中，“谨守”兼具留心持守与切实遵行之意。
- source_word: מִצְוֺתָיו וְחֻקֹּתָיו וּמִשְׁפָּטָיו
  choice: 他的诫命、律例和典章
  rationale: 分别保留三个法律词汇的区分；“典章”自然承载מִשְׁפָּט的司法裁定及规范含义。
- source_word: וְחָיִיתָ וְרָבִיתָ
  choice: 这样，你就可以存活，人数增多
  rationale: 将连续式动词理解为遵命后的结果，但用“可以”保留结果与应许之间的语义张力；“人数增多”明确רבה在此指人口繁衍。
- source_word: לְרִשְׁתָּהּ
  choice: 取得为业
  rationale: ירש在土地应许语境中不只是一般占有，也含承受产业之意；“取得为业”兼顾进入占有和产业色彩。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用神的专名；正文保留专名而不译作“主”。“耶和华”是现代标准汉语圣经传统中最广为普通读者识别的形式。
- issue: וְחָיִיתָ וְרָבִיתָ וּבֵרַכְךָ这一动词序列的关系
  choice: 译为遵命所带来的结果，并保留应许语气
  alternative: 直译为“你必存活，人数增多，耶和华……必赐福给你”
  rationale: 上下文容许目的／结果和未来应许两种理解；“这样……就可以……也会”不把其中一种语法功能绝对化。
- issue: 土地动词ירש的含义
  choice: 取得为业
  alternative: 占有；承受
  rationale: 该词兼具取得、占有以及在土地应许中承受产业的色彩，正文采用可同时体现这些层面的表达。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“诫命、律例、典章”保留申命记的盟约法律语域；结尾将希伯来文“你要进去那里取得它”自然化为“你将要进去取得为业的那片土地”，未另译方向副词“那里”，因其指向已由关系从句清楚表达。
