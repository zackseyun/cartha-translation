  to: 就是我今天所吩咐你的：要爱耶和华你的神，行在他的道路上，谨守他的诫命、律例和典章[a]；这样，你就得以存活、繁衍增多[b]，耶和华你的神也必在你将要进入并取得为业的那地上赐福给你[c]。
