  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וּ/מָ֨ל יְהוָ֧ה אֱלֹהֶ֛י/ךָ אֶת לְבָבְ/ךָ֖ וְ/אֶת לְבַ֣ב זַרְעֶ֑/ךָ לְ/אַהֲבָ֞ה אֶת יְהוָ֧ה אֱלֹהֶ֛י/ךָ בְּ/כָל לְבָבְ/ךָ֥ וּ/בְ/כָל נַפְשְׁ/ךָ֖ לְמַ֥עַן חַיֶּֽי/ךָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/006.yaml
  text: And Yahweh your God will circumcise your heart and the heart of your offspring[a], so that you may love Yahweh your God with all your heart and with all your soul[c][b], so that you may live.
translation:
  language: zh_hans
  text: 耶和华你的上帝必给你的心和你后裔的心施行割礼[a][b]，为要使你全心全性地爱耶和华你的上帝，好让你得以存活[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “后裔”也可译作“子孙”；原文是集合意义的单数“种子、后代”。
    reason: lexical_alternative
  - marker: b
    text: “给心施行割礼”是比喻，指上帝使人内在更新，并专心忠于盟约。
    reason: cultural_note
  - marker: c
    text: “性”所译的希伯来词也可指“生命”或“整个自己”；这里表示以全人来爱上帝。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָל
  choice: 必……行割礼
  rationale: מול本义为“行割礼”。此处以“心”为对象，显然是比喻，却仍承载盟约记号的意象，因此正文保留“行割礼”，不改写为“改变”或“洁净”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代简体中文读者熟悉的专名“耶和华”对应四字神名，保留其作为上帝名字而非称号的性质。
- source_word: אֱלֹהֶיךָ
  choice: 你的上帝
  rationale: 准确表达第二人称阳性单数领属形式，并保持盟约语境中的直接称呼。
- source_word: לְבָבְךָ
  choice: 你的心
  rationale: לֵבָב在本节指人的内在，包括意志、情感和思想；“心”既自然，又能保留原文宽广的含义。
- source_word: לְבַב זַרְעֶךָ
  choice: 你后裔的心
  rationale: זֶרַע在此为集合用法，指“后裔、子孙”；“后裔”简洁地保留跨世代含义，而“心”依原文使用单数集合表达。
- source_word: לְאַהֲבָה
  choice: 使你……爱
  rationale: 带ל的动词不定式在此表示目的或结果；“使你……爱”自然承接上帝所施行的内在行动，同时不强行排除目的与结果之间的张力。
- source_word: בְּכָל לְבָבְךָ וּבְכָל נַפְשְׁךָ
  choice: 尽心、尽性
  rationale: 这是现代中文圣经语体中自然、凝练而庄重的表达，传达全然委身；脚注说明נֶפֶשׁ也可指整个生命或整个人。
- source_word: לְמַעַן חַיֶּיךָ
  choice: 好让你存活
  rationale: לְמַעַן可表达目的或结果。“好让你存活”符合中文习惯，并保留生命得以延续的意思。
theological_decisions:
- issue: 给心行割礼的盟约比喻
  choice: 正文保留“给……心行割礼”
  alternative: 改变你的心；洁净你的心；除去你心中的顽梗
  rationale: 原文借身体上的盟约记号描写上帝所成就的内在更新。保留比喻可维持外在记号与内在忠诚之间的神学联系，又不将其限定为某一后来的教义体系。
- issue: נֶפֶשׁ在爱上帝公式中的含义
  choice: 译作“性”，构成“尽心、尽性”
  alternative: 生命；全人；自己
  rationale: נֶפֶשׁ可指生命或整个活着的人。“尽心、尽性”在中文中能表达全然的爱与委身；脚注保留其“全部生命、整个自己”的语义范围，避免把它窄化为与身体分离的灵魂观。
- issue: 目的与结果的关系
  choice: 分别译作“使你……”和“好让你……”
  alternative: 为要；以致；因此
  rationale: 两个结构都容许目的与结果相互交织。中文措辞传达方向和结果，却不把原文严格归入单一逻辑类别。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。保留“心行割礼”这一关键盟约意象，并用脚注解释；“尽心、尽性”延续中文读者熟悉的申命记表达，同时说明“性”的全人、生命含义。标点和句式力求朗读顺畅。
