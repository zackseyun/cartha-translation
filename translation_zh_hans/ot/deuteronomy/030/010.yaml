base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/010.yaml
  text: if you obey the voice of Yahweh your God[a], keeping his commandments and his statutes that are written in this book of the law[b], if you return to Yahweh your God with all your heart and with all your soul.
translation:
  language: zh_hans
  text: 如果你听从耶和华你上帝的话[a]，谨守他写在这律法书上的诫命和律例，如果你全心全意归向耶和华你的上帝[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“听耶和华你上帝的声音”；这是一个习语，意思是留心并服从他所说的话。
    reason: lexical_alternative
  - marker: b
    text: “归向”也可译为“转回”或“悔改”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 如果
  rationale: 本节承接上文的应许，两个 כִּי 平行引出条件；译作“如果”最符合这里的句法和语篇关系。
- source_word: תִשְׁמַע בְּקוֹל
  choice: 听从……的话
  rationale: 该希伯来语习语不只是听见声音，而是留心并顺服所说的话；“听从……的话”既自然，也保留了听与服从的语义联系。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代简体中文读者熟悉的形式音译上帝的专名，避免用头衔替代原文专名。
- source_word: אֱלֹהֶיךָ
  choice: 你的上帝
  rationale: 准确表达第二人称单数所属关系，并采用现代标准汉语中清楚自然的称谓。
- source_word: לִשְׁמֹר
  choice: 谨守
  rationale: 在本句中说明听从的具体表现或内容；“谨守”符合盟约律法语境，并表达认真遵行之意。
- source_word: מִצְוֺתָיו
  choice: 他的诫命
  rationale: “诫命”是 מִצְוָה 在律法语境中的准确、庄重而通行的译法。
- source_word: חֻקֹּתָיו
  choice: 他的律例
  rationale: “律例”可与“诫命”相区分，并准确传达 חֻקִּים 所指的规定、法令。
- source_word: הַכְּתוּבָה
  choice: 写在……上的
  rationale: 原文为阴性单数分词，可能在语法上就近修饰“律例”，也可能概括前面的两类命令；中文采取自然的合并修饰方式，但以脚注说明原文形式。
- source_word: בְּסֵפֶר הַתּוֹרָה הַזֶּה
  choice: 在这律法书上
  rationale: 忠实表达盟约文献的称呼；“书”在现代中文中比“书卷”更自然，同时不妨碍其古代卷轴形态。
- source_word: כִּי תָשׁוּב
  choice: 如果你……归向
  rationale: 第二个 כִּי 与前一个平行，继续表达条件；שׁוּב 的基本意象是转回、返回，此处用“归向”保留关系性和盟约性的回转含义，而不直接释义为“悔改”。
- source_word: בְּכָל לְבָבְךָ וּבְכָל נַפְשֶׁךָ
  choice: 全心全意
  rationale: 这是现代汉语中自然且完整的整体性表达，对应“用你全部的心和全部的生命/自我”；脚注保留较直译的措辞。
theological_decisions:
- issue: 盟约语境中 שׁוּב 的译法
  choice: 归向
  alternative: 转回；悔改
  rationale: “归向”保留原文转身返回上帝的空间与关系意象，也能承载悔改含义，却不把该动词直接化约为抽象神学术语。
- issue: 全人委身表达中 נֶפֶשׁ 的处理
  choice: 与 לֵבָב 合译为“全心全意”
  alternative: 用你全部的心、全部的生命；尽心尽性
  rationale: 这里强调全人的归向。“全心全意”在现代汉语中最自然，但 נֶפֶשׁ 的“生命、自己、整个人”范围无法由单一汉语词完全重现，因此以脚注保留其字面结构与语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。用分号呈现两个平行条件，保留本节作为承接上文的从属结构，不擅自补出主句。神名 יְהוָה 译作“耶和华”。所有脚注标记均已置于正文相应位置。
