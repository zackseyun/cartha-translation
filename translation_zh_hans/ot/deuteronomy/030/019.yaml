  text: הַעִידֹ֨תִי בָ/כֶ֣ם הַ/יּוֹם֮ אֶת הַ/שָּׁמַ֣יִם וְ/אֶת הָ/אָרֶץ֒ הַ/חַיִּ֤ים וְ/הַ/מָּ֨וֶת֙ נָתַ֣תִּי לְ/פָנֶ֔י/ךָ הַ/בְּרָכָ֖ה וְ/הַ/קְּלָלָ֑ה וּ/בָֽחַרְתָּ֙ בַּֽ/חַיִּ֔ים לְמַ֥עַן תִּחְיֶ֖ה אַתָּ֥ה וְ/זַרְעֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/019.yaml
  text: 'I call heaven and earth to witness against you today: I have set before you life and death[a], blessing and curse. Choose life, so that you and your offspring may live[c][b],'
translation:
  language: zh_hans
  text: 我今天呼唤天和地来作证，作不利于你们的见证：我把生命和死亡、祝福和咒诅摆在你们面前。你们要选择生命，好使你们和你们的后代得以存活。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַעִידֹתִי בָכֶם
  choice: 我……呼唤……作证，指证你们
  rationale: 使役式在此具有法律和盟约语境中的传证意味；בָכֶם 表明见证对受话者不利。“呼唤……作证，指证你们”兼顾使役结构和司法色彩。
- source_word: הַיּוֹם
  choice: 今天
  rationale: 自然、现代，并保留原文的时间强调。
- source_word: אֶת הַשָּׁמַיִם וְאֶת הָאָרֶץ
  choice: 天和地
  rationale: 这是表示整体受造界的固定搭配，也是盟约见证公式；现代汉语以“天和地”表达自然。
- source_word: הַחַיִּים וְהַמָּוֶת
  choice: 生命和死亡
  rationale: 直接保留盟约结果之间的鲜明对照。
- source_word: נָתַתִּי לְפָנֶיךָ
  choice: 我把……摆在你们面前
  rationale: נתן 与 לִפְנֵי 连用表示把选项陈列在某人面前；“摆在……面前”自然且准确。
- source_word: הַבְּרָכָה וְהַקְּלָלָה
  choice: 祝福和咒诅
  rationale: 保留两个单数抽象名词及其盟约性对比；“咒诅”较“诅咒”更具庄重经文语体，同时仍为现代读者所理解。
- source_word: וּבָחַרְתָּ בַּחַיִּים
  choice: 你们要选择生命
  rationale: 连接词在连续劝告中自然转为命令；不额外加入“因此”，避免把原文仅含蓄的逻辑关系明说。
- source_word: לְמַעַן תִּחְיֶה
  choice: 好使……都能存活
  rationale: “好使”保留目的或结果意味；“存活”在生命与死亡的语境中比泛指生活状态的“活着”更明确。
- source_word: אַתָּה וְזַרְעֶךָ
  choice: 你们和你们的后代
  rationale: זֶרַע 字面为“种子”，在此指延续的子孙后代。汉语复数代词自然体现摩西对以色列群体的代表性单数称呼。
theological_decisions:
- issue: 盟约见证与司法框架
  choice: 采用“呼唤天和地作证，指证你们”
  alternative: 我今天以天和地为证警告你们
  rationale: 原文不是一般性的警告，而是在盟约环境中召唤天地作不利于受话者的见证；译文保留这种司法张力，不引入后来的教义解释。
- issue: 第二人称阳性单数的代表性用法
  choice: 按自然汉语译作复数“你们”
  alternative: 保持不标数的“你”或明说“以色列”
  rationale: 希伯来文以单数把以色列作为盟约整体来称呼。现代汉语若用单数“你”，容易被误解为只对一个人说；复数更清楚地传达实际受众，同时不改变其集体责任。
- issue: 选择与存活之间的关系
  choice: 保留“好使”所表达的目的或结果，不进一步界定
  alternative: 译为确定因果：“这样你们就必存活”
  rationale: לְמַעַן 可表达目的并兼具结果意味。译文不把它强化为绝对应许，也不削弱这项劝告与盟约后果的紧密联系。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留“祝福和咒诅”的盟约语汇及“天地作证”的法律色彩；避免“兹”“今日”等古雅表达。主文所有脚注标记均已出现。
