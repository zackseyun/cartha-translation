base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/007.yaml
  text: And Yahweh your God will put all these curses on your enemies and on those who hate you[a], who pursued you.
translation:
  language: zh_hans
  text: 雅威你的上帝要把这一切咒诅加在你的仇敌和那些恨你、追赶你的人身上。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “咒诅”或译“誓言”；在《申命记》中，这个词通常指盟约的咒诅或制裁。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַן
  choice: 要把……加在……身上
  rationale: נתן本义范围包括“给、放、置于”；与“咒诅”和介词עַל连用时，译作“把……加在……身上”符合现代汉语，也准确表达使咒诅临到某人的意思。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名“耶和华”音译四字神名，保留原文使用上帝盟约之名，而不以称号替代。
- source_word: אֱלֹהֶיךָ
  choice: 你的上帝
  rationale: 准确体现带第二人称阳性单数后缀的所属关系；“上帝”是现代标准汉语中自然、庄重的称谓。
- source_word: כָּל הָאָלֹות הָאֵלֶּה
  choice: 这一切咒诅
  rationale: אָלָה虽可指“誓言”，但在《申命记》此处的盟约语境中指此前宣告的盟约咒诅或制裁；“这一切咒诅”承接上下文最清楚。
- source_word: עַל אֹיְבֶיךָ וְעַל שֹׂנְאֶיךָ
  choice: 加在你的仇敌和那些恨你……的人身上
  rationale: עַל标明咒诅临到的对象；“仇敌”和“那些恨你的人”既保留两项并列，也使分词שֹׂנְאֶיךָ在汉语中自然。
- source_word: אֲשֶׁר רְדָפוּךָ
  choice: 追赶你
  rationale: 保留רדף的基本意义“追赶、追逐”，不预先限定为更具解释性的“迫害”；关系从句同时可自然修饰前面的敌对者。
theological_decisions:
- issue: 四字神名יהוה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用神的专名。中文正文采用广为人知且庄重的音译“耶和华”，既不以“主”替换专名，也便于普通现代读者辨认。
- issue: 盟约语境中אָלָה的含义
  choice: 咒诅
  alternative: 誓言
  rationale: 该词本身可涉及誓言，但本节回指此前盟约中的不利制裁，因此正文译“咒诅”；脚注保留较宽的词义及其盟约背景。
- issue: 关系从句אֲשֶׁר רְדָפוּךָ的修饰范围
  choice: 译为“那些恨你、追赶你的人”，使“追赶你”直接与“恨你的人”连结
  alternative: 理解为概括前述“仇敌”和“恨你的人”两类人
  rationale: 希伯来语关系词紧接“恨你的人”，语法上最自然地与之相连；但语义上也可能概括整个并列表达，中文不另加排他性措辞，以免过度限定。
translation_notes:
  register: 采用现代、庄重且易懂的标准普通话。“要把……加在……身上”保持原文施加咒诅的结构；“追赶”保留词义宽度，避免用“迫害”过度解释。脚注标记置于整句末尾，并在脚注中说明אָלָה的词义可能性。
