  text: For the word is very near you[a], in your mouth and in your heart, so that you may do it.
translation:
  language: zh_hans
  text: 因为这话[a]离你很近，就在你口中，也在你心里，以便你遵行。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “这话”也可译作“这事”或“这诫命”。希伯来语 דָּבָר 可按语境表达这些含义。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 此处引出对上文的解释和依据；“因为”自然地保留这一逻辑联系。
- source_word: קָרוֹב אֵלֶיךָ
  choice: 离你很近
  rationale: 直接表达与受话者之间的距离很近，符合现代汉语习惯。
- source_word: הַדָּבָר
  choice: 这话
  rationale: דָּבָר 可指“话”“事情”或“诫命”。上下文所指是摩西论述的诫命，但主文本用“这话”既承接上下文，又保留原词较宽的语义。
- source_word: מְאֹד
  choice: 很
  rationale: 准确表达程度上的加强，与“近”搭配自然。
- source_word: בְּפִיךָ
  choice: 在你口中
  rationale: 保留原文具体的身体意象，以及“口”与“心”的平行结构。
- source_word: וּבִלְבָבְךָ
  choice: 也在你心里
  rationale: “心”保留 לֵבָב 所指内在思想、意愿和意志的丰富含义，并与“口中”形成平行。
- source_word: לַעֲשֹׂתוֹ
  choice: 好让你遵行
  rationale: ל 加不定式在此表达目的或结果。“好让”清楚传达这一关系；“遵行”比泛泛的“做”更自然地表达对这话付诸实行。
theological_decisions:
- issue: “这话”的具体所指
  choice: 主文本译作“这话”，不限定为“诫命”
  alternative: “这诫命”或“这事”
  rationale: 上下文确实涉及上帝的诫命，但本节使用语义范围更广的 דָּבָר。保留“话”可避免把原文含义不必要地收窄。
- issue: 口、心与行动之间的关系
  choice: 以“好让你遵行”保留目的或结果关系
  alternative: “可以遵行”或“为要遵行”
  rationale: 原文不定式结构把话在口中、心里与实际遵行紧密联系起来，却未进一步界定这种联系的系统神学性质，因此译文不作额外解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“就在……也在……”呈现原文的平行和强调；“口中”“心里”保留其具体意象。
