  text: then the young woman’s father and her mother shall take and bring out the evidence of the young woman’s virginity to the elders of the city at the gate[a].
translation:
  language: zh_hans
  text: 那么，年轻女子的父亲和母亲就要取出她童贞的凭证，带到城门那里，交给城里的长老[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “童贞的凭证”原文字面意思是“年轻女子的童贞（复数）”，是本段中为证明她保持童贞而呈交的凭证。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַח אֲבִי הַנַּעַר וְאִמָּהּ
  choice: 年轻女子的父母要把……
  rationale: 原文直译为“年轻女子的父亲和她的母亲就要拿……”。现代汉语以“父母”自然概括二者；“要”表达法律程序中的指令意味。
- source_word: וְהוֹצִיאוּ
  choice: 带到……交给
  rationale: 使役形在这里表示把有关物证拿出来并呈交给长老；结合目的地分成“带到……交给”，符合现代汉语表达，也保留正式呈交的司法语境。
- source_word: אֶת בְּתוּלֵי הַנַּעַר
  choice: 她贞洁的凭证
  rationale: 字面为“年轻女子的贞洁（复数）”，在本法律语境中指用来证明其婚前贞洁的物证。“凭证”既传达证据功能，又避免在正文中过度具体化。
- source_word: אֶל זִקְנֵי הָעִיר
  choice: 交给本城的长老
  rationale: אֶל 表示朝向或对象；“交给”清楚表达向当地长老呈交凭证。“本城”自然传达原文定指的“那城/该城”。
- source_word: הַשַּׁעְרָה
  choice: 到城门口
  rationale: 该词带方向词尾，基本义为“到城门那里”；城门也是古代长老审理事务的公共场所。“城门口”在现代汉语中自然清楚。
