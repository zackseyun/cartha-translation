  text: You shall make tassels for yourself on the four corners of your covering with which you cover yourself[a][b].
translation:
  language: zh_hans
  text: “你要在你用来遮身的衣物四角上，为自己做穗子[a][b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “穗子”也可译作“编成的绳子”或“流苏”。
    reason: lexical_alternative
  - marker: b
    text: “衣物”原文直译为“遮盖物”，也可译作“衣服”或“外衣”。
    reason: lexical_alternative
lexical_decisions:
- source_word: גְּדִלִים
  choice: 穗子
  rationale: 该词指附在衣物边角、下垂的编结物。“穗子”是现代汉语中自然且符合衣物语境的表达；“编绳”“繸子”可作为词义备选。
- source_word: תַּעֲשֶׂה לָּךְ
  choice: 为自己做
  rationale: 未完成式在律法语境中表达命令；לָּךְ表示与本人相关或为本人而做，译作“为自己”保留其语义。
- source_word: עַל אַרְבַּע כַּנְפוֹת
  choice: 在……四角上
  rationale: כָּנָף本义可指“翅膀”或“边缘、末端”，在方形衣物语境中以“四角”最清楚自然。
- source_word: כְּסוּתְךָ
  choice: 你的衣物
  rationale: 该词指用来遮盖身体之物，常指衣服或外衣。“衣物”既符合语境，又不过度限定具体样式。
- source_word: אֲשֶׁר תְּכַסֶּה בָּהּ
  choice: 你用来遮身的
  rationale: 关系从句说明该衣物的用途；“遮身”保留כסה的遮盖含义，并使中文表达简洁自然。
theological_decisions: []
