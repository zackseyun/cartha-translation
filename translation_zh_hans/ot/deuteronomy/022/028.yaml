revisions:
- from: 如果一个男人遇见一个尚未订婚[a]的年轻女子，就是处女，并抓住她[b]，与她同寝，而他们被人发现，
  to: 如果一个男人遇见一名尚未许配[a]的年轻处女，抓住她[b]，与她发生性关系，而他们被人发现，
  rationale: 修订以“尚未许配”准确反映古代婚约的法律性质，并将现代近似说法“尚未订婚”置于脚注。“年轻处女”自然地保留原文的年龄／身份与贞洁两项描述。以“与她发生性关系”清楚传达原文性交惯用语，避免“同寝”可能仅指同睡的歧义；同时仍保留“抓住她”的词汇层面表述，不在正文中预先裁定争议中的法律定性。句末保留逗号，以反映本节句法延续至下一节。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T04:57:32Z'
