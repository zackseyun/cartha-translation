base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/028.yaml
  text: If a man finds a young woman[a], a virgin who is not engaged, and seizes her and lies with her, and they are discovered[b],
translation:
  language: zh_hans
  text: 如果一个男人遇见一名尚未许配[a]的年轻处女，抓住她[b]，与她发生性关系，而他们被人发现，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“尚未订婚”。
    reason: lexical_alternative
  - marker: b
    text: 译作“抓住”的希伯来语动词也可指“握住”或“拿住”。有人认为本句暗示强奸；也有人认为，具体的法律性质必须结合上下文判断，不能单由这个动词确定。
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: 如果
  rationale: 这里引出个案律法的条件句；“如果”符合现代汉语法律条文的表达方式。
- source_word: יִמְצָא
  choice: 遇见
  rationale: 该动词基本义为“找到、遇到”；在此语境中，“遇见”比“找到”更自然，同时未额外加入偶然性。
- source_word: אִישׁ
  choice: 一个男人
  rationale: 保留原文阳性单数所指。
- source_word: נער בְתוּלָה
  choice: 年轻女子，就是处女
  rationale: 原文同时表达年少和处女身份；此译保留两个要素，并避免使用古雅的“童女”或可能显得年龄过小的“女孩”。
- source_word: אֲשֶׁר לֹא אֹרָשָׂה
  choice: 尚未订婚
  rationale: 指女子尚未依法许配。“订婚”是现代读者容易理解的表达，“许配”作为更贴近古代制度的说法列入脚注。
- source_word: וּתְפָשָׂהּ
  choice: 并抓住她
  rationale: תפשׂ 可指抓住、拿住或擒住。“抓住她”保留身体控制或用力抓取的意味，但不把整句直接归并为一个更具体的法律术语。
- source_word: וְשָׁכַב עִמָּהּ
  choice: 与她同寝
  rationale: 保留希伯来语表示性交的惯用委婉表达；现代汉语读者可以理解，语体也庄重。
- source_word: וְנִמְצָאוּ
  choice: 而他们被人发现
  rationale: 原文为复数被动形式，直指两人或此事被发现；“他们被人发现”保留复数与被动语态。
theological_decisions:
- issue: 是否在正文中把行为直接译为“强奸”
  choice: 保留“抓住她，与她同寝”的词汇层面表达
  alternative: 强奸她；拉住她；占有她
  rationale: תפשׂ 本身可表示抓住、握住或拿住，确有身体强制的力度，但是否单凭本节即可使用完整的法律分类词“强奸”，仍涉及与上下文的关系。正文保留原文的动作组合，既不淡化“抓住”的力度，也不替读者消除解释上的张力。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。句式保留个案律法的条件结构，并以逗号结尾，因为本节句法在下一节继续。
