  naturalness: “但这事若属实，没有找到这年轻女子童贞的凭据，”符合现代汉语庄重的法律叙事语体；措辞顺畅，不显生硬。“年轻女子”适切对应 נַעֲרָ，避免对年龄作不必要的缩窄。
