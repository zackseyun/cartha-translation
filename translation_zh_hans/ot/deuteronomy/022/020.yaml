  text: וְ/אִם אֱמֶ֣ת הָיָ֔ה הַ/דָּבָ֖ר הַ/זֶּ֑ה לֹא נִמְצְא֥וּ בְתוּלִ֖ים ל/נער־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/020.yaml
  text: But if this matter is true[a], and evidence of virginity was not found for the young woman,
translation:
  language: zh_hans
  text: 但这事若属实，没有找到这年轻女子童贞的凭据[a]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“没有找到这年轻女子的童贞”。希伯来语 בְּתוּלִים 可指“童贞”，在这里也可指古代法律习俗所认定的童贞迹象或证据。
    reason: 保留原词既可指童贞本身、又可在本语境中指其迹象或凭据的词义幅度。
lexical_decisions:
- source_word: וְאִם
  choice: 但……若
  rationale: 连接词与条件词承接上文并转入相反情形；“但……若”既表达转折，也符合现代汉语法律条件句的语气。
- source_word: אֱמֶת הָיָה הַדָּבָר הַזֶּה
  choice: 这事若属实
  rationale: 原文直译为“这事若是真的／确为真实”。“属实”自然、庄重，也贴合审理指控的语境，没有把 דָּבָר 过度限定为某一类指控。
- source_word: לֹא נִמְצְאוּ
  choice: 没有找到
  rationale: 保留原文被动／结果性的“未被发现”含义；汉语用“没有找到”更自然，并可与后面的“凭据”顺畅搭配。
- source_word: בְּתוּלִים
  choice: 童贞的凭据
  rationale: 该词形式上为复数，可表示童贞，也可在本段古代法律习俗中指被视为童贞的迹象或证据。“童贞的凭据”兼顾上下文所需的证据含义与原词的核心概念。
- source_word: לַנַּעֲרָ
  choice: 这年轻女子
  rationale: נַעֲרָה 指适婚年龄的年轻女子；“年轻女子”比“女孩”更不易造成年龄过小的误解，也比“少女”更中性。介词 ל 在此与“找到……的凭据”合译为所属关系。
theological_decisions:
- issue: 童贞本身与童贞凭据之间的表达张力
  choice: 正文译作“童贞的凭据”
  alternative: “没有发现这年轻女子是处女”或“没有找到这年轻女子的童贞”
  rationale: 上下文涉及提交可供裁断的物证，而 בְּתוּלִים 本身仍可直接表示童贞。正文体现法律语境，脚注保留词义范围；同时不对这种古代习俗所依据的证据是否可靠作现代医学判断。
translation_notes:
  register: 采用现代、庄重而易懂的法律叙事语体。“属实”呼应审理语境；末尾保留逗号，因为本节的条件句在下一节继续。
