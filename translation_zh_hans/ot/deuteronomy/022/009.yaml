  text: לֹא תִזְרַ֥ע כַּרְמְ/ךָ֖ כִּלְאָ֑יִם פֶּן תִּקְדַּ֗שׁ הַֽ/מְלֵאָ֤ה הַ/זֶּ֨רַע֙ אֲשֶׁ֣ר תִּזְרָ֔ע וּ/תְבוּאַ֖ת הַ/כָּֽרֶם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/009.yaml
  text: You shall not sow your vineyard with two kinds of seed[a], lest the whole yield be forfeited—the seed that you sow and the produce of the vineyard.
translation:
  language: zh_hans
  text: 不可在你的葡萄园里混撒两样种子，免得全部出产——你所撒的种子和葡萄园的出产——都成为圣物[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “成为圣物”也可按本条法规理解为“被分别出来，不可供日常使用”；这可能带有被禁用或丧失一般使用权的法律后果。
    reason: 说明 תִּקְדַּשׁ 的字面“成为圣/被分别为圣”及其在禁令语境中可能产生的法律含义，同时不把具体处置方式定为唯一解释。
lexical_decisions:
- source_word: תִזְרַע
  choice: 撒
  rationale: זרע在涉及种子的农业法规中通常指“撒种”；中文用“撒”比泛指栽植的“种植”更准确。
- source_word: כַּרְמְךָ
  choice: 你的葡萄园
  rationale: כרם通常指栽种葡萄的园地；“葡萄园”是自然、明确的现代汉语对应词。
- source_word: כִּלְאָיִם
  choice: 两种不同的种子
  rationale: כלאים指不同种类的禁忌混杂；此处按撒种语境译出不同种类并存的含义，同时避免含混的“杂种”。
- source_word: פֶּן
  choice: 免得
  rationale: פן引出应当避免的负面后果；“免得”符合汉语法规式警告的表达。
- source_word: תִּקְדַּשׁ
  choice: 归为圣物
  rationale: קדש的基本意义是成为圣洁、被分别出来。此处形式为阴性单数，与“全部收成”相应；“归为圣物”保留其宗教法律色彩和解释上的张力，不直接将其限定为“充公”或“禁用”。
- source_word: הַמְלֵאָה
  choice: 全部收成
  rationale: המלאה在此指田地所结出的全部产物或满额收成；“全部收成”自然地表达整体范围。
- source_word: הַזֶּרַע אֲשֶׁר תִּזְרָע
  choice: 你所撒之种的收成
  rationale: 原文直译为“你所撒的种子”，但它与葡萄园出产同属受影响的收成；补出“收成”使汉语关系清楚，同时保留其所指。
- source_word: וּתְבוּאַת הַכָּרֶם
  choice: 和葡萄园的出产
  rationale: תבואה指收成、产物；“葡萄园的出产”准确并保持农业语域。
theological_decisions:
- issue: 纯洁法规语境中 תִּקְדַּשׁ 的含义
  choice: 正文译为“归为圣物”，脚注说明其可能表示从日常用途分别出来、不可再供普通使用。
  alternative: 译为“被没收”“归为禁用”或“成为圣洁”。
  rationale: 希伯来语动词本义与“圣、分别出来”有关，但在这条禁令中具体法律后果并不完全明确。正文保留原文的神圣/分别语义，脚注交代实际可能包含禁用或丧失使用权，避免将一种解释写死，也避免让读者误以为这是对混种作物的褒奖。
translation_notes:
  register: 采用现代、庄重而易懂的法规语体。“不可……免得……”保留禁令与警告结构；插入“就是……”明确“全部收成”所包括的两部分。
