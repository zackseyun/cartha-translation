base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/003.yaml
  text: And so you shall do with his donkey[a], and so you shall do with his cloak, and so you shall do with any lost thing of your brother that is lost from him and you find it; you may not ignore it.
translation:
  language: zh_hans
  text: 他的驴，你要这样处理；他的外衣，你也要这样处理；凡从你弟兄那里遗失而被你找到的东西，你都要这样处理。你不可置之不理。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “置之不理”直译可作“隐藏自己”，也可理解为“假装没有看见”。
    reason: 保留לְהִתְעַלֵּם的字面意象及可能的表达方式。
lexical_decisions:
- source_word: וְכֵן תַּעֲשֶׂה
  choice: 你要这样处理
  rationale: 保留反复出现的法律指令及其承接上文的作用；“处理”自然表达对失物应采取同样行动。
- source_word: לַחֲמֹרוֹ
  choice: 他的驴
  rationale: 直译具体牲畜名称，并承接上一节所说弟兄走失的牲畜。
- source_word: לְשִׂמְלָתוֹ
  choice: 他的外衣
  rationale: שִׂמְלָה通常指穿在外面的衣物；“外衣”具体、自然，又不过度限定款式。
- source_word: לְכָל אֲבֵדַת אָחִיךָ
  choice: 凡从你弟兄那里遗失……的东西
  rationale: “凡……东西”体现כָל的概括范围；保留“弟兄”这一盟约群体中的亲属称谓，不擅自泛化。
- source_word: אֲשֶׁר תֹּאבַד מִמֶּנּוּ
  choice: 从你弟兄那里遗失
  rationale: 保留希伯来文非主动表述及“从他那里”的关系，避免改写成由弟兄主动“弄丢”。
- source_word: וּמְצָאתָהּ
  choice: 而被你找到
  rationale: 准确表达受命者后来发现该失物；采用汉语自然的被动结构，与前面的定语衔接。
- source_word: לֹא תוּכַל לְהִתְעַלֵּם
  choice: 你不可置之不理
  rationale: 在法律语境中表达禁止逃避责任；“置之不理”传达实际语义，脚注保留原文“隐藏自己”的具体意象。
theological_decisions:
- issue: אָחִיךָ在盟约律法语境中的译法
  choice: 你弟兄
  alternative: 你的同胞；你的以色列同胞
  rationale: 原文使用阳性单数亲属称谓，既有群体关系含义，也保留“弟兄”的社会与神学表达；正文不将其解释性泛化。
- issue: לֹא תוּכַל לְהִתְעַלֵּם的法律效力与意象
  choice: 你不可置之不理
  alternative: 你不能隐藏自己；你不可假装没有看见
  rationale: 该结构在此具有禁止的效力，而非单纯陈述能力不足；正文采用自然明确的禁令，脚注说明其较直译的意象，以保留语义张力。
translation_notes:
  register: 采用现代、庄重而通顺的律法文体。三次“这样处理”保留原文反复强调的结构；末句以简明禁令收束。脚注标记置于其所解释的“置之不理”之后。
