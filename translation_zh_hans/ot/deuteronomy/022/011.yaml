  text: 不可穿羊毛和亚麻混合制成的衣服[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文：“沙阿特内兹，羊毛和亚麻在一起。” “沙阿特内兹”是罕见词，指由这两种材料混合制成的织物。
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא תִלְבַּשׁ
  choice: 不可穿
  rationale: 否定词与第二人称未完成式在律法语境中构成禁令；“不可穿”简洁、庄重，也符合现代汉语规范表达。
- source_word: שַׁעַטְנֵז
  choice: 混织的衣服
  rationale: 这是罕见的纺织术语，指后文所说明的羊毛与细麻混合制品；结合动词“穿”，译为“混织的衣服”比音译更易懂。
- source_word: צֶמֶר
  choice: 羊毛
  rationale: 该词在纺织语境中的通常含义是羊毛。
- source_word: וּפִשְׁתִּים
  choice: 和细麻
  rationale: 该词可指亚麻植物或亚麻制品；在衣物语境中，“细麻”自然地表示亚麻纤维或织物。
- source_word: יַחְדָּו
  choice: 混织
  rationale: 原意为“在一起”；在两种衣料的语境中，用“混织”清楚表达二者结合成同一衣物，同时不把禁令泛化为分别搭配穿着。
