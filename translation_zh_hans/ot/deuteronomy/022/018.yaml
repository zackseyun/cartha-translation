  text: Then the elders of that city shall take the man and discipline him,[a]
translation:
  language: zh_hans
  text: 那城的长老要把那人带来，惩戒他。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“管教他”“处罚他”，也可能指“鞭打他”。希伯来语动词含义较宽，表示带有纠正目的的惩处；具体方式须由相关法律语境判断，不能仅凭这个动词确定。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקְחוּ
  choice: 要把……带来
  rationale: לקח的基本义是“取、带”。在这一司法语境中，“带来”自然地表达将当事人置于长老处置之下，又不额外强化为“抓住”或“逮捕”。
- source_word: זִקְנֵי
  choice: 长老
  rationale: 这里指城中具有司法和公共治理职责的领袖，并非泛指年长男子；“长老”能准确表达其制度性身份。
- source_word: הָעִיר הַהִוא
  choice: 那城的
  rationale: 保留定冠词和指示词所表达的特指，并以现代汉语中自然的领属结构呈现。
- source_word: הָאִישׁ
  choice: 那人
  rationale: אִישׁ字面为“男人/人”，上下文所指是前述丈夫。“那人”既承接明确所指，也不把上下文身份直接写入本节。
- source_word: וְיִסְּרוּ אֹתוֹ
  choice: 惩戒他
  rationale: יסר可指管教、训诫或惩罚；在司法语境中，“惩戒”兼具处罚和纠正含义，同时不武断限定为鞭打。
