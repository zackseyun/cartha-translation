base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/017.yaml
  text: and look[a], he has charged her with slanderous words, saying, “I did not find your daughter a virgin.” But these are the proofs of my daughter’s virginity[c][b]. And they shall spread out the garment before the elders of the city.
translation:
  language: zh_hans
  text: “看哪，他竟提出诬蔑她的指控，说：‘我发现你女儿不是处女。’但这些就是证明我女儿是处女的凭据[a]。”于是，他们要把那件衣物[b]展开在城里的长老面前。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“我女儿处女身份的证据”。希伯来语原文使用与“处女身份”有关的复数形式，在这里指用来支持这一主张的凭据。
    reason: lexical_alternative
  - marker: b
    text: 原文所用的词可指衣服、外衣或布料；这里是作为本案证据而展开的那件物品，原文没有进一步说明其具体形制。
    reason: cultural_note
lexical_decisions:
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留引人注意的语篇标记及其指示语气；“看哪”庄重、简洁，也没有将其省略。
- source_word: שָׂם עֲלִילֹת דְּבָרִים
  choice: 用诬蔑的话指控她
  rationale: 该短语是正式提出指控的表达，并含有中伤、诬告的语境色彩；译文兼顾司法语境和诋毁性质。“她”由上下文补出，所指为女儿。
- source_word: לֹא מָצָאתִי לְבִתְּךָ בְּתוּלִים
  choice: 我发现你女儿不是处女
  rationale: 希伯来语直译近于“我没有为你女儿发现处女状态”，是表示丈夫声称她并非处女的习语；中文按自然表达转换否定位置。
- source_word: וְאֵלֶּה בְּתוּלֵי בִתִּי
  choice: 但这些就是我女儿贞洁的凭据
  rationale: בְּתוּלִים 为复数形式，在本案的法律语境中可指与处女身份有关的标志或证据；“凭据”保留其法庭举证功能。“但”表达上下文中对前项指控的反驳。
- source_word: וּפָרְשׂוּ
  choice: 于是，他们要把……铺在
  rationale: 表达随后发生的法律程序；“要”传达程序性动作而不过度强化命令语气。
- source_word: הַשִּׂמְלָה
  choice: 那件衣物
  rationale: 该词可泛指衣服、外衣或布料；“衣物”避免武断地具体化其形制，同时与定冠词所指的特定物件相符。
- source_word: לִפְנֵי זִקְנֵי הָעִיר
  choice: 在城里的长老面前
  rationale: 保留司法场合中把证物呈到城中治理者面前的固定表达。
