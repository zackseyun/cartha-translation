base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/026.yaml
  text: But to the young woman you shall do nothing[a]; the young woman has committed no sin deserving death[b]. For this case is like when a man rises against his neighbor and murders him.
translation:
  language: zh_hans
  text: 但不可对那年轻女子做任何事；那年轻女子没有该判死刑的罪。因为这件事就像一个人起来攻击自己的邻舍，并杀害他一样。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלַנַּעַר
  choice: 但……那年轻女子
  rationale: וְ承接上文并与对男子的处置形成对比，译作“但”。נַעַר在此按上下文所指的已订婚女子理解；“年轻女子”既保留年龄意味，也符合现代汉语。
- source_word: לֹא תַעֲשֶׂה דָבָר
  choice: 不可对……做任何事
  rationale: 保留第二人称法律禁令及绝对禁止采取惩罚行动的语气；“任何事”对应דָבָר。
- source_word: אֵין לַנַּעַר חֵטְא מָוֶת
  choice: 那年轻女子并没有该死的罪
  rationale: 较贴近“没有归于她的死亡之罪”这一希伯来语法律表达，既保留“罪”与“死”的措辞，也自然表达她不负应判死刑的罪责。
- source_word: כַּאֲשֶׁר יָקוּם אִישׁ עַל רֵעֵהוּ
  choice: 就像一个人起来攻击同伴
  rationale: 保留比较结构和“起来攻击”的生动表达；רֵעַ在此指人际法律关系中的同伴或他人。
- source_word: וּרְצָחוֹ נֶפֶשׁ
  choice: 将他杀害
  rationale: רצח指不法杀人，“杀害”比中性的“杀死”更能体现其法律性质，又避免“谋杀”在现代汉语中可能附带的预谋限定。代词所指为前述同伴，נֶפֶשׁ的生命含义自然融入动词。
- source_word: כֵּן הַדָּבָר הַזֶּה
  choice: 这件事……一样
  rationale: 将句末的希伯来语比较结语自然并入汉语的“就像……一样”结构；דָּבָר在这里指眼前案件或事情。
theological_decisions:
- issue: 年轻女子无罪的范围
  choice: 表达她在本案中没有应判死刑的罪责
  alternative: 将其理解为脱离本案法律语境的全面道德无罪
  rationale: “没有该死的罪”在申命记的案例法中首先是司法判断。译文保留“罪”的伦理用语，同时不把经文扩大为超出本案的普遍论断。
- issue: 杀人案件与本案的类比性质
  choice: 保留经文的直接类比，不进一步解释两案在哪一点相似
  alternative: 在正文中明确补出女子遭受强暴如同遭受致命袭击
  rationale: 原文只说“这件事也是如此”，没有逐项阐明类比；正文应保留其简洁和一定程度的开放性。
translation_notes:
  register: 采用现代、庄重而易懂的法律叙述语体。“不可”体现律法禁令，“年轻女子”避免“女孩”可能显得年幼或口语化；整体保留原文对无死罪及杀人类比的司法重点。
