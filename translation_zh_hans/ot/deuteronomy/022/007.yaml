  naturalness: “取来归你自己”在现代汉语中不自然，且“归你自己”与“取来”的搭配生硬。改为“取走归自己”较顺畅；以“幼小的后代”避免将经文限定为已孵化的雏鸟。祝福公式改为“好叫你得福，并得以长寿”，庄重、现代且合乎经文语体。
