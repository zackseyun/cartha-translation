base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/007.yaml
  text: You must surely let the mother go[a], but you may take the young for yourself[c][b], so that it may go well for you and you may prolong your days.
translation:
  language: zh_hans
  text: 你一定要放走母鸟[a]，却可以把幼小的后代取走归自己[b]；好叫你得福，并得以长寿[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语以同根动词重复加强语气，直译近于“放走，务要放走”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“儿子”或“后代”；在这里指鸟巢中的幼小后代，并承接上文所说的蛋或幼雏。
    reason: lexical_alternative
  - marker: c
    text: “得以长寿”原文直译为“延长日子”。
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁלֵּחַ תְּשַׁלַּח
  choice: 一定要放走
  rationale: 希伯来语用不定式绝对形加限定动词来加强命令语气；“一定要”以自然现代汉语保留这种强调。
- source_word: הָאֵם
  choice: 母鸟
  rationale: 原词直译为“母亲”，但上文明确谈到鸟巢；补出“鸟”可避免现代汉语中的歧义。
- source_word: הַבָּנִים
  choice: 幼雏
  rationale: 原义为“儿女、后代”，在鸟巢语境中指鸟的幼小后代；“幼雏”比“儿女”自然。脚注保留原词的字面意义。
- source_word: תִּקַּח לָךְ
  choice: 可以取来归你自己
  rationale: 在先行命令之后，此处表达许可；“归你自己”保留 לָךְ 的受益或归属含义。
- source_word: לְמַעַן יִיטַב לָךְ
  choice: 这样，你就可以顺利
  rationale: 保留目的或结果关系，并以现代汉语表达“对你有好处、事情于你顺遂”的盟约祝福用语。
- source_word: וְהַאֲרַכְתָּ יָמִים
  choice: 并且得以长寿
  rationale: 希伯来语字面为“延长日子”，是表示长久活着的惯用说法；“得以长寿”自然表达其含义，同时由脚注注明字面形式。
theological_decisions:
- issue: 顺服所带来结果的性质
  choice: 译为目的或结果性的祝福：“这样，你就可以顺利，并且得以长寿。”
  alternative: 译成对每个个体都必然兑现的、无条件的寿命保证。
  rationale: לְמַעַן 引出经文所陈述的目的或结果及盟约性祝福；译文不削弱这项应许，也不额外把它解释为机械式的个体保证。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“一定要”清楚传达加强命令；“却”凸显放走母鸟与可取幼雏之间的对照。“得以长寿”保留目的或结果语气，避免古奥的“延长日子”进入正文。
