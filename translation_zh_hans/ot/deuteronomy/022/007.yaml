  rationale: 修订避免将“后代”限定为已孵化的幼雏，并使取用和祝福的表述更符合现代标准汉语。译文仍保留命令的强调、取走后代的许可性表达、以及目的／结果性的盟约祝福，不将长寿表述为脱离语境的机械保证。
