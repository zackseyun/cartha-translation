  text: וְ/אִם לֹ֨א קָר֥וֹב אָחִ֛י/ךָ אֵלֶ֖י/ךָ וְ/לֹ֣א יְדַעְתּ֑/וֹ וַ/אֲסַפְתּ/וֹ֙ אֶל תּ֣וֹךְ בֵּיתֶ֔/ךָ וְ/הָיָ֣ה עִמְּ/ךָ֗ עַ֣ד דְּרֹ֤שׁ אָחִ֨י/ךָ֙ אֹת֔/וֹ וַ/הֲשֵׁבֹת֖/וֹ לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/002.yaml
  text: But if your brother is not near you[a], and you do not know him, then you shall bring it into your house, and it shall remain with you until your brother seeks it[c][b]; then you shall restore it to him.
translation:
  language: zh_hans
  text: 如果你的弟兄不在你附近[a]，你也不认识他[b]，就要把那失物收进家里，留在你那里，直到你的弟兄寻找它[c]；那时，你要把它归还给他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “你的弟兄”在这里很可能广指同一盟约群体中的成员，不一定只是亲生兄弟。
    reason: cultural_note
  - marker: b
    text: 也可按语境理解为“你不知道失主是谁”；原文直译是“你不认识他”。
    reason: lexical_alternative
  - marker: c
    text: “寻找”也可译作“查问”或“认领”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אָחִיךָ
  choice: 你的弟兄
  rationale: 保留原文的亲属称谓；在申命记的律法语境中，这称谓通常可广指同一盟约群体中的成员，而不只指同胞兄弟。
- source_word: קָרוֹב אֵלֶיךָ
  choice: 在你附近
  rationale: 表达空间上的接近，现代汉语自然明白，也不把含义限定为是否住在附近。
- source_word: וְלֹא יְדַעְתּוֹ
  choice: 你也不认识他
  rationale: 依照原文语法保留阳性单数宾语“他”，所指回到“你的弟兄”；语境上的意思是拾得者不知道失主是谁。
- source_word: וַאֲסַפְתּוֹ אֶל תּוֹךְ בֵּיתֶךָ
  choice: 把那失物收进家里
  rationale: אָסַף在此有收留、收进之意；“那失物”承接上一节所说走失的牲畜，并适用于本段随后扩展的失物类别。
- source_word: וְהָיָה עִמְּךָ
  choice: 留在你那里
  rationale: 比逐字译作“与你同在”更符合现代汉语，并自然体现一直保管到失主寻找为止的持续状态。
- source_word: עַד דְּרֹשׁ אָחִיךָ אֹתוֹ
  choice: 直到你的弟兄寻找它
  rationale: דרש可表示寻找、查问或认领；正文采用较贴近基本词义且能涵盖语境的“寻找”，脚注保留“认领”的可能。
- source_word: וַהֲשֵׁבֹתוֹ לוֹ
  choice: 你要把它归还给他
  rationale: 使役形态表达使失物回到失主手中；“归还”符合律法和财物语境。
theological_decisions:
- issue: “弟兄”的群体范围
  choice: 正文保留“你的弟兄”
  alternative: 你的同胞／以色列同胞
  rationale: 原文有意使用亲属语言；脚注说明其律法语境中的宽泛用法，避免在正文中将范围解释得过窄或过宽。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“收进家里”“留在你那里”适合日常可读性，同时保留律法命令的明确语气。所有代词的指向均尽量承接上下文，并用脚注说明原文中值得保留的歧义。
