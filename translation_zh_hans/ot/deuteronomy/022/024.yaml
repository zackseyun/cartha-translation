  text: וְ/הוֹצֵאתֶ֨ם אֶת שְׁנֵי/הֶ֜ם אֶל שַׁ֣עַר הָ/עִ֣יר הַ/הִ֗וא וּ/סְקַלְתֶּ֨ם אֹתָ֥/ם בָּ/אֲבָנִים֮ וָ/מֵתוּ֒ אֶת ה/נער עַל דְּבַר֙ אֲשֶׁ֣ר לֹא צָעֲקָ֣ה בָ/עִ֔יר וְ/אֶ֨ת הָ/אִ֔ישׁ עַל דְּבַ֥ר אֲשֶׁר עִנָּ֖ה אֶת אֵ֣שֶׁת רֵעֵ֑/הוּ וּ/בִֽעַרְתָּ֥ הָ/רָ֖ע מִ/קִּרְבֶּֽ/ךָ־־׀־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/024.yaml
  text: 'then you shall bring both of them out to the gate of that city[a], and you shall stone them with stones, and they shall die: the young woman because she did not cry out in the city, and the man because he violated his neighbor’s wife[c][b]. So you shall purge the evil from your midst.'
translation:
  language: zh_hans
  text: 你们要把他们二人带到那城的城门口[c]，用石头打死他们；那年轻女子[a]，因为她在城里没有呼喊；那男人，因为他侵犯了他邻舍的妻子[b]。这样，你就要把这恶从你中间除掉。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“那女孩”。这里的希伯来词采用了没有词尾 ה 的写法，但后面的动词“她没有呼喊”明确表明所指的是女性。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“凌辱了”或“苦待了”。这个希伯来动词在此语境中可指带来屈辱的性侵犯；正文采用“侵犯了”，以清楚表达其严重性，同时不把含义限定为单一的现代法律术语。
    reason: lexical_alternative
  - marker: c
    text: 古代以色列城镇的城门通常是公开处理诉讼和施行审判的地方。
    reason: cultural_note
lexical_decisions:
- source_word: וְהוֹצֵאתֶם
  choice: 你们要把……带到
  rationale: 使役形表达把二人带出去；结合目的地“城门口”，现代汉语用“带到”自然清楚。
- source_word: שְׁנֵיהֶם
  choice: 他们二人
  rationale: 明确保留原文所指的双方。
- source_word: שַׁעַר הָעִיר הַהִוא
  choice: 那城的城门口
  rationale: 既保留“那城”的指示意义，也用现代汉语自然表达城门这一公共司法场所。
- source_word: וּסְקַלְתֶּם אֹתָם בָּאֲבָנִים
  choice: 用石头打他们
  rationale: 保留原文明确提到“石头”的行刑方式，不提前把结果并入动词。
- source_word: וָמֵתוּ
  choice: 他们就必死
  rationale: 按希伯来语叙述次序，将死亡表达为前述行动的确定结果，而不改写为目的。
- source_word: הנער
  choice: 那年轻女子
  rationale: 辅音文本的形式本身不采用完整的阴性拼写，但后面的阴性动词明确表明所指为女性；“年轻女子”庄重且不武断限定年龄。
- source_word: עַל דְּבַר אֲשֶׁר לֹא צָעֲקָה בָעִיר
  choice: 是因为她在城里没有呼喊
  rationale: 清楚表达 עַל דְּבַר 的理由关系，并保留原文“呼喊”而不扩写为特定求救用语。
- source_word: עִנָּה
  choice: 侵犯了
  rationale: 在此性与婚约法律语境中，“侵犯”能传达严重的越界伤害，同时不像“强奸”那样把词义限定为单一现代法律术语。
- source_word: אֵשֶׁת רֵעֵהוּ
  choice: 邻舍的妻子
  rationale: 自然保留原文的社会与盟约关系称谓。
- source_word: וּבִעַרְתָּ הָרָע מִקִּרְבֶּךָ
  choice: 这样，你就要把这恶从你中间除掉
  rationale: 保留申命记反复出现的司法公式及原文由复数“你们”转为单数“你”的变化；“这恶”不擅自限定为恶人或抽象邪恶。
theological_decisions:
- issue: 女子受判罚的经文理由
  choice: 因为她在城里没有呼喊
  alternative: 因为她在城里没有呼救
  rationale: 译文忠实保留本节明说的判断依据，不把经文未明说的伦理结论或现代法律推断加入正文。
- issue: 性法律语境中 עִנָּה 的含义
  choice: 侵犯了
  alternative: 凌辱了；苦待了；强奸了
  rationale: “侵犯”保留性侵害与使人受辱的严重意味，却不把原词可能包含的屈辱、伤害层面缩减为某一个现代法律罪名。
- issue: הָרָע 所指
  choice: 这恶
  alternative: 恶人；邪恶
  rationale: 原文可指需要从群体中清除的恶，也可能在司法公式中带有所涉恶事或恶者的含义；用“这恶”保留这种张力。
translation_notes:
  register: 采用现代、庄重而易懂的法律叙述语体。保留原文命令中的复数“你们”与结尾公式中的单数“你”的转换；用两个“受罚”补足汉语句法，明确冒号后列出的是双方受刑的理由，而不增加新的判决内容。
