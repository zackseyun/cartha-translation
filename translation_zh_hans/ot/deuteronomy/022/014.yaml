base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/014.yaml
  text: and he charges her with false accusations and brings a bad name upon her[a], saying, ‘I took this woman, and when I came near to her[d][c][b], I did not find evidence of virginity in her.’
translation:
  language: zh_hans
  text: 并诬蔑她[a]，败坏她的名声[b]，说：“我娶了这个女子；与她亲近时[c]，却没有发现她是处女的凭据[d]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文为一个习语，也可译作“以虚假的指控攻击她”或“加给她诬蔑性的指控”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“使坏名声临到她”，意思是诋毁她。
    reason: lexical_alternative
  - marker: c
    text: “与她亲近”是指发生性关系的委婉说法。
    reason: euphemism
  - marker: d
    text: 原文直译为“没有找到她的童贞”。按下文，这里是指证明她婚前为处女的凭据。
    reason: cross_reference
lexical_decisions:
- source_word: וְשָׂם לָהּ עֲלִילֹת דְּבָרִים
  choice: 又找借口指控她
  rationale: 这是带有诋毁意味的习语，指加给女子的指控或说辞。“找借口指控”既表达其恶意，也避免把后文才要查明的案情在此完全判定为虚假。
- source_word: וְהוֹצִיא עָלֶיהָ שֵׁם רָע
  choice: 败坏她的名声
  rationale: 直译是“使坏名声临到她”，属于损害名誉的习语。中文用“败坏她的名声”自然地保留“名声”的意象。
- source_word: אֶת הָאִשָּׁה הַזֹּאת לָקַחְתִּי
  choice: 我娶了这个女子
  rationale: לקח在婚姻语境中表示娶妻；译作“娶了”比机械直译“取了”更符合现代汉语。“这个女子”保留原文带距离感的指称。
- source_word: וָאֶקְרַב אֵלֶיהָ
  choice: 与她亲近时
  rationale: 原文直指“靠近她”，在这里是发生性关系的委婉说法；译文保留其含蓄庄重的语域。
- source_word: וְלֹא מָצָאתִי לָהּ בְּתוּלִים
  choice: 却没有发现她是处女的凭据
  rationale: 原文近于“没有找到她的童贞”；结合随后经文所说的物证，复数 בְּתוּלִים 在此可表达证明童贞的凭据。
theological_decisions:
- issue: 指控是否在本节即被明确判为虚假
  choice: 正文译作“找借口指控”，表达恶意而不直接写成“诬告”或“虚假指控”
  alternative: 诬告她／用虚假的指控攻击她
  rationale: 本段最终会依证据裁断指控真伪；原文此处的习语带有诋毁和借题发挥的意味，却不宜在翻译中提前消除法律叙事所保留的张力。
translation_notes:
  register: 采用现代、庄重而易懂的法律叙事语体。保留原文谈及性关系时的委婉表达，并用“凭据”呈现下文所说明的证据含义；脚注标记依正文出现顺序排列。
