  text: וְ/הוֹצִ֨יאוּ אֶת ה/נער אֶל פֶּ֣תַח בֵּית אָבִ֗י/הָ וּ/סְקָלוּ/הָ֩ אַנְשֵׁ֨י עִירָ֤/הּ בָּ/אֲבָנִים֙ וָ/מֵ֔תָה כִּֽי עָשְׂתָ֤ה נְבָלָה֙ בְּ/יִשְׂרָאֵ֔ל לִ/זְנ֖וֹת בֵּ֣ית אָבִ֑י/הָ וּ/בִֽעַרְתָּ֥ הָ/רָ֖ע מִ/קִּרְבֶּֽ/ךָ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/021.yaml
  text: Then they shall bring out the young woman to the entrance of her father's house[a], and the men of her city shall stone her with stones, and she shall die, because she has committed an outrageous act in Israel by prostituting herself in her father's house[c][b]. So you shall purge the evil from your midst.
translation:
  language: zh_hans
  text: 他们要把那年轻女子[a]带到她父亲家门口；她城里的男子要用石头打死她，因为她在父家行淫[c]，在以色列中作了丑事[b]。这样，你就要从你们中间除掉这恶。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“那女孩”。希伯来语 נַעַר 可指年轻女性，具体含义由上下文决定。
    reason: lexical_alternative
  - marker: b
    text: 或译“可耻的事”或“卑劣的事”。希伯来语 נְבָלָה 指在道德上令人震惊、可耻的恶行。
    reason: lexical_alternative
  - marker: c
    text: 或译“卖淫”，也可较宽泛地理解为“犯不正当的性行为”。希伯来语动词 זנה 本义带有卖淫、作娼的意象，也常用于非法性行为。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנַּעַר
  choice: 那年轻女子
  rationale: 上下文明确所指为女性；“年轻女子”既体现年龄，也符合现代汉语法律叙事的庄重语体。希伯来语此形式本身可指年轻女性，另译见脚注。
- source_word: פֶּתַח בֵּית אָבִיהָ
  choice: 她父亲家门口
  rationale: פֶּתַח指入口或门口；此处用“家门口”自然地保留具体地点，也不把“父亲的家”窄化为仅指家庭成员。
- source_word: וּסְקָלוּהָ ... בָּאֲבָנִים
  choice: 要用石头打她，使她死
  rationale: 保留原文明确提到“用石头”，并以“使她死”表达随后结果；避免添加“直到”等原文没有明说的时间关系。
- source_word: אַנְשֵׁי עִירָהּ
  choice: 本城的男人
  rationale: אַנְשֵׁי是阳性复数“男人”；“本城”在汉语中自然表达“她所属城中的”。
- source_word: נְבָלָה
  choice: 可耻的事
  rationale: 该词在道德和法律语境中指严重、令人震惊的卑劣行为，而非一般的愚蠢；“可耻的事”清楚、庄重，又不过度解释。
- source_word: לִזְנוֹת
  choice: 行淫
  rationale: זנה带有卖淫或作娼的强烈意象，也可较广泛地指非法性行为。“行淫”在中文中保留其强烈的道德—性行为色彩，同时不武断断定涉及交易性卖淫。
- source_word: בֵּית אָבִיהָ
  choice: 在父家
  rationale: 保留原文的地点表达及父家所承载的家庭社会背景；简洁而庄重。
- source_word: וּבִעַרְתָּ הָרָע מִקִּרְבֶּךָ
  choice: 你就要从你们中间除掉这恶
  rationale: 这是《申命记》反复出现的司法公式。“除掉这恶”传达清除之意；原文第二人称单数面向作为整体的以色列群体，中文以“你……你们中间”体现集体受话者，虽有数的转换，但比“从你中间”更自然。
theological_decisions:
- issue: 如何表达法律语境中的性行为指控而不弱化或过度限定
  choice: 译作“行淫”，并在脚注说明可译为“卖淫”或更宽泛的非法性行为
  alternative: 直接译作“卖淫”或笼统译作“有不道德的性行为”
  rationale: “行淫”保留זנה的强烈性与道德色彩，却不把语义限定为金钱交易，也不引入原文没有明说的后期神学分类。
- issue: 城中执行者的性别表达
  choice: 本城的男人
  alternative: 本城的人或城里众人
  rationale: 原文使用阳性复数אַנְשֵׁי；照实保留性别信息，不将其无根据地中性化。
- issue: “恶”所指是抽象邪恶还是具体恶事
  choice: 保留为“这恶”
  alternative: 译作“这个恶人”或“这种罪恶”
  rationale: הָרָע在该固定公式中可以保有一定语义张力；“这恶”不擅自把它限定为恶人、罪行或抽象邪恶。
translation_notes:
  register: 采用现代、庄重而易懂的司法叙事语体。句式尽量贴近希伯来语的行动—理由—结论结构；保留原文的严厉措辞及“从中间除掉这恶”的申命记公式，同时用脚注呈现关键词的真实语义范围。
