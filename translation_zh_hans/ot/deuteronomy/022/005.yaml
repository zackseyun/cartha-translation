base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/005.yaml
  text: A woman shall not wear a man's article[a], and a man shall not put on a woman's garment, for everyone who does these things is an abomination to Yahweh your God.
translation:
  language: zh_hans
  text: 女人身上不可有男人的用品[a]；男人不可穿上女人的衣服，因为凡做这些事的人，都为耶和华——你的上帝所憎恶。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“女人不可穿男人的衣服。”首句的希伯来词含义较广，可指物件、器具或装备；后一句则使用明确表示“衣服”的词。
    reason: lexical_alternative
lexical_decisions:
- source_word: כְלִי גֶבֶר
  choice: 男人的物件
  rationale: כְלִי 的含义比衣物广，可指物件、器具或装备；译作“物件”保留其范围，也不抹平它与后句 שִׂמְלָה“衣服”的词义差别。
- source_word: עַל אִשָּׁה
  choice: 穿戴在身上
  rationale: 直译为“在女人身上”，在衣物或装备的语境中表示穿戴于身；“穿戴在身上”既自然，也可涵盖衣物以外的随身装备。
- source_word: יִלְבַּשׁ
  choice: 穿上
  rationale: 该动词表示穿衣或把衣服穿在身上；“穿上”准确而自然。
- source_word: שִׂמְלַת אִשָּׁה
  choice: 女人的衣服
  rationale: שִׂמְלָה 常指衣服或外衣；“衣服”符合现代汉语，又不限定为某一种具体服饰。
- source_word: גֶּבֶר / אִשָּׁה
  choice: 男人 / 女人
  rationale: 原文明确以男人和女人相对，译文保留这一性别对举。
- source_word: תוֹעֲבַת יְהוָה
  choice: 耶和华……所憎恶的
  rationale: תוֹעֵבָה 表达在上帝面前可憎、厌恶之事；汉语关系结构自然地传达其强烈评价。神名 יהוה 音译为“耶和华”。
- source_word: כָּל עֹשֵׂה אֵלֶּה
  choice: 凡做这些事的
  rationale: 保留 כָּל 的概括、周遍含义，并以自然简洁的现代汉语表达分词结构。
theological_decisions:
- issue: 首句 כְלִי גבר 的范围
  choice: 译作较宽泛的“男人的物件”，并在正文用“穿戴在身上”说明其与人身的关系。
  alternative: 译作“男人的衣服”或具体化为“男人的武器／装备”。
  rationale: 原文首句使用范围较广的 כְלִי，次句则使用明确表示衣服的 שִׂמְלָה。译文保留这种差别，不把禁令武断地局限为衣服，也不具体化为武器或某类装备。
- issue: 性别用语
  choice: 保留“女人”和“男人”的明确对举。
  alternative: 使用“人”或“任何人”等中性措辞。
  rationale: 原文明确使用 אִשָּׁה 与 גֶּבֶר，性别对举是句意的一部分。
- issue: תוֹעֲבָה 的神学力度
  choice: 译为“耶和华……所憎恶的”。
  alternative: 译为“耶和华看为可厌恶的”或名词式“在耶和华面前是可憎之物”。
  rationale: “所憎恶的”保留原词强烈的否定评价，同时符合现代汉语表达；不额外界定其礼仪、道德或其他分类。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“男人的物件”有意保留原文首句的宽泛性；“穿戴在身上”避免让“物件”显得与语境脱节。句末以“耶和华你上帝所憎恶的”保持申命记对听者的第二人称单数措辞。
