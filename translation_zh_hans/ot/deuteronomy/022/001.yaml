source:
  edition: WLC
  text: לֹֽא תִרְאֶה֩ אֶת שׁ֨וֹר אָחִ֜י/ךָ א֤וֹ אֶת שֵׂי/וֹ֙ נִדָּחִ֔ים וְ/הִתְעַלַּמְתָּ֖ מֵ/הֶ֑ם הָשֵׁ֥ב תְּשִׁיבֵ֖/ם לְ/אָחִֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/001.yaml
  text: You shall not see your brother’s ox or his sheep driven away and ignore them; you must certainly return them to your brother.
translation:
  language: zh_hans
  text: 你看见你弟兄的牛或羊走失了，不可故意不理它们；务必把它们归还给你的弟兄。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָחִיךָ
  choice: 你的弟兄
  rationale: 保留申命记中盟约群体成员之间的亲属式称谓；“弟兄”庄重且能涵盖同胞、族人，不限于亲生兄弟。
- source_word: נִדָּחִים
  choice: 走失了
  rationale: 该词表示被赶离、偏离或失散；在牲畜语境中译作“走失了”自然，并保留它们已离开所属之人的核心意思，不武断指定是自行迷路还是被外力赶散。
- source_word: וְהִתְעַלַּמְתָּ מֵהֶם
  choice: 置之不理
  rationale: 原语字面涉及掩眼不看、故意不理；“置之不理”准确表达明知而回避责任。
- source_word: הָשֵׁב תְּשִׁיבֵם
  choice: 务必要把它们牵回去交给
  rationale: 保留不定式绝对形加限定动词所表达的强调义；“牵回去交给”符合牛羊的实际动作，也清楚表达归还给主人。
theological_decisions:
- issue: “弟兄”的群体范围
  choice: 保留“弟兄”
  alternative: 同胞／邻人
  rationale: 原文使用亲属称谓 אָח，不应在正文中扩大为一般“邻人”或缩窄为亲生兄弟；保留原有的盟约共同体色彩。
- issue: נִדָּחִים 是否明确为“被赶走”
  choice: 译作“走失了”
  alternative: 被赶走了／被驱散了
  rationale: 希伯来语形式可含被驱赶、流离或偏离之意，但本节没有说明施动者；“走失了”在汉语中保留结果状态，避免无依据地断定外力驱赶。
translation_notes:
  register: 采用现代、庄重而易懂的规范普通话。“不可……；务必要……”呈现禁令与强调命令的对照；不用生硬的“你不可看见……而隐藏自己不管”。
