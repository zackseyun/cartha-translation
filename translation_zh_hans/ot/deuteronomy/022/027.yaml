base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/027.yaml
  text: For he found her in the field[a]; the betrothed young woman cried out[b], but there was no one to rescue her.
translation:
  language: zh_hans
  text: 因为那男子在田野[a]遇见她；那已许配的年轻女子呼喊，却无人搭救她[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“郊野”。希伯来语所指的是远离人群的乡野环境。
    reason: lexical_alternative
  - marker: b
    text: 或译：“救她”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 此处承接并说明上一节法律判决的理由；“因为”自然保留解释性的因果关系。
- source_word: בַשָּׂדֶה
  choice: 在田野
  rationale: 直译该词组，并传达远离人群、可能无人听见呼救的乡野环境；脚注保留“郊野”这一语境化译法。
- source_word: מְצָאָהּ
  choice: 遇见她
  rationale: מצא基本义为“找到、遇见”。在此叙事情境中，“遇见她”比“找到她”更自然，也不额外暗示事先搜寻。
- source_word: צָעֲקָה
  choice: 呼喊
  rationale: צעק表示在危急中喊叫，通常含求助意味；“呼喊”保留原文动作，而不把“求救”这一语境含义完全明说。
- source_word: הנער
  choice: 年轻女子
  rationale: 辅音文本的形式虽可显得不明确，但上下文、冠词后的修饰语及阴性指代均明确指向女性；“年轻女子”准确且符合现代汉语。
- source_word: הַמְאֹרָשָׂה
  choice: 已许配的
  rationale: 该被动分词指已正式订立婚约的身份。“已许配”保留古代法律关系的正式性，比现代口语“订婚”更贴近原文制度背景。
- source_word: וְאֵין מוֹשִׁיעַ לָהּ
  choice: 却无人搭救她
  rationale: 原句表示当时没有施救者。“却”自然表达语义转折，“搭救”突出眼前危险中的实际援助，并避免不必要的神学化联想。
theological_decisions:
- issue: הַמְאֹרָשָׂה所表示的法律与社会身份
  choice: 已许配的
  alternative: 已订婚的；已有婚约的
  rationale: 本段律例以女子已经正式许配的身份为关键背景；译文保留这一法律严肃性，不把古代婚约简单等同于现代订婚习俗。
- issue: הנער在本节中的性别表达
  choice: 年轻女子
  alternative: 少女；年轻人
  rationale: 尽管所呈现的辅音形式可能造成表面歧义，本节的语法和上下文明确指向女性。译作“年轻女子”既忠于实际所指，也避免“少女”可能带来的年龄过度限定。
- issue: מוֹשִׁיעַ在本处的语义范围
  choice: 搭救
  alternative: 救；拯救
  rationale: 这里所说的是危急处境中无人前来施救，而非专门陈述神学意义上的救恩；“搭救”准确表达具体情境，同时不排除该词通常具有的“拯救”语义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“那男子”补明阳性主语，使汉语指代清楚；“呼喊”保留原文的简洁和危急感。分号对应希伯来语两项相连的事实陈述，末句用“却”呈现语境中的对照。
