  yaml_path: translation/ot/deuteronomy/022/016.yaml
  text: And the young woman’s father shall say to the elders[a], ‘I gave my daughter to this man as a wife, and he hates her.’
translation:
  language: zh_hans
  text: 女子的父亲要对长老们说：“我把女儿给了这个人作妻子，他恨恶她[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“后来开始恨恶她。”希伯来语动词本身只是“恨恶”；上下文可以把它理解为当前的态度，也可以理解为后来形成的态度。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַר
  choice: 要……说
  rationale: 在申命记案例法的程序语境中，此形式表达规定情形下接着要采取的行动；用“要……说”比叙事性的“说了”更准确。
- source_word: אֲבִי הַנַּעַר
  choice: 女子的父亲
  rationale: 此处指已到婚龄、并已嫁人的年轻女性；“女子”自然庄重，也避免“女孩”可能带来的年幼含义。
- source_word: הַזְּקֵנִים
  choice: 长老们
  rationale: 此词在本法律语境中指承担地方公共及审判职责的领袖，并非泛指年长男子。
- source_word: אֶת בִּתִּי
  choice: 女儿
  rationale: אֶת为直接宾语标记，不另译；בִּתִּי意为“我的女儿”，汉语引语中由“我把女儿”自然表达所属关系。
- source_word: נָתַתִּי
  choice: 我把……给了
  rationale: נָתַן在婚姻安排中表示把女儿交给某人为妻；此处用完成体“给了”直接表达已发生的婚配。
- source_word: לָאִישׁ הַזֶּה
  choice: 给了这个人
  rationale: אִישׁ直译为“人／男人”；“这个人”指当场被控的丈夫，而随后的“作妻子”已说明婚姻关系。
- source_word: לְאִשָּׁה
  choice: 作妻子
  rationale: 这是希伯来语常见的婚姻表达；“作妻子”在现代汉语中简洁自然，并保留关系含义。
- source_word: וַיִּשְׂנָאֶהָ
  choice: 他却恨恶她
  rationale: שׂנא的基本义是“恨恶”。“却”体现此态度与娶她为妻之间的转折，但不把动词本身扩展解释为其他行为。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的法律叙述语体。“要……说”体现案例法程序，“作妻子”保留婚姻公式的简洁性。脚注标记置于其实际说明的“恨恶她”之后。
