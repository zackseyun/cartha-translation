  text: לֹא תִרְאֶה֩ אֶת חֲמ֨וֹר אָחִ֜י/ךָ א֤וֹ שׁוֹר/וֹ֙ נֹפְלִ֣ים בַּ/דֶּ֔רֶךְ וְ/הִתְעַלַּמְתָּ֖ מֵ/הֶ֑ם הָקֵ֥ם תָּקִ֖ים עִמּֽ/וֹ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/004.yaml
  text: You shall not see your brother’s donkey or his ox fallen on the road and ignore them[a]; you must surely lift them up with him.
translation:
  language: zh_hans
  text: 你看见你弟兄的驴或牛倒在路上，不可置之不理；你务要和他一起[a]把牲畜扶起来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“与他一同”，强调要与牲畜的主人合力，而不可任由他独自处理。
    reason: lexical_alternative
lexical_decisions:
- source_word: אָחִיךָ
  choice: 你弟兄的
  rationale: 直译为“你弟兄的”。在申命记的盟约律例中，通常指同属以色列群体的人；保留亲属称谓，可传达原文的群体亲情意味。
- source_word: חֲמוֹר
  choice: 驴
  rationale: 现代汉语中准确、自然的常用名称。
- source_word: שׁוֹרוֹ
  choice: 他的牛
  rationale: שׁוֹר在此泛指牛类役畜；汉语用“牛”比限定为“公牛”或“阉牛”更自然，也不额外缩窄所指。
- source_word: נֹפְלִים
  choice: 倒在
  rationale: 分词描写牲畜已经倒下的状态，可能因负重或疲乏；“倒在路上”简洁自然，并与后文“扶起来”呼应。
- source_word: בַּדֶּרֶךְ
  choice: 在路上
  rationale: 准确表达牲畜被看见时所在的地点，符合现代汉语习惯。
- source_word: וְהִתְעַלַּמְתָּ מֵהֶם
  choice: 置之不理
  rationale: עלם的反身词干在这里是故意不理会、佯作不见的惯用含义。“置之不理”自然表达这一禁止命令，又避免生硬直译为“向它们隐藏自己”。
- source_word: הָקֵם תָּקִים
  choice: 务要……扶起来
  rationale: 不定式绝对形与限定动词连用，加强命令语气；“务要”体现强调，“扶起来”切合倒地牲畜需要被协力拉起或扶起的语境。
- source_word: עִמּוֹ
  choice: 和他一起
  rationale: 直接保留原文“与他一同”的合作意味；“他”按语境指牲畜的主人。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“你弟兄”保留申命记律法中的盟约群体亲属语言；“牲畜”在后半句概括前述的驴或牛，避免汉语中代词所指不清。
