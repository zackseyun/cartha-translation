revisions:
- from: 但那男子若在田野遇见已经许配的年轻女子，强行抓住她[a]，与她同寝，那么，只有与她同寝的男子必须处死。
  to: 但那男子若在田野遇见已经许配的年轻女子，强行抓住她[a]，与她同寝，那么，只有与她同寝的男子必须被处死。
  rationale: 仅将‘必须处死’改为‘必须被处死’，以消除汉语中施事与受事的歧义，并准确表达本节规定男子所受的死刑。其余措辞忠实、自然，脚注锚点与内容均合适。
