  source_fidelity: 译文准确保留了条件句、田野场景、已许配女子、男子抓住她并与她同寝，以及刑罚只加于男子的结构。‘强行抓住她’恰当地传达了וְהֶחֱזִיק בָּהּ的强制性，同时没有把该动词本身过度等同于专指强奸的词。
  naturalness: 正文整体庄重自然，适合律法文本；但‘那与她同寝的男子必须处死’在现代汉语中句法不完整且易被理解为该男子必须处死他人。应明确为被动的司法刑罚。
  terminology: ‘已经许配的年轻女子’能体现正式婚约关系；‘同寝’保留原文委婉、庄重的性交表达。脚注的‘强暴她’作为可能的解释性译法可保留，并清楚区分其与直译。
