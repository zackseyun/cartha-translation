base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/025.yaml
  text: But if in the open field the man finds the young woman who is betrothed[a], and the man seizes her and lies with her, then only the man who lay with her shall die.
translation:
  language: zh_hans
  text: 但那男子若在田野遇见已经许配的年轻女子，强行抓住她[a]，与她同寝，那么，只有与她同寝的男子必须被处死。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“制伏她”或“强暴她”。希伯来文直译为“强行抓住她”；上下文清楚表明这一行为并非出于女子自愿。
    reason: 说明原词的字面动作、可能译法及上下文所确定的强制性质。
lexical_decisions:
- source_word: וְאִם
  choice: 但……若
  rationale: 本句转入与前一案例相对照的条件情形；“但……若”既体现转折，也保留法律条文的条件结构。
- source_word: בַּשָּׂדֶה
  choice: 在田野
  rationale: שׂדה直指田地、野外；“田野”自然简洁，也能让上下文说明该处远离可获救援之地，无须在正文额外加入“空旷”。
- source_word: יִמְצָא
  choice: 遇见
  rationale: מצא基本义为“找到”，在此法律案例的相遇场景中译作“遇见”更符合现代汉语，且不改变事件性质。
- source_word: הַנַּעַר הַמְאֹרָשָׂה
  choice: 已经许配的年轻女子
  rationale: נער在此指年轻女性；ארשׂ表示具有法律约束力的婚约状态。“已经许配”比现代口语“订婚”更贴近古代法律关系。
- source_word: וְהֶחֱזִיק בָּהּ
  choice: 强行抓住她
  rationale: חזק的使役式与ב连用表示用力抓住、制住。“强行抓住”保留具体动作，又清楚传达强制性，不把该动词本身直接等同于专指强奸的词。
- source_word: וְשָׁכַב עִמָּהּ
  choice: 与她同寝
  rationale: 这是表示性交的常用希伯来语委婉说法；“同寝”庄重而清楚，适合法律语体。
- source_word: וּמֵת
  choice: 必须处死
  rationale: 在本法律语境中，该完成式表达规定的司法后果；“必须处死”明确是刑罚判决，而非自然死亡。
- source_word: לְבַדּוֹ
  choice: 只有……男子
  rationale: לבדו强调排他性，即刑罚仅归于男子，不归于女子；汉语用“只有”最清楚自然。
theological_decisions:
- issue: 是否在正文中直接把性暴力明说为“强奸”
  choice: 译为“强行抓住她，与她同寝”，由动作措辞与法律上下文共同表明非自愿性质。
  alternative: 译为“强奸她”或“强迫她与他同寝”。
  rationale: 上下文明确描述性暴力，尤其下一节宣告女子无罪；但本节所用חזק本义是抓住、制住，而非一个专门意为“强奸”的动词。所选译法既不淡化强制，也保留原文词汇层面的表达方式。
translation_notes:
  register: 采用现代、庄重而易懂的法律叙事语体。“已经许配”保留古代婚约的法律分量；“同寝”避免粗俗；“必须处死”明确司法规定。脚注标记[a]已置于其所解释的短语之后。
