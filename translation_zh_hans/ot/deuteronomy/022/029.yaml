source:
  edition: WLC
  text: וְ֠/נָתַן הָ/אִ֨ישׁ הַ/שֹּׁכֵ֥ב עִמָּ֛/הּ לַ/אֲבִ֥י ה/נער חֲמִשִּׁ֣ים כָּ֑סֶף וְ/לֽ/וֹ תִהְיֶ֣ה לְ/אִשָּׁ֗ה תַּ֚חַת אֲשֶׁ֣ר עִנָּ֔/הּ לֹא יוּכַ֥ל שַׁלְּחָ֖/ה כָּל יָמָֽי/ו־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/029.yaml
  text: Then the man who lay with her shall give fifty shekels of silver to the young woman's father[a], and she shall become his wife because he has violated her[b]. He may not send her away all his days.
translation:
  language: zh_hans
  text: 与她同寝的男子要给那年轻女子的父亲五十舍客勒银子；她要作他的妻子，因为他侵犯了她[a]。他终身不可休弃她[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“使她受了屈辱”或“苦待了她”。希伯来语动词本义范围较广，在这里的性行为语境中指对她的侵犯和羞辱。
    reason: lexical_alternative
  - marker: b
    text: “休弃她”原文直译为“送走她”，在这里指休妻。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַן
  choice: 要给
  rationale: 在法律条文中，此结构推进处分规定；“要给”以自然的现代汉语表达其强制性。
- source_word: הָאִישׁ הַשֹּׁכֵב עִמָּהּ
  choice: 与她同寝的男子
  rationale: 保留描述该男子及其性行为的关系分句；“同寝”庄重含蓄，又能在上下文中清楚表达性关系。
- source_word: לַאֲבִי הַנַּעֲרָ
  choice: 给那年轻女子的父亲
  rationale: נַעֲרָה 指处于适婚年龄的少女或年轻女子；此处用“年轻女子”避免让现代读者误解为年幼儿童。
- source_word: חֲמִשִּׁים כָּסֶף
  choice: 五十舍客勒银子
  rationale: 原文直译为“五十银子”，法律经济语境中指按舍客勒计量的银；补出重量单位可准确传达实际含义。
- source_word: וְלוֹ תִהְיֶה לְאִשָּׁה
  choice: 她要作他的妻子
  rationale: 自然表达条文所规定的婚姻身份结果，不加入所有权含义。
- source_word: תַּחַת אֲשֶׁר
  choice: 因为
  rationale: 此法律公式引出上述规定的缘由，“因为”简洁自然。
- source_word: עִנָּהּ
  choice: 侵犯了她
  rationale: 该动词的加强词干在这里表示使女子受辱、受伤害，且处于性行为语境；“侵犯”传达严重的性方面侵害，同时不把本分句本身未明说的具体强迫方式加入译文。
- source_word: לֹא יוּכַל שַׁלְּחָהּ
  choice: 不可休弃她
  rationale: 原文直指不得“送走她”；在婚姻法律语境中即不得休妻。“休弃”既清楚表达法律含义，也保留弃绝、遣走的语感。
- source_word: כָּל יָמָיו
  choice: 终身
  rationale: 以现代汉语的常用说法表达“他一生所有的日子”，即终其一生。
theological_decisions:
- issue: 如何翻译性侵害语境中的 עִנָּהּ，既不淡化行为，也不超出本分句的措辞
  choice: 侵犯了她
  alternative: 使她受屈辱；玷辱了她；强奸了她
  rationale: 上下文明确涉及不正当的性行为，但本节使用的是可表示苦待、压辱或使人受屈辱的 ענה，而非在本分句中直接陈述强迫手段。“侵犯了她”能表明严重侵害，又保留词义和上下文之间的张力；“使她受屈辱”在现代汉语中可能过弱，“玷辱”容易暗示受害女子本身沾染污名，“强奸”则比本分句的词汇更具体。
translation_notes:
  register: 采用现代、庄重而易懂的法律叙述语体。“舍客勒”作为古代重量单位予以保留；“同寝”避免过度口语化；“休弃”在婚姻法律语境中清楚且不失原文“送走”的色彩。脚注标记均置于所解释词语之后。
