base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/006.yaml
  text: If a bird’s nest happens to be before you on the way[a], in any tree or on the ground, with young ones or eggs, and the mother is sitting on the young ones or on the eggs[b], you shall not take the mother along with the young.
translation:
  language: zh_hans
  text: 你在路上若碰巧遇见鸟窝[a]，不论在任何树上或地上，窝里有雏鸟或鸟蛋，母鸟正伏在雏鸟或鸟蛋上，你不可把母鸟连同雏鸟或鸟蛋一起取走[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“若有鸟窝出现在你面前”。原文动词含有偶然遇见、并非刻意寻找的意思。
    reason: lexical_alternative
  - marker: b
    text: 原文的字面结构为“不可取母鸟在幼雏之上”。这里“在……之上”构成习语，意思是不可把母鸟连同其雏鸟或鸟蛋一同取走。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי יִקָּרֵא
  choice: 若碰巧遇见
  rationale: כִּי在案例律法中引出条件；יִקָּרֵא是קרא的Nifal形式，在此表示偶然遇上，而不是刻意寻找。
- source_word: קַן צִפּוֹר
  choice: 鸟窝
  rationale: 按现代汉语习惯自然表达这一属格结构，含义明确。
- source_word: לְפָנֶיךָ בַּדֶּרֶךְ
  choice: 在路上……遇见
  rationale: 把“在你面前”和“在路上”的空间意义融入自然汉语，同时保留行途中遇到的场景。
- source_word: בְּכָל עֵץ אוֹ עַל הָאָרֶץ
  choice: 无论是在树上还是在地上
  rationale: 这里的הָאָרֶץ具体指地面；בְּכָל在此概括鸟窝可能所在的任何一棵树，不宜机械译为“每棵树”。
- source_word: אֶפְרֹחִים
  choice: 雏鸟
  rationale: 指窝中的幼鸟；“雏鸟”准确、通俗，又不限定具体鸟类。
- source_word: בֵיצִים
  choice: 鸟蛋
  rationale: 原文直译为“蛋”；加“鸟”符合汉语语境，并避免脱离上下文时的歧义。
- source_word: וְהָאֵם רֹבֶצֶת
  choice: 母鸟正伏在
  rationale: רֹבֶצֶת描写母鸟伏卧在雏鸟或蛋上的姿态；“伏在”比“孵着”少一层目的性解释，也能同时用于雏鸟和蛋。
- source_word: לֹא תִקַּח
  choice: 你不可……取走
  rationale: 保留律法禁令的直接语气；“取走”既可用于母鸟，也可涵盖雏鸟和鸟蛋。
- source_word: הָאֵם עַל הַבָּנִים
  choice: 把母鸟连同它的后代一起取走
  rationale: 此处עַל构成表示连同、一起的习语；בָּנִים字面为“儿女”，在鸟类语境中泛指其后代，并承接上文的雏鸟或鸟蛋。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的律法语言。“若……不可……”保留案例律法的条件与禁令结构；避免使用过于书面或容易误解的“连母带子”，也不把母鸟的动作限定解释为孵蛋。
