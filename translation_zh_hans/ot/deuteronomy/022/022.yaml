base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/022.yaml
  text: If a man is found lying with a woman married to a husband[a], then both of them shall die—the man who lay with the woman, and the woman[b]. So you shall purge the evil from Israel.
translation:
  language: zh_hans
  text: 若发现一名男子与有夫之妇同寝[a]，两人都必须死：就是与那女人同寝的男子和那女人[b]。这样，你要从以色列中除掉恶。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “有夫之妇”原文直译为“有丈夫的女人”，强调她处于婚姻关系之中。
    reason: lexical_alternative
  - marker: b
    text: “必须死”在这里规定的是死刑；也可译作“必须被处死”。
    reason: alternative_reading
lexical_decisions:
- source_word: יִמָּצֵא
  choice: 若发现
  rationale: 该动词为被动式，在法律条文中表示事情被查明或被发现；“若发现”自然且保留条件句语气。
- source_word: שֹׁכֵב עִם
  choice: 与……同寝
  rationale: 这是指性交的委婉语；“同寝”保留希伯来语意象和庄重的法律语体，同时现代读者能够理解。
- source_word: בְעֻלַת בַּעַל
  choice: 有夫之妇
  rationale: 该短语字面突出女子处于与丈夫的婚姻关系中；“有夫之妇”简洁、自然，并明确其已婚身份，脚注补充字面形式。
- source_word: וּמֵתוּ גַּם שְׁנֵיהֶם
  choice: 两人都必须死
  rationale: 在法律语境中，这是规定的死刑。“必须死”既贴近原文的“死”，又清楚表达规范性，不额外加入原文未明说的被动处决形式。
- source_word: הָאִישׁ הַשֹּׁכֵב עִם הָאִשָּׁה וְהָאִשָּׁה
  choice: 就是与那女人同寝的男人和那女人
  rationale: 保留原文对双方的重复指明，以维持法律条文的清晰与强调。
- source_word: וּבִעַרְתָּ הָרָע
  choice: 这样，你就把恶……除掉
  rationale: 申命记中这一固定法律表达指从群体中清除恶；“把恶除掉”比“洁净”少一层礼仪含义，也比“消灭恶人”更忠于抽象名词“恶”。
- source_word: מִיִּשְׂרָאֵל
  choice: 从以色列中
  rationale: 明确表示从以色列共同体内部除去，符合介词所表达的分离意义。
theological_decisions:
- issue: 如何表达 בְעֻלַת בַּעַל 所强调的婚姻关系
  choice: 有夫之妇
  alternative: 与丈夫结了婚的女人；属丈夫的女人
  rationale: 主文明确其已婚身份，同时避免用现代汉语中容易被理解为所有权的措辞；脚注保留原文较字面的结构。
- issue: 是否把 וּמֵתוּ 明译为司法处决
  choice: 两人都必须死
  alternative: 两人都必须被处死
  rationale: 上下文表明这是法律规定的死刑，但希伯来文本本身用的是“死”，没有明用“处死”的使役或被动表达，因此主文不把隐含的执行方式写进正文，并以脚注说明法律效力。
translation_notes:
  register: 采用现代、庄重而清楚的法律语体。“同寝”保留原文的委婉表达；“有夫之妇”较为凝练，适合经文文体，但仍为普通现代读者熟悉。所有脚注标记均已置于正文相应位置。
