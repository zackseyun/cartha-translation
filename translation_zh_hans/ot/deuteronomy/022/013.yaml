  text: 如果一个人娶了妻子，与她同房后恨恶她，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: 如果
  rationale: 这里引出判例法中的假设情形；“如果”自然地标明条件句的前件。
- source_word: יִקַּח אִישׁ אִשָּׁה
  choice: 一个人娶了妻子
  rationale: לקח 的字面义是“取”，但与“妻子”连用时表示娶妻。现代汉语用“娶了妻子”既准确又自然，并保留原文男性主体。
- source_word: וּבָא אֵלֶיהָ
  choice: 与她同房
  rationale: 这是希伯来语指夫妻性生活的委婉惯用语。汉语“同房”同样简洁、庄重而含蓄，无须保留在汉语中不自然的字面表达。
- source_word: וּשְׂנֵאָהּ
  choice: 后来却恨恶她
  rationale: שׂנא 表示“恨、恨恶”。“后来”体现事件次序，“却”自然呈现婚后亲近与继而恨恶之间的转折，但不改变法律情形的实质。
