base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/008.yaml
  text: When you build a new house[a], you shall make a parapet for your roof, so that you do not bring bloodguilt on your house if someone falls from it.
translation:
  language: zh_hans
  text: 你建造新房时，要在屋顶四周设防护栏[a]，免得有人从屋顶坠落，以致你的房屋沾上血债。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “防护栏”也可译为“栏杆”或“女儿墙”。这里指环绕平屋顶边缘设置的防护围挡。
    reason: 说明מַעֲקֶה的可选译法及其在古代平屋顶建筑中的保护功能。
lexical_decisions:
- source_word: כִּי
  choice: ……时
  rationale: 这里引出律法中的具体情形，而非说明原因；用“……时”自然表达这一假设性案例。
- source_word: תִבְנֶה בַּיִת חָדָשׁ
  choice: 你建造新房屋
  rationale: 直接保留动词、宾语和形容词的具体法律场景，符合现代汉语表达。
- source_word: וְעָשִׂיתָ
  choice: 要……修筑
  rationale: 此处带连接词的完成式具有命令、规定的效力；“要”准确传达律法语气，又不显陈旧。
- source_word: מַעֲקֶה
  choice: 护栏
  rationale: 该词指平屋顶边缘防止人跌落的保护性围挡；“护栏”比“女儿墙”更易为普通读者理解，同时脚注说明其具体形态。
- source_word: לְגַגֶּךָ
  choice: 在屋顶四周
  rationale: 介词短语指出护栏所服务和设置的位置；“四周”虽属语境明示，但符合平屋顶护栏的实际功能。
- source_word: וְלֹא תָשִׂים דָּמִים בְּבֵיתֶךָ
  choice: 使你的家担负血债
  rationale: “置血于家”的希伯来语习语表示因可避免的死亡而承担流血责任；“血债”保留其法律与道德分量。“家”也维持原文可指房屋及其所属家庭的张力。
- source_word: כִּי יִפֹּל הַנֹּפֵל
  choice: 免得有人……掉下去
  rationale: 原文以分词指不特定的潜在坠落者；汉语用“有人”自然表达，并以“免得”呈现预防性目的和可能后果。
- source_word: מִמֶּנּוּ
  choice: 从那里
  rationale: 代词最自然地回指刚提到的屋顶或房屋结构；“那里”既清楚又不把所指过度限定为某一名词。
theological_decisions:
- issue: דָּמִים 在法律语境中的性质
  choice: 血债
  alternative: 流血之罪；血的责任
  rationale: 本节关乎因疏于防范可避免的死亡而产生的法律与道德责任，并非只描述实际流血。“血债”保留这种责任含义，同时不引入后来的教义体系。
- issue: בְּבֵיתֶךָ 所指责任的归属
  choice: 你的家
  alternative: 你的房屋；你的家室
  rationale: 希伯来语“房屋”在此首先指建筑物，却也可承载归于屋主及其家庭的责任。“家”保留这种语义张力，而不擅自缩窄为建筑或家庭。
translation_notes:
  register: 采用现代、庄重而易懂的律法语体。“要”表达命令效力；“免得”清楚连接防护措施与避免血债的目的。主文中的脚注标记与脚注完全对应。
