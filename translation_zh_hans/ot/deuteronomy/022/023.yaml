  text: כִּ֤י יִהְיֶה֙ נער בְתוּלָ֔ה מְאֹרָשָׂ֖ה לְ/אִ֑ישׁ וּ/מְצָאָ֥/הּ אִ֛ישׁ בָּ/עִ֖יר וְ/שָׁכַ֥ב עִמָּֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/023.yaml
  text: If there is a young woman[a], a virgin, pledged to a man, and another man finds her in the city and lies with her,
translation:
  language: zh_hans
  text: 如果有一个年轻女子，是处女，已经许配给一个男子[a]，另一个男子在城里遇见她，与她同寝，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “许配”指正式订立、具有法律约束力的婚约，并非现代意义上较为非正式的订婚。
    reason: 说明希伯来语 מְאֹרָשָׂה 所指婚约的正式性和约束力。
lexical_decisions:
- source_word: כִּי יִהְיֶה
  choice: 如果有
  rationale: 该组合引出假设性的案例法情形；“如果有”符合现代汉语法律条件句的表达，也保留其条件性质。
- source_word: נער（读作 נַעֲרָה）
  choice: 年轻女子
  rationale: 指已到适婚年龄的女性；“年轻女子”自然、庄重，也避免“女孩”可能带来的年龄过小之感。
- source_word: בְתוּלָה
  choice: 是处女
  rationale: 原词明确表示处女身份，在本段法律语境中具有重要意义，因此直接保留。
- source_word: מְאֹרָשָׂה לְאִישׁ
  choice: 已经许配给一个男子
  rationale: 表示正式且具有约束力的婚约关系。“许配”比现代口语中的“订婚”更能体现这种法律和社会效力；脚注补充说明。
- source_word: וּמְצָאָהּ אִישׁ
  choice: 另一个男子……遇见她
  rationale: 原文直译为“一个男子遇见她”。鉴于前面已提到她所许配的男子，译作“另一个男子”可自然消除汉语指代歧义；“遇见”不额外赋予强迫或蓄意搜寻的含义。
- source_word: בָּעִיר
  choice: 在城里
  rationale: 保留地点信息；此地点是下一节法律判断的重要背景。
- source_word: וְשָׁכַב עִמָּהּ
  choice: 与她同寝
  rationale: 保留原文对性行为较含蓄而法律化的说法；不在本节加入“强奸”或“强迫”等原文未明说的成分。
theological_decisions:
- issue: 本节是否应明确把性行为译成强迫行为
  choice: 采用中性的“与她同寝”，不添加“强奸”或“强迫”
  alternative: “强奸她”或“强迫她与他同寝”
  rationale: 本节所用动词本身没有明确标示强迫；上下文的法律区分还涉及地点及当事人的反应。译文应保留本节措辞的开放性，不用相邻经节预先替本节作出判断。
translation_notes:
  register: 采用现代、庄重且易懂的案例法语体。句末保留逗号，因为本节的条件句在下一节继续。脚注标记置于“已经许配给一个男子”之后，使其准确对应所解释的词语。
