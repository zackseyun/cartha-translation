base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/019.yaml
  text: Then they shall fine him one hundred shekels of silver and give them to the father of the young woman[a], because he has brought a bad name upon a virgin of Israel. And she shall be his wife; he may not send her away all his days.
translation:
  language: zh_hans
  text: 他们要罚他一百舍客勒银子，交给那年轻女子的父亲，因为他败坏了一名以色列处女的名声。她要作他的妻子；他终身不可把她送走[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“休弃她”或“与她离婚”。希伯来文直译为“把她送走”；在婚姻法律语境中可指离婚。
    reason: 说明“送走”在婚姻法律语境中的解释性译法，同时保留其字面表达。
lexical_decisions:
- source_word: וְעָנְשׁוּ
  choice: 他们要罚他
  rationale: 该动词在这一法律语境中指施加罚金；“罚”与后面的银子数额连用，简洁地表达金钱处罚。
- source_word: מֵאָה כֶסֶף
  choice: 一百舍客勒银子
  rationale: 希伯来文直译为“一百银子”，在法律和经济语境中指按重量计算的银；补出“舍客勒”使数额清楚，同时符合古代计量背景。
- source_word: לַאֲבִי הַנַּעֲרָה
  choice: 交给那年轻女子的父亲
  rationale: נַעֲרָה指适婚年龄的年轻女子；“年轻女子”是自然、庄重且不过时的现代汉语。
- source_word: כִּי הוֹצִיא שֵׁם רָע
  choice: 因为他使……蒙受恶名
  rationale: 保留“恶名”这一希伯来语意象，同时自然表达损害名誉的结果，不把措辞过度收窄为某一种具体诽谤行为。
- source_word: עַל בְּתוּלַת יִשְׂרָאֵל
  choice: 以色列的一个处女
  rationale: בְּתוּלָה在本段关于贞洁指控的法律语境中指处女；“以色列的”保留其群体归属含义。
- source_word: וְלוֹ תִהְיֶה לְאִשָּׁה
  choice: 她要作他的妻子
  rationale: 直接表达该条款所规定的婚姻身份，保留法律语气，不额外加入“继续”或“必须留在”等解释。
- source_word: לֹא יוּכַל
  choice: 不可
  rationale: 在法律文本中表示禁止或法律上的无权，而非单纯能力不足；“不可”准确而简洁。
- source_word: לְשַׁלְּחָהּ
  choice: 把她送走
  rationale: 保留动词“送走”的字面表达；在婚姻法律语境中可指休妻或离婚，具体法律含义在脚注中说明。
- source_word: כָּל יָמָיו
  choice: 终身
  rationale: 这是表示一生之久的希伯来语惯用语；“终身”比逐字译作“他一切的日子”更符合现代汉语法律表达。
theological_decisions:
- issue: 婚姻解除的法律惯用语
  choice: 把她送走
  alternative: 休弃她／与她离婚
  rationale: 希伯来文使用字面意为“送走”的动词，在婚姻法律中可指休妻。正文保留原文措辞及其一定程度的含蓄，脚注说明明确的法律含义，避免无提示地消除词义层次。
translation_notes:
  register: 采用现代、庄重、易懂的法律叙述语体。“舍客勒”保留古代重量和货币单位；“蒙受恶名”保存原文意象；分号呈现婚姻身份规定与终身禁令之间的紧密关系。
