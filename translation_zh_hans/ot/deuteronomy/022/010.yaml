  yaml_path: translation/ot/deuteronomy/022/010.yaml
  text: You shall not plow with an ox and a donkey together[a].
translation:
  language: zh_hans
  text: 不可用牛和驴一同耕地。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不要用牛和驴一起耕地。”
    reason: 提供较口语化的禁令表达，并以“一起”对应יַחְדָּו；意义不变。
lexical_decisions:
- source_word: לֹא
  choice: 不可
  rationale: 标准否定词，在本节法律语境中引出禁令；“不可”自然保留律法条文的庄重语气。
- source_word: תַחֲרֹשׁ
  choice: 耕地
  rationale: Qal未完成式第二人称阳性单数，在法律材料中表达禁令。中文以“不可”承载人称泛指和禁止语气，“耕地”准确表达农业行为。
- source_word: בְּשׁוֹר
  choice: 用牛
  rationale: שׁוֹר泛指牛类牲畜；本节涉及耕作，中文“牛”最自然，无须限定性别或阉割状态。介词בְּ表示使用的工具或役畜，译为“用”。
- source_word: וּבַחֲמֹר
  choice: 和驴
  rationale: חֲמוֹר是普通的“驴”；连词与前项相连，在中文中自然译为“和驴”。
- source_word: יַחְדָּו
  choice: 一同
  rationale: 该副词表明两种牲畜被搭配起来进行同一耕作行为；“一同”简洁、庄重，并保留原文没有进一步解释的范围。
theological_decisions:
- issue: 盟约律法中禁令的语力
  choice: 译作直接的法律禁令：“不可……”。
  alternative: 较口语化地译作“不要……”。
  rationale: 申命记此处是律法指令。“不可”既保留法律语体，也符合现代中文表达，不额外引入对禁令理由或象征意义的解释。
translation_notes:
  register: 采用现代、简洁而庄重的律法语体。“不可”表达直接禁令；“用牛和驴一同耕地”贴近希伯来语结构，同时符合普通现代汉语。主文中的脚注标记与脚注相对应。
