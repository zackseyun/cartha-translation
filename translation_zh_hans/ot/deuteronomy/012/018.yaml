revisions:
- from: 你却要在雅威你神面前，在雅威你神所选择的地方吃这些东西。你和你的儿女、仆婢，以及住在你城内的利未人[a]，都要在那里吃；你要在雅威你神面前，为你所做的一切欢喜[b]。
  to: 你却要在雅威你神面前，在雅威你神所选择的地方吃这祭物：你、你的儿子和女儿、男仆和女仆，以及住在你城内的利未人[a]；你要在雅威你神面前，因你手所做的一切而欢喜[b]。
  rationale: 修订将一次“吃”的命令与其参与者名单整合为单句，以冒号清楚引出名单；将复数泛称改为“这祭物”，更贴近原文单数宾语及上文祭礼语境；将家庭成员逐项译出；并把末句改为自然且忠实地表达“因／在你手所作的一切而欢喜”。脚注锚点仍分别紧随“利未人”和“欢喜”对应处。
