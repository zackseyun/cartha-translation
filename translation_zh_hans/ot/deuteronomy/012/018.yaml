base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/018.yaml
  text: Instead[b][a], you shall eat it before Yahweh your God in the place that Yahweh your God will choose—you and your son and your daughter and your male servant and your female servant and the Levite who is within your gates—and you shall rejoice before Yahweh your God in all to which you put your hand.
translation:
  language: zh_hans
  text: 你却要在雅威你神面前，在雅威你神所选择的地方吃这祭物：你、你的儿子和女儿、男仆和女仆，以及住在你城内的利未人[a]；你要在雅威你神面前，因你手所做的一切而欢喜[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“在你城门以内”；这是指住在你当地城镇或社群中的惯用说法。
    reason: cultural_note
  - marker: b
    text: 原文直译近于“在你手所伸出的一切中欢喜”，意思是因你所做、所经营或所从事的一切而欢喜。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: 你却要
  rationale: 该短语承接上一节的禁令，引出与之相对且受限定的做法。“却要”在现代汉语中自然表达这种限制性的转折；具体地点限制随下文完整呈现。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来语四字神名的通行学术拟音译出专名，不以“主”这一称号代替，也不采用源自另一种传统读法的“耶和华”。
- source_word: תֹּאכְלֶנּוּ
  choice: 吃这些东西
  rationale: 动词为第二人称阳性单数，带第三人称阳性单数宾语后缀，承接上一节所列的祭圣食物。汉语用“这些东西”比孤立的“吃它”自然，也清楚指回前文各项。
- source_word: לִפְנֵי יְהוָה אֱלֹהֶיךָ
  choice: 在雅威你神面前
  rationale: 保留 לִפְנֵי“在……面前／临在中”的空间与敬拜意味，并维持重复出现的盟约称谓。
- source_word: בַּמָּקוֹם אֲשֶׁר יִבְחַר יְהוָה אֱלֹהֶיךָ בּוֹ
  choice: 在雅威你神所选择的地方
  rationale: 准确传达申命记中有关神所选之地的固定表述；希伯来语回指该地的 בּוֹ 在汉语关系结构中无需重复译出。
- source_word: אַתָּה וּבִנְךָ וּבִתֶּךָ וְעַבְדְּךָ וַאֲמָתֶךָ
  choice: 你和你的儿女、仆婢
  rationale: 保留全家及家中服役者共同参与的范围；以“儿女、仆婢”简洁而完整地表达原文成对列出的男性与女性成员。
- source_word: וְהַלֵּוִי אֲשֶׁר בִּשְׁעָרֶיךָ
  choice: 以及住在你城内的利未人
  rationale: “在你的城门内”是指受该城管辖、居住在当地的惯用语。正文按现代汉语译为“住在你城内”，脚注保留其字面形象。
- source_word: וְשָׂמַחְתָּ
  choice: 你要……欢喜
  rationale: 表达命令语境中的欢庆，并保留在神面前共同用餐的喜乐色彩。
- source_word: בְּכֹל מִשְׁלַח יָדֶךָ
  choice: 为你所做的一切
  rationale: 该习语字面涉及“手所伸出／着手”的一切，实际指人所从事、经营或完成的事。正文采用自然汉语，脚注注明字面表达。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用以色列神的四字神名。译作“雅威”保留其专名性质，并依较通行的现代拟音；不用称号“主”取代，也不采用传统混合读音“耶和华”。
- issue: “在雅威面前”的含义
  choice: 保留“在……面前”
  alternative: 在雅威的临在中
  rationale: 原文既可表达神的临在，也与指定敬拜地点相关。直译式表达保留这种空间、礼仪和关系层面的张力，不将其缩减为单一解释。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“雅威你神”略带经文语体，以保留原文反复出现的盟约称谓；家庭成员列表适度合并为汉语对举词，但未删减其男女范围。脚注标记均置于对应正文之后。
