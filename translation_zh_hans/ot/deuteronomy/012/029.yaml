base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/029.yaml
  text: When Yahweh your God cuts off the nations before you, which you are going in there to dispossess, and you dispossess them and dwell in their land,
translation:
  language: zh_hans
  text: 当耶和华[a]你的上帝从你面前剪除你要进去赶走的那些民族，而你赶走他们、住在他们的土地上时，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “耶和华”代表希伯来文的神圣名字 YHWH；也常译作“雅威”。
    reason: 说明原文使用神的专名，而非“主”这一称号，并注明另一常见中文译形。
lexical_decisions:
- source_word: כִּי
  choice: 当……时
  rationale: 此处引出一个将来的时间情境，为下一节的警告铺垫；译作“当……时”比因果性的“因为”更符合上下文。
- source_word: יַכְרִית
  choice: 除灭
  rationale: 使役形在此表示使这些民族从以色列人面前消失、被清除；“除灭”保留强烈的清除含义，同时不额外限定具体方式。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代汉语中广为人知的神圣名字译形，保留原文专名而不以“主”这一称号替代。
- source_word: אֱלֹהֶיךָ
  choice: 你的上帝
  rationale: 忠实表达带第二人称阳性单数后缀的形式，并保持自然的现代汉语表达。
- source_word: הַגּוֹיִם
  choice: 那些民族
  rationale: 此处指居住在那地的各民族；“民族”直接对应原词，“那些”使汉语限定关系自然。
- source_word: אֲשֶׁר אַתָּה בָא שָׁמָּה לָרֶשֶׁת אֹתָם
  choice: 就是你将要到那里去赶走的民族
  rationale: 关系从句修饰“民族”；“到那里去”反映 בָא שָׁמָּה，“赶走”在以民族为宾语的征地语境中自然表达 ירש 的剥夺其占有之意。
- source_word: מִפָּנֶיךָ
  choice: 从你面前
  rationale: 保留希伯来语空间性习语，表示这些民族被从以色列人的前路和所在之处清除。
- source_word: וְיָרַשְׁתָּ אֹתָם
  choice: 并且你赶走他们
  rationale: 延续前面 ירש 的语境义，明确其宾语是当地民族；避免误译成“占有他们”。
- source_word: וְיָשַׁבְתָּ בְּאַרְצָם
  choice: 住在他们的土地上
  rationale: 自然表达居住、定居之意，并保留土地原属那些民族这一关系。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；主
  rationale: 原文使用神的专名，正文因此保留专名而不以称号“主”替代；“耶和华”是现代中文读者最熟悉且可辨识的传统译形，脚注说明另一常见拟音“雅威”。
- issue: ירש 以民族为宾语时的含义
  choice: 赶走
  alternative: 占有；剥夺其土地
  rationale: 原句的宾语是民族而非土地；“赶走”自然呈现因夺取其地而使其失去居所的语境义，同时不把经文扩展成更具体的行动描述。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。保留本节作为下一节前置时间从句的未完句式，以句末逗号衔接后文；“就是……”使较长的希伯来语关系从句在中文中清晰自然。
