base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/030.yaml
  text: Be careful for yourself, lest you be ensnared after them, after they have been destroyed from before you, and lest you inquire about their gods, saying, “How did these nations serve their gods, so that I too may do the same?”
translation:
  language: zh_hans
  text: 你要谨慎，免得那些民族从你面前被除灭以后，你落入他们的圈套；也免得你探究他们的神，说：“这些民族怎样事奉他们的神，我也要照样做。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִשָּׁמֶר לְךָ
  choice: 你要谨慎
  rationale: 希伯来语直译近于“你要为自己谨慎”；现代汉语用“你要谨慎”自然表达反身警戒的语气，而不添加原文没有的对象。
- source_word: פֶּן תִּנָּקֵשׁ אַחֲרֵיהֶם
  choice: 免得……你反倒落入他们的圈套
  rationale: נקש 的被动式含有“中圈套、被诱陷”之意；“反倒”体现这些民族被除灭后，以色列却仍受其宗教习俗诱陷的语境转折。
- source_word: הִשָּׁמְדָם מִפָּנֶיךָ
  choice: 从你面前被除灭以后
  rationale: 保留被动形态及 מִפָּנֶיךָ 的空间性表达，不在本节明说施事者。
- source_word: תִדְרֹשׁ לֵאלֹהֵיהֶם
  choice: 探究他们的神
  rationale: דרש 在此指查问、探究这些神明受敬奉的方式；“探究”既保留认知行为，也不预先限定为求问神谕。
- source_word: יַעַבְדוּ
  choice: 事奉
  rationale: עבד 用于对神明的宗教敬奉时译作“事奉”，符合庄重而通俗的圣经语域。
- source_word: וְאֶעֱשֶׂה כֵּן גַּם אָנִי
  choice: 我也要照样做
  rationale: 直接保留说话者意图仿效的含义；不额外解释其行为是敬拜、仪式或习俗，以维持原文概括性。
theological_decisions:
- issue: 禁令所针对的是一般知识调查，还是带有仿效意图的探究
  choice: 按句法保留探究与“我也要照样做”之间的直接联系
  alternative: 把禁令解释成禁止一切关于异教的知识了解
  rationale: 原文引语明确展示探究所趋向的仿效意图；译文不把经文扩大为对所有学术或历史了解的绝对禁令。
- issue: 被除灭的施事者
  choice: 使用被动式“被除灭”而不在本节补出施事者
  alternative: 明确译为“耶和华把他们除灭”
  rationale: 上下文可说明施事者，但本节希伯来语采用被动表达；译文保留其形式与焦点。
translation_notes:
  register: 采用现代、庄重、易懂的普通话。“圈套”传达宗教诱陷意象；句式保留原文两次“免得”的警告结构，并以分号使长句清晰。
