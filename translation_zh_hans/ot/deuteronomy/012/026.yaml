  text: רַ֧ק קָֽדָשֶׁ֛י/ךָ אֲשֶׁר יִהְי֥וּ לְ/ךָ֖ וּ/נְדָרֶ֑י/ךָ תִּשָּׂ֣א וּ/בָ֔אתָ אֶל הַ/מָּק֖וֹם אֲשֶׁר יִבְחַ֥ר יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/026.yaml
  text: But only your holy things that belong to you[a], and your vow offerings, you shall carry and come to the place that Yahweh will choose.
translation:
  language: zh_hans
  text: 不过，你拥有的圣物和许愿所献的祭物[a]，都要带上，来到雅威将要选择的地方。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“你所许的愿”；在这里的献祭语境中，也可指为履行这些愿而献的祭物。
    reason: 保留 נְדָרֶיךָ 在“誓愿本身”与“还愿祭物”之间的词义张力。
lexical_decisions:
- source_word: רַק
  choice: 不过
  rationale: 本词在上下文中既有限定作用，也与前文准许在各城宰牲食肉形成转折；“不过”自然表达这一衔接。
- source_word: קָדָשֶׁיךָ אֲשֶׁר יִהְיוּ לְךָ
  choice: 你所有的圣物
  rationale: קָדָשֶׁיךָ 泛指分别为圣、归于敬拜用途之物，不限定为某一种祭；后面的所属结构用“你所有的”简洁表达。
- source_word: וּנְדָרֶיךָ
  choice: 和许愿所献的祭物[a]
  rationale: נְדָרֶיךָ 字面为“你的愿”，但在本段献祭语境中也可具体指为履行所许之愿而献的祭物；正文采用语境中较自然的具体表达，并以脚注保留字面理解。
- source_word: תִּשָּׂא וּבָאתָ
  choice: 都要带上，来到
  rationale: 分别保留“携带”和“来到”两个连续动作，不将其合并为单纯的“带到”；“都”在汉语中标明前列两类对象均受动词支配。
- source_word: הַמָּקוֹם
  choice: 地方
  rationale: 保留申命记中反复出现的核心称谓“那地方”的普通语义，由后面的关系从句加以限定，不擅自增译为“圣所”。
- source_word: אֲשֶׁר יִבְחַר
  choice: 所选择的
  rationale: 未完成式在这里指向雅威将要指定的敬拜地点；汉语“所选择的”在此公式中自然，并能由语境承载其前瞻性。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文直接出现的四字神名，以现代汉语中对应 Yahweh 的音译“雅威”表达，避免用称号替代专名。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文使用盟约神名而非“主”这一称号；“雅威”较直接对应 Yahweh，也不采用源于另一套元音组合的传统形式。
- issue: נְדָרֶיךָ 指“所许的愿”还是“因愿而献的祭物”
  choice: 正文译为“许愿所献的祭物”，脚注保留“所许的愿”
  alternative: 你的愿
  rationale: 献祭及运送圣物到指定地点的语境支持具体指履行誓愿的祭物，但名词本身仍可指所许之愿，因此不将字面可能性排除。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“圣物”保留礼仪语境及原词的宽泛性；“带上，来到”既贴近希伯来文动作顺序，也保持汉语可读性。脚注标记已置于其所说明的“许愿所献的祭物”之后。
