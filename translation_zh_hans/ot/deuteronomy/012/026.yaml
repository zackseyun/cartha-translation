  rationale: 将“你所有的”改为“你拥有的”，避免无依据地加入数量上的“全部”之意，同时保留原文的所属限定。将“所选择的”改为“将要选择的”，体现יִבְחַר在此处的前瞻性。其余译文和脚注均能忠实、自然地传达原文。
