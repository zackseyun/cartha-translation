base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/014.yaml
  text: but only at the place that Yahweh will choose in one of your tribes—there you shall offer up your burnt offerings[b][a], and there you shall do all that I am commanding you.
translation:
  language: zh_hans
  text: 你只可在雅威将要在你一个支派中选择的地方献上你的燔祭；也要在那里行我吩咐你的一切事。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי אִם
  choice: 只可
  rationale: 承接上一节的禁令，表达限制性的转折和唯一获准的例外；“只可”在现代汉语中简洁自然。
- source_word: בַּמָּקוֹם
  choice: 在……地方
  rationale: 指雅威所指定的特定敬拜地点；保留原文定指而不预先认定具体地点。
- source_word: אֲשֶׁר יִבְחַר יְהוָה
  choice: 雅威……所选择的
  rationale: 未完成式在此具有前瞻意味，指雅威将要作出的选择；汉语定语结构自然表达关系从句。神名 יְהוָה 音译为“雅威”。
- source_word: בְּאַחַד שְׁבָטֶיךָ
  choice: 从你的一个支派中
  rationale: 保留“一个支派”这一原文表达；“从……中”自然表达所选地点位于其中一个支派之内。脚注说明这里实际涉及该支派的地域。
- source_word: שָׁם
  choice: 在那里
  rationale: 两次都予以保留，突出敬拜地点的唯一性。
- source_word: תַּעֲלֶה עֹלֹתֶיךָ
  choice: 献上你的燔祭
  rationale: עלה 的使役式与 עֹלָה 连用时表示献祭；“献上”既保留向上献呈的色彩，也符合现代汉语祭祀用语。“燔祭”准确指整牲焚烧的祭。
- source_word: וְשָׁם תַּעֲשֶׂה
  choice: 也要在那里行
  rationale: 保留连接词及重复的地点副词；“行”适合与所吩咐的事搭配，并保持 עשה 的宽泛含义。
- source_word: כֹּל אֲשֶׁר אָנֹכִי מְצַוֶּךָּ
  choice: 我吩咐你的一切事
  rationale: 准确表达命令涵盖的全部事项；汉语无需强行加入进行体，也可自然传达摩西当前颁布命令的语境。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”对应较有根据的现代拟音，并保留其作为专名的性质，不改译为称号“主”。
- issue: 中央敬拜地点是否具体指明
  choice: 保留为“所选择的地方”
  alternative: 圣所或耶路撒冷
  rationale: 本节没有点明该地点，也未明说耶路撒冷；译文不以后来的历史认定取代原文尚未具体指明的表达。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。保留第二人称单数“你”，对应摩西把以色列作为整体来称呼的原文形式；两次译出“在那里”，以维持原文的强调。
