revisions:
- from: 只可[a]在雅威从你的一个支派中[b]所选择的地方；你要在那里献上你的燔祭，也要在那里行我吩咐你的一切事。
  to: 你只可在雅威将要在你一个支派中选择的地方献上你的燔祭；也要在那里行我吩咐你的一切事。
  rationale: 修订使限制语直接修饰“献上”，将地点明确表述为位于某一支派的地域内，并以“将要选择”反映原文的前瞻性。其余术语和原文的重复强调均予保留。脚注a、b应分别锚定“只可”和“在你一个支派中”。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T04:57:25Z'
review_pass:
  verdict: revise
  source_fidelity: 原译基本准确保留了限制、所选地点、两次“在那里”、燔祭及“所吩咐的一切”。但“从你的一个支派中所选择的地方”在汉语中容易表示雅威从一个支派的人群中选出该地点，而非该地点位于一个支派的地域内；且未明确表达原文未完成式的前瞻性。
  naturalness: “只可……地方；你要……”使限制语与其所限制的“献上”隔开，句法略显悬置。将“只可”直接连到“献上”更符合现代汉语，也更清楚。
  terminology: “雅威”“支派”“燔祭”均恰当，并且没有将未指明的地点具体化。保留“燔祭”这一既定祭祀术语。
  issues:
  - severity: medium
    issue: “从你的一个支派中所选择的地方”造成地点关系歧义。
    rationale: בְּאַחַד שְׁבָטֶיךָ修饰“地方”的所在，意为该处在以色列某一支派的地域之内；中文“从……中所选择”通常修饰选择行为的来源或对象。
  - severity: low
    issue: 限制性短语没有直接支配“献上”。
    rationale: 原文的“惟独／除非在……地方”在语义上限定献燔祭的地点。中文改为“只可在……献上”可消除悬置并保留限制力。
  - severity: low
    issue: “所选择的”未体现该处“将要选择”的前瞻语气。
    rationale: יִבְחַר为未完成式；在本段语境中自然可译为“将要选择”，且不预断具体地点。
  revised_text: 你只可在雅威将要在你一个支派中选择的地方献上你的燔祭；也要在那里行我吩咐你的一切事。
  revised_footnotes:
  - marker: a
    text: 也可译作：“惟独要在雅威将要选择的地方。”
    reason: 希伯来语 כִּי אִם 在承接上一节的禁令时表达限制，也可译作“除……以外”。
  - marker: b
    text: 希伯来语直译“在你的一个支派中”，意思是该地点在以色列其中一个支派的地域内。
    reason: 说明“支派”在此具有地域定位的含义，避免误解为地点位于一群人当中。
  revision_rationale: 修订使限制语直接修饰“献上”，将地点明确表述为位于某一支派的地域内，并以“将要选择”反映原文的前瞻性。其余术语和原文的重复强调均予保留。脚注a、b应分别锚定“只可”和“在你一个支派中”。
