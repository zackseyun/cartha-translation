  text: לֹֽא תַעֲשׂ֣וּ/ן כֵּ֔ן לַ/יהוָ֖ה אֱלֹהֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/004.yaml
  text: You shall not do so to Yahweh your God[a][b].
translation:
  language: zh_hans
  text: 你们不可这样对待耶和华你们的神。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “这样”承接上文处置列国敬拜场所和物件的命令；以色列不可用那种方式对待耶和华。
    reason: cross_reference
  - marker: b
    text: “耶和华”原文为神名יהוה（YHWH）；也常拟音为“雅威”。
    reason: alternative_reading
lexical_decisions:
- source_word: לֹא תַעֲשׂוּן
  choice: 你们不可……对待
  rationale: לֹא与未完成式第二人称阳性复数在律法语境中构成直接禁令。“不可”自然体现禁止语气；结合受事对象，עשה译为“对待”比单说“做”更符合现代汉语。
- source_word: כֵּן
  choice: 这样
  rationale: 保留指回上文的简洁照应，所指是前文处置列国敬拜场所和物件的方式，不在正文中补足解释。
- source_word: לַיהוָה
  choice: 对待耶和华
  rationale: 介词ל在此表示行为所指向或涉及的对象；汉语以“对待”自然表达这种关系。יהוה音译为“耶和华”，采用现代中文圣经读者最熟悉的专名形式。
- source_word: אֱלֹהֵיכֶם
  choice: 你们的神
  rationale: 保留第二人称复数所属后缀，明确以色列与神的盟约关系。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。正文采用现代中文圣经传统中通行且易识别的“耶和华”；脚注说明原文形式及另一常见拟音，避免把传统读法当作无争议的古代发音。
- issue: 禁令“不可这样做”的具体范围
  choice: 保留“这样”的上文照应，并用“对待”表达对象关系
  alternative: 在正文展开为“不可照样毁坏耶和华的敬拜场所”
  rationale: 希伯来文措辞极简，具体所指依赖前文。正文不把一种较窄的解释直接写入，以保留其语境张力；脚注交代主要照应关系。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“你们不可”保持律法禁令的力度；“这样”保留原文的含蓄照应。正文不加入原文没有明说的“敬拜”或“毁坏”等宾语内容。
