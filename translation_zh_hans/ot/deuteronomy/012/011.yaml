    issue: “一个地方”未充分表达 הַמָּקוֹם 的特指性。
    rationale: 原文说的是“那地方／这个特定的地方”，由耶和华将要拣选；首次出现于汉语中也可自然译作“将要选择的那地方”，无须用不定的“一个地方”。
  - severity: medium
    issue: “愿物”将 נֶדֶר（誓愿）添加为具体献物。
    rationale: 原文为“你们一切上好的誓愿”，并未在此处明说“誓愿所献之物”。译作“誓愿”能保留原文的宽度和可能的语义联系，避免解释性增补。
