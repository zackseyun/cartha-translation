  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/הָיָ֣ה הַ/מָּק֗וֹם אֲשֶׁר יִבְחַר֩ יְהוָ֨ה אֱלֹהֵי/כֶ֥ם בּ/וֹ֙ לְ/שַׁכֵּ֤ן שְׁמ/וֹ֙ שָׁ֔ם שָׁ֣מָּ/ה תָבִ֔יאוּ אֵ֛ת כָּל אֲשֶׁ֥ר אָנֹכִ֖י מְצַוֶּ֣ה אֶתְ/כֶ֑ם עוֹלֹתֵי/כֶ֣ם וְ/זִבְחֵי/כֶ֗ם מַעְשְׂרֹֽתֵי/כֶם֙ וּ/תְרֻמַ֣ת יֶדְ/כֶ֔ם וְ/כֹל֙ מִבְחַ֣ר נִדְרֵי/כֶ֔ם אֲשֶׁ֥ר תִּדְּר֖וּ לַֽ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/011.yaml
  text: 'Then the place that Yahweh your God will choose for his name to dwell there—to that place you shall bring all that I am commanding you: your burnt offerings[a], your sacrifices, your tithes, the contribution of your hand, and all the choicest of your vows that you vow to Yahweh.'
translation:
  language: zh_hans
  text: 那时，耶和华你们的上帝将要选择的那地方，是为使他的名居住在那里[a]；你们要把我所吩咐你们的一切带到那里：你们的燔祭、祭物、十分之一、你们手中的奉献，以及你们向耶和华所许的一切上好的誓愿。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“把他的名安置在那里。”
    reason: 希伯来语动词为使役形式；正文按其字面意象译为“使他的名居住”，脚注保留较惯用的表达。
lexical_decisions:
- source_word: וְהָיָה
  choice: 那时……将
  rationale: 承接上文并引出将来的情形；“那时”在现代汉语中自然体现篇章推进。
- source_word: הַמָּקוֹם אֲשֶׁר יִבְחַר
  choice: 将选择一个地方
  rationale: 保留特定敬拜地点及前瞻性的未完成体语意；汉语首次引入时用“一个地方”较自然。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 直接译出四字神名，不以称号代替；“耶和华”是现代中文读者最熟悉的专名形式。
- source_word: לְשַׁכֵּן שְׁמוֹ שָׁם
  choice: 使他的名居住在那里
  rationale: 保留使役含义和“名居住”的申命记神学意象，不简化为“立他的名”。
- source_word: שָׁמָּה תָבִיאוּ
  choice: 你们要……带到那里
  rationale: “到那里”保留方向性，“要”自然表达命令语气。
- source_word: כָּל אֲשֶׁר אָנֹכִי מְצַוֶּה אֶתְכֶם
  choice: 我所吩咐的一切
  rationale: 以自然汉语表达分词所体现的当前命令语境，并完整保留“一切”。
- source_word: עוֹלֹתֵיכֶם
  choice: 你们的燔祭
  rationale: “燔祭”是准确且通行的中文祭祀术语，指全部焚烧的祭物。
- source_word: וְזִבְחֵיכֶם
  choice: 祭物
  rationale: 原词在此语境较宽泛，不限于某一种平安祭，因此采用概括性的“祭物”。
- source_word: מַעְשְׂרֹתֵיכֶם
  choice: 十分之一
  rationale: 直接表达所献的十分之一，较“什一奉献”少带后世术语色彩。
- source_word: וּתְרֻמַת יֶדְכֶם
  choice: 你们手中的奉献
  rationale: 保留“手”的具体意象，同时以现代汉语可理解的“奉献”表达所献之物。
- source_word: וְכֹל מִבְחַר נִדְרֵיכֶם
  choice: 你们……所许的一切上好的愿物
  rationale: מִבְחַר 表示精选、上好之物；“愿物”在中文中自然指履行所许之愿而献上的东西，又不把原文限定为某一祭类。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用神的专名；正文保留专名而不译作“主”。“耶和华”在现代简体中文圣经语境中辨识度最高，且不改变经文所指。
- issue: לְשַׁכֵּן שְׁמוֹ שָׁם 的“名居住”意象
  choice: 使他的名居住在那里
  alternative: 把他的名安置在那里
  rationale: 使役形式容许“使……居住”的理解；正文保留“名”与“居住”之间不寻常却重要的神学张力，不将其解释成上帝本体受地点限制，也不淡化为单纯命名。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。保留“燔祭”等必要的经文术语，同时避免过度古雅的句式；用分号和“就是”清楚引出祭物清单。
