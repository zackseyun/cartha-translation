  text: הִשָּׁ֣מֶר לְ/ךָ֔ פֶּֽן תַּעֲלֶ֖ה עֹלֹתֶ֑י/ךָ בְּ/כָל מָק֖וֹם אֲשֶׁ֥ר תִּרְאֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/013.yaml
  text: Be careful lest you offer up your burnt offerings in any place that you see;[a]
translation:
  language: zh_hans
  text: 你要谨慎，不可在你所看见的任何地方献上你的燔祭。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你要谨慎，不可在任何你看中的地方献上你的燔祭。”
    reason: “你所看见的”也可按语境理解为凭自己眼光选定、看中的地点。
lexical_decisions:
- source_word: הִשָּׁמֶר לְךָ
  choice: 你要谨慎
  rationale: 该表达是警戒公式，意为“你要当心／谨慎”。此译法自然、庄重，并保留命令和警告的语气。
- source_word: פֶּן
  choice: 不可
  rationale: פֶּן引出所警戒、防止的行为。汉语法律语境用“不可”比逐字译作“免得”更自然，同时准确表达禁止性警告。
- source_word: תַּעֲלֶה
  choice: 献上
  rationale: עלה的Hiphil在祭祀语境中指把祭物献上；“献上”保留其礼仪含义，又不额外扩大为一般性的“献祭”。
- source_word: עֹלֹתֶיךָ
  choice: 你的燔祭
  rationale: עֹלָה是全烧在坛上、烟气上升的祭物；“燔祭”是准确且通行的现代中文圣经礼仪用语。
- source_word: בְּכָל מָקוֹם
  choice: 在任何……地方
  rationale: 在否定警告中，בְּכָל מָקוֹם自然表示任意一个地方，即不可随处献祭；“任何”在现代汉语中清楚表达这一范围。
- source_word: אֲשֶׁר תִּרְאֶה
  choice: 你看中的
  rationale: 原文直译为“你所看见的”。结合任意选择献祭地点的语境，“看中的”自然表达凭自己眼光选定之意，但因原文也可仅作“看见”，以脚注保留较直译的可能。
theological_decisions:
- issue: 敬拜地点集中化的措辞
  choice: 将本节译为禁止在自己看中的任何地点献燔祭
  alternative: 扩展译为禁止在中央圣所以外的任何地方敬拜
  rationale: 上下文涉及指定敬拜地点，但本节明说的是燔祭及任意地点。正文不把禁令扩展到本节未明确提及的一切敬拜行为。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“你要谨慎，不可……”符合申命记训诫和法律语体；保留“燔祭”这一准确、通行的祭祀术语。
