  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּֽי יִרְחַ֨ק מִמְּ/ךָ֜ הַ/מָּק֗וֹם אֲשֶׁ֨ר יִבְחַ֜ר יְהוָ֣ה אֱלֹהֶי/ךָ֮ לָ/שׂ֣וּם שְׁמ֣/וֹ שָׁם֒ וְ/זָבַחְתָּ֞ מִ/בְּקָרְ/ךָ֣ וּ/מִ/צֹּֽאנְ/ךָ֗ אֲשֶׁ֨ר נָתַ֤ן יְהוָה֙ לְ/ךָ֔ כַּ/אֲשֶׁ֖ר צִוִּיתִ֑/ךָ וְ/אָֽכַלְתָּ֙ בִּ/שְׁעָרֶ֔י/ךָ בְּ/כֹ֖ל אַוַּ֥ת נַפְשֶֽׁ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/021.yaml
  text: If the place that Yahweh your God chooses to put his name there is too far from you[a], then you may slaughter from your herd and from your flock that Yahweh has given you, as I have commanded you[b], and you may eat within your gates according to all the desire of your soul.
translation:
  language: zh_hans
  text: 如果耶和华你的上帝选择立他名的地方离你太远，你就可以照我所吩咐你的，宰杀耶和华赐给你的牛群和羊群，并在你的城里[a]尽你所愿地吃[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“在你的城门内”；这里指你所属的城镇。
    reason: lexical_alternative
  - marker: b
    text: 直译“照你心中一切所愿的”；也可译作“按你的食欲”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי יִרְחַק מִמְּךָ
  choice: 如果……离你太远
  rationale: כִּי 在此引出法律条文中的条件情形；רחק 本义为“远、遥远”，“太远”自然表达距离造成实际不便的语境含义。
- source_word: הַמָּקוֹם אֲשֶׁר יִבְחַר
  choice: 选择……的地方
  rationale: 未完成式在法律话语中可有一般或将来指向；中文不强行标明时态，从而保留这种开放性。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的专名形式直接呈现四字神名，而不以“主”这一称号代替。
- source_word: לָשׂוּם שְׁמוֹ שָׁם
  choice: 立他名
  rationale: שׂים 是“放置、设立”；“立他名”简洁保留申命记圣所公式的意象，不扩展为“使他的名居住”。
- source_word: וְזָבַחְתָּ
  choice: 你就可以……宰杀牲畜
  rationale: 本段允许因中央圣所遥远而在当地宰杀牲畜食用；“可以”传达许可语气，“宰杀”避免误解为当地献祭。
- source_word: מִבְּקָרְךָ וּמִצֹּאנְךָ
  choice: 从……牛群和羊群中
  rationale: בקר 与 צאן 是大小牲畜的集合名词；“牛群和羊群”自然且保留集合意味，其中“羊群”可包括绵羊和山羊。
- source_word: כַּאֲשֶׁר צִוִּיתִךָ
  choice: 照我所吩咐你的
  rationale: 保留摩西第一人称说话者，并自然指向此前给出的命令。
- source_word: בִּשְׁעָרֶיךָ
  choice: 在你的城里
  rationale: “城门内”是指所属城镇或聚居地的转喻；正文采用自然现代汉语，脚注保留字面表达。
- source_word: בְּכֹל אַוַּת נַפְשֶׁךָ
  choice: 随心所欲地吃
  rationale: 该短语表达按自身全部愿望或食欲来吃；正文用自然汉语传达许可范围，脚注说明较贴字面的表达。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。正文采用现代中文圣经传统中最广为人知的专名“耶和华”，不以称号“主”取代；“雅威”是另一种较接近学术重构读音的音译。
- issue: וְזָבַחְתָּ 是否表达献祭
  choice: 宰杀牲畜供日常食用
  alternative: 献祭
  rationale: 上下文讨论因指定圣所遥远而准许在本地食肉，并非准许另设地方祭坛；因此译为“宰杀”而不译作“献祭”。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。句式保留原文的条件—许可结构，同时适当调整语序，使“照我所吩咐你的”紧接许可动作。正文以“城里”和“随心所欲地吃”确保普通读者易懂，字面意象则由脚注保留。
