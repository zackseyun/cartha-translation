  rationale: 修订删除原文未明说的“其他”，以“连肉带血”准确而自然地呈现燔祭与肉、血的并列关系，并将末句调整为主语明确的许可表达。脚注保留该未完成式可译作较形式化规定的可能性，不将语法上的讨论性语气强加为正文唯一含义。
