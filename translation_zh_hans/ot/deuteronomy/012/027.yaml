base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/027.yaml
  text: And you shall offer your burnt offerings[a], the flesh and the blood, on the altar of Yahweh your God; and the blood of your sacrifices shall be poured out on the altar of Yahweh your God, and you shall eat the flesh.
translation:
  language: zh_hans
  text: 你要把你的燔祭，连肉带血，献在耶和华你上帝的祭坛上；你祭牲的血要倒在耶和华你上帝的祭坛上，你可以吃那肉。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你要吃那肉。”
    reason: 原文末句为第二人称单数未完成式；在律法语境中可按上下文译作许可，亦可较形式化地译作规定。
lexical_decisions:
- source_word: וְעָשִׂיתָ עֹלֹתֶיךָ
  choice: 你要把燔祭……献在
  rationale: עָשָׂה本义为“做、办理”，与עֹלָה连用时指举行或献上燔祭；中文以“献”最自然，也准确表达祭祀语境。
- source_word: עֹלֹתֶיךָ
  choice: 你的燔祭
  rationale: עֹלָה指整只焚烧献上的祭物；“燔祭”是准确而通行的中文圣经术语。
- source_word: הַבָּשָׂר וְהַדָּם
  choice: 就是肉和血
  rationale: 保留原文对燔祭之“肉和血”的并列说明；“肉”在现代中文中比“肉体”更适合祭牲语境。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者最熟悉的专名形式音译四字神名，保留其作为以色列上帝之名的性质，而不以称号代替。
- source_word: וְדַם זְבָחֶיךָ
  choice: 你其他祭牲的血
  rationale: זֶבַח指宰杀献上的祭牲，通常有别于全烧的燔祭；补出“其他”使本节在中文中清楚区分前述燔祭与可食用之祭牲，但不改变所指。
- source_word: יִשָּׁפֵךְ
  choice: 要倒在
  rationale: Nifal形式表达血被倾倒在祭坛上的礼仪动作；中文祭祀法规中“倒在”自然明确。
- source_word: וְהַבָּשָׂר תֹּאכֵל
  choice: 肉却可以吃
  rationale: 此处与必须倒在祭坛上的血形成对照；未完成式在律法语境中可表达许可。“可以吃”避免误解为每次都必须吃，并用“却”呈现语境中的对比。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。译作“耶和华”保留专名，并符合普通现代中文读者长期通行的认知；“雅威”是较贴近现代学界拟音的可行选择。
- issue: 末句וְהַבָּשָׂר תֹּאכֵל的语气
  choice: 肉却可以吃
  alternative: 你要吃肉
  rationale: 希伯来语形式本身可被形式化地理解为指令或陈述，但在本章关于血不可吃、肉可吃的律法语境中，许可义更贴切；脚注保留较形式对应的译法。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“燔祭、祭牲、祭坛”保留必要的祭祀术语；句式清晰，避免古奥虚词。
