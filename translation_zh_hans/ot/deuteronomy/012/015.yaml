  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: רַק֩ בְּ/כָל אַוַּ֨ת נַפְשְׁ/ךָ֜ תִּזְבַּ֣ח וְ/אָכַלְתָּ֣ בָשָׂ֗ר כְּ/בִרְכַּ֨ת יְהוָ֧ה אֱלֹהֶ֛י/ךָ אֲשֶׁ֥ר נָֽתַן לְ/ךָ֖ בְּ/כָל שְׁעָרֶ֑י/ךָ הַ/טָּמֵ֤א וְ/הַ/טָּהוֹר֙ יֹאכְלֶ֔/נּוּ כַּ/צְּבִ֖י וְ/כָ/אַיָּֽל־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/015.yaml
  text: But whenever your soul desires[a], you may slaughter and eat meat, according to the blessing of Yahweh your God that he has given you, within all your gates. The unclean and the clean alike may eat it[b], as they would the gazelle or the deer.
translation:
  language: zh_hans
  text: 只是，你可以在你各城中[a]照着耶和华你上帝所赐给你的福分，随心所愿地宰牲吃肉。礼仪上不洁净的和洁净的都可以吃这肉，就像吃瞪羚和鹿一样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“在你所有城门内”；“城门”在这里代指各城镇或聚居地。
    reason: cultural_note
lexical_decisions:
- source_word: רַק
  choice: 不过
  rationale: 承接上文并引出限定或例外；“不过”在现代汉语中自然保留其转折、限制作用。
- source_word: בְּכָל אַוַּת נַפְשְׁךָ
  choice: 随心所愿地
  rationale: 原文直译近于“按你心里的全部愿望”；这里表达想吃肉时即可宰牲。“随心所愿地”自然传达希伯来习语，而不把“נפש”机械译成独立的“灵魂”。
- source_word: תִּזְבַּח וְאָכַלְתָּ בָשָׂר
  choice: 可以……宰牲吃肉
  rationale: 上下文是在准许非祭祀性的宰牲食肉，并非预测或绝对命令；“宰牲”比泛称“杀”更准确。
- source_word: כְּבִרְכַּת יְהוָה אֱלֹהֶיךָ אֲשֶׁר נָתַן לְךָ
  choice: 照着耶和华你上帝赐给你的福分而行
  rationale: 保留比较介词、名词“福分”以及上帝赐予的观念；补出“而行”使汉语句法完整，并表明食肉以所得供应为度。
- source_word: בְּכָל שְׁעָרֶיךָ
  choice: 在各城里
  rationale: “在你所有城门内”是以城门代指城镇辖区的希伯来表达；正文采用现代汉语中的实际所指，脚注说明原文意象。
- source_word: הַטָּמֵא וְהַטָּהוֹר
  choice: 无论礼仪上不洁净的还是洁净的
  rationale: 这里指人的礼仪状态而非道德品格；明示“礼仪上”可避免现代读者误解。
- source_word: יֹאכְלֶנּוּ
  choice: 都可以吃这肉
  rationale: 上下文表达许可；宾语代词回指所宰之牲的肉，译明“这肉”较清楚。
- source_word: כַּצְּבִי וְכָאַיָּל
  choice: 就像吃瞪羚和鹿一样
  rationale: 比较的是食用瞪羚和鹿这类非祭牲的方式；汉语补出“吃”以明确比较关系。“瞪羚”和“鹿”分别对应两种动物。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文明确使用四字神名。中文正文采用读者最熟悉且能作为专名识别的“耶和华”，不以“主”替代，从而保留神名性质。
- issue: 不洁净者获准食肉的范围
  choice: 明确为礼仪状态，并与洁净者同获许可
  alternative: 仅译“不洁净的和洁净的”，不说明性质
  rationale: 本节区分的是礼仪洁净状态；许可二者食用这种普通宰杀的肉，并不取消上下文中其他洁净条例。译文保留这一张力，不扩大为道德意义。
- issue: 宰牲食肉是命令还是许可
  choice: 译为“可以”
  alternative: 译为“要”或“必”
  rationale: 在申命记12章的语境中，本句准许人在本城非祭祀性地宰牲食肉，与必须送到指定地点献祭形成区别。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“随心所愿”传达希伯来习语，但由“照着……福分”限定，并非暗示毫无限度。“礼仪上不洁净”避免将 טמא 误读为道德败坏。
