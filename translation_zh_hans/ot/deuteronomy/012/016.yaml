  text: רַ֥ק הַ/דָּ֖ם לֹ֣א תֹאכֵ֑לוּ עַל הָ/אָ֥רֶץ תִּשְׁפְּכֶ֖/נּוּ כַּ/מָּֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/016.yaml
  text: Only, you shall not eat the blood; you shall pour it out on the ground like water.
translation:
  language: zh_hans
  text: 只是不可吃血；要把血倒在地上，像倒水一样。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רַק
  choice: 只是
  rationale: 承接上文准许吃肉的规定，引出一项限制；“只是”简洁自然，并保留其限定作用。
- source_word: הַדָּם
  choice: 血
  rationale: 希伯来文带定冠词，具体指所宰牲畜的血；现代汉语在此通常不必另译定指词。
- source_word: לֹא תֹאכֵלוּ
  choice: 不可吃
  rationale: 否定式未完成体在律法语境中表达禁令；“不可”既直接，又符合庄重的法规语体。
- source_word: עַל הָאָרֶץ
  choice: 在地上
  rationale: אֶרֶץ 可指地、土地或大地；此处描述倾倒血的具体位置，译作“地上”最切合语境。
- source_word: תִּשְׁפְּכֶנּוּ
  choice: 要把血倒
  rationale: שׁפך 表示倾倒、倒出，宾语后缀回指“血”；汉语明确重复“血”，比用代词更自然清楚。
- source_word: כַּמָּיִם
  choice: 像倒水一样
  rationale: 原文直译为“像水一样”。补出共享动作“倒”，使汉语比喻关系清楚，即把血如同水一般倒在地上，并不增添仪式含义。
theological_decisions:
- issue: 饮食律法中对血的处理
  choice: 直接译为禁止吃血，并命令将血倒在地上。
  alternative: 把血的象征意义或后来的神学解释写入正文。
  rationale: 本节给出具体法律指令，翻译应保留其明白含义，不把经文本身未明说的象征或后期解释带入正文。
translation_notes:
  register: 采用现代、庄重而易懂的法规语体。“不可”保留禁令力度；后半句用“像倒水一样”形成自然汉语，同时忠实表达原文的明喻。
