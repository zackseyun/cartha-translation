  text: אַבֵּ֣ד תְּ֠אַבְּדוּ/ן אֶֽת כָּל הַ/מְּקֹמ֞וֹת אֲשֶׁ֧ר עָֽבְדוּ שָׁ֣ם הַ/גּוֹיִ֗ם אֲשֶׁ֥ר אַתֶּ֛ם יֹרְשִׁ֥ים אֹתָ֖/ם אֶת אֱלֹהֵי/הֶ֑ם עַל הֶ/הָרִ֤ים הָֽ/רָמִים֙ וְ/עַל הַ/גְּבָע֔וֹת וְ/תַ֖חַת כָּל עֵ֥ץ רַעֲנָן־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/002.yaml
  text: You must surely destroy all the places where the nations whom you are dispossessing served their gods[a], on the high mountains, on the hills, and under every green tree.
translation:
  language: zh_hans
  text: 你们务要彻底毁灭所有的地方，就是你们所要赶逐的各族在那里敬奉他们的神明的地方[a]：无论是在高山上、丘陵上，还是在每一棵青翠的树下。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“各族在那里事奉他们的神明”。这里的希伯来语动词既可表示“服事”，用于神明时也有“敬拜”的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַבֵּד תְּאַבְּדוּן
  choice: 务要彻底毁掉
  rationale: 不定式绝对式与同根限定动词连用，加强命令语气。“务要”体现命令的强调，“彻底毁掉”表达毁灭行动的完全性，符合现代汉语。
- source_word: כָּל הַמְּקֹמוֹת
  choice: 那些地方
  rationale: מָקוֹם在本节指各族敬奉神明的具体地点。译文随后用“就是……的地方”加以限定；“那些地方”自然且保留具体地点的焦点。
- source_word: עָבְדוּ שָׁם ... אֶת אֱלֹהֵיהֶם
  choice: 在那里敬奉他们神明
  rationale: עבד以神明为宾语时指宗教性的服事或敬拜。“敬奉”兼有服事与崇敬之意，比单用“事奉”更易使普通读者明确其宗教含义；脚注保留“事奉”的形式对应。
- source_word: הַגּוֹיִם
  choice: 各族
  rationale: 这里指迦南地中将被以色列人赶走的不同民族。“各族”在现代汉语中自然，也避免“外邦人”可能带入后期宗教术语色彩。
- source_word: אֲשֶׁר אַתֶּם יֹרְשִׁים אֹתָם
  choice: 你们将要赶走的
  rationale: ירשׁ在征服语境中兼有取得产业和使原居民失去占有的含义。以人为宾语时，“赶走”清楚表达取代、逐出的语境；领受土地的含义由上下文承载。
- source_word: עַל הֶהָרִים הָרָמִים
  choice: 在高山上
  rationale: 直接表达名词与形容词组合，并保留这些敬拜地点位于高处的空间意象。
- source_word: וְעַל הַגְּבָעוֹת
  choice: 丘陵上
  rationale: גְּבָעוֹת通常指低于山的丘陵；译作“丘陵”可与前面的“高山”形成自然区分。
- source_word: וְתַחַת כָּל עֵץ רַעֲנָן
  choice: 在一切枝叶繁茂的树下
  rationale: רַעֲנָן表示青翠、茂盛、充满生机。“枝叶繁茂”比传统的“青翠树”更自然具体，同时保留荫蔽而繁盛的祭祀地点意象。
theological_decisions:
- issue: 命令所针对的是异教敬拜地点还是敬拜习俗
  choice: 译文直接以“那些地方”为毁灭对象
  alternative: 概括译为废除各族的异教敬拜
  rationale: 希伯来文本明确以“所有地方”为动词宾语，焦点是与各族敬奉神明有关的具体场所；其对敬拜习俗的更广泛含义不在译文中额外展开。
- issue: עבד用于神明时应译为“敬奉”还是“敬拜”
  choice: 敬奉
  alternative: 敬拜；事奉
  rationale: “敬奉”既表明宗教敬拜，又保留עבד所含服事、效忠的语义层次，不把它缩窄为单一礼仪动作。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“务要”保留强烈命令语气；句中以“就是”展开关系从句，避免多层前置修饰造成晦涩。使用“神明”指各族所敬奉的多个神，避免与指以色列之神的惯常称谓混淆。
