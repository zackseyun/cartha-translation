base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/007.yaml
  text: And there you shall eat before Yahweh your God[a], and you shall rejoice in all the work of your hand, you and your households, with which Yahweh your God has blessed you.
translation:
  language: zh_hans
  text: 你们要在那里，在雅威你们的上帝面前吃；你们和你们全家要因雅威你的上帝所赐福给你的、你们手所做的一切事[a]而欢喜。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“你们一切所经营的事”或“你们手所从事的一切”。希伯来语字面为“你们手的一切伸出”。
    reason: 说明希伯来语习语 מִשְׁלַח יָד 的字面意象及可接受的译法。
lexical_decisions:
- source_word: וַאֲכַלְתֶּם שָׁם
  choice: 你们要在那里……吃
  rationale: 连续式完成时在本段律法指示中带有命令或将来实行的意味；“在那里”保留对上文所选之地的指称。
- source_word: לִפְנֵי יְהוָה אֱלֹהֵיכֶם
  choice: 在雅威你们的上帝面前
  rationale: “在……面前”自然表达 לִפְנֵי 所指在上帝临在中敬拜；将神名 יְהוָה 音译为“雅威”。
- source_word: וּשְׂמַחְתֶּם
  choice: 都要……欢喜
  rationale: 保留与前一动词平行的指示语气，也传达共同庆贺的含义。
- source_word: בְּכֹל מִשְׁלַח יֶדְכֶם
  choice: 因手所做的一切
  rationale: מִשְׁלַח יָד 字面为“手的伸出”，是指人着手从事、经营或取得成果的事；正文保留“手”的希伯来语意象，以“因”表达欢喜的缘由。
- source_word: אַתֶּם וּבָתֵּיכֶם
  choice: 你们和你们全家
  rationale: 这里的“家”指家庭或家户成员，并非房屋；“全家”符合现代汉语表达。
- source_word: אֲשֶׁר בֵּרַכְךָ יְהוָה אֱלֹהֶיךָ
  choice: 因为雅威你的上帝已经赐福给你
  rationale: 关系词 אֲשֶׁר 在此可引出对欢喜缘由的说明；保留原文由复数称呼转为单数称呼的变化。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；音译“雅威”旨在保留其作为以色列上帝之专名的性质，而不以“主”这一称号替代。
- issue: 复数与单数称呼的转换
  choice: 前半句用“你们”，末句用“你的……给你”
  alternative: 全句统一译作复数“你们”
  rationale: 申命记常在把以色列视为群体与视为一个整体之间转换。原文此处确由复数后缀转为单数后缀，正文予以保留。
- issue: אֲשֶׁר 所引从句与前文的关系
  choice: 译为原因说明：“因为……已经赐福给你”
  alternative: 译为关系从句：“雅威你的上帝借着这一切赐福给你”
  rationale: 希伯来语关系词的具体连接具有一定弹性；原因式在汉语中自然，并保留欢喜源于上帝赐福的意义，而不限定赐福仅指某一种成果。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“你们全家”比“你们的家户”更自然；保留“在……面前”“手所做的”等圣经语体意象，但避免生硬直译。脚注标记紧接其实际说明的短语。
