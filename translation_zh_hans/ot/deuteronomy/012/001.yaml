  to: 以下是你们在雅威，就是你祖先的上帝，赐给你为业的土地上、在你们活在地上的一切日子，必须谨守遵行的律例和典章。[a][b][c]
  rationale: 修订将时间短语直接连于“必须谨守遵行”，避免重复增设“遵守”的谓语，并以更清楚、自然的现代汉语标明神名后的同位语。脚注a删去可能造成时代错置的“判例”，其余脚注内容和所有锚点均保留且与相应语句相符。
