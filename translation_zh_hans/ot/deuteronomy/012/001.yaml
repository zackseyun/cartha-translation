  terminology: “律例和典章”“谨守遵行”“为业”均适合申命记的法律和盟约语体。“判例”是现代法学中较专门的术语，且可能将 מִשְׁפָּטִים 误限为具有先例拘束力的判决，宜改为较宽泛的“法令”或“审判条例”。“雅威”一致保留原文神名。
