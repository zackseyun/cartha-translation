  text: אֵ֠לֶּה הַֽ/חֻקִּ֣ים וְ/הַ/מִּשְׁפָּטִים֮ אֲשֶׁ֣ר תִּשְׁמְר֣וּ/ן לַ/עֲשׂוֹת֒ בָּ/אָ֕רֶץ אֲשֶׁר֩ נָתַ֨ן יְהוָ֜ה אֱלֹהֵ֧י אֲבֹתֶ֛י/ךָ לְ/ךָ֖ לְ/רִשְׁתָּ֑/הּ כָּל הַ/יָּמִ֔ים אֲשֶׁר אַתֶּ֥ם חַיִּ֖ים עַל הָ/אֲדָמָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/001.yaml
  text: These are the statutes and the judgments that you shall be careful to do in the land that Yahweh[a], the God of your fathers, has given you to possess[c][b], all the days that you are living on the earth.
translation:
  language: zh_hans
  text: 以下是你们在雅威，就是你祖先的上帝，赐给你为业的土地上、在你们活在地上的一切日子，必须谨守遵行的律例和典章。[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “典章”也可译作“法令”或“审判条例”；原文以两个不同的法律术语与“律例”并列。
    reason: lexical_alternative
  - marker: b
    text: 原文在“你的祖先”和“赐给你”中用单数“你”，把以色列作为一个整体称呼；在“你们活着”中则改用复数。
    reason: source_form
  - marker: c
    text: “地上”原文也可译作“土地上”或“地面上”；有人将它较窄地理解为前面所说的土地。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: 以下是
  rationale: 用自然的现代汉语引出下文的法律条文，并补出汉语所需的判断结构。
- source_word: הַחֻקִּים וְהַמִּשְׁפָּטִים
  choice: 律例和典章
  rationale: 保留两个并列法律术语的区别；“律例”侧重制定的条例，“典章”涵盖司法裁定及规范。
- source_word: אֲשֶׁר תִּשְׁמְרוּן לַעֲשׂוֹת
  choice: 必须谨守遵行
  rationale: “谨守”表达 שׁמר 的审慎留意，“遵行”表达 עשה 的实际履行；“必须”传达此处命令性的语气。
- source_word: בָּאָרֶץ
  choice: 在……那片土地上
  rationale: 上下文指以色列将要取得的应许之地；“那片土地”清楚区别于句末的 אֲדָמָה。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按辅音形式 YHWH 所代表的上帝专名作现代汉语音译，不以称号替代专名。
- source_word: אֱלֹהֵי אֲבֹתֶיךָ
  choice: 你祖先的上帝
  rationale: “祖先”在现代汉语中自然涵盖历代先辈，并保留盟约公式；原文此处用第二人称单数“你”。
- source_word: לְרִשְׁתָּהּ
  choice: 为业
  rationale: 简洁表达 ירשׁ 在申命记土地语境中取得并持有产业的含义，同时保留“承受产业”的意味。
- source_word: כָּל הַיָּמִים אֲשֶׁר אַתֶּם חַיִּים
  choice: 只要你们活着……就要一直
  rationale: 以自然汉语表达原文涵盖一生全部时日的持续性。
- source_word: עַל הָאֲדָמָה
  choice: 活在地上
  rationale: 保留 אֲדָמָה 可指地面、大地或土地的语义宽度，不把它无根据地限定为前述应许之地。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。采用“雅威”作为 YHWH 的汉语音译，保留其专名性质；“耶和华”反映较晚形成的混合读法，“上主”则是称号替代。
- issue: לְרִשְׁתָּהּ 的产业含义
  choice: 赐给你为业
  alternative: 赐给你去占有；赐给你去承受
  rationale: “为业”既能表达上帝赐予，又不抹去 ירשׁ 所含取得并持有土地的意味，避免只强调被动继承或军事占领。
- issue: 称谓中单数与群体训令中复数的转换
  choice: 保留“你祖先”与“你们”
  alternative: 全部统一为“你们”
  rationale: 希伯来文在“你的祖先、给你”处用单数，随后在“你们活着”处用复数。这种申命记常见的群体称呼切换具有文本意义，不宜完全抹平。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“谨守遵行”保留法律与盟约语体，但整句重组为符合汉语习惯的条件结构。脚注标记均置于与其内容直接相关的位置；末句中的[b]说明本节单复数称呼的切换。
