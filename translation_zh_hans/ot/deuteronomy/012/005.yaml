  text: כִּ֠י אִֽם אֶל הַ/מָּק֞וֹם אֲשֶׁר יִבְחַ֨ר יְהוָ֤ה אֱלֹֽהֵי/כֶם֙ מִ/כָּל שִׁבְטֵי/כֶ֔ם לָ/שׂ֥וּם אֶת שְׁמ֖/וֹ שָׁ֑ם לְ/שִׁכְנ֥/וֹ תִדְרְשׁ֖וּ וּ/בָ֥אתָ שָֽׁמָּ/ה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/005.yaml
  text: But to the place that Yahweh your God will choose from all your tribes to put his name there[a], for his dwelling, you shall seek, and there you shall go.
translation:
  language: zh_hans
  text: 但你们要寻求耶和华你们的上帝从你们各支派中所选择的地方；他要把自己的名安置在那里，那里要作他的居所[a]；你们要到那里去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“把自己的名安置在那里，供他居住。”这句希伯来语十分紧凑；可理解为强调上帝住在那里、那地方是他的居所，或两者兼有。
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי אִם
  choice: 但……要
  rationale: 本短语承接上文的禁令，引出与之相对的正面命令；用“但……要”自然表达转折和替代关系。
- source_word: הַמָּקוֹם
  choice: 地方
  rationale: 保留原文具体却尚未指明的地点含义。
- source_word: יִבְחַר
  choice: 所选择的
  rationale: 未完成式在此指耶和华将要选定敬拜地点；汉语定语结构自然，且不把地点具体化。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神名音译，保留其专名性质，而不以称号替代。
- source_word: אֱלֹהֵיכֶם
  choice: 你们的上帝
  rationale: 忠实表达复数第二人称所属关系及其盟约语境中的称谓。
- source_word: מִכָּל שִׁבְטֵיכֶם
  choice: 从你们各支派中
  rationale: 清楚表达该地点是从以色列各支派所居之地中选出的。
- source_word: לָשׂוּם אֶת־שְׁמוֹ שָׁם
  choice: 他要立自己名的地方
  rationale: “立自己的名”贴近 שׂוּם 的基本含义，也保留神名与其认可之敬拜地点相联的表达。补出“地方”使中文顺畅。
- source_word: לְשִׁכְנוֹ
  choice: 作为他的居所
  rationale: 保留该紧凑结构中“居所／居住”的含义，不额外补入“使自己居住”等原文未明说的使役意味。
- source_word: תִדְרְשׁוּ
  choice: 你们要寻求
  rationale: 保留 דרש 的主动寻求意味；在本语境中，所寻求的是耶和华指定的敬拜地点。
- source_word: וּבָאתָ שָׁמָּה
  choice: 你们要到那里去
  rationale: 按汉语视角自然翻译 בוא，并保留 שָׁמָּה 的方向性“到那里”。原文虽用单数动词，却是对全体以色列说话，中文用“你们”表达更自然。
theological_decisions:
- issue: 神名与中央敬拜地点
  choice: 耶和华……立自己名的地方……作为他的居所
  alternative: 耶和华……把自己的名安置在那里，使他住在那里
  rationale: 译文同时保留“名”与“居所”两个主题，却不预先断定二者之间更具体的神学关系，也不把后来的圣殿神学细节带入本节。
- issue: לְשִׁכְנוֹ 的句法归属
  choice: 作为他的居所
  alternative: 在那里设立他的名作为他的居所／为使他居住在那里
  rationale: 希伯来语表达紧凑，可侧重神的居住、地点作为居所，或两者兼有；正文采用较简洁的名词性表达，脚注保留其他可能理解。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“耶和华”保留神名，“上帝”采用现代标准中文称谓。句式经过适度重组，以免逐词直译造成生硬，同时保留原文关于“名”与“居所”的歧义和张力。
