revisions:
- from: 但你们要寻求耶和华你们的上帝从你们各支派中所选择的地方，就是他要立自己名的地方[a]，作为他的居所；你们要到那里去。
  to: 但你们要寻求耶和华你们的上帝从你们各支派中所选择的地方；他要把自己的名安置在那里，那里要作他的居所[a]；你们要到那里去。
  rationale: 修订以“把自己的名安置在那里”对应“放置他的名在那里”，并以“那里要作他的居所”使中文清楚指向所选的地方，而不把有争议的紧凑希伯来语结构过度释义为使役行动。脚注保留“居住”向的替代理解及原文的句法张力。
