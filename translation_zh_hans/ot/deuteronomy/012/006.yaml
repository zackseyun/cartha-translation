base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/006.yaml
  text: And there you shall bring your burnt offerings[a], your sacrifices, your tithes, the contribution of your hand, your vow offerings, your freewill offerings[b], and the firstborn of your herd and of your flock.
translation:
  language: zh_hans
  text: 你们要把燔祭、祭牲、十分之一、手中所献的礼物[a]、还愿祭[b]、甘心祭，以及牛群和羊群所生头胎的牲畜，都带到那里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“你们手的奉献”；这里的“手”强调这是人亲自带来献上的。也可译“你们手中的奉献”或“你们所献的礼物”。
    reason: lexical_alternative
  - marker: b
    text: 直译“你们所许的愿”；在这份祭物清单中，所指很可能是为履行所许之愿而献的祭。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲבֵאתֶם
  choice: 你们要……带到
  rationale: בוא 的使役形在此是律法指令，表示把所列之物带到前文指定的地方；“要……带到”在现代汉语中自然地表达规定性语气。
- source_word: שָׁמָּה
  choice: 那里
  rationale: 保留指向前文敬拜地点的方位副词含义。
- source_word: עֹלֹתֵיכֶם
  choice: 燔祭
  rationale: עוֹלָה 是整只焚烧献上的祭，中文圣经传统用语“燔祭”准确而简洁。
- source_word: זִבְחֵיכֶם
  choice: 祭牲
  rationale: זֶבַח 指宰杀献上的祭物，与前面的燔祭并列；“祭牲”既保留宰牲献祭的具体含义，也避免与整份祭物清单中的泛称“祭”混淆。
- source_word: מַעְשְׂרֹתֵיכֶם
  choice: 十分之一
  rationale: 该词指献上的十分之一；采用透明的现代汉语表达，比术语化的“什一”更易为普通读者理解。
- source_word: תְּרוּמַת יֶדְכֶם
  choice: 手中所献的礼物
  rationale: תְּרוּמָה 指分别出来献上的礼物或奉献，附属短语“你们的手”突出亲手呈献；正文保留“手”的意象，同时用自然汉语表达。
- source_word: נִדְרֵיכֶם
  choice: 还愿祭
  rationale: 字面为“你们的愿”，但在祭物清单中实际所带来的是履行所许之愿的祭物；正文译出语境含义，脚注保留字面可能。
- source_word: נִדְבֹתֵיכֶם
  choice: 甘心祭
  rationale: 指并非因许愿而必须献、而是自愿献上的祭物；“甘心祭”简洁地与“还愿祭”区分。
- source_word: בְכֹרֹת בְּקַרְכֶם וְצֹאנְכֶם
  choice: 牛群和羊群中头生的
  rationale: בקר 与 צאן 分别指大牲畜和羊群等小牲畜；“牛群和羊群”在本处清楚自然，“头生的”保留 בכור 的献祭类别含义。
theological_decisions:
- issue: נִדְרֵיכֶם 是指所许的愿，还是因许愿而献的祭物
  choice: 正文译作“还愿祭”
  alternative: 你们所许的愿
  rationale: 整节列举要实际带到敬拜地点的祭物，因此语境倾向于指履行誓愿时献上的祭；脚注说明希伯来文的字面表达，以免抹去词义张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。保留“燔祭”等必要且通行的祭祀术语，其余尽量使用普通读者可直接理解的表达。并列清单以顿号组织，在末项前用“以及”帮助阅读。
