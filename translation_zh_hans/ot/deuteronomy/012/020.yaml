base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/020.yaml
  text: When the LORD your God enlarges your territory, as he has promised you, and you say, “I want to eat meat,” because you crave to eat meat, you may eat meat according to all the desire of your soul.
translation:
  language: zh_hans
  text: 当耶和华你的神扩张你的疆界，正如他所应许你的，而你说：“我想吃肉”，因为你渴望吃肉，你就可以尽你所愿吃肉。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יַרְחִיב ... אֶת־גְּבוּלְךָ
  choice: 扩张你疆界
  rationale: 保留“使边界扩大”的领土含义，同时采用自然、庄重的现代汉语表达。
- source_word: וְאָמַרְתָּ אֹכְלָה בָשָׂר
  choice: 你若说：‘我想吃肉’
  rationale: 希伯来语意愿式表达的是想吃肉的愿望，而非单纯预告将要吃肉；“若说”也自然承接条件语境。
- source_word: תְאַוֶּה נַפְשְׁךָ
  choice: 你心里想吃肉
  rationale: נפשׁ在这里指人的欲望或食欲；直译为“你的灵魂渴望”在现代汉语中生硬且容易造成不必要的身心二分。
- source_word: בְּכָל־אַוַּת נַפְשְׁךָ
  choice: 随心所欲地
  rationale: 准确传达“按你全部的心愿／食欲”这一许可性表达，并与前句的愿望语义相呼应。
theological_decisions:
- issue: 神圣名号 יהוה 的译法
  choice: 耶和华
  alternative: 雅威／上主
  rationale: 采用简体中文圣经读者最熟悉的专名形式，明确保留原文专有神名的性质，而不把它泛化为普通称号。
- issue: 吃肉许可的范围
  choice: 就可以随心所欲地吃肉
  alternative: 可以任意吃肉
  rationale: 原文确实给出广泛许可，但其具体限制由相邻经文继续说明；本节不提前加入或消解那些限制。
translation_notes:
  register: 采用现代、清楚而庄重的叙述语体。保留原文“吃肉”三次重复中的核心强调，但将 נפשׁ 的两种欲望表达分别处理为“心里想”和“随心所欲”，避免僵硬直译，同时保持语义呼应。
