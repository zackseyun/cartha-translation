revisions:
- from: 耶和华你的神照他所应许你的，扩张你疆界的时候，你若说：‘我想吃肉’，因为你心里想吃肉，就可以随心所欲地吃肉。
  to: 当耶和华你的神扩张你的疆界，正如他所应许你的，而你说：“我想吃肉”，因为你渴望吃肉，你就可以尽你所愿吃肉。
  rationale: 修订保留原文的神名、领土扩展、三次“吃肉”的重复及欲望—许可的关系；仅消除“若”所增添的条件色彩，并以“尽你所愿”替代可能过度引申的“随心所欲”。
  reviewer_model: gpt-5.6-terra
