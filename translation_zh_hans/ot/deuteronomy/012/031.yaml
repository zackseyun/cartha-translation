  text: לֹא תַעֲשֶׂ֣ה כֵ֔ן לַ/יהוָ֖ה אֱלֹהֶ֑י/ךָ כִּי֩ כָּל תּוֹעֲבַ֨ת יְהוָ֜ה אֲשֶׁ֣ר שָׂנֵ֗א עָשׂוּ֙ לֵ/אלֹ֣הֵי/הֶ֔ם כִּ֣י גַ֤ם אֶת בְּנֵי/הֶם֙ וְ/אֶת בְּנֹ֣תֵי/הֶ֔ם יִשְׂרְפ֥וּ בָ/אֵ֖שׁ לֵֽ/אלֹהֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/031.yaml
  text: You shall not do so to Yahweh your God[a], for they have done for their gods every abomination of Yahweh that he hates, for they even burn their sons and their daughters in the fire for their gods.
translation:
  language: zh_hans
  text: 不可为雅威你的上帝这样做，因为他们为自己的神做了雅威所憎恶的一切可憎之事；他们甚至在火中焚烧自己的儿子和女儿，献给自己的神。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֹא תַעֲשֶׂה כֵן לַיהוָה אֱלֹהֶיךָ
  choice: 不可为雅威你的上帝照样行
  rationale: 保留第二人称单数的直接禁令，并让“照样行”回指上文所说列国敬拜其神的方式。לַיהוָה 表示行为所面向的对象；译作“为……行”符合祭祀语境，也避免误解为不可用某种方式‘对待’上帝。
- source_word: כָּל תּוֹעֲבַת יְהוָה אֲשֶׁר שָׂנֵא
  choice: 雅威所憎恶的一切可憎之事
  rationale: תּוֹעֵבָה 采用力度强而自然的“可憎之事”，שָׂנֵא 译为“憎恶”。希伯来语的构造关系若直译成“雅威的一切可憎之事”在中文中容易被误解为这些事属于雅威，因此用关系结构表达其评价，同时保留两重强烈措辞。
- source_word: עָשׂוּ לֵאלֹהֵיהֶם
  choice: 他们为自己的神做了
  rationale: לֵאלֹהֵיהֶם 在祭祀语境中表示这些行为是为诸神而行；“自己的神”自然传达复数附属形式及与雅威的对比。
- source_word: כִּי גַם
  choice: 他们甚至
  rationale: 第二个 כִּי 引出支持前述判断的突出例证，גַם 带有递进和强调；中文以分号承接，并用“甚至”显明其骇人程度。
- source_word: אֶת בְּנֵיהֶם וְאֶת בְּנֹתֵיהֶם
  choice: 自己的儿女
  rationale: “儿女”在现代中文中简洁而明确地包含儿子和女儿，保留原文对两者的明说。
- source_word: יִשְׂרְפוּ בָאֵשׁ
  choice: 放在火中焚烧
  rationale: 保留实际以火焚烧的含义，不将其弱化或比喻化；“火中”对应 בָאֵשׁ。
- source_word: לֵאלֹהֵיהֶם
  choice: 献给自己的神
  rationale: 句末的 ל 表明焚烧儿女这一行为所面向的祭祀对象。“献给”在此清楚表达奉献或献祭方向，但不额外规定具体礼仪程序。
theological_decisions:
- issue: 神圣名号 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名。采用“雅威”作为较贴近通常学术重构读音的现代汉语音译，不以“主”替代原文的专名。
- issue: תּוֹעֵבָה 与 שָׂנֵא 所表达的神圣道德评价
  choice: 保留“可憎之事”和“憎恶”的强烈措辞
  alternative: 译作较弱的“不合宜之事”和“不喜悦”
  rationale: 原文明确表达雅威对这些敬拜行为的强烈否定，尤其以焚烧儿女为例；不应淡化为一般的不赞同。
- issue: 焚烧儿女与诸神之间的关系
  choice: “献给自己的神”
  alternative: “为自己的神”或“向自己的神”
  rationale: לֵאלֹהֵיהֶם 表明行为的祭祀指向。“献给”符合上下文，但不进一步断言原文未说明的神祇名称、仪式细节或宗派解释。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“不可”保留律法禁令的正式语气；“照样行”与上文形成自然回指。全句避免古奥虚词，同时保留“可憎”“憎恶”“焚烧”等原文的强烈力度。
