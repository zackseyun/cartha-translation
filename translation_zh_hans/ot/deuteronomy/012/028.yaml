source:
  edition: WLC
  text: שְׁמֹ֣ר וְ/שָׁמַעְתָּ֗ אֵ֚ת כָּל הַ/דְּבָרִ֣ים הָ/אֵ֔לֶּה אֲשֶׁ֥ר אָנֹכִ֖י מְצַוֶּ֑/ךָּ לְמַעַן֩ יִיטַ֨ב לְ/ךָ֜ וּ/לְ/בָנֶ֤י/ךָ אַחֲרֶ֨י/ךָ֙ עַד עוֹלָ֔ם כִּ֤י תַעֲשֶׂה֙ הַ/טּ֣וֹב וְ/הַ/יָּשָׁ֔ר בְּ/עֵינֵ֖י יְהוָ֥ה אֱלֹהֶֽי/ךָ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/028.yaml
  text: Be careful to listen to all these words that I am commanding you[a], so that it may go well with you and with your children after you forever[b], because you will do what is good and right in the eyes of Yahweh your God.
translation:
  language: zh_hans
  text: 你要谨守并听从我所吩咐你的这一切话[a]，好使你和你以后的子孙永远得福[b]，因为你要行雅威你神眼中看为美善和正直的事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文连用“谨守”和“听从”两个动词，强调留心持守并以顺服来回应。
    reason: lexical_alternative
  - marker: b
    text: “子孙”原文直译为“儿子们”；这里按立约语境理解为后代。
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמֹר וְשָׁמַעְתָּ
  choice: 谨守、听从
  rationale: 分别体现“守住、谨守”和“听、听从”两个动词；“听从”保留听闻层面，同时自然传达语境所含的顺服之意。
- source_word: כָּל הַדְּבָרִים הָאֵלֶּה
  choice: 这一切话
  rationale: דְּבָרִים在这里指摩西所传达的命令；译作“话”既贴近原文，也符合现代汉语。
- source_word: מְצַוֶּךָּ
  choice: 我吩咐你的
  rationale: 分词形式表达摩西此刻正在颁布的命令；汉语定语结构简洁自然。
- source_word: לְמַעַן יִיטַב לְךָ
  choice: 好使你……得福
  rationale: 这是申命记常见的立约福祉表达；“得福”自然传达“境况良好、蒙福”的整体含义。
- source_word: וּלְבָנֶיךָ אַחֲרֶיךָ
  choice: 和你以后的子孙
  rationale: בָּנִים字面为“儿子们”，但在此立约语境中泛指后裔；“子孙”也自然表达אַחֲרֶיךָ所指的后世。
- source_word: עַד עוֹלָם
  choice: 永远
  rationale: 表达延续到不可限定之将来的长久时间，简明保留原文力度。
- source_word: כִּי
  choice: 因为
  rationale: 按其最直接的因果用法，说明得福与行神眼中善正之事的关系；不改写为条件句。
- source_word: תַעֲשֶׂה
  choice: 你要行
  rationale: 未完成式在劝诫语境中可带将来或应然色彩；“要行”比单纯未来式更符合汉语训诲语体，同时不使用强硬的法律术语。
- source_word: הַטּוֹב וְהַיָּשָׁר
  choice: 善、为正的事
  rationale: 两个带冠词的形容词作名词用；在“看为”结构中译作“善、为正的事”，保留并列的道德评价。
- source_word: בְּעֵינֵי יְהוָה
  choice: 雅威……眼中看为
  rationale: 保留希伯来语“在……眼中”的评价性隐喻，并以自然汉语表达。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，保留其作为以色列之神专名的性质，不以头衔替代。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；“雅威”较直接地音译其通行学术拟读，避免用称号取代专名。
- issue: בָנֶיךָ的范围
  choice: 子孙
  alternative: 儿子们；儿女；后裔
  rationale: 该词形式上是阳性复数“儿子们”，但立约应许语境涉及听者的后世，范围不必限于男性；“子孙”在现代汉语中自然涵盖后代。
- issue: כִּי所表达的逻辑关系
  choice: 因为
  alternative: 当……时；如果
  rationale: 保留最直接的因果读法，让原文中顺服与福祉之间的关系保持其力度，而不擅自改成纯粹条件句。
translation_notes:
  register: 采用现代、庄重而易懂的训诲语体。“谨守、听从”保留原文两个并列动词；“雅威你神”略带经文语序，以维持庄严感和原文关系。
