  text: רַ֣ק חֲזַ֗ק לְ/בִלְתִּי֙ אֲכֹ֣ל הַ/דָּ֔ם כִּ֥י הַ/דָּ֖ם ה֣וּא הַ/נָּ֑פֶשׁ וְ/לֹא תֹאכַ֥ל הַ/נֶּ֖פֶשׁ עִם הַ/בָּשָֽׂר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/023.yaml
  text: Only be sure not to eat the blood[a], because the blood is the life, and you shall not eat the life with the flesh.
translation:
  language: zh_hans
  text: 只是你务要谨慎，不可吃血[a]，因为血就是生命；不可连同肉一起吃生命。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “生命”两处所译的希伯来语也可译作“魂”；这里指活物赖以存活的生命，因此许多译本译作“生命”。
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: 只是
  rationale: 承接上文准许吃肉的内容，引出一项强烈的限制；“只是”在现代汉语中自然地表达这一例外。
- source_word: חֲזַק לְבִלְתִּי אֲכֹל
  choice: 要坚决不可吃
  rationale: חזק 字面为“要刚强”，与 לבלתי 连用时表示坚定遵守禁令；“要坚决不可吃”既保留其强调语气，也符合中文律法语体。
- source_word: הַדָּם
  choice: 血
  rationale: 直接对应原文，并在本节两次相关论述中保持一致。
- source_word: כִּי
  choice: 因为
  rationale: 明确表达后句是禁令的理由。
- source_word: הַדָּם הוּא הַנָּפֶשׁ
  choice: 血就是生命
  rationale: הוא 在无动词判断句中带有明确或强调作用；“就是”自然传达这种认同关系。
- source_word: הַנֶּפֶשׁ
  choice: 生命
  rationale: נפש 在此指使活物有生命的生命本身，而非必然指与身体分离的“灵魂”；“生命”最符合禁血的上下文。
- source_word: וְלֹא תֹאכַל
  choice: 不可……吃
  rationale: 未完成式在律法指示中具有禁止效力；“不可”保留庄重、明确的律法语气。
- source_word: הַנֶּפֶשׁ עִם הַבָּשָׂר
  choice: 把生命和肉一起吃
  rationale: 保留“生命”与前句的词汇呼应，也保留生命与肉一同被吃的具体意象；中文用“把”字句表达更顺畅。
theological_decisions:
- issue: 饮食律例语境中 נֶפֶשׁ 的含义
  choice: 生命
  alternative: 灵魂
  rationale: 此处以血与活物的生命相等同来说明禁血的理由。译作“灵魂”容易引入原文并未要求的身心二分观念；“生命”既保存经文的论证，也不排除该词在其他语境中的更广含义。
translation_notes:
  register: 采用现代、庄重而易懂的律法语体。“要坚决不可”保留原文 חזק 的强烈劝诫色彩；分号呈现理由与结论之间的推进。脚注保留 נֶפֶשׁ 的真实词义范围，同时避免在正文中引入不必要的哲学化含义。
