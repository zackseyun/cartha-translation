  text: וּ/שְׂמַחְתֶּ֗ם לִ/פְנֵי֮ יְהוָ֣ה אֱלֹֽהֵי/כֶם֒ אַתֶּ֗ם וּ/בְנֵי/כֶם֙ וּ/בְנֹ֣תֵי/כֶ֔ם וְ/עַבְדֵי/כֶ֖ם וְ/אַמְהֹתֵי/כֶ֑ם וְ/הַ/לֵּוִי֙ אֲשֶׁ֣ר בְּ/שַֽׁעֲרֵי/כֶ֔ם כִּ֣י אֵ֥ין ל֛/וֹ חֵ֥לֶק וְ/נַחֲלָ֖ה אִתְּ/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/012.yaml
  text: And you shall rejoice before Yahweh your God—you and your sons and your daughters[a], and your male servants and your female servants, and the Levite who is within your gates, because he has no portion or inheritance with you.
translation:
  language: zh_hans
  text: 你们要在耶和华你们的上帝面前欢喜：你们、你们的儿子和女儿、奴仆和婢女，以及住在你们城中[a]的利未人，都要欢喜；因为他在你们中间没有份和产业。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“在你们城门以内”；“城门”在这里代指城镇或当地社区。
    reason: 说明希伯来语空间习语及正文的语境化译法。
lexical_decisions:
- source_word: וּשְׂמַחְתֶּם
  choice: 你们要……欢喜
  rationale: 连词连接的完成式在律法训示语境中具有命令意味；“欢喜”既自然，也保留敬拜与盟约庆典的色彩。
- source_word: לִפְנֵי יְהוָה אֱלֹהֵיכֶם
  choice: 在耶和华你们的上帝面前
  rationale: לִפְנֵי 表示“在……面前/临在中”；以“面前”简洁保留敬拜场景。神名 יְהוָה 采用现代中文圣经传统中直接标示四字神名的“耶和华”。
- source_word: וּבְנֵיכֶם וּבְנֹתֵיכֶם
  choice: 你们的儿女
  rationale: 中文“儿女”自然涵盖原文明确并列的儿子和女儿，同时保留性别成对表达。
- source_word: וְעַבְדֵיכֶם וְאַמְהֹתֵיכֶם
  choice: 奴仆婢女
  rationale: 原文分别指男性与女性的受役使者；“奴仆婢女”保留其依附身份和性别区别，又符合庄重的现代中文表达。
- source_word: וְהַלֵּוִי
  choice: 利未人
  rationale: 采用成员称谓的标准中文译法；原文单数在此可代表当地的利未人。
- source_word: אֲשֶׁר בְּשַׁעֲרֵיכֶם
  choice: 住在你们城中
  rationale: “在你们的城门内”是希伯来语以城门代指城镇辖域的表达；正文按其语境意义译为“城中”，脚注保留直译。
- source_word: חֵלֶק וְנַחֲלָה
  choice: 份……继承之地
  rationale: חֵלֶק 指所得之份，נַחֲלָה 在此特别涉及以色列各支派承受的土地产业；分别译出二者，避免完全合并。
- source_word: אִתְּכֶם
  choice: 与你们同得的产业中
  rationale: 原文直译为“与你们一起/在你们中间”；结合“份和产业”，中文补出关系，使“利未人未与其他支派同得土地产业”的意思清楚，但不扩张为额外教义说明。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用以色列上帝的专名。现代简体中文圣经语域中“耶和华”辨识度高，并作为专名而非“主”这一称号呈现；“雅威”是较贴近学术重构读音的可行替代。
- issue: 利未人没有“份和产业”的含义
  choice: 没有他的份，也没有他的继承之地
  alternative: 没有份，没有产业
  rationale: 保留 חֵלֶק 与 נַחֲלָה 的并列和土地继承背景，不把经文进一步解释为特定的祭司制度命题。
- issue: עֶבֶד/אָמָה 的社会身份
  choice: 奴仆婢女
  alternative: 男女仆人
  rationale: 原词可依语境涵盖奴隶或仆役；此处是古代家庭成员的法律性列举，“奴仆婢女”比泛称“仆人”更能呈现其受辖制的依附地位，同时避免使用过度现代化的制度术语。
translation_notes:
  register: 采用庄重而易懂的现代标准普通话。句首保留律法训示的“要”，用“就是”引出共同欢喜者的名单；后半句略作汉语句法调整，以清楚表达利未人未与其他以色列人同得土地份额。
