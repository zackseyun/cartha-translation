revisions:
- from: 你们要在耶和华你们的上帝面前欢喜，就是你们和你们的儿女、奴仆婢女，以及住在你们城中[a]的利未人；因为他与你们同得的产业中，没有他的份，也没有他的继承之地。
  to: 你们要在耶和华你们的上帝面前欢喜：你们、你们的儿子和女儿、奴仆和婢女，以及住在你们城中[a]的利未人，都要欢喜；因为他在你们中间没有份和产业。
  rationale: 以冒号和“都要欢喜”使希伯来文所列共同欢喜者在中文中结构完整；分别保留“儿子和女儿”及“奴仆和婢女”的明示配对。后半句改为“因为他在你们中间没有份和产业”，自然保留原文的否定、并列名词和与“你们”的关系，不额外限定为“继承之地”或重构为“同得的产业”。
