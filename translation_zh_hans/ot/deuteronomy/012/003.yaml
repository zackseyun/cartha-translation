base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/003.yaml
  text: You shall tear down their altars[a], shatter their sacred pillars, burn their Asherah poles with fire, cut down the carved images of their gods[c][b], and destroy their name from that place.
translation:
  language: zh_hans
  text: 你们要拆毁他们的祭坛，打碎他们的神柱，把他们的亚舍拉木柱[a]用火焚烧，砍毁他们众神的雕像[b]，从那地方除灭他们的名[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “亚舍拉木柱”也可译作“亚舍拉”或“祭祀木柱”。希伯来语所指的是与女神亚舍拉有关的祭祀物。
    reason: lexical_alternative
  - marker: b
    text: “雕像”也可译作“偶像”。希伯来语强调这些敬拜对象是雕刻制作的。
    reason: lexical_alternative
  - marker: c
    text: “除灭他们的名”是指从这个祭祀地点清除他们受纪念、被称奉的存在和痕迹。
    reason: cultural_note
lexical_decisions:
- source_word: נִתַּצְתֶּם אֶת מִזְבּחֹתָם
  choice: 拆毁他们的祭坛
  rationale: נתץ指拆除、毁坏建筑物；“拆毁”既贴合祭坛作为建造物的性质，也自然有力。
- source_word: שִׁבַּרְתֶּם אֶת מַצֵּבֹתָם
  choice: 打碎他们的神柱
  rationale: שבר的加强式表达猛烈、彻底的破坏；מַצֵּבָה在此是用于祭祀的立石或柱子，“神柱”简洁地传达其宗教用途。
- source_word: אֲשֵׁרֵיהֶם
  choice: 他们的亚舍拉木柱
  rationale: 该词指与亚舍拉有关的祭祀物，常为木制柱状物；音译专名并补出“木柱”，既保留文化特指，也便于现代读者理解。
- source_word: תִּשְׂרְפוּן בָּאֵשׁ
  choice: 用火焚烧
  rationale: 保留希伯来文明确提到“火”的表达；“焚烧”符合庄重而自然的现代汉语。
- source_word: פְסִילֵי אֱלֹהֵיהֶם
  choice: 他们众神的雕像
  rationale: פֶסֶל强调经雕刻制作的形像；“雕像”比泛称“偶像”更直接保留其制作和物质特征。
- source_word: תְּגַדֵּעוּן
  choice: 砍倒
  rationale: גדע表示砍断、砍倒，适用于可被砍除的木制或雕刻祭祀物，语势具体有力。
- source_word: וְאִבַּדְתֶּם אֶת שְׁמָם
  choice: 除灭他们的名号
  rationale: 使役形式表达使之消亡；“除灭……名号”保留原文以“名”代指其受纪念、被称奉之存在的凝练习语，并保持庄重语域。
- source_word: מִן הַמָּקוֹם הַהוּא
  choice: 从那地方
  rationale: 直接而自然地表达来源、移除范围，指前文所说的祭祀地点。
theological_decisions:
- issue: אֲשֵׁרֵיהֶם所指的迦南祭祀物
  choice: 亚舍拉木柱
  alternative: 亚舍拉；祭祀木柱
  rationale: 保留“亚舍拉”这一文化和宗教专名，同时以“木柱”表明此处很可能指与她有关的祭祀物，而不把祭祀物直接等同于女神本身。
- issue: פְסִילֵי אֱלֹהֵיהֶם的表达
  choice: 他们众神的雕像
  alternative: 他们的偶像；他们众神的雕刻形像
  rationale: 原文突出这些敬拜对象是人工雕成的形像；“雕像”保留这一具体性，而不只采用带有评价色彩的概括词“偶像”。
- issue: “除灭他们的名号”的含义
  choice: 在正文中保留“名号”的转喻表达
  alternative: 消除他们在当地受纪念、受敬拜的痕迹
  rationale: 上下文中的“名”不必限于文字或声誉，而可指被纪念、称奉和维持的存在。正文保留原文的简洁与张力，脚注说明其语境意义。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“拆毁、打碎、焚烧、砍倒、除灭”保留原文连续命令的强烈节奏；专门文化词“亚舍拉”以脚注解释，不在正文中过度展开。
