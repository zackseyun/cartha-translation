source:
  edition: WLC
  text: כִּ֥י לֹא בָּאתֶ֖ם עַד עָ֑תָּה אֶל הַ/מְּנוּחָה֙ וְ/אֶל הַֽ/נַּחֲלָ֔ה אֲשֶׁר יְהוָ֥ה אֱלֹהֶ֖י/ךָ נֹתֵ֥ן לָֽ/ךְ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/009.yaml
  text: For you have not yet come to the resting place and to the inheritance that Yahweh your God is giving you[a].
translation:
  language: zh_hans
  text: 因为直到如今，你们还没有来到安歇之地和产业，就是耶和华你上帝赐给你的。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “安歇之地”或译“安歇”。希伯来语 מְנוּחָה 既可指安歇的状态，也可指安歇的地方；这里进入土地的语境较支持后者。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，为此前的命令说明缘由，保留因果关系。
- source_word: לֹא בָּאתֶם עַד עָתָּה
  choice: 直到如今，你们还没有来到
  rationale: 自然表达否定词与“直到如今”的组合，并保留 בוא 的一般性“来到”含义。
- source_word: הַמְּנוּחָה
  choice: 安歇之地
  rationale: 该词既可指抽象的“安歇”，也可指具体的安歇处；本节以进入土地为背景，具体地点义较合适，同时用脚注保留另一可能。
- source_word: הַנַּחֲלָה
  choice: 产业
  rationale: 在申命记的土地语境中，指上帝赐予并分配给百姓的承受之地；“产业”兼顾土地所有与承受所得的含义。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神名音译，直接呈现四字神名，而不改译为称号。
- source_word: נֹתֵן
  choice: 赐给
  rationale: 分词在此描写上帝正在施行或即将落实的赐予；中文“赐给”在应许语境中自然，也不把时态限定得过死。
theological_decisions:
- issue: מְנוּחָה 是状态还是地点
  choice: 正文译作“安歇之地”
  alternative: “安歇”
  rationale: 土地进入语境支持具体地点义，但希伯来词本身也可表示抽象的安歇，因此以脚注保留歧义。
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 两者都是对四字神名的音译；正文采用现代中文圣经传统中辨识度更高的“耶和华”，不以“主”取代专名。
- issue: 单复数人称转换
  choice: “你们”来到，却是“你”上帝、“赐给你”
  alternative: 全译为复数
  rationale: 原文 בָּאתֶם 为复数，而 אֱלֹהֶיךָ、לָךְ 为单数，体现摩西对群体与作为整体的以色列之间的人称转换；中文照原文保留这一张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“安歇之地”比“安息所”更易为普通读者理解；保留原文从复数“你们”转为单数“你”的人称变化。
