base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/022.yaml
  text: But just as the gazelle and the deer are eaten[a], so you may eat it[b]; the unclean and the clean alike may eat it.
translation:
  language: zh_hans
  text: 不过，你们可以吃它，就像吃羚羊和鹿一样[a]；不洁净的人和洁净的人[b]都可以吃。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “羚羊”所指的具体动物不能完全确定，也可理解为一种鹿；“鹿”也可能特指雄鹿。
    reason: lexical_alternative
  - marker: b
    text: 这里的“不洁净”和“洁净”指礼仪上的状态，并非道德品格。
    reason: cultural_note
lexical_decisions:
- source_word: אַךְ
  choice: 不过
  rationale: 在这里表示对上文规定的限定或转折；“不过”自然地承接语境，又不把语气强化为“惟独”。
- source_word: כַּאֲשֶׁר ... כֵּן
  choice: 就像……一样
  rationale: 保留原文的对应比较结构，表明吃所指牲畜可以像吃野味一样。
- source_word: הַצְּבִי
  choice: 羚羊
  rationale: 该词通常指羚羊一类的野生动物；具体物种并不能完全确定，因此以脚注说明。
- source_word: הָאַיָּל
  choice: 鹿
  rationale: 该词指鹿，也可能特指雄鹿；正文采用自然且不过度限定的通称“鹿”。
- source_word: תֹּאכְלֶנּוּ / יֹאכְלֶנּוּ
  choice: 可以吃它／都可以吃
  rationale: 在律法指示中，这两个未完成式表达许可，而非单纯预告将来的行为。
- source_word: הַטָּמֵא וְהַטָּהוֹר
  choice: 不洁净的人和洁净的人
  rationale: 两个带冠词的形容词在此实体化，指处于相应礼仪状态的人；加入“人”使现代汉语清楚自然。
- source_word: יַחְדָּו
  choice: 都
  rationale: 这里强调两类人同样获准食用，不一定表示他们同时或同席进食；“都”准确传达共同适用的许可。
theological_decisions:
- issue: 洁净与不洁净的性质
  choice: 正文译作“不洁净的人和洁净的人”，脚注说明这是礼仪状态
  alternative: “礼仪上不洁净的人和礼仪上洁净的人”
  rationale: 原文使用律法中的洁净术语，并非评价人的道德品格。正文保留关键术语的简洁对照，脚注防止现代读者误解，同时避免在正文中过度解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“不过”承接上文的限制性语气；“就像……一样”保留原文比较结构。以“都”表达两类人同样可以食用，避免“共同”可能造成必须同时进食的误解。
