  yaml_path: translation/ot/deuteronomy/012/019.yaml
  text: Be careful that you do not forsake the Levite all your days on your land[a][b].
translation:
  language: zh_hans
  text: 你要谨慎：你在自己的土地上度过的每一天，都不可离弃利未人[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文为带定冠词的单数“利未人”，可能以单数代表利未人这一群体。
    reason: lexical_alternative
  - marker: b
    text: 也可译为“在你的土地中（即境内）”。原文直译为“在你的土地上”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשָּׁמֶר לְךָ
  choice: 你要谨慎
  rationale: 该表达由שׁמר的尼法勒命令式与לְךָ构成，是警戒人留心自守的惯用语。“你要谨慎”在现代汉语中自然、庄重，也保留了命令和警告的语气。
- source_word: פֶּן
  choice: 不可
  rationale: פֶּן引出所警戒的负面结果。汉语用“不可”能简洁自然地表达“务要避免”的禁戒语气。
- source_word: תַּעֲזֹב
  choice: 撇下
  rationale: עזב可指离开、抛弃或弃置不顾。此处涉及对利未人的持续责任；“撇下”既保留其道德分量，也不把含义过度限定为单纯疏忽或物理遗弃。
- source_word: אֶת הַלֵּוִי
  choice: 利未人
  rationale: 原文是带定冠词的单数，可能以代表性单数指利未人这一群体。汉语“利未人”本身不以词形标明单复数，因此正文自然保留这种开放性，并以脚注说明原文形式。
- source_word: כָּל יָמֶיךָ
  choice: 你……度过的每一天
  rationale: 原义为“你所有的日子”。结合后面的地点短语译成“度过的每一天”，在现代汉语中自然，并保留持续不断、贯穿每日的强调。
- source_word: עַל אַדְמָתֶךָ
  choice: 在自己的土地上
  rationale: אדמה在此指土地；עַל的基本空间意义是“在……上”。“在自己的土地上”既符合汉语习惯，也较直接反映原文介词。
theological_decisions:
- issue: “利未人”的代表性单数
  choice: 正文译作“利未人”，脚注说明原文为单数，可能具有群体代表性
  alternative: 明确译作复数“利未人们”或“利未支派的人”
  rationale: 原文使用带定冠词的单数הַלֵּוִי。汉语名词通常不强制标示单复数，故无需擅自消除其可能的代表性单数，也不把所指缩窄为某一特定个人。
translation_notes:
  register: 采用现代、庄重而易懂的训诫语体。“你要谨慎”保留警告力度；以冒号展开禁戒内容。将时间与地点组合为“你在自己的土地上度过的每一天”，避免生硬照搬希伯来语序，同时保留“所有日子”和“在土地上”两项信息。
