base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/010.yaml
  text: But when you cross the Jordan and live in the land that Yahweh your God is giving you to inherit[a], and he gives you rest from all your enemies around you, then you will live in safety.
translation:
  language: zh_hans
  text: 等你们过了约旦河，住在耶和华你们的上帝赐给你们为业的那地；他必使你们得享安息，脱离四围一切仇敌；你们就必安然居住。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַעֲבַרְתֶּם אֶת־הַיַּרְדֵּן
  choice: 你们过了约旦河……以后
  rationale: 连续完成式处于面向未来的语境，并与后续事件构成时间关系；用“……以后”自然表达先后次序。“约旦河”是该专名在现代汉语中的通行形式。
- source_word: וִישַׁבְתֶּם בָּאָרֶץ
  choice: 住进……那地
  rationale: ישׁב在此指进入后定居；“住进”兼顾居住和开始定居的语境。ארץ译作“那地”，保留特定应许之地的地理与承受产业色彩。
- source_word: יְהוָה אֱלֹהֵיכֶם
  choice: 耶和华你们的上帝
  rationale: 以“耶和华”音译四字神名，以“上帝”表达אֱלֹהִים；保持专名与称号的关系。
- source_word: מַנְחִיל אֶתְכֶם
  choice: 赐给你们作产业
  rationale: נחל的使役分词表示使人承受产业。汉语以“赐给你们作产业”清楚表达上帝的主动赐予和产业含义，同时避免生硬的“使你们继承”。
- source_word: וְהֵנִיחַ לָכֶם
  choice: 他必使你们安歇
  rationale: נוח的使役式表达使人得安息、免受侵扰；“使你们安歇”保留原文的使役结构和申命记中的安息主题。
- source_word: מִכָּל־אֹיְבֵיכֶם מִסָּבִיב
  choice: 不受四围一切仇敌的侵扰
  rationale: 介词מִן与使人安歇的动词连用，表示从敌人的威胁中获得安息；此译自然呈现关系，并以“四围”保留空间上的环绕意味。
- source_word: וִישַׁבְתֶּם בֶּטַח
  choice: 你们就可以安然居住
  rationale: בֶּטַח表示安全、无惧的状态；“安然居住”简洁保留居住与安全两层含义。“就可以”表达安息所带来的现实结果，不将其弱化为纯粹许可。
theological_decisions:
- issue: 四字神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: “耶和华”是简体中文圣经语境中最广为人知的专名形式，能让普通读者辨认这是上帝的立约之名；正文不以“主”替代专名。
- issue: וְהֵנִיחַ的“安息”主题
  choice: 使你们安歇
  alternative: 使你们太平
  rationale: “安歇”保留该词的休息、脱离敌害之含义及其神学张力；“太平”虽自然，却较容易只被理解为政治和平。
- issue: 土地作为产业的含义
  choice: 赐给你们作产业
  alternative: 使你们承受
  rationale: 所赐之地既是礼物，也是以色列所承受的产业；该译法保留上帝的主动作为，而不把重点移到人的取得行为上。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“四围”“安歇”“作产业”略带经文庄重感，但仍属当代读者容易理解的表达。原文是一条由多个连续分句构成的长句，译文保留其推进关系，同时用逗号增强可读性。
