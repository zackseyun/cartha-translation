source:
  edition: WLC
  text: לֹֽא תוּכַ֞ל לֶ/אֱכֹ֣ל בִּ/שְׁעָרֶ֗י/ךָ מַעְשַׂ֤ר דְּגָֽנְ/ךָ֙ וְ/תִֽירֹשְׁ/ךָ֣ וְ/יִצְהָרֶ֔/ךָ וּ/בְכֹרֹ֥ת בְּקָרְ/ךָ֖ וְ/צֹאנֶ֑/ךָ וְ/כָל נְדָרֶ֨י/ךָ֙ אֲשֶׁ֣ר תִּדֹּ֔ר וְ/נִדְבֹתֶ֖י/ךָ וּ/תְרוּמַ֥ת יָדֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/017.yaml
  text: You may not eat within your gates the tithe of your grain[a], your new wine, or your oil, or the firstborn of your herd or your flock, or any of your vows that you vow, or your freewill offerings[c][b], or the contribution of your hand.
translation:
  language: zh_hans
  text: 你不可在自己的城门内[a]吃自己五谷、新酒和油的十分之一，也不可吃你牛群和羊群中头生的牲畜，或你所许的任何愿祭[b]、甘心祭，以及你手所献的供物[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“在自己的城镇里”。希伯来文直译为“在你的城门内”，是指本地城镇或住区的惯用说法。
    reason: lexical_alternative
  - marker: b
    text: 直译“你所许的任何愿”。这里很可能指与所许之愿有关的祭物。
    reason: lexical_alternative
  - marker: c
    text: 或译“你手所献的举祭”；传统常译“举祭”。
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא תוּכַל לֶאֱכֹל
  choice: 你不可……吃
  rationale: יכל加不定式在此律法语境中表达禁止，而非单纯指没有能力；“不可”简洁保留其规范性语气。
- source_word: בִּשְׁעָרֶיךָ
  choice: 在自己的城门内
  rationale: 保留希伯来文“在你的城门内”的具体意象；此惯用语可指以城门为界的本地城镇或住区，另以脚注说明。
- source_word: מַעְשַׂר דְּגָנְךָ וְתִירֹשְׁךָ וְיִצְהָרֶךָ
  choice: 你五谷、新酒和油的十分之一
  rationale: מַעְשַׂר直指十分之一；דגן是谷物，תירוש通常指新酒，יצהר指油，尤常为橄榄油。译文保留三类物产的区别。
- source_word: בְכֹרֹת בְּקָרְךָ וְצֹאנֶךָ
  choice: 牛群和羊群中头生的
  rationale: בכור指头生的牲畜；בקר与צאן分别概括大牲畜和羊群。中文用“牛群和羊群中头生的”自然表达集合关系。
- source_word: כָל נְדָרֶיךָ אֲשֶׁר תִּדֹּר
  choice: 你所许的任何愿祭
  rationale: 字面为“你所许的各愿”；但在禁止食用的一系列圣物中，实际所指很可能是因许愿而献的祭物。“愿祭”传达语境含义，同时用脚注保留较直译的可能。
- source_word: נִדְבֹתֶיךָ
  choice: 甘心祭
  rationale: 指不是因许愿或法定义务、而是自愿献上的祭物；“甘心祭”是简明且可辨认的礼仪术语。
- source_word: תְּרוּמַת יָדֶךָ
  choice: 你手所献的礼物
  rationale: תרומה指分别出来献上的礼物或供物；“手所献的”保留“你的手”这一表达，又避免把具体举献动作强加给可能较宽泛的用法。
theological_decisions:
- issue: 许愿用语在祭祀清单中的含义
  choice: 正文译作“愿祭”
  alternative: “你所许的各样愿”
  rationale: נדר本身可指愿，但本节列举的是不可在本地食用的物品，故语境倾向于因许愿而献的祭物。脚注保留字面表达，避免抹去词义张力。
- issue: תְּרוּמָה是否应译为技术性的“举祭”
  choice: 译作“所献的礼物”
  alternative: “举祭”或“举献物”
  rationale: 该词可作礼仪术语，也可较宽泛地指分别献出的供物；此处加有“你的手”，具体所指并不完全明确，因此正文采用不把仪式动作说死的译法，并在脚注列出传统译法。
translation_notes:
  register: 采用现代、庄重而易懂的律法语体。“不可”体现禁令；列举结构以“也不可”承接，使长句清晰。保留“城门内”的希伯来意象，并用脚注解释其地理惯用义。祭祀术语不过度技术化：用“愿祭”“甘心祭”区分类别，同时对נדר和תרומה的词义范围加注说明。
