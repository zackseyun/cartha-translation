  text: לֹ֖א תֹּאכְלֶ֑/נּוּ לְמַ֨עַן יִיטַ֤ב לְ/ךָ֙ וּ/לְ/בָנֶ֣י/ךָ אַחֲרֶ֔י/ךָ כִּֽי תַעֲשֶׂ֥ה הַ/יָּשָׁ֖ר בְּ/עֵינֵ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/025.yaml
  text: You shall not eat it[a], so that it may go well with you and with your children after you, because you will do what is right in the eyes of Yahweh.
translation:
  language: zh_hans
  text: 不可吃那血；这样，你和你以后的子孙[a]就可以得福，因为你行耶和华眼中看为正的事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文可译“儿子”；在这里也可泛指儿女或后裔。
    reason: 说明希伯来文“你的儿子们”在此处可能具有较广的后代含义，并将脚注锚定于相应的中文译词。
lexical_decisions:
- source_word: תֹּאכְלֶנּוּ
  choice: 吃那血
  rationale: 动词意为“吃”，阳性单数宾语后缀回指上文的“血”。中文明确译出所指，比单用“它”更自然，也不改变原意。
- source_word: לְמַעַן יִיטַב לְךָ
  choice: 好使你……得福
  rationale: לְמַעַן引出目的或结果；יִיטַב לְךָ是申命记常见表达，泛指境况良好、蒙福，不局限于物质兴旺。
- source_word: וּלְבָנֶיךָ אַחֲרֶיךָ
  choice: 和你后代的子孙
  rationale: בָּנִים字面可指“儿子”，也可在此盟约语境中泛指儿女或后裔；“后代的子孙”自然表达世代延续，并保留家族性用语。
- source_word: כִּי תַעֲשֶׂה
  choice: 因为你行
  rationale: כִּי在此说明得福的依据；未完成式在劝诫语境中表达所要求、预期的行为，中文以“你行”简洁呈现。
- source_word: הַיָּשָׁר בְּעֵינֵי יְהוָה
  choice: 耶和华眼中看为正的事
  rationale: 保留“在……眼中”的希伯来语评价隐喻；הַיָּשָׁר译作“看为正的事”，自然且符合申命记的伦理用语。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的专名形式“耶和华”，使其与一般称号“主”有别，并明确呈现四字神名。
theological_decisions:
- issue: בָנֶיךָ所涵盖的范围
  choice: 后代的子孙
  alternative: 儿子；儿女；后裔
  rationale: 该词为阳性复数，字面可译“儿子”，但盟约后果在此延及后世。“后代的子孙”不把应许限于男性，同时保留代际和家族含义。
- issue: 顺服与得福之间的关系
  choice: 以“好使……因为……”保留原文的目的／结果及理由结构
  alternative: 译为单纯条件句“若……就……”
  rationale: 原文用לְמַעַן和כִּי分别表达目的／结果与依据；不改写成明确的条件公式，以免过度解释其神学关系。
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 原文使用神的专名而非一般称号。正文采用现代中文读者最熟悉的音译“耶和华”，不以称号替代专名。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“不可”保留律法禁令的力度；“得福”概括יִיטַב לְךָ的宽泛福祉含义。正文避免古奥句法，同时保留“耶和华眼中”的原文意象。
