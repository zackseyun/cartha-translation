  text: לֹ֣א תַעֲשׂ֔וּ/ן כְּ֠/כֹל אֲשֶׁ֨ר אֲנַ֧חְנוּ עֹשִׂ֛ים פֹּ֖ה הַ/יּ֑וֹם אִ֖ישׁ כָּל הַ/יָּשָׁ֥ר בְּ/עֵינָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/008.yaml
  text: You shall not do as we are doing here today[a], each man whatever is right in his own eyes.
translation:
  language: zh_hans
  text: 你们不可像我们今天在这里所做的那样行事；各人都做自己眼中看为正的事。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文可直译为“各人做自己眼中看为正的一切事”。这是逐一分配的说法，指每个人按自己的判断行事。
    reason: 说明希伯来语阳性单数分配结构及“在自己眼中”的评价性习语含义。
lexical_decisions:
- source_word: לֹא תַעֲשׂוּן
  choice: 你们不可……做
  rationale: 否定词加第二人称阳性复数未完成式，在这里表达禁令；“不可”符合现代中文的律法语体，也保留对全体以色列人的复数称呼。
- source_word: כְּכֹל אֲשֶׁר
  choice: 像……所做的
  rationale: 该比较结构说明行为方式；中文以“像”自然表达，不必机械译出“照着一切”。
- source_word: עֹשִׂים פֹּה הַיּוֹם
  choice: 我们今天在这里所做的
  rationale: 分词配合地点和时间副词，指当前正在实行的做法；此译序自然，并保留“我们”“今天”“这里”三项信息。
- source_word: אִישׁ
  choice: 各人
  rationale: 阳性单数名词在此具有逐一分配的作用。“各人”既准确表达每一个人的意思，也比“各个男人”更符合该处指全体成员的汉语表达。
- source_word: כָּל הַיָּשָׁר
  choice: 看为正的事
  rationale: יָשָׁר 表示正直、正确；与“在自己眼中”连用时，“看为正”自然呈现个人判断，同时没有把经文强化成更明确的道德定罪。
- source_word: בְּעֵינָיו
  choice: 自己眼中
  rationale: 保留希伯来语“在某人眼中”的评价性习语；“自己”清楚传达第三人称单数回指和自主判断的意味。
theological_decisions:
- issue: אִישׁ ... בְּעֵינָיו 的阳性单数分配式表达
  choice: 各人……自己眼中
  alternative: 各个男人……他自己眼中
  rationale: 原文用阳性单数逐一描述群体成员，但重点是人人按个人判断行事，并非专门排除女性。现代汉语“各人……自己”保留分配意义与单数回指，也避免误导为仅指成年男子。
- issue: הַיָּשָׁר 是否表达客观正确或主观上认为正确
  choice: 看为正的事
  alternative: 正的事
  rationale: “在自己眼中”使该词组带有个人评断的视角；“看为正”传达这一语用效果，但仍保留“正”这一核心词义，不直接译成贬义更强的“自以为对”。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“不可”保持律法训令的语气；“各人做自己眼中看为正的事”适度保留希伯来语习语，同时让普通读者容易理解。
