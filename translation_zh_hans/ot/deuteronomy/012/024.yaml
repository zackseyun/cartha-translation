base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/024.yaml
  text: You shall not eat it[a]; you shall pour it out on the ground like water.
translation:
  language: zh_hans
  text: 不可吃它[a]；要把它倒在地上，如同倒水一样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “它”指上下文所说从牲畜流出的血。
    reason: cross_reference
lexical_decisions:
- source_word: לֹא
  choice: 不可
  rationale: 标准否定词；在律法禁令中用“不可”简洁保留规范性语气。
- source_word: תֹּאכְלֶנּוּ
  choice: 吃它
  rationale: 动词为 Qal 未完成式第二人称阳性单数，带第三人称阳性单数宾语后缀；与否定词合译为“不可吃它”，保留原文代词结构。
- source_word: עַל הָאָרֶץ
  choice: 在地上
  rationale: 这里指具体倾倒动作所及的地面，而非抽象的“大地”或地域性的“土地”。
- source_word: תִּשְׁפְּכֶנּוּ
  choice: 要把它倒
  rationale: 动词 שׁפך 在这里描述倾倒血的动作；“倒”符合现代汉语习惯，也保留律法指令语气。
- source_word: כַּמָּיִם
  choice: 如同倒水一样
  rationale: 保留比较意义；汉语补出共享的动作“倒”，使比喻自然明确，但未改变原意。
theological_decisions:
- issue: 两个宾语后缀所指为何
  choice: 正文均译作“它”，脚注说明是上下文所说的血
  alternative: 在正文直接译作“血”
  rationale: 希伯来文使用代词后缀，没有在本节重述“血”。保留“它”忠实呈现原文结构，并以脚注提供上下文信息，避免把解释直接写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的律法语体。“不可……；要……”清楚表达禁令与正面命令；分号对应两个紧密相连的分句。
