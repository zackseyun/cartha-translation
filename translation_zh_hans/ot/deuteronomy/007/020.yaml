  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/גַם֙ אֶת הַ/צִּרְעָ֔ה יְשַׁלַּ֛ח יְהוָ֥ה אֱלֹהֶ֖י/ךָ בָּ֑/ם עַד אֲבֹ֗ד הַ/נִּשְׁאָרִ֛ים וְ/הַ/נִּסְתָּרִ֖ים מִ/פָּנֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/020.yaml
  text: Moreover[b][a], Yahweh your God will send the hornet among them until even those who remain and those who hide themselves from before you perish.
translation:
  language: zh_hans
  text: 此外[b]，耶和华你的上帝还要派黄蜂[a]到他们中间，直到那些剩下的和藏起来躲避你的人都灭亡。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或可能指“恐惧、惊慌”。有人认为这里的“黄蜂”是比喻，指上帝使敌人陷入的恐慌，而不是实际的昆虫。
    reason: lexical_alternative
  - marker: b
    text: 或译“并且还要”。
    reason: previous_rendering
lexical_decisions:
- source_word: וְגַם
  choice: 此外……还
  rationale: 既表达与上文相连的附加关系，也保留强调意味；用现代汉语的关联形式使句子自然流畅。
- source_word: הַצִּרְעָה
  choice: 黄蜂
  rationale: 按该词通常的具体词义直译。原文为带定冠词的单数，在这里可作集合性或种类名称理解；可能的比喻义另见脚注。
- source_word: יְשַׁלַּח
  choice: 派
  rationale: 保留上帝主动差出这一媒介的含义，同时比“差遣黄蜂”更符合现代汉语搭配。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 直接音译神的专名，与普通称号“上帝”区分。
- source_word: אֱלֹהֶיךָ
  choice: 你的上帝
  rationale: 准确表达第二人称单数领属关系，并保留盟约语境中的直接称呼。
- source_word: בָּם
  choice: 到他们中间
  rationale: 保留介词所表达的进入敌人当中的空间意味。
- source_word: עַד אֲבֹד
  choice: 直到……都灭亡
  rationale: 清楚表达行动持续至某一结果实现；“灭亡”不额外限定其具体方式。
- source_word: הַנִּשְׁאָרִים
  choice: 那些剩下的
  rationale: 保留分词所指的、先前灾祸或征服后仍留下来的人，避免在军事语境中引入“余民”的神学术语色彩。
- source_word: וְהַנִּסְתָּרִים
  choice: 藏起来……的人
  rationale: 以自然汉语表达这些人处于隐匿中的状态，同时不将被动形式过度机械化。
- source_word: מִפָּנֶיךָ
  choice: 躲避你
  rationale: 按语境自然表达“从你面前／你的临在中藏匿”的意思，并传达他们为避开以色列而隐藏。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名；正文采用中文圣经传统中广为人知的专名形式，而不以“主”替代。
- issue: הַצִּרְעָה 应按字面还是比喻理解
  choice: 正文译作具体的“黄蜂”
  alternative: 上帝所降的恐惧或惊慌
  rationale: 该词的基本词义是黄蜂，因此正文保留直观含义；同时用脚注保留将其理解为上帝所降恐慌的可能性，不武断消除原文在此处的解释张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“此外……还”承接上文并表达递进；“派黄蜂到他们中间”保留原文的主动动作和空间关系；末句以“藏起来躲避你的人”避免生硬照译“从你面前隐藏的人”。
