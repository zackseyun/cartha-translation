  rationale: 仅作必要的语法与惯用语修订：以“耶和华必向你们发怒”自然表达希伯来文“怒气燃烧”的习语，同时保留原文的因果推进、神名、人称和单复数张力。脚注a相应澄清惯用语的构成；其余译文及脚注可保留。
