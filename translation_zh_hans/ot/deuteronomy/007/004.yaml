  text: כִּֽי יָסִ֤יר אֶת בִּנְ/ךָ֙ מֵֽ/אַחֲרַ֔/י וְ/עָבְד֖וּ אֱלֹהִ֣ים אֲחֵרִ֑ים וְ/חָרָ֤ה אַף יְהוָה֙ בָּ/כֶ֔ם וְ/הִשְׁמִידְ/ךָ֖ מַהֵֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/004.yaml
  text: For he will turn your son away from following me[a], and they will serve other gods; then the anger of Yahweh will burn against you[c][b], and he will quickly destroy you.
translation:
  language: zh_hans
  text: 因为他会使你的儿子不再跟从我[a]，他们就会侍奉别的神[b]；这样，耶和华[c]必向你们发怒，并且迅速消灭你[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“使你的儿子离开跟随我”；“从我后面”是指不再跟从我。
    reason: lexical_alternative
  - marker: b
    text: 原文先说单数的“你的儿子”，随后却用复数“他们会侍奉”；这可能把警告扩展到由此受影响的家庭或群体。也有人按单数关系理解为“他就会侍奉别的神”。
    reason: alternative_reading
  - marker: c
    text: “耶和华”所译的是希伯来文神名יהוה（YHWH）；也可音译为“雅威”。
    reason: alternative_reading
  - marker: d
    text: 原文“向你们”是复数，“消灭你”却是单数；后者可能把以色列全体看作一个整体。
    reason: textual_feature
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文禁止通婚的命令，引出其理由；“因为”自然保留了解释关系。
- source_word: יָסִיר
  choice: 会使……不再跟从
  rationale: סור的使役式在此表示使人转离；结合后面的介词短语，译文既保留使役含义，也用现代汉语清楚表达背离。
- source_word: בִּנְךָ
  choice: 你的儿子
  rationale: 原文是阳性单数，并与上文“为你的儿子娶他的女儿”直接对应，不泛化为“儿女”或“后代”。
- source_word: מֵאַחֲרַי
  choice: 不再跟从我
  rationale: 字面为“从我后面离开”，是停止跟随的希伯来语表达；译文传达其惯用含义，脚注保留字面形象。
- source_word: וְעָבְדוּ
  choice: 他们就会侍奉
  rationale: 动词为复数。译文保留原文从“你的儿子”单数转为“他们”复数的变化，不擅自改成单数。
- source_word: אֱלֹהִים אֲחֵרִים
  choice: 别的神
  rationale: 直接、自然地表达对其他神祇的侍奉，并保留与专一跟从耶和华之间的对立。
- source_word: וְחָרָה אַף יְהוָה
  choice: 耶和华的怒火必……燃烧起来
  rationale: 原文以“怒气燃烧”描写神的愤怒；“怒火……燃烧起来”在现代汉语中自然，也保留了鲜明比喻。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代汉语圣经传统中广为人知的专名形式呈现四字神名，而不是仅以“主”这一称号替代；脚注说明原文形式。
- source_word: בָּכֶם
  choice: 向你们
  rationale: 介词与“怒气燃烧”连用，表示怒气所针对的对象；后缀为复数，故译作“你们”。
- source_word: וְהִשְׁמִידְךָ
  choice: 并且他必……消灭你
  rationale: שׁמד的使役式表达彻底毁灭。宾语后缀为阳性单数，译文保留“你”，让它作为对以色列整体的集体性称呼。
- source_word: מַהֵר
  choice: 迅速
  rationale: 准确表达审判来临之快，语体庄重而符合现代汉语。
theological_decisions:
- issue: 使人转离者“他”的指代
  choice: 保留原文阳性单数“他”，不在正文中明确补成某个特定人物或群体
  alternative: 译作“他们”，泛指通婚的外族人；或明确译成“那外族人”
  rationale: 本节依赖上文确定指代，而本节本身只使用阳性单数。保留“他”避免替原文消除可能的指代张力。
- issue: “你的儿子”与“他们会侍奉”之间的数变化
  choice: 分别保留单数与复数
  alternative: 将两处统一译作单数，或把“你的儿子”泛化为“你的儿女/后代”
  rationale: 马所拉文本明确从单数名词转为复数动词。这可能把警告从一个儿子扩展到家庭或群体后果，但正文不替读者锁定解释。
- issue: 神名יהוה的译法
  choice: 耶和华
  alternative: 雅威；主
  rationale: “耶和华”在现代标准汉语中是辨识度最高的专名形式，并避免只用称号“主”遮蔽原文的专名；脚注同时交代原文为YHWH。
- issue: 对受审判者称呼的单复数变化
  choice: 保留“向你们”复数和“消灭你”单数
  alternative: 两处都统一译为“你们”
  rationale: 原文בָּכֶם是复数，וְהִשְׁמִידְךָ的宾语后缀却是单数。单数可将以色列视为一个整体；保留变化比无声抹平更忠实。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“侍奉”保留宗教忠诚与敬拜的含义；“怒火……燃烧起来”保留原文比喻而不采用生硬的字面表达。正文刻意保留原文的人称与单复数转换，并以脚注帮助普通读者理解。
