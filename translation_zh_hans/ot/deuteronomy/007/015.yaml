source:
  edition: WLC
  text: וְ/הֵסִ֧יר יְהוָ֛ה מִמְּ/ךָ֖ כָּל חֹ֑לִי וְ/כָל מַדְוֵי֩ מִצְרַ֨יִם הָ/רָעִ֜ים אֲשֶׁ֣ר יָדַ֗עְתָּ לֹ֤א יְשִׂימָ/ם֙ בָּ֔/ךְ וּ/נְתָנָ֖/ם בְּ/כָל שֹׂנְאֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/015.yaml
  text: And Yahweh will remove from you all sickness[a], and none of the evil diseases of Egypt that you have known[b] will he put on you; instead, he will put them on all who hate you.
translation:
  language: zh_hans
  text: 雅威必除去你身上一切的疾病；你所知道的[b]埃及一切严重的疾病[a]，他都不加在你身上，却要加在所有恨你的人身上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“有害的疾病”或“凶恶的疾病”。希伯来语形容词可表示坏的、恶的、有害的或严重的。
    reason: lexical_alternative
  - marker: b
    text: 或译：“你所经历过的”。这里的“知道”可能含有亲身经历的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵסִיר
  choice: 必除去
  rationale: 使役形表达“使之离开、除掉”；“除去”自然保留其使役和分离含义。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，保留其作为专名的性质，不以称号替代。
- source_word: מִמְּךָ כָּל חֹלִי
  choice: 你身上一切的疾病
  rationale: מן表示从某人那里移开；结合汉语“除去……身上的……”表达，可自然传达原文的分离意象。חֹלִי为疾病、病患的集合性说法。
- source_word: וְכָל מַדְוֵי מִצְרַיִם הָרָעִים
  choice: 埃及一切严重的疾病
  rationale: מַדְוֵי为“疾病”的复数附属形式，הָרָעִים可指恶劣、有害或严重；“严重的疾病”在现代汉语中自然，也避免把疾病本身人格化为道德上的邪恶。
- source_word: אֲשֶׁר יָדַעְתָּ
  choice: 你所知道的
  rationale: 直译ידע的“知道、认识”，并保留它在此处可能含有亲身经历之意的歧义；该体验性含义置于脚注。
- source_word: לֹא יְשִׂימָם בָּךְ
  choice: 他都不加在你身上
  rationale: שׂים与ב连用表示把某事物置于、加在某人身上；“加在你身上”符合疾病临到人的汉语表达。
- source_word: וּנְתָנָם
  choice: 却要加在
  rationale: נתן本义为“给、放置”，在疾病语境中译作“加在”较自然；“却”呈现与前一否定分句的对照，但不增添额外因果关系。
- source_word: בְּכָל שֹׂנְאֶיךָ
  choice: 所有恨你的人身上
  rationale: 分词形式直指“恨你的人”，比概括为“仇敌”更贴近原文。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用神的专名；采用音译“雅威”保留专名性质，而不以“主”这一称号替代。
- issue: 关于埃及疾病之应许的范围
  choice: 按本节直译为盟约语境中除去疾病、不把埃及疾病加在以色列身上的应许
  alternative: 将其扩展为任何时代每个信徒都绝不会患病的普遍保证；将疾病纯粹比喻化
  rationale: 原文具体谈及疾病及埃及的疾病，但本节本身并未把该应许扩展为脱离其盟约语境的普遍健康教义，也没有把疾病非实体化。
- issue: ידע在本节中的认知与经验含义
  choice: 正文保留“知道”，脚注说明也可理解为“经历过”
  alternative: 正文直接译为“经历过”
  rationale: ידע既可指认知，也常可含亲身经验；保留较形式对应的正文并用脚注呈现体验性读法，可避免过早消除原文张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“除去”“加在……身上”维持原文动作意象；两个脚注标记均紧邻其所解释的词语。
