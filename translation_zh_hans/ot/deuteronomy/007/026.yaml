  text: וְ/לֹא תָבִ֤יא תֽוֹעֵבָה֙ אֶל בֵּיתֶ֔/ךָ וְ/הָיִ֥יתָ חֵ֖רֶם כָּמֹ֑/הוּ שַׁקֵּ֧ץ תְּשַׁקְּצֶ֛/נּוּ וְ/תַעֵ֥ב תְּֽתַעֲבֶ֖/נּוּ כִּי חֵ֥רֶם הֽוּא־־׀׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/026.yaml
  text: And you shall not bring an abomination into your house[a], or you will become devoted to destruction like it. You shall utterly detest it and utterly abhor it, for it is devoted to destruction.
translation:
  language: zh_hans
  text: 不可把可憎之物带进你的家，免得你也像它一样，成为被定为毁灭的对象[a]。你要彻底厌弃它，极其憎恶它，因为它是被定为毁灭的对象。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“被禁毁的对象”；传统也译“受咒诅之物”。希伯来语此词指在人或物被置于神的审判之下、定归毁灭的状态。
    reason: 说明 חֵרֶם 的可行译法及其在盟约审判语境中“被定归毁灭”的含义。
lexical_decisions:
- source_word: תָבִיא
  choice: 带进
  rationale: 使役式在此表示使某物进入家中；“带进”自然、直接，并保留动作方向。
- source_word: תּוֹעֵבָה
  choice: 可憎之物
  rationale: 在申命记语境中指在宗教和道德上令人憎恶之物，尤其与偶像有关；“可憎之物”既保留强烈贬义，也明确它是具体对象。
- source_word: בֵּיתֶךָ
  choice: 你家
  rationale: 原文直指“你的房屋/家”；“你家”在现代汉语中自然，并保留具体的家庭空间。
- source_word: וְהָיִיתָ חֵרֶם כָּמֹהוּ
  choice: 免得你也像它一样成为当毁灭之物
  rationale: 前缀连词在禁令之后表达警告性后果；“免得”在汉语中自然呈现这种关系。חֵרֶם 指在神审判之下被划定毁灭的对象。
- source_word: חֵרֶם
  choice: 当毁灭之物
  rationale: 此译表达对象因神的审判而被指定毁灭，不仅仅是“受咒诅”或一般禁忌；同时在本节两处保持一致。
- source_word: שַׁקֵּץ תְּשַׁקְּצֶנּוּ
  choice: 你要彻底厌弃它
  rationale: 不定式绝对式与限定动词连用，加强命令语气；“彻底”体现强调，“厌弃”兼有视为污秽可憎并加以拒绝之意。
- source_word: וְתַעֵב תְּתַעֲבֶנּוּ
  choice: 极其憎恶它
  rationale: 同样的加强结构要求保留强调；用“憎恶”与前句“厌弃”区分两个相近而不完全相同的希伯来动词。
- source_word: כִּי חֵרֶם הוּא
  choice: 因为它是当毁灭之物
  rationale: 保留因果关系，并重复“当毁灭之物”，呈现原文关键术语的词汇呼应。
theological_decisions:
- issue: 盟约审判语境中 חֵרֶם 的译法
  choice: 当毁灭之物
  alternative: 被禁毁之物；受咒诅之物
  rationale: 该词在这里不只是表示被诅咒或成为禁忌，而是指在神的审判下被划定毁灭。所选译法保留“被指定毁灭”的核心意义，也使人与偶像之物承受同样地位的警告清楚可见。
- issue: וְהָיִיתָ 的逻辑关系
  choice: 免得你也……成为
  alternative: 否则你也会……成为；你也就……成为
  rationale: 连词可按连续结果理解，也可在禁令后带出所警告的后果。“免得”保留其警戒功能，并避免把结果机械地说成无条件必然发生。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“不可”“免得”“因为”保持律法命令及警告的严肃性；两个加强结构分别译作“彻底厌弃”和“极其憎恶”，既传达强调，也保留原文平行而有变化的措辞。
