  text: וַ/אֲהֵ֣בְ/ךָ֔ וּ/בֵרַכְ/ךָ֖ וְ/הִרְבֶּ֑/ךָ וּ/בֵרַ֣ךְ פְּרִֽי בִטְנְ/ךָ֣ וּ/פְרִֽי אַ֠דְמָתֶ/ךָ דְּגָ֨נְ/ךָ֜ וְ/תִֽירֹשְׁ/ךָ֣ וְ/יִצְהָרֶ֗/ךָ שְׁגַר אֲלָפֶ֨י/ךָ֙ וְ/עַשְׁתְּרֹ֣ת צֹאנֶ֔/ךָ עַ֚ל הָֽ/אֲדָמָ֔ה אֲשֶׁר נִשְׁבַּ֥ע לַ/אֲבֹתֶ֖י/ךָ לָ֥/תֶת לָֽ/ךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/013.yaml
  text: He will love you[a], bless you, and multiply you. He will bless the fruit of your womb and the fruit of your ground—your grain, your new wine, and your oil, the offspring of your herds and the young of your flock—in the land that he swore to your fathers to give you.
translation:
  language: zh_hans
  text: 他必爱你，赐福给你，使你增多。在他向你列祖[a]起誓要赐给你的土地上，他必赐福给你腹中所生的和土地所产的：你的五谷、新酒和油，牛群所生的和羊群的幼畜。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “你的列祖”对应原文“你的父亲们”；也可译为“你的祖先”。
    reason: 说明希伯来文的字面父系称谓，并提供自然汉语替代译法。
lexical_decisions:
- source_word: וַאֲהֵבְךָ
  choice: 他必爱你
  rationale: 承接上下文的盟约祝福，未完成式在此具有将来意义；直译“爱”保留盟约之爱的表达。
- source_word: וּבֵרַכְךָ וְהִרְבֶּךָ
  choice: 赐福给你，使你人数增多
  rationale: “赐福”是ברך在此处的常规表达；“使你人数增多”明确表达群体及后代繁盛，避免“增多你”的生硬说法。
- source_word: פְּרִי בִטְנְךָ וּפְרִי אַדְמָתֶךָ
  choice: 你腹中所生的和土地所产的
  rationale: 以自然汉语保留人体生育与土地出产之间的平行关系；不把两者笼统合并为“后代和收成”。
- source_word: דְּגָנְךָ וְתִירֹשְׁךָ וְיִצְהָרֶךָ
  choice: 你的五谷、新酒和油
  rationale: 分别对应谷物、当年酿出的酒和农产油；“新酒”保留תירוש与一般酒类用词的区别，而“油”不额外加入原文未明说的“橄榄”。
- source_word: שְׁגַר אֲלָפֶיךָ וְעַשְׁתְּרֹת צֹאנֶךָ
  choice: 牛群所生的和羊群的幼畜
  rationale: 两个罕见畜牧表达在搭配中均指牲畜繁殖所得；译文区分大牲畜与羊群，并避免把עשתרות误作神名。
- source_word: עַל הָאֲדָמָה
  choice: 在……那片土地上
  rationale: 此处指应许之地，而不是泛指泥土；“在……土地上”符合现代汉语方位表达。
- source_word: לַאֲבֹתֶיךָ
  choice: 向你列祖
  rationale: “列祖”在庄重而可懂的现代圣经语体中准确指以色列人的先祖，也保留希伯来文阳性复数“父亲们”的传统色彩。
theological_decisions:
- issue: 盟约祝福中“爱”的时态与性质
  choice: 他必爱你
  alternative: 他爱了你／他必向你施慈爱
  rationale: 上下文列举遵守盟约所得的祝福，动词具有将来指向；保留“爱”而不释义为某种具体恩惠，以免缩窄其盟约含义。
- issue: לַאֲבֹתֶיךָ的性别与世代含义
  choice: 你列祖
  alternative: 你的祖先／你的父辈
  rationale: 原文为阳性复数，字面是“你的父亲们”；“列祖”既保留父系称谓的历史语感，也比现代汉语“父辈”更能涵盖亚伯拉罕、以撒、雅各等远祖。
- issue: 土地、人口与牲畜繁盛作为盟约祝福
  choice: 按原文逐项陈述
  alternative: 概括为物质兴盛
  rationale: 逐项保留生育、农产和牲畜繁殖，不将经文抽象化，也不对这些祝福作超出本节的神学延伸。
translation_notes:
  register: 采用现代、庄重而清楚的普通话。“五谷、新酒和油”保持农耕语境及经文节奏；“腹中所生的”比直译“腹中的果实”更自然。“这一切都要赐在……”用于明确长串祝福与应许之地的关系，同时不改变原文所列内容。
