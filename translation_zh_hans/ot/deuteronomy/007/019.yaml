  text: הַ/מַּסֹּ֨ת הַ/גְּדֹלֹ֜ת אֲשֶׁר רָא֣וּ עֵינֶ֗י/ךָ וְ/הָ/אֹתֹ֤ת וְ/הַ/מֹּֽפְתִים֙ וְ/הַ/יָּ֤ד הַ/חֲזָקָה֙ וְ/הַ/זְּרֹ֣עַ הַ/נְּטוּיָ֔ה אֲשֶׁ֥ר הוֹצִֽאֲ/ךָ֖ יְהוָ֣ה אֱלֹהֶ֑י/ךָ כֵּֽן יַעֲשֶׂ֞ה יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ לְ/כָל הָ֣/עַמִּ֔ים אֲשֶׁר אַתָּ֥ה יָרֵ֖א מִ/פְּנֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/019.yaml
  text: the great trials that your eyes saw[a], and the signs, and the wonders, and the mighty hand[b], and the outstretched arm by which Yahweh your God brought you out—so Yahweh your God will do to all the peoples of whom you are afraid.
translation:
  language: zh_hans
  text: 你亲眼看见的那些大试炼[a]、神迹、奇事、大能的手和伸出的臂；雅威你的上帝曾用这大能的手和伸出的臂把你领出来。雅威你的上帝也必照样对待你所惧怕的一切众民[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“大试验”。希伯来语这个词可指严峻的试验或试炼。
    reason: lexical_alternative
  - marker: b
    text: 或译“各国”。原文直译为“众民”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּסֹּת הַגְּדֹלֹת
  choice: 那些大试炼
  rationale: מַסּוֹת可指严峻的试验或试炼；这里指以色列人在埃及亲眼见到的重大而可畏的事件。“试炼”自然庄重，同时以脚注保留“试验”的可能。
- source_word: רָאוּ עֵינֶיךָ
  choice: 你亲眼看见
  rationale: 保留希伯来语“你的眼睛看见”的强调意味，又符合现代汉语习惯。
- source_word: הָאֹתֹת וְהַמֹּפְתִים
  choice: 神迹、奇事
  rationale: 分别对应“signs”和“wonders”，保留原文成对并列的表达；“神迹”突出指示意义，“奇事”突出令人惊异的作为。
- source_word: הַיָּד הַחֲזָקָה
  choice: 大能的手
  rationale: 保留希伯来语以“手”象征强大行动能力的比喻，也符合中文圣经语体。
- source_word: הַזְּרֹעַ הַנְּטוּיָה
  choice: 伸出的臂
  rationale: 直译这一固定意象，表达上帝主动施行拯救与审判的大能。
- source_word: אֲשֶׁר הוֹצִאֲךָ
  choice: 曾借着这一切把你领出来
  rationale: 使关系从句在中文中自然衔接，并让“借着这一切”概括前列的试炼、神迹、奇事、手和臂，不把所指范围不必要地限制在最后一项。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代普通话中通行且贴近学术重构的音译呈现四字神名，不以称号替代专名。
- source_word: כֵּן יַעֲשֶׂה
  choice: 也必照样对待
  rationale: “照样”清楚表达上帝将来行动与出埃及时作为之间的类比；“对待”自然承接以人为受事者的结构。
- source_word: לְכָל הָעַמִּים
  choice: 对待……一切众民
  rationale: עַמִּים字面是复数“众民、各族人民”；保留“众民”，并以脚注提示也可译作“各国”。
- source_word: אֲשֶׁר אַתָּה יָרֵא מִפְּנֵיהֶם
  choice: 你所惧怕的
  rationale: 希伯来语“从他们面前惧怕”是表达惧怕对方的习语；译为“你所惧怕的”准确、自然，且不生硬复制介词结构。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文使用上帝的专名；“雅威”直接音译该名，避免以“主”等称号取代，同时不在经文中附加解释。
- issue: אֲשֶׁר 所指范围
  choice: 以“借着这一切”概括前述全部作为
  alternative: 仅修饰紧邻的“大能的手和伸出的臂”
  rationale: 关系代词的范围在句法上可能与紧邻成分相连，也可概括整串拯救作为；中文采用概括性表达，符合上下文而不把神学含义缩窄到单一工具。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“亲眼看见”保留原文强调；分号与第二句重现原文从历史回顾转向将来应许的结构。所有脚注标记均置于对应词语之后。
