base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/011.yaml
  text: So you shall keep the commandment and the statutes and the judgments that I am commanding you today[b][a], to do them.
translation:
  language: zh_hans
  text: 所以[a]，你要谨守我今天吩咐你的诫命、律例和典章[b]，遵行它们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“并且”或“因此”；希伯来语连接词既可表示简单并列，也可表示从上文得出的结论。
    reason: lexical_alternative
  - marker: b
    text: “典章”也可译作“法规”或“裁决”；原词可指法律裁决或规定。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַרְתָּ
  choice: 所以，你要谨守
  rationale: שׁמר在盟约和律法语境中指谨守、遵守；“谨守”庄重而自然。句首וְ结合上文可带推论意味，正文译作“所以”，同时以脚注保留并列读法。
- source_word: הַמִּצְוָה
  choice: 诫命
  rationale: 原文为单数；汉语“诫命”在此可作集合性法律用语，并与后面的“律例”和“典章”区分。
- source_word: הַחֻקִּים
  choice: 律例
  rationale: חֻקִּים指制定的法规或条例；“律例”符合申命记的律法语域，也能与其他法律术语保持区别。
- source_word: הַמִּשְׁפָּטִים
  choice: 典章
  rationale: מִשְׁפָּטִים可指判例、裁决或规定；“典章”保留正式法律色彩，并避免与חֻקִּים混同。脚注说明其语义范围。
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: 我今天吩咐你的
  rationale: 分词מְצַוֶּה表达当下正在颁布命令的语境；现代汉语用“今天吩咐你的”即可自然体现这一即时性，并保留申命记中“今天”的强调。
- source_word: לַעֲשׂוֹתָם
  choice: 遵行它们
  rationale: 字面为“去做它们”。在律法语境中，“遵行”既自然又保留将命令付诸行动的具体含义；“它们”对应阳性复数后缀，回指前述各项律法。
theological_decisions:
- issue: 是否区分三组盟约律法术语
  choice: 诫命、律例和典章
  alternative: 命令、法规和判例；或统称为“律法”
  rationale: 原文并列三个彼此重叠却不完全相同的法律术语，形成盟约性的修辞力度。分别翻译可保存这种层次，而不把它们化约为一个笼统类别。
- issue: 句首连接词的逻辑关系
  choice: 所以
  alternative: 并且；因此
  rationale: 结合前文，上下文支持推论关系，但希伯来语וְ本身也可仅作并列连接。正文采用自然的推论表达，脚注保留真实歧义，不将其神学化。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“谨守……遵行”保留希伯来文两个动词的递进关系；三个法律术语分别处理，以呈现申命记的盟约律法语体。
