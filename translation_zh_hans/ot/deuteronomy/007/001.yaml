  source_fidelity: 正文准确保留了时间性从句、耶和华作为“领入”和“赶逐”的施事者、七族名单及其“比你更多、更强”的比较。惟原草案将“你正进入该地以取得它”的进行／临近意味简化为“你将要占有”，可作小幅调整以更贴近原文。
  naturalness: 整体庄重、流畅，且以逗号保留本节从句延续至下节的句法是恰当的。“你正要进去取得的那片土地”较能自然而完整地表达原文的进入及取得目的。
  terminology: “耶和华”“上帝”及七族族名均符合通行中文圣经用语；“民族”适合此处的 גּוֹיִם。应将脚注 a 锚点置于“赶走”之后，因为其替代译法对应 וְנָשַׁל，而非“取得土地”。脚注 b 应同时反映“更多”和“更强大”两个比较项。
