  text: כִּ֤י יְבִֽיאֲ/ךָ֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ אֶל הָ/אָ֕רֶץ אֲשֶׁר אַתָּ֥ה בָא שָׁ֖מָּ/ה לְ/רִשְׁתָּ֑/הּ וְ/נָשַׁ֣ל גּֽוֹיִם רַבִּ֣ים מִ/פָּנֶ֡י/ךָ הַֽ/חִתִּי֩ וְ/הַ/גִּרְגָּשִׁ֨י וְ/הָ/אֱמֹרִ֜י וְ/הַ/כְּנַעֲנִ֣י וְ/הַ/פְּרִזִּ֗י וְ/הַֽ/חִוִּי֙ וְ/הַ/יְבוּסִ֔י שִׁבְעָ֣ה גוֹיִ֔ם רַבִּ֥ים וַ/עֲצוּמִ֖ים מִמֶּֽ/ךָּ־־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/001.yaml
  text: When Yahweh your God brings you into the land that you are entering to possess[a], and drives out before you many nations—the Hittites, the Girgashites, the Amorites, the Canaanites, the Perizzites, the Hivites, and the Jebusites—seven nations greater and mightier than you[b],
translation:
  language: zh_hans
  text: “耶和华你的上帝领你进入你正要进去取得的那片土地，并从你面前赶走[a]许多民族，就是赫人、革迦撒人、亚摩利人、迦南人、比利洗人、希未人和耶布斯人——这七个民族人数比你多，势力比你强[b]——的时候，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“使许多民族在你面前失去土地”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“比你更众多、更强大”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ……的时候
  rationale: 此处引出后续命令发生的时间和情境；用“……的时候”比因果性的“因为”或条件性的“如果”更符合上下文。
- source_word: יְבִיאֲךָ יְהוָה אֱלֹהֶיךָ
  choice: 耶和华你的上帝领你进入
  rationale: יְבִיאֲךָ 是 בוא 的使役形，表达“使你进入、领你进入”；“领你进入”自然地保留了上帝主动带领的含义。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 直接呈现希伯来文中的神圣四字名，并采用现代中文圣经读者熟悉的传统音译。
- source_word: הָאָרֶץ
  choice: 那片土地
  rationale: 在申命记中指以色列将要取得的特定地域；“土地”既自然，也保留其地域含义。
- source_word: אֲשֶׁר אַתָּה בָא שָׁמָּה לְרִשְׁתָּהּ
  choice: 你将要占有的那片土地
  rationale: ירשׁ 在此指取得并占有土地；“将要占有”也表达了以色列即将进入的时间指向。
- source_word: וְנָשַׁל
  choice: 赶走
  rationale: 该动词表示使当地民族离开或失去其土地；“赶走”在此语境中简洁自然，脚注保留“使……失去土地”的词义侧面。
- source_word: גּוֹיִם רַבִּים
  choice: 许多民族
  rationale: 这里指迦南境内多个族群；“民族”比现代政治意义较强的“国家”更贴切。
- source_word: מִפָּנֶיךָ
  choice: 从你面前
  rationale: 保留希伯来语空间性表达，意思是从以色列人所到之处被除去。
- source_word: הַחִתִּי ... הַיְבוּסִי
  choice: 赫人、革迦撒人、亚摩利人、迦南人、比利洗人、希未人和耶布斯人
  rationale: 采用现代中文圣经中通行且可辨识的族名译法；希伯来文单数族称在此具有集合意义，中文统一译为“人”。
- source_word: שִׁבְעָה גוֹיִם
  choice: 这七个民族
  rationale: 这是对前述七个族群的总结性同位语；加入“这”使中文衔接自然。
- source_word: רַבִּים וַעֲצוּמִים מִמֶּךָּ
  choice: 人数比你多，势力比你强
  rationale: רַבִּים 在比较结构中可指人数众多，עֲצוּמִים 指强大有力；正文采用语境清楚的表达，脚注保留较概括的译法。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文明确使用神圣四字名，而非称号“主”。正文采用普通中文读者最熟悉的专名“耶和华”，同时不以“主”取代原文神名。
- issue: 取得土地与赶走当地民族的施事者
  choice: 保持“耶和华……赶走”的明确主语
  alternative: 用被动式弱化施事者
  rationale: 希伯来文明确以上帝为“领入”和“赶走”的主语；译文保留这一叙事上的神学张力，不加以淡化或解释。
translation_notes:
  register: 采用庄重而易懂的现代标准普通话。原句的条件—时间从句延续到下一节，因此本节以逗号收束，保留未完句式。族名采用简体中文圣经传统译名。
