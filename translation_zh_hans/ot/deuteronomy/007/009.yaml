  text: וְ/יָ֣דַעְתָּ֔ כִּֽי יְהוָ֥ה אֱלֹהֶ֖י/ךָ ה֣וּא הָֽ/אֱלֹהִ֑ים הָ/אֵל֙ הַֽ/נֶּאֱמָ֔ן שֹׁמֵ֧ר הַ/בְּרִ֣ית וְ/הַ/חֶ֗סֶד לְ/אֹהֲבָ֛י/ו וּ/לְ/שֹׁמְרֵ֥י מצות/ו לְ/אֶ֥לֶף דּֽוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/009.yaml
  text: Know[a], therefore, that Yahweh your God, he is God, the faithful God, keeping the covenant and the steadfast love for those who love him and for those who keep his commandments[d][c][b], to a thousand generations.
translation:
  language: zh_hans
  text: 所以你要知道，耶和华你的上帝，他是上帝，是信实的上帝；他向爱他、遵守他诫命的人守约，施慈爱[a]，直到千代[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “慈爱”所译的希伯来语也含有忠贞不渝、守约之爱的意思。
    reason: lexical_alternative
  - marker: b
    text: 或译：“向爱他、遵守他诫命的人守约施慈爱，延续千代。”原文末语既可着重说明这种信实延续千代，也可与前面的受益者短语紧密相连。
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: וְיָדַעְתָּ
  choice: 所以你要知道
  rationale: 该完成式在语境中带劝勉意味；词首连词承接上文，并可表达推论，故译为“所以”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的形式呈现神的专名。
- source_word: הוּא הָאֱלֹהִים
  choice: 他是上帝
  rationale: 保留独立代词带来的强调，同时自然表达排他性的认信。
- source_word: הָאֵל הַנֶּאֱמָן
  choice: 是信实的上帝
  rationale: אֵל 与前面的 אֱלֹהִים 构成同位说明；“信实”兼具可靠、忠于所立之约的含义。
- source_word: שֹׁמֵר הַבְּרִית וְהַחֶסֶד
  choice: 守约，施慈爱
  rationale: 用自然的中文并列结构表达持续守护盟约并施行 חֶסֶד；不将两者混同，也保留圣约语境。
- source_word: לְאֹהֲבָיו וּלְשֹׁמְרֵי מִצְוֹתָו
  choice: 向爱他、遵守他诫命的人
  rationale: 两个分词短语共同界定蒙受守约慈爱的对象；“遵守”与前文神“守约”形成合宜呼应。
- source_word: לְאֶלֶף דּוֹר
  choice: 直到千代
  rationale: 表达盟约信实延续极其久远；“千代”紧贴原文，不把数字悄然改写成抽象的“永远”。
theological_decisions:
- issue: 上帝的守约慈爱与人的爱和顺服之间的关系
  choice: 明确说上帝向爱他、遵守他诫命的人守约施慈爱
  alternative: 泛化为上帝无条件向所有人施慈爱
  rationale: 原文明确列出盟约受益者，译文保留这种盟约性的关联与张力，不借助后来的神学体系加以弱化或扩展。
- issue: “千代”的语义力度
  choice: 保留“直到千代”
  alternative: 译作“直到永远”
  rationale: 原文使用具体而宏大的代际表达；直译既呈现持久性，又避免将其直接等同于抽象无限。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“耶和华”保留神的专名；“上帝”作为 אֱלֹהִים／אֵל 的统一译名。分号呈现认信与后续说明的层次，避免过度欧化。
