  text: וְ/נָשַׁל֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ אֶת הַ/גּוֹיִ֥ם הָ/אֵ֛ל מִ/פָּנֶ֖י/ךָ מְעַ֣ט מְעָ֑ט לֹ֤א תוּכַל֙ כַּלֹּתָ֣/ם מַהֵ֔ר פֶּן תִּרְבֶּ֥ה עָלֶ֖י/ךָ חַיַּ֥ת הַ/שָּׂדֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/022.yaml
  text: And Yahweh your God will drive out these nations before you little by little[a]. You will not be able to finish them off quickly[b], lest the wild animals become too numerous against you.
translation:
  language: zh_hans
  text: 雅威——你的上帝——必从你面前一点一点地赶走这些民族[a]。你不能迅速把他们灭尽，免得田野的野兽[b]增多，以致危害你。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “赶走”也可译作“逐出”。
    reason: lexical_alternative
  - marker: b
    text: 直译“田野的兽”；也可译作“野外的动物”。
    reason: lexical_clarification
lexical_decisions:
- source_word: וְנָשַׁל
  choice: 必……赶走
  rationale: 此处指使这些民族离开以色列将占领之地；“赶走”自然地表达军事和领土语境中的驱逐，也保留“剥夺其地”的含义空间。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文直接保留上帝的专名，而不以“主”这一称号替代。
- source_word: הַגּוֹיִם הָאֵל
  choice: 这些民族
  rationale: 既保留指示词“这些”，也体现此处迦南各族的群体和地域含义。
- source_word: מִפָּנֶיךָ
  choice: 从你面前
  rationale: 保留希伯来语的空间意象，指从以色列前方及其所到之处被除去。
- source_word: מְעַט מְעָט
  choice: 一点一点地
  rationale: 以中文叠用形式对应原文重复，突出逐步进行而非一次完成。
- source_word: לֹא תוּכַל
  choice: 你不能
  rationale: 保留原文能力或可能性受限的语气，不改写成直接禁令“不可”。
- source_word: כַּלֹּתָם
  choice: 把他们灭尽
  rationale: 表达使这些民族彻底终结的意义；“灭尽”比口语化的“解决掉”庄重，也保留完整消灭的力度。
- source_word: מַהֵר
  choice: 迅速
  rationale: 简明对应原文的速度副词，并符合现代书面汉语。
- source_word: פֶּן
  choice: 免得
  rationale: 保留警告中为避免某种后果而提出的理由。
- source_word: תִּרְבֶּה עָלֶיךָ
  choice: 增多，危害你
  rationale: “增多”直译动词；“危害你”自然呈现 עָלֶיךָ 在此警告语境中的不利、敌对关系，而非仅作中性的“对你而言”。
- source_word: חַיַּת הַשָּׂדֶה
  choice: 田野的野兽
  rationale: 较贴近字面，既保留“田野/野外”的修饰关系，也清楚指非驯养、可能构成威胁的动物。
theological_decisions:
- issue: 如何译出神名 יְהוָה
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文使用四字神名，正文以现代汉语音译“雅威”保留其专名性质；不以称号“主”替代，也不采用基于混合元音传统的“耶和华”。
- issue: לֹא תוּכַל 是能力陈述还是命令
  choice: 你不能
  alternative: 你不可
  rationale: 原文形式直接表达“不能/无法”，虽在上下文中具有规范性效果，仍不将其无标记地改成明确禁令，以保留语气张力。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“一点一点地”保留原文重复；“灭尽”维持行动的彻底性；正文不把能力陈述改写为命令。所有脚注标记均置于所说明的词语之后。
