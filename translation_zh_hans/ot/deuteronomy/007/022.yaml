  naturalness: 修订后以破折号标出“你的上帝”为同位语，句法更清楚、庄重自然；将末句连接为“以致……危害你”，使因果关系和汉语表达更流畅。
  terminology: “雅威”一致保留神名；“上帝”“这些民族”“田野的野兽”均适合现代标准汉语及本段庄重语域。原脚注a的“使这些民族从你面前失去土地”并非“赶走”的直接词汇替代，且增加了原文未明说的土地丧失表述，宜改为“逐出”。
