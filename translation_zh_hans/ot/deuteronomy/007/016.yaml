source:
  edition: WLC
  text: וְ/אָכַלְתָּ֣ אֶת כָּל הָֽ/עַמִּ֗ים אֲשֶׁ֨ר יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ נֹתֵ֣ן לָ֔/ךְ לֹא תָחֹ֥ס עֵֽינְ/ךָ֖ עֲלֵי/הֶ֑ם וְ/לֹ֤א תַעֲבֹד֙ אֶת אֱלֹ֣הֵי/הֶ֔ם כִּֽי מוֹקֵ֥שׁ ה֖וּא לָֽ/ךְ־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/016.yaml
  text: And you shall consume all the peoples whom Yahweh your God is giving to you[a]. Your eye shall not spare them, and you shall not serve their gods[c][b], for that would be a snare to you.
translation:
  language: zh_hans
  text: 你要吞灭耶和华—你的上帝交给你的各族[a]。你不可顾惜他们[b]，也不可服事他们的神，因为这会成为你的网罗[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “吞灭”原文直译为“吃掉、吞吃”，这里是战争用语，也可译作“消灭”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“你的眼不可顾惜他们”，即不可怜惜他们。
    reason: lexical_alternative
  - marker: c
    text: 或译：“因为它是你的网罗。”原文代词的所指可能是服事他们的神，也可能较广泛地指那些神或偶像崇拜的处境。
    reason: alternative_reading
lexical_decisions:
- source_word: וְאָכַלְתָּ
  choice: 吞灭
  rationale: אכל本义为“吃、吞吃”，在战争语境中比喻彻底击败或消灭；“吞灭”既保留原文意象，也能自然表达此处含义。
- source_word: כָּל הָעַמִּים
  choice: 各族
  rationale: עַמִּים指不同的族群；“各族”比“各国”更贴近这里以族群为对象的表达，同时体现כָּל的周全范围。
- source_word: אֲשֶׁר יְהוָה אֱלֹהֶיךָ נֹתֵן לָךְ
  choice: 耶和华—你的上帝交给你的
  rationale: נֹתֵן为分词，表示正在进行或即将发生的交付；汉语定语结构自然涵盖这一语义。将יהוה音译为“耶和华”，保留神的专名。
- source_word: לֹא תָחֹס עֵינְךָ עֲלֵיהֶם
  choice: 你不可顾惜他们
  rationale: 原文直译为“你的眼不可顾惜他们”，意为不可怜惜而留下他们；正文采用现代汉语常用表达，脚注保留具体的“眼”之意象。
- source_word: וְלֹא תַעֲבֹד אֶת אֱלֹהֵיהֶם
  choice: 也不可服事他们的神
  rationale: עבד用于神祇时表示以敬拜和效忠来“服事”；“服事”比单纯“敬拜”更完整地保留其盟约性含义。
- source_word: כִּי מוֹקֵשׁ הוּא לָךְ
  choice: 因为这会成为你的网罗
  rationale: מוֹקֵשׁ是捕捉用的“网罗、圈套”。“这”在汉语中自然承接前句，但不强行限定代词只指服事诸神，保留原文可能较宽的指向。
theological_decisions:
- issue: הוּא在“因为它是你的网罗”中的指向
  choice: 用“这”承接前文，不在正文中明确限定其唯一所指
  alternative: 明确译为“因为服事他们的神会成为你的网罗”，或理解为那些神、那些族群及相关偶像崇拜处境会成为网罗
  rationale: 最接近的内容是“服事他们的神”，但阳性单数代词הוּא没有一个形式上完全对应的紧邻单数先行词，也可能概括前述偶像崇拜情形。译作“这”既通顺，也保存这种指代张力。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“吞灭”保留希伯来文战争隐喻；“顾惜”传达怜惜而予以保留之意；“服事”保留עבד兼具敬拜与效忠的范围。正文中的脚注标记均与脚注对应。
