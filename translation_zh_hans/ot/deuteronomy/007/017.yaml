  yaml_path: translation/ot/deuteronomy/007/017.yaml
  text: If you say in your heart[a], ‘These nations are more numerous than I; how can I dispossess them?’
translation:
  language: zh_hans
  text: 如果你心里说：“这些国的人比我多，我怎能赶走他们呢？”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“使他们失去土地”。这里的希伯来动词含有使他们失去对那地的占有权之意。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 如果
  rationale: 这里引出一个假设情形，并由下一节接续回应；译作“如果”最符合上下文。
- source_word: תֹאמַר בִּלְבָבְךָ
  choice: 你心里说
  rationale: 保留“说”和“心”的原文意象，同时也是现代汉语表达内心思量的自然说法。
- source_word: רַבִּים הַגּוֹיִם הָאֵלֶּה מִמֶּנִּי
  choice: 这些国的人比我多
  rationale: רַבִּים 与 מִמֶּנִּי 构成数量上的比较；“这些国的人”清楚表达这里所指各国的民众，而单数“我”保留对以色列个体的直接称呼。
- source_word: אֵיכָה אוּכַל
  choice: 我怎能
  rationale: 准确表达关于能力的疑问，也保留其带有畏惧意味的反问语气。
- source_word: לְהוֹרִישָׁם
  choice: 赶走他们
  rationale: ירש 的使役式在征服土地的语境中指使当地居民失去其占有之地；“赶走”在现代汉语中自然，并能表达将他们逐出土地的行动。
