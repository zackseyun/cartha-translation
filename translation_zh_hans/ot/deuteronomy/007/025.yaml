  text: פְּסִילֵ֥י אֱלֹהֵי/הֶ֖ם תִּשְׂרְפ֣וּ/ן בָּ/אֵ֑שׁ לֹֽא תַחְמֹד֩ כֶּ֨סֶף וְ/זָהָ֤ב עֲלֵי/הֶם֙ וְ/לָקַחְתָּ֣ לָ֔/ךְ פֶּ֚ן תִּוָּקֵ֣שׁ בּ֔/וֹ כִּ֧י תוֹעֲבַ֛ת יְהוָ֥ה אֱלֹהֶ֖י/ךָ הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/025.yaml
  text: You shall burn the carved images of their gods with fire[a]. You shall not covet the silver or gold that is on them and take it for yourself, lest you be ensnared by it[b], for it is an abomination to Yahweh your God.
translation:
  language: zh_hans
  text: 他们神明的雕像，你要用火焚烧。不可贪图像上的金银，也不可取来归自己，免得因此陷入网罗[a]；因为这是耶和华——你的上帝——所憎恶的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “陷入网罗”也可译作“被它套住”。原文动词带有猎物落入圈套的意象。
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּסִילֵי אֱלֹהֵיהֶם
  choice: 他们神明的雕像
  rationale: פֶּסֶל具体指雕刻或凿制的像；“雕像”保留制作方式与实体形象。“神明”在现代汉语中自然指异教诸神，也避免将其误解为真神。
- source_word: תִּשְׂרְפוּן בָּאֵשׁ
  choice: 要用火焚烧
  rationale: 保留动词“烧”及בָּאֵשׁ所指明的手段；“焚烧”庄重而自然。
- source_word: לֹא תַחְמֹד
  choice: 不可贪图
  rationale: חמד在此指因财物可欲而生占有之念；“贪图”比单纯“想要”更准确地表达禁令中的不当欲求。
- source_word: כֶּסֶף וְזָהָב עֲלֵיהֶם
  choice: 像上的金银
  rationale: 希伯来文直为“在它们上面的银和金”，指附着、包覆或装饰雕像的贵金属；汉语惯用次序“金银”，不改变所指。
- source_word: וְלָקַחְתָּ לָךְ
  choice: 也不可取来归自己
  rationale: 把与前一否定禁令相连的动作自然译为并列禁令；“归自己”表达לָךְ所含为自己占有之意。
- source_word: פֶּן תִּוָּקֵשׁ בּוֹ
  choice: 免得因此陷入网罗
  rationale: Niphal形式表达被捕捉、落入圈套；“陷入网罗”保留捕捉意象。“因此”保留בּוֹ的指涉弹性，可联系贵金属、偶像物件或取用之举。
- source_word: תּוֹעֲבַת
  choice: 所憎恶的
  rationale: תוֹעֵבָה表示在上帝面前可憎、可厌之物；“所憎恶的”在现代汉语中有力度且自然，避免“可憎之物”可能造成的过度具体化。
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: 耶和华你上帝
  rationale: 以“耶和华”音译圣名YHWH；אֱלֹהֶיךָ译作“你上帝”，符合本项目现代标准汉语用语。
theological_decisions:
- issue: 末尾代词הוּא的所指
  choice: 译作概括性的“这”，不明确限定其先行词
  alternative: 明确译为“那雕像”“那些金银”或“这种取用行为”
  rationale: 上下文同时涉及雕像、像上的金银及将其据为己有的行为。希伯来文阳性单数代词没有在汉语中必须对应的明确先行词；“这”保留其概括性与神学张力。
- issue: בּוֹ在“陷入网罗”一语中的所指
  choice: 译为“因此”
  alternative: 译为“被它诱入网罗”或“在其中陷入网罗”
  rationale: 该代词最直接可指禁取之物，但也可能涵盖偶像及相关行为。“因此”既表达因其而受害，又不武断缩窄指涉。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。以“不可……也不可……”呈现连续禁令；保留“网罗”的具体隐喻，并用脚注说明。经文中的[a]与脚注标记完全对应。
