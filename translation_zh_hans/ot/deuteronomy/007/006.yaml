  text: כִּ֣י עַ֤ם קָדוֹשׁ֙ אַתָּ֔ה לַ/יהוָ֖ה אֱלֹהֶ֑י/ךָ בְּ/ךָ֞ בָּחַ֣ר יְהוָ֣ה אֱלֹהֶ֗י/ךָ לִ/הְי֥וֹת ל/וֹ֙ לְ/עַ֣ם סְגֻלָּ֔ה מִ/כֹּל֙ הָֽ/עַמִּ֔ים אֲשֶׁ֖ר עַל פְּנֵ֥י הָ/אֲדָמָֽה׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/006.yaml
  text: For you are a holy people to Yahweh your God. Yahweh your God has chosen you to be a treasured people for himself[a], from all the peoples who are on the face of the earth.
translation:
  language: zh_hans
  text: 因为你是归雅威——你的上帝——的圣洁子民。雅威——你的上帝——从地上的万民中拣选了你，要使你成为他所珍爱的子民[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“成为他珍贵的产业。”希伯来文此处称以色列为“子民”，并用一个指特别珍贵、专属财产或产业的词来修饰；因此也可理解为“他所珍藏的子民”。
    reason: 说明 סְגֻלָּה 所含特别珍视与专属产业的意象，同时保留 עַם“子民”的明确含义。
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，为前面的命令说明理由；“因为”自然保留解释性的逻辑关系。
- source_word: עַם קָדוֹשׁ
  choice: 为圣的子民
  rationale: 表达这群子民被分别为圣的身份；“为圣”既保留神学分量，也比单说“神圣”更能体现关系与归属。
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: 归雅威你上帝
  rationale: 介词 ל 在此表达关系和归属；“归”在现代汉语中清楚传达属于雅威之意。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以“雅威”音译四字神名，保留经文所用的盟约名字。
- source_word: בְּךָ בָּחַר
  choice: 拣选了你
  rationale: בחר 表示选择、拣选；“拣选”保留经文中的神学语感，完成体“了”表达该选择已经作出。
- source_word: לִהְיוֹת לוֹ
  choice: 使你作他所珍爱的
  rationale: 不定式表达拣选的目的，לו 表达归他所有；与下文合译，使汉语自然并保留目的和归属。
- source_word: לְעַם סְגֻלָּה
  choice: 所珍爱的子民
  rationale: עַם 明说“子民”，סְגֻלָּה 指特别珍视、归为己有的产业；此译兼顾群体身份与珍贵归属。
- source_word: מִכֹּל הָעַמִּים
  choice: 从……万民中
  rationale: מן 与 כל 在此表示从整体当中选择，避免译成“高过”而加入原文未明说的优越比较。
- source_word: אֲשֶׁר עַל פְּנֵי הָאֲדָמָה
  choice: 地面上的
  rationale: 保留“在地面上”的希伯来意象，同时以简洁自然的现代汉语修饰“万民”。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；音译“雅威”保留其作为专名的性质。
- issue: מִכֹּל הָעַמִּים 所表达的拣选关系
  choice: 从地面上的万民中
  alternative: 高过地面上的万民
  rationale: 原文明确表达从万民当中拣选，却未必在此断言内在优越性；采用“从……中”保留拣选含义而不增添比较判断。
- issue: סְגֻלָּה 的子民与产业双重意象
  choice: 所珍爱的子民
  alternative: 珍贵的产业
  rationale: 原文 עַם 明确指“子民”，而 סְגֻלָּה 带有特别珍视、专属产业之意；正文保留“子民”，脚注说明另一种表达。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“归……为圣”保留盟约归属感；“雅威你的上帝”的语序略带经文风格，但清楚易懂。
