  text: וְ/נָתַ֤ן מַלְכֵי/הֶם֙ בְּ/יָדֶ֔/ךָ וְ/הַאֲבַדְתָּ֣ אֶת שְׁמָ֔/ם מִ/תַּ֖חַת הַ/שָּׁמָ֑יִם לֹֽא יִתְיַצֵּ֥ב אִישׁ֙ בְּ/פָנֶ֔י/ךָ עַ֥ד הִשְׁמִֽדְ/ךָ֖ אֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/024.yaml
  text: And he will give their kings into your hand[a], and you shall make their name perish from under heaven. No man will stand before you until you have destroyed them.
translation:
  language: zh_hans
  text: 他必把他们的君王交在你手中；你要使他们的名从天下消失。没有人[a]能在你面前站立，直到你把他们灭尽。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文作单数“一个人”（אִישׁ），在这里是泛指，意思是无人能够站立抵挡。
    reason: 说明原文的代表性单数及其泛指意义。
lexical_decisions:
- source_word: וְנָתַן
  choice: 他必把
  rationale: 连词加完成式在此承接上文的应许，表达将来必然发生之事；第三人称单数主语按上下文指耶和华。
- source_word: מַלְכֵיהֶם בְּיָדֶךָ
  choice: 他们的君王交在你手中
  rationale: 保留“手中”的希伯来语意象，同时自然表达交付在对方权下。
- source_word: וְהַאֲבַדְתָּ אֶת־שְׁמָם
  choice: 你要使他们的名号……消失
  rationale: אבד 的使役形以“名”为宾语，所指不只是杀灭个人，也包括除去其名号、记忆与延续；“使……消失”保留使役关系。
- source_word: מִתַּחַת הַשָּׁמָיִם
  choice: 从天下
  rationale: 这是指从人世间彻底除去的惯用表达；“天下”简洁保留空间意象。
- source_word: לֹא יִתְיַצֵּב אִישׁ בְּפָנֶיךָ
  choice: 没有人能在你面前站立
  rationale: התיצב 表示站住、站立抵抗；“在你面前站立”既保留原文表达，也能在征战语境中传达无人能够抗拒。אִישׁ 在此为代表性单数，现代汉语自然译为“人”。
- source_word: עַד הִשְׁמִדְךָ אֹתָם
  choice: 直到你把他们灭尽
  rationale: עַד 加带后缀的不定词结构标明终点；שׁמד 在申命记征战语境中含彻底毁灭之意，“灭尽”保留其强度。
theological_decisions:
- issue: אִישׁ 的代表性阳性单数如何表达
  choice: 没有人能在你面前站立
  alternative: 没有一个男子能在你面前站立
  rationale: 此处 אִישׁ 虽为阳性单数，却具有泛指作用，意思是无人能够抵挡。现代汉语“人”不标语法性别，既准确表达泛指范围，也不额外缩窄为成年男性；脚注说明原文形式。
- issue: “使他们的名消失”与“毁灭他们”的区分
  choice: 前半句译“使他们的名号从天下消失”，末句译“把他们灭尽”
  alternative: 两处均译为“消灭”
  rationale: 原文前者是使役形 אבד 且宾语为“名”，后者是 שׁמד 且宾语为“他们”。分别翻译可保留用词和对象的差别，不把两层表达合并。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“交在你手中”“从天下”“在你面前站立”保留原文意象；“名号”比单说“名字”更自然地涵盖身份、名声与延续。“灭尽”体现 שׁמד 在本段征战语境中的彻底性。
