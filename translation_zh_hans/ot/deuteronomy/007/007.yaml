base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/007.yaml
  text: It was not because you were more numerous than all the peoples that Yahweh set his affection on you and chose you[a], for you were the fewest of all the peoples.
translation:
  language: zh_hans
  text: 耶和华眷爱你们[a]、拣选你们，并不是因为你们比万民人数多；因为你们在万民中人数最少。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “眷爱”也可译作“倾心于”。希伯来语动词表达深切的依恋和爱意。
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵרֻבְּכֶם מִכָּל הָעַמִּים
  choice: 因为你们比万民人数多
  rationale: מִן与表示众多的形式构成比较，放在否定句中也带出所否定的原因；这样译既保留人数上的比较，也符合现代汉语表达。
- source_word: חָשַׁק
  choice: 眷爱
  rationale: 该动词表示强烈的依恋、爱慕或把感情倾注于某人。“眷爱”简洁庄重，能表达主动而深切的爱，同时不把其含义扩展为特定的系统神学概念。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 原文使用神的专名四字神名。中文采用读者熟悉的专名形式“耶和华”，而不以称号代替。
- source_word: וַיִּבְחַר בָּכֶם
  choice: 拣选你们
  rationale: בחר的基本意义是选择；“拣选”保留圣经语域及盟约语境中的用词连续性，不额外引入后世教义解释。
- source_word: כִּי אַתֶּם הַמְעַט מִכָּל הָעַמִּים
  choice: 其实你们在万民中人数最少
  rationale: כִּי在这里说明前面否定陈述的事实根据，可自然译为“其实”；הַמְעַט在人数对比中指数量最少，而不是地位最低。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用神的专名。中文正文采用历史上广为人知且明确作为专名使用的“耶和华”，不以“主”等称号替换。
- issue: 神拣选以色列的表述
  choice: 拣选你们
  alternative: 选择你们
  rationale: 直译原文的בחר，保留盟约性选择的陈述；本节只否定人数众多是拣选的原因，因此不添加关于拣选范围、方式或目的的系统神学说明。
- issue: חָשַׁק所表达的神圣情感
  choice: 眷爱
  alternative: 倾心爱你们
  rationale: “眷爱”表达主动、深切的依恋，却不把该词严格限定为某一种技术性的“约爱”概念，从而保留其情感和关系层面的张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“万民”保留原文各族群的集体含义；“人数多／人数最少”明确前后均指数量，避免将“小”误解为地位卑微。脚注标记置于整节末尾，对“眷爱”提供词义补充。
