base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/018.yaml
  text: You shall not fear them[a]; you shall surely remember what Yahweh your God did to Pharaoh and to all Egypt.
translation:
  language: zh_hans
  text: 你不要害怕他们；务要牢记[a]雅威——你的上帝——向法老和全埃及所做的事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语直译为“记住，你要记住”，以不定式绝对形加同词根未完成式的结构加强语气；也可译作“一定要记住”。
    reason: 说明原文不定式绝对形加未完成式的强调结构及可选译法。
lexical_decisions:
- source_word: לֹא תִירָא מֵהֶם
  choice: 你不要怕他们
  rationale: לֹא加未完成式在这里表达禁止；מִן跟在“惧怕”之后，标明惧怕的对象。译文采用现代汉语中直接、庄重的禁令表达。
- source_word: זָכֹר תִּזְכֹּר
  choice: 务要牢记
  rationale: 动词不定式绝对形与同词根未完成式连用，强化“记念”的语气。“务要牢记”既传达强调，也符合自然、庄重的现代汉语。
- source_word: אֵת אֲשֶׁר עָשָׂה
  choice: 怎样对付
  rationale: 该结构指雅威已经施行的事；在法老和埃及作为受事者的语境中，“怎样对付”自然表达其历史行动，同时不逐项限定这些行动的内容。
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: 你的上帝雅威
  rationale: 保留四字神名的音译“雅威”，并将第二人称阳性单数后缀译为“你的”；此单数称呼把以色列作为一个整体来直接劝诫。
- source_word: לְפַרְעֹה וּלְכָל מִצְרָיִם
  choice: 法老和全埃及
  rationale: 介词לְ标明雅威行动所针对的对象。“全埃及”保留原文对国家或地域的集合性称呼，没有擅自改成“所有埃及人”。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名，而非称号。译作“雅威”保留其专名性质；不以“主”替代，也不采用较传统但依据较晚混合读音形成的“耶和华”。
- issue: 对雅威昔日作为的“记念”
  choice: 务要牢记
  alternative: 一定要想起；要常常记得
  rationale: 原文强调的是坚定、切实地记住出埃及的历史作为，并未明确加入“常常”这一频率含义；因此保留强调，却不扩展为额外命令。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“务要”保留盟约劝诫的郑重语气；“牢记”清楚传达强调。“你的上帝雅威”按自然汉语语序同时保留神名和关系称谓。
