  text: וְ/לֹ֥א תִתְחַתֵּ֖ן בָּ֑/ם בִּתְּ/ךָ֙ לֹא תִתֵּ֣ן לִ/בְנ֔/וֹ וּ/בִתּ֖/וֹ לֹא תִקַּ֥ח לִ/בְנֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/003.yaml
  text: 'And you shall not intermarry with them: you shall not give your daughter to his son[a], and you shall not take his daughter for your son.'
translation:
  language: zh_hans
  text: 不可与他们结亲[a]；不可把你的女儿嫁给他们的儿子，也不可为你的儿子娶他们的女儿。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不可与他们联姻。”
    reason: “结亲”所译的希伯来语动词强调借婚姻建立姻亲关系；“联姻”更突出群体或家族之间的婚姻结合。
lexical_decisions:
- source_word: תִתְחַתֵּן
  choice: 结亲
  rationale: 该词是 חתן 的 Hitpael 形式，指借婚姻建立相互的姻亲关系。“结亲”既体现这种关系性和社会性，也比单说“结婚”更准确。
- source_word: בָּם
  choice: 与他们
  rationale: 介词 ב 加第三人称阳性复数后缀，回指上文列举的各族；“与他们”符合现代汉语中“结亲”的搭配。
- source_word: בִּתְּךָ
  choice: 你的女儿
  rationale: 保留原文第二人称阳性单数所属形式和性别明确的亲属称谓。
- source_word: תִתֵּן
  choice: 把……嫁给
  rationale: 原义为“给”，但在女儿与对方儿子的婚姻语境中，现代汉语必须用“嫁给”才能自然、明确地表达同一动作。
- source_word: לִבְנוֹ
  choice: 给他们的儿子
  rationale: 原文形式为第三人称阳性单数“他的儿子”，接续复数的“他们”，在法律表述中具有逐一、分配性的用法；汉语用“他们的儿子”自然回指上文各族，不把对象误解为某一个未指明的男子。
- source_word: וּבִתּוֹ
  choice: 他们的女儿
  rationale: 原文为第三人称阳性单数“他的女儿”，与前一分句相同，按集合中的个体作分配性理解；汉语用复数所属形式保持回指清楚。
- source_word: תִקַּח
  choice: 娶
  rationale: 原义为“取”，在为儿子取得对方女儿作妻子的语境中，“娶”是现代汉语准确而简洁的对应表达。
- source_word: לִבְנֶךָ
  choice: 为你的儿子
  rationale: ל 表示关系或受益对象；“为你的儿子娶”符合汉语婚姻用语，并保留第二人称单数。
theological_decisions:
- issue: 禁令的范围
  choice: 把“他们”保留为对上文所列各族的直接回指，不将本节改写成针对所有外族婚姻的普遍命题。
  alternative: 译成概括禁止一切异族通婚，或将禁令解释为脱离盟约语境的纯族群规定。
  rationale: 本节只以“他们”指向前文对象；翻译不应加入下一节才说明的动机，也不应擅自扩大或缩小其范围。
- issue: 带性别的亲属称谓
  choice: 保留“女儿”和“儿子”的单数法律表述。
  alternative: 用“子女”之类性别中性的集合称谓。
  rationale: 原文以性别明确的单数亲属词构成代表性的法律条文；保留这些区别更忠实。
- issue: 第三人称单数后缀与复数先行词
  choice: 在正文中译作“他们的儿子／女儿”，按分配性关系自然表达。
  alternative: 形式化地译作“他的儿子／女儿”。
  rationale: 原文先用复数“他们”，随后以单数后缀逐一指涉其中成员。汉语若突换成“他”会产生无明确先行词的歧义；复数表达不改变禁令对象。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“结亲”“嫁给”“娶”符合当代普通读者的表达习惯，同时保留法律条文的简洁和第二人称训令语气。
