base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/002.yaml
  text: And when Yahweh your God gives them over to you before you[a], and you strike them down, you shall utterly devote them to destruction[b]. You shall make no covenant with them and show them no favor.
translation:
  language: zh_hans
  text: 雅威你的神把他们交在你面前，你击败他们以后，务必彻底毁灭他们[a]。不可与他们立约，也不可向他们施恩[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“务要把他们置于禁毁之下。”希伯来文以同一词根的不定式绝对式加强语气，指将对象完全献归于毁灭。
    reason: 说明חרם的强化结构，以及其“禁毁／献归于毁灭”的特殊语义。
  - marker: b
    text: 或译：“也不可怜悯他们。”
    reason: 保留חנן在此语境中可表达怜悯的译法。
lexical_decisions:
- source_word: וּנְתָנָם
  choice: 把他们交在你面前
  rationale: 军事语境中的 נתן 表示把敌人交付在某人权下；“交在你面前”既保留神主动交付的含义，也对应 לְפָנֶיךָ。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译呈现四字神名，保留其作为以色列之神专名的性质，不以称号替代。
- source_word: וְהִכִּיתָם
  choice: 你击败他们
  rationale: נכה 在战争语境中可指击打、击杀或击败；“击败”自然地表达军事行动，同时不把词义限定为逐一杀死。
- source_word: הַחֲרֵם תַּחֲרִים אֹתָם
  choice: 务要把他们完全献作当毁灭的
  rationale: חרם 的不定式绝对式与限定动词连用，表示强烈、彻底的行动；此译保留将对象不可撤回地献出并予以毁灭的宗教性含义，而不只译作一般性的“消灭”。
- source_word: לֹא תִכְרֹת לָהֶם בְּרִית
  choice: 不可跟他们立约
  rationale: כרת ברית 是“立约”的固定表达；“立约”在现代汉语中自然，并保留“约”而不窄化为政治条约。
- source_word: וְלֹא תְחָנֵּם
  choice: 也不可向他们施恩
  rationale: חנן 的核心语义是施恩、赐予恩惠；“施恩”比“怜悯”更直接保留该词的恩惠语义，后者作为语境上可行的译法收入脚注。
theological_decisions:
- issue: 圣战语境中 חרם 的译法
  choice: 务要把他们完全献作当毁灭的
  alternative: 务要把他们彻底毁灭；务要把他们置于禁毁之下
  rationale: 主译保留 חרם 同时具有奉献、禁毁与毁灭的张力，不把它简化为普通军事消灭；脚注列出较直白及较术语化的译法。
- issue: תְחָנֵּם 的译法
  choice: 不可向他们施恩
  alternative: 不可怜悯他们
  rationale: “施恩”贴近 חנן 的基本词义；“怜悯”符合本节严厉处置的语境，却会将词义收窄，因此列作脚注异译。
translation_notes:
  register: 采用现代、庄重而直接的标准普通话。“雅威”作为神名音译；“献作当毁灭的”刻意保留原文 חרם 的神学张力，并以脚注帮助普通读者理解。两个脚注标记均紧随其所说明的短语。
