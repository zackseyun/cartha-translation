revisions:
- from: 而是因为耶和华爱你们，也因为他信守向你们列祖所起的誓，耶和华才用大能的手把你们领出来，把你从奴役之家[a]，从埃及王法老的手中救赎出来。
  to: 而是因为耶和华爱你们，也因为他信守向你们列祖所起的誓，耶和华才以大能的手把你们领出来，把你从为奴之家[a]，从埃及王法老的手中救赎出来。
  rationale: 仅作两项安全的措辞调整：“奴役之家”改为“为奴之家”，以更贴近原文所指的受奴役之地并提升中文惯用度；“用”改为“以”，使“大能的手”的表达更自然。保留神名“耶和华”、列祖用语、救赎术语、两处“手”的意象，以及原文由复数转为集合性单数的代词变化。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T04:57:16Z'
review_pass:
  verdict: revise
  source_fidelity: 译文总体准确呈现了第7节否定之后的对比性原因、耶和华对以色列的爱、对向列祖所起之誓的信守，以及出埃及与救赎的双重行动。原文先用复数“你们”（אֶתְכֶם），后转为集合性单数“你”（וַיִּפְדְּךָ）；中文保留此转换可以成立。惟“奴役之家”较抽象，弱化了“家／处所”及“奴隶”的具体表达；改为“为奴之家”较符合现代汉语圣经书面语，也保留受奴役之地的含义。
  naturalness: “而是因为”“信守……所起的誓”及“埃及王法老”均自然、庄重。“以大能的手”比“用大能的手”更符合中文惯用的庄重书面表达，同时保留原文“手”的意象。其余句法可维持。
  terminology: “耶和华”“列祖”“誓”“救赎”“法老”均一致且适切。“为奴之家”避免将 עֲבָדִים 处理为纯抽象的“奴役”，并不将其弱化为一般服事。英文审校轨迹中脚注 a、b 的锚点与说明内容似有互换，但中文稿的脚注锚点和内容本身相符，故不据此改动中文锚点。
