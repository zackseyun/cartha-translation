    rationale: 该短语字面为“奴隶之家”，惯用义为受奴役之地。“为奴之家”在现代中文中自然，且比“奴役之家”更贴近原文的处境表达。
  - severity: low
    issue: “用大能的手”略不如“以大能的手”自然。
    rationale: 两者都可译出 בְּיָד חֲזָקָה；“以大能的手”更合中文庄重书面语的工具性表达，且不改变意思。
