source:
  edition: WLC
  text: כִּי֩ מֵֽ/אַהֲבַ֨ת יְהוָ֜ה אֶתְ/כֶ֗ם וּ/מִ/שָּׁמְר֤/וּ אֶת הַ/שְּׁבֻעָה֙ אֲשֶׁ֤ר נִשְׁבַּע֙ לַ/אֲבֹ֣תֵי/כֶ֔ם הוֹצִ֧יא יְהוָ֛ה אֶתְ/כֶ֖ם בְּ/יָ֣ד חֲזָקָ֑ה וַֽ/יִּפְדְּ/ךָ֙ מִ/בֵּ֣ית עֲבָדִ֔ים מִ/יַּ֖ד פַּרְעֹ֥ה מֶֽלֶךְ מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/008.yaml
  text: but because Yahweh loves you and because he is keeping the oath that he swore to your fathers[a], Yahweh brought you out with a mighty hand and redeemed you from the house of slaves[b], from the hand of Pharaoh king of Egypt.
translation:
  language: zh_hans
  text: 而是因为耶和华爱你们，也因为他信守向你们列祖所起的誓，耶和华才以大能的手把你们领出来，把你从为奴之家[a]，从埃及王法老的手中救赎出来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译“奴隶之家”，也可译作“为奴之家”。
    reason: 说明 עֲבָדִים 的字面表达，并保留正文为求自然所采用译法之外的可能译法。
lexical_decisions:
- source_word: כִּי
  choice: 而是因为
  rationale: 本句承接第7节“并不是因为……”，既有解释原因的作用，也有转折对比的作用；“而是因为”自然保留这两层语篇功能。
- source_word: מֵאַהֲבַת יְהוָה אֶתְכֶם
  choice: 因为耶和华爱你们
  rationale: מִן在此表示原因；将名词性结构转为现代汉语的动词句，准确而自然。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文圣经语境中通行的神名音译，保留原文所用的专名而不以称号替代。
- source_word: וּמִשָּׁמְרוֹ אֶת הַשְּׁבֻעָה
  choice: 也因为他信守……所起的誓
  rationale: 该结构与前一原因短语平行；“信守”表达守住所起之誓的持续忠信，“誓”保留其庄严性。
- source_word: אֲשֶׁר נִשְׁבַּע לַאֲבֹתֵיכֶם
  choice: 向你们列祖所起的
  rationale: “列祖”准确指向以色列的先祖，尤其是族长传统，并符合庄重而易懂的中文圣经语体。
- source_word: הוֹצִיא
  choice: 领出来
  rationale: 这是典型的出埃及表述；“领出来”在汉语中自然，并明确表达从埃及境内带出的行动。
- source_word: בְּיָד חֲזָקָה
  choice: 用大能的手
  rationale: 保留“手”的原文意象，同时用“大能”表达该习语所指的强有力施行和拯救。
- source_word: וַיִּפְדְּךָ
  choice: 把你……救赎出来
  rationale: פדה表示从奴役或权势之下赎出；“救赎”保留出埃及事件的救赎含义，并借“出来”使汉语句法完整。
- source_word: מִבֵּית עֲבָדִים
  choice: 从奴役之家
  rationale: 原文直译为“奴隶之家”。“奴役之家”保留“家”的具体意象，同时在现代汉语中更自然地指受奴役的境地。
- source_word: מִיַּד פַּרְעֹה
  choice: 从……法老的手中
  rationale: 保留“手”的希伯来语意象，在中文中也自然表示脱离某人的权势。
- source_word: מֶלֶךְ מִצְרָיִם
  choice: 埃及王法老
  rationale: 按自然汉语词序表达法老的身份，内容与原文一致。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用四字神名。中文采用广为人知的专名“耶和华”，以专名对应专名，不用“主”等称号替代；“雅威”亦是可能的学术音译。
- issue: אֲבֹתֵיכֶם 所指的盟约先祖
  choice: 你们列祖
  alternative: 你们的祖先
  rationale: “列祖”保留原文男性复数及其救赎历史背景，比泛化的“祖先”更能指向以色列的父祖传统。
- issue: עֲבָדִים 的奴役含义
  choice: 奴役之家
  alternative: 奴隶之家
  rationale: 埃及处境中的强制性奴役不可弱化为一般服事；正文以自然中文表达其制度和处境，脚注给出更贴近字面的译法。
- issue: 单复数代词的转换
  choice: 前半句用“你们”，后半句用“你”
  alternative: 全句统一用“你们”
  rationale: 原文在本节中由复数宾语 אֶתְכֶם 转为集合性单数后缀 ךָ。保留这一转换，可显出摩西既向全体以色列人说话，又把以色列视为一个整体的原文张力。
translation_notes:
  register: 采用现代、庄重而清晰的普通话书面语。“而是因为”承接上文对比；“信守……所起的誓”避免生硬名词化。刻意保留原文由复数“你们”转为集合性单数“你”的变化，以及两处“手”的意象。
