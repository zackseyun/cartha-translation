  text: וּ/נְתָנָ֛/ם יְהוָ֥ה אֱלֹהֶ֖י/ךָ לְ/פָנֶ֑י/ךָ וְ/הָמָ/ם֙ מְהוּמָ֣ה גְדֹלָ֔ה עַ֖ד הִשָּׁמְדָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/023.yaml
  text: But Yahweh your God will give them over to you and throw them into great confusion until they are destroyed[a][b].
translation:
  language: zh_hans
  text: 但雅威你的上帝必把他们交在你手中[a]，使他们陷入极大的混乱[b]，直到他们被消灭。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“交在你面前”；这里指雅威把这些敌人交在你的权势之下。
    reason: lexical_alternative
  - marker: b
    text: 或译“使他们极其惊慌”，也可理解为“使他们大乱”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּנְתָנָם
  choice: 必把他们交在你手中
  rationale: נתן以“他们”为宾语，并与לְפָנֶיךָ连用，在战争语境中表示把敌人交由以色列掌控；“交在你手中”是现代汉语中自然且准确的表达。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文辅音神名YHWH音译，保留经文所用的上帝专名，而不以称号替代。
- source_word: אֱלֹהֶיךָ
  choice: 你的上帝
  rationale: 该词带第二人称阳性单数后缀，直指“你的上帝”；本节的“你”是单数。
- source_word: לְפָנֶיךָ
  choice: 在你手中
  rationale: 字面为“在你面前”，但与נתן连用时表示将敌人置于某人的权势之下；译文采用汉语对应习语，字面形式收入脚注。
- source_word: וְהָמָם
  choice: 使他们陷入
  rationale: המם在战事语境中有使人惊惶、混乱或溃败之意；与后接名词מְהוּמָה共同构成加强表达，译为“使他们陷入极大的混乱”。
- source_word: מְהוּמָה גְדֹלָה
  choice: 极大的混乱
  rationale: מְהוּמָה可指混乱、惊慌或骚动；“极大的混乱”涵盖战场上惊惶失序的核心语义，同时保持现代、庄重的表达。
- source_word: עַד הִשָּׁמְדָם
  choice: 直到他们被消灭
  rationale: עַד加שׁמד的带后缀不定式，表达行动持续至他们灭亡这一终点；被动式中文保留其结果性。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名YHWH；“雅威”较直接地按其通常重构读音音译，保留作为专名的性质。
translation_notes:
  register: 采用现代标准普通话，措辞庄重而通俗。“必”体现此处未完成式在应许语境中的确定将来意义；“交在你手中”以自然汉语传达军事语境中的支配权。
