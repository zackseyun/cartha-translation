  text: כִּֽי אִם כֹּ֤ה תַעֲשׂוּ֙ לָ/הֶ֔ם מִזְבְּחֹתֵי/הֶ֣ם תִּתֹּ֔צוּ וּ/מַצֵּבֹתָ֖/ם תְּשַׁבֵּ֑רוּ וַ/אֲשֵֽׁירֵ/הֶם֙ תְּגַדֵּע֔וּ/ן וּ/פְסִילֵי/הֶ֖ם תִּשְׂרְפ֥וּ/ן בָּ/אֵֽשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/005.yaml
  text: 'But this is what you shall do to them: you shall tear down their altars[a], shatter their pillars, cut down their Asherah poles[c][b], and burn their carved images with fire.'
translation:
  language: zh_hans
  text: 你们却要这样处置他们：拆毁他们的祭坛，打碎他们的石柱[a]，砍倒他们的亚舍拉柱[b]，把他们的雕刻偶像[c]用火焚烧。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “石柱”指为祭祀或崇拜而立的石头，也可译作“祭柱”或“立石”。
    reason: lexical_alternative
  - marker: b
    text: “亚舍拉柱”：原文为“亚舍拉们”，指与女神亚舍拉有关的崇拜物，可能是木柱、木像或经过处理的树木。其具体形制并不完全确定。
    reason: cultural_note
  - marker: c
    text: 或译“雕像”；原文特指雕刻而成的像，在这里是受人崇拜的偶像。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם כֹּה תַעֲשׂוּ לָהֶם
  choice: 你们却要这样处置他们
  rationale: כִּי אִם承接上文，表达强烈转折；כֹּה前指随后列出的具体行动。法律训令语境中的未完成式具有命令效力。“处置”自然地统摄后续针对其崇拜设施的行动。
- source_word: מִזְבְּחֹתֵיהֶם תִּתֹּצוּ
  choice: 拆毁他们的祭坛
  rationale: נתץ指拆除、毁坏建筑物；“拆毁”既准确又符合祭坛这一对象。
- source_word: מַצֵּבֹתָם תְּשַׁבֵּרוּ
  choice: 打碎他们的石柱
  rationale: מַצֵּבָה在此指用于宗教崇拜的立石或石柱；שׁבר的加强词干表达有力的击碎动作。“石柱”保留实体特征，脚注说明其祭祀用途。
- source_word: אֲשֵׁירֵיהֶם תְּגַדֵּעוּן
  choice: 砍倒他们的亚舍拉木柱
  rationale: אֲשֵׁרִים指与女神亚舍拉有关的崇拜物，גדע则常指砍倒树木或木制物。“亚舍拉木柱”兼顾专名、可能的材质及动作搭配，同时以脚注保留具体形制的不确定性。
- source_word: פְסִילֵיהֶם
  choice: 他们的雕刻偶像
  rationale: פֶּסֶל具体指雕刻而成、用作崇拜对象的像。“雕刻偶像”同时保留制作方式和宗教功能。
- source_word: תִּשְׂרְפוּן בָּאֵשׁ
  choice: 用火焚烧
  rationale: 译出原文明确出现的“火”，并以“焚烧”保持命令的力度和庄重语体。
theological_decisions:
- issue: אֲשֵׁרִים应译为特定的亚舍拉崇拜物，还是泛称偶像
  choice: 亚舍拉木柱
  alternative: 偶像；亚舍拉像；亚舍拉崇拜物
  rationale: 本节逐项列举不同种类的迦南崇拜设施，不宜把这一特定词语泛化为“偶像”。正文给出便于理解的具体称呼，脚注则说明其形制并非完全确定。
- issue: 是否弱化毁坏异教崇拜设施的命令语气
  choice: 使用“拆毁、打碎、砍倒、焚烧”等直接而有力的动词
  alternative: 采用“清除、除掉”等较缓和的概括性表达
  rationale: 希伯来文连续使用具体、强烈的命令形式。译文保留其力度，但不添加经文本身未明说的神学辩护或适用范围。
translation_notes:
  register: 采用现代、庄重而直接的普通话。四个并列动词保持原文命令的节奏和力度；避免把“木偶”用作亚舍拉崇拜物的名称，因为现代汉语通常会将其理解为供操纵表演的偶人。
