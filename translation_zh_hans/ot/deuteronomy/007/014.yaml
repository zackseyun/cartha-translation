base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/014.yaml
  text: You will be blessed above all peoples[a]; there will not be among you a barren man or woman[b], or among your livestock.
translation:
  language: zh_hans
  text: 你必比万民更蒙福[a]；你中间不会有不能生育的男人或女人[b]；你的牲畜中也不会有不能生育的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你必蒙福，胜过万民。”这里的希伯来语介词可表示比较。
    reason: lexical_alternative
  - marker: b
    text: 希伯来原文明确使用阳性和阴性两个形式，即不能生育的男人和女人。
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ תִּהְיֶה
  choice: 你必蒙福
  rationale: 保留被动分词所表达的蒙福状态，并以“必”传达未完成式在盟约应许中的将来与确定意味。
- source_word: מִכָּל הָעַמִּים
  choice: 胜过万民
  rationale: מן在此最自然地表示比较；“胜过万民”简明保留比较义，且符合现代汉语表达。
- source_word: לֹא יִהְיֶה בְךָ
  choice: 在你中间……都没有
  rationale: 这是存在句，בְךָ指以色列这一群体之中；保留第二人称单数的集体指向。
- source_word: עָקָר וַעֲקָרָה
  choice: 无论男女都没有不能生育的
  rationale: 希伯来文并列阳性与阴性形式；译文明确保留男女双方，同时避免使用过度医学化的措辞。
- source_word: וּבִבְהֶמְתֶּךָ
  choice: 你的牲畜中也没有不能生育的
  rationale: בְּהֵמָה在此泛指家养牲畜；补出前文省略的谓语，使中文语义完整自然。
theological_decisions:
- issue: 盟约祝福中男女不育用语的性别区分
  choice: 明确译作“无论男女都没有不能生育的”
  alternative: 笼统译作“没有不育的”
  rationale: 原文特意并列阳性עָקָר和阴性עֲקָרָה，不宜抹平这一对应；同时不把原文扩大为特定医学诊断。
- issue: 对以色列的集体单数称呼
  choice: 保留“你／你的”
  alternative: 改为“你们／你们的”
  rationale: 希伯来文以第二人称阳性单数称呼作为盟约整体的以色列；中文单数形式可以保留这一源文特征。
- issue: מִכָּל的比较关系
  choice: 正文译“胜过万民”
  alternative: “比万民更蒙福”
  rationale: 两者都能表达比较义；正文选择较凝练庄重的说法，并以脚注保留另一种直白表达。
translation_notes:
  register: 采用现代、庄重且易懂的标准普通话。“万民”保留经文语体的凝练感；“不能生育”比“不孕不育”少医学色彩，也适用于男女。牲畜分句补出原文承前省略的“没有不能生育的”，以免中文产生结构歧义。
