  text: לֹ֥א תַעֲרֹ֖ץ מִ/פְּנֵי/הֶ֑ם כִּֽי יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ בְּ/קִרְבֶּ֔/ךָ אֵ֥ל גָּד֖וֹל וְ/נוֹרָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/021.yaml
  text: Do not dread them[a], for Yahweh your God is in your midst[c][b], a great and fearsome God.
translation:
  language: zh_hans
  text: 不要因他们而惊恐[a]，因为雅威你的上帝在你中间[b]，是伟大而可畏的上帝[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不要在他们面前害怕。”
    reason: lexical_alternative
  - marker: b
    text: “在你中间”也可译作“在你们当中”；这里的“你”是单数，指作为整体的以色列。
    reason: clarification
  - marker: c
    text: “可畏”也可译作“令人敬畏”；希伯来文兼有使人畏惧和激发敬畏之意。
    reason: lexical_alternative
lexical_decisions:
- source_word: תַעֲרֹץ
  choice: 惊恐
  rationale: 该动词在此表示因强敌而胆怯、恐惧；“惊恐”保留了比一般“害怕”更强的语气，同时符合现代汉语。
- source_word: מִפְּנֵיהֶם
  choice: 因他们
  rationale: 字面为“从他们面前”，在此是面对敌人而惧怕的惯用表达；译作“因他们”与“惊恐”自然搭配。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译保留希伯来文中的上帝专名，而不以称号替代。
- source_word: אֱלֹהֶיךָ
  choice: 你的上帝
  rationale: 明确保留第二人称单数所属关系和盟约语境。
- source_word: בְּקִרְבֶּךָ
  choice: 在你中间
  rationale: 指上帝临在于以色列民中；避免译成“在你里面”而被误解为单纯的个人内在经验。
- source_word: אֵל גָּדוֹל
  choice: 伟大的上帝
  rationale: אֵל在此是对雅威的同位称谓，גָּדוֹל直译为“伟大”。
- source_word: וְנוֹרָא
  choice: 可畏
  rationale: 该词表示令人敬畏、使人产生畏惧；“可畏”兼顾威严与惧怕，避免把含义弱化为普通的“令人赞叹”。
theological_decisions:
- issue: 如何处理神名יהוה
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。译作“雅威”保留其专名性质，也较贴近学界通常重构的读音；不以“主”这一称号代替。
- issue: נוֹרָא所表达的敬畏与恐惧
  choice: 可畏
  alternative: 令人敬畏；可怕
  rationale: “可畏”既保留上帝使人畏惧的一面，也不把词义局限为负面的恐怖感，从而保留原文的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“就在”自然强调上帝确实临在于以色列中间；整体保留原文第二人称单数的集体指向。
