base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/010.yaml
  text: and repays those who hate him to their face[a], to destroy them. He does not delay with the one who hates him; he will repay him to his face.
translation:
  language: zh_hans
  text: 又当面[a]报应恨他的人，使他们灭亡。他绝不迟延报应那恨他的人，必当面报应他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“向着他的面”；这个说法也可理解为“在他面前”或“当着他的面”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמְשַׁלֵּם
  choice: 又……报应
  rationale: שׁלם 的 Piel 形在此指按人的行为施行回报。“报应”自然地表达审判和相称回报的含义，“又”承接上文。
- source_word: לְשֹׂנְאָיו / לְשֹׂנְאוֹ
  choice: 恨他的人 / 那恨他的人
  rationale: שׂנא 的分词指以恨他为特征的人；不扩大译为较宽泛的“仇敌”。首处为复数，后处转为单数个体，译文以“那”体现这一聚焦。
- source_word: אֶל־פָּנָיו
  choice: 当面[a]
  rationale: 该惯用语字面涉及“向着他的面”，在本语境中强调直接、公开地临到本人。“当面”简洁自然，同时脚注保留字面和空间性理解。
- source_word: לְהַאֲבִידוֹ
  choice: 使那人灭亡
  rationale: אבד 的 Hiphil 不定式表达使之毁灭，并可表示目的或结果。原文为阳性单数后缀，译作“那人”既对应单数，也避免连续代词造成指代混乱。
- source_word: לֹא יְאַחֵר
  choice: 绝不迟延
  rationale: אחר 的 Piel 形表示耽延、推迟；“绝不”传达 לֹא 的明确否定，并符合这一盟约性宣告的力度。
- source_word: יְשַׁלֶּם לוֹ
  choice: 必……报应他
  rationale: 与开头的 וּמְשַׁלֵּם 保持词汇呼应；未弱化为非人格化的“承担后果”。“必”自然体现未完成式在此语境中的确定性。
theological_decisions:
- issue: 上帝施行审判的主体性
  choice: 保留上帝亲自报应并使恨他的人灭亡的表述
  alternative: 译成恨他的人自然承受后果
  rationale: 希伯来文以上文所指的上帝为施动者，直接使用“报应”和“使……灭亡”；译文不将其淡化为非人格化的因果规律。
- issue: לְהַאֲבִידוֹ 的目的与结果关系
  choice: 采用可兼容目的和结果的“使那人灭亡”
  alternative: 明确译为“为要除灭他”或“以除灭他”
  rationale: 不定式可表达目的，也可与报应的结果紧密相连；中文不强行限定二者之一，以保留原文张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“报应”保留司法性回报的力度；通过“那人”澄清原文单数后缀，同时避免中文多个“他”连续出现时的歧义。
