source:
  edition: WLC
  text: וְ/הָיָ֣ה עֵ֣קֶב תִּשְׁמְע֗וּ/ן אֵ֤ת הַ/מִּשְׁפָּטִים֙ הָ/אֵ֔לֶּה וּ/שְׁמַרְתֶּ֥ם וַ/עֲשִׂיתֶ֖ם אֹתָ֑/ם וְ/שָׁמַר֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ לְ/ךָ֗ אֶֽת הַ/בְּרִית֙ וְ/אֶת הַ/חֶ֔סֶד אֲשֶׁ֥ר נִשְׁבַּ֖ע לַ/אֲבֹתֶֽי/ךָ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/012.yaml
  text: And because you listen to these judgments[a], and keep and do them[c][b], Yahweh your God will keep for you the covenant and the steadfast love that he swore to your fathers.
translation:
  language: zh_hans
  text: 你们若听从这些典章，又谨守、遵行这些典章，耶和华你们的上帝就必为你们守住他向你们列祖所起誓的盟约和慈爱[a][b][c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “典章”也可译作“法令”、“规例”或“律例”。
    reason: lexical_alternative
  - marker: b
    text: “慈爱”所译的希伯来词含有坚定、忠诚、守约之爱的意思，也可译作“坚贞的爱”或“守约的信实”。
    reason: lexical_alternative
  - marker: c
    text: “列祖”原文直译为“父辈”，指以色列的先祖。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה עֵקֶב
  choice: 若……就必
  rationale: 这一结构引出以随后行为为条件的结果。汉语用“若……就必”自然表达条件与后果，同时避免生硬直译为“事情将是，因为”。
- source_word: תִּשְׁמְעוּן
  choice: 听从
  rationale: שׁמע在此兼有听见和顺从之意；“听从”在现代汉语中自然保留回应性顺服的含义。
- source_word: הַמִּשְׁפָּטִים הָאֵלֶּה
  choice: 这些典章
  rationale: מִשְׁפָּטִים在申命记的法律语境中指判例、规章或法令。“典章”庄重且能与其他律法术语保持一定区分。
- source_word: וּשְׁמַרְתֶּם וַעֲשִׂיתֶם אֹתָם
  choice: 谨守并遵行
  rationale: 保留“守”与“行”两个动词，呈现希伯来文的双重强调；“谨守并遵行”是自然、清楚而庄重的中文。
- source_word: וְשָׁמַר
  choice: 守
  rationale: 与前句表示以色列“谨守”的同一希伯来词相呼应，保留百姓守典章与上帝守约之间的语言联系。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文圣经语域中最广为人知的神名音译，明确呈现专名而非以称号替代。
- source_word: אֱלֹהֶיךָ
  choice: 你们的上帝
  rationale: 希伯来文形态为单数第二人称，但摩西面对的是作为整体的以色列；现代汉语用复数“你们”符合上下文受众，并自然表达盟约关系。
- source_word: לְךָ
  choice: 向你们
  rationale: 表达上帝守约、施慈爱的对象和受益者；与中文“向……守约、施慈爱”的搭配自然。
- source_word: הַבְּרִית
  choice: 约
  rationale: בְּרִית是核心盟约术语；中文圣经传统和现代教会语境通常以“约”准确表达。
- source_word: הַחֶסֶד
  choice: 慈爱
  rationale: חֶסֶד兼有仁爱、忠诚和盟约信实的内涵。“慈爱”简洁自然，正文保留其恩慈关系面，脚注说明其坚贞和守约色彩。
- source_word: אֲשֶׁר נִשְׁבַּע
  choice: 就是他……起誓所应许的
  rationale: 希伯来文直言“所起誓的”；中文补出“应许”使“向某人起誓”的内容关系清楚，同时仍明确保留誓言性质。
- source_word: לַאֲבֹתֶיךָ
  choice: 向你们列祖
  rationale: אָבוֹת在这里特指以色列的先祖，尤其承受应许的列祖。“列祖”保留男性祖先和族群历史语境。
theological_decisions:
- issue: חֶסֶד在盟约语境中的译法
  choice: 慈爱
  alternative: 坚贞的爱；守约的信实；忠爱
  rationale: 该词同时包含恩慈、忠诚和持久的盟约委身。正文采用普通读者熟悉的“慈爱”，但不把它缩减为单纯情感；脚注注明其守约忠诚的内涵。
- issue: 百姓遵行与上帝守约之间的条件关系
  choice: 以“若……就必”保留经文明确的条件—结果结构
  alternative: 译作较弱的时间关系“当……时”
  rationale: עֵקֶב在这里表达因由或结果关系。译文不进一步断定这是否意味着功德赚取应许，也不以神学解释削弱经文本身的条件张力。
- issue: לַאֲבֹתֶיךָ所指的性别与群体
  choice: 列祖
  alternative: 祖先
  rationale: 原文使用阳性复数，并在申命记语境中指承受誓约的先祖。“列祖”既准确又符合庄重中文语域。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。以“谨守并遵行”保留两个盟约性动词，以前后重复的“守”呈现百姓守典章与耶和华守约的修辞呼应。神名译作“耶和华”；“上帝”用于אֱלֹהִים。所有脚注标记均置于正文相应词语之后。
