lexical_decisions:
- source_word: לֹא
  choice: 不可
  rationale: לֹא用于绝对禁令。现代汉语十诫体例中，“不可”简洁、庄重，并自然表达持续有效的禁止。
- source_word: תִּרְצָח
  choice: 谋杀
  rationale: רצח主要指未经正当许可、应受罪责的杀人，而不是涵盖一切导致死亡的行为。“谋杀”比宽泛的“杀人”更准确地传达该命令的法律与伦理力度。
theological_decisions:
- issue: 第六条诫命所禁止行为的范围
  choice: 译作“不可谋杀”，指禁止有罪责的非法杀人。
  alternative: 不可杀人。
  rationale: 原文采用רצח，而非泛指杀死的更宽泛动词；因此“谋杀”更贴近词义，也保留《摩西五经》对不同致死行为所作的区分。这是词义精确性的选择，并非加入宗派立场。
translation_notes:
  register: 采用简洁、庄重且现代的诫命语体。“不可”保留律法禁令的直接性；脚注说明传统译法，并避免把原词误解为对一切杀死行为的无差别称呼。
