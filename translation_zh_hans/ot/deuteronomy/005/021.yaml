  text: וְ/לֹ֥א תַחְמֹ֖ד אֵ֣שֶׁת רֵעֶ֑/ךָ וְ/לֹ֨א תִתְאַוֶּ֜ה בֵּ֣ית רֵעֶ֗/ךָ שָׂדֵ֜/הוּ וְ/עַבְדּ֤/וֹ וַ/אֲמָת/וֹ֙ שׁוֹר֣/וֹ וַ/חֲמֹר֔/וֹ וְ/כֹ֖ל אֲשֶׁ֥ר לְ/רֵעֶֽ/ךָס׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/021.yaml
  text: And you shall not covet your neighbor’s wife[a], and you shall not desire your neighbor’s house, his field, his male slave, his female slave, his ox, his donkey[b], or anything that belongs to your neighbor.
translation:
  language: zh_hans
  text: 不可贪图你邻人的妻子；也不可贪恋[a]你邻人的房屋[b]、他的田地、男奴、女奴、牛、驴，或任何属于你邻人的东西。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文这里使用的动词与前面的“贪图”不同，也可译作“渴想”。两个词意义相近；换用动词可能是为了加强或变化表达，不一定表示两种截然不同的欲望。
    reason: lexical_alternative
  - marker: b
    text: “房屋”也可指“家业”或整个家户；不过，后面接着列举各项所有物，因此正文采用“房屋”。
    reason: lexical_alternative
lexical_decisions:
- source_word: תַחְמֹד
  choice: 贪图
  rationale: “贪图”表达对属于他人之物的不当欲求，既保留诫命的伦理力度，也与下文另一动词的译法有所区别。
- source_word: אֵשֶׁת רֵעֶךָ
  choice: 你邻人的妻子
  rationale: 准确表达希伯来语的领属结构；“邻人”在现代汉语中自然，也可涵盖人际伦理语境中的同伴。
- source_word: תִתְאַוֶּה
  choice: 贪恋
  rationale: 该词与前面的 חמד 意义相近但并不相同。“贪恋”保留不当欲求的含义，同时显出原文更换动词的修辞特点。
- source_word: בֵּית רֵעֶךָ
  choice: 你邻人的房屋
  rationale: בַּיִת 可指具体房屋，也可泛指家业；此处后接各项财产，正文采用具体而自然的“房屋”，并以脚注保留较广含义。
- source_word: שָׂדֵהוּ
  choice: 他的田地
  rationale: שָׂדֶה 在此最自然地指田地；申命记版本特有的这一项应明确译出。
- source_word: עַבְדּוֹ וַאֲמָתוֹ
  choice: 男奴、女奴
  rationale: 财产清单的语境凸显其受奴役身份；采用直白的现代称谓，并保留原文的性别区分。
- source_word: שׁוֹרוֹ וַחֲמֹרוֹ
  choice: 牛、驴
  rationale: 分别准确表达 שׁוֹר 和 חֲמוֹר；在汉语列举中无需重复领属代词。
- source_word: וְכֹל אֲשֶׁר לְרֵעֶךָ
  choice: 或任何属于你邻人的东西
  rationale: 自然表达原文概括性的领属结构，强调禁令涵盖邻人的一切所有物。
theological_decisions:
- issue: 是否区分本节两个表示欲求的动词
  choice: 将 חמד 译为“贪图”，将 אוה 译为“贪恋”
  alternative: 两者都译为“贪图”或都译为“想要”
  rationale: 原文有意使用两个意义重叠却不同的动词。分别翻译既保留修辞结构，也不武断扩大两者的语义差异。
- issue: 奴役身份用语
  choice: 译为“男奴、女奴”
  alternative: 译为“男仆、女仆”或“仆人、婢女”
  rationale: 本节把这些人列在家产项目中，受奴役的法律与社会身份十分突出；直译可避免用较温和的仆役称谓淡化原文现实。
translation_notes:
  register: 采用现代、庄重而易懂的诫命语体。“不可……也不可……”对应原文两个并列禁令；分号帮助读者看出结构。用“邻人”避免把 רֵעַ 限缩为住在附近的人。
