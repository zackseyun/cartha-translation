  text: Go[a], say to them, ‘Return to your tents.’
translation:
  language: zh_hans
  text: 你去告诉他们：‘你们回自己的帐棚去吧。’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֵךְ
  choice: 你去
  rationale: 这是הלך的单数祈使式，直接命令摩西前去传话；“你去”在现代汉语中自然明确。
- source_word: אֱמֹר לָהֶם
  choice: 告诉他们
  rationale: אמר的祈使式与间接宾语“他们”连用，汉语合译为“告诉他们”比逐字译作“对他们说”更流畅，同时保留直接传话的功能。
- source_word: שׁוּבוּ
  choice: 回……去吧
  rationale: 这是שוב的复数祈使式，此处指百姓回到先前居住之处；“回……去吧”准确表达返回的方向，并符合自然口语。
- source_word: לָכֶם לְאָהֳלֵיכֶם
  choice: 自己的帐棚
  rationale: לָכֶם带有回到各自所属之处的意味；用“自己的”自然体现这一归属关系。“帐棚”保留原文具体的旷野生活背景。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留直接命令和引语形式；“帐棚”较“家”更贴近希伯来原文及历史场景。本节无需脚注；英文脚注所列“Go back to your tents”可能把“回去”误连到第一个命令，而希伯来文的返回动作明确由שׁוּבוּ表达。
