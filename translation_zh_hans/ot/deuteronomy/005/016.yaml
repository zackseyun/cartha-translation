base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/016.yaml
  text: Honor your father and your mother[a], as Yahweh your God commanded you[b], so that your days may be long and so that it may go well for you on the land that Yahweh your God is giving you.
translation:
  language: zh_hans
  text: “要孝敬你的父亲和母亲，正如雅威[a]你的上帝所吩咐你的，使你的日子得以长久，并使你在雅威你的上帝赐给你的土地上过得好。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威”是希伯来文上帝名字 יהוה（YHWH）的音译。
    reason: 说明神名的译法
lexical_decisions:
- source_word: כַּבֵּד
  choice: 孝敬
  rationale: 该词的加强词干命令式在亲子关系中表示尊重、看重并以相称的行动对待父母。“孝敬”是现代汉语中准确而自然的表达，也保留了诫命的伦理分量。
- source_word: אָבִיךָ ... אִמֶּךָ
  choice: 你的父亲和母亲
  rationale: 原文在“父亲”和“母亲”前分别使用直接宾语标记，形成对称强调；译文完整重复关系结构，以同等突出双亲。
- source_word: כַּאֲשֶׁר צִוְּךָ
  choice: 正如……所吩咐你的
  rationale: 保留比较关联和既有命令的背景；“正如”清楚表达这条诫命与上帝先前吩咐之间的联系。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，而不以“主”这一称号替代，保留原文所用的专名。
- source_word: אֱלֹהֶיךָ
  choice: 你的上帝
  rationale: 准确保留第二人称单数所属关系及申命记语境中的圣约关系。
- source_word: לְמַעַן
  choice: 好使
  rationale: 自然表达原文的目的兼结果意味，并在两个并列结果之前统摄全句。
- source_word: יַאֲרִיכֻן יָמֶיךָ
  choice: 日子长久
  rationale: 紧贴“你的日子得以延长”的希伯来表达，避免直接改写成只关乎个体寿命的解释。
- source_word: וּלְמַעַן יִיטַב לָךְ
  choice: 并且过得好
  rationale: 自然传达 יטב ל 的福祉、境况良好之意，不将其过度收窄为物质兴盛。
- source_word: עַל הָאֲדָמָה
  choice: 在……土地上
  rationale: 此处 אֲדָמָה 指上帝赐予以色列的土地；汉语以“在……土地上”自然表达其地域含义。
- source_word: נֹתֵן לָךְ
  choice: 赐给你的
  rationale: 汉语关系分句无需机械标出进行体；“赐给”既体现上帝是土地的给予者，也保留分词所表达之确定、持续的赠予。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。采用“雅威”音译，可保留其专名性质，而不以称号替换。
- issue: 孝敬父母所附应许的性质
  choice: 保留“日子长久、过得好、在所赐土地上”的原文表述
  alternative: 将其明确解释为每个个体必然长寿；或仅解释为民族整体的象征性应许
  rationale: 经文本身把真实的圣约应许与顺服相连，却没有在本节中把应许限定为绝对的个人保证，也没有排除个人层面的含义；译文保留这一张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“孝敬”符合汉语诫命语境；“日子长久”和“过得好”兼顾原文形式与自然表达。句法将地点短语置于两个结果之前，使其自然统摄“日子长久”和“过得好”。
