  text: וְ/עַתָּה֙ לָ֣/מָּה נָמ֔וּת כִּ֣י תֹֽאכְלֵ֔/נוּ הָ/אֵ֥שׁ הַ/גְּדֹלָ֖ה הַ/זֹּ֑את אִם יֹסְפִ֣ים אֲנַ֗חְנוּ לִ֠/שְׁמֹעַ אֶת ק֨וֹל יְהוָ֧ה אֱלֹהֵ֛י/נוּ ע֖וֹד וָ/מָֽתְנוּ־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/025.yaml
  text: And now[a], why should we die? For this great fire will consume us. If we continue to hear the voice of Yahweh our God any longer, we will die.
translation:
  language: zh_hans
  text: 现在，我们为什么要死呢？这大火会吞噬我们。要是我们还继续听我们上帝雅威[a]的声音，我们就会死。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威”是希伯来语四字神名的常用音译；YHWH是其拉丁字母转写。传统上也常译作“耶和华”。
    reason: 说明神名的原文形式及常见替代译法。
lexical_decisions:
- source_word: וְעַתָּה
  choice: 现在
  rationale: 既保留连接上文并引出当下结论的语篇作用，也符合现代汉语表达。
- source_word: לָמָּה נָמוּת
  choice: 我们为什么要死呢
  rationale: 保留反问语气，以及未完成式所表达的对死亡前景的恐惧，不把它僵化为单纯的将来陈述。
- source_word: כִּי תֹאכְלֵנוּ
  choice: 这大火会吞噬我们
  rationale: אכל本义为“吃”，以火为主语时译作“吞噬”自然，并保留原文鲜明的毁灭意象。
- source_word: הָאֵשׁ הַגְּדֹלָה הַזֹּאת
  choice: 这大火
  rationale: 简洁呈现名词、形容词和指示词的组合，不额外添加原文没有的修饰。
- source_word: אִם יֹסְפִים אֲנַחְנוּ לִשְׁמֹעַ ... עוֹד
  choice: 要是我们还继续听……
  rationale: יסף加不定式表示继续做某事，עוֹד进一步强化持续之意；“还继续”保留两者共同形成的语气。
- source_word: קוֹל
  choice: 声音
  rationale: 此处指上帝发言时可听见的声音；“声音”比宽泛的“声响”更贴合语境。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按专名处理四字神名，避免用称号取代原文中的名字。
- source_word: אֱלֹהֵינוּ
  choice: 我们的上帝
  rationale: 直接保留第一人称复数所属关系，体现以色列人与上帝的关系。
- source_word: וָמָתְנוּ
  choice: 我们就会死
  rationale: 作为条件句的结果，译为自然明确的现代汉语，同时保留原文所说的必然后果。
theological_decisions:
- issue: 四字神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用上帝的专名；正文采用较贴近通常学术重构读音的“雅威”，脚注注明华语传统中常见的另一译名，不以“主”等称号代替。
- issue: 百姓所说死亡结果的语气
  choice: 保留为他们因继续听见神的声音而预期的死亡
  alternative: 解释为上帝明确宣告他们必死
  rationale: 本节是百姓因西奈显现而发出的恐惧之言；译文不把其主观惧怕提升为额外的神学断言。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“吞噬”保留火焰毁灭人的形象；“要是”自然传达百姓当下惊惧的口吻，而整体措辞仍适合经文朗读。
