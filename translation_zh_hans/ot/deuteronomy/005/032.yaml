base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/032.yaml
  text: So be careful to do just as Yahweh your God has commanded you[a]; do not turn aside to the right or to the left.
translation:
  language: zh_hans
  text: 所以，你们要谨慎，照雅威——你们的上帝——所吩咐的去做；不可偏向右边或左边。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “不可偏向右边或左边”是一个比喻，意思是无论朝哪个方向，都不可偏离上帝的吩咐。
    reason: cultural_note
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: 你们要谨慎
  rationale: שׁמר与表示目的的不定式连用，在这里指留心谨守、落实于行动，而不只是“看守”。“要谨慎”保留了劝诫语气，也符合现代汉语表达。
- source_word: לַעֲשׂוֹת
  choice: 去做
  rationale: עשה在盟约训令语境中指实行所吩咐的事。“去做”保留原文简洁、直接的行动含义。
- source_word: כַּאֲשֶׁר
  choice: 照着
  rationale: 该词表示行动须与上帝的吩咐相符；“照着”自然地表达这种遵照关系，而不过度强化原文。
- source_word: צִוָּה
  choice: 吩咐
  rationale: צוה指权威性的命令。对上帝向百姓颁布命令而言，“吩咐”庄重自然，并保留约束力。
- source_word: יְהוָה
  choice: 雅威
  rationale: 原文直接使用四字神名；采用“雅威”音译，以区别于“主”等称号，并保留其作为以色列之上帝专名的性质。
- source_word: אֱלֹהֵיכֶם
  choice: 你们的上帝
  rationale: 准确表达带第二人称复数后缀的属格及盟约关系，也清楚保留“你们”为复数。
- source_word: לֹא תָסֻרוּ
  choice: 不可偏向
  rationale: סור在此比喻偏离受命遵行的道路。“偏向”既保留路径意象，也符合汉语训诫文体。
- source_word: יָמִין וּשְׂמֹאל
  choice: 向右，也……向左
  rationale: 保留原文左右两个方向的具体意象；与“不可偏向”合用，可表达任何方向都不得偏离。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文使用上帝的专名而非称号。“雅威”较直接地音译该神名，避免用“主”取代；“耶和华”虽为传统形式，但反映的是较晚期的混合读法。
- issue: “不可偏向左右”的含义
  choice: 保留方向性比喻，并以脚注说明
  alternative: 正文直接意译为“丝毫不可偏离”
  rationale: 原文使用道路方向的具体意象。正文保留这一形象，避免把比喻完全消解；脚注则说明其在语境中的训诫含义。
translation_notes:
  register: 采用现代、庄重而易懂的训诫语体。“所以”承接上文；分号呈现谨慎遵行与不可偏离之间的紧密关系。保留“向右、向左”的希伯来语路径意象，并将脚注标记置于该短语之后。
