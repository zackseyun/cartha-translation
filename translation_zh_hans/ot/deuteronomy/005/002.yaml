  text: יְהוָ֣ה אֱלֹהֵ֗י/נוּ כָּרַ֥ת עִמָּ֛/נוּ בְּרִ֖ית בְּ/חֹרֵֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/002.yaml
  text: Yahweh our God made a covenant with us at Horeb[a].
translation:
  language: zh_hans
  text: 雅威我们的上帝在何烈与我们立了约。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“在何烈与我们割了约。”
    reason: 保留希伯来语כרת ברית（“割约”）的字面表达。
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 以“雅威”音译四字神名，保留其作为以色列之上帝专名的性质，不以称号替代。
- source_word: אֱלֹהֵינוּ
  choice: 我们的上帝
  rationale: 该词由“上帝”与第一人称复数后缀构成，直译为“我们的上帝”，保留盟约关系的表达。
- source_word: כָּרַת
  choice: 立了
  rationale: כרת与“约”连用时构成“立约”的固定表达；现代汉语用“立了约”自然、准确，正文无需机械译为“割”。
- source_word: עִמָּנוּ
  choice: 与我们
  rationale: 直接表达介词及第一人称复数后缀所表示的共同参与关系。
- source_word: בְּרִית
  choice: 约
  rationale: “约”是中文圣经语境中对בְּרִית简洁而庄重的常用译法，保留其正式、具约束力的关系含义。
- source_word: בְּחֹרֵב
  choice: 在何烈
  rationale: 将地名חֹרֵב音译为“何烈”；介词ב在这里表地点，译为“在”自然明确。
theological_decisions:
- issue: 四字神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用上帝的专名。译作“雅威”既保留专名，也避免以“主”这一称号取代；“耶和华”则属于传统但较晚形成的混合读音。
- issue: כרת ברית的盟约表达
  choice: 立了约
  alternative: 割了约；订立了盟约
  rationale: “立约”准确传达希伯来语习语的实际意义，同时脚注保留其字面意象，不额外限定该约的神学类别。
translation_notes:
  register: 采用现代、庄重且易懂的标准普通话。“雅威我们的上帝”紧随原文语序；“立了约”符合自然汉语和传统盟约表达。
