  text: כִּ֣י מִ֣י כָל בָּשָׂ֡ר אֲשֶׁ֣ר שָׁמַ֣ע קוֹל֩ אֱלֹהִ֨ים חַיִּ֜ים מְדַבֵּ֧ר מִ/תּוֹךְ הָ/אֵ֛שׁ כָּמֹ֖/נוּ וַ/יֶּֽחִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/026.yaml
  text: For who of all flesh has heard the voice of the living God speaking from the midst of the fire[a], as we have, and lived?
translation:
  language: zh_hans
  text: 因为凡有血肉的人中，有谁像我们一样，听见永活的上帝从火中说话的声音，还能活着呢？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，为百姓的惧怕和请求说明缘由；现代汉语用“因为”自然地表达这一论证关系。
- source_word: מִי כָל בָּשָׂר
  choice: 凡有血肉的人中，有谁
  rationale: 以反问表达“所有血肉之躯中谁能如此”；保留“血肉”这一希伯来语意象，同时用“……中，有谁”使汉语句法自然。
- source_word: שָׁמַע קוֹל
  choice: 听见……的声音
  rationale: קוֹל 在说话的语境中指“声音”；שָׁמַע 在此叙述已经发生的听见经历。
- source_word: אֱלֹהִים חַיִּים
  choice: 永活上帝
  rationale: 虽然希伯来语形式上带复数形态，此处按固定用法和上下文指以色列独一的上帝；“永活”既表达上帝是活的，也符合现代汉语宗教语体。
- source_word: מְדַבֵּר מִתּוֹךְ הָאֵשׁ
  choice: 从火中说话
  rationale: 准确表达声音来自火焰内部；汉语“从火中”已自然包含“从……当中”的空间含义。
- source_word: כָּמֹנוּ
  choice: 像我们一样
  rationale: 比较对象是以色列人亲身听见上帝声音的经历。
- source_word: וַיֶּחִי
  choice: 还能活着
  rationale: 保留 חיה“活着”的基本含义；“还能”自然传达经历如此可畏的显现之后仍然存活的惊异，而不直接改译为较具解释性的“幸存”。
theological_decisions:
- issue: כָל בָּשָׂר 的人论意象
  choice: 凡有血肉的人中
  alternative: 任何人；全人类
  rationale: 保留“血肉”意象，以呈现人在永活上帝面前必死、受造的处境；脚注说明其惯用含义，避免读者误解为单指肉体。
- issue: אֱלֹהִים חַיִּים 的数与所指
  choice: 永活上帝
  alternative: 活着的众神
  rationale: 尽管词形带有复数特征，此固定表达在本段明确指以色列的独一上帝；译作复数会误传上下文。
- issue: וַיֶּחִי 所表达的存活意味
  choice: 还能活着
  alternative: 仍然存活；幸存下来
  rationale: 采用接近原文字面的表达，同时借“还能”显出百姓认为人听见上帝亲自说话本应面临死亡的敬畏；不把这种语境意义过度解释为特定教义命题。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“凡有血肉的人中，有谁”保留希伯来语的源语质感；整句用反问语气，重现百姓在烈火中听见上帝声音后所表达的惊惧与惊叹。
