revisions:
- from: 因为，凡有血肉的人中[a]，有谁像我们一样，听见永活上帝的声音从火中说话，还能活着呢？
  to: 因为凡有血肉的人中，有谁像我们一样，听见永活的上帝从火中说话的声音，还能活着呢？
  rationale: 修订仅消除汉语中“从火中说话”的句法歧义，并使“永活的上帝”和标点更合现代汉语。保留原文的反问语气、“血肉”习语、火中发声的空间意象，以及“还能活着”所表达的存活惊异。
  reviewer_model: gpt-5.6-terra
