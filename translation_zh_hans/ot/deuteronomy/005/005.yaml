base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/005.yaml
  text: I was standing between Yahweh and you at that time[a], to declare to you the word of Yahweh, because you were afraid because of the fire and did not go up the mountain, saying,
translation:
  language: zh_hans
  text: 那时，我站在雅威和你们之间，向你们传达雅威的话，因为你们惧怕那火，没有上山。如下：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָ֠נֹכִי עֹמֵד
  choice: 我站在
  rationale: 独立代词突出摩西本人；分词置于过去事件的叙述中，描述他当时所处的中介位置。汉语用“那时，我站在”自然表达，不必勉强加入进行体。
- source_word: בֵּין יְהוָה וּבֵינֵיכֶם
  choice: 在雅威和你们中间
  rationale: 保留两方之间的空间及中介含义；神名 יְהוָה 音译为“雅威”。
- source_word: בָּעֵת הַהִוא
  choice: 那时
  rationale: 简洁、自然地指向何烈山事件发生之时。
- source_word: לְהַגִּיד לָכֶם אֶת דְּבַר יְהוָה
  choice: 把雅威的话传达给你们
  rationale: נגד 的使役式在此表示转告或传达；“传达”清楚体现摩西的中介职责，“雅威的话”保留 דְּבַר יְהוָה 的惯用表达。
- source_word: כִּי יְרֵאתֶם מִפְּנֵי הָאֵשׁ
  choice: 因为你们因那火而害怕
  rationale: כִּי 表原因；מִפְּנֵי 在此是因火而惧怕的惯用表达。两个因果成分在现代汉语中虽略有重复，却准确保留“因为……因……”的逻辑关系。
- source_word: וְלֹא עֲלִיתֶם בָּהָר
  choice: 没有上山
  rationale: 自然表达 עלה בָּהָר 的登山方向含义。
- source_word: לֵאמֹר
  choice: 雅威说：
  rationale: 该词引出下一节的神圣讲话。汉语若直译成悬空的“说：”，主语不清；依据紧接着的引语内容补明“雅威”，使跨节衔接自然，但不改变发言者。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。音译“雅威”较贴近学界通常重构的读音，也保留其作为专名的性质。
- issue: 摩西在雅威与百姓之间的位置
  choice: 站在雅威和你们中间
  alternative: 作雅威和你们之间的中保
  rationale: 原文陈述“站在……中间”，在语境中具有中介作用，但没有使用“中保”这一名词；保留具体措辞，避免增加制度性或教义性含义。
- issue: לֵאמֹר 的发言者
  choice: 雅威说：
  alternative: 说：；以下是雅威的话：
  rationale: 该形式本身只标示下文引语，语法连接可能让读者感到张力；下一节显然是雅威的话。正文补明发言者以符合汉语习惯，同时不把它解释为摩西自己的话。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留摩西“站在……中间”的具体形象与中介意味；不以神学术语过度解释。为避免本节末尾“说：”在中文中主语悬空，按下文引语明确为“雅威说：”。
