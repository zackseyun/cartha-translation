base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/003.yaml
  text: It was not with our fathers that Yahweh made this covenant[a], but with us—with us[c][b] who are all here alive today.
translation:
  language: zh_hans
  text: 雅威所立的这约[b]，不是与我们的父辈[a]立的，而是与我们——就是今天在这里、全都活着的我们[c]——立的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“我们的祖先”。希伯来文直译为“我们的父亲们”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译为“切这约”；这是表示“立约”的惯用说法。
    reason: lexical_alternative
  - marker: c
    text: 有些人把这里的对比理解为修辞性的：不是只与我们的父辈立约，而是特别与今天在这里活着的我们立约。
    reason: alternative_reading
lexical_decisions:
- source_word: כָּרַת ... אֶת הַבְּרִית הַזֹּאת
  choice: 立了这约
  rationale: 希伯来语“切约”是表示“立约”的惯用语；译作“立了这约”符合现代汉语表达，同时保留指示词“这”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 采用上帝名字四字神名的常见现代汉语音译，不以“主”这一称号代替专名。
- source_word: אֲבֹתֵינוּ
  choice: 我们的父辈
  rationale: 原文直指“我们的父亲们／父辈”；“父辈”在现代汉语中自然，并保留原词的男性形式及世代含义。
- source_word: כִּי
  choice: 而是
  rationale: 此处承接否定句，引出鲜明对比；“而是”准确传达其转折作用。
- source_word: אִתָּנוּ אֲנַחְנוּ אֵלֶּה
  choice: 与我们立的——与……的我们立的
  rationale: 原文在“与我们”之后以“我们这些人”作强调性同位说明。汉语用破折号和重复“与……我们立的”再现强调，而不把它简化掉。
- source_word: פֹה הַיּוֹם כֻּלָּנוּ חַיִּים
  choice: 今天在这里、全都活着的我们
  rationale: 逐项保留“这里”“今天”“我们全都”和“活着”，并按自然汉语语序组合，突出眼前仍然活着的全体听众。
theological_decisions:
- issue: 本节是否绝对否认先辈与这约有关系，还是用修辞强调这约对当代人的现实效力
  choice: 正文保留原文“不是……而是……”的直接对比，不加入“只是”“单单”等限制语。
  alternative: 有些解释把这句话理解为“不是只与我们的父辈”，即并非排除父辈，而是特别强调今日在场的一代。
  rationale: 希伯来文本身没有“只”或其他限制词。直译其对比并以脚注说明另一种理解，既不消解经文的神学张力，也不预先替读者裁定。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“父辈”比生硬的“父亲们”更符合代际语境；破折号和句式重复保留原文的强调性同位结构。神名译作“雅威”，正文不添加原文没有的解释性限定词。
