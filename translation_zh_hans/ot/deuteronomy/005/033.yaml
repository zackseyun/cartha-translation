source:
  edition: WLC
  text: בְּ/כָל הַ/דֶּ֗רֶךְ אֲשֶׁ֨ר צִוָּ֜ה יְהוָ֧ה אֱלֹהֵי/כֶ֛ם אֶתְ/כֶ֖ם תֵּלֵ֑כוּ לְמַ֤עַן תִּֽחְיוּ/ן֙ וְ/ט֣וֹב לָ/כֶ֔ם וְ/הַאֲרַכְתֶּ֣ם יָמִ֔ים בָּ/אָ֖רֶץ אֲשֶׁ֥ר תִּֽירָשֽׁוּ/ן־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/033.yaml
  text: You shall walk in all the way that Yahweh your God has commanded you[a], so that you may live, and that it may go well with you, and that you may prolong your days in the land that you will possess.
translation:
  language: zh_hans
  text: 你们要行在雅威你们的上帝所吩咐你们走的整条道路上，使你们得以存活，事事顺利，并在你们将要占有[a]的土地上长久度日。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“承受”。希伯来语动词兼有占有土地和承受产业的含义。
    reason: 保留 ירשׁ 在此处“占有”与“承受”之间的词义幅度。
lexical_decisions:
- source_word: בְּכָל הַדֶּרֶךְ
  choice: 始终行在……道路上
  rationale: 保留希伯来文单数“道路”的伦理与盟约隐喻；用“始终”表达 בְּכָל 所强调的全程、完全遵循，避免生硬地译成“一切道路”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语中对四字神名的常见音译呈现其专名性质，不用称号替代。
- source_word: אֱלֹהֵיכֶם
  choice: 你们的上帝
  rationale: 自然表达复数第二人称所属关系，并保留盟约用语“雅威你们的上帝”。
- source_word: צִוָּה
  choice: 所吩咐的
  rationale: 表达已经颁布且持续有效的命令；“吩咐”符合本节庄重的劝诫语体。
- source_word: תֵּלֵכוּ
  choice: 要……行在
  rationale: 保留“行走”作为生活行为和顺服的隐喻，同时符合现代汉语圣经语体。
- source_word: לְמַעַן
  choice: 使
  rationale: 清楚引出随后存活、蒙福和长久度日的目的或结果，不强行限定二者关系。
- source_word: תִּחְיוּן
  choice: 可以存活
  rationale: 直接表达“活着、存留生命”的意义，也适合申命记盟约祝福的语境。
- source_word: וְטוֹב לָכֶם
  choice: 得享福祉
  rationale: 自然概括“对你们有好处／你们境况良好”的含义，兼顾福乐与顺遂，不局限为物质繁荣。
- source_word: וְהַאֲרַכְתֶּם יָמִים
  choice: 长久度日
  rationale: 保留“日子延长”的希伯来语意象，同时比直译“延长日子”更符合现代汉语。
- source_word: בָּאָרֶץ
  choice: 在……土地上
  rationale: “土地”准确体现此处具体的应许之地；“在……上”符合汉语搭配。
- source_word: תִּירָשׁוּן
  choice: 将要占有
  rationale: 此动词在本语境中指以色列将取得并居有那地；“占有”保留具体领土含义，同时以脚注说明“承受”为可能译法。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；音译“雅威”保留其作为盟约专名的性质，而非以“主”等称号代替。
- issue: ירשׁ 的土地语义
  choice: 将要占有的土地
  alternative: 将要承受的土地
  rationale: “占有”突出以色列取得并居住该地的具体意义；同时承认该词也可带有承受产业的含义，故以脚注保留歧义。
- issue: 顺服与生命、福祉、长寿之间的关系
  choice: 以“使”保留目的或结果关系
  alternative: 译成明确的条件句“若……就……”
  rationale: 原文以 לְמַעַן 引出目的或结果，并未明说条件句；译文不额外系统化其神学关系。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“行在……道路上”保留原文核心隐喻；“得享福祉”和“长久度日”使并列祝福自然流畅。脚注标记紧接“占有”，与所说明的词准确对应。
