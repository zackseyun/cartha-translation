  source_fidelity: 核心列举、禁工命令、雅威之名、奴役身份及目的从句均忠实于希伯来文。惟“归雅威你神的”在汉语中缺少必要的结构连接，容易读得滞涩；改为“归于雅威——你的神的”可清楚体现ל的归属／奉献意义，并保留“你的神”的同位说明。
  naturalness: 原译以长破折号和列举后复述谓语来帮助理解，整体可懂。修订用冒号引出列举，并以“都不可做任何工”统摄各项，较符合现代庄重汉语。将“住在你城内”改为“住在你城镇中的”更自然；脚注仍说明“城门”是社区辖区的习语。
  terminology: “安息日”“雅威”“男奴／女奴”“牛／驴／牲畜”“寄居者”均可保留。“寄居者”配合脚注准确表达גֵּר的定居外来者身份，不把它限缩为短暂旅行者。
