  to: 但第七日是归于雅威——你的神的安息日。你不可做任何工：你、你的儿子、女儿、男奴、女奴、牛、驴、所有牲畜，以及住在你城镇中的寄居者[a][b]，都不可做任何工；好让你的男奴和女奴也像你一样安息。
