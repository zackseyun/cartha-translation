  text: וְ/י֨וֹם֙ הַ/שְּׁבִיעִ֔י שַׁבָּ֖ת לַ/יהוָ֣ה אֱלֹהֶ֑י/ךָ לֹ֣א תַעֲשֶׂ֣ה כָל מְלָאכָ֡ה אַתָּ֣ה וּ/בִנְ/ךָֽ וּ/בִתֶּ֣/ךָ וְ/עַבְדְּ/ךָֽ וַ֠/אֲמָתֶ/ךָ וְ/שׁוֹרְ/ךָ֨ וַ/חֲמֹֽרְ/ךָ֜ וְ/כָל בְּהֶמְתֶּ֗/ךָ וְ/גֵֽרְ/ךָ֙ אֲשֶׁ֣ר בִּ/שְׁעָרֶ֔י/ךָ לְמַ֗עַן יָנ֛וּחַ עַבְדְּ/ךָ֥ וַ/אֲמָתְ/ךָ֖ כָּמֽוֹ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/014.yaml
  text: But the seventh day is a Sabbath to Yahweh your God[a]. You shall not do any work—you, or your son, or your daughter, or your male slave, or your female slave, or your ox, or your donkey, or any of your livestock[b], or the sojourner who is within your gates—so that your male slave and your female slave may rest as you do.
translation:
  language: zh_hans
  text: 但第七日是归于雅威——你的神的安息日。你不可做任何工：你、你的儿子、女儿、男奴、女奴、牛、驴、所有牲畜，以及住在你城镇中的寄居者[a][b]，都不可做任何工；好让你的男奴和女奴也像你一样安息。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “寄居者”指住在以色列人群体中的非本地居民，也可译作“外来居民”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“在你的城门之内”，是指住在你的城镇或共同体管辖范围内。
    reason: cultural_note
lexical_decisions:
- source_word: שַׁבָּת
  choice: 安息日
  rationale: 这是特指立约制度中的神圣日子，而非泛指一次休息；“安息日”是准确且通行的现代汉语译法。
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: 归雅威你神的
  rationale: ל 表示归属或奉献；“归……的”自然表达这一天属于并献给雅威，同时保留神名 יהוה。
- source_word: מְלָאכָה
  choice: 工
  rationale: 在安息日律法中泛指所禁止的工作；“做任何工”简洁庄重，且不擅自限定具体劳动类型。
- source_word: עַבְדְּךָ / אֲמָתֶךָ
  choice: 你的男奴／女奴
  rationale: 原文分别指男性和女性的受奴役家庭成员；译作“男奴／女奴”保留其身份及性别区别，避免以较弱的“仆人”淡化当时的社会现实。
- source_word: שׁוֹר / חֲמוֹר / בְּהֵמָה
  choice: 牛／驴／牲畜
  rationale: 依次保留原文列举的役用牛、驴及其他家畜；现代汉语自然明确。
- source_word: גֵּר
  choice: 寄居者
  rationale: 指居住在以色列群体中的非本地居民，不只是短暂停留的旅客；“寄居者”保留其法律和群体身份，并以脚注说明。
- source_word: בִּשְׁעָרֶיךָ
  choice: 在你城内
  rationale: “在你城门以内”是指处于城镇或地方共同体管辖范围；正文采用自然汉语表达，脚注保留该习语的字面背景。
- source_word: לְמַעַן יָנוּחַ
  choice: 好让……休息
  rationale: 清楚表达目的关系，并保留经文强调奴隶也应获得休息的重点。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华／上主
  rationale: 原文直接使用四字神名；“雅威”较直接地呈现其专名性质，不以称号替代。
- issue: עבד／אמה 所指身份
  choice: 男奴／女奴
  alternative: 男仆／女仆
  rationale: 本节把他们列为受家主支配、必须获准休息的家庭成员，奴役身份在律法语境中具有实质意义；因此不以可能弱化身份的“仆”替代。
- issue: 安息日休息的范围与目的
  choice: 重复“都不可做工”，并译出“也像你一样休息”
  alternative: 仅按原文一次出现“不可做任何工”，以长串并列成分统摄
  rationale: 汉语中在长列举后复述谓语可避免误读，并没有增加新的禁令；“像你一样”保留 כָּמוֹךָ 所表达的同等休息，不把其伦理含义进一步系统化。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。保留逐项列举及单数第二人称的律法语气；为使长句在汉语中清晰，在列举后复述“都不可做工”。脚注标记均放在其实际解释的词语之后。
