base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/020.yaml
  text: You shall not bear false witness against your neighbor[a].
translation:
  language: zh_hans
  text: 不可作假见证指控你的邻舍[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不可用虚假的证词指控你的邻舍。”
    reason: 词汇与句法上的替代译法：עֵד שָׁוְא既可按固定表达译为“假见证”，也可理解为“虚假的证词”。
lexical_decisions:
- source_word: לֹא
  choice: 不可
  rationale: 这是禁令中的否定词；用“不可”自然、直接地表达诫命的禁止语气。
- source_word: תַעֲנֶה
  choice: 作……见证
  rationale: ענה本可指“回答”，但与עֵד连用时属于司法语境，表示出庭作证或提供证言；“作……见证”既贴近原文结构，也符合现代汉语法律表达。
- source_word: בְרֵעֲךָ
  choice: 指控你的邻舍
  rationale: רֵעַ指身边的同伴、邻人或同胞；介词בְ在此司法语境中表示证言所针对的对象。“指控你的邻舍”自然传达“作不利于某人的证言”，又不额外加入“陷害”等结果含义。
- source_word: עֵד
  choice: 见证
  rationale: 该词可指“证人”或“证言”，在此与动词构成作证的法律用语；译作“见证”保留原文简洁的名词结构。
- source_word: שָׁוְא
  choice: 假
  rationale: שָׁוְא可表示虚假、虚空或欺骗；在法庭作证的语境中，“假”准确而简洁地表达虚假性质。
theological_decisions: []
