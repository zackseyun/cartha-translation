base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/023.yaml
  text: And when you heard the voice from the midst of the darkness[a], while the mountain was burning with fire, you came near to me—all the heads of your tribes and your elders—
translation:
  language: zh_hans
  text: 你们听见从黑暗中传来的声音[a]，那山正燃着火；于是，你们各支派的众首领和长老都来到我这里——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “声音”也可译作“响声”。希伯来语qol可表示二者；这里的上下文是上帝从黑暗中说话，所以正文译作“声音”。
    reason: 词义有两种可能，脚注保留原文的词汇歧义并说明正文选择。
lexical_decisions:
- source_word: וַיְהִי כְּשָׁמְעֲכֶם
  choice: 你们听见……于是
  rationale: 希伯来语以叙事连接词配合时间结构引出后续事件；现代汉语用前置时间分句和“于是”自然表达先后关系，无须生硬译出“事情是这样”。
- source_word: הַקּוֹל
  choice: 声音
  rationale: קוֹל既可指人的声音，也可泛指响声。本段语境是上帝说话，译作“声音”既符合语境，也保留一定词义宽度。
- source_word: מִתּוֹךְ הַחֹשֶׁךְ
  choice: 从黑暗中传来的
  rationale: מִתּוֹךְ表示“从……当中”；“从黑暗中传来的”在现代汉语中自然地表达声音的来源，并保留黑暗包围声音的意象。
- source_word: וְהָהָר בֹּעֵר בָּאֵשׁ
  choice: 当时山正被火焚烧
  rationale: 前缀ו在此引出伴随情景，分词בֹּעֵר表示持续燃烧；“当时……正……”清楚呈现与听见声音同时发生的背景。
- source_word: וַתִּקְרְבוּן אֵלַי
  choice: 于是……来到我这里
  rationale: קרב表示靠近、走近；“来到我这里”是自然庄重的现代汉语，并准确表达朝向摩西的移动。
- source_word: כָּל רָאשֵׁי שִׁבְטֵיכֶם
  choice: 你们各支派所有的首领
  rationale: רָאשׁ在此是群体领袖的称谓；“首领”比直译“头”清楚，同时“各……所有的”保留כָּל的全称范围。
- source_word: וְזִקְנֵיכֶם
  choice: 和长老
  rationale: זָקֵן在此指获认可的群体长老，而不只是年长者；“长老”是准确且通行的称谓。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“于是”明确主句与时间分句的关系；句末破折号表明下一节接续首领和长老的话。
