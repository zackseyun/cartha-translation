  text: but showing steadfast love to thousands[a], to those who love me and keep my commandments.
translation:
  language: zh_hans
  text: 却向成千的人施慈爱，就是那些爱我、遵守他的诫命[a]的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本和译本作“我的诫命”，这与上下文中的第一人称话语相符；这里所据的希伯来文本作“他的诫命”。
    reason: textual_variant
lexical_decisions:
- source_word: וְעֹשֶׂה
  choice: 却……施
  rationale: 分词承接上节，与惩罚形成对照；“却”自然表达语境中的转折，“施”与“慈爱”搭配，并保留持续施行的意味。
- source_word: חֶסֶד
  choice: 慈爱
  rationale: 该词包含忠贞、信实与立约之爱的内涵；“慈爱”庄重自然，也不把词义缩减为一般的怜悯。
- source_word: לַאֲלָפִים
  choice: 直到千代
  rationale: 原文直译为“到千数／向千数”，未明说“代”；但上节已有“代”，此处自然承接该省略成分。译作“直到千代”既符合汉语，也保留与“三四代”的鲜明对比。
- source_word: לְאֹהֲבַי
  choice: 向爱我……的人
  rationale: 分词带第一人称后缀，译成关系结构“爱我的人”最符合现代汉语；与后面的“遵守”共同限定受慈爱的对象。
- source_word: וּלְשֹׁמְרֵי
  choice: 遵守
  rationale: שמר 与“诫命”连用时表示谨守、实行；“遵守”准确而通顺。
- source_word: מצות/ו
  choice: 他的诫命
  rationale: 所提供的希伯来文本带第三人称阳性单数后缀，按文本译为“他的”，不因周围的第一人称话语而暗中改作“我的”。
theological_decisions:
- issue: “诫命”所带代词的人称
  choice: 他的诫命
  alternative: 我的诫命
  rationale: 所提供的希伯来文本写作第三人称“他的”，尽管上下文中上帝以第一人称说话，而且部分文本传统和译本作“我的诫命”。正文依所给原文保留人称张力，另以脚注说明重要异文。
- issue: לַאֲלָפִים 中省略的计数对象
  choice: 直到千代
  alternative: 向千千的人／向成千上万的人
  rationale: 该词本身只表示“千数”，但紧接上节“三四代”的措辞，最自然的省略成分是“代”。译文补出“代”，没有将其扩展为原文未明说的“千代又千代”。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“施慈爱”保留经文语体和 חֶסֶד 的厚重含义；语序调整为“向……的人施慈爱，直到千代”，避免生硬直译。
