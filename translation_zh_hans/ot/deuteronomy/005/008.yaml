  text: לֹֽ֣א תַעֲשֶׂ֥ה לְ/ךָ֥ פֶ֨סֶל֙ כָּל תְּמוּנָ֔ה אֲשֶׁ֤ר בַּ/שָּׁמַ֨יִם֙ מִ/מַּ֔עַל וַ/אֲשֶׁ֥ר בָּ/אָ֖רֶץ מִ/תָּ֑חַת וַ/אֲשֶׁ֥ר בַּ/מַּ֖יִם מִ/תַּ֥חַת לָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/008.yaml
  text: You shall not make for yourself a carved image[a], or any likeness of what is in the heavens above, or on the earth beneath[b], or in the waters under the earth.
translation:
  language: zh_hans
  text: 不可为自己制作雕刻的像，或任何形像，就是天上、地上，以及地底下水中之物的形像。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雕刻的像”也可译作“偶像”。希伯来语此词指经雕刻或凿制而成的像，常用于偶像崇拜的语境。
    reason: lexical_alternative
  - marker: b
    text: “形像”也可译作“样式”或“形状”。
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶסֶל
  choice: 雕刻偶像
  rationale: 该词指经雕刻、凿制而成的形像，常用于敬拜语境。“雕刻偶像”在现代汉语中自然凝练，既保留制作方式，也反映其通常所指；脚注另列较具象的译法，避免遮蔽词义幅度。
- source_word: תְּמוּנָה
  choice: 形像
  rationale: 该词可指形状、样式或相似的表象。“形像”能涵盖对天、地、水中之物的视觉仿造，又保持庄重的经文语体。
- source_word: לֹא תַעֲשֶׂה לְךָ
  choice: 不可为自己……
  rationale: לֹא加未完成式在盟约律法中表达禁令，译作“不可”；“为自己”明确保留לְךָ，不把禁令缩减为抽象的制造行为。
- source_word: כָּל תְּמוּנָה
  choice: 任何形像
  rationale: 在否定禁令中，כָּל自然表达无一例外的范围，现代汉语以“任何”最为清楚。
- source_word: אֲשֶׁר בַּשָּׁמַיִם מִמַּעַל
  choice: 天上
  rationale: “天上”自然包含希伯来语“在上方的诸天中”这一空间关系，避免中文中不必要的重复。
- source_word: בָּאָרֶץ מִתָּחַת
  choice: 地上
  rationale: “地上”是现代汉语表达地面世界的惯用说法，并与“天上”构成清楚对照。
- source_word: בַּמַּיִם מִתַּחַת לָאָרֶץ
  choice: 地底下水中的
  rationale: 此译法保留水位于地之下的古代宇宙图景，并清楚表明所仿造的是水中之物。
theological_decisions:
- issue: 造像禁令的范围
  choice: 按本节字面译为不可制作雕刻偶像或仿造任何形像，不加入“用来敬拜”等限定。
  alternative: 解释性地译成不可制造供敬拜的偶像。
  rationale: 本节陈述制作形像的禁令，下一节才明确提到跪拜和事奉。译文保留这一推进，不提前加入后文的限定。
- issue: פֶסֶל是否直接译作“偶像”
  choice: 正文采用“雕刻偶像”，同时以脚注保留“雕刻的像”这一较具象的可能译法。
  alternative: 只译作“雕刻的像”，完全不点明其偶像语境。
  rationale: 该词本身具有雕凿制品的具体意义，却在十诫语境中通常指宗教性偶像；正文与脚注共同保存这两层信息，而不将禁令改写为仅关乎敬拜行为。
translation_notes:
  register: 采用现代、庄重而易懂的律法语体。“不可”体现十诫禁令的正式语气；以“无论是……还是……”自然统摄天、地和地底下的水三个领域。正文避免古旧的“雕刻之像”等表达，也不加入本节未明说的敬拜目的。
