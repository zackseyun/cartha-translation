  yaml_path: translation/ot/deuteronomy/005/013.yaml
  text: Six days you shall labor and do all your work,[a]
translation:
  language: zh_hans
  text: 六天你要劳作，做你一切的工作。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“六天你可以劳作，做你一切的工作。”在这一法律语境中，希伯来语未完成体既可表示指示或命令，也可表示许可。
    reason: alternative_reading
lexical_decisions:
- source_word: שֵׁשֶׁת יָמִים
  choice: 六天
  rationale: 该结构表示一段持续时间；现代汉语用“六天”自然清楚，无须增添原文没有明说的介词。
- source_word: תַּעֲבֹד
  choice: 你要劳作
  rationale: עבד在此指日常劳动。“劳作”既符合安息日诫命的语境，也与下文表示“做”的עשה有所区别；“要”传达法律语境中的指示或命令意味。
- source_word: וְעָשִׂיתָ
  choice: 做
  rationale: עשה含义宽泛，在此指从事、完成各项事务；“做”与宾语“一切的工”搭配自然，也保留了原文与前一动词并列的结构。
- source_word: כָּל
  choice: 一切
  rationale: כָּל在此表示全部，指六天内所从事之工作的总体。
- source_word: מְלַאכְתֶּךָ
  choice: 你的工
  rationale: מְלָאכָה可指工作、事务或职业活动；在安息日语境中，“你的工”简洁、庄重，并与相关诫命的传统措辞相协调。
theological_decisions:
- issue: 安息日律法中未完成体动词的语气
  choice: 译为带指示或命令意味的“你要劳作……做……”
  alternative: “你可以劳作，做你一切的工”
  rationale: 本句处于盟约诫命的法律语境，“要”较好地保留其规范性语气；但希伯来语未完成体在此也可能带许可意味，因此在脚注中保留另一种理解，不把语法上的张力单向消解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“六天”比“六日”更贴近日常现代汉语；“劳作”与“做……工”保留原文两个不同动词的并列。主文使用“要”体现法律指示语气，脚注保留许可性读法。
