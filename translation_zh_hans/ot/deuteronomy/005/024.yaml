base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/024.yaml
  text: And you said, ‘Look, the LORD our God has shown us his glory and his greatness, and we have heard his voice from the midst of the fire. This day we have seen that God may speak with man, and he still lives.’
translation:
  language: zh_hans
  text: 你们说：‘看哪，耶和华我们的上帝已经向我们显明了他的荣耀和伟大；我们也从火中听见了他的声音。今天我们看见，上帝与人说话，而人还能活着。’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֵן
  choice: 看哪
  rationale: 保留引起注意并带有惊叹意味的语气，同时符合庄重的现代汉语表达。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名对应四字神名，区别于通称“上帝”。
- source_word: כְּבֹדוֹ וְאֶת־גָּדְלוֹ
  choice: 他的荣耀和伟大
  rationale: 分别对应“荣耀/尊荣”和“宏大/伟大”，保留并列结构。
- source_word: מִתּוֹךְ הָאֵשׁ
  choice: 从火中
  rationale: 直接表达声音出自火焰之中的空间意象。
- source_word: כִּי יְדַבֵּר אֱלֹהִים אֶת־הָאָדָם וָחָי
  choice: 上帝与人说话，人仍然活着
  rationale: 这里的未完成式置于经验性结论中，可表达上帝确实能与人说话；中文不必另加情态词。“仍然”显明人在这种相遇后继续存活，而不把末尾动词误解为上帝活着。
theological_decisions:
- issue: 上帝与人说话后谁仍然活着
  choice: 将“人”作为“仍然活着”的主语
  alternative: 理解为“上帝说话，并且他活着”
  rationale: 末尾 וָחָי 的隐含主语最自然地承接 הָאָדָם（人）；上下文强调百姓惊讶于听见上帝声音之后没有死亡。
- issue: יְדַבֵּר 的语气
  choice: 译作陈述性的“说话”
  alternative: 译作“可以说话”或“可能说话”
  rationale: 希伯来语未完成式在 כִּי 引出的经验结论中具有概括意义；直陈译法保留“上帝与人说话而人存活”这一已被亲历证实的事实，不额外强化许可或不确定性。
translation_notes:
  register: 采用庄重而自然的现代标准汉语；保留直接引语、并列节奏和“看哪”的经文语体。“人”在此为泛指，不限定性别。
