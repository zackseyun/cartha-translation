base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/011.yaml
  text: You shall not take the name of Yahweh your God in vain[b][a], for Yahweh will not leave unpunished the one who takes his name in vain.
translation:
  language: zh_hans
  text: 不可妄用[a]雅威——你的上帝——的名，因为妄用他名的人，雅威必不以他为无罪[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “妄用”也可译为“为虚假而用”、“不当地使用”或“空洞地使用”。希伯来语可包括虚假或空洞地使用雅威的名，并不限于某一种误用方式。
    reason: lexical_alternative
  - marker: b
    text: 或译：“必不让他免受惩罚”，或“必不宣告他无罪”。
    reason: lexical_alternative
lexical_decisions:
- source_word: תִשָּׂא / יִשָּׂא (נשא)
  choice: 用
  rationale: נשא本义可指“举起、承担、携带”；与“名”和לַשָּׁוְא连用时，中文译作“妄用”自然明确，同时不把禁令限定为某一种具体行为。
- source_word: שֵׁם / שְׁמוֹ
  choice: 名 / 他名
  rationale: 保留“名”这一核心意象，不将其释义为权柄、名誉或身份。后半句用“他名”简洁回指雅威的名。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文直接呈现四字神名的常用汉语音译，不以“主”这一称号替代。
- source_word: אֱלֹהֶיךָ
  choice: 你上帝
  rationale: 保留第二人称单数的直接盟约称呼；“你上帝”庄重而符合现代汉语圣经语体。
- source_word: לַשָּׁוְא
  choice: 妄
  rationale: שָׁוְא涵盖虚妄、虚假、空洞和不当等含义。“妄用”是自然凝练的中文表达，脚注保留其较宽的语义范围。
- source_word: כִּי
  choice: 因为
  rationale: 明确引出禁令的理由，符合现代汉语逻辑连接习惯。
- source_word: יְנַקֶּה (נקה)
  choice: 必不以……为无罪
  rationale: 贴近נקה在此处“不判为无罪、不免罪责”的司法含义，并保留原文关于罪责判定的表达；脚注说明也可理解为不免受惩罚。
- source_word: אֲשֶׁר
  choice: ……的人
  rationale: 将关系结构自然译为泛指行为者的“……的人”。
theological_decisions:
- issue: 神名YHWH的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。音译“雅威”保留其专名性质，不以称号取代。
- issue: 禁令涵盖的范围
  choice: 妄用……的名
  alternative: 借……的名起假誓；虚妄地承担……的名；滥用……的名
  rationale: 原文可涵盖虚假宣誓、空洞呼求以及更广泛的不当使用。“妄用”保留宽泛性，不把禁令收窄为单一解释。
- issue: נקה所表达的后果
  choice: 必不以他为无罪
  alternative: 必不让他免受惩罚；必不宣告他无罪
  rationale: 主文较形式对应地保留司法性的“无罪”措辞，同时脚注给出惩罚层面的自然理解，避免将罪责与刑罚完全等同。
translation_notes:
  register: 采用现代、庄重、易懂的普通话书面语。“不可……；因为……”保留诫命的法律语气。两处脚注标记均置于其所解释的主文之后。
