  yaml_path: translation/ot/deuteronomy/005/007.yaml
  text: You shall have no other gods before me[a].
translation:
  language: zh_hans
  text: 在我面前，你不可有别的神。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“除我以外，你不可有别的神。”希伯来语直译为“在我面前”；这句话可表示在上帝面前，也可表达“除我以外”的排他含义。
    reason: alternative_reading
lexical_decisions:
- source_word: לֹא יִהְיֶה לְךָ
  choice: 你不可有
  rationale: 希伯来语以“有、存在”配合“归你、对你”表达与受话者相关的拥有或承认关系；现代汉语用“你不可有”自然地传达禁令，也保留第二人称单数对以色列整体的盟约性称呼。
- source_word: אֱלֹהִים אֲחֵרִים
  choice: 别的神
  rationale: 复数名词在“别的”修饰下指其他受敬奉的神祇；“别的神”简明、自然，不额外加入“外邦”等原文未明说的含义。
- source_word: עַל פָּנָי
  choice: 除我以外
  rationale: 字面为“在我面前”，在本禁令中也表达排他性。“除我以外”在现代汉语中清楚传达不可另有神的要求；脚注保留较贴近字面的译法及其临在意味。
theological_decisions:
- issue: עַל פָּנָי 的含义
  choice: 除我以外
  alternative: 在我面前／在我面前另有
  rationale: 该短语既可描写“在我面前、在我临在中”，又可在禁令语境中表达“除我以外”的排他性。正文采用自然明确的现代汉语，脚注说明字面表达，以保留临在与专一敬奉之间的张力。
translation_notes:
  register: 采用现代、庄重而通俗的命令句。“你”对应希伯来语第二人称阳性单数；不在正文中补出“敬拜”或“承认”，以免缩窄“有别的神”的涵义。
