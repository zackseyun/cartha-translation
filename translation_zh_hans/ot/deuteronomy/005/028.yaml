  naturalness: 整体庄重、清楚，符合现代标准汉语。“他们所说的一切都说得好”语义可懂，但“所说的一切”与“说得好”连用略显重复。改为“他们所说的一切都很好”更自然，同时由上下文保留对其言语的评价。
