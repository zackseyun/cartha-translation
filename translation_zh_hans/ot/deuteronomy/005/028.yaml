base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/028.yaml
  text: And Yahweh heard the sound of your words when you spoke to me[a], and Yahweh said to me, “I have heard the sound of the words of this people, which they have spoken to you[b]; they have spoken well in all that they have said.”
translation:
  language: zh_hans
  text: 你们对我说话时，雅威听见了你们的话[a]。雅威对我说：“这百姓对你所说的话，我听见了；他们所说的一切都很好[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“你们话语的声音”，是希伯来语的听觉表达方式。
    reason: lexical_alternative
  - marker: b
    text: 或译：“他们在所说的一切事上都做得好。”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 直接音译上帝的盟约之名，区别于作为称号的“主”，并与希伯来文本使用专名的方式相符。
- source_word: וַיִּשְׁמַע / שָׁמַעְתִּי
  choice: 听见了 / 我都听见了
  rationale: שׁמע在这里指听到百姓所说的话；“听见”是现代汉语中直接自然的表达。第二处用“都”承接整段话语的内容。
- source_word: קוֹל דִּבְרֵיכֶם / קוֹל דִּבְרֵי הָעָם הַזֶּה
  choice: 你们的话 / 这百姓……所说的话
  rationale: 原文是带有听觉色彩的“话语之声”。正文采用自然汉语“话”，避免生硬的“话语的声音”，并用脚注保留原文习语。
- source_word: בְּדַבֶּרְכֶם אֵלָי
  choice: 你们对我说话时
  rationale: 介词בְּ加不定式结构表示同时发生的动作；“……时”准确而自然地表达这一时间关系。
- source_word: הָעָם הַזֶּה
  choice: 这百姓
  rationale: 保留עָם的集合单数及指示语气；“这百姓”在庄重的现代汉语中清楚自然。
- source_word: אֲשֶׁר דִּבְּרוּ אֵלֶיךָ
  choice: 对你所说的话
  rationale: 保持与上下文דבר（说、话）的词义联系，同时采用符合汉语习惯的定语结构。
- source_word: הֵיטִיבוּ כָּל אֲשֶׁר דִּבֵּרוּ
  choice: 他们所说的一切都说得好
  rationale: הֵיטִיבוּ可指做得好或行得对；因后接“他们所说的一切”，正文按语境表达为“说得好”，脚注保留更宽泛的行为性理解。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 希伯来文在本节直接使用四字神名。正文采用较贴近该名称可能发音的“雅威”，不以称号“主”替代，也不赋予经文之外的宗派性解释。
- issue: הֵיטִיבוּ所表达的认可范围
  choice: 他们所说的一切都说得好
  alternative: 他们所说的一切都做得对
  rationale: 上下文明确聚焦百姓的话，因此正文采用言语性的表达；但该动词本身也可表示“做得好、行得对”，故以脚注保留词义张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。摩西转述雅威的话时，通过“我都听见了”自然呈现直接引语；避免机械复制希伯来语听觉习语，同时在脚注中保留其原貌。
