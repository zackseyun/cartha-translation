  text: קְרַ֤ב אַתָּה֙ וּֽ/שֲׁמָ֔ע אֵ֛ת כָּל אֲשֶׁ֥ר יֹאמַ֖ר יְהוָ֣ה אֱלֹהֵ֑י/נוּ וְ/אַ֣תְּ תְּדַבֵּ֣ר אֵלֵ֗י/נוּ אֵת֩ כָּל אֲשֶׁ֨ר יְדַבֵּ֜ר יְהוָ֧ה אֱלֹהֵ֛י/נוּ אֵלֶ֖י/ךָ וְ/שָׁמַ֥עְנוּ וְ/עָשִֽׂינוּ־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/027.yaml
  text: You go near and hear all that the LORD our God says, and you shall tell us all that the LORD our God speaks to you; and we will hear and do it.
translation:
  language: zh_hans
  text: 你近前去，听耶和华—我们的上帝所说的一切；然后把耶和华—我们的上帝对你说的一切都告诉我们。我们必听从并遵行。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קְרַב
  choice: 近前去
  rationale: 准确表达祈使式“靠近、上前”，指摩西代表百姓接近并聆听上帝；“近前去”庄重而自然。
- source_word: שֲׁמָע / שָׁמַעְנוּ
  choice: 听／听从
  rationale: 首处指实际聆听，译作“听”；末处与“遵行”并列，在立约语境中含接受、服从之意，译作“听从”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的专名呈现四字神名，并与“我们的上帝”保留原文同位结构。
- source_word: תְּדַבֵּר אֵלֵינוּ
  choice: 告诉我们
  rationale: 原义为“向我们说”，在转述信息的语境中译为“告诉我们”更符合现代汉语。
- source_word: וְעָשִׂינוּ
  choice: 并遵行
  rationale: 动词基本义为“做、实行”；在对上帝话语的回应中，“遵行”自然、准确，也与前面的“听从”构成对应。
theological_decisions:
- issue: 百姓承诺中的“听”是否仅指听见
  choice: 译作“听从并遵行”
  alternative: 译作“听并去做”
  rationale: 希伯来语 שׁמע 可涵盖听见与顺从；它与“实行”并列时，“听从”能自然呈现立约顺服的语用含义，同时“遵行”保留行动层面。
- issue: 如何呈现神名与称号的关系
  choice: “耶和华—我们的上帝”
  alternative: “耶和华我们的上帝”或“上主我们的上帝”
  rationale: 破折号清楚显示“我们的上帝”是对“耶和华”的同位说明，不把二者误读为松散修饰关系；不额外加入神学解释。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。保留原文两段“耶和华—我们的上帝”的重复以及“你／我们”的中保式对话结构；分号和句号用于厘清较长的并列句。
