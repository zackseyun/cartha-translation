base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/012.yaml
  text: Observe the Sabbath day[a], to keep it holy, as Yahweh your God commanded you.
translation:
  language: zh_hans
  text: 要谨守安息日[a]，将这日分别为圣，正如耶和华你的神所吩咐你的那样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“守安息日”或“看守安息日”。希伯来语动词强调留心、切实地遵守。
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמוֹר
  choice: 谨守
  rationale: 该词在此以命令功能出现，强调留心遵行、切实守护。“谨守”既自然庄重，也保留了与《出埃及记》20:8“记念”不同的措辞。
- source_word: יוֹם הַשַׁבָּת
  choice: 安息日
  rationale: 这是现代汉语中清楚而通行的圣经用语，既指明特定的日子，也保留“安息”的语义联系。
- source_word: לְקַדְּשׁוֹ
  choice: 将这日分别为圣
  rationale: 介词加不定式表达目的；“分别为圣”说明要把这日当作归神、圣洁的日子，不暗示人使其获得内在神性。代词明确译为“这日”，符合汉语表达。
- source_word: כַּאֲשֶׁר
  choice: 照
  rationale: 自然表达依照先前命令而行，也保留原文的比较或依据关系。
- source_word: צִוְּךָ
  choice: 所吩咐你的
  rationale: 准确传达צוה所含的权威命令意味；关系结构在汉语中自然衔接“照”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代简体中文圣经传统中最通行、最易识别的专名形式呈现四字神名，而不以“主”这一称号替代。
- source_word: אֱלֹהֶיךָ
  choice: 你的神
  rationale: 直接保留第二人称阳性单数的盟约称谓；本节各个“你”均为单数。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用神的专名，不宜改译为称号“主”。“耶和华”是普通现代中文读者最熟悉的专名形式；“雅威”较接近学术界常用的拟音，但不确定性仍存。
- issue: לְקַדְּשׁוֹ 所表达的成圣行动
  choice: 将这日分别为圣
  alternative: 使这日成圣
  rationale: 原文可直译为“使它为圣/将它分别为圣”。所选表达强调把安息日作为圣日分别出来并如此对待，避免让读者误以为人的行为赋予这日本来没有的内在圣性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。“谨守”保留盟约命令中审慎遵行的力度；句式尽量贴近希伯来原文，同时避免生硬直译。
