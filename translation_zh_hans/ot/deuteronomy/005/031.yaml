source:
  edition: WLC
  text: וְ/אַתָּ֗ה פֹּה֮ עֲמֹ֣ד עִמָּדִ/י֒ וַ/אֲדַבְּרָ֣ה אֵלֶ֗י/ךָ אֵ֧ת כָּל הַ/מִּצְוָ֛ה וְ/הַ/חֻקִּ֥ים וְ/הַ/מִּשְׁפָּטִ֖ים אֲשֶׁ֣ר תְּלַמְּדֵ֑/ם וְ/עָשׂ֣וּ בָ/אָ֔רֶץ אֲשֶׁ֧ר אָנֹכִ֛י נֹתֵ֥ן לָ/הֶ֖ם לְ/רִשְׁתָּֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/031.yaml
  text: But you[a], stand here with me, and I will speak to you all the commandment and the statutes and the judgments that you shall teach them[b], so that they may do them in the land that I am giving them to possess.
translation:
  language: zh_hans
  text: 但你要同我站在这里；我要把全部诫命、律例和典章都告诉你[a]。你要教导他们，使他们在我赐给他们、让他们取得为业的那地遵行这一切[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文“诫命”是单数，后面则是复数的“律例”和“典章”；“全部诫命”也可译作“整个诫命”。
    reason: 保留原文单复数差异及集合性表达的可能。
  - marker: b
    text: “取得为业”也可译作“承受那地”或“占有那地”。
    reason: 原词在土地应许语境中可表达承受、取得或占有。
lexical_decisions:
- source_word: וְאַתָּה פֹּה עֲמֹד עִמָּדִי
  choice: 但你要同我站在这里
  rationale: 保留“站”的具体意象和庄重语气；וְאַתָּה 在上下文中把摩西与返回帐棚的百姓区分开来，因此译作“但你”。
- source_word: וַאֲדַבְּרָה אֵלֶיךָ
  choice: 我要把……都告诉你
  rationale: 祈愿式接在命令式之后，表达随后将要进行的神圣训示；汉语用“我要……告诉你”自然清楚。
- source_word: אֵת כָּל הַמִּצְוָה
  choice: 全部的诫命
  rationale: מִצְוָה 为单数，可能具有集合意义；正文保留整体性表达，并以脚注说明原文数的形式及另一译法。
- source_word: הַחֻקִּים
  choice: 律例
  rationale: “律例”是现代中文圣经法律语境中清楚而庄重的对应词，并与“典章”保持区别。
- source_word: הַמִּשְׁפָּטִים
  choice: 典章
  rationale: 该词在盟约法律语境中指司法规定或裁断；“典章”既保留法律色彩，也与“律例”构成有区别的并列项。
- source_word: אֲשֶׁר תְּלַמְּדֵם
  choice: 你要教导他们
  rationale: 未完成式在此带指令性质，直接表达摩西受托教导百姓。
- source_word: וְעָשׂוּ
  choice: 使他们……遵行这一切
  rationale: 此句承接“教导”，可表达目的或结果；“遵行”适合诫命和律例的语境，“这一切”自然承接前述三项。
- source_word: אֲשֶׁר אָנֹכִי נֹתֵן לָהֶם
  choice: 我赐给他们
  rationale: נֹתֵן 是分词，呈现正在实现或即将实现的赐予；汉语简洁的“赐给”可自然涵盖这一时态层面。
- source_word: לְרִשְׁתָּהּ
  choice: 去取得为业
  rationale: יָרַשׁ 在土地应许语境中兼有取得、占有和承受之意；“取得为业”保留实际占有和作为产业承受这两层含义。
theological_decisions:
- issue: 法律词组三项 מִצְוָה / חֻקִּים / מִשְׁפָּטִים 的处理
  choice: 分别译为“诫命、律例和典章”
  alternative: 概括译为“律法和规定”
  rationale: 保留原文三项并列的法律结构，不把不同词项压缩成笼统类别。
- issue: מִצְוָה 的单数形式
  choice: 正文译“全部的诫命”，并用脚注说明原文为单数
  alternative: 译作“所有诫命”或“整套命令”
  rationale: 原文单数可能是集合用法；中文若机械突出单数会生硬，因此以整体性措辞配合脚注，既保持可读性又不掩盖原文形式。
- issue: וְעָשׂוּ 与前句的关系
  choice: 译成目的关系“使他们……遵行”
  alternative: 并列或结果关系“他们就要……遵行”
  rationale: 原文连接词容许目的或结果理解；上下文中教导指向实行，正文采用自然的目的表达，但不加入超出经文的神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。保留“站”“诫命、律例和典章”等原文具体意象与法律层次；句法按中文习惯分成两句，并以“这一切”明确“遵行”的宾语。
