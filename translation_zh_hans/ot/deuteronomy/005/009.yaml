source:
  edition: WLC
  text: לֹא תִשְׁתַּחֲוֶ֥ה לָ/הֶ֖ם וְ/לֹ֣א תָעָבְדֵ֑/ם כִּ֣י אָנֹכִ֞י יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ אֵ֣ל קַנָּ֔א פֹּ֠קֵד עֲוֺ֨ן אָב֧וֹת עַל בָּנִ֛ים וְ/עַל שִׁלֵּשִׁ֥ים וְ/עַל רִבֵּעִ֖ים לְ/שֹׂנְאָֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/009.yaml
  text: You shall not bow down to them or serve them[a], for I, Yahweh your God, am a jealous God, visiting the iniquity of fathers on children, and on the third and on the fourth generations of those who hate me[c][b],
translation:
  language: zh_hans
  text: 不可向它们下拜[a]，也不可侍奉它们；因为我耶和华你的上帝是忌邪的上帝，向恨我的人追究父辈的罪，延及儿女，直到第三、第四代[b][c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“俯伏在它们面前”。希伯来语动词指以屈身或伏地表达敬意、敬拜。
    reason: lexical_alternative
  - marker: b
    text: “追究”也可译作“惩罚”或“问罪”。希伯来语用的是一个司法意味较广的词，可包括查究罪责与施行惩罚。
    reason: lexical_alternative
  - marker: c
    text: 原文直译为“在第三和第四”；“代”是按上下文补出的。
    reason: lexical_alternative
lexical_decisions:
- source_word: תִשְׁתַּחֲוֶה
  choice: 跪拜
  rationale: 保留俯身、伏拜这一具体敬拜动作，并与后面的“侍奉”区分；现代汉语中“跪拜”自然地表达向受尊崇对象屈身敬拜。
- source_word: תָעָבְדֵם
  choice: 侍奉它们
  rationale: 此处指对偶像或神祇献上宗教性的服事；“侍奉”既保留 עבד 的基本意义，也不与前一动词合并为笼统的“敬拜”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名形式呈现四字神名，不以“主”这一称号代替。
- source_word: אֱלֹהֶיךָ
  choice: 你的上帝
  rationale: 直接表达带第二人称单数后缀的盟约称谓。
- source_word: אֵל קַנָּא
  choice: 忌邪的上帝
  rationale: “忌邪”在中文圣经语境中表达上帝要求专一忠诚、不容 rival worship 的盟约性质，比一般的“热心”更能保留原文的排他性。
- source_word: פֹּקֵד
  choice: 追究
  rationale: פקד 在此为司法语境中的临到、查究或问责；“追究”保留审判和问责之意，又不把范围完全缩窄为已经执行的“惩罚”。
- source_word: עֲוֺן
  choice: 罪
  rationale: עָוֹן 可指罪孽、罪责及其后果；正文用现代读者易懂的“罪”，而由“追究”体现其罪责层面。
- source_word: אָבוֹת
  choice: 父亲
  rationale: 原文为阳性复数“父亲们”；汉语在泛指各代父辈时可用“父亲”，保留其明确的父系措辞。
- source_word: עַל בָּנִים
  choice: 延及儿女
  rationale: בנים 在世代语境中可统指后代子女；“儿女”自然且具有包容性。“延及”表达 עַל 所示追究所达到的对象。
- source_word: שִׁלֵּשִׁים וְרִבֵּעִים
  choice: 直到第三、第四代
  rationale: 原文直说“第三和第四”，世代概念由语境补足；中文补出“代”以求清楚，并保留两个并列序数。
- source_word: לְשֹׂנְאָי
  choice: 恨我的人
  rationale: 将句末限定语前置，使现代汉语清楚显示所述追究与“恨我的人”有关，同时不额外断定其只修饰哪一代人。
theological_decisions:
- issue: 如何表达上帝的 קַנָּא
  choice: 忌邪的上帝
  alternative: 嫉妒的上帝；热心的上帝
  rationale: “忌邪”保留盟约关系中要求专一敬拜、排斥竞争对象的力度，同时避免现代汉语“嫉妒”常有的负面人格联想；“热心”则会弱化排他性的要求。
- issue: 经文是否宣告不论后代自身态度如何，都会自动承受祖先的刑罚
  choice: 将“恨我的人”置于追究条款之前，保留它对整个审判陈述的限定作用
  alternative: 理解为后代仅因父辈犯罪便无条件受罚
  rationale: 原文句末的 לְשֹׂנְאָי 与整段追究表述相连。译文表明审判发生在恨上帝者的范围内，但不进一步消解父罪延及后代所形成的神学张力。
- issue: פֹּקֵד 的司法力度
  choice: 追究
  alternative: 察看；惩罚；使……担当
  rationale: “追究”能够涵盖查问罪责和施行审判，避免“察看”过弱，也避免直接以“惩罚”消除该词在原文中的语义宽度。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“不可……也不可……”保持诫命体的严肃节奏；“跪拜／侍奉”保留两个希伯来动词的区别。“忌邪”虽略具传统圣经色彩，但在此比“嫉妒”准确、庄重；脚注解释关键语义。
