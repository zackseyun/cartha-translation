revisions:
- from: 不可向它们跪拜[a]，也不可侍奉它们，因为我耶和华你的上帝，是忌邪的上帝；恨我的人，我追究父亲的罪，延及儿女，直到第三、第四代[b][c]。
  to: 不可向它们下拜[a]，也不可侍奉它们；因为我耶和华你的上帝是忌邪的上帝，向恨我的人追究父辈的罪，延及儿女，直到第三、第四代[b][c]。
  rationale: 修订保留原有的现代、庄重语体及关键术语，仅调整“恨我的人”的位置和介词关系，以消除汉语歧义并避免把有讨论空间的原文限定语过度解释为单一神学结论；同时以“下拜”“父辈”分别更精确对应原文动作与复数名词。脚注锚点及内容均完整保留。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T04:57:16Z'
review_pass:
  verdict: revise
  source_fidelity: 译文基本保留了两个禁令动词、“忌邪”、父辈之罪延及后代及三、四代等要素。不过将句末“恨我的人”前置为“恨我的人，我追究……”造成汉语句法上的悬置，也较强地预先判定其限定范围。宜按原文的司法介词关系译为“向恨我的人追究……”，既保留其与追究条款的关联，也不消除其具体句法范围的讨论空间。
  naturalness: “恨我的人，我追究父亲的罪”不够自然，读者难以立即判断“恨我的人”是受追究者、父亲还是限定语。“向恨我的人追究父辈的罪，延及儿女，直到第三、第四代”在现代庄重汉语中更清楚顺畅。将“跪拜”改为“下拜”可更准确表达屈身敬拜的动作，而不特指跪姿。
  terminology: “耶和华”“上帝”“忌邪”“侍奉”均合适，且保留了神名、盟约性的排他要求和两个敬拜动词的区别。“父辈”比泛指性的单数“父亲”更贴合原文复数；“儿女”可自然表达此处世代语境中的后代。
  issues:
  - severity: medium
