    rationale: 原文为追究条款末尾的 לְשֹׂנְאָי。草稿的“恨我的人，我追究父亲的罪”在汉语中关系不明，并使其看似无歧义地统摄整项陈述。改作“向恨我的人追究……”较贴近介词结构，且避免过度释义。
  - severity: low
    issue: “跪拜”将下拜动作具体化为跪姿。
    rationale: תשתחוה 指屈身、俯伏的敬拜动作，不必限于跪。 “下拜”在现代中文圣经语域中自然且较宽。
  - severity: low
    issue: “父亲的罪”未充分反映原文复数。
    rationale: אָבוֹת 为复数；“父辈的罪”既保留父系措辞，也适合此处跨世代的泛指。
