source:
  edition: WLC
  text: וַ/יִּקְרָ֣א מֹשֶׁה֮ אֶל כָּל יִשְׂרָאֵל֒ וַ/יֹּ֣אמֶר אֲלֵ/הֶ֗ם שְׁמַ֤ע יִשְׂרָאֵל֙ אֶת הַ/חֻקִּ֣ים וְ/אֶת הַ/מִּשְׁפָּטִ֔ים אֲשֶׁ֧ר אָנֹכִ֛י דֹּבֵ֥ר בְּ/אָזְנֵי/כֶ֖ם הַ/יּ֑וֹם וּ/לְמַדְתֶּ֣ם אֹתָ֔/ם וּ/שְׁמַרְתֶּ֖ם לַ/עֲשֹׂתָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/001.yaml
  text: And Moses called all Israel and said to them[a], “Hear, Israel, the statutes and the judgments that I am speaking in your hearing today; learn them and keep them[b], to do them.”
translation:
  language: zh_hans
  text: 摩西召集以色列众人，对他们说：“以色列啊，你们要听我今天正在向你们宣讲的律例和典章；要学习它们，并谨守它们，好照着实行。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “要听”含有留心听取并进而照着实行的意味。末句直译为“学习它们，并谨守它们，为要实行它们”；“好照着实行”表达其目的或结果。
    reason: 说明שׁמע的语用范围，并交代末尾“谨守……为要实行……”的目的／结果结构。
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: 召集
  rationale: 此处指摩西把全体以色列人召来听取讲话；“召集”比单纯的“呼叫”更符合叙事场景。
- source_word: כָּל יִשְׂרָאֵל
  choice: 以色列众人
  rationale: 保留以色列作为整体受众的集体意义，同时符合现代汉语表达。
- source_word: שְׁמַע יִשְׂרָאֵל
  choice: 以色列啊，要听
  rationale: שׁמע在盟约劝诫中不只是听见，也包含专心听从的意味；正文保留“听”，不把顺服之意完全明说。
- source_word: הַחֻקִּים
  choice: 律例
  rationale: 对应规定、制定的法令，保留申命记法律语境中的固定而庄重的用语。
- source_word: הַמִּשְׁפָּטִים
  choice: 典章
  rationale: 该词可指判例、法令或规范；“典章”与“律例”相配，又维持两个希伯来法律术语的区别。
- source_word: דֹּבֵר
  choice: 宣讲
  rationale: 分词表达摩西此刻正在公开陈述；“宣讲”体现正式公开讲话的语境，但不额外赋予宗教仪式含义。
- source_word: בְּאָזְנֵיכֶם
  choice: 当着你们
  rationale: 希伯来文直译为“在你们耳中”，意为让受众亲耳听见；“当着你们”在现代汉语中自然地保留直接公开陈述的意味。
- source_word: הַיּוֹם
  choice: 今天
  rationale: 自然、准确地表达当日讲话的即时性。
- source_word: וּלְמַדְתֶּם אֹתָם
  choice: 你们要学习
  rationale: למד要求百姓学习并掌握这些法令；“学习”不把范围缩窄为单纯研读。
- source_word: וּשְׁמַרְתֶּם לַעֲשֹׂתָם
  choice: 并且谨守遵行
  rationale: 希伯来文依次表达“守住它们，为要实行它们”；汉语成语式搭配“谨守遵行”自然凝练，并保留从持守到实践的推进。
theological_decisions:
- issue: 是否区分 חֻקִּים 与 מִשְׁפָּטִים
  choice: 律例和典章
  alternative: 法令和规则；律例和判例
  rationale: 原文并列两个相关但不完全相同的法律词汇；分别翻译可保留盟约法律语言的层次，而不将二者合并为泛称。
- issue: 盟约劝诫中 שׁמע 的力度
  choice: 要听
  alternative: 要听从；要留心听
  rationale: 原词兼有聆听、留意并进而顺服的语用力量。正文用“要听”保留其简洁、庄重和一定的开放性，脚注说明较宽的含义，避免直接把词义收窄为“服从”。
- issue: לַעֲשֹׂתָם 与 שׁמר 的关系
  choice: 谨守遵行
  alternative: 谨守，为要实行；持守并实行
  rationale: 末尾不定式可表达目的或结果。正文采用自然汉语并保留实践性，但不进一步界定其句法关系。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。“以色列啊，要听”保留公开盟约讲话的呼告语气；“律例和典章”维持法律词汇的区分。脚注标记置于整句末尾，正文与脚注对应。
