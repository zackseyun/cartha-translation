base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/006.yaml
  text: I am Yahweh your God[a], who brought you from the land of Egypt, from the house of slaves.
translation:
  language: zh_hans
  text: “我是雅威，你的上帝，就是把你从埃及地、从奴隶之家[a]领出来的那一位。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“奴役之家”或“为奴之家”。希伯来语字面为“奴隶之屋”。
    reason: 说明原文“家／屋”与复数“奴隶”的具体构造，并提供较自然的汉语功能性译法。
lexical_decisions:
- source_word: אָֽנֹכִי
  choice: 我是
  rationale: 希伯来语独立第一人称代词构成无系词句；现代汉语补出“是”，自然地表达庄严的自我宣告。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来语四字神名的常见汉语音译处理，保留其作为上帝专名的性质，不以称号代替。
- source_word: אֱלֹהֶיךָ
  choice: 你的上帝
  rationale: 名词在此指以色列的上帝，第二人称阳性单数后缀直译为“你的”；汉语不标明性别。
- source_word: הוֹצֵאתִיךָ
  choice: 我曾把你……领出来
  rationale: 使役形表达“使出去、带出来”；“领出来”在汉语中自然，并保留出离之意。“曾”明确这是已经发生的拯救行动。
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: 从埃及地
  rationale: מִן 表示起点或来源；“埃及地”简洁保留 אֶרֶץ 的表达。
- source_word: מִבֵּית עֲבָדִים
  choice: 从奴隶之家
  rationale: 尽量保留“家／房屋”与复数“奴隶”的具体意象，不把它无提示地抽象化为“奴役”。脚注说明更自然的功能性译法。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。正文采用音译“雅威”，以保留盟约语境中的专名；不以“主”这一称号替代。
- issue: 出埃及公式中 עֲבָדִים 的具体或抽象表达
  choice: 奴隶之家
  alternative: 为奴之家；受奴役之地
  rationale: עֲבָדִים 是“奴隶”的复数名词，正文保留被奴役者这一具体社会身份；同时用脚注提供更符合汉语习惯、但较抽象的译法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“我是雅威你的上帝”保留原文紧凑的自我宣告；分号使身份宣告与随后说明的拯救行动层次清楚。第二人称“你”在原文为阳性单数，指作为整体被呼告的以色列；汉语正文自然保留“你”，不额外解释为复数。
