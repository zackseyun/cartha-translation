  text: מִֽי יִתֵּ֡ן וְ/הָיָה֩ לְבָבָ֨/ם זֶ֜ה לָ/הֶ֗ם לְ/יִרְאָ֥ה אֹתִ֛/י וְ/לִ/שְׁמֹ֥ר אֶת כָּל מִצְוֺתַ֖/י כָּל הַ/יָּמִ֑ים לְמַ֨עַן יִיטַ֥ב לָ/הֶ֛ם וְ/לִ/בְנֵי/הֶ֖ם לְ/עֹלָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/029.yaml
  text: Oh[a], that they had such a heart as this always—to fear me and to keep all my commandments all their days—so that it might go well with them and with their children forever!
translation:
  language: zh_hans
  text: 但愿[a]他们常存这样的心，一生敬畏我，遵守我的一切诫命，好叫他们和他们的子孙永远得福！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语开头字面为“谁会赐给……？”；这是表达强烈愿望的惯用语，也可译作“惟愿”。
    reason: 说明原文愿望惯用语的字面形式及其惯用含义。
lexical_decisions:
- source_word: מִי יִתֵּן
  choice: 但愿
  rationale: 这是表达强烈愿望的希伯来语惯用语，并非询问由谁赐予；“但愿”自然保留其渴望和感叹语气。
- source_word: וְהָיָה לְבָבָם זֶה לָהֶם
  choice: 他们总有这样的心
  rationale: 将存在句和所属与格按现代汉语整合为“有这样的心”；“这样”指向前文所表现或所期望的内在态度。
- source_word: לְבָבָם
  choice: 心
  rationale: “心”在这里涵盖思想、意志和道德属灵倾向；保留圣经的人观表达，不窄化为单纯的“思想”。
- source_word: לְיִרְאָה אֹתִי
  choice: 敬畏我
  rationale: “敬畏”既保留“畏”的成分，也表达对上帝尊崇、顺服的盟约性态度。
- source_word: וְלִשְׁמֹר אֶת כָּל מִצְוֺתַי
  choice: 遵守我的一切诫命
  rationale: שׁמר 与“诫命”连用时表示实行并谨守；“遵守”是清楚自然的现代汉语。
- source_word: כָּל הַיָּמִים
  choice: 一生
  rationale: 字面为“所有的日子”，在这里指他们一生持续如此；“一生”简洁自然，并保留持续性。
- source_word: לְמַעַן יִיטַב לָהֶם
  choice: 好使他们……得福
  rationale: לְמַעַן 引出目的或结果；יטב להם 是盟约语境中的安好、蒙福，不限于物质兴盛。
- source_word: וְלִבְנֵיהֶם לְעֹלָם
  choice: 和他们的子孙永远得福
  rationale: בנים 在此泛指后代；“子孙”比仅指男性的“儿子”更准确地传达世代延续，而“永远”对应 לְעֹלָם。
theological_decisions:
- issue: לְבָבָם 的人观含义
  choice: 心
  alternative: 内心；心思
  rationale: 经文所说的是人在上帝面前包括意志、思想和道德取向的内在生命；“心”保留这一整体含义。
- issue: יִיטַב לָהֶם 的福祉范围
  choice: 得福
  alternative: 凡事顺利；过得好
  rationale: 该表达指在盟约关系中得享上帝所赐的福祉；“得福”不把含义局限为物质成功，也不将福祉的具体形态过度限定。
- issue: וְלִבְנֵיהֶם 的所指
  choice: 他们的子孙
  alternative: 他们的儿子；他们的儿女
  rationale: 阳性复数在此按语境泛指后代；“子孙”自然体现经文所强调的跨世代福祉。
- issue: 愿望句是否暗示能力或预定论结论
  choice: 保留为“但愿”所表达的强烈愿望
  alternative: 改写为上帝必使他们如此，或他们凭自己便能如此
  rationale: 原文表达愿望，却没有在本节明确解释人如何获得这样的心；译文不额外解决这一神学张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“但愿”保留原文感叹与渴望；“一生”避免生硬的“所有日子”；“得福”概括盟约语境中的安好而不收窄为物质繁荣。脚注标记置于整节末尾，对应开头惯用语。
