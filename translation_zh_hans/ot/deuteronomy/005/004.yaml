  yaml_path: translation/ot/deuteronomy/005/004.yaml
  text: Yahweh spoke with you face to face on the mountain[a], from the midst of the fire.
translation:
  language: zh_hans
  text: 耶和华在山上从火焰当中与你们面对面地说话。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “面对面”是希伯来语惯用语，表示直接、亲自地说话；参申命记4:12，那里说以色列人听见声音，却没有看见形体。
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּנִים בְּפָנִים
  choice: 面对面地
  rationale: 保留希伯来语“面对面”的惯用表达及其修辞力度，表示直接、亲自的交流；不将其简化为“直接地”，也不据此断定以色列人看见了上帝的形体。
- source_word: דִּבֶּר
  choice: 说话
  rationale: 该动词基本义为“说话”；与后面的 עִמָּכֶם 结合，译为“与你们说话”自然且贴近原文。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文中广为人知的上帝专名音译“耶和华”，保留四字神名作为专名的性质，而不以称号代替。
- source_word: עִמָּכֶם
  choice: 与你们
  rationale: 介词 עִם 通常表示“与、同”；“与你们说话”体现原文所强调的直接关系。
- source_word: בָּהָר
  choice: 在山上
  rationale: 介词 בְּ 在这里表示地点；“在山上”符合西奈山语境，也合乎现代汉语表达。
- source_word: מִתּוֹךְ הָאֵשׁ
  choice: 从火中
  rationale: מִתּוֹךְ 指从某物内部或当中出来；“从火中”既准确，又保留显现情景的鲜明和庄严。
theological_decisions:
- issue: “面对面”这一拟人化表达与西奈山显现中“只听见声音、没有看见形像”的张力
  choice: 保留“面对面”这一惯用语，将其理解为直接、亲自的立约宣告，但不在正文中解释为实际看见上帝的面。
  alternative: 意译为“直接地”或“亲自”，以避免读者理解为视觉上的相见。
  rationale: 申命记4:12、15说明以色列人听见声音，却没有看见形像。保留原有惯用语，既不抹去原文的修辞张力，也不加入关于视觉经验的额外断言。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“面对面地与你们说话”保留原文的关系性和修辞力度；“从火中”则忠实呈现神显场景。
