  terminology: “雅威”与项目对יהוה的既定译法一致；“会众”“石版”及“幽暗”均恰当。对וְלֹא יָסָף采用“他没有再增添别的话”，并以脚注保留“没有继续说下去”的可行理解，充分维持原文的语义歧义，且未加入宗派性解释。
