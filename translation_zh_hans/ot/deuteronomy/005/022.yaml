  text: אֶֽת הַ/דְּבָרִ֣ים הָ/אֵ֡לֶּה דִּבֶּר֩ יְהוָ֨ה אֶל כָּל קְהַלְ/כֶ֜ם בָּ/הָ֗ר מִ/תּ֤וֹךְ הָ/אֵשׁ֙ הֶֽ/עָנָ֣ן וְ/הָֽ/עֲרָפֶ֔ל ק֥וֹל גָּד֖וֹל וְ/לֹ֣א יָסָ֑ף וַֽ/יִּכְתְּבֵ֗/ם עַל שְׁנֵי֙ לֻחֹ֣ת אֲבָנִ֔ים וַֽ/יִּתְּנֵ֖/ם אֵלָֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/022.yaml
  text: These words Yahweh spoke to all your assembly on the mountain[a], out of the midst of the fire, the cloud, and the thick darkness, with a loud voice, and he added no more. And he wrote them on two tablets of stone and gave them to me.
translation:
  language: zh_hans
  text: “这些话，是雅威在山上从火、云和幽暗中，用洪亮的声音向你们全体会众说的；他没有再增添别的话。[a] 他把这些话写在两块石版上，又把石版交给了我。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他没有继续说下去。”这句希伯来语既可理解为他没有再增添别的话，也可理解为他没有继续说。
    reason: 保留וְלֹא יָסָף的语义歧义。
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 采用神圣名字的现代汉语音译，不以“主”这一称号替代专名。
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: 这些话
  rationale: דְּבָרִים在这里指刚才宣告的话；译作“话”保留言说重点，也避免在正文中直接解释为“诫命”。
- source_word: כָּל קְהַלְכֶם
  choice: 你们全体会众
  rationale: קָהָל指聚集起来的群体；“全体会众”在现代汉语中自然，并保留其共同体含义。
- source_word: מִתּוֹךְ הָאֵשׁ הֶעָנָן וְהָעֲרָפֶל
  choice: 从火、云和幽暗中
  rationale: “从……中”体现מִתּוֹךְ的内部来源感；“幽暗”表达עֲרָפֶל所指的浓密黑暗或昏暗。
- source_word: קוֹל גָּדוֹל
  choice: 用洪亮的声音
  rationale: 字面为“大声/宏大的声音”；“洪亮的声音”自然表达神向全体会众公开发声的听觉力度。
- source_word: וְלֹא יָסָף
  choice: 他没有再增添别的话
  rationale: 该习语在本语境中可指没有再添加言语；译文保留“增添”的核心意味，并用脚注注明另一种理解。
- source_word: שְׁנֵי לֻחֹת אֲבָנִים
  choice: 两块石版
  rationale: 简洁、自然地表达希伯来语“石头的两块版”，也符合现代汉语圣经语境。
- source_word: וַיִּתְּנֵם אֵלָי
  choice: 又把石版交给了我
  rationale: 按叙事语境明示所交付的是刚提到的两块石版，避免汉语代词“它们”误指写在版上的话。
theological_decisions:
- issue: 神圣名字יהוה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: “雅威”直接音译神的专名，避免用称号替代，也不引入宗派性解释。
- issue: וְלֹא יָסָף的语义
  choice: 他没有再增添别的话
  alternative: 他没有继续说下去
  rationale: 前者与“这些话”及随后写在石版上的叙述衔接紧密，但希伯来语也可理解为“不再继续”；脚注保留这一真实歧义，不把其中一种解释说成唯一可能。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“全体会众”“洪亮的声音”“两块石版”便于普通读者理解，同时保持公开立约场景的肃穆感。脚注标记置于实际存在歧义的分句之后。
