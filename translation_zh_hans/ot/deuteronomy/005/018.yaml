  text: And you shall not commit adultery[a].
translation:
  language: zh_hans
  text: 也不可奸淫[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或简译：“不可奸淫。”希伯来文有连接词“也／和”，把这条诫命与前后的诫命连在一起。
    reason: 说明原文连接词及较简洁的译法。
lexical_decisions:
- source_word: וְ/לֹא
  choice: 也不可
  rationale: 前缀连接词 וְ 将本诫命与上下文中的诫命相连；“也”自然体现这种承接关系。否定词 לֹא 在诫命语境中表达明确、持续有效的禁止，以“不可”传达其庄重的律法语气。
- source_word: תִּנְאָף
  choice: 奸淫
  rationale: נאף 的 Qal 未完成式第二人称阳性单数在十诫中具有禁止作用，指违背婚姻关系的性行为。“奸淫”是现代汉语圣经和庄重律法语体中准确而简洁的对应表达。
theological_decisions:
- issue: 圣约律法中第二人称阳性单数禁令的表达
  choice: 也不可奸淫。
  alternative: 不可奸淫。／不要奸淫。
  rationale: 希伯来文以第二人称阳性单数直接向圣约成员说话，也可将以色列作为整体来称呼。“不可”保留诫命庄重而明确的禁止语气，比口语化的“不要”更合适；“也”则保留原文连接词所体现的诫命序列关系。
translation_notes:
  register: 采用简洁、庄重而通行的现代标准汉语。“也不可”承接诫命序列；“奸淫”准确表达婚姻关系中的性背叛，避免添加原文未明说的解释。
