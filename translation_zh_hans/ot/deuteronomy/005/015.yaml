id: DEU.5.15
reference: Deuteronomy 5:15
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/זָכַרְתָּ֗ כִּ֣י עֶ֤בֶד הָיִ֨יתָ֙ בְּ/אֶ֣רֶץ מִצְרַ֔יִם וַ/יֹּצִ֨אֲ/ךָ֜ יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ מִ/שָּׁ֔ם בְּ/יָ֥ד חֲזָקָ֖ה וּ/בִ/זְרֹ֣עַ נְטוּיָ֑ה עַל כֵּ֗ן צִוְּ/ךָ֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ לַ/עֲשׂ֖וֹת אֶת י֥וֹם הַ/שַׁבָּֽת־׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/015.yaml
  text: And remember that you were a slave in the land of Egypt[a], and Yahweh your God brought you out from there with a strong hand and an outstretched arm[b]; therefore Yahweh your God commanded you to observe the Sabbath day.
translation:
  language: zh_hans
  text: 你要记住，你曾在埃及地作奴隶；雅威你的上帝用大能的手[a]和伸出的臂膀，把你从那里领了出来。因此，雅威你的上帝吩咐你守安息日[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语直译为“强壮的手”；这是强调雅威施行拯救时所彰显大能的惯用表达。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语直译近于“行安息日”，意思是遵守安息日。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזָכַרְתָּ
  choice: 你要记住
  rationale: 该形式在诫命语境中带有劝令作用；“你要记住”既承接上文，也自然表达持续牢记的要求。
- source_word: עֶבֶד
  choice: 奴隶
  rationale: 这里指以色列人在埃及受奴役的身份；“奴隶”比“仆人”更准确地表现其受辖制的处境。
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: 在埃及地
  rationale: 保留希伯来语具体的地域表达，同时符合现代汉语的圣经叙事语体。
- source_word: וַיֹּצִאֲךָ
  choice: 把你……领了出来
  rationale: 准确表达使役词形所指的出埃及拯救行动；“领出来”在现代汉语中自然清楚。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以常见的现代汉语音译呈现四字神名，保留原文中的专名性质。
- source_word: אֱלֹהֶיךָ
  choice: 你的上帝
  rationale: 直接呈现第二人称单数所属关系；原文两次出现，译文也两次保留，以维持强调。
- source_word: בְּיָד חֲזָקָה
  choice: 用大能的手
  rationale: 这是描述上帝施行拯救之能力的希伯来语惯用表达；“大能的手”比逐字的“强壮的手”更符合现代汉语，同时保留“手”的意象。
- source_word: וּבִזְרֹעַ נְטוּיָה
  choice: 和伸出的臂膀
  rationale: 保留原文身体意象及“伸出”的动作，表达上帝公开彰显的大能。
- source_word: עַל כֵּן
  choice: 因此
  rationale: 明确连接出埃及的拯救与遵守安息日的命令。
- source_word: לַעֲשׂוֹת אֶת־יוֹם הַשַּׁבָּת
  choice: 守安息日
  rationale: 希伯来语逐字近于“行安息日”，在此惯用意义是遵守安息日；“守安息日”简洁、自然且准确。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；采用“雅威”保留其专名性质，并以现代汉语常见音译呈现。
- issue: עֶבֶד 所指的受奴役身份
  choice: 奴隶
  alternative: 仆人
  rationale: 本节以以色列人在埃及受奴役并蒙解救的经历作为安息日命令的根据；“奴隶”更充分保留这一处境的严酷性。
- issue: 安息日命令与出埃及拯救之间的关系
  choice: 以“因此”保留明确的推论关系
  alternative: 仅作松散的叙事连接
  rationale: עַל כֵּן 明确表明，上帝从奴役中施行拯救，是本节安息日命令的理由；译文保留这一神学张力而不作额外解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。“雅威你的上帝”保留原文契约称谓的重复；“大能的手”和“伸出的臂膀”保留希伯来语的身体意象，同时避免生硬逐字翻译。
