lexical_decisions:
- source_word: וְ/לֹא
  choice: 不可
  rationale: 希伯来语连词 וְ 将本诫命与前面的诫命相连；中文十诫逐条列举时通常不必机械译出“并且”，以“不可”自然、庄重地表达 לֹא 加未完成式所具有的禁止命令语气。
- source_word: תִּגְנֹב
  choice: 偷窃
  rationale: גנב 在此为 Qal 未完成式第二人称阳性单数，在律法语境中表达禁止。经文未限定被偷取的对象，因此采用含义宽泛的“偷窃”，不将其缩窄为“绑架”。
theological_decisions:
- issue: 禁令的对象范围
  choice: 保留一般性的“偷窃”
  alternative: 不可绑架／不可偷人
  rationale: 该动词在某些上下文可指偷人，但本节没有宾语，也没有足够依据将诫命限定为绑架；宽泛译法保留原文的概括性。
translation_notes:
  register: 采用现代标准普通话中简洁、庄重且通行的十诫措辞。“不可”保留法律禁令的力度；省略句首连词，使中文自然，同时由上下文体现诫命之间的并列关系。
