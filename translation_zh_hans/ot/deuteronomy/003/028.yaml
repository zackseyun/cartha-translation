base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/028.yaml
  text: But commission Joshua[a], and strengthen him and encourage him, for he will cross over before this people[c][b], and he will cause them to inherit the land that you will see.
translation:
  language: zh_hans
  text: 你要吩咐约书亚[a]，使他刚强，使他勇敢[b]；因为他必在这百姓前面过去，并使他们承受你将看见的那地[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “吩咐”也可译作“嘱咐”“郑重托付”或“委任”。原文可指正式地交付责任。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“使他刚强，使他勇敢”；这两个并列动词强调坚定和勇气。
    reason: lexical_alternative
  - marker: c
    text: “使他们承受”也可译作“带领他们承受”或“使他们得那地为业”。原文动词为使役形式，表示约书亚将成为百姓取得这地为产业的执行者。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצַו אֶת־יְהוֹשֻׁעַ
  choice: 你要嘱咐约书亚
  rationale: צוה 的皮勒命令式在这里指向约书亚郑重交付责任。“嘱咐”自然保留正式告诫、委任的意味，又不把原文明确限定为某种后世任职仪式。
- source_word: וְחַזְּקֵהוּ וְאַמְּצֵהוּ
  choice: 使他刚强，鼓励他勇敢
  rationale: 两个皮勒命令式分别表达使之坚强和使之勇毅；这样译出二者互补的力量，同时符合现代汉语表达。
- source_word: כִּי הוּא יַעֲבֹר לִפְנֵי הָעָם הַזֶּה
  choice: 因为他要走在这百姓前面
  rationale: עבר 在过约旦河的语境中带有“过去、越过”的背景，而 לפני 在此也体现约书亚走在百姓前面、率领他们的角色；“走在……前面”保留空间与领导两层含义。
- source_word: וְהוּא יַנְחִיל אוֹתָם אֶת־הָאָרֶץ
  choice: 带领他们承受……那片土地
  rationale: נחל 的使役形表示约书亚将成为使百姓得着产业的执行者。“带领他们承受”以自然中文表达使役含义，又不暗示土地的最终赐予者是约书亚。
- source_word: אֲשֶׁר תִּרְאֶה
  choice: 你将要看见的
  rationale: 未完成体在此指摩西即将获准观看却不能进入的土地，未来表达最合语境。
theological_decisions:
- issue: 约书亚在百姓承受土地一事上的角色
  choice: 带领他们承受
  alternative: 使他们承受／把土地赐给他们作产业
  rationale: 原文使役形强调约书亚是百姓取得产业的执行者；译文既保留其真实的领导作用，也避免把最终赐地者的身份转移给约书亚。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“这百姓”保留申命记语境中的指示语气；“那片土地”自然对应摩西将从远处看见的特定土地。脚注标记均置于相关短语之后。
