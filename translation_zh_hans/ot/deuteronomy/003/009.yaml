  text: The Sidonians call Hermon Sirion[b][a], and the Amorites call it Senir—
translation:
  language: zh_hans
  text: 西顿人称黑门为西连[a]，亚摩利人称它为示尼珥[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “西连”是西顿人对黑门的称名。
    reason: name_clarification
  - marker: b
    text: “示尼珥”是亚摩利人对黑门的称名。
    reason: name_clarification
lexical_decisions:
- source_word: צִידֹנִים
  choice: 西顿人
  rationale: 这是复数族称，指西顿的居民；现代汉语用“西顿人”自然准确。
- source_word: יִקְרְאוּ
  choice: 称……为
  rationale: קרא 与介词 ל 连用，在此表达命名或称呼；“称……为”符合现代汉语表达。
- source_word: לְחֶרְמוֹן
  choice: 黑门
  rationale: 原文仅有地名“黑门”，本节未明说“山”，故正文不增补。
- source_word: שִׂרְיֹן
  choice: 西连
  rationale: 这是西顿人对黑门的称名，按常见中文圣经专名音译处理。
- source_word: וְהָאֱמֹרִי
  choice: 亚摩利人
  rationale: 希伯来语形式为单数族称，但在此具有集合意义，并与复数动词一致；汉语“亚摩利人”可自然表示该族群。
- source_word: יִקְרְאוּ לוֹ
  choice: 称它为
  rationale: 代词回指黑门；用“它”明确承接前文，并自然表达命名关系。
- source_word: שְׂנִיר
  choice: 示尼珥
  rationale: 这是亚摩利人对黑门的称名，采用汉语圣经中通行的音译。
