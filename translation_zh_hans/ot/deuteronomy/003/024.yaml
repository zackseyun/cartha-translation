base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/024.yaml
  text: O Lord Yahweh[a], you have begun to show your servant your greatness and your strong hand. For what god is there in heaven or on earth who can do deeds like your deeds and mighty acts like yours?
translation:
  language: zh_hans
  text: “主耶和华啊，你已经开始让你的仆人看见你的伟大和你大能的手。天上地上有哪一位神能行你所行的事，施行你这样大能的作为呢？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华啊
  rationale: אֲדֹנָי是尊称“主”，יְהוִה是神的专名；译作“主耶和华”既区分二者，也符合现代中文圣经语体。
- source_word: הַחִלּוֹתָ לְהַרְאוֹת
  choice: 你已经开始让……看见
  rationale: 保留“开始”以及使役式“让……看见”的意义，并体现这行动已经开始、仍与当前祈求相关。
- source_word: עַבְדְּךָ
  choice: 仆人
  rationale: 在摩西向神祷告、自称从属者的语境中，“仆人”自然且恰当。
- source_word: גָּדְלְךָ
  choice: 你的伟大
  rationale: 直接表达名词所指的伟大、崇高，避免把含义限缩为某一种属性。
- source_word: יָדְךָ הַחֲזָקָה
  choice: 你大能的手
  rationale: 这是描述神施展能力的惯用形象；“大能的手”在中文中自然庄重，也保留“手”的意象。
- source_word: מִי אֵל
  choice: 有哪一位神
  rationale: 保留针对任何可比神明的反问形式，不把原文的比较张力改写成直陈命题。
- source_word: בַּשָּׁמַיִם וּבָאָרֶץ
  choice: 天上地上
  rationale: 简洁自然地表达涵盖一切领域的范围。
- source_word: יַעֲשֶׂה
  choice: 能行
  rationale: 未完成式在此反问比较中带有能力或可能性的语用含义，“能行”准确传达其作用。
- source_word: כְמַעֲשֶׂיךָ וְכִגְבוּרֹתֶיךָ
  choice: 你所行的事……你这样的大能作为
  rationale: 分别呈现“作为/所行之事”和“彰显能力的行动”，并维持平行递进结构。
theological_decisions:
- issue: 复合称呼אֲדֹנָי יְהוִה中神名的译法
  choice: 主耶和华
  alternative: 主上帝；主雅威
  rationale: 原文同时包含尊称和四字神名。采用中文读者熟悉的“主耶和华”，能保留两个成分并避免将专名完全普通名词化。
- issue: מִי אֵל所涉及的神明比较
  choice: 有哪一位神……呢
  alternative: 没有神能……
  rationale: 保留原文反问，而不将其明确改写成排他性的直陈句，从而保存原文的修辞形式与神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。保留“手”的圣经意象及末句反问和平行结构；不使用生硬的逐词重复。
