  yaml_path: translation/ot/deuteronomy/003/022.yaml
  text: Do not fear them[a], for Yahweh your God is the one who fights for you.
translation:
  language: zh_hans
  text: 你们不要怕他们[a]，因为雅威——你们的上帝——为你们争战。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你们不要惧怕他们。”
    reason: “怕”与“惧怕”都可表达希伯来语动词ירא；正文采用较自然直接的“怕”，脚注保留较庄重的表达。
lexical_decisions:
- source_word: לֹא תִּירָאוּם
  choice: 你们不要怕他们
  rationale: לֹא与未完成时动词连用，在这里表达禁止；动词为第二人称阳性复数，并带第三人称阳性复数宾语后缀。译文明确保留“你们”和“他们”，同时采用现代汉语自然的劝止表达。
- source_word: כִּי
  choice: 因为
  rationale: 这里引出不可惧怕他们的理由；“因为”清楚保留其因果说明功能。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文直接呈现上帝的专名，而不以“主”这一称号代替；“雅威”是现代汉语中对该名的常见音译。
- source_word: אֱלֹהֵיכֶם
  choice: 你们的上帝
  rationale: אֱלֹהִים在此单数指以色列的上帝，词尾为第二人称阳性复数所属后缀，因此译作“你们的上帝”。
- source_word: הוּא
  choice: 亲自
  rationale: 独立代词在此具有强调作用；汉语用“亲自”自然地表达“正是他”的强调语气。
- source_word: הַנִּלְחָם לָכֶם
  choice: 为你们争战
  rationale: נלחם的分词形式描写持续或特征性的行动，לָכֶם表示受益者；“为你们争战”既贴近原文，也符合庄重、清晰的现代汉语。
theological_decisions:
- issue: 如何译出神名יְהוָה
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文使用四字神名，而非“主”的称号。采用音译“雅威”保留其作为上帝专名的性质，不以替代称谓遮蔽原文。
- issue: 如何表达הוּא的强调
  choice: 亲自为你们争战
  alternative: 他为你们争战；是为你们争战的那一位
  rationale: “亲自”在自然汉语中准确传达独立代词的强调作用，同时避免添加原文没有的行动主体或方式。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“亲自”承载原文独立代词的强调；句子保持简洁有力，符合摩西劝勉以色列人的语境。
