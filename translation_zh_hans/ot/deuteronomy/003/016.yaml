base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/016.yaml
  text: And to the Reubenites and to the Gadites I gave from Gilead as far as the Arnon Valley[a], the middle of the valley as a border, and as far as the Jabbok Valley[b], the border of the sons of Ammon.
translation:
  language: zh_hans
  text: 至于吕便人和迦得人，我把从基列直到亚嫩谷的地赐给了他们，以谷中为边界，又直到雅博谷[b]，就是亚扪子孙[a]的边界。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “亚扪子孙”也可译作“亚扪人的”。希伯来文采用亲属称谓来指亚扪这个民族。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文 נחל 可指溪流、旱溪或与之相连的谷地；这里译作“谷”，因为前文说以谷中为边界。
    reason: lexical_alternative
lexical_decisions:
- source_word: לָרֻאוּבֵנִי
  choice: 吕便人
  rationale: 该族称指吕便支派的人，并非仅指先祖吕便；“吕便人”简洁自然。
- source_word: לַגָּדִי
  choice: 迦得人
  rationale: 该族称指迦得支派的人；“迦得人”准确而符合现代汉语表达。
- source_word: נָתַתִּי
  choice: 我……赐给了他们
  rationale: 保留“给予”的基本意义；补出受词“他们”，使汉语句法清楚而不增加实质内容。
- source_word: מִן הַגִּלְעָד
  choice: 从基列
  rationale: 表达领地范围的起点，不额外限定为山区。
- source_word: עַד נַחַל אַרְנֹן
  choice: 直到亚嫩谷
  rationale: נחל可指溪流、旱溪或相关谷地；下文以谷中为界，因此正文采用“谷”。
- source_word: תּוֹךְ הַנַּחַל וּגְבֻל
  choice: 以谷中为边界
  rationale: תוך指内部或中间；结合疆界语境，译作“以谷中为边界”自然且保留界线位于谷中的含义。
- source_word: עַד יַבֹּק הַנַּחַל
  choice: 直到雅博谷
  rationale: 与前一处נחל一致译作“谷”，同时在脚注中保留其水道语义范围。
- source_word: גְּבוּל בְּנֵי עַמּוֹן
  choice: 亚扪子孙的边界
  rationale: 保留希伯来文的亲属称谓“子孙”，不将其直接平化为族名。
theological_decisions: []
