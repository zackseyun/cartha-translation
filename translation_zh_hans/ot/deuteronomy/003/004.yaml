base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/004.yaml
  text: 'And we captured all his cities at that time; there was not a city that we did not take from them: sixty cities[a], all the region of Argob, the kingdom of Og in Bashan.'
translation:
  language: zh_hans
  text: 那时，我们攻取了他的所有城邑；没有一座城不是我们从他们手中夺取的[a]：共六十座城，就是亚珥歌伯全境，巴珊噩王的国。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文作复数“他们”，可能指噩的百姓或军队，并非只指噩一人。
    reason: 说明希伯来文复数代词的所指，避免读者误以为原文是单数。
lexical_decisions:
- source_word: וַנִּלְכֹּד
  choice: 攻取
  rationale: לכד在这里指战争中夺取城邑；“攻取”既保留军事语境，也符合现代汉语叙事用语。
- source_word: כָּל עָרָיו
  choice: 他的所有城邑
  rationale: עיר可指城或城镇；“城邑”语体庄重且能涵盖不同规模的聚居地，代词“他的”指噩。
- source_word: בָּעֵת הַהִוא
  choice: 那时
  rationale: 准确表达常见时间短语，简洁自然。
- source_word: לֹא הָיְתָה קִרְיָה אֲשֶׁר לֹא לָקַחְנוּ מֵאִתָּם
  choice: 没有一座城是我们没有从他们手中夺取的
  rationale: 保留原文双重否定所形成的强调，也保留“从他们”这一复数表达。
- source_word: מֵאִתָּם
  choice: 从他们手中
  rationale: 原文代词后缀为复数；“从他们手中”自然表达征服语境中的夺取关系，不把复数改成单数的噩。
- source_word: שִׁשִּׁים עִיר
  choice: 共六十座城
  rationale: “共”自然承接前句对全部城邑的概括，数目按原文直译。
- source_word: כָּל חֶבֶל אַרְגֹּב
  choice: 遍及亚珥歌伯全境
  rationale: חבל在此指地区或区域；“全境”清楚表达其整体范围，“遍及”使其与六十座城的关系在汉语中自然。
- source_word: מַמְלֶכֶת עוֹג בַּבָּשָׁן
  choice: 噩在巴珊的王国
  rationale: 保留噩、巴珊与王国之间的从属和地域关系，并以现代汉语可理解的结构表达。
