base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/012.yaml
  text: And we took possession of this land at that time[a], from Aroer, which is on the Valley of the Arnon, and half the hill country of Gilead with its cities[b]; I gave it to the Reubenites and the Gadites.
translation:
  language: zh_hans
  text: 那时，我们占领了这片土地：从亚嫩谷旁的亚罗珥起，包括基列山区的一半及其城邑；我把这地给了吕便人和迦得人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יָרַשְׁנוּ
  choice: 我们占领了
  rationale: 在征服并取得领土的语境中，ירשׁ 表示实际取得并占有，不宜译成较被动的“继承”。
- source_word: הָאָרֶץ הַזֹּאת
  choice: 这片土地
  rationale: 指前述被征服并分配的地域；“这片土地”自然清楚。
- source_word: בָּעֵת הַהִוא
  choice: 那时
  rationale: 简洁、自然地表达标准时间短语。
- source_word: מֵעֲרֹעֵר אֲשֶׁר עַל נַחַל אַרְנֹן
  choice: 从亚嫩谷旁的亚罗珥起
  rationale: 保留亚罗珥与亚嫩谷的地理关系；介词 עַל 在这里自然译作“旁”，נחל 按地貌译作“谷”。
- source_word: וַחֲצִי הַר הַגִּלְעָד
  choice: 包括基列山区的一半
  rationale: הַר 在领土描述中可指山地或山区，而非必指一座名为“基列山”的单独山峰。补出“包括”使中文疆域范围结构清楚。
- source_word: וְעָרָיו
  choice: 及其城邑
  rationale: 代词后缀回指基列山区；“城邑”符合庄重的地理与领土叙述语体。
- source_word: נָתַתִּי
  choice: 我把这地给了
  rationale: 保留从复数“我们”转为摩西单数“我”的人称变化；补出“这地”以明确受事对象。
- source_word: לָרֻאוּבֵנִי וְלַגָּדִי
  choice: 给了吕便人和迦得人
  rationale: 两个单数族称在此作集合意义，指吕便和迦得两个支派的人。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“占领”体现征服语境中的主动取得；“基列山区”保留 הַר 作为地域名称的广义用法。原文此处没有必须以脚注呈现、且会实质影响理解的异文或神学歧义。
