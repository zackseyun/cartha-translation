  text: כָּל אֵ֜לֶּה עָרִ֧ים בְּצֻר֛וֹת חוֹמָ֥ה גְבֹהָ֖ה דְּלָתַ֣יִם וּ/בְרִ֑יחַ לְ/בַ֛ד מֵ/עָרֵ֥י הַ/פְּרָזִ֖י הַרְבֵּ֥ה מְאֹֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/005.yaml
  text: All these were fortified cities with a high wall, double doors, and bars, besides a great many rural towns.
translation:
  language: zh_hans
  text: 这些全是坚固城，有高墙、双扇城门和门闩；此外，还有许许多多没有城墙的城镇。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“乡野中的村镇”或“没有设防的城镇”。希伯来文把这些聚落与刚才所说的坚固城相对照。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּצֻרוֹת
  choice: 坚固城
  rationale: 该词指经过防御工事加固、能抵御攻击的城；“坚固城”自然简洁，也符合本节军事地理语境。
- source_word: חוֹמָה גְבֹהָה
  choice: 高墙
  rationale: 希伯来文为单数“墙”，在此作整体性描述；中文“高墙”既保留形式，也表达城防设施。
- source_word: דְּלָתַיִם
  choice: 双扇城门
  rationale: 该词是双数形式，指一对门扇；结合随后提到的门闩，译作“双扇城门”既保留双数意味，也明确是城的入口。
- source_word: וּבְרִיחַ
  choice: 和门闩
  rationale: 该词形式上为单数，可在这类城防清单中作集合性表达；中文“门闩”无需强行标明单复数，并与城门自然搭配。
- source_word: לְבַד
  choice: 此外，还有
  rationale: 此处表示在上述坚固城以外另有其他聚落；“此外，还有”清楚表达附加关系。
- source_word: מֵעָרֵי הַפְּרָזִי
  choice: 没有城墙的城镇
  rationale: 该短语指开放乡野中的聚落，与前述有防御工事的城形成对照；“没有城墙的城镇”把语境中的核心对比直接传达出来，同时用脚注保留其他可能表达。
- source_word: הַרְבֵּה מְאֹד
  choice: 许许多多
  rationale: 原文以强化副词突出数量极多；“许许多多”是自然现代汉语，保留强调语气。
- source_word: כָּל אֵלֶּה עָרִים
  choice: 这些全是……城
  rationale: 希伯来文没有明写系词；中文补出“是”，并用“全”保留原文“这些全部”的强调。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而通俗的叙述语体。“双扇城门”保留希伯来文双数形式；“高墙”和“门闩”则顺应中文不强制标示单复数的表达习惯。脚注说明 עָרֵי הַפְּרָזִי 的词义范围，避免把“没有城墙”当作唯一可能的词典释义。
