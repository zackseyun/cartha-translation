  yaml_path: translation/ot/deuteronomy/003/019.yaml
  text: Only your wives[a], your little ones, and your livestock—I know that you have much livestock—shall remain in your towns that I have given you[b],
translation:
  language: zh_hans
  text: 只有你们的妻子、孩子[a]和牲畜——我知道你们有很多牲畜——要留在我赐给你们的城镇[b]里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “孩子”也可译作“幼小的孩子”。希伯来语该词主要指年幼的孩子，按语境也可包括受照顾的家属。
    reason: lexical_alternative
  - marker: b
    text: “城镇”也可译作“城邑”或“城市”。希伯来语该词可指规模不等的聚落。
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: 只有
  rationale: 保留限制和例外的语气，承接上文对作战人员的命令。
- source_word: נְשֵׁיכֶם
  choice: 你们的妻子
  rationale: 此处列举留在后方的家庭成员，译作“妻子”比宽泛的“妇女”更符合语境。
- source_word: טַפְּכֶם
  choice: 孩子
  rationale: 该词指幼小的孩子，也可涵盖受抚养者；正文用现代汉语自然的“孩子”，脚注说明其范围。
- source_word: מִקְנֵיכֶם / מִקְנֶה רַב
  choice: 牲畜／很多牲畜
  rationale: 泛指家养牲畜，并非仅指牛；重复“牲畜”也保留希伯来文的重复。
- source_word: יָדַעְתִּי כִּי
  choice: 我知道
  rationale: 直接保留第一人称陈述；破折号使其解释性插语的功能清楚可见。
- source_word: יֵשְׁבוּ
  choice: 可以留在
  rationale: 字面可指坐、居住；在此与过河作战相对，语境重点是留在后方。“可以”自然表达此处命令中的准许性例外。
- source_word: בְּעָרֵיכֶם
  choice: 在……城镇里
  rationale: עִיר可指规模不一的有组织聚落；“城镇”避免把规模限定为大型城市。
- source_word: אֲשֶׁר נָתַתִּי לָכֶם
  choice: 我赐给你们的
  rationale: 动词完成式表示已经赐予、现归他们所有；“赐”符合土地由上帝授予的语境。
