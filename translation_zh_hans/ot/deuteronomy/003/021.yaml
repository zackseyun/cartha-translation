  text: וְ/אֶת יְהוֹשׁ֣וּעַ צִוֵּ֔יתִי בָּ/עֵ֥ת הַ/הִ֖וא לֵ/אמֹ֑ר עֵינֶ֣י/ךָ הָ/רֹאֹ֗ת אֵת֩ כָּל אֲשֶׁ֨ר עָשָׂ֜ה יְהוָ֤ה אֱלֹהֵי/כֶם֙ לִ/שְׁנֵי֙ הַ/מְּלָכִ֣ים הָ/אֵ֔לֶּה כֵּֽן יַעֲשֶׂ֤ה יְהוָה֙ לְ/כָל הַ/מַּמְלָכ֔וֹת אֲשֶׁ֥ר אַתָּ֖ה עֹבֵ֥ר שָֽׁמָּ/ה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/021.yaml
  text: And I commanded Joshua at that time[a], saying, ‘Your eyes have seen all that Yahweh your God did to these two kings; so Yahweh will do to all the kingdoms through which you are passing.’
translation:
  language: zh_hans
  text: 那时，我吩咐约书亚说：“你亲眼看见了雅威你们的上帝对这两个王所做的一切；雅威也必照样对待你将要渡河前往的各王国[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “你将要渡河前往的各王国”：原文较直译为“你正渡往那里的各王国”。“渡”在此可呼应渡过约旦河的语境；“那里”指向将要进入之地。
    reason: 说明希伯来语עֹבֵר שָׁמָּה的空间表达，并明确关系从句修饰“各王国”。
lexical_decisions:
- source_word: וְאֶת יְהוֹשׁוּעַ צִוֵּיתִי
  choice: 我吩咐约书亚
  rationale: צוה表示带有权威的命令或嘱咐；“吩咐”在现代汉语中自然、庄重，也符合摩西对约书亚发出指示的语境。
- source_word: בָּעֵת הַהִוא לֵאמֹר
  choice: 那时……说
  rationale: “那时”自然对应标准时间短语；保留“说”以体现希伯来语引出直接引语的公式，同时避免生硬的“吩咐……说道”。
- source_word: עֵינֶיךָ הָרֹאֹת
  choice: 你亲眼看见了
  rationale: 原文以“你的眼睛”构成强调；汉语“亲眼看见”自然保留约书亚亲身见证的强调意味。
- source_word: יְהוָה אֱלֹהֵיכֶם
  choice: 雅威你们的上帝
  rationale: 以“雅威”音译圣名；后缀是第二人称复数，因此保留“你们的”，反映雅威不仅是约书亚个人的上帝，也是以色列全体的上帝。
- source_word: לִשְׁנֵי הַמְּלָכִים הָאֵלֶּה
  choice: 向这两个王
  rationale: ל在此标示行动所针对的对象；“向……所做的”保持原文措辞的开放性，不额外明说“击败”或“毁灭”。
- source_word: כֵּן יַעֲשֶׂה יְהוָה
  choice: 雅威也必照样对待
  rationale: כֵּן明确建立类比；“照样”保留前后行动的对应关系，“必”表达未完成式在此语境中的将来确定性。
- source_word: אֲשֶׁר אַתָּה עֹבֵר שָׁמָּה
  choice: 你将要渡河前往之地的
  rationale: עבר在申命记语境中带有渡过约旦河的意味，שָׁמָּה表示朝向目的地；此译法既保留渡河意象，又比逐字译为“你正渡到那里”更符合现代汉语。
theological_decisions:
- issue: 神圣名号 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；“雅威”较直接地反映其通常重构的发音，并避免以称号取代专名。
- issue: אֱלֹהֵיכֶם 中复数领属后缀的处理
  choice: 你们的上帝
  alternative: 你的上帝
  rationale: 说话对象约书亚是单数，但原文领属后缀明确为第二人称复数，指雅威是以色列群体的上帝；故保留数的张力，不按汉语习惯静默统一为单数。
- issue: 雅威将如何对待各王国
  choice: 照样对待
  alternative: 照样毁灭；照样击败
  rationale: 上下文表明行动带有审判和征服性质，但本节动词仅为一般性的“做”；译文不把语境推断直接写入动词，以保留原文的概括表达。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“亲眼看见”传达原文强调；“渡河前往之地”使约旦河意象自然可闻。保留约书亚所受单数称呼与“你们的上帝”复数领属之间的原文变化。
