  text: וַ/נִּקַּ֞ח בָּ/עֵ֤ת הַ/הִוא֙ אֶת הָ/אָ֔רֶץ מִ/יַּ֗ד שְׁנֵי֙ מַלְכֵ֣י הָ/אֱמֹרִ֔י אֲשֶׁ֖ר בְּ/עֵ֣בֶר הַ/יַּרְדֵּ֑ן מִ/נַּ֥חַל אַרְנֹ֖ן עַד הַ֥ר חֶרְמֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/008.yaml
  text: And at that time we took the land from the hand of the two kings of the Amorites who were beyond the Jordan[a], from the Wadi Arnon as far as Mount Hermon.
translation:
  language: zh_hans
  text: 那时，我们从约旦河对岸的两个亚摩利王手中取得了那片土地，从亚嫩河谷[a]直到黑门山。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “亚嫩河谷”或译“亚嫩溪谷”或“亚嫩河”；希伯来语נחל可指河谷、溪谷、河床或其中的水流。
    reason: 保留נחל在地貌与水体指称上的词义弹性，避免断定它专指常年河流。
lexical_decisions:
- source_word: וַנִּקַּח
  choice: 我们……取得了
  rationale: 该词是לקח的第一人称复数叙事形式，表示以色列人取得这片土地；“取得”自然、庄重，又不额外强化“攻占”或“抢夺”的军事色彩。
- source_word: בָּעֵת הַהִוא
  choice: 那时
  rationale: 这是常见的时间表达；“那时”符合现代汉语叙事习惯，并准确承接上文。
- source_word: הָאָרֶץ
  choice: 那片土地
  rationale: 此处指从两位亚摩利王手中取得的特定地域；“那片土地”清楚表达其特指性质，而不误解为全地或世界。
- source_word: מִיַּד
  choice: 从……手中
  rationale: 保留希伯来语“从手中”的惯用意象，表示从某人的占有或控制之下取得；现代汉语也能自然理解。
- source_word: שְׁנֵי מַלְכֵי הָאֱמֹרִי
  choice: 两个亚摩利王
  rationale: 准确表达两个属于亚摩利人的王；措辞简洁自然。
- source_word: אֲשֶׁר בְּעֵבֶר הַיַּרְדֵּן
  choice: 约旦河对岸的
  rationale: 该地理短语从叙述视角表示约旦河另一边；“对岸”保留相对空间视角，避免在正文中直接解释为“东岸”。
- source_word: מִנַּחַל אַרְנֹן
  choice: 从亚嫩河谷
  rationale: נחל可指季节性水道、溪谷或河谷；结合当地地貌，“河谷”是普通读者易懂且不过度限定水流常年性的译法，并以脚注保留其他可能。
- source_word: עַד הַר חֶרְמוֹן
  choice: 直到黑门山
  rationale: עַד标明地域延伸的界限；“直到”清楚表达范围，黑门山采用通行中文地名。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。保留“从……手中”的源语意象，并用“约旦河对岸”维持原文的相对地理表达；专名采用中文圣经中常见的“亚摩利、约旦河、亚嫩、黑门山”。
