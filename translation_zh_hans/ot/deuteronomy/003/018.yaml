  text: וָ/אֲצַ֣ו אֶתְ/כֶ֔ם בָּ/עֵ֥ת הַ/הִ֖וא לֵ/אמֹ֑ר יְהוָ֣ה אֱלֹהֵי/כֶ֗ם נָתַ֨ן לָ/כֶ֜ם אֶת הָ/אָ֤רֶץ הַ/זֹּאת֙ לְ/רִשְׁתָּ֔/הּ חֲלוּצִ֣ים תַּֽעַבְר֗וּ לִ/פְנֵ֛י אֲחֵי/כֶ֥ם בְּנֵֽי יִשְׂרָאֵ֖ל כָּל בְּנֵי חָֽיִל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/018.yaml
  text: And I commanded you at that time[a], saying, ‘Yahweh your God has given you this land to possess. You shall cross over armed before your brothers[c][b], the sons of Israel—all the men of valor.’
translation:
  language: zh_hans
  text: 那时，我吩咐你们说：“雅威——你们的上帝——已经把这片土地赐给你们，使你们得以占有。你们所有能征战的人[c]都要全副武装[b]，在你们的弟兄——以色列人[a]——前面渡过去。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“你们的以色列同胞”。希伯来文直译为“你们的弟兄，以色列的众子”。
    reason: lexical_alternative
  - marker: b
    text: “全副武装”也可译作“装备好作战”。
    reason: lexical_alternative
  - marker: c
    text: “能征战的人”指有能力上阵作战的男子，并非仅指内心勇敢的人。
    reason: cultural_note
lexical_decisions:
- source_word: וָאֲצַו
  choice: 我吩咐
  rationale: צוה表示下达命令；“吩咐”在摩西对百姓的正式讲话中自然、庄重，并保留命令的力度。
- source_word: בָּעֵת הַהִוא
  choice: 那时
  rationale: 这是常见的时间表达；“那时”简洁地承接前文叙事。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文四字神名 YHWH 的通行拟音译出专名，而不以“主”这一称号替代。
- source_word: אֱלֹהֵיכֶם
  choice: 你们的上帝
  rationale: 准确表达复数第二人称领属形式。
- source_word: נָתַן לָכֶם
  choice: 已经把……赐给你们
  rationale: 完成式表示赐地之举已经成就，并对当前命令仍具效力；“赐给”也符合土地由上帝授予的语境。
- source_word: הָאָרֶץ הַזֹּאת
  choice: 这片土地
  rationale: אֶרֶץ在这里指约旦河东的地域；“这片土地”比单说“这地”更符合现代汉语。
- source_word: לְרִשְׁתָּהּ
  choice: 让你们占有它
  rationale: ירשׁ在此指取得并持有土地；保留宾语“它”，清楚对应希伯来文的阴性单数后缀。
- source_word: חֲלוּצִים
  choice: 武装起来
  rationale: 该词描述为军事行动装备妥当的状态；“武装起来”清楚自然，另以脚注保留“装备好作战”的可能表达。
- source_word: תַּעַבְרוּ לִפְנֵי
  choice: 走在……前面
  rationale: 在过河出战的语境中，意为先于其余以色列人渡过去；汉语如此表达比逐字译作“在……前面过去”自然。
- source_word: אֲחֵיכֶם בְּנֵי יִשְׂרָאֵל
  choice: 你们的弟兄，也就是以色列人
  rationale: 保留“弟兄”的亲属称谓，并将“以色列的众子”按其同位说明关系自然译为“以色列人”。
- source_word: כָּל בְּנֵי חָיִל
  choice: 你们所有能征战的人
  rationale: בְּנֵי חָיִל在军事语境中指有能力出战的战士，不只是内心勇敢的人。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。采用“雅威”是对较可能读音 Yahweh 的现代汉语拟音，可保留其作为专名的性质；不以称号“主”取代。
- issue: אֲחֵיכֶם 与 בְּנֵי יִשְׂרָאֵל 的性别及群体指向
  choice: 你们的弟兄，也就是以色列人
  alternative: 你们的同胞以色列人
  rationale: 原文以阳性亲属词“弟兄”和“以色列的众子”称呼他们的同族；正文保留“弟兄”，同时用“以色列人”自然说明所指群体，脚注给出较意译的选择。
- issue: כָּל בְּנֵי חָיִל 的含义
  choice: 你们所有能征战的人
  alternative: 所有勇士
  rationale: 上下文是武装渡河参战，因此重点是具备作战能力，而非泛指品格上的勇敢；此译法避免把军事含义弱化。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“吩咐”“赐给”“占有”等词保留申命记讲话的正式感；破折号标出“你们的上帝”对“雅威”的同位说明。正文依希伯来文的军事语境重组语序，使“所有能征战的人”明确成为命令所针对的群体，同时不消除“弟兄／以色列人”的原文表达。
