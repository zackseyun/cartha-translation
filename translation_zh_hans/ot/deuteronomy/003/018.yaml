revisions:
- from: 那时，我吩咐你们说：“雅威——你们的上帝——已经把这片土地赐给你们，让你们占有它。你们所有能征战的人[c]都要武装起来[b]，走在你们的弟兄，也就是以色列人[a]前面。”
  to: 那时，我吩咐你们说：“雅威——你们的上帝——已经把这片土地赐给你们，使你们得以占有。你们所有能征战的人[c]都要全副武装[b]，在你们的弟兄——以色列人[a]——前面渡过去。”
  rationale: 修订恢复了“渡过去”这一原文动词的核心意义，并以“全副武装”准确表达已作战备的状态。将赐地目的改为“使你们得以占有”，使汉语更自然，同时保留原文的目的不定式及土地的阴性单数指代。脚注锚点仍分别对应“以色列人”“全副武装”和“能征战的人”。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T04:57:13Z'
review_pass:
  verdict: revise
  source_fidelity: 译文基本忠实于希伯来文：保留了雅威之名、赐地及占有土地的目的，以及受命者须在同胞之前行动的军事语境。但“走在……前面”没有表达 תַּעַבְרוּ（渡过／越过）的动作；“武装起来”也较像临时开始武装的命令，不如表达 חֲלוּצִים 所指的整装备战状态准确。
  naturalness: 原文整体通顺、庄重。修订以“全副武装”和“渡过去”使现代汉语更自然，并恢复原文明确的越过行动。
  terminology: “雅威”“上帝”“弟兄”“以色列人”均合宜。“能征战的人”准确传达 בְּנֵי חָיִל 在此处指适于作战的男子；脚注应继续说明这一点，避免理解为单指内在勇气。
  issues:
  - severity: medium
    issue: “走在……前面”遗漏“渡过／越过”的动作。
    rationale: תַּעַבְרוּ 是“你们要渡过／越过”；לִפְנֵי 才表示在弟兄之前。仅译为“走在前面”弱化了命令中的过境行动。
  - severity: low
    issue: “武装起来”可被理解为开始进行武装。
    rationale: חֲלוּצִים 描述已整备、可投入战斗的状态；“全副武装”更贴合其军事语境。
  - severity: low
    issue: “让你们占有它”在汉语中略显口语化且“它”指代较生硬。
    rationale: לְרִשְׁתָּהּ 表示赐地的目的，即使他们取得并拥有该地；“使你们得以占有”更庄重自然，且不改变语义。
