base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/027.yaml
  text: Go up to the top of Pisgah[a], and lift up your eyes westward and northward and southward and eastward, and see with your eyes[b]; for you shall not cross this Jordan.
translation:
  language: zh_hans
  text: 你要登上毗斯迦山顶，举目向西、向北、向南、向东观看，要亲眼看；因为你不能渡过这约旦河。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֲלֵה
  choice: 你要上到
  rationale: 这是עלה的Qal祈使式，表示向上登行；“上到”在现代汉语中自然，并保留目的地导向。
- source_word: רֹאשׁ הַפִּסְגָּה
  choice: 毗斯迦山顶
  rationale: רֹאשׁ指顶部、顶峰；הַפִּסְגָּה在此是地名“毗斯迦”。补出“山”符合汉语地理名称习惯，也清楚表达所指高处。
- source_word: וְשָׂא עֵינֶיךָ
  choice: 举目
  rationale: 希伯来语字面为“举起你的眼睛”，是把视线投向远处的惯用语；“举目”简洁、庄重，也保留原文的文学色彩。
- source_word: יָמָּה וְצָפֹנָה וְתֵימָנָה וּמִזְרָחָה
  choice: 向西、向北、向南、向东
  rationale: 四个词都是带方向词尾的形式。יָמָּה字面与“海”有关，但在以色列地理语境中惯指西方；按罗列次序译出四方。
- source_word: וּרְאֵה בְעֵינֶיךָ
  choice: 观看，亲眼看清楚
  rationale: 原文在“举目”之后再次提到“用你的眼睛看”，具有强调作用；“亲眼”保留强调，“看清楚”自然表达仔细观看之意，而不删去重复所传达的力度。
- source_word: כִּי לֹא תַעֲבֹר
  choice: 因为你必不能渡过
  rationale: כִּי在这里说明命令的理由；未完成式配否定表达确定的未来禁限或结果。“必不能”传达其确定性，但不额外说明原因。
- source_word: אֶת הַיַּרְדֵּן הַזֶּה
  choice: 这约旦河
  rationale: 保留指示词הַזֶּה“这”。“约旦河”是现代汉语中自然且明确的地名表达，虽希伯来语只说“约旦”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留四个方向的原有次序，并通过“举目……亲眼”再现原文对视觉动作的重复强调。无需脚注；英文咨询层所列脚注标记似有错位，其内容均可直接在中文正文中清楚表达。
