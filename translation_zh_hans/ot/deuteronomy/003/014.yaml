base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/014.yaml
  text: Jair son of Manasseh took all the region of Argob[a], as far as the border of the Geshurites and the Maacathites, and he called them, that is, Bashan, Havvoth-jair[b], to this day.
translation:
  language: zh_hans
  text: 玛拿西的儿子睚珥夺取了亚珥歌伯全境，直到基述人和玛迦人的边界；他按自己的名字，把那些地方——即巴珊——命名为“睚珥村”[a]，这名称沿用至今。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “睚珥村”也可译作“睚珥的村落”或“睚珥的帐篷聚落”。
    reason: lexical_alternative
  - marker: b
    text: 原文在“巴珊”与“睚珥村”之间的句法关系十分紧凑，也可较直译为：“他按自己的名字称它们为巴珊的睚珥村。”
    reason: alternative_reading
lexical_decisions:
- source_word: יָאִיר בֶּן מְנַשֶּׁה
  choice: 玛拿西的儿子睚珥
  rationale: 按希伯来语亲属结构直译，并采用中文圣经地名、人名的通行译法。
- source_word: חֶבֶל אַרְגֹּב
  choice: 亚珥歌伯全境
  rationale: חֶבֶל在此指一片有界限的地域；“全境”自然地表达כָּל所涵盖的整个区域。
- source_word: עַד גְּבוּל הַגְּשׁוּרִי וְהַמַּעֲכָתִי
  choice: 直到基述人和玛迦人的边界
  rationale: גְּבוּל指边界；两个族称按人群表达，同时保留原文对共同边界的简洁说法。
- source_word: וַיִּקְרָא אֹתָם עַל שְׁמוֹ
  choice: 他以自己的名字给那些地方……起名
  rationale: 保留复数宾语“他们/它们”的语义，以“那些地方”使现代中文清楚；עַל שְׁמוֹ表达按自己的名字命名。
- source_word: אֶת הַבָּשָׁן
  choice: 就是巴珊
  rationale: 原文句法压缩且不易确定；正文采用同位说明，避免把它武断地改成地点介词结构，另以脚注提示歧义。
- source_word: חַוֹּת יָאִיר
  choice: 睚珥村
  rationale: 该地名的构词意义约为“睚珥的村落/聚落”；采用兼具专名功能和可理解性的中文译名。
- source_word: עַד הַיּוֹם הַזֶּה
  choice: 这名称沿用至今
  rationale: 自然表达该名称一直存续到叙述者当时的含义。
