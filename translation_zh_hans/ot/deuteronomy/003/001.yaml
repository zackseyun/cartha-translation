base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/001.yaml
  text: Then we turned and went up by the way of Bashan[a], and Og king of Bashan came out to meet us, he and all his people, for battle at Edrei.
translation:
  language: zh_hans
  text: 随后，我们转向，沿着巴珊的路上去[a]。巴珊王噩，他和他的全体人民，都出来迎着我们，要在以得来交战。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“沿着通往巴珊的路”。希伯来文直译为“巴珊的路”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנֵּפֶן
  choice: 后来，我们转向
  rationale: פנה在连续叙事中表示“转向”；用“后来”自然体现叙事推进，又避免机械重复“于是”。
- source_word: וַנַּעַל
  choice: 上去
  rationale: עלה保留“上行、上去”的方向意味；现代汉语中“上去”自然清楚。
- source_word: דֶּרֶךְ הַבָּשָׁן
  choice: 巴珊的路
  rationale: 直译为“巴珊之路”，可指通往或经过巴珊的路线；正文保留原文关系的含混，脚注说明另一种理解。
- source_word: וַיֵּצֵא
  choice: 出来
  rationale: יצא本义为“出去、出来”；上下文已经明确是交战，无须增译为“率军出战”。
- source_word: עוֹג מֶלֶךְ הַבָּשָׁן
  choice: 巴珊王噩
  rationale: 按现代汉语名号次序表达，并采用中文圣经传统中常见的人名、地名译写。
- source_word: לִקְרָאתֵנוּ
  choice: 迎战我们
  rationale: 该表达本义是“来迎接/迎面而来”，但紧接着的לַמִּלְחָמָה明确限定为军事相遇；“迎战”在汉语中简洁自然地合并表达两者。
- source_word: הוּא וְכָל־עַמּוֹ
  choice: 他和他的全体人民
  rationale: עם本义宽泛地指“人民、民众”；虽处战争语境，仍不擅自缩窄为“军队”。
- source_word: לַמִּלְחָמָה
  choice: 交战
  rationale: מלחמה可指战争或战斗；此处是一次具体军事遭遇，用“交战”符合语境。
- source_word: אֶדְרֶעִי
  choice: 在以得来
  rationale: 原文地名无显明介词，在句末作地点性成分；汉语补出“在”以清楚表达交战地点。
theological_decisions: []
