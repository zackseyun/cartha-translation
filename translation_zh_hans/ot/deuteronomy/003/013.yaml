  text: וְ/יֶ֨תֶר הַ/גִּלְעָ֤ד וְ/כָל הַ/בָּשָׁן֙ מַמְלֶ֣כֶת ע֔וֹג נָתַ֕תִּי לַ/חֲצִ֖י שֵׁ֣בֶט הַֽ/מְנַשֶּׁ֑ה כֹּ֣ל חֶ֤בֶל הָֽ/אַרְגֹּב֙ לְ/כָל הַ/בָּשָׁ֔ן הַ/ה֥וּא יִקָּרֵ֖א אֶ֥רֶץ רְפָאִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/013.yaml
  text: And the rest of Gilead[a], and all Bashan, the kingdom of Og, I gave to the half-tribe of Manasseh—all the region of Argob, that is, all Bashan. That is called the land of the Rephaim.
translation:
  language: zh_hans
  text: 基列其余的地方和巴珊全境，就是噩的国，我都给了玛拿西支派的一半；亚珥歌伯全境，也就是巴珊全境，那一带被称为利乏音人之地[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 传统上也译作“巨人之地”。“利乏音”是希伯来语中一个古代族群的名称，这一族群与该地区有关。
    reason: 保留 רְפָאִים 的传统解释性译法，同时说明正文音译所指。
lexical_decisions:
- source_word: יֶתֶר הַגִּלְעָד
  choice: 基列其余的地方
  rationale: 表达此前分配之后余下的基列地区；补出“地方”使现代汉语自然，同时不增添新的地理含义。
- source_word: כָל הַבָּשָׁן
  choice: 巴珊全境
  rationale: “全境”准确传达 כָל 的整体范围，也符合汉语地理叙述习惯。
- source_word: מַמְלֶכֶת עוֹג
  choice: 噩的国
  rationale: 直接保留原文的政治地域称谓和属格关系。
- source_word: נָתַתִּי
  choice: 我都给了
  rationale: 采用常用动词“给”，保留第一人称和完成体；“都”承接前列的两片地域，并未将说话者误释为上帝。
- source_word: לַחֲצִי שֵׁבֶט הַמְנַשֶּׁה
  choice: 玛拿西半个支派
  rationale: 清楚表达玛拿西支派的一半，符合约旦河东分地的语境。
- source_word: כֹּל חֶבֶל הָאַרְגֹּב
  choice: 亚珥歌伯全境
  rationale: חֶבֶל 在这里指地域、地区，而非字面的绳索；“全境”简洁且与地理语境相称。
- source_word: לְכָל הַבָּשָׁן
  choice: 也就是巴珊全境
  rationale: 按上下文将该短语理解为同位说明，使亚珥歌伯地区与这里所说的巴珊范围相联系；“也就是”自然呈现这一解释关系。
- source_word: יִקָּרֵא
  choice: 称为
  rationale: 未标定过去或现在时，保留希伯来语未完成式被动所表达的惯常名称，避免在汉语中不必要地限定时间。
- source_word: אֶרֶץ רְפָאִים
  choice: 利乏音人之地
  rationale: 将 רְפָאִים 作为族群名称音译，并用“人”明确其族称功能；不在正文中直接采用解释性较强的“巨人”。
theological_decisions:
- issue: רְפָאִים 应音译为族名，还是解释为“巨人”
  choice: 利乏音人之地
  alternative: 巨人之地
  rationale: 本节中该词作为古代族群名称使用。正文音译能保留原文的词汇透明度，不把传统解释直接写入经文；传统译法则列入脚注，以保存其释义可能性。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“就是”说明“巴珊全境”与“噩的国”的同位关系；分号划分土地授予与亚珥歌伯别称两层信息。脚注标记紧随“利乏音人之地”，与注释对象准确对应。
