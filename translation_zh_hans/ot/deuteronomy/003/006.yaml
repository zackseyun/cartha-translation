base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/006.yaml
  text: And we devoted them to destruction[a], just as we had done to Sihon king of Heshbon, utterly destroying every city—men, women, and little ones.
translation:
  language: zh_hans
  text: 我们将他们交付毁灭[a]，正如我们从前对希实本的王西宏所做的那样：把每一座城及其中的男人、女人和幼儿全都彻底毁灭。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“把他们置于禁毁之下”。希伯来语使用动词חרם，这是一个专门用语，指把某物或某人划归为必须毁灭的对象。
    reason: 说明חרם的技术含义，并提供较直译的另一种表达。
lexical_decisions:
- source_word: וַנַּחֲרֵם
  choice: 我们把他们归于毁灭
  rationale: חרם的使役词形在这里是战争语境中的专门用语，指把人或物划归为必须毁灭之物。“归于毁灭”既保留其技术含义，也不把它淡化为一般的“打败”或“消灭”。
- source_word: כַּאֲשֶׁר עָשִׂינוּ
  choice: 正如从前……所做的一样
  rationale: 该比较从句回指先前对西宏采取的行动；“从前”自然表达叙事中的回顾关系。
- source_word: לְסִיחֹן מֶלֶךְ חֶשְׁבּוֹן
  choice: 对希实本王西宏
  rationale: 介词ל在עָשָׂה之后标明行动所针对的对象，现代汉语用“对……所做的”最为自然。
- source_word: הַחֲרֵם
  choice: 彻底毁灭
  rationale: 不定式绝对式加强并具体说明前面的חרם行动；“彻底”体现其强调和全面性。
- source_word: כָּל עִיר
  choice: 每座城
  rationale: עִיר可指城或城镇；“每座城”准确而符合本段征战叙事的语体。
- source_word: מְתִם
  choice: 男人
  rationale: 此处该名词指男性，与后面的女人和幼儿并列，构成所毁灭人群的三项列举；因此不把它改写成修饰“城”的“有人居住的”。
- source_word: הַנָּשִׁים
  choice: 女人
  rationale: 按其通常词义直译，并与“男人、幼儿”形成清楚的并列。
- source_word: וְהַטָּף
  choice: 和幼儿
  rationale: טף通常指年幼的孩子或受抚养者；“幼儿”比宽泛的“孩子”更突出其年幼含义。
theological_decisions:
- issue: 战争审判语境中חרם的译法
  choice: 主句译为“归于毁灭”，后面的强调形式译为“彻底毁灭”
  alternative: “完全消灭他们”或“把他们置于禁毁之下”
  rationale: 经文所说的是חרם之下的全面毁灭。译文既不能缓和其严酷性，也不应抹去这个专门术语的献归或划归含义。“归于毁灭”兼顾技术含义与现代可懂性，脚注则保留“置于禁毁之下”这一较直译的说法。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“归于毁灭”保留原文术语的特殊意味；分号后的“彻底毁灭”自然呈现希伯来语的强调结构。保留“男人、女人和幼儿”的三项并列，不将מְתִם处理为“有人居住的”。
