  yaml_path: translation/ot/deuteronomy/003/007.yaml
  text: But all the livestock and the spoil of the cities we took as plunder for ourselves[a].
translation:
  language: zh_hans
  text: 但所有的牲畜和城邑的战利品，我们都掳掠来，归自己所有。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“但所有的牲畜和城邑的战利品，我们都夺作自己的掳物。”
    reason: 词义及句法表达的可行替代译法；“夺作自己的掳物”试图保留שָׁלָל（掳物、战利品）与בזז（掠夺）的相关军事语义。
lexical_decisions:
- source_word: וְ/כָל
  choice: 但所有的
  rationale: וְ承接上文，并与前节灭尽人口形成轻微转折；译作“但”自然表达语境关系，כָל译作“所有的”保留其完整范围。
- source_word: הַ/בְּהֵמָה
  choice: 牲畜
  rationale: 此处指城中居民饲养的家畜；“牲畜”是现代汉语中准确而自然的统称。
- source_word: וּ/שְׁלַל
  choice: 和各城的财物
  rationale: שׁלל指战争中夺取的战利品；结合后面的动词，正文用“财物”避免“掳物／掠物”的生硬重复，同时清楚表达所夺取的是各城的物资财产。
- source_word: הֶ/עָרִים
  choice: 各城的
  rationale: 保留希伯来语构造关系，即属于或取自那些城的财物；“各城”也与语境中的复数相符。
- source_word: בַּזּוֹנוּ
  choice: 我们都掳来
  rationale: בזז表示在战争中劫掠、夺取战利品；“掳来”简洁保留军事语境，并与宾语“牲畜和各城的财物”自然搭配。加入“都”使前置宾语“所有的”与谓语衔接清楚。
- source_word: לָֽ/נוּ
  choice: 归了自己
  rationale: לנו标明以色列人是夺取之物的受益者；“归了自己”自然表达据为己有的含义。
theological_decisions: []
