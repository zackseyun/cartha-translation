language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: עַ֠ד אֲשֶׁר יָנִ֨יחַ יְהוָ֥ה לַֽ/אֲחֵי/כֶם֮ כָּ/כֶם֒ וְ/יָרְשׁ֣וּ גַם הֵ֔ם אֶת הָ/אָ֕רֶץ אֲשֶׁ֨ר יְהוָ֧ה אֱלֹהֵי/כֶ֛ם נֹתֵ֥ן לָ/הֶ֖ם בְּ/עֵ֣בֶר הַ/יַּרְדֵּ֑ן וְ/שַׁבְתֶּ֗ם אִ֚ישׁ לִֽ/ירֻשָּׁת֔/וֹ אֲשֶׁ֥ר נָתַ֖תִּי לָ/כֶֽם־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/020.yaml
  text: until Yahweh gives rest to your brothers as to you[a], and they also take possession of the land that Yahweh your God is giving them beyond the Jordan[c][b]. Then each of you may return to his possession that I have given you.
translation:
  language: zh_hans
  text: 直到耶和华使你们的弟兄也像你们一样得享安歇[a]，他们也取得耶和华你们的上帝在约旦河对岸[b]赐给他们的土地；然后，你们各人就可以回到我赐给你们的产业[c]去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弟兄”在这里指其他以色列同胞。
    reason: 说明希伯来文阳性亲属称谓在语境中的群体含义。
  - marker: b
    text: 也可译作“约旦河那边”。这是以说话者所在的约旦河东岸为参照，所指的是河西之地。
    reason: 说明相对方位表达，避免读者误判地点。
  - marker: c
    text: “产业”也可译作“所承受的地”或“领地”。
    reason: 保留ירֻשָּׁה兼有承受之物和实际领地的词义幅度。
lexical_decisions:
- source_word: יָנִיחַ
  choice: 使……得享安歇
  rationale: 该词为נוּחַ的使役式，在这里表示使人得安歇、安定，既包含摆脱争战，也包含在所得之地安居的意思。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 直接译出四字神名；“耶和华”是现代中文圣经读者最熟悉且庄重的专名形式。
- source_word: לַאֲחֵיכֶם
  choice: 你们的弟兄
  rationale: 保留希伯来文阳性亲属称谓及其以色列同胞的群体含义，不在正文中扩写为性别包容性表达。
- source_word: כָכֶם
  choice: 也像你们一样
  rationale: 原文比较结构简略；此译保留其简洁性，并自然表达西岸各支派将与东岸支派同样得享安歇。
- source_word: וְיָרְשׁוּ
  choice: 取得
  rationale: ירשׁ在土地语境中指实际占有、取得所赐之地；“取得”比单纯的“继承”更能体现进入并占有土地。
- source_word: נֹתֵן
  choice: 赐给
  rationale: 分词呈现上帝赐地之事的确定性和正在实现的性质；中文用“赐给”自然表达这一神圣赠予。
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: 在约旦河对岸
  rationale: 该空间表达取决于说话者的位置；摩西在河东说话，此处所指是约旦河西岸。正文保留相对性的“对岸”。
- source_word: וְשַׁבְתֶּם
  choice: 然后……就可以回到
  rationale: 连接词推进事件次序；结合此前的出征义务，句意是义务完成后获准返回，因此译作“就可以回到”。
- source_word: אִישׁ
  choice: 各人
  rationale: 准确传达分配性的“每一个人”，同时保持对受命出征者的个体指向。
- source_word: לִירֻשָּׁתוֹ
  choice: 产业
  rationale: 该词指作为分配所得或承受所得的土地。“产业”在中文中兼具具体土地和承受份额的含义。
- source_word: נָתַתִּי לָכֶם
  choice: 我赐给你们的
  rationale: 完成式指摩西先前已分给河东支派的土地；中文定语结构自然保留已然且仍有效的结果。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用神的专名而非称号。正文采用中文传统中最通行的专名“耶和华”，既不以“主”替代，也便于普通现代读者识别。
- issue: “弟兄”所指的范围
  choice: 保留“你们的弟兄”
  alternative: 你们的以色列同胞
  rationale: 希伯来文使用阳性亲属词，语境上指其余以色列人。保留“弟兄”可呈现原文措辞；脚注说明其群体含义，避免将其误解为血缘兄弟。
- issue: “产业”的主体与圣约土地含义
  choice: 译作“我赐给你们的产业”
  alternative: 我赐给你们的领地
  rationale: ירֻשָּׁה既可指占有之地，也带有分配、承受的色彩。“产业”保留这种土地份额含义，而不额外界定其法律或神学性质。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。“得享安歇”保留申命记中安歇与安居的主题色彩；分号清楚标示先协助同胞取得土地、后返回各自产业的次序。所有脚注标记均置于正文相应词语之后。
