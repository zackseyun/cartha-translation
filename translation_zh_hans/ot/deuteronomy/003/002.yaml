base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/002.yaml
  text: And Yahweh said to me, “Do not fear him, for I have given him, all his people, and his land into your hand; and you shall do to him just as you did to Sihon king of the Amorites, who lived in Heshbon.”
translation:
  language: zh_hans
  text: 雅威对我说：“不要怕他，因为我已经把他、他的全体人民和他的土地交在你手中。你要怎样对待那住在希实本的亚摩利王西宏，也要照样对待他。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 采用接近希伯来文四字神名可能读音的现代汉语音译，不以“主”替代专名，也不采用源自另一种传统读法的“耶和华”。
- source_word: אַל תִּירָא אֹתוֹ
  choice: 不要怕他
  rationale: 直接表达否定命令，并保留希伯来文明确的阳性单数宾语“他”。
- source_word: בְיָדְךָ נָתַתִּי
  choice: 我已经……交在你手中
  rationale: “已经”体现完成式所表达的既成事实；“交在你手中”保留“手”所象征的掌控与处置权，同时符合汉语表达。
- source_word: וְאֶת כָּל עַמּוֹ וְאֶת אַרְצוֹ
  choice: 他的全体人民和他的土地
  rationale: 不把 עַם 限缩为军队；“全体人民”和“土地”分别保留原文的整体性与领土含义。
- source_word: וְעָשִׂיתָ לּוֹ כַּאֲשֶׁר עָשִׂיתָ
  choice: 你要怎样对待……也要照样对待他
  rationale: 以自然的汉语对应希伯来文宽泛的 עשה，不额外说明具体行动，并清楚表达比较关系。
- source_word: לְסִיחֹן מֶלֶךְ הָאֱמֹרִי
  choice: 亚摩利王西宏
  rationale: 采用现代汉语常见的称号加人名结构，保留西宏作为亚摩利人之王的身份。
- source_word: אֲשֶׁר יוֹשֵׁב בְּחֶשְׁבּוֹן
  choice: 那住在希实本的
  rationale: 将分词 יוֹשֵׁב 按居住状态表达为“住在”，既自然又不使用古雅的“居于”。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名，因此译作专名“雅威”，以保留其作为盟约之神名字的性质；不以称号“上主”取代，也不采用“耶和华”这一传统形式。
- issue: 神在争战前所说之交付的完成性
  choice: 我已经……交在你手中
  alternative: 我要把……交在你手中
  rationale: 保留希伯来文完成式从神的宣告角度将结果说成已经成就的张力，不把它改写为单纯的未来应许。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。保留“交在你手中”的原文意象；后半句调整为汉语的“怎样……也照样……”结构，以避免生硬重复，同时不扩充原文未明说的战争细节。
