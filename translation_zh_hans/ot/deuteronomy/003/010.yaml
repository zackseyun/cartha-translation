  text: all the cities of the tableland[a], and all Gilead, and all Bashan, as far as Salecah and Edrei[b], the cities of the kingdom of Og in Bashan.
translation:
  language: zh_hans
  text: 高原[a]的所有城邑、基列全地和巴珊全地，直到撒迦[b]和以得来；这些都是巴珊王噩国中的城邑。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “高原”也可译作“平原”或“台地”。希伯来语所指的是约旦河东地势平坦的高地。
    reason: lexical_alternative
  - marker: b
    text: “撒迦”也可音译作“撒勒迦”。
    reason: transliteration_alternative
lexical_decisions:
- source_word: כֹּל עָרֵי הַמִּישֹׁר
  choice: 高原的所有城邑
  rationale: מִישׁוֹר在此指约旦河东地势平坦的高地，不只是泛指低平的平原；“高原”既传达地貌，也符合现代汉语。כֹּל עָרֵי译为“所有城邑”，保留全称范围和地域文体。
- source_word: וְכָל הַגִּלְעָד וְכָל הַבָּשָׁן
  choice: 基列全地和巴珊全地
  rationale: 两个כֹּל均明确表达地域的全部范围；“全地”在汉语中自然地表明这里列举的是地区，而非仅指同名城镇。
- source_word: עַד סַלְכָה וְאֶדְרֶעִי
  choice: 直到撒迦和以得来
  rationale: עַד标示疆域延伸的界限，译作“直到”；地名采用汉语圣经传统中通行且易辨认的音译。
- source_word: עָרֵי מַמְלֶכֶת עוֹג
  choice: 噩国的城邑
  rationale: 按构造链直译为属于噩之王国的城邑；“噩国”比“噩王国”更凝练自然，并未改变所属关系。
- source_word: בַּבָּשָׁן
  choice: 巴珊境内
  rationale: 介词בְּ在此表示位置；“境内”清楚说明噩的国位于巴珊，避免误解为单纯的名称归属。
