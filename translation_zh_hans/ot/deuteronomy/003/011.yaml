base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/011.yaml
  text: For only Og king of Bashan was left of the remnant of the Rephaim[a]. Look, his bed was a bed of iron. Is it not in Rabbah of the Ammonites? Its length was nine cubits and its width four cubits[b], by the cubit of a man.
translation:
  language: zh_hans
  text: 因为剩余的利乏音人[a]中，只有巴珊王噩还存留着。看哪，他的床是一张铁床；那张床不是在亚扪人的拉巴吗？这床按人的肘尺量，长九肘，宽四肘[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“巨人”。希伯来文作“利乏音人”，可能是一个与身材高大有关的古代族群名称。
    reason: alternative_reading
  - marker: b
    text: 或译“按普通肘尺量”或“按通用肘尺量”。希伯来文直译为“按人的肘尺”。
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: 只有
  rationale: 表达排他性，说明噩是这一群体中唯一存留下来的。
- source_word: נִשְׁאַר מִיֶּתֶר
  choice: 剩余的……中，只有……还存留着
  rationale: 既保留“剩余”与“存留”的双重表达，又使现代汉语自然通顺。
- source_word: הָרְפָאִים
  choice: 利乏音人
  rationale: 按族群或类别名称音译，避免直接解释成“巨人”；其身材高大的关联留在脚注说明。
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留原文引人注意、指向实物证据的语气，同时符合庄重的经文语体。
- source_word: עַרְשׂוֹ ... עֶרֶשׂ
  choice: 他的床是一张……床
  rationale: 保留原文名词的重复。“床”是本语境中最自然的理解，但不排除学术讨论中的其他可能。
- source_word: בַּרְזֶל
  choice: 铁
  rationale: 直接译出材质。
- source_word: הֲלֹה הִוא
  choice: 不是还……吗
  rationale: 保留原文诉诸读者已知事实的反问语气。
- source_word: בְּרַבַּת בְּנֵי עַמּוֹן
  choice: 在亚扪人的拉巴
  rationale: 采用通行中文地名和族名，准确表达所属关系。
- source_word: תֵּשַׁע אַמּוֹת ... וְאַרְבַּע אַמּוֹת
  choice: 长九肘，宽四肘
  rationale: 保留古代计量单位，不作可能造成虚假精确度的现代换算。
- source_word: בְּאַמַּת אִישׁ
  choice: 按人的肘尺量
  rationale: 较贴近原文字面表达；“普通肘尺”或“通用肘尺”的解释置于脚注。
theological_decisions:
- issue: הָרְפָאִים应译作族群名称还是解释为“巨人”
  choice: 利乏音人
  alternative: 巨人
  rationale: 原词在旧约中是一个已知群体或类别的名称。正文保留名称，不把其与高大身材的关联直接写成词义。
- issue: עֶרֶשׂ在本节指床，还是棺榻、灵床或石棺
  choice: 床
  alternative: 卧榻；棺榻；石棺
  rationale: 本节以物件尺寸突显噩非同寻常的体格，“床”最符合直接语境；原文并不要求采用专门的丧葬含义。
- issue: בְּאַמַּת אִישׁ是字面“人的肘尺”还是解释为标准尺度
  choice: 按人的肘尺量
  alternative: 按普通肘尺量；按通用肘尺量
  rationale: 正文保留原文措辞所含的张力，不武断判定它专指某一种标准尺度；较可能的解释列于脚注。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。使用“看哪”保留指示和强调语气；保留“肘”这一古代单位，并以脚注解释有歧义的尺度表达。
