  yaml_path: translation/ot/deuteronomy/003/023.yaml
  text: And I pleaded with Yahweh at that time[a], saying,
translation:
  language: zh_hans
  text: 那时，我恳求雅威[a]，说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文：YHWH。传统中文译作“耶和华”；正文按 Yahweh 音译为“雅威”。
    reason: 说明四字神名的原文形式、正文音译及传统中文译名。
lexical_decisions:
- source_word: וָאֶתְחַנַּן
  choice: 我恳求
  rationale: חנן 的 Hitpael 形式在这里表达迫切地求恩、求怜悯；“恳求”自然庄重，并保留了强烈的请求意味。词首 וַ 按叙事推进译入句子衔接，不机械另译为“并且”。
- source_word: אֶל
  choice: （恳求）耶和华
  rationale: 介词 אֶל 表明恳求所指向的对象；现代汉语可直接说“恳求某人”，无需另译“向”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 这是四字神名 יהוה。中文采用通行已久的音译“耶和华”，保留其作为专名的性质，而不以称号代替；脚注说明原文形式。
- source_word: בָּעֵת הַהִוא
  choice: 那时
  rationale: 准确而自然地表达该时间短语，不把时间范围过度限定为某一瞬间。
- source_word: לֵאמֹר
  choice: 说
  rationale: 这是引出下文直接引语的固定叙事公式；中文用“说”简洁自然，并保留与下一节的连接。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。正文采用现代中文圣经传统中最广为人知的专名形式“耶和华”，同时以脚注标明希伯来文为 YHWH，并提示另一常见拟音“雅威”，避免把有争议的古代读音当作完全确定。
translation_notes:
  register: 采用现代、简洁而庄重的叙事语言。“恳求”体现摩西请求的迫切程度；句末用冒号自然引出下一节的直接引语。
