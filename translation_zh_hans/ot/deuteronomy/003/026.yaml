  text: וַ/יִּתְעַבֵּ֨ר יְהוָ֥ה בִּ/י֙ לְמַ֣עַנְ/כֶ֔ם וְ/לֹ֥א שָׁמַ֖ע אֵלָ֑/י וַ/יֹּ֨אמֶר יְהוָ֤ה אֵלַ/י֙ רַב לָ֔/ךְ אַל תּ֗וֹסֶף דַּבֵּ֥ר אֵלַ֛/י ע֖וֹד בַּ/דָּבָ֥ר הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/026.yaml
  text: But Yahweh was angry with me because of you and did not listen to me[a], and Yahweh said to me, “Enough from you[b]; do not speak to me again about this matter.”
translation:
  language: zh_hans
  text: 但雅威却因你们[a]向我发怒，不听我。雅威对我说：“够了！[b] 不要再向我提这件事。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“为了你们”或“由于你们的缘故”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译为“对你够了”，是语气强硬的制止语。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְעַבֵּר
  choice: 发怒
  rationale: 该词在此与雅威作主语，表达向某人动怒；“发怒”自然、庄重，也不把怒气程度译得过强。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文直接音译四字神名，保留其作为以色列之上帝专名的性质，不以称号替代。
- source_word: בִּי
  choice: 向我
  rationale: 与“发怒”搭配时，“向我发怒”是现代汉语中自然的表达。
- source_word: לְמַעַנְכֶם
  choice: 因你们
  rationale: 上下文主要表示摩西所受怒气与百姓有关；“因你们”简洁直接，同时以脚注保留“为了你们／由于你们的缘故”的语义幅度。
- source_word: וְלֹא שָׁמַע אֵלָי
  choice: 不听我的恳求
  rationale: שׁמע אֶל 在此不只是听见声音，而是听取、应允摩西的请求；补出“恳求”使现代读者清楚所指，又符合前文语境。
- source_word: רַב לָךְ
  choice: 够了！
  rationale: 这是简短而强硬的制止语；汉语“够了！”自然传达其斩钉截铁的语气，脚注说明希伯来文字面形式。
- source_word: אַל תּוֹסֶף דַּבֵּר אֵלַי עוֹד
  choice: 不要再向我提
  rationale: יסף 加不定式并与 עוֹד 连用，表示不可继续或再次说；“不要再向我提”在汉语中准确传达禁止继续谈论此事。
- source_word: בַּדָּבָר הַזֶּה
  choice: 这件事
  rationale: דבר 在此指正在谈论的事项，即摩西请求过河一事；“这件事”清楚自然。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文两次使用四字神名；采用较贴近其通行学术重建读音的“雅威”，保留专名，不以“主”等称号取代。
- issue: 雅威“不听”摩西的含义
  choice: 不听我的恳求
  alternative: 不听我
  rationale: 语境表明这是不接受或不应允摩西的请求，并非听觉意义上的未听见；译文不进一步解释其神学原因。
- issue: לְמַעַנְכֶם 所表达的因果或关联
  choice: 因你们
  alternative: 为了你们
  rationale: 本节中“因你们”最符合摩西将雅威发怒与百姓联系起来的表述；脚注保留介词短语可能呈现的“为了你们／由于你们的缘故”，避免过度消除原文张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“却”承接上文摩西的请求与雅威的拒绝；“够了！”保留原文短促严厉的语气。所有脚注标记均置于正文对应位置。
