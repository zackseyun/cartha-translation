  yaml_path: translation/ot/deuteronomy/003/017.yaml
  text: also the Arabah[a], with the Jordan as its border, from Kinnereth as far as the Sea of the Arabah, the Salt Sea[b], below the slopes of Pisgah on the east.
translation:
  language: zh_hans
  text: 还有亚拉巴，以约旦河为界，从基尼烈直到亚拉巴海，就是盐海[a]，在毗斯迦山坡下的东面。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 就是今天所称的死海。
    reason: alternative_reading
lexical_decisions:
- source_word: הָעֲרָבָה
  choice: 亚拉巴
  rationale: 在这段疆界说明中是约旦裂谷地区的地名，而非泛指“平原”，故采用音译。
- source_word: הַיַּרְדֵּן
  choice: 约旦河
  rationale: 采用现代中文通行地名，并补出“河”，使疆界关系自然清楚。
- source_word: גְבֻל
  choice: 以……为界
  rationale: 原文名词结构简略；译为中文惯用的疆界表达，不超出其“边界”之义。
- source_word: מִכִּנֶּרֶת
  choice: 从基尼烈
  rationale: 原文只给出地名，没有明说是城、地区或湖，故保留这种含混，不增译“海”。
- source_word: יָם הָעֲרָבָה
  choice: 亚拉巴海
  rationale: 按原文地理称谓直译，并保留下文同位说明“盐海”。
- source_word: יָם הַמֶּלַח
  choice: 盐海
  rationale: 直接反映希伯来文名称；现代通称“死海”置于脚注说明。
- source_word: תַּחַת
  choice: 在……之下
  rationale: 表达地形上的相对位置，不武断解释为某一方位。
- source_word: אַשְׁדֹּת הַפִּסְגָּה
  choice: 毗斯迦山坡
  rationale: 此词在地理语境中指斜坡或山麓；“山坡”既准确又符合现代中文。
- source_word: מִזְרָחָה
  choice: 东边
  rationale: 保留原文方位意义，并使其自然修饰整个位置信息。
