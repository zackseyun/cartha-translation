  naturalness: 原译末句“东边在毗斯迦山坡之下”语序和修饰关系不自然，容易读成“东边”是独立主语，且未清楚表达其与毗斯迦山坡的空间关系。调整为“在毗斯迦山坡下的东面”，保留原文方位的简略性而更合现代汉语。
  terminology: “亚拉巴”“约旦河”“基尼烈”“毗斯迦”“盐海”均适合此处的地名及直译策略。“死海”作为现代通称置于脚注，恰当。
