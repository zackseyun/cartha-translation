  text: אֶעְבְּרָה נָּ֗א וְ/אֶרְאֶה֙ אֶת הָ/אָ֣רֶץ הַ/טּוֹבָ֔ה אֲשֶׁ֖ר בְּ/עֵ֣בֶר הַ/יַּרְדֵּ֑ן הָ/הָ֥ר הַ/טּ֛וֹב הַ/זֶּ֖ה וְ/הַ/לְּבָנֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/025.yaml
  text: Please let me cross over and see the good land that is beyond the Jordan[a], this good hill country and Lebanon.
translation:
  language: zh_hans
  text: 求你容我过去，亲眼看看约旦河西边的那片美地，就是这片美好的山地和黎巴嫩。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֶעְבְּרָה נָּא
  choice: 求你容我过去
  rationale: 第一人称单数祈愿式配合恳求语气词 נָא，表达摩西恳切请求获准渡河；此译法自然、庄重，也保留意愿和请求的语气。
- source_word: וְאֶרְאֶה
  choice: 亲眼看看
  rationale: 承接前一个祈愿式，表达过去之后观看那地的愿望；“亲眼看看”符合现代汉语，也传达摩西渴望实际见到那地的意味。
- source_word: הָאָרֶץ הַטּוֹבָה
  choice: 那片美地
  rationale: אָ֫רֶץ 在此指应许之地；“美地”保留申命记反复出现的评价性表述，“那片”适合汉语地域表达。
- source_word: אֲשֶׁר בְּעֵבֶר הַיַּרְדֵּן
  choice: 约旦河西边的
  rationale: 从摩西所在的约旦河东岸看，所指之地在河的另一边，即西边；明确方位可避免现代汉语“河那边”视点不清，同时忠实于叙事地理。
- source_word: הָהָר הַטּוֹב הַזֶּה
  choice: 这片美好的山地
  rationale: הָר 虽为单数，既可指一座山，也可集合性地指山区；在迦南地理描述及与黎巴嫩并列的语境中，“山地”更可能，且“这片”使现代汉语自然。
- source_word: וְהַלְּבָנוֹן
  choice: 和黎巴嫩
  rationale: 保留专名“黎巴嫩”；连接词 וְ 直译为“和”，将其列为摩西渴望看见之地的一部分。
theological_decisions:
- issue: הָהָר 是特指一座山，还是泛指山地
  choice: 译作“这片美好的山地”
  alternative: “这座美好的山”
  rationale: 希伯来语单数 הָר 可集合性地表示山区。结合申命记对土地的描述以及随后提到的黎巴嫩，地域性的“山地”更符合上下文；但不把“山”解释成某一具有特殊神学意义的山。
- issue: “约旦河另一边”的叙事视点
  choice: 译作“约旦河西边”
  alternative: “约旦河那边”或“约旦河对岸”
  rationale: 摩西当时位于河东，目的地明确在河西；译出“西边”保留实际所指，避免中文读者因视点不同而误解，不涉及额外的神学推断。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“求你容我”体现恳求语气而不过分古雅；“亲眼看看”传达热切愿望。“美地”保留申命记具有辨识度的用语。原文地理短语按同位说明理解，以“就是”连接，使中文层次清楚。
