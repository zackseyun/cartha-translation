  text: So we stayed in the valley opposite Beth-peor[a].
translation:
  language: zh_hans
  text: 于是，我们住在伯毗珥对面的谷中。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我们停留在伯毗珥对面的谷中。”
    reason: 保留וַנֵּשֶׁב可译为“停留”的词义选择；“对面”对应מוּל，并避免替代译文中空间关系的句法歧义。
lexical_decisions:
- source_word: וַנֵּשֶׁב
  choice: 于是，我们住
  rationale: ישׁב在此为带叙事性连接词的第一人称复数未完成式，叙述过去在某地居住或停留。“住”简洁自然；“于是”体现上下文中的叙事承接。
- source_word: בַּגָּיְא
  choice: 在……谷中
  rationale: גַּיְא可指山谷、沟谷或峡谷；“谷”保留地形含义，同时避免把具体地貌规定得过窄。
- source_word: מוּל
  choice: 对面
  rationale: מוּל表示在某处前方、相对或面对某处；“对面”准确表达空间上的相对位置。
- source_word: בֵּית פְּעוֹר
  choice: 伯毗珥
  rationale: 这是地名，采用中文圣经传统中通行且易辨认的音译，不按字面译为“毗珥之家”。
