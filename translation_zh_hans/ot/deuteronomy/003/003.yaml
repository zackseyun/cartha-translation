base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/003.yaml
  text: So Yahweh our God also gave into our hand Og king of Bashan[a], and all his people, and we struck him down until he had no survivor left.
translation:
  language: zh_hans
  text: 耶和华我们的神也把巴珊王噩和他所有的百姓交在我们手中；我们击败了他，直到没有给他留下一个幸存者。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“直到没有一个幸存者留给他。”
    reason: 原文末句可较贴近字面地译为“没有幸存者留给他”；正文以自然的结果式表达，并保留“给他”这一关系。
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文通行的专名音译“耶和华”对应四字神名，保留其作为以色列之神名字的性质，不以“主”这一称号代替。
- source_word: וַיִּתֵּן
  choice: 交在
  rationale: נתן本义为“给”；与“在我们手中”连用时，“交在我们手中”自然保留了希伯来语军事交付的意象。
- source_word: בְּיָדֵנוּ
  choice: 在我们手中
  rationale: 保留希伯来语单数“手”的惯用表达；中文“在我们手中”既自然，也传达落入掌控的含义。
- source_word: גַּם
  choice: 也
  rationale: 承接前文西宏的败亡，表达附加关系。
- source_word: עוֹג מֶלֶךְ הַבָּשָׁן
  choice: 巴珊王噩
  rationale: 采用现代中文圣经地名、人名的通行形式，并按自然汉语语序排列称号与人名。
- source_word: כָּל עַמּוֹ
  choice: 他的全体百姓
  rationale: עַם通常指“百姓、人民”；虽处于战争语境，仍不缩窄为“军队”。“全体”明确保留כָּל的范围。
- source_word: וַנַּכֵּהוּ
  choice: 我们击杀了他
  rationale: נכה在战争语境中指击打、杀败；“击杀”保留原文强烈的军事暴力色彩，宾语“他”则对应希伯来语单数后缀。
- source_word: עַד בִּלְתִּי הִשְׁאִיר לוֹ שָׂרִיד
  choice: 直到没有给他留下一个幸存者
  rationale: 贴近原文“不给他留下幸存者”的结构，表达彻底毁灭，同时避免添加原文未明说的解释。
theological_decisions:
- issue: 四字神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威；主
  rationale: 采用现代中文读者熟悉的神名音译，保留专名性质；不以称号“主”取代。
- issue: 败亡范围的表达
  choice: 直到没有给他留下一个幸存者
  alternative: 直到他没有一个幸存者留下
  rationale: 正文保留全面毁灭的严厉措辞，也保留“给他”这一关系；脚注列出较自然、但语法关系略有不同的译法，不加入神学辩解或淡化。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“交在我们手中”保留原文惯用意象；“全体百姓”不把עַם解释性缩窄为军队；“击杀”如实呈现战争语境的力度。脚注标记置于其实际说明的末句之后。
