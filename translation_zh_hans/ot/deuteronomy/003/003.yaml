    text: 或译：“直到没有一个幸存者留给他。”
    reason: 原文末句可较贴近字面地译为“没有幸存者留给他”；正文以自然的结果式表达，并保留“给他”这一关系。
  revision_rationale: 修订仅改善中文的自然性和指称范围：以“击败了他”避免将原文战争性单数宾语不必要地限为噩个人被杀，同时借末句完整保留全歼、无幸存者的结果；“所有的百姓”忠实且更通顺。脚注改为真正对应原文关系词的直译替代方案。
