lexical_decisions:
- source_word: וּ/לְ/מָכִיר
  choice: 给了玛吉
  rationale: 介词 לְ 表示领受者，用“给……玛吉”的汉语结构自然表达；玛吉是人名。前缀 וּ 承接上文，但本节作为独立句时，现代汉语无需机械译作“并且”。
- source_word: נָתַתִּי
  choice: 我把……给了
  rationale: נתן 的 Qal 完成式第一人称单数，在摩西回顾分地的叙事中以过去时“给了”最直接；“把”字句清楚呈现授予对象与所授之地。
- source_word: אֶת
  choice: 以“把”字句体现
  rationale: אֶת 是确定直接宾语标记，没有独立词义；汉语通过“把基列给了……”体现其句法功能。
- source_word: הַגִּלְעָד
  choice: 基列
  rationale: 基列是通行地名。原文带定冠词 הַ；现代汉语地名通常不加对应冠词，因此正文自然译作“基列”，并以脚注说明。
