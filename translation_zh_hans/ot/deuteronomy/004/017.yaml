  yaml_path: translation/ot/deuteronomy/004/017.yaml
  text: the form of any animal that is on the earth[a], the form of any winged bird that flies in the heavens[b],
translation:
  language: zh_hans
  text: 任何地上的动物的形像[a]，任何有翅膀、在天空[b]飞翔的鸟的形像，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “形像”或译“形状”或“样式”；这里指照某种受造物的外形制成的代表物。
    reason: lexical_alternative
  - marker: b
    text: “天空”或译“天上”。希伯来语原词采用复数形式，在这里可指人眼可见的天空。
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּבְנִית
  choice: 形像
  rationale: 本词在禁止制造偶像的语境中指可见的外形或仿制形像。“形像”既能表达所描摹的样貌，也能自然指供人制作的代表物；原文重复此词，译文也予以重复。
- source_word: כָּל
  choice: 任何
  rationale: 本词修饰单数集合名词，在这份禁制清单中表示该类别中的任何一种；“任何”符合现代汉语表达。
- source_word: בְּהֵמָה
  choice: 走兽
  rationale: 此处按生存领域列举受造物，与空中的鸟和下文水中的生物相对；“走兽”自然表达地上的动物类别，又避免限缩为家畜。
- source_word: אֲשֶׁר בָּאָרֶץ
  choice: 地上
  rationale: 保留此处与天空及下文水域之间的空间对照，并将希伯来语关系从句简洁地转化为自然汉语定语。
- source_word: צִפּוֹר כָּנָף
  choice: 有翅膀……的鸟
  rationale: “鸟”对应 צִפּוֹר，“有翅膀”明确保留 כָּנָף 的描述作用，虽在汉语中略显重复，却忠实呈现原文。
- source_word: תָּעוּף
  choice: 飞翔
  rationale: 以一般性动作表达 Qal 未完成式在关系从句中的类别描述，现代汉语自然且庄重。
- source_word: בַּשָּׁמָיִם
  choice: 在天空
  rationale: 此处所指是鸟飞翔的可见天空；“天空”比直译复数形式“诸天”更符合现代汉语，同时脚注保留“天上”的译法。
theological_decisions:
- issue: תַּבְנִית 在偶像禁令中的含义
  choice: 形像
  alternative: 形状／样式
  rationale: 译作“形像”让上下文所涉及的仿制物含义可被读者感知，但不额外加入“偶像”一词，从而不超出本节字面表达。
translation_notes:
  register: 采用现代、庄重而易懂的经文语体。保留原文两次出现的“形像”及“有翅膀”的明示描述；不添加原文没有的连接词“或”，以维持清单式并列结构。句末逗号表明本节内容仍延续到下一项。
