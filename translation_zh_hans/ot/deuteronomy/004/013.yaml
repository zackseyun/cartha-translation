base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/013.yaml
  text: And he declared to you his covenant[a], which he commanded you to do, the Ten Words; and he wrote them on two tablets of stone.
translation:
  language: zh_hans
  text: 他向你们宣告了他的约，就是他吩咐你们去行的十句话[a]；他又把这些话写在两块石版上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译“十句话”；传统译作“十诫”。
    reason: 说明原文直译，并列出传统译名。
lexical_decisions:
- source_word: וַיַּגֵּד
  choice: 宣告
  rationale: 希伯来语 נגד 的使役式在这里表示使人知道、郑重宣布；“宣告”既保留立约语境的庄重感，也符合现代汉语。
- source_word: בְּרִיתוֹ
  choice: 他的约
  rationale: בְּרִית 指具有约束力的盟约关系；“约”是简明、通行的圣经用语，不把含义缩减为政治性的条约。
- source_word: אֲשֶׁר צִוָּה אֶתְכֶם לַעֲשׂוֹת
  choice: 就是他吩咐你们去行的
  rationale: לַעֲשׂוֹת 直译为“去做、去行”。“去行”保留原文对实际履行的强调，又比“去做十句话”更符合现代汉语。
- source_word: עֲשֶׂרֶת הַדְּבָרִים
  choice: 十句话
  rationale: 原文直指“十个话语／十句话”，并未使用“诫命”一词。“十句话”清楚易懂，也保留原文自己的称谓；传统译名“十诫”置于脚注。
- source_word: וַיִּכְתְּבֵם
  choice: 他又把这些话写在
  rationale: כתב 是普通的“写”。补出“这些话”以明确宾语所指，并用“又”自然承接希伯来语的并列叙事。
- source_word: שְׁנֵי לֻחֹת אֲבָנִים
  choice: 两块石版
  rationale: 该结构指两块以石头制成的版；“两块石版”简洁自然，并准确表达材质与数量。
theological_decisions:
- issue: עֲשֶׂרֶת הַדְּבָרִים 的译法
  choice: 十句话
  alternative: 十诫
  rationale: 原文称其为“十个话语”，因此正文按原文措辞译为“十句话”，不以传统解释性名称取代它；广为人知的“十诫”保留在脚注中，方便读者辨认。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“就是”明确“十句话”与“他的约”之间的同位说明关系；避免文言化的“十言”，也不在正文中以传统术语“十诫”取代原文称谓。
