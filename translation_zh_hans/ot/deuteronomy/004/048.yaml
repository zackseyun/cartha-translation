  text: from Aroer[a], which is on the bank of the Arnon Valley, as far as Mount Sion (that is, Hermon)[b],
translation:
  language: zh_hans
  text: 从亚嫩谷边的亚罗珥，直到西云山，就是黑门山，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מֵ/עֲרֹעֵר
  choice: 从亚罗珥
  rationale: 前缀介词 מִן 标明疆域范围的起点；“亚罗珥”按通行中文地名音译。
- source_word: אֲשֶׁר עַל שְׂפַת
  choice: 就是……边上的地方
  rationale: 关系从句修饰亚罗珥；שָׂפָה 本义为“唇、边缘”，在地理语境中译作“边上”自然，也不把 נַחַל 误定为常年河流。
- source_word: נַחַל אַרְנֹן
  choice: 亚嫩溪谷
  rationale: נַחַל 可指溪流、河床、峡谷或季节性水道；“溪谷”兼顾水道和谷地的地貌含义，保留其不一定常年有水的特点。“亚嫩”采用通行中文音译。
- source_word: וְ/עַד
  choice: 直到
  rationale: 表示所述疆域范围的终点，现代汉语用“直到”简洁自然。
- source_word: הַר שִׂיאֹן
  choice: 西云山
  rationale: הַר 表示“山”；שִׂיאֹן 是此处的专名，不与“锡安”混同，采用中文圣经地名中可辨识的音译“西云”。
- source_word: הוּא חֶרְמוֹן
  choice: 就是黑门山
  rationale: הוּא 在这里具有同位解释作用，明确指出西云山即黑门山；“黑门”采用通行中文音译。
