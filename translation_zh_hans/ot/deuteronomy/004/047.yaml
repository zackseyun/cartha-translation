base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/047.yaml
  text: and they took possession of his land[a], and the land of Og king of Bashan—the two kings of the Amorites who were beyond the Jordan[b], toward the sunrise.
translation:
  language: zh_hans
  text: 他们占领了他的土地，也占领了巴珊王噩的土地；这两个亚摩利人的王都在约旦河那边[a]，在日出方向[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “约旦河那边”也可译作“约旦河对岸”。这是希伯来语惯用的地理表达，具体所指取决于叙述者的观察位置。
    reason: lexical_alternative
  - marker: b
    text: 直译“朝太阳升起之处”，即向东。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּירְשׁוּ
  choice: 他们占领了
  rationale: ירשׁ在征服土地的语境中指取得并占有土地，常隐含取代原有占有者之意。“占领了”在现代汉语中自然，并保留军事征服的语境；“承受了”容易使人误解为继承所得。
- source_word: אַרְצוֹ
  choice: 他的土地
  rationale: 第三人称阳性单数后缀按上文指西宏。“他的土地”直接对应原文，也避免在本节中补出原文未重复的名字。
- source_word: אֶרֶץ עוֹג מֶלֶךְ הַבָּשָׁן
  choice: 巴珊王噩的土地
  rationale: 按希伯来语结构直译，同时采用中文较自然的头衔次序，并与前面的“土地”保持一致。
- source_word: שְׁנֵי מַלְכֵי הָאֱמֹרִי
  choice: 这两个亚摩利人的王
  rationale: 保留原文“亚摩利人的两个王”这一归属关系，并用“这”清楚回指西宏和噩；不扩写原文未明说的信息。
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: 在约旦河那边
  rationale: עֵבֶר是惯用地理表达，其具体方位取决于叙述视角。“那边”保留原文的视角弹性，不在正文中直接解释成“东岸”。
- source_word: מִזְרַח שָׁמֶשׁ
  choice: 朝日出方向
  rationale: 该短语既表示太阳升起的方向，即东方，又保有具体的“日出”意象。“朝日出方向”兼顾意义清晰与原文形象。
theological_decisions: []
