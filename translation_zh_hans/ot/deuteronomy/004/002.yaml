base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/002.yaml
  text: You shall not add to the word that I am commanding you[a], nor shall you take away from it, so that you may keep the commandments of Yahweh your God that I am commanding you.
translation:
  language: zh_hans
  text: 你们不可在我吩咐你们的话上增添，也不可从中删减，以便你们遵守雅威——你们的上帝——的诫命，就是我吩咐你们的。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תֹסִפוּ עַל
  choice: 在……上有所增添
  rationale: 准确表达使役词形与介词搭配所表示的“给某事物加上内容”，并与下文“从中有所删减”形成清楚对偶。
- source_word: הַדָּבָר
  choice: 话
  rationale: דָּבָר 在此统指摩西正在宣告的训令内容；保留希伯来文单数的集合意义，不把它过早限定为某一条“命令”。
- source_word: מְצַוֶּה
  choice: 吩咐
  rationale: 分词在当前讲话情境中表示正在颁布命令；现代汉语用“我吩咐你们”即可自然体现其当下、持续的语境。
- source_word: תִגְרְעוּ מִמֶּנּוּ
  choice: 从中有所删减
  rationale: גרע 表示减少或除去；“删减”适合针对训令内容，并与“增添”构成自然反义。
- source_word: לִשְׁמֹר
  choice: 好使……遵守
  rationale: ל 加不定式在此可表达目的或结果；“好使”保留这种关联，而不把两者仅处理为并列行动。
- source_word: מִצְוֺת
  choice: 诫命
  rationale: 该词为复数，在盟约和律法语境中指上帝所颁布的命令；“诫命”庄重且为现代读者熟悉。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以“雅威”音译四字神名 YHWH，直接呈现专名性质；脚注同时说明中文传统译法。
- source_word: אֱלֹהֵיכֶם
  choice: 你们的上帝
  rationale: 在与 YHWH 连用的盟约称谓中为单数意义；“你们的上帝”准确表达第二人称复数所属关系。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名而非称号；正文采用较贴近学界重构读音的“雅威”，并以脚注交代传统中文译名，不把专名默默改成称号。
- issue: לִשְׁמֹר 所表达的逻辑关系
  choice: 好使……遵守
  alternative: 要遵守；从而遵守
  rationale: 该结构可有目的或结果色彩；“好使”保留增删禁令与遵守诫命之间的紧密关联，同时避免加入原文没有明说的神学推论。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“有所增添／有所删减”保持原文对偶；两个“我吩咐你们”均予保留，以呈现原文重复及讲话的直接性。
