source:
  edition: WLC
  text: בְּ/עֵ֨בֶר הַ/יַּרְדֵּ֜ן בַּ/גַּ֗יְא מ֚וּל בֵּ֣ית פְּע֔וֹר בְּ/אֶ֗רֶץ סִיחֹן֙ מֶ֣לֶךְ הָֽ/אֱמֹרִ֔י אֲשֶׁ֥ר יוֹשֵׁ֖ב בְּ/חֶשְׁבּ֑וֹן אֲשֶׁ֨ר הִכָּ֤ה מֹשֶׁה֙ וּ/בְנֵֽי יִשְׂרָאֵ֔ל בְּ/צֵאתָ֖/ם מִ/מִּצְרָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/046.yaml
  text: beyond the Jordan[a], in the valley opposite Beth-peor, in the land of Sihon king of the Amorites, who lived in Heshbon, whom Moses and the sons of Israel struck down when they came out from Egypt.
translation:
  language: zh_hans
  text: 在约旦河东岸[a]、伯·毗珥对面的谷中，也就是亚摩利人王西宏的境内；西宏住在希实本，摩西和以色列子孙出埃及时击败了他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“在约旦河彼岸”。按本段所述地点的地理位置，此处指东岸。
    reason: 保留בְּעֵבֶר הַיַּרְדֵּן的相对地理视角，并说明正文“东岸”的语境依据。
lexical_decisions:
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: 在约旦河东岸
  rationale: 该短语指约旦河彼岸；按本段叙述的地理位置，具体为东岸。正文采用自然、明确的现代汉语，并用脚注保留较形式对应的译法。
- source_word: בַּגַּיְא
  choice: 谷中
  rationale: גַּיְא 指山谷或谷地；“谷中”简洁自然，符合此处地形说明。
- source_word: מוּל
  choice: 对面
  rationale: מוּל 表示空间上正对或相对的位置；“对面”是清楚自然的地理表达。
- source_word: בֵּית פְּעוֹר
  choice: 伯·毗珥
  rationale: 作为地名采用中文圣经传统中易辨识的音译，并以间隔号标明名称结构。
- source_word: בְּאֶרֶץ סִיחֹן
  choice: 在……西宏境内
  rationale: אֶרֶץ 在此指王所辖的土地或疆域；“境内”比直译“地中”更符合现代汉语地理叙述。
- source_word: מֶלֶךְ הָאֱמֹרִי
  choice: 亚摩利王
  rationale: 该结构可自然译为“亚摩利王”，既保留西宏的族群和王权身份，也避免生硬表达。
- source_word: אֲשֶׁר יוֹשֵׁב בְּחֶשְׁבּוֹן
  choice: 住希实本的
  rationale: 分词 יוֹשֵׁב 表示居住或以某地为驻地；“住希实本的”简明地修饰西宏。
- source_word: אֲשֶׁר הִכָּה
  choice: 击败了他
  rationale: נכה 在战争语境中可指击打、击杀或打败。此处上下文强调对西宏的军事胜利，“击败”自然且不额外断定具体死法。
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: 和以色列子孙
  rationale: בְּנֵי יִשְׂרָאֵל 是固定的群体称谓；“以色列子孙”既保留原文亲属称谓的形式，也在中文圣经语境中清楚可懂。
- source_word: בְּצֵאתָם מִמִּצְרָיִם
  choice: 出埃及时
  rationale: 带 בְּ 的不定式结构表达时间背景；“出埃及时”简洁自然，并保留出埃及这一历史指涉。
theological_decisions:
- issue: וּבְנֵי יִשְׂרָאֵל 的性别形式与群体意义
  choice: 以色列子孙
  alternative: 以色列人
  rationale: 原文采用阳性复数构词，但作为约定俗成的民族共同体称谓可涵盖全体以色列民。正文保留“子孙”的形式，不将其缩减为仅指成年男性，也不另加原文没有的限定。
- issue: נכה 在叙事中的军事含义
  choice: 击败了他
  alternative: 击杀了他／击倒了他
  rationale: 该动词在战争上下文中语义范围较宽。选择“击败”保留军事胜利这一确定含义，避免仅凭本词把动作具体化为击杀。
translation_notes:
  register: 采用现代、庄重而通顺的叙事汉语。本节在语法上承接申命记4:44—45，并非独立完整句；译文保留其地点铺陈，同时用分号理清长句层次。专名采用简体中文圣经读者较熟悉的传统译名。
