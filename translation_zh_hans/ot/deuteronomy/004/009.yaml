  naturalness: 原句“这些事在你一生的日子里离开你的心”虽可理解，但现代汉语中时间状语与“离开”搭配略显生硬，且容易被读成这些事持续离开。改为“在你有生之年从你心中消失”更自然，并保留原文警告这些事不要从内在记忆与理解中失落的意象。
  terminology: “心”及其脚注说明符合לֵבָב的语义范围；“儿女”和“儿女的儿女”合乎此处בנים的代表性、跨世代用法。脚注锚点分别准确附于“心”和后代称谓。
