  text: רַ֡ק הִשָּׁ֣מֶר לְ/ךָ֩ וּ/שְׁמֹ֨ר נַפְשְׁ/ךָ֜ מְאֹ֗ד פֶּן תִּשְׁכַּ֨ח אֶת הַ/דְּבָרִ֜ים אֲשֶׁר רָא֣וּ עֵינֶ֗י/ךָ וּ/פֶן יָס֨וּרוּ֙ מִ/לְּבָ֣בְ/ךָ֔ כֹּ֖ל יְמֵ֣י חַיֶּ֑י/ךָ וְ/הוֹדַעְתָּ֥/ם לְ/בָנֶ֖י/ךָ וְ/לִ/בְנֵ֥י בָנֶֽי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/009.yaml
  text: Only guard yourself carefully[a], and keep your soul very carefully, lest you forget the things that your eyes saw and lest they depart from your heart all the days of your life. Make them known to your children and to your children's children[b],
translation:
  language: zh_hans
  text: 只是，你要谨慎，格外留意自己，免得忘记你亲眼所见的事，又免得这些事在你有生之年从你心中消失[a]。你要把这些事告诉你的儿女和你儿女的儿女[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文作“你的心”；这里的“心”指人的内在，包括记忆、理解和意志。
    reason: cultural_note
  - marker: b
    text: 也可译作“你的儿子和你儿子的儿子”。原文使用阳性复数词，按语境既可特指儿子，也可泛指儿女或后代。
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: 只是
  rationale: 表达强烈的限制和提醒语气，同时在现代汉语中自然庄重。
- source_word: הִשָּׁמֶר לְךָ וּשְׁמֹר נַפְשְׁךָ מְאֹד
  choice: 你要谨慎，格外留意自己
  rationale: 保留两个同根命令所形成的重复强调；נֶפֶשׁ在这里指整个人、自身，不宜窄化为非物质的“灵魂”。
- source_word: הַדְּבָרִים אֲשֶׁר רָאוּ עֵינֶיךָ
  choice: 你亲眼所见的事
  rationale: דְּבָרִים在可见经历的语境中指“事”；“亲眼所见”自然地保留目击经验的强调。
- source_word: וּפֶן יָסוּרוּ מִלְּבָבְךָ
  choice: 又免得这些事……离开你的心
  rationale: 保留סור的离开意象和“心”的希伯来表达，不将其过度解释为单纯的记忆或思想。
- source_word: וְהוֹדַעְתָּם
  choice: 你要把这些事告诉
  rationale: 使役式ידע表示使人知道；“告诉”在汉语中准确自然，且不额外加入较窄的教学形式。
- source_word: לְבָנֶיךָ וְלִבְנֵי בָנֶיךָ
  choice: 你的儿女和你儿女的儿女
  rationale: בנים在跨世代的盟约语境中可泛指子女或后代；此译法兼顾范围和原文重复结构。
theological_decisions:
- issue: נֶפֶשׁ的人论含义
  choice: 译作“自己”
  alternative: 译作“灵魂”或“性命”
  rationale: 此处指受命谨慎自守的整个人；译为“灵魂”可能无根据地引入较狭窄的身心二分含义。
- issue: “心”的含义
  choice: 保留“心”的意象，并以脚注说明
  alternative: 直接译作“思想”或“记忆”
  rationale: לֵבָב涵盖记忆、理解和意志等内在活动；保留“心”可避免只选定其中一个方面。
- issue: בָנֶיךָ的性别范围
  choice: 译作“儿女”
  alternative: 译作“儿子”
  rationale: 阳性复数在此可代表子女或后代；跨世代传承的命令没有明确限定只传给男性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“只是”承接强烈警告；两个自守命令分别译为“谨慎”和“格外留意自己”，保留重复加强的效果。标点按独立经节处理，以句号收束。
