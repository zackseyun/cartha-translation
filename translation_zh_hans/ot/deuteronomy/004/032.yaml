source:
  edition: WLC
  text: כִּ֣י שְׁאַל נָא֩ לְ/יָמִ֨ים רִֽאשֹׁנִ֜ים אֲשֶׁר הָי֣וּ לְ/פָנֶ֗י/ךָ לְ/מִן הַ/יּוֹם֙ אֲשֶׁר֩ בָּרָ֨א אֱלֹהִ֤ים אָדָם֙ עַל הָ/אָ֔רֶץ וּ/לְ/מִ/קְצֵ֥ה הַ/שָּׁמַ֖יִם וְ/עַד קְצֵ֣ה הַ/שָּׁמָ֑יִם הֲ/נִֽהְיָ֗ה כַּ/דָּבָ֤ר הַ/גָּדוֹל֙ הַ/זֶּ֔ה א֖וֹ הֲ/נִשְׁמַ֥ע כָּמֹֽ/הוּ־־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/032.yaml
  text: 'For ask now about the former days that were before you[a], from the day when God created man on the earth, and from one end of the heavens to the other end of the heavens: has anything happened like this great thing, or has anything been heard like it?'
translation:
  language: zh_hans
  text: 你且查问在你以前的远古岁月：从上帝在地上创造人[a]的那一天起，从天的一端到天的另一端，是否曾发生过这样的大事？是否曾听说过类似的事？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “人”也可译作“人类”。希伯来语 אָדָם 在创造的语境中可以代表整个人类。
    reason: 保留该词在个体形式与全人类代表意义之间的词义空间。
lexical_decisions:
- source_word: שְׁאַל נָא
  choice: 你且查问
  rationale: 祈使式加语气词 נָא 构成郑重而迫切的劝请。“且查问”保留呼吁语气，也符合庄重的现代汉语。
- source_word: לְיָמִים רִאשֹׁנִים
  choice: 远古岁月
  rationale: 该短语指久远的往昔；“远古岁月”自然地传达时间的久远和经文的庄重感。
- source_word: אֲשֶׁר הָיוּ לְפָנֶיךָ
  choice: 在你以前的
  rationale: 保留相对于受话者而言的时间先后关系，不把“你”扩展解释为某一特定世代。
- source_word: לְמִן הַיּוֹם אֲשֶׁר בָּרָא
  choice: 从……的那一天起
  rationale: 清楚标示所追溯历史范围的起点，并保留“日／一天”的源文表达。
- source_word: אֱלֹהִים
  choice: 上帝
  rationale: 在此指独一的创造主；“上帝”是现代标准汉语中清楚而庄重的对应词。
- source_word: אָדָם
  choice: 人
  rationale: 在创造语境中，该单数名词可以代表整个人类。“人”既保留希伯来文的简洁和代表性，也不将其武断地专名化为“亚当”；“人类”作为合理释义列入脚注。
- source_word: עַל הָאָרֶץ
  choice: 在地上
  rationale: 直接、自然地表达处所意义。
- source_word: וּלְמִקְצֵה הַשָּׁמַיִם וְעַד קְצֵה הַשָּׁמָיִם
  choice: 从天的一端到天的另一端
  rationale: 保留两端相对的概括表达，传达遍及全部范围之意，同时避免生硬重复。
- source_word: הֲנִהְיָה
  choice: 是否曾发生过
  rationale: 疑问形式与 היה 在这里询问某事是否曾经出现或发生；“曾”强化其纵观历史的语境。
- source_word: כַּדָּבָר הַגָּדוֹל הַזֶּה
  choice: 这样的大事
  rationale: דבר 在此更可能指事情或事件；“大事”比字面的“大东西”自然，又保留其宽泛性和强调。
- source_word: הֲנִשְׁמַע כָּמֹהוּ
  choice: 是否曾听说过类似的事
  rationale: שׁמע 的被动式在此有“被人听闻、听说”的意思；译文保留修辞问句，并以“类似的事”表达 כָּמֹהוּ。
theological_decisions:
- issue: 创造语境中 אָדָם 的所指
  choice: 人
  alternative: 人类；亚当
  rationale: 本节从创造开始纵览历史，אָדָם 的单数形式可代表全人类。“人”保留原文形式及其代表性；“人类”是可行释义，故以脚注注明。“亚当”会把此处明确限定为专名，而上下文更着眼于人受造这一普遍事件。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“你且查问”保留摩西劝请听众追溯历史的语气；两个并列问句维持原文的修辞力度。
