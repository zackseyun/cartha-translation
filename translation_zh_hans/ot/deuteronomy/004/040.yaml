base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/040.yaml
  text: So you shall keep his statutes and his commandments that I am commanding you today[a], so that it may go well with you and with your children after you[c][b], and so that you may prolong your days on the land that Yahweh your God is giving you for all your days.
translation:
  language: zh_hans
  text: 所以，你要遵守他的律例和诫命，就是我今天吩咐你的，好使你和你以后的子孙生活顺利，并使你在耶和华——你的上帝赐给你的土地上长久居住。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְשָׁמַרְתָּ
  choice: 所以，你要遵守
  rationale: שׁמר在盟约语境中表示遵守、谨守；句首ו承接上文的论证，在汉语中译作“所以”自然表达推论关系。“要”保留此处劝命语气。
- source_word: חֻקָּיו וְאֶת־מִצְוֺתָיו
  choice: 他的律例和诫命
  rationale: “律例”与“诫命”分别对应חֻקִּים和מִצְוֹת，既保持两词区别，也符合庄重而通行的中文圣经用语。
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: 就是我今天吩咐你的
  rationale: 关系从句所修饰的是律例和诫命；“就是”在现代汉语中清楚衔接。“今天”保留摩西当下讲话的时间指向。
- source_word: אֲשֶׁר יִיטַב לְךָ
  choice: 好使你……得福
  rationale: יטב לְ是“情况良好、得着福祉”的习语；“得福”在此简洁自然，表达福祉结果而不把含义缩窄为物质兴旺。
- source_word: וּלְבָנֶיךָ אַחֲרֶיךָ
  choice: 和你后代的儿女
  rationale: בנים字面可指“儿子”，也可泛指儿女或后裔；此处关注代际延续。“后代的儿女”保留具体亲属意象和אַחֲרֶיךָ“在你之后”的时间意味。
- source_word: וּלְמַעַן תַּאֲרִיךְ יָמִים
  choice: 并使你……长久生活
  rationale: 希伯来语直译为“使日子长久”。现代汉语用“长久生活”自然表达长寿、久居的意思，同时避免生硬的“延长日子”。
- source_word: עַל הָאֲדָמָה
  choice: 在……土地上
  rationale: עַל字面为“在……上”，אֲדָמָה在本段指上帝所赐之地；“土地上”兼顾字面意象和自然汉语。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的专名“耶和华”呈现四字神名，而不以称号“主”代替。
- source_word: נֹתֵן לְךָ
  choice: 赐给你的
  rationale: 分词表达上帝正在施行或确定要施行的赐予；定语结构“赐给你的”在汉语中自然，并保留赐予者和受益者。
- source_word: כָּל הַיָּמִים
  choice: 长久生活
  rationale: 短语字面为“所有的日子”，在此加强在所赐土地上长久度日的愿景；与תאריך ימים合译可避免中文重复，同时保留整体时长重点。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用上帝的专名而非称号。中文正文采用广为人知且庄重的“耶和华”，保留其专名性质；“雅威”是依据学界常见拟音的另一可行译法。
- issue: 顺服与福祉、长寿之间的关系
  choice: 按原文保留目的或结果关系
  alternative: 将其解释为无条件保证个人顺遂和长寿
  rationale: 两个目的结构表达遵守诫命所指向的福祉与在地上的长久生活；译文不额外界定这是机械式个人保证，保留申命记盟约语境中的张力。
- issue: בנים的范围
  choice: 儿女，并以“后代的”表达世代延续
  alternative: 儿子／后裔
  rationale: 原词可特指儿子，也可泛指儿女或后裔。上下文强调后续世代，因此正文采用较包容但仍具家庭意象的表达，不将其限于男性。
translation_notes:
  register: 采用现代、庄重且易懂的普通话书面语。保留“律例、诫命、耶和华”等盟约语域词汇；其余句法按现代汉语重组。原文无必须以脚注标示才能保留的关键歧义，因此正文不设脚注。
