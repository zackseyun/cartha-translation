base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/007.yaml
  text: For what great nation is there that has gods so near to it as Yahweh our God is to us whenever we call on him?[a][b]
translation:
  language: zh_hans
  text: 因为，哪一个大国有诸神[a]与它如此亲近，像雅威——我们的上帝——在我们每次向他呼求[b]时亲近我们呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文作“诸神”。本节以反问的方式，将其他民族的神祇与以色列的上帝雅威相比较。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“每当我们呼求他”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，为前面的劝勉说明理由，保留原文的论证关系。
- source_word: מִי גוֹי גָּדוֹל
  choice: 有哪一个大国
  rationale: 以自然的现代汉语表达原文的反问语气。
- source_word: אֲשֶׁר לוֹ אֱלֹהִים
  choice: 它的诸神
  rationale: 原文意为“有诸神的”，而复数谓语 קְרֹבִים 支持将 אֱלֹהִים 理解为列国的诸神。
- source_word: קְרֹבִים אֵלָיו
  choice: 与它如此亲近
  rationale: “它”回指“大国”；“如此”体现比较式反问的强调。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来语传统读音音译上帝的专名，以区别于“主”这一称号。
- source_word: אֱלֹהֵינוּ
  choice: 我们的上帝
  rationale: 这里虽采用复数形态，却按希伯来语惯用法指以色列独一的上帝。
- source_word: בְּכָל קָרְאֵנוּ אֵלָיו
  choice: 每当我们向他呼求
  rationale: בְּכָל 加不定式结构表示每一次发生该行动时；“向他呼求”保留 אֵלָיו 的方向含义。
theological_decisions:
- issue: 如何译写神名 יהוה
  choice: 雅威
  alternative: 耶和华／主
  rationale: 原文直接使用四字神名；“雅威”按较通行的学术复原读音音译，保留其作为专名的性质。
- issue: 首个 אֱלֹהִים 指上帝还是列国的神祇
  choice: 诸神
  alternative: 上帝／神性存在
  rationale: 复数形容词 קְרֹבִים 以及与“雅威我们的上帝”的对比，都支持这里泛指其他民族的神祇；译文不借此断定这些神祇实际存在。
- issue: 补明比较句省略的谓语
  choice: 他就亲近我们
  alternative: 不补出，仅译作“像雅威我们的上帝一样”
  rationale: 希伯来文在比较部分省略了由前文可知的“亲近”关系；汉语补明可避免句意悬空，同时不改变原文所表达的关系。
translation_notes:
  register: 采用现代、庄重而易懂的反问句式。“诸神”保留原文复数，“雅威”保留神名的专名性质；破折号用于自然引出希伯来文比较结构中隐含的说明。
