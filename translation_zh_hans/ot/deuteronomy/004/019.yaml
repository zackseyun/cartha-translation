reference: Deuteronomy 4:19
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וּ/פֶן תִּשָּׂ֨א עֵינֶ֜י/ךָ הַ/שָּׁמַ֗יְמָ/ה וְֽ֠/רָאִיתָ אֶת הַ/שֶּׁ֨מֶשׁ וְ/אֶת הַ/יָּרֵ֜חַ וְ/אֶת הַ/כּֽוֹכָבִ֗ים כֹּ֚ל צְבָ֣א הַ/שָּׁמַ֔יִם וְ/נִדַּחְתָּ֛ וְ/הִשְׁתַּחֲוִ֥יתָ לָ/הֶ֖ם וַ/עֲבַדְתָּ֑/ם אֲשֶׁ֨ר חָלַ֜ק יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ אֹתָ֔/ם לְ/כֹל֙ הָֽ/עַמִּ֔ים תַּ֖חַת כָּל הַ/שָּׁמָֽיִם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/019.yaml
  text: And beware lest you lift up your eyes to heaven[a], and when you see the sun and the moon and the stars—all the host of heaven—you be drawn away and bow down to them and serve them[b], which Yahweh your God has allotted to all the peoples under all the heavens.
translation:
  language: zh_hans
  text: 也要谨慎，免得你举目望天，看见太阳、月亮和星辰，就是天上的万象，便受引诱，向它们下拜，事奉它们。耶和华你的神把它们分配[a]给普天下[b]的万民。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “分配”也可译作“分派”或“分给”。原文说耶和华把这些分配给万民，但这句话本身并没有说他准许万民敬拜它们。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“在所有诸天之下”；这里用“普天下”表达同一范围。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפֶן
  choice: 也要谨慎，免得
  rationale: פֶן引出所警戒的可能后果；结合上下文，用“谨慎，免得”自然表达劝诫语气。
- source_word: תִּשָּׂא עֵינֶיךָ הַשָּׁמַיְמָה
  choice: 你举目望天
  rationale: 保留希伯来语“举起眼睛”的形象，同时符合现代汉语习惯。
- source_word: הַשֶּׁמֶשׁ וְאֶת הַיָּרֵחַ וְאֶת הַכּוֹכָבִים
  choice: 太阳、月亮和星辰
  rationale: 直接、清楚地对应所列举的天体；“星辰”保持庄重语体。
- source_word: כֹּל צְבָא הַשָּׁמַיִם
  choice: 天上的万象
  rationale: צָבָא本义可指军队或大队，此处统称众天体；“天上的万象”在汉语中自然，也不把所指误限为天使。
- source_word: וְנִדַּחְתָּ
  choice: 便受引诱
  rationale: 该词的Niphal形式在此表示被带偏、被引入歧途；“受引诱”保留其被动意味，又不夸大为强制。
- source_word: וְהִשְׁתַּחֲוִיתָ לָהֶם
  choice: 向它们下拜
  rationale: 保留俯伏下拜这一具体动作，并与随后“事奉”共同表达偶像崇拜。
- source_word: וַעֲבַדְתָּם
  choice: 事奉它们
  rationale: עבד在敬拜语境中可指宗教性的服事；“事奉”既保留词义，也显明其敬拜含义。
- source_word: אֲשֶׁר חָלַק
  choice: 把它们分配
  rationale: חלק表示划分、分派或分给；“分配”保留原文的分派含义，不擅自说明这是否涉及准许敬拜。
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: 耶和华你的神
  rationale: 以通行的中文形式“耶和华”呈现神名，并保留第二人称单数的盟约性称呼。
- source_word: לְכֹל הָעַמִּים תַּחַת כָּל הַשָּׁמָיִם
  choice: 给普天下的万民
  rationale: “万民”对应复数עַמִּים；“普天下”以自然汉语表达“在所有诸天之下”的普遍范围。
theological_decisions:
- issue: “耶和华你的神把它们分配给……万民”是否表示神准许万民敬拜天体
  choice: 保留“分配”这一表述，不增添神准许天体崇拜的意思
  alternative: 明确译成神把天体赐给万民使用，或神任凭万民敬拜天体
  rationale: חלק本身表达分配或分派，但本节并未明说这种分配的具体目的；上下文又明确禁止偶像崇拜。因此译文保留原有张力，不把任何一种解释写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“举目望天”“天上的万象”“下拜、事奉”保留原文意象和敬拜动作；句法略作调整，使警戒及其后果在汉语中清晰连贯。
