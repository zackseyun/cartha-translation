base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/043.yaml
  text: Bezer in the wilderness[a], in the land of the tableland, for the Reubenite; and Ramoth in Gilead for the Gadite; and Golan in Bashan for the Manassite.
translation:
  language: zh_hans
  text: 即：在旷野、在高原之地[a]的比悉，归吕便人；在基列的拉末，归迦得人；在巴珊的哥兰，归玛拿西人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“平原之地”。希伯来语指平坦地带或台地；这里所指的是约旦河东的高地。
    reason: 保留מִישֹׁר的词义范围，并说明选择“高原之地”的地理依据。
lexical_decisions:
- source_word: בֶּצֶר
  choice: 比悉
  rationale: 采用现代中文圣经中通行的地名译法，指约旦河东的一座城。
- source_word: בַּמִּדְבָּר
  choice: 旷野中
  rationale: מִדְבָּר可指旷野、荒野或开阔的草原地带；“旷野”既符合本地地理背景，也保留常见的圣经地理用语。
- source_word: בְּאֶרֶץ הַמִּישֹׁר
  choice: 高原之地
  rationale: מִישֹׁר指平坦地带或台地；此处位于约旦河东的高地，用“高原之地”比容易使人联想到低洼地带的“平原”更准确。
- source_word: לָרֻאוּבֵנִי
  choice: 归吕便人
  rationale: 希伯来文使用单数族称，按支派归属理解；中文以集合意义的“吕便人”自然表达，并用“归”体现介词ל的归属或受益关系。
- source_word: רָאמֹת
  choice: 拉末
  rationale: 采用通行中文地名译法。
- source_word: בַּגִּלְעָד
  choice: 基列的
  rationale: 将地域名译作“基列”，并以“的”自然表达该城位于基列。
- source_word: לַגָּדִי
  choice: 归迦得人
  rationale: 保留与“归吕便人”“归玛拿西人”平行的支派归属表达。
- source_word: גּוֹלָן
  choice: 哥兰
  rationale: 采用通行中文地名译法。
- source_word: בַּבָּשָׁן
  choice: 巴珊的
  rationale: 将地域名译作“巴珊”，以“的”自然表达哥兰所在地区。
- source_word: לַמְנַשִּׁי
  choice: 归玛拿西人
  rationale: 希伯来文为单数族称，中文用集合意义的“玛拿西人”，并维持三项列举的平行结构。
- source_word: אֶת ... וְאֶת ... וְאֶת
  choice: 以三项并列结构表达
  rationale: אֶת是直接宾语标记，中文无须逐一对应；其句法作用由三座城的并列列举体现。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的书面语。经文本身承接上一节，故以“即”引出三座城；用分号清楚呈现三组地点与支派的对应关系。
