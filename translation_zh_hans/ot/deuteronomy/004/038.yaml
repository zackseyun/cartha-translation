source:
  edition: WLC
  text: לְ/הוֹרִ֗ישׁ גּוֹיִ֛ם גְּדֹלִ֧ים וַ/עֲצֻמִ֛ים מִמְּ/ךָ֖ מִ/פָּנֶ֑י/ךָ לַ/הֲבִֽיאֲ/ךָ֗ לָֽ/תֶת לְ/ךָ֧ אֶת אַרְצָ֛/ם נַחֲלָ֖ה כַּ/יּ֥וֹם הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/038.yaml
  text: to drive out before you nations greater and mightier than you[a], to bring you in, to give you their land as an inheritance[b], as it is this day.
translation:
  language: zh_hans
  text: 要从你面前赶走比你更大、更强盛的列国[a]，领你进入那地，把他们的土地赐给你作产业，正如今日所见[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “赶走”也可译作“剥夺……的土地”。希伯来语动词在这里含有除去原有居民、使另一方得地为业的意思。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语直译为“正如这日”，意思是“正如今日已经显明的”或“正如今日的情形”。
    reason: idiom
lexical_decisions:
- source_word: לְהוֹרִישׁ
  choice: 赶走
  rationale: 使役式在此以“列国”为宾语，表示赶走或剥夺原有居民的土地，使另一方得地为业。“赶走”自然清楚，同时由后文“赐给你作产业”保留土地转归的含义。
- source_word: גּוֹיִם
  choice: 列国
  rationale: 该词指不同的民族—政治群体；“列国”符合申命记的语境，庄重而不额外加入宗教身份含义。
- source_word: גְּדֹלִים וַעֲצֻמִים מִמְּךָ
  choice: 比你更大、更强盛
  rationale: מִמְּךָ明确构成比较；“更大、更强盛”兼顾规模与实力，符合军事和政治语境。
- source_word: מִפָּנֶיךָ
  choice: 从你面前
  rationale: 保留希伯来语的空间表达，指把那些列国从以色列面前除去。
- source_word: לַהֲבִיאֲךָ
  choice: 领你进入那地
  rationale: 使役式表示带领进入；目的地由上下文及紧接着的“他们的土地”明确，补出“那地”可使现代汉语完整自然。
- source_word: לָתֶת לְךָ אֶת אַרְצָם
  choice: 把他们的土地赐给你
  rationale: “赐给”准确表达上帝主动给予土地，并保持受益者“你”的位置和意义。
- source_word: נַחֲלָה
  choice: 作产业
  rationale: 该词表示承受而得、可持有传承的土地。“产业”是现代中文圣经语域中简洁而有分量的表达，也避免把含义仅限于个人死后继承。
- source_word: כַּיּוֹם הַזֶּה
  choice: 正如今日所见
  rationale: 这是申命记常见的表达，指当下已经显明的事实；“所见”以自然汉语传达其证据性语气。
theological_decisions:
- issue: נַחֲלָה所表达的圣约土地身份
  choice: 作产业
  alternative: 作基业；作所有之地
  rationale: “产业”既保留土地是上帝所赐、由百姓承受的含义，也不过度解释其后续继承制度；“所有之地”会削弱承受恩赐的神学分量。
- issue: 赶出列国与赐地之间的关系
  choice: 保留“赶走……领你进入……赐给你”三个并列目的
  alternative: 合并为“赶走列国，使你承受他们的土地”
  rationale: 原文连续使用三个不定式，既呈现除去原居民，也呈现带领以色列进入和赐地；分别译出可避免把这几个行动简化为单一概念。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“列国”“产业”保留申命记的土地与民族语境；“领你进入那地”补足汉语所需的目的地，但不添加原文以外的具体地名。
