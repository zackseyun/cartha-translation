base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/037.yaml
  text: And because he loved your fathers and chose their offspring after them[a], he brought you out of Egypt by his presence[b], by his great power.
translation:
  language: zh_hans
  text: 又因他爱你的祖先，拣选了他们之后的后裔[a]，便凭着他亲自的临在[b]，用他的大能，将你从埃及带出来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他的后裔，在他以后。”希伯来文使用单数后缀，可能把“你的祖先”作为一个集合整体来看。
    reason: lexical_alternative
  - marker: b
    text: 字面可译：“以他的面”或“在他面前”；这里表达上帝亲自临在，带领你从埃及出来。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְתַחַת כִּי
  choice: 又因
  rationale: 该短语在这里说明前文之事的缘由；“又因”既保留承接和因果关系，也符合现代汉语表达。
- source_word: אָהַב
  choice: 爱
  rationale: 直接表达动词的基本意义，不额外加入“专爱”等原文未明说的限定。
- source_word: אֲבֹתֶיךָ
  choice: 你的祖先
  rationale: 指以色列的先祖；“祖先”在现代汉语中自然清楚。希伯来语为阳性复数，但汉语在此通常不作性别标记。
- source_word: וַיִּבְחַר
  choice: 拣选了
  rationale: “拣选”能自然表达 בחר 的选择之意，并保留本节的立约语境，同时不采用更技术化的神学术语。
- source_word: בְּזַרְעוֹ אַחֲרָיו
  choice: 他们后来的后裔
  rationale: זֶרַע 是集合性名词，可指后裔；“后来的后裔”保留时间和世代承继关系。上下文的“祖先”为复数集合所指，正文据此采用“他们”，并以脚注保存原文单数后缀。
- source_word: וַיּוֹצִאֲךָ
  choice: 将你……领出来
  rationale: 使役式在出埃及语境中表示使之出来；“领出来”自然传达上帝施行带领和解救的行动。
- source_word: בְּפָנָיו
  choice: 以自己的临在
  rationale: 字面与“面”有关，在本语境中表达上帝本身的同在和亲自施行拯救；该译法保留介词的工具性表达，并用脚注交代字面可能。
- source_word: בְּכֹחוֹ הַגָּדֹל
  choice: 用他的大能
  rationale: כֹּחַ 表示力量或能力；“大能”简洁庄重，且“用”准确呈现此处的工具性介词。
- source_word: מִמִּצְרָיִם
  choice: 从埃及
  rationale: 与“领出来”连用，清楚表达离开埃及的出离方向。
theological_decisions:
- issue: “他的后裔、在他以后”中的单数后缀如何对应复数的“祖先”
  choice: 正文译作“他们后来的后裔”
  alternative: “他的后裔，在他以后”
  rationale: 马所拉文本的后缀为单数，但其先行词“你的祖先”是复数，可被集合性地理解。正文采用符合汉语指代习惯的复数，不暗示只指某一位祖先；脚注保留原文形式上的单数。
- issue: בְּפָנָיו 在本节中的意义
  choice: 以自己的临在
  alternative: 在他面前；以他的面
  rationale: 该短语字面涉及“面”，但在出埃及语境中可表达上帝自己的临在。正文保留上帝亲自施行拯救的含义，同时不把它改写为特定神学体系中的技术表述；脚注注明字面译法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“祖先”比“列祖”更符合当代通用表达；“拣选”保留经文语体但并不晦涩。句中两个工具性短语“以自己的临在”“用他的大能”保持平行，并保留原文的神学张力和脚注所示的字面歧义。
