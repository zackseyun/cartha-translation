base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/039.yaml
  text: So know today[a], and take it to your heart, that Yahweh, he is God in the heavens above and on the earth beneath[b]; there is no other.
translation:
  language: zh_hans
  text: 因此，今天你要知道，也要记在心里：天上地下，惟有雅威是上帝；除他以外，再没有别的上帝。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיָדַעְתָּ הַיּוֹם
  choice: 所以，今天你要知道
  rationale: 完成式在本段语境中带劝勉意味；译作“你要知道”自然表达命令性的劝告。“所以”承接摩西此前所陈述的论证。
- source_word: וַהֲשֵׁבֹתָ אֶל־לְבָבֶךָ
  choice: 也要铭记在心
  rationale: 字面近于“使之回到你的心里”，是指内心确认、认真领会并持守；“铭记在心”保留“心”的意象，同时符合现代汉语表达。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文四字神名作音译，不以称号替代，以保留经文中的专名性质。
- source_word: הוּא הָאֱלֹהִים
  choice: 就是上帝
  rationale: 独立代词 הוּא 带强调作用；“就是”既自然，又保留“雅威，他是上帝”的辨认与强调语气。
- source_word: בַּשָּׁמַיִם מִמַּעַל וְעַל־הָאָרֶץ מִתָּחַת
  choice: 在上面的天和下面的地上都是如此
  rationale: 保留“上面的天／下面的地”这一涵盖宇宙全域的对举；补出“都是如此”使汉语谓语关系清楚，而不增添新的神学内容。
- source_word: אֵין עוֹד
  choice: 再没有别的
  rationale: 简洁保留原文绝对排他的断言；“别的”所指由前句“上帝”自然确定，不扩写为后期教义表述。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名。采用较贴近通常学术重构读音的“雅威”，保留其为以色列之上帝专名的性质；脚注说明传统译名，以方便读者辨认。
- issue: הוּא 的强调作用
  choice: 雅威就是上帝
  alternative: 雅威是上帝
  rationale: “就是”传达独立代词所带的强调和认定意味，但不把经文扩展成超出原句的系统神学命题。
- issue: אֵין עוֹד 的排他性
  choice: 再没有别的
  alternative: 除他以外，再没有别的上帝
  rationale: 所选译文保留原文简短而绝对的排他宣告，也保留“别的”在形式上的省略，不额外补入原文未明说的名词。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“铭记在心”保留希伯来文的心灵意象；“上面的天和下面的地”维持原文上下对举，整句避免古奥文言和宗派性术语。
