revisions:
- from: 所以，今天你要知道，也要铭记在心[a]：雅威[b]就是上帝，在上面的天和下面的地上都是如此；再没有别的。
  to: 因此，今天你要知道，也要记在心里：天上地下，惟有雅威是上帝；除他以外，再没有别的上帝。
  rationale: 修订使“天上地下”的范围直接修饰雅威独一为上帝的宣告，避免“都是如此”的指代松散。“记在心里”保留原文“心”的意象及内化、领受的含义。末句补出“上帝”以符合现代汉语的完整表达，所传达的排他性不超过原文 אֵין עוֹד。脚注 a 保留并澄清字面替代译法；脚注 b 保留神名说明。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T04:57:15Z'
review_pass:
  verdict: revise
  source_fidelity: 核心意思准确：经文是劝勉人今日认识并内心领受雅威在天上地下独一为神。原译的“在上面的天和下面的地上都是如此”虽可理解，却把“雅威是上帝”处理成泛指的“都是如此”，较弱地表达了原文直接的宇宙性断言。
  naturalness: “铭记在心”自然，但“在上面的天和下面的地上都是如此”在现代汉语中指向略松，读者可能不易立即看出其谓语是“雅威就是上帝”。改为“天上地下，惟有……”更简明、庄重且关系清楚。
  terminology: “雅威”与既定神名政策一致；“上帝”适合这里的 הָאֱלֹהִים。为使汉语中的排他断言完整明确，可在末句补出由上下文决定的“上帝”，不改变原文的独一性主张。
  issues:
  - severity: medium
    issue: 空间短语与谓语的关系表达不够直接
    rationale: “在上面的天和下面的地上都是如此”容易被理解为前述命题在各处成立，而未清楚表达原文“雅威在天上地下是上帝”的直接宣告。
  - severity: low
    issue: “再没有别的”在汉语中宾语省略后略显悬空
    rationale: 希伯来文可省略名词，但现代汉语补作“别的上帝”能使独一性断言完整清晰；所补名词由前句“上帝”直接限定。
  revised_text: 因此，今天你要知道，也要记在心里：天上地下，惟有雅威是上帝；除他以外，再没有别的上帝。
  revised_footnotes:
  - marker: a
    text: 希伯来文直译近于“使它回到你心里”或“放在心上”，指在内心确认、领会并持守这事实。
    reason: lexical_alternative
  - marker: b
    text: “雅威”音译希伯来文上帝的名 יהוה；传统中文常译作“耶和华”。
    reason: divine_name
  revision_rationale: 修订使“天上地下”的范围直接修饰雅威独一为上帝的宣告，避免“都是如此”的指代松散。“记在心里”保留原文“心”的意象及内化、领受的含义。末句补出“上帝”以符合现代汉语的完整表达，所传达的排他性不超过原文 אֵין עוֹד。脚注 a 保留并澄清字面替代译法；脚注 b 保留神名说明。
