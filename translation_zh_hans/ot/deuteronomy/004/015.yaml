source:
  edition: WLC
  text: וְ/נִשְׁמַרְתֶּ֥ם מְאֹ֖ד לְ/נַפְשֹׁתֵי/כֶ֑ם כִּ֣י לֹ֤א רְאִיתֶם֙ כָּל תְּמוּנָ֔ה בְּ/י֗וֹם דִּבֶּ֨ר יְהוָ֧ה אֲלֵי/כֶ֛ם בְּ/חֹרֵ֖ב מִ/תּ֥וֹךְ הָ/אֵֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/015.yaml
  text: So watch yourselves very carefully[b][a], since you saw no form on the day Yahweh spoke to you at Horeb from the midst of the fire.
translation:
  language: zh_hans
  text: 所以，你们务要格外谨慎自守[a]，因为耶和华在何烈从火中对你们说话的那一天，你们没有看见任何形体[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语直译近于“要为你们自己极其谨慎地守护自己”，意思是务必高度警醒、小心防备。
    reason: lexical_alternative
  - marker: b
    text: “形体”也可译作“形像”、“样式”或“形象”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִשְׁמַרְתֶּם מְאֹד לְנַפְשֹׁתֵיכֶם
  choice: 所以，你们务要格外谨慎自守
  rationale: 希伯来语直译近于“你们要为自己的性命极其谨慎守护自己”，整体是要求人高度警醒、自我防备的惯用表达。“务要格外谨慎自守”保留警告力度，并避免把 נֶפֶשׁ 误解为在此专指与身体相分离的“灵魂”。
- source_word: כִּי
  choice: 因为
  rationale: 此处引出谨慎自守的理由；“因为”清楚表达因果关系。
- source_word: לֹא רְאִיתֶם כָּל תְּמוּנָה
  choice: 你们没有看见任何形体
  rationale: תְּמוּנָה 可指可见的形体、样式或形像；“形体”保留词义幅度，也符合下文禁止为耶和华制造可见表象的论证，而不预先将其限缩为人工偶像。
- source_word: בְּיוֹם דִּבֶּר יְהוָה אֲלֵיכֶם
  choice: 耶和华……对你们说话的那一天
  rationale: 保留 בְּיוֹם 的“那一天”这一时间表达，并按 אֶל 的通常用法译作“对你们说话”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经语境中对四字神名的通行专名译法，保留其作为名字而非普通称号的功能。
- source_word: בְּחֹרֵב
  choice: 在何烈
  rationale: “何烈”是该地名在现代中文圣经传统中的通行音译；介词按地点自然译为“在”。
- source_word: מִתּוֹךְ הָאֵשׁ
  choice: 从火中
  rationale: 简洁而准确地表达“从火的中间/里面”，保留声音来自火中的场景。
theological_decisions:
- issue: לְנַפְשֹׁתֵיכֶם 中 נֶפֶשׁ 的人论含义
  choice: 按反身惯用语处理，译为“谨慎自守”
  alternative: “谨慎守护你们的灵魂”或“为你们的性命谨慎”
  rationale: 本句重点是极其谨慎地防备自己，并非有意区分灵魂与身体；采用反身表达可避免加入经文本身未强调的人论主张。
- issue: 何烈显现中 תְּמוּנָה 的含义
  choice: 形体
  alternative: 形像、样式、形象
  rationale: 经文强调以色列人听见耶和华说话，却没有看见可见形体。“形体”保留这一要点，同时不把该词过早限定为已经制成的偶像。
- issue: 四字神名 יְהוָה 的表达
  choice: 耶和华
  alternative: 上主、永恒主
  rationale: 以专名形式呈现原文的神名，避免用普通称号取代；采用中文读者熟悉的标准译名。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“务要”保留申命记劝诫语气的力度；“谨慎自守”自然呈现希伯来语的反身警戒表达。句法保留“那一天”的时间框架，并以“从火中”简明再现何烈显现的场景。
