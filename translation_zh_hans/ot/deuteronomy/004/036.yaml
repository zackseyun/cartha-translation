base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/036.yaml
  text: From heaven he made you hear his voice to discipline you[a], and on earth he showed you his great fire[b], and you heard his words from the midst of the fire.
translation:
  language: zh_hans
  text: 他从天上使你听见他的声音，为要管教你[a]；在地上，他使你看见他那大火；你也从火中[b]听见了他的话。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“教导你”或“惩戒你”。希伯来语这个词兼有纠正、训练和教导的意味。
    reason: lexical_alternative
  - marker: b
    text: 也可译：“从火焰当中”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן הַשָּׁמַיִם
  choice: 从天上
  rationale: 自然表达来源，并与下句“在地上”形成原文鲜明的空间对照。
- source_word: הִשְׁמִיעֲךָ אֶת קֹלוֹ
  choice: 使你听见他的声音
  rationale: 保留使役词形的意义，也保留神以“声音”自我启示的具体表述。
- source_word: לְיַסְּרֶךָּ
  choice: 为要管教你
  rationale: “管教”兼有纠正、训练和教导的意味，较能涵盖 יסר 在此处的形成性与纠正性。
- source_word: וְעַל הָאָרֶץ הֶרְאֲךָ
  choice: 在地上，他使你看见
  rationale: “在地上”与“从天上”相对；“使你看见”明确保留希伯来语使役形式。
- source_word: אֶת אִשּׁוֹ הַגְּדוֹלָה
  choice: 他的熊熊烈火
  rationale: 以自然、庄重的现代汉语表达“大火”的强烈视觉效果，同时保留所属关系“他的”。
- source_word: וּדְבָרָיו שָׁמַעְתָּ
  choice: 你也……听见了他的话
  rationale: 保留“话”的复数集合意义及实际听见的陈述；“也”承接前面的视觉启示。
- source_word: מִתּוֹךְ הָאֵשׁ
  choice: 从火中
  rationale: 准确而简洁地表达“从火焰内部／当中而来”，并保持中文流畅。
theological_decisions:
- issue: לְיַסְּרֶךָּ 所表达的神圣教养目的
  choice: 为要管教你
  alternative: 为要教导你／为要惩戒你
  rationale: “管教”不把语义仅限于传授知识或施加惩罚，而保留纠正与塑造并存的张力。
- issue: 神自我启示的具体性语言
  choice: 他的声音……他的熊熊烈火……他的话
  alternative: 将这些表达抽象化为“启示”
  rationale: 原文用声音、火和话等具体意象描写神的显现，应照其表述保留，不作神学化改写。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“使你听见／使你看见”刻意保留原文的使役语气；分号呈现天上与地上的平行对照。
