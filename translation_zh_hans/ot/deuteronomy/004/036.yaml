  to: 他从天上使你听见他的声音，为要管教你[a]；在地上，他使你看见他那大火；你也从火中[b]听见了他的话。
  rationale: 修订仅收束“熊熊”所添加的火势意象，以“他那大火”对应“他的巨大之火”，并调整脚注 b 的说明性质；其余译文保留。
