base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/031.yaml
  text: For Yahweh your God is a compassionate God[c][b][a]; he will not abandon you or destroy you or forget the covenant of your fathers that he swore to them.
translation:
  language: zh_hans
  text: 因为耶和华你的上帝是有怜悯的上帝[a]；他不会撇下你[b]，不会毁灭你，也不会忘记他向你列祖[c]所起誓的约。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “有怜悯的”也可译作“慈悲的”。
    reason: lexical_alternative
  - marker: b
    text: “撇下”也可译作“放开”或“离弃”。
    reason: lexical_alternative
  - marker: c
    text: “列祖”指以色列承受盟约应许的先祖；也可译作“祖先”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，为前面的劝诫与应许说明理由；“因为”自然保留解释性的逻辑关系。
- source_word: אֵל רַחוּם
  choice: 有怜悯的上帝
  rationale: רַחוּם兼有怜悯、慈悲与体恤之意；“有怜悯”语言庄重而易懂，并保留谓语结构。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者最熟悉的专名形式呈现四字神名，而不以“主”这一称号替代。
- source_word: אֱלֹהֶיךָ
  choice: 你的上帝
  rationale: 保留第二人称单数和盟约关系中的直接称呼。
- source_word: לֹא יַרְפְּךָ
  choice: 他不会撇下你
  rationale: רפה的使役式在此表示松手、不再扶持或离弃；“撇下”既自然，也保留关系性的含义。
- source_word: וְלֹא יַשְׁחִיתֶךָ
  choice: 不会毁灭你
  rationale: שׁחת使役式在本段盟约警告的语境中直接指毁灭。
- source_word: וְלֹא יִשְׁכַּח אֶת־בְּרִית
  choice: 也不会忘记……所立的约
  rationale: 保留“忘记”这一原文的重要盟约用语；中文以“所立的约”明确自然地表达关系。
- source_word: אֲבֹתֶיךָ
  choice: 你列祖
  rationale: “列祖”准确表达以色列历史中承受盟约应许的先祖，也保留原文阳性、历史特定的指向。
- source_word: אֲשֶׁר נִשְׁבַּע לָהֶם
  choice: 他向……起誓所立的
  rationale: 保留נשבע的正式起誓含义，并按现代汉语语序将关系从句前置修饰“约”。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用神的专名而非“主”这一称号；“耶和华”是现代中文圣经传统中最广为人知的专名形式，同时可由脚注提示另一种音译。
- issue: אֲבֹתֶיךָ所指的盟约对象
  choice: 你列祖
  alternative: 你的祖先
  rationale: 本处不是泛指所有祖先，而是特指上帝曾向其起誓的以色列盟约先祖；“列祖”保留这一历史与神学特定性。
- issue: 不忘记盟约的表述
  choice: 不会忘记……约
  alternative: 不会忽略……约
  rationale: 原文明确使用“忘记”，应保留其拟人化而重要的盟约语言，不把它弱化为“忽略”或“背弃”。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“耶和华你的上帝”保留希伯来语紧密的盟约称谓；三个“不会”形成清楚的平行节奏。脚注标记均置于正文相关词语之后。
