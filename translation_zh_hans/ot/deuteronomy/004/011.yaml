revisions:
- from: 你们走近，站在山脚下；山上烈火熊熊，直烧到天心[a]，四周是黑暗、密云和幽暗[b]。
  to: 你们走近，站在山脚下；那山正被火焚烧，直到天的深处[a]，有黑暗、云和幽暗[b]。
  rationale: 修订使空间习语在现代汉语中清楚自然，同时以脚注保留希伯来文“心”的形象及其未完全限定的含义。末尾恢复“黑暗、云、幽暗”三项的词义界限，并删除原文没有的“四周”限定。“正被火焚烧”准确表达山持续燃烧的状态，且保留明确的“火”。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T04:57:03Z'
review_pass:
  verdict: revise
  source_fidelity: “山脚下”恰当地表达了 תַּחַת הָהָר 的地形含义；火焰、黑暗、云和浓暗的基本意象也都有保留。但“密云”把原文普通的“云”（עָנָן）强化为浓密之云，且“三项”前的“四周是”增添了原文未明说的空间范围。“天心”虽试图保留字面意象，却不是现代汉语中自然、清晰的空间表达，容易造成理解障碍。
  naturalness: 原文整体庄重流畅，但“天心”生硬且含义不明；“四周是”虽顺口，却使末尾名词串带有译者补入的环境定位。改为“直到天的深处”自然，并在脚注保留“诸天的心”的字面表达及其语义弹性。
  terminology: “幽暗”可对应 עֲרָפֶל，并与“黑暗”形成区分。将“密云”改为“云”，避免把浓厚、深暗的语义从 עֲרָפֶל 转移到 עָנָן。
  issues:
  - severity: medium
    issue: “天心”不适合作为正文的现代汉语空间表达。
    rationale: לֵב הַשָּׁמַיִם 字面为“诸天的心”，是表示天空深处、中央或高处的习语；“天心”在现代汉语中不够透明，难以自然传达该空间含义。
  - severity: medium
    issue: “密云”无根据地强化了 עָנָן。
    rationale: 原文 עָנָן 仅为“云”；浓暗、厚重的意象由末项 עֲרָפֶל 承担。译作“云”能更准确保留三项并列的分别。
  - severity: low
    issue: “四周是”加入了原文未明说的空间限定。
    rationale: 原文在“直到天的深处”后直接并列“黑暗、云和幽暗”；不宜明确限定为环绕四周。
