base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/011.yaml
  text: And you came near and stood at the foot of the mountain[a], while the mountain was burning with fire up to the heart of the heavens—darkness, cloud[b], and thick gloom.
translation:
  language: zh_hans
  text: 你们走近，站在山脚下；那山正被火焚烧，直到天的深处[a]，有黑暗、云和幽暗[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “天的深处”直译为“诸天的心”，可指天空的中央、高处或深处。
    reason: lexical_alternative
  - marker: b
    text: “幽暗”也可译作“浓重的黑暗”或“深暗”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּקְרְבוּן
  choice: 你们走近
  rationale: 该词是קרב的Qal叙事形式，表示向目标接近；“走近”自然地保留了朝山靠近的动作。
- source_word: וַתַּעַמְדוּן תַּחַת הָהָר
  choice: 站在山脚下
  rationale: עמד意为“站立”；תחת在山岳地形语境中指山的下方或根基处，译作“山脚下”比字面的“山下”更清楚自然。
- source_word: בֹּעֵר בָּאֵשׁ
  choice: 烈火熊熊
  rationale: 分词בֹּעֵר表达持续燃烧的状态，且原文明确提到火；“烈火熊熊”保留持续、强烈而鲜明的景象。
- source_word: עַד לֵב הַשָּׁמַיִם
  choice: 直烧到天心
  rationale: לֵב直译为“心”，在此指天空的中央或高处；“天心”保留原文意象和诗性，同时以脚注说明其惯用含义。
- source_word: חֹשֶׁךְ עָנָן וַעֲרָפֶל
  choice: 黑暗、密云和幽暗
  rationale: 三个名词层叠描写神显时遮蔽、令人敬畏的环境；“密云”体现云层的浓重，“幽暗”与前面的“黑暗”有所区分，并保留עֲרָפֶל含义上的弹性。
theological_decisions:
- issue: 西奈山神显景象的表达
  choice: 保留火、黑暗、云和幽暗的具体而层叠的意象
  alternative: 将末尾各词概括为普通的恶劣天气现象
  rationale: 原文是在描写令人敬畏的神显，并非单纯报告天气；译文不淡化其神学分量，也不额外解释这些现象的象征意义。
- issue: “天心”的空间含义
  choice: 正文保留原文“心”的意象，并以脚注说明
  alternative: 正文直接译作“天空高处”或“半空”
  rationale: 原文表达可指天的中央或高处；保留“天心”可避免武断限定其具体空间位置，同时让现代读者借脚注理解。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“烈火熊熊”使持续燃烧的状态自然可感；“天心”有意保留希伯来文的具体意象。末尾用“黑暗、密云和幽暗”维持三项并列及其层次感。
