  yaml_path: translation/ot/deuteronomy/004/024.yaml
  text: For Yahweh your God is a consuming fire[a], a jealous God.
translation:
  language: zh_hans
  text: 因为耶和华你的上帝是吞噬的烈火，是忌邪[a]的上帝。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “忌邪”也可译作“嫉妒”或“热忱”。希伯来语在此强调耶和华对自己子民专一的立约权利，尤其不容他们敬拜偶像。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文的警告并说明理由；现代汉语用“因为”自然保留其因果、解释作用。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名“耶和华”呈现四字神名，不以称号替代。
- source_word: אֱלֹהֶיךָ
  choice: 你的上帝
  rationale: 保留第二人称阳性单数后缀所表达的直接、立约性称呼。
- source_word: אֵשׁ אֹכְלָה
  choice: 吞噬的火
  rationale: 保留名词与主动分词构成的鲜明谓语意象；“吞噬”同时传达火焚毁、消灭的动态力量。
- source_word: הוּא
  choice: 是
  rationale: 希伯来语独立代词具有强调作用；汉语以判断句“是”自然表达谓语关系，不生硬重复“他”。
- source_word: אֵל
  choice: 上帝
  rationale: 此处是与前句并列的神性称号；译为“上帝”既自然，也与“你的上帝”保持一致。
- source_word: קַנָּא
  choice: 忌邪的
  rationale: 在偶像崇拜的语境中，该词强调上帝对其子民专一敬拜的立约要求，以及不容竞争者的热忱；“忌邪”保留这种关系性张力。
theological_decisions:
- issue: 如何翻译上帝的“嫉妒”属性
  choice: 忌邪的上帝
  alternative: 嫉妒的上帝；热忱的上帝
  rationale: “忌邪”在现代中文宗教语境中较自然地表达上帝不容偶像与 rival worship 的立约专一要求，也避免把该词误读为人性中卑劣的妒忌；脚注保留“嫉妒/热忱”的词义张力，不将其淡化为一般热心。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“吞噬的火”保留原文强烈隐喻；“忌邪”沿用中文读者可理解的圣经表达，并以脚注澄清其立约专一与热忱的含义。段末标记 פ 不进入正文。
