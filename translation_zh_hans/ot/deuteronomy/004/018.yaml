  text: the form of any creeping thing on the ground[b][a], the form of any fish that is in the waters under the earth.
translation:
  language: zh_hans
  text: 地上任何一种爬行动物的样式[a]，地底下的水中任何一种鱼的样式[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “样式”或译“形状”或“形象”（希伯来文תַּבְנִית）。
    reason: lexical_alternative
  - marker: b
    text: “地底下的水中”呼应圣经中表示陆地以下之水的惯用说法；参出埃及记20:4禁造偶像的措辞。
    reason: cross_reference
lexical_decisions:
- source_word: תַּבְנִית
  choice: 形状
  rationale: 此词在禁止制造偶像的语境中，指受造物可见、可供仿造的外形。“形状”自然地保留这一含义，又不擅自限定为某种雕刻的偶像；原文两次重复此词，译文也相应重复。
- source_word: כָּל
  choice: 任何一种
  rationale: 与单数类属名词连用时表达周遍、分配之意；“任何一种”在禁令语境中自然地表明无一类别例外。
- source_word: רֹמֵשׂ
  choice: 爬行动物
  rationale: 该词指在地面爬行或移动的生物。“爬行动物”是现代汉语中易懂的类称；此处并非严格采用现代生物分类学定义。
- source_word: בָּאֲדָמָה
  choice: 地上
  rationale: אֲדָמָה在此指这些生物活动的土地或地面；“地上”简洁自然。
- source_word: דָּגָה
  choice: 鱼
  rationale: 该名词在此作集合性类称；汉语“鱼”同样可以泛指鱼类。
- source_word: אֲשֶׁר בַּמַּיִם
  choice: 水中
  rationale: 汉语无需机械保留关系从句即可准确表达“在水中的”；“水中”简洁且不损失所指。
- source_word: מִתַּחַת לָאָרֶץ
  choice: 地底下
  rationale: 保留“地以下之水”的传统圣经表达，并与出埃及记20:4的禁像措辞形成呼应，不将其改写为现代宇宙观说明。
theological_decisions:
- issue: 禁偶像语境中对表象之物的措辞
  choice: ……的形状
  alternative: ……的形象／……的像
  rationale: 原文说的是受造物的תַּבְנִית，并未在本节内明确限定制成品的材质或种类。“形状”既能承接上下文的造像禁令，也避免把“偶像”或“雕像”等较窄概念直接加入本节。
- issue: “地底下水中”的宇宙图景表达
  choice: 保留“地底下水中”
  alternative: 陆地下方水域中的／水里的
  rationale: 直译保留了经文固有的表达及其与十诫禁像条文的互文联系；译文不替经文调和或现代化其宇宙图景。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。经文作为4:16起禁令所列举项目的一部分，不另加连接词或主句。以“任何一种”传达כָּל的分配性；重复“形状”以呈现原文平行结构。
