revisions:
- from: 你们亲眼看见了耶和华因巴力·毗珥所做的事：凡随从巴力·毗珥的人，耶和华你们的上帝都从你们中间除灭了。
  to: 你们亲眼看见了耶和华在巴力·毗珥所做的事：凡随从巴力·毗珥的人，耶和华——你们的上帝——都从你们中间除灭了。
  rationale: 仅作必要修订：将“因”改为“在”，恢复原文介词短语的事件／地点关联；并以破折号清晰标示“你们的上帝”对耶和华的同位说明。没有增添有关巴力·毗珥身份或事件细节的解释。
