  text: עֵֽינֵי/כֶם֙ הָֽ/רֹאֹ֔ת אֵ֛ת אֲשֶׁר עָשָׂ֥ה יְהוָ֖ה בְּ/בַ֣עַל פְּע֑וֹר כִּ֣י כָל הָ/אִ֗ישׁ אֲשֶׁ֤ר הָלַךְ֙ אַחֲרֵ֣י בַֽעַל פְּע֔וֹר הִשְׁמִיד֛/וֹ יְהוָ֥ה אֱלֹהֶ֖י/ךָ מִ/קִּרְבֶּֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/003.yaml
  text: Your own eyes have seen what Yahweh did at Baal-peor[a], for every man who went after Baal-peor, Yahweh your God destroyed from your midst.
translation:
  language: zh_hans
  text: 你们亲眼看见了耶和华在巴力·毗珥所做的事：凡随从巴力·毗珥的人，耶和华——你们的上帝——都从你们中间除灭了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֵינֵיכֶם הָרֹאֹת
  choice: 你们亲眼看见了
  rationale: 希伯来文突出“你们的眼睛”作为见证者；现代汉语用“亲眼看见”自然保留亲历、目睹的强调。
- source_word: עָשָׂה
  choice: 所做的事
  rationale: 此处指耶和华在巴力·毗珥事件中施行的审判；“所做的事”既贴合原文，也能自然承接下句的具体说明。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 直接译出四字神名；“耶和华”是现代简体中文圣经语境中最通行、最易识别的专名形式。
- source_word: בְּבַעַל פְּעוֹר
  choice: 因巴力·毗珥
  rationale: 介词 בְּ 在这里可表示事件所关涉的对象或缘由。结合下文对随从巴力·毗珥者的审判，“因巴力·毗珥”比纯地点性的“在巴力·毗珥”更符合该名称在本句中的事件性用法，同时不把它误作普通地名。
- source_word: כִּי
  choice: 冒号所表达的解释关系
  rationale: כִּי 引出前句所说之事的具体说明。汉语用冒号比硬译为“因为”更自然，并保留解释性连接。
- source_word: כָּל הָאִישׁ
  choice: 凡……的人
  rationale: 原文为阳性单数的逐一分配用法，语义是群体中的每一个人。汉语“凡……的人……都”准确表达分配性，无须加入原文没有特别强调的性别对立。
- source_word: הָלַךְ אַחֲרֵי
  choice: 随从
  rationale: 该习语并非仅指身体上的跟随，而是指追随、归附，尤其在此指参与偶像崇拜；“随从”简洁保留效忠意味。
- source_word: הִשְׁמִידוֹ
  choice: 都……除灭了
  rationale: 使役词形表达彻底消灭。原文宾语代词与分配性的“每一个人”呼应；汉语由“凡……的人……都”自然承接，无需重复“他”。
- source_word: אֱלֹהֶיךָ
  choice: 你们的上帝
  rationale: 与神名同位，表达耶和华与听众的关系；按现代简体中文采用“上帝”。
- source_word: מִקִּרְבֶּךָ
  choice: 从你们中间
  rationale: 表示从群体内部移除；“从你们中间”自然清楚地保留共同体含义。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用神的专名而非称号，故不译作“主”。“耶和华”在现代中文中最为通行且可清楚识别为专名；“雅威”更接近部分学者采用的拟音，但中文读者熟悉度较低。
- issue: כָּל הָאִישׁ 的性别与分配性
  choice: 凡……的人
  alternative: 每一个男人
  rationale: 这里的阳性单数用于逐一概括所有参与该行为者，重点在分配性而非与女性作对比。“凡……的人……都”完整保留“每一个”的语义，也符合自然汉语。
- issue: 巴力·毗珥的语义身份
  choice: 将其保留为专名，不在正文中明确判定为地点或神祇称号
  alternative: 在巴力·毗珥那里／随从毗珥的巴力
  rationale: 同一形式既与该事件及地点相关，也可指所崇拜的巴力。正文保留“巴力·毗珥”这一专名，避免过度消解原文的简约与语境张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“你们亲眼看见了”保留目击强调；以冒号呈现 כִּי 的解释功能，使整句清楚流畅。专名使用中点“巴力·毗珥”，神名译作“耶和华”。
