  source_fidelity: “因巴力·毗珥所做的事”把 בְּבַעַל־פְּעוֹר 处理为原因，未能保留原文及英文审计轨迹所采用的事件／地点关联（“at Baal-peor”）。改为“在巴力·毗珥所做的事”较直接地对应原文，且不额外界定该专名是地点还是神祇称号。其余主要成分忠实：亲眼目睹的强调、随从的偶像效忠含义、逐一分配的“凡……的人……都”、以及从共同体中除灭的意思均得到保留。
  naturalness: 修订后句子自然庄重。“耶和华——你们的上帝——”以破折号明确同位语关系，避免“耶和华你们的上帝”在现代汉语中可能产生的短暂停顿或结构不清。冒号可自然表达 כִּי 所引出的说明关系。
  terminology: “耶和华”一致译出神名；“上帝”“巴力·毗珥”“随从”“除灭”均适合现代中文圣经的庄重语域。“除灭”恰当传达 הִשְׁמִידוֹ 的强烈毁灭／清除含义。
  issues:
