base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/045.yaml
  text: These are the testimonies[a], the statutes, and the judgments that Moses spoke to the sons of Israel when they came out from Egypt.
translation:
  language: zh_hans
  text: 这些是摩西在以色列人出埃及时向他们讲的法度[a]、律例和典章。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “法度”或译“见证”或“约的规定”。
    reason: 原词兼有见证与约法规定的含义；正文采用适合本节法律语境的“法度”，脚注保留其词义幅度。
lexical_decisions:
- source_word: אֵלֶּה
  choice: 这些是
  rationale: 希伯来文以复数指示词引出下文三类律法；汉语补出“是”，使无动词句自然完整。
- source_word: הָעֵדֹת
  choice: 法度
  rationale: 该词可指具有见证性质的约法或规定；“法度”符合本节法律语境，并能与“律例”“典章”并列而不混同。
- source_word: הַחֻקִּים
  choice: 律例
  rationale: 表示制定并规定遵守的法令；“律例”庄重、通行，也适合申命记的法律语域。
- source_word: הַמִּשְׁפָּטִים
  choice: 典章
  rationale: 该词可指司法裁决及据此形成的法规；“典章”保留法律含义，并与“律例”有所区分。
- source_word: אֲשֶׁר דִּבֶּר
  choice: 摩西……讲的
  rationale: דבר在此首先表示说、讲，不必强化为正式“颁布”；汉语关系结构将其自然译作“摩西……讲的”。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 希伯来文直译为“以色列的众子”，在这里是全体以色列民的族群称谓；“以色列人”在现代汉语中自然且不造成仅指男性的误解。
- source_word: בְּצֵאתָם מִמִּצְרָיִם
  choice: 在以色列人出埃及时
  rationale: 介词加不定式结构表达时间关系，直译为“在他们从埃及出来时”；此译保留原文宽泛的时间表达，不擅自明确为紧接出埃及之后的某一时点。
theological_decisions: []
