source:
  edition: WLC
  text: רְאֵ֣ה לִמַּ֣דְתִּי אֶתְ/כֶ֗ם חֻקִּים֙ וּ/מִשְׁפָּטִ֔ים כַּ/אֲשֶׁ֥ר צִוַּ֖/נִי יְהוָ֣ה אֱלֹהָ֑/י לַ/עֲשׂ֣וֹת כֵּ֔ן בְּ/קֶ֣רֶב הָ/אָ֔רֶץ אֲשֶׁ֥ר אַתֶּ֛ם בָּאִ֥ים שָׁ֖מָּ/ה לְ/רִשְׁתָּֽ/הּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/005.yaml
  text: See[a], I have taught you statutes and judgments, just as Yahweh my God commanded me[c][b], so that you may do so in the midst of the land that you are entering there to possess it.
translation:
  language: zh_hans
  text: 你们看，我已经将律例和典章[a]教导你们，正如雅威——我的上帝——所吩咐我的，好叫你们在你们将要进去取得的那地中[b]照着遵行[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “律例和典章”也可译作“法令和条例”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“在那地当中”；不少译本简化为“在那地”。
    reason: lexical_alternative
  - marker: c
    text: “取得”也可译作“承受”或“占有”。原文还明确带有“到那里去”的方向意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: רְאֵה
  choice: 你们看
  rationale: 这是单数命令式，用作引起全体听众注意的话语标记。现代汉语用“你们看”自然地表达其直接语气；希伯来语的单数形式在汉语中无法无碍地保留。
- source_word: לִמַּדְתִּי אֶתְכֶם
  choice: 我已经把……教导你们
  rationale: 完成式表示摩西已经完成、且对当前劝勉仍有现实效力的教导。“已经”清楚传达这一点。
- source_word: חֻקִּים וּמִשְׁפָּטִים
  choice: 律例和典章
  rationale: 保持申命记法律语境中的正式语域，并区分规定性的律例与司法、规范性的典章。
- source_word: כַּאֲשֶׁר
  choice: 正如
  rationale: 表达摩西的教导与上帝命令之间的对应关系。
- source_word: יְהוָה אֱלֹהָי
  choice: 雅威我的上帝
  rationale: 以“雅威”呈现四字神名，并保留“我的上帝”这一第一人称关系表达。
- source_word: לַעֲשׂוֹת כֵּן
  choice: 为要使你们……照着遵行
  rationale: 不定式在上下文中表达教导的目的，隐含的施行者是以色列民；“照着遵行”自然地保留“这样做”的回指意义。
- source_word: בְּקֶרֶב הָאָרֶץ
  choice: 在那地中
  rationale: 保留 בְּקֶרֶב 的“在……之中”含义，同时避免汉语“在那地的中间”所造成的地理中心误解。
- source_word: בָּאִים שָׁמָּה לְרִשְׁתָּהּ
  choice: 你们正要进去取得那地
  rationale: “正要”体现分词所表达的临近行动，“进去”包含 שָׁמָּה 的方向意味，“取得”则保留 ירשׁ 在土地语境中取得、占有或承受的语义宽度。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。音译“雅威”既保留其作为盟约之神专名的性质，也不以称号替代原文专名。
- issue: לַעֲשׂוֹת כֵּן 的隐含主语与功能
  choice: 译为以以色列民为施行者的目的表达：“为要使你们……照着遵行”
  alternative: 理解为“照我所受的吩咐而教导”，使施行者偏向摩西
  rationale: 紧邻语境强调百姓在将进入之地实行所受教导的律例典章；但原文不定式没有明示主语，因此脚注不作教义性延伸。
- issue: ירשׁ 在应许之地语境中的含义
  choice: 取得
  alternative: 承受；占有；得为业
  rationale: “取得”保留实际进入并占有土地的含义，同时避免单独采用“承受”或“占领”而过早限定其应许继承或军事夺取侧面。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“律例和典章”维持法律文本的正式感；将较紧密的希伯来语长句在分号处略作展开，使“那地”与进入、取得的关系清楚，同时保留原文的目的结构和“在那地中”的表达。
