source:
  edition: WLC
  text: הִשָּׁמְר֣וּ לָ/כֶ֗ם פֶּֽן תִּשְׁכְּחוּ֙ אֶת בְּרִ֤ית יְהוָה֙ אֱלֹ֣הֵי/כֶ֔ם אֲשֶׁ֥ר כָּרַ֖ת עִמָּ/כֶ֑ם וַ/עֲשִׂיתֶ֨ם לָ/כֶ֥ם פֶּ֨סֶל֙ תְּמ֣וּנַת כֹּ֔ל אֲשֶׁ֥ר צִוְּ/ךָ֖ יְהוָ֥ה אֱלֹהֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/023.yaml
  text: Watch yourselves[a], lest you forget the covenant of Yahweh your God that he made with you, and make for yourselves a carved image, the likeness of anything that Yahweh your God has commanded you not to make.
translation:
  language: zh_hans
  text: 你们要谨慎自守，免得忘记耶和华你们的上帝同你们所立的约，又为自己雕刻任何形象的偶像，就是耶和华你的上帝所禁止你制作的。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译：“耶和华你的上帝所吩咐你的。”原文末句没有明说“禁止”；但从上下文可知，这里指不可制造偶像；参申命记4:16。
    reason: 说明原文末句省略的否定，并保留其形式上的歧义与上下文依据。
lexical_decisions:
- source_word: הִשָּׁמְרוּ לָכֶם
  choice: 你们要谨慎自守
  rationale: 该短语是带反身意味的警告；“谨慎自守”既保留“守护自己”的语义，也符合庄重而自然的现代汉语。
- source_word: פֶּן תִּשְׁכְּחוּ
  choice: 免得忘记
  rationale: פֶּן引出应当避免的后果；“免得”简洁地保留警戒语气。
- source_word: בְּרִית
  choice: 约
  rationale: “约”是中文圣经语境中对神与以色列立约关系的标准表达，比“协议”更能保留原词的盟约内涵。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文读者熟悉的神名音译“耶和华”，将专名与“主”这一称号区分开。
- source_word: אֲשֶׁר כָּרַת עִמָּכֶם
  choice: 与你们所立的
  rationale: כרת ברית是“立约”的固定搭配；中文无需直译为“割约”。
- source_word: וַעֲשִׂיתֶם לָכֶם
  choice: 为自己雕刻
  rationale: “为自己”保留לָכֶם的反身兼受益意味，突显人自行制造敬拜对象。
- source_word: פֶּסֶל
  choice: 偶像
  rationale: 在本段明确定罪制造敬拜形象的语境中，“偶像”自然清楚；动词“雕刻”同时保留其作为雕刻物的具体性质。
- source_word: תְּמוּנַת כֹּל
  choice: 仿造任何形象
  rationale: תְּמוּנָה指可供描摹或表现的形状、样式；此译与“雕刻偶像”搭配自然，并保留范围的全面性。
- source_word: אֲשֶׁר צִוְּךָ יְהוָה אֱלֹהֶיךָ
  choice: 这是耶和华你的上帝所禁止的
  rationale: 马所拉文本字面只有“耶和华你的上帝所吩咐你的”，未明说否定词；结合4:16的禁令，此处用“禁止”表达语境中隐含的否定，并以脚注说明。
- source_word: אֱלֹהֵיכֶם / אֱלֹהֶיךָ
  choice: 你们的上帝／你的上帝
  rationale: 保留希伯来文由复数第二人称转为单数第二人称的变化，让群体警告在结尾也直接落到每个个体身上。
theological_decisions:
- issue: 末尾关系从句中隐含的否定
  choice: 正文译为“这是耶和华你的上帝所禁止的”
  alternative: 形式对应地译为“这是耶和华你的上帝所吩咐你的”，将否定完全留给上下文表达
  rationale: 原文未出现显式否定词，存在省略造成的表层张力；但4:16及本句警告的逻辑清楚表明，所指是禁止制造形象。正文显明语境意义，以免现代读者误解为上帝吩咐人制造偶像，同时脚注保留原文形式。
translation_notes:
  register: 采用庄重、清楚的现代标准普通话。“谨慎自守”“立约”保留经文语体而不过分古雅；保留“你们／你”的人称数转换。脚注标记[a]已置于正文对应句末。
