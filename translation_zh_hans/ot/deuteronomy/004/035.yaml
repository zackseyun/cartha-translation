  text: אַתָּה֙ הָרְאֵ֣תָ לָ/דַ֔עַת כִּ֥י יְהוָ֖ה ה֣וּא הָ/אֱלֹהִ֑ים אֵ֥ין ע֖וֹד מִ/לְ/בַדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/035.yaml
  text: You were shown these things so that you might know that Yahweh[a], he is God[b]; there is no other besides him.
translation:
  language: zh_hans
  text: 这一切已向你显明[a]，为要使你知道：雅威[b]，他是上帝；除他以外，再没有别的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “你”在希伯来文中为阳性单数；在这里指作为整体的以色列民。原文动词为被动式，意为“使你看见”或“向你显明”。
    reason: grammar_and_lexical_clarification
  - marker: b
    text: “雅威”是希伯来文 יהוה 这一神名的拟音；传统中文译本常作“耶和华”，也常按犹太诵读传统以“主”代称。
    reason: divine_name_clarification
lexical_decisions:
- source_word: הָרְאֵתָ
  choice: 显给你看
  rationale: 该词为ראה的使役被动式，表示“使你看见／显给你看”，不是单指听者自行看见；此译保留了被动、使役意味，同时符合现代汉语表达。
- source_word: לָדַעַת
  choice: 是要使你知道
  rationale: 带ל的动词不定式在这里表达目的或预期结果；“是要使你知道”清楚传达这一作用。
- source_word: כִּי
  choice: （引出冒号后的内容）
  rationale: 此处引出所要知道的内容，汉语以冒号表达比直译为“即”或“因为”更自然。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文四字神名的通行拟音译出专名，不以“主”这一称号替代。
- source_word: הוּא
  choice: 他
  rationale: 保留独立人称代词，以呈现原文“雅威，他是上帝”的强调结构，而不提前增译为“唯独他”。
- source_word: הָאֱלֹהִים
  choice: 上帝
  rationale: 带定冠词的名词在此作表语，认定雅威就是上帝；现代汉语以“上帝”表达自然，无须生硬译作“那位上帝”。
- source_word: אֵין עוֹד מִלְבַדּוֹ
  choice: 除他以外，再没有别的
  rationale: 该表达否定雅威以外还有任何别的神；此译保留排他力度，同时不加入原文未明说的哲学阐释。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用以色列上帝的专名。译作“雅威”保留专名性质；脚注说明传统读法，以便普通读者理解。
- issue: “他是上帝”的强调结构
  choice: 雅威，他是上帝
  alternative: 雅威就是上帝；唯独雅威是上帝
  rationale: 保留原文独立代词הוּא带来的强调。“就是”亦可表达认定语气，但略弱化句法对应；“唯独”则会把下一分句的排他含义提前并入。
- issue: 排他性断言的范围
  choice: 除他以外，再没有别的
  alternative: 除他以外，再没有别的神
  rationale: “别的”忠实保留原文עוֹד较简约的表述，其所指可由前面的“上帝”明确推知；增补“神”虽清楚，却比原文更显化。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“显给你看”保留原文使役被动意味；冒号清楚引出所知内容；保留“他”以体现希伯来文强调，末句则维持简洁有力的排他宣告。
