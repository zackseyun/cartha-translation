  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וּ/שְׁמַרְתֶּם֮ וַ/עֲשִׂיתֶם֒ כִּ֣י הִ֤וא חָכְמַתְ/כֶם֙ וּ/בִ֣ינַתְ/כֶ֔ם לְ/עֵינֵ֖י הָ/עַמִּ֑ים אֲשֶׁ֣ר יִשְׁמְע֗וּ/ן אֵ֚ת כָּל הַ/חֻקִּ֣ים הָ/אֵ֔לֶּה וְ/אָמְר֗וּ רַ֚ק עַם חָכָ֣ם וְ/נָב֔וֹן הַ/גּ֥וֹי הַ/גָּד֖וֹל הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/006.yaml
  text: So keep them and do them[a], for this is your wisdom and your understanding in the sight of the peoples, who will hear all these statutes and say[b], ‘Surely this great nation is a wise and understanding people.’
translation:
  language: zh_hans
  text: 所以，你们要谨守并遵行，因为这些律例就是你们在各族眼中的智慧和聪明。各族听见这一切律例[b]，就会说：“这个大国的确[a]是一个有智慧、有见识的民族！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “的确”所译的希伯来语词 רַק 更常见的字面意思是“只有”或“唯有”；这里也可译作：“唯有这个大国是一个有智慧、有见识的民族。”
    reason: lexical_alternative
  - marker: b
    text: “律例”所译的希伯来语 חֻקִּים 是法律用语，也可译作“法令”或“条例”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם וַעֲשִׂיתֶם
  choice: 谨守遵行
  rationale: “谨守”表达盟约和法律语境中 שׁמר 的持守、遵守之意；“遵行”表达 עשה 所强调的实际实行，并保留原文两个并列动词。
- source_word: כִּי הִוא
  choice: 因为这样做就是
  rationale: 阴性单数代词概括前文所说的谨守遵行；译作“这样做”在现代汉语中指代清楚，同时不把智慧仅仅归结为抽象知识。
- source_word: חָכְמַתְכֶם וּבִינַתְכֶם
  choice: 你们的智慧和聪明
  rationale: 分别保留 חָכְמָה 与 בִּינָה 的并列概念；“智慧和聪明”自然易懂，也与后文形容词 חָכָם וְנָבוֹן 呼应。
- source_word: לְעֵינֵי הָעַמִּים
  choice: 在各族眼中
  rationale: 保留“在……眼中”的意象和公开可见的含义；“各族”也与后文单数 גּוֹי 所指的“大国”保持词汇区别。
- source_word: כָּל הַחֻקִּים הָאֵלֶּה
  choice: 这一切律例
  rationale: “律例”是 חֻקִּים 在法律语境中的庄重而通行的译法，既体现规范性，也适合现代圣经汉语。
- source_word: רַק
  choice: 的确
  rationale: רַק 常可表示“唯独、只有”，但在此处引出各族的赞叹和断言，译为“的确”更符合现代汉语语气；其较字面的可能译法保留在脚注中。
- source_word: עַם חָכָם וְנָבוֹן
  choice: 有智慧、有聪明的民族
  rationale: 保留两个形容词及其与前半节“智慧和聪明”的呼应，不将二者合并为单一概念。
- source_word: הַגּוֹי הַגָּדוֹל הַזֶּה
  choice: 这个大国
  rationale: 直接表达定指短语，并在汉语句序中前置为判断句主语，使引语自然清楚。
theological_decisions:
- issue: 遵行律例与智慧的关系
  choice: 把“这样做”表述为以色列在各族眼中的智慧和聪明。
  alternative: 把律例本身单独解释为以色列的智慧和聪明，与实际遵行无关。
  rationale: 原文先命令“谨守遵行”，随即以“因为这就是”说明其公开意义。译文保持二者的紧密联系，但不加入关于功德、得救条件或民族优越性的额外论断。
- issue: 列国评价的语气
  choice: 将 רַק 理解为强调性的“的确”。
  alternative: 按常见字面义译为“只有／唯有”。
  rationale: 上下文呈现各族听见律例后发出的赞叹；强调性译法在汉语中更通顺，但脚注保留字面意义所形成的歧义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“谨守遵行”保留原文简洁的双动词结构；“各族”与“大国／民族”维持 עַמִּים 和 גּוֹי 的词汇区别。脚注标记均置于所说明的词语之后。
