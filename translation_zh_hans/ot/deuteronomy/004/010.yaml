source:
  edition: WLC
  text: י֗וֹם אֲשֶׁ֨ר עָמַ֜דְתָּ לִ/פְנֵ֨י יְהוָ֣ה אֱלֹהֶי/ךָ֮ בְּ/חֹרֵב֒ בֶּ/אֱמֹ֨ר יְהוָ֜ה אֵלַ֗/י הַקְהֶל לִ/י֙ אֶת הָ/עָ֔ם וְ/אַשְׁמִעֵ֖/ם אֶת דְּבָרָ֑/י אֲשֶׁ֨ר יִלְמְד֜וּ/ן לְ/יִרְאָ֣ה אֹתִ֗/י כָּל הַ/יָּמִים֙ אֲשֶׁ֨ר הֵ֤ם חַיִּים֙ עַל הָ֣/אֲדָמָ֔ה וְ/אֶת בְּנֵי/הֶ֖ם יְלַמֵּדֽוּ/ן־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/010.yaml
  text: the day when you stood before Yahweh your God at Horeb[a], when Yahweh said to me, ‘Assemble the people to me, and I will let them hear my words, so that they may learn to fear me all the days that they live on the earth, and that they may teach their children.’
translation:
  language: zh_hans
  text: 就是你在何烈山站在耶和华——你的上帝——面前的那一天，耶和华对我说：“把民众召集到我这里来，我要让他们听见我的话，好叫他们在世上[a]活着的每一天都学习敬畏我，也教导自己的儿女。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在这片土地上”。希伯来语“阿达玛”（אֲדָמָה）既可泛指地面、世上，也可指某片特定的土地。
    reason: 保留עַל־הָאֲדָמָה在泛指世上与特指土地之间的真实词义歧义。
lexical_decisions:
- source_word: י֗וֹם אֲשֶׁר
  choice: 就是……的那一天
  rationale: 保留希伯来语回指某一特定日子的时间关系，并使本节作为前文句法延续时在中文中自然衔接。
- source_word: עָמַדְתָּ לִפְנֵי
  choice: 你……站在……面前
  rationale: 保留“站立”这一具体动作和人在上帝面前的盟约场景。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名形式呈现四字神名，不以“主”这一称号替代。
- source_word: אֱלֹהֶיךָ
  choice: 你上帝
  rationale: 直接保留第二人称单数所属关系和盟约关系用语。
- source_word: בְּחֹרֵב
  choice: 在何烈山
  rationale: 中文通常以“何烈山”指称何烈这一山地地点；补出“山”有助于普通读者理解，且符合上下文所指。
- source_word: הַקְהֶל לִי אֶת־הָעָם
  choice: 把民众召集到我这里来
  rationale: “召集”体现קהל使役式所表示的公开聚集；“到我这里来”明确保留לִי的趋向含义。
- source_word: וְאַשְׁמִעֵם
  choice: 我要让他们听见
  rationale: 保留שמע使役式“使其听见”的意义，同时使用自然现代汉语。
- source_word: דְּבָרָי
  choice: 我的话
  rationale: “话”在中文可作集合表达，准确指上帝亲自说出的言语，不抽象化为“信息”。
- source_word: אֲשֶׁר יִלְמְדוּן לְיִרְאָה אֹתִי
  choice: 使他们……学习敬畏我
  rationale: 将关系词按语境表达为目的；“敬畏”保留惧怕、尊崇及顺服的张力，比单纯“尊敬”更充分。
- source_word: כָּל־הַיָּמִים אֲשֶׁר הֵם חַיִּים
  choice: 活着的每一天
  rationale: 以简洁自然的中文表达终身持续之意，同时保留“日子”的意象。
- source_word: עַל־הָאֲדָמָה
  choice: 在世上
  rationale: אֲדָמָה既可泛指地面、世上，也可特指土地；正文采用不预先限定为应许之地的广义表达，另一可能置于脚注。
- source_word: בְּנֵיהֶם
  choice: 自己的儿女
  rationale: 此处复数阳性名词泛指下一代；“儿女”自然涵盖男女后代，也保留亲子关系。
- source_word: יְלַמֵּדוּן
  choice: 教导
  rationale: 直接表达使下一代学习上帝话语和敬畏上帝的行动，不额外补入原文未明说的宾语。
theological_decisions:
- issue: 四字神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 正文用中文长期通行且作为专名使用的“耶和华”，保留这是上帝的名字而非以“主”替代；“雅威”是较贴近学术重构读音的另一音译。
- issue: 盟约语境中ירא的译法
  choice: 敬畏我
  alternative: 惧怕我
  rationale: “敬畏”在现代中文中同时容纳畏惧、尊崇和顺服，保留其神学分量，又不把词义缩减为单纯恐惧。
- issue: בנים所指范围
  choice: 儿女
  alternative: 儿子
  rationale: 语境关注代际教导，阳性复数可涵盖后代整体；“儿女”避免无根据地限定为男性。
- issue: עַל־הָאֲדָמָה的范围
  choice: 在世上
  alternative: 在这片土地上
  rationale: 原词可泛指人生活于其上的地面或世上，也可能在申命记语境中特指土地；正文保留较宽泛含义，脚注注明较窄读法。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“民众”体现公开召集的整体群体；引语使用当代标点。“就是……的那一天”顾及本节承接上一节“不可忘记”的未完句法关系。
