base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/034.yaml
  text: Or has any god ever attempted to go and take for himself a nation from the midst of another nation[a], by trials, by signs, and by wonders, and by war, and by a mighty hand, and by an outstretched arm, and by great terrors, according to all that Yahweh your God did for you in Egypt before your eyes?
translation:
  language: zh_hans
  text: 又有哪一个神曾试图前去，为自己从一个民族中带出一个民族，借着试炼、神迹、奇事、战争、大能的手、伸出的膀臂，以及大而可畏的事[a]，正如耶和华你们的上帝在埃及、在你眼前为你们所做的一切吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译作“极大的惊恐”或“极其可怕的作为”。希伯来语指使人产生恐惧和敬畏的事物或作为。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲנִסָּה
  choice: 曾有……尝试
  rationale: 此处 נסה 表示“尝试、试图”，用于反问，强调这样的行动前所未有；不译作“试验”，以免误解为对某对象加以测试。
- source_word: אֱלֹהִים
  choice: 哪个神明
  rationale: 这里用于与耶和华的作为作反问式比较，表达“任何神祇”的泛指意义；“神明”既自然，也避免误指下文的真神。
- source_word: לָבוֹא לָקַחַת
  choice: 前来……取出
  rationale: 保留先移动、后取走的动作次序。“前来”不强行指定现代叙述者的空间视角；“取出”与后面的“从……中”配合，呈现从埃及内部带出一族的图景。
- source_word: גּוֹי מִקֶּרֶב גּוֹי
  choice: 从一个民族中为自己取出一个民族
  rationale: 保留原文对 גוי 的重复和“从内部取出”的鲜明意象；“为自己”对应 לֹו。
- source_word: בְּמַסֹּת
  choice: 借着考验
  rationale: 指与出埃及事件有关的试验性事件或审判。“考验”保留词义宽度，不采用现代汉语中容易偏向诱惑含义的措辞。
- source_word: בְּאֹתֹת וּבְמוֹפְתִים
  choice: 神迹、奇事
  rationale: 采用现代中文圣经语域中自然且易懂的固定搭配，同时维持两词并列，不将二者压缩为单一的“神迹”。
- source_word: וּבְמִלְחָמָה
  choice: 战争
  rationale: 保留单数名词及出埃及拯救的军事、争战层面。
- source_word: וּבְיָד חֲזָקָה
  choice: 大能的手
  rationale: 对应出埃及叙事中的固定形象，表达上帝施行拯救的大能；比字面化的“强壮的手”更符合现代汉语。
- source_word: וּבִזְרוֹעַ נְטוּיָה
  choice: 伸出的膀臂
  rationale: 保留原文拟人化的固定表达及其行动感；“膀臂”庄重而仍为普通读者所能理解。
- source_word: וּבְמוֹרָאִים גְּדֹלִים
  choice: 令人极其敬畏的作为
  rationale: 该复数名词指引发恐惧与敬畏的事物或行动。正文用自然中文表达其致使人畏惧的效果，同时以脚注保留“可怕的大事”等词汇可能性。
- source_word: כְּכֹל אֲשֶׁר עָשָׂה
  choice: 正如……所做的一切
  rationale: 保留比较关系与 כֹל 的全面性，并以自然现代汉语连接反问和以色列亲历的历史事实。
- source_word: לְעֵינֶיךָ
  choice: 在你眼前
  rationale: 保留原文第二人称单数形式，与摩西把全体以色列视作一个共同体来讲话的方式一致。
theological_decisions:
- issue: 反问首句 אֱלֹהִים 的所指
  choice: 哪个神明
  alternative: 上帝／神
  rationale: 上下文将耶和华独一无比的救赎作为与任何别的神祇作比较。“哪个神明”保留反问和论辩力度，同时避免让读者以为首句主语就是下文的耶和华。
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威／上主
  rationale: 在现代简体中文普通读者的圣经语境中，“耶和华”是专名的通行形式，可清楚区别于称号“上帝”，并表明原文在此使用四字神名。
- issue: “为自己取出一个民族”的拣选与归属含义
  choice: 保留“为自己”
  alternative: 省略或仅译“带出一个民族”
  rationale: לֹו 明示该民族被取来归于行动者。保留此语既忠于原文，也不进一步解释其神学机制或范围。
translation_notes:
  register: 采用现代、庄重而可朗读的普通话。“神明”用于泛指受比较的神祇，“上帝”用于耶和华的称号；保留反问的长句结构和一连串工具性短语，但以中文顿号减轻重复。“你们的上帝”对应复数受众，“在你眼前”则保留原文把群体视为一体的单数形式。脚注标记置于其实际解释的“令人极其敬畏的作为”之后。
