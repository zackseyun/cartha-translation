  text: וּ/מִי֙ גּ֣וֹי גָּד֔וֹל אֲשֶׁר ל֛/וֹ חֻקִּ֥ים וּ/מִשְׁפָּטִ֖ים צַדִּיקִ֑ם כְּ/כֹל֙ הַ/תּוֹרָ֣ה הַ/זֹּ֔את אֲשֶׁ֧ר אָנֹכִ֛י נֹתֵ֥ן לִ/פְנֵי/כֶ֖ם הַ/יּֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/008.yaml
  text: And what great nation is there that has statutes and judgments as righteous as all this law that I am setting before you today?[a]
translation:
  language: zh_hans
  text: 又有哪个大国，拥有像我今天摆在你们面前的这一整套律法那样公义的律例和典章呢？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “律法”或译“教导”（希伯来语 torah）；不过本节的语境具体涉及法律，即“律例和典章”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִי
  choice: 又有哪个……呢
  rationale: 以现代汉语的反问句式表达希伯来文承接上文的比较性反问；结合后面的“国”，译作“哪个”比直译“谁”自然。
- source_word: גּוֹי גָּדוֹל
  choice: 大国
  rationale: גּוֹי 指民族或国家共同体；此处是在列国之间作比较，“大国”简洁贴切。
- source_word: חֻקִּים
  choice: 律例
  rationale: 保留该词所指明文制定之法规的正式法律色彩，并与 מִשְׁפָּטִים 区分。
- source_word: וּמִשְׁפָּטִים
  choice: 和典章
  rationale: 该词可指司法判例、裁决或法规；“典章”在庄重而可懂的现代经文语体中保留法律含义，也避免与“律例”合并为同一个词。
- source_word: צַדִּיקִם
  choice: 公义
  rationale: 此词形容这些律例和典章符合正直、公正的标准；“公义”兼顾道德与法律层面。
- source_word: כְּכֹל הַתּוֹרָה הַזֹּאת
  choice: 像……这一整套律法那样
  rationale: כְּ 表比较，כֹל 强调整体；“这一整套”自然表达这套律法的整体性。תּוֹרָה 在本节法律语境中译为“律法”。
- source_word: נֹתֵן לִפְנֵיכֶם
  choice: 摆在你们面前
  rationale: 按该希伯来语搭配的语义译为把律法陈明、呈交给百姓，而非机械直译为“给在你们面前”。
- source_word: הַיּוֹם
  choice: 今天
  rationale: 准确保留原文的时间强调，并符合现代汉语表达。
theological_decisions:
- issue: תּוֹרָה 的译法
  choice: 律法
  alternative: 教导
  rationale: תּוֹרָה 的语义可宽至“教导”，但本节紧接“律例和典章”，明显聚焦法律内容，因此正文采用“律法”；脚注保留较宽的词义，避免抹去原文的语义幅度。
translation_notes:
  register: 采用庄重、清晰的现代标准汉语。以“又有哪个……呢”重现承接上文的反问语气；使用传统且仍易懂的法律词语“律例和典章”，同时用“摆在你们面前”保持表达自然。
