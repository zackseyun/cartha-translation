  text: וַֽ/יהוָ֥ה הִתְאַנֶּף בִּ֖/י עַל דִּבְרֵי/כֶ֑ם וַ/יִּשָּׁבַ֗ע לְ/בִלְתִּ֤י עָבְרִ/י֙ אֶת הַ/יַּרְדֵּ֔ן וּ/לְ/בִלְתִּי בֹא֙ אֶל הָ/אָ֣רֶץ הַ/טּוֹבָ֔ה אֲשֶׁר֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ נֹתֵ֥ן לְ/ךָ֖ נַחֲלָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/021.yaml
  text: And Yahweh was angry with me because of you[a], and he swore that I would not cross the Jordan and that I would not enter the good land that Yahweh your God is giving you as an inheritance.
translation:
  language: zh_hans
  text: 耶和华因你们的话[a]向我发怒，并且起誓不让我过约旦河，也不让我进入那美好的土地，就是耶和华你的上帝赐给你作产业的地。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“因你们的缘故”。希伯来语直译为“因你们的话”。
    reason: 说明 עַל־דִּבְרֵיכֶם 可按语境作习语性理解，同时保留原文“话语”的明确词汇成分。
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神名译法，明确保留专名，不以“主”替代。
- source_word: הִתְאַנֶּף בִּי
  choice: 向我发怒
  rationale: 准确表达 אנף 的怒气含义；“向我发怒”符合现代汉语习惯，又不过度强化为“震怒”。
- source_word: עַל דִּבְרֵיכֶם
  choice: 因你们的缘故
  rationale: 该短语字面涉及“你们的话/事情”，在本处可按希伯来语习惯表示“因你们、由于你们的缘故”；脚注保留字面可能性，避免消除歧义。
- source_word: וַיִּשָּׁבַע
  choice: 并且起誓
  rationale: 直接表达誓言行为，并自然引出后面的两个否定内容。
- source_word: לְבִלְתִּי עָבְרִי אֶת הַיַּרְדֵּן
  choice: 不让我过约旦河
  rationale: 不定式结构表达誓言所确定的结果；中文用“不让我”清楚说明摩西被禁止渡河。
- source_word: וּלְבִלְתִּי בֹא
  choice: 也不让我进入
  rationale: 保持与前一否定结构的平行，并用“进入”自然表达 בוא אֶל。
- source_word: הָאָרֶץ הַטּוֹבָה
  choice: 那美地
  rationale: “美地”是简洁庄重的现代中文表达，保留 טוֹבָה 对土地的正面评价及其约意色彩。
- source_word: נֹתֵן לְךָ
  choice: 赐给你
  rationale: “赐给”自然体现上帝主动授予土地；汉语无需机械标示分词的进行体。
- source_word: נַחֲלָה
  choice: 作产业
  rationale: “产业”可表达获分配并持有的承受之地，契合土地语境，也比现代汉语中的“遗产”更不易使人误解为死后继承。
theological_decisions:
- issue: 摩西不得进入那地与以色列人的责任之间的关系
  choice: 因你们的缘故
  alternative: 因你们的话／因你们的事
  rationale: 正文保留经文把摩西遭遇与百姓联系起来的表述，却不进一步裁定责任归属；脚注说明 דְּבָרִים 的字面和语义范围，以保存经文本身的张力。
- issue: 应许之地是上帝所赐的产业
  choice: 耶和华你的上帝赐给你作产业的地
  alternative: 耶和华你的上帝正在赐给你作为继承之业的地
  rationale: 保留赐予者、领受者及产业三者的关系，不把“产业”窄化为一般财产，也不额外引入宗派性解释。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准普通话。正文保留第二人称数的区别：前半句“你们”为复数，后半句“你的上帝、赐给你”为单数，反映希伯来语从群体转向以色列整体的称呼。
