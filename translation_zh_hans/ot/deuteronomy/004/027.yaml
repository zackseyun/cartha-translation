  text: וְ/הֵפִ֧יץ יְהוָ֛ה אֶתְ/כֶ֖ם בָּ/עַמִּ֑ים וְ/נִשְׁאַרְתֶּם֙ מְתֵ֣י מִסְפָּ֔ר בַּ/גּוֹיִ֕ם אֲשֶׁ֨ר יְנַהֵ֧ג יְהוָ֛ה אֶתְ/כֶ֖ם שָֽׁמָּ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/027.yaml
  text: And Yahweh will scatter you among the peoples[a], and you will be left few in number among the nations where Yahweh will drive you.
translation:
  language: zh_hans
  text: 雅威必把你们分散在万民中；在雅威把你们赶[a]到的那些列国中，你们剩下的人必寥寥无几。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“领”。希伯来语这个动词既可表示“带领”，也可表示“驱赶”；这里按审判和流亡的语境译作“赶”。
    reason: 保留נהג的词汇歧义，并说明正文所取译法的语境依据。
lexical_decisions:
- source_word: וְהֵפִיץ
  choice: 必把……分散
  rationale: פוץ的使役式表示使人分散；“把……分散”自然表达使役含义，也符合盟约审判和流亡的语境。
- source_word: יְהוָה
  choice: 雅威
  rationale: 直接音译四字神名，保留其作为以色列之上帝的专名，而不用称号替代。
- source_word: בָּעַמִּים
  choice: 在万民中
  rationale: עַמִּים指各族群或众民；译作“万民”可与后面的גּוֹיִם“列国”保持词义上的区别。
- source_word: וְנִשְׁאַרְתֶּם
  choice: 你们剩下的人
  rationale: שׁאר的受动式在此描述审判后残留下来的群体；汉语用“剩下的人”清楚表达其结果性。
- source_word: מְתֵי מִסְפָּר
  choice: 寥寥无几
  rationale: 该习语指人数少到屈指可数；“寥寥无几”是自然、庄重的现代汉语表达。
- source_word: בַּגּוֹיִם
  choice: 在……列国中
  rationale: גּוֹיִם在此泛指以色列以外的各国；“列国”准确且避免带入后期“外邦人”的宗教分类意味。
- source_word: אֲשֶׁר יְנַהֵג
  choice: 把你们赶到的
  rationale: נהג可指“带领”或“驱赶”；审判与流亡的上下文支持“赶”，同时以脚注保留词汇歧义。
- source_word: שָׁמָּה
  choice: 到
  rationale: שָׁמָּה表示趋向“那里”；在汉语关系结构“赶到的那些列国”中，以趋向补语“到”自然保留其方位含义。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较贴近通常重构的读音，并保留其专名性质。
- issue: נהג在审判语境中的力度
  choice: 赶
  alternative: 领
  rationale: 此处预告因审判而被迫离开本地，“赶”更贴合流亡的强制意味；但该动词本身也可表示“带领”，故以脚注保留另一可能。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“万民”与“列国”分别对应两个不同的希伯来词；分号保留原句两个并列结果之间的推进关系。
