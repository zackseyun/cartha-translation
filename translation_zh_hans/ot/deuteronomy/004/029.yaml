base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/029.yaml
  text: But from there you will seek Yahweh your God[a], and you will find him[b], if you seek him with all your heart and with all your soul.
translation:
  language: zh_hans
  text: 但你们要从那里寻求耶和华——你的神；你若以全心和全部生命[a]寻求他，就必寻见他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “生命”所译的希伯来词也可指“灵魂”或“整个人”。这里强调以全部的自己寻求神。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִקַּשְׁתֶּם
  choice: 但你们……寻求
  rationale: 连接词在上下文中承接前文以色列被分散后的处境，并带有转折意味；动词为第二人称阳性复数，故译作“你们”。
- source_word: מִשָּׁם
  choice: 从那里
  rationale: 准确保留介词 מִן 的起点含义，指以色列人在列国之中所处之地。
- source_word: אֶת יְהוָה אֱלֹהֶיךָ
  choice: 耶和华你的神
  rationale: 以“耶和华”音译四字神名，并保留马所拉文本中第二人称单数所有格所形成的盟约称谓。
- source_word: וּמָצָאתָ
  choice: 就会寻见他
  rationale: מצא 在这里表示寻求成功、得以遇见；希伯来文未明说宾语，中文依据上一分句补出“他”，使指代清楚。“会”表达语境中的将来结果，不把后面的条件消除。
- source_word: כִּי
  choice: 如果
  rationale: 此处引入寻见神的条件；“如果”比“因为”更符合句法和语境，也不把条件改写为必然发生的时间关系。
- source_word: תִדְרְשֶׁנּוּ
  choice: 寻求他
  rationale: דרש 在敬虔和盟约语境中指恳切寻求神；宾语后缀明确译为“他”。
- source_word: בְּכָל לְבָבְךָ
  choice: 用全心
  rationale: לֵבָב 涵盖思想、意志和情感；“全心”自然地表达整个内在之人的投入。
- source_word: וּבְכָל נַפְשֶׁךָ
  choice: 全生命
  rationale: נֶפֶשׁ 可指生命、整个人或传统所称的“灵魂”。“全生命”在现代中文中较清楚地表达全人投入，同时以脚注保留其语义范围。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。正文采用现代中文读者最熟悉、且具有专名功能的“耶和华”；“雅威”是较接近学界拟音的另一译法，但不影响本节的神学指向。
- issue: נֶפֶשׁ 在盟约性委身公式中的含义
  choice: 生命
  alternative: 灵魂／全人
  rationale: 该词在这里不是要把人严格划分为不同组成部分，而是与“心”并列，表达毫无保留地寻求神；译文及脚注保留其“生命、全人、灵魂”的语义张力。
- issue: 第二人称由复数转为单数
  choice: 保留“你们”至“你”的转换
  alternative: 全句统一译作“你们”
  rationale: 希伯来文本先以复数 וּבִקַּשְׁתֶּם 称呼群体，随后转用单数形式。中文保留这一转换，使以色列作为群体、又作为一个盟约整体受 خطاب的修辞特点不被抹平。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“寻见”与前面的“寻求”形成词语呼应；保留原文从复数“你们”转为单数“你”的变化，不擅自统一人称。
