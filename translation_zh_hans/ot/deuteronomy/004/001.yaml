source:
  edition: WLC
  text: וְ/עַתָּ֣ה יִשְׂרָאֵ֗ל שְׁמַ֤ע אֶל הַֽ/חֻקִּים֙ וְ/אֶל הַ/מִּשְׁפָּטִ֔ים אֲשֶׁ֧ר אָֽנֹכִ֛י מְלַמֵּ֥ד אֶתְ/כֶ֖ם לַ/עֲשׂ֑וֹת לְמַ֣עַן תִּֽחְי֗וּ וּ/בָאתֶם֙ וִֽ/ירִשְׁתֶּ֣ם אֶת הָ/אָ֔רֶץ אֲשֶׁ֧ר יְהוָ֛ה אֱלֹהֵ֥י אֲבֹתֵי/כֶ֖ם נֹתֵ֥ן לָ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/001.yaml
  text: And now[a], Israel, listen to the statutes and the judgments that I am teaching you to do, so that you may live and go in and take possession of the land that Yahweh, the God of your fathers[c][b], is giving to you.
translation:
  language: zh_hans
  text: 如今，以色列啊，你要聆听我教导你们要遵行的律例和典章[a]，好使你们存活，进入并取得[b]雅威[c]—你们祖先的上帝—赐给你们的那地。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “律例和典章”也可译作“法令和条例”。
    reason: lexical_alternative
  - marker: b
    text: “取得”也可译作“占有”或“承受为业”。
    reason: lexical_alternative
  - marker: c
    text: 希伯来文为“YHWH”（יהוה），即上帝的名；这里音译作“雅威”，传统上也译作“耶和华”。
    reason: alternative_reading
lexical_decisions:
- source_word: וְעַתָּה
  choice: 如今
  rationale: 明确承接上文并转入当前劝勉；比单用“现在”更符合庄重的叙事语体。
- source_word: שְׁמַע
  choice: 你要听
  rationale: 保留“听、留心听从”的语义张力，不直接译成“顺服”；后面的“遵行”已表达付诸行动的要求。希伯来文先以单数称集体以色列，随后改用复数，译文相应保留“你／你们”的转换。
- source_word: הַחֻקִּים
  choice: 律例
  rationale: 在法律语境中表达制定并确立的规条，并与 מִשְׁפָּטִים 区分。
- source_word: הַמִּשְׁפָּטִים
  choice: 典章
  rationale: 保留其司法、裁定及规范层面的含义，同时与“律例”形成传统而清楚的法律用语组合。
- source_word: מְלַמֵּד
  choice: 我教导
  rationale: 分词表示摩西当前持续进行的教导；现代汉语无需另加“正在”也可自然表达。
- source_word: לַעֲשׂוֹת
  choice: 遵行
  rationale: 不仅指知道这些法令，而是实际实行；“遵行”在现代中文中自然体现法律命令的执行含义。
- source_word: לְמַעַן תִּחְיוּ
  choice: 好使你们存活
  rationale: 清楚表达目的或预期结果，同时保留生命与遵行命令之间的盟约性关联。
- source_word: וּבָאתֶם
  choice: 进去
  rationale: 保留进入应许之地的方向含义，并与下文“取得”构成连续动作。
- source_word: וִירִשְׁתֶּם
  choice: 取得
  rationale: 在土地语境中指取得并占有；正文采用简明自然的说法，脚注保留“占有／承受”为业的可能含义。
- source_word: הָאָרֶץ
  choice: 那地
  rationale: “地”保留五经应许土地的盟约用语；指示词“那”使中文所指自然明确。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来四字神名 YHWH 的通常学术重构音译，直接保留上帝的盟约之名。
- source_word: אֱלֹהֵי אֲבֹתֵיכֶם
  choice: 你们祖先的上帝
  rationale: 自然表达祖辈传承的盟约公式；“祖先”在现代普通话中清楚涵盖希伯来文所指的先祖。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名，正文以“雅威”音译，避免用称号“主”取代专名；脚注说明其希伯来文字母形式及传统译名。
- issue: שְׁמַע 是否直接译作“顺服”
  choice: 听
  alternative: 听从；顺服
  rationale: 该词在语境中包含留心并回应的含义，但直接译为“顺服”会把隐含意义完全明说；后文“遵行”已明确行动层面。
- issue: וִירִשְׁתֶּם 在应许之地语境中的含义
  choice: 取得
  alternative: 占有；承受为业
  rationale: 该动词兼有取得占有和继承产业的语义色彩；正文不把它局限为纯军事占领或纯法律继承，脚注列出替代译法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留希伯来文把以色列作为单一整体称为“你”，继而以“你们”指全体百姓的数转换；破折号标明“你们祖先的上帝”是对“雅威”的同位说明。
