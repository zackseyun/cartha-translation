  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָז
  choice: 那时
  rationale: 作时间副词，引出接下来的行动；“那时”自然庄重，也不额外强化事件先后关系。
- source_word: יַבְדִּיל
  choice: 分别出
  rationale: בדל 的使役式表示使之分开、划出作特定用途；“分别出”既保留分别之意，也符合设立逃城的语境，而未提前加入本节没有明说的用途。
- source_word: מֹשֶׁה
  choice: 摩西
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: שָׁלֹשׁ עָרִים
  choice: 三座城
  rationale: 忠实表达数词与名词；“座”是现代汉语中用于城邑的自然量词。
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: 在约旦河东岸
  rationale: 该地理习语本义为约旦河的另一边；结合随后“向日出之地”的限定，此处明确指东岸。正文采用自然清楚的现代汉语，脚注保留原文依叙述视角可表达为“约旦河那边”的特点。
- source_word: מִזְרְחָה שָׁמֶשׁ
  choice: 向日出之地
  rationale: 保留希伯来语以太阳升起表示东方的具体意象，同时用“之地”使中文地理表达自然；其意义即东边。
