  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּֽי תוֹלִ֤יד בָּנִים֙ וּ/בְנֵ֣י בָנִ֔ים וְ/נוֹשַׁנְתֶּ֖ם בָּ/אָ֑רֶץ וְ/הִשְׁחַתֶּ֗ם וַ/עֲשִׂ֤יתֶם פֶּ֨סֶל֙ תְּמ֣וּנַת כֹּ֔ל וַ/עֲשִׂיתֶ֥ם הָ/רַ֛ע בְּ/עֵינֵ֥י יְהוָֽה אֱלֹהֶ֖י/ךָ לְ/הַכְעִיסֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/025.yaml
  text: When you father children and grandchildren[a], and you have grown old in the land, and you act corruptly and make a carved image in the form of anything, and do what is evil in the eyes of Yahweh your God[c][b], provoking him to anger—
translation:
  language: zh_hans
  text: 你生儿育女，有了儿孙[a]，在那地住久了[b]，若行败坏的事，制造雕像，仿照任何事物的形象[c]，做耶和华你上帝眼中看为恶的事，惹他发怒——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“儿子和孙子”；这里也可泛指子女和后代。
    reason: lexical_alternative
  - marker: b
    text: 或译“在那地渐渐老去”。原文既可强调年岁增长，也可强调在当地住了很久。
    reason: lexical_alternative
  - marker: c
    text: 或译“任何事物的形象”或“任何形象”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 若
  rationale: 此处引出将来的条件性情形，主句延续至下一节；汉语用“若”既自然，也避免把警告说成必然发生。
- source_word: תוֹלִיד בָּנִים וּבְנֵי בָנִים
  choice: 你生儿育女，有了儿孙
  rationale: תוֹלִיד表达生育后代；“儿孙”自然涵盖跨代后裔，同时脚注保留原文阳性词语“儿子和孙子”的形式。
- source_word: וְנוֹשַׁנְתֶּם בָּאָרֶץ
  choice: 在那地住久了
  rationale: 该动词可指变老，也可强调在当地历时长久；“住久了”在现代汉语中清楚表达长期定居之意，并保留另一译法于脚注。
- source_word: וְהִשְׁחַתֶּם
  choice: 败坏自己
  rationale: שׁחת的使役式在此描述因偶像崇拜而陷入败坏；汉语“败坏自己”简洁地表达行为主体自身的堕落。
- source_word: פֶּסֶל תְּמוּנַת כֹּל
  choice: 任何形状的雕像
  rationale: פֶּסֶל是雕刻或制作的像，תְּמוּנַת כֹּל表示任何事物的形状或样式；此译具体而不预先以“偶像”解释其宗教性质。
- source_word: הָרַע בְּעֵינֵי
  choice: 眼中看为恶的事
  rationale: 保留希伯来语“在……眼中”的评价性惯用表达，同时符合现代汉语圣经语体。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代简体中文读者熟悉的专名“耶和华”呈现四字神名，而不以头衔替代。
- source_word: לְהַכְעִיסוֹ
  choice: 惹他发怒
  rationale: 保留使役含义，即这些恶行使上帝发怒；破折号表明句意在下一节继续。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用以色列上帝的专名。中文正文采用广为人知且可辨识为专名的“耶和华”，不以“主”等称号替代；“雅威”是另一种可能的音译。
- issue: בָּנִים וּבְנֵי בָנִים 的性别与世代范围
  choice: 儿孙
  alternative: 儿子和孙子
  rationale: 原文形式为阳性，但在面向全体盟约群体、描述后代延续的警告中，可概括性地指跨世代子孙；脚注保留字面阳性表达。
- issue: 警告从句的条件性
  choice: 若
  alternative: 当……的时候
  rationale: כִּי在此引出延续至下一节的未来情形。译作“若”保留警告的条件色彩，避免断言以色列必然败坏；“当”亦有语法可能。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“在那地”“眼中看为恶”等措辞保留申命记的盟约语体；句末破折号显示本节是未完的条件句，主句见下一节。所有脚注标记均置于相应正文位置。
