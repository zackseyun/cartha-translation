revisions:
- from: 你生儿育女，有了儿孙[a]，在那地住久了[b]，若败坏自己，制造任何形状的雕像[c]，做耶和华你上帝眼中看为恶的事，惹他发怒——
  to: 你生儿育女，有了儿孙[a]，在那地住久了[b]，若行败坏的事，制造雕像，仿照任何事物的形象[c]，做耶和华你上帝眼中看为恶的事，惹他发怒——
  rationale: 修订仅消除两处会影响源文对应的歧义：以“行败坏的事”代替带反身含义的“败坏自己”，并以“制造雕像，仿照任何事物的形象”明确פֶּסֶל与תְּמוּנַת כֹּל的关系。保留“若”、神名译法、世代概括译法及跨节破折号，不改变本节作为延续至下一节的警告从句的功能。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T04:57:07Z'
review_pass:
  verdict: revise
  source_fidelity: 正文整体准确传达了警告语境、长期居住、制造雕像、行耶和华眼中恶事及惹怒他的意思。惟“败坏自己”将וְהִשְׁחַתֶּם明确反身化，较原文“行败坏／行事败坏”多加了一层意义；“任何形状的雕像”也容易表示雕像本身可具任何几何形状，而非雕像所描绘的是任何事物的形象。
  naturalness: 行文庄重通顺，句末破折号恰当地表明条件句延续到下一节。将相关措辞改为“行败坏的事”和“制造雕像，仿照任何事物的形象”，可更自然、清晰地表达原文的两个并列动作及其关系。
  terminology: “耶和华”作为神名在现代中文圣经语境中可辨识且一致；“上帝”“雕像”“惹他发怒”均恰当。“儿孙”自然概括后代，脚注保留原文阳性形式，处理稳妥。
  issues:
  - severity: medium
    issue: “败坏自己”带有明确反身意义。
    rationale: וְהִשְׁחַתֶּם在此指行事败坏、败坏地行；原文并未明说“自己”是受事。改作“行败坏的事”避免增加反身宾语。
  - severity: medium
    issue: “任何形状的雕像”可能误指雕像具有任意形状。
    rationale: פֶּסֶל תְּמוּנַת כֹּל是“雕像／雕刻的像，仿照任何事物的形象”。须表达其所代表、描绘的对象无所不包。
  - severity: low
    issue: 脚注c措辞不够自然。
    rationale: “雕刻任何事物形象的像”结构重复且歧义较大；应改为清晰的“仿照任何事物的形象的雕像”或近似表达。
