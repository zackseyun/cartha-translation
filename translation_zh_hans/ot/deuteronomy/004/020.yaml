base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/020.yaml
  text: But Yahweh took you and brought you out of the iron furnace[a], out of Egypt, to be for him a people of inheritance, as it is this day.
translation:
  language: zh_hans
  text: 但耶和华带走了你们，把你们从炼铁的炉中——从埃及——领出来，使你们归他所有，作为他产业的子民，正如今日一样。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的专名译法，明确呈现以色列上帝的盟约之名，而不以“主”替代。
- source_word: לָקַח
  choice: 领出来
  rationale: לָקַח 的基本义是“取、带走”；这里与随后“带……脱离”相连，指耶和华将以色列人从受奴役之地领走。译作“领出来”既保留主动取得、带走之意，也符合自然中文。
- source_word: וַיּוֹצִא
  choice: 带……脱离
  rationale: 使役式表达“使出来、带出来”；结合重复的介词 מִן，译为“带你们脱离”清楚呈现出埃及的行动。
- source_word: מִכּוּר הַבַּרְזֶל
  choice: 脱离埃及这炼铁的炉
  rationale: כּוּר 是熔炼金属的炉，הַבַּרְזֶל 指铁。将“埃及”与比喻直接衔接，既保留“炼铁的炉”这一严酷熬炼的形象，也避免中文误读为从一座实际炉子出来。
- source_word: לִהְיוֹת לוֹ לְעַם נַחֲלָה
  choice: 使你们作归他为产业的子民
  rationale: 保留 לוֹ“归他”和 נַחֲלָה“产业、承受之业”的双重关系表达，不简化为泛泛的“自己的子民”。
- source_word: כַּיּוֹם הַזֶּה
  choice: 正如今日一样
  rationale: 保留希伯来语指向当下可见事实的惯用表达，语体庄重而易懂。
theological_decisions:
- issue: לְעַם נַחֲלָה 中盟约归属与“产业”的关系
  choice: 归他为产业的子民
  alternative: 属他自己的子民；作他的产业
  rationale: 原文同时含“归他”与“产业”两个成分。正文保留产业意象及其盟约归属意味，不把它消解为较宽泛的“自己的”，也不强行限定产业究竟是他所拥有的产业还是他所承受的份。
translation_notes:
  register: 采用现代、庄重而通顺的简体中文。“耶和华”为专名；“炼铁的炉”和“产业”保留原文核心意象。用“你们”反映复数受词。
