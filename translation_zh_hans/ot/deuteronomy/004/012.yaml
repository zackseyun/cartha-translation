base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/012.yaml
  text: Then Yahweh spoke to you from the midst of the fire[a]. You heard the sound of words[c][b], but saw no form—only a voice.
translation:
  language: zh_hans
  text: 耶和华从火中对你们说话[a]。你们听见话语的声音[b]，却没有看见任何形像[c]，只有声音。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “从火中”也可译作“从火焰中”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“话语的声音”，也可译作“言语声”。
    reason: lexical_alternative
  - marker: c
    text: “形像”也可译作“形状”“样式”或“外观”；原文强调他们没有看见任何可见的形态。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的专名形式来对应四字神名，保留其作为盟约之神专名的功能。
- source_word: וַיְדַבֵּר
  choice: 说话
  rationale: דבר在此指发出可听见、具有言语内容的话；“说话”自然地承接下文“说话的声音”。
- source_word: מִתּוֹךְ הָאֵשׁ
  choice: 从火中
  rationale: 保留מִתּוֹךְ所表达的从火之内发出的空间意象，同时符合现代汉语习惯。
- source_word: קוֹל דְּבָרִים
  choice: 说话的声音
  rationale: 该短语直指具有言语内容的声音；此译法既保留קוֹל与דְּבָרִים的组合，又避免把它简化为仅仅“话语”。
- source_word: שֹׁמְעִים
  choice: 听见
  rationale: 虽为分词形式，在摩西回述过去事件的语境中以过去事件理解；汉语动词无需另加时态标记。
- source_word: תְמוּנָה
  choice: 形像
  rationale: תְמוּנָה可指可见的形态、样式或表象；“形像”保留其可见且可能具有代表性的含义，不限定为具体物体。
- source_word: אֵינְכֶם רֹאִים
  choice: 没有看见任何
  rationale: 准确表达否定存在结构与视觉动词的组合，并以“任何”清楚强调完全未见。
- source_word: זוּלָתִי קוֹל
  choice: 只有声音
  rationale: זוּלָתִי表示排除后的唯一例外；这里与前面的视觉否定形成听觉与视觉的鲜明对照。
theological_decisions:
- issue: 上帝显现中的可听启示与不可见形态
  choice: 保留“听见说话的声音”与“没有看见任何形像”的对照，不作教义性扩写。
  alternative: 译作“你们听见他的声音，却没有看见他的可见表象”。
  rationale: 原文强调以色列确实听见神的话，却未见任何תְמוּנָה；译文维持这种张力，不把经文提前解释为更完整的图像禁令或关于神本体的论述。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“耶和华”符合简体中文圣经传统；用“你们”保留复数受话者。句式着重呈现“听见”与“没有看见”的对比。
