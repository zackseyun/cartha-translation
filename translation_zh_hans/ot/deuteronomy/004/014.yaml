base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/014.yaml
  text: And at that time Yahweh commanded me to teach you statutes and judgments[b][a], so that you might do them in the land that you are crossing over to possess.
translation:
  language: zh_hans
  text: 至于我，雅威在那时吩咐我教导你们律例和典章[a]，使你们在你们将要过去取得为业的那地，遵行这些律例和典章。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “律例和典章”也可译作“法令和裁定”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֹתִי
  choice: 至于我
  rationale: 保留前置宾语所表达的轻微强调和对比，同时符合现代汉语表达。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译呈现上帝的专名，而不用称号替代。
- source_word: צִוָּה
  choice: 吩咐
  rationale: 表达具有权威性的命令；在摩西受托教导以色列人的语境中庄重而自然。
- source_word: לְלַמֵּד
  choice: 教导
  rationale: 准确表达摩西受命把律法内容传授给百姓的职责。
- source_word: חֻקִּים וּמִשְׁפָּטִים
  choice: 律例和典章
  rationale: 保留两个希伯来法律术语的并列及其概念差异，又采用普通中文读者熟悉的圣经法律用语。
- source_word: לַעֲשֹׂתְכֶם אֹתָם
  choice: 要你们……遵行
  rationale: 该结构表达目的；“遵行”自然地传达在法律语境中“实行它们”的含义。
- source_word: עֹבְרִים שָׁמָּה
  choice: 将要过去
  rationale: 表达百姓即将越过边界进入那地；不在正文中补出希伯来文本此处未明说的“约旦河”。
- source_word: לְרִשְׁתָּהּ
  choice: 取得为业
  rationale: 兼顾该动词“占有、取得”与“承受为业”的语义张力，符合申命记中土地既要进入取得、又是所赐产业的背景。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 正文采用较贴近学界通常重构读音的音译“雅威”，明确将其作为专名呈现；“耶和华”是汉语传统音译，但反映另一种历史读法。
- issue: לְרִשְׁתָּהּ 所含的土地取得与承受为业之关系
  choice: 取得为业
  alternative: 占有
  rationale: “取得为业”不把含义单独收窄为军事占有或被动继承，保留原词在申命记土地神学中的双重色彩。
translation_notes:
  register: 采用庄重、清晰的现代标准汉语。“至于我”保留希伯来语前置宾语的强调；“那片土地”使长定语在中文中更易理解。正文没有擅自补出“约旦河”，并以“取得为业”保留 ירש 的语义张力。
