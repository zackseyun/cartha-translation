  text: הֲ/שָׁ֣מַֽע עָם֩ ק֨וֹל אֱלֹהִ֜ים מְדַבֵּ֧ר מִ/תּוֹךְ הָ/אֵ֛שׁ כַּ/אֲשֶׁר שָׁמַ֥עְתָּ אַתָּ֖ה וַ/יֶּֽחִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/033.yaml
  text: Has any people heard the voice of God speaking from the midst of the fire[a], as you have heard, and lived?
translation:
  language: zh_hans
  text: 可曾有哪个民族像你一样，听见上帝从火焰中说话的声音，并且仍然活着呢？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“并且幸存下来。”希伯来文动词直译为“活着”；上下文强调他们听见上帝从火焰中说话之后仍然活着。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲ/שָׁמַע
  choice: 可曾……听见
  rationale: 疑问词与完成式动词构成修辞性问句；“可曾”自然表达截至当时是否有过这种经历。
- source_word: עָם
  choice: 民族
  rationale: 这里指作为整体的族群，并与以色列作比较；“民族”比泛指人群的“人民”更清楚。
- source_word: קוֹל אֱלֹהִים מְדַבֵּר
  choice: 上帝……说话的声音
  rationale: קוֹל 在“说话”的语境中指可辨识的声音；אֱלֹהִים 虽有复数形态，但受单数分词修饰，且上下文明确指上帝。
- source_word: מִ/תּוֹךְ הָ/אֵשׁ
  choice: 从火中
  rationale: 准确保留声音来自火焰内部的空间意象，同时符合现代汉语习惯。
- source_word: כַּ/אֲשֶׁר שָׁמַעְתָּ אַתָּה
  choice: 像你一样，听见
  rationale: כַּאֲשֶׁר 引出比较；独立代词 אַתָּה 强调“你”，汉语用前置的“像你一样”体现这种对照。
- source_word: וַ/יֶּחִי
  choice: 还能活着
  rationale: 基本词义是“活着”；“还”在汉语中自然呈现听见上帝说话后仍然存活的语境性反差，而不改译为更具解释性的“幸存”。
theological_decisions:
- issue: אֱלֹהִים 在上帝直接显现的语境中如何译出
  choice: 上帝
  alternative: 神／一位神／众神
  rationale: 单数分词 מְדַבֵּר 和何烈山立约语境都表明所指是以色列的上帝；译作单数专称，不另加教义性说明。
- issue: 是否明确听见上帝说话通常会导致死亡这一隐含对照
  choice: 还能活着
  alternative: 活着／幸存下来
  rationale: 原文只以连接词并列“听见”与“活着”，但语境形成明显反差。“还能活着”以自然汉语传达该反差，同时保留“活”的基本词义；脚注注明更解释性的译法。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“可曾”保留修辞问句的庄重感；“哪个民族”清楚表达 עָם 的群体含义。脚注标记紧接相关分句，且正文与脚注均保留“活着／幸存”的词义张力。
