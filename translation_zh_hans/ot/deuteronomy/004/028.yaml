  text: וַ/עֲבַדְתֶּם שָׁ֣ם אֱלֹהִ֔ים מַעֲשֵׂ֖ה יְדֵ֣י אָדָ֑ם עֵ֣ץ וָ/אֶ֔בֶן אֲשֶׁ֤ר לֹֽא יִרְאוּ/ן֙ וְ/לֹ֣א יִשְׁמְע֔וּ/ן וְ/לֹ֥א יֹֽאכְל֖וּ/ן וְ/לֹ֥א יְרִיחֻֽ/ן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/028.yaml
  text: And there you will serve gods[a], the work of human hands, wood and stone, which neither see nor hear nor eat nor smell.
translation:
  language: zh_hans
  text: 在那里，你们必侍奉诸神；这些神是人手所造的，用木头和石头制成。它们不看，不听，不吃，也不闻。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַעֲבַדְתֶּם
  choice: 你们必侍奉
  rationale: עבד在此指事奉、敬拜；上下文是摩西对将来流散处境的警告，“必侍奉”自然表达其预告语气。
- source_word: שָׁם
  choice: 在那里
  rationale: 指上一节所说以色列人被分散所到的列国之地。
- source_word: אֱלֹהִים
  choice: 诸神
  rationale: 保留该词在此处的复数词义；下文随即说明这些所谓的神是人手所造，故不直接释作“偶像”。
- source_word: מַעֲשֵׂה יְדֵי אָדָם
  choice: 人手所造的
  rationale: 以自然现代汉语表达“人手的作品”；אָדָם在这里泛指人类，并非特指男性。
- source_word: עֵץ וָאֶבֶן
  choice: 木头和石头
  rationale: 此处指制造神像的材料，故עֵץ取“木头”而非“树木”。
- source_word: אֲשֶׁר לֹא יִרְאוּן וְלֹא יִשְׁמְעוּן וְלֹא יֹאכְלוּן וְלֹא יְרִיחֻן
  choice: 它们不看、不听、不吃，也不闻
  rationale: 逐项保留希伯来文反复出现的否定，维持简洁而有节奏的讽刺性列举；不擅自把“不”强化为“不能”。
- source_word: יְרִיחֻן
  choice: 闻
  rationale: 该动词在此指嗅闻；“闻”与前面的看、听、吃并列，简明自然。
theological_decisions:
- issue: אֱלֹהִים是否直接译作“偶像”
  choice: 诸神
  alternative: 偶像／神像
  rationale: “诸神”保留原词的表层称谓以及经文的反讽张力；“人手所造的木头和石头”已清楚揭示其偶像性质。
- issue: 感官动词的否定应译作事实否定还是能力否定
  choice: 不看、不听、不吃，也不闻
  alternative: 不能看、不能听、不能吃，也不能闻
  rationale: 希伯来文直接使用לֹא加动词，并未明说能力情态；采用“不”既贴近形式，也让偶像无能的含义由上下文自然呈现。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。“诸神”保留原文称谓，“就是”引出同位说明；后半句用四个短促并列动词再现原文的修辞节奏。
