  text: But you who hold fast to Yahweh your God are all alive today[a].
translation:
  language: zh_hans
  text: 但你们这些紧紧依附雅威——你们的上帝——的人，今天全都活着[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “紧紧依附”也可译作“紧贴”或“紧紧相连”；这里表示对雅威亲密而忠诚的盟约归附。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַתֶּם
  choice: 但你们这些……的人
  rationale: 连词与独立代词在此承接上文，与因巴力·毗珥之事而灭亡的人形成对比；用“但”自然表达转折。
- source_word: הַ/דְּבֵקִים
  choice: 紧紧依附
  rationale: דבק 的分词形式描述持续贴近、依附的状态；“紧紧依附”既保留具体的黏附意象，也可表达对盟约之神的忠诚归附，而不把含义缩窄为单纯顺服。
- source_word: בַּ/יהוָה
  choice: 雅威
  rationale: 介词 ב 在 דבק 后表达依附的对象；神名 יהוה 音译为“雅威”，保留原文所用的盟约之名。
- source_word: אֱלֹהֵי/כֶם
  choice: 你们上帝
  rationale: 保留原文与“雅威”同位的称谓及第二人称复数所属关系，明确雅威是受话者的上帝。
- source_word: חַיִּים
  choice: 活着
  rationale: 作谓语，说明受话者当前仍有生命；“活着”是现代汉语中自然直接的表达。
- source_word: כֻּלְּ/כֶם
  choice: 全都
  rationale: 表达群体无一例外的强调，位置安排符合现代汉语习惯。
- source_word: הַ/יּוֹם
  choice: 今天
  rationale: 准确保留原文的当日指向，语言现代明白。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；采用“雅威”音译，以区别于称号“主”，并保留其作为以色列之神盟约名字的功能。
- issue: דבק 所表达的关系
  choice: 紧紧依附
  alternative: 专靠；持守；与……联合
  rationale: 原词兼有贴近、黏附及忠诚归附的意味。“紧紧依附”保留这一形象及关系层面的张力，不把它解释成特定宗派意义上的联合，也不简化为抽象的遵命。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“但”凸显与上一节灭亡者的对照；保留分词所表达的持续依附状态，句末“今天全都活着”重现原文的结论与强调。
