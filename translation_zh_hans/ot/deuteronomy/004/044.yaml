  text: וְ/זֹ֖את הַ/תּוֹרָ֑ה אֲשֶׁר שָׂ֣ם מֹשֶׁ֔ה לִ/פְנֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/044.yaml
  text: And this is the law that Moses set before the sons of Israel:[a]
translation:
  language: zh_hans
  text: 这就是摩西摆在以色列子民面前的律法：[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“以色列人”；较直译为：“以色列众子”。
    reason: 说明בְּנֵי יִשְׂרָאֵל既可按民族整体译为“以色列人”，也可更贴近其阳性复数亲属形式译为“以色列众子”。
lexical_decisions:
- source_word: וְזֹאת
  choice: 这就是
  rationale: וְ与指示代词共同引出下一段。中文以“这就是”自然地保留其呈示和承接作用；不必机械译出“和”。
- source_word: הַתּוֹרָה
  choice: 律法
  rationale: תּוֹרָה可泛指教导或训诲，但此处作为申命记段落标题，指摩西向以色列陈明的盟约性律法；“律法”符合上下文及现代中文圣经语体。
- source_word: אֲשֶׁר שָׂם
  choice: 摆在
  rationale: שׂוּם本义为放置、设立，与לִפְנֵי连用表示把律法陈列、提出在百姓面前。“摆在……面前”既贴近原文意象，也自然易懂。
- source_word: מֹשֶׁה
  choice: 摩西
  rationale: 采用现代中文通行的圣经人名译法。
- source_word: לִפְנֵי
  choice: 在……面前
  rationale: 此处表示向作为听众的以色列民公开陈明；“在……面前”保留原文空间性表达及正式呈示的意味。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列子民
  rationale: 字面为“以色列的众子”，在此是全民族的固定称谓。“以色列子民”保留亲属群体意象，又比“以色列的儿子们”更符合现代汉语，并可自然涵盖作为整体的百姓。
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל的性别形式与民族整体所指
  choice: 以色列子民
  alternative: 以色列人；以色列众子；以色列的儿女
  rationale: 原文采用阳性复数亲属称谓，但惯常指作为盟约群体的以色列全民族。译作“子民”既不把它误限为成年男性，也保留其民族归属和群体关系；脚注列出更直译及更通俗的可能译法。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“这就是”用于段落标题式引介；“摆在……面前”保留希伯来文的具体意象和正式陈明之意。标点使用中文全角冒号，引出脚注标记。
