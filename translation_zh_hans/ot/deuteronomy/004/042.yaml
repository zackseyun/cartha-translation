base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/042.yaml
  text: so that a manslayer who kills his neighbor unintentionally[a], without knowledge, and was not hating him previously[b], may flee there to one of these cities and live.
translation:
  language: zh_hans
  text: 好让那无意中杀死邻舍、先前并不恨他的杀人者，可以逃到这些城中的一座去，得以存活。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָנֻס שָׁמָּה
  choice: 好让……可以逃到那里
  rationale: 带介词 ל 的不定式在上下文中表示设立这些城的目的；用“好让……可以”自然传达目的关系。
- source_word: רוֹצֵחַ
  choice: 杀人者
  rationale: 此处指造成他人死亡的人，并不预先判定其具有谋杀罪责；“杀人者”比“凶手”更能保留法律语境中的中性范围。
- source_word: רֵעֵהוּ
  choice: 邻舍
  rationale: רֵעַ 指与当事人有社会关系的同伴或邻人；“邻舍”简洁地保留这一关系性含义。
- source_word: בִּבְלִי דַעַת
  choice: 无意中
  rationale: 字面为“在没有知识的情况下”；在逃城的法律语境中，指并非明知或故意而杀人。“无意中”传达其法律意义，字面形式收入脚注。
- source_word: וְהוּא לֹא שֹׂנֵא לוֹ
  choice: 并不恨他
  rationale: 分词 שֹׂנֵא 表示持续的敌意状态；此译法自然表达当事人此前并无仇恨。
- source_word: מִתְּמוֹל שִׁלְשׁוֹם
  choice: 素来
  rationale: 该习语字面提及“昨日、前日”，实际表示此前一向如此；“素来”既简洁又能修饰持续的“不恨”。
- source_word: אֶל אַחַת מִן הֶעָרִים הָאֵל
  choice: 进入这些城中的一座
  rationale: 保留“这些”的近指意义及“一座”的单数选择；“进入”符合逃入避难城的语境。
- source_word: וָחָי
  choice: 得以存活
  rationale: 表达逃入城后的结果，即生命获得保全，同时不加入经文未明说的程序细节。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的法律叙事语体。“杀人者”避免“凶手”所暗含的故意犯罪判断；“邻舍”和“得以存活”兼顾经文语感与现代可读性。
