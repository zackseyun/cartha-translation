  text: and all the Arabah beyond the Jordan eastward[a], as far as the Sea of the Arabah, below the slopes of Pisgah.
translation:
  language: zh_hans
  text: 以及约旦河东岸的整个亚拉巴，直到亚拉巴海[a]，位于毗斯迦山坡之下。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “亚拉巴海”通常被认定为死海。
    reason: 说明古地理名称与现代通称的对应关系。
lexical_decisions:
- source_word: וְכָל הָעֲרָבָה
  choice: 以及……整个亚拉巴
  rationale: 保留连接词和范围完整性；“亚拉巴”在此是约旦裂谷地区的地名，不泛化为“平原”。
- source_word: עֵבֶר הַיַּרְדֵּן מִזְרָחָה
  choice: 约旦河东边
  rationale: 按本节地理语境自然表达“约旦河彼岸、向东”的方位，避免生硬直译，同时明确所指为东岸。
- source_word: יָם הָעֲרָבָה
  choice: 亚拉巴海
  rationale: 保留希伯来文的地理名称，不在正文中直接换成后来的通称“死海”；其通常认定见脚注。
- source_word: תַּחַת אַשְׁדֹּת הַפִּסְגָּה
  choice: 毗斯迦山坡下的地区
  rationale: אַשְׁדֹּת在地形语境中指山坡或坡地；“山坡下的地区”以自然汉语表达其地势关系。
- source_word: הַפִּסְגָּה
  choice: 毗斯迦
  rationale: 按圣经地名的通行中文音译处理。
theological_decisions: []
