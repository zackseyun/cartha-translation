  to: 免得你们行事败坏[a]，为自己制作雕刻的像，即任何形体的形像，仿照男或女的样式——
  rationale: 修订仅澄清原文中“雕刻的像”之后一连串同位说明的关系：所禁止制作的是任何形体的形像，具体可仿照男性或女性的样式。脚注将“败坏自己”调整为“使自己败坏”，以更贴近使役词形，同时仍保留可作反身理解的译法。
