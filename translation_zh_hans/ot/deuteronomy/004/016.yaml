  naturalness: “做成任何形体的形像”在现代汉语中不够顺畅，读者容易理解为先制作雕像、再把它做成某种形像。改为“即任何形体的形像”可明确这是对所造之像的说明，同时保留原文的累加式表达。
  terminology: 将 פֶּסֶל 译为“雕刻的像”比“雕像”更直接体现其制作方式，也避免“雕像”在现代汉语中偏向立体雕塑的联想。保留“形体／形像／样式”的区分，不把 סָמֶל 收窄为“偶像”。
