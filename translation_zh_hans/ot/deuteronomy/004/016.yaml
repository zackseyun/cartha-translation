  text: פֶּ֨ן תַּשְׁחִת֔וּ/ן וַ/עֲשִׂיתֶ֥ם לָ/כֶ֛ם פֶּ֖סֶל תְּמוּנַ֣ת כָּל סָ֑מֶל תַּבְנִ֥ית זָכָ֖ר א֥וֹ נְקֵבָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/016.yaml
  text: so that you do not act corruptly and make for yourselves a carved image[a], in the form of any figure, the likeness of male or female—
translation:
  language: zh_hans
  text: 免得你们行事败坏[a]，为自己制作雕刻的像，即任何形体的形像，仿照男或女的样式——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “行事败坏”或译“使自己败坏”。
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּן
  choice: 免得
  rationale: 引出所警戒的不良结果；“免得”在现代汉语中自然保留了希伯来语的警告语气。
- source_word: תַּשְׁחִתוּן
  choice: 行事败坏
  rationale: 该使役词形在本处可表达以悖逆行为带来败坏；“行事败坏”保留主动的道德含义，同时不把对象限定得过死。
- source_word: וַעֲשִׂיתֶם לָכֶם
  choice: 为自己制作
  rationale: 保留 לָכֶם 的受益兼反身意味，突出这是人自行制作的敬拜对象。
- source_word: פֶּסֶל
  choice: 雕像
  rationale: 指经雕刻或塑造而成的像；“雕像”简洁、现代，并保留具体制作方式。
- source_word: תְּמוּנַת כָּל סָמֶל
  choice: 任何形体的形像
  rationale: 保留两个彼此重叠的形像用语及原文的累加表达；“形体”避免直接收窄为“偶像”，而上下文仍清楚表明其宗教禁令性质。
- source_word: תַּבְנִית
  choice: 样式
  rationale: 表示样式、模型或相似形态；与前面的“形像”有所区分，也自然衔接男或女的类别。
- source_word: זָכָר אֹו נְקֵבָה
  choice: 男或女
  rationale: 原词表示雄性/雌性的性别类别；在人形语境中，“男或女”准确而自然。
theological_decisions:
- issue: 反偶像语境中多个形像词的处理
  choice: 分别译作“雕像”“形体”“形像”“样式”，保留原文词语层叠
  alternative: 统一译作“偶像”或“像”
  rationale: 原文使用多个意义相近但并不完全相同的词。避免全部统一为“偶像”，可保留对各种可见表象的广泛禁止，也不把 סָמֶל 的含义作不必要的教义化收窄。
- issue: תַּשְׁחִתוּן 的主动与反身含义
  choice: 正文译“行事败坏”，脚注保留“败坏自己”
  alternative: 正文直接译“败坏自己”
  rationale: 该词既可强调败坏的行为，也可理解为使自己败坏。正文采用自然的主动表达，脚注保留反身理解，不消除原文的语义张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“做成……仿照……”使希伯来语连续的同位修饰关系在中文中清楚可读，同时保留原文对形像类别逐层铺陈的修辞。
