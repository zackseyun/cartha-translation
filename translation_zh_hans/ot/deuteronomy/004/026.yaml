  text: הַעִידֹתִי֩ בָ/כֶ֨ם הַ/יּ֜וֹם אֶת הַ/שָּׁמַ֣יִם וְ/אֶת הָ/אָ֗רֶץ כִּֽי אָבֹ֣ד תֹּאבֵדוּ/ן֮ מַהֵר֒ מֵ/עַ֣ל הָ/אָ֔רֶץ אֲשֶׁ֨ר אַתֶּ֜ם עֹבְרִ֧ים אֶת הַ/יַּרְדֵּ֛ן שָׁ֖מָּ/ה לְ/רִשְׁתָּ֑/הּ לֹֽא תַאֲרִיכֻ֤/ן יָמִים֙ עָלֶ֔י/הָ כִּ֥י הִשָּׁמֵ֖ד תִּשָּׁמֵדֽוּ/ן־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/026.yaml
  text: I call heaven and earth to witness against you today that you will surely perish quickly from the land that you are crossing the Jordan to possess[a]. You will not prolong your days on it[c][b], for you will surely be destroyed.
translation:
  language: zh_hans
  text: 我今日请天和地作证，指控你们：你们必很快从你们正过约旦河去取得的那地上灭亡。你们在那地上的日子必不长久，因为你们必定被毁灭。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַעִידֹתִי בָכֶם
  choice: 请……作证控告你们
  rationale: 使役式在此具有法律、盟约诉讼色彩；介词 ב 表明证词针对以色列。此译法既保留“召请作证”的含义，也自然表达不利见证。
- source_word: אֶת הַשָּׁמַיִם וְאֶת הָאָרֶץ
  choice: 天和地
  rationale: 这是盟约见证的固定表达；现代汉语用“天和地”清楚自然，也不必机械呈现希伯来语“天”的复数形态。
- source_word: אָבֹד תֹּאבֵדוּן
  choice: 必……灭亡
  rationale: 不定式绝对形与限定动词连用，强调结果的确定性；“必”准确传达这种语势。
- source_word: מַהֵר מֵעַל הָאָרֶץ
  choice: 很快从那地上
  rationale: מַהֵר 表示迅速发生；מֵעַל 具有从土地表面被除去的空间意味，“从那地上”保留了这一意象。
- source_word: אֲשֶׁר אַתֶּם עֹבְרִים אֶת הַיַּרְדֵּן שָׁמָּה לְרִשְׁתָּהּ
  choice: 你们正在过约旦河，要到那里取得那地
  rationale: 明确保留 שָׁמָּה“到那里”的方向意义；ירשׁ 在应许之地语境中指取得并占有，译作“取得”自然且不过度解释为继承。
- source_word: לֹא תַאֲרִיכֻן יָמִים עָלֶיהָ
  choice: 你们在那地上的日子必不长久
  rationale: 保留“日子长久”的希伯来语意象，同时符合现代汉语表达；עָלֶיהָ 译作“在那地上”。
- source_word: הִשָּׁמֵד תִּשָּׁמֵדוּן
  choice: 必被彻底毁灭
  rationale: 被动式不定式绝对形加强“被毁灭”的确定性和强度；“彻底”传达强调语势，但不采用可能暗示形而上彻底消失的“灭绝”。
theological_decisions:
- issue: 天地作为盟约见证者的法律性表达
  choice: 请天和地作证控告你们
  alternative: 我今天以天和地向你们作证
  rationale: 原文将天地召为针对以色列的见证者，具有盟约诉讼色彩；所选译文保留这一法律关系，不把天地仅处理为摩西起誓所凭借的对象。
- issue: 双重毁灭措辞的范围
  choice: 分别译作“灭亡”和“被彻底毁灭”
  alternative: 两处都译作“灭绝”
  rationale: 原文先用主动词根 אבד，后用被动式 שׁמד，并各有强调结构。译文保留词汇差异和严厉语势，同时不额外断定其指向个体永恒命运或民族绝对不复存在。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“作证控告”呈现盟约诉讼语气；分号划清审判宣告与土地关系从句，避免过长定语。“那地”延续《申命记》中应许之地的常见指称，但不额外加入“应许”等解释性词语。
