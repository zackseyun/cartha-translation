revisions:
- from: 我今天请天和地作证控告你们：你们必很快从那地上灭亡；你们正在过约旦河，要到那里取得那地。你们在那地上的日子必不长久，因为你们必被彻底毁灭。
  to: 我今日请天和地作证，指控你们：你们必很快从你们正过约旦河去取得的那地上灭亡。你们在那地上的日子必不长久，因为你们必定被毁灭。
  rationale: 修订将“正过约旦河去取得”的关系从句恢复为“那地”的直接限定，保留原文的方向和取得土地的目的，同时使中文句法自然。保留天地见证的法律性和两项严厉审判的区别；以“必定被毁灭”传达第二个强调结构，不额外界定毁灭的范围。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T04:57:03Z'
review_pass:
  verdict: revise
  source_fidelity: 草稿准确呈现了天地作为不利见证者、两处不定式绝对形所加强的确定语气，以及从土地上迅速灭亡和随后被毁灭的审判宣告。不过，原文中“你们正过约旦河去取得的那地”是“那地”的限定语，不应在中文中被断开为后置的独立分句。
  naturalness: “你们必很快从那地上灭亡；你们正在过约旦河，要到那里取得那地”在分号之后造成句法断裂，也暂时模糊“那地”与渡过约旦河的关系。将该关系从句直接置于“那地”之前，更符合现代汉语并贴合原文结构。
  terminology: “天和地”“约旦河”“那地”“作证，指控你们”均合适。“被彻底毁灭”可译为“被毁灭”；“必定”已经连同前面的强化结构传达确定语气，且避免“彻底”在中文里可能附加的绝对化程度。
  issues:
  - severity: medium
    issue: 土地关系从句被拆分为独立分句
    rationale: אֲשֶׁר אַתֶּם עֹבְרִים אֶת־הַיַּרְדֵּן שָׁמָּה לְרִשְׁתָּהּ 限定“那地”。草稿以分号断开后，“要到那里取得那地”不再清楚地修饰前面的“那地”，也使“从那地上灭亡”的威胁与该土地的身份脱节。
  - severity: low
    issue: “彻底”略有添加式强化
    rationale: הִשָּׁמֵד תִּשָּׁמֵדוּן 确有强调，但中文以“必定被毁灭”已能自然表达；“彻底”可带出原文未明说的绝对范围。
  revised_text: 我今日请天和地作证，指控你们：你们必很快从你们正过约旦河去取得的那地上灭亡。你们在那地上的日子必不长久，因为你们必定被毁灭。
