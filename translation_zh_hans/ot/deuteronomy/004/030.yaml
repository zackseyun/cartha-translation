base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/030.yaml
  text: When you are in distress[a], and all these things come upon you[b], in the latter days you will return to Yahweh your God and listen to his voice.
translation:
  language: zh_hans
  text: 当你陷入困境、这一切事都临到你时，在末后的日子[a]，你必归向耶和华你的上帝，听从他的声音[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“在将来的日子”。希伯来语“末后的日子”可以泛指未来的一段时期，不一定专指某一种末世论所设定的时期。
    reason: alternative_reading
  - marker: b
    text: 也可译为“听他的声音”；这里的希伯来语表达通常含有听命、顺服的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּצַּר לְךָ
  choice: 你陷入困境
  rationale: צַר表示困苦、窘迫的处境；结合无动词分句和上下文，译为“你陷入困境”自然表达其状态，又不把它强化为特定的末世“大灾难”。
- source_word: וּמְצָאוּךָ כֹּל הַדְּבָרִים הָאֵלֶּה
  choice: 这一切事都临到你
  rationale: מצא本义为“找到”，但以所预告的事件为主语时，“临到”符合现代汉语习惯。דְּבָרִים在这里指前文所说的事情，而不只是言语。
- source_word: בְּאַחֲרִית הַיָּמִים
  choice: 到了末后的日子
  rationale: 保留希伯来语公认的时间表达及其神学回响；“到了”使汉语时序自然，而脚注说明该短语也可宽泛指将来的日子。
- source_word: וְשַׁבְתָּ עַד
  choice: 你就会归向
  rationale: שׁוּב与עַד连用表示转回、归向某人。“归向”保留关系性和圣约语境，但不额外加入原动词未明说的系统性“悔改”术语。
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: 耶和华你的上帝
  rationale: 以“耶和华”呈现四字神名在现代中文圣经传统中的通行音译；“你的上帝”保留第二人称单数及圣约关系。
- source_word: וְשָׁמַעְתָּ בְּקֹלוֹ
  choice: 听从他的话
  rationale: שׁמע בְּקוֹל既有聆听之意，也常包含听命、顺从的含义。“听从他的话”在现代汉语中自然地表达这两层意思；脚注保留较贴近字面的译法。
theological_decisions:
- issue: בְּאַחֲרִית הַיָּמִים是否必须指特定的末世时期
  choice: 末后的日子
  alternative: 将来的日子
  rationale: 正文保留原文惯用语及其可能具有的末世意味，但借脚注说明它也可泛指未来，从而不把经文限定于某一种末世论架构。
- issue: וְשַׁבְתָּ עַד所表达的圣约性回转
  choice: 归向耶和华你的上帝
  alternative: 悔改，转向耶和华你的上帝
  rationale: “归向”准确表达回转到上帝面前的关系性含义，同时避免把原动词单独承载的意义扩展成更完整的教义表述。
- issue: שׁמע בְּקוֹל中的聆听与顺服
  choice: 听从他的话
  alternative: 听他的声音
  rationale: 该希伯来表达常包含顺服之意。“听从”在中文中保留实际听命的内涵，而脚注说明其字面声音意象，避免只取其中一面。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。句子保留原文从困境、诸事临到，到末后归向上帝的推进关系；以“你”维持希伯来语第二人称阳性单数的直接圣约称呼。脚注标记置于其实际所说明的短语之后，修正咨询层中标记位置与脚注内容不对应的问题。
