base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/022.yaml
  text: For I am dying in this land[a]; I am not crossing the Jordan[b], but you are crossing over and will take possession of this good land.
translation:
  language: zh_hans
  text: 因为我将死在这地[a]，不会渡过约旦河；你们却要过去，得着这片美地为业[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我要死在这地。”希伯来文的分词在这里可以表示即将发生的事。
    reason: lexical_alternative
  - marker: b
    text: 或译：“占有这片美地”或“承受这片美地”。希伯来文动词可指取得并拥有土地，也可带有承受产业的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，为此前的警告和劝诫说明缘由；“因为”自然保留解释关系。
- source_word: אָנֹכִי
  choice: 我
  rationale: 独立人称代词带有强调意味；汉语在与后文“你们”的对照中已能自然体现这种强调，不必加“我自己”。
- source_word: מֵת
  choice: 就要死
  rationale: 分词在这里指摩西临近的死亡；“就要死”既表达迫近性，也比直译为“正在死”更符合现代汉语。
- source_word: בָּאָרֶץ הַזֹּאת
  choice: 在这地
  rationale: 指摩西当时所在的约旦河东之地；“地”也与申命记中土地应许的用语保持一致。
- source_word: אֵינֶנִּי עֹבֵר
  choice: 不能过
  rationale: 否定存在词与分词的组合表示摩西不会渡过去；结合上下文，“不能过”在汉语中自然表达这一确定的非实现，但不展开其原因。
- source_word: אֶת הַיַּרְדֵּן
  choice: 约旦河
  rationale: 汉语通常在该专名后补出“河”，便于普通读者辨明所指。
- source_word: וְאַתֶּם עֹבְרִים
  choice: 你们却要过去
  rationale: וְ 字面为“而、和”，此处突出摩西与以色列人的对照，故译“却”；分词结合语境指即将发生的渡河行动。
- source_word: וִירִשְׁתֶּם
  choice: 得着……为业
  rationale: ירשׁ 在应许之地的语境中兼有取得、占有和承受产业的意味；此译保留土地作为所承受产业的色彩。
- source_word: הָאָרֶץ הַטּוֹבָה הַזֹּאת
  choice: 这片美地
  rationale: “美地”自然凝练地保留“这地是好的”这一评价；量词“片”符合现代汉语对地域的表达。
theological_decisions:
- issue: 摩西不能过约旦河的性质
  choice: 译作“不能过”，不在正文补明是神禁止他过去
  alternative: 不得过约旦河
  rationale: 本节希伯来文本只陈述摩西不过河；“不能”符合上下文，但不把前文所交代的神学原因重复加入本节。
- issue: ירשׁ 的土地产业含义
  choice: 得着……为业
  alternative: 占领／拥有
  rationale: 该动词既可强调取得土地，也可带有承受产业的意味；“得着……为业”尽量兼顾二者，不把它缩减为纯军事占领或静态拥有。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“就要死”表达临近性；“你们却要过去”保留与“我不能过”的鲜明对照；“得着这片美地为业”保留申命记土地应许语境中的产业意味。所有脚注标记均已置于相关正文词语之后。
