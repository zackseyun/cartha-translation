  to: 可是，耶和华直到今日还没有赐给你们一颗使你们认识的心、能看见的眼睛和能听见的耳朵[a]。
  rationale: 修订以“使你们认识的心”更紧密对应“心去认识”，不将其预先收窄为“明白”的能力；将时间状语移至主语之后，使现代汉语语序更自然。脚注改正“有心去认识”可能引起的意愿性误解，并完整呈现三重平行结构。
