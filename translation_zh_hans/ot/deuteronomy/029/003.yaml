base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/003.yaml
  text: But Yahweh has not given you a heart to know[a], or eyes to see, or ears to hear, to this day.
translation:
  language: zh_hans
  text: 可是，耶和华直到今日还没有赐给你们一颗使你们认识的心、能看见的眼睛和能听见的耳朵[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“一颗能明白的心、能看见的眼睛和能听见的耳朵。”原文直译：“一颗心去认识、眼睛去看见、耳朵去听见。”
    reason: 保留“认识”对 ידע 的基本对应及原文三组“器官＋不定式”的平行结构，同时说明自然汉语的替代表达。
lexical_decisions:
- source_word: וְלֹא
  choice: 可是……还没有
  rationale: 连接上文以色列亲眼所见之事，同时表达转折；“可是”比单纯的“而”更自然地显出此处的对比。“还没有”也与句末“直到今日”相呼应。
- source_word: נָתַן
  choice: 赐给
  rationale: 在上帝作主语的语境中，“赐给”自然、庄重，并保留希伯来文明确表达的上帝施予行为。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文读者熟悉的神圣名字译法，不以称号取代专名。
- source_word: לֵב לָדַעַת
  choice: 一颗能明白的心
  rationale: 保留“心”的希伯来人观，涵盖理解与内在倾向；ידע在此语境中译作“明白”较符合现代汉语，同时脚注保留更贴近字面的“认识”。
- source_word: וְעֵינַיִם לִרְאוֹת
  choice: 能看见的眼睛
  rationale: 保留原文具体形象及“心—眼—耳”的平行结构。
- source_word: וְאָזְנַיִם לִשְׁמֹעַ
  choice: 能听见的耳朵
  rationale: 保留原文具体形象，也不把感知预先解释成顺服或属灵洞察。
- source_word: עַד הַיּוֹם הַזֶּה
  choice: 直到今日
  rationale: 直接表达这种缺乏持续至说话当日；前置于中文句中可使语序自然，而不改变时间范围。
theological_decisions:
- issue: 以色列缺乏认识能力与上帝行动之间的关系
  choice: 直译为耶和华尚未赐下能明白、看见和听见的内在与感知能力
  alternative: 弱化为耶和华只是容许以色列不明白，或改写为以色列自己拒绝明白
  rationale: 原文明说耶和华“没有赐给”，因此不淡化上帝的主动角色；同时不增添关于神圣主权与人类责任的系统解释，保留经文本身的张力。
- issue: “看见”和“听见”是否应解释为属灵洞察或顺服
  choice: 保留具体的“眼睛看见、耳朵听见”意象
  alternative: 译成“属灵的眼光”与“顺服的耳朵”
  rationale: 上下文显然超越单纯生理感官，但原文借具体器官表达认知；直保意象能让读者体会其延伸意义，而不替经文锁定单一解释。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。以“可是”呈现与上文的转折，以“还没有……直到今日”传达持续至当时的状态；保留“心、眼睛、耳朵”的三重平行意象。
