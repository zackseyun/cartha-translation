  text: וַ/יִּקְרָ֥א מֹשֶׁ֛ה אֶל כָּל יִשְׂרָאֵ֖ל וַ/יֹּ֣אמֶר אֲלֵ/הֶ֑ם אַתֶּ֣ם רְאִיתֶ֗ם אֵ֣ת כָּל אֲשֶׁר֩ עָשָׂ֨ה יְהוָ֤ה לְ/עֵֽינֵי/כֶם֙ בְּ/אֶ֣רֶץ מִצְרַ֔יִם לְ/פַרְעֹ֥ה וּ/לְ/כָל עֲבָדָ֖י/ו וּ/לְ/כָל אַרְצֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/001.yaml
  text: And Moses called all Israel and said to them[a], “You have seen all that Yahweh did before your eyes in the land of Egypt, to Pharaoh and to all his servants and to all his land.”
translation:
  language: zh_hans
  text: 摩西召集以色列众人，对他们说：“雅威在埃及地，当着你们的面，对法老、他所有的臣仆和他的全地所做的一切[a]，你们都看见了。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“加在法老、他所有的臣仆和他的全地身上的一切。”希伯来语介词在这里也可按上下文理解为雅威对他们施行审判。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: 召集
  rationale: 此处 קרא 指摩西把全体以色列人召来听他说话；“召集”比单纯的“呼叫”更符合大会场景，也不过度增加正式色彩。
- source_word: כָּל יִשְׂרָאֵל
  choice: 以色列众人
  rationale: 这是对立约群体的集体称呼；“以色列众人”在现代汉语中自然，并表达“全以色列”的整体范围。
- source_word: רְאִיתֶם
  choice: 你们都看见了
  rationale: 完成式指听众亲历并看见过的事；“看见了”简洁自然，“都”与复数听众及整体语境相称。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文直接音译上帝的专名，保留其作为以色列之神立约之名的性质，而不以称号代替。
- source_word: לְעֵינֵיכֶם
  choice: 当着你们的面
  rationale: 保留希伯来语“在你们眼前”的公开、亲历意味，同时采用自然的现代汉语表达。
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: 在埃及地
  rationale: 原文明确含“地”，保留这一地域表达，同时符合汉语圣经叙事语体。
- source_word: לְפַרְעֹה וּלְכָל עֲבָדָיו וּלְכָל אַרְצוֹ
  choice: 对法老、他所有的臣仆和他的全地
  rationale: 重复的 לְ 标示雅威行动所涉及或指向的对象。“对”保留一定中性，不在正文中径直将其解释为敌对审判；上下文允许“加在……身上”的理解，故列入脚注。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文使用四字神名；正文以“雅威”音译，明确保留专名，而不换成“主”等称号。
- issue: 介词 לְ 所表达的行动关系
  choice: 对法老、臣仆和全地所做的事
  alternative: 加在法老、臣仆和全地身上的事
  rationale: 介词本身可泛指行动所及的对象，而埃及灾祸的语境又明显带有审判意味。正文不把语义收窄，脚注说明较具解释性的译法，以保留原文张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“臣仆”兼顾法老宫廷官员与属下的含义；保留“埃及地”和“他的全地”等原文范围表达。句序略按汉语调整，但维持摩西召集众人、诉诸亲眼见证的叙事重点。
