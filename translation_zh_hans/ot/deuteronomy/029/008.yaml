  text: וּ/שְׁמַרְתֶּ֗ם אֶת דִּבְרֵי֙ הַ/בְּרִ֣ית הַ/זֹּ֔את וַ/עֲשִׂיתֶ֖ם אֹתָ֑/ם לְמַ֣עַן תַּשְׂכִּ֔ילוּ אֵ֖ת כָּל אֲשֶׁ֥ר תַּעֲשֽׂוּ/ן־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/008.yaml
  text: So keep the words of this covenant and do them[a], so that you may act wisely in all that you do.
translation:
  language: zh_hans
  text: 所以，你们要谨守这约的话，并且遵行，好使你们无论做什么都能明智行事[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“使你们所做的一切都顺利（或亨通）”。
    reason: תַּשְׂכִּילוּ既可强调明智地行事，也可强调行动取得成功或顺利。
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: 所以，你们要谨守
  rationale: שׁמר在盟约语境中指谨慎持守并遵守义务；“谨守”既保留盟约色彩，也符合现代汉语圣经语体。句首ו结合上文带有承接和推论意味，译作“所以”。
- source_word: דִּבְרֵי הַבְּרִית הַזֹּאת
  choice: 这约的话
  rationale: 直译“这盟约的话”；“这约的话”自然简洁，并保留דִּבְרֵי的“话”而不先行解释为“条款”。
- source_word: וַעֲשִׂיתֶם אֹתָם
  choice: 并且遵行
  rationale: 字面为“并且实行它们”，复数宾语回指“话”。汉语中省略已明确的宾语更自然，“遵行”仍表达将这些话付诸实行。
- source_word: לְמַעַן
  choice: 好使
  rationale: 表达目的或结果关系；“好使”简洁而庄重。
- source_word: תַּשְׂכִּילוּ
  choice: 能明智行事
  rationale: שׂכל的使役式可指审慎明智地行动，也可指取得成功或顺利。正文采用“明智行事”，直接呈现智慧层面的含义，同时以脚注保留结果性的可能。
- source_word: אֵת כָּל אֲשֶׁר תַּעֲשׂוּן
  choice: 无论做什么
  rationale: 自然表达“你们所做的一切”的全面范围，并与“明智行事”构成流畅现代汉语。
theological_decisions:
- issue: תַּשְׂכִּילוּ所表达的是智慧行动还是成功结果
  choice: 正文译作“明智行事”
  alternative: 凡事顺利／亨通
  rationale: 该词兼有审慎行动与由此获得成功的语义范围。正文不把盟约顺服直接窄化为物质兴旺；脚注同时保留成功、顺利这一真实可能，避免消除原文张力。
translation_notes:
  register: 采用自然、庄重的现代标准普通话。“谨守”“遵行”保留盟约语境的正式色彩；避免生硬的“实行它们”，也避免把“亨通”解释为特定的兴旺神学。
