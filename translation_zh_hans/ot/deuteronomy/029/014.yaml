base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/014.yaml
  text: but with whoever is standing here with us today before Yahweh our God[a], and with whoever is not here with us today.
translation:
  language: zh_hans
  text: 而是与今天在这里同我们一起、站在耶和华——我们的上帝面前的人，也与今天不在这里同我们一起的人[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “今天不在这里同我们一起的人”可能指当时没有参加集会的以色列人、未来的世代，或两者兼指。
    reason: 保留原文对立约对象范围的含混性，不在正文中限定其所指。
lexical_decisions:
- source_word: כִּי
  choice: 而是
  rationale: 本节承接上一节“不是单与你们”的否定结构；译作“而是”能自然表达转折和补充，而不误作单纯的因果关系。
- source_word: אֶת אֲשֶׁר
  choice: 与……的人
  rationale: אֶת 在此标示立约誓言所涉及的对象，介词“与”由上文的立约结构承接而来；用“……的人”符合现代汉语表达。
- source_word: יֶשְׁנוֹ פֹּה עִמָּנוּ
  choice: 在这里同我们一起
  rationale: 保留“在场”和“与我们同在”的双重含义，措辞自然且不过度解释。
- source_word: עֹמֵד
  choice: 站在
  rationale: 保留原文具体的站立姿态，同时符合盟约集会中众人站在上帝面前的场景。
- source_word: הַיּוֹם
  choice: 今天
  rationale: 以现代、直接的汉语对应原文，并在两个分句中保留重复所形成的强调。
- source_word: לִפְנֵי
  choice: 面前
  rationale: 准确表达空间与礼仪性的临在关系，是该结构自然、庄重的汉语译法。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以汉语圣经传统中通行的专名音译呈现神圣四字名。
- source_word: אֱלֹהֵינוּ
  choice: 我们上帝
  rationale: 直接表达第一人称复数所属关系，并与“耶和华”构成原文的完整称谓。
- source_word: וְאֵת אֲשֶׁר אֵינֶנּוּ פֹּה עִמָּנוּ
  choice: 也与今天不在这里同我们一起的人
  rationale: 与前一分句保持平行，保留存在否定的直白表达，不把对象限定为未出生的后代或当时缺席者。
theological_decisions:
- issue: “今天不在这里同我们一起的人”所指的范围
  choice: 直译为范围开放的“今天不在这里同我们一起的人”
  alternative: 明确解释为当时缺席的以色列人、未来世代，或两者兼指
  rationale: 希伯来文没有明确限定这些人的身份；正文保留其开放性，避免替原文消解可能同时涵盖缺席者与后代的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。句式承接上一节，因此以“而是”起首；保留“站在……面前”的具体盟约集会意象，并用两个平行分句再现原文结构。
