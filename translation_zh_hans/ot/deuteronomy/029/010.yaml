base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/010.yaml
  text: your little ones[a], your wives, and the sojourner who is in the midst of your camp, from the one who chops your wood to the one who draws your water[b],
translation:
  language: zh_hans
  text: 你们的孩童[a]、妻子，以及在你营中居住的寄居者[b]，从为你砍柴的人到为你打水的人，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“你们的孩子”。希伯来语 טַף 尤其指年幼的孩子或孩童，也可指受抚养者。
    reason: lexical_alternative
  - marker: b
    text: “寄居者”指居住在群体中的外来居民，并非仅指暂时路过的陌生人。
    reason: lexical_clarification
lexical_decisions:
- source_word: טַפְּכֶם
  choice: 你们的幼儿
  rationale: טַף主要指年幼的孩子，也可涵盖受抚养者；“幼儿”保留其年龄较小的具体含义。
- source_word: נְשֵׁיכֶם
  choice: 妻子
  rationale: 在盟约集会及第二人称所属关系的语境中，נָשִׁים自然指“妻子”。
- source_word: וְגֵרְךָ
  choice: 以及……寄居者
  rationale: גֵּר指居住在以色列群体中的外来居民，并非短暂停留的陌生人；“寄居者”保留其社会和法律身份。
- source_word: אֲשֶׁר בְּקֶרֶב מַחֲנֶיךָ
  choice: 住在你营中的
  rationale: 既表达其身处营内，也以自然汉语体现关系词אֲשֶׁר；单数“你”与希伯来文本一致。
- source_word: מֵחֹטֵב עֵצֶיךָ
  choice: 从为你砍柴的
  rationale: 用动词性结构体现分词חֹטֵב，并与מִן—עַד所标示的范围相配。
- source_word: עַד שֹׁאֵב מֵימֶיךָ
  choice: 到为你打水的
  rationale: “打水”是现代汉语对从水源汲取用水的自然表达，也保留与砍柴相对的劳作意象。
theological_decisions:
- issue: 盟约集会所涵盖的社会范围
  choice: 明确包括幼儿、妻子、营中的外来寄居者及从事砍柴打水等劳作的人。
  alternative: 把本节仅理解为以色列成年男子，或把劳作者视为纯粹比喻。
  rationale: 经文本身以具体列举扩展集会范围；译文保留这种广泛性，不额外限定寄居者的族属，也不把劳作者抽象化。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。依希伯来原文保留前半句复数“你们”和后半句单数“你”的转换；本节句末承接上下文，因此保留逗号。
