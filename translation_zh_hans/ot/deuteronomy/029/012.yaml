  text: לְמַ֣עַן הָקִֽים אֹתְ/ךָ֩ הַ/יּ֨וֹם ל֜/וֹ לְ/עָ֗ם וְ/ה֤וּא יִֽהְיֶה לְּ/ךָ֙ לֵֽ/אלֹהִ֔ים כַּ/אֲשֶׁ֖ר דִּבֶּר לָ֑/ךְ וְ/כַ/אֲשֶׁ֤ר נִשְׁבַּע֙ לַ/אֲבֹתֶ֔י/ךָ לְ/אַבְרָהָ֥ם לְ/יִצְחָ֖ק וּֽ/לְ/יַעֲקֹֽב־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/012.yaml
  text: so that today he may establish you as a people for himself[a], and he himself may be your God, just as he spoke to you and as he swore to your fathers, to Abraham, to Isaac[b], and to Jacob.
translation:
  language: zh_hans
  text: 为要使你今天成为属他自己的子民[a]，他也要作你的上帝，正如他对你所说的，也正如他向你的先祖，就是亚伯拉罕、以撒和雅各所起的誓[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“确立你作属他自己的子民。”
    reason: 保留 הָקִים 在盟约语境中较形式对应的译法。
  - marker: b
    text: 希伯来文直译：“向你的先祖，向亚伯拉罕、向以撒、向雅各所起的誓。”
    reason: 说明原文重复介词的庄重结构，以及“先祖”具体指这三位族长。
lexical_decisions:
- source_word: לְמַעַן
  choice: 为要
  rationale: 引出目的或结果；“为要”简洁、庄重，并保留希伯来文的目的意味。
- source_word: הָקִים אֹתְךָ הַיּוֹם
  choice: 使你今天成为
  rationale: הקים 在盟约语境中指确立某种身份或地位；汉语用“使……成为”自然表达这种确立，同时保留“今天”所指的立约时刻。
- source_word: לוֹ לְעָם
  choice: 成为属他自己的子民
  rationale: 表达归属于上帝的盟约关系；“属他自己的”对应 לוֹ，并避免把关系仅处理为所有格称谓。
- source_word: וְהוּא יִהְיֶה לְךָ לֵאלֹהִים
  choice: 他也要作你的上帝
  rationale: 采用自然的汉语盟约公式；主语“他”予以明示，保留希伯来文 וְהוּא 的强调。
- source_word: כַּאֲשֶׁר דִּבֶּר לָךְ
  choice: 正如他对你所说的
  rationale: דבר 基本义为“说”；不译成“应许”，以免与下文明确表示起誓的 נשבע 混同。
- source_word: וְכַאֲשֶׁר נִשְׁבַּע
  choice: 也正如他……所起的誓
  rationale: נשבע 明确表示起誓；此译法准确呈现誓言性质，并符合现代汉语表达。
- source_word: לַאֲבֹתֶיךָ
  choice: 向你的先祖
  rationale: 此处随即列出亚伯拉罕、以撒和雅各，所指是以色列的列祖；“先祖”在现代汉语中自然且准确。
- source_word: לְאַבְרָהָם לְיִצְחָק וּלְיַעֲקֹב
  choice: 就是亚伯拉罕、以撒和雅各
  rationale: 三个人名明确说明“先祖”的所指；用“就是”连接，避免中文中重复介词造成生硬。
theological_decisions:
- issue: 盟约公式的表达
  choice: 属他自己的子民……作你的上帝
  alternative: 作他的子民……成为你的上帝
  rationale: 所选译法保留双方盟约归属关系，也贴近 לוֹ לְעָם 与 לְךָ לֵאלֹהִים 的结构，不将其弱化为一般性的身份描述。
- issue: הָקִים 的盟约含义
  choice: 使你……成为
  alternative: 确立你作
  rationale: “确立你作”较形式对应，但现代汉语略显生硬；“使你成为”自然表达上帝在当日确立以色列盟约身份的意思，不额外界定其神学机制。
- issue: “先祖”的具体所指
  choice: 先祖，就是亚伯拉罕、以撒和雅各
  alternative: 列祖亚伯拉罕、以撒和雅各
  rationale: 既保留 אבות 的祖先含义，也明确文本自身指定的三位族长；不把它泛化为所有祖先。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。以单数“你”保留希伯来文对以色列整体的第二人称单数称呼；使用“上帝”和“子民”体现盟约语境。所有脚注标记均已置于正文。
