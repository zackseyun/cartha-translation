base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/011.yaml
  text: so that you may enter into the covenant of Yahweh your God[a], and into his oath[b], which Yahweh your God is making with you today.
translation:
  language: zh_hans
  text: 为要使你进入雅威你上帝的约，并接受他所起的誓[a]；这约和这誓，就是雅威你的上帝今天正与你所立、所起的[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “誓”也可理解为“带有咒诅的誓言”；原文这个词可指包含违约制裁或咒诅的宣誓。
    reason: lexical_alternative
  - marker: b
    text: 原文在“立约”处直译为“今天与你切约”；“切约”是希伯来语表示“立约”的惯用说法。
    reason: cultural_note
lexical_decisions:
- source_word: לְעָבְרְךָ
  choice: 为要使你进入
  rationale: לְ 加不定式在上下文中表示目的或结果；עבר 与“约”连用时指进入约的关系与义务，并非空间上的经过。
- source_word: בִּבְרִית
  choice: 进入……的约
  rationale: 介词 בְּ 在此随 עבר 表示进入约中；“约”是 בְּרִית 的标准、清楚译法。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常用音译呈现四字神名，保留原文使用的专名，而不以称号替代。
- source_word: אֱלֹהֶיךָ
  choice: 你的上帝
  rationale: 准确表达第二人称阳性单数所属后缀；“上帝”是自然、庄重的现代汉语表达。
- source_word: וּבְאָלָתוֹ
  choice: 也进入他的誓言
  rationale: אָלָה 可指带有制裁或咒诅的誓言。正文采用较宽泛的“誓言”，并以脚注保留其咒诅意味。
- source_word: כֹּרֵת עִמְּךָ
  choice: 与你所立的
  rationale: כרת ברית 字面为“切约”，实为立约惯用语；汉语用“立”自然传达其功能。
- source_word: הַיּוֹם
  choice: 今天
  rationale: 直接、自然地表达当下举行立约仪式的时间。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用以色列上帝的专名；音译“雅威”保留专名性质，不以“主”这一称号代替。
- issue: אָלָה 是否在正文中明确译为咒诅
  choice: 誓言，并用脚注说明其中可含咒诅或制裁
  alternative: 咒诅；带咒诅的誓言
  rationale: 该词兼具宣誓与违约制裁的语义。正文不把含义收窄为单纯“咒诅”，脚注则保存其严肃的 covenant sanction 意涵。
- issue: 关系从句所修饰的范围
  choice: 用“这是……所立的”承接前述“约”和“誓言”整体
  alternative: 明确限定为“这个约”或“这个誓言”
  rationale: 希伯来语关系词 אֲשֶׁר 本身不标明性数，句法上不宜武断地只限定其中一项；中文采用概括承接以保留一定歧义。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“进入……的约”略带正式色彩，用来保留原文的立约意象；分号帮助读者辨明目的语句与关系从句。
