  yaml_path: translation/ot/deuteronomy/029/002.yaml
  text: the great trials that your eyes saw[a], those great signs and wonders.
translation:
  language: zh_hans
  text: 就是你亲眼看见的那些大试验[a]，那些大能的神迹奇事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“那些大考验”。这里指试炼或考验，并非引诱人犯罪。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּסּוֹת הַגְּדֹלֹת
  choice: 那些大试验
  rationale: מַסּוֹת指使人受考验、得到验证的事件，而非引诱人犯罪；译作“大试验”既保留其基本意义，也与复数及形容词גְּדֹלֹת相符。
- source_word: אֲשֶׁר רָאוּ עֵינֶיךָ
  choice: 你亲眼看见的
  rationale: 希伯来文直译为“你的眼睛看见”，是强调直接目睹的惯用表达；现代汉语用“亲眼看见”自然地保留这种强调。
- source_word: הָאֹתֹת וְהַמֹּפְתִים
  choice: 神迹奇事
  rationale: אוֹת与מוֹפֵת在此组成固定搭配，指具有标志意义并令人惊异的非凡作为；“神迹奇事”是清楚、庄重且符合经文语境的汉语表达。
- source_word: הַגְּדֹלִים הָהֵם
  choice: 那些大能的
  rationale: הָהֵם具有回指和强调作用，译作“那些”；גְּדֹלִים在此强调神迹奇事的重大与威力，汉语用“大能的”比“大型的”自然，也保留其分量。
theological_decisions:
- issue: מַסּוֹת是否表示犯罪诱惑
  choice: 试验
  alternative: 诱惑
  rationale: 本节语境是以色列亲眼见证的重大事件和上帝的大能作为，词义重心在考验或验证，不在引诱犯罪；因此避免现代汉语中容易产生误解的“诱惑”。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“就是”承接本节在上下文中的列举语气；“亲眼看见”保存希伯来文的强调。“神迹奇事”沿用自然且广为理解的圣经汉语搭配。
