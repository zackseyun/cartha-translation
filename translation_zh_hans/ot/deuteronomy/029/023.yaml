base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/023.yaml
  text: And all the nations will say[a], ‘Why has Yahweh done thus to this land? Why this great burning anger?’
translation:
  language: zh_hans
  text: 列国都要说[a]：“雅威为什么这样对待这地？为什么有这样强烈的怒火？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“雅威为什么如此对待这地？这极大的烈怒是为什么？”
    reason: 提供较贴近希伯来语措辞和结构的替代译法，保留כָּכָה“如此”以及第二个מֶה所引出的问因表达。
lexical_decisions:
- source_word: וְאָמְרוּ
  choice: 都要说
  rationale: 连词连接上文；完成式在盟约警告的预告语境中表达将来的反应，因此译为“要说”。“都”同时自然承接后面的“列国”。
- source_word: כָּל הַגּוֹיִם
  choice: 列国
  rationale: גּוֹיִם在此指目睹这地遭灾的外邦各国；“列国”简洁、庄重，并保留集合性的范围。
- source_word: עַל מֶה
  choice: 为什么
  rationale: 该习语询问原因，现代汉语以“为什么”最为自然。
- source_word: עָשָׂה יְהוָה כָּכָה לָאָרֶץ הַזֹּאת
  choice: 雅威为什么这样对待这地
  rationale: כָּכָה保留为“这样”；לָאָרֶץ在汉语中随动词自然表达为“对待这地”，既传达施加于土地的行动，也避免生硬直译。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以“雅威”音译四字神名，保留经文中的专名性质，不以称号替代。
- source_word: מֶה חֳרִי הָאַף הַגָּדוֹל הַזֶּה
  choice: 这般如火燃烧的盛怒是为什么
  rationale: “是为什么”保留第二个מֶה的原因问句；“如火燃烧”保存חֳרִי的热与燃烧意象，“盛怒”自然表达אַף与גָּדוֹל的强烈程度。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。译作“雅威”可保留其作为以色列之神盟约名字的性质，而不以“主”这一称号替换。
- issue: חֳרִי הָאַף的怒气意象
  choice: 如火燃烧的盛怒
  alternative: 猛烈的怒气；烈怒
  rationale: 选择保留希伯来语中怒气如热火燃烧的具体隐喻，同时不额外解释这怒气的神学性质。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“列国”保持申命记盟约语境的经文语体；第二问刻意保留怒气燃烧的形象，避免仅用抽象的“愤怒”。脚注标记[a]已在正文中出现。
