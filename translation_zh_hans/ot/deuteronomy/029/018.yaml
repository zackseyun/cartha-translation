  text: וְ/הָיָ֡ה בְּ/שָׁמְע/וֹ֩ אֶת דִּבְרֵ֨י הָֽ/אָלָ֜ה הַ/זֹּ֗את וְ/הִתְבָּרֵ֨ךְ בִּ/לְבָב֤/וֹ לֵ/אמֹר֙ שָׁל֣וֹם יִֽהְיֶה לִּ֔/י כִּ֛י בִּ/שְׁרִר֥וּת לִבִּ֖/י אֵלֵ֑ךְ לְמַ֛עַן סְפ֥וֹת הָ/רָוָ֖ה אֶת הַ/צְּמֵאָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/018.yaml
  text: and when he hears the words of this oath[a], he blesses himself in his heart, saying, ‘I will have peace[b], though I walk in the stubbornness of my heart’—so as to sweep away the well-watered with the thirsty.
translation:
  language: zh_hans
  text: 当他听见这誓言[a]的话时，便在心里自我祝福，说：‘我必平安，虽然我照着自己顽梗的心行事。’为要把滋润的与干渴的一并扫除。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“这咒诅的话”。希伯来语这个词可指带有咒诅的誓言。
    reason: alternative_reading
  - marker: b
    text: 末句也可理解为“把滋润之地和干旱之地一并扫除”。这可能指不加区别地毁灭一切；原文的比喻所指并不确定。
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאָלָה
  choice: 誓言
  rationale: אָלָה可指带有咒诅制裁的誓言；正文译作“誓言”贴近“这誓言的话”，脚注保留“咒诅”的可能。
- source_word: וְהִתְבָּרֵךְ בִּלְבָבוֹ
  choice: 心里却自我祝福
  rationale: 保留ברך反身式的含义和此处反讽性的自我保证；“却”自然呈现听见盟誓后仍如此反应的逆转。
- source_word: שָׁלוֹם יִהְיֶה לִּי
  choice: 我必平安
  rationale: שָׁלוֹם涵盖平安、安好与安全；“我必平安”简洁自然，也保留说话者自以为不会遭祸的口吻。
- source_word: שְׁרִרוּת לִבִּי
  choice: 自己顽梗的心
  rationale: שְׁרִרוּת表示固执、刚硬的意志；“顽梗的心”符合现代中文圣经语域，又不把它弱化为单纯的想法或欲望。
- source_word: לְמַעַן
  choice: 这样
  rationale: 此处可表达目的或结果；中文用“这样”保持与后句的联系而不过度限定逻辑关系。
- source_word: סְפוֹת
  choice: 扫除
  rationale: 在盟约审判语境中，ספה较自然地表示扫除或毁灭；“扫除”保留其形象性。
- source_word: הָרָוָה אֶת־הַצְּמֵאָה
  choice: 连饱受滋润的和干渴的都……一并
  rationale: 两个形容词在希伯来文中作名词使用，具体所指并不明确；译文保留“滋润／干渴”的对照，并以脚注说明土地化的理解。
theological_decisions:
- issue: הָאָלָה的盟约制裁含义
  choice: 正文译作“誓言”
  alternative: 咒诅
  rationale: 该词既可指誓言，也常包含随誓言而来的咒诅。正文保留盟誓表达，脚注交代制裁含义，避免只突出其中一面。
- issue: הָרָוָה אֶת־הַצְּמֵאָה这一困难惯用语
  choice: 保留“饱受滋润的和干渴的”这一对比意象
  alternative: 滋润之地和干旱之地；把一切一同毁灭
  rationale: 原文所指可能是土地，也可能是概括性的两类对象；正文不把歧义直接消解，脚注提供较明确的土地解释。
- issue: לְמַעַן所表达的逻辑关系
  choice: 译作较开放的“这样”
  alternative: 为要；结果就
  rationale: לְמַעַן通常表目的，也可能在此体现结果。采用较开放的连接语，避免武断决定究竟是此人的意图还是其行为导致的后果。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“自我祝福”有意保留原文反身表达及其反讽意味；末句保持希伯来语的对比意象，并借“一并”使中文通顺。
