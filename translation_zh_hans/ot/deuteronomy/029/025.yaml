base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/025.yaml
  text: and they went and served other gods and bowed down to them[a], gods whom they had not known and whom he had not allotted to them.
translation:
  language: zh_hans
  text: 他们去侍奉别的神，向它们下拜；这些神是他们所不认识的，也是上帝没有分派给他们的。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这些神也不是分派给他们的。”希伯来原文的动词是单数，主语没有明说，很可能指上帝。
    reason: 保留希伯来原文隐含主语所产生的句法歧义。
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: 他们去
  rationale: 保留הלך“去、行走”的基本意义和希伯来文连续叙事的表达，不把它直接解释为“离弃”或“跟随”。
- source_word: וַיַּעַבְדוּ
  choice: 侍奉
  rationale: עבד的常用义是“服侍、侍奉”；下一动词已明确描写下拜，因此这里不笼统译作“敬拜”。
- source_word: אֱלֹהִים אֲחֵרִים
  choice: 别的神
  rationale: 直译אֲחֵרִים“别的、其他的”，符合申命记的常见措辞；“外邦神”会额外加入原文没有明说的地域含义。
- source_word: וַיִּשְׁתַּחֲווּ לָהֶם
  choice: 向它们下拜
  rationale: שׁחה描写俯伏、下拜，保留具体动作意象，并与前面的“侍奉”有所区别。
- source_word: אֱלֹהִים אֲשֶׁר לֹא יְדָעוּם
  choice: 这些神是他们从未认识的
  rationale: ידע可包含亲身认识或关系层面的意味；“从未认识”保持这种宽度，不缩减为仅仅“没听说过”。
- source_word: וְלֹא חָלַק לָהֶם
  choice: 也是上帝没有分派给他们的
  rationale: חלק意为“分配、分派”。原文动词为第三人称阳性单数而主语省略，语境中最自然的隐含主语是上帝；正文明确主语以使现代汉语清楚，同时用脚注保留原文句法上的含蓄。
theological_decisions:
- issue: חָלַק的隐含单数主语
  choice: 正文将隐含主语译为“上帝”
  alternative: “也不是分派给他们的”，不明说分派者
  rationale: 希伯来文没有写出主语，但动词是第三人称阳性单数；结合申命记中上帝分派万物的语境，指上帝最为自然。不过这仍属根据上下文补出的主语，因此以脚注说明并保留不明说主语的译法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“侍奉”与“下拜”分别对应两个不同动词；以分号理清同位说明关系。代指假神时使用“它们”，避免赋予尊称。
