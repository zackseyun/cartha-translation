  text: וְ/אָ֣מְר֔וּ עַ֚ל אֲשֶׁ֣ר עָֽזְב֔וּ אֶת בְּרִ֥ית יְהוָ֖ה אֱלֹהֵ֣י אֲבֹתָ֑/ם אֲשֶׁר֙ כָּרַ֣ת עִמָּ֔/ם בְּ/הוֹצִיא֥/וֹ אֹתָ֖/ם מֵ/אֶ֥רֶץ מִצְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/024.yaml
  text: Then they will say[a], ‘Because they forsook the covenant of Yahweh, the God of their fathers, which he made with them when he brought them out of the land of Egypt.’
translation:
  language: zh_hans
  text: 他们就会说：“因为他们离弃了雅威——他们列祖的上帝——在他领他们出埃及地时同他们所立的约。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאָמְרוּ
  choice: 他们就会说
  rationale: 承接上文各国之人的询问及随后作出的回答；“就”自然表达话语推进，“会说”保留语境中的将来指向。
- source_word: עַל אֲשֶׁר
  choice: 因为
  rationale: 该结构在此引出土地遭灾的原因，译作“因为”简明自然。
- source_word: עָזְבוּ
  choice: 离弃
  rationale: 此动词指背弃盟约关系，不只是一般意义上的离开；“离弃”既庄重又能表达有意的不忠。
- source_word: בְּרִית
  choice: 约
  rationale: “约”是现代中文圣经语境中对盟约关系的简洁、通行表达，保留其约束性与神学分量。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文直接音译四字神名，保留其作为以色列之上帝专名的性质，而不以称号代替。
- source_word: אֱלֹהֵי אֲבֹתָם
  choice: 他们列祖的上帝
  rationale: 保留希伯来文阳性复数“父辈、先祖”的祖传谱系意味；“列祖”在现代中文中庄重且易懂。
- source_word: אֲשֶׁר כָּרַת עִמָּם
  choice: 与他们所立的约
  rationale: 希伯来语直译为“切约”，中文惯用“立约”；关系从句修饰前面的“约”。
- source_word: בְּהוֹצִיאוֹ אֹתָם
  choice: 在领他们……时
  rationale: 介词加不定词在此表示时间背景；“在……时”准确表达立约与出埃及事件的时间关联。
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: 出埃及地
  rationale: 保留“埃及地”的完整表达及其出埃及传统的回响。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华／主
  rationale: 原文使用上帝的专名；音译“雅威”比用称号“主”更直接地保存这一点，也不采用后起的混合读音。
- issue: אֱלֹהֵי אֲבֹתָם 中祖辈称谓的处理
  choice: 他们列祖的上帝
  alternative: 他们祖先的上帝
  rationale: 原文采用阳性复数“父辈、先祖”；正文用“列祖”保留这一形式及族长传统的色彩，同时脚注列出自然的现代说法。
- issue: 出埃及与立约的关系
  choice: 在领他们出埃及地时与他们所立的约
  alternative: 他领他们出埃及地以后与他们所立的约
  rationale: 希伯来文仅以时间结构把两件事联系起来，没有明确表达严格的先后次序，因此译文不增添“以后”。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“离弃”“立约”“列祖”保留经文的盟约语域；破折号清楚标示“他们列祖的上帝”是对“雅威”的同位说明。
