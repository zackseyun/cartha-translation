  yaml_path: translation/ot/deuteronomy/029/026.yaml
  text: So the anger of Yahweh burned against that land, to bring upon it every curse written in this book.
translation:
  language: zh_hans
  text: 于是，雅威向那地燃起怒火，把这书上所写的一切咒诅都降在那地上。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: 怒火……燃烧
  rationale: 保留希伯来语“怒气燃烧”的鲜明意象，同时符合现代汉语表达；比单译“发怒”更充分传达强烈程度。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来语四字神名音译为“雅威”，保留经文中的专名，而不以称号替代。
- source_word: בָּאָרֶץ הַהִוא
  choice: 向那地
  rationale: 介词ב在此随“怒火燃烧”表示怒气所针对的对象；“向那地”既自然，也明确审判的指向。
- source_word: לְהָבִיא עָלֶיהָ
  choice: 把……降在那地上
  rationale: 不定式可表达目的或结果。“降在……上”是汉语中描述咒诅临到某地的自然庄重说法。
- source_word: כָּל הַקְּלָלָה
  choice: 一切咒诅
  rationale: 希伯来语以单数表达整体；“一切咒诅”在汉语中自然地传达其涵盖全部的集合意义。
- source_word: הַכְּתוּבָה
  choice: 所写的
  rationale: 准确反映被动分词“写下、记载”的含义，并与汉语定语结构自然衔接。
- source_word: בַּסֵּפֶר הַזֶּה
  choice: 这书上
  rationale: סֵפֶר可指书卷、文书或书；“这书”在盟约语境中通俗而庄重，也不对具体书写载体作不必要限定。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。采用“雅威”音译，保留以色列之神的盟约专名，不将其改为称号。
- issue: לְהָבִיא所表达的目的或结果关系
  choice: 以连续动作“把……降在”呈现，不强行限定
  alternative: 为要把……降在；以致把……降在
  rationale: 希伯来语不定式在此可兼有目的与结果色彩；汉语连续结构保留这种张力，避免过度解释神怒与咒诅临到之间的逻辑关系。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“怒火……燃烧”保留原文意象；重复“那地”而不只用代词，使指代清楚，并维持审判宣告的力度。
