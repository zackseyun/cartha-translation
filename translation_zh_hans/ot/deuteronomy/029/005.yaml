id: DEU.29.5
reference: Deuteronomy 29:5
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: לֶ֚חֶם לֹ֣א אֲכַלְתֶּ֔ם וְ/יַ֥יִן וְ/שֵׁכָ֖ר לֹ֣א שְׁתִיתֶ֑ם לְמַ֨עַן֙ תֵּֽדְע֔וּ כִּ֛י אֲנִ֥י יְהוָ֖ה אֱלֹהֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/005.yaml
  text: You did not eat bread[a], and you did not drink wine or strong drink, so that you might know that I am Yahweh your God.
translation:
  language: zh_hans
  text: 你们没有吃饼，也没有喝葡萄酒和烈酒[a]，为要使你们知道，我是雅威你们的上帝。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “烈酒”指能使人醉的发酵饮料，并不一定指某一种特定饮品，也不是专指现代的蒸馏酒。
    reason: 说明 שֵׁכָר 的广义，并避免现代汉语“烈酒”可能造成的时代错置。
lexical_decisions:
- source_word: לֶחֶם
  choice: 饼
  rationale: 基本义为“饼、面包”；此处保留具体食物名称，不扩大译作泛指的“食物”。
- source_word: אֲכַלְתֶּם
  choice: 你们没有吃
  rationale: 希伯来语完成式在此回顾旷野时期的经历，现代汉语用“没有吃”自然表达。
- source_word: יַיִן
  choice: 葡萄酒
  rationale: 采用该词通常且明确的词义。
- source_word: שֵׁכָר
  choice: 烈酒
  rationale: 指葡萄酒以外能使人醉的发酵饮料；“烈酒”简洁自然，但现代汉语有时会让人联想到蒸馏酒，因此附注说明其古代语境中的广义。
- source_word: שְׁתִיתֶם
  choice: 没有喝
  rationale: 与前句并列，简明回顾以色列人的经历。
- source_word: לְמַעַן
  choice: 为要使
  rationale: 保留目的或预期结果的语气，不把两者之间的张力过度限定。
- source_word: תֵּדְעוּ
  choice: 你们知道
  rationale: 置于“为要使”之后，自然表达目的从句，也保留“认识、确知”的基本含义。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以通行的现代汉语音译呈现四字神名，不用称号替代专名。
- source_word: אֱלֹהֵיכֶם
  choice: 你们的上帝
  rationale: 直接表达第二人称复数所属关系及圣约关系。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较接近学界通常重构的读音，同时保留其作为专名的性质。
- issue: לְמַעַן 所表达的逻辑关系
  choice: 为要使
  alternative: 以致
  rationale: 该词可涉及目的及结果；此处采用能保留目的取向、又不额外解释神学机制的表达。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“葡萄酒和烈酒”依照原文并列，不改成选择关系；脚注标记置于实际需要词义说明的“烈酒”之后。
