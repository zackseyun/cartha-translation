revisions:
- from: 后来的一代，就是你们之后兴起的子孙，以及从远方之地来的外族人，看见那地所受的灾祸，以及雅威使它患上的种种疾病，就会说：[a][b][c]
  to: 后来的那一代——你们之后兴起的子孙——和从远方之地来的外族人，看见那地所遭受的灾祸和雅威使那地患上的种种疾病[b][c]，就会说：[a]
  rationale: 修订以破折号明确“你们之后兴起的子孙”是“后来的那一代”的说明，而“从远方之地来的外族人”是另一并列主语；同时将脚注c改为准确反映原文使役动词及其与“那地”的关系。脚注标记也移至相应词语或短语之后。
