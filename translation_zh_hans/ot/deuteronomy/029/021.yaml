  text: וְ/אָמַ֞ר הַ/דּ֣וֹר הָֽ/אַחֲר֗וֹן בְּנֵי/כֶם֙ אֲשֶׁ֤ר יָק֨וּמוּ֙ מֵ/אַ֣חֲרֵי/כֶ֔ם וְ/הַ֨/נָּכְרִ֔י אֲשֶׁ֥ר יָבֹ֖א מֵ/אֶ֣רֶץ רְחוֹקָ֑ה וְ֠/רָאוּ אֶת מַכּ֞וֹת הָ/אָ֤רֶץ הַ/הִוא֙ וְ/אֶת תַּ֣חֲלֻאֶ֔י/הָ אֲשֶׁר חִלָּ֥ה יְהוָ֖ה בָּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/021.yaml
  text: 'And the generation to come—your children who rise up after you—and the foreigner who comes from a distant land will say[c][b][a], when they see the plagues of that land and its sicknesses with which Yahweh has afflicted it:'
translation:
  language: zh_hans
  text: 后来的那一代——你们之后兴起的子孙——和从远方之地来的外族人，看见那地所遭受的灾祸和雅威使那地患上的种种疾病[b][c]，就会说：[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “后来的那一代”也可译作“后来的世代”；这里不一定是指历史上的最后一代。
    reason: lexical_alternative
  - marker: b
    text: “疾病”也可译作“病症”。原文把土地描写成患病。
    reason: lexical_alternative
  - marker: c
    text: “雅威使那地患上的”较直译为“雅威使那地患病”或“雅威在那地施行使其患病的灾害”；原文的介词表达可直译为“在其中”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַר
  choice: 就会说
  rationale: 虽为形态上的单数，后接“后来的一代”和“外族人”这一复合主语；汉语用“就会说”自然承接“看见”所表达的未来情境。
- source_word: הַדּוֹר הָאַחֲרוֹן
  choice: 后来的一代
  rationale: אַחֲרוֹן在此指当前听众之后的一代，并不必然指历史上的最后一代；“后来的一代”保留这一范围。
- source_word: בְּנֵיכֶם אֲשֶׁר יָקֻמוּ מֵאַחֲרֵיכֶם
  choice: 你们之后兴起的子孙
  rationale: בנים在此可指后代；“子孙”比仅指男性的“儿子”更贴合群体后裔之意，“兴起”保留קום的表达。
- source_word: וְהַנָּכְרִי
  choice: 以及……外族人
  rationale: נָכְרִי指以色列群体之外、来自异国的人；“外族人”在现代汉语中清楚而不含仅仅陌生之意。
- source_word: מֵאֶרֶץ רְחוֹקָה
  choice: 从远方之地来的
  rationale: 保留来源和地理遥远的含义，同时符合庄重、自然的现代汉语。
- source_word: וְרָאוּ
  choice: 看见
  rationale: 置于“就会说”之前形成时间条件关系，清楚表达他们看见灾情后发言的顺序，而不额外强化为“等到”或“之后”。
- source_word: מַכּוֹת
  choice: 灾祸
  rationale: מַכּוֹת字面可指击打、打击，语境中是临到土地的惩罚性灾难；“灾祸”既自然又保留广义，避免将其限缩为传染性“瘟疫”。
- source_word: תַּחֲלֻאֶיהָ
  choice: 它……种种疾病
  rationale: 该复数名词指疾病；土地被拟人化为患病，“种种疾病”保留复数和这一意象。
- source_word: חִלָּה
  choice: 使它患上
  rationale: חלה的Piel形式具有使患病、使受苦之意；“使它患上”直接保留使役意义，并与土地的“疾病”意象相连。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以“雅威”音译四字神名，保留其作为以色列之神专名的性质，而不以称号替代。
- source_word: בָּהּ
  choice: 它
  rationale: 代词回指“那地”；配合“使……患上”使用直接宾语，是自然汉语，同时脚注说明希伯来文较直译的介词结构。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较贴近通行的学术重构读音，也明确保留专名，不以“主”等称号替换。
- issue: בְּנֵיכֶם的所指范围
  choice: 子孙
  alternative: 儿子们
  rationale: 此处着眼于后来世代的后裔群体；“子孙”保留家族延续的意义，不把所指无根据地限定为男性。
- issue: 土地患病意象的处理
  choice: 保留“使它患上种种疾病”
  alternative: 使它遭受种种苦难
  rationale: 原文以חלה及תַּחֲלֻאֶיהָ构成鲜明的患病意象；保留这一张力，不将其抽象化为一般苦难。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“后来的一代”避免末世论式的过度确定；“灾祸”涵盖惩罚性的打击；“使它患上种种疾病”保留原文将土地拟人化的意象。冒号承接下一节将出现的话语内容。
