    issue: 主语的同位与并列关系不够清楚
    rationale: 原文的结构是“后来的那一代——你们之后兴起的子孙——和从远方之地来的外族人”。草稿用“就是……子孙，以及……外族人”连接，容易使读者把外族人也理解为该世代的同位成分。
  - severity: medium
