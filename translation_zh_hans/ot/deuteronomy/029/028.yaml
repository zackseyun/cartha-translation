base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/028.yaml
  text: The hidden things belong to Yahweh our God[a], but the revealed things belong to us and to our children forever[b], so that we may do all the words of this law.
translation:
  language: zh_hans
  text: 隐秘的事[a]属于耶和华我们的神；显明的事却属于我们和我们的儿女[b]，直到永远，好叫我们遵行这律法[c]的一切话语。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “隐秘的事”也可译作“隐藏的事”。
    reason: lexical_alternative
  - marker: b
    text: 马所拉文本在“我们和我们的儿女”这几个词的字母上方标有特殊点号；这些古代抄写标记的确切用意不能确定。
    reason: textual_note
  - marker: c
    text: “律法”也可译作“训诲”或“教导”；在《申命记》中，这个词指摩西摆在以色列人面前的立约教导。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנִּסְתָּרֹת
  choice: 隐秘的事
  rationale: 这是动词 סתר 的阴性复数被动分词作名词使用，指向人隐藏、未向人显明的事。“隐秘的事”既保留与“显明的事”的对照，也不暗示某种秘传知识。
- source_word: לַיהוָה אֱלֹהֵינוּ
  choice: 属于耶和华我们的神
  rationale: 介词 לְ 在这里表达归属；“耶和华我们的神”保留立约语境中的神圣称谓。
- source_word: וְהַנִּגְלֹת
  choice: 显明的事却
  rationale: גלה 的被动分词与“隐秘的事”平行；连接词 וְ 按上下文的鲜明对比译为“却”。
- source_word: לָנוּ וּלְבָנֵינוּ
  choice: 属于我们和我们的儿女
  rationale: 希伯来文省略了前句已经表达的归属关系，中文补出“属于”以使平行结构清楚。בנים 在这里泛指后代，译作“儿女”比限定男性的“儿子”更合适。
- source_word: עַד עוֹלָם
  choice: 永远
  rationale: 这是表示持续长久、永恒有效的惯用语；放在“属于我们和我们的儿女”之前，保留它修饰归属关系的自然理解。
- source_word: לַעֲשׂוֹת
  choice: 为要使我们遵行
  rationale: 带 לְ 的不定式在此表达目的，即所显明之事赐下是为了使以色列人付诸顺服。“遵行”比单说“做”更符合诫命语境。
- source_word: אֵת כָּל דִּבְרֵי
  choice: 一切话
  rationale: 保留 דְּבָרִים 的“话”这一文本性表达，指这律法中所宣告的全部规定，而不宽泛改写为“所有事情”。
- source_word: הַתּוֹרָה הַזֹּאת
  choice: 这律法
  rationale: תורה 可泛指教导或训诲，但在《申命记》的立约语境中，“律法”准确而且为现代读者熟悉。
theological_decisions:
- issue: “隐秘的事”与“显明的事”的范围
  choice: 保留经文本身的一般性对照：有些事归于神，已经显明的事则交给以色列及其后代去遵行。
  alternative: 将本节限定为只谈上下文中的约之祝福与咒诅，或扩展为关于一切神圣奥秘的完整认识论命题。
  rationale: 希伯来文没有明确列出两类事的范围；译文不替经文作过度限定，也不把它扩展成比上下文更系统化的教义陈述。
- issue: 显明之事与顺服之间的关系
  choice: 将 לַעֲשׂוֹת 译成目的表达“为要使我们遵行”。
  alternative: 仅译作较中性的“去行”，不明确其与前句的目的关系。
  rationale: 带 לְ 的不定式自然表达目的或结果；译文呈现启示面向立约顺服的功能，但不进一步断定顺服的方式或功效。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“隐秘—显明”形成清楚对举；分号保留希伯来文两大分句的结构。“为要使我们遵行”使目的关系明晰，同时避免生硬直译。
