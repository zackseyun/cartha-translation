  text: גָּפְרִ֣ית וָ/מֶלַח֮ שְׂרֵפָ֣ה כָל אַרְצָ/הּ֒ לֹ֤א תִזָּרַע֙ וְ/לֹ֣א תַצְמִ֔חַ וְ/לֹֽא יַעֲלֶ֥ה בָ֖/הּ כָּל עֵ֑שֶׂב כְּֽ/מַהְפֵּכַ֞ת סְדֹ֤ם וַ/עֲמֹרָה֙ אַדְמָ֣ה ו/צביים אֲשֶׁר֙ הָפַ֣ךְ יְהוָ֔ה בְּ/אַפּ֖/וֹ וּ/בַ/חֲמָתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/022.yaml
  text: Sulfur and salt[a], a burning waste, are all its land; it is not sown, and it does not sprout, and no grass grows in it, like the overthrow of Sodom and Gomorrah, Admah and Zeboiim, which Yahweh overthrew in his anger and in his wrath.
translation:
  language: zh_hans
  text: 全地都是硫磺和盐，成了一片烧焦的荒地；无人播种，也不出产，任何草木都不从其中长出来；这如同雅威在怒气和烈怒中所倾覆的所多玛、蛾摩拉、押玛和洗扁的倾覆。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גָּפְרִית וָמֶלַח
  choice: 硫磺和盐
  rationale: 直译两种物质，保留土地遭审判后荒芜、不育的具体意象；“硫磺”在现代汉语中清楚自然。
- source_word: שְׂרֵפָה כָל אַרְצָהּ
  choice: 遍地……烧焦一片
  rationale: שְׂרֵפָה可指焚烧或烧毁的状态；此译兼顾火烧意象与全地焦毁的结果，也使希伯来语无动词句在汉语中自然通顺。
- source_word: לֹא תִזָּרַע
  choice: 那里无人播种
  rationale: 原文为被动形式，描述土地未被播种的状态；汉语用无定施事“无人播种”自然表达，不擅自加强为绝对能力上的“不能”。
- source_word: וְלֹא תַצְמִחַ
  choice: 也不萌发
  rationale: 保留土地不产生新生长的连续描述，并避免加入原文没有明确指出的作物宾语。
- source_word: וְלֹא יַעֲלֶה בָהּ כָּל עֵשֶׂב
  choice: 任何草木都不从其中长出来
  rationale: עֵשֶׂב在此泛指地上植物；“草木”比单指草坪式的“草”更符合荒地不生植被的语境，“长出来”对应“上来、长起”。
- source_word: כְּמַהְפֵּכַת / הָפַךְ
  choice: 倾覆……倾覆
  rationale: 用同一词根对应的汉语重复，保留名词与后续动词之间的词汇呼应，并传达灾难性的毁灭。
- source_word: סְדֹם וַעֲמֹרָה אַדְמָה וּצְבֹיִים
  choice: 所多玛、蛾摩拉、押玛和洗扁
  rationale: 采用现代中文圣经读者熟悉的传统地名音译。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语中通行且接近学界重构读音的形式音译四字神名，保留其专名性质，不用称号代替。
- source_word: בְּאַפּוֹ וּבַחֲמָתוֹ
  choice: 在怒气和烈怒中
  rationale: 保留两个并列的忿怒用语及其加强效果；“烈怒”体现חֵמָה的强烈程度，而不把两词合并。
theological_decisions:
- issue: 如何翻译神名יהוה
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用以色列之神的专名；音译为“雅威”保留专名，避免以称号替换，也不依赖较晚形成的混合读音。
- issue: 土地未被播种的陈述是否表示能力不可能
  choice: 无人播种
  alternative: 不能播种
  rationale: 希伯来语被动未完成式可描述土地不被播种的状态；原文未明确使用表示能力的情态形式，因此不把它限定为“不能”。
translation_notes:
  register: 采用庄重而易懂的现代标准普通话。保留原文层层推进的荒芜图景和“倾覆”的词汇呼应；分号划分土地状态、历史类比与雅威施行审判三个层次。
