revisions:
- from: 遍地尽是硫磺和盐，烧焦一片；那里无人播种，也不萌发，任何草木都不从其中长出来，就像所多玛、蛾摩拉、押玛和洗扁倾覆时一样；雅威在怒气和烈怒中倾覆了这些城。
  to: 全地都是硫磺和盐，成了一片烧焦的荒地；无人播种，也不出产，任何草木都不从其中长出来；这如同雅威在怒气和烈怒中所倾覆的所多玛、蛾摩拉、押玛和洗扁的倾覆。
  rationale: 修订将“雅威在怒气和烈怒中所倾覆的”作为限定“倾覆”的关系性成分，恢复原文比较结构及名词“倾覆”与动词“倾覆”的呼应。前半句改为更自然、主语清楚的现代汉语，同时未把“未被播种”擅自强化为绝对的能力不可能。
