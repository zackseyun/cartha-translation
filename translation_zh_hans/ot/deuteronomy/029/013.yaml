  yaml_path: translation/ot/deuteronomy/029/013.yaml
  text: And it is not with you alone that I am making this covenant and this oath[b][a],
translation:
  language: zh_hans
  text: 我立这约、起这誓，并不是只同你们立的，[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“切这约”；“立这约”是这一希伯来语立约习语的自然汉语表达。
    reason: lexical_alternative
  - marker: b
    text: 或译：“起这咒诅。”这个希伯来词既可指誓言本身，也可指与誓言相连的咒诅性制裁。
    reason: alternative_reading
lexical_decisions:
- source_word: וְלֹא אִתְּכֶם לְבַדְּכֶם
  choice: 我不只是与你们
  rationale: 保留原文“不是只与你们”的排他性对比，同时按现代汉语语序自然表达；“你们”也保留第二人称阳性复数所指的集体听众。
- source_word: אָנֹכִי
  choice: 我
  rationale: 独立人称代词带有一定强调；汉语用明确的主语“我”即可清楚表达，不另加可能过度强化的“我亲自”。
- source_word: כֹּרֵת
  choice: 立
  rationale: “切约”是希伯来语习语，现代汉语以“立约”表达最自然，也保留其正式、庄重的盟约含义。
- source_word: הַבְּרִית הַזֹּאת
  choice: 这约
  rationale: “约”在申命记语境中能承载法律性和神学性的盟约含义；与动词“立”组合为自然的“立这约”。
- source_word: וְאֶת הָאָלָה הַזֹּאת
  choice: 和这誓
  rationale: אָלָה可指带有咒诅制裁的誓言；正文用“誓”突出盟约确认的宣誓行为，同时以脚注保留“咒诅”这一真实语义可能。
theological_decisions:
- issue: 盟约语境中אָלָה的译法
  choice: 誓
  alternative: 咒诅
  rationale: 该词在这里与“约”并列，既可着重指确认盟约的誓言，也可着重指誓言所包含的自我咒诅或违约制裁。正文采用“誓”，脚注保留“咒诅”，不消除原文的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“不只是与你们”保留本节与下文的对比关系；句末用逗号，反映原句在语义和句法上继续到下一节。
