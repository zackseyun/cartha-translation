  text: וְ/הִבְדִּיל֤/וֹ יְהוָה֙ לְ/רָעָ֔ה מִ/כֹּ֖ל שִׁבְטֵ֣י יִשְׂרָאֵ֑ל כְּ/כֹל֙ אָל֣וֹת הַ/בְּרִ֔ית הַ/כְּתוּבָ֕ה בְּ/סֵ֥פֶר הַ/תּוֹרָ֖ה הַ/זֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/020.yaml
  text: And Yahweh will single him out from all the tribes of Israel for disaster[a], according to all the curses of the covenant written in this book of the law.
translation:
  language: zh_hans
  text: 耶和华要从以色列各支派中把他分别出来，使他遭受灾祸，照着这律法书上所写的盟约一切咒诅[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“盟约的一切誓言咒诅”。这里的希伯来词可特指与誓言相关的盟约咒诅。
    reason: 保留 אָלָה 在盟约语境中可能具有的誓言关联含义。
lexical_decisions:
- source_word: וְהִבְדִּילוֹ
  choice: 要把他……分别出来
  rationale: בדל 的使役式表达使某人与群体分开；结合审判语境，“把他……分别出来”既保留动词核心意义，也显出他被特别挑出受罚。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名形式呈现四字神名 יהוה，而不以称号替代。
- source_word: לְרָעָה
  choice: 使他遭受灾祸
  rationale: רָעָה 在此指盟约审判带来的祸患，而非道德上的邪恶；此译法自然表达其不利、惩罚性的结果。
- source_word: מִכֹּל שִׁבְטֵי יִשְׂרָאֵל
  choice: 从以色列各支派中
  rationale: מִן 表明此人从整个以色列支派群体中被分离出来；“从……中”符合现代汉语表达。
- source_word: כְּכֹל
  choice: 照着……一切
  rationale: כְּ 表示惩罚与所写盟约咒诅相符合；“照着”保留这种对应关系。
- source_word: אָלֹות
  choice: 盟约咒诅
  rationale: אָלָה 可指由誓言所确认或启动的咒诅性制裁；正文采用清楚的“咒诅”，并在脚注保留誓约含义。
- source_word: הַבְּרִית
  choice: 盟约
  rationale: בְּרִית 在此是以色列与耶和华之间具有约束力的约，译作“盟约”清楚且具有尊严。
- source_word: הַכְּתוּבָה
  choice: 所写的
  rationale: 阴性被动分词在句中修饰盟约的“咒诅”；中文自然地处理为“律法书上所写的……咒诅”。
- source_word: בְּסֵפֶר הַתּוֹרָה הַזֶּה
  choice: 这律法书上
  rationale: סֵפֶר 可指书卷，תּוֹרָה 在此指成文的律法；“这律法书上”简明自然，也保留指示词“这”。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。中文正文采用广为人知的专名“耶和华”，不以“主”等称号取代，也不借此加入额外神学解释。
- issue: לְרָעָה 所指审判的性质
  choice: 使他遭受灾祸
  alternative: 使他遭祸／使他受害
  rationale: 这里描述盟约违背者所遭受的惩罚性祸患，不是说神把他分别出来行道德上的恶；译文只表达原文的灾祸与审判含义。
- issue: אָלֹות 的盟约与誓言色彩
  choice: 正文译“盟约咒诅”，脚注注明“誓约咒诅”
  alternative: 正文直译“盟约的誓约咒诅”
  rationale: “咒诅”最适合普通读者，而该词在盟约语境中又可能特别指以誓言确立的咒诅性制裁；脚注保留这一语义张力而不使正文生硬。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“分别出来”贴近原文意象；补出“惩罚他”使“照着……”在汉语中有明确着落，这是由上下文蕴含的句法补足，并未添加新的惩罚内容。脚注标记已在正文以 [a] 出现。
