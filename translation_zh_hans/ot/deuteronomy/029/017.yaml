source:
  edition: WLC
  text: פֶּן יֵ֣שׁ בָּ֠/כֶם אִ֣ישׁ אוֹ אִשָּׁ֞ה א֧וֹ מִשְׁפָּחָ֣ה אוֹ שֵׁ֗בֶט אֲשֶׁר֩ לְבָב֨/וֹ פֹנֶ֤ה הַ/יּוֹם֙ מֵ/עִם֙ יְהוָ֣ה אֱלֹהֵ֔י/נוּ לָ/לֶ֣כֶת לַ/עֲבֹ֔ד אֶת אֱלֹהֵ֖י הַ/גּוֹיִ֣ם הָ/הֵ֑ם פֶּן יֵ֣שׁ בָּ/כֶ֗ם שֹׁ֛רֶשׁ פֹּרֶ֥ה רֹ֖אשׁ וְ/לַעֲנָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/017.yaml
  text: lest there be among you a man or a woman[a], or a clan or a tribe, whose heart is turning away today from Yahweh our God to go and serve the gods of those nations; lest there be among you a root bearing poisonous fruit and wormwood.
translation:
  language: zh_hans
  text: 免得你们中间有男人或女人、宗族或支派，今天心里转离耶和华我们的上帝，去事奉那些国家的神；也免得你们中间有一条根结出毒物和苦艾。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “毒物”也可译作“毒草”。希伯来语 רֹאשׁ 可指有毒或苦涩的植物或产物，具体所指并不确定。
    reason: 保留 רֹאשׁ 的词义不确定性，并说明其可能指植物的译法。
lexical_decisions:
- source_word: פֶּן
  choice: 免得
  rationale: 两次出现均引出需要警惕的潜在危险；“免得”自然保留希伯来语的警戒语气。
- source_word: אִישׁ אוֹ אִשָּׁה
  choice: 男人或女人
  rationale: 保留原文明确并列的男女两类，不概括为泛称。
- source_word: מִשְׁפָּחָה
  choice: 宗族
  rationale: 此处指以亲缘关系构成、通常大于单个家庭的群体；“宗族”较“家庭”更符合以色列的社会结构。
- source_word: שֵׁבֶט
  choice: 支派
  rationale: 在以色列盟约群体的语境中指部族单位；现代中文圣经语域通常称“支派”。
- source_word: לְבָבוֹ פֹנֶה
  choice: 心里转离
  rationale: 分词表达正在发生或开始发生的背离；中文“转离”既保留动态，也传达对盟约忠诚的背弃。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的专名形式呈现四字神名，而非用头衔替代。
- source_word: לָלֶכֶת לַעֲבֹד
  choice: 去事奉
  rationale: 自然表达“前去、以便事奉”的希伯来语结构，并保留目的含义。
- source_word: אֱלֹהֵי הַגּוֹיִם הָהֵם
  choice: 那些国家的神
  rationale: 直译指此前所见各国及其神明；“国家”保留 גּוֹיִם 在此处的群体政治含义。
- source_word: שֹׁרֶשׁ פֹּרֶה רֹאשׁ וְלַעֲנָה
  choice: 有根结出毒果和苦艾
  rationale: 保留“根—结出”的植物隐喻；以“毒果”传达 רֹאשׁ 的有毒产物含义，同时将 לַעֲנָה 具体译作“苦艾”。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用神的专名；译文保留专名而不改为“主”。“耶和华”是现代简体中文普通读者最熟悉且可直接识别的形式。
- issue: “心里转离”的时态与背道含义
  choice: 表达正在发生或萌生的转离
  alternative: 译为完成性的“已经离弃”
  rationale: 原文分词并未明确表示背离已经完成；译文保留持续或初起的可能性，不把警告限定为既成事实。
- issue: “根”的隐喻所指
  choice: 保留隐喻，不明说它等同于某个人或群体
  alternative: 解释为“带来败坏的人”
  rationale: 原文让“根”与前述个人、宗族或支派形成联系，却未将其指涉完全明说；直保隐喻可避免过度阐释。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。句式保留原文两次“免得”的平行警告；“宗族、支派、事奉”等词符合圣经历史语境，同时普通读者仍易理解。脚注标记置于相关植物隐喻之后。
