source:
  edition: WLC
  text: לֹא יֹאבֶ֣ה יְהוָה֮ סְלֹ֣חַֽ ל/וֹ֒ כִּ֣י אָ֠ז יֶעְשַׁ֨ן אַף יְהוָ֤ה וְ/קִנְאָת/וֹ֙ בָּ/אִ֣ישׁ הַ/ה֔וּא וְ/רָ֤בְצָה בּ/וֹ֙ כָּל הָ֣/אָלָ֔ה הַ/כְּתוּבָ֖ה בַּ/סֵּ֣פֶר הַ/זֶּ֑ה וּ/מָחָ֤ה יְהוָה֙ אֶת שְׁמ֔/וֹ מִ/תַּ֖חַת הַ/שָּׁמָֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/019.yaml
  text: Yahweh will not be willing to forgive him[a], for then the anger of Yahweh and his jealousy will burn against that man, and every curse written in this book will settle on him, and Yahweh will blot out his name from under heaven.
translation:
  language: zh_hans
  text: 耶和华必不肯赦免他；因为那时，耶和华的怒气和嫉妒必向那人冒烟，这书上所写的一切咒诅[a]都必落在他身上；耶和华必从天底下涂抹他的名。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“一切在盟约誓言中所援引的咒诅”；希伯来语这个词可指在盟约起誓时所援引的咒诅，不只是一般的咒骂。
    reason: 说明אָלָה在本节盟约语境中的词义范围。
lexical_decisions:
- source_word: יֹאבֶה
  choice: 不肯
  rationale: 该动词表达意愿或同意，而非能力；“不肯”自然保留了其意志层面的含义。
- source_word: סְלֹחַ לוֹ
  choice: 赦免他
  rationale: סלח在盟约语境中指赦免、宽恕；“赦免”庄重而清楚。
- source_word: כִּי אָז
  choice: 那时
  rationale: 该词组兼有解释和时间推进作用；结合前句分号，“那时”自然引出随后的审判结果。
- source_word: יֶעְשַׁן אַף יְהוָה
  choice: 耶和华的怒气……如烟升腾
  rationale: 原文以“冒烟”描绘怒气；译作“如烟升腾”保留鲜明意象，同时符合现代汉语表达。
- source_word: קִנְאָתוֹ
  choice: 他的嫉恨
  rationale: קנאה在盟约审判语境中表示因专一关系受侵犯而发的嫉妒性热忱；“嫉恨”保留审判语气，又不擅自化约为一般的“热心”。
- source_word: בָּאִישׁ הַהוּא
  choice: 向那人
  rationale: 介词ב在愤怒指向某人的语境中可译为“向”；“那人”保留原文阳性单数所指。
- source_word: וְרָבְצָה בוֹ
  choice: 都必落在他身上
  rationale: רבץ本义为躺卧、伏下；用于咒诅时表示降下并停留在某人身上。“落在他身上”既保留持续压在其上的意象，也自然易懂。
- source_word: כָּל הָאָלָה
  choice: 一切咒诅
  rationale: אָלָה可指盟约起誓时所援引的咒诅；正文采用清楚的“一切咒诅”，并以脚注保留誓约含义。
- source_word: הַכְּתוּבָה בַּסֵּפֶר הַזֶּה
  choice: 这书上所写的
  rationale: סֵפֶר既可指书卷，也可泛指书；“这书”在现代中文中清楚，并保留申命记的指示语气。
- source_word: וּמָחָה ... אֶת שְׁמוֹ
  choice: 涂抹他的名
  rationale: 该表达意指除去其名号、记忆或后裔延续；“涂抹他的名”保留希伯来文的具体意象和经文庄重感。
- source_word: מִתַּחַת הַשָּׁמָיִם
  choice: 从天下
  rationale: 这是表示从世上除去的固定表达；“从天下”简洁、自然，并保留原文空间意象。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以汉语中通行的专名“耶和华”呈现四字神名，而不以称号替代。
theological_decisions:
- issue: 神施行审判的拟人化意象
  choice: 保留怒气“如烟升腾”的比喻
  alternative: 将其概括为“怒火燃烧”或“大发烈怒”
  rationale: 原文特意使用“冒烟”的鲜明图像。译文保留这一图像，不进一步推论神之情感的性质。
- issue: 阳性单数所指
  choice: 译为“那人”
  alternative: 译为“那个人”或中性化处理
  rationale: 原文明确使用阳性单数名词，指上下文中违背盟约的个体；“那人”准确且自然。
- issue: 盟约咒诅术语
  choice: 正文译“一切咒诅”，脚注说明誓约含义
  alternative: 正文译“一切誓约之咒诅”
  rationale: “咒诅”足以表达直接意义；脚注则保留אָלָה在盟约起誓语境中的正式含义，避免正文过重。
- issue: קִנְאָה的神学张力
  choice: 译为“嫉恨”
  alternative: 译为“热忱”或“忌邪”
  rationale: 原词兼有嫉妒与热忱色彩。“嫉恨”在审判语境中较直接，并避免借用可能带有特定神学解释的固定术语。
translation_notes:
  register: 采用庄重、流畅的现代标准汉语。以分号呈现原句连续而层层推进的审判宣告；保留“如烟升腾”“落在他身上”“涂抹他的名”等具体意象，避免把原文的形象语言抽象化。
