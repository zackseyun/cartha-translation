  to: 耶和华必不肯赦免他；因为那时，耶和华的怒气和嫉妒必向那人冒烟，这书上所写的一切咒诅[a]都必落在他身上；耶和华必从天底下涂抹他的名。
  rationale: 修订以“因为那时”保留כי־אז的解释性和时间性，以“冒烟”直接保留יעשן的拟人化审判意象；将“嫉恨”改为“嫉妒”，避免加入“恨”的额外语义；并以“从天底下”更准确自然地呈现מתחת השמים。其余主要术语及脚注锚点均予保留。
