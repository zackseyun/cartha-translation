  yaml_path: translation/ot/deuteronomy/029/007.yaml
  text: and we took their land and gave it as an inheritance to the Reubenites[a], the Gadites, and the half-tribe of the Manassites.
translation:
  language: zh_hans
  text: 我们取得了他们的土地，把它作为产业给了流便人、迦得人和玛拿西半个支派。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文“玛拿西”在此用族称形式；按字面可理解为“玛拿西人的半个支派”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנִּקַּח
  choice: 我们夺取了
  rationale: לקח在这里是叙事性的第一人称复数形式，基本义为“取、拿”；结合击败诸王并取得其领土的军事语境，译作“夺取”自然，但不额外强化为更激烈的措辞。
- source_word: אַרְצָם
  choice: 他们的土地
  rationale: אֶרֶץ带第三人称阳性复数后缀，指上文被击败诸王的领土；“土地”清楚保留地域含义。
- source_word: וַנִּתְּנָהּ
  choice: 把它赐给
  rationale: נתן为“给”，阴性单数宾语后缀回指“土地”。“赐给”在分配应许之地的语境中庄重自然，同时仍保留给予的基本动作。
- source_word: לְנַחֲלָה
  choice: 作产业
  rationale: נַחֲלָה指承受或分得的恒久土地产业。“作产业”符合现代中文圣经语域，也比单纯“财产”更能保留土地分配与承受的意味。
- source_word: לָראוּבֵנִי
  choice: 吕便人
  rationale: 阳性单数族称在此具有集合意义，指吕便支派成员；中文用“吕便人”自然表达该集体。
- source_word: וְלַגָּדִי
  choice: 迦得人
  rationale: 族称单数具有集合意义，中文以“迦得人”指整个相关群体，既自然又贴近原文。
- source_word: וְלַחֲצִי שֵׁבֶט הַמְנַשִּׁי
  choice: 玛拿西半个支派
  rationale: חֲצִי שֵׁבֶט直译为“半个支派”；הַמְנַשִּׁי是族称形式。正文采用中文惯用的“玛拿西半个支派”，脚注说明原文形态。
