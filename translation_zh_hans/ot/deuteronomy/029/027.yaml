source:
  edition: WLC
  text: וַ/יִּתְּשֵׁ֤/ם יְהוָה֙ מֵ/עַ֣ל אַדְמָתָ֔/ם בְּ/אַ֥ף וּ/בְ/חֵמָ֖ה וּ/בְ/קֶ֣צֶף גָּד֑וֹל וַ/יַּשְׁלִכֵ֛/ם אֶל אֶ֥רֶץ אַחֶ֖רֶת כַּ/יּ֥וֹם הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/027.yaml
  text: So Yahweh uprooted them from their land in anger[a], fury, and great wrath, and cast them into another land[b], as it is this day.
translation:
  language: zh_hans
  text: 于是，雅威在怒气、烈怒和极大的震怒中，把他们从自己的土地上连根拔起[a]，抛到另一片土地上，正如今日所见[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “连根拔起”也可译作“拔除”或“强行扯离”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译为“像今天这样”，意为这结果在今日仍清楚可见。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּשֵׁם
  choice: 把他们……连根拔起
  rationale: נתשׁ表示拔出、扯出，常带有植物被连根拔除的形象；这里用“连根拔起”保留强烈意象，也贴合百姓被逐离土地的语境。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常用音译呈现四字神名，保留其作为以色列之上帝专名的性质，不以称号替代。
- source_word: מֵעַל אַדְמָתָם
  choice: 从自己的土地上
  rationale: אֲדָמָה可指土壤、地面或土地；本节论及失去故土并遭放逐，译作“土地”最合语境。“自己的”自然指回主语“他们”。
- source_word: בְּאַף וּבְחֵמָה וּבְקֶצֶף גָּדוֹל
  choice: 在怒气、烈怒和极大的震怒中
  rationale: 分别呈现三个层叠的忿怒词，不将其合并；“烈怒”和“极大的震怒”传达 חֵמָה 的炽烈感及 קֶצֶף גָּדוֹל 的加强形式。
- source_word: וַיַּשְׁלִכֵם
  choice: 抛
  rationale: שלך意为投掷、抛出；“抛”既保留审判行动的力度，又符合庄重的叙事语体。
- source_word: אֶל אֶרֶץ אַחֶרֶת
  choice: 到另一片土地上
  rationale: 直译“到另一土地”；保留 אֶרֶץ 的土地意象，不直接解释成特定国家。
- source_word: כַּיּוֹם הַזֶּה
  choice: 正如今日所见
  rationale: 这是指向当前可见状况的希伯来语惯用表达；译文自然传达“今天正是如此”，而脚注保留较字面的形式。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名。译作“雅威”旨在呈现该专名本身，而不是用“主”等称号替代；“耶和华”列为汉语传统音译的另一选择。
- issue: 三个忿怒用语的层叠
  choice: 怒气、烈怒和极大的震怒
  alternative: 愤怒、怒火和大怒
  rationale: 原文有意累积近义词，以强化审判的严厉程度；译文保留三项及“极大”的修饰，不把神的忿怒弱化或合并为一个概括词。
- issue: כַּיּוֹם הַזֶּה 所指的时间与景况
  choice: 正如今日所见
  alternative: 像今天这样
  rationale: 保留说话者所指当下可见之景况，不进一步断定这句话所隐含的历史成书阶段。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“连根拔起”保留原文的具体形象；三个忿怒词维持递进式累积。“正如今日所见”处理为自然汉语，并用脚注交代原文惯用语的字面形式。
