  text: אַתֶּ֨ם נִצָּבִ֤ים הַ/יּוֹם֙ כֻּלְּ/כֶ֔ם לִ/פְנֵ֖י יְהוָ֣ה אֱלֹהֵי/כֶ֑ם רָאשֵׁי/כֶ֣ם שִׁבְטֵי/כֶ֗ם זִקְנֵי/כֶם֙ וְ/שֹׁ֣טְרֵי/כֶ֔ם כֹּ֖ל אִ֥ישׁ יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/009.yaml
  text: 'You are standing today[a], all of you, before Yahweh your God: your heads, your tribes, your elders[b], and your officers—all the men of Israel.'
translation:
  language: zh_hans
  text: 今天，你们全都站在耶和华你们的神面前：你们的首领、各支派[a]、长老和官长——以色列的每一个男子[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “你们的首领、各支派”也可理解为“你们各支派的首领”。
    reason: alternative_reading
  - marker: b
    text: 原文直译为“以色列的每一个男人”，是逐一概括的说法。
    reason: lexical_clarification
lexical_decisions:
- source_word: נִצָּבִים
  choice: 站在
  rationale: 该词为 נצב 的尼法勒分词，描写立约群体此刻站立、聚集在神面前的状态；“站在”自然保留了场景性和持续性。
- source_word: הַיּוֹם
  choice: 今天
  rationale: 直接保留原文的时间强调，符合现代汉语表达。
- source_word: כֻּלְּכֶם
  choice: 你们全都
  rationale: 明确传达第二人称复数群体的整体性，同时语序自然。
- source_word: לִפְנֵי
  choice: 在……面前
  rationale: 准确表达身处神面前的空间及立约语境含义，不额外扩展解释。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名形式音译四字神名，而不以称号代替。
- source_word: אֱלֹהֵיכֶם
  choice: 你们的神
  rationale: 直接呈现带第二人称复数后缀的名词，保留立约称谓。
- source_word: רָאשֵׁיכֶם
  choice: 你们的首领
  rationale: רֹאשׁ 字面为“头”，此处用于群体领袖；“首领”在现代汉语中自然且保留其比喻义。
- source_word: שִׁבְטֵיכֶם
  choice: 各支派
  rationale: 按马所拉文本的独立词项译为“各支派”，不在正文中把它静默并入“首领”；另一种句法理解列入脚注。
- source_word: זִקְנֵיכֶם
  choice: 长老
  rationale: 这是以色列社会中资深群体领袖的常用称谓。
- source_word: שֹׁטְרֵיכֶם
  choice: 官长
  rationale: 该词在申命记的行政语境中指执行管理职责的官员；“官长”简洁而不过度限定其具体职能。
- source_word: כֹּל אִישׁ יִשְׂרָאֵל
  choice: 以色列的每一个男子
  rationale: 保留 אִישׁ 的阳性单数及 כֹּל 的逐一、分配性用法，也与下一节将妇女和孩童另行列出相协调。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。正文采用现代中文圣经传统中最为通行、可辨识的专名“耶和华”，而非以“主”等称号替换；“雅威”是另一种常见的学术拟音。
- issue: כֹּל אִישׁ יִשְׂרָאֵל 的性别表达
  choice: 以色列的每一个男子
  alternative: 所有以色列人
  rationale: 原文使用明确的阳性名词 אִישׁ，且后文另列妇女和孩童，因此正文不将其泛化为无性别区别的“所有人”。
- issue: רָאשֵׁיכֶם שִׁבְטֵיכֶם 的句法关系
  choice: 你们的首领、各支派
  alternative: 你们各支派的首领
  rationale: 马所拉文本可按并列名单理解，但也可能把两个词紧密连读为“各支派的首领”。正文保留并列结构，脚注呈现另一种真实可能。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“你们全都”突出全体会众，“官长”保留申命记行政语境的正式感。破折号将末尾的总括语与前面的群体名单连接起来。
