base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/004.yaml
  text: And I led you forty years in the wilderness; your clothes did not wear out on you[a], and your sandal did not wear out on your foot.
translation:
  language: zh_hans
  text: 我带领你们在旷野走了四十年；你们身上的衣服没有穿破，你脚上的鞋也没有穿破。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文在最后一句由复数转为单数，直译是“你的鞋没有从你的脚上穿破”。这里的单数可能把以色列看作一个整体，也可能是逐一指每个人。
    reason: 说明原文人称数的转换及其可能含义。
lexical_decisions:
- source_word: וָאוֹלֵךְ
  choice: 我带领……走了
  rationale: 该词是הלך的使役形，表示使人行走、带领前行；结合旷野旅程的语境，译作“带领……走了”既体现使役含义，也符合现代汉语。
- source_word: בַּמִּדְבָּר
  choice: 在旷野
  rationale: מִדְבָּר指荒野或沙漠地带；“旷野”准确自然，也保留这段历史叙事的传统语感。
- source_word: בָּלוּ / בָלְתָה
  choice: 没有穿破
  rationale: בלה在衣服和鞋的语境中指因长期使用而磨损、破旧；“穿破”具体而自然，且适用于衣服与鞋。
- source_word: שַׂלְמֹתֵיכֶם
  choice: 你们身上的衣服
  rationale: 该复数名词泛指衣物；“衣服”是现代汉语中自然、宽泛的对应词，配合מֵעֲלֵיכֶם译为“身上的”。
- source_word: מֵעֲלֵיכֶם
  choice: 你们身上的
  rationale: 原文直译为“从你们身上”；与“没有穿破”连用时，汉语以“你们身上的衣服没有穿破”表达更自然，并保留衣服穿在身上的图景。
- source_word: נַעַלְךָ
  choice: 你脚上的鞋
  rationale: נַעַל指鞋或凉鞋，原文为第二人称阳性单数；“鞋”在现代汉语中自然且不过度限定具体式样，同时保留单数称谓“你”。
- source_word: מֵעַל רַגְלֶךָ
  choice: 你脚上的
  rationale: 原文字面为“从你脚上”；在否定磨损的句式中，译作“你脚上的鞋没有穿破”最符合汉语习惯。
- source_word: אַרְבָּעִים שָׁנָה
  choice: 四十年
  rationale: 直接表达原文的时间长度，无须增补。
theological_decisions:
- issue: 前半句复数称呼与末句单数称呼之间的转换
  choice: 正文保留“你们”到“你”的转换，并加脚注说明
  alternative: 为使汉语更顺畅而统一译成复数：“你们脚上的鞋”
  rationale: 原文先以复数称呼以色列人，末句改用第二人称单数，可能把以色列视为一个整体，也可能是逐一指向每个人的分配性单数。正文保留这一转换，避免替原文消除其真实的语法张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“旷野”保留经文语境中的固定意象；“衣服”“鞋”“穿破”则使用日常清楚的词语。脚注标记置于相关末句之后。
