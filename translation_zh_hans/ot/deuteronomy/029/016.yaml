  yaml_path: translation/ot/deuteronomy/029/016.yaml
  text: and you saw their detestable things and their idols[a], wood and stone, silver and gold[c][b], that were among them—
translation:
  language: zh_hans
  text: 你们也看见了他们那些可憎之物[a]和偶像[b]，即木头、石头、银子和金子制成的物件；这些物件与他们同在[c]——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “可憎之物”也可译作“可憎恶的东西”。这里的希伯来词语气强烈，常指与偶像崇拜有关的物件。
    reason: lexical_alternative
  - marker: b
    text: “偶像”所译的希伯来词带有强烈的轻蔑意味；也有人以“粪偶像”一类说法表达其粗鄙的贬义语感。
    reason: lexical_alternative
  - marker: c
    text: “与他们同在”也可译作“在他们中间”；“他们”指上文所说、以色列曾经过其境内的列国。
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּרְאוּ
  choice: 你们也看见了
  rationale: 这是 ראה 的 Qal 连续式第二人称阳性复数，延续摩西对全体百姓的讲话；“也”自然承接上文的回顾。
- source_word: שִׁקּוּצֵיהֶם
  choice: 他们那些可憎之物
  rationale: שִׁקּוּץ 表示令人厌恶、尤其与偶像崇拜有关的事物；“可憎之物”保留强烈贬义，又不把所指过早限定为某一类物件。
- source_word: גִּלֻּלֵיהֶם
  choice: 他们的偶像
  rationale: גִּלּוּלִים 是对偶像的蔑称；正文用现代读者清楚易懂的“偶像”，脚注说明原词更强烈、带有鄙夷意味。
- source_word: עֵץ וָאֶבֶן כֶּסֶף וְזָהָב
  choice: 有木头、石头、银子和金子做的
  rationale: 这组名词列出偶像或可憎之物的材质；补出“做的”符合现代汉语表达，并以“有”避免让材质只修饰紧邻的一项。
- source_word: אֲשֶׁר עִמָּהֶם
  choice: 都在他们中间
  rationale: עִם 的基本关系是“与……同在”；结合上文，代词指以色列经过之地的列国，译为“在他们中间”保留其存在于那些民族当中的意思，而不明确断定所有权。
theological_decisions:
- issue: 两个人为偶像崇拜物件所用的贬义词
  choice: 正文分别译作“可憎之物”和“偶像”
  alternative: “可憎之物”和“污秽偶像”或“粪偶像”
  rationale: 希伯来文使用两个不同的贬义词。正文保留两项之别及其负面评价，同时避免用生硬或过度具象的词替代原文可能含有的粗鄙语感；该语感留在脚注说明。
- issue: 关系从句 אֲשֶׁר עִמָּהֶם 的所指和含义
  choice: 译为“都在他们中间”，其中“他们”指上文所说的列国
  alternative: “都是他们所有的”或“都与他们同在”
  rationale: 上下文最自然地将复数代词连于前一节的列国，而非以色列；“在他们中间”不额外断定所有权，也保留希伯来文关系表达的宽度。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“可憎之物”保留原文强烈评价，“偶像”确保所指清楚；破折号保留本节未完、引向下文警告的句法衔接。
