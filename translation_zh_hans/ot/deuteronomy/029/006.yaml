base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/006.yaml
  text: When you came to this place[a], Sihon king of Heshbon and Og king of Bashan came out to meet us in battle[b], and we struck them down.
translation:
  language: zh_hans
  text: 你们来到这地方时[a]，希实本王西宏和巴珊王噩出来迎战我们，我们就击败了他们[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你们来到这地方，希实本王西宏和巴珊王噩出来迎战我们，我们就击败了他们。”希伯来文的叙事形式既可表示简单的先后承接，也可按上下文表达为时间关系。
    reason: lexical_alternative
  - marker: b
    text: “击败”直译为“击打”；这个希伯来语动词在战争语境中常指击溃或战胜敌人。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּבֹאוּ
  choice: 你们来到……时
  rationale: בוא的Qal连续式未完成时第二人称阳性复数，叙述过去发生的事；按上下文将顺承关系自然表达为时间从句，同时用脚注保留简单并列的可能。
- source_word: אֶל הַמָּקוֹם הַזֶּה
  choice: 这地方
  rationale: מָקוֹם意为“地方”；与“来到”搭配时，现代汉语无需另译介词אֶל。
- source_word: וַיֵּצֵא
  choice: 出来
  rationale: יצא的Qal连续式未完成时，基本义为“出去、出来”；这里依相遇的叙事视角译作“出来”，不额外加入“率军”等原文未明说的信息。
- source_word: סִיחֹן מֶלֶךְ חֶשְׁבּוֹן
  choice: 希实本王西宏
  rationale: 按现代汉语自然语序表达王号与人名，并采用中文圣经传统中通行的专名译法。
- source_word: וְעוֹג מֶלֶךְ הַבָּשָׁן
  choice: 巴珊王噩
  rationale: 与前一王号保持平行，采用中文圣经传统中通行的专名译法。
- source_word: לִקְרָאתֵנוּ לַמִּלְחָמָה
  choice: 迎战我们
  rationale: לִקְרָאתֵנוּ本义为“来迎着我们”，לַמִּלְחָמָה明确其军事目的；合译为“迎战我们”简洁自然，也完整保留敌对交战之意。
- source_word: וַנַּכֵּם
  choice: 我们就击败了他们
  rationale: נכה的Hiphil连续式未完成时第一人称复数，带第三人称阳性复数宾语后缀；该动词在军事语境中可指击打并战胜，正文译“击败”，脚注保留较具体的“击打/打倒”意象。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“迎战”将“出来迎接我们”与“为要争战”凝练表达；句中保留第二人称复数“你们”和第一人称复数“我们”的转换。所有脚注标记均已置于正文。
