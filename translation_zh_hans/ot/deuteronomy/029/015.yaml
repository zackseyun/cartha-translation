- from: 因为你们知道我们住在埃及地时的情形，也知道我们从列国中间经过时的情形；这些列国，你们都曾经过。[a]
  to: 因为你们知道我们在埃及地居住的情形，也知道我们经过你们所经过的列国时的情形。
  rationale: 修订将“你们所经过的”直接置于“列国”之后，恢复其作为关系从句的句法功能，删除无原文依据的“都”。“居住的情形”与“经过……时的情形”保留两处 אֵת אֲשֶׁר 结构所指的已知情况或经历，也保留第一人称“我们”与第二人称“你们”的转换。无需脚注，因为该译文已在正文中自然呈现相关结构，且不存在必须以注释保留的文本异文。
