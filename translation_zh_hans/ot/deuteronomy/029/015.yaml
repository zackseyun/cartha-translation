base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/015.yaml
  text: For you know how we lived in the land of Egypt[a], and how we passed through the midst of the nations through which you passed.
translation:
  language: zh_hans
  text: 因为你们知道我们在埃及地居住的情形，也知道我们经过你们所经过的列国时的情形。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 在上下文中引出前述话语的理由；“因为”自然保留其解释、因果作用。
- source_word: יְדַעְתֶּם
  choice: 你们知道
  rationale: 完成式表示听众因过去的亲身经历而具有的现今知识，汉语现在时表达最自然。
- source_word: אֵת אֲשֶׁר יָשַׁבְנוּ
  choice: 我们住……时的情形
  rationale: אֵת 加关系从句在这里指听众所熟知的处境或经历；“……时的情形”既通顺，又不把含义缩窄为单纯的居住方式。
- source_word: יָשַׁבְנוּ
  choice: 我们住
  rationale: ישׁב 在此意为居住、生活；“住”简洁自然，并保留原文的基本动作。
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: 在埃及地
  rationale: 保留原文“埃及地”的传统地理表达，同时符合现代汉语圣经语体。
- source_word: וְאֵת אֲשֶׁר עָבַרְנוּ
  choice: 也知道我们……经过时的情形
  rationale: 与前一关系结构平行；“经过”保留 עבר 的行进意义，不擅自解释为受苦或遭遇患难。
- source_word: בְּקֶרֶב הַגּוֹיִם
  choice: 从列国中间
  rationale: בקרב 表示“在……中间”；结合移动动词，用“从……中间经过”符合现代汉语习惯。
- source_word: הַגּוֹיִם
  choice: 列国
  rationale: 此处指不同国家或民族群体；“列国”庄重而准确，避免采用带有后期宗教分类色彩的称呼。
- source_word: אֲשֶׁר עֲבַרְתֶּם
  choice: 这些列国，你们都曾经过
  rationale: 明确保留原文从第一人称复数“我们经过”转为第二人称复数“你们经过”的措辞，也保留 עבר 的重复强调。
