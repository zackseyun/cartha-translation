base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/010.yaml
  text: For you must surely put him to death; your hand shall be first against him to put him to death[a], and afterward the hand of all the people.
translation:
  language: zh_hans
  text: 因为你必须把他处死；你的手要首先处死他[a]，随后全体百姓都要动手。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你一定要杀死他。”希伯来文以同根的不定式绝对式和限定动词连用，表示强调。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上一节的禁令并说明应当采取这一行动，保留原文的因果或解释关系。
- source_word: הָרֹג תַּהַרְגֶנּוּ
  choice: 你必须把他处死
  rationale: 不定式绝对式与限定动词连用，强化义务和确定性；“必须”体现强调，“处死”符合本段司法语境。
- source_word: יָדְךָ תִּהְיֶה בּוֹ בָרִאשׁוֹנָה
  choice: 你要先下手
  rationale: “手”在此表示亲自参与执行；“先下手”以自然汉语保留行动次序及具体意象。
- source_word: לַהֲמִיתוֹ
  choice: 处死他
  rationale: מות的使役式表示使之死亡；在法律语境中译作“处死”准确而不刻意弱化。
- source_word: וְיַד כָּל הָעָם בָּאַחֲרֹנָה
  choice: 然后众百姓也要下手
  rationale: 保留“手”的平行意象，并清楚表达全体百姓随后参与执行。
theological_decisions:
- issue: 如何表达盟约法律中的死刑措辞
  choice: 处死
  alternative: 杀死
  rationale: “处死”体现司法执行的语境，同时如实传达死亡结果，既不淡化，也不增加原文没有的残酷色彩。
- issue: 首告者与全体百姓参与执行的次序
  choice: 你要先下手……然后众百姓也要下手
  alternative: 你的手要首先攻击他……随后是众百姓的手
  rationale: 采用自然现代汉语保存原文“先—后”的次序和“手”的行动意象，不进一步解释具体执行方式。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“处死”符合司法语境；“下手”保留原文“手”的具体意象与先后次序。脚注说明希伯来文的强调结构，并列出较直译的词汇选择。
