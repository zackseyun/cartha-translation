  text: לֹ֣א תִשְׁמַ֗ע אֶל דִּבְרֵי֙ הַ/נָּבִ֣יא הַ/ה֔וּא א֛וֹ אֶל חוֹלֵ֥ם הַ/חֲל֖וֹם הַ/ה֑וּא כִּ֣י מְנַסֶּ֞ה יְהוָ֤ה אֱלֹֽהֵי/כֶם֙ אֶתְ/כֶ֔ם לָ/דַ֗עַת הֲ/יִשְׁ/כֶ֤ם אֹֽהֲבִים֙ אֶת יְהוָ֣ה אֱלֹהֵי/כֶ֔ם בְּ/כָל לְבַבְ/כֶ֖ם וּ/בְ/כָל נַפְשְׁ/כֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/004.yaml
  text: You shall not listen to the words of that prophet or to that dreamer of dreams[a], for Yahweh your God is testing you[b], to know whether you love Yahweh your God with all your heart and with all your soul.
translation:
  language: zh_hans
  text: 你不可听从那先知的话，也不可听从那做梦之人的话；因为耶和华你们的上帝正在试验你们，要知道你们是否以你们全部的心和全部的生命来爱耶和华你们的上帝。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “生命”所译的希伯来词也可指“自己”或“整个存在”。
    reason: 说明נֶפֶשׁ的语义范围；正文保留“全部的心”和“全部的生命”两个并列成分。
lexical_decisions:
- source_word: לֹא תִשְׁמַע אֶל
  choice: 你不可听从
  rationale: שׁמע与אֶל连用不只是听见，也有听信、服从之意；“听从”自然保留其听觉与顺从两层含义。
- source_word: דִּבְרֵי הַנָּבִיא הַהוּא
  choice: 那先知的话
  rationale: 保留דִּבְרֵי的复数/集合性表达，并以“那”对应冠词加指示词הַהוּא，指向上文所说的先知。
- source_word: חוֹלֵם הַחֲלוֹם הַהוּא
  choice: 那做梦之人的话
  rationale: 该结构直指上文所说以梦为启示根据的人；“做梦之人”比生硬的“梦梦者”更符合现代汉语，同时未将其解释性地改为“假先知”。
- source_word: מְנַסֶּה
  choice: 正在试验
  rationale: Piel分词表示正在进行或持续的试验；“试验”保留检验、考验的语义。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经语境中广为人知的神名音译，不以称号“主”替代原文专名。
- source_word: לָדַעַת
  choice: 要知道
  rationale: 直接保留原文“知道”的目的表达，不改写成“显明”或“使你们知道”，以保存原文的拟人化张力。
- source_word: הֲיִשְׁכֶם אֹהֲבִים
  choice: 你们是否……爱
  rationale: 疑问词与分词表达是否处于爱上帝的状态；现代汉语用“是否爱”自然呈现，不必机械添加进行体。
- source_word: בְּכָל לְבַבְכֶם וּבְכָל נַפְשְׁכֶם
  choice: 全心全意
  rationale: 这是自然、庄重的现代汉语惯用语，整体传达以全部内心和生命爱上帝；脚注注明较形式对应的译法。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 原文使用专名而非称号；“耶和华”是普通中文读者最熟悉且能明确识别为神名的音译。
- issue: 上帝“试验……要知道”的拟人化表达
  choice: 按原文保留“正在试验你们，要知道”
  alternative: 试验你们，为要显明；借此让人知道
  rationale: 原文明确使用לָדַעַת“知道”，译文不替作者解决上帝为何需要“知道”的神学张力。
- issue: לֵבָב与נֶפֶשׁ的整体表达
  choice: 正文译为“全心全意”，脚注保留“全心、全生命”的形式对应
  alternative: 用你们全部的心、全部的生命
  rationale: “全心全意”在中文中自然表达毫无保留的爱，但נֶפֶשׁ也可能指生命、自我或整个存在，因此用脚注保留原文两项并列的细节。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。“听从”体现听信并服从的含义；以“上帝”配合神名“耶和华”。正文力求顺畅，同时通过脚注保存盟约用语中“心”和“生命”的原文结构。
