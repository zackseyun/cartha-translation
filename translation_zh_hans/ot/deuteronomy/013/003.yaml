base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/003.yaml
  text: and the sign or the wonder comes to pass[a], about which he spoke to you, saying, ‘Let us go after other gods, which you have not known[c][b], and let us serve them,’
translation:
  language: zh_hans
  text: 他向你所说的那神迹或奇事果然发生了[a]，他说：‘我们去跟随别的神吧，就是你不认识的那些神[b]；让我们侍奉它们[c]。’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “神迹或奇事”也可译作“神迹和奇事”；希伯来语这组词常作为固定搭配使用。
    reason: lexical_alternative
  - marker: b
    text: “你不认识的那些神”也可译作“你未曾认识的那些神”。
    reason: lexical_alternative
  - marker: c
    text: “侍奉”也可译作“敬拜”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָא
  choice: 果然发生了
  rationale: 本义为“来到”，在预告的神迹或奇事这一语境中表示事情实现；“果然发生了”自然传达预言应验的含义。
- source_word: הָאוֹת וְהַמּוֹפֵת
  choice: 神迹或奇事
  rationale: אוֹת 指具有指示、证明作用的“神迹/征兆”，מוֹפֵת 指“奇事”；连接词在这一固定搭配中可按汉语习惯译为“或”，表示其中任何一种超常凭证，同时脚注保留直译“和”的可能。
- source_word: אֲשֶׁר דִּבֶּר אֵלֶיךָ
  choice: 他对你所说的
  rationale: 保留关系从句及“向你说”的指向，并与后面的“发生了”自然衔接。
- source_word: לֵאמֹר
  choice: 他说
  rationale: 引出直接引语；现代汉语用“他说”比机械译作“说着”更自然。
- source_word: נֵלְכָה אַחֲרֵי
  choice: 我们去跟随……吧
  rationale: נֵלְכָה 是劝勉式“让我们去”，אַחֲרֵי 表示“在……之后/跟随”；此译既保留行动意象，也表达宗教效忠。
- source_word: אֱלֹהִים אֲחֵרִים
  choice: 别的神
  rationale: 申命记中常见的盟约用语；“别的神”准确、自然，不额外判定其本体地位。
- source_word: אֲשֶׁר לֹא יְדַעְתָּם
  choice: 就是你不认识的那些神
  rationale: ידע 在此可指认识、熟悉或承认；“不认识”保留其宽泛含义，不将盟约性内涵解释得过满。
- source_word: וְנָעָבְדֵם
  choice: 让我们侍奉它们
  rationale: עבד 的基本义是服事、侍奉，在此特指宗教性敬奉；“侍奉”保留比单纯“敬拜”更宽的盟约服事含义。
theological_decisions:
- issue: 如何表达“别的神”及其代词
  choice: 别的神……它们
  alternative: 别的神……他们
  rationale: 希伯来语使用语法上的阳性复数，并未在本节解释这些神的本体地位。汉语以“它们”指称受敬奉的神祇较为自然，也避免额外赋予人格性；脚注说明“他们”是可能译法，以保留原文张力。
- issue: עבד 的宗教含义
  choice: 侍奉
  alternative: 敬拜
  rationale: 上下文显然涉及偶像崇拜，但原词也包含服事、效忠之意；正文用“侍奉”保留其语义宽度，脚注列出“敬拜”。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以“果然发生了”表达所预告之事实现，以“我们去跟随……吧”保留希伯来语劝勉式及“跟随”的行动意象。所有脚注标记均置于相关正文之后。
