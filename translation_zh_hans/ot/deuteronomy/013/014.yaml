  text: יָצְא֞וּ אֲנָשִׁ֤ים בְּנֵֽי בְלִיַּ֨עַל֙ מִ/קִּרְבֶּ֔/ךָ וַ/יַּדִּ֛יחוּ אֶת יֹשְׁבֵ֥י עִירָ֖/ם לֵ/אמֹ֑ר נֵלְכָ֗ה וְ/נַעַבְדָ֛ה אֱלֹהִ֥ים אֲחֵרִ֖ים אֲשֶׁ֥ר לֹא יְדַעְתֶּֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/014.yaml
  text: Certain worthless men have gone out from among you and have led the inhabitants of their city astray[a], saying, ‘Let us go and serve other gods,’ which you have not known.
translation:
  language: zh_hans
  text: 有些无赖之徒[a]从你们中间出来，把他们城里的居民引入歧途，说：‘我们去事奉别的神吧！’这些神是你们不认识的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“无用之子”；传统译作“彼列之子”。
    reason: 说明希伯来语习语的字面形式及传统译法，避免正文引入原文未必具有的后期专名含义。
lexical_decisions:
- source_word: יָצְאוּ
  choice: 出来
  rationale: 该词为יצא的Qal完成式复数，在本节所引述的报告中表示这些人从群体内部出来；现代汉语无需机械添加时态标记。
- source_word: אֲנָשִׁים בְּנֵי בְלִיַּעַל
  choice: 无赖之徒
  rationale: אֲנָשִׁים明确指复数男性，而“无赖之徒”既保留其所指的人群，也自然传达בְּנֵי בְלִיַּעַל这一表示败坏、无法无天之人的希伯来语习语。直译另见脚注。
- source_word: מִקִּרְבְּךָ
  choice: 从你们中间
  rationale: 表达这些煽动者出自盟约群体内部；汉语用复数“你们”与本句后面的复数称谓协调，也符合对以色列集体说话的语境。
- source_word: וַיַּדִּיחוּ
  choice: 把……引入歧途
  rationale: נדח的Hiphil词形表示使人偏离或被带走；此处涉及转向别神，“引入歧途”保留其使役意义和宗教背离的语境。
- source_word: יֹשְׁבֵי עִירָם
  choice: 他们城里的居民
  rationale: 忠实表达分词结构“住在他们城里的人”；“居民”简洁而自然。
- source_word: לֵאמֹר
  choice: 说
  rationale: 以自然汉语引出后面的直接引语。
- source_word: נֵלְכָה וְנַעַבְדָה
  choice: 我们去事奉……吧
  rationale: 两个鼓励式表达共同的劝诱；句末“吧”自然传达“让我们……”的倡议语气。“事奉”保留עבד兼具服事与宗教敬奉的宽广含义。
- source_word: אֱלֹהִים אֲחֵרִים
  choice: 别的神
  rationale: 直接保留申命记中常见的“其他的神”这一表达，不擅自缩窄为“外族的神”。
- source_word: אֲשֶׁר לֹא יְדַעְתֶּם
  choice: 这些神是你们素来不认识的
  rationale: “认识”保留ידע可能含有的关系性意味，而“素来”自然表达截至当时并不认识，并未将其弱化为仅仅没有听说过。
theological_decisions:
- issue: בְּנֵי בְלִיַּעַל应理解为习语还是专名
  choice: 无赖之徒
  alternative: 彼列之子／无用之辈
  rationale: 在本节的希伯来语语境中，这一短语是指败坏、无法无天之人的习语，并不要求把“彼列”理解为后期文献中的人格化邪恶者。正文采用自然的习语译法，脚注保留字面形式。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“无赖之徒”传达强烈的道德贬义但不使用生僻宗教术语；“事奉”符合圣经语域，同时仍为普通读者所理解。
