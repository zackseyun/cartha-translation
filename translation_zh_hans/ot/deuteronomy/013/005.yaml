- from: 你们要跟随耶和华你们的上帝而行[a]，敬畏他，谨守他的诫命，听他的声音[b]，事奉他，紧紧依附他[c]。
  to: 你们要跟随耶和华——你们的上帝，敬畏他，谨守他的诫命，听他的声音[b]，事奉他，紧紧依附他[c]。[a]
  rationale: 修订仅改善现代汉语的顺畅度及脚注 c 的搭配，并将脚注 a 的字面说明调为更准确、自然的汉语。正文仍逐一保留原文的命令序列、盟约性语气及“听他的声音”的语义开放性。脚注 a 应紧随首项，故移至句末作为该首项的脚注锚点，以免打断并列命令的阅读节奏。
