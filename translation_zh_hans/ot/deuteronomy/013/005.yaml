base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/005.yaml
  text: You shall walk after Yahweh your God and fear him[a], and keep his commandments and listen to his voice, and serve him[c][b], and cling to him.
translation:
  language: zh_hans
  text: 你们要跟随耶和华——你们的上帝，敬畏他，谨守他的诫命，听他的声音[b]，事奉他，紧紧依附他[c]。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译为“在耶和华——你们的上帝之后行走”，意思是跟随他。
    reason: lexical_alternative
  - marker: b
    text: “听他的声音”也可理解为“听从他的声音”或“顺服他”。
    reason: lexical_alternative
  - marker: c
    text: 或译：“紧紧抓住他”或“与他紧密相连”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרֵי יְהוָה אֱלֹהֵיכֶם תֵּלֵכוּ
  choice: 跟随耶和华你们的上帝而行
  rationale: 保留“在……之后行走”的希伯来语盟约性意象，同时用现代汉语中自然可懂的“跟随……而行”表达忠诚追随。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代简体中文读者熟悉的专名形式译出四字神名，不用称号替代。
- source_word: תִירָאוּ
  choice: 敬畏他
  rationale: “敬畏”兼顾对上帝的畏惧、尊崇与肃然之情，不将含义弱化为一般的尊敬。
- source_word: מִצְוֺתָיו תִּשְׁמֹרוּ
  choice: 谨守他的诫命
  rationale: “谨守”自然表达 שׁמר 在盟约语境中的遵守、持守之意；“诫命”保留正式的盟约语体。
- source_word: וּבְקֹלוֹ תִשְׁמָעוּ
  choice: 听他的声音
  rationale: 直译该短语的具体措辞，不在正文中把其中隐含的顺服含义完全明说，从而保留听见与听从之间的语义张力。
- source_word: תַעֲבֹדוּ
  choice: 事奉他
  rationale: “事奉”在上帝为宾语时可涵盖服事与敬拜，避免把词义仅限于礼仪性的崇拜。
- source_word: וּבוֹ תִדְבָּקוּן
  choice: 紧紧依附他
  rationale: 表达 דבק 所含紧贴、依附和忠贞联合的强烈关系意象。
theological_decisions:
- issue: 如何译出神名 יְהוָה
  choice: 耶和华
  alternative: 雅威
  rationale: 正文保留其作为专名的性质；采用现代中文圣经传统中最广为人知的音译“耶和华”，不以“主”等称号替代。
- issue: שׁמע בְּקוֹל 是否直接解释为顺服
  choice: 听他的声音
  alternative: 听从他的声音／顺服他
  rationale: 该短语在盟约语境中确实包含服从之意，但原文明确保留“听”与“声音”的表达；正文照此译出，并在脚注说明顺服义。
- issue: עבד 在此是服事还是敬拜
  choice: 事奉他
  alternative: 敬拜他
  rationale: 对上帝的 עבד 同时具有服事和敬拜维度；“事奉”较宽，避免不必要地缩窄为礼仪行为。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。句中连续使用并列动词，尽量保留希伯来文劝诫的节奏与累积力量；以“你们”反映原文第二人称复数。
