  text: וְ/הַ/נָּבִ֣יא הַ/ה֡וּא א֣וֹ חֹלֵם֩ הַ/חֲל֨וֹם הַ/ה֜וּא יוּמָ֗ת כִּ֣י דִבֶּר סָ֠רָה עַל יְהוָ֨ה אֱלֹֽהֵי/כֶ֜ם הַ/מּוֹצִ֥יא אֶתְ/כֶ֣ם מֵ/אֶ֣רֶץ מִצְרַ֗יִם וְ/הַ/פֹּֽדְ/ךָ֙ מִ/בֵּ֣ית עֲבָדִ֔ים לְ/הַדִּֽיחֲ/ךָ֙ מִן הַ/דֶּ֔רֶךְ אֲשֶׁ֧ר צִוְּ/ךָ֛ יְהוָ֥ה אֱלֹהֶ֖י/ךָ לָ/לֶ֣כֶת בָּ֑/הּ וּ/בִֽעַרְתָּ֥ הָ/רָ֖ע מִ/קִּרְבֶּֽ/ךָ־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/006.yaml
  text: But that prophet[a], or that dreamer of dreams, shall be put to death, because he has spoken rebellion against Yahweh your God, who brought you out from the land of Egypt and redeemed you from the house of slavery, to drive you from the way in which Yahweh your God commanded you to walk[b]. So you shall purge the evil from your midst.
translation:
  language: zh_hans
  text: “但那个先知，或那个做梦的人，必须被处死，因为他发表了反叛[a]雅威——你们的上帝——的言论。雅威曾领你们出埃及地，又把你从为奴之家[b]救赎出来；为要使你偏离雅威——你上帝——吩咐你行在其中的道路。因此，你要除掉你中间的恶。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “反叛”也可译作“叛离”或“悖逆”；希伯来词在这里指背弃对雅威的盟约忠诚。
    reason: lexical_alternative
  - marker: b
    text: “为奴之家”直译为“奴隶之家”，指受奴役之地。原文在这里从复数“你们”转为单数“你”。
    reason: literal_rendering_and_number_shift
lexical_decisions:
- source_word: וְהַנָּבִיא הַהוּא א֣וֹ חֹלֵם הַחֲלוֹם הַהוּא
  choice: 但那个先知或那个做梦的人
  rationale: “但”承接前文所设情形并转入判决；两个指示成分均以“那个”表达。“做梦的人”自然保留“梦的做梦者”这一希伯来表达的核心含义，不额外断定其身份。
- source_word: יוּמָת
  choice: 必须被处死
  rationale: מות的使役被动式在此指司法处决，而非自然死亡；“必须”体现法律条文的强制性。
- source_word: כִּי דִבֶּר סָרָה עַל יְהוָה אֱלֹהֵיכֶם
  choice: 因为他说了背叛雅威你们上帝的话
  rationale: סָרָה在盟约语境中指背叛、叛离；“说了……的话”既符合现代汉语，也保留言语本身构成背叛的力度。עַל在此具有敌对、反对之意。
- source_word: הַמּוֹצִיא אֶתְכֶם מֵאֶרֶץ מִצְרַיִם
  choice: 雅威曾领你们出埃及地
  rationale: 保留申命记中典型的出埃及表述，并用“曾”自然标明所回顾的救赎事件。
- source_word: וְהַפֹּדְךָ מִבֵּית עֲבָדִים
  choice: 把你从为奴之家救赎出来
  rationale: “救赎”对应פדה；“为奴之家”保留“家/房屋”的具体意象，同时在现代汉语中清楚表达奴役处境。依原文保留此处由复数“你们”转为单数“你”。
- source_word: לְהַדִּיחֲךָ מִן הַדֶּרֶךְ
  choice: 企图使你偏离……的道
  rationale: נדח的使役式表达使人被赶离或引离正道；“使你偏离”保留其方向性而不把方式限定为诱骗。“道”承载申命记关于生活道路的盟约隐喻。
- source_word: אֲשֶׁר צִוְּךָ יְהוָה אֱלֹהֶיךָ לָלֶכֶת בָּהּ
  choice: 雅威你上帝吩咐你当行的道
  rationale: “行道”自然保留希伯来文“在其中行走”的行为隐喻；按原文保留单数称呼。
- source_word: וּבִעַרְתָּ הָרָע מִקִּרְבֶּךָ
  choice: 因此，你要除掉你中间的恶
  rationale: 这是申命记反复出现的法律公式；“除掉”表达彻底清除，“恶”则保留原文可能指恶事或作恶者的简练与张力。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；“雅威”以现代汉语音译呈现盟约之名，并与所给咨询层的处理一致。
- issue: סָרָה的盟约含义
  choice: 背叛
  alternative: 叛离；悖逆
  rationale: “背叛”清楚表达反对雅威及背弃盟约忠诚的性质，又不把该词收窄为后世某一特定宗教罪名。
- issue: הָרָע所指
  choice: 恶
  alternative: 恶人；恶事
  rationale: 希伯来文名词化形容词可指恶本身，也可能在当前司法语境中指作恶者；译作“恶”保留这种张力，不擅自消解。
- issue: 第二人称单复数转换
  choice: 按原文先用“你们”，后用“你”
  alternative: 全节统一译作“你们”
  rationale: 原文从群体复数转为代表群体中每个人的单数称呼；现代汉语虽略显突转，但仍可理解，并能保留申命记话语的修辞特点。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。法律判词用“必须被处死”，明确司法语境；保留“道”“救赎”“除掉……的恶”等申命记核心措辞。标点分开判决、救赎根据与犯罪目的，使长句适合普通读者阅读。
