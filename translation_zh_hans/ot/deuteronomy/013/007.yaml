source:
  edition: WLC
  text: כִּ֣י יְסִֽיתְ/ךָ֡ אָחִ֣י/ךָ בֶן אִ֠מֶּ/ךָ אֽוֹ בִנְ/ךָ֨ אֽוֹ בִתְּ/ךָ֜ א֣וֹ אֵ֣שֶׁת חֵיקֶ֗/ךָ א֧וֹ רֵֽעֲ/ךָ֛ אֲשֶׁ֥ר כְּ/נַפְשְׁ/ךָ֖ בַּ/סֵּ֣תֶר לֵ/אמֹ֑ר נֵֽלְכָ֗ה וְ/נַֽעַבְדָה֙ אֱלֹהִ֣ים אֲחֵרִ֔ים אֲשֶׁר֙ לֹ֣א יָדַ֔עְתָּ אַתָּ֖ה וַ/אֲבֹתֶֽי/ךָ־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/007.yaml
  text: If your brother[a], the son of your mother, or your son or your daughter, or the wife of your embrace, or your friend who is like your own soul, secretly entices you, saying[b], ‘Let us go and serve other gods’—gods that neither you nor your fathers have known—
translation:
  language: zh_hans
  text: 如果你的兄弟，就是你母亲的儿子，或你的儿子、女儿，或你怀中的妻子[a]，或与你自己的性命一样亲近的朋友[b]，暗中引诱你说：“我们去事奉别的神吧！”——这些神是你和你的祖先都不认识的——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“你怀里的妻子”，指与自己最亲密的妻子。
    reason: lexical_alternative
  - marker: b
    text: 或译“如同你自己一样的朋友”；“性命／魂”在这里强调极其亲密、视同自身的关系。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְסִיתְךָ
  choice: 引诱你
  rationale: 使役形动词在此表示诱使、怂恿某人采取背离上主的行动；“引诱”自然保留其诱导意味，而“暗中”另译出 בַּסֵּתֶר。
- source_word: אָחִיךָ בֶן אִמֶּךָ
  choice: 你的兄弟，就是你母亲的儿子
  rationale: 保留希伯来文的同位说明，突出至亲关系，不笼统简化为“亲兄弟”。
- source_word: אֵשֶׁת חֵיקֶךָ
  choice: 你怀中的妻子
  rationale: חֵיק 可指胸怀、怀抱；这一表达既保留亲密意象，也符合现代汉语的庄重表达。
- source_word: רֵעֲךָ אֲשֶׁר כְּנַפְשְׁךָ
  choice: 像你自己的性命一样的朋友
  rationale: נֶפֶשׁ 在此强调与自己生命一般珍贵、亲近；译作“性命”比抽象的“灵魂”更符合此处关系语境，同时在脚注保留另一种直译可能。
- source_word: בַּסֵּתֶר
  choice: 暗中
  rationale: 准确表达“在隐秘处、秘密地”，并作为状语自然修饰“引诱”。
- source_word: נֵלְכָה וְנַעַבְדָה
  choice: 我们去事奉……吧
  rationale: 两个鼓励式动词表达共同参与的提议；“吧”传达劝诱语气，“事奉”保留 עבד 对神明所作服事的较宽含义。
- source_word: אֱלֹהִים אֲחֵרִים
  choice: 别的神
  rationale: אֲחֵרִים 的直接含义是“别的、其他的”，不增译为“外邦的”。
- source_word: אֲשֶׁר לֹא יָדַעְתָּ אַתָּה וַאֲבֹתֶיךָ
  choice: 这些神是你和你的祖先都不认识的
  rationale: “认识”保留 ידע 在此既可指有所认识、也可含宗教承认或经验性关系的语义张力；不把它解释性窄化为“没有敬拜过”。
theological_decisions:
- issue: 如何表达最亲近的人际关系而不削弱经文的警告力度
  choice: 保留“你母亲的儿子”“你怀中的妻子”和“像你自己的性命一样的朋友”等具体意象。
  alternative: 概括译为“亲兄弟”“爱妻”“挚友”。
  rationale: 原文逐层列出至亲，以突出即便诱惑来自最亲近的人也不可听从；保留意象可维持其修辞与神学张力。
- issue: עבד 用于别神时的译法
  choice: 事奉
  alternative: 敬拜
  rationale: “事奉”既可包含敬拜，也保留服事、效忠神明的较宽词义，不把原文限缩为礼仪行为。
- issue: “不认识”别神的含义
  choice: 不认识
  alternative: 从未敬拜或承认
  rationale: 原文 ידע 本身允许一般认知与关系性认识的意味；直译可避免擅自判定其唯一神学内涵。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“事奉”保留宗教语境中的传统可懂用法；句末破折号表明本节语意延续至下文。
