  rationale: 修订使三项查证行为在现代汉语中更有区分，并以“真实确凿”保留原文法律确认公式的双重强调。保留“看哪”、第二人称“你”、完成意义“已经”及句末逗号，以对应原文语气并反映该节与下一节相连。
