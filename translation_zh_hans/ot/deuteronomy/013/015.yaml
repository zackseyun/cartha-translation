  naturalness: “查问、调查，仔细询问”语义重复较多，其中“查问”与“仔细询问”几近同义，读来不够自然。改为“查究、考察，并仔细询问”既较符合现代庄重法律语体，也较清楚呈现原文累积的查证动作。
  terminology: “可憎之事”适当传达 תּוֹעֵבָה 的强烈贬义而不附加解释；“在你中间”保留原文对以色列共同体的第二人称集体指向。
