  text: וְ/דָרַשְׁתָּ֧ וְ/חָקַרְתָּ֧ וְ/שָׁאַלְתָּ֖ הֵיטֵ֑ב וְ/הִנֵּ֤ה אֱמֶת֙ נָכ֣וֹן הַ/דָּבָ֔ר נֶעֶשְׂתָ֛ה הַ/תּוֹעֵבָ֥ה הַ/זֹּ֖את בְּ/קִרְבֶּֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/015.yaml
  text: and you shall investigate[a], and search out, and inquire thoroughly; and behold, if it is true and certain that this abomination has been done in your midst,
translation:
  language: zh_hans
  text: 你要查究、考察，并仔细询问；看哪，若这事真实确凿，这可憎之事已经在你中间发生，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְדָרַשְׁתָּ
  choice: 查问
  rationale: 在法律语境中表示着手查究、询问；“查问”既保留司法调查色彩，也与后续动词形成累积。
- source_word: וְחָקַרְתָּ
  choice: 调查
  rationale: חקר强调深入考察和查明；“调查”在现代汉语中自然，并加强前一动词的力度。
- source_word: וְשָׁאַלְתָּ הֵיטֵב
  choice: 仔细询问
  rationale: שאל是询问，הֵיטֵב在此作加强语，表示认真、周详；合译为“仔细询问”清楚自然。
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留提示调查结果或引出所发现事实的话语标记，也维持经文庄重语体。
- source_word: אֱמֶת נָכוֹן הַדָּבָר
  choice: 这事确实是真的
  rationale: 该确认公式表明受查之事真实且已经得到确证；“确实是真的”保留 אמת 与 נכון 的双重确认，同时符合现代汉语表达。
- source_word: נֶעֶשְׂתָה
  choice: 已经发生
  rationale: 此处指可憎之事已经在群体中出现；“发生”较“被行了”自然，同时表达完成的事实。
- source_word: הַתּוֹעֵבָה הַזֹּאת
  choice: 这可憎之事
  rationale: תועבה表示在盟约与宗教伦理意义上令人憎恶之事；“可憎之事”庄重而不额外引入教派性解释。
- source_word: בְּקִרְבֶּךָ
  choice: 在你中间
  rationale: 指事情发生在以色列共同体内部；“在你中间”贴近原文第二人称单数的集体指向。
theological_decisions:
- issue: 司法查证公式
  choice: 将三个调查动词依次译出，并把结论译作“若这事确实是真的”
  alternative: 若传言属实，这事已经证实
  rationale: 原文先累积三个查究动作，再以 אמת、נכון 确认事实。所选译法保留法律程序的严肃性和双重确认，也不把 הַדָּבָר 限定为未经明说的“传言”。
translation_notes:
  register: 采用现代、庄重而易懂的法律叙述语体。保留“看哪”作为原文话语标记；三个近义调查动词不合并，以呈现原文刻意累积的审慎查证过程。句末逗号反映本节在上下文中通向后续处置条款。
