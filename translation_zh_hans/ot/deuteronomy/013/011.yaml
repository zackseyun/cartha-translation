base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/011.yaml
  text: You shall stone him with stones[a], and he shall die, because he sought to drive you away from Yahweh your God, who brought you out from the land of Egypt[b], out of the house of slavery.
translation:
  language: zh_hans
  text: 你要用石头打死他，因为他企图使你离开耶和华你的上帝[a]；耶和华曾把你从埃及地、从为奴之家领出来[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “使你离开”也可译作“使你偏离”或“引诱你背离”。
    reason: לְהַדִּיחֲךָ的使役含义可侧重驱离、引偏或诱使背离，原文未明确限定具体手段。
  - marker: b
    text: “为奴之家”是希伯来文的固定表达，指以色列人在埃及受奴役之地，并使人想起上帝领他们出埃及的拯救。
    reason: 说明这一立约性历史公式的文化和语篇意义。
lexical_decisions:
- source_word: וּסְקַלְתּוֹ בָאֲבָנִים וָמֵת
  choice: 你要用石头打死他
  rationale: 希伯来文依次表达“用石头打他”和“他就死去”，在现代汉语中合译为“用石头打死”既保留司法处决的方式与结果，也避免生硬重复。
- source_word: כִּי בִקֵּשׁ
  choice: 因为他企图
  rationale: כִּי引出判决理由；בִקֵּשׁ在此表示有意图并试图实施，而非仅仅“寻找”，故译为“企图”。
- source_word: לְהַדִּיחֲךָ מֵעַל
  choice: 使你离开
  rationale: נדח的使役式表示使人偏离、被赶离或被引离；结合מֵעַל，这里指使人背离对上帝的忠诚。“使你离开”保留其宽泛力度，不限定为诱骗或强迫。
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: 耶和华你的上帝
  rationale: 以中文通行的专名“耶和华”呈现四字神名，并保留“你的上帝”所表达的立约关系。
- source_word: הַמּוֹצִיאֲךָ
  choice: 曾把你……领出来
  rationale: 分词在此以历史性拯救行动描述耶和华；“曾……领出来”在现代汉语中清楚表明所指为出埃及事件。
- source_word: מֵאֶרֶץ מִצְרַיִם מִבֵּית עֲבָדִים
  choice: 从埃及地、从为奴之家
  rationale: 保留两个并列的מִן短语及“家”的比喻性表达；“为奴之家”自然且能传达埃及是受奴役之地。
theological_decisions:
- issue: 四字神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: “耶和华”是现代中文圣经语境中最易识别的神名形式；采用专名而非“主”，保留原文对以色列之上帝立约名字的直接使用。
- issue: לְהַדִּיחֲךָ מֵעַל所表达的背约行动
  choice: 使你离开耶和华
  alternative: 引诱你背离耶和华／使你偏离耶和华
  rationale: 原文可以涵盖驱离、引偏和诱使背离；正文采用较宽泛的“使你离开”，脚注列出其他可能译法，避免把行为方式限定得过窄。
- issue: 出埃及称谓“为奴之家”
  choice: 保留立约公式的形象表达
  alternative: 奴役之地
  rationale: “为奴之家”保留原文בית的意象和申命记反复出现的救赎公式，同时仍能被现代读者理解。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“你要”维持法律训令语气；“用石头打死”自然呈现处决方式及结果；分号凸显耶和华救赎行动是所要求忠诚的背景。
