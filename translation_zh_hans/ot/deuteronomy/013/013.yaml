  text: כִּֽי תִשְׁמַ֞ע בְּ/אַחַ֣ת עָרֶ֗י/ךָ אֲשֶׁר֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ נֹתֵ֥ן לְ/ךָ֛ לָ/שֶׁ֥בֶת שָׁ֖ם לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/013.yaml
  text: If you hear it said in one of your cities that Yahweh your God is giving you to dwell there[a], saying[b],
translation:
  language: zh_hans
  text: 如果[a]你听说，在雅威你的上帝赐给你居住[b]的众城中的一座城里，有人说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“当你听说”。希伯来语连词在法律条文中既可引出条件，也可引出时间情形。
    reason: 保留 כִּי 在此可能具有的条件性或时间性。
  - marker: b
    text: “居住”也可译作“定居”。
    reason: 说明 לָשֶׁבֶת 在此既可泛指居住，也可侧重安顿下来。
lexical_decisions:
- source_word: כִּי
  choice: 如果
  rationale: 在这段法律案例中引出假设情形；“如果”自然地开启延续到下文的条件句，同时以脚注保留也可作时间性理解的可能。
- source_word: תִשְׁמַע
  choice: 你听说
  rationale: 此处指听到消息或传闻，而非顺从或专心聆听；“听说”最符合现代汉语语境。
- source_word: בְּאַחַת עָרֶיךָ
  choice: 在……的一座城里
  rationale: עִיר 可指城或城镇；“一座城”简洁自然，并保留“你众城中的一座”这一范围关系。
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: 雅威你的上帝
  rationale: 将四字神名按其通常重构的读音译为“雅威”，而不以头衔替代；“你的上帝”保留第二人称单数的盟约性称呼。
- source_word: נֹתֵן לְךָ
  choice: 赐给你
  rationale: 分词描述雅威把城赐予以色列人这一行动；汉语用“赐给”自然表达神的授予，不必机械标示进行体。
- source_word: לָשֶׁבֶת שָׁם
  choice: 居住
  rationale: 在此表达赐城的目的，即让受话者在那里居住；“居住”兼顾正式感与现代可读性。
- source_word: לֵאמֹר
  choice: 有人说：
  rationale: 该词引出下一节所报告的话。汉语补出泛指主语“有人”，使“你听说……有人说”通顺，并用冒号保留引语的前向衔接。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文使用神的专名而非“主”这一头衔。“雅威”较直接反映学界通常重构的读音，也避免以替代称谓消解专名。
translation_notes:
  register: 采用现代、庄重而易懂的法律叙事语体。“听说……有人说”符合汉语报告传闻并引出下文的习惯；保留第二人称单数，以维持原文对以色列整体作单数称呼的形式。
