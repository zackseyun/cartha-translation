  text: לֹא תֹאבֶ֣ה ל֔/וֹ וְ/לֹ֥א תִשְׁמַ֖ע אֵלָ֑י/ו וְ/לֹא תָח֤וֹס עֵֽינְ/ךָ֙ עָלָ֔י/ו וְ/לֹֽא תַחְמֹ֥ל וְ/לֹֽא תְכַסֶּ֖ה עָלָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/009.yaml
  text: You shall not yield to him or listen to him[a], and your eye shall not pity him, and you shall not spare[c][b], and you shall not conceal him.
translation:
  language: zh_hans
  text: 你不可依从他，也不可听从他[a]；你不可顾惜他，不可怜悯他，也不可包庇他[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “依从”也可译作“同意”或“顺从”；“听从”也含“理会”的意思。
    reason: lexical_alternative
  - marker: b
    text: “包庇”原文有“遮盖、隐藏”的意思，可指隐藏他或隐瞒他的罪行。
    reason: lexical_alternative
lexical_decisions:
- source_word: תֹאבֶה לוֹ
  choice: 依从他
  rationale: אָבָה在此表示愿意、同意或顺从诱劝；“依从他”自然表达不可向其劝诱让步，同时没有过度解释为已经服从。
- source_word: תִשְׁמַע אֵלָיו
  choice: 听从他
  rationale: שׁמע与אֶל连用可指听取、理会；“听从”在现代汉语中保留回应其劝诱的意味，而不只是听见声音。
- source_word: תָחוֹס עֵינְךָ עָלָיו
  choice: 顾惜他
  rationale: 原文直译为“你的眼不可顾惜他”，是表示怜惜、不忍处置的希伯来语表达；正文用自然汉语“顾惜他”，脚注保留原文意象。
- source_word: תַחְמֹל
  choice: 怜悯他
  rationale: חמל可表示怜悯或因同情而饶过；译作“怜悯”与前面的“顾惜”有所区分，并保留禁令的累加强度。
- source_word: תְכַסֶּה עָלָיו
  choice: 包庇他
  rationale: כסה的Piel形式在此有遮掩、隐藏之意；“包庇他”符合司法语境，可涵盖隐瞒其人或其罪行，但不把具体方式说死。
theological_decisions:
- issue: 对引诱人背离盟约者的严厉司法措辞
  choice: 保留连续、直接的五项禁令，不予弱化。
  alternative: 概括为“不要赞同或保护他”，或仅表达情感上的疏离。
  rationale: 希伯来文以重复的לֹא形成逐层推进的禁令，要求听者不可依从、理会、顾惜、怜悯或包庇引诱者。译文保持这种严肃性，又不在本节内添加执行方式或后续刑罚。
translation_notes:
  register: 采用现代、庄重而易懂的法律劝诫语体。以分号保留前两项与后三项禁令的节奏；将希伯来语“你的眼不可顾惜他”自然化为“你不可顾惜他”，并以词汇说明保留其原文依据。
