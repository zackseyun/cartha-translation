  naturalness: “在你中间”若直接以单数“你”指称“以色列众人”，在现代汉语中不够自然，且可能被误解为对某一人的称呼。正文采用“你们中间”更合乎现代标准汉语，脚注交代原文的集体单数。
  terminology: “全以色列”“听见而惧怕”“行这样的恶事”庄重、清楚，适合律法文本。“行……恶事”比“做……恶事”更贴合此处对行为的法律性描述。
