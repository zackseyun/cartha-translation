  yaml_path: translation/ot/deuteronomy/013/012.yaml
  text: And all Israel shall hear and fear[a], and they shall not again do this evil thing in your midst.
translation:
  language: zh_hans
  text: 全以色列都必听见而惧怕；他们就不再在你们中间行这样的恶事。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“在你中间”。希伯来语以单数“你”称呼作为一个整体的以色列民。
    reason: 说明原文对以色列所用的集体单数称呼，并交代正文采用复数“你们”以符合现代汉语表达。
lexical_decisions:
- source_word: וְכָל יִשְׂרָאֵל
  choice: 以色列众人
  rationale: כָּל与专名“以色列”连用，指全体以色列民；“以色列众人”自然表达这一整体范围。
- source_word: יִשְׁמְעוּ
  choice: 都要听见
  rationale: 该未完成式在律法语境中带有预期结果的意味；“要听见”保留庄重的法律语气，“都”与“众人”呼应。
- source_word: וְיִרָאוּן
  choice: 并且惧怕
  rationale: ירא在此指因听见刑罚而生畏惧，从而受到警戒；“惧怕”既保留原文力度，也不把含义限缩为单纯的惊恐。
- source_word: וְלֹא יוֹסִפוּ לַעֲשׂוֹת
  choice: 就不再……做
  rationale: יסף的使役式与不定式连用，常表示“再做、继续做”；本处重在防止同类恶行重演。
- source_word: כַּדָּבָר הָרָע הַזֶּה
  choice: 这样的恶事
  rationale: דָּבָר在此指前文所述的行为或事件，而非言语；“这样的恶事”自然地指向同类罪行。
- source_word: בְּקִרְבֶּךָ
  choice: 在你中间
  rationale: 字面为“在你中间”，第二人称单数把以色列作为一个整体来称呼；正文保留这一集体单数，并以脚注说明。
theological_decisions:
- issue: 盟约 خطاب中第二人称单数的表达
  choice: 保留“在你中间”这一集体单数
  alternative: 译作较自然的复数“在你们中间”
  rationale: 希伯来语后缀为阳性单数，体现申命记把以色列全体作为一个整体直接称呼的方式。保留单数可呈现原文的盟约性整体观，同时用脚注避免读者误解。
- issue: “听见、惧怕”与“不再作恶”之间的关系
  choice: 用“就”表达所预期的警戒结果
  alternative: 仅以“并且”并列各分句
  rationale: 语境表明公开施行刑罚使全体以色列听见并畏惧，进而不再犯同类恶行；“就”呈现这种结果关系，但不额外加入原文没有的教义解释。
translation_notes:
  register: 采用现代、庄重而易懂的律法语体。“惧怕”保留原文的警戒力度；“在你中间”略带源语言色彩，借脚注说明其集体单数用法。
