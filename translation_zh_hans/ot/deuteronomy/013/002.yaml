base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/002.yaml
  text: If a prophet or a dreamer of dreams arises among you and gives you a sign or a wonder,[a]
translation:
  language: zh_hans
  text: 如果你们中间出现先知或做梦的人，给你显出征兆或奇事[a]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “征兆或奇事”也可译作“征兆或预兆”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 如果
  rationale: 在这一律法案例中引出条件句，且条件延续到下一节；译为“如果”最自然。
- source_word: יָקוּם
  choice: 出现
  rationale: 此处指这样的人在群体中兴起或现身；“出现”符合现代汉语，也不暗示其权威已获认可。
- source_word: בְּקִרְבְּךָ
  choice: 你们中间
  rationale: 表达群体内部的处境；希伯来语虽用单数第二人称，中文以“你们”自然地指以色列共同体。
- source_word: נָבִיא
  choice: 先知
  rationale: 这是该词标准且清楚的对应词。
- source_word: חֹלֵם חֲלוֹם
  choice: 做梦的人
  rationale: 希伯来语直译近于“做梦者”；中文“做梦的人”自然易懂，并保留其与“先知”的区分。
- source_word: וְנָתַן אֵלֶיךָ
  choice: 给你显出
  rationale: נָתַן 基本义为“给”，但与“神迹或奇事”搭配时，“给你显出”在中文中更自然，并保留其向听者提供征兆的意思。
- source_word: אוֹת
  choice: 神迹
  rationale: 该词指具有指示或证实作用的征兆；在此与 מוֹפֵת 配对，“神迹”是中文圣经语境中清楚而庄重的表达，但不必然判定其来源。
- source_word: מוֹפֵת
  choice: 奇事
  rationale: 该词指令人惊异的现象或预兆；“奇事”与“神迹”构成自然配对，同时不额外断定它必属真正的神能。
theological_decisions:
- issue: 假先知或做梦者所给征兆的性质
  choice: 译作“神迹或奇事”，不在正文中判断其是真正的超自然现象、欺骗，还是仅由此人宣称的征兆。
  alternative: 征兆或异象；神奇的征兆或奇事
  rationale: 本节只说此人给出 אוֹת 或 מוֹפֵת，尚未说明其来源与性质。译文应保留这种神学张力，不先行裁断。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“你们中间”体现共同体语境；句末用逗号，因为本节是延续至下一节的条件从句。
