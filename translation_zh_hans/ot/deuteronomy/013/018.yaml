revisions:
- from: 不可让任何当毁灭之物粘在你手上[a]，好使雅威转离他的烈怒[b]，向你施怜悯，怜恤你，使你人数增多，正如他向你列祖所起的誓。
  to: 一点被定为毁灭之物也不可留在你手中[a]，好使雅威转离他的烈怒[b]，向你施怜悯，怜恤你，使你增多，正如他向你列祖所起的誓。
  rationale: 修订仅改善首句中ḥērem的中文术语和禁令表达，并将“人数增多”简化为更贴近使役动词רבה、且在圣约语境中自然的“使你增多”。其余措辞保持原译对原文结构、神名和修辞重复的忠实处理。脚注锚点仍分别对应ḥērem和“烈怒”。
