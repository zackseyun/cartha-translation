source:
  edition: WLC
  text: וְ/לֹֽא יִדְבַּ֧ק בְּ/יָדְ/ךָ֛ מְא֖וּמָה מִן הַ/חֵ֑רֶם לְמַעַן֩ יָשׁ֨וּב יְהוָ֜ה מֵ/חֲר֣וֹן אַפּ֗/וֹ וְ/נָֽתַן לְ/ךָ֤ רַחֲמִים֙ וְ/רִֽחַמְ/ךָ֣ וְ/הִרְבֶּ֔/ךָ כַּ/אֲשֶׁ֥ר נִשְׁבַּ֖ע לַ/אֲבֹתֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/018.yaml
  text: And nothing from what is devoted to destruction shall cling to your hand[a], so that Yahweh may turn from the fierceness of his anger and show you mercy, and have compassion on you, and multiply you[b], just as he swore to your fathers.
translation:
  language: zh_hans
  text: 一点被定为毁灭之物也不可留在你手中[a]，好使雅威转离他的烈怒[b]，向你施怜悯，怜恤你，使你增多，正如他向你列祖所起的誓。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “被定为毁灭之物”也可译作“当灭之物”或“被禁之物”。希伯来语חֵרֶם指不可撤回地归给上帝之物；在这里，这些东西须予毁灭。
    reason: lexical_alternative
  - marker: b
    text: “烈怒”原文直译为“鼻中怒气的炽热”，是表示强烈愤怒的希伯来语习语。
    reason: cultural_note
lexical_decisions:
- source_word: יִדְבַּק בְּיָדְךָ
  choice: 粘在你手上
  rationale: 保留דבק“粘住、附着”的具体意象；与“手”连用也表达占有、私留之意。
- source_word: מְאוּמָה
  choice: 任何……之物
  rationale: 该词在否定句中表示“任何东西都不”，完整传达禁令的绝对性。
- source_word: הַחֵרֶם
  choice: 当毁灭之物
  rationale: חֵרֶם指不可撤回地归给上帝、在本语境中须予毁灭的东西；正文清楚表达毁灭含义，脚注补充其“归献”背景。
- source_word: יָשׁוּב יְהוָה מֵחֲרוֹן אַפּוֹ
  choice: 雅威转离他的烈怒
  rationale: שׁוּב מִן表示“从……转离”；“烈怒”自然传达חֲרוֹן אַף所表达的炽烈愤怒，同时不把希伯来语身体意象机械直译为“鼻子”。
- source_word: וְנָתַן לְךָ רַחֲמִים
  choice: 向你施怜悯
  rationale: 按现代汉语自然表达נתן与רַחֲמִים的搭配，指雅威把怜悯施予百姓。
- source_word: וְרִחַמְךָ
  choice: 怜恤你
  rationale: 与前面的名词“怜悯”保持近义复现而不完全重复，体现希伯来文的强化效果。
- source_word: וְהִרְבֶּךָ
  choice: 使你人数增多
  rationale: 明确רבה使役式在这里指使百姓繁多，并保留其与列祖之约及后裔应许的联系。
- source_word: לַאֲבֹתֶיךָ
  choice: 向你列祖
  rationale: 此处特指承受圣约应许的先祖；“列祖”在庄重而易懂的现代圣经语体中准确简洁。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”对应YHWH通常重建的读音，并保留其作为圣约之名的性质。
- issue: חֵרֶם的圣约战争含义
  choice: 当毁灭之物
  alternative: 当灭之物／被禁之物
  rationale: 本节语境要求这些东西被彻底毁灭；此译法不淡化其严肃性，也借脚注说明它们先是不可撤回地归给上帝，避免把该词仅理解为一般禁物。
- issue: 上帝烈怒的拟人性表达
  choice: 转离他的烈怒
  alternative: 息怒／转离他鼻中的怒火
  rationale: 保留上帝亲自发怒并转离烈怒的关系性和圣约性张力，不将其抽象化；同时以自然汉语表达希伯来语“鼻子发热”的身体习语。
- issue: רַחֲמִים与רחם的近义连续
  choice: 施怜悯，怜恤你
  alternative: 怜悯你，怜悯你
  rationale: 保留名词与动词连续出现所形成的强调，又避免现代汉语中生硬的完全重复。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“粘在你手上”保留原文具体意象，同时让读者理解为不可私留；“列祖”保持圣约语境的历史指向。
