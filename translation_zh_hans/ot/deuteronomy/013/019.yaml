base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/019.yaml
  text: if you listen to the voice of Yahweh your God, to keep all his commandments that I am commanding you today, to do what is right in the eyes of Yahweh your God.
translation:
  language: zh_hans
  text: 如果你听从耶和华你的上帝的话，谨守他的一切诫命，就是我今日吩咐你的，去行在耶和华你的上帝眼中看为正的事。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: 如果
  rationale: 这里引出前文应许得以实现的条件；译作“如果”符合上下文和现代汉语表达。
- source_word: תִשְׁמַע בְּקוֹל
  choice: 听从……的话
  rationale: 希伯来语习语兼有聆听与顺服之意。“听从……的话”在自然汉语中保留言说层面，也清楚传达顺服含义。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的专名“耶和华”直接呈现四字神名，而不以称号代替。
- source_word: אֱלֹהֶיךָ
  choice: 你上帝
  rationale: 准确保留第二人称单数所属关系及盟约语境中的称谓。
- source_word: לִשְׁמֹר
  choice: 谨守
  rationale: 表达认真持守并遵行诫命的意思，是现代中文圣经法律语境中自然而庄重的用语。
- source_word: כָּל מִצְוֺתָיו
  choice: 他的一切诫命
  rationale: 明确保留“他”“一切”及诫命的法律—盟约意义。
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: 就是我今天吩咐你的
  rationale: “就是”使关系从句在汉语中自然地回指“一切诫命”；“今天吩咐”保留当前讲话行为。
- source_word: לַעֲשׂוֹת הַיָּשָׁר
  choice: 行……看为正的事
  rationale: “行”对应实际践行，“看为正的事”保留 יָשָׁר 的伦理判断含义。
- source_word: בְּעֵינֵי
  choice: 眼中看为
  rationale: 既保留希伯来语“在……眼中”的评价意象，也使整句符合现代汉语习惯。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名，因此采用中文传统且广为人知的专名“耶和华”，不以“主”等称号替代；“雅威”是反映常见学术拟音的可行替代译法。
- issue: שׁמע בקול 中聆听与顺服的关系
  choice: 听从……的话
  alternative: 听……的声音
  rationale: “听从”没有把表达缩减为抽象的“服从”，同时在现代汉语中自然体现听见后遵行的盟约要求。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。保留原文条件句结构，并用“谨守”“诫命”等适合申命记盟约律法语境的词语；不添加原文没有的解释。
