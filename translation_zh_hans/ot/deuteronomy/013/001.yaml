base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/001.yaml
  text: Every word that I am commanding you[a], you shall be careful to do. You shall not add to it[b], and you shall not take away from it.
translation:
  language: zh_hans
  text: 我所吩咐你们的一切话[a]，你们都要谨慎遵行；不可在其中加添[b]，也不可从中删减。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文“话”是集合性单数，直译可作“这一切话”。
    reason: lexical_alternative
  - marker: b
    text: 在部分译本所采用的经文编号中，本节列为申命记12:32。
    reason: versification
lexical_decisions:
- source_word: כָּל הַדָּבָר
  choice: 一切话
  rationale: דָּבָר在原文中是集合性单数；汉语“话”本身不强制标明单复数，“一切话”既自然，也保留整全范围，不把它具体化为原文未明说的“诫命”。
- source_word: מְצַוֶּה
  choice: 所吩咐
  rationale: 分词表达正在颁布、持续有效的吩咐；现代汉语关系结构中用“所吩咐”最自然，并由上下文保留其当下权威。
- source_word: תִשְׁמְרוּ לַעֲשׂוֹת
  choice: 要谨慎遵行
  rationale: שׁמר加不定式表示留意、谨守以实行；“谨慎遵行”兼顾审慎看守与实际履行，且符合庄重的现代汉语。
- source_word: לֹא תֹסֵף עָלָיו
  choice: 不可在其中加添
  rationale: יסף与עַל表示在既有内容上增添；“在其中加添”自然地指回前述全部话语，并保留禁止语气。
- source_word: וְלֹא תִגְרַע מִמֶּנּוּ
  choice: 也不可从中删减
  rationale: גרע表示减少、削去；“从中删减”准确呈现与“加添”相对的法律性禁令。
- source_word: אָנֹכִי
  choice: 我
  rationale: 独立代词带有显明主语和一定强调；汉语“我所吩咐”已清楚表达说话者的权威，无需生硬译作“我亲自”。
theological_decisions:
- issue: 经文编号与上下文衔接
  choice: 将本节译为完整、独立的训令，不把下一节论假先知的内容引入正文。
  alternative: 按部分传统将本节编为申命记12:32，并在结构上更紧密连接前段。
  rationale: 希伯来文本本节自身构成完整禁令，同时也可作为后文法规的过渡；翻译应只呈现本节内容，并以脚注说明编号差异。
- issue: “话”的集合性单数
  choice: 正文用“一切话”，脚注说明原文为集合性单数。
  alternative: 译作“这一整番话”或概括为“一切命令”。
  rationale: “一切话”在现代汉语中自然且范围完整，又不把דָּבָר的含义缩窄为特定类别的命令；脚注保留原文形式信息。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“谨慎遵行”保留留心看守并付诸实行的双重含义；“加添／删减”形成清晰对称。所有脚注标记均置于正文相应位置。
