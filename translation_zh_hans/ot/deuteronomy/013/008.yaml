base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/008.yaml
  text: from the gods of the peoples that are around you[a], whether near to you or far from you, from one end of the earth to the other end of the earth—
translation:
  language: zh_hans
  text: 你们周围各族的神，无论离你近还是离你远，从大地的一端直到大地的另一端[a]——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “大地”也可译作“土地”。希伯来语 אֶרֶץ 可指大地或土地。
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵאֱלֹהֵי
  choice: 是……的神
  rationale: 本节承接上文列举受引诱去敬拜的神；מִן在此引出这些神所属的范围。汉语以“是……的神”自然承接未完句，同时保留其来源或归属关系。
- source_word: הָעַמִּים
  choice: 各族
  rationale: עַמִּים指多个族群；“各族”比“各国”更能保留其族群性的集体含义，也符合现代汉语表达。
- source_word: אֲשֶׁר סְבִיבֹתֵיכֶם
  choice: 你们周围
  rationale: 简洁表达סְבִיבֹת的空间关系，并直接修饰“各族”。
- source_word: הַקְּרֹבִים אֵלֶיךָ אוֹ הָרְחֹקִים מִמֶּךָּ
  choice: 无论离你近还是离你远
  rationale: 以自然的汉语对应“近／远”的对举，并保留希伯来文此处由复数对象转为单数第二人称“你”的形式。
- source_word: מִקְצֵה הָאָרֶץ וְעַד קְצֵה הָאָרֶץ
  choice: 从大地的一端直到大地的另一端
  rationale: 保留希伯来文首尾重复“大地的一端”的结构和“从……直到……”的范围表达；“大地”传达此处广阔、概括性的地理范围。
theological_decisions:
- issue: 结尾惯用语中הָאָרֶץ的范围
  choice: 大地
  alternative: 那地／这片土地
  rationale: אֶרֶץ既可指“大地”，也可指特定的“土地”。这里“从一端直到另一端”的修辞强调尽可能广阔的范围，因此正文采用“大地”，同时以脚注保留“土地”的可能读法，避免把语义范围绝对化。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。本节是承接上文的未完句，因此以“是”起首，并以破折号收尾；保留原文单复数人称的变化及“近／远”“一端／另一端”的平行结构。
