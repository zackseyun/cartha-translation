base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/016.yaml
  text: You shall surely strike the inhabitants of that city with the edge of the sword[a], devoting it to destruction, along with all that is in it and its livestock[b], with the edge of the sword.
translation:
  language: zh_hans
  text: 你务要用刀剑击杀[b]那城的居民；要把那城、城中的一切和其中的牲畜，全都彻底毁灭[a]，用刀剑毁灭[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“置于禁毁之下”或“献作毁灭”。希伯来语动词表示把某物不可撤回地献出，归于毁灭。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“按刀剑之口”，是指用刀剑击杀或毁灭的惯用语。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֵּה תַכֶּה
  choice: 务要……杀尽
  rationale: 动词不定式绝对式与未完成式连用，加强命令语气。“务要”体现强调；结合“用刀”及全句的毁灭语境，以“杀尽”表达这里致命击杀的含义。
- source_word: יֹשְׁבֵי הָעִיר הַהוּא
  choice: 那城的居民
  rationale: 准确表达分词“居住者、居民”，用现代汉语自然简明的说法。
- source_word: לְפִי חָרֶב
  choice: 用刀
  rationale: 这是字面为“在刀剑之口”的希伯来语惯用语，意为用刀剑击杀。“用刀”在现代汉语中清楚自然；原文两次出现，译文也予以重复。
- source_word: הַחֲרֵם
  choice: 献作毁灭
  rationale: Hiphil形式表示把某物置于ḥerem之下，即不可撤回地献出并毁灭。“献作毁灭”兼顾其祭献性或禁毁性的色彩与实际毁灭的结果，不把它简化为一般军事上的摧毁。
- source_word: אֹתָהּ
  choice: 那城
  rationale: 阴性单数代词回指“城”；汉语重复所指比使用“它”更清楚。
- source_word: וְאֶת כָּל אֲשֶׁר בָּהּ
  choice: 和城里的一切
  rationale: 保留范围扩展至城中一切所有之物的含义，措辞简洁自然。
- source_word: בְּהֶמְתָּהּ
  choice: 城里的牲畜
  rationale: בְּהֵמָה在此集合性地指家畜；“牲畜”比“牛”范围更准确，也比泛称“动物”更贴近词义。
theological_decisions:
- issue: 战争与审判语境中חרם的译法
  choice: 献作毁灭
  alternative: 彻底毁灭；置于禁毁之下
  rationale: 此词既指完全毁灭，也带有不可撤回地献出、归于禁毁的特殊含义。正文保留这种神圣禁毁与实际毁灭之间的张力，脚注说明其他可能译法。
- issue: 是否弱化严厉的审判语言
  choice: 完整保留“杀尽”和毁灭命令的力度
  alternative: 改译为较缓和的“击败”或一般性的“摧毁”
  rationale: 原文明确命令以刀击杀居民，并将全城所有置于毁灭之下；译文不作原文没有依据的缓和。
translation_notes:
  register: 采用庄重而通俗的现代标准汉语。“务要”保留原文加强命令的语气；分号呈现先击杀居民、再将全城及其中一切献作毁灭的结构。原文“用刀”前后重复，译文照样保留，以维持强调和范围。
