  text: וְ/אֶת כָּל שְׁלָלָ֗/הּ תִּקְבֹּץ֮ אֶל תּ֣וֹךְ רְחֹבָ/הּ֒ וְ/שָׂרַפְתָּ֨ בָ/אֵ֜שׁ אֶת הָ/עִ֤יר וְ/אֶת כָּל שְׁלָלָ/הּ֙ כָּלִ֔יל לַ/יהוָ֖ה אֱלֹהֶ֑י/ךָ וְ/הָיְתָה֙ תֵּ֣ל עוֹלָ֔ם לֹ֥א תִבָּנֶ֖ה עֽוֹד־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/017.yaml
  text: You shall gather all its spoil into the middle of its open square[a], and you shall burn the city and all its spoil with fire as a whole offering to Yahweh your God. It shall remain a perpetual ruin mound[b]; it shall not be rebuilt again.
translation:
  language: zh_hans
  text: 你要把城里所有的战利品都收集到城中广场上；要用火把那城和其中所有的战利品全都焚烧，完全归给耶和华你的神。[a]那城要永远成为废墟土堆，[b]不可再重建。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “完全归给”也可译为“完全焚尽，归给耶和华你的神”。希伯来语כָּלִיל可作副词，意为“完全、全然”；也可带有把某物完全焚尽、归献给神的祭祀意味。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语直译“永远的土堆”或“永久的废墟堆”，指长久保持荒废的状态。
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁלָלָהּ
  choice: 城里／其中所有的战利品
  rationale: שָׁלָל指战争中掠取的财物；“战利品”在现代汉语中清楚、自然，也符合本节的战争法律语境。
- source_word: תִּקְבֹּץ
  choice: 你要……收集
  rationale: קבץ的Qal未完成式第二人称阳性单数在律法指令中表达命令；“你要收集”既保留指令语气，也符合现代汉语。
- source_word: אֶל תּוֹךְ רְחֹבָהּ
  choice: 到城中广场上
  rationale: רְחוֹב在城市语境中通常指宽阔的公共场所或广场，而非狭窄街道；“城中广场”自然传达其位置和公共空间性质。
- source_word: וְשָׂרַפְתָּ בָאֵשׁ
  choice: 并放火焚烧
  rationale: 希伯来语直译为“用火焚烧”；“放火焚烧”是自然、庄重的现代汉语，并完整表达以火毁灭。
- source_word: כָּלִיל
  choice: 全然献给
  rationale: כָּלִיל既可作副词表示“完全”，也可带有完全焚尽、奉献给神的祭祀意味。“全然献给”保留献呈意味，同时避免把城市直接称为技术意义上的动物燔祭。
- source_word: לַיהוָה
  choice: 给耶和华
  rationale: 介词ל表示归属、奉献的对象；专名יהוה译作“耶和华”，在中文中直接保留神名，与“全然献给”自然衔接。
- source_word: תֵּל עוֹלָם
  choice: 永远成为废墟土堆
  rationale: תֵּל是土堆、废墟堆，עוֹלָם在此表示长久持续；“废墟土堆”兼顾具体地貌形象和毁坏后的状态。
- source_word: לֹא תִבָּנֶה עוֹד
  choice: 不可再重建
  rationale: בנה的Nifal未完成式配合否定词和עוֹד，表示此后不得或不会被重建；“不可再重建”在律法语境中简洁有力。
theological_decisions:
- issue: כָּלִיל在焚城命令中的祭祀意味
  choice: 正文译作“把这一切全然献给耶和华你的神”
  alternative: “为耶和华你的神完全烧尽”或“作为全焚之祭献给耶和华你的神”
  rationale: 原词既可能强调彻底焚毁，也可能表示完全归献给神。正文以“全然献给”保留奉献和祭祀共鸣，又不把该城明确等同于利未记中技术性的燔祭；脚注说明另一种副词性理解，以保留原文歧义。
translation_notes:
  register: 采用现代、庄重而易懂的律法文体。以“战利品”“城中广场”“不可再重建”等常用表达保持清晰；“废墟土堆”保留希伯来语תֵּל的具体形象。所有脚注标记均置于正文相关语句之后。
