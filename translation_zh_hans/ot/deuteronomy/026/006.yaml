  yaml_path: translation/ot/deuteronomy/026/006.yaml
  text: And the Egyptians treated us badly and afflicted us[c][b][a], and laid hard labor on us.
translation:
  language: zh_hans
  text: 埃及人恶待我们[a]，苦害我们[b]，又把繁重的劳役加在我们身上[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “恶待我们”或译“苛待我们”。
    reason: lexical_alternative
  - marker: b
    text: “苦害我们”或译“压迫我们”。
    reason: lexical_alternative
  - marker: c
    text: “把繁重的劳役加在我们身上”或译“强迫我们做苦工”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּרֵעוּ אֹתָנוּ
  choice: 恶待我们
  rationale: רָעַע的使役形式在这里表示加害或恶劣地对待。“恶待”简洁自然，保留行为有害的含义，又不把具体方式说得过窄。
- source_word: הַמִּצְרִים
  choice: 埃及人
  rationale: 带定冠词的民族称谓，指在这段历史回顾中欺压以色列人的埃及人。
- source_word: וַיְעַנּוּנוּ
  choice: 苦害我们
  rationale: עָנָה的加强词干可指使人受苦、压迫或羞辱。“苦害”与前面的“恶待”有所区别，突出使人遭受痛苦，同时保留词义范围。
- source_word: וַיִּתְּנוּ עָלֵינוּ
  choice: 加在我们身上
  rationale: נָתַן עַל字面为“放在……之上”，在此表示把负担施加于人；“加在我们身上”既保留负担意象，也符合庄重的现代汉语表达。
- source_word: עֲבֹדָה קָשָׁה
  choice: 繁重的劳役
  rationale: עֲבֹדָה指劳动、服役或劳役，קָשָׁה指艰苦、严酷或沉重。“繁重的劳役”清楚传达其强制而难以承受的性质，但不额外加入原文未明说的细节。
theological_decisions:
- issue: 是否区分连续出现的三个欺压表述
  choice: 分别译作“恶待我们”“苦害我们”“把繁重的劳役加在我们身上”
  alternative: 把前两个动词合并为“欺压我们”，或在每一分句中都明确加入“奴役”一词
  rationale: 希伯来文用三个相关但并不相同的表述逐层叙述埃及人的压迫。分别翻译可保存原文的修辞推进，也避免加入各分句本身没有明说的内容。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“恶待—苦害—加上劳役”保留原文三重推进；“劳役”比单纯的“劳动”更能体现受支配的服役处境，同时没有超出上下文直接断言更多制度性细节。
