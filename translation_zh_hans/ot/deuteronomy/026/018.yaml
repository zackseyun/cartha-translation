base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/018.yaml
  text: And Yahweh has declared today that you are to be his treasured people[a], as he promised you[b], and that you are to keep all his commandments.
translation:
  language: zh_hans
  text: 耶和华今天也宣告：你要作他珍爱的子民[a]，正如他对你所说的[b]；你也要谨守他的一切诫命。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他所珍藏的产业”；希伯来文直译为“作子民，就是珍藏的产业”。
    reason: 保留סְגֻלָּה所含贵重、专属产业的意象，并显示עַם“子民”在原文中明确出现。
  - marker: b
    text: 或译：“正如他向你所应许的”。
    reason: דִּבֶּר直译为“说”，但在此立约语境中也可表达先前的应许。
lexical_decisions:
- source_word: וַיהוָה
  choice: 耶和华
  rationale: 以现代中文常用的音译呈现神的专名יהוה，既保留原文的专名性质，也符合庄重、清晰的经文语体。句首的וַ译作“也”，承接上一节以色列的宣告，并突出双方相应的立约宣告。
- source_word: הֶאֱמִירְךָ
  choice: 宣告，要你
  rationale: 这是申命记26:17–18中罕见的אמר使役形，在立约语境中具有正式确认或宣示的作用。“宣告，要你”既保留其施行性和后接不定式的结构，也不擅自扩大为“拣选”或“分别出来”。
- source_word: הַיּוֹם
  choice: 今天
  rationale: 直接表达原文的时间指示，保留立约行动在当下发生的迫切感。
- source_word: לִהְיוֹת לוֹ
  choice: 要你作他的
  rationale: 用“要你作”自然表达不定式所表示的身份确立及目的或结果，同时保留“归他”的关系含义。
- source_word: לְעַם סְגֻלָּה
  choice: 珍爱的子民
  rationale: עַם明确指“子民、人民”，סְגֻלָּה指贵重而专属的产业或珍藏。“珍爱的子民”兼顾群体身份和宝贵、专属的含义；脚注保留较贴近财产意象的译法。
- source_word: כַּאֲשֶׁר דִּבֶּר לָךְ
  choice: 正如他对你所说的
  rationale: דִּבֶּר的直接词义是“说、讲”。正文保留这种较宽的表达，不把立约语境中的话语直接解释为“应许”；脚注提示语境上可理解为应许。
- source_word: וְלִשְׁמֹר
  choice: 并且谨守
  rationale: שׁמר与诫命连用时表示遵守、持守。“谨守”符合中文圣经的庄重语体，并传达认真遵行的意味。
- source_word: כָּל מִצְוֺתָיו
  choice: 他的一切诫命
  rationale: 准确保留כָּל“一切”和带所属后缀的מִצְוֺתָיו“他的诫命”，维持盟约律法语域。
theological_decisions:
- issue: הֶאֱמִיר在立约语境中的作用
  choice: 译为神正式“宣告”以色列作他的子民
  alternative: 译为“拣选”“分别出来”，或采用强调双方盟誓的解释性译法
  rationale: 原文罕见动词与上一节形成对应，显出正式的立约宣示；“宣告”保留这一作用，却不额外加入原句未明说的拣选教义或更具体的仪式含义。
- issue: דִּבֶּר是否应明确译作“应许”
  choice: 正文译为“对你所说的”
  alternative: 译为“向你所应许的”
  rationale: 立约上下文容许“应许”的理解，但动词本身仍是“说”。正文保留词义范围和可能的神学张力，脚注提供语境性替代译法。
- issue: “作他的子民”与“谨守诫命”的句法关系
  choice: 将两者并列为宣告所涉及的内容
  alternative: 仅把谨守诫命理解为成为珍爱子民的条件，或仅理解为其结果
  rationale: 两个不定式由连接词并列，但其精确逻辑关系并未完全展开。译文维持并列，不擅自判定遵命是身份的先决条件还是后续结果。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“耶和华”保留神名；“珍爱的子民”避免生硬直译，同时以脚注保存“珍藏的产业”这一重要盟约意象。正文不使用过度古雅的“宝民”等词，也不把罕见动词解释性地译成“拣选”。
