  source_fidelity: 译文总体准确呈现了献上初熟之物、将供物安放在耶和华面前、并俯身下拜的礼仪次序。惟“俯伏敬拜”将原文具体的身体动作扩展为较宽泛的宗教行为；正文宜保留“俯伏”或“下拜”。“耶和华你上帝”亦应补足现代汉语中自然的领属连接。
  naturalness: “现在，看哪”适合庄重的宣告语体。“你赐给我的土地所产的初熟之物”比“你赐给我的土地初熟的出产”层次更清楚、表达更自然；“耶和华你的上帝”是现代汉语中更通顺且常见的称谓结构。
  terminology: “耶和华”一致对应 יהוה；“上帝”对应 אֱלֹהֶיךָ，并保留第二人称单数领属。以“初熟之物”表达 רֵאשִׁית פְּרִי，避免将其泛化为一般“出产”。
