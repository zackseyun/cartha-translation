  text: וְ/עַתָּ֗ה הִנֵּ֤ה הֵבֵ֨אתִי֙ אֶת רֵאשִׁית֙ פְּרִ֣י הָ/אֲדָמָ֔ה אֲשֶׁר נָתַ֥תָּה לִּ֖/י יְהוָ֑ה וְ/הִנַּחְתּ֗/וֹ לִ/פְנֵי֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ וְ/הִֽשְׁתַּחֲוִ֔יתָ לִ/פְנֵ֖י יְהוָ֥ה אֱלֹהֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/010.yaml
  text: And now[a], behold, I have brought the firstfruits of the ground that you, O Yahweh, have given me[b]. Then you shall set it down before Yahweh your God and bow down before Yahweh your God.
translation:
  language: zh_hans
  text: “现在，看哪，我已把你赐给我的土地所产的初熟之物带来了，耶和华。”随后，你要把它放在耶和华你的上帝面前，并在耶和华你的上帝面前俯伏。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “俯伏”原文具体指俯身下拜的动作；“敬拜”是较宽泛的意译。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: 现在
  rationale: 承接前面的申述并转入当前献礼的行动；现代汉语用“现在”自然清楚。
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留指示并唤起注意的语气，也符合庄重的礼仪宣告。
- source_word: הֵבֵאתִי
  choice: 我……带来了
  rationale: 对应第一人称完成式，表达献礼者已经把供物带到。
- source_word: רֵאשִׁית פְּרִי הָאֲדָמָה
  choice: 土地初熟的出产
  rationale: “初熟的出产”自然表达首先收获并献上的农产，同时保留“土地所产”的构造关系。
- source_word: הָאֲדָמָה
  choice: 土地
  rationale: 本处指产生农作物的土地产地；“土地”比单说“地面”更符合现代汉语农业语境。
- source_word: אֲשֶׁר נָתַתָּה לִּי
  choice: 你赐给我的
  rationale: 保留关系从句，并明确承认出产来自上帝的赐予。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文圣经语境中对四字神名最通行、易懂的音译。
- source_word: וְהִנַּחְתּוֹ
  choice: 随后，你要把它放在
  rationale: 在礼仪程序中，该形式具有指示下一步行动的作用；“放在”具体而自然。
- source_word: לִפְנֵי
  choice: 在……面前
  rationale: 保留供物呈到上帝临在之处的礼仪含义。
- source_word: אֱלֹהֶיךָ
  choice: 你上帝
  rationale: 直接保留第二人称单数的盟约称谓。
- source_word: וְהִשְׁתַּחֲוִיתָ
  choice: 俯伏敬拜
  rationale: 该动词具体指俯身或俯伏；“俯伏敬拜”既呈现身体动作，也让现代读者明白此处在上帝面前行动的礼仪意义。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。中文正文采用读者最熟悉的专名“耶和华”，不以“主”代替，从而保留其作为专有神名的性质。
- issue: וְהִשְׁתַּחֲוִיתָ 是身体动作还是一般性的敬拜
  choice: 俯伏敬拜
  alternative: 俯伏在地
  rationale: 原词首先描写俯身、伏下的动作，而语境明确是向上帝行礼；正文兼顾动作与语境，脚注说明更严格的字面表达，避免把原词仅抽象化为“敬拜”。
translation_notes:
  register: 采用现代、庄重而易懂的礼仪宣告语体。引号标明献礼者所说的话；其后转为对献礼者的程序指示。保留“看哪”的强调功能，但避免整体文风过度古雅。
