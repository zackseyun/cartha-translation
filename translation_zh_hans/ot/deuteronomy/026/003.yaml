  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וּ/בָאתָ֙ אֶל הַ/כֹּהֵ֔ן אֲשֶׁ֥ר יִהְיֶ֖ה בַּ/יָּמִ֣ים הָ/הֵ֑ם וְ/אָמַרְתָּ֣ אֵלָ֗י/ו הִגַּ֤דְתִּי הַ/יּוֹם֙ לַ/יהוָ֣ה אֱלֹהֶ֔י/ךָ כִּי בָ֨אתִי֙ אֶל הָ/אָ֔רֶץ אֲשֶׁ֨ר נִשְׁבַּ֧ע יְהוָ֛ה לַ/אֲבֹתֵ֖י/נוּ לָ֥/תֶת לָֽ/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/003.yaml
  text: And you shall go to the priest who is in office in those days and say to him[c][b][a], ‘Today I declare to Yahweh your God that I have come into the land that Yahweh swore to our fathers to give to us.’
translation:
  language: zh_hans
  text: 你要到当时任职的祭司那里[a]，对他说：“今天我向耶和华你的神宣告[b]：我已经进入耶和华向我们列祖[c]起誓要赐给我们的地。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译“那些日子将会在的祭司”，意思是当时供职或任职的祭司。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“今天我已经宣告”。这里的希伯来语形式很可能具有施为作用：说话者正是借着说出这句话作出宣告。
    reason: lexical_alternative
  - marker: c
    text: 也可译作“我们的祖先”。希伯来文是阳性复数；这里很可能特指以色列的族长先祖。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָאתָ
  choice: 你要到……那里
  rationale: בוא可依叙述视角表示“来、去、到”；此处是指示献礼者前往祭司那里，译为“到……那里”自然，并保留指令语气。
- source_word: הַכֹּהֵן אֲשֶׁר יִהְיֶה בַּיָּמִים הָהֵם
  choice: 当时任职的祭司
  rationale: 字面为“那些日子将会在的祭司”，语境指届时供职的祭司；“当时任职”简明表达其职分含义。
- source_word: הִגַּדְתִּי הַיּוֹם
  choice: 今天我……宣告
  rationale: 完成式在这里很可能具有施为功能，即说话者借这句话作出宣告；中文现在时表达无需另加时态标记。
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: 向耶和华你的神
  rationale: 保留介词方向和第二人称单数“你的”，不顺译成“我们的神”；专名יהוה译为“耶和华”。
- source_word: כִּי בָאתִי אֶל הָאָרֶץ
  choice: 我已经进入……地
  rationale: 完成式表示已经实现并与当前仪式相关的进入；“进入”也贴合进入应许之地的空间意义。
- source_word: אֲשֶׁר נִשְׁבַּע יְהוָה
  choice: 耶和华……起誓
  rationale: 直接保留盟约语境中的起誓用语。
- source_word: לַאֲבֹתֵינוּ
  choice: 向我们列祖
  rationale: אָבוֹת为阳性复数；申命记的盟约语境很可能特指族长先祖。“列祖”既保留这一指向，也符合庄重的现代圣经汉语。
- source_word: לָתֶת לָנוּ
  choice: 要赐给我们的
  rationale: “赐给”自然表达土地作为神所赐礼物的意义，并保留第一人称复数受益者。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用四字神名；正文以现代中文读者最熟悉的专名“耶和华”呈现，不以“主”替代，从而保留其盟约专名性质。
- issue: “我们列祖”的所指
  choice: 我们列祖
  alternative: 我们的祖先
  rationale: 原词为阳性复数，且在本段盟约语境中很可能指以色列的族长先祖；正文不将这一可能的特指泛化，但脚注注明较宽的译法。
- issue: הִגַּדְתִּי的时态与言语行为
  choice: 今天我宣告
  alternative: 今天我已经宣告
  rationale: 完成式既可形式上译为“已经宣告”，也很可能是施为用法，即当场以此话完成宣告；正文采用自然中文的施为表达，同时在脚注保存另一理解。
translation_notes:
  register: 采用庄重、清晰的现代标准汉语。“你要……对他说”保留律法指示的语气；“当时任职”避免生硬直译；“列祖”虽略带圣经语体，但在此处准确、简洁且能表达族长先祖的可能特指。
