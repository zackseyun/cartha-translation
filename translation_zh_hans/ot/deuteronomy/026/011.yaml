  text: וְ/שָׂמַחְתָּ֣ בְ/כָל הַ/טּ֗וֹב אֲשֶׁ֧ר נָֽתַן לְ/ךָ֛ יְהוָ֥ה אֱלֹהֶ֖י/ךָ וּ/לְ/בֵיתֶ֑/ךָ אַתָּה֙ וְ/הַ/לֵּוִ֔י וְ/הַ/גֵּ֖ר אֲשֶׁ֥ר בְּ/קִרְבֶּֽ/ךָ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/011.yaml
  text: And you shall rejoice in all the good that Yahweh your God has given to you and to your household—you[a], and the Levite, and the sojourner who is among you.
translation:
  language: zh_hans
  text: 你要和利未人，以及住在你中间的寄居者[a]，一同因雅威你的上帝赐给你和你全家的一切福分而欢喜。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “寄居者”指住在以色列人中间、受其保护的外族居民。
    reason: 说明גֵּר的法律与社会含义，避免现代读者将其误解为短暂停留的旅客。
lexical_decisions:
- source_word: וְשָׂמַחְתָּ
  choice: 你要……欢喜
  rationale: 连词加完成式在本段礼仪训令中表达命令或应当实行之事。“欢喜”既保留内在喜乐，也符合献初熟果实时共同庆贺的语境。
- source_word: בְכָל הַטּוֹב
  choice: 因……一切福分
  rationale: 介词短语表示欢喜所因之恩惠；טוֹב在这里指上帝所赐的好处和福祉，译作“一切福分”比直译“一切美好”更符合现代汉语，同时不把它局限为物品。
- source_word: אֲשֶׁר נָתַן לְךָ
  choice: 赐给你
  rationale: 准确表达关系从句及נתן的给予含义；“赐”适合以上帝为施予者的庄重语域。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译呈现四字神名，保留其作为以色列之上帝专名的性质，而不以称号替代。
- source_word: אֱלֹהֶיךָ
  choice: 你的上帝
  rationale: 保留第二人称单数所属后缀及盟约表达。
- source_word: וּלְבֵיתֶךָ
  choice: 和你全家
  rationale: בַּיִת在此指家庭或家户，不是建筑物；“全家”自然表达受惠的整个家户。
- source_word: אַתָּה
  choice: 你
  rationale: 希伯来文显式代词带有强调，并与利未人和寄居者并列；译文保留这一并列关系。
- source_word: הַלֵּוִי
  choice: 利未人
  rationale: 指利未支派成员，是准确且通行的汉语圣经用语。
- source_word: הַגֵּר
  choice: 寄居者
  rationale: גֵּר指居住在以色列群体中、受其社会与法律保护的非本地居民；“寄居者”保留其法律社会身份，脚注说明其外族背景。
- source_word: אֲשֶׁר בְּקִרְבֶּךָ
  choice: 住在你中间的
  rationale: 以自然现代汉语表达בקרבך，并凸显此人生活在该群体之中。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名。译作“雅威”旨在按较通行的学术重构音译其专名；“耶和华”是传统汉语形式，但反映较晚形成的混合读音。
- issue: 共同欢喜者的句法关系
  choice: 将“你、利未人、寄居者”处理为一同欢喜的并列主语
  alternative: 仅以“你”为主语，将其余两者理解为陪同者
  rationale: אַתָּה וְהַלֵּוִי וְהַגֵּר在“你家”之后构成强调性的人员列举。汉语用“你要和……一同”自然呈现共同参与，同时保留“你”的主要受命地位。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“一同……欢喜”重组了希伯来语的并列结构，使中文流畅，但没有增添新的参与者或原因；“福分”概括טוֹב在本节中所指上帝赐下的各样好处。脚注标记置于其所解释的“寄居者”之后。
