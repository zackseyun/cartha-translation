base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/016.yaml
  text: This day Yahweh your God commands you to do these statutes and judgments[c][b][a]; and you shall keep and do them with all your heart and with all your soul.
translation:
  language: zh_hans
  text: 今日，耶和华你的上帝吩咐你遵行这些律例和典章；你要尽心尽性地谨守遵行这些律例和典章。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַיּוֹם הַזֶּה
  choice: 今天
  rationale: 这是强调当前时点的时间指示语；现代汉语用“今天”自然、准确，也保留申命记中立约劝勉的即时性。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的专名“耶和华”呈现四字神名，而不以“主”这一称号替代。
- source_word: אֱלֹהֶיךָ
  choice: 你的上帝
  rationale: 保留第二人称单数所属关系，体现上帝与受话者之间的圣约关系。
- source_word: מְצַוְּךָ
  choice: 吩咐你
  rationale: 分词在此有当前、即时的语力；汉语“今天……吩咐你”已自然表达这一点，无须添加进行体。
- source_word: לַעֲשׂוֹת
  choice: 遵行
  rationale: 在律法语境中，עשה指实际实行命令；“遵行”比机械的“做”更符合现代汉语，同时没有加入额外含义。
- source_word: הַחֻקִּים
  choice: 律例
  rationale: “律例”是中文圣经及庄重法律语域中对 חֻקִּים 的自然表达，并与下文 מִשְׁפָּטִים 保持区分。
- source_word: הַמִּשְׁפָּטִים
  choice: 典章
  rationale: 该词在此指规定、裁决性法则；“典章”可与“律例”并列，保留法律语感及术语区别。
- source_word: וְשָׁמַרְתָּ וְעָשִׂיתָ אֹתָם
  choice: 你要……谨守遵行
  rationale: 用中文常见的成对表达保留 שמר 与 עשה 的双重强调，既包括留心持守，也包括付诸实行。
- source_word: בְּכָל לְבָבְךָ
  choice: 尽心
  rationale: לֵבָב 涵盖思想、意志和情感；“尽心”简洁自然，并传达全心投入。
- source_word: וּבְכָל נַפְשֶׁךָ
  choice: 尽性
  rationale: נֶפֶשׁ 可指生命、自我或整个有生命的人；在与“心”并列的圣约表达中，“尽性”保留传统庄重感，歧义另以脚注说明。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；主
  rationale: 原文直接使用上帝的圣约专名。正文采用现代中文圣经传统中最广为人知的专名“耶和华”，避免用称号“主”取代专名；“雅威”虽更接近常见学术拟音，但在普通中文读者中熟悉度较低。
- issue: 第二人称单数的圣约性称呼
  choice: 保留“你／你的”，不增添“以色列”
  alternative: 明确译作“以色列民”或改用复数“你们”
  rationale: 希伯来文以阳性单数称呼作为整体的以色列，形成直接的圣约诉求。中文“你”能够明确保留单数形式，不应解释性增补受话者。
- issue: “心”与 נֶפֶשׁ 的人论表达
  choice: 尽心、尽性
  alternative: 全心全意；用你的整个生命
  rationale: 保留原文两个彼此相关但不完全相同的词，不把它们压缩成单一习语；同时以脚注说明 נֶפֶשׁ 的宽广语义，避免将其限定为后期身心二分观中的“灵魂”。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。句法尽量贴近希伯来文的命令与劝勉结构；以“律例和典章”“谨守遵行”维持申命记法律—圣约语域，但避免生硬逐词翻译。脚注标记紧接“尽性”，准确对应所解释的词。
