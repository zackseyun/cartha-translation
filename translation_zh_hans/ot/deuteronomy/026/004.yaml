base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/004.yaml
  text: Then the priest shall take the basket from your hand and set it before the altar of Yahweh your God[a].
translation:
  language: zh_hans
  text: 祭司要从你手中接过篮子，放在你上帝耶和华[a]的祭坛前。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文：YHWH（四字神名）。传统中文译作“耶和华”，也常音译为“雅威”；许多译本以“主”代称。
    reason: 说明神名的原文形式及主要译法。
lexical_decisions:
- source_word: וְלָקַח
  choice: 要……接过
  rationale: 在礼仪程序的连续叙述中，带连接词的完成式表达下一项规定动作；“要”体现规范语气，“接过”自然表达从献礼者手中转交给祭司。
- source_word: הַכֹּהֵן
  choice: 祭司
  rationale: 定指单数名词，指主持这项礼仪的祭司；汉语无需另加定冠词。
- source_word: הַטֶּנֶא
  choice: 篮子
  rationale: טֶנֶא 指盛放初熟果实的篮筐；“篮子”准确且通俗。
- source_word: מִיָּדֶךָ
  choice: 从你手中
  rationale: 保留原文具体的交接画面及第二人称单数称呼。
- source_word: וְהִנִּיחוֹ
  choice: 放
  rationale: 使役词形在此表示把篮子安放于某处；“放”简洁自然，对象由上下文明确为篮子。
- source_word: לִפְנֵי מִזְבַּח
  choice: 祭坛前
  rationale: 表达相对于祭坛的空间位置，也符合礼仪语境中的惯用说法。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者最熟悉的专名形式呈现四字神名，并用脚注说明希伯来文形式及传统译法。
- source_word: אֱלֹהֶיךָ
  choice: 你上帝
  rationale: 保留第二人称单数所有关系和直接的盟约称呼；“上帝”是现代标准汉语中庄重、易懂的译法。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；以“主”代称
  rationale: 原文直接使用四字神名。正文采用中文传统且广为人知的专名“耶和华”，不把专名无提示地改成称号；脚注同时交代希伯来文 YHWH 及常见替代译法，以免掩盖文本事实。
translation_notes:
  register: 采用现代、庄重而口语自然的礼仪法规表述。“接过”比单纯“拿”更清楚地体现从献礼者手中转交；句序紧贴希伯来文动作顺序。
