revisions:
- from: 你要从雅威你的上帝赐给你的土地上所收进的各样土产中，取一些初熟的[a]，放在篮子里，然后到雅威你的上帝将要选择的地方去，使他的名住在那里[b]。
  to: 你要从雅威你的上帝赐给你的土地上带来的各样土产中，取其中初熟的一部分[a]，放在篮子里，然后到雅威你的上帝将要选择的地方去，使他的名住在那里[b]。
  rationale: 修订仅处理汉语中“初熟的”指代不完整的问题，并收紧脚注的说明范围。修订后的“取其中初熟的一部分”清楚表达从各样土产的初熟出产中取一部分，且不把广义的 פְּרִי 限定为果树果实；其余关键表达均予以保留。
