source:
  edition: WLC
  text: וְ/לָקַחְתָּ֞ מֵ/רֵאשִׁ֣ית כָּל פְּרִ֣י הָ/אֲדָמָ֗ה אֲשֶׁ֨ר תָּבִ֧יא מֵֽ/אַרְצְ/ךָ֛ אֲשֶׁ֨ר יְהוָ֧ה אֱלֹהֶ֛י/ךָ נֹתֵ֥ן לָ֖/ךְ וְ/שַׂמְתָּ֣ בַ/טֶּ֑נֶא וְ/הָֽלַכְתָּ֙ אֶל הַ/מָּק֔וֹם אֲשֶׁ֤ר יִבְחַר֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ לְ/שַׁכֵּ֥ן שְׁמ֖/וֹ שָֽׁם׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/002.yaml
  text: you shall take some of the firstfruits of all the fruit of the ground that you bring in from your land[a], which Yahweh your God is giving you, and put it in a basket[b], and go to the place that Yahweh your God will choose to make his name dwell there.
translation:
  language: zh_hans
  text: 你要从雅威你的上帝赐给你的土地上带来的各样土产中，取其中初熟的一部分[a]，放在篮子里，然后到雅威你的上帝将要选择的地方去，使他的名住在那里[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可按传统译作“各样土产的初熟部分”。原文表示从初熟的出产中取出一部分。
    reason: 说明 מֵרֵאשִׁית 的“初熟／最先部分”之义，并保留 מִן 所表示的部分性。
  - marker: b
    text: “使他的名住在那里”是《申命记》关于雅威所选地点的特有表达；它说的是他的“名”住在那里，并不把雅威本身局限于该地。
    reason: 说明 לְשַׁכֵּן שְׁמוֹ שָׁם 的申命记圣所公式，同时保留其原有措辞和神学张力。
lexical_decisions:
- source_word: מֵרֵאשִׁית כָּל פְּרִי הָאֲדָמָה
  choice: 从各样土产中，取一些初熟的
  rationale: מִן表示从整体中取出一部分；רֵאשִׁית在献上农产的语境中指最先成熟、最先收获的部分。“一些初熟的”避免误解为要献上全部，同时保留初熟果实的祭献含义。פְּרִי הָאֲדָמָה范围不限于水果，因此译作“土产”。
- source_word: אֲשֶׁר תָּבִיא מֵאַרְצְךָ
  choice: 从……土地上所收进的
  rationale: בוא的使役式在此有把农产带进、收进来的意思；“收进”既保留动作含义，也比单纯译作“收割”更宽泛。
- source_word: אֲשֶׁר יְהוָה אֱלֹהֶיךָ נֹתֵן לָךְ
  choice: 雅威你的上帝赐给你的
  rationale: 分词נֹתֵן呈现上帝正在并持续赐下土地的观念；中文定语结构自然表达土地是上帝所赐。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以“雅威”音译四字神名，保留经文中的专名性质，不以称号替代。
- source_word: וְשַׂמְתָּ בַטֶּנֶא
  choice: 放在篮子里
  rationale: טֶנֶא指盛放、搬运农产的篮子；中文无需补出重复宾语，承接前文即可。
- source_word: אֲשֶׁר יִבְחַר
  choice: 将要选择的
  rationale: 未完成式在摩西讲话的时点具有前瞻性，“将要选择”保留这一未来指向。
- source_word: לְשַׁכֵּן שְׁמוֹ שָׁם
  choice: 使他的名住在那里
  rationale: 保留שכן使役式及申命记特有的“名居住”表达，不把它简化为仅仅设立敬拜地点或宣告所有权。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。音译“雅威”较直接地保留其作为以色列之上帝圣约名字的性质。
- issue: “使他的名住在那里”的圣所公式
  choice: 使他的名住在那里
  alternative: 把他的名安置在那里
  rationale: 直译保留“名”与“居住”之间独特的神学张力：经文说上帝使自己的名居于所选之处，却没有将上帝本身局限在该地。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“各样土产”避免把פְּרִי误限为树上的水果；“使他的名住在那里”有意保留原文略显特殊的圣所用语。
