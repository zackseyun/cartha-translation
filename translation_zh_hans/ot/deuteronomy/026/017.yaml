  text: אֶת יְהוָ֥ה הֶאֱמַ֖רְתָּ הַ/יּ֑וֹם לִ/הְיוֹת֩ לְ/ךָ֨ לֵֽ/אלֹהִ֜ים וְ/לָ/לֶ֣כֶת בִּ/דְרָכָ֗י/ו וְ/לִ/שְׁמֹ֨ר חֻקָּ֧י/ו וּ/מִצְוֺתָ֛י/ו וּ/מִשְׁפָּטָ֖י/ו וְ/לִ/שְׁמֹ֥עַ בְּ/קֹלֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/017.yaml
  text: Today you have declared Yahweh to be your God[a], and that you will walk in his ways, keep his statutes, his commandments, and his judgments[c][b], and obey his voice.
translation:
  language: zh_hans
  text: 今天，你已经宣认耶和华是你的上帝，并承诺行在他的道路上，谨守他的律例、诫命和典章，听从他的话。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “听从他的话”直译为“听他的声音”；这里的“听”在上下文中含有顺服的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代汉语圣经读者熟悉的神名音译，不以“主”这一称号替代原文专名。
- source_word: הֶאֱמַרְתָּ
  choice: 宣认
  rationale: 该词是罕见的使役词形，在本节具有正式、盟约性的确认意味；“宣认”比一般的“说”更能体现郑重承认，又保持现代汉语的简洁。
- source_word: הַיּוֹם
  choice: 今天
  rationale: 直接保留原文的时间强调，符合现代汉语表达。
- source_word: לִהְיוֹת לְךָ לֵאלֹהִים
  choice: 是你的上帝
  rationale: 自然、直接地表达盟约关系中的“作你的上帝”。
- source_word: וְלָלֶכֶת בִּדְרָכָיו
  choice: 遵行他的道路
  rationale: 保留“道路”这一圣经盟约意象，同时用“遵行”自然表达按其道路生活的含义。
- source_word: חֻקָּיו
  choice: 他的律例
  rationale: “律例”是清楚且庄重的法律与盟约用语，并与相邻法律术语有所区分。
- source_word: מִצְוֺתָיו
  choice: 诫命
  rationale: 准确保留其命令性和正式的盟约语域。
- source_word: מִשְׁפָּטָיו
  choice: 典章
  rationale: 该词可指裁决、法令或规范；“典章”在此保持法律语域，又不与“律例”“诫命”混同。
- source_word: וְלִשְׁמֹעַ בְּקֹלוֹ
  choice: 听从他的话
  rationale: 原文直译为“听他的声音”，但在盟约语境中含有顺服之意；“听从他的话”兼顾听见与服从的语义，且比“听从他的声音”更符合现代汉语。
theological_decisions:
- issue: 盟约宣告的结构与以色列的主体责任
  choice: 将首个正式宣认与后续遵行、谨守、听从等承诺连为一个完整的盟约表态。
  alternative: 更形式化地把所有不定式并列为“使……作你的上帝，并行走、谨守、听……”而不补明承诺关系。
  rationale: 希伯来文以罕见的正式宣认动词统摄一连串不定式，后者表达宣认所包含的盟约义务；译文明确句法关系，但不增加原文以外的神学内容。
- issue: שׁמע בקול 中“听”与“顺服”的张力
  choice: 译作“听从他的话”，在正文中兼顾听与服从。
  alternative: 直译为“听他的声音”，或意译为“服从他”。
  rationale: 该惯用语既保留“听声音”的具体表达，又在语境中明确指向顺服；“听从他的话”避免只保留一端，并以脚注说明字面形式。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“宣认”体现正式的盟约确认；“遵行他的道路”保留原文意象；“律例、诫命和典章”维持三个相邻法律术语的区分。
