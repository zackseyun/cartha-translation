base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/015.yaml
  text: Look down from your holy dwelling[a], from heaven, and bless your people Israel and the land that you have given us, as you swore to our fathers, a land flowing with milk and honey.
translation:
  language: zh_hans
  text: 求你从天上、从你神圣的居所垂看，赐福给你的子民以色列，也赐福给你赐给我们的土地，就是你向我们列祖[a]起誓所应许的那流奶与蜜之地。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “列祖”也可译作“祖先”；希伯来原文直译为“我们的父辈”，这里指承受上帝应许的先祖。
    reason: 说明原文的阳性亲属称谓及其立约语境，同时提供自然的广义译法。
lexical_decisions:
- source_word: הַשְׁקִיפָה
  choice: 垂看
  rationale: 该祈使式表示从高处向下观看；“垂看”简洁、庄重，也与随后“从天上”所表明的视角吻合。
- source_word: מִמְּעוֹן קָדְשְׁךָ
  choice: 从你的圣所
  rationale: מָעוֹן指居所；在上帝的语境中，“圣所”自然地表达“你的圣洁居所”，同时保持现代汉语的庄重感。
- source_word: מִן הַשָּׁמַיִם
  choice: 从天上
  rationale: שָׁמַיִם虽为形式上的复数，汉语地点表达通常自然译为“天上”。
- source_word: וּבָרֵךְ
  choice: 赐福给
  rationale: 直接表达ברך祈使式的含义，并在两个受词“子民”和“土地”前重复，以使汉语句法清楚。
- source_word: עַמְּךָ אֶת יִשְׂרָאֵל
  choice: 你的子民以色列
  rationale: 保留同位结构，既表达立约归属，也明确这子民就是以色列。
- source_word: הָאֲדָמָה
  choice: 土地
  rationale: 此处处于初熟果实和应许之地的语境，指上帝所赐、可供耕作的土地；“土地”比“地土”更符合现代汉语，也不把意义缩窄为泥土。
- source_word: אֲשֶׁר נָתַתָּה לָנוּ
  choice: 你赐给我们的
  rationale: 希伯来语完成式陈述已经成就的赐予；汉语如此表达自然，并保留该土地现今属于群体的意义。
- source_word: כַּאֲשֶׁר נִשְׁבַּעְתָּ לַאֲבֹתֵינוּ
  choice: 就是你向我们列祖起誓所应许的
  rationale: כַּאֲשֶׁר引出与誓言相符的说明；补出“所应许的”使“土地”与誓言在汉语中的关系清晰，而不增添新的神学内容。“列祖”保留父系称谓及五经中的立约语感。
- source_word: אֶרֶץ זָבַת חָלָב וּדְבָשׁ
  choice: 那流奶与蜜之地
  rationale: 保留希伯来语描写丰饶的固定意象，并采用中文圣经语体中清楚而凝练的表达。
theological_decisions:
- issue: לַאֲבֹתֵינוּ在圣约誓言中的所指
  choice: 我们列祖
  alternative: 我们的祖先
  rationale: 原文为阳性复数“父辈”，在此五经公式中主要指承受应许的先祖；“列祖”既忠实保留这一称谓，也符合庄重而可懂的现代中文。脚注注明较宽泛的可译法。
- issue: 圣洁居所与天上的关系
  choice: 从天上、从你的圣所
  alternative: 从你的圣洁居所，就是从天上
  rationale: 原文并列两个介词短语，二者可能是同位说明。正文保留原有并列，避免过度判定其精确句法关系。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。“垂看”“列祖”“流奶与蜜之地”略具经文色彩，但在现代中文中仍清楚自然。脚注标记[a]置于其所解释的“列祖”之后。
