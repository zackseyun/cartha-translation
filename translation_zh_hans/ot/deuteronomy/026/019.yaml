  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וּֽ/לְ/תִתְּ/ךָ֣ עֶלְי֗וֹן עַ֤ל כָּל הַ/גּוֹיִם֙ אֲשֶׁ֣ר עָשָׂ֔ה לִ/תְהִלָּ֖ה וּ/לְ/שֵׁ֣ם וּ/לְ/תִפְאָ֑רֶת וְ/לִֽ/הְיֹתְ/ךָ֧ עַם קָדֹ֛שׁ לַ/יהוָ֥ה אֱלֹהֶ֖י/ךָ כַּ/אֲשֶׁ֥ר דִּבֵּֽר־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/019.yaml
  text: and to set you high above all the nations that he has made[a], for praise and for name and for beauty, and for you to be a holy people to Yahweh your God[c][b], as he has spoken.
translation:
  language: zh_hans
  text: 又使你高过他所造的万国，得着赞美、名声[a]和荣美[b]；又使你成为归属于耶和华你上帝的圣洁子民，正如他所说的[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “名声”也可译作“名望”或“美名”；希伯来语直译为“名”。
    reason: lexical_alternative
  - marker: b
    text: “荣美”也可译作“华美”或“荣耀”；原词兼有美丽、光彩和尊荣的意味。
    reason: lexical_alternative
  - marker: c
    text: “所说的”也可按本段的盟约语境译作“所应许的”。
    reason: alternative_reading
lexical_decisions:
- source_word: וּלְתִתְּךָ עֶלְיוֹן עַל כָּל הַגּוֹיִם
  choice: 又使你高过……万国
  rationale: נתן与עֶלְיוֹן及עַל连用，在这里表达把以色列置于万国之上的意思。“使你高过”既自然，也保留高举、居上的空间意象。
- source_word: אֲשֶׁר עָשָׂה
  choice: 他所造的
  rationale: עָשָׂה是常用的“做、造”，此处以关系从句修饰“万国”；“所造的”准确而简洁，不强化为更专门的创造术语。
- source_word: לִתְהִלָּה
  choice: 得着赞美
  rationale: לְ可表示目的或结果；“得着赞美”使抽象名词在现代汉语中自然，并与后面的并列成分相连。
- source_word: וּלְשֵׁם
  choice: 名声
  rationale: שֵׁם本义为“名”，也常指名望、声誉。此处译作“名声”能在汉语中传达其语境含义，同时没有把它窄化成褒义的“美名”。
- source_word: וּלְתִפְאָרֶת
  choice: 荣美
  rationale: תִפְאָרֶת兼有美丽、华美、尊荣和荣耀的意味。“荣美”保留审美与尊荣两个层面，避免只译为“荣耀”而消除词义张力。
- source_word: וְלִהְיֹתְךָ עַם קָדֹשׁ
  choice: 又使你成为……为圣的子民
  rationale: 继续表达目的或结果。“为圣”保留קָדוֹשׁ所含分别归属的意味，又不额外解释其具体方式。
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: 归耶和华你上帝
  rationale: לְ在此表示关系或归属；“归”比单用“给”更清楚地表达这群子民属于耶和华。יהוה以汉语圣经传统中广为人知的“耶和华”音译呈现。
- source_word: כַּאֲשֶׁר דִּבֵּר
  choice: 正如他所说的
  rationale: דִּבֵּר字面是“说、讲”。主文不直接译成“应许”，以免把上下文所暗含的应许性质写进动词本身。
theological_decisions:
- issue: 末句是否明确译成应许用语
  choice: 正如他所说的
  alternative: 正如他所应许的
  rationale: 原文动词只明确表示“说”。盟约语境可使这话带有应许性质，但主文保留原文措辞，不替读者消除这一语境层面的判断。
- issue: 圣名יהוה的呈现
  choice: 耶和华
  alternative: 上主
  rationale: 采用现代中文读者熟悉的专名形式，表明原文此处使用的是以色列上帝的圣名，而非普通称号。
- issue: “圣洁子民”与归属关系
  choice: 归耶和华你上帝为圣的子民
  alternative: 耶和华你上帝的圣洁子民
  rationale: “归……为圣”同时保留לְ的归属关系和קָדוֹשׁ的分别为圣含义，不把“圣”仅处理为一般道德品质。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。以两个“又使”对应原文连续的不定式结构，用分号呈现并列层次；保留“赞美、名声和荣美”的三项排列，不把三个词合并成单一的“荣耀”。
