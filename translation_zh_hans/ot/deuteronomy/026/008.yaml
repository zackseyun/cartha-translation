  text: וַ/יּוֹצִאֵ֤/נוּ יְהוָה֙ מִ/מִּצְרַ֔יִם בְּ/יָ֤ד חֲזָקָה֙ וּ/בִ/זְרֹ֣עַ נְטוּיָ֔ה וּ/בְ/מֹרָ֖א גָּדֹ֑ל וּ/בְ/אֹת֖וֹת וּ/בְ/מֹפְתִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/008.yaml
  text: And Yahweh brought us out of Egypt with a strong hand and an outstretched arm[a], and with great terror, and with signs and wonders.
translation:
  language: zh_hans
  text: 雅威用大能的手和伸出的膀臂，以大而可畏的作为，并以神迹奇事，把我们从埃及领了出来。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיּוֹצִאֵנוּ
  choice: 把我们……领了出来
  rationale: 该词是 יצא 的使役式，表示“使出去、带出来”。“领了出来”在现代汉语中自然，也保留出埃及的核心意象。
- source_word: יְהוָה
  choice: 雅威
  rationale: 原文直接使用四字神名；“雅威”以现代汉语音译呈现其专名性质，而不以称号代替。
- source_word: מִמִּצְרַיִם
  choice: 从埃及
  rationale: 与“领了出来”搭配，准确表达离开埃及。
- source_word: בְּיָד חֲזָקָה
  choice: 用大能的手
  rationale: 保留希伯来语“手”的形象；“大能”比生硬的“强壮”更自然地表达施行能力与权能。
- source_word: וּבִזְרֹעַ נְטוּיָה
  choice: 和伸出的膀臂
  rationale: 直接保留出埃及叙事中表示神施展能力的惯用形象。
- source_word: וּבְמֹרָא גָּדֹל
  choice: 以极大的威势
  rationale: מוֹרָא 可指恐惧、可畏性或令人敬畏的显现。“威势”在汉语中能兼顾令人畏惧与震撼的意味，同时以脚注保留其他可能理解。
- source_word: וּבְאֹתוֹת
  choice: 并以神迹
  rationale: אוֹת 基本义为“记号、征兆”；在出埃及语境中指具有超自然意义的标记。“神迹”是简明自然的汉语对应。
- source_word: וּבְמֹפְתִים
  choice: 奇事
  rationale: 与“神迹”组成自然的固定搭配“神迹奇事”，表达令人惊异、彰显能力的事件，而不作额外解释。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文使用神的专名而非普通称号，因此正文采用音译“雅威”，既保留专名性质，也避免以“主”消除原文区别。
- issue: מוֹרָא 在出埃及表述中的含义
  choice: 极大的威势
  alternative: 极大的恐惧；大而可畏的景象（或作为）
  rationale: 该词既可侧重人所感到的恐惧，也可指引发敬畏或惊惧的显现。正文用“威势”保留其客观可畏性，脚注说明其语义范围，不把它限定为纯粹的内在感受或明确增补“作为”。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。保留“大能的手”和“伸出的膀臂”这组具体形象，并将连续的工具性介词自然处理为“用……以……并以……”。
