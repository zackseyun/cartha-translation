  text: וַ/נִּצְעַ֕ק אֶל יְהוָ֖ה אֱלֹהֵ֣י אֲבֹתֵ֑י/נוּ וַ/יִּשְׁמַ֤ע יְהוָה֙ אֶת קֹלֵ֔/נוּ וַ/יַּ֧רְא אֶת עָנְיֵ֛/נוּ וְ/אֶת עֲמָלֵ֖/נוּ וְ/אֶת לַחֲצֵֽ/נוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/007.yaml
  text: Then we cried out to Yahweh[a], the God of our fathers, and Yahweh heard our voice and saw our affliction, our labor[b], and our oppression.
translation:
  language: zh_hans
  text: 于是，我们向雅威[a]——我们列祖的神——呼求；雅威听见了我们的声音，看见了我们的困苦、劳苦和所受的压迫。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威”音译希伯来文中神的名字 יהוה；传统上也译作“耶和华”。
    reason: 说明神名的音译及常见传统译法。
lexical_decisions:
- source_word: וַנִּצְעַק
  choice: 呼求
  rationale: צעק表示人在困境中急切求助；“呼求”既保留强烈求援的意味，也适合向神发声的语境。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文四字神名音译为“雅威”，保留其作为以色列之神专名的性质，不以头衔替代。
- source_word: אֱלֹהֵי אֲבֹתֵינוּ
  choice: 我们列祖的神
  rationale: “列祖”自然表达以色列先祖，并保留这一盟约性称谓的传统语感。
- source_word: וַיִּשְׁמַע ... אֶת קֹלֵנוּ
  choice: 听见了我们的声音
  rationale: 保留希伯来文“听见我们的声音”的具体表达；在上下文中自然指神听见他们的呼求。
- source_word: וַיַּרְא
  choice: 看见了
  rationale: 直译“看见”，保留神留意其处境的含义，而不额外解释为“眷顾”或“察看”。
- source_word: עָנְיֵנוּ
  choice: 我们的困苦
  rationale: עֳנִי指受苦、困顿或卑微的处境；“困苦”在现代汉语中清楚且庄重。
- source_word: עֲמָלֵנוּ
  choice: 我们的劳苦
  rationale: עָמָל可指辛劳、劳碌及由此产生的痛苦；“劳苦”贴合以色列人在埃及被迫服苦役的背景，也与“困苦”和“压迫”有所区分。
- source_word: לַחֲצֵנוּ
  choice: 我们所受的压迫
  rationale: לַחַץ表示外力施加的压迫或逼迫；补出“所受的”使现代汉语自然，并明确压迫来自他者。
theological_decisions:
- issue: 如何译出神的盟约名 יְהוָה
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。音译“雅威”保留专名性质；不采用“主”，以免把名字改成头衔。“耶和华”是传统音译，但“雅威”更接近通行的学术复原读音。
- issue: 神“看见”以色列人的苦况是否应解释性扩展
  choice: 保留“看见了”
  alternative: 眷顾了；留意到
  rationale: 原文只用常见动词 ראה“看见”。直译既保留其神学分量，也不预先限定这种看见所包含的行动。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“列祖”保留盟约宣认的传统语感；三个受苦名词分别译为“困苦、劳苦、所受的压迫”，尽量呈现原文的并列和语义层次。
