  text: וְ/הָיָה֙ כִּֽי תָב֣וֹא אֶל הָ/אָ֔רֶץ אֲשֶׁר֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ נֹתֵ֥ן לְ/ךָ֖ נַחֲלָ֑ה וִֽ/ירִשְׁתָּ֖/הּ וְ/יָשַׁ֥בְתָּ בָּֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/001.yaml
  text: And when you come into the land that Yahweh your God is giving you as an inheritance[a], and you take possession of it and live in it[b],
translation:
  language: zh_hans
  text: 当你进入雅威你的上帝赐给你作产业[a]的那地，并取得那地、住在其中[b]时，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “产业”也可译作“继承的产业”或“地业”。原词指作为继承或分配所得的产业。
    reason: lexical_alternative
  - marker: b
    text: “住在其中”也可译作“居住在那里”或“定居在那里”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: 当……时
  rationale: 这是希伯来语常用的叙事兼时间引介句式，指将来发生的情形；译为“当……时”自然地保留其时间和承接作用。本节句意延续到下一节，因此末尾保留逗号。
- source_word: תָבֹוא אֶל הָאָרֶץ
  choice: 你进入……那片土地
  rationale: בוא 与 אֶל 连用，在这里表示进入土地，而非仅仅朝土地前行；“进入”比直译为“来到”更明确。保留第二人称单数“你”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文本直接音译四字神名，保留其作为以色列之上帝的专名，不以称号替代。
- source_word: אֱלֹהֶיךָ
  choice: 你的上帝
  rationale: 准确保留第二人称单数后缀及盟约语境中的直接称呼。
- source_word: נֹתֵן לְךָ
  choice: 赐给你
  rationale: 分词 נֹתֵן 可表达正在进行或已确定而临近的行动；现代汉语“赐给你”在此自然，也保留上帝主动给予土地之意，不必生硬添加时态词。
- source_word: נַחֲלָה
  choice: 作产业
  rationale: נַחֲלָה 指分得并持有的继承性产业；“产业”在土地语境中兼顾承受与归属的含义。
- source_word: וִירִשְׁתָּהּ
  choice: 占领它
  rationale: ירשׁ 在应许之地的语境中具有取得、占有土地的主动含义。“占领”与前面的上帝赐予形成原文所呈现的先后关系；脚注保留“取得它”的较中性译法。
- source_word: וְיָשַׁבְתָּ בָּהּ
  choice: 并住在其中
  rationale: ישׁב 在这里指居住或定居。“住在其中”是自然的现代汉语，同时不把语义过度收窄为初次“定居”。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文使用四字神名。音译为“雅威”保留这是专名的事实，避免以“主”这一称号替代；“耶和华”是传统形式，但较不贴近通常重建的读音。
- issue: 上帝赐地与以色列取得土地之间的关系
  choice: 分别译出“赐给你作产业”和“占领它”
  alternative: 合并为单一的“承受那地”
  rationale: 希伯来文本依次表达进入、上帝赐予、以色列取得并居住。分别译出可同时保留神的赐予与人的实际占有，不将二者在翻译中合并或作神学化简。
- issue: ירשׁ 的土地语境含义
  choice: 占领它
  alternative: 承受它；取得它；拥有它
  rationale: 该动词既可涉及继承或拥有，也常在申命记的土地语境中指实际取得占有。正文采用较具行动性的“占领”，脚注列出不突出军事色彩的可能译法，以保留词义张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以“那片土地”自然表达特指的应许之地；保留第二人称单数“你”。本节是延续至下文的时间从句，故以“时，”收束而不加句号。
