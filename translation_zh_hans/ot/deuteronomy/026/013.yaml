  text: וְ/אָמַרְתָּ֡ לִ/פְנֵי֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ בִּעַ֧רְתִּי הַ/קֹּ֣דֶשׁ מִן הַ/בַּ֗יִת וְ/גַ֨ם נְתַתִּ֤י/ו לַ/לֵּוִי֙ וְ/לַ/גֵּר֙ לַ/יָּת֣וֹם וְ/לָ/אַלְמָנָ֔ה כְּ/כָל מִצְוָתְ/ךָ֖ אֲשֶׁ֣ר צִוִּיתָ֑/נִי לֹֽא עָבַ֥רְתִּי מִ/מִּצְוֺתֶ֖י/ךָ וְ/לֹ֥א שָׁכָֽחְתִּי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/013.yaml
  text: Then you shall say before Yahweh your God[a], ‘I have removed the holy portion from the house, and I have also given it to the Levite, the sojourner, the fatherless, and the widow, according to all your commandment that you commanded me. I have not transgressed your commandments[c][b], nor have I forgotten them.’
translation:
  language: zh_hans
  text: 然后，你要在耶和华你的上帝面前说：‘我已经把圣物[a]从家里取出，也把它给了利未人、寄居者[b]、孤儿[c]和寡妇，完全照着你所吩咐我的一切命令。我没有违背你的命令，也没有忘记。’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “圣物”也可译作“分别为圣的份”或“神圣的份额”；这里指从出产中分别出来、要分给指定群体的十一奉献。
    reason: lexical_alternative
  - marker: b
    text: “寄居者”指住在以色列人中间的外来居民。
    reason: lexical_clarification
  - marker: c
    text: “孤儿”原文尤其可指失去父亲、因而缺乏家庭保障的人。
    reason: lexical_clarification
lexical_decisions:
- source_word: וְאָמַרְתָּ
  choice: 然后，你要……说
  rationale: 该形式承接前文礼仪程序；“然后”自然表达次序，“要”保留规定性语气。
- source_word: לִפְנֵי יְהוָה אֱלֹהֶיךָ
  choice: 在耶和华你的上帝面前
  rationale: לִפְנֵי 表示“在……面前/临在中”；以“耶和华”音译传统形式呈现圣名，以“你的上帝”保留第二人称关系。
- source_word: בִּעַרְתִּי
  choice: 我已经……清除出去
  rationale: 此处指从家中彻底移走分别出来的十一奉献，并非焚烧；“清除出去”兼顾动作的完成及彻底性。
- source_word: הַקֹּדֶשׁ
  choice: 圣物
  rationale: 字面为“那圣的东西”；上下文所指是分别为圣、用于分给特定群体的出产或份额。“圣物”简洁保留原文概括性。
- source_word: מִן הַבַּיִת
  choice: 从家里
  rationale: 原文有定冠词，直译为“从那房屋中”；语境是申告者自己的家。“从家里”符合现代汉语，而无需补出原文没有的“我的”。
- source_word: וְגַם נְתַתִּיו
  choice: 也把它给了
  rationale: 代词“它”回指圣物；“也”保留 גַם 的递进补充作用。
- source_word: לַלֵּוִי
  choice: 利未人
  rationale: 原文仅说“利未人”，不将其缩窄为祭司。
- source_word: לַגֵּר
  choice: 寄居者
  rationale: גֵּר 指居住在以色列群体中的外来居民；“寄居者”保留其法律与社会身份含义。
- source_word: לַיָּתוֹם
  choice: 孤儿
  rationale: יָתוֹם 指失去父亲、缺乏家庭保障的弱势者；现代汉语以“孤儿”最自然。
- source_word: וְלָאַלְמָנָה
  choice: 寡妇
  rationale: 准确对应原文所列的社会弱势群体。
- source_word: כְּכָל מִצְוָתְךָ אֲשֶׁר צִוִּיתָנִי
  choice: 完全照你吩咐我的一切命令
  rationale: מִצְוָה 虽为单数，在此可作集合用法；译文保留“命令/吩咐”的词根重复，同时采用自然汉语语序。
- source_word: לֹא עָבַרְתִּי מִמִּצְוֺתֶיךָ
  choice: 我没有违背你的命令
  rationale: עבר מן 在此表示越过、违反规定；“违背”准确体现法律语境。
- source_word: וְלֹא שָׁכָחְתִּי
  choice: 也没有忘记
  rationale: 原文未明说宾语，依上下文指这些命令；中文可自然省略重复宾语并保留原文简洁性。
theological_decisions:
- issue: 神圣名字 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。中文正文采用读者最熟悉且具专名性质的“耶和华”，不以“主”替代，从而保留其作为盟约名字的特征。
- issue: הַקֹּדֶשׁ 的具体所指
  choice: 圣物
  alternative: 分别为圣的份／神圣的份额
  rationale: 本节语境表明它是应分给利未人和弱势群体的分别之物，但原词本身较概括；正文不直接增译为“十一奉献”，以免消除原文的词汇宽度，具体背景放入脚注。
- issue: 申告者守命的陈述
  choice: 我没有违背你的命令，也没有忘记
  alternative: 我没有偏离你的命令，也没有忘记它们
  rationale: 保留原文直率的顺服申告，不加入对其属灵状态或无罪程度的解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。礼仪申告以完成体“已经”开头，后续动词按自然汉语省略重复的完成标记。正文避免生硬复现希伯来语关系从句，同时保留“命令/吩咐”的语义重复。所有脚注标记均紧随相关词语。
