revisions:
- from: 然后，你要在耶和华你的上帝面前说：‘我已经把圣物[a]从家里清除出去，也把它给了利未人、寄居者[b]、孤儿[c]和寡妇，完全照你吩咐我的一切命令。我没有违背你的命令，也没有忘记。’
  to: 然后，你要在耶和华你的上帝面前说：‘我已经把圣物[a]从家里取出，也把它给了利未人、寄居者[b]、孤儿[c]和寡妇，完全照着你所吩咐我的一切命令。我没有违背你的命令，也没有忘记。’
