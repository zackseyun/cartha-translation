  naturalness: “其中任何一点”重复三次略显生硬；“其中任何一部分”在指奉献物或出产的一部分时更自然。“为死人而用”既通顺，也避免暗示死者能够直接接受物品。其余句式庄重、清晰。
  terminology: “耶和华”“上帝”“不洁净”“听从”等用语一致且适合庄重的礼仪宣告语境。保留“哀痛中”可涵盖哀伤、居丧或困苦等词义，脚注已说明替代译法。
