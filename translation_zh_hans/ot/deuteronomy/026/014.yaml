  to: 我在哀痛中没有吃其中任何一部分[a]，在不洁净时也没有除去其中任何一部分[b]，也没有把其中任何一部分为死人而用[c]。我听从了耶和华我上帝的话；你吩咐我的一切，我都照着做了。
