base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/014.yaml
  text: I have not eaten any of it while in mourning[a], and I have not removed any of it while unclean, and I have not given any of it for the dead. I have obeyed the voice of Yahweh my God[c][b]; I have done according to all that you commanded me.
translation:
  language: zh_hans
  text: 我在哀痛中没有吃其中任何一部分[a]，在不洁净时也没有除去其中任何一部分[b]，也没有把其中任何一部分为死人而用[c]。我听从了耶和华我上帝的话；你吩咐我的一切，我都照着做了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“在我的哀痛中”“在忧愁中”或“在困苦中”。
    reason: lexical_alternative
  - marker: b
    text: 或译“烧掉其中任何一部分”或“清除其中任何一部分”。这里的希伯来语动词既可指烧掉，也可指除去或清除。
    reason: lexical_alternative
  - marker: c
    text: 或译“给一个死者”或“用于与死人有关的事”；原文没有说明所禁止的确切用途。
    reason: alternative_reading
lexical_decisions:
- source_word: בְּאֹנִי
  choice: 在哀痛中
  rationale: אֹנִי 可指忧愁、哀痛或困苦；在本节礼仪与洁净的语境中，“在哀痛中”自然地表达守丧哀恸的状态，同时不把含义限定得过窄。
- source_word: בִעַרְתִּי מִמֶּנּוּ
  choice: 除去其中任何一点
  rationale: בער 的 Piel 形式可表示烧掉、除去、清除或消耗。正文采用较宽泛的“除去”，避免擅自断定具体处理方式，并以脚注保留“烧掉”等可能。
- source_word: בְּטָמֵא
  choice: 在不洁净时
  rationale: 该短语表示人在礼仪上不洁净的状态；“在不洁净时”既自然，也保留其时间和状态含义。
- source_word: לְמֵת
  choice: 给死人
  rationale: 希伯来文表述简短，可指给死者，也可能泛指与死者有关的用途。正文采用直译性较强的“给死人”，不将其具体化为丧葬祭献或尸体沾染。
- source_word: שָׁמַעְתִּי בְּקוֹל
  choice: 我听从了……的话
  rationale: שמע בקול 是表示顺服回应的常用语。“听从……的话”兼顾“听”与“遵从”的语义，符合立约语境，也比单说“听见”准确。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名“耶和华”呈现四字神名 יְהוָה，而不以称号替代。
- source_word: כְּכֹל אֲשֶׁר צִוִּיתָנִי
  choice: 你吩咐我的一切，我都照着做了
  rationale: 该表达强调完全依照上帝的吩咐而行；此译法自然、庄重，并清楚传达全面遵行之意。
theological_decisions:
- issue: “给死人”所指的禁用方式
  choice: 保留宽泛的“给死人”，不说明具体是哪一种礼仪行为
  alternative: 译作“用于丧葬礼仪”“给一个死者”或“因接触尸体而使用”
  rationale: לְמֵת 本身没有说明确切做法。保留概括性措辞，可避免把后世所推测的丧葬祭献、供物或尸体不洁直接写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“其中任何一点”的重复对应原文三次 מִמֶּנּוּ，保留宣告式句法的强调效果；分号呈现听从与实行之间紧密而有层次的关系。
