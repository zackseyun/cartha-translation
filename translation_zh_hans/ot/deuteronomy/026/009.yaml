base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/009.yaml
  text: And he brought us to this place and gave us this land[b][a], a land flowing with milk and honey.
translation:
  language: zh_hans
  text: 他带我们来到这地方，也把这片土地给了我们，就是一片流奶与蜜之地[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “流奶与蜜”是形容土地肥沃、物产丰盛的希伯来语表达；也可译作“一片奶与蜜丰盛之地”。
    reason: lexical_alternative
  - marker: b
    text: 这里的“蜜”在某些语境中也可能包括椰枣蜜等果实糖浆，不一定只指蜂蜜。
    reason: cultural_note
lexical_decisions:
- source_word: וַיְבִאֵנוּ
  choice: 他带领我们来到
  rationale: 该词是 בוא 的使役式，并带第一人称复数宾语后缀，表示使我们到达某处。“带领我们来到”在现代汉语中自然，也保留了使役移动和引领的意味。
- source_word: אֶל הַמָּקוֹם הַזֶּה
  choice: 这地方
  rationale: אֶל 表示朝向目的地，הַמָּקוֹם הַזֶּה 直指“这地方”。与“来到”搭配即可自然表达目的地，不必另译介词。
- source_word: וַיִּתֶּן לָנוּ
  choice: 把……赐给我们
  rationale: נתן 的基本义是“给”，לָנוּ 标明接受者。因上下文的施予者是上主，中文用“赐给”庄重自然，但不额外补出神名。
- source_word: אֶת הָאָרֶץ הַזֹּאת
  choice: 这片土地
  rationale: אֶרֶץ 在这里指赐给以色列的地域；“土地”准确且自然，“片”作为量词符合现代汉语表达。
- source_word: אֶרֶץ זָבַת חָלָב וּדְבָשׁ
  choice: 一片流奶与蜜之地
  rationale: 保留希伯来文“流出奶与蜜”的鲜明意象，同时以“……之地”形成简洁、庄重的汉语表达。该习语描绘土地肥沃、物产丰盛。
- source_word: דְבָשׁ
  choice: 蜜
  rationale: דְבָשׁ 通常指蜂蜜，但有时也可能涵盖椰枣等果实制成的糖浆。正文保留传统且能维持原有意象的“蜜”，并用脚注说明其语义范围。
theological_decisions:
- issue: 历史信仰告白中第三人称单数主语的表达
  choice: 译作“他”，不在本节补出“耶和华”
  alternative: 译作“耶和华带领我们来到……”
  rationale: 希伯来文本本节只有第三人称单数动词，主语承接上文所说的耶和华，却未在本节再次明说。保留“他”既维持篇章衔接，也避免把本节未出现的神名直接加入正文。
translation_notes:
  register: 采用现代、清楚而庄重的普通话。“这地方”“这片土地”保留原文两个近接指示语；分号使后半句对土地的说明关系清晰。脚注标记按正文出现顺序排列。
