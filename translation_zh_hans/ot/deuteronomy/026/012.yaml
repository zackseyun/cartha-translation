source:
  edition: WLC
  text: כִּ֣י תְכַלֶּ֞ה לַ֠/עְשֵׂר אֶת כָּל מַעְשַׂ֧ר תְּבוּאָתְ/ךָ֛ בַּ/שָּׁנָ֥ה הַ/שְּׁלִישִׁ֖ת שְׁנַ֣ת הַֽ/מַּעֲשֵׂ֑ר וְ/נָתַתָּ֣ה לַ/לֵּוִ֗י לַ/גֵּר֙ לַ/יָּת֣וֹם וְ/לָֽ/אַלְמָנָ֔ה וְ/אָכְל֥וּ בִ/שְׁעָרֶ֖י/ךָ וְ/שָׂבֵֽעוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/012.yaml
  text: When you have finished tithing all the tithe of your produce in the third year[a], the year of the tithe, then you shall give it to the Levite, the sojourner, the fatherless, and the widow, and they shall eat within your gates and be satisfied.
translation:
  language: zh_hans
  text: 你在第三年，就是十分之一之年，把你一切出产的十分之一都取出后，要把它给利未人、寄居者、孤儿和寡妇，让他们在你的城里[a]吃，并且吃饱。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“在你的城门内”；指在你的城镇中。
    reason: 说明希伯来语习语的字面形式及其实际所指。
lexical_decisions:
- source_word: כִּי תְכַלֶּה לַעְשֵׂר
  choice: 把……十分之一都缴纳完毕后
  rationale: כִּי在此引出时间情境；תְכַלֶּה表示完成，לַעְשֵׂר指办理或缴纳十分之一。合译为“缴纳完毕后”，自然表达先后程序，并保留“十分之一”的概念。
- source_word: כָּל מַעְשַׂר תְּבוּאָתְךָ
  choice: 你全部出产的十分之一
  rationale: מַעְשַׂר是“十分之一”，תְּבוּאָה泛指土地的出产或收成；“出产”范围较宽，也适合法律语境。
- source_word: בַּשָּׁנָה הַשְּׁלִישִׁת שְׁנַת הַמַּעֲשֵׂר
  choice: 在第三年，就是缴纳十分之一的那一年
  rationale: 保留原文同位说明，同时以“就是”使现代汉语关系清楚。
- source_word: וְנָתַתָּה
  choice: 就要把它分给
  rationale: 承接前面的时间条件，译作“就要”体现程序与命令；“它”依上下文指十分之一，“分给”符合多类受益者的语境。
- source_word: לַלֵּוִי לַגֵּר לַיָּתוֹם וְלָאַלְמָנָה
  choice: 利未人、寄居者、孤儿和寡妇
  rationale: 逐项保留盟约律法列出的具体群体。גֵּר指居住在当地的外来者，“寄居者”较准确；יָתוֹם在此指失去父亲或父母庇护的孩子，现代汉语用“孤儿”自然明确。
- source_word: בִשְׁעָרֶיךָ
  choice: 在你的城里
  rationale: 字面是“在你的城门内”，在申命记中常指所属城镇或聚居地；正文采用自然汉语表达，脚注保留字面意象。
- source_word: וְשָׂבֵעוּ
  choice: 并且吃饱
  rationale: שׂבע表示吃到满足、饱足；“吃饱”简明自然，并与前面的“吃”直接衔接。
theological_decisions:
- issue: 盟约律法中弱势群体的称谓
  choice: 保留“利未人、寄居者、孤儿和寡妇”四个具体类别
  alternative: 概括为“有需要的人”或使用现代职业、移民政策类别
  rationale: 原文有意逐项指定十分之一的受益者；保留这些类别可维持申命记的法律与神学结构，避免加入现代制度性解释。
- issue: בִשְׁעָרֶיךָ的字面表达与惯用含义
  choice: 正文译为“在你的城里”，脚注说明字面为“在你的城门内”
  alternative: 正文直译“在你的城门内”
  rationale: 该短语惯指一个人所属的城镇范围。现代汉语若只写“城门内”，容易被理解为城门附近的狭小地点；正文传达实际所指，脚注保存原文意象。
- issue: 第三年“十分之一”的性质
  choice: 仅译作“缴纳十分之一的那一年”
  alternative: 解释为某一特定教派体系中的“穷人捐”或另加祭祀制度说明
  rationale: 本节将其指定给所列群体，但经文本身仍称其为“十分之一的那一年”；译文不加入超出本句的制度性定性。
translation_notes:
  register: 采用现代、庄重而易懂的法律训令语体。“缴纳十分之一”兼顾动词与名词的词根呼应；句子按“时间—命令—结果”组织。正文中的脚注标记[a]置于对应短语之后。
