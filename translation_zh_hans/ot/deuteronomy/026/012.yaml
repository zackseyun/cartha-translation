  naturalness: 原句通顺，但“把……十分之一都缴纳完毕后，就要把它分给……”略显重复，也使“缴纳”与“分给”的搭配不协调。修订后保留庄重、现代的训令语体。
  terminology: “利未人、寄居者、孤儿和寡妇”均可保留；“城里”准确传达“在你的城门内”这一表示所属城镇的习语。将“缴纳十分之一的那一年”简化为“十分之一之年”，更直接反映שְׁנַת הַמַּעֲשֵׂר，且不改变其含义。
