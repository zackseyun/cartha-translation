base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/005.yaml
  text: And you shall answer and say before Yahweh your God[a], ‘My father was a perishing Aramean, and he went down to Egypt and sojourned there, few in number; and there he became a great, mighty, and numerous nation.’
translation:
  language: zh_hans
  text: 你要在耶和华你神面前回应说：‘我父亲原是一个濒临灭亡的亚兰人[a]。他下到埃及，在那里寄居，人数寥寥无几；他在那里成为一个庞大、强盛、人数众多的民族。’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我父亲原是一个漂泊的亚兰人。”希伯来语 אֹבֵד 既可指正在消亡、濒临灭亡，也可理解为迷失、漂泊。
    reason: 保留这个希伯来语分词在本句中的真实词义歧义。
lexical_decisions:
- source_word: וְעָנִיתָ וְאָמַרְתָּ
  choice: 你要……回应说
  rationale: 保留礼仪性回应的意味，同时以现代汉语自然表达希伯来语“回答并说”的成对公式。
- source_word: לִפְנֵי יְהוָה אֱלֹהֶיךָ
  choice: 在耶和华你神面前
  rationale: “面前”直接对应 לִפְנֵי，并保留神名 יהוה 为“耶和华”。
- source_word: אֲרַמִּי
  choice: 亚兰人
  rationale: 准确表达族群名称，避免使用范围和时代含义可能不同的“叙利亚人”。
- source_word: אֹבֵד
  choice: 濒临灭亡
  rationale: 该主动分词可表示正在消亡、行将灭亡；此译法直接保留危亡状态，另将“漂泊”这一可行理解列入脚注。
- source_word: אָבִי
  choice: 我父亲
  rationale: 保留原文单数和亲属称谓的鲜明表达，不以解释性的“祖先”取代。
- source_word: וַיֵּרֶד מִצְרַיְמָה
  choice: 他下到埃及
  rationale: 保留希伯来语前往埃及所用的方向性动词“下去”。
- source_word: וַיָּגָר שָׁם
  choice: 在那里寄居
  rationale: “寄居”体现作为外来居民暂住的含义，而非普通的“居住”。
- source_word: בִּמְתֵי מְעָט
  choice: 当时人数寥寥无几
  rationale: 该习语强调群体人数很少；此表达自然且不把 מְתֵי 误限为成年男性。
- source_word: וַיְהִי שָׁם לְגוֹי
  choice: 后来他却在那里成为……民族
  rationale: 保留单数代表性主语：这位先祖藉其后裔成为一个民族；“后来……却”清楚呈现由少至多的转折。
- source_word: גָּדוֹל עָצוּם וָרָב
  choice: 庞大、强盛、人数众多
  rationale: 分别传达规模、力量和数量三方面的累积强调。
theological_decisions:
- issue: אֲרַמִּי אֹבֵד אָבִי 的理解
  choice: 我父亲原是一个濒临灭亡的亚兰人
  alternative: 我父亲原是一个漂泊的亚兰人；或：一个亚兰人企图毁灭我父亲
  rationale: 按马所拉标点，最直接的句法是以“我父亲”为主语、以“亚兰人”和分词 אֹבֵד 描述他。“濒临灭亡”是该分词的直接可行含义；“漂泊”也符合词义及迁徙语境，故收入脚注以保留原文歧义。“一个亚兰人企图毁灭我父亲”需要对句法作更强的解释，未纳入正文。
translation_notes:
  register: 采用庄重而清楚的现代标准普通话。“回应说”保留礼仪宣告的语气；“寄居”“民族”等词通俗可懂，同时贴近原文。
