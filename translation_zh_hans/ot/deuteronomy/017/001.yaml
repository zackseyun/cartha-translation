base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/001.yaml
  text: You shall not sacrifice to Yahweh your God an ox or a sheep that has in it a blemish[a], any bad thing, for that is an abomination to Yahweh your God.
translation:
  language: zh_hans
  text: 不可把有残疾或任何其他不妥之处的牛或羊[a]献给雅威你的上帝，因为这样的祭物是雅威你上帝的可憎之物。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “羊”所译的希伯来词含义较广，可指绵羊或山羊。
    reason: lexical_alternative
lexical_decisions:
- source_word: תִזְבַּח
  choice: 献
  rationale: 本节处于献祭语境，“献”在现代汉语中自然表达把牲畜作为祭物献上，而不是普通宰杀。
- source_word: לַיהוָה
  choice: 献给雅威
  rationale: 介词 ל 表示奉献的对象；专名 יהוה 音译为“雅威”，保留经文中的圣约之名。
- source_word: שׁוֹר
  choice: 牛
  rationale: שׁוֹר 在这里指供献祭的大牲畜；“牛”自然且不额外限定性别。
- source_word: שֶׂה
  choice: 羊[a]
  rationale: 正文用普通读者熟悉的“羊”，同时以脚注说明该词可涵盖绵羊和山羊。
- source_word: מוּם
  choice: 残疾
  rationale: 指使祭牲不合格的身体残损；“残疾”保留其具体、严重的身体性含义。
- source_word: כֹּל דָּבָר רָע
  choice: 任何缺陷
  rationale: 该短语直译近于“任何不好的东西”，在此与 מוּם 并列或作补充说明，语境明确指祭牲身上任何不合格之处；“任何缺陷”自然且不把范围限缩为某一种损伤。
- source_word: תוֹעֲבַת
  choice: 所憎恶的
  rationale: תוֹעֵבָה 表示在上帝面前可憎、不可接受之物；“所憎恶的”在现代汉语中庄重自然，并保留强烈否定意味。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；音译“雅威”将其作为专名呈现，不以称号代替，也不采用较晚形成的“耶和华”读音。
- issue: תוֹעֵבָה 的性质
  choice: 这是雅威你的上帝所憎恶的
  alternative: 这是礼仪上不洁的；这是可憎之物
  rationale: 原文并未把可憎性明确限定为礼仪或道德类别，因此译文保留宽泛而强烈的判断，不作额外神学分类。
translation_notes:
  register: 采用现代、庄重而易懂的命令句。“不可”体现律法禁令；“雅威你的上帝”保留原文第二人称单数关系表达。将“有残疾，任何不好的东西”处理为自然的“有残疾或任何缺陷”，保留两个相邻表达的概括关系，避免生硬直译。
