id: DEU.17.16
reference: Deuteronomy 17:16
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: רַק֮ לֹא יַרְבֶּה לּ֣/וֹ סוּסִים֒ וְ/לֹֽא יָשִׁ֤יב אֶת הָ/עָם֙ מִצְרַ֔יְמָ/ה לְמַ֖עַן הַרְבּ֣וֹת ס֑וּס וַֽ/יהוָה֙ אָמַ֣ר לָ/כֶ֔ם לֹ֣א תֹסִפ֗וּ/ן לָ/שׁ֛וּב בַּ/דֶּ֥רֶךְ הַ/זֶּ֖ה עֽוֹד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/016.yaml
  text: Only[a], he must not multiply horses for himself, nor cause the people to return to Egypt in order to multiply horses, since Yahweh has said to you[c][b], ‘You must never return again by this way.’
translation:
  language: zh_hans
  text: 只是，他不可为自己增添马匹[a]，也不可为了增添马匹而使百姓回埃及去[b]，因为雅威曾对你们说：“你们绝不可再从这条路回去。”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“为自己置办许多马匹”。原文动词意为“使之增多、增加”。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“把百姓带回埃及”。原文动词是使役形式，所禁止的是王促使百姓返回埃及。
    reason: lexical_alternative
  - marker: c
    text: 直译为“你们不可再加上从这条路返回”；这是希伯来语惯用表达，意思是“你们绝不可再从这条路回去”。
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: 只是
  rationale: 保留该词对王之行为所加的限制语气，并自然承接上文。
- source_word: יַרְבֶּה לּוֹ סוּסִים
  choice: 不可为自己增添马匹
  rationale: רבה 的使役式表示使之增多；“增添”保留数量增加之意，“为自己”对应 לּוֹ，并体现王为自身扩充马匹。
- source_word: וְלֹא יָשִׁיב אֶת־הָעָם מִצְרַיְמָה
  choice: 也不可……使百姓回埃及去
  rationale: שוב 的使役式明确表示使别人返回；“使百姓回……去”既保留使役含义，也符合现代汉语。
- source_word: לְמַעַן הַרְבּוֹת סוּס
  choice: 为了增添马匹
  rationale: לְמַעַן 表目的；重复“增添马匹”保留原文与前句 רבה 的词汇呼应。
- source_word: וַיהוָה
  choice: 因为雅威
  rationale: 以“雅威”音译四字神名；结合上下文，将连接词译为表明禁令依据的“因为”，使汉语关系清楚。
- source_word: לֹא תֹסִפוּן לָשׁוּב
  choice: 你们绝不可再……回去
  rationale: יסף 加不定式在否定句中表达不再重复某行为；“绝不可再”兼顾其惯用意义和禁令的强度。
- source_word: בַּדֶּרֶךְ הַזֶּה
  choice: 从这条路
  rationale: דרך 在此指所走的道路或路线；介词 ב 在返回语境中自然译作“从”。
- source_word: עוֹד
  choice: 再
  rationale: 表示今后不得重复返回，与“绝不可”合用，简洁传达时间与重复意义。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华／上主
  rationale: 原文直接使用以色列上帝的专名；“雅威”较直接地音译该名，避免将其改为称号，同时不加入宗派性解释。
- issue: 禁令所说的“返回埃及”是王本人还是百姓
  choice: 王不可使百姓回埃及
  alternative: 王不可把百姓带回埃及
  rationale: 原文使用 שוב 的使役式，并以“百姓”为宾语，重点是王不得促成百姓返回；不进一步限定其手段是带领、差遣还是贸易安排，以保留原文范围。
- issue: 马匹与返回埃及之间的逻辑关系
  choice: 为了增添马匹而使百姓回埃及
  alternative: 不可使百姓回埃及，多多添置马匹
  rationale: לְמַעַן 明示目的关系，即返回埃及是为增加马匹；译文保留这一关系，不推断更具体的历史或政治背景。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“增添马匹”有意保留前后两处分属同一词根的呼应；“使百姓回埃及去”保留使役结构；引语用“绝不可再”自然表达希伯来语的强烈禁止。所有脚注标记均置于相关正文之后。
