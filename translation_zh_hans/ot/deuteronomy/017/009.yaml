base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/009.yaml
  text: And you shall come to the Levitical priests and to the judge who is in office in those days[a], and you shall inquire, and they shall declare to you the decision in the case.
translation:
  language: zh_hans
  text: 你要到利未人祭司和当时在任的审判官那里，求问他们；他们就会把判决[a]告知你。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译为“审判的话”；这个希伯来语表达指有权威的司法裁定。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָאתָ
  choice: 你要到……那里
  rationale: 连词加完成式在此法律指令中表达命令或义务；“要到……那里”自然保留前往指定审判机构的意思。
- source_word: הַכֹּהֲנִים הַלְוִיִּם
  choice: 利未人祭司
  rationale: 两个名词构成限定性的同位关系，指身属利未支派的祭司，而不是说所有利未人都是祭司。
- source_word: הַשֹּׁפֵט
  choice: 审判官
  rationale: 指负责司法裁断的官员；“审判官”比泛指性的“官长”更准确，也符合庄重的法律语域。
- source_word: אֲשֶׁר יִהְיֶה בַּיָּמִים הָהֵם
  choice: 当时在任的
  rationale: 原文直译为“在那些日子将会有的”，所指是案件发生时实际任职的审判官；此译简洁表达其制度性与时效性。
- source_word: וְדָרַשְׁתָּ
  choice: 求问他们
  rationale: 在司法语境中表示向有权威者寻求裁定或指示；补出“他们”使现代汉语指向清楚，而不改变原意。
- source_word: וְהִגִּידוּ לְךָ
  choice: 他们就会……告诉你
  rationale: 使役式在此表示正式告知裁决；汉语用“告诉”自然清楚，而其正式权威性由司法语境和“判决”体现。
- source_word: דְּבַר הַמִּשְׁפָּט
  choice: 判决
  rationale: 字面为“审判的话／事项”，在上下文中指有权威的司法裁定；正文采用自然凝练的法律用语，并以脚注保留原文字面表达。
