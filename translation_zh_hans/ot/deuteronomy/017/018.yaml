revisions:
- from: 他坐在自己国位的宝座上时，就要为自己在卷册上抄写一份这律法，抄自利未祭司面前的本子[a]。[b]
  to: 他坐在自己王国的王位上时，就要在书卷上为自己抄写这律法的一份副本，依据利未祭司[b]面前的文本[a]。
  rationale: 修订使汉语更自然，并以“自己王国的王位”“书卷”准确表达原文。对“从利未祭司面前”这一简省且有解释空间的短语，正文以“依据……面前的文本”表达其在语境中最可能的范本意义，脚注则保留字面形式与“在场抄写”的可能理解，避免把争议完全定死。脚注锚点也已移至各自所注释的词语或短语之后。
