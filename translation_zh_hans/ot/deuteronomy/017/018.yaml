  text: וְ/הָיָ֣ה כְ/שִׁבְתּ֔/וֹ עַ֖ל כִּסֵּ֣א מַמְלַכְתּ֑/וֹ וְ/כָ֨תַב ל֜/וֹ אֶת מִשְׁנֵ֨ה הַ/תּוֹרָ֤ה הַ/זֹּאת֙ עַל סֵ֔פֶר מִ/לִּ/פְנֵ֥י הַ/כֹּהֲנִ֖ים הַ/לְוִיִּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/018.yaml
  text: And when he sits on the throne of his kingdom[a], he shall write for himself in a book a copy of this law[b], from before the Levitical priests.
translation:
  language: zh_hans
  text: 他坐在自己王国的王位上时，就要在书卷上为自己抄写这律法的一份副本，依据利未祭司[b]面前的文本[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“从利未祭司面前”。这很可能指以放在祭司面前、或由祭司保管的正式文本为范本；也可理解为“在利未祭司面前抄写”。
    reason: lexical_alternative
  - marker: b
    text: “利未祭司”原文直译为“祭司，利未人”；也可译作“利未人的祭司”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כְשִׁבְתּוֹ
  choice: 他……时
  rationale: 以现代汉语的时间从句表达法律条文中的情形引入语；כְּ加不定式结构表示“当……时”。
- source_word: עַל כִּסֵּא מַמְלַכְתּוֹ
  choice: 坐在自己国位的宝座上
  rationale: 保留כִּסֵּא“宝座”的具体意象和מַמְלַכְתּוֹ“他的国位／王权”的所属关系；“国位”比“王国”更能在此处表达君王所居的统治地位。
- source_word: וְכָתַב לוֹ
  choice: 就要为自己……抄写
  rationale: 在法令语境中表达持续的规定或义务；לוֹ在这里是受益与反身意义，指君王为自己使用而抄写。
- source_word: מִשְׁנֵה
  choice: 一份……副本（以“抄写一份”表达）
  rationale: 此处指现有律法文本的副本，而非抽象的“重复”或另一套律法；汉语用“抄写一份”已自然包含制作副本之意。
- source_word: הַתּוֹרָה הַזֹּאת
  choice: 这律法
  rationale: 在君王条例的上下文中，תּוֹרָה指正在谈论的约法与训诲；“律法”既保留法律语境，也不额外界定其正典范围。
- source_word: עַל סֵפֶר
  choice: 在卷册上
  rationale: סֵפֶר可指书卷、文书或书写载体；古代语境下“卷册”较“书”具体，同时仍是普通现代读者能够理解的表达。
- source_word: מִלִּפְנֵי
  choice: 抄自……面前的本子
  rationale: 该短语字面是“从……面前／在……面前”，语境很可能指以放在祭司面前或由祭司保管的文本为范本。正文用自然汉语表达这一较可能的意思，脚注保留字面歧义。
- source_word: הַכֹּהֲנִים הַלְוִיִּם
  choice: 利未祭司
  rationale: 希伯来语的并置结构可自然理解为“属利未支派的祭司”；脚注保留形式上更贴近原文的译法。
theological_decisions:
- issue: 君王所抄תּוֹרָה的范围
  choice: 译为“这律法”
  alternative: “这训诲”或“这妥拉”
  rationale: 即时语境是约法中有关君王的规定。“这律法”最符合语域，同时不把经文未明说的正典范围强加进去。
- issue: מִלִּפְנֵי所表达的祭司保管或在场关系
  choice: 正文译作“抄自利未祭司面前的本子”
  alternative: “在利未祭司面前抄写”或字面译作“从利未祭司面前”
  rationale: 原文可表示范本位于祭司面前、由其保管，也可能强调在其面前进行。正文采用较符合上下文的范本含义，脚注说明字面形式与另一可能理解，以保留歧义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“国位的宝座”保留原文的王权意象；“卷册”反映古代书写载体，但避免生僻术语。正文中的[a]紧随有关祭司面前范本的短语；[b]置于句末，注释“利未祭司”的原文结构。
