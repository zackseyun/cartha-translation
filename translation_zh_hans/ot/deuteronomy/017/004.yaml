  text: וְ/הֻֽגַּד לְ/ךָ֖ וְ/שָׁמָ֑עְתָּ וְ/דָרַשְׁתָּ֣ הֵיטֵ֔ב וְ/הִנֵּ֤ה אֱמֶת֙ נָכ֣וֹן הַ/דָּבָ֔ר נֶעֶשְׂתָ֛ה הַ/תּוֹעֵבָ֥ה הַ/זֹּ֖את בְּ/יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/004.yaml
  text: and it is reported to you[a], and you hear of it, and you investigate thoroughly, and behold, it is true and certain that this abomination has been done in Israel,
translation:
  language: zh_hans
  text: 有人把这事告诉你，你也听说了，就要仔细查究。看哪，事情果然属实，确凿无疑[a]：这可憎之事已经发生在以色列中。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这事真实、确定。”
    reason: 保留 אֱמֶת נָכוֹן הַדָּבָר 较贴近形式的另一种表达，显示“真实”与“确定成立”的并列关系。
lexical_decisions:
- source_word: וְהֻגַּד לְךָ
  choice: 有人把这事告诉你
  rationale: 保留原文被动报告的含义，同时按现代汉语习惯用不定施事者“有人”表达；“这事”承接上文，并未增加新的内容。
- source_word: וְשָׁמָעְתָּ
  choice: 你也听说了
  rationale: שׁמע基本义为“听见”；这里指听到有关此事的消息，“听说”在现代汉语中自然贴切。
- source_word: וְדָרַשְׁתָּ הֵיטֵב
  choice: 就要仔细查究
  rationale: דרש在司法语境中指调查、查问，הֵיטֵב表示充分、彻底；“仔细查究”兼顾法律语境和通俗可懂性。
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留原文提示注意、引出调查结果的庄重话语标记。
- source_word: אֱמֶת נָכוֹן הַדָּבָר
  choice: 事情果然属实，确凿无疑
  rationale: 分别传达אֱמֶת的真实性与נָכוֹן的确定、成立之意，保留司法确认公式的双重强调。
- source_word: נֶעֶשְׂתָה
  choice: 已经发生
  rationale: 此处被动形式说明该行为确已实施；汉语说“可憎之事已经发生”比机械直译为“已经被做”自然。
- source_word: הַתּוֹעֵבָה הַזֹּאת
  choice: 这可憎之事
  rationale: “可憎”保留תּוֹעֵבָה在申命记中强烈的盟约性和道德否定意味，同时比“可憎恶之物”更符合现代汉语。
- source_word: בְּיִשְׂרָאֵל
  choice: 在以色列中
  rationale: 表明此事发生在以色列这一盟约群体之内，贴合原文范围含义。
theological_decisions:
- issue: 司法确认公式 אֱמֶת נָכוֹן הַדָּבָר 的表达
  choice: 事情果然属实，确凿无疑
  alternative: 这事真实、确定
  rationale: 所选译法保留“真实”与“确定成立”的两层确认，并以自然汉语呈现，不把司法调查扩展为额外的神学判断。
- issue: תּוֹעֵבָה 的力度
  choice: 可憎之事
  alternative: 令人厌恶的事
  rationale: “可憎”保留原词强烈的道德与盟约评价，避免将语气弱化为一般性的反感。
translation_notes:
  register: 采用现代、庄重而易懂的司法语体。“看哪”保留经文的郑重提示功能；全句以“告诉—听说—查究—确认”的次序呈现调查程序。
