  text: כִּֽי יִמָּצֵ֤א בְ/קִרְבְּ/ךָ֙ בְּ/אַחַ֣ד שְׁעָרֶ֔י/ךָ אֲשֶׁר יְהוָ֥ה אֱלֹהֶ֖י/ךָ נֹתֵ֣ן לָ֑/ךְ אִ֣ישׁ אוֹ אִשָּׁ֗ה אֲשֶׁ֨ר יַעֲשֶׂ֧ה אֶת הָ/רַ֛ע בְּ/עֵינֵ֥י יְהוָֽה אֱלֹהֶ֖י/ךָ לַ/עֲבֹ֥ר בְּרִיתֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/002.yaml
  text: If there is found among you[a], within one of your gates that Yahweh your God is giving you, a man or a woman who does what is evil in the eyes of Yahweh your God by transgressing his covenant[b],
translation:
  language: zh_hans
  text: 如果在你中间、在耶和华你神赐给你的其中一座城中[a]，发现有男人或女人行耶和华你神眼中看为恶的事，违背他的约[b]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“在你的一座城门内”；“城门”在这里可指城镇或城市。
    reason: lexical_alternative
  - marker: b
    text: 或译“破坏他的约”或“干犯他的约”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 如果
  rationale: 这里引出律例中的条件句；“如果”自然地表达假设前提。
- source_word: יִמָּצֵא
  choice: 发现有
  rationale: 保留尼פעל式的被动、非人称意味，同时符合现代汉语法律叙述的表达习惯。
- source_word: בְקִרְבְּךָ
  choice: 在你中间
  rationale: 指以色列共同体内部，保留原文的群体范围和盟约语境。
- source_word: בְאַחַד שְׁעָרֶיךָ
  choice: 在……任何一座城中
  rationale: “城门”在申命记中常转喻城镇及其管辖范围；正文采用自然汉语表达，脚注保留字面形式。
- source_word: אֲשֶׁר יְהוָה אֱלֹהֶיךָ נֹתֵן לָךְ
  choice: 耶和华你神赐给你的
  rationale: 保留申命记常见的盟约措辞；现在分词的持续意味在汉语中由语境自然承载。
- source_word: אִישׁ אוֹ אִשָּׁה
  choice: 男人或女人
  rationale: 明确保留原文成对列出的性别，不将其概括为泛指的“人”。
- source_word: אֲשֶׁר יַעֲשֶׂה אֶת הָרַע
  choice: 行……看为恶的事
  rationale: 将希伯来语“行那恶”译成自然且庄重的现代汉语，同时保留其道德判断。
- source_word: בְּעֵינֵי יְהוָה אֱלֹהֶיךָ
  choice: 耶和华你神眼中
  rationale: 保留原文“在……眼中”的评价性意象。
- source_word: לַעֲבֹר בְּרִיתוֹ
  choice: 违背他的约
  rationale: 准确表达 עבר 与“约”连用时的违反含义，不预先限定具体违犯了哪一条约款。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经传统中对神圣四字名的通行音译。
theological_decisions:
- issue: 违约措辞的性质
  choice: 译作“违背他的约”，不说明具体所违犯的约款
  alternative: “破坏他的约”或“干犯他的约”
  rationale: 本节只笼统陈述违约，下一节才说明具体罪行；如此可保留原文的递进及其神学张力，不引入后来的体系化解释。
translation_notes:
  register: 采用现代、庄重而清楚的律例文体。保留“在你中间”与后接地点短语的原文层次；以“耶和华你神”呈现申命记反复出现的盟约称谓。
