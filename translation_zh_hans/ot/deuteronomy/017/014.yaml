base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/014.yaml
  text: When you come into the land that Yahweh your God is giving you[a], and you take possession of it and live in it, and you say, “I will set a king over myself, like all the nations that are around me,”
translation:
  language: zh_hans
  text: 当你进入耶和华——你的上帝——赐给你的那地，取得那地并住在其中，又说：“我要为自己立一位王[a]，像我周围的各国一样”，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“我要在我之上设立一位王”。希伯来文直译为“我要在我之上立一位王”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי תָבֹא
  choice: 当你进入
  rationale: כִּי在此引出预期将发生的情境，译为“当”；בוא与“地”连用时自然译为“进入”。
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: 耶和华你上帝
  rationale: 以汉语通行音译“耶和华”保留神的专名；第二人称单数后缀译为“你”。
- source_word: נֹתֵן לָךְ
  choice: 赐给你的
  rationale: 分词表达上帝正在施行或确定要施行的赐予；“赐给”符合对象为上帝、宾语为土地的庄重现代汉语用法。
- source_word: וִירִשְׁתָּהּ
  choice: 占有那地
  rationale: ירשׁ在土地语境中指取得并占有；明确复指“那地”，避免连续代词造成歧义。
- source_word: וְיָשַׁבְתָּה בָּהּ
  choice: 并住在其中
  rationale: ישׁב在此表示定居、居住；“住在其中”简明自然。
- source_word: וְאָמַרְתָּ
  choice: 心里说
  rationale: 希伯来语仅为“你说”；汉语“心里说”自然表达主体形成并说出这一主张，但不改变引语内容。
- source_word: אָשִׂימָה עָלַי מֶלֶךְ
  choice: 我要为自己立一位王
  rationale: שׂים可指设立，עָלַי字面为“在我之上”；“为自己立一位王”保留百姓主动为自身设王的意味，同时符合汉语表达。
- source_word: כְּכָל הַגּוֹיִם אֲשֶׁר סְבִיבֹתָי
  choice: 像我周围的各国一样
  rationale: גּוֹיִם在此指周边各国，不宜带入后期“外邦人”的神学色彩；保留引语中的第一人称视角。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名；正文采用现代中文圣经读者最熟悉的专名音译“耶和华”，不以“主”这一称号替代。
- issue: 百姓提出设王是否在本句中受到评价
  choice: 保持中性陈述
  alternative: 译出责备或许可意味
  rationale: 本节只陈述未来情境和百姓的话，并未在此明说评价；译文不提前化解后文律法与相关叙事所呈现的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。保留第二人称单数语气，并以“我”维持引语视角。句末逗号显示本节语法和内容延续到下一节。
