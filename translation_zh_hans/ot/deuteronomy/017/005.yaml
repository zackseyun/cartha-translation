base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/005.yaml
  text: then you shall bring out to your gates that man or that woman who did this evil thing[a], that man or that woman, and you shall stone them with stones[b], and they shall die.
translation:
  language: zh_hans
  text: 就要把行这恶事的那男人或那女人带到你的城门口[a]；要用石头打死那男人或那女人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 古代以色列的城门口通常是公开审判和办理法律事务的地方。
    reason: cultural_note
lexical_decisions:
- source_word: וְהוֹצֵאתָ
  choice: 就要把……带到
  rationale: 连接词加完成式在法规程序中表示承接上一步的行动；“就要”自然传达顺序和命令语气。
- source_word: הָאִישׁ הַהוּא אוֹ אֶת הָאִשָּׁה הַהִוא
  choice: 那男人或那女人
  rationale: 保留希伯来文明确并列的男女称谓及指示语气，不泛化为“那人”。
- source_word: אֲשֶׁר עָשׂוּ
  choice: 行……的
  rationale: 希伯来文虽因并列对象使用复数动词，中文关系结构不标数；“行”符合庄重的法律语域。
- source_word: הַדָּבָר הָרָע הַזֶּה
  choice: 这恶事
  rationale: דָּבָר 在司法语境可指“事”或“案件”；“恶事”简洁自然，同时保留道德定性。
- source_word: אֶל שְׁעָרֶיךָ
  choice: 到你的城门口
  rationale: 原文为复数“你的城门”；这是分配性复数，指以色列各城的城门审判场所。中文用单数“城门口”更自然，文化背景交由脚注说明。
- source_word: וּסְקַלְתָּם בָּאֲבָנִים וָמֵתוּ
  choice: 都要用石头打死
  rationale: 把“用石头击打他们，他们便死”自然合并为现代中文的处刑表达，同时明确保留石头这一手段及死亡结果。
theological_decisions:
- issue: 性别明确的法律表述
  choice: 那男人或那女人；无论是男人还是女人
  alternative: 那个人
  rationale: 原文两次明确列出男性和女性，不宜用中性概称抹去这一对应结构。
- issue: 城门的司法功能
  choice: 城门口
  alternative: 公开审判的地方
  rationale: 正文保留原文具体的文化意象，不将其解释性改写为抽象地点；脚注说明其司法功能。
- issue: 死刑结果句的表达
  choice: 用石头打死
  alternative: 用石头打他们，他们就死了
  rationale: 中文合并表达清楚呈现法定刑罚及结果，并未增加执行主体或神学判断。
translation_notes:
  register: 采用现代、庄重而易懂的法规语体。“就要”承接前文程序；重复“男人……女人”以体现原文刻意的性别并列。标点和脚注位置使[a]解释“城门口”，[b]说明末句较直译的形式。
