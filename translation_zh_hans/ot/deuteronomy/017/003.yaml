base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/003.yaml
  text: and goes and serves other gods and bows down to them[a], or to the sun or to the moon or to all the host of heaven, which I have not commanded[b],
translation:
  language: zh_hans
  text: 去事奉别神，向它们下拜，或向太阳、或向月亮、或向天上万象[a]下拜，这是我未曾吩咐的[b]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “天上万象”直译可作“天上万军”，通常指天空中排列的众天体；在某些语境中，也可能使人联想到天上的众灵体。
    reason: lexical_alternative
  - marker: b
    text: “这是我未曾吩咐的”可能专指前面的“天上万象”，也可能概括事奉别神并向其下拜的整个行为。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: 去
  rationale: 在律法条件句中承接上一节的假设情形；用“去”比按叙事时态译为“去了”更符合现代汉语法律陈述。
- source_word: וַיַּעֲבֹד
  choice: 事奉
  rationale: עבד以神明为宾语时指敬拜性的服事；“事奉”保留其服事含义，也与随后表示身体动作的“下拜”有所区分。
- source_word: אֱלֹהִים אֲחֵרִים
  choice: 别神
  rationale: 直接表达“其他的神”，不加入原文没有明说的民族或地域色彩。
- source_word: וַיִּשְׁתַּחוּ לָהֶם
  choice: 向它们下拜
  rationale: 保留该动词所指的俯伏敬拜动作；代词依现代汉语对非人的受拜对象采用“它们”。
- source_word: וְלַשֶּׁמֶשׁ א֣וֹ לַיָּרֵחַ א֛וֹ לְכָל צְבָא הַשָּׁמַיִם
  choice: 又向太阳、月亮或天上万象下拜
  rationale: 首个连接词译作“又”，两个 אוֹ 的选择关系以“或”自然呈现；补出“下拜”使汉语句法清楚，同时不增加新的行为。
- source_word: לְכָל צְבָא הַשָּׁמַיִם
  choice: 天上万象
  rationale: 在太阳和月亮的语境中，主要指天空中的众天体；“万象”自然、庄重，并以脚注保留“天上万军”及可能涉及天上众灵体的词义空间。
- source_word: אֲשֶׁר לֹא צִוִּיתִי
  choice: 这是我未曾吩咐的
  rationale: 原文说的是“没有吩咐”，不径直改成“禁止”；“这”有意不明确限定先行项，使关系从句既可就近联系“天上万象”，也可概括前述偶像崇拜行为。
theological_decisions:
- issue: 末尾关系从句 אֲשֶׁר לֹא צִוִּיתִי 的管辖范围
  choice: 译作“这是我未曾吩咐的”，不明确限定“这”的范围
  alternative: 明确译为“这些天上万象，是我未曾吩咐人敬拜的”，或明确概括为“这一切都是我未曾吩咐的”
  rationale: 希伯来语从句可就近修饰“天上万象”，也可被理解为对前述事奉、下拜别神之举的整体否定。正文保留这种范围歧义，不替原文作神学上的裁定。
- issue: “未曾吩咐”是否应释为“明令禁止”
  choice: 保留“未曾吩咐”
  alternative: 译为“这是我所禁止的”
  rationale: 上下文确实谴责并处罚这种行为，但 צוה 前有否定词，字面表达的是“我没有吩咐”；不把它替换成另一个更强、却并非此处所用的“禁止”动词。
translation_notes:
  register: 采用现代、庄重而易懂的律法语体。本节在原句中延续上一节的条件句，因此以“去”起首，并保留句末逗号，显示句意尚在下一节继续。避免使用过度古雅的“跪拜之”或含义较窄的“星辰”，同时以脚注说明关键词义和句法歧义。
