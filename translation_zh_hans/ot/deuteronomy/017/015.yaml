source:
  edition: WLC
  text: שׂ֣וֹם תָּשִׂ֤ים עָלֶ֨י/ךָ֙ מֶ֔לֶךְ אֲשֶׁ֥ר יִבְחַ֛ר יְהוָ֥ה אֱלֹהֶ֖י/ךָ בּ֑/וֹ מִ/קֶּ֣רֶב אַחֶ֗י/ךָ תָּשִׂ֤ים עָלֶ֨י/ךָ֙ מֶ֔לֶךְ לֹ֣א תוּכַ֗ל לָ/תֵ֤ת עָלֶ֨י/ךָ֙ אִ֣ישׁ נָכְרִ֔י אֲשֶׁ֥ר לֹֽא אָחִ֖י/ךָ הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/015.yaml
  text: You shall surely set over yourself a king whom Yahweh your God chooses[a]. From among your brothers you shall set a king over yourself; you may not put over yourself a foreigner[b], one who is not your brother.
translation:
  language: zh_hans
  text: 你务要立雅威你的神所拣选的人作王，治理你。你要从你的弟兄中[a]立一人作王，治理你；不可立外族男子[b]治理你，就是那不是你弟兄的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弟兄”在这里是亲属式称呼，指以色列人中的一员，也就是本族同胞。
    reason: lexical_alternative
  - marker: b
    text: 或译“外族人”。希伯来原文直译为“外族男子”，下文又解释为“不是你弟兄的人”。
    reason: alternative_reading
lexical_decisions:
- source_word: שׂוֹם תָּשִׂים
  choice: 务要立
  rationale: 希伯来语以不定式绝对式加强未完成式，强调命令；“务要”既保留强调语气，也符合现代庄重汉语。
- source_word: עָלֶיךָ
  choice: 治理你
  rationale: 原义为“在你之上”。在立王的语境中，“作王，治理你”自然表达君王被立在百姓之上的统治关系；第二人称单数代表作为整体的以色列。
- source_word: מֶלֶךְ
  choice: 王
  rationale: 直接对应君王职分，简洁明确。
- source_word: אֲשֶׁר יִבְחַר יְהוָה אֱלֹהֶיךָ בּוֹ
  choice: 雅威你的神所拣选的人
  rationale: 关系从句限定将被立为王的人；“所拣选的”保留法律训令中未明确限定时态的表达。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译呈现四字神名，而不以“主”这一称号替代。
- source_word: מִקֶּרֶב אַחֶיךָ
  choice: 从你的弟兄中
  rationale: 保留原文“从……中间”及亲属称谓；此处“弟兄”指以色列共同体中的同胞，脚注予以说明。
- source_word: לֹא תוּכַל לָתֵת
  choice: 不可立
  rationale: 字面为“你不能立”，但法律语境表达禁止，因此用“不可”准确传达规范效力。
- source_word: אִישׁ נָכְרִי
  choice: 外族男子
  rationale: 保留 אִישׁ 的男性个体指称，并以“外族”表达不属于以色列共同体的人；这也契合“王”这一职分的语境。
- source_word: אֲשֶׁר לֹא אָחִיךָ הוּא
  choice: 就是那不是你弟兄的人
  rationale: 保留原文用亲属关系解释“外族男子”的结构，不将其概括改写为一般国籍术语。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；音译“雅威”保留专名性质，避免以称号取代。
- issue: אַחֶיךָ／אָחִיךָ 的盟约亲属语言
  choice: 弟兄／弟兄
  alternative: 以色列同胞；本族人
  rationale: 原文以阳性亲属称谓界定可作王者，译文保留这一措辞，并用脚注说明其群体所指，不把原文的亲属意象消解掉。
- issue: לֹא תוּכַל 的法律语气
  choice: 不可
  alternative: 不能
  rationale: 形式上可直译为“不能”，但本节是任命君王的规范，语用上是禁止；“不可”保留法律命令的力度。
translation_notes:
  register: 采用现代、庄重而易懂的法律训令语体。“务要”承载原文的强调形式；两次“作王，治理你”保留原文重复，而不为追求简洁将其删去。脚注标记放在各自实际解释的词语之后。
