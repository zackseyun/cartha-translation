base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/007.yaml
  text: The hand of the witnesses shall be first against him to put him to death[a], and afterward the hand of all the people[b]. So you shall purge the evil from your midst.
translation:
  language: zh_hans
  text: 见证人要首先动手，把他处死；随后全体民众也要动手。[a]这样，你要从你们中间除掉那恶。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“见证人的手要首先临到他……随后是全体民众的手”；这是法律用语，表明见证人须首先承担执行判决的责任，随后全体民众参与。
    reason: cultural_note
  - marker: b
    text: “从你们中间”也可译作“从你中间”；原文的“你”为单数，把整个以色列群体作为一个整体来称呼。
    reason: lexical_alternative
lexical_decisions:
- source_word: יַד הָעֵדִים
  choice: 见证人要……下手
  rationale: “手”在此构成法律语境中的行动用语，表示亲自参与执行判决；现代汉语“下手”既保留身体行动的意象，也自然表达由见证人首先执行。
- source_word: הָעֵדִים
  choice: 见证人
  rationale: 该词指司法程序中作证的人，不宜缩窄为仅仅提出控告的“控告者”。
- source_word: בּוֹ
  choice: 向他
  rationale: 介词与“手”连用，表示行动所针对的对象；“向他下手”符合现代汉语表达。
- source_word: בָרִאשֹׁנָה
  choice: 先
  rationale: 表达行动次序，强调见证人必须首先执行判决。
- source_word: לַהֲמִיתוֹ
  choice: 把他处死
  rationale: מות的使役式表示使其死亡；司法语境中“处死”比一般性的“杀死”更准确。
- source_word: וְיַד כָּל הָעָם
  choice: 随后众民也要下手
  rationale: 保留全体民众在见证人之后参与执行的意思；“也要下手”对应重复出现的“手”，同时避免生硬直译。
- source_word: בָּאַחֲרֹנָה
  choice: 随后
  rationale: 与“先”相对，清楚表达执行顺序。
- source_word: וּבִעַרְתָּ
  choice: 这样，你要……清除
  rationale: בער在申命记的法律套语中表示除去、清除，而非字面焚烧；“这样”体现前述判决所产生的结果。
- source_word: הָרָע
  choice: 那恶
  rationale: 保留希伯来文对“恶”的概括性表达，不擅自限定为恶人、罪行或某一种危害。
- source_word: מִקִּרְבֶּךָ
  choice: 从你中间
  rationale: 贴近申命记常见的盟约群体用语，也符合现代汉语；单数“你”保留原文把以色列视为整体来称呼的形式。
theological_decisions:
- issue: 申命记法律套语 וּבִעַרְתָּ הָרָע מִקִּרְבֶּךָ 的对象范围
  choice: 这样，你要从你中间清除那恶
  alternative: 这样，你要从你们中间除掉那恶人
  rationale: 原文明确说“那恶”，而不是直接说“那恶人”；译文保留罪恶、罪行及其在群体中影响之间的张力，不把公式缩窄为只指受刑者。
- issue: 见证人在死刑执行中的责任
  choice: 见证人先下手，随后众民也下手
  alternative: 由见证人首先负责执行死刑，随后全体民众参与
  rationale: 原文借重复的“手”具体描写行动次序，并强调作证者须先承担执行判决的责任；正文保留这一具象表达，脚注说明其法律意义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“下手”承接原文反复出现的“手”，但由脚注限定其司法执行含义；“处死”保持法律语域。“那恶”刻意保留原文公式的概括性；全句避免古奥的“尔等”“剪除”等表达。
