  yaml_path: translation/ot/deuteronomy/017/013.yaml
  text: And all the people shall hear and fear[a], and shall not act presumptuously again.
translation:
  language: zh_hans
  text: 所有百姓都要听见并惧怕[a]，不再狂妄行事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“就有所畏惧”。原文没有明说惧怕的对象；末句的动词含有蓄意、傲慢违抗的意思。
    reason: 保留“惧怕”对象未明的歧义，并说明与末句相关的词义色彩。
lexical_decisions:
- source_word: וְכָל הָעָם
  choice: 众百姓都
  rationale: 原文直译为“全体百姓”；“众百姓都”自然保留总体范围，不额外补出“以色列”。
- source_word: יִשְׁמְעוּ
  choice: 要听见
  rationale: שמע在此指百姓听闻这项判决及其执行；“听见”保留原文基本义和法律语境中的结果意味。
- source_word: וְיִרָאוּ
  choice: 并且惧怕
  rationale: 原文未说明惧怕的对象；“惧怕”既保持简洁庄重，也不把含义限定为惧怕上主或惧怕刑罚。
- source_word: וְלֹא יְזִידוּן
  choice: 不再狂妄行事
  rationale: זיד的使役词干在此表达蓄意、傲慢而违抗的行为；“狂妄行事”比单说“骄傲”更能体现实际的僭越与抗命。
- source_word: עוֹד
  choice: 不再
  rationale: עוֹד与否定词连用，表示这种行为今后不再发生；现代汉语用“不再”最为自然。
theological_decisions:
- issue: 审判所引发之惧怕的对象与性质
  choice: 只译作“惧怕”，不明确其对象
  alternative: 译作“敬畏上主”或“害怕刑罚”
  rationale: 希伯来文没有明说惧怕谁或什么，因此保留其可能兼指对上帝、权威和刑罚之惧的开放性。
translation_notes:
  register: 采用现代、庄重而易懂的法律叙事语体。“众百姓都”避免生硬的“所有人民”，“狂妄行事”准确传达公开僭越、蓄意违抗，而不引入特定宗派解释。
