  text: עַל פִּ֣י שְׁנַ֣יִם עֵדִ֗ים א֛וֹ שְׁלֹשָׁ֥ה עֵדִ֖ים יוּמַ֣ת הַ/מֵּ֑ת לֹ֣א יוּמַ֔ת עַל פִּ֖י עֵ֥ד אֶחָֽד־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/006.yaml
  text: On the testimony of two witnesses or three witnesses[a], the one to die shall be put to death[b]; he shall not be put to death on the testimony of one witness.
translation:
  language: zh_hans
  text: 要凭两个证人或三个证人的证言[a]，才可将那应被处死的人处死[b]；不可凭一个证人的证言将他处死。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “凭……的证言”直译为“凭……的口”；这是希伯来语法律用语，指依据证言或证据。
    reason: lexical_alternative
  - marker: b
    text: 或译：“将那要死的人处死”；指依法应受死刑的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל־פִּי
  choice: 凭……的证言
  rationale: 该短语字面为“在……口上”，在法律语境中指依据证人的证言或证据；译作“凭……的证言”自然且准确。
- source_word: שְׁנַיִם עֵדִים ... שְׁלֹשָׁה עֵדִים
  choice: 两个证人或三个证人
  rationale: 保留原文在两个数词后重复“证人”的法律措辞和郑重语气。
- source_word: יוּמַת
  choice: 处死
  rationale: מות的Hoph'al形态表达使役被动，即“被处死”，在本节司法语境中指依法执行死刑，而非仅仅“死亡”。
- source_word: הַמֵּת
  choice: 那该死的人
  rationale: 这是带定冠词的分词性表达，语义简略，指依法应受死刑的人。“那该死的人”贴近原文，同时没有像“已定罪的人”那样额外明说裁决已经作出。
- source_word: לֹא יוּמַת
  choice: 不可……将他处死
  rationale: 以“不可”表达法律禁令，并重复“处死”，对应原文同一动词的再次出现。
- source_word: עֵד אֶחָד
  choice: 一个证人
  rationale: 直译该单数短语，并与前面的“两个证人或三个证人”形成清楚对照。
theological_decisions:
- issue: 死刑法律语境中הַמֵּת的所指及语力
  choice: 理解为依法应受死刑的人，译作“那该死的人”
  alternative: “那被判死刑的人”；或按字面误解为“那个死人”
  rationale: 本节规定判处并执行死刑所需的证据标准，因此所指不是已经死亡的人。“被判死刑的人”虽明确，却比原文更直接地加入已经宣判的含义；所选译法保留原文简略表达及司法上的严肃性。
translation_notes:
  register: 采用现代、庄重而易懂的法律语体。“才可”明确呈现两个或三个证人是执行死刑的必要证据条件；分号保留前后肯定规定与否定禁令的平衡。脚注标记[a]、[b]均已置于正文对应位置。
