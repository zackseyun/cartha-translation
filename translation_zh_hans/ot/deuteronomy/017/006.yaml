revisions:
- from: 要凭两个证人或三个证人的证言[a]，才可将那该死的人处死[b]；不可凭一个证人的证言将他处死。
  to: 要凭两个证人或三个证人的证言[a]，才可将那应被处死的人处死[b]；不可凭一个证人的证言将他处死。
  rationale: 仅修订“那该死的人”为“那应被处死的人”，以避免“该死”在现代汉语中的道德谴责色彩，并更贴合原文在死刑法律语境下对该人的简略指称。其余句法、法律语体、证人重复及脚注锚点均可保留。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T04:57:15Z'
review_pass:
  verdict: revise
  source_fidelity: 译文准确表达了以两三名证人的证言作为处死依据、不得仅凭一名证人处死的法律规定，也保留了证人一词的重复和处死这一被动司法语义。不过“那该死的人”在现代汉语中通常带有强烈的道德谴责，容易被理解为“罪有应得的人”，不宜用来承载原文较为简略的“那要被处死者”。
  naturalness: 整体庄重通顺，适合现代法律性经文语体。“要凭……才可……”自然清楚。将“那该死的人”改为“那应被处死的人”可消除当代汉语中的贬义歧义。
  terminology: “证言”“处死”“证人”均恰当。“应被处死的人”既反映הַמֵּת在本句的未来/应然指向，也不把“已被判决”这一程序性结论明确加进正文。
  issues:
  - severity: medium
    issue: “那该死的人”具有不必要的现代汉语道德贬义。
    rationale: “该死”常指某人可憎、罪有应得，而非中性地指法律程序中要被处死者。原文的定冠词分词在此处指向面临死刑的人，但其表达本身较为简略；改为“那应被处死的人”更准确且更中性。
  revised_text: 要凭两个证人或三个证人的证言[a]，才可将那应被处死的人处死[b]；不可凭一个证人的证言将他处死。
