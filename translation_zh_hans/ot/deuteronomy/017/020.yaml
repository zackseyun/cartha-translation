  text: לְ/בִלְתִּ֤י רוּם לְבָב/וֹ֙ מֵֽ/אֶחָ֔י/ו וּ/לְ/בִלְתִּ֛י ס֥וּר מִן הַ/מִּצְוָ֖ה יָמִ֣ין וּ/שְׂמֹ֑אול לְמַעַן֩ יַאֲרִ֨יךְ יָמִ֧ים עַל מַמְלַכְתּ֛/וֹ ה֥וּא וּ/בָנָ֖י/ו בְּ/קֶ֥רֶב יִשְׂרָאֵֽל־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/020.yaml
  text: so that his heart may not be lifted up above his brothers[a], and so that he may not turn aside from the commandment to the right or to the left, in order that he may prolong his days in his kingdom, he and his sons, in the midst of Israel.
translation:
  language: zh_hans
  text: 免得他的心高过他的弟兄[a]，也免得他偏离这诫命，或向右或向左；好使他和他的儿子在以色列中在王位上长久执政。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弟兄”也可译作“以色列同胞”。原文使用盟约群体中的亲属称呼。
    reason: 说明“弟兄”在此处的群体性所指，同时保留原文措辞。
lexical_decisions:
- source_word: לְבִלְתִּי רוּם לְבָבוֹ
  choice: 免得他的心高过
  rationale: 两个“不致”目的结构以“免得”自然表达；保留“心”和“高过”的希伯来语意象，指君王内心自高，却不直接改写为解释性的“骄傲”。
- source_word: מֵאֶחָיו
  choice: 自己的弟兄
  rationale: 保留原文“弟兄”的盟约亲属语言；语境所指为同属以色列群体的人，另以脚注说明。
- source_word: וּלְבִלְתִּי סוּר
  choice: 也免得他偏离
  rationale: סוּר在诫命语境中表示离开规定的道路；“偏离”简洁自然，并保留顺服盟约的含义。
- source_word: מִן הַמִּצְוָה
  choice: 这诫命
  rationale: 保留单数形式；定冠词在上下文中回指君王所当遵守的整套神圣训令，中文用“这”使指代自然。
- source_word: יָמִין וּשְׂמֹאול
  choice: 向右或向左
  rationale: 保留原文表示任何方向都不可偏离的空间比喻。
- source_word: לְמַעַן יַאֲרִיךְ יָמִים עַל מַמְלַכְתּוֹ
  choice: 这样……便可……长久作王
  rationale: יַאֲרִיךְ יָמִים与王位表达结合，意思是其王权得以长久延续；译为“长久作王”比逐字的“在他的王国之上延长日子”更符合现代汉语，同时保持目的或结果关系。
- source_word: הוּא וּבָנָיו
  choice: 他和他的子孙
  rationale: בָּנִים字面为“儿子们”，在王朝承继语境中指继位的后嗣；“子孙”自然传达王位延续，但不排除其字面首先指儿子。
- source_word: בְּקֶרֶב יִשְׂרָאֵל
  choice: 在以色列中
  rationale: 自然表达“在以色列群体当中”，保留盟约群体的范围。
theological_decisions:
- issue: 君王与盟约群体的亲属关系
  choice: 弟兄
  alternative: 以色列同胞
  rationale: 原文明确使用“弟兄”，强调君王并非凌驾于盟约群体之上的另一类人；正文保留该意象，脚注交代其群体所指。
- issue: 王朝延续中בָּנָיו的范围
  choice: 子孙
  alternative: 儿子们
  rationale: 原词字面为“儿子们”，但此处涉及跨代王位延续，现代汉语“子孙”更自然地表达王朝后嗣。此选择不应被理解为另加无条件的王朝应许；经文仍将长久作王置于前述顺服目的之下。
- issue: לְמַעַן所表达的关系
  choice: 这样……便可
  alternative: 为要使
  rationale: 该词可带目的或预期结果色彩；“这样……便可”保留二者之间的张力，不把句子强化为机械性的保证。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“心高过”保留希伯来语关于内心自高的意象；分号呈现本节由禁止转向预期结果的结构。
