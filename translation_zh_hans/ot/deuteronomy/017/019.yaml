  naturalness: 整体庄重自然。将“他一生都要从中诵读”调整为“他一生的每一天都要从中阅读”，更清楚地表达“他一生所有的日子”，也避免“诵读”可能附加的朗读意味。以破折号处理“耶和华他的上帝”，符合现代汉语的同位说明习惯。
