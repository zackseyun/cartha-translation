base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/019.yaml
  text: And it shall be with him[a], and he shall read in it all the days of his life, so that he may learn to fear Yahweh his God, to keep all the words of this law and these statutes[c][b], to do them.
translation:
  language: zh_hans
  text: 这律法书要常在他身边；他一生的每一天都要从中阅读[a]，好让他学习敬畏耶和华[b]——他的上帝，谨守这律法的一切话和这些律例，并遵行它们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“在其中阅读”；也可译作“从中阅读”。
    reason: lexical_alternative
  - marker: b
    text: “耶和华”译自希伯来文的神名יהוה（YHWH），也常译作“雅威”。
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיְתָה עִמּוֹ
  choice: 这律法书要常在他身边
  rationale: 阴性单数主语承接上一节的“律法书副本”。“在他身边”保留持续陪伴、可随时取用的含义；补出“律法书”使本节单独阅读时指代清楚。
- source_word: וְקָרָא בוֹ
  choice: 他要从中诵读
  rationale: בּוֹ直译为“在其中”，用于书卷时自然指从其中阅读。“诵读”符合古代阅读书卷的语境，也比单纯“读”更庄重。
- source_word: כָּל יְמֵי חַיָּיו
  choice: 他一生都
  rationale: 以自然简洁的现代汉语表达“一生所有的日子”，保留终身持续的强调。
- source_word: לְמַעַן יִלְמַד
  choice: 好让他学习
  rationale: 准确表达目的关系，并保留“学习”这一过程性含义。
- source_word: לְיִרְאָה אֶת יְהוָה אֱלֹהָיו
  choice: 敬畏耶和华他的上帝
  rationale: “敬畏”保留יִרְאָה兼具畏惧、尊崇和顺服的 covenantal 张力；“耶和华”直接呈现神名יהוה。
- source_word: לִשְׁמֹר
  choice: 谨守
  rationale: 在律法语境中，שׁמר指留心遵守；“谨守”兼顾庄重语体和行为要求。
- source_word: כָּל דִּבְרֵי הַתּוֹרָה הַזֹּאת
  choice: 这律法的一切话
  rationale: 保留דִּבְרֵי的具体措辞以及תּוֹרָה在本段 covenantal 法律文本中的含义。
- source_word: הַחֻקִּים הָאֵלֶּה
  choice: 这些律例
  rationale: “律例”是现代中文圣经语体中清楚而庄重的法律术语，适合חֻקִּים。
- source_word: לַעֲשֹׂתָם
  choice: 并付诸实行
  rationale: 源词直义是“行它们”。“付诸实行”在现代汉语中自然表达把所读、所守的律法实际行出来，避免生硬的“做它们”。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 正文采用现代简体中文读者最熟悉的音译“耶和华”，并以脚注说明这是四字神名；不以“主”取代原文专名。
- issue: יִרְאָה在圣约语境中的含义
  choice: 敬畏
  alternative: 惧怕
  rationale: “敬畏”既不把该词弱化为一般尊敬，也不把它缩减为单纯恐惧，保留面对上帝的畏惧、尊崇与顺服之张力。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准普通话。“常在他身边”交代律法书持续伴随君王；“诵读—学习敬畏—谨守—实行”的结构尽量保留原文由阅读通向顺服实践的推进关系。
