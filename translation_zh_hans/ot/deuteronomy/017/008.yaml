  text: כִּ֣י יִפָּלֵא֩ מִמְּ/ךָ֨ דָבָ֜ר לַ/מִּשְׁפָּ֗ט בֵּֽין דָּ֨ם לְ/דָ֜ם בֵּֽין דִּ֣ין לְ/דִ֗ין וּ/בֵ֥ין נֶ֨גַע֙ לָ/נֶ֔גַע דִּבְרֵ֥י רִיבֹ֖ת בִּ/שְׁעָרֶ֑י/ךָ וְ/קַמְתָּ֣ וְ/עָלִ֔יתָ אֶל הַ/מָּק֔וֹם אֲשֶׁ֥ר יִבְחַ֛ר יְהוָ֥ה אֱלֹהֶ֖י/ךָ בּֽ/וֹ־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/008.yaml
  text: If a matter for judgment is too difficult for you—between bloodshed and bloodshed[a], between one legal claim and another, and between one injury and another[d][c][b], matters of dispute within your gates—then you shall arise and go up to the place that Yahweh your God will choose.
translation:
  language: zh_hans
  text: 如果在你城内有争讼事项，令你难以裁决——无论是血案与血案之间[a]、法律主张与法律主张之间[b]，还是伤害与伤害之间[c]——你就要起身，上到雅威你神所要选择的地方去。[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“血与血之间”，指辨别不同的流血案件，可能包括杀人或血债案件。
    reason: lexical_alternative
  - marker: b
    text: 或译：“案件与案件之间”或“诉讼与诉讼之间”。
    reason: lexical_alternative
  - marker: c
    text: “伤害”也可译为“灾病”、“患处”或“击打”。
    reason: lexical_alternative
  - marker: d
    text: “在你城内”原文直译为“在你城门中”。古代以色列城镇的城门通常是审理案件、处理公共事务的场所，因此此语也可指地方城镇或其司法辖区。
    reason: cultural_note
lexical_decisions:
- source_word: יִפָּלֵא מִמְּךָ דָבָר לַמִּשְׁפָּט
  choice: 有案件太难，你无法判决
  rationale: יִפָּלֵא מִמְּךָ表示事情超出审判者的判断能力；结合司法语境，译为“太难，你无法判决”比字面化的“奇妙”更准确自然。
- source_word: בֵּין דָּם לְדָם
  choice: 血案与血案之间
  rationale: 原文直译为“血与血之间”，在这里指需要区分的流血、杀人或血债案件；“血案”保留血的意象并明确司法语境。
- source_word: בֵּין דִּין לְדִין
  choice: 诉讼与诉讼之间
  rationale: דִּין可指诉讼、案件、主张或判决。“诉讼”保留其法律争议的广度，也避免预先限定为某种具体请求。
- source_word: וּבֵין נֶגַע לָנֶגַע
  choice: 伤害与伤害之间
  rationale: נֶגַע可指打击、伤害、灾病或患处；司法列举中“伤害”最贴切，但以脚注保留“灾病”的词义可能。
- source_word: דִּבְרֵי רִיבֹת
  choice: 争端
  rationale: 该短语指引发争讼、难以裁断的纠纷事项；“争端”简洁而具有法律语感。
- source_word: בִּשְׁעָרֶיךָ
  choice: 在你城门口
  rationale: 城门是古代以色列城镇处理公共事务和审判案件的惯常地点；保留具体文化意象，并用脚注说明。
- source_word: וְקַמְתָּ וְעָלִיתָ
  choice: 你就要动身，上到……去
  rationale: “动身”自然表达וְקַמְתָּ所标志的果断行动，“上到”保留עָלִיתָ的上行方向。
- source_word: הַמָּקוֹם אֲשֶׁר יִבְחַר
  choice: 所要选择的地方
  rationale: 未完成体在申命记这一前瞻性表述中自然指向耶和华将来指定的地点。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文圣经语域中对四字神名的通行音译，作为神的专名，而非以头衔替代。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。中文正文保留专名，并采用普通中文读者最熟悉的“耶和华”；“雅威”是较接近学术重构读音的另一译法。
- issue: נֶגַע在司法清单中的范围
  choice: 正文译“伤害”
  alternative: 灾病、患处
  rationale: 上下文是地方争端和司法裁断，“伤害”较符合语境；但原词也可用于灾病或皮肤患处，因此不排除这一歧义，并在脚注中注明。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“案件太难，你无法判决”清楚呈现司法情境；三个“……与……之间”保留希伯来文排比。正文保留“城门口”的历史文化意象，以脚注帮助普通读者理解。
