revisions:
- from: 如果有案件太难，你无法判决——无论是血案与血案之间[a]、诉讼与诉讼之间[b]，还是伤害与伤害之间[c]——这些在你城门口发生的争端[d]，你就要动身，上到耶和华你神所要选择的地方去。
  to: 如果在你城内有争讼事项，令你难以裁决——无论是血案与血案之间[a]、法律主张与法律主张之间[b]，还是伤害与伤害之间[c]——你就要起身，上到雅威你神所要选择的地方去。[d]
  rationale: 修订恢复“城门”作为地方司法辖区的文化语义，而不称争端在城门口发生；改善 משפט和דִּין相关表达的现代汉语自然度；并将四字神名统一译为“雅威”，对应POB的 Yahweh 决定。脚注保留血案、法律主张和נגע的必要词义范围及城门的文化背景。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T04:57:27Z'
review_pass:
  verdict: revise
  source_fidelity: 译文总体把握了 המשפט语境、三组“在……之间”的并列，以及前往雅威所拣选之处的命令。但“这些在你城门口发生的争端”把原文“在你城门（即地方城镇／司法辖区）中的争讼事项”缩窄为争端实际发生在城门口；神名也应与POB的 Yahweh 决定一致，译作“雅威”。
  naturalness: 原来的“如果有案件太难，你无法判决”略显断裂，“诉讼与诉讼之间”也不够符合现代汉语的法律搭配。修订为“有……争讼事项，令你难以裁决”及“法律主张与法律主张之间”，语义清晰且保持正式庄重的经文语体。
  terminology: “血案”可保留，并以脚注说明原文的字面表达及其血债／流血案件含义；נגע正文译“伤害”是可接受的审慎选择。“雅威”对应 Yahweh，而非以称号代替神名。
  issues:
  - severity: medium
    issue: “在你城门口发生的争端”将地点和语义限定得过窄。
    rationale: בִּשְׁעָרֶיךָ字面为“在你的城门中”，在此通常指以城门为司法场所的地方城镇或辖区；原文没有说争端必定“发生”在城门口。
  - severity: medium
    issue: 神名译为“耶和华”与本项目对 יְהוָה 译作 Yahweh 的既定决定不一致。
    rationale: 中文应采用对应 Yahweh 的专名音译“雅威”，以维持POB跨语言术语的一致性。
  - severity: low
    issue: “诉讼与诉讼之间”搭配生硬。
    rationale: דִּין在此可指法律主张、案件或诉讼；“法律主张与法律主张之间”更自然，并保留脚注中的替代可能。
