base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/017.yaml
  text: And he shall not multiply wives for himself[a], lest his heart turn away; and he shall not greatly multiply silver and gold for himself.
translation:
  language: zh_hans
  text: 他不可为自己多娶妻子[a]，免得他的心偏离；也不可为自己过多积聚金银。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他的心也不可偏离。”希伯来文也可理解为一项并列的禁令，而不一定是明确的目的或结果从句。
    reason: alternative_reading
lexical_decisions:
- source_word: יַרְבֶּה
  choice: 多娶／过多积聚
  rationale: 使役形在两处都表示使某物增多。结合各自宾语，译为“多娶”和“过多积聚”，既保留禁止过量的共同含义，也符合现代汉语搭配。
- source_word: נָשִׁים
  choice: 妻子
  rationale: 王权条例的语境表明这里指婚姻关系中的妻子，而非泛指女性。
- source_word: יָסוּר
  choice: 偏离
  rationale: סור表示转离、偏离；“心偏离”保留原文的方向性隐喻，又不擅自补出原文未明说的偏离对象。
- source_word: לְבָבוֹ
  choice: 他的心
  rationale: “心”保留希伯来语关于意志、思想和情感中心的惯用表达及其经文意蕴。
- source_word: כֶסֶף וְזָהָב
  choice: 金银
  rationale: “金银”是现代汉语中自然、庄重的固定搭配，准确涵盖原文具体的贵金属，也保留财富积聚的含义。
- source_word: מְאֹד
  choice: 过多
  rationale: 该词强化第二项禁令；“过多”在汉语中自然表达超量积聚，而不暗示完全禁止拥有财富。
theological_decisions:
- issue: 多娶妻子与心偏离之间的关系
  choice: 正文译作目的或结果警告：“免得他的心偏离”
  alternative: 并列禁令：“他的心也不可偏离”
  rationale: 上下文最自然地将心的偏离理解为多娶妻子的危险后果，但希伯来语句法也容许将其读作并列禁令，因此以脚注保留另一种可能，不补出“离弃耶和华”等原文未明说的对象。
translation_notes:
  register: 采用现代、庄重而易懂的法律训令语体。“不可”为整节提供清楚的规范语气；“多娶妻子”和“过多积聚金银”符合现代汉语，同时体现两处 יַרְבֶּה 的语义呼应。
