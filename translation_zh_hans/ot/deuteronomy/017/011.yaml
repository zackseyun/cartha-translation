base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/011.yaml
  text: According to the instruction that they give you[a], and according to the judgment that they tell you, you shall do; you shall not turn aside from the word that they declare to you[b], to the right or to the left.
translation:
  language: zh_hans
  text: 你要按照他们给你的训示[a]，按照他们告诉你的判决去做；不可偏离他们向你宣布的话[b]，无论向右或向左。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “训示”也可译为“律法”或“教导”；希伯来语为 torah。
    reason: lexical_alternative
  - marker: b
    text: “话”也可译为“事项”或“裁决”。
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל פִּי
  choice: 按照
  rationale: 这是表示依照、遵从的法律语境惯用语；译作“按照”自然地表达其约束力，不拘泥于“口”的字面形象。
- source_word: הַתּוֹרָה
  choice: 训示
  rationale: תּוֹרָה可指教导、指示或律法；本节特指祭司和审判官针对案件所作的权威指示。“训示”既保留教导之义，也避免将其过度限定为成文律法。
- source_word: אֲשֶׁר יוֹרוּךָ
  choice: 他们给你的
  rationale: ירה的使役形在此表示指教、指示；与“训示”搭配译为“给你的”，中文自然，并避免“训示他们训示你的”一类重复。
- source_word: הַמִּשְׁפָּט
  choice: 判决
  rationale: מִשְׁפָּט在司法语境中指作出的裁断或判决；“判决”清楚保留法律语域。
- source_word: אֲשֶׁר יֹאמְרוּ לְךָ
  choice: 他们告诉你的
  rationale: 忠实表达אָמַר“说、告诉”的普通含义，也符合当事人获知判决的语境。
- source_word: תַּעֲשֶׂה
  choice: 去做
  rationale: 此处未完成式具有命令和义务色彩；放在“你要……去做”结构中，既自然又明确表达必须遵行。
- source_word: לֹא תָסוּר
  choice: 不可……偏离
  rationale: סוּר表示转离、偏离；“不可偏离”保留禁令语气，并能与后面的左右方向意象自然结合。
- source_word: הַדָּבָר
  choice: 话
  rationale: דָּבָר可指话、事情或裁决；“话”保留原文宽泛而庄重的单数表达，语境已表明这是权威宣告。
- source_word: אֲשֶׁר יַגִּידוּ לְךָ
  choice: 他们向你宣布的
  rationale: נגד的使役形表示告知、宣明；“宣布”比一般的“告诉”更符合正式司法语境，并保留与前半句动词的差异。
- source_word: יָמִין וּשְׂמֹאל
  choice: 向右或向左
  rationale: 保留原文以左右两方表示任何方向都不得偏离的固定意象，同时符合现代汉语表达。
theological_decisions:
- issue: 对祭司和司法权威的服从范围
  choice: 将本节译为必须遵行他们针对当前案件所给出的权威训示和判决。
  alternative: 把本节表述为后来任何宗教机构都拥有不受限制或绝无错误的权威。
  rationale: 上下文讨论以色列圣约群体中的司法程序。译文应保留本节明确要求服从的力度，却不加入希伯来文本未曾说明的后世教会论主张。
translation_notes:
  register: 采用现代、庄重而易懂的法律语体。“按照……按照……”保留原文平行结构；末句调整为自然汉语词序，同时保留“向右或向左”的希伯来意象。
