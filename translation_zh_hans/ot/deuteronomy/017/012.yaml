  text: וְ/הָ/אִ֞ישׁ אֲשֶׁר יַעֲשֶׂ֣ה בְ/זָד֗וֹן לְ/בִלְתִּ֨י שְׁמֹ֤עַ אֶל הַ/כֹּהֵן֙ הָ/עֹמֵ֞ד לְ/שָׁ֤רֶת שָׁם֙ אֶת יְהוָ֣ה אֱלֹהֶ֔י/ךָ א֖וֹ אֶל הַ/שֹּׁפֵ֑ט וּ/מֵת֙ הָ/אִ֣ישׁ הַ/ה֔וּא וּ/בִֽעַרְתָּ֥ הָ/רָ֖ע מִ/יִּשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/012.yaml
  text: But the man who acts presumptuously by not listening to the priest who stands there to minister before Yahweh your God[a], or to the judge—that man shall die[c][b]. So you shall purge the evil from Israel.
translation:
  language: zh_hans
  text: 但那人若狂妄行事，不听从那站在那里侍奉耶和华你上帝的祭司，或不听从审判官，那人就必须死。这样，你就从以色列中除掉这恶。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָאִישׁ
  choice: 但那人
  rationale: 承接上文的司法程序，并转向拒不服从者；保留原文阳性单数的个体指称。
- source_word: יַעֲשֶׂה בְזָדוֹן
  choice: 狂妄行事
  rationale: בְזָדוֹן在此表示明知而故意、傲慢抗命，不是无意过失；“狂妄行事”兼顾法律与道德色彩。
- source_word: לְבִלְתִּי שְׁמֹעַ אֶל
  choice: 不听从
  rationale: שׁמע在司法语境中不仅指听见，也包含听取并服从；“听从”自然保留这两层含义。
- source_word: הָעֹמֵד לְשָׁרֶת שָׁם אֶת יְהוָה
  choice: 那站在那里侍奉耶和华……的
  rationale: 保留“站在那里”和祭司履行圣职的含义；שרת的宾语由אֶת直接引出，因此译作“侍奉耶和华”而非增添“在……面前”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名形式呈现四字神名，区别于称号“主”。
- source_word: אוֹ אֶל הַשֹּׁפֵט
  choice: 或不听从审判官
  rationale: 补出汉语中为清晰表达所需的“不听从”；“审判官”突显其在本段中的正式司法职权。
- source_word: וּמֵת הָאִישׁ הַהוּא
  choice: 那人就必须死
  rationale: 此处是法律判罚的必然后果；“必须死”比仅描述结果的“就会死”更准确。
- source_word: וּבִעַרְתָּ הָרָע מִיִּשְׂרָאֵל
  choice: 这样，你就从以色列中除掉这恶
  rationale: בער在申命记法律套语中指从群体中清除恶；“这恶”保留原文名词表达，不擅自改成“恶人”。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用神的专名而非“主”这一称号；“耶和华”是现代中文中广为识别的专名形式，同时不将其改写为称号。
- issue: “除掉这恶”所指为何
  choice: 保留抽象表达“这恶”
  alternative: 除掉那恶人
  rationale: הָרָע在语法上可理解为“恶”或语境中的“恶者”；直译为“这恶”保留原文的概括性及其与具体处刑之间的张力。
- issue: 犯罪者的性别与单数表达
  choice: 那人
  alternative: 那个人／任何人
  rationale: אִישׁ及后续הָאִישׁ הַהוּא均为阳性单数；“那人”准确而自然，不把法律个案改写成复数或完全泛化的结构。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“狂妄行事”“听从”“审判官”“除掉这恶”保留申命记司法文本的正式语域，同时避免过度古雅。原文关键含义已能在正文自然呈现，因此不设脚注。
