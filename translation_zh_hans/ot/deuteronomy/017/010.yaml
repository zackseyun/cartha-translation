  text: וְ/עָשִׂ֗יתָ עַל פִּ֤י הַ/דָּבָר֙ אֲשֶׁ֣ר יַגִּ֣ידֽוּ לְ/ךָ֔ מִן הַ/מָּק֣וֹם הַ/ה֔וּא אֲשֶׁ֖ר יִבְחַ֣ר יְהוָ֑ה וְ/שָׁמַרְתָּ֣ לַ/עֲשׂ֔וֹת כְּ/כֹ֖ל אֲשֶׁ֥ר יוֹרֽוּ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/010.yaml
  text: You shall act according to the word that they declare to you from that place which Yahweh will choose[a], and you shall be careful to do according to all that they instruct you.
translation:
  language: zh_hans
  text: 你要照着他们从雅威将要选择的那地方向你宣告的话[a]去行；要谨慎，照着他们所指教你的一切去行。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“裁决。”希伯来语“话”也可指“事情”；在司法语境中可指“裁决”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: 你要……去做
  rationale: 动词 עשה 含义宽泛，可指“做、行”。这里与“照着……的话”搭配，译为“去做”自然，并保留法律命令的语气。
- source_word: עַל פִּי הַדָּבָר
  choice: 照着……的话
  rationale: עַל־פִּי 表示“按照、依据”；דָּבָר 可指“话、事情、裁决”。正文保留“话”这一较宽泛的表达，并在脚注说明司法语境中的可能含义。
- source_word: יַגִּידוּ לְךָ
  choice: 向你宣布
  rationale: נגד 的使役词干常表示“告知、宣布”。司法语境中“宣布”能体现正式且有权威的传达。
- source_word: מִן הַמָּקוֹם הַהוּא אֲשֶׁר יִבְחַר יְהוָה
  choice: 从耶和华所选择的那地方
  rationale: 保留“从那地方”的来源含义及申命记中央圣所的语境；未完成式 יִבְחַר 在前瞻性语境中可表达将来的选择，中文“所选择的”自然涵盖这一指向。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代汉语圣经读者熟悉的神名音译“耶和华”，将专名与“主”这一称号区分开来。
- source_word: וְשָׁמַרְתָּ לַעֲשׂוֹת
  choice: 都要谨慎遵行
  rationale: שׁמר 加不定式表示小心持守并实行。“谨慎遵行”在现代庄重汉语中清楚表达认真服从。
- source_word: כְּכֹל אֲשֶׁר יוֹרוּךָ
  choice: 他们指示你的一切
  rationale: כְּכֹל אֲשֶׁר 强调全面依从；ירה 的使役词干在法律语境中指教导、指导或指示。“指示”保留权威性，也不局限于课堂教学。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。中文正文采用广为人知且能作为专名使用的“耶和华”；“雅威”是较贴近现代学界重建发音的另一译法。
- issue: 司法权威所宣布内容的性质
  choice: 话
  alternative: 裁决
  rationale: דָּבָר 本身可指“话、事情”，在本段司法语境中也可能特指“裁决”。正文保留词义的宽度，脚注交代较具体的司法理解，避免把原文的多义性静默缩窄。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“宣布”体现正式司法语境，“谨慎遵行”保留命令的全面性与严肃性；句中脚注标记与脚注完全对应。
