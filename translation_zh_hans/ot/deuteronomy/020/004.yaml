base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/004.yaml
  text: For Yahweh your God is the one who goes with you to fight for you against your enemies[a], to save you.
translation:
  language: zh_hans
  text: 因为雅威——你们的上帝——与你们同去，为你们同仇敌争战，以拯救你们。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “拯救”也可译作“解救”或“使你们得胜”。原文动词可指救援、解救；在这里的战争语境中，也包含使人得胜的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文并说明不可惧怕的理由；现代汉语用“因为”自然保留解释性的逻辑关系。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以常见的现代汉语音译呈现四字神名，保留其作为以色列之上帝专名的性质，而不以称号替代。
- source_word: אֱלֹהֵיכֶם
  choice: 你们的上帝
  rationale: 准确表达构造形式及第二人称阳性复数后缀，也符合对全体以色列人的复数称呼。
- source_word: הַהֹלֵךְ עִמָּכֶם
  choice: 与你们同去的
  rationale: 将带定冠词的分词结构译作名词化短语，保留持续、描述性的意味，并为“正是”所强调。
- source_word: לְהִלָּחֵם לָכֶם
  choice: 要为你们……争战
  rationale: “为你们”表达利益与代行关系；“争战”比“打仗”更庄重，也准确体现军事语境。
- source_word: עִם אֹיְבֵיכֶם
  choice: 与仇敌争战
  rationale: עִם本义常为“与”，在争战语境中表示交战对象；汉语“与……争战”自然表达敌对关系。
- source_word: לְהוֹשִׁיעַ אֶתְכֶם
  choice: 拯救你们
  rationale: 保留ישׁע使役式“施行拯救、解救”的广义，同时在本节战争语境中也可包含使其得胜之意。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名，故以音译保留其专名性质。“雅威”较接近学界通常重构的读音；不以“主”这一称号替代。
- issue: לְהוֹשִׁיעַ在战争语境中的范围
  choice: 拯救你们
  alternative: 解救你们；使你们得胜
  rationale: “拯救”保留该动词较宽的救援与救赎意味，同时不排除本处具体所指的战场解救和胜利。脚注列出语境性译法，以免正文过度收窄。
- issue: 神同行与争战的主语强调
  choice: “与你们同去的，正是……；他要……”
  alternative: “雅威你们的上帝与你们同去，为你们……”
  rationale: 原文用带定冠词的分词修饰神，并接目的不定式。倒装与“正是”较清楚地保留“他就是那位同行者”的强调，又不把目的关系解释得超出原文。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。用“你们”保留原文复数对象；“同去”“争战”“拯救”维持经文的肃穆语体，但避免生硬古语。脚注标记置于其所解释的“拯救你们”之后。
