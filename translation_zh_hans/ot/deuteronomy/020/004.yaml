    rationale: הַהֹלֵךְ is a participle (“the one who goes/is going with you”), while לְהִלָּחֵם and לְהוֹשִׁיעַ are infinitives, with the latter naturally expressing the saving purpose/result in this context. “以拯救你们” represents this relation without imposing a future tense.
