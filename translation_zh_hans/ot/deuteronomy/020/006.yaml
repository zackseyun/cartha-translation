base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/006.yaml
  text: And who is the man who has planted a vineyard and has not yet enjoyed its fruit? Let him go and return to his house[a], lest he die in the battle and another man enjoy its fruit.
translation:
  language: zh_hans
  text: 又有谁栽种了葡萄园，还没有开始享用其中的出产呢？他当回家去[a]，免得他死在战场上，别人却享用其中的出产。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较形式化地译作“还没有启用它”。这里的希伯来语动词指首次使葡萄园进入日常使用，很可能是指在最初若干年受到限制后开始享用其出产（参利未记19:23–25）。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִי הָאִישׁ
  choice: 又有谁
  rationale: 承接前文逐项列举的免役情形；中文无需直译“哪个男人”，上下文已明确所指为参战男子。
- source_word: נָטַע כֶּרֶם
  choice: 栽了葡萄园
  rationale: 准确表达已经完成、且与当前情况相关的栽种行为。
- source_word: וְלֹא חִלְּלוֹ
  choice: 还没有开始享用园中的出产
  rationale: 此处חלל并非通常意义上的“亵渎”，而是指使葡萄园进入日常使用、开始从中受益；结合利未记19:23–25，很可能体现为享用其出产。“开始”保留首次使用之意，“园中的出产”避免把希伯来语所未明说的“果子”限定得过窄。
- source_word: יֵלֵךְ וְיָשֹׁב לְבֵיתוֹ
  choice: 他可以回家去
  rationale: 在军役豁免条例中表达准许并指示此人离队返家，现代汉语如此表述自然简洁。
- source_word: פֶּן יָמוּת בַּמִּלְחָמָה
  choice: 免得他阵亡
  rationale: “免得”对应פן的防范语气；“阵亡”自然表达在这场战事中死亡。
- source_word: וְאִישׁ אַחֵר יְחַלְּלֶנּוּ
  choice: 别人却享用园中的出产
  rationale: 与前一处חלל保持同一语义，并以“却”自然显出本人未能受益、反由他人受益的反差。
theological_decisions: []
