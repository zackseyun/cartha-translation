- from: 又有谁栽了葡萄园，还没有开始享用园中的出产呢？他可以回家去[a]，免得他阵亡，别人却享用园中的出产。
  to: 又有谁栽种了葡萄园，还没有开始享用其中的出产呢？他当回家去[a]，免得他死在战场上，别人却享用其中的出产。
  rationale: 修订仅加强条例中返家的指示语气，并以较中性的“死在战场上”贴近原文；保留“享用其中的出产”以自然表达该动词在葡萄园语境下开始从中受益的含义。脚注保留“启用”这一较形式化、范围较宽的替代译法及其与利未记19:23–25的关联。
