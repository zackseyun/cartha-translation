base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/015.yaml
  text: Thus you shall do to all the cities that are very far from you[b][a], which are not among the cities of these nations.
translation:
  language: zh_hans
  text: 你要照样[a]对待一切离你很远、不属于这些国的城[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这样”或“如此”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译：“不是出自这些国的城”；意思是这些城不属于刚才所说的那些国。
    reason: lexical_alternative
lexical_decisions:
- source_word: כֵּן
  choice: 照样
  rationale: 承接上文所述的处置方式；“照样”在现代汉语中自然、简洁，也保留法律训令的承接作用。
- source_word: תַּעֲשֶׂה לְכָל הֶעָרִים
  choice: 你要……对待一切……城
  rationale: 未完成式在此具有训令语气，译作“要”；介词 לְ 标明行动所针对的对象，汉语用“对待”可自然表达，而不必生硬直译为“向……做”。
- source_word: הָרְחֹקֹת מִמְּךָ מְאֹד
  choice: 离你很远
  rationale: 保留空间距离以及 מְאֹד 的加强语气；“离你很远”是现代汉语的自然表达。
- source_word: אֲשֶׁר לֹא מֵעָרֵי הַגּוֹיִם הָאֵלֶּה הֵנָּה
  choice: 并不属于这些国的城
  rationale: מִן 在这里表达归属或类别上的排除；“不属于”清楚说明这些城不在刚提到的诸国之城范围内。הֵנָּה 的强调由“这些”自然承载。
- source_word: הַגּוֹיִם
  choice: 国
  rationale: 上下文是城邑与战争法规，“国”能表达相关民族政治群体，又避免带入后期语境中“外邦人”的专门含义。
theological_decisions:
- issue: 远方城邑与这些国之城的适用范围之别
  choice: 直陈上文处置方式适用于远方且不属于这些国的城
  alternative: 在本节中补述上文的围城条件，或将其泛化为对一切外国城邑的原则
  rationale: 本节的功能是界定前述条例的适用范围。译文保留这一军事法律上的区分，不弱化其含义，也不把相邻经文的细节增补进来。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“照样对待”既承接上文，又避免生硬的逐词表达；整体保持法律训令的直接语气。
