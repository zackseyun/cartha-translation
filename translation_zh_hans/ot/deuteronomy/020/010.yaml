review_pass:
  verdict: revise
  source_fidelity: 正文的“临近……要与它交战时”准确反映 כִּי、תִקְרַב 和 לְהִלָּחֵם עָלֶיהָ。但“宣告和平的条件”把 לְשָׁלוֹם 所表达的和平提议具体化为“条件”；原文在本节本身未明说条件。
  naturalness: “你……时，就要……”的法律指令语体自然庄重。“向它提出和平的提议”在现代汉语中清晰，也较好表达战前主动提出和平的动作。
  terminology: “和平的提议”保留 שָׁלוֹם 的核心意义，不预断为投降条件、条约条件或求和。“向它求和”则可能表示己方向对方请求和平，弱化了原文中向该城发出和平呼告／提议的方向性，因此不宜作为脚注替代译法。
  issues:
  - severity: medium
    issue: “宣告和平的条件”过度具体化。
    rationale: לְשָׁלוֹם 直指“为和平／和平地”，在此可理解为提出或宣告和平；“条件”虽可由上下文联想，却不是本节明示的词义。
  - severity: medium
    issue: 脚注“向它求和”改变了动作的语用方向。
    rationale: “求和”通常表示向对方请求和平，可能暗示说话者处于求和地位；原文则命令以色列人向所临近的城发出和平信息或提议。
  revised_text: 你临近一座城，要与它交战时，要向它提出和平的提议。[a]
