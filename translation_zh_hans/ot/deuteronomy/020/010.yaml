- from: 你临近一座城，要与它交战时，就要向它宣告和平的条件。[a]
  to: 你临近一座城，要与它交战时，要向它提出和平的提议。[a]
  rationale: 以“提出和平的提议”表达 קרא…לשלום 在战前语境中的行动，同时避免将“和平”擅自限定为“和平的条件”。脚注保留较贴近原文字面及“宣告”义的可行译法。
  reviewer_model: gpt-5.6-terra
