  yaml_path: translation/ot/deuteronomy/020/010.yaml
  text: When you draw near to a city to fight against it[a], you shall call out to it for peace.
translation:
  language: zh_hans
  text: 你临近一座城，要与它交战时，要向它提出和平的提议。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“向它宣告和平。”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ……时
  rationale: 此处引出法律指令所设定的情境，主要是时间或场合意义；用“……时”比“如果”更自然，也不把它译成原因从句。
- source_word: תִקְרַב
  choice: 临近
  rationale: 保留קרב所表达的向城靠近之意，并符合庄重而清楚的现代汉语。
- source_word: עִיר
  choice: 一座城
  rationale: 单数名词在这一概括性的法律情境中是不定指；量词“座”符合现代汉语习惯。
- source_word: לְהִלָּחֵם עָלֶיהָ
  choice: 要与它交战
  rationale: לחם在这里指作战；עַל标明敌对对象。译作“与它交战”自然清楚，而“它”承接“城”。
- source_word: וְקָרָאתָ אֵלֶיהָ
  choice: 就要向它宣告
  rationale: קרא可指呼喊或宣告；在战前向城传达信息的语境中，“宣告”较自然，同时不具体限定传达方式。
- source_word: לְשָׁלוֹם
  choice: 和平的条件
  rationale: 字面结构是“为和平／向和平”，在本段战争法规中指向该城提出和平安排或条件；正文采用符合现代汉语的语境义，并以脚注保留较贴近形式的译法。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重、易懂的法律指令语体。“你……时，就要……”清楚呈现情境与命令的关系；不将“和平”进一步解释为投降、臣服或盟约，以免超出本节措辞。
