  text: וּ/נְתָנָ֛/הּ יְהוָ֥ה אֱלֹהֶ֖י/ךָ בְּ/יָדֶ֑/ךָ וְ/הִכִּיתָ֥ אֶת כָּל זְכוּרָ֖/הּ לְ/פִי חָֽרֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/013.yaml
  text: And Yahweh your God will give it into your hand[a], and you shall strike down all its males with the edge of the sword.
translation:
  language: zh_hans
  text: 耶和华你的神必把城交在你手中，你要用刀刃击杀城里所有的男性[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文用的是明确指“男性”的词，并非泛指“人”；原文没有在这里另行限定年龄或身份。
    reason: 说明原文的性别限定，避免把“男性”理解成泛称，同时不超出词语本身所表达的范围。
lexical_decisions:
- source_word: וּנְתָנָהּ
  choice: 必把城交
  rationale: 动词 נתן 带阴性单数宾语后缀，所指为前文的城；结合上下文的连续叙述，译作“必把城交”既表达随后发生的行动，也使中文指代清楚。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 按希伯来文四字神名音译为“耶和华”，保留其作为上帝专名的性质，不以称号替代。
- source_word: אֱלֹהֶיךָ
  choice: 你的神
  rationale: 这是带第二人称阳性单数后缀的形式，直译为“你的神”，保留对以色列受命者的直接称呼。
- source_word: בְּיָדֶךָ
  choice: 交在你手中
  rationale: 希伯来语习语表示交由某人掌控；中文“交在你手中”既保留“手”的意象，也自然表达控制权的转移。
- source_word: וְהִכִּיתָ
  choice: 你要……击杀
  rationale: נכה 的使役式在军事语境中指致命地击打；“击杀”保留其明确的致死含义，不弱化为单纯“击败”。
- source_word: כָּל זְכוּרָהּ
  choice: 城里所有的男性
  rationale: כָּל 保留全称范围；זְכוּר 指男性，所带阴性单数后缀回指该城。此译法不把性别明确的词泛化为“人”，也不额外限定年龄或社会身份。
- source_word: לְפִי חָרֶב
  choice: 用刀刃
  rationale: 该习语字面为“按着刀的口”，指以刀刃杀戮；“用刀刃”保留原文意象，同时符合现代汉语表达。
theological_decisions:
- issue: 如何翻译由上帝交付城邑并命令杀戮的战争叙述
  choice: 直接译出“耶和华你的神必把城交在你手中”以及“击杀城里所有的男性”
  alternative: 弱化为“战胜他们”，或增添有关审判、圣战及道德解释的说明
  rationale: 原文明确把城被交付归于耶和华，并明确吩咐对城中所有男性采取致命行动。译文保留这一严峻内容，不以委婉语淡化，也不加入本节没有明说的神学辩护。
- issue: וּנְתָנָהּ 与后一句命令之间的时态和逻辑关系
  choice: 译作“必把……交……，你要……”以呈现顺承关系
  alternative: 译作条件性的“当……交给你时”，或仅译作一般现在时“交给你”
  rationale: 前缀连词及动词形式承接前文行动次序；“必……，你要……”保留未来顺承和确定语气，而不额外把本句改写成显式条件句。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“把城交在你手中”保留希伯来语的手之意象；“击杀”清楚呈现军事语境中的致命行动；“男性”比“男人”更准确地对应原文按性别分类的用词。
