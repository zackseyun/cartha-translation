  text: רַ֗ק מֵ/עָרֵ֤י הָֽ/עַמִּים֙ הָ/אֵ֔לֶּה אֲשֶׁר֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ נֹתֵ֥ן לְ/ךָ֖ נַחֲלָ֑ה לֹ֥א תְחַיֶּ֖ה כָּל נְשָׁמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/016.yaml
  text: But from the cities of these peoples that Yahweh your God is giving you as an inheritance[a], you shall not let any living thing remain alive.
translation:
  language: zh_hans
  text: 只是，至于这些民族的城邑——就是雅威你的上帝赐给你作产业的那些城邑——你不可让任何有气息的存活。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“任何活物。”希伯来文作“凡有气息的”；严格直译为“每一气息”。
    reason: 说明 כָּל נְשָׁמָה 的另一自然译法，并保留其“气息／呼吸”的具体希伯来文意象及所指范围的概括性。
lexical_decisions:
- source_word: רַק
  choice: 只是
  rationale: 在此承接并转折于前文对远方城邑的规定，表示以下情况属于例外；“只是”兼具限制和转折意味。
- source_word: מֵעָרֵי הָעַמִּים הָאֵלֶּה
  choice: 这些民族的城中
  rationale: מִן 表示范围或来源；中文用“城中”自然地引出前述规则之外的特定城邑。“民族”避免现代民族国家的联想。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文四字神名作音译，以保留经文中的专名，而不以称号代替。
- source_word: אֱלֹהֶיךָ
  choice: 你的上帝
  rationale: 直接表达第二人称所属关系，采用现代普通话中庄重而易懂的称呼。
- source_word: נֹתֵן לְךָ נַחֲלָה
  choice: 赐给你作产业
  rationale: נֹתֵן 在语境中表示正在施予或确定施予；中文“赐给”符合神为施予者的语境。נַחֲלָה 指承受所得的份地或产业，“产业”保留土地承受的含义，又避免误解为现代法律中的遗产。
- source_word: לֹא תְחַיֶּה
  choice: 不可让……存活
  rationale: 保留 חיה Piel 的使役意味，即不使其活着、不容其存活，而不弱化为较笼统的“不可饶恕”。
- source_word: כָּל נְשָׁמָה
  choice: 任何有气息的
  rationale: נְשָׁמָה 的核心意象是气息或呼吸；此译保留具体意象，也不擅自把所指限定为“人”或扩释为某一特定生命类别。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文使用神的专名；音译“雅威”较贴近常见的学术重构，也避免用称号“主”取代专名。
- issue: נַחֲלָה 的盟约土地含义
  choice: 作产业
  alternative: 作基业；作为所有物
  rationale: “产业”能体现所赐土地作为承受之份的含义，同时不额外解释其神学机制。
- issue: כָּל נְשָׁמָה 的范围
  choice: 任何有气息的
  alternative: 任何活物；所有人
  rationale: 原文措辞本身以“气息”指称生命，但未在本句明说只限于人或明确列举动物，因此保留其范围上的张力，不作缩窄或扩张。
translation_notes:
  register: 采用现代标准普通话，句式庄重但不古奥。“这些民族的城中”使范围关系清楚；“不可让它存活”保留原文使役语气。脚注标记置于相关整句之后，用来说明“任何有气息的”的词义选择。
