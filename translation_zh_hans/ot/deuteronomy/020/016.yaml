  rationale: 修订仅调整中文范围结构、语序和脚注表述。以“至于……城邑”对应本节相对于前文的例外／对照，以破折号内同位说明保留原文关系从句的限定；“不可让任何有气息的存活”保留 Piel 使役义与 כָּל נְשָׁמָה 的非限定表述。
