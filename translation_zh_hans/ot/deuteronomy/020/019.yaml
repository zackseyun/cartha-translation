  text: כִּֽי תָצ֣וּר אֶל עִיר֩ יָמִ֨ים רַבִּ֜ים לְֽ/הִלָּחֵ֧ם עָלֶ֣י/הָ לְ/תָפְשָׂ֗/הּ לֹֽא תַשְׁחִ֤ית אֶת עֵצָ/הּ֙ לִ/נְדֹּ֤חַ עָלָי/ו֙ גַּרְזֶ֔ן כִּ֚י מִמֶּ֣/נּוּ תֹאכֵ֔ל וְ/אֹת֖/וֹ לֹ֣א תִכְרֹ֑ת כִּ֤י הָֽ/אָדָם֙ עֵ֣ץ הַ/שָּׂדֶ֔ה לָ/בֹ֥א מִ/פָּנֶ֖י/ךָ בַּ/מָּצֽוֹר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/019.yaml
  text: When you besiege a city for many days[a], fighting against it to capture it, you shall not destroy its trees by swinging an axe against them, for you may eat from them, and you shall not cut them down. For is the tree of the field a man, that it should come before you in the siege?
translation:
  language: zh_hans
  text: “你围困一座城多日，要攻打它、夺取它，就不可挥斧砍毁树木；因为你可以吃它所结的果子，不可把树砍倒。田野的树难道是人，会在围城时来到你面前吗？[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本句的希伯来语含义较难确定。也可译作：“因为人是田野的树”，或“因为田野的树是人的食物”。正文按修辞问句理解，以田野的树与人的敌手作对比。
    reason: 保留原文末句真实存在的句法和释义歧义。
lexical_decisions:
- source_word: תָצוּר אֶל־עִיר
  choice: 围困一座城
  rationale: צור在军事语境中指围城；“围困一座城”自然清楚，并保留持续施压的含义。
- source_word: יָמִים רַבִּים
  choice: 许多日子
  rationale: 贴近原文的时间表达，也符合庄重的现代汉语。
- source_word: לְהִלָּחֵם עָלֶיהָ לְתָפְשָׂהּ
  choice: 为要攻打并夺取它
  rationale: 两个不定式分别表达作战与夺城的目的；“攻打并夺取”简洁保留两层动作。
- source_word: לֹא תַשְׁחִית אֶת־עֵצָהּ
  choice: 不可……砍坏城中的树木
  rationale: שׁחת的使役形表示毁坏；结合随后挥斧的动作译作“砍坏”，既具体又不弱化禁令。עֵצָהּ指该城所属或境内的树木，译作“城中的树木”较自然。
- source_word: לִנְדֹּחַ עָלָיו גַּרְזֶן
  choice: 挥斧
  rationale: 原短语字面涉及把斧头挥向树；“挥斧”在汉语中自然传达用斧砍击的手段。
- source_word: כִּי מִמֶּנּוּ תֹאכֵל
  choice: 因为你可以吃树上所出的
  rationale: 保留树提供食物这一理由；“树上所出的”没有把原文明确限定为某一种出产，同时在汉语中可理解为可食用的产物。
- source_word: וְאֹתוֹ לֹא תִכְרֹת
  choice: 不可把树砍倒
  rationale: כרת用于树木时通常指砍伐、砍倒；单数在这里具有集合意义，汉语用泛指的“树”自然。
- source_word: הָאָדָם עֵץ הַשָּׂדֶה
  choice: 田野的树难道是人
  rationale: 按修辞问句理解，将树与作为敌手的人相对照；保留אָדָם的单数“人”，不额外指定性别。
- source_word: לָבֹא מִפָּנֶיךָ בַּמָּצוֹר
  choice: 要在围城时面对你
  rationale: “面对你”较贴近“来到你面前”，同时在军事语境中保持树并非敌手的修辞张力，没有明确添入“迎战”等原文未直说的内容。
theological_decisions:
- issue: 难句כִּי הָאָדָם עֵץ הַשָּׂדֶה לָבֹא מִפָּנֶיךָ בַּמָּצוֹר的句法与意义
  choice: 译为修辞问句：“田野的树难道是人，要在围城时面对你吗？”
  alternative: 也可作陈述句理解：“因为人是田野的树”，或按食物关系理解为“因为田野的树是人的食物”。
  rationale: 希伯来语句法简略且确有歧义。修辞问句读法符合围城语境：树不是与攻城者对阵的人，不应当作敌军毁灭；但其他历史性读法仍有可能，因此不在正文中消除争议，而在脚注保存。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。以“不可”体现律法禁令的语气；避免古奥表达，也没有把难句中的军事对比扩写成原文未明说的具体教义或伦理结论。
