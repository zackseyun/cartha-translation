base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/003.yaml
  text: 'and say to them[a], ‘Hear, Israel: today you are drawing near to battle against your enemies. Do not let your heart grow faint. Do not fear, or panic[b], or be terrified because of them.’'
translation:
  language: zh_hans
  text: 他要对他们说：“以色列啊，要听！今天你们正要上阵，迎战你们的仇敌。你们不要心里发怯[a]，不要害怕，不要慌乱，也不要在他们面前惊恐[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不要丧胆。”希伯来语直译近于“不要让你们的心软弱”，指勇气崩溃、消退。
    reason: lexical_alternative
  - marker: b
    text: 也可译：“不要害怕，不要陷入慌乱，也不要在他们面前惊恐。”原文接连使用三道禁令，加强不可因临敌而惧怕的劝勉。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַר
  choice: 并对他们说
  rationale: 这是在律法程序叙述中以连贯形式出现的完成式，承接上一节祭司的行动；译为“并对他们说”自然体现顺序与指令语气。
- source_word: שְׁמַע יִשְׂרָאֵל
  choice: 以色列啊，要听
  rationale: 保留《申命记》中庄重的呼召格式；“要听”既指听见，也含留心听从之意。
- source_word: קְרֵבִים הַיּוֹם לַמִּלְחָמָה
  choice: 今天你们正要上阵
  rationale: 分词表达迫近、即将发生的行动。“正要上阵”在现代汉语中自然地传达即将进入战斗的情境。
- source_word: עַל אֹיְבֵיכֶם
  choice: 迎战你们的仇敌
  rationale: 战争语境中的 עַל 表示敌对方向；“迎战”清楚表达针对仇敌作战，同时与“上阵”衔接自然。
- source_word: אַל יֵרַךְ לְבַבְכֶם
  choice: 你们不要心里发怯
  rationale: 原文直译近于“不要让你们的心软弱”，指勇气消退。“心里发怯”既保留内心意象，又是现代读者易懂的自然表达。
- source_word: אַל תִּירְאוּ
  choice: 不要害怕
  rationale: 直接表达 ירא 的基本意义，并与后面程度渐强的禁令区分。
- source_word: וְאַל תַּחְפְּזוּ
  choice: 不要慌乱
  rationale: 此动词在战场语境中不是普通的匆忙，而是因惊惧而陷入仓皇混乱；“慌乱”准确而自然。
- source_word: וְאַל תַּעַרְצוּ מִפְּנֵיהֶם
  choice: 也不要在他们面前惊恐
  rationale: “惊恐”表达被强烈恐惧压倒的意思；“在他们面前”保留 מִפְּנֵיהֶם 的空间与临敌色彩，而不只将其解释为因果关系。
