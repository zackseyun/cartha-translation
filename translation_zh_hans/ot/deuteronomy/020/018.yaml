base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/018.yaml
  text: so that they may not teach you to do according to all their abominations that they have done for their gods[a], and you would sin against Yahweh your God.
translation:
  language: zh_hans
  text: 免得他们教你们仿效他们为他们的神明[a]所行的一切可憎之事，以致你们得罪耶和华——你们的上帝。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：向他们的神明。
    reason: לֵאלֹהֵיהֶם 中的 ל 可表示为其神明而行，也可表示向其神明而行；正文采用较自然的‘为’，脚注保留另一可行译法。
lexical_decisions:
- source_word: לְמַעַן אֲשֶׁר לֹא
  choice: 免得
  rationale: 该结构在此引出所要防止的结果；“免得”简洁自然，并保留目的与预防意味。
- source_word: יְלַמְּדוּ אֶתְכֶם לַעֲשׂוֹת
  choice: 他们教你们……去做
  rationale: 直接保留“教导”及其后不定式所表达的行动内容；“你们”体现第二人称复数。
- source_word: כְּכֹל תּוֹעֲבֹתָם
  choice: 照着他们……一切可憎之事
  rationale: “照着”表达 כ 的仿效、依照关系；“可憎之事”保留 תועבה 强烈的道德与宗教评价，同时比“憎恶”作具体行为名词更自然。
- source_word: אֲשֶׁר עָשׂוּ לֵאלֹהֵיהֶם
  choice: 他们为自己的神所行的
  rationale: ל 可表示这些行为是向着或为了诸神而行；正文采用自然的“为……所行”，而不把具体祭祀方式说得过明。
- source_word: וַחֲטָאתֶם
  choice: 以致你们得罪
  rationale: 此处承接前面的预防目的，表达仿效这些行为所导致的后果；“以致”清楚呈现逻辑，“得罪”适合带受冒犯对象的 חטא。
- source_word: לַיהוָה אֱלֹהֵיכֶם
  choice: 耶和华你们的上帝
  rationale: 将 יהוה 音义传统对应为现代中文圣经中通行且庄重的“耶和华”，并保留“你们的上帝”这一盟约性称谓。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文明确使用四字神名。现代简体中文圣经语境中“耶和华”最为通行、易懂，并将其作为专名保留，而不以“主”替代。
- issue: לֵאלֹהֵיהֶם 的关系含义
  choice: 为自己的神
  alternative: 向自己的神
  rationale: 介词 ל 在敬拜行为语境中可表达方向或受益关系；“为”自然表达这些可憎行为是为其诸神而行，同时不排除“向”的理解。
- issue: וַחֲטָאתֶם 的逻辑关系
  choice: 以致你们得罪
  alternative: 你们就会得罪
  rationale: 前句说明消灭当地民族所要避免的后果；采用“以致”呈现结果关系，但不额外引入必然性或解释具体罪责。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“免得……以致……”清楚呈现希伯来文的预防目的及后果链条；避免古奥表达，也不弱化“可憎之事”的强烈宗教伦理色彩。
