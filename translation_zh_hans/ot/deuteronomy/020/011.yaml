base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/011.yaml
  text: And if it answers you with peace and opens to you[b][a], then all the people found in it shall become forced labor for you and shall serve you.
translation:
  language: zh_hans
  text: 如果城以和平回应你，向你开门[a]，城里所有的人都要为你服劳役[b]，服事你。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“向你打开”，在这里指向你开城门。
    reason: implicit_object
  - marker: b
    text: “劳役”所译的希伯来词可指征敛、贡赋或强制劳役；这里结合下文“服事你”，较可能指劳役。
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלוֹם תַּעַנְךָ
  choice: 以和平回应你
  rationale: שָׁלוֹם意为“和平、平安”，在攻城劝降的语境中指对和平提议作出接受性的回应；译为“以和平回应”既保留原词，也符合现代汉语。
- source_word: וּפָתְחָה לָךְ
  choice: 向你开门
  rationale: 原文直译为“向你打开”，虽未明说“门”，但在城邑回应劝降的语境中，汉语必须补出自然且明确的宾语；脚注保留更贴近形式的译法。
- source_word: כָּל הָעָם הַנִּמְצָא בָהּ
  choice: 城里所有的人
  rationale: הַנִּמְצָא בָהּ字面为“在其中被找到的”；译作“城里所有的人”准确表达范围，并避免生硬的直译。
- source_word: לָמַס
  choice: 为你服劳役
  rationale: מַס可指征敛、贡赋或徭役。其后紧接“服事你”，这里较可能指受支配的强制服役；“服劳役”既体现强制性，也不把制度细节说得过满。
- source_word: וַעֲבָדוּךָ
  choice: 服事你
  rationale: עבד的基本义是“服事、劳作”；“服事你”保留从属关系，也与前面的“服劳役”形成原文所有的语义递进。
theological_decisions:
- issue: 战争律例中对投降居民从属地位的表述
  choice: 明确译出“服劳役，服事你”
  alternative: 向你纳贡，为你效劳
  rationale: 原文מַס具有贡赋与徭役之间的语义幅度，但上下文更支持强制服役。译文不淡化这种强制性，同时以脚注说明词义并非只能限定为一种制度。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“以和平回应”保留希伯来语的和平措辞；“向你开门”使省略宾语的原文在汉语中清楚可读；“服劳役，服事你”保留经文严峻的从属含义，不加以弱化。
