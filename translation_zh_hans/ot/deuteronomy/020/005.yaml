base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/005.yaml
  text: Then the officers shall speak to the people[a], saying, ‘Who is the man who has built a new house and has not dedicated it? Let him go and return to his house, lest he die in the battle and another man dedicate it.’
translation:
  language: zh_hans
  text: 官员要对百姓说：“谁盖了新房，还没有启用[a]，就让他离开，回自己家去，免得他死在战场上，反由另一个人启用那房子。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“奉献”。希伯来语这个动词指为新房正式开始使用，常带有奉献或举行落成礼的意味。
    reason: 保留“启用”与“奉献／落成仪式”之间的语义幅度，并以自然的现代汉语表达替代译法。
lexical_decisions:
- source_word: הַשֹּׁטְרִים
  choice: 官员
  rationale: 指受委任执行民政或军事行政职务的人；“官员”在现代汉语中自然，也避免误解为泛指军官。
- source_word: הָעָם
  choice: 百姓
  rationale: 直译为“百姓、人民”；此处按语境指集结准备作战的人，但不以“军队”过度具体化。
- source_word: מִי הָאִישׁ
  choice: 谁
  rationale: 希伯来语字面为“谁是那人”；汉语用“谁”即可自然表达对其中个人的询问，战事语境已表明对象。
- source_word: בָּנָה בַיִת חָדָשׁ
  choice: 盖了新房
  rationale: “盖房”是现代汉语的自然说法，并保留“新房”的具体意象。
- source_word: וְלֹא חֲנָכוֹ
  choice: 还没有启用
  rationale: חנך在此指正式开始使用新房，可能带奉献或落成仪式的含义；“启用”准确自然，又不擅自限定为宗教仪式。
- source_word: יֵלֵךְ וְיָשֹׁב לְבֵיתוֹ
  choice: 就让他离开，回自己家去
  rationale: 两个未完成式在法律程序语境中具有指令意味；此译保留“离开”和“返回”的双重动作。
- source_word: פֶּן
  choice: 免得
  rationale: 自然表达希伯来语所含的防范性结果或顾虑。
- source_word: יָמוּת בַּמִּלְחָמָה
  choice: 他死在战场上
  rationale: 具体呈现当前作战情境，也保留单数主体。
- source_word: וְאִישׁ אַחֵר
  choice: 另一个人
  rationale: 保留原文单数和“另一个”的明确对比。
- source_word: יַחְנְכֶנּוּ
  choice: 启用那房子
  rationale: 与前面的חנך统一译为“启用”，保留原文词语重复，并明确代词所指。
