source:
  edition: WLC
  text: רַ֣ק הַ֠/נָּשִׁים וְ/הַ/טַּ֨ף וְ/הַ/בְּהֵמָ֜ה וְ/כֹל֩ אֲשֶׁ֨ר יִהְיֶ֥ה בָ/עִ֛יר כָּל שְׁלָלָ֖/הּ תָּבֹ֣ז לָ֑/ךְ וְ/אָֽכַלְתָּ֙ אֶת שְׁלַ֣ל אֹיְבֶ֔י/ךָ אֲשֶׁ֥ר נָתַ֛ן יְהוָ֥ה אֱלֹהֶ֖י/ךָ לָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/014.yaml
  text: Only the women[a], the little children, the livestock, and everything that is in the city—all its spoil—you may take as plunder for yourself; and you may eat the spoil of your enemies, which Yahweh your God has given you.
translation:
  language: zh_hans
  text: 只是妇女、孩童、牲畜，以及城里的一切，连同城中所有的战利品，你都可以掠为己有；你也可以享用[a]仇敌的战利品，就是耶和华你的神赐给你的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “享用”原文直译为“吃”；这个动词在这里可指吃用、取用或受用所夺得的战利品。
    reason: 保留 אָכַל 的字面意义，并提示其在以战利品为宾语时可能有较广的用法，不将其限定为仅指进食。
lexical_decisions:
- source_word: רַק
  choice: 只是
  rationale: 承接上一节并标明例外，保留限制和转折的力量。
- source_word: הַנָּשִׁים
  choice: 妇女
  rationale: 直接表达特指的复数名词，不将其泛化为一般人口。
- source_word: הַטַּף
  choice: 孩童
  rationale: 该词通常指年幼的孩子或受抚养者；“孩童”自然简洁，并保留年龄较小的含义。
- source_word: הַבְּהֵמָה
  choice: 牲畜
  rationale: 语境是战争所得，所指主要是作为财产的家畜；“牲畜”比“动物”准确，也不局限于牛。
- source_word: וְכֹל אֲשֶׁר יִהְיֶה בָעִיר
  choice: 以及城里的一切
  rationale: 保留原文涵盖城中其余一切事物的总括表达。
- source_word: כָּל שְׁלָלָהּ
  choice: 城中所有的战利品
  rationale: שָׁלָל 指战争中夺得之物；补明“城中”使阴性代词所指在中文中清楚。
- source_word: תָּבֹז לָךְ
  choice: 你都可以掠取，归自己所有
  rationale: בָּזַז 表示掠取战利品；法律训令语境中的“可以”表达获准采取行动，而“归自己所有”保留 לָךְ 的受益含义。
- source_word: וְאָכַלְתָּ אֶת שְׁלַל אֹיְבֶיךָ
  choice: 你也可以享用仇敌的战利品
  rationale: אָכַל 字面是“吃”，此处以战利品为宾语，可扩展为使用或享受所得之物；正文用自然的“享用”，脚注保留字面含义与歧义。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名呈现四字神名，而非以称号替代。
- source_word: אֲשֶׁר נָתַן יְהוָה אֱלֹהֶיךָ לָךְ
  choice: 就是耶和华你的神赐给你的
  rationale: 保留关系从句及已经赐予的完成性，也保留原文向单数第二人称的直接称呼。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名；正文采用现代中文宗教语境中最通行、辨识度最高的专名“耶和华”，不以“主”取代专名。
- issue: 法律训令中第二人称动词的语气
  choice: 可以
  alternative: 要／必
  rationale: 上下文是在准许以战利品为己有；“可以”传达授权性质，同时避免把希伯来语动词形式过度限定为命令或单纯将来。
- issue: 将妇女和孩童列入可掠取之物的严峻表述
  choice: 按原文句法直接保留
  alternative: 通过增补说明弱化或改写其所指
  rationale: 原文把妇女、孩童、牲畜和城中一切都置于同一训令之下。译文不回避其伦理张力，也不加入原文没有的解释。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。句式尽量贴近希伯来文的总括与重复结构，同时用分号划分两个训令。脚注标记置于其实际解释的“享用”之后。
