base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/017.yaml
  text: Instead[a], you must utterly destroy them—the Hittites, the Amorites, the Canaanites, the Perizzites, the Hivites, and the Jebusites—as Yahweh your God has commanded you.
translation:
  language: zh_hans
  text: 但要将他们彻底灭绝[a]——就是赫人、亚摩利人、迦南人、比利洗人、希未人和耶布斯人——正如耶和华你的上帝所吩咐你的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译：“你务必将他们完全置于禁毁之下。”这里的动词指把他们完全交付毁灭。
    reason: 说明 חרם 的专门含义，以及不定式绝对式所表达的加强语气。
lexical_decisions:
- source_word: כִּי
  choice: 而要
  rationale: 这里承接上一节，并与对远方城邑之人的处理形成对比；“而要”自然表达转折和另行处置。
- source_word: הַחֲרֵם תַּחֲרִימֵם
  choice: 把他们彻底灭绝
  rationale: 不定式绝对式与限定动词连用，加强命令语气；חרם 在此指置于禁令之下、完全交付毁灭。“彻底灭绝”在正文中清楚自然，脚注补明其礼仪—司法色彩。
- source_word: הַחִתִּי וְהָאֱמֹרִי הַכְּנַעֲנִי וְהַפְּרִזִּי הַחִוִּי וְהַיְבוּסִי
  choice: 赫人、亚摩利人、迦南人、比利洗人、希未人和耶布斯人
  rationale: 采用现代中文圣经语境中通行的族名，并按希伯来文的集合名词理解为各族群。
- source_word: כַּאֲשֶׁר צִוְּךָ
  choice: 正如……所吩咐你的
  rationale: 保留比较从句，并用“正如”体现命令与先前神谕的一致性。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文中最通行的神名音译，保留其作为以色列之神专名的功能，而不改作纯粹称号。
- source_word: אֱלֹהֶיךָ
  choice: 你的上帝
  rationale: 直接表达第二人称单数的盟约关系；“上帝”是自然、庄重的现代标准汉语。
theological_decisions:
- issue: 战争命令中 חרם 的表达
  choice: 把他们彻底灭绝
  alternative: 把他们完全置于禁令之下／把他们完全交付毁灭
  rationale: 正文需让普通读者直接明白命令涉及彻底毁灭，同时不能抹去 חרם 所含的“归于禁毁”概念，因此以脚注保存这一法律—宗教层面的词义。
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: “耶和华”是现代中文读者最熟悉且可识别为专名的形式；原文的个人神名性质得到保留，并未以“主”替代。
translation_notes:
  register: 采用现代、庄重而清楚的普通话书面语。“彻底灭绝”直接传达命令力度；脚注保留原文“禁毁”的宗教—法律内涵。族名使用简体中文圣经传统中的通行译名。
