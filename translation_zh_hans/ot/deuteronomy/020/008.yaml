base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/008.yaml
  text: Then the officers shall continue to speak to the people and say[a], ‘Who is the man who is fearful and fainthearted? Let him go and return to his house[b], lest he melt the heart of his brothers like his own heart.’
translation:
  language: zh_hans
  text: 官长要继续对百姓说：“谁惧怕、心里胆怯[a]，就让他回自己家去，免得他使弟兄[b]的心也像自己的心一样消沉。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “心里胆怯”直译为“心柔软”。
    reason: lexical_alternative
  - marker: b
    text: 这里的“弟兄”指他的以色列同胞，也就是一同作战的人。
    reason: cultural_note
lexical_decisions:
- source_word: וְיָסְפוּ
  choice: 要继续
  rationale: יסף与不定式连用，表示“继续、再进一步做某事”；“要继续”自然保留其承接和递进意味。
- source_word: הַשֹּׁטְרִים
  choice: 官长
  rationale: 这里指承担行政和军事职能的任命官员，并非现代意义上的警察；“官长”符合申命记语境，也较庄重。
- source_word: מִי הָאִישׁ
  choice: 谁
  rationale: 希伯来语直译为“谁是那人”；现代汉语用“谁”即可自然表达对军中个体的询问，无须补出累赘的“哪个人”。
- source_word: הַיָּרֵא וְרַךְ הַלֵּבָב
  choice: 惧怕、心里胆怯
  rationale: 保留两个并列描述：יָרֵא指惧怕，רַךְ הַלֵּבָב字面为“心柔软”，在战事语境中表示胆怯。
- source_word: יֵלֵךְ וְיָשֹׁב לְבֵיתוֹ
  choice: 就让他回自己家去
  rationale: 两个未完成式在此具有指令意味；汉语将“去并返回”顺畅合并为“回……去”，不损失实际语义。
- source_word: וְלֹא יִמַּס אֶת־לְבַב אֶחָיו
  choice: 免得他弟兄的心也……消融
  rationale: מסס的意象是“融化、消融”，用于心时表示勇气瓦解；保留原文心被消融的比喻和警戒目的。
- source_word: כִּלְבָבוֹ
  choice: 像他的心一样
  rationale: 保留原文对“心”的重复以及明确的比较关系，不改写为单纯的“像他一样胆怯”。
theological_decisions:
- issue: 军事语境中的性别及亲属称谓
  choice: 保留“弟兄”
  alternative: 同伴／战友／同胞
  rationale: אֶחָיו字面为“他的弟兄”，在这里指同属以色列军队的人。保留亲属称谓可呈现原文的群体关系和男性军事语境，脚注说明其语用范围。
- issue: 胆怯的传染性比喻
  choice: 保留“心……消融”
  alternative: 使弟兄丧胆
  rationale: 原文借“心融化”描述勇气崩溃；直保留该比喻可避免把形象化表达化约为抽象解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“官长”体现古代行政军事身份；引语简洁有力。两个脚注标记均置于正文句末，分别解释希伯来语心的表达和“弟兄”的语境含义。
