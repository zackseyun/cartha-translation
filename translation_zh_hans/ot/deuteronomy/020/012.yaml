  text: וְ/אִם לֹ֤א תַשְׁלִים֙ עִמָּ֔/ךְ וְ/עָשְׂתָ֥ה עִמְּ/ךָ֖ מִלְחָמָ֑ה וְ/צַרְתָּ֖ עָלֶֽי/הָּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/012.yaml
  text: But if it does not make peace with you[a], but makes war against you[b], then you shall besiege it.
translation:
  language: zh_hans
  text: 但如果那城不与你讲和，反而与你交战，你就要围困那城。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תַשְׁלִים
  choice: 讲和
  rationale: שׁלם 的使役式在此指建立和平关系或达成和议。“讲和”简洁自然，并保留主动缔结和平的含义。
- source_word: עִמָּךְ
  choice: 与你
  rationale: עִם 加第二人称单数后缀，表示“与你”；上下文中受话者是以单数称呼的以色列。
- source_word: וְעָשְׂתָה עִמְּךָ מִלְחָמָה
  choice: 反而与你交战
  rationale: עשה מלחמה 是“作战、交战”的惯用语；此处前后形成对照，译作“反而”能自然表达语义转折，而“与你交战”也保留 עִם 可表达敌对关系的用法。
- source_word: וְצַרְתָּ
  choice: 你就要围攻
  rationale: צור 在此指围困城邑；带 ו 的完成式在法律训令中承接条件句，译作“就要”兼顾结果关系与指令语气。
- source_word: עָלֶיהָ
  choice: 它
  rationale: על 与 צור 连用时标明围攻对象；现代汉语用“围攻它”即可自然表达。阴性单数后缀所指为上文的城，故正文先明确为“那城”。
- source_word: וְאִם לֹא
  choice: 但如果……不
  rationale: 承接上一节和平回应的情形并引出相反条件，“但如果……不”准确表达其转折与条件关系。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“那城”补明希伯来语阴性单数主语在上下文中的所指，随后以“它”承接；不添加原文没有的神学解释。英文咨询稿的脚注标记与脚注内容错位，且所列内容只是正文用词的替代表达，因此本稿不设脚注。
