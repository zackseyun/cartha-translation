  to: 只有那些你知道不是果树的树木，你可以毁坏、砍伐，并修筑攻城工事来攻打那与你交战的城，直到把城攻陷[a]。
  rationale: 修订首句以改善汉语句法和限制语气；将“修筑攻城工事”明确为并列行动，并保留其针对城的功能。脚注锚点随其所对应的词语调整：关于“攻陷”的脚注置于句末，关于 מָצוֹר 的脚注置于“攻城工事”之后。
