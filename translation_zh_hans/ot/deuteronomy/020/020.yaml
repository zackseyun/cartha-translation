base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/020.yaml
  text: Only the trees that you know are not trees for food[a], those you may destroy and cut down, and build siegeworks against the city that is making war with you[b], until you bring it down.
translation:
  language: zh_hans
  text: 只有那些你知道不是果树的树木，你可以毁坏、砍伐，并修筑攻城工事来攻打那与你交战的城，直到把城攻陷[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“直到城陷落”。希伯来语直译为“直到你使它下来”，在这里指使城失守。
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: 只是
  rationale: 承接上一节不可毁坏果树的禁令，引出例外，保留其限制语气。
- source_word: עֵץ ... עֵץ מַאֲכָל
  choice: 树木……果树
  rationale: 上下文所指是活树；“果树”以自然简洁的现代汉语表达可供食用、结果子的树。
- source_word: אֲשֶׁר תֵּדַע כִּי לֹא ... הוּא
  choice: 你知道不是
  rationale: 保留判断基于明确认知的含义，同时使句式符合现代汉语。
- source_word: אֹתוֹ תַשְׁחִית וְכָרָתָּ
  choice: 你可以毁坏、砍下
  rationale: 单数宾语在此按类别作分配性理解；“可以”体现律法语境中的准许，而“毁坏、砍下”保留两个并列动作。
- source_word: וּבָנִיתָ מָצוֹר
  choice: 用来修筑攻城工事
  rationale: מָצוֹר可泛指围攻城市所用的设施；“攻城工事”避免把它过度限定为某一种具体结构。“用来”自然表达被砍树木与修筑工事之间的语义联系。
- source_word: עַל הָעִיר
  choice: 攻打……城
  rationale: 介词עַל在军事语境中表达针对该城的敌对行动；汉语用“攻打”比直译为“在城上”或“对着城”自然。
- source_word: אֲשֶׁר הִוא עֹשָׂה עִמְּךָ מִלְחָמָה
  choice: 那与你交战的
  rationale: 自然表达希伯来语“与你进行战争”的习语，并保留分词所示的持续交战状态。
- source_word: עַד רִדְתָּהּ
  choice: 直到把城攻陷
  rationale: 保留第二人称主动使该城倒下、失守的含义；重复“城”可避免汉语代词指向不清。
theological_decisions: []
