base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/001.yaml
  text: When you go out to battle against your enemies and see horses and chariots[a], a people more numerous than you, do not fear them, for Yahweh your God is with you[c][b], who brought you up from the land of Egypt.
translation:
  language: zh_hans
  text: 当你出去与仇敌交战，看见马匹和战车[a]，以及人数比你多的民众[b]时，不要怕他们，因为与你同在的是雅威——你的上帝，就是曾领你从埃及地上来的那一位[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“马和战车”；这里的单数很可能具有集合意义，泛指敌军的马匹和战车兵力。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“比你人数更多的民众”或“比你更强大的民众”。原文在这里主要强调对方人数更多；在战争语境中可指敌方人众。
    reason: lexical_alternative
  - marker: c
    text: “曾领你从埃及地上来”呼应出埃及事件，并以此作为以色列不惧怕仇敌的根据。
    reason: cross_reference
lexical_decisions:
- source_word: כִּי תֵצֵא לַמִּלְחָמָה
  choice: 你出去……交战的时候
  rationale: כִּי在此引出将来可能出现的情境；与未完成式连用，译作时间从句自然贴切。יצא למלחמה是出兵交战的惯用表达。
- source_word: עַל אֹיְבֶיךָ
  choice: 与仇敌交战
  rationale: עַל在敌对行动语境中表示“针对、对抗”；“仇敌”保留复数所表达的集合对象。
- source_word: סוּס וָרֶכֶב
  choice: 马匹、战车
  rationale: 两个希伯来语单数在这里具有集合意义，指敌军的马匹和战车兵力；汉语采用集合表达，无须机械保留单数。
- source_word: עַם רַב מִמְּךָ
  choice: 人数比你多的军队
  rationale: רַב与比较介词מִן表示数量上的优势；语境明确涉及出战的敌方人众，因此以“军队”自然传达，但用脚注保留较形式对应的“民众”。
- source_word: לֹא תִירָא מֵהֶם
  choice: 不要怕他们
  rationale: 未完成式在训令语境中具有禁止作用；此译简洁而直接。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，保留其专名性质，不以称号代替。
- source_word: אֱלֹהֶיךָ עִמָּךְ
  choice: 你的上帝与你同在
  rationale: 直接保留盟约临在的陈述，不增添“站在你一边”等解释。
- source_word: הַמַּעַלְךָ מֵאֶרֶץ מִצְרַיִם
  choice: 他曾领你从埃及地上来
  rationale: 带冠词的分词指明雅威是领以色列上来的那一位；“上来”保留עלה的方向性及出埃及叙事的传统措辞。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。译作“雅威”既保留专名，也避免用“主”这一称号取代原文；“耶和华”是传统形式，但较不接近学界通常重构的读音。
- issue: 上帝同在与出埃及之间的关系
  choice: 以分号连接“与你同在”和“他曾领你……”
  alternative: 译为关系从句：“就是那领你……的”
  rationale: 原文分词短语修饰并说明雅威，以出埃及的作为支持同在的应许；分号使现代汉语清楚，同时不把两者分割为无关陈述。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“出去……交战”保留军事语境而不显古奥；“不要怕他们”比“不可惧怕他们”更自然直接。神名统一译作“雅威”。所有脚注标记均置于正文相应位置。
