  yaml_path: translation/ot/deuteronomy/020/002.yaml
  text: And when you draw near to the battle[a], the priest shall come forward and speak to the people[b],
translation:
  language: zh_hans
  text: 当你们临近交战[a]时，祭司要上前，对百姓讲话[b]：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“临近战争”或“临近战斗”。希伯来语“מִלְחָמָה”可指战争、战事或一场具体战斗；这里指即将交战的情形，并未明确指某一地点，故不译作“战场”。
    reason: lexical_alternative
  - marker: b
    text: 这里的“百姓”指聚集出战的以色列人；但希伯来原文仍使用含义较广的“百姓”，而没有使用“军队”或“士兵”等较窄的称呼。
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיָה כְּקָרָבְכֶם
  choice: 你们临近……时
  rationale: וְהָיָה与时间性结构合用，引出将来发生的情形；קרב表示“临近、接近”。译为“你们临近……时”既自然，也保留原文的时间关系。
- source_word: אֶל הַמִּלְחָמָה
  choice: 战场
  rationale: מִלְחָמָה既可泛指战争，也可指具体战斗。此处描写军队即将交战，“临近战场”符合汉语习惯；脚注保留“战争”的可能译法。
- source_word: וְנִגַּשׁ
  choice: 要上前
  rationale: נגשׁ表示靠近或走上前；在祭司即将向列队之人讲话的场景中，“上前”自然地体现其动作。
- source_word: הַכֹּהֵן
  choice: 祭司
  rationale: 按原文保留定指单数身份，不增添其职分或具体类别。
- source_word: וְדִבֶּר
  choice: 说话
  rationale: דבר的Piel词干在此意为“说、讲话”。译作“说话”较为贴近原词，下一节将承接其具体话语。
- source_word: אֶל הָעָם
  choice: 对百姓
  rationale: עָם直译为“百姓、人民”。语境中指聚集出战的以色列人，但原文没有改用“军队”或“士兵”等较窄称谓，因此保留“百姓”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“你们临近战场时”避免生硬直译“事情将是”；“祭司要上前”清楚表达原文的未来场景。末尾用冒号，是因为下一节直接给出祭司所说的话。
