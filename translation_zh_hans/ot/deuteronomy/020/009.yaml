base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/009.yaml
  text: And when the officers have finished speaking to the people[a], they shall appoint commanders of armies at the head of the people.
translation:
  language: zh_hans
  text: 官长向百姓讲话完毕后，就要任命[a]各军将领，率领百姓。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“就要召集或编列各军将领，率领百姓。”这里的动词可表示任命、召集、编列或派定；具体含义须按上下文判断。
    reason: 保留פקד的词义范围，同时使替代译法与“各军将领”及“率领百姓”的句法关系一致。
lexical_decisions:
- source_word: וְהָיָה כְּכַלֹּת
  choice: ……完毕后
  rationale: וְהָיָה与כְּ加不定式连用，在这里引出时间从句，并强调前一行动完成；现代汉语用“……完毕后”自然表达这一先后关系。
- source_word: הַשֹּׁטְרִים
  choice: 官长
  rationale: 该词在《申命记》的军政语境中指负责传令和组织百姓的官员；“官长”既保留职分色彩，也避免把它误解为专门抄写文书的“文士”。
- source_word: לְדַבֵּר אֶל־הָעָם
  choice: 向百姓讲话
  rationale: 直接对应“对百姓说话”；保留“百姓”，不因军事语境而过度具体化为“士兵”。
- source_word: וּפָקְדוּ
  choice: 就要任命
  rationale: פקד语义范围较广，可指任命、召集、点派或使人负责。结合宾语“各军的将领”和其居首领的位置，正文采用“任命”，同时以脚注保留其他可能。
- source_word: שָׂרֵי צְבָאוֹת
  choice: 各军的将领
  rationale: שָׂרֵי表示首领或指挥者，צְבָאוֹת在此指军事队伍；“各军的将领”清楚、自然，并体现原文复数。
- source_word: בְּרֹאשׁ הָעָם
  choice: 置于百姓之首
  rationale: 原文直译为“在百姓的头部／前头”，在此表示领导位置；“置于百姓之首”保留原文意象，也传达统领之意。
