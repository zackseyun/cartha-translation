base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/007.yaml
  text: And who is the man who has become engaged to a woman and has not taken her? Let him go and return to his house[c][b][a], lest he die in the battle and another man take her.
translation:
  language: zh_hans
  text: 还有谁已经与一名女子订婚[a]，却还没有娶她[b]呢？让他回家去，免得他在战斗中死去，另一个男人娶了她[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “订婚”也可译为“聘定”。这里指具有约束力、但尚未完成婚娶的婚约。
    reason: lexical_alternative
  - marker: b
    text: “还没有娶她”指尚未完成婚娶、接她为妻。
    reason: cultural_note
  - marker: c
    text: 原文在“没有娶她”和“另一个男人娶了她”两处使用同一个动词；在这里都指娶妻。
    reason: lexical_note
lexical_decisions:
- source_word: וּמִי הָאִישׁ
  choice: 还有哪一个人
  rationale: 承接前面的征战豁免类别，并保留希伯来文以问句宣告下一类人的表达方式。
- source_word: אֵרַשׂ אִשָּׁה
  choice: 已经跟女子订婚
  rationale: אֵרַשׂ指正式聘定、尚未完成婚娶的阶段；“订婚”是现代汉语中清楚自然的对应表达，也与下句“还没有娶她”形成区别。
- source_word: וְלֹא לְקָחָהּ
  choice: 却还没有娶她
  rationale: לקח女子在这里指娶她为妻。直译“取她”在现代汉语中不够自然，“娶她”准确表达婚姻语境。
- source_word: יֵלֵךְ וְיָשֹׁב לְבֵיתוֹ
  choice: 就让他回家去
  rationale: 在本段军前宣告的语境中表达准许兼指令的语气；“回家去”自然传达“回到他的家”。
- source_word: פֶּן יָמוּת בַּמִּלְחָמָה
  choice: 免得他在战斗中死去
  rationale: “免得”保留פֶּן所引出的负面目的或可能结果；“在战斗中”指当前的军事行动，没有把死亡方式进一步解释为被杀。
- source_word: וְאִישׁ אַחֵר יִקָּחֶנָּה
  choice: 而另一个男人娶了她
  rationale: 保留“另一个男人”的阳性单数措辞，并按婚姻语境把יִקָּחֶנָּה译为“娶了她”。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“还有哪一个人……？”保留军前宣告中连续问句的修辞形式；“就让他回家去”避免过度法律化，同时传达原文的指令作用。
