base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/034/006.yaml
  text: And he buried him in the valley in the land of Moab[a], opposite Beth-peor[b], and no one knows his burial place to this day.
translation:
  language: zh_hans
  text: 他把摩西葬在摩押地的山谷里[a]，在伯毗珥对面；直到今日，没有人知道摩西葬在哪里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他把摩西葬”：本节没有明说“他”是谁；上文表明所指的是耶和华。
    reason: 保留原文未明说主语的形式，同时交代上下文所指。
lexical_decisions:
- source_word: וַיִּקְבֹּר אֹתוֹ
  choice: 他把摩西葬
  rationale: 希伯来语是主动式第三人称阳性单数，主语未在本节明说；“他”保留这一点。宾语代词按上文明确为摩西，以免汉语连续使用两个“他”造成指代不清。
- source_word: בַגַּיְ
  choice: 在……山谷里
  rationale: גַּיְ可指山谷或沟谷；“山谷”自然易懂，也符合这里的地理语境。
- source_word: בְּאֶרֶץ מוֹאָב
  choice: 在摩押地
  rationale: 保留“摩押之地”的具体表达，同时采用现代汉语常见的简称。
- source_word: מוּל
  choice: 在……对面
  rationale: 准确表达空间上的相对位置，现代汉语自然明晰。
- source_word: בֵּית פְּעוֹר
  choice: 伯·毗珥
  rationale: 按中文圣经地名的通行音译处理，并用间隔号标明复合地名。
- source_word: וְלֹא יָדַע אִישׁ
  choice: 没有人知道
  rationale: אִישׁ在此具有泛指意义；“没有人”准确传达范围，且比“没有男人”更符合现代汉语。
- source_word: קְבֻרָתוֹ
  choice: 摩西的墓地在哪里
  rationale: 该词在语境中指埋葬地点。“墓地在哪里”自然表达“无人知道其埋葬之处”；重复“摩西”可消除汉语代词歧义。
- source_word: עַד הַיּוֹם הַזֶּה
  choice: 直到今日
  rationale: 保留叙述者立场下延续至其当时的时间意味，语体庄重而自然。
theological_decisions:
- issue: “他把摩西葬了”的主语身份
  choice: 正文保留未具名的“他”，并以脚注说明上文指向耶和华。
  alternative: 在正文直接译作“耶和华把摩西葬了”，或改用被动式“摩西被葬”。
  rationale: 本节动词只标示第三人称阳性单数，并未重述主语；上文强烈指向耶和华，但不宜把上下文推断直接写入本节正文。
- issue: 泛指阳性名词 אִישׁ
  choice: 译为“没有人”。
  alternative: 译为“没有男人”或“无人”。
  rationale: 此处性别形式承担泛指功能，并非排除女性；“没有人”既准确又符合现代标准汉语。
translation_notes:
  register: 采用现代、庄重、易懂的标准普通话。以主动句保留希伯来语结构；必要时重复“摩西”，避免中文代词指代含混。正文中的脚注标记[a]与脚注完全对应。
