  naturalness: “满有智慧之灵”既庄重又通顺，避免“约书亚充满了……”可能略显口语或句法重心不够清楚的问题。“并照耶和华所吩咐摩西的去做”比原稿末句更完整自然。
  terminology: “智慧之灵”“按在他身上”“以色列子孙”“耶和华”均恰当。脚注应避免把原文未明说的“能力”作为与“灵”并列的明确内容；可说明其可能指神所赐、使人有智慧的灵。
