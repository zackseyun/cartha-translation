source:
  edition: WLC
  text: וִֽ/יהוֹשֻׁ֣עַ בִּן נ֗וּן מָלֵא֙ ר֣וּחַ חָכְמָ֔ה כִּֽי סָמַ֥ךְ מֹשֶׁ֛ה אֶת יָדָ֖י/ו עָלָ֑י/ו וַ/יִּשְׁמְע֨וּ אֵלָ֤י/ו בְּנֵֽי יִשְׂרָאֵל֙ וַֽ/יַּעֲשׂ֔וּ כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/034/009.yaml
  text: And Joshua son of Nun was full of the spirit of wisdom[a], because Moses had laid his hands on him[b]. So the sons of Israel listened to him and did as Yahweh had commanded Moses.
translation:
  language: zh_hans
  text: 嫩的儿子约书亚满有智慧之灵[a]，因为摩西曾把双手按在他身上。以色列子孙[b]听从约书亚，并照耶和华所吩咐摩西的去做。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“被智慧之灵充满。”原文可较一般地理解为“智慧的灵”，也可较具体地理解为神所赐、使人有智慧的灵。
    reason: alternative_reading
  - marker: b
    text: 或译：“以色列人”或“以色列的众子”。原文直译为“以色列的众子”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מָלֵא רוּחַ חָכְמָה
  choice: 充满了智慧之灵
  rationale: 保留希伯来文“充满”加“智慧之灵”的结构和神学含义，同时不武断判定这里是否特指圣灵。
- source_word: רוּחַ
  choice: 灵
  rationale: 此处指与智慧相关、赋予能力的“灵”；中文不借助大小写区分，因此通过脚注保留既可泛指智慧之灵、也可指神所赐之灵的空间。
- source_word: סָמַךְ ... אֶת יָדָיו עָלָיו
  choice: 把双手按在他身上
  rationale: 准确表达正式按手的动作；“双手”对应原文复数“他的手”，现代中文也自然清楚。
- source_word: וַיִּשְׁמְעוּ אֵלָיו
  choice: 听从约书亚
  rationale: שׁמע与אֶל连用既有听取之意，也含顺从意味；“听从”适合本句语境，而后句进一步说明他们付诸行动。为避免中文代词指代含混，复述“约书亚”。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列子孙
  rationale: 保留原文“以色列的众子”所含的家族与盟约色彩，同时采用现代汉语圣经语体中自然且涵盖群体的表达。
- source_word: וַיַּעֲשׂוּ כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: 照耶和华吩咐摩西的去做
  rationale: 自然表达以色列人的行动符合耶和华先前给摩西的命令，并保留“吩咐摩西”在句法上的潜在范围，不擅自补出命令的具体内容。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文读者熟悉的神圣四字名传统译法，并与项目中文圣经语体相协调。
theological_decisions:
- issue: רוּחַ חָכְמָה是否明确指圣灵
  choice: 译作“智慧之灵”，不在正文中明确加上“圣”
  alternative: 译作“智慧的圣灵”或“赐智慧的圣灵”
  rationale: 原文表明约书亚获得与智慧有关的属神装备，却未以词形本身明确要求将רוּחַ等同于专名“圣灵”；正文与脚注共同保留这一神学张力。
- issue: בְּנֵי יִשְׂרָאֵל的群体及家族意象
  choice: 译作“以色列子孙”
  alternative: 译作“以色列人”或直译“以色列的众子”
  rationale: “以色列子孙”既保留原文男性复数家族称谓的盟约背景，又比“众子”更符合现代中文群体称呼习惯，不把经文范围误限于生理上的男性。
- issue: 按手与智慧之灵之间的因果关系
  choice: 保留“因为”，直接呈现两者的因果联系
  alternative: 弱化为“摩西曾把双手按在他身上，而他……”
  rationale: כִּי明确引出解释或原因；应保留经文将约书亚充满智慧之灵与摩西按手相联系的陈述，不另行解释其机制。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“嫩的儿子约书亚”保留希伯来文人物介绍形式；“听从约书亚”避免连续使用“他”造成摩西与约书亚之间的指代歧义。脚注[b]依其内容置于“以色列子孙”之后；英文咨询层中该标记虽出现在按手句后，但脚注实际解释的是בְּנֵי יִשְׂרָאֵל。
