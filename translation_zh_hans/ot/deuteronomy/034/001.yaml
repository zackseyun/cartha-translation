  text: וַ/יַּ֨עַל מֹשֶׁ֜ה מֵֽ/עַרְבֹ֤ת מוֹאָב֙ אֶל הַ֣ר נְב֔וֹ רֹ֚אשׁ הַ/פִּסְגָּ֔ה אֲשֶׁ֖ר עַל פְּנֵ֣י יְרֵח֑וֹ וַ/יַּרְאֵ֨/הוּ יְהוָ֧ה אֶת כָּל הָ/אָ֛רֶץ אֶת הַ/גִּלְעָ֖ד עַד דָּֽן־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/034/001.yaml
  text: 'Then Moses went up from the plains of Moab to Mount Nebo[a], to the top of Pisgah, which is opposite Jericho. And Yahweh showed him all the land: Gilead as far as Dan.'
translation:
  language: zh_hans
  text: 摩西从摩押平原登上尼波山，到了毗斯迦山顶；这山在耶利哥对面。雅威使他看见全地[a]：基列，直到但。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“雅威把全地给他看。”
    reason: ראה的使役式可译为“使他看见”或“给他看”；脚注保留自然的词汇表达差异，不增添原文未说明的动作方式。
lexical_decisions:
- source_word: וַיַּעַל
  choice: 上到
  rationale: עלה表示向上移动；“上到”既保留方向，也符合现代汉语叙事表达。
- source_word: מֵעַרְבֹת מוֹאָב
  choice: 从摩押平原
  rationale: עַרְבוֹת指草原或平原地带；此处采用清楚自然且通行的地理名称“摩押平原”。
- source_word: הַר נְבוֹ
  choice: 尼波山
  rationale: 按现代汉语地名习惯，将“山”置于专名之后。
- source_word: רֹאשׁ הַפִּסְגָּה
  choice: 毗斯迦山顶
  rationale: רֹאשׁ本义为“头”，在地形语境中指顶部或峰顶；译作“山顶”自然明确。
- source_word: אֲשֶׁר עַל־פְּנֵי יְרֵחוֹ
  choice: 这山在耶利哥对面
  rationale: עַל־פְּנֵי在地理描述中表示面对或位于对面；“在……对面”准确而通顺。
- source_word: וַיַּרְאֵהוּ יְהוָה
  choice: 雅威把全地指给他看
  rationale: ראה的使役式表示“使看见、给……看”；“指给他看”自然体现使役意义，同时脚注保留较直译的表达。
- source_word: כָּל הָאָרֶץ
  choice: 全地
  rationale: הָאָרֶץ在此指摩西眼前所见的那片土地，而非整个世界；“全地”简洁保留其范围感。
- source_word: אֶת הַגִּלְעָד עַד דָּן
  choice: 基列直到但一带
  rationale: 这一短语具体说明所见土地的范围；“一带”使汉语表达完整，又不把基列和但误解为仅有两个点。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；“雅威”以现代汉语音译保留其作为专名的性质，不以称号代替。
- issue: ראה使役式所表达的神主动使摩西看见
  choice: 把全地指给他看
  alternative: 使他看见全地
  rationale: 两种译法都保留神是行动主体；正文选用较自然的“指给他看”，脚注保留形式上更直接的使役译法，不进一步解释其实现方式。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。地名使用中文圣经传统中通行的“摩押、尼波、毗斯迦、耶利哥、基列、但”，神名则按原文专名音译为“雅威”。以冒号引出“全地”的具体地域说明。
