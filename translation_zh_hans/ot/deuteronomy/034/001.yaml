revisions:
- from: 摩西从摩押平原上到尼波山，到了毗斯迦山顶；这山在耶利哥对面。雅威把全地指给他看[a]：基列直到但一带。
  to: 摩西从摩押平原登上尼波山，到了毗斯迦山顶；这山在耶利哥对面。雅威使他看见全地[a]：基列，直到但。
  rationale: 修订以“使他看见”直接对应ראה的使役式，避免“指给他看”所可能加入的具体动作；调整登山叙述以提升现代汉语流畅度；并删除“基列直到但一带”中的“一带”，使地理范围表述更贴近原文。冒号保留，用于引出“全地”的首项地域说明。
