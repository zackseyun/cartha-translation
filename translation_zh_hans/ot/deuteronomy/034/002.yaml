  text: and all Naphtali[a], and the land of Ephraim and Manasseh, and all the land of Judah as far as the western sea,
translation:
  language: zh_hans
  text: 以及拿弗他利全境、以法莲和玛拿西之地、犹大全地，直到西边的海[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“后面的海”或“末后的海”，是希伯来语对西边海域的称呼，指地中海。
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל נַפְתָּלִי
  choice: 拿弗他利全境
  rationale: “全境”自然表达כָּל与支派名连用时所指的整个支派地域，也避免把此处误解为单指人口。
- source_word: אֶרֶץ אֶפְרַיִם וּמְנַשֶּׁה
  choice: 以法莲和玛拿西之地
  rationale: אֶרֶץ在此指土地或地域；两个支派名由连词并列，共同构成所见地域的描述。
- source_word: כָּל אֶרֶץ יְהוּדָה
  choice: 犹大全地
  rationale: 保留אֶרֶץ的地理含义，并用简洁自然的现代汉语表达“整个犹大地域”。
- source_word: עַד
  choice: 直到
  rationale: 在描述视野或地域延伸范围时，“直到”自然表达其界限与所及之处。
- source_word: הַיָּם הָאַחֲרוֹן
  choice: 西边的海
  rationale: 该短语字面可指“后面的海”，按希伯来方位表达即西面的海；正文译出实际方位，同时用脚注保留其字面意象及具体所指。
