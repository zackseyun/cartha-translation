base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/034/005.yaml
  text: So Moses the servant of Yahweh died there in the land of Moab[a], according to the word of Yahweh.
translation:
  language: zh_hans
  text: 于是，雅威的仆人摩西死在那里，在摩押地，照着雅威的话[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“按雅威的口”；这个惯用语也可译作“遵照雅威的命令”。
    reason: 保留 עַל־פִּי יְהוָה 的字面意象及其可能的惯用译法。
lexical_decisions:
- source_word: וַיָּמָת
  choice: 于是……死
  rationale: 该叙事性连续式承接上文，表明随后发生的事件；“于是”自然体现希伯来语的叙事推进，“死”保留核心意义。
- source_word: שָׁם
  choice: 在那里
  rationale: 保留指回上文地点的处所副词及其指示作用。
- source_word: מֹשֶׁה
  choice: 摩西
  rationale: 采用现代汉语中通行的圣经人名译法。
- source_word: עֶבֶד יְהוָה
  choice: 雅威的仆人
  rationale: עֶבֶד虽可指奴隶，但此处是摩西具有尊荣意味的身份称号，强调他受雅威差遣并忠于雅威；“仆人”比“奴隶”更符合语境。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以汉语音译呈现四字神名，保留其作为专名的性质，而不以“主”这一称号替代。
- source_word: בְּאֶרֶץ מוֹאָב
  choice: 就是在摩押地
  rationale: 原文明确使用“地”一词；“就是”自然说明“在那里”所指的地点，同时保留地理强调。
- source_word: עַל פִּי יְהוָה
  choice: 照着雅威的话
  rationale: 该短语字面涉及“口”，实际是表示依照雅威所说的话或命令的惯用语；此译兼顾原文与现代汉语可读性，并以脚注保留字面意象和另一种译法。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。译作“雅威”保留其专名性质，不用称号取代，也不把另一种传统音译默认为原文读音。
- issue: 摩西称号中 עֶבֶד 的含义
  choice: 仆人
  alternative: 奴隶
  rationale: 虽然该词的语义范围包括“奴隶”，但在此作为摩西的尊荣称号，重点在他与雅威的委任和服事关系；“奴隶”会不当地突出受奴役身份。
- issue: עַל פִּי יְהוָה 与摩西之死的关系
  choice: 照着雅威的话
  alternative: 遵照雅威的命令；按雅威的口
  rationale: 该表达既保留雅威之话的语义，也不额外断定死亡方式。脚注呈现字面措辞和“命令”这一惯用理解，以保留原文的张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“于是”衔接叙事，“就是在摩押地”既避免生硬重复，又完整保留“在那里”和“摩押地”。神名统一译作“雅威”。
