  text: וַ/יִּבְכּוּ֩ בְנֵ֨י יִשְׂרָאֵ֧ל אֶת מֹשֶׁ֛ה בְּ/עַֽרְבֹ֥ת מוֹאָ֖ב שְׁלֹשִׁ֣ים י֑וֹם וַֽ/יִּתְּמ֔וּ יְמֵ֥י בְכִ֖י אֵ֥בֶל מֹשֶֽׁה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/034/008.yaml
  text: And the sons of Israel wept for Moses in the plains of Moab thirty days; then the days of weeping[a] for the mourning of Moses were completed.
translation:
  language: zh_hans
  text: 以色列人在摩押平原为摩西哀哭了三十天；为摩西哀哭、哀悼的日子就结束了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּבְכּוּ
  choice: 哀哭
  rationale: בכה指哭泣；本节语境是为死者举哀，因此“哀哭”既保留实际哭泣的动作，也自然体现哀悼语境，并与后文的“哀悼”有所区别。
- source_word: בְנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 原文直译为“以色列的众子”，在这里是全体以色列民的惯用称谓。现代汉语用“以色列人”最自然，也不会误解为仅指男性。
- source_word: אֶת מֹשֶׁה
  choice: 为摩西
  rationale: אֵת在此标示בכה的对象，即为摩西之死哭泣；汉语以“为摩西哀哭”表达最准确自然。
- source_word: בְּעַרְבֹת מוֹאָב
  choice: 在摩押平原
  rationale: עַרְבוֹת指平坦的草原或旷野地带；“摩押平原”是清楚、简洁且通行的地理表达。
- source_word: שְׁלֹשִׁים יוֹם
  choice: 三十天
  rationale: 直接对应原文的数词与名词。
- source_word: וַיִּתְּמוּ
  choice: 就满了
  rationale: תם表示达到终点、完结。“日子就满了”保留原文完成、期满的语感，同时符合庄重的现代汉语。
- source_word: יְמֵי בְכִי
  choice: 哭泣的日子
  rationale: 该组合指以哭泣为特征的一段时期；译作“哭泣的日子”既贴近结构，也清楚易懂。
- source_word: אֵבֶל מֹשֶׁה
  choice: 为摩西哀悼
  rationale: 该属格结构表示与摩西有关的哀悼，在上下文中即为摩西举哀。并入“为摩西哀悼哭泣的日子”，可自然保留“哭泣”和“哀悼”两个原文成分。
theological_decisions: []
