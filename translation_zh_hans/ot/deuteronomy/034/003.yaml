base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/034/003.yaml
  text: and the Negev[a], and the plain, the valley of Jericho, the city of palm trees[b], as far as Zoar.
translation:
  language: zh_hans
  text: 又有内盖夫[a]和平原，也就是耶利哥谷[b]、棕榈树之城，直到琐珥。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “内盖夫”或译“南地”或“南方”。原文既可作地域名称，也可表示方位或南部地区。
    reason: lexical_alternative
  - marker: b
    text: “耶利哥谷”或译“耶利哥平原”。原文所用的词指宽阔的谷地或平原。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנֶּגֶב
  choice: 内盖夫
  rationale: 在这组地域名称中，该词主要作为专名，采用现代汉语常见音译；脚注保留“南地／南方”的词义可能。
- source_word: הַכִּכָּר
  choice: 平原
  rationale: 该词在地理语境中指约旦河谷一带的平原或区域；译作“平原”自然，并保留后续同位说明。
- source_word: בִּקְעַת יְרֵחוֹ
  choice: 耶利哥谷
  rationale: בִּקְעָה 指宽阔的谷地或平原；正文译作“谷”以与前面的“平原”区分，脚注说明另一译法。
- source_word: עִיר הַתְּמָרִים
  choice: 棕榈树之城
  rationale: 按构词直译，保留耶利哥这一传统称号的具体意象和庄重语气。
- source_word: עַד צֹעַר
  choice: 直到琐珥
  rationale: עַד 表示所见地域延伸的界限，“直到”准确传达范围终点。
- source_word: וְאֶת ... וְאֶת
  choice: 又有……和……
  rationale: 以自然汉语承接上文的列举，同时反映重复连词和宾语标记所表达的累加关系。
theological_decisions: []
