  yaml_path: translation/ot/deuteronomy/034/012.yaml
  text: and for all the mighty hand and for all the great awe that Moses did before the eyes of all Israel[a][b][c][d].
translation:
  language: zh_hans
  text: 以及摩西在全体以色列人眼前[c]所施展的一切大能[a]，以及所行的一切大而可畏的事[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“大能的手”或“强有力的手”；“手”在这里表示力量及其施行。
    reason: lexical_alternative
  - marker: b
    text: “大而可畏的事”也可译为“极其令人畏惧的作为”；原文也可表示“极大的恐惧”，或指令人畏惧之物或作为。
    reason: lexical_alternative
  - marker: c
    text: “在全体以色列人眼前”意为在全体以色列人面前公开施行，使他们亲眼看见。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְכֹל הַיָּד הַחֲזָקָה
  choice: 以及……所施展的一切大能
  rationale: וּלְכֹל承接上文的总结结构；הַיָּד הַחֲזָקָה直译为“大能的手”，是以“手”表示力量及其施行的希伯来语表达。正文译为“施展的一切大能”，既传达其惯用意义，也使现代汉语自然通顺；直译保留在脚注中。
- source_word: וּלְכֹל הַמּוֹרָא הַגָּדוֹל
  choice: 所行的一切大而可畏的事
  rationale: מוֹרָא可指恐惧、可畏之物或令人敬畏的作为。结合עָשָׂה以及本节对摩西作为的总结，译作“大而可畏的事”较符合汉语，同时保留其令人震撼、畏惧的语义，没有将其限定为单纯的内在感受。
- source_word: אֲשֶׁר עָשָׂה מֹשֶׁה
  choice: 摩西……所施展……所行
  rationale: עָשָׂה本义宽泛，可译“做、行”。因两个宾语在汉语中的搭配不同，分别用“施展大能”和“行……事”，避免生硬，却仍让两项都受同一关系从句支配。
- source_word: לְעֵינֵי כָּל יִשְׂרָאֵל
  choice: 在全以色列眼前
  rationale: 保留“在……眼前”的具体意象，表达这些作为是在全体以色列人公开注视之下发生的。
- source_word: כָּל יִשְׂרָאֵל
  choice: 全以色列
  rationale: 保留以色列作为整体民族共同体的集合意义，并符合圣经汉语的庄重语域。
theological_decisions:
- issue: 本节对摩西作为的性质
  choice: 将经文译为对摩西在全以色列面前公开施行大能和可畏之事的总结
  alternative: 把הַיָּד הַחֲזָקָה逐字译作“大能的手”，把הַמּוֹרָא הַגָּדוֹל译作“大恐怖”
  rationale: 原文赞叹摩西公开施行的非凡作为，但没有在本节进一步说明这些作为与神能力之间的关系。正文不加入后来的神学解释，也不把“可畏”弱化为单纯的敬佩。
- issue: 本节与上文的句法连续性
  choice: 以“以及”开头，保留本节承接前文的从属总结结构
  alternative: 补成“也没有人能比得上……”之类的独立句
  rationale: 希伯来文以וּלְכֹל起首，语法上延续前文。保留这种承接关系，可避免在本节内增添原文没有明说的主句。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。本节在原文中承接前文，因此以“以及”开头；用“施展大能／行……事”的自然搭配处理希伯来语两个并列宾语，同时借脚注保留“手”“恐怖”等较直译的可能。
