  naturalness: “在全以色列眼前”虽可理解，但在现代标准汉语中略显压缩，容易把民族共同体当作可见的单一实体。“在全体以色列人眼前”更自然、明确，并保留公开见证的形象。两个并列项目均用“以及”连接，可使承接上文且并列总结的结构更清楚。
