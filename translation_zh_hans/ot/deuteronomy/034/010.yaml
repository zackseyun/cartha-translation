  text: וְ/לֹֽא קָ֨ם נָבִ֥יא ע֛וֹד בְּ/יִשְׂרָאֵ֖ל כְּ/מֹשֶׁ֑ה אֲשֶׁר֙ יְדָע֣/וֹ יְהוָ֔ה פָּנִ֖ים אֶל פָּנִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/034/010.yaml
  text: And no prophet has arisen again in Israel like Moses[a], whom Yahweh knew face to face.
translation:
  language: zh_hans
  text: 此后，以色列中再没有兴起过像摩西那样的先知[a]；耶和华与他面对面相识。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “此后……再没有”也可理解为“直到那时……还没有”；希伯来语副词可强调，截至叙述者所处的时点，以色列中尚未兴起像摩西那样的先知。
    reason: 保留 עוֹד 在此处可能具有的时间视角差异。
lexical_decisions:
- source_word: וְלֹא
  choice: 再没有
  rationale: 结合上下文和副词 עוֹד，译为“再没有”，自然承接全书结语；不额外加入希伯来文未明确表达的强烈转折。
- source_word: קָם
  choice: 兴起过
  rationale: קום 在先知语境中指先知的出现或兴起；“兴起过”既保留原有意象，也符合回顾性的叙述视角。
- source_word: נָבִיא
  choice: 先知
  rationale: 这是 נָבִיא 在本语境中的标准、清楚译法。
- source_word: עוֹד
  choice: 此后……再
  rationale: עוֹד 在这里具有延续到叙述者所处时点的时间含义；用“此后……再没有”自然表达摩西以后未有同等先知兴起，同时以脚注保留“直到那时还没有”的可能理解。
- source_word: בְּיִשְׂרָאֵל
  choice: 以色列中
  rationale: 介词 בְּ 表示范围，即在以色列群体之中；“以色列中”简洁自然。
- source_word: כְּמֹשֶׁה
  choice: 像摩西那样的
  rationale: 直接表达介词 כְּ 的比较意义，符合现代汉语习惯。
- source_word: אֲשֶׁר יְדָעוֹ
  choice: 耶和华曾……认识他
  rationale: ידע 带人称宾语，基本义为“认识”；不将其弱化为仅仅“知道”，也不扩展为原文未明说的教义性解释。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经语境中对四字神名的通行音译，保留其作为专名的功能，而不改译为称号。
- source_word: פָּנִים אֶל פָּנִים
  choice: 面对面
  rationale: 保留希伯来文具体而鲜明的惯用表达及其与相关经文的呼应，不抽象化为“亲自”或“直接”。
theological_decisions:
- issue: 耶和华与摩西“面对面”的拟人性关系语言
  choice: 保留“面对面认识他”
  alternative: 译作“亲自认识他”或“直接向他显明自己”
  rationale: 原文以具体关系性语言描写耶和华与摩西之间独特而直接的相识。保留该意象可维持经文的神学张力，而不预先断定这是否涉及可见形体，也不把“认识”改释为某一种启示理论。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“兴起过”适合历史回顾语境；分号使摩西的独特性与耶和华对他的直接认识彼此关联，同时避免把后半句处理得过于解释化。
