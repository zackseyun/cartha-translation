base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/034/007.yaml
  text: Moses was one hundred twenty years old when he died[a]; his eye had not grown dim[b], and his vigor had not fled.
translation:
  language: zh_hans
  text: 摩西去世时一百二十岁；他的眼睛没有昏花[a]，精力也没有消退[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“他的视力没有衰退”。希伯来文直译为“他的眼睛没有昏花”。
    reason: lexical_alternative
  - marker: b
    text: 或译“元气也没有衰减”或“身体的活力也没有消失”。这里的希伯来语惯用表达指身体仍保持活力。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֹשֶׁה
  choice: 摩西
  rationale: 句首的连接词承接前文，在现代汉语中无须机械译作“并且”或“如今”；省译可保持自然的叙事衔接，也不增添原文没有的时间含义。
- source_word: בֶּן מֵאָה וְעֶשְׂרִים שָׁנָה
  choice: 一百二十岁
  rationale: 希伯来语“……岁之子”是表达年龄的惯用语，译为“一百二十岁”准确而自然。
- source_word: בְּמֹתוֹ
  choice: 去世时
  rationale: 介词与“他的死亡”构成时间表达；“去世时”简洁、庄重，并准确传达时间关系。
- source_word: לֹא כָהֲתָה עֵינוֹ
  choice: 他的眼睛没有昏花
  rationale: כָהָה表示变暗、衰弱，此处指视力；保留原文单数“眼睛”的表达，并以“昏花”自然传达视力未衰。
- source_word: וְלֹא נָס לֵחֹה
  choice: 精力也没有消退
  rationale: לֵחַ可指新鲜、润泽或身体活力，与נוּס“逃走、消逝”连用，表示生命力未减。“精力没有消退”在现代汉语中清楚自然，同时保留活力未衰的意思。
