  register: 采用现代、庄重而易懂的叙事语言。“去世”比“死”更符合本节的庄重语境；分号呈现年龄陈述与身体状况说明之间的结构。脚注标记依其实际所注释的短语分别置于“昏花”和“消退”之后。
