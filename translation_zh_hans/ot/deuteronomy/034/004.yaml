  naturalness: 整体庄重、清晰。将“起誓所应许的……我曾说”改为“起誓说”可避免汉语中修饰链过长且逻辑关系略显含混的问题。“不能越过到那里去”保留空间越过意象，较“不能过到那里去”更合现代汉语搭配。
  terminology: “耶和华”“土地”“起誓”“赐给”“后裔”均恰当；“后裔”能自然表达希伯来语集合性的 זֶרַע，且不把所指限定为单一个体。脚注应说明其集合名词功能，而非说“可指一个人的后裔”，后者表述不够准确。
