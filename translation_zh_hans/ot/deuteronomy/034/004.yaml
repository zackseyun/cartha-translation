source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֵלָ֗י/ו זֹ֤את הָ/אָ֨רֶץ֙ אֲשֶׁ֣ר נִ֠שְׁבַּעְתִּי לְ/אַבְרָהָ֨ם לְ/יִצְחָ֤ק וּֽ/לְ/יַעֲקֹב֙ לֵ/אמֹ֔ר לְ/זַרְעֲ/ךָ֖ אֶתְּנֶ֑נָּ/ה הֶרְאִיתִ֣י/ךָ בְ/עֵינֶ֔י/ךָ וְ/שָׁ֖מָּ/ה לֹ֥א תַעֲבֹֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/034/004.yaml
  text: And Yahweh said to him[a], “This is the land that I swore to Abraham, to Isaac, and to Jacob, saying, ‘I will give it to your offspring.’ I have let you see it with your own eyes, but you will not cross over there.”
translation:
  language: zh_hans
  text: 耶和华对他说：“这就是我向亚伯拉罕、以撒和雅各起誓说：‘我要把它赐给你的后裔[a]’的那片土地。我已经让你亲眼看见了，但你不能越过到那里去。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“种子”；希伯来语为单数形式，可作集合名词，指后代群体。
    reason: 说明原文关键词的字面意义及其单数集合用法，避免将所指限定为单一个体或不必要地显式复数化。
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文读者熟悉的专名形式来翻译四字神名，保留原文以专名称呼上帝的特点，而不以“主”替代。
- source_word: זֹאת הָאָרֶץ
  choice: 这就是……那片土地
  rationale: 此处指族长之约中所应许的特定土地；“那片土地”既自然，也保留其具体地域含义。
- source_word: נִשְׁבַּעְתִּי
  choice: 起誓所应许
  rationale: 原词明确表示起誓；结合随后引出的赐地诺言，译为“起誓所应许”兼顾誓言的庄严性和现代汉语的自然表达。
- source_word: לְאַבְרָהָם לְיִצְחָק וּלְיַעֲקֹב
  choice: 向亚伯拉罕、以撒和雅各
  rationale: 准确呈现三位族长及誓言的对象，中文无需机械重复介词。
- source_word: לֵאמֹר
  choice: 我曾说
  rationale: 用独立引语自然引出誓言内容，也清楚表明说话者仍是耶和华。
- source_word: לְזַרְעֲךָ
  choice: 给你的后裔[a]
  rationale: זֶרַע形式为单数，却可作集合名词指一个人的后代；“后裔”在中文中同样可作集合称谓，不强行限定人数。
- source_word: אֶתְּנֶנָּה
  choice: 我要把它赐给
  rationale: 保留应许公式中的将来意义；“赐给”符合上帝赐地的语境，也庄重自然。
- source_word: הֶרְאִיתִיךָ בְעֵינֶיךָ
  choice: 我已经让你亲眼看见了
  rationale: “让你……看见”体现使役形含义，“亲眼”自然传达原文“用你的眼睛”的强调。
- source_word: וְשָׁמָּה לֹא תַעֲבֹר
  choice: 但你不能过到那里去
  rationale: “但”表达看见与不能过去之间的转折；“过到那里去”保留 עבר 的越过、渡过空间意象，不直接解释为“进入”。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 原文直接使用上帝的专名。正文采用中文圣经传统中最广为人知的专名“耶和华”，避免用头衔替代专名；同时不据此增添任何宗派性解释。
- issue: 族长之约中 זֶרַע 的数与所指
  choice: 后裔
  alternative: 种子；子孙
  rationale: 原文是单数形式的集合名词，语境可指整体后代。“后裔”保留集合性，不把它解释成某一个特定个体，也不强行改成显式复数；脚注交代其字面形态。
- issue: 摩西看见土地却不能过去的对比
  choice: 但你不能过到那里去
  alternative: 你却不能进入那里
  rationale: 译文保留原文的限制和过渡意象，不在本节中补充其原因，也不弱化其中的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。引语层次清楚，保留誓言、赐地、亲眼看见和不能越过去等原文重点；避免古奥表达和额外神学阐释。
