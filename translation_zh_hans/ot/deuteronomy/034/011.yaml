  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: לְ/כָל הָ֨/אֹת֜וֹת וְ/הַ/מּוֹפְתִ֗ים אֲשֶׁ֤ר שְׁלָח/וֹ֙ יְהוָ֔ה לַ/עֲשׂ֖וֹת בְּ/אֶ֣רֶץ מִצְרָ֑יִם לְ/פַרְעֹ֥ה וּ/לְ/כָל עֲבָדָ֖י/ו וּ/לְ/כָל אַרְצֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/034/011.yaml
  text: for all the signs and the wonders that Yahweh sent him to do in the land of Egypt[a], to Pharaoh and to all his servants and to all his land,
translation:
  language: zh_hans
  text: 论到雅威差遣他在埃及地向法老、法老所有的臣仆和他的全地[a]所行的一切神迹奇事，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “和他的全地”也可理解为“针对他的全地”或“遍及他的全地”。这里的希伯来介词可以表达不同的关系。
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכָל הָאֹתוֹת וְהַמּוֹפְתִים
  choice: 论到……一切神迹奇事
  rationale: 句首的 לְכָל 承接上一节，说明摩西在哪些事上无人可比；“论到”自然保留这种句法关联。“神迹奇事”准确传达 אוֹת 与 מוֹפֵת 的惯用搭配及其非凡性质。
- source_word: אֲשֶׁר שְׁלָחוֹ יְהוָה לַעֲשׂוֹת
  choice: 雅威差遣他……所行的
  rationale: שׁלח 的宾语后缀指摩西，לַעֲשׂוֹת 表明受差遣去施行这些事；中文采用关系结构，使句子自然，又不增添原文没有的信息。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语中对应 Yahweh 的音译“雅威”呈现四字神名，保留其作为专名的性质，不以称号替代。
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: 在埃及地
  rationale: 既完整反映 אֶרֶץ，也符合庄重、自然的现代汉语叙事表达。
- source_word: לְפַרְעֹה וּלְכָל עֲבָדָיו
  choice: 向法老、法老所有的臣仆
  rationale: לְ 在此表示行动所指向或涉及的对象；王室语境中的 עֲבָדִים 译为“臣仆”，比单纯“仆人”更贴合语境，同时未限定为某一种官职。
- source_word: וּלְכָל אַרְצוֹ
  choice: 和他的全地
  rationale: 保留 לְ 与前两个对象并列的结构及关系上的含混，不在正文中武断限定为“攻击”或“遍及”；脚注列出合乎语境的理解。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用以色列上帝的四字神名；译作“雅威”旨在呈现专名本身，而非用“主”等称号替代。
- issue: 神迹所指向法老及埃及全地的关系
  choice: 采用较贴近形式的“向……和他的全地”，并加脚注
  alternative: 针对法老……和他的全地／遍及他的全地
  rationale: 希伯来介词 לְ 可表达指向、涉及或不利影响等关系；上下文容许“针对”和“遍及”等理解，因此不在正文中消除这层张力。
translation_notes:
  register: 采用现代、庄重而易懂的汉语。本节在句法上承接第10节，因此保留句末逗号和“论到……”结构。为避免连续两个“他”造成指代混乱，第二处明确说“法老所有的臣仆”；“他的全地”仍自然指法老所统治的全地。
