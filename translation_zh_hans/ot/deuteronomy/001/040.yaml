  yaml_path: translation/ot/deuteronomy/001/040.yaml
  text: But as for you[a], turn yourselves around and set out for the wilderness by the way of the Red Sea.
translation:
  language: zh_hans
  text: 至于你们，要转身，向旷野出发，取道红海[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “红海”原文直译可作“芦苇海”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַתֶּם
  choice: 至于你们
  rationale: 独立代词带出强调，并与上文对那一代人的判决形成对比；“至于你们”自然保留这种转折和强调。
- source_word: פְּנוּ לָכֶם
  choice: 要转身
  rationale: פנה命令改变行进方向，לָכֶם在此属习惯性加强表达。现代汉语用“转身”即可自然表达方向逆转，无须生硬直译为“为自己转身”。
- source_word: וּ/סְעוּ
  choice: 出发
  rationale: נסע在行旅语境中常指拔营启程；“出发”简洁自然，并保留命令他们开始行进的意思。
- source_word: הַמִּדְבָּרָה
  choice: 向旷野
  rationale: 词尾方向性-ה表示朝向旷野；“向旷野”保留方向意义，不将其过度限定为已经进入旷野。
- source_word: דֶּרֶךְ
  choice: 走……那条路
  rationale: דֶּרֶךְ在此说明行进路线；汉语“走……那条路”比逐字译作“借着……的道路”更自然。
- source_word: יַם סוּף
  choice: 红海
  rationale: “红海”是中文圣经传统和现代通行地名；希伯来语字面可理解为“芦苇海”，故以脚注保留词义透明度。
