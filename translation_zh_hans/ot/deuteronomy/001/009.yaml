  yaml_path: translation/ot/deuteronomy/001/009.yaml
  text: And I said to you at that time, saying, ‘I am not able to bear you by myself.’
translation:
  language: zh_hans
  text: 那时，我对你们说：“我不能独自担当你们。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּעֵת הַהִוא
  choice: 那时
  rationale: 自然对应希伯来语时间短语，并保持叙事衔接。
- source_word: לֵאמֹר
  choice: 不单独译出
  rationale: 此处用于引出直接引语；现代汉语以冒号和引号自然表达，若机械译作“说”会显得累赘。
- source_word: לֹא אוּכַל
  choice: 我不能
  rationale: 准确保留说话者能力不足的直陈语气。
- source_word: לְבַדִּי
  choice: 独自
  rationale: 简洁表达“只有我一人、靠我自己”的意思。
- source_word: שְׂאֵת אֶתְכֶם
  choice: 担当你们
  rationale: 保留 נשׂא“承载、承担”的比喻性与开放性，既可指治理重担，也不将对象窄化为某一项事务。
theological_decisions:
- issue: “担当你们”的含义范围
  choice: 保留人物本身作为“担当”的对象
  alternative: 担当管理你们的重任
  rationale: 原文直接以“你们”为宾语，含义可涵盖带领、审理和治理的重担；不在本节中增补解释，以保留原文张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。省略希伯来语引语公式 לֵאמֹר 的机械复现，用中文标点承担其功能；整体保持简洁、口语可懂而不失经文语体。
