base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/032.yaml
  text: Yet in this matter you did not believe in Yahweh your God[a].
translation:
  language: zh_hans
  text: 然而在这件事上，你们却不信耶和华你们的上帝[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“信靠耶和华你们的上帝”；也可译：“相信耶和华你们的上帝”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בַ/דָּבָר הַ/זֶּה
  choice: 然而在这件事上
  rationale: דָּבָר在此指前文所述的事情，而非单指话语；וּ在责备语境中带轻微转折意味，译为“然而”，הַזֶּה则明确指向刚才叙述的事。
- source_word: אֵינְ/כֶם מַאֲמִינִם
  choice: 你们却不信
  rationale: 否定词与אמן的使役分词描述以色列人在当时持续表现出的不信；现代汉语用“不信”简洁自然，“却”凸显其与耶和华先前引导、应许之间的反差。
- source_word: בַּ/יהוָה
  choice: 信耶和华
  rationale: אמן与介词ב连用，可表达相信或信靠某人。汉语“信耶和华”既可包含相信其话语，也可包含对他的信靠，适度保留原文的语义张力。神名按本译本惯例译作“耶和华”。
- source_word: אֱלֹהֵי/כֶם
  choice: 你们的上帝
  rationale: 忠实呈现带第二人称复数词尾的结构，保留摩西责备中所强调的盟约关系。
theological_decisions:
- issue: אמן + ב指向耶和华时的含义
  choice: 信耶和华你们的上帝
  alternative: 信靠耶和华你们的上帝；相信耶和华你们的上帝
  rationale: 原结构可兼有相信耶和华所说之话和信靠耶和华本身两层含义。“信”在现代汉语中能够承载这种开放性，不把经文仅限缩为理智认同或倚靠。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“然而……却……”自然呈现摩西责备中的转折和强调；句法简洁，适合普通读者朗读与理解。
