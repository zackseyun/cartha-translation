base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/028.yaml
  text: Where are we going up? Our brothers have melted our hearts[a], saying, ‘The people are greater and taller than we are; the cities are great and fortified up to the heavens; and besides[c][b], we saw the sons of the Anakim there.’
translation:
  language: zh_hans
  text: “我们要上哪里去呢？我们的弟兄使我们心都发软了[a]，说：‘那民比我们更庞大，身材也比我们高大；城邑又大又坚固，高耸入天[b]；而且我们还在那里看见了亚衲的子孙[c]。’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“使我们的心融化了”，意思是使我们丧胆、失去勇气。
    reason: lexical_alternative
  - marker: b
    text: 原文为“坚固在天上”，是形容防御工事极其高大的夸张说法。
    reason: cultural_note
  - marker: c
    text: 也可译作“亚衲族人”或“亚衲的后裔”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אָנָה אֲנַחְנוּ עֹלִים
  choice: 我们要上哪里去呢
  rationale: אָנָה询问目的地，עֹלִים保留“上去”的行进意象；汉语以“要上哪里去”自然表达正在面对的进发行动。
- source_word: אַחֵינוּ
  choice: 我们的弟兄
  rationale: 保留阳性复数亲属称谓及同族同胞的修辞，不扩展为原文未明说的双性表达。
- source_word: הֵמַסּוּ אֶת־לְבָבֵנוּ
  choice: 使我们心都发软了
  rationale: 此使役结构直译为“使我们的心融化”，表示勇气消失；“心都发软”在现代汉语中自然传达丧胆之意，同时脚注保留原文意象。
- source_word: עַם גָּדוֹל וָרָם מִמֶּנּוּ
  choice: 那民比我们强大，又比我们高壮
  rationale: גָּדוֹל在此兼有强大、规模大的意味，רָם突出身量高；分别译出，避免只理解为抽象的“伟大”。
- source_word: עָרִים גְּדֹלֹת וּבְצוּרֹת בַּשָּׁמָיִם
  choice: 城邑又大又坚固，直达天际
  rationale: 保留城邑庞大、设防坚固及“在天上”的夸张高度意象；脚注说明其修辞性质。
- source_word: וְגַם
  choice: 而且……还
  rationale: 表现报告中继续叠加可怕信息的语气。
- source_word: בְּנֵי עֲנָקִים
  choice: 亚衲的子孙
  rationale: 保留“子孙”这一来源明确的族群表达及专名亚衲，不预先把它解释成巨人或特定人种。
- source_word: רָאִינוּ שָׁם
  choice: 我们还在那里看见了
  rationale: 以自然汉语过去叙事表达侦察者亲眼所见，并保留地点副词“在那里”。
