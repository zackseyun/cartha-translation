  text: וָ/אֲצַוֶּה֙ אֶת שֹׁ֣פְטֵי/כֶ֔ם בָּ/עֵ֥ת הַ/הִ֖וא לֵ/אמֹ֑ר שָׁמֹ֤עַ בֵּין אֲחֵי/כֶם֙ וּ/שְׁפַטְתֶּ֣ם צֶ֔דֶק בֵּֽין אִ֥ישׁ וּ/בֵין אָחִ֖י/ו וּ/בֵ֥ין גֵּרֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/016.yaml
  text: And at that time I commanded your judges[a], saying, ‘Hear the cases between your brothers[c][b], and judge righteously between a man and his brother or the resident foreigner with him.’
translation:
  language: zh_hans
  text: 那时，我吩咐你们的审判官说：“你们要听取弟兄之间的案件，并要在一个人与其弟兄之间，以及在他与同住的寄居者[a]之间，按公义施行审判[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “同住的寄居者”也可译作“与他相关的寄居者”。希伯来文גֵּר（ger）指居住在以色列人中间的非本族居民；其后缀所表示的具体关联在本句中并不完全明确。
    reason: 说明גֵּר的社会身份，并保留גֵּרוֹ后缀关联的句法歧义，避免将其限定为居住在某人住所。
  - marker: b
    text: “按公义施行审判”也可译作“公正地审判”。希伯来文צֶדֶק（tsedeq）在司法语境中兼有公义与公正的含义。
    reason: 保留צֶדֶק在司法语境中的双重语义，并为正文的“公义”提供自然的替代译法。
lexical_decisions:
- source_word: וָאֲצַוֶּה
  choice: 我吩咐
  rationale: צוה表示权威性的命令或嘱咐；“吩咐”在此既准确又符合现代汉语叙事语体。
- source_word: שֹׁפְטֵיכֶם
  choice: 你们的审判官
  rationale: 该词指受任处理并裁断法律事务的人；“审判官”比单说“法官”更适合古代以色列的制度语境。
- source_word: בָּעֵת הַהִוא
  choice: 那时
  rationale: 自然、简洁地表达所述时期，与上下文衔接顺畅。
- source_word: שָׁמֹעַ בֵּין אֲחֵיכֶם
  choice: 听取弟兄之间的案件
  rationale: שׁמע在司法语境中指听审；补出“案件”能在汉语中清楚呈现司法含义，而“弟兄”保留原文的盟约群体亲属称谓。
- source_word: וּשְׁפַטְתֶּם צֶדֶק
  choice: 并且要按公义审判
  rationale: צֶדֶק在司法语境中兼有公义与公正的意义；“按公义审判”保留其道德与法律双重色彩。
- source_word: בֵּין אִישׁ וּבֵין אָחִיו
  choice: 一个人与他的弟兄之间
  rationale: 保留原文具体的单数表达和亲属意象，不将其泛化为“彼此”或“双方”。
- source_word: גֵּרוֹ
  choice: 寄居在他那里的外族人
  rationale: גֵּר指住在以色列人中间、并非本地族群成员的居民；此译同时表达寄居身份、外来背景及后缀所示的关联。
theological_decisions:
- issue: אֲחֵיכֶם和אָחִיו的阳性亲属群体语言
  choice: 弟兄／他的弟兄
  alternative: 同胞／同族人／邻舍
  rationale: 原文以亲属称谓描写盟约群体成员。保留“弟兄”可呈现这一文本特色，同时不把法律原则限制为只适用于男性。
- issue: 司法语境中צֶדֶק的含义
  choice: 按公义审判
  alternative: 公正地审判／按正义审判
  rationale: 该词兼具道德正直和司法公正的语义；正文采用“公义”，脚注说明“公正”也是合适译法，以保留原文的语义张力。
- issue: גֵּר的群体与法律身份
  choice: 寄居在他那里的外族人
  alternative: 寄居者／寄居的外人
  rationale: 该词并非泛指短暂停留的旅客，而是指住在以色列社会中的非本族居民。译文既保留其外族身份，也避免暗示其不受司法保障。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。法律语境通过“听取……案件”“审判”明确表达；保留“弟兄”的亲属群体意象，并以“寄居在他那里的外族人”自然呈现גֵּר及其单数后缀。
