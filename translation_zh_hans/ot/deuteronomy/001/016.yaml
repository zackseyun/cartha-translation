revisions:
- from: 那时，我吩咐你们的审判官说：“你们要听取弟兄之间的案件，并且要按公义审判，无论是一个人与他的弟兄之间，还是与寄居在他那里的外族人之间。[a]”
  to: 那时，我吩咐你们的审判官说：“你们要听取弟兄之间的案件，并要在一个人与其弟兄之间，以及在他与同住的寄居者[a]之间，按公义施行审判[b]。”
  rationale: 修订集中处理末句的句法和גֵּרוֹ的关联。以“同住的寄居者”取代“寄居在他那里的外族人”，使现代汉语更自然；脚注明确该关联本身并不完全确定。将“无论是……还是……”改为并列结构，避免增加原文未明示的排他意味。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T04:57:04Z'
review_pass:
  verdict: revise
  source_fidelity: 译文准确传达了摩西在当时向审判官所下的命令、听讼的司法语境，以及按צֶדֶק施行审判的要求。但“寄居在他那里的外族人”把גֵּרוֹ的关联表达得不自然，且“在他那里”容易误解为居住地点或附属关系；原文更稳妥地指与该人相关的寄居者。末句的“无论是……还是……”也较强地引入了二选一式结构，原文并未要求这种排他性。
  naturalness: “听取弟兄之间的案件”和“按公义审判”庄重且可懂；但末句“无论是一个人与他的弟兄之间，还是与寄居在他那里的外族人之间”句法负担较重，特别是“寄居在他那里”不合现代汉语的自然表达。改为“在一个人与其弟兄之间，以及在他与同住的寄居者之间”较为顺畅。
  terminology: “审判官”“弟兄”“公义”均可保留。“寄居者”比“外族人”更直接对应גֵּר所指的定居于以色列社会中的非本地成员；脚注说明其非本族居民的身份，避免把该词泛化为短暂停留者。“按公义施行审判”保留צֶדֶק的道德—司法双重内涵，脚注给出“公正地审判”的可行译法。
  issues:
