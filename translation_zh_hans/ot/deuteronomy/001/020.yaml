base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/020.yaml
  text: And I said to you[a], “You have come to the hill country of the Amorites, which Yahweh our God is giving us.”
translation:
  language: zh_hans
  text: 我对你们说：“你们已经来到亚摩利人的山地[a]；雅威——我们的神——正把这山地赐给我们。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“亚摩利人的山”。希伯来语此词可指一座山，也可泛指山区或山地。
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר אֲלֵכֶם
  choice: 我对你们说
  rationale: וָאֹמַר承接叙事次序；现代汉语通常不必机械译出连接词。אֲלֵכֶם是第二人称阳性复数，因此明确译作“你们”而非可能兼指单复数的“你”。
- source_word: בָּאתֶם עַד
  choice: 你们已经来到
  rationale: 完成式表示已经到达，而עַד在移动动词后标明所到的终点；“已经来到”自然表达已经抵达且与当前处境相关。
- source_word: הַר הָאֱמֹרִי
  choice: 亚摩利人的山地
  rationale: הַר在此可指山区或山地，不一定是单独一座山；הָאֱמֹרִי为集合性族称，故译作“亚摩利人的”。
- source_word: אֲשֶׁר
  choice: 这是……的地方
  rationale: 用指示句承接前面的“山地”，自然表达修饰该地域的关系从句，并补出汉语语义所需的“地方”。
- source_word: יְהוָה אֱלֹהֵינוּ
  choice: 雅威我们的神
  rationale: 以“雅威”音译四字神名，保留其专名性质；אֱלֹהֵינוּ直译为“我们的神”。
- source_word: נֹתֵן לָנוּ
  choice: 正赐给我们的
  rationale: 分词נֹתֵן可表达正在进行或当前生效的赐予；“正赐给”保留这种未被简单处理为过去完成的时态张力，לָנוּ译为“给我们”。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较贴近学界通行的拟读，同时不以“主”这一称号代替专名。
- issue: נֹתֵן所表达的赐地行动
  choice: 正赐给我们的
  alternative: 要赐给我们的
  rationale: 分词容许正在进行或迫近实现的理解。正文采用“正赐给”保留当前施行的意味，不将其单限定为纯粹将来；“要赐给”也是上下文允许的理解。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。用“你们”显明原文复数；分号使后面的关系说明清楚而不显冗长。脚注标记紧随存在词义选择的“山地”。
