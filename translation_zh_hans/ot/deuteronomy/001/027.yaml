  text: וַ/תֵּרָגְנ֤וּ בְ/אָהֳלֵי/כֶם֙ וַ/תֹּ֣אמְר֔וּ בְּ/שִׂנְאַ֤ת יְהוָה֙ אֹתָ֔/נוּ הוֹצִיאָ֖/נוּ מֵ/אֶ֣רֶץ מִצְרָ֑יִם לָ/תֵ֥ת אֹתָ֛/נוּ בְּ/יַ֥ד הָ/אֱמֹרִ֖י לְ/הַשְׁמִידֵֽ/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/027.yaml
  text: And you grumbled in your tents and said[a], ‘Because Yahweh hates us, he brought us out of the land of Egypt to give us into the hand of the Amorites[b], to destroy us.’
translation:
  language: zh_hans
  text: 你们在帐篷里发怨言说：“雅威恨我们，所以把我们从埃及地领出来，要把我们交在亚摩利人手中[a]，消灭我们。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“把我们交给亚摩利人”；原文直译为“把我们交在亚摩利人的手中”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּרָגְנוּ
  choice: 发怨言
  rationale: רגן表示因不满而私下抱怨、嘀咕；“发怨言”在现代汉语中自然，也保留了负面语气。
- source_word: בְאָהֳלֵיכֶם
  choice: 在帐篷里
  rationale: 按地点义直译，保留旷野旅居的具体场景。
- source_word: בְּשִׂנְאַת יְהוָה אֹתָנוּ
  choice: 雅威恨我们，所以
  rationale: 介词בְּ与抽象名词“恨”在此表达原因；转换为汉语因果句，清楚呈现百姓对雅威的指控，同时不把该指控当作叙述者的判断。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，保留其专名性质，不以称号替代。
- source_word: הוֹצִיאָנוּ מֵאֶרֶץ מִצְרָיִם
  choice: 把我们从埃及地领出来
  rationale: 准确表达使役移出之意，并保留原文“埃及地”的措辞。
- source_word: לָתֵת אֹתָנוּ בְּיַד הָאֱמֹרִי
  choice: 把我们交在亚摩利人手中
  rationale: 保留“交在……手中”这一清楚可懂的圣经习语，表示交由对方掌控；集体单数הָאֱמֹרִי按族群译为复数概念。
- source_word: לְהַשְׁמִידֵנוּ
  choice: 消灭我们
  rationale: 准确传达שׁמד使役式所含的毁灭、灭绝之意，力度充分而不过度扩展。
theological_decisions:
- issue: 四字神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文使用神的专名；“雅威”较直接反映学界通常重构的读音，并保留专名而非改用“主”等称号。
- issue: “雅威恨我们”的话语性质
  choice: 保留为百姓引语中的指控
  alternative: 改写为较弱的“雅威不喜爱我们”
  rationale: 原文שִׂנְאָה明确是“恨”，其神学张力来自百姓对出埃及目的的错误解读；译文不应弱化，也不应暗示叙述者认可这一指控。
translation_notes:
  register: 采用现代、庄重且口语可懂的叙事语言。“发怨言”比“喃喃抱怨”简洁自然；引语保持强烈控诉语气。所有代词按汉语惯例处理，神名使用“雅威”。
