  text: וַֽ/תַּעֲנ֣וּ וַ/תֹּאמְר֣וּ אֵלַ֗/י חָטָאנוּ֮ לַֽ/יהוָה֒ אֲנַ֤חְנוּ נַעֲלֶה֙ וְ/נִלְחַ֔מְנוּ כְּ/כֹ֥ל אֲשֶׁר צִוָּ֖/נוּ יְהוָ֣ה אֱלֹהֵ֑י/נוּ וַֽ/תַּחְגְּר֗וּ אִ֚ישׁ אֶת כְּלֵ֣י מִלְחַמְתּ֔/וֹ וַ/תָּהִ֖ינוּ לַ/עֲלֹ֥ת הָ/הָֽרָ/ה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/041.yaml
  text: Then you answered and said to me[a], ‘We have sinned against Yahweh. We ourselves will go up and fight, according to all that Yahweh our God commanded us.’ Then each man strapped on his weapons of war[b], and you presumptuously set out to go up into the hill country.
translation:
  language: zh_hans
  text: 于是你们回答我说：“我们得罪了雅威。我们要上去，照雅威我们上帝所吩咐我们的一切去争战。”于是你们各自佩上作战的装备，贸然[a]要上山地[b]去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “贸然”所译的希伯来语动词十分罕见，也可理解为“轻率地上去”“擅自上去”或“决意上去”；这里的语境带有过度自信的意味。
    reason: lexical_alternative
  - marker: b
    text: “山地”原文直译为“山”；在本段语境中也可能泛指一片丘陵山区。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעֲנוּ וַתֹּאמְרוּ אֵלַי
  choice: 于是你们回答我说
  rationale: 保留希伯来语引出回应的叙事结构；“回答我说”庄重、清楚，也自然衔接直接引语。
- source_word: חָטָאנוּ לַיהוָה
  choice: 我们得罪了雅威
  rationale: חטא 后接 ל 指犯罪所冒犯的对象；“得罪了”是自然的现代汉语表达，并保留关系层面的含义。
- source_word: נַעֲלֶה וְנִלְחַמְנוּ
  choice: 我们要上去争战
  rationale: “上去”保留 עלה 的空间方向，“争战”准确表达 Niphal 形式在战争语境中的交战含义。
- source_word: כְּכֹל אֲשֶׁר צִוָּנוּ
  choice: 照……所吩咐我们的一切去做
  rationale: 明确表达他们声称要完全遵照命令行动；补出“去做”使现代汉语完整自然，并未增加实质内容。
- source_word: וַתַּחְגְּרוּ אִישׁ אֶת כְּלֵי מִלְחַמְתּוֹ
  choice: 于是你们各人束上自己的兵器
  rationale: “各人”体现 אִישׁ 的逐一分配意义；“束上”保留 חגר 将装备系在身上的动作，“兵器”简洁涵盖战争装备。
- source_word: וַתָּהִינוּ
  choice: 竟贸然
  rationale: 该动词罕见，语境显示以色列人在雅威禁止之后仍自信行事；“贸然”传达轻率、过度自信的负面意味，而“竟”呼应叙事中的反常转折。
- source_word: לַעֲלֹת הָהָרָה
  choice: 上到山地去
  rationale: 保留 לַעֲלֹת 与方向词尾所表达的向上运动；此处 הָהָר 可指一片山地区域，因此正文采用“山地”，并以脚注保留“山”的字面可能。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译呈现四字神名，保留其专名性质，不用称号替代。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较贴近学界通常重构的读音，并明确将其作为专名呈现。
- issue: וַתָּהִינוּ 对以色列行动的评价色彩
  choice: 竟贸然
  alternative: 就决意
  rationale: 紧接下文的责备与禁令，语境支持轻率、僭越或过度自信的负面意味；但该词罕见，脚注保留其他理解，避免把词义的不确定性完全消除。
- issue: הָהָר 的地理范围
  choice: 山地
  alternative: 山
  rationale: 本段涉及亚摩利人的山地区域，集合或地域性的“山地”更合语境；同时以脚注注明字面译法，保留单数形式可能造成的歧义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“争战”“吩咐”等词保持经文语体，但避免陈旧句法。两个脚注标记都紧随其所说明的短语所在句末，正文与脚注对应明确。
