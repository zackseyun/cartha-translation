  - severity: low
    issue: “束上自己的兵器”略显生硬且稍限缩原文范围。
    rationale: חגר 表示系上、佩带；כְּלֵי מִלְחָמָה 可包含各种作战装备。用“各自佩上作战的装备”更自然而不缩窄词义。
