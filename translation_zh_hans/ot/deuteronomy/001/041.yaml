  terminology: “雅威”一致、适当；“上帝”“得罪”“争战”均合乎现代中文圣经语体。כְּלֵי מִלְחַמְתּוֹ 是“作战装备／兵器”，用“作战的装备”可避免将其限缩为仅武器。罕见动词 וַתָּהִינוּ 的负面语气宜保留脚注中的替代解释。
  issues:
