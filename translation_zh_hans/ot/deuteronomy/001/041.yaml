  source_fidelity: 译文总体忠实：保留了回答、得罪雅威、上去争战、各人佩带兵器及带负面意味的冒然上山。可是“照……所吩咐我们的一切去做”在汉语中可能把“争战”与“遵行全部命令”分成两个动作，略弱化“按雅威所吩咐的一切去争战”的修饰关系。将其改为“要照……所吩咐我们的一切去争战”更直接对应 כְּכֹל אֲשֶׁר צִוָּנוּ。
