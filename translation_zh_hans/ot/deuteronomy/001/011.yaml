base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/011.yaml
  text: May Yahweh[a], the God of your fathers, make you a thousand times as many as you are, and bless you[b], just as he has promised you.
translation:
  language: zh_hans
  text: 愿耶和华[a]——你们列祖的上帝——使你们增至现今人数的一千倍，并赐福给你们，正如他对你们所说的[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “耶和华”是希伯来文上帝之名 יהוה 的传统中文译名；也有译作“雅威”的。
    reason: 说明神名的音译选择及常见异译。
  - marker: b
    text: “正如他对你们所说的”，也可译作“正如他对你们所应许的”。希伯来文直译为“正如他向你们所说的”。
    reason: 保留原文“说”的宽泛措辞，同时交代语境中的应许含义。
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代汉语中最通行的圣经专名“耶和华”音译四字神名，保留其作为以色列之上帝专名的性质，而不以称号代替。
- source_word: אֱלֹהֵי אֲבֹתֵיכֶם
  choice: 你们列祖的上帝
  rationale: “列祖”自然表达希伯来语复数“父辈”，并保留与先祖及圣约历史的联系；“上帝”清楚、庄重。
- source_word: יֹסֵף עֲלֵיכֶם כָּכֶם אֶלֶף פְּעָמִים
  choice: 使你们比现在多一千倍
  rationale: 该短语字面有“在你们之上加添像你们这样的一千倍”之意；中文用“比现在多一千倍”自然传达人数增长及与现有人数的比较关系。
- source_word: וִיבָרֵךְ אֶתְכֶם
  choice: 并……赐福给你们
  rationale: 承接前面的祈愿语气；“赐福给”比单说“祝福”更清楚地表达上帝施予福分。
- source_word: כַּאֲשֶׁר דִּבֶּר לָכֶם
  choice: 照他对你们所说的
  rationale: 保留דבר的宽泛本义“说”，不在正文中直接收窄为“应许”；语境所含应许意味用脚注说明。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用上帝的专名。中文正文采用读者最熟悉且庄重的传统音译“耶和华”，脚注注明另一种常见拟音“雅威”，不以“主”等称号取代。
- issue: אֲבֹתֵיכֶם 的祖先称谓
  choice: 你们列祖
  alternative: 你们的祖先
  rationale: “列祖”既保留原文阳性父系表达，也符合中文圣经历史语境，并突出以色列先祖的圣约关联。
- issue: דִּבֶּר 在祝福语境中的含义
  choice: 所说的
  alternative: 所应许的
  rationale: 正文保留原词“说”的语义广度，避免将语义张力静默收窄；脚注指出依上下文也可理解为“应许”。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“愿……使……”明确表达希伯来语中的祝愿语气；“比现在多一千倍”便于普通读者理解人数增长。所有脚注标记均置于正文相关位置。
