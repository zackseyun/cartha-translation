  yaml_path: translation/ot/deuteronomy/001/006.yaml
  text: Yahweh our God spoke to us at Horeb[a], saying[b], “You have stayed at this mountain long enough.”
translation:
  language: zh_hans
  text: 雅威——我们的上帝——在何烈山对我们说：“你们在这座山停留得够久了。”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 或译：“你们在这座山停留，已经够了。”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 以通行的现代汉语音译保留希伯来原文中的上帝之名，不以称号替代。
- source_word: אֱלֹהֵינוּ
  choice: 我们的上帝
  rationale: 虽源自形态上为复数形式的 אֱלֹהִים，此处明确单指以色列的上帝；第一人称复数后缀译为“我们的”。
- source_word: דִּבֶּר אֵלֵינוּ
  choice: 对我们说
  rationale: 准确表达话语朝向“我们”；现代汉语中“对我们说”比逐字译作“向我们讲话”更自然，并与后面的直接引语顺畅衔接。
- source_word: בְּחֹרֵב
  choice: 在何烈
  rationale: בְּ 在此表示地点；保留原文地名“何烈”，不将其协调改为“西奈”。
- source_word: לֵאמֹר
  choice: 说
  rationale: 这是希伯来语引出话语内容的惯用式；在汉语中与 דִּבֶּר 合并为“对我们说”，避免生硬重复。
- source_word: רַב לָכֶם שֶׁבֶת
  choice: 你们……停留得够久了
  rationale: רַב לָכֶם 表示足够或过度，与 שֶׁבֶת 连用，意为在某处居留已久；译文以自然汉语表达其催促结束停留的语气。
- source_word: בָּהָר הַזֶּה
  choice: 在这座山
  rationale: הַר 在此指何烈山；介词 בְּ 表示停留所在之处，故译为“在这座山”。
theological_decisions:
- issue: 如何翻译上帝之名 יְהוָה
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。译作“雅威”既保留专名性质，也避免以“主”这一称号代替原文；“耶和华”是另一传统音译。
- issue: 何烈与西奈的地名关系
  choice: 保留“何烈”
  alternative: 改译为“西奈”
  rationale: 本节原文明确使用 חֹרֵב，不应因其与西奈山的关联而在正文中改换地名；相关背景置于脚注。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“对我们说”将希伯来语的发言动词和引语公式合并表达；“停留得够久了”清楚传达原文的足够或过度之意，同时不把隐含的离开命令直接写入正文。
