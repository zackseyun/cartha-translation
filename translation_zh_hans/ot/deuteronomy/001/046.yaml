  yaml_path: translation/ot/deuteronomy/001/046.yaml
  text: So you remained at Kadesh many days[a], according to the days that you remained there.
translation:
  language: zh_hans
  text: 于是，你们在加低斯住了许多日子[a]，像你们所住的日子一样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译：“许多日子，像你们所住的日子。”末句是省略式表达，可能是说：“住了很久，即在那里的整个停留期间。”
    reason: 说明原文末句的省略性及一种可能理解，同时不加入原文未明说的“先前”。
lexical_decisions:
- source_word: וַתֵּשְׁבוּ
  choice: 于是，你们……住了
  rationale: ישׁב在此表示停留、居住；“住了”自然简洁，也保留与句末同一词根的呼应。句首“于是”体现叙事承接。
- source_word: בְקָדֵשׁ
  choice: 在加低斯
  rationale: 地点介词בְּ译作“在”；קָדֵשׁ按通行圣经地名译作“加低斯”。
- source_word: יָמִים רַבִּים
  choice: 许多日子
  rationale: 直译名词加形容词结构，保留希伯来文具体的时间表达，而不直接释为“很久”。
- source_word: כַיָּמִים אֲשֶׁר יְשַׁבְתֶּם
  choice: 像你们所住的那些日子一样
  rationale: כְּ表达比较；原文后半句较为省略且指向不完全明确，因此采用贴近形式的比较表达，不在正文中替作者补明比较对象。
theological_decisions:
- issue: 末句省略式比较的所指
  choice: 保留“像你们所住的那些日子一样”的含混表达
  alternative: 译作“住了很久，和你们先前在那里停留的时间一样长”
  rationale: 原文没有明说“先前”或“时间一样长”，也未另行出现“那里”；直译可避免把一种可能解释写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“住了”比“居留”更自然，又能保留原文前后两次使用ישׁב的词语呼应。
