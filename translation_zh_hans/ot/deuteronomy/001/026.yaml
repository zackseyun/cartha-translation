source:
  edition: WLC
  text: וְ/לֹ֥א אֲבִיתֶ֖ם לַ/עֲלֹ֑ת וַ/תַּמְר֕וּ אֶת פִּ֥י יְהוָ֖ה אֱלֹהֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/026.yaml
  text: But you were not willing to go up[a], and you rebelled against the command of Yahweh your God.
translation:
  language: zh_hans
  text: 但你们不肯上去，却违抗耶和华你们的上帝的命令[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“违抗耶和华你们的上帝的口”；这是指抗拒或违背他所发命令的惯用语。
    reason: 说明希伯来语惯用表达及其字面形式。
lexical_decisions:
- source_word: וְלֹא אֲבִיתֶם
  choice: 但你们不肯
  rationale: 否定式 אבה 表达主观意愿上的拒绝或不情愿；“不肯”既简洁自然，也保留了意志层面的含义。句首 וְ 在上下文中带转折意味，因此译作“但”。
- source_word: לַעֲלֹת
  choice: 上去
  rationale: עלה 的基本方向含义是“上去、登上”；此处指按命令前往山地，“上去”自然并保留原文的方向感。
- source_word: וַתַּמְרוּ
  choice: 反而违抗
  rationale: מרה 表示对权威的反叛、抗拒。“违抗”准确表达行动对象是上帝的命令；“反而”显明它与此前劝勉之间的对照，却不额外加重为公开叛乱。
- source_word: אֶת־פִּי
  choice: 命令
  rationale: 字面为“口”，在“违抗某人的口”这一希伯来语惯用表达中，指抗拒其口中所发的命令。正文采用自然汉语“命令”，字面形式在脚注说明。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 这是以通行现代汉语形式音译四字神名，保留其作为以色列之上帝专名的功能，而不以普通称号替代。
- source_word: אֱלֹהֵיכֶם
  choice: 你们上帝
  rationale: 复数第二人称后缀表示“你们的”，与耶和华连用时所指为单数的“上帝”。现代汉语中置于专名后译为“耶和华你们上帝”自然且贴近原文结构。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用上帝的专名。正文采用现代汉语圣经传统中最广为人知的专名形式“耶和华”，既不以“主”替换，也避免把一种学术拟音当作唯一确定的古代读音。
- issue: “违抗……的口”这一表达
  choice: 正文译为“违抗……的命令”，脚注保留字面信息
  alternative: 直译为“违抗……的口”
  rationale: 这是表示抗拒所发命令的希伯来语惯用语。直译在现代汉语中容易造成误解；意译为“命令”不改变其神学力度，脚注则让读者看到原文意象。
translation_notes:
  register: 采用简洁、庄重而通俗的现代标准汉语。“不肯”突出意志上的拒绝；“反而违抗”承接叙事并显出转折。句末脚注标记紧随其所解释的“命令”。
