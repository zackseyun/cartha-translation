  text: וּ/בַ/מִּדְבָּר֙ אֲשֶׁ֣ר רָאִ֔יתָ אֲשֶׁ֤ר נְשָׂאֲ/ךָ֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ כַּ/אֲשֶׁ֥ר יִשָּׂא אִ֖ישׁ אֶת בְּנ֑/וֹ בְּ/כָל הַ/דֶּ֨רֶךְ֙ אֲשֶׁ֣ר הֲלַכְתֶּ֔ם עַד בֹּאֲ/כֶ֖ם עַד הַ/מָּק֥וֹם הַ/זֶּֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/031.yaml
  text: and in the wilderness[a], where you saw that Yahweh your God carried you, just as a man carries his son[b], all along the way that you traveled until you came to this place.
translation:
  language: zh_hans
  text: 又在旷野[a]，你看见雅威你的神抱着你，如同一个男人抱着自己的儿子[b]一样；在你们所走的整个路程中，他都这样抱着你们，直到你们来到这地方。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“荒漠”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译“如同一个男人抱着自己的儿子”；有些译本较概括地译作“如同人抱着孩子”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַמִּדְבָּר
  choice: 又在旷野
  rationale: מִדְבָּר指旷野或荒漠地带；“旷野”既符合申命记的历史语境，也比“沙漠”更能保留其地貌范围。וּ按上下文承接前文，译作“又”。
- source_word: אֲשֶׁר רָאִיתָ
  choice: 你亲眼看见
  rationale: 直陈以色列亲历并目睹的事实；加“亲眼”自然表达希伯来语在此强调的亲身见证，但不改变命题内容。
- source_word: נְשָׂאֲךָ
  choice: 背负你
  rationale: נשא意为携带、承担；“背负”既可用于实际携带，也能表达神在全程中的扶持，并与后面的比喻保持同一动词意象。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译呈现四字神名，而不以“主”这一称号替代。
- source_word: אֱלֹהֶיךָ
  choice: 你的神
  rationale: 直接保留第二人称单数的盟约性称谓。
- source_word: כַּאֲשֶׁר יִשָּׂא אִישׁ אֶת־בְּנוֹ
  choice: 如同一个男人背负自己的儿子一样
  rationale: 保留אִישׁ与בְּנוֹ的阳性单数表达，不泛化为“家长”和“孩子”，也不把אִישׁ加强解释为“父亲”。
- source_word: בְּכָל־הַדֶּרֶךְ אֲשֶׁר הֲלַכְתֶּם
  choice: 在你们所走的整段路上
  rationale: 表达整个行程中持续不断的照顾；同时保留原文由单数“你”转为复数“你们”的人称数变化。
- source_word: עַד בֹּאֲכֶם עַד הַמָּקוֹם הַזֶּה
  choice: 直到你们来到这地方
  rationale: 自然呈现时间终点和摩西讲话时所指的当前地点。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；“雅威”按其通行学术读音音译，保留专名性质，不以称号替换。
- issue: 父子比喻中的性别表达
  choice: 一个男人背负自己的儿子
  alternative: 一个人抱着孩子；父亲背负儿子
  rationale: 原文明确使用阳性名词“男人”和“他的儿子”。本译文保留这一意象，同时不把“男人”进一步解释成原文未明说的“父亲”。
- issue: 第二人称单复数转换
  choice: 先用单数“你”，后用复数“你们”
  alternative: 全句统一译作“你们”
  rationale: 原文先以单数后缀指称以色列，随后以复数动词指向全体百姓。保留转换可呈现摩西既把以色列视为整体、又向众人讲话的张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“整段路上……一直这样”使希伯来语所表达的全程持续性在汉语中清楚可见；保留“你／你们”的数变化及阳性的父子意象。
