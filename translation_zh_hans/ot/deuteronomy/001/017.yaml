  to: 审判时不可徇私[a]；无论人地位卑微或尊贵，你们都要一视同仁地听取他们的陈述。不要因任何人而畏缩[b]，因为审判属于上帝。你们若遇到难以断定的事，就要带到我这里来，我会听审此事。
