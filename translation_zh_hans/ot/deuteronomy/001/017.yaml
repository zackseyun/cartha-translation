id: DEU.1.17
reference: Deuteronomy 1:17
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: לֹֽא תַכִּ֨ירוּ פָנִ֜ים בַּ/מִּשְׁפָּ֗ט כַּ/קָּטֹ֤ן כַּ/גָּדֹל֙ תִּשְׁמָע֔וּ/ן לֹ֤א תָג֨וּרוּ֙ מִ/פְּנֵי אִ֔ישׁ כִּ֥י הַ/מִּשְׁפָּ֖ט לֵ/אלֹהִ֣ים ה֑וּא וְ/הַ/דָּבָר֙ אֲשֶׁ֣ר יִקְשֶׁ֣ה מִ/כֶּ֔ם תַּקְרִב֥וּ/ן אֵלַ֖/י וּ/שְׁמַעְתִּֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/017.yaml
  text: You shall not show partiality in judgment[a]; you shall hear the small and the great alike. You shall not be intimidated by any man, for the judgment belongs to God. And the matter that is too difficult for you, you shall bring to me[b], and I will hear it.
translation:
  language: zh_hans
  text: 审判时不可徇私[a]；无论人地位卑微或尊贵，你们都要一视同仁地听取他们的陈述。不要因任何人而畏缩[b]，因为审判属于上帝。你们若遇到难以断定的事，就要带到我这里来，我会听审此事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“在审判中认脸”，是指看人的身份而偏袒。
    reason: lexical_alternative
  - marker: b
    text: 或译：“不要怕任何人。”
    reason: lexical_alternative
lexical_decisions:
- source_word: תַכִּירוּ פָנִים
  choice: 徇私
  rationale: 该习语直译为“认脸”，在司法语境中指因人的身份而偏袒。“徇私”简洁自然，准确表达审判中的偏私。
- source_word: בַּמִּשְׁפָּט
  choice: 审判时
  rationale: 这里指司法审理和裁断的过程；“审判时”符合上下文，也比抽象的“在公义中”更具体。
- source_word: כַּקָּטֹן כַּגָּדֹל
  choice: 无论卑微的还是尊贵的
  rationale: 这组词在此对比社会地位低与高的人。“卑微的／尊贵的”在现代汉语中清楚传达其社会含义。
- source_word: תִּשְׁמָעוּן
  choice: 都要同样听取
  rationale: שׁמע 在司法语境中指听取当事人的陈述或案件；加入“同样”自然表达两个 כ־ 所含的平等对待之意。
- source_word: תָגוּרוּ מִפְּנֵי אִישׁ
  choice: 不要因任何人而畏缩
  rationale: 该表达可指因惧怕某人而退缩。“畏缩”保留其司法情境中的压力感，又不把词义限定为内心害怕。
- source_word: כִּי הַמִּשְׁפָּט לֵאלֹהִים הוּא
  choice: 因为审判属于上帝
  rationale: 直陈司法裁断属于上帝，保留原文对审判权威根基的神学表述，不额外解释为上帝将审判审判官。
- source_word: הַדָּבָר אֲשֶׁר יִקְשֶׁה מִכֶּם
  choice: 难以断定的事
  rationale: 在法律语境中，דָּבָר 是待处理的事或案件，יִקְשֶׁה מִכֶּם 表示对审判官而言过于困难；“难以断定”明确其裁判语境。
- source_word: תַּקְרִבוּן אֵלַי
  choice: 带到我这里来
  rationale: קרב 的使役式表示带近或呈交；此处自然地指把疑难案件提交给摩西。
- source_word: וּשְׁמַעְתִּיו
  choice: 我会听审
  rationale: 宾语后缀最自然地回指前面的“事”。“听审”保留 שׁמע 的听取含义及司法色彩，避免过度译成“裁决”。
theological_decisions:
- issue: “审判属于上帝”的含义
  choice: 保留为“审判属于上帝”
  alternative: 译作“上帝必审判审判官”或“审判必须依据上帝的律法”
  rationale: 原文直接宣告 הַמִּשְׁפָּט לֵאלֹהִים הוּא，并未明说其具体机制；直译保留司法权来自或归于上帝的神学张力。
- issue: אִישׁ 的泛指范围
  choice: 任何人
  alternative: 任何男人
  rationale: 此处阳性单数 אִישׁ 在否定句中具有泛指作用，重点是审判官不可受任何当事人或权势者影响；现代汉语“任何人”准确表达该语法功能，并非抹除特定性别信息。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“审判、徇私、听审、断定”维持法律语域；避免文言化表达。句式保留命令、理由和疑难案件上呈的逻辑次序。
