  text: וַ/תָּשֻׁ֥בוּ וַ/תִּבְכּ֖וּ לִ/פְנֵ֣י יְהוָ֑ה וְ/לֹֽא שָׁמַ֤ע יְהוָה֙ בְּ/קֹ֣לְ/כֶ֔ם וְ/לֹ֥א הֶאֱזִ֖ין אֲלֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/045.yaml
  text: Then you returned and wept before Yahweh[a], but Yahweh did not listen to your voice or pay attention to you.
translation:
  language: zh_hans
  text: 于是你们回来，在雅威面前哭泣；可是雅威不听你们的声音，也不侧耳听你们。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “不听你们的声音……也不侧耳听你们”也可意译为“不听你们的呼求，也不理会你们”。希伯来文连用两个意思相近的听觉动词，强调雅威没有回应他们的恳求。
    reason: 说明近义平行结构及“不予回应”的语境含义。
lexical_decisions:
- source_word: וַתָּשֻׁבוּ
  choice: 于是你们回来
  rationale: שׁוּב意为“返回、回转”；这里承接前文失败后的行动，用“回来”自然地表达叙事中的返回，“于是”体现连续叙事。
- source_word: וַתִּבְכּוּ
  choice: 哭泣
  rationale: בכה意为“哭、哭泣”；“哭泣”符合经文的庄重语气，也没有加入原文未明说的强烈程度。
- source_word: לִפְנֵי יְהוָה
  choice: 在雅威面前
  rationale: לִפְנֵי直指“在……面前、在……的临在中”；“在雅威面前”既贴近原文，也符合现代汉语表达。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以“雅威”音译四字神名，保留原文所用的专名，而不以称号替代。
- source_word: וְלֹא שָׁמַע יְהוָה בְּקֹלְכֶם
  choice: 可是雅威不听你们的声音
  rationale: שׁמע与בְּקוֹל连用，可表示听见、听从或回应某人的声音。“不听你们的声音”保留原文意象及其可能含有的“不予回应”意味；“可是”表现与他们哭泣之间的转折。
- source_word: וְלֹא הֶאֱזִין אֲלֵיכֶם
  choice: 也不侧耳听你们
  rationale: האזין意为“侧耳、留心听”。译作“侧耳听”保留与前一听觉动词构成的近义平行，也保持原文强调雅威没有回应的修辞效果。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。译作“雅威”保留其专名性质，不把它改成称号；“耶和华”是传统形式，“上主”则属于替代性称谓。
- issue: 雅威“不听”是否表示听觉能力上的未听见
  choice: 保留“听”与“侧耳听”的平行措辞，并由脚注说明其回应层面的含义
  alternative: 直接意译为“雅威不回应你们，也不理会你们”
  rationale: 两个希伯来语动词都属于听觉语义，同时在语境中指向不垂听、不回应。正文保留原文修辞，脚注说明语用含义，避免把神学张力静默化解。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。“于是”“可是”清楚呈现叙事推进和转折；“在雅威面前”“侧耳听”保留原文意象，同时普通读者容易理解。
