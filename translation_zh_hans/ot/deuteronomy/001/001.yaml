base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/001.yaml
  text: These are the words that Moses spoke to all Israel beyond the Jordan[a], in the wilderness, in the Arabah opposite Suph, between Paran, Tophel, Laban, Hazeroth[d][c][b], and Dizahab.
translation:
  language: zh_hans
  text: 以下是摩西在约旦河对岸[a]、在旷野、在疏弗[c]对面的亚拉巴[b]、在巴兰、陀弗、拉班、哈洗录和底撒哈之间，对以色列全体所说的话。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“约旦河那边”或“约旦河另一边”。希伯来语这一表达可因观察者所处的地理位置不同而有不同译法。
    reason: lexical_alternative
  - marker: b
    text: “亚拉巴”是地理名称，指裂谷或平原地带；传统上也译作“平原”。
    reason: cultural_note
  - marker: c
    text: 希伯来文作“疏弗”。有些人将它理解为地名，另有人认为它与“芦苇海”有关；但本节原文没有“海”字。
    reason: alternative_reading
lexical_decisions:
- source_word: אֵלֶּה הַדְּבָרִים
  choice: 以下是……所说的话
  rationale: “这些话”虽较逐字，但现代汉语以“以下是……所说的话”更自然地保留篇首呈示和引介讲话的作用。
- source_word: אֲשֶׁר דִּבֶּר מֹשֶׁה אֶל כָּל יִשְׂרָאֵל
  choice: 摩西……对以色列全体所说的话
  rationale: 保留关系从句、正式讲话的语气，以及“全体以色列”的整体含义。
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: 在约旦河那边
  rationale: עֵבֶר 指河的另一边，但原文没有明确固定叙述者的地理视角；“那边”保留这种视角弹性。
- source_word: בַּמִּדְבָּר
  choice: 在旷野
  rationale: מִדְבָּר 通常指人烟稀少的荒野地带，不一定是沙漠；“旷野”准确且符合庄重经文语域。
- source_word: בָּעֲרָבָה
  choice: 在亚拉巴
  rationale: 此处很可能是约旦裂谷地区的地理名称；采用音译，避免以泛称“平原”过度解释。
- source_word: מוֹל סוּף
  choice: 疏弗对面
  rationale: מוֹל 表示“对面”；סוּף 前没有“海”一词，故按可能的地名音译，不补作“芦苇海”。
- source_word: בֵּין פָּארָן וּבֵין תֹּפֶל וְלָבָן וַחֲצֵרֹת וְדִי זָהָב
  choice: 巴兰、陀弗、拉班、哈洗录和底撒哈之间
  rationale: 将希伯来语连续并列的地名按自然现代汉语列举，同时保留“在……之间”的空间表达及全部地名。
- source_word: דִי זָהָב
  choice: 底撒哈
  rationale: 按地名音译，不依其可能的词源直译为与“金子”有关的短语。
