base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/024.yaml
  text: So they turned and went up into the hill country[a], and came as far as the Valley of Eshcol, and spied it out.
translation:
  language: zh_hans
  text: 他们转身上了山地，来到以实各谷[a]，把那地侦察了一番。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “以实各谷”也可译作“以实各干河谷”或“以实各溪”；希伯来语这个词可指带有季节性水道的谷地。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְנוּ
  choice: 他们转身
  rationale: פנה在连续叙事中表示转向；“转身”直接保留行动方向的变化。
- source_word: וַיַּעֲלוּ
  choice: 上了
  rationale: עלה表示向上行进；结合山地地形，“上了”自然且保留上行含义。
- source_word: הָהָרָה
  choice: 山地
  rationale: 词尾הָ表示趋向，整体指往山地或山区去；现代汉语中“上了山地”简洁自然。
- source_word: וַיָּבֹאוּ עַד
  choice: 来到
  rationale: בוא与עַד合用表示抵达某一地点；汉语“来到”在此已自然表达抵达之意。
- source_word: נַחַל אֶשְׁכֹּל
  choice: 以实各谷
  rationale: נחל可指溪谷、干河谷或其中的水道；正文采用简明的地名“以实各谷”，并在脚注保留其他可能。
- source_word: וַיְרַגְּלוּ
  choice: 侦察了一番
  rationale: רגל的Piel词干指探查、侦察，带有刺探地情的意味，不只是一般游览；“侦察”准确而自然。
- source_word: אֹתָהּ
  choice: 那地
  rationale: 阴性单数宾语代词在上下文中指所要察看的土地；汉语明确译作“那地”可避免代词指向含混，却不增添原文之外的实体。
