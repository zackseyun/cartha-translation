base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/044.yaml
  text: Then the Amorites who lived in that hill country came out to meet you and pursued you as bees do[b][a], and they struck you down in Seir as far as Hormah.
translation:
  language: zh_hans
  text: 那时，住在那片山地[b]的亚摩利人[a]出来迎击你们，像蜜蜂一样追赶你们，并在西珥击败你们，直到何珥玛。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“那个亚摩利人”。希伯来文用单数集合名词指亚摩利族群；后面的动词为复数。
    reason: lexical_alternative
  - marker: b
    text: 或译“那座山”；这里译作“山地”，取希伯来词所指山区的地域含义。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: 出来
  rationale: יצא在叙事中表示出去或出来；这里从以色列人的叙述视角，指敌人从居地出来迎击他们。
- source_word: הָאֱמֹרִי
  choice: 亚摩利人
  rationale: 原文在形态上是单数，但后续两个动词均为复数，表明这里是集合用法；汉语“亚摩利人”可自然表达群体。
- source_word: הַיֹּשֵׁב בָּהָר הַהוּא
  choice: 住在那片山地的
  rationale: 分词表示居住状态；הַר既可指一座山，也可指山区。上下文涉及一片地域，译作“山地”较自然，同时以脚注保留另一可能。
- source_word: לִקְרַאתְכֶם
  choice: 迎击你们
  rationale: 该词组的基本意思是迎面相遇；在明确的敌对军事语境中，“迎击”既自然又保留其正面相遇的意象。
- source_word: וַיִּרְדְּפוּ אֶתְכֶם
  choice: 追赶你们
  rationale: רדף是追逐、追赶的常用动词；“追赶”准确且符合现代汉语叙事。
- source_word: כַּאֲשֶׁר תַּעֲשֶׂינָה הַדְּבֹרִים
  choice: 像蜜蜂一样
  rationale: 保留原文鲜明的明喻；汉语无需直译动词“行”，即可自然表达“像蜜蜂所做的那样”。
- source_word: וַיַּכְּתוּ אֶתְכֶם
  choice: 击败你们
  rationale: 该动词在此表示猛烈打击并造成败退；“击败”符合军事语境，又不额外断定所有人被杀。
- source_word: בְּשֵׂעִיר
  choice: 在西珥
  rationale: 介词ב最直接地表示行动发生的地点或范围。
- source_word: עַד חָרְמָה
  choice: 直到何珥玛
  rationale: עד标明行动所达到的地理界限；“直到”在汉语中准确自然。
theological_decisions: []
