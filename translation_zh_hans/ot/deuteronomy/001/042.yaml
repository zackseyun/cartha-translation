base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/042.yaml
  text: 'And Yahweh said to me[a], ‘Tell them: Do not go up or fight, for I am not among you[b], lest you be struck down before your enemies.’'
translation:
  language: zh_hans
  text: 雅威对我说：“你要告诉他们：‘不要上去，也不要争战，因为我不在你们中间；免得你们在仇敌面前被击败[a]。’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“免得你们在仇敌面前被击倒。”
    reason: “被击倒”较具体地呈现נגף的“被击打、被击倒”含义；本节军事语境中主文采用“被击败”以表达其战败含义。
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语中常用的音译保留四字神名，避免用称号代替原文专名。
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: אמר是引出直接引语的普通叙事动词，译作“说”准确自然。
- source_word: אֱמֹר לָהֶם
  choice: 你要告诉他们
  rationale: 将命令式按自然现代汉语译为“你要告诉他们”，清楚保留受话对象及命令语气。
- source_word: לֹא תַעֲלוּ
  choice: 不要上去
  rationale: 保留עלה的上行含义，也符合进入山区作战的地理和军事语境。
- source_word: וְלֹא תִלָּחֲמוּ
  choice: 也不要争战
  rationale: נלחם在此指投入战斗；“争战”庄重且为普通读者所理解，并与前一禁令并列。
- source_word: כִּי אֵינֶנִּי בְּקִרְבְּכֶם
  choice: 因为我不在你们中间
  rationale: 直接表达בקרבכם“在你们当中”的空间性和同在含义，不额外解释其神学性质。
- source_word: וְלֹא תִּנָּגְפוּ
  choice: 免得你们……被击败
  rationale: נגף的被动形在军事语境中表示遭击败；结合禁令后的目的或警告关系，用“免得”可避免把原句误解成必不失败的应许。
- source_word: לִפְנֵי אֹיְבֵיכֶם
  choice: 在仇敌面前
  rationale: 保留希伯来语“在……面前”的惯用表达及公开败于敌前的军事意味。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；采用“雅威”以专名形式呈现，而不以“主”等称号代替。
- issue: 末句וְלֹא תִּנָּגְפוּ的逻辑关系
  choice: 免得你们在仇敌面前被击败
  alternative: 这样你们就不至于在仇敌面前被击败
  rationale: 希伯来语表面形式为“而不被击败”，但在上下文中是禁令所要避免的后果。选择“免得”保留警告语气，同时脚注说明较贴近形式的译法。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。直接引语层级以双引号和单引号区分；“上去”“在你们中间”“在仇敌面前”尽量保存原文意象，同时用“免得”明确汉语中所需的警告关系。
