base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/036.yaml
  text: except Caleb son of Jephunneh; he shall see it[a], and to him I will give the land on which he has walked, and to his sons, because he has fully followed Yahweh.
translation:
  language: zh_hans
  text: 除了耶孚尼的儿子迦勒以外；他必看见那地。我要把他脚踏过的那片土地赐给他和他的儿子们[a]，因为他完全跟随了雅威。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“他的儿女”或“他的后裔”；希伯来文直译为“他的儿子们”。
    reason: 说明继承语境下可能的广义理解，同时交代原文的字面形式。
lexical_decisions:
- source_word: זֽוּלָתִ֞י
  choice: 只有……例外
  rationale: 该词引出对前述审判的例外；此译法在现代汉语中自然明确。
- source_word: כָּלֵ֤ב בֶּן יְפֻנֶּה֙
  choice: 耶孚尼的儿子迦勒
  rationale: 按中文圣经通行译名音译人名，并保留“某人的儿子”这一父称结构。
- source_word: יִרְאֶ֔נָּה
  choice: 他必看见那地
  rationale: 阴性单数后缀回指上下文中的“地”；“必”传达应许兼裁定的确定语气。
- source_word: וְלֽוֹ אֶתֵּ֧ן
  choice: 我要……赐给他
  rationale: 保留第一人称应许和受益者，同时采用自然的现代汉语语序。
- source_word: אֶת הָאָ֛רֶץ אֲשֶׁ֥ר דָּֽרַךְ בָּ֖הּ
  choice: 他脚踏过的那片土地
  rationale: “脚踏过”保留דרך的具体行走意象；“那片土地”自然表达关系从句所限定的地域。
- source_word: וּלְבָנָ֑יו
  choice: 和他的儿子们
  rationale: בנים在此为阳性复数，直译为“儿子们”；不在正文中擅自扩大为所有子女或后裔。
- source_word: יַ֕עַן אֲשֶׁ֥ר
  choice: 因为
  rationale: 简洁自然地表达后句是赐地应许的原因。
- source_word: מִלֵּ֖א אַחֲרֵ֥י
  choice: 全心全意地跟随了
  rationale: 这是表示完全、忠心跟随的希伯来语习语；此译法传达其完整投入之意，避免生硬直译。
- source_word: יְהוָֽה
  choice: 雅威
  rationale: 将四字神名作为专名音译，保留经文直接使用上帝盟约之名的特点。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华／上主
  rationale: 原文直接使用四字神名；音译“雅威”将其作为专名呈现，不以称号替代。
- issue: בניו所指的范围
  choice: 他的儿子们
  alternative: 他的儿女／他的后裔
  rationale: 原文形式明确为“他的儿子们”；继承语境可能使其具有更广的后代含义，但正文保留词形所表达的性别与数，另以脚注说明可能范围。
- issue: מלא אחרי的忠诚含义
  choice: 全心全意地跟随了
  alternative: 完全跟随了／专心跟随了
  rationale: 该习语表示毫无保留地跟随；译文表达完整忠诚，同时不额外规定其具体神学性质。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“脚踏过”保留原文的具体意象；“全心全意地跟随”自然表达希伯来语习语的强调。脚注标记置于其实际说明的“儿子们”之后。
