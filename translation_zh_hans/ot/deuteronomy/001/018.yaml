  text: And at that time I commanded you all the things that you should do[a].
translation:
  language: zh_hans
  text: 那时，我把一切你们该做的事都吩咐给你们了[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “事”也可译作“话语”或“事项”；希伯来语 דְּבָרִים 既可指说出的指示，也可指需要办理或实行的事。
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֲצַוֶּה
  choice: 我……吩咐了
  rationale: 该动词源于צוה，表示带有权威地命令或指示；“吩咐”在现代汉语中自然庄重，也保留了权威性。
- source_word: אֶתְכֶם
  choice: 你们
  rationale: 二人称阳性复数宾语；汉语明确译出复数。
- source_word: בָּעֵת הַהִוא
  choice: 那时
  rationale: 这是常见的时间表达；“那时”简洁自然，符合叙事语境。
- source_word: אֵת כָּל הַדְּבָרִים
  choice: 一切事
  rationale: דְּבָרִים可指“话”“事项”或“事情”。本句聚焦以色列人要实行的指示，正文用“一切事”最自然，同时以脚注保留词义范围。
- source_word: אֲשֶׁר תַּעֲשׂוּן
  choice: 你们该做的
  rationale: עשה的未完成式置于“吩咐”的内容之中，表达应当实行之事；“该做的”保留义务色彩，又不额外强化为绝对语气。
