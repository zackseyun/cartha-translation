  naturalness: 建议改为“这些人，就是这邪恶世代的人，一个也不得……”。这保留原文的重复和定罪性同位说明，同时更合乎现代庄重中文。以“一个也不得”表达誓言性断言，比“没有一个能”更明确地表达神圣判决，而不把“看见”扩展为“进入”。
  terminology: “美地”“起誓”“赐给”“列祖”均恰当，语体庄重且符合中文圣经译法。“列祖”可保留；脚注应说明其较宽泛的替代译法“祖先”，并准确标示希伯来文的字面形式。
