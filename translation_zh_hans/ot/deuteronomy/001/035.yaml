base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/035.yaml
  text: Not one man among these men of this evil generation shall see the good land that I swore to give to your fathers—[a]
translation:
  language: zh_hans
  text: 这些人，就是这邪恶世代的人，一个也不得看见我起誓要赐给你们列祖的美地。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你们的祖先”。希伯来文为“你们的父亲们”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: 没有一个……能
  rationale: 这里的 אִם 用于誓言式否定，并非普通条件句；译为“没有一个……能”可自然表达强烈而确定的否定。
- source_word: יִרְאֶה
  choice: 能看见
  rationale: ראה 的基本义是“看见”；在本段审判语境中，也含有不得进入、不得亲身见到那地的意味，但正文保留原文简洁表达。
- source_word: אִישׁ בָּאֲנָשִׁים הָאֵלֶּה
  choice: 这些人中，没有一个
  rationale: 介词 בְּ 在此表示范围或部分关系；单数 אִישׁ 在否定誓言中具有逐一排除的作用，故译作“没有一个”。
- source_word: הַדּוֹר הָרָע הַזֶּה
  choice: 这个邪恶世代
  rationale: דּוֹר 意为“世代”；רַע 在此具有道德责备意味，译作“邪恶”比“坏”更准确庄重。
- source_word: אֶת הָאָרֶץ הַטּוֹבָה
  choice: 美地
  rationale: “美地”简洁自然，表达 הָאָרֶץ הַטּוֹבָה 所指那片美好、蒙福之地，也符合现代中文圣经语体。
- source_word: אֲשֶׁר נִשְׁבַּעְתִּי לָתֵת
  choice: 我起誓要赐给
  rationale: נִשְׁבַּעְתִּי 明确表示起誓，לָתֵת 表示“给予”；“起誓要赐给”保留誓约的郑重性。
- source_word: לַאֲבֹתֵיכֶם
  choice: 给你们列祖
  rationale: אָבוֹת 是“父亲”的复数，在此指以色列人的先祖；“列祖”既保留原文男性复数色彩，也符合庄重而易懂的中文表达。
theological_decisions:
- issue: לַאֲבֹתֵיכֶם 所指范围
  choice: 你们列祖
  alternative: 你们的祖先
  rationale: 原文为阳性复数“父辈/父亲们”，语境中指以色列的先祖。“列祖”保留原文形式与盟约历史色彩；较宽泛的“祖先”列入脚注。
- issue: “看见美地”是否明译为“进入美地”
  choice: 保留“看见”
  alternative: 进入并享有那美地
  rationale: 上下文确实涉及不得进入应许之地，但原文使用 ראה“看见”。正文不把隐含结果扩写为“进入”，以保留原文措辞及其语义张力。
translation_notes:
  register: 采用现代、庄重而清楚的普通话。“这个邪恶世代的这些人中”在中文中自然呈现原文同位说明关系；“没有一个能”传达誓言式否定的绝对性。脚注标记已置于正文相应位置。
