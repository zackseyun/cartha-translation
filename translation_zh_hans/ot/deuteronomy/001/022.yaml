base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/022.yaml
  text: Then all of you came near to me and said[a], ‘Let us send men ahead of us, so that they may explore the land for us and bring us back word of the way by which we should go up into it[b], and of the cities into which we shall come.’
translation:
  language: zh_hans
  text: 你们都来到我跟前，对我说：“让我们派人先行，为我们探察[a]那地，再把消息带回来，告诉我们该从哪条路上去[b]，将要进入哪些城。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “探察”也可译作“侦察”或“查探”。希伯来语动词可指搜索、调查，并不必然强调秘密窥探。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译为“从哪条路上去”。“上去”保留了圣经中进入那地时常见的说法。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּקְרְבוּן אֵלַי כֻּלְּכֶם
  choice: 你们都走近我
  rationale: 既表达קָרַב“走近、靠近”的具体含义，也以“都”体现כֻּלְּכֶם的强调。
- source_word: נִשְׁלְחָה אֲנָשִׁים לְפָנֵינוּ
  choice: 让我们先派人去
  rationale: “让我们”传达祈愿式所表达的提议；“先……去”自然表达לְפָנֵינוּ“在我们前面”的先行之意。希伯来语אֲנָשִׁים在此指受派人员，汉语“人”在语境中自然且不损失所指。
- source_word: וְיַחְפְּרוּ לָנוּ אֶת הָאָרֶץ
  choice: 为我们探察那地
  rationale: חָפַר在此表示搜索、调查土地；“探察”兼顾侦察语境与动词本身未必明说的秘密性。
- source_word: וְיָשִׁבוּ אֹתָנוּ דָּבָר
  choice: 再把消息带回来
  rationale: 以自然现代汉语保留使消息“返回”的具体意象，表达回报所得信息。
- source_word: אֶת הַדֶּרֶךְ אֲשֶׁר נַעֲלֶה בָּהּ
  choice: 告诉我们该从哪条路上去
  rationale: “哪条路”清楚呈现所求报告的内容；保留עָלָה“上去”，反映进入该地时常见的圣经地理表达。
- source_word: וְאֵת הֶעָרִים אֲשֶׁר נָבֹא אֲלֵיהֶן
  choice: 将要进入哪些城
  rationale: 将希伯来语关系结构自然转换为汉语间接问句，同时准确表达他们将进入的城市。
