base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/015.yaml
  text: 'So I took the heads of your tribes[a], wise and knowledgeable men, and appointed them as heads over you: commanders of thousands, commanders of hundreds, commanders of fifties, commanders of tens, and officers for your tribes.'
translation:
  language: zh_hans
  text: 于是，我选取了你们各支派的首领，就是有智慧、有见识的人[a]，立他们作你们的首领，担任千夫长、百夫长、五十夫长、十夫长，以及你们各支派的官员。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “有见识的人”或译“为人所熟知的人”或“受认可的人”；希伯来语可指有知识、见识的人，也可指为人所知或得到认可的人。
    reason: 保留וִידֻעִים在知识素养与被人认识、认可之间的词义可能。
lexical_decisions:
- source_word: וָאֶקַּח
  choice: 于是，我选取了
  rationale: 叙事性的连接词推动事件发展；“于是”自然承接上文。“选取”既表达摩西从众人中取用这些人，也符合任命领袖的语境。
- source_word: רָאשֵׁי שִׁבְטֵיכֶם
  choice: 你们各支派的首领
  rationale: רֹאשׁ在这里指居于支派领导地位的人；“首领”保留“为首”的意象，也适合行政语境。
- source_word: אֲנָשִׁים חֲכָמִים וִידֻעִים
  choice: 有智慧、有见识的人
  rationale: “有智慧”表达适合治理和判断的实践智慧；וִידֻעִים可能指有知识、受认可或为人熟知者，“有见识”在本语境中自然，同时以脚注保留另一种可能。
- source_word: וָאֶתֵּן אֹתָם רָאשִׁים עֲלֵיכֶם
  choice: 立他们作你们的首领
  rationale: נתן在宾语与职位补语的结构中表示任命；“立……作……”清楚表达授予职分，并与前面的“首领”保持词语呼应。
- source_word: שָׂרֵי אֲלָפִים ... מֵאוֹת ... חֲמִשִּׁים ... עֲשָׂרֹת
  choice: 千夫长、百夫长、五十夫长、十夫长
  rationale: 这些词表示按千、百、五十、十划分的分级管理单位；采用现代读者熟悉的传统称谓，简明保留原文层级。
- source_word: וְשֹׁטְרִים לְשִׁבְטֵיכֶם
  choice: 以及你们各支派的官员
  rationale: שֹׁטֵר指承担执行、行政或文书职责的下级官员；“官员”不过度限定具体职能，לְ译入“各支派的”以表达其所属或服务范围。
