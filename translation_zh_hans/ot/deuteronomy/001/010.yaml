base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/010.yaml
  text: Yahweh your God has multiplied you[a], and behold, today you are as numerous as the stars of the heavens.
translation:
  language: zh_hans
  text: 雅威你们的神使你们人数增多了；看哪，今日你们多如天上的星辰。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“今日你们在数量上如同天上的星辰。”
    reason: 原文 לָרֹב 可较直译为“在数量上、为数众多”，此译法显示其与星辰比较短语的结构关系。
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 以通行的汉语音译呈现四字神名，不用“主”这一称号替代专名。
- source_word: אֱלֹהֵיכֶם
  choice: 你们的神
  rationale: 在雅威作主语的盟约语境中，אֱלֹהִים 指独一的神；后缀为第二人称阳性复数。
- source_word: הִרְבָּה אֶתְכֶם
  choice: 使你们人数增多了
  rationale: רבה 的使役式表示“使增多、使人数众多”；补出“人数”使现代汉语自然，同时保留使役意义。
- source_word: וְהִנְכֶם
  choice: 看哪
  rationale: 保留 הִנֵּה 引人注意、强调眼前状况的修辞功能。
- source_word: הַיּוֹם
  choice: 今日
  rationale: 准确表达当前时点；“今日”庄重而仍为现代读者熟悉。
- source_word: כְּכוֹכְבֵי הַשָּׁמַיִם לָרֹב
  choice: 多如天上的星辰
  rationale: 将比较短语和表示数量众多的 לָרֹב 合并为自然汉语，既保留星辰比喻，也明确比较点在数量。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；音译“雅威”保留其专名性质，避免以称号取代。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“看哪”有意保留原文的强调语气；“天上的星辰”比“天空中的星星”更庄重，并贴近原文结构。
