  text: וָ/אֲדַבֵּ֥ר אֲלֵי/כֶ֖ם וְ/לֹ֣א שְׁמַעְתֶּ֑ם וַ/תַּמְרוּ֙ אֶת פִּ֣י יְהוָ֔ה וַ/תָּזִ֖דוּ וַ/תַּעֲל֥וּ הָ/הָֽרָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/043.yaml
  text: So I spoke to you[a], but you did not listen; you rebelled against the mouth of Yahweh, acted presumptuously, and went up into the hill country.
translation:
  language: zh_hans
  text: 我便对你们说了，你们却不听；你们违背雅威的命令[a]，狂妄行事，上到山区去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“雅威的口”，意思是雅威所吩咐的事。
    reason: 说明原文习语及正文的意译。
lexical_decisions:
- source_word: וָאֲדַבֵּר אֲלֵיכֶם
  choice: 我就告诉了你们
  rationale: דבר 表示“说、讲话”；结合上文，用“就”承接叙事结果。“告诉了你们”在现代汉语中自然表达摩西向众人传达警告。
- source_word: וְלֹא שְׁמַעְתֶּם
  choice: 你们却不听
  rationale: שׁמע 可指“听”或“听从”。此处保留“听”的表达，既与前句“告诉”形成呼应，也不提前消解其是否包含顺服之意。
- source_word: וַתַּמְרוּ אֶת־פִּי יְהוָה
  choice: 你们违背雅威的命令
  rationale: מרה 表示悖逆、反抗；“雅威的口”是希伯来语习语，指雅威所说或所命令的事。正文译作“违背雅威的命令”清楚自然，直译信息置于脚注。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译“雅威”呈现神的专名，而不以称号替代。
- source_word: וַתָּזִדוּ
  choice: 狂妄行事
  rationale: זיד 含骄傲、僭妄而擅自行事之意；“狂妄行事”既保留道德意味，也不把该动词与随后“上去”的动作合并。
- source_word: וַתַּעֲלוּ הָהָרָה
  choice: 上了山区
  rationale: עלה 表示“上去”，带方向词尾的 הָהָרָה 指向山地或山区；“上了山区”自然保留地势和移动方向。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华／上主
  rationale: 原文直接使用四字神名；采用“雅威”音译，以保留其作为以色列之神专名的性质，不用称号取代。
- issue: אֶת־פִּי יְהוָה 的表达
  choice: 雅威的命令
  alternative: 雅威的口／雅威的话
  rationale: “口”是原文的具体意象，但在此构成表示所发命令的习语。正文用“命令”使现代读者明白所违背的是神的指示，同时用脚注保留原文字面形式。
translation_notes:
  register: 采用庄重而明白的现代标准汉语。“却”突出摩西传话与百姓不听之间的转折；分号和并列短句保留原文连续叙事的力度。
