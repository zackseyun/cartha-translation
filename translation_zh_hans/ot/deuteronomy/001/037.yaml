base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/037.yaml
  text: Yahweh was angry with me also because of you[a], saying[b], 'You also shall not enter there.'
translation:
  language: zh_hans
  text: 雅威也因你们的缘故向我发怒[a]，说[b]：“你也不得进入那里。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“雅威也因你们向我动怒。”这里的介词表明摩西是怒气所针对的对象。
    reason: lexical_alternative
  - marker: b
    text: 参民数记20:12；那里把摩西不得进入那地与他自己在米利巴的过失联系起来，而申命记此处强调百姓在这件事中的作用。
    reason: cross_reference
lexical_decisions:
- source_word: גַּם
  choice: 也
  rationale: 两处 גַּם 都表示追加并带有强调意味；译作“也”自然地保留了摩西同样受到牵连、同样不得进入的累加关系。
- source_word: בִּי
  choice: 向我
  rationale: 介词 בּ 与“发怒”连用时标明怒气所针对的对象。“向我发怒”在现代汉语中自然清楚，也不额外加强原文语气。
- source_word: הִתְאַנַּף
  choice: 发怒
  rationale: 该词表示动怒或处于愤怒之中。“发怒”庄重而通俗，力度适中。
- source_word: יְהוָה
  choice: 雅威
  rationale: 原文直接使用四字神名；采用通行的中文音译“雅威”，以保留其专名性质，而不以称号替代。
- source_word: בִּגְלַלְכֶם
  choice: 因你们的缘故
  rationale: 该短语表达原因或缘由。“因你们的缘故”既贴近原文，也明确保留本节将雅威向摩西发怒与百姓联系起来的说法。
- source_word: לֵאמֹר
  choice: 说
  rationale: 该不定式引出随后神所说的话；汉语用“说”最自然。
- source_word: גַּם אַתָּה
  choice: 你也
  rationale: 人称代词为阳性单数，特指摩西；“你也”保留 גַּם 的追加和强调作用。
- source_word: לֹא תָבֹא
  choice: 不得进入
  rationale: בוא 在此语境中指进入前文所说的应许之地。“不得进入”准确表达否定和禁绝结果，并比直译“不可来到”更符合汉语。
- source_word: שָׁם
  choice: 那里
  rationale: 该地点副词指向上下文中的那片土地；“那里”保留原文的指示性，没有把所指对象直接补入正文。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文使用神的专名。译作“雅威”保留专名，不用“主”这一称号替代，也不在正文中加入原文没有的解释。
- issue: 摩西不得进入那地的原因
  choice: 照本节直译为雅威“因你们的缘故”向摩西发怒
  alternative: 在正文中补入摩西本人在米利巴的过失，或把责任完全归给百姓
  rationale: 申命记本节强调百姓在这件事中的作用，而民数记20:12把摩西不得进入那地与他自己的过失联系起来。正文保留本节自身的表述，不以协调性解释消除经文之间的张力；相关背景置于脚注。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。句式紧随希伯来文的推进：“也……你也……”，保留两处 גַּם 的呼应；引语使用现代中文标点。正文不补明“那里”所指的土地，也不调和本节与民数记20章之间的神学张力。
