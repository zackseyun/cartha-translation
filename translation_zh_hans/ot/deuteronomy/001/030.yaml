base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/030.yaml
  text: Yahweh your God[a], who goes before you, will himself fight for you, just as he did for you in Egypt before your eyes.
translation:
  language: zh_hans
  text: 雅威——你们的上帝——走在你们前面；他必亲自为你们争战，正如他在埃及当着你们的面为你们所行[a]的一切那样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “为你们所行”原文直译可作“与（或同）你们所做的”。这里指雅威在埃及为以色列人施行的事。
    reason: 说明原文 אִתְּכֶם 的字面介词结构及其在上下文中的含义。
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 采用神圣名字的常见现代汉语音译，不以“耶和华”或“主”替代原文的专名。
- source_word: אֱלֹהֵיכֶם
  choice: 你们的上帝
  rationale: 虽为复数形态，此处与雅威同位，并带第二人称复数后缀，语义明确为单数。
- source_word: הַהֹלֵךְ לִפְנֵיכֶם
  choice: 走在你们前面的
  rationale: 分词表达持续或特征性的行动；此译自然地保留雅威在百姓前面引领的图景。
- source_word: הוּא יִלָּחֵם לָכֶם
  choice: 必亲自为你们争战
  rationale: 独立代词 הוּא 带有强调意味，译作“亲自”；יִלָּחֵם לָכֶם 表示代表百姓作战。
- source_word: כְּכֹל אֲשֶׁר
  choice: 正如……所做的一切
  rationale: 既保留比较关系，也保留 כֹל 所表达的“一切”，避免仅译成笼统的“正如”。
- source_word: עָשָׂה אִתְּכֶם
  choice: 为你们所做
  rationale: אִתְּכֶם 字面为“与你们”，但在此语境中指雅威在埃及为以色列施行的事；正文采用自然汉语，字面形式收入脚注。
- source_word: לְעֵינֵיכֶם
  choice: 当着你们的面
  rationale: 准确传达这些事是以色列人亲眼见证的，同时比直译“在你们眼前”更符合现代汉语。
theological_decisions:
- issue: 神圣名字 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；以音译“雅威”保留其专名性质，不用称号取代，也不采用基于后期混合元音形成的传统音译。
- issue: 上帝为以色列争战的强调
  choice: 必亲自为你们争战
  alternative: 他必为你们争战
  rationale: 保留原文独立代词 הוּא 的强调，凸显争战者是雅威自己，同时不额外解释其施行争战的方式。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“争战”保留经文的军事语义和圣经语体，但普通读者仍易理解。破折号标明“你们的上帝”与“雅威”的同位关系，避免长定语造成歧义。
