  text: בְּ/עֵ֥בֶר הַ/יַּרְדֵּ֖ן בְּ/אֶ֣רֶץ מוֹאָ֑ב הוֹאִ֣יל מֹשֶׁ֔ה בֵּאֵ֛ר אֶת הַ/תּוֹרָ֥ה הַ/זֹּ֖את לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/005.yaml
  text: 'Beyond the Jordan[a], in the land of Moab, Moses began to explain this law[b], saying:'
translation:
  language: zh_hans
  text: 在约旦河对岸[a]的摩押地，摩西开始阐明这律法[b]，说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“约旦河另一边”。这个希伯来语短语所指的方位取决于说话者或叙述者所处的位置。
    reason: lexical_alternative
  - marker: b
    text: 或译“这教导”。希伯来语“妥拉”既可指“律法”，也可更广泛地指“教导”；这里按立约和法令的语境译作“律法”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: 在约旦河对岸
  rationale: 该短语表示相对于叙述或说话者位置而言的约旦河另一边。“对岸”保留了希伯来语的相对方位表达，且符合现代汉语习惯；具体是东岸还是西岸须由语境判断。
- source_word: בְּאֶרֶץ מוֹאָב
  choice: 的摩押地
  rationale: אֶרֶץ在此指具有地理和政治含义的地域。“摩押地”简洁、自然，也准确衔接前面的方位短语。
- source_word: הוֹאִיל
  choice: 开始
  rationale: 该动词与后续动作连用时，表达着手或开始做某事。译作“开始”清楚自然，并适合本节引出摩西随后讲解律法的语境。
- source_word: בֵּאֵר
  choice: 阐明
  rationale: 该词在此表示把内容讲解清楚。“阐明”既保留解释、申明的意味，也符合庄重而通俗的现代书面语体。
- source_word: הַתּוֹרָה הַזֹּאת
  choice: 这律法
  rationale: תּוֹרָה既可指教导，也可指律法；本节处于申命记的立约和法令语境中，“律法”较能体现其法律与盟约色彩，同时以脚注保留“教导”这一较宽泛的可能含义。
- source_word: לֵאמֹר
  choice: 说：
  rationale: 这是引出下文言语内容的常用表达。译作“说：”简明地保留其话语衔接功能。
theological_decisions:
- issue: 立约语境中תּוֹרָה的译法
  choice: 这律法
  alternative: 这教导
  rationale: 申命记在此引出摩西对盟约条例的阐释，因此“律法”最能保留法律和盟约层面的含义；不过原词也可泛指教导，故用脚注保留该词义范围，不将其局限为某一宗派的神学概念。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“在约旦河对岸的摩押地”自然整合原文两个地点短语；“开始阐明”既忠实表达动作的起始，也体现讲解清楚的含义。脚注保留方位表达和תּוֹרָה词义上的真实弹性。
