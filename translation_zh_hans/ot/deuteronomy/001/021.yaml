  text: רְ֠אֵה נָתַ֨ן יְהוָ֧ה אֱלֹהֶ֛י/ךָ לְ/פָנֶ֖י/ךָ אֶת הָ/אָ֑רֶץ עֲלֵ֣ה רֵ֗שׁ כַּ/אֲשֶׁר֩ דִּבֶּ֨ר יְהוָ֜ה אֱלֹהֵ֤י אֲבֹתֶ֨י/ךָ֙ לָ֔/ךְ אַל תִּירָ֖א וְ/אַל תֵּחָֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/021.yaml
  text: See[a], Yahweh your God has set the land before you. Go up, take possession, just as Yahweh, the God of your fathers, has spoken to you. Do not fear or be dismayed.
translation:
  language: zh_hans
  text: 看哪，耶和华你的神已经把这地摆在你面前。上去，占有这地吧，正如耶和华你列祖的神对你所说的那样。不要惧怕，也不要惊惶。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רְאֵה
  choice: 看哪
  rationale: 单数阳性命令式，在此用作唤起注意的语气词；“看哪”保留直接、庄重的呼告意味。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 直接译出四字神名；“耶和华”是现代中文圣经传统中最通行、最易识别的专名形式。
- source_word: נָתַן ... לְפָנֶיךָ
  choice: 已经把……摆在你面前
  rationale: 保留“נתן＋在你面前”的具体意象，表达神已将这地置于以色列眼前、让他们可以进入占领。
- source_word: הָאָרֶץ
  choice: 这地
  rationale: 定冠词在语境中指前述、应许给以色列的土地；中文用“这地”自然地体现其特指性。
- source_word: עֲלֵה
  choice: 上去
  rationale: 保留进入山地时“上去”的空间意象，也符合希伯来语中向应许之地进发的常用表达。
- source_word: רֵשׁ
  choice: 占领它
  rationale: ירשׁ在此既有取得所有权，也有实际进入并占有之意；“占领”体现命令中的主动行动，宾语“它”依中文习惯补出。
- source_word: כַּאֲשֶׁר דִּבֶּר
  choice: 正如……所说的
  rationale: דבר本义为“说、讲”，上下文虽含应许意味，正文不把它明确化为“应许”，以免过度解释。
- source_word: אֱלֹהֵי אֲבֹתֶיךָ
  choice: 你列祖的神
  rationale: 保留“父辈”这一男性复数盟约称谓；“列祖”是自然、庄重且为普通中文读者熟悉的表达。
- source_word: אַל תִּירָא
  choice: 不要惧怕
  rationale: 直接表达禁止恐惧，语气简洁庄重。
- source_word: וְאַל תֵּחָת
  choice: 也不要惊惶
  rationale: חתת在此指因威胁而胆怯、崩溃或丧胆；“惊惶”与“惧怕”有所区别，又能自然构成并列劝勉。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文明确使用四字神名。正文采用中文圣经传统中通行的专名“耶和华”，而不以“主”替代，从而保留其作为盟约之神名字的功能。
- issue: אֱלֹהֵי אֲבֹתֶיךָ 中父系盟约称谓的表达
  choice: 你列祖的神
  alternative: 你祖先的神
  rationale: 原文是阳性复数“你的父辈”；“列祖”既忠实保留该形式，又是现代中文中可理解的圣经盟约用语，不将其泛化为性别中性的“祖先”。
- issue: דִּבֶּר 是否译作“应许”
  choice: 所说的
  alternative: 所应许的
  rationale: 语境确有应许含义，但动词本身只是“说”。采用“所说的”保留原文措辞及其中未明说的应许意味。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。第二人称单数按汉语自然表达译作“你”，代表摩西所面对的以色列整体。句式保留原文连续命令的力度，并避免不必要的古奥措辞。
