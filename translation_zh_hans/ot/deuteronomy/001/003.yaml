base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/003.yaml
  text: And it happened in the fortieth year[a], in the eleventh month, on the first day of the month[b], that Moses spoke to the sons of Israel according to all that Yahweh had commanded him to them.
translation:
  language: zh_hans
  text: 到了第四十年十一月初一，摩西照着耶和华吩咐他传给他们的一切，向以色列人说了。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “吩咐他传给他们”，原文直译为“吩咐他给他们”；这一简略结构也可理解为“吩咐他有关他们的事”。
    reason: 保留 אֹתוֹ אֲלֵהֶם 的句法与语义歧义。
lexical_decisions:
- source_word: וַיְהִי
  choice: 到了
  rationale: 此处引出叙事的时间背景。现代汉语用“到了”自然衔接上下文，无须机械译出“事情发生了”。
- source_word: בְּאַרְבָּעִים שָׁנָה
  choice: 第四十年
  rationale: 这是按年次纪年的表达，汉语用序数最自然。
- source_word: בְּעַשְׁתֵּי עָשָׂר חֹדֶשׁ בְּאֶחָד לַחֹדֶשׁ
  choice: 十一月初一
  rationale: 两部分合为标准、简洁的汉语日期表达；不把这里误解为现代公历十一月。
- source_word: דִּבֶּר מֹשֶׁה אֶל בְּנֵי יִשְׂרָאֵל
  choice: 摩西……向以色列人所说……都告诉了他们
  rationale: “以色列人”自然表达群体称谓；调整语序以符合现代汉语，同时保留摩西向他们讲话的含义。
- source_word: כְּכֹל אֲשֶׁר צִוָּה יְהוָה אֹתוֹ אֲלֵהֶם
  choice: 耶和华吩咐他向以色列人所说的一切话
  rationale: 保留“按照全部所吩咐的”这一完整性，并将压缩的 אֹתוֹ אֲלֵהֶם 按语境译为吩咐摩西向以色列人传达的话。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的专名形式，明确对应四字神名，而非一般性的称号“主”或“上主”。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: “耶和华”是现代简体中文圣经语境中广为人知的专名形式；它保留神名与普通称号的区别，又不借此加入额外的教派解释。
- issue: אֹתוֹ אֲלֵהֶם 的关系
  choice: 吩咐摩西向以色列人所说的话
  alternative: 吩咐摩西有关他们的事
  rationale: 介词结构较为压缩，可理解为“向他们”，也可能带“有关他们”的意味。正文依据讲话场景采用前者，脚注保留另一种可能。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“十一月初一”按古代以色列历法理解；为避免正文冗长，未额外插入“那月第一日”。“以色列人”比直译“以色列的众子”更符合现代普通读者的表达习惯。
