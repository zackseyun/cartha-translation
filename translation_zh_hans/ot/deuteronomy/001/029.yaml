lexical_decisions:
- source_word: תַעַרְצוּן
  choice: 惊慌
  rationale: 该词在此表示面对敌人时因恐惧而惊惶；“惊慌”自然、庄重，也与下句一般性的“怕”有所区分。
- source_word: תִירְאוּן
  choice: 怕
  rationale: 直译常用动词“惧怕”；在本句中用现代汉语更自然的“怕”，准确表达对敌人的恐惧。
- source_word: מֵהֶם
  choice: 因他们／怕他们
  rationale: 介词 מִן 在两个并列动词的语境中指恐惧所针对或引发恐惧的对象；分别按现代汉语习惯表达为“因他们”和“怕他们”。
