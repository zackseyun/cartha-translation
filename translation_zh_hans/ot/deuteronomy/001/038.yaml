  text: יְהוֹשֻׁ֤עַ בִּן נוּן֙ הָ/עֹמֵ֣ד לְ/פָנֶ֔י/ךָ ה֖וּא יָ֣בֹא שָׁ֑מָּ/ה אֹת֣/וֹ חַזֵּ֔ק כִּי ה֖וּא יַנְחִלֶ֥/נָּה אֶת יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/038.yaml
  text: Joshua son of Nun[a], who stands before you—he will go in there. Strengthen him, for he will cause Israel to inherit it.
translation:
  language: zh_hans
  text: 站在你面前的嫩的儿子约书亚，他必进入那里。你要使他刚强，因为他必使以色列承受那地为业。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他必把那地赐给以色列作产业”，或“他必把那地分给以色列作产业”。
    reason: 词义有多种可能：נחל 的使役形既可表示使人承受产业，也可表示把产业赐下或分配给人。
lexical_decisions:
- source_word: יְהוֹשֻׁעַ בִּן נוּן
  choice: 嫩的儿子约书亚
  rationale: 采用现代中文圣经中通行的人名译法“约书亚”和“嫩”，并按希伯来语保留父子关系。
- source_word: הָעֹמֵד לְפָנֶיךָ
  choice: 站在你面前的
  rationale: 贴近分词短语的字面意义，也保留它可能仅指站立在摩西面前、也可能暗含侍候关系的开放性，避免直接解释为“侍奉你的”。
- source_word: הוּא יָבֹא שָׁמָּה
  choice: 他必进入那里
  rationale: “进入”体现 בוא 与方向副词 שָׁמָּה 所表达的进入前文所说之地的方向感；“必”传达此处将来陈述的确定语气。
- source_word: אֹתוֹ חַזֵּק
  choice: 你要使他刚强
  rationale: 保留 חזק 使役命令的宽广含义，可涵盖坚固、鼓励和实际扶持，而不把它缩窄为单纯的言语鼓励。
- source_word: כִּי
  choice: 因为
  rationale: 此处引出必须使约书亚刚强的理由，现代汉语用“因为”清楚自然。
- source_word: הוּא יַנְחִלֶנָּה אֶת יִשְׂרָאֵל
  choice: 他必使以色列承受那地为业
  rationale: 用“使……承受……为业”表达 נחל 的使役形，并将阴性单数后缀按上下文明确为“那地”；同时借脚注保留“赐为产业”和“分给作产业”等词义可能。
theological_decisions:
- issue: יַנְחִלֶנָּה 中阴性单数后缀的所指
  choice: 在正文中译明为“那地”，指前文应许给以色列的土地。
  alternative: 不明说宾语，译作“他必使以色列承受产业”。
  rationale: 紧接的上下文谈到进入并占有那地；明确译出“那地”是在汉语中呈现希伯来语代词所指，并未增加新的神学主张。
- issue: 约书亚在以色列得地为业中的作用
  choice: 译作“使以色列承受那地为业”。
  alternative: 译作“把那地赐给以色列作产业”或“把那地分给以色列作产业”。
  rationale: 正文保留希伯来语使役形，既陈述约书亚所承担的作用，又不把其作用过度解释为土地应许的最终源头；其他可能义在脚注列出。
translation_notes:
  register: 采用庄重而清楚的现代标准普通话。“站在你面前”保留原文意象；“使他刚强”和“承受那地为业”延续经文语域，但句法仍便于普通读者理解。脚注标记置于相关继承语句之后。
