  yaml_path: translation/ot/deuteronomy/001/023.yaml
  text: And the matter seemed good in my eyes[a], so I took from among you twelve men, one man for each tribe.
translation:
  language: zh_hans
  text: 这事我看为好[a]，于是我从你们中间选了十二名男子，每个支派一人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这项提议使我满意。”
    reason: 词义与表达方式的另一种可能；וַיִּיטַב בְּעֵינַי表示此事在摩西看来是好的、可接受的，也可表达为使他满意。
lexical_decisions:
- source_word: וַיִּיטַב בְּעֵינַי
  choice: 我看为好
  rationale: 保留“在我眼中为好”的评价意味和摩西本人的认可，同时用现代汉语中自然、庄重的表达呈现。
- source_word: הַדָּבָר
  choice: 这事
  rationale: 所指是上文提出的建议；“这事”既承接语境，又避免像“这项提议”那样过度解释。
- source_word: וָאֶקַּח
  choice: 选了
  rationale: לקח字面为“取、拿”，但在这里指从众人中选出代表；汉语译作“选了”最自然，也准确表达语境中的动作。
- source_word: מִכֶּם
  choice: 从你们中间
  rationale: 明确表达מן所表示的从群体内部选取之意。
- source_word: שְׁנֵים עָשָׂר אֲנָשִׁים
  choice: 十二个人
  rationale: 准确表达人数；现代汉语“人”在此自然，并不改变原文所指的男性代表。
- source_word: אִישׁ אֶחָד לַשָּׁבֶט
  choice: 每个支派一人
  rationale: 简洁、自然地体现原文的逐支派分配关系，即每个支派选一名代表。
