  source_fidelity: 译文准确传达了“这事在我看来是好的”、从以色列民中选取，以及每支派一人的分配意义。惟“十二个人”在现代汉语中通常不标示性别，而原文“שְׁנֵים עָשָׂר אֲנָשִׁים”明确指十二名男子；宜在正文中保留这一信息。
