base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/013.yaml
  text: Choose for yourselves wise[a], discerning, and well-known men from your tribes[b], and I will appoint them as your heads.
translation:
  language: zh_hans
  text: 你们要从各支派中选出有智慧、有见识、为人所知[a]的人，我就立他们作你们的首领。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “为人所知”也可译为“有名望”或“受认可”；原文可指在各支派中有既定声望的人。
    reason: lexical_alternative
  - marker: b
    text: “首领”原文直译为“头”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הָבוּ לָכֶם
  choice: 你们要……选出
  rationale: יהב的复数命令式本义可指“拿来、交出”，但在此处是让百姓提出合适人选；结合לָכֶם所带的为自己、由自己一方办理的意味，译为“你们要……选出”最符合语境。
- source_word: אֲנָשִׁים
  choice: 人
  rationale: 该词为阳性复数，在此指将受任命的支派领袖；现代汉语“人”在此自然地指这些具体人选，不额外强化原文未着重说明的性别。
- source_word: חֲכָמִים
  choice: 有智慧
  rationale: 在选立治理者的语境中，指具备明智判断，而非技术性的熟练。
- source_word: וּנְבֹנִים
  choice: 有见识
  rationale: 源自בין，强调能理解、辨别并作出判断；“有见识”是自然且庄重的现代汉语表达。
- source_word: וִידֻעִים
  choice: 众人所认可
  rationale: 该词是ידע的被动分词，核心意义是“被认识、为人所知”；在支派选任语境中很可能指声望已获群体确认。“众人所认可”表达这种公开认可，同时不把它误解为仅仅知名。
- source_word: לְשִׁבְטֵיכֶם
  choice: 从各支派中
  rationale: 这里最自然地说明人选来自各支派；“各支派”也反映复数后缀及按支派选人的分布意味。
- source_word: וַאֲשִׂימֵם
  choice: 我就立他们
  rationale: 表示摩西在百姓选出人选之后所采取的相应行动；“立”简洁表达正式安置或任命。
- source_word: בְּרָאשֵׁיכֶם
  choice: 作你们的首领
  rationale: רֹאשׁ字面为“头”，这里是领袖的比喻用法；现代中文以“首领”既保留词源意象，也明确表达治理职位。
theological_decisions:
- issue: אֲנָשִׁים是否在正文中明确译为“男人”
  choice: 译为“人”
  alternative: 译为“男人”
  rationale: 希伯来词形确为阳性复数，但本节论述焦点是候选人的资格与任命。现代汉语“人”可自然承载此处的群体指称；译成“男人”会特别凸显生理性别，语用重心强于原文。此选择不否认古代支派领袖结构中的男性指向。
- issue: וִידֻעִים所指是知名度还是公认资格
  choice: 众人所认可
  alternative: 有名望／为人所知
  rationale: 原词保留“被认识、被承认”的语义空间；在选任领袖的语境中，“所认可”能传达群体对候选人的认识和承认，却不把它限定为单纯声名。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“有智慧、有见识、众人所认可”保持三个并列资格；“我就立他们”体现百姓推选与摩西任命之间的先后关系。正文只设置一个确有必要的词义注，且标记已置于正文。
