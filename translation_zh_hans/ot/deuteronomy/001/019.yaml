  text: וַ/נִּסַּ֣ע מֵ/חֹרֵ֗ב וַ/נֵּ֡לֶךְ אֵ֣ת כָּל הַ/מִּדְבָּ֣ר הַ/גָּדוֹל֩ וְ/הַ/נּוֹרָ֨א הַ/ה֜וּא אֲשֶׁ֣ר רְאִיתֶ֗ם דֶּ֚רֶךְ הַ֣ר הָֽ/אֱמֹרִ֔י כַּ/אֲשֶׁ֥ר צִוָּ֛ה יְהוָ֥ה אֱלֹהֵ֖י/נוּ אֹתָ֑/נוּ וַ/נָּבֹ֕א עַ֖ד קָדֵ֥שׁ בַּרְנֵֽעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/019.yaml
  text: Then we set out from Horeb and went through all that great and fearsome wilderness that you saw on the way to the hill country of the Amorites[a], just as Yahweh our God commanded us, and we came as far as Kadesh-barnea.
translation:
  language: zh_hans
  text: “于是，我们从何烈出发，经过了你们所看见的那片辽阔而可畏的旷野[a]，沿着通往亚摩利人山区的路前行，正如耶和华我们的上帝所吩咐我们的，便来到加低斯·巴尼亚。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “可畏”也可译作“令人惧怕”。希伯来语这个词可指使人产生惧怕、敬畏或恐惧的事物。
    reason: 说明נוֹרָא的语义范围，避免正文译词把多重意味过度限定。
lexical_decisions:
- source_word: וַנִּסַּע מֵחֹרֵב
  choice: 我们从何烈山出发
  rationale: נסע在此指拔营启程；“出发”自然准确。חֹרֵב按通行中文音译作“何烈山”。
- source_word: וַנֵּלֶךְ אֵת כָּל הַמִּדְבָּר
  choice: 走过了……那整片……旷野
  rationale: הלך与直接宾语“整个旷野”连用，表达穿越该地域；“走过”既符合现代汉语，也保留行程意味。
- source_word: הַמִּדְבָּר הַגָּדוֹל וְהַנּוֹרָא
  choice: 辽阔可畏的旷野
  rationale: 在地貌语境中，גָּדוֹל不只可指抽象的“大”，也可表达范围广大；נוֹרָא指令人惧怕、敬畏或震慑，译作“可畏”可保留其语义张力。
- source_word: אֲשֶׁר רְאִיתֶם
  choice: 你们所看见的
  rationale: 直接保留摩西对听众亲身见闻的诉诸。
- source_word: דֶּרֶךְ הַר הָאֱמֹרִי
  choice: 沿着通往亚摩利人山区的路前行
  rationale: דֶּרֶךְ表示道路或行进路线；הַר在此宜理解为山地或山区，而不是单独一座山。介词性表达“通往”符合该路线朝向亚摩利人山地的语境。
- source_word: כַּאֲשֶׁר צִוָּה
  choice: 正如……所吩咐我们的
  rationale: “正如”表达行动与命令相符，保留כַּאֲשֶׁר的对应意味。
- source_word: יְהוָה אֱלֹהֵינוּ
  choice: 耶和华—我们的上帝
  rationale: 以“耶和华”呈现四字神名在现代中文圣经传统中的通行形式，并直译אֱלֹהֵינוּ为“我们的上帝”。
- source_word: וַנָּבֹא עַד קָדֵשׁ בַּרְנֵעַ
  choice: 后来我们到了加低斯·巴尼亚
  rationale: בוא עד在此表示抵达目的地；“后来”自然承接希伯来叙事体的连续动词形式。地名按中文惯例音译。
theological_decisions:
- issue: 四字神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用神的专名。中文正文采用读者最熟悉且明确作为专名的“耶和华”，不以“主”这一称号替代，也不借此解决其古代确切读音问题。
- issue: נוֹרָא所表达的惧怕与敬畏
  choice: 可畏
  alternative: 可怕
  rationale: “可畏”既能表达旷野令人恐惧、震慑的一面，又不把该词缩减为纯粹负面的“可怕”，从而保留原词可涵盖畏惧与敬畏的张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。以“整片辽阔可畏的旷野”保持原文强调，以分号维持长句的叙事推进；地名采用简体中文圣经语境中易识别的形式。
