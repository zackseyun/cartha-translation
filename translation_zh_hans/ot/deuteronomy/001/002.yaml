  text: It is eleven days from Horeb by the way of Mount Seir to Kadesh-barnea[a][b].
translation:
  language: zh_hans
  text: 从何烈山取道西珥山，到加低斯·巴尼亚，是十一天的路程[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“共走十一天。”原文以行程时间说明从何烈山经这条路线到加低斯·巴尼亚的路程。
    reason: lexical_alternative
  - marker: b
    text: 原文在这里所用的地名是“何烈”；此地通常与西奈相联系。
    reason: textual_clarification
lexical_decisions:
- source_word: אַחַד עָשָׂר יוֹם
  choice: 十一天的路程
  rationale: 原文直译为“十一天”，在此以行程所需时间表达路途距离；“十一天的路程”既保留原意，也符合现代汉语习惯。
- source_word: מֵחֹרֵב
  choice: 从何烈山
  rationale: חֹרֵב 是地名“何烈”；保留原文地名，不以相关的传统名称“西奈”替换。汉语地名通常称“何烈山”。
- source_word: דֶּרֶךְ הַר שֵׂעִיר
  choice: 取道西珥山
  rationale: דֶּרֶךְ 在这里指道路或路线；“取道”自然地表达经由某路线前行。הַר שֵׂעִיר 可指西珥山或西珥山区，此处保留简洁的传统地名“西珥山”。
- source_word: עַד
  choice: 到
  rationale: 在地理行程语境中标明终点，译作“到”最自然。
- source_word: קָדֵשׁ בַּרְנֵעַ
  choice: 加低斯·巴尼亚
  rationale: 按专名音译，并用间隔号清楚标示复合地名的两个部分。
