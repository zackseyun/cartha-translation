source:
  edition: WLC
  text: רְאֵ֛ה נָתַ֥תִּי לִ/פְנֵי/כֶ֖ם אֶת הָ/אָ֑רֶץ בֹּ֚אוּ וּ/רְשׁ֣וּ אֶת הָ/אָ֔רֶץ אֲשֶׁ֣ר נִשְׁבַּ֣ע יְ֠הוָה לַ/אֲבֹ֨תֵי/כֶ֜ם לְ/אַבְרָהָ֨ם לְ/יִצְחָ֤ק וּֽ/לְ/יַעֲקֹב֙ לָ/תֵ֣ת לָ/הֶ֔ם וּ/לְ/זַרְעָ֖/ם אַחֲרֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/008.yaml
  text: See[a], I have set the land before you. Go in and take possession of the land that Yahweh swore to your fathers—to Abraham, to Isaac[d][c][b], and to Jacob—to give to them and to their offspring after them.
translation:
  language: zh_hans
  text: 看哪[a]，我已经把这地摆在你们面前；你们要进去，取得[b]耶和华向你们的父辈[c]——亚伯拉罕、以撒和雅各——起誓要赐给他们和他们后代[d]的那地为业。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“看”或“你们看”。原文为单数命令式，用来郑重唤起全体会众注意。
    reason: lexical_alternative
  - marker: b
    text: 或译：“占有”或“承受为业”。原文动词也可指取得所承受的产业。
    reason: lexical_alternative
  - marker: c
    text: 原文直译“你们的父辈”，这里特指亚伯拉罕、以撒和雅各。
    reason: alternative_reading
  - marker: d
    text: 原文直译“他们之后的种子”；“种子”在这里是集合用语，指他们的后裔。
    reason: lexical_alternative
lexical_decisions:
- source_word: רְאֵה
  choice: 看哪
  rationale: 单数命令式在此用于郑重唤起全体听众注意；“看哪”保留强调和宣告语气，同时仍为现代中文所理解。
- source_word: נָתַתִּי לִפְנֵיכֶם
  choice: 我已经把……摆在你们面前
  rationale: נתן与לִפְנֵי连用，表达将某物置于人面前；完成式传达这地现已向他们开放、可供取得。
- source_word: הָאָרֶץ
  choice: 这地／那地
  rationale: 此处指应许之地；首次随指示语境译作“这地”，关系从句中按自然中文译作“那地”。
- source_word: בֹּאוּ
  choice: 进去
  rationale: 复数命令式，指以色列人进入眼前的土地；中文“进去”自然体现从当前所在之处进入该地。
- source_word: וּרְשׁוּ
  choice: 占领
  rationale: ירשׁ在进入并取得土地的语境中兼有取得、占有和承受产业之意；“占领”保留此处主动进入并取得土地的力度，脚注说明其较宽语义。
- source_word: נִשְׁבַּע יְהוָה
  choice: 耶和华……起誓
  rationale: 保留四字神名，以现代中文常用音译“耶和华”呈现；“起誓”准确表达שׁבע的立约誓言语气。
- source_word: לַאֲבֹתֵיכֶם
  choice: 你们的先祖
  rationale: 上下文随即明确列出亚伯拉罕、以撒和雅各；“先祖”在中文中自然、庄重，并不模糊所指的男性族长。
- source_word: לְאַבְרָהָם לְיִצְחָק וּלְיַעֲקֹב
  choice: 亚伯拉罕、以撒和雅各
  rationale: 采用现代中文圣经人名的通行译法；中文无需机械重复介词，破折号保留同位解释关系。
- source_word: לָתֵת לָהֶם וּלְזַרְעָם אַחֲרֵיהֶם
  choice: 要赐给他们和他们后代
  rationale: זֶרַע是集合单数，可指后裔整体；“后代”自然清楚，并在脚注保留较直译的“种子／后裔”意象。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。简体中文普通读者最熟悉“耶和华”，可明确呈现专名而非以“主”替代；“雅威”是较贴近学术重构发音的可行译法。
- issue: אֲבֹתֵיכֶם的性别与所指
  choice: 你们的先祖
  alternative: 你们的父辈
  rationale: 经文明确以亚伯拉罕、以撒和雅各解释此词，因此“先祖”并未将男性族长中性化，且比“父辈”更准确地表达久远祖先。
- issue: ירשׁ中征服与承受产业的张力
  choice: 正文译“占领”，脚注保留“取得为业／拥有”
  alternative: 承受这地为业
  rationale: 当前语境包含进入土地并实际取得它的命令，但该动词也带有承受所应许产业的含义；正文不弱化行动力度，脚注则保存其语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。保留“看哪”的郑重宣告色彩和“摆在你们面前”的原文意象；句法稍作中文化调整，使“起誓要赐给……”完整修饰“那地”。所有脚注标记均置于正文对应词语之后。
