  yaml_path: translation/ot/deuteronomy/001/012.yaml
  text: How can I alone bear your trouble[a], your burden, and your disputes?
translation:
  language: zh_hans
  text: 我独自一人怎能担当你们的麻烦、重担和纷争[a]呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “纷争”也可译作“争讼”或“诉讼案件”。
    reason: רִיב 的语义范围包括一般争执以及需要裁断的法律案件；正文保留宽泛表达，脚注呈现司法层面的可能含义。
lexical_decisions:
- source_word: אֵיכָה
  choice: 怎能
  rationale: 这里引出带有感叹意味的反问，表达摩西独力承担这些事务的艰难或不可能；“怎能”自然传达这一语气。
- source_word: אֶשָּׂא
  choice: 担当
  rationale: נשׂא 本义可指举起、背负，此处指承担责任和压力；“担当”能自然统摄后面的抽象宾语。
- source_word: לְבַדִּי
  choice: 我独自一人
  rationale: 保留摩西必须单独处理一切的强调意味，也符合现代汉语表达。
- source_word: טָרְחֲכֶם
  choice: 你们的劳苦
  rationale: טֹרַח 可指劳碌、麻烦或令人疲惫的重负；译作“劳苦”既体现耗费心力，也与下一项“重担”有所区别。
- source_word: מַשַּׂאֲכֶם
  choice: 你们的重担
  rationale: מַשָּׂא 指所负之物或负担；此处采用自然且保留比喻色彩的“重担”。
- source_word: רִיבְכֶם
  choice: 你们的纷争
  rationale: רִיב 可指争执、争讼或诉讼案件；“纷争”保留较宽的含义，既可涵盖人际冲突，也不排除司法审理的语境。
