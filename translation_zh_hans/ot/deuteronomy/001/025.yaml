  text: וַ/יִּקְח֤וּ בְ/יָדָ/ם֙ מִ/פְּרִ֣י הָ/אָ֔רֶץ וַ/יּוֹרִ֖דוּ אֵלֵ֑י/נוּ וַ/יָּשִׁ֨בוּ אֹתָ֤/נוּ דָבָר֙ וַ/יֹּ֣אמְר֔וּ טוֹבָ֣ה הָ/אָ֔רֶץ אֲשֶׁר יְהוָ֥ה אֱלֹהֵ֖י/נוּ נֹתֵ֥ן לָֽ/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/025.yaml
  text: And they took in their hands some of the fruit of the land and brought it down to us[a], and they brought us back word and said, “The land that Yahweh our God is giving to us is good.”
translation:
  language: zh_hans
  text: 他们手里拿着那地的一些果子，带下来给我们；又向我们回报说：“耶和华我们的上帝正在赐给我们的那地是美地。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְחוּ בְיָדָם
  choice: 他们手里拿着
  rationale: 保留“手里”的具体意象，同时用自然的现代汉语表达拿取并携带果子的动作。
- source_word: מִפְּרִי הָאָרֶץ
  choice: 那地的一些果子
  rationale: 将部分含义的介词 מִן 译为“一些”，表明所带的是当地出产的样品，而非全部果实。
- source_word: וַיּוֹרִדוּ אֵלֵינוּ
  choice: 带下来给我们
  rationale: 使役形保留“带下来”的方向含义，可能指从山区回到营地。
- source_word: וַיָּשִׁבוּ אֹתָנוּ דָבָר
  choice: 又向我们回报
  rationale: 该希伯来语习语表示带回消息；“回报”既保留“返回”的意味，也符合现代汉语表达。
- source_word: טוֹבָה הָאָרֶץ
  choice: 那地是美地
  rationale: טוֹבָה 是对土地整体品质的正面评价；“美地”自然、凝练，并包含土地美好、宜居宜产的宽泛含义。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经传统中对四字神名的通行音译，明确保留专名，不以称号替代。
- source_word: אֱלֹהֵינוּ
  choice: 我们的上帝
  rationale: 准确表达第一人称复数所属关系，并采用现代标准汉语中庄重、易懂的称谓。
- source_word: נֹתֵן לָנוּ
  choice: 正在赐给我们
  rationale: 以“正在”体现分词所表达的进行中或正在落实的赐予，并以“赐”符合上帝将土地授予以色列的语境。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名；正文保留为专名。中文采用广为人知且庄重的“耶和华”，同时不将其泛化为“主”。
- issue: נֹתֵן 所表达的赐地行动
  choice: 正在赐给我们
  alternative: 要赐给我们
  rationale: 保留分词的持续或当前实行色彩，不把它单纯限定为未来应许；这也维持“已经赐予”与“尚待承受”之间的张力。
translation_notes:
  register: 采用现代标准普通话书面语，庄重而易懂。“手里拿着”“带下来”保留原文的具体动作和方向；“回报”自然呈现带回消息的习语。“美地”避免把 טוֹבָה 过度限定为景色优美或道德意义上的善。
