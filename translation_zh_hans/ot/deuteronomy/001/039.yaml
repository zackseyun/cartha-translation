revisions:
- from: 至于你们的孩子，就是你们曾说会成为掠物的，以及你们的儿女，就是今日还不知善恶的，他们必进入那里。我要把那地赐给他们，他们必占有那地。[a]
  to: 至于你们的孩子——你们说他们会成为掠物——和你们今日不知善恶的儿子，他们必进入那里；我要把那地赐给他们，他们必占有那地。[a]
  rationale: 修订仅处理源文性别形式、避免“还”所加的轻微语义，并改善中文长句的可读性。“不知善恶”仍按原文习语保留，未将其解释为无罪、责任年龄或任何特定教义结论。
