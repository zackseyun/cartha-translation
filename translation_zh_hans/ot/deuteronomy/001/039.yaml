base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/039.yaml
  text: And your little ones[a], whom you said would become plunder, and your children, who today do not know good or evil—they shall go in there, and I will give it to them[c][b], and they shall possess it.
translation:
  language: zh_hans
  text: 至于你们的孩子——你们说他们会成为掠物——和你们今日不知善恶的儿子，他们必进入那里；我要把那地赐给他们，他们必占有那地。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “占有”也可译作“承受”。
    reason: lexical_alternative
lexical_decisions:
- source_word: טַפְּכֶם
  choice: 你们的孩子
  rationale: טַף指幼小的孩子或受抚养者；中文用“孩子”自然地表达其年幼与脆弱，也避免不必要地把它限定为男性。
- source_word: לָבַז יִהְיֶה
  choice: 会成为掠物
  rationale: בַּז指敌人夺取的掠物或战利品；“成为掠物”贴近原文，也保留以色列人所惧怕的结果。
- source_word: בְנֵיכֶם
  choice: 你们的儿女
  rationale: בנים形式上是阳性复数，但在此与טף同指下一代；现代汉语“儿女”既保留亲子关系，也符合上下文的整体指向。
- source_word: לֹא יָדְעוּ הַיּוֹם טוֹב וָרָע
  choice: 今日还不知善恶
  rationale: 直译并保留希伯来语表达，不把它扩展为有关无罪、责任年龄或盟约地位的教义判断；“还”自然显出他们尚未具备成熟辨别力。
- source_word: שָׁמָּה
  choice: 进入那里
  rationale: שָׁמָּה带有向那里去的方向意味；与יָבֹאוּ合译为“进入那里”，清楚指向前文所说之地。
- source_word: אֶתְּנֶנָּה
  choice: 我要把那地赐给他们
  rationale: 阴性单数后缀所指为前文的土地；中文明说“那地”比单用“它”更清楚，“赐给”也适合上帝给予应许之地的语境。
- source_word: יִירָשׁוּהָ
  choice: 他们必占有那地
  rationale: ירשׁ在此可表达承受、取得并占有土地；“占有”保留实际取得土地的含义，而不把词义仅限于通常的家产继承。
theological_decisions:
- issue: “不知善恶”所描述的下一代状态
  choice: 保留原有习语，只暗示尚未具备成熟辨别力
  alternative: 解释为完全无罪、没有盟约责任，或确立某种责任年龄
  rationale: 本节借此对比被定罪的成年一代与他们的儿女，但原文并未解决有关儿童无罪或责任年龄的后世教义问题。
- issue: יִירָשׁוּהָ中土地取得的性质
  choice: 译为“占有那地”
  alternative: 译为“承受那地”
  rationale: “承受”能突出应许与产业，“占有”则更直接表达进入并取得土地；正文采用后者，同时以脚注保留前者这一真实词义可能。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“至于……以及……”呈现原文较长的主语结构；后半改用较短句，便于普通读者理解。所有代词所指尽量明确，以“那地”承接上下文。
