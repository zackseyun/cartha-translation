  text: וַ/יִּשְׁמַ֥ע יְהוָ֖ה אֶת ק֣וֹל דִּבְרֵי/כֶ֑ם וַ/יִּקְצֹ֖ף וַ/יִּשָּׁבַ֥ע לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/034.yaml
  text: And Yahweh heard the sound of your words[a], and he was angry and swore, saying,
translation:
  language: zh_hans
  text: 雅威听见你们所说的话[a]，就发怒，起誓说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语直译：“你们话语的声音。”
    reason: 保留原文 קוֹל דִּבְרֵיכֶם 的字面表达，同时使正文符合自然现代汉语。
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来语四字神名的通行拟音译出，保留其作为上帝专名的性质，而不以头衔替代。
- source_word: וַיִּשְׁמַע
  choice: 听见
  rationale: 在叙事语境中，שׁמע直接表示听见；此处不必译成可能暗示顺从或接受的“听从”。
- source_word: אֶת קוֹל דִּבְרֵיכֶם
  choice: 你们所说的话
  rationale: 希伯来语直译为“你们话语的声音”；正文采用自然现代汉语表达，并以脚注保留原文意象。
- source_word: וַיִּקְצֹף
  choice: 就发怒
  rationale: קצף表示发怒、震怒；“发怒”准确而自然，“就”体现连续叙事的推进。
- source_word: וַיִּשָּׁבַע
  choice: 起誓
  rationale: שׁבע的尼法勒式在此意为起誓；后文接续誓言内容，因此无需增译“发了一个誓”。
- source_word: לֵאמֹר
  choice: 说
  rationale: 该不定式用于引出直接引语；现代汉语以“说”配合冒号，既自然又保留其引语功能。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。译作“雅威”保留专名及其盟约语境，不以“主”这一头衔替代；“耶和华”虽为传统汉译，但较不符合该名称的主流拟音重构。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“雅威”作为神名，“发怒”“起誓”保持叙事的严肃语气；句末冒号表明誓言内容将在下一节继续。
