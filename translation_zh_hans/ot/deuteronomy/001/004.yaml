base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/004.yaml
  text: after he had struck down Sihon king of the Amorites[a], who lived in Heshbon, and Og king of Bashan, who lived in Ashtaroth at Edrei.
translation:
  language: zh_hans
  text: 在他击败住在希实本的亚摩利人的王西宏，以及住在亚斯他录和以得来的巴珊王噩之后。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַחֲרֵי
  choice: 此前
  rationale: 该介词引出相对于第3节主句已经发生的事；“此前”在承接上文时自然、清楚。
- source_word: הַכֹּתוֹ
  choice: 他击杀了
  rationale: נכה的不定式附第三人称阳性单数后缀，表示摩西说话之前已经完成的行动；“击杀”保留动词的强度，不弱化为笼统的“击败”。
- source_word: סִיחֹן
  choice: 西宏
  rationale: 采用现代中文圣经读者熟悉的人名译法。
- source_word: מֶלֶךְ הָאֱמֹרִי
  choice: 亚摩利王
  rationale: 简洁表达“亚摩利人的王”，并保留其族群身份。
- source_word: אֲשֶׁר יוֹשֵׁב
  choice: 住在
  rationale: יָשַׁב在此指居住或驻居；“住在”是自然的现代汉语。
- source_word: בְּחֶשְׁבּוֹן
  choice: 在希实本
  rationale: 介词בְּ加城名，表示居住地点。
- source_word: עוֹג
  choice: 噩
  rationale: 采用现代中文圣经读者熟悉的人名译法。
- source_word: מֶלֶךְ הַבָּשָׁן
  choice: 巴珊王
  rationale: 自然表达该王对巴珊地区的统治。
- source_word: אֲשֶׁר יוֹשֵׁב בְּעַשְׁתָּרֹת בְּאֶדְרֶעִי
  choice: 住在以得来的亚斯他录
  rationale: 原文在两个地名之前都使用介词בְּ，二者的确切关系未完全明说。正文以简洁方式保留传统所理解的关联，同时用脚注注明并列地点的可能读法。
theological_decisions: []
