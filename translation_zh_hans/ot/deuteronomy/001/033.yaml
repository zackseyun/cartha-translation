  to: 他走在你们前面，在路上为你们寻找安营的地方[a]；夜间在火中，指示你们该走的路[b]；白天在云中。
  rationale: 仅作汉语语序与措辞的安全调整：将“在路上”置于“走在你们前面”之后，以消除重复而保留原文的路径成分；以“该走的路”替代“当走的路”，使现代汉语更自然，并维持原文在引导语境中的开放情态。脚注锚点及其所说明的词汇替代均保留。
