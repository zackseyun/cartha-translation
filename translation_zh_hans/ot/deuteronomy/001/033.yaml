base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/033.yaml
  text: who went before you on the way to search out a place for you to camp[a], in fire by night to show you the way in which you should go[b], and in the cloud by day.
translation:
  language: zh_hans
  text: 他走在你们前面，在路上为你们寻找安营的地方[a]；夜间在火中，指示你们该走的路[b]；白天在云中。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“为你们探察安营的地方。”
    reason: lexical_alternative
  - marker: b
    text: 直译：“使你们看见你们要走的路。”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַהֹלֵךְ
  choice: 他……走
  rationale: 这是הלך的Qal主动分词，承接上一节所说的耶和华。汉语用“他……走”自然表达过去叙事，同时不在本节补入原文未重复的称谓。
- source_word: לִפְנֵיכֶם
  choice: 在你们前面
  rationale: 表达空间上的领先与引导；“在你们前面”自然清楚，也保留原文关系。
- source_word: בַּדֶּרֶךְ
  choice: 在路上
  rationale: דרך在此指旷野旅程所走的道路；“在路上”简洁贴近原文。
- source_word: לָתוּר
  choice: 寻找
  rationale: תור表示探寻、察看以找出合适地点。“寻找”符合现代汉语，不额外强化军事侦察色彩。
- source_word: מָקוֹם לַחֲנֹתְכֶם
  choice: 安营的地方
  rationale: 准确表达供百姓驻扎的地点；“安营”较“扎营”更庄重，也为普通读者所理解。
- source_word: בָּאֵשׁ לַיְלָה
  choice: 夜间在火中
  rationale: 保留原文“在火中”的表达及其与“白天在云中”的平行结构，不擅自补入“柱”。
- source_word: לַרְאֹתְכֶם
  choice: 指示你们
  rationale: ראה的Hiphil不定式具有使役义；在引路语境中译为“指示你们”比直译“使你们看见”自然。
- source_word: בַּדֶּרֶךְ אֲשֶׁר תֵּלְכוּ בָהּ
  choice: 当走的路
  rationale: 简洁呈现所指示的行进路线。“当”可表达语境中的预定或适宜路线，而不必将其限定为道德义务。
- source_word: וּבֶעָנָן יוֹמָם
  choice: 白天在云中
  rationale: 保留与“夜间在火中”的对应。上下文使“云”所指明确，但汉语无需加量词或重复说明云柱。
theological_decisions:
- issue: 本节主语与上节“耶和华你们的神”的衔接
  choice: 以“他”承接上文，不在本节重述“耶和华”
  alternative: 译作“耶和华走在你们前面”
  rationale: 希伯来文本以带定冠词的分词承接上一节，句法上依附前文；用“他”既使中文成句，又不额外重复神名。
- issue: “当走的路”所表达的情态
  choice: 保留可理解为应走或将走之路线的开放性
  alternative: 译作“你们将要走的路”或“你们应该走的路”
  rationale: 希伯来语未完成式在引导语境中可涉及未来或合宜路线；“当走”保持这种张力，避免只解作预告或道德命令。
- issue: 火与云的形态
  choice: 译为“在火中”“在云中”
  alternative: 明确译为“在火柱中”“在云柱中”
  rationale: 本节原文只写“火”和“云”。虽可由旷野传统理解为火柱、云柱，正文不补入“柱”可更忠实于本节措辞。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。分号呈现三个相连的引导行动，并突出“夜间在火中／白天在云中”的平行。所有脚注标记均已置于正文。
