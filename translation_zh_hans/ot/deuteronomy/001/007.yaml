base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/007.yaml
  text: Turn and set out for yourselves[a], and go to the hill country of the Amorites and to all their neighbors in the Arabah, in the hill country, in the lowland, in the Negev, and on the coast of the sea—the land of the Canaanites—and Lebanon, as far as the great river, the Euphrates River.
translation:
  language: zh_hans
  text: 你们要转身，起程前往亚摩利人的山地，以及所有相邻之地：亚拉巴、山地、低地[a]、南地和海岸地带，迦南人的地和黎巴嫩，直到那条大河，就是幼发拉底河。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “低地”也可译作“示非拉”，即西部的山麓低地地区。
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּנוּ וּסְעוּ לָכֶם
  choice: 你们要转身启程
  rationale: פְּנוּ 表示改变方向；נסע 在行旅语境中指拔营出发。לָכֶם 在此属惯用与格，不宜生硬译作“为自己”。
- source_word: וּבֹאוּ
  choice: 往……去
  rationale: בוא 可表示来、去或进入；在连续的行进命令中，汉语以“往……去”自然表达朝目的地前行。
- source_word: הַר הָאֱמֹרִי
  choice: 亚摩利人的山地
  rationale: הַר 在此指山地地区而非单独一座山；族称按集合意义译为复数领属。
- source_word: וְאֶל כָּל שְׁכֵנָיו
  choice: 和四周所有地区
  rationale: 字面为“及其所有邻近者”。所指可能是邻近的地区或居民；结合后续地理分区，以“地区”表达较自然，同时不将其限定为特定族群。
- source_word: בָּעֲרָבָה
  choice: 亚拉巴
  rationale: 这是约旦裂谷地带的地理名称，音译比泛译为“平原”更准确。
- source_word: בָהָר
  choice: 山地
  rationale: 指高地地形区，不是某座特定山峰。
- source_word: וּבַשְּׁפֵלָה
  choice: 低地
  rationale: שְׁפֵלָה 指西部山麓低地；正文采用普通读者易懂的“低地”，并以脚注保留专名译法。
- source_word: וּבַנֶּגֶב
  choice: 南地
  rationale: נֶגֶב 既可指“南方”，也可指特定南部地区；在地理区域列表中，“南地”兼顾专名色彩和可理解性。
- source_word: וּבְחוֹף הַיָּם
  choice: 沿海一带
  rationale: חוֹף 指海岸；“沿海一带”符合现代汉语地理表述。
- source_word: אֶרֶץ הַכְּנַעֲנִי
  choice: 迦南人的土地
  rationale: 迦南族称在希伯来文中为集合单数，汉语用“迦南人的土地”自然表达其领地。
- source_word: וְהַלְּבָנוֹן
  choice: 黎巴嫩
  rationale: 按现代汉语通行地名翻译；希伯来文定冠词不需另行体现。
- source_word: הַנָּהָר הַגָּדֹל נְהַר פְּרָת
  choice: 那条大河——幼发拉底河
  rationale: 保留原文先称“大河”、再以河名同位说明的结构。
