  text: וְ/אֶת הַ֠/חֲזִיר כִּֽי מַפְרִ֨יס פַּרְסָ֥ה הוּא֙ וְ/לֹ֣א גֵרָ֔ה טָמֵ֥א ה֖וּא לָ/כֶ֑ם מִ/בְּשָׂרָ/ם֙ לֹ֣א תֹאכֵ֔לוּ וּ/בְ/נִבְלָתָ֖/ם לֹ֥א תִגָּֽעוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/008.yaml
  text: And the pig[a], because it has a split hoof but does not chew the cud, is unclean for you. You shall not eat any of its flesh[b], and you shall not touch its carcass.
translation:
  language: zh_hans
  text: 至于猪，它有分蹄，却不反刍，所以对你们是不洁净的。你们不可吃它们的肉，也不可触摸它们的尸体。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文先用单数说“猪”，随后说“它们的肉”和“它们的尸体”，转而泛指这一类动物。
    reason: 说明希伯来文由单数名词转用复数后缀，避免读者误以为指代不明。
lexical_decisions:
- source_word: הַחֲזִיר
  choice: 猪
  rationale: 现代汉语中对这种动物最清楚、自然的通称，无须采用较古雅或带贬义的说法。
- source_word: מַפְרִיס פַּרְסָה
  choice: 有分开的蹄
  rationale: 直接表达蹄分开的形态，也与本章所列洁净动物的判定标准相衔接。
- source_word: גֵרָה
  choice: 反刍
  rationale: 这是现代汉语中准确而简洁的动物学常用语，对应把食物返入口中再咀嚼的行为。
- source_word: טָמֵא
  choice: 不洁净
  rationale: 保留律法中关于礼仪和饮食类别的专门含义，不把它扩大解释为道德上的邪恶。
- source_word: מִבְּשָׂרָם
  choice: 它们的肉
  rationale: 保留原文复数后缀，反映叙述由单数的猪转向这一类动物；“肉”在现代汉语中自然明确。
- source_word: נִבְלָתָם
  choice: 它们的尸体
  rationale: 保留原文复数后缀，并准确表达动物死后的躯体。
- source_word: תִגָּעוּ
  choice: 触摸
  rationale: 直接保留原文命令的范围和力度，不扩展成“接近”或缩窄成“搬动”。
theological_decisions:
- issue: 律法饮食条例中“不洁净”的性质
  choice: 译为“不洁净”，不附加后来的神学解释
  alternative: 不纯洁；污秽
  rationale: 本节陈述的是盟约群体中的饮食和礼仪类别，并未直接把这种动物定性为道德上的邪恶。
- issue: 不可触摸尸体这一禁令的力度
  choice: 直译为“不可触摸”
  alternative: 不可搬动；不可接近
  rationale: 原文 נגע 的通常含义是“触摸”，应保留直接禁令，既不扩大也不缩小。
- issue: 单数动物与复数后缀的转换
  choice: 正文保留“它们的肉／它们的尸体”
  alternative: 它的肉／它的尸体
  rationale: 希伯来文先用单数指猪，随后两处使用复数后缀。保留这一转换，避免默默抹平原文将个体视为一类动物的表达。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“至于猪”承接动物分类条文；“虽……却……”自然呈现它符合一项标准、却不符合另一项标准的对照。正文保留原文单复数转换，并以脚注简要说明。
