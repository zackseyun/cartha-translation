lexical_decisions:
- source_word: וְאֵת
  choice: 以及
  rationale: וְ承接前面的禁食鸟类清单；אֵת是宾语标记，在中文中无需另译。用“以及”自然连接本项与上文。
- source_word: כָּל
  choice: 各
  rationale: כָּל与单数集合名词连用，在法规清单中涵盖整个类别；结合后面的分类短语，译作“各”简洁自然。
- source_word: עֹרֵב
  choice: 乌鸦
  rationale: עֹרֵב可泛指鸦科中的乌鸦或渡鸦；现代汉语以“乌鸦”为较通俗、概括性较强的名称，同时用脚注保留“渡鸦”的可能。
- source_word: לְמִינוֹ
  choice: 各类
  rationale: 该短语按种类扩展所指范围。译作“各类”符合现代汉语清单表达，并保留分类含义。
