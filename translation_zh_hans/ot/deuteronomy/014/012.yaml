base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/012.yaml
  text: 'And these are the ones that you shall not eat from among them: the eagle[a], the bearded vulture, and the black vulture.'
translation:
  language: zh_hans
  text: 以下这些鸟，你们不可吃：鹰[a]、胡兀鹫和黑兀鹫。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节几个希伯来鸟名所指的具体鸟种并不确定。“鹰”也可能指一种大型兀鹫；“胡兀鹫”传统上指善于摔骨取食的猛禽；“黑兀鹫”也有译作“鹗”或“海雕”的。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֶה
  choice: 以下这些鸟
  rationale: 原文形式为单数“这”，但用于引出随后列举的多项；结合上文鸟类语境，用“以下这些鸟”自然表达其篇章功能。
- source_word: אֲשֶׁר לֹא תֹאכְלוּ מֵהֶם
  choice: 你们不可吃
  rationale: 保留对复数听众的直接禁令；מִן在此有从前述鸟类中选出的部分义，中文由“以下这些鸟”及列举关系自然体现，无须生硬译作“从它们中”。
- source_word: הַנֶּשֶׁר
  choice: 鹰
  rationale: 采用传统且普通读者熟悉的对应词；该希伯来鸟名也可能指大型兀鹫，因此以脚注保留物种鉴定的不确定性。
- source_word: הַפֶּרֶס
  choice: 胡兀鹫
  rationale: 该词通常被理解为会摔骨取食的猛禽，即胡兀鹫；此名称比音译或古旧称谓更明确、现代。
- source_word: הָעָזְנִיָּה
  choice: 黑兀鹫
  rationale: 采用现代研究中常见的物种对应，但原词所指不能确定，其他可能译法在脚注中说明。
theological_decisions: []
