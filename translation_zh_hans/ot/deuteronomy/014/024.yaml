  text: וְ/כִֽי יִרְבֶּ֨ה מִמְּ/ךָ֜ הַ/דֶּ֗רֶךְ כִּ֣י לֹ֣א תוּכַ֘ל שְׂאֵת/וֹ֒ כִּֽי יִרְחַ֤ק מִמְּ/ךָ֙ הַ/מָּק֔וֹם אֲשֶׁ֤ר יִבְחַר֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ לָ/שׂ֥וּם שְׁמ֖/וֹ שָׁ֑ם כִּ֥י יְבָרֶכְ/ךָ֖ יְהוָ֥ה אֱלֹהֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/024.yaml
  text: And if the journey is too long for you[a], so that you are not able to carry it, because the place that Yahweh your God will choose to put his name there is too far from you, when Yahweh your God blesses you,
translation:
  language: zh_hans
  text: 如果路程对你来说太远，以致你不能带着它去；又因为雅威你的上帝所要选择、安放自己名的地方离你太远，当雅威你的上帝赐福给你时，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכִי
  choice: 如果
  rationale: 这里承接上文，引出一种条件情形；汉语用“如果”已能自然表达连接和条件关系。
- source_word: יִרְבֶּה מִמְּךָ הַדֶּרֶךְ
  choice: 路程对你来说太远
  rationale: 希伯来语直译近于“道路大过你”，实际指路途远到当事人难以应付；“太远”符合现代汉语习惯。
- source_word: לֹא תוּכַל שְׂאֵתוֹ
  choice: 你无法把它带去
  rationale: נשא 在上下文中指携带前文所说的出产或什一奉献；“带去”既保留实际搬运之意，也明确其目的地导向。
- source_word: יִרְחַק מִמְּךָ הַמָּקוֹם
  choice: 地方离你太远
  rationale: 保留“那地方”的空间意义，并以自然汉语表达距离超过可承受范围。
- source_word: אֲשֶׁר יִבְחַר יְהוָה אֱלֹהֶיךָ
  choice: 雅威你的上帝要选择
  rationale: 未完成式在此律法语境中指将来的选择，故译作“要选择”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译直接呈现四字神名，区别于作为称号的“主”。
- source_word: לָשׂוּם שְׁמוֹ שָׁם
  choice: 立他名
  rationale: 保留申命记中关于上帝把自己的名设于所选之地的特有表达；“立他名”简洁、庄重，且不额外解释其神学含义。
- source_word: כִּי יְבָרֶכְךָ יְהוָה אֱלֹהֶיךָ
  choice: 而雅威你的上帝又赐福给你
  rationale: 末尾 כִּי 可表示原因，也可表示时间或情境。正文以“而……又”呈现导致携带困难的丰盛背景，脚注保留“因为”这一明确的因果读法。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较直接地按学界通常重构的读音音译，同时不以“主”这一称号替代神名。
- issue: “立他名”所表达的临在
  choice: 保留“立他名”的原文措辞
  alternative: 使他的名居住在那里
  rationale: 原文使用 שׂום（放置、设立），没有在本节明说“居住”；直译式表达可避免把相关神学含义提前解释进正文。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。保留本节未完的条件句结构，并以句末逗号衔接下一节；“它”承接上文所说要带去的什一奉献。
