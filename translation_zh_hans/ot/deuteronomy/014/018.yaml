  text: the stork[a], and the heron according to its kind, and the hoopoe[c][b], and the bat.
translation:
  language: zh_hans
  text: 鹳[a]、各类鹭鸟[b]、戴胜[c]和蝙蝠。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“鹭”；本节若干鸟名的确切所指不能完全确定。
    reason: lexical_alternative
  - marker: b
    text: “鹭鸟”也可能指朱鹭或鸻一类的鸟。
    reason: lexical_alternative
  - marker: c
    text: 有些较早的译本采用其他鸟名；这里的希伯来词更可能指戴胜。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֲסִידָה
  choice: 鹳
  rationale: 该词通常被认定为鹳，既符合传统理解，也最可能对应此处所指的鸟类；但具体鉴定仍有不确定性，故加脚注说明。
- source_word: הָאֲנָפָה
  choice: 鹭鸟
  rationale: 该鸟名的确切所指不明；译作较宽泛的“鹭鸟”，既符合常见鉴定，也与随后表示类别范围的 לְמִינָהּ 相称。
- source_word: לְמִינָהּ
  choice: 各类
  rationale: 该固定表达表示按其种类或类别；与“鹭鸟”组合译为“各类鹭鸟”，在现代汉语中自然，也保留类别扩展的含义。
- source_word: הַדּוּכִיפַת
  choice: 戴胜
  rationale: 现代词典和动物鉴定通常认为该希伯来鸟名指戴胜；这比受较早翻译传统影响的其他鸟名更符合原文证据。
- source_word: הָעֲטַלֵּף
  choice: 蝙蝠
  rationale: 该词明确指蝙蝠。虽然现代分类学不把蝙蝠归为鸟类，本段按飞行动物列举，故直接译出，不作分类学修正。
