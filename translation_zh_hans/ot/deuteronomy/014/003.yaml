  text: You shall not eat any detestable thing[a].
translation:
  language: zh_hans
  text: 你不可吃任何可憎之物[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“任何令人厌恶的东西”。希伯来语这个词指可憎、可厌弃之物；本节以此引出下文所列禁止食用之物。
    reason: 提供词义替代译法，并说明该词在当前饮食条例语境中的作用，同时不将其含义限于一般的感官厌恶。
lexical_decisions:
- source_word: לֹא תֹאכַל
  choice: 你都不可吃
  rationale: לֹא加未完成式第二人称阳性单数，在律法语境中表达直接禁令。“不可吃”准确传达禁止意味；配合前置的“凡……之物”和“都”，使现代汉语自然，并保留禁令涵盖无遗的语气。
- source_word: כָּל
  choice: 凡……都
  rationale: כָּל修饰单数名词，并处于否定禁令之下，表示任何一个都不例外。汉语用“凡……都不可”比逐字译作“所有”更自然，也保留其周延范围。
- source_word: תּוֹעֵבָה
  choice: 可憎之物
  rationale: 该名词指令人憎恶、应当厌弃之物，也可用于礼仪或道德上被视为不合宜的事物。本节以此引出随后所列禁食之物；“可憎之物”保留原词的强烈负面色彩，又不把含义缩减为个人感官上的厌恶。
theological_decisions:
- issue: 盟约律法中本句的语气
  choice: 译为直接禁令：“凡可憎之物，你都不可吃。”
  alternative: 译为一般陈述：“你不吃任何可憎之物。”
  rationale: 希伯来文לֹא与未完成式动词在本段律法语境中具有禁止效力。译作“不可”保留其规范性，而不额外加入超出经文的神学解释。
- issue: “可憎之物”在本节中的范围
  choice: 保留概括性措辞，由下文的食物条例具体说明
  alternative: 直接释义为“礼仪上不洁净的食物”
  rationale: 原文使用概括性的תּוֹעֵבָה，并未在本句内明说“不洁净”或“食物种类”。保留这一措辞，既承接饮食语境，也避免把下文解释提前写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的律法语体。将宾语前置为“凡可憎之物”，再用“都不可吃”，符合自然汉语表达，并突出禁令无一例外的范围。
