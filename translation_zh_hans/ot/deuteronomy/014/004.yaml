  yaml_path: translation/ot/deuteronomy/014/004.yaml
  text: 'These are the animals that you may eat: the ox[a], the sheep, and the goat.'
translation:
  language: zh_hans
  text: 你们可以吃的牲畜有：牛、绵羊和山羊。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“这是你们可以吃的牲畜”，以单数形式引出一个集合类别，然后列举其中的种类。
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת הַבְּהֵמָה
  choice: 牲畜有
  rationale: 原文用阴性单数指示词和单数名词引出一个集合类别，随后列举牛、绵羊和山羊。汉语用“牲畜有”自然地表达这种总称兼列举结构。此处所列都是家畜，因此“牲畜”比宽泛的“动物”更贴合语境。
- source_word: אֲשֶׁר תֹּאכֵלוּ
  choice: 你们可以吃的
  rationale: 该关系从句界定获准食用的牲畜；“可以吃”清楚表达许可，不把它误解为必须食用的命令。
- source_word: שׁוֹר
  choice: 牛
  rationale: 该词指牛类牲畜；汉语“牛”既自然又不额外限定性别或用途，比“公牛”或“阉牛”更稳妥。
- source_word: שֵׂה כְשָׂבִים
  choice: 绵羊
  rationale: שֵׂה 指羊群中的一只牲畜，后面的 כְשָׂבִים 将其具体说明为绵羊类；“绵羊”保留与下文山羊的类别对照，也不增添年龄限定。
- source_word: וְשֵׂה עִזִּים
  choice: 和山羊
  rationale: 该短语与前项平行，指山羊类中的牲畜；“山羊”是现代汉语自然的类别名称，不误译为特指幼小的“山羊羔”。
