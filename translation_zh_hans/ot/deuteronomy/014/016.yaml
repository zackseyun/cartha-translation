  text: the little owl[a], the great owl, and the white owl;
translation:
  language: zh_hans
  text: 小鸮[a]、大鸮和白鸮；
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这些鸟名所指的确切种类不能确定。古今译本的译法各不相同，常将它们译作不同种类的鸮。
    reason: 词义与物种辨识存在不确定性
lexical_decisions:
- source_word: כּוֹס
  choice: 小鸮
  rationale: 在这份不洁净鸟类清单中，指某种鸮类；具体物种无法确定。“小鸮”沿用较常见的辨识，同时与后两种鸟名保持区别。
- source_word: יַנְשׁוּף
  choice: 大鸮
  rationale: 在此鸟类清单中，传统上多理解为某种夜行鸮类。“大鸮”既保留与前后词项的区别，也不把物种判断说得过于确定。
- source_word: תִּנְשָׁמֶת
  choice: 白鸮
  rationale: 该词在这里指鸟类，较可能是某种鸮类；“白鸮”是传统译法，可与前两项区分，但确切物种仍不明确。
- source_word: אֶת
  choice: 不另译
  rationale: 这是希伯来语的直接宾语标记，现代汉语没有对应的独立词语。
- source_word: וְ
  choice: 、／和
  rationale: 连接清单中的并列项目；按现代汉语列举习惯，前一处用顿号，最后一处译作“和”。
- source_word: הַ
  choice: 不另译
  rationale: 定冠词在此把各鸟名作为清单中的类别提出；现代汉语无需逐项译出。
