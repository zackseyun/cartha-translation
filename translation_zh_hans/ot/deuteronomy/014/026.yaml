  to: 你要用这银子[a]购买你心里渴望的任何东西[b]：牛、羊、酒、烈性饮料[c]，或任何你心里所求的东西。你要在那里，在雅威——你的上帝——面前吃，并且欢喜快乐；你和你的全家都要如此。
