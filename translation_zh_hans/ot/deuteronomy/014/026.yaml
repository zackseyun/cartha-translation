source:
  edition: WLC
  text: וְ/נָתַתָּ֣ה הַ/כֶּ֡סֶף בְּ/כֹל֩ אֲשֶׁר תְּאַוֶּ֨ה נַפְשְׁ/ךָ֜ בַּ/בָּקָ֣ר וּ/בַ/צֹּ֗אן וּ/בַ/יַּ֨יִן֙ וּ/בַ/שֵּׁכָ֔ר וּ/בְ/כֹ֛ל אֲשֶׁ֥ר תִּֽשְׁאָלְ/ךָ֖ נַפְשֶׁ֑/ךָ וְ/אָכַ֣לְתָּ שָּׁ֗ם לִ/פְנֵי֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ וְ/שָׂמַחְתָּ֖ אַתָּ֥ה וּ/בֵיתֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/026.yaml
  text: 'and spend the silver on whatever your appetite desires: cattle[a], sheep, wine, strong drink, or whatever your appetite asks for. And you shall eat there before Yahweh your God and rejoice[c][b], you and your household.'
translation:
  language: zh_hans
  text: 你要用这银子[a]购买你心里渴望的任何东西[b]：牛、羊、酒、烈性饮料[c]，或任何你心里所求的东西。你要在那里，在雅威——你的上帝——面前吃，并且欢喜快乐；你和你的全家都要如此。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “银子”在这里指钱。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“你的生命（或灵魂）所渴望的……你的生命（或灵魂）所求的”。这里指人的欲求；在饮食语境中也可包含食欲。
    reason: lexical_alternative
  - marker: c
    text: “烈性饮料”指葡萄酒以外能使人醉的饮料，不一定是现代意义上的蒸馏烈酒。
    reason: cultural_note
lexical_decisions:
- source_word: וְנָתַתָּה הַכֶּסֶף
  choice: 用这银子买
  rationale: 动词字面为“给出”，但在以银钱换取节庆用品的语境中表示花费、购买；保留“银子”以反映原文，同时中文读者可自然理解为钱。
- source_word: תְּאַוֶּה נַפְשְׁךָ
  choice: 你心里渴望的
  rationale: נֶפֶשׁ在这里指整个人内在的欲求，而非专指非物质的“灵魂”；“心里渴望”既自然，也保留了原文以内在自我为欲望主体的表达。
- source_word: בַּבָּקָר וּבַצֹּאן
  choice: 牛、羊
  rationale: בָּקָר是牛类牲畜的集合称谓；צֹאן可泛指羊群，包括绵羊和山羊。正文采用简洁常用的“牛、羊”，不在此处过度细分。
- source_word: וּבַיַּיִן וּבַשֵּׁכָר
  choice: 酒、烈性饮料
  rationale: יַיִן通常指葡萄酒；שֵׁכָר指有致醉作用、但不同于葡萄酒的发酵饮料。“烈性饮料”保留两者区别，脚注说明它不必然指现代蒸馏酒。
- source_word: תִּשְׁאָלְךָ נַפְשֶׁךָ
  choice: 你心里所求的
  rationale: 保留שׁאל“求、索求”的意象，并与前一句“心里渴望”形成原文所有的近义变化。
- source_word: לִפְנֵי יְהוָה אֱלֹהֶיךָ
  choice: 在耶和华你上帝面前
  rationale: לִפְנֵי直译为“在……面前”，表达在上帝临在中守节；神名יהוה音译为“耶和华”，不以称号替代。
- source_word: וְשָׂמַחְתָּ אַתָּה וּבֵיתֶךָ
  choice: 你和你家里的人都要欢喜快乐
  rationale: בֵּיתֶךָ在此指家中成员而非建筑；“欢喜快乐”传达节庆敬拜中的喜乐语气。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 正文直接出现四字神名，采用现代简体中文圣经语境中最广为人知的专名“耶和华”，既表明这是名字，也避免用一般称号消解原文。
- issue: 是否淡化酒精饮料
  choice: 酒、烈性饮料
  alternative: 酒、发酵饮料
  rationale: 原文明说יַיִן与שֵׁכָר两类可致醉饮品。译文不因神学立场淡化这一点，同时借脚注避免把שֵׁכָר误解为必然经过蒸馏的现代烈酒。
- issue: נֶפֶשׁ在欲望表达中的理解
  choice: 心里
  alternative: 灵魂；胃口
  rationale: 这里的נֶפֶשׁ表示人的内在欲求，在饮食语境中也带有食欲意味；“心里”不把它限定为非物质灵魂，也不把范围缩窄为单纯胃口。
translation_notes:
  register: 采用庄重而易懂的现代标准普通话。“无论是……还是……”使清单关系清楚；末句保留原文由个人扩及全家的喜乐。正文不加“喝”字，因为希伯来文此处只明说“吃”，尽管所购买之物包括饮品。
