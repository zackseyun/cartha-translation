  text: the ostrich[a], the hawk, the gull, and the falcon according to its kind[b],
translation:
  language: zh_hans
  text: 鸵鸟[a]、鹰、海鸥、隼及其类[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语直译为“鸵鸟之女”，这是表示鸵鸟这一物种的惯用名称。
    reason: cultural_note
  - marker: b
    text: 本节几种鸟的确切辨识并无定论。译作“鹰”的 תַּחְמָס 也可理解为“鸮”或另一种鸟；译作“海鸥”的 שָׁחַף 也曾译为“杜鹃”；译作“隼”的 נֵץ 也可译为“鹰”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּת הַיַּעֲנָה
  choice: 鸵鸟
  rationale: 该词组直译为“鸵鸟之女”，在动物名录中是指鸵鸟的惯用物种名称；译作“鸵鸟”比保留希伯来语字面结构更符合现代汉语。
- source_word: הַתַּחְמָס
  choice: 鹰
  rationale: 这种鸟的确切所指不明；“鹰”可表达其可能属于猛禽的含义，但“鸮”或其他鸟类也有词典与译本依据，因此在脚注中保留不确定性。
- source_word: הַשָּׁחַף
  choice: 海鸥
  rationale: 该鸟名的辨识并不确定；现代词典多倾向于海鸥或类似海鸟，旧译所采用的“杜鹃”等可能性则列入脚注。
- source_word: הַנֵּץ
  choice: 隼
  rationale: 该词指一种猛禽，可译为“鹰”或“隼”；此处采用“隼”，既符合其大致语义，也避免与同一节中的 תַּחְמָס 使用同一名称。
- source_word: לְמִינֵהוּ
  choice: 各从其类
  rationale: 这是希伯来语动物分类的固定表达，指该鸟及其所属的各类；“各从其类”简洁、庄重，也贴近原文。
