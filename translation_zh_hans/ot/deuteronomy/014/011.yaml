  yaml_path: translation/ot/deuteronomy/014/011.yaml
  text: You may eat any clean bird[a].
translation:
  language: zh_hans
  text: 凡洁净的鸟，你们都可以吃[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 较为直译：“所有洁净的鸟，你们都可以吃。”
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל
  choice: 凡……都
  rationale: 该量词表示范围完整、无遗漏。现代汉语用“凡……都”自然表达在“洁净的鸟”这一类别内不受限制的许可，同时保留希伯来文的概括性。
- source_word: צִפּוֹר
  choice: 鸟
  rationale: 该名词通常指鸟类；在饮食条例的语境中，“鸟”准确、自然，无须扩大为泛指一切会飞的生物。
- source_word: טְהֹרָה
  choice: 洁净的
  rationale: 这里是饮食律例中的礼仪分类术语，指可食用类别；“洁净的”比抽象的“纯洁的”更符合上下文。
- source_word: תֹּאכֵלוּ
  choice: 你们都可以吃
  rationale: 第二人称复数未完成式在本段律法语境中表达许可。“可以吃”清楚传达准许，而不是把话误解为必须吃的命令；“你们”保留复数人称。
