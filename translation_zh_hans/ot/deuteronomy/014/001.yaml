base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/001.yaml
  text: You are sons of Yahweh your God[a]. Do not cut yourselves[b], and do not make a bald spot between your eyes for the dead.
translation:
  language: zh_hans
  text: 你们是雅威——你们的上帝——的儿子[a]。不可割伤自己，也不可为死人在两眼之间剃出秃斑[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“儿女”。希伯来语为阳性复数，直译是“儿子”。
    reason: lexical_alternative
  - marker: b
    text: “两眼之间”指前额部位。
    reason: lexical_clarification
lexical_decisions:
- source_word: בָּנִים
  choice: 儿子
  rationale: 原文为阳性复数，直译为“儿子”。正文保留其性别形式，同时以脚注说明在此可统指上帝圣约群体中的儿女。
- source_word: לַיהוָה אֱלֹהֵיכֶם
  choice: 你们的上帝雅威的
  rationale: 介词 לַ 在这里表达归属或关系；调整汉语词序，将“雅威”置于“你们的上帝”之后作同位语，既自然又保留上帝的圣约之名。
- source_word: תִתְגֹּדְדוּ
  choice: 割伤自己
  rationale: 反身形式指因哀悼或宗教仪式而在自己身上割出伤口；“割伤自己”清楚、自然，并保留行为的具体性。
- source_word: קָרְחָה
  choice: 剃出秃斑
  rationale: 该词指刻意剃成的一块秃处，而非自然秃发；“剃出秃斑”准确呈现这里的丧葬习俗。
- source_word: בֵּין עֵינֵיכֶם
  choice: 在两眼之间
  rationale: 保留希伯来语的身体部位表达；其实际所指为前额区域，另以脚注说明。
- source_word: לָמֵת
  choice: 为死人
  rationale: 表示因死人而进行哀悼；“为死人”简洁地保留了原文与丧葬行为的关联。
theological_decisions:
- issue: 圣约身份称谓的性别形式
  choice: 儿子
  alternative: 儿女
  rationale: 希伯来语使用阳性复数 בָּנִים。正文保留“儿子”，不把源文本的形式无声中性化；脚注列出在群体意义上可译作“儿女”。
- issue: 神圣之名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名。采用较贴近学界通常重构读音的“雅威”，以专名呈现；“耶和华”是汉语传统译名，但并非同一读音重构。
- issue: 禁令与哀悼对象的关系
  choice: 两项禁令均由“为死人”修饰
  alternative: 仅将“为死人”直接连接第二项禁令
  rationale: 原文在句末给出 לָמֵת，语义上自然涵盖前面的割伤和剃秃两种哀悼行为；汉语将其前置，使共同修饰关系清楚，而不改变禁令内容。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“不可”保持律法禁令的正式语气；“割伤自己”和“剃出秃斑”则使用普通读者容易理解的具体表达。
