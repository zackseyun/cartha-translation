  text: 鹈鹕[a]、食腐秃鹫[b]和鸬鹚[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节几个希伯来语鸟名所指的确切鸟种都不确定。“鹈鹕”也可译作“荒漠鸮”或泛称“鸮”。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“秃鹫”；较早的英语译本作“gier eagle”（现已过时的英语鸟名）。
    reason: lexical_alternative
  - marker: c
    text: 这个希伯来语词也可能指另一种水鸟，如鹈鹕或渔鸮。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקָּאָת
  choice: 鹈鹕
  rationale: 这种鸟的确切所指不确定；“鹈鹕”是传统且常见的译法，也符合本节鸟类清单的语境。其他可能释义收入脚注。
- source_word: הָרָחָמָה
  choice: 食腐秃鹫
  rationale: 该词大概指一种猛禽或食腐鸟。“食腐秃鹫”以现代汉语表达其可能特征，同时避免使用陈旧或物种指向不清的名称。
- source_word: הַשָּׁלָךְ
  choice: 鸬鹚
  rationale: 该词所指的确切鸟种有争议；“鸬鹚”是常见译法，也符合捕鱼水鸟这一可能含义。其他解释收入脚注。
- source_word: וְ / וְאֶת
  choice: 、/ 和；אֵת不另译
  rationale: 希伯来语连词在汉语列举中自然处理为顿号及末项前的“和”；直接宾语标记אֵת在汉语中无须对应翻译。
