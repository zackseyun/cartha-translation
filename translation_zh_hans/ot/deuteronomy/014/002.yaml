    reason: 说明 סְגֻלָּה 可突出“特别珍爱的产业”这一所有物意象，同时保留原文 עַם“子民”的明确表达。
  revision_rationale: 修订仅改善中文句法和惯用表达，并使脚注更完整地交代关键词的词义范围；不改变原文的拣选、归属、圣洁或“从万民中”选出的意义。
