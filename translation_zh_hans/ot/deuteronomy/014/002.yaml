base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/002.yaml
  text: For you are a holy people to Yahweh your God[a], and Yahweh has chosen you to be a treasured people for himself out of all the peoples who are on the face of the earth.
translation:
  language: zh_hans
  text: 因为你是归耶和华你神的圣洁子民；耶和华从地上的万民中拣选了你，使你作他所珍爱的子民[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译作“作他特别珍爱的产业”；原文也明说“子民”。希伯来语“סְגֻלָּה”指特别珍视、专属的财物或产业。
    reason: 说明 סְגֻלָּה 可突出“特别珍爱的产业”这一所有物意象，同时保留原文 עַם“子民”的明确表达。
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，为此前禁令说明理由；“因为”自然保留了解释性的因果关系。
- source_word: עַם קָדוֹשׁ
  choice: 为圣的子民
  rationale: 表达这群子民被分别、归于神的圣洁身份；“为圣”既保留神学含义，也符合现代汉语圣经语体。
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: 归耶和华你神
  rationale: 介词 ל 在此表达归属和关系；“归……为圣”比生硬直译“向……”更准确自然。
- source_word: וּבְךָ בָּחַר יְהוָה
  choice: 耶和华……拣选了你
  rationale: בחר 与 ב 构成“拣选某人”的惯用结构，汉语直接以“你”作宾语。
- source_word: לִהְיוֹת לוֹ
  choice: 使你作他……
  rationale: 表达拣选的目的或结果，并自然体现 לוֹ 所含“归他所有”的关系。
- source_word: לְעַם סְגֻלָּה
  choice: 他珍爱的子民
  rationale: 保留原文明确的 עַם“子民”，并以“珍爱”传达 סְגֻלָּה 所指特别珍视、专有的产业或珍宝。
- source_word: מִכֹּל הָעַמִּים
  choice: 从……万民中
  rationale: מן 表示从一个整体之中选出；此译不额外引入“高过万民”的优越含义。
- source_word: אֲשֶׁר עַל פְּנֵי הָאֲדָמָה
  choice: 地面上的
  rationale: 保留希伯来语常见的空间表达；在“万民”语境中指居住于全地的人群。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文读者熟悉的神圣四字名译法，明确保留盟约之名。
theological_decisions:
- issue: 以色列蒙拣选的性质
  choice: 译为神从万民中拣选这群子民，使他们归他为圣并成为他所珍爱的子民。
  alternative: 把 מִכֹּל 译成“高过万民”，或按后来的拣选教义加以发挥。
  rationale: 原文强调神主动的拣选、归属和珍爱，却没有在本节明确宣称民族本质上的优越，也没有展开后世的系统神学；译文保留这些张力而不作扩充。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“归……为圣”体现盟约归属；“珍爱的子民”避免生硬，同时以脚注保留 סְגֻלָּה 的产业意象。
