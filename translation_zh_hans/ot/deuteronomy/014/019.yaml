  text: וְ/כֹל֙ שֶׁ֣רֶץ הָ/ע֔וֹף טָמֵ֥א ה֖וּא לָ/כֶ֑ם לֹ֖א יֵאָכֵֽלוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/019.yaml
  text: And every swarming thing of the birds is unclean for you[a]; they shall not be eaten.
translation:
  language: zh_hans
  text: 凡飞行的群生之物[a]，对你们都是不洁净的；它们都不可食用。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“凡会飞的群生之物”或“凡有翅膀的群生之物”。希伯来语把“群生之物”（שֶׁרֶץ）与“飞行生物、飞禽”（עוֹף）连用；这组合很可能主要指会飞的昆虫，而不是通常意义上的鸟类。
    reason: 说明希伯来语组合的词义范围，并保留“飞行生物／飞禽”之间的歧义。
lexical_decisions:
- source_word: וְ/כֹל
  choice: 凡……都
  rationale: וְ承接上文；כֹל在此具有周遍、逐类涵盖的作用。汉语用“凡……都”自然表达这一范围，句首不另译“和”，以免生硬。
- source_word: שֶׁרֶץ
  choice: 群生小物
  rationale: שֶׁרֶץ指成群滋生、密集活动的小型生物。“群生小物”保留其群聚活动的特征，又避免“爬物”把范围误限于地面爬行者。
- source_word: הָ/עוֹף
  choice: 飞行的
  rationale: עוֹף可指飞禽，也可广指飞行生物；与שֶׁרֶץ连用时，很可能尤其指会飞的昆虫。“飞行的”既符合此处组合的语义，也不把所指过早限定为普通意义上的鸟或昆虫。
- source_word: טָמֵא הוּא לָ/כֶם
  choice: 对你们都是不洁净的
  rationale: טָמֵא是饮食及礼仪条例中的“不洁净”；לָכֶם保留为“对你们”，明确这是向以色列人规定的身份与关系范畴。“都是”也自然承接“凡”。
- source_word: לֹא יֵאָכֵלוּ
  choice: 它们不可食用
  rationale: 希伯来文为第三人称阳性复数的尼法勒式，表达“不得被吃”。“它们不可食用”保留复数照应和被动/许可取向，同时符合现代汉语法规语体。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的律法语体。“群生小物”略具书面色彩，但能比“爬物”更准确地涵盖会飞、成群活动的小型生物；分号保留原文由类别判定转入禁令的两段结构。
