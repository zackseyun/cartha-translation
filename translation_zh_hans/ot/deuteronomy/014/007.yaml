source:
  edition: WLC
  text: אַ֣ךְ אֶת זֶ֞ה לֹ֤א תֹֽאכְלוּ֙ מִ/מַּֽעֲלֵ֣י הַ/גֵּרָ֔ה וּ/מִ/מַּפְרִיסֵ֥י הַ/פַּרְסָ֖ה הַ/שְּׁסוּעָ֑ה אֶֽת הַ֠/גָּמָל וְ/אֶת הָ/אַרְנֶ֨בֶת וְ/אֶת הַ/שָּׁפָ֜ן כִּֽי מַעֲלֵ֧ה גֵרָ֣ה הֵ֗מָּה וּ/פַרְסָה֙ לֹ֣א הִפְרִ֔יסוּ טְמֵאִ֥ים הֵ֖ם לָ/כֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/007.yaml
  text: 'However[a], these you shall not eat from among those that chew the cud or from among those that have a divided hoof: the camel, the hare, and the rock badger; because they chew the cud but do not divide the hoof[b]. They are unclean for you.'
translation:
  language: zh_hans
  text: 不过，在反刍的或蹄分成两瓣的动物中，以下这些你们不可吃：骆驼、野兔[a]和蹄兔[b]；因为它们虽反刍，蹄却没有分成两瓣。它们对你们来说是不洁净的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“兔”。这里的希伯来语动物名称很可能指野兔，但确切的动物辨识仍有争议。
    reason: lexical_alternative
  - marker: b
    text: 即岩蹄兔，一种栖息于岩石间的小型哺乳动物。
    reason: lexical_clarification
lexical_decisions:
- source_word: אַךְ
  choice: 不过
  rationale: 承接第6节并引出例外，保留限制和转折语气，符合现代汉语表达。
- source_word: מִמַּעֲלֵי הַגֵּרָה
  choice: 在反刍的……动物中
  rationale: “反刍”是准确而通行的现代汉语动物学及日常用语，清楚表达希伯来语习语。
- source_word: וּמִמַּפְרִיסֵי הַפַּרְסָה הַשְּׁסוּעָה
  choice: 蹄分成两瓣的动物中
  rationale: 具体呈现蹄分裂的形态，也与后文的解释性分句保持一致；“两瓣”自然明白。
- source_word: הַגָּמָל
  choice: 骆驼
  rationale: 该动物名称的标准对应词。
- source_word: הָאַרְנֶבֶת
  choice: 野兔
  rationale: 最可能的动物辨识；具体物种仍有一定争议，因此附注说明也可译作“兔”。
- source_word: הַשָּׁפָן
  choice: 蹄兔
  rationale: 该词通常指蹄兔（hyrax）；采用现代汉语标准名称，避免按英语传统名称误译为獾类。
- source_word: כִּי מַעֲלֵה גֵרָה הֵמָּה וּפַרְסָה לֹא הִפְרִיסוּ
  choice: 因为它们虽反刍，蹄却没有分成两瓣
  rationale: “虽……却……”自然表达两项条件之间的对照；“没有分成两瓣”贴近希伯来语完成式所陈述的身体特征。
- source_word: טְמֵאִים הֵם לָכֶם
  choice: 它们对你们来说是不洁净的
  rationale: 保留“不洁净”这一圣经法律语汇及“对你们”的群体指向，不额外限定为礼仪性或宗教仪式性。
theological_decisions:
- issue: 饮食律例中“不洁净”的性质
  choice: 不洁净
  alternative: 礼仪上不洁净／仪式上不洁净
  rationale: 希伯来语 טָמֵא 在这里属于盟约法律中的洁净类别；正文保留较宽泛且透明的“不洁净”，避免加入原文未明说的神学分类。
- issue: 反刍与分蹄两项条件的关系
  choice: 保留“虽……却……”的对照
  alternative: 改写为现代动物学解释
  rationale: 经文按可观察特征说明这些动物为何被排除；翻译不以现代动物分类学消解或改写经文本身的表述。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“你们不可吃”保留法律命令语气；动物名称使用现代常用或规范名称。所有脚注标记均置于相应词语之后。
