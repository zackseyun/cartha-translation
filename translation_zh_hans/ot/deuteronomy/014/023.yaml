source:
  edition: WLC
  text: וְ/אָכַלְתָּ֞ לִ/פְנֵ֣י יְהוָ֣ה אֱלֹהֶ֗י/ךָ בַּ/מָּק֣וֹם אֲשֶׁר יִבְחַר֮ לְ/שַׁכֵּ֣ן שְׁמ֣/וֹ שָׁם֒ מַעְשַׂ֤ר דְּגָֽנְ/ךָ֙ תִּֽירֹשְׁ/ךָ֣ וְ/יִצְהָרֶ֔/ךָ וּ/בְכֹרֹ֥ת בְּקָרְ/ךָ֖ וְ/צֹאנֶ֑/ךָ לְמַ֣עַן תִּלְמַ֗ד לְ/יִרְאָ֛ה אֶת יְהוָ֥ה אֱלֹהֶ֖י/ךָ כָּל הַ/יָּמִֽים׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/023.yaml
  text: And you shall eat before Yahweh your God[a], in the place that he will choose for his name to dwell there, the tithe of your grain, your new wine, and your oil, and the firstborn of your herd and your flock, so that you may learn to fear Yahweh your God all your days.
translation:
  language: zh_hans
  text: 你要在耶和华你的上帝面前，在他所选择、要让自己的名居住在那里的地方[a]，吃你的五谷、新酒和油的十分之一，以及牛群和羊群中头生的，好让你学习终生敬畏耶和华你的上帝。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“使自己的名居住在那里”，或“把自己的名设立在那里”。希伯来语保留了耶和华使自己的名在所选圣所居住的惯用表达。
    reason: 说明使役形式及申命记圣所公式的可行译法，避免把其中的神学意象单一化。
lexical_decisions:
- source_word: וְאָכַלְתָּ
  choice: 你要……吃
  rationale: 连词加完成式在律法训示中带有指令和将来意味；“你要”自然保留其约束力。
- source_word: לִפְנֵי יְהוָה אֱלֹהֶיךָ
  choice: 在耶和华你的上帝面前
  rationale: לִפְנֵי 表示“在……面前／在……临在中”；此译既贴近原文，也适合敬拜语境。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文读者熟悉的神圣名号音译，而不以普通称号取代专名。
- source_word: בַּמָּקוֹם אֲשֶׁר יִבְחַר
  choice: 在他所选择……的地方
  rationale: 保留上帝亲自拣选敬拜地点的申命记惯用表达及其前瞻意味。
- source_word: לְשַׁכֵּן שְׁמוֹ שָׁם
  choice: 要让自己的名居住在那里
  rationale: 保留“名居住”的希伯来语意象，并以“让”反映使役形式，同时不把上帝的临在解释为受地点限制。
- source_word: מַעְשַׂר
  choice: 十分之一
  rationale: 准确表达献上第十份的制度；相比术语“十一奉献”，“十分之一”更直接，也避免引入后期宗教用语。
- source_word: דְּגָנְךָ תִּירֹשְׁךָ וְיִצְהָרֶךָ
  choice: 你的五谷、新酒和油
  rationale: “五谷”自然概括粮食作物；“新酒”保留 תִּירוֹשׁ 与一般酒类词语的区别；“油”保留农业三联语的简洁性。
- source_word: וּבְכֹרֹת בְּקָרְךָ וְצֹאנֶךָ
  choice: 以及牛群和羊群中头生的
  rationale: “头生的”准确指牲畜最先出生的后代；“牛群和羊群”以自然中文表达大小牲畜两类。
- source_word: לְמַעַן תִּלְמַד לְיִרְאָה
  choice: 好让你学习……敬畏
  rationale: 保留 לְמַעַן 的目的关系，也保留“学习敬畏”这一具有持续塑造意味的表达。
- source_word: כָּל הַיָּמִים
  choice: 终生
  rationale: 按此处修饰持续敬畏的语境，以自然中文表达“一切日子／所有的日子”。
theological_decisions:
- issue: 神圣名号 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: “耶和华”是现代中文圣经传统中广为人知的专名形式，能使读者辨认原文使用的是上帝的专名，而非普通称号。
- issue: 圣所公式 לְשַׁכֵּן שְׁמוֹ שָׁם 的理解
  choice: 要让自己的名居住在那里
  alternative: 把自己的名设立在那里
  rationale: 保留原文“名居住”的具体意象，以及上帝超越性与他在所选之地立约临在之间的张力；脚注列出另一种可行理解。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。句式尽量顺应中文信息次序，同时保留原文的律法语气、农业术语和“名居住”的圣所意象。
