- source_word: כָּל
  choice: 凡……都
  rationale: 表达该类别内无一例外的范围，也符合现代汉语法规语体。
- source_word: עוֹף
  choice: 鸟
  rationale: 该词可广指飞禽或有翼生物，但在本段饮食条例的直接上下文中具体指鸟类；译作“鸟”清楚自然。
- source_word: טָהוֹר
  choice: 洁净的
  rationale: 这里指饮食条例中的礼仪分类，而非一般意义上的道德纯洁或身体干净。
- source_word: תֹּאכֵלוּ
  choice: 可以吃
  rationale: 未完成式第二人称阳性复数在此法律对比语境中表示许可；“可以吃”比命令性的“要吃”更准确。
