lexical_decisions:
- source_word: הָרָאָה
  choice: 红鸢
  rationale: 该鸟名的确切所指不确定；“红鸢”符合不少现代词典将其视为鸢类、尤其是红鸢的判断，并以脚注保留不确定性。
- source_word: הָאַיָּה
  choice: 隼
  rationale: 该词指一种猛禽，常被理解为隼；如此也可在中文中与前后的鸢、鹞类名称相区别。
- source_word: הַדַּיָּה
  choice: 鹞
  rationale: 该词通常被视为鸢或鹞一类的猛禽；选用“鹞”既自然，也避免与הָרָאָה重复译为“鸢”，但确切物种仍不确定。
- source_word: לְמִינָהּ
  choice: 各类
  rationale: 希伯来语直译为“按其种类”，修饰最后一个鸟名；在名单中译作“各类鹞”简洁自然，并保留类别范围之意。
- source_word: וְאֶת
  choice: 、；以及
  rationale: וְ连接名单项目，אֶת是宾语标记，不单独翻译；中文以顿号和“以及”自然呈现并列关系。
