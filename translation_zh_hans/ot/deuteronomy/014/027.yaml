base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/027.yaml
  text: And you shall not neglect the Levite who is within your gates[c][b][a], because he has no portion or inheritance with you.
translation:
  language: zh_hans
  text: 至于住在你各城中的利未人，你不可撇下他[a]，因为他在你们中间没有份和产业[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “撇下”也可译作“不顾”或“离弃”；这里指不可任由利未人得不到照顾和供养。
    reason: lexical_alternative
  - marker: b
    text: 即利未人没有像以色列其他支派那样的土地产业份额。
    reason: cultural_note
lexical_decisions:
- source_word: וְהַלֵּוִי
  choice: 至于……利未人
  rationale: 定冠词单数在此代表利未群体中的成员。“利未人”准确而通行；不译作“利未祭司”，以免把所有利未人都说成祭司。句首连接词结合汉语语流译为“至于”。
- source_word: אֲשֶׁר בִּשְׁעָרֶיךָ
  choice: 住在你城中的
  rationale: 字面为“在你的城门内”，是指辖下城镇或本地社区的惯用表达。正文采用自然现代汉语“你城中”，不保留可能引起误解的城门意象。
- source_word: לֹא תַעַזְבֶנּוּ
  choice: 你不可撇下他
  rationale: עזב可表示离弃、撇下或不顾。这里涉及对利未人的供养责任，“撇下”既保留词义力度，也涵盖不加照顾之意；脚注说明可理解为不可不顾他。
- source_word: כִּי
  choice: 因为
  rationale: 引出命令的理由，现代汉语用“因为”清楚自然。
- source_word: אֵין לוֹ
  choice: 他……没有
  rationale: 把希伯来语存在句按自然汉语转为领有表达。
- source_word: חֵלֶק וְנַחֲלָה
  choice: 没有份，也没有产业
  rationale: חֵלֶק指所得的份，נַחֲלָה指承受的产业，尤其是土地产业。以“也”表达希伯来语连接词并保留两个相关概念的叠加强调。
- source_word: עִמָּךְ
  choice: 在你们中间
  rationale: 原文后缀为第二人称单数，指作为整体的以色列；中文以复数“你们”自然表达利未人在以色列各支派中没有同等土地份额。
theological_decisions:
- issue: 利未人所缺少之“份和产业”的性质
  choice: 指利未人在以色列中没有通常的支派土地份额
  alternative: 泛指利未人处于社会边缘，并不特指土地承受权
  rationale: 申命记语境中的“份和产业”与支派土地分配密切相关。正文保留“份”和“产业”的措辞，脚注简要说明其土地背景，不把更多神学解释加入经文。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“你城中”传达希伯来语“在你城门内”的城镇、社区含义；“撇下”保留原词的伦理力度；“份，也没有产业”维持原文并列结构及土地承受权的背景。所有脚注标记均置于正文相应位置。
