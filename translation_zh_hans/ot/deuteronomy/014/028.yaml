base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/028.yaml
  text: At the end of every three years[b][a], you shall bring out all the tithe of your produce in that year and lay it up within your gates.
translation:
  language: zh_hans
  text: 每三年期满时[a]，你要把那一年出产的全部十分之一拿出来，存放在你各城中[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“每第三年。”
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“在你的城门内”；这里指你所属的各城镇或当地社区。
    reason: cultural_note
lexical_decisions:
- source_word: מִקְצֵה שָׁלֹשׁ שָׁנִים
  choice: 每逢三年期满
  rationale: מִקְצֵה 表示到达一段时间的尽头；上下文表明这是周期性做法。“每逢三年期满”既保留时间终点，也自然表达反复施行的含义。
- source_word: תּוֹצִיא
  choice: 拿出来
  rationale: 使役形表达“使之出来”，这里指把十分之一的出产从原有存放处取出，供指定用途。
- source_word: כָּל מַעְשַׂר
  choice: 十分之一全部
  rationale: כָּל 强调整份应献的十分之一，译作“全部”清楚保留完整无缺之意。
- source_word: תְּבוּאָתְךָ
  choice: 你……出产的
  rationale: תְּבוּאָה 泛指土地的出产或收成；“出产”不把范围局限于谷物。
- source_word: בַּשָּׁנָה הַהִוא
  choice: 那一年
  rationale: 该短语限定有关年份的出产；中文放在“出产”之前，关系清楚自然。
- source_word: וְהִנַּחְתָּ
  choice: 存放
  rationale: 该使役动词表示放置、安放；结合三年什一奉献留在当地供使用的语境，“存放”比单纯“放下”更贴切。
- source_word: בִּשְׁעָרֶיךָ
  choice: 在你各城中
  rationale: 字面为“在你的城门内”，在申命记中常以城门代指所属的城镇或当地社区。正文采用现代中文可直接理解的惯用义，脚注保留希伯来文意象。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“每逢”表达周期性规定；“十分之一”沿用中文圣经语境中清楚且通俗的祭献用语。正文将“城门”这一转喻译出其实际所指，并以脚注保留原文形象。
