base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/025.yaml
  text: then you shall turn it into silver[a], bind the silver in your hand[b], and go to the place that Yahweh your God will choose.
translation:
  language: zh_hans
  text: 就要把它换成银子[a]，把银子包好拿在手中[b]，前往雅威你的上帝将要选择的地方。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“把它兑换成银子”或“把它换成钱”。原文直译为“银子”，在这里作为货币使用。
    reason: lexical_alternative
  - marker: b
    text: 或译：“把银子捆好拿在手中”，意思是为旅途把银子妥善收好、随身携带。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּה בַּכָּסֶף
  choice: 把它换成银子
  rationale: 该结构在上下文中指把不便携带的出产兑换为银子；译作“换成”清楚表达交易含义，同时保留כֶּסֶף的具体词义“银子”。
- source_word: וְצַרְתָּ הַכֶּסֶף בְּיָדְךָ
  choice: 把银子包好拿在手中
  rationale: צָרַר可指包裹、捆扎；“包好”自然表达为旅途妥善收存银子的动作，“拿在手中”则保留原文的具体意象。
- source_word: וְהָלַכְתָּ אֶל הַמָּקוֹם
  choice: 前往……地方
  rationale: הלך在此是普通的行进动词；“前往”符合现代中文法律训令的庄重语体。
- source_word: אֲשֶׁר יִבְחַר
  choice: 所选择的
  rationale: 希伯来语未完成式在此可有将来指向；中文定语结构不必强行标明时态，既自然，也保留语境所表达的选择。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以常见中文音译呈现四字神名，保留其作为以色列上帝专名的性质，而不以称号替代。
- source_word: אֱלֹהֶיךָ
  choice: 你上帝
  rationale: 按立约称谓直译第二人称单数领属形式；“雅威你上帝”保留原文紧密相连的称谓结构。
theological_decisions:
- issue: 四字神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用神名，因此采用音译“雅威”，不以称号替代；这也避免把文本本身未作的解释带入译文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“换成银子”兼顾原文具体用词和上下文中的货币功能；“包好拿在手中”保留动作及“手”的意象，又避免生硬的直译。
