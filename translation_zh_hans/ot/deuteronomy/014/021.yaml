base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/021.yaml
  text: You shall not eat any carcass[a]. You may give it to the sojourner who is within your gates, and he may eat it; or you may sell it to a foreigner. For you are a holy people to Yahweh your God[e][d][c][b]. You shall not boil a young goat in its mother's milk.
translation:
  language: zh_hans
  text: 任何自死的动物，你们都不可吃。[a]你可以把它给住在你城中的寄居者，让他吃；也可以卖给外族人。因为你是属于雅威——你的上帝——的圣洁子民。不可把山羊羔放在它母亲的奶里煮。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “自死的动物”也可译作“动物尸体”或“死去的动物”。这里指没有按规定方式宰杀的动物尸体。
    reason: lexical_alternative
  - marker: c
    text: “山羊羔”传统上也译作“山羊羔子”或“幼山羊”。
    reason: lexical_alternative
lexical_decisions:
- source_word: נְבֵלָה
  choice: 自死的牲畜
  rationale: 该词在本条食物律例中指未经许可方式宰杀、尤其自然死亡的动物尸体；“自死的牲畜”比单说“尸体”更清楚地表达禁食范围。
- source_word: גֵּר
  choice: 寄居者
  rationale: 指居住在以色列群体中、具有特定社会身份的非本族人；“寄居者”保留其法律与群体语境，并与后面的 נָכְרִי 区分。
- source_word: בִּשְׁעָרֶיךָ
  choice: 住在你城中的
  rationale: 字面为“在你城门内”；城门代指其所属城镇或社区。正文采用自然汉语表达其实际所指。
- source_word: תִּתְּנֶנָּה וַאֲכָלָהּ / מָכֹר
  choice: 可以把它给……吃，也可以卖
  rationale: 希伯来法律文体中的这些形式可表达指示或许可；本句重点是禁止以色列人食用，同时许可将其交给或卖给非以色列人，故以“可以”表达。
- source_word: נָכְרִי
  choice: 外族人
  rationale: 指不具备 גֵּר 那种本地寄居身份的外国人或外来者；“外族人”既自然，又能与“寄居者”保持区别。
- source_word: עַם קָדוֹשׁ
  choice: 为圣的子民
  rationale: 保留盟约语境中被分别、归属于上帝的含义；“为圣”比泛称“神圣”更贴合此处的关系性表达。
- source_word: לַיהוָה
  choice: 归雅威
  rationale: 介词 לְ 表达归属或奉献关系；专名 יהוה 音译为“雅威”，保留经文中的盟约之名。
- source_word: גְּדִי
  choice: 山羊羔
  rationale: 现代汉语中明确表示幼小的山羊，避免单用“羔”可能引起物种不明。
- source_word: תְבַשֵּׁל
  choice: 煮
  rationale: 该动词可指烹煮，此处与奶这一液体搭配，译作“煮”准确而自然。
- source_word: בַּחֲלֵב אִמּוֹ
  choice: 用……母亲的奶
  rationale: 介词 בְּ 在此可表达所处液体或烹煮媒介；中文用“用……奶煮”自然地保留具体禁令。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；音译“雅威”保留其作为专名的性质，不以称号替代。
- issue: 给予和出售自死牲畜之法律动词的语气
  choice: 许可式：“可以……也可以……”
  alternative: 命令式：“要给……要卖……”
  rationale: 上下文的法律功能是禁止以色列人食用，并准许对非以色列人作其他处置。许可式不把这种处置误解成必须履行的命令，同时脚注说明形式上的张力。
- issue: “圣”的关系含义
  choice: 归雅威……为圣
  alternative: 是雅威的神圣子民
  rationale: 此处“圣”既涉及分别为圣，也涉及归属；调整中文语序可明确表达“向雅威/属于雅威”的希伯来结构，而不额外界定其系统神学含义。
translation_notes:
  register: 采用现代、庄重而易懂的法律训诫语体。以“你们”承接复数禁令，随后按希伯来原文转为代表全体以色列的单数“你”；保留这种数的变化。对“城门内”采用正文意译、脚注保留字面形象；区分“寄居者”与“外族人”。
