  source_fidelity: 译文整体准确传达禁食尸体、可交予寄居者或售予外族人、以色列归属雅威而为圣，以及不可用母乳煮山羊羔等内容。修订将“给……吃”的施事关系说清，并以“放在……奶里煮”更直接对应 בַּחֲלֵב（在/以乳中）。
  naturalness: 原文“你可以把它给住在你城中的寄居者吃”在现代汉语中略有歧义，可能被理解为“你喂寄居者吃”。“你是归雅威你上帝为圣的子民”语序也不够自然。修订后保持庄重、清晰的法律语体。
  terminology: 保留“寄居者”与“外族人”的法律身份区别，保留神名“雅威”，并采用“圣洁子民”表达 עַם קָדוֹשׁ。将“山羊羔”保留为明确的现代用语。
  issues:
  - severity: medium
    issue: “把它给……寄居者吃”施事关系不明确。
    rationale: 希伯来文的意思是把尸体交给寄居者，由寄居者食用；汉语应加入“让他吃”以避免误读为以色列人喂对方吃。
  - severity: medium
    issue: “归雅威你上帝为圣的子民”语序生硬。
    rationale: 此处表达以色列作为归属于雅威、分别为圣的子民；“属于雅威——你的上帝——的圣洁子民”在现代汉语中更自然，且不改变含义。
  - severity: low
    issue: 末句“用山羊羔母亲的奶煮它”指代和介词关系可更贴近原文。
    rationale: “不可把山羊羔放在它母亲的奶里煮”明确“它”指山羊羔，并表达在母乳中煮的具体图像。
