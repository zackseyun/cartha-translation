  yaml_path: translation/ot/deuteronomy/014/009.yaml
  text: 'You may eat this from all that are in the waters: everything that has fins and scales you may eat.'
translation:
  language: zh_hans
  text: 水里的一切中，凡有鳍有鳞的，你们都可以吃。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֶת זֶה תֹּאכְלוּ מִכֹּל אֲשֶׁר בַּמָּיִם
  choice: 水里的一切中……你们都可以吃
  rationale: 希伯来语先以“以下是你们可吃的”引出类别，随后由“凡……”具体界定；中文合并为自然清楚的一句，未增添原文没有的对象。
- source_word: סְנַפִּיר
  choice: 鳍
  rationale: 指水生动物的鳍，是现代汉语准确、通行的对应词。
- source_word: קַשְׂקֶשֶׂת
  choice: 鳞
  rationale: 指鳞片；与“鳍”并列时用“鳞”简洁自然，也保留律法条文的判定标准。
- source_word: כֹּל אֲשֶׁר לוֹ ... תֹּאכֵלוּ
  choice: 凡有……的，你们都可以吃
  rationale: 保留“凡……都……”的全称结构，并将许可语气译为“可以吃”。
