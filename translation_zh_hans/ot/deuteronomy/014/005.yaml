  text: the deer[a], the gazelle, the roebuck, the wild goat, the ibex, the antelope, and the mountain sheep.
translation:
  language: zh_hans
  text: 鹿[a]、瞪羚、狍子、野山羊、北山羊、羚羊和山地绵羊。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节几个动物名称的确切所指不能确定。“狍子”也可能是黇鹿或赤鹿；“野山羊”可能特指北山羊；“北山羊”也可能是弯角羚羊；“羚羊”也可能是野牛或原牛；“山地绵羊”也可能是岩羚羊或山羊。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַיָּל
  choice: 鹿
  rationale: 泛指鹿类；比“雄鹿”宽泛，也符合食物条例中列举动物的语境。
- source_word: צְבִי
  choice: 羚羊
  rationale: 通常辨认为瞪羚一类；“羚羊”是现代中文清楚自然的通称。
- source_word: יַחְמוּר
  choice: 狍子
  rationale: 确切物种不能确定；采用易懂的鹿类名称，并在脚注保留黇鹿、赤鹿等可能。
- source_word: אַקּוֹ
  choice: 野山羊
  rationale: 很可能指野生羊类，或特指北山羊；正文采用较通俗且不过分具体的称呼。
- source_word: דִישֹׁן
  choice: 北山羊
  rationale: 物种辨认有争议；“北山羊”可表达一种野生山羊类动物，但须在脚注说明也可能是弯角羚等。
- source_word: תְאוֹ
  choice: 野牛
  rationale: 该词可能指野牛，也可能指某种羚羊；选择有古代译本和相关闪语支持的“野牛”，同时保留另一可能。
- source_word: זָמֶר
  choice: 盘羊
  rationale: 确切动物不明；“盘羊”自然地表达山地野生羊类，但岩羚或山羊等辨认仍属可能。
