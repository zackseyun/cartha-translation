source:
  edition: WLC
  text: וְ/כֹ֨ל אֲשֶׁ֧ר אֵֽין ל֛/וֹ סְנַפִּ֥יר וְ/קַשְׂקֶ֖שֶׂת לֹ֣א תֹאכֵ֑לוּ טָמֵ֥א ה֖וּא לָ/כֶֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/010.yaml
  text: But anything that does not have fins and scales, you shall not eat; it is unclean for you.
translation:
  language: zh_hans
  text: 但凡没有鳍和鳞的，你们都不可吃；对你们来说，那是不洁净的。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/כֹל
  choice: 但凡
  rationale: כֹל 表示全称范围；结合上节准许食用的规定，ו 在此带出对比。“但凡”既自然地承接转折，也保留“任何……都”的完整涵盖力。
- source_word: אֲשֶׁר אֵין לוֹ
  choice: 没有
  rationale: אֵין 加所属代词表达缺少或不具备；汉语用“没有”简洁自然，准确表达分类条件。
- source_word: סְנַפִּיר וְ/קַשְׂקֶשֶׂת
  choice: 鳍和鳞
  rationale: 两个名词分别指水生动物的鳍与鳞。现代汉语在类别性规定中通常用集合意义的单数形式“鳍和鳞”，无需机械体现希伯来语语法数。
- source_word: לֹא תֹאכֵלוּ
  choice: 你们都不可吃
  rationale: 否定词与第二人称复数未完成式在律法语境中构成禁令。“不可吃”保留庄重的法规语体；“你们”体现复数对象，“都”与前面的全称范围呼应。
- source_word: טָמֵא
  choice: 不洁净
  rationale: 在申命记的食物与礼仪分类语境中，טָמֵא 指礼仪上不洁的类别。“不洁净”是清楚且通行的圣经术语，不宜仅译为一般卫生意义的“不干净”。
- source_word: הוּא לָכֶם
  choice: 对你们来说，那是不洁净的
  rationale: לָכֶם 表明这种不洁身份是相对于以色列群体而言；“对你们来说”保留这一关系限定，“那”回指凡不具备鳍和鳞之物。
theological_decisions:
- issue: טָמֵא 所指的不洁性质
  choice: 译作“不洁净”，保留礼仪与盟约法规中的类别含义
  alternative: 译作“不干净”或将其解释为有害健康
  rationale: 原文只宣告其对以色列为 טָמֵא，并未说明卫生或医学原因；译文不应额外引入这种解释。
translation_notes:
  register: 采用现代、庄重而易懂的法规语体。“但凡……都不可……”自然表达希伯来语的全称禁令；分号保留禁令与随后身份判定之间的紧密关系。
