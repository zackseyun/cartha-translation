  yaml_path: translation/ot/deuteronomy/014/006.yaml
  text: You may eat any animal that has a split hoof[a], divided into two hoof-parts, and that chews the cud among the animals.
translation:
  language: zh_hans
  text: 凡是蹄分开、裂成两瓣，并且反刍的动物，你们都可以吃。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכָל בְּהֵמָה
  choice: 凡走兽中……的
  rationale: בְּהֵמָה在本节饮食条例中指所讨论的陆生兽类；“走兽”比泛称“动物”更贴合语境，也不把范围限于家畜。וְכָל以“凡……的”表达逐一涵盖的意思。
- source_word: מַפְרֶסֶת פַּרְסָה
  choice: 蹄分开
  rationale: 保留希伯来文对蹄分开的具体描述，并使用现代汉语中简明自然的说法。
- source_word: וְשֹׁסַעַת שֶׁסַע שְׁתֵּי פְרָסוֹת
  choice: 裂成两瓣
  rationale: 原文进一步说明蹄的裂缝形成两个部分；“裂成两瓣”保留这种强化和数量信息，同时避免生硬重复。
- source_word: מַעֲלַת גֵּרָה
  choice: 反刍
  rationale: 该短语字面涉及把食物重新带上来，实际指反刍；“反刍”是准确、通行而简洁的现代汉语术语。
- source_word: אֹתָהּ תֹּאכֵלוּ
  choice: 你们都可以吃
  rationale: 在饮食律例的语境中，此处表达准许食用，而非命令人必须吃；“可以吃”自然传达许可，代词所指则由关系结构清楚表达。
