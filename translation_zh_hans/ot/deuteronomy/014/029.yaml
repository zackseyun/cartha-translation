  text: וּ/בָ֣א הַ/לֵּוִ֡י כִּ֣י אֵֽין ל/וֹ֩ חֵ֨לֶק וְ/נַחֲלָ֜ה עִמָּ֗/ךְ וְ֠/הַ/גֵּר וְ/הַ/יָּת֤וֹם וְ/הָֽ/אַלְמָנָה֙ אֲשֶׁ֣ר בִּ/שְׁעָרֶ֔י/ךָ וְ/אָכְל֖וּ וְ/שָׂבֵ֑עוּ לְמַ֤עַן יְבָרֶכְ/ךָ֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ בְּ/כָל מַעֲשֵׂ֥ה יָדְ/ךָ֖ אֲשֶׁ֥ר תַּעֲשֶֽׂה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/029.yaml
  text: And the Levite shall come[a], because he has no portion or inheritance with you, and the sojourner, the fatherless, and the widow who are within your gates, and they shall eat and be satisfied[b], so that Yahweh your God may bless you in all the work of your hands that you do.
translation:
  language: zh_hans
  text: 利未人因为在你中间没有份额和产业，还有住在你各城中的[b]寄居者[a]、孤儿和寡妇，都要来吃，吃得饱足，好使雅威你的上帝在你手所做的一切工作上赐福给你。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “寄居者”指居住在以色列人中间的非本地居民。也可译作“外来居民”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“在你城门以内”。“城门”在这里代指所属的城镇或当地社群。
    reason: cultural_note
lexical_decisions:
- source_word: וּבָא
  choice: 要来
  rationale: 该完成式在律法指示的语境中带有预期或指令性的将来含义；“要来”自然地保留这种语气。
- source_word: הַלֵּוִי
  choice: 利未人
  rationale: 原文指利未支派这一身份，并未在此明确限定为祭司。
- source_word: חֵלֶק וְנַחֲלָה
  choice: 无分无业
  rationale: 以现代中文中简洁庄重的并列表达，保留“所得份额”和“承受的产业”两个相关而不完全相同的概念。
- source_word: הַגֵּר
  choice: 寄居者
  rationale: 指居住在以色列人中间、却不属于本地族群的人；“寄居者”保留其外来而常住的双重社会身份。
- source_word: הַיָּתוֹם
  choice: 孤儿
  rationale: 这是现代中文对该受保护弱势群体最自然的称呼；在古代语境中尤其指失去父亲保障的人。
- source_word: אֲשֶׁר בִּשְׁעָרֶיךָ
  choice: 住在你各城中的
  rationale: “在你的城门以内”是指本地城镇或辖区；正文译出其实际所指，脚注保留原文意象。
- source_word: וְאָכְלוּ וְשָׂבֵעוּ
  choice: 吃得饱足
  rationale: 准确表达这些人可从所储存的供物获得充分供应这一预期结果。
- source_word: לְמַעַן יְבָרֶכְךָ
  choice: 好使……赐福给你
  rationale: 保留 לְמַעַן 所表达的目的与结果关系，不把赐福处理为脱离前项条件的无条件预言。
- source_word: בְּכָל מַעֲשֵׂה יָדְךָ
  choice: 在你手所做的一切事上
  rationale: 保留希伯来文“手所做的”这一劳作意象，同时使中文基本通顺。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译呈现四字神名，而不以称号代替专名。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文使用神的专名；“雅威”较直接对应学界通常重构的读音 Yahweh，并避免将专名改译为“主”等称号。
- issue: 赐福与前述照顾弱势群体之间的关系
  choice: 好使……赐福给你
  alternative: 这样……必赐福给你
  rationale: 原文 לְמַעַן 加未完成式可表达目的或预期结果；所选译法保留这种张力，不强化为绝对、机械式的保证。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。以分号划开利未人无产业的说明，并用“也要来”明确原文由单数“来”转向复数“吃”的名单结构；保留“无分无业”和“手所做的”等希伯来语法律与劳作意象。
