revisions:
- from: 利未人要来，因为他在你中间无分无业；住在你各城中的寄居者[a]、孤儿和寡妇也要来[b]，吃得饱足，好使雅威你的上帝在你手所做的一切事上赐福给你。
  to: 利未人因为在你中间没有份额和产业，还有住在你各城中的[b]寄居者[a]、孤儿和寡妇，都要来吃，吃得饱足，好使雅威你的上帝在你手所做的一切工作上赐福给你。
  rationale: 修订将文化说明脚注移至其对应的“各城中”，并重整句子，使利未人、寄居者、孤儿和寡妇共同构成“来吃、吃得饱足”的受益群体。措辞维持原文法律性、供应性的语气，保留“雅威”及目的连词“好使”的表达，未将赐福强化为无条件保证。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T04:57:26Z'
review_pass:
  verdict: revise
  source_fidelity: 草稿将“也要来”加在寄居者、孤儿和寡妇身上，虽与上下文意旨相符，却在此句的希伯来文句法中不是一个独立重复的“来”字；更主要的是，脚注 b 所说明的“城门”却锚定在“也要来”上，未能对应其所注释的“各城中”。原文的复数“吃、饱足”涵盖利未人及随后列举的群体，修订稿以“都要来吃，吃得饱足”自然表达这一整体结构。
  naturalness: “在你手所做的一切事上”略显直译且不够自然；“你手所做的一切工作”既保留劳作意象，也合乎现代庄重书面语。“无分无业”简洁可用，但“没有份额和产业”更清楚呈现原文并列的法律经济含义。
  terminology: “利未人”“寄居者”“孤儿”“寡妇”及神名“雅威”均可保留。“寄居者”脚注宜说明其为居住于以色列社会中的非本地居民，避免“外族”在现代汉语中可能带来的不必要族群色彩。
  issues:
  - severity: medium
    issue: 脚注 b 的锚点错误
    rationale: 脚注 b 解释的是 אֲשֶׁר בִּשְׁעָרֶיךָ（“在你城门以内／在你各城中”），但草稿将 [b] 放在“也要来”之后；应紧随“各城中”。
  - severity: medium
    issue: “也要来”造成不必要的重复和结构偏移
    rationale: 原文只有一次单数“利未人要来”，随后列出寄居者、孤儿和寡妇，再以复数动词说“他们要吃且饱足”。用“都要来吃”统摄各类人更自然，也不把“来”误作原文对第二组名词的另一次明示谓语。
  - severity: low
    issue: “在你手所做的一切事上”不够自然
    rationale: 可改为“在你手所做的一切工作上”，保留原文“手”和“工作”的意象，同时改善现代中文表达。
  revised_text: 利未人因为在你中间没有份额和产业，还有住在你各城中的[b]寄居者[a]、孤儿和寡妇，都要来吃，吃得饱足，好使雅威你的上帝在你手所做的一切工作上赐福给你。
  revised_footnotes:
