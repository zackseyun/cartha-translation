    text: “寄居者”指居住在以色列人中间的非本地居民。也可译作“外来居民”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“在你城门以内”。“城门”在这里代指所属的城镇或当地社群。
    reason: cultural_note
  revision_rationale: 修订将文化说明脚注移至其对应的“各城中”，并重整句子，使利未人、寄居者、孤儿和寡妇共同构成“来吃、吃得饱足”的受益群体。措辞维持原文法律性、供应性的语气，保留“雅威”及目的连词“好使”的表达，未将赐福强化为无条件保证。
