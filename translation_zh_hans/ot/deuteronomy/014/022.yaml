  yaml_path: translation/ot/deuteronomy/014/022.yaml
  text: You shall surely tithe all the produce of your seed that comes out of the field[a], year by year.
translation:
  language: zh_hans
  text: 你要从你所撒的种子、田地每年所出的全部收成中取出十分之一。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你每年都要把你所撒种、田地所出的一切收成取出十分之一。”
    reason: 词汇与句法的另一种较贴近原文的表达；“你所撒种”对应“你的种子”，并按原文次序连接其与田地出产。
lexical_decisions:
- source_word: עַשֵּׂר תְּעַשֵּׂר
  choice: 都要……取出十分之一
  rationale: 希伯来语以同根不定词绝对式加强限定动词，强调这项命令。现代汉语用“都要”表达明确而加强的义务；“取出十分之一”也比生硬的“十一奉献”更直接呈现动作和比例。
- source_word: תְּבוּאַת
  choice: 收成
  rationale: 该词泛指土地的出产或产量。“收成”是自然、宽泛的现代农业用语，不限于某一种作物。
- source_word: זַרְעֶךָ
  choice: 田地所出的一切收成
  rationale: 字面为“你的种子”，在此语境中指所播种之物带来的农产。中文若直译“种子所出的”容易误解，因此结合后面的田地短语自然表达为田地的收成。
- source_word: הַיֹּצֵא הַשָּׂדֶה
  choice: 田地所出的
  rationale: 紧贴“从田地出来”的意象，同时用现代汉语自然的关系结构表达；不把它限定为某类谷物。
- source_word: שָׁנָה שָׁנָה
  choice: 每年
  rationale: 重复形式表达逐年、每年一次的规律性。“每年”在现代汉语中最自然，也完整传达其分配性意义。
