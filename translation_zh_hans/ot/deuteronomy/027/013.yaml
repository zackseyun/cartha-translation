base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/013.yaml
  text: 'And these shall stand for the curse on Mount Ebal: Reuben[a], Gad, Asher, Zebulun, Dan, and Naphtali.'
translation:
  language: zh_hans
  text: 这些支派要在以巴路山上为咒诅而站立[a]：吕便、迦得、亚设、西布伦、但和拿弗他利。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“为施行咒诅而站立”或“为宣告咒诅而站立”。原文未说明具体行动。
    reason: 保留עַל הַקְּלָלָה在礼仪语境中与咒诅相关、但具体实施方式未明的表达。
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: 这些支派
  rationale: 希伯来语直译为“这些”，与上一节的一组形成对应；结合随后列出的支派名称，中文补出“支派”可使指称自然清楚。句首连接词在中文承接关系中无需机械译出。
- source_word: יַעַמְדוּ
  choice: 要……站立
  rationale: 未完成式在摩西的指示中表达将要执行的安排；“要……站立”兼顾命令意味和礼仪语境。
- source_word: עַל הַקְּלָלָה
  choice: 为宣告咒诅而
  rationale: עַל在此表示与咒诅仪式相关的职责或安排。上下文表明所涉及的是宣告咒诅；正文采用自然明确的表达，同时用脚注保留更简约的“为咒诅”及“为咒诅人”等可能译法。
- source_word: בְּהַר עֵיבָל
  choice: 在以巴路山上
  rationale: בְ表示所在位置；“在……山上”符合现代汉语，并保留山名的传统通行译法。
- source_word: רְאוּבֵן
  choice: 吕便
  rationale: 采用现代中文圣经中通行的专名译法。
- source_word: גָּד
  choice: 迦得
  rationale: 采用现代中文圣经中通行的专名译法。
- source_word: אָשֵׁר
  choice: 亚设
  rationale: 采用现代中文圣经中通行的专名译法。
- source_word: זְבוּלֻן
  choice: 西布伦
  rationale: 采用现代中文圣经中通行的专名译法。
- source_word: דָּן
  choice: 但
  rationale: 采用现代中文圣经中通行的专名译法。
- source_word: נַפְתָּלִי
  choice: 拿弗他利
  rationale: 采用现代中文圣经中通行的专名译法。
theological_decisions:
- issue: 各支派与咒诅仪式的关系
  choice: 为宣告咒诅而站立
  alternative: 为咒诅而站立；为咒诅人而站立
  rationale: 原文没有明说“宣告”这一动词，仅以介词短语将这些支派与“咒诅”联系起来；但27:12–13的祝福与咒诅对举以及后文的礼仪宣告，使“宣告咒诅”成为自然的语境表达。脚注保留原文较简约且可能更宽泛的理解，避免把参与方式绝对化。
translation_notes:
  register: 采用庄重、清晰的现代标准汉语。正文沿用中文读者熟悉的圣经专名；语序自然，同时保留本节与上一节相对应的礼仪结构。
