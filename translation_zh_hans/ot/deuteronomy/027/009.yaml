base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/009.yaml
  text: 'Then Moses and the Levitical priests spoke to all Israel[a], saying, “Be silent and listen[b], Israel: today you have become a people for Yahweh your God.”'
translation:
  language: zh_hans
  text: 摩西和利未祭司对全体以色列人说：“以色列啊，要安静[a]，要听！今天你已经成为雅威你上帝的子民。[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“要留心。”这里的希伯来语祈使词既可能强调安静，也可能强调专心留意。
    reason: lexical_alternative
  - marker: b
    text: 或译：“今天你已经成为归给雅威你上帝的子民。”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 说
  rationale: 该形式推动叙事并引出直接引语；现代汉语用“说”即可自然表达其言说动作，无须机械译出连接词。
- source_word: הַכֹּהֲנִים הַלְוִיִּם
  choice: 利未族的祭司
  rationale: 两个名词构成同位关系，指明这些祭司是利未人；此译比“祭司和利未人”更能避免误读为两个群体。
- source_word: כָּל יִשְׂרָאֵל
  choice: 全体以色列人
  rationale: 保留对整个以色列共同体的集体称呼，同时符合现代汉语表达。
- source_word: הַסְכֵּת
  choice: 要安静
  rationale: 该罕见祈使词在此可表示静默，也可强调专心留意；正文采用较具体的“安静”，并以脚注保留另一种理解。
- source_word: וּשְׁמַע
  choice: 听
  rationale: 与前一祈使词连用，要求以色列留心领受接下来的话；“听”简洁自然。
- source_word: הַיּוֹם הַזֶּה
  choice: 今天
  rationale: 自然对应希伯来语指示性时间短语，保持其当下性。
- source_word: נִהְיֵיתָ לְעָם
  choice: 你已经成为……的子民
  rationale: 单数动词把以色列作为一个整体来称呼；“子民”表达立约群体身份，而不把 עַם 过度政治化为“国家”。
- source_word: לַיהוָה
  choice: 雅威……的
  rationale: היה + ל 可表达归属或成为某一方的子民；正文以自然的所属结构表达，脚注保留“归给”的动态说法。
- source_word: אֱלֹהֶיךָ
  choice: 你上帝
  rationale: 保留第二人称单数，呼应把以色列共同体视为一个整体的称谓。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较贴近学界通常重建的发音，也避免以称号替代专名。
- issue: 对以色列的集体单数称呼
  choice: 你已经成为
  alternative: 你们已经成为
  rationale: 原文以第二人称阳性单数称呼整个以色列，正文保留“你”以呈现共同体作为一个整体的立约修辞。
- issue: לַיהוָה 所表达的关系
  choice: 雅威你上帝的子民
  alternative: 归给雅威你上帝的子民
  rationale: 此结构既可突出归属，也可突出成为归给雅威的群体；正文采用自然的所属表达，脚注保留另一种语气。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。用“以色列啊”保留直接呼告，用单数“你”保留原文把全体以色列视为一个共同体的表达；“利未族的祭司”避免把祭司与利未人误分为两个并列群体。
