base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/002.yaml
  text: And on the day when you cross over the Jordan into the land that Yahweh your God is giving you[a], you shall set up for yourself large stones and plaster them with lime.
translation:
  language: zh_hans
  text: 你们渡过约旦河、进入雅威你的上帝所赐给你的那地的那一天，你要为自己立起大石头，并用石灰涂抹它们[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “石灰”也可译作“灰泥”；希伯来语名词指用作涂层的石灰或灰泥。
    reason: 词义在石灰材料与由其制成的涂抹灰泥之间有重叠，正文采用较简洁的“石灰”，脚注保留另一译法。
lexical_decisions:
- source_word: וְהָיָה בַּיּוֹם אֲשֶׁר
  choice: ……的那一天
  rationale: 这是引出将来情形的希伯来语句式；用现代汉语的时间结构表达，比直译成“事情将是”自然，同时保留时间焦点。
- source_word: תַּעַבְרוּ אֶת הַיַּרְדֵּן
  choice: 你们过约旦河
  rationale: עבר在这里指从一岸渡到另一岸；“过约旦河”简洁自然，并明确保留复数主语。
- source_word: הָאָרֶץ
  choice: 土地
  rationale: 此处指以色列人将进入并承受的地域；“土地”既保留地理含义，也避免把它现代政治化为“国家”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以音译保留四字神名作为专名的性质，不用称号代替。
- source_word: נֹתֵן לָךְ
  choice: 赐给你的
  rationale: 分词描写上帝正在施行、并确定要成就的赐予；汉语定语结构无需强行添加时态词，“赐给”也符合此处上帝授予土地的语境。
- source_word: וַהֲקֵמֹתָ לְךָ
  choice: 要为自己立起
  rationale: קום的使役形在此指竖立或设立；“立起”自然清楚，לְךָ的反身意味以“为自己”表达。
- source_word: אֲבָנִים גְּדֹלוֹת
  choice: 大石头
  rationale: 准确表达石头体积大；汉语名词本身不必强行添加复数标记。
- source_word: וְשַׂדְתָּ אֹתָם בַּשִּׂיד
  choice: 在石头上抹石灰
  rationale: 动词表示涂抹或覆盖，שִׂיד表示用作涂层的石灰或灰泥；此译法自然呈现动作与材料。
theological_decisions:
- issue: 如何译出神名 יְהוָה
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文使用神的专名。采用“雅威”作为现代汉语音译，保留专名性质；“上主”会以称号代替专名，“耶和华”则源于另一种传统音译形式。
- issue: 第二人称数的转换
  choice: 保留“你们”到“你／自己”的转换
  alternative: 全句统一译为“你们／你们自己”
  rationale: 原文在“你们过河”使用复数，随后“你的上帝、给你、你要、为自己”使用阳性单数，把以色列整体作为一个受话者。译文保留这种集体复数与整体单数之间的转换，不把原文张力抹平。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。保留申命记中把以色列既称为复数群体、又称为单一整体的称呼转换；脚注标记紧随其实际说明的“石灰”。
