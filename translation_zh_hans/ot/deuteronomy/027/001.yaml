base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/001.yaml
  text: Then Moses and the elders of Israel commanded the people[a], saying, “Keep all the commandment that I am commanding you today.”
translation:
  language: zh_hans
  text: 摩西和以色列的长老吩咐百姓说：“你们要谨守我今天吩咐你们的全部诫命[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文“诫命”为单数，可理解为集合意义上的全部诫命，也可译作“整个诫命”。
    reason: 保留希伯来文单数形式及其集合性语义的译法差异。
lexical_decisions:
- source_word: וַיְצַו
  choice: 吩咐
  rationale: צוה表示带有权威地发出命令；“吩咐”在现代中文圣经语体中自然、庄重，也符合此处摩西和长老向百姓颁令的场景。
- source_word: וְזִקְנֵי יִשְׂרָאֵל
  choice: 和以色列的长老
  rationale: 希伯来文以并列结构把摩西与以色列的长老共同列为动词的主语，因此保留“和”，不改写为陪同关系。
- source_word: הָעָם
  choice: 百姓
  rationale: עָם在以色列民族及圣约语境中指整体人民；“百姓”是自然且明确的现代中文表达。
- source_word: לֵאמֹר
  choice: 说
  rationale: 这是引出直接引语的惯用不定式；中文用“说”即可自然保留其话语结构。
- source_word: שָׁמֹר
  choice: 要谨守
  rationale: שׁמר在诫命语境兼有遵行与谨慎守护之意；“谨守”较单用“遵守”更能保留这种语义厚度，而“要”清楚表达命令语气。
- source_word: כָּל הַמִּצְוָה
  choice: 这一切诫命
  rationale: 原文מִצְוָה为单数，并可作集合性用法。中文“这一切诫命”表达整套命令的总体范围，读来比“全部这一诫命”自然；脚注说明原文的单数形式及另一种理解。
- source_word: אֲשֶׁר אָנֹכִי מְצַוֶּה אֶתְכֶם
  choice: 我……吩咐你们的
  rationale: 分词מְצַוֶּה在此表示当下正在颁布的命令；中文定语结构配合“今天”自然传达即时语境，无须生硬加入“正在”。
- source_word: הַיּוֹם
  choice: 今天
  rationale: “今天”准确、自然地表达原文的时间强调，且无古语色彩。
theological_decisions:
- issue: 圣约训令中מִצְוָה的数
  choice: 正文采用自然的集合性表达“这一切诫命”，并以脚注保留原文单数信息
  alternative: 直译为“全部这一诫命”或“整个诫命”
  rationale: 希伯来文名词确为单数，但在《申命记》中常集合性地指整套圣约要求。中文若机械保留单数会明显生硬；正文传达其整体含义，脚注则防止原文数的信息被隐去，也不武断排除“整个诫命”的理解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“谨守”保留圣约命令中慎重遵行的意味；句法简洁，并明确保留摩西与长老同为发令者。
