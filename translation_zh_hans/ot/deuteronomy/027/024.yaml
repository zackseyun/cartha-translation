  text: Cursed is the one who strikes down his neighbor in secret. And all the people shall say[a], “Amen.”
translation:
  language: zh_hans
  text: “暗中击打[a]邻舍的，必受咒诅！”全体百姓都要说：“阿们！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “击打”也可译作“击倒”或“击杀”；希伯来语动词的含义范围从击打到致命暴力。
    reason: lexical_alternative
lexical_decisions:
- source_word: אָרוּר
  choice: 必受咒诅
  rationale: 这是盟约咒诅宣告中的被动分词式用语。“必受咒诅”在现代汉语中清楚、庄重，也保留宣告的效力。
- source_word: מַכֵּה
  choice: 击打
  rationale: נכה 的语义范围包括击打、重创乃至击杀。正文采用较宽的“击打”，避免将原文未明确限定的行为收窄为杀人；脚注说明其可能包含致命暴力。
- source_word: רֵעֵהוּ
  choice: 邻舍
  rationale: רֵעַ 指同伴、邻人或共同体中的人。“邻舍”既贴近原义，也保留圣经语体，同时普通读者能够理解。
- source_word: בַּסָּתֶר
  choice: 暗中
  rationale: 该短语表示行为隐蔽、不为人知。“暗中”自然简洁，准确表达秘密实施之意。
- source_word: וְאָמַר
  choice: 都要说
  rationale: 在这一礼仪程序中，连接词加完成式表达规定性的回应。“都要说”符合现代汉语，也保留集体礼仪回应的语气。
- source_word: כָּל הָעָם
  choice: 全体百姓
  rationale: 原文明确指“所有百姓”。“全体百姓”自然且不额外加入原文未明说的“以色列”。
- source_word: אָמֵן
  choice: 阿们
  rationale: 这是固定的礼仪回应，表示确认和接受所宣告的话；采用汉语圣经传统中通行的音译。
theological_decisions:
- issue: מַכֵּה 所表达的暴力程度
  choice: 正文译为“击打”，并用脚注说明可能包括“击杀”
  alternative: 击倒；击杀
  rationale: נכה 的范围可从击打延伸至致命攻击。本节语境表明这是严重且隐秘的暴力，但动词本身并未无歧义地限定为杀人。因此正文保留其宽度，不把罪行明确收窄为谋杀。
translation_notes:
  register: 采用现代、庄重而易懂的礼仪性汉语。“邻舍”和“阿们”保留广为人知的圣经用语；句式简洁，以体现公开宣告与全体回应的节奏。
