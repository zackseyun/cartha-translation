  text: אָרוּר֙ לֹקֵ֣חַ שֹׁ֔חַד לְ/הַכּ֥וֹת נֶ֖פֶשׁ דָּ֣ם נָקִ֑י וְ/אָמַ֥ר כָּל הָ/עָ֖ם אָמֵֽן־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/025.yaml
  text: Cursed is the one who takes a bribe to strike down an innocent person[a], and all the people shall say, ‘Amen.’
translation:
  language: zh_hans
  text: “凡收受贿赂去杀害无辜者的，必受诅咒。”全体民众都要说：“阿们！”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָרוּר
  choice: 必受诅咒
  rationale: 这是盟约诅咒宣告的谓语形式；“必受诅咒”在现代汉语中自然、庄重，也表达宣告的效力。
- source_word: לֹקֵחַ שֹׁחַד
  choice: 收受贿赂
  rationale: 分词表示泛指的行为人；“收受贿赂”是现代汉语中清楚而准确的法律性表达。
- source_word: לְהַכּוֹת
  choice: 杀害
  rationale: נכה 的使役式不定词可指击打、击倒或杀死；与“无辜之人的血”搭配时语境指致命行为，因此译作“杀害”。
- source_word: נֶפֶשׁ דָּם נָקִי
  choice: 无辜之人
  rationale: 马所拉文本的词组较为凝缩，核心意象是“无辜的血”，在此指无辜者的性命；正文采用自然汉语表达，字面意象保留在脚注。
- source_word: וְאָמַר כָּל הָעָם
  choice: 全体民众都要说
  rationale: 在礼仪和律法语境中，这是规定全体会众作出的回应；“都要说”兼顾规范性与现代可读性。
- source_word: אָמֵן
  choice: 阿们
  rationale: 保留已通行的礼仪性音译，表达确认和赞同盟约宣告。
theological_decisions:
- issue: 盟约诅咒公式的表达
  choice: 收受贿赂、杀害无辜之人的，必受诅咒
  alternative: 收受贿赂、击打无辜之人的，受诅咒
  rationale: 所选译法保留诅咒宣告的盟约效力，并依据“无辜的血”这一搭配明确致命暴力的含义，不额外引入任何宗派性解释。
- issue: “无辜的血”意象与自然汉语之间的取舍
  choice: 正文译“无辜之人”，脚注说明字面为“无辜之人的血”
  alternative: 正文直译“无辜之人的血”
  rationale: 希伯来语以“血”指涉遭杀害者及其血债；中文直译容易显得对象搭配生硬，因此正文传达所指，脚注保留血的法律与道德意象。
translation_notes:
  register: 采用现代、庄重、适合公开宣读的标准普通话。“民众”对应集体性的 הָעָם；引号和感叹号凸显逐条宣告及会众回应的礼仪结构。
