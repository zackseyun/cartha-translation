review_pass:
  verdict: revise
  source_fidelity: 正文准确传达了希伯来文的盟约诅咒：收受贿赂是为杀害无辜者，且全体会众须回应“阿们”。但脚注将字面表达写成“击杀无辜之人的血”，中文语义不当；原文的“无辜的血”是法律性惯用语，指无辜者及其所流之血。
  naturalness: 正文庄重、流畅，适合公开宣读。将并列的“收受贿赂、杀害”改为“收受贿赂去杀害”，可更明确表达不定词所示的目的关系。
  terminology: “贿赂”“诅咒”“阿们”均恰当。“无辜者”是对“无辜的血”所指对象的自然现代汉语表达；脚注应保留“血”的意象而不造成“杀害血液”的误解。
  issues:
  - severity: medium
    issue: 脚注的直译表述不准确且不自然
    rationale: “击杀无辜之人的血”把“血”误作“击杀”的直接对象。希伯来文的“无辜的血”是指无辜者的血，作为指称无辜受害者的惯用法律表达。
  - severity: low
    issue: 正文中目的关系可更明确
    rationale: לְהַכּוֹת 表示收受贿赂的目的；加入“去”能在不增添意义的情况下清楚表达这一关系。
  revised_text: “凡收受贿赂去杀害无辜者的，必受诅咒。”全体民众都要说：“阿们！”
  revised_footnotes:
  - marker: a
    text: 原文直译可作“击杀无辜的血”。“血”在此是指无辜者，强调其无辜受害、流血的意象。
    reason: 说明原文“无辜的血”的惯用法律表达及其所指，避免将“血”误解为“击杀”的字面对象。
  revision_rationale: 修订仅澄清“收受贿赂”与“杀害”之间的目的关系，并更正脚注对“无辜的血”的说明。正文仍以自然的现代汉语表达原文所指，脚注保留原文的血之意象。
