revisions:
- from: “收受贿赂、杀害无辜之人[a]的，必受诅咒！”全体民众都要说：“阿们！”
  to: “凡收受贿赂去杀害无辜者的，必受诅咒。”全体民众都要说：“阿们！”
  rationale: 修订仅澄清“收受贿赂”与“杀害”之间的目的关系，并更正脚注对“无辜的血”的说明。正文仍以自然的现代汉语表达原文所指，脚注保留原文的血之意象。
