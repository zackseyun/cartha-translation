base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/012.yaml
  text: 'These shall stand on Mount Gerizim to bless the people when you cross the Jordan: Simeon[a], Levi, Judah, Issachar, Joseph, and Benjamin.'
translation:
  language: zh_hans
  text: 你们过约旦河以后，以下这些支派要站在基利心山上为百姓祝福：西缅、利未、犹大、以萨迦、约瑟[a]和便雅悯。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的“约瑟”在支派名单中代表由约瑟而出的以法莲和玛拿西两支派。
    reason: 说明“约瑟”在支派名单中的代表性用法；标记置于“约瑟”之后，以免误指“西缅”。
lexical_decisions:
- source_word: אֵלֶּה
  choice: 以下这些支派
  rationale: 复数指示词引出随后列举的各支派；补出“支派”使现代汉语指代清楚，又不改变所列名称。
- source_word: יַעַמְדוּ
  choice: 要站
  rationale: 在摩西颁布礼仪安排的语境中，未完成式具有指令意味；“要站”自然保留规定性，而非仅作未来预测。
- source_word: לְבָרֵךְ אֶת־הָעָם
  choice: 为百姓祝福
  rationale: 带 לְ 的不定式表示目的；“为百姓祝福”准确而自然地表达各支派站立的目的。
- source_word: עַל הַר גְּרִזִים
  choice: 在基利心山上
  rationale: 采用现代中文圣经地名的通行译法，并自然表达山上的位置。
- source_word: בְּעָבְרְכֶם אֶת־הַיַּרְדֵּן
  choice: 你们过约旦河以后
  rationale: בְ 加带第二人称复数后缀的不定式构成时间从句；此处仪式发生在渡河之后，“过……以后”清楚表达事件次序。
- source_word: יוֹסֵף
  choice: 约瑟
  rationale: 正文严格保留希伯来文所列的“约瑟”，不在正文中改写为其后裔支派。
theological_decisions:
- issue: 各支派站立安排的语气
  choice: 译作指令性的“要站”
  alternative: 译作预测性的“将站”
  rationale: 本节属于摩西对将来立约仪式的安排；指令语气更贴合上下文，同时不额外强化神学含义。
- issue: 支派名单中“约瑟”的含义
  choice: 正文保留“约瑟”，以脚注说明其代表性用法
  alternative: 正文展开为“以法莲和玛拿西”或“约瑟的支派”
  rationale: 原文明确写“约瑟”；正文展开会加入原文未明说的解释，因此将必要说明置于脚注。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“过约旦河以后”明确仪式的时间次序；名单使用通行中文专名。
