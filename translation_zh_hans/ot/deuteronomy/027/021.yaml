base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/021.yaml
  text: Cursed is he who lies with any animal. And all the people shall say[a], ‘Amen.’
translation:
  language: zh_hans
  text: 与任何牲畜交合的男子必受咒诅！全体百姓都要说：“阿们！”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָרוּר
  choice: 必受咒诅
  rationale: 这是盟约礼仪中的咒诅宣告。用“必受咒诅”既保留庄严、判定性的语气，也比单说“被咒诅”更符合现代汉语。
- source_word: שֹׁכֵב
  choice: 交合
  rationale: 此处的 שׁכב 在法律语境中是指性交的委婉语。“交合”准确表达性含义，同时保留原文较为含蓄而庄重的语体。
- source_word: כָּל בְּהֵמָה
  choice: 任何牲畜
  rationale: כָּל 在此具有任指、分配意义，译作“任何”；בְּהֵמָה 通常指陆生牲畜或走兽，本处译作“牲畜”贴近其常用语义，也符合本段法律语境。
- source_word: שֹׁכֵב（阳性单数分词）
  choice: ……的男子
  rationale: 该实体化分词为阳性单数，本条文所设想的行为主体是男性；明译为“男子”可在自然汉语中保留这一性别信息。
- source_word: וְאָמַר כָּל הָעָם
  choice: 全体百姓都要说
  rationale: 承接盟约仪式的规定性次序。“都要说”自然表达礼仪中全体共同回应的要求。
- source_word: אָמֵן
  choice: 阿们
  rationale: 保留通行的礼仪音译，表达确认并接受上述咒诅的回应。
theological_decisions:
- issue: 法律咒诅公式中阳性单数分词的性别表达
  choice: 与任何牲畜交合的男子
  alternative: 凡与任何牲畜交合的人
  rationale: 原文 שֹׁכֵב 是阳性单数形式，且此性行为的措辞以男性为主体。正文用“男子”保留原文性别信息，不将其泛化为中性的“人”。
- issue: 咒诅公式的语气
  choice: 必受咒诅
  alternative: 是可咒诅的／被咒诅
  rationale: “必受咒诅”传达盟约仪式中宣告性和判定性的力量，同时不额外说明施行咒诅者，从而保留原文的简练。
translation_notes:
  register: 采用现代、庄重而易懂的礼仪—法律语体。“交合”避免粗俗，也不把原文改写得过分露骨；“全体百姓都要说”保留集体回应的仪式节奏。原文没有需要在中文正文中另设标记的实质性异读，因此不加脚注。
