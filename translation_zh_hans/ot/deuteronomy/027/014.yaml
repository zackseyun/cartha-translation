  yaml_path: translation/ot/deuteronomy/027/014.yaml
  text: And the Levites shall answer and say to every man of Israel with a loud voice:[a]
translation:
  language: zh_hans
  text: 利未人要高声向以色列的每一个男子[a]回应说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“每一位以色列人”。希伯来文直译为“以色列的每一个男子”，采用阳性单数形式，具有代表全体的作用。
    reason: 说明原文阳性单数的形式、其集合性代表用法，以及较自然的可行译法。
lexical_decisions:
- source_word: וְעָנוּ
  choice: 宣告
  rationale: ענה与“说”连用时，是引出正式言说的惯用表达；此处没有明确提出问题的人，因此不机械译作“回答”，而以“宣告”体现公开、郑重的回应性发言。
- source_word: הַלְוִיִּם
  choice: 利未人
  rationale: 原文明确指“利未人”，并未缩窄为“利未祭司”。
- source_word: וְאָמְרוּ
  choice: 说
  rationale: אמר是普通的言说动词；与前面的ענה合成一个正式宣告的表达，中文以“宣告说”自然传达。
- source_word: אֶל כָּל אִישׁ יִשְׂרָאֵל
  choice: 对以色列的每一个男子
  rationale: 保留אִישׁ的阳性单数形式，同时由脚注说明它在这里具有代表全体会众的集合用法。
- source_word: קוֹל רָם
  choice: 高声
  rationale: 简明自然地表达“大声、让公众听见”的庄严宣告。
theological_decisions:
- issue: אִישׁ的阳性单数及其代表性范围
  choice: 以色列的每一个男子
  alternative: 以色列众人／每一个以色列人
  rationale: 正文保留原文的阳性单数措辞，不把它无声地改成中性表达；脚注同时指出此处可按代表性用法理解为全体以色列人，避免断言其对象仅限成年男性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“高声……宣告说”适合公开宣读盟约咒诅的礼仪场景；冒号承接下一节的宣告内容。
