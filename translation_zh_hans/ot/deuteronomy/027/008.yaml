  text: וְ/כָתַבְתָּ֣ עַל הָ/אֲבָנִ֗ים אֶֽת כָּל דִּבְרֵ֛י הַ/תּוֹרָ֥ה הַ/זֹּ֖את בַּאֵ֥ר הֵיטֵֽב־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/008.yaml
  text: And you shall write on the stones all the words of this law very clearly[a].
translation:
  language: zh_hans
  text: 你要把这律法的一切话清清楚楚地写在那些石头上。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“明明白白地”，也可理解为“写得使人清楚明白”。希伯来语在“使清楚、说明”之意的词后加上加强语气的词。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָתַבְתָּ
  choice: 你要……写
  rationale: 在这一连串指示中，带连接词的第二人称阳性单数完成式具有命令性；译为“你要”既保留单数称呼，也符合现代汉语的庄重指令语气。
- source_word: עַל הָאֲבָנִים
  choice: 在那些石头上
  rationale: עַל表示“在……上”；名词带定冠词，指向上文已经提到的特定石头，因此用“那些石头”使篇章指代在汉语中更清楚。
- source_word: אֵת כָּל דִּבְרֵי
  choice: 一切话
  rationale: כָּל דִּבְרֵי直译为“一切的话”；中文用“一切话”自然简洁，并保留“话”这一形式上的对应，不改释为“条款”或“内容”。
- source_word: הַתּוֹרָה הַזֹּאת
  choice: 这律法的
  rationale: תּוֹרָה在此申命记的盟约和法令语境中宜译作“律法”；“这”准确体现指示词הַזֹּאת。汉语按领属结构调整为“这律法的一切话”。
- source_word: בַּאֵר הֵיטֵב
  choice: 清清楚楚地
  rationale: בַּאֵר有使之清楚、说明明白之意，הֵיטֵב加强其程度。结合刻写在石头上的语境，“清清楚楚地”自然表达写得明白、清晰的要求，同时不限定为仅仅“字迹清晰”。
