  text: אֲבָנִ֤ים שְׁלֵמוֹת֙ תִּבְנֶ֔ה אֶת מִזְבַּ֖ח יְהוָ֣ה אֱלֹהֶ֑י/ךָ וְ/הַעֲלִ֤יתָ עָלָי/ו֙ עוֹלֹ֔ת לַ/יהוָ֖ה אֱלֹהֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/006.yaml
  text: You shall build the altar of Yahweh your God with whole stones[a], and you shall offer burnt offerings on it to Yahweh your God.
translation:
  language: zh_hans
  text: 你要用完整的石头[a]建造耶和华你上帝的祭坛，并要在坛上把燔祭献给耶和华你的上帝。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“未经凿琢的石头”。希伯来文直译为“完整的石头”；“未经凿琢”是根据上文不可在石头上动用铁器的吩咐（第5节）。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲבָנִים שְׁלֵמוֹת
  choice: 完整的石头
  rationale: שְׁלֵמוֹת直接表示“完整、完好”。“完整的石头”保留了原词的基本含义；结合第5节，也可理解为未经铁器凿琢的石头，因此另加脚注说明。
- source_word: תִּבְנֶה
  choice: 你要……建造
  rationale: 未完成式在这一律法指示中具有命令语气；“你要”既自然，也保留庄重的训令色彩。
- source_word: מִזְבַּח
  choice: 祭坛
  rationale: 这是献祭设施的标准现代汉语译法。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的专名“耶和华”直接呈现四字神名，而不以“主”这一称号代替。
- source_word: אֱלֹהֶיךָ
  choice: 你的上帝
  rationale: 准确表达带第二人称阳性单数后缀的归属及圣约关系。
- source_word: וְהַעֲלִיתָ עָלָיו
  choice: 并要在坛上……献
  rationale: עלה的使役式与祭物连用时指献上祭物；用“在坛上……献”符合现代汉语表达，并明确代词所指。
- source_word: עוֹלֹת
  choice: 燔祭
  rationale: 这是指祭物全部焚烧献上的专门祭祀用语；“燔祭”是准确且通行的中文圣经术语。
- source_word: לַיהוָה
  choice: 献给耶和华
  rationale: 介词ל在献祭语境中表达献祭的对象或归属，“献给”自然地传达这一关系。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 正文以专名而非“主”这一称号呈现神名。中文传统对“耶和华”的辨识度更高；“雅威”则更接近现代学界常用的拟音。两者差异属于音译选择，不改变此处神名的指称。
- issue: 是否把 שְׁלֵמוֹת 解释性地译为“未经凿琢”
  choice: 完整的石头
  alternative: 未经凿琢的石头
  rationale: 形容词本身表示“完整、完好”；“未经凿琢”来自第5节禁止动用铁器的上下文推论。正文保留直接词义，脚注保留上下文所支持的解释，避免把解释静默写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。“你要……并要……”呈现律法训令的语气；“祭坛”“燔祭”保留准确且通行的祭祀术语。正文中的脚注标记[a]与脚注对应。
