  to: “枉曲寄居者[b]、孤儿[c]和寡妇应得的公正[a]的人，必受咒诅！”全体百姓要说：“阿们！”
  rationale: 修订以“枉曲……应得的公正”直接再现“使司法公正偏离正道”的法律含义，同时保留原文未说明具体枉曲手段的概括性。“寄居者、孤儿和寡妇”及“阿们”维持既有、自然且适合庄重经文语体的术语。脚注a改为通顺的近义替代，脚注c避免把“无父者”不必要地限制为儿童。
