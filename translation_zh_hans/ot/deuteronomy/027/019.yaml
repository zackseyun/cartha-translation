base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/019.yaml
  text: Cursed is the one who perverts the justice due to the sojourner[a], the fatherless, and the widow. And all the people shall say[c][b], “Amen.”
translation:
  language: zh_hans
  text: “枉曲寄居者[b]、孤儿[c]和寡妇应得的公正[a]的人，必受咒诅！”全体百姓要说：“阿们！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“使寄居者、孤儿和寡妇应得的公正被歪曲。”
    reason: lexical_alternative
  - marker: b
    text: “寄居者”译自希伯来语 ger，指居住在以色列人中间的非本地居民。
    reason: cultural_note
  - marker: c
    text: “孤儿”也可按字面译为“无父者”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אָרוּר
  choice: 必受咒诅
  rationale: 这是立约仪式中的咒诅宣告。译作“必受咒诅”既保留其郑重的判定语气，也符合现代汉语表达。
- source_word: מַטֶּה
  choice: 使……得不到
  rationale: 该词是 נטה 的使役分词，在司法语境中指使公正偏离正轨，即枉曲或剥夺他人应得的公正。正文采用自然汉语表达其实际后果，脚注保留较贴近原文的说法。
- source_word: מִשְׁפַּט
  choice: 公正
  rationale: 此处不仅指抽象的正义，也包括弱势者在司法中应得的公平待遇；结合“使……得不到”即可清楚传达这一含义。
- source_word: גֵּר
  choice: 寄居者
  rationale: 指居住在以色列人中间、并非本地人的居民，社会地位较为脆弱。“寄居者”保留古代立约律法语境，又不直接套用现代政治或法律类别。
- source_word: יָתוֹם
  choice: 孤儿
  rationale: 指失去父亲或父母、因而缺乏家庭保障的人。“孤儿”是现代汉语中自然且庄重的对应词；脚注说明也可理解为“无父的孩子”。
- source_word: אַלְמָנָה
  choice: 寡妇
  rationale: 准确对应古代社会中这一缺乏丈夫保障的弱势群体。
- source_word: וְאָמַר כָּל הָעָם
  choice: 全体百姓都要说
  rationale: 在这一礼仪指令序列中，该结构表示全体百姓应作出的回应；“都要说”自然地保留规定性语气。
- source_word: אָמֵן
  choice: 阿们
  rationale: 这是固定的礼仪回应，表示确认并接受所宣告的话；采用通行音译可保留其庄严和立约意味。
theological_decisions:
- issue: 如何翻译古代以色列律法中的三个弱势群体
  choice: 寄居者、孤儿和寡妇
  alternative: 外来人、无父的孩子和寡妇
  rationale: 所选译法保留原文的历史与立约律法背景，突出这些群体在当时社会中的脆弱处境，同时避免把原文直接等同于任何现代移民或社会政策类别。
- issue: 如何表达 מַטֶּה מִשְׁפַּט 的司法含义
  choice: 使……得不到公正
  alternative: 枉曲……的公正；使……的公断偏离正道
  rationale: 原文可描述使司法裁断偏离正轨，也可从受害者角度理解为剥夺其应得的公平。正文选择清楚自然的结果性表达，脚注保留原文意象，未把含义限制为某一种具体司法手段。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。咒诅宣告以“必受咒诅”呈现仪式性的法律语气；弱势群体的称谓保持古代律法背景，不套用现代行政术语。正文中的脚注标记均紧随相关词语或短语。
