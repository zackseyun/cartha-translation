review_pass:
  verdict: revise
  source_fidelity: 译文准确传达了咒诅公式、受保护的三类弱势者及全体百姓的礼仪回应。但“使……得不到公正”偏重结果，较弱化了מַטֶּה מִשְׁפָּט（枉曲、歪曲司法公正）的法律动作；脚注a“所得的公断偏离正道”也不够自然，且“公断”不对应原文的通常法律含义。
  naturalness: “使寄居者、孤儿和寡妇得不到公正的”可以理解，但用“枉曲……应得的公正的人”更凝练、庄重，也更符合汉语法律及经文语体。“全体百姓都要说”自然，可略作“全体百姓要说”以贴合仪式性宣告。
  terminology: “寄居者”“孤儿”“寡妇”“阿们”均可保留。“孤儿”是自然的现代汉语；脚注宜说明其字面义为“无父者”，避免把词义限缩为儿童。“应得的公正”恰当地表达מִשְׁפָּט在此处的合法权利／公正裁断。
  issues:
  - severity: medium
    issue: 正文对“枉曲司法”的动作表达不足。
    rationale: מַטֶּה是使役分词，连同מִשְׁפַּט指枉曲或扭曲这些人的公正／合法权利；“使……得不到”虽可表达后果，却未充分保留原文的法律性动作。
  - severity: medium
    issue: 脚注a的替代译文不自然且术语不准。
    rationale: “公断”在现代汉语中不如“公正”或“司法公正”自然；“所得的公断偏离正道”句法也生硬。
  - severity: low
    issue: 脚注c将יַתּוֹם限定为“无父的孩子”。
    rationale: 该词的字面和传统法律类别是“无父者／失父者”；虽常可译“孤儿”，但“孩子”可能造成不必要的年龄限缩。
  revised_text: “枉曲寄居者[b]、孤儿[c]和寡妇应得的公正[a]的人，必受咒诅！”全体百姓要说：“阿们！”
