  text: אָר֕וּר מַשְׁגֶּ֥ה עִוֵּ֖ר בַּ/דָּ֑רֶךְ וְ/אָמַ֥ר כָּל הָ/עָ֖ם אָמֵֽן־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/018.yaml
  text: Cursed is the one who misleads a blind man on the road. And all the people shall say[a], ‘Amen.’
translation:
  language: zh_hans
  text: “使盲人在路上迷失方向的，必受咒诅。”全体百姓都要说：“阿们。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָרוּר
  choice: 必受咒诅
  rationale: 这是盟约咒诅中的断言性公式；“必受咒诅”在现代汉语中自然庄重，也保留其宣告和确定性，而非译成愿望式。
- source_word: מַשְׁגֶּה
  choice: 使……走错方向的
  rationale: 使役分词表示使人偏离、误入歧途；结合盲人与道路的具体语境，此译明确保留使役含义，并避免只理解为言语欺骗。
- source_word: עִוֵּר
  choice: 盲人
  rationale: 希伯来语为阳性单数、名词化用法，指一个具体个案；现代汉语“盲人”本身通常不标示语法性别，既准确又自然，不必添加原文没有明说的“男人”。
- source_word: בַּדָּרֶךְ
  choice: 在路上
  rationale: 此处首先是具体空间意义，指行路时被引错方向；“在路上”简明自然。
- source_word: וְאָמַר
  choice: 都要说
  rationale: 在礼仪法规的连续语境中，waw 加完成式表达规定性的将来或指令；“要说”体现全体百姓应作出的共同回应。
- source_word: כָּל הָעָם
  choice: 全体百姓
  rationale: 忠实表达“所有百姓”，不把上下文中的“以色列”增补进本节。
- source_word: אָמֵן
  choice: 阿们
  rationale: 采用现代中文圣经和礼仪中通行的音译，保留其确认、赞同盟约宣告的功能。
theological_decisions:
- issue: 名词化形容词 עִוֵּר 的性别表达
  choice: 盲人
  alternative: 盲眼的男人
  rationale: 原文形式为阳性单数，但现代汉语名词不以语法性别对应希伯来语阳性；“盲人”准确指向单一个体，又不人为增加生理性别信息。
- issue: 咒诅公式的性质
  choice: 使……的，必受咒诅
  alternative: 愿使……的人受咒诅
  rationale: 原文是断言性的盟约咒诅公式，不是单纯表达愿望；“必受咒诅”保留法律礼仪宣告的力度。
- issue: מַשְׁגֶּה 在本节中的具体含义
  choice: 使……走错方向
  alternative: 误导
  rationale: 两者都可表达使人偏离；本节提到盲人和道路，采用具体空间表达，但不将行为细化为原文未明说的某种手段。
translation_notes:
  register: 采用现代、庄重而易懂的法规—礼仪语体。前半句保留咒诅宣告的强度，后半句用“全体百姓都要说”呈现规定性的共同回应。无需脚注；中文正文已自然涵盖“使人走错方向／引入歧途”的词义范围。
