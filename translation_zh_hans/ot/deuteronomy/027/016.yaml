base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/016.yaml
  text: Cursed is the one who dishonors his father or his mother. And all the people shall say[a], “Amen.”
translation:
  language: zh_hans
  text: 轻慢父亲或母亲的，必受咒诅[a]。众民都要说：“阿们。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “轻慢”也可译作“藐视”“看不起”或“视为无足轻重”。希伯来语这个词表示把人看轻，因而以轻蔑或不尊重的态度对待。
    reason: 说明原文词义范围及可行的翻译选择，避免把所指行为理解得过窄。
lexical_decisions:
- source_word: אָרוּר
  choice: 必受咒诅
  rationale: 这是立约礼仪中的咒诅宣告。用“必受咒诅”自然表达希伯来语被动分词所指的受咒诅状态，并保留庄严的法律—礼仪语气。
- source_word: מַקְלֶה
  choice: 轻慢
  rationale: 该词源于 קלה，在此表示把人看轻、视为无足轻重，因而不予尊重。“轻慢”兼顾态度和行为，且不把含义缩窄为言语辱骂。
- source_word: אָבִיו וְאִמּוֹ
  choice: 父亲或母亲
  rationale: 原文连接词形式上是“和”，但咒诅适用于轻慢父母中的任何一方；汉语法律式表达用“或”可清楚呈现这种分举意义，不排除同时轻慢二者。
- source_word: וְאָמַר כָּל הָעָם
  choice: 众民都要说
  rationale: 保留全体百姓在立约礼仪中作出回应的意义；“都”对应 כָּל，“要说”符合此处规定礼仪回应的语境。
- source_word: אָמֵן
  choice: 阿们
  rationale: 采用现代中文圣经及礼仪中通行的音译，保留其郑重确认、表示赞同的功能。
theological_decisions:
- issue: 冒犯父母的性质
  choice: 译作“轻慢”，表达把父母看轻并不给予应有尊重
  alternative: “藐视”“不尊重”“看不起”
  rationale: 原文涵盖态度及其外在表现，并不只指内心厌恶、公开羞辱或言语咒骂。“轻慢”与尊敬父母的诫命背景相呼应，同时不额外限定具体行为。
- issue: 父亲与母亲之间连接词的理解
  choice: 译作“父亲或母亲”，体现对任一方的轻慢都落在咒诅之下
  alternative: “父亲和母亲”
  rationale: 希伯来语形式为“和”，但此处具有分举效力。译作“或”避免被误解为只有同时轻慢父母双方才适用，却不否认两者都包括在内。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“轻慢”略带正式色彩，适合法律—礼仪语境；句式简洁，保留咒诅宣告与全体回应的节奏。
