  text: וְ/זָבַחְתָּ֥ שְׁלָמִ֖ים וְ/אָכַ֣לְתָּ שָּׁ֑ם וְ/שָׂ֣מַחְתָּ֔ לִ/פְנֵ֖י יְהוָ֥ה אֱלֹהֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/007.yaml
  text: And you shall sacrifice peace offerings[a], and you shall eat there, and you shall rejoice before Yahweh your God.
translation:
  language: zh_hans
  text: 你要献平安祭[a]，在那里吃，并在耶和华你的上帝面前欢喜。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “平安祭”也可译作“团契祭”或“福祉祭”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזָבַחְתָּ
  choice: 你要献
  rationale: 在祭祀语境中，זבח指献祭；现代汉语用“献”搭配具体祭名自然、庄重，也无需重复“祭”字。
- source_word: שְׁלָמִים
  choice: 平安祭
  rationale: 这是特定祭类，涉及福祉、和好及共享祭餐。“平安祭”是中文圣经传统中清楚且通行的名称；其他可能含义以脚注保留。
- source_word: וְאָכַלְתָּ שָּׁם
  choice: 在那里吃
  rationale: 忠实表达“吃”和地点副词“在那里”；结合上下文，所吃的是祭物，但原文未在本句明说宾语，因此不补出。
- source_word: וְשָׂמַחְתָּ
  choice: 欢喜
  rationale: שׂמח在敬拜和盟约语境中表示喜乐、欢庆；“欢喜”自然且保留庆贺意味。
- source_word: לִפְנֵי
  choice: 在……面前
  rationale: 直译其空间及临在意味，适合礼仪语境。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代简体中文中最通行的专名音译呈现四字神名，而不以头衔替代。
- source_word: אֱלֹהֶיךָ
  choice: 你的上帝
  rationale: 保留希伯来文第二人称阳性单数后缀所表达的“你的”，维持对以色列整体的单数盟约称呼。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用神的专名；正文采用现代中文读者最熟悉的音译“耶和华”，而非用“主”这一头衔替换。
- issue: שְׁלָמִים 的祭类含义
  choice: 平安祭
  alternative: 团契祭；福祉祭
  rationale: 该词指一种祭祀类别，并非只陈述内心平安。“平安祭”为通行译名，同时脚注保留其团契共享与福祉层面的词义。
- issue: 祭餐的宾语是否补明
  choice: 不补出“祭物”
  alternative: 在那里吃祭物
  rationale: 原文只有“在那里吃”，宾语可由祭祀上下文推知；正文不明说，以免超出原文并消除其简洁表达。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以“你要……在那里……并……”自然呈现希伯来文连续动词，不机械重复“你要”；保留第二人称单数以及敬拜场景中的临在和喜乐意味。
