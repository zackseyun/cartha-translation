base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/026.yaml
  text: Cursed is the one who does not uphold the words of this law by doing them. And all the people shall say[a], “Amen.”
translation:
  language: zh_hans
  text: “凡不以遵行来坚守[a]这律法话语的人，必受咒诅！”全体百姓都要说：“阿们！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “坚守”也可译作“确认”或“使……确立”。这里的希伯来语动词可指维持或确认律法的效力；“以遵行来”表明，这种坚守落实在实际遵行上。
    reason: lexical_alternative
lexical_decisions:
- source_word: אָרוּר
  choice: 必受咒诅
  rationale: 这是盟约咒诅的宣告公式。“必受咒诅”在现代汉语中庄重、清楚，也自然表达希伯来语谓语形容词的宣告语气。
- source_word: אֲשֶׁר
  choice: 凡……的人
  rationale: 关系词指任何符合该情形的人；“凡……的人”保留其单数代表性和普遍适用的意味，不额外限定性别。
- source_word: לֹא יָקִים
  choice: 不坚立
  rationale: קום的使役词干在这里可表示使之成立、维持其效力或予以确认。“坚立”保留这种幅度，并避免直接译成“遵守”而与后面的“实行”完全重叠。
- source_word: דִּבְרֵי הַתּוֹרָה הַזֹּאת
  choice: 这律法上的话
  rationale: דִּבְרֵי可指“话”或“事项”，תּוֹרָה在申命记的盟约语境中宜译作“律法”。“这律法上的话”自然地指律法所载的一切规定。
- source_word: לַעֲשׂוֹת אֹתָם
  choice: 照着实行
  rationale: 不定式说明坚立律法须落实在行动上。“照着实行”保留实际履行的含义，也避免把前后两个表达压缩成一个“遵守”。
- source_word: וְאָמַר כָּל הָעָם
  choice: 全体百姓都要说
  rationale: 此处完成式配合连接词出现在礼仪和法律指示中，具有规定性、施行性的语气；“都要说”比叙事性的“都说了”更贴切。
- source_word: אָמֵן
  choice: 阿们
  rationale: “阿们”是汉语中通行的礼仪性回应，保留会众公开确认并接受咒诅条款的形式；意译为“诚然”或“愿如此”会削弱这种连续性。
theological_decisions:
- issue: יָקִים ... לַעֲשׂוֹת אֹתָם所表达的盟约义务
  choice: 咒诅临到不以实际履行来坚立律法的人，同时在译文中保留“坚立”与“实行”两个层面。
  alternative: 只理解为没有公开确认或批准律法；或将整个短语简化为没有遵守律法。
  rationale: 希伯来语把“坚立／确立”与“实行它们”相连，所指不只是口头认可，而是藉着行动维持律法的效力。译文不引入后来的神学体系，也不把两个表达合并。
- issue: אֲשֶׁר的泛指范围
  choice: 凡……的人
  alternative: 谁；那人；凡男子
  rationale: 希伯来语形式虽为阳性单数，却具有代表性和泛指作用。“凡……的人”准确表达普遍适用性，同时不无根据地限定性别。
translation_notes:
  register: 采用现代、庄重且适合公开诵读的标准普通话。“坚立”略带经文语体，但因其能保留原文动词的多重含义而采用，并以脚注说明；其余措辞力求普通读者容易理解。标点将前半句作为祭司宣告的咒诅公式，后半句作为全体百姓受命作出的礼仪回应。
