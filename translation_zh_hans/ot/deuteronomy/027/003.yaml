  text: וְ/כָתַבְתָּ֣ עֲלֵי/הֶ֗ן אֶֽת כָּל דִּבְרֵ֛י הַ/תּוֹרָ֥ה הַ/זֹּ֖את בְּ/עָבְרֶ֑/ךָ לְמַ֡עַן אֲשֶׁר֩ תָּבֹ֨א אֶל הָ/אָ֜רֶץ אֲֽשֶׁר יְהוָ֥ה אֱלֹהֶ֣י/ךָ נֹתֵ֣ן לְ/ךָ֗ אֶ֣רֶץ זָבַ֤ת חָלָב֙ וּ/דְבַ֔שׁ כַּ/אֲשֶׁ֥ר דִּבֶּ֛ר יְהוָ֥ה אֱלֹהֵֽי אֲבֹתֶ֖י/ךָ לָֽ/ךְ־־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/003.yaml
  text: And you shall write on them all the words of this law when you cross over[a], so that you may enter the land that Yahweh your God is giving you, a land flowing with milk and honey, just as Yahweh, the God of your fathers[b], spoke to you.
translation:
  language: zh_hans
  text: 你过河时，要把这律法[a]的一切话语写在那些石头上，好使你可以进入雅威——你的上帝——赐给你的土地，就是流奶与蜜之地，正如雅威——你列祖的上帝——向你所说的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “律法”也可译作“教导”。希伯来语תּוֹרָה可按语境指“教导”或“律法”；此处的盟约语境适合译作“律法”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָתַבְתָּ
  choice: 要……写
  rationale: 连接词加完成式在这一训令语境中表达命令；“要”保留庄重明确的命令语气。
- source_word: עֲלֵיהֶן
  choice: 在那些石头上
  rationale: 代词回指上一节的石头；在中文中补出“石头”，可使指代清楚而不增添新信息。
- source_word: כָּל דִּבְרֵי הַתּוֹרָה הַזֹּאת
  choice: 这律法的一切话
  rationale: 保留דִּבְרֵי的“话”以及תּוֹרָה在申命记盟约语境中的“律法”含义；脚注注明“教导”这一词义可能。
- source_word: בְּעָבְרֶךָ
  choice: 你过河时
  rationale: 介词加不定词结构表示时间；上下文所指是过约旦河，中文用“过河”自然清楚。
- source_word: לְמַעַן אֲשֶׁר תָּבֹא
  choice: 好使你可以进入
  rationale: 保留原文的目的或结果关系，不把其中较突出的逻辑张力改写成单纯的时间先后。
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: 雅威你的上帝
  rationale: 以“雅威”呈现神圣四字名，并按现代中文自然表达保留“你的上帝”。
- source_word: נֹתֵן לְךָ
  choice: 赐给你的
  rationale: 分词体现这份赐予的当前性与确定性；“赐给”符合应许之地语境，也保持庄重语体。
- source_word: אֶרֶץ זָבַת חָלָב וּדְבַשׁ
  choice: 流奶与蜜之地
  rationale: 保留希伯来文描绘丰饶的传统意象，同时采用简洁而为中文读者熟悉的表达。
- source_word: כַּאֲשֶׁר דִּבֶּר
  choice: 正如……对你所说的
  rationale: 原文动词是“说”，并未明说“应许”；译文不把语境隐含义写入正文。
- source_word: אֱלֹהֵי אֲבֹתֶיךָ
  choice: 你列祖的上帝
  rationale: “列祖”既保留原文阳性复数和盟约公式，也符合庄重而通行的现代中文圣经语域。
theological_decisions:
- issue: 神圣四字名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用神的盟约名；音译“雅威”较贴近主流学界对其古代读音的重构，也避免以称号代替专名。
- issue: אֲבֹתֶיךָ的译法
  choice: 你列祖
  alternative: 你的祖先
  rationale: 原文明确为阳性复数，并属于申命记常见的盟约公式；“列祖”保留这种表述，同时在中文中庄重而易懂。
- issue: לְמַעַן אֲשֶׁר תָּבֹא所表达的关系
  choice: 好使你可以进入
  alternative: 当你进入时
  rationale: 原文使用目的或结果结构；即使石上书写与进入土地之间的逻辑关系显得紧张，也不将其静默改写为纯时间关系。
translation_notes:
  register: 采用现代、庄重且易懂的简体中文。“那些石头”明确承接上一节；“好使”保留原文目的或结果关系；整体避免过度古雅，同时用“列祖”和“流奶与蜜之地”维持申命记盟约语言的传统厚度。
