  naturalness: “把石头抹好”较口语化，并带有原文未明说的完成性语气。改为“用石灰涂抹它们”更自然、庄重，并准确表达动词及材料。
  terminology: “约旦河”“以巴路山”“石灰”及异文“基利心山”的译名均合适。正文应继续采用“以巴路山”，并保留异文脚注。
