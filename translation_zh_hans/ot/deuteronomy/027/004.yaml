revisions:
- from: 你们过约旦河[a]以后，要在以巴路山上立起这些石头，就是我今天吩咐你们立的，并要用石灰把石头抹好。
  to: 当你们过约旦河[a]时，要照我今天吩咐你们的，在以巴路山上立起这些石头，并用石灰涂抹它们。
  rationale: 修订以“当……时”对应原文引出的未来时间情境；将“我今天吩咐你们”前置为“照我今天吩咐你们的”，在不额外明说所吩咐动作的情况下使汉语通顺，并保留该命令与立石行动的关联。末句改为“用石灰涂抹它们”，准确表达涂抹动作及其材料，避免“抹好”的完成性和口语色彩。脚注维持原有异文说明。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T04:57:32Z'
