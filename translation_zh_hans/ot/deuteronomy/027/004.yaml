base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/004.yaml
  text: And when you cross the Jordan[a], you shall set up these stones, which I am commanding you today, on Mount Ebal, and you shall plaster them with lime.
translation:
  language: zh_hans
  text: 当你们过约旦河[a]时，要照我今天吩咐你们的，在以巴路山上立起这些石头，并用石灰涂抹它们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些文本传统，尤其是撒玛利亚五经，在这里作“基利心山”，而不是“以巴路山”。
    reason: textual_variant
lexical_decisions:
- source_word: וְהָיָה בְּעָבְרְכֶם
  choice: 你们过……以后
  rationale: 句首וְהָיָה接ב加不定词结构，引出将来的时间情境。译作“……以后”符合现代汉语，也保留事情发生的先后关系。
- source_word: הַיַּרְדֵּן
  choice: 约旦河
  rationale: 该专名在此指约旦河；汉语通常补出“河”，比单说“约旦”更清楚自然。
- source_word: תָּקִימוּ
  choice: 立起
  rationale: קום的使役式在此表示把石头竖立、设立起来；“立起”简洁自然，不把石头过度解释为纪念碑。
- source_word: הָאֲבָנִים הָאֵלֶּה
  choice: 这些石头
  rationale: 按原文直译，保留普通名词“石头”，不增添原文没有明说的用途。
- source_word: אֲשֶׁר אָנֹכִי מְצַוֶּה אֶתְכֶם הַיּוֹם
  choice: 就是我今天吩咐你们立的
  rationale: 关系从句修饰“这些石头”。汉语补出由上下文明确的“立”，使指令关系清楚；“今天吩咐”传达分词的当前命令语气。
- source_word: בְּהַר עֵיבָל
  choice: 在以巴路山上
  rationale: בְּ加山名在这里表示地点；“在……山上”是自然、准确的现代汉语表达。
- source_word: וְשַׂדְתָּ אֹתָם
  choice: 并要……把石头抹好
  rationale: שׂוד表示涂抹或抹灰。以“抹好”表达施工动作；重复“石头”可避免汉语代词因前置关系从句而产生指向不清。
- source_word: בַּשִּׂיד
  choice: 用石灰
  rationale: שִׂיד指石灰或石灰质抹料。“用石灰”保留材料含义，并与“抹好”自然搭配。
theological_decisions:
- issue: 申命记27:4地点名称的文本异文
  choice: 以巴路山
  alternative: 基利心山
  rationale: 所给WLC马所拉文本读作“以巴路山”，因此正文据此翻译；撒玛利亚五经等文本传统读作“基利心山”，此重要异文以脚注保留，不在正文中擅自裁定。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“要”表达命令语气；句式略作汉语化处理，同时保留原文的时间顺序、地点、对象和石灰涂抹动作。
