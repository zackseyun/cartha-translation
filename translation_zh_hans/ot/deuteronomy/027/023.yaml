base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/023.yaml
  text: Cursed is he who lies with his mother-in-law. And all the people shall say[a], “Amen.”
translation:
  language: zh_hans
  text: “与岳母同寝[a]的人，必受诅咒！”全体百姓都要说：“阿们！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “同寝”是委婉说法，意思是“发生性关系”。希伯来原文直译为“与……躺卧”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אָרוּר
  choice: 必受诅咒
  rationale: 这是盟约诅咒宣告的述语形式；“必受诅咒”在现代汉语中自然、庄重，也传达礼仪性判词的力度。
- source_word: שֹׁכֵב עִם
  choice: 与……同寝
  rationale: 该搭配在此是指发生性关系的委婉语。“同寝”保留原文含蓄表达，同时在这项律法禁令中足以表明其性含义。
- source_word: חֹתַנְתּוֹ
  choice: 岳母
  rationale: חֹתֶנֶת 指男子的岳母，即妻子的母亲；第三人称阳性单数后缀表示“他的”。汉语“岳母”已明确包含这一关系，无须另译“他的”。
- source_word: וְאָמַר כָּל הָעָם
  choice: 全体百姓都要说
  rationale: 连接词加完成式在反复出现的礼仪公式中具有规定、指示意味；“都要说”自然表达全体百姓应作出的共同回应。
- source_word: אָמֵן
  choice: 阿们
  rationale: 保留希伯来礼仪回应的传统音译；“阿们”在现代中文圣经及礼仪语境中广为人知。
theological_decisions:
- issue: 性行为的委婉表达
  choice: 译作“与岳母同寝”
  alternative: 译作“与岳母发生性关系”
  rationale: 原文使用“与……躺卧”的惯用委婉语；正文保留其含蓄而明确的律法风格，脚注说明实际所指，避免过度直白或造成误解。
- issue: 阳性单数法律主体
  choice: 译作“……的”这一不标性别的汉语关系从句
  alternative: 显式增译“男人”或“他”
  rationale: 希伯来语分词是阳性单数，但现代汉语定中结构通常不需显出代词性别；“岳母”已表明主体是其女婿。增添“男人”并非必要，也会加入原文没有的独立名词。
- issue: 诅咒公式的效力
  choice: 译作“必受诅咒”
  alternative: 译作“是可诅咒的”或“愿……受诅咒”
  rationale: 此处是盟约礼仪中的判词，而非仅描述一种性质；“必受诅咒”保留宣告的确定性，同时不额外界定诅咒的执行方式。
translation_notes:
  register: 采用现代、庄重而易懂的法律礼仪语体。使用“岳母”准确表达亲属关系；以“同寝”保存原文的委婉性，并用脚注消除歧义。脚注标记置于相关词句之后。
