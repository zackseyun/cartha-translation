base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/020.yaml
  text: Cursed is the one who lies with his father's wife[a], because he has uncovered his father's skirt. And all the people shall say[b], ‘Amen.’
translation:
  language: zh_hans
  text: “与父亲的妻子[a]同房的人必受诅咒，因为他揭开了父亲衣服的边角[b]。”众民都要说：“阿们！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “父亲的妻子”在此可能指继母，但希伯来原文并未明确使用“继母”一词。
    reason: lexical_alternative
  - marker: b
    text: “衣服的边角”直译希伯来语כָּנָף，也可指衣服的边缘。这是与性关系有关的委婉说法，并与《利未记》18:8和20:11的禁令语言相呼应；按相关用语，也可理解为“显露了父亲的下体”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אָרוּר
  choice: 受诅咒
  rationale: 这是盟约咒诅公式中的谓语，译作“受诅咒”既准确，又符合现代汉语的庄重法律—礼仪语体。
- source_word: שֹׁכֵב עִם
  choice: 与……同寝
  rationale: 这是指性交的希伯来委婉语。“同寝”保留委婉和法律语气，又比口语化的“睡”更庄重。
- source_word: אֵשֶׁת אָבִיו
  choice: 父亲的妻子
  rationale: 原文直译为“他父亲的妻子”，没有明确使用“继母”一词；正文保留原文关系表述，以免过度限定。
- source_word: כִּי
  choice: 因为
  rationale: 在此引出受咒诅的原因；“因为”自然地表达其因果作用。
- source_word: גִלָּה כְּנַף אָבִיו
  choice: 掀开了父亲的衣襟
  rationale: כָּנָף可指翅膀、边缘或衣襟；这里构成与性关系有关的委婉意象。译文保留具体比喻，并以脚注说明其含义。
- source_word: וְאָמַר כָּל הָעָם
  choice: 众民都要说
  rationale: 体现全体百姓按礼仪作出盟约回应的公式；“要说”在现代汉语中自然表达规定性和将来性。
- source_word: אָמֵן
  choice: 阿们
  rationale: 保留已经进入汉语宗教和礼仪用语的音译，传达确认、认同咒诅之意。
theological_decisions:
- issue: 法律咒诅语境中的性委婉语
  choice: 正文保留“掀开了父亲的衣襟”这一原文意象
  alternative: 显露了父亲的下体；侵犯了父亲的婚床
  rationale: 原文并未在这里直接使用“下体”一词，而是以כָּנָף（衣襟、衣边）形成委婉表达，并与律法中禁止乱伦的语言相呼应。保留意象可避免把其确切所指单一化，同时由脚注说明其性含义。
- issue: “父亲的妻子”的身份
  choice: 不在正文直接译为“继母”
  alternative: 继母
  rationale: 上下文很可能指继母，但原文仅说“父亲的妻子”。直译保留了原文可能涵盖的关系范围，不把一种常见情形写成唯一解释。
translation_notes:
  register: 采用现代、庄重而易懂的盟约法律语体。“同寝”和“衣襟”保留原文的委婉性与形象；引号标明利未人宣告的咒诅内容，随后以“阿们”呈现众民的礼仪回应。
