id: DEU.27.5
reference: Deuteronomy 27:5
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וּ/בָנִ֤יתָ שָּׁם֙ מִזְבֵּ֔חַ לַ/יהוָ֖ה אֱלֹהֶ֑י/ךָ מִזְבַּ֣ח אֲבָנִ֔ים לֹא תָנִ֥יף עֲלֵי/הֶ֖ם בַּרְזֶֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/005.yaml
  text: And there you shall build an altar to Yahweh your God[a], an altar of stones[b]; you shall not wield iron upon them.
translation:
  language: zh_hans
  text: 你要在那里为雅威[a]你的神筑一座坛，一座石坛；不可在那些石头上动用铁器。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威”译自希伯来文神名 יהוה（YHWH）；中文也常译作“耶和华”。
    reason: divine_name
  - marker: b
    text: 原文直译：“不可把铁动在它们上面。”意思也可译作：“不可用铁制工具加工那些石头。”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָנִיתָ
  choice: 你要筑
  rationale: 连词加完成式在这一指示语境中具有命令或义务色彩；“你要”自然保留律法式语气。
- source_word: שָׁם
  choice: 在那里
  rationale: 直接表达地点副词，并承接上文所指定的地方。
- source_word: מִזְבֵּחַ
  choice: 坛
  rationale: 在献祭语境中，这是现代中文圣经用语中简明而通行的对应词。
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: 为雅威你的神
  rationale: 介词 ל 表明坛是为雅威而筑；“你的神”保留第二人称单数及盟约关系的直接表达。
- source_word: מִזְבַּח אֲבָנִים
  choice: 一座石坛
  rationale: 以自然中文表达“石头的坛”，准确保留材料方面的规定。
- source_word: לֹא תָנִיף עֲלֵיהֶם בַּרְזֶל
  choice: 不可在那些石头上动用铁器
  rationale: נוף 的使役式在此表示把铁制工具施用于石头；“动用铁器”比逐字译为“举铁在其上”更清楚，同时脚注保留原文较为凝练的说法。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名 יהוה；正文采用较接近学界通常重构读音的音译“雅威”，脚注列出中文传统中广为人知的“耶和华”，不以称号替代专名。
- issue: בַּרְזֶל 是材料名还是工具名
  choice: 铁器
  alternative: 铁
  rationale: 原文直说“铁”，但语境所禁的是用铁制工具加工石头。正文采用中文可理解的“铁器”，并在脚注说明原文的字面形式，以保留其表达张力。
translation_notes:
  register: 采用现代、庄重而易懂的指示语体。“筑坛”保留经文语域中的凝练表达；分号呈现筑坛命令与禁用铁器规定之间的紧密关系。
