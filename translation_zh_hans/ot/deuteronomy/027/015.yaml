revisions:
- from: “制造雕刻的神像或铸造的神像，并暗中安放的人，必受咒诅！那是耶和华[a]所憎恶的，是匠人亲手制作的。”全体百姓都要回应说：“阿们！”
  to: “凡制造雕刻的神像或铸造的神像——这是耶和华[a]所憎恶的、匠人亲手制作的——又暗中把它安放起来的人，必受咒诅！”全体百姓都要回应说：“阿们！”
  rationale: 修订恢复原文的句法关系：咒诅针对制造偶像并暗中安放偶像的人；偶像是耶和华所憎恶、由匠人亲手制作之物。措辞维持现代标准汉语的庄重礼仪语体，未增添有关偶像用途或材质的信息。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T04:57:34Z'
review_pass:
  verdict: revise
  source_fidelity: 原文的咒诅对象是“制造……并暗中安放它的人”；其中“是耶和华所憎恶的、匠人手所做的”是对所造之像的插入性说明。草稿将这说明置于“必受咒诅”之后并以“那是”另起句，容易使其指向前述整项行为，且弱化了原文的句法关联。修订以破折号保留原文的插入说明，并明确“暗中安放”的宾语承接神像。
  naturalness: 草稿中“那是耶和华所憎恶的，是匠人亲手制作的”在现代汉语中指代及句法都略显生硬。修订后的“这是耶和华所憎恶的、匠人亲手制作的”作为插入语更自然、庄重。
  terminology: “雕刻的神像”“铸造的神像”“必受咒诅”“耶和华”“阿们”均可接受；“耶和华所憎恶的”恰当地传达 תּוֹעֲבַת יהוה 的强烈否定评价。保留现有神名脚注。
  issues:
  - severity: medium
    issue: “那是”在现有标点和语序下的指代范围不够明确。
    rationale: 原文中“耶和华所憎恶的、匠人手所做的”紧接“雕刻的像或铸造的像”，说明的是偶像；将其改作破折号内的插入说明，可避免读者理解为“暗中安放的行为”本身是“匠人亲手制作的”。
  - severity: low
    issue: “暗中安放”未明确承接前述神像。
    rationale: 希伯来文动词的宾语指向所制作的像。补出汉语所需的代词“它”并不增添意义，且使衔接清楚。
  revised_text: “凡制造雕刻的神像或铸造的神像——这是耶和华[a]所憎恶的、匠人亲手制作的——又暗中把它安放起来的人，必受咒诅！”全体百姓都要回应说：“阿们！”
  revised_footnotes:
