    text: “耶和华”对应希伯来文神名 יהוה（YHWH），也常译作“雅威”。
    reason: 说明神名的原文形式及常见替代音译。
  revision_rationale: 修订恢复原文的句法关系：咒诅针对制造偶像并暗中安放偶像的人；偶像是耶和华所憎恶、由匠人亲手制作之物。措辞维持现代标准汉语的庄重礼仪语体，未增添有关偶像用途或材质的信息。
