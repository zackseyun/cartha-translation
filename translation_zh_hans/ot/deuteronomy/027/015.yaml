source:
  edition: WLC
  text: אָר֣וּר הָ/אִ֡ישׁ אֲשֶׁ֣ר יַעֲשֶׂה֩ פֶ֨סֶל וּ/מַסֵּכָ֜ה תּוֹעֲבַ֣ת יְהוָ֗ה מַעֲשֵׂ֛ה יְדֵ֥י חָרָ֖שׁ וְ/שָׂ֣ם בַּ/סָּ֑תֶר וְ/עָנ֧וּ כָל הָ/עָ֛ם וְ/אָמְר֖וּ אָמֵֽן־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/015.yaml
  text: Cursed is the man who makes a carved image or a cast image—an abomination to Yahweh[a], the work of the hands of a craftsman—and sets it up in secret. And all the people shall answer and say[b], “Amen.”
translation:
  language: zh_hans
  text: “凡制造雕刻的神像或铸造的神像——这是耶和华[a]所憎恶的、匠人亲手制作的——又暗中把它安放起来的人，必受咒诅！”全体百姓都要回应说：“阿们！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “耶和华”对应希伯来文神名 יהוה（YHWH），也常译作“雅威”。
    reason: 说明神名的原文形式及常见替代音译。
lexical_decisions:
- source_word: אָרוּר
  choice: 必受咒诅
  rationale: 这是盟约咒诅的宣告用语；“必受咒诅”既保留司法与礼仪力度，也符合现代汉语表达。
- source_word: הָאִישׁ אֲשֶׁר
  choice: ……的人
  rationale: 希伯来文使用阳性单数代表性法律句式；汉语“……的人”自然涵盖该类行为者，不额外引入性别限定。
- source_word: פֶסֶל
  choice: 雕刻的神像
  rationale: 保留该词所指经雕刻制成之像的具体制作方式；“神像”在上下文中清楚表达敬拜对象。
- source_word: מַסֵּכָה
  choice: 铸造的神像
  rationale: 该词指以浇铸方式制成的像，通常但不必明说是金属，因此不在正文中增添“金属”。
- source_word: תּוֹעֲבַת יְהוָה
  choice: 耶和华所憎恶的
  rationale: 以自然汉语传达其为耶和华厌恶、可憎之物的强烈盟约评价。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神名音译，并以脚注说明其对应希伯来文四字神名。
- source_word: מַעֲשֵׂה יְדֵי חָרָשׁ
  choice: 匠人亲手制作的
  rationale: 自然传达“匠人双手的作品”，并突出神像是人手制造的。
- source_word: וְשָׂם בַּסָּתֶר
  choice: 并暗中安放
  rationale: “安放”适合神像这一宾语；“暗中”保留隐秘行事的含义，但不擅自补出“设立敬拜”等信息。
- source_word: וְעָנוּ כָל הָעָם וְאָמְרוּ
  choice: 全体百姓都要回应说
  rationale: 保留礼仪中全体会众按宣告作出应答的正式结构。
- source_word: אָמֵן
  choice: 阿们
  rationale: 沿用汉语中公认的礼仪音译，保留认同并确认咒诅宣告的功能。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 两者都试图表达四字神名；正文采用中文读者最熟悉且庄重的“耶和华”，脚注交代其为神名而非普通称号。
- issue: 盟约咒诅对象的代表性阳性单数
  choice: ……的人
  alternative: 那男人
  rationale: 原文 הָאִישׁ 为阳性单数，但在法律咒诅公式中具有代表性；现代汉语用“……的人”既不把范围误限于男性，也不改变其单数代表结构。
- issue: תּוֹעֵבָה 的力度
  choice: 所憎恶的
  alternative: 可憎之物
  rationale: 选择自然、庄重的谓语结构，保留神对偶像的强烈否定，不将其弱化为一般的不喜欢。
translation_notes:
  register: 采用庄重而清晰的现代标准汉语。引号内先呈现利未人宣告的咒诅内容，再呈现全体百姓的礼仪回应；避免古奥的“雕像、铸像者当受诅咒”等压缩句式。
