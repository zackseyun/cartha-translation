  text: אָר֗וּר שֹׁכֵב֙ עִם אֲחֹת֔/וֹ בַּת אָבִ֖י/ו א֣וֹ בַת אִמּ֑/וֹ וְ/אָמַ֥ר כָּל הָ/עָ֖ם אָמֵֽן־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/022.yaml
  text: Cursed is the one who lies with his sister[a], the daughter of his father or the daughter of his mother. And all the people shall say, “Amen.”
translation:
  language: zh_hans
  text: “与自己的姐妹——父亲的女儿或母亲的女儿——发生性关系的人，必受咒诅。”全体百姓都要说：“阿们！”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָרוּר
  choice: 必受咒诅
  rationale: 这是盟约咒诅公式中的谓语形容词；“必受咒诅”在现代汉语中庄重自然，并保留宣告性的效力。
- source_word: שֹׁכֵב עִם
  choice: 与……同寝
  rationale: 该希伯来语习语指发生性关系。“同寝”保留原文委婉而庄重的表达，也符合律法语境。
- source_word: אֲחֹתוֹ
  choice: 自己的姐妹
  rationale: 直接表达带第三人称阳性单数后缀的亲属称谓；汉语用“自己的”清楚衔接泛指的违法者。
- source_word: בַּת אָבִיו אוֹ בַת אִמּוֹ
  choice: 父亲的女儿或母亲的女儿
  rationale: 照原文保留并列的亲属界定，不擅自将范围缩限为同父异母或同母异父的姐妹。
- source_word: וְאָמַר כָּל הָעָם
  choice: 全体百姓都要说
  rationale: 承接礼仪性命令序列；“都要说”自然表达规定全体共同回应的语气。
- source_word: אָמֵן
  choice: 阿们
  rationale: 采用现代中文圣经及礼仪中通行的音译，保留其确认、赞同咒诅宣告的功能。
theological_decisions:
- issue: 乱伦禁令的范围
  choice: 保留“姐妹”以及“父亲的女儿或母亲的女儿”的双重表述
  alternative: 明确译作“同父异母或同母异父的姐妹”
  rationale: 原文以父系或母系亲缘说明“姐妹”，可涵盖全姐妹及半姐妹；翻译不应将其缩限为只有半姐妹。
- issue: 法律公式中的阳性单数主体
  choice: 用“……的”构成泛指法律主体，并以“自己的姐妹”表达关系
  alternative: 明确译作“男人”或“人”
  rationale: 希伯来语采用阳性单数分词，但在咒诅公式中指涉违法者。汉语无须增添原文没有的名词，既自然又保留泛指功能。
- issue: “阿们”的礼仪意义
  choice: 保留音译“阿们”
  alternative: 意译为“诚心所愿”或“愿如此”
  rationale: 音译既符合汉语通行用法，也避免把此处百姓对盟约咒诅的确认仅理解为愿望。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语，保留希伯来律法公式的节奏和亲属关系的重复界定。“同寝”兼顾原文委婉表达与现代读者可理解性；不另设脚注，因为正文已逐项呈现“父亲的女儿或母亲的女儿”。
