base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/010.yaml
  text: So you shall listen to the voice of Yahweh your God and do his commandments and his statutes that I am commanding you today[a].
translation:
  language: zh_hans
  text: 所以，你要听从雅威——你的上帝的声音，遵行他的诫命和律例，就是我今日吩咐你的。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“服从雅威——你的上帝。”希伯来语“听……的声音”这一习语常含有顺服的意思。
    reason: 词义替代译法：说明 שׁמע בְּקוֹל 的习语含义。
lexical_decisions:
- source_word: וְשָׁמַעְתָּ בְּקוֹל
  choice: 所以，你要听从……的声音
  rationale: שׁמע בְּקוֹל 表示留心听取，并通常含有服从之意。“听从……的声音”既保留希伯来语的“声音”意象，也不把含义完全缩减为单独的“服从”；后句“遵行”进一步明确行动上的顺服。句首 וְ 结合上下文译为“所以”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 这是以色列上帝的专名四字神名。采用现代汉语对 Yahweh 的常见音译“雅威”，以区别于作为称号的“主”，并避免用源于 Jehovah 形式的音译取代原名。
- source_word: אֱלֹהֶיךָ
  choice: 你上帝
  rationale: 直译第二人称单数所属结构，表明雅威是受话者的上帝；“上帝”是自然、庄重的现代汉语表达。
- source_word: וְעָשִׂיתָ
  choice: 遵行
  rationale: עָשָׂה 在诫命语境中指实行、履行。“遵行”比单纯“做”更符合现代汉语搭配，同时准确表达把命令付诸行动。
- source_word: מִצְוֺתָיו
  choice: 他的诫命
  rationale: “诫命”保留 מִצְוָה 在盟约和律法语境中的正式含义。
- source_word: חֻקָּיו
  choice: 律例
  rationale: “律例”是清楚而庄重的法律用语，并与前面的“诫命”有所区分。
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: 就是我今日吩咐你的
  rationale: 关系从句修饰前面的“诫命和律例”。“今日”保留申命记反复强调的当下立约时刻，“吩咐”自然表达讲话者正在颁布命令。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文使用上帝的专名而非称号。“雅威”较直接反映学界通常重构的 Yahweh 读音；“耶和华”源于 Jehovah 的传统形式，“主”则会把专名替换为称号。
- issue: “听声音”与“服从”的关系
  choice: 正文译作“听从……的声音”，并以脚注说明服从义
  alternative: 直接译作“服从雅威你上帝”
  rationale: 该希伯来习语确实包含顺服意味，但保留“声音”能呈现原文意象，并让后面的“遵行”承担明确的行动含义，避免消除原文措辞中的层次。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“今日”“诫命”“律例”保留经文的盟约和律法语体；句法尽量简洁，适合普通读者朗读与理解。
