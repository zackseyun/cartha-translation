  text: 那一天，摩西吩咐百姓说：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְצַו
  choice: 吩咐
  rationale: צוה表示带有权威地发出命令或指示。“吩咐”既保留其权威意味，也自然适合摩西向百姓宣告下文命令的叙事语境。
- source_word: מֹשֶׁה
  choice: 摩西
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: אֶת הָעָם
  choice: 百姓
  rationale: עָם在这里统指以色列民众；“百姓”简洁自然，并符合本段的共同体语境。
- source_word: בַּיּוֹם הַהוּא
  choice: 那一天
  rationale: 明确保留时间指示，与希伯来文“在那日”相应；中文中“那一天”自然清楚。
- source_word: לֵאמֹר
  choice: 说
  rationale: 该不定式引出下一节所载命令的具体内容；译作“说”保留希伯来叙事衔接方式，同时符合现代中文表达。
theological_decisions: []
translation_notes:
