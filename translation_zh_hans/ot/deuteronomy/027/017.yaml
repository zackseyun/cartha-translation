  text: אָר֕וּר מַסִּ֖יג גְּב֣וּל רֵעֵ֑/הוּ וְ/אָמַ֥ר כָּל הָ/עָ֖ם אָמֵֽן־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/017.yaml
  text: Cursed is the one who moves his neighbor’s boundary marker. And all the people shall say[a], “Amen.”
translation:
  language: zh_hans
  text: “挪移邻舍地界[a]的人受诅咒！”全体百姓都要说：“阿们！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“界标”。希伯来语可指产业的边界，也可指划定边界的标志。
    reason: lexical_alternative
lexical_decisions:
- source_word: אָרוּר
  choice: 受诅咒
  rationale: 这是盟约法律语境中的咒诅宣告。译作“受诅咒”既保留其正式、司法性的力度，也符合现代汉语表达。
- source_word: מַסִּיג
  choice: 挪移……的人
  rationale: 该分词指实施这种行为的人；“挪移”既可表达移走，也可表达为侵占土地而改变原有位置，比单译“拆除”更准确。
- source_word: גְּבוּל
  choice: 地界
  rationale: 此词在土地法律语境中指产业的边界，也可具体指划定边界的标志。“地界”自然简洁，并保留边界与界标之间的语义张力。
- source_word: רֵעֵהוּ
  choice: 邻舍
  rationale: 此词在群体内部的人际和法律语境中指同胞或近邻；“邻舍”庄重而清楚，并保留原文的关系含义。
- source_word: וְאָמַר
  choice: 都要说
  rationale: 该动词延续礼仪性、法律性的宣告格式；“要说”自然表达群体应作出的正式回应。
- source_word: כָּל הָעָם
  choice: 全体百姓
  rationale: 准确表达“所有百姓”，不把上下文所指的以色列人明加进正文。
- source_word: אָמֵן
  choice: 阿们
  rationale: “阿们”是现代汉语中通行的礼仪回应，保留希伯来语对所宣告之事的共同确认。
theological_decisions:
- issue: 盟约法律语境中的咒诅格式
  choice: “挪移邻舍地界的人受诅咒！”
  alternative: “挪移邻舍界标的人必受诅咒！”
  rationale: 原文是对侵占他人土地之行为作出的正式盟约咒诅。“受诅咒”保留宣告语气，又不额外强化为时间性的预言；“地界”则保留原词既可指边界、又可指界标的范围。
- issue: 阳性单数分词的代表性用法
  choice: “……的人”
  alternative: “挪移邻舍地界的男子”
  rationale: 原文阳性单数分词在法律条文中代表任何实施该行为的人。“……的人”保留单数个案的代表性，又不把语法性别误解为只限男性。
translation_notes:
  register: 采用现代、庄重而易懂的法律—礼仪语体。“挪移地界”保留土地侵占的古代背景；“全体百姓都要说”清楚呈现共同确认盟约咒诅的回应。
