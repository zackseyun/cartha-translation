  yaml_path: translation/ot/deuteronomy/032/040.yaml
  text: For I lift up my hand to heaven and say[a], ‘As I live forever,’
translation:
  language: zh_hans
  text: 因为我向天举手，说：“我永远活着[a]，”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较形式对应地译作：“我永远活着。”这里的希伯来语在举手的语境中构成自我起誓的公式。
    reason: 说明字面陈述与举手起誓语境中的誓言功能之间的关系，并保留形式对应的译法。
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，为前面的宣告提供庄严的根据；保留因果性的篇章联系，不改作时间从句。
- source_word: אֶשָּׂא
  choice: 举
  rationale: נשׂא在这里指起誓时举手的动作；“举手”自然、具体，也保留原文意象。
- source_word: אֶל שָׁמַיִם
  choice: 向天
  rationale: 准确表达朝向天空的方向；现代汉语通常用单数概念“天”，无需机械体现希伯来语的复数形态。
- source_word: יָדִי
  choice: 手
  rationale: 保留原文单数；汉语在主语明确时不必重复领属代词，“我向天举手”已自然表达“我的手”。
- source_word: וְאָמַרְתִּי
  choice: 说
  rationale: 与前面的举手动作构成连续的庄严宣告；采用自然的直接引语表达，不强化为原文未明说的“宣告”。
- source_word: חַי אָנֹכִי
  choice: 我既……活着
  rationale: 在起誓语境中用“既”引出誓言的条件式前件，传达“我若活着／正如我活着”这一誓言公式的作用，同时仍保留“我活着”的字面内容。
- source_word: לְעֹלָם
  choice: 永远
  rationale: 简明表达无尽、恒久的时间，直接修饰上帝的“活着”。
theological_decisions:
- issue: 如何表达上帝以自己的永生所作的誓言
  choice: 我既永远活着
  alternative: 我永远活着；我凭我的永生起誓
  rationale: 原文形式上是“我永远活着”，但在举手语境中具有自我起誓的力量。“我既永远活着”保留陈述内容，并让本句自然成为下文誓言结果的前件；避免只译成普通事实陈述，也避免把原文完全改写为解释性的“凭我的永生起誓”。
translation_notes:
  register: 采用现代、庄重而易懂的汉语。引号内的誓言跨至下一节才完整，因此本节末保留逗号，不人为补足誓言结果。
