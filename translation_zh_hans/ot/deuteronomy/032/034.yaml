  text: הֲ/לֹא ה֖וּא כָּמֻ֣ס עִמָּ/דִ֑י חָתֻ֖ם בְּ/אוֹצְרֹתָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/034.yaml
  text: Is it not laid up with me[b][a], sealed in my storehouses?
translation:
  language: zh_hans
  text: 这不是存放在我这里[a]，封存在我的库房里[b]吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “存放在我这里”或译“藏在我这里”。
    reason: lexical_alternative
  - marker: b
    text: “库房”或译“宝库”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: 这不是……吗
  rationale: 保留原文期待肯定回答的反问语气，同时符合现代汉语表达。
- source_word: הוּא
  choice: 这
  rationale: 希伯来语为阳性单数代词，但在上下文中可概括前述之事；用“这”既自然，也不把所指强行解释为男性个体。
- source_word: כָּמֻס
  choice: 存放
  rationale: 该被动分词可指隐藏或储存起来；“存放”与下文库房的意象衔接自然，又不额外强调价值。
- source_word: עִמָּדִי
  choice: 在我这里
  rationale: 直接表达“与我同在、由我保管”的意思，保留其归属和掌管意味而不作扩展解释。
- source_word: חָתֻם
  choice: 封存
  rationale: 准确传达被封住、妥善保管的状态，并与存放于库房的语境相称。
- source_word: בְּאוֹצְרֹתָי
  choice: 在我的库房里
  rationale: אוֹצָר可指库房或宝库；“库房”突出储藏处所，不把含义过窄地限定为金银财宝。
theological_decisions:
- issue: 被存放并封存之物的所指
  choice: 用非人格化的“这”概括前文所述之事，不明确限定为罪责记录或预留的审判
  alternative: 译作人格化的“他”，或用“这事”明确指向前述威胁
  rationale: 原文代词虽为阳性单数，其确切先行词仍有含混之处；“这”保留这种含混，避免把它擅自解释为某个人或某一特定神学概念。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。整句使用“这不是……吗”的反问结构，保留原文语气；“存放—封存—库房”维持连贯的储藏意象。
