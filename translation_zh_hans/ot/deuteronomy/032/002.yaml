base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/002.yaml
  text: May my teaching fall like the rain[a]; may my speech drip like the dew, like showers upon the tender grass[b], and like abundant rain upon the green plants.
translation:
  language: zh_hans
  text: 愿我的教导如雨降下[a]；愿我的言语如露滴落，又如细雨落在嫩草上[b]，如丰沛的雨落在植物上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “降下”也可译作“滴下”或“滴落”；希伯来语动词描绘教导像雨水一样从上而降。
    reason: lexical_alternative
  - marker: b
    text: “细雨”所译的希伯来语词较为罕见，也可能指小雨或雨滴。
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעֲרֹף
  choice: 降下
  rationale: 此动词在诗歌语境中描绘水滴般自上而下的动作；“降下”与“如雨”搭配自然，也保留降雨意象。
- source_word: לִקְחִי
  choice: 我的教导
  rationale: לֶקַח 指所传授或领受的教训、教导；此处与摩西所宣讲的内容相合。
- source_word: תִּזַּל
  choice: 滴落
  rationale: נזל 可指流淌或滴下；与露水相比时，“滴落”最能保留轻柔的水滴意象。
- source_word: אִמְרָתִי
  choice: 我的言语
  rationale: אִמְרָה 可指话语或言说；“言语”与“教导”构成自然的诗歌平行。
- source_word: שְׂעִירִם
  choice: 细雨
  rationale: 这是罕见且释义有争议的词，在本语境中应指轻微的雨或雨滴；“细雨”自然易懂，并保留与后文较丰沛雨水的对照。
- source_word: דֶשֶׁא
  choice: 嫩草
  rationale: דֶּשֶׁא 指新生、鲜嫩的草木或嫩绿植物；“嫩草”简洁地表达这种生长状态。
- source_word: רְבִיבִים
  choice: 甘霖
  rationale: רְבִיבִים 指丰沛的阵雨；“甘霖”在现代庄重汉语中指滋润草木的充足雨水，适合本诗意象，但不强调破坏性的暴雨。
- source_word: עֵשֶׂב
  choice: 青翠的植物
  rationale: עֵשֶׂב 泛指草本植物或地上植被，范围比“草”更广；“青翠的植物”通俗，并与前面的“嫩草”有所区别。
