  text: בְּ/הַנְחֵ֤ל עֶלְיוֹן֙ גּוֹיִ֔ם בְּ/הַפְרִיד֖/וֹ בְּנֵ֣י אָדָ֑ם יַצֵּב֙ גְּבֻלֹ֣ת עַמִּ֔ים לְ/מִסְפַּ֖ר בְּנֵ֥י יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/008.yaml
  text: When the Most High gave the nations their inheritance[a], when he separated the sons of man[b], he fixed the boundaries of the peoples according to the number of the sons of Israel.
translation:
  language: zh_hans
  text: 至高者把产业分给列国时，他使世人彼此分开[b]，按照以色列子孙[a]的数目，划定万民的疆界。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 死海古卷和《七十士译本》作“上帝的众子”（或“上帝的使者”），而不是“以色列子孙”。
    reason: textual_variant
  - marker: b
    text: “世人”原文直译为“人的众子”，是指人或全人类的希伯来语表达。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּהַנְחֵל
  choice: 把产业分给……时
  rationale: נחל 的使役式不定词配合前缀 בְּ 构成时间从句，表示至高者为列国分配产业；此译法自然地保留了“使其承受产业”的分配含义。
- source_word: עֶלְיוֹן
  choice: 至高者
  rationale: 这里是对上帝的称号；“至高者”简洁、庄重，并保留原文称号的力量。
- source_word: גּוֹיִם
  choice: 列国
  rationale: 指世上各国，而非后期语境中特指与犹太人相对的“外邦人”；“列国”也符合诗歌体裁。
- source_word: בְּהַפְרִידוֹ
  choice: 他使……彼此分开时
  rationale: פרד 表示分开、分离；使役式及第三人称阳性单数后缀以上文的至高者为施事者。加入“彼此”使现代汉语关系清楚，却不把含义收窄为特定历史事件。
- source_word: בְּנֵי אָדָם
  choice: 世人
  rationale: 这是指人类的希伯来语表达。译作“世人”比逐字的“人的众子”自然，同时以脚注保留该表达的字面形式。
- source_word: יַצֵּב
  choice: 划定
  rationale: יצב 的使役式有稳固设立之意；与“疆界”搭配时，“划定”自然表达权威而明确地确定边界。
- source_word: גְּבֻלֹת עַמִּים
  choice: 万民的疆界
  rationale: גְּבֻלוֹת 指边界或疆界，עַמִּים 指诸民族或众民；“万民的疆界”保留诗意，也避免与前面的“列国”机械重复。
- source_word: לְמִסְפַּר
  choice: 按照……的数目
  rationale: 介词短语表示对应的尺度或数量关系；此译法不额外说明这种对应关系具体如何实现。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列子孙
  rationale: 马所拉文本作“以色列的众子”；“以色列子孙”是准确、自然且具有经文语体的表达。重要异文另见脚注。
theological_decisions:
- issue: 末句的文本异文
  choice: 以色列子孙
  alternative: 上帝的众子／上帝的使者
  rationale: 所提供的 WLC 马所拉文本作 בְּנֵי יִשְׂרָאֵל，因此正文据此翻译。死海古卷和《七十士译本》所反映的异文会显著影响本节的世界观和解释，故在脚注中明确保留，不予静默调和。
- issue: בְּנֵי אָדָם 的人类学表达
  choice: 世人
  alternative: 人的众子／亚当的子孙／人类
  rationale: 该希伯来语表达在这里泛指人类。现代汉语的“世人”准确涵盖其代表性含义；脚注说明其字面结构，以免原文意象完全消失。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语体。“列国／万民”体现原文 גּוֹיִם／עַמִּים 的词语变化；正文按 WLC 翻译，同时通过脚注明示关键异文。
