  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר אַסְתִּ֤ירָה פָנַ/י֙ מֵ/הֶ֔ם אֶרְאֶ֖ה מָ֣ה אַחֲרִיתָ֑/ם כִּ֣י ד֤וֹר תַּהְפֻּכֹת֙ הֵ֔מָּה בָּנִ֖ים לֹא אֵמֻ֥ן בָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/020.yaml
  text: And he said[a], “I will hide my face from them; I will see what their end will be, for they are a perverse generation[b], children in whom there is no faithfulness.”
translation:
  language: zh_hans
  text: 他说：“我要向他们掩面，看他们的结局如何；因为他们是乖谬的一代[a]，是毫无忠信的儿女[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“充满种种乖谬的一代”。希伯来语直译为“种种颠倒（或扭曲）的一代”。
    reason: lexical_alternative
  - marker: b
    text: “忠信”也可译为“可靠”“可信”或“忠诚”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַסְתִּירָה פָנַי מֵהֶם
  choice: 我要向他们掩面
  rationale: 保留希伯来语“隐藏我的脸”这一盟约性惯用语及“面”的意象，表达上帝收回眷顾与同在，而不将其淡化为单纯的忽视或离开。
- source_word: אֶרְאֶה מָה אַחֲרִיתָם
  choice: 看他们的结局如何
  rationale: אַחֲרִית可指末后、结局或结果；“结局”简洁庄重，并保留原文未明确说明具体下场的开放性。
- source_word: דּוֹר תַּהְפֻּכֹת
  choice: 乖谬的一代
  rationale: תַּהְפֻּכֹת为复数名词，可指种种颠倒、扭曲或悖谬；“乖谬的一代”在现代汉语中自然而庄重，传达其道德偏邪。复数名词结构另在脚注说明。
- source_word: בָּנִים
  choice: 儿女
  rationale: 此处泛指作为上帝儿女的百姓，并非只指男性；“儿女”自然保留亲属与盟约关系的意味。
- source_word: לֹא אֵמֻן בָּם
  choice: 毫无忠信
  rationale: אֵמֻן表示忠实、可靠或可信；“忠信”兼顾关系中的忠诚与品格上的可信，符合本节的盟约语境。
theological_decisions:
- issue: 上帝“掩面”的拟人化盟约用语
  choice: 保留“我要向他们掩面”
  alternative: 我要转身离开他们／我要不理会他们
  rationale: 原文“面”的意象在申命记中具有重要的盟约含义，指上帝收回眷顾与可感的同在；直译此意象可避免过度界定上帝采取行动的方式。
- issue: אֵמֻן的关系性含义
  choice: 忠信
  alternative: 可靠／可信／忠诚
  rationale: 这里责备的不是缺少抽象意义上的信念，而是缺少应有的忠诚与可信；“忠信”较完整地保留这种道德和盟约性的张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“向他们掩面”保留原文核心意象；“乖谬”虽略带书面色彩，但在此诗歌性审判宣告中清楚有力。平行结构以“他们是……，是……”呈现，保留希伯来诗句的节奏。
