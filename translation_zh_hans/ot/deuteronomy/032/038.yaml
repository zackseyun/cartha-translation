  text: who ate the fat of their sacrifices and drank the wine of their drink offerings—let them rise up and help you; let them be your shelter.
translation:
  language: zh_hans
  text: 那些吃了他们祭牲脂肪、喝了他们奠祭之酒的神明呢？让它们起来帮助你们，让它们成为你们的庇护吧！
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֵלֶב זְבָחֵימוֹ
  choice: 你们祭牲脂肪
  rationale: חֵלֶב 指祭牲的脂肪，זְבָחֵימוֹ 在本节讥讽性的引述中指以色列献给假神的祭牲；采用“祭牲脂肪”既贴近原文，也自然易懂。
- source_word: יֵין נְסִיכָם
  choice: 你们奠祭之酒
  rationale: נֶסֶךְ 在祭祀语境中指奠祭；译作“奠祭之酒”比单说“奠酒”更明确保留 יֵין“酒”。
- source_word: סִתְרָה
  choice: 庇护
  rationale: 该词源于“隐藏、遮蔽”的词根，在此表示提供遮护或保护；“庇护”保留其遮蔽保护的意象，不扩大为更抽象的“避难所”。
theological_decisions:
- issue: 关系从句所指对象
  choice: 明确补出“神明”，并以“它们”承接
  alternative: 保留为“那些吃……喝……的”而不点明对象
  rationale: 上节的“神”是本节关系从句的先行项；汉语若完全照搬会悬空难解。补出“神明”是依据上下文恢复省略，并不改变讥讽对象。
- issue: 命令语气的讥讽性质
  choice: 译为“让它们起来帮助你们……吧”
  alternative: 译为直接祈愿“愿它们起来帮助你们”
  rationale: 两个未完成式在此承接反问和审判语境，带挑战、讥讽意味；“让……吧”自然呈现这种命令式挑战，同时不额外解释神学含义。
translation_notes:
  register: 采用庄重而通顺的现代汉语。以“就是那些……”衔接上文所提的神明，并保留本节强烈的讥讽挑战语气；“祭牲”“奠祭”“庇护”属于普通读者可理解的礼仪和保护用语。
