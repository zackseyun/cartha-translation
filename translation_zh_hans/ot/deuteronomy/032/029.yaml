base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/029.yaml
  text: If only they were wise[a], they would understand this; they would discern their end.
translation:
  language: zh_hans
  text: 但愿他们有智慧，明白这事，洞察自己的结局[a]！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “结局”或译“将来”或“后来会怎样”。希伯来词可指最终的结果，也可指以后之事。
    reason: lexical_alternative
lexical_decisions:
- source_word: ל֥וּ
  choice: 但愿
  rationale: 该词在这里表达愿望和叹惋，不只是提出普通条件；“但愿”自然传达这种祈愿语气。
- source_word: חָכְמ֖וּ
  choice: 他们有智慧
  rationale: חכם在此表示具有或运用智慧；“有智慧”既贴近原文，也符合现代汉语表达。
- source_word: יַשְׂכִּ֣ילוּ
  choice: 能明白
  rationale: שׂכל的使役形可指明白、洞察或行事明智；与下句“看清”平行时，“明白”突出这里的认知含义。
- source_word: זֹ֑את
  choice: 这事
  rationale: 保留单数指示词，指向上文所陈明的事实或教训；汉语用“这事”比单说“这”更自然。
- source_word: יָבִ֖ינוּ
  choice: 能看清
  rationale: בין表示辨明、领会；译作“看清”可与前面的“明白”有所区别，并保留诗歌中的递进和平行。
- source_word: לְאַחֲרִיתָם
  choice: 自己的结局
  rationale: אַחֲרִית可指最终结果、后来或将来；“自己的结局”在本段审判语境中简洁有力，而“自己”自然回指主语“他们”。
theological_decisions:
- issue: אַחֲרִיתָם在本节中的含义
  choice: 自己的结局
  alternative: 自己的将来／后来会怎样
  rationale: 上下文促使人认清将临到自己的结果。“结局”保留本诗中的警戒和审判意味，同时用脚注说明该词也可较宽泛地指将来或后来之事，避免把词义限制得过死。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“但愿”传达原文的愿望兼叹惋语气；两个“能”使愿望句与后续结果自然衔接。“明白／看清”既保留两个近义动词的诗性平行，也避免机械重复。脚注标记置于其实际解释的“结局”之后。
