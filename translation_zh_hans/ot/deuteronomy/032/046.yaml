base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/046.yaml
  text: And he said to them[a], “Set your heart on all the words that I am testifying to you today, which you shall command your sons to keep[b], to do all the words of this law.”
translation:
  language: zh_hans
  text: 他对他们说：“你们要把我今天向你们郑重作证[a]的这一切话放在心上，并要吩咐你们的儿子谨守[b]、遵行这律法的一切话。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “郑重作证”也可译作“郑重警告你们”，或理解为“呼唤见证反对你们”。这个希伯来语动词在盟约语境中兼有作证、警告和司法性的意味。
    reason: alternative_reading
  - marker: b
    text: 希伯来文直译“你们的儿子”；在这里也可以代表更广义的下一代。
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂימוּ לְבַבְכֶם
  choice: 放在心上
  rationale: 保留希伯来语“置于心中”的意象，同时以现代汉语自然表达专心留意、牢记并立志遵守之意。
- source_word: כָל־הַדְּבָרִים
  choice: 这一切话
  rationale: דְּבָרִים在此指摩西所宣告的盟约言语；译作“话”也与句末的重复相呼应。
- source_word: מֵעִיד בָּכֶם הַיּוֹם
  choice: 我今天向你们郑重作证
  rationale: עיד的使役式在盟约语境中兼具作证、告诫和司法性的意味；正文采用“郑重作证”保留见证色彩，并用脚注呈现其他可能语气。介词ב在汉语中译为“向你们”较自然，且不强行落实为“控告你们”。
- source_word: אֲשֶׁר תְּצַוֻּם אֶת־בְּנֵיכֶם
  choice: 并要吩咐你们的儿子
  rationale: 将关系结构顺译为承接性的命令，表达以色列人须把这些话权威地传给下一代；“儿子”保留בְּנֵיכֶם的阳性复数形式。
- source_word: לִשְׁמֹר לַעֲשׂוֹת
  choice: 谨守、遵行
  rationale: 分别表达留心守护和实际履行的双重要求，避免把两个不定式合并为单一动作。
- source_word: כָל־דִּבְרֵי הַתּוֹרָה הַזֹּאת
  choice: 这律法的一切话
  rationale: תּוֹרָה在申命记的盟约语境中译作“律法”清楚而通行；整体措辞保留原文与前半句的重复。
theological_decisions:
- issue: מֵעִיד בָּכֶם的见证、警告及司法意味
  choice: 向你们郑重作证
  alternative: 警告你们；作证指控你们
  rationale: 正文保留正式见证的核心意义而不把ב明确译成敌对的“指控”；脚注保留该动词在盟约语境中可能具有的警告和司法张力。
- issue: בְּנֵיכֶם的性别与代表范围
  choice: 你们的儿子
  alternative: 你们的儿女／下一代
  rationale: 正文准确保留希伯来语阳性复数；脚注说明在此语境中可广指后代，避免读者误以为教导责任只涉及男性子女。
- issue: אֲשֶׁר תְּצַוֻּם的关系或目的语气
  choice: 并要吩咐
  alternative: 为要吩咐；这些话是你们要吩咐的
  rationale: 原结构可体现承接、目的或义务。正文用自然汉语表达命令的延续，不把语法关系过度限定为纯粹目的。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“放在心上”既自然又保留原文意象；“谨守、遵行”维持申命记盟约劝诫的正式语域。所有脚注标记均已置于正文相应位置。
