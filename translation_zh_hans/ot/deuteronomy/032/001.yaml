  yaml_path: translation/ot/deuteronomy/032/001.yaml
  text: Give ear[a], O heavens, and I will speak; and let the earth hear the words of my mouth.
translation:
  language: zh_hans
  text: 诸天哪，侧耳听！我要说话；愿大地听我口中的言语。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַאֲזִינוּ
  choice: 要侧耳听
  rationale: 该词是אזן的使役命令式，要求专心聆听。“侧耳听”既表达 attentive hearing，也保留诗歌召唤的庄重感。
- source_word: הַשָּׁמַיִם
  choice: 诸天哪
  rationale: 复数“诸天”保留希伯来语形式；句末语气词“哪”自然标示直接呼告。
- source_word: וַאֲדַבֵּרָה
  choice: 我要说话
  rationale: 该鼓励式表达说话者的意愿或决心；“我要说话”简洁保留其意向性。
- source_word: וְתִשְׁמַע
  choice: 大地也要听
  rationale: 此未完成式在与前句命令式平行的呼告中具有意愿、劝令色彩；“也要听”在中文中自然承接，并不把它误解为单纯的将来陈述。
- source_word: הָאָרֶץ
  choice: 大地
  rationale: 与“诸天”构成宇宙性的天地配对；“大地”比“土地”更符合这里的诗歌呼告。
- source_word: אִמְרֵי
  choice: 言语
  rationale: 指说出的言辞；“言语”比日常的“话”更庄重，又是现代读者熟悉的表达。
- source_word: פִי
  choice: 我口中的
  rationale: 保留“我口中的言语”这一具体的希伯来诗歌意象，而不简化为“我所说的”。
theological_decisions:
- issue: 天地受呼告的范围
  choice: 保留对诸天和大地的诗歌性召唤，暗含其作为见证者的庄严作用
  alternative: 仅视为对所有听众的修辞性呼吁
  rationale: 经文本身采用正式的天地呼告模式，但本节并未明说“作见证”，因此译文保留其庄严和宇宙性，不在正文中补入解释。
translation_notes:
  register: 采用现代、庄重而可朗读的诗歌语体。“诸天哪—大地”维持平行结构；“侧耳听”保留专注聆听的含义。“也要听”使中文衔接自然，同时脚注交代后半句也可理解为祈愿。
