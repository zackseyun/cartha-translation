  yaml_path: translation/ot/deuteronomy/032/048.yaml
  text: And Yahweh spoke to Moses on that very day[a], saying,
translation:
  language: zh_hans
  text: 就在那一天，雅威[a]对摩西说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文为四字神名“YHWH”，传统译作“耶和华”；“雅威”是按其可能读音所作的音译。
    reason: 说明神名的原文形式、传统译法及音译的不确定性。
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 说
  rationale: 该叙事形式推进事件；现代汉语以“说”自然引出下文的直接引语，也与句末 לֵאמֹר 的功能合并表达。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以常见的现代汉语音译呈现四字神名，而不以称号替代；脚注说明传统译法及其他音译。
- source_word: אֶל־מֹשֶׁה
  choice: 对摩西
  rationale: 自然表达说话所指向的对象，并采用该人名通行的中文译名。
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: 就在那一天
  rationale: 此习语强调事情恰在所指的那一天发生；“就在”准确传达强调意味，且符合现代汉语叙事习惯。
- source_word: לֵאמֹר
  choice: 说：
  rationale: 这是引出随后话语的固定公式；汉语用“说：”即可自然传达，无须机械重复为“说，话说”。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名，正文以音译保留其专名性质；脚注同时交代中文传统译法，避免把有争议的发音重建表述为完全确定。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“就在那一天”保留原文对确切日期的强调；以冒号衔接下一节的直接引语。
