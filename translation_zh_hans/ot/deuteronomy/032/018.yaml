base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/018.yaml
  text: You neglected the Rock who fathered you[c][b][a], and forgot the God who gave you birth.
translation:
  language: zh_hans
  text: '那生了你的磐石，你竟轻忽了[a][b]；

    那使你诞生的上帝，你竟忘记了[c]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “生了你的”也可译作“作你父亲的”。
    reason: lexical_alternative
  - marker: b
    text: “轻忽”所译的希伯来语动词较难确定，也可译作“忘记”或“不放在心上”。
    reason: lexical_alternative
  - marker: c
    text: “使你诞生的”也可译作“把你生出来”；希伯来原文采用生产的意象。
    reason: lexical_alternative
lexical_decisions:
- source_word: צוּר
  choice: 磐石
  rationale: 本义为“岩石、磐石”，在《申命记》本诗中又是指以色列之上帝的神圣称号；“磐石”既保留具体意象，也符合庄重诗体。
- source_word: יְלָדְךָ
  choice: 生你的
  rationale: ילד在此可表达生育、使之诞生，也可按父系生育语义理解为“生了你”。中文正文采用简洁的“生你的”，保留亲子意象，并以脚注说明“作你父亲、生了你”的可能理解。
- source_word: תֶּשִׁי
  choice: 你竟轻忽了
  rationale: 此动词词形和词义较难确定；结合下句“忘记”的平行关系，表示不放在心上、疏忽或忘却。“轻忽”体现有责的漠视，又不把两行译成同一动词。
- source_word: וַתִּשְׁכַּח
  choice: 你竟忘记了
  rationale: שׁכח通常意为“忘记”。加入“竟”自然传达诗句中的责备语气，但不改变基本命题。
- source_word: אֵל
  choice: 上帝
  rationale: 此处指以色列的上帝，与前行“磐石”相对应；现代普通话用“上帝”清楚、庄重。
- source_word: מְחֹלְלֶךָ
  choice: 使你出生的
  rationale: 该分词源于חול的相关词干，可指生产、使之诞生，并带有分娩意象。“使你出生”在现代中文中自然清楚，同时脚注保留“把你生出来”的强烈生产意象。
theological_decisions:
- issue: 上帝的亲子与生产意象
  choice: 正文同时保留“生你的磐石”和“使你出生的上帝”两种生育表达。
  alternative: 译为“造你的磐石”和“塑造你的上帝”，用一般创造用语淡化生育意象。
  rationale: 希伯来文连续采用ילד和与生产相关的חול，刻意以亲子和出生来描绘上帝与以色列的关系。译文不应为消除拟人化张力而改成笼统的创造语言。
translation_notes:
  register: 采用现代、庄重而可懂的诗体；两行结构保持平行，以“竟”突出责备语气。“磐石”保留神圣称号的传统意象；中文不以英文式大小写标示专名。所有脚注标记均置于正文相应词句之后。
