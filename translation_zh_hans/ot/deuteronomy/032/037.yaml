  text: וְ/אָמַ֖ר אֵ֣י אֱלֹהֵ֑י/מוֹ צ֖וּר חָסָ֥יוּ בֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/037.yaml
  text: And he will say[a], ‘Where are their gods, the rock in which they took refuge?’
translation:
  language: zh_hans
  text: 他必说：“他们的诸神，就是他们所投靠的磐石，在哪里？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאָמַר
  choice: 他必说
  rationale: 这里的说话者承接上下文，最自然地指耶和华；诗歌叙述中的连接词加完成式可按语境表达将来的动作。“必说”既传达将来指向，也符合庄重的汉语表达；不另译“并且”，以免生硬。
- source_word: אֵי
  choice: 在哪里
  rationale: 疑问词意为“在哪里”。汉语不以动词形式标示单复数，因此用“在哪里”即可自然地与“诸神”搭配。
- source_word: אֱלֹהֵימוֹ
  choice: 他们的诸神
  rationale: 该词在此带第三人称阳性复数后缀，并在上下文中指受倚靠却无力施救的神明。“诸神”明确保留复数和讽刺性的论战意味。
- source_word: צוּר
  choice: 磐石
  rationale: 直译为“磐石”，在这里与“他们的诸神”构成同位或解释关系，描写他们以为能提供庇护的对象。此处不用专名号或其他方式将其处理为耶和华的称号，以保留上下文的反讽。
- source_word: חָסָיוּ
  choice: 他们所投靠的
  rationale: חסה 表示寻求庇护、避难。“投靠”在现代汉语中自然地兼具寻求保护和信赖的含义，也保留磐石这一具体庇护意象。
- source_word: בּוֹ
  choice: 所投靠的
  rationale: 希伯来语介词 ב 加第三人称阳性单数后缀，回指单数的“磐石”。汉语关系结构“所投靠的磐石”自然表达“在其中寻求庇护”，无需另译代词。
theological_decisions:
- issue: 说话者及动词的时间指向
  choice: 译作“他必说”，理解为耶和华将要发出的反诘
  alternative: “他说了”或“那时有人会说”
  rationale: 申命记32:36—38的语境最自然地表明，耶和华以反诘揭露那些受倚靠之神的无能。希伯来诗歌中的动词形式容许由篇章语境确定其将来指向；译文不在本节内明添“耶和华”，从而避免超过原文显明的信息。
- issue: “磐石”的所指
  choice: 按普通名词处理，指他们视为庇护的诸神
  alternative: 将“磐石”处理为耶和华的神圣称号
  rationale: 本句紧接“他们的诸神”，因此“磐石”最自然地作为同位说明，指那些被人当作保障的神明。这样保留本章中真假磐石之间的反讽张力，而不把此处直接等同于耶和华。
- issue: 复数“诸神”与单数“磐石”的关系
  choice: 在正文中保留两者的数差异，并用两个问句作自然表达
  alternative: 统一改成单数“他们的神”或复数“他们所投靠的磐石”
  rationale: 原文先用带复数意义的“他们的神”，继而用单数“磐石”作同位性描述。译文不强行消除这一张力，并以脚注交代原文结构。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“诸神”明确表达复数；“投靠”保留寻求庇护的意象。正文将高度浓缩的希伯来诗句拆为两个反诘句，使汉语清楚自然，同时借脚注保存其同位结构和数的不一致。
