  naturalness: “他必说”和“投靠”庄重、清楚，符合现代标准汉语的经文语体。“他们的诸神，就是他们所投靠的磐石，在哪里？”虽保留希伯来诗歌的突兀反讽，仍可读懂；用一个问句更贴合原文结构。
  terminology: “诸神”准确保留复数；“磐石”恰当保留 צוּר 的意象和本章的反讽，不应大写化或改作耶和华的称号。“投靠”可准确传达 חָסָה 的寻求庇护之意。
