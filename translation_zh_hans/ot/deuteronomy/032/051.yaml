  rationale: 修订将“加低斯的米利巴水、寻的旷野”作为“不忠”发生的地点，保留原文两次“在以色列人中”以及两次责备原因的结构。“尊我为圣”准确表达此处使役式动词所指的公开承认、敬重上帝为圣，未引入上帝本身需要被使成圣的含义。
