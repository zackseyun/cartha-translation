base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/051.yaml
  text: because you acted unfaithfully against me among the sons of Israel at the waters of Meribath-kadesh[a], in the wilderness of Zin[c][b], because you did not treat me as holy among the sons of Israel.
translation:
  language: zh_hans
  text: 因为你们在寻的旷野、加低斯的米利巴水边，在以色列人中对我不忠；又因为你们没有在以色列人中尊我为圣。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “尊我为圣”也可译作“彰显我的圣洁”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מְעַלְתֶּם בִּי
  choice: 对我不忠
  rationale: מעל 表示破坏忠信、失信，常带有盟约关系中的背信意味；与介词 ב 连用时，指明被冒犯的一方。译为“对我不忠”自然且保留其道德与关系层面的力度。
- source_word: בְּתוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: 在以色列人中
  rationale: 这是标准族群称谓；现代汉语以“以色列人”准确自然地表达“以色列的子孙”，并在本节两处保持一致。
- source_word: בְּמֵי מְרִיבַת קָדֵשׁ
  choice: 在加低斯米利巴水那里
  rationale: 该短语兼具地名和事件名称的性质。保留“米利巴”的专名形式，并用“加低斯”限定，符合汉语圣经地名表达；“水那里”对应复数 מֵי 的地点用法。
- source_word: מִדְבַּר צִן
  choice: 寻的旷野
  rationale: 采用通行地名“寻”；“旷野”比“沙漠”更能涵盖原词所指的荒僻、少人居住之地，也保持庄重的经文语体。
- source_word: לֹא קִדַּשְׁתֶּם אֹתִי
  choice: 没有尊我为圣
  rationale: קדשׁ 的 Piel 形式在此指公开承认、维护并彰显上帝为圣，而非使上帝本身变得圣洁。“尊我为圣”简洁保留原文的圣洁用语和关系性含义。
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל 的表达
  choice: 以色列人
  alternative: 以色列的子孙
  rationale: 此处是标准族群称谓，包含整个以色列共同体。现代汉语“以色列人”不改变所指，且比逐字表达更自然；原文两次出现的重复仍予保留。
- issue: קִדַּשְׁתֶּם אֹתִי 的含义
  choice: 尊我为圣
  alternative: 使我成圣／彰显我的圣洁
  rationale: 这里责备的是摩西和亚伦未在以色列人面前恰当地承认并维护上帝的圣洁，并非暗示上帝本有的圣洁有所欠缺。所选译法既保留“圣”的词根联系，也不消除公开尊崇与彰显之间的语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“因为……也因为……”保留原文两次 עַל אֲשֶׁר 的重复和因果强调；分号帮助呈现两个彼此相关的指控。地名采用“寻、加低斯、米利巴”的通行汉译。
