  naturalness: 原末句“在你们正渡过约旦河、要到那里占有的土地上”存在明显的定语附着歧义和不自然的句法：表面上“正渡过”“要到那里占有”会修饰“土地”，仿佛土地在渡河或占有某物。改用“在你们将要渡过约旦河、到那里去占有的那片土地上”，可清楚表明这些动作的主语是“你们”。
