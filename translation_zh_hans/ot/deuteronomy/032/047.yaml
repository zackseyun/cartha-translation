  text: כִּ֠י לֹֽא דָבָ֨ר רֵ֥ק הוּא֙ מִ/כֶּ֔ם כִּי ה֖וּא חַיֵּי/כֶ֑ם וּ/בַ/דָּבָ֣ר הַ/זֶּ֗ה תַּאֲרִ֤יכוּ יָמִים֙ עַל הָ֣/אֲדָמָ֔ה אֲשֶׁ֨ר אַתֶּ֜ם עֹבְרִ֧ים אֶת הַ/יַּרְדֵּ֛ן שָׁ֖מָּ/ה לְ/רִשְׁתָּֽ/הּ־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/047.yaml
  text: For it is not an empty word for you[a], but it is your life[c][b], and by this word you will prolong your days on the land that you are crossing the Jordan to possess.
translation:
  language: zh_hans
  text: 因为这话对你们绝不是空话[a]，而是你们的生命[b]；你们必靠着这话，在你们将要渡过约旦河、到那里去占有[c]的那片土地上长久生活。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “空话”也可译作“无关紧要的事”或“徒然的话”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语直译为“你们的生命”；原词在形式上是复数，但可惯用作抽象单数。
    reason: lexical_alternative
  - marker: c
    text: “占有”也可译作“取得为业”或“承受为业”。
    reason: lexical_alternative
lexical_decisions:
- source_word: דָבָר רֵק
  choice: 空话
  rationale: דָבָר指刚刚宣告的圣约教导，רֵק表示空洞、无价值或无关紧要。“空话”保留“话”这一具体意象，也自然表达这话绝非徒然或微不足道。
- source_word: מִכֶּם
  choice: 对你们
  rationale: 此处מן不是单纯表示“从你们而来”，而是说明这话与以色列人的关系；“对你们”符合上下文，也比直译“从你们”自然。
- source_word: חַיֵּיכֶם
  choice: 你们的生命
  rationale: חַיִּים在形式上是复数，却常作抽象单数“生命”使用；这里强调这话关系到整个群体的存活与福祉。
- source_word: וּבַדָּבָר הַזֶּה
  choice: 靠着这话
  rationale: ב在此表示凭借或途径。“靠着”保留工具性含义，同时延续前半句דָבָר的“话”，不将其弱化为笼统的“事情”。
- source_word: תַּאֲרִיכוּ יָמִים
  choice: 长久生活
  rationale: ארך的使役式与“日子”连用，意为使日子延长，即活得长久。译文采用自然的现代汉语，同时保留其长寿含义。
- source_word: עַל הָאֲדָמָה
  choice: 在……土地上
  rationale: 该短语在申命记中指以色列将要得为产业的土地；“土地”保留领土与圣约背景，避免泛化为“世上”。
- source_word: עֹבְרִים אֶת־הַיַּרְדֵּן
  choice: 正渡过约旦河
  rationale: 分词表达从摩西当时视角看即将发生、已迫近的行动；“正渡过”保留其生动的进行意味。
- source_word: שָׁמָּה לְרִשְׁתָּהּ
  choice: 要到那里占有
  rationale: שָׁמָּה明确表示“到那里”，ירשׁ表示取得并持有土地，也可有承受产业的意味。“占有”在正文中准确表达取得土地的行动，其他内涵在脚注说明。
theological_decisions:
- issue: 顺从圣约之言与生命、长居应许之地的关系
  choice: 保留“这话是你们的生命”以及“靠着这话长久生活”的直接因果与工具性表达。
  alternative: 只把本节理解为对律法重要性的修辞赞美，不表达圣约后果。
  rationale: 两个平行分句把这话称为以色列的生命，并说他们靠着这话在土地上长久生活，显明这不只是一般性的赞扬，而涉及以色列在圣约之下的生命和居留；译文不额外加入后来的教义范畴。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“绝不是空话”自然传达否定的强调；分号呈现两个密切相关的断言。末句保留“正渡过约旦河”和“到那里”所表达的临近感与方向感，未明说原文仅由语境暗示的“顺从”。
