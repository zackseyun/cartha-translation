  text: Their wine is the venom of serpents[b][a], the cruel poison of cobras.
translation:
  language: zh_hans
  text: 他们的酒是大蛇[a]的毒液，是毒蛇[b]无情的毒液。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “大蛇”在其他语境中也可指巨兽或海怪；这里与有毒的蛇平行，因此按蛇类理解。
    reason: lexical_alternative
  - marker: b
    text: 原文所指的具体蛇种不能确定，也可译作“眼镜蛇”“蝮蛇”或“虺”。
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲמַת
  choice: 毒液
  rationale: 该词本可表示“烈怒、热气”，但与蛇类搭配并与下半句的“毒素”平行时，指蛇的毒液。
- source_word: תַּנִּינִם
  choice: 大蛇
  rationale: 该词在不同语境中可指巨兽、海怪或大型爬行动物；本节谈到毒液，并与有毒蛇类平行，因此采用蛇类含义，同时以脚注保留其较宽的语义范围。
- source_word: יֵינָם
  choice: 他们的酒
  rationale: 直接表达第三人称复数所属关系，并保留原文把“酒”比作致命毒液的诗歌意象。
- source_word: וְרֹאשׁ
  choice: 毒素
  rationale: 此处不是“头”，而是指有毒或苦毒的物质；译作“毒素”既清楚，又避免与上半句“毒液”完全重复。
- source_word: פְּתָנִים
  choice: 眼镜蛇
  rationale: 该词指一种有剧毒的蛇，传统上也译作蝮蛇、毒蛇或虺；“眼镜蛇”能以现代汉语鲜明传达其致命性，脚注注明词种并不能完全确定。
- source_word: אַכְזָר
  choice: 残酷的
  rationale: 保留原文将毒素拟人化为残酷、无情之物的强烈诗意，而不直接改释为“致命的”。
