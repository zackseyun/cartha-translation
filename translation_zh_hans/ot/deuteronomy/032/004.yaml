source:
  edition: WLC
  text: הַ/צּוּר֙ תָּמִ֣ים פָּעֳל֔/וֹ כִּ֥י כָל דְּרָכָ֖י/ו מִשְׁפָּ֑ט אֵ֤ל אֱמוּנָה֙ וְ/אֵ֣ין עָ֔וֶל צַדִּ֥יק וְ/יָשָׁ֖ר הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/004.yaml
  text: The Rock—his work is perfect[a], for all his ways are justice. He is a God of faithfulness and without injustice[c][b], righteous and upright is he.
translation:
  language: zh_hans
  text: 他是磐石，他的作为完全无缺[a]，因为他一切所行的都公正。他是信实的上帝，毫无不义[b]；他公义正直。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “完全无缺”也可译作“纯全”或“无可指摘”。这里指他的作为完整、无瑕疵。
    reason: lexical_alternative
  - marker: b
    text: “不义”也可译作“不公”或“邪恶”；原词可指道德上的错误、邪曲或不公正。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצּוּר
  choice: 磐石
  rationale: צוּר在此是摩西之歌中对上帝的比喻性称号；“磐石”既保留原有意象，也符合庄重而自然的现代汉语表达。
- source_word: תָּמִים
  choice: 完全无缺
  rationale: 此词描述上帝作为的完整、纯全和无可指摘；“完全无缺”比单用“完全”更清楚地表达其谓语意义。
- source_word: פָּעֳלוֹ
  choice: 他的作为
  rationale: 单数名词在此概括上帝所做的一切；“作为”保留名词形式，也比“工作”更适合描述上帝的行动。
- source_word: כִּי
  choice: ；
  rationale: 此处引出对前句的解释和根据。汉语诗体中用分号并列说明，比直译为“因为”更自然，同时不改变逻辑关系。
- source_word: כָל־דְּרָכָיו
  choice: 他一切所行的
  rationale: 希伯来语“道路”在此指行事方式；译作“所行的”自然表达其惯用含义，避免汉语读者误解为实际路径。
- source_word: מִשְׁפָּט
  choice: 公正
  rationale: 此处作谓语，说明上帝的一切行事都合乎正义与正确裁断；“公正”在现代汉语中简洁自然。
- source_word: אֵל אֱמוּנָה
  choice: 信实的上帝
  rationale: 该名词结构描述上帝可靠、可信的品格；“信实的上帝”自然表达这一属性，同时保留“信实”而不缩窄为命题意义上的“真实”。
- source_word: וְאֵין עָוֶל
  choice: 毫无不义
  rationale: 此短语否定上帝有任何道德上的错误、邪曲或不公；“毫无不义”简洁庄重，并保留词义范围。
- source_word: צַדִּיק
  choice: 公义
  rationale: 表达上帝在道德与审判上的正当；“公义”是该神圣属性在现代中文圣经语域中的清楚表达。
- source_word: וְיָשָׁר
  choice: 正直
  rationale: 表达道德上的端正、不偏不曲；与“公义”搭配自然，也保留希伯来语并列结构。
- source_word: הוּא
  choice: 他
  rationale: 希伯来语代词置后有总结和强调作用；汉语以“他公义正直”自然呈现主语，并使末句有力收束。
theological_decisions:
- issue: הַצּוּר作为上帝的比喻性称号
  choice: 译作“磐石”，并以前置代词“他是”明确所指
  alternative: 译作“那磐石”或仅作“磐石”
  rationale: “磐石”保留原文的神圣称号和诗歌意象；现代汉语通常不靠首字母大写标示称号，因此用“他是磐石”既明确指向上帝，又不添加原文没有的教义解释。
- issue: אֱמוּנָה所表达的神圣属性
  choice: 信实
  alternative: 真实、可靠
  rationale: 上下文强调上帝行事始终可信且毫无不义。“信实”涵盖可靠、忠诚的品格，同时不把含义限定为抽象的真实性。
- issue: מִשְׁפָּט与צַדִּיק的关系
  choice: 分别译作“公正”和“公义”
  alternative: 两者均译作“公义”或“公正”
  rationale: 分别用词可保存原文词汇差异：前者描述上帝一切行事合乎正义，后者直接陈述他的品格；二者彼此呼应而不被合并。
translation_notes:
  register: 采用庄重、简洁的现代标准汉语，保留摩西之歌的平行结构和神圣称号“磐石”。“他是磐石”避免依赖中文不存在的大小写区别；后续短句力求适合公开诵读。所有脚注标记均已置于正文相应位置。
