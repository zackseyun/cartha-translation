  text: אַשְׁכִּ֤יר חִצַּ/י֙ מִ/דָּ֔ם וְ/חַרְבִּ֖/י תֹּאכַ֣ל בָּשָׂ֑ר מִ/דַּ֤ם חָלָל֙ וְ/שִׁבְיָ֔ה מֵ/רֹ֖אשׁ פַּרְע֥וֹת אוֹיֵֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/042.yaml
  text: I will make my arrows drunk with blood[a], and my sword will devour flesh— with the blood of the slain and the captives, from the heads of the enemy leaders.
translation:
  language: zh_hans
  text: '我要使我的箭饮血而醉，

    我的剑要吞吃肉——

    被杀者和俘虏的血，

    仇敌披发者的首级。[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “披发者”所译的希伯来语词很罕见，本短语的含义和句法关系不确定；也可译作“仇敌首领的首级”，或“仇敌长发者的首级”。
    reason: 说明罕见词 פַּרְעוֹת 以及短语 מֵרֹאשׁ פַּרְעוֹת אוֹיֵב 的词汇和句法歧义。
lexical_decisions:
- source_word: אַשְׁכִּיר
  choice: 使……饮血而醉
  rationale: 这是 שׁכר 的使役式，字面义为“使醉”。用“饮血而醉”保留战歌中箭被拟人化的强烈意象，也自然表达 מִדָּם 所指的血是使箭醉的缘由或媒介。
- source_word: חִצַּי
  choice: 我的箭
  rationale: חֵץ 的复数第一人称单数所属形式；“箭”是现代汉语中准确、自然的兵器名称。
- source_word: וְחַרְבִּי
  choice: 我的刀剑
  rationale: חֶרֶב 可泛指刀或剑；“刀剑”既符合现代汉语习惯，也不把古代兵器过度限定为某一种形制。
- source_word: תֹּאכַל בָּשָׂר
  choice: 要吞吃血肉
  rationale: 原文直译为“吃肉”。“吞吃”保留刀剑被拟人化的暴烈意象；“血肉”在汉语中比单说“肉”更自然，并与下行的“血”衔接，但不改变所描写的杀戮场景。
- source_word: מִדַּם חָלָל וְשִׁבְיָה
  choice: 被杀者和俘虏的血
  rationale: חָלָל 在战争语境中指被杀倒下的人；שִׁבְיָה 可指被掳者或俘虏群体。按人物并列译作“被杀者和俘虏”，保留原文令人不安的判断图景，不将“俘虏”弱化为抽象的“被掳”。
- source_word: מֵרֹאשׁ פַּרְעוֹת אוֹיֵב
  choice: 仇敌披发者的首级
  rationale: רֹאשׁ 取具体的“头、首级”；罕见词 פַּרְעוֹת 与披散或不加约束的头发有关，也可能引申指首领或战士。正文采用较贴近词形意象的“披发者”，避免未经说明便确定为“首领”，并用脚注保存其他可能解释。
- source_word: אוֹיֵב
  choice: 仇敌
  rationale: 单数集合用法，指敌对一方；“仇敌”适合庄重诗歌语体，并保留其集合含义。
theological_decisions:
- issue: מֵרֹאשׁ פַּרְעוֹת אוֹיֵב 的解释
  choice: 仇敌披发者的首级
  alternative: 仇敌首领的首级；仇敌战士披散头发的首级
  rationale: 此处主要是词汇和句法上的困难，而非教义分歧。פַּרְעוֹת 罕见，可与披发形象相连，也可理解为首领或战士。正文保留较具体的意象，脚注列出解释性译法，不把不确定含义固定为单一身份。
- issue: 末两行与“箭”和“刀剑”的关系
  choice: 以破折号引出血与首级，保留浓缩的诗歌列举
  alternative: 补出“箭喝……刀剑吞……”等动词，分别对应两件兵器
  rationale: 原文以两个 מִן 短语继续展开，却没有明确重复动词；直接补配动词会消除原有的句法张力。中文以破折号和分行维持可读性，同时保留这些短语可能共同修饰前述两个平行分句的空间。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语，保留战歌的平行结构、拟人和强烈暴力意象。正文不以“首领”直接消解罕见词的歧义，而由脚注交代主要可能译法。
