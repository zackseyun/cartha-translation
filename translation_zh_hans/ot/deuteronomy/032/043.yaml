  text: הַרְנִ֤ינוּ גוֹיִם֙ עַמּ֔/וֹ כִּ֥י דַם עֲבָדָ֖י/ו יִקּ֑וֹם וְ/נָקָם֙ יָשִׁ֣יב לְ/צָרָ֔י/ו וְ/כִפֶּ֥ר אַדְמָת֖/וֹ עַמּֽ/וֹ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/043.yaml
  text: Rejoice[a], O nations, with his people, for he will avenge the blood of his servants; he will repay vengeance on his adversaries[d][c][b], and he will make atonement for his land and his people.
translation:
  language: zh_hans
  text: 列国啊，要和他的子民一同欢呼[a]！因为他必为自己仆人所流的血伸冤；他必向敌对他的人施行报应[b]，并为他的土地和子民赎罪[c]。[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “欢呼”也可译作“欢呼歌唱”或“高声欢呼”。这个希伯来语命令式可指喜乐地呼喊或歌唱。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译近似“他必把报应回给敌对他的人”。
    reason: lexical_alternative
  - marker: c
    text: “赎罪”也可译作“洁净”或“除去……的罪污”；这个希伯来语动词兼有赎罪和洁净的含义。
    reason: lexical_alternative
  - marker: d
    text: 开头的希伯来文句法十分紧凑，也可能理解为“列国啊，要称颂他的子民”。希腊文《七十士译本》和一份《死海古卷》保存了本节的较长形式，其中还呼吁诸天和天上的神明欢呼，并呼吁列国敬拜他。正文依照马所拉希伯来文本。
    reason: textual_variant
lexical_decisions:
- source_word: הַרְנִינוּ
  choice: 欢呼
  rationale: רנן的复数命令式表示因喜乐而高声呼喊，也可含歌唱之意。“欢呼”既自然，又保留其鲜明的声音色彩。
- source_word: גוֹיִם
  choice: 列国
  rationale: 在这里指以色列以外的众国；“列国”符合本诗庄重的盟约语境，也不带新约时代“外邦人”一词可能引出的额外色彩。
- source_word: עַמּוֹ
  choice: 和他的子民一同
  rationale: 马所拉文本的句法极为紧凑，直译近似“列国啊，欢呼，他的子民”。依上下文补出“和……一同”，表达列国与上帝子民共同欢呼这一较合理的句法关系，同时以脚注保留歧义。
- source_word: דַם עֲבָדָיו יִקּוֹם
  choice: 为自己仆人所流的血伸冤
  rationale: “血”在此指仆人被杀、流血之事；נקם在这一搭配中表示为血债复仇、伸张公义。“伸冤”符合现代汉语，也避免把重点仅放在人身报复上。
- source_word: וְנָקָם יָשִׁיב לְצָרָיו
  choice: 向敌对他的人施行报应
  rationale: 该表达字面含“把报复回给敌对者”之意。“施行报应”保留נקם的报偿性质以及ישיב所表达的回报意味。
- source_word: וְכִפֶּר
  choice: 赎罪
  rationale: כפר可表达赎罪、除罪或洁净。这里采用“赎罪”，保留其祭仪和神学分量；“洁净／除去罪污”的可能含义列于脚注。
- source_word: אַדְמָתוֹ עַמּוֹ
  choice: 他的土地和子民
  rationale: 保留两个并列对象。“土地”比“地土”更符合现代普通话，同时仍指属于他的国土。
theological_decisions:
- issue: 开头“列国”与“他的子民”的关系
  choice: 列国受召与他的子民一同欢呼
  alternative: 列国受召称颂他的子民；或按较长的古代文本理解为包括天和神圣众者在内的多重呼召
  rationale: 马所拉文本没有明示介词，句法存在真实歧义。“和……一同”是语境中较顺畅的理解，但不应掩盖其他句法和文本可能性，因此在脚注中说明。
- issue: כפר在末句的含义
  choice: 为他的土地和子民赎罪
  alternative: 洁净或除去他的土地和子民的罪污
  rationale: “赎罪”最能保留该动词的赎罪性内涵，同时脚注说明其洁净、除污侧面，避免把多义词限定为单一的后期系统解释。
- issue: 上帝报应敌对者的表达
  choice: 施行公义的报应
  alternative: 向敌人复仇
  rationale: 希伯来文明确含报复、报偿意味，不宜弱化；“报应”保留司法性的回报观念，同时没有额外解释其具体方式。
translation_notes:
  register: 采用现代、庄重而清楚的普通话诗歌体。“列国啊”保留呼语气势；分号呈现因由之后两个并列的神圣行动。脚注标记均置于相关正文位置，其中[d]置于节末，用来说明涉及全节结构的文本异文和开头句法歧义。
