source:
  edition: WLC
  text: אַסְפֶּ֥ה עָלֵ֖י/מוֹ רָע֑וֹת חִצַּ֖/י אֲכַלֶּה בָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/023.yaml
  text: I will heap disasters upon them[b][a]; I will use up my arrows against them.
translation:
  language: zh_hans
  text: '我要把灾祸堆在他们身上[a]；

    我要用尽我的箭攻击他们[b]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “灾祸”或译“灾难”“祸患”；原文直译为“恶事”，这里指带来伤害的审判，并非道德意义上的邪恶。
    reason: lexical_alternative
  - marker: b
    text: 或译：“我要把我的箭全都射向他们。”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַסְפֶּה
  choice: 堆
  rationale: 此处使役未完成式表达使灾祸累积并临到对象；“堆在……身上”既保留累加的意象，也符合本节诗歌性的审判语境。
- source_word: עָלֵימוֹ
  choice: 在他们身上
  rationale: 介词 עַל 加第三人称复数后缀，在这里表示灾祸落到百姓身上；此译保留其空间性隐喻。
- source_word: רָעוֹת
  choice: 灾祸
  rationale: 该词可泛指“坏事、祸患”，在本段审判语境中指造成伤害的灾难，而不是道德意义上的邪恶；“灾祸”自然且保留其严厉程度。
- source_word: חִצַּי
  choice: 我的箭
  rationale: 按字面保留第一人称所有格及复数形式，也保留原文的军事隐喻。
- source_word: אֲכַלֶּה
  choice: 用尽
  rationale: כלָה 的加强式在此表示彻底耗用；以“箭”为宾语时，“用尽”清楚传达将箭全部发出的意思。
- source_word: בָּם
  choice: 攻击他们
  rationale: 介词 בְּ 在这里标明箭所针对的对象。“攻击他们”以自然汉语表达敌对指向，同时避免误解为箭静态地位于他们里面。
theological_decisions:
- issue: 神施行审判的语境中 רָעוֹת 的译法
  choice: 灾祸
  alternative: 恶事；灾难；祸患
  rationale: 原词可以宽泛地指坏事或祸患，但上下文所说的是耶和华施行的审判。译作“灾祸”既不把原文误解为神行道德上的恶，也不削弱约的审判所具有的严厉性。
- issue: 是否把“箭”解释为具体灾祸
  choice: 保留“我的箭”的军事隐喻
  alternative: 意译为各种惩罚或灾难
  rationale: 原文没有逐一解释箭所代表的内容；保留隐喻可避免加入经文本身未明确给出的神学说明。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌体汉语。两行平行排列，保留“堆积灾祸”与“用尽箭矢”的强烈意象；不额外解释箭所象征的具体灾难。
