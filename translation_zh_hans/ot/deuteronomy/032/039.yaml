  text: רְא֣וּ עַתָּ֗ה כִּ֣י אֲנִ֤י אֲנִי֙ ה֔וּא וְ/אֵ֥ין אֱלֹהִ֖ים עִמָּ/דִ֑י אֲנִ֧י אָמִ֣ית וַ/אֲחַיֶּ֗ה מָחַ֨צְתִּי֙ וַ/אֲנִ֣י אֶרְפָּ֔א וְ/אֵ֥ין מִ/יָּדִ֖/י מַצִּֽיל׀׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/039.yaml
  text: See now that I[a], even I, am he, and there is no god beside me. I put to death and I make alive; I have wounded, and I will heal[e][d][c][b]; and there is no one who can deliver from my hand.
translation:
  language: zh_hans
  text: '“你们如今要知道：


    我，唯有我，才是那一位；


    除我以外，并没有神。[a]


    我使人死，也使人活；[b]


    我击伤了，我也必医治；[c]


    没有谁能从我手中救人。[d]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “除我以外”较直译可作“没有神与我在一起”或“没有神与我同在”。这里宣告没有任何神能与说话者并列。
    reason: lexical_alternative
  - marker: b
    text: “使人死”也可译为“杀死”；“使人活”也可译为“使人得生命”或“使人活过来”。
    reason: lexical_alternative
  - marker: c
    text: “击伤”所译的希伯来语也可表示“击碎”或“打得粉碎”。
    reason: lexical_alternative
  - marker: d
    text: “从我手中”是表示从某人的权能或掌控之下逃脱的说法。
    reason: cultural_note
lexical_decisions:
- source_word: רְאוּ עַתָּה
  choice: 现在你们要看清
  rationale: 复数命令式要求众人当下认清事实。“看清”既保留“看”的意象，又自然表达此处的认识和确认之意。
- source_word: כִּי אֲנִי אֲנִי הוּא
  choice: 我——正是我——就是那一位
  rationale: 用破折号和“正是”体现两个“我”的强烈强调，同时保留“就是那一位”的简洁表述，不将其扩写成后来的教义公式。
- source_word: וְאֵין אֱלֹהִים עִמָּדִי
  choice: 除我以外，并没有神
  rationale: 此处 עִם 字面有“与……同在、在……身旁”之意；在宣告神独一性的语境中，“除我以外”自然传达没有任何神可与说话者并列。字面译法列入脚注。
- source_word: אֲנִי אָמִית וַאֲחַיֶּה
  choice: 我使人死，也使人活
  rationale: 分别保留 מות 的使役意义和 חיה 的使人存活、活过来之意，并以对称句式呈现希伯来诗歌的对举。
- source_word: מָחַצְתִּי וַאֲנִי אֶרְפָּא
  choice: 我击伤了，我也必医治
  rationale: “击伤”与“医治”形成清楚的反义平行；“了”与“必”分别体现完成式和未完成式在此序列中的过去—将来走向，同时第二个“我”保留原文的强调。较强的“击碎”义收入脚注。
- source_word: וְאֵין מִיָּדִי מַצִּיל
  choice: 谁也不能从我手中把人救走
  rationale: 将否定存在句自然转换为汉语的全称否定，并保留“从我手中”这一表示权能和掌控的希伯来语意象。补出泛指的“人”，使汉语宾语关系完整，但不限定具体对象。
theological_decisions:
- issue: 神的独一性及其他神明的地位
  choice: 译作“除我以外，并没有神”，表达没有任何神可与耶和华并列。
  alternative: “没有神与我同在”或“在我身旁没有神”
  rationale: 上下文中的排他性宣告支持强烈的独一性含义；译文不将其弱化为神只是不需要助手，同时脚注保留介词的字面可能。
- issue: “我就是那一位”的跨经文神学回响
  choice: 保留“我——正是我——就是那一位”的简洁措辞。
  alternative: “唯有我是神”或“我是自有永有者”
  rationale: 原句具有重要神学分量，但并未在本节明确采用这些扩展称谓；因此保留原文的代词重复和述语形式，不把后来的神学表达写入正文。
- issue: 使死、使活、击伤与医治的神圣主权
  choice: 并列保留四项行动，既不缓和使死和击伤，也不将使活限定为复活。
  alternative: 把“使人活”明确解释为死人复活，或把“击伤”淡化为允许受伤
  rationale: 原文直接把这些行动归于说话者，却未界定“使活”的具体方式；译文保留其范围和张力。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语，以短句和分行保留诗歌的平行结构。破折号呈现原文重复“我”的强调，避免在汉语中被误读为口吃；“那一位”保留原句的指称性和神学张力。
