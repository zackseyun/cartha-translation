  to: '“你们如今要知道：


    我，唯有我，才是那一位；


    除我以外，并没有神。[a]


    我使人死，也使人活；[b]


    我击伤了，我也必医治；[c]


    没有谁能从我手中救人。[d]”'
  rationale: 修订使强调性的身份宣告更符合现代标准汉语，删除末句中原文未明示的受事限定，并校正介词脚注的直译说明。其余四重行动及其过去—将来对照均予保留；未把“使人活”限定为复活，也未将“那一位”扩展为后来的教义性称谓。
