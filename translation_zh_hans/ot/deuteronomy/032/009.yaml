  yaml_path: translation/ot/deuteronomy/032/009.yaml
  text: For Yahweh’s portion is his people[a], Jacob the share of his inheritance.
translation:
  language: zh_hans
  text: 因为雅威所得的份是他的百姓；雅各是他产业中所分得的一份[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“雅各是他产业的准绳”，或“雅各是他产业所分得的份”。希伯来语“חֶבֶל”按字面可指量地的绳索，也可引申指用绳划定或分得的一份。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 本句为前文提供解释或根据；“因为”在现代汉语中自然保留这一连接作用。
- source_word: חֵלֶק
  choice: 份
  rationale: 该词指分配给某人的一份或份额；简洁的“份”与下半句的产业意象相呼应。
- source_word: יְהֹוָה
  choice: 雅威
  rationale: 直接音译四字神名，保留原文所用的专名，而不以称号替代。
- source_word: עַמּוֹ
  choice: 他的百姓
  rationale: “百姓”表达盟约关系中的群体归属，比“国家”更符合此处语境。
- source_word: יַעֲקֹב
  choice: 雅各
  rationale: 保留原文的族长名及其诗歌性的集体指称，不直接释为“以色列”。
- source_word: חֶבֶל
  choice: 份额
  rationale: 该词本义可指绳索或量地的准绳，并可引申为划定、分得的份；正文采用自然的引申义，同时以脚注保留具体意象和其他可能译法。
- source_word: נַחֲלָתוֹ
  choice: 他产业的
  rationale: נַחֲלָה可指承受的产业或恒久的属业；“产业”保留占有与继承的意象。
theological_decisions:
- issue: 如何翻译神名 יהוה
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；采用“雅威”保留其专名性质，避免用称号替代。
- issue: 是否把“雅各”明译为“以色列”
  choice: 雅各
  alternative: 以色列
  rationale: 原文明确使用“雅各”，且这一名称与上半句形成诗歌平行；保留原名也避免将集体所指的解释直接写入正文。
- issue: חֶבֶל 的产业隐喻
  choice: 份额
  alternative: 准绳；阄分
  rationale: 上下文支持“划定所得之份”的引申义，但其字面量地意象仍真实存在，因此正文采用“份额”，脚注保留其他可能理解。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语；保留原文简洁的诗歌平行结构。分号凸显“他的百姓”与“雅各”、“份”与“份额”之间的对应关系。
