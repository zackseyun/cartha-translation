- from: 如鹰[a]搅动自己的巢窝，在雏鸟上方盘旋[b]；他展开翅膀，接住他，把他托在翼羽[c]上。
  to: 如鹰[a]搅动巢穴，在雏鸟上方盘旋[b]；它展开翅膀，接起其中一只，把它背在自己的翼羽[c]上。
  rationale: 修订以“它”持续呈现原文的鹰之比喻，避免将上下文的神学应用提前写入本节的人称指代；“其中一只／它”则清楚保留原文由复数“雏鸟”转为单数受词的变化。将“接住”改为“接起”避免增添坠落情节；其余意象、词汇层次及脚注锚点均予保留。
