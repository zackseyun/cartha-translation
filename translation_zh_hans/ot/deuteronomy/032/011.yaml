  source_fidelity: 需修订。希伯来文全句的阳性单数动词和后缀在语法上仍可连续指向“鹰”；本节本身并未明示在后半句由鹰转换为耶和华。草案用“他”会在现代汉语中强烈触发男性人称／神的所指，过早消除了原文比喻载体与所指之间的歧义。“接住”也较像接住正在坠落的对象，超过了לקח“取、带起”的基本语义。
  naturalness: “搅动自己的巢窝”略显累赘，且容易理解为搅动巢的实体；“搅动巢穴”较凝练。将后半句的鸟类指称明确为“它”，并以“其中一只”对应原文从复数雏鸟转为单数宾语，可使中文指代清楚、自然。
  terminology: “鹰”及其“秃鹫”脚注可保留；“翼羽”恰当地与前面的“翅膀”区别。脚注c宜更准确说明其为翅膀外侧的长羽，而非泛指所有翅羽。
