base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/011.yaml
  text: Like an eagle that stirs up its nest[a], that hovers over its young, he spreads out his wings, takes him[c][b], and carries him on his pinions.
translation:
  language: zh_hans
  text: 如鹰[a]搅动巢穴，在雏鸟上方盘旋[b]；它展开翅膀，接起其中一只，把它背在自己的翼羽[c]上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “鹰”或译“秃鹫”；希伯来语נֶשֶׁר可指大型食腐鸟或鹰类猛禽。
    reason: lexical_alternative
  - marker: b
    text: “盘旋”也可译“振翅悬飞”或“覆护”。
    reason: lexical_alternative
  - marker: c
    text: “翼羽”指翅膀外侧的长羽，也可泛译为“翅膀”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּנֶשֶׁר
  choice: 如鹰
  rationale: נֶשֶׁר指大型猛禽或食腐鸟；“鹰”符合本段保护、承托的意象，也承接汉语圣经传统，同时以脚注保留“秃鹫”的动物学可能性。
- source_word: יָעִיר קִנּוֹ
  choice: 搅动自己的巢窝
  rationale: עור的使役形表示使之醒起、激动或搅动；这里以“搅动”保留亲鸟使巢中雏鸟活动起来的生动意象。
- source_word: עַל גּוֹזָלָיו יְרַחֵף
  choice: 在雏鸟上方盘旋
  rationale: רחף可指盘旋、振翅悬飞，也可能带有覆护意味；“盘旋”自然且不把动作过度解释为孵育。
- source_word: יִפְרֹשׂ כְּנָפָיו
  choice: 他展开翅膀
  rationale: פרשׂ意为展开、伸展；采用“他”保留诗句可能由鹰的比喻转向耶和华这一所指的细微过渡。
- source_word: יִקָּחֵהוּ
  choice: 接住他
  rationale: לקח通常为拿取、接取；在展翅承托的图景中，“接住”自然。阳性单数宾语以“他”呈现，使其既可个体化雏鸟，也可让上下文中的以色列成为所指。
- source_word: יִשָּׂאֵהוּ
  choice: 把他托在
  rationale: נשׂא表示举起、承载；“托在”准确传达翅上承载的画面。
- source_word: עַל אֶבְרָתוֹ
  choice: 在翼羽上
  rationale: אֶבְרָה较כָּנָף更偏向翼上的长羽或翮；“翼羽”既保留词汇区别，又比生僻的专门术语更易懂。
theological_decisions:
- issue: 比喻内部的人称与所指转换
  choice: 前半以鹰的图景叙述，后半采用“他”，并把阳性单数宾语译为“他”
  alternative: 全句使用“它”，始终只呈现鸟与雏鸟的图景
  rationale: 希伯来语全句使用阳性单数形式，单凭语法不能证明所指转换；但上下文明确以鹰喻耶和华对以色列的照顾。译作“他”保留从比喻载体转向神及以色列的诗性张力，而不直接增补“耶和华”来消除歧义。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言；保留原文由复数“雏鸟”转为阳性单数受词的变化，并借“他”维持比喻与其神学所指之间未完全明说的张力。脚注标记均置于对应词语之后。
