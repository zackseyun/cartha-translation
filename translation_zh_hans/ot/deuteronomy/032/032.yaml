base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/032.yaml
  text: For their vine is from the vine of Sodom, and from the fields of Gomorrah; their grapes are grapes of poison, their clusters are bitter to them.
translation:
  language: zh_hans
  text: 因为他们的葡萄树出自所多玛的葡萄树，来自蛾摩拉的田地；他们的葡萄是毒葡萄，他们的果串对他们而言是苦的。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גֶּפֶן / גַּפְנָם
  choice: 葡萄树／他们的葡萄树
  rationale: 保留原文以葡萄树比喻其来源与性质的意象，并自然表达三复阳性附属代词。
- source_word: שַׁדְמוֹת
  choice: 田地
  rationale: 该词指耕地或田野；“田地”符合上下文，也便于现代读者理解。
- source_word: רֹאשׁ
  choice: 毒
  rationale: 此处不是“头”，而是指有毒或苦毒之物；译作“毒”与“葡萄”搭配自然，并保留致害含义。
- source_word: אַשְׁכְּלוֹת
  choice: 成串的果子
  rationale: 指葡萄串；译法既呈现“串”的形态，又避免只用“果穗”所可能带来的谷物联想。
- source_word: מְרֹרֹת לָמוֹ
  choice: 对他们是苦的
  rationale: 保留 לָמוֹ 的受事/关联含义，不将其省略；阴性复数形容词与“串”所指的果实相应。
theological_decisions:
- issue: 所多玛和蛾摩拉意象的性质
  choice: 按原文保留地名与葡萄树、田地的平行比喻
  alternative: 解释性译为“他们像所多玛和蛾摩拉一样败坏”
  rationale: 原文借植物来源与果实性质表达败坏，不宜在正文中把隐喻直接化约为神学解释。
- issue: לָמוֹ 的表达
  choice: 译出“对他们”
  alternative: 省略，作“成串的果子都是苦的”
  rationale: 原文明确含有第三人称复数关联成分；保留它也保存“苦味归于/临到他们”的可能张力。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语；保留原文重复的“葡萄树”和由来源到果实的诗性推进，不增添解释性脚注。
