base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/007.yaml
  text: Remember the days of old[a]; consider the years of generation after generation. Ask your father, and he will tell you, your elders[b], and they will say to you.
translation:
  language: zh_hans
  text: 你要记住古时的日子，思想世世代代的年岁[a]。问你的父亲，他必告诉你；问你的长者，他们必对你说。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“一代又一代的年岁”，指接续不断的历代。
    reason: lexical_alternative
lexical_decisions:
- source_word: זְכֹר
  choice: 记住
  rationale: 该词是זכר的Qal命令式，直接吩咐听者记念、牢记；“记住”自然清楚，也与后面的“思想”形成呼应。
- source_word: יְמוֹת עוֹלָם
  choice: 古时的日子
  rationale: 该结构指久远年代、上古时期；“古时的日子”保留了希伯来语以“日子”指历史时期的表达。
- source_word: בִּינוּ
  choice: 思想
  rationale: בין在此为命令式，可指明白、辨察或仔细思量。上下文要求人反思历史，因此译作“思想”，既保留认知意味，也符合劝诫语气。
- source_word: שְׁנוֹת דּוֹר וָדֹר
  choice: 世世代代的年岁
  rationale: 原文直译近于“一代又一代的年岁”，是指接续不断的历代；“世世代代的年岁”保留原有的“年岁”意象和历代相承之意。
- source_word: שְׁאַל
  choice: 问
  rationale: שאל在这里是简单直接的命令“询问”；现代汉语用“问”最自然。第二个“问”按汉语并列结构补出，使两个受词关系清晰。
- source_word: אָבִיךָ
  choice: 你的父亲
  rationale: 单数名词加第二人称阳性单数后缀，通常指听者的父亲。原文没有必要扩大为“祖先”，故保留直接词义。
- source_word: וְיַגֵּדְךָ
  choice: 他必告诉你
  rationale: נגד的Hiphil词形表示告知、讲明。“告诉你”是自然且准确的现代汉语表达；“必”体现未完成式在命令之后所表达的预期结果。
- source_word: זְקֵנֶיךָ
  choice: 你的长者
  rationale: 该词指群体中年长而有经验的人；“长者”既表达年龄和传承角色，也避免把它限定为正式职衔。
- source_word: וְיֹאמְרוּ לָךְ
  choice: 他们必对你说
  rationale: אמר是常用的“说”。译作“对你说”保留其与前句“告诉你”之间细微的词汇变化和诗歌平行结构。
theological_decisions: []
