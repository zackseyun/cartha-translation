  yaml_path: translation/ot/deuteronomy/032/028.yaml
  text: For they are a nation devoid of counsel, and there is no understanding in them.
translation:
  language: zh_hans
  text: 因为他们是个谋略尽失的民族，他们中间毫无悟性。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 在此承接上文并说明理由；“因为”自然保留了希伯来语的因果或解释功能。
- source_word: גּוֹי
  choice: 民族
  rationale: 该单数集合名词指一个整体的族群；“民族”在现代汉语中准确而自然。
- source_word: אֹבַד עֵצוֹת
  choice: 谋略尽失
  rationale: אֹבַד与复数עֵצוֹת构成凝练表达，意指失去或缺乏明智的谋划；“谋略尽失”既保留“失去”的词义色彩，也符合汉语表达。
- source_word: הֵמָּה
  choice: 他们是
  rationale: 独立代词带有强调作用，并在名词句中承担主语；汉语以“他们是”清楚呈现句法关系。
- source_word: וְאֵין
  choice: 毫无
  rationale: 表达存在性否定；在后半句中译作“毫无”简洁有力，并与原文的绝对否定相称。
- source_word: בָּהֶם
  choice: 他们中间
  rationale: 保留介词所表达的群体内部范围，说明这种悟性在他们当中不存在。
- source_word: תְּבוּנָה
  choice: 悟性
  rationale: 该词指理解、洞察和辨别能力；“悟性”能体现智慧文学语境中的明辨能力，且与“谋略”形成自然搭配。
