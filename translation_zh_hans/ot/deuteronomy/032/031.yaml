  text: כִּ֛י לֹ֥א כְ/צוּרֵ֖/נוּ צוּרָ֑/ם וְ/אֹיְבֵ֖י/נוּ פְּלִילִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/031.yaml
  text: For their rock is not like our Rock[a], and our enemies are judges.
translation:
  language: zh_hans
  text: 因为他们的磐石不像我们的磐石；而我们的仇敌也作出裁断。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语 פְּלִילִים 是带司法意味的复数名词，字面可指“审判者、仲裁者”。因此末句也可译作“我们的仇敌也是审断者”，或按语境译作“连我们的仇敌也这样断定”。
    reason: 说明 פְּלִילִים 的名词形式、司法语义及其在语境中可作动词性表达的可能，不把后者强加为正文的唯一解释。
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 在此承接上文，为前面的断言提出理由；“因为”自然体现其解释性作用。
- source_word: כְצוּרֵנוּ צוּרָם
  choice: 他们的磐石不像我们的磐石
  rationale: 保留同一个“磐石”意象及其刻意形成的对照，不把它解释性改写为“保护者”“避难所”等。中文没有英文大小写之分，故不以字形区分真神与列国所倚靠的对象。
- source_word: וְאֹיְבֵינוּ
  choice: 我们的仇敌也
  rationale: 保留并列关系；“也”使汉语衔接自然，并传达仇敌竟能参与裁断的修辞意味，但不把原文明确改写成“连……也这样承认”。
- source_word: פְּלִילִים
  choice: 裁判者
  rationale: 该复数名词本义为作出裁决的人或仲裁者。译作“裁判者”保留名词形式和司法语感，同时让上下文可能表达的“仇敌也能作出判断”仍可被读出。
theological_decisions:
- issue: 是否把 צוּר 的比喻直接解释为某种神学称号
  choice: 两处均保留“磐石”
  alternative: 保护者、避难所、力量
  rationale: 原文用同一名词对照以色列的神与列国所倚靠的对象。保留该比喻可维持诗歌的文字呼应与神学张力，不用解释性称号缩窄含义。
- issue: 是否把 פְּלִילִים 明确改写为仇敌承认或见证
  choice: 正文保留名词性的“裁判者”
  alternative: 连我们的仇敌也这样断定；我们的仇敌也承认这一点
  rationale: 原文只说仇敌是“裁判者／仲裁者”，并未明说他们裁定的具体内容。正文保留其简洁和一定程度的含混，脚注说明语境中的可能理解。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语体。“磐石”是圣经语境中自然且有尊严的神性比喻；“裁判者”略带司法色彩，刻意对应原文 פְּלִילִים。
