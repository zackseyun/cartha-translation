  source_fidelity: “他们的磐石不像我们的磐石”准确保留了希伯来文以同一名词形成的对照；“因为”也可恰当地表达 כִּי 在此的说明性用法。末句的 פְּלִילִים 带有裁断／审断的司法语义，正文宜使这一语义在现代汉语中自然可读，同时不把它扩展为明确的“承认”。
  naturalness: “我们的仇敌也是裁判者”在现代汉语中不够自然：“也是”容易造成不明的并列或同类关系，“裁判者”又较容易联想到体育裁判。改为“而我们的仇敌也作出裁断”更符合汉语表达，并保留原文简洁的司法性陈述；未明说其裁断的具体内容。
  terminology: “磐石”庄重、自然，并忠实保留原文的重复意象。以“作出裁断”对应 פְּלִילִים，可避免“裁判者”的体育语感；脚注说明其名词形式及“审判者／仲裁者”的字面范围。
