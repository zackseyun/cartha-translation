  text: כִּ֛י שֵׁ֥ם יְהוָ֖ה אֶקְרָ֑א הָב֥וּ גֹ֖דֶל לֵ/אלֹהֵֽי/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/003.yaml
  text: For I will proclaim the name of Yahweh[a]; ascribe greatness to our God.
translation:
  language: zh_hans
  text: '因为我要宣告雅威[a]的名；

    你们要将伟大归给我们的上帝。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文为“YHWH”（四字神名），这里音译作“雅威”；传统译本常译作“耶和华”，也有译法以“主”代称。
    reason: 交代神名原文及常见的其他译法。
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 保留因果连接作用，说明本句与上下文劝告或诗歌宣告之间的理据关系。
- source_word: שֵׁם
  choice: 名
  rationale: 直接保留原文的具体用语；这里也包含雅威所启示的身份与声誉，但不将其解释性改写出来。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文四字神名 YHWH 音译，保留其作为以色列上帝之专名的性质，不以称号代替。
- source_word: אֶקְרָא
  choice: 我要宣告
  rationale: 在诗歌公开传扬雅威之名的语境中，“宣告”比含义较宽的“呼求”或“称呼”更贴切；未完成式在此译为将来或意愿性的“我要”。
- source_word: הָבוּ
  choice: 你们要尊……为
  rationale: 这是复数命令式，要求听众承认上帝本有的伟大；明确译出“你们”，并避免让人误以为人能把伟大实际赐给上帝。
- source_word: גֹדֶל
  choice: 大
  rationale: 在“尊……为大”的自然汉语结构中表达“伟大、尊大”，既保留核心意义，也避免生硬的名词搭配。
- source_word: לֵאלֹהֵינוּ
  choice: 我们的上帝
  rationale: 准确表达第一人称复数所属关系；原文介词的归向意义已融入“尊……为大”的句式。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名 YHWH，因此正文采用常见的学术性音译“雅威”，并在脚注交代传统译法，既保存专名性质，也让普通读者能够辨认。
- issue: “将伟大归给上帝”的含义
  choice: 尊我们的上帝为大
  alternative: 把尊大归给我们的上帝
  rationale: 命令并非暗示人使上帝变得伟大，而是要求听众承认并颂扬他本有的伟大；所选译法自然表达这一点，同时保留原文的赞颂要求。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“宣告……的名”保留原文意象；“尊……为大”比“把伟大归给……”更符合现代汉语，同时保持复数命令的力度。
