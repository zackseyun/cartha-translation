  text: יַרְכִּבֵ֨/הוּ֙ עַל במותי אָ֔רֶץ וַ/יֹּאכַ֖ל תְּנוּבֹ֣ת שָׂדָ֑י וַ/יֵּנִקֵ֤/הֽוּ דְבַשׁ֙ מִ/סֶּ֔לַע וְ/שֶׁ֖מֶן מֵ/חַלְמִ֥ישׁ צֽוּר־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/013.yaml
  text: He made him ride on the heights of the land[a], and he ate the produce of the field; he made him suck honey from the rock[c][b], and oil from the flinty rock.
translation:
  language: zh_hans
  text: 他使他驰骋于大地的高处[a]，吃田野的出产[b]；又使他从磐石中吮吸蜂蜜[c]，从燧石般坚硬的岩石中吮吸油。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在地的高处”。这里大概指地势较高而丰饶的地域，并非祭祀用的“丘坛”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“田野的收成”。
    reason: lexical_alternative
  - marker: c
    text: 或译：“使他从磐石中吸取蜂蜜”。希伯来语动词的字面意思是“使他吮吸”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יַרְכִּבֵהוּ
  choice: 使他乘驾
  rationale: 保留רכב使役式“使……乘驾”的语法力量，也延续本诗居高而行、得享土地的意象。
- source_word: עַל בָּמֳתֵי אָרֶץ
  choice: 在大地的高处
  rationale: במות在这里首先是地形上的高处；译作“大地的高处”既保留诗意，也避免“邱坛”一词无端引入祭祀含义。
- source_word: וַיֹּאכַל
  choice: 吃
  rationale: 采用אכל直接、具体的基本义，保持原文朴实的供养图景。
- source_word: תְּנוּבֹת שָׂדָי
  choice: 田野的出产
  rationale: תנובות指土地所出的产物或收成；“出产”可涵盖各类田间产物，并保留原文集合性的“田野”。
- source_word: וַיֵּנִקֵהוּ
  choice: 使他……吮吸
  rationale: ינק使役式意为“使……吮吸”；虽带有强烈诗性，却准确保留从不可能之处直接吸取滋养的鲜明比喻。
- source_word: דְבַשׁ
  choice: 蜂蜜
  rationale: 这是דבש在此处自然且具体的译法，表达土地所赐的甘美丰饶。
- source_word: מִסֶּלַע
  choice: 从磐石中
  rationale: סלע指岩石或峭岩；“磐石”与蜂蜜的甘美形成强烈反差。
- source_word: וְשֶׁמֶן
  choice: 油
  rationale: 原文只说שמן“油”，没有明说橄榄，因此正文不把所指限定为橄榄油。
- source_word: מֵחַלְמִישׁ צוּר
  choice: 从燧石般的坚岩中
  rationale: חלמיש表示燧石或极坚硬的石头，צור表示岩石；此译兼顾两词，并突出丰盛之物竟出自坚硬岩石的反常意象。
theological_decisions:
- issue: 全节第三人称单数代词的所指
  choice: 正文保留“他使他”等代词，不直接换成“耶和华”和“以色列”
  alternative: 依据上下文在正文中明确写成“耶和华使以色列”
  rationale: 上下文能够说明施事者和受事者，但本节希伯来文本身使用代词。保留代词可忠实呈现诗歌的衔接方式，也避免把解释直接写进正文。
translation_notes:
  register: 采用现代、庄重而可朗读的诗体汉语。正文保留原文连续的使役结构、单数代词和“从岩石吮吸”这一刻意反常的意象；后半句补出重复的“吮吸”，使汉语句法清楚，同时呈现希伯来文动词支配“蜂蜜”和“油”的平行关系。
