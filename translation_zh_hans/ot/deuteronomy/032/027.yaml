  text: לוּלֵ֗י כַּ֤עַס אוֹיֵב֙ אָג֔וּר פֶּֽן יְנַכְּר֖וּ צָרֵ֑י/מוֹ פֶּן יֹֽאמְרוּ֙ יָדֵ֣י/נוּ רָ֔מָה וְ/לֹ֥א יְהוָ֖ה פָּעַ֥ל כָּל זֹֽאת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/027.yaml
  text: Were it not that I feared the provocation of the enemy[a], lest their adversaries should misunderstand, lest they should say, ‘Our hand is exalted[c][b], and Yahweh has not done all this.’
translation:
  language: zh_hans
  text: 若不是我畏惧仇敌的挑衅[a]，恐怕仇敌误解[b]，恐怕他们说：‘是我们的手占了上风[c]，这一切并不是雅威所做的。’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“若不是我惧怕仇敌的挑衅。”
    reason: 保留 אָגוּר 的近义自然译法。
  - marker: b
    text: 译作“误解”的希伯来语动词含义较难确定，也可理解为“误判”或“认不清”；语境显示，他们没有看清以色列败亡的真正原因。
    reason: 说明 יְנַכְּרוּ 的词义不确定性，而不在正文补出未明说的宾语。
  - marker: c
    text: 直译：“我们的手高了。”这是得胜和自我抬高的比喻。
    reason: 交代 יָדֵינוּ רָמָה 的字面表达及语境含义。
lexical_decisions:
- source_word: לוּלֵי
  choice: 若不是
  rationale: 保留反事实兼例外条件的作用，并以自然现代汉语承接上下文。
- source_word: כַּעַס אוֹיֵב אָגוּר
  choice: 我顾忌仇敌的挑衅
  rationale: כעס 在此指仇敌因以色列败亡而产生的傲慢挑衅；אגור 直译可作“惧怕”，但“顾忌”既保留因其可能反应而有所克制之意，也避免误解为雅威因力量不足而害怕仇敌。脚注保留较直译的可能。
- source_word: פֶּן
  choice: 恐怕
  rationale: 两次重复译出，保留原文两个防范性从句的平行结构。
- source_word: יְנַכְּרוּ
  choice: 误判
  rationale: 该词在此语义困难；结合后句，最可能指敌手错误判断以色列败亡的真正原因。
- source_word: צָרֵימוֹ
  choice: 他们的敌手
  rationale: 保留附属代词的复数指向及与前一分句“仇敌”相近但不完全合并的措辞。
- source_word: יָדֵינוּ רָמָה
  choice: 我们的手高举了
  rationale: 保留“手高”的具体比喻，同时用“高举了”表达敌人自称得胜、自我抬高的语气。
- source_word: יְהוָה
  choice: 雅威
  rationale: 采用神圣四字名的汉语音译，而不以称号替代其专名。
- source_word: פָּעַל כָּל זֹאת
  choice: 这一切并不是雅威所做的
  rationale: 直接表达敌手否认以色列遭遇出于雅威作为的断言。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 以现代汉语常用的学术性音译呈现其专名性质，不用称号取代。
- issue: אגור 的拟人化表达
  choice: 顾忌
  alternative: 惧怕；畏惧
  rationale: 原文确用表示害怕或戒惧的第一人称动词。正文用“顾忌”传达雅威因仇敌可能误判而克制行动；脚注说明更直译的译法，从而不抹去原文张力。
- issue: 仇敌对以色列败亡原因的判断
  choice: 误判
  alternative: 误解；认不清
  rationale: 不替原文补明宾语，只由上下文显示他们误把胜利归于自己的力量，而不归于雅威。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语；保留“若不是……恐怕……恐怕……”的论证结构和两重防范语气。正文不补足原文未明说的误判对象，脚注解释语境。
