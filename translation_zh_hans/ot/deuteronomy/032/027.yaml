  rationale: 修订仅处理指代、句法和比喻表达：以“仇敌”重复呈现敌对者，避免“他们的敌手”的汉语歧义；将“手高”的夸胜语改为“占了上风”，并以脚注保留字面意象；将“顾忌”改为“畏惧”，更直接对应原文。其余结构、神名和语义不变。
