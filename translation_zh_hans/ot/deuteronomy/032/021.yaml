  to: '他们以那不是神的事物，激起我的嫉妒；

    以他们的虚妄之物[a]，惹我发怒。

    我也要以不成民族的群体[b]，激起他们的嫉妒；

    以愚妄的民族[c]，惹他们发怒。'
  rationale: 修订仅处理汉语表达和群体性：以“那不是神的事物”补足句法，以“不成民族的群体”传达“非一民”的悖论性贬抑，并以“愚妄”更自然地表达其道德—宗教意义。保留泛指，不指定该群体或民族为何者。
