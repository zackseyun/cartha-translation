  text: הֵ֚ם קִנְא֣וּ/נִי בְ/לֹא אֵ֔ל כִּעֲס֖וּ/נִי בְּ/הַבְלֵי/הֶ֑ם וַ/אֲנִי֙ אַקְנִיאֵ֣/ם בְּ/לֹא עָ֔ם בְּ/ג֥וֹי נָבָ֖ל אַכְעִיסֵֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/021.yaml
  text: They made me jealous with what is not a god[a]; they provoked me to anger with their idols. So I will make them jealous with those who are not a people[c][b]; I will provoke them to anger with a foolish nation.
translation:
  language: zh_hans
  text: '他们以那不是神的事物，激起我的嫉妒；

    以他们的虚妄之物[a]，惹我发怒。

    我也要以不成民族的群体[b]，激起他们的嫉妒；

    以愚妄的民族[c]，惹他们发怒。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“他们的偶像”。原文词语本指气息、空虚或虚妄；在这里可借指毫无价值的偶像。
    reason: lexical_alternative
  - marker: b
    text: 直译“以不是一民的”；这句话刻意与上文“那不是神的事物”相呼应。
    reason: lexical_alternative
  - marker: c
    text: 这里的“愚妄”主要指道德和属灵上的悖谬，并非仅指智力不足。
    reason: cultural_note
lexical_decisions:
- source_word: קִנְאוּנִי / אַקְנִיאֵם
  choice: 激起我的嫉妒 / 激起他们的嫉妒
  rationale: 前者与后者构成刻意的报应性对应；“激起……的嫉妒”既保留使役含义，也比生硬的直译更符合现代汉语。
- source_word: בְּלֹא אֵל
  choice: 以那不是神的
  rationale: 保留“非神”与后文“不成一民”之间的修辞对应，不把所指过早限定为某一类偶像。
- source_word: כִּעֲסוּנִי / אַכְעִיסֵם
  choice: 惹我发怒 / 惹他们发怒
  rationale: 准确表达使役意义，并保留前后对称；“惹……发怒”自然、清楚且庄重。
- source_word: בְּהַבְלֵיהֶם
  choice: 他们的虚妄之物
  rationale: הבל本义涉及气息、空虚和虚妄，在本语境中指向偶像；正文保留其贬抑性的词义张力，脚注说明具体所指。
- source_word: בְּלֹא עָם
  choice: 以不成一民的人
  rationale: 保留原文“不是一民”的悖论式表达及其与“不是神”的平行，同时使现代汉语读者能够理解这是指一群人。
- source_word: בְּגוֹי נָבָל
  choice: 以愚顽的民族
  rationale: “愚顽”可表达נבל所含的道德、属灵乖谬，而不只是智力不足；“民族”在此适合指一个群体或国家民族。
theological_decisions:
- issue: “不成一民的人”与“愚顽的民族”所指为何
  choice: 正文保持泛指，不点明具体历史民族
  alternative: 译为某个外邦民族或外邦人整体
  rationale: 希伯来文本本身没有明确指认某一民族；保持泛指可保存经文的审判性修辞及其后续解释空间。
- issue: 神的“嫉妒”
  choice: 直译为“嫉妒”
  alternative: 译为“忌邪”或“妒忌之怒”
  rationale: 原文前后使用同一词根，强调对应性的审判；“嫉妒”最能保存这一对应，而“忌邪”会在正文中加入解释性的神学限定。
translation_notes:
  register: 采用现代、庄重而易懂的诗体散文；以分行呈现原文两组对称句。重复使用“激起……的嫉妒”和“惹……发怒”，突出原文以彼之道还施彼身的结构。
