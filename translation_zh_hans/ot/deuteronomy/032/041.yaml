base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/041.yaml
  text: when I sharpen the lightning of my sword, and my hand takes hold of judgment, I will return vengeance on my adversaries, and I will repay those who hate me.
translation:
  language: zh_hans
  text: 当我磨利我的刀剑，使它闪耀如闪电，我的手执掌审判时，我必向我的仇敌施行报复，报应恨我的人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִם
  choice: ……时
  rationale: 本节与上一节相连，条件句在诗歌语境中带有时间指向；译作“……时”符合汉语表达，也保留事件一旦发生便随之施报的关系。
- source_word: שַׁנּוֹתִי
  choice: 我磨亮
  rationale: 源自动词שׁנן，此处指磨利、磨亮武器；“磨亮”既贴合其使刀锋锐利明亮的含义，也与后面的“闪电般”自然衔接。
- source_word: בְּרַק חַרְבִּי
  choice: 闪电般的刀剑
  rationale: 希伯来语直译近于“我刀剑的闪电”，描写剑刃闪耀如电；汉语以明喻表达可避免误解为刀剑本身就是闪电。
- source_word: וְתֹאחֵז בְּמִשְׁפָּט יָדִי
  choice: 手掌握审判之权
  rationale: 直译为“我的手抓住审判”。“掌握审判之权”保留手与审判的意象，同时在现代汉语中清楚表达亲自行使公正裁决。
- source_word: אָשִׁיב נָקָם
  choice: 施行报复
  rationale: 字面为“使报复返回”，意指以报复回应敌人；“施行报复”简洁保留神圣惩治的强烈语气，不弱化为一般处罚。
- source_word: לְצָרָי
  choice: 向敌对我的人
  rationale: צַר指敌手、仇敌；采用描述性译法，与下一分句“恨我的人”形成诗歌平行。
- source_word: אֲשַׁלֵּם
  choice: 报应
  rationale: 源自动词שׁלם的强意式，指按其所为偿还、回报；“报应”在此准确传达惩罚性的偿还。
theological_decisions:
- issue: 神的报复与审判之间的关系
  choice: 并列保留“审判”“报复”“报应”等强烈措辞
  alternative: 将其缓和译为“伸张正义”或“惩罚”
  rationale: 原文明确使用מִשְׁפָּט、נָקָם和שׁלם，且将报复置于审判语境中；译文不应淡化，也不额外解释其系统神学意义。
- issue: אִם是条件还是时间表达
  choice: 译为“……时”
  alternative: 译为“如果”
  rationale: 诗歌上下文表达神磨剑、执掌审判之际必定施报；时间译法自然且有古代译本及现代释读支持，但不把行动理解成不确定的假设。
translation_notes:
  register: 采用庄重而现代的普通话，保留申命记之歌的诗性平行结构与司法、战争意象；避免生硬逐词翻译，也不加入原文没有的神学限定。
