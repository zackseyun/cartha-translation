base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/025.yaml
  text: Outside[a], the sword will bereave; and in the inner rooms, terror—both young man and virgin[b], nursing child together with gray-haired man.
translation:
  language: zh_hans
  text: 外有刀剑使人丧子，内室有惊恐[a]；青年和处女[b]，吃奶的婴孩和白发老人——无一幸免。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“从内室而来的惊恐。”希伯来文将外面的危险与里面的恐惧相对照。
    reason: lexical_alternative
  - marker: b
    text: “处女”译自希伯来语 בְּתוּלָה，指年轻未婚女子，通常含有童贞之意；也可译作“年轻女子”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִחוּץ
  choice: 外
  rationale: 与后面的“内室”形成简洁鲜明的空间对照，不把范围限定为街上。
- source_word: תְּשַׁכֶּל
  choice: 使人丧亲
  rationale: 该动词的加强词干表示使人失去亲人或儿女；在刀剑为主语的战争语境中，“使人丧亲”自然且保留其使人遭受丧亡之痛的含义。
- source_word: חֶרֶב
  choice: 刀剑
  rationale: 作为战争和杀戮的拟人化施事，“刀剑”符合现代汉语圣经文体。
- source_word: וּמֵחֲדָרִים
  choice: 内室
  rationale: 原文形式上是“从房间/内室”，在诗句中与“外”相对；“内室”保留室内私密空间的意象。
- source_word: אֵימָה
  choice: 惊恐
  rationale: 表达压倒性的恐惧，措辞凝练，适合本节突兀而强烈的诗歌语气。
- source_word: גַּם בָּחוּר גַּם בְּתוּלָה
  choice: 无论青年、处女
  rationale: 两个“也”列举同受灾祸的人群；“处女”保留 בְּתוּלָה 通常所指的未婚年轻女子及其童贞含义。
- source_word: יוֹנֵק
  choice: 吃奶的婴孩
  rationale: 保留分词“正在吃奶”的具体形象，同时以现代汉语自然表达。
- source_word: עִם אִישׁ שֵׂיבָה
  choice: 和白发老人
  rationale: 保留原文以白发指称年老者的具体形象，并与婴孩构成年龄两端的对照。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“外……内室……”保留原文空间对照；末句补出“都不能幸免”，使原文省略谓语的列举在汉语中关系清楚，同时不改变各年龄与性别群体一并遭灾的含义。
