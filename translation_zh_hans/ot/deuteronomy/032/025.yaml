  to: 外有刀剑使人丧子，内室有惊恐[a]；青年和处女[b]，吃奶的婴孩和白发老人——无一幸免。
  rationale: 将“丧亲”改为“丧子”，以符合שׁכל在此的具体含义；调整脚注a，避免无根据地加入“传出”的动作。保留“无一幸免”作为对末尾并列人群受灾的自然汉语表达，但以破折号维持原文名词列举的突兀、沉重的诗歌效果。
