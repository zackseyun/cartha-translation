  naturalness: 修订后保持现代汉语的庄重、凝练，并保留原文的诗歌式省略和“外／内室”的对照。
  terminology: “刀剑”“内室”“惊恐”“处女”“吃奶的婴孩”“白发老人”均可保留。“处女”的注释恰当地说明其词义范围，不应弱化为无条件等同于所有年轻女子。
