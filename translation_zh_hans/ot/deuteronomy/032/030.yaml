  text: אֵיכָ֞ה יִרְדֹּ֤ף אֶחָד֙ אֶ֔לֶף וּ/שְׁנַ֖יִם יָנִ֣יסוּ רְבָבָ֑ה אִם לֹא֙ כִּי צוּרָ֣/ם מְכָרָ֔/ם וַֽ/יהוָ֖ה הִסְגִּירָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/030.yaml
  text: How could one pursue a thousand[a], and two put ten thousand to flight, unless their Rock had sold them, and Yahweh had given them up?
translation:
  language: zh_hans
  text: 一人怎能追赶千人，两人怎能使万人逃跑？除非他们的磐石把他们卖了，雅威把他们交了出去[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“把他们交付了。”原文没有说明交给谁。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵיכָה
  choice: 怎能
  rationale: 该词引出带有惊讶意味的反问；“怎能”在现代汉语中自然地表达这种不可思议的语气。
- source_word: יִרְדֹּף
  choice: 追赶
  rationale: רדף在军事语境中指追逐、追击；“追赶”准确且通俗。
- source_word: אֶחָד אֶלֶף
  choice: 一人……千人
  rationale: 保留原文一人与千人的悬殊数量对比，不作解释性改写。
- source_word: וּשְׁנַיִם
  choice: 两人
  rationale: 直接保留与上一分句平行的数字表达。
- source_word: יָנִיסוּ
  choice: 使……逃跑
  rationale: נוּס的使役式表示使对方逃走；此译明确保留使役含义。
- source_word: רְבָבָה
  choice: 万人
  rationale: 此处表示一万；“万人”简洁自然，并与“千人”形成整齐的平行。
- source_word: אִם לֹא כִּי
  choice: 除非
  rationale: 该组合引出这种反常战果得以发生的唯一解释；“除非”准确传达其条件兼解释作用。
- source_word: צוּרָם
  choice: 他们的磐石
  rationale: “磐石”保留本章中指向神的核心比喻；中文无需借助英文式首字母大写来标示称号。
- source_word: מְכָרָם
  choice: 把他们卖了
  rationale: 保留מכר“卖”的直接比喻，呈现神在审判中将他们置于敌人权下的强烈措辞。
- source_word: וַיהוָה
  choice: 雅威
  rationale: 将四字神名作为专名音译，以区别于一般称谓“主”。
- source_word: הִסְגִּירָם
  choice: 把他们交了出去
  rationale: סגר的使役式在此指把人交在另一方权下；“交了出去”自然，并保留原文未明说接收者的特点。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；采用现代汉语中较贴近YHWH学术复原读音的“雅威”，避免把专名改为称谓。
- issue: צוּר作为神的称号和比喻
  choice: 他们的磐石
  alternative: 他们的神；他们的磐石（用特殊排版标示称号）
  rationale: 保留《摩西之歌》中反复出现的“磐石”意象，不解释成“神”；中文没有大小写之分，语境足以表明其所指。
- issue: “卖了”与“交了出去”的审判含义
  choice: 保留两个平行而不同的动词
  alternative: 两处都译作“交给敌人”
  rationale: 原文先用מכר“卖”，后用סגר使役式“交出”，二者共同描述神任凭其民落入敌手；保留差异可避免抹平原文强烈的交易比喻。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。前两句保持数字递增的诗歌平行结构；后句以“除非”承接反问，既贴近希伯来语次序，也让逻辑关系清楚。
