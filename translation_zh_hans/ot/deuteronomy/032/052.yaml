base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/052.yaml
  text: For you shall see the land from a distance[a], but you shall not go there[b], into the land that I am giving to the sons of Israel.
translation:
  language: zh_hans
  text: 因为你会从远处[a]望见那地，却不能进入我赐给以色列人[b]的那地。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“从对面”或“从远方”。这个希伯来语表达表明，摩西将看见那地，却不能进入。
    reason: lexical_alternative
  - marker: b
    text: 字面是“以色列的儿子们”，这是指以色列全体百姓的惯用称谓。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，为先前的宣告说明原因；现代汉语用“因为”能自然表达这里的因果关系。
- source_word: מִנֶּגֶד
  choice: 从远处
  rationale: 该短语可指“从对面”或“从远处”；在本语境中，重点是摩西只能望见那地而不能进入，因此译作“从远处”最自然。
- source_word: תִּרְאֶה
  choice: 你会……望见
  rationale: 未完成式在此表示将来必然发生的事；“会”保留预告语气，“望见”也符合远距离观看的语境。
- source_word: וְשָׁמָּה לֹא תָבוֹא
  choice: 却不能到那里去
  rationale: שָׁמָּה 指向目的地，בוא 可表示来到、前往或进入；该译法保留“那里”这一指向，并清楚表达摩西被禁止抵达。
- source_word: אֶל הָאָרֶץ
  choice: 不能进入……那地
  rationale: אֶל 在移动语境中表示朝向并进入；破折号后的说明使汉语自然，同时保留原文“那里”与“那地”的复指。
- source_word: אֲשֶׁר אֲנִי נֹתֵן
  choice: 我赐给
  rationale: 分词 נֹתֵן 描写上帝正在实施或即将实施的赐予；汉语“赐给”在不显得累赘的情况下保留神圣施予的语气。
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: 给以色列人
  rationale: 这是指以色列全体百姓的固定民族称谓。正文采用现代汉语自然说法“以色列人”，脚注注明其字面形式。
theological_decisions:
- issue: בְנֵי יִשְׂרָאֵל 的性别形式与群体所指
  choice: 以色列人
  alternative: 以色列的众子／以色列的子孙
  rationale: 原文为阳性复数，字面是“以色列的儿子们”，但作为固定民族称谓，所指是整个以色列群体。正文采用现代汉语中准确而自然的“以色列人”，不把群体误限于男性；字面形式由脚注保留。
- issue: 摩西只能看见而不得进入那地
  choice: 保留“望见”与“不能进入”的鲜明对照
  alternative: 将其弱化为一般性的未能抵达
  rationale: 原文明确宣告摩西将看见那地，却不会进入。译文不解释这一裁决的神学缘由，也不缓和其确定性。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。“望见”体现远距离观看；破折号使“到那里去”与“进入……那地”的复指关系清楚自然。正文中的[a]、[b]均与脚注对应。
