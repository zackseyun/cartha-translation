  text: מְזֵ֥י רָעָ֛ב וּ/לְחֻ֥מֵי רֶ֖שֶׁף וְ/קֶ֣טֶב מְרִירִ֑י וְ/שֶׁן בְּהֵמוֹת֙ אֲשַׁלַּח בָּ֔/ם עִם חֲמַ֖ת זֹחֲלֵ֥י עָפָֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/024.yaml
  text: wasted by famine[a], consumed by plague and bitter destruction; I will send against them the fangs of beasts[c][b], with the venom of things that crawl in the dust.
translation:
  language: zh_hans
  text: 他们因饥荒而消瘦，被疫病[a]和苦毒的毁灭吞噬；我必使野兽的利齿[b]临到他们，也使尘土中爬行之物[c]的毒液临到他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“灼热的病症”。希伯来语“רֶשֶׁף”（勒舍夫）也可能与古代近东一位与疫病有关的神祇之名相呼应。
    reason: 保留该词在普通名词、病症意象与古代专名背景之间的词义张力。
  - marker: b
    text: 直译“野兽的牙齿”。
    reason: 说明“利齿”是符合语境的汉语表达，而原文具体用词是“牙齿”。
  - marker: c
    text: 或译“尘土中的蛇”；原文范围较广，指沿地面爬行的生物。
    reason: 保留该表达可能特指毒蛇、也可能泛指地上爬行生物的歧义。
lexical_decisions:
- source_word: מְזֵי רָעָב
  choice: 因饥荒而消瘦
  rationale: מְזֵי 表示身体衰弱、消瘦或耗尽；结合 רָעָב，在审判语境中译作“因饥荒而消瘦”，既保留身体受摧残的画面，也符合现代汉语表达。
- source_word: לְחֻמֵי רֶשֶׁף
  choice: 被疫病吞噬
  rationale: לְחֻמֵי 是罕见的被动形式，含“被吃尽、吞噬”之意；רֶשֶׁף 在此可指带灼热感的疫病。正文采用常见名词“疫病”，并保留“吞噬”的诗歌意象。
- source_word: קֶטֶב מְרִירִי
  choice: 苦毒的灾殃
  rationale: קֶטֶב 指毁灭性的灾祸或疫疠，מְרִירִי 字面含“苦、苦毒”之意。“苦毒的灾殃”保留希伯来诗句的强烈修饰，同时避免与前面的“疫病”完全重复。
- source_word: שֶׁן בְּהֵמוֹת
  choice: 野兽的利齿
  rationale: שֶׁן 字面为“牙齿”，这里指动物攻击人的牙齿；“利齿”自然传达威胁性。בְּהֵמוֹת 本可泛指动物，但审判语境表明是危险的兽类，故译“野兽”。
- source_word: אֲשַׁלַּח בָּם
  choice: 让……袭击他们／侵害他们
  rationale: 该表达指把灾害遣到他们身上或用来攻击他们。按两个宾语分别采用“袭击”和“侵害”，使汉语自然，同时保留敌对、审判性的方向。
- source_word: חֲמַת
  choice: 毒液
  rationale: 该词也可表示怒气或热气，但与爬行之物搭配时指毒物、毒液；“毒液”在现代汉语中最明确。
- source_word: זֹחֲלֵי עָפָר
  choice: 尘土中爬行之物
  rationale: 原文是广义表达，指贴地或在尘土中爬行的生物，可能包括蛇，但不限于蛇；此译保留范围和尘土意象。
theological_decisions:
- issue: רֶשֶׁף 是否作为古代神祇名处理
  choice: 正文按普通名词译为“疫病”
  alternative: 音译为“勒舍夫”，或译作“灼热的病症”
  rationale: 虽然该词在古代近东背景中可能令人联想到与疫病有关的神祇名，但本节直接列举约的审判灾祸，并不要求读者把它理解为专名。正文采用普通名词，脚注保留词义和文化背景上的真实歧义。
- issue: זֹחֲלֵי עָפָר 的范围
  choice: 保留为广义的“尘土中爬行之物”
  alternative: 具体译作“尘土中的蛇”
  rationale: 上下文中的毒液容易使人想到蛇，但希伯来语本身涵盖范围较广；不把它缩窄为蛇，可避免超出原文。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语体。“消瘦”“吞噬”“苦毒的灾殃”保留原文递进的灾难图景；后半句以“袭击／侵害”避免生硬直译“把利齿和毒液差到他们中间”，同时不削弱上帝主动施行审判的语气。
