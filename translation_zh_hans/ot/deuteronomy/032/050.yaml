base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/050.yaml
  text: and die on the mountain that you are ascending[a], and be gathered to your people, just as Aaron your brother died on Mount Hor and was gathered to his people.
translation:
  language: zh_hans
  text: 你要死在你所登的那座山上，并归到你的族人那里[a]，正如你的兄弟亚伦死在何珥山上，归到他的族人那里一样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“归到你的祖先那里。”希伯来语惯用语直译为“归到你的族人那里”。
    reason: 说明死亡惯用语的常见解释，同时保留正文较贴近原文的表达。
lexical_decisions:
- source_word: וּמֻת
  choice: 你要死
  rationale: מות的祈使形式直接对摩西说话；结合上文的神谕语境，“你要死”既保留直接性，也符合现代汉语表达。
- source_word: בָּהָר אֲשֶׁר אַתָּה עֹלֶה שָׁמָּה
  choice: 在你所登的那座山上
  rationale: עלה保留“登、上去”的向上运动；שׁמה的指向意义通过“那座”自然体现，避免生硬地译作“登到那里”。
- source_word: וְהֵאָסֵף אֶל עַמֶּיךָ
  choice: 并归到你的族人那里
  rationale: “归到……那里”保留被动归聚的死亡委婉语色彩；“族人”较“人民”更能表达亲族群体，同时不把含义限定为“祖先”。
- source_word: כַּאֲשֶׁר
  choice: 正如……一样
  rationale: 自然表达希伯来语的比较关系。
- source_word: אַהֲרֹן אָחִיךָ
  choice: 你哥哥亚伦
  rationale: 这里אָח表示兄弟；亚伦年长于摩西，现代汉语以“哥哥”表达更自然明确。
- source_word: בְּהֹר הָהָר
  choice: 在何珥山上
  rationale: 按专名惯例译为“何珥山”，并以“在……上”对应山地处所。
- source_word: וַיֵּאָסֶף אֶל עַמָּיו
  choice: 归到他的族人那里
  rationale: 与摩西所受命令中的同一表达保持一致，保留该死亡惯用语的内涵与张力。
theological_decisions:
- issue: 死亡惯用语 אסף אל־עמיו 的表达
  choice: 归到你的／他的族人那里
  alternative: 归到你的／他的祖先那里
  rationale: 原文直指“他的民／族人”，虽常用于死亡并可能包含与先人同归之意，却不等同于单纯安葬。“族人”保留原文范围和神学张力，不将其窄化为“祖先”或“埋葬”。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“你所登的那座山”自然传达原文的进行性动作和地点指向；全句保留摩西与亚伦经历之间的平行结构。
