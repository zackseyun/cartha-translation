source:
  edition: WLC
  text: וַ/יִּשְׁמַ֤ן יְשֻׁרוּן֙ וַ/יִּבְעָ֔ט שָׁמַ֖נְתָּ עָבִ֣יתָ כָּשִׂ֑יתָ וַ/יִּטֹּשׁ֙ אֱל֣וֹהַ עָשָׂ֔/הוּ וַ/יְנַבֵּ֖ל צ֥וּר יְשֻׁעָתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/015.yaml
  text: But Jeshurun grew fat and kicked; you grew fat[a], thick, and sleek. Then he forsook God who made him and treated with contempt the Rock of his salvation.
translation:
  language: zh_hans
  text: '但耶书仑肥胖了，便踢蹬起来；

    你肥胖了，粗壮了，肥硕了[a]。

    他离弃了造他的上帝，

    藐视那拯救他的磐石。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “肥硕了”所译的希伯来词十分罕见，确切含义不明；也可能是“被脂肪包裹”或“臃肿了”。上下文清楚表达的是饱食过度、肥壮有余。
    reason: 保留罕见词 כָּשִׂיתָ 的词义不确定性及主要备选解释。
lexical_decisions:
- source_word: יְשֻׁרוּן
  choice: 耶书仑
  rationale: 将这个指称以色列的专名兼称号音译，保留诗歌中的独特称谓及其潜在含义，不直接释作“正直者”或“以色列”。
- source_word: וַיִּשְׁמַן
  choice: 渐渐肥胖
  rationale: 保留“变肥”的具体形象；“渐渐”自然表达状态变化，也让富足导致骄纵的隐喻留给上下文呈现。
- source_word: וַיִּבְעָט
  choice: 踢腾起来
  rationale: 保留吃得肥壮的牲畜踢蹬反抗这一鲜明比喻，而不将其扁平化为“悖逆”。
- source_word: שָׁמַנְתָּ
  choice: 你肥胖了
  rationale: 保留第二人称直接斥责，以及希伯来诗从第三人称转为第二人称的修辞变化。
- source_word: עָבִיתָ
  choice: 粗壮了
  rationale: 延续体态肥厚壮大的具体意象；现代汉语自然，且避免过度解释。
- source_word: כָּשִׂיתָ
  choice: 肥硕了
  rationale: 此罕见词的确切细微含义不确定，但语境明确指过度肥壮；正文采用可读而不过分具体的“肥硕”，异说收入脚注。
- source_word: וַיִּטֹּשׁ
  choice: 离弃了
  rationale: 准确表达抛弃与不忠，符合庄重的现代汉语经文语体。
- source_word: אֱלוֹהַ עָשָׂהוּ
  choice: 造他的上帝
  rationale: 简洁保留上帝是以色列创造者的关系，并对应第三人称单数宾语。
- source_word: וַיְנַבֵּל
  choice: 轻蔑
  rationale: 表达将对方视为卑贱、不值尊重的主动轻慢；比“愚弄”更符合此处语境，又保留羞辱、藐视的力度。
- source_word: צוּר
  choice: 磐石
  rationale: 保留本章反复用于上帝的神圣隐喻；中文无须借助大写即可由语境显明其所指。
- source_word: יְשׁוּעָתוֹ
  choice: 拯救他的
  rationale: 用动词性结构自然表达“他的救恩/拯救”，并明确磐石是其得救的源头。
theological_decisions:
- issue: 叙述在第三人称、第二人称和第三人称之间转换
  choice: 保留“耶书仑……你……他”的人称转换
  alternative: 统一译成第三人称“他”
  rationale: 原文的人称突变使客观描述转成当面斥责，随后又回到叙述，具有明确的诗歌和控诉效果，不应为流畅而抹平。
- issue: צוּר 的神圣隐喻
  choice: 译作“磐石”，保留对上帝的隐喻性称谓
  alternative: 释义为“保护者”或“拯救者”
  rationale: “磐石”是《申命记》32章的重要反复意象；直译可保存诗歌内部的神学关联，而上下文已表明所指是上帝。
- issue: יְשׁוּעָתוֹ 的关系归属
  choice: 译作“那拯救他的磐石”
  alternative: 译作“他救恩的磐石”
  rationale: 两者均可表达原文属格关系；正文采用较自然的现代汉语，同时不把“拯救”限定为某一种系统神学含义。
translation_notes:
  register: 采用现代、庄重而具诗歌力度的简体中文。保留“肥胖—踢腾”的牲畜意象、排比节奏和原文刻意的人称转换；“耶书仑”音译并保留其称号性质。脚注标记[a]已置于对应词后。
