base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/035.yaml
  text: Vengeance is mine[a], and recompense, at the time when their foot slips; for the day of their disaster is near[d][c][b], and what is prepared for them hastens.
translation:
  language: zh_hans
  text: 伸冤和报应都在我[a][d]；到了他们脚下失足的时候[b]，因为他们遭难的日子近了，为他们预备的事正迅速临到[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “报应”也可译作“偿还”或“报偿”。
    reason: lexical_alternative
  - marker: b
    text: “脚下失足”也可译作“脚步摇动”或“脚站立不稳”。原文用单数“脚”作集合性表达。
    reason: lexical_alternative
  - marker: c
    text: 也可译作“为他们注定的事正迅速临近”；希伯来原文的表达较为凝练。
    reason: lexical_alternative
  - marker: d
    text: 本节开头“伸冤和报应都在我”的话被《罗马书》12:19和《希伯来书》10:30引用。
    reason: cross_reference
lexical_decisions:
- source_word: לִי נָקָם וְשִׁלֵּם
  choice: 伸冤和报应都在我
  rationale: לִי 表明伸冤与报偿属于上帝的权柄；“伸冤”体现 נָקָם 的司法性惩治含义，“报应”则自然表达 שִׁלֵּם 的偿还、施报之意。补出“都”使并列关系在现代汉语中清楚。
- source_word: לְעֵת תָּמוּט רַגְלָם
  choice: 到了他们脚下失足的时候
  rationale: 保留原文单数“脚”的集合性意象，同时以“脚下失足”自然表达 תָּמוּט 所描绘的滑动、站立不稳和即将倾覆。
- source_word: כִּי קָרוֹב יוֹם אֵידָם
  choice: 因为他们遭难的日子近了
  rationale: כִּי 按因果关系译为“因为”；אֵיד 指灾祸、灾难或毁灭性遭遇，“遭难的日子”庄重而易懂，并避免擅自限定灾祸的具体形式。
- source_word: וְחָשׁ עֲתִדֹת לָמוֹ
  choice: 为他们预备的事正迅速临到
  rationale: עֲתִדֹת 是压缩的复数实体化表达，指为他们备妥或指定之事；“预备的事”保留内容未明的含混性，“正迅速临到”表达 חָשׁ 的急速迫近。
theological_decisions:
- issue: 上帝施行报应的性质
  choice: 译作“伸冤和报应都在我”
  alternative: “正义属于我”或“我要报仇”
  rationale: 原文强调惩治和报偿是上帝的权柄。“伸冤”保留司法性和经文互文意义，不淡化为泛称的“正义”，也不渲染为出于私愤的报复。
- issue: עֲתִדֹת לָמוֹ 所指内容
  choice: 译作“为他们预备的事”
  alternative: “他们注定的结局”或“他们的灭亡”
  rationale: 原文没有明说所预备之事的具体内容。采用具体但开放的表达，可保留诗句的压缩性和含混性，而不把它提前解释成某一种结局。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语，保留诗歌的简洁力度和司法性审判语汇；不把“预备的事”具体化为“厄运”或“灭亡”，以保存原文张力。
