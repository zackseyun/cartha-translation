revisions:
- from: 他们以外来的[a]使他嫉妒，以可憎之物惹他发怒。
  to: 他们以外来者使他嫉妒，以可憎之物惹他发怒。
  rationale: 修订仅解决“外来的”在汉语中名词悬空的问题。以“外来者”对应原文复数的名词化表达，保留其所指未明；脚注说明语境上可指外来的神。其余措辞已忠实、自然，无须改动。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T05:20:36Z'
review_pass:
  verdict: revise
  source_fidelity: 原文两个分句均为使役式，草稿对“使他嫉妒／惹他发怒”的处理基本准确，也没有在正文擅自补出“神”。然而，“外来的”在现代汉语中不能自然地独立充当名词性宾语，未能清楚承载 בְּזָרִים 的复数名词化用法。改为“外来者”可保留原文未明言其具体所指的余地，并以脚注说明语境中的“外来的神”。
  naturalness: “他们以外来的使他嫉妒”中“外来的”悬空，现代普通话读者会感到句法不完整。“他们以外来者使他嫉妒”语法完整、庄重自然；后句“以可憎之物惹他发怒”亦通顺，并保持原文平行。
  terminology: “嫉妒”“可憎之物”“惹他发怒”均能恰当传达原文的盟约性、谴责性措辞。“外来者”不预设其一定为神；脚注使用“外来的神”或“外邦的神”比“异族的神”更合现代汉语习惯。
  issues:
  - severity: medium
    issue: “以外来的”缺少中心名词，句法悬空。
    rationale: בְּזָרִים 虽可理解为形容词名词化，但汉语“外来的”通常须修饰名词，不能在此自然地独立使用。补作“外来者”只补足汉语必要的名词化表达，不将“神”写入正文，仍保留原文的歧义。
  - severity: low
    issue: 脚注中的“异族的神”措辞不够自然。
    rationale: 现代普通话通常说“外邦的神”或“外来的神”。调整为这两种表达，且将直译说明改为“外来者／陌生者”，与修订正文一致。
  revised_text: 他们以外来者使他嫉妒，以可憎之物惹他发怒。
  revised_footnotes:
  - marker: a
    text: 或译“外来的神”或“外邦的神”；希伯来文直译为“外来者”或“陌生者”。
    reason: 保留原文未明说“神”的措辞，同时说明偶像崇拜语境中的可能含义。
