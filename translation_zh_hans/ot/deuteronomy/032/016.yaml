  yaml_path: translation/ot/deuteronomy/032/016.yaml
  text: They made him jealous with strangers[a]; with abominations they provoked him to anger.
translation:
  language: zh_hans
  text: 他们以外来者使他嫉妒，以可憎之物惹他发怒。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יַקְנִאֻהוּ
  choice: 使他嫉妒
  rationale: 使役式表达“使他产生嫉妒或忌邪之情”；此译保留原文拟人化的盟约语言，也与下半句形成平行。
- source_word: בְּזָרִים
  choice: 以外来的
  rationale: זָרִים 字面指“外来的、陌生的（人或物）”。希伯来文没有明说“神”，因此正文保留其省略和一定的歧义；语境所指的外来神明在脚注中说明。
- source_word: בְּתוֹעֵבֹת
  choice: 以可憎之物
  rationale: תּוֹעֵבָה 指令人憎恶、厌恶之物，在本段语境中尤与偶像崇拜有关。“可憎之物”庄重而自然，并保留复数所表达的概括意义。
- source_word: יַכְעִיסֻהוּ
  choice: 惹他发怒
  rationale: כעס 的使役式表示使某人动怒。“惹他发怒”在现代汉语中自然，并清楚呈现其使役含义。
theological_decisions:
- issue: 是否在 בְּזָרִים 中明说偶像崇拜的对象
  choice: 正文译为“外来的”，不补出“神”
  alternative: 外来的神；异族的神
  rationale: 上下文明确涉及以色列敬拜别神，但本节希伯来文本身只说“外来的”。正文不补足隐含名词，以保留原文的简练和歧义；脚注交代语境上可能的理解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“以……使……”和“以……惹……”保留两个分句的平行结构；“外来的”略带悬置感，是为忠实呈现希伯来文省略的中心名词，而脚注帮助读者把握语境。
