language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: עֲלֵ֡ה אֶל הַר֩ הָ/עֲבָרִ֨ים הַ/זֶּ֜ה הַר נְב֗וֹ אֲשֶׁר֙ בְּ/אֶ֣רֶץ מוֹאָ֔ב אֲשֶׁ֖ר עַל פְּנֵ֣י יְרֵח֑וֹ וּ/רְאֵה֙ אֶת אֶ֣רֶץ כְּנַ֔עַן אֲשֶׁ֨ר אֲנִ֥י נֹתֵ֛ן לִ/בְנֵ֥י יִשְׂרָאֵ֖ל לַ/אֲחֻזָּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/049.yaml
  text: Go up to this mountain of the Abarim[a], Mount Nebo, which is in the land of Moab, opposite Jericho, and see the land of Canaan[c][b], which I am giving to the sons of Israel as a possession.
translation:
  language: zh_hans
  text: “你要上亚巴琳山脉的这座山，就是尼波山；这山在摩押地，耶利哥对面。你要观看迦南地，就是我要赐给以色列子孙作产业的地。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֲלֵה
  choice: 你要上
  rationale: 这是עלה的阳性单数祈使式，直接命令摩西登山；“你要上”在现代汉语中自然，并保留向上移动的含义。
- source_word: הַר הָעֲבָרִים הַזֶּה
  choice: 亚巴琳山脉的这座山
  rationale: “亚巴琳”按地名音译；结合后面的同位语“尼波山”，“山脉的这座山”能清楚表达尼波山属于亚巴琳山区，同时保留指示词“这”。
- source_word: הַר נְבוֹ
  choice: 尼波山
  rationale: 按现代中文地名习惯译出希伯来文同位结构“山，即尼波”。
- source_word: אֲשֶׁר בְּאֶרֶץ מוֹאָב
  choice: 这山在摩押地
  rationale: 把关系从句转换为自然的现代汉语分句，准确交代尼波山的位置。
- source_word: אֲשֶׁר עַל פְּנֵי יְרֵחוֹ
  choice: 耶利哥对面
  rationale: 地理语境中的עַל־פְּנֵי表示相对、面对的位置；“对面”简洁自然。
- source_word: וּרְאֵה
  choice: 你要观看
  rationale: ראה的祈使式要求摩西亲眼察看那地；“观看”比单用“看”稍显庄重，又不古奥。
- source_word: אֶת אֶרֶץ כְּנַעַן
  choice: 迦南地
  rationale: 采用现代中文圣经传统中清楚、通行的地名形式。
- source_word: אֲשֶׁר אֲנִי נֹתֵן
  choice: 就是我要赐给
  rationale: 分词נֹתֵן在此表达上帝正在实行或确定将实行的赐予；“要赐给”自然呈现其临近未来及确定性，而“赐”符合上帝授予土地的语境。
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: 以色列子孙
  rationale: 保留希伯来文“以色列的众子”这一固定族群称谓的亲属表达，同时符合通行、可懂的现代中文。
- source_word: לַאֲחֻזָּה
  choice: 作产业
  rationale: אֲחֻזָּה指持有的地产或产业；“作产业”既简练，又保留土地占有权的含义，不将其直接等同于另一个常译为“基业”的希伯来词。
theological_decisions:
- issue: 如何处理בְּנֵי יִשְׂרָאֵל的语法性别与群体所指
  choice: 以色列子孙
  alternative: 以色列人
  rationale: 原文是阳性复数的固定盟约群体称谓。“以色列子孙”保留亲属和后裔意象；在汉语中可作为整个民族的统称，不需额外限定为男性。
- issue: 如何表达土地的赐予
  choice: 我要赐给
  alternative: 我赐给／我正在赐给
  rationale: 原文分词可带现在进行或确定将来的色彩。上下文中以色列尚未实际占有全地，因此“要赐给”最自然，同时不削弱这项神圣授予的确定性。
- issue: אֲחֻזָּה是否译为“基业”
  choice: 产业
  alternative: 基业／所有之地
  rationale: 此词首先表示可持有的地产或产业。“产业”保留法律与土地含义，也避免把它与相关但不同的“产业、基业”术语不加区分地合并。
translation_notes:
  register: 采用自然、庄重而清楚的现代标准汉语。经文以两个命令“你要上……你要观看……”呈现原文祈使语气；适度拆分希伯来文长句，使地理关系与赐地内容易于理解。地名采用简体中文圣经语境中通行的“亚巴琳、尼波、摩押、耶利哥、迦南”。本节无需脚注即可保留原文主要意义。
