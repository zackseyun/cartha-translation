  yaml_path: translation/ot/deuteronomy/032/026.yaml
  text: I said[a], ‘I would scatter them[b]; I would make their memory cease from mankind,’
translation:
  language: zh_hans
  text: 我曾说：“我要把他们驱散[a]，使世人不再记念他们[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我要把他们吹走／吹散”或“我要把他们赶到角落。”这里的希伯来语动词罕见，含义难以确定；也可能指使他们分散各处，或使他们从视线中消失。
    reason: lexical_alternative
  - marker: b
    text: 直译：“使他们的记念从人那里止息。”这里“人”在希伯来语中是集合性单数，也可译为“人类”或“世人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אָמַרְתִּי
  choice: 我曾说
  rationale: אמר的Qal完成式第一人称单数，直接引出耶和华所表明的意向；“我曾说”也能与下文对这一审判意向的制约自然衔接。
- source_word: אַפְאֵיהֶם
  choice: 我要把他们吹散
  rationale: 这是罕见且释义困难的形式，可能与吹散、驱散或赶到角落有关。“吹散”保留了罕见动词可能含有的形象性，同时在中文诗歌语境中自然。
- source_word: אַשְׁבִּיתָה
  choice: 使……不再
  rationale: שבת的Hiphil形式表示使某事止息；与“记得他们”搭配时，“使人间不再记得”准确表达使记忆终止，而不泛化为单纯的毁灭。
- source_word: מֵאֱנוֹשׁ
  choice: 人间
  rationale: אֱנוֹשׁ是指人类的集合性单数，有时凸显人的必死性。“人间”简洁自然地表达从人类当中、在人类社会中消失的意思。
- source_word: זִכְרָם
  choice: 记得他们
  rationale: זֵכֶר表示记忆、追念。将名词结构自然转换为中文动词表达，意为不再有人记念他们，并未扩大为“名号”等衍生含义。
theological_decisions:
- issue: 诗歌中上帝宣告的审判意向
  choice: 用“我要……”表达已宣告的意向，并以“我曾说”置于后续语境之中
  alternative: 译作绝对、无条件的将来陈述：“我必把他们吹散……”
  rationale: 希伯来语形式表达上帝所宣告的意向；下一节说明这一意向受到敌人反应这一因素的制约。因此不把本节默默解释为已经无条件执行的最终判决，同时保留神圣审判言辞本身的力度。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“吹散”保留诗歌意象和原词的不确定性；“使人间不再记得他们”比生硬的“使他们的记忆止息”更符合现代汉语，同时脚注保留原文结构。所有脚注标记均已置入正文。
