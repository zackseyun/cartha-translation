base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/022.yaml
  text: For a fire has been kindled in my anger[a], and it burns to the depths of Sheol; it devours the earth and its produce, and sets ablaze the foundations of the mountains.
translation:
  language: zh_hans
  text: 因为我的怒气中有火燃起，直烧到阴间的最深处[a]；它吞噬大地和地上的出产，并点燃群山的根基。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“直到最低的阴间。”希伯来文直译为“直到阴间，最低之处”。
    reason: 保留 תַּחְתִּית 可作形容“最低的”或表示“最深处”的词义与句法空间。
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，说明先前审判之言的缘由；“因为”在现代汉语中清楚保留因果连接。
- source_word: אֵשׁ קָדְחָה בְאַפִּי
  choice: 有火从我的怒气中燃起
  rationale: קָדְחָה 表达火被点燃、燃起；בְאַפִּי 是以“鼻子”表示愤怒的希伯来语习语，译作“我的怒气”自然准确。“从……中”表现怒气是火焰燃起的源头。
- source_word: וַתִּיקַד
  choice: 直烧到
  rationale: 保留火持续燃烧及其延伸所及的动态；“直……到”自然表达 עַד 所标明的极限。
- source_word: עַד שְׁאוֹל תַּחְתִּית
  choice: 到阴间的最深处
  rationale: “阴间”在中文旧约语境中可指死者所在之域，不直接等同于后期教义中的地狱；“最深处”体现 תַּחְתִּית 的最低、极深之意。
- source_word: וַתֹּאכַל אֶרֶץ וִיבֻלָהּ
  choice: 吞噬大地和地上的出产
  rationale: “吞噬”保留火如同进食的生动隐喻；此处与阴间和山根并列，אֶרֶץ 取宇宙性较强的“大地”；“地上的出产”明确 יְבֻלָהּ 是大地所生之物。
- source_word: וַתְּלַהֵט מוֹסְדֵי הָרִים
  choice: 使群山的根基烈焰腾腾
  rationale: “使”体现动词的使役力度，“烈焰腾腾”传达 לָהַט 的炽烈燃烧意象；“群山的根基”保留原文关于山体最深基础的诗性图景。
theological_decisions:
- issue: שְׁאוֹל 的译法
  choice: 阴间
  alternative: 坟墓；冥府；地狱
  rationale: שְׁאוֹל 指死者所在之域，其内涵比单个坟墓更广，又不宜未经文本许可便等同于后期教义中的“地狱”。“阴间”既符合现代中文圣经语境，也保留旧约概念本身的张力。
- issue: 审判图景的范围
  choice: 大地
  alternative: 土地
  rationale: 本节同时提到阴间深处和群山根基，呈现宏大的诗性审判图景；译作“大地”较能保留这一范围，同时不把诗歌意象系统化为文本未明说的宇宙论。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语；保留摩西之歌中层层推进的火焰意象，并避免以专门教义术语过度界定“阴间”。
