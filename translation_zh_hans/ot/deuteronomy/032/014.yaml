base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/014.yaml
  text: curds from the herd[a], and milk from the flock, with the fat of lambs, and rams, the offspring of Bashan, and goats, with the choicest wheat; and you drank foaming wine[b], the blood of grapes.
translation:
  language: zh_hans
  text: '牛群的凝乳，羊群的奶，


    还有羊羔、巴珊所产的公绵羊和公山羊的脂油，


    以及上好的麦子[a]；


    你喝了醇酒[b]，就是葡萄之血。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“麦子的肾脏之脂”，是指最肥厚、最精良的麦子。
    reason: lexical_alternative
  - marker: b
    text: 或译“红酒”或“起沫的酒”；这个希伯来词指葡萄酒，并可使人联想到色泽浓郁、充分发酵或起沫的酒。
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶמְאַת בָּקָר
  choice: 牛群的凝乳
  rationale: חֶמְאָה指浓稠的乳制品，可能是凝乳、酸乳或乳脂，并不等同于现代意义的黄油；“凝乳”既保留食物意象，也较为准确。בָּקָר是牛类的集合称呼。
- source_word: חֲלֵב צֹאן
  choice: 羊群的奶
  rationale: צֹאן泛指成群的小型牲畜；此处后文另提公山羊，因此译作“羊群”自然地保留牧养场景及集合意义。
- source_word: חֵלֶב כָּרִים
  choice: 羊羔的脂油
  rationale: חֵלֶב字面为脂肪或脂油；保留具体的丰盛食物意象。כָּרִים指幼羊或肥育的幼羊。
- source_word: אֵילִים בְּנֵי בָשָׁן
  choice: 巴珊所产的公绵羊
  rationale: אֵילִים是公绵羊；“巴珊之子”是当地所产或所养之牲畜的诗性说法，译作“巴珊所产”使现代读者容易理解，同时不增添抽象解释。
- source_word: עַתּוּדִים
  choice: 公山羊
  rationale: 该词通常特指雄性的山羊；中文直译可自然保留原文所含的性别信息。
- source_word: חֵלֶב כִּלְיוֹת חִטָּה
  choice: 上好的麦子
  rationale: 字面是“麦子的肾脏之脂”，属于形容麦粒最肥厚、最精良的诗性习语。正文采用可理解的习语意义，字面意象置于脚注。
- source_word: דַם עֵנָב
  choice: 葡萄之血
  rationale: 保留原文以“血”描绘葡萄汁或葡萄酒的鲜明诗歌隐喻。
- source_word: תִּשְׁתֶּה
  choice: 你喝了
  rationale: 这是第二人称阳性单数未完成式；在诗歌回顾上帝供应的叙事语境中，以完成时态表达最自然。
- source_word: חָמֶר
  choice: 浓酒
  rationale: 该词指葡萄酒，并可能带有浓厚、充分发酵或起沫的联想。“浓酒”保留其强烈质感，又避免把不确定的色泽或状态写死。
theological_decisions:
- issue: 如何呈现盟约供应中的丰盛意象
  choice: 保留牲畜、脂油、麦子和葡萄酒等具体农牧产品
  alternative: 将这些意象抽象化为“富足”“奢华”或“盟约之福”
  rationale: 本节本身用具体食物列举耶和华的供应；译文不把诗歌意象提前解释成某一套神学概念。
- issue: “葡萄之血”与“酒”的关系
  choice: 译作“浓酒，就是葡萄之血”，保留同位说明关系
  alternative: 译作“用葡萄之血酿成的浓酒”
  rationale: 希伯来语的并置结构简练而富有诗意，并未明说酿造关系；采用同位表达可避免增补原文没有的逻辑连接。
translation_notes:
  register: 采用现代、庄重而易懂的普通话，保留摩西之歌的排比和具体感。“脂油”较“脂肪”更符合食物与祭牲语境；分行用于显出原文列举和末句诗性落点。
