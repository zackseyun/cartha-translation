  text: יְהוָ֖ה בָּדָ֣ד יַנְחֶ֑/נּוּ וְ/אֵ֥ין עִמּ֖/וֹ אֵ֥ל נֵכָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/012.yaml
  text: Yahweh alone led him[a], and no foreign god was with him.
translation:
  language: zh_hans
  text: 雅威独自引导他[a]，没有外族的神与他同在。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“带领他”。这个希伯来语动词可表示带领或引导。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 采用神圣四字名的现代汉语音译，保留其作为专名的性质，而不以“主”等称号替代。
- source_word: בָּדָד
  choice: 独自
  rationale: 这里作副词，表示雅威在没有其他神协助或相伴的情况下施行引导；“独自”简洁地保留这一强调。
- source_word: יַנְחֶנּוּ
  choice: 引导他
  rationale: נחה 的使役式在本句中表示带领、引导；阳性单数宾语后缀译作“他”，与上下文将雅各／以色列视为一个整体的表达一致。
- source_word: וְאֵין
  choice: 没有
  rationale: 这是存在句的否定形式；汉语以“没有”自然表达。连接词 וְ 在汉语并列结构中无需机械译出。
- source_word: עִמּוֹ
  choice: 与他同在
  rationale: עם 加阳性单数后缀表示陪同或相伴；“与他同在”保留原文关系，也不明确限定代词究竟回指雅威还是以色列。
- source_word: אֵל נֵכָר
  choice: 外族的神
  rationale: נֵכָר 表示外来的、属于异族的；“外族的神”比“奇怪的神”更准确，也保留反偶像崇拜的语境。
theological_decisions:
- issue: 两个阳性单数代词所指的对象
  choice: 保留为“他”，不在正文中明说所指
  alternative: 按上下文明确译为“以色列”，或按集体含义译为“他们”
  rationale: 希伯来文使用阳性单数后缀，上下文把雅各／以色列作为一个整体来称说。汉语“他”既忠实保留单数形式，也保留第二小句中可能存在的回指张力，避免译者替原文消除歧义。
- issue: 雅威与外族之神的关系
  choice: 译为“没有外族的神与他同在”
  alternative: 译为“他没有借助任何外族的神”或“以色列身边没有外族的神”
  rationale: 原文只陈述没有外族之神“与他同在”，并未明说协助、敬拜或归属关系，因此不加入这些解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“雅威”保留神名的专名性质；句式简洁，维持诗歌的平行结构。正文中的脚注标记与脚注条目一致。
