base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/019.yaml
  text: And Yahweh saw and rejected them, provoked to anger by his sons and daughters[a].
translation:
  language: zh_hans
  text: 耶和华看见了，就因他的儿子和女儿惹他发怒而厌弃他们[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “厌弃他们”或译“弃绝他们”或“藐视他们”。
    reason: 保留 נאץ 所涵盖的拒斥与轻蔑两方面词义。
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经中广为人知的传统形式来表达以色列上帝的盟约之名，既与普通读者的使用习惯相符，也区别于一般称谓“主”。
- source_word: וַיַּרְא
  choice: 看见了
  rationale: ראה 的基本义为“看见”；此处承接上文，引出耶和华对百姓行为的回应。
- source_word: וַיִּנְאָץ
  choice: 厌弃他们
  rationale: נאץ 含有鄙弃、唾弃或拒绝之意。“厌弃”保留了因轻蔑和憎恶而拒斥的力度；希伯来文未明说宾语，但上下文清楚指向百姓，因此补出“他们”。
- source_word: מִכַּעַס
  choice: 因为……惹他发怒
  rationale: כעס 表示使人恼怒的挑衅或所引起的愤怒，מִן 在这里可表原因；用因果分句自然传达“由于……的触怒”。
- source_word: בָּנָיו וּבְנֹתָיו
  choice: 他的儿女
  rationale: 希伯来文明确并列“他的众子和众女”；现代汉语“儿女”自然、简洁，同时保留男女两方面。
theological_decisions:
- issue: וַיִּנְאָץ 的隐含宾语
  choice: 依上下文补作“他们”，指以色列百姓。
  alternative: 保持宾语不明说：“耶和华看见了，就厌弃。”
  rationale: 现代汉语在此补出宾语更自然，而其所指已由上下文限定；这并未增加新的神学判断。
- issue: 上帝不悦的表达力度
  choice: 以“厌弃”和“惹他发怒”表达真实而严厉的审判反应。
  alternative: 译作“憎恶他们”或较弱的“不喜悦他们”。
  rationale: “厌弃”既不淡化盟约背叛所引发的拒斥，也避免用“憎恶”过度限定 נאץ 的情感色彩；“惹他发怒”则自然传达 כעס 的致怒含义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“因为他的儿女惹他发怒”将希伯来文名词性因果结构转为自然的中文分句；“儿女”准确涵盖原文并列的儿子与女儿。
