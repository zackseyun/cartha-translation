revisions:
- from: 愚昧无知的百姓啊，你们竟这样报答雅威吗？他不是你的父、那位得着你的吗？是他造了你，建立了你。[a]
  to: 愚昧无知的百姓啊，你们竟这样报答雅威吗？他岂不是你们的父亲、得着你们的那一位[a]吗？是他造了你们，使你们坚立。
  rationale: 修订统一集体称呼的人称，改善“父”的现代汉语表达，并将脚注标记移至“得着你们”之后。正文仍以“得着”保留קנה与“造”“使……坚立”的词汇区别；脚注中性地列出重要替代译法，不预设特定神学解释。
