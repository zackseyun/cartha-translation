base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/006.yaml
  text: Is this how you repay Yahweh[a], O foolish and unwise people? Is he not your Father, who created you? He made you and established you.
translation:
  language: zh_hans
  text: 愚昧无知的百姓啊，你们竟这样报答雅威吗？他岂不是你们的父亲、得着你们的那一位[a]吗？是他造了你们，使你们坚立。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “得着你们”也可译作“创造你们”“买下你们”或“拥有你们”。希伯来语这个动词可表示取得、拥有或买下，在某些语境中也可表示创造。
    reason: 保留קנה在本节中的词义幅度，并将脚注直接锚定于所说明的词语。
lexical_decisions:
- source_word: תִּגְמְלוּ
  choice: 报答
  rationale: 此处指按对方所行的作出回报；在责问语境中，“报答”自然地传达以恶劣行为回报雅威恩惠的讽刺意味。
- source_word: זֹאת
  choice: 这样
  rationale: 指向以色列前文所述的行为方式；“竟这样报答”在现代汉语反问中自然且保留指示作用。
- source_word: עַם נָבָל וְלֹא חָכָם
  choice: 愚昧无知的百姓啊
  rationale: נָבָל含有道德上的愚顽、失德之意，而不只是智力不足；“愚昧无知”保留两个并列描述，并以“啊”体现直接呼告。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以音译呈现四字神名，保留其作为以色列之上帝专名的功能，不以称号替代。
- source_word: הֲלוֹא
  choice: 不是……吗
  rationale: 保留预期肯定回答的反问语气。
- source_word: אָבִיךָ
  choice: 你的父
  rationale: 原文明确称雅威为以色列的父；汉语不靠大小写区分神圣称谓，“父”简洁庄重，并保留关系性。
- source_word: קָּנֶךָ
  choice: 得着你
  rationale: קנה可表示取得、拥有、买得，某些语境也可表示创造。“得着你”保留取得并归属自己的基本意涵，又不与下句“造了你”合并。
- source_word: עָשְׂךָ
  choice: 造了你
  rationale: 在此指上帝塑造以色列；“造”比泛义的“作”更清楚，也与上下文相称。
- source_word: וַיְכֹנְנֶךָ
  choice: 建立了你
  rationale: 该动词表示使稳固、设立或建成；“建立”既可表达民族被构成，也保留使之稳立的含义。
theological_decisions:
- issue: קנה在上帝与以色列关系中的含义
  choice: 得着你
  alternative: 创造你；买赎你；拥有你
  rationale: 该词在此存在真实的词义幅度。紧接着的“造了你，建立了你”已明确表达塑造和设立，因此正文用“得着你”保留三个动词之间的区别，同时以脚注呈现其他可能。
- issue: 上帝作为以色列的父
  choice: 你的父
  alternative: 你的父亲
  rationale: 保留原文直接的父子关系表述，不加进后来的神学限定；“父”较庄重，也适合诗歌语体。
translation_notes:
  register: 采用现代、庄重而可诵读的诗歌语言。以“竟……吗”加强原文责问语气；避免生硬倒装。脚注标记置于整节末尾，正文中的“得着你”与脚注直接对应。
