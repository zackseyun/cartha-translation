base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/005.yaml
  text: They have acted corruptly toward him[a]; they are not his children, because of their defect[b]. They are a crooked and twisted generation.
translation:
  language: zh_hans
  text: 他们向他[a]行事败坏；因他们的污点[b]，他们不是他的儿女；他们是弯曲乖谬的一代人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文在这里艰涩而简约。首句也可理解为“他们败坏了自己”；接下来的词组也可译作“他们的污点”或“他们的过错”。
    reason: alternative_reading
  - marker: b
    text: 本句也可按另一种句法理解为：“他们不是他的儿女；污点在他们身上。”
    reason: syntactical_alternative
lexical_decisions:
- source_word: שִׁחֵת
  choice: 行事败坏
  rationale: 此处שׁחת的皮珥式表达败坏、腐化的行为；“行事败坏”保留动词力量，同时不强行加入原文未明确标出的反身含义。
- source_word: לוֹ
  choice: 向他
  rationale: 带第三人称单数后缀的介词ל在此处关系含混；“向他”保留其与上帝的关系，又不把它过度限定为“得罪他”或“为他”。
- source_word: לֹא בָּנָיו
  choice: 他们不是他的儿女
  rationale: 原文是简短的无系词句。“他们不是他的儿女”以自然汉语补出判断结构，却不加入“再也不是”等原文没有的时间意味。
- source_word: מוּמָם
  choice: 因自己的污点
  rationale: מוּם通常指瑕疵、残缺或污点，在这里具有道德隐喻。原句句法高度压缩；译入“因”使关系可理解，但以脚注保留其他可能构句。
- source_word: דּוֹר
  choice: 一代
  rationale: 在申命记诗歌语境中指一代人；“一代”简洁自然，并保留群体与时代双重色彩。
- source_word: עִקֵּשׁ
  choice: 弯曲
  rationale: 该词表示弯曲、悖谬；“弯曲”保留具体意象，也适合与后一形容词并列。
- source_word: וּפְתַלְתֹּל
  choice: 乖谬
  rationale: 这是罕见形容词，表示扭曲、乖僻；“乖谬”与“弯曲”相配而不重复，且保持庄重、可懂的诗歌语体。
theological_decisions:
- issue: לֹא בָּנָיו是在宣告失去盟约儿女身份，还是在否定其儿女应有的品格
  choice: 他们不是他的儿女
  alternative: 他们不再是他的儿女；他们对他算不得儿女
  rationale: 希伯来文作出严厉否定，却没有明确的时间标记。译文保留张力，不把它扩展为关于盟约身份是否已经丧失的系统性结论。
- issue: 如何分析首个诗行高度压缩的句法
  choice: 他们向他行事败坏；因自己的污点，他们不是他的儿女
  alternative: 他们败坏了自己；他们不是他的儿女；污点在他们身上
  rationale: 马所拉文本的词序和指向存在真实困难。正文采用连贯且无需修改辅音文本的理解；脚注列出主要替代读法，以免消除原文歧义。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“行事败坏”保留诗歌的道德力度；“弯曲乖谬”保留两个近义形容词的并列强化。所有因希伯来文压缩句法而补出的关系均从简处理，并用脚注呈现真实歧义。
