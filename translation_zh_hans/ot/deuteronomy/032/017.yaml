  text: יִזְבְּח֗וּ לַ/שֵּׁדִים֙ לֹ֣א אֱלֹ֔הַ אֱלֹהִ֖ים לֹ֣א יְדָע֑וּ/ם חֲדָשִׁים֙ מִ/קָּרֹ֣ב בָּ֔אוּ לֹ֥א שְׂעָר֖וּ/ם אֲבֹתֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/017.yaml
  text: They sacrificed to demons[a], not God, to gods they had not known, new ones that had recently come[c][b], whom your fathers had not feared.
translation:
  language: zh_hans
  text: 他们向鬼魔献祭，不是向上帝[a]，乃是向他们素不认识的诸神；这些神是新近才来的[b]，是你们的先祖从未畏惧过的[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“不是神”。希伯来语可理解为否认这些受祭者是真正的神，也可理解为将它们与以色列的上帝相对。
    reason: 保留לֹא אֱלֹהַ在专指“上帝”与泛指“神”之间的可能读法。
  - marker: b
    text: 原文直译近似“新的，从近处而来”；此处“近处”较可能指时间，意为最近才出现或被引入。
    reason: 说明חֲדָשִׁים מִקָּרֹב בָּאוּ的紧缩表达及其时间性理解。
  - marker: c
    text: 也可译作“你们的先祖从未因它们战栗”。
    reason: 保留שׂער所含“惊惧、战栗”的形象性含义。
lexical_decisions:
- source_word: יִזְבְּחוּ
  choice: 献祭
  rationale: זבח在此指献上祭牲；“献祭”简洁自然，并保留礼仪性的含义。
- source_word: לַשֵּׁדִים
  choice: 向鬼魔
  rationale: שֵׁדִים指接受错误祭祀的邪灵性存在；“鬼魔”是现代汉语圣经语体中清楚而庄重的对应词。
- source_word: לֹא אֱלֹהַ
  choice: 并非献给上帝
  rationale: 上下文将受祭的鬼魔与以色列真正的上帝相对照；补出“献给”使汉语关系清楚，同时用脚注保留“并不是神”的可能读法。
- source_word: אֱלֹהִים
  choice: 神明
  rationale: 此处为复数，指他们所祭拜的诸神；“神明”既表达复数类别，也与前面的“上帝”形成清楚区别。
- source_word: לֹא יְדָעוּם
  choice: 他们素不认识的
  rationale: ידע的基本义为“认识、知道”；“素不认识”自然表达此前从未认识，而不擅自改作“承认”或“敬奉”。
- source_word: חֲדָשִׁים
  choice: 这些神明是新近才来的
  rationale: 形容词在原文中作名词性用法，承接前面的“神明”；结合下一短语译作“新近才来的”，保持简洁。
- source_word: מִקָּרֹב בָּאוּ
  choice: 新近才来的
  rationale: מִקָּרֹב在此较可能表达时间上的“近来”，即这些神明最近才出现或被引入；脚注说明原文的紧缩表达。
- source_word: לֹא שְׂעָרוּם
  choice: 从未畏惧过的
  rationale: 此处动词表达惊惧、战栗；“畏惧”在现代汉语中自然，并以脚注保留更具形象性的“战栗”。
- source_word: אֲבֹתֵיכֶם
  choice: 你们的先祖
  rationale: 原文直指以色列人的父辈；“先祖”在现代汉语中庄重自然，也准确指向历代祖先。
theological_decisions:
- issue: “鬼魔”与“神明”的关系
  choice: 依次保留两个称谓：“向鬼魔献祭……献给……神明”
  alternative: 将“神明”只视为对“鬼魔”的解释并省去其一
  rationale: 原文刻意叠用שֵׁדִים与אֱלֹהִים，一面指出这些受祭者被当作神明，一面否认它们是以色列真正的上帝；两个称谓都应保留。
- issue: לֹא אֱלֹהַ所否定的对象
  choice: 正文译作“并非献给上帝”
  alternative: 译作“并不是神”
  rationale: 语境主要在对比以色列的上帝与错误崇拜的对象；正文采用专指读法，但以脚注保留希伯来语也可理解为否认这些对象真正具有神性。
- issue: 先祖对新神明的态度
  choice: 译作“从未畏惧过”
  alternative: 译作“从未在它们面前战栗”
  rationale: 不把“畏惧”解释成敬拜、敬畏或承认，以免消除词语可表达的恐惧与战栗之张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“鬼魔—上帝—神明”的连续表述保留原文的论战性层次；适度补出“献给”和“这些神明”，使汉语句法清楚，但不增添系统神学解释。
