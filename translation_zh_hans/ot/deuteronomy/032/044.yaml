base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/044.yaml
  text: Then Moses came and spoke all the words of this song in the hearing of the people[a], he and Hoshea son of Nun.
translation:
  language: zh_hans
  text: 摩西和嫩的儿子何西阿[a]来到，把这首歌的所有话都讲给百姓听。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文作“何西阿”；这人在别处通常称为“约书亚”（见民数记13:16）。
    reason: 说明本节希伯来文本采用“何西阿”这一较少见的名字形式，避免读者误以为是另一人物。
lexical_decisions:
- source_word: וַיָּבֹא
  choice: 来到
  rationale: בוא在此叙事链中表示“来、到来”；“来到”自然地呈现场景转换，又不额外限定移动方向。
- source_word: וַיְדַבֵּר
  choice: 说
  rationale: דבר的强意词干在此为一般的“说、讲说”；采用“说”保留原文朴素直接的表达，不增添“宣告”等修辞力度。
- source_word: אֶת כָּל דִּבְרֵי
  choice: 一切话都
  rationale: 原文强调内容的完整性；“一切话都”在现代汉语中既自然，又保留“所有话语”的周全含义。
- source_word: הַשִּׁירָה הַזֹּאת
  choice: 这首歌
  rationale: שירה在上下文中指摩西之歌；“歌”比“诗”更贴合本段已有的文学称谓。
- source_word: בְּאָזְנֵי הָעָם
  choice: 说给百姓听
  rationale: 该习语直译为“在百姓耳中”，实际表示公开说出、让百姓听见；“说给百姓听”准确而符合现代汉语习惯。
- source_word: הָעָם
  choice: 百姓
  rationale: עם在此指以色列共同体；“百姓”是圣经叙事中自然、庄重且易懂的对应词。
- source_word: הוּא וְהוֹשֵׁעַ
  choice: 同……何西阿一起
  rationale: 希伯来文以独立代词“他”补充说明摩西与何西阿共同参与。汉语用“同……一起”自然表达这一并列关系，同时不重复生硬的“他”。
- source_word: וְהוֹשֵׁעַ
  choice: 何西阿
  rationale: 马所拉文本此处明确使用הוֹשֵׁעַ，而非更常见的“约书亚”这一名字形式，因此按本节原文音译为“何西阿”。
- source_word: בִּן נוּן
  choice: 嫩的儿子
  rationale: 这是标准的父名身份说明；“嫩的儿子”准确、清楚，并符合现代中文圣经人名表达。
theological_decisions:
- issue: 摩西同伴的名字应译作“何西阿”还是较熟悉的“约书亚”
  choice: 何西阿
  alternative: 约书亚
  rationale: 本节希伯来文本写作הוֹשֵׁעַ，故遵从原文保留“何西阿”，不因读者更熟悉“约书亚”而协调改名；脚注说明两种名字形式的关系。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“说给百姓听”自然转达希伯来习语；将“他和何西阿”的后置并列关系整合为“同……一起”，避免中文句法生硬，同时保留两人共同参与的含义。
