  to: 因为耶和华必为他的子民伸冤[a]，也必怜悯他的仆人[b]；他看见他们的力量已经耗尽[c]，被拘禁的和被遗弃的，一个也没有剩下[d]。
  rationale: 修订仅处理两个安全而必要的问题：以“被遗弃的”取代缺乏词汇支持的“被放走的”，从而保留末尾对语的难解性；并将混合脚注拆分、重新锚定，使每项词汇说明准确对应正文。其余主要译法保持不变。
