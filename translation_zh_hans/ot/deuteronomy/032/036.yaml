base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/036.yaml
  text: For Yahweh will vindicate his people and will have compassion on his servants[a], when he sees that their strength is gone, and there is none left[d][c][b], bond or free.
translation:
  language: zh_hans
  text: 因为耶和华必为他的子民伸冤[a]，也必怜悯他的仆人[b]；他看见他们的力量已经耗尽[c]，被拘禁的和被遗弃的，一个也没有剩下[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “伸冤”也可译作“审判”。这里的语境表明，耶和华的审判行动是为他的子民施行公义。
    reason: lexical_alternative
  - marker: b
    text: “怜悯”也可译作“因他的仆人而改变心意”或“因他的仆人而回心转意”。这个希伯来语动词可表示改变心意，也可表示因怜惜而采取行动。
    reason: lexical_alternative
  - marker: c
    text: 原文直译为“手已经消逝”，是力量或能力耗尽的习语。
    reason: idiom
  - marker: d
    text: 原文直译为“被拘禁的和被遗弃的”。这个词组的确切含义不确定，可能是概括所有人的对语，常被理解为“受辖制的或自由的”；整句强调一个也没有剩下。
    reason: alternative_reading
lexical_decisions:
- source_word: יָדִין
  choice: 必为……伸冤
  rationale: דין可指审判、治理或主持公道；本节与怜悯及子民彻底无力的处境并列，语境侧重耶和华施行审判以维护其子民。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代简体中文读者熟悉的专名形式呈现四字神名，不以“主”这一称号取代。
- source_word: וְעַל עֲבָדָיו יִתְנֶחָם
  choice: 也必怜悯他的仆人
  rationale: נחם在此可表达回心转意或因怜惜而采取行动；“怜悯”自然地传达本语境中的慈悲面向，同时以脚注保留“回心转意”的可能。
- source_word: כִּי יִרְאֶה
  choice: 他看见
  rationale: 第二个כִּי说明耶和华施行上述行动时所见的处境，兼有时间和原因色彩；中文不额外添加连接词，可保留这种重叠。
- source_word: אָזְלַת יָד
  choice: 他们的力量已经耗尽
  rationale: 原文直译为“手已经消逝”，是力量或能力完全衰竭的习语；译出实际含义，并在脚注说明字面表达。
- source_word: וְאֶפֶס עָצוּר וְעָזוּב
  choice: 被拘禁的、被放走的，一个也没有剩下
  rationale: 末尾词组含义困难。采取较贴近词面的表达，保留两个被动分词之间的对举及原文歧义，不在正文中武断地限定为“奴仆或自由人”。
theological_decisions:
- issue: יָדִין所表达的耶和华对其子民的司法行动
  choice: 为他的子民伸冤
  alternative: 审判他的子民
  rationale: 上下文将该行动与怜悯仆人、看见他们力量耗尽相连，较支持有利于子民的裁断；脚注保留“审判”的词义，避免抹去司法张力。
- issue: יִתְנֶחָם的怜悯与回心转意含义
  choice: 怜悯他的仆人
  alternative: 因他的仆人而回心转意
  rationale: 语境强调神面对仆人的无助而采取慈悲行动；不过该动词也可指回心转意，因此明确列入脚注，不把两种含义完全等同。
- issue: עָצוּר וְעָזוּב所指的人群
  choice: 以较直译的“被拘禁的、被放走的”保留歧义
  alternative: 奴仆或自由人；无论受辖制的还是自由的
  rationale: 这一固定对语解释不一，可能概括所有人，也可能强调无人存留。正文保留其具体意象，脚注说明主要解释，避免把不确定的社会身份解释写成唯一含义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“伸冤”保留司法语义并符合上下文；末句不强行消除希伯来语难解对语的歧义，而以较贴近词面的正文配合解释性脚注。所有脚注标记均置于相关正文之后。
