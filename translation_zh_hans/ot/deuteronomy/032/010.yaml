base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/010.yaml
  text: He found him in a desert land[a], and in the howling waste of the wilderness; he surrounded him, he cared for him[b], he guarded him like the pupil of his eye.
translation:
  language: zh_hans
  text: 他在荒漠之地、在呼啸的荒凉旷野中找到他；他环绕着他，关怀他[b]，护卫他，如同保护自己眼中的瞳孔[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“如同保护自己眼中的瞳仁。”传统习语常说“像保护自己的眼睛一样”。
    reason: lexical_alternative
  - marker: b
    text: 译作“关怀”的希伯来语动词也可表示“使他明白”或“留心察看他”。
    reason: alternative_reading
lexical_decisions:
- source_word: יִמְצָאֵהוּ
  choice: 找到他
  rationale: מצא的基本义是“找到、遇见”。这里用过去叙事语气表达诗歌对往事的回顾，不增添“拯救”等解释。
- source_word: בְּאֶרֶץ מִדְבָּר
  choice: 在荒漠之地
  rationale: 同时保留אֶרֶץ“地”和מִדְבָּר“荒野、沙漠”的意象；“荒漠之地”简洁庄重。
- source_word: וּבְתֹהוּ יְלֵל יְשִׁמֹן
  choice: 在呼啸的荒凉旷野中
  rationale: תֹהוּ表示空寂荒凉，יְלֵל带有嚎叫、呼啸之感，יְשִׁמֹן指荒芜的旷野。译文保留声音和荒凉感，却不擅自补入原文没有明说的“野兽”。
- source_word: יְסֹבְבֶנְהוּ
  choice: 他环绕他
  rationale: סבב的具体意象是环绕、围住；直译保留其可能具有的保护含义，而不直接把它改写成“保护”。
- source_word: יְבֹונְנֵהוּ
  choice: 关怀他
  rationale: 该动词可表示理解、使人明白或留心关注。上下文是一连串照顾与护卫的行动，因此“关怀”自然体现审慎关注；其他可能义在脚注中保留。
- source_word: יִצְּרֶנְהוּ
  choice: 护卫他
  rationale: נצר意为看守、护卫、保全；“护卫”与下文保护眼睛的比喻衔接自然。
- source_word: כְּאִישׁוֹן עֵינוֹ
  choice: 如同护卫自己的瞳孔
  rationale: אִישׁוֹן עַיִן指眼睛的瞳孔。“瞳孔”比传统习语更直接传达希伯来语的身体意象；为使汉语比喻完整，依上下文补出“护卫”。
theological_decisions:
- issue: 阳性单数代词所指
  choice: 保留连续的单数“他”，把以色列／雅各作为一个整体来描写
  alternative: 改用复数“他们”，或将其理解为个人雅各
  rationale: 上下文以集体单数描写雅各／以色列。保留单数既符合希伯来语语法，也维持诗歌中的人格化，不提前消解集体与个体之间的张力。
- issue: יְבֹונְנֵהוּ的含义
  choice: 关怀他
  alternative: 使他明白；教导他；留心察看他
  rationale: 环绕、护卫的平行语境支持关注照料之义，但该词确实也可能涉及理解或使人明白，因此用脚注明确保留歧义。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。用“呼啸”保留旷野声音意象，同时避免增译“野兽”；连续使用单数“他”以保存原诗将雅各／以色列人格化的表达。
