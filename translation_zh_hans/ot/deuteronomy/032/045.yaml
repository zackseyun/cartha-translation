  text: 摩西向以色列全体说完了这一切话，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְכַל
  choice: 说完
  rationale: 该词源自 כלה，wayyiqtol 形式表示动作完成；与 לְדַבֵּר 合译为“说完”，既自然又准确表达讲话结束。
- source_word: לְדַבֵּר
  choice: 说
  rationale: 不定式与 וַיְכַל 构成“说完”的惯用结构；现代汉语以结果补语表达最为自然。
- source_word: אֶת כָּל הַדְּבָרִים הָאֵלֶּה
  choice: 这一切话
  rationale: דְּבָרִים 在此指前述言辞；译作“话”保留其言语性质，也符合现代汉语表达。
- source_word: אֶל כָּל יִשְׂרָאֵל
  choice: 向全以色列
  rationale: 保留“以色列”作为整体群体的称谓，不解释性扩展为“所有以色列人”；介词 אֶל 依语境译作“向”。
- source_word: מֹשֶׁה
  choice: 摩西
  rationale: 采用现代中文圣经传统中通行的人名译法。
