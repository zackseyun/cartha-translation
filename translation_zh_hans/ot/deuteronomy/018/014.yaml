  text: כִּ֣י הַ/גּוֹיִ֣ם הָ/אֵ֗לֶּה אֲשֶׁ֤ר אַתָּה֙ יוֹרֵ֣שׁ אוֹתָ֔/ם אֶל מְעֹנְנִ֥ים וְ/אֶל קֹסְמִ֖ים יִשְׁמָ֑עוּ וְ/אַתָּ֕ה לֹ֣א כֵ֔ן נָ֛תַן לְ/ךָ֖ יְהוָ֥ה אֱלֹהֶֽי/ךָ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/014.yaml
  text: For these nations[a], which you are dispossessing, listen to soothsayers and diviners; but as for you[c][b], Yahweh your God has not allowed you to do this.
translation:
  language: zh_hans
  text: 因为，这些你将要赶走的民族[a]听从观兆者[b]和占卜者；但至于你，雅威——你的上帝——没有准许你这样做[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “赶走”也可按语境译作“使他们失去产业”。这个希伯来语动词在申命记中也可指“取得产业”；此处以这些民族为宾语，包含使原有居民失去其地的意思。
    reason: lexical_alternative
  - marker: b
    text: “观兆者”指观察征兆并据此判断吉凶的人。
    reason: cultural_note
  - marker: c
    text: 希伯来文直译近于：“但你不是这样；雅威你的上帝没有给你。”所“给”的对象没有明说；正文依上下文补作“准许你这样做”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文的禁令并作出解释，表达原因或说明关系。
- source_word: הַגּוֹיִם הָאֵלֶּה
  choice: 这些民族
  rationale: 指以色列将要面对的当地非以色列群体；“民族”在现代汉语中自然且符合语境。
- source_word: אֲשֶׁר אַתָּה יוֹרֵשׁ אֹתָם
  choice: 你将要赶走的
  rationale: ירשׁ在申命记中可指以取得产业为目的而取代原有居民；正文采用自然简洁的“赶走”，脚注保留“占有其地”的语义范围。
- source_word: מְעֹנְנִים
  choice: 观兆者
  rationale: 该词指观察征兆、借此判断吉凶的人；“观兆者”比泛称“算命者”更贴近其可能的语义范围。
- source_word: קֹסְמִים
  choice: 占卜者
  rationale: 直接表达从事占卜、求问隐秘之事的人，并与“观兆者”保持必要区分。
- source_word: יִשְׁמָעוּ
  choice: 听从
  rationale: 既保留“听”的词义，也表达这里接受其指引、依从其话语的语境含义。
- source_word: וְאַתָּה לֹא כֵן
  choice: 至于你……却没有
  rationale: 以汉语对比结构呈现原文简略而强调的“但你，不是这样”。
- source_word: נָתַן לְךָ
  choice: 准许你这样做
  rationale: 原文直译为“给你”，宾语未明说；结合上下文，汉语用“准许你这样做”使意思清楚，同时以脚注说明原文的省略。
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: 雅威你的上帝
  rationale: 以“雅威”音译四字神名，并按原文保留“你的上帝”这一关系性称谓。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；“雅威”较直接地呈现此专名，而不以称号代替。
- issue: נָתַן לְךָ中未明说的宾语
  choice: 没有准许你这样做
  alternative: 没有把这给你；没有为你安排这样的事
  rationale: 希伯来文没有明说所“给”的对象。正文按上下文表达为未获准采用这些做法，但脚注明示其字面结构和省略，避免把解释伪装成原文明说的内容。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“观兆者”和“占卜者”保留两个希伯来术语之间的区别；分号突出列国与以色列之间的对比。
