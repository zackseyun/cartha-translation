  text: or one who binds a spell[a], or one who consults a medium or a spiritist[d][c][b], or one who seeks the dead.
translation:
  language: zh_hans
  text: 或施行咒术的人[a]，或向灵媒求问的人[b]，或通灵者[c]，或求问死者的人[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “施行咒术”所译的希伯来语字面上与“结／系”及“咒术”相关；也可译作“念咒的人”或“结咒者”。
    reason: lexical_alternative
  - marker: b
    text: “向灵媒求问”也可译作“求问亡灵”；原词既可指亡灵，也可指与亡灵相通的媒介者。
    reason: lexical_ambiguity
  - marker: c
    text: “通灵者”也可译作“术士”或“巫师”，但这些称呼在现代语境中容易带入其他联想。
    reason: lexical_alternative
  - marker: d
    text: “求问死者”也可译作“寻求死者”或“向死者问事”。
    reason: lexical_alternative
lexical_decisions:
- source_word: חֹבֵר חָבֶר
  choice: 施咒的
  rationale: 该同源词组直译近似“结系咒法的人”，在禁戒邪术的语境中指念咒、施行咒术的人；“施咒”既自然，也保留其行为性质。
- source_word: שֹׁאֵל אוֹב
  choice: 求问灵媒的
  rationale: אוֹב可指亡灵，也可转指与亡灵相通的灵媒；正文采用现代读者较易理解的“灵媒”，脚注保留“求问亡灵”的可能。
- source_word: יִדְּעֹנִי
  choice: 通灵者
  rationale: 此词指以隐秘灵界知识为业的术士，常与אוֹב并列；“通灵者”避免“巫师”可能带来的民俗或奇幻联想。
- source_word: דֹרֵשׁ אֶל הַמֵּתִים
  choice: 求问死人的
  rationale: דֹרֵשׁ אֶל在此表示寻求、求问；直译为“求问死人”既简洁，也明确呈现交鬼问事的对象。
- source_word: וְ
  choice: 或
  rationale: 本句承接前文法律禁令中的项目清单，汉语用“或”能清楚表示任何一项都在禁止之列。
theological_decisions:
- issue: 如何表达古代招魂与巫术术语而不引入后世民俗或奇幻观念
  choice: 采用“施咒”“灵媒”“通灵者”“求问死人”等现代、克制的术语
  alternative: 采用“念符咒者”“交鬼者”“巫师”等传统说法
  rationale: 这些词忠实呈现本节所列的禁戒行为，同时不过度界定相关灵体现象，也不把后世宗教体系或幻想文学形象带入经文。
- issue: אוֹב所指是亡灵还是灵媒
  choice: 正文译作“灵媒”，脚注说明也可理解为“亡灵”
  alternative: 正文译作“亡灵”或“鬼魂”
  rationale: 该词在希伯来语中可指被求问的亡灵，也可转指从事此类求问的媒介者；保留这一真实的词义歧义。
translation_notes:
  register: 采用现代标准普通话的法律清单句式，以“或”承接前文各项禁令。整体庄重简明；避免使用过度古雅的“交鬼”“行邪术者”等表达，同时借脚注保存希伯来语术语的歧义。
