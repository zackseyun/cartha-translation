base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/019.yaml
  text: And the man who does not listen to my words that he speaks in my name—I myself will require it from him[a].
translation:
  language: zh_hans
  text: 凡不听从那位先知奉我名所说的话的，我必亲自向他追讨[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我必亲自追究他的责任。”希伯来文直译为“我必向他追讨”，表示神要那拒绝听从先知之话的人承担责任。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: 凡
  rationale: 这里承接上文并引出将来的后果。汉语用“凡……我必……”自然呈现条件与结果的关系，无须生硬译出“事情将是”。
- source_word: הָאִישׁ
  choice: 那人
  rationale: 原文是单数阳性名词，具有代表性；“那人”既保留单数形式，也符合现代汉语表达。
- source_word: לֹא יִשְׁמַע אֶל
  choice: 不听从
  rationale: שׁמע אֶל 不仅指听见，也含留意、接受并遵从之意；“听从”保留听与回应两层含义，又不将其过度限定为单纯的“服从”。
- source_word: דְּבָרַי
  choice: 我的话
  rationale: 原文为复数“我的言语”；现代汉语通常以集合性的“我的话”自然表达，意义不减。
- source_word: אֲשֶׁר יְדַבֵּר
  choice: 就是他……所说的话
  rationale: 关系从句说明“我的话”是那位先知所宣讲的内容；加入“就是”可避免“他”与上文“不听从的人”发生指代混淆。
- source_word: בִּשְׁמִי
  choice: 奉我的名
  rationale: 这是汉语中自然且庄重的对应表达，既保留“名”的原文意象，也传达受神授权、代表神发言之意。
- source_word: אָנֹכִי
  choice: 我必亲自
  rationale: 独立人称代词 אָנֹכִי 带有强调；“亲自”明确呈现神亲自追究的强调语气，“必”同时符合未完成体在此处的将来与确定意味。
- source_word: אֶדְרֹשׁ מֵעִמּוֹ
  choice: 向那人追讨
  rationale: דרשׁ 与 מֵעִם 连用，在此表示追究责任、要求交账。“追讨”保留原文较具体而严肃的索取意象，同时不规定惩罚的具体方式。
theological_decisions:
- issue: 神对拒听先知之话者所作回应的性质
  choice: 我必亲自向那人追讨
  alternative: 我必亲自追究那人的责任
  rationale: 原文明确表达神要人承担责任，却未说明惩罚的具体形式。“追讨”保留司法性和神圣问责的张力，脚注再说明其语义，避免添加经文未明说的刑罚细节。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“凡……我必……”适合法律—盟约语境；用“就是”澄清关系从句中先知的指代，同时保留原文的严肃警告与神学张力。
