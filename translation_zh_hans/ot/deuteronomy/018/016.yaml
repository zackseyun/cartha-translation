base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/016.yaml
  text: just as you asked from the LORD your God at Horeb on the day of the assembly, saying, ‘Let me not continue to hear the voice of the LORD my God, and let me not see this great fire anymore, lest I die.’
translation:
  language: zh_hans
  text: 正如你在何烈山、会众聚集的那一天向耶和华你的上帝所求的，说：“不要让我再听见耶和华我上帝的声音，也不要让我再看见这大火，免得我死。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְּכֹל אֲשֶׁר שָׁאַלְתָּ מֵעִם
  choice: 正如……向……所求的
  rationale: 保留比较结构，并将介词 מֵעִם 按此处向上帝提出请求的语境译为“向”。
- source_word: בְּיוֹם הַקָּהָל
  choice: 会众聚集的那一天
  rationale: הַקָּהָל 可指集会或聚集起来的会众；此译自然表达该日众民聚集的事件，同时不附加宗派性术语。
- source_word: לֹא אֹסֵף לִשְׁמֹעַ
  choice: 不要让我再听见
  rationale: אֹסֵף 加不定式表示不再继续某事；结合祈求语气，以现代汉语译出。
- source_word: הָאֵשׁ הַגְּדֹלָה הַזֹּאת
  choice: 这熊熊烈火
  rationale: “熊熊烈火”自然传达“大火、强烈的火”之意，并保留指示词“这”。
- source_word: וְלֹא אָמוּת
  choice: 免得我死
  rationale: 原文形式为“我就不至死亡／我便不会死”，在前面否定祈愿的语境中表达避免死亡的目的或结果；“免得我死”符合上下文和自然汉语。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威／上主
  rationale: 采用现代中文圣经读者最熟悉的专名形式，并与“上帝”清楚区分；不借译名引入额外的神学解释。
- issue: וְלֹא אָמוּת 的逻辑关系
  choice: 免得我死
  alternative: 我就不至死亡
  rationale: 上下文表明百姓因惧怕直接听见神的声音、看见大火而求避免死亡；目的式表达在汉语中最通顺，但不扩展死亡原因。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。“何烈山”沿用通行地名；引语以请求句呈现，使希伯来语在叙事语境中的语气清楚。
