source:
  edition: WLC
  text: לֹֽא יִ֠הְיֶה לַ/כֹּהֲנִ֨ים הַ/לְוִיִּ֜ם כָּל שֵׁ֧בֶט לֵוִ֛י חֵ֥לֶק וְ/נַחֲלָ֖ה עִם יִשְׂרָאֵ֑ל אִשֵּׁ֧י יְהוָ֛ה וְ/נַחֲלָת֖/וֹ יֹאכֵלֽוּ/ן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/001.yaml
  text: The Levitical priests—all the tribe of Levi—shall have no portion or inheritance with Israel[a]; they shall eat the food offerings of Yahweh, that is[b], his inheritance.
translation:
  language: zh_hans
  text: 利未祭司——就是利未全支派——不可与以色列人一同拥有份额和产业；他们要吃献给雅威的火祭[a]和他的产业[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “火祭”也可译作“献给雅威的食物祭”。这个词通常指在坛火上献给雅威的祭物，其中有些部分归祭司食用。
    reason: lexical_alternative
  - marker: b
    text: “他的产业”可能以单数集合概念指利未人的产业；也可能指雅威的产业。参18:2，那里说雅威是利未人的产业。
    reason: ambiguity_and_cross_reference
lexical_decisions:
- source_word: לַכֹּהֲנִים הַלְוִיִּם
  choice: 利未祭司
  rationale: 将两个名词的同位关系简洁表达为“利未祭司”，指属于利未支派的祭司，并不把二者拆成两个彼此无关的群体。
- source_word: כָּל שֵׁבֶט לֵוִי
  choice: 就是利未全支派
  rationale: “全”保留כָּל所强调的完整范围；破折号和“就是”体现其对前语的补充说明作用。
- source_word: חֵלֶק וְנַחֲלָה
  choice: 份额和产业
  rationale: 保留两个相近而不完全相同的法律用语：חֵלֶק指所分得的份额，נַחֲלָה指承受并持有的产业。中文用“和”照应原文连接词，不将两者合并。
- source_word: עִם יִשְׂרָאֵל
  choice: 在以色列中
  rationale: 这里所说的是利未人与以色列其余支派一同分得土地产业的问题；“在以色列中”在现代中文里自然，也保留群体范围。
- source_word: אִשֵּׁי יְהוָה
  choice: 献给雅威的火祭
  rationale: אִשִּׁים是与祭坛之火相关的祭物用语；译作“火祭”保留祭祀方式，并以脚注说明也可按功能理解为“食物祭”。יְהוָה按其专名译作“雅威”。
- source_word: וְנַחֲלָתוֹ
  choice: 和他的产业
  rationale: 原文是带第三人称阳性单数后缀的“产业”，所指并非毫无争议；直译“他的”可保留它可能指集体意义的利未，也可能指雅威的张力，不在正文中加入原文没有的“也就是”。
- source_word: יֹאכֵלוּן
  choice: 他们要吃
  rationale: 未完成式在律法语境中表达持续或规定性的安排；“要吃”既自然，又保留其制度性语气。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；“雅威”以现代汉语音译呈现其专名性质，不以称号代替。
- issue: “他的产业”所指为何
  choice: 正文保留“他的”
  alternative: 明确译成“利未所得的产业”或“雅威的产业”
  rationale: 第三人称阳性单数后缀在语法上可回指近处的雅威，也可能以单数集合概念指利未；申命记18:2又说雅威是利未人的产业。正文不强行消除此歧义，脚注交代两种理解。
- issue: 两项食物之间的关系
  choice: 用“和”并列
  alternative: 译作“也就是”，把后项视为前项的同位解释
  rationale: 希伯来文明确使用连接词וְ，虽可在语境中产生解释性关系，但并非必须如此。采用并列形式更直接地保存原文结构及其可能的解释张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。以破折号标出希伯来文的同位补充，保留“份额和产业”的法律性双词，并在“他的产业”处保留原文代词指向及并列关系的歧义。
