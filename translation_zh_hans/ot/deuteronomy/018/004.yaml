base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/004.yaml
  text: You shall give him the firstfruits of your grain[a], your new wine, and your oil[c][b], and the first of the fleece of your flock.
translation:
  language: zh_hans
  text: 你要把你的谷物、新酿的酒和油中最先的一份[a]，以及你羊群初剪的羊毛[b]，给他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “最先的一份”也可译作“初熟的出产”；这句话同时指谷物、新酿的酒和油。
    reason: lexical_alternative
  - marker: b
    text: “羊群初剪的羊毛”也可译作“你羊群剪毛所得最先的一份”。
    reason: lexical_alternative
lexical_decisions:
- source_word: רֵאשִׁית
  choice: 初收的／初剪的
  rationale: 该词表示最先或起初的一份；与农产搭配译作“初收的”，与羊毛搭配按汉语自然表达译作“初剪的”，既保留优先次序，也不把经文过度限定为特定礼仪术语。
- source_word: דָּגָן
  choice: 五谷
  rationale: 泛指谷类出产；“五谷”是现代汉语中自然且庄重的集合说法，并非严格限定为五种作物。
- source_word: תִּירוֹשׁ
  choice: 新酿的酒
  rationale: 通常指新近酿成的酒或葡萄汁酒；“新酿的酒”保留与一般“酒”的词义区别，又比“新酒”更清楚。
- source_word: יִצְהָר
  choice: 油
  rationale: 指新出的油，在以色列语境中通常是橄榄油；正文译“油”避免加入原文未明说的限定。
- source_word: גֵּז
  choice: 初剪的羊毛
  rationale: 可指剪下的毛，也可涉及剪毛所得；此处作为交付之物，译为“初剪的羊毛”具体自然，同时脚注保留“首次剪毛所得”的可能表达。
- source_word: צֹאן
  choice: 羊
  rationale: 该集合名词可包括绵羊和山羊；此处与剪毛相连，汉语用“羊”最自然，也不必过度指定种类。
- source_word: תִּתֶּן לוֹ
  choice: 你要……给他
  rationale: 未完成式在律法语境中表达规定或义务；“你要”具有明确规范性，也符合现代汉语法律训令的语体。
theological_decisions:
- issue: לוֹ（“他”）的指代
  choice: 正文保留单数“他”
  alternative: 明译为“祭司”或理解为祭司群体
  rationale: 希伯来文使用阳性单数代词，直接承接上文的祭司受领者。保留“他”既忠于语法，也避免在本节加入原文未重复出现的称谓。
translation_notes:
  register: 采用现代、庄重而易懂的律法语体。“你要……给他”传达规范性而不过分古雅。正文将三个农产品共同置于“初收的”之下，并将羊毛表达为“初剪的”，使希伯来文重复的 רֵאשִׁית 在汉语中自然呈现。所有脚注标记均已置于正文相应位置。
