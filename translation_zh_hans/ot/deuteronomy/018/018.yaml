base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/018.yaml
  text: I will raise up for them a prophet like you from among their brothers[a], and I will put my words in his mouth, and he will speak to them all that I command him.
translation:
  language: zh_hans
  text: 我要从他们弟兄[a]中间为他们兴起一位像你一样的先知。我要把我的话放在他口中；他要把我所吩咐他的一切对他们说。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弟兄”也可译作“同族”或“以色列同胞”；希伯来文直译为“他们的弟兄”。
    reason: lexical_alternative
lexical_decisions:
- source_word: נָבִיא
  choice: 一位……先知
  rationale: 这是指奉上帝之命传话的人。希伯来语名词在此没有冠词，中文用“一位”自然地表达预告语境中的单数人物，同时不预先断定其具体身份。
- source_word: אָקִים
  choice: 兴起
  rationale: 使役式在这里表示使一位先知出现并承担职分；“兴起”既保留原文意象，也包含上帝设立他的含义。
- source_word: לָהֶם
  choice: 为他们
  rationale: 介词在应许语境中表示上帝为百姓作出供应，“为他们”比单纯的“给他们”更贴切。
- source_word: מִקֶּרֶב אֲחֵיהֶם
  choice: 从他们弟兄中间
  rationale: “从……中间”对应 מִקֶּרֶב，“弟兄”保留 אֲחֵיהֶם 的阳性亲属称谓及其群体内部成员的语义；脚注说明其在本语境中的范围。
- source_word: כָּמוֹךָ
  choice: 像你一样
  rationale: 直接保留这位先知与摩西之间的比较，不进一步界定相似之处。
- source_word: וְנָתַתִּי דְבָרַי בְּפִיו
  choice: 我要把我的话放在他口中
  rationale: 保留先知受命时“把话放在口中”的鲜明隐喻，并以现代汉语自然表达。
- source_word: וְדִבֶּר אֲלֵיהֶם
  choice: 他都要告诉他们
  rationale: דבר אל 表示向某人说话；结合后面的完整宾语，“告诉他们”在中文中更流畅，也清楚表达先知转达上帝命令的功能。
- source_word: אֵת כָּל אֲשֶׁר אֲצַוֶּנּוּ
  choice: 我吩咐他的一切
  rationale: 保留“所有、无一遗漏”的全面性；未完成式置于未来应许框架中，中文用“我吩咐他”即可自然涵盖将来的命令。
theological_decisions:
- issue: 所应许的先知是否特指弥赛亚
  choice: 正文只译作“一位像你一样的先知”，不明说其具体身份。
  alternative: 将其解释为历代先知的群体，或特指末后的先知并由弥赛亚应验。
  rationale: 本节使用单数“先知”，并把他与摩西相比，却没有在本节直接指明身份。译文因此保留经文本身的开放性和神学张力。
- issue: אֲחֵיהֶם 所指的群体
  choice: 正文保留“他们弟兄”，脚注说明可指同族或以色列同胞。
  alternative: 正文直接译为“同族”或“以色列同胞”。
  rationale: 保留原文的阳性亲属用语，避免在正文中把语义范围解释得过窄；同时以脚注帮助现代读者理解其群体亲属义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“兴起”“把我的话放在他口中”保留原文的传统意象；后半句调整为自然汉语语序。脚注标记紧接相关的“先知”短语之后，但内容解释其中的“弟兄”。
