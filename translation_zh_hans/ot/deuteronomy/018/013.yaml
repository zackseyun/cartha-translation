  yaml_path: translation/ot/deuteronomy/018/013.yaml
  text: You shall be blameless with Yahweh your God[a].
translation:
  language: zh_hans
  text: 你要对耶和华你的神保持纯全。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “纯全”也可译作“完整”“无可指摘”或“全心”；此处指对耶和华保持完整、正直的忠诚，并不必然指绝对无罪。
    reason: 说明 תָּמִים 的主要词义范围，并避免将其狭义化为道德上的无罪完美。
lexical_decisions:
- source_word: תָּמִים
  choice: 完全人
  rationale: 该词表示完整、健全、无可指摘，也可指品格纯正、专一忠诚。结合上下文对占卜等异教习俗的禁止，这里译作“作完全人”，既保留希伯来语宽广的语义和经文的伦理张力，又不直接解释为绝对无罪。
- source_word: תִּהְיֶה
  choice: 你要作
  rationale: 这是动词 היה 的第二人称阳性单数未完成式，在此具有训令作用。“你要作”自然地表达约的要求，同时贴近原文句式。
- source_word: עִם
  choice: 在……面前
  rationale: עִם 的基本义是“与、同”，这里描述人在耶和华那里的关系与处境。汉语若直译“与耶和华……完全”不够自然，因此正文采用“在……面前”，并在脚注保留“与……相交时”的关系性可能。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的专名“耶和华”来对应四字神名，而不以普通称号替代。
- source_word: אֱלֹהֶיךָ
  choice: 你的神
  rationale: 此处带第二人称阳性单数后缀，并与耶和华同位，明确指以色列的神，故译为单数“你的神”。
theological_decisions:
- issue: 约的劝诫中 תָּמִים 的含义
  choice: 保留“完全”所涵盖的完整、纯正和专一忠诚，而不把它明定为绝对无罪
  alternative: 译作“无可指摘”或“专心忠于”
  rationale: 申命记18:9–14将此要求与列国的占卜、邪术等行为相对照，重点包括对神专一而完整的忠诚；但原词本身也含伦理上的纯正。正文“完全人”保留这些层面，脚注说明其他自然理解，避免过早消解其神学张力。
- issue: עִם 所表达的关系
  choice: 正文采用自然汉语“在……面前”，同时以脚注保留“与……相交”的关系性语义
  alternative: 直译“与耶和华你的神在一起要完全”
  rationale: 原介词通常意为“与”，但直译在本句中文中生硬。“在……面前”传达对神负责的处境，脚注则防止关系性含义完全丢失。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。“作完全人”保留传统经文语感及原文的语义张力；“耶和华”用作神名。脚注标记已在正文中以 [a] 标出。
