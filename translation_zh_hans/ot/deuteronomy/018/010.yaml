base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/010.yaml
  text: There must not be found among you anyone who makes his son or his daughter pass through the fire[a], one who practices divination, tells fortunes, interprets omens[d][c][b], or practices sorcery.
translation:
  language: zh_hans
  text: 你们中间不可有人使自己的儿子或女儿经火而过[a]，也不可有人占卜、算命[b]、观兆[c]或行巫术。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“使自己的儿子或女儿从火中经过”；也可理解为“把自己的儿子或女儿在火中焚烧”或“把自己的儿子或女儿献在火中”。
    reason: alternative_reading
  - marker: b
    text: 这个希伯来词含义较难确定；也可译作“观兆”或“择时占候”。
    reason: lexical_alternative
  - marker: c
    text: 或译“占兆”或“凭征兆占卜”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יִמָּצֵא בְךָ
  choice: 你们中间不可有人
  rationale: 否定词加尼法勒未完成式在此表达群体律法中的禁令；“你们中间”自然传达 בְךָ 的共同体含义。
- source_word: מַעֲבִיר בְּנוֹ וּבִתּוֹ בָּאֵשׁ
  choice: 使自己的儿子或女儿经火
  rationale: 保留使役式 עבר“使……经过”的希伯来表达，不在正文中断定该仪式的具体方式；“经火”简洁而庄重。
- source_word: קֹסֵם קְסָמִים
  choice: 占卜
  rationale: 分词与同源宾语表示从事占卜活动；汉语用“占卜”即可自然表达，不必机械重复。
- source_word: מְעוֹנֵן
  choice: 观兆
  rationale: 该词词义有争议，可能涉及观测征兆或时机以作术数判断；“观兆”保留其与一般占卜及下一项活动之间既相关又有区别的性质。
- source_word: מְנַחֵשׁ
  choice: 行法术
  rationale: נחש 通常指依据迹象求兆、行占兆之术；因相邻 מְעוֹנֵן 的边界不确定，正文采用较宽的“行法术”，并以脚注交代“占兆”的可能译法。
- source_word: מְכַשֵּׁף
  choice: 施巫术
  rationale: 皮勒分词指从事魔法或巫术；“施巫术”符合现代汉语，也与整列行为性表述协调。
theological_decisions:
- issue: 使儿女经火这一禁令所指仪式的性质
  choice: 正文保留“使自己的儿子或女儿经火”
  alternative: “把自己的儿子或女儿在火中焚烧”或“把自己的儿子或女儿献在火中”
  rationale: 本节明确谴责涉及儿女与火的异教仪式，但希伯来语本身直说“使……经过火”，没有在这一句中完全说明仪式细节。保留原有说法可避免把献祭或焚烧的解释直接写入正文。
- issue: 三个术数用语之间的界线
  choice: 译作“观兆、行法术或施巫术”，并用脚注说明前两项的不确定性
  alternative: “算命、占兆或行邪术”
  rationale: מְעוֹנֵן 与 מְנַחֵשׁ 的准确范围及彼此边界并不完全确定；译文应保持其术数类别的区别，同时不假装词义已经毫无疑问。
translation_notes:
  register: 采用现代、庄重而易懂的律法文体。以“不可有人……也不可有人……”清楚呈现禁令和后续并列分词；保留“经火”的原文意象，并通过脚注交代仪式及术数词汇的真实歧义。
