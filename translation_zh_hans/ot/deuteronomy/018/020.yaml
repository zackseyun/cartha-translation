  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אַ֣ךְ הַ/נָּבִ֡יא אֲשֶׁ֣ר יָזִיד֩ לְ/דַבֵּ֨ר דָּבָ֜ר בִּ/שְׁמִ֗/י אֵ֣ת אֲשֶׁ֤ר לֹֽא צִוִּיתִי/ו֙ לְ/דַבֵּ֔ר וַ/אֲשֶׁ֣ר יְדַבֵּ֔ר בְּ/שֵׁ֖ם אֱלֹהִ֣ים אֲחֵרִ֑ים וּ/מֵ֖ת הַ/נָּבִ֥יא הַ/הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/020.yaml
  text: But the prophet who presumptuously speaks a word in my name that I have not commanded him to speak[b][a], or who speaks in the name of other gods—that prophet shall die.
translation:
  language: zh_hans
  text: 但那先知若胆敢奉我的名说我没有吩咐他说的话[a]，或奉别神的名说话，那先知必须死[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“擅自”或“狂妄地”。希伯来语动词表示故意而狂妄地越权行事。
    reason: lexical_alternative
  - marker: b
    text: 或译“必死”或“要被处死”。希伯来语用简短的形式宣告法律上的死刑判决。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: 但
  rationale: 承接上文对真先知的说明，引出强烈对比；“但”在现代汉语中简洁自然。
- source_word: הַנָּבִיא
  choice: 那先知
  rationale: 保留先知这一标准称谓；汉语以“那”配合条件句，并与句末的指示表达相呼应。
- source_word: יָזִיד
  choice: 胆敢
  rationale: 该动词表达明知越权仍狂妄行事的意味；“胆敢”兼有故意冒犯和僭越权柄的语气。
- source_word: לְדַבֵּר דָּבָר
  choice: 说……的话
  rationale: 以自然汉语呈现希伯来语“说一个话语”的同源结构，同时保留具体言说内容。
- source_word: בִּשְׁמִי
  choice: 奉我的名
  rationale: “奉……的名”是自然且庄重的汉语表达，清楚表示声称具有说话者所授的权柄。
- source_word: אֵת אֲשֶׁר לֹא צִוִּיתִיו לְדַבֵּר
  choice: 我没有吩咐他说的话
  rationale: 保留第一人称、否定、吩咐以及先知受命说话等各项语义，句式符合现代汉语。
- source_word: וַאֲשֶׁר יְדַבֵּר
  choice: 或……说话
  rationale: 此处连接另一种可判罪的行为；译作“或”清楚表明两种行为中的任何一种都适用后面的判决。
- source_word: בְּשֵׁם אֱלֹהִים אֲחֵרִים
  choice: 奉别神的名
  rationale: 贴近原文，表示以其他神明的权柄或授权为名发言；“别神”简洁且符合本书语境。
- source_word: וּמֵת
  choice: 必须死
  rationale: 以简短有力的措辞表达法律性的死刑判决，又不在正文中过度指明执行方式。
- source_word: הַנָּבִיא הַהוּא
  choice: 那先知
  rationale: 保留名词和指示词所构成的强调，明确判决所针对的正是上述先知。
theological_decisions:
- issue: 上帝第一人称话语中的圣名指涉
  choice: 保留“我的名”
  alternative: 扩译为“奉耶和华的名”
  rationale: 原文是上帝直接以第一人称说话；保留“我的”既忠于句法，也避免把本节没有明说的称呼加入正文。
- issue: 死亡判决的表达
  choice: 译作“必须死”
  alternative: “必死”或“要被处死”
  rationale: 原文以简短形式宣告法律后果。“必须死”保留判决的义务和司法力度，同时不像“要被处死”那样明确加入被动执行的语法含义。
- issue: 假先知罪行的主观性质
  choice: 以“胆敢”表达故意而狂妄的越权
  alternative: “擅自”或“狂妄地”
  rationale: 原词不只是未经许可，也带有有意僭越、狂妄冒犯的意味；正文用“胆敢”，脚注保留其他可能表达，避免把语义缩减为单纯程序性违规。
translation_notes:
  register: 采用现代、庄重而易懂的法律宣告语体。“奉……的名”保留经文中关于授权与代表权的核心表达；“必须死”简洁有力，并保留原文未明说执行机制的特点。
