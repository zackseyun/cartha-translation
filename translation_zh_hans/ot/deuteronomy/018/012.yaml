base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/012.yaml
  text: For everyone who does these things is an abomination to Yahweh[a], and because of these abominations Yahweh your God is driving them out before you.
translation:
  language: zh_hans
  text: 因为凡行这些事的人，都是雅威所憎恶的；雅威你的神正因这些可憎的事，把他们从你面前赶出去[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“使他们失去土地。”希伯来语动词既可强调把列国赶走，也可强调使他们失去对土地的占有。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文的禁令并说明理由；“因为”自然保留其因果和解释作用。
- source_word: תוֹעֲבַת יְהוָה
  choice: 雅威所憎恶的
  rationale: 该结构表示在雅威眼中极其可憎；此译法保留强烈的道德评价，同时符合现代汉语表达。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以“雅威”音译上帝的立约之名，区别于称号“主”。
- source_word: כָּל עֹשֵׂה אֵלֶּה
  choice: 凡行这些事的
  rationale: “凡”结合分词结构，准确表达凡是持续从事这些行为的人，无一例外。
- source_word: וּבִגְלַל
  choice: 正因
  rationale: 明确表达后述审判的原因；“正”加强原文在语境中的因果联系。
- source_word: הַתּוֹעֵבֹת הָאֵלֶּה
  choice: 这些可憎之事
  rationale: 指回前文所列的禁行之术，并与本节前半句“所憎恶的”保持词义联系。
- source_word: אֱלֹהֶיךָ
  choice: 你的神
  rationale: 保留第二人称单数，直接对以色列整体说话。
- source_word: מוֹרִישׁ אֹתָם
  choice: 正把他们……赶出去
  rationale: 使役形在此可指赶走列国，也可侧重使其失去土地；正文采用自然且符合征服语境的“赶出去”，另以脚注保留“使他们失去产业”的含义。
- source_word: מִפָּנֶיךָ
  choice: 从你面前
  rationale: 较贴近原文“从你面前／在你面前离开”的空间意象，同时在汉语中自然表达列国被逐离以色列。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；采用“雅威”作为现代汉语音译，以保留其专名性质。
- issue: תוֹעֵבָה 所表达的评价对象
  choice: 行这些事的人是雅威所憎恶的
  alternative: 这些行为是雅威所憎恶的
  rationale: 原文语法以“凡行这些事的”为主语，故不把评价悄然改限于行为；同时下半句明确称相关行为为“可憎之事”，保留经文本身对人和行为的双重表述。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“凡……的”保留原文概括一切行此类事之人的范围；用分号呈现本节前后两项彼此关联的陈述。脚注标记置于其所说明的动词短语之后。
