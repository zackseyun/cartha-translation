base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/007.yaml
  text: then he may minister in the name of Yahweh his God[c][b][a], like all his brothers the Levites who stand there before Yahweh.
translation:
  language: zh_hans
  text: 那么，他就可以奉雅威[b]——他的上帝——的名供职[a]，像他所有的弟兄[c]，也就是那些在那里站立在雅威面前的利未人一样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他就要……供职。”这里的希伯来语动词形式在本段律法语境中可表达许可，也可理解为较直接的规定。
    reason: lexical_alternative
  - marker: b
    text: “雅威”是希伯来文神名YHWH的音译；传统常译作“耶和华”或以“上主”代称。
    reason: alternative_reading
  - marker: c
    text: 原文直译为“他的弟兄”，这里指与他同属利未支派的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשֵׁרֵת
  choice: 那么，他就可以……供职
  rationale: שׁרת的Piel词干在祭司和利未人的语境中指履行宗教职事；“供职”比宽泛的“服事”更明确。连接词承接上一节所述条件，故译作“那么”；在本段律法许可的语境中用“可以”，同时以脚注保留“就要”的可能性。
- source_word: בְּשֵׁם
  choice: 奉……的名
  rationale: 这是表示凭某人的名、权柄或名义行事的惯用语；“奉……的名”是自然且庄重的现代汉语表达。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以音译呈现四字神名，保留其作为以色列之上帝专名的性质，而不以称号取代；传统译法在脚注中说明。
- source_word: אֱלֹהָיו
  choice: 他的上帝
  rationale: 直接保留第三人称单数所属关系；破折号显示它是对“雅威”的同位说明。
- source_word: כְּכָל אֶחָיו הַלְוִיִּם
  choice: 像他所有的弟兄，也就是……利未人一样
  rationale: 保留比较结构、כּל的整体含义以及字面亲属称谓“弟兄”；同时按原文同位结构明确这些弟兄是利未人。
- source_word: הָעֹמְדִים שָׁם לִפְנֵי יְהוָה
  choice: 那些在那里侍立在雅威面前的
  rationale: 保留עמד“站立”的基本意象；“侍立”在现代汉语中自然表达在君王或上帝面前站立并候命供职的含义，且不把该词完全释义为“事奉”。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文使用上帝的专名而非普通称号。音译“雅威”较直接地呈现该名；脚注说明传统译法，避免读者误以为原文是称号。
- issue: וְשֵׁרֵת在律法语境中的语气
  choice: 就可以……供职
  alternative: 就要……供职
  rationale: 上下文说明利未人若来到指定地点便有权参与职事，因此许可语气较切合；但希伯来语的连续法律表述也可用较直接的规定或将来语气理解，故不将另一可能性隐去。
- issue: אֶחָיו的性别与群体指向
  choice: 他的弟兄
  alternative: 他的利未同胞；其他利未人
  rationale: 原文明确使用阳性复数亲属词，并随即以“利未人”作同位说明。正文保留“弟兄”，脚注交代其语境所指。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“供职”凸显利未人的圣所职事，“侍立”则保留原文“站立在……面前”的形象。以破折号标示“他的上帝”对“雅威”的同位说明，避免把“雅威他的上帝”读成生硬的名词串。
