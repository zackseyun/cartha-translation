  text: וְ/נַחֲלָ֥ה לֹא יִֽהְיֶה לּ֖/וֹ בְּ/קֶ֣רֶב אֶחָ֑י/ו יְהוָה֙ ה֣וּא נַחֲלָת֔/וֹ כַּ/אֲשֶׁ֖ר דִּבֶּר לֽ/וֹ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/002.yaml
  text: He shall have no inheritance among his brothers[a]; Yahweh is his inheritance[b], as he spoke to him.
translation:
  language: zh_hans
  text: 他在弟兄中不可有产业[a]；耶和华就是他的产业，正如耶和华对他说的[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“亲族”。希伯来文直译为“弟兄”，这里指同属以色列的人，具体而言是其他支派。
    reason: lexical_alternative
  - marker: b
    text: 或译“正如耶和华向他说过的”。原文动词是通常表示“说、讲话”的词；按含义译作“应许”也有可能，但解释性较强。
    reason: lexical_alternative
lexical_decisions:
- source_word: נַחֲלָה / נַחֲלָתוֹ
  choice: 产业
  rationale: 在申命记分配土地的语境中，נַחֲלָה指所分得并承受的产业。两处均译作“产业”，既保留第一处的土地、承业含义，也保留第二处“耶和华就是他的产业”的圣约性比喻，并体现原文重复。
- source_word: בְּקֶרֶב
  choice: 在……中
  rationale: בְּקֶרֶב אֶחָיו在此意为“在他的弟兄中”。“在……中”是自然庄重的现代汉语，也保留群体关系。
- source_word: אֶחָיו
  choice: 弟兄
  rationale: 原文是阳性复数“他的弟兄”，在上下文中指同属以色列的其他支派成员。正文保留直译，脚注说明其语境范围。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名“耶和华”呈现四字神名，保留其作为以色列之上帝专名的功能，而不改译为称号。
- source_word: הוּא
  choice: 就是
  rationale: 独立代词הוּא带有强调作用；“就是”自然地传达“耶和华自己是他的产业”这一强调，又不使中文显得生硬。
- source_word: כַּאֲשֶׁר דִּבֶּר לוֹ
  choice: 正如耶和华对他说的
  rationale: דִּבֶּר是普通的“说、讲话”，不明确编码“应许”。补明主语“耶和华”可避免汉语中“他对他说”的指代含混，同时不增加原文以外的解释。
theological_decisions:
- issue: 单数代词“他／他的”的所指
  choice: 保留单数形式，让其可作对利未人或利未祭司的集合性、代表性指称。
  alternative: 明确译作利未祖先利未，或改成复数以表示每一位祭司。
  rationale: 上下文谈利未祭司及利未支派，希伯来语常以单数作集合性或代表性指称。保留单数可避免将所指过度限定。
- issue: “耶和华就是他的产业”的性质
  choice: 保留原文简洁而富张力的圣约性比喻。
  alternative: 解释性扩写为“耶和华代替土地，作利未人的份”。
  rationale: 原文直接宣告耶和华是他的产业；不将其释义为土地份额，可保存其神学丰富性与张力。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“不可有产业”延续律法语境的规范语气；分号呈现两分句之间紧密的因果与对照关系。正文两次使用“产业”，保存关键词重复；第二个分句补明“耶和华”为主语，以消除现代汉语代词歧义。
