  rationale: 修订明确了“百姓”中负责给付的对象是献祭者，并将原文分配性的命令清楚地落在每位献祭者身上。保留“前腿、两腮、胃”的现代且不过度技术化的表达；脚注 c 删去无充分依据的“胃囊”，以保留原文对胃部具体部位的开放性。
