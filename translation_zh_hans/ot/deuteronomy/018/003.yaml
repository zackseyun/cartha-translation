base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/003.yaml
  text: 'And this shall be the priests’ due from the people[a], from those who sacrifice a sacrifice, whether an ox or a sheep: he shall give to the priest the shoulder, the two cheeks[d][c][b], and the stomach.'
translation:
  language: zh_hans
  text: 祭司从百姓、就是从献祭的人所应得的份额如下：无论所献的是牛还是羊，献祭的人都要把前腿[a]、两腮[b]和胃[c]给祭司。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “前腿”原文直译为“臂”，这里指牲畜的前肢或肩腿部分。
    reason: lexical_alternative
  - marker: b
    text: “两腮”也可译作“两颊”或“两边的颌骨”；原文采用双数形式。
    reason: lexical_alternative
  - marker: c
    text: “胃”也可译作“肚腹”；较传统的译法是“胃”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁפַּט
  choice: 所得的份额
  rationale: 这里指律法规定祭司有权从献祭者所得的部分，并非抽象的“审判”或一般性的“规例”。
- source_word: מֵאֵת הָעָם מֵאֵת זֹבְחֵי הַזֶּבַח
  choice: 从百姓……凡献祭的
  rationale: 第二个短语具体说明“百姓”中承担给付责任的人。中文用“凡献祭的”自然表达，同时保留来源关系；希伯来语同根词“献祭……祭物”的重复若逐字译出会显得生硬。
- source_word: אִם שׁוֹר אִם שֶׂה
  choice: 无论献牛还是羊
  rationale: 在献祭语境中，“牛”和“羊”清楚自然；以“无论……还是……”对应希伯来语的选择结构。
- source_word: וְנָתַן
  choice: 都要……给
  rationale: 希伯来语为单数，按个体分配地指每一位献祭者。中文“凡……的……都要”既保留这种普遍而逐一适用的法令语气，也避免使用有性别标记的代词。
- source_word: הַזְּרֹעַ
  choice: 前腿
  rationale: 该词本义为“臂”，用于牲畜时指前肢或肩腿部分。“前腿”在现代中文中具体清楚，也避免把它误解为仅指肩部。
- source_word: הַלְּחָיַיִם
  choice: 两腮
  rationale: 希伯来语为双数，明确表示两侧；“腮”贴近原词所指的颊部或颌部，同时在中文中简洁自然。
- source_word: הַקֵּבָה
  choice: 胃
  rationale: 该词指牲畜的胃部。“胃”是现代、清楚且不过度技术化的译法；不采用古雅而可能难懂的名称。
theological_decisions: []
translation_notes:
