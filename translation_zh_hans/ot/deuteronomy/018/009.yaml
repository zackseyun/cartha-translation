  naturalness: “当你进入……那地时，不可……”庄重、自然，符合现代标准汉语的经文语体。将禁令改为“不可学习仿效……所行的可憎之事”，可更顺畅地保留“学习”和“实行/仿效”两个层面。
  terminology: “雅威”“上帝”“那地”“可憎之事”“那些民族”均恰当。“可憎之事”保留了 תּוֹעֲבוֹת 的强烈评价，未将其预先窄化为某类习俗。
