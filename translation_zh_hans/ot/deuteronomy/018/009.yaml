base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/009.yaml
  text: When you come into the land that Yahweh your God is giving you[a], you shall not learn to do according to the abominations of those nations.
translation:
  language: zh_hans
  text: 当你进入雅威你的上帝赐给你的那地时，不可学习仿效那些民族所行的可憎之事[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不可学习去做像那些民族所行的可憎之事。”希伯来文介词可表示比较，也可表示依从或仿效。
    reason: 保留 כְּ־ 在比较与依从意义之间的词汇歧义，并以自然中文表达其与“学习去做”的关系。
lexical_decisions:
- source_word: כִּי
  choice: 当……时
  rationale: 这里引出以色列进入那地时适用的禁令，按上下文表达时间关系最自然。
- source_word: בָּא אֶל־הָאָרֶץ
  choice: 进入……那地
  rationale: 分词在这里具有将来、即将发生的意味；“进入那地”自然表达向境内移动，并保留申命记中“那地”的约定性地理用语。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文直接译出四字神名，而不以称号替代。
- source_word: אֱלֹהֶיךָ
  choice: 你的上帝
  rationale: 准确表达带第二人称阳性单数后缀的所属关系。
- source_word: נֹתֵן לָךְ
  choice: 赐给你的
  rationale: 分词表达正在施予或确定将要施予的行动；中文定语结构既自然，也保留赐地者是雅威这一重点。
- source_word: לֹא תִלְמַד לַעֲשׂוֹת
  choice: 不可学着……行
  rationale: 否定未完成式具有禁令效力；“学着……行”保留“学习”及其行为目的，不把含义缩窄为仅仅了解。
- source_word: כְּתוֹעֲבֹת
  choice: 仿行……可憎的事
  rationale: 前缀 כְּ־可表达比较或依从、仿效；“仿行”在中文中简洁表达按其样式而行。“可憎的事”保留 תּוֹעֵבָה 强烈的宗教与道德谴责，同时不提前限定后文所列行为。
- source_word: הַגּוֹיִם הָהֵם
  choice: 那些民族
  rationale: גּוֹיִם在此指当地诸民族；“那些民族”准确体现复数及远指代词。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用以色列上帝的专名；音译“雅威”力求呈现该名，而非用“主”等称号代替。
- issue: תּוֹעֵבָה 的语气强度
  choice: 可憎的事
  alternative: 可厌恶的习俗
  rationale: “可憎”保留原词强烈的盟约性、宗教性和道德评价；“事”则避免在后文具体列举之前把范围解释得过窄。
- issue: כְּ־ 所表达的比较或依从关系
  choice: 仿行
  alternative: 照着……去做／像……一样去做
  rationale: 上下文禁止以色列学习并实行列国的行为。“仿行”自然体现依从其样式的含义，同时以脚注保留介词也可理解为比较的可能性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“不可”保留律法禁令的力度；“那地”延续申命记的盟约与地理语感。脚注标记置于其所说明的“仿行那些民族可憎的事”之后。
