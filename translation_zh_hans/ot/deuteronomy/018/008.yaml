  text: They shall eat equal portions[a], besides what comes from the sale of his patrimony.
translation:
  language: zh_hans
  text: 每人要享用同等的份额，另加自己变卖祖业的所得。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节末句的希伯来语含义不易确定。也可译作：“另加他变卖家族产业的所得”；这句话也可能较笼统地指与其父家有关的收入。
    reason: alternative_reading
lexical_decisions:
- source_word: חֵלֶק כְּחֵלֶק
  choice: 同等的份
  rationale: 原文直译为“份如同份”，是表达份额相等的惯用结构。“同等的份”既保留“份”的具体含义，也清楚传达平等分配的意思。
- source_word: יֹאכֵלוּ
  choice: 他们要吃
  rationale: 动词本义是“吃”，在此指享用分给祭司的供物。保留具体的“吃”，不将其抽象化为“领取”。
- source_word: לְבַד
  choice: 此外
  rationale: 该词表示另行计算或额外存在的事物；“此外”自然地表明后句所说的收入不包括在同等份额之内。
- source_word: מִמְכָּרָיו
  choice: 变卖……所得的收入
  rationale: 该词可指所卖之物或出售所得。结合语境译作“变卖……所得的收入”，表达其很可能涉及利未人另有的私人财源，同时避免只译成含义不明的“他的买卖”。
- source_word: עַל הָאָבוֹת
  choice: 祖业
  rationale: 原文直译近于“在列祖之上／按父家”，是省略而难解的表达。这里很可能涉及按家族承继的产业或权利；正文用简明的“祖业”，并以脚注保留其他可能。
theological_decisions:
- issue: 末句 מִמְכָּרָיו עַל הָאָבוֹת 的解释
  choice: 理解为与祖业有关的变卖收入，另算在圣所所得的同等份额之外。
  alternative: 也可能泛指与其父家有关的收入，或译为“除了他变卖家族产业所得的”。
  rationale: 希伯来语结构高度压缩，具体所指不能确定。上下文强调前来圣所供职的利未人可享有同等份额；正文采用语境上较连贯的祖业收入之解，但脚注明说原文困难，不把一种解释绝对化。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“同等的份”保留原文关于份额的具体说法；末句以正文加脚注处理，兼顾可读性与原文的歧义。
