  text: וְ/כִֽי יָבֹ֨א הַ/לֵּוִ֜י מֵ/אַחַ֤ד שְׁעָרֶ֨י/ךָ֙ מִ/כָּל יִשְׂרָאֵ֔ל אֲשֶׁר ה֖וּא גָּ֣ר שָׁ֑ם וּ/בָא֙ בְּ/כָל אַוַּ֣ת נַפְשׁ֔/וֹ אֶל הַ/מָּק֖וֹם אֲשֶׁר יִבְחַ֥ר יְהוָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/006.yaml
  text: And if the Levite comes from one of your gates out of all Israel[a], where he is residing, and comes with all the desire of his soul to the place that Yahweh will choose[b],
translation:
  language: zh_hans
  text: 如果有利未人从以色列全境中他所寄居的任何一座城镇[a]而来，并且一心一意前往耶和华将要选择的地方[b]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“你的一座城门”；“城门”在这里借指城镇或城邑。
    reason: cultural_note
  - marker: b
    text: “一心一意”也可译为“带着他全心的渴望”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: 如果
  rationale: 引出与前文相连的条件性律例；现代汉语以“如果”即可自然表达连接兼条件关系。
- source_word: הַלֵּוִי
  choice: 有利未人
  rationale: 希伯来语带定冠词，在律例中泛指这一类人；汉语用“有利未人”引出代表性个案，比直译“那利未人”自然。
- source_word: מֵאַחַד שְׁעָרֶיךָ מִכָּל יִשְׂרָאֵל
  choice: 从以色列全境内你的一座城镇
  rationale: “门”在此借代由城门代表的城镇或聚落；正文传达所指，同时以脚注保留原文意象。“以色列全境内”表达可来自境内任何一处。
- source_word: אֲשֶׁר הוּא גָּר שָׁם
  choice: 就是他寄居的地方
  rationale: גור含居住、寄居之意；“寄居”保留利未人在当地没有产业定居的语感，又不额外译成外国侨民。
- source_word: וּבָא
  choice: 前往……来到那里
  rationale: 保留原文两次“来”的移动脉络，但按汉语语序将起点、目的地和抵达自然组织起来。
- source_word: בְּכָל אַוַּת נַפְשׁוֹ
  choice: 一心向往地
  rationale: 短语表达出于全人的强烈意愿或渴望；此译自然凝练，并以脚注说明较贴字面的译法。
- source_word: אֶל הַמָּקוֹם
  choice: 所选择的地方
  rationale: 原文只说“那地方”，不在正文增译为圣所或敬拜之处，以保留其含蓄指称。
- source_word: אֲשֶׁר יִבְחַר יְהוָה
  choice: 耶和华所选择的
  rationale: 未完成式在申命记惯用公式中指向耶和华将要选定之处；汉语“所选择的”可自然涵盖这种预期语境。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名形式呈现四字神名，而非以称号替代。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用盟约神名；正文以中文传统中通行且可辨识的专名“耶和华”呈现，不译作泛称“主”。
- issue: “那地方”的具体所指
  choice: 地方
  alternative: 圣所／敬拜之处
  rationale: 上下文指向集中敬拜之地，但本节原文没有明说“圣所”；保留“地方”避免把解释写入正文。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。句末保留逗号，因为本节条件句在下一节继续。正文将“城门”的转喻意义译明为“城镇”，脚注保留原文字面意象；“一心向往”兼顾自然表达和 נפש 所指的全人意愿。
