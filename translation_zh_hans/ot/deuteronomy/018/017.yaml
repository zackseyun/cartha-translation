base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/017.yaml
  text: And Yahweh said to me[a], ‘They have spoken well.’
translation:
  language: zh_hans
  text: 雅威对我说：“他们所说的很好。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 未完成式连续体在此推进叙事；现代汉语用“说”自然承接上文，无须机械译出连接词。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 这是神的专名四字神名；采用现代简体中文圣经语境中最通行、易识别的音译“耶和华”，而不以称号代替。
- source_word: אֵלָי
  choice: 对我
  rationale: 介词 אֶל 加第一人称单数词尾表示说话指向“我”；“对我说”符合现代汉语习惯。
- source_word: הֵיטִיבוּ
  choice: 很好
  rationale: יטב 的使役词干在这里对百姓所说的话作肯定评价，意为“做得好/说得对”；结合后面的关系从句，译为“他们所说的很好”既自然又保留评价意味。
- source_word: אֲשֶׁר
  choice: 所
  rationale: 关系词引出 דִּבֵּרוּ 的内容；用“所说的”构成自然的汉语关系结构。
- source_word: דִּבֵּרוּ
  choice: 说的
  rationale: דבר 的加强词干完成式表示他们已经说出的话；在“所……的”结构中译作“说的”。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名，应保留为专名而非译作“主”。“耶和华”是现代中文读者最熟悉的传统音译；“雅威”较接近学界常见的拟音，列为可考虑的替代译法。
- issue: הֵיטִיבוּ אֲשֶׁר דִּבֵּרוּ 的评价对象
  choice: 他们所说的很好
  alternative: 他们说得对
  rationale: 原文的字面结构近于“他们把所说的做得好”，既可理解为肯定说话行为，也可理解为肯定话语内容。正文采用较贴近句法且自然的“他们所说的很好”，不把评价进一步限定为单纯的正确性。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“他们所说的很好”比逐字直译通顺，同时保留原文对所说之话的肯定；脚注交代较字面的表达和“说得对”这一语义可能。
