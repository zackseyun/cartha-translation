  text: כִּ֣י ב֗/וֹ בָּחַ֛ר יְהוָ֥ה אֱלֹהֶ֖י/ךָ מִ/כָּל שְׁבָטֶ֑י/ךָ לַ/עֲמֹ֨ד לְ/שָׁרֵ֧ת בְּ/שֵׁם יְהוָ֛ה ה֥וּא וּ/בָנָ֖י/ו כָּל הַ/יָּמִֽים־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/005.yaml
  text: For Yahweh your God has chosen him from all your tribes to stand and minister in the name of Yahweh[a], he and his sons all the days.
translation:
  language: zh_hans
  text: 因为耶和华你的上帝从你各支派中拣选了他，叫他和他的儿子永远[a]奉耶和华的名侍立供职。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “永远”直译为“所有的日子”；这里指持续、长久的祭司供职。
    reason: 说明希伯来语 כָּל־הַיָּמִים 的字面形式及其在本节中的持续性含义。
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，为相关条例说明理由，保留解释性的因果关系。
- source_word: בּוֹ בָּחַר
  choice: 拣选了他
  rationale: 介词 ב 与“拣选”连用时标示被选者；现代汉语自然表达为“拣选了他”。
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: 耶和华你的上帝
  rationale: 直接音译四字神名，并保留原文第二人称单数领属关系。
- source_word: מִכָּל שְׁבָטֶיךָ
  choice: 从你的众支派中
  rationale: 清楚表达从以色列各支派之中作出选择。
- source_word: לַעֲמֹד
  choice: 侍立
  rationale: 既保留“站立”的具体意象，也以祭司语境中自然庄重的词语表达在上帝面前任职。
- source_word: לְשָׁרֵת
  choice: 供职
  rationale: 在祭司职分语境中表达礼仪性的服事，避免泛化为一般服务。
- source_word: בְּשֵׁם יְהוָה
  choice: 奉耶和华的名
  rationale: 保留以耶和华之名、凭其权柄履行职分的含义，是自然的现代汉语表达。
- source_word: הוּא וּבָנָיו
  choice: 他和他的子孙
  rationale: בָּנִים 可指儿子，也可在世系语境中指男性后裔；此处关乎利未祭司职分的世代延续，“子孙”比仅指第一代的“儿子”更切合上下文。
- source_word: כָּל הַיָּמִים
  choice: 永远
  rationale: 该习语在此表达持续不断、世代延续的祭司职分；正文采用自然汉语，脚注保留较直译的形式。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名；采用现代中文圣经读者最熟悉的专名“耶和华”，不以“主”替代。
- issue: 祭司职分的男性世系用语
  choice: 他和他的子孙
  alternative: 他和他的儿子们
  rationale: 不将原文的阳性世系中性化；“子孙”仍保留父系后裔含义，同时更准确传达此处跨世代的祭司承继。
- issue: כָּל הַיָּמִים 所表达的持续性
  choice: 永远
  alternative: 所有的日子
  rationale: 原文习语字面为“所有的日子”，在本节指持久、延续的职分；译为“永远”不额外界定其形而上范围，脚注说明字面形式。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“侍立”保留祭司在上帝面前站立供职的具体意象；句序稍作调整，把“他和他的子孙”置于“侍立”之前，使中文关系清晰，同时不改变其共同承担持续祭司职分的意思。
