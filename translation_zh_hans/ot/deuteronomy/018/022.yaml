  to: 先知若奉雅威的名说话，所说的事没有发生，也没有应验，那就是雅威没有说过的话，是那先知擅自说的；你不要怕他。
  rationale: 仅作轻微句法澄清：以“是那先知擅自说的”明确末句所指的是前述那句话，并保留原文中“那先知”作为说话者的强调。其余措辞忠实、自然，无须改动。
