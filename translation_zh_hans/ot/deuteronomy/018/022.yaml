  text: אֲשֶׁר֩ יְדַבֵּ֨ר הַ/נָּבִ֜יא בְּ/שֵׁ֣ם יְהוָ֗ה וְ/לֹֽא יִהְיֶ֤ה הַ/דָּבָר֙ וְ/לֹ֣א יָב֔וֹא ה֣וּא הַ/דָּבָ֔ר אֲשֶׁ֥ר לֹא דִבְּר֖/וֹ יְהוָ֑ה בְּ/זָדוֹן֙ דִּבְּר֣/וֹ הַ/נָּבִ֔יא לֹ֥א תָג֖וּר מִמֶּֽ/נּוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/022.yaml
  text: When the prophet speaks in the name of Yahweh[a], and the matter does not happen or come about, that is the matter that Yahweh has not spoken. The prophet has spoken it presumptuously[c][b]; you shall not fear him.
translation:
  language: zh_hans
  text: 先知若奉雅威的名说话，所说的事没有发生，也没有应验，那就是雅威没有说过的话，是那先知擅自说的；你不要怕他。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַנָּבִיא
  choice: 先知
  rationale: 定冠词用于代表性的法律个案；汉语不必机械加“那位”，用“先知若……”自然表达泛指条件。
- source_word: בְּשֵׁם יְהוָה
  choice: 奉雅威的名
  rationale: “奉……的名”自然表达以其名义、声称受其权柄差遣；雅威保留神的专名。
- source_word: הַדָּבָר
  choice: 所说的事／话
  rationale: דָּבָר兼指说出的信息和所预告之事；中文按两处语境分别表达，保留由话语到事件的语义张力。
- source_word: וְלֹא יִהְיֶה ... וְלֹא יָבֹא
  choice: 没有发生，也没有应验
  rationale: 保留两个并列动词；“发生”着重事件未出现，“应验”自然表达预言未实现。
- source_word: בְּזָדוֹן
  choice: 擅自
  rationale: 表达未经授权而出于狂妄、自作主张地发言；在现代汉语中比“僭妄地”更易懂。
- source_word: לֹא תָגוּר מִמֶּנּוּ
  choice: 你不要怕他
  rationale: 简洁保留禁令语气，指不必因其宣称的先知权威而畏惧。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华／主
  rationale: 原文直接使用四字神名；音译为“雅威”保留其专名性质，不以称号替代。
- issue: 预言真伪的检验
  choice: 只陈述本节所给出的未应验检验
  alternative: 扩展为关于一切预言现象的完整教义规则
  rationale: 原文聚焦于奉雅威之名所说之事若不发生，便不是雅威所说；译文不加入本节未明说的限制或推论。
translation_notes:
  register: 采用庄重而通俗的现代标准汉语。“先知若……”适合法律条件句；句式简洁，避免古奥宗教术语。
