base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/015.yaml
  text: Yahweh your God will raise up for you a prophet like me from among you[a], from your brothers[b]; you must listen to him.
translation:
  language: zh_hans
  text: 耶和华—你的上帝—要从你中间、从你弟兄中[a]，给你兴起一位像我一样的先知[b]；你们要听从他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “你”在这里为代表以色列整体的单数。“从你弟兄中”也可译作“从你的以色列同胞中”。希伯来文“弟兄”使用阳性亲属称谓，在这里泛指以色列群体中的成员。
    reason: lexical_alternative
  - marker: b
    text: 新约后来把本节应用于弥赛亚；不过，本节希伯来文的直接措辞只是“一位像我一样的先知”。
    reason: cross_reference
lexical_decisions:
- source_word: נָבִיא
  choice: 一位先知
  rationale: 保留希伯来文的单数和不定性，既不在正文中明确指定其身份，也不把它改写为集体性的“众先知”。
- source_word: מִקִּרְבְּךָ
  choice: 从你们中间
  rationale: 原意为“从你中间”；这里的单数“你”代表以色列整体，现代汉语用“你们中间”能自然表达先知从群体内部兴起。
- source_word: מֵאַחֶיךָ
  choice: 从你的弟兄中
  rationale: 保留 אָח 的男性亲属称谓及申命记中的同胞含义，不在正文中扩写为“以色列同胞”。
- source_word: כָּמֹנִי
  choice: 像我这样的
  rationale: 直接保留先知与摩西之间的比较，未添加身份或性质方面的解释。
- source_word: יָקִים לְךָ
  choice: 为你兴起
  rationale: קום 的使役形在此有使之出现、设立之意；“兴起”兼顾原有动词意象和 לְךָ 的受益含义。
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: 耶和华你的上帝
  rationale: 以“耶和华”传达四字神名，并按现代标准普通话译出圣约称谓。
- source_word: אֵלָיו
  choice: 他
  rationale: 与“听从”连用，在自然汉语中已表达希伯来文介词所标明的对象。
- source_word: תִּשְׁמָעוּן
  choice: 你们要听从
  rationale: שׁמע 在此不只是听见，也包含留心听取的要求；“听从”保留听与遵从之间的语义张力。“你们”也反映动词的复数形式。
theological_decisions:
- issue: “像我这样的先知”是否在正文中明确为弥赛亚
  choice: 正文保留“一位像我这样的先知”的原文表述
  alternative: 译作具有明确弥赛亚称号意味的“那位先知”
  rationale: 希伯来文使用单数 נָבִיא，却没有定冠词，也没有在本节直接说明其弥赛亚身份；因此不把后来的正典应用预先写入正文。
- issue: “弟兄”的代表范围
  choice: 正文保留“弟兄”，脚注说明此处指以色列同胞
  alternative: 正文直接译作“以色列同胞”或“弟兄姊妹”
  rationale: 这样既忠实保留希伯来文的男性复数亲属称谓，也让脚注交代其在上下文中的群体性所指。
- issue: 单数与复数第二人称的转换
  choice: 分别译作“你的上帝／为你”和“你们要听从”
  alternative: 全句统一改为复数“你们的／为你们”
  rationale: 希伯来文前半使用代表全体的单数，末尾动词则为复数；保留这一转换可避免抹平原文的人称变化。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“兴起”“先知”“听从”保留经文语体，但仍属当代常用表达。正文保留希伯来文从代表性单数转为复数的变化，并以脚注解释可能引起误解的“弟兄”和后来的弥赛亚应用。
