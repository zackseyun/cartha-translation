  yaml_path: translation/ot/deuteronomy/018/021.yaml
  text: And if you say in your heart[a], ‘How shall we know the word that Yahweh has not spoken?’
translation:
  language: zh_hans
  text: 你心里若说：“我们怎样才能知道哪一句话[a]不是耶和华所说的呢？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “话”也可译作“信息”或“事”；希伯来语דָּבָר含义较广，在这里的先知语境中译作“话”较为贴切。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי תֹאמַר
  choice: 你……若说
  rationale: וְכִי承接上文并引出设想的条件；现代汉语以“若说”自然表达这种条件语气。
- source_word: בִּלְבָבֶךָ
  choice: 心里
  rationale: 保留希伯来语以“心”指人内在思想的意象，同时符合现代汉语习惯。
- source_word: אֵיכָה נֵדַע
  choice: 我们怎样才能知道
  rationale: אֵיכָה询问辨明的方法，נֵדַע为“知道”；加入“才能”使汉语问句自然，并保持审慎探询的语气。
- source_word: הַדָּבָר
  choice: 哪句话
  rationale: דָּבָר可指话、信息或事情；在检验先知话语的上下文中译作“话”最贴切。疑问句中用“哪句话”自然表达所要识别的对象。
- source_word: אֲשֶׁר לֹא דִבְּרוֹ יְהוָה
  choice: 不是耶和华说的
  rationale: 关系从句说明该话并非出于耶和华；此译简明保留原文否定判断，未预先解释下一节的检验标准。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神名音译“耶和华”，明确呈现专名而不以称号替代。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 两者都是四字神名的中文表达；正文采用普通中文读者最熟悉且具有庄重经文语域的“耶和华”，不以“主”替换专名。
- issue: 问题所指的是预言的“话”还是更广义的“事”
  choice: 话
  alternative: 事／信息
  rationale: 紧接关于先知奉神名说话的语境，“话”最能体现先知言语；脚注保留דָּבָר较宽的语义范围。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“你心里若说”保留原文的内在思量意象；直接引语用自然的现代汉语问句表达。
