base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/014.yaml
  text: You shall not move your neighbor’s boundary marker[a], which the former generations set, in your inheritance that you will inherit in the land that Yahweh your God is giving you to possess.
translation:
  language: zh_hans
  text: 不可挪动邻舍的界标[a]，就是前人所立的；这界标在你将要承受的产业中，也就是在雅威你的上帝赐给你、让你取得为业的土地上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“地界”。希伯来语在这里指由标志固定下来的地产边界。
    reason: 说明 גְּבוּל 既可表示边界本身，也可在本语境中具体指界标。
lexical_decisions:
- source_word: תַסִּיג
  choice: 挪动
  rationale: 此处使役词形指把地界向后挪移，从而侵占邻舍土地。“挪动”自然地表达法律所禁止的行为，又不把方向或方式说得过死。
- source_word: גְּבוּל
  choice: 界标
  rationale: 该词本可指“边界”，但与“挪动”连用时具体指固定地产边界的标志；“界标”简洁而明确。
- source_word: רֵעֲךָ
  choice: 邻舍
  rationale: 在盟约法律和地产语境中，指共同体中的他人，尤其是相邻土地的所有者；“邻舍”保留法律与群体关系的意味。
- source_word: גָּבְלוּ
  choice: 所立的
  rationale: 此动词表示设定、划定边界。与“界标”搭配时，“立”符合现代汉语习惯，也反映前人已经确立地界。
- source_word: רִאשֹׁנִים
  choice: 前人
  rationale: 原文泛指早先的人，并未明确限定为直系祖先；“前人”保留这一范围，避免过度具体化为“祖先”。
- source_word: בְּנַחֲלָתְךָ
  choice: 在你将要承受的产业中
  rationale: נַחֲלָה 指分得并承受的产业，兼有土地分配和承继的意味；结合后续动词译出未来指向。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译呈现四字神名，将其作为专名处理，而不以“主”等称号替代。
- source_word: נֹתֵן לְךָ
  choice: 赐给你
  rationale: 分词描写雅威赐地的行动；汉语用“赐给”既自然，也符合土地作为上帝所赐产业的语境。
- source_word: לְרִשְׁתָּהּ
  choice: 占有
  rationale: 此处表示取得并持有那地。“占有”保留法律性的土地取得含义，同时不额外加入征服方式。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用神的专名。译作“雅威”较直接地音译该名，并避免以称号取代专名；“耶和华”是汉语传统形式，但其语音依据较间接。
- issue: נַחֲלָה 的土地与承继含义
  choice: 产业
  alternative: 土地；份地
  rationale: “产业”保留该词既是所分得之地、又是承受之业的双重意味，不把它简化为一般地产。
translation_notes:
  register: 采用现代、庄重而易懂的法律训令语体。句首先交代土地与产业范围，主禁令置于后半句；保留“产业”“占有”等申命记土地用语，并避免使用生僻的古汉语表达。
