  source_fidelity: 草稿准确传达了禁令、邻舍、界标、前人、承受产业、雅威赐地及取得该地等主要成分。可是首句将两个地点短语前置后，“赐给你占有的土地”在汉语中修饰关系不清，且未清楚表达 לְרִשְׁתָּהּ 所指的是取得那地为业。
  naturalness: “在雅威你的上帝赐给你占有的土地上”不够自然，容易读成“赐给你占有的土地”，而非“赐地给你，使你取得它为业”。调整语序和停顿后可保持现代、庄重的法律语体。
  terminology: “雅威”“上帝”“邻舍”“界标”“产业”均合适。“界标”忠实呈现本处可移动的具体地界标志；脚注保留“地界”这一较宽泛替代译法也恰当。
