  text: וְ/אִם יַרְחִ֞יב יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ אֶת גְּבֻ֣לְ/ךָ֔ כַּ/אֲשֶׁ֥ר נִשְׁבַּ֖ע לַ/אֲבֹתֶ֑י/ךָ וְ/נָ֤תַן לְ/ךָ֙ אֶת כָּל הָ/אָ֔רֶץ אֲשֶׁ֥ר דִּבֶּ֖ר לָ/תֵ֥ת לַ/אֲבֹתֶֽי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/008.yaml
  text: And if Yahweh your God enlarges your territory[a], as he swore to your fathers, and gives you all the land that he promised to give to your fathers,
translation:
  language: zh_hans
  text: 如果耶和华—你的上帝扩张你的疆域，照他向你列祖所起的誓，把他应许赐给你列祖的全地都赐给你，[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节的条件句延续到下一节，结果随后才说明。
    reason: 澄清希伯来文长条件结构，避免读者把本节末尾误当成完整句的结论。
lexical_decisions:
- source_word: וְאִם
  choice: 如果
  rationale: 本句承接上文并引出条件；现代汉语以“如果”自然表达，段内联系可由语境体现。
- source_word: יַרְחִיב
  choice: 扩张
  rationale: 使役形式表示使疆域扩大；“扩张你的疆域”贴近原意，也符合现代汉语习惯。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 直接译出四字神名；“耶和华”是现代中文圣经传统中通行且易识别的专名形式。
- source_word: אֱלֹהֶיךָ
  choice: 你的上帝
  rationale: 准确保留第二人称单数所属关系；“上帝”庄重而通俗。
- source_word: גְּבֻלְךָ
  choice: 你的疆域
  rationale: 此处指国土范围，不仅是边界线；“疆域”能准确表达领土扩展。
- source_word: כַּאֲשֶׁר נִשְׁבַּע
  choice: 照他……所起的誓
  rationale: 保留誓言的明确含义及比较关系，比单译为“照他所应许的”更贴近希伯来文。
- source_word: לַאֲבֹתֶיךָ
  choice: 向你列祖／给你列祖
  rationale: “列祖”保留原文阳性复数的盟约历史用语，同时在中文中自然指以色列先祖；两处依各自动词搭配分别使用“向”和“给”。
- source_word: וְנָתַן לְךָ
  choice: 把……都赐给你
  rationale: 完成式在条件句中表达将来的实现；“赐给”适合上帝赐地的语境，并以汉语把字句自然组织长宾语。
- source_word: כָּל הָאָרֶץ
  choice: 全地
  rationale: 指应许之地的全部范围；“全地”简洁保留原文整体性。
- source_word: אֲשֶׁר דִּבֶּר לָתֵת
  choice: 他应许赐给
  rationale: דִּבֶּר字面为“说”，在此盟约语境中具有应许的效力；“应许”自然传达这一语用含义。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 正文保留神的专名而不以“主”替代；“耶和华”是简体中文读者最熟悉的传统音译，“雅威”则是较接近学术重构读音的替代形式。
- issue: אבות 的译法
  choice: 列祖
  alternative: 祖先
  rationale: “列祖”既保留原文阳性家族称谓和以色列盟约传统的色彩，也能自然指向族长先辈；“祖先”更宽泛，但会弱化原有措辞。
- issue: 条件句的范围
  choice: 把扩张疆域和赐下全地都保留在“如果”所引出的条件从句内
  alternative: 将“赐给你”理解成主要结果句
  rationale: 希伯来文后续上下文表明本节仍在铺陈条件，而结果在后文展开；如此也保留וְנָתַן在将来条件语境中的功能。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。以破折号标明“你的上帝”是对“耶和华”的同位说明；保留“列祖”这一盟约历史用语。经文在本节末尾按原文保持未完的条件结构，并以逗号承接下节。
