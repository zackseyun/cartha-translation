source:
  edition: WLC
  text: וַ/אֲשֶׁר֩ יָבֹ֨א אֶת רֵעֵ֥/הוּ בַ/יַּעַר֮ לַ/חְטֹ֣ב עֵצִים֒ וְ/נִדְּחָ֨ה יָד֤/וֹ בַ/גַּרְזֶן֙ לִ/כְרֹ֣ת הָ/עֵ֔ץ וְ/נָשַׁ֤ל הַ/בַּרְזֶל֙ מִן הָ/עֵ֔ץ וּ/מָצָ֥א אֶת רֵעֵ֖/הוּ וָ/מֵ֑ת ה֗וּא יָנ֛וּס אֶל אַחַ֥ת הֶ/עָרִים הָ/אֵ֖לֶּה וָ/חָֽי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/005.yaml
  text: But if a man goes with his neighbor into the forest to cut wood[a], and his hand swings the axe to cut down the tree, and the iron head slips from the handle and strikes his neighbor so that he dies, he may flee to one of these cities and live.
translation:
  language: zh_hans
  text: 例如，若有人和同伴一同进树林砍伐木材[a]，他挥动斧头砍树时，斧头的铁头从木柄上脱落，击中同伴，使他死亡；这人可以逃到这些城中的一座，得以存活。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “斧头的铁头从木柄上脱落”直译为“铁从木头脱落”。这里“铁”指斧头的铁制头部，“木头”指木柄。
    reason: 说明原文的转喻表达，并保留较为直译的措辞。
lexical_decisions:
- source_word: וַאֲשֶׁר
  choice: 比如，有人
  rationale: 本句承接前文，为误杀者举出具体案例。用“比如”自然表达希伯来语关系从句在此处的举例功能，不把它误解为与前文相反的转折。
- source_word: רֵעֵהוּ
  choice: 同伴
  rationale: 法律语境中的 רֵעַ 指与当事人一同活动的人，并不必然是邻居或亲密朋友；“同伴”贴合共同进树林的场景。
- source_word: בַיַּעַר
  choice: 进树林
  rationale: יַעַר 指林木茂密之地；“树林”是现代汉语中自然、清楚的表达。
- source_word: לַחְטֹב עֵצִים
  choice: 砍柴
  rationale: 该短语泛指砍伐木材。“砍柴”简洁自然，也与后文砍树的具体动作相衔接。
- source_word: וְנִדְּחָה יָדוֹ בַגַּרְזֶן
  choice: 他挥动斧头
  rationale: 原文直陈手持斧头用力运动；汉语以“挥动斧头”表达该动作更自然，同时保留事故发生于正常砍伐动作中的意味。
- source_word: לִכְרֹת הָעֵץ
  choice: 砍树
  rationale: כרת 在此指砍伐树木；“砍树”通俗而准确，不额外限定树是否已经倒下。
- source_word: וְנָשַׁל הַבַּרְזֶל מִן־הָעֵץ
  choice: 斧头的铁刃脱离木柄
  rationale: 字面为“铁从木头脱落”。这里“铁”借指斧头的铁制刃部，“木头”指木柄；正文采用所指对象以便理解，并以脚注保留字面结构。
- source_word: וּמָצָא אֶת־רֵעֵהוּ
  choice: 击中同伴
  rationale: מצא 的基本义是“找到、碰到”，在飞出物体触及人的语境中表示击中；“击中”准确传达意外撞击。
- source_word: וָמֵת
  choice: 致使他死亡
  rationale: 明确死亡者是被击中的同伴，并表达撞击所造成的结果。
- source_word: הוּא יָנוּס אֶל־אַחַת הֶעָרִים הָאֵלֶּה וָחָי
  choice: 这人可以逃到这些城中的一座，得以存活
  rationale: “可以”体现法律给予误杀者逃往逃城的保护性许可；“得以存活”保留 וָחָי 的结果和目的意味。
theological_decisions:
- issue: 逃往逃城的法律效力
  choice: 可以逃到……得以存活
  alternative: 必须逃到……并且活着
  rationale: 上下文是在说明误杀者享有的避难途径，而非单纯发布强制命令；译文保留其保护性法律功能，不引入额外教义解释。
translation_notes:
  register: 采用现代、庄重而易懂的法律叙事语体。“同伴”避免把 רֵעַ 过度限定为住在附近的“邻舍”；分号清楚区分事故案例与法律后果。脚注标记 [a] 已置于正文相关短语之后。
