  text: וְ/לֹ֥א תָח֖וֹס עֵינֶ֑/ךָ נֶ֣פֶשׁ בְּ/נֶ֗פֶשׁ עַ֤יִן בְּ/עַ֨יִן֙ שֵׁ֣ן בְּ/שֵׁ֔ן יָ֥ד בְּ/יָ֖ד רֶ֥גֶל בְּ/רָֽגֶל׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/021.yaml
  text: 'Your eye shall not pity: life for life[a], eye for eye, tooth for tooth, hand for hand[b], foot for foot.'
translation:
  language: zh_hans
  text: 你的眼不可顾惜[a]：命抵命[b]，眼抵眼，牙抵牙，手抵手，脚抵脚。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “顾惜”也可译作“怜惜”或“因怜悯而宽免”。
    reason: lexical_alternative
  - marker: b
    text: 原文作“生命抵生命”；这里的“生命”不是特指后期神学意义上的“灵魂”。
    reason: lexical_clarification
lexical_decisions:
- source_word: תָחוֹס
  choice: 顾惜
  rationale: חוס可表示怜惜、顾惜而不予处置。在司法语境中，“顾惜”既保留不可因怜悯而宽纵的含义，也与“眼”构成可理解的希伯来式表达。
- source_word: עֵינֶךָ
  choice: 你的眼
  rationale: 原文以“你的眼”为主语，形成“眼不可顾惜”的具体意象；译文保留这一表达，而不简化为“你不可怜悯”。
- source_word: נֶפֶשׁ
  choice: 命
  rationale: 在固定法律公式 נֶפֶשׁ בְּנֶפֶשׁ 中指人的生命，不是后期形而上意义上的“灵魂”；“命”又能与下文简洁、对称的句式配合。
- source_word: בְּ
  choice: 抵
  rationale: 此处介词表示对应、等价或报偿关系。“抵”简洁地表达法律上的相称对应，并保持各短语的整齐结构。
- source_word: עַיִן
  choice: 眼
  rationale: 直译身体部位，保留同态报偿公式的具体措辞。
- source_word: שֵׁן
  choice: 牙
  rationale: “牙”是现代汉语中自然、准确的身体部位名称，也适合这一固定的法律排比。
- source_word: יָד
  choice: 手
  rationale: 按原文直译，保留法律公式的具体性。
- source_word: רֶגֶל
  choice: 脚
  rationale: רֶגֶל在此指脚；“脚”比“腿”更准确，也与排比中的其他身体部位相称。
theological_decisions:
- issue: 应保留具体的同态报偿公式，还是将其概括为比例公正原则
  choice: 保留“命抵命，眼抵眼，牙抵牙，手抵手，脚抵脚”的具体公式。
  alternative: 意译为“刑罚必须与罪行相称”。
  rationale: 原文采用固定而具体的司法公式。概括为抽象原则会抹去其修辞力度、法律语境以及与摩西五经其他经文的互文联系；译文不替文本消解其神学和伦理张力。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。保留“你的眼不可顾惜”这一希伯来语具体意象，并用“抵”构成紧凑、对称的司法排比；避免将经文软化为抽象的比例原则。
