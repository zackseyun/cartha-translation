base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/006.yaml
  text: otherwise the avenger of blood may pursue the manslayer[a], because his heart is hot, and overtake him because the way is long, and strike him dead, though he did not deserve the death penalty[b], since he had not hated him previously.
translation:
  language: zh_hans
  text: 免得报血仇的人因怒火中烧，追赶误杀了人的那人；因路途遥远，他追上那人，把他打死，尽管那人本不该被判死刑，因为他从前并不恨那死者。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פֶּן
  choice: 免得
  rationale: 承接设立逃城的预防目的，保留希伯来语所表达的警戒和防止结果发生的语气。
- source_word: גֹּאֵל הַדָּם
  choice: 报血仇的人
  rationale: 指为被杀亲属追讨血债的近亲角色；此译自然地保留其法律与亲属责任含义。
- source_word: הָרֹצֵחַ
  choice: 那误杀人的
  rationale: 该词本身可泛指杀人者，但上下文明确此人没有宿怨且不当被判死刑，因此用“误杀人的”表达本段的法律类别，避免误译为蓄意谋杀者。
- source_word: כִּי יֵחַם לְבָבוֹ
  choice: 因怒火中烧
  rationale: 原文直译为“他的心发热”；采用现代汉语成语，保留愤怒炽烈的意象。
- source_word: וְהִשִּׂיגוֹ
  choice: 追上那人
  rationale: 准确表达追赶后赶上的动作。
- source_word: כִּי יִרְבֶּה הַדֶּרֶךְ
  choice: 若路途遥远
  rationale: 保留原文具体的路程意象；按句法关系译为导致追上的条件。
- source_word: וְהִכָּהוּ נָפֶשׁ
  choice: 把他打死
  rationale: 原文是以击打夺去性命的表达；此译既保留暴力动作，也符合现代汉语。
- source_word: וְלוֹ אֵין מִשְׁפַּט מָוֶת
  choice: 其实那人并不该被判死刑
  rationale: מִשְׁפַּט מָוֶת 是法律性的“死刑判决／死罪”；此译明确其不负死刑责任，而非声称尚未经过任何程序。
- source_word: כִּי לֹא שֹׂנֵא הוּא לוֹ
  choice: 因为他先前并不恨死者
  rationale: 忠实表达没有预先仇恨这一法律理由；以“死者”明确代词所指，避免现代汉语中的指代混乱。
- source_word: מִתְּמוֹל שִׁלְשׁוֹם
  choice: 先前
  rationale: 这是表示以往、素来如此的希伯来语习语；“先前”自然且不把字面上的昨日、前日误解为严格时限。
theological_decisions:
- issue: 误杀者是否应受死刑
  choice: 译为“并不该被判死刑”
  alternative: “没有死刑的判决”
  rationale: 上下文是在陈述此人没有死刑责任，因其并无预先仇恨；采用自然的法律用语，不对更广泛的刑罚神学作延伸。
translation_notes:
  register: 采用庄重而清晰的现代标准汉语。“报血仇的人”保留古代以亲属追讨血债的制度背景；“怒火中烧”传达“心发热”的希伯来语意象。句子适度分开，以免多重代词和从句造成歧义。
