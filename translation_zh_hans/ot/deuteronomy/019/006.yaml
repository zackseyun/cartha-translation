revisions:
- from: 免得报血仇的人因怒火中烧，就追赶那误杀人的；若路途遥远，他可能追上那人，把他打死。其实那人并不该被判死刑，因为他先前并不恨死者。
  to: 免得报血仇的人因怒火中烧，追赶误杀了人的那人；因路途遥远，他追上那人，把他打死，尽管那人本不该被判死刑，因为他从前并不恨那死者。
  rationale: 仅作必要的汉语语法与句法衔接修订，不改变原文所保留的古代报血仇制度、法律责任或因果关系。“怒火中烧”继续传达“心发热”的愤怒意象；“本不该被判死刑”保留其不承担死刑法律责任的含义。
