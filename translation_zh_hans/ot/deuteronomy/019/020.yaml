  text: וְ/הַ/נִּשְׁאָרִ֖ים יִשְׁמְע֣וּ וְ/יִרָ֑אוּ וְ/לֹֽא יֹסִ֨פוּ לַ/עֲשׂ֜וֹת ע֗וֹד כַּ/דָּבָ֥ר הָ/רָ֛ע הַ/זֶּ֖ה בְּ/קִרְבֶּֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/020.yaml
  text: And those who remain shall hear and fear[c][b][a], and shall never again do such an evil thing in your midst.
translation:
  language: zh_hans
  text: 其余的人[a]听见了，就会惧怕，再也不在你[c]中间行这样的恶事[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“剩下的人”或“其他的人”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译“像这件恶事”，即这一类的恶行。
    reason: lexical_alternative
  - marker: c
    text: 希伯来文“你”是单数，把以色列全体作为一个整体来称呼。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנִּשְׁאָרִים
  choice: 其余的人
  rationale: 这是שׁאר的尼法勒分词，指在司法惩处之后留下来的其他人；“其余的人”自然、清楚，也保留了原文所指群体的开放性。
- source_word: יִשְׁמְעוּ
  choice: 听见了
  rationale: שׁמע的基本义是“听见”。在本节语境中，意思是听到这次惩处的消息；译文不明加“这件事”，以免过度释义。
- source_word: וְיִרָאוּ
  choice: 就会惧怕
  rationale: ירא在这里表示因听闻惩处而产生畏惧，具有阻吓作用；“惧怕”比“害怕”更符合律法语境的庄重语体。
- source_word: וְלֹא יֹסִפוּ לַעֲשׂוֹת עוֹד
  choice: 再也不……行
  rationale: יסף与不定词及עוֹד连用，在此表示不再重复这种行为；“再也不……行”自然地表达了这一否定的将来含义。
- source_word: כַּדָּבָר הָרָע הַזֶּה
  choice: 这样的恶事
  rationale: דבר在这里指行为或事情，前缀כ表达“像这一类”的比较意义；“这样的恶事”既自然，又保留了原文对同类恶行的指涉。
- source_word: בְּקִרְבֶּךָ
  choice: 在你中间
  rationale: 这是以第二人称阳性单数称呼以色列整体的盟约和司法用语；采用单数“你”以保留原文将全体视为一个整体的表达。
theological_decisions:
- issue: בְּקִרְבֶּךָ中数与受话对象的转换
  choice: 保留单数“你”
  alternative: 按现代汉语习惯译作“在你们中间”
  rationale: 希伯来语后缀是第二人称阳性单数，以一个整体来称呼以色列。保留单数可呈现这种集体性称呼，而不额外加入神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的律法语体。“听见了，就会惧怕”呈现听闻惩处后的阻吓效果；“再也不……行”避免生硬照译“不给自己增加再做”。正文保留单数“你”，并以脚注说明其集体指向。
