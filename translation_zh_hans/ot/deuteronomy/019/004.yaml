  text: וְ/זֶה֙ דְּבַ֣ר הָ/רֹצֵ֔חַ אֲשֶׁר יָנ֥וּס שָׁ֖מָּ/ה וָ/חָ֑י אֲשֶׁ֨ר יַכֶּ֤ה אֶת רֵעֵ֨/הוּ֙ בִּ/בְלִי דַ֔עַת וְ/ה֛וּא לֹא שֹׂנֵ֥א ל֖/וֹ מִ/תְּמֹ֥ל שִׁלְשֹֽׁם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/004.yaml
  text: 'This is the provision for the manslayer who may flee there and live: when he strikes his neighbor without intent[a], and he did not hate him in times past.'
translation:
  language: zh_hans
  text: 这是有关致人死亡者逃到那里得以存活的规定：就是他无意中击打邻舍，从前[a]也不恨他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“从昨天和前天”，是表示“先前、素来”的习语。
    reason: 保留希伯来语时间习语的字面形式，说明正文“从前”的依据。
lexical_decisions:
- source_word: דְּבַר
  choice: 规定
  rationale: 在本段法律语境中，此词指适用于案件的条款或规定；“规定”比直译“话”自然，也比泛泛的“事情”明确。
- source_word: הָרֹצֵחַ
  choice: 致人死亡者
  rationale: 本节所指的人造成了死亡，却不一定犯有蓄意谋杀罪；“致人死亡者”保持中性，避免“凶手”或“谋杀者”预先判定其罪责。
- source_word: יָנוּס שָׁמָּה וָחָי
  choice: 可以逃到那里存活
  rationale: 未完成式在这里界定有资格逃往逃城的人，后面的连接式完成时表达逃去后的结果；此译同时传达许可和存活的结果。
- source_word: יַכֶּה
  choice: 击杀
  rationale: נכה本义为“击打”，而本段明确谈论由此导致死亡的人。“击杀”既保留击打这一动作，也让现代读者清楚其致命结果。
- source_word: רֵעֵהוּ
  choice: 邻舍
  rationale: “邻舍”保留此法律语境中的人际关系含义，也是现代中文圣经语体中清楚而庄重的表达。
- source_word: בִּבְלִי דַעַת
  choice: 并非故意
  rationale: 字面为“在没有知识的情况下”，在逃城法例中表示行为并非出于知情或蓄意；“并非故意”准确传达其法律意义。
- source_word: לֹא שֹׂנֵא לוֹ
  choice: 并不恨他
  rationale: 否定的分词描述先前持续的态度；此译自然保留仇恨与法律责任之间的关联。
- source_word: מִתְּמֹל שִׁלְשֹׁם
  choice: 从前
  rationale: 这是表示先前或素来如此的时间习语；“从前”简洁自然，字面形态在脚注中保留。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的法律叙述语体。“致人死亡者”避免把尚待按本条规定判断的当事人直接称为“谋杀者”；句式保持原文先陈述规定、再界定适用情形的结构。
