  text: then the elders of his city shall send and take him from there and hand him over to the avenger of blood[a], and he shall die.
translation:
  language: zh_hans
  text: 他本城的长老要派人把他从那里带来，交给报血仇的人[a]；他就必死。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“血的报仇者”。希伯来语此短语是法律专称，指负责为被杀之人追讨血债的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁלְחוּ
  choice: 就要派人去
  rationale: 在这段法律条文中，带连接词的完成式具有规定、指令意味；“就要派人去”既自然，也保留法律上的必行性。
- source_word: זִקְנֵי עִירוֹ
  choice: 他本城的长老
  rationale: זִקְנֵי 指城中公认的治理者；“他本城”表达 עִירוֹ 所指的归属地，并与逃城“那里”相区别。
- source_word: וְלָקְחוּ אֹתוֹ מִשָּׁם
  choice: 把他从那里带走
  rationale: לקח 基本义为“取、带”；此处指将杀人者从逃城带离，不额外加入原文未明说的强制程度。
- source_word: וְנָתְנוּ אֹתוֹ בְּיַד
  choice: 交在……手中
  rationale: 较贴近“交在某人手中”的希伯来法律习语，同时在现代汉语中仍清楚表达把人交由对方处置。
- source_word: גֹּאֵל הַדָּם
  choice: 报血仇者
  rationale: 这是律法中的专门称谓，指负责为被杀者追讨血债的人；“报血仇者”简洁、可懂，并保留 גאל 与“血”的法律语义。
- source_word: וָמֵת
  choice: 他必须死
  rationale: 此处在法律规定中说明移交后的必然刑罚结果；“必须死”自然传达其规范和结果意味，而不增加执行方式。
theological_decisions:
- issue: גֹּאֵל הַדָּם 的身份及职能
  choice: 报血仇者
  alternative: 血的报仇者；至亲复仇者
  rationale: 原文在此突出其追讨血债的法律职能，但未在本节明说亲属身份；因此正文不加入“至亲”，脚注说明该词是专门法律称谓。
translation_notes:
  register: 采用现代、庄重而易懂的法律叙述语体。“派人去”补出汉语中自然隐含的差遣对象，但不改变原文行动主体；分号保留末句简短而有力的判决结果。
