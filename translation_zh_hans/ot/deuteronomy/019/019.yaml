base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/019.yaml
  text: Then you shall do to him just as he intended to do to his brother[a]. So you shall purge the evil from your midst.
translation:
  language: zh_hans
  text: 你们要照他图谋要怎样对待他的弟兄，也怎样对待他[a]。这样，你要从你中间除掉这恶。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弟兄”也可译作“同胞”或“同一群体中的人”；希伯来文直译为“他的弟兄”，在这里的法律语境中可指圣约群体中的另一成员。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲשִׂיתֶם לוֹ
  choice: 你们要……对待他
  rationale: 复数形式向负责审判的群体发出法律指令；中文用“要”表达规范性要求。“对待他”自然承接后面的对应结构。
- source_word: כַּאֲשֶׁר
  choice: 照……怎样……也怎样
  rationale: 表达刑罚与所图谋伤害之间的对应关系，比单用“如同”更符合现代汉语句法。
- source_word: זָמַם
  choice: 图谋
  rationale: 该动词指筹划、意图，语境中带有恶意；“图谋”保留这种敌对意味，又没有增添具体罪行。
- source_word: לַעֲשׂוֹת לְאָחִיו
  choice: 怎样对待他的弟兄
  rationale: עשה ל־在此指对某人施行某事，译作“对待”自然；“弟兄”保留 אָח 的男性单数形式及圣约群体用语色彩。
- source_word: וּבִעַרְתָּ הָרָע
  choice: 这样，你就……除掉了恶
  rationale: בער在申命记法律套语中意为清除而非焚烧；“除掉了恶”保留道德与群体洁净的力度。完成体放在命令结果中以结果式表达。
- source_word: מִקִּרְבֶּךָ
  choice: 从你中间
  rationale: 保留原文第二人称单数和“从群体内部清除”的意象；与前半句复数的转换也对应希伯来文形式。
theological_decisions:
- issue: 法律语境中 אָחִיו 的性别与群体含义
  choice: 他的弟兄
  alternative: 他的同胞；他的同伴
  rationale: 原文是阳性单数“他的弟兄”，同时在此可泛指圣约群体中的另一成员。正文保留源语形式，脚注说明较广的法律语义。
- issue: 第二人称由复数转为单数
  choice: 前句“你们”，后句“你”
  alternative: 全节统一译作“你们”
  rationale: 原文 וַעֲשִׂיתֶם 是复数，而 וּבִעַרְתָּ、מִקִּרְבֶּךָ 是单数。保留这一转换，避免无依据地抹平文本形式；单数可视为对以色列整体的集体称呼。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。前半句用对应句式呈现同害相偿的司法原则；后半句保留申命记常见的“从你中间除掉恶”法律套语，并刻意保留原文由复数“你们”转为单数“你”的变化。
