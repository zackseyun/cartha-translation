base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/011.yaml
  text: But if there is a man who hates his neighbor[a], and lies in wait for him, and rises up against him, and strikes him so that he dies, and he flees to one of these cities,
translation:
  language: zh_hans
  text: 但若有人恨他的邻舍，埋伏等候他，起来攻击他，击打他[a]，使他死亡，随后逃到这些城中的一座，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “击打他”后面的希伯来语词为“性命（或生命）”（נֶפֶשׁ）；这是一种表示施以致命击打的惯用表达。也可译作“给他致命一击”。
    reason: 说明נֶפֶשׁ的实际字面形式及其在本句中的惯用致死含义，避免误作“他的性命”。
lexical_decisions:
- source_word: וְכִי
  choice: 但若
  rationale: 本节转而说明与上文误杀相对的蓄意杀人情形；“但”表达转折，“若”保留法律条件句的形式。
- source_word: יִהְיֶה אִישׁ
  choice: 有人
  rationale: 希伯来语采用阳性单数的代表性法律案例；现代汉语用“有人”表达自然，也不改变其泛指个案的作用。
- source_word: שֹׂנֵא לְרֵעֵהוּ
  choice: 恨他的邻舍
  rationale: שֹׂנֵא直指仇恨；רֵעַ在法律语境中指邻舍、同伴。“邻舍”保留人际及盟约社会中的法律关系，又不误解为亲密朋友。
- source_word: וְאָרַב לוֹ
  choice: 埋伏等候他
  rationale: 该动词表示为袭击某人而潜伏守候，突出预谋性；“埋伏等候”比单说“等候”更清楚。
- source_word: וְקָם עָלָיו
  choice: 起来攻击他
  rationale: 原文直译为“起来反对/攻击他”，这里指付诸敌对行动；译文兼顾原有动作顺序和现代汉语的清晰度。
- source_word: וְהִכָּהוּ נֶפֶשׁ וָמֵת
  choice: 击打他，使他死了
  rationale: 不以“谋杀”概括原文，而保留“击打—死亡”的动作与结果。נֶפֶשׁ在这里属于致命击打的惯用表达，其字面特点在脚注中说明。
- source_word: וְנָס
  choice: 随后逃到
  rationale: 译出“逃”的基本意义；“随后”使连续动作在汉语中衔接自然，但不额外规定时间间隔。
- source_word: אֶל אַחַת הֶעָרִים הָאֵל
  choice: 这些城中的一座
  rationale: 指上文所设立的逃城；“这些”对应近指词，“城”对应עָרִים。
theological_decisions:
- issue: 蓄意杀人与误杀的法律区分
  choice: 保留“恨—埋伏—起来攻击—击打致死”的完整动作链
  alternative: 直接译作“谋杀了他”
  rationale: 上下文清楚表明这是蓄意杀人，但原文没有用一个概括性动词，而是逐项陈述敌意、预谋、袭击和死亡结果。保留这一结构既显明故意性，也避免加入超出原文形式的法律标签。
- issue: נֶפֶשׁ在致命击打表达中的含义
  choice: 正文译作“击打他，使他死了”，脚注说明原文字面及惯用含义
  alternative: 正文译作“给他致命一击”或“击打他的性命”
  rationale: “给他致命一击”较为解释性，“击打他的性命”在现代汉语中生硬。正文自然表达结果，脚注则保存原文的词汇特点和可能的形式对应。
translation_notes:
  register: 采用庄重而明白的现代标准汉语，保留法律条件句及连续动作。经文在本节末仍未结束，故以逗号承接下一节。
