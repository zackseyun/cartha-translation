  text: כִּֽי יַכְרִ֞ית יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ אֶת הַ/גּוֹיִ֔ם אֲשֶׁר֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ נֹתֵ֥ן לְ/ךָ֖ אֶת אַרְצָ֑/ם וִֽ/ירִשְׁתָּ֕/ם וְ/יָשַׁבְתָּ֥ בְ/עָרֵי/הֶ֖ם וּ/בְ/בָתֵּי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/001.yaml
  text: When Yahweh your God cuts off the nations whose land Yahweh your God is giving you[a], and you dispossess them and dwell in their cities and houses,
translation:
  language: zh_hans
  text: 当雅威你的上帝剪除[a]那些列国，把他们的土地赐给你；你赶逐他们，住在他们的城邑和房屋里时，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“除灭”或“消灭”；希伯来文的基本意象是“切断”。
    reason: 保留 יַכְרִית 的具体希伯来语意象，同时提示在本语境中可能采用的较解释性译法。
lexical_decisions:
- source_word: כִּי
  choice: 当……时
  rationale: 这里引出预期将发生的情形，并为下文的命令设定时间背景；译作“当……时”比假设性的“如果”更贴合语境。
- source_word: יַכְרִית
  choice: 剪除
  rationale: 使役形在此表示把列国除去。“剪除”保留希伯来语“切断、除掉”的具体意象和庄重语气，同时以脚注列出较解释性的译法。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来语四字神名 YHWH 的通行拟音译出其专名，不以称号替代。
- source_word: אֱלֹהֶיךָ
  choice: 你的上帝
  rationale: 准确表达第二人称阳性单数所属关系，并采用现代标准普通话中自然、庄重的说法。
- source_word: הַגּוֹיִם
  choice: 那些列国
  rationale: “列国”准确表达复数名词 גּוֹיִם，也符合申命记中以色列面对迦南诸民族的语境。
- source_word: נֹתֵן לְךָ אֶת־אַרְצָם
  choice: 把他们的土地赐给你
  rationale: 保留土地原属那些列国以及上帝将其赐给以色列的关系；“赐”适合神作为施予者的庄重语境。
- source_word: וִירִשְׁתָּם
  choice: 你也赶走他们
  rationale: 动词以列国为直接宾语，在此重点不是“继承他们”，而是夺取其地并使他们失去占有；“赶走”在中文中清楚表达这一语境义。
- source_word: וְיָשַׁבְתָּ
  choice: 住进
  rationale: 既表达居住，也自然呈现从赶走当地居民到进入其城邑定居的动作进程。
- source_word: בְעָרֵיהֶם וּבְבָתֵּיהֶם
  choice: 他们的城邑和房屋
  rationale: 保留两个名词的所属后缀；“城邑”兼具可懂性和律法叙事所需的庄重语体。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。译作“雅威”较接近 Yahweh 的拟音，并保留这是专名而非称号；不以“主”替换，也不采用源于 Jehovah 传统形式的“耶和华”。
- issue: 上帝赐地与以色列赶逐列国之间的关系
  choice: 并列保留“赐给”与“赶走”
  alternative: 把两者合并解释为单一行动
  rationale: 原文既陈述雅威赐地，也陈述以色列实际赶走列国；译文保留这两方面，不进一步解释其神学关系。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。句末保留逗号，因为本节是引出下一节命令的时间从句。用“城邑”维持律法文本的正式感，但整体句法保持自然。
