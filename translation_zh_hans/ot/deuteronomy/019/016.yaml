  verdict: revise
  source_fidelity: “若”恰当表达 כִּי 所引出的法律条件；“恶意的证人”能在司法语境中表达 עֵד חָמָס 的恶意、错误性质；“某人”适当地处理代表性阳性单数。可是“作证说他犯了悖逆的罪”将 לַעֲנוֹת בּוֹ סָרָה 处理得略显迂回，并把控告内容具体化为“犯了……罪”。原文更直接地说该证人起来针对某人，指证／控告他有 סָרָה。“悖逆的事”较贴近名词性控罪，也不预设其必为宗教叛教。
  naturalness: 原译“起来指控某人，作证说他犯了……”虽可理解，但“指控”与“作证说”功能重叠，且“悖逆的罪”在现代汉语中略显重复。改为“起来指控某人，说他行了悖逆的事”更流畅、庄重，并保留法律控诉的语气。
  terminology: 保留“恶意的证人”和“悖逆”。将脚注a的“暴行”调整为“暴力／不义”，更准确对应 חָמָס 的“暴力、暴行、不义、恶行”等语义范围；脚注b继续说明 סָרָה 可指背叛、严重偏离，可能涉及叛教，但经文本身未明说其对象。
