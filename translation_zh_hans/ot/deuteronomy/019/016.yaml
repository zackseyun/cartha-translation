base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/016.yaml
  text: If a malicious witness rises up against a man to testify against him of rebellion[b][a],
translation:
  language: zh_hans
  text: 若有恶意的证人起来指控某人，说他行了悖逆的事[a][b]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “恶意的证人”直译为“暴力（或不义）的证人”；在司法语境中，也可译作“作假证的证人”。
    reason: lexical_alternative
  - marker: b
    text: “悖逆的事”也可译作“背叛”或“严重的偏离”；本词有时可指叛教，但这里未明确限定为宗教意义。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 若
  rationale: 本节在法律条文中引入假设情形，用“若”自然准确。
- source_word: יָקוּם
  choice: 起来
  rationale: 保留קום“起来、站出来”的具体意象；在此指证人出面作证。
- source_word: עֵד חָמָס
  choice: 恶意的证人
  rationale: 该短语直译为“暴行／不义的证人”，在司法语境中指怀着害人意图作证的人；“恶意的证人”比单纯译作“假证人”更完整地保留其含义。
- source_word: בְּאִישׁ
  choice: 指控某人
  rationale: 介词ב在此标明证言所针对的对象；אִישׁ在个案式法律条文中可自然译为泛指的“某人”。
- source_word: לַעֲנוֹת בּוֹ
  choice: 作证说他
  rationale: ענה在司法语境中表示作证，בּוֹ指证言所针对的人；汉语用“作证说他……”衔接后面的控罪最自然。
- source_word: סָרָה
  choice: 犯了悖逆的罪
  rationale: סָרָה指偏离、背叛或悖逆；此处是被指控的严重罪行。译为“犯了悖逆的罪”既保留其力度，又不限定为宗教性的叛教。
theological_decisions:
- issue: סָרָה是否特指宗教叛教
  choice: 悖逆的罪
  alternative: 恶行；背叛；叛教
  rationale: 原词可指严重的偏离或反叛，但本节未明确限定为宗教叛教，因此采用较宽而仍具力度的“悖逆”，并在脚注保留其他可能。
- issue: 法律条文中的אִישׁ是否必须译出男性
  choice: 某人
  alternative: 一个男人
  rationale: 这里的阳性单数用于提出代表性的法律个案，焦点是受诬告者而非其性别；现代汉语以“某人”表达泛指更自然，也未改变适用范围。
translation_notes:
  register: 采用现代、庄重而易懂的法律叙述语体。“起来”保留希伯来文的动作意象；以“指控……作证说……”避免汉语中重复使用“控告”。脚注标记紧随相关控罪表达。
