- from: 若有恶意的证人起来指控某人，作证说他犯了悖逆的罪[a][b]，
  to: 若有恶意的证人起来指控某人，说他行了悖逆的事[a][b]，
  rationale: 修订仅改善中文法律句式并减少不必要的增释：保留条件句、恶意证人、受指控者和悖逆／偏离这一控罪的全部核心语义。脚注标记分别紧随其所说明的“恶意的证人”和“悖逆的事”。
