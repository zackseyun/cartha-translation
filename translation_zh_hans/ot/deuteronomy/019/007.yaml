  yaml_path: translation/ot/deuteronomy/019/007.yaml
  text: Therefore I am commanding you[a], saying, ‘You shall set apart three cities for yourself.’
translation:
  language: zh_hans
  text: 所以，我吩咐你说：“你要为自己划定三座城[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “划定”也可译作“分别出来”或“指定”。希伯来语动词可指使之分开、分别出来；在这里也含有指定这些城之意。
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: 所以
  rationale: 承接前文并引出结论；“所以”简洁自然，保留原文的推论关系。
- source_word: אָנֹכִי
  choice: 我
  rationale: 独立人称代词带有一定强调，但现代汉语用明确主语“我”已足以表达，不宜另加“亲自”而强化过度。
- source_word: מְצַוְּךָ
  choice: 吩咐你
  rationale: 分词形式表达当前所发出的命令；“吩咐你”符合申命记训令语体，也保留直接性。
- source_word: לֵאמֹר
  choice: 说
  rationale: 这是引出命令内容的引语公式；译作“说”既保留原文结构，也符合庄重的现代汉语。
- source_word: שָׁלֹשׁ עָרִים
  choice: 三座城
  rationale: 按现代汉语习惯为“城”加入量词“座”，意义直接明确。
- source_word: תַּבְדִּיל
  choice: 分别出
  rationale: בדל 的使役形式表示使之分开、划分出来；“分别出”保留其基本空间与功能上的划分含义，同时适合设立逃城的法律语境。
- source_word: לָךְ
  choice: 为自己
  rationale: 介词加第二人称阳性单数后缀表示为受命者自身的用途或益处；“为自己”比单译“为你”更清楚地反映这一形式。
theological_decisions:
- issue: 盟约律法中的第二人称阳性单数称呼
  choice: 译作单数“你”，不在正文中改成复数或集体称呼。
  alternative: 译作“你们”，以明确受命者是以色列全体；或改用无人称句式。
  rationale: 希伯来文在盟约训令中常以单数称呼作为整体的以色列。保留“你”可忠实呈现原文的修辞形式，又不必额外解释其集体指向。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语；保留原文“我吩咐你说”的法律训令结构，并用“分别出”维持字面动作与正式指定之间的语义张力。
