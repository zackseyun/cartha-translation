  text: לֹֽא יָקוּם֩ עֵ֨ד אֶחָ֜ד בְּ/אִ֗ישׁ לְ/כָל עָוֺן֙ וּ/לְ/כָל חַטָּ֔את בְּ/כָל חֵ֖טְא אֲשֶׁ֣ר יֶֽחֱטָ֑א עַל פִּ֣י שְׁנֵ֣י עֵדִ֗ים א֛וֹ עַל פִּ֥י שְׁלֹשָֽׁה עֵדִ֖ים יָק֥וּם דָּבָֽר־־־־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/015.yaml
  text: A single witness shall not stand against a man for any iniquity or for any sin[a], in connection with any sin that he commits[c][b]; on the testimony of two witnesses or on the testimony of three witnesses a matter shall stand.
translation:
  language: zh_hans
  text: 不可仅凭一个见证人的证言，认定一个人犯有任何罪孽或任何罪[a]，无论他犯何种罪；一件事总要凭两个或三个见证人的证言才得成立[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “罪孽”和“罪”对应两个不同的希伯来词；原文随后又以同词根结构说“无论他犯何种罪”，强调涵盖各种过犯。
    reason: lexical_alternative
  - marker: b
    text: “凭……的证言”字面意思是“按……的口”。原文前后两次使用同一个动词，字面可译为“站立得住”：一个见证人的证言不能成立，一件事须凭两三个见证人的证言才得成立。
    reason: lexical_alternative
lexical_decisions:
- source_word: יָקוּם ... יָקוּם
  choice: 定……有罪……才可成立
  rationale: קום在本节司法语境中指证言或案件具有法律效力。前半句按现代汉语法律表达译为“定……有罪”，后半句译为“成立”，清楚传达其语境意义；脚注说明希伯来文前后使用同一动词，以保留原文呼应。
- source_word: עֵד אֶחָד
  choice: 一个见证人
  rationale: 准确保留数量限制，表达单独一名见证人的证言不足以定案。
- source_word: בְּאִישׁ
  choice: 一个人
  rationale: אִישׁ为阳性单数，但在此法律条文中作代表性通称；现代汉语“一个人”自然、准确，不额外限定适用性别。
- source_word: לְכָל עָוֺן וּלְכָל חַטָּאת
  choice: 任何罪孽或任何罪
  rationale: 分别译出עָוֺן与חַטָּאת，保留原文累积并列的道德—法律语气，而不将两词合并。
- source_word: בְּכָל חֵטְא אֲשֶׁר יֶחֱטָא
  choice: 无论他犯了什么罪
  rationale: 以自然现代汉语表达原文强调范围周全的同根重复，同时保留第三人称阳性单数的句法指向。
- source_word: עַל פִּי
  choice: 凭……的证言
  rationale: 该短语字面为“按……的口”，在司法语境中意为以见证人的口头证言为依据；“凭……的证言”清楚且庄重。
- source_word: שְׁנֵי עֵדִים ... שְׁלֹשָׁה עֵדִים
  choice: 两个见证人或三个见证人
  rationale: 直接保留人数要求及平行结构。
- source_word: דָּבָר
  choice: 一件事
  rationale: דָּבָר在司法语境可指待裁定的事情或案件；“一件事”保留词义宽度，避免把原文过度限定为控罪或诉讼案。
theological_decisions:
- issue: אִישׁ的阳性代表性用法
  choice: 一个人
  alternative: 一个男人
  rationale: 希伯来文采用阳性单数法律代表形式，但条文原则并未明说仅适用于男性。汉语“一个人”既对应个体对象，也不把原文的语法性别扩张成神学或法律上的性别限制。
- issue: קום在司法语境中的法律效力
  choice: 前半译“定……有罪”，后半译“成立”，并以脚注交代同词呼应
  alternative: 前后均译“站立得住”
  rationale: 原文的重复具有修辞和法律平行作用，但汉语若两处都直译“站立”会显得生硬。正文优先清楚传达证言不足以定罪、案件须由多人证言确立的含义，脚注保留形式信息。
translation_notes:
  register: 采用现代、庄重而易懂的法律语体。“不可仅凭……就……”与“必须凭……才可成立”构成清晰对照。所有脚注标记均置于正文相关位置。
