  to: 免得无辜人的血流在耶和华你上帝赐给你作产业的土地境内；否则，你就要担当流血之罪。[a]
  rationale: 修订仅调整句间逻辑和空间表达，不改变经文意思。“否则，你就要”在中文中明确呈现本节所警告的后果，避免“以致”造成目的关系倒置。
