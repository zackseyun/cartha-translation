base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/010.yaml
  text: so that innocent blood may not be shed in the midst of your land that Yahweh your God is giving you as an inheritance[a], and bloodguilt would be upon you.
translation:
  language: zh_hans
  text: 免得无辜人的血流在耶和华你上帝赐给你作产业的土地境内；否则，你就要担当流血之罪。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“血归在你身上。”这是希伯来语惯用语，指要为流无辜人的血承担罪责。
    reason: 保留 וְהָיָה עָלֶיךָ דָּמִים 的较直译表达，并说明其法律性的“血罪／血债”含义。
lexical_decisions:
- source_word: יִשָּׁפֵךְ
  choice: 流
  rationale: 该词是שׁפך的尼法勒式，表示血“被倾流、被流出”；现代汉语以“血流”自然表达被动意义，也符合杀人律例的语境。
- source_word: דָּם נָקִי
  choice: 无辜人的血
  rationale: 这一法律—道德用语指不应被处死之人的血；译作“无辜人的血”比“无辜的血”更清楚地指向受害者，同时保留原文意象。
- source_word: בְּקֶרֶב אַרְצְךָ
  choice: 在……的土地上
  rationale: קֶרֶב本指“内部、当中”；在汉语中，此处译为“在土地上”更自然，并准确表达境内发生流血事件的空间意义。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 直接以现代简体中文读者熟悉的专名“耶和华”呈现四字神名，不以称号替代。
- source_word: נֹתֵן לְךָ נַחֲלָה
  choice: 赐给你作产业
  rationale: נֹתֵן在此具有正在赐予的未完成体意义，נַחֲלָה指承受所得的产业；“赐给你作产业”简洁保留圣约土地的表达。
- source_word: וְהָיָה עָלֶיךָ דָּמִים
  choice: 以致你担当流血之罪
  rationale: 复数דָּמִים在法律语境中可指因流无辜人之血而负的罪责；“担当……之罪”传达עַל所表达的责任落在当事人身上，同时脚注保留字面表达。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用四字神名而非称号。正文采用现代中文圣经传统中辨识度最高的专名“耶和华”，不译作“主”；“雅威”是另一种较贴近学术重构发音的音译。
- issue: וְהָיָה עָלֶיךָ דָּמִים所表达的责任
  choice: 担当流血之罪
  alternative: 血归到你身上
  rationale: 此法律惯用语表示无辜流血所带来的罪责由“你”承担。正文明确其责任含义，但用脚注保留希伯来语的血之意象及较直译说法。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“免得……以致……”呈现本节的目的与后果关系；“产业”保留申命记中承受土地的圣约语汇。
