    reason: 保留 וְהָיָה עָלֶיךָ דָּמִים 的较直译表达，并说明其法律性的“血罪／血债”含义。
  revision_rationale: 修订仅调整句间逻辑和空间表达，不改变经文意思。“否则，你就要”在中文中明确呈现本节所警告的后果，避免“以致”造成目的关系倒置。
