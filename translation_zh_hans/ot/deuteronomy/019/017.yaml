base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/017.yaml
  text: then the two men who have the dispute shall stand before Yahweh[b][a], before the priests and the judges who are in office in those days.
translation:
  language: zh_hans
  text: 那两个有争讼[a]的人，要站在雅威面前，也站在当时在任[b]的祭司和审判官面前。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “有争讼的”也可译作“有案件的”或“彼此争讼的”。
    reason: רִיב兼有争端、争讼和法律案件等含义。
  - marker: b
    text: 原文直译：“在那些日子（将）存在的”；这里按司法语境指当时任职的祭司和审判官。
    reason: 原文只说这些祭司和审判官“在那些日子”，正文“在任”是符合语境的表达。
lexical_decisions:
- source_word: וְעָמְדוּ
  choice: 要站在
  rationale: 连接词在此承接前面的法律程序；中文不必机械译出“并且”，以“要”表达法规中的程序要求。
- source_word: שְׁנֵי הָאֲנָשִׁים
  choice: 两个人
  rationale: 原文为阳性复数“两个男人”，但在此指争讼双方；“两个人”既自然，也避免把法律适用范围不必要地限定为男性。
- source_word: אֲשֶׁר לָהֶם הָרִיב
  choice: 有争讼的
  rationale: רִיב可指争端、争讼或案件；“有争讼的”较贴近原文“争讼属于他们”的结构，并保留一般争端与法律案件之间的语义张力。
- source_word: לִפְנֵי יְהוָה
  choice: 站在雅威面前
  rationale: לִפְנֵי直译为“在……面前”，在此具有来到上帝面前接受审理的司法与盟约含义；יהוה按其专名译作“雅威”。
- source_word: לִפְנֵי הַכֹּהֲנִים וְהַשֹּׁפְטִים
  choice: 也就是站在……祭司和审判官面前
  rationale: 原文再次使用“在……面前”。“也就是”自然表明，在雅威面前受审具体落实为来到祭司和审判官面前，而不把两者割裂为两个独立地点。
- source_word: אֲשֶׁר יִהְיוּ בַּיָּמִים הָהֵם
  choice: 当时在任的
  rationale: 原文直义是“那些日子将会在的”，在司法语境中指当时担任职务者；“当时在任”简洁自然，同时用脚注保留更贴字面的可能译法。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。译作“雅威”以专名形式呈现该盟约之名，不以称号代替，也不采用较晚形成的混合读音。
- issue: “在雅威面前”与祭司、审判官的关系
  choice: 以“也就是”连接
  alternative: 重复译为“在雅威面前，在祭司和审判官面前”
  rationale: 祭司和审判官执行审理，并不等于他们取代雅威；“也就是”表明这场司法程序被视为在雅威面前进行，同时不对其制度细节作超出经文的解释。
translation_notes:
  register: 采用现代、庄重而易懂的法律叙述语体。“审判官”比日常的“法官”更贴合古代以色列的职分称谓；句中保留“站在……面前”的正式司法表达。
