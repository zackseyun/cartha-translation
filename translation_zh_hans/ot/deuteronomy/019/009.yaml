  text: כִּֽי תִשְׁמֹר֩ אֶת כָּל הַ/מִּצְוָ֨ה הַ/זֹּ֜את לַ/עֲשֹׂתָ֗/הּ אֲשֶׁ֨ר אָנֹכִ֣י מְצַוְּ/ךָ֮ הַ/יּוֹם֒ לְ/אַהֲבָ֞ה אֶת יְהוָ֧ה אֱלֹהֶ֛י/ךָ וְ/לָ/לֶ֥כֶת בִּ/דְרָכָ֖י/ו כָּל הַ/יָּמִ֑ים וְ/יָסַפְתָּ֨ לְ/ךָ֥ עוֹד֙ שָׁלֹ֣שׁ עָרִ֔ים עַ֖ל הַ/שָּׁלֹ֥שׁ הָ/אֵֽלֶּה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/009.yaml
  text: if you keep all this commandment by doing it[a], which I am commanding you today—to love Yahweh your God and to walk in his ways all your days—then you shall add for yourself three more cities besides these three,
translation:
  language: zh_hans
  text: 如果你谨守、遵行我今天吩咐你的这一整条诫命[a]——爱耶和华你的上帝，并且一生行在他的道路上——就要在这三座城之外，再为自己增设三座城。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文“诫命”为单数，也可译作“这整个诫命”。
    reason: 说明原文单数形式及其整体性表达，避免读者将其误解为普通的复数“诫命”。
lexical_decisions:
- source_word: כִּי
  choice: 如果
  rationale: 此处引出增设逃城的条件；译作“如果”最符合上下文和句法。
- source_word: תִשְׁמֹר ... לַעֲשֹׂתָהּ
  choice: 谨守遵行
  rationale: שׁמר表示守住、遵守，后接“行它”；“谨守遵行”自然地保留守与行的紧密联系，又不额外加入程度副词。
- source_word: כָּל הַמִּצְוָה הַזֹּאת
  choice: 这一整条诫命
  rationale: 保留原文“诫命”的单数形式，并以“整条”表达כָּל的整体性。
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: 我今天吩咐你的
  rationale: 以现代汉语定语结构表达摩西当下发出的吩咐，简洁而忠实。
- source_word: לְאַהֲבָה אֶת יְהוָה אֱלֹהֶיךָ
  choice: 爱耶和华你的上帝
  rationale: 直接表达不定式的内容，并将神名יהוה音译为通行的中文形式“耶和华”。
- source_word: וְלָלֶכֶת בִּדְרָכָיו
  choice: 遵行他的道路
  rationale: 保留“道路”的盟约性比喻，同时用“遵行”使现代汉语读者清楚理解这是生活方式与行为。
- source_word: כָּל הַיָּמִים
  choice: 一生
  rationale: 原意为“所有的日子”，在第二人称语境中指终身；“一生”自然明确。
- source_word: וְיָסַפְתָּ לְךָ עוֹד שָׁלֹשׁ עָרִים
  choice: 再为自己增设三座城
  rationale: “增设”清楚表达在既有逃城之外另加城市；“为自己”保留לְךָ。
- source_word: עַל הַשָּׁלֹשׁ הָאֵלֶּה
  choice: 在这三座城之外
  rationale: 此处עַל具有追加之意；该译法自然表达在先前三城之外再增加。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用四字神名。中文圣经传统和普通读者最熟悉“耶和华”；它作为专名而非称号，也保留了原文使用神名这一点。
- issue: “诫命”的单复数
  choice: 这一整条诫命
  alternative: 这一切诫命
  rationale: 原文מִּצְוָה为单数，应保留其集合性或整体性表达，不将其无提示地改成复数。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“谨守遵行”保留申命记盟约语汇的郑重感；破折号标明“爱……遵行……”是这诫命的内容。
