  text: And the judges shall investigate thoroughly, and if the witness is a false witness and has testified falsely against his brother,
translation:
  language: zh_hans
  text: 审判官要仔细查究；若查明那见证人确实是作假见证的，曾诬告自己的弟兄，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְדָרְשׁוּ הַשֹּׁפְטִים הֵיטֵב
  choice: 审判官要仔细查究
  rationale: דָּרַשׁ在司法语境中指调查、查明，הֵיטֵב加强其彻底、审慎之意；“仔细查究”自然且保留正式语体。
- source_word: וְהִנֵּה
  choice: 若……果真
  rationale: 此处引出调查所得的事实，不宜机械译作“看哪”；“若……果真”兼顾条件语境与查明确证的语气。
- source_word: עֵד שֶׁקֶר
  choice: 作假见证的
  rationale: 指提供虚假证词的见证人；结合前面的“见证人”译为“作假见证的”，避免重复生硬。
- source_word: שֶׁקֶר עָנָה בְאָחִיו
  choice: 诬告了自己的弟兄
  rationale: עָנָה בְ在此指作证指控，שֶׁקֶר表明证词虚假；“诬告”准确传达虚假地作证攻击某人。אָחִיו直译为“自己的弟兄”，保留盟约共同体及亲属用语的色彩。
theological_decisions:
- issue: וְהִנֵּה的逻辑关系
  choice: 若……果真
  alternative: 看哪，那见证人是作假见证的
  rationale: 本节处于案件审查程序的条件句中，调查之后确认假证的情形；该译法不把“若”误解为纯粹不确定，也保留查明事实的强调。
- issue: אָחִיו的范围
  choice: 自己的弟兄
  alternative: 同胞／同族的人
  rationale: 保留原文亲属称谓及其共同体意味，不擅自将范围限定为血缘兄弟或泛化为任何人。
translation_notes:
