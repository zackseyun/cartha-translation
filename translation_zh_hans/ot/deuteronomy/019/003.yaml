base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/003.yaml
  text: You shall prepare the road for yourself[a], and you shall divide into three parts the territory of your land that Yahweh your God is giving you as an inheritance[b], so that every manslayer may flee there.
translation:
  language: zh_hans
  text: 你要为自己预备道路，并把耶和华—你的神赐给你作产业之地的疆域划分为三个区域，使凡杀人者[a]都可以逃到那里。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“凡致人死亡者”；这里的希伯来语在避难城的语境中范围比“谋杀犯”更广。
    reason: lexical_alternative
  - marker: b
    text: 直译：“这要作为逃往那里的用途（或安排）。”
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּכִין לְךָ הַדֶּרֶךְ
  choice: 你要为自己预备好道路
  rationale: תָּכִין是כון的使役形，在此表示使道路准备妥当；保留לְךָ“为自己”，并以“预备好道路”表达实际通行路线的整备。
- source_word: וְשִׁלַּשְׁתָּ
  choice: 划分为三个区域
  rationale: שלש的加强词干在这里指分成三部分；译文明确表达土地的三分安排，同时避免生硬的“使之成为三重”。
- source_word: גְּבוּל אַרְצְךָ
  choice: 你……之地的全境
  rationale: גְּבוּל在此不是单指边界线，而是指土地所涵盖的疆域；“全境”符合避难城地理布局的语境。
- source_word: יַנְחִילְךָ
  choice: 赐给你作产业
  rationale: נחל的使役形兼具赐予和承受产业之意；这一表达自然保留土地作为所赐产业的含义。
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: 耶和华你神
  rationale: 以现代中文圣经读者熟悉的“耶和华”音译四字神名，并保留原文的盟约称谓结构。
- source_word: וְהָיָה לָנוּס שָׁמָּה
  choice: 使……都可以逃到那里
  rationale: 原文是压缩的目的/用途结构，直译近于“使之可逃往那里”；中文用“使……可以”自然呈现其目的。
- source_word: כָּל רֹצֵחַ
  choice: 凡杀人者
  rationale: רֹצֵחַ在避难城法规中可包括误杀者，并不必然等同于蓄意谋杀犯；“杀人者”保留其较宽的法律范围。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。中文采用广为人知且庄重的专名“耶和华”，不以“主”取代神名；“雅威”也是可据学术重构采用的音译。
- issue: רֹצֵחַ是否预设蓄意谋杀
  choice: 杀人者
  alternative: 凶手／谋杀犯
  rationale: 本段随后区分误杀与怀恨杀人，因此本节不宜先把该词限缩为有谋杀罪责的人；“杀人者”保留法律上的开放性。
translation_notes:
  register: 采用现代、庄重而易懂的法规文体。“预备好道路”“划分为三个区域”清楚呈现实际安排；句法保留第二人称单数对以色列整体的吩咐。脚注标记置于其实际解释的词句之后。
