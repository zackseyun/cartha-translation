base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/013.yaml
  text: Your eye shall not pity him[a], but you shall purge the innocent blood from Israel[b], and it shall go well with you.
translation:
  language: zh_hans
  text: 你的眼不可顾惜他[a]；你要从以色列中除去无辜之血[b]，这样你就必得好处。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你不可怜惜他。”希伯来语直译提到“眼”，把眼视为怜悯或顾惜的所在。
    reason: lexical_alternative
  - marker: b
    text: 意思是：要从以色列共同体中除去因流无辜人之血而招致的血债。
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא תָחוֹס עֵינְךָ עָלָיו
  choice: 你的眼不可顾惜他
  rationale: 保留希伯来语以“眼”表达怜惜或宽免的惯用意象，也维持律法语境的庄重语气。“顾惜”兼有怜悯与不忍惩处之意。
- source_word: וּבִעַרְתָּ
  choice: 你要……除掉
  rationale: בער在《申命记》的法律语境中通常指从群体中清除罪恶或血债，并非字面上的焚烧。“除掉”在现代汉语中自然清楚。
- source_word: דַם הַנָּקִי
  choice: 无辜之血
  rationale: 直译保留希伯来法律用语及其张力：既可指无辜者所流的血，也在上下文中涉及这流血事件给群体带来的血债。
- source_word: מִיִּשְׂרָאֵל
  choice: 从以色列中
  rationale: מן表示从共同体中除去；“从以色列中”准确呈现其群体范围。
- source_word: וְטוֹב לָךְ
  choice: 你就必得福
  rationale: 这是《申命记》中常见的顺服带来美好结果的表达。“得福”自然凝练，体现结果意义而不把具体福分过度限定。
theological_decisions:
- issue: 对故意杀人者施行刑罚的性质
  choice: 译文呈现共同体依法不予宽免并清除血债的命令
  alternative: 把本节理解为准许个人报复
  rationale: 申命记19:11–12的上下文是长老与司法处置故意杀人者，并非私人复仇；正文不额外增添解释，但措辞保持这一法律与群体语境。
- issue: “无辜之血”的所指
  choice: 正文保留“无辜之血”的原文意象，脚注说明其也涉及群体所负的血债
  alternative: 正文直接意译为“流无辜人之血的罪责”
  rationale: 希伯来语本身以“血”表达，直接改成“罪责”会消除原文意象与一定程度的语义张力，因此采用直译并以脚注说明。
translation_notes:
  register: 采用现代、庄重而易懂的法律语体；保留“你的眼”和“无辜之血”两处希伯来语意象，并用脚注帮助普通读者理解。分号体现两项紧密相连的命令，“你就必得福”自然表达末句的结果关系。
