  yaml_path: translation/ot/deuteronomy/019/002.yaml
  text: You shall set apart three cities for yourself within your land that Yahweh your God is giving you to possess[a].
translation:
  language: zh_hans
  text: 你要在耶和华你的上帝赐给你作为产业[a]的土地境内，分别设立三座城。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“赐给你去占有的土地”。希伯来语动词在赐地语境中既可表示“承受为产业”，也可表示“取得、占有”。
    reason: 保留 לְרִשְׁתָּהּ 的词义幅度；锚点置于其所对应的“作为产业”之后。
lexical_decisions:
- source_word: שָׁלֹשׁ עָרִים
  choice: 三座城
  rationale: עִיר可指城或城镇；法律语境中译作“三座城”自然、庄重，也符合后文逃城的称呼。
- source_word: תַּבְדִּיל לָךְ
  choice: 你要……分别设立
  rationale: בדל的使役式表示分开、划出；结合设立逃城的法律语境，“分别设立”兼顾空间划分与正式指定。לָךְ所表达的受益关系在现代汉语中不必机械译成“为自己”，由主语和语境自然体现。
- source_word: בְּתוֹךְ אַרְצְךָ
  choice: 在……土地境内
  rationale: בְּתוֹךְ有“在其中、在内部”之意；“土地境内”既自然，又保留城市须设在所赐土地内部的空间含义。
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: 耶和华你上帝
  rationale: 以“耶和华”音译神名יהוה，并将אֱלֹהֶיךָ译为第二人称单数的“你上帝”，保留盟约式直接称呼。
- source_word: נֹתֵן לְךָ
  choice: 赐给你
  rationale: 分词表达正在进行或确定将发生的赐予；汉语“赐给你”在应许语境中自然，并体现上帝作为土地赐予者。
- source_word: לְרִשְׁתָּהּ
  choice: 作产业
  rationale: ירשׁ在赐地语境中兼有承受产业和取得占有之意。“作产业”自然表达土地由上帝赐予、由以色列承受的关系，同时以脚注保留“占有”的词义可能。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。简体中文圣经传统中“耶和华”是普通读者最熟悉的专名形式，避免用“主”这一称号替代原文神名；“雅威”是另一种较贴近现代学术重构读音的音译。
- issue: ירשׁ在赐地语境中的含义
  choice: 作产业
  alternative: 占有它
  rationale: 该动词可指承受产业，也可指取得并占有。正文采用符合上帝赐地语境的“作产业”，但不把征服、实际占有的语义可能排除，故列入脚注。
translation_notes:
  register: 采用现代、庄重而易懂的法律训令语体。“分别设立”对应正式划出并指定城市；调整修饰语次序，使“赐给你作产业的”清楚修饰“土地”，符合现代汉语表达。
