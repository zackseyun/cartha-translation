base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/015.yaml
  text: Even before they burned the fat[a], the priest’s servant would come and say to the man who was sacrificing, “Give meat for the priest to roast, for he will not take boiled meat from you, but only raw.”
translation:
  language: zh_hans
  text: 甚至在他们把脂油焚烧献上以前，祭司的仆役[a]就来，对献祭的人说：“把肉给祭司，让他烤；他不从你手里拿煮熟的肉，只要生肉。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“祭司的年轻人”或“祭司的侍从”。希伯来语 נַעַר 可指少年，也可指仆人或侍从；这里很可能指替祭司办事的下属。
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם בְּטֶרֶם
  choice: 甚至在……以前
  rationale: גַּם在这里加强语气，突出他们竟在应有的献祭步骤之前索取肉；“甚至在……以前”自然保留这种加重意味。
- source_word: יַקְטִרוּן אֶת־הַחֵלֶב
  choice: 把脂油焚烧献上
  rationale: 该短语指把祭牲的脂油烧成烟献上；加入“献上”可明确这是祭祀行为，而不只是普通焚烧。
- source_word: נַעַר הַכֹּהֵן
  choice: 祭司的仆役
  rationale: נַעַר可指少年、仆人或侍从；此处此人代表祭司办事，“仆役”最能表达其从属职能，同时以脚注保留词义范围。
- source_word: לָאִישׁ הַזֹּבֵחַ
  choice: 对献祭的人
  rationale: 以自然的现代汉语表达分词结构，指正在献祭的敬拜者。
- source_word: תְּנָה בָשָׂר לִצְלוֹת לַכֹּהֵן
  choice: 把肉给祭司烤
  rationale: 保留命令的直接语气，也保留肉是给祭司烤制这一目的；原文未明说“吃”，故正文不补入。
- source_word: וְלֹא יִקַּח מִמְּךָ
  choice: 他不要从你手里拿
  rationale: 这里表达祭司所声称的拒绝或惯常意愿；“不要”在直接引语中简洁自然，并保留从献祭者手中取肉的关系。
- source_word: בָשָׂר מְבֻשָּׁל
  choice: 煮熟的肉
  rationale: מְבֻשָּׁל特指经过水煮的肉，并非泛指一切熟肉；“煮熟的肉”准确保留与生肉的对比。
- source_word: כִּי אִם חָי
  choice: 只要生的
  rationale: 这是“不……只……”的排除性结构；汉语省略重复的“肉”自然清楚，并保持原文鲜明对比。
