  register: 采用现代、庄重而易懂的叙事语言。“焚烧献上”体现祭祀语境；命令句保持原文生硬、强索的口吻。脚注标记置于“仆役”之后，以对应实际存在词义差异的נַעַר，而非置于“脂油”之后。
