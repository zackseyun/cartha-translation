  text: וַ/יֵּ֧לֶךְ אֶלְקָנָ֛ה הָ/רָמָ֖תָ/ה עַל בֵּית֑/וֹ וְ/הַ/נַּ֗עַר הָיָ֤ה מְשָׁרֵת֙ אֶת יְהוָ֔ה אֶת פְּנֵ֖י עֵלִ֥י הַ/כֹּהֵֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/011.yaml
  text: Then Elkanah went to Ramah[a], to his house; and the boy was ministering to Yahweh before Eli the priest.
translation:
  language: zh_hans
  text: 随后，以利加拿往拉玛，回自己的家去了；那孩子却在祭司以利面前事奉雅威。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: 去了
  rationale: הלך在此以叙事形式推进情节，基本义是“去”；上下文虽可理解为回去，但动词本身并不明确表达“返回”。为使汉语自然，结合目的地表述为“回……去了”。
- source_word: הָרָמָתָה עַל־בֵּיתוֹ
  choice: 回拉玛自己的家
  rationale: 地点名后的方向词尾表示朝向拉玛；עַל־בֵּיתוֹ在此指回到自己的家中。汉语合并表达为“回拉玛自己的家”，避免生硬直译。
- source_word: וְהַנַּעַר
  choice: 那孩子却
  rationale: נַעַר涵盖孩子至青年；此处撒母耳尚年幼，译作“孩子”符合语境。连词在家人离去与孩子留下事奉之间形成轻微对照，故用“却”。
- source_word: הָיָה מְשָׁרֵת
  choice: 事奉
  rationale: היה加分词表示持续状态；汉语“事奉”在上下文中自然表达持续进行的圣所服事，无须机械添加“正在”。
- source_word: אֶת־יְהוָה
  choice: 事奉雅威
  rationale: אֵת标明שׁרת的宾语，即事奉的对象。以“雅威”音译四字神名，保留其专名性质。
- source_word: אֶת־פְּנֵי עֵלִי הַכֹּהֵן
  choice: 在祭司以利面前
  rationale: 短语字面涉及“以利的面/临在”，表示在以利面前或其在场之下；“在……面前”既贴近原文，也不把监督关系解释得过于确定。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用神的专名；“雅威”较贴近学界通常重建的读音，并保留其盟约专名性质。
- issue: “在祭司以利面前”的关系含义
  choice: 保留空间与关系上的开放性
  alternative: 在祭司以利的指导下
  rationale: 原文可暗示以利在场或监督，但没有明确使用表示“指导、管辖”的词，因此不将其收窄为单一的权属关系。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“随后”承接前文；“却”自然呈现以利加拿离去与撒母耳继续事奉之间的对照。保留“在……面前”的希伯来表达，不另加脚注，因为正文已可自然承载其真实歧义。
