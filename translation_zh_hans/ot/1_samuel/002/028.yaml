id: 1SA.2.28
reference: 1 Samuel 2:28
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וּ/בָחֹ֣ר אֹ֠ת/וֹ מִ/כָּל שִׁבְטֵ֨י יִשְׂרָאֵ֥ל לִ/י֙ לְ/כֹהֵ֔ן לַ/עֲל֣וֹת עַֽל מִזְבְּחִ֗/י לְ/הַקְטִ֥יר קְטֹ֛רֶת לָ/שֵׂ֥את אֵפ֖וֹד לְ/פָנָ֑/י וָֽ/אֶתְּנָ/ה֙ לְ/בֵ֣ית אָבִ֔י/ךָ אֶת כָּל אִשֵּׁ֖י בְּנֵ֥י יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/028.yaml
  text: And did I not choose him from all the tribes of Israel to be my priest[a], to go up to my altar, to burn incense, to wear an ephod before me? And I gave to your father's house all the food offerings of the sons of Israel.
translation:
  language: zh_hans
  text: 我不是从以色列众支派中拣选了他，叫他作我的祭司，登上我的祭坛，烧香，并在我面前穿着以弗得吗？我又把以色列子孙所献的一切火祭[a]赐给了你父家。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “火祭”指经火献上的祭物；也可译作“献作食物的祭物”。
    reason: 说明希伯来祭祀术语的范围，并保留其可译作祭坛食物供物的语义层面。
lexical_decisions:
- source_word: וּבָחֹר אֹתוֹ
  choice: 我不是……拣选了他吗
  rationale: 承接上下文的反问语气，将强调性的结构自然译为汉语反问，同时保留“他”所指的祭司祖先。
- source_word: מִכָּל שִׁבְטֵי יִשְׂרָאֵל
  choice: 从以色列众支派中
  rationale: 保留从全部支派之中选取的部分性含义；“众支派”符合现代庄重汉语。
- source_word: לִי לְכֹהֵן
  choice: 叫他作我的祭司
  rationale: 表达双重介词所含的目的和归属关系，清楚保留祭司职分是为上帝而设。
- source_word: לַעֲלוֹת עַל מִזְבְּחִי
  choice: 登上我的祭坛
  rationale: 贴近עלה的具体空间意象，不擅自将其释为某一种献祭动作。
- source_word: לְהַקְטִיר קְטֹרֶת
  choice: 烧香
  rationale: 采用简明、通行的礼仪用语，准确表达使香冒烟的祭司行动。
- source_word: לָשֵׂאת אֵפוֹד לְפָנָי
  choice: 在我面前穿着以弗得
  rationale: נשא本义为承担、携带，但与祭司服饰以弗得连用时可自然表示穿戴；“穿着”在现代汉语中清楚而不生硬。
- source_word: לְבֵית אָבִיךָ
  choice: 赐给了你父家
  rationale: “父家”保留希伯来语的宗族和祖系含义；“赐给”适合上帝施予祭司家族的语境。
- source_word: אֶת כָּל אִשֵּׁי בְּנֵי יִשְׂרָאֵל
  choice: 以色列子孙所献的一切火祭
  rationale: אִשֵּׁי泛指经火献上的祭物，并非仅指燔祭；“火祭”是准确、简洁且已有使用基础的祭祀术语。
theological_decisions:
- issue: 祭祀术语 אִשֵּׁי 的范围
  choice: 火祭
  alternative: 献作食物的祭物；经火献上的祭物
  rationale: 该词涵盖以火献上的祭物，不应窄化为“燔祭”。正文用“火祭”保持术语准确，脚注补明其具体含义。
- issue: בְּנֵי יִשְׂרָאֵל 的群体称谓
  choice: 以色列子孙
  alternative: 以色列人
  rationale: 保留原文“儿子/子孙”的形式及其圣约民族称谓色彩，同时“以色列子孙”在中文中自然可懂。
- issue: 祭司承担以弗得的动作
  choice: 穿着以弗得
  alternative: 佩带以弗得；担负以弗得
  rationale: 在祭司礼仪语境中，动作指向穿戴这件祭司服饰；译为“穿着”避免现代读者误以为只是用手携带，但不额外引入教义解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。反问句保留神谕责问的力度；祭祀词汇尽量准确，但避免不必要的古奥表达。
