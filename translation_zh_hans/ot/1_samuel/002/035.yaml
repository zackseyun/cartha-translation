  text: וַ/הֲקִימֹתִ֥י לִ/י֙ כֹּהֵ֣ן נֶאֱמָ֔ן כַּ/אֲשֶׁ֛ר בִּ/לְבָבִ֥/י וּ/בְ/נַפְשִׁ֖/י יַעֲשֶׂ֑ה וּ/בָנִ֤יתִי ל/וֹ֙ בַּ֣יִת נֶאֱמָ֔ן וְ/הִתְהַלֵּ֥ךְ לִ/פְנֵֽי מְשִׁיחִ֖/י כָּל הַ/יָּמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/035.yaml
  text: And I will raise up for myself a faithful priest[a], who will do according to what is in my heart and in my soul. And I will build for him a faithful house[b], and he will walk before my anointed all the days.
translation:
  language: zh_hans
  text: 我要为自己兴起一位忠信的祭司；他必照我心里和心意中所愿的去行。我要为他建立一个长存的家[a]；他必常在我的受膏者[b]面前行走。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “长存的家”也可译作“忠信的家”或“稳固的家”；这里的“家”指长久延续的家室、家族或世系。
    reason: 说明בַּיִת נֶאֱמָן的隐喻及词义选择。
  - marker: b
    text: “受膏者”也可译作“弥赛亚”；按本节语境，也可理解为“我的王”。
    reason: 保留מָשִׁיחַ的词义范围和所指张力。
lexical_decisions:
- source_word: וַהֲקִימֹתִי לִי
  choice: 我要为自己兴起
  rationale: 保留“使之兴起、使之站立任职”的意象，也凸显这是上帝亲自为自己所作的安排。
- source_word: כֹּהֵן נֶאֱמָן
  choice: 一位忠信的祭司
  rationale: “忠信”兼有可靠、忠诚之意，适合描述祭司在职分和品格上的可信。
- source_word: כַּאֲשֶׁר בִּלְבָבִי וּבְנַפְשִׁי יַעֲשֶׂה
  choice: 他必照我心中和意中所愿的去行
  rationale: 保留“心”与“נפש”并列所形成的强调，同时用现代汉语可理解的“意中所愿”表达上帝内在的旨意，不把两者完全合并。
- source_word: וּבָנִיתִי לוֹ בַּיִת נֶאֱמָן
  choice: 我要为他建立一个长存的家
  rationale: 这里的“家”指家室、家族或世系；נֶאֱמָן在此语境中很可能强调稳固持久。用“建立”配合“家”比直译“建造一个忠信的家”更自然，同时在脚注保留较形式对应的译法。
- source_word: וְהִתְהַלֵּךְ לִפְנֵי
  choice: 他必一直在……面前行事
  rationale: התהלך可指持续的行止或履职；“行事”保留广义，不把它限缩为“供职”或“侍奉”。
- source_word: מְשִׁיחִי
  choice: 我的受膏者
  rationale: 按词义译作“受膏者”，既符合当时君王语境，也不预先把所指限缩为后来的专称“弥赛亚”。
- source_word: כָּל־הַיָּמִים
  choice: 一直
  rationale: 该短语表示持续不断、历久不止；“一直”在现代汉语中自然，也避免把它误解为每天白昼期间。
theological_decisions:
- issue: “我的受膏者”的所指
  choice: 正文译作“我的受膏者”
  alternative: 我的弥赛亚；我的王
  rationale: 本节近期历史语境首先指向耶和华所膏立的统治者；原词也可在更广的经文脉络中产生弥赛亚意义。正文保留词义及所指的开放性，不强行限定。
- issue: “长存的家”的性质
  choice: 理解为稳固、延续的家室或世系
  alternative: 忠信的家；稳固的家
  rationale: “家”在此不仅是建筑物，也可指家族和世系。上下文涉及祭司职分的延续，因此正文表达持续性，同时脚注交代原文形容词也可译作“忠信”。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“兴起”“忠信”“受膏者”保留经文的职分与神学色彩；“行事”“一直”则避免不自然的逐字直译。脚注标记分别紧跟实际需要说明的“家”和“受膏者”，以免错置。
