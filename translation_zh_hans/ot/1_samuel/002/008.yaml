  rationale: 修订限于中文表达和使役关系的明确化：以“贫穷人／尊贵的人”改善现代汉语自然度；以“抬举”保存由低处升高的具象平行；加入第二个“使他们”，直接反映“使他们承受”的希伯来使役动词。保留“垃圾堆”、耶和华之名和“大地的支柱”的诗性意象；脚注锚点仍准确附于相应词组。
