  text: מֵקִ֨ים מֵ/עָפָ֜ר דָּ֗ל מֵֽ/אַשְׁפֹּת֙ יָרִ֣ים אֶבְי֔וֹן לְ/הוֹשִׁיב֙ עִם נְדִיבִ֔ים וְ/כִסֵּ֥א כָב֖וֹד יַנְחִלֵ֑/ם כִּ֤י לַֽ/יהוָה֙ מְצֻ֣קֵי אֶ֔רֶץ וַ/יָּ֥שֶׁת עֲלֵי/הֶ֖ם תֵּבֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/008.yaml
  text: He raises the poor from the dust[a]; he lifts the needy from the ash heap, to seat them with nobles and make them inherit a seat of honor. For the pillars of the earth belong to Yahweh[b], and on them he has set the world.
translation:
  language: zh_hans
  text: 他从尘土中扶起贫穷人，从垃圾堆中抬举穷乏人，使他们与尊贵的人同坐，使他们承受尊荣的座位[a]。因为大地的支柱[b]属于耶和华；他把世界安置在其上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“尊荣的宝座”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“大地的根基”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵקִים מֵעָפָר דָּל
  choice: 从尘土中扶起贫寒人
  rationale: “扶起”表达使低微者起来的使役含义，并保留“尘土”这一具体的卑微意象；“贫寒人”兼顾经济贫困和社会地位低下。
- source_word: מֵאַשְׁפֹּת יָרִים אֶבְיוֹן
  choice: 从垃圾堆中提拔穷乏人
  rationale: אַשְׁפֹּת指弃置废物之处，“垃圾堆”是现代汉语中清楚自然的表达；“提拔”与由低处升高的意象相合，“穷乏人”体现缺乏生活所需。
- source_word: לְהוֹשִׁיב עִם נְדִיבִים
  choice: 使他们与尊贵人同坐
  rationale: 保留目的或结果含义；נְדִיבִים在此指社会地位尊贵的人，“同坐”呈现地位逆转。
- source_word: וְכִסֵּא כָבוֹד יַנְחִלֵם
  choice: 承受荣耀的座位
  rationale: “承受”保留נחל使人得产业、得以继承的语义；כִּסֵּא既可指座位，也可指宝座，正文采用不额外限定王权含义的“座位”。
- source_word: מְצֻקֵי אֶרֶץ
  choice: 大地的支柱
  rationale: 保留希伯来诗歌中支撑大地的鲜明宇宙图景，而不在正文中将其抽象化。
- source_word: לַיהוָה
  choice: 属于耶和华
  rationale: 按希伯来文本直接呈现神名יהוה，并用现代中文圣经语境中通行的音译“耶和华”。
- source_word: וַיָּשֶׁת עֲלֵיהֶם תֵּבֵל
  choice: 他把世界安置在其上
  rationale: “安置”准确表达שׁית的放置、设立之意；“世界”自然对应有秩序的居住世界תֵּבֵל。
theological_decisions:
- issue: מְצֻקֵי אֶרֶץ的宇宙结构意象
  choice: 正文译作“大地的支柱”
  alternative: 大地的根基
  rationale: 原文采用具体的诗性图景说明耶和华对世界的主权。保留“支柱”更透明，也不必把诗歌语言处理成现代科学陈述。
- issue: כִסֵּא כָבוֹד所表达的身份提升
  choice: 正文译作“荣耀的座位”
  alternative: 荣耀的宝座
  rationale: כִּסֵּא可泛指座位，也可特指宝座。上下文说贫寒、穷乏者获得尊荣，未必专指人人登基为王，因此正文保留较宽泛的表达，并以脚注呈现王权意味更强的译法。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。两个平行分句分别用“扶起”和“提拔”，既保留诗歌对仗，又避免机械重复；末句保留古代希伯来诗歌的具体宇宙意象。脚注标记均放在其所说明的词组之后。
