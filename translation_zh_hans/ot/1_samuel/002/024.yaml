  text: אַ֖ל בָּנָ֑/י כִּ֠י לֽוֹא טוֹבָ֤ה הַ/שְּׁמֻעָה֙ אֲשֶׁ֣ר אָנֹכִ֣י שֹׁמֵ֔עַ מַעֲבִרִ֖ים עַם יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/024.yaml
  text: No[a], my sons; for the report that I hear is not good. You are making Yahweh’s people transgress.
translation:
  language: zh_hans
  text: “不行，我的儿子们！我所听见的消息不好。你们正使雅威的百姓犯罪。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或按希伯来文另一种理解译作：“不行，我的儿子们！我所听见、由雅威的百姓传扬的消息不好。”
    reason: 保留 מַעֲבִרִים עַם יְהוָה 的另一种句法和词义理解，即把该表达理解为雅威的百姓在传播这则消息。
lexical_decisions:
- source_word: אַל
  choice: 不行
  rationale: 此处是责备中的感叹式否定，并非带有明确动词的普通禁令；“不行”自然地表达以利强烈的不赞同。
- source_word: בָּנָי
  choice: 我的儿子们
  rationale: 直指以利的多个男性儿子；保留复数和亲属关系。
- source_word: כִּי
  choice: （由后句直接说明理由）
  rationale: 该词引出责备的理由。汉语分句衔接已自然表达因果关系，无须机械加入“因为”。
- source_word: לֹא טוֹבָה
  choice: 不好
  rationale: 贴近希伯来语的委婉评价，不强化为“恶劣”或“邪恶”。
- source_word: הַשְּׁמֻעָה
  choice: 传闻
  rationale: 指以利不断听到的有关儿子行为的消息；“传闻”既能表示流传的消息，又不必断定其只是未经证实的谣言。
- source_word: אֲשֶׁר אָנֹכִי שֹׁמֵעַ
  choice: 我听见的
  rationale: 简洁保留关系从句；结合“传闻”可自然表达持续听闻的语境。
- source_word: מַעֲבִרִים
  choice: 你们正使……犯罪
  rationale: 按使役义理解 עבר 的 Hiphil 分词，并以“正”体现分词所表达的持续行为；该词也可能与传播传闻有关，另见脚注。
- source_word: עַם יְהוָה
  choice: 雅威的百姓
  rationale: 自然呈现属格结构，并保留以色列之神的专名。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按其希伯来语专名的常见现代汉语音译处理，而不以称号“主”代替。
theological_decisions:
- issue: יהוה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文使用神的四字圣名，正文以现代汉语音译“雅威”保留其专名性质。
- issue: מַעֲבִרִים עַם יְהוָה 的句法和含义
  choice: 你们正使雅威的百姓犯罪
  alternative: 我听见雅威的百姓所传扬的传闻
  rationale: 正文采用使役义，符合上下文中以利责备儿子使百姓陷入违背圣约的行为；但希伯来语的句法和词义存在真实歧义，因此脚注保留“百姓传扬消息”的理解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“不行”保持责备的力度；“我的儿子们”虽略带郑重色彩，却清楚保留原文的亲属称呼和复数。短句结构贴近原文语势，同时避免生硬的逐词翻译。
