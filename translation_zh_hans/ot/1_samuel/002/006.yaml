reference: 1 Samuel 2:6
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: יְהוָ֖ה מֵמִ֣ית וּ/מְחַיֶּ֑ה מוֹרִ֥יד שְׁא֖וֹל וַ/יָּֽעַל׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/006.yaml
  text: Yahweh puts to death and makes alive[a]; he brings down to Sheol and raises up.
translation:
  language: zh_hans
  text: 雅威使人死，也使人活；他使人下到阴间[a]，也使人上来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “阴间”原文为“示奥”（Sheol），指死者所在之处；也可译作“坟墓”或“死人之境”，不应自动理解为“地狱”。
    reason: 说明שְׁאוֹל的语义范围，并避免将其与后来的狭义“地狱”概念等同。
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 采用神圣四字名的现代汉语音译，不以“主”这一称号替代其专名。
- source_word: מֵמִית
  choice: 使人死
  rationale: 该词是מות的使役式，译文保留其使役意义和神主动施行的语气；补出泛指宾语“人”，使现代汉语自然通顺。
- source_word: וּמְחַיֶּה
  choice: 也使人活
  rationale: 保留חיה在此的使役意义，并与“使人死”形成紧密的诗歌对偶；不进一步限定为复活或存留性命。
- source_word: מוֹרִיד
  choice: 使人下到
  rationale: 该词具有使役意义；“使人下到”既表达主动施行，也自然衔接目的地“阴间”。
- source_word: שְׁאוֹל
  choice: 阴间
  rationale: שְׁאוֹל指死者所在之处。“阴间”是简洁、可理解的汉语对应语，但其含义不应自动等同于最终刑罚之地，因此以脚注说明。
- source_word: וַיָּעַל
  choice: 也使人上来
  rationale: 与“使人下到”构成方向相反的诗歌对偶，并保留希伯来文宽泛的表达，不擅自明确为身体复活。
theological_decisions:
- issue: 是否把本节明确译成身体复活
  choice: 采用“使人活”和“使人上来”这类较宽泛的措辞
  alternative: 译作“使死人复活”或“使人从死里复活”
  rationale: 经文宣告雅威掌管死亡和阴间，但希伯来文的诗性措辞本身较为宽泛。译文不把它缩限为对身体复活的明确陈述，从而保留原文的神学张力。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语，并保留希伯来诗歌两组使役动词的平行结构：“使人死／使人活”和“使人下到／使人上来”。
