base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/014.yaml
  text: and he would thrust it into the basin[a], or the pot, or the kettle, or the cooking pan; all that the fork brought up, the priest would take with it[b]. Thus they did to all Israel who came there to Shiloh.
translation:
  language: zh_hans
  text: 他会把叉子插进盆、锅、釜或罐里[a]；凡是叉子叉上来的，祭司都用叉子取走[b]。他们就是这样对待所有来到示罗的以色列人的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文列出四种烹煮器皿；这些名称之间的确切区别难以确定。
    reason: cultural_note
  - marker: b
    text: 这里的“叉子”是取祭肉用的叉具；上一节说明它有三个齿。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִכָּה
  choice: 他把叉子插进
  rationale: 此处使役形描述把上一节所说的三齿叉刺入烹煮器皿的惯常动作；“插进”比笼统的“击打”更合语境。
- source_word: בַכִּיּוֹר א֣וֹ בַדּוּד א֤וֹ בַקַּלַּחַת֙ א֣וֹ בַפָּרוּר
  choice: 盆、锅、釜或罐里
  rationale: 原文列出四种器皿，但各词所指器形的准确区别并不确定；译文保留四项并采用通俗而有区别的容器名称。
- source_word: כֹּל אֲשֶׁר יַעֲלֶה הַמַּזְלֵג
  choice: 凡叉子叉上来的
  rationale: 表达叉子从器皿中带上来的肉；“叉上来”自然地保留了עלה的上升意象及器具的动作。
- source_word: הַמַּזְלֵג
  choice: 叉子
  rationale: 上下文已说明这是三齿器具；“叉子”清楚易懂，脚注补明它是祭肉用具。
- source_word: יִקַּח הַכֹּהֵן בּוֹ
  choice: 祭司都用它取走
  rationale: 保留单数“祭司”，并把בּוֹ理解为工具用法，即祭司用叉子取走叉中的肉。
- source_word: כָּכָה יַעֲשׂוּ
  choice: 他们……都是这样做的
  rationale: 保留原文由单数“祭司”转为复数“他们”的变化，并体现反复发生的惯常行为。
- source_word: לְכָל יִשְׂרָאֵל הַבָּאִים שָׁם בְּשִׁלֹה
  choice: 对所有来到示罗的以色列人
  rationale: 将“全以色列”按此处所指前来献祭的以色列民众自然表达，同时保留行为对象的广泛范围。
theological_decisions:
- issue: 总结句中的单复数转换
  choice: 行动句用单数“祭司”，总结句用复数“他们”
  alternative: 把两处统一译为单数，或将复数泛化处理
  rationale: 希伯来文有意从单数יִקַּח转为复数יַעֲשׂוּ；保留这一转换，不替叙事预先限定“他们”的具体范围。
- issue: בּוֹ的所指与功能
  choice: 译为“用它”，指用叉子取走
  alternative: 译为“从其中取走”或“为自己取走”
  rationale: 工具性解释最合紧邻的“叉子”和具体动作，但不在正文添加原文没有明说的“为自己”。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“盆、锅、釜、罐”保留原文列举的节奏和器皿多样性；用“都是这样做的”表达惯常行为，并保留单数到复数的转换。
