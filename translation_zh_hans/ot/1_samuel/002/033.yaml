  text: וְ/אִ֗ישׁ לֹֽא אַכְרִ֤ית לְ/ךָ֙ מֵ/עִ֣ם מִזְבְּחִ֔/י לְ/כַלּ֥וֹת אֶת עֵינֶ֖י/ךָ וְ/לַ/אֲדִ֣יב אֶת נַפְשֶׁ֑/ךָ וְ/כָל מַרְבִּ֥ית בֵּיתְ/ךָ֖ יָמ֥וּתוּ אֲנָשִֽׁים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/033.yaml
  text: But I will not cut off every man of yours from beside my altar[a], to make your eyes fail and your soul grieve; and all the increase of your house will die by the sword of men.
translation:
  language: zh_hans
  text: 但我不会把你家的人全都从我的祭坛旁剪除，为要使你眼目衰残、心灵忧伤；你家所有的后代都必在壮年死去。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译的形式近于“都必作为男子（成年人）死去”；此短语的确切含义不易确定，可能指他们在壮年死去。原文没有“刀剑”一词。
    reason: 说明句末希伯来语罕见短语的字面构造及其可能含义，并避免把原文未明说的暴力死亡加入正文。
lexical_decisions:
- source_word: וְאִישׁ לֹא אַכְרִית לְךָ מֵעִם מִזְבְּחִי
  choice: 但我不会把你的人全都从我的祭坛旁剪除
  rationale: 在否定句中，אִישׁ带有逐一、全称的意味，即不是把以利家的人一个不剩地剪除。“从我的祭坛旁”保留מֵעִם所表达的空间邻近感，也不把祭司职分的具体范围说得过满。
- source_word: לְכַלּוֹת אֶת עֵינֶיךָ
  choice: 为要使你眼目衰残
  rationale: 保留“眼目”这一希伯来意象；“衰残”表达כּלה在此处耗损、衰败的结果。
- source_word: וְלַאֲדִיב אֶת נַפְשֶׁךָ
  choice: 心灵忧伤
  rationale: 罕见动词表达使人痛苦、哀伤；נֶפֶשׁ在这里指人的内在生命和感受，用“心灵”比机械直译“灵魂”更符合现代汉语语境。
- source_word: וְכָל מַרְבִּית בֵּיתְךָ
  choice: 你家所有的后代
  rationale: מַרְבִּית本义为增多、繁衍所得；本句所指是家族中繁衍出来的成员，“后代”自然明确，同时保留家系延续的含义。
- source_word: יָמֻתוּ אֲנָשִׁים
  choice: 都必在壮年死去
  rationale: 字面结构为“作为男人／成年男子死去”，在审判语境中通常指未享高寿、尚在成年或壮年便死去；正文采用自然的语境义，脚注保留字面表达及其不确定性。
theological_decisions:
- issue: 以利家受审判是否意味着立刻被彻底剪除
  choice: 译为不会把以利家的人全都从祭坛旁剪除，留下有人继续承受并见证哀痛
  alternative: 将全家完全逐出祭坛事奉，或仅指有人肉身存活而与祭司职分无关
  rationale: 否定词与אִישׁ连用，最自然地表示并非每个人都被剪除；后面的目的语句又显示，留下来本身是持续审判的一部分。译文保留这种审判中仍有余留的张力，不进一步规定余留者的职分。
- issue: אֲנָשִׁים在句末的含义
  choice: 正文译为“在壮年死去”，脚注说明字面为“像男人一样死去”
  alternative: 像男人一样死去；死于人的刀下；如凡人一般死去
  rationale: 原文没有“刀剑”一词，因此不增译暴力死亡。“壮年”反映该短语在本处最可能表达的英年而逝，但用脚注保留其异常而简短的字面形式与解释空间。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“剪除”“祭坛”保留圣经语体；“眼目衰残、心灵忧伤”维持原文的平行结构。脚注标记置于所解释的句末短语之后。
