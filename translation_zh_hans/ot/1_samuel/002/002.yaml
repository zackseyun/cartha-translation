  text: אֵין קָד֥וֹשׁ כַּ/יהוָ֖ה כִּ֣י אֵ֣ין בִּלְתֶּ֑/ךָ וְ/אֵ֥ין צ֖וּר כֵּ/אלֹהֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/002.yaml
  text: There is none holy like Yahweh[a], for there is none besides you, and there is no rock like our God.
translation:
  language: zh_hans
  text: 没有谁像雅威[a]那样圣洁；因为除你以外，再无别者；也没有磐石像我们的上帝。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文：יהוה（YHWH），上帝的名字；本译作“雅威”。
    reason: 说明神名的原文形式与译法。
lexical_decisions:
- source_word: אֵין
  choice: 没有谁／再没有／没有
  rationale: 按各分句的汉语搭配灵活表达不存在之意，同时保留原文三次重复所形成的强调和平行结构。
- source_word: קָדוֹשׁ
  choice: 圣洁
  rationale: 准确表达分别、纯全及神圣独特性；“圣洁”也是现代汉语中自然且庄重的对应词。
- source_word: כַּיהוָה
  choice: 像雅威那样
  rationale: 前缀כ表示比较；יהוה按其专名音译为“雅威”。
- source_word: כִּי
  choice: ；
  rationale: 此处可表原因或强调。汉语诗句用分号并列展开，既让后句成为前句的根据，又避免把语义过度限定为单一逻辑关系。
- source_word: בִּלְתֶּךָ
  choice: 除你以外
  rationale: 保留排除含义和对上帝的第二人称直接称呼。
- source_word: צוּר
  choice: 磐石
  rationale: 保留原文关于坚固、稳定与庇护的具体隐喻，不缩减为解释性的“避难所”。
- source_word: כֵּאלֹהֵינוּ
  choice: 像我们的上帝
  rationale: כ表示比较；אֱלֹהִים在此指以色列的上帝，虽有复数形态，却按语境作单数理解。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华／上主
  rationale: 原文直接使用四字神名；正文以“雅威”音译，保留其作为专名的性质，不以称号替代。
- issue: “除你以外，再没有别的”的所指
  choice: 保留“别的”的省略表达
  alternative: 再没有别的神／再没有谁
  rationale: 原文בִּלְתֶּךָ没有明说被省略的名词。译文保留这一开放性，不擅自补成“别的神”或“别人”。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。三个否定分句保持递进和平行；用“磐石”保留原文意象。正文脚注标记与脚注完全对应。
