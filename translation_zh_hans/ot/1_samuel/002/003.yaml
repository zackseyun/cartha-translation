base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/003.yaml
  text: Do not keep speaking so very proudly; do not let arrogance come out of your mouth[a], for Yahweh is a God of knowledge, and by him actions are weighed.
translation:
  language: zh_hans
  text: '你们不要一再口出狂言，

    不要让傲慢的话从你们口中出来；

    因为雅威是有全备知识的上帝，

    人的行为由他衡量。[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 若严格按辅音文本读，也可译作：“人的行为并未被衡量。”正文采用传统诵读，意为雅威衡量人的行为。
    reason: textual_variant
lexical_decisions:
- source_word: אַל תַּרְבּוּ תְדַבְּרוּ
  choice: 不要一再口出
  rationale: רבה与后接的限定动词连用，表示动作反复或加剧；“一再”既保留持续、重复之意，也符合现代汉语表达。
- source_word: גְּבֹהָה גְבֹהָה
  choice: 狂言
  rationale: 原文以重复的“高傲”加强语气，指狂妄高傲的言语；结合“口出”译作“狂言”，简洁而有力度。
- source_word: יֵצֵא עָתָק מִפִּיכֶם
  choice: 不要让傲慢的话从你们口中出来
  rationale: עָתָק在此指狂妄、无礼的言语。汉语承接前句的禁令补出“不要让”，同时保留“从口中出来”的原文意象。
- source_word: אֵל דֵּעוֹת יְהוָה
  choice: 雅威是有全备知识的上帝
  rationale: דֵּעוֹת为“知识”的复数形式，在此表达知识的丰富与完全；“有全备知识”比直译“知识之神”更自然，也不把含义扩展为原文未明说的命题。
- source_word: וְלֹא/וְלוֹ נִתְכְּנוּ עֲלִלוֹת
  choice: 人的行为都由他衡量
  rationale: 正文采用传统诵读形式וְלוֹ（“由他／归于他”），并以被动句表达上帝是衡量行为的主体；“衡量”保留תכן所含称量、评定的意象。因辅音正文可读作否定句，另以脚注交代。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文使用四字神名；“雅威”按较通行的学术拟音直接呈现此名，同时避免以称号取代专名。
- issue: 末句וְלֹא/וְלוֹ נִתְכְּנוּ עֲלִלוֹת的文本与释义
  choice: 人的行为都由他衡量
  alternative: 人的行为并未被衡量
  rationale: 正文遵循传统诵读וְלוֹ，并保留“衡量”的比喻，表达雅威评定人的行为；辅音文本וְלֹא所形成的否定读法是真实的文本歧义，故不隐去，而在脚注中注明。
translation_notes:
  register: 采用现代、庄重且适合朗读的汉语诗体分行。“口出狂言”与“傲慢的话”形成平行而不机械重复；“全备知识”保留原文复数所强调的丰盛、完全。脚注标记[a]已置于相关末句之后。
