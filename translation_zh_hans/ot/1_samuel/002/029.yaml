base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/029.yaml
  text: Why do you scorn my sacrifice and my offering[a], which I commanded for the dwelling, and honor your sons above me, fattening yourselves from the first of every offering of Israel[c][b], my people?
translation:
  language: zh_hans
  text: 你们为什么践踏我的祭牲和供物[a]，就是我所吩咐要在居所中献上的[b]，而你却尊重你的儿子过于尊重我，好用以色列、我的民所献的一切供物中最上好的部分，把你们自己养肥呢[c]？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “践踏”所译的希伯来语动词直译为“踢”，在这里表示轻蔑对待或弃绝。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语此处表达紧缩，直译近于“就是我所吩咐的，居所”。“居所”可能指上帝的圣所；也可理解为“我为居所所吩咐的”。
    reason: alternative_reading
  - marker: c
    text: “最上好的部分”也可译为“最先的部分”。本句也可表述为“用以色列、我的民所献的一切供物中最好的部分，使你们自己肥壮”。
    reason: lexical_alternative
lexical_decisions:
- source_word: תִבְעֲטוּ
  choice: 践踏
  rationale: 原动词具体描绘“踢”，在这里表达轻蔑、拒斥。“践踏”在现代汉语中既保留肢体意象，也自然传达藐视之意；复数“你们”则保留希伯来文数的变化。
- source_word: זִבְחִי
  choice: 我的祭牲
  rationale: זֶבַח 指经宰杀献上的祭物。“祭牲”比泛称“祭物”更能体现其宰杀献祭的性质，又适合本段礼仪语境。
- source_word: מִנְחָתִי
  choice: 我的供物
  rationale: מִנְחָה 可专指素祭，也可泛指献上的礼物；此处与 זֶבַח 并列，采用较宽泛的“供物”，不把含义不必要地限定为谷物祭。
- source_word: אֲשֶׁר צִוִּיתִי מָעוֹן
  choice: 就是我吩咐要献在居所中的
  rationale: 原文表达紧缩，מָעוֹן 很可能指敬拜之所，即圣所。译文补出汉语所需的“要献在”，同时以脚注保留“居所”与前文关系的不确定性。
- source_word: וַתְּכַבֵּד ... מִמֶּנִּי
  choice: 你为什么尊重……过于尊重我
  rationale: כבד 在此表示给予尊荣；比较介词 מִן 表明以利把儿子置于上帝之上。重复“尊重”使汉语中的比较对象清楚。
- source_word: לְהַבְרִיאֲכֶם
  choice: 把你们自己养肥
  rationale: 此使役式在上下文中指借祭物吃得肥壮。“养肥”保留具体而带控诉性的形象，且复数“你们自己”对应原文。
- source_word: מֵרֵאשִׁית
  choice: 上好的部分
  rationale: רֵאשִׁית 本义为“起初、最先的部分”，在祭物语境中也可指首要、上好的部分。正文采用自然且符合本段罪状的“上好的部分”，脚注注明较形式对应的译法。
- source_word: כָּל מִנְחַת יִשְׂרָאֵל לְעַמִּי
  choice: 我民以色列所献的一切供物
  rationale: 将 לְעַמִּי 理解为对以色列的同位说明，并按现代汉语重排为“我民以色列”；“所献”明确供物与以色列的关系，而不改变指称。
theological_decisions:
- issue: 责备对象由复数转为单数又转回复数
  choice: 保留“你们为什么践踏……你为什么尊重……把你们自己养肥”的数变化
  alternative: 全句统一译为单数，完全以以利为责备对象；或全句统一译为复数，以以利家为整体
  rationale: 马所拉文本先用复数 תִבְעֲטוּ，继而以单数 וַתְּכַבֵּד 直接指向以利，随后又用复数 לְהַבְרִיאֲכֶם。保留这种转换，既呈现对祭司家整体的控诉，也不削弱对以利个人的责问。
- issue: 以利的罪是否包括亲自分享祭物所得
  choice: 译为“把你们自己养肥”，保留以利及其家从滥用祭物中获益的指控
  alternative: 仅译作“让你儿子们吃肥”，把获益者限于何弗尼和非尼哈
  rationale: 原文是第二人称复数反身形式“你们自己”，不宜把对象缩限为儿子，也不应进一步推断每个人参与的具体方式。
- issue: רֵאשִׁית 指最先部分还是最佳部分
  choice: 正文采用“上好的部分”
  alternative: 译为“最先献上的部分”或“初熟部分”
  rationale: 本段祭司夺取肉食的语境支持“首要、上好部分”的语义，但词本身仍可强调“最先的部分”，故在脚注中保留该可能，不将其解释成特定祭种。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“祭牲／供物”保留两类献物的区别；“践踏”“养肥”保留原文尖锐、具体的责备意象。刻意保留复数—单数—复数的人称数变化，并用脚注说明两个主要词义难点。
