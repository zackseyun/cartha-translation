  text: וּ/בְנֵ֥י עֵלִ֖י בְּנֵ֣י בְלִיָּ֑עַל לֹ֥א יָדְע֖וּ אֶת יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/012.yaml
  text: Eli’s sons were worthless men[b][a]; they did not know Yahweh.
translation:
  language: zh_hans
  text: 以利的儿子是卑劣之徒[a]；他们不认识耶和华[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译“无用之子”；传统也译“彼列之子”。
    reason: 说明希伯来习语及传统异译，避免读者将“卑劣之徒”误认为把“彼列”当作专名的译法。
  - marker: b
    text: “不认识”也可理解为“不承认”或“不把耶和华放在眼里”。
    reason: 交代 יָדַע 在此可能包含关系与敬重层面的含义，同时保留正文的原文表达。
lexical_decisions:
- source_word: וּ/בְנֵי עֵלִי
  choice: 以利的儿子
  rationale: בְנֵי是“儿子”的复数附属形式；וּ在此承接上下文，中文无需机械译出“并且”。人名עֵלִי按通行译名作“以利”。
- source_word: בְּנֵי בְלִיָּעַל
  choice: 无用之徒
  rationale: 该希伯来习语直译为“无用之子”，在此指卑劣、败坏之人。“无用之徒”保留其强烈贬义，又不把בְלִיָּעַל误作专名“彼列”。
- source_word: לֹא יָדְעוּ
  choice: 不认识
  rationale: יָדַע基本义为“知道、认识”，在这里也可能包含关系上的承认、敬重。“不认识”保留原文措辞及其神学张力。
- source_word: אֶת יְהוָה
  choice: 耶和华
  rationale: אֶת是直接宾语标记，不另译；יהוה采用现代中文圣经读者熟悉的传统译名“耶和华”。
theological_decisions:
- issue: בְלִיָּעַל在本节是普通名词性习语，还是专名“彼列”
  choice: 按普通名词性习语译为“无用之徒”
  alternative: “彼列之子”或直译“无用之子”
  rationale: 本处是在刻画以利儿子的卑劣品性，没有明确证据表明该词已经人格化为邪灵专名；避免把后期用法倒读进本节。
- issue: לֹא יָדְעוּ אֶת־יְהוָה是否应明确解释为“不承认／不敬重耶和华”
  choice: 正文保留“不认识耶和华”
  alternative: “不承认耶和华”或“不把耶和华放在眼里”
  rationale: “认识”既可保留字面认知层面，也容纳关系、顺服与承认方面的含义；不在正文中将这种张力缩窄为单一解释。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“无用之徒”具有清楚的道德贬义；分号对应两项紧密相连的陈述。脚注标记均置于相关表达之后。
