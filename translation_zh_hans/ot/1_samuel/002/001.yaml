source:
  edition: WLC
  text: וַ/תִּתְפַּלֵּ֤ל חַנָּה֙ וַ/תֹּאמַ֔ר עָלַ֤ץ לִבִּ/י֙ בַּֽ/יהוָ֔ה רָ֥מָה קַרְנִ֖/י בַּֽ/יהוָ֑ה רָ֤חַב פִּ/י֙ עַל א֣וֹיְבַ֔/י כִּ֥י שָׂמַ֖חְתִּי בִּ/ישׁוּעָתֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/001.yaml
  text: 'And Hannah prayed and said: “My heart exults in Yahweh[a]; my horn is lifted high in Yahweh. My mouth is opened wide against my enemies[c][b], because I rejoice in your salvation.”'
translation:
  language: zh_hans
  text: '哈拿祷告说：

    “我的心因雅威而欢欣；

    我的角因雅威高高扬起[a]。

    我向仇敌大大张口[b]，

    因为我因你的拯救而欢喜[c]。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “角”在希伯来诗歌中常象征力量、尊荣或地位；“角高高扬起”表示力量增强、尊荣提升。
    reason: cultural_note
  - marker: b
    text: 原文直译为“我的口向仇敌张大”，意思也可译作“我在仇敌面前夸胜”或“我敢于向仇敌放胆说话”。
    reason: lexical_alternative
  - marker: c
    text: “拯救”也可译作“救恩”；原词既可泛指救恩，也可指从困境中得到具体解救。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּתְפַּלֵּל
  choice: 祷告
  rationale: התפלל通常表示“祷告”。下文虽是诗体赞美，叙事动词仍明确将其界定为祷告。
- source_word: וַתֹּאמַר
  choice: 说
  rationale: 这是普通的“说”，原文没有使用“唱”的专门动词，因此不扩译为“歌唱”。
- source_word: עָלַץ לִבִּי
  choice: 我的心……欢欣
  rationale: עלץ表达强烈、昂扬的喜乐；“欢欣”既自然，也保留诗歌的高昂语气。
- source_word: בַּיהוָה
  choice: 因雅威而／因雅威
  rationale: 介词ב可表达喜乐与高举所处的范围、根据或缘由。现代汉语用“因雅威”较自然，同时不把关系过度限定为单一含义。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以“雅威”音译四字神名，保留原文所用的专名，而不以称号替代。
- source_word: רָמָה קַרְנִי
  choice: 我的角……高高扬起
  rationale: 保留“角”这一希伯来诗歌意象；רמה在此描述角被抬高、处于高位，象征力量、尊荣或地位提升。
- source_word: רָחַב פִּי עַל אֹיְבַי
  choice: 我向仇敌大大张口
  rationale: 原文直译为“我的口向／在仇敌之上张大”，表达得胜后放胆说话。正文保留身体意象，脚注说明其含义。
- source_word: כִּי
  choice: 因为
  rationale: 在这里引出哈拿欢欣和放胆开口的原因，因果关系清楚。
- source_word: שָׂמַחְתִּי
  choice: 我……欢喜
  rationale: 完成式在诗歌语境中可表达已经发生并延续至今的喜乐状态；汉语用“欢喜”自然流畅。
- source_word: בִּישׁוּעָתֶךָ
  choice: 因你的拯救
  rationale: ישועה既可泛指“救恩”，也可指从具体困境中获得“拯救”。此处“拯救”兼顾哈拿的具体经历和较广含义。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名。采用较贴近现代学界常见拟音的“雅威”，保留其专名性质，不以“主”等称号代替。
- issue: ישועה在本节中的范围
  choice: 拯救
  alternative: 救恩
  rationale: 本节既涉及哈拿从现实困境中蒙解救，也具有更宽广的神学回响。“拯救”首先保留具体处境，且不排除广义的救助与救恩。
translation_notes:
  register: 采用现代、庄重而可朗读的诗体汉语。保留“心、角、口”三个身体意象及原句的平行结构；对现代读者不易理解的“角”和“张口”以脚注说明，不在正文中解释性改写。
