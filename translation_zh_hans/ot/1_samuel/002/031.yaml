  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: הִנֵּה֙ יָמִ֣ים בָּאִ֔ים וְ/גָֽדַעְתִּי֙ אֶת זְרֹ֣עֲ/ךָ֔ וְ/אֶת זְרֹ֖עַ בֵּ֣ית אָבִ֑י/ךָ מִֽ/הְי֥וֹת זָקֵ֖ן בְּ/בֵיתֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/031.yaml
  text: Look[a], days are coming when I will cut off your strength and the strength of your father's house, so that there will not be an old man in your house.
translation:
  language: zh_hans
  text: “看哪，日子将到，我必剪除你的力量[a]和你父家的力量，使你家中不再有人活到老年。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “力量”原文直译为“膀臂”；“膀臂”在这里比喻力量或权势。本节两处相同。
    reason: 保留希伯来文的字面意象和词义选择。
lexical_decisions:
- source_word: הִנֵּה
  choice: 看哪
  rationale: 用于引出庄严的先知性宣告；“看哪”既保留指示和强调作用，也符合现代中文圣经语体。
- source_word: יָמִים בָּאִים
  choice: 日子将到
  rationale: 保留希伯来文常见的预告性审判公式及其面向未来的语气。
- source_word: גָדַעְתִּי
  choice: 我必剪除
  rationale: 该动词有砍断、截除之意；“剪除”在中文中既能表达彻底除去，也适用于力量和家系延续受到审判的语境。
- source_word: זְרֹעֲךָ
  choice: 你的力量
  rationale: 字面为“你的膀臂”，此处以膀臂比喻力量、权势或维系家族的能力；正文译出其语境意义，字面意象置于脚注。
- source_word: זְרֹעַ בֵּית אָבִיךָ
  choice: 你父家的力量
  rationale: 与前一处“膀臂”平行，指父系家族的力量与延续能力；“父家”保留希伯来亲属结构的表达。
- source_word: מֵהְיוֹת זָקֵן בְּבֵיתֶךָ
  choice: 使你家中不再有人活到老年
  rationale: 该不定式结构表达剪除所导致的结果；如此翻译自然地说明家中将无人达到高龄。
- source_word: זָקֵן
  choice: 活到老年
  rationale: 这里指年龄而非“长老”这一职分；用动词性表达可避免“老人”被理解为身份称谓。
theological_decisions:
- issue: 审判宣告中“膀臂”的比喻意义
  choice: 正文译为“力量”，并用脚注保留“膀臂”的字面意象
  alternative: 两处均直译为“膀臂”
  rationale: 希伯来文“膀臂”常象征力量或权能；本节后半句关于无人活到老年，表明审判涉及以利家族的能力和延续。译作“力量”传达语境中的主要含义，同时脚注避免遮蔽原文意象。
- issue: זָקֵן所指的是年龄还是职分
  choice: 理解为达到老年
  alternative: 理解为家族中不再有长老职分的人
  rationale: 上下文所宣告的是家族成员寿命与家系延续所受的审判，因此这里指高龄，而非宗教或群体职分。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“看哪”“我必”“父家”保留先知宣告和圣经叙事的庄严感；“不再有人活到老年”则以自然中文明确表达年龄含义，避免把זָקֵן误解为职分上的“长老”。
