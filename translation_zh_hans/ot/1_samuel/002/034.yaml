base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/034.yaml
  text: 'And this will be the sign to you that will come upon your two sons[b][a], Hophni and Phinehas: both of them will die on one day.'
translation:
  language: zh_hans
  text: 这要作给你的记号：必临到你两个儿子何弗尼和非尼哈身上的，就是他们二人必在同一天[b]死去[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“必发生在你两个儿子身上的事”。
    reason: lexical_alternative
  - marker: b
    text: 直译：“在一日”；意思是二人将在同一天死去。
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאוֹת
  choice: 兆头
  rationale: אוֹת在这里指用来证实先前审判宣告必会实现的征兆。“兆头”在现代汉语中自然、庄重，也保留了原词较宽泛的含义。
- source_word: אֲשֶׁר יָבֹא אֶל
  choice: 必临到……身上的事
  rationale: 直译为“将来到……那里”，语境中指某事将发生在二人身上。“临到……身上”保留希伯来语的动态意象，并符合汉语表达。
- source_word: שְׁנֵי בָנֶיךָ
  choice: 你两个儿子
  rationale: 准确保留数量和所属关系，表达直接自然。
- source_word: אֶל חָפְנִי וּפִינְחָס
  choice: 何弗尼和非尼哈
  rationale: 第二个אֶל具体说明前面的“两个儿子”是谁；汉语以同位结构直接列出姓名最自然。
- source_word: בְּיוֹם אֶחָד
  choice: 在同一天
  rationale: 原文直译为“在一天”，结合复数主语和“他们二人”，指二人在同一个日子死亡。“同一天”以自然汉语清楚传达这种时间上的共同性，脚注保留直译形式。
- source_word: יָמוּתוּ שְׁנֵיהֶם
  choice: 他们二人必……死去
  rationale: 保留שְׁנֵיהֶם对两人无一例外的强调；“必”体现未完成式在预言语境中的确定将来意义。
theological_decisions:
- issue: “兆头”的性质
  choice: 作为证实对以利家审判之宣告的征兆
  alternative: 仅指不具证实作用的预兆
  rationale: 上下文表明，两个儿子同日死亡将证实先前的审判宣告；正文仍采用含义较宽的“兆头”，不将其进一步解释为某种特定神学类别。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“也就是”使较长的希伯来语关系从句在汉语中层次清楚；人名沿用《撒母耳记》中通行的简体中文译名。
