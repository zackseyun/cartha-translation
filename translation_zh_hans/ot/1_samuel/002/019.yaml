base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/019.yaml
  text: And his mother would make for him a small robe and bring it up to him from year to year[b][a], when she went up with her husband to offer the yearly sacrifice.
translation:
  language: zh_hans
  text: 他母亲每年[b]都为他做一件小外袍[a]；她随丈夫上去献上一年一度的祭时，就把它带上去给他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “外袍”也可译作“袍子”或“斗篷”。希伯来语指穿在外面的袍服。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语直译为“从日子到日子”，是表示按年定期发生的习语；本句以“每年”表达。
    reason: lexical_alternative
lexical_decisions:
- source_word: מְעִיל
  choice: 外袍
  rationale: 该词指穿在外面的袍服；“外袍”既保留服装类别，也适合本节圣所语境，且比“斗篷”更贴近袍服形制。
- source_word: קָטֹן
  choice: 小
  rationale: 修饰衣袍，表明这是按孩童身量做成的小衣袍；现代汉语用“小”自然简明。
- source_word: תַּעֲשֶׂה
  choice: 每年都为他做
  rationale: 未完成式在叙事中表达过去反复进行的惯常行为；结合后面的年度用语，以“每年都”清楚传达其反复性。
- source_word: וְהַעַלְתָה לּוֹ
  choice: 就把衣袍带上去给他
  rationale: עלה保留前往圣所的“上去”意象；补出“衣袍”以避免汉语代词指向含混。
- source_word: מִיָּמִים יָמִימָה
  choice: 每年
  rationale: 希伯来语字面为“从日子到日子”，在此是按年定期发生的习语；“每年”最自然准确。
- source_word: בַּעֲלוֹתָהּ
  choice: 她……上去时
  rationale: 介词加不定词结构表达时间；“上去”保留前往圣所朝拜的行程意象。
- source_word: אִישָׁהּ
  choice: 丈夫
  rationale: 在婚姻关系语境中，带所属后缀的אִישׁ明确指她的丈夫。
- source_word: לִזְבֹּחַ
  choice: 献
  rationale: 该动词指宰杀并献祭；与“祭”搭配时，“献”是自然且能表达礼仪行动的现代汉语。
- source_word: זֶבַח הַיָּמִים
  choice: 年祭
  rationale: 指按年举行的祭献。“年祭”简洁保留年度性；脚注说明也可译为“每年所献的祭”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“每年都……；……时，就……”自然呈现母亲按年反复为撒母耳做衣并带到圣所的行动；“上去”保留希伯来语朝圣行程的空间与礼仪色彩。
