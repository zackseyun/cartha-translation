  to: 他母亲每年[b]都为他做一件小外袍[a]；她随丈夫上去献上一年一度的祭时，就把它带上去给他。
  rationale: 修订仅提升现代汉语的清晰度并校正脚注锚点：“一年一度的祭”明确对应年度祭献；“随丈夫”自然表达同行关系；“它”明确指小外袍。原文的惯常动作、上行至圣所的意象及年度频率均予保留。
