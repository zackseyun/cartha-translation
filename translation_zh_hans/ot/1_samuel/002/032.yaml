  text: וְ/הִבַּטְתָּ֙ צַ֣ר מָע֔וֹן בְּ/כֹ֥ל אֲשֶׁר יֵיטִ֖יב אֶת יִשְׂרָאֵ֑ל וְ/לֹֽא יִהְיֶ֥ה זָקֵ֛ן בְּ/בֵיתְ/ךָ֖ כָּל הַ/יָּמִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/032.yaml
  text: You will look on the distress of the dwelling in all the good that he does for Israel[a], and there will not be an old man in your house all the days.
translation:
  language: zh_hans
  text: 你必看见居所的困苦[a]，在一切使以色列蒙福的事上；你的家中必永不再有人活到老年。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本句希伯来文含义很难确定。也可译作：“你必看见居所中有敌手”“你必看见圣所遭难”，或类似意思。“使以色列蒙福”的施事者在希伯来文中未明说。
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִבַּטְתָּ
  choice: 你必看见
  rationale: 使役词干在这里表示“观看、看见”；译文保留预告审判的直接语气，不额外加入“嫉妒”等情绪含义。
- source_word: צַר מָעוֹן
  choice: 居所遭受困苦
  rationale: צַר可指“困苦”或“敌手”，מָעוֹן意为“居所”，在本段语境中可能暗指圣所。正文采用较通顺而仍相对贴近字面的表达，并以脚注保留原文的多种可能。
- source_word: בְּכֹל אֲשֶׁר יֵיטִיב אֶת־יִשְׂרָאֵל
  choice: 尽管上帝使以色列得享各样福乐
  rationale: 介词ב在此关系含混，可表达处境或伴随关系；结合审判与以色列蒙福之间的对照，译作“尽管”较自然。原文未明说动词主语，但语境最自然地指上帝，中文为清楚起见予以明示。
- source_word: זָקֵן
  choice: 活到老年
  rationale: 这里不是指担任职分的“长老”，而是指年老之人；用“活到老年”自然表达以利家中男子不得长寿的审判。
- source_word: בְּבֵיתְךָ
  choice: 你的家中
  rationale: “家”既可指家庭，也可指家系；中文“你的家中”保留这种家族性的涵义。
- source_word: כָּל הַיָּמִים
  choice: 永远
  rationale: 该习语直译为“所有的日子”，在此表示持续不断；现代中文以“永远”表达较自然，但不将其扩展为超出语境的形而上永恒。
theological_decisions:
- issue: צַר מָעוֹן这一困难短语的解释
  choice: 居所遭受困苦
  alternative: 居所中有敌手；圣所遭难；看见居所的困苦
  rationale: 原文语法和词义均有歧义。正文不把它确定解释为某个具体敌人，也不径直把מָעוֹן限定为“圣所”；脚注明确保留主要可能读法。
- issue: “使以色列得福”的主语
  choice: 在正文中明示为上帝
  alternative: 保留无明确主语的“使以色列得福”
  rationale: 希伯来文动词为第三人称阳性单数，主语未明说；上下文最自然指上帝。中文若完全省略主语会显得突兀，因此明示上帝，但不据此增添进一步神学解释。
translation_notes:
  register: 采用庄重而现代的标准普通话。“居所”保留原文较宽泛的空间称谓；“困苦”避免过早锁定为具体敌手。正文适度调整句法以符合现代中文，并用脚注公开原文的不确定性。
