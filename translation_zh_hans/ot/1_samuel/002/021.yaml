base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/021.yaml
  text: For Yahweh visited Hannah[a], and she conceived and bore three sons and two daughters[b]. And the boy Samuel grew before Yahweh.
translation:
  language: zh_hans
  text: 因为雅威眷顾了哈拿[a]，她就怀孕，生了三个儿子和两个女儿。童子撒母耳与雅威同在，渐渐长大[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “眷顾”也可译作“看顾”或“关怀”。这里的希伯来语动词可指上帝留意某人，并为其施恩介入。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“与雅威一起”。按上下文，这可能是说撒母耳在圣所中、雅威临在之处渐渐长大；也可译作“在雅威面前渐渐长大”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文并说明缘由，保留原词的解释或因果作用。
- source_word: פָקַד
  choice: 眷顾
  rationale: 此处指雅威留意哈拿并施恩介入，使她得以怀孕；“眷顾”既自然，又保留恩慈关注与实际行动两层含义。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，保留其作为以色列上帝专名的性质，而不以称号代替。
- source_word: וַתַּהַר וַתֵּלֶד
  choice: 她就怀孕，生了
  rationale: 直接呈现怀孕与生产的叙事顺序；“就”自然表达希伯来叙事中连续动作及其与前句的联系。
- source_word: שְׁלֹשָׁה בָנִים וּשְׁתֵּי בָנוֹת
  choice: 三个儿子和两个女儿
  rationale: 按原文准确直译人数与亲属称谓。
- source_word: הַנַּעַר שְׁמוּאֵל
  choice: 童子撒母耳
  rationale: “童子”简洁、庄重，既表明撒母耳年幼，也保留原文名词与人名并置的结构。
- source_word: וַיִּגְדַּל
  choice: 渐渐长大
  rationale: 在人物成长的语境中表示持续成长；“渐渐”使现代汉语叙述自然。
- source_word: עִם יְהוָה
  choice: 与雅威同在
  rationale: 较直接保留介词 עִם“与……一起”的表达及其关系性含义，不在正文中完全改写为地点性的“在圣所中”或惯用的“在……面前”。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华／主
  rationale: 原文使用上帝的专名；音译“雅威”可避免用称号取代专名，也不采用较晚形成的混合读音。
- issue: עִם יְהוָה 所表达的关系
  choice: 与雅威同在
  alternative: 在雅威面前／在雅威的居所中
  rationale: 原文直译为“与雅威一起”。上下文可能指撒母耳在圣所、雅威临在之处成长，但正文保留这一不寻常表达，不将其过早限定为纯粹的地点或礼仪含义；脚注说明语境上的可能理解。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“眷顾”保留圣经语境中的恩慈介入意味；“与雅威同在”有意保留希伯来原文的关系性和一定歧义，并用脚注交代圣所语境。
