source:
  edition: WLC
  text: רַגְלֵ֤י חסיד/ו יִשְׁמֹ֔ר וּ/רְשָׁעִ֖ים בַּ/חֹ֣שֶׁךְ יִדָּ֑מּוּ כִּֽי לֹ֥א בְ/כֹ֖חַ יִגְבַּר אִֽישׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/009.yaml
  text: He guards the feet of his faithful ones[a], but the wicked are silenced in darkness[c][b], for not by strength does a man prevail.
translation:
  language: zh_hans
  text: 他守护忠于他的人的脚步[a]；恶人却在黑暗中归于沉寂[b]，因为人[c]不能靠力量得胜。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文本传统也可按单数读作“忠于他的那人”；正文采用集体／复数意义，因为这更符合诗歌对句及可能的原意。
    reason: textual_variant
  - marker: b
    text: 或译“静默”或“被止息”；希伯来语动词可表示沉默或静止。
    reason: lexical_alternative
  - marker: c
    text: 原文为阳性单数，在这里作泛指。
    reason: lexical_alternative
lexical_decisions:
- source_word: רַגְלֵי
  choice: 脚步
  rationale: 原词直译为“脚”，这里以“脚步”保留具体的行走意象，同时使现代汉语表达自然。
- source_word: חסידו
  choice: 忠于他的人
  rationale: חסיד 表示忠信、忠诚之人；此译传达对上帝的忠贞，避免“圣徒”等可能带有后期宗教专门含义的称呼。正文按集体／复数意义理解，异文情况收入脚注。
- source_word: יִשְׁמֹר
  choice: 守护
  rationale: 表达看守、保全和保护之意，也适合“守护脚步”这一诗歌意象。
- source_word: וּרְשָׁעִים
  choice: 恶人却
  rationale: 连词在上下文中构成忠信者与恶人的对比，故译为带转折意味的“却”。
- source_word: בַּחֹשֶׁךְ
  choice: 在黑暗中
  rationale: 直接保留原文的黑暗意象及其审判语境。
- source_word: יִדָּמּוּ
  choice: 归于沉寂
  rationale: 该动词可指沉默或静止；“归于沉寂”既保留词义范围，也传达在审判下被止息的意味，而不把歧义过度限定。
- source_word: כִּי
  choice: 因为
  rationale: 引出前述对比成立的根据，现代汉语中“因为”清楚自然。
- source_word: לֹא בְכֹחַ
  choice: 不能靠力量
  rationale: 保留否定及凭借力量的语义关系；按汉语句法与后面的“得胜”连用。
- source_word: יִגְבַּר
  choice: 得胜
  rationale: 此动词在这里不只是拥有力量，而是凭强力占优势或取胜；“得胜”准确表达结果含义。
- source_word: אִישׁ
  choice: 人
  rationale: 原文虽为阳性单数，却在格言式陈述中泛指人；现代汉语“人”自然保留这种普遍指称，无须另加性别限定。
theological_decisions:
- issue: חסידו 的数与所指
  choice: 正文采用集体／复数意义：“忠于他的人”
  alternative: 单数：“忠于他的那人”
  rationale: 马所拉文本传统在此存在单复数读法问题；复数／集体理解与后半句复数的“恶人”形成较自然的诗歌对举，也有古代文本见证支持。脚注保留单数读法，避免掩盖文本差异。
- issue: אִישׁ 的泛指功能
  choice: 译为泛指的“人”
  alternative: 译为带显性性别的“男人”或单称的“一个人”
  rationale: 希伯来语使用阳性单数作代表性、格言性的泛指。现代汉语“人”既忠实表达普遍范围，也不会误导读者以为本句只论男性。
- issue: יִדָּמּוּ 所表达的审判方式
  choice: 译为“归于沉寂”
  alternative: “静默”或“被剪除”
  rationale: 原词可以表达沉默或止息。正文不明确断定具体是死亡、毁灭还是失声，从而保留诗句本身的张力；其他可能译法列于脚注。
translation_notes:
  register: 采用现代、庄重而易懂的汉语。以分号呈现诗句中忠信者与恶人的鲜明对比；“脚步”“黑暗”“力量”等核心意象均予保留。
