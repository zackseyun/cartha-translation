  text: וּ/שְׁמוּאֵ֕ל מְשָׁרֵ֖ת אֶת פְּנֵ֣י יְהוָ֑ה נַ֕עַר חָג֖וּר אֵפ֥וֹד בָּֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/018.yaml
  text: Samuel was ministering before Yahweh[a], a boy clothed with a linen ephod.
translation:
  language: zh_hans
  text: 撒母耳在雅威[a]面前侍奉。他还是个孩子，腰间束着一件亚麻布制的以弗得。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“在雅威的面前”，也可理解为“在雅威的同在中”。
    reason: 说明原文פְּנֵי的字面形象及其惯用含义。
lexical_decisions:
- source_word: וּשְׁמוּאֵל
  choice: 撒母耳
  rationale: וְ在此连接上下文；现代汉语无需机械译作“并且”，省译可保持自然的叙事衔接。人名按通行译名译为“撒母耳”。
- source_word: מְשָׁרֵת
  choice: 供职
  rationale: 该分词表示持续进行的服事；“供职”既保留持续、正式服事的含义，也适合圣所语境，而不额外断定具体祭司职分。
- source_word: אֶת־פְּנֵי יְהוָה
  choice: 在雅威面前
  rationale: פְּנֵי在这一惯用语中有“面前、同在中”之意；正文采用自然而贴近原文的“在雅威面前”，并以脚注提示其字面形象及语义范围。
- source_word: נַעַר
  choice: 他还是个孩子
  rationale: נַעַר在此突出撒母耳年幼；“孩子”是现代汉语中自然且不过度限定确切年龄的表达。“还是”体现此处对其年幼状态的强调，但不赋予特定年龄。
- source_word: חָגוּר
  choice: 腰间束着
  rationale: 该被动分词本义为“被束上、束着”；“腰间束着”保留衣物系束于身的具体形象，比笼统的“穿着”更贴近原文。
- source_word: אֵפוֹד
  choice: 以弗得
  rationale: 这是以色列礼仪服饰的专名，没有完全对应的普通汉语词；采用通行音译，避免将其过度解释为某一种现代衣物。
- source_word: בָּד
  choice: 细麻布
  rationale: בָּד在祭司服饰语境中指麻布料；“细麻布”符合传统中文圣经用语，也清楚指出材质，但不额外添加装饰或品质细节。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较贴近学界通常重建的读音，并将其作为专名呈现，而不是以称号替代。
- issue: 撒母耳的“供职”是否表示祭司身份
  choice: 保留为“供职”，不明确称他为祭司
  alternative: 任祭司职分
  rationale: מְשָׁרֵת表明他在雅威面前服事，但本节本身没有直接授予他祭司头衔；译文保留这一界限，避免作神学上的过度判定。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。将希伯来文的两个分词分别译为“供职”和“束着”，保留持续状态；分成两句，使“他还是个孩子”作为补充说明自然清楚，同时不加入原文没有明说的转折或祭司身份。
