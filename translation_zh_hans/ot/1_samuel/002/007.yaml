  text: יְהוָ֖ה מוֹרִ֣ישׁ וּ/מַעֲשִׁ֑יר מַשְׁפִּ֖יל אַף מְרוֹמֵֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/007.yaml
  text: Yahweh makes poor and makes rich[b][a]; he brings low and also lifts up.
translation:
  language: zh_hans
  text: 雅威使人贫穷[a]，使人富足；他使人降卑，也使人升高[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“使人失去产业”。这个希伯来语动词也可包含使人遭受损失或被剥夺的意思。
    reason: lexical_alternative
  - marker: b
    text: 或译“使人尊贵”或“把人高举”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 采用神圣名字的音译，而不以“主”这一称号替代；“雅威”比传统的“耶和华”更贴近通常重构的希伯来语读音。
- source_word: מוֹרִישׁ
  choice: 使人贫穷
  rationale: 该使役形动词在此与“使人富足”构成诗歌中的反义平行，语境主要指使人陷入贫穷；脚注保留其“使人失去产业、遭受损失”等较宽泛的可能含义。
- source_word: וּמַעֲשִׁיר
  choice: 也使人富足
  rationale: 准确表达使役意义，并与“使人贫穷”形成自然、对称的现代汉语表达。
- source_word: מַשְׁפִּיל
  choice: 使人降卑
  rationale: 保留“使之降低”的垂直意象，同时涵盖地位被降低或受屈辱的含义，并与后句“升高”相对。
- source_word: אַף
  choice: 也
  rationale: 表达附加和强调作用，使上下两个动作自然衔接，不过度强化为“甚至”。
- source_word: מְרוֹמֵם
  choice: 使人升高
  rationale: 保留与“降卑”相对的垂直意象，也可涵盖提高地位、使人尊贵的意义。
theological_decisions:
- issue: 神圣名字 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。译作“雅威”可保留其作为以色列之神专名的性质，避免以称号取代，也比“耶和华”更接近学界通常重构的读音。
- issue: 本节是否断言贫富与升降都在雅威的主权之下
  choice: 按原文保留四个使役动词的直接陈述
  alternative: 弱化为雅威仅仅容许这些处境发生
  rationale: 希伯来文连续使用使役性分词，直接把使人贫穷、富足、降卑和升高归于雅威；译文不将其改写为较弱的“容许”，也不额外解释神施行这些行动的方式或伦理缘由。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。两组“使人……，也使人……”保持原文的诗歌平行和使役语气；“降卑／升高”保留相对的垂直意象。脚注标记均置于对应词语之后。
