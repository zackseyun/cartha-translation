base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/026.yaml
  text: The boy Samuel continued to grow, and he was good in the sight of both Yahweh and men[a][b].
translation:
  language: zh_hans
  text: 少年撒母耳不断长大，也越发蒙耶和华和众人喜爱。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较直译为：“少年撒母耳不断成长，也在耶和华和人面前越发蒙悦纳。”
    reason: 说明הֹלֵךְ与后续表达所带出的持续进展，并保留טוֹב עִם可译为“在……面前蒙悦纳”的关系性含义。
lexical_decisions:
- source_word: וְהַנַּעַר
  choice: 那少年
  rationale: נַעַר可指男孩或少年；本段中的撒母耳尚年幼，却已在圣所服侍，因此译作“少年”自然且符合语境。句首וְ承接上文，不必机械译作“并且”。
- source_word: שְׁמוּאֵל
  choice: 撒母耳
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: הֹלֵךְ וְגָדֵל
  choice: 渐渐长大
  rationale: הֹלֵךְ与后续谓语连用，表示持续、逐步的发展；“渐渐长大”准确传达这一进行和递进意义。
- source_word: וָטוֹב ... עִם
  choice: 越来越蒙……喜爱
  rationale: טוֹב与עִם构成关系性的表达，表示在对方那里得喜悦、获认可。结合הֹלֵךְ所表达的持续进展，译为“越来越蒙……喜爱”比直译“与……为善”更自然，也保留撒母耳日益获得神与人悦纳的含义。
- source_word: גַּם עִם יְהוָה וְגַם עִם אֲנָשִׁים
  choice: 耶和华和众人
  rationale: 重复的גַּם…וְגַם构成“既……又……”的平衡结构；中文用并列的“……和……”即可自然表达。אֲנָשִׁים在这里与耶和华相对，泛指人，故译“众人”而非仅指男性。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文读者最熟悉、且能标示四字神名而非普通称号的传统音译“耶和华”。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文明确使用四字神名。中文采用广为人知的专名“耶和华”，既不以“主”这一称号替代神名，也便于普通读者辨识。
- issue: טוֹב עִם所表达的是道德良善还是关系中的悦纳
  choice: 蒙……喜爱
  alternative: 在……眼中看为好
  rationale: 此处重点是撒母耳与耶和华及众人的关系和评价，并非单纯断言他的道德品质；“蒙……喜爱”保留获得悦纳的关系含义，同时避免把神与人的评价割裂开来。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“渐渐……越来越……”体现原文持续发展的语气；“蒙……喜爱”是普通读者易懂的关系性表达。
