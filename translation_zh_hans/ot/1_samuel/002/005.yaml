  source_fidelity: 译文准确呈现了诗歌中社会处境与生育状况的逆转，也恰当地将 חָדֵלּוּ 的省略按语境译为“不再挨饿”，并以脚注保留其未明示宾语的特点。不过，希伯来文 יָלְדָה שִׁבְעָה 只说“生了七个”，并未说明是“儿子”；“儿子”只明确出现于下半句的 בָּנִים。因此正文不宜在前半句补作“七个儿子”。
