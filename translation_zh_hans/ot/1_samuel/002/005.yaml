source:
  edition: WLC
  text: שְׂבֵעִ֤ים בַּ/לֶּ֨חֶם֙ נִשְׂכָּ֔רוּ וּ/רְעֵבִ֖ים חָדֵ֑לּוּ עַד עֲקָרָה֙ יָלְדָ֣ה שִׁבְעָ֔ה וְ/רַבַּ֥ת בָּנִ֖ים אֻמְלָֽלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/005.yaml
  text: Those who were full have hired themselves out for bread[a], but those who were hungry have ceased. Even the barren woman has borne seven[c][b], but she who had many sons has withered away.
translation:
  language: zh_hans
  text: 饱足的人为饼受雇做工，饥饿的人却不再挨饿。[a]甚至不孕的妇人生了七个，[b]多子之母反倒衰微了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文只说“停止了”，没有说明停止什么；可理解为不再挨饿，也可理解为不再缺乏。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“生了七个”，没有明说所生的是谁；下半句明确说“儿子”。“七”既可能是确数，也可能在诗中表达圆满、完全。
    reason: textual_and_cultural_note
lexical_decisions:
- source_word: שְׂבֵעִים
  choice: 饱足的人
  rationale: 该形容词作名词使用，指原本食物充足的人；“饱足的人”自然，并保留诗中的逆转对比。
- source_word: בַּלֶּחֶם
  choice: 为了饼
  rationale: לֶחֶם 可指饼，也可泛指食物；此处保留“饼”的具体意象，显出为生计受雇的窘迫。
- source_word: נִשְׂכָּרוּ
  choice: 受雇做工
  rationale: 该词的尼法勒形在此表示成为受雇者；这样既符合现代汉语，也保留从饱足转为依赖佣工谋生的社会处境。
- source_word: וּרְעֵבִים חָדֵלּוּ
  choice: 饥饿的人却不再挨饿
  rationale: חָדֵלּוּ 本义为“停止”，宾语未明说；结合平行句，补出“不再挨饿”能以自然汉语表达其最可能的省略含义，同时用脚注说明原文的简略与歧义。
- source_word: עַד
  choice: 甚至
  rationale: 此处引出逆转所达到的程度，具有“甚至、以至于”的作用；“甚至”最能自然传达诗句的递进。
- source_word: עֲקָרָה
  choice: 不生育的妇人
  rationale: 该阴性形容词在此名词化，指不能生育的女人；此译法准确、现代，也避免“不能生育”可能带来的过度绝对化。
- source_word: יָלְדָה שִׁבְעָה
  choice: 生了七个儿子
  rationale: 原文直译为“生了七个”，宾语承接后半句的“儿子”；在汉语中补出“儿子”使句意完整，同时脚注说明原文的省略及“七”的可能诗性含义。
- source_word: וְרַבַּת בָּנִים
  choice: 多子之母
  rationale: 短语指儿子众多的女人；“多子之母”简洁庄重，并保留 בָּנִים 的阳性复数含义。
- source_word: אֻמְלָלָה
  choice: 衰弱了
  rationale: 该词表示变得软弱、凋敝或困苦；“衰弱了”保留其基本意义，而不把意象过度具体化为“枯萎”。
theological_decisions:
- issue: “七”应按确数理解，还是理解为圆满、完全的诗性数字
  choice: 正文保留“七”，不在译文中作单一解释
  alternative: 把“七”解释为完全的丰盛或众多
  rationale: 希伯来文直接给出数字，诗歌语境可能兼具确数与圆满象征；正文保留这种张力，脚注提示其可能含义。
- issue: בָּנִים 是否应泛化为“孩子”
  choice: 译作“儿子”
  alternative: 译作“孩子”
  rationale: 原词明确为阳性复数“儿子”，上下文没有必须泛化的理由，因此保留源语的性别指向。
- issue: חָדֵלּוּ 未明说停止什么
  choice: 正文按语境译为“不再挨饿”，脚注保留省略造成的开放性
  alternative: 只译“停止了”或理解为“不再缺乏”
  rationale: 现代汉语单说“饥饿的人停止了”难以成立；补出最直接的语境含义可读性更好，但脚注不掩盖原文未明说宾语的事实。
translation_notes:
  register: 采用现代、庄重而易懂的诗体表达。上下两组逆转以“却”“甚至”“反倒”衔接；避免生硬直译，同时通过脚注保留 חָדֵלּוּ 的宾语省略和“七”的双重可能。
