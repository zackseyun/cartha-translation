  to: 饱足的人为饼受雇做工，饥饿的人却不再挨饿。[a]甚至不孕的妇人生了七个，[b]多子之母反倒衰微了。
  rationale: 修订仅消除正文在“生了七个”后添加“儿子”的不必要限定，使之与希伯来文及脚注一致；同时作两处轻微文体调整，令现代汉语更凝练自然。对“停止”的语境性补足及其脚注保留不变，也不对“七”的字面或象征意义作裁定。
