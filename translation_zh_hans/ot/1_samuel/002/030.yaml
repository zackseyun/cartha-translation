source:
  edition: WLC
  text: לָ/כֵ֗ן נְאֻם יְהוָה֮ אֱלֹהֵ֣י יִשְׂרָאֵל֒ אָמ֣וֹר אָמַ֔רְתִּי בֵּֽיתְ/ךָ֙ וּ/בֵ֣ית אָבִ֔י/ךָ יִתְהַלְּכ֥וּ לְ/פָנַ֖/י עַד עוֹלָ֑ם וְ/עַתָּ֤ה נְאֻם יְהוָה֙ חָלִ֣ילָ/ה לִּ֔/י כִּֽי מְכַבְּדַ֥/י אֲכַבֵּ֖ד וּ/בֹזַ֥/י יֵקָֽלּוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/030.yaml
  text: 'Therefore[a], declares Yahweh, the God of Israel: I indeed said that your house and your father’s house would walk before me forever. But now, declares Yahweh: far be it from me! For those who honor me I will honor, but those who despise me will be lightly esteemed.'
translation:
  language: zh_hans
  text: 因此，雅威——以色列的上帝——宣告说：“我确实说过，你家和你父家必永远行在我面前。但现在，雅威宣告说：我断不如此！因为尊重我的，我必尊重；藐视我的，必被轻看[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“必受羞辱”或“必被当作无足轻重”。原文动词有变轻、微不足道、不受重视之意，与前面的“尊重”形成对照。
    reason: 说明 יֵקָלּוּ 的词义范围及其与 כבד 的反义文字关系。
lexical_decisions:
- source_word: לָכֵן
  choice: 因此
  rationale: 自然表达承接前文控诉而得出的审判结论。
- source_word: נְאֻם יְהוָה
  choice: 雅威宣告说
  rationale: 保留郑重的神谕公式，同时使用现代汉语自然句式。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以常见音译呈现上帝的专名，区别于称号。
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: 以色列的上帝
  rationale: 直接呈现原文的属格结构和身份说明。
- source_word: אָמֹר אָמַרְתִּי
  choice: 我确实说过
  rationale: 用“确实”体现不定式绝对形与限定动词连用所产生的强调。
- source_word: בֵּיתְךָ וּבֵית אָבִיךָ
  choice: 你家和你父家
  rationale: 保留“家”的重复及其家族、宗族含义，不把所指过早限定为具体职分。
- source_word: יִתְהַלְּכוּ לְפָנַי
  choice: 行在我面前
  rationale: 保留希伯来语意象及其持续生活、事奉于上帝面前的开放含义。
- source_word: עַד עוֹלָם
  choice: 永远
  rationale: 直接表达原文持续性的盟约用语，并保留本节随后撤回这一宣告所形成的张力。
- source_word: וְעַתָּה
  choice: 但现在
  rationale: 明确表现先前宣告与当前判词之间的强烈转折。
- source_word: חָלִילָה לִּי
  choice: 我绝不容许这事继续
  rationale: 以自然汉语表达强烈拒绝；“这事继续”由上下文补足，所拒绝的是以利家继续永远行在上帝面前。
- source_word: מְכַבְּדַי אֲכַבֵּד
  choice: 尊重我的，我必尊重
  rationale: 以同一词根对应的重复译法保留 כבד 的回环和对等关系。
- source_word: וּבֹזַי
  choice: 藐视我的
  rationale: 简洁表达 בזה 所含的轻蔑、鄙弃之意。
- source_word: יֵקָלּוּ
  choice: 必被轻看
  rationale: 保留“轻”与前句 כבד 所含“重、尊荣”之间的反义对照，也维持被动或结果状态的语义空间。
theological_decisions:
- issue: 上帝先前对以利家的应许与当前宣告之间的关系
  choice: 把先前的话译为真实而郑重的宣告，并把“但现在”之后译为对其继续生效的明确拒绝。
  alternative: 将“永远”从一开始便处理为夸张说法，或把当前宣告弱化为仅仅限制特权。
  rationale: 原文本身将“我确实说过”与“但现在……绝不”并置，并以尊重或藐视上帝作为判词依据；译文保留这种神学张力，不另作系统性调和。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“你家和你父家”“行在我面前”适度保留原文意象；破折号标出同位语，使神谕开头在汉语中更清楚。脚注标记紧跟其实际解释的“必被轻看”，而非置于句首。
