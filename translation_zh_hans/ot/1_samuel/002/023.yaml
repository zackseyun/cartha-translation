  text: וַ/יֹּ֣אמֶר לָ/הֶ֔ם לָ֥/מָּה תַעֲשׂ֖וּ/ן כַּ/דְּבָרִ֣ים הָ/אֵ֑לֶּה אֲשֶׁ֨ר אָנֹכִ֤י שֹׁמֵ֨עַ֙ אֶת דִּבְרֵי/כֶ֣ם רָעִ֔ים מֵ/אֵ֖ת כָּל הָ/עָ֥ם אֵֽלֶּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/023.yaml
  text: And he said to them[a], “Why do you do such things? For I hear from all these people about your evil deeds.”
translation:
  language: zh_hans
  text: 他对他们说：“你们为什么做这样的事呢？我从所有这些百姓那里听见你们的恶行[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译可作“我从所有这些百姓那里听见你们邪恶的事（或：话）”。按上下文，这是以利听见众人讲述他儿子们的恶劣行为。
    reason: 说明 דְּבָרִים 可指“事、话、事情”，并交代正文按上下文译作“恶行”的依据。
lexical_decisions:
- source_word: וַיֹּאמֶר לָהֶם
  choice: 他对他们说
  rationale: 以自然的汉语叙事表达连续式动词，并保留说话对象；“他们”在上下文中指以利的儿子。
- source_word: לָמָּה תַעֲשׂוּן
  choice: 你们为什么做……呢
  rationale: 未完成式在责问中指持续或反复发生的行为；现代汉语用现在时态的责问即可自然表达。
- source_word: כַּדְּבָרִים הָאֵלֶּה
  choice: 这样的事
  rationale: דְּבָרִים 可指话、事或事情；此处指前文所述行为。“这样的事”既符合语境，也不把词义过度限定为某一种具体罪行。
- source_word: אָנֹכִי שֹׁמֵעַ
  choice: 我……听到的
  rationale: 代词加分词带有当前、持续听闻之意；采用汉语“听到的”并配合后句焦点结构，使责备自然有力。
- source_word: אֶת דִּבְרֵיכֶם רָעִים
  choice: 都是你们的恶事
  rationale: 字面可理解为“你们邪恶的事／话”；结合上下文，指众人所传述的恶劣行为。“恶事”保留“事情”与“行为”的语义范围。
- source_word: מֵאֵת כָּל הָעָם אֵלֶּה
  choice: 从这众百姓那里
  rationale: מֵאֵת 表示消息来源；“这众百姓”兼顾 כָּל 的整体意义、הָעָם 的集合名词性质以及 אֵלֶּה 的指示意味。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“这样的事呢”体现父亲责问的语气；“这众百姓”略带经文体色彩，但仍属现代读者可理解的表达。
