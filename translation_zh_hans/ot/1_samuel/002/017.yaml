  text: וַ/תְּהִ֨י חַטַּ֧את הַ/נְּעָרִ֛ים גְּדוֹלָ֥ה מְאֹ֖ד אֶת פְּנֵ֣י יְהוָ֑ה כִּ֤י נִֽאֲצוּ֙ הָֽ/אֲנָשִׁ֔ים אֵ֖ת מִנְחַ֥ת יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/017.yaml
  text: So the sin of the young men was very great before Yahweh[c][b][a], because the men despised Yahweh’s offering.
translation:
  language: zh_hans
  text: 这些年轻人的罪在雅威面前[a]极其严重，因为他们藐视雅威的供物[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“在雅威的面前”，是指在雅威面前或在他的临在中。
    reason: lexical_alternative
  - marker: b
    text: “供物”所译的希伯来语 minḥah 可泛指献上的供物，在某些语境中也特指素祭。
    reason: lexical_alternative
lexical_decisions:
- source_word: חַטַּאת
  choice: 罪
  rationale: 此处指以利儿子们所犯的罪，并非“赎罪祭”；“罪”准确且自然。
- source_word: הַנְּעָרִים
  choice: 这些年轻人
  rationale: נַעַר 可指少年、年轻人或侍从；此处所指是承担祭司职务的以利之子，因此译作“年轻人”，既保留年龄色彩，也避免让人误以为是孩童。
- source_word: גְּדוֹלָה מְאֹד
  choice: 极其严重
  rationale: 原文直译为“非常大”；用于描述罪时，现代汉语以“极其严重”更自然，同时保留强烈程度。
- source_word: אֶת פְּנֵי יְהוָה
  choice: 在雅威面前
  rationale: 原文含“雅威的面”这一临在性表达；“在雅威面前”保留其意象，也符合现代汉语习惯。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以通行的汉语音译呈现四字神名，保留其专名性质，而不以称号替代。
- source_word: כִּי
  choice: 因为
  rationale: 这里引出前述判定的原因，译作“因为”关系清楚。
- source_word: נִאֲצוּ
  choice: 藐视
  rationale: 该动词表示轻蔑、鄙弃；“藐视”直接保留其强烈的贬义。
- source_word: הָאֲנָשִׁים
  choice: 他们
  rationale: 原文用“那些人”，回指前面的年轻人；汉语用“他们”衔接自然，又不改变所指。
- source_word: מִנְחַת יְהוָה
  choice: 雅威的供物
  rationale: מִנְחָה 可泛指献上的礼物或供物，在特定语境中也可专指素祭；本段涉及献祭整体，采用范围较宽的“供物”以避免过度限定。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；译作“雅威”保留其作为以色列之神专名的性质，不以称号“主”代替。
- issue: 罪在雅威“面前”的含义
  choice: 在雅威面前
  alternative: 得罪雅威；在雅威看来
  rationale: 保留原文有关神临在和鉴察的表达，不将其收窄为单纯“得罪”或仅表示评价的“在……看来”。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“极其严重”比直译“非常大”更符合现代汉语描述罪行的习惯；句式保留原文先作判断、再说明原因的结构。
