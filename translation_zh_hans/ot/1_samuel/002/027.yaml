base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/027.yaml
  text: 'And a man of God came to Eli and said to him, “Thus says the LORD: Did I indeed reveal myself to your father''s house when they were in Egypt, belonging to Pharaoh''s house?”'
translation:
  language: zh_hans
  text: 有一位神人来到以利那里，对他说：“耶和华如此说：当他们在埃及、隶属法老家时，我岂没有向你父家显现吗？[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “隶属法老家”也可译作“在法老家中”。原文的介词可表示归属、从属或所处的关系。
    reason: 保留לְבֵית פַּרְעֹה这一简略表达的真实语义幅度。
lexical_decisions:
- source_word: אִישׁ אֱלֹהִים
  choice: 神人
  rationale: 这是希伯来圣经对受神差遣者的固定称谓；“神人”简洁、庄重，也保留原文称号的性质。
- source_word: כֹּה אָמַר יְהוָה
  choice: 耶和华如此说
  rationale: 保留先知宣告的固定格式；以“耶和华”表达神的专名יהוה，而不改作普通称号。
- source_word: בֵּית אָבִיךָ
  choice: 你祖先一家
  rationale: בֵּית在此指家族、宗族；אָבִיךָ为单数形式，但在语境中指以利的祖先及其家族，译为“你祖先一家”比字面的“你父亲的家”更自然且准确。
- source_word: לְבֵית פַּרְעֹה
  choice: 隶属法老家
  rationale: 介词לְ可表达归属或从属关系；此处并非单纯表示身在法老宫中，而是说他们在埃及时处于法老家的辖制或役使之下。
- source_word: הֲנִגְלֹה נִגְלֵיתִי
  choice: 我岂没有……显现吗
  rationale: 同根词不定式绝对式加限定动词带有强调作用；反问句期待肯定回答，中文用“岂没有”自然传达这一强调，同时不把句子改成直陈句。
theological_decisions:
- issue: “显现”对象的数与“祖先一家”的关系
  choice: 向他们显现
  alternative: 向你祖先一家显现／向他显现
  rationale: 原文אֶל בֵּית אָבִיךָ在语法上是单数集合名词，而后面的בִּהְיוֹתָם使用复数后缀，明确按家族成员整体理解；“他们”保留这种集合性转换。
- issue: 埃及中与法老家的关系
  choice: 在埃及、隶属法老家时
  alternative: 在埃及法老家中的时候
  rationale: לְבֵית פַּרְעֹה的确切关系略有压缩和歧义；正文采用归属、从属义，但用脚注提示也可较直译为“在法老家中”，避免把解释伪装成毫无争议的唯一读法。
translation_notes:
  register: 采用现代、庄重而易懂的叙事和先知宣告语体。“神人”和“耶和华如此说”保留经文传统术语；其余句法按现代普通话调整，避免生硬照搬希伯来语序。
