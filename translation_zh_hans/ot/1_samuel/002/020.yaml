base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/020.yaml
  text: And Eli would bless Elkanah and his wife and say[b][a], “May Yahweh give you offspring by this woman in place of the petition that was asked for Yahweh.” Then they would go to his place.
translation:
  language: zh_hans
  text: 以利常常为以利加拿和他的妻子祝福，说：“愿雅威从这妇人赐你后裔，来代替那为雅威所求的孩子[a][b]。”然后，他们回到以利加拿的住处。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “所求的孩子”：原文的名词与“求、借出”同根，呼应哈拿求得撒母耳、又把他交给雅威的叙事。该词也可译为“请求”“所求之物”，并带有与“借出”相关的文字呼应。
    reason: lexical_alternative
  - marker: b
    text: “为雅威所求”：原文“求”的动词形式是阳性单数；上下文与哈拿求子密切相关（参1:20、27—28），但其语法形式及介词的确切关系仍有解释上的张力。
    reason: alternative_reading
lexical_decisions:
- source_word: וּבֵרַךְ
  choice: 常为……祝福
  rationale: 结合上下文每年献祭的惯常情境，将完成式表达为反复发生的动作；“常”使现代汉语读者清楚看出这是惯例。
- source_word: אֶת אֶלְקָנָה וְאֶת אִשְׁתּוֹ
  choice: 以利加拿和他的妻子
  rationale: 原文明确说“他的妻子”，没有直接使用哈拿的名字，因此保留原文措辞。
- source_word: יָשֵׂם יְהוָה לְךָ
  choice: 愿雅威使你……得
  rationale: שׂים基本义为“放置、设立”，在祝福语境中意为赐予或使人得到；“愿……使你得”自然地保留祈愿语气。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以音译呈现四字神名，保留其作为以色列之神专名的性质，而不以称号代替。
- source_word: זֶרַע
  choice: 后裔
  rationale: 该词是集合名词，可指子女或后代；“后裔”既保留集合意味，也适合生育祝福的语境。
- source_word: מִן הָאִשָּׁה הַזֹּאת
  choice: 从这妇人
  rationale: 贴近介词 מן 的表达，并清楚指出后裔由这名妇人生育；“妇人”在经文语体中庄重而可懂。
- source_word: תַּחַת
  choice: 代替
  rationale: 此处表示替代或补偿，即求雅威另赐后裔，作为已经献给雅威之孩子的替代。
- source_word: הַשְּׁאֵלָה
  choice: 所求而献出的孩子
  rationale: 该名词与 שׁאל“求、借出”同根，在本叙事中既回响哈拿求得撒母耳，也关联她把他交给雅威。正文以“孩子”交代具体所指，同时用脚注保留词语的多义和文字呼应。
- source_word: אֲשֶׁר שָׁאַל לַיהוָה
  choice: 她向雅威所求而献出
  rationale: 动词形态为阳性单数，但上下文强烈指向哈拿；介词 לְ 又可在本段语境中指向交付给雅威。译文呈现叙事所指，并以脚注说明语法和词义张力。
- source_word: וְהָלְכוּ לִמְקֹמוֹ
  choice: 随后，他们就回自己的住处去了
  rationale: 复数动词指以利加拿夫妇；原文名词后缀是阳性单数，字面为“他的住处”。汉语以“自己的住处”自然表达夫妻一同返回以利加拿的家，同时避免误解为回到以利那里。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 采用较接近希伯来神名的现代汉语音译，保留专名性质，不以头衔取代。
- issue: 关系从句中 שָׁאַל 的主语
  choice: 按上下文理解为哈拿（“她”）
  alternative: 按阳性单数形式理解为“他”；使用无主句以回避
  rationale: 虽然马所拉文本的动词是阳性单数，但撒母耳记上1章明确叙述哈拿求子，当前语境也以她为核心。脚注保留原文形态上的不协调。
- issue: הַשְּׁאֵלָה 所指及 שׁאל 的双关
  choice: 正文译作“所求而献出的孩子”
  alternative: 所求之物；请求；借给雅威的孩子
  rationale: 该词既可指“所求之物”，又因同根词在1:28中涉及交付给雅威而形成有意的词语呼应。译文不把它仅化约为抽象“请求”，也不把“借出”定为唯一意义。
translation_notes:
  register: 采用现代、庄重而易懂的经文语体。“常……随后……就……”呈现每年反复发生的情境；“妇人”“后裔”略带庄重色彩，但仍属现代标准普通话。所有脚注标记均置于正文相关短语之后。
