  text: וְ/הָיָ֗ה כָּל הַ/נּוֹתָר֙ בְּ/בֵ֣יתְ/ךָ֔ יָבוֹא֙ לְ/הִשְׁתַּחֲוֺ֣ת ל֔/וֹ לַ/אֲג֥וֹרַת כֶּ֖סֶף וְ/כִכַּר לָ֑חֶם וְ/אָמַ֗ר סְפָחֵ֥/נִי נָ֛א אֶל אַחַ֥ת הַ/כְּהֻנּ֖וֹת לֶ/אֱכֹ֥ל פַּת לָֽחֶם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/036.yaml
  text: And everyone left in your house will come to bow down to him for a piece of silver and a loaf of bread[a], and will say, ‘Please attach me to one of the priestly offices[b], so that I may eat a morsel of bread.’
translation:
  language: zh_hans
  text: 凡你家中所剩下的人，都必来向他下拜，为了一点银子[a]和一个饼；他们必说：‘求你把我收纳到祭司职分中的一个岗位上[b]，使我可以吃一点饼。’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“一枚小银币”；希伯来语指一个小单位的银子。
    reason: lexical_alternative
  - marker: b
    text: 或译：“一项祭司的职务”或“一个祭司的差事”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנּוֹתָר
  choice: 剩下的人
  rationale: 表示经历审判和损失后仍存留的人；此处指以利家中余下的成员。
- source_word: בְּבֵיתְךָ
  choice: 你家中
  rationale: 这里的“家”主要指家族、家系，而非房屋；“你家中”在现代汉语中自然且保留原有意象。
- source_word: לְהִשְׁתַּחֲוֺת לוֹ
  choice: 向他下拜
  rationale: 保留俯伏、屈身恳求及表示臣服的含义，也不具体断定代词“他”的身份。
- source_word: לַאֲגֹרַת כֶּסֶף
  choice: 为要得一点银子
  rationale: אֲגוֹרָה指少量或小单位的银子；正文以通顺表达呈现其微薄价值，脚注保留“小银币”的可能译法。
- source_word: כִכַּר לָחֶם
  choice: 一饼食物
  rationale: כִּכָּר在此指一整饼或圆饼；“一饼食物”既保留形象，也避免与后文“一口饼”重复得过于突兀。
- source_word: סְפָחֵנִי
  choice: 把我收进
  rationale: 该命令式有使某人附属、加入之意；“收进”自然体现恳求被纳入祭司职务体系，而不强化正式任命的含义。
- source_word: נָא
  choice: 求你
  rationale: 表达恳求语气，比单纯“请”更符合此处卑微求告的场景。
- source_word: אַחַת הַכְּהֻנּוֹת
  choice: 一个祭司的职分
  rationale: 复数形式在此可指祭司的职务、差事或岗位；这样翻译避免理解成多个彼此不同的祭司制度。
- source_word: לֶאֱכֹל פַּת לָחֶם
  choice: 使我可以吃一口饼
  rationale: פַּת表示一小块或一口食物，译文保留其微薄、困窘的语感。
theological_decisions:
- issue: “向他下拜”中“他”的所指
  choice: 保留单数代词“他”，不明确指定身份
  alternative: 明确译为当时掌权的祭司或上文所应许的忠信祭司
  rationale: 原文只用单数代词。语境表明他拥有祭司职权，但未在本节重新明说其身份；保留代词可维持原文的指代空间和以利家地位逆转的张力。
- issue: אַחַת הַכְּהֻנּוֹת的性质
  choice: 译为祭司体系中的一个职分
  alternative: 译为一种祭司职务、一个祭司差事或一个祭司班次
  rationale: 此处重点是以利后裔为糊口而求被纳入祭司服事，不宜据此引入特定宗派的圣职制度或过度确定其行政结构。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“都必来”“下拜”保留预言和审判宣告的肃穆感；引语中的“求你”“吃一口饼”突出以利家后裔日后的卑微与匮乏。所有脚注标记均已置于正文相应位置。
