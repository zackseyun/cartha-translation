revisions:
- from: 你家中所有剩下的人，都必来向他下拜，为要得一点银子[a]和一饼食物，并且说：‘求你把我收进一个祭司的职分中[b]，使我可以吃一口饼。’
  to: 凡你家中所剩下的人，都必来向他下拜，为了一点银子[a]和一个饼；他们必说：‘求你把我收纳到祭司职分中的一个岗位上[b]，使我可以吃一点饼。’
  rationale: 修订仅处理两处词义与汉语表达问题：将“食物”恢复为原文明确的“饼”，并将“祭司的职分”明确为祭司职分体系中的一个岗位。其余保留原译的预言语气、恳求语气、微薄供应的对比，以及“他”的开放指代。
