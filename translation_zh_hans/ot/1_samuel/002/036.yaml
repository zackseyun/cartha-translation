  timestamp: '2026-07-14T05:26:13Z'
review_pass:
  verdict: revise
  source_fidelity: 译文整体准确保留了审判预言中以利家余民将屈身乞求、仅为微薄食物而求职的情景，也保留了“他”的未明指代。但“一饼食物”既将“饼”泛化为“食物”，又不合现代汉语量词搭配；应明确为“一个饼”。“一个祭司的职分”容易理解为“某一位祭司所拥有的职分”，未清楚表达原文“祭司职分中的一项／一个岗位”。
  naturalness: “凡你家中所剩下的人”比“你家中所有剩下的人”更自然庄重。“一个饼”与后文“一点饼”形成原文整饼与一小份饼的对照。将乞求内容改为“把我收纳到祭司职分中的一个岗位上”更符合现代普通话，并表达被附入某项祭司职责的意思。
  terminology: “下拜”“银子”“祭司职分”均适合本段庄重叙事／预言语体。保留“他”，不把其身份解释性地限定为某一人物或制度。
