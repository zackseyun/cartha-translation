  text: קֶ֥שֶׁת גִּבֹּרִ֖ים חַתִּ֑ים וְ/נִכְשָׁלִ֖ים אָ֥זְרוּ חָֽיִל׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/004.yaml
  text: The bows of the mighty are shattered[b][a], but those who stumble are girded with strength.
translation:
  language: zh_hans
  text: 勇士的弓都折断了[a]，步履蹒跚的人却以力量束腰[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“都粉碎了”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“用力量束腰”。
    reason: lexical_alternative
lexical_decisions:
- source_word: קֶשֶׁת
  choice: 弓
  rationale: 原文虽为单数形式，但与复数的“勇士”及复数谓语连用，具有集合意义；现代汉语用“勇士的弓”即可自然表达这一点。
- source_word: גִּבֹּרִים
  choice: 勇士
  rationale: 该词可指强壮、英勇的人，常用于战士；“勇士”既切合“弓”的军事意象，也保留诗歌色彩。
- source_word: חַתִּים
  choice: 折断了
  rationale: 该词在这里描述弓遭到破坏，而非人的惊惶；“折断了”准确、自然，并保留具体意象。
- source_word: נִכְשָׁלִים
  choice: 步履蹒跚的人
  rationale: 原词描写绊跌、踉跄或站立不稳的人；此译保留身体动作的比喻，又避免把它抽象化为单纯的“弱者”。
- source_word: אָזְרוּ
  choice: 束腰
  rationale: 该动词意为束紧、束上，常与力量或装备相连；原文是主动形式，“束腰”保留其具体动作及诗歌表达。
- source_word: חָיִל
  choice: 力量
  rationale: 该词可指力量、能力、勇力或军事实力；此处“力量”范围较宽，适合强弱逆转的上下文。
theological_decisions:
- issue: 哈拿之歌中的强弱逆转意象
  choice: 保留“弓”“步履蹒跚”“以力量束腰”等具体的军事和身体意象。
  alternative: 意译为“强者失去能力，弱者却变得刚强”。
  rationale: 原文借鲜明的具体形象表现强弱处境的逆转。保留这些形象能呈现诗歌及神学张力，而不把经文预先解释成抽象命题。
- issue: אָזְרוּ 的语态与施事者
  choice: 按希伯来文主动形式译为“以力量束腰”。
  alternative: 译为“被赋予力量”或“被力量束腰”。
  rationale: 原文动词是第三人称复数主动完成式，未明说是谁从外面赋予力量；主动译法保留这一语法特点，也不排除上下文所表达的神所带来的逆转。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“步履蹒跚”保留原文绊跌不稳的具象表达；“以力量束腰”略带诗性，但在上下文中清楚，并忠实保存希伯来文的束腰意象。
