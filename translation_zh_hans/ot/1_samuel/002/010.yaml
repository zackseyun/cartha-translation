  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: יְהוָ֞ה יֵחַ֣תּוּ מריב/ו על/ו בַּ/שָּׁמַ֣יִם יַרְעֵ֔ם יְהוָ֖ה יָדִ֣ין אַפְסֵי אָ֑רֶץ וְ/יִתֶּן עֹ֣ז לְ/מַלְכּ֔/וֹ וְ/יָרֵ֖ם קֶ֥רֶן מְשִׁיחֽ/וֹ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/010.yaml
  text: Yahweh’s adversaries will be shattered[a]; he will thunder against them from heaven. Yahweh will judge the ends of the earth[c][b]; he will give strength to his king and lift up the horn of his anointed.
translation:
  language: zh_hans
  text: 与耶和华争竞的人必被打碎[a]；他必从天上向他们发雷声[b]。耶和华必审判地极；他必赐力量给他的王，高举他的受膏者的角[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“耶和华的仇敌必被打碎。”希伯来文本的书写与诵读传统在此有细微差异，但都表达有人敌对耶和华。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译为“在天上”；这里译作“从天上”，以自然表达雷声的来源。
    reason: lexical_alternative
  - marker: c
    text: “角”在希伯来诗歌中象征力量、尊荣和得胜。“受膏者”也可译作“弥赛亚”；本处与“王”平行，并保留该词可能具有的弥赛亚意蕴。
    reason: metaphor_and_alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的专名形式，明确保留希伯来文本中的圣约之名，而不以“主”替代。
- source_word: יֵחַתּוּ
  choice: 必被打碎
  rationale: 此处尼法勒式表达在败亡中被击破；“被打碎”保留诗歌中强烈的审判意象。
- source_word: מריב/ו על/ו
  choice: 与耶和华争竞的人
  rationale: 依据马所拉文本的读法传统，将其理解为“与他争竞的人”；明说“耶和华”可使中文指代清楚，同时不把词义收窄为一般性的“仇敌”。
- source_word: בַּשָּׁמַיִם יַרְעֵם
  choice: 从天上向他们发雷声
  rationale: בַּשָּׁמַיִם 字面可作“在天上”，但与定向于敌人的“发雷声”连用时，中文以“从天上”自然表达雷声的来源。
- source_word: יָדִין
  choice: 必审判
  rationale: 保留 דין 在此处施行司法判断与统治的广义含义，并契合上下文的神圣审判。
- source_word: אַפְסֵי אָרֶץ
  choice: 地极
  rationale: 这是指大地最遥远之处的诗歌性惯用语；“地极”简洁地保留普世范围。
- source_word: וְיִתֶּן עֹז לְמַלְכּוֹ
  choice: 必赐力量给自己的王
  rationale: עֹז 译为“力量”，מֶלֶךְ 直译为“王”；即使本诗处于以色列王国建立以前，也不淡化原文明确的君王用语。
- source_word: וְיָרֵם קֶרֶן
  choice: 高举……的角
  rationale: 保留希伯来诗歌中“角”象征力量、尊荣和得胜的核心比喻，并与本章前文的意象相呼应。
- source_word: מְשִׁיחוֹ
  choice: 他受膏者
  rationale: מָשִׁיחַ 的直接意义是“受膏者”。此译法既适用于耶和华所立的王，也保留该词在正典中的弥赛亚意蕴，而不在正文中把可能的近期与远期所指合并为单一解释。
theological_decisions:
- issue: מְשִׁיחוֹ 在君王诗歌中兼有历史性受膏君王和弥赛亚指向的可能
  choice: 他受膏者
  alternative: 他的弥赛亚
  rationale: 正文采用词语的直接意义，以保留本节中“他的王”与“他的受膏者”的平行关系及其真实的解释张力；脚注说明该词也是“弥赛亚”一词的来源及其进一步意蕴。
- issue: 在以色列设立君王以前出现“他的王”
  choice: 保留“自己的王”
  alternative: 自己的统治者
  rationale: 希伯来文明确使用“王”，可能具有预示性；翻译不应因历史时点而将其泛化。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。保留“地极”“角”“受膏者”等关键诗歌和神学用语；对现代读者不够直观的“角”以及文本传统和介词差异，均以脚注说明。
