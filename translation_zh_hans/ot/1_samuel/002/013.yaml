base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/013.yaml
  text: 'The custom of the priests with the people was this: whenever any man was sacrificing a sacrifice[a], the priest’s servant would come while the meat was boiling, with the three-pronged fork in his hand.'
translation:
  language: zh_hans
  text: 祭司们对待百姓的规矩是这样：每逢有人献祭，肉正煮着的时候，祭司的仆役就来，手里拿着一把三齿叉[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“肉钩”；希伯来语指一种用来从锅中取肉、形似叉子的器具。
    reason: 说明器具名称的传统译法及具体用途，避免读者把“三齿叉”理解为普通餐具。
lexical_decisions:
- source_word: וּמִשְׁפַּט
  choice: 规矩
  rationale: מִשְׁפָּט可指判决、法定权利、条例或惯例；本节是在交代祭司反复实行的做法，因此译作“规矩”，既符合叙事语境，也不预先判定这种做法是否正当。词首连接词按现代汉语行文不另译。
- source_word: הַכֹּהֲנִים אֶת־הָעָם
  choice: 祭司们对待百姓的
  rationale: 该短语描述祭司与百姓交涉时一贯的做法；“对待百姓”自然表达关系指向，同时不额外加入敌意或善意。
- source_word: כָּל־אִישׁ זֹבֵחַ זֶבַח
  choice: 每逢有人献祭
  rationale: 希伯来语采用同根动词与名词“宰献祭物/献上祭牲”；现代汉语若机械重复会显得生硬，“每逢有人献祭”保留反复发生及分配性的含义。
- source_word: וּבָא
  choice: 就来
  rationale: 上下文描述惯常反复发生的行为；“每逢……就来”自然呈现其迭代意义。
- source_word: נַעַר הַכֹּהֵן
  choice: 祭司的仆役
  rationale: נַעַר可指少年、青年或服侍者；此处强调其替祭司办理祭肉事务的角色，译作“仆役”而不武断限定年龄。
- source_word: כְּבַשֵּׁל הַבָּשָׂר
  choice: 肉正煮着的时候
  rationale: 介词כ与不定式结构在此表达同时发生的时间背景；“正煮着的时候”准确而自然。
- source_word: הַמַּזְלֵג שְׁלֹשׁ הַשִּׁנַּיִם
  choice: 三齿叉
  rationale: 字面为“有三个齿的叉”；“三齿叉”简洁保留器具形状，传统译法“肉钩”置于脚注。
- source_word: בְּיָדוֹ
  choice: 手里拿着
  rationale: 表达仆役手持器具；“手里拿着”符合现代汉语习惯。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而清楚的叙事语言。“规矩”保留原词既可指惯例、也可指应得权利或条例的语义张力，不在本节内先行作道德定性。脚注标记置于其实际解释的“三齿叉”之后。
