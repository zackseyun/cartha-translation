base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/022.yaml
  text: Eli was very old[a], and he heard all that his sons were doing to all Israel, and that they were lying with the women who served at the entrance to the tent of meeting.
translation:
  language: zh_hans
  text: 以利年纪老迈；他听说儿子们对全以色列所做的一切，也听说他们与那些在会幕门口服事的妇女[a]同寝。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“聚集在会幕门口的妇女。”希伯来语分词可指聚集，也可指以有组织的方式服事。
    reason: 保留 הַצֹּבְאוֹת 的词义歧义。
lexical_decisions:
- source_word: זָקֵן מְאֹד
  choice: 年纪已经很老了
  rationale: 以自然现代汉语表达谓语形容词加程度副词的强调；“已经”体现年老至此的状态，但不另加原文没有的时间话语标记。
- source_word: וְשָׁמַע
  choice: 他听说
  rationale: 叙事中的完成式陈述以利得知这些事；“听说”自然体现消息经传闻到他耳中。
- source_word: כָּל אֲשֶׁר יַעֲשׂוּן
  choice: 所做的一切事
  rationale: 概括儿子们持续发生的全部行为，不把时体细化为一次性的行动。
- source_word: לְכָל יִשְׂרָאֵל
  choice: 向全以色列
  rationale: 保留介词所表达的行为指向，不强化为“加害全以色列”。
- source_word: יִשְׁכְּבוּן אֶת־הַנָּשִׁים
  choice: 与那些妇女同寝
  rationale: “同寝”在现代中文中清楚传达性关系，同时保持希伯来文惯用委婉语的庄重与含蓄。
- source_word: הַצֹּבְאוֹת
  choice: 服事的
  rationale: 该分词在圣所语境中可指有组织地参与服事；此译法自然且不引入“女祭司”等原文没有的制度身份。
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: 在会幕门口
  rationale: “会幕”是“相会之幕”的通行中文称谓，“门口”准确而自然地表达入口位置。
theological_decisions:
- issue: 妇女在圣所中的活动性质
  choice: 译作“在会幕门口服事的妇女”
  alternative: “聚集在会幕门口的妇女”
  rationale: הַצֹּבְאוֹת 可指有组织的服事，也可能侧重聚集；结合圣所语境及出埃及记38:8的对应表达，正文采用“服事”，脚注保留“聚集”的真实可能。
- issue: 性行为的明确程度
  choice: 译作“与……同寝”
  alternative: “与……发生性关系”
  rationale: 希伯来文使用惯用委婉语；“同寝”既不掩盖其性含义，也不比原文更直白或更具临床色彩。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。将较长的希伯来语并列句分为两句，并用“也听说”明确第二项消息与前项并列；不增添宗派性职分称谓。
