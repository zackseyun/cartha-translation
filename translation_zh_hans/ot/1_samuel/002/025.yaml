reference: 1 Samuel 2:25
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אִם יֶחֱטָ֨א אִ֤ישׁ לְ/אִישׁ֙ וּ/פִֽלְל֣/וֹ אֱלֹהִ֔ים וְ/אִ֤ם לַֽ/יהוָה֙ יֶֽחֱטָא אִ֔ישׁ מִ֖י יִתְפַּלֶּל ל֑/וֹ וְ/לֹ֤א יִשְׁמְעוּ֙ לְ/ק֣וֹל אֲבִי/הֶ֔ם כִּֽי חָפֵ֥ץ יְהוָ֖ה לַ/הֲמִיתָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/025.yaml
  text: If a man sins against another man[a], God will mediate for him; but if a man sins against Yahweh, who will pray for him? But they would not listen to the voice of their father[b], because Yahweh desired to put them to death.
translation:
  language: zh_hans
  text: 如果一个人得罪另一个人，上帝会为这事作出裁断[a]；但如果一个人得罪耶和华，谁能为他代求呢？然而，他们不肯听从父亲的话，因为耶和华有意使他们死去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “上帝会为这事作出裁断”或译“审判官会审判他”。希伯来语אֱלֹהִים有时可指人的审判官；正文根据本节与“耶和华”的对照，将其译作“上帝”。
    reason: alternative_reading
lexical_decisions:
- source_word: יֶחֱטָא
  choice: 得罪
  rationale: חטא在这里表示对某一对象犯罪、冒犯；“得罪”既自然，也保留道德与神学分量。
- source_word: אִישׁ לְאִישׁ
  choice: 一个人得罪另一个人
  rationale: 准确表达两个阳性单数名词所构成的人际关系，同时符合现代汉语习惯。
- source_word: וּפִלְלוֹ אֱלֹהִים
  choice: 上帝会为他裁断
  rationale: פלל的Piel形在此带有审断、仲裁之意；“为他裁断”保留司法语境及לוֹ的关系含义，又避免把结果限定为定罪。
- source_word: לַיהוָה
  choice: 得罪耶和华
  rationale: 介词标明受冒犯的对象；神名יהוה音译为“耶和华”，符合现代中文圣经语域，也使本句与אֱלֹהִים“上帝”的措辞区别清楚。
- source_word: מִי יִתְפַּלֶּל לוֹ
  choice: 谁能为他代求呢
  rationale: התפלל在此语境中不只是一般祷告，而是为犯罪者向上帝求情；“代求”也保留它与前一个同源动词פלל的语义联系。
- source_word: וְלֹא יִשְׁמְעוּ לְקוֹל אֲבִיהֶם
  choice: 然而，他们不肯听从父亲的话
  rationale: “不肯”表达持续而有意的拒绝；“听从父亲的话”自然传达希伯来语“听父亲的声音”所含的顺服意味。
- source_word: כִּי חָפֵץ יְהוָה
  choice: 因为耶和华有意
  rationale: חפץ可指愿意、意欲；“有意”保留神主动意志的强烈陈述，又不额外加入以恶为乐的含义。
- source_word: לַהֲמִיתָם
  choice: 使他们死去
  rationale: מות的Hiphil不定式具有使役意义；此译准确表达“使之死亡”，语气庄重，并避免弱化审判。
theological_decisions:
- issue: 首句אֱלֹהִים的所指
  choice: 上帝
  alternative: 审判官
  rationale: 单数动词形式及其与下句“得罪耶和华”的对照更支持神为裁断者；但“审判官”有语言和译本传统依据，故列入脚注。
- issue: 两个פלל词形之间的关系
  choice: 前句译“为他裁断”，后句译“为他代求”
  alternative: 前句译“审判他”，后句译“为他祷告”
  rationale: 不同词形在各自语境中分别偏向司法裁断与祈求代言。正文用自然中文呈现差别，同时尽可能保留共同的中介性语义。
- issue: כִּי所表达的因果关系与神的意愿
  choice: 因为耶和华有意使他们死去
  alternative: 因为耶和华已经决定使他们死去
  rationale: 正文保留希伯来文明确的因果陈述和חפץ所表达的意愿，不把它改写成仅仅预知或被动许可，也不解决神的主权与二人拒绝听从之间的张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“耶和华”用于יהוה，“上帝”用于אֱלֹהִים。正文保留严厉的因果句，不以解释性措辞缓和神审判的陈述。
