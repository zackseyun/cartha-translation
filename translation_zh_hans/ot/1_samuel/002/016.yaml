revisions:
- from: 那人会对他说：“今天总要先把脂油焚烧了，然后你可以随心所欲地拿。”但仆人会对他说：“不行，你现在就得交出来；不然，我就要强抢。”
  to: 那人会对他说：“今天务必先把脂油焚烧a，然后，你想拿什么，就拿什么。”但那仆人会对他说：“不，你现在就得给我；不然，我就要强行拿走。”
  rationale: 修订以“务必”及脚注保留希伯来文强调形式；以“你想拿什么，就拿什么”表达许可范围，避免“随心所欲”在现代汉语中可能带出的无约束贬义；以“强行拿走”忠实表达威胁中的强力夺取。其余叙事时态、祭祀术语和对话的强硬语气均予保留。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T05:26:10Z'
review_pass:
  verdict: revise
  source_fidelity: 译文准确保留了献祭者要求先焚烧脂油、之后才可取肉，以及仆人立即索取并威胁强行夺取的基本对话和惯常性。惟“随心所欲地拿”在现代汉语中常含任意妄为、不受约束之意，较原文“照你所愿”更强，宜改为较中性的“你想拿什么，就拿什么”。“焚烧了”的完成体表述也可改为不预设动作已完成的“焚烧脂油”。
  naturalness: “会对他说”与段落所述反复发生的情景相称。“今天务必先把脂油焚烧”及“然后，你想拿什么，就拿什么”更流畅、庄重，同时清楚表达先后次序。“强行拿走”自然且准确传达凭强力夺取。
  terminology: “脂油”适合祭祀语境。“那仆人”清楚指明第二位说话者，避免代词歧义。保留“给我”所隐含的受词，可使汉语命令完整；这由上下文中仆人索取祭肉明确支持。
  issues:
  - severity: low
    issue: “随心所欲地拿”可能加强原文语气。
    rationale: 该成语通常指毫无约束地任意行事；希伯来文仅表示“照你所愿的”，此处是献祭者许可对方在正确次序之后取其想要的部分。
  - severity: low
    issue: “焚烧了”带有完成貌，且未标示原文的强调。
    rationale: 原文以不定式绝对形加未完成式强调“务必／一定要焚烧”，重点是要求与次序，而不是叙述动作已经完成。可用“务必先……焚烧”，并以脚注说明强调形式。
