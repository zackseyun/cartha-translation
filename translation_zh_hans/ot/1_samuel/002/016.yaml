  text: וַ/יֹּ֨אמֶר אֵלָ֜י/ו הָ/אִ֗ישׁ קַטֵּ֨ר יַקְטִיר֤וּ/ן כַּ/יּוֹם֙ הַ/חֵ֔לֶב וְ/קַ֨ח לְ/ךָ֔ כַּ/אֲשֶׁ֥ר תְּאַוֶּ֖ה נַפְשֶׁ֑/ךָ וְ/אָמַ֥ר ל/ו כִּ֚י עַתָּ֣ה תִתֵּ֔ן וְ/אִם לֹ֖א לָקַ֥חְתִּי בְ/חָזְקָֽה־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/016.yaml
  text: And the man would say to him[a], “Let them first burn the fat today, and then take for yourself whatever your soul desires.” But he would say to him, “No, you must give it now; and if not, I will take it by force.”
translation:
  language: zh_hans
  text: 那人会对他说：“今天务必先把脂油焚烧a，然后，你想拿什么，就拿什么。”但那仆人会对他说：“不，你现在就得给我；不然，我就要强行拿走。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָאִישׁ
  choice: 那人
  rationale: 定指阳性单数，指前来献祭的人；“那人”自然承接上文。
- source_word: קַטֵּר יַקְטִירוּן
  choice: 总要先把……焚烧了
  rationale: 不定式绝对形与未完成式连用，具有强调作用；“总要”保留强调，“先”表达语境中献脂油在取肉之前的次序。
- source_word: כַּיּוֹם
  choice: 今天
  rationale: 按此处时间表达直译为现代汉语自然的“今天”。
- source_word: הַחֵלֶב
  choice: 脂油
  rationale: 指祭牲中应当焚烧的脂肪部分；“脂油”在祭祀语境中准确而庄重。
- source_word: וְקַח לְךָ
  choice: 然后你可以……拿
  rationale: 保留命令所表达的许可意味，并以“然后”清楚呈现上下动作的先后。
- source_word: כַּאֲשֶׁר תְּאַוֶּה נַפְשֶׁךָ
  choice: 随心所欲地
  rationale: 希伯来语直意为“照你心所欲的”；中文成语自然传达其意，不把 נֶפֶשׁ 生硬译作“灵魂”。
- source_word: וְאָמַר לוֹ
  choice: 但仆人会对他说
  rationale: 该形式在这段惯常场景中表达反复发生的回应；补出“仆人”以消除汉语代词歧义，“但”体现对抗性转折。
- source_word: כִּי עַתָּה תִתֵּן
  choice: 不行，你现在就得交出来
  rationale: כִּי 此处带强烈反驳或断然坚持的语气；“就得”表现强制要求，但不额外解释其神学含义。
- source_word: וְאִם לֹא
  choice: 不然
  rationale: 自然简洁地表达条件威胁。
- source_word: לָקַחְתִּי
  choice: 我就要……抢
  rationale: 完成式在威胁语境中具有确定的将来或意愿色彩。
- source_word: בְחָזְקָה
  choice: 强抢
  rationale: 表达凭强力、强制夺取；与中文动词结合后简洁有力。
theological_decisions:
- issue: 献祭程序中焚烧脂油与取肉的先后
  choice: 明确译出先焚烧脂油、然后取肉的次序
  alternative: 较逐字地译为“今天总要焚烧脂油，你再拿”，不明说“先”
  rationale: 上下文所争执的正是正确的献祭次序；明确先后有助于普通读者理解，又没有在正文中增添额外的礼仪或教义说明。
- issue: 是否将 נֶפֶשׁ 明译为“灵魂”
  choice: 译作“随心所欲”
  alternative: 译作“照你灵魂所欲的”或“照你心里想要的”
  rationale: 此处 נֶפֶשׁ 指人的欲望或意愿，并非对灵魂本体的神学陈述；采用自然汉语可避免制造并不存在的身心二分含义。
translation_notes:
  register: 采用现代、庄重而口语可懂的叙事语言。“脂油”保持祭祀语境的准确性；“总要”“就得”“强抢”分别传达原文的强调、强硬命令和暴力威胁。正文以“会……”表达上下文中的惯常、反复行为。
