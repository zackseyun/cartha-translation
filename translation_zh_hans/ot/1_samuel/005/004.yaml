source:
  edition: WLC
  text: וַ/יַּשְׁכִּ֣מוּ בַ/בֹּקֶר֮ מִֽ/מָּחֳרָת֒ וְ/הִנֵּ֣ה דָג֗וֹן נֹפֵ֤ל לְ/פָנָי/ו֙ אַ֔רְצָ/ה לִ/פְנֵ֖י אֲר֣וֹן יְהוָ֑ה וְ/רֹ֨אשׁ דָּג֜וֹן וּ/שְׁתֵּ֣י כַּפּ֣וֹת יָדָ֗י/ו כְּרֻתוֹת֙ אֶל הַ/מִּפְתָּ֔ן רַ֥ק דָּג֖וֹן נִשְׁאַ֥ר עָלָֽי/ו׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/005/004.yaml
  text: When they rose early the next morning[a], behold, Dagon had fallen facedown on the ground before the ark of Yahweh, and the head of Dagon and both the palms of his hands were cut off on the threshold; only Dagon was left on him.
translation:
  language: zh_hans
  text: 第二天清早，他们早早起来，看哪，大衮面朝下倒在地上，在雅威的约柜前；大衮的头和双手的手掌都被砍断，落在门槛上，只剩下大衮的躯干[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来原文直译近于“只有大衮留在它上面”。这句话含义不很明确；按上下文，很可能是说大衮神像只剩下躯干。
    reason: 保留原文末句的词汇与指代歧义，并说明正文所采用的语境解释。
lexical_decisions:
- source_word: וַיַּשְׁכִּמוּ בַבֹּקֶר מִמָּחֳרָת
  choice: 第二天清早，他们早早起来
  rationale: 合并表达次日与清早的信息，同时保留 שׁכם“早起”的动作；虽略有语义重复，却自然体现原文的强调。
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留叙事中突显意外景象的提示语及其修辞力度。
- source_word: נֹפֵל לְפָנָיו אַרְצָה
  choice: 面朝下倒在地上
  rationale: 该分词描写众人发现时大衮所处的状态；לְפָנָיו 在此指脸面向下，אַרְצָה 表示倒向并伏于地面。
- source_word: לִפְנֵי אֲרוֹן יְהוָה
  choice: 在雅威的约柜前
  rationale: לִפְנֵי 按空间关系译为“在……前”；יהוה 采用音译“雅威”，保留神的专名。
- source_word: וּשְׁתֵּי כַּפּוֹת יָדָיו
  choice: 双手的手掌
  rationale: כַּפּוֹת 特指手掌，并保留“两只”的含义，不泛化为单纯的“双手”。
- source_word: כְּרֻתוֹת אֶל הַמִּפְתָּן
  choice: 都被砍断，落在门槛上
  rationale: 被动分词表示已经被切断的状态；אֶל 在结果性场景中指向门槛所在位置，以“落在”自然交代断肢的位置。
- source_word: רַק דָּגוֹן נִשְׁאַר עָלָיו
  choice: 只剩下大衮的躯干
  rationale: 直译“只有大衮留在他/它上面”在中文中含混难解；结合头和双掌已被砍断的上下文，此处最可能指偶像主体或躯干，正文传达该语境意义，并以脚注保留原文难点。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；采用较贴近学界通行重构读音的“雅威”，将其作为专名呈现，而不以称号替代。
- issue: 大衮残余部分的理解
  choice: 正文译作“大衮的躯干”，并加注说明
  alternative: 只剩下大衮；只有大衮留在它上面
  rationale: 希伯来语末句本身异常且存在解释困难。上下文强烈指向失去头和手掌后所剩的偶像主体，但为避免掩盖原文含混，以脚注披露较直译形式。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“看哪”有意保留圣经叙事的突显语气；“雅威的约柜”按现代汉语领属结构表达。
