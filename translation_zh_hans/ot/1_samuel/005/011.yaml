  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יִּשְׁלְח֨וּ וַ/יַּאַסְפ֜וּ אֶת כָּל סַרְנֵ֣י פְלִשְׁתִּ֗ים וַ/יֹּֽאמְרוּ֙ שַׁלְּח֞וּ אֶת אֲר֨וֹן אֱלֹהֵ֤י יִשְׂרָאֵל֙ וְ/יָשֹׁ֣ב לִ/מְקֹמ֔/וֹ וְ/לֹֽא יָמִ֥ית אֹתִ֖/י וְ/אֶת עַמִּ֑/י כִּֽי הָיְתָ֤ה מְהֽוּמַת מָ֨וֶת֙ בְּ/כָל הָ/עִ֔יר כָּבְדָ֥ה מְאֹ֛ד יַ֥ד הָ/אֱלֹהִ֖ים שָֽׁם־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/005/011.yaml
  text: So they sent and gathered all the lords of the Philistines[a], and they said, “Send away the ark of the God of Israel, and let it return to its place, so that it may not kill us and our people.” For there was a deadly panic throughout the whole city[b]; the hand of God was very heavy there.
translation:
  language: zh_hans
  text: 于是，他们派人召集非利士人的所有首领，说：“把以色列上帝的约柜送走，让它回到原处，免得它杀死我和我的人民[c]。”原来，全城陷入了致命的恐慌[a]；上帝的手在那里压得极重[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “致命的恐慌”也可译作“死亡的恐慌”、“致死的混乱”或“致命的骚乱”。
    reason: 原文 מְהוּמַת מָוֶת 可指与死亡相伴、导致死亡或如死亡般可怕的惊乱。
  - marker: b
    text: “上帝的手……压得极重”是比喻，表示上帝在那里施行了极其严厉的审判。
    reason: 帮助现代读者理解原文保留下来的“手”之隐喻，而不在正文中将其释义化。
  - marker: c
    text: 原文是单数“我”和“我的人民”，可能是该城的一位统治者代表众人发言；有些译本按上下文译作“我们”和“我们的人民”。
    reason: 说明复数发言者与单数代词之间真实存在的语法张力。
lexical_decisions:
- source_word: סַרְנֵי
  choice: 首领
  rationale: 指非利士人各城邦公认的统治者；“首领”在现代汉语中清楚自然，也保留其政治身份。
- source_word: שַׁלְּחוּ
  choice: 送走
  rationale: 命令的重点是把约柜从城中移走；“送走”自然表达排除、遣离之意。
- source_word: אֲרוֹן אֱלֹהֵי יִשְׂרָאֵל
  choice: 以色列上帝的约柜
  rationale: 保留所属关系，表明这是属于以色列上帝的约柜。
- source_word: וְיָשֹׁב לִמְקֹמוֹ
  choice: 让它回到原处
  rationale: “让……回到”体现命令之后的祈使/愿望语气；“原处”自然表达其本来的地方。
- source_word: וְלֹא יָמִית אֹתִי וְאֶת עַמִּי
  choice: 免得它杀死我和我的人民
  rationale: “免得”准确表达防止所忧后果的语气；保留希伯来文第一人称单数，不按上下文擅自改成复数。
- source_word: מְהוּמַת מָוֶת
  choice: 致命的恐慌
  rationale: 该短语兼有混乱、惊恐及死亡威胁之意；“致命的恐慌”在现代汉语中简洁而有力度，同时不排除死亡已经发生的含义。
- source_word: בְּכָל הָעִיר
  choice: 全城
  rationale: 自然表达灾情遍及整座城的范围。
- source_word: כָּבְדָה מְאֹד יַד הָאֱלֹהִים
  choice: 上帝的手在那里压得极重
  rationale: 保留“手”这一重要的圣经隐喻，并以“压得极重”传达神施行审判所带来的沉重压力。
- source_word: הָאֱלֹהִים
  choice: 上帝
  rationale: 上下文已明确所指是以色列的上帝，故按现代汉语圣经语体译为“上帝”。
theological_decisions:
- issue: 是否保留“上帝的手”这一拟人化隐喻
  choice: 上帝的手在那里压得极重
  alternative: 上帝在那里严厉惩罚他们
  rationale: 原文明确使用“手”的隐喻，表达上帝主动施行大能和审判；保留它可维持经文内部的意象联系，又不必替原文作神学性释义。
- issue: 众人发言与“我和我的人民”这一单数表达之间的数不一致
  choice: 保留“我和我的人民”
  alternative: 改为“我们和我们的人民”
  rationale: 希伯来文代词后缀是单数，可能反映该城统治者或代表者的发言。保留单数并加注说明，可避免把原文的重要特征抹平。
- issue: 约柜作为“杀死”动作的语法主语
  choice: 免得它杀死
  alternative: 免得以色列的上帝杀死
  rationale: 原文最近的语法先行词是约柜，因此保留“它”；这可呈现约柜作为上帝临在与审判之载体的叙事表达，而不把代喻直接解释掉。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“约柜”“上帝的手”等关键圣经用语予以保留；句式简明，适合普通读者朗读和理解。
