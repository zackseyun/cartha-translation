base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/005/002.yaml
  text: So the Philistines took the ark of God and brought it into the house of Dagon[a], and set it beside Dagon.
translation:
  language: zh_hans
  text: 非利士人拿了上帝的约柜，把它带进大衮的殿[a]，放在大衮旁边。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“大衮的家”；这里指大衮的神庙。
    reason: 说明בֵּית דָּגוֹן的字面形式及其在本节语境中的含义。
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: 把……抬进（与后面的“带进”合译）
  rationale: לקח本义为“拿、取”；本句与后续וַיָּבִיאוּ构成连续动作。汉语用“把……抬进”自然表达他们取得约柜后将其带入殿中的动作；“抬”符合约柜作为实体器物的语境，但不增加“抢夺”等原文未明说的力度。
- source_word: פְלִשְׁתִּים
  choice: 非利士人
  rationale: 现代中文圣经及一般历史语境中对该族名的通行译法。
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: 上帝的约柜
  rationale: אֲרוֹן在此指以色列宗教语境中的神圣约柜；הָאֱלֹהִים是“上帝”，并非神名יהוה，因此不译作“耶和华的约柜”。
- source_word: וַיָּבִיאוּ אֹתוֹ
  choice: 抬进
  rationale: בוא使役式意为“带来、带进”。与前面的“拿”整合为自然汉语“把……抬进”，保留进入大衮之殿的方向。
- source_word: בֵּית דָּגוֹן
  choice: 大衮的殿
  rationale: בֵּית字面为“家、房屋”，在此语境指大衮的神庙。正文译为自然明确的“殿”，脚注保留字面表达“家”。
- source_word: וַיַּצִּיגוּ אֹתוֹ
  choice: 放在
  rationale: יצג使役式表示使某物站立、安置或摆放；“放在”是现代汉语中简洁自然的表达，不额外规定约柜的具体姿态。
- source_word: אֵצֶל דָּגוֹן
  choice: 大衮旁边
  rationale: אֵצֶל表示“在……旁边、附近”。原文只说“大衮”，未明说“神像”，故正文保留这一指称及其可能的含蓄性。
theological_decisions:
- issue: “上帝的约柜”中神的称谓
  choice: 上帝
  alternative: 耶和华
  rationale: 希伯来文是הָאֱלֹהִים，而不是יהוה；依原文保留本节实际使用的神圣称谓，不与其他经文协调改写。
- issue: 第二个“大衮”的所指
  choice: 仍译“大衮”
  alternative: 大衮神像
  rationale: 殿内语境很可能指大衮的祭祀神像，但原文仅写דָּגוֹן。直接译作“大衮”可保留原文将神祇与其像不加明说区分的表达。
translation_notes:
  register: 采用现代、庄重且易懂的叙事文体。“非利士人”“上帝的约柜”“大衮”沿用通行专名；以“殿”避免“家”在现代汉语中造成普通住所的误解，同时用脚注保存希伯来文的字面意象。
