base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/005/005.yaml
  text: Therefore, to this day the priests of Dagon and all who enter Dagon's temple in Ashdod do not step on Dagon's threshold[a][b].
translation:
  language: zh_hans
  text: 因此，直到今日，大衮的祭司和所有进入亚实突大衮庙的人，都不踩在大衮的门槛上[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “踩在”也可译作“踏在”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“大衮的房屋”；这里译作“大衮庙”，因为上下文所指的是供奉大衮的宗教场所。
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: 因此
  rationale: 承接上一节大衮倒在门槛上的事件，清楚保留因果关系。
- source_word: לֹא יִדְרְכוּ
  choice: 都不踏
  rationale: דרך表示“踏、踩”；“不踏门槛”既贴近原文，也自然表达持续至叙述者当时的惯例。
- source_word: כֹהֲנֵי דָגוֹן
  choice: 大衮的祭司
  rationale: 直接呈现原文的属格结构及异教祭司身份。
- source_word: וְכָל הַבָּאִים בֵּית דָּגוֹן
  choice: 和所有进入……大衮庙的人
  rationale: בוא接“房屋”在此表示进入；“庙”准确传达该建筑是供奉大衮的宗教场所。
- source_word: עַל מִפְתַּן דָּגוֹן
  choice: 大衮的门槛
  rationale: 保留原文再次使用“大衮”以及מִפְתָּן“门槛”的具体意象，不擅自改写为别的对象。
- source_word: בְּאַשְׁדּוֹד
  choice: 亚实突
  rationale: 将地点自然置于“大衮庙”之前，表明该庙位于亚实突。
- source_word: עַד הַיּוֹם הַזֶּה
  choice: 直到今日
  rationale: 保留这一习俗一直延续到叙述者当时的时间含义。
