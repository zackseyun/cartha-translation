base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/005/008.yaml
  text: So they sent and gathered all the lords of the Philistines to themselves[a], and said, “What shall we do with the ark of the God of Israel?” And they said, “Let the ark of the God of Israel be brought around to Gath.” So they brought the ark of the God of Israel around.
translation:
  language: zh_hans
  text: 于是，他们派人把非利士人的所有首领召集到他们那里[a]，说：“我们该怎样处置以色列上帝的约柜呢？”他们说：“把以色列上帝的约柜转送到迦特去。”于是，他们把以色列上帝的约柜转送了过去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“召集到自己这里。”原文指众首领来到发出召集者所在之处。
    reason: 代词指向及中文表达可有不同处理。
lexical_decisions:
- source_word: וַיִּשְׁלְחוּ וַיַּאַסְפוּ
  choice: 派人……召集
  rationale: 两个连续动词直译为“他们派出并召集”；现代汉语用“派人召集”自然表达差遣使者召集众首领，同时保留两个动作的关系。
- source_word: סַרְנֵי פְלִשְׁתִּים
  choice: 非利士人的所有首领
  rationale: סֶרֶן是非利士城邦统治者的专称；“首领”既有分量，也避免“王子”所暗示的世袭王族含义。
- source_word: אֲלֵיהֶם
  choice: 到他们那里
  rationale: 该介词短语表示众首领被召到发出召集者所在之处；此译法自然保留地点和归向含义。
- source_word: מַה נַּעֲשֶׂה לַאֲרוֹן
  choice: 我们该怎样处置……约柜呢
  rationale: 未完成式在此表达商议；ל与宾语在此意为如何对待或处理约柜，“怎样处置”符合中文议事语气。
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: 以色列上帝
  rationale: 按构造短语直译，指以色列的上帝；“上帝”是庄重而通行的现代汉语称谓。
- source_word: גַּת
  choice: 迦特
  rationale: 采用该非利士城市名称的通行中文音译。
- source_word: יִסֹּב / וַיַּסֵּבּוּ
  choice: 转送到……去／转送了过去
  rationale: סבב含转向、绕行或使之转移之意；上下文是将约柜从一城送往另一城。“转送”体现移动和移交，却不擅自规定具体运输方式；前后用词保持呼应。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“派人……召集”避免希伯来语连续动词的生硬直译；“该怎样处置”保留集体商议的语气；末句以“转送”呼应前句，并保留原文对具体运输方式的不明确性。
