base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/005/006.yaml
  text: And the hand of Yahweh was heavy against the people of Ashdod[a], and he devastated them and struck them with tumors, Ashdod and its territory.
translation:
  language: zh_hans
  text: 雅威的手重重地压在亚实突人身上；他使他们遭受毁灭，又以肿块[a]击打他们；亚实突和它的全境都受了击打。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“肿胀”；传统上也有更具体地译作“痔疮”的。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּכְבַּד יַד יְהוָה
  choice: 雅威的手重重地压在……身上
  rationale: 保留希伯来文“手”与“沉重”的具体意象，同时用现代汉语自然表达雅威施行强力审判的含义。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译呈现四字神名，表明这里是以色列之神的专名，而不是仅用一个称号替代。
- source_word: אֶל הָאַשְׁדּוֹדִים
  choice: 压在亚实突人身上
  rationale: 该形式指亚实突的居民；介词在此表示敌对行动所针对的对象。
- source_word: וַיְשִׁמֵּם
  choice: 摧残他们
  rationale: 该动词表达使人荒废、遭受毁灭性打击；“摧残”既有力度，也适合这里灾祸临到人的语境。
- source_word: וַיַּךְ אֹתָם בָּעֳפָלִים
  choice: 使他们患上肿瘤
  rationale: 将“击打”所造成的疾病以自然汉语表达；“肿瘤”保留原词所指身体肿块的宽泛含义，不把病症过度具体化。
- source_word: אֶת אַשְׁדּוֹד וְאֶת גְּבוּלֶיהָ
  choice: 亚实突和它的全境都遭了击打
  rationale: 把后置的范围说明译成完整分句，清楚表明灾祸遍及城邑及其辖境，同时保留“击打”的审判意象。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: “雅威”较直接地音译神名，并避免把专名化为“主”等称号；“耶和华”虽是汉语传统译名，但反映较旧的拟音形式。
- issue: 灾病 בָּעֳפָלִים 的具体性质
  choice: 肿瘤
  alternative: 痔疮
  rationale: 原词可指肿块或肿胀，具体部位并不完全确定；正文采用较宽泛的“肿瘤”，脚注保留传统的具体解释，以免消除原文的不确定性。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。保留“雅威的手重重地压在……身上”的希伯来语具体意象；末句改成完整汉语分句，以清楚表达灾祸所及的地理范围。
