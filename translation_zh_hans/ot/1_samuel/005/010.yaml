  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַֽ/יְשַׁלְּח֛וּ אֶת אֲר֥וֹן הָ/אֱלֹהִ֖ים עֶקְר֑וֹן וַ/יְהִ֗י כְּ/ב֨וֹא אֲר֤וֹן הָ/אֱלֹהִים֙ עֶקְר֔וֹן וַ/יִּזְעֲק֨וּ הָֽ/עֶקְרֹנִ֜ים לֵ/אמֹ֗ר הֵסַ֤בּוּ אֵלַ/י֙ אֶת אֲרוֹן֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל לַ/הֲמִיתֵ֖/נִי וְ/אֶת עַמִּֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/005/010.yaml
  text: So they sent the ark of God to Ekron. But when the ark of God came to Ekron, the Ekronites cried out, saying, “They have brought around to me the ark of the God of Israel, to kill me and my people!”
translation:
  language: zh_hans
  text: 于是，他们把神的约柜送到以革伦。神的约柜一到以革伦，以革伦人就喊叫说：“他们把以色列神的约柜转送到我这里，是要害死我和我的人民！”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: 神的约柜
  rationale: “约柜”是现代汉语圣经语境中对 אֲרוֹן 的准确、通行译法；保留属格“神的”。
- source_word: עֶקְרוֹן / הָעֶקְרֹנִים
  choice: 以革伦 / 以革伦人
  rationale: 采用通行地名音译，并以“人”表达该城居民。
- source_word: הֵסַבּוּ אֵלַי
  choice: 他们……转送到我这里
  rationale: הֵסַבּוּ 含使其转向、转移之意；“转送”既承接约柜从别城移来，也符合自然汉语。
- source_word: לַהֲמִיתֵנִי
  choice: 是要害死我
  rationale: 准确表达使役不定式“使我死”，并保留说话者对来意的判断。
- source_word: וַיִּזְעֲקוּ
  choice: 就喊叫
  rationale: 表达因恐惧或危急而大声呼喊，力度比普通“说”更强。
theological_decisions:
- issue: 引语中单数“我”与群体主语“以革伦人”的关系
  choice: 保留“我”和“我的人民”
  alternative: 译作“我们”和“我们的人民”
  rationale: 马所拉文本明确使用单数后缀 אֵלַי、לַהֲמִיתֵנִי、עַמִּי，可能把城市或群体人格化；译文不将其默改为复数，以保留原文张力。
- issue: “以色列神”的表达
  choice: 以色列神
  alternative: 以色列的神
  rationale: 两者皆可表达 אֱלֹהֵי יִשְׂרָאֵל；“以色列神”简洁自然，且不添加原文没有的神学说明。
translation_notes:
  register: 采用现代、庄重而清晰的叙事汉语。“一到……就……”自然呈现 וַיְהִי כְּבוֹא 的时间关系；引语保留原文突出的单数自称，不以解释性措辞消除其集体人格化现象。
