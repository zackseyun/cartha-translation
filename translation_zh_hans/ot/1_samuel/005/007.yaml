base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/005/007.yaml
  text: When the men of Ashdod saw that it was so[a], they said, “The ark of the God of Israel must not remain with us[b], because his hand is heavy against us and against Dagon our god.”
translation:
  language: zh_hans
  text: 亚实突人看见情形确实如此[a]，就说：“以色列神的约柜不可留在我们这里[b]，因为他的手重重压在我们和我们的神大衮身上。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“看见情形是这样”。原文指他们确认了上文所述的情形。
    reason: lexical_alternative
  - marker: b
    text: “留在”所译的希伯来语也可表示“坐下”或“居住”。这里指约柜继续停留在他们那里。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְאוּ אַנְשֵׁי אַשְׁדּוֹד
  choice: 亚实突人看见
  rationale: “亚实突人”自然概括该城的男性居民或代表人物；叙事性的 וַ 结合上下文译作顺承关系，不必机械译出“于是”。
- source_word: כִּי כֵן
  choice: 事情果然如此
  rationale: 该短语回指上文已经发生并被观察到的情形；“果然如此”既保留确认意味，也符合现代汉语叙事表达。
- source_word: לֹא יֵשֵׁב
  choice: 不可留在
  rationale: יָשַׁב 可指坐、居住或停留；约柜作主语时，“留在”最自然，并保留说话者要求其不再继续存在于当地的语气。
- source_word: אֲרוֹן אֱלֹהֵי יִשְׂרָאֵל
  choice: 以色列神的约柜
  rationale: 贴近原文所属结构，并与后文“我们的神大衮”形成叙事对照。
- source_word: קָשְׁתָה יָדוֹ
  choice: 他的手重重压在……身上
  rationale: 保留“手”这一拟人化意象，同时以“重重压在”自然表达原文“手沉重”的审判性力度。
- source_word: וְעַל דָּגוֹן אֱלֹהֵינוּ
  choice: 和我们的神大衮身上
  rationale: 保留非利士人自身的称呼视角，不把“神”改译为带解释性的“偶像”。
theological_decisions:
- issue: 如何处理“他的手沉重”这一神圣审判习语
  choice: 他的手重重压在我们和我们的神大衮身上
  alternative: 他的手严厉攻击我们和我们的神大衮
  rationale: 所选译法保留原文“手”的形象和沉重压力的隐喻，没有把它完全解释为抽象的惩罚或灾祸。
- issue: 大衮被称为“我们的神”
  choice: 按说话者视角译作“我们的神大衮”
  alternative: 我们的偶像大衮
  rationale: 原文记录亚实突人的自称；直译可保留叙事中的宗教对立，而不替叙述者加入原文没有的评价性措辞。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“约柜”沿用通行圣经术语；“手重重压在……身上”既可为普通读者理解，也保留希伯来语的具体形象。所有脚注标记均置于相关正文之后。
