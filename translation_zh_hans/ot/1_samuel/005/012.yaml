base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/005/012.yaml
  text: And the men who did not die were struck with tumors[a], and the cry of the city went up to heaven.
translation:
  language: zh_hans
  text: 那些没有死的人都受肿块之苦；全城的呼求上达于天。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָאֲנָשִׁים
  choice: 那些……的人
  rationale: אֲנָשִׁים在此指城中的人；现代汉语用“人”自然，也不把所指范围扩大为原文没有明说的“全城的人”。
- source_word: אֲשֶׁר לֹא מֵתוּ
  choice: 没有死
  rationale: 直译关系从句，明确区分死者与幸存者。
- source_word: הֻכּוּ
  choice: 都长了
  rationale: 该词是נכה的使役被动式，字面为“被击打”；与疾病名词搭配时，汉语用“长了”较自然，并保留他们遭受灾病的含义。
- source_word: בָעֳפָלִים
  choice: 肿瘤
  rationale: עֳפָלִים指身体上的肿块或肿瘤；“肿瘤”清楚而不过度限定具体病症。
- source_word: וַתַּעַל
  choice: 直达
  rationale: עלה本义为“上去”；在呼声上达天空的语境中，“直达”自然地传达向上达到的意象。
- source_word: שַׁוְעַת
  choice: 呼求
  rationale: שַׁוְעָה不只是一般哭声，也可指困苦中的求救呼喊；“呼求”保留这一求助意味。
- source_word: הָעִיר
  choice: 全城的
  rationale: 构造短语直译为“城的呼求”；汉语“全城的呼求”自然表达城中集体发出的哀求，但不将其改写成来源状语。
- source_word: הַשָּׁמָיִם
  choice: 上天
  rationale: שָׁמַיִם形式上为复数，在此表示天空或天上；“上天”符合呼声向上达到天际的汉语表达，又不明确增添“上帝”作为宾语。
theological_decisions:
- issue: 呼求升到天上的意涵
  choice: 直达上天
  alternative: 上达上帝
  rationale: 原文只说到达הַשָּׁמָיִם（天、天空），没有明说“上帝”；译文保留可能含有向神呼求的意味，却不把隐含意义明文化。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“全城的呼求直达上天”保留原文鲜明的上升意象；分号体现灾病与全城哀号之间的紧密联系。
