review_pass:
  verdict: revise
  source_fidelity: 译文准确传达了亚实突居民次日早起、发现大衮在雅威约柜前倒地，以及将其恢复原位的叙事。惟“脸伏于地，倒在……”将姿势与倒地动作重复并列，中文句法稍显滞涩；改为“仆倒在地，脸朝下”可同样完整保留原文的面朝地姿势与空间场景。
  naturalness: “次日清早”“亚实突人”“雅威的约柜”“放回原处”均自然且符合庄重的现代叙事语体。“看哪”虽带有较传统的书面色彩，但能恰当地保留 וְהִנֵּה 的突显作用。主要需要消除“脸伏于地，倒在”的重复和不顺。
  terminology: “亚实突”“大衮”“雅威”“约柜”译名一致、可接受；“雅威”忠实保留四字神名为专名。无需增添神学解释。
  issues:
  - severity: low
    issue: “脸伏于地，倒在雅威的约柜前”动作表达重复，搭配略不自然。
    rationale: 原文以“倒下”的状态和“面朝地”的姿势共同描写大衮；汉语宜以“仆倒在地，脸朝下”整合表达，避免“脸伏”后再接“倒在”的重复。
  revised_text: 次日清早，亚实突人起来，看哪，大衮仆倒在地，脸朝下，在雅威的约柜前。他们就把大衮放回原处。
