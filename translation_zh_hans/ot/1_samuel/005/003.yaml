  to: 次日清早，亚实突人起来，看哪，大衮仆倒在地，脸朝下，在雅威的约柜前。他们就把大衮放回原处。
  rationale: 仅作安全的文体与句法修订：以“仆倒在地，脸朝下”清楚、自然地表达大衮已经倒下且面向地面的姿势，同时保留其在雅威约柜前的空间位置。其余措辞均维持原译。
