base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/005/003.yaml
  text: When the Ashdodites rose early the next day, behold, Dagon had fallen facedown on the ground before the ark of Yahweh. So they took Dagon and put him back in his place.
translation:
  language: zh_hans
  text: 次日清早，亚实突人起来，看哪，大衮仆倒在地，脸朝下，在雅威的约柜前。他们就把大衮放回原处。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּשְׁכִּמוּ
  choice: 清早……起来
  rationale: שׁכם 的使役式在这里表示早起；译文保留“清早”的时间重点，同时符合现代汉语表达。
- source_word: אַשְׁדּוֹדִים
  choice: 亚实突人
  rationale: 该复数族称指亚实突的居民；“亚实突人”简洁、准确。
- source_word: מִמָּחֳרָת
  choice: 次日
  rationale: 该时间短语指紧接着的第二天；“次日”自然且庄重。
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: הִנֵּה 引导人物突然发现的惊人景象；“看哪”保留了叙事中的聚焦与震撼感。
- source_word: נֹפֵל
  choice: 倒在
  rationale: 该分词描述亚实突人发现大衮时已经倒下的状态；汉语“倒在”结合上下文即可自然表达这一结果状态。
- source_word: לְפָנָיו אַרְצָה
  choice: 脸伏于地
  rationale: 该短语直指面朝地的屈伏姿态；“脸伏于地”既贴近希伯来文意象，也清楚呈现大衮受辱般的姿势。
- source_word: לִפְנֵי אֲרוֹן יְהוָה
  choice: 在雅威的约柜前
  rationale: לִפְנֵי 在此表示空间位置，“在……前”准确自然；“约柜”是 אֲרוֹן 在本语境中的通行译法。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语中常见的音译呈现四字神名，保留其作为专名的性质，不以称号替代。
- source_word: וַיִּקְחוּ אֶת־דָּגוֹן
  choice: 他们就把大衮
  rationale: לקח 的基本义是“拿、取”；在把字句中，动作由后面的“放回”完整表达，无须加入原文未明说的“抬起”。
- source_word: וַיָּשִׁבוּ אֹתוֹ לִמְקוֹמוֹ
  choice: 放回原处
  rationale: שׁוב 的使役式表示使其返回原来的位置；“放回原处”是自然、准确的现代汉语，也符合搬动神像的语境。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华／上主
  rationale: 原文直接使用四字神名。译作“雅威”可把它保留为专名，并避免以“上主”这一称号取代；“耶和华”虽有悠久汉译传统，但“雅威”更接近当代学界通常采用的读音重构。
- issue: 大衮倒地姿势所呈现的神学张力
  choice: 脸伏于地
  alternative: 面朝下倒在地上
  rationale: 原文的姿势既是具体空间描写，也容易使人联想到在雅威约柜前俯伏。译文保留这一意象，但不额外说明大衮是在“敬拜”，以免把叙事暗示解释得过满。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“看哪”刻意保留原文突显意外发现的语气；句式避免过度古雅。“脸伏于地，倒在……”兼顾希伯来文的身体姿态与汉语可读性。
