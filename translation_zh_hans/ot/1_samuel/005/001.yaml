  text: The Philistines had taken the ark of God and brought it from Ebenezer to Ashdod[a].
translation:
  language: zh_hans
  text: 非利士人拿了上帝的约柜，把它从以便以谢带到亚实突。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּפְלִשְׁתִּים
  choice: 非利士人
  rationale: ו 在这里承接并转换叙事场景，现代汉语无需机械译出“和”；“非利士人”是该族名通行译法。
- source_word: לָקְחוּ
  choice: 夺走了
  rationale: לקח 的基本义是“拿、取”；结合战后夺取约柜的语境，“夺走了”自然表达其行动及结果，同时不必仿照英语使用过去完成时。
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: 上帝的约柜
  rationale: 直译结构为“上帝的柜”；“约柜”是现代汉语圣经语境中对此圣物清楚而通行的名称，“上帝的”保留原文所属关系。
- source_word: וַיְבִאֻהוּ
  choice: 把它……运到
  rationale: בוא 的使役式在此表示“带来、运去”，阳性单数后缀指约柜；“运到”既符合地点转移，也不额外限定具体搬运方式。
- source_word: מֵאֶבֶן הָעֵזֶר
  choice: 从以便以谢
  rationale: מִן 表示起点“从”；“以便以谢”采用该地名通行音译。
- source_word: אַשְׁדּוֹדָה
  choice: 到亚实突
  rationale: 词尾方向式 ה 表示朝向亚实突，现代汉语自然译作“到亚实突”；“亚实突”为通行地名译法。
theological_decisions:
- issue: אֲרוֹן 是否译作“柜”或“约柜”
  choice: 上帝的约柜
  alternative: 上帝的柜
  rationale: 本节虽未出现“约”一词，但所指圣物在汉语中惯称“约柜”；只译“柜”容易被普通读者误解为一般箱柜。保留“上帝的”则忠实呈现原文的限定语。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。句首不机械补出“于是”或“那时”；用“把”字结构清楚连接夺取约柜与转运地点的动作。
