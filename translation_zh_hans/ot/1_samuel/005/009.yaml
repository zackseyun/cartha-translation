source:
  edition: WLC
  text: וַ/יְהִ֞י אַחֲרֵ֣י הֵסַ֣בּוּ אֹת֗/וֹ וַ/תְּהִ֨י יַד יְהוָ֤ה בָּ/עִיר֙ מְהוּמָה֙ גְּדוֹלָ֣ה מְאֹ֔ד וַ/יַּךְ֙ אֶת אַנְשֵׁ֣י הָ/עִ֔יר מִ/קָּטֹ֖ן וְ/עַד גָּד֑וֹל וַ/יִּשָּׂתְר֥וּ לָ/הֶ֖ם עפלים׀־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/005/009.yaml
  text: And after they had moved it around[a], the hand of Yahweh was against the city, causing a very great panic; and he struck the men of the city, from small to great, and tumors broke out on them.
translation:
  language: zh_hans
  text: 他们把约柜转移之后[a]，耶和华的手降在那城，使城里极其恐慌。他击打城里的男人，从小到大；他们身上长出了肿块。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “转移”原文也可译作“把它转过去”或“把它运到那里”；“它”指约柜。
    reason: 说明代词指向及使役动词的语义范围。
  - marker: b
    text: “长出了肿块”也可译作“肿块在他们身上发作”。原文描述身体肿胀物的出现，但没有明确其具体医学名称。
    reason: 保留罕见希伯来表达及病症辨识的不确定性，避免过度具体化为痔疮等诊断。
lexical_decisions:
- source_word: הֵסַבּוּ אֹתוֹ
  choice: 他们把约柜转移过去
  rationale: 希伯来文直译为“他们把它转移过去/使它绕过去”。代词所指是约柜；正文明确为“约柜”，使中文衔接自然。“转移过去”表达将约柜迁往该城，不额外规定路线或多次搬动。
- source_word: יַד יְהוָה
  choice: 耶和华的手
  rationale: 保留希伯来文“手”的意象，表达耶和华主动施展的大能与审判。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代简体中文读者最熟悉的专名形式译出四字神名，而不以“主”替代。
- source_word: מְהוּמָה גְּדוֹלָה מְאֹד
  choice: 极其恐慌
  rationale: מְהוּמָה可指混乱、骚动或惊恐；在全城遭神击打的语境中，“极其恐慌”自然地传达强烈程度，同时不扩写原因。
- source_word: וַיַּךְ
  choice: 他击打
  rationale: 动词为阳性单数，主语承接耶和华；“击打”保留原文具体而强烈的审判措辞。
- source_word: אַנְשֵׁי הָעִיר
  choice: 城里的男人
  rationale: אַנְשֵׁי明确为男性复数，故不泛化为“居民”或“人”。
- source_word: מִקָּטֹן וְעַד גָּדוֹל
  choice: 从小到大
  rationale: 贴近希伯来习语，并保留所指可能涉及年龄、地位或重要程度的开放性。
- source_word: וַיִּשָּׂתְרוּ לָהֶם עֳפָלִים
  choice: 他们身上都长出了肿块
  rationale: 罕见动词与名词组合表示身体肿胀物出现或发作；“长出了肿块”清楚而不过度诊断其具体病症。中文加入“都”自然承接前面的全范围表达。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。正文以现代中文圣经语境中最广为人知的“耶和华”译出专名，而非用称号“主”取代；“雅威”是较贴近学术拟音的可选译法。
- issue: “耶和华的手”与灾祸的施行者
  choice: 保留“耶和华的手”，并以“他击打”明确承接耶和华
  alternative: 将其弱化为“耶和华使城里受灾”
  rationale: 原文把城中的恐慌和击打直接归于耶和华的行动；译文保留这种神学张力，不淡化神施行审判的主体性。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。句式顺应中文信息流，同时保留“耶和华的手”“击打”“从小到大”等关键希伯来意象和习语。正文中的脚注标记[a]、[b]均与脚注对应。
