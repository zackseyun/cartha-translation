    issue: “耶和华的手攻击那城”不符合汉语中“手”作神圣权能隐喻的自然搭配。
    rationale: יַד־יְהוָה 是希伯来语惯用表达；本句说耶和华的手临到该城，带来灾祸。中文宜保留“手”的意象，同时采用“降在那城”等自然说法，避免把“手”处理成直接施行“攻击”动作的主语。
  - severity: low
    issue: “把约柜转移过去”中的“过去”指向不够明确。
    rationale: 本节本身未明说迁往的目的地；原文只说他们使它转移/绕行。译作“把约柜转移之后”既忠于原文，也避免中文方向补语的悬空感。
  revised_text: 他们把约柜转移之后[a]，耶和华的手降在那城，使城里极其恐慌。他击打城里的男人，从小到大；他们身上长出了肿块。[b]
