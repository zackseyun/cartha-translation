base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/007.yaml
  text: Then Saul said to his servants, “Find for me a woman who is a medium, so that I may go to her and inquire through her.” And his servants said to him, “Look, there is a woman who is a medium at En-dor.”
translation:
  language: zh_hans
  text: 扫罗对臣仆说：“给我找一个女灵媒[a]，我好去她那里，借她求问。”臣仆对他说：“看，隐多珥有一个女灵媒。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “女灵媒”：希伯来语原文直译近于“拥有欧卜的女人”；这里指从事与亡灵相关之求问活动的女子，具体做法不详。
    reason: 原词属于古代近东术语，其确切所指存在词义与文化背景上的不确定性。
lexical_decisions:
- source_word: בַּעֲלַת אוֹב
  choice: 女灵媒
  rationale: 这个希伯来语称谓直译近于“拥有欧卜（אוֹב）的女人”，指从事与亡灵相关之求问活动的女子。“女灵媒”在现代汉语中简明自然，也没有把难以确定的古代具体做法写得过于具体。
- source_word: וְאֶדְרְשָׁה בָּהּ
  choice: 借她求问
  rationale: 介词 בּ 可表达凭借或通过；“借她求问”保留扫罗以该女子为媒介进行求问的意思，又不擅自判定回答的来源或真实性。
- source_word: הִנֵּה
  choice: 看
  rationale: 以自然的现代汉语传达引人注意的语气。
- source_word: עֵין דּוֹר
  choice: 隐多珥
  rationale: 采用现代中文圣经读者较熟悉的地名音译。
theological_decisions:
- issue: 灵媒活动的性质及所得信息的来源
  choice: 仅陈述扫罗要借女灵媒求问
  alternative: 明确写成向死者、亡灵或邪灵求问
  rationale: 本节本身没有说明预期回应者的确切身份，也尚未判断这种媒介活动是否真实有效；译文保留叙事张力，不预先解释后文。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“臣仆”符合王室叙事语境；引语节奏简洁。“借她求问”刻意保留原文的媒介关系及神学上的未决性。
