base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/021.yaml
  text: The woman came to Saul[a], and when she saw that he was very terrified, she said to him, “Behold, your servant has obeyed your voice[b], and I have put my life in my hand and listened to your words that you spoke to me.”
translation:
  language: zh_hans
  text: 那女人来到扫罗跟前，见他惊恐万分，就对他说：“你看，你的婢女已经听从了你的话[a]，把自己的性命置于掌中[b]，也听了你对我所说的话。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“你的婢女听了你的声音”；这里表示她听从了扫罗的要求。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语惯用表达，字面为“把我的性命置于我的掌中”，意思是“冒着生命危险”。
    reason: idiom_explanation
lexical_decisions:
- source_word: וַתָּבוֹא הָאִשָּׁה אֶל שָׁאוּל
  choice: 那女人来到扫罗跟前
  rationale: 按叙事推进译出 wayyiqtol；“那女人”保留定冠词和上下文所指，不在本节另加“女巫”等身份称谓。“来到……跟前”自然表达向扫罗靠近。
- source_word: וַתֵּרֶא כִּי נִבְהַל מְאֹד
  choice: 见他惊恐万分
  rationale: נבהל可指惊慌、受惊或恐惧；结合上文及מְאֹד的强化作用，“惊恐万分”简洁而有力度。
- source_word: הִנֵּה
  choice: 请看
  rationale: 作为引起对方注意、加强申诉的谈话标记；“请看”兼顾尊卑语境和现代汉语的庄重自然。
- source_word: שָׁמְעָה שִׁפְחָתְךָ בְּקוֹלֶךָ
  choice: 婢女已经听从了你的话
  rationale: שִׁפְחָה是女性自谦的仆婢称谓，译作“婢女”可保留性别和谦卑语气；שׁמע בקול是听从、顺从的惯用表达。
- source_word: וָאָשִׂים נַפְשִׁי בְּכַפִּי
  choice: 把自己的性命放在手掌上
  rationale: 保留希伯来语以手掌托住性命的鲜明意象；其含义是冒生命危险，脚注加以说明。
- source_word: וָאֶשְׁמַע אֶת דְּבָרֶיךָ אֲשֶׁר דִּבַּרְתָּ אֵלָי
  choice: 也听了你对我所说的话
  rationale: 此处שׁמע带直接宾语，可译为“听”；语境仍含依从之意，但不与前一句惯用语完全合并，以保留原文措辞差别。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“婢女”用于当事人在君王面前的自谦，不表示对其法律身份作额外判断。正文保留“把性命放在手掌上”的原文意象，并用脚注解释。
