base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/013.yaml
  text: The king said to her[a], “Do not be afraid. What do you see?” And the woman said to Saul[b], “I see a divine being coming up from the earth.”
translation:
  language: zh_hans
  text: 王对她说：“不要害怕。你看见了什么[a]？”那女人对扫罗说：“我看见有神明[b]从地里上来。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “看见了”所译的希伯来语动词在形式上是完成式，也可译作“你看见了什么？”；按眼前情境，也可理解为“你看见什么？”。
    reason: lexical_alternative
  - marker: b
    text: “神明”所译的希伯来语 אֱלֹהִים 在形式上是复数，后面的“上来”也采用复数形式，因此可译作“诸神正在从地里上来”。不过下文随后以单数描述所见者，指涉因此并不完全确定。
    reason: alternative_reading
lexical_decisions:
- source_word: הַמֶּלֶךְ
  choice: 王
  rationale: 原文使用带定冠词的普通名词“王”，并未在此处直接说“扫罗王”；译作“王”保留叙事方式。
- source_word: אַל תִּירְאִי
  choice: 不要害怕
  rationale: 这是由 ירא 构成的否定命令；“不要害怕”是自然、庄重的现代汉语表达。
- source_word: כִּי מָה רָאִית
  choice: 你看见了什么
  rationale: רָאִית 在形式上是完成式，直译为“看见了什么”；在眼前异象的语境中，也可按即时意义理解为“看见什么”。汉语“看见了什么”既自然，也保留其完成式色彩。כִּי 在这里可承接安慰并引出询问，无须生硬译出“因为”。
- source_word: הָאִשָּׁה
  choice: 那女人
  rationale: 原文只称她为“那女人”，没有在本节使用“招魂妇”之类的解释性称谓。
- source_word: אֱלֹהִים
  choice: 一个神灵
  rationale: אֱלֹהִים 在形式上为复数，且后接复数分词；但上下文随即聚焦于一个显现者。译作“一个神灵”传达超自然存在的意思，又不把它认定为上帝；复数形式与另一种译法在脚注中保留。
- source_word: עֹלִים
  choice: 上来
  rationale: עלה 的分词表示向上的移动；“上来”符合现代汉语，也保留从地下出现的场景。
- source_word: מִן הָאָרֶץ
  choice: 从地里
  rationale: 该短语可指“从地、土地之中”。“从地里”自然呈现由下而上的图景，同时避免把 הָאָרֶץ 在这里误解为某一国家或地域。
theological_decisions:
- issue: 如何翻译妇人话中的 אֱלֹהִים
  choice: 一个神灵
  alternative: 神明／诸神
  rationale: 本节是在转述妇人所见，并非叙述者对显现者身份所作的明确神学判定。“一个神灵”不把显现者等同于上帝，也不强行引入多神论；原文复数形式及复数呼应则由脚注明确说明。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“王”“那女人”紧贴原文叙事称谓；引语使用现代中文标点。脚注保留完成式与复数形式造成的真实歧义，不在正文中把显现者认定为上帝、诸神或某一特定亡灵。
