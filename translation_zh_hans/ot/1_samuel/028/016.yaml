  text: וַ/יֹּ֣אמֶר שְׁמוּאֵ֔ל וְ/לָ֖/מָּה תִּשְׁאָלֵ֑/נִי וַ/יהוָ֛ה סָ֥ר מֵ/עָלֶ֖י/ךָ וַ/יְהִ֥י עָרֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/016.yaml
  text: And Samuel said[a], “Why then do you ask me, since Yahweh has turned away from you and has become your adversary?”
translation:
  language: zh_hans
  text: 撒母耳说：“既然雅威已经离开你，成了你的敌人[a]，你为什么还来问我呢？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“成了你的对头”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר שְׁמוּאֵל
  choice: 撒母耳说
  rationale: 以现代汉语自然的叙事句式表达连续叙事中的说话动作；不机械译出句首连接词。
- source_word: וְלָמָּה תִּשְׁאָלֵנִי
  choice: 你为什么还来问我呢
  rationale: וְ 在此承接前后逻辑，结合反问语气译为“还”；“问我”直接、自然，也保留 שאל 的基本含义。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文四字神名作音译，不以称号替代；“雅威”是现代汉语中清楚、通行的译法。
- source_word: סָר מֵעָלֶיךָ
  choice: 已经离开你
  rationale: סור 与 מֵעַל 连用表示从某人身边离去；“已经离开你”既贴近完成动作，也符合现代汉语表达。
- source_word: וַיְהִי עָרֶךָ
  choice: 成了你的敌人
  rationale: עָר 指敌手、对头；“敌人”在现代汉语中清楚有力，保留雅威转而敌对扫罗这一严厉含义。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用神的专名；正文采用较贴近通常学术复原读音的汉语音译“雅威”，避免用“主”等称号替换。
- issue: 雅威与扫罗关系的表述
  choice: 成了你的敌人
  alternative: 成了你的对头
  rationale: 原文 עָרֶךָ 明确表达敌对关系，不宜弱化为仅仅“不再帮助”或“不喜悦”；正文用自然而强烈的“敌人”，脚注保留“对头”这一较贴近名词色彩的译法。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。将原因从句置于反问句之前，使汉语逻辑顺畅，同时保留原文“离开你”与“成为你的敌人”之间的递进力度。
