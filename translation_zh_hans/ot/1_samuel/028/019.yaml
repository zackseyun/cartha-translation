source:
  edition: WLC
  text: וְ/יִתֵּ֣ן יְ֠הוָה גַּ֣ם אֶת יִשְׂרָאֵ֤ל עִמְּ/ךָ֙ בְּ/יַד פְּלִשְׁתִּ֔ים וּ/מָחָ֕ר אַתָּ֥ה וּ/בָנֶ֖י/ךָ עִמִּ֑/י גַּ֚ם אֶת מַחֲנֵ֣ה יִשְׂרָאֵ֔ל יִתֵּ֥ן יְהוָ֖ה בְּ/יַד פְּלִשְׁתִּֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/019.yaml
  text: And Yahweh will also give Israel with you into the hand of the Philistines[a], and tomorrow you and your sons will be with me[b]. Yahweh will also give the camp of Israel into the hand of the Philistines.
translation:
  language: zh_hans
  text: 耶和华也必把以色列连同你交在非利士人手中；明天，你和你的儿子们就要与我同在[a]。耶和华也必把以色列的营地[b]交在非利士人手中。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或理解为“与我一同死去”或“与我同在阴间”。希伯来文只说“与我同在”。
    reason: 保留עִמִּי的简短措辞及其对死后状态和地点的含混性。
  - marker: b
    text: 或译“军队”。这个希伯来词既可指“营地”，也可在这里指驻营的军队。
    reason: 说明מַחֲנֶה在军事语境中的两种相关含义。
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的专名译法，明确对应四字神名，不以普通称谓替代。
- source_word: וְיִתֵּן / יִתֵּן
  choice: 必……交在……手中
  rationale: נתן与בְּיַד连用表示交到对方权下；“交在……手中”既保留原文“手”的意象，也自然表达战败受制之意。“必”传达此处预告的确定语气。
- source_word: גַּם
  choice: 也
  rationale: 保留两处递进、追加的语气：扫罗之外，以色列及其营地也将遭遇同样结局。
- source_word: עִמְּךָ
  choice: 连同你
  rationale: 准确表达以色列将与扫罗一同被交付的意思，同时使中文句法清楚自然。
- source_word: בְּיַד פְּלִשְׁתִּים
  choice: 在非利士人手中
  rationale: 保留希伯来语惯用语的身体意象，在现代中文里也能自然表示落入对方权下。
- source_word: וּמָחָר
  choice: 明天
  rationale: 按原文时间次序直陈；用分号承接前句，使宣告的推进在中文中自然。
- source_word: וּבָנֶיךָ
  choice: 和你的儿子们
  rationale: בנים在本处特指扫罗的儿子们，不泛化为“孩子”。
- source_word: עִמִּי
  choice: 与我同在
  rationale: 原文只说“与我”，并未明言死亡、坟墓或阴间；此译保留其简洁和末世状态上的含混性。
- source_word: מַחֲנֵה יִשְׂרָאֵל
  choice: 以色列的营地
  rationale: מַחֲנֶה可指营地，也可转指军队；正文采用较贴近基本词义的“营地”，另以脚注注明语境中的另一可能。
theological_decisions:
- issue: “明天，你和你的儿子们就要与我同在”的确切含义
  choice: 正文仅译作“与我同在”
  alternative: “与我一同死去”、“与我同在阴间”或“到我所在之处”
  rationale: 上下文强烈暗示扫罗和他的儿子们次日将死，但希伯来文本身没有说明他们所处的确切状态或地点。直译可保留经文有关死后状态的张力，避免加入文本未明说的体系化解释。
translation_notes:
  register: 采用现代、庄重而清晰的叙事语言。“交在……手中”保留原文意象，也符合中文圣经语体；“与我同在”刻意保持简洁，不替经文界定死后状态。脚注标记均置于其所解释的词语之后。
