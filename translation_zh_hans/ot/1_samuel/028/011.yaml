base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/011.yaml
  text: Then the woman said[a], “Whom shall I bring up for you?” And he said, “Bring up Samuel for me.”
translation:
  language: zh_hans
  text: 妇人问：“我要为你把谁招上来[a]？”他说：“为我把撒母耳招上来。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“使……上来”。希伯来语动词原意是“使上来”或“带上来”，这里用于招魂的语境。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: 问
  rationale: 希伯来语直译为“说”，但其后是直接问句；现代汉语用“问”更自然，也不改变言语行为。
- source_word: הָאִשָּׁה
  choice: 妇人
  rationale: 指上下文中的隐多珥妇人；“妇人”庄重简洁，并与叙事语体相称。
- source_word: אֶת מִי
  choice: 谁
  rationale: אֶת标明直接宾语；现代汉语以“谁”自然表达宾语，不需另加格位形式。
- source_word: אַעֲלֶה
  choice: 我要……招上来
  rationale: עלה的使役式意为“使上来、带上来”。在招魂语境中，“招上来”既保留向上的空间意象，也自然传达召来之意；脚注注明较直译的表达。
- source_word: לָּךְ
  choice: 为你
  rationale: 介词ל在此为受益用法，表示替扫罗行这事。
- source_word: וַיֹּאמֶר
  choice: 他说
  rationale: 叙事连续式推进对话；汉语无需机械加入“然后”或“又”。
- source_word: אֶת שְׁמוּאֵל
  choice: 撒母耳
  rationale: אֶת不译；人名采用现代中文圣经通行译名“撒母耳”。
- source_word: הַעֲלִי
  choice: 把……招上来
  rationale: עלה的使役式阴性单数命令式，与前句保持词汇一致，并保留“上来”的原文意象。
- source_word: לִי
  choice: 为我
  rationale: 介词ל为受益用法，表示扫罗请求妇人替他行事。
theological_decisions:
- issue: 招魂语境中עלה的译法
  choice: 招上来
  alternative: 使……上来／召上来
  rationale: “招上来”保留原文“上来”的意象，同时符合现代汉语中招魂语境的表达；它不说明妇人如何施行，也不预断后来显现者的性质，因而保留叙事本身的神学张力。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。以“问”承接直接问句，避免生硬的“说”；“招上来”兼顾原文空间意象与语境可懂度。
