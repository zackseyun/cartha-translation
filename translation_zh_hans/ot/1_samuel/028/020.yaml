  source_fidelity: “直挺挺地”虽可试图表达 מְלֹא קוֹמָתוֹ（全身/全长倒地），但在现代汉语中带有身体僵直、笔直的额外意象，原文并未明确此意。改为“全身倒在地上”更直接保留整个人倒地的画面。其余内容忠实表达了突然而至的跌倒、因撒母耳所说的话而极度惧怕、无力，以及整日整夜未进食。
  naturalness: 修订后的句子庄重、流畅，适合叙事文体。“全身倒在地上”比“直挺挺地倒在地上”更自然，且避免口语化和附加画面。
  terminology: “扫罗”“撒母耳”均为通行译名。“饼”对应 לֶחֶם，并以脚注保留其可泛指食物的词义范围，处理恰当。
