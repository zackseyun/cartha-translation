base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/020.yaml
  text: Saul immediately fell full length to the ground[a], and he was very afraid because of Samuel’s words. There was no strength in him either, because he had eaten no bread all that day and all that night.
translation:
  language: zh_hans
  text: 扫罗立刻全身倒在地上。他因撒母耳的话非常害怕；他也浑身无力，因为他整整一天一夜没有吃饼[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “饼”在希伯来语中也可泛指“食物”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמַהֵר
  choice: 立刻
  rationale: 该动词本义为“赶快、迅速行动”；此处修饰突然而至的倒地，用“立刻”自然表达其副词作用，不暗示有意奔忙。
- source_word: וַיִּפֹּל מְלֹא קוֹמָתוֹ אַרְצָה
  choice: 直挺挺地倒在地上
  rationale: וַיִּפֹּל取基本义“倒下”；מְלֹא קוֹמָתוֹ指身体全长着地，中文“直挺挺地倒在地上”自然传达整个人倒地，而不过度解释为昏厥。
- source_word: וַיִּרָא מְאֹד מִדִּבְרֵי שְׁמוּאֵל
  choice: 他因撒母耳的话非常害怕
  rationale: מְאֹד表示强烈程度；介词מִן在此表达原因，用“因……的话”准确而简洁。
- source_word: גַּם כֹּחַ לֹא הָיָה בוֹ
  choice: 他也浑身无力
  rationale: 直译为“他里面也没有力量”。“浑身无力”是自然现代汉语，表达身体毫无力气；“也”保留גַּם的附加关系，不加入“剩下”等原文未明说的成分。
- source_word: לֹא אָכַל לֶחֶם
  choice: 没有吃饼
  rationale: לֶחֶם既可专指饼，也可泛指食物。正文保留具体词“饼”，脚注说明其广义可能。
- source_word: כָּל הַיּוֹם וְכָל הַלָּיְלָה
  choice: 整整一天一夜
  rationale: 保留白昼和夜晚的完整时段，同时采用自然、凝练的现代汉语表达。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“直挺挺地倒在地上”具体呈现全身倒地的画面；分号连接恐惧与体力耗尽两方面的状态。脚注标记置于“饼”后，与其所解释的词直接对应。
