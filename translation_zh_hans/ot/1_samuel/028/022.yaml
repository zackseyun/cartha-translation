revisions:
- from: 现在，也请你听从你婢女的话。让我在你面前摆上一点饼；请吃吧，好让你有力气，因为你还要赶路。
  to: 现在，请你也听从你婢女的话，让我在你面前摆上几块饼。请吃吧，好让你有力气，因为你还要上路。
  rationale: 将“也”置于“你”后，清楚保留“你也要听从”的强调；以“几块饼”表达一份小块饼食；以“还要上路”避免“赶路”所可能附加的匆促意味。其余译法忠实且自然，予以保留。
