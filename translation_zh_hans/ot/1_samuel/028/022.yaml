  text: וְ/עַתָּ֗ה שְׁמַֽע נָ֤א גַם אַתָּה֙ בְּ/ק֣וֹל שִׁפְחָתֶ֔/ךָ וְ/אָשִׂ֧מָה לְ/פָנֶ֛י/ךָ פַּת לֶ֖חֶם וֶ/אֱכ֑וֹל וִ/יהִ֤י בְ/ךָ֙ כֹּ֔חַ כִּ֥י תֵלֵ֖ךְ בַּ/דָּֽרֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/022.yaml
  text: Now then[a], please listen, you also, to the voice of your female servant, and let me set a piece of bread before you. Eat, so that there may be strength in you[c][b], because you must go on your way.
translation:
  language: zh_hans
  text: 现在，请你也听从你婢女的话，让我在你面前摆上几块饼。请吃吧，好让你有力气，因为你还要上路。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: 现在
  rationale: 作话语转换标记，引出紧迫的劝请；现代汉语用“现在”自然明晰，无须机械补出“所以”。
- source_word: שְׁמַע נָא גַם אַתָּה
  choice: 也请你听从
  rationale: נָא使命令语气缓和为恳求；גַם אַתָּה强调扫罗也应当回应她。“也请你”保留这种相互回应的意味。
- source_word: בְּקוֹל שִׁפְחָתֶךָ
  choice: 你婢女的话
  rationale: “听从……的话”自然表达希伯来语“听某人的声音”即听从、采纳其请求的惯用义；“婢女”保留שִׁפְחָה的女性身份及说话者自谦语气。
- source_word: וְאָשִׂמָה לְפָנֶיךָ
  choice: 让我在你面前摆上
  rationale: 第一人称祈愿式表达主动请求或提议；“让我……”准确传达其意愿，而非单纯陈述未来。
- source_word: פַּת לֶחֶם
  choice: 一点饼
  rationale: פַּת指一小块或少量；在食物语境中“一点饼”比“一块面包”更贴近古代饼食，也符合现代中文表达。
- source_word: וֶאֱכֹל
  choice: 请吃吧
  rationale: 原文为命令式；结合全句恳请语气，以“请……吧”自然传达温和劝请。
- source_word: וִיהִי בְךָ כֹּחַ
  choice: 好让你有力气
  rationale: 保留祈愿式所表达的目的或预期结果；中文以“好让”自然呈现，并明确为行路所需的体力。
- source_word: כִּי תֵלֵךְ בַּדָּרֶךְ
  choice: 因为你还要赶路
  rationale: כִּי说明进食的理由；未完成体指即将发生的行动。“还要赶路”符合上下文中的实际需要，但不把语气强化为原文未明说的强制命令。
theological_decisions: []
