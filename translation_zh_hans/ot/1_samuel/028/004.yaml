  yaml_path: translation/ot/1_samuel/028/004.yaml
  text: The Philistines gathered and came and camped at Shunem[a], and Saul gathered all Israel[b], and they camped at Gilboa.
translation:
  language: zh_hans
  text: 非利士人聚集起来，来到书念安营；扫罗召集全体以色列人，他们在基利波安营。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在基利波”也可译作“在基利波山”或“在基利波山区”；原文只写地名“基利波”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקָּבְצוּ
  choice: 聚集起来
  rationale: קבץ表示聚集、集合；此处保留军事集结的语境，同时不把动词强化为较具解释性的“集结军队”。
- source_word: פְלִשְׁתִּים
  choice: 非利士人
  rationale: 采用现代中文圣经与历史叙事中通行的族名译法。
- source_word: וַיָּבֹאוּ
  choice: 来到
  rationale: בוא是一般性的移动动词；译作“来到”保留叙事推进，不额外加入“进军”等军事含义。
- source_word: וַיַּחֲנוּ
  choice: 安营
  rationale: חנה指驻扎、扎营；“安营”简洁庄重，也适合古代军事叙事。两次出现均保持一致。
- source_word: בְשׁוּנֵם
  choice: 在书念
  rationale: 介词ב与地名连用，表示驻营地点；中文自然译为“在书念”。
- source_word: וַיִּקְבֹּץ
  choice: 召集
  rationale: 同样来自קבץ；主语扫罗主动集合以色列众人，中文“召集”自然体现其发起者角色，又不过度限定为征兵或点兵。
- source_word: כָּל יִשְׂרָאֵל
  choice: 全以色列人
  rationale: 保留集体性表达，不擅自缩窄为“以色列所有男子”或“全军”。补出“人”符合现代中文习惯。
- source_word: בַּגִּלְבֹּעַ
  choice: 在基利波
  rationale: 原文只有地名，没有明说“山”；正文不增添地形说明，以脚注交代也可理解为基利波山区或基利波山。
