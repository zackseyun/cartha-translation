base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/012.yaml
  text: When the woman saw Samuel[a], she cried out with a loud voice, and the woman said to Saul, “Why have you deceived me? You are Saul!”
translation:
  language: zh_hans
  text: 那女人看见撒母耳[a]，就大声喊叫。女人对扫罗说：“你为什么欺骗我？你就是扫罗！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“看似撒母耳。”希伯来文只说“撒母耳”，没有解释这次显现的性质。
    reason: 保留原文对显现性质的含混性，并提示一种解释性译法。
lexical_decisions:
- source_word: וַתֵּרֶא
  choice: 看见
  rationale: ראה在连续叙事形式中表示直接看见；“看见”自然准确，不额外解释为主观感知。
- source_word: הָאִשָּׁה
  choice: 那女人
  rationale: 原文使用普通名词“女人”，本节不以角色称谓称她为“招魂者”；“那女人”也承接上文已知人物。
- source_word: אֶת שְׁמוּאֵל
  choice: 撒母耳
  rationale: 原文直接以专名“撒母耳”为动词宾语，正文照译，不添加“灵”“幻影”等解释性限定。
- source_word: וַתִּזְעַק בְּקוֹל גָּדוֹל
  choice: 就大声喊叫
  rationale: זעק表示强烈呼喊，בְּקוֹל גָּדוֹל加强音量；此译简洁自然，并保留反应的强烈程度。
- source_word: וַתֹּאמֶר ... לֵאמֹר
  choice: 说
  rationale: 现代汉语无需重复译出“说……说道”，单用“说”即可自然表达。
- source_word: לָמָּה רִמִּיתָנִי
  choice: 你为什么欺骗我
  rationale: לָמָּה为“为什么”；רמה的加强词干在此指欺骗，译法清楚且符合语境。
- source_word: וְאַתָּה שָׁאוּל
  choice: 你就是扫罗！
  rationale: 独立代词带有强调意味；“就是”在现代汉语中自然体现身份被识破的强调语气。
theological_decisions:
- issue: 是否在正文中把“撒母耳”限定为幻影、灵体或看似撒母耳者
  choice: 正文直接译作“撒母耳”
  alternative: “看起来像撒母耳的形象”或“撒母耳的灵”
  rationale: 希伯来文只说女人看见“撒母耳”，并未在本节解释其显现的性质。正文保留这一直接表述，以免替经文解决有争议的神学问题；脚注提示其未说明之处。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“那女人”承接上下文；“大声喊叫”传达强烈反应；引语中的“就是”体现原文独立代词的强调。
