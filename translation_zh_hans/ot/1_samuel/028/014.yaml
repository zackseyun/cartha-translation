base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/014.yaml
  text: He said to her[a], “What is his appearance?” And she said, “An old man is coming up, and he is wrapped in a robe.” Then Saul knew that it was Samuel[c][b], and he bowed with his face to the ground and prostrated himself.
translation:
  language: zh_hans
  text: 扫罗问她：“他是什么样子？”她说：“有一个老人正在上来[a]，披着一件外袍[b]。”扫罗就知道那是撒母耳，于是屈身，脸伏于地，俯伏下拜[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“正在升上来”或“正在上升”。希伯来语分词强调正在进行的向上运动。
    reason: lexical_alternative
  - marker: b
    text: 或译“身上裹着一件外袍”或“穿着一件外袍”。希伯来语的表达比单纯的“穿着”更突出披裹在身上的形象。
    reason: lexical_alternative
  - marker: c
    text: 此处的动词也可译作“俯伏”或“下拜”；在某些语境中，这个词也可译作“敬拜”。这里描写的是扫罗向那位被认作撒母耳者深深俯伏的动作。
    reason: alternative_reading
lexical_decisions:
- source_word: תָּאֳרוֹ
  choice: 他是什么样子
  rationale: תֹּאַר指可见的形貌或外观。用现代汉语的问句“他是什么样子”自然清楚，也保留扫罗要求辨认其形貌的意思。
- source_word: אִישׁ זָקֵן
  choice: 一个老人
  rationale: 该短语直指年老的男性；“一个老人”简洁、自然，不增添原文没有的特征。
- source_word: עֹלֶה
  choice: 正在上来
  rationale: 希伯来语分词表达正在进行的动作，而עלה明确包含向上的空间方向；“正在上来”兼顾两者。
- source_word: עֹטֶה מְעִיל
  choice: 身上裹着一件外袍
  rationale: עֹטֶה比普通的“穿着”更有披裹、包覆之意；מְעִיל是外袍或长袍。“裹着一件外袍”保留了这一鲜明形象。
- source_word: וַיֵּדַע
  choice: 扫罗就知道
  rationale: ידע通常意为“知道”，此处依描述而认定其身份；“就知道”紧贴原文，并让上下文表达自然。
- source_word: כִּי שְׁמוּאֵל הוּא
  choice: 那是撒母耳
  rationale: 希伯来语直译近于“他是撒母耳”，现代汉语在凭描述确认身份时说“那是撒母耳”更自然。
- source_word: וַיִּקֹּד אַפַּיִם אַרְצָה
  choice: 屈身，脸伏于地
  rationale: 该表达具体描写向下屈身、脸朝地面的姿态；此译保留身体动作和方向。
- source_word: וַיִּשְׁתָּחוּ
  choice: 俯伏下拜
  rationale: 该动词可表示敬重性的俯伏，也可在某些语境指敬拜。“俯伏下拜”描写动作及敬意，却不预先断定这是宗教性敬拜。
theological_decisions:
- issue: 扫罗向被认作撒母耳的形象所行的动作是否应明确译为宗教性的“敬拜”
  choice: 译作“俯伏下拜”
  alternative: 敬拜；俯伏；行礼
  rationale: שׁחה的语义可涵盖俯伏致敬和敬拜。此处原文明确描述深度俯伏，却没有要求译者判定其行为具有何种确切的宗教性质；因此保留这种神学张力。
- issue: 叙述是否断言显现者客观上就是撒母耳
  choice: 保留“扫罗就知道那是撒母耳”这一叙事视角
  alternative: 扫罗认为那是撒母耳；扫罗认出他是撒母耳
  rationale: 原文明确说“扫罗知道那是撒母耳”，但这一认定紧接妇人的描述。译文不加“以为”来削弱原文，也不另作解释来解决显现者身份的神学争议。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“外袍”比“袍子”略显庄重，又不至于古奥；“屈身，脸伏于地，俯伏下拜”保留原文两个连续动词所呈现的加强动作。主语首处由上下文明确为扫罗，因此显明译出“扫罗”，以避免现代汉语代词指向含混。
