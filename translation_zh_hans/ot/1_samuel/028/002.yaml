base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/002.yaml
  text: David said to Achish[a], “Then you yourself will know what your servant can do.” And Achish said to David, “Very well[b], I will make you my bodyguard for all your days.”
translation:
  language: zh_hans
  text: 大卫对亚吉说：“那么，你自己就会知道仆人能做什么了[a]。”亚吉对大卫说：“好吧，我必立你永远作我的贴身护卫[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作：“仆人将做什么。”大卫的话有意说得含混。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“为我的头作守卫”，意思是作保护亚吉本人的贴身护卫。
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן（大卫的话）
  choice: 那么
  rationale: 在回应上一节时引出推论，现代汉语用“那么”自然，也保留承接和前瞻作用。
- source_word: אַתָּה תֵדַע
  choice: 你自己就会知道
  rationale: תֵדַע意为“知道”，明示的代词אַתָּה带有强调作用，以“你自己”体现这一语气。
- source_word: אֵת אֲשֶׁר יַעֲשֶׂה
  choice: 能做什么
  rationale: 字面是“将做什么”，但在语境中这句话可指仆人的本领或即将采取的行动；正文采用自然的能力表达，并用脚注保留字面选项和大卫言辞的含混。
- source_word: עַבְדֶּךָ
  choice: 仆人
  rationale: 这里是宫廷交谈中自谦的自称，并非明确陈述奴隶身份。
- source_word: לָכֵן（亚吉的话）
  choice: 好吧
  rationale: 这里表达亚吉接受大卫的说法并作出相应决定，“好吧”符合现代汉语应答语气。
- source_word: שֹׁמֵר לְרֹאשִׁי
  choice: 贴身护卫，保护我
  rationale: 字面为“为我的头作守卫”，是保护亚吉本人或性命的表达；译为“贴身护卫，保护我”既清楚传达职分，也通过脚注保留原文意象。
- source_word: אֲשִׂימְךָ
  choice: 我要立你作
  rationale: שׂים在此指设置、委任某人担任一种职分，“立你作”准确而庄重。
- source_word: כָּל הַיָּמִים
  choice: 终身
  rationale: 字面为“所有的日子”，在此表示持续终生；结合“保护我”，译作“终身”自然简洁。
theological_decisions:
- issue: 大卫的话究竟承诺参战，还是刻意回避明确承诺
  choice: 正文保留“能做什么”的开放表达，并在脚注注明字面译法
  alternative: 直接译为“将做什么”，使其较明显地指向未来行动
  rationale: 原文没有说明大卫将为谁而战或会采取什么行动；译文不应替叙事解除这种有意保留的张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“仆人”保留古代宫廷自谦语体；“贴身护卫”避免生硬直译，同时脚注保留希伯来语的“头”这一具体意象。
