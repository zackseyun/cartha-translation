base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/024.yaml
  text: The woman had a fattened calf in the house[a], and she hurried and slaughtered it. Then she took flour, kneaded it[c][b], and baked unleavened bread.
translation:
  language: zh_hans
  text: 那妇人家里有一头肥牛犊[a]，就赶紧把它宰了[b]；又拿面粉来揉成面团，烤成无酵饼[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“一头圈养育肥的牛犊”。
    reason: lexical_alternative
  - marker: b
    text: 这里指宰杀牲畜备餐；这个动词在有些语境中也可指为献祭而宰杀。
    reason: lexical_alternative
  - marker: c
    text: 或译：“未发酵的薄饼”。
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵגֶל מַרְבֵּק
  choice: 肥牛犊
  rationale: עֵגֶל 指幼小的牛，מַרְבֵּק 指为育肥而圈养或喂肥的牲畜。“肥牛犊”简洁自然，也保留了这头牛经过育肥的含义。
- source_word: בַּבַּיִת
  choice: 家里
  rationale: 原文是具体的处所表达；此处用“家里”比生硬的“房子里”更符合现代汉语，又不改变其空间含义。
- source_word: וַתְּמַהֵר
  choice: 就赶紧
  rationale: 该动词表达迅速行动。“赶紧”自然传达叙事中的急迫感，“就”承接前句而不增添原文没有的时间副词。
- source_word: וַתִּזְבָּחֵהוּ
  choice: 把它宰了
  rationale: זבח 有时用于献祭性的宰杀，但本段语境是备餐。“宰了”准确表达宰杀牲畜供食用，不引入祭祀含义。
- source_word: קֶמַח
  choice: 面粉
  rationale: 该名词指烘焙所用的粉，现代汉语用“面粉”最清楚自然。
- source_word: וַתָּלָשׁ
  choice: 揉成面团
  rationale: 该动词指揉制面团。原文宾语承接面粉；汉语补出结果“面团”，可自然呈现制作过程而不改变信息。
- source_word: וַתֹּפֵהוּ מַצּוֹת
  choice: 烤成无酵饼
  rationale: אפה 是烤制，מַצּוֹת 是未发酵的饼类。“烤成无酵饼”既保留动作及结果，也符合中文圣经语体。
theological_decisions:
- issue: וַתִּזְבָּחֵהוּ 是否带有献祭含义
  choice: 按备餐语境译为“宰了”
  alternative: “把它献为祭”或“把它祭杀了”
  rationale: 上下文描述为扫罗及其仆人预备食物，没有祭坛、献祭对象或礼仪行动，因此不应把该词在其他语境可能具有的祭祀意义强加于此。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“那妇人”承接上下文，不额外添加“现在”等时间标记；用分号呈现宰牛与制饼两组连续的备餐动作。所有脚注标记均紧随相关词语。
