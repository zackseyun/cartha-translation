base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/010.yaml
  text: So Saul swore to her by Yahweh[a], saying, “As Yahweh lives, no punishment will come upon you in this matter.”
translation:
  language: zh_hans
  text: 扫罗就指着雅威向她起誓说：“我指着永活的雅威起誓，你绝不会因这事受惩罚。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你绝不会因这事担上罪责。”希伯来语“罪孽”一词也可指罪孽、罪责，或罪责所招致的惩罚。
    reason: 保留עָוֺן可表示罪孽、罪责或惩罚后果的词义范围。
lexical_decisions:
- source_word: וַיִּשָּׁבַע
  choice: 起誓
  rationale: 该词在此表示郑重发誓；“起誓”自然、庄重，并符合现代汉语表达。
- source_word: לָהּ
  choice: 向她
  rationale: 这里标明誓言所针对的对象；“向她起誓”是自然的现代汉语。
- source_word: בַּיהוָה
  choice: 指着雅威
  rationale: 介词表明起誓时所援引的对象；“指着雅威起誓”准确传达希伯来语誓言用法。
- source_word: חַי יְהוָה
  choice: 雅威永活
  rationale: 保留希伯来语固定的起誓公式及其简洁、郑重的语气；后接感叹号可让现代读者辨明其誓言性质。
- source_word: אִם
  choice: 绝不会
  rationale: 在誓言公式中，该词引出省略咒诅语的强烈否定；“绝不会”比按字面译作“如果”更清楚地传达实际语义。
- source_word: יִקְּרֵךְ
  choice: 临到你／受到
  rationale: 该动词表示某事发生在某人身上。结合汉语搭配，将整句译为“你……受到惩罚”，自然传达“惩罚临到你”的意思。
- source_word: עָוֺן
  choice: 惩罚
  rationale: 该词可指罪孽、罪责，也可指罪所招致的惩罚。此处扫罗保证妇人不会因所做之事承受后果，因此正文采用“惩罚”，并以脚注保留“罪责”的可能含义。
- source_word: בַּדָּבָר הַזֶּה
  choice: 因这事
  rationale: 在此语境中指正在商议的行为；“因这事”既自然，也清楚表达惩罚与该事之间的关联。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；采用“雅威”以音译方式保留其作为专名的性质，不以称号替代。
- issue: עָוֺן 在誓言中的含义
  choice: 惩罚
  alternative: 罪责
  rationale: 上下文重点是扫罗保证妇人不会承担这件事所带来的刑罚后果，而不是宣告该行为本身无罪；脚注保留原词在“罪责”与“惩罚”之间的语义张力。
- issue: אִם 在誓言中的功能
  choice: 绝不会
  alternative: 如果……
  rationale: 这里的 אִם 属于希伯来誓言中省略咒诅后果的表达，实际构成强烈否定；直译为“如果”会使现代汉语句意残缺。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“雅威永活”保留原文誓言公式；“绝不会”传达誓言中的强烈否定。脚注标记置于“惩罚”所在句末，因为脚注解释的是 עָוֺן，而不是神名。
