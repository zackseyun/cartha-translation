  text: וַ/יִּתְחַפֵּ֣שׂ שָׁא֗וּל וַ/יִּלְבַּשׁ֙ בְּגָדִ֣ים אֲחֵרִ֔ים וַ/יֵּ֣לֶךְ ה֗וּא וּ/שְׁנֵ֤י אֲנָשִׁים֙ עִמּ֔/וֹ וַ/יָּבֹ֥אוּ אֶל הָ/אִשָּׁ֖ה לָ֑יְלָה וַ/יֹּ֗אמֶר קסומי נָ֥א לִ/י֙ בָּ/א֔וֹב וְ/הַ֣עֲלִי לִ֔/י אֵ֥ת אֲשֶׁר אֹמַ֖ר אֵלָֽיִ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/008.yaml
  text: So Saul disguised himself and put on other clothes[a], and he went, he and two men with him. They came to the woman by night, and he said, “Please divine for me by a medium, and bring up for me the one whom I name to you.”
translation:
  language: zh_hans
  text: 于是，扫罗改装，穿上别的衣服，带着两个人一同前往。他们夜里来到那妇人那里。扫罗说：“请用招魂术[a]为我占卜，把我将要告诉你的那个人给我召上来。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “招魂术”所译的希伯来词可指与求问死者有关的灵媒，也可能指相关的灵体；本句指借此进行招魂占卜。
    reason: 说明אוֹב的词义范围及其在本句中的用法，避免将其简单等同于一种已被确定的灵体或实践机制。
lexical_decisions:
- source_word: וַיִּתְחַפֵּשׂ
  choice: 改装
  rationale: 该词的反身词形表示扫罗改变自己的外表以隐藏身份；“改装”简洁自然，也符合上下文中换衣服的具体行动。
- source_word: בְּגָדִים אֲחֵרִים
  choice: 别的衣服
  rationale: 直译该短语，同时以现代汉语自然表达扫罗换上不同衣着来掩饰身份。
- source_word: וַיֵּלֶךְ הוּא וּשְׁנֵי אֲנָשִׁים עִמּוֹ
  choice: 带着两个人一同前往
  rationale: 表达扫罗本人和两名随从一起前往；汉语无需机械重复“他”，仍保留同行者的信息。
- source_word: לָיְלָה
  choice: 夜里
  rationale: 准确交代行动发生的时间，并自然传达叙事中的隐秘氛围。
- source_word: קָסֳמִי נָא לִי
  choice: 请……为我占卜
  rationale: קסם指占卜行为，נָא使请求语气较为委婉；“请……为我占卜”准确而通顺。
- source_word: בָּאוֹב
  choice: 用招魂术
  rationale: 本处与求问死者有关。“招魂术”在现代汉语中能清楚表达这种占卜方式，同时脚注保留原词可指亡灵或招魂者的词义幅度。
- source_word: וְהַעֲלִי לִי
  choice: 给我召上来
  rationale: עלה的使役式字面为“使上来”；“召上来”既保留向上而来的空间意象，也符合本段求问死者的语境。
- source_word: אֵת אֲשֶׁר אֹמַר אֵלָיִךְ
  choice: 我告诉你的那个人
  rationale: 该关系从句指扫罗将要向女人指定的人；此译法自然，并不增加原文没有的信息。
theological_decisions:
- issue: 如何译出招魂占卜用语而不预断其实际效力
  choice: 按叙事人物的请求直译为“用招魂术……占卜”和“召上来”
  alternative: 加入“假装召来”等怀疑性措辞，或明确说“使死者的灵魂显现”等强化性措辞
  rationale: 原文报告扫罗的请求，却未在本句解释这种行为的机制或效力。译文保留其概念和空间意象，不替叙事作神学判断。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“改装”“夜里”“占卜”“召上来”简洁清楚；避免古奥的“易服”“卜问”以及带有特定宗派解释的措辞。
