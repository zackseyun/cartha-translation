base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/001.yaml
  text: In those days the Philistines gathered their camps for war[a], to fight against Israel. And Achish said to David, “You surely know that you and your men must go out with me in the camp.”
translation:
  language: zh_hans
  text: 那些日子，非利士人集结各营[a]，准备作战，要攻打以色列。亚吉对大卫说：“你一定知道，你和你的人都要随我一同随军出征[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “各营”中的“营”也可译作“军队”。这里的希伯来词既可指营地或营寨，也可引申指驻营的军事队伍。
    reason: 保留 מַחֲנֵיהֶם 在具体营地与军事队伍之间的词义可能性，并将锚点置于所注词语之后。
  - marker: b
    text: 直译“在营中”。这里的希伯来词可指营地，也可指随行的军事队伍。
    reason: 说明 בַּמַּחֲנֶה 的字面意义，并保留其在军事语境中可指军队的可能性。
lexical_decisions:
- source_word: וַיְהִי בַּיָּמִים הָהֵם
  choice: 那些日子
  rationale: 这是希伯来叙事中转换场景的常用表达；译为“那些日子”简洁自然，不额外加入原文没有的“现在”。
- source_word: וַיִּקְבְּצוּ פְלִשְׁתִּים אֶת מַחֲנֵיהֶם
  choice: 非利士人聚集各营
  rationale: מַחֲנֶה 可指营地，也可转指驻营的军队；“聚集各营”保留原文的具体意象和词义张力。
- source_word: לַצָּבָא
  choice: 准备作战
  rationale: 该短语表达军事目的；“准备作战”符合现代汉语，也避免把 צָבָא 机械地只译成“军队”。
- source_word: לְהִלָּחֵם בְּיִשְׂרָאֵל
  choice: 要攻打以色列
  rationale: 准确表达针对以色列的敌对军事行动，在汉语中比“与以色列争战”更自然直接。
- source_word: יָדֹעַ תֵּדַע
  choice: 你一定知道
  rationale: 以不定式绝对形加强限定动词，具有强调语气；“一定知道”保留这一强调。
- source_word: אִתִּי תֵּצֵא
  choice: 都要随我出征
  rationale: 字面为“要同我出去”；在军事语境中“随我出征”自然传达亚吉所表达的明确要求或预期。
- source_word: בַמַּחֲנֶה
  choice: 出征
  rationale: מַחֲנֶה 可指营地或军事队伍；此处结合“出去”表示参加军事行动，汉语用“出征”较自然，而词义歧义在脚注中说明。
- source_word: אַתָּה וַאֲנָשֶׁיךָ
  choice: 你和你的人
  rationale: 保留对大卫本人及其随从的并列强调；“你的人”符合上下文且不把身份限定得过窄。
- source_word: אָכִישׁ
  choice: 亚吉
  rationale: 采用现代中文圣经中通行的人名译法。
