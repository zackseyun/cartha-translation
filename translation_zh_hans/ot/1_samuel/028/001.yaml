  source_fidelity: 译文总体准确传达了非利士人为攻击以色列而集结，以及亚吉要求大卫及其部下同行的意思。但原稿将首处“营”的词义脚注锚定在“作战”后，锚点与所注词语不对应；并且末句的“出征”未明确呈现 בַּמַּחֲנֶה（在营中／随军）的军事群体含义。
  naturalness: “那些日子”“非利士人”“亚吉对大卫说”均自然、庄重。“集结各营”比“聚集各营”更符合现代军事叙述；“随我一同随军出征”虽有重复的“随”，但准确区分“随我”与“随军”，且在经文语体中可接受。
  terminology: “非利士人、以色列、亚吉、大卫”采用通行中文圣经人名与族名。“营”保留具体营地和军事队伍的词义空间；末句用“随军”表达其在语境中指军事队伍的用法，并以脚注保留字面意义。
