  text: וַ/יֹּ֤אמֶר שְׁמוּאֵל֙ אֶל שָׁא֔וּל לָ֥/מָּה הִרְגַּזְתַּ֖/נִי לְ/הַעֲל֣וֹת אֹתִ֑/י וַ/יֹּ֣אמֶר שָׁ֠אוּל צַר לִ֨/י מְאֹ֜ד וּ/פְלִשְׁתִּ֣ים נִלְחָמִ֣ים בִּ֗/י וֵֽ/אלֹהִ֞ים סָ֤ר מֵֽ/עָלַ/י֙ וְ/לֹֽא עָנָ֣/נִי ע֗וֹד גַּ֤ם בְּ/יַֽד הַ/נְּבִיאִם֙ גַּם בַּ֣/חֲלֹמ֔וֹת וָ/אֶקְרָאֶ֣/ה לְ/ךָ֔ לְ/הוֹדִיעֵ֖/נִי מָ֥ה אֶעֱשֶֽׂה־־׀־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/015.yaml
  text: Then Samuel said to Saul[a], “Why have you disturbed me by bringing me up?” Saul answered, “I am in great distress. The Philistines are fighting against me, and God has turned away from me and no longer answers me, either by prophets or by dreams[b]. So I have called you to tell me what I should do.”
translation:
  language: zh_hans
  text: 撒母耳对扫罗说：“你为什么搅扰我，把我招上来呢？”扫罗说：“我非常苦恼。非利士人正在攻打我，神也离开了我，不再回答我，无论是借着众先知，还是借着梦[a]。所以我便呼唤你，好让你告诉我该怎么办。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “借着众先知”直译为“借众先知的手”；这是表示媒介或代理的希伯来语习语。
    reason: lexical_alternative
lexical_decisions:
- source_word: הִרְגַּזְתַּנִי
  choice: 搅扰我
  rationale: 该动词表示使人不安、受扰或震动。“搅扰”自然庄重，并适合此处把撒母耳从死者所在之处召来的语境。
- source_word: לְהַעֲלוֹת אֹתִי
  choice: 把我招上来
  rationale: 保留עלה“使上来”的空间意象，同时以“招”表达召唤；避免译成“使我复活”，因为原文并未明确使用复活术语。
- source_word: צַר לִי מְאֹד
  choice: 我非常苦恼
  rationale: 准确表达扫罗身处严重困境和内心痛苦的状态，符合现代汉语习惯。
- source_word: נִלְחָמִים בִּי
  choice: 正在攻打我
  rationale: לחם与介词ב连用表示敌对作战；“攻打我”清楚传达军事压力。
- source_word: וֵאלֹהִים סָר מֵעָלַי
  choice: 神也离开了我
  rationale: סור מעל表示从某人身边离开或撤去；此译保留扫罗所感受到的神的离弃，而不扩展为形而上的断言。
- source_word: וְלֹא עָנָנִי עוֹד
  choice: 不再回答我
  rationale: 自然体现עוד在否定句中“不再”的含义。
- source_word: גַּם בְּיַד הַנְּבִיאִם גַּם בַּחֲלֹמוֹת
  choice: 无论是借着众先知，还是借着梦
  rationale: 将 גם…גם 按否定语境译为“无论是……还是……”，并把“借着……的手”按希伯来语工具或代理习语译为“借着”。
- source_word: וָאֶקְרָאֶה לְךָ
  choice: 所以我呼求你
  rationale: קרא ל可表示向某人呼叫或求告。“呼求你”保留对撒母耳发出呼唤的表达，又不额外加入原文没有的技术性招魂术语。
- source_word: לְהוֹדִיעֵנִי מָה אֶעֱשֶׂה
  choice: 请你告诉我该怎么做
  rationale: הודיע为“使知道、告知”；整句用现代汉语自然表达扫罗寻求指引的请求。
theological_decisions:
- issue: 招魂叙事中说话者的身份
  choice: 按叙事表层直接译为“撒母耳对扫罗说”
  alternative: 加上“所谓的撒母耳”“撒母耳的幽灵”等解释性限定
  rationale: 希伯来文直接以撒母耳为主语。译文应忠实反映叙事呈现，不在本节内替读者裁决其本体身份或事件机制。
- issue: “把我招上来”的性质
  choice: 保留从下往上的空间意象，不译作复活
  alternative: 译为“使我复活”或仅译为“召来我”
  rationale: 原文עלה明确含“上来”意象，但并未使用明确的复活术语；兼译为“招上来”既自然又保留张力。
translation_notes:
  register: 采用现代、庄重且易懂的叙事语言。“搅扰”“招上来”保留原文的不安感和垂直空间意象；不添加“幽灵”“假冒”等解释性称谓。脚注标记[a]已置于正文相关短语之后。
