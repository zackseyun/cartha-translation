  yaml_path: translation/ot/1_samuel/028/025.yaml
  text: Then she brought it before Saul and before his servants[a], and they ate. Then they rose and went away that night.
translation:
  language: zh_hans
  text: 她把饭食摆在扫罗和他的仆人面前[a]，他们就吃了。随后他们起身，当夜离去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“她摆在扫罗和他的仆人面前”；宾语没有明说，可从上文看出是预备好的饭食。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּגֵּשׁ
  choice: 她把饭食摆在……面前
  rationale: 该使役形动词在此指把东西拿近并摆到人面前。希伯来文未明说宾语，但上文已经交代所预备的食物；中文为行文自然补出“饭食”，并用“摆在……面前”准确表达进餐场景。
- source_word: לִפְנֵי
  choice: 在……面前
  rationale: 保留该介词“在前面”的基本空间含义，也符合中文摆放饭食的惯用表达。
- source_word: עֲבָדָיו
  choice: 他的臣仆
  rationale: עֶבֶד 可指奴仆、仆人或臣属。此处是随同扫罗、为王服役的人；“臣仆”兼顾王室语境与从属身份，又不武断断定他们是奴隶。
- source_word: וַיֹּאכֵלוּ
  choice: 他们就吃了
  rationale: 原文没有明说宾语，中文也可自然省略；“就”体现连续叙事中紧接着发生的动作。
- source_word: וַיָּקֻמוּ
  choice: 随后他们起身
  rationale: “起身”自然、庄重，并保留吃完后站起来的叙事动作；“随后”呈现连续动作的推进。
- source_word: וַיֵּלְכוּ
  choice: 离去了
  rationale: הלך 基本义为“去、行走”。在此处他们起身后从妇人那里离开，译作“离去”自然表达语境中的方向，而不过度增添目的地。
- source_word: בַּלַּיְלָה הַהוּא
  choice: 在那夜
  rationale: 较贴近原文“在那一个夜里”的表达，并以简洁、略具叙事庄重感的现代中文呈现时间强调。
