id: 1SA.28.18
reference: 1 Samuel 28:18
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כַּ/אֲשֶׁ֤ר לֹֽא שָׁמַ֨עְתָּ֙ בְּ/ק֣וֹל יְהוָ֔ה וְ/לֹֽא עָשִׂ֥יתָ חֲרוֹן אַפּ֖/וֹ בַּ/עֲמָלֵ֑ק עַל כֵּן֙ הַ/דָּבָ֣ר הַ/זֶּ֔ה עָשָֽׂה לְ/ךָ֥ יְהוָ֖ה הַ/יּ֥וֹם הַ/זֶּֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/018.yaml
  text: Because you did not obey the voice of Yahweh and did not carry out his burning anger against Amalek[a], therefore Yahweh has done this thing to you today.
translation:
  language: zh_hans
  text: 因为你没有听从耶和华的话，也没有施行他向亚玛力人所发的烈怒[a]，所以耶和华今天使这事临到你。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“没有向亚玛力人执行他强烈的怒气。”原文直译近于“没有施行他鼻怒的燃烧”；此处指没有执行耶和华针对亚玛力人的审判。
    reason: 说明 עָשִׂיתָ חֲרוֹן אַפּוֹ 的字面怒气意象及“施行／执行”的可译性，而不将上下文的具体审判行动写入正文。
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: 因为
  rationale: 此处引出扫罗受审判的原因；用“因为”自然地表达因果关系。
- source_word: שָׁמַעְתָּ בְּקוֹל יְהוָה
  choice: 听从耶和华的话
  rationale: שׁמע בקול 在此不只是听见，更指顺从；“听从……的话”兼顾希伯来语意象和现代汉语习惯。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名形式音译四字神名，而不以称号替代。
- source_word: עָשִׂיתָ חֲרוֹן אַפּוֹ
  choice: 施行他的烈怒
  rationale: 原文直译近于“实行他怒气的燃烧”，在本段指执行针对亚玛力人的神圣审判；“施行他的烈怒”既保留行动含义，也符合庄重自然的汉语。
- source_word: חֲרוֹן אַפּוֹ
  choice: 他的烈怒
  rationale: חֲרוֹן אַף 带有怒气炽烈、燃烧的意象；“烈怒”比单用“愤怒”更能传达其强度。
- source_word: בַּעֲמָלֵק
  choice: 向亚玛力人
  rationale: 介词 ב 在“施行烈怒”的语境中标明审判所针对的对象；“向……施行”是自然汉语。民族名称按中文惯用形式译作“亚玛力人”。
- source_word: עַל כֵּן
  choice: 所以
  rationale: 明确标示由悖逆而来的后果；“所以”比“因此”更贴近本句自然口吻，同时保持庄重。
- source_word: הַדָּבָר הַזֶּה
  choice: 这样
  rationale: דבר 在此概括眼前的审判和处境；汉语“这样待你”自然表达“把这事行在你身上”，而不生硬地译为“这件事”。
- source_word: עָשָׂה לְךָ יְהוָה
  choice: 耶和华这样待你
  rationale: עשה לְךָ 在这里表示耶和华使这审判临到扫罗；“这样待你”保留受事关系，并符合现代汉语。
- source_word: הַיּוֹם הַזֶּה
  choice: 今天
  rationale: 简明自然地对应强调当下时点的“这一天”。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用神的专名。正文保留专名而不换成“主”；采用现代中文圣经传统中辨识度最高的“耶和华”，不借此裁定古代发音的全部细节。
- issue: “施行他的烈怒”的主体与意义
  choice: 保留“他的烈怒”，表达扫罗未执行耶和华针对亚玛力人的审判
  alternative: 消灭亚玛力人
  rationale: 原文使用“行/施行他的烈怒”这一强烈而不寻常的表达，并未在本节直接说“灭尽”；保留其神学张力，避免用上下文解释取代正文。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“听从……的话”保留希伯来语的声音/顺从表达；“施行他的烈怒”刻意保留原文较强烈且略不寻常的措辞。脚注标记已置于对应正文之后。
