  text: וַ/תֹּ֨אמֶר הָֽ/אִשָּׁ֜ה אֵלָ֗י/ו הִנֵּ֨ה אַתָּ֤ה יָדַ֨עְתָּ֙ אֵ֣ת אֲשֶׁר עָשָׂ֣ה שָׁא֔וּל אֲשֶׁ֥ר הִכְרִ֛ית אֶת הָ/אֹב֥וֹת וְ/אֶת הַ/יִּדְּעֹנִ֖י מִן הָ/אָ֑רֶץ וְ/לָ/מָ֥ה אַתָּ֛ה מִתְנַקֵּ֥שׁ בְּ/נַפְשִׁ֖/י לַ/הֲמִיתֵֽ/נִי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/009.yaml
  text: But the woman said to him[a], “Look, you yourself know what Saul has done, that he has cut off the mediums and the spiritists from the land. So why are you laying a snare for my life, to put me to death?”
translation:
  language: zh_hans
  text: 女人却对他说：“你看，扫罗所做的事，你自己知道：他已经把招魂者和通灵者[a]从这地剪除了。你为什么设圈套害我，要置我于死地呢？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这两个希伯来词指求问亡灵或灵界的人，具体区别不确定；也可译作“交鬼的和行巫术的”。
    reason: 说明两个古代术语的词义范围及传统译法，避免正文造成过度确定的区分。
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: 却对他说
  rationale: 叙事性的连续式推进情节；结合上下文，女人是在警惕地反驳来人的请求，因此用“却”自然表达转折。
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留引人注意和加强语气的作用；“看哪”庄重而仍为现代读者所懂。
- source_word: אַתָּה יָדַעְתָּ
  choice: 你自己是知道的
  rationale: 希伯来文显式使用第二人称代词以加强语气；“你自己”保留这一强调。
- source_word: הִכְרִית
  choice: 剪除了
  rationale: 保留“剪除”的强烈意象，表示从境内清除，而不预先断定每个相关者都已被处死。
- source_word: הָאֹבוֹת
  choice: 招魂者
  rationale: 此处指借求问亡灵或灵界而行事的人；“招魂者”在现代汉语中较清楚，也避免把词义限定为某种后世理论。
- source_word: הַיִּדְּעֹנִי
  choice: 通灵者
  rationale: 该词指声称凭灵界获得隐秘知识的人；“通灵者”自然易懂，并与“招魂者”保持相关而不完全相同。
- source_word: מִן הָאָרֶץ
  choice: 从这地
  rationale: 上下文所指是扫罗管辖的以色列地，而非全世界；“这地”简洁明确。
- source_word: מִתְנַקֵּשׁ בְּנַפְשִׁי
  choice: 设圈套害我的性命
  rationale: 既保留“设圈套”的比喻，又用“害我的性命”清楚表达圈套针对她的生命。
- source_word: לַהֲמִיתֵנִי
  choice: 要置我于死地
  rationale: 准确表达使役性的“使我死”，并保持女人质问时的庄重和紧迫感。
theological_decisions:
- issue: 如何翻译与禁忌灵媒活动有关的两个称谓
  choice: 招魂者和通灵者
  alternative: 交鬼的和行巫术的；有熟悉之灵的人和术士
  rationale: 原文的两个术语都涉及求问亡灵或灵界，但彼此的确切区别并不完全清楚。正文采用现代读者容易理解的称谓，不肯定这些实践是否真实有效，也不引入后世民间传说或特定宗派对灵界运作方式的解释。
translation_notes:
  register: 采用现代、庄重而口语顺畅的叙事语言。“看哪”和“剪除”略带经文体色彩，但含义清楚；问句保持女人因惧怕被处死而产生的警觉和急迫。
