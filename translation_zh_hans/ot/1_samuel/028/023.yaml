base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/023.yaml
  text: But he refused and said[a], “I will not eat.” Yet his servants, along with the woman, urged him, and he listened to their voice[c][b]. So he rose from the ground and sat on the bed.
translation:
  language: zh_hans
  text: 扫罗却不肯，说：“我不吃。”他的仆人和那妇人都竭力劝他；他便听了他们的劝。于是他从地上起来，坐到床榻上[b][a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“他听了他们的声音。”
    reason: lexical_alternative
  - marker: b
    text: “床榻”也可译作“床”或“卧榻”。
    reason: cultural_note
lexical_decisions:
- source_word: וַיְמָאֵן
  choice: 却不肯
  rationale: מָאֵן表示拒绝或不愿意；“不肯”在现代汉语叙事中自然直接，也能体现扫罗的抗拒。
- source_word: לֹא אֹכַל
  choice: 我不吃
  rationale: 忠实保留简短的直接引语，不补入原文没有明说的宾语。
- source_word: וַיִּפְרְצוּ בוֹ
  choice: 再三劝他
  rationale: פרץ ב在此是强力坚持、竭力催促的习语，并非字面的“冲破”；“再三劝”自然表达其持续而恳切的催促。
- source_word: עֲבָדָיו
  choice: 他的臣仆
  rationale: 此处指陪同君王扫罗、服侍他的人员；“臣仆”兼顾王室语境与其侍从身份，避免把重点误置于奴隶身份。
- source_word: וְגַם הָאִשָּׁה
  choice: 和那妇人
  rationale: 保留妇人与臣仆共同劝说扫罗的附加关系；汉语无需机械译出“也”。
- source_word: וַיִּשְׁמַע לְקֹלָם
  choice: 他才听从了他们
  rationale: 该希伯来语习语直译为“听他们的声音”，语境中表示接受他们的劝说；“听从”在汉语中自然，同时脚注保留原文意象。
- source_word: מֵהָאָרֶץ
  choice: 从地上
  rationale: 这里指扫罗先前伏倒之处，“地上”符合上下文和现代汉语表达。
- source_word: וַיֵּשֶׁב אֶל הַמִּטָּה
  choice: 坐到床榻上
  rationale: מִטָּה可指床，也可指供坐卧的榻；“床榻”保留器物范围，不武断限定为现代睡床。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“再三劝”传达希伯来习语中的强烈坚持；“床榻”保留古代家具可能兼具坐卧功能的含义。
