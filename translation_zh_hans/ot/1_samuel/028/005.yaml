  yaml_path: translation/ot/1_samuel/028/005.yaml
  text: When Saul saw the camp of the Philistines[a], he was afraid, and his heart trembled greatly.
translation:
  language: zh_hans
  text: 扫罗看见非利士人的营地，就害怕起来，心里非常战兢。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他的心剧烈颤抖。”希伯来文保留“心”作为内在恐惧所在之处的意象。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: 看见
  rationale: 这里是叙事中通常的视觉感知义；“看见”自然、准确，也不额外加入凝视或突然瞥见的意味。
- source_word: מַחֲנֵה
  choice: 营地
  rationale: 保留军队扎营这一具体场景；相比“军队”，“营地”较少解释性增补。
- source_word: פְלִשְׁתִּים
  choice: 非利士人
  rationale: 采用现代中文圣经及一般中文中通行的族名译法。
- source_word: וַיִּרָא
  choice: 害怕起来
  rationale: 准确表达 ירא 的恐惧含义，并以“起来”自然呈现看见营地后进入惧怕状态的叙事推进。
- source_word: וַיֶּחֱרַד
  choice: 战兢
  rationale: חרד 表示因惊惧而震颤、惶恐；“战兢”兼顾身体颤抖和内在恐惧，且符合庄重的现代叙事语体。
- source_word: לִבּוֹ
  choice: 心里
  rationale: 希伯来文直指“他的心”，即内在生命与情感的中心；中文“心里战兢”保留心的意象，同时比“他的心非常战兢”更自然。
- source_word: מְאֹד
  choice: 非常
  rationale: 直接保留程度强化语气，现代中文自然明白。
