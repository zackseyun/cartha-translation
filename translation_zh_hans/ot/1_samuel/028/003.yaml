base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/003.yaml
  text: Samuel had died[a], and all Israel had mourned for him and buried him in Ramah, in his own city. And Saul had removed the mediums and the spiritists from the land.
translation:
  language: zh_hans
  text: 撒母耳已经死了；以色列众人都为他哀悼，并把他葬在拉玛——他的城中。扫罗已经把灵媒和通灵者从这地除掉了[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “灵媒”和“通灵者”所译的两个希伯来词常并列出现，二者的确切区别不能完全确定；传统上也译作“交鬼的和行巫术的”。
    reason: 说明古代术语的词义范围及其分类的不确定性，同时保留传统译法作为可行的词汇替代。
lexical_decisions:
- source_word: מֵת
  choice: 已经死了
  rationale: 该分句交代后续叙事发生前的背景；“已经”自然表达其先时性，同时不增添原文没有的“如今”等时间词。
- source_word: וַיִּסְפְּדוּ לוֹ
  choice: 都为他哀悼
  rationale: ספד指为死者举行或表达哀悼；此译自然、庄重，也不限定哀悼的具体形式。
- source_word: כָּל יִשְׂרָאֵל
  choice: 以色列众人
  rationale: 保留原文对全体以色列的集合性表达，又符合现代汉语习惯。
- source_word: וַיִּקְבְּרֻהוּ
  choice: 把他葬
  rationale: 直接表达埋葬之意，并以“把”字句自然承接前面的主语。
- source_word: בָרָמָה
  choice: 在拉玛
  rationale: 采用现代中文圣经地名的通行音译。
- source_word: וּבְעִירוֹ
  choice: 就是他自己的城里
  rationale: 将第二个地点短语理解为对“拉玛”的同位说明；“自己的”明确表达第三人称单数所属关系。
- source_word: הֵסִיר
  choice: 已经从境内除掉了
  rationale: 该句同样概述此前形成的处境；“除掉”保留原词较宽泛的移除、清除含义，不武断限定为驱逐、处死或取缔中的某一种。
- source_word: הָאֹבוֹת
  choice: 招魂者
  rationale: אוֹב在此指借助亡灵进行求问的从业者；“招魂者”比古旧的“交鬼者”更易为现代读者理解。
- source_word: הַיִּדְּעֹנִים
  choice: 通灵者
  rationale: יִדְּעֹנִי指与超自然求问有关的术士，常与אוֹב并列；“通灵者”传达基本含义，同时避免现代奇幻语境中的“巫师”联想。
- source_word: מֵהָאָרֶץ
  choice: 从境内
  rationale: 这里指扫罗所治理之地；“境内”在现代汉语中比直译“从那地”更清楚自然。
theological_decisions:
- issue: 如何翻译两类与求问亡灵或灵界有关的从业者，而不套用后世民间传说的分类
  choice: 招魂者和通灵者
  alternative: 交鬼的和行巫术的；灵媒和术士
  rationale: 两个希伯来词所指类别并不完全等同于现代汉语中任何固定的神秘术语。正文传达其核心活动并维持两词的并列，脚注则提示传统译法及词义边界的不确定性。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。两个“已经”标明本节是在交代后续事件以前的背景；句首不添加原文没有的“那时”或“如今”。
