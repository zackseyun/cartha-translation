base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/017.yaml
  text: 'And Yahweh has done for you just as he spoke by my hand: Yahweh has torn the kingdom out of your hand and given it to your neighbor[b][a], to David.'
translation:
  language: zh_hans
  text: 耶和华已经为自己[a]成就了他借我的手[b]所说的事：耶和华已从你手中撕去了王国，把它赐给你的同伴，就是大卫。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “为自己”原文作“为他／为自己”。有些译本依据上下文译作“向你”或“为你”。
    reason: 保留马所拉文本 לוֹ 的实际措辞及其指代张力，不将其静默改为第二人称。
  - marker: b
    text: “借我的手”也可译作“借着我”。
    reason: 说明希伯来语媒介表达在现代汉语中的自然含义。
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代汉语圣经读者熟悉的神名译法，明确对应四字神名 YHWH。
- source_word: וַיַּעַשׂ ... לוֹ
  choice: 已经为自己成就了
  rationale: 马所拉文本作 לוֹ，字面是“为他”，在此可指耶和华为自己行事。译文保留这一较生硬但真实的读法，不按上下文默改为“向你”或“为你”；“成就了……所说的事”使汉语句子自然完整。
- source_word: כַּאֲשֶׁר דִּבֶּר בְּיָדִי
  choice: 他借我的手所说的
  rationale: 保留 בְּיַדִי“借我的手”的希伯来语形象，同时表达先知作为传话媒介的含义。
- source_word: וַיִּקְרַע
  choice: 撕走
  rationale: 保留 קָרַע“撕裂、撕去”的鲜明比喻，并体现王国被强行从扫罗控制中移走。
- source_word: הַמַּמְלָכָה
  choice: 王国
  rationale: 在本语境中指扫罗掌管的国度；“王国”简明且与撕走、赐给的宾语结构相配。
- source_word: מִיָּדֶךָ
  choice: 从你手中
  rationale: 保留希伯来语关于占有和掌控的“手”这一意象。
- source_word: וַיִּתְּנָהּ
  choice: 把它赐给
  rationale: “它”回指王国；“赐给”自然表达耶和华作为授予者的动作。
- source_word: לְרֵעֲךָ
  choice: 你的同伴
  rationale: רֵעַ 可指同伴、朋友或邻舍；“同伴”在王位转交给另一人的语境中自然，又不额外断定二人的亲密程度。
- source_word: לְדָוִד
  choice: 大卫
  rationale: 按现代汉语惯用形式音译人名。
theological_decisions:
- issue: 首句 לוֹ 的所指及文本异读
  choice: 按马所拉文本译为“为自己”，并以脚注说明其字面形式
  alternative: 按上下文或其他文本传统译为“向你”或“为你”
  rationale: 所给 WLC 文本明确是 לוֹ，而不是“给你”的 לְךָ。译文不静默修订原文，也不消除其指代上的张力。
- issue: בְיָדִי 的先知中介含义
  choice: 正文保留“借我的手”，脚注给出“借着我”的通顺表达
  alternative: 正文直接译为“借着我”
  rationale: “借我的手”保留原文意象；脚注帮助普通读者理解这里不是指书写动作，而是指撒母耳作为传话者。
translation_notes:
  register: 采用现代、庄重而清楚的叙事语言。“撕走王国”保留先知宣告中的强烈意象；首句借助“成就了……所说的事”改善汉语可读性，同时不改动 לוֹ 所造成的文本张力。
