base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/006.yaml
  text: Saul inquired of Yahweh[a], but Yahweh did not answer him[b], either by dreams or by the Urim or by the prophets.
translation:
  language: zh_hans
  text: 扫罗求问雅威，雅威却没有借着梦、乌陵[a]或先知回答他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 乌陵是祭司用来求问神旨意的一种方式。
    reason: 文化背景
lexical_decisions:
- source_word: וַיִּשְׁאַל
  choice: 求问
  rationale: שׁאל 与介词 ב 加神名连用时，表示寻求神谕或指引；“求问”比一般的“询问”更贴合这一语境，也符合现代中文圣经语体。
- source_word: בַּיהוָה / יְהוָה
  choice: 雅威
  rationale: 原文两次使用神的专名 יהוה；音译为“雅威”可保留其专名性质。介词 ב 在“求问雅威”中按中文习惯处理，不作机械直译。
- source_word: וְלֹא עָנָהוּ
  choice: 却没有回答他
  rationale: ענה 在此指对求问作出回应；“回答他”直接、自然。“却”表达前后转折，但不增添原文未说明的拒答原因。
- source_word: גַּם ... גַּם ... גַּם
  choice: 无论……、……，还是……
  rationale: 在否定主句之后，重复的 גַּם 列出所有未带来回答的途径；此结构在现代中文中自然地表达穷尽性的并列。
- source_word: בַּחֲלֹמוֹת
  choice: 借着梦
  rationale: 介词 ב 表示获得启示或回答的媒介；“借着梦”准确表达方式，并与后两项保持平行。
- source_word: בָּאוּרִים
  choice: 乌陵
  rationale: אוּרִים 是祭司求取神意所用之物或方式的专名，采用传统音译“乌陵”，避免对其具体形制或词源作推测性翻译。
- source_word: בַּנְּבִיאִם
  choice: 先知
  rationale: נְבִיאִים 是复数，指作为神启示媒介的先知群体；中文集合性名词“先知”在此已能自然表达复数含义。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华／上主
  rationale: 原文直接使用四字神名。译作“雅威”保留其作为盟约专名的性质，不以称号替代。
- issue: 扫罗未获回答的性质
  choice: 仅陈述雅威没有借所列途径回答扫罗
  alternative: 解释为雅威因特定罪行拒绝扫罗
  rationale: 本节没有明说未回答的原因；译文保留这一神学张力，不把上下文中的解释直接加入本节。
- issue: 三个介词短语与“求问”或“回答”的关联
  choice: 按最自然的句法理解为雅威没有借梦、乌陵或先知回答
  alternative: 理解为扫罗借梦、乌陵和先知求问雅威
  rationale: 这些短语在语法上可能指求问的渠道，也可能指回答的媒介；正文采用在否定回答语境中更自然的后者，并以脚注保留另一种可能。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“求问”保留神谕咨询语境；“无论……还是……”自然呈现否定句中三项并列的穷尽意味。脚注标记已在正文“乌陵”后出现。
