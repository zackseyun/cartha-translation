source:
  edition: WLC
  text: וַ/יַּעַן֩ דָּוִ֨ד אֶת הַ/כֹּהֵ֜ן וַ/יֹּ֣אמֶר ל֗/וֹ כִּ֣י אִם אִשָּׁ֤ה עֲצֻֽרָה לָ֨/נוּ֙ כִּ/תְמ֣וֹל שִׁלְשֹׁ֔ם בְּ/צֵאתִ֕/י וַ/יִּהְי֥וּ כְלֵֽי הַ/נְּעָרִ֖ים קֹ֑דֶשׁ וְ/הוּא֙ דֶּ֣רֶךְ חֹ֔ל וְ/אַ֕ף כִּ֥י הַ/יּ֖וֹם יִקְדַּ֥שׁ בַּ/כֶּֽלִי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/006.yaml
  text: David answered the priest and said to him[a], “Indeed, women have been kept from us as before, when I went out, and the young men’s vessels are holy, though it is an ordinary journey[d][c][b]. How much more today will it be made holy in the vessel.”
translation:
  language: zh_hans
  text: 大卫回答祭司，对他说[a]：“确实，自从我出发以来，我们一直没有亲近女人[b]；少年人的器具是圣洁的[c]，虽然这只是普通的行程[d]。何况今天，器具更要成为圣洁。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“女人一直被隔离在我们之外”或“我们一直避开女人”。这句话是指为接触圣物而禁绝性关系。
    reason: lexical_alternative
  - marker: b
    text: “自从我出发以来”所对应的短语直译近似“像昨天、前天一样”，是指先前日子的希伯来语习语；也有人理解为“约有三天”。
    reason: lexical_alternative
  - marker: c
    text: “器具”可指少年人的装备；也有人认为这是委婉地指他们的身体或本人。
    reason: lexical_alternative
  - marker: d
    text: 本节末句的希伯来文很难理解。也可译作：“虽然这行程是普通的，今天它在器具方面却将成为圣洁”，或作类似理解。
    reason: alternative_reading
lexical_decisions:
- source_word: אִשָּׁה עֲצֻרָה לָנוּ
  choice: 我们都没有亲近女人
  rationale: 按语境表达为接触圣物而禁欲；“亲近女人”自然且庄重，同时保留性关系的委婉说法。希伯来语形式也可较直译为“女人被禁止接近我们”，故列脚注。
- source_word: כִּתְמוֹל שִׁלְשֹׁם
  choice: 像往常一样
  rationale: 这是指先前日子的习语；此处重在说明离队以来一贯禁欲，不强行确定为整整三天。
- source_word: בְּצֵאתִי
  choice: 自从我出发以来
  rationale: 介词加不定词结构在此标明出发这一时间起点，中文这样表达与持续禁欲的语境衔接自然。
- source_word: כְלֵי הַנְּעָרִים
  choice: 少年人的器具
  rationale: כְלִי 可指器具、装备，也可能委婉指身体或本人；保留“器具”以维持原文歧义。
- source_word: קֹדֶשׁ
  choice: 圣洁的
  rationale: 直接表达分别为圣的状态，避免缩减为一般的洁净或道德纯洁。
- source_word: וְהוּא דֶּרֶךְ חֹל
  choice: 这虽是普通的行程
  rationale: חֹל 与圣俗之“圣”相对，意为普通、非圣，并非邪恶；把 דֶּרֶךְ 译作“行程”符合上下文。
- source_word: וְאַף כִּי
  choice: 何况
  rationale: 保留短语常有的递进论证力量，但不展开原文压缩而疑难的逻辑。
- source_word: הַיּוֹם יִקְדַּשׁ בַּכֶּלִי
  choice: 今天，这器具更要成为圣洁
  rationale: 用“成为圣洁”体现 יִקְדַּשׁ 的动词性；末句希伯来文极为晦涩，中文正文作尽可能通顺而接近字面的处理，并以脚注说明其他理解。
theological_decisions:
- issue: 禁欲、圣饼与礼仪圣洁的关系
  choice: 以礼仪上的圣洁和分别为圣来表达，不加入后来的教义范畴
  alternative: 将其主要解释为道德纯洁，或仅仅解释为实际卫生
  rationale: 上下文讨论领取圣饼的资格，原文又以“圣”与“普通”对举；译文因此保留礼仪语境，同时不把性关系本身描写为不道德。
- issue: “器具”所指为何
  choice: 正文保留“器具”的歧义
  alternative: 明确解释为装备、身体或人本身
  rationale: 原文 כְלִי 的指称不确定；直接选定一种解释会消除文本真实存在的张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“亲近女人”保留合宜的委婉语气；“圣洁／普通”呈现原文的圣俗对比。正文不强行解决“器具”和末句句法的疑难，相关歧义均在脚注中交代。
