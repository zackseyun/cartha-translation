revisions:
- from: 大卫回答祭司说[a]：“确实，像往常一样，自从我出发以来，我们都没有亲近女人；少年人的器具也是圣洁的[c]。这虽是普通的行程[d]，何况今天，这器具更要成为圣洁。”[b]
  to: 大卫回答祭司，对他说[a]：“确实，自从我出发以来，我们一直没有亲近女人[b]；少年人的器具是圣洁的[c]，虽然这只是普通的行程[d]。何况今天，器具更要成为圣洁。”
  rationale: The revision preserves the source’s disputed syntax and the draft’s intentionally literal “器具,” while replacing a generic habitual expression with Mandarin that better reflects the Hebrew’s reference to the days since David departed. It also corrects the placement of the temporal footnote marker and makes the first alternative in footnote a less interpretive.
