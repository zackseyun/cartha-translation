base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/014.yaml
  text: So he changed his behavior before their eyes and acted like a madman in their hands[b][a]; he made marks on the doors of the gate and let his saliva run down onto his beard.
translation:
  language: zh_hans
  text: 于是，他在他们眼前改变了自己的举止；在他们手中，他表现得疯疯癫癫。他在城门的门扇上留下记号[b]，任凭唾沫流到自己的胡须上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: “留下记号”所译的希伯来语词较难确定，也可理解为“抓划”或“乱写”。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְשַׁנּוֹ
  choice: 改变了
  rationale: 该词在此表示有意改变；“改变了”直接、自然，也与上下文中大卫刻意改变外在表现相符。
- source_word: טַעְמוֹ
  choice: 自己的举止
  rationale: טַעַם通常可指“判断、理智”，但本叙事强调旁人所看见的外在表现；译作“举止”避免断言大卫内在真的失去理智。
- source_word: בְּעֵינֵיהֶם
  choice: 在他们眼前
  rationale: 保留希伯来语“在他们眼中”的生动表达，现代汉语也自然易懂。
- source_word: וַיִּתְהֹלֵל
  choice: 表现得如同疯子
  rationale: 该词描述癫狂般的行为；此译保留行为层面的含义，而由上下文显出这是刻意表演，没有直接把“假装”写入动词本身。
- source_word: בְּיָדָם
  choice: 在他们手中
  rationale: 保留原文意象，同时可自然理解为处在他们掌控或拘押之下。
- source_word: ויתו
  choice: 乱划
  rationale: 这个罕见而难解的动词表示在门扇上留下划痕或记号；“乱划”既符合疯癫表演的场景，又不武断限定为书写。
- source_word: דַּלְתוֹת הַשַּׁעַר
  choice: 城门的门扇
  rationale: “门扇”准确表达城门可开合的板门，也符合庄重而清楚的现代汉语。
- source_word: וַיּוֹרֶד
  choice: 任凭……流到
  rationale: 原文使役形式描写他让唾沫向下流；“任凭……流到”自然表达其刻意不加制止的动作。
- source_word: רִירוֹ
  choice: 唾沫
  rationale: “唾沫”是现代汉语中清楚具体的常用词，比“涎水”较少增添持续流涎的解释。
- source_word: אֶל זְקָנוֹ
  choice: 流到自己的胡须上
  rationale: 介词在此表示唾沫向下落到胡须；补出反身领属使中文指代清楚。
theological_decisions: []
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。保留“在他们手中”这一希伯来语意象，不将其含义收窄为“被拘押”或“受控制”；对两个语义较难确定的动词以脚注呈现合理异译。
