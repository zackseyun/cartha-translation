base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/004.yaml
  text: Now then[a], what do you have on hand? Give me five loaves of bread[c][b], or whatever is available.
translation:
  language: zh_hans
  text: “现在，你手头有什么[a]？给我[b]五个饼，或是任何现成的东西[c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“在你手下”，是指目前拥有或可以立即取用的东西。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“在我手中”，此处是“给我”的惯用表达。
    reason: lexical_alternative
  - marker: c
    text: 也可译作“或是任何能找到的东西”。
    reason: alternative_reading
lexical_decisions:
- source_word: וְעַתָּה
  choice: 现在
  rationale: 兼顾时间意义和话语转折作用，衔接上文并引出眼前的请求。
- source_word: מַה יֵּשׁ תַּחַת יָדְךָ
  choice: 你手头有什么
  rationale: “在你手下”是希伯来语习语，指某人目前拥有或可立即取用之物；“手头有什么”是自然且贴近原意的现代汉语表达。
- source_word: חֲמִשָּׁה לֶחֶם
  choice: 五个饼
  rationale: לֶחֶם 在这里指可计数的饼；“五个饼”既保留数目，也符合古代食物的具体形态。
- source_word: תְּנָה בְיָדִי
  choice: 请给我
  rationale: 原文直译为“交在我手里”；汉语以“给我”自然表达实际交付，“请”使语气符合请求场景，但不削弱命令式的直接性。
- source_word: אוֹ הַנִּמְצָא
  choice: 或是有什么现成的，就给我什么
  rationale: 原文是省略式表达，字面为“或那能找到的／现有的”；此译保留范围未限定的语意，并使汉语句子完整清楚。
