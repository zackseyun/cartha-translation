source:
  edition: WLC
  text: וַ/יָּ֧שֶׂם דָּוִ֛ד אֶת הַ/דְּבָרִ֥ים הָ/אֵ֖לֶּה בִּ/לְבָב֑/וֹ וַ/יִּרָ֣א מְאֹ֔ד מִ/פְּנֵ֖י אָכִ֥ישׁ מֶֽלֶךְ גַּֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/013.yaml
  text: David took these words to heart[a], and he was very much afraid of Achish king of Gath.
translation:
  language: zh_hans
  text: 大卫把这些话放在心上[a]，就非常惧怕迦特王亚吉。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“大卫把这些事放在心里。”这句希伯来语习语表示他认真看待所听见的话，并在内心思量。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם ... בִּלְבָבוֹ
  choice: 把……放在心上
  rationale: 保留希伯来语“放在心里”的意象，同时用自然的现代汉语表达大卫把所听见的话认真放在心上、在内心思量。
- source_word: אֶת־הַדְּבָרִים הָאֵלֶּה
  choice: 这些话
  rationale: דְּבָרִים 可指“话、事情、事项”；这里紧接上一节臣仆所说的话，因此译作“这些话”最贴合语境。
- source_word: וַיִּרָא מְאֹד
  choice: 就非常惧怕
  rationale: 准确传达 יָרֵא 加 מְאֹד 的强烈程度；“惧怕”庄重而清楚，“就”也自然呈现叙事中的结果关系。
- source_word: מִפְּנֵי
  choice: 惧怕……
  rationale: 该介词在表示惧怕的结构中标明惧怕的对象；汉语无需逐字译出“从……面前”，可直接把对象置于“惧怕”之后。
- source_word: אָכִישׁ
  choice: 亚吉
  rationale: 采用现代中文圣经传统中通行的人名音译。
- source_word: מֶלֶךְ גַּת
  choice: 迦特王
  rationale: 自然、简洁地表达希伯来语属格结构“迦特的王”，并采用通行地名“迦特”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“把这些话放在心上”既保留原文的心之意象，又比完全直译更符合现代汉语；“非常惧怕”保留原文的强烈语气。
