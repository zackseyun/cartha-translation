  text: וַ/יִּתֶּן ל֥/וֹ הַ/כֹּהֵ֖ן קֹ֑דֶשׁ כִּי֩ לֹא הָ֨יָה שָׁ֜ם לֶ֗חֶם כִּֽי אִם לֶ֤חֶם הַ/פָּנִים֙ הַ/מּֽוּסָרִים֙ מִ/לִּ/פְנֵ֣י יְהוָ֔ה לָ/שׂוּם֙ לֶ֣חֶם חֹ֔ם בְּ/י֖וֹם הִלָּקְחֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/007.yaml
  text: So the priest gave him holy bread[a], for there was no bread there except the bread of the Presence, which had been removed from before Yahweh, to put hot bread there on the day it was taken away.
translation:
  language: zh_hans
  text: 祭司就把圣饼[a]给了他，因为那里除了从耶和华面前撤下的陈设饼以外，没有别的饼；撤下这些饼的当天，为要摆上热饼。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “圣饼”指分别为圣的陈设饼。“陈设饼”直译为“面前的饼”，即陈设在耶和华面前的饼。
    reason: 说明קֹדֶשׁ在本处的具体所指，并补出לֶחֶם הַפָּנִים的字面意象。
lexical_decisions:
- source_word: קֹדֶשׁ
  choice: 圣饼
  rationale: 原词本义为“圣物”，但上下文明确所指是已经分别为圣的陈设饼；译作“圣饼”既点明所指，也保留其神圣属性。
- source_word: לֶחֶם הַפָּנִים
  choice: 陈设饼
  rationale: 这是现代中文读者较熟悉的礼仪用语，指陈设在耶和华面前的饼；脚注补充其希伯来语字面含义，以免传统译名遮蔽原文意象。
- source_word: הַמּוּסָרִים
  choice: 已经……撤下
  rationale: 被动分词描述这些饼已经从耶和华面前移走；“撤下”自然地表达礼仪更换时将饼移除。
- source_word: מִלִּפְנֵי יְהוָה
  choice: 从耶和华面前
  rationale: 贴近原文的空间兼礼仪表达，表明饼原先陈设在耶和华面前。
- source_word: לֶחֶם חֹם
  choice: 热饼
  rationale: חֹם字面意为“热的”；虽暗示新烤的饼，正文仍保留原文措辞，不直接释作“新鲜的饼”。
- source_word: בְּיוֹם הִלָּקְחוֹ
  choice: 在撤下它的当天
  rationale: 保留“在……当天”的时间表达及被动含义，并用“它”指向被撤下的原有陈设饼。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 正文采用现代中文圣经传统中最广为人知的专名“耶和华”，明确将四字神名作为名字而非以“主”这一称号代替；“雅威”则是较接近学界重构发音的另一译法。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“陈设饼”保留通行礼仪术语；“热饼”则有意保留原文具体措辞。末句维持原文更换旧饼与摆上热饼之间的时间和目的关系。
