  text: וְ/שָׁ֡ם אִישׁ֩ מֵ/עַבְדֵ֨י שָׁא֜וּל בַּ/יּ֣וֹם הַ/ה֗וּא נֶעְצָר֙ לִ/פְנֵ֣י יְהוָ֔ה וּ/שְׁמ֖/וֹ דֹּאֵ֣ג הָ/אֲדֹמִ֑י אַבִּ֥יר הָ/רֹעִ֖ים אֲשֶׁ֥ר לְ/שָׁאֽוּל׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/008.yaml
  text: A man of Saul’s servants was there that day[a], detained before Yahweh; his name was Doeg the Edomite, the chief of Saul’s shepherds.
translation:
  language: zh_hans
  text: 那天，扫罗的臣仆中有一个人在那里，被留在耶和华面前[a]。他名叫以东人多益，是扫罗牧人的首领。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“在耶和华面前被拦住”或“被扣留”。希伯来文没有说明多益为何被留在那里。
    reason: 说明 נֶעְצָר 的词义范围，并保留原文对原因的含混。
lexical_decisions:
- source_word: וְשָׁם אִישׁ מֵעַבְדֵי שָׁאוּל
  choice: 扫罗的臣仆中有一个人在那里
  rationale: מִן 是部分用法，表示此人是扫罗臣仆中的一员。“臣仆”既保留 עֶבֶד 的服事关系，也适合王室语境；“在那里”直接表达 שָׁם。
- source_word: בַּיּוֹם הַהוּא
  choice: 那天
  rationale: 采用自然、简洁的现代汉语时间表达，并置于句首以使叙事流畅。
- source_word: נֶעְצָר לִפְנֵי יְהוָה
  choice: 被留在耶和华面前
  rationale: נֶעְצָר 是被动形式，可指被拦住、留住或扣留；原文没有说明原因。“被留在”避免暗示犯罪或强制拘押，同时保留其原因未明的状态。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 使用现代简体中文圣经语域中对四字神名的通行专名译法，而非以“主”这一称号替代。
- source_word: וּשְׁמוֹ דֹּאֵג הָאֲדֹמִי
  choice: 他名叫以东人多益
  rationale: 按现代汉语自然表达处理命名公式；族称 הָאֲדֹמִי 译为“以东人”。
- source_word: אַבִּיר הָרֹעִים אֲשֶׁר לְשָׁאוּל
  choice: 是扫罗牧人的首领
  rationale: אַבִּיר 可表示强者或居首位者；在王室牧人这一职务语境中，“首领”最能表达其地位，同时不强调体力。“扫罗牧人”自然整合了关系从句。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用四字神名；正文保留为专名，不用“主”替代。中文采用读者最熟悉且具尊严的传统音译“耶和华”。
- issue: נֶעְצָר לִפְנֵי יְהוָה 的含义
  choice: 被留在耶和华面前
  alternative: 在耶和华面前被扣留／被拦住
  rationale: 原文并未交代多益为何被留，也不确定是礼仪、誓愿、洁净或其他原因，因此不在正文中补入特定宗教解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“那天”前置以符合中文节奏；分作两句，清楚呈现人物出现与身份介绍。正文中的脚注标记[a]与脚注完全对应。
