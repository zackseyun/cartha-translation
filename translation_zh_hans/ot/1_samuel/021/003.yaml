base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/003.yaml
  text: David said to Ahimelech the priest[a], “The king has charged me with a matter and said to me[b], ‘Let no man know anything about the matter for which I am sending you and with which I have charged you.’ And I have directed the young men to a certain place.”
translation:
  language: zh_hans
  text: 大卫对祭司亚希米勒说：“王吩咐我一件事，又对我说：‘关于我差你去办、并吩咐你的事，不可让任何人知道任何事[a]。’至于那些年轻人，我已经把他们安排到某个地方去了[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“不可让一个男人知道任何事”；这里泛指任何人。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译为“到某某地方”，是一种不指明或不透露地点的说法。
    reason: lexical_alternative
lexical_decisions:
- source_word: צִוַּנִי דָבָר
  choice: 吩咐我一件事
  rationale: צוה表示“吩咐、命令”，דבר在这里指所交办的事情；此译既保留命令意味，也符合现代汉语。
- source_word: אִישׁ אַל יֵדַע מְאוּמָה
  choice: 不可让任何人知道
  rationale: איש字面为“男人”，但在否定句中泛指任何人；“任何人”在现代汉语中自然且准确。
- source_word: הַדָּבָר
  choice: 这件事
  rationale: דבר在此指王所交办的事务或任务，而非单指言语。
- source_word: אֲשֶׁר אָנֹכִי שֹׁלֵחֲךָ וַאֲשֶׁר צִוִּיתִךָ
  choice: 我派你去办并吩咐你的这件事
  rationale: 保留两个关系从句以及重复出现的差派、吩咐概念，同时调整语序，使汉语清楚自然。
- source_word: וְאֶת־הַנְּעָרִים
  choice: 至于那些年轻人
  rationale: נערים可指年轻人、随从或仆役；“年轻人”保留原词较宽的身份含义，不把其社会角色定死。
- source_word: יוֹדַעְתִּי
  choice: 我已经让他们知道
  rationale: 这是ידע的使役形，基本意义是“使……知道”。尽管上下文也可理解为“指派、安排”，正文保留较直接的词义，并借后面的目的表达使句意通顺。
- source_word: אֶל־מְקוֹם פְּלֹנִי אַלְמוֹנִי
  choice: 要到某个地方去
  rationale: פּלני אלמני是指不明说或不愿透露某处的惯用语；“某个地方”是自然的现代汉语表达。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。王的话保持正式命令语气；对于יוֹדַעְתִּי的语义张力，正文保留“使知道”的基本意义，避免直接替换成较具解释性的“安排”或“指派”。
