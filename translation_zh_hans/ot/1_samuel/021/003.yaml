revisions:
- from: 大卫对祭司亚希米勒说：“王吩咐我一件事，又对我说：‘我派你去办并吩咐你的这件事，不可让任何人知道[a]。’至于那些年轻人，我已经让他们知道，要到某个地方去[b]。”
  to: 大卫对祭司亚希米勒说：“王吩咐我一件事，又对我说：‘关于我差你去办、并吩咐你的事，不可让任何人知道任何事[a]。’至于那些年轻人，我已经把他们安排到某个地方去了[b]。”
  rationale: 修订补足保密命令中的“任何事”，并将与地点连用的“使知道”改为现代汉语中更清晰的“安排到”，以反映其语境中的指示／安排功能而不增添具体细节。其余措辞保留原稿的现代庄重叙事语体与术语选择。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T05:26:25Z'
review_pass:
  verdict: revise
  source_fidelity: 草稿总体传达了大卫称王曾交办事务，并要求保密、且已将年轻人安排至未说明地点的意思。不过，“不可让任何人知道”省略了希伯来文否定式中的“任何事”；“我已经让他们知道，要到……”虽贴近ידע的字面使役义，却在现代汉语中不够自然，也未清楚表达其在此处与地点连用时的实际安排／指示含义。
  naturalness: 王令部分可更自然地调整为“关于……的事，不可让任何人知道任何事”。末句改为“我已经把那些年轻人安排到某个地方去了”，既庄重通顺，也不将其具体安排方式过度限定。
  terminology: “祭司亚希米勒”“王”“年轻人”均可保留。“吩咐”恰当对应צוה；前后两次出现宜维持一致。“某个地方”适合正文，脚注说明其为未明说的惯用表达。
  issues:
  - severity: medium
    issue: 保密命令漏译“任何事”
    rationale: אִישׁ אַל־יֵדַע מְאוּמָה直陈“不可让任何人知道任何事”。现有“不可让任何人知道”未完整呈现מְאוּמָה，且可能仅理解为不得得知该事。
  - severity: medium
    issue: “我已经让他们知道，要到某个地方去”不够自然且语义关系不清
    rationale: יוֹדַעְתִּי与אֶל־מְקוֹם连用在此通常表示大卫已使年轻人知悉／指示其前往一处地点，即作出安排。采用“安排到”在汉语中清楚自然，同时不具体断定是会合、驻扎或仅告知。
  - severity: low
    issue: 关系从句的汉语表达略显累赘
    rationale: “我派你去办并吩咐你的这件事”可改为“我差你去办、并吩咐你的事”，更直接保留差遣与吩咐两个动词。
