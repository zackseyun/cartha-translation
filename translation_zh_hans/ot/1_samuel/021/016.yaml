base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/016.yaml
  text: Do I lack madmen[a], that you have brought this one to act like a madman before me? Shall this one come into my house?
translation:
  language: zh_hans
  text: 我难道还缺疯子吗？你们竟把这个人带来，是要他在我面前发疯吗？这个人岂可进我家来？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֲסַר מְשֻׁגָּעִים
  choice: 还缺疯子
  rationale: 谓语形容词与名词构成尖锐的反问；加入“还”自然传达亚吉不耐烦、讥讽的语气。“疯子”是现代汉语中直接而有力的称呼，保留原话的贬抑色彩。
- source_word: הֲבֵאתֶם אֶת זֶה
  choice: 你们竟把这个人带来
  rationale: “这个人”对应重复出现的指示语，保留疏远和轻蔑的语气；“竟”在汉语中自然呈现反问式责怪。
- source_word: לְהִשְׁתַּגֵּעַ
  choice: 让他……装疯
  rationale: 该Hitpael不定式描述表现得疯癫；结合上一节大卫故意改变举止的叙事，“装疯”最自然地表达现场行为，同时以脚注保留较宽泛的译法。
- source_word: עָלָי
  choice: 在我面前
  rationale: 此处不是空间意义的“在我上面”，而是指行为发生在王面前并冲着他而来；“在我面前”准确而自然。
- source_word: הֲזֶה יָבוֹא אֶל־בֵּיתִי
  choice: 这个人岂可进我家来
  rationale: 再次译出“这个人”，保留希伯来文重复指示语的轻蔑强调；“岂可”呈现修辞问句，“进我家来”保留בֵּיתִי的基本意象，避免擅自具体化为“王宫”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而口语自然的王者斥责语气。两个反问均予保留，并用“竟”“岂可”传达原文的讥讽和不满；不将“家”解释性扩译为“王宫”。
