  text: 那一天，大卫起身逃离扫罗，来到迦特王亚吉那里。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקָם
  choice: 就起来
  rationale: 保留קום“起来”的基本动作和希伯来叙事推进语气；“就”自然衔接上下文，不把该词过度解释为“动身”。
- source_word: וַיִּבְרַח
  choice: 逃离
  rationale: ברח表示因危险而逃走；“逃离扫罗”既传达紧迫感，也能与后面的目的地自然衔接。
- source_word: בַּיּוֹם הַהוּא
  choice: 当天
  rationale: 这是明确的时间短语；“当天”简洁自然，保留“那一日”的时间指向。
- source_word: מִפְּנֵי שָׁאוּל
  choice: 离扫罗
  rationale: 该短语字面为“从扫罗面前”，在此与ברח连用，惯用义是为躲避扫罗而逃离；中文用“逃离扫罗”准确且不生硬。
- source_word: וַיָּבֹא אֶל
  choice: 来到……那里
  rationale: בוא与אֶל连用表示来到某人处；“来到……那里”符合现代汉语叙事习惯，并明确亚吉是大卫所投奔之人。
- source_word: אָכִישׁ
  choice: 亚吉
  rationale: 采用现代中文圣经中通行的人名译法。
- source_word: מֶלֶךְ גַּת
  choice: 迦特王
  rationale: 希伯来语构词结构说明亚吉的身份；“迦特王亚吉”是简洁自然的中文同位表达。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“起来”保留原文动作，“逃离……来到……”再现连续叙事，同时避免古奥的“从扫罗面前逃走”。
