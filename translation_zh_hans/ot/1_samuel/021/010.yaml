base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/010.yaml
  text: And the priest said[a], “The sword of Goliath the Philistine, whom you struck down in the Valley of Elah—behold, it is wrapped in a cloth behind the ephod. If you will take that for yourself, take it, for there is no other here except it.” And David said, “There is none like it; give it to me.”
translation:
  language: zh_hans
  text: 祭司说：“你在以拉谷击倒的那个非利士人歌利亚的刀，看哪，它裹在一件外衣[a]里，在以弗得后面。你若要拿去归自己，就拿去吧，因为这里除了这把，再没有别的了。”大卫说：“没有能比得上它的；给我吧。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “外衣”所译的希伯来词也可泛指“衣服”或指“斗篷”。
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶרֶב גָּלְיָת הַפְּלִשְׁתִּי
  choice: 那个非利士人歌利亚的刀
  rationale: 保留原文的所属关系和对歌利亚的族群称谓，并以自然的现代汉语表达。
- source_word: הִכִּיתָ
  choice: 你……击倒的
  rationale: נכה在战斗语境中可表示击打、击败乃至杀死；“击倒”保留战斗意味，又不把词义明确收窄为“杀死”。
- source_word: בְּעֵמֶק הָאֵלָה
  choice: 在以拉谷
  rationale: 采用现代汉语中清楚、简洁的地名表达。
- source_word: הִנֵּה
  choice: 就在那里
  rationale: 结合本句展示物件所在位置的语境，传达指示和引人注意的功能，比孤立使用“看哪”更符合自然汉语。
- source_word: לוּטָה בַשִּׂמְלָה
  choice: 裹在一件外衣里
  rationale: לוּטָה表示被包裹；שִׂמְלָה通常指衣服，尤其可指外衣。译文保留具体物件类别，并以脚注说明词义范围。
- source_word: אַחֲרֵי הָאֵפוֹד
  choice: 放在以弗得后面
  rationale: אַחֲרֵי在此表示空间位置；补出“放在”使汉语流畅，不改变原意。以弗得作为礼仪物件名称音译保留。
- source_word: אִם אֹתָהּ תִּקַּח לְךָ קָח
  choice: 你若要拿去归自己，就拿去吧
  rationale: 保留条件式和לְךָ所表达的归己含义，同时用“吧”呈现许可语气。
- source_word: כִּי אֵין אַחֶרֶת זוּלָתָהּ בָּזֶה
  choice: 因为这里除了这把，再没有别的了
  rationale: 以“这把”承接阴性名词“刀”，准确表达排除关系；בָּזֶה依语境译为“这里”。
- source_word: אֵין כָּמוֹהָ
  choice: 没有能比得上它的
  rationale: 保留该表达既可指独一无二、也可含卓越评价的语义张力，不明确增译为“没有更好的”。
- source_word: תְּנֶנָּה לִּי
  choice: 给我吧
  rationale: 汉语可省略已明确的宾语“它”；“吧”自然表达大卫的请求。
