    issue: “人们跳舞时，不正是为他对唱说”对原文歌舞语境的表达较泛，且“对唱说”搭配不自然。
    rationale: 原文的复数动词可指未具体说明的一群歌唱者，בַּמְּחֹלוֹת指歌舞／舞蹈庆典场合，随后לֵאמֹר引出所唱内容。修订以“他们在歌舞中……唱和着说”较完整而自然地对应这些要素。
  - severity: low
