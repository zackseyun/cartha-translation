base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/012.yaml
  text: And the servants of Achish said to him[a], “Is this not David, the king of the land? Is this not the one of whom they sang in the dances, saying, ‘Saul has struck down his thousands[b], and David his ten thousands’?”
translation:
  language: zh_hans
  text: '亚吉的臣仆对他说：“这不是那地的王大卫吗？他们在歌舞中不正是为这人唱和着说：


    ‘扫罗击杀了千千，


    大卫击杀了万万[b]’吗？”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: “万万”也可译作“数以万计”或“以万计”。
    reason: lexical_alternative
lexical_decisions:
- source_word: עַבְדֵי אָכִישׁ
  choice: 亚吉的臣仆
  rationale: עֶבֶד可泛指仆人、臣属或官员；此处指亚吉身边的人。“臣仆”既贴近原词，也符合王室语境，而不把其职分过度限定为“官员”。
- source_word: הֲלוֹא
  choice: 这不是……吗／不正是……吗
  rationale: 保留期待肯定回答的反问语气；按两个句子的汉语语境分别采用自然表达。
- source_word: מֶלֶךְ הָאָרֶץ
  choice: 那地的王
  rationale: 直译这一称呼，不解释为正式王位，也不把它改写成仅表示声望的称号，从而保留臣仆言语中的夸张或认知张力。
- source_word: יַעֲנוּ
  choice: 对唱
  rationale: ענה在歌舞语境中可指应答式歌唱。“对唱”比笼统的“唱”更能传达相互唱和的意味。
- source_word: בַמְּחֹלוֹת
  choice: 跳舞时
  rationale: 该词指舞蹈或歌舞庆典；译作“跳舞时”符合现代汉语，并保留歌唱发生于舞蹈场合的意思。
- source_word: הִכָּה
  choice: 击杀了
  rationale: נכה在战歌中指击倒乃至杀死敌人；“击杀”简洁、明确，并符合胜利之歌的语体。
- source_word: באלפו / ברבבתו
  choice: 千千／万万
  rationale: 采用汉语中对称而有节奏的集体数量表达，传达“成千／成万”的战绩，也保持原诗句的平行结构。
theological_decisions:
- issue: “那地的王”是正式头衔，还是非利士臣仆对大卫地位的夸张说法
  choice: 保留“那地的王”这一原文称呼，不加解释
  alternative: 译作“那地的领袖”或在正文中说明这是夸张称呼
  rationale: 希伯来文没有判定该称呼是否具有正式政治含义。直译可保留叙事张力，避免替读者消解臣仆的观点与当时大卫实际身份之间的差异。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。引歌以两行排列表现平行结构；“千千／万万”保留胜利之歌的节奏与传统汉语的凝练感。
