  text: וַ/יֹּ֥אמֶר אָכִ֖ישׁ אֶל עֲבָדָ֑י/ו הִנֵּ֤ה תִרְאוּ֙ אִ֣ישׁ מִשְׁתַּגֵּ֔עַ לָ֛/מָּה תָּבִ֥יאוּ אֹת֖/וֹ אֵלָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/015.yaml
  text: And Achish said to his servants[a], “Look, you see a man acting like a madman. Why do you bring him to me?”
translation:
  language: zh_hans
  text: 亚吉对臣仆说：“你们看，这人疯疯癫癫的[a]；为什么把他带到我这里来呢？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“发疯的”。希伯来语这个分词可指实际发疯，也可指表现得像发疯一样。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 以现代汉语叙事自然表达希伯来语连续叙事形式；本节无需机械补出“于是”。
- source_word: אָכִישׁ
  choice: 亚吉
  rationale: 采用该人名通行的中文音译。
- source_word: עֲבָדָיו
  choice: 臣仆
  rationale: 语境是王廷，所指为服侍亚吉的人；“臣仆”既保留从属关系，也符合君王语境。
- source_word: הִנֵּה
  choice: 看
  rationale: 保留引人注意的语气，同时避免古雅的“看哪”。
- source_word: תִרְאוּ
  choice: 你们看见
  rationale: 明确保留第二人称复数，并与前面的提示词形成原文所具有的重复。
- source_word: אִישׁ
  choice: 这人
  rationale: 原文为“一个人/男人”，在当面对其加以指示的汉语语境中译作“这人”更自然，且未增加身份判断。
- source_word: מִשְׁתַּגֵּעַ
  choice: 疯疯癫癫的
  rationale: 该Hitpael分词描写正在表现出的疯癫状态，可指真疯，也可指装疯；此译法重在可见行为，不武断判定其真实精神状态。
- source_word: לָמָּה
  choice: 为什么
  rationale: 直接保留疑问和责问语气。
- source_word: תָּבִיאוּ
  choice: 把他带到
  rationale: 未完成式在此处可指正在发生或已造成眼前结果的带来行为；现代汉语无须强行标明时体，以语境自然呈现。
- source_word: אֹתוֹ אֵלַי
  choice: 把他带到我这里来
  rationale: 准确表达宾语及朝向说话者的方向，“来”自然体现אֵלַי的向心意义。
theological_decisions:
- issue: 大卫的疯癫是真实还是伪装
  choice: 用“疯疯癫癫的”描写可观察到的行为，不在正文中判定真假
  alternative: 译作“疯了”或“装疯”
  rationale: מִשְׁתַּגֵּעַ本身在此可描述疯癫表现，而上下文表明大卫刻意改变行为；正文保留词语层面的张力，脚注说明两种可能。
translation_notes:
  register: 采用现代、庄重而口语自然的王廷对话。“看！你们看见”有意保留原文הִנֵּה与תִרְאוּ的强调性重复；“呢”传达亚吉责问臣仆的语气。
