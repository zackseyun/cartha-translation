  yaml_path: translation/ot/1_samuel/021/002.yaml
  text: David came to Nob, to Ahimelech the priest. Ahimelech trembled when he met David and said to him, “Why are you alone, and no man is with you?”
translation:
  language: zh_hans
  text: 大卫来到挪伯，到了祭司亚希米勒那里。亚希米勒见到大卫就战兢，对他说：“你为什么独自一人，身边没有别人呢？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֶּחֱרַד
  choice: 惶恐地
  rationale: 该词表示因恐惧或不安而战兢、惊惶；“惶恐地”既保留亚希米勒明显的畏惧，也符合现代汉语叙事表达。
- source_word: לִקְרַאת
  choice: 迎接
  rationale: 该介词结构表示前去与某人相会或迎面相见；结合语境译为“迎接”自然简洁，且不额外添加原文未明说的动作。
- source_word: לְבַדֶּךָ
  choice: 独自一人
  rationale: 准确表达“只有你自己”的意思，并与后句“没有人跟你在一起”形成原文中的强调和平行。
- source_word: וְאִישׁ אֵין אִתָּךְ
  choice: 没有人跟你在一起
  rationale: אִישׁ在否定存在句中泛指任何人，现代汉语宜译作“没有人”，不必限定为男性。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。保留原文对亚希米勒恐惧反应的直接描写，并保留问句中“独自一人／没有人同行”的重复强调。专名采用常见中文圣经译名“挪伯”“亚希米勒”。
