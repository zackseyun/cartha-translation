  text: 他就起身走了，约拿单进了城。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקָם
  choice: 他就起身
  rationale: קום的Qal叙事连续式表示“起来、起身”，并推动叙事发展；“就起身”自然体现动作承接。
- source_word: וַיֵּלַךְ
  choice: 走了
  rationale: הלך的Qal叙事连续式基本义为“走、去”。结合前文二人分别的场景，“走了”在现代汉语中自然表达离去，同时不额外指定目的地。
- source_word: וִיהוֹנָתָן
  choice: 约拿单则
  rationale: 专名按现代中文圣经通行形式译为“约拿单”；“则”清楚呈现两人随后行动的对照，避免重复使用生硬的“并且”。
- source_word: בָּא
  choice: 进了
  rationale: בוא在此为Qal完成式，基本义可为“来、进入”。与“城”连用时译作“进了城”符合自然汉语，并保留抵达、进入的语义。
- source_word: הָעִיר
  choice: 城
  rationale: עיר可指城或城镇；此处带定冠词。汉语在“进城”结构中通常无需另译定指成分，译作“进了城”最为自然。
