base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/005.yaml
  text: The priest answered David and said[a], “There is no ordinary bread on hand, but there is holy bread—if the young men have kept themselves from women.”
translation:
  language: zh_hans
  text: 祭司回答大卫说：“我手头没有普通的饼；不过，若那些年轻人没有亲近过女人[a]，我这里有圣饼。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译“使自己远离女人”；“女人”为单数，亦可泛指女人。这里指禁戒与女人发生性关系，以保持礼仪上的洁净。
    reason: 说明希伯来语委婉表达、单数词的泛指可能，以及本节所指的礼仪洁净语境。
lexical_decisions:
- source_word: לֶחֶם חֹל
  choice: 普通的饼
  rationale: חֹל在这里与“圣”相对，指未分别为圣、日常食用的饼，并非带有道德贬义的“不洁之饼”。
- source_word: אֶל תַּחַת יָדִי
  choice: 我手头
  rationale: 原文直译为“在我手下”，这里是表示现有、可供使用的惯用语；“我手头”自然准确。
- source_word: כִּי אִם לֶחֶם קֹדֶשׁ יֵשׁ
  choice: 只有圣饼
  rationale: כִּי אִם在否定句后引出唯一的例外；“只有”简明保留普通饼与圣饼之间的礼仪性对比。
- source_word: הַנְּעָרִים
  choice: 那些年轻人
  rationale: נְעָרִים可指青年、随从或仆人；此处不宜过度限定其身份，译作“年轻人”保留原词范围。
- source_word: אִם נִשְׁמְרוּ ... אַךְ מֵאִשָּׁה
  choice: 只要……没有亲近过女人
  rationale: נשׁמר מן表示使自己避开、禁戒；אַךְ限制所说的条件。中文“只要”自然表达这里的必要条件，“亲近过女人”在语境中委婉指性关系，又没有把礼仪背景直接扩写进正文。
theological_decisions:
- issue: 领受圣饼所附的礼仪洁净条件
  choice: 把条件译为年轻人没有亲近过女人，不在正文中进一步作神学解释。
  alternative: 明确译为“没有与女人发生过性关系，因而在礼仪上洁净”。
  rationale: 经文所述是与圣物有关的礼仪条件，并非对女人或婚内性关系作一般性的道德判断。正文保留原文的简洁和含蓄，脚注说明其所指。
translation_notes:
  register: 采用现代、庄重而易懂的叙事用语。“我手头”呈现希伯来语惯用表达；“普通的饼／圣饼”清楚保留礼仪类别的对照；“亲近过女人”保持原文的委婉表达，并用脚注避免误解。
