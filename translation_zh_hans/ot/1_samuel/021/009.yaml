base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/009.yaml
  text: And David said to Ahimelech[a], “Is there not here under your hand a spear or a sword? For I did not take my sword or my weapons in my hand[c][b], because the king’s matter was urgent.”
translation:
  language: zh_hans
  text: 大卫对亚希米勒说：“你手头上[a]有没有长矛或刀？我的刀和装备[b]都没有随身带来，因为王的事[c]很紧急。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“在你手下”，可指“由你支配”或“在你手中”。
    reason: lexical_alternative
  - marker: b
    text: “装备”也可译作“器具”或“用具”；在本处很可能指武器装备。
    reason: lexical_alternative
  - marker: c
    text: “王的事”也可理解为“王的事务”“王的话”或“王的命令”；原文用词含义较宽。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר דָּוִד לַאֲחִימֶלֶךְ
  choice: 大卫对亚希米勒说
  rationale: 按希伯来叙事句式自然引出直接引语；人名依通行中文音译。
- source_word: וְאִין יֶשׁ פֹּה
  choice: 你这里……没有……吗
  rationale: 将希伯来语否定存在问句译为自然的现代汉语疑问句，不额外断定说话者预期的答案。
- source_word: תַחַת יָדְךָ
  choice: 手头上
  rationale: 原文直译为“在你手下”，表示在其掌管、支配或持有之中；中文“手头上”既保留手的意象，也避免“手下”被误解为下属。
- source_word: חֲנִית אוֹ חָרֶב
  choice: 长矛或刀
  rationale: 分别对应两种武器；“长矛”可避免现代读者把“枪”误解为火器，“刀”则符合 חֶרֶב 在本段语境中的宽泛兵器义。
- source_word: גַם חַרְבִּי וְגַם כֵּלַי
  choice: 我的刀和装备都
  rationale: 重复的 גַם…גַם 表示两项兼指；כְּלִי 范围较广，可指器具、用具、装备，在此很可能是武器装备，但正文保留较宽的“装备”。
- source_word: לֹא לָקַחְתִּי בְיָדִי
  choice: 没有随身带来
  rationale: “拿在我手中”在此表达携带之意；译作“随身带来”符合现代汉语，同时不改变其因匆忙而未携装备的意思。
- source_word: דְבַר הַמֶּלֶךְ
  choice: 王的事
  rationale: דָּבָר 可指话、命令、事情或事务；“王的事”保留其宽泛性，不擅自限定为王命或公务。
- source_word: נָחוּץ
  choice: 很紧急
  rationale: 表达事情紧迫、必须赶快办理的含义，现代汉语清楚自然。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而口语可懂的直接引语。“手头上”避免直译“手下”在现代汉语中产生“下属”的歧义；正文保留“王的事”的语义宽度，并用脚注呈现主要可能译法。
