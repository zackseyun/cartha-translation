base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/019.yaml
  text: But the people refused to listen to the voice of Samuel[a], and they said, “No, but there shall be a king over us.”
translation:
  language: zh_hans
  text: 但是，百姓不肯听从撒母耳的话[a]。他们说：“不！而是要有一位王统治我们。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“听撒母耳的声音”；这个希伯来语表达也可指听取或服从。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמָאֲנוּ
  choice: 不肯
  rationale: מָאֵן表示拒绝、不愿意；“不肯”在现代汉语中自然简洁，也保留百姓主动抗拒的意味。
- source_word: הָעָם
  choice: 百姓
  rationale: עַם在此集合性地指要求立王的以色列民；“百姓”符合中文圣经叙事语体，也易于普通读者理解。
- source_word: לִשְׁמֹעַ בְּקוֹל שְׁמוּאֵל
  choice: 听从撒母耳的话
  rationale: שמע בקול是“听某人的声音”这一希伯来语习语，语境中含听取、遵从之意。“听从……的话”既自然传达其实际含义，又不过度缩窄为单纯的服从。
- source_word: וַיֹּאמְרוּ
  choice: 他们说
  rationale: אָמַר是一般性的说话动词；“他们说”直接保留叙事推进。
- source_word: לֹא
  choice: 不！
  rationale: 独立使用的否定词表达对撒母耳警告的坚决拒绝；用感叹号呈现其强调语气。
- source_word: כִּי אִם
  choice: 一定要
  rationale: 否定之后的כִּי אִם引出强烈反转，意为“不，反倒/而是”；结合后面的未完成式，“一定要”自然表达百姓坚持立王的语气。
- source_word: מֶלֶךְ יִהְיֶה עָלֵינוּ
  choice: 有一位王治理我们
  rationale: 字面为“一位王要在我们之上”；“治理我们”明确表达עַל在君王语境中的统治关系，同时保留立王诉求。
theological_decisions:
- issue: 百姓拒绝的对象是听见撒母耳的声音，还是听取并遵从他的警告
  choice: 正文译作“听从撒母耳的话”，脚注说明字面表达
  alternative: 不肯听撒母耳的声音／不肯听撒母耳的话
  rationale: 该希伯来习语兼有聆听与听从的语义。上下文显然涉及拒绝其劝告，但不应把含义收窄为纯粹的法律性“服从”；“听从……的话”较好保留两者。
translation_notes:
  register: 采用现代、庄重而清楚的叙事语言。“可是”承接前文并标示转折；将希伯来语连续的两个叙事动词分为两句，使中文对话更自然。“一位王”体现מֶלֶךְ的不定性；“治理我们”传达“在我们之上”的君王统治含义。
