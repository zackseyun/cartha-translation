revisions:
- from: 现在，你要听从他们的话；不过，你一定要郑重警告他们，把那将要统治他们的王通常会怎样行事[a]告诉他们。
  to: 现在，你要听从他们的话；不过，你一定要郑重警告他们，并告诉他们那将要统治他们的王的惯常做法[a]。
  rationale: 作轻微修订，以更直接、自然地呈现“王的 מִשְׁפָּט”，同时不将其解释为神圣认可的法定权利，也不把“通常”的频率作为原文明说的内容。其余关键表达忠实且适切，予以保留。
