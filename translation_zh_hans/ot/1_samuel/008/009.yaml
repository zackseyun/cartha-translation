review_pass:
  verdict: revise
  source_fidelity: “听从他们的话”恰当地表达 שׁמע בקולם 在此语境中依从请求的含义；“一定要郑重警告他们”也传达了 הָעֵד תָּעִיד 的强化和正式警告语气。末句以“通常会怎样行事”释义 מִשְׁפָּט，方向可取，但“通常”把原文未明说的频率明确化，且“把……怎样行事告诉他们”的句法略显拖沓。改为“王的惯常做法”更直接对应该名词，并保留其可指王权惯例／权利主张的语义空间。
  naturalness: 修订后句子更符合现代汉语中“告诉某人某人的做法”的搭配；“不过，……并……”清晰呈现原文命令后的限定与并列要求，语体庄重自然。
  terminology: “惯常做法”在本段预告随后王将采取的行为，避免将 מִשְׁפָּט 单面限定为获认可的“合法权利”。脚注保留“权利、权例、惯例”等替代可能；“治理规则”不宜作为与本处同等直接的译项，因其可能过度制度化，故从脚注删去。
  issues:
  - severity: low
    issue: “通常会怎样行事”中的“通常”可能过度明示频率。
    rationale: מִשְׁפָּט 可包含惯例或做法的意思，但原文并没有副词性地明确说“通常”；采用名词性“惯常做法”更贴合构词和句法。
  - severity: low
    issue: 末句“把那将要统治他们的王通常会怎样行事告诉他们”较为冗长。
    rationale: 改作“告诉他们那将要统治他们的王的惯常做法”更自然，也保持“告诉”的受事为 מִשְׁפָּט。
  revised_text: 现在，你要听从他们的话；不过，你一定要郑重警告他们，并告诉他们那将要统治他们的王的惯常做法[a]。
  revised_footnotes:
