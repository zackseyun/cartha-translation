source:
  edition: WLC
  text: וְ/עַתָּ֖ה שְׁמַ֣ע בְּ/קוֹלָ֑/ם אַ֗ךְ כִּֽי הָעֵ֤ד תָּעִיד֙ בָּ/הֶ֔ם וְ/הִגַּדְתָּ֣ לָ/הֶ֔ם מִשְׁפַּ֣ט הַ/מֶּ֔לֶךְ אֲשֶׁ֥ר יִמְלֹ֖ךְ עֲלֵי/הֶֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/009.yaml
  text: So now[a], listen to their voice; only, you must solemnly warn them and tell them the justice of the king who will reign over them.
translation:
  language: zh_hans
  text: 现在，你要听从他们的话；不过，你一定要郑重警告他们，并告诉他们那将要统治他们的王的惯常做法[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“王的权利”“王的权例”或“王的惯例”。希伯来语 מִשְׁפָּט 可指法定权利、惯例或行事方式。
    reason: 保留 מִשְׁפָּט 在此处可能指王的权利主张、惯例或行事方式的词义空间。
lexical_decisions:
- source_word: וְעַתָּה
  choice: 现在
  rationale: 承接上文并引出当下的命令；现代汉语用“现在”自然、清楚。
- source_word: שְׁמַע בְּקוֹלָם
  choice: 听从他们的话
  rationale: 该希伯来语习语表示听取、听从或依从某人的请求。“听从他们的话”既自然，也不暗示撒母耳赞同他们的要求。
- source_word: אַךְ כִּי
  choice: 不过
  rationale: 表示对前一命令的强烈限定；“不过”在现代汉语中自然地引出必须同时发出的警告。
- source_word: הָעֵד תָּעִיד
  choice: 一定要郑重警告
  rationale: 不定式绝对式与限定动词连用，加强语气；使役词形在此含正式警告、作证告诫之意。“一定要郑重警告”兼顾强调与严肃性。
- source_word: בָּהֶם
  choice: 他们
  rationale: 与警告动词连用，表示警告所针对的人；汉语直接说“警告他们”最自然。
- source_word: וְהִגַּדְתָּ לָהֶם
  choice: 告诉他们
  rationale: 准确表达“告知、说明”的基本意义，简明而符合直接训示的语境。
- source_word: מִשְׁפַּט הַמֶּלֶךְ
  choice: 王通常会怎样行事
  rationale: מִשְׁפָּט 可指法定权利、惯例、行事方式或治理规则。下文具体描述王将采取的做法，因此正文采用自然的描述性表达，同时以脚注保留“权利、权例”等可能含义。
- source_word: אֲשֶׁר יִמְלֹךְ עֲלֵיהֶם
  choice: 那将要统治他们的王
  rationale: 保留 מלך 的君王统治含义，并以现代汉语自然表达未来关系。
theological_decisions:
- issue: מִשְׁפַּט הַמֶּלֶךְ 是指王合法拥有的权利，还是描述王的惯常做法
  choice: 正文译为“王通常会怎样行事”，将重点放在随后所描述的王权运作方式上。
  alternative: 可译为“王的权利”“王的权例”或“王的惯例”。
  rationale: 后文列举王将征用人力和财物的行为。若只译作“合法权利”，容易使读者以为经文明确认可这些行为；描述性译法保留警告语气，而脚注则保留该词可能具有的法律性含义，不替经文预先消解其张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“郑重警告”保留原文强化结构的严肃性；“通常会怎样行事”避免生硬术语，并由脚注呈现关键歧义。
