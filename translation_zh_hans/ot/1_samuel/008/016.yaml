base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/016.yaml
  text: He will take your male slaves[a], your female slaves, your best young men, and your donkeys, and use them for his work.
translation:
  language: zh_hans
  text: 他必取走你们的男奴[a]、女奴、最好的青年男子和驴，用来为他做工。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“男仆……女仆”。这两个希伯来语词也可广义地指仆人，但这里君王强行取用他们的语境更支持译作“男奴……女奴”。
    reason: 保留希伯来语有关奴隶或仆人身份的词义幅度。
lexical_decisions:
- source_word: עַבְדֵיכֶם
  choice: 你们的男奴
  rationale: עֶבֶד 可指男奴或男仆；本节描述君王强行取用百姓的人力和财物，因此正文采用“男奴”，并以脚注保留较宽泛的“男仆”这一可能。
- source_word: שִׁפְחוֹתֵיכֶם
  choice: 女奴
  rationale: שִׁפְחָה 指女性奴仆；译作“女奴”既反映本段受支配、被征用的语境，也与“男奴”形成性别对应。
- source_word: בַּחוּרֵיכֶם הַטּוֹבִים
  choice: 你们最好的青年
  rationale: בָּחוּר 通常指正值壮年的年轻男子，הַטּוֹבִים 表示其中最好、最优良的；“最好的青年”自然保留年龄与素质两层含义。
- source_word: חֲמוֹרֵיכֶם
  choice: 你们的驴
  rationale: חֲמוֹרִים 是普通的“驴”，采用现代汉语常用称呼。
- source_word: יִקָּח
  choice: 必取走
  rationale: לקח 基本义为“拿、取”；在撒母耳预告君王将采取的行动这一语境中，“必取走”表达将来性和占用之意，又不把词义强化为原文未明确使用的“抢夺”。
- source_word: וְעָשָׂה לִמְלַאכְתּוֹ
  choice: 用来为他做工
  rationale: 该短语表达把前述人员和牲畜用于君王自己的劳役或事务；“用来为他做工”在现代汉语中自然，并可同时涵盖人和役畜。
theological_decisions: []
