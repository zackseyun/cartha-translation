base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/014.yaml
  text: He will take your fields[a], your vineyards, and your best olive groves[b], and give them to his servants.
translation:
  language: zh_hans
  text: 他必夺取你们最好的田地、葡萄园和橄榄园[a]，给他的臣仆[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“橄榄树”；希伯来语可集合性地指作为农业产业的橄榄种植区。
    reason: lexical_alternative
  - marker: b
    text: 或译“奴仆”；希伯来语词可按语境指臣仆、仆人或奴隶。
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂדֹתֵיכֶם
  choice: 你们的田地
  rationale: שָׂדֶה通常指田地或耕地；在并列的农业产业清单中译作“田地”直接自然。
- source_word: כַּרְמֵיכֶם
  choice: 你们的葡萄园
  rationale: כֶּרֶם通常指葡萄园；“葡萄园”准确且符合现代汉语习惯。
- source_word: זֵיתֵיכֶם
  choice: 你们的橄榄园
  rationale: זַיִת可指橄榄树，也可集合性地指橄榄种植园；这里与田地、葡萄园并列，译作产业层面的“橄榄园”最合适。
- source_word: הַטּוֹבִים
  choice: 最好的
  rationale: טוֹבִים字面为“好的”，在君王征取产业的语境中指其中上好的、最优质的部分；“最好的”自然传达此意。
- source_word: יִקָּח
  choice: 必夺取
  rationale: לָקַח基本义为“拿、取”；这里是君王强行取走百姓产业的警告，“夺取”明确呈现语境中的强制性，而不额外加入暴力方式。
- source_word: וְנָתַן
  choice: 赐给
  rationale: נָתַן意为“给”；主语是君王、接受者是其臣仆，汉语用“赐给”自然体现上下关系。
- source_word: לַעֲבָדָיו
  choice: 他的臣仆
  rationale: עֶבֶד可指仆人、奴仆或臣属；在王权语境中，这些人是接受产业的王室属员，“臣仆”既保留服属关系，又不武断限定其法律身份。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“必夺取……赐给……”保持先知警告的力度与句式节奏；脚注保留זַיִת和עֶבֶד的真实词义范围。
