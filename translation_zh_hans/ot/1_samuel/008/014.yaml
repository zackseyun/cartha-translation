  naturalness: 修订后的“他必夺取你们最好的田地、葡萄园和橄榄园，给他的臣仆”是自然、庄重的现代标准汉语。“给”直接对应 וְנָתַן，不额外强化为带有恩赐意味的“赐给”。
  terminology: “田地”“葡萄园”“橄榄园”准确反映农业地产的并列；“臣仆”在王室语境中可指王的属员／侍从，同时脚注保留 עֶבֶד 可指奴仆的词义范围。
