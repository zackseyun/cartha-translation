  text: וַ/יֹּ֕אמֶר זֶ֗ה יִֽהְיֶה֙ מִשְׁפַּ֣ט הַ/מֶּ֔לֶךְ אֲשֶׁ֥ר יִמְלֹ֖ךְ עֲלֵי/כֶ֑ם אֶת בְּנֵי/כֶ֣ם יִקָּ֗ח וְ/שָׂ֥ם ל/וֹ֙ בְּ/מֶרְכַּבְתּ֣/וֹ וּ/בְ/פָרָשָׁ֔י/ו וְ/רָצ֖וּ לִ/פְנֵ֥י מֶרְכַּבְתּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/011.yaml
  text: 'He said[a], “This will be the custom of the king who will reign over you: he will take your sons and assign them to his chariots and among his horsemen[c][b], and they will run before his chariots.”'
translation:
  language: zh_hans
  text: 他说：“统治你们的王将这样行事[a]：他要带走你们的儿子[b]，把他们派到自己的战车队和骑兵中；他们要在他的战车前奔跑[c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这将是统治你们之王的做法（或权利）。”希伯来语“米什帕特”（מִשְׁפַּט）可指惯常做法、法律权利或司法规范；这里描述王会怎样对待百姓。
    reason: lexical_alternative
  - marker: b
    text: 原文明确说“你们的儿子”，即男性后代，与这里为王服军役的语境相符。
    reason: cultural_note
  - marker: c
    text: 或译：“在他的战车队前。”原文为单数形式，既可指王的一辆战车，也可作集合意义理解。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁפַּט
  choice: 将这样行事
  rationale: מִשְׁפַּט在这里可指惯常做法、合法权利或规范。正文用“将这样行事”自然地表达撒母耳所描述的王权运作方式，同时避免把这种行为直接说成正当的法律权利。
- source_word: הַמֶּלֶךְ אֲשֶׁר יִמְלֹךְ עֲלֵיכֶם
  choice: 那统治你们的王
  rationale: 保留מלך的君王语义以及עַל所表达的管辖关系；现代汉语中“统治你们”清楚、庄重。
- source_word: אֶת־בְּנֵיכֶם יִקָּח
  choice: 他要带走你们的儿子
  rationale: “儿子”准确保留בְּנֵיכֶם在此处所指的男性后代，也符合随后军事服役的语境；“带走”保留יִקָּח的直接力度而不过度解释为正式征兵。
- source_word: וְשָׂם לוֹ
  choice: 把他们派到自己的……中
  rationale: שׂים加לוֹ表示王把这些人安置在为自己服务的位置；“派到”符合现代汉语军役语境，“自己的”体现לוֹ。
- source_word: בְּמֶרְכַּבְתּוֹ
  choice: 自己的战车队
  rationale: 原文为单数形式，但可作集合用法；“战车队”在汉语中自然地表达王室战车军役，同时以脚注说明数的歧义。
- source_word: וּבְפָרָשָׁיו
  choice: 和骑兵中
  rationale: פָרָשָׁיו指王的骑马军士或骑兵；“骑兵”简洁准确，并与“派到……中”的结构顺畅衔接。
- source_word: וְרָצוּ לִפְנֵי מֶרְכַּבְתּוֹ
  choice: 他们要奔跑在他的战车前
  rationale: 保留原文“奔跑在……前”的具体画面；末尾מֶרְכַּבְתּוֹ的单数或集合性理解留在脚注中，不在正文中强行消解。
theological_decisions:
- issue: מִשְׁפַּט是否表示王拥有正当的法律权利
  choice: 正文描述王将如何行事，不直接断言这些行为具有正当合法性
  alternative: 译作“王的权利”或“王的法度”
  rationale: 本段具有警告性质，而מִשְׁפַּט本身可指惯例、权利或规范；采用描述性表达可保留其语义张力，避免预先裁定经文是在认可还是仅在陈述王的索取行为。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“带走”保留王强行取用百姓儿子的力度；“战车队和骑兵中”清楚呈现王室军事编制，但不加入原文没有明说的具体职务。
