base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/007.yaml
  text: And Yahweh said to Samuel[a], “Listen to the voice of the people in all that they say to you, for they have not rejected you, but they have rejected me from being king over them.”
translation:
  language: zh_hans
  text: 耶和华对撒母耳说：“凡百姓对你所说的，你都要听从，因为他们不是厌弃你，而是厌弃我，不要我作他们的王。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神名音译“耶和华”，而不以称号“主”替代专名。
- source_word: שְׁמַע בְּקוֹל הָעָם
  choice: 百姓……你都要听从
  rationale: 希伯来语“听某人的声音”在此不只是听见，也指听取并照办；“听从”自然表达语境所要求的行动。
- source_word: לְכֹל אֲשֶׁר יֹאמְרוּ אֵלֶיךָ
  choice: 对你所说的一切
  rationale: 保留“所有、一切”的全面范围，同时符合现代汉语表达。
- source_word: מָאַס
  choice: 厌弃
  rationale: 该动词表示拒绝、弃绝；“厌弃”既保留关系性的 repudiation，也适合此处百姓拒绝神治理的语境。
- source_word: כִּי לֹא אֹתְךָ מָאָסוּ כִּי אֹתִי מָאֲסוּ
  choice: 因为他们不是厌弃你，而是厌弃我
  rationale: 用“不是……而是……”清楚再现希伯来文对撒母耳与神的强调性对比。
- source_word: מִמְּלֹךְ עֲלֵיהֶם
  choice: 不要我作他们的王
  rationale: מִן加不定式表达他们排斥神作王治理；此译保留神亲自为王的重点，并在现代汉语中自然清楚。
theological_decisions:
- issue: 以色列求立人王与神作王之间的关系
  choice: 明确表述百姓是在厌弃神，不要神作他们的王
  alternative: 只把事件理解为百姓拒绝撒母耳的领导
  rationale: 原文明确以“不是你……而是我”作对比，并把厌弃神与神在他们之上作王直接相连；译文保留这一神学张力，不作额外发挥。
translation_notes:
  register: 采用庄重、自然、易懂的现代标准汉语。“听从”传达希伯来习语在本语境中的执行含义；末句以“不要我作他们的王”避免生硬的“拒绝我统治他们”，并突出原文的个人王权意象。
