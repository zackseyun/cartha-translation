base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/013.yaml
  text: He will take your daughters to be perfumers[a], cooks, and bakers.
translation:
  language: zh_hans
  text: 他必带走你们的女儿，叫她们配制香料[a]、做饭、烘烤。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“配制香膏”。这里的希伯来语可泛指配制芳香混合物，包括香料、香膏或香水；并非特指烹调用香料。
    reason: 词义有合理的翻译分歧；脚注保留“香膏”的具体译法，并澄清正文“香料”所指的芳香配制物。
lexical_decisions:
- source_word: וְאֶת
  choice: '[直接宾语标记，不单独翻译]'
  rationale: 该词标明“你们的女儿”是“带走”的宾语；现代汉语无需用独立词语表示。
- source_word: בְּנוֹתֵיכֶם
  choice: 你们的女儿
  rationale: 该词是“女儿”的复数形式，带第二人称阳性复数后缀；在这段关于君王征用百姓的警告中，亲属意义最自然。
- source_word: יִקָּח
  choice: 必带走
  rationale: 未完成式在此表达撒母耳警告中将发生的事。“带走”保留了君王征用她们的强制意味，避免弱化为单纯的“任用”。
- source_word: לְרַקָּחוֹת
  choice: 调制香料
  rationale: 该阴性复数名词指配制芳香混合物的女子，所制之物可包括香料、香膏或香水。“调制香料”在现代汉语中自然，也保留其较宽的语义范围。
- source_word: וּלְטַבָּחוֹת
  choice: 做饭
  rationale: 该阴性复数名词指从事食物烹调的女子；上下文已有“女儿”，不必另行标出阴性。用“做饭”比职业化的“当厨师”更贴近日常宫廷劳役的语境。
- source_word: וּלְאֹפוֹת
  choice: 烤饼
  rationale: 该词源自动词“烘烤”，在此实体化，指从事烘烤工作的女子。古代语境主要涉及烤制饼类食物，译为“烤饼”比笼统的“烘焙”更具体自然。
