base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/003.yaml
  text: But his sons did not walk in his ways[a]; they turned aside after dishonest gain, took bribes[b], and perverted justice.
translation:
  language: zh_hans
  text: 他的儿子却不遵行他的道，反而偏去追求不义之财[a]，收受贿赂，枉法断案[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“追逐非分之利”或“贪图利益”。这里的希伯来语指以不正当或盘剥手段谋取的利益。
    reason: lexical_alternative
  - marker: b
    text: 直译“使审判偏离”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הָלְכוּ ... בִדְרָכָיו
  choice: 不遵行他的道
  rationale: “行走于某人的道路”是描述行为和生活方式的希伯来语惯用表达。“遵行他的道”保留“道”的比喻，同时符合现代汉语表达。
- source_word: וַיִּטּוּ
  choice: 偏去
  rationale: נטה在这里表示偏离正道；“偏去”既承接前面的“道”，也自然引出他们转而追逐的目标。
- source_word: אַחֲרֵי הַבָּצַע
  choice: 追求不义之财
  rationale: בצע在本节司法腐败的语境中，指以不正当或盘剥手段谋取的利益；“不义之财”兼顾所得与其非法性质。
- source_word: וַיִּקְחוּ שֹׁחַד
  choice: 收受贿赂
  rationale: שֹׁחַד特指影响裁判的贿赂；“收受贿赂”是现代汉语中准确而自然的法律道德用语。
- source_word: וַיַּטּוּ מִשְׁפָּט
  choice: 枉法断案
  rationale: 该短语字面为使审判偏离，实际指扭曲司法裁判。“枉法断案”简洁地保留了其司法语境和主动歪曲公正的含义。
- source_word: בָּנָיו
  choice: 他的儿子
  rationale: בָּנָיו为阳性复数，在上下文中特指撒母耳的两个儿子；汉语复数可由语境自然表达，无须添加“们”。
theological_decisions:
- issue: 对撒母耳众子的道德与司法评价
  choice: 明确译出他们追逐不义之财、受贿并扭曲裁判的司法腐败行为
  alternative: 笼统译作“他们贪心，行事不公”
  rationale: 原文连续使用谋取不义之财、收受贿赂和使审判偏离等司法腐败用语。译文不将其弱化为一般品格缺陷，也不添加原文之外的动机判断。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“不遵行他的道”保留希伯来语的道路比喻；“收受贿赂、枉法断案”使用普通读者易懂且具有司法准确性的表达。脚注标记按其实际解释对象分别置于“不义之财”和“枉法断案”之后。
