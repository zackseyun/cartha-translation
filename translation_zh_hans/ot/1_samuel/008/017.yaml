  yaml_path: translation/ot/1_samuel/008/017.yaml
  text: He will take a tenth of your flocks[a], and you will become his slaves.
translation:
  language: zh_hans
  text: 他必取走你们羊群的十分之一；你们也必成为他的奴仆[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “奴仆”也可译“仆人”、“臣仆”或“奴隶”。希伯来词可泛指服役或受人支配者；这里君王强制征收、百姓失去自由的语境，使“奴仆”更能体现警告的严厉性。
    reason: lexical_alternative
lexical_decisions:
- source_word: צֹאנְכֶם
  choice: 你们的羊群
  rationale: צֹאן统指羊类牲畜，通常包括绵羊和山羊；“羊群”在现代汉语中自然，并保留集合意义，避免只限定为绵羊。
- source_word: יַעְשֹׂר
  choice: 必取走……的十分之一
  rationale: 该动词在此表示抽取十分之一。上下文是君王强制征收，因此译作“取走……的十分之一”，比可能带有宗教奉献意味的“收取十一奉献”更准确。
- source_word: וְאַתֶּם תִּהְיוּ לוֹ
  choice: 你们也必成为他的
  rationale: 希伯来文直译可作“你们必作他的”；结合上下文，用“成为”自然表达君王征敛最终导致的受辖制状态。
- source_word: לַעֲבָדִים
  choice: 奴仆
  rationale: עֲבָדִים可指仆人、臣仆或奴隶。此处强调受君王强制辖制和自由丧失；“奴仆”保留严厉语气，同时不把其法律身份过度具体化。
theological_decisions:
- issue: 君王辖制语境中עֲבָדִים的译法
  choice: 奴仆
  alternative: 仆人；臣仆；奴隶
  rationale: 本节警告百姓，君王的征收最终会使他们受其支配。“奴仆”既传达这种强制性的隶属和自由受损，也保留希伯来词可涵盖不同服役或隶属身份的语义幅度；脚注列出其他可能译法。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“必”对应预告性的未完成式；分号呈现征收与受辖制后果之间的紧密联系。脚注标记置于相关词后。
