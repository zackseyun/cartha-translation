base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/008.yaml
  text: According to all the deeds that they have done from the day I brought them up out of Egypt to this day[a], forsaking me and serving other gods[b], so they are also doing to you.
translation:
  language: zh_hans
  text: 正如他们从我领他们出埃及的那天起，直到今天[a]所做的一切——离弃我，事奉别的神明[b]——他们如今也照样如此对待你。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“直到这一天。”
    reason: lexical_alternative
  - marker: b
    text: “事奉别的神明”也可译作“敬拜别的神明”；希伯来文动词的字面意思是“服事”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּכָל הַמַּעֲשִׂים אֲשֶׁר עָשׂוּ
  choice: 所做的一切都是这样
  rationale: כְּכָל引出以色列人当前行为与以往一切行为的类比；此译法在现代汉语中自然地保留“一切”及比较关系。
- source_word: מִיּוֹם הַעֲלֹתִי אֹתָם מִמִּצְרַיִם
  choice: 从我领他们出埃及的那天起
  rationale: העלה的使役形在出埃及表述中指把以色列人从埃及带出来；“领……出埃及”自然且保留这一固定历史指涉。
- source_word: וְעַד הַיּוֹם הַזֶּה
  choice: 直到今天
  rationale: 准确表达从出埃及之日延续到说话当日的时间范围。
- source_word: וַיַּעַזְבֻנִי
  choice: 离弃我
  rationale: 保留עזב所表达的抛弃与关系不忠，不另加“背叛”等解释性措辞。
- source_word: וַיַּעַבְדוּ אֱלֹהִים אֲחֵרִים
  choice: 事奉别的神明
  rationale: עבד字面为“服事、事奉”，用于神祇时兼有敬拜和效忠之意；“事奉”既贴近原词，也符合宗教语境。
- source_word: כֵּן הֵמָּה עֹשִׂים גַּם לָךְ
  choice: 如今他们也照样对待你
  rationale: “照样”保留כֵּן的类比功能，“也”对应גַּם；“对待你”以自然汉语保留原文没有具体说明所做之事的开放性。
theological_decisions:
- issue: 以色列对撒母耳的行为与他们离弃耶和华之间的关系
  choice: 把当前对待撒母耳的行为呈现为他们长期行为模式的延续
  alternative: 译作“他们怎样背叛我，也怎样背叛你”
  rationale: 原文明确说他们离弃耶和华并事奉别神，却只笼统地说他们也照样对撒母耳行；译文保留这层类比，不把后半句强化为原文未明说的“背叛”。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“神明”用于复数的外邦神祇，以免与独一上帝的称谓混淆；分号显明过去模式与当前行为之间的类比，同时不补充原文未说明的具体行动。
