  text: וַ/יֹּ֣אמֶר שְׁמוּאֵ֔ל אֵ֖ת כָּל דִּבְרֵ֣י יְהוָ֑ה אֶל הָ/עָ֕ם הַ/שֹּׁאֲלִ֥ים מֵ/אִתּ֖/וֹ מֶֽלֶךְ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/010.yaml
  text: So Samuel spoke all the words of Yahweh to the people who were asking him for a king[a].
translation:
  language: zh_hans
  text: 于是，撒母耳把耶和华的一切话都告诉了那些向他求一位王的百姓[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“那些曾向他求一位王的百姓。”希伯来语分词既可表示正在进行的行动，也可用来描述以这一请求为特征的那群人。
    reason: 保留希伯来语分词在持续行动与特征性描述之间的歧义。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 告诉了
  rationale: 该动词本义为“说”，但与“向百姓”和完整的信息内容搭配时，现代汉语用“告诉了”更自然，也保留了传达话语的意义。
- source_word: אֵת כָּל דִּבְרֵי יְהוָה
  choice: 耶和华的一切话
  rationale: 贴近原文结构，明确保留“一切”的总括强调，并呈现“话”这一圣经常用表达。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经语境中广为人知的专名音译来呈现四字神名，而不以“主”这一称号替代。
- source_word: אֶל הָעָם
  choice: 百姓
  rationale: 原文仅指“那百姓”；在本段以色列群体的语境中，“百姓”自然准确，无须增补“以色列”。
- source_word: הַשֹּׁאֲלִים מֵאִתּוֹ מֶלֶךְ
  choice: 那些向他求立一位王的百姓
  rationale: “向他”体现 מֵאִתּוֹ 所标示请求所指向的人；“求立一位王”比直译“求一个王”更符合现代汉语，并结合上下文准确表达请求有人作王。定冠词加分词构成对这群人的描述，其时态体意义仍以脚注保留。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。中文正文采用读者最熟悉、可明确识别为专名的“耶和华”，不以“主”替代；“雅威”是较接近学术重构读音的另一种音译。
- issue: 百姓求王的动作是持续进行还是此前已完成
  choice: 那些向他求立一位王的百姓
  alternative: 那些曾向他求立一位王的百姓
  rationale: 希伯来语分词可描写正在进行的行动，也可把人刻画为具有该请求特征的一群。正文采用不强行标明完成体的定语结构，脚注说明另一种时间理解。
translation_notes:
  register: 采用现代、庄重而通顺的叙事体。“于是”承接上文；“求立一位王”符合当代汉语表达，同时避免加入原文没有明说的评价。脚注标记已置于相关短语之后。
