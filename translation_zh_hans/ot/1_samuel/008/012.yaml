  text: וְ/לָ/שׂ֣וּם ל֔/וֹ שָׂרֵ֥י אֲלָפִ֖ים וְ/שָׂרֵ֣י חֲמִשִּׁ֑ים וְ/לַ/חֲרֹ֤שׁ חֲרִישׁ/וֹ֙ וְ/לִ/קְצֹ֣ר קְצִיר֔/וֹ וְ/לַ/עֲשׂ֥וֹת כְּלֵֽי מִלְחַמְתּ֖/וֹ וּ/כְלֵ֥י רִכְבּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/012.yaml
  text: He will appoint for himself commanders of thousands and commanders of fifties[a], and some to plow his ground and reap his harvest[c][b], and to make his weapons of war and the equipment of his chariots.
translation:
  language: zh_hans
  text: 他会为自己任命千夫长和五十夫长[a]，又派人耕种他的田地，收割他的庄稼[b]，制造他的兵器[c]和战车装备。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“统领一千人的官长和统领五十人的官长”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译近似“耕他的耕作，收他的收成”，强调为君王承担农务。
    reason: lexical_alternative
  - marker: c
    text: “兵器”也可译作“军事装备”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָשׂוּם לוֹ
  choice: 他会为自己任命
  rationale: 不定式结构承接上一节对君王行为的描述；汉语用限定动词表达更自然。“为自己”保留了לוֹ所强调的君王为自身役使、任用人员之意。
- source_word: שָׂרֵי אֲלָפִים וְשָׂרֵי חֲמִשִּׁים
  choice: 千夫长和五十夫长
  rationale: שַׂר在此为军事或行政首领；“千夫长、五十夫长”既保留希伯来的编制数字，也符合现代中文圣经语体。
- source_word: וְלַחֲרֹשׁ חֲרִישׁוֹ
  choice: 又派人耕种他的田地
  rationale: 原文是同根词结构，直译近似“耕他的耕作/耕地”。“耕种他的田地”自然地传达为君王从事农役，同时不把土地性质说得过细。补出“派人”承接任用人员的语境，避免误读为君王亲自耕作。
- source_word: וְלִקְצֹר קְצִירוֹ
  choice: 收割他的庄稼
  rationale: 原文同根结构可直译为“收割他的收成”；中文用“收割他的庄稼”自然，并保留劳动成果归君王所有的意味。
- source_word: וְלַעֲשׂוֹת כְּלֵי מִלְחַמְתּוֹ
  choice: 制造他的兵器
  rationale: כְּלִי含义宽泛，可指器具、装备或武器；与“战争”连用时，“兵器”准确而简洁。脚注保留较宽的“军事装备”译法。
- source_word: וּכְלֵי רִכְבּוֹ
  choice: 和战车装备
  rationale: רֶכֶב可指战车或战车部队；这里与כְּלֵי搭配，指供王室战车体系使用的器具或装备。“战车装备”保留其宽泛性。
theological_decisions: []
