lexical_decisions:
- source_word: וַיִּתְקַבְּצוּ
  choice: 聚集起来
  rationale: התפעל形式表达众人共同聚集；“聚集起来”自然呈现这一群体性动作。
- source_word: כֹּל זִקְנֵי יִשְׂרָאֵל
  choice: 以色列所有的长老
  rationale: כֹּל修饰整个长老群体；“长老”保留其作为以色列代表性领袖的社会政治称谓。
- source_word: וַיָּבֹאוּ אֶל שְׁמוּאֵל
  choice: 去见撒母耳
  rationale: בוא加אֶל表示来到某人那里；结合后面的目的地，现代汉语用“去见”既自然，又保留他们前往撒母耳所在之处的意思。
- source_word: שְׁמוּאֵל
  choice: 撒母耳
  rationale: 采用现代中文圣经中通行的人名译法。
- source_word: הָרָמָתָה
  choice: 到拉玛
  rationale: 地名后的方向词尾־ָה明确表示朝拉玛而去；译作“到拉玛”直接保留原文的移动和目的地方向。
