  text: וְ/הָיִ֥ינוּ גַם אֲנַ֖חְנוּ כְּ/כָל הַ/גּוֹיִ֑ם וּ/שְׁפָטָ֤/נוּ מַלְכֵּ֨/נוּ֙ וְ/יָצָ֣א לְ/פָנֵ֔י/נוּ וְ/נִלְחַ֖ם אֶת מִלְחֲמֹתֵֽ/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/020.yaml
  text: so that we too may be like all the nations[b][a], and our king may judge us and go out before us and fight our battles.
translation:
  language: zh_hans
  text: 好使我们也像列国一样[a]，让我们的王治理我们[b]，率领我们出征，为我们争战。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这样，我们也必像列国一样。”希伯来语形式可较直译为未来结果，但这里很可能是在说明百姓求立王的目的。
    reason: lexical_alternative
  - marker: b
    text: “治理”也可译作“审判”；原词兼有审判、施行公正和治理的含义。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיִינוּ גַם אֲנַחְנוּ
  choice: 好使我们也
  rationale: 这里承接上一节百姓求立王的目的；用“好使……也”自然表达目的或结果，同时保留“我们也”的强调。
- source_word: כְּכָל הַגּוֹיִם
  choice: 像列国一样
  rationale: גּוֹיִם在此指周围各国，并非后期技术意义上的“外邦人”；“列国”简洁而庄重，也保留以色列想与其他民族相同的张力。
- source_word: וּשְׁפָטָנוּ
  choice: 治理我们
  rationale: שׁפט可指审判、施行公正或治理。此处描述君王的整体职责，现代汉语用“治理”较自然；脚注保留“审判”的直译可能。
- source_word: מַלְכֵּנוּ
  choice: 我们的王
  rationale: 直接保留第一人称复数领属关系，突显百姓所要求的王权制度。
- source_word: וְיָצָא לְפָנֵינוּ
  choice: 率领我们出征
  rationale: 希伯来语字面为“在我们前面出去”，在军事语境中表示走在百姓前面带领出战；此译传达其惯用意义。
- source_word: וְנִלְחַם אֶת מִלְחֲמֹתֵינוּ
  choice: 为我们争战
  rationale: 原文是同根结构，意为打我们的仗；“为我们争战”符合现代庄重汉语，并清楚表达王代表百姓作战。
theological_decisions:
- issue: 以色列要求像גּוֹיִם一样
  choice: 列国
  alternative: 外邦人
  rationale: 本节的对比是政治和民族层面的，译作“列国”避免引入后期“外邦人”的技术含义，并保留以色列渴望仿效周围各国所形成的神学张力。
- issue: 君王שׁפט百姓的职能
  choice: 治理
  alternative: 审判
  rationale: “治理”在本语境中较完整地表达王的领导职能，但不排除司法含义；以脚注说明“审判”的直译，避免把词义范围静默收窄。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“率领我们出征”自然呈现“在我们前面出去”的军事含义；正文流畅表达，脚注则保留关键语法与词义歧义。
