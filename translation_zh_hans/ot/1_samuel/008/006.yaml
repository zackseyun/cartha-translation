base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/006.yaml
  text: But the matter was displeasing in Samuel’s eyes when they said[b][a], “Give us a king to judge us.” And Samuel prayed to Yahweh.
translation:
  language: zh_hans
  text: 但他们说：“给我们一位王来治理我们[a]。”这事在撒母耳看来是恶的[b]；撒母耳就向耶和华祷告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “治理我们”也可译作“审判我们”或“统治我们”。原词既可指施行审判，也可泛指治理。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“这事在撒母耳眼中是恶的”，表达撒母耳对这事强烈的负面判断；也可较自然地译作“这事使撒母耳不悦”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרַע ... בְּעֵינֵי שְׁמוּאֵל
  choice: 这事在撒母耳眼中看为恶
  rationale: 保留希伯来语“在……眼中”为恶的评价性表达，同时明确这是撒母耳对这事的判断，而不只是在描述他的情绪。
- source_word: הַדָּבָר
  choice: 这事
  rationale: דבר在此指前述要求；“这事”自然且不把含义过早限缩为“请求”。
- source_word: כַּאֲשֶׁר אָמְרוּ
  choice: 他们说……这事
  rationale: 原文可表达时间关系；中文调整语序，先引述他们所说的话，再以“这事”承接，未强化为明确的因果关系。
- source_word: תְּנָה לָּנוּ מֶלֶךְ
  choice: 请给我们一位王
  rationale: 忠实保留“给我们”的直接要求；加入“请”使现代汉语直接引语自然，并不削弱其命令语气。
- source_word: לְשָׁפְטֵנוּ
  choice: 来治理我们
  rationale: שפט在君王语境中不仅指司法审判，也涵盖治理、统辖；“治理”在现代汉语中更准确传达这里所求君王的职能，同时脚注保留“审判”的字面可能。
- source_word: וַיִּתְפַּלֵּל שְׁמוּאֵל
  choice: 于是撒母耳……祷告
  rationale: פלל的hitpael在此通常意为祷告；“于是”自然表达叙事承接。
- source_word: אֶל יְהוָה
  choice: 向耶和华
  rationale: אֶל与祷告连用自然译为“向”；以现代中文圣经读者熟悉的“耶和华”音译神名，并保留其专名性质。
theological_decisions:
- issue: 撒母耳负面评价的强度
  choice: 在撒母耳眼中看为恶
  alternative: 使撒母耳不悦／撒母耳很不高兴
  rationale: וירע具有“为坏、为恶”的评价力量；所选译法保留道德评价与主观视角之间的张力，不把它弱化为单纯情绪。
- issue: לְשָׁפְטֵנוּ所指的君王职能
  choice: 治理我们
  alternative: 审判我们／统治我们
  rationale: שפט与士师传统有词汇联系，但在要求君王的上下文中涵盖更广的治理职能；正文采用自然的“治理”，脚注明示字面译法。
- issue: 神名יהוה的译法
  choice: 耶和华
  alternative: 雅威／上主
  rationale: “耶和华”是现代简体中文圣经语境中广为人知的专名形式，能够与一般称号“主”区别；原文的具体发音仍有讨论空间。
translation_notes:
  register: 采用庄重而易懂的现代标准普通话。“在撒母耳眼中看为恶”有意保留原文的希伯来式意象与评价力度；引语和后半句则使用自然的现代汉语叙事节奏。所有脚注标记均置于其所说明的词句之后。
