base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/005.yaml
  text: They said to him[a], “Look, you have grown old, and your sons have not walked in your ways. Now appoint for us a king to judge us, like all the nations.”
translation:
  language: zh_hans
  text: 他们对他说：“看，你已经老了，你的儿子没有遵行你的道。现在为我们立一个王来治理我们[a]，像列国一样。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“审判我们”或“统管我们”；这里的希伯来语动词既可指审判，也可包括更广泛的治理权柄。
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: 看
  rationale: 保留希伯来语提示听者注意并带有直面意味的话语功能；“看”自然、简洁，也避免使用较古雅的“看哪”。
- source_word: זָקַנְתָּ
  choice: 你已经老了
  rationale: 该完成式表达进入老年后形成的现状；“已经老了”兼顾过程结果和当前状态，符合现代汉语。
- source_word: הָלְכוּ בִּדְרָכֶיךָ
  choice: 没有遵行你的道
  rationale: “行在你的道路上”虽更贴近字面，却略显生硬；“遵行你的道”保留“道路”所表达的生活方式和伦理榜样，也自然易懂。
- source_word: שִׂימָה לָּנוּ
  choice: 请为我们立
  rationale: 祈使形式在此是长老向撒母耳提出要求；“立”准确表达设立君王，“请”使汉语引语自然，但不削弱请求的明确性。
- source_word: מֶלֶךְ
  choice: 一个王
  rationale: 直接对应君主之意；“一个”符合现代汉语在首次引入不定指人物时的表达。
- source_word: לְשָׁפְטֵנוּ
  choice: 来治理我们
  rationale: שׁפט本义涉及审判、断案，在此政治语境中也涵盖领导和治理；正文用“治理”较自然地传达所求君王的整体职能，脚注保留较字面的“审判”。
- source_word: כְּכָל הַגּוֹיִם
  choice: 像列国一样
  rationale: גוים在此指周边各民族国家；“列国”保留以色列与其他民族的对照，又不引入后期“外邦人”的特定用语。
theological_decisions:
- issue: 以色列要求君王并以周边各国为政治模式
  choice: 像列国一样
  alternative: 像所有外邦人一样
  rationale: 原文突出以色列想仿效其他民族的君主制度；“列国”保留这种盟约与政治层面的张力，同时避免加入后期犹太教或新约语境中“外邦人”的色彩。
- issue: 君王职能中שׁפט的范围
  choice: 治理我们
  alternative: 审判我们
  rationale: 该动词既可指司法审判，也可在此指更广泛的统治和治理。正文采用符合君王语境的“治理”，脚注说明字面和司法层面的可能含义，不把两者割裂。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“遵行你的道”保留圣经伦理语汇而不过分古雅；“立一个王”简明呈现政治请求。脚注标记[a]紧接“治理我们”，明确对应存在语义范围的词语。
