  text: וַ/יִּשְׁמַ֣ע שְׁמוּאֵ֔ל אֵ֖ת כָּל דִּבְרֵ֣י הָ/עָ֑ם וַֽ/יְדַבְּרֵ֖/ם בְּ/אָזְנֵ֥י יְהוָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/021.yaml
  text: Samuel heard all the words of the people[b][a], and he spoke them in the ears of Yahweh.
translation:
  language: zh_hans
  text: 撒母耳听了百姓所说的一切话，就把这些话说给耶和华[a]听[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文的神名为YHWH，中文传统常译作“耶和华”；“雅威”是另一种常见拟音，也有译本译作“上主”。
    reason: alternative_reading
  - marker: b
    text: 希伯来文直译为“在耶和华耳中”，意思是让耶和华听见，或在他面前陈说。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: 听了
  rationale: שׁמע在此为叙事形式，直接表示撒母耳听见百姓的话；“听了”自然、准确，不额外加入“听从”的含义。
- source_word: כָּל דִּבְרֵי הָעָם
  choice: 百姓所说的一切话
  rationale: 兼顾כָּל的整体性和דִּבְרֵי的“话、言语”之义；比逐字译作“百姓的一切话”更符合现代汉语。
- source_word: וַיְדַבְּרֵם
  choice: 就把这些话说
  rationale: 动词后的复数宾语后缀回指百姓的话；“把这些话说”保留“说”的基本意义，避免用“转告”或“禀告”增添原文未明说的语气。
- source_word: בְּאָזְנֵי
  choice: 给……听
  rationale: 希伯来语直译为“在……耳中”，意为让对方听见。“给……听”在现代汉语中自然，并保留听觉意象；脚注说明其字面形式。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神名音译“耶和华”，并以脚注注明原文为四字神名YHWH及另一常见拟音“雅威”。
- source_word: שְׁמוּאֵל
  choice: 撒母耳
  rationale: 采用现代中文圣经传统中通行且易于辨认的人名译法。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 原文使用神的专名YHWH，而非普通称号。正文采用中文读者最熟悉的音译“耶和华”，脚注保留“雅威”这一常见拟音，并说明有译本按传统以“上主”代称，避免把某一种发音重构说成完全确定。
- issue: “在耶和华耳中”的表达
  choice: 说给耶和华听
  alternative: 在耶和华耳中说；向耶和华陈述
  rationale: 原文以身体意象表达耶和华亲自垂听。正文采用自然汉语，不把它解释成特定祷告形式；脚注保留字面意象。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“百姓所说的一切话”既清楚又贴近原文；“说给……听”保留希伯来语的听觉意象，同时避免生硬的逐字翻译。
