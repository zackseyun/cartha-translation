base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/018.yaml
  text: And in that day you will cry out because of your king, whom you have chosen for yourselves, but Yahweh will not answer you in that day.
translation:
  language: zh_hans
  text: 在那日，你们必因你们为自己所选的王而呼求；但雅威[a]在那日必不回应你们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威”是希伯来文יהוה所表示的上帝之名，传统上也译作“耶和华”。
    reason: 帮助普通读者识别较不熟悉的神名译法，并交代传统译名。
lexical_decisions:
- source_word: וּזְעַקְתֶּם
  choice: 你们必……呼求
  rationale: זעק表示人在困苦中发出强烈呼声，常含求助意味。“呼求”自然地传达这种急迫性，同时不明说经文未明示的呼求对象。
- source_word: בַּיּוֹם הַהוּא
  choice: 到那日／在那日
  rationale: 这是希伯来语常见的时间表达。首处译作“到那日”以符合现代汉语叙述，末处译作“在那日”，既保留原文的重复，也避免行文生硬。
- source_word: מִלִּפְנֵי
  choice: 因
  rationale: 该介词短语字面可指“从……面前”，此处表达导致呼求的缘由，即百姓因其王所带来的苦境而呼求；“因”简洁自然。
- source_word: מַלְכְּכֶם
  choice: 你们……的王
  rationale: 直接保留第二人称复数所属关系。
- source_word: אֲשֶׁר בְּחַרְתֶּם לָכֶם
  choice: 自己所选择的
  rationale: “自己”保留לָכֶם的反身强调，凸显百姓对选择君王所负的责任；“所选择的”自然连接关系从句。
- source_word: וְלֹא יַעֲנֶה
  choice: 但……必不回应
  rationale: 连接词在上下文中具有转折作用。“回应”准确表达ענה，并与前面的“呼求”形成自然对应；“必不”保留未完成式在预告中的确定语气。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以“雅威”音译上帝的专名四字神名，避免用称号取代原文中的名字。
- source_word: אֶתְכֶם
  choice: 你们
  rationale: 作为ענה的宾语，现代汉语自然表达为“回应你们”。
theological_decisions:
- issue: 如何翻译上帝的专名יהוה
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名。采用较贴近学界通行重构读音的“雅威”，并以脚注说明其性质；不以“主”等称号代替专名。
- issue: 是否明确说百姓向雅威呼求
  choice: 不补出呼求对象
  alternative: 译为“向雅威呼求”
  rationale: 虽然下半句“雅威必不回应”表明语境中的求助对象很可能是雅威，但上半句语法上没有明说对象。正文保留这一点，避免消除原文的含蓄。
translation_notes:
  register: 采用庄重而现代的普通话。“到那日……在那日”保留原文首尾重复所形成的警告语气；分号清楚呈现百姓呼求与雅威不回应之间的强烈转折。
