  yaml_path: translation/ot/1_samuel/008/002.yaml
  text: The name of his firstborn was Joel, and the name of his second was Abijah; they were judges in Beersheba.
translation:
  language: zh_hans
  text: 他的长子名叫约珥，次子名叫亚比亚；他们在别是巴作士师。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי שֶׁם
  choice: 名叫
  rationale: 这是希伯来语命名句式；现代汉语用“名叫”自然、准确，无须机械译出系词。
- source_word: בְּנוֹ הַבְּכוֹר
  choice: 他的长子
  rationale: בְּנוֹ明确表示“他的儿子”，הַבְּכוֹר表示排行首位者；合译为“他的长子”既保留信息，也符合现代汉语习惯。
- source_word: יוֹאֵל
  choice: 约珥
  rationale: 采用中文圣经传统中通行的人名音译。
- source_word: מִשְׁנֵהוּ
  choice: 次子
  rationale: 该词指他的第二个；承接前文“长子”，译作“次子”简洁自然，并明确排行关系。
- source_word: אֲבִיָּה
  choice: 亚比亚
  rationale: 采用中文圣经传统中通行的人名音译。
- source_word: שֹׁפְטִים
  choice: 作士师
  rationale: 复数分词表示两人持续担任审判、治理的职分；“作士师”保留以色列历史语境中的职称。
- source_word: בִּבְאֵר שָׁבַע
  choice: 在别是巴
  rationale: 介词表示任职地点；“别是巴”为通行地名译法。
