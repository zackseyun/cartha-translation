  yaml_path: translation/ot/1_samuel/008/015.yaml
  text: He will take a tenth of your seed and your vineyards and give it to his officials and his servants[a].
translation:
  language: zh_hans
  text: 他必征收你们的庄稼和葡萄园出产的十分之一，交给他的官员[a]和仆人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“宦官”；希伯来语 סָרִיסָיו 既可指宦官，也可泛指王宫官员。
    reason: lexical_alternative
lexical_decisions:
- source_word: זַרְעֵיכֶם
  choice: 你们的种子
  rationale: זֶרַע 的本义是“种子”，在此农业语境中也可指播种所得的出产。译作“种子”保留原文措辞及其语义幅度。
- source_word: כַרְמֵיכֶם
  choice: 你们的葡萄园
  rationale: כֶּרֶם 通常指葡萄园；原文直接以葡萄园为征取对象，十分之一在语境中自然指其出产。
- source_word: יַעְשֹׂר
  choice: 取十分之一
  rationale: עשר 的使役词干在此表示抽取或征收十分之一；“取十分之一”既准确，又避免使用带有较强宗教专门色彩的“什一奉献”。
- source_word: וְנָתַן
  choice: 赐给
  rationale: 连续式表达承接前面的将来行动。王将所取之物分给属下，汉语用“赐给”自然体现君王与臣属的关系。
- source_word: לְסָרִיסָיו
  choice: 他的官员
  rationale: סָרִיס 可指被阉割者，也可泛指王宫官员；本节的宫廷行政语境适合译为“官员”，同时以脚注保留另一可能。
- source_word: וְלַעֲבָדָיו
  choice: 臣仆
  rationale: עֶבֶד 可指仆人、臣属或奴隶。这里指王手下的人员；“臣仆”符合王权语境，也不武断限定其法律身份。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。“种子”有意保留原文的具体措辞和可指农业出产的语义幅度；“官员”正文配合脚注，保存 סָרִיס 的词义歧义。
