base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/022.yaml
  text: And Yahweh said to Samuel[a], “Listen to their voice and make a king for them.” Then Samuel said to the men of Israel, “Go[b], each man to his city.”
translation:
  language: zh_hans
  text: 耶和华对撒母耳说：“听从他们的话，为他们立一个王。”于是撒母耳对以色列众人说：“你们各自到自己的城去吧。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名“耶和华”对应四字神名，保留其作为以色列上帝之名的性质，而不以“主”这一称号代替。
- source_word: שְׁמַע בְּקוֹלָם
  choice: 听从他们的话
  rationale: שׁמע בְּקוֹל 是“听某人的声音”并进而照其请求行事的希伯来语习语；中文“听从他们的话”自然表达此处的遵从含义。
- source_word: וְהִמְלַכְתָּ לָהֶם מֶלֶךְ
  choice: 为他们立一个王
  rationale: מלך 的使役式在此指使某人成为王、设立君王；“立一个王”既简洁自然，也保留正式的王权设立意味。
- source_word: אַנְשֵׁי יִשְׂרָאֵל
  choice: 以色列众人
  rationale: 该短语字面为“以色列的男人们”，语境中指前来集会、由撒母耳遣散的以色列代表；“以色列众人”在中文中自然地保留其集体指称，避免误解为全国所有男性。
- source_word: לְכוּ
  choice: 回……去吧
  rationale: 命令式字面为“去”；结合后接“各自到自己的城”，中文以“回……去吧”自然表达遣散并返回本城的意思。
- source_word: אִישׁ לְעִירוֹ
  choice: 各自回自己的城
  rationale: אִישׁ 在此作分配用法，意为“各人”；עִירוֹ 是“他的城”。译文以“各自……自己的城”准确表达逐人返回所属城邑的意思。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 原文直接使用上帝的专名。中文采用通行且易辨识的“耶和华”，不以一般称号取代专名；“雅威”是另一种可能的音译。
- issue: 王权设立的表达
  choice: 立一个王
  alternative: 使一个王统治他们；为他们任命一个王
  rationale: 使役式表达设立君王，但本节未进一步说明王权的正当性或具体授予方式；“立一个王”保留动作本身，不额外化解上下文中上帝许可与警告之间的张力。
- issue: אַנְשֵׁי יִשְׂרָאֵל 的性别与代表性
  choice: 以色列众人
  alternative: 以色列的男人们；以色列人
  rationale: 原词形为阳性复数，但在叙事中可代表集会者。现代中文“以色列众人”不否认原文形式，同时避免把焦点不必要地限定为生理性别。
translation_notes:
  register: 采用现代、庄重而口语顺畅的叙事体。“听从他们的话”比逐字的“听他们的声音”更符合普通话习惯；“立一个王”保留简洁的正式语域；末句采用中文自然的遣散表达。
