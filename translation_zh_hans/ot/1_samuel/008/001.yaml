base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/001.yaml
  text: When Samuel grew old[a], he appointed his sons as judges over Israel.
translation:
  language: zh_hans
  text: 撒母耳年老时，就立他的儿子作以色列的士师[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“立他的儿子为以色列的士师。”原文“立”直译为“安置、设立”；“以色列”前的介词可理解为“为以色列”，也可按任命的语境理解为“治理以色列”。
    reason: 保留任命动词及介词 לְ 在此处可能表达的不同关系，避免将“为以色列服务”和“对以色列行使职权”之间的细微差别完全抹平。
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: ……就……
  rationale: 这是希伯来叙事中引出时间背景的惯用表达；现代汉语以“……就……”自然地呈现主句与时间从句的关系，不生硬直译“事情发生在……的时候”。
- source_word: זָקֵן
  choice: 渐渐年老
  rationale: 该动词表达年岁增长、变老的过程；“渐渐年老”保留动态含义，同时符合现代汉语表达。
- source_word: שְׁמוּאֵל
  choice: 撒母耳
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: וַיָּשֶׂם
  choice: 立
  rationale: 该词本义为“放置、设立”，在委任职分的语境中译作“立”简洁庄重，也准确传达任命之意。
- source_word: אֶת־בָּנָיו
  choice: 他的儿子
  rationale: 原文指撒母耳的男性后代；汉语“儿子”可在此作为集合性表达，对应原文复数。
- source_word: שֹׁפְטִים
  choice: 士师
  rationale: 此词所指职分兼有审判和治理功能；“士师”是该历史语境中准确且通行的中文称谓，避免缩减为现代司法意义上的“法官”。
- source_word: לְיִשְׂרָאֵל
  choice: 作以色列的士师
  rationale: 介词 לְ 可表示为某群体服务，也可在此任命语境中表达对该群体行使职权。“以色列的士师”保留两者之间的关系，而不在正文中过度限定为单一解释。
