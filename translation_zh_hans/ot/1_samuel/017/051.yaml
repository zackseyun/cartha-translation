base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/051.yaml
  text: Then David ran and stood over the Philistine[a], took his sword, drew it from its sheath, and killed him; then he cut off his head with it. When the Philistines saw that their champion was dead[b], they fled.
translation:
  language: zh_hans
  text: 大卫跑过去，站在那非利士人身旁[a]，拿起那非利士人的刀，从刀鞘中拔出来，杀死了他；又用那刀砍下他的头。非利士人看见他们的勇士死了[b]，就逃跑了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“站在那非利士人上方。”希伯来语可指在他近旁站定；按当时情景，也可能指大卫站在倒地的歌利亚上方。
    reason: lexical_alternative
  - marker: b
    text: “勇士”也可译作“猛将”或“战士”；这里指代表非利士人出战的歌利亚。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּרָץ
  choice: 跑过去
  rationale: רוץ是“跑”的常用动词；结合随后到达非利士人身边的动作，译作“跑过去”自然且保留叙事推进。
- source_word: וַיַּעֲמֹד אֶל הַפְּלִשְׁתִּי
  choice: 站在那非利士人身旁
  rationale: עמד אל可表示在某人近旁站定；希伯来语未明确表达“站在上方”，故正文采用较少解释性的“身旁”，并以脚注保留“站在……上方”的场景性理解。
- source_word: חַרְבּוֹ
  choice: 他的刀
  rationale: 后缀指那非利士人，意为他自己的兵器；“刀”符合现代汉语圣经叙事的自然表达。
- source_word: וַיִּשְׁלְפָהּ מִתַּעְרָהּ
  choice: 从鞘中拔出来
  rationale: שלף表示拔出兵器，תער在此指刀鞘；中文无需重复宾语即可清楚承接“刀”。
- source_word: וַיְמֹתְתֵהוּ
  choice: 杀死了他
  rationale: 该使役形式明确表示使他死亡。虽前一节已说歌利亚倒地，仍按本节叙事顺序保留完成杀死他的动作，不替文本消解张力。
- source_word: וַיִּכְרָת בָּהּ אֶת רֹאשׁוֹ
  choice: 又用那刀砍下他的头
  rationale: כרת与“头”连用表示砍下或割下头；בָּהּ回指那把刀，译作“用那刀”清楚自然。
- source_word: גִּבּוֹרָם
  choice: 他们的勇士
  rationale: גבור的基本义为大能者、勇士或战士。“勇士”既贴近词义，也不把本词本身过度限定为专门的代表决斗者；其角色可由上下文得知。
- source_word: וַיָּנֻסוּ
  choice: 逃跑了
  rationale: נוס常用于战场上的逃遁；“逃跑了”是现代汉语中直接、自然的表达。
theological_decisions:
- issue: 本节“杀死了他”与前一节歌利亚倒地之间的叙事关系
  choice: 直译为“杀死了他”，保留动作次序
  alternative: 弱化为“结果了他的性命”或解释为确认死亡
  rationale: 希伯来语明确使用使之死亡的动词；翻译不应擅自判断前一击已即时致死，或把本句仅解释为确认死亡。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。用“那非利士人”维持本章对歌利亚的称呼方式；正文选择“身旁”和“勇士”以贴近希伯来语的基本语义，并用脚注呈现更具场景或角色解释的译法。
