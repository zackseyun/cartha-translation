base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/007.yaml
  text: The shaft of his spear was like a weaver’s beam[a], and the iron head of his spear weighed six hundred shekels; and the bearer of the shield went before him.
translation:
  language: zh_hans
  text: 他长矛的杆像织布机的横梁，铁制的矛头重六百舍客勒；拿着大盾牌[a]的人走在他前面。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“盾牌”；希伯来语这个词可指遮护身体的大盾牌，而不是较小的盾。
    reason: 保留 צִנָּה 可指大型身体盾牌的词义信息，并说明正文采用“大盾牌”而脚注保留较宽泛译法。
lexical_decisions:
- source_word: חץ חֲנִיתוֹ
  choice: 他长矛的杆
  rationale: חץ 在此由“像织布机的横梁”这一比喻限定，所指不是箭，而是长矛的木杆；译作“长矛的杆”自然且明确。
- source_word: כִּמְנוֹר אֹרְגִים
  choice: 粗得像织布机的横梁
  rationale: 原文直译为“像织工的横梁”。补出比较所强调的“粗”，使现代读者明白该形象是在描写矛杆的粗大，同时保留织机横梁的原有比喻。
- source_word: לַהֶבֶת חֲנִיתוֹ
  choice: 矛的铁头
  rationale: לַהֶבֶת 字面可指刃或尖锐的金属部分；用于长矛时，“矛头”最符合现代汉语武器用语。原文后置的 בַּרְזֶל 表明其材质为铁。
- source_word: שֵׁשׁ מֵאוֹת שְׁקָלִים בַּרְזֶל
  choice: 重六百舍客勒
  rationale: 原文是省略式表达“六百舍客勒铁”；补出“重”以清楚表达重量关系。“舍客勒”保留古代重量单位，不以不确定的现代重量换算代替原文。
- source_word: נֹשֵׂא הַצִּנָּה
  choice: 拿着大盾牌的人
  rationale: צִנָּה 通常指较大的、可遮护身体的盾牌，因此正文译作“大盾牌”；整体采用自然汉语，而不使用较生硬的“持盾者”。
- source_word: הֹלֵךְ לְפָנָיו
  choice: 走在他前面
  rationale: 贴近原文分词结构，表示持盾者当时在歌利亚前方行进。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。以“长矛”“织布机的横梁”“大盾牌”等普通读者易懂的词语呈现军事装备；保留“舍客勒”这一古代重量单位。
