  text: וְ/יָצָ֧אתִי אַחֲרָ֛י/ו וְ/הִכִּתִ֖י/ו וְ/הִצַּ֣לְתִּי מִ/פִּ֑י/ו וַ/יָּ֣קָם עָלַ֔/י וְ/הֶחֱזַ֨קְתִּי֙ בִּ/זְקָנ֔/וֹ וְ/הִכִּתִ֖י/ו וַ/הֲמִיתִּֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/035.yaml
  text: I went out after it and struck it and rescued it from its mouth[a]; and when it rose up against me[b], I seized it by its beard and struck it and killed it.
translation:
  language: zh_hans
  text: 我就出去追赶它，击打它，把羊从它口中救出来[a]。它起来攻击我时，我就抓住它的胡须[b]，击打它，把它杀死。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语中“追赶它”和“它口中”的代词后缀均为阳性单数，所指的是上节的狮子或熊。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语直译为“它的胡须”；有些译本按猛兽的身体特征解释为“鬃毛”或“下颌”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָצָאתִי אַחֲרָיו
  choice: 我就出去追赶它
  rationale: יצא保留“出去”的具体动作；אַחֲרֵי在此表示追在猛兽后面。“追赶它”符合现代汉语叙事，也清楚表达大卫采取追击行动。希伯来语后缀为阳性单数，指上节所说的狮子或熊。
- source_word: וְהִכִּתִיו
  choice: 击打它
  rationale: נכה含义较广，可指击打或击倒。译作“击打”不提前加入致死含义，从而与末尾明确表示杀死的וַהֲמִיתִּיו保持区别；两次出现均作同样处理。
- source_word: וְהִצַּלְתִּי מִפִּיו
  choice: 把羊从它口中救出来
  rationale: Hiphil词形הצל表示搭救、救出；מִפִּיו直译为“从它口中”。原文未重复说明被救对象，但上节明确是羊；汉语若连续使用“它”容易混淆猛兽和羊，因此明说“羊”属于语境所要求的清晰化。
- source_word: וַיָּקָם עָלַי
  choice: 它起来攻击我时
  rationale: קום על表示起来敌对或攻击某人。用“起来攻击我”保留起身扑来的动态和敌对含义；“时”自然呈现这里的时间关系。
- source_word: וְהֶחֱזַקְתִּי בִּזְקָנוֹ
  choice: 我就抓住它的胡须
  rationale: חזק的Hiphil在此表示牢牢抓住；זָקָן通常指胡须。尽管用于猛兽时有译本解释为鬃毛、下颌或颌下毛，正文保留源文鲜明而稍显异常的“胡须”。
- source_word: וַהֲמִיתִּיו
  choice: 把它杀死
  rationale: מות的Hiphil明确表示使之死亡。“杀死”是自然、准确的现代汉语，并构成本句动作的高潮。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“出去追赶”“从它口中救出来”保留动作次序与具体形象；为避免现代汉语中多个“它”造成指代混乱，按上文补明被救的是“羊”。保留“胡须”这一源文用词，并以脚注说明常见解释。
