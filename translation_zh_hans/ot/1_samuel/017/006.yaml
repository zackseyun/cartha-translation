  text: And he had bronze greaves on his legs[a], and a bronze javelin between his shoulders.
translation:
  language: zh_hans
  text: 他腿上戴着青铜护胫；两肩之间有一支青铜短矛[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“标枪”。希伯来语所指的具体兵器并不确定，可能指一种较轻的矛类兵器；也有人理解为其他种类的兵器。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִצְחַת
  choice: 护胫
  rationale: 该词指保护小腿的甲具。“护胫”准确、简明，也比现代体育语境中的“护腿板”更符合古代军装。
- source_word: נְחֹשֶׁת
  choice: 青铜
  rationale: 在古代兵器与甲具的语境中通常指青铜；“黄铜”不合时代背景，单译“铜”则不够具体。
- source_word: עַל רַגְלָיו
  choice: 腿上
  rationale: רֶגֶל 可指脚或腿；因所穿的是护胫，此处自然指小腿部位，译作“腿上”符合上下文。
- source_word: כִידוֹן
  choice: 短矛
  rationale: 该词所指兵器并不完全确定，可指较轻、可能用于投掷的矛类兵器。“短矛”既保留矛类兵器的概念，也与本章后文较大的长矛有所区分。
- source_word: בֵּין כְּתֵפָיו
  choice: 背在两肩之间
  rationale: 原文直译为“在他的两肩之间”，在兵器携带语境中指背在背部两肩之间；此译保留原有空间意象，同时使现代汉语读者容易理解。
