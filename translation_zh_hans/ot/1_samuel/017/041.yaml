  text: And the Philistine came on[a], coming closer to David[b], with the man carrying the shield before him.
translation:
  language: zh_hans
  text: 那非利士人向前走，不断逼近大卫[a]；拿着大盾牌[b]的人在他前面。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文先用一个限定动词，随后接两个分词，直译近似“向前走，且不断走近”，描绘持续逼近的动作。
    reason: lexical_alternative
  - marker: b
    text: “大盾牌”所译的希伯来词（צִנָּה）通常指能提供较大面积遮护的盾牌。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ הַפְּלִשְׁתִּי
  choice: 那非利士人继续向前
  rationale: הלך本义为“走、前行”；结合后续分词，描写他持续朝对手推进。“继续向前”既保留运动过程，也符合战斗叙事语境，不增添原文没有的“勇士”等称谓。
- source_word: הֹלֵךְ וְקָרֵב אֶל דָּוִד
  choice: 步步逼近大卫
  rationale: 两个分词与前面的限定动词连用，突出持续前行、逐渐靠近的动态。“步步逼近”自然凝练，并传达不断接近大卫的过程。
- source_word: וְהָאִישׁ נֹשֵׂא הַצִּנָּה
  choice: 给他拿大盾牌的人
  rationale: נשא意为“拿、扛、携带”；צִנָּה通常指可遮护身体的大盾牌。此处用“大盾牌”呈现该词较具体的器物含义。
- source_word: לְפָנָיו
  choice: 走在他前面
  rationale: 该短语表示持盾者位于非利士人前方；补出“走”使伴随推进的场景在现代汉语中清楚自然。
