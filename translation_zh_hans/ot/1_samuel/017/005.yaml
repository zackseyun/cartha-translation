  yaml_path: translation/ot/1_samuel/017/005.yaml
  text: He had a bronze helmet on his head[a], and he was clothed with a coat of scale armor[b]; and the weight of the coat was five thousand shekels of bronze.
translation:
  language: zh_hans
  text: 他头戴铜盔，身穿鳞甲[a]；这副铜制鳞甲重五千舍客勒[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“鳞片甲”。希伯来语具体指由彼此重叠的鳞片状甲片制成的护甲。
    reason: lexical_alternative
  - marker: b
    text: 五千舍客勒约合57公斤。
    reason: cultural_note
lexical_decisions:
- source_word: כּוֹבַע
  choice: 盔
  rationale: 在军事语境中指保护头部的装备；与“铜”组合为自然、明确的“铜盔”。
- source_word: נְחֹשֶׁת
  choice: 铜
  rationale: 该词可泛指铜或青铜制品。现代汉语圣经语体通常以“铜”概括这种古代金属，也避免在材料成分并不确定时作过度精确的判定。
- source_word: שִׁרְיוֹן קַשְׂקַשִּׂים
  choice: 鳞甲
  rationale: קַשְׂקַשִּׂים 本义为“鳞片”，在此修饰护身甲，指由相叠甲片构成的鳞甲；“鳞甲”简洁而准确，也不与锁子甲混淆。
- source_word: הוּא לָבוּשׁ
  choice: 身穿
  rationale: 表达其当时穿戴护甲的状态，在现代汉语中自然庄重。
- source_word: מִשְׁקַל הַשִּׁרְיוֹן חֲמֵשֶׁת אֲלָפִים שְׁקָלִים נְחֹשֶׁת
  choice: 这甲所用的铜重五千舍客勒
  rationale: 保留原文的古代重量单位，并以自然汉语说明重量所衡量的是甲上的铜；现代单位换算置于脚注。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“头戴……身穿……”保持原文并列描写的节奏；“舍客勒”保留古代计量单位，并在脚注提供约数换算。
