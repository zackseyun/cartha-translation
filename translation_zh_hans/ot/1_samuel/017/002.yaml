base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/002.yaml
  text: And Saul and the men of Israel gathered together and camped in the Valley of Elah[a], and they drew up for battle against the Philistines.
translation:
  language: zh_hans
  text: 扫罗和以色列人聚集起来，在以拉谷安营，列阵迎战非利士人。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “迎战”或译“面对非利士人”（即与非利士人相对列阵）。
    reason: לִקְרַאת既可表示迎向某方，也可表示面对某方；军事语境支持“迎战”，但空间方位的含义仍值得保留。
lexical_decisions:
- source_word: וְשָׁאוּל וְאִישׁ יִשְׂרָאֵל
  choice: 扫罗和以色列众人
  rationale: 保留扫罗与以色列参战者并列的结构；אִישׁ在这里具有集合意义，“众人”自然地表达这一点，同时不把原文直接解释成“军队”。
- source_word: נֶאֶסְפוּ
  choice: 聚集起来
  rationale: 尼法勒式在此表示众人集结；“聚集起来”符合现代汉语叙事，也传达军事集结的语境。
- source_word: וַיַּחֲנוּ
  choice: 安营
  rationale: 准确表达扎营驻下之意，简洁而庄重。
- source_word: בְּעֵמֶק הָאֵלָה
  choice: 在以拉谷
  rationale: עֵמֶק意为“谷”；הָאֵלָה在此为地名，按音译作“以拉”。
- source_word: וַיַּעַרְכוּ מִלְחָמָה
  choice: 列阵
  rationale: 这一军事用语指摆开阵势、部署作战；“列阵”比直译“排列战争”自然准确。
- source_word: לִקְרַאת פְּלִשְׁתִּים
  choice: 迎战非利士人
  rationale: לִקְרַאת可表示“迎向、面对”；在交战语境中，“迎战”自然传达敌对相遇，同时用脚注保留空间性较强的理解。
theological_decisions: []
