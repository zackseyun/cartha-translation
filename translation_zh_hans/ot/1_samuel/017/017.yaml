  source_fidelity: 译文整体忠实呈现了耶西吩咐大卫携带一伊法烤谷和十个饼，并迅速前往军营给哥哥们。惟“这一伊法烤过的谷粒”缺少必要的结构连接，容易被读作“伊法被烤过”，未清楚表达希伯来文“烤谷的一伊法”。修订为“这一伊法的烤谷”明确保留计量单位与所量物品的关系。
  naturalness: “营中你哥哥们那里”不合现代汉语的自然句法。改为“赶快跑到营地，到你哥哥们那里去”，既自然，也保留原文末尾再次提及“你哥哥们”的强调。
  terminology: “耶西”“大卫”“伊法”“营地”均合适。“烤谷”是简洁且可理解的食品名称；脚注保留“烘过的谷粒”作为可行的词汇替代。
