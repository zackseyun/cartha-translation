base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/017.yaml
  text: And Jesse said to David his son[a], “Please take to your brothers this ephah of roasted grain and these ten loaves[b], and run to the camp to your brothers.”
translation:
  language: zh_hans
  text: 耶西对儿子大卫说：“请把这一伊法[a]的烤谷[b]和这十个饼带给你哥哥们，赶快跑到营地，到你哥哥们那里去。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “伊法”是古代的干量单位，约为22升。
    reason: cultural_note
  - marker: b
    text: “烤谷”也可译作“烘过的谷粒”。
    reason: lexical_alternative
lexical_decisions:
- source_word: קַח נָא
  choice: 请拿
  rationale: 命令式 קַח 加语气词 נָא，使吩咐带有请求或催促的语气；“请拿”在现代汉语中自然传达这一语气。
- source_word: לְאַחֶיךָ
  choice: 给你哥哥们
  rationale: 介词 לְ 在此标明接受者；结合大卫在家中的排行，אַחֶיךָ 译作“你哥哥们”比泛称“弟兄们”更符合叙事语境。
- source_word: אֵיפַת
  choice: 这一伊法
  rationale: אֵיפָה 是古代干量单位。正文保留具体单位“伊法”，并以脚注说明大致容量，避免把原文的计量表达改写成不确定的约数。
- source_word: הַקָּלִיא
  choice: 烤过的谷粒
  rationale: 该名词指经过烘烤或焙炒处理的谷物；“烤过的谷粒”清楚、自然，也保留食物形态。
- source_word: וַעֲשָׂרָה לֶחֶם
  choice: 和这十个饼
  rationale: לֶחֶם 可泛指饼或食物；与数词连用且处于送粮语境时，译作可数的“十个饼”最为自然。
- source_word: וְהָרֵץ
  choice: 赶快跑
  rationale: רוץ 的使役式命令在这里表达迅速前往；“赶快跑”既保留“跑”的生动性，也传出命令的急迫感。
- source_word: הַמַּחֲנֶה
  choice: 营中
  rationale: 在军事语境中 מַחֲנֶה 指军营；“营中”简洁自然。
- source_word: בְּנוֹ
  choice: 儿子
  rationale: 这是说明大卫与耶西关系的同位语；“儿子大卫”符合现代汉语叙事表达。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。保留原文两次提到“你哥哥们”的重复，并将 וְהָרֵץ 直观译为“赶快跑”，不弱化其急迫感。脚注标记均置于所解释的词语之后。
