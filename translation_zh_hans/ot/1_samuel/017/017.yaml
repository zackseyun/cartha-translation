revisions:
- from: 耶西对儿子大卫说：“请拿这一伊法[a]烤过的谷粒[b]和这十个饼给你哥哥们，赶快跑到营中你哥哥们那里去。”
  to: 耶西对儿子大卫说：“请把这一伊法[a]的烤谷[b]和这十个饼带给你哥哥们，赶快跑到营地，到你哥哥们那里去。”
  rationale: 修订仅处理汉语定中结构及末句语序，使“烤谷的一伊法”和“跑到营地、到哥哥们那里”的关系明确自然；保留原文的计量单位、食物数量、命令的礼貌／催促语气，以及对“你哥哥们”的两次提及。
