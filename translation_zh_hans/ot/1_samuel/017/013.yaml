base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/013.yaml
  text: The three oldest sons of Jesse had gone after Saul to the battle. And the names of his three sons who had gone to the battle were Eliab the firstborn[a], his second Abinadab, and the third Shammah.
translation:
  language: zh_hans
  text: 耶西的三个大儿子都跟随扫罗出征了。耶西那三个出征的儿子，名字分别是：长子以利押，次子亚比拿达，第三子沙玛。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלְכוּ / הָלְכוּ
  choice: 出征了
  rationale: הלך在本节表示前往并参与军事行动；结合לַמִּלְחָמָה，译作“出征”自然简洁，也符合叙事背景说明的语气。
- source_word: שְׁלֹשֶׁת בְּנֵי יִשַׁי הַגְּדֹלִים
  choice: 耶西的三个大儿子
  rationale: הַגְּדֹלִים在家庭排行语境中指年龄较长；结合后文列出的前三名儿子，“三个大儿子”是现代汉语中自然清楚的表达。
- source_word: אַחֲרֵי שָׁאוּל
  choice: 跟随扫罗
  rationale: אַחֲרֵי本义为“在……后面”，此处表示随同扫罗参加战事；“跟随”既保留其空间意象，也准确传达随军之意。
- source_word: לַמִּלְחָמָה / בַּמִּלְחָמָה
  choice: 出征
  rationale: מִלְחָמָה可指战争或战斗；这里描述参与当前军事行动，汉语“出征”能自然整合前往与参战两层意思。
- source_word: וְשֵׁם
  choice: 名字分别是
  rationale: 希伯来语以单数“名”引出多人名单；现代汉语宜按复数名单习惯译为“名字分别是”。
- source_word: בָּנָיו
  choice: 他……的儿子
  rationale: 代词后缀回指耶西；中文保留“他”可维持原文衔接，指代在近距离语境中清楚。
- source_word: הַבְּכוֹר
  choice: 长子
  rationale: בכור是家庭身份和排行用语，意为头生者；“长子”在中文中比“最大的”更准确凝练。
- source_word: וּמִשְׁנֵהוּ
  choice: 次子
  rationale: 该词表示排行紧接长子之后的人；中文家族排行中“次子”自然对应。
- source_word: וְהַשְּׁלִשִׁי
  choice: 三子
  rationale: 原文按次序列举第三位；“三子”与“长子、次子”构成自然整齐的中文序列。
- source_word: אֱלִיאָב / אֲבִינָדָב / שַׁמָּה
  choice: 以利押 / 亚比拿达 / 沙玛
  rationale: 采用现代中文圣经人名中通行且易辨识的音译。
theological_decisions: []
