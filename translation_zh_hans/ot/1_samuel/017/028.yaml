source:
  edition: WLC
  text: וַ/יִּשְׁמַ֤ע אֱלִיאָב֙ אָחִ֣י/ו הַ/גָּד֔וֹל בְּ/דַבְּר֖/וֹ אֶל הָ/אֲנָשִׁ֑ים וַ/יִּֽחַר אַף֩ אֱלִיאָ֨ב בְּ/דָוִ֜ד וַ/יֹּ֣אמֶר לָ/מָּה זֶּ֣ה יָרַ֗דְתָּ וְ/עַל מִ֨י נָטַ֜שְׁתָּ מְעַ֨ט הַ/צֹּ֤אן הָ/הֵ֨נָּה֙ בַּ/מִּדְבָּ֔ר אֲנִ֧י יָדַ֣עְתִּי אֶת זְדֹנְ/ךָ֗ וְ/אֵת֙ רֹ֣עַ לְבָבֶ֔/ךָ כִּ֗י לְמַ֛עַן רְא֥וֹת הַ/מִּלְחָמָ֖ה יָרָֽדְתָּ־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/028.yaml
  text: Eliab his oldest brother heard him speaking to the men[a], and Eliab’s anger burned against David, and he said, “Why have you come down here? And with whom have you left those few sheep in the wilderness? I know your presumption and the evil of your heart[b], for you have come down to see the battle.”
translation:
  language: zh_hans
  text: 大卫的大哥以利押听见大卫正跟那些人说话，就向大卫发怒，说：“你为什么下来？你把旷野里那几只羊留给谁了？我知道你的狂妄[a]和你心里的恶[b]；因为你下来是要看这场战事。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “狂妄”也可译作“骄傲”或“放肆”。
    reason: lexical_alternative
  - marker: b
    text: “你心里的恶”也可译作“你内心的邪恶”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּדַבְּרוֹ אֶל־הָאֲנָשִׁים
  choice: 听见他跟那些人说话
  rationale: ב加不定式结构表示以利押听见大卫正在说话；“那些人”保留אֲנָשִׁים的一般含义，不擅自具体化为“士兵”。
- source_word: וַיִּחַר אַף אֱלִיאָב בְּדָוִד
  choice: 就向大卫发怒
  rationale: 该希伯来语惯用语字面含有怒气燃烧的意象；现代汉语若直译为“鼻子发热”并不自然，故以庄重而清楚的“发怒”传达其惯用义。
- source_word: לָמָּה זֶּה יָרַדְתָּ
  choice: 你为什么下来？
  rationale: 保留ירד“下来”的空间方向；中文无需另加“这里”也能自然表达责问。
- source_word: וְעַל־מִי נָטַשְׁתָּ
  choice: 你……撇给谁了？
  rationale: נטשׁ可指撇下、离弃；“撇给谁”既保留责难语气，也不暗示羊群必定完全无人照管。
- source_word: מְעַט הַצֹּאן הָהֵנָּה
  choice: 那几只羊
  rationale: מְעַט表示数量少，指示词修饰羊群；“那几只羊”自然地传出以利押轻蔑、贬低的口吻。
- source_word: בַּמִּדְבָּר
  choice: 旷野里
  rationale: מִדְבָּר指未耕作的旷野或放牧地；“旷野”是准确且为普通读者熟悉的表达。
- source_word: זְדֹנְךָ
  choice: 你的狂妄
  rationale: זָדוֹן可表示狂妄、骄傲或僭越；“狂妄”兼具自高与越分行事的责斥意味。
- source_word: רֹעַ לְבָבֶךָ
  choice: 你心里的恶
  rationale: 直指内在之人的道德恶，不弱化为一般的坏心情或不良动机。
- source_word: לְמַעַן רְאוֹת הַמִּלְחָמָה
  choice: 不过是为了看这场战事
  rationale: לְמַעַן加不定式表达目的；“战事”适合尚处于两军对峙的场景，“不过是”在中文中自然承接以利押指控性的因果语气。
theological_decisions:
- issue: 以利押对大卫内心的判断是否作为叙事事实陈述
  choice: 保留为以利押直接说出的指控，不由译文判定其真伪
  alternative: 将其改写成客观旁白，或加上“自以为”等解释性限定
  rationale: 原文只记录以利押的愤怒与控告；译文不应确认或否定他对大卫内心的判断。
translation_notes:
  register: 采用现代、庄重而口语可懂的叙事中文。对话保留兄长盛怒下的尖锐责问；避免古奥的“怒气发作”和过度口语化措辞。所有脚注标记均置于相应主文词语之后。
