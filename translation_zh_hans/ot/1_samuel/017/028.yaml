revisions:
- from: 他的大哥以利押听见他跟那些人说话，就向大卫发怒，说：“你为什么下来？你把旷野里那几只羊撇给谁了？我知道你的狂妄[a]和你心里的恶[b]；你下来，不过是为了看这场战事。”
  to: 大卫的大哥以利押听见大卫正跟那些人说话，就向大卫发怒，说：“你为什么下来？你把旷野里那几只羊留给谁了？我知道你的狂妄[a]和你心里的恶[b]；因为你下来是要看这场战事。”
  rationale: 删除无原文依据的“不过是”，以保留目的从句本身而不额外断定“仅仅为了”。同时明确人物指代，并以自然的“留给谁了”替换较口语且搭配不稳的“撇给谁了”。其余措辞及两处脚注锚点均保留。
