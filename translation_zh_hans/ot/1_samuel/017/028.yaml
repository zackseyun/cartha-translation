    issue: “不过是为了看这场战事”中的“不过是”
    rationale: לְמַעַן רְאוֹת 表示目的，即“为了／是要看”。“不过是”加入“只是”的限制性语义；英文审校说明也明确不应加 just。
  - severity: low
    issue: 开头连续代词及“撇给谁了”
    rationale: 原译在上下文中可理解，但“大卫的大哥以利押……大卫正……”更清晰；“留给谁了”是更自然的标准汉语，仍可表达以利押所责问的“把羊留下给谁”。
