  source_fidelity: 译文准确呈现了扫罗为大卫穿戴衣物、置上青铜头盔，并给他穿上护身铠甲的三个动作；也保留了原文两次“使人穿上”的动词重复。 “战衣”在语境中可以成立，且没有与后面的“铠甲”混同。
