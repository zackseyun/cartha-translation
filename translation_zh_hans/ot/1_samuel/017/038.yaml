  yaml_path: translation/ot/1_samuel/017/038.yaml
  text: Then Saul clothed David with his garments[a], put a bronze helmet on his head[b], and clothed him with armor.
translation:
  language: zh_hans
  text: 于是，扫罗给大卫穿上扫罗自己的战衣[a]，给大卫戴上一顶青铜头盔，又给他穿上铠甲[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“衣服”或“军服”。原文所用的词可指一般衣服，也可指与身份或作战有关的服装。
    reason: lexical_alternative
  - marker: b
    text: 或译“护身甲”；原文没有明确说明铠甲的具体样式。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּלְבֵּשׁ
  choice: 给……穿上
  rationale: 使役形式表示“使某人穿戴”；“给……穿上”既自然，又保留了使役意义。末句再次使用这一表达，以对应原文动词的重复。
- source_word: מַדָּיו
  choice: 自己的战衣
  rationale: מַדִּים可指衣服，也常指与身份或作战有关的服装。上下文是扫罗为大卫披挂上阵，而本节又另列头盔和铠甲，因此译作“战衣”既体现军事语境，也不与护甲混为一谈；“自己的”表达第三人称阳性单数词尾所指的扫罗。
- source_word: קוֹבַע נְחֹשֶׁת
  choice: 一顶青铜头盔
  rationale: קוֹבַע指头盔；נְחֹשֶׁת在古代兵器语境中通常指青铜。“青铜头盔”是清楚、现代的表达。
- source_word: עַל רֹאשׁוֹ
  choice: 戴在他头上
  rationale: 按汉语习惯，将直译的“放在他头上”自然表达为“戴在他头上”，不改变动作内容。
- source_word: שִׁרְיוֹן
  choice: 铠甲
  rationale: 该词指护身甲，但本节未明确其具体结构；“铠甲”比“锁子甲”等技术性译法更稳妥，也比泛称“装备”更准确。
