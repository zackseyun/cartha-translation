base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/022.yaml
  text: So David left the supplies with the keeper of the supplies[a], and ran to the battle line[c][b]. When he arrived, he asked his brothers how they were.
translation:
  language: zh_hans
  text: 大卫把身上带的物品交给看守物品的人[a]，就跑到军阵那里[b]。他到了以后，向哥哥们问安[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “物品”所译的希伯来语含义较宽，也可指“行李”“器具”或“装备”；这里指大卫带到营中的东西。
    reason: lexical_alternative
  - marker: b
    text: “军阵”也可译作“战阵”或“列队的军兵”，指军队排成的阵列。
    reason: lexical_alternative
  - marker: c
    text: 希伯来文直译为“询问他哥哥们的平安”，是问候并询问他们是否安好的惯用说法。
    reason: idiom_explanation
lexical_decisions:
- source_word: וַיִּטֹּשׁ
  choice: 交给
  rationale: 该动词本义可指“留下、撇下”；结合后面的“在看守者手边”，这里不是遗弃，而是暂时交由他人照管。
- source_word: הַכֵּלִים מֵעָלָיו
  choice: 身上带的物品
  rationale: כֵּלִים 是含义宽泛的词，可指物件、器具、装备或行李；מֵעָלָיו 明说这些东西原在大卫身上。“身上带的物品”既保留这一细节，也不把所指过度限定为军用装备。
- source_word: עַל יַד שׁוֹמֵר הַכֵּלִים
  choice: 交给看守物品的人
  rationale: עַל יַד 字面与“手边”有关，在这里表达置于某人照管之下；此译符合现代汉语，并保留看守、保管的含义。
- source_word: וַיָּרָץ הַמַּעֲרָכָה
  choice: 跑到军阵那里
  rationale: וַיָּרָץ 明确表示“跑”；מַעֲרָכָה 指排列成形的军队阵列。“军阵”简洁地保留了军事队形的含义。
- source_word: וַיָּבֹא
  choice: 他到了以后
  rationale: 将连续叙事中的“他来到”自然处理为时间关系，保留动作先后，同时避免生硬重复。
- source_word: וַיִּשְׁאַל לְאֶחָיו לְשָׁלוֹם
  choice: 向哥哥们问安
  rationale: “询问……的平安”是希伯来语问候并关切近况的惯用表达；“问安”在中文中自然、庄重，也保留了问候与询问安好的语义空间。
- source_word: אֶחָיו
  choice: 哥哥们
  rationale: 上下文所指是大卫的亲兄长；现代汉语需区分长幼，因此译作“哥哥们”比泛称“兄弟们”更准确。
theological_decisions: []
