  yaml_path: translation/ot/1_samuel/017/030.yaml
  text: Then he turned away from him toward another and said the same thing[a], and the people answered him as before.
translation:
  language: zh_hans
  text: 他便从以利押身边转向另一个人，说了同样的话；众人也像先前那样回答他。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译：“众人回答他，所答的话和先前的话一样。”意思是他们给了他与先前相同的答复。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסֹּב מֵאֶצְלוֹ
  choice: 从以利押身边转向
  rationale: סבב表示转身或转向，מֵאֶצְלוֹ直指“从他身边”。为避免汉语中连续代词造成指代不清，按上文所指明说“以利押”，同时保留身体转向并离开其身边的画面。
- source_word: אֶל מוּל אַחֵר
  choice: 向另一个人
  rationale: מול带有朝向、面对的方向意味；“向另一个人”在现代汉语中自然，也不额外限定此人的身份。
- source_word: וַיֹּאמֶר כַּדָּבָר הַזֶּה
  choice: 说了同样的话
  rationale: דבר可指话、事情或所说的内容；这里指大卫重复先前所说的话。“说了同样的话”既贴近原文，也避免把动词具体化为原文未明说的“问”。
- source_word: וַיְשִׁבֻהוּ
  choice: 回答他
  rationale: 此处שׁוב的使役形表达把话回应给某人，即“回答”。这是清楚、自然的现代汉语表达。
- source_word: הָעָם
  choice: 众人
  rationale: עם基本义为人民或众人；这里指军中在场的人。“众人”符合语境，又不将其范围收窄为原文未明确指定的“士兵”。
- source_word: דָּבָר כַּדָּבָר הָרִאשׁוֹן
  choice: 像先前那样
  rationale: 原文近于“话如先前的话”，意思是他们给他的答复与先前相同。正文采用自然简洁的汉语，字面结构则在脚注中保留。
