  text: וַ/יֹּאמֶר֮ דָּוִד֒ יְהוָ֗ה אֲשֶׁ֨ר הִצִּלַ֜/נִי מִ/יַּ֤ד הָֽ/אֲרִי֙ וּ/מִ/יַּ֣ד הַ/דֹּ֔ב ה֣וּא יַצִּילֵ֔/נִי מִ/יַּ֥ד הַ/פְּלִשְׁתִּ֖י הַ/זֶּ֑ה וַ/יֹּ֨אמֶר שָׁא֤וּל אֶל דָּוִד֙ לֵ֔ךְ וַֽ/יהוָ֖ה יִהְיֶ֥ה עִמָּֽ/ךְס־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/037.yaml
  text: David said[a], “Yahweh, who delivered me from the paw of the lion and from the paw of the bear, he will deliver me from the hand of this Philistine.” Then Saul said to David, “Go, and may Yahweh be with you.”
translation:
  language: zh_hans
  text: 大卫说：“雅威曾把我从狮子的爪和熊的爪下救出来，他也必把我从这非利士人手中救出来。”扫罗对大卫说：“去吧！愿雅威与你同在[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“雅威必与你同在。”原文既可理解为祝愿，也可理解为对未来的陈述。
    reason: 保留希伯来语未完成式在此处可能具有的祝愿或直陈两种语气。
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常用的音译保留四字神名，而不用“耶和华”或“主”来替代原文中的专名。
- source_word: הִצִּלַנִי / יַצִּילֵנִי
  choice: 曾救我 / 也必救我
  rationale: 希伯来语使役形在此指从危险中解救；前后都用“救”保留过去经历与未来确信之间的呼应。“曾”与“必”分别清楚表达已发生的拯救和大卫对将来拯救的信心。
- source_word: מִיַּד
  choice: 脱离……的爪 / 脱离……的手
  rationale: 原文同用“手”这一表达；对狮子和熊译作“爪”符合现代汉语的具体意象，对非利士人译作“手”则自然保留原文惯用语。
- source_word: הָאֲרִי / הַדֹּב
  choice: 狮子 / 熊
  rationale: 直接对应原文所指的两种猛兽；汉语在此不需要另行表达定冠词。
- source_word: הוּא
  choice: 也必
  rationale: 原文独立代词“他”带有强调作用。汉语不重复神名或代词，而用“也必”承接前句，既自然，又突出同一位雅威过去施救、将来也必施救。
- source_word: הַפְּלִשְׁתִּי הַזֶּה
  choice: 这个非利士人
  rationale: 按现代汉语语序表达指示成分，保留大卫对眼前敌人的明确指称。
- source_word: לֵךְ
  choice: 去吧
  rationale: 简短直接地表达命令；句末“吧”符合汉语中准许并差遣对方前去的语气。
- source_word: יִהְיֶה עִמָּךְ
  choice: 愿雅威与你同在
  rationale: 该未完成式在语境中可作祝愿理解；“愿”自然表达扫罗差遣大卫时的祝福语气，同时以脚注保留直陈将来的另一种读法。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用以色列上帝的四字神名。译作“雅威”以专名形式保留原文，而不以称号替代，也不采用较传统但语音依据较弱的“耶和华”。
- issue: 扫罗末句的语气
  choice: 愿雅威与你同在
  alternative: 雅威必与你同在
  rationale: 希伯来语未完成式既可在此理解为祝愿，也可理解为对未来的陈述。正文采用更符合差遣场景的祝福语气，脚注保留直陈式读法，避免消除原文的语气歧义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“脱离……的爪／手”保留原文具体而有力的平行意象；“也必”使大卫基于过去拯救而产生的信心清楚连贯。脚注标记置于实际存在歧义的末句之后。
