base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/020.yaml
  text: So David rose early in the morning[a], left the sheep with a keeper, took the supplies, and went, just as Jesse had commanded him[b]. He came to the encampment as the army was going out to the battle line and shouting the war cry.
translation:
  language: zh_hans
  text: 大卫清早起来，把羊群交给一个看守者，带上所需的东西就走了，正如耶西吩咐他的。他来到营地[a]时，军队正出发前往战阵，并发出战斗的呐喊[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“环形营阵”或“车阵营垒”；这个希伯来语词可能更具体地指营地的环形布局或防御外围。
    reason: lexical_alternative
  - marker: b
    text: 直译：“他们在战斗中（或：为战斗）高声呼喊。”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכֵּם דָּוִד בַּבֹּקֶר
  choice: 大卫清早起来
  rationale: 该表达强调大卫一早便起身行动；“清早起来”自然、简洁，并保留叙事中的迅速感。
- source_word: וַיִּטֹּשׁ אֶת־הַצֹּאן עַל־שֹׁמֵר
  choice: 把羊群交给一个看守的人
  rationale: 原文指把羊留在看守者照管之下。“交给”在现代汉语中清楚表达托付照料，而不额外强化正式委托的意味。
- source_word: וַיִּשָּׂא
  choice: 带上那些东西
  rationale: 动词本义为拿起、携带，宾语在本节省略，可从上一节所述食物补给理解。“那些东西”既补足汉语表达，又避免把原文未明说的宾语限定得过死。
- source_word: כַּאֲשֶׁר צִוָּהוּ יִשָׁי
  choice: 正如耶西吩咐他的
  rationale: 保留“照着／正如”以及“吩咐”的命令意味，同时使用自然庄重的现代汉语。
- source_word: הַמַּעְגָּלָה
  choice: 营地
  rationale: 在此指军队驻扎之处，但该词可能更具体地表示环形营阵或防御性营垒；正文采用清楚的“营地”，具体可能性列入脚注。
- source_word: הַחַיִל הַיֹּצֵא אֶל־הַמַּעֲרָכָה
  choice: 军队正出发列阵
  rationale: 分词表示大卫抵达时正在发生的动作；מַעֲרָכָה 指战斗阵列。“正出发列阵”简洁呈现军队走向战阵的动态。
- source_word: וְהֵרֵעוּ בַּמִּלְחָמָה
  choice: 并发出战斗的呐喊
  rationale: רוע 的使役形在军事语境中表示发出高声呼喊；此译法呈现战斗呐喊的语境，同时由脚注保留原文较直译的结构。
