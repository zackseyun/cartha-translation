  to: 大卫清早起来，把羊群交给一个看守者，带上所需的东西就走了，正如耶西吩咐他的。他来到营地[a]时，军队正出发前往战阵，并发出战斗的呐喊[b]。
  rationale: 修订仅处理两处汉语表达和一处方向性：以“所需的东西”自然地承接原文省略而由上文补足的宾语；以“前往战阵”保留军队向战斗队列出去的动态；“看守者”则使名词表达更简洁。脚注标记及内容均保留，并继续保存营地术语与战斗呼喊结构的词义可能性。
