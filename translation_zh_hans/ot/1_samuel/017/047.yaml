  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/יֵֽדְעוּ֙ כָּל הַ/קָּהָ֣ל הַ/זֶּ֔ה כִּֽי לֹ֛א בְּ/חֶ֥רֶב וּ/בַ/חֲנִ֖ית יְהוֹשִׁ֣יעַ יְהוָ֑ה כִּ֤י לַֽ/יהוָה֙ הַ/מִּלְחָמָ֔ה וְ/נָתַ֥ן אֶתְ/כֶ֖ם בְּ/יָדֵֽ/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/047.yaml
  text: and all this assembly will know that Yahweh does not save by sword or by spear[a]; for the battle belongs to Yahweh[c][b], and he will give you into our hand.
translation:
  language: zh_hans
  text: 这全体会众都必知道：雅威不靠刀或矛施行拯救[a]；因为争战属于雅威[b]，他必把你们交在我们手里[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作：“雅威不用刀和矛解救人。”
    reason: 说明介词所表达的工具、手段意义，以及יְהוֹשִׁיעַ也可译为“解救”。
  - marker: b
    text: 希伯来文直译：“争战是雅威的。”
    reason: 保留原文以归属关系表达雅威对争战拥有主权的措辞。
  - marker: c
    text: “交在我们手里”是希伯来语习语，意思是“交给我们掌控”。
    reason: 解释“手”所表达的权力和控制含义，避免被误解为单指身体动作。
lexical_decisions:
- source_word: וְיֵדְעוּ כָּל הַקָּהָל הַזֶּה
  choice: 在场的所有人都会知道
  rationale: קָהָל指当时聚集的人群；译作“在场的所有人”既传达集合群体和整体范围，也避免“会众”在现代汉语中可能带来的宗教场所联想。未完成式在大卫的宣告中表达将要出现的结果，故译作“都会知道”。
- source_word: יְהוֹשִׁיעַ
  choice: 施行拯救
  rationale: 使役式动词在此表示拯救、解救。军事得胜包含在语境中，但“施行拯救”保留了该词比“使人获胜”更宽的意义。
- source_word: לֹא בְּחֶרֶב וּבַחֲנִית
  choice: 不是靠刀，也不是靠枪
  rationale: 介词בְּ表示手段；“靠”是自然的现代汉语表达。“刀”和“枪”分别对应חֶרֶב与חֲנִית，后者在此指长矛一类的兵器。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译呈现希伯来文四字神名，区别于用称号替代神名。
- source_word: כִּי לַיהוָה הַמִּלְחָמָה
  choice: 因为这场争战是雅威的
  rationale: 第二个כִּי引出原因；לַיהוָה表达归属。此译保留希伯来文“争战是雅威的”这一直接而富有张力的说法，没有缩减为仅指胜负或结果。
- source_word: וְנָתַן
  choice: 他必把……交在
  rationale: 完成式在预告性的言语环境中表达确定将发生之事；“必”兼顾将来指向和宣告的确定性。
- source_word: אֶתְכֶם בְּיָדֵנוּ
  choice: 把你们交在我们手里
  rationale: “交在某人手里”是现代汉语可理解的惯用表达，保留希伯来文单数“手”的形象，并传达交由对方掌控的含义。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用以四个辅音构成的神名。正文采用“雅威”这一常见的学术性音译，以保留专名性质；不以“主”这一称号取代，也不采用源于另一套传统元音组合的“耶和华”。
- issue: 军事语境中יְהוֹשִׁיעַ的意义范围
  choice: 施行拯救
  alternative: 解救；使人得胜
  rationale: 语境确实涉及战场得胜，但该动词本身是“拯救、解救”，不限于胜负结果；因此保留较宽的词义，不把神学含义缩窄为“使人得胜”。
- issue: “争战是雅威的”所表达的归属
  choice: 保留归属式表述
  alternative: 胜败在于雅威；雅威为我们争战
  rationale: 原文说争战属于雅威，并未明说“胜败”或补出“为我们”；保留原句可避免把其神学张力解释得过满。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“在场的所有人”适合战场公开宣告的语境；分号呈现原因分句与前述宣告之间的紧密关系。保留“争战是雅威的”和“交在我们手里”两处原文形象，同时用脚注帮助普通读者理解。
