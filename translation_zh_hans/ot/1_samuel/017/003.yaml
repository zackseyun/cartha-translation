base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/003.yaml
  text: The Philistines were standing on the mountain on one side[a], and Israel was standing on the mountain on the other side[b], with the valley between them.
translation:
  language: zh_hans
  text: 非利士人站在一边的山上[a]，以色列人站在另一边的山上，中间隔着山谷[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “山”也可译作“丘陵”；原文 הַר 在本节两处都可按语境指山或丘陵。
    reason: lexical_alternative
  - marker: b
    text: “山谷”也可译作“峡谷”；原文 גַּיְא 可指两侧陡峭的谷地。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפְלִשְׁתִּים
  choice: 非利士人
  rationale: 采用该族名在现代中文圣经语境中的通行译法；句首连接词 וּ 在此承接叙事，中文无需机械译作“而且”。
- source_word: עֹמְדִים
  choice: 站在
  rationale: 分词描写双方当时持续所处的位置；“站在”既保留基本姿态，也避免把它过度解释为“驻扎”。
- source_word: אֶל הָהָר מִזֶּה
  choice: 在一边的山上
  rationale: אֶל 与 עמד 连用时在这里表达相对于地形的位置；מִזֶּה 与后一处同语形成“两边”对照。הַר 可指山或丘陵，正文采用较直接的“山”，并以脚注保留另一可能。
- source_word: וְיִשְׂרָאֵל
  choice: 以色列人
  rationale: “以色列”在原文中是集合称谓，结合双方军队对阵的语境，中文译作“以色列人”更自然，也明确其所指是群体。
- source_word: אֶל הָהָר מִזֶּה
  choice: 在另一边的山上
  rationale: 与前句保持平行，并用“一边／另一边”自然表达原文重复短语所构成的空间对照。
- source_word: וְהַגַּיְא בֵּינֵיהֶם
  choice: 中间隔着山谷
  rationale: 准确表达山谷位于双方之间；“隔着”自然呈现其分隔作用。גַּיְא 可指一般山谷，也可指两侧陡峭的沟谷，正文采用较通俗的“山谷”。
