base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/049.yaml
  text: Then David reached his hand into the bag[a], took a stone from there, slung it, and struck the Philistine on his forehead. The stone sank into his forehead[c][b], and he fell on his face to the ground.
translation:
  language: zh_hans
  text: 大卫把手伸进袋子里[a]，从中取出一块石子，用甩石索甩出去，击中了那非利士人的额头。石子嵌进他的额头[b]，他就面朝下倒在地上[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“囊里”。原文所用的词含义较宽，此处指盛放大卫石子的容器。
    reason: lexical_alternative
  - marker: b
    text: 或译“石子陷进他的额头”。
    reason: lexical_alternative
  - marker: c
    text: 直译“他倒在脸上，向着地面”。
    reason: literal_rendering
lexical_decisions:
- source_word: וַיִּשְׁלַח ... אֶת יָדוֹ אֶל הַכֶּלִי
  choice: 把手伸进袋子里
  rationale: 希伯来语直译近于“把手伸向器具”，但上下文表明这是盛放石子的容器；“把手伸进袋子里”符合现代汉语叙事习惯。
- source_word: הַכֶּלִי
  choice: 袋子
  rationale: כְּלִי 语义宽泛，可指器具、物件或容器；此处按上下文指盛放石子的袋子，同时以脚注保留“囊”的可能表达。
- source_word: אֶבֶן
  choice: 一块石子
  rationale: 此处是供甩石索发射的石块；“石子”在现代汉语中自然地表达这种大小和用途。
- source_word: וַיְקַלַּע
  choice: 用甩石索甩出去
  rationale: 该动词表示使用甩石索投射；明确补出工具，可避免汉语“甩出去”被理解为徒手投掷。
- source_word: וַיַּךְ אֶת הַפְּלִשְׁתִּי אֶל מִצְחוֹ
  choice: 击中了那非利士人的额头
  rationale: אֶל 在这里标明击打部位；“击中了……的额头”准确而符合现代汉语。
- source_word: וַתִּטְבַּע הָאֶבֶן בְּמִצְחוֹ
  choice: 石子嵌进他的额头
  rationale: טבע 在此表达陷入、嵌入；“嵌进”保留生动动作，又不额外断定具体解剖伤势。
- source_word: וַיִּפֹּל עַל פָּנָיו אַרְצָה
  choice: 他就面朝下倒在地上
  rationale: 原文近于“他向着地面倒在脸上”；“面朝下倒在地上”自然清楚地保留其姿势和方向。
