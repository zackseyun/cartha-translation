base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/058.yaml
  text: Saul said to him[a], “Whose son are you, young man?” And David said, “I am the son of your servant Jesse the Bethlehemite.”
translation:
  language: zh_hans
  text: 扫罗对他说：“年轻人，你是谁的儿子？”大卫说：“我是[a]你仆人耶西——那伯利恒人的儿子。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“你仆人耶西——那伯利恒人的儿子。”希伯来文的回答没有明说“我是”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן מִי
  choice: 谁的儿子
  rationale: 这一希伯来语表达询问父系身份；“谁的儿子”在现代汉语中自然，也保留了原文对家世的直接关注。
- source_word: הַנָּעַר
  choice: 年轻人
  rationale: נַעַר 可指男孩、少年或年轻男子；本段中的大卫年纪尚轻，却已能参战，因此“年轻人”兼顾语境与词义范围。
- source_word: עַבְדְּךָ
  choice: 你仆人
  rationale: 此处是对君王自谦的宫廷用语；“你仆人”保留原文的谦卑语气，而不把重点误导到奴隶身份上。
- source_word: בֵּית הַלַּחְמִי
  choice: 伯利恒人
  rationale: 原文是表示籍贯的属民形容词；“伯利恒人”简洁地表明耶西来自伯利恒。
- source_word: וַיֹּאמֶר ... וַיֹּאמֶר
  choice: 说……说
  rationale: 两处均使用普通的“说”字根；直译为“说”既贴近原文，问句本身也已清楚表达扫罗是在询问。
- source_word: בֶּן עַבְדְּךָ יִשַׁי
  choice: 我是你仆人……耶西的儿子
  rationale: 希伯来文答语没有明说系词和第一人称主语；汉语补出“我是”可使回答完整自然，同时以脚注说明原文形式。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“你仆人”保留大卫面对君王时的谦恭措辞；将“伯利恒人”紧接“耶西”，避免误解为修饰大卫。
