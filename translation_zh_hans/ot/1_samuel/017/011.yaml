revisions:
- from: 扫罗和以色列众人听见这非利士人所说的这些话，就惊慌失措[a]，非常害怕。
  to: 扫罗和以色列众人听见那非利士人说的这番话，都丧胆[a]，极其害怕。
  rationale: 修订以“丧胆”对应חתת，较准确地表达受敌方言语震慑而心志受挫的状态；“极其害怕”对应יראו מאד。将冗长的领属结构改为“那非利士人说的这番话”，使中文更自然，同时不改变原文所指。脚注保留“惊惶失措”作为可行但较具动态色彩的译法。
