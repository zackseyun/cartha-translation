  yaml_path: translation/ot/1_samuel/017/011.yaml
  text: When Saul and all Israel heard these words of the Philistine[a], they were dismayed and greatly afraid.
translation:
  language: zh_hans
  text: 扫罗和以色列众人听见那非利士人说的这番话，都丧胆[a]，极其害怕。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“都惊惶失措。”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: 听见
  rationale: שׁמע在此为叙事中的普通“听见”，且直接宾语是对方所说的话。
- source_word: שָׁאוּל
  choice: 扫罗
  rationale: 采用现代中文圣经人名的通行译法。
- source_word: וְכָל יִשְׂרָאֵל
  choice: 和以色列众人
  rationale: 原文直译为“和全以色列”；本处按集体意义指在场的以色列人。“以色列众人”既保留集体表述，也符合现代汉语。
- source_word: דִּבְרֵי הַפְּלִשְׁתִּי הָאֵלֶּה
  choice: 这非利士人所说的这些话
  rationale: דִּבְרֵי指他所说的话；将领属结构译为“所说的”，使中文自然，同时保留הָאֵלֶּה“这些”的指示意味。
- source_word: וַיֵּחַתּוּ
  choice: 就惊慌失措
  rationale: חתת可表示被击垮、丧胆或惊惶。结合下句另用“害怕”，译作“惊慌失措”可表现其受到震慑后的失措状态，又不与后面的恐惧表达完全重叠。
- source_word: וַיִּירְאוּ מְאֹד
  choice: 非常害怕
  rationale: ירא意为“害怕”，מְאֹד加强程度；“非常害怕”是准确、自然的现代汉语。
theological_decisions: []
