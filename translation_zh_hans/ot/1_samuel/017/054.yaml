  text: וַ/יִּקַּ֤ח דָּוִד֙ אֶת רֹ֣אשׁ הַ/פְּלִשְׁתִּ֔י וַ/יְבִאֵ֖/הוּ יְרוּשָׁלִָ֑ם וְ/אֶת כֵּלָ֖י/ו שָׂ֥ם בְּ/אָהֳלֽ/וֹ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/054.yaml
  text: David took the head of the Philistine and brought it to Jerusalem[b][a], and he put his weapons in his tent.
translation:
  language: zh_hans
  text: 大卫拿了那个非利士人的头，把它带到耶路撒冷[a]，又把那人的装备[b]放在自己的帐棚里[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节直接说大卫把头带到耶路撒冷。按照本书此处的叙事进程，耶路撒冷当时尚未完全归以色列人控制；译文保留希伯来原文的说法，不另作时间上的调和。
    reason: cultural_note
  - marker: b
    text: 或译“兵器”“器具”。希伯来语这个词含义较广，在这里可包括武器、铠甲及其他军用物品。
    reason: lexical_alternative
  - marker: c
    text: 希伯来语直译为“他的帐棚”。这个所有格后缀形式上可能有不同所指；正文按上下文理解为大卫自己的帐棚。
    reason: textual_ambiguity
lexical_decisions:
- source_word: וַיִּקַּח
  choice: 拿了
  rationale: 这是叙事中常见的动词，表示大卫取走非利士人的头；“拿了”自然、直接，不额外加入“夺取”等语气。
- source_word: רֹאשׁ הַפְּלִשְׁתִּי
  choice: 那个非利士人的头
  rationale: רֹאשׁ在此按字面指被砍下的头；族名在上下文中实指歌利亚。“那个”使现代汉语表达自然，并指回前文已知的人物。
- source_word: וַיְבִאֵהוּ יְרוּשָׁלִָם
  choice: 把它带到耶路撒冷
  rationale: 使役形式在这里表示“带到”；阳性单数后缀回指希伯来语中为阳性名词的“头”，汉语用“它”。不把动作改写成将来或方向性表达。
- source_word: כֵּלָיו
  choice: 那人的装备
  rationale: כְּלִי语义宽泛，可指器具、兵器、铠甲或其他军用物品；“装备”既符合战斗语境，也避免将范围不必要地缩窄为仅指武器。“那人的”明确指那个非利士人。
- source_word: שָׂם
  choice: 放在
  rationale: 对应普通的放置动作，符合现代汉语叙事习惯。
- source_word: בְּאָהֳלוֹ
  choice: 自己的帐棚里
  rationale: אָהֶל通常指帐棚。按上下文，主语仍是大卫，因此正文采用最自然的理解，即大卫把战利品放在自己的帐棚里；脚注说明代词形式本身的歧义。
theological_decisions:
- issue: “他的装备”和“他的帐棚”中两个所有格后缀的所指
  choice: 装备属于非利士人，帐棚属于大卫
  alternative: 两个后缀都指大卫；或帐棚指非利士人、军营中的帐棚
  rationale: 上下文叙述大卫取得歌利亚的战利品，所以装备最自然地属于非利士人；句子的行动主体是大卫，因此帐棚最自然地理解为大卫的帐棚。不过，希伯来语两个后缀形式相同，正文所作的语境判断以脚注保留其形式上的歧义。
- issue: 把头带到耶路撒冷与叙事时间线之间可能存在的张力
  choice: 照原文直译为“把它带到耶路撒冷”
  alternative: “后来把它带到耶路撒冷”；“把它带往耶路撒冷方向”
  rationale: 希伯来文直接陈述该动作，并未加入“后来”或“朝向”等限定。译文不借释义来调和叙事或历史上的张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“又”对应希伯来语简单连接词，不添加转折意味；“那个非利士人”延续上下文对歌利亚的称呼。正文适度澄清两个所有格的自然所指，同时用脚注保留原文代词的歧义及耶路撒冷所带来的叙事张力。
