  text: גַּ֧ם אֶֽת הָ/אֲרִ֛י גַּם הַ/דּ֖וֹב הִכָּ֣ה עַבְדֶּ֑/ךָ וְֽ֠/הָיָה הַ/פְּלִשְׁתִּ֨י הֶ/עָרֵ֤ל הַ/זֶּה֙ כְּ/אַחַ֣ד מֵ/הֶ֔ם כִּ֣י חֵרֵ֔ף מַעַרְכֹ֖ת אֱלֹהִ֥ים חַיִּֽים־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/036.yaml
  text: Your servant struck down both the lion and the bear[a], and this uncircumcised Philistine will be like one of them, because he has defied the battle lines of the living God.
translation:
  language: zh_hans
  text: 你的仆人曾击倒狮子和熊；这未受割礼的非利士人必会像它们中的一个一样，因为他辱骂了永活上帝的军阵[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“军队”。希伯来语此词可指“军阵”“行列”，也可引申指“军队”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הִכָּה
  choice: 击倒过
  rationale: נכה的基本义是击打、击倒。这里指大卫制服致命猛兽；“击倒”保留动作的具体性，也不把动词本身直接窄化为“杀死”。
- source_word: עַבְדֶּךָ
  choice: 你的仆人
  rationale: 这是大卫对扫罗说话时谦恭的自称；“仆人”比“奴隶”更符合此处的宫廷称谓功能。
- source_word: הָאֲרִי ... הַדּוֹב
  choice: 狮子……熊
  rationale: 两个名词均带定冠词，指大卫所遭遇的两类具体猛兽。现代汉语不需用冠词，“狮子……熊”自然保留所指。
- source_word: וְהָיָה
  choice: 也必像
  rationale: 此处连接词加完成式在语境中表达对未来结果的确信；“必”传达大卫坚定的预期。
- source_word: הֶעָרֵל
  choice: 未受割礼的
  rationale: 直译身体上的盟约记号，保留大卫话语中的修辞和盟约意味，不释义为“无神的”或“盟约之外的”。
- source_word: כְּאַחַד מֵהֶם
  choice: 像它们中的一个
  rationale: 保留单数分配式比较，即这非利士人的结局将与狮子或熊相同。
- source_word: חֵרֵף
  choice: 竟敢辱骂
  rationale: חרף可表示辱骂、讥诮或公然蔑视。“辱骂”保留言语攻击，“竟敢”在汉语中自然体现其挑衅和蔑视语气。
- source_word: מַעַרְכֹת
  choice: 军阵
  rationale: 该复数名词首先指列阵、行列或战斗阵势。“军阵”保留具体军事意象，同时脚注列出“军队”这一引申译法。
- source_word: אֱלֹהִים חַיִּים
  choice: 永活上帝
  rationale: 这是希伯来语惯用称号，强调上帝真实地活着；“永活上帝”在现代中文中庄重、凝练，并保留其神学力度。
theological_decisions:
- issue: “未受割礼的”所具有的盟约含义
  choice: 正文保留字面表达“未受割礼的”
  alternative: 译作“盟约之外的”或“无神的”
  rationale: 原文以身体上的盟约标记构成神学性的贬称。直译既保留盟约对照，也避免把其含义扩写成解释。
- issue: מַעַרְכֹת与上帝的关系及其具体所指
  choice: 译作“永活上帝的军阵”
  alternative: 译作“永活上帝的军队”或“永活上帝的行列”
  rationale: 原文最直接描绘以色列摆出的战斗阵势，并称其属于永活上帝；“军阵”保留这一具体图景，而脚注保存“军队”的引申理解。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“你的仆人”保留对君王的谦恭自称；“竟敢辱骂”体现大卫话语中的义愤和挑战意味。脚注标记置于其实际解释的“军阵”之后。
