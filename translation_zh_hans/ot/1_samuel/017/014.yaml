  text: David was the youngest[a], and the three oldest had gone after Saul.
translation:
  language: zh_hans
  text: 大卫是最小的[a]；那三个年纪最大的哥哥跟随扫罗去了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作：“而大卫是最小的；那三个年纪最大的哥哥跟随扫罗去。”希伯来语句首的连接词也可明确译作“而”。原文动词表示动作已经发生，但本身不单独标明相当于英语过去完成时的相对时间关系。
    reason: 保留句首连接词的译法选择，并说明原文完成体不必要求在译文中表达过去完成时的相对时间关系。
lexical_decisions:
- source_word: וְ/דָוִד
  choice: 大卫
  rationale: 句首的וְ承接上下文；现代汉语叙事中不必机械译出“而/于是”，省略后仍保持自然连贯。
- source_word: הוּא הַ/קָּטָן
  choice: 是最小的
  rationale: הוּא带有强调作用，但汉语通常无需另译“他”；在兄弟排行的语境中，הַקָּטָן指年龄最小。
- source_word: וּ/שְׁלֹשָׁה הַ/גְּדֹלִים
  choice: 三个年长的哥哥
  rationale: 上下文明确所指是大卫的兄长；“年长的哥哥”自然表达הַגְּדֹלִים在家庭排行中的含义，同时避免把“גדולים”误解为身材高大。
- source_word: הָלְכוּ אַחֲרֵי
  choice: 跟随……去了
  rationale: 该短语字面为“走在……后面/跟在……后面”，这里指跟随扫罗而去；“跟随……去了”兼顾动作与归属关系，也不额外加入原文未明说的“出征”。
- source_word: שָׁאוּל
  choice: 扫罗
  rationale: 采用现代中文圣经传统中通行的人名译法。
