  text: And Israel and the Philistines drew up battle line against battle line[a].
translation:
  language: zh_hans
  text: 以色列人和非利士人摆开阵势，战阵相对[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“战阵迎向战阵。”或译：“战阵彼此相向。”
    reason: 原文两次使用“战阵”一词，并以“迎向／面对”表示双方军阵相向。
lexical_decisions:
- source_word: וַתַּעֲרֹךְ
  choice: 排好
  rationale: ערך在军事语境中指列队、布阵；“排好”与后面的“阵势”自然搭配，清楚表达军队部署完毕。
- source_word: יִשְׂרָאֵל
  choice: 以色列人
  rationale: 这里与“非利士人”并列，指以色列军众；译作“以色列人”符合现代汉语表达。
- source_word: וּפְלִשְׁתִּים
  choice: 和非利士人
  rationale: 采用该族群在简体中文圣经语境中的通行名称，并保留连接词。
- source_word: מַעֲרָכָה
  choice: 阵势／对阵
  rationale: 该词在本节两次出现，指军队列成的战阵。主句用“阵势”表达部署，后半用汉语军事惯用语“两军对阵”再现双方战阵相向的画面；脚注补出更形式对应的译法。
- source_word: לִקְרַאת
  choice: 对
  rationale: 该介词本义为迎向、面对；在交战语境中表示双方阵线彼此相向。“对阵”自然传达这一关系，同时保留敌对意味。
