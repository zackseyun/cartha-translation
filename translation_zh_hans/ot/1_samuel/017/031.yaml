  text: When the words that David had spoken were heard[a], they reported them before Saul, and he sent for him.
translation:
  language: zh_hans
  text: 大卫所说的话被人听见后，有人便向扫罗禀报，扫罗就把大卫召来。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְּשָּׁמְעוּ
  choice: 被人听见了
  rationale: 该复数主动形式直译可作“他们听见了”，但主语未明；用“被人听见了”自然保留不特指听者的叙事效果。
- source_word: הַדְּבָרִים אֲשֶׁר דִּבֶּר דָּוִד
  choice: 大卫所说的那些话
  rationale: דברים在这里指大卫先前说出的言语；“所说的那些话”符合现代汉语，也保留关系从句的含义。
- source_word: וַיַּגִּדוּ
  choice: 他们便……禀报
  rationale: נגד在此表示将消息告知上位者；因对象是君王扫罗，“禀报”准确体现宫廷语境而不过分古奥。
- source_word: לִפְנֵי שָׁאוּל
  choice: 向扫罗
  rationale: 字面为“在扫罗面前”，在告知动词之后惯用来表达向扫罗报告；汉语译为“向扫罗”更自然。
- source_word: וַיִּקָּחֵהוּ
  choice: 扫罗就把他召来
  rationale: לקח基本义为“取、带”，此处主语承接扫罗，宾语为大卫；“召来”表达扫罗使人把大卫带到面前的语境含义，同时以脚注保留字面可能。
