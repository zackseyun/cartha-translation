revisions:
- from: 大卫所说的那些话被人听见了[a]，他们便向扫罗禀报，扫罗就把他召来。
  to: 大卫所说的话被人听见后，有人便向扫罗禀报，扫罗就把大卫召来。
  rationale: 删除不准确的语法脚注。正文保留首句的被动意义及听者未具体指明的特点；“召来”以自然汉语传达扫罗命大卫到自己面前的语境性含义，同时不把“取他”误解为扫罗亲自带领大卫。
