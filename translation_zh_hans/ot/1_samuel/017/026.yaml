base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/026.yaml
  text: And David said to the men standing with him, “What will be done for the man who strikes down this Philistine and removes disgrace from Israel? For who is this uncircumcised Philistine, this one who has defied the battle lines of the living God?”
translation:
  language: zh_hans
  text: 大卫对站在他身旁的人说：“若有人击杀这个非利士人，除去以色列所受的羞辱，他会得到什么呢？这未受割礼的非利士人是谁，竟敢辱骂永活上帝的军阵？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַה יֵּעָשֶׂה לָאִישׁ
  choice: 他会得到什么呢
  rationale: 原文直译为“会为那人做什么”，语境中是询问给予击杀者的奖赏；采用自然汉语表达，同时保留疑问的开放性。
- source_word: יַכֶּה
  choice: 击杀
  rationale: נכה在此语境指击倒并杀死歌利亚；“击杀”准确而简洁。
- source_word: חֶרְפָּה
  choice: 羞辱
  rationale: 兼顾公开蒙羞、受辱的含义，符合歌利亚挑战以色列所造成的处境。
- source_word: הֶעָרֵל
  choice: 未受割礼的
  rationale: 保留原文立约身份色彩及大卫带有贬斥意味的称呼，不泛化为“异教徒”。
- source_word: חֵרֵף
  choice: 辱骂
  rationale: 该动词可指嘲弄、侮辱、蔑视或挑战；“辱骂”与本章歌利亚言语挑衅的语境贴合。
- source_word: מַעַרְכוֹת
  choice: 军阵
  rationale: 复数形式指列阵作战的队伍；“军阵”既简洁，也保留军事图景。
- source_word: אֱלֹהִים חַיִּים
  choice: 永活上帝
  rationale: “永活”自然表达“活着的”这一称号所强调的真实、持续生命，并与无生命的神明形成隐含对比。
theological_decisions:
- issue: “未受割礼”所表达的身份张力
  choice: 保留原有礼仪与立约用语
  alternative: 译作“异教的”或“不敬神的”
  rationale: 原文明确使用割礼范畴；保留这一措辞可呈现以色列与非利士人在立约身份上的张力，而不额外加入解释。
- issue: כִּי מִי... כִּי חֵרֵף的反问关系
  choice: 译为“算什么，竟敢……”
  alternative: 译为两个较独立的句子：“他是谁？因为他辱骂了……”
  rationale: 两个כִּי的句法带有强烈反问和理由/结果色彩；汉语“算什么，竟敢”自然传达大卫的义愤，但不增添特定教义判断。
- issue: “永活上帝”的称号
  choice: 保留神学称号而不释义
  alternative: 扩译为“真实而活着的上帝”
  rationale: 避免把称号中隐含的神学对比明说，从而保留原文的简洁与张力。
translation_notes:
  register: 采用现代、庄重而口语可懂的叙事体。对话中的“算什么，竟敢”传达原文反问的力度；“非利士人”“军阵”“永活上帝”保持圣经历史叙事的正式感。无脚注标记。
