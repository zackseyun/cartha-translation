base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/055.yaml
  text: When Saul saw David going out to meet the Philistine[a], he said to Abner, the commander of the army, “Whose son is this young man, Abner?” And Abner said, “As your soul lives, O king, I do not know.”
translation:
  language: zh_hans
  text: 扫罗看见大卫出去迎向那个非利士人，就问军队统帅押尼珥：“押尼珥，这个年轻人是谁的儿子？”押尼珥回答：“王啊，我以你的性命起誓[a]，我不知道。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语的誓言套语，直译可作“凭着你的性命（起誓）”，意思是“王啊，我确实不知道”。
    reason: 说明该誓言公式的字面意象及其在本句中加强否定断言的语力。
lexical_decisions:
- source_word: וְ/כִ/רְאוֹת
  choice: 扫罗看见……就
  rationale: 连词与不定词组合引出时间背景；用“看见……就……”自然表达希伯来文的时间关系和叙事推进。
- source_word: יֹצֵא לִ/קְרַאת
  choice: 出去迎战
  rationale: יֹצֵא表示向外走去，לִקְרַאת表示迎面相遇；鉴于明确的交战语境，“迎战”自然准确，又不增添“勇士”等原文没有的称谓。
- source_word: הַ/פְּלִשְׁתִּי
  choice: 那个非利士人
  rationale: 原文是带定冠词的族名单数形式，指上下文中那位特定的非利士人；不添加原文未明说的“勇士”或“巨人”。
- source_word: שַׂר הַ/צָּבָא
  choice: 军队统帅
  rationale: 该称号指军队的最高指挥者；“军队统帅”现代、庄重，并保留官职含义。
- source_word: בֶּן מִי זֶה הַ/נַּעַר
  choice: 这个年轻人是谁的儿子
  rationale: 贴近原文“这个年轻人是谁的儿子”；נַעַר在此指已能参与战斗的青年，译作“年轻人”比“男孩”更合适。
- source_word: חֵי נַפְשְׁ/ךָ
  choice: 我以你的性命起誓
  rationale: 这是以受话者生命为凭的希伯来誓言套语；正文译出其起誓功能，同时保留“你的性命”这一原文意象。
- source_word: אִם יָדָעְתִּי
  choice: 我不知道
  rationale: אִם在誓言结构中构成省略式的否定断言，实际语力是“我不知道”；若直译为“如果我知道”，现代汉语会意义不全。
