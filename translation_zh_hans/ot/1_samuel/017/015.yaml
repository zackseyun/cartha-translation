  yaml_path: translation/ot/1_samuel/017/015.yaml
  text: David went back and forth from Saul to shepherd his father's flock at Bethlehem[a].
translation:
  language: zh_hans
  text: 大卫常离开扫罗身边，回伯利恒牧放他父亲的羊群[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 较形式对应地可译：“大卫离开扫罗身边，回伯利恒去牧放他父亲的羊群。”
    reason: 保留“从扫罗那里”的出发点、反复行动的语境，以及牧放父亲羊群的目的；正文以“常”表达动词组合的惯常、重复意味。
lexical_decisions:
- source_word: הֹלֵךְ וָשָׁב
  choice: 常……往返
  rationale: 这组动词形式表达反复或惯常的行动，而不只是一次“去而返回”；“常……往返”既保留反复之意，也符合现代汉语表达。
- source_word: מֵעַל שָׁאוּל
  choice: 扫罗那里
  rationale: מֵעַל 在此表示离开扫罗身边或其所在之处；译作“扫罗那里”简洁自然，不进一步限定为官职或服役关系。
- source_word: לִרְעוֹת
  choice: 牧放
  rationale: רעה 指牧人的实际工作；“牧放”保留其动词性和牧养牲畜的具体含义。
- source_word: צֹאן
  choice: 羊群
  rationale: צֹאן 是小型牲畜的集合称呼，可包括绵羊和山羊；本处在牧放语境中译作通常的“羊群”，自然且清楚。
- source_word: אָבִיו
  choice: 他父亲的
  rationale: 按希伯来语附属结构和代词后缀，以现代汉语自然的领属结构表达。
- source_word: בֵּית לָחֶם
  choice: 伯利恒
  rationale: 采用该地名通行的中文圣经译名。
- source_word: וְ
  choice: 不单独译出
  rationale: 句首连接词在此承接并补充叙事；现代汉语无需机械译作“于是”或“现在”，省略可避免加入原文没有的显性时间标记。
theological_decisions:
- issue: 大卫与扫罗及伯利恒之间行动的关系
  choice: 在扫罗那里和伯利恒之间往返
  alternative: 从扫罗那里去而复返，为要在伯利恒牧放羊群
  rationale: 原文说明大卫反复离开扫罗那里，前往牧放父亲的羊群，但未明确交代宫廷职分的具体安排；正文只表达地点之间的惯常往返，不据此消解与前后叙事可能形成的张力。
translation_notes:
  register: 采用庄重而通俗的现代标准普通话。“往返”简洁呈现惯常反复的行动；“牧放”比宽泛的“照料”更贴近牧人语境。脚注标记已在正文中以[a]呈现。
