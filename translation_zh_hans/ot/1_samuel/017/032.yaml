base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/032.yaml
  text: And David said to Saul[a], “Let no man's heart fail because of him[b]. Your servant will go and fight with this Philistine.”
translation:
  language: zh_hans
  text: 大卫对扫罗说：“不要有人因他而丧胆[a]。你仆人要去跟这个非利士人交战。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “因他”指因这个非利士人。原文用代词“他”，所指由上下文表明。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר דָּוִד אֶל שָׁאוּל
  choice: 大卫对扫罗说
  rationale: 未特别译出叙事连接词 וַ；现代汉语叙事中直接用“说”自然流畅，也保留了说话者与对象。
- source_word: אַל יִפֹּל לֵב אָדָם
  choice: 不要有人……丧胆
  rationale: 希伯来语直译为“不要让人的心落下”。“丧胆”是自然、庄重的现代汉语，准确表达失去勇气之意；“有人”保留 אָדָם 在此处的泛指用法。
- source_word: עָלָיו
  choice: 因他
  rationale: 保留原文代词及其由上下文确定的指向，不在正文中擅自明说是这个非利士人。
- source_word: עַבְדְּךָ
  choice: 你仆人
  rationale: 这是大卫对君王的谦称；“你仆人”既贴近原文，也符合庄重的宫廷语境。
- source_word: יֵלֵךְ וְנִלְחַם
  choice: 要去……交战
  rationale: 未完成式在此表达大卫的意愿和决心。“要去”比单纯未来时更自然地传达主动请战；“交战”准确表达 נלחם 的战斗含义。
- source_word: עִם הַפְּלִשְׁתִּי הַזֶּה
  choice: 跟这个非利士人
  rationale: עִם 的字面义是“与、跟”；在争战语境中表示以对方为交战对象。“跟……交战”在现代汉语中自然，并保持原文介词表达。
theological_decisions: []
translation_notes:
  register: 采用现代、清楚而庄重的叙事语言。“丧胆”保留“心落下”这一希伯来习语的核心意义，但避免生硬直译；大卫自称“你仆人”，保留对君王说话时的谦恭语气。
