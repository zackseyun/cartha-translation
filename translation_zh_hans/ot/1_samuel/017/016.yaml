  text: The Philistine came forward morning and evening and took his stand for forty days[a].
translation:
  language: zh_hans
  text: 那非利士人每天早晚都上前来站定，连续四十天[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“那非利士人每天早晚都走近前来，站在那里，共四十天。”
    reason: 保留וַיִּגַּשׁ可译为“走近前来”，以及וַיִּתְיַצֵּב可较中性地译为“站在那里”的词义选择。
lexical_decisions:
- source_word: וַיִּגַּשׁ
  choice: 上前来
  rationale: נגשׁ表示走近、上前；在两军对阵的语境中，“上前来”自然传达他反复走到阵前的动作，又不增添原文没有的身份说明。
- source_word: הַפְּלִשְׁתִּי
  choice: 那非利士人
  rationale: 原文只称“那非利士人”，所指虽是歌利亚，但本节没有“勇士”等称号，因此不予增补。
- source_word: הַשְׁכֵּם וְהַעֲרֵב
  choice: 早晚都
  rationale: 两个时间表达形成每日早晨和晚上反复出现的节奏；“早晚都”是简洁自然的现代汉语表达。
- source_word: וַיִּתְיַצֵּב
  choice: 站定挑战
  rationale: התפעל词形表示使自己站定、占定位置；结合前文的挑战场景，“站定挑战”既传达自行站定，也让汉语读者自然理解其行动目的。
- source_word: אַרְבָּעִים יוֹם
  choice: 持续了四十天
  rationale: 该短语表示动作延续的时段；“持续了”在现代汉语中清楚呈现这段时间内反复发生的行动。
