base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/023.yaml
  text: While he was speaking with them[a], behold, the champion came up—the Philistine named Goliath, from Gath, from the ranks of the Philistines—and he spoke these words[b], and David heard.
translation:
  language: zh_hans
  text: 他正同他们说话时，看哪，那名阵前斗士[a]——来自迦特、名叫歌利亚的非利士人——从非利士人的队伍中[b]上来了。他又说了这些话，大卫听见了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“在两方之间的人”，指站在两军之间、代表一方进行单独决斗的战士。
    reason: lexical_alternative
  - marker: b
    text: 此处希伯来文本的写法与传统读法不同；按上下文可能指非利士人的阵列或队伍，也有译本译作“非利士人的营地”。
    reason: alternative_reading
lexical_decisions:
- source_word: וְהוּא מְדַבֵּר עִמָּם
  choice: 他正同他们说话时
  rationale: 独立人称代词加分词表示当时正在进行的动作；“同他们说话”保留 עִם 所表达的交谈意味。
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留引人注意、使场景突然鲜明起来的叙事标记，同时采用现代中文可理解的庄重表达。
- source_word: אִישׁ הַבֵּנַיִם
  choice: 阵前挑战的勇士
  rationale: 该习语指处在两军之间、代表一方进行单独决斗的战士；此译比直译“在两者之间的人”自然，又没有把含义泛化为普通勇士。
- source_word: עוֹלֶה
  choice: 上来了
  rationale: 分词描写人物进入现场；中文用“上来了”自然呈现从非利士阵中走到阵前的动态。
- source_word: גָּלְיָת הַפְּלִשְׁתִּי שְׁמוֹ מִגַּת
  choice: 他就是来自迦特、名叫歌利亚的非利士人
  rationale: 保留族属、姓名和籍贯三项身份信息，并按现代汉语习惯调整语序。
- source_word: ממערות פְּלִשְׁתִּים
  choice: 从非利士人的队伍中
  rationale: 传本文字和读法存在困难；按战场语境译作从非利士人的阵列或队伍中出来，并在脚注保留其他可能译法。
- source_word: וַיְדַבֵּר כַּדְּבָרִים הָאֵלֶּה
  choice: 他说了这些话
  rationale: 保留指回前文挑战之言的表达，不将其解释性扩写为“同样的辱骂”或其他更具体措辞。
- source_word: וַיִּשְׁמַע דָּוִד
  choice: 大卫听见了
  rationale: 按希伯来文保留未明说的宾语，由上下文自然确定大卫听见的是歌利亚的话。
