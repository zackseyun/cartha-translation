revisions:
- from: 他正同他们说话时，看哪，那位阵前挑战的勇士[a]从非利士人的队伍中[b]上来了；他就是来自迦特、名叫歌利亚的非利士人。他说了这些话，大卫听见了。
  to: 他正同他们说话时，看哪，那名阵前斗士[a]——来自迦特、名叫歌利亚的非利士人——从非利士人的队伍中[b]上来了。他又说了这些话，大卫听见了。
  rationale: 修订避免将“代表战士”直接解释为“挑战者”，恢复姓名、族属和籍贯对“斗士”的同位关系，并精确化文本脚注。其余内容保留原译对进行中动作、“看哪”的叙事提示，以及“大卫听见了”之未明说宾语的处理。
