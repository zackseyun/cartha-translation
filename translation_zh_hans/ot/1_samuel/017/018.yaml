  text: וְ֠/אֵת עֲשֶׂ֜רֶת חֲרִצֵ֤י הֶֽ/חָלָב֙ הָ/אֵ֔לֶּה תָּבִ֖יא לְ/שַׂר הָ/אָ֑לֶף וְ/אֶת אַחֶ֨י/ךָ֙ תִּפְקֹ֣ד לְ/שָׁל֔וֹם וְ/אֶת עֲרֻבָּתָ֖/ם תִּקָּֽח־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/018.yaml
  text: Also bring these ten cuts of cheese to the commander of the thousand[a], check on your brothers’ welfare, and bring back some token from them.
translation:
  language: zh_hans
  text: 也要把这十块奶酪带给千人队的长官，探问你哥哥们是否平安，并把他们的凭据[a]带回来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “凭据”或译“信物”或“抵押物”。希伯来语所指的具体物件不明确；在本语境中，可能是从哥哥们那里带回、用以证明他们状况的物件或记号。
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲרִצֵי הֶחָלָב
  choice: 奶酪块
  rationale: 该词组指由奶制品制成的切块或成形块；译作“奶酪块”既保留具体形态，也符合现代汉语表达。正文按数量自然表述为“十块奶酪”。
- source_word: שַׂר הָאָלֶף
  choice: 千人队的长官
  rationale: שַׂר 指长官或统领者，הָאָלֶף 在此指一支以“一千”为名的军事单位。“千人队的长官”保留原文军队编制的可见性，又避免把实际人数绝对化。
- source_word: תִּפְקֹד לְשָׁלוֹם
  choice: 探问……是否平安
  rationale: פקד 在这里表示察看、探问其状况，לְשָׁלוֹם 指平安或安好；这一译法自然表达耶西要大卫了解哥哥们近况的意思。
- source_word: עֲרֻבָּתָם
  choice: 他们的凭据
  rationale: 该词可指抵押物、信物或用来证明情况的凭据，具体所指并不确定。“凭据”保留其证明或保证的核心含义，而不擅自指定为何种物件。
- source_word: וְאֵת
  choice: 也要
  rationale: 句首连接词与宾语标记承接上一节的一连串吩咐；“也要”清楚表达添加关系。
- source_word: תָּבִיא
  choice: 带给
  rationale: 在送物资到营地的语境中，“带给”兼顾携带和交付对象，比单用“带来”或“拿去”更自然。
- source_word: תִּקָּח
  choice: 带回来
  rationale: לקח 本义为“拿、取”；结合耶西差遣大卫往返的语境，“带回来”自然显明隐含的返回方向。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“哥哥们”依上下文准确表达大卫的兄长；“探问……是否平安”兼具原文色彩与现代可读性。脚注标在存在词义不确定性的“凭据”之后，而非置于军职名称之后。
