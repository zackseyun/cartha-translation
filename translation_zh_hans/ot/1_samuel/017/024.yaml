base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/024.yaml
  text: And every man of Israel, when they saw the man, fled from before him and were very afraid.
translation:
  language: zh_hans
  text: 以色列众人一看见那人，就都从他面前逃跑，极其害怕。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכֹל אִישׁ יִשְׂרָאֵל
  choice: 以色列众人
  rationale: 字面为“以色列的每一个人”，在此指在场的以色列军兵整体；译作“众人”自然表达逐一而普遍的反应。
- source_word: בִּרְאוֹתָם
  choice: 一看见
  rationale: 介词 בְּ 加不定式结构表示时间，“当他们看见”；“一看见”也自然传达看见后立即逃跑的叙事衔接。
- source_word: הָאִישׁ
  choice: 那人
  rationale: 保留原文对歌利亚的普通指称，不额外加入姓名或评价。
- source_word: וַיָּנֻסוּ מִפָּנָיו
  choice: 就都从他面前逃跑
  rationale: מִפָּנָיו 字面是“从他面前”；保留这一空间性表达，“都”体现复数谓语与全体主语。
- source_word: וַיִּירְאוּ מְאֹד
  choice: 极其害怕
  rationale: 准确表达 ירא 的惧怕意义及 מְאֹד 的强烈程度。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重且易懂的叙事语言。原文主语形式为单数集合表达“每一个以色列人”，后续动词却用复数；中文以“以色列众人……都”自然保留其群体普遍性。
