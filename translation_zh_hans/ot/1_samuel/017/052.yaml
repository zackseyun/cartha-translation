  text: וַ/יָּקֻ֣מוּ אַנְשֵׁי֩ יִשְׂרָאֵ֨ל וִ/יהוּדָ֜ה וַ/יָּרִ֗עוּ וַֽ/יִּרְדְּפוּ֙ אֶת הַ/פְּלִשְׁתִּ֔ים עַד בּוֹאֲ/ךָ֣ גַ֔יְא וְ/עַ֖ד שַׁעֲרֵ֣י עֶקְר֑וֹן וַֽ/יִּפְּל֞וּ חַֽלְלֵ֤י פְלִשְׁתִּים֙ בְּ/דֶ֣רֶךְ שַׁעֲרַ֔יִם וְ/עַד גַּ֖ת וְ/עַד עֶקְרֽוֹן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/052.yaml
  text: Then the men of Israel and Judah rose up and shouted[a], and they pursued the Philistines as far as Gai and as far as the gates of Ekron. The slain Philistines fell along the road to Shaaraim[b], as far as Gath and as far as Ekron.
translation:
  language: zh_hans
  text: 以色列人和犹大人就起身呐喊[a]，追赶非利士人，直到谷口[b]，又直到以革伦的城门。非利士人的尸体倒在通往沙拉音的路上，直到迦特和以革伦。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“发出战吼”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文本直译近于“直到你来到谷地”；这个短语在文本和句法上较难，也有人把“谷”理解为地名“迦伊”。
    reason: textual_variant
lexical_decisions:
- source_word: וַיָּקֻמוּ
  choice: 就起身
  rationale: 叙事中的连续动词，表示歌利亚倒下后军队立即行动；“起身”自然且保留原文动作感。
- source_word: אַנְשֵׁי יִשְׂרָאֵל וִיהוּדָה
  choice: 以色列人和犹大人
  rationale: 原文直指参战的男子；中文军事语境已能表明所指，用“人”比“男人”更自然庄重。
- source_word: וַיָּרִעוּ
  choice: 呐喊
  rationale: רוע在此指战斗中的高声呼喊；“呐喊”既自然，也保留战场呼号的意味。
- source_word: וַיִּרְדְּפוּ
  choice: 追赶
  rationale: 准确表达军事语境中的追击，现代中文通顺清楚。
- source_word: עַד בּוֹאֲךָ גַיְא
  choice: 直到谷口
  rationale: 该短语在文本和句法上较难；将בואך按“入口、临近之处”的惯用意义理解，并把גיא视为普通名词“谷”，正文清楚，歧义在脚注保留。
- source_word: וְעַד שַׁעֲרֵי עֶקְרוֹן
  choice: 又直到以革伦的城门
  rationale: 保留空间终点及重复的“直到”；“城门”符合古代城市语境。
- source_word: וַיִּפְּלוּ חַלְלֵי פְלִשְׁתִּים
  choice: 非利士人被杀的……倒下
  rationale: חַלְלֵי指被杀、阵亡者，而不只是受伤者；此表达保留“倒下”的叙事动词和死亡含义。
- source_word: בְּדֶרֶךְ שַׁעֲרַיִם
  choice: 沿着通往沙拉音的路
  rationale: בדרך加地名自然表示通往该地的道路；“沿着”也符合尸体散布在追击路线上的画面。
- source_word: שַׁעֲרַיִם
  choice: 沙拉音
  rationale: 作为地名音译，不按其可能的普通词义翻译。
- source_word: וְעַד גַּת וְעַד עֶקְרוֹן
  choice: 直到迦特和以革伦
  rationale: 保留追击和伤亡延伸到两处地名的范围；中文无需机械重复第二个“直到”也能清楚传达并列范围。
