  text: The people told him the same thing, saying, “This is what will be done for the man who strikes him down.”
translation:
  language: zh_hans
  text: 百姓把同样的话告诉他说：“打死他的人，必得这样的奖赏。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כַּדָּבָר הַזֶּה
  choice: 照先前的话
  rationale: 字面为“照这话”；结合上文，指百姓重复先前所说的内容。译作“照先前的话”既保留回指关系，也符合现代汉语表达。
- source_word: יַכֶּנּוּ
  choice: 打死那人
  rationale: 词根 נכה 表示击打、击杀；本节语境明确指杀死歌利亚。“那人”保留希伯来语代词所指，不在本节直接补出姓名。
- source_word: כֹּה יֵעָשֶׂה לָאִישׁ
  choice: 必得这样的奖赏
  rationale: 字面为“那人必被这样对待”。根据上文所列回报，用现代汉语明确表达为所得奖赏，同时保留被动承受结果的含义。
