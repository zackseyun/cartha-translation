base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/044.yaml
  text: And the Philistine said to David[a], “Come to me[b], and I will give your flesh to the birds of the heavens and to the beasts of the field.”
translation:
  language: zh_hans
  text: 那非利士人对大卫说：“到我这里来，我要把你的肉给空中的飞鸟[a]和田野的走兽[b]吃。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“天上的飞鸟”。
    reason: lexical_alternative
  - marker: b
    text: 或译“田野的动物”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַפְּלִשְׁתִּי
  choice: 那非利士人
  rationale: 定冠词指向上下文中的歌利亚；“那非利士人”既明确所指，也不增添原文未明说的“战士”。
- source_word: לְכָה אֵלַי
  choice: 到我这里来
  rationale: 命令式在此构成直接的挑战；这一表达自然、简洁，并保留朝说话者而来的方向。
- source_word: וְאֶתְּנָה
  choice: 我要把……给
  rationale: 该形式在威吓语境中表达说话者强烈的意愿或决心，用“我要”自然传达这一语气。
- source_word: בְּשָׂרְךָ
  choice: 你的肉
  rationale: 保留 בשר 的具体、残酷意象，不弱化为较宽泛的“身体”，也不增添“尸体”的解释。
- source_word: לְעוֹף הַשָּׁמַיִם
  choice: 给空中的飞鸟
  rationale: עוֹף 在本语境中自然指鸟类；“空中的飞鸟”是现代汉语中自然且具经文庄重感的表达，对应字面上的“诸天之鸟”。
- source_word: וּלְבֶהֱמַת הַשָּׂדֶה
  choice: 和田野的走兽
  rationale: בְּהֵמָה 可泛指牲畜或兽类；在尸体遭吞食的威胁中，“走兽”比“牲畜”更贴合语境，同时不过度限定为野兽。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“给……吃”在汉语中补足受益结构隐含的处置结果，使威胁自然清楚；脚注保留更贴近字面的表达及词义范围。
