  yaml_path: translation/ot/1_samuel/017/004.yaml
  text: Then a champion came out from the camps of the Philistines[a]; his name was Goliath, from Gath[b]. His height was six cubits and a span.
translation:
  language: zh_hans
  text: 有一名讨战的勇士从非利士人的营中出来[a]，名叫歌利亚，来自迦特。他身高六肘又一虎口[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “讨战的勇士”按希伯来文直译为“在中间的人”，可能指走到两军阵线之间、代表本方交战的人。
    reason: lexical_alternative
  - marker: b
    text: 六肘又一虎口约合3.0米；实际长度因所采用的“肘”制而异。
    reason: cultural_note
lexical_decisions:
- source_word: אִישׁ הַבֵּנַיִם
  choice: 挑战的勇士
  rationale: 该短语直译为“夹在中间的人”，在本语境中指走到两军阵前、代表一方交战的勇士。“挑战的勇士”既自然清楚，也保留其出阵求战的功能；脚注说明其字面含义。
- source_word: וַיֵּצֵא
  choice: 出来
  rationale: 叙事视角描写此人从非利士营地走出，“出来”符合现代汉语表达。
- source_word: מִמַּחֲנוֹת פְּלִשְׁתִּים
  choice: 从非利士人的营地
  rationale: 希伯来文“营地”为复数，但此处汉语用集合性的单数更自然；“非利士人”采用通行译名。
- source_word: גָּלְיָת
  choice: 歌利亚
  rationale: 采用现代中文圣经中通行的人名译法。
- source_word: שְׁמוֹ
  choice: 名叫
  rationale: 自然简洁地表达希伯来文“他的名字是”。
- source_word: מִגַּת
  choice: 是迦特人
  rationale: 原文直译为“来自迦特”；“是迦特人”在汉语中自然表达其籍贯，不增添额外身份含义。
- source_word: גָּבְהוֹ
  choice: 他身高
  rationale: 准确而自然地表达“他的高度”。
- source_word: שֵׁשׁ אַמּוֹת וָזָרֶת
  choice: 六肘又一虎口
  rationale: 保留原文古代长度单位；“虎口”是 זֶרֶת（张手后拇指至小指的距离）的传统且简明的中文表达，现代近似值置于脚注。
