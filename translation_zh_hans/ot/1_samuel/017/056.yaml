  text: And the king said[a], “You, inquire whose son this young man is.”
translation:
  language: zh_hans
  text: 王说：“你去问问，这个年轻人是谁的儿子。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 该叙事形式推进情节；现代汉语通常无需逐字译出连接词，直接用“说”自然承接上文。
- source_word: הַמֶּלֶךְ
  choice: 王
  rationale: 原文使用带定冠词的称号，语境中指扫罗；保留称号而不改用人名。
- source_word: שְׁאַל
  choice: 去问问
  rationale: 命令式动词意为“问、询问、打听”。“去问问”既保留通过询问获知的动作，也符合现代汉语直接命令的表达。
- source_word: אַתָּה
  choice: 你
  rationale: 原文显式使用独立人称代词以加强指向；译出“你”保留这一强调。
- source_word: בֶּן מִי
  choice: 是谁的儿子
  rationale: 忠实表达希伯来语询问父系身份的习语，并采用自然的现代汉语语序。
- source_word: זֶה
  choice: 这个
  rationale: 保留阳性单数指示词的近指意味。
- source_word: הָעָלֶם
  choice: 年轻人
  rationale: 该词指年轻男子；“年轻人”清楚、自然，且避免“少年”可能暗示过低年龄。
theological_decisions: []
translation_notes:
