  text: 大卫对扫罗说：“你仆人一直替父亲放羊。每逢有狮子或熊[a]来，从羊群中带走一只小羊[b]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语字面作“狮子和熊”，这里很可能是分配用法，意思是狮子或熊来袭。
    reason: lexical_alternative
  - marker: b
    text: “小羊”也可译作“一只羊”或“羊群中的一只牲畜”；希伯来语这个词的含义较宽，可指绵羊或山羊，并不一定专指幼畜。
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹעֶה הָיָה
  choice: 一直……放羊
  rationale: 分词与הָיָה连用，描述大卫过去持续承担的牧羊工作；这样表达比直译为“是牧人”更符合现代汉语，同时保留持续状态。
- source_word: עַבְדְּךָ
  choice: 你仆人
  rationale: 这是臣民对君王说话时谦卑的自称；译为“你仆人”保留宫廷语境中的敬逊意味，不刻意强调奴隶身份。
- source_word: לְאָבִיו בַּצֹּאן
  choice: 替父亲放羊
  rationale: לְ表示为父亲效力，בַּצֹּאן指与羊群有关的牧放工作；合译为自然清楚的现代汉语。
- source_word: וּבָא
  choice: 每逢……来
  rationale: 在回顾以往牧羊经历的语境中，此处适合按惯常、反复发生的情形理解；“每逢”明确传达这种习惯性。
- source_word: הָאֲרִי וְאֶת הַדּוֹב
  choice: 狮子或熊
  rationale: 希伯来语字面用“和”连接，但单数谓语及语境很可能表达分配意义，即两种猛兽中的任何一种来袭；正文采用自然的汉语“或”，并以脚注保留字面形式。
- source_word: וְנָשָׂא
  choice: 叼走
  rationale: נשא在此指猛兽把猎物带走；“叼走”符合狮子或熊攫取羊只的具体场景。
- source_word: שֶׂה
  choice: 一只小羊
  rationale: שֶׂה指羊群中的单只牲畜，可指绵羊或山羊，也不必然限定为幼畜；正文采用语境中自然且传统的“小羊”，脚注说明较宽泛的可能。
- source_word: מֵהָעֵדֶר
  choice: 从羊群中
  rationale: עֵדֶר在此指所牧放的群畜；结合上下文明确译为“羊群”。
