  text: וַ/יֹּ֤אמֶר דָּוִד֙ אֶל הַ/פְּלִשְׁתִּ֔י אַתָּה֙ בָּ֣א אֵלַ֔/י בְּ/חֶ֖רֶב וּ/בַ/חֲנִ֣ית וּ/בְ/כִיד֑וֹן וְ/אָנֹכִ֣י בָֽא אֵלֶ֗י/ךָ בְּ/שֵׁם֙ יְהוָ֣ה צְבָא֔וֹת אֱלֹהֵ֛י מַעַרְכ֥וֹת יִשְׂרָאֵ֖ל אֲשֶׁ֥ר חֵרַֽפְתָּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/045.yaml
  text: Then David said to the Philistine[a], “You come to me with a sword, with a spear, and with a javelin, but I come to you in the name of Yahweh of Armies, the God of the armies of Israel[c][b], whom you have defied.”
translation:
  language: zh_hans
  text: 大卫对那非利士人说：“你带着刀、长矛和标枪来到我这里，我却奉万军之雅威[a]——以色列军阵的上帝[b]——的名来到你这里；你所蔑视的就是他[c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “万军之雅威”也可译作“统领众军的雅威”；传统译法作“万军之耶和华”。
    reason: lexical_alternative
  - marker: b
    text: “军阵”也可译作“军队”或“战线”，指以色列列阵作战的队伍。
    reason: lexical_alternative
  - marker: c
    text: “蔑视”也可译作“辱骂”或“公然挑战”。原文的关系从句通常理解为歌利亚蔑视上帝；也可能理解为他辱骂以色列的军阵。
    reason: textual_ambiguity
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 未机械译出叙事性连接词，按现代汉语叙事习惯承接上文。
- source_word: הַפְּלִשְׁתִּי
  choice: 那非利士人
  rationale: 原文以族称指歌利亚，并未在此明说“战士”；“那”使已知人物的指称在汉语中自然清楚。
- source_word: בָּא אֵלַי / בָא אֵלֶיךָ
  choice: 来攻击我／来攻击你
  rationale: 字面为“来到……这里”，但战场语境明确含敌对趋向；译出“攻击”可在现代汉语中保留两句对称及其实际语气。
- source_word: בְּחֶרֶב וּבַחֲנִית וּבְכִידוֹן
  choice: 拿着刀、长矛和标枪
  rationale: בְּ表示所凭借的武器；用“长矛”与较轻、可投掷的“标枪”区分חֲנִית和כִידוֹן。
- source_word: בְּשֵׁם
  choice: 奉……的名
  rationale: 这是自然且庄重的汉语圣经表达，同时保留代表其权柄、倚靠其身份而来的含义。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以常见汉语音译呈现四字神名，不以称号“主”取代专名。
- source_word: צְבָאוֹת
  choice: 万军之
  rationale: 保留该神圣称号的军事和统御意象；“万军”在庄重汉语中简洁自然，并非数学意义上的“一万支军队”。
- source_word: אֱלֹהֵי מַעַרְכוֹת יִשְׂרָאֵל
  choice: 以色列军阵的上帝
  rationale: מַעַרְכוֹת侧重列阵的部队或战线；“军阵”比泛称“军队”更贴近本节战场语境。
- source_word: אֲשֶׁר חֵרַפְתָּ
  choice: 你竟敢蔑视他
  rationale: חרף在此不只是言语嘲弄，而是带着轻蔑公然挑战以色列的上帝；“竟敢”传达对抗语气，“蔑视”保留其羞辱、藐视的核心。
theological_decisions:
- issue: 四字神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用上帝的专名。正文用音译“雅威”保留专名性质；不以“主”替代，也不把另一种传统音译当作原文含义本身。
- issue: 称号יְהוָה צְבָאוֹת的理解
  choice: 万军之雅威
  alternative: 统领众军的雅威；万军之耶和华
  rationale: 保留原文简洁的属格式称号及其军事意象，不限定“众军”究竟只指天军、以色列军队，还是一切受上帝统辖的军旅。
- issue: 关系从句אֲשֶׁר חֵרַפְתָּ的所指
  choice: 理解为蔑视以色列军阵的上帝
  alternative: 理解为辱骂以色列的军阵
  rationale: 就紧邻结构和本段神学焦点而言，把上帝视为受蔑视者最为顺畅；但希伯来语关系词本身不标明性数，语境中也反复提到歌利亚辱骂以色列军阵，因此脚注提示这一语法可能性。
translation_notes:
  register: 采用现代、庄重而可朗读的普通话。以破折号标明“以色列军阵的上帝”是对“万军之雅威”的同位说明；武器名称尽量清楚区分，同时避免古奥词“戟”。
