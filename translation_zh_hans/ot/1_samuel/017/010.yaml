  text: Then the Philistine said[a], “I have defied the ranks of Israel this day. Give me a man[c][b], and let us fight together.”
translation:
  language: zh_hans
  text: 那非利士人说：“我今天羞辱了以色列的军阵！给我一个人，让我们彼此交战！”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַפְּלִשְׁתִּי
  choice: 那非利士人
  rationale: 定冠词所指的是上下文中的歌利亚，并按其族属称呼；原词本身没有“勇士”或“战士”的意思。
- source_word: חֵרַפְתִּי
  choice: 我……叫骂
  rationale: חרף 表示以言语羞辱、辱骂或挑衅；在两军对阵的挑战语境中，“叫骂”自然地兼顾公开侮辱与挑衅意味。
- source_word: מַעַרְכוֹת
  choice: 战阵
  rationale: 复数形式指排列起来的军队阵列或战线；“战阵”比泛称“军队”更贴近军事列阵的具体意象。
- source_word: הַיּוֹם הַזֶּה
  choice: 今天
  rationale: 现代汉语以“今天”自然表达该指示性时间短语，语境中的强调仍由整句宣告体现。
- source_word: תְּנוּ לִי אִישׁ
  choice: 给我一个人
  rationale: 保留 נתן 加间接宾语的直接表达，同时在语境中清楚表示要求对方推出一名代表交战。
- source_word: וְנִלָּחֲמָה
  choice: 让我们交战
  rationale: 该鼓励式表达带有意愿和挑战色彩；“让我们交战”比单纯将来时更能体现这种语气。
- source_word: יָחַד
  choice: 交战
  rationale: יחד 字面为“一同”，在此指双方彼此交手；汉语“交战”已自然包含双方对战的关系，避免误解为并肩作战。
