source:
  edition: WLC
  text: וַ/יַּבֵּ֧ט הַ/פְּלִשְׁתִּ֛י וַ/יִּרְאֶ֥ה אֶת דָּוִ֖ד וַ/יִּבְזֵ֑/הוּ כִּֽי הָיָ֣ה נַ֔עַר וְ/אַדְמֹנִ֖י עִם יְפֵ֥ה מַרְאֶֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/042.yaml
  text: When the Philistine looked and saw David[a], he despised him, because he was a youth, ruddy and handsome in appearance.
translation:
  language: zh_hans
  text: 那非利士人仔细一看，见是大卫，就藐视他，因为他只是个少年，面色红润[a]，容貌俊美。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“肤色发红”或“头发呈红色”；希伯来语这个词泛指偏红的色泽，不一定专指头发。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּבֵּט
  choice: 仔细一看
  rationale: 该动词表示把目光投向、观看；结合后面的“见是大卫”，译作“仔细一看”自然地保留了“观看—看见”的叙事推进。
- source_word: הַפְּלִשְׁתִּי
  choice: 那非利士人
  rationale: 原文只用族名称呼歌利亚，并未在本节称他为“勇士”或“战士”，因此不增添身份称谓。
- source_word: וַיִּרְאֶה אֶת־דָּוִד
  choice: 见是大卫
  rationale: ראה是普通的“看见”；这里用现代汉语的“见是大卫”，与前面的“仔细一看”衔接自然。
- source_word: וַיִּבְזֵהוּ
  choice: 就藐视他
  rationale: בזה表示轻看、鄙视；“藐视”简洁庄重，也保留了原文指向大卫的人称宾语。
- source_word: כִּי
  choice: 因为
  rationale: 此处引出非利士人藐视大卫的原因，译作“因为”清楚直接。
- source_word: הָיָה נַעַר
  choice: 他只是个少年
  rationale: נַעַר可指少年或青年；“少年”体现大卫相对年轻，又不必理解为年幼儿童。“只是”在汉语中传达上下文中歌利亚轻蔑地把这一特征视为不足的语气。
- source_word: אַדְמֹנִי
  choice: 面色红润
  rationale: 该形容词表示带红色的外观或色泽，但未明确限定为头发；正文采用汉语中自然的“面色红润”，并以脚注保留较宽泛的可能。
- source_word: עִם יְפֵה מַרְאֶה
  choice: 容貌俊美
  rationale: 该短语直指外貌美好；“容貌俊美”符合男性人物的现代汉语表达，也保持原文的正面外貌描写。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重的现代标准汉语。以“仔细一看，见是……”避免生硬重复，同时保留原文连续两个视觉动词；不把“非利士人”扩译为“非利士勇士”。脚注标在“面色红润”之后，使词义说明与其对应。
