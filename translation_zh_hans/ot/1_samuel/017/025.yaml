  text: וַ/יֹּ֣אמֶר אִ֣ישׁ יִשְׂרָאֵ֗ל הַ/רְּאִיתֶם֙ הָ/אִ֤ישׁ הָֽ/עֹלֶה֙ הַ/זֶּ֔ה כִּ֛י לְ/חָרֵ֥ף אֶת יִשְׂרָאֵ֖ל עֹלֶ֑ה וְֽ֠/הָיָה הָ/אִ֨ישׁ אֲשֶׁר יַכֶּ֜/נּוּ יַעְשְׁרֶ֥/נּוּ הַ/מֶּ֣לֶךְ עֹ֣שֶׁר גָּד֗וֹל וְ/אֶת בִּתּ/וֹ֙ יִתֶּן ל֔/וֹ וְ/אֵת֙ בֵּ֣ית אָבִ֔י/ו יַעֲשֶׂ֥ה חָפְשִׁ֖י בְּ/יִשְׂרָאֵֽל׀־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/025.yaml
  text: And the men of Israel said[a], “Have you seen this man who is coming up? Surely he is coming up to defy Israel. And it shall be that the man who strikes him down, the king will enrich him with great riches, and will give him his daughter, and will make his father’s house free in Israel.”
translation:
  language: zh_hans
  text: 以色列人说：“你们看见这个上来的人了吗？他上来正是要羞辱以色列。谁击倒他，王就必使他大大富足，把自己的女儿嫁给他，并使他的父家在以色列得享豁免[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “得享豁免”也可译作“得自由”。这可能指免除赋税、徭役或其他为王服役的义务；原文没有说明具体是哪一类义务。
    reason: 原文חָפְשִׁי表示自由或豁免；其行政含义可能涉及税赋、劳役或其他王室义务，但具体范围未明。
lexical_decisions:
- source_word: אִישׁ יִשְׂרָאֵל
  choice: 以色列人
  rationale: 原文“以色列的一人”在语境中具有集合或泛指作用，指营中的以色列士兵；中文用“以色列人”自然地保留这种群体话语。
- source_word: הַרְּאִיתֶם
  choice: 你们看见……了吗
  rationale: 第二人称阳性复数完成式带疑问语气；此译符合现场交谈中的反问口吻。
- source_word: הָאִישׁ הָעֹלֶה הַזֶּה
  choice: 这个上来的人
  rationale: 分词表达正在进行的动作；“上来”也保留原文反复使用的空间动词。
- source_word: כִּי
  choice: 正是
  rationale: 此处引出带强调意味的说明，而非单纯因果关系；“正是”传达其强调语气。
- source_word: לְחָרֵף
  choice: 羞辱
  rationale: חרף兼有辱骂、蔑视和公然挑战之意；“羞辱”保留其核心的公开侮辱意味，而不把含义收窄为纯军事性的“挑战”。
- source_word: יִשְׂרָאֵל
  choice: 以色列
  rationale: 依照本节原文直译，不从邻近经文增补“军队”。
- source_word: יַכֶּנּוּ
  choice: 击倒他
  rationale: נכה可指击打、击倒或杀死；语境要求决定性地制伏歌利亚，但动词本身未必明确等同“杀死”，故保留其宽度。
- source_word: יַעְשְׁרֶנּוּ ... עֹשֶׁר גָּדוֹל
  choice: 赐给他丰厚的财富
  rationale: 原文以同根动词和名词强调使其富足；中文避免生硬重复，以“赐给……丰厚的财富”自然传达王使他大大富有。
- source_word: בִּתּוֹ יִתֶּן לוֹ
  choice: 把自己的女儿嫁给他
  rationale: 原文直说“把女儿给他”；在婚姻奖赏的语境中，“嫁给他”是现代中文清楚自然的等值表达。
- source_word: בֵּית אָבִיו
  choice: 他父家
  rationale: 指以父系为中心的家庭或家族单位；“父家”简洁保留其古代社会结构含义。
- source_word: יַעֲשֶׂה חָפְשִׁי בְּיִשְׂרָאֵל
  choice: 使他父家在以色列免除差役
  rationale: חָפְשִׁי本义为自由、获豁免；在王权行政语境中很可能指免除赋税或王室劳役。“免除差役”在正文中表达最可能的实际含义，同时脚注保留范围上的不确定性。
