  rationale: 修订只处理两处语义范围：以“使他大大富足”重现原文使役动词及强化表达；以“得享豁免”避免将未明确的行政特权限定为差役豁免，并由脚注保留可能解释及不确定性。其余措辞保持原译的现代、庄重风格和原文信息结构。
