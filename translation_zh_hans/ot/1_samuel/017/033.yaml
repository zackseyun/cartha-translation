base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/033.yaml
  text: Saul said to David[a], “You are not able to go against this Philistine to fight with him, because you are a youth[b], and he has been a man of war from his youth.”
translation:
  language: zh_hans
  text: 扫罗对大卫说：“你不能去迎战这个非利士人，跟他交战，因为你不过是个年轻人[a]，他从年少时就是个战士。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “年轻人”所译的希伯来语也可指“少年”；具体年龄范围须由上下文判断。
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא תוּכַל
  choice: 你不能
  rationale: 表达能力上的不可能，而非命令式的禁止；现代汉语中“不能”既自然，也符合上下文。
- source_word: לָלֶכֶת אֶל הַפְּלִשְׁתִּי הַזֶּה
  choice: 去迎战这个非利士人
  rationale: 在军事语境中，הלך אל 不只是走向某人，而是前去对敌；“迎战”准确传达敌对交锋的含义。
- source_word: לְהִלָּחֵם עִמּוֹ
  choice: 跟他交战
  rationale: 保留介词 עִם“与、跟”的关系，同时用“交战”自然表达实际战斗。
- source_word: נַעַר
  choice: 年轻人
  rationale: 该词可指少年、青年或年轻人；此处大卫已能主动请战，因此“年轻人”较稳妥，并保留其年龄与歌利亚经验之间的对比。
- source_word: אִישׁ מִלְחָמָה
  choice: 久经战阵的人
  rationale: 该短语指善战或以征战为业的人；结合“从小”所强调的长期经历，此译在汉语中自然地呈现其老练战士的身份。
- source_word: מִנְּעֻרָיו
  choice: 从小
  rationale: 表示从年少时期开始并延续至今；“从小”是现代汉语中简洁自然的表达。
theological_decisions: []
translation_notes:
