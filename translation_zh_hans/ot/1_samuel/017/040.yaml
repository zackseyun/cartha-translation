base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/040.yaml
  text: He took his staff in his hand and chose for himself five smooth stones from the wadi[a], and put them in the shepherd’s bag that he had, in the pouch; and his sling was in his hand[b]. Then he approached the Philistine.
translation:
  language: zh_hans
  text: 他把杖拿在手中，又从溪谷[a]中为自己挑选五块光滑的石头，放在他所带的牧人袋里，就是囊中；他的甩石索也在手中。随后，他向那非利士人走近。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “溪谷”或译“溪流”“河床”。希伯来语 נַחַל 可指溪流，也可指溪流经过的谷地或季节性水道。
    reason: lexical_alternative
lexical_decisions:
- source_word: מַקְלוֹ
  choice: 他的杖
  rationale: מַקֵּל可指杖或棍；结合牧人语境，“杖”简洁自然，也不额外限定其具体用途。
- source_word: וַיִּבְחַר לוֹ
  choice: 为自己挑选
  rationale: 保留לּוֹ所表达的受益或反身意味，并体现有意挑选的动作。
- source_word: חֲמִשָּׁה חַלֻּקֵי אֲבָנִים
  choice: 五块光滑的石头
  rationale: חַלֻּקֵי在此描述石头表面光滑；量词“块”符合现代汉语习惯。
- source_word: מִן הַנַּחַל
  choice: 从溪谷中
  rationale: נַחַל可指溪流，也可指溪流经过的谷地或季节性水道；“溪谷”兼顾地貌和水道含义，避免将其过度限定为常年流水的小溪。
- source_word: בִּכְלִי הָרֹעִים אֲשֶׁר לוֹ
  choice: 放进他随身的牧人用具里
  rationale: כְּלִי语义宽泛，可指器具、装备或容器；“牧人用具”保留其宽泛性，אֲשֶׁר לוֹ则以“随身”自然表达属于并带在身边之意。
- source_word: וּבַיַּלְקוּט
  choice: 就是袋囊中
  rationale: יַלְקוּט指携物的小袋；此处可能进一步说明前面的宽泛名词כְּלִי，故用“就是”呈现同位解释关系，同时保留句法略显重复的特点。
- source_word: וְקַלְעוֹ בְיָדוֹ
  choice: 他的甩石索也拿在手里
  rationale: 原文为无动词名词句；补出“拿在”使汉语自然。“甩石索”比单用“甩索”更清楚地表明这是投石武器。
- source_word: וַיִּגַּשׁ אֶל הַפְּלִשְׁתִּי
  choice: 随后，他向那非利士人走近
  rationale: נגשׁ表示接近、走近；“随后”体现叙事推进，不强化为冲锋或进攻。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。保留原文两次提到“手里”的具体画面，并以“牧人用具……就是袋囊”反映 כְּלִי 与 יַלְקוּט 之间可能的概括—说明关系，不把两者武断处理为两个袋子。
