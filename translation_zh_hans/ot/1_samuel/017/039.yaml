base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/039.yaml
  text: And David strapped his sword over his armor and tried to go[a], for he had not tested them. But David said to Saul, “I cannot go with these[b], for I have not tested them.” So David removed them from himself.
translation:
  language: zh_hans
  text: 大卫把自己的刀佩在战衣外面，试着走；因为他还没有试用过这些装备。大卫对扫罗说：“我不能穿戴着这些走，因为我没有试用过这些装备。”于是大卫把它们脱了下来。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּחְגֹּר
  choice: 佩
  rationale: חגר指束上或佩上装备，尤其是武器；“把刀佩在……外面”自然、具体地表达了动作。
- source_word: חַרְבּוֹ
  choice: 他的刀
  rationale: חֶרֶב在此指佩带的刀剑；现代汉语叙事中用“刀”简洁自然，也与上下文的武器场景相符。
- source_word: מֵעַל לְמַדָּיו
  choice: 在战衣外面
  rationale: לְמַדִּים可指衣服、装束，在本段军事语境中是扫罗给大卫穿上的作战装束；“战衣”既保留词义宽度，也避免把它过度限定为某一种铠甲。
- source_word: וַיֹּאֶל לָלֶכֶת
  choice: 试着走了几步
  rationale: יאל加不定式可表示着手、尝试或决意去做；叙事中大卫是在陌生装备下试走，译作“试着走了几步”符合场景且自然。
- source_word: כִּי לֹא נִסָּה
  choice: 因为他还没有试用过这些装备
  rationale: נסה在此表示借实际使用来试验；补出隐含宾语“这些装备”，使中文指代清楚。
- source_word: לֹא אוּכַל לָלֶכֶת בָּאֵלֶּה
  choice: 我穿戴这些不能走
  rationale: 介词ב与复数指示词指身上这些装备；“穿戴这些不能走”准确表达装备妨碍行动，并保留原文“走”的措辞。
- source_word: לֹא נִסִּיתִי
  choice: 我没有试用过
  rationale: 与前面的נסה保持一致，以“试用过”表达通过经验检验，而不直接释为“穿不惯”。
- source_word: וַיְסִרֵם ... מֵעָלָיו
  choice: 把它们脱了下来
  rationale: 该使役式结构意为从自己身上除去；对于所穿戴的装备，“脱了下来”是自然准确的现代汉语。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“战衣”保留原词既可指衣着、又在此特指军事装束的语义张力；“装备”用于后文概括刀与所穿戴之物。避免使用较古雅的“束刀”“甲胄”等词。
