source:
  edition: WLC
  text: הַ/יּ֣וֹם הַ/זֶּ֡ה יְסַגֶּרְ/ךָ֩ יְהוָ֨ה בְּ/יָדִ֜/י וְ/הִכִּיתִ֗/ךָ וַ/הֲסִרֹתִ֤י אֶת רֹֽאשְׁ/ךָ֙ מֵ/עָלֶ֔י/ךָ וְ/נָ֨תַתִּ֜י פֶּ֣גֶר מַחֲנֵ֤ה פְלִשְׁתִּים֙ הַ/יּ֣וֹם הַ/זֶּ֔ה לְ/ע֥וֹף הַ/שָּׁמַ֖יִם וּ/לְ/חַיַּ֣ת הָ/אָ֑רֶץ וְ/יֵֽדְעוּ֙ כָּל הָ/אָ֔רֶץ כִּ֛י יֵ֥שׁ אֱלֹהִ֖ים לְ/יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/046.yaml
  text: This day Yahweh will deliver you into my hand[a], and I will strike you down and remove your head from you. And this day I will give the corpses of the Philistine camp to the birds of the sky and to the wild animals of the earth, so that all the earth may know that there is a God for Israel.
translation:
  language: zh_hans
  text: 今天，雅威必把你交在我手中；我必击倒你，取下你的头颅。今天，我要把非利士营中人的尸体交给空中的飞鸟和地上的野兽，好让全地都知道，以色列有上帝[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在以色列中有上帝。”希伯来文直译近于“有上帝为着以色列”，其中的介词可以表达归属、关系或为着某一方。
    reason: 保留לְיִשְׂרָאֵל在地点、归属及关系意义之间的真实歧义。
lexical_decisions:
- source_word: יְסַגֶּרְךָ בְּיָדִי
  choice: 把你交在我手中
  rationale: סגר的使役式在此表示把某人交付给另一人的权势；保留“手”的希伯来语意象，同时符合现代汉语表达。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文四字神名作音译，不以“主”这一称号替代专名。
- source_word: וְהִכִּיתִךָ
  choice: 我必击倒你
  rationale: נכה可指击打，也可在战斗语境中指击杀；“击倒”保留动作本身，又自然预示死亡，不把词义过度明确化。
- source_word: וַהֲסִרֹתִי אֶת־רֹאשְׁךָ מֵעָלֶיךָ
  choice: 取下你的头颅
  rationale: 原文使用“移去、取下”而非明确表示“砍下”的动词；此译在上下文中清楚，却保留原文措辞的特点。
- source_word: פֶּגֶר מַחֲנֵה פְלִשְׁתִּים
  choice: 非利士营中人的尸体
  rationale: פֶּגֶר虽为单数形式，在这里可作集合意义；“营中人的尸体”避免误解为军营本身的尸体，也不将מַחֲנֶה直接改释为“军队”。
- source_word: לְעוֹף הַשָּׁמַיִם וּלְחַיַּת הָאָרֶץ
  choice: 交给空中的飞鸟和地上的野兽
  rationale: 保留希伯来文天地对应的意象；חַיָּה在这一搭配中指野生陆地动物。
- source_word: וְיֵדְעוּ כָּל־הָאָרֶץ
  choice: 好让全地都知道
  rationale: 连接词加未完成式在语流中可表达目的或结果；“好让”自然呈现这一功能，“全地”保留原文的广阔修辞范围。
- source_word: יֵשׁ אֱלֹהִים לְיִשְׂרָאֵל
  choice: 以色列有上帝
  rationale: לְ可表示归属、关系或利益；“以色列有上帝”是自然汉语，并保留上帝与以色列之间的关系，而不完全限定为地点意义。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文出现的是神的专名，故采用接近学界常见复原读音的中文音译；不用称号“主”替代，也不借此加入额外教义解释。
- issue: לְיִשְׂרָאֵל所表达的关系
  choice: 以色列有上帝
  alternative: 在以色列中有上帝；有上帝为着以色列
  rationale: 介词לְ在此可表达归属或关联，也可能被理解为有利于、为着以色列；正文采用自然且保持关系开放的译法，脚注保存地点性和更直译的可能。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。战场宣告保持短促有力；“头颅”“尸体”等词忠实保留原文的强烈画面，但不额外强化暴力细节。脚注标记置于其实际对应的句末短语之后。
