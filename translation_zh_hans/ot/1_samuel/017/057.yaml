base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/057.yaml
  text: When David returned from striking down the Philistine[a], Abner took him and brought him before Saul, with the Philistine’s head in his hand.
translation:
  language: zh_hans
  text: 大卫击杀那非利士人回来时，押尼珥把他带到扫罗面前；大卫手里拿着那非利士人的头。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“那非利士人的头在他手中。”原文是没有动词的分句，既可译作并列陈述，也可译作伴随情形。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְשׁוּב
  choice: 回来时
  rationale: 连词加动词不定式构造引出时间从句；“回来时”自然地表达“大卫返回之际”。
- source_word: מֵהַכּוֹת
  choice: 击杀
  rationale: נכה具有“击打、击倒”的具体含义；本语境明确涉及致死，因此“击杀”既简洁又准确，不弱化为泛指的“打败”。
- source_word: הַפְּלִשְׁתִּי
  choice: 那非利士人
  rationale: 原文只称“那非利士人”，虽所指为歌利亚，仍不以专名或“勇士”补充原文。
- source_word: וַיִּקַּח אֹתוֹ
  choice: 押尼珥把他带到
  rationale: לקח在此表示把大卫带去；与下一动词合并为自然汉语，避免生硬重复“带了他，又把他带到”。
- source_word: וַיְבִאֵהוּ לִפְנֵי שָׁאוּל
  choice: 带到扫罗面前
  rationale: 使役形בוא意为“带来”，לִפְנֵי直译并自然表达为“在……面前”。
- source_word: וְרֹאשׁ הַפְּלִשְׁתִּי בְּיָדוֹ
  choice: 那非利士人的头还在他手中
  rationale: 保留希伯来语无动词并列分句的结构和鲜明画面；“还”在汉语中自然表明当时持续存在的伴随状态，而“他”按最近且合乎情境的先行词指大卫。
