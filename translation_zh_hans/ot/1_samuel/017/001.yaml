  to: 非利士人聚集了他们的军队，要作战[a]。他们聚集在属于犹大的梭哥，并在梭哥和亚西加之间的以弗大悯安营[b]。
  rationale: 修订仅澄清首个动词的聚集意义，改善脚注中替代词的现代汉语自然度，并统一复合地名的常见写法；不改变原文的军事语境、地点信息或叙事次序。
