base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/001.yaml
  text: The Philistines gathered their armies for battle[a], and they assembled at Socoh, which belongs to Judah, and camped between Socoh and Azekah[b], at Ephes-dammim.
translation:
  language: zh_hans
  text: 非利士人聚集了他们的军队，要作战[a]。他们聚集在属于犹大的梭哥，并在梭哥和亚西加之间的以弗大悯安营[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “军队”或译“军营”；希伯来语这个词既可指军营，也可指驻营的军队。
    reason: lexical_alternative
  - marker: b
    text: 梭哥是犹大境内的一座城。
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּאַסְפוּ
  choice: 召集
  rationale: אָסַף在此叙事形式中表示聚集、召集；宾语是军事力量，因此“召集”自然且符合语境。
- source_word: פְלִשְׁתִּים
  choice: 非利士人
  rationale: 采用现代中文圣经及一般历史语境中通行的族名译法。
- source_word: מַחֲנֵיהֶם
  choice: 军队
  rationale: מַחֲנֶה既可指营地，也可指驻营的军队；“准备作战”的语境更偏向军事力量，正文译作“军队”，并以脚注保留“营队”的可能。
- source_word: לַמִּלְחָמָה
  choice: 准备作战
  rationale: 该介词短语直指聚集军队的目的；“准备作战”在现代汉语中比生硬的“为战斗”更自然。
- source_word: וַיֵּאָסְפוּ
  choice: 聚集
  rationale: 与前一动词同源，表示众人集中到指定地点；保留重复的核心语义，同时用不同中文动词使行文自然。
- source_word: שֹׂכֹה
  choice: 梭哥
  rationale: 采用该犹大城镇在简体中文圣经中的通行译名。
- source_word: אֲשֶׁר לִיהוּדָה
  choice: 属于犹大的
  rationale: לִיהוּדָה表达归属或领土隶属；“属于犹大的”保留原文明确的归属关系。
- source_word: וַיַּחֲנוּ
  choice: 安营
  rationale: חנה意为扎营；“安营”简洁、庄重，也符合军事叙事。
- source_word: בֵּין ... וּבֵין
  choice: 在……和……之间
  rationale: 直接表达两个地点之间的空间关系。
- source_word: עֲזֵקָה
  choice: 亚西加
  rationale: 采用现代简体中文圣经中常见的地名译法。
- source_word: בְּאֶפֶס דַּמִּים
  choice: 在以弗·大悯
  rationale: 将该表达视为地名而不按字面翻译；使用间隔号帮助现代读者辨识复合音译名。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而清楚的叙事语体。将原文连续的叙事动词分成两句，以符合现代汉语节奏，同时保留事件次序。地名采用简体中文常见译法；正文中的[a]、[b]与脚注一一对应。
