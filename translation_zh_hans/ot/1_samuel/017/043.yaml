  to: 非利士人对大卫说：“我难道是狗，你竟拿着棍子[a]到我这里来？”非利士人就凭他的诸神[b]咒诅大卫。
  rationale: 修订将引语恢复为连贯的反问句；保留“棍子”这一自然且不夸大为武器的译法，同时删去对复数语法功能的过度推断。将“神明”改为“诸神”，以反映原文复数形式及非利士多神语境下最自然的理解；脚注仅说明介词短语可作“奉……之名”，不以不占优势的单数解释模糊正文。
