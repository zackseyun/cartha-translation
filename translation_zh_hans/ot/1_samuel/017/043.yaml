base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/043.yaml
  text: And the Philistine said to David[a], “Am I a dog[b], that you come to me with sticks?” And the Philistine cursed David by his gods.
translation:
  language: zh_hans
  text: 非利士人对大卫说：“我难道是狗，你竟拿着棍子[a]到我这里来？”非利士人就凭他的诸神[b]咒诅大卫。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“杖”。这里的希伯来词为复数，可指棍、杖等。
    reason: lexical_alternative
  - marker: b
    text: 或译“奉他的诸神之名”。
    reason: alternative_reading
lexical_decisions:
- source_word: הַפְּלִשְׁתִּי
  choice: 非利士人
  rationale: 按族群身份直译，符合叙事语体，不增添原文没有的“战士”等说明。
- source_word: הֲכֶלֶב אָנֹכִי
  choice: 我难道是狗吗
  rationale: 保留原文带侮辱意味的反问和“狗”这一重要意象；“难道……吗”自然表达愤怒与受辱感。
- source_word: כִּי אַתָּה בָא אֵלַי
  choice: 你竟……到我这里来
  rationale: כִּי在此连接反问的缘由；汉语用“竟”能自然传达歌利亚因大卫所持之物而感到受辱的语气，而不改变命题内容。
- source_word: בַּמַּקְלוֹת
  choice: 拿着棍子
  rationale: מַקֵּל可指棍、杖等；复数在此带有轻蔑和夸张意味。“棍子”通俗自然，也不把它们过度武器化。
- source_word: וַיְקַלֵּל
  choice: 咒诅
  rationale: 此处是借神明施行咒诅，不只是辱骂；“咒诅”保留其宗教性和力度。
- source_word: בֵּאלֹהָיו
  choice: 凭他的神明
  rationale: 介词ב可表达凭借或援引；“凭”简洁地呈现非利士人援引其所敬奉神明来咒诅大卫。用“神明”可自然指外族所奉之神，也避免在正文中过早消除单复数的词义张力。
theological_decisions:
- issue: 非利士语境中带第三人称单数后缀的אֱלֹהִים应作单数还是复数
  choice: 他的神明
  alternative: 他的神
  rationale: אֱלֹהִים在形态上为复数形式，但也可指单一神祇。非利士背景使复数理解很自然，不过原词本身仍容许单数理解；正文用汉语可具集合意味的“神明”，脚注列出单数译法，以保留原文歧义。
- issue: 介词ב在咒诅表达中的功能
  choice: 凭他的神明
  alternative: 奉他的神明之名
  rationale: “凭”保留工具、凭借或援引的宽度；“奉……之名”较明确地解释为以神明名义行事，故列作说明性替代译法。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。直接引语以“难道……吗”和“竟”呈现受辱后的愤怒；保留“狗”“棍子”“咒诅”等原文具体而强烈的措辞。脚注标记紧跟其实际说明的词语，避免英文咨询层中标记位置与注释内容错配的问题。
