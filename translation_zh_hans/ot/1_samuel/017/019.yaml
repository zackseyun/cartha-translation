  text: Saul and they and all the men of Israel were in the Valley of Elah[a], fighting with the Philistines.
translation:
  language: zh_hans
  text: 扫罗、他们和以色列众人都在以拉谷，正与非利士人交战[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “与非利士人交战”也可译作“对抗非利士人”。希伯来语介词直译为“与”，但在交战语境中表示敌对双方的关系。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/שָׁאוּל וְ/הֵמָּה וְ/כָל אִישׁ יִשְׂרָאֵל
  choice: 扫罗、他们和以色列众人
  rationale: 保留原文并列提及的扫罗、独立代词“他们”以及以色列全军。“他们”承接上文所说的人；“以色列众人”自然表达 כָל אִישׁ יִשְׂרָאֵל 的整体含义，同时避免生硬的逐字表达。
- source_word: בְּ/עֵמֶק הָאֵלָה
  choice: 在以拉谷
  rationale: עֵמֶק 意为“谷”；הָאֵלָה 是地名，按现代汉语圣经地名惯例音译为“以拉”。
- source_word: נִלְחָמִים
  choice: 正在……交战
  rationale: 分词表示持续进行的行动；“正在交战”准确传达当时战斗持续中的状态。
- source_word: עִם פְּלִשְׁתִּים
  choice: 与非利士人
  rationale: עִם 的基本义是“与、同”，在战争语境中搭配“交战”自然表示敌对关系；“非利士人”采用通行译名。
