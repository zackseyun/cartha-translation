  text: וַֽ/יַּעֲמֹ֗ד וַ/יִּקְרָא֙ אֶל מַעַרְכֹ֣ת יִשְׂרָאֵ֔ל וַ/יֹּ֣אמֶר לָ/הֶ֔ם לָ֥/מָּה תֵצְא֖וּ לַ/עֲרֹ֣ךְ מִלְחָמָ֑ה הֲ/ל֧וֹא אָנֹכִ֣י הַ/פְּלִשְׁתִּ֗י וְ/אַתֶּם֙ עֲבָדִ֣ים לְ/שָׁא֔וּל בְּרוּ לָ/כֶ֥ם אִ֖ישׁ וְ/יֵרֵ֥ד אֵלָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/008.yaml
  text: He stood and called out to the battle lines of Israel and said to them[a], “Why do you come out to array yourselves for battle? Am I not the Philistine, and are you not slaves of Saul? Choose a man for yourselves[b], and let him come down to me.”
translation:
  language: zh_hans
  text: 他站定，向以色列的军阵高声喊道：“你们为什么出来摆开阵势交战？我不是非利士人吗？你们不是扫罗的奴仆吗？你们为自己选一个人，让他下来到我这里。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲמֹד
  choice: 他站着
  rationale: 保留叙事中“站立”的基本意义，也呈现歌利亚当众挑战的姿态。
- source_word: וַיִּקְרָא אֶל מַעַרְכוֹת יִשְׂרָאֵל
  choice: 向以色列的阵列高声喊道
  rationale: “高声喊道”符合隔着战线公开呼喊的场景；“阵列”保留 מַעַרְכוֹת 所指整齐排列的作战队伍。
- source_word: לָמָּה תֵצְאוּ לַעֲרֹךְ מִלְחָמָה
  choice: 你们为什么出来列阵交战
  rationale: “列阵交战”既保留 ערך 的排列、部署意象，也符合现代汉语军事语境。
- source_word: אָנֹכִי הַפְּלִשְׁתִּי
  choice: 我不是那非利士人吗
  rationale: “那非利士人”体现定冠词的特指意味，暗示说话者以非利士一方的代表勇士自居，同时不把这种语境含义过度明说。
- source_word: עֲבָדִים לְשָׁאוּל
  choice: 扫罗的奴仆
  rationale: עֲבָדִים 可指仆人或奴仆；此处位于挑衅话语中，“奴仆”兼顾从属身份与贬抑语气，又不像现代“奴隶”那样过度限定其法律身份。
- source_word: בְּרוּ לָכֶם אִישׁ
  choice: 你们为自己选一个人
  rationale: 保留命令语气、לָכֶם 的受益或关联含义，以及 אִישׁ 的单数男性表达。
- source_word: וְיֵרֵד אֵלָי
  choice: 让他下来到我这里
  rationale: 以“让他”表达祈使之后的祈愿式语气，并保留 ירד 的向下移动方向。
theological_decisions:
- issue: עֲבָדִים 的身份与贬抑色彩
  choice: 奴仆
  alternative: 仆人；奴隶
  rationale: “仆人”可能削弱歌利亚嘲讽以色列人受制于扫罗的语气；“奴隶”则容易使现代读者过度理解为严格的法律身份。“奴仆”较能保留原词的语义幅度和此处的侮辱性。
- issue: הַפְּלִשְׁתִּי 中定冠词的表达
  choice: 那非利士人
  alternative: 一个非利士人；非利士人的代表
  rationale: 采用“那”保留特指和代表性语感，但不直接增补“代表”这一解释，以免消除原文的含蓄性。
- issue: אִישׁ 的性别与单人决斗语境
  choice: 一个人
  alternative: 一名勇士；一个男人
  rationale: “一个人”在汉语中能自然指此处所要求的单独男性战士；不增译“勇士”，因为原词本身只是 אִישׁ，具体角色由上下文说明。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。句式保留公开挑战的反问与命令力度；军事用语选择“阵列”“列阵交战”，避免文言化过重，也不把原文隐含的代表决斗制度展开成解释。
