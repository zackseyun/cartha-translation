- from: 他站着，向以色列的阵列高声喊道：“你们为什么出来列阵交战？我不是那非利士人吗？你们不都是扫罗的奴仆吗？你们为自己选一个人，让他下来到我这里。”
  to: 他站定，向以色列的军阵高声喊道：“你们为什么出来摆开阵势交战？我不是非利士人吗？你们不是扫罗的奴仆吗？你们为自己选一个人，让他下来到我这里。”
  rationale: 修订仅改善汉语自然度并删除原文未明示的“都”。“摆开阵势交战”保留לַעֲרֹךְ מִלְחָמָה的部署、列阵含义；“奴仆”保留原词在嘲讽语境下的从属与贬抑色彩，未过度限定其社会法律身份。原文未提供需保留或新增的中文脚注锚点，故不增设脚注。
