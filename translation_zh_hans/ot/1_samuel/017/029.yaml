  text: David said[a], “What have I done now? Was it not just a word?”
translation:
  language: zh_hans
  text: 大卫说：“我这次做了什么？不就一句话吗？”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不就是一件事吗？”希伯来语 דָּבָר 可指“话”、“事情”或“事物”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 这是叙事中常见的 wayyiqtol 形式，用来引出直接引语；现代汉语自然译为“说”。
- source_word: דָּוִד
  choice: 大卫
  rationale: 采用现代中文圣经传统通行的人名译法。
- source_word: מֶה עָשִׂיתִי עָתָּה
  choice: 我这次做了什么？
  rationale: מֶה 引出带抗辩语气的问句；עָתָּה 在这段对话中不只是时间上的“现在”，也表达“这一次、这回”的不满语气，因此译为自然的现代汉语“我这次做了什么？”
- source_word: הֲלוֹא
  choice: 不……吗
  rationale: 保留原文预期肯定回答的反问语气。
- source_word: דָּבָר
  choice: 一句话
  rationale: דָּבָר 可指“话、事情、事物”。结合上下文，大卫似乎是在把自己的行为说成不过是发问或说话；正文采用“一句话”，同时以脚注保留“事情”的可能。
- source_word: הוּא
  choice: 是
  rationale: 在汉语判断句和反问结构中自然融入“不就是……吗”，无需另译独立代词。
