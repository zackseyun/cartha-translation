base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/012.yaml
  text: David was the son of an Ephrathite from Bethlehem of Judah[a], whose name was Jesse, and he had eight sons. In the days of Saul, the man was old, advanced in years.
translation:
  language: zh_hans
  text: 大卫的父亲是犹大伯利恒的一位以法他人，名叫耶西；耶西有八个儿子。在扫罗的日子，耶西已经年老，上了年纪。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文这一短语不同寻常，字面可译作“来到众人中间”；通常理解为“年事已高”。
    reason: 保留罕见希伯来语习语的字面形态，并说明其在此语境中的通常理解。
lexical_decisions:
- source_word: אֶפְרָתִי
  choice: 以法他人
  rationale: 这里的称谓与“犹大伯利恒”相连，指以法他／伯利恒地区的人，并非以法莲支派的人。采用音译称谓，保留原文的地域标识。
- source_word: מִבֵּית לֶחֶם יְהוּדָה
  choice: 犹大伯利恒
  rationale: 简洁保留地名与所属地域的关系，也可与其他名为伯利恒的地方相区别。
- source_word: וּשְׁמוֹ יִשַׁי
  choice: 这人名叫耶西
  rationale: 将希伯来语并列结构自然转为现代汉语，同时明确所指是大卫的父亲。
- source_word: וְלוֹ שְׁמֹנָה בָנִים
  choice: 有八个儿子
  rationale: 用现代汉语惯用的领有表达准确传达原意。
- source_word: בִּימֵי שָׁאוּל
  choice: 扫罗在位期间
  rationale: 按叙事语境自然表达“在扫罗的日子”，指扫罗掌权的时期。
- source_word: זָקֵן
  choice: 已经年老
  rationale: 直接表达年老的状态；“已经”与下句共同体现年事已高。
- source_word: בָּא בַאֲנָשִׁים
  choice: 上了年纪
  rationale: 这是一个罕见且含义不完全透明的希伯来语表达，语境中通常理解为年事已高。正文采用清楚自然的汉语，脚注保留其直译所呈现的困难。
- source_word: וְהָאִישׁ
  choice: 这人
  rationale: 保留原文再次以“这人”指耶西的叙事结构，避免直接改成代词而抹平原文措辞。
