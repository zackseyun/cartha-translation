revisions:
- from: 大卫是犹大伯利恒一个以法他人的儿子；这人名叫耶西，有八个儿子。扫罗在位期间，这人已经年老，上了年纪。[a]
  to: 大卫的父亲是犹大伯利恒的一位以法他人，名叫耶西；耶西有八个儿子。在扫罗的日子，耶西已经年老，上了年纪。[a]
  rationale: 修订仅改善中文句法与指代清晰度：明确耶西是大卫的父亲，并将地名和地域称谓自然地置于“父亲”的说明中。末句仍分别反映“年老”和罕见习语所表达的高龄；脚注继续保留该习语的字面困难及通常解释。
