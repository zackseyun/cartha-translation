revisions:
- from: 那非利士人起身，向前走来，渐渐逼近大卫；大卫就赶快迎着战阵[a]跑去，要与那非利士人交锋。
  to: 那非利士人起来，走来，接近大卫；大卫急忙跑向战阵，迎着那非利士人。
  rationale: 修订删除“渐渐”和“交锋”所附加的语义，以“接近”对应非利士人的靠近动作，并以“迎着”对应两处 לִקְרַאת。保留“战阵”及其脚注，以表达 הַמַּעֲרָכָה 在此处可指军阵或战线的词义范围。
