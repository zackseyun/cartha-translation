  text: And when the Philistine rose and came and drew near to meet David[a], David hurried and ran toward the battle line to meet the Philistine.
translation:
  language: zh_hans
  text: 那非利士人起来，走来，接近大卫；大卫急忙跑向战阵，迎着那非利士人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: 那……时（按中文叙事自然省译为“那”）
  rationale: 这是承接下一个事件的叙事—时间结构。现代汉语无需直译“事情发生在……时”，以“那……起身”自然推进叙事。
- source_word: קָם
  choice: 起身
  rationale: 准确表达从原有姿态起来并开始行动，语体自然庄重。
- source_word: הַפְּלִשְׁתִּי
  choice: 那非利士人
  rationale: 原文只称“非利士人”，不从上下文增译“勇士”或“战士”。
- source_word: וַיֵּלֶךְ וַיִּקְרַב
  choice: 向前走来，渐渐逼近
  rationale: 保留两个连续动词所描写的推进过程；“走来”表示朝大卫而来，“逼近”符合交战语境，又不额外加入攻击动作。
- source_word: לִקְרַאת דָּוִד
  choice: 逼近大卫
  rationale: 此处表示朝向大卫、准备相遇；与后半句避免机械重复，同时保留敌对相向而行的含义。
- source_word: וַיְמַהֵר דָּוִד וַיָּרָץ
  choice: 大卫就赶快……跑去
  rationale: 分别体现“迅速行动”和“奔跑”，保持原文动作的紧迫感。
- source_word: הַמַּעֲרָכָה
  choice: 战阵
  rationale: 该名词可指列阵的军队、战线或战阵；“战阵”简洁地保留其军事含义与一定的词义宽度。
- source_word: לִקְרַאת הַפְּלִשְׁתִּי
  choice: 要与那非利士人交锋
  rationale: 在敌对军事语境中，לִקְרַאת 表示迎向对方；“交锋”自然表达迎敌相遇，但不具体增添原文未明说的攻击方式。
