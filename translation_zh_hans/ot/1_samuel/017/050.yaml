base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/050.yaml
  text: So David prevailed over the Philistine with a sling and with a stone; he struck the Philistine and killed him[a], though there was no sword in David’s hand.
translation:
  language: zh_hans
  text: 这样，大卫用投石带和一块石头胜过那非利士人；他击打那非利士人，杀死了他；大卫手中却没有剑[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“杀死了他；大卫手中并没有剑。”希伯来语连接词也可较形式地译为“并且”；正文的“却”表达此句在上下文中的对比和让步意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּחֱזַק דָּוִד מִן הַפְּלִשְׁתִּי
  choice: 大卫……胜过了那非利士人
  rationale: חזק 与 מן 连用，表示比对手强、胜过对手；“胜过”既贴合原文结构，也自然符合交战语境。
- source_word: בַּקֶּלַע וּבָאֶבֶן
  choice: 用甩石带和一块石头
  rationale: 介词 בְּ 在此表示工具；保留 אֶבֶן 的单数，用“一块石头”明确大卫所用的是一块石头。“甩石带”比“投石器”更准确地指手持抛石武器。
- source_word: וַיַּךְ אֶת־הַפְּלִשְׁתִּי
  choice: 他击倒非利士人
  rationale: נכה 的基本义是击打；结合上文石头击中额头、对手仆倒，以及紧接的“杀死”，译作“击倒”自然表现这一击的结果，同时避免与“杀死”重复。
- source_word: וַיְמִיתֵהוּ
  choice: 把他杀死了
  rationale: מות 的使役式明确表示使其死亡，即“杀死”；直译保留叙事的明确断言。
- source_word: וְחֶרֶב אֵין בְּיַד דָּוִד
  choice: 尽管大卫手里没有刀
  rationale: 句首 וְ 可引出伴随或带让步意味的情境；上下文强调大卫未用刀而取胜，因此正文用“尽管”表达语境中的让步关系，同时脚注保留较形式化的并列读法。
- source_word: חֶרֶב
  choice: 刀
  rationale: חֶרֶב 指近身战斗所用的剑或刀；现代汉语圣经叙事中“刀”简洁自然，且与后文大卫取歌利亚的刀相衔接。
- source_word: בְּיַד דָּוִד
  choice: 大卫手里
  rationale: 保留“手”的具体意象，不泛化为“拥有”；“手里没有刀”在现代汉语中自然，并符合现场战斗语境。
theological_decisions:
- issue: 歌利亚是在石击时已经死亡，还是后来才被割头致死
  choice: 按本节 וַיְמִיתֵהוּ 直译为“大卫……把他杀死了”
  alternative: 弱化为“使他倒下”或解释为后来用刀才最终致死
  rationale: 本节的希伯来文明确使用 מות 的使役式，陈述大卫杀死了他；下一节割头所形成的叙事张力不应通过改弱本节措辞而被消除。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“这样”承接前文并概括取胜结果；“那非利士人”保留原文定指。句式兼顾希伯来文动作次序与自然汉语节奏，脚注标记已在正文对应出现。
