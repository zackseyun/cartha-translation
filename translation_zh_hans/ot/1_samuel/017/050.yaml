revisions:
- from: 这样，大卫用甩石带和一块石头胜过了那非利士人；他击倒非利士人，把他杀死了[a]，尽管大卫手里没有刀。
  to: 这样，大卫用投石带和一块石头胜过那非利士人；他击打那非利士人，杀死了他；大卫手中却没有剑[a]。
  rationale: 修订严格保留希伯来文的动作次序：大卫胜过对手、击打对手、杀死对手，随后说明他手中没有剑。以“击打”避免把上下文已知结果提前嵌入本节动词；以“剑”准确对应 חֶרֶב。末句的 וְ 可作普通并列，语境也突显无剑取胜的反差，故正文用“却”，脚注保留“并且”的形式性替代译法。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T05:26:17Z'
