  text: וַ/יָּשֻׁ֨בוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל מִ/דְּלֹ֖ק אַחֲרֵ֣י פְלִשְׁתִּ֑ים וַ/יָּשֹׁ֖סּוּ אֶת מַחֲנֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/053.yaml
  text: The sons of Israel returned from pursuing the Philistines[a], and they plundered their camps.
translation:
  language: zh_hans
  text: 以色列人追赶非利士人回来，就抢掠了他们的营地。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “营地”也可译作“各营地”。
    reason: 原文名词形式可理解为复数；中文正文采用不强制区分单复数的“营地”。
lexical_decisions:
- source_word: וַיָּשֻׁבוּ
  choice: 回来
  rationale: שׁוב的基本义是“返回”。这里指以色列人结束追击后回来；“回来”符合现代汉语叙事习惯。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 字面为“以色列的众子”，在此是对以色列群体的常用称呼；译作“以色列人”自然、准确，且不造成仅指男性的误解。
- source_word: מִדְּלֹק אַחֲרֵי
  choice: 追赶……回来
  rationale: דלק与אַחֲרֵי组合表示紧追、追赶。希伯来语介词מִן标明从这一行动返回；汉语以“追赶……回来”自然表达同一关系。
- source_word: פְלִשְׁתִּים
  choice: 非利士人
  rationale: 采用该族名在现代中文圣经语境中的通行译名。
- source_word: וַיָּשֹׁסּוּ
  choice: 就抢掠了
  rationale: שסס指在军事情境中掠夺、洗劫。“抢掠”既保留武力夺取财物之意，也符合现代汉语。
- source_word: מַחֲנֵיהֶם
  choice: 他们的营地
  rationale: 马所拉文本的形式可按复数“营地”理解，但中文“营地”本身不强制标明单复数，因而自然保留其可能指一个营区或多个营地的开放性。
theological_decisions: []
translation_notes:
  register: 采用现代、简洁而庄重的叙事语言。“以色列人”比直译“以色列的众子”更符合普通现代读者的表达习惯；语序按汉语调整为“追赶……回来”，不改变原文行动次序。
