base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/009.yaml
  text: If he is able to fight with me and strike me down[a], then we will be your slaves. But if I prevail against him and strike him down[c][b], then you will be our slaves and serve us.
translation:
  language: zh_hans
  text: 他若能跟我交战，把我击倒[a]，我们就作你们的奴仆[b]；但我若能胜过他，把他击倒，你们就作我们的奴仆，服侍我们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “击倒”也可译作“杀死”或“打败”。原文动词可涵盖击打以及由此造成的决定性结果。
    reason: lexical_alternative
  - marker: b
    text: “奴仆”也可译作“奴隶”或“仆人”。这里的语境是战败后一方受另一方辖制并服役。
    reason: lexical_alternative
lexical_decisions:
- source_word: יוּכַל לְהִלָּחֵם אִתִּי
  choice: 能跟我交战
  rationale: יכל表示能力，לחם的尼法勒式与אתי在这里指双方交战；译文保留条件挑战的直接表达。
- source_word: וְהִכָּנִי / וְהִכִּיתִיו
  choice: 把我击倒 / 把他击倒
  rationale: נכה可指击打、击杀或打败；“击倒”体现决斗中的决定性结果，同时不把原文明确收窄为“杀死”。
- source_word: וְהָיִינוּ לָכֶם לַעֲבָדִים / וִהְיִיתֶם לָנוּ לַעֲבָדִים
  choice: 作你们的奴仆 / 作我们的奴仆
  rationale: עבדים在战后民族被征服、受支配的语境中带有非自由的从属身份；“奴仆”既表达受辖制，也较自然庄重。
- source_word: אֲנִי אוּכַל לוֹ
  choice: 我若能胜过他
  rationale: יכל与ל连用，在争战语境中可表示有能力胜过对方；“能胜过”兼顾字面上的能力和语境中的取胜。
- source_word: וַעֲבַדְתֶּם אֹתָנוּ
  choice: 服侍我们
  rationale: עבד在此表示被征服者向征服者服役；“服侍”与前面的身份表述相呼应。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言；两个条件句保持平行。“能胜过”保留יכל在此处兼有能力与取胜意味的张力；“奴仆”避免把受辖制的性质淡化为普通雇佣服务。
