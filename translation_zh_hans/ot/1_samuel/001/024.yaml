base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/024.yaml
  text: When she had weaned him[a], she took him up with her, with three bulls, one ephah of flour, and a skin of wine, and brought him to the house of Yahweh at Shiloh. Now the boy was young.
translation:
  language: zh_hans
  text: 她给孩子断奶以后，就带着他上去，又带了三头公牛[a]、一伊法细面和一皮袋酒，把他带到示罗的耶和华殿里。那时这孩子还很小。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 马所拉文本作“三头公牛”；一些古代译本和解释者作“一头三岁的公牛”。
    reason: textual_variant
lexical_decisions:
- source_word: וַתַּעֲלֵהוּ עִמָּהּ
  choice: 就带着他上去
  rationale: 保留עלה在前往圣所朝圣语境中的“上去”方向感，也明确表达עִמָּהּ所表示的随同关系。
- source_word: כַּאֲשֶׁר גְּמָלַתּוּ
  choice: 她给孩子断奶以后
  rationale: גמל在此指给孩子断奶；用“以后”自然表达该时间从句所指的先后关系。
- source_word: בְּפָרִים שְׁלֹשָׁה
  choice: 三头公牛
  rationale: 马所拉文本明确为复数“公牛”加数词“三”；异文“⼀头三岁的公牛”保留在脚注中。
- source_word: וְאֵיפָה אַחַת קֶמַח
  choice: 一伊法细面
  rationale: 保留古代容量单位“伊法”，不作不确定的现代换算；קֶמַח译为祭物语境中自然的“细面”。
- source_word: וְנֵבֶל יַיִן
  choice: 一皮袋酒
  rationale: נֵבֶל在此指盛酒的容器；“一皮袋酒”简洁地传达酒袋及其所盛之酒。
- source_word: וַתְּבִאֵהוּ
  choice: 把他带到
  rationale: 该使役形表示“带来、带到”，作为抵达圣所的主要动词，与前面的“带着他上去”有所区分。
- source_word: בֵית יְהוָה שִׁלוֹ
  choice: 示罗耶和华的殿
  rationale: בֵית在此指圣所，译作“殿”符合中文圣经语体；将示罗自然地处理为圣所所在地。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文读者熟悉的神名音译“耶和华”，而不以称号替代专名。
- source_word: וְהַנַּעַר נָעַר
  choice: 那时这孩子还很小
  rationale: 原文重复נַעַר，着重说明孩子年幼；中文以“还很小”自然保留这一强调，而不作生硬重复。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用四字神名；正文保留为专名，并采用简体中文圣经传统中最通行、普通读者最易识别的“耶和华”。
- issue: 祭牲数量的文本差异
  choice: 三头公牛
  alternative: 一头三岁的公牛
  rationale: 正文依照WLC马所拉文本的复数פָרִים和数词שְׁלֹשָׁה直译，不因后文只提到宰一头牛而自行协调；古代见证所支持的另一读法列入脚注。
translation_notes:
  register: 采用庄重而清晰的现代标准汉语。“上去”保留朝圣行程的方向感；“那时这孩子还很小”以自然中文传达原文重复所形成的强调。脚注标记紧随存在文本差异的“三头公牛”，避免误指“断奶”。
