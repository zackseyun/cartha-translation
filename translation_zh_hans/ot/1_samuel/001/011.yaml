source:
  edition: WLC
  text: וַ/תִּדֹּ֨ר נֶ֜דֶר וַ/תֹּאמַ֗ר יְהוָ֨ה צְבָא֜וֹת אִם רָאֹ֥ה תִרְאֶ֣ה בָּ/עֳנִ֣י אֲמָתֶ֗/ךָ וּ/זְכַרְתַּ֨/נִי֙ וְ/לֹֽא תִשְׁכַּ֣ח אֶת אֲמָתֶ֔/ךָ וְ/נָתַתָּ֥ה לַ/אֲמָתְ/ךָ֖ זֶ֣רַע אֲנָשִׁ֑ים וּ/נְתַתִּ֤י/ו לַֽ/יהוָה֙ כָּל יְמֵ֣י חַיָּ֔י/ו וּ/מוֹרָ֖ה לֹא יַעֲלֶ֥ה עַל רֹאשֽׁ/וֹ־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/011.yaml
  text: She made a vow and said[a], “O Yahweh of hosts, if you will indeed look on the affliction of your female servant, and remember me, and not forget your female servant, but give your female servant a male child, then I will give him to Yahweh all the days of his life[b], and no razor shall come upon his head.”
translation:
  language: zh_hans
  text: 她许愿说：“万军之耶和华啊，你若实在垂看婢女的苦情，顾念我，不忘记你的婢女，赐给你的婢女一个男孩[a]，我必把他交给耶和华，终其一生；剃刀必不临到他的头上[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“男子的后裔（种子）”，在这里指男孩。
    reason: lexical_alternative
  - marker: b
    text: “剃刀必不临到他的头上”与拿细耳人分别为圣相关的措辞相呼应；但本节只明确说剃刀不可临到他的头上，并没有使用“拿细耳人”这一称呼。
    reason: cultural_note
lexical_decisions:
- source_word: וַתִּדֹּר נֶדֶר
  choice: 她许了一个愿
  rationale: 希伯来语以同根宾语加强“许愿”这一正式行动；现代汉语用“许了一个愿”自然表达。
- source_word: יְהוָה צְבָאוֹת
  choice: 万军之耶和华
  rationale: 保留神名“耶和华”，并将 צְבָאוֹת 译为传统而清楚的“万军”，不将这一称号释义化为“全能者”。
- source_word: אִם רָאֹה תִרְאֶה
  choice: 你若真的垂看
  rationale: 不定式绝对形与限定动词连用形成强调；“真的”传达强调，“垂看”适合祷告语境，并包含眷顾之意。
- source_word: בָּעֳנִי
  choice: 婢女的苦情
  rationale: עֳנִי 可指困苦、苦难或屈辱；“苦情”在此涵盖哈拿的痛苦与受辱处境，而不作过窄解释。
- source_word: אֲמָתֶךָ / לַאֲמָתְךָ
  choice: 你的婢女
  rationale: 该词明确指女性仆人；“婢女”保留性别和自谦语气，也适合庄重祷告。
- source_word: וּזְכַרְתַּנִי
  choice: 顾念我
  rationale: “顾念”自然表达祷告中求神记念并采取行动的含义。
- source_word: וְלֹא תִשְׁכַּח אֶת אֲמָתֶךָ
  choice: 不忘记你的婢女
  rationale: 保留与“顾念我”相对并行的表达及祈求的累积结构。
- source_word: וְנָתַתָּה לַאֲמָתְךָ זֶרַע אֲנָשִׁים
  choice: 赐给你的婢女一个男孩
  rationale: זֶרַע אֲנָשִׁים 字面为“男人的后裔/种子”，在本语境中指男性孩子；正文采用自然明确的“男孩”，脚注保留原文形式。
- source_word: וּנְתַתִּיו לַיהוָה
  choice: 我就把他献给耶和华
  rationale: 动词字面是“给”；汉语“献给”在许愿语境中清楚表达把孩子交给耶和华，同时不额外规定具体礼仪。
- source_word: כָּל יְמֵי חַיָּיו
  choice: 使他一生归耶和华
  rationale: “一生”自然传达“他生命的所有日子”；补出“归耶和华”说明持续关系，与前面的“献给”连贯。
- source_word: וּמוֹרָה לֹא יַעֲלֶה עַל רֹאשׁוֹ
  choice: 剃刀必不碰他的头
  rationale: 保留具体的剃刀禁令；“不碰他的头”是现代汉语对希伯来语“不上到他头上”的自然表达。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 正文直接呈现四字神名。现代中文圣经传统中“耶和华”辨识度最高；这不是以“主”替代神名。
- issue: “剃刀必不碰他的头”是否明确称为拿细耳人之愿
  choice: 正文只保留终身归属与不用剃刀的具体誓愿语言
  alternative: 在正文中明确称他为拿细耳人
  rationale: 措辞与拿细耳式分别为圣有关，但本节没有使用“拿细耳人”这一名称，也只明确提到不用剃刀；因此不把推论写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语言。“婢女”略带传统色彩，但能准确保留女性身份及自谦语气；整体避免过度古雅。
