  text: וְ/חַנָּ֖ה לֹ֣א עָלָ֑תָה כִּֽי אָמְרָ֣ה לְ/אִישָׁ֗/הּ עַ֣ד יִגָּמֵ֤ל הַ/נַּ֨עַר֙ וַ/הֲבִאֹתִ֗י/ו וְ/נִרְאָה֙ אֶת פְּנֵ֣י יְהוָ֔ה וְ/יָ֥שַׁב שָׁ֖ם עַד עוֹלָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/022.yaml
  text: But Hannah did not go up[a], for she said to her husband, “Not until the boy is weaned will I bring him[b], so that he may appear before Yahweh and stay there forever.”
translation:
  language: zh_hans
  text: 哈拿却没有上去，因为她对丈夫说：“等孩子断了奶，我才带他去；他要朝见耶和华[a]，并永远住在那里。”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或按另一种句法理解及文本传统译作：“我朝见耶和华，他就永远住在那里。”
    reason: alternative_reading
  - marker: b
    text: 这里的“永远”指撒母耳被永久献上服事耶和华，也就是终身在那里服事。
    reason: cultural_note
lexical_decisions:
- source_word: עָלָתָה
  choice: 上去
  rationale: 保留希伯来语“上去”的常用表达；在本段语境中指上示罗的圣所。
- source_word: עַד יִגָּמֵל הַנַּעַר
  choice: 等孩子断了奶，我才……
  rationale: 以自然现代汉语准确表达 עַד 所含的延后界限，即在断奶之前不带他去。נַעַר 在这里指尚年幼的撒母耳，译作“孩子”最合语境。
- source_word: וַהֲבִאֹתִיו
  choice: 我才带他去
  rationale: 表达哈拿计划在孩子断奶之后采取的下一步行动；“去”依圣所语境自然补出。
- source_word: וְנִרְאָה אֶת־פְּנֵי יְהוָה
  choice: 使他朝见耶和华
  rationale: 尼法勒形态在敬拜语境中宜理解为“出现于……面前/朝见”；主语按马所拉文本的自然句法取为孩子。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神名形式，明确保留专名而不以普通称号替代。
- source_word: וְיָשַׁב שָׁם
  choice: 并……住在那里
  rationale: ישב 在此表示持续居留于圣所；“住在那里”比直译“坐在那里”自然，也保留实际居住之意。
- source_word: עַד עוֹלָם
  choice: 永远
  rationale: 保留原文宽广而持久的时间表达；在本处语境中实际指撒母耳终身奉献服事。
theological_decisions:
- issue: “朝见耶和华”及“住在那里”的主语
  choice: 两者均以撒母耳为主语
  alternative: 另一种句法理解或文本传统作“我朝见耶和华，他永远住在那里”
  rationale: 马所拉文本按现有读法，在“我带他去”之后最自然地继续以孩子为主语，也符合将撒母耳留在圣所的叙事方向；但另一理解具有文本传统依据，故列入脚注而不予抹除。
- issue: “永远”的时间范围
  choice: 正文保留“永远”
  alternative: 直释为“终身”
  rationale: 不在正文中缩窄 עוֹלָם 的措辞，同时用脚注说明在本叙事中的具体所指是撒母耳终身被献上服事耶和华。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“等……才……”清楚传达原文“直到……才”的延后关系；“朝见”适合圣所敬拜语境。两个脚注标记均置于正文句末，分别对应整句的异文/异解与“永远”的语境说明。
