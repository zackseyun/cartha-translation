base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/004.yaml
  text: And when the day came[a], Elkanah sacrificed and gave portions to Peninnah his wife and to all her sons and daughters.
translation:
  language: zh_hans
  text: 每当以利加拿献祭时[a]，他都会分给妻子毗尼拿和她所有的儿子、女儿各一份。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作：“有一天，以利加拿献祭，就分给妻子毗尼拿和她所有的儿子、女儿各一份。”希伯来文可按一次性的过去叙事理解，但上下文较支持这里描述的是反复举行献祭筵席时的惯常做法。
    reason: 保留希伯来文叙事形式可理解为单次过去事件的可能，同时说明正文采用惯常性表达的上下文依据。
lexical_decisions:
- source_word: וַיְהִי הַיּוֹם
  choice: 每逢……的日子
  rationale: 这是叙事中的时间表达。结合下文所描述的家庭惯例，用“每逢”自然传达反复发生的时间背景，同时在脚注保留一次性过去叙事的可能。
- source_word: וַיִּזְבַּח
  choice: 献祭
  rationale: זבח在此指礼仪性的宰牲献祭；“献祭”简洁、自然，也不额外限定具体操作。
- source_word: וְנָתַן
  choice: 都会分给
  rationale: 该形式本身可按过去叙事理解，但上下文较支持惯常行为；“都会”在现代汉语中清楚表达这种反复发生的动作。
- source_word: לִפְנִנָּה אִשְׁתּוֹ
  choice: 妻子毗尼拿
  rationale: 采用现代汉语自然的称谓与姓名顺序，并完整保留她与以利加拿的夫妻关系。
- source_word: וּלְכָל בָּנֶיהָ וּבְנוֹתֶיהָ
  choice: 她所有的儿子、女儿
  rationale: 原文分别提到儿子和女儿，因此不笼统译作“儿女”或“孩子”，以保留原文的明确列举。
- source_word: מָנוֹת
  choice: 各一份
  rationale: מָנוֹת指所分配的若干份。汉语若只说“分给……份”不自然；“各一份”简洁表达众人分别领受份额，且不必在正文中补入原文未明说的“祭肉”。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“每逢……都会”使惯常动作清楚可懂；脚注保留原文可按单次事件理解的歧义。正文不用“祭肉”，避免把语境推断直接写入原文。
