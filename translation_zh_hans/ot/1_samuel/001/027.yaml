  text: אֶל הַ/נַּ֥עַר הַ/זֶּ֖ה הִתְפַּלָּ֑לְתִּי וַ/יִּתֵּ֨ן יְהוָ֥ה לִ/י֙ אֶת שְׁאֵ֣לָתִ֔/י אֲשֶׁ֥ר שָׁאַ֖לְתִּי מֵ/עִמּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/027.yaml
  text: For this boy I prayed[b][a], and Yahweh has given me my petition that I asked from him.
translation:
  language: zh_hans
  text: 我为这孩子祷告[a]，耶和华就把我向他所求的赐给了我[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我曾为这孩子祷告”，也可理解为“我曾为有关这孩子的事祷告”。原文介词可表示祷告所关乎的对象或事情。
    reason: lexical_alternative
  - marker: b
    text: 直译：“耶和华就把我的请求，就是我向他所求的，赐给了我。”原文“请求”和“所求”来自同一词根。
    reason: wordplay
lexical_decisions:
- source_word: אֶל הַנַּעַר הַזֶּה
  choice: 为这孩子
  rationale: 介词 אֶל 与“祷告”连用时，可表示祷告所关乎的对象；“为这孩子”在现代汉语中自然，并保留哈拿为这个男孩祈求的语境。נַעַר 在此指年幼的撒母耳，译作“孩子”比“少年”更符合上下文。
- source_word: הִתְפַּלָּלְתִּי
  choice: 我……祷告
  rationale: 该词在此明确表示祷告；中文无需显式标出过去时，语境已表明这是先前的行动。
- source_word: וַיִּתֵּן
  choice: 就……赐给了我
  rationale: 叙事过去式在直接引语中表达已经成就的行动；“了”突出如今可见的结果，“赐给”也符合上帝回应祈求的语境。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文读者熟悉的圣名音译“耶和华”，不以“主”这一称号替代原文的专名。
- source_word: שְׁאֵלָתִי
  choice: 我……所求的
  rationale: 原词意为“我的请求、所求之事”。译作“我所求的”是自然现代汉语，并在下文与同根动词 שָׁאַל 的重复中形成呼应。
- source_word: אֲשֶׁר שָׁאַלְתִּי מֵעִמּוֹ
  choice: 我向他所求的
  rationale: “向他求”自然表达请求的对象，也体现 מֵעִמּוֹ 所指的来源关系；与前面的名词“所求”保留 שאל 词根的回响。
theological_decisions:
- issue: 神圣名字 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。中文稿保留为专名而不代换成“主”；“耶和华”是现代中文圣经传统中最通行、普通读者最易识别的音译。
- issue: אֶל 所表达的祷告关系
  choice: 为这孩子祷告
  alternative: 关于这孩子祷告
  rationale: 上下文表明哈拿曾为得到这个孩子而祈求，但该介词也可较宽泛地表示祷告所关乎的事；正文采用自然的“为”，脚注保留“关于”的可能性，不进一步规定祷告关系。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“这孩子”符合撒母耳此时年幼的语境；句式保持哈拿陈述祷告蒙应允时的简洁与力度。所有脚注标记均置于正文相应位置。
