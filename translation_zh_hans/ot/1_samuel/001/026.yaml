base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/026.yaml
  text: And she said[a], “Please, my lord, as surely as you live, my lord, I am the woman who stood here beside you, praying to Yahweh.
translation:
  language: zh_hans
  text: 她说：“我主啊，请恕我说！我主啊，我指着你的性命起誓[a]，我就是那曾在这里站在你身旁、向耶和华祷告的妇人。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文可直译为“如你的性命活着”，也可理解为“凭你的性命”；这是表示郑重恳求的誓言公式。
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּי
  choice: 请听我说
  rationale: 这是用于直接称呼中的恳求语气词；译为“请听我说”自然表达哈拿请求对方留意并容她陈述的谦恭语气。
- source_word: אֲדֹנִי
  choice: 我主
  rationale: 此处是对以利的敬称，并非对上帝的称号；“我主”保留原文的社会身份差异和郑重语气。
- source_word: חֵי נַפְשְׁךָ
  choice: 我指着你的性命起誓
  rationale: 这是以受话者性命为凭的郑重誓言式表达；此译比逐字的“你的生命活着”更符合现代汉语，同时保留誓言性质。
- source_word: הָאִשָּׁה הַנִּצֶּבֶת
  choice: 从前……站着的那个妇人
  rationale: 定冠词与分词共同指认以利先前见过的特定妇人；“从前”根据场景自然标明这是对先前事件的回指。
- source_word: עִמְּכָה בָּזֶה
  choice: 在这里站在你旁边
  rationale: 此处表达地点上的邻近，而非共同参与；“在这里……在你旁边”保留两个空间成分。
- source_word: לְהִתְפַּלֵּל אֶל
  choice: 向……祷告
  rationale: 不定式说明她站在那里的目的或活动；汉语用“向……祷告”简洁自然。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的专名形式音译四字神名，明确保留其专名身份，而不以“主”等称号替代。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用以色列上帝的专名。中文采用广为人知且已定型的“耶和华”，保留专名而非改译为称号；“雅威”是较贴近现代学术重构读音的另一可行音译。
- issue: חֵי נַפְשְׁךָ 是否弱化为一般强调语
  choice: 保留为起誓用语
  alternative: 你确实还活着
  rationale: 该短语在希伯来语中是郑重的誓言公式。译文明确说“起誓”，避免将其仅处理为语气加强，同时脚注交代字面形式。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。保留哈拿对以利两次使用敬称所体现的恭敬与迫切；避免把 אֲדֹנִי 误作神称，并以脚注说明希伯来誓言公式。
