  text: וַ/יֹּ֣אמֶר לָ/הּ֩ אֶלְקָנָ֨ה אִישָׁ֜/הּ עֲשִׂ֧י הַ/טּ֣וֹב בְּ/עֵינַ֗יִ/ךְ שְׁבִי֙ עַד גָּמְלֵ֣/ךְ אֹת֔/וֹ אַ֛ךְ יָקֵ֥ם יְהוָ֖ה אֶת דְּבָר֑/וֹ וַ/תֵּ֤שֶׁב הָֽ/אִשָּׁה֙ וַ/תֵּ֣ינֶק אֶת בְּנָ֔/הּ עַד גָּמְלָ֖/הּ אֹתֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/023.yaml
  text: And Elqanah her husband said to her[a], “Do what seems good in your eyes. Stay until you have weaned him; only may Yahweh establish his word.” So the woman stayed and nursed her son until she had weaned him.
translation:
  language: zh_hans
  text: 她丈夫以利加拿对她说：“你看怎样好，就怎样做吧。你就留下，直到给他断了奶；只愿耶和华成就他的话[a]。”于是那妇人就留下来，给儿子哺乳，直到给他断了奶。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “成就”也可译作“坚立”或“证实”。“他的话”可能指耶和华的应许，也可能指上下文刚刚说到的事。
    reason: 保留 יָקֵם 与 דְּבָרוֹ 的词义及所指含混。
lexical_decisions:
- source_word: אִישָׁהּ
  choice: 她丈夫
  rationale: 此处 אִישׁ 加第三人称阴性单数后缀，按上下文明确指哈拿的婚姻关系；“她丈夫”自然且准确。
- source_word: עֲשִׂי הַטּוֹב בְּעֵינַיִךְ
  choice: 你看怎样好，就怎样做吧
  rationale: 保留“在你眼中为好”的个人判断含义，同时采用自然的现代汉语表达。
- source_word: שְׁבִי
  choice: 留下
  rationale: 此处 ישׁב 指留在原处，而非字面上的坐下；“留下”符合语境。
- source_word: עַד גָּמְלֵךְ אֹתוֹ / עַד גָּמְלָהּ אֹתוֹ
  choice: 直到给他断了奶
  rationale: 在养育幼儿的语境中，גמל 明确指断奶。
- source_word: אַךְ
  choice: 只愿
  rationale: אַךְ 对前面的许可加以限定，并引出以利加拿的愿望或祈愿；“只愿”同时体现限制语气和祈愿语气。
- source_word: יָקֵם
  choice: 成就
  rationale: 使役未完成式在此具有祈愿意味；“成就”可自然用于神使其话实现，同时脚注保留“坚立、证实”等语义可能。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名形式音译四字神名，保留其作为以色列之神专名的功能，而不改作称号。
- source_word: דְּבָרוֹ
  choice: 他的话
  rationale: דבר 可指话、应许或事情；直译为“他的话”可保留所指与语义上的含混。
- source_word: וַתֵּינֶק
  choice: 乳养
  rationale: 该使役形式指给孩子吃奶、哺乳；“乳养”庄重简洁，也与随后“断奶”衔接自然。
- source_word: הָאִשָּׁה
  choice: 那妇人
  rationale: 原文使用带定冠词的普通名词而非哈拿的名字；“那妇人”忠实保留这一指称方式。
theological_decisions:
- issue: “他的话”（דְּבָרוֹ）的所指
  choice: 保留为“他的话”，不明确限定为某一项应许或誓言
  alternative: 译作“他的应许”，或解释为有关孩子的事、哈拿所许之愿
  rationale: 原文使用带阳性单数后缀的“他的话”，上下文容许它指耶和华的应许，也可能涉及刚才所说之事。正文不替原文消除这一解释张力。
- issue: יָקֵם 的语气与意义
  choice: 译作“只愿耶和华成就”
  alternative: “愿耶和华坚立／证实”
  rationale: 动词形式适合表达愿望或祈求；“成就”在汉语中自然，但脚注说明其也可作“坚立”或“证实”，避免把语义过度收窄。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“你看怎样好，就怎样做吧”自然传达希伯来习语；“乳养”略具书面色彩，但普通读者容易理解，并适合经文语体。脚注标记 [a] 已置于正文相应位置。
