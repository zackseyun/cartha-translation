base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/002.yaml
  text: He had two wives. The name of one was Hannah[a], and the name of the second was Peninnah. Peninnah had children, but Hannah had no children.
translation:
  language: zh_hans
  text: 他有两个妻子[a]，一个名叫哈拿，另一个名叫毗尼拿。毗尼拿有孩子，哈拿却没有孩子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文较直译：“对他来说，有两个妻子。”
    reason: 说明希伯来语领属结构；正文采用自然汉语“他有”。
lexical_decisions:
- source_word: וְלֹו
  choice: 他有
  rationale: 希伯来语用介词性领属结构，字面近于“对他有”；现代汉语自然表达为“他有”。句首连接词依上下文融入叙述，不机械译出。
- source_word: שְׁתֵּי נָשִׁים
  choice: 两个妻子
  rationale: 在婚姻家庭语境中，נָשִׁים 指“妻子”，而非泛指“女人”；译文保留原文明确呈现的一夫多妻家庭背景。
- source_word: שֵׁם אַחַת ... וְשֵׁם הַשֵּׁנִית
  choice: 一个名叫……另一个名叫……
  rationale: 以自然现代汉语表达原文平行的姓名介绍格式，同时保留两人依次被点名的结构。
- source_word: חַנָּה
  choice: 哈拿
  rationale: 采用现代中文圣经传统中通行的人名音译。
- source_word: פְּנִנָּה
  choice: 毗尼拿
  rationale: 采用现代中文圣经传统中通行的人名音译。
- source_word: וַיְהִי לִפְנִנָּה יְלָדִים
  choice: 毗尼拿有孩子
  rationale: 原文以存在—领属结构表达拥有；יְלָדִים 是不限定性别的广义“孩子”，不增译为“儿女”或“儿子和女儿”。
- source_word: וּלְחַנָּה אֵין יְלָדִים
  choice: 哈拿却没有孩子
  rationale: אֵין 表示不存在；“却”自然显明两位妻子境况的鲜明对照，而不改变原文命题内容。
