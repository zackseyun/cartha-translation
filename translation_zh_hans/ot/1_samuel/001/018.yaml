base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/018.yaml
  text: She said[a], “May your servant find favor in your eyes.” Then the woman went on her way and ate[b], and her face was no longer downcast.
translation:
  language: zh_hans
  text: 她说：“愿你的婢女在你眼前蒙恩。”于是那妇人走自己的路去了，也吃了东西；她的面容不再像先前那样[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文这里的表达较为省略，近于“她的脸不再像以前”；按上下文，是说她的神色不再显出先前的愁苦。
    reason: textual_or_lexical_ambiguity
lexical_decisions:
- source_word: תִּמְצָא
  choice: 愿……蒙
  rationale: 未完成式在这里用于恭敬的祝愿或请求；“愿……蒙”符合现代汉语的礼貌表达。
- source_word: שִׁפְחָתְךָ
  choice: 婢女
  rationale: 原词明确为阴性，哈拿用它谦称自己；“婢女”既保留性别和卑称意味，也适合此处较庄重的古代叙事语境。
- source_word: חֵן בְּעֵינֶיךָ
  choice: 在你眼前蒙恩
  rationale: 保留希伯来语“在某人眼中找到恩惠”的意象；“蒙恩”在现代中文中简洁、自然，表达得到善意看待。
- source_word: לְדַרְכָּהּ
  choice: 回去了
  rationale: 该短语表示离开并继续自己的路；结合哈拿当时所在的场景，“回去了”比逐字译作“往她的路去”自然。
- source_word: וַתֹּאכַל
  choice: 也吃了东西
  rationale: 动词是普通的“吃”；补出宾语“东西”符合现代汉语习惯，并与上文她因愁苦而不吃饭形成呼应。
- source_word: וּפָנֶיהָ לֹא הָיוּ לָהּ עוֹד
  choice: 她的神色不再像先前那样
  rationale: 马所拉文本的表达省略而不寻常，直译近于“她的脸对她不再有了”。译文以“神色”表达 פָּנִים 所指的面容和表情，同时用“像先前那样”保留原句未明说其神色具体如何的含蓄性。
theological_decisions:
- issue: 哈拿神色改变的具体含义
  choice: 正文不直接补入“忧愁”或“低沉”，而译作“不再像先前那样”
  alternative: “脸上不再带着愁容”或“面容不再忧愁”
  rationale: 上下文清楚暗示她已不再显出悲伤，但希伯来文本本身是省略式表达。正文保留这种含蓄，脚注说明上下文所指，避免把解释直接写成原文明确说出的内容。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“婢女”保留哈拿谦卑自称中的阴性和身份色彩；末句以较自然的省略式中文保留原文含蓄，并用脚注交代上下文含义。
