  text: וְ/הִ֖יא מָ֣רַת נָ֑פֶשׁ וַ/תִּתְפַּלֵּ֥ל עַל יְהוָ֖ה וּ/בָכֹ֥ה תִבְכֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/010.yaml
  text: And she was bitter in soul[b][a], and she prayed to Yahweh and wept bitterly.
translation:
  language: zh_hans
  text: 她心里愁苦[a]，向雅威祷告，不住地哭泣[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“灵魂苦涩”，是指内心深受痛苦。
    reason: lexical_alternative
  - marker: b
    text: 原文用加强语气的结构，直译为“哭了又哭”；也可译作“痛哭”或“哭得很厉害”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מָרַת נָפֶשׁ
  choice: 心里愁苦
  rationale: 希伯来语直译为“灵魂苦涩”，是表达内心极度痛苦的习语。“心里愁苦”既保留“苦”的意象，也符合现代汉语表达。
- source_word: וַתִּתְפַּלֵּל
  choice: 祷告
  rationale: 此处התפלל直接表示祷告；恳切的程度已由全句的愁苦和哭泣表达，不另加在动词中。
- source_word: עַל יְהוָה
  choice: 向雅威
  rationale: 介词עַל与“祷告”连用时，在此表示祷告所指向的对象；译作“向雅威”清楚自然。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译呈现四字神名，保留其作为以色列之上帝专名的性质，而不以称号代替。
- source_word: וּבָכֹה תִבְכֶּה
  choice: 不住地哭泣
  rationale: 原文以不定式绝对形加限定动词加强语气，字面近于“哭了又哭”。“不住地哭泣”自然地传达加强或持续的意味，同时以脚注保留其他理解。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。音译“雅威”保留专名，不以“主”这一称号替代；“耶和华”则反映较晚形成的传统读音。
- issue: 加强结构וּבָכֹה תִבְכֶּה的具体力度
  choice: 不住地哭泣
  alternative: 放声痛哭；哭得很厉害
  rationale: 该结构明确加强哭泣动作，但可侧重持续、程度或强调本身。正文采用自然且贴合语境的持续表达，脚注说明其开放性，不把特定情感色彩绝对化。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“心里愁苦”保留希伯来语的苦涩意象；“不住地哭泣”便于普通读者理解，并借脚注交代原文加强结构的多种可能侧重。
