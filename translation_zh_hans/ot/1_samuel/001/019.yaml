  text: וַ/יַּשְׁכִּ֣מוּ בַ/בֹּ֗קֶר וַ/יִּֽשְׁתַּחֲווּ֙ לִ/פְנֵ֣י יְהוָ֔ה וַ/יָּשֻׁ֛בוּ וַ/יָּבֹ֥אוּ אֶל בֵּיתָ֖/ם הָ/רָמָ֑תָ/ה וַ/יֵּ֤דַע אֶלְקָנָה֙ אֶת חַנָּ֣ה אִשְׁתּ֔/וֹ וַ/יִּֽזְכְּרֶ֖/הָ יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/019.yaml
  text: They rose early in the morning and bowed down before Yahweh[a]. Then they returned and came to their house at Ramah, and Elkanah knew Hannah his wife[b], and Yahweh remembered her.
translation:
  language: zh_hans
  text: 清早，他们起来，在雅威面前俯伏敬拜；随后返回，来到拉玛自己的家中。以利加拿与妻子哈拿同房[a]，雅威记念了她[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“认识妻子哈拿”，这是希伯来语中对夫妻性关系的委婉说法。
    reason: lexical_alternative
  - marker: b
    text: 这里的“记念”不只是从记忆中想起，往往还表示神眷顾某人，并采取实际行动。
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּשְׁכִּמוּ בַבֹּקֶר
  choice: 次日清早，他们起来
  rationale: שׁכם的使役词干在这里表示早起；结合בַבֹּקֶר译作“次日清早”，既保留时间重点，也符合现代汉语叙事习惯。“次日”由连续叙事语境自然引出。
- source_word: וַיִּשְׁתַּחֲווּ לִפְנֵי יְהוָה
  choice: 在雅威面前俯伏敬拜
  rationale: השתחוה具体指俯身或俯伏，也常表达敬拜。“俯伏敬拜”同时保留身体动作和宗教含义，避免只译“敬拜”而削弱原文的形象。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译“雅威”呈现四字神名，不用称号替代原文中的专名。
- source_word: וַיָּשֻׁבוּ וַיָּבֹאוּ אֶל־בֵּיתָם הָרָמָתָה
  choice: 随后返回拉玛，回到自己的家
  rationale: 原文连续使用“返回”和“来到”，并以方向形式标出拉玛。汉语调整地点与住所的次序，使行程清楚，同时保留两个动作层次。
- source_word: וַיֵּדַע אֶלְקָנָה אֶת־חַנָּה אִשְׁתּוֹ
  choice: 以利加拿与妻子哈拿同房
  rationale: ידע字面是“认识、知道”，在这里是夫妻性关系的委婉语。汉语“同房”保持庄重含蓄，又能让普通读者准确理解；脚注说明原文措辞。
- source_word: וַיִּזְכְּרֶהָ יְהוָה
  choice: 雅威记念了她
  rationale: 保留זכר的核心意象。“记念”在此不只是想起，而带有眷顾并将采取行动的含义；正文不提前说明下一节才显出的结果，脚注则提示其语义范围。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 主；耶和华
  rationale: 原文直接使用以色列之神的专名。音译为“雅威”保留专名性质，不以称号替代，也不把后期传统读法带入正文。
- issue: 是否在正文保留ידע的字面说法
  choice: 译作“同房”，并在脚注注明原文字面含义
  alternative: 以利加拿认识妻子哈拿
  rationale: 汉语“认识”不能自然承载希伯来语在此处的性关系委婉义，照字面翻译容易误解。“同房”保留委婉、庄重的语体，同时准确传达叙事含义。
- issue: 如何表达雅威“记念”哈拿
  choice: 保留“记念”这一原文意象
  alternative: 雅威眷顾她；雅威应允她
  rationale: “眷顾”可表达实际关怀，却弱化了זכר的原文意象；“应允”则提前明确了本节尚未明说的结果。“记念”配合脚注，可兼顾形式、神学张力与可理解性。
translation_notes:
  register: 采用现代、庄重而清楚的叙事汉语。“俯伏敬拜”保留原文的身体动作；“同房”承接原文的含蓄语体；“记念”保存希伯来叙事中的重要意象，并借脚注避免现代读者将其误解为单纯回想。标点将本节的行程与夫妻同房、神的记念分成两个清晰层次。
