base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/008.yaml
  text: Then Elkanah her husband said to her[a], “Hannah, why are you weeping? And why do you not eat? And why is your heart troubled? Am I not better to you than ten sons?”
translation:
  language: zh_hans
  text: 她丈夫以利加拿对她说：“哈拿，你为什么哭？为什么不吃饭？为什么心里难过？我对你来说，岂不比十个儿子更好吗？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 对她说
  rationale: 承接前文推进叙事；现代汉语无需机械译出连接词，也能自然表达事件顺序。
- source_word: אֶלְקָנָה אִישָׁהּ
  choice: 她丈夫以利加拿
  rationale: 明确保留人物姓名及其与哈拿的夫妻关系，语序符合现代汉语。
- source_word: לָמֶה
  choice: 为什么
  rationale: 原文连续三次使用同一疑问词，译文也保留三重反问的修辞效果。
- source_word: תִבְכִּי
  choice: 哭
  rationale: 结合语境指哈拿正在哭泣；汉语“为什么哭”自然且不增添额外意愿色彩。
- source_word: לֹא תֹאכְלִי
  choice: 不吃饭
  rationale: 表达她当下不进食的情形；“吃饭”比单说“吃”更符合现代汉语习惯。
- source_word: יֵרַע לְבָבֵךְ
  choice: 心里难过
  rationale: 该短语字面为“你的心为何不好”，在此是内心悲伤、愁苦的习语；“心里难过”保留心的意象并准确传达语境。
- source_word: הֲלוֹא
  choice: 不……吗
  rationale: 保留预期肯定回答的否定反问语气。
- source_word: טוֹב לָךְ מֵעֲשָׂרָה בָּנִים
  choice: 有我不比有十个儿子更好吗
  rationale: 以自然汉语表达比较关系，同时保留“十个儿子”的具体措辞和以利加拿带有安慰意味的自我比较。
theological_decisions:
- issue: בָּנִים 的性别特指
  choice: 儿子
  alternative: 孩子
  rationale: 原文明确使用阳性复数“儿子”，且这一措辞反映叙事所处文化中对后嗣的具体表达，不宜改为性别中性的“孩子”。
- issue: 以利加拿反问句的评价立场
  choice: 保留人物原话，不说明其判断是否正确
  alternative: 将其解释为充分或不充分的安慰
  rationale: 经文呈现以利加拿对自己的评价；译文不替叙述者判定这句话的神学或情感充分性。
translation_notes:
  register: 采用自然、庄重而口语可懂的现代标准汉语。保留连续三个“为什么”以及末尾否定反问的语气；不为清楚起见而添加原文没有的解释。
