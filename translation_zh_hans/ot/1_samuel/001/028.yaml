base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/028.yaml
  text: So I also have given him to Yahweh[a]; all the days that he lives[b], he is given to Yahweh.” And he worshiped Yahweh there.
translation:
  language: zh_hans
  text: “所以，我也把他交给雅威[a]；他一生都归雅威。”于是，他[b]就在那里敬拜雅威。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我也把他借给雅威。”原文在这里使用与本章前文“求”同一词根的词，形成“求得—借出（交出）”的呼应；在本处所表达的是把孩子献上、交托给雅威。
    reason: lexical_alternative
  - marker: b
    text: 或译：“他们就在那里敬拜雅威。”原文动词为单数，但“他”具体指谁并未明说；翻译传统中也有复数的理解。
    reason: alternative_reading
lexical_decisions:
- source_word: הִשְׁאִלְתִּהוּ
  choice: 把他交给
  rationale: 该词是שׁאל的使役形，与本章前文哈拿“求”孩子形成词语呼应；在本语境中指把孩子交托、献给雅威。“交给”自然地表达奉献之意，而“借给”虽更能保留同根呼应，在现代汉语中却容易使人误以为只是暂时出借，因此将该可能性收入脚注。
- source_word: לַיהוָה
  choice: 给／归雅威
  rationale: 介词表示对象或归属；随上下文分别译为“交给雅威”和“归雅威”。神名יהוה按音译作“雅威”。
- source_word: כָּל הַיָּמִים אֲשֶׁר הָיָה
  choice: 他一生
  rationale: 这是表达终身的希伯来语结构；“他一生”简洁、自然，并保留奉献持续一生的含义。
- source_word: שָׁאוּל
  choice: 归
  rationale: 此词与הִשְׁאִלְתִּהוּ同根，在句中表示孩子已交由雅威、属于雅威。汉语用“归”能清楚表达归属，但同根双关无法完整保留，故在脚注说明。
- source_word: וַיִּשְׁתַּחוּ
  choice: 他就……敬拜
  rationale: 动词形态为阳性单数，表示俯伏或敬拜；此处对象是雅威，译作“敬拜”最符合宗教语境。经文没有明说“他”具体指谁，因此不在正文中补明身份。
- source_word: שָׁם
  choice: 在那里
  rationale: 直接、自然地表达地点副词的意义。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；采用“雅威”以呈现这一盟约之名，而不以称号“主”替代。
- issue: וַיִּשְׁתַּחוּ的主语
  choice: 他就在那里敬拜雅威
  alternative: 他们就在那里敬拜雅威
  rationale: 马所拉文本的动词形态支持单数“他”，但代词所指并未明确，且翻译传统中也有复数理解；正文保留单数形式，不擅自指明是撒母耳、以利加拿或其他人，并在脚注列出复数译法。
- issue: 把撒母耳交给雅威的性质
  choice: 交给／归雅威
  alternative: 借给雅威
  rationale: 原文借助שׁאל词根延续“求得—交出”的修辞呼应。正文表达终身奉献和归属，不把它解释为暂时借用；脚注保留较贴近字面与双关的译法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“交给／归”兼顾自然表达与终身奉献的语境；原文难以在汉语正文中重现的שׁאל词根呼应，以及敬拜者主语的歧义，均以脚注保留。
