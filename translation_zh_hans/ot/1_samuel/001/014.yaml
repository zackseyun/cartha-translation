  text: And Eli said to her[b][a], “How long will you be drunk? Put away your wine from you.”
translation:
  language: zh_hans
  text: 以利对她说：“你还要醉到什么时候呢？[a] 把你的酒从你身上除去！”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “醉”也可译作“喝醉”或“处于醉酒状态”。希伯来语动词在这里既可理解为变得醉酒，也可理解为处于醉酒状态。
    reason: lexical_alternative
  - marker: b
    text: 直译：“把你的酒从你身上除去。”这句话可能指除去酒本身，也可能指摆脱酒的影响。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלֶיהָ עֵלִי
  choice: 以利对她说
  rationale: 按希伯来语叙事顺序直译；现代汉语通常无需另译句首连接词 וַ。
- source_word: עַד מָתַי
  choice: 还要……到什么时候呢
  rationale: 自然表达质问及持续意味，同时不把未完成体解释得过细。
- source_word: תִּשְׁתַּכָּרִין
  choice: 醉
  rationale: 该词可指进入醉酒状态，也可指处于醉酒状态；正文采用简洁而能涵盖两者的“醉”，并以脚注保留歧义。
- source_word: הָסִירִי
  choice: 除去
  rationale: 准确表达阴性单数命令式；用词庄重，也与后面的“从你身上”自然搭配。
- source_word: אֶת יֵינֵךְ מֵעָלָיִךְ
  choice: 把你的酒从你身上除去
  rationale: 保留“你的酒”和 מֵעָלַיִךְ 所含“从你身上／离开你”的意象，不擅自限定为倒掉酒或摆脱酒力。
