revisions:
- from: 不要把婢女看作无耻的女人[a]；我是因愁苦深重、烦恼不已，才一直说到现在。[b]
  to: 不要把你的婢女看作卑劣的女人[a]；因为我满心愁苦和烦恼[b]，才说到如今。
  rationale: 修订补出“你的”以反映原文人称后缀，调整因果句为自然的现代汉语，并以“满心”表达מֵרֹב所指的丰富、满溢。以“卑劣的女人”保留בַּת־בְּלִיַּעַל的广义道德贬义；脚注说明其字面习语，未将Belial人格化。
