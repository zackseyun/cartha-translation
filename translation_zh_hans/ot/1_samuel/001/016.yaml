  text: אַל תִּתֵּן֙ אֶת אֲמָ֣תְ/ךָ֔ לִ/פְנֵ֖י בַּת בְּלִיָּ֑עַל כִּֽי מֵ/רֹ֥ב שִׂיחִ֛/י וְ/כַעְסִ֖/י דִּבַּ֥רְתִּי עַד הֵֽנָּה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/016.yaml
  text: Do not regard your servant as a worthless woman[b][a], for out of the abundance of my complaint and my vexation I have spoken until now.
translation:
  language: zh_hans
  text: 不要把你的婢女看作卑劣的女人[a]；因为我满心愁苦和烦恼[b]，才说到如今。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“卑劣之女”，是指品行卑劣或不名誉的女人的习语。
    reason: lexical_alternative
  - marker: b
    text: 或译：“因为我有许多愁苦和烦恼，才说到如今。”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּתֵּן ... לִפְנֵי
  choice: 不要把……看作
  rationale: 这里的 נתן 与 לִפְנֵי 构成语境性表达，意思是将某人视为或当作某种人，而非字面的“放在……面前”。
- source_word: אֲמָתְךָ
  choice: 婢女
  rationale: 这是女性说话者谦卑的自称，明确带有阴性，并符合哈拿对祭司以利说话时的语体。
- source_word: בַּת בְּלִיָּעַל
  choice: 无耻的女人
  rationale: 该习语直译为“卑劣之女／无用之女”，在此指品行卑劣、不名誉的女人；“无耻的女人”自然传达其道德贬义，又避免让“毫无价值”听来像对人的本体价值判断。
- source_word: מֵרֹב
  choice: 因……深重、……不已
  rationale: 表达程度之大并兼具原因意味；汉语用“因”自然引出哈拿持续倾诉的缘由。
- source_word: שִׂיחִי
  choice: 愁苦
  rationale: שִׂיחַ 可指默想、倾诉或苦情；此处是哈拿在痛苦中向神祷告，“愁苦”保留内在痛楚，也不把它过度限定为埋怨。
- source_word: וְכַעְסִי
  choice: 烦恼不已
  rationale: כַּעַס 在此指由处境引起的烦忧、苦恼或激愤，并非必然指有罪的怒气；此译突出持续的内心困扰。
- source_word: דִּבַּרְתִּי עַד הֵנָּה
  choice: 才一直说到现在
  rationale: עַד הֵנָּה 在此表示时间上的“直到现在”；“一直说到现在”体现此前持续至当下的言说。
theological_decisions:
- issue: בְּלִיָּעַל 是否作专名理解
  choice: 按描述品行的普通名词习语处理，译作“无耻的女人”
  alternative: 译作“彼列之女”或“属彼列的女人”
  rationale: 在撒母耳记上这一语境和希伯来圣经较早用法中，בְּלִיָּעַל 表示卑劣、邪恶或无用，并无充分依据在此人格化为专名。
translation_notes:
  register: 采用现代、庄重而自然的普通话。“婢女”保留哈拿女性仆人的谦卑自称；分号呈现请求与解释之间的关系。主文没有机械保留希伯来习语，但脚注交代其字面形式；同时保留 שִׂיחַ 和 כַּעַס 在本句中可指愁苦、倾诉、烦恼等相邻语义的张力。
