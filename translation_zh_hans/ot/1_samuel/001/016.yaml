review_pass:
  verdict: revise
  source_fidelity: 草稿基本正确把握了“不要把……看作”的语境义、哈拿以女性仆人身份的谦称，以及“直到如今”的时间范围。但“婢女”前缺少对应第二人称后缀的“你的”；“愁苦深重、烦恼不已”虽可理解，却较松散地处理了“出于/由于我大量的诉苦（或愁思）和烦恼”这一结构。
  naturalness: “我是因……才一直说到现在”在现代汉语中略显生硬。“因为我满心愁苦和烦恼，才说到如今”更自然、庄重，也保留解释前句的语气。
  terminology: “你的婢女”适合保留阿玛（אמה）作为哈拿谦卑自称的女性色彩。“卑劣的女人”比“无耻的女人”更贴近“卑劣之女”这一习语所涵盖的道德败坏／不名誉之意，而不将含义窄化为单指不知羞耻。
  issues:
  - severity: medium
    issue: “婢女”遗漏“你的”
    rationale: אֲמָתְךָ含第二人称单数后缀，哈拿是在对以利说“你的婢女”。中文应明确这一谦称关系。
  - severity: low
    issue: 因果句式和“丰富/众多”的表达可更贴近原文
    rationale: “我是因愁苦深重、烦恼不已”不如以“因为我满心愁苦和烦恼”自然地对应מֵרֹב（由于大量、满溢的）及后续解释。
  - severity: low
    issue: 脚注b的锚点应贴近其所说明的程度表达
    rationale: 将[b]置于“满心愁苦和烦恼”后，比置于全句句末更清楚地标示其对应的词语范围。
  revised_text: 不要把你的婢女看作卑劣的女人[a]；因为我满心愁苦和烦恼[b]，才说到如今。
