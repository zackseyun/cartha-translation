  text: וְ/חַנָּ֗ה הִ֚יא מְדַבֶּ֣רֶת עַל לִבָּ֔/הּ רַ֚ק שְׂפָתֶ֣י/הָ נָּע֔וֹת וְ/קוֹלָ֖/הּ לֹ֣א יִשָּׁמֵ֑עַ וַ/יַּחְשְׁבֶ֥/הָ עֵלִ֖י לְ/שִׁכֹּרָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/013.yaml
  text: Hannah was speaking in her heart; only her lips were moving[a], but her voice was not heard. So Eli thought she was drunk.
translation:
  language: zh_hans
  text: 哈拿在心里说话；只有嘴唇在动[a]，却听不见她的声音。因此，以利以为她喝醉了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“是在自言自语”或“是在心里祷告”。希伯来文直译为“在她心上说话”。
    reason: 说明希伯来语表达既可保留其字面意象，也可按上下文理解为无声的内在言语或祷告。
lexical_decisions:
- source_word: מְדַבֶּרֶת עַל לִבָּהּ
  choice: 在心里说话
  rationale: 直译希伯来语意象，同时按上下文表达未出声的内在言语；不直接译作“祷告”，以免把语词本身没有明说的信息写入正文。
- source_word: רַק
  choice: 只有
  rationale: 表示限制，突出外在仅能看见嘴唇活动。
- source_word: שְׂפָתֶיהָ נָּעוֹת
  choice: 嘴唇在动
  rationale: נוּעַ在此表示移动；进行状态的表达与希伯来语分词相称，也自然地与下句听不见声音形成对照。
- source_word: וְקוֹלָהּ לֹא יִשָּׁמֵעַ
  choice: 却听不见她的声音
  rationale: 尼法勒形式表达声音未被听见、不可闻；“却”自然呈现嘴唇活动与声音不可闻之间的对比。
- source_word: וַיַּחְשְׁבֶהָ
  choice: 以为她……
  rationale: חשב加宾语后缀及述语表示把某人看作某种状态；“以为”符合现代汉语叙事表达。
- source_word: לְשִׁכֹּרָה
  choice: 喝醉了
  rationale: 该阴性形容词表示醉酒状态；汉语用“喝醉了”比“是个醉酒的女人”自然。
- source_word: וְחַנָּה הִיא
  choice: 哈拿
  rationale: 代词הִיא具有强调或话题标示作用；汉语直接以姓名作主语即可自然承接语境，无须增添“现在”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而通顺的叙事语言。“在心里说话”保留原文意象及其一定程度的含混性；分号和“却”清楚呈现可见的唇动与不可闻的声音之间的对照。
