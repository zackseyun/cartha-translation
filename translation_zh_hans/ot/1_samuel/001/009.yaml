base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/009.yaml
  text: After they had eaten in Shiloh[a], and after they had drunk, Hannah rose. Now Eli the priest was sitting on the seat by the doorpost of the temple of Yahweh.
translation:
  language: zh_hans
  text: 哈拿在示罗吃喝完以后，就起身了。祭司以利当时正坐在雅威殿的门柱旁的座位上。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתָּקָם
  choice: 就起身
  rationale: קום的Qal叙事形式表示起身并开始行动；“起身”简洁自然，也保留叙事推进感。
- source_word: אַחֲרֵי אָכְלָה בְשִׁלֹה וְאַחֲרֵי שָׁתֹה
  choice: 在示罗吃喝完以后
  rationale: 两个平行的时间短语合并为自然的现代汉语表达。原文所指的进食、饮用主体并不完全明确，因此汉语采用省略主语的说法，不明确限定为哈拿或全家人。
- source_word: וְעֵלִי הַכֹּהֵן
  choice: 祭司以利当时
  rationale: וְ在这里引入场景背景，而非单纯表示下一事件；“当时”自然地体现其背景说明功能。
- source_word: יֹשֵׁב
  choice: 正坐
  rationale: 分词描写以利当时持续的姿态；“正坐”保留进行中的背景状态。
- source_word: עַל הַכִּסֵּא
  choice: 在……座位上
  rationale: כִּסֵּא可指座位、椅子或宝座；此处用中性的“座位”，避免加入王权含义。
- source_word: עַל מְזוּזַת
  choice: 门柱旁
  rationale: מְזוּזָה指门柱；此处עַל表达位置关系，译作“旁”比字面的“在……上”更符合汉语和场景。
- source_word: הֵיכַל יְהוָה
  choice: 雅威殿
  rationale: הֵיכָל可指殿或圣所。“殿”在汉语中庄重而简洁，同时脚注保留“圣所”这一语境上可能的译法。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以常见的现代汉语音译呈现四字神名，保留其专名性质，不以称号替代。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 采用较贴近学界重建读音的现代汉语音译，明确其为以色列之神的专名，不额外加入神学解释。
- issue: 示罗建筑הֵיכַל的译法
  choice: 殿
  alternative: 圣所
  rationale: “殿”直接对应הֵיכַל的一般含义；鉴于此处是所罗门圣殿建成以前的示罗敬拜场所，脚注保留“圣所”，避免读者误以为专指后来耶路撒冷的圣殿。
- issue: 吃喝动作的主体
  choice: 省略主语
  alternative: 他们吃喝完以后／哈拿吃喝完以后
  rationale: 原文形式及上下文容许不同理解；汉语无主语表达既自然，又不把集体或单数解读写死。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“当时正坐”清楚区分背景状态与哈拿起身这一前景动作；句式简洁，不用古奥宗教术语。
