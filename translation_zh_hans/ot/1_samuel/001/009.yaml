  source_fidelity: 时间短语中的形式带有阴性单数后缀，按马所拉文本最直接是指哈拿：她吃过、喝过以后。草稿以无主语的“吃喝完以后”刻意保留歧义，但因此没有表达原文所标示的指向；英语审计轨迹的集体理解不应凌驾于希伯来文本。其余地点、以利的背景性坐姿、门柱和神名的处理均忠实。
  naturalness: 修改为“哈拿在示罗吃喝完以后，就起身了”自然、清楚，且保持现代庄重的叙事语体。“雅威殿的门柱旁”比无“的”的紧缩结构更易读，并明确门柱所属。
  terminology: “雅威”准确呈现四字神名；“殿”可保留，脚注提供“圣所”的可行替代，避免将示罗场所不必要地等同于后来的耶路撒冷圣殿。
