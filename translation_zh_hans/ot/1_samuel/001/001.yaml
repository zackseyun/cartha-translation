base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/001.yaml
  text: There was a certain man from Ramathaim-zophim[a], from the hill country of Ephraim, and his name was Elkanah son of Jeroham, son of Elihu, son of Tohu, son of Zuph, an Ephraimite.
translation:
  language: zh_hans
  text: 以法莲山区的拉玛琐非有一个人，名叫以利加拿。他是耶罗罕的儿子，耶罗罕是以利户的儿子，以利户是托户的儿子，托户是苏弗的儿子。以利加拿是以法他人[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“以法莲人”。希伯来原文是“以法他人”，这里可能是与以法莲地区有关的地域称谓。
    reason: 保留族属或地域称谓的另一种可能理解。
lexical_decisions:
- source_word: וַיְהִי
  choice: 有一个人
  rationale: 这是以“有”动词开启叙事的常见结构；现代汉语无需另加原文没有的“现在”，可自然译作“有一个人”。
- source_word: אִישׁ אֶחָד
  choice: 一个人
  rationale: 这里引入一位随后才具名的人物。“一个人”在现代汉语叙事中自然表达其特指但初次出现的功能。
- source_word: מִן הָרָמָתַיִם צוֹפִים
  choice: 拉玛琐非
  rationale: 按复合地名处理并音译，不把地名内部成分解释性展开。
- source_word: מֵהַר אֶפְרָיִם
  choice: 以法莲山区
  rationale: 此处 הַר 指一个山地地区，而非单独一座山；“山区”符合地理语境和现代汉语表达。
- source_word: וּשְׁמוֹ
  choice: 名叫
  rationale: 简洁自然地表达“他的名字是”，不改变其介绍人物姓名的功能。
- source_word: אֶלְקָנָה
  choice: 以利加拿
  rationale: 人名采用通行的中文圣经音译。
- source_word: בֶּן ... בֶּן ... בֶּן ... בֶן
  choice: ……的儿子
  rationale: 逐层保留谱系中的“儿子”关系；虽然古代谱系有时会省略世代，本节没有充分依据改译为较宽泛的“后代”。
- source_word: אֶפְרָתִי
  choice: 以法他人
  rationale: 按希伯来词的形式保留“以法他人”，不因前文提到以法莲山区而直接改成“以法莲人”；语境中的另一种理解以脚注说明。
theological_decisions:
- issue: אֶפְרָתִי 的族属或地域含义
  choice: 以法他人
  alternative: 以法莲人
  rationale: 该词的字面形式指向“以法他人”，但在本节语境中也可能是与以法莲地区相关的地域称谓。正文保留原词形式，脚注呈现另一可能，避免无声消除歧义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。将地理信息前置为“以法莲山区的拉玛琐非”，符合汉语表达；谱系则逐层明说父子关系，避免连续多个“……之子”造成理解困难。
