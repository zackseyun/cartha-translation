base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/012.yaml
  text: And as she continued praying before Yahweh[a], Eli was watching her mouth.
translation:
  language: zh_hans
  text: 当她在雅威面前不断祷告时[a]，以利正留意着她的嘴。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较形式化地译作：“事情是这样：当她在雅威面前不断祷告时，以利正留意着她的嘴。”
    reason: 保留 וְהָיָה כִּי 这一希伯来叙事结构较为形式化的译法。
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: ……时
  rationale: 这是希伯来叙事中引出后续动作发生背景的表达。现代汉语用时间从句自然传达其功能；较形式化的“事情是这样：当……”收入脚注。
- source_word: הִרְבְּתָה לְהִתְפַּלֵּל
  choice: 长久祷告
  rationale: הִרְבְּתָה 是 רבה 的使役式，在这里与不定式连用，表示持续或延长祷告。“长久祷告”既保留时间延续之意，又符合庄重、自然的现代汉语。
- source_word: לִפְנֵי יְהוָה
  choice: 在雅威面前
  rationale: לִפְנֵי 表示在某位面前或临在中；这里指向神祷告。“在……面前”保留原文空间性和敬拜语境。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以“雅威”音译四字神名，区别于作为称号的“主”，保留原文所用的专名。
- source_word: שֹׁמֵר
  choice: 一直注视着
  rationale: 主动分词表达持续进行的观察。“一直注视着”既体现动作的延续，也符合上下文中以利留意哈拿祷告方式的情景。
- source_word: אֶת פִּיהָ
  choice: 她的嘴
  rationale: פֶּה 的本义是“嘴”。下一节另明确提到她的嘴唇，因此本节不提前改译为“嘴唇”。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。音译为“雅威”可保留其作为专名的性质，而不把它改成称号；“耶和华”是汉语传统形式，“上主”则遮蔽了专名。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“长久祷告”保留原文所强调的持续时间；“嘴”严格对应原词，并避免与下一节的“嘴唇”混同。
