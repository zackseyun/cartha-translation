base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/007.yaml
  text: 'And so it happened year after year: whenever she went up to the house of Yahweh[a], Peninnah would provoke her[b], and she would weep and not eat.'
translation:
  language: zh_hans
  text: 以利加拿年年都这样做[a]：每逢哈拿上到雅威的殿去[b]，毗尼拿就这样激怒她；哈拿便哭泣，不吃饭。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“事情年年都是这样”。希伯来语动词直译为“他会这样做”，为阳性单数，通常理解为指以利加拿；但这句话也可能是在概括年复一年的整个情形。
    reason: 保留动词主语及句法功能的真实歧义。
  - marker: b
    text: 原文介词直译为“在、于”。它与“上去”连用时，可按语境表达为前往雅威的殿；也可理解为强调在雅威的殿中发生的情形。
    reason: 说明介词ב在地点与目的地之间的译法差异。
lexical_decisions:
- source_word: וְכֵן יַעֲשֶׂה
  choice: 他……都这样做
  rationale: יַעֲשֶׂה在形态上是阳性单数，最自然的显性主语是上文的以利加拿；“这样做”也保留כֵן的回指作用。另有将整句理解为对反复情形的概括，故以脚注说明。
- source_word: שָׁנָה בְשָׁנָה
  choice: 年年
  rationale: 简洁自然地表达希伯来语分配式结构所强调的逐年反复。
- source_word: מִדֵּי עֲלֹתָהּ
  choice: 每逢哈拿上
  rationale: מִדֵּי加不定词表达“每逢、每当”；阴性单数后缀按上下文指哈拿。正文补出名字，避免连续女性代词在中文中造成混淆。
- source_word: בְּבֵית יְהוָה
  choice: 上雅威的殿
  rationale: 在表示上行的动词后，将ב按语境表达为目的地，符合现代汉语；其较字面的“在雅威殿里”以脚注保留。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译直接呈现四字神名，不改用称号“主”。
- source_word: כֵּן תַּכְעִסֶנָּה
  choice: 毗尼拿就这样惹她生气
  rationale: 第二个כֵן承接反复发生的模式；כעס的使役式表示使人生气、受恼怒。按上下文补出毗尼拿，宾语仍以“她”指哈拿。
- source_word: וַתִּבְכֶּה וְלֹא תֹאכַל
  choice: 哈拿便哭泣，不肯吃饭
  rationale: 在逐年反复的框架中，两个动词描述惯常结果；“不肯吃饭”自然表达因悲伤而不进食，并补出哈拿以保持指代清楚。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。音译“雅威”保留其专名性质，既不以称号替代，也不在本节中加入额外神学解释。
- issue: יַעֲשֶׂה的主语
  choice: 以利加拿（正文用“他”）
  alternative: 无特定人称的概括：“事情年年都是这样”
  rationale: 动词明确为阳性单数，承接上文以利加拿较为直接；但希伯来语也可能惯用地概括整个反复发生的情形，因此脚注保留这一理解。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。为避免三个女性角色相关代词在中文中混淆，按上下文补出“哈拿”和“毗尼拿”；不增添原文没有的动机或评价。
