  text: וַ/יַּ֧עַן עֵלִ֛י וַ/יֹּ֖אמֶר לְכִ֣י לְ/שָׁל֑וֹם וֵ/אלֹהֵ֣י יִשְׂרָאֵ֗ל יִתֵּן֙ אֶת שֵׁ֣לָתֵ֔/ךְ אֲשֶׁ֥ר שָׁאַ֖לְתְּ מֵ/עִמּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/017.yaml
  text: Then Eli answered and said[a], “Go in peace, and may the God of Israel grant your petition that you have asked from him.”
translation:
  language: zh_hans
  text: 以利回答说：“你平安地去吧；愿以色列的上帝把你向他所求的赐给你[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “你向他所求的”也可译作“你的请求”。原文此词可指请求本身，也可指所求之物。
    reason: 说明שֵׁלָתֵךְ在“请求”与“所求之物”之间的词义幅度，同时不将“赐给”改释为“应允”。
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: 回答说
  rationale: 两个连续的叙事动词分别表示“回应”和“说”；“回答说”既保留原文结构，也符合现代汉语叙事习惯。
- source_word: לְכִי לְשָׁלוֹם
  choice: 你平安地去吧
  rationale: 这是对哈拿使用的阴性单数命令式及祝福用语；译文自然表达离去时蒙平安的祝愿。
- source_word: וֵאלֹהֵי יִשְׂרָאֵל
  choice: 以色列的上帝
  rationale: 忠实表达该限定性构造短语，指以色列所敬拜的上帝。
- source_word: יִתֵּן
  choice: 愿……赐给你
  rationale: 动词本义为“给、赐予”；在祝愿语境中用“愿”表达其祈愿语气，并补出汉语所需的受益者“你”。
- source_word: שֵׁלָתֵךְ
  choice: 你……所求的
  rationale: 该词既可指“请求”，也可指“所求之物”；正文采用“所求的”，在现代汉语中自然，并保留后者的具体含义。
- source_word: אֲשֶׁר שָׁאַלְתְּ מֵעִמּוֹ
  choice: 你向他所求的
  rationale: 保留关系从句和第三人称代词；“向……求”准确表达请求的对象。
theological_decisions:
- issue: מֵעִמּוֹ中第三人称代词的所指
  choice: 保留“他”，由上下文指向以色列的上帝
  alternative: 直接译作“向上帝所求的”
  rationale: 原文使用代词；上下文已清楚表明哈拿向上帝祈求，因此保留代词既忠实，也不造成实质歧义。
- issue: 以利的话是祝愿还是确定的应许
  choice: 译作“愿……赐给你”，表达祝愿
  alternative: 译作“上帝必赐给你”
  rationale: 此处יִתֵּן在祝福公式中适宜理解为祈愿语气；不把以利的话强化为无条件的预言或保证。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“你平安地去吧”保留希伯来语祝福公式；正文避免生硬的名词化表达，并通过脚注说明关键词的词义范围。
