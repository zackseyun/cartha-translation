  text: וַֽ/יִּשְׁחֲט֖וּ אֶת הַ/פָּ֑ר וַ/יָּבִ֥יאוּ אֶת הַ/נַּ֖עַר אֶל עֵלִֽי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/025.yaml
  text: Then they slaughtered the bull and brought the boy to Eli[a][b].
translation:
  language: zh_hans
  text: 随后，他们宰杀[a]了那头公牛，又把孩子[b]带到以利那里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“杀”。希伯来语动词也可作较笼统的表达，但“宰杀”更能体现这里献祭的语境。
    reason: lexical_alternative
  - marker: b
    text: 或译“男孩”。希伯来语 נַעַר 可按语境指孩子、男孩或青年。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁחֲטוּ
  choice: 随后，他们宰杀了
  rationale: 连续式叙事动词推进事件次序；“随后”符合现代汉语叙事习惯。“宰杀”既准确表达杀牲畜，也保留本段献祭语境的意味。
- source_word: הַפָּר
  choice: 那头公牛
  rationale: פַּר常指公牛，尤其用于献祭语境；量词“头”使现代汉语自然，指示词“那”承接上文已提及的祭牲。
- source_word: וַיָּבִיאוּ
  choice: 又把……带到
  rationale: 该连续式动词延续叙事；“又”自然连接前后两个动作，“把”字句清楚表达他们将孩子带到以利那里。
- source_word: הַנַּעַר
  choice: 孩子
  rationale: נַעַר可指孩子、男孩或青年；本处撒母耳年纪尚幼，“孩子”最符合语境，同时不过度限定原词较宽的年龄范围。
- source_word: אֶל עֵלִי
  choice: 到以利那里
  rationale: אֶל表示朝向某人或某处的移动；“到以利那里”是自然、明确的现代汉语表达。
theological_decisions:
- issue: 宰杀动作的献祭意味
  choice: 译作“宰杀”，保留献祭语境中的礼仪意味，但不增添原文没有明说的解释。
  alternative: 较笼统地译作“杀了”。
  rationale: 上下文发生在示罗的敬拜和献祭场景中；“宰杀”既是该希伯来动词的直接对应，也能自然呈现这一语境。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“随后……又……”清楚呈现希伯来叙事动词的先后推进；“孩子”贴合撒母耳尚幼的语境，并通过脚注保留 נַעַר 的词义范围。
