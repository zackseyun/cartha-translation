  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/עָלָה֩ הָ/אִ֨ישׁ הַ/ה֤וּא מֵֽ/עִיר/וֹ֙ מִ/יָּמִ֣ים יָמִ֔ימָ/ה לְ/הִֽשְׁתַּחֲוֺ֧ת וְ/לִ/זְבֹּ֛חַ לַ/יהוָ֥ה צְבָא֖וֹת בְּ/שִׁלֹ֑ה וְ/שָׁ֞ם שְׁנֵ֣י בְנֵֽי עֵלִ֗י חָפְנִי֙ וּ/פִ֣נְחָ֔ס כֹּהֲנִ֖ים לַ/יהוָֽה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/003.yaml
  text: That man used to go up from his city year after year to worship and to sacrifice to Yahweh of Armies at Shiloh. And the two sons of Eli[a], Hophni and Phinehas, were there as priests of Yahweh.
translation:
  language: zh_hans
  text: 那人年年从自己的城上到示罗，敬拜万军之耶和华[a]，向他献祭。以利的两个儿子何弗尼和非尼哈在那里作耶和华的祭司。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “耶和华”对应希伯来文神名יהוה（YHWH），其读音通常重构为“雅威”。“万军之耶和华”也可译作“雅威·万军之主”。
    reason: 说明神名及复合称号的可选译法，同时保留原文神名与“众军”意象。
lexical_decisions:
- source_word: וְעָלָה
  choice: 年年……上到
  rationale: 此处形式在叙事中表达过去惯常发生的行动；与“年年”结合，自然传达定期上行朝圣之意。
- source_word: הָאִישׁ הַהוּא
  choice: 那人
  rationale: 保留指示语的回指作用，指向上文已经介绍的以利加拿。
- source_word: מֵעִירוֹ
  choice: 从本城
  rationale: עִיר可指城或城镇；“本城”简洁表达“他所在的城”，又不额外指定规模。
- source_word: מִיָּמִים יָמִימָה
  choice: 年年
  rationale: 这是表示逐年定期重复的习语；“年年”符合现代汉语，并保留反复发生的含义。
- source_word: לְהִשְׁתַּחֲוֺת
  choice: 敬拜
  rationale: 该词本义涉及俯伏，在此祭祀语境中指向神敬拜；译作“敬拜”自然且准确。
- source_word: וְלִזְבֹּחַ
  choice: 向他献祭
  rationale: 表达献上祭物的宗教行动；补出“向他”使汉语关系清楚，其所指承接耶和华。
- source_word: לַיהוָה צְבָאוֹת
  choice: 万军之耶和华
  rationale: 采用现代中文圣经读者熟悉、同时贴近“军队／众军”词义的称号；不把צְבָאוֹת解释性改译为“全能者”。
- source_word: בְּשִׁלֹה
  choice: 到示罗
  rationale: 示罗是朝圣目的地；与“上”搭配译为“上到示罗”，符合自然汉语。
- source_word: וְשָׁם
  choice: 在那里
  rationale: 保留原文地点衔接，明确以利的儿子在示罗任职。
- source_word: שְׁנֵי בְנֵי עֵלִי
  choice: 以利的两个儿子
  rationale: 自然呈现亲属关系，并保留“两人”这一数量信息。
- source_word: חָפְנִי וּפִנְחָס
  choice: 何弗尼和非尼哈
  rationale: 采用中文圣经传统中通行的人名音译，便于辨识。
- source_word: כֹּהֲנִים לַיהוָה
  choice: 作耶和华的祭司
  rationale: 直译其职分及服事对象，不增添对两人品格或职务性质的判断。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 中文正文采用广为人知的专名“耶和华”，让普通读者可直接辨识这是盟约神名，而非以“主”代称；脚注注明较接近学界重构读音的“雅威”，保留相关信息。
- issue: 称号יהוה צבאות的译法
  choice: 万军之耶和华
  alternative: 万军之雅威；耶和华·众军之主
  rationale: “万军”保留צְבָאוֹת所指的众军／军队意象，也保持中文庄重自然；不将其解释为抽象属性“全能”。
- issue: 祭司与耶和华的关系
  choice: 耶和华的祭司
  alternative: 给耶和华作祭司；侍奉耶和华的祭司
  rationale: 保留לַיהוָה较宽泛的关系表达，不在本节中额外判定是归属、受任还是具体侍奉活动。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“年年……上到”体现惯常朝圣；“敬拜……献祭”保持两个目的动作并列。人名使用中文圣经中较通行的形式。
