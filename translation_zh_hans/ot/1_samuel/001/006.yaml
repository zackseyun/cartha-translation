  text: וְ/כִֽעֲסַ֤תָּ/ה צָֽרָתָ/הּ֙ גַּם כַּ֔עַס בַּ/עֲב֖וּר הַרְּעִמָ֑/הּ כִּֽי סָגַ֥ר יְהוָ֖ה בְּעַ֥ד רַחְמָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/006.yaml
  text: And her rival would provoke her bitterly in order to irritate her[a], because Yahweh had closed her womb.
translation:
  language: zh_hans
  text: 她的对头[a]不断地激怒她，要使她苦恼，因为雅威关闭了她的子宫。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “对头”也可译作“同一丈夫的另一位妻子”；原词在这里指家庭中与哈拿处于竞争关系的另一位妻子。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִעֲסַתָּה
  choice: 总是……刺激她
  rationale: כעס的皮勒式在这里表示使人恼怒、受刺激；结合上下文，动作用“总是”表达反复、惯常发生。
- source_word: צָרָתָהּ
  choice: 她的对头
  rationale: צָרָה在此指与哈拿处于竞争关系的毗尼拿，即同夫之妻；“对头”既自然，也保留敌对意味。
- source_word: גַּם כַּעַס
  choice: 狠狠地
  rationale: 该组合加强挑衅的程度；用“狠狠地”传达希伯来语的强调，同时避免生硬重复“以恼怒使她恼怒”。
- source_word: בַּעֲבוּר הַרְּעִמָהּ
  choice: 存心使她苦恼
  rationale: בַּעֲבוּר表示目的；罕见动词רעם的使役形式在这里指使人烦乱、苦恼。“存心”自然表达有意为之。
- source_word: כִּי
  choice: 因为
  rationale: 引出毗尼拿得以借题刺激哈拿的原因。
- source_word: סָגַר ... בְּעַד רַחְמָהּ
  choice: 使她不能生育
  rationale: 字面为“关闭她的子宫”，是不能受孕的希伯来语表达；中文用“使她不能生育”自然传达其意义。
- source_word: יְהוָה
  choice: 雅威
  rationale: 直接音译四字神名，保留经文所用的上帝专名，而不以称号替代。
theological_decisions:
- issue: 四字神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用神名；“雅威”较贴近其通常重构的读音，并与将其替换为称号的做法有别。
- issue: 上帝与哈拿不育之间的因果关系
  choice: 雅威使她不能生育
  alternative: 雅威关闭了她的子宫
  rationale: 保留原文明确归于雅威的因果关系，不将其弱化为许可或单纯处境；同时以自然中文表达该希伯来习语。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“总是”体现惯常动作；“狠狠地刺激……存心使……苦恼”保留原文两个相关但不完全相同的动词及其强烈语气。脚注标记置于相关分句末，脚注说明实际针对前文“对头”一词。
