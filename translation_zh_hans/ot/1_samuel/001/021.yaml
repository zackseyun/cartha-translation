base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/021.yaml
  text: Then the man Elkanah went up with all his household to sacrifice to Yahweh the yearly sacrifice and his vow[a].
translation:
  language: zh_hans
  text: 以利加拿带着全家上去，向雅威献一年一度的祭，并履行他所许的愿[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“和他的愿”。原文将此语与前面的“献祭”并列，未明说相应的动作；可理解为履行所许的愿，也可理解为献上与该誓愿有关的祭物。
    reason: 说明原文的省略和并列结构，并保留其在具体动作上的解释空间。
lexical_decisions:
- source_word: וַיַּעַל
  choice: 上去
  rationale: עלה在前往示罗圣所朝拜的语境中表示“上去”，既保留朝圣用语，也符合地理意味。
- source_word: הָאִישׁ אֶלְקָנָה
  choice: 那人以利加拿
  rationale: אִישׁ本义为“人、男人”；此处以同位语点明以利加拿，不必解释为“丈夫”。
- source_word: וְכָל בֵּיתוֹ
  choice: 带着全家
  rationale: בַּיִת在这里指家中成员，即全家，而非房屋；“带着”自然表达以利加拿与全家一同前往的关系。
- source_word: לִזְבֹּחַ לַיהוָה
  choice: 向雅威献……祭
  rationale: זבח在礼仪语境中指献祭；לַיהוָה表明祭献给雅威。
- source_word: זֶבַח הַיָּמִים
  choice: 一年一度的祭
  rationale: 字面为“日子的祭”，在上下文中指按年举行的固定献祭；此译清楚表达周期性。
- source_word: וְאֶת־נִדְרוֹ
  choice: 并还他所许的愿
  rationale: 希伯来文只并列“他的愿”这一宾语，动作需由语境补足；汉语“还所许的愿”自然表达履行誓愿，同时用脚注保留原文省略结构。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华／主
  rationale: 原文直接使用四字神名；采用“雅威”作为其较直接的音译，避免以称号代替专名。
- issue: וְאֶת־נִדְרוֹ中省略动作的理解
  choice: 还他所许的愿
  alternative: 和他的愿
  rationale: 原文的宾格标记使“他的愿”与前面的祭物并列，但汉语若直译会造成“献愿”的误解；正文补出履行誓愿之意，脚注说明原文形式，不进一步断定履行方式。
translation_notes:
  register: 采用现代、庄重而通顺的叙事语体。“一年一度”比逐字的“日子的”更符合现代汉语；“还愿”是普通读者熟悉的表达，并由脚注交代希伯来文更简略的形式。
