base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/015.yaml
  text: But Hannah answered and said[a], “No, my lord. I am a woman troubled in spirit. I have drunk neither wine nor strong drink[b], but I have poured out my soul before Yahweh.”
translation:
  language: zh_hans
  text: 哈拿回答说：“不，我主！我是个心灵愁苦的妇人。我没有喝葡萄酒，也没有喝浓酒[a]；而是把我的心倾倒在雅威面前[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “浓酒”指葡萄酒以外能使人醉的饮料，不一定是现代意义的蒸馏烈酒。
    reason: lexical_clarification
  - marker: b
    text: “我的心”原文直译“我的魂”或“我的性命”；此处指人的内心、自我。
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא אֲדֹנִי
  choice: 不，我主
  rationale: 这是哈拿对以利恭敬的称呼，并非对上帝的称号；“我主”保留了原文的尊称和第一人称所属形式。
- source_word: אִשָּׁה קְשַׁת רוּחַ
  choice: 心灵愁苦的妇人
  rationale: 该短语描述内心承受痛苦、忧伤的状态；“心灵愁苦”既保留“灵”的意象，也符合本段语境。
- source_word: וְיַיִן וְשֵׁכָר
  choice: 葡萄酒……浓酒
  rationale: יַיִן明确指葡萄酒；שֵׁכָר泛指葡萄酒以外能使人醉的饮料。“浓酒”简洁保留两者的区别，并以脚注防止将其误解为现代蒸馏酒。
- source_word: לֹא שָׁתִיתִי
  choice: 我没有喝……也没有喝
  rationale: 自然表达原文对两类酒的共同否定，并符合哈拿否认醉酒的语境。
- source_word: וָאֶשְׁפֹּךְ אֶת נַפְשִׁי
  choice: 倾倒我的心
  rationale: 保留“倾倒”的强烈比喻；נֶפֶשׁ在此指人的内在自我和全部情感，汉语以“心”表达较自然，同时用脚注说明原文措辞。
- source_word: לִפְנֵי יְהוָה
  choice: 在雅威面前
  rationale: לִפְנֵי表示在上帝面前、在其临在中；יהוה按其专名译为“雅威”。
- source_word: וַתַּעַן חַנָּה וַתֹּאמֶר
  choice: 哈拿回答说
  rationale: 希伯来语双动词是常见叙事公式；汉语合译为“回答说”更自然，也完整传达回应和发言的含义。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华／上主
  rationale: 原文直接使用四字神名；“雅威”较接近学界通常采用的拟音，也使其作为专名的性质清楚可见。
- issue: “倾倒我的心”的含义
  choice: 保留祷告中完全倾诉的比喻
  alternative: 向雅威倾诉
  rationale: 原文用“倾倒”描写哈拿在上帝面前毫无保留地表达内心，并未明确提出某种特定的祷告教义，因此保留意象而不作神学扩充。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“妇人”略具经文语体但仍通顺；“心灵愁苦”保留原文意象。“我主”体现哈拿对祭司以利的尊敬，不暗示以利具有神性。
