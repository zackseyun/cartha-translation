  text: וּ/לְ/חַנָּ֕ה יִתֵּ֛ן מָנָ֥ה אַחַ֖ת אַפָּ֑יִם כִּ֤י אֶת חַנָּה֙ אָהֵ֔ב וַֽ/יהוָ֖ה סָגַ֥ר רַחְמָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/005.yaml
  text: But to Hannah he would give a double portion[a], because he loved Hannah, though Yahweh had closed her womb.
translation:
  language: zh_hans
  text: 但以利加拿给哈拿时，总给她双份[a]，因为他爱哈拿，而雅威使她不能生育。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译近于“一份，两个脸面（或鼻孔）”。这是一个含义和句法都难确定的短语，可能指“双份”，也可能指“特别的一份”。
    reason: 保留疑难短语אַחַת אַפָּיִם的字面形式及词义异读。
lexical_decisions:
- source_word: וּ/לְ/חַנָּה
  choice: 但给哈拿时
  rationale: 介词与连词直译为“而给哈拿”；结合上一节分给毗尼拿及其儿女食物的语境，用“但”自然表达对比。
- source_word: יִתֵּן
  choice: 总会给
  rationale: 未完成式处于过去的惯常叙事中，表示以利加拿每年献祭时一贯的做法；“总会给”在现代汉语中自然传达反复性。
- source_word: מָנָה
  choice: 份
  rationale: 指祭肉筵席中分得的一份食物；“份”简洁自然，并与“双份”搭配。
- source_word: אַחַת אַפָּיִם
  choice: 双份
  rationale: 该疑难短语字面近于“一份、两张脸/两个鼻孔”，通常理解为双份或特别的一份。正文采用较可能且易懂的“双份”，脚注保留词义上的不确定性。
- source_word: כִּי
  choice: 因为
  rationale: 引出以利加拿特别厚待哈拿的原因。
- source_word: אֶת חַנָּה אָהֵב
  choice: 他爱哈拿
  rationale: 直接、自然地表达原文陈述的爱。
- source_word: וַֽ/יהוָה
  choice: 雅威
  rationale: 原文直接使用神圣四字名יהוה；正文以“雅威”音译，保留其作为上帝圣约之名的性质。
- source_word: סָגַר רַחְמָהּ
  choice: 使她不能生育
  rationale: 字面为“封闭了她的子宫”。现代汉语用“使她不能生育”自然表达结果，同时保留雅威是这一状况施事者的原文陈述。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文使用专名而非称号；“雅威”较直接地转写该圣约之名，不以称号取代。
- issue: 哈拿不能生育与以利加拿爱她之间的关系
  choice: 尽管雅威使她不能生育
  alternative: 而雅威使她不能生育
  rationale: 希伯来文以וַ连接末句，形式上可直译为“而”；上下文却形成明显的让步性张力：以利加拿爱哈拿，尽管她不能生育。“尽管”使现代汉语关系清楚，同时不削弱原文关于雅威主权行动的陈述。
- issue: 雅威在哈拿不育中的行动
  choice: 使她不能生育
  alternative: 封闭了她的子宫
  rationale: 保留原文将此状况归于雅威的明确施事关系，但避免在中文正文中使用生硬的身体隐喻。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“总会”体现过去惯常动作；“双份”适合普通读者，疑难字面表达及“特别的一份”这一可能解释置于脚注。
