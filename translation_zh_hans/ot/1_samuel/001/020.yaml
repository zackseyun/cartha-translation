base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/020.yaml
  text: And in due time Hannah conceived and bore a son[a], and she called his name Samuel, for she said[b], “I asked for him from Yahweh.”
translation:
  language: zh_hans
  text: 到了适当的时候[a]，哈拿怀了孕，生了一个儿子。她给他起名叫撒母耳，因为她说[b]：“我向雅威求了他。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “到了适当的时候”原文直译近似“在日子的循环（或转回）之际”，是指适当的时候来到。
    reason: lexical_alternative
  - marker: b
    text: 原文用“求”（שׁאל）解释“撒母耳”这个名字，形成双关；但“撒母耳”一名的确切词源仍有争议。
    reason: lexical_alternative
lexical_decisions:
- source_word: לִתְקֻפוֹת הַיָּמִים
  choice: 到了时候
  rationale: 该短语字面涉及“日子的循环/转回”，在这里是时间习语，指适当的时候来到；“到了时候”自然、简洁，也不把具体时长强加给原文。
- source_word: וַתַּהַר
  choice: 怀孕
  rationale: 准确表达 הרה 在生育叙事中的通常含义，符合现代汉语表达。
- source_word: וַתֵּלֶד בֵּן
  choice: 生了一个儿子
  rationale: 忠实而自然地表达“生育＋儿子”的结构，适合现代叙事语体。
- source_word: וַתִּקְרָא אֶת־שְׁמוֹ
  choice: 她给他起名叫
  rationale: 以自然现代汉语表达希伯来语命名公式，同时保留命名动作。
- source_word: שְׁמוּאֵל
  choice: 撒母耳
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: כִּי מֵיְהוָה שְׁאִלְתִּיו
  choice: 因为她说：“我从雅威那里求得了他。”
  rationale: “求得”既保留 שאל 的祈求含义，也表明孩子来自雅威；补出“她说”使中文中的命名解释清楚，并以脚注说明原文双关。
- source_word: יְהוָה
  choice: 雅威
  rationale: 直接音译四字神名，区别于作为称号的“主”，并采用较通行的现代普通话形式。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用神名，故以“雅威”音译，避免用称号取代专名。
- issue: 撒母耳之名与 שאל（求、询问）的关系
  choice: 正文保留“求得”的语词关联，并用脚注解释双关，不把它断言为严格词源
  alternative: 在正文中直译成一个确定的名字含义；完全不说明双关
  rationale: 经文确实借 שאל 解释命名，但“撒母耳”的精确词源存在争议；这样既保留叙事中的神学与文学联系，也不消除真实的不确定性。
translation_notes:
  register: 采用自然、庄重、易懂的现代标准普通话。叙事句式简洁；“雅威”作为专名处理。所有脚注标记均在正文对应位置出现。
