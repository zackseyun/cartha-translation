  text: וַ/יֹּ֣אמֶר הַ/מֶּ֡לֶךְ לָ/רָצִים֩ הַ/נִּצָּבִ֨ים עָלָ֜י/ו סֹ֥בּוּ וְ/הָמִ֣יתוּ כֹּהֲנֵ֣י יְהוָ֗ה כִּ֤י גַם יָדָ/ם֙ עִם דָּוִ֔ד וְ/כִ֤י יָֽדְעוּ֙ כִּֽי בֹרֵ֣חַ ה֔וּא וְ/לֹ֥א גָל֖וּ אֶת אזנ/ו וְ/לֹֽא אָב֞וּ עַבְדֵ֤י הַ/מֶּ֨לֶךְ֙ לִ/שְׁלֹ֣חַ אֶת יָדָ֔/ם לִ/פְגֹ֖עַ בְּ/כֹהֲנֵ֥י יְהוָֽה׀־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/017.yaml
  text: Then the king said to the runners who were standing around him[a], “Turn and kill the priests of Yahweh, because their hand also is with David[b], and because they knew that he was fleeing and did not disclose it to me.” But the king’s servants were not willing to put out their hand to strike the priests of Yahweh.
translation:
  language: zh_hans
  text: 王对侍立在他身边的侍卫[a]说：“转过去，杀掉雅威的祭司！因为他们也站在大卫一边[b]；他们明知道大卫正在逃亡，却没有向我通报[c]。”可是王的臣仆不肯下手加害雅威的祭司。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “侍卫”所译的希伯来语字面意思是“奔跑的人”，在王室中可指随侍君王的卫士或差役。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语直译为“他们的手也与大卫在一起”，意思是他们支持或帮助大卫。
    reason: idiom
  - marker: c
    text: 希伯来语字面为“没有揭开我的耳朵”，意思是“没有告诉我”。
    reason: idiom
lexical_decisions:
- source_word: לָרָצִים
  choice: 侍卫
  rationale: 该词字面指“奔跑的人”，在王室语境中可指随侍君王、奉命办事的卫士或差役；此处他们奉命杀人，“侍卫”最符合现代汉语语境，字面含义在脚注中保留。
- source_word: הַנִּצָּבִים עָלָיו
  choice: 侍立在他身边
  rationale: נצב 与 על 连用在这里表示站在王身边侍候；“侍立”兼顾其站立姿态和宫廷身份。
- source_word: סֹבּוּ וְהָמִיתוּ
  choice: 转过去，杀掉
  rationale: 两个命令语气直接而强烈；“杀掉”保留 מות 使役形的暴力性质，不添加“处决”所含的合法司法意味。
- source_word: כֹּהֲנֵי יְהוָה
  choice: 雅威的祭司
  rationale: 按专名处理四字神名 יהוה，以“雅威”呈现，而不以称号代替。
- source_word: כִּי גַם יָדָם עִם דָּוִד
  choice: 因为他们也站在大卫一边
  rationale: “他们的手也与大卫在一起”是表示支持、协助或与某人同一阵营的习语；正文自然表达其含义，脚注保留原文意象。
- source_word: כִּי בֹרֵחַ הוּא
  choice: 大卫正在逃亡
  rationale: בֹרֵחַ 是分词，突出持续状态；“正在逃亡”不把行动误作已经完成。
- source_word: וְלֹא גָלוּ אֶת אזנו
  choice: 却没有向我通报
  rationale: “揭开耳朵”是告知、透露的希伯来语习语；说话者是扫罗，故在直接引语中自然译作“向我通报”。
- source_word: וְלֹא אָבוּ
  choice: 不肯
  rationale: אבה 表示愿意或同意，否定形式表达拒绝；“不肯”简洁而准确。
- source_word: לִשְׁלֹחַ אֶת יָדָם לִפְגֹעַ
  choice: 伸手击杀
  rationale: 保留“伸手”的原文意象，并按杀害命令的语境将 פגע 译为“击杀”，清楚表达其致命行动。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。正文采用较贴近 יהוה 可能读音的现代汉语音译“雅威”，以保留专名性质，不以称号替代。
- issue: 祭司是否确实支持大卫
  choice: 保留为扫罗指控中的“站在大卫一边”
  alternative: 将其表述为叙述者确认他们蓄意与大卫合谋
  rationale: 这些话出自扫罗的命令和指控；译文不额外确认其判断是否公正，也不把表示支持或协助的习语强化为蓄意谋反。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。扫罗的命令用短促、直接的措辞表现其严厉与暴力；“臣仆不肯”则清楚呈现他们的拒绝。正文避免生硬照搬希伯来语习语，同时以脚注保留关键原文意象。
