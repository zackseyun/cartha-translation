base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/013.yaml
  text: Saul said to him[a], “Why have you and the son of Jesse conspired against me, by giving him bread and a sword and by inquiring of God for him, so that he has risen against me to lie in wait[b], as on this day?”
translation:
  language: zh_hans
  text: 扫罗对他说：“你和耶西的儿子为什么串通起来反对我？你给他饼和一把剑，又替他求问神[a]，以致他今日起来反对我，伺机伏击[b]？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “替他求问神”也可译作“为他向神寻求指引”。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“好让他今日起来反对我，伺机伏击”。
    reason: alternative_reading
lexical_decisions:
- source_word: קְשַׁרְתֶּם
  choice: 串通起来
  rationale: 此处指共同策划反叛君王；“串通起来”既表达敌对合谋的政治意味，也符合扫罗指控的口吻。
- source_word: בֶן־יִשָׁי
  choice: 耶西的儿子
  rationale: 保留扫罗不用大卫之名、只称其父名的原文措辞及其疏远、轻蔑的语气。
- source_word: בְּתִתְּךָ לוֹ לֶחֶם וְחֶרֶב
  choice: 你给他饼和一把刀
  rationale: 前缀 ב־引出扫罗所列的合谋行为；中文分句直接列举，较“借着给”自然，同时保留指控关系。
- source_word: וְשָׁאוֹל לוֹ בֵּאלֹהִים
  choice: 又替他求问神
  rationale: 在祭司和神谕语境中，שׁאל בֵאלֹהִים 指寻求神的指引；“替他求问神”准确而自然。
- source_word: בֵּאלֹהִים
  choice: 神
  rationale: 原文为 אֱלֹהִים，不是神名 יהוה，因此不译作“耶和华”。
- source_word: לָקוּם אֵלַי
  choice: 使他起来反对我
  rationale: 保留“起来”这一动态意象，并将 אֵלַי 在敌对语境中的方向性译为“反对我”。
- source_word: לְאֹרֵב
  choice: 埋伏等候
  rationale: ארב 表示潜伏伺机；中文“埋伏等候”自然表达其动作，不把它实体化为“伏击者”。
- source_word: כַּיּוֹם הַזֶּה
  choice: 正如今日这样
  rationale: 保留原文对当前可见情形的强调；措辞略带庄重，且不误译成持续至今的时间范围。
theological_decisions:
- issue: בֵּאלֹהִים 对神的称谓
  choice: 神
  alternative: 耶和华
  rationale: 马所拉文本明确使用 אֱלֹהִים；按原文优先原则，不以盟约名替换。
- issue: לָקוּם 所表达的目的或结果
  choice: 使他起来反对我
  alternative: 好让他起来反对我
  rationale: 希伯来语不定式在这里可表达扫罗所认定的结果或目的；正文采用较中性的“使”，脚注保留目的性理解，避免过度判定。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。保留“耶西的儿子”所传达的疏远语气，并保留目的与结果之间的原文张力。所有脚注标记均置于对应正文短语之后。
