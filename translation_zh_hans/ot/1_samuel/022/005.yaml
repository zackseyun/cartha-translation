  text: וַ/יֹּאמֶר֩ גָּ֨ד הַ/נָּבִ֜יא אֶל דָּוִ֗ד לֹ֤א תֵשֵׁב֙ בַּ/מְּצוּדָ֔ה לֵ֥ךְ וּ/בָֽאתָ לְּ/ךָ֖ אֶ֣רֶץ יְהוּדָ֑ה וַ/יֵּ֣לֶךְ דָּוִ֔ד וַ/יָּבֹ֖א יַ֥עַר חָֽרֶת־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/005.yaml
  text: Then Gad the prophet said to David[a], “Do not stay in the stronghold. Go and come for yourself to the land of Judah.” So David went and came to the forest of Hereth.
translation:
  language: zh_hans
  text: 先知迦得对大卫说：“你不要留在堡垒里。动身到犹大地去[a]。”于是大卫去了，来到哈列的树林。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“进入犹大地。”希伯来语动词可表示“来、进入”，在本句语境中也可泛指“到……去”。
    reason: 保留בוא在移动方向和进入某地之间的词义可能性。
lexical_decisions:
- source_word: הַנָּבִיא
  choice: 先知
  rationale: נָבִיא是希伯来语中“先知”的标准称谓，不应译作对应其他希伯来词的“先见”。
- source_word: לֹא תֵשֵׁב
  choice: 不要留在
  rationale: יָשַׁב在此指继续停留于某地；“留在”符合迦得针对大卫所在地点所发命令的语境。
- source_word: בַּמְּצוּדָה
  choice: 在堡垒里
  rationale: מְצוּדָה指设防或难以攻取、可供避难的地方；“堡垒”简洁保留其防御性质。
- source_word: לֵךְ וּבָאתָ לְּךָ אֶרֶץ יְהוּדָה
  choice: 动身到犹大地去
  rationale: 该短语连续表达离开现处、前往目的地；לְךָ带有个人指向或强调色彩，现代汉语无需机械译出反身成分。脚注保留בוא可理解为“进入”的词义。
- source_word: אֶרֶץ יְהוּדָה
  choice: 犹大地
  rationale: 保留אֶרֶץ所表达的地域含义，而不只译作“犹大”。
- source_word: יַעַר חָרֶת
  choice: 哈列树林
  rationale: יַעַר意为森林或树林；חָרֶת按地名音译为“哈列”。
- source_word: וַיֵּלֶךְ דָּוִד וַיָּבֹא
  choice: 大卫就离开那里，来到
  rationale: 两个连续动词分别表达大卫启程和抵达；“离开那里”结合上文明确其从堡垒动身，并以自然汉语避免重复“走了、来到”。
