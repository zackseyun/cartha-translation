base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/014.yaml
  text: Ahimelech answered the king and said[a], “And who among all your servants is as faithful as David, the king’s son-in-law, who has access to your council[b], and is honored in your house?”
translation:
  language: zh_hans
  text: 亚希米勒回答王说：“你所有臣仆中，有谁像大卫那样忠信呢？他是王的女婿，听从你的吩咐[a]，又在你家中[b]备受尊重。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“随时听候你的差遣。”
    reason: lexical_alternative
  - marker: b
    text: “你家中”在这里也可指王室或宫廷。
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַן אֲחִימֶלֶךְ אֶת־הַמֶּלֶךְ וַיֹּאמַר
  choice: 亚希米勒回答王说
  rationale: 保留希伯来叙事中“回答……说”的表达，同时采用自然、庄重的现代汉语句式。
- source_word: וּמִי בְכָל־עֲבָדֶיךָ כְּדָוִד נֶאֱמָן
  choice: 你所有臣仆中，有谁像大卫那样忠信呢
  rationale: 用反问句再现原文语气；“臣仆”既保留王室语境，也不过度限定具体官职。“忠信”兼顾可靠与效忠两层含义。
- source_word: וַחֲתַן הַמֶּלֶךְ
  choice: 他是王的女婿
  rationale: 准确表达大卫与扫罗的姻亲关系，并保留亚希米勒当面称扫罗为“王”的第三人称措辞。
- source_word: וְסָר אֶל־מִשְׁמַעְתֶּךָ
  choice: 听从你的吩咐
  rationale: 该短语含有转向、听从或随命而行之意；正文采用语境中自然的“听从你的吩咐”，脚注保留“随时听候差遣”等可能表达。
- source_word: וְנִכְבָּד בְּבֵיתֶךָ
  choice: 又在你家中备受尊重
  rationale: “备受尊重”表达 נִכְבָּד 的受敬重状态；“你家中”保留 בְּבֵיתֶךָ 的原有意象，其宫廷或王室含义另以脚注说明。
theological_decisions:
- issue: וְסָר אֶל־מִשְׁמַעְתֶּךָ 的职分或顺服含义
  choice: 正文译为“听从你的吩咐”
  alternative: “随时听候你的差遣”或“有权进见你”
  rationale: 原文短语较罕见，可能强调大卫对王命的顺从和随时响应，也有人按宫廷语境理解为获准进见。正文不把它具体化为未经原文明确说明的官职，并在脚注中保留语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以“臣仆”“王的女婿”体现宫廷场景，但避免过度古雅；反问句和并列描述保留原文为大卫辩护的语气。
