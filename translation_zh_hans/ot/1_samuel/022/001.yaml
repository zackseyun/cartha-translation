  text: וַ/יֵּ֤לֶךְ דָּוִד֙ מִ/שָּׁ֔ם וַ/יִּמָּלֵ֖ט אֶל מְעָרַ֣ת עֲדֻלָּ֑ם וַ/יִּשְׁמְע֤וּ אֶחָי/ו֙ וְ/כָל בֵּ֣ית אָבִ֔י/ו וַ/יֵּרְד֥וּ אֵלָ֖י/ו שָֽׁמָּ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/001.yaml
  text: So David went from there and escaped to the cave of Adullam. When his brothers and all his father's household heard[a], they went down there to him.
translation:
  language: zh_hans
  text: 大卫就从那里离开，逃到亚杜兰洞。他的兄弟和父亲全家听说了[a]，就下到他那里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文只说“听见了”，没有说明听见的具体内容；可理解为听说了这事，或听说了大卫所在的地方。
    reason: 保留原文宾语省略所造成的语义开放性，避免把所听见的内容限定得过窄。
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: 离开
  rationale: הלך在叙事链中表示从先前地点动身；结合מִשָּׁם，译作“从那里离开”自然清楚，也避免连续使用两个近义移动动词显得累赘。
- source_word: מִשָּׁם
  choice: 从那里
  rationale: 准确保留指向上文地点的指示意义。
- source_word: וַיִּמָּלֵט
  choice: 逃到
  rationale: מלט的尼法勒式表示逃脱、脱险；“逃到”既呈现逃离危险的动作，也自然连接目的地，但其“成功脱险”的结果意味不如“逃脱”突出，故以脚注说明。
- source_word: מְעָרַת עֲדֻלָּם
  choice: 亚杜兰洞
  rationale: 构造词组指与亚杜兰相关的洞穴；采用简洁且沿用已久的中文地名表达，不额外断定是“亚杜兰的洞”还是“亚杜兰境内的一个洞”。
- source_word: וַיִּשְׁמְעוּ
  choice: 听说了
  rationale: שמע在此没有明说所听见的宾语，语境指听到大卫所在之处或有关他的消息；现代汉语用“听说了”可自然保留宾语省略。
- source_word: אֶחָיו
  choice: 他的兄弟
  rationale: 原文为阳性复数，在此自然指大卫的兄弟。
- source_word: כָל בֵּית אָבִיו
  choice: 父亲全家
  rationale: “父家”在此指父系家庭或家属群体，而非房屋；“父亲全家”是普通现代汉语中自然且贴近原意的表达。
- source_word: וַיֵּרְדוּ
  choice: 下到
  rationale: 保留ירד所表达的向下移动或地势方向，不简化为泛指的“去”。
- source_word: אֵלָיו שָׁמָּה
  choice: 到那里去见他
  rationale: 同时表达“向他”和“那里”两个方向成分；“去见他”在中文中自然，此处“见”表示前往他那里，并非另加会面细节。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“就”体现希伯来语连续叙事的推进；保留“下到”的地势方向意味。正文中的脚注标记与脚注相对应。
