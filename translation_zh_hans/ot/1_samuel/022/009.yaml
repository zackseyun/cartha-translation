  text: וַ/יַּ֜עַן דֹּאֵ֣ג הָ/אֲדֹמִ֗י וְ/ה֛וּא נִצָּ֥ב עַל עַבְדֵֽי שָׁא֖וּל וַ/יֹּאמַ֑ר רָאִ֨יתִי֙ אֶת בֶּן יִשַׁ֔י בָּ֣א נֹ֔בֶ/ה אֶל אֲחִימֶ֖לֶךְ בֶּן אֲחִטֽוּב־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/009.yaml
  text: Then Doeg the Edomite[a], who was standing among Saul’s servants, answered and said, “I saw the son of Jesse coming to Nob, to Ahimelech son of Ahitub.”
translation:
  language: zh_hans
  text: 以东人多益[a]站在扫罗的臣仆中间，便回答说：“我看见耶西的儿子来到挪伯，去见亚希突的儿子亚希米勒。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “站在扫罗的臣仆中间”也可译作“被派管理扫罗的臣仆”。希伯来语可指多益身处他们中间，也可能指他居于他们之上，担任监督职务。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַן
  choice: 回答
  rationale: ענה在叙事对话中常用于引出回应；即使前文未必有直接问句，保留“回答”仍体现希伯来语的叙事表达。
- source_word: הָאֲדֹמִי
  choice: 以东人
  rationale: 带冠词的族属称谓，在人名“多益”后作同位说明；现代汉语以“以东人多益”表达自然。
- source_word: וְהוּא נִצָּב עַל עַבְדֵי שָׁאוּל
  choice: 站在扫罗的臣仆中间
  rationale: נִצָּב可指“站着”或“被派驻”，עַל既可能表达相对于群体的位置，也可能表示居于其上。正文采用符合场景且不过度断定职级的“站在……中间”，另以脚注保留监督性理解。
- source_word: עַבְדֵי שָׁאוּל
  choice: 扫罗的臣仆
  rationale: עבדים在王宫语境中可兼指仆从、侍臣或官员；“臣仆”既保留从属含义，也符合宫廷场景。
- source_word: וַיֹּאמַר
  choice: 说
  rationale: 与前面的“回答”共同保留原文“回答并说”的连续动词结构，但用“便回答说”形成自然的现代汉语。
- source_word: רָאִיתִי
  choice: 我看见
  rationale: 完成式在此陈述过去亲眼所见之事；“我看见”简洁自然。
- source_word: בֶּן יִשַׁי
  choice: 耶西的儿子
  rationale: 原文刻意不用“大卫”之名，而用父子关系称呼；译文保留其措辞及可能的修辞色彩。
- source_word: בָּא
  choice: 来到
  rationale: 分词描述多益当时看见的行动；结合目的地“挪伯”，汉语用“来到”较自然。
- source_word: נֹבֶה
  choice: 来到挪伯
  rationale: 地名后的方向词尾表示朝向挪伯的移动，现代汉语自然译作“来到挪伯”。
- source_word: אֶל אֲחִימֶלֶךְ בֶּן אֲחִטוּב
  choice: 去见亚希突的儿子亚希米勒
  rationale: אֶל表示向着或到某人那里；“去见”在汉语中清楚表达大卫前往亚希米勒那里，又不增添会谈内容。
