  text: Then Saul said, “Listen, please, son of Ahitub.” And he answered, “Here I am, my lord.”
translation:
  language: zh_hans
  text: 扫罗说：“亚希突的儿子，请听着。”他回答：“我在这里，我主。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׁמַע נָא
  choice: 请听我说
  rationale: שְׁמַע是命令式“听”，נָא在此使语气带有请求或促请意味；译作“请听我说”符合现代汉语表达，也保留原文语气。
- source_word: בֶּן אֲחִיטוּב
  choice: 亚希突的儿子
  rationale: 按原文直译，扫罗以父名称呼亚希米勒；不在正文中补出原文未出现的人名。
- source_word: הִנְנִי
  choice: 我在这里
  rationale: 这是回应呼唤的惯用语，表示已经听候吩咐；采用较贴近原文且庄重自然的译法。
- source_word: אֲדֹנִי
  choice: 我主
  rationale: 指对扫罗的尊称，而非神名；译作“我主”保留臣属对君王的敬称。
