base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/022.yaml
  text: David said to Abiathar[a], “I knew on that day, when Doeg the Edomite was there, that he would surely tell Saul[c][b]. I am responsible for all the lives of your father’s house.”
translation:
  language: zh_hans
  text: 大卫对亚比亚他说：“那一天，以东人多益在那里时，我就知道他一定会告诉扫罗。[a][b]你父家所有人的丧命，都是我造成的。[c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “以东人多益在那里”也可译为“我知道以东人多益在那里”；希伯来语连词可引出大卫所知道的内容，而不只表示当时的情境。
    reason: lexical_alternative
  - marker: b
    text: “一定会告诉”在希伯来语中采用不定式绝对形与限定动词连用的强调结构，直译近似“告诉，他必会告诉”。
    reason: source_emphasis
  - marker: c
    text: “都是我造成的”也可译为“我对……负有责任”或“都是因我而丧命的”。这里指大卫承认自己是事件的肇因，并非说他亲手杀害了他们。
    reason: lexical_alternative
lexical_decisions:
- source_word: יָדַעְתִּי בַּיּוֹם הַהוּא
  choice: 那一天……我就知道
  rationale: 直译ידע的完成式所表达的先前认知，并以“就”自然连接当时的情境与大卫的判断。
- source_word: כִּי שָׁם דויג הָאֲדֹמִי
  choice: 以东人多益在那里
  rationale: 正文按时间—情境关系理解该分句；“以东人”准确保留族属称谓，同时脚注注明כי也可引出“知道”的内容。
- source_word: כִּי הַגֵּד יַגִּיד לְשָׁאוּל
  choice: 他一定会告诉扫罗
  rationale: “一定”体现不定式绝对形与限定动词连用所构成的强调；不增添原文未明说的宾语。
- source_word: אָנֹכִי סַבֹּתִי
  choice: 都是我造成的
  rationale: 独立代词אָנֹכִי的强调由“都是我”体现；סַבֹּתִי在本语境中表示大卫承认自己是惨剧的肇因。
- source_word: בְּכָל נֶפֶשׁ בֵּית אָבִיךָ
  choice: 你父家所有人的丧命
  rationale: נֶפֶשׁ在此指人的性命；结合屠杀语境译为“所有人的丧命”，既明确死亡事实，也保留“父家”这一家族性表达。
theological_decisions:
- issue: 大卫对祭司死亡所负责任的程度
  choice: 都是我造成的
  alternative: 我对……负有责任／都是因我而丧命的
  rationale: 正文保留大卫强烈的自责及因果表述，不把它弱化为一般道德责任；脚注同时说明原词可作较宽的责任性理解，避免断定他是在承认亲手杀害众人。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“父家”保留古代家族共同体的含义；“丧命”明确本节所指的死亡，又避免“灵魂”等可能引起误解的表达。
