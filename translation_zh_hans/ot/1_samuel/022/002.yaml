base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/002.yaml
  text: And everyone in distress[a], everyone who was in debt, and everyone bitter in soul gathered to him, and he became commander over them[b]. About four hundred men were with him.
translation:
  language: zh_hans
  text: 凡处境困苦的、欠债的[a]、心里愁苦的[b]，都聚集到他那里；他就作了他们的统领。与他在一起的约有四百名男子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“有债主（或讨债者）的”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“灵魂苦涩的”，指内心深切的愁苦或痛苦。
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּתְקַבְּצוּ אֵלָיו
  choice: 都聚集到他那里
  rationale: 准确表达众人一同来到他那里的动作；“聚集到”自然地保留了原文的群体性和方向性。
- source_word: כָּל אִישׁ מָצוֹק
  choice: 凡处境困苦的
  rationale: מָצוֹק可指受压迫、陷入窘境或困苦；“处境困苦”保留其宽泛含义，不局限于经济困难。
- source_word: כָל אִישׁ אֲשֶׁר לוֹ נֹשֶׁא
  choice: 欠债的
  rationale: 原文直译近于“有债主（或讨债者）的”；在现代汉语中，“欠债的”最自然地表达这种受债权追索的处境，脚注保留原文措辞。
- source_word: כָל אִישׁ מַר נֶפֶשׁ
  choice: 心里愁苦的
  rationale: מַר נֶפֶשׁ字面为“生命/心灵苦涩”，表示深切的内在痛苦或苦闷；“心里愁苦”自然、庄重，又不把含义缩窄为单纯不满。
- source_word: וַיְהִי עֲלֵיהֶם לְשָׂר
  choice: 他就作了他们的统领
  rationale: שַׂר可指首领、长官或统帅；此处是武装群体语境，“统领”兼顾领导与军事色彩，也比现代军衔化的称谓更贴近原文。
- source_word: כְּאַרְבַּע מֵאוֹת אִישׁ
  choice: 约有四百人
  rationale: 前缀כְּ表示约数；“约有四百人”简明自然。这里所数的是加入大卫队伍的成年男子。
- source_word: וַיִּהְיוּ עִמּוֹ
  choice: 跟随他的
  rationale: 原文直译为“与他同在/和他在一起”；结合这些人聚集到他那里并由他统领的上下文，“跟随他的”在汉语中自然表达其归属和同行关系。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事用语。三个“凡……的”并列成分保留原文反复结构；用分号清楚划分众人聚集与他成为统领两个动作。代词“他”忠实保留本节原文，所指由上下文确定。
