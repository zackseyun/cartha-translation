revisions:
- from: 凡处境困苦的、欠债的[a]、心里愁苦的[b]，都聚集到他那里；他就作了他们的统领。跟随他的约有四百人。
  to: 凡处境困苦的、欠债的[a]、心里愁苦的[b]，都聚集到他那里；他就作了他们的统领。与他在一起的约有四百名男子。
  rationale: 仅修正末句，以恢复“与他同在”的直接语义，避免“跟随”所带来的额外动作和忠诚含义；同时以“名男子”保留 אִישׁ 在人数统计中的男性指向。其余译文及脚注均可保留。
