  text: וַ/יִּשְׁאַל ל/וֹ֙ בַּֽ/יהוָ֔ה וְ/צֵידָ֖ה נָ֣תַן ל֑/וֹ וְ/אֵ֗ת חֶ֛רֶב גָּלְיָ֥ת הַ/פְּלִשְׁתִּ֖י נָ֥תַן לֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/010.yaml
  text: And he inquired of Yahweh for him[a], and gave him provisions, and gave him the sword of Goliath the Philistine.
translation:
  language: zh_hans
  text: 他替他向雅威求问[a]，又给他口粮，并把非利士人歌利亚的刀给了他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他替他向雅威寻求指示。”
    reason: 说明 שׁאל 与 ב 加神名表示向雅威求问、寻求指示；“替他”对应 לוֹ。
lexical_decisions:
- source_word: וַיִּשְׁאַל לוֹ בַּיהוָה
  choice: 他为他求问雅威
  rationale: שׁאל 与介词 ב 加神名连用，表示向神求问、寻求指示；לוֹ 表示“为他、替他”。保留两个代词，不把上下文中的人物姓名添入本节。
- source_word: בַּיהוָה
  choice: 雅威
  rationale: 直接音译四字神名 יהוה，体现原文所用的专名。
- source_word: צֵידָה
  choice: 口粮
  rationale: צֵידָה 指供旅途或维持生活所用的食物、给养；“口粮”在本句中简洁自然，也不额外限定具体种类。
- source_word: נָתַן לוֹ
  choice: 给他／给了他
  rationale: 直译 נתן 加间接宾语；中文按句法分别处理，并保留原文两次“给”的重复。
- source_word: וְאֵת חֶרֶב גָּלְיָת הַפְּלִשְׁתִּי
  choice: 并把非利士人歌利亚的刀
  rationale: 准确表达所属关系，同时以“把”字句使中文自然，并保留“非利士人”对歌利亚的限定。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；正文采用“雅威”这一较贴近通常学术复原读音的现代汉语音译，不以称号替代专名。
- issue: 求问行为的性质
  choice: 求问雅威
  alternative: 寻求雅威的指示
  rationale: “求问”保留 שׁאל 的礼仪和神谕语境，却不进一步说明所求的具体内容，避免消解原文的概括性。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“他为他”虽在汉语中略显重复，却忠实保留原文两个男性单数代词及其指代上的语境依赖；句中不擅自补出“大卫”或“亚希米勒”。
