revisions:
- from: 他为他求问雅威[a]，又给他口粮，并把非利士人歌利亚的刀给了他。
  to: 他替他向雅威求问[a]，又给他口粮，并把非利士人歌利亚的刀给了他。
  rationale: 仅调整首分句的语序和介词关系，使中文自然、明确，并更贴合“向神求问”的原文结构；其余措辞保留，维持原文的重复、指代含混及叙事语气。
