  yaml_path: translation/ot/1_samuel/022/016.yaml
  text: But the king said[a], “You shall surely die, Ahimelech[b], you and all your father's house.”
translation:
  language: zh_hans
  text: 王说：“亚希米勒，你必死无疑[a]！你和你父亲的全家[b]都要死。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“你一定会死”或“你必须死”。希伯来文以不定式绝对式与同词根的限定动词连用，表示强烈强调。
    reason: lexical_alternative
  - marker: b
    text: “你父亲的全家”指父系家户或家族一系。
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: אמר的叙事性连续式在此表示王开口宣告，现代汉语自然译作“说”。
- source_word: הַמֶּלֶךְ
  choice: 王
  rationale: 带定冠词的名词明确指当时在场的王；上下文已确定其身份，汉语用“王”自然明确。
- source_word: מוֹת תָּמוּת
  choice: 必死无疑
  rationale: 原文以同词根的不定式绝对形加强限定动词，强烈强调死亡的确定性；“必死无疑”既保留强调，也符合王所宣告之判决的严厉语气。
- source_word: אֲחִימֶלֶךְ
  choice: 亚希米勒
  rationale: 按现代中文圣经人名的通行音译处理该专名。
- source_word: אַתָּה
  choice: 你
  rationale: 原文显式使用第二人称代词，带有强调作用；译文在呼名后保留“你”。
- source_word: וְכָל
  choice: 和……全
  rationale: וְ连接亚希米勒本人及其父家，כָל表示整体范围；译作“你和你父亲全家”自然传达其涵盖性。
- source_word: בֵּית אָבִיךָ
  choice: 你父亲全家
  rationale: 字面为“你父亲的家”，在此指父系家族或家户；“你父亲全家”保留亲属关系，又便于现代读者理解。
theological_decisions:
- issue: מוֹת תָּמוּת所表达的是预告、必然性还是司法判决
  choice: 以“必死无疑”保留死亡确定性的强烈宣告，并由说话者为王的语境显出判决色彩
  alternative: “你一定会死”或“你必须死”
  rationale: 希伯来语结构首先强化“死”这一动词，本身可兼有确定预告和判决意味；译文不把它单方面限定为纯粹预言或纯粹义务命令。
translation_notes:
  register: 采用庄重而直接的现代标准汉语。“必死无疑”体现原文的强烈强调；后半句重复“都要死”，使“你和你父亲全家”所受判决在汉语中清楚自然。
