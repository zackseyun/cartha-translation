base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/018.yaml
  text: Then the king said to Doeg[a], “Turn and strike down the priests.” So Doeg the Edomite turned and struck down the priests, and on that day he put to death eighty-five men who wore a linen ephod.
translation:
  language: zh_hans
  text: 王对多益说：“你转身去攻击祭司！”[a]于是，以东人多益转身去攻击祭司。那一天，他杀死了八十五名身穿细麻布以弗得的男子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “攻击”也可译作“击打”或“扑向”。希伯来语动词可泛指暴力攻击；本处译作“攻击”，以保留该行动与下文明确概括他杀死八十五人之间的区别。
    reason: lexical_alternative
lexical_decisions:
- source_word: סֹב
  choice: 转过去
  rationale: 该命令在处决场景中是要多益转向祭司并执行命令；“转过去”自然、简洁，也保留了原命令的急促感。
- source_word: וּפְגַע / וַיִּפְגַּע
  choice: 击杀
  rationale: פגע可指相遇、袭击或击打；此处语境明确是奉命处决。“击杀”体现暴力行动，同时与下文概括结果的“杀死”略作区分。脚注保留该动词较宽的语义范围。
- source_word: הַכֹּהֲנִים
  choice: 祭司
  rationale: 准确对应带定冠词的复数名词；汉语在此无需另加“这些”。
- source_word: הָאֲדֹמִי
  choice: 以东人
  rationale: 按族属称谓翻译，说明多益是以东人。
- source_word: וַיָּמֶת
  choice: 他杀死了
  rationale: מות的使役形在此表示使人死亡，即“杀死”。主语按紧接的上文自然理解为多益。
- source_word: שְׁמֹנִים וַחֲמִשָּׁה אִישׁ
  choice: 八十五名男子
  rationale: איש在数词后指人；此处所指为男性祭司，因此译作“男子”既准确又自然。
- source_word: נֹשֵׂא אֵפוֹד בָּד
  choice: 身穿细麻布以弗得的
  rationale: נשא用于衣物时可表示穿戴；以弗得是祭司服饰，故译作“身穿”。בָּד指细麻布，“细麻布以弗得”保留服饰名称及材质。
- source_word: וַיֹּאמֶר הַמֶּלֶךְ
  choice: 王对……说
  rationale: 叙事承接关系由上下文自然体现；“王对多益说”符合现代汉语叙事表达。
theological_decisions: []
