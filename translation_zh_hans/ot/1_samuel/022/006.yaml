base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/006.yaml
  text: Saul heard that David and the men who were with him had become known[a]. Now Saul was sitting at Gibeah, under the tamarisk tree on the height, with his spear in his hand[b], and all his servants were standing around him.
translation:
  language: zh_hans
  text: 扫罗听说大卫和与他在一起的人已被发现[a]。当时，扫罗正坐在基比亚高处的一棵柽柳树下[b]，手里拿着矛；他的臣仆都侍立在他周围。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“大卫和与他在一起的人的行踪已为人所知。”希伯来语动词既可表示“为人所知”，也可表示“被发现”。
    reason: lexical_alternative
  - marker: b
    text: “高处”或可译作地名“拉玛”。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: 听说
  rationale: 这里指扫罗得知消息；现代汉语用“听说”比单用“听见”更自然，也保留希伯来语以听闻表示获知的叙事习惯。
- source_word: כִּי נוֹדַע דָּוִד
  choice: 大卫……已被发现
  rationale: ידע 的尼法勒式可表示“为人所知”或“被发现”。上下文涉及大卫及随从不再隐蔽，因此译作“已被发现”，并用脚注保留“行踪已为人所知”的可能表达。
- source_word: וַאֲנָשִׁים אֲשֶׁר אִתּוֹ
  choice: 和跟随他的人
  rationale: 直译为“与他同在的人”；在此指大卫身边的男性队伍。“跟随他的人”符合现代汉语叙事，且不额外限定其正式身份。
- source_word: יוֹשֵׁב
  choice: 正坐
  rationale: 分词构成持续性的背景画面；“正坐”自然表达当时正在持续的姿态。
- source_word: בַּגִּבְעָה
  choice: 在基比亚
  rationale: 此处 גבעה 是地名“基比亚”；用“在”符合现代汉语地点表达。
- source_word: תַּחַת הָאֶשֶׁל
  choice: 一棵柽柳树下
  rationale: אשל 通常指柽柳；加入量词使汉语自然，不改变所指。
- source_word: בָּרָמָה
  choice: 高处
  rationale: 带冠词的形式及句法较支持普通名词“高处”，并可与“在基比亚”自然结合；另一个可能是地名“拉玛”，在脚注中说明。
- source_word: וַחֲנִיתוֹ בְיָדוֹ
  choice: 手里拿着矛
  rationale: 希伯来文是无动词状态句，描绘矛在扫罗手中；汉语“手里拿着矛”自然保留其姿态和武力意象。
- source_word: וְכָל עֲבָדָיו
  choice: 他的臣仆都
  rationale: עבדים 在王室场景中兼有仆从、侍从和臣属之意。“臣仆”较“仆人”更贴合宫廷语境，同时避免过度限定为行政官员。
- source_word: נִצָּבִים עָלָיו
  choice: 侍立在他周围
  rationale: 分词表示众人站立在扫罗身旁或周围。“侍立”体现臣仆在王面前站候的场景，“在他周围”自然传达 על 在此处的位置关系。
