base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/023.yaml
  text: Stay with me[a]; do not be afraid, for he who seeks my life seeks your life also[b], for you are under my protection.
translation:
  language: zh_hans
  text: 你留在我这里，不要害怕；因为要取我性命的人，也要取你的性命。你在我这里会受到保护。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׁבָה אִתִּי
  choice: 你留在我身边
  rationale: ישׁב在这里不是叫人坐下，而是命令亚比亚他继续与大卫同住、留在他身旁；“留在我身边”自然地表达陪伴和庇护的语境。
- source_word: אַל תִּירָא
  choice: 不要害怕
  rationale: 准确表达否定命令，符合现代汉语习惯。
- source_word: אֲשֶׁר יְבַקֵּשׁ אֶת נַפְשִׁי
  choice: 那要取我性命的人
  rationale: אֲשֶׁר加单数动词可指特定的“那个人”，在本段语境中自然指扫罗；脚注保留其也可作泛指关系表达的可能。
- source_word: נֶפֶשׁ
  choice: 性命
  rationale: 在“寻索某人的נפש”这一习语中，所指是企图杀害、取人性命，并非现代汉语通常所说的非物质“灵魂”。
- source_word: יְבַקֵּשׁ אֶת נַפְשֶׁךָ
  choice: 也要取你的性命
  rationale: 重复原文的动词和宾语；“也”虽无独立对应词，却明确呈现两句并列所表达的共同危险。
- source_word: מִשְׁמֶרֶת אַתָּה עִמָּדִי
  choice: 你在我这里会受到保护
  rationale: מִשְׁמֶרֶת可表示看守、保全或护卫；此处是大卫向亚比亚他保证，跟他在一起便处于保护之下。译文采用自然汉语，脚注说明希伯来原文简略而不寻常的结构。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“取……性命”保留叙事文体的力度；末句避免生硬直译，同时以脚注保留原文的浓缩结构及语义范围。
