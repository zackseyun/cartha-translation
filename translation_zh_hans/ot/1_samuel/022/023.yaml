  naturalness: 原译整体自然、庄重。将“留在我身边”调整为“留在我这里”，更贴近“与我同在”及末句重复的“在我这里”；“会受到保护”是自然的现代汉语。
  terminology: “取……性命”恰当地传达“寻索性命”的杀害意涵。“保护”适切传达 מִשְׁמֶרֶת 在本语境中的保全含义，未引入额外神学解释。
