base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/007.yaml
  text: Then Saul said to his servants who were standing around him, “Listen, please, sons of Benjamin! Will the son of Jesse also give all of you fields and vineyards? Will he make all of you commanders of thousands and commanders of hundreds?”
translation:
  language: zh_hans
  text: 扫罗对侍立在他身边的臣仆说：“便雅悯人哪，请听！难道耶西的儿子也会把田地和葡萄园赐给你们众人吗？难道他会立你们众人作千夫长、百夫长吗？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֲבָדָיו
  choice: 他的臣仆
  rationale: 此处指侍立于王身边、为王效力的人；“臣仆”既保留其从属身份，也符合王廷语境。
- source_word: הַנִּצָּבִים עָלָיו
  choice: 侍立在他身边
  rationale: 该短语在此描述随侍、环立于扫罗身边；用“侍立”体现宫廷场景，避免误解为站在他上方。
- source_word: שִׁמְעוּ נָא
  choice: 请听
  rationale: נָא使命令语气带有请求或促请色彩；“请听”简洁保留该语气。
- source_word: בְּנֵי יְמִינִי
  choice: 便雅悯人哪
  rationale: 字面为“便雅悯之子”，实际是对便雅悯支派成员的称呼；现代汉语以“便雅悯人”自然明确，呼格用“哪”表达。
- source_word: בֶּן יִשַׁי
  choice: 耶西的儿子
  rationale: 保留扫罗不直呼大卫其名、以父名称呼他的贬抑或疏远语气。
- source_word: שָׂרֵי אֲלָפִים וְשָׂרֵי מֵאוֹת
  choice: 千夫长、百夫长
  rationale: 指统领千人和百人的军政官职；采用简明而已为汉语读者熟悉的传统称谓。
theological_decisions:
- issue: 两个疑问句的修辞性质
  choice: 以“难道……吗？”和“……吗？”呈现扫罗预期否定回答的质问
  alternative: 译为普通中性问句
  rationale: 上下文显示扫罗在诉诸同族利益，暗示耶西的儿子不会像他一样赏赐并任用他们；保留修辞性反问，但不把暗示改写成明说。
- issue: 对大卫的称呼
  choice: 保留“耶西的儿子”
  alternative: 直接译作“大卫”
  rationale: 原文刻意不用大卫之名；保留该表达可呈现扫罗的态度和叙事张力，不作神学或心理层面的额外解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。王廷语境中用“臣仆”“侍立”，呼语采用“便雅悯人哪”。保留重复的“你们众人”，对应原文两次 לְכֻלְּכֶם，并突出扫罗对集体利益的诉求。
