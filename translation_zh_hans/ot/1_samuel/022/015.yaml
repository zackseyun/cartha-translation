base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/015.yaml
  text: Was today the first time that I inquired of God for him? Far be it from me! Let not the king impute anything to his servant or to all my father’s house[a], for your servant knew nothing of all this, whether small or great.
translation:
  language: zh_hans
  text: “难道今天是我第一次为他求问上帝吗？绝非如此！王不要把任何罪责归到仆人或我父亲的全家身上[a]，因为这一切事，无论大小，仆人都毫不知情。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 较直译：“我今天才开始为他求问上帝吗？”这个希伯来语反问表示，亚希米勒以前已经这样做过，并非今天才第一次做。
    reason: 说明原文句式及反问所含的语用意义。
lexical_decisions:
- source_word: הַיּוֹם הַחִלֹּתִי
  choice: 难道今天是我第一次……吗
  rationale: 原文直译近于“我今天才开始……吗”，在语境中是反问，表示这并非亚希米勒首次如此行；此译既保留反问，也使现代汉语自然清楚。
- source_word: לִשְׁאוֹל לוֹ בֵאלֹהִים
  choice: 为他求问上帝
  rationale: שׁאל בֵאלֹהִים 指向上帝求取指示或神谕；לוֹ 表明大卫是受益者，故译“为他”。
- source_word: חָלִילָה לִּי
  choice: 我绝无此意
  rationale: 这是强烈否认和自我撇清的固定表达；结合扫罗所指控的谋反之意，译文传达亚希米勒的坚决否认，同时不额外补入具体罪名。
- source_word: אַל יָשֵׂם ... בְּ
  choice: 不要把任何罪责归到……身上
  rationale: שׂים 与介词 ב 在此表示把某事归在某人身上，语境具有归罪或指控意味；“罪责”将隐含的司法语气自然表达出来。
- source_word: בְּכָל בֵּית אָבִי
  choice: 我父亲全家
  rationale: “父家”在此指父系家族或家族群体；现代汉语“我父亲全家”简明易懂，并保留家族整体受牵连之意。
- source_word: לֹא יָדַע עַבְדְּךָ בְּכָל זֹאת
  choice: 这一切事……仆人都毫不知情
  rationale: 保留亚希米勒以“仆人”自称的恭敬语气；“毫不知情”自然表达彻底否认知悉此事。
- source_word: דָּבָר קָטֹן אוֹ גָדוֹל
  choice: 无论大小
  rationale: “小或大”是涵盖全部范围的两极表达；“无论大小”在汉语中自然并保留原文的总括作用。
theological_decisions:
- issue: 亚希米勒反问是否暗示他过去曾多次为大卫求问上帝
  choice: 以“难道今天是我第一次……”保留这一语用含义
  alternative: 直译为“我今天才开始为他求问上帝吗”
  rationale: 希伯来文形式容许较直译的表达，但上下文中的反问明显否认这是首次发生；译文让含义清楚，同时脚注保留较形式对应的译法。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。保留“王”“仆人”等宫廷语境中的身份称谓；反问、强烈否认和大小两极表达均依原文呈现。
