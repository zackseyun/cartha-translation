  text: He brought them before the king of Moab[a], and they stayed with him all the days that David was in the stronghold.
translation:
  language: zh_hans
  text: 他把他们带到摩押王面前[a]。在大卫住在堡垒期间，他们一直住在摩押王那里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他领他们到摩押王面前。”希伯来语动词在这里可表示“领”或“带到某人面前”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּנְחֵם
  choice: 他把他们带到
  rationale: 该动词在这里表示领人前往或把人带入某人面前；“把他们带到”符合现代汉语叙事习惯，也与后面的“摩押王面前”自然衔接。
- source_word: אֶת פְּנֵי
  choice: 面前
  rationale: 这是表示进入某人面前或其所在之处的惯用表达；译作“面前”简洁自然。
- source_word: מֶלֶךְ מוֹאָב
  choice: 摩押王
  rationale: 按希伯来语领属结构直译，在现代汉语中以“摩押王”表达最为自然。
- source_word: וַיֵּשְׁבוּ עִמּוֹ
  choice: 他们一直住在王那里
  rationale: ישב在此表示居住、停留；“一直住在王那里”传达持续居留之意，并明确代词所指为紧邻的摩押王。
- source_word: כָּל יְמֵי הֱיוֹת דָּוִד
  choice: 大卫……的那些日子
  rationale: 将“在大卫处于……期间”的希伯来语时间结构转化为自然的现代汉语时间短语，同时保留整个时段的含义。
- source_word: בַּמְּצוּדָה
  choice: 在堡垒里
  rationale: מְצוּדָה指设防的藏身处或坚固据点；“堡垒”保留其防御性含义，也避免“山寨”在现代汉语中的歧义。
