  yaml_path: translation/ot/1_samuel/022/021.yaml
  text: Abiathar told David that Saul had killed the priests of Yahweh.
translation:
  language: zh_hans
  text: 亚比亚他告诉大卫，扫罗杀了雅威的祭司。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּגֵּד
  choice: 告诉
  rationale: 该词为 נגד 的使役词干，在这里表示“使人知道、告知”；“告诉”自然准确，也符合后接受事者的句法。
- source_word: אֶבְיָתָר
  choice: 亚比亚他
  rationale: 按现代中文圣经人名的通行音译处理。
- source_word: לְדָוִד
  choice: 大卫
  rationale: 介词 לְ 标明告知的对象；中文以“告诉大卫”自然表达。
- source_word: כִּי
  choice: （不另译）
  rationale: 此处引出所报告的内容。现代汉语在“告诉大卫”之后可直接接内容，无须添加“说”或“就是”。
- source_word: הָרַג
  choice: 杀了
  rationale: 表示已经发生的杀害行动；“了”自然标明事件已经完成，而不强行加入原文没有明说的时间副词。
- source_word: שָׁאוּל
  choice: 扫罗
  rationale: 按现代中文圣经人名的通行音译处理。
- source_word: כֹּהֲנֵי יְהוָה
  choice: 雅威的祭司
  rationale: 保留希伯来语属格结构所表达的归属关系，并采用自然的现代汉语语序。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以中文音译呈现四字神名，保留其作为以色列之上帝专名的性质，不以称号替代。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。译作“雅威”可在现代汉语中较直接地音译该专名，避免以“主”这一称号代替；“耶和华”是传统形式，但较不贴近该名通常重构的读音。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。保留原文直接陈述的力度，不增添解释性措辞。
