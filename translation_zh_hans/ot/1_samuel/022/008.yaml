base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/008.yaml
  text: For all of you have conspired against me[a], and no one informs me when my son makes a covenant with the son of Jesse, and none of you is grieved for me or informs me that my son has stirred up my servant against me to lie in wait[d][c][b], as at this day.
translation:
  language: zh_hans
  text: 因为你们全都串通起来反对我！我儿子与耶西的儿子立约，竟没有人告诉我[a]；你们没有一个人为我担忧，也没有人把我儿子唆使我的臣仆起来反对我、埋伏袭击我的事告诉我[b]，就像今天这样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语直译为“揭开我的耳朵”，是“告诉我”或“向我透露”的习语。
    reason: lexical_alternative
  - marker: b
    text: “埋伏袭击我”也可译作“设伏攻击我”或“埋伏等候攻击我”。
    reason: lexical_alternative
lexical_decisions:
- source_word: קְשַׁרְתֶּם
  choice: 串通起来反对
  rationale: 该动词在此指针对扫罗的阴谋或叛逆行动；“串通起来反对”既传达敌对合谋，也符合现代汉语口吻。
- source_word: גֹּלֶה אֶת אָזְנִי
  choice: 告诉我
  rationale: 希伯来语直译为“揭开我的耳朵”，是把消息透露给某人的习语；“告诉我”自然清楚，并以脚注保留原文意象。
- source_word: בִּכְרָת
  choice: 立约
  rationale: כרת与“约”连用时构成“立约”的固定表达；介词ב在此交代事情发生的情境。
- source_word: בְּנִי עִם בֶּן יִשַׁי
  choice: 我儿子与耶西的儿子立约
  rationale: 保留扫罗称约拿单为“我儿子”、称大卫为“耶西的儿子”的不对称说法，体现原文刻意不用大卫名字的语气。
- source_word: חֹלֶה ... עָלַי
  choice: 同情我
  rationale: 此处不是指身体患病，而是指为扫罗感到痛心、关切他；“同情我”在现代汉语中自然地传达这种情感。
- source_word: הֵקִים
  choice: 唆使……起来
  rationale: 此处在扫罗的指控中表示使某人起来与他为敌；“唆使……起来”体现他所声称的敌对煽动。
- source_word: עַבְדִּי
  choice: 我的臣仆
  rationale: 大卫是扫罗王权之下的侍从和下属；“臣仆”比“奴隶”更切合王室政治语境，同时保留从属关系。
- source_word: לְאֹרֵב
  choice: 埋伏袭击我
  rationale: 该词表达潜伏等候、伺机攻击；上下文中补出受事者“我”，使现代汉语完整自然。
- source_word: כַּיּוֹם הַזֶּה
  choice: 就像今天这样
  rationale: 该习语指眼下所呈现的局面；此译保留扫罗把指控联系到当前情势的意思。
