- from: 可是，亚希突的儿子亚希米勒有一个儿子逃了出来，名叫亚比亚他；他逃去跟随大卫[a]。
  to: 可是，亚希突的儿子亚希米勒的一个儿子逃了出来；他名叫亚比亚他，便逃去追随大卫[a]。
  rationale: 修订使父系关系在现代汉语中更清晰，并纠正脚注对希伯来文空间介词短语的“直译”表述。正文仍区分“逃了出来”和随后“逃去”的两个动词，也不把后一个短语单一限定为仅指到达某处。
