  naturalness: “亚希突的儿子亚希米勒有一个儿子逃了出来”虽可理解，却稍显绕；改为“亚希突的儿子亚希米勒的一个儿子逃了出来”更紧凑自然。用分号分隔命名与后续逃离动作，符合庄重叙事文体。
  terminology: 人名“亚希突、亚希米勒、亚比亚他”一致且合乎常见中文圣经译名。将אַחֲרֵי大卫译作“追随大卫”可保留其“往/在其后”的归附性语境；脚注保留“逃往大卫那里”这一较明确的替代译法，并说明字面措辞。
