base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/020.yaml
  text: But one son of Ahimelech son of Ahitub escaped[a], and his name was Abiathar, and he fled after David.
translation:
  language: zh_hans
  text: 可是，亚希突的儿子亚希米勒的一个儿子逃了出来；他名叫亚比亚他，便逃去追随大卫[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他逃往大卫那里。”希伯来文直译为“他逃在大卫之后”，在这里可以指前去投奔并追随大卫。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמָּלֵט
  choice: 逃了出来
  rationale: 该动词为 מלט 的尼法勒式，在上下文中表示成功逃过刚才的屠杀。“逃了出来”既自然，也明确表达脱身之意。
- source_word: בֵּן אֶחָד
  choice: 有一个儿子
  rationale: 直译为“一个儿子”。结合家谱式称谓，应保留父子关系；“有一个儿子”在现代汉语中自然，并突出了只有一人逃脱。
- source_word: לַאֲחִימֶלֶךְ בֶּן אֲחִטוּב
  choice: 亚希突的儿子亚希米勒有……
  rationale: לַאֲחִימֶלֶךְ 在这里表示归属关系。调整为自然的汉语领属结构，同时完整保留“亚希米勒是亚希突的儿子”这一身份说明。
- source_word: וּשְׁמוֹ אֶבְיָתָר
  choice: 名叫亚比亚他
  rationale: 简洁自然地表达希伯来文的命名句“他的名字是亚比亚他”。
- source_word: וַיִּבְרַח
  choice: 他逃去
  rationale: ברח 表示“逃跑、逃离”。与前面的“逃了出来”相区别：前者说明逃过屠杀，后者叙述随后逃往大卫那里。
- source_word: אַחֲרֵי דָוִד
  choice: 跟随大卫
  rationale: אַחֲרֵי 字面为“在……后面”，此处可表示追随某人、前去投奔他。“跟随大卫”保留原文的方向和归附意味，同时不把含义过度限定为单纯“到大卫那里”。
- source_word: וַ
  choice: 可是
  rationale: 句首连接词承接前文的屠杀，并带出转折：尽管众人遭杀，仍有一人逃脱。“可是”能自然体现这一叙事对比。
