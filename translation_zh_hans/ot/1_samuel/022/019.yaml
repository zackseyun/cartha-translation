  text: וְ/אֵ֨ת נֹ֤ב עִיר הַ/כֹּֽהֲנִים֙ הִכָּ֣ה לְ/פִי חֶ֔רֶב מֵ/אִישׁ֙ וְ/עַד אִשָּׁ֔ה מֵ/עוֹלֵ֖ל וְ/עַד יוֹנֵ֑ק וְ/שׁ֧וֹר וַ/חֲמ֛וֹר וָ/שֶׂ֖ה לְ/פִי חָֽרֶב־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/019.yaml
  text: And Nob[a], the city of the priests, he struck with the edge of the sword, from man to woman, from child to nursing infant, and ox and donkey and sheep, with the edge of the sword.
translation:
  language: zh_hans
  text: 他又用刀[a]杀了祭司城挪伯的人，从男人到女人，从孩童到吃奶的婴儿；牛、驴和羊也都被他用刀杀了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“按刀口”，是指用刀杀死的惯用语。
    reason: 说明希伯来语刀剑惯用表达的字面意象；正文采用自然的现代汉语。
lexical_decisions:
- source_word: נֹב
  choice: 挪伯
  rationale: 专有地名，采用现代中文圣经中通行且易于辨认的音译。
- source_word: עִיר הַכֹּהֲנִים
  choice: 祭司城
  rationale: 这是一个修饰挪伯的领属或特征性短语；“祭司城”简洁自然，表达挪伯是祭司居住并以祭司为特征的城。
- source_word: הִכָּה
  choice: 杀了
  rationale: נכה本义范围较广，可指击打、击杀；本节两次出现“用刀”的表达，且对象包括全城人口和牲畜，语境明确指致死，因此译为自然明确的“杀了”。
- source_word: לְפִי חֶרֶב / לְפִי חָרֶב
  choice: 用刀
  rationale: 该短语字面涉及“刀口”，是指用刀杀死的希伯来语惯用表达。“用刀”在现代汉语中自然清楚；正文保留首尾重复，以呈现原文对彻底杀戮的强调。
- source_word: מֵאִישׁ וְעַד אִשָּׁה
  choice: 从男人到女人
  rationale: 保留希伯来文单数分配式结构及涵盖两性的首尾表达，说明杀戮不分男女。
- source_word: מֵעוֹלֵל וְעַד יוֹנֵק
  choice: 从孩童到吃奶的婴儿
  rationale: עוֹלֵל指年幼孩童，יוֹנֵק指仍在吃奶的婴儿；此译保留原文的递进和无差别杀戮所带来的沉重感。
- source_word: וְשׁוֹר וַחֲמוֹר וָשֶׂה
  choice: 牛、驴和羊
  rationale: 按原文逐项列出家畜。שֶׂה可指绵羊或山羊中的小型牲畜，此处用概括而自然的“羊”，不作超出语境的细分。
theological_decisions:
- issue: 男女用语构成涵盖全体的首尾表达
  choice: 从男人到女人
  alternative: 男女老少
  rationale: 原文分别使用“男人”和“女人”的单数名词，功能上表示无一幸免。保留其形式，避免把后面的年龄组也提前并入概括语而削弱原文层次。
- issue: 屠城公式的形式保留程度
  choice: 两次保留“用刀杀”的表达，并依原次序列出人和牲畜
  alternative: 合并为一次“全部杀尽”
  rationale: 原文重复刀剑惯用语，强化杀戮的全面性和沉重感；正文保留这一重复，而不额外作神学解释或道德评断。
- issue: 语法主语的指称
  choice: 保留为“他”
  alternative: 明确写作“多益”或“扫罗”
  rationale: 希伯来文本节的主语隐含在动词中，须由上下文判断。译文用“他”保留原文的衔接方式，避免在本节内加入原文未明说的专名。
translation_notes:
  register: 采用现代、庄重而直接的叙事语言。“祭司城挪伯”保持原文同位修饰关系；为使中文明确自然，在“挪伯”后补出“的人”。分号区分人和牲畜两组受害对象，同时保留原文末尾再次提到用刀杀戮的强调。
