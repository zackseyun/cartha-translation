  text: וַ/יֵּ֧לֶךְ דָּוִ֛ד מִ/שָּׁ֖ם מִצְפֵּ֣ה מוֹאָ֑ב וַ/יֹּ֣אמֶר אֶל מֶ֣לֶךְ מוֹאָ֗ב יֵֽצֵא נָ֞א אָבִ֤/י וְ/אִמִּ/י֙ אִתְּ/כֶ֔ם עַ֚ד אֲשֶׁ֣ר אֵדַ֔ע מַה יַּֽעֲשֶׂה לִּ֖/י אֱלֹהִֽים׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/003.yaml
  text: Then David went from there to Mizpeh of Moab[a], and he said to the king of Moab[b], “Please let my father and my mother come out and stay with you until I know what God will do for me.”
translation:
  language: zh_hans
  text: 大卫从那里往摩押的米斯巴去，对摩押王说：“请准许我父亲和母亲出来，留在你们那里[a]，等我知道神要为我做什么[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“请准许我父亲和母亲到你们那里去”。希伯来语动词直译为“出来／出去”；按上下文，这项请求是要让他们留在摩押王那里受照顾。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“神要对我做什么”或“神要在我身上做什么”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: 去
  rationale: 该叙事性动词表示接续发生的移动；“去”在现代汉语叙事中自然简洁。
- source_word: מִשָּׁם
  choice: 从那里
  rationale: 直接表达起点，清楚保留原文的方位关系。
- source_word: מִצְפֵּה מוֹאָב
  choice: 摩押的米斯巴
  rationale: 按希伯来语读音音译地名，并以“摩押的”标明所属地区。
- source_word: מֶלֶךְ מוֹאָב
  choice: 摩押王
  rationale: 自然、准确地表达该结构短语所指的摩押统治者。
- source_word: יֵצֵא נָא
  choice: 请让……出来
  rationale: 保留 יצא“出来／出去”的基本动作含义；“请让”体现 נָא 所带的请求语气。
- source_word: אָבִי וְאִמִּי
  choice: 我父母
  rationale: 现代汉语以“父母”自然涵盖原文明确并列的“我父亲和我母亲”，不改变所指。
- source_word: אִתְּכֶם
  choice: 和你们住在一起
  rationale: 原文直译为“与你们同在”；结合请求的实际内容，译文自然表达让父母留在对方那里受照顾。复数“你们”也保留了希伯来语代词的数。
- source_word: עַד אֲשֶׁר אֵדַע
  choice: 等我知道
  rationale: 自然表达原文的时间界限：“直到我知道”。
- source_word: מַה יַּעֲשֶׂה לִּי אֱלֹהִים
  choice: 神要为我做什么
  rationale: “为我”是 לִי 在此语境中的自然译法，表达大卫等候神对他处境的安排；脚注保留“对我／在我身上”的开放可能。
theological_decisions:
- issue: 大卫话语中 אֱלֹהִים 的译法
  choice: 神
  alternative: 诸神／一位神
  rationale: 该词形式上为复数，但搭配单数动词，并在叙事语境中指以色列的神；译作“神”符合希伯来语惯用法，同时不增添宗派性称谓。
- issue: לִי 所表达的神与大卫之间的行动关系
  choice: 神要为我做什么
  alternative: 神要对我做什么／神要在我身上做什么
  rationale: 希伯来介词 לְ 在这里具有一定开放性。“为我”较符合大卫等候神引导和安排的语境，但不应排除行动临到他或发生在他身上的含义，因此以脚注保存歧义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“摩押王”保持简洁的圣经叙事风格；引语中的“请”体现恳求语气。“和你们住在一起”避免生硬直译“与你们同在”，同时以脚注交代原词的动作含义。
