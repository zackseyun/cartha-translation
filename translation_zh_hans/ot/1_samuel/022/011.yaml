- from: 于是，王派人召亚希突的儿子、祭司亚希米勒，以及他父家所有在挪伯作祭司的人[a]；他们就全都来到王那里。
  to: 于是，王派人去召祭司亚希米勒，就是亚希突的儿子，以及他父家所有在挪伯的祭司[a]；他们全都来到王那里。
  rationale: 调整同位语为“祭司亚希米勒，就是亚希突的儿子”，清楚表明祭司身份属于亚希米勒；将后段改为“他父家所有在挪伯的祭司”，以自然中文表达原文对其父家成员的进一步限定。保留“全都”以体现“כולם”的全体强调，保留脚注锚点并澄清“父家”的范围。
