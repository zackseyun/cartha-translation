base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/011.yaml
  text: Then the king sent to summon Ahimelech son of Ahitub the priest[a], and all his father's house, the priests who were at Nob; and they all came to the king.
translation:
  language: zh_hans
  text: 于是，王派人去召祭司亚希米勒，就是亚希突的儿子，以及他父家所有在挪伯的祭司[a]；他们全都来到王那里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “父家”指他的父系大家庭或宗族，不仅是他的直系家人。
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁלַח הַמֶּלֶךְ לִקְרֹא
  choice: 王派人召
  rationale: שׁלח与不定式קרא连用，表示王差人正式传召；“派人召”简洁自然，也保留王命召见的语境。
- source_word: אֲחִימֶלֶךְ בֶּן אֲחִיטוּב הַכֹּהֵן
  choice: 亚希突的儿子、祭司亚希米勒
  rationale: 按希伯来语的同位结构交代父子关系与职分；人名采用现代中文圣经中通行且清楚的音译。
- source_word: כָּל בֵּית אָבִיו
  choice: 他父家所有……的人
  rationale: בֵּית אָב指父系大家庭或宗族单位，不只核心家庭；正文保留“父家”这一文化表达，并以脚注说明范围。
- source_word: הַכֹּהֲנִים אֲשֶׁר בְּנֹב
  choice: 在挪伯作祭司的人
  rationale: 该短语说明父家成员的祭司身份及所在之处；这样处理比生硬的“在挪伯的祭司们”更符合现代汉语。
- source_word: וַיָּבֹאוּ כֻלָּם אֶל הַמֶּלֶךְ
  choice: 他们就全都来到王那里
  rationale: “全都”体现כֻלָּם对全体到场的强调；“来到王那里”直接对应向王而来的动作，不额外加入“站在王面前”等含义。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“于是……就……”承接上下文并呈现连续动作；正文保留“父家”这一具有古代以色列社会背景的用语，以脚注避免现代读者误解。
