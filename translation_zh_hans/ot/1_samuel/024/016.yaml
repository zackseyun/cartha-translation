  text: וְ/הָיָ֤ה יְהוָה֙ לְ/דַיָּ֔ן וְ/שָׁפַ֖ט בֵּינִ֣/י וּ/בֵינֶ֑/ךָ וְ/יֵ֨רֶא֙ וְ/יָרֵ֣ב אֶת רִיבִ֔/י וְ/יִשְׁפְּטֵ֖/נִי מִ/יָּדֶֽ/ךָ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/016.yaml
  text: May the LORD be judge and decide between me and you, see and plead my case, and vindicate me from your hand.
translation:
  language: zh_hans
  text: 愿耶和华作审判者，在你我之间作出裁决；愿他察看，为我的案件申辩，为我伸冤，使我脱离你的手。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名表达以色列之神的圣名，区别于普通称谓“主”。
- source_word: לְדַיָּן
  choice: 作审判者
  rationale: 保留法律语境及名词“审判者”的身份含义。
- source_word: וְשָׁפַט בֵּינִי וּבֵינֶךָ
  choice: 在你我之间作出裁决
  rationale: 这里指对双方争议作出判定；“作出裁决”比重复使用“审判”更自然，同时保留司法含义。
- source_word: וְיֵרֶא
  choice: 愿他察看
  rationale: 保留原文“看”的意象，并以“察看”体现审理案情的语境。
- source_word: וְיָרֵב אֶת רִיבִי
  choice: 为我的案件申辩
  rationale: ריב兼有争讼、案件及争辩之意；该译法保留法庭图景，又符合现代汉语表达。
- source_word: וְיִשְׁפְּטֵנִי מִיָּדֶךָ
  choice: 为我伸冤，使我脱离你的手
  rationale: 原句表示通过审判使说话者摆脱对方权势；“伸冤”传达有利裁断，“脱离你的手”保留原文具体比喻。
theological_decisions:
- issue: 祈愿与断言之间的语气
  choice: 全句采用“愿”表达祈愿
  alternative: 译作确定陈述：“耶和华必作审判者……”
  rationale: 希伯来语形式可带将来或祈愿色彩；结合大卫向扫罗发言的上下文及后续并列动词，祈愿语气更顺畅，但不增添神学上的必然性判断。
- issue: וְיִשְׁפְּטֵנִי 的裁决方向
  choice: 译为“为我伸冤”
  alternative: 直译为“审判我”
  rationale: 介词短语“脱离你的手”表明所求的是有利裁决或昭雪；译为“伸冤”呈现语境含义，同时不把它扩展为特定的救赎教义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语，保留原文连续的法庭意象；通过“审判者—裁决—案件申辩—伸冤”呈现修辞推进，避免生硬重复。
