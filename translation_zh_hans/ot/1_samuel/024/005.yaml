revisions:
- from: 大卫的手下对他说：“看，这就是耶和华曾对你说的那一天：‘看，我正把你的仇敌交在你手中，你可以照自己看为好的[a]待他。’”于是大卫起身，暗暗割下扫罗外袍的一角。
  to: 大卫的手下对他说：“看，今日正是耶和华曾对你说的那日：‘看，我正把你的仇敌交在你手中；你可以按自己看为好的方式待他。’”于是大卫起身，暗暗割下扫罗外袍的一角。
  rationale: 修订仅处理现代汉语的句法和搭配问题：以“今日正是……那日”准确、自然地表达原文所说的特定日子，并以“按……方式待他”厘清方式短语。保留耶和华之名、引语中的两次“看”、分词的生动语气、许可性的“可以”、以及手下所报告之话本身的叙事张力。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T05:26:32Z'
review_pass:
  verdict: revise
  source_fidelity: 译文整体忠实反映希伯来文的叙事顺序、两次强调词、单数“仇敌”、交在手中的意象、许可语气，以及大卫秘密割下扫罗外袍边角的行动。惟“看，这就是耶和华曾对你说的那一天”在汉语中搭配不顺，且“对你说的那一天”容易令人误解为耶和华曾谈论某个日期，而非手下所指称的“那日”。
  naturalness: “这就是……那一天”及“对你说的那一天”不符合自然现代汉语。改为“看，今日正是耶和华曾对你说的那日”既庄重自然，也准确表达关系从句。将“照自己看为好的待他”调整为“按自己看为好的方式待他”，使方式状语与“待他”的关系更明确。
  terminology: “耶和华”“仇敌”“交在你手中”“外袍的一角”均恰当。“耶和华曾对你说的那日”保留引语作为大卫手下之主张，不把它改写为叙述者确认的应许。
  issues:
  - severity: medium
    issue: “这就是耶和华曾对你说的那一天”表达生硬且关系指向含混。
    rationale: 原文意为“看，今日就是耶和华曾对你说的那日”；中文应以“今日正是……那日”表达该日与先前所说之日的对应。
  - severity: low
    issue: “照自己看为好的待他”方式修饰关系略不清晰。
    rationale: 补出“方式”后，可自然表达“照你自己看为好的方式对待他”，同时保留原文“在你眼中为好”的判断意象。
  revised_text: 大卫的手下对他说：“看，今日正是耶和华曾对你说的那日：‘看，我正把你的仇敌交在你手中；你可以按自己看为好的方式待他。’”于是大卫起身，暗暗割下扫罗外袍的一角。
  revised_footnotes:
  - marker: a
    text: 或译：“随你的意思待他。”
    reason: 说明“按自己看为好的方式待他”所表达的希伯来语习语的自然汉语含义；正文则保留“看为好”的判断意象。
  revision_rationale: 修订仅处理现代汉语的句法和搭配问题：以“今日正是……那日”准确、自然地表达原文所说的特定日子，并以“按……方式待他”厘清方式短语。保留耶和华之名、引语中的两次“看”、分词的生动语气、许可性的“可以”、以及手下所报告之话本身的叙事张力。
