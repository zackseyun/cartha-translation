  text: וַ/יֹּאמְרוּ֩ אַנְשֵׁ֨י דָוִ֜ד אֵלָ֗י/ו הִנֵּ֨ה הַ/יּ֜וֹם אֲֽשֶׁר אָמַ֧ר יְהוָ֣ה אֵלֶ֗י/ךָ הִנֵּ֨ה אָנֹכִ֜י נֹתֵ֤ן אֶת איבי/ך בְּ/יָדֶ֔/ךָ וְ/עָשִׂ֣יתָ לּ֔/וֹ כַּ/אֲשֶׁ֖ר יִטַ֣ב בְּ/עֵינֶ֑י/ךָ וַ/יָּ֣קָם דָּוִ֗ד וַ/יִּכְרֹ֛ת אֶת כְּנַֽף הַ/מְּעִ֥יל אֲשֶׁר לְ/שָׁא֖וּל בַּ/לָּֽט־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/005.yaml
  text: Then David’s men said to him[a], “Look, this is the day of which Yahweh said to you, ‘Look, I am giving your enemy into your hand, and you may do to him as seems good in your eyes.’” Then David arose and secretly cut off the corner of Saul’s robe.
translation:
  language: zh_hans
  text: 大卫的手下对他说：“看，今日正是耶和华曾对你说的那日：‘看，我正把你的仇敌交在你手中；你可以按自己看为好的方式待他。’”于是大卫起身，暗暗割下扫罗外袍的一角。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמְרוּ אַנְשֵׁי דָוִד
  choice: 大卫的手下对他说
  rationale: “大卫的手下”自然表达构造短语所指的跟随者；叙事连接词不机械译作“然后”，以符合现代汉语行文。
- source_word: הִנֵּה
  choice: 看
  rationale: 原文两次使用该词加强指示和强调；译作“看”既保留其话语功能，也避免古雅的“看哪”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神名音译，同时明确保留原文专名。
- source_word: הִנֵּה אָנֹכִי נֹתֵן
  choice: 看，我正把……交在
  rationale: “正”体现分词所具有的生动、临近或正在实现的意味；“交在你手中”保留希伯来语有关掌控权的意象。
- source_word: אֹיִבְךָ
  choice: 你的仇敌
  rationale: 上下文及后续单数代词均指扫罗一人，因此采用单数。
- source_word: וְעָשִׂיתָ לּוֹ
  choice: 你可以……待他
  rationale: 这里表达交付之后获准采取行动，并非明确命令；“待他”在汉语中自然承接后面的方式短语。
- source_word: כַּאֲשֶׁר יִטַב בְּעֵינֶיךָ
  choice: 照自己看为好的
  rationale: 保留“在眼中看为好”的希伯来语判断意象，同时调整为可懂的现代汉语；更口语化的意义见脚注。
- source_word: וַיָּקָם דָּוִד
  choice: 于是大卫起身
  rationale: “于是”推进叙事次序，“起身”自然准确地表达动作。
- source_word: בַּלָּט
  choice: 暗暗
  rationale: 表达隐秘、未被察觉地行动，语体简洁庄重。
- source_word: כְּנַף הַמְּעִיל
  choice: 外袍的一角
  rationale: כְּנַף在衣物语境中指边角或衣襟；“一角”与割下的具体动作吻合，מְּעִיל译作“外袍”。
theological_decisions:
- issue: 这段所谓耶和华先前的话，是确有其事的神谕，还是大卫手下对处境的解释
  choice: 按叙事原样译成手下所说的直接引语，不添加作者认可或质疑的措辞
  alternative: 译成“耶和华所应许的日子”，或加上“他们以为”等距离性措辞
  rationale: 希伯来文只报告大卫手下的说法，并未在此说明其判断是否准确。译文保留这一叙事和神学张力，不替叙述者作结论。
- issue: וְעָשִׂיתָ לּוֹ在引语中是许可、命令还是预告
  choice: 译作“你可以……待他”，表达许可或机会
  alternative: 译作“你要……待他”或“你必……待他”
  rationale: 上下文强调仇敌被交在大卫手中后可按其判断行事；采用“可以”避免把手下的话强化成神的明确命令或预言。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。直接引语保留两次“看”的强调作用；正文不使用过度古雅的“看哪”“衣裳”等表达，也不对大卫手下所引述之话的真实性作额外判断。
