id: 1SA.24.21
reference: 1 Samuel 24:21
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/עַתָּה֙ הִנֵּ֣ה יָדַ֔עְתִּי כִּ֥י מָלֹ֖ךְ תִּמְל֑וֹךְ וְ/קָ֨מָה֙ בְּ/יָ֣דְ/ךָ֔ מַמְלֶ֖כֶת יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/021.yaml
  text: And now, look, I know that you will surely reign, and the kingdom of Israel will be established in your hand.
translation:
  language: zh_hans
  text: 现在，看哪，我知道你必定作王，以色列的国也必在你手中得以坚立。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: 现在
  rationale: 承接前文并转入扫罗的郑重结论；现代汉语中“现在”比“如今”更直接自然。
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留希伯来语提示听者注意的语气，也维持叙事中的庄重感。
- source_word: מָלֹךְ תִּמְלוֹךְ
  choice: 必定作王
  rationale: 同词根不定式绝对形加限定动词表示强烈肯定；译为“必定”传达其强调。
- source_word: וְקָמָה
  choice: 也必……得以坚立
  rationale: 该动词在此指王国被建立、确立或稳固；“得以坚立”兼顾建立与稳固的语义。
- source_word: בְּיָדְךָ
  choice: 在你手中
  rationale: 保留原文惯用意象，表示处于大卫的掌权和治理之下。
- source_word: מַמְלֶכֶת יִשְׂרָאֵל
  choice: 以色列的国
  rationale: 自然表达以色列的王国或王权实体，同时避免把含义局限为抽象的“王权”。
theological_decisions:
- issue: 扫罗对大卫将要作王之事的确认
  choice: 保留“我知道你必定作王”的明确断言
  alternative: 弱化为“我想你会作王”或“你很可能作王”
  rationale: 原文 יָדַעְתִּי 与强调结构 מָלֹךְ תִּמְלוֹךְ 都表达确定性，不应削弱。
- issue: 王国“在你手中”的含义
  choice: 保留权柄意象，不补入神学解释
  alternative: 译作“上帝必把以色列国交给你”
  rationale: 上下文可涉及神的旨意，但本节原文没有明说施事者；不应在正文中增补。
translation_notes:
  register: 采用庄重而清楚的现代标准普通话。“看哪”略带经文体色彩，但准确保留 הִנֵּה 的注意提示功能；整句维持扫罗郑重承认大卫王位将确立的语气。
