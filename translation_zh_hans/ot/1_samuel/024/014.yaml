  text: As the ancient proverb says[a], ‘Wickedness comes out from the wicked,’ but my hand will not be against you.
translation:
  language: zh_hans
  text: 正如古老的谚语所说[a]：“恶行出于恶人。”但我必不下手害你。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“正如古人的谚语所说。”希伯来语中的这个形容词既可理解为“古老的”，也可理解为指“古人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר יֹאמַר
  choice: 正如……所说
  rationale: 这是引述传统格言的套语；未完成式在此表达一般、恒常的说法，现代汉语用“所说”自然贴切。
- source_word: מְשַׁל
  choice: 谚语
  rationale: 此处指简短的传统道德格言，并非篇幅较长的比喻或寓言。
- source_word: הַקַּדְמֹנִי
  choice: 古老的
  rationale: 形容这句谚语源远流长；原词也可能实质化地指“古人”，因此保留脚注说明另一种理解。
- source_word: מֵרְשָׁעִים יֵצֵא רֶשַׁע
  choice: 恶行出于恶人
  rationale: 介词表达来源，动词表达从某处发出；“恶行／恶人”既简洁自然，也尽量再现原文 רֶשַׁע／רְשָׁעִים 的词根呼应。
- source_word: וְיָדִי לֹא תִהְיֶה בָּךְ
  choice: 但我必不下手害你
  rationale: 连接词在语境中表达转折。“下手害你”以自然的现代汉语传达“我的手不在／不敌对你”的身体隐喻及敌对行动之意。
