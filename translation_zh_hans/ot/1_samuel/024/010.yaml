base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/010.yaml
  text: And David said to Saul[a], “Why do you listen to the words of a man who says, ‘Look[b], David is seeking your harm’?”
translation:
  language: zh_hans
  text: 大卫对扫罗说：“你为什么听信人所说的话：‘看哪，大卫正图谋加害你’？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר דָּוִד לְשָׁאוּל
  choice: 大卫对扫罗说
  rationale: 以现代汉语自然叙事表达希伯来语连续叙事形式；לְ 标明说话对象。
- source_word: תִשְׁמַע
  choice: 听信
  rationale: 此处 שׁמע 不仅指听见，更指听从、采信，因此译作“听信”符合大卫质问扫罗轻信指控的语境。
- source_word: דִּבְרֵי אָדָם
  choice: 人的话
  rationale: אָדָם 为单数，但可泛指人；汉语“人的话”既保留形式上的单数/类指开放性，也不武断限定为某一个已知的控告者。
- source_word: לֵאמֹר
  choice: 说
  rationale: 引出所听信之话的内容；汉语用“说”简洁自然，并保留其可修饰前述言语或说话者的句法宽度。
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留提示注意和强调的语气，同时采用庄重而仍易懂的圣经汉语表达。
- source_word: מְבַקֵּשׁ
  choice: 正图谋
  rationale: 分词表示持续或当前意图；“正”体现延续性，“图谋”传达寻求对方祸害的敌对意图。
- source_word: רָעָתֶךָ
  choice: 加害你
  rationale: רָעָה 在此指临到扫罗的祸害或伤害，而非抽象道德之恶；动词化处理使现代汉语自然。
theological_decisions:
- issue: אָדָם 是特指一个男人还是泛指人
  choice: 人的话
  alternative: 一个人的话
  rationale: 希伯来语虽为单数，却可有类指意义；上下文未明确确认某一特定控告者。译文保留这种歧义，不将其擅自确定为单独一人或多人。
- issue: רָעָתֶךָ 的意义
  choice: 加害你
  alternative: 谋求你的祸患／寻求恶事攻击你
  rationale: 此处是别人指控大卫意图伤害扫罗；“加害你”表达语境中的关系性伤害，同时避免把 רָעָה 仅限为抽象的道德邪恶。
translation_notes:
  register: 采用现代、庄重、口语可懂的叙事语言。“听信”准确体现采信他人言论；“人的话”保留希伯来语单数可能具有泛指意义的张力；全节无需脚注即可较完整呈现原文。
