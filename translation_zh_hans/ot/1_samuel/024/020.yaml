  text: וְ/כִֽי יִמְצָ֥א אִישׁ֙ אֶת אֹ֣יְב֔/וֹ וְ/שִׁלְּח֖/וֹ בְּ/דֶ֣רֶךְ טוֹבָ֑ה וַֽ/יהוָה֙ יְשַׁלֶּמְ/ךָ֣ טוֹבָ֔ה תַּ֚חַת הַ/יּ֣וֹם הַ/זֶּ֔ה אֲשֶׁ֥ר עָשִׂ֖יתָה לִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/020.yaml
  text: For when a man finds his enemy and lets him go on his way safely[b][a], may Yahweh repay you with good for what you have done to me this day.
translation:
  language: zh_hans
  text: 因为一个人若遇见自己的仇敌，哪会让他平安离去呢？[a] 愿雅威因你今天这样待我，以善报答你。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为一个人若遇见自己的仇敌，还会让他安然上路吗？”原文直译为“在一条好的路上”，意思是让他安全、无害地离开。
    reason: lexical_alternative
  - marker: b
    text: 或译：“雅威必因你今天这样待我，以善报答你。”原文形式既可理解为祝愿，也可理解为预告。
    reason: alternative_reading
lexical_decisions:
- source_word: וְכִי יִמְצָא אִישׁ אֶת אֹיְבוֹ
  choice: 因为一个人若遇见自己的仇敌
  rationale: וְכִי 在上下文中承接前文并引出一般性的反问；“一个人”保留 אִישׁ 的单数通称形式，“自己的仇敌”自然表达后缀关系。
- source_word: וְשִׁלְּחוֹ בְּדֶרֶךְ טוֹבָה
  choice: 哪会让他平安离去呢？
  rationale: 结合语境将并列结构表达为反问，符合扫罗强调大卫反常善待仇敌的意思；“平安离去”传达字面“在一条好的路上”的安全、无害离开之意。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语通行音译呈现四字神名，保留其作为专名的性质，不以称号替代。
- source_word: יְשַׁלֶּמְךָ טוֹבָה
  choice: 愿……以善报答你
  rationale: 将未完成式理解为祝愿，同时保留 שׁלם 的报偿含义和 טוֹבָה 的“善”。
- source_word: תַּחַת הַיּוֹם הַזֶּה אֲשֶׁר עָשִׂיתָה לִי
  choice: 因你今天这样待我
  rationale: תַּחַת 表示相应的回报依据；“这样待我”自然保留大卫当日对扫罗所做之事及扫罗作为受益者的关系。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华／上主
  rationale: 原文直接使用四字神名，因此以专名音译，避免用称号取代。
- issue: יְשַׁלֶּמְךָ 的语气
  choice: 愿雅威……报答你
  alternative: 雅威必……报答你
  rationale: 该未完成式在扫罗的话中可作祝愿，也可作预告；正文采用自然的祝福语气，并以脚注保留陈述式可能。
- issue: 前半句的语用形式
  choice: 反问句
  alternative: 条件陈述句
  rationale: 希伯来语形式可直译为“若有人遇见仇敌，却让他……”，但上下文明显带有反问力量；中文用“哪会……呢”自然呈现，同时脚注保留较形式对应的译法。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“哪会……呢”呈现原句在语境中的反问意味；“平安离去”避免生硬直译，同时用脚注说明“好的路”这一原文意象。所有脚注标记均置于相关正文之后。
