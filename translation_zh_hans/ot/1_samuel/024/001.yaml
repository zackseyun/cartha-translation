lexical_decisions:
- source_word: וַיַּעַל
  choice: 上去
  rationale: 保留עלה所表达的向上移动；“上去”在现代汉语叙事中自然、明确。
- source_word: מִשָּׁם
  choice: 从那里
  rationale: 直接对应这一指示性地点副词，表达自然简洁。
- source_word: וַיֵּשֶׁב
  choice: 住在
  rationale: ישב在此表示停留、居住；“住在”既符合现代汉语，也不必暗示永久定居。
- source_word: בִּמְצָדוֹת
  choice: 在……山寨里
  rationale: מְצָדוֹת指可供防守的据点或避难地；“山寨”适合此处旷野山区的语境，又避免“堡垒”过度暗示人工修筑的军事建筑。
- source_word: עֵין גֶּדִי
  choice: 隐·基底
  rationale: 按中文圣经地名的通行音译处理，并以间隔号标示复合地名。
