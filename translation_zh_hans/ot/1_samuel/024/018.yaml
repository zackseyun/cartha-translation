  yaml_path: translation/ot/1_samuel/024/018.yaml
  text: And he said to David[a], “You are more righteous than I, for you have repaid me with good, while I have repaid you with evil.”
translation:
  language: zh_hans
  text: 他对大卫说：“你比我更公义[a]，因为你以善待我，我却以恶待你。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你比我更有理。”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֶל־דָּוִד
  choice: 他对大卫说
  rationale: 以现代汉语常见的叙事表达呈现 wayyiqtol；保留原文的代词“他”，不把上下文中的说话者“扫罗”明写出来。
- source_word: צַדִּיק אַתָּה מִמֶּנִּי
  choice: 你比我公义
  rationale: צַדִּיק既可指道德上的公义，也可指在具体争议中更占理；正文保留其道德分量，脚注说明语境性译法。
- source_word: כִּי
  choice: 因为
  rationale: 引出前述判断的理由；“因为”在现代汉语中自然清楚。
- source_word: גְּמַלְתַּנִי הַטּוֹבָה
  choice: 你以善待我
  rationale: גמל在此表示按某种行为对待或回报；“以善待我”既保留“善”的宽泛意义，又避免汉语“报答”通常带有正面含义所造成的不对称。
- source_word: וַאֲנִי
  choice: 我却
  rationale: 连接词在平行分句中具有明显对比作用，“却”自然呈现这种反差。
- source_word: גְּמַלְתִּיךָ הָרָעָה
  choice: 以恶待你
  rationale: 与前句采用同一结构，保留原文的词汇重复以及“善／恶”的鲜明对照。
theological_decisions:
- issue: צַדִּיק是总体道德评价，还是就当前事件判定谁更占理
  choice: 正文译作“你比我公义”
  alternative: “你比我更有理”
  rationale: 原词具有“公义”和“占理”的语义张力；正文保留较广的道德含义，脚注保留较具体的司法或争议语境含义，不把扫罗的承认限定为单一解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“以善待我／以恶待你”略带书面色彩，但结构清楚，并能保留希伯来文的平行与对照。
