    rationale: 原文先写大卫低头、脸朝地（וַיִּקֹּד אַפַּיִם אַרְצָה），再写他俯伏（וַיִּשְׁתָּחוּ）。改为“低头，脸朝着地，俯伏下拜”可保留两个连续动作。
