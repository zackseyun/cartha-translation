base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/009.yaml
  text: After that David rose and went out of the cave[a], and called after Saul, saying, “My lord the king!” When Saul looked behind him, David bowed with his face to the ground and prostrated himself.
translation:
  language: zh_hans
  text: 这事以后，大卫起来，出了洞穴，向扫罗呼喊说：“我主，我王啊！”扫罗回头看时，大卫就低头，脸朝着地，俯伏下拜[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“俯伏致敬”。这里的希伯来语动词可指深深俯伏，表示尊敬或臣服；本节是大卫在扫罗面前所取的姿势，并非把扫罗当作神来敬拜。
    reason: 说明该动词可表示对人的深度致敬，避免误解为对扫罗的神性敬拜。
lexical_decisions:
- source_word: וַיָּקָם
  choice: 起来
  rationale: קום的Qal叙事形式表示起身或起来；“起来”自然简洁，也保留动作的起点。
- source_word: אַחֲרֵי כֵן
  choice: 这事以后
  rationale: 该时间短语承接前文，表示事件先后；“这事以后”既清楚又符合叙事语体。
- source_word: וַיֵּצֵא מִן־הַמְּעָרָה
  choice: 出了洞
  rationale: יצא表示从某处出去；结合מן־המערה，直译为“出了洞”自然明确。
- source_word: וַיִּקְרָא אַחֲרֵי שָׁאוּל
  choice: 在扫罗身后呼喊
  rationale: קרא与אַחֲרֵי连用，描写向正在前方离去的人呼喊；此译保留空间关系，又符合现代汉语。
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: 我主，我王
  rationale: אֲדֹנִי是表示敬意的称呼，הַמֶּלֶךְ是王的头衔；分作两个呼语，在汉语中庄重自然，并保留大卫对扫罗的臣属敬意。
- source_word: וַיַּבֵּט שָׁאוּל אַחֲרָיו
  choice: 扫罗回头看时
  rationale: נבט表示观看，אַחֲרָיו指向身后；“回头看”自然表达该动作，“时”则清楚连接随后的举动。
- source_word: וַיִּקֹּד אַפַּיִם אַרְצָה
  choice: 面伏于地
  rationale: קדד表示屈身低头，אַפַּיִם אַרְצָה字面为“脸朝向地”；“面伏于地”凝练地呈现深度躬身的姿势。
- source_word: וַיִּשְׁתָּחוּ
  choice: 俯伏下拜
  rationale: שׁחה的此形式表示俯伏致敬或敬拜；在本处对象是扫罗，“俯伏下拜”保留身体动作和郑重敬意，同时不直接断定为对神的敬拜。
theological_decisions:
- issue: 大卫向扫罗俯伏这一动作的性质
  choice: 译作对君王深度致敬、表示臣服的身体动作
  alternative: 译作“敬拜他”或仅译作“向他致敬”
  rationale: שׁחה可按语境指向神敬拜，也可指向人俯伏致敬。本节对象是扫罗，因此不宜暗示大卫把扫罗当作神来敬拜；但也不应弱化原文所描写的深度俯伏。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“我主，我王”保留臣属对君王的恭敬称呼；“面伏于地，俯伏下拜”有意保留原文两个相连动作的力度与层次。
