base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/022.yaml
  text: Now swear to me by Yahweh that you will not cut off my descendants after me[c][b][a], and that you will not wipe out my name from my father's house.
translation:
  language: zh_hans
  text: 现在，请你指着雅威向我起誓：绝不[a]在我死后剪除我的后裔[b]，也绝不从我父家中抹掉我的名[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语在此誓言格式中直译为“如果”；按上下文，这里引出扫罗要大卫起誓承诺的内容，即“绝不”这样做。
    reason: lexical_alternative
  - marker: b
    text: “后裔”也可译作“子孙”；原词字面意思是“种子”。
    reason: lexical_alternative
  - marker: c
    text: 这里的“名”指扫罗在宗族中得以延续、被人记念的家族名号和身份。
    reason: cultural_note
lexical_decisions:
- source_word: וְעַתָּה
  choice: 现在
  rationale: 这是引出扫罗最后请求的话语标记；“现在”符合现代汉语表达。
- source_word: הִשָּׁבְעָה לִּי
  choice: 请你向我起誓
  rationale: שבע 的尼法勒命令式要求对方立誓；加入“请”自然传达请求语气，不削弱命令式的郑重。
- source_word: בַּיהוָה
  choice: 指着雅威
  rationale: 这是调用神圣之名的起誓格式；现代汉语通常说“指着……起誓”。
- source_word: אִם ... וְאִם
  choice: 绝不……也绝不
  rationale: 这里的 אִם 属于希伯来语誓言格式，在上下文中引出扫罗要求大卫承诺的内容；汉语需明确表达否定誓约。
- source_word: תַכְרִית
  choice: 剪除
  rationale: כרת 的使役形在涉及家族后裔时表示彻底断绝、除掉；“剪除”既保留原文意象，也适合庄重叙事。
- source_word: זַרְעִי
  choice: 我的后裔
  rationale: זֶרַע 在此不是字面上的种子，而是指子孙和家族延续；“后裔”准确且庄重。
- source_word: אַחֲרַי
  choice: 在我死后
  rationale: 此处主要是时间意义，指扫罗不在以后；如此译法比直译“在我之后”更自然清楚。
- source_word: תַשְׁמִיד
  choice: 除灭
  rationale: שמד 的使役形表示毁灭、消除；“除灭”保留其强烈程度，并与抹去家族名号的语境相称。
- source_word: שְׁמִי
  choice: 我的名
  rationale: 保留“名”的表达，因为这里兼指扫罗被记念的身份以及家族名号的延续。
- source_word: מִבֵּית אָבִי
  choice: 从我父家
  rationale: “父家”保留古代以父系家族或宗族为单位的亲属结构，在现代中文圣经叙事中也可理解。
theological_decisions:
- issue: 誓言中神圣之名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”按较通行的学术重构音译该盟约之名，而不以称号替代。
- issue: 誓言格式 אִם 的否定含义
  choice: 译为“绝不”
  alternative: 形式直译为“如果”
  rationale: 这里并非普通条件句，而是古希伯来誓言格式。结合扫罗要求大卫保证保全其后裔的上下文，汉语用“绝不”才能传达誓言内容，同时以脚注说明原文形式。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“剪除”“除灭”“父家”略带经文语体，以保留原文的强度、家族结构和修辞；句法则按现代汉语调整。
