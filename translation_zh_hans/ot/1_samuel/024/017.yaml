base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/017.yaml
  text: When David had finished speaking these words to Saul[a], Saul said, “Is this your voice, my son David?” Then Saul lifted up his voice and wept.
translation:
  language: zh_hans
  text: 大卫向扫罗说完这些话，扫罗就说：“我儿大卫，这是你的声音吗？”随后，扫罗放声哭了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כְּכַלּוֹת דָּוִד לְדַבֵּר
  choice: 大卫……说完
  rationale: 该结构构成时间从句，表示大卫的话说完之后，下一件事随即发生；现代汉语用“说完”自然、准确，无须直译“事情发生了”。
- source_word: אֶת־הַדְּבָרִים הָאֵלֶּה
  choice: 这些话
  rationale: דְּבָרִים 可指“话”或“事情”；这里承接大卫刚才的言语，译作“这些话”最符合语境。
- source_word: הֲקֹלְךָ זֶה
  choice: 这是你的声音吗
  rationale: קוֹל 在此指可辨认的说话声音；保留 זֶה 的近指意味和原文直接询问的表达。
- source_word: בְּנִי דָוִד
  choice: 我儿大卫
  rationale: 保留原文的亲昵称呼及其语序所呈现的情感色彩；现代汉语中自然且庄重。
- source_word: וַיִּשָּׂא שָׁאוּל קֹלוֹ וַיֵּבְךְּ
  choice: 扫罗放声哭了
  rationale: “举起声音而哭”是希伯来语惯用表达，意为出声大哭；“放声哭了”以自然汉语传达其声音与强烈情绪。
theological_decisions:
- issue: 扫罗称大卫为“我儿”
  choice: 按原文保留为关系性、修辞性的称呼
  alternative: 将其弱化为普通的亲昵称谓，或解释为字面父子关系
  rationale: 原文明用父子称谓，显出扫罗此刻对大卫的情感态度；译文不把它解释为生理父子关系，也不额外赋予特定教义含义。
translation_notes:
  register: 采用现代、简洁而庄重的叙事语体。“随后”明确叙事推进；“放声哭了”比逐字译作“举起声音哭泣”更符合现代标准汉语，同时保留原文的情感力度。
