  yaml_path: translation/ot/1_samuel/024/008.yaml
  text: David restrained his men with words and did not allow them to rise up against Saul[a]. Then Saul rose from the cave and went on his way.
translation:
  language: zh_hans
  text: 大卫用话制止了跟随他的人[a]，不许他们起来攻击扫罗。扫罗便从洞里起身，继续上路。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“大卫用言语严厉斥责跟随他的人。”这里的希伯来语动词很少见，语气可能比一般的“制止”更强。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְשַׁסַּע
  choice: 制止
  rationale: 该动词罕见，语气可能比一般的“拦住”更强；上下文明确表示大卫以言语阻止众人对扫罗动手。“制止”既表达实际结果，也保留一定力度，较适合现代汉语叙事。
- source_word: אֲנָשָׁיו
  choice: 跟随他的人
  rationale: 此处指洞中跟随大卫的部属或随从；“跟随他的人”自然清楚，也避免把一般名词过度具体化为军队官衔。
- source_word: בַּדְּבָרִים
  choice: 用话
  rationale: 保留介词短语的工具意义，说明大卫借言语进行制止；“用话”简明自然。
- source_word: וְלֹא נְתָנָם
  choice: 不许他们
  rationale: נתן与不定式连用在此表示准许；“不许他们”准确、简洁，符合现代叙事语体。
- source_word: לָקוּם אֶל־שָׁאוּל
  choice: 起来攻击扫罗
  rationale: קום与אֶל在敌对语境中表示起来对付某人。“起来攻击”保留动作意象，同时明确这里的敌对行为。
- source_word: קָם מֵהַמְּעָרָה
  choice: 从洞里起身
  rationale: 保留קום与前句“起来”的词语呼应；“从洞里起身”在现代汉语中自然。
- source_word: וַיֵּלֶךְ בַּדָּרֶךְ
  choice: 继续上路
  rationale: 该短语字面为“在路上走”，在叙事中表示离开并继续行程；“继续上路”自然传达这一含义。
