  text: ו/את הִגַּ֣דְתָּ הַ/יּ֔וֹם אֵ֛ת אֲשֶׁר עָשִׂ֥יתָה אִתִּ֖/י טוֹבָ֑ה אֵת֩ אֲשֶׁ֨ר סִגְּרַ֧/נִי יְהוָ֛ה בְּ/יָדְ/ךָ֖ וְ/לֹ֥א הֲרַגְתָּֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/019.yaml
  text: 'And you have declared today what good you have done to me: when Yahweh gave me into your hand[b][a], you did not kill me.'
translation:
  language: zh_hans
  text: 你今日已经表明了你怎样善待我[a]：雅威把我交在你手中[b]，你却没有杀我。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你今日已经让人知道你向我所施的恩惠。”
    reason: 原文可较直译为“你今日已经说明你对我所行的好事”；“好事”也可按语境理解为“恩惠”。
  - marker: b
    text: “交在”也可译作“交给”或“交付给”；原文保留“在你手中”这一表示落入对方掌控的比喻。
    reason: סגר 在此语境中表示把人交付、置于另一人的权力之下，同时原文的“手”具有支配权的含义。
lexical_decisions:
- source_word: הִגַּדְתָּ
  choice: 已经表明
  rationale: נגד 的使役式通常表示“告诉、说明、使人知道”。这里所指的不只是口头陈述，也包括大卫以行动显明其善意，因此译作“表明”既保留词义，也符合语境。
- source_word: הַיּוֹם
  choice: 今日
  rationale: 直接表达时间；“今日”在现代汉语中简洁庄重，又不显晦涩。
- source_word: עָשִׂיתָה אִתִּי טוֹבָה
  choice: 你怎样善待了我
  rationale: 原文直译近于“你对我所行的好事”。“善待了我”自然地表达有益、良善的行动，同时不将其限定为某种特定的盟约性慈爱。
- source_word: סִגְּרַנִי
  choice: 把我交在
  rationale: סגר 在此表示使某人落入另一人的控制之下。“交在你手中”保留原文的权力隐喻，也符合上下文；另可译作“交付”或“送到”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以常见的现代汉语音译呈现四字神名，不用称号替代专名。
- source_word: בְּיָדְךָ
  choice: 你手中
  rationale: 保留希伯来语“手”表示掌控和权力的比喻；现代中文也能自然理解。
- source_word: וְלֹא הֲרַגְתָּנִי
  choice: 你却没有杀我
  rationale: 直截了当地表达否定的“杀死”；“却”显出本可杀害而未杀的转折关系。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名。译文采用“雅威”这一较接近学界常见重构读音的现代汉语音译，以专名呈现，而不以“主”等称号替代。
- issue: 大卫未杀扫罗与雅威交付之间的关系
  choice: 保留“雅威把我交在你手中，你却没有杀我”的并置
  alternative: 解释为雅威要大卫杀扫罗，或明确说雅威只是容许扫罗落入其手
  rationale: 原文只陈述雅威使扫罗落入大卫掌控，而大卫没有杀他；并未进一步说明神意是否要求杀害。译文保留这一神学张力，不作额外推断。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“今日”略具经文庄重感；句法保持原文先述善待、后说明具体情形的结构。脚注分别保留首句的词汇替代译法，以及 סגר 与“手中”这一表达的语义范围。
