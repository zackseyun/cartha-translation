base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/004.yaml
  text: He came to the sheepfolds by the road[a], where there was a cave, and Saul went in to relieve himself. Now David and his men were sitting in the innermost parts of the cave.
translation:
  language: zh_hans
  text: 他来到路旁的羊圈，那里有一个山洞。扫罗进去解手[a]；那时，大卫和跟随他的人正坐在山洞的深处。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“遮盖双脚”，是希伯来语中表示解手或排泄的委婉说法。
    reason: 保留原文习语的字面形式，并说明其委婉含义，避免将其不必要地限定为排便。
lexical_decisions:
- source_word: גִּדְרוֹת הַצֹּאן
  choice: 羊圈
  rationale: 该短语指圈养羊群的围栏或圈舍；“羊圈”是现代汉语中自然、具体的对应表达。
- source_word: עַל הַדֶּרֶךְ
  choice: 路旁
  rationale: 这里说明羊圈相对于道路的位置；“路旁”简洁自然，也符合上下文中的行进场景。
- source_word: מְעָרָה
  choice: 洞
  rationale: 上下文明确指可供多人藏身的山洞；汉语叙事中“洞”自然简洁，且与后文“洞的深处”衔接顺畅。
- source_word: לְהָסֵךְ אֶת רַגְלָיו
  choice: 大解
  rationale: 原文直译为“遮盖双脚”，是排便的委婉说法。“大解”既清楚传达含义，又保留委婉、庄重的叙事语气；直译形式收入脚注。
- source_word: בְּיַרְכְּתֵי הַמְּעָרָה
  choice: 在洞的深处
  rationale: יַרְכְּתֵי表示最里面、最偏远的部分；“洞的深处”自然表达其空间含义，也说明扫罗为何没有发现他们。
- source_word: יֹשְׁבִים
  choice: 正坐着
  rationale: 分词描写当时的姿态和状态，不是长期居住；“正坐着”准确呈现场景。
- source_word: וְדָוִד וַאֲנָשָׁיו
  choice: 大卫和跟随他的人
  rationale: אֲנָשָׁיו字面为“他的人”，在此指跟随大卫的部属；“跟随他的人”比现代汉语中的“他的人”更清楚，又不额外限定其军事身份。
theological_decisions: []
