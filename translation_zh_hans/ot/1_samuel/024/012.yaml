source:
  edition: WLC
  text: וְ/אָבִ֣/י רְאֵ֔ה גַּ֗ם רְאֵ֛ה אֶת כְּנַ֥ף מְעִילְ/ךָ֖ בְּ/יָדִ֑/י כִּ֡י בְּ/כָרְתִ/י֩ אֶת כְּנַ֨ף מְעִֽילְ/ךָ֜ וְ/לֹ֣א הֲרַגְתִּ֗י/ךָ דַּ֤ע וּ/רְאֵה֙ כִּי֩ אֵ֨ין בְּ/יָדִ֜/י רָעָ֤ה וָ/פֶ֨שַׁע֙ וְ/לֹא חָטָ֣אתִי לָ֔/ךְ וְ/אַתָּ֛ה צֹדֶ֥ה אֶת נַפְשִׁ֖/י לְ/קַחְתָּֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/012.yaml
  text: And[a], my father, see—yes, see the corner of your robe in my hand. For when I cut off the corner of your robe[b], I did not kill you. Know and see that there is no evil or transgression in my hand, and I have not sinned against you[c], though you are hunting my life to take it.
translation:
  language: zh_hans
  text: “我父啊，请看！看哪，你外袍的一角[a]在我手里。我既割下了你外袍的一角，却没有杀你。你当知道，也当看清：我手中没有恶事，也没有悖逆[b]；我没有得罪你，你却在追猎我的性命，要把它夺去。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “一角”也可译作“边缘”或“下摆”。
    reason: כָּנָף用于衣物时可指衣角、边缘或下摆，原词未精确限定具体部位。
  - marker: b
    text: “悖逆”也可译作“过犯”。
    reason: פֶשַׁע兼有过犯与反叛的语义范围；本处政治语境支持“悖逆”，但不能排除较一般的道德含义。
lexical_decisions:
- source_word: וְאָבִי
  choice: 我父啊
  rationale: 保留大卫对扫罗带有亲属与政治敬意的称呼；语气庄重而不改写为一般敬称。
- source_word: רְאֵה גַּם רְאֵה
  choice: 请看！看哪
  rationale: 用重复和感叹保留希伯来文的强调与催促，同时符合现代汉语表达。
- source_word: כְּנַף מְעִילְךָ
  choice: 你外袍的一角
  rationale: כָּנָף在此指衣物的边缘或衣角；“外袍的一角”具体、自然，也与叙事情境相符。
- source_word: בְּיָדִי
  choice: 在我手里／我手中
  rationale: 第一次指大卫手中展示的物证，第二次兼有行为与责任的习语意味；保留“手”可维持原文两处呼应。
- source_word: וְלֹא הֲרַגְתִּיךָ
  choice: 却没有杀你
  rationale: 直接表达否定事实；“却”凸显割袍而不杀人的对比。
- source_word: דַּע וּרְאֵה
  choice: 你要知道，也要看清
  rationale: 保留“知道”和“看”两个动词，使物证与由此得出的道德判断都得到表达。
- source_word: רָעָה וָפֶשַׁע
  choice: 恶事，也没有悖逆
  rationale: רָעָה译作“恶事”指有害或邪恶行为；פֶשַׁע在君王语境中可含反叛意味，因此译作“悖逆”，并以脚注保留“过犯”的词义可能。
- source_word: וְלֹא חָטָאתִי לָךְ
  choice: 我没有得罪你
  rationale: חטא加间接受词表示对某人犯罪或冒犯；“得罪你”是自然现代汉语，同时保留人际与道德分量。
- source_word: צֹדֶה אֶת נַפְשִׁי לְקַחְתָּהּ
  choice: 在猎取我的性命，要把它夺去
  rationale: 保留צדה的狩猎意象，并让“它”明确回指“我的性命”，贴近原文结构。
theological_decisions:
- issue: פֶשַׁע在大卫向扫罗申辩时的道德—政治含义
  choice: 悖逆
  alternative: 过犯
  rationale: 此词既可泛指违法、过犯，也可指背叛或反叛；在臣属面对君王自辩的语境中，“悖逆”较能呈现政治层面，但脚注保留较宽泛的读法，避免把词义单一化。
translation_notes:
  register: 采用现代、庄重、可朗读的叙事语言。“我父啊”保留大卫的敬称；“请看！看哪”传达原文重复强调。“我手中没有恶事”刻意保留希伯来文“手”的具体与习语双重作用；“猎取我的性命”略带文学色彩，以保存原文狩猎隐喻。
