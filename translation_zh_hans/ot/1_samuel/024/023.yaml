  yaml_path: translation/ot/1_samuel/024/023.yaml
  text: So David swore to Saul. Then Saul went to his house[a], but David and his men went up to the stronghold.
translation:
  language: zh_hans
  text: 于是，大卫向扫罗起了誓。扫罗回家去了；大卫和他的人却上了山寨。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“大卫和他的人也上了山寨。”希伯来文连接词直译为“和／而”；正文译作“却”，是为了显明扫罗与大卫去向不同的叙事对照。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׁבַע דָּוִד לְשָׁאוּל
  choice: 大卫向扫罗起了誓
  rationale: נשבע 的尼法勒形在此表示起誓；לְ 标明接受誓言的对象。“向扫罗起了誓”既直接，也符合现代汉语叙事表达。
- source_word: וַיֵּלֶךְ שָׁאוּל אֶל־בֵּיתוֹ
  choice: 扫罗回自己家去了
  rationale: הלך אל־ביתו 表示往自己的家去；结合离开当前地点的语境，“回自己家去了”比逐字译作“走到他的房屋”自然，同时保留“家”的具体含义。
- source_word: וְדָוִד וַאֲנָשָׁיו
  choice: 大卫和跟随他的人却
  rationale: אֲנָשָׁיו 在此指跟随大卫的一班人，译作“跟随他的人”比单称“他的人”清楚。וְ 本义为“和／而”，正文用“却”显明扫罗回家与大卫另往山寨之间的叙事对照，并以脚注保留较形式对应的译法。
- source_word: עָלוּ
  choice: 上了
  rationale: עלה 表示向上而去；“上了”简洁自然，并保留地势上的方向感。
- source_word: הַמְּצוּדָה
  choice: 山寨
  rationale: מְצוּדָה 指可防守的据点或避难堡垒。在大卫旷野活动的语境中，“山寨”既体现地势和防御性，也符合现代中文圣经叙事用语；“堡垒”是可行替代。
