  language: zh_hans
  text: 扫罗追赶非利士人回来后，有人告诉他说：“看，大卫在隐基底的旷野。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מֵאַחֲרֵי פְּלִשְׁתִּים
  choice: 追赶非利士人
  rationale: 介词短语直译为“在非利士人后面”，结合语境自然表达为追赶或追击；“追赶”既准确又不额外强调军事结果。
- source_word: הִנֵּה
  choice: 看
  rationale: 保留提示听者注意新消息的语用功能，比省略更贴近原文，也符合现代汉语直接引语。
- source_word: מִדְבַּר עֵין גֶּדִי
  choice: 隐·基底的旷野
  rationale: מִדְבָּר 指荒野、旷野；“隐·基底”采用常见圣经地名译法，并用间隔号清楚标示复合音译名。
