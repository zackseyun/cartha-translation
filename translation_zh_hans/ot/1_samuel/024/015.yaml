base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/015.yaml
  text: After whom has the king of Israel come out? After whom are you pursuing? After a dead dog[a], after a single flea.
translation:
  language: zh_hans
  text: 以色列王出来，是追赶谁呢？你追赶谁呢？追赶一条死狗，追赶一只跳蚤！[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节希伯来文四次使用“在……后面”。字面可译为：“以色列王在谁后面出来？你在谁后面追赶？在一条死狗后面，在一只跳蚤后面。”此处“在……后面”指追赶。
    reason: 说明原文反复使用的介词及其在本语境中表示追赶的含义，并提供较直译的表达。
lexical_decisions:
- source_word: אַחֲרֵי מִי
  choice: 追赶谁
  rationale: אַחֲרֵי 字面意为“在……后面”，本句结合 יָצָא 和 רֹדֵף 表示追逐的对象；译作“追赶谁”符合现代汉语，同时保留两个反问的力度。
- source_word: יָצָא
  choice: 出来
  rationale: 该动词表示“出去、出来”；这里指王出动追捕大卫。“出来”既贴近原文，也与说话场景相称。
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: 以色列王
  rationale: 直译这一正式称号，保留大卫以王的尊贵身份反衬追捕对象微不足道的讽刺意味。
- source_word: אַתָּה רֹדֵף
  choice: 你追赶的
  rationale: רֹדֵף 表示持续而带敌意的追逐；“追赶”在军事追捕语境中自然明确。
- source_word: כֶּלֶב מֵת
  choice: 一条死狗
  rationale: 保留原文强烈的自谦比喻，不将其解释性弱化。
- source_word: פַּרְעֹשׁ אֶחָד
  choice: 一只跳蚤
  rationale: אֶחָד 强调对象只是单独一个、极其微不足道；汉语“一只跳蚤”已能自然传达其渺小，避免生硬的“一只单独的跳蚤”。
- source_word: אַחֲרֵי ... אַחֲרֵי ... אַחֲרֵי ... אַחֲרֵי
  choice: 追赶……追赶……不过是……不过是……
  rationale: 希伯来文四次重复“在……后面”，构成层层推进的反问。正文以汉语自然的重复和对称句式再现节奏，脚注则交代其字面形式。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而口语可懂的反问句式。“不过是……不过是……”凸显死狗与跳蚤的卑微和不成比例，也对应原文末尾两个短语的平行节奏。
