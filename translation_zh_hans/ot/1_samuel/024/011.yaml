id: 1SA.24.11
reference: 1 Samuel 24:11
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: הִנֵּה֩ הַ/יּ֨וֹם הַ/זֶּ֜ה רָא֣וּ עֵינֶ֗י/ךָ אֵ֣ת אֲשֶׁר נְתָנְ/ךָ֩ יְהוָ֨ה הַ/יּ֤וֹם בְּ/יָדִ/י֙ בַּ/מְּעָרָ֔ה וְ/אָמַ֥ר לַ/הֲרָגֲ/ךָ֖ וַ/תָּ֣חָס עָלֶ֑י/ךָ וָ/אֹמַ֗ר לֹא אֶשְׁלַ֤ח יָדִ/י֙ בַּֽ/אדֹנִ֔/י כִּי מְשִׁ֥יחַ יְהוָ֖ה הֽוּא־׀׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/011.yaml
  text: Look[a], this day your own eyes have seen that Yahweh gave you today into my hand in the cave, and I said to kill you, but I spared you. I said, ‘I will not stretch out my hand against my lord[b], for he is Yahweh’s anointed.’
translation:
  language: zh_hans
  text: 看，今天你亲眼看见了：耶和华今天在洞里把你交在我手中。有人说要杀你[a]，我却饶了你[b]。我说：‘我绝不伸手害我的主，因为他是耶和华的受膏者。’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“他说要杀你”“有人叫我杀你”，或按上下文理解为“我说要杀你”。希伯来文使用单数动词，却没有明说主语。
    reason: alternative_reading
  - marker: b
    text: 也可译作“我却怜惜你”。这里的动词可指因怜悯而饶过某人。
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: 看
  rationale: 这是引人注意并加强语气的提示词；“看”自然、简洁，也保留了原文的指示作用。
- source_word: רָאוּ עֵינֶיךָ
  choice: 你亲眼看见了
  rationale: 保留原文以“眼睛”强调亲身见证的意味，同时采用自然的现代汉语表达。
- source_word: נְתָנְךָ יְהוָה ... בְּיָדִי
  choice: 耶和华……把你交在我手中
  rationale: “交在我手中”既贴近希伯来语结构，也清楚表达落入某人权势之下的含义。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的专名形式译出四字神名，而不以普通称号代替。
- source_word: בַּמְּעָרָה
  choice: 在洞里
  rationale: 直接表达地点，符合上下文所指的山洞。
- source_word: וְאָמַר לַהֲרָגֲךָ
  choice: 有人说要杀你
  rationale: 原文动词是第三人称阳性单数，却没有明说主语；“有人说”保留了施事者未指明这一点，脚注列出其他可能理解。
- source_word: וַתָּחָס עָלֶיךָ
  choice: 我却饶了你
  rationale: 此处动词表示因怜惜而不加杀害；按大卫的叙述语境，用“我却饶了你”清楚自然，同时以脚注保留“怜惜”的词义色彩。
- source_word: לֹא אֶשְׁלַח יָדִי
  choice: 我绝不伸手害
  rationale: 保留“伸手”这一希伯来语形象，并以“害”明确其敌对行动的语境含义。
- source_word: בַּאדֹנִי
  choice: 我的主
  rationale: 这是大卫对扫罗作为君王和上位者的敬称，并非神的称号；“我的主”保留其宫廷敬语色彩。
- source_word: מְשִׁיחַ יְהוָה
  choice: 耶和华的受膏者
  rationale: 在本叙事中指蒙耶和华膏立的君王；“受膏者”保留原文的王权与奉献含义，又不把它直接限定为末世性的专称。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 上主／主
  rationale: 原文直接使用神的专名，因此正文保留专名，不以普通称号替代。
- issue: 王权叙事中 מְשִׁיחַ יְהוָה 的理解
  choice: 耶和华的受膏者
  alternative: 耶和华所膏立的人
  rationale: “受膏者”保留原文名词形式及其神学分量；在当前语境中首先指被膏立为王的扫罗，不额外断定更远的指涉。
- issue: וְאָמַר 中未明说的主语
  choice: 有人说要杀你
  alternative: 他说要杀你／有人叫我杀你／我说要杀你
  rationale: 马所拉文本为未注明主语的第三人称单数。正文不把它无提示地改成第一人称，并用脚注呈现真实的语法与解释张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“今天”在正文中重复两次，以保留原文的强调；引语使用清楚的现代标点。“我的主”保留大卫对扫罗的敬称，“受膏者”则保持王权语境中的神学张力。
