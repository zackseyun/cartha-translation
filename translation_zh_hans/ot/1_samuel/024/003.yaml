base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/003.yaml
  text: Then Saul took three thousand chosen men from all Israel and went to seek David and his men in front of the rocks of the wild goats[a].
translation:
  language: zh_hans
  text: 于是，扫罗从全以色列中带上三千名精选的人，到野山羊岩石前去搜寻大卫和跟随他的人[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“野山羊的峭壁”；这里的动物可能特指羱羊。
    reason: 原文“野山羊的岩石”也可译为“野山羊的峭壁”；“野山羊”可能具体指羱羊。
lexical_decisions:
- source_word: וַיִּקַּח
  choice: 挑选了
  rationale: 在本叙事语境中，לקח 指扫罗选取并带领人员出征；结合后面的 בָּחוּר，译作“挑选了”自然地表达征调精选人员之意。
- source_word: שְׁלֹשֶׁת אֲלָפִים אִישׁ בָּחוּר
  choice: 三千人
  rationale: אִישׁ בָּחוּר 表示被选中的人；“挑选了三千人”已在动词中体现“精选”之意，避免增添原文未明说的“士兵”或“精兵”。
- source_word: מִכָּל יִשְׂרָאֵל
  choice: 从全以色列
  rationale: 表示这些人是从整个以色列中选出的；“全以色列”简洁并贴近原文范围。
- source_word: וַיֵּלֶךְ לְבַקֵּשׁ
  choice: 前去……搜寻
  rationale: 不定式表达行动目的；“前去搜寻”符合追捕情境，又保留“去，为要寻找”的结构关系。
- source_word: אֶת דָּוִד וַאֲנָשָׁיו
  choice: 大卫和跟随他的人
  rationale: אֲנָשָׁיו 字面为“他的人”，此处指大卫的随从；“跟随他的人”比现代汉语中的“他的人”更清楚，且不额外限定其身份。
- source_word: עַל פְּנֵי צוּרֵי הַיְּעֵלִים
  choice: 野山羊岩一带
  rationale: עַל פְּנֵי 在地形表达中可指在某处前面、沿着或附近；译作“一带”保留较宽泛的空间关系，避免用生硬的“在……面上”。צוּרֵי הַיְּעֵלִים 可理解为以野山羊得名的岩地或峭壁。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。将地点短语前置到“搜寻”之前，使汉语语序自然；不用“精兵”，以免把原文的“被挑选的人”进一步解释为战力评价。
