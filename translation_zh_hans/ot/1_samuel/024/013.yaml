  text: יִשְׁפֹּ֤ט יְהוָה֙ בֵּינִ֣/י וּ/בֵינֶ֔/ךָ וּ/נְקָמַ֥/נִי יְהוָ֖ה מִמֶּ֑/ךָּ וְ/יָדִ֖/י לֹ֥א תִֽהְיֶה בָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/013.yaml
  text: May Yahweh judge between me and you[a], and may Yahweh avenge me on you[c][b]; but my hand will not be against you.
translation:
  language: zh_hans
  text: 愿雅威在你我之间施行审判，也愿雅威替我向你复仇[a]；但我的手绝不加害你[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “替我向你复仇”也可译作“从你身上为我讨还公道”。
    reason: lexical_alternative
  - marker: b
    text: 直译为“但我的手必不在你身上”；这是希伯来语表达，意思是不亲自采取敌对或伤害行动。
    reason: cultural_note
lexical_decisions:
- source_word: יִשְׁפֹּט
  choice: 愿……施行审判
  rationale: 此处未完成式在大卫的申诉中带有祈愿语气，不宜仅译为一般将来；“愿……施行审判”既保留司法意象，也符合现代汉语表达。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常用音译呈现四字神名，保留其作为以色列之神专名的性质，而不以称号替代。
- source_word: בֵּינִי וּבֵינֶךָ
  choice: 在你我之间
  rationale: 保留原文明确对举的双方及审断语境；比仅译作“为我们断是非”更贴近原文结构。
- source_word: וּנְקָמַנִי
  choice: 也愿……为我复仇
  rationale: נקם表达复仇、追讨之意；“为我复仇”保留其强烈词义，不将其弱化为单纯的“证明我无罪”。
- source_word: מִמֶּךָּ
  choice: 向你
  rationale: 在נקם的结构中，מן标明追讨或复仇所针对的对象；现代汉语以“向你……复仇”最自然。
- source_word: וְיָדִי לֹא תִהְיֶה בָּךְ
  choice: 但我绝不会亲手加害你
  rationale: “手在某人身上”是指采取敌对或伤害行动的希伯来语表达；译文以“亲手加害”传达其实际含义，同时保留“手”的意象。
theological_decisions:
- issue: 如何呈现神名יְהוָה
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文使用神的专名，而非一般称号；“雅威”直接音译该名，避免以“上主”取代专名。
- issue: 大卫诉求נקם的性质
  choice: 大卫求雅威向扫罗为他复仇，同时拒绝亲手加害扫罗
  alternative: 仅译为较弱的“为我伸冤”或“证明我有理”
  rationale: 本句刻意并置神的审判、复仇与大卫不亲自出手；译文保留这种神学张力，不淡化נקם，也不把它解释为大卫自行报复。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“施行审判”保留法庭语境；“复仇”保留原文的强烈语义；末句用“亲手加害”使希伯来语习语易于普通读者理解。
