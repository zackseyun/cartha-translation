  text: Afterward David’s heart struck him because he had cut off the corner of Saul’s robe[a][b].
translation:
  language: zh_hans
  text: 此后，大卫因割下了扫罗外袍的一角[b]，心里就自责[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“大卫的心击打他”，是表示内心受责、良心不安的习语。
    reason: lexical_alternative
  - marker: b
    text: “一角”也可译作“边缘”或“下摆”。原文只说“扫罗的一角”，根据上文补出“外袍”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי כֵן
  choice: 此后
  rationale: 这是承接前一行动的时间推进语。“此后”简洁自然，保留了“这事以后”的时序含义，而不生硬照译叙事公式“事情发生在此后”。
- source_word: וַיַּךְ לֵב דָּוִד אֹתוֹ
  choice: 大卫……心里就自责
  rationale: 希伯来文直译为“大卫的心击打他”，表示他的内心因刚才的行为而责备他。现代汉语若直译成“心击打他”会显得费解；“心里就自责”自然传达这一习语的道德不安，同时以脚注保留原文意象。
- source_word: לֵב
  choice: 心里
  rationale: לֵב 指人的内在思想、感受和道德意识。译作“心里”既保留“心”的表达，也符合现代汉语习惯；没有直接改成较抽象的“良心”。
- source_word: עַל אֲשֶׁר
  choice: 因
  rationale: 该结构说明大卫内心责备他的原因。“因”清楚、简练，并适合庄重的叙事语体。
- source_word: כָּרַת
  choice: 割下了
  rationale: 动词表示割掉、割下。加“了”表明割衣角的行动已经完成，并先于大卫的自责。
- source_word: כָּנָף
  choice: 一角
  rationale: 该词本义为“翅膀”，也可指衣物的边缘、角或下摆。“一角”保留其空间意象，又不过度限定为缝制的“衣边”或“衣襟”。
- source_word: אֶת כָּנָף אֲשֶׁר לְשָׁאוּל
  choice: 扫罗外袍的一角
  rationale: 希伯来文只明说属于扫罗的“一角”，衣物名称可由上文补出。译文补入“外袍”，使现代读者明确所指；脚注说明这一补译。
theological_decisions:
- issue: 大卫内心反应的性质
  choice: 译为“心里就自责”，表达内在的道德责备
  alternative: 直译为“大卫的心就击打他”
  rationale: 原文使用拟人化习语，并未提出关于“良心”的系统神学命题。译文传达其语用意义，同时借脚注保存字面意象，避免把经文扩大解释为特定教义表述。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“此后”推动叙事；“心里就自责”便于普通读者理解，并以脚注保存希伯来文的鲜明意象。“外袍”是依据紧邻上文所作的必要补译。
