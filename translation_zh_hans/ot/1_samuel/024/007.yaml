  text: וַ/יֹּ֨אמֶר לַ/אֲנָשָׁ֜י/ו חָלִ֧ילָ/ה לִּ֣/י מֵֽ/יהוָ֗ה אִם אֶעֱשֶׂה֩ אֶת הַ/דָּבָ֨ר הַ/זֶּ֤ה לַֽ/אדֹנִ/י֙ לִ/מְשִׁ֣יחַ יְהוָ֔ה לִ/שְׁלֹ֥חַ יָדִ֖/י בּ֑/וֹ כִּֽי מְשִׁ֥יחַ יְהוָ֖ה הֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/007.yaml
  text: And he said to his men[a], “Far be it from me, because of Yahweh, that I should do this thing to my lord, Yahweh’s anointed, to stretch out my hand against him, for he is Yahweh’s anointed.”
translation:
  language: zh_hans
  text: 他对自己的手下说：“我断不可因耶和华[a]而向我主、耶和华所膏立的人做这事，伸手加害他；因为他是耶和华所膏立的人。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本句开头也可按传统译作：“愿耶和华禁止我做这样的事。”希伯来语习语表达说话者对这种行为强烈的厌弃和断然拒绝，并将这拒绝置于与耶和华的关系中。
    reason: 保留חָלִילָה לִּי מֵיְהוָה的传统译法，并避免将该习语与耶和华的关系单一限定为某一种心理动机。
lexical_decisions:
- source_word: חָלִילָה לִּי מֵיְהוָה
  choice: 我因敬畏耶和华，绝不可
  rationale: חָלִילָה表达对某事强烈厌弃和断然拒绝；מֵיְהוָה表明这种拒绝基于对耶和华的敬畏。此译法比生硬的“从耶和华远离我”更符合现代汉语，同时保留其神学依据。
- source_word: אִם אֶעֱשֶׂה
  choice: 做这样的事
  rationale: אִם在חָלִילָה之后不是普通条件句，而属于誓言式的否定结构，汉语用“绝不可做”自然传达。
- source_word: הַדָּבָר הַזֶּה
  choice: 这样的事
  rationale: דָּבָר在这里指正在考虑的行为，不进一步限定为杀害，以避免超出本句措辞。
- source_word: לַאדֹנִי
  choice: 我的主
  rationale: 保留大卫对扫罗的尊称及其臣属语气，不将“主”误解为神的称号。
- source_word: לִמְשִׁיחַ יְהוָה
  choice: 耶和华所膏立的人
  rationale: מָשִׁיחַ在此指被耶和华膏立为王的扫罗；“所膏立的人”既保留受膏身份，也避免把后来的专称“弥赛亚”倒置进本段。
- source_word: לִשְׁלֹחַ יָדִי בּוֹ
  choice: 伸手加害
  rationale: 保留“伸手”的希伯来语意象，并用“加害”明确בּוֹ在此所表达的敌对、暴力方向，而不把行动过度具体化为击杀。
- source_word: כִּי מְשִׁיחַ יְהוָה הוּא
  choice: 因为他是耶和华所膏立的
  rationale: כִּי说明大卫不加害扫罗的理由；重复“耶和华所膏立的”反映原文的强调。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神名形式，明确这是专名而非一般性的“主”。
theological_decisions:
- issue: מְשִׁיחַ用于扫罗时的译法
  choice: 耶和华所膏立的人
  alternative: 耶和华的弥赛亚／耶和华的受膏者
  rationale: 这里首先指扫罗作为经膏立之王的身份。“弥赛亚”容易引入后期的专名含义；“所膏立的人”则保留王权与神圣任命的意义，而不作时代错置。
- issue: חָלִילָה לִּי מֵיְהוָה中耶和华与拒绝行为的关系
  choice: 我因敬畏耶和华，绝不可
  alternative: 愿耶和华禁止我／这事在耶和华面前断不可归到我
  rationale: 原文习语可被传统地理解为求耶和华禁止，也可强调大卫因与耶和华的关系而断然拒绝。主文采用符合上下文的因由表达，脚注保留传统译法及习语性质，不把句法张力完全消除。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“跟随他的人”比单说“他的人”更清楚；“伸手加害”保留原文意象；全句维持大卫对扫罗的尊敬以及“耶和华所膏立”这一重复所形成的强调。
