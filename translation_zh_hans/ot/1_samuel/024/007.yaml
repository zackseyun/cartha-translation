revisions:
- from: 他对跟随他的人说：“我因敬畏耶和华，绝不可做这样的事：伸手加害我的主，就是耶和华所膏立的人，因为他是耶和华所膏立的。”[a]
  to: 他对自己的手下说：“我断不可因耶和华[a]而向我主、耶和华所膏立的人做这事，伸手加害他；因为他是耶和华所膏立的人。”
  rationale: 修订以“因耶和华”替代“因敬畏耶和华”，保留原文习语在语义上的张力，同时仍以自然、庄重的现代汉语表达拒绝的根据。另将“他的人”按上下文明确为“自己的手下”，并使“我的主、耶和华所膏立的人”保持原文并列称谓和重复强调。
