source:
  edition: WLC
  text: וַ/יֹּ֡אמֶר שַׁלְּחֵ֣/נִי נָ֡א כִּ֣י זֶבַח֩ מִשְׁפָּחָ֨ה לָ֜/נוּ בָּ/עִ֗יר וְ/ה֤וּא צִוָּֽה לִ/י֙ אָחִ֔/י וְ/עַתָּ֗ה אִם מָצָ֤אתִי חֵן֙ בְּ/עֵינֶ֔י/ךָ אִמָּ֥לְטָה נָּ֖א וְ/אֶרְאֶ֣ה אֶת אֶחָ֑/י עַל כֵּ֣ן לֹא בָ֔א אֶל שֻׁלְחַ֖ן הַ/מֶּֽלֶךְ־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/029.yaml
  text: He said[a], ‘Please let me go, because we have a family sacrifice in the city, and my brother himself has commanded me. So now, if I have found favor in your eyes[b], please let me escape and see my brothers.’ Therefore he has not come to the king’s table.
translation:
  language: zh_hans
  text: 他说：“请准我去吧，因为城里有我们家族的祭祀，是我的兄弟吩咐我的。现在，我若在你眼中蒙恩，就请容我脱身[a]，去见我的弟兄[b]。”所以他没有到王的筵席上来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“逃走”或“悄然离开”。这个希伯来语动词可以表示逃脱，也可以指设法脱身离去。
    reason: lexical_alternative
  - marker: b
    text: “弟兄”可以指大卫的亲兄弟，也可能泛指家族中的男性亲属。
    reason: cultural_note
lexical_decisions:
- source_word: שַׁלְּחֵנִי נָא
  choice: 请准我去吧
  rationale: 该短语是带礼貌语气词 נָא 的请求，意思是在请求获准离开；“请准我去吧”既自然，也保留了请求许可的语气。
- source_word: זֶבַח מִשְׁפָּחָה
  choice: 我们家族要……献祭
  rationale: זֶבַח 明确指献祭，也可能包括共同享用祭肉；מִשְׁפָּחָה 可指家庭或较广的家族群体。“家族要献祭”保留宗教礼仪含义，又符合现代汉语表达。
- source_word: בָּעִיר
  choice: 在城里
  rationale: 按其通常的地点含义直译，表达自然。
- source_word: וְהוּא צִוָּה לִי אָחִי
  choice: 是我哥哥吩咐我的
  rationale: 希伯来语中独立代词 הוּא 带出强调，而末尾的 אָחִי 说明发出吩咐的是“我哥哥”；汉语用“是……的”结构自然体现这一强调。
- source_word: אִם מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: 我若在你眼中蒙恩
  rationale: 保留希伯来语惯用礼貌表达及“在你眼中”的意象；“蒙恩”在庄重现代汉语中清楚可懂。
- source_word: אִמָּלְטָה נָּא
  choice: 请容我脱身
  rationale: מלט 可表示逃脱、脱身或悄然离去；“脱身”既保留离开当前处境的力度，也不把语境过度强化为危急逃亡。脚注说明其词义范围。
- source_word: וְאֶרְאֶה אֶת אֶחָי
  choice: 去见我的弟兄
  rationale: ראה 按字面译为“见”；אֶחָי 是阳性复数，既可指亲兄弟，也可泛指家族中的男性亲属，因此正文保留“弟兄”，脚注交代范围。
- source_word: עַל כֵּן
  choice: 所以
  rationale: 该连接语引出大卫未赴王席的结论或解释；“所以”简洁、自然，并保持正式叙述的连贯性。
- source_word: לֹא בָא אֶל שֻׁלְחַן הַמֶּלֶךְ
  choice: 他没有到王的席上来
  rationale: 保留“到……来”的运动表达和“王的席”这一王室宴席意象；汉语时态由上下文确定，无须另加完成体标记。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重的现代标准汉语。正文保留“献祭”“在你眼中蒙恩”“王的席”等源文意象，同时借助汉语句式表达 הוּא 的强调。两个脚注标记均置于其实际所说明的词语之后，以免与注释内容错位。
