  - severity: low
    issue: “哥哥”加入长幼信息。
    rationale: אָחִי意为“我的兄弟”，并不说明该兄弟年长。应避免由传统人物背景补入词汇未明示的信息。
  - severity: low
    issue: “王的席上”略不如“王的筵席”明确自然。
    rationale: שֻׁלְחַן在此指君王的用餐席、筵席；“王的筵席”是现代汉语中清楚而庄重的对应语。
