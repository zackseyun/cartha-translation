base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/017.yaml
  text: And Jonathan made David swear again by his love for him[b][a], for he loved him as his own soul.
translation:
  language: zh_hans
  text: 约拿单因着他对大卫的爱[b]，又叫大卫起誓[a]，因为他爱大卫，如同爱自己的性命[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “又叫……起誓”也可译作“继续叫……起誓”或“再次使……受誓言约束”。
    reason: lexical_alternative
  - marker: b
    text: “因着他对大卫的爱”也可译作“凭着他对大卫的爱”。
    reason: lexical_alternative
  - marker: c
    text: 原文可直译为“因为他以自己性命的爱爱他”，是表达深厚个人之爱的说法。
    reason: literal_rendering
lexical_decisions:
- source_word: וַיּוֹסֶף
  choice: 又
  rationale: יסף接不定式时表示动作的重复或继续；“又”简洁自然地表达“再次”的意思，同时不排除“继续”的可能。
- source_word: לְהַשְׁבִּיעַ
  choice: 叫……起誓
  rationale: שׁבע的使役形表示使某人起誓或使其受誓言约束；“叫大卫起誓”保留了使役语气，也符合现代汉语表达。
- source_word: בְּאַהֲבָתוֹ אֹתוֹ
  choice: 因着他对大卫的爱
  rationale: 介词ב在此可表示行动的根据、动机或所凭借的事物。“因着”自然呈现爱与再次起誓之间的关联，同时脚注保留“凭着”的可能。代词在汉语中明确为“大卫”，以避免不必要的指代含混。
- source_word: כִּי
  choice: 因为
  rationale: כִּי在此引出约拿单行动的解释或原因；“因为”清楚地保留这一逻辑关系。
- source_word: אַהֲבַת נַפְשׁוֹ
  choice: 如同爱自己的性命
  rationale: נֶפֶשׁ可指生命、性命或自己。此处是表达极深个人爱护的惯用说法；“自己的性命”既保留生命意象，也比“自己的灵魂”更符合现代汉语语境。
- source_word: אֲהֵבוֹ
  choice: 他爱大卫
  rationale: 该完成式在叙事说明句中陈述约拿单爱大卫这一事实；汉语用一般陈述即可。重复“大卫”使指代清楚。
theological_decisions:
- issue: 约拿单对大卫之爱的性质
  choice: 保留“爱”的强烈措辞，并以“如同爱自己的性命”表达其深度
  alternative: 仅译为“友情”，或加入浪漫、性方面的解释
  rationale: 原文反复使用אהב，明确表达深厚的爱，却没有进一步界定其性质。译文既不将其淡化为普通友情，也不加入原文未明说的浪漫或性含义。
- issue: בְּאַהֲבָתוֹ所表达的关系
  choice: 正文译作行动的动机或根据：“因着他对大卫的爱”
  alternative: 译作誓言所凭借的对象：“凭着他对大卫的爱”
  rationale: 上下文更自然地将约拿单的爱视为他再次叫大卫起誓的动机，但介词ב本身容许“凭着”的理解，因此在脚注中保留该可能。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“叫……起誓”通俗清楚且保留使役含义；以“性命”呈现נֶפֶשׁ的生命意象，避免“灵魂”在现代汉语中可能引出的额外二元论联想。
