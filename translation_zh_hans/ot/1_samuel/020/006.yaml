base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/006.yaml
  text: If your father surely notices me[a], then say, ‘David earnestly asked leave of me to run to Bethlehem, his city[d][c][b], because the yearly sacrifice is there for the whole family.’
translation:
  language: zh_hans
  text: 如果你父亲果真留意到我[a]，你就说：‘大卫恳切求我准他赶往伯利恒、他的城[b][c]，因为那里有为全家举行的一年一度的献祭[d]。’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “留意到我”也可按上下文译作“察觉我不在”或“想念我”。希伯来语用不定式绝对形加强动词语气。
    reason: lexical_alternative
  - marker: b
    text: “恳切求”也可译作“急切请求准许”。希伯来语同样用不定式绝对形加强语气。
    reason: lexical_alternative
  - marker: c
    text: “赶往”直译为“跑到”，意思是迅速前往。
    reason: lexical_alternative
  - marker: d
    text: “一年一度的献祭”也可译作“年度的献祭”或“按期举行的献祭”；“全家”也可指“整个宗族”。
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּקֹד יִפְקְדֵנִי
  choice: 果真留意到我不在
  rationale: 不定式绝对形与限定动词连用，强化语气。按筵席语境，扫罗所留意的是大卫缺席；译文将这一语境含义自然表达出来，同时以脚注保留“想起我／察觉我”的词义空间。
- source_word: אָבִיךָ
  choice: 你父亲
  rationale: 直接对应带第二人称阳性单数后缀的希伯来语形式。
- source_word: נִשְׁאֹל נִשְׁאַל מִמֶּנִּי
  choice: 恳切求我准他
  rationale: שאל 的不定式绝对形与限定动词连用，表示加强语气；结合离开的请求，“求我准他”在现代汉语中自然体现请求许可。
- source_word: לָרוּץ
  choice: 赶回
  rationale: 原义是“跑”，此处表示急忙前往。中文若直译“跑到”略显生硬；“赶回”既表达迅速，也符合伯利恒是大卫本城的语境。
- source_word: בֵּית לֶחֶם עִירוֹ
  choice: 他的城伯利恒
  rationale: 保留地名与“他的城”的同位关系；现代汉语采用前置说明，清楚而庄重。
- source_word: זֶבַח הַיָּמִים
  choice: 一年一度的献祭
  rationale: 该短语指按周期举行的献祭，语境中最自然地理解为年度祭礼；脚注保留较贴近字面的“按期举行的献祭”。
- source_word: לְכָל הַמִּשְׁפָּחָה
  choice: 全家
  rationale: מִשְׁפָּחָה 可指家庭或宗族；“全家”简洁自然，脚注说明也可理解为整个宗族。
