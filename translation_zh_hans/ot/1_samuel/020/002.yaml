base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/002.yaml
  text: He said to him[a], “Far from it! You will not die. Look, my father does nothing, great or small, without revealing it to me. So why would my father hide this matter from me? It is not so.”
translation:
  language: zh_hans
  text: 他对他说：“绝不会！你不会死。你看，我父亲无论做什么事，不管大小，没有一件不告诉我[a]。我父亲为什么要把这件事瞒着我呢？没有这回事。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“揭开我的耳朵”，是“告诉我、向我透露”的惯用说法。
    reason: lexical_alternative
lexical_decisions:
- source_word: חָלִילָה
  choice: 绝不会！
  rationale: 这是强烈否认或拒斥的惯用语；译为“绝不会”自然有力，也不加入原文未明说的神圣称谓。
- source_word: לֹא תָמוּת
  choice: 你不会死
  rationale: 按上下文表达约拿单对大卫的直接保证；现代汉语自然、明确。
- source_word: הִנֵּה
  choice: 你看
  rationale: 保留提示对方注意下文解释的话语功能，比“看哪”更符合现代口语，同时仍具庄重感。
- source_word: דָּבָר גָּדוֹל אוֹ דָּבָר קָטֹן
  choice: 无论做大事还是小事
  rationale: 保留“大—小”这一概括一切的两极表达，并使汉语句法流畅。
- source_word: וְלֹא יִגְלֶה אֶת אָזְנִי
  choice: 都不会不告诉我
  rationale: “揭开我的耳朵”是希伯来语习语，意思是把事情透露或告知某人；正文传达实际含义，字面形象置于脚注。
- source_word: יַסְתִּיר
  choice: 瞒着
  rationale: 在父子间是否告知秘密的语境中，“瞒着我”比“隐藏于我”更自然准确。
- source_word: הַדָּבָר הַזֶּה
  choice: 这件事
  rationale: דָּבָר 在这里指所谈论的计划或事情，而不只是一个言词。
- source_word: אֵין זֹאת
  choice: 没有这回事
  rationale: 作为结尾，直接否定大卫所说的情况；译法简洁自然，并保留断然否认的语气。
- source_word: אָבִי
  choice: 我父亲
  rationale: 原文两次明说“我父亲”，译文照样重复，以保留强调和亲属关系。
theological_decisions: []
