  yaml_path: translation/ot/1_samuel/020/010.yaml
  text: Then David said to Jonathan[a], “Who will tell me? Or what if your father answers you harshly?”
translation:
  language: zh_hans
  text: 大卫对约拿单说：“谁来告诉我呢？或者，你父亲若严厉地回答你，该怎么办呢？”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译近似：“谁会告诉我？或者，你父亲会严厉地回答你什么？”原文第二问的句法十分简略；正文按上下文将其表达为对父亲严厉回答的忧虑。
    reason: 原文第二问句法压缩；脚注说明其较字面的表达，同时保留正文自然的条件问句。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 该叙事形式推动情节向前；现代汉语通常无须另译连接词，也能自然表达事件的承接。
- source_word: דָּוִד
  choice: 大卫
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: יְהוֹנָתָן
  choice: 约拿单
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: מִי יַגִּיד לִי
  choice: 谁来告诉我呢
  rationale: נגד 的使役式在此意为“告知、报告”；“谁来告诉我呢”简洁自然，并保留独立问句的形式。
- source_word: אוֹ
  choice: 或者
  rationale: 保留原文明确的选择连词及两个问句之间略显突兀的转折，不把它完全消解为单纯的条件关系。
- source_word: מַה יַּעַנְךָ אָבִיךָ
  choice: 要是你父亲……回答你，又怎么办呢
  rationale: 原文直译近似“你父亲会回答你什么”；句法高度压缩。此处用现代汉语的条件问句表达大卫所担心的情形，同时以脚注交代原文结构。
- source_word: קָשָׁה
  choice: 严厉地
  rationale: 该阴性形容词“严厉的、 harsh”在这里副词性地修饰“回答”；“严厉地”既自然，也保留回应严峻、强硬的语气。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“又怎么办呢”使压缩的希伯来问句在中文中易懂；同时保留“或者”，并用脚注说明原文并未明确写出完整的条件结构。
