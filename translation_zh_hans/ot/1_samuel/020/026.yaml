  text: וְ/לֹֽא דִבֶּ֥ר שָׁא֛וּל מְא֖וּמָה בַּ/יּ֣וֹם הַ/ה֑וּא כִּ֤י אָמַר֙ מִקְרֶ֣ה ה֔וּא בִּלְתִּ֥י טָה֛וֹר ה֖וּא כִּֽי לֹ֥א טָהֽוֹר־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/026.yaml
  text: But Saul did not say anything that day[a], for he thought, “Something has happened; he is not clean—surely he is not clean.”
translation:
  language: zh_hans
  text: 扫罗那天什么也没说，因为他心想：“想必是出了什么事；他不洁净[a]，确实是不洁净。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的“不洁净”在本段宴席的语境中指礼仪上的不洁净。
    reason: 说明טָהוֹר在此处的礼仪含义，同时避免加入原文未明说的具体参与后果。
lexical_decisions:
- source_word: דִבֶּר ... מְאוּמָה
  choice: 什么也没说
  rationale: 这是现代汉语表达“没有作声或评论”的自然说法，准确传达希伯来语的否定惯用结构。
- source_word: בַּיּוֹם הַהוּא
  choice: 那天
  rationale: 简洁、自然地保留原文的时间指向。
- source_word: כִּי אָמַר
  choice: 因为他心想
  rationale: אָמַר 字面为“说”，但此处引出扫罗内心的判断；“心想”明确表达内心言语而不改变其内容。
- source_word: מִקְרֶה הוּא
  choice: 他一定是遇到了什么事
  rationale: מִקְרֶה 指发生的事或偶发事件。此处结合大卫缺席的语境，以自然汉语表达扫罗认为某种意外情形发生了；“一定”体现其推断语气，但不具体说明究竟发生何事。
- source_word: בִּלְתִּי טָהוֹר הוּא
  choice: 他不洁净
  rationale: 贴近原文的否定表达，并保留“洁净”在此处可能具有礼仪含义的空间。
- source_word: כִּי לֹא טָהוֹר
  choice: 肯定是不洁净
  rationale: 保留原文对“不洁净”的重复，并以“肯定”表达末句 כִּי 的强调、确认意味。
theological_decisions:
- issue: טָהוֹר 所指的不洁净性质
  choice: 正文采用“不洁净”，脚注说明此处指礼仪上的不洁净
  alternative: 直接译作“礼仪上不洁净”或理解为道德上的污秽
  rationale: 新月宴席的叙事背景表明，扫罗想到的最可能是影响赴宴资格的礼仪性不洁；正文保留原词较宽的措辞，避免把解释完全写入译文。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“什么也没说”“心想”符合当代汉语习惯；末尾保留原文的重复，以呈现扫罗自我确认的语气。
