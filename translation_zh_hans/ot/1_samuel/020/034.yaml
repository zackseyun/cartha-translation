base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/034.yaml
  text: Then Jonathan rose from the table in fierce anger[a], and he ate no food on the second day of the month, because he was grieved over David, because his father had humiliated him.
translation:
  language: zh_hans
  text: 约拿单怒火中烧，从席上起来；初二[a]，他没有吃东西，因为他为大卫难过，也因为他父亲羞辱了他[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“新月节的第二天”。希伯来语“חֹדֶשׁ”既可指“月份”，也可指“新月”；这里的背景是王室的新月宴席。
    reason: lexical_alternative
  - marker: b
    text: 原文“他”的指代未明。按紧邻上下文，通常可理解为约拿单；也可理解为大卫。希伯来语使用阳性单数代词，没有重复姓名。
    reason: referential_ambiguity
lexical_decisions:
- source_word: וַיָּקָם
  choice: 起来
  rationale: קום的叙事体连续式表示起身；“起来”符合现代汉语叙事表达。
- source_word: מֵעִם הַשֻּׁלְחָן
  choice: 从席上
  rationale: 介词短语表示离开用餐之处；“从席上”比直译“从桌子旁”更自然，也保留宴席语境。
- source_word: בָּחֳרִי אָף
  choice: 怒火中烧
  rationale: 原文意象是怒气的灼热；这一表达自然地保留了强烈、如火燃烧的愤怒。
- source_word: וְלֹא אָכַל ... לֶחֶם
  choice: 没有吃东西
  rationale: לֶחֶם在宴席语境中可泛指食物；译为“吃东西”清楚表达约拿单整餐未食，而不局限于面包。
- source_word: בְּיוֹם הַחֹדֶשׁ הַשֵּׁנִי
  choice: 初二那天
  rationale: חֹדֶשׁ兼有“月”和“新月”之义；“初二”简洁表达阴历月份第二日，并由脚注说明新月节语境下的另一种理解。
- source_word: נֶעְצַב אֶל דָּוִד
  choice: 他为大卫难过
  rationale: עצב的Nifal形表示内心忧伤、痛苦，אֶל在此引出忧伤所关乎的对象；“为大卫难过”自然准确。
- source_word: הִכְלִמוֹ
  choice: 羞辱了他
  rationale: כלם的Hifil形表示使人蒙羞、受辱；保留第三人称代词，以免在正文中消除原文所容许的指代张力。
- source_word: אָבִיו
  choice: 他父亲
  rationale: 原文为“他的父亲”，在上下文中指约拿单的父亲扫罗；译文保留原有亲属称谓及叙事张力。
theological_decisions:
- issue: הִכְלִמוֹ中第三人称阳性单数宾语后缀的指代
  choice: 正文译作“羞辱了他”，并以脚注说明通常理解为大卫
  alternative: 明确译作“羞辱了大卫”或“使约拿单蒙羞”
  rationale: 紧邻的“大卫”支持宾语指大卫，且上下文也谈到扫罗对大卫的敌意；但同一节主语为约拿单，前文扫罗又直接辱骂约拿单，因此正文保留代词可避免过度消解语法与叙事情境中的张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“怒火中烧”保留原文怒气如火灼热的意象；“席上”与王室宴席场景相称。“也因为”使连续两个כִּי分句在汉语中层次清楚，同时不把二者强行改写成单一因果关系。
