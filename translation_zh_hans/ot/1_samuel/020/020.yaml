lexical_decisions:
- source_word: וַאֲנִי
  choice: 我要
  rationale: 独立代词“我”突出约拿单接下来要采取的行动；结合未完成式所表达的计划，用“我要”符合现代汉语叙事。
- source_word: שְׁלֹשֶׁת הַחִצִּים
  choice: 那三支箭
  rationale: 保留原文定指形式，表明这是计划中用于传递信号的特定三支箭。
- source_word: צִדָּה
  choice: 朝它旁边
  rationale: 保留方向意义和阴性单数第三人称后缀，不在正文中武断指定所指对象；上下文很可能指先前提到的石头或标记。
- source_word: אוֹרֶה
  choice: 射
  rationale: ירה的使役词干用于射箭语境，译作“射”最自然准确。
- source_word: לְשַׁלַּח לִי
  choice: 就像是自己在……射箭
  rationale: 原表达带有“为自己发射”的字面结构，在语境中表示表面上像是在自行练习射箭；此译法传达其模拟或表象含义，又避免生硬直译。
- source_word: לְמַטָּרָה
  choice: 对着靶子
  rationale: מַטָּרָה在射箭语境中指靶子或目标；“对着靶子”是自然清楚的现代汉语。
