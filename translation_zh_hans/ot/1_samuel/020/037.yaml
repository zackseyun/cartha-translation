base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/037.yaml
  text: When the boy came to the place of the arrow that Jonathan had shot[a], Jonathan called after the boy and said, “Is not the arrow beyond you?”
translation:
  language: zh_hans
  text: 那孩子到了约拿单射出的箭所在之处，约拿单在孩子后面喊道：“箭不是在你前方更远处吗？[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“箭不是在你前面吗？”原文直译为“从你那里再往前”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: 到了
  rationale: בוא在叙事中表示来到、抵达；“到了”自然表达孩子来到指定地点。
- source_word: הַנַּעַר
  choice: 那孩子
  rationale: נַעַר可指少年、青年或侍从；结合本段语境，此人是约拿单带来的年轻随从，“那孩子”既承接上下文，也不额外强化其身份。
- source_word: עַד מְקוֹם הַחֵצִי
  choice: 箭所在之处
  rationale: עַד表示到达某处，מְקוֹם为地点；这样翻译保留空间关系，同时符合现代汉语表达。
- source_word: אֲשֶׁר יָרָה יְהוֹנָתָן
  choice: 约拿单射出的
  rationale: ירה在此指射箭；定语结构自然体现射箭动作先于孩子抵达。
- source_word: וַיִּקְרָא ... אַחֲרֵי
  choice: 就在他身后喊道
  rationale: קרא与אַחֲרֵי连用，表示朝着走在前面的人从后面呼喊；“在他身后喊道”清楚呈现双方位置。
- source_word: הֲלוֹא
  choice: 不是……吗
  rationale: 该疑问形式通常期待肯定回答；汉语反问句“不是……吗”保留其语用力量。
- source_word: הַחֵצִי
  choice: 箭
  rationale: חֵץ在本场景中明确指箭。
- source_word: מִמְּךָ וָהָלְאָה
  choice: 在你前面更远的地方
  rationale: 该短语字面为“从你那里再往前”，指箭落在孩子所到位置以外；此译清楚保留方向和距离含义。
