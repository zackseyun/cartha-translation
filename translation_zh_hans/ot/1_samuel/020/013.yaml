source:
  edition: WLC
  text: כֹּֽה יַעֲשֶׂה֩ יְהוָ֨ה לִֽ/יהוֹנָתָ֜ן וְ/כֹ֣ה יֹסִ֗יף כִּֽי יֵיטִ֨ב אֶל אָבִ֤/י אֶת הָֽ/רָעָה֙ עָלֶ֔י/ךָ וְ/גָלִ֨יתִי֙ אֶת אָזְנֶ֔/ךָ וְ/שִׁלַּחְתִּ֖י/ךָ וְ/הָלַכְתָּ֣ לְ/שָׁל֑וֹם וִ/יהִ֤י יְהוָה֙ עִמָּ֔/ךְ כַּ/אֲשֶׁ֥ר הָיָ֖ה עִם אָבִֽ/י־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/013.yaml
  text: May Yahweh do so to Jonathan[a], and more also, if my father intends evil against you and I do not disclose it to you and send you away, so that you may go in peace. And may Yahweh be with you[c][b], as he has been with my father.
translation:
  language: zh_hans
  text: 如果我父亲有意加害你，而我却既不把这事告诉你[a]，也不送你平安离去，愿耶和华这样惩罚约拿单，并且更加严厉地惩罚他[b]！愿耶和华与你同在，正如他曾与我父亲同在一样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “告诉你”希伯来文直译为“揭开你的耳朵”，是“告知、透露”的习语。
    reason: lexical_alternative
  - marker: b
    text: 原文的誓言结构较为压缩，字面没有写出“却既不……也不……”；按上下文，这是说约拿单若不把父亲的恶意告诉大卫并送他平安离去，就愿受咒诅。“并且更加严厉地惩罚”译自常见的自咒加重公式，未指定惩罚的程度。
    reason: textual_ambiguity
lexical_decisions:
- source_word: כֹּה יַעֲשֶׂה יְהוָה לִיהוֹנָתָן וְכֹה יֹסִיף
  choice: 愿耶和华这样惩罚约拿单，并且加倍惩罚
  rationale: 这是固定的起誓、自咒套语。“惩罚”把原文省略的灾祸含义自然表达出来；保留第三人称“约拿单”，反映希伯来文没有改用第一人称。
- source_word: יֵיטִב אֶל אָבִי אֶת הָרָעָה עָלֶיךָ
  choice: 我父亲有意加害你
  rationale: 原句直译近于“我父亲以加害你为好”，是省略而带习语色彩的表达；这里译出扫罗乐意或打算加害大卫的意思，同时不把意图强化成已经决定。
- source_word: וְגָלִיתִי אֶת אָזְנֶךָ
  choice: 我却不把这事告诉你
  rationale: “揭开你的耳朵”是“告知、透露”的希伯来语习语。“这事”承接上文的加害意图；否定来自起誓结构中压缩而未明说的条件。
- source_word: וְשִׁלַּחְתִּיךָ וְהָלַכְתָּ לְשָׁלוֹם
  choice: 不送你离开，使你平安地走
  rationale: “送你离开”保留使役和主动协助之意；“使你平安地走”表达随后动作的目的或结果。
- source_word: וִיהִי יְהוָה עִמָּךְ
  choice: 愿耶和华与你同在
  rationale: 用“愿”表达祈愿语气，并按本项目原则将神名译作“耶和华”。
- source_word: כַּאֲשֶׁר הָיָה עִם אָבִי
  choice: 正如他曾与我父亲同在一样
  rationale: “曾”表达完成式所指的既往状态，同时不排除这状态对当下的关联。
theological_decisions:
- issue: 约拿单誓言中隐含的否定
  choice: 正文补出“却不……不……”，让自咒条件明确涵盖没有告知和没有送走大卫两项失信行为。
  alternative: 按字面不补否定，译作“如果我父亲有意加害你，我就把这事告诉你，并送你离开”。
  rationale: 希伯来文起誓套语的条件和后果有所压缩；上下文明示约拿单是在咒诅自己若不履行承诺便受罚。正文补出否定以免中文误解，同时用脚注保留原文形式上的歧义。
- issue: 耶和华与扫罗同在的比较
  choice: 保留“正如他曾与我父亲同在一样”，不解释这是否表示神此刻仍与扫罗同在。
  alternative: 译成“正如他从前与我父亲同在”，明确限定为过去。
  rationale: 原文完成式可指既往经历并带当前关联；保留较开放的时间表达，避免替文本解决其神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。为使中文誓言的逻辑清楚，将原文句首的自咒套语置于条件句之后；保留“约拿单”的第三人称自称及“耶和华”的神名形式。
