source:
  edition: WLC
  text: וְ/לֹֽא תַכְרִ֧ת אֶֽת חַסְדְּ/ךָ֛ מֵ/עִ֥ם בֵּיתִ֖/י עַד עוֹלָ֑ם וְ/לֹ֗א בְּ/הַכְרִ֤ת יְהוָה֙ אֶת אֹיְבֵ֣י דָוִ֔ד אִ֕ישׁ מֵ/עַ֖ל פְּנֵ֥י הָ/אֲדָמָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/015.yaml
  text: And you shall not cut off your steadfast love from my house forever[a], not even when Yahweh cuts off David’s enemies, every one of them, from the face of the earth.
translation:
  language: zh_hans
  text: 你也永远不可断绝你对我家的忠贞之爱[a]；即使雅威把大卫的仇敌逐一从地上剪除，也不可断绝。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “忠贞之爱”也可译作“立约的忠诚”或“信实的爱”。希伯来语חֶסֶד常指盟约关系中忠诚不渝的爱。
    reason: 说明关键希伯来词的语义范围及可行译法。
lexical_decisions:
- source_word: תַכְרִת / בְּהַכְרִת（כרת）
  choice: 断绝／剪除
  rationale: כרת在本节两次出现，分别以“断绝”爱和“剪除”仇敌表达。汉语无法用同一动词自然搭配这两个宾语，因此采用同属“除去、使不再存在”语义范围的词，尽量保留原文的呼应。
- source_word: חַסְדְּךָ
  choice: 你……的忠贞之爱
  rationale: חֶסֶד在约的关系中兼有爱、忠诚和持守承诺之意。“忠贞之爱”既不缩减为一般的善意，也不把它限定为纯法律术语。
- source_word: מֵעִם בֵּיתִי
  choice: 对我家
  rationale: “家”保留בַּיִת所含的家庭、后代和家系意义；“对……断绝”按现代汉语调整了介词表达。
- source_word: עַד עוֹלָם
  choice: 永远
  rationale: 自然、庄重地表达持续不止的时间。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译上帝向以色列启示的专名，不用头衔替代专名。
- source_word: אֹיְבֵי דָוִד
  choice: 大卫的仇敌
  rationale: 直接保留原文所属关系。
- source_word: אִישׁ
  choice: 逐一
  rationale: 此处单数אִישׁ跟在复数“仇敌”之后，具有逐个分配的作用；“逐一”在汉语中自然地保留每一个都包括在内的强调。
- source_word: מֵעַל פְּנֵי הָאֲדָמָה
  choice: 从地面上
  rationale: 贴近原文“从土地表面之上”的意象，同时符合现代汉语表达。
- source_word: וְלֹא ... וְלֹא
  choice: 不可……；即使……也不可
  rationale: 把第二个否定理解为加强前面的请求，清楚表达：即便雅威剪除大卫仇敌的时候，大卫也不可断绝对约拿单家的忠贞之爱。
theological_decisions:
- issue: חֶסֶד在盟约语境中的性质
  choice: 正文译为“忠贞之爱”，并用脚注说明其盟约内涵
  alternative: “立约的忠诚”、“慈爱”、“信实的爱”
  rationale: 上下文涉及约拿单与大卫及其家室所立的约，因此此词不只是一般恩 kindness；但正文也不应把它收窄为单纯的条约义务。“忠贞之爱”兼顾关系中的爱与忠诚。
- issue: 第二分句与请求的关系
  choice: 译作“即使……也不可断绝”，使其成为前一请求的强调延伸
  alternative: 将雅威剪除仇敌理解为与请求连接较松的插入说明
  rationale: 两个否定及其间的不定式结构支持强调性的连接；这样也保留约拿单在大卫众仇敌遭剪除之际为自己家室求恩待的张力。
- issue: אִישׁ的分配范围
  choice: 以“逐一”表达每一个仇敌都包括在内
  alternative: “每一个人”、“各人”
  rationale: “逐一”准确传达分配意义，又避免在汉语中生硬地重复“仇敌中的每一个人”。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。为使“即使……也不可”的逻辑完整，末尾重述“不可断绝”；这是汉语句法所需的明示，并未增加新的命令。正文保留“我家”的家系意象，并以“雅威”呈现神的专名。
