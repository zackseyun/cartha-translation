base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/019.yaml
  text: On the third day[a], go down quickly and come to the place where you hid yourself on the day of the deed[b], and remain beside the stone Ezel.
translation:
  language: zh_hans
  text: 第三天[a]，你要快快下去，到你在那件事的那一天曾藏身的地方，留在那块名叫以色[c]的石头旁边。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “第三天”所译的希伯来语表达较难确定，也可理解为“第三次”或“过了三天”。本段语境支持这里指约定行动的第三天。
    reason: lexical_alternative
  - marker: c
    text: “以色”很可能是这块石头的名称或固定称呼；相应的希伯来语可能与“走、离去”有关，但确切含义不详。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁלַּשְׁתָּ
  choice: 到第三天
  rationale: 该动词由“三”构成，在本段语境中最自然地指约定行动的第三天；原文表达简略且有歧义，因此在注脚中保留其他可能理解。
- source_word: תֵּרֵד מְאֹד
  choice: 赶快下去
  rationale: תֵּרֵד意为“下去”，מְאֹד是加强语气的副词。结合秘密行动的语境，以“赶快”表达动作的强烈程度，同时用注脚说明也可能指下到很远或很低的地方。
- source_word: וּבָאתָ אֶל הַמָּקוֹם
  choice: 来到……地方
  rationale: בוא的基本义为“来、进入”；这里是约拿单指示大卫前往双方知道的地点，用“来到”自然且贴近原文。
- source_word: אֲשֶׁר נִסְתַּרְתָּ שָּׁם
  choice: 你从前……藏身的
  rationale: נסתּר在此表达主动藏匿自己的意思；现代汉语用“藏身”简洁自然。“从前”按上下文补出，表明所指是先前藏过的地方。
- source_word: בְּיוֹם הַמַּעֲשֶׂה
  choice: 在那件事发生的日子
  rationale: מַעֲשֶׂה可指行为、事情或事务。这里所指并不完全明确，因此采用较开放的“那件事”，不把它具体限定为某一行为。
- source_word: וְיָשַׁבְתָּ
  choice: 留在
  rationale: ישׁב可指坐下、居住或停留；在藏身等候的指令中，“留在”最符合实际语义。
- source_word: אֵצֶל הָאֶבֶן הָאָזֶל
  choice: 在以色石旁边
  rationale: אֶבֶן是“石头”；הָאָזֶל很可能是这块石头的专名或固定称呼。正文采用音译“以色”，注脚交代其词义和性质并不确定。
