reference: 1 Samuel 20:8
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/עָשִׂ֤יתָ חֶ֨סֶד֙ עַל עַבְדֶּ֔/ךָ כִּ֚י בִּ/בְרִ֣ית יְהוָ֔ה הֵבֵ֥אתָ אֶֽת עַבְדְּ/ךָ֖ עִמָּ֑/ךְ וְ/אִם יֶשׁ בִּ֤/י עָוֺן֙ הֲמִיתֵ֣/נִי אַ֔תָּה וְ/עַד אָבִ֖י/ךָ לָ/מָּה זֶּ֥ה תְבִיאֵֽ/נִי־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/008.yaml
  text: So show kindness to your servant[a], for you have brought your servant into the covenant of Yahweh with yourself. But if there is guilt in me, put me to death yourself[b]; why should you bring me to your father?
translation:
  language: zh_hans
  text: 所以，求你以慈爱待你的仆人[a]，因为你使你的仆人与你一同进入了雅威的约[b]。但如果我有罪，就请你亲手杀我；又何必把我带到你父亲那里呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “以慈爱待”也可译作“以守约的忠诚待”。希伯来语חֶסֶד可指忠诚、慈爱，尤其可包含守约的恩情。
    reason: lexical_alternative
  - marker: b
    text: 这句也可理解为：“因为你借着雅威的约使你的仆人与你联结。”
    reason: alternative_reading
lexical_decisions:
- source_word: וְעָשִׂיתָ חֶסֶד
  choice: 求你以慈爱待
  rationale: חֶסֶד兼有恩慈、忠诚之爱和守约之情等含义。此处是大卫基于盟约向约拿单恳求，因此正文用自然而庄重的“以慈爱待”，脚注补明其守约内涵。
- source_word: עַל עַבְדֶּךָ
  choice: 你的仆人
  rationale: עֶבֶד在这里是大卫谦恭的自称，不着重表达奴隶身份；“仆人”符合宫廷语境和现代中文表达。
- source_word: בִּבְרִית יְהוָה
  choice: 进入了雅威的约
  rationale: בְּ可表示在某约之中，也可能带有凭借该约的意味；结合使役式“带入”，正文译作进入盟约关系。יהוה作为神的专名音译为“雅威”，不以称号代替。
- source_word: הֵבֵאתָ אֶת עַבְדְּךָ עִמָּךְ
  choice: 你使你的仆人与你一同进入了
  rationale: הֵבֵאתָ是בוא的使役式，意为“使……进入/带入”；עִמָּךְ表示“与你一起”。此译保留约拿单把大卫带入双方共同盟约关系的意思。
- source_word: וְאִם יֶשׁ בִּי עָוֹן
  choice: 但如果我有罪
  rationale: עָוֹן可指罪孽、罪责或罪罚；此处大卫所说的是自己若确有应受处置的罪责，中文用“有罪”最清楚自然。
- source_word: הֲמִיתֵנִי אַתָּה
  choice: 就请你亲手杀我
  rationale: 独立人称代词אַתָּה带强调意味；“亲手”自然传达“由你自己来”的语气，也保留请求的严肃性。
- source_word: וְעַד אָבִיךָ לָמָּה זֶּה תְבִיאֵנִי
  choice: 又何必把我带到你父亲那里呢
  rationale: עַד在这里有“直到、到……那里”的方向含义。整句是反问：若大卫有罪，约拿单可亲自杀他，无须把他交到扫罗那里。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名יהוה。正文采用较贴近YHWH可能读音的“雅威”，保留其作为以色列之神专名的性质，而不改译为“主”等称号。
- issue: חֶסֶד是否明确译成“守约的忠诚”
  choice: 正文作“慈爱”，脚注说明守约含义
  alternative: 以守约的忠诚待
  rationale: 该词在此既表达个人恩待，也因下文提及雅威之约而带有盟约忠诚的色彩。正文不把丰富词义缩窄为单一神学术语，脚注则保留盟约背景。
- issue: 盟约短语中בְּ和עִמָּךְ的关系
  choice: 你使你的仆人与你一同进入了雅威的约
  alternative: 你借着雅威的约使你的仆人与你联结
  rationale: 希伯来语可直解为约拿单把大卫“与自己一起”带入雅威之约，也可理解为借此约使二人联结。正文紧贴词序和使役动词，脚注保留另一种关系表达。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以“求你”“仆人”“亲手”等表达保留大卫恳求中的谦卑与严肃；句末反问用“何必……呢”呈现原文语气。
