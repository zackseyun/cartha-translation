base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/040.yaml
  text: Then Jonathan gave his weapons to the young man who was with him and said to him[a], “Go[c][b], bring them to the city.”
translation:
  language: zh_hans
  text: 约拿单把自己的兵器交给他的少年随从[a]，对他说：“你去，把这些[b]带到城里去。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “少年”也可译作“青年”或“侍从”。希伯来文表明他是隶属或随侍约拿单的人。
    reason: lexical_alternative
  - marker: b
    text: “兵器”也可泛译为“装备”或“器具”。“这些”是原文省略、根据上文补出的宾语。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: 交给
  rationale: נתן在叙事中表示“给、交付”；此处是约拿单把随身器具交由少年带走，“交给”自然且准确。
- source_word: יְהוֹנָתָן
  choice: 约拿单
  rationale: 采用现代中文圣经人名的通行译法。
- source_word: כֵּלָיו
  choice: 自己的兵器
  rationale: כְּלִי可泛指器具、装备，也可指兵器；上下文提到弓箭，因此正文译作“兵器”，同时用脚注保留较宽泛的可能。
- source_word: הַנַּעַר אֲשֶׁר לוֹ
  choice: 跟随他的少年
  rationale: נַעַר可指少年、青年或侍从；אֲשֶׁר לוֹ表达此人隶属或随侍约拿单的关系。“跟随他的少年”既自然，也不把其具体身份过度限定为仆人。
- source_word: וַיֹּאמֶר לוֹ
  choice: 对他说
  rationale: 直接对应普通言说动词אמר及其间接受词。
- source_word: לֵךְ
  choice: 你去
  rationale: 准确传达הלך的命令式；加入“你”符合现代汉语直接命令的自然表达。
- source_word: הָבֵיא
  choice: 把这些带回
  rationale: בוא的使役式通常表示“带来”；从城外把物品送至城里，汉语用“带回”更自然。“这些”是根据前文兵器补出的隐含宾语。
- source_word: הָעִיר
  choice: 城里
  rationale: 定冠词名词意为“那城／城”；与方向性动作搭配译作“城里”符合现代汉语习惯，不额外指明城名。
theological_decisions: []
