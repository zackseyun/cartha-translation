id: 1SA.20.23
reference: 1 Samuel 20:23
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/הַ֨/דָּבָ֔ר אֲשֶׁ֥ר דִּבַּ֖רְנוּ אֲנִ֣י וָ/אָ֑תָּה הִנֵּ֧ה יְהוָ֛ה בֵּינִ֥/י וּ/בֵינְ/ךָ֖ עַד עוֹלָֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/023.yaml
  text: And as for the matter that you and I have spoken of[a], behold, Yahweh is between me and you forever.
translation:
  language: zh_hans
  text: 至于你我所谈的事[a]，看哪，耶和华永远在你我之间。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你我所说的话。”希伯来语 דָּבָר 可指“话”“事”或“事情”；这里指双方刚才所谈定的约定。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַדָּבָר
  choice: 至于……事
  rationale: דָּבָר 可指“话、事、事情”；本节承接约拿单与大卫刚才谈定的约定，以“事”最自然。“至于”体现前缀连词在此引出话题的作用。
- source_word: אֲשֶׁר דִּבַּרְנוּ אֲנִי וָאָתָּה
  choice: 你我所谈的
  rationale: 直译为“我和你所说的”。现代汉语用“你我所谈的”简洁自然，也保留双方共同商谈及其现实关联。
- source_word: הִנֵּה
  choice: 看哪
  rationale: 这是引人郑重注意的话语标记；“看哪”保留原文庄重、强调的语气。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代简体中文读者熟悉的专名“耶和华”直接呈现四字神名，不以称号替代。
- source_word: בֵּינִי וּבֵינְךָ
  choice: 在你我之间
  rationale: 原文为“在我与你之间”。中文“你我之间”更自然，同时保留耶和华处于双方之间这一含有见证与担保意味、但未明说其具体角色的表达。
- source_word: עַד עוֹלָם
  choice: 永远
  rationale: 准确表达持续无尽的时间，语言自然且符合本节盟约语境的庄重感。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。正文保留为专名；采用现代中文圣经语境中普通读者最熟悉的“耶和华”，而不以“主”替代。
- issue: 耶和华“在……之间”的含义
  choice: 保留“在你我之间”
  alternative: 扩译为“在你我之间作证／作保”
  rationale: 上下文暗示耶和华是双方盟约的见证者或保障者，但本节希伯来文本只明说“在……之间”。直保留该措辞，可维持其盟约含义和原有张力，避免把隐含意义写入正文。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“至于”承接上文并突出所谈之事；“看哪”保留原文郑重强调的语气。脚注标记已在正文对应位置标出。
