  to: 于是，扫罗向约拿单大发烈怒，对他说：“你这乖僻悖逆之妇人的儿子！[a]难道我不知道你选择了耶西的儿子[b]，使你自己蒙羞，也使你母亲的赤身蒙羞吗？”[c]
