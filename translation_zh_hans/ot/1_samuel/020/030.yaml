base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/030.yaml
  text: Then Saul’s anger burned against Jonathan[a], and he said to him, “You son of a perverse, rebellious woman! Do I not know that you have chosen the son of Jesse[c][b], to your own shame and to the shame of your mother’s nakedness?”
translation:
  language: zh_hans
  text: 于是，扫罗向约拿单大发烈怒，对他说：“你这乖僻悖逆之妇人的儿子！[a]难道我不知道你选择了耶西的儿子[b]，使你自己蒙羞，也使你母亲的赤身蒙羞吗？”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你这乖僻悖逆之子！”这句希伯来语辱骂语含义艰深，措辞高度习语化。
    reason: lexical_alternative
  - marker: b
    text: “选择了耶西的儿子”也可理解为“站在耶西的儿子一边”。
    reason: lexical_alternative
  - marker: c
    text: “使你母亲的赤身蒙羞”是强烈的希伯来语羞辱说法，表达对母亲及家族的耻辱。
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּחַר אַף שָׁאוּל בִּיהוֹנָתָן
  choice: 扫罗向约拿单怒火中烧
  rationale: 保留希伯来语“怒气燃烧”的鲜明意象，同时以现代汉语自然表达介词所指向的发怒对象。
- source_word: בֶּן נַעֲוַת הַמַּרְדּוּת
  choice: 你这乖僻悖逆妇人的儿子
  rationale: 这是含义艰深、极具侮辱性的希伯来语骂语；“乖僻悖逆”分别传达扭曲与反叛之意，补出“妇人”以显明随后的母系羞辱语境。
- source_word: הֲלוֹא יָדַעְתִּי
  choice: 难道我不知道
  rationale: 保留原文否定疑问句的反问形式及其质问语气。
- source_word: בֹחֵר אַתָּה לְבֶן יִשַׁי
  choice: 你选择了耶西的儿子
  rationale: 直译“选择”的词义核心，不把上下文所暗示的“站在……一边”直接写入正文。
- source_word: לְבָשְׁתְּךָ
  choice: 使你自己蒙羞
  rationale: 将结果意义的介词结构译为自然汉语，并明确其羞辱落在约拿单本人身上。
- source_word: וּלְבֹשֶׁת עֶרְוַת אִמֶּךָ
  choice: 也使你母亲的下体蒙羞
  rationale: 保留 עֶרְוָה 所指的赤裸、私处含义及原话刻意冒犯的力度；“下体”比抽象的“赤身”更能传达此处针对母亲及家族的粗厉羞辱。
