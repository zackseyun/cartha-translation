base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/027.yaml
  text: And it happened on the next day[a], the second day of the new moon, that David’s place was empty. So Saul said to Jonathan his son, “Why has the son of Jesse not come to the meal either yesterday or today?”
translation:
  language: zh_hans
  text: 次日，就是新月节的第二天，大卫的座位空着。扫罗就问他儿子约拿单：“耶西的儿子为什么昨天、今天都没有来吃饭[a]？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“到饼那里”，这里指前来赴席吃饭。
    reason: 说明希伯来语以“饼”代指整顿饭食的表达。
lexical_decisions:
- source_word: מִמָּחֳרַת
  choice: 次日
  rationale: 表示前述那一天之后的一天；“次日”简洁自然，也保留叙事的时间顺序。
- source_word: הַחֹדֶשׁ הַשֵּׁנִי
  choice: 新月节的第二天
  rationale: 结合前后文的王家宴席，חֹדֶשׁ在这里指新月庆典，而不只是一般意义上的月份；译文明确这是庆典的第二天。
- source_word: וַיִּפָּקֵד מְקוֹם דָּוִד
  choice: 大卫的座位空着
  rationale: 此处פקד的尼法勒形式表达大卫的位置无人占据；按宴席场景译为“座位空着”，既贴近原意又符合现代汉语。
- source_word: בְּנוֹ
  choice: 他儿子
  rationale: 保留原文明确的父子关系称谓。
- source_word: מַדּוּעַ
  choice: 为什么
  rationale: 这是询问原因的普通疑问词，“为什么”是自然、准确的现代汉语表达。
- source_word: בֶן יִשַׁי
  choice: 耶西的儿子
  rationale: 保留扫罗不用大卫本名、而以父名称呼他的说法，不消除其中可能含有的疏离或轻蔑语气。
- source_word: גַּם תְּמוֹל גַּם הַיּוֹם
  choice: 昨天、今天都没有
  rationale: 原文直译为“昨天也、今天也”；在否定问句中译为“昨天、今天都没有”，自然地保留连续两天的范围。
- source_word: אֶל הַלָּחֶם
  choice: 来吃饭
  rationale: לֶחֶם字面为“饼、食物”，此处借指赴席用餐；“来吃饭”符合汉语表达，并保留动词בוא“来”的方向感。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“次日，就是……”保留原文的叙事推进与同位说明；称呼“耶西的儿子”不改成“大卫”，以保存扫罗话语中的修辞色彩。脚注标记置于实际对应的“吃饭”之后。
