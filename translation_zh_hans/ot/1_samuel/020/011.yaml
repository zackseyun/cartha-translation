  text: Then Jonathan said to David[a], “Come, and let us go out into the field.” So both of them went out into the field.
translation:
  language: zh_hans
  text: 约拿单对大卫说：“来，我们到田野去。”于是他们二人就出到田野去了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 叙事性连续式推进事件；现代汉语通常不必逐字译出连接词，语序本身已清楚表达先后。
- source_word: יְהוֹנָתָן
  choice: 约拿单
  rationale: 采用现代中文圣经中通行的人名译法。
- source_word: אֶל דָּוִד
  choice: 对大卫
  rationale: אֶל在言说动词后自然译为“对”；“大卫”采用通行人名译法。
- source_word: לְכָה
  choice: 来
  rationale: 该阳性单数祈使式字面可指“去”，但这里约拿单邀请大卫与自己同行，汉语用“来”最自然，也与后面的共同提议相配。
- source_word: וְנֵצֵא
  choice: 我们到……去
  rationale: 第一人称复数鼓励式表达共同提议；“我们……去”在现代汉语中自然传达邀请语气。动词יָצָא的“出去”含义由前往田野这一移动表达体现。
- source_word: הַשָּׂדֶה
  choice: 田野
  rationale: שָׂדֶה可指田地或郊外开阔地；此处“田野”既直接，又适合二人离开当前场所私下交谈的叙事情境。
- source_word: וַיֵּצְאוּ
  choice: 于是……到了
  rationale: 连续式表示提议后随即发生的行动；“于是”体现叙事推进。“到了田野”是自然汉语，同时表达他们出去前往该处。
- source_word: שְׁנֵיהֶם
  choice: 二人一同
  rationale: 保留原文对“两个人都去”的强调，并以自然简洁的汉语表明约拿单与大卫同行。
- source_word: הַשָּׂדֶה
  choice: 田野
  rationale: 保留原文目的地的重复，不将第二处省略。
