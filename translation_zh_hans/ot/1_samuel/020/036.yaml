  yaml_path: translation/ot/1_samuel/020/036.yaml
  text: He said to his young man[a], “Run, please, find the arrows that I am shooting.” The young man ran, and he shot the arrow beyond him.
translation:
  language: zh_hans
  text: 他对自己的年轻随从说：“你跑去找我所射的箭吧。”那年轻随从跑去，他就射了一支箭，射过那年轻随从。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְנַעֲרוֹ / הַנַּעַר
  choice: 自己的童仆 / 童仆
  rationale: נַעַר可指少年、随从或仆役；本段所指是约拿单身边年轻的侍从。“童仆”兼顾其年龄和服侍身份，又不把重点单限于奴仆地位。
- source_word: רוּץ
  choice: 跑去
  rationale: 直译命令式“跑”；加“去”符合汉语动作方向和现场语境。
- source_word: מְצָא נָא
  choice: 吧，把……找来
  rationale: מְצָא意为“找到”，נָא使命令语气较缓和；用“吧”体现这一语气，而“找来”自然表达奉命拾回箭的行动。
- source_word: הַחִצִּים
  choice: 箭
  rationale: 原文为复数；现代汉语中“箭”本身可作无标记集合名词，避免生硬地说“那些箭”。
- source_word: אֲשֶׁר אָנֹכִי מוֹרֶה
  choice: 我射出的
  rationale: 分词מוֹרֶה在此表示正在进行或随即进行的射箭行动；汉语以“射出的”自然涵盖所射之箭，不强行判定为纯现在或将来。
- source_word: וְהוּא יָרָה הַחֵצִי
  choice: 他便射出一支箭
  rationale: 原文转为带定冠词的单数“箭”；汉语叙事首次具体提到这一支箭时，用“一支箭”最自然，同时保留由泛指多箭转到具体一箭的变化。
- source_word: לְהַעֲבִירוֹ
  choice: 让箭越过童仆
  rationale: עבר的使役式不定词表示使某物经过或越过，3阳性单数后缀最自然地指童仆；明说“箭”和“童仆”可消除汉语代词指向不清，同时保留越过/射到前面的空间关系。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“童仆”保留年轻随从的身份色彩；“吧”体现נָא缓和命令的语气。末句重复“箭”和“童仆”，是为避免两个阳性单数代词在汉语中造成歧义。
