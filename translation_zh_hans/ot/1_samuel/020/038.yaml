  source_fidelity: 译文准确传达了约拿单从少年身后呼喊、连续催促、少年收取箭并来到约拿单身边的叙事。惟“收拾起来”较易指整理，未充分表达לקט的拾取动作；改为“拾起”更贴切。“他主人”也比无定指的“主人”更清楚地对应带后缀的“他的主人”。
  naturalness: 整体为自然现代汉语。“在那少年身后喊道”可保留原文“在……之后呼喊”的方向感；将第二个催促语改为“快些”可避免“快／赶紧”语义过于重叠，同时仍保留双重急迫。
  terminology: “少年随从”恰当地兼顾נער的年轻和侍从身份；“主人”准确对应此处指约拿单的人间主人，未引入神学含义。“那些箭”按上下文表达该词的集合／复数所指。
