base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/038.yaml
  text: And Jonathan called after the boy[b][a], “Hurry! Be quick! Do not stop!” So Jonathan’s boy gathered up the arrows and came to his master.
translation:
  language: zh_hans
  text: 约拿单在那少年身后喊道：“快！快些！不要停下[a]！”约拿单的少年随从拾起那些箭[b]，来到他主人那里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“不要站住”；这里的意思是“不要停下”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文中“箭”的书写形式可能看似单数，但上下文所指的是约拿单射出的箭。
    reason: textual_or_orthographic_clarification
lexical_decisions:
- source_word: וַיִּקְרָא ... אַחֲרֵי הַנַּעַר
  choice: 约拿单在那少年身后喊道
  rationale: קרא אחרי 表示朝着正在前行的人从后面呼喊；“喊道”体现远距离呼唤的力度，“少年”保留 נַעַר 的年龄意味。
- source_word: מְהֵרָה חוּשָׁה
  choice: 快！赶紧！
  rationale: 两个相邻的催促语都予以保留，以传达原文重复加强的急迫感，同时采用自然的现代汉语表达。
- source_word: אַל תַּעֲמֹד
  choice: 不要停下
  rationale: עמד 字面为“站立”，但在此处是催促少年继续行动，不可停留；正文按语境译为“不要停下”，脚注保留字面信息。
- source_word: וַיְלַקֵּט
  choice: 收拾起来
  rationale: לקט 表示拾取、收集；“收拾起来”自然地描述少年把射出的箭逐一捡回的动作。
- source_word: נַעַר יְהוֹנָתָן
  choice: 约拿单的少年随从
  rationale: נַעַר 在此既指年轻人，也指服侍主人的随从；“少年随从”兼顾年龄和身份，并避免“约拿单的少年”在现代汉语中的歧义。
- source_word: החצי
  choice: 箭
  rationale: 马所拉文本此词的书写形式可能看似单数，但上下文指约拿单射出的箭；汉语“箭”本身可作集合性表达，既自然又不必强加复数标记。
- source_word: אֶל אֲדֹנָיו
  choice: 回到主人那里
  rationale: אָדוֹן 在此指少年随从的人间主人约拿单；“主人”符合双方身份关系，“回到……那里”自然表达 וַיָּבֹא אֶל 的移动结果。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“快！赶紧！”保留原文双重催促的节奏；以“少年随从”兼顾 נַעַר 的年龄与侍从身份。
