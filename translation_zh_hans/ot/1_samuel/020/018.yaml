  text: Jonathan said to him[a], “Tomorrow is the new moon, and you will be missed, because your seat will be empty.”
translation:
  language: zh_hans
  text: 约拿单对他说：“明天是新月节，你会被人注意到[a]，因为你的座位会空着。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你会被察觉……你的座位会空着。”原文这两处都使用同一希伯来词根；前一处指人的缺席受到注意，后一处指座位空缺，形成中文难以自然保留的文字呼应。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר לוֹ
  choice: 对他说
  rationale: 按希伯来叙事句式自然译出 אמר 加间接宾语；中文上下文中以“对他说”引出直接引语。
- source_word: יְהוֹנָתָן
  choice: 约拿单
  rationale: 采用现代简体中文圣经人名的通行音译。
- source_word: מָחָר
  choice: 明天
  rationale: 直接表达时间副词的意义。
- source_word: חֹדֶשׁ
  choice: 新月节
  rationale: 这里不是泛指“月份”，而是指王室设宴、需要出席的新月庆典；译作“新月节”能让现代读者明白其礼仪语境。
- source_word: וְנִפְקַדְתָּ
  choice: 你不在座，必会有人留意
  rationale: נפקד 在此表示大卫缺席会受到注意。中文若仅译“你会被想念”容易误解为感情上的思念，因此明确译出缺席语境，同时保留被注意的意思。
- source_word: כִּי
  choice: 因为
  rationale: 自然地引出前句所述情况的原因。
- source_word: יִפָּקֵד
  choice: 会空着
  rationale: 同一词根 פקד 再次以被动式出现，以“座位”为主语时表示该位置无人占用；中文译作“会空着”最自然，但原文的重复双关另以脚注说明。
- source_word: מוֹשָׁבֶךָ
  choice: 你的座位
  rationale: 宴席语境表明这里指大卫在席间的位置，“座位”比宽泛的“地方”更准确。
