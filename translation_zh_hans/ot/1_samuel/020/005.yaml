base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/005.yaml
  text: David said to Jonathan[a], “Look, tomorrow is the new moon, and I am supposed to sit with the king to eat. But let me go[b], so that I may hide myself in the field until the third evening.”
translation:
  language: zh_hans
  text: 大卫对约拿单说：“你看，明天是新月之日[a]，我原本要与王同席吃饭。请准我离开，好让我躲在田野里，直到第三晚[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “新月之日”指每月新月出现的日子；当时通常会有特别的庆祝和筵席。
    reason: cultural_note
  - marker: b
    text: 也可译作“直到第三天晚上”。希伯来原文在这里采用了省略的表达。
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: 你看
  rationale: 保留提示对方注意眼前情势的语用作用，同时采用自然的现代汉语表达。
- source_word: חֹדֶשׁ מָחָר
  choice: 明天是月朔
  rationale: חֹדֶשׁ 在此指每月新月的日子及相关庆典；“月朔”简洁地保留这一历法和礼俗含义，并以脚注说明。
- source_word: יָשֹׁב אֵשֵׁב
  choice: 我本应……同席
  rationale: 不定式绝对式与限定动词连用，加强既定安排或社会期待；“本应”表达大卫按惯例应当出席，而不将其说成个人道德义务。
- source_word: עִם הַמֶּלֶךְ לֶאֱכֹל
  choice: 与王同席吃饭
  rationale: 兼顾原文“与王一起坐”和“吃”的具体意象，汉语表达自然。
- source_word: וְשִׁלַּחְתַּנִי
  choice: 请准我离开
  rationale: 原义为“打发我走／让我走”；在此是大卫请求约拿单准许他不出席，故如此表达。
- source_word: וְנִסְתַּרְתִּי
  choice: 好让我藏在田野
  rationale: 承接前面的请求，可带意愿或目的意味；“好让我”自然表达准许离开所要达到的目的。
- source_word: בַשָּׂדֶה
  choice: 在田野
  rationale: 保留原文单数名词的具体场景，不泛化为“乡间”。
- source_word: עַד הָעֶרֶב הַשְּׁלִשִׁית
  choice: 直到第三个晚上
  rationale: 原文表达省略而略显含混；正文尽量保留“第三”和“晚上”的形式，不直接断定为“第三天晚上”，并用脚注说明通常理解。
theological_decisions: []
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“月朔”保留古代历法礼俗色彩，并借脚注帮助普通读者理解；“本应”突出既定期待而非道德判断。脚注标记依其实际说明对象置于“月朔”和“第三个晚上”之后。
