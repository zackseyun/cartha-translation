base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/003.yaml
  text: But David swore again and said, “Your father certainly knows that I have found favor in your eyes, and he has said, ‘Jonathan must not know this, lest he be grieved.’ But as the LORD lives, and as your soul lives, there is only a step between me and death.”
translation:
  language: zh_hans
  text: 大卫又起誓说：“你父亲明明知道我在你眼中蒙恩；他便说：‘不可让约拿单知道这事，免得他难过。’然而，我指着耶和华永活，也指着你的性命起誓，我离死不过一步。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יָדֹעַ יָדַע
  choice: 明明知道
  rationale: 希伯来文以不定式绝对式加强动词语气，译为“明明知道”既表达确定、强调，也符合现代汉语。
- source_word: מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: 我在你眼中蒙恩
  rationale: 保留希伯来语“在某人眼中蒙恩”的关系性表达，在中文圣经语体中自然且易懂。
- source_word: אַל יֵדַע זֹאת יְהוֹנָתָן
  choice: 不可让约拿单知道这事
  rationale: 原文形式为“不要让约拿单知道这事”，语境中是扫罗内心的决定；“不可让”保留其意志性，而不改写成单纯预测。
- source_word: חַי יְהוָה וְחֵי נַפְשֶׁךָ
  choice: 我指着永活的耶和华，也指着你的性命起誓
  rationale: 这是双重起誓公式；中文补出“起誓”使句法完整，并保留神的圣名及对约拿单性命的郑重援引。
- source_word: כְפֶשַׂע
  choice: 不过一步
  rationale: 该词表示极短距离或微小间隔；“不过一步”保留原文空间隐喻，并准确传达死亡迫近。
theological_decisions:
- issue: 神圣名号 יהוה 的译法
  choice: 耶和华
  alternative: 上主／雅威
  rationale: 采用普通简体中文读者最熟悉的专名“耶和华”，清楚表明原文是以色列神的专名，而非一般称谓。
- issue: “指着你的性命”是否构成起誓
  choice: 将两个“永活”公式统一纳入“起誓”
  alternative: 直译为“耶和华活着，你的性命也活着”
  rationale: 原文是惯用誓言公式；显明其起誓功能可避免中文误解，同时不改变誓言的双重郑重表达。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“蒙恩”“指着……起誓”保留经文语体，但句式仍便于普通读者理解；引号层级清楚呈现大卫转述扫罗的话。
