base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/035.yaml
  text: In the morning[a], Jonathan went out to the field for the appointed meeting with David[b], and a young boy was with him.
translation:
  language: zh_hans
  text: 到了早晨，约拿单到田野去，赴与大卫约定的会面[a]；有一个小童[b]随同他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“按与大卫约定的时间前去。”希伯来语“מוֹעֵד”既可指约定的时间，也可指约定的会面；上下文较支持“约定的会面”。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“小男孩”“少年”或“年轻的随从”。希伯来语“נַעַר”可按语境指男孩、少年或随从。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַבֹּקֶר
  choice: 到了早晨
  rationale: וַיְהִי承接叙事进程，בַבֹּקֶר点明时间；译作“到了早晨”既自然，也保留事件推进的语气。
- source_word: וַיֵּצֵא
  choice: 去
  rationale: יצא有“出去、前往”之意；与目的地“田野”连用时，“到田野去”自然地表达其方向性。
- source_word: יְהוֹנָתָן
  choice: 约拿单
  rationale: 采用现代中文圣经语境中通行的人名译法。
- source_word: הַשָּׂדֶה
  choice: 到田野
  rationale: שָׂדֶה指田野或郊野的开阔地；定冠词表明此处是上下文所指的那片田野。
- source_word: לְמוֹעֵד דָּוִד
  choice: 赴与大卫所约的会
  rationale: מוֹעֵד可指约定的时间或约定的会面。上下文是二人预先安排的会合与信号，因此正文采用“所约的会”，同时以脚注保留“约定时间”的可能。
- source_word: וְנַעַר קָטֹן
  choice: 有一个小童
  rationale: נַעַר可指男孩、少年或随从，קָטֹן强调年幼或幼小。“小童”兼顾年龄与其受差遣的叙事情境，又不把“仆役”身份写死。
- source_word: עִמּוֹ
  choice: 跟着他
  rationale: 该短语表示陪同。“跟着他”符合现代汉语叙事，并与下一节约拿单差遣小童的情景衔接。
