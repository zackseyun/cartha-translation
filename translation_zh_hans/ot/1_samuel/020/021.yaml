revisions:
- from: 看哪，我要差那少年去，说：‘去，把箭找回来。’如果我明确地对那少年说：‘看哪，箭在你这边；拿起来，回来吧’，那你就平安无事。永活的耶和华可以作证。[a]
  to: 看哪，我要差那少年去，说：‘去找那些箭。’如果我明确地对那少年说：‘你看，箭在你这边；把它们拿来。’你就平安无事；我指着永活的耶和华起誓。[a][b]
  rationale: 修订将“找箭”与随后“拿来”的两个动作分开，避免增译；将第二个提示语调整为自然的对话用语；保留相对方位的含混性并用脚注说明；并将神名和“永活”起誓公式以现代汉语惯用的誓言表达直接呈现。
