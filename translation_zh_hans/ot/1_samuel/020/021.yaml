    rationale: לֵךְ מְצָא意为“去找箭”；取箭并朝说话者返回是在后面的קָחֶנּוּ וָבֹאָה中才表达。应避免在前一命令中重复或提前加入后一命令的内容。
  - severity: medium
    issue: “永活的耶和华可以作证”未直接译出起誓公式
    rationale: חַי יְהוָה是“耶和华永活”的固定起誓语。‘可以作证’是解释性的语用改写，并非原文的直接陈述；以汉语常用的‘我指着永活的耶和华起誓’可保留其誓言功能。
  - severity: low
    issue: 方位表达需要说明
    rationale: “在你这边”可保留原文相对方位，但现代读者未必立刻明白这是箭落在少年未到之处、即靠说话者的一侧。应增设对应脚注，而不在正文强加绝对空间方位。
