source:
  edition: WLC
  text: וְ/הִנֵּה֙ אֶשְׁלַ֣ח אֶת הַ/נַּ֔עַר לֵ֖ךְ מְצָ֣א אֶת הַ/חִצִּ֑ים אִם אָמֹר֩ אֹמַ֨ר לַ/נַּ֜עַר הִנֵּ֥ה הַ/חִצִּ֣ים מִמְּ/ךָ֣ וָ/הֵ֗נָּה קָחֶ֧/נּוּ וָ/בֹ֛אָ/ה כִּֽי שָׁל֥וֹם לְ/ךָ֛ וְ/אֵ֥ין דָּבָ֖ר חַי יְהוָֽה־־־׀׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/021.yaml
  text: And look[a], I will send the young man, saying, ‘Go, find the arrows.’ If I plainly say to the young man, ‘Behold, the arrows are on this side of you; take them and come,’ then there is peace for you and no danger[b], as Yahweh lives.
translation:
  language: zh_hans
  text: 看哪，我要差那少年去，说：‘去找那些箭。’如果我明确地对那少年说：‘你看，箭在你这边；把它们拿来。’你就平安无事；我指着永活的耶和华起誓。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“箭比你近”或“箭在你这一边”。希伯来语表示箭落在少年尚未到达之处，即在他与说话者同侧，而不是越过他。
    reason: lexical_alternative
  - marker: b
    text: 直译：“耶和华永活。”这是起誓的惯用语，用来郑重保证前面的话真实可靠。
    reason: cultural_note
lexical_decisions:
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留希伯来语引人注意和指示下一步行动的作用；在庄重而易懂的现代汉语中自然。
- source_word: אֶשְׁלַח אֶת־הַנַּעַר
  choice: 我要差那少年去
  rationale: נַעַר 可指少年、青年或侍从；正文保留年龄与身份上的宽泛性，不把他明确限定为仆人。
- source_word: לֵךְ מְצָא אֶת־הַחִצִּים
  choice: 去，把箭找回来
  rationale: מָצָא 基本义为“找到”；结合少年奉命收取射出的箭这一场景，用“找回来”自然表达目的，但不添加原文没有明说的携带对象。
- source_word: אִם אָמֹר אֹמַר
  choice: 如果我明确地……说
  rationale: 以“明确地”体现不定式绝对形与限定动词组合所带的强调作用。
- source_word: הִנֵּה הַחִצִּים מִמְּךָ וָהֵנָּה
  choice: 看哪，箭在你这边
  rationale: מִמְּךָ וָהֵנָּה 表示箭落在少年靠说话者的一侧，与下一节“在你前面/越过你”形成方向对比。
- source_word: קָחֶנּוּ וָבֹאָה
  choice: 拿起来，回来吧
  rationale: 按复数先行词“箭”理解形式为单数的代词后缀；וָבֹאָה 表示朝说话者方向来，语境中自然译作“回来”。
- source_word: כִּי שָׁלוֹם לְךָ וְאֵין דָּבָר
  choice: 那你就平安无事
  rationale: שָׁלוֹם 在此指大卫安全无恙；אֵין דָּבָר 字面为“没有事”，合译为常用成语“平安无事”，保留结论而避免过度具体化为某一种危险。
- source_word: חַי יְהוָה
  choice: 永活的耶和华可以作证
  rationale: 这是以耶和华永活起誓的固定表达；正文以自然汉语传达誓言的保证作用，并用脚注说明字面形式。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者广泛熟悉的神名音译，明确呈现专名而非以称号代替。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 两者都是四字神名的音译传统；正文采用普通中文读者更熟悉且庄重的“耶和华”，不以“主”替换原文专名。
- issue: חַי יְהוָה 的誓言性质
  choice: 永活的耶和华可以作证
  alternative: 耶和华永活
  rationale: 原文是誓言公式，不只是关于神生命属性的陈述；译文表达其担保话语真实性的语用功能，脚注保留字面形式。
- issue: וְאֵין דָּבָר 所指的范围
  choice: 无事
  alternative: 没有危险
  rationale: דָּבָר 本身宽泛，语境确实涉及安全，但不必将其唯一化为“危险”；“平安无事”兼顾上下文和原文开放度。
translation_notes:
  register: 采用现代、庄重且口语可懂的叙事体。“看哪”保留原文的指示语气；“少年”避免把 נַעַר 过度限定为仆人；“平安无事”简洁传达 שָׁלוֹם 与 אֵין דָּבָר 的并列表达。脚注标记 [a] 已在正文对应出现。
