  text: וְ/לֹ֖א אִם עוֹדֶ֣/נִּי חָ֑י וְ/לֹֽא תַעֲשֶׂ֧ה עִמָּדִ֛/י חֶ֥סֶד יְהוָ֖ה וְ/לֹ֥א אָמֽוּת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/014.yaml
  text: And if I am still alive[a], will you not show me Yahweh’s covenant faithfulness, so that I may not die?
translation:
  language: zh_hans
  text: 我若还活着，你岂不以雅威的忠贞之爱待我[a]，使我不至于死吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威的忠贞之爱”也可译作“雅威的慈爱”。这个短语也可能指像雅威那样的忠贞之爱，或奉雅威之名向人所施的忠爱。
    reason: 保留 חֶסֶד יְהוָה 在词义及属格关系上的多种可能理解。
lexical_decisions:
- source_word: וְלֹא אִם
  choice: 我若
  rationale: 这组词按字面较为生硬，但在约拿单连续恳求的语境中可理解为引出条件句。汉语用“我若”自然表达其条件意味，同时不额外补入原文没有明确说出的内容。
- source_word: עוֹדֶנִּי חָי
  choice: 还活着
  rationale: עוֹדֶנִּי 表示“我仍然／还”，חָי 表示“活着”；合译为现代汉语常用的“还活着”。
- source_word: תַעֲשֶׂה עִמָּדִי
  choice: 待我
  rationale: עשה עם 是“对待、与……行事”的惯用表达；与 חֶסֶד 连用时，“以……待我”既自然又保留原文关系性的行动含义。
- source_word: חֶסֶד
  choice: 忠贞之爱
  rationale: 此词兼有慈爱、忠诚和坚定不移的委身等含义；在大卫与约拿单立约的语境中，“忠贞之爱”比单纯的“恩慈”更能传达其关系性与忠诚意味，又不把“约”这一原文未明说的词直接加入正文。
- source_word: יְהוָה
  choice: 雅威
  rationale: 采用神圣四字名的现代汉语音译“雅威”，以保留原文所用的专名，而非用称号代替。
- source_word: וְלֹא אָמוּת
  choice: 使我不至于死
  rationale: 结合请求语境，将并列否定理解为所求行动的目的或结果；“使我不至于死”是自然汉语，也保留约拿单求大卫饶命的含义。
theological_decisions:
- issue: חֶסֶד יְהוָה 的关系与含义
  choice: 雅威的忠贞之爱
  alternative: 雅威的慈爱；像雅威那样的忠贞之爱；奉雅威之名施行的忠爱
  rationale: 希伯来语属格结构可指属于或源于雅威的忠爱，也可能描述与雅威相称、以雅威为准则的忠爱。正文采用简洁的属格表达，脚注保留这些真实存在的理解空间，不把它限定为某一种系统神学解释。
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用神的专名，故正文以“雅威”音译，避免将专名改成称号。
- issue: 约拿单求“不至于死”的对象与责任
  choice: 保留为约拿单向大卫提出的请求
  alternative: 解释为雅威亲自施慈爱而使约拿单不死
  rationale: 动词“你要待我”的主语按上下文是大卫；“雅威的忠贞之爱”修饰所施的 חֶסֶד。译文不把人的行动与神的慈爱割裂，也不将二者混同。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“岂不要……吗”保留请求中带有期待肯定答复的反问语气；“忠贞之爱”兼顾 חֶסֶד 的爱与忠诚两面，并以脚注说明其歧义。
