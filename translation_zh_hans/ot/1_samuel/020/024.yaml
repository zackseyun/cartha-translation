base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/024.yaml
  text: So David hid himself in the field. When the new moon came[a], the king sat down to eat the meal.
translation:
  language: zh_hans
  text: 于是，大卫藏在田野里。新月节到了，王便坐下吃饭[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“坐在饼上吃”；“饼”在这里代指整餐饭食。
    reason: 保留עַל הַלֶּחֶם的字面意象，并说明“饼”在此处的转喻用法。
lexical_decisions:
- source_word: וַיִּסָּתֵר
  choice: 藏
  rationale: 该词为סתר的尼法勒式，结合上下文表示大卫主动藏身；现代汉语用“藏”简洁自然，也保留了动作主体。
- source_word: בַּשָּׂדֶה
  choice: 在田野里
  rationale: שָׂדֶה通常指田地或田野；此处用“田野”比“乡间”更直接对应原文。
- source_word: וַיְהִי הַחֹדֶשׁ
  choice: 新月节到了
  rationale: הַחֹדֶשׁ在本段叙事中指新月出现时所守的节期，而不只是月份；“新月节到了”清楚表达这一时间与礼仪背景。
- source_word: וַיֵּשֶׁב
  choice: 坐席
  rationale: ישב本义为“坐下”；在用饭场景中，“坐席”是自然、庄重的现代汉语表达。
- source_word: עַל הַלֶּחֶם
  choice: 吃饭
  rationale: 原文的“饼”以部分代整体，指一餐饭；正文按其语境意义译为“吃饭”，并以脚注保留字面表达。
- source_word: לֶאֱכֹל
  choice: 吃
  rationale: 这是表示目的的动词不定式，说明王坐席是为进食；与前面的用饭意象合译为“坐席吃饭”。
- source_word: דָּוִד
  choice: 大卫
  rationale: 采用现代简体中文圣经人名的通行译法。
- source_word: הַמֶּלֶךְ
  choice: 王
  rationale: 原文使用确定称号而非扫罗的名字，故保留称号“王”。
