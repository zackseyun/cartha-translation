    rationale: 原文是“坐下”这一动作，后接不定式表示目的。现代汉语“坐席”多指入席、座位或宴席语境，搭配“吃饭”不如“坐下吃饭”自然明确。
  - severity: low
    issue: 脚注将 עַל הַלֶּחֶם 释作“坐在饼前”，超出了字面介词的表达。
    rationale: עַל 的字面核心是“在……上/之上”，不是“在……前”。可保留其字面上不合汉语习惯的意象，同时说明这是一种以“饼”指代饭食的用餐表达。
  revised_text: 于是，大卫藏在田野里。新月节到了，王便坐下吃饭[a]。
  revised_footnotes:
