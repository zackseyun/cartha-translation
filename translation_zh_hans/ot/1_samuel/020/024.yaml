  rationale: 将“坐席吃饭”改为“坐下吃饭”，直接对应原文“坐下，为要吃”的动作与目的结构，并提升现代汉语自然度。脚注删除原文无据的“前”，以较透明的方式保留“在饼上”的字面意象及其转喻说明。
