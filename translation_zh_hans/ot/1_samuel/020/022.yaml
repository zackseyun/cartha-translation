  text: וְ/אִם כֹּ֤ה אֹמַר֙ לָ/עֶ֔לֶם הִנֵּ֥ה הַ/חִצִּ֖ים מִמְּ/ךָ֣ וָ/הָ֑לְאָה לֵ֕ךְ כִּ֥י שִֽׁלַּחֲ/ךָ֖ יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/022.yaml
  text: But if I say this to the young man[a], ‘Look, the arrows are beyond you,’ then go, for Yahweh has sent you away.
translation:
  language: zh_hans
  text: 但如果我对那少年这样说：‘看，箭在你前方更远的地方[a]’，你就走吧，因为雅威已经打发你走了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译近于“箭从你那里再往前”，意思是箭越过那少年，落在更远的地方；这是通知大卫必须离开的信号。
    reason: 说明希伯来语空间表达及其在叙事中的信号作用。
lexical_decisions:
- source_word: וְאִם
  choice: 可是，如果
  rationale: 承接上一种信号并引出与之相反的情况；“可是，如果”自然表达语境中的转折和条件。
- source_word: לָעֶלֶם
  choice: 对那少年
  rationale: עֶלֶם指年轻男子；“少年”不额外加入“仆人”这一角色含义，也符合本段语境。
- source_word: הִנֵּה
  choice: 看
  rationale: 保留引人注意的指示作用，同时采用现代汉语自然表达。
- source_word: מִמְּךָ וָהָלְאָה
  choice: 在你前面更远处
  rationale: 该短语字面近于“从你那里再往前”，表示箭越过少年、落在更远处；此译既交代空间关系，也使约拿单所定信号清楚可懂。
- source_word: לֵךְ
  choice: 你就走吧
  rationale: 准确表达הלך的命令式，并以“吧”呈现约拿单对大卫说话时自然但明确的语气。
- source_word: שִׁלַּחֲךָ
  choice: 已经差你离开了
  rationale: 动词表示差遣或送走；在大卫必须离去的语境中加入“离开”，显明方向而不把原因进一步解释出来。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译保留四字神名，而不以称号替代。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较贴近学界通常重构的读音，并保留其作为专名的性质。
- issue: “差你离开”所表达的神圣引导
  choice: 保留为“雅威已经差你离开了”
  alternative: “雅威要你离开”
  rationale: 原文使用完成式שִׁלַּחֲךָ，将大卫的离去表述为雅威已经作出的差遣；译文不将其弱化为一般许可或约拿单个人的判断。
translation_notes:
  register: 采用现代、庄重而口语可懂的叙事语言。直接引语使用自然措辞；“少年”避免把年龄说得过幼，也不把原文未明说的侍从身份写入正文。
