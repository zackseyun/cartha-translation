  yaml_path: translation/ot/1_samuel/020/004.yaml
  text: Then Jonathan said to David[a], “What does your soul say? I will do it for you.”
translation:
  language: zh_hans
  text: 约拿单对大卫说：“你心里想要什么？我都为你办到。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 承接上下文推进叙事；现代汉语通常无需把连接成分另译为“于是”。
- source_word: יְהוֹנָתָן אֶל דָּוִד
  choice: 约拿单对大卫
  rationale: 人名采用现代中文圣经通行译名；介词 אֶל 按说话对象自然译为“对”。
- source_word: מַה תֹּאמַר נַפְשְׁךָ
  choice: 你心里想要什么
  rationale: 原文直译近于“你的 נפש 说什么”；נפש 在此指人的内在意愿或愿望。译作“你心里想要什么”既保留内心愿望的意象，也自然表达这个疑问式的慷慨承诺。
- source_word: וְאֶעֱשֶׂה לָּךְ
  choice: 我都为你办到
  rationale: עשה 是“做、办理”，לְ 表受益者。“办到”与前句所问的愿望自然衔接，“都”表达此处开放而不设限的承诺语气。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重而口语可懂的现代标准普通话。对“灵魂说什么”的希伯来语习语作适度意译，避免现代中文中生硬或可能引起本体论误读的“你的灵魂说什么”，同时保留其内在意愿的含义。
