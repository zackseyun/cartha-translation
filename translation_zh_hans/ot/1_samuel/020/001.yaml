base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/001.yaml
  text: Then David fled from Naioth in Ramah and came before Jonathan and said[a], “What have I done? What is my guilt, and what is my sin before your father, that he is seeking my life?”
translation:
  language: zh_hans
  text: 大卫从拉玛的拿约[a]逃走，来到约拿单面前，说：“我做了什么？我有什么罪责？我在你父亲面前犯了什么罪，以致他要取我的性命？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “拉玛的拿约”也可译作“拉玛境内的拿约”。希伯来文很可能是指与拉玛有关、名为“拿约”的已知地点。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבְרַח
  choice: 逃走
  rationale: ברח表示逃离或逃脱；“逃走”自然简洁，并保留情势的紧迫感。
- source_word: מִנָּוֹת בָּרָמָה
  choice: 从拉玛的拿约
  rationale: 上下文表明נוות是与拉玛相关的地名，故音译为“拿约”；“拉玛的”保留两地名之间关系的可能范围，不将其过度限定为行政隶属或空间包含。[a]注明也可理解为“拉玛境内的拿约”。
- source_word: וַיָּבֹא
  choice: 来到
  rationale: בוא在此表示向约拿单所在之处移动；“来到”符合汉语叙事习惯。
- source_word: לִפְנֵי יְהוֹנָתָן
  choice: 来到约拿单面前
  rationale: לִפְנֵי字面为“在……面前”；此译法既自然，也保留亲自到其面前的关系意味。
- source_word: מֶה עָשִׂיתִי
  choice: 我做了什么？
  rationale: 直接保留原文的反问形式，表达大卫对自己究竟有何过错的追问。
- source_word: עֲוֺנִי
  choice: 我的罪责
  rationale: עָוֹן可指罪孽、过错或由此产生的罪责；此处自辩语境中“罪责”兼顾行为过错与应负责任。
- source_word: חַטָּאתִי
  choice: 我……犯了什么罪
  rationale: חַטָּאת指罪或过犯；译作“犯了什么罪”保留其道德分量，并与“罪责”有所区分。
- source_word: לִפְנֵי אָבִיךָ
  choice: 在你父亲面前
  rationale: 保留לִפְנֵי的字面关系，可涵盖“在他眼中”或“对他而言”，不武断改译为“得罪”。
- source_word: כִּי
  choice: 以致
  rationale: 此处连接前面的过错追问与扫罗索命的结果或理由；“以致”在现代汉语中自然地表达大卫所质问的因果关联。
- source_word: מְבַקֵּשׁ אֶת־נַפְשִׁי
  choice: 他要取我的性命
  rationale: 该习语意为谋求某人的性命、企图杀死某人；“要取我的性命”保留“性命”意象，同时让现代读者清楚理解。
