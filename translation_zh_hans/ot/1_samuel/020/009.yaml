revisions:
- from: 约拿单说：“你绝不会遭遇这样的事！我若确实知道，我父亲那边已经定下[a]要加害你，难道还会不告诉你吗？”
  to: 约拿单说：“绝不会！我若确实知道我父亲已经定意[a]要加害你，难道还会不告诉你吗？”
  rationale: 修改首句，避免把原文强烈否定预先解释为大卫必不受害，并使之自然承接后面的反问。将不完整的“已经定下要加害你”改为“已经定意要加害你”，以自然中文表达原文中从扫罗而出的、已确定的加害意图。
