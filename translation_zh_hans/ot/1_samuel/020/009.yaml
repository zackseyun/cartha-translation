base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/009.yaml
  text: Jonathan said[a], “Far be it from you! If I knew for certain that evil had been determined by my father to come upon you, would I not tell you?”
translation:
  language: zh_hans
  text: 约拿单说：“绝不会！我若确实知道我父亲已经定意[a]要加害你，难道还会不告诉你吗？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“祸害已经成形”或“祸害已成定局”。希伯来语可表示扫罗加害人的意图已经确定或完全形成。
    reason: 保留כָלְתָה הָרָעָה可能兼有“完成、成形”与“确定、成为定局”的语义幅度。
lexical_decisions:
- source_word: חָלִילָה לָּךְ
  choice: 你绝不会遭遇这样的事
  rationale: חָלִילָה是强烈否定语，לָּךְ为第二人称，与其机械译作“离你远点”，不如按上下文译为约拿单断然否认大卫会在自己不知情的情况下遭害；同时保留“你”的指向。
- source_word: כִּי אִם
  choice: 若
  rationale: 在此引出条件句，现代汉语用“若”简洁自然，也与全节庄重语体协调。
- source_word: יָדֹעַ אֵדַע
  choice: 确实知道
  rationale: 不定式绝对形与限定动词连用，强调知道得确定无疑；“确实知道”自然传达其加强语气。
- source_word: כָלְתָה הָרָעָה
  choice: 已经定下
  rationale: כלה与“祸害”搭配，在本语境中可指恶意或害人的打算已经成熟、确定；正文采用自然表达，并以脚注保留“祸害已经成形／到了定局”的词义张力。
- source_word: מֵעִם אָבִי
  choice: 我父亲那边
  rationale: מֵעִם表示来源于某人或出于某人方面；“我父亲那边”保留来源意味，避免把原文无明确施事形态的表达完全改写成主动句。
- source_word: לָבוֹא עָלֶיךָ
  choice: 要加害你
  rationale: 字面为“临到你”，但主语是הָרָעָה（祸害、恶事），本处指扫罗方面将施加的伤害；“加害你”在汉语中清楚而不限定具体手段。
- source_word: וְלֹא אֹתָהּ אַגִּיד לָךְ
  choice: 难道还会不告诉你吗
  rationale: 保留原文期待肯定答案的反问语气；“还”使汉语衔接自然，但不增加实质内容。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事对话体。“你绝不会遭遇这样的事”传达强烈否定；“我父亲那边”略带口语自然度，同时保留希伯来语来源结构，避免无必要地将句子神学化或过度明确化。
