  text: וַ/יֹּ֨אמֶר יְהוֹנָתָ֜ן אֶל דָּוִ֗ד יְהוָ֞ה אֱלֹהֵ֤י יִשְׂרָאֵל֙ כִּֽי אֶחְקֹ֣ר אֶת אָבִ֗/י כָּ/עֵ֤ת מָחָר֙ הַ/שְּׁלִשִׁ֔ית וְ/הִנֵּה ט֖וֹב אֶל דָּוִ֑ד וְ/לֹֽא אָז֙ אֶשְׁלַ֣ח אֵלֶ֔י/ךָ וְ/גָלִ֖יתִי אֶת אָזְנֶֽ/ךָ־־־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/012.yaml
  text: And Jonathan said to David[a], “As Yahweh, the God of Israel, lives, when I sound out my father about this time tomorrow, or the third day, and behold, if it is favorable toward David[c][b], shall I not then send to you and uncover your ear?"
translation:
  language: zh_hans
  text: 约拿单对大卫说：“雅威——以色列的上帝可作证[a]！明天约在这个时候，或到第三天[b]，我会探探我父亲的口风。看哪，如果他对大卫有好意，我岂不派人去告诉你[c]吗？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文在神名之后语意有所省略；这里是在请雅威作证，作出庄严的保证。
    reason: 原文句法省略
  - marker: b
    text: 原文的时间说法十分紧凑，也可理解为“明天约在这个时候，也就是第三天”。
    reason: 时间表达有歧义
  - marker: c
    text: 原文直译为“揭开你的耳朵”，是“告诉你”或“向你透露”的惯用说法。
    reason: 希伯来语惯用语
lexical_decisions:
- source_word: יְהוָה אֱלֹהֵי יִשְׂרָאֵל
  choice: 雅威——以色列的上帝
  rationale: 以“雅威”音译神的专名，并将后面的属格结构自然译为同位说明“以色列的上帝”。
- source_word: אֶחְקֹר אֶת אָבִי
  choice: 我会探探我父亲的口风
  rationale: 此处不是正式调查，而是约拿单试探父亲扫罗对大卫的态度；“探探……口风”准确、自然地表达这种人际察探。
- source_word: כָּעֵת מָחָר הַשְּׁלִשִׁית
  choice: 明天约在这个时候，或到第三天
  rationale: 原文的时间表达高度压缩，可能指明天这个时候或第三天；正文保留两阶段的表达，不把歧义强行消除。
- source_word: טוֹב אֶל דָּוִד
  choice: 他对大卫有好意
  rationale: טוֹב 与 אֶל 连用在此描述扫罗对大卫的有利态度；补出语境中的主语“他”，使汉语清楚。
- source_word: וְגָלִיתִי אֶת אָזְנֶךָ
  choice: 告诉你
  rationale: 希伯来语直译为“揭开你的耳朵”，是把消息透露给人的惯用语；正文按现代汉语意义翻译，字面意象收入脚注。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 采用神名的现代汉语音译，保留其专名性质，不以称号替代。
- issue: 神名之后省略的誓言结构
  choice: 雅威——以色列的上帝可作证
  alternative: 我指着雅威——以色列的上帝起誓；雅威——以色列的上帝是永活的
  rationale: 马所拉文本在神名之后语法省略，语境显示这是庄严保证。译作“可作证”既使汉语成立，也不添加原文没有明说的“永活”字样；脚注说明其省略性。
- issue: וְלֹא אָז אֶשְׁלַח אֵלֶיךָ 的理解
  choice: 我岂不派人来……吗
  alternative: 我若不派人来……；我就会派人来……
  rationale: 原文带否定词且句式艰难，并与下一节的誓言相连。采用反问形式，保留否定成分和庄严承诺的语气，同时避免将其误解为简单否定。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“探探……口风”符合对话情境；“看哪”保留 וְהִנֵּה 的提示作用。正文避免生硬照搬希伯来语惯用语，并以脚注保存其字面意象及原文歧义。
