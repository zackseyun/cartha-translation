base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/028.yaml
  text: Jonathan answered Saul[a], “David earnestly asked leave of me to go to Bethlehem.”
translation:
  language: zh_hans
  text: 约拿单回答扫罗：“大卫恳切地向我请假，要到伯利恒去。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן
  choice: 回答
  rationale: 这是对话叙事中ענה的常见表达；“回答”自然、直接，符合现代汉语。
- source_word: אֶת שָׁאוּל
  choice: 扫罗
  rationale: אֶת在此标明回应的对象；汉语“回答扫罗”可直接表达约拿单向扫罗作答。
- source_word: נִשְׁאֹל נִשְׁאַל
  choice: 恳切地……请假
  rationale: 同一词根的不定式绝对形与限定动词连用，加强请求的语气。结合上下文，“恳切地向我请假”既表达强调，也说明大卫是在请求准许离开。
- source_word: מֵעִמָּדִי
  choice: 向我
  rationale: 该形式表示从约拿单这里或在其许可之下离开；配合汉语“请假”，“向我”最为自然。
- source_word: עַד בֵּית לָחֶם
  choice: 要到伯利恒去
  rationale: עַד指出目的地。上下文包含获准前往的意思，汉语补出“去”可清楚表达隐含的移动而不改变原意。
- source_word: בֵּית לָחֶם
  choice: 伯利恒
  rationale: 采用该地名在现代中文圣经语境中的通行译名。
theological_decisions: []
