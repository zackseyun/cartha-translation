  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּ֣י כָל הַ/יָּמִ֗ים אֲשֶׁ֤ר בֶּן יִשַׁי֙ חַ֣י עַל הָ/אֲדָמָ֔ה לֹ֥א תִכּ֖וֹן אַתָּ֣ה וּ/מַלְכוּתֶ֑/ךָ וְ/עַתָּ֗ה שְׁלַ֨ח וְ/קַ֤ח אֹת/וֹ֙ אֵלַ֔/י כִּ֥י בֶן מָ֖וֶת הֽוּא־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/031.yaml
  text: For as long as the son of Jesse lives on the earth[a], neither you nor your kingdom will be established. So now, send and bring him to me, for he is a son of death.
translation:
  language: zh_hans
  text: 因为耶西的儿子只要还活在世上，你和你的王权就都不能稳固。现在，派人把他带到我这里来，因为他是该死的人[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语直译为“死亡之子”，可指该受死刑的人，也可指注定要死的人。
    reason: 说明希伯来语习语的字面表达及其未完全消除的语义张力。
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，说明扫罗发怒并下令的理由，保留其因果作用。
- source_word: כָל הַיָּמִים אֲשֶׁר
  choice: 只要……还……
  rationale: 这是表示持续时间的结构；现代汉语用“只要……还……”自然地表达“在……活着的全部期间”。
- source_word: בֶּן יִשַׁי
  choice: 耶西的儿子
  rationale: 不直接译作“大卫”，以保留扫罗刻意不用其名、以父名称呼他的疏离和轻蔑语气。
- source_word: חַי עַל הָאֲדָמָה
  choice: 还活在世上
  rationale: “活在世上”自然传达字面的“活在地面／大地之上”，又不把 הָאֲדָמָה 过度限定为某一片国土。
- source_word: לֹא תִכּוֹן
  choice: 不能稳固
  rationale: 体现 כון 的尼法勒式所表达的被确立、站稳或稳固的结果状态，并适用于约拿单及其王权。
- source_word: אַתָּה וּמַלְכוּתֶךָ
  choice: 你和你的王权
  rationale: מַלְכוּת 在这里涉及约拿单继承王位及其统治权；“王权”比“王国”更贴近此处的王位与统治资格，同时保留原文将“你”与“你的王权”并列的表达。
- source_word: וְעַתָּה
  choice: 现在
  rationale: 引出基于前句的紧迫命令；汉语中的“现在”已能自然表达话语推进。
- source_word: שְׁלַח וְקַח אֹתוֹ אֵלַי
  choice: 派人把他带到我这里来
  rationale: 两个命令合起来表示差人去把大卫带来；此译法符合现代汉语，又保留派遣和带来的两层动作。
- source_word: בֶּן מָוֶת הוּא
  choice: 他是该死的人
  rationale: 这是希伯来语习语，指应当被处死、负有死罪的人；正文采用清楚自然的汉语，脚注保留其字面形象及可能语义范围。
theological_decisions:
- issue: “死亡之子”是否表示应受死刑，还是注定死亡
  choice: 正文译作“该死的人”
  alternative: “死亡之子”或“必死的人”
  rationale: 上下文是扫罗命令把大卫带来处死，较支持“应当死／当受死刑”；但该习语也可带有“注定死亡”的意味，因此脚注说明这一语义范围，不将其提升为额外的神学判定。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“耶西的儿子”保留扫罗带有轻蔑和疏离感的称呼；“派人把他带到我这里来”符合汉语命令语气；脚注标记紧随其实际说明的“该死的人”，避免误置。
