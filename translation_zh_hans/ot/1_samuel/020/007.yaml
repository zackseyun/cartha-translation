base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/007.yaml
  text: If he says[a], ‘Good,’ there will be peace for your servant; but if he becomes very angry, know that evil has been determined by him.
translation:
  language: zh_hans
  text: 他若说：“好。”你仆人就平安无事；他若勃然大怒，你就知道，他已定意作恶。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“恶事已经由他定下。”意思是扫罗已坚定决意加害。
    reason: 说明“恶事已由他定下”这一较贴近 כָלְתָה הָרָעָה מֵעִמּוֹ 形式的译法，并交代其在上下文中的具体所指。
lexical_decisions:
- source_word: טוֹב
  choice: 好
  rationale: 这里是扫罗表示认可的简短答语；译作“好”既贴近希伯来文省略式形容词，也符合现代汉语对话习惯。
- source_word: שָׁלוֹם לְעַבְדֶּךָ
  choice: 你仆人就平安了
  rationale: שָׁלוֹם 在此指约拿单将安然无事；“平安”保留原词的核心意象，“就……了”表达由扫罗回应所显示的结果。
- source_word: לְעַבְדֶּךָ
  choice: 你仆人
  rationale: 约拿单以第三人称谦称自己；“你仆人”保留宫廷语境中的自谦口吻，而不强调受奴役的身份。
- source_word: חָרֹה יֶחֱרֶה לוֹ
  choice: 他若大发烈怒
  rationale: 不定式绝对形与限定动词连用表示加强；“大发烈怒”自然传达强烈愤怒，并保留庄重语体。
- source_word: דַּע
  choice: 你就知道
  rationale: 这是命令式，要求大卫根据扫罗的反应作出判断；汉语加“就”可清楚表现条件与结论的关系。
- source_word: כָלְתָה הָרָעָה
  choice: 已经定意作恶
  rationale: כלה 在本语境中表示意图已经达到确定、不可动摇的程度；“定意作恶”既体现已作决定，也保留 רָעָה 的道德分量。
- source_word: מֵעִמּוֹ
  choice: 由他定意（含于译文主语“他”）
  rationale: 该介词短语标明恶意出于扫罗本人。汉语用“他已经定意作恶”自然表达其来源，避免生硬直译“从他而出”。
theological_decisions:
- issue: הָרָעָה 指道德上的恶，还是具体的加害意图
  choice: 正文译“作恶”，保留道德评价；脚注说明语境中指决意加害
  alternative: 加害、祸害
  rationale: 原文既可指恶，也在上下文中特指扫罗企图伤害大卫。正文不把较宽的词义缩窄，脚注则帮助读者把握具体语境。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“好”保留直接引语的简洁感；“你仆人”保留约拿单的自谦称谓；“大发烈怒”和“定意作恶”兼顾希伯来文的强调形式与中文可读性。
