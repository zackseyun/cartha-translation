  text: Jonathan answered Saul his father and said to him[a], “Why should he be put to death? What has he done?”
translation:
  language: zh_hans
  text: 约拿单回答他父亲扫罗说：“为什么要把他处死？他做了什么？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן
  choice: 回答
  rationale: ענה在此叙事对话公式中表示“回答、回应”；“回答”自然保留了对话关系。
- source_word: יְהוֹנָתָן
  choice: 约拿单
  rationale: 按现代中文圣经人名的通行译法音译。
- source_word: אֶת שָׁאוּל אָבִיו
  choice: 他父亲扫罗
  rationale: 保留扫罗与约拿单的父子关系，并按自然现代汉语调整同位结构的语序。
- source_word: וַיֹּאמֶר אֵלָיו
  choice: 对他说
  rationale: 希伯来文明确表达间接宾语“对他”；中文予以保留，同时避免把连续的两个言说动词译得过于累赘。
- source_word: לָמָּה
  choice: 为什么
  rationale: 直接、自然地表达询问理由。
- source_word: יוּמַת
  choice: 要处死他
  rationale: 该词是מות的使役被动态未完成式，表示“被处死”，而不是单纯“死”；疑问语境中的“要”保留了对处死主张的质问，不预先判定为必然或义务。
- source_word: מֶה עָשָׂה
  choice: 他做了什么？
  rationale: 直译而自然；在语境中可理解为询问他犯了什么应受死刑的事，但不把这一含义扩写进正文。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。保留原文“回答……对他说”的双重言说结构之基本信息，但以自然中文表达；“处死”准确体现יוּמַת的使役被动态含义。
