base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/042.yaml
  text: Jonathan said to David, “Go in peace, because the two of us have sworn in the name of the LORD, saying, ‘May the LORD be between me and you, and between my offspring and your offspring forever.’”
translation:
  language: zh_hans
  text: 约拿单对大卫说：“你平安地去吧！因为我们二人曾奉耶和华的名起誓说：‘愿耶和华在你我之间，也在你我的后代之间，直到永远。’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֵךְ לְשָׁלוֹם
  choice: 你平安地去吧
  rationale: 保留希伯来语“去、归于平安”的祝愿意味，同时采用自然的现代汉语表达。
- source_word: בְּשֵׁם יְהוָה
  choice: 奉耶和华的名
  rationale: 准确表达以耶和华之名起誓的权威与庄重性；专名按现代中文圣经惯例译作“耶和华”。
- source_word: זַרְעִי / זַרְעֲךָ
  choice: 你我的后代
  rationale: זֶרַע在此为集合意义，指双方世世代代的子孙；“后代”比直译“种子”自然准确。
- source_word: עַד עוֹלָם
  choice: 直到永远
  rationale: 体现盟誓持续不止的时间范围，语体庄重自然。
theological_decisions:
- issue: 耶和华“在你我之间”的含义
  choice: 愿耶和华在你我之间
  alternative: 愿耶和华在你我之间作证
  rationale: 原文只说“耶和华在……之间”，虽在盟誓语境中可能含有作见证、监察或维系盟约之意，但未明说“作证”，因此不在正文中补足，以保留原文的含蓄与张力。
- issue: 关系从句 אֲשֶׁר 的逻辑功能
  choice: 因为我们二人曾……起誓
  alternative: 至于我们二人曾……起的誓
  rationale: 此处 אֲשֶׁר 承接“平安地去”，在语境中自然表达大卫可安心离去的依据；译作“因为”符合其因由功能，也与上下文吻合。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。保留直接引语中的盟誓句式；“你我之间”“你我的后代之间”避免冗长重复，同时完整呈现双方及其后代的对应关系。
