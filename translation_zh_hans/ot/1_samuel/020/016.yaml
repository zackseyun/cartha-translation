base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/016.yaml
  text: So Jonathan made a covenant with the house of David, and the LORD sought it from the hand of David’s enemies.
translation:
  language: zh_hans
  text: 于是，约拿单与大卫家立约[a]；愿耶和华向大卫的仇敌追讨。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “立约”原文直译为“切（约）”；“约”是按希伯来语惯用表达补出的。
    reason: 说明原文的惯用语和省略成分。
  - marker: b
    text: 原文没有明说追讨什么。此动词形式也可按叙述性或将来性的方式理解；正文按盟约语境译为祈愿式。
    reason: 保留宾语省略以及动词语气、时间指向的真实歧义。
lexical_decisions:
- source_word: וַיִּכְרֹת
  choice: 立约
  rationale: 字面为“切”，在“与……（立）”这一希伯来语惯用结构中指缔结盟约；现代汉语以“立约”自然、准确地表达。
- source_word: בֵּית דָּוִד
  choice: 大卫家
  rationale: 保留“家”的群体及后代含义，不缩窄为大卫本人。
- source_word: וּבִקֵּשׁ
  choice: 愿……追讨
  rationale: בקש基本义为寻求、索求；此处结合立约及上下文的盟约咒诅语境，译作“追讨”，并以“愿”表达其祈愿或咒诅功能。
- source_word: מִיַּד אֹיְבֵי דָוִד
  choice: 向大卫的仇敌
  rationale: “从……手中”在追责语境中表示向某人索取或追究；译作“向……追讨”符合现代汉语，同时保留责任归属。
theological_decisions:
- issue: וּבִקֵּשׁ的语气与时态
  choice: 愿耶和华……追讨
  alternative: 耶和华……追讨了／必追讨
  rationale: 该形式表面上可按连续完成式理解，但盟约语境和下一节的誓言支持祈愿性咒诅。脚注保留其语法上的另一种读法。
- issue: 追讨的宾语
  choice: 正文不明说宾语
  alternative: 追讨这约／追讨违约之罪
  rationale: 希伯来原文没有明示宾语；不把宾语具体化，以避免将“约”“违约之罪”或“责任”等解释直接写入正文。
- issue: “大卫的仇敌”与约拿单家族的潜在关系
  choice: 照原文保留“大卫的仇敌”
  alternative: 约拿单家中敌对大卫的人
  rationale: 原文措辞具有修辞和神学张力，可能暗含任何背约而成为大卫仇敌的人；不在译文中限定其身份。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“大卫家”保留圣经家族—王朝用语；“追讨”能表达盟约责任的索取与追究，又不额外指定所追讨的对象。
