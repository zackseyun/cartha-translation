  text: וַ/יֵּ֣שֶׁב הַ֠/מֶּלֶךְ עַל מ֨וֹשָׁב֜/וֹ כְּ/פַ֣עַם בְּ/פַ֗עַם אֶל מוֹשַׁב֙ הַ/קִּ֔יר וַ/יָּ֨קָם֙ יְה֣וֹנָתָ֔ן וַ/יֵּ֥שֶׁב אַבְנֵ֖ר מִ/צַּ֣ד שָׁא֑וּל וַ/יִּפָּקֵ֖ד מְק֥וֹם דָּוִֽד־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/025.yaml
  text: The king sat in his seat[a], as at other times, by the wall; and Jonathan rose, and Abner sat beside Saul, but David’s place was empty.
translation:
  language: zh_hans
  text: 王照常坐在靠墙的座位上；约拿单起身，押尼珥坐在扫罗旁边，大卫的位置却空着[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “空着”也可译作“缺了人”，意思是大卫在席间的位置无人就座。
    reason: 说明וַיִּפָּקֵד在本处兼有“缺少、未出现”和座位空缺的语义，避免把它误解为对位置进行点数。
lexical_decisions:
- source_word: הַמֶּלֶךְ
  choice: 王
  rationale: 原文用带定冠词的称号指扫罗，而没有直接使用人名；译作“王”保留叙事形式。
- source_word: מוֹשָׁבוֹ
  choice: 座位
  rationale: 在宴席语境中指坐席，而非住处；“座位”自然、明确。
- source_word: כְּפַעַם בְּפַעַם
  choice: 照常
  rationale: 这是表示以往惯例的习语；“照常”简洁表达“像往常各次一样”的反复意味。
- source_word: אֶל מוֹשַׁב הַקִּיר
  choice: 靠墙的座位上
  rationale: 该短语说明王座位与墙的空间关系；结合前面的“坐”，译成“坐在靠墙的座位上”最符合现代汉语。
- source_word: וַיָּקָם יְהוֹנָתָן
  choice: 约拿单起身
  rationale: 按马所拉文本直译叙事动词קום，不额外推断他起身的原因或随后所在的位置。
- source_word: וַיֵּשֶׁב אַבְנֵר מִצַּד שָׁאוּל
  choice: 押尼珥坐在扫罗旁边
  rationale: מִצַּד表示“在……旁边”；译文保留原文此处由称号“王”转用人名“扫罗”的变化。
- source_word: וַיִּפָּקֵד מְקוֹם דָּוִד
  choice: 大卫的位置却空着
  rationale: ויפקד在这里表示预期有人占据的位置显得空缺；“空着”符合宴席场景，同时“位置”保留מקום比“座位”稍宽的含义。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。分号保留前后座次叙述的层次；“却”表达末句与正常座次之间的反差。未补充原文没有交代的约拿单起身原因。
