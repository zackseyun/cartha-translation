  text: וְ/הַ/נַּ֖עַר לֹֽא יָדַ֣ע מְא֑וּמָה אַ֤ךְ יְהֽוֹנָתָן֙ וְ/דָוִ֔ד יָדְע֖וּ אֶת הַ/דָּבָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/039.yaml
  text: But the boy did not know anything[a]; only Jonathan and David knew the matter.
translation:
  language: zh_hans
  text: 那童子什么也不知道；只有约拿单和大卫知道这事[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “这事”也可译作“这件事”或“这项安排”。希伯来语 דָּבָר 含义宽泛，可指正在谈论的事情、事项或安排。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַנַּעַר
  choice: 那童子
  rationale: נַעַר可指男孩、少年或随从；本段指约拿单身边负责拾箭的年轻随从。“童子”在叙事语体中简洁自然，也保留其年龄与从属角色的开放性。句首וְ在中文无需硬译为“但”，分号后的“只有”已清楚呈现无知与知情之间的对比。
- source_word: לֹא יָדַע מְאוּמָה
  choice: 什么也不知道
  rationale: יָדַע是“知道”，מְאוּמָה在否定句中表示“任何事物、丝毫”；合译为现代汉语自然的“什么也不知道”，不额外解释为“不明白”。
- source_word: אַךְ
  choice: 只有
  rationale: 此处אַךְ具有限定、排他作用，将约拿单和大卫与不知情的童子区分开来。
- source_word: יְהוֹנָתָן וְדָוִד
  choice: 约拿单和大卫
  rationale: 采用现代中文圣经语境中通行且易辨识的人名译法。
- source_word: יָדְעוּ
  choice: 知道
  rationale: 与前半句同一动词יָדַע保持相同译法，突出童子“不知道”而二人“知道”的鲜明对照。
- source_word: אֶת־הַדָּבָר
  choice: 这事
  rationale: דָּבָר语义宽广，可指事情、事项、话语或安排；“这事”既自然又保留其概括性，避免将其过度限定为某个具体计划。
theological_decisions: []
