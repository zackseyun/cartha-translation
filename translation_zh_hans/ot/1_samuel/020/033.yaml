  text: Then Saul hurled the spear at him to strike him[a], and Jonathan knew that his father was determined to put David to death.
translation:
  language: zh_hans
  text: 扫罗就把长矛掷向约拿单，要击打他。约拿单便知道，他父亲已决意[a]要杀死大卫。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“他父亲已经定意”。原文的习语直译近似“这事从他父亲那里已经定了”，表示扫罗已经作出坚定的决定。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּטֶל
  choice: 掷出
  rationale: 该动词表示投掷；“掷出”自然地传达扫罗用力而带敌意的动作。
- source_word: הַחֲנִית
  choice: 长矛
  rationale: 这是常见的矛类兵器名称；“长矛”符合现代汉语，也不武断限定为较轻的投枪。
- source_word: עָלָיו
  choice: 朝约拿单
  rationale: 介词在投掷语境中表示敌对动作的方向；明确写出约拿单，可避免连续代词造成指代不清。
- source_word: לְהַכֹּתוֹ
  choice: 要击中他
  rationale: 不定式表示目的。“击中”保留“击打、击伤”的基本意思，又不额外断定扫罗这一击必定旨在当场杀死约拿单。
- source_word: וַיֵּדַע
  choice: 这才知道
  rationale: 基本义为“知道”；“这才”自然呈现前一事件使约拿单确认此事的叙事关系，但不将动词改译成更强的心理描写。
- source_word: כָלָה הִיא מֵעִם אָבִיו
  choice: 他父亲已经决意
  rationale: 希伯来语习语表示此事在其父那里已经定下，强调扫罗坚定、已成定局的意向。正文采用自然汉语，脚注保留较贴近原文的表达。
- source_word: לְהָמִית אֶת דָּוִד
  choice: 要杀死大卫
  rationale: 使役形式明确表示使大卫死亡；“杀死”直接、庄重，并准确传达扫罗的蓄意。
- source_word: יְהוֹנָתָן
  choice: 约拿单
  rationale: 采用中文圣经传统中通行的人名译法。
- source_word: שָׁאוּל
  choice: 扫罗
  rationale: 采用中文圣经传统中通行的人名译法。
- source_word: דָּוִד
  choice: 大卫
  rationale: 采用中文圣经传统中通行的人名译法。
