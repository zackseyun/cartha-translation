base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/041.yaml
  text: When the boy had come[a], David rose from beside the south side and fell with his face to the ground and bowed three times. Then they kissed one another and wept with one another[b], until David wept the more.
translation:
  language: zh_hans
  text: 那少年到了以后，大卫便从南边起身[a]，面伏在地，拜了三拜。随后两人彼此亲吻，彼此哭泣，直到大卫哭得更为厉害[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译近于“从南边（或南地）旁边”。这个短语含义不明；有人结合上下文，将它理解为大卫藏身处附近的土堆或石头旁。
    reason: alternative_reading
  - marker: b
    text: 也可理解为“大卫哭得超过了约拿单”，或“大卫越哭越厉害”。希伯来文没有明说比较对象。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנַּעַר בָּא
  choice: 那少年到了以后
  rationale: נַעַר在本段指约拿单的随从，可译“少年”或“仆人”；“少年”既自然，也不把其身份规定得过死。בָּא按马所拉文本保留为“到了”，并将分句处理为时间背景。
- source_word: מֵאֵצֶל הַנֶּגֶב
  choice: 从南边那一带
  rationale: 短语字面涉及“南边/南地”及“旁边”，但希伯来文表达困难。“从南边那一带”保留现存文本的方位含义，同时以脚注说明也有人结合上下文理解为藏身处附近的土堆或石头。
- source_word: וַיִּפֹּל לְאַפָּיו אַרְצָה
  choice: 面伏在地
  rationale: 简洁保留“脸朝地俯伏”的身体姿态，符合现代汉语叙事表达。
- source_word: וַיִּשְׁתַּחוּ שָׁלֹשׁ פְּעָמִים
  choice: 拜了三拜
  rationale: שׁחה表示俯身下拜；“拜了三拜”准确、自然，又不额外判定这是敬拜还是礼仪性的致敬。
- source_word: וַיִּשְּׁקוּ אִישׁ אֶת רֵעֵהוּ
  choice: 两人彼此亲吻
  rationale: 保留互指结构和亲吻这一实际动作，不作淡化或寓意化处理。
- source_word: וַיִּבְכּוּ אִישׁ אֶת רֵעֵהוּ
  choice: 相对哭泣
  rationale: 互指结构表明两人共同、彼此相对而哭；“相对哭泣”在汉语中兼顾互相性与情感力度。
- source_word: עַד דָּוִד הִגְדִּיל
  choice: 直到大卫哭得更为厉害
  rationale: הִגְדִּיל本义为“变大、加增”，此处承接哭泣，可能指大卫哭得比约拿单更厉害，也可能指他的哭泣愈发强烈；正文不明说比较对象，以保留歧义。
theological_decisions: []
