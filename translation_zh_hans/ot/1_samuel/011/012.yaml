base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/012.yaml
  text: Then the people said to Samuel[a], “Who is it that said, ‘Shall Saul reign over us?’ Hand over the men, and we will put them to death.”
translation:
  language: zh_hans
  text: 百姓对撒母耳说：“说过‘扫罗会作王统治我们吗？’的是谁？把那些人交出来，我们要处死他们。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר הָעָם
  choice: 百姓……说
  rationale: וַיֹּאמֶר 推进叙事，在中文中无需机械译出“然后”；הָעָם 是集合名词，按语境译为“百姓”。
- source_word: אֶל־שְׁמוּאֵל
  choice: 对撒母耳
  rationale: אֶל 在言说结构中表示说话对象，现代汉语自然表达为“对撒母耳说”。
- source_word: מִי הָאֹמֵר
  choice: 先前说……的是谁
  rationale: 冠词加分词 הָאֹמֵר 实体化为“那说……的人”。结合所追问的是此前反对扫罗的人，加入“先前”使中文时序明确，但不改变指称。
- source_word: שָׁאוּל יִמְלֹךְ עָלֵינוּ
  choice: 扫罗岂能治理我们？
  rationale: 将未完成式按语境理解为带质疑意味的问句；“岂能”自然传达反对者的不认可。יִמְלֹךְ 的君王统治含义以“治理”表达，并由“扫罗”的王权语境限定。
- source_word: תְּנוּ הָאֲנָשִׁים
  choice: 把那些人交出来
  rationale: תְּנוּ 在此不是一般的“给”，而是要求将反对者交出；定冠词所指的人已由前问确定，故译“那些人”。
- source_word: וּנְמִיתֵם
  choice: 我们要处死他们
  rationale: מות 的使役式表示使其死亡；“处死”比“杀死”更能体现此处带有惩处、执行性质的要求。
theological_decisions:
- issue: שָׁאוּל יִמְלֹךְ עָלֵינוּ 的语气
  choice: 译作质疑性问句“扫罗岂能治理我们？”
  alternative: “扫罗会治理我们吗？”或陈述句“扫罗要治理我们”
  rationale: 上下文是在追究先前抗拒扫罗王权的人，问句最合语境；但希伯来语未完成式本身可作未来式理解，因此不把陈述式视为语法上绝对不可能。
translation_notes:
  register: 采用现代、庄重而口语自然的叙事表达。“岂能”略带正式色彩，适合公开质疑王权的引语，也保留其轻蔑反对的语势。未设置脚注，因为本译文已直接呈现语境中最可能的疑问读法，而替代读法不影响本节核心信息。
