revisions:
- from: 百姓对撒母耳说：“先前说‘扫罗岂能治理我们？’的是谁？把那些人交出来，我们要处死他们。”
  to: 百姓对撒母耳说：“说过‘扫罗会作王统治我们吗？’的是谁？把那些人交出来，我们要处死他们。”
  rationale: 修订以“会作王统治我们吗”保留原文的疑问可能性及מלך所含的王权统治意义，避免“岂能”所增加的强烈反诘语气。增设脚注以保留希伯来语未完成式可作陈述性将来表达的歧义，与英文审校记录一致。
