  text: וַ/יֹּ֤אמֶר שְׁמוּאֵל֙ אֶל הָ/עָ֔ם לְכ֖וּ וְ/נֵלְכָ֣ה הַ/גִּלְגָּ֑ל וּ/נְחַדֵּ֥שׁ שָׁ֖ם הַ/מְּלוּכָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/014.yaml
  text: Then Samuel said to the people[a], “Come, let us go to Gilgal, and there renew the kingship.”
translation:
  language: zh_hans
  text: 撒母耳对百姓说：“来吧，我们到吉甲去，在那里重新确认王权[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“更新王权”，或“更新王国”。
    reason: 希伯来语חִדֵּשׁ可表示“更新、使重新成立”；מְלוּכָה可指王权、君王制度，也可指王国。上下文倾向于公开确认扫罗的统治，但原文未完全排除较宽泛的理解。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 未另译连接词，以自然的现代汉语叙事承接上文；希伯来语的连续叙事关系仍由语境体现。
- source_word: שְׁמוּאֵל
  choice: 撒母耳
  rationale: 采用现代中文圣经中通行的人名译法。
- source_word: אֶל הָעָם
  choice: 对百姓
  rationale: עָם在此指聚集的以色列民众；“百姓”自然、庄重，也不把所指限缩为军队。
- source_word: לְכוּ וְנֵלְכָה
  choice: 来吧，我们……去
  rationale: 命令式与第一人称复数意愿式共同构成邀请；这样既表达撒母耳的召唤，也保留共同前往的语气。
- source_word: הַגִּלְגָּל
  choice: 吉甲
  rationale: 采用该地名的通行中文译名。
- source_word: שָׁם
  choice: 在那里
  rationale: 明确回指吉甲，符合原文的地点副词。
- source_word: וּנְחַדֵּשׁ
  choice: 重新确认
  rationale: חדש的加强词干基本义为“更新、使之重新成立”；结合扫罗已经受膏并被选立、此时又因得胜而获得民众支持的语境，“重新确认”在现代汉语中更自然，同时脚注保留“更新”的字面可能。
- source_word: הַמְּלוּכָה
  choice: 王权
  rationale: מְלוּכָה在此更侧重君王的职位、统治权或君王制度，而非领土意义上的“王国”；“王权”能保持这种焦点。
theological_decisions:
- issue: “更新王权”所指的行动
  choice: 译作“重新确认王权”，表达公开重申或巩固扫罗的君王地位，但不具体断定举行了何种仪式。
  alternative: 可理解为“更新王权”，或较宽泛地理解为“重振王国”。
  rationale: 上下文表明扫罗此前已被立为王，本节发生在他拯救基列雅比之后。译文因此体现再次确认的语境，同时借脚注保留希伯来语可指“更新”或更宽泛王国概念的张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“来吧，我们……去”保留共同参与的邀请语气；“重新确认王权”避免生硬直译，并以脚注保存原文的词义幅度。
