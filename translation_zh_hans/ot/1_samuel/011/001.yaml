base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/001.yaml
  text: Then Nahash the Ammonite went up and encamped against Jabesh-gilead. And all the men of Jabesh said to Nahash[a], “Make a covenant with us, and we will serve you.”
translation:
  language: zh_hans
  text: 亚扪人拿辖上来，在基列的雅比前安营。雅比所有的男子对拿辖说：“与我们立约[a]，我们就服事你。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“与我们切立约”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: 上来
  rationale: 保留עלה在叙事中的方向性表达；此处带有军事进逼的语境，但不额外译成“进攻”。
- source_word: נָחָשׁ הָעַמּוֹנִי
  choice: 亚扪人拿辖
  rationale: 按现代汉语习惯先标明族属，再音译人名。
- source_word: וַיִּחַן עַל
  choice: 对着……安营
  rationale: 准确表达在敌对对象面前扎营的军事情境，同时避免比原文更强的“围攻”。
- source_word: יָבֵשׁ גִּלְעָד
  choice: 基列的雅比
  rationale: 将地名理解为位于基列的雅比，采用中文圣经地名的通行形式。
- source_word: כָּל אַנְשֵׁי יָבֵישׁ
  choice: 雅比众人
  rationale: אַנְשֵׁי字面为“雅比的人／男人”；这里指参与全城政治交涉的一方。译作“众人”自然简洁，又不擅自限定为军人或正式公民。
- source_word: כְּרָת לָנוּ בְרִית
  choice: 跟我们立约
  rationale: ברית在此为政治臣服语境中的约；“立约”既自然，又保留其广义的圣经词汇联系。
- source_word: וְנַעַבְדֶךָּ
  choice: 我们就服事你
  rationale: 直接保留עבד“服事”的表达及臣属含义，不扩写为“成为你的仆人”或解释为“向你投降”。
theological_decisions: []
