base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/009.yaml
  text: 'They said to the messengers who were coming[a], “Thus you shall say to the men of Jabesh-gilead: Tomorrow, by the heat of the sun, you will have deliverance.” So the messengers came and told the men of Jabesh[b], and they rejoiced.'
translation:
  language: zh_hans
  text: 他们对前来的使者说：“你们要这样告诉基列·雅比人[a]：‘明天太阳正热的时候[b]，你们必得解救。’”使者就来到雅比人那里，把消息告诉他们；他们很欢喜。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“基列·雅比的一个人”；这里的单数很可能是集合用法，指城中的居民。
    reason: lexical_alternative
  - marker: b
    text: 或译“太阳最热的时候”，可能指一天中最炎热的时段。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּלְאָכִים הַבָּאִים
  choice: 前来的使者
  rationale: מַלְאָכִים在本叙事中指传递消息的人，不是天使；分词הַבָּאִים表示正在前来或已经来到现场的人，“前来的”自然保留其未明确限定的体貌。
- source_word: כֹּה תֹאמְרוּן
  choice: 你们要这样告诉
  rationale: 这是引出直接引语的固定表达；译文既保留“这样说”的形式，又符合现代汉语表达。
- source_word: לְאִישׁ יָבֵישׁ גִּלְעָד
  choice: 基列·雅比人
  rationale: אִישׁ虽为单数形式，但在此按上下文作集合用法，指城中的人；“基列·雅比人”简洁自然。
- source_word: תִּהְיֶה לָכֶם תְּשׁוּעָה
  choice: 你们必得解救
  rationale: תְּשׁוּעָה在此指从军事威胁中获救；“解救”保留具体处境，也避免不必要地把它限定为后世神学术语。
- source_word: בְּחֹם הַשָּׁמֶשׁ
  choice: 太阳炎热时
  rationale: 直译太阳发热之时，具有时间意义，可能指一天最热的时段；此译保留原有意象，不直接收窄为“中午”。
- source_word: וַיַּגִּידוּ
  choice: 把消息告诉他们
  rationale: 该动词表示告知、报告；结合上下文补出“消息”，使汉语叙事流畅而不增加实质内容。
- source_word: וַיִּשְׂמָחוּ
  choice: 他们都很欢喜
  rationale: 准确传达因获知将得解救而产生的喜乐，语体庄重而自然。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重且易懂的叙事汉语。“基列·雅比”以间隔号标示复合地名；保留原文对太阳热度的具体意象，并将两个脚注标在各自实际对应的短语之后。
