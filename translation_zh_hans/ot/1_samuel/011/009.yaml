revisions:
- from: 众人对前来的使者说：“你们要这样告诉基列·雅比人[a]：‘明天太阳炎热时[b]，你们必得解救。’”使者就来到雅比人那里，把消息告诉他们；他们都很欢喜。
  to: 他们对前来的使者说：“你们要这样告诉基列·雅比人[a]：‘明天太阳正热的时候[b]，你们必得解救。’”使者就来到雅比人那里，把消息告诉他们；他们很欢喜。
  rationale: 修订仅消除对未明示说话者范围的扩展，并润饰时间短语和结尾语气，使其更符合现代标准汉语；保留地名、集合单数的脚注说明、太阳热度的意象，以及解救的具体军事语境。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T05:26:11Z'
