  text: וַֽ/יִּפְקְדֵ֖/ם בְּ/בָ֑זֶק וַ/יִּהְי֤וּ בְנֵֽי יִשְׂרָאֵל֙ שְׁלֹ֣שׁ מֵא֣וֹת אֶ֔לֶף וְ/אִ֥ישׁ יְהוּדָ֖ה שְׁלֹשִׁ֥ים אָֽלֶף־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/008.yaml
  text: He mustered them at Bezek[a], and the sons of Israel were three hundred thousand, and the men of Judah thirty thousand.
translation:
  language: zh_hans
  text: 他在比色点阅众人；以色列子民[a]有三十万，犹大人有三万。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“以色列的儿子们”。
    reason: 保留原文בְנֵי יִשְׂרָאֵל的字面亲属表达及其与“犹大人”相区别的文学意味。
lexical_decisions:
- source_word: וַיִּפְקְדֵם
  choice: 他……点阅众人
  rationale: פקד在军事语境中指清点、检阅并编组人员。“点阅”既体现军队集结清点的含义，也比单纯的“数点”更符合上下文；宾语代词按汉语自然表达译作“众人”。
- source_word: בְּבָזֶק
  choice: 在比色
  rationale: בָזֶק是地名，音译为“比色”；介词בְּ在这里表示点阅军队的地点，译作“在”。
- source_word: בְנֵי יִשְׂרָאֵל
  choice: 以色列子民[a]
  rationale: 原文直译为“以色列的儿子们”，在此是以色列群体的称谓，并与后面的犹大人相区别。“以色列子民”保留亲属群体色彩，同时符合现代汉语习惯；脚注注明字面形式。
- source_word: שְׁלֹשׁ מֵאוֹת אֶלֶף
  choice: 三十万
  rationale: 按原文基数词直接翻译。
- source_word: וְאִישׁ יְהוּדָה
  choice: 犹大人
  rationale: אִישׁ虽为单数形式，这里具有集合意义，指属于犹大的众人；“犹大人”简洁自然地传达这一用法。
- source_word: שְׁלֹשִׁים אָלֶף
  choice: 三万
  rationale: 按原文基数词直接翻译。
theological_decisions:
- issue: בְנֵי יִשְׂרָאֵל这一宗族性、群体性称谓的译法
  choice: 以色列子民
  alternative: 以色列的儿子们；以色列人
  rationale: 此处并无需要消解的教义争议，但原文采用阳性亲属表达，并在文学结构上把以色列与犹大并列区分。“以色列子民”既保留这种群体及亲属色彩，又避免“以色列的儿子们”在现代汉语中显得生硬；字面形式以脚注保存。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“点阅”体现军事语境；分号清楚呈现点阅地点与两组人数。脚注标记置于其实际解释的“以色列子民”之后，而非置于地名之后。
