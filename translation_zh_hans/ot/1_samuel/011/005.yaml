base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/005.yaml
  text: And behold[a], Saul was coming from the field behind the cattle, and Saul said, “What is wrong with the people[b], that they are weeping?” And they told him the words of the men of Jabesh.
translation:
  language: zh_hans
  text: 看哪，扫罗正从田间来，跟在牛群后面[a]。扫罗问：“百姓怎么了，为什么在哭？”众人就把雅比人的话[b]告诉了他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “跟在牛群后面”也可译作“随在耕牛后面”。原文此短语可理解为扫罗从田间来时，随在牛只后面。
    reason: lexical_alternative
  - marker: b
    text: “雅比人的话”也可译作“雅比人的消息”。原文直译为“雅比人的话”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留叙事中转换场景并使画面顿现的作用；现代读者可以理解，同时比单用“这时”更贴近原文的鲜明语气。
- source_word: בָּא
  choice: 正……回来
  rationale: 原文分词描写当时正在发生的动作；“正……回来”既体现持续状态，也符合扫罗从田间返回的语境。
- source_word: אַחֲרֵי הַבָּקָר
  choice: 跟在牛群后面
  rationale: אַחֲרֵי有“在……后面、跟随”的空间意义，בָּקָר泛指牛类牲畜；“牛群”在本场景中自然且不把词义过度限定为耕牛。
- source_word: מִן הַשָּׂדֶה
  choice: 从田间
  rationale: 直接表达扫罗返回的起点，保持原文的地点关系。
- source_word: מַה לָעָם
  choice: 百姓怎么了
  rationale: 这是询问一群人出了什么事的惯用表达；译文简明自然，并保留扫罗对众人状况的询问。
- source_word: כִּי יִבְכּוּ
  choice: 竟然都在哭
  rationale: 在问句中表达引发询问的情形；“在哭”体现未完成式所描绘的持续动作，“竟然”自然连接前面的“怎么了”。
- source_word: וַיְסַפְּרוּ לוֹ
  choice: 众人就……告诉了他
  rationale: 以自然的汉语叙事表达报告或转述；原文主语未明说，按语境用“众人”承接在场百姓，不特指某一群人。
- source_word: דִּבְרֵי אַנְשֵׁי יָבֵישׁ
  choice: 雅比人的话
  rationale: 保留דִּבְרֵי的字面“话语”含义，也涵盖他们先前所传达的内容；“雅比人”在汉语中自然指雅比城的人，不必机械添加男性称谓。
