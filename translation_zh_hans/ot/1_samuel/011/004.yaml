  text: וַ/יָּבֹ֤אוּ הַ/מַּלְאָכִים֙ גִּבְעַ֣ת שָׁא֔וּל וַ/יְדַבְּר֥וּ הַ/דְּבָרִ֖ים בְּ/אָזְנֵ֣י הָ/עָ֑ם וַ/יִּשְׂא֧וּ כָל הָ/עָ֛ם אֶת קוֹלָ֖/ם וַ/יִּבְכּֽוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/004.yaml
  text: When the messengers came to Gibeah of Saul and spoke these words in the hearing of the people[a], all the people lifted up their voices and wept.
translation:
  language: zh_hans
  text: 使者来到扫罗的基比亚，把这些话说给百姓听；众人就都放声大哭。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译为“众人都扬起声音哭了”。这是表示高声哀哭的希伯来语习语。
    reason: 说明原文习语，并保留其字面意象。
lexical_decisions:
- source_word: הַמַּלְאָכִים
  choice: 使者
  rationale: 这里指雅比人派来传信的人，并非天使；“使者”准确、简洁，也符合上下文。
- source_word: גִּבְעַת שָׁאוּל
  choice: 扫罗的基比亚
  rationale: 保留希伯来语所属结构，表明这是与扫罗相关的基比亚城。
- source_word: וַיְדַבְּרוּ הַדְּבָרִים בְּאָזְנֵי הָעָם
  choice: 把这些话说给百姓听
  rationale: 自然表达“在百姓耳中说这些话”的希伯来语习语，同时保留公开传达和亲耳听见的意味。
- source_word: כָל הָעָם
  choice: 众人就都
  rationale: “众人……都”自然传达 כָל 与集合名词搭配所表示的全体范围。
- source_word: וַיִּשְׂאוּ ... אֶת קוֹלָם וַיִּבְכּוּ
  choice: 放声大哭
  rationale: 这是现代汉语中自然的哀哭表达，综合传达“扬起声音”这一习语及随后哭泣的动作，而不造成生硬直译。
