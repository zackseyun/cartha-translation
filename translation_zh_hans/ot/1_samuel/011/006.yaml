  yaml_path: translation/ot/1_samuel/011/006.yaml
  text: And the Spirit of God rushed upon Saul when he heard these words[b][a], and his anger burned greatly.
translation:
  language: zh_hans
  text: 扫罗听见这些话时，神的灵猛然临到他[a]，他就怒火大盛[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“强有力地临到他。”希伯来语动词可表示神的灵强有力地临到某人。
    reason: lexical_alternative
  - marker: b
    text: 直译：“他的鼻子大大地发热。”这是表示极其愤怒的希伯来语习语。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּצְלַח
  choice: 猛然临到
  rationale: צָלַח用于神的灵临到人时，常表达突然而有力的临到或赋能。“猛然临到”既保留动作的力度，也不把经文进一步解释为某种特定的内在体验。
- source_word: רוּחַ אֱלֹהִים
  choice: 神的灵
  rationale: 该组合短语在本叙事中自然指神自己的灵；“神的灵”是现代汉语中清楚、庄重且不过度阐释的表达。
- source_word: עַל
  choice: 临到他
  rationale: 介词עַל在神的灵与人的搭配中表示临到某人身上；汉语以“临到他”自然表达，无须机械译出“在……之上”。
- source_word: בְּשָׁמְעוֹ
  choice: 听见……时
  rationale: 介词בְּ加带后缀的不定词在这里表示时间关系；“听见……时”准确保留事件的时间衔接。
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: 这些话
  rationale: דְּבָרִים虽也可指“这些事”，但此处承接所传达的信息或话语，译作“这些话”更贴合上下文。
- source_word: וַיִּחַר אַפּוֹ
  choice: 他的怒气便猛烈燃烧起来
  rationale: 原文是以“鼻子发热”表达愤怒的希伯来语习语。“怒气……燃烧起来”保留燃烧意象，同时是现代汉语可以理解的表达。
- source_word: מְאֹד
  choice: 猛烈
  rationale: מְאֹד强化愤怒燃烧的程度；“猛烈”在汉语中自然修饰“燃烧”，传达强烈程度。
theological_decisions:
- issue: 本叙事中רוּחַ אֱלֹהִים的性质
  choice: 译作“神的灵”，指神的灵有力地临到扫罗
  alternative: 译作“从神而来的一个灵”
  rationale: 在扫罗受赋能、随即采取拯救行动的叙事语境中，这个无不定冠词的组合短语最自然地指神的灵。译文保留神主动临到扫罗的表述，不进一步规定其作用方式。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“猛然临到”保留神的灵行动的突然性与力度；“怒气……燃烧起来”保留原文意象，脚注说明其字面形式。
