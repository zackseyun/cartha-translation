base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/003.yaml
  text: The elders of Jabesh said to him, “Leave us alone for seven days, and we will send messengers throughout all the territory of Israel. Then, if there is no one to save us, we will come out to you.”
translation:
  language: zh_hans
  text: 雅比的长老对他说：“请暂且放过我们七天，我们要向以色列全境派遣使者；如果没有人救我们，我们就出来到你那里去。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֶרֶף לָנוּ
  choice: 请宽限我们
  rationale: 该短语字面有“放开我们、暂且不要逼迫我们”之意；在围城谈判语境中，“宽限我们”自然表达请求暂缓七天，又不额外说明具体军事行动。
- source_word: בְּכֹל גְּבוּל יִשְׂרָאֵל
  choice: 走遍以色列全境
  rationale: גְּבוּל在此指以色列境内或疆域；与“派使者”连用，译作“走遍……全境”符合现代汉语表达。
- source_word: מוֹשִׁיעַ
  choice: 来救我们
  rationale: 分词作名词，指实施拯救的人；补入“来”使汉语顺畅，但不限定救援方式。
- source_word: וְיָצָאנוּ אֵלֶיךָ
  choice: 我们就出来归顺你
  rationale: 字面为“我们就出来到你那里”；围城投降语境使其具有出城归降之意。“归顺”准确传达语用含义，并保留主动出城的“出来”。
theological_decisions: []
translation_notes:
  register: 采用庄重而通俗的现代标准汉语。保留长老请求七天宽限、寻求以色列全境援救以及无人施救便出城归降的条件结构；不增添原文未明说的神学解释。
