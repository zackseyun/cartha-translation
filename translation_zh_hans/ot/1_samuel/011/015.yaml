base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/015.yaml
  text: So all the people went to Gilgal[a], and there they made Saul king before Yahweh at Gilgal. There they sacrificed peace offerings before Yahweh, and there Saul and all the men of Israel rejoiced greatly.
translation:
  language: zh_hans
  text: 于是，众百姓都前往吉甲。他们在那里，就是在吉甲，在雅威面前立扫罗为王；又在那里，在雅威面前献上平安祭[a]。扫罗和以色列所有男子都在那里大大欢喜。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“团契祭”或“福祉祭”。希伯来语所指的是一种群体共同享用的祭，与平安、完整和共同庆祝有关。
    reason: 保留זְבָחִים שְׁלָמִים的主要词义选项及其祭礼内涵；标记置于对应的“平安祭”之后。
lexical_decisions:
- source_word: וַיֵּלְכוּ כָל הָעָם
  choice: 众百姓都到……去
  rationale: הלך在叙事链中表示一般性的前往；כָל הָעָם指全体聚集的民众，译作“众百姓都”自然且保留整体性。
- source_word: הַגִּלְגָּל / בַּגִּלְגָּל
  choice: 吉甲
  rationale: 按现代中文圣经地名的通行音译处理。
- source_word: וַיַּמְלִכוּ ... אֶת שָׁאוּל
  choice: 立扫罗为王
  rationale: מלך的使役形表示使某人作王；“立……为王”准确而自然，也不擅自加入原文未提及的膏立仪式。
- source_word: לִפְנֵי יְהוָה
  choice: 在雅威面前
  rationale: 保留“在……面前”的临在与公开敬拜意味，并将神名按专名音译为“雅威”。
- source_word: וַיִּזְבְּחוּ
  choice: 献上
  rationale: 在祭祀语境中，中文“献上……祭”比逐字译为“宰献”更自然，同时完整表达祭献行为。
- source_word: זְבָחִים שְׁלָמִים
  choice: 平安祭
  rationale: 这是שְׁלָמִים祭类的简洁通行译法；其团契、福祉和共享筵席等语义由脚注补充。
- source_word: וַיִּשְׂמַח ... עַד מְאֹד
  choice: 都……大大欢喜
  rationale: “大大”传达עַד מְאֹד的强烈程度；“欢喜”符合庄重而易懂的现代中文叙事语体。
- source_word: וְכָל אַנְשֵׁי יִשְׂרָאֵל
  choice: 以色列所有男子
  rationale: אַנְשֵׁי在此明确为阳性复数“男子／男人”；译文保留这一性别表达，不将其泛化为中性的“以色列人”。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；“雅威”以现代汉语常用形式音译该专名，避免用头衔替代，也不把元音传统改作“耶和华”。
- issue: אַנְשֵׁי יִשְׂרָאֵל的性别范围
  choice: 以色列所有男子
  alternative: 以色列众人；所有以色列人
  rationale: 原表达在词汇和语法上均为阳性。译文保留“男子”，不默默扩大为无性别限定的全民称谓；同时不进一步推断这些男子必然都是军人。
translation_notes:
  register: 采用庄重、清楚的现代标准普通话。“于是”承接希伯来叙事链；两处“在那里”和两处“在雅威面前”均予保留，以呈现原文的地点与神圣临在重点。
