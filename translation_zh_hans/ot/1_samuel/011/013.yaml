  text: וַ/יֹּ֣אמֶר שָׁא֔וּל לֹֽא יוּמַ֥ת אִ֖ישׁ בַּ/יּ֣וֹם הַ/זֶּ֑ה כִּ֥י הַ/יּ֛וֹם עָשָֽׂה יְהוָ֥ה תְּשׁוּעָ֖ה בְּ/יִשְׂרָאֵֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/013.yaml
  text: But Saul said[a], “Not a man shall be put to death on this day, for today Yahweh has brought salvation in Israel.”
translation:
  language: zh_hans
  text: 扫罗却说：“今天不可处死任何人，因为今天雅威在以色列施行了拯救[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“雅威成就了解救”，或“雅威使以色列得胜”。
    reason: תְּשׁוּעָה在此军事语境中可指拯救、解救或胜利；עָשָׂה与该名词连用也可译作“成就”。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 扫罗却说
  rationale: וַ־叙事形式推进情节；结合上一节众人要求处死反对者的提议，用“却”自然体现扫罗的回应与对比，同时保留叙事衔接。
- source_word: לֹא יוּמַת אִישׁ
  choice: 不可处死任何人
  rationale: יוּמַת是מות的使役被动形式，带有司法处决意味，故译为“处死”，而非仅译“死”；אִישׁ在此为泛指，现代汉语以“任何人”表达最清楚。
- source_word: בַּיּוֹם הַזֶּה
  choice: 今天
  rationale: 字面为“在这日”，在直接引语中自然译作“今天”；与后一个הַיּוֹם的重复相呼应。
- source_word: כִּי
  choice: 因为
  rationale: 引出扫罗不许处死人的理由，译作“因为”明确而自然。
- source_word: הַיּוֹם
  choice: 今天
  rationale: 直接表达当日发生之事，并保留原文对“今天”的重复强调。
- source_word: עָשָׂה יְהוָה תְּשׁוּעָה
  choice: 雅威施行了拯救
  rationale: עָשָׂה תְּשׁוּעָה是成就救援、施行拯救的表达。“施行了拯救”既保留神主动成就此事的含义，也不把军事处境中的意义限缩为单纯“胜利”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，保留其专名性质，不以称号替代。
- source_word: בְּיִשְׂרָאֵל
  choice: 在以色列
  rationale: 按בְ的基本处所义直译，保留“在以色列中”的表达；“为以色列”虽可体现受益者含义，却较具解释性。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名。采用“雅威”以音译方式保留其作为以色列之神专名的性质；“耶和华”是汉语传统形式，但较不贴近通常重建的读音。
- issue: 军事救援语境中תְּשׁוּעָה的译法
  choice: 拯救
  alternative: 解救；胜利
  rationale: 上下文确指从亚扪人手中获救并取得军事胜利，但“拯救”保留该词较宽的语义和神学张力，且明确将行动归于雅威；脚注列出语境中可成立的其他译法。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“不可处死任何人”保留司法语气；连续两次使用“今天”，反映原文的重复和强调。引号及标点按现代简体中文规范处理。
