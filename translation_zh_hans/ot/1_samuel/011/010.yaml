  yaml_path: translation/ot/1_samuel/011/010.yaml
  text: So the men of Jabesh said[a], “Tomorrow we will come out to you, and you may do to us whatever seems good in your eyes.”
translation:
  language: zh_hans
  text: 于是，雅比人说[a]：“明天我们要出来，到你们那里去；你们看怎样好，就怎样对待我们吧。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “我们要出来，到你们那里去”也可译作“我们要出去，到你们那里去”。希伯来文没有明确说“投降”，但上下文暗示他们要向对方屈服。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: 于是……说
  rationale: 连续式叙事动词推进情节，并承接上文的因果脉络；“于是”符合现代汉语叙事习惯。
- source_word: אַנְשֵׁי יָבֵישׁ
  choice: 雅比人
  rationale: 原文直指“雅比的男人们”；汉语以地名加“人”自然表达当地男子或居民群体，同时不擅自补入本节未出现的“基列”。
- source_word: מָחָר
  choice: 明天
  rationale: 准确表达指向次日的时间副词。
- source_word: נֵצֵא אֲלֵיכֶם
  choice: 我们会出来到你们那里
  rationale: יצא 的基本意义是“出去、出来”，而非明说“投降”；译文保留动作表达及其在语境中的含蓄意味。
- source_word: וַעֲשִׂיתֶם לָּנוּ
  choice: 你们……就可以怎样处置我们
  rationale: 结合下句惯用语，此处表示容许对方采取自认为合宜的行动；“处置我们”在汉语中自然传达受制于人的语境，而没有把“投降”直接写入正文。
- source_word: כְּכָל הַטּוֹב בְּעֵינֵיכֶם
  choice: 你们看怎样好
  rationale: 保留“在你们眼中为好”的判断视角，同时用自然现代汉语表达“任凭你们认为合宜之事”的惯用含义。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。正文保留原文对“出来”的含蓄表达，不以解释性的“投降”取代；同时用“你们看怎样好”自然呈现希伯来语“在你们眼中为好”的惯用说法。
