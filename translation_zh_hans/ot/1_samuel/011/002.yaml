  text: וַ/יֹּ֣אמֶר אֲלֵי/הֶ֗ם נָחָשׁ֙ הָ/עַמּוֹנִ֔י בְּ/זֹאת֙ אֶכְרֹ֣ת לָ/כֶ֔ם בִּ/נְק֥וֹר לָ/כֶ֖ם כָּל עֵ֣ין יָמִ֑ין וְ/שַׂמְתִּ֥י/הָ חֶרְפָּ֖ה עַל כָּל יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/002.yaml
  text: 'Nahash the Ammonite said to them, “On this condition I will make a treaty with you: that every right eye of yours be gouged out, and I will make it a disgrace upon all Israel.”'
translation:
  language: zh_hans
  text: 亚扪人拿辖对他们说：“我可以按这个条件与你们立约：剜出你们每个人的右眼，使这事成为全以色列的耻辱。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּזֹאת אֶכְרֹת לָכֶם
  choice: 我可以按这个条件与你们立约
  rationale: בְּזֹאת 表示“以此为条件”，כרת 在“约”的语境中采用现代汉语惯用表达“立约”；补出“可以”自然呈现说话者提出条件的语气。
- source_word: בִּנְקוֹר לָכֶם כָּל־עֵין יָמִין
  choice: 剜出你们每个人的右眼
  rationale: נקר 指刺穿、挖出眼睛；כָּל־עֵין יָמִין 字面为“每一只右眼”，在汉语中译作“你们每个人的右眼”，明确对象而不改变范围。
- source_word: וְשַׂמְתִּיהָ חֶרְפָּה עַל כָּל־יִשְׂרָאֵל
  choice: 使这事成为全以色列的耻辱
  rationale: 阴性代词 הָ 回指所施加的残害或此事；译为“这事”保留自然指代。חֶרְפָּה 可指羞辱、耻辱，此处选“耻辱”兼顾结果与公共羞耻。
theological_decisions:
- issue: 残害行为与使以色列蒙羞之间的句法关系
  choice: 将两者译为连续而相关的行动：“剜出……，使这事成为……”
  alternative: “剜出……，并把它加在全以色列身上作为耻辱”
  rationale: 希伯来文以 וְ 连接两个动词，既可视为并列，也含结果意味；中文“使”自然传达拿辖借此羞辱全以色列的目的或结果，但不额外加入神学解释。
translation_notes:
  register: 采用现代、庄重且清晰的叙事语言。“拿辖”与“亚扪人”沿用常见圣经专名格式；直陈暴力内容，不弱化原文，也不作渲染。
