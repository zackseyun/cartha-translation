id: 1SA.3.9
reference: 1 Samuel 3:9
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר עֵלִ֣י לִ/שְׁמוּאֵל֮ לֵ֣ךְ שְׁכָב֒ וְ/הָיָה֙ אִם יִקְרָ֣א אֵלֶ֔י/ךָ וְ/אָֽמַרְתָּ֙ דַּבֵּ֣ר יְהוָ֔ה כִּ֥י שֹׁמֵ֖עַ עַבְדֶּ֑/ךָ וַ/יֵּ֣לֶךְ שְׁמוּאֵ֔ל וַ/יִּשְׁכַּ֖ב בִּ/מְקוֹמֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/009.yaml
  text: Then Eli said to Samuel[a], “Go, lie down, and if he calls to you, you shall say, ‘Speak, Yahweh, for your servant is listening.’” So Samuel went and lay down in his place.
translation:
  language: zh_hans
  text: 于是，以利对撒母耳说：“去躺下吧。如果他呼唤你，你就说：‘耶和华[a]啊，请说吧，因为你的仆人正在听。’”撒母耳就去，在自己的地方躺下了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文使用神的名字יהוה（YHWH）。正文采用中文传统译名“耶和华”；也常音译作“雅威”。
    reason: 说明原文是神的专名，并交代中文的另一常见音译。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 于是，以利……说
  rationale: 叙事性的连续式推动情节；“于是”自然表达先后进展。
- source_word: לֵךְ שְׁכָב
  choice: 去躺下吧
  rationale: 保留两个连续命令的简洁直接，不增添原文未明说的“睡觉”。
- source_word: וְהָיָה אִם
  choice: 如果
  rationale: 该结构引入条件；译作“如果”保留条件性，不将其强化为确定发生的“当……时”。
- source_word: יִקְרָא אֵלֶיךָ
  choice: 他呼唤你
  rationale: 原文主语为未明说的第三人称阳性单数；上下文表明以利已认出呼唤者是耶和华，因此保留“他”，而不在此处直接补出神名。
- source_word: וְאָמַרְתָּ
  choice: 你就说
  rationale: 在条件句后表达相应的指示，现代汉语用“就”可清楚呈现条件与结果。
- source_word: דַּבֵּר
  choice: 请说吧
  rationale: 原文是“说”的命令式；汉语中仆人向神说话时加“请”较自然庄重，“吧”使直接引语流畅，但不改变请求神发言的核心含义。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 这是四字神名YHWH。采用现代中文读者最熟悉的传统专名“耶和华”，并以脚注说明“雅威”这一常见音译。
- source_word: כִּי
  choice: 因为
  rationale: 引出请求神说话的理由，直接对应原文的因果关系。
- source_word: שֹׁמֵעַ
  choice: 正在听
  rationale: 分词表达持续、专注的聆听状态；“正在听”比单纯“听见”更能体现预备领受的意味。
- source_word: עַבְדֶּךָ
  choice: 你的仆人
  rationale: 此处是面对神的谦卑自称，重点不在奴役身份，因此译作“仆人”。
- source_word: וַיֵּלֶךְ ... וַיִּשְׁכַּב
  choice: 就去……躺下了
  rationale: 两个连续叙事动词说明撒母耳随即照以利的吩咐行动。
- source_word: בִּמְקוֹמוֹ
  choice: 在自己的地方
  rationale: 贴近原文“在他的位置”，不额外推断为“平常睡觉的地方”。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名YHWH，而非“主”这一称号。正文保留专名，并采用中文传统且广为人知的“耶和华”；脚注注明更接近学界常见拟音的“雅威”，避免掩盖原文形式。
- issue: יִקְרָא的隐含主语
  choice: 他呼唤你
  alternative: 有人呼唤你
  rationale: 希伯来文没有明说主语名称，但动词为第三人称阳性单数；上下文已表明以利认出呼唤者是耶和华。“他”既保留原文的隐含性，也符合叙事语境。
- issue: 对神所用命令式דַּבֵּר的语气
  choice: 请说吧
  alternative: 说吧
  rationale: 原文语法上是命令式，但在这里具有恭敬请求的语用功能。现代汉语加“请”可自然传达仆人向神说话的礼貌语气，并不把句子改为陈述。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。对话保持简洁；“耶和华啊”明确呼格，“你的仆人正在听”保留谦卑自称和持续聆听的意味。
