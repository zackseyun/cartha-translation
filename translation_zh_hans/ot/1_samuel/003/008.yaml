base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/008.yaml
  text: And Yahweh called Samuel again a third time. So he got up and went to Eli and said, “Here I am, for you called me.” Then Eli understood that Yahweh was calling the boy.
translation:
  language: zh_hans
  text: 雅威第三次呼唤撒母耳。撒母耳就起来，到以利那里，说：“我在这里，因为你叫了我。”这时，以利明白了，是雅威在呼唤这孩子。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּסֶף ... קְרֹא
  choice: 再次呼唤（由“第三次”自然体现）
  rationale: יָסַף加不定式表示动作重复或继续；汉语以“第三次呼唤”即可清楚、自然地表达再次发生，避免赘述“又第三次”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来语四字神名的通行音译处理，保留其作为以色列之神专名的性质，不以称号替代。
- source_word: בַּשְּׁלִשִׁית
  choice: 第三次
  rationale: 该短语作状语，明确表示这是第三次呼唤。
- source_word: וַיָּקָם
  choice: 就起来
  rationale: 准确表达起身的动作，并以“就”自然衔接叙事中的即时反应。
- source_word: וַיֵּלֶךְ אֶל־עֵלִי
  choice: 到以利那里
  rationale: 自然表达撒母耳朝以利所在之处前去，符合现代汉语叙事习惯。
- source_word: הִנְנִי
  choice: 我在这里
  rationale: 这是呼召—回应语境中自然、庄重的固定表达，也保留了随时听命的意味。
- source_word: כִּי קָרָאתָ לִי
  choice: 因为你叫了我
  rationale: 此处כִּי说明撒母耳前来的原因；“叫了我”保留他误以为以利呼叫自己的叙事情境。
- source_word: וַיָּבֶן
  choice: 明白了
  rationale: 表示以利此刻才理解事情的实情；句末的“了”体现认识状态的转变。
- source_word: קֹרֵא
  choice: 在呼唤
  rationale: 分词形式描写正在发生或反复出现的呼唤，用“在呼唤”保留其进行意味。
- source_word: לַנָּעַר
  choice: 这孩子
  rationale: נַעַר可指男孩或青年；本段中的撒母耳仍在以利照管之下，“这孩子”贴合语境，也比“少年人”更自然。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。译作“雅威”以音译保留其专名性质，不用“主”这一称号替代；“耶和华”虽有悠久汉译传统，但“雅威”更接近当代学界通常采用的拟音。
translation_notes:
  register: 采用现代、清楚而庄重的叙事语体。避免机械直译“又……第三次”造成的汉语重复，同时保留呼唤次数、撒母耳的误解，以及以利此时才明白的叙事推进。
