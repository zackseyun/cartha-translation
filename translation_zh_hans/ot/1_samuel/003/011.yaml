base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/011.yaml
  text: Then the LORD said to Samuel, "Look, I am about to do a thing in Israel that will make both ears of everyone who hears of it tingle."
translation:
  language: zh_hans
  text: 耶和华对撒母耳说：“看哪，我将要在以色列行一件事；凡听见这事的人，双耳都要发鸣。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名译出神圣四字名，区别于一般称谓“主”。
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留希伯来语引人注意、郑重宣告的语气，同时符合庄重的现代中文表达。
- source_word: אָנֹכִי עֹשֶׂה דָבָר
  choice: 我要……行一件事
  rationale: 进行分词结合语境表达即将施行的行动；“事”保留דָבָר在此处较宽泛的含义，不提前点明具体审判。
- source_word: תְּצִלֶּינָה שְׁתֵּי אָזְנָיו
  choice: 两耳都必嗡嗡作响
  rationale: 较具体地保留双耳因震骇消息而鸣响的希伯来语形象，避免仅意译为“震惊”。
theological_decisions:
- issue: 所要施行之事的性质
  choice: 不在本节明说是审判，只译作“行一件事”
  alternative: 译作“施行一场审判”
  rationale: 原文דָבָר本身未明言“审判”；其严厉性质由上下文揭示，应保留本节措辞的悬念。
- issue: 神圣名字的呈现
  choice: 耶和华
  alternative: 主
  rationale: 原文使用专名יהוה；正文以“耶和华”呈现，可保留专名与称谓之间的区别。
translation_notes:
  register: 采用庄重而易懂的现代标准普通话。“看哪”保留宣告语气；分号使神的行动与听者的强烈反应层次清楚。
