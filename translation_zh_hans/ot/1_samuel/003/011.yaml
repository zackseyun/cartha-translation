  source_fidelity: “耶和华”“看哪”“在以色列行一件事”均忠实对应原文。末句的强烈听觉意象也已保留；但“凡听见的人”在中文里未明示所听的内容，较原文“凡听见这事的人”略欠明确。原文的分词结构带有即将发生的宣告语境，“我将要”比“我要”更清楚地传达这一点。
