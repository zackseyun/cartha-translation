base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/013.yaml
  text: And I have declared to him that I am judging his house forever for the iniquity that he knew[a], because his sons were cursing God, and he did not restrain them.
translation:
  language: zh_hans
  text: 我已经告诉他：我要因他明知这罪孽，永远审判他的家；他的儿子们自招咒诅[a]，他却没有制止他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 另按一种异读，有些古代文本见证作“他的儿子们咒诅上帝”，也可译作“亵渎上帝”。
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִגַּדְתִּי
  choice: 我已经告诉他
  rationale: נגד 的使役式表示告知、宣告；完成式在上下文中指先前已经作出的宣告。
- source_word: שֹׁפֵט אֲנִי
  choice: 我要……审判
  rationale: 分词配显式代词可表达正在施行或即将施行的确定行动；汉语用“我要”自然传达预告中的迫近性与确定性。
- source_word: בֵּיתוֹ
  choice: 他的家
  rationale: 保留希伯来语“家”的宽广含义，既可包括家人，也可涉及家系，不加以缩窄。
- source_word: עַד עוֹלָם
  choice: 永远
  rationale: 直接表达持续不止的严厉审判。
- source_word: בַּעֲוֺן
  choice: 因……罪孽
  rationale: עָוֹן 可指邪恶行为及其罪责；“罪孽”兼具道德严重性与庄重语体。
- source_word: אֲשֶׁר יָדַע
  choice: 他明知的
  rationale: 简洁保留以利对该罪行知情、因而负有责任的含义；不将关系结构解释得过细。
- source_word: מְקַלְלִים לָהֶם
  choice: 自招咒诅
  rationale: 按马所拉辅音文本，לָהֶם 可作反身或受益格理解，意为给自己招来咒诅；此译比生硬的“咒诅自己”更符合现代汉语，同时保留文本难点。
- source_word: וְלֹא כִהָה בָּם
  choice: 他却没有制止他们
  rationale: כִּהָה 在此有削弱、遏止之意；“制止”清楚表达以利没有有效约束儿子。
theological_decisions:
- issue: 儿子们所犯之罪应按马所拉文本译为自招咒诅，还是依古代见证译为咒诅上帝
  choice: 正文采用“自招咒诅”
  alternative: 咒诅上帝；亵渎上帝
  rationale: 马所拉辅音文本支持“给自己招来咒诅”一类理解；若干古代见证则反映“咒诅上帝”的异读。正文以原文主体证据为先，并在脚注保存重要异读，不消除文本张力。
- issue: “他的家”所涵盖的范围
  choice: 保留“他的家”
  alternative: 他的家族；他的后代
  rationale: 希伯来语 בית 可同时涵盖家庭、家族和延续的家系；不在译文中人为限定。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“自招咒诅”避免直译腔；分号清楚呈现审判宣告及其理由。脚注标记已在正文对应位置出现。
