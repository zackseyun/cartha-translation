  to: 我已经告诉他：我要因他明知这罪孽，永远审判他的家；他的儿子们自招咒诅[a]，他却没有制止他们。
  rationale: 修订仅澄清“他明知”与儿子罪行之间的句法和逻辑关联，并微调脚注以准确标示异读；保留马所拉文本的困难读法“自招咒诅”、审判的持续性，以及“他的家”的宽广含义。
