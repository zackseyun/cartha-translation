  source_fidelity: 译文总体准确保留了马所拉文本中“他的家”“永远”和儿子“为自己招来咒诅”这一困难读法，也以脚注呈现“咒诅上帝”的重要异读。但“因他明知的罪孽……；因为……”将原文中相连的罪责说明拆成两个略显松散的因果层次，宜使“他明知”与儿子行为的关系更清楚。
  naturalness: “因他明知的罪孽”在现代汉语中略显压缩，容易暂时理解为以利亲自犯下、且他知道的罪。改为“因他明知这罪孽”更自然，并能清楚表明他的知情与失责。
  terminology: “审判”“他的家”“罪孽”“制止”均合乎庄重的现代圣经汉语。正文的“自招咒诅”可保留为对 לָהֶם 的自然表达；脚注应明确这是另一读法，而非笼统称古代文本直接“作”该句。
  issues:
