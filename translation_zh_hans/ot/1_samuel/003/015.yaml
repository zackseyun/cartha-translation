  text: וַ/יִּשְׁכַּ֤ב שְׁמוּאֵל֙ עַד הַ/בֹּ֔קֶר וַ/יִּפְתַּ֖ח אֶת דַּלְת֣וֹת בֵּית יְהוָ֑ה וּ/שְׁמוּאֵ֣ל יָרֵ֔א מֵ/הַגִּ֥יד אֶת הַ/מַּרְאָ֖ה אֶל עֵלִֽי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/015.yaml
  text: Samuel lay down until morning; then he opened the doors of the house of Yahweh[a]. But Samuel was afraid to tell the vision to Eli.
translation:
  language: zh_hans
  text: 撒母耳躺着直到早晨；随后，他打开了雅威居所的门。撒母耳却不敢把那异象[a]告诉以利。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“显现”。希伯来语 מַרְאָה 可指显现，也可指异象性的启示；这里按撒母耳夜间领受启示的上下文译作“异象”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: 躺
  rationale: שׁכב在此是“躺下、躺着”，经文没有明确说撒母耳睡着，因此不用“睡到早晨”。
- source_word: עַד הַבֹּקֶר
  choice: 到早晨
  rationale: 准确表达时间终点，同时符合现代汉语叙事习惯。
- source_word: וַיִּפְתַּח
  choice: 随后打开了
  rationale: “打开”直接对应动词；“随后”自然体现希伯来叙事时序，不增添原文没有的移动动作。
- source_word: דַּלְתוֹת בֵּית יְהוָה
  choice: 雅威殿的门
  rationale: “殿”在此指敬拜雅威的圣所建筑，比容易被理解为普通住宅的“房屋”自然，也不特指后来所罗门建造的圣殿；复数דַּלְתוֹת可指门扇，汉语通常统称“门”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以常见的现代汉语音译呈现神的专名，保留原文的圣约之名。
- source_word: יָרֵא מֵהַגִּיד
  choice: 不敢……告诉
  rationale: 原结构表示因害怕而不愿或不敢做某事；“不敢告诉”是自然汉语，并保留恐惧所造成的顾忌。
- source_word: הַמַּרְאָה
  choice: 那异象
  rationale: מַרְאָה既可指显现，也可指异象；本段指撒母耳夜间所得的启示，“异象”最切合上下文，同时以脚注保留词义上的另一可能。
- source_word: אֶל עֵלִי
  choice: 告诉以利
  rationale: 汉语“告诉”直接接对象，不需要逐字译出介词אֶל。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；采用“雅威”保留专名性质，不以称号代替，也不采用较传统但语音依据较弱的“耶和华”。
- issue: הַמַּרְאָה指异象还是显现
  choice: 正文译“异象”
  alternative: 显现
  rationale: 上下文是撒母耳夜间领受雅威的话，“异象”符合启示性经历；但该词本身也可表示“显现”，故在脚注中保留此歧义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“躺到早晨”避免把原文解释为已经入睡；“雅威殿”简洁表达敬拜场所，同时避免把它误解为后来耶路撒冷的所罗门圣殿；转折词“却”突出撒母耳开门与他内心害怕之间的叙事推进。
