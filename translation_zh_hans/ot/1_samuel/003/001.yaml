  text: וְ/הַ/נַּ֧עַר שְׁמוּאֵ֛ל מְשָׁרֵ֥ת אֶת יְהוָ֖ה לִ/פְנֵ֣י עֵלִ֑י וּ/דְבַר יְהוָ֗ה הָיָ֤ה יָקָר֙ בַּ/יָּמִ֣ים הָ/הֵ֔ם אֵ֥ין חָז֖וֹן נִפְרָֽץ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/001.yaml
  text: The boy Samuel was ministering to Yahweh before Eli[a], and the word of Yahweh was rare in those days; visions were not widespread.
translation:
  language: zh_hans
  text: 童子撒母耳在以利面前事奉雅威；那些日子，雅威的话稀少，异象也不常有[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“没有频繁的异象”；也可较直译为：“异象没有涌现。”这个希伯来语说法表示启示性的异象并不常见，也没有广泛出现。
    reason: 保留אֵין חָזוֹן נִפְרָץ的惯用表达、原文字面意象及可能译法。
lexical_decisions:
- source_word: וְ/הַ/נַּעַר
  choice: 童子
  rationale: הַנַּעַר指男孩或少年；结合撒母耳在叙事中的年龄与身份，“童子”既准确又符合庄重的叙事语体。句首וְ不机械译为“并且”，由中文句序自然承接上下文。
- source_word: מְשָׁרֵת אֶת יְהוָה
  choice: 事奉雅威
  rationale: 分词מְשָׁרֵת表达持续进行的服事，并带有圣所服事的宗教语义；“事奉”比一般的“服侍”更能体现这一层含义。
- source_word: לִפְנֵי עֵלִי
  choice: 在以利面前
  rationale: 保留לִפְנֵי“在……面前”的基本意义，同时容许上下文所含“在以利督导之下”的意味，不在正文中将其单义化。
- source_word: וּ/דְבַר יְהוָה
  choice: 雅威的话
  rationale: 直接保留“雅威之言”的启示性表达，中文用“雅威的话”自然清楚。
- source_word: יָקָר
  choice: 很稀少
  rationale: יָקָר也可表示“珍贵”，但后半句说明启示性异象不常出现，因此此处主要指稀有、罕见；“很稀少”符合语境。
- source_word: בַּ/יָּמִים הָ/הֵם
  choice: 那些日子
  rationale: 贴近希伯来语时间短语，并保持圣经叙事中自然、庄重的表达。
- source_word: אֵין חָזוֹן נִפְרָץ
  choice: 异象并不常有
  rationale: חָזוֹן在此可作集合意义理解；נִפְרָץ含突破、涌现或广泛传开的意象。“并不常有”以自然现代汉语表达启示性异象不频繁的语境意义，同时用脚注保留原文形象和其他译法。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较直接地音译其通行的学术重构读音，保留其作为立约之名的性质。
- issue: “雅威的话”与“异象”的关系
  choice: 保留两个并列而相互解释的启示性表述
  alternative: 将两者合并解释为同一种特定启示方式
  rationale: 原文先说雅威的话稀少，再说异象不常涌现；译文保留这种并列与张力，不额外限定神启示的具体方式。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“童子”“事奉”保留经文语体，但避免生僻文言；标点将两项背景陈述清楚分开。脚注标记置于其实际解释的“异象并不常有”之后。
