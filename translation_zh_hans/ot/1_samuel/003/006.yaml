base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/006.yaml
  text: Then the LORD called Samuel again. Samuel got up and went to Eli and said, “Here I am, because you called me.” But he said, “I did not call, my son. Go back; lie down.”
translation:
  language: zh_hans
  text: 耶和华又呼唤撒母耳。撒母耳就起来，到以利那里，说：“我在这里，因为你叫了我。”以利说：“我没有叫你，孩子。回去躺下吧。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּסֶף ... קְרֹא עוֹד
  choice: 又呼唤
  rationale: 希伯来语以“再加上……又……”表达动作再次发生；现代汉语简洁译为“又呼唤”，自然且完整传达重复之意。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经传统中广为人知的专名译法，明确呈现原文的神圣名字。
- source_word: הִנְנִי
  choice: 我在这里
  rationale: 保留原文表示立即回应和听候吩咐的固定表达，不扩译为原文未明说的内容。
- source_word: כִּי קָרָאתָ לִי
  choice: 因为你叫了我
  rationale: כִּי 在此自然表达撒母耳前去的原因；“叫了我”也体现完成动作，并符合现代汉语。
- source_word: בְנִי
  choice: 孩子
  rationale: 原义为“我的儿子”，此处是年长者对孩子的亲切称呼；译作“孩子”比“我儿”更符合现代汉语口吻，同时保留关爱语气。
- source_word: שׁוּב שְׁכָב
  choice: 回去躺下吧
  rationale: שׁוּב 在语境中指回到原处，两个祈使句以自然汉语连续表达，并用“吧”体现温和语气。
theological_decisions:
- issue: 神圣名字 יהוה 的呈现
  choice: 耶和华
  alternative: 上主
  rationale: 原文使用专名而非称号；“耶和华”在简体中文语境中可辨识为该专名，避免将其仅处理为普通称号。
- issue: 撒母耳对呼唤来源的理解
  choice: 因为你叫了我
  alternative: 你叫我，我就来了
  rationale: 保留撒母耳当时误以为以利呼唤他的叙事视角，不提前解释或化解该误认。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。叙述简洁，人物对话保持儿童回应长者及长者温和答复的语气；无需脚注。
