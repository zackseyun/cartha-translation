  text: בַּ/יּ֤וֹם הַ/הוּא֙ אָקִ֣ים אֶל עֵלִ֔י אֵ֛ת כָּל אֲשֶׁ֥ר דִּבַּ֖רְתִּי אֶל בֵּית֑/וֹ הָחֵ֖ל וְ/כַלֵּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/012.yaml
  text: On that day I will carry out against Eli all that I have spoken concerning his house[b][a], from beginning to end.
translation:
  language: zh_hans
  text: 到那日，我必在以利身上施行我从前论到他家所说的一切[a][b]，从头到尾。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “施行”也可译作“使……应验”或“使……实现”。
    reason: lexical_alternative
  - marker: b
    text: “他家”指以利家，可指他的家属、家系或祭司家族。
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: 到那日
  rationale: 自然表达一个特定的未来时日，并保留指示语“那”的力度。
- source_word: אָקִים
  choice: 使……都实现
  rationale: קום的使役式以先前所说的话为宾语，在此指使所宣告的事确立、应验；“使……实现”既贴近原意，也适合现代汉语。
- source_word: אֶל עֵלִי
  choice: 针对以利
  rationale: אֶל通常可译“向、对”；这里处于审判语境，“针对”保留行动指向以利且对他不利的语气，同时不把介词过度强化为“攻击”。
- source_word: אֵת כָּל אֲשֶׁר דִּבַּרְתִּי
  choice: 我……所说的一切
  rationale: 保留כָּל אֲשֶׁר所表达的全面性，并忠实呈现先前已经说出的神谕。
- source_word: אֶל בֵּיתוֹ
  choice: 针对以利家
  rationale: 在语境中指神先前关于并针对以利家所发的审判之言；汉语“针对以利家所说”自然地涵盖话语的对象及不利方向。
- source_word: בֵּיתוֹ
  choice: 以利家
  rationale: “家”保留בַּיִת的宽广含义，可包括家属、家系和祭司家族，不在正文中将范围限定得过窄。
- source_word: הָחֵל וְכַלֵּה
  choice: 从头到尾，无一不成
  rationale: 原文成对表达起始与完成，强调所宣告的一切将完全施行；此译法以自然汉语明确传达彻底完成。
theological_decisions:
- issue: 对以利及其家的审判范围
  choice: 保留“以利家”这一宽泛称谓，不限定为直系家属，也不直接扩大为整个祭司制度。
  alternative: 译作“以利的家属”“以利的后代”或“以利的祭司家族”。
  rationale: בֵּיתוֹ在此可涵盖家庭、家系及祭司家族；保留“家”可维持经文本身的范围与张力。
- issue: אָקִים所表达的神谕实现方式
  choice: 译为“使……都实现”，表达神使先前所说的话成为事实。
  alternative: 译为“施行”以突出审判，或译为“成全”以突出应验。
  rationale: 原词核心是使所说的话站立、成立或应验；“实现”不把词义仅限于惩罚行动，也不削弱本段审判语境。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“到那日”保留先知性宣告语气；“以利家”维持原文家族性和祭司家系层面的含混。“从头到尾，无一不成”自然呈现彻底完成的强调。
