  yaml_path: translation/ot/1_samuel/003/004.yaml
  text: Then Yahweh called to Samuel[a], and he said, “Here I am.”
translation:
  language: zh_hans
  text: 雅威[a]呼唤撒母耳，撒母耳说：“我在这里。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文写作“יהוה”（YHWH）；音译为“雅威”，传统上也译作“耶和华”。
    reason: 说明四字神名的原文形式及常见中文译法。
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: 呼唤
  rationale: קרא的Qal叙事形式，表示出声叫人；“呼唤”自然地传达了可听见的召唤，又不强化为带有权威意味的“召见”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文四字神名YHWH作音译，以保留经文使用的专名，而不以称号代替。
- source_word: אֶל שְׁמוּאֵל
  choice: 撒母耳
  rationale: 介词אֶל在此标明呼唤的对象；现代汉语中“呼唤撒母耳”无需另译介词。人名采用通行译法“撒母耳”。
- source_word: וַיֹּאמֶר
  choice: 他说
  rationale: אמר的叙事形式直译为“他说”。希伯来文动词只以阳性单数形式提示主语，并未重复姓名；中文保留代词表达，不额外加入“回答”等原文没有的语义。上下文表明说话者是撒母耳。
- source_word: הִנֵּנִי
  choice: 我在这里
  rationale: 这是回应呼唤、表示人在场并愿意听命的惯用语。“我在这里”符合现代汉语，又保留其简洁庄重的语气。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名YHWH，因此正文采用较贴近其常见学术拟音的“雅威”，并在脚注列出中文传统译名“耶和华”，不把专名改作“主”等称号。
- issue: “他说”的主语
  choice: 保留代词“他”
  alternative: 明确译作“撒母耳说”
  rationale: 从上下文和回应语可知说话者是撒母耳，但本节希伯来文没有再次明说姓名。采用“他”既符合中文叙事习惯，也避免把上下文推断写成原文明示内容。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。保留希伯来叙事的紧凑推进，不机械翻出每个连接词；引语用现代中文标点。
