base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/007.yaml
  text: Samuel did not yet know Yahweh[b][a], and the word of Yahweh had not yet been revealed to him.
translation:
  language: zh_hans
  text: 撒母耳还不认识耶和华[a][b]，耶和华的话也还没有向他显明。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “认识”也可理解为“认出”。这里可指撒母耳还没有在亲自领受启示时认识或认出耶和华。
    reason: lexical_alternative
  - marker: b
    text: 原文为希伯来文神名 YHWH，传统中文译作“耶和华”。
    reason: alternative_reading
lexical_decisions:
- source_word: טֶרֶם
  choice: 还不／还没有
  rationale: 两次出现均表示截至叙事当时尚未发生的状态；按各分句的现代汉语习惯分别译为“还不”和“还没有”。
- source_word: יָדַע אֶת־יְהוָה
  choice: 认识耶和华
  rationale: 保留“认识”所含的关系性、经验性含义及其一定的开放性；上下文将其与首次领受启示联系起来，但正文不把这一含义解释得过满。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神名译法，而非只用称号“主”。
- source_word: יִגָּלֶה
  choice: 显明
  rationale: 该词为尼法勒式，表达被揭示、显露；“向他显明”自然地保留被动意义，并符合“话”在启示语境中的搭配。
- source_word: אֵלָיו
  choice: 向他
  rationale: 准确表达启示所指向的对象，在现代汉语中与“显明”搭配自然。
- source_word: דְּבַר יְהוָה
  choice: 耶和华的话
  rationale: 保留希伯来文常见的先知性表达及其神学回响，避免用更具解释性的“信息”。
- source_word: וּשְׁמוּאֵל
  choice: 撒母耳
  rationale: 句首连接词在此引出叙事说明；中文无需机械加译“而”或“这时”。
theological_decisions:
- issue: “撒母耳还不认识耶和华”的含义
  choice: 正文保留“认识”的关系性和经验性张力，脚注说明可指尚未在直接启示中认出或亲身认识耶和华。
  alternative: 解释为撒母耳对耶和华全然无知，或断定他当时尚未归信。
  rationale: 下半句把“不认识”与“耶和华的话还没有向他显明”并列；这支持启示性相遇的语境，却不足以作出关于他完全无知或属灵状态的教义判断。
- issue: 神名 יהוה 的呈现
  choice: 正文译作“耶和华”，并以脚注说明希伯来文为四字神名 YHWH。
  alternative: 译作“雅威”或以“主”代替神名。
  rationale: “耶和华”是现代简体中文圣经传统中最通行、最易识别的专名形式；脚注使读者知道原文确为神名，同时不把称号混作专名。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“还不……也还没有……”保留两分句的平行关系；不增添原文没有的句首时间词。脚注标记按所解释内容依次置于神名之后。
