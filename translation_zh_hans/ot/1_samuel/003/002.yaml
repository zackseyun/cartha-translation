  text: On that day[a], Eli was lying down in his place, and his eyes had begun to grow dim; he could not see.
translation:
  language: zh_hans
  text: 那一天，以利躺在自己的地方；他的眼睛[a]开始昏花，不能看见。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语为“他的眼”（单数）；此处可集合性地指他的视力，因此译为“他的眼睛”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַּיּוֹם הַהוּא
  choice: 那一天
  rationale: וַיְהִי在这里承担叙事推进和引入场景的作用，不必机械译成“事情发生了”；בַּיּוֹם הַהוּא直译为“那一天”。
- source_word: שֹׁכֵב
  choice: 躺
  rationale: 分词表示以利当时持续处于躺卧状态；现代汉语用“躺”自然简洁。
- source_word: בִּמְקֹמוֹ
  choice: 在自己的地方
  rationale: 保留מָקוֹם“地方”的宽泛含义，不擅自具体化为“房间”或“床上”。
- source_word: וְעֵינוֹ
  choice: 他的眼睛
  rationale: 马所拉文本表面为单数“他的眼睛／眼目”，但可统指视力；汉语“眼睛”本身不显单复数，既自然，也保留原文形式可能具有的集合意义。
- source_word: הֵחֵלּוּ כֵהוֹת
  choice: 开始昏花
  rationale: 表达视力衰退的起始和渐进过程；“眼睛昏花”符合现代汉语习惯。
- source_word: לֹא יוּכַל לִרְאוֹת
  choice: 已经不能看见
  rationale: 直接表达以利当时失去看见能力的实际状态；“已经”使其与前句视力逐渐衰退的语境自然衔接，但不增添因果关系。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。保留“自己的地方”的非特指性，不把地点解释成房间；避免使用较古雅的“眼目昏花”作为正文。脚注标记置于整句末，说明希伯来语单数形式及其集合性理解。
