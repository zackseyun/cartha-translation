base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/005.yaml
  text: He ran to Eli and said, “Here I am, because you called me.” But he said, “I did not call. Go back; lie down.” So he went and lay down.
translation:
  language: zh_hans
  text: 他就跑到以利那里，说：“我在这里，因为你叫我。”以利却说：“我没有叫你。回去躺下吧。”他就回去躺下了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּרָץ
  choice: 他就跑到
  rationale: 保留叙事连续性与动作的急切感；“到以利那里”自然表达希伯来语 אֶל עֵלִי。
- source_word: הִנְנִי
  choice: 我在这里
  rationale: 这是回应呼唤的固定表达，既可表示到场，也含有预备听命之意；此处不额外解释。
- source_word: כִּי קָרָאתָ לִּי
  choice: 是你叫我
  rationale: כִּי 在此说明撒母耳前来的缘由；现代汉语直接引语中译为“是你叫我”自然且忠实，也保留他的判断。
- source_word: שׁוּב שְׁכָב
  choice: 回去躺下吧
  rationale: שׁוּב 在语境中指返回原处，שְׁכָב 是命令式；句末“吧”使汉语命令自然但不过度强硬。
- source_word: וַיֵּלֶךְ וַיִּשְׁכָּב
  choice: 他就回去躺下了
  rationale: 原文直译为“他就去，并躺下”；按汉语语境补明“回去”，准确承接以利的吩咐。
theological_decisions:
- issue: 撒母耳对呼唤者身份的理解
  choice: 译作“是你叫我”，呈现撒母耳确信以利叫他
  alternative: “因为你叫了我”
  rationale: 两者意义接近；所选译法在现代汉语中更自然，同时不预先揭示或解释呼唤者其实是谁，保留叙事张力。
translation_notes:
  register: 采用简洁、庄重而口语自然的现代标准汉语。以“以利却说”明确说话者转换；不添加原文没有的称谓、心理活动或神学解释。
