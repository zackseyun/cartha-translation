  text: וַ/יִּגְדַּ֖ל שְׁמוּאֵ֑ל וַֽ/יהוָה֙ הָיָ֣ה עִמּ֔/וֹ וְ/לֹֽא הִפִּ֥יל מִ/כָּל דְּבָרָ֖י/ו אָֽרְצָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/019.yaml
  text: And Samuel grew[a], and Yahweh was with him and let none of his words fall to the ground.
translation:
  language: zh_hans
  text: 撒母耳渐渐长大，雅威与他同在，不让他所说的话有一句落在地上[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “落在地上”是希伯来语习语，指话语落空或失效。也可译作“没有让他所说的话有一句落空”。
    reason: 说明原文意象的习语含义，并提供不把“话”限缩为预言的自然替代译法。
lexical_decisions:
- source_word: וַיִּגְדַּל
  choice: 渐渐长大
  rationale: גדל在这里描述撒母耳持续成长、成熟；“渐渐长大”自然地表达叙事中的过程，又不把含义局限为身体成长或地位显大。
- source_word: שְׁמוּאֵל
  choice: 撒母耳
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: יְהוָה
  choice: 雅威
  rationale: 原文使用上帝的专名四字神名；“雅威”以现代中文常见形式音译该名，不以称号替代。
- source_word: הָיָה עִמּוֹ
  choice: 与他同在
  rationale: 直接保留希伯来语表达，既指雅威的临在，也在上下文中含有扶持与赐福的意味，但不将这些内涵明说出来。
- source_word: וְלֹא הִפִּיל
  choice: 没有让……落
  rationale: 保留נפל使役形的容许或使役色彩，即雅威没有让撒母耳的话坠落、失效。
- source_word: מִכָּל דְּבָרָיו
  choice: 他的话有一句
  rationale: 在否定句中自然表达“他所有的话没有一句”；保留“话”的宽泛含义，不擅自缩窄为预言或信息。
- source_word: אָרְצָה
  choice: 在地上
  rationale: 保留方向形式“到地上”所构成的希伯来语形象；结合中文句法译作“落在地上”，并用脚注说明其习语含义。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文明确使用上帝的专名。音译为“雅威”保留其专名性质，避免用“主”这一称号取代；“耶和华”是另一种传统音译。
- issue: “不让他的话落在地上”的含义
  choice: 正文保留希伯来语意象，脚注解释为没有落空或未能应验
  alternative: 没有让他的话落空；使他所说的话全都应验
  rationale: 上下文表明撒母耳作为先知的话可靠，但原文采用范围较宽的生动习语。保留该意象，避免把正文直接限定为预言应验，同时借脚注保障现代读者理解。
- issue: 撒母耳“长大”的范围
  choice: 渐渐长大
  alternative: 渐渐长大成人；日益尊大
  rationale: 原文动词可涉及成长与壮大。此处不明确限定为身体成熟或声望提高，因此采用能保留一定含义空间的表达。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准普通话。“渐渐长大”体现叙事进程；“与他同在”保留经文传统而自然的神学表达；正文刻意保留“落在地上”的希伯来语形象，并以脚注消除可能的理解障碍。
