  text: וַ/יֹּ֗אמֶר מָ֤ה הַ/דָּבָר֙ אֲשֶׁ֣ר דִּבֶּ֣ר אֵלֶ֔י/ךָ אַל נָ֥א תְכַחֵ֖ד מִמֶּ֑/נִּי כֹּ֣ה יַעֲשֶׂה לְּ/ךָ֤ אֱלֹהִים֙ וְ/כֹ֣ה יוֹסִ֔יף אִם תְּכַחֵ֤ד מִמֶּ֨/נִּי֙ דָּבָ֔ר מִ/כָּל הַ/דָּבָ֖ר אֲשֶׁר דִּבֶּ֥ר אֵלֶֽי/ךָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/017.yaml
  text: And he said[a], “What is the word that he spoke to you? Please do not hide it from me. May God do so to you, and more also, if you hide from me a word of all the word that he spoke to you.”
translation:
  language: zh_hans
  text: 他说：“他对你说了什么话？请不要向我隐瞒。你若把他对你所说的一切话中任何一句向我隐瞒，愿上帝这样待你，并且更加严厉地待你。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“愿上帝这样待你，并且再加增。”这是起誓时使用的咒诅公式；“这样”所指的灾祸没有明说。
    reason: 说明固定誓言公式，并保留原文不说明具体后果的表达。
lexical_decisions:
- source_word: מָה הַדָּבָר
  choice: 什么话
  rationale: דָּבָר在此既可指“话”也可指“信息”；“什么话”自然保留本段关于神说话的词汇呼应。
- source_word: דִּבֶּר אֵלֶיךָ
  choice: 他对你说
  rationale: 直接表达דבר的说话动作，并与“话”构成自然的汉语搭配。
- source_word: אַל נָא תְכַחֵד מִמֶּנִּי
  choice: 请不要向我隐瞒
  rationale: “隐瞒”准确表达כחד；“请”体现נָא的恳求语气，同时保留以利话语的严厉性。
- source_word: כֹּה יַעֲשֶׂה לְּךָ אֱלֹהִים וְכֹה יוֹסִיף
  choice: 愿上帝重重地惩罚你
  rationale: 这是固定的起誓咒诅公式；按汉语功能表达其未明说具体惩罚、却强调加倍降罚的力量，避免生硬的“如此待你，并且加上”。
- source_word: אִם תְּכַחֵד מִמֶּנִּי דָּבָר מִכָּל הַדָּבָר
  choice: 若他对你所说的一切话，你有一句向我隐瞒
  rationale: “有一句”保留单数דָּבָר及“不许遗漏任何部分”的强调；“一切话”在现代汉语中自然承载集合意义。
theological_decisions:
- issue: 誓言公式中的אֱלֹהִים
  choice: 上帝
  alternative: 众神
  rationale: 上下文是以利指以色列的上帝起誓；此处复数形态按常规希伯来语用法指独一的上帝，不宜译成多神含义。
- issue: 咒诅公式是否补明“惩罚”
  choice: 愿上帝重重地惩罚你
  alternative: 愿上帝这样待你，并且加倍地待你
  rationale: 原文省略具体灾罚，是固定誓言公式。汉语功能性译法补出其咒诅含义但不规定惩罚内容；脚注保留较直译形式。
translation_notes:
  register: 采用现代、庄重而口语自然的叙事语言。以“什么话／所说的一切话／有一句”保留דָּבָר的重复及不得隐瞒任何部分的强调；将希伯来语誓言公式作适度功能性转换，并以脚注提供直译。
