  text: Then Eli called Samuel and said, “Samuel, my son.” And he said, “Here I am.”
translation:
  language: zh_hans
  text: 于是，以利呼唤撒母耳，说：“撒母耳，我儿。”撒母耳说：“我在这里。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: 叫……来
  rationale: קרא在本叙事中表示以利呼叫撒母耳；“叫……来”自然地表达他把撒母耳叫到跟前，又不采用较正式的“召来”。
- source_word: עֵלִי
  choice: 以利
  rationale: 按现代中文圣经人名的通行译法音译。
- source_word: אֶת שְׁמוּאֵל
  choice: 撒母耳
  rationale: אֶת是直接宾语标记，中文不另译；人名采用通行音译。
- source_word: וַיֹּאמֶר
  choice: 说／回答
  rationale: אמר是一般叙事言说动词。第一处译“说”；第二处依对话语境自然译作“回答”，不改变其基本含义。
- source_word: שְׁמוּאֵל בְּנִי
  choice: 撒母耳，我儿
  rationale: בְּנִי直译为“我儿”，既保留亲切而有长幼关系的称呼，也避免把它解释成生身父子关系。
- source_word: הִנְנִי
  choice: 我在这里
  rationale: 这是希伯来语中表示人在场并愿意听命的惯用回答；“我在这里”在现代中文中清楚自然，同时保留原文的应答形式。
- source_word: וַ
  choice: 于是
  rationale: 首个叙事连接词推动事件进展，译为“于是”体现承接次序；其余连接关系按自然中文句法处理。
