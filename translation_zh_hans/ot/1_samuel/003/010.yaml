source:
  edition: WLC
  text: וַ/יָּבֹ֤א יְהוָה֙ וַ/יִּתְיַצַּ֔ב וַ/יִּקְרָ֥א כְ/פַֽעַם בְּ/פַ֖עַם שְׁמוּאֵ֣ל שְׁמוּאֵ֑ל וַ/יֹּ֤אמֶר שְׁמוּאֵל֙ דַּבֵּ֔ר כִּ֥י שֹׁמֵ֖עַ עַבְדֶּֽ/ךָ־׀׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/010.yaml
  text: Then Yahweh came and stood there[a], and called as at the other times, “Samuel, Samuel!” And Samuel said, “Speak, for your servant is listening.”
translation:
  language: zh_hans
  text: 耶和华来，站在那里，又像前几次一样[a]呼唤：“撒母耳！撒母耳！”撒母耳说：“请说，因为你的仆人正在听。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“像先前一样”。希伯来语习语直译近于“像一次又一次那样”，是把这次呼唤与此前几次相比。
    reason: 说明希伯来语重复式习语的字面形式及自然译法。
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神圣名号译法，明确对应希伯来文四字神名，而不以泛称“主”取代。
- source_word: וַיָּבֹא
  choice: 来
  rationale: בוא在此直接表示来到；“来”简洁自然，符合叙事语体。
- source_word: וַיִּתְיַצַּב
  choice: 站在那里
  rationale: התפעל词形表达站定、就位；保留具体的临在与姿态，不弱化为抽象的“显现”。
- source_word: וַיִּקְרָא
  choice: 呼唤
  rationale: קרא在此指用声音叫撒母耳；“呼唤”既自然，又不夸大为高声喊叫。
- source_word: כְפַעַם בְּפַעַם
  choice: 像前几次一样
  rationale: 该习语把这次呼唤与此前接连发生的呼唤相比较；此译在现代汉语中清楚自然，同时保留比较关系。
- source_word: שְׁמוּאֵל שְׁמוּאֵל
  choice: 撒母耳！撒母耳！
  rationale: 完整保留名字的重复，体现直接而郑重的个人召唤。
- source_word: דַּבֵּר
  choice: 请说
  rationale: 命令式本义为“说”；汉语中加“请”自然体现撒母耳恭敬回应的语境，并未改变命令内容。
- source_word: כִּי
  choice: 因为
  rationale: כִּי在此引出撒母耳请求对方说话的理由；“因为”清楚保留解释关系。
- source_word: שֹׁמֵעַ
  choice: 正在听
  rationale: 分词表达持续、专注的聆听状态；“正在听”比单纯“听见”更能体现预备领受话语。
- source_word: עַבְדֶּךָ
  choice: 你的仆人
  rationale: עבד在此是谦卑、自我降服的敬称；“仆人”符合语境，也避免“奴隶”在现代汉语中不合语境的联想。
theological_decisions:
- issue: 耶和华临在的拟人化叙述
  choice: 保留“来，站在那里”的具体措辞
  alternative: 弱化为“显现”或“临在”
  rationale: 希伯来文以鲜明、具体的动作叙述耶和华来到并站定。译文不因神学上的不适而将其抽象化。
- issue: 神圣名字יְהוָה的译法
  choice: 耶和华
  alternative: 雅威；主
  rationale: “耶和华”是现代中文读者广泛识别的专名形式，能够与一般称号“主”区分；正文不借此裁定该名字古代发音的全部细节。
- issue: 撒母耳回应中的聆听含义
  choice: 译作“正在听”
  alternative: 译作“听见”或扩展为“听从”
  rationale: שׁמע可涵盖听见与顺从，但此处的分词首先描写专心聆听。正文不提前把潜在的顺从含义完全明说，以保留词义张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。叙事动词简洁直接；对话保留名字重复及撒母耳自称“你的仆人”的谦恭语气。
