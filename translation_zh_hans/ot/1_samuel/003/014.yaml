  text: וְ/לָ/כֵ֥ן נִשְׁבַּ֖עְתִּי לְ/בֵ֣ית עֵלִ֑י אִֽם יִתְכַּפֵּ֞ר עֲוֺ֧ן בֵּית עֵלִ֛י בְּ/זֶ֥בַח וּ/בְ/מִנְחָ֖ה עַד עוֹלָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/014.yaml
  text: 'Therefore I have sworn to the house of Eli: the iniquity of Eli’s house shall never be atoned for by sacrifice or offering[a][b].'
translation:
  language: zh_hans
  text: 所以，论到以利家，我已经起誓：以利家的罪孽永远不能借着祭牲或供物得到赎除[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“以利家的罪孽必不借祭牲或供物得到赎除。”希伯来文在“我已经起誓”之后用“若”构成否定誓言格式，表达强烈否定。
    reason: lexical_alternative
  - marker: b
    text: “供物”所译的希伯来词מִנְחָה，在祭祀语境中常特指“素祭”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָכֵן
  choice: 所以
  rationale: 承接上文的审判宣告并引出其结果；“所以”自然清楚，同时保留推论关系。
- source_word: נִשְׁבַּעְתִּי
  choice: 我……起誓
  rationale: 该完成式表达已经立下、持续有效的庄严誓言；现代汉语中“起誓”准确而庄重。
- source_word: לְבֵית עֵלִי
  choice: 向以利家
  rationale: לְ标示誓言所针对的对象；“向以利家起誓”贴近原文结构，誓言的不利内容由后句表明。
- source_word: אִם
  choice: 不能
  rationale: 在起誓动词之后，אִם属于否定誓言公式，表达强烈否定，不按字面译作“如果”。
- source_word: יִתְכַּפֵּר
  choice: 得以赎除
  rationale: 该形式在此指罪责得到遮盖或除去；“赎除”保留祭祀与赎罪语境，又比生硬的被动表达更合乎现代汉语。
- source_word: עֲוֺן
  choice: 罪孽
  rationale: עָוֹן兼含罪行及其罪责；“罪孽”保留其严重性，并适合司法—祭祀语境。
- source_word: בֵּית עֵלִי
  choice: 以利家
  rationale: 既可指以利的家族，也可涵盖其家室；简洁保留“家”的群体含义。
- source_word: בְּזֶבַח
  choice: 靠献祭
  rationale: בְּ在此表示手段；“靠”清楚表明献祭无法成为除罪的途径。
- source_word: וּבְמִנְחָה
  choice: 或供物
  rationale: מִנְחָה在祭祀语境中常特指素祭，但也可较广义地指供物；正文采用较宽且自然的“供物”，脚注保留具体译法。
- source_word: עַד עוֹלָם
  choice: 永远不能
  rationale: 在否定誓言中强调永久不得赎除；汉语以“永远不能”自然表达其绝对、持续的否定。
theological_decisions:
- issue: 对以利家的审判范围
  choice: 明确宣告以利家的罪孽永远不能靠献祭或供物赎除。
  alternative: 将经文理解为只排除这里列举的祭祀手段，而不对上帝是否可能以其他方式施怜悯作出断言。
  rationale: 原文明确否定祭牲和供物能够为这罪孽成就赎除。译文保留这一严厉宣告，但不把它扩展为经文本身没有明说的普遍教义结论。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“向……起誓”保留原文誓言结构；“永远不能……得以赎除”传达否定誓言及 עַד עוֹלָם 的永久性。“献祭或供物”保持两个祭祀术语的区分，并以脚注说明 מִנְחָה 的较具体含义。
