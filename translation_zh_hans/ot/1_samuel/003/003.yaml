  yaml_path: translation/ot/1_samuel/003/003.yaml
  text: And the lamp of God had not yet gone out[a], and Samuel was lying down in the temple of Yahweh, where the ark of God was.
translation:
  language: zh_hans
  text: 上帝的灯还没有熄灭，撒母耳正躺卧在雅威的殿[a]里，那里有上帝的约柜。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“雅威的圣所”。希伯来语 הֵיכָל 可指神殿或圣所；这里指雅威在示罗的居所。
    reason: lexical_alternative
lexical_decisions:
- source_word: נֵר אֱלֹהִים
  choice: 上帝的灯
  rationale: נֵר具体指“灯”，而非泛指“光”；属格结构直译为“上帝的灯”，保留其与圣所敬拜相关的意味。
- source_word: טֶרֶם יִכְבֶּה
  choice: 还没有熄灭
  rationale: טֶרֶם表示动作尚未发生或完成；灯“熄灭”是符合现代汉语习惯的表达，也保留了时间含义。
- source_word: שֹׁכֵב
  choice: 正躺
  rationale: 分词描述撒母耳当时躺卧的状态；不译作“睡着”，以免加入原文未明确表达的信息。
- source_word: הֵיכַל יְהוָה
  choice: 雅威的殿
  rationale: הֵיכָל可指宫殿、神殿或圣所；此处为敬拜场所，译作“殿”自然简洁，同时用脚注保留“圣所”这一合适的译法，并避免把示罗的场所直接等同于后来所罗门建造的圣殿。
- source_word: יְהוָה
  choice: 雅威
  rationale: 采用神圣四字名的音译，保留这是以色列上帝专名的性质，而不以称号替代。
- source_word: אֲשֶׁר שָׁם אֲרוֹן אֱלֹהִים
  choice: 上帝的约柜就在那里
  rationale: אֲשֶׁר שָׁם构成地点关系从句；在汉语中另成短句更自然，也清楚表明约柜位于该处。אֲרוֹן在此按其宗教语境译为惯用词“约柜”。
theological_decisions:
- issue: 王国建立前的示罗敬拜场所中，הֵיכַל יְהוָה应如何表达
  choice: 雅威的殿
  alternative: 雅威的圣所
  rationale: “殿”符合הֵיכָל的词义和敬拜语境，但这里并非后来所罗门所建的圣殿；因此脚注保留“圣所”，以防读者产生时代错置的理解。
- issue: 撒母耳躺卧地点与约柜位置之间的空间关系
  choice: 保留原文概括性的地点表达，不进一步说明撒母耳是否进入至圣区域
  alternative: 通过增词把撒母耳安置在圣所旁边或外部
  rationale: 原文只说他躺在雅威的הֵיכָל中，并以约柜在那里界定该地点；译文不加入原文没有说明的建筑分区，以保留其概括性和可能的张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“正躺”体现分词所描写的持续状态；分号使地点关系清晰，又不改变原文信息次序。
