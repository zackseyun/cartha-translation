base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/018.yaml
  text: So Samuel told him all the words and hid nothing from him[a]. And he said, “He is Yahweh[b]; let him do what is good in his eyes.”
translation:
  language: zh_hans
  text: 于是，撒母耳把这一切话都告诉了以利，毫不向他隐瞒。以利说：“他是雅威；愿他照自己眼中看为好的[b]去行[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他必会照自己眼中看为好的去行。”希伯来语未完成式在这里既可理解为顺服的容许或祈愿语气，也可理解为对将来的陈述。
    reason: 保留יַעֲשֶׂה在此处可作容许/祈愿式或将来陈述的语气歧义。
  - marker: b
    text: “自己眼中看为好的”是希伯来语惯用表达，意思是按他自己的判断认为好的。
    reason: 说明原文בְּעֵינָיו的评价性惯用表达，并对应正文中的保留译法。
lexical_decisions:
- source_word: וַיַּגֶּד לוֹ שְׁמוּאֵל
  choice: 撒母耳把……告诉了以利
  rationale: נגד 的使役词干在这里表示“告诉、使人知道”；按上下文明确代词所指为以利，使中文自然清楚。
- source_word: אֶת כָּל הַדְּבָרִים
  choice: 这一切话
  rationale: דְּבָרִים 可指“话”或“事情”；这里所指是雅威先前传达的信息，译作“这一切话”既贴近原文，也保留话语性质。
- source_word: וְלֹא כִחֵד מִמֶּנּוּ
  choice: 毫不向他隐瞒
  rationale: כחד 表示隐藏或扣留信息；“毫不……隐瞒”传达撒母耳没有保留任何内容。
- source_word: יְהוָה הוּא
  choice: 他是雅威
  rationale: 保留神名“雅威”，并尽量维持独立代词 הוּא 所带的强调；不以称号替换专名。
- source_word: הַטּוֹב בְּעֵינָיו
  choice: 他自己眼中看为好的
  rationale: 保留“在他眼中”的希伯来表达，同时用“看为好”使现代中文读者容易理解其评价含义。
- source_word: יַעֲשֶׂה
  choice: 就让他去做吧
  rationale: 未完成式在此语境中可带有容许、顺服的语气；此译体现以利对所宣告之事的接受，同时以脚注保留直陈将来时的可能。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名，音译为“雅威”可保留其作为以色列之神专名的性质，而不以称号代替。
- issue: 以利末句中 יַעֲשֶׂה 的语气
  choice: 顺服、容许式：“就让他去做吧”
  alternative: 直陈将来式：“他必会去做”
  rationale: 上下文倾向于以利顺服地接受审判，但希伯来语未完成式本身也容许将来陈述；正文采用较符合语境的读法，脚注保留另一可能。
- issue: “他眼中看为好”的神学张力
  choice: 保留原文评价视角，不改写为“公义”或“合宜”
  alternative: 他认为正确的；他所喜悦的
  rationale: 原文使用“好”及“在他眼中”的惯用语。直译式表达既呈现神的判断权，也不额外加入原文没有的神学限定。
translation_notes:
  register: 采用现代、庄重而通顺的叙事语言。“这一切话”“毫不向他隐瞒”适合普通读者；末句保留“眼中看为好”的原文色彩，并借脚注解释其惯用意义及动词语气的歧义。
