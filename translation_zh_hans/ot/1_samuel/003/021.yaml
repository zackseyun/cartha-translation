  text: וַ/יֹּ֥סֶף יְהוָ֖ה לְ/הֵרָאֹ֣ה בְ/שִׁלֹ֑ה כִּֽי נִגְלָ֨ה יְהוָ֧ה אֶל שְׁמוּאֵ֛ל בְּ/שִׁל֖וֹ בִּ/דְבַ֥ר יְהוָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/021.yaml
  text: And Yahweh continued to appear at Shiloh[a], for Yahweh revealed himself to Samuel at Shiloh by the word of Yahweh.
translation:
  language: zh_hans
  text: 耶和华继续在示罗显现，因为耶和华在示罗借着耶和华的话〔a〕向撒母耳显明自己。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּסֶף
  choice: 继续
  rationale: יָסַף与不定式连用，可表示动作继续或再次发生；此处“继续”自然地表达反复显现。
- source_word: לְהֵרָאֹה
  choice: 显现
  rationale: ראה的尼法勒式在此指可感知的神圣显现；“显现”庄重、自然，也不限定显现的具体方式。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经语境中通行的专名形式，保留四字神名作为名字，而不以称号替代。
- source_word: בְשִׁלֹה / בְשִׁלוֹ
  choice: 在示罗
  rationale: 介词ב在两处均表地点；“在示罗”是自然、准确的现代汉语表达。
- source_word: כִּי
  choice: 因为
  rationale: כִּי在此引出前句所述情况的原因或根据，“因为”清楚保留解释关系。
- source_word: נִגְלָה
  choice: 显明自己
  rationale: גלה的尼法勒式在此表达自我启示。译作“显明自己”既与前面的“显现”有所区别，也保留主动自我揭示的含义。
- source_word: אֶל שְׁמוּאֵל
  choice: 向撒母耳
  rationale: אֶל表示显明所朝向或临到的对象，汉语用“向撒母耳”最为自然。
- source_word: בִּדְבַר יְהוָה
  choice: 借着耶和华的话
  rationale: 介词ב可表达媒介或方式；“借着”保留神的话作为启示媒介的含义，同时不排除“以……的话”的紧密关联。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。正文保留专名，并采用现代中文读者最熟悉且庄重的“耶和华”，不以“主”等称号替换。
- issue: 神显现的性质
  choice: 同时保留“显现”与“借着话显明自己”
  alternative: 将其具体解释为纯粹异象或有形的神显
  rationale: 原文同时使用ראה与גלה，并指出启示与耶和华的话有关，却没有进一步说明显现的确切形态；译文不替原文解决这一张力。
- issue: בִּדְבַר יְהוָה的关系
  choice: 理解为启示的媒介：“借着耶和华的话”
  alternative: 理解为较宽泛的伴随或领域关系：“在耶和华的话中”
  rationale: 工具或媒介义最符合语境，但介词ב本身有一定弹性；译文采用自然的媒介表达，不作超出原文的教义发挥。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。保留原文两次“耶和华”和两次“示罗”的重复，以呈现希伯来文的强调与节奏；不为追求简洁而合并。
