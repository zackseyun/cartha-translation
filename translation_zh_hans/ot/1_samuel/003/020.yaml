  text: וַ/יֵּ֨דַע֙ כָּל יִשְׂרָאֵ֔ל מִ/דָּ֖ן וְ/עַד בְּאֵ֣ר שָׁ֑בַע כִּ֚י נֶאֱמָ֣ן שְׁמוּאֵ֔ל לְ/נָבִ֖יא לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/020.yaml
  text: And all Israel from Dan to Beer-sheba knew that Samuel was established as a prophet of Yahweh[a].
translation:
  language: zh_hans
  text: 从但到别是巴，全以色列人都知道撒母耳已被确立为雅威的先知[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“撒母耳作为雅威的先知是可靠的。”这里的希伯来词也可表示“坚立”或“得到证实”。
    reason: 保留 נֶאֱמָן 在“可靠”与“被确立、得到证实”之间的词义张力。
lexical_decisions:
- source_word: וַיֵּדַע
  choice: 都知道
  rationale: 该动词在这里表示以色列众人认识到并承认随后所述的事实；“知道”简洁自然，“都”与主语“全以色列”相呼应。
- source_word: כָּל יִשְׂרָאֵל
  choice: 全以色列
  rationale: 保留希伯来文的民族整体称谓，既凝练，也符合现代中文圣经叙事的庄重语体。
- source_word: מִדָּן וְעַד בְּאֵר שָׁבַע
  choice: 从但到别是巴
  rationale: 直译地理首尾语，指以色列全境；保留地名及原文修辞，不在正文中改写为“全国各地”。
- source_word: כִּי
  choice: （引出“知道”的内容）
  rationale: 中文不必另译“那/即”，由逗号后宾语分句自然表达其补语功能。
- source_word: נֶאֱמָן
  choice: 已被确立
  rationale: אמן 的尼法勒分词可表示可靠、坚立或得到证实。结合上一节所说撒母耳的话无一句落空，这里主要表达他的先知身份已得到证实和公认；“被确立”也保留状态已经形成的意味。
- source_word: לְנָבִיא
  choice: 为……先知
  rationale: 介词 לְ 在此标示身份或职分；中文“被确立为……先知”自然表达这一关系。
- source_word: לַיהוָה
  choice: 雅威的
  rationale: 将四字神名 יהוה 音译为“雅威”，并以“的”自然表达撒母耳属于雅威、受雅威差遣的先知这一关系。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”作为音译保留其专名性质，不以称号替代。
- issue: נֶאֱמָן 所表达的先知身份
  choice: 已被确立为先知
  alternative: 是可信可靠的先知／被证实为先知
  rationale: 上下文强调雅威使撒母耳的话应验，因此全国确认其先知身份；正文采用“被确立”兼顾身份得到证实与稳固成立的含义，同时用脚注保留“可靠”的词义可能。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。保留“从但到别是巴”这一传统地理首尾语，并在正文中使用神名“雅威”。
