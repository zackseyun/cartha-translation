base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/027/008.yaml
  text: Then David and his men went up and made raids against the Geshurites[a], the Girzites, and the Amalekites, for these were the inhabitants of the land from ancient times, as you go to Shur[b], even to the land of Egypt.
translation:
  language: zh_hans
  text: 大卫和跟随他的人上去，袭击基述人、基色人[a]和亚玛力人。这些民族自古以来就住在那地，从往书珥去的地方[b]，直到埃及地。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这个希伯来族名的读法和译法并不确定；也可按不同转写译作“基尔洗人”等。
    reason: lexical_alternative
  - marker: b
    text: 或译“往书珥去，直到埃及地”。这是一种标示地理范围的惯用表达。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: 上去
  rationale: 保留עלה在叙事中通常表示“上去”的方向含义，不笼统改作“出发”。
- source_word: וַיִּפְשְׁטוּ אֶל
  choice: 袭击
  rationale: פשט在军事语境中指突袭、劫掠；与表示目标的אֶל合译为自然的现代汉语“袭击”。
- source_word: הַגְּשׁוּרִי
  choice: 基述人
  rationale: 按希伯来语族名音译，并用“人”表示族群。
- source_word: הגרזי
  choice: 基利洗人
  rationale: 按所给辅音文本גרזי处理为族名；其具体读法及与传统译名的对应并不确定，故加注说明。
- source_word: הָעֲמָלֵקִי
  choice: 亚玛力人
  rationale: 采用现代中文圣经语境中通行的族名。
- source_word: כִּי הֵנָּה יֹשְׁבוֹת הָאָרֶץ
  choice: 这些民族……住在那地
  rationale: 阴性复数代词和分词很可能以若干族群为集合性先行词；补出“民族”使现代汉语清楚，并保留“这些”的指示意味。
- source_word: מֵעוֹלָם
  choice: 自古以来
  rationale: 这里表示从久远的过去开始，并非形而上的“永远”。
- source_word: בּוֹאֲךָ שׁוּרָה
  choice: 从通往书珥的地方
  rationale: 这是地理范围表达；将第二人称单数的惯用说法自然化为汉语，但不把边界关系解释得过细。
- source_word: וְעַד אֶרֶץ מִצְרָיִם
  choice: 直到埃及地
  rationale: עד标明地域延伸的终点；“埃及地”保留אֶרֶץ的明示用词。
