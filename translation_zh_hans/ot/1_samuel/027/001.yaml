  text: וַ/יֹּ֤אמֶר דָּוִד֙ אֶל לִבּ֔/וֹ עַתָּ֛ה אֶסָּפֶ֥ה יוֹם אֶחָ֖ד בְּ/יַד שָׁא֑וּל אֵֽין לִ֨/י ט֜וֹב כִּ֣י הִמָּלֵ֥ט אִמָּלֵ֣ט אֶל אֶ֣רֶץ פְּלִשְׁתִּ֗ים וְ/נוֹאַ֨שׁ מִמֶּ֤/נִּי שָׁאוּל֙ לְ/בַקְשֵׁ֤/נִי עוֹד֙ בְּ/כָל גְּב֣וּל יִשְׂרָאֵ֔ל וְ/נִמְלַטְתִּ֖י מִ/יָּדֽ/וֹ־־־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/027/001.yaml
  text: Then David said in his heart[a], “Now I will one day perish by the hand of Saul. There is nothing better for me than that I should surely escape to the land of the Philistines. Then Saul will despair of seeking me any longer in all the territory of Israel[c][b], and I will escape from his hand.”
translation:
  language: zh_hans
  text: 大卫心里想[a]：“总有一天，我会死在扫罗手里。对我来说，没有什么比逃到非利士人的地去[b]更好了。这样，扫罗就会死心，不再在以色列全境寻找我，我就能逃脱他的手。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“大卫对自己说。”原文是“对他的心说”，表示内心自语。
    reason: lexical_alternative
  - marker: b
    text: 原文“逃，我必逃”，以同一词根的绝对不定式加强语气，可理解为“我一定要逃到非利士人的地去”。
    reason: lexical_emphasis
lexical_decisions:
- source_word: אֶל־לִבּוֹ
  choice: 心里想
  rationale: 这是表示内心自语或思量的希伯来语习语；“心里想”既保留“心”的意象，也符合现代汉语表达。
- source_word: אֶסָּפֶה
  choice: 我会死
  rationale: 此处尼法勒式表示被除灭、丧命；在扫罗追杀的语境中，“死”自然准确，而“被卷走”在汉语中容易造成不必要的字面联想。
- source_word: יוֹם אֶחָד
  choice: 总有一天
  rationale: 表达将来某个不确定的日子；“总有一天”也传达大卫认为此事迟早会发生的语气。
- source_word: בְּיַד שָׁאוּל
  choice: 在扫罗手里
  rationale: 保留“手”的原文意象，表示落入扫罗的权势并因他而死；现代汉语中自然可懂。
- source_word: אֵין לִי טוֹב כִּי
  choice: 对我来说，没有什么比……更好了
  rationale: 贴近原文的比较结构，并保留大卫对自身处境所作的判断。
- source_word: הִמָּלֵט אִמָּלֵט
  choice: 逃到
  rationale: 原文以绝对不定式加强限定动词，强调逃离这一行动；汉语借整个“没有什么比逃到……更好了”的句式自然体现其坚决意味，脚注补明原文强调形式。
- source_word: אֶל אֶרֶץ פְּלִשְׁתִּים
  choice: 到非利士人的地去
  rationale: 直接呈现原文地理表达，避免把它过度规范化为后来的专名。
- source_word: וְנוֹאַשׁ מִמֶּנִּי שָׁאוּל
  choice: 扫罗就会死心
  rationale: יאשׁ 表示绝望、放弃希望；结合下文追寻之事，“死心”是现代汉语中准确而自然的对应。
- source_word: לְבַקְשֵׁנִי עוֹד
  choice: 不再……寻找我
  rationale: עוֹד 在此表示持续或再次进行的追寻停止；“不再”清楚表达这一点。
- source_word: בְּכָל גְּבוּל יִשְׂרָאֵל
  choice: 在以色列全境
  rationale: גְּבוּל 此处指疆域、领土范围，而非仅指边界线；“全境”简洁自然。
- source_word: וְנִמְלַטְתִּי מִיָּדוֹ
  choice: 我也能逃脱他的手
  rationale: 保留“逃脱”与前句的词根呼应，也保留“手”所象征的权势和控制。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。保留“心”和“手”的希伯来语意象；“死心”“全境”则按现代标准汉语自然表达。脚注标记均置于正文相关位置。
