base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/027/011.yaml
  text: David left alive neither man nor woman to bring to Gath[a], saying, “Otherwise they might report about us, saying, ‘This is what David did[b], and this was his practice all the days that he lived in the country of the Philistines.’”
translation:
  language: zh_hans
  text: 大卫无论男女，一个活口也不留，以免有人被带到迦特；他心想：“免得他们把我们的事报告出去，说：‘大卫就是这样做的；他住在非利士人的境内[b]期间，一向如此行事[a]。’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “一向如此行事”也可译作“这就是他的惯例”或“这就是他一贯的做法”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译为“在非利士人的田野”，是指非利士人的地域或乡野。
    reason: cultural_note
lexical_decisions:
- source_word: וְאִישׁ וְאִשָּׁה לֹא יְחַיֶּה
  choice: 无论男女，一个也不留活口
  rationale: 希伯来文以单数的“男人和女人”作周遍性表达；译文既保留“不留活口”的含义，也清楚表达无一幸免。
- source_word: לְהָבִיא גַת
  choice: 带到迦特
  rationale: 不定式表示目的；原文未明说宾语，中文承接前面的“一个”即可，不额外补入解释性内容。
- source_word: לֵאמֹר פֶּן יַגִּדוּ עָלֵינוּ
  choice: 他心想：‘免得他们告发我们’
  rationale: לֵאמֹר按字面为“说”，这里引出大卫不留活口的理由；现代中文用“心想”自然地表达内在盘算。יַגִּדוּ עָלֵינוּ指把有关大卫及其部下的事报告出去；“告发我们”保留其对他们不利的语境色彩。
- source_word: כֹּה עָשָׂה דָוִד
  choice: 大卫做了这样的事
  rationale: 保留כֹּה的指示作用，让幸存者可能作出的报告以直接引语呈现。
- source_word: וְכֹה מִשְׁפָּטוֹ
  choice: 一向都是这样行事
  rationale: מִשְׁפָּט在此不是司法意义的“审判”，而是惯常做法或行为方式；译文避免把语义过窄地固定为正式规条。
- source_word: כָּל הַיָּמִים אֲשֶׁר יָשַׁב
  choice: 他住……时，一向
  rationale: 用自然现代汉语表达“大卫居住期间的所有日子”这一持续时间。
- source_word: בִּשְׂדֵה פְלִשְׁתִּים
  choice: 在非利士人的境内
  rationale: שָׂדֶה字面是“田野”，此处为地域用法，指非利士人的地区或疆域。
