revisions:
- from: 大卫无论男女，一个也不留活口带到迦特。他心想：“免得他们告发我们，说：‘大卫做了这样的事；他住在非利士人的境内[b]时，一向都是这样行事[a]。’”
  to: 大卫无论男女，一个活口也不留，以免有人被带到迦特；他心想：“免得他们把我们的事报告出去，说：‘大卫就是这样做的；他住在非利士人的境内[b]期间，一向如此行事[a]。’”
  rationale: 修订首句以消除现代汉语中不定式结构的歧义，并保留原文未明示“带到迦特”施事者的特点。将“告发”改为“把我们的事报告出去”，避免加入原文未明确的法律性指控语气；其余保留原译的地名、地域义和惯常行为之意。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T05:26:50Z'
