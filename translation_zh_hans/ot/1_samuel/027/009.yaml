  text: וְ/הִכָּ֤ה דָוִד֙ אֶת הָ/אָ֔רֶץ וְ/לֹ֥א יְחַיֶּ֖ה אִ֣ישׁ וְ/אִשָּׁ֑ה וְ/לָקַח֩ צֹ֨אן וּ/בָקָ֜ר וַ/חֲמֹרִ֤ים וּ/גְמַלִּים֙ וּ/בְגָדִ֔ים וַ/יָּ֖שָׁב וַ/יָּבֹ֥א אֶל אָכִֽישׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/027/009.yaml
  text: David struck the land and left alive neither man nor woman[a], and he took sheep, cattle, donkeys, camels, and clothing. Then he returned and came to Achish.
translation:
  language: zh_hans
  text: 大卫攻打那地，不让任何男人或女人活下来[a]；他又夺走羊群、牛群、驴、骆驼和衣物。随后，他返回后，来到亚吉那里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“没有让一个男人或一个女人活着留下。”
    reason: 保留 חיה 使役形“使存活／留下活口”的另一种自然表达。
lexical_decisions:
- source_word: וְהִכָּה
  choice: 攻打
  rationale: נכה 的使役形在此军事语境中表示攻击、击杀；“攻打”自然明确，又不额外渲染细节。
- source_word: הָאָרֶץ
  choice: 那地
  rationale: 这里指受袭群体居住的地域；“那地”贴近原文，也符合上下文的叙事指称。
- source_word: וְלֹא יְחַיֶּה אִישׁ וְאִשָּׁה
  choice: 不让任何男人或女人活下来
  rationale: חיה 的使役形意为“使存活、让……活着”；此译直陈大卫没有留下男女幸存者，并保留原文明确列举两性的表达。
- source_word: וְלָקַח
  choice: 夺走
  rationale: לקח 基本义为“拿、取”；在军事劫掠语境中译作“夺走”能自然传达语境含义，而不增加原文没有说明的方式。
- source_word: צֹאן
  choice: 羊群
  rationale: צֹאן 是集合名词，可指绵羊、山羊等小型牲畜；“羊群”比单说“羊”更能体现其集合性质，同时保持通俗。
- source_word: בָקָר
  choice: 牛群
  rationale: בָקָר 泛指牛类牲畜，作为集合名词译为“牛群”与“羊群”相称。
- source_word: חֲמֹרִים
  choice: 驴
  rationale: 现代汉语中直接、自然的对应词。
- source_word: גְמַלִּים
  choice: 骆驼
  rationale: 直接对应原词，清楚自然。
- source_word: בְגָדִים
  choice: 衣物
  rationale: 在战利品清单中，“衣物”自然且庄重，比“衣服”稍正式，又不显古旧。
- source_word: וַיָּשָׁב וַיָּבֹא אֶל אָכִישׁ
  choice: 随后，他返回亚吉那里
  rationale: 两个连续动词表达他从袭击地返回并来到亚吉处；汉语用“返回……那里”可自然承载这一复合移动，不显生硬重复。
- source_word: אָכִישׁ
  choice: 亚吉
  rationale: 采用现代中文圣经人名的通行音译。
theological_decisions:
- issue: 如何呈现大卫的暴力行动
  choice: 直译为攻打，并明确说不让任何男人或女人活下来
  alternative: 用委婉措辞淡化杀戮，或扩写成带有评价色彩的“屠杀”
  rationale: 原文以冷峻的叙事语言记述致命袭击和掠夺。译文既不应掩饰其暴力，也不应加入原文未明说的道德评断或煽情色彩。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“不让任何男人或女人活下来”保留原文的两性并列表达和严酷语气；分号使袭击、杀戮与夺取财物的叙事层次清楚。
