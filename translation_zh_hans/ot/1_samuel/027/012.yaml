base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/027/012.yaml
  text: And Achish trusted David[a], saying, “He has surely made himself stink among his people in Israel[b], so he will be my servant forever.”
translation:
  language: zh_hans
  text: 亚吉信任大卫，说：“他实在已经使自己在本族以色列人中臭不可闻了[a]，这样，他就会永远作我的仆人[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译为“使自己发臭”。这是一个惯用说法，意思是使自己变得可憎、令人厌恶。
    reason: lexical_alternative
  - marker: b
    text: “仆人”也可译作“奴隶”；这里更可能侧重长期隶属并效忠亚吉，而不是强调被当作财产的身份。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּאֲמֵן
  choice: 信任
  rationale: 使役词干的 אמן 与介词 ב 连用，表示对某人有信心；此处译作“信任”比偏重认知判断的“相信”更符合人际语境。
- source_word: לֵאמֹר
  choice: 说
  rationale: 保留希伯来语常见的引语引介形式；上下文可能是亚吉心中的判断，但原文并未明确限定为内心思想。
- source_word: הַבְאֵשׁ הִבְאִישׁ
  choice: 实在已经……臭不可闻了
  rationale: 不定式绝对式与限定动词连用，具有加强语气的作用。“臭不可闻”既保留 באש 的“发臭”意象，也自然表达在群体中变得可憎、令人厌恶的惯用含义。
- source_word: בְּעַמּוֹ בְיִשְׂרָאֵל
  choice: 在自己的以色列同胞中
  rationale: 将“他的人民”和“以色列”自然合并为现代汉语表达，保留大卫在本族群体中遭到厌弃这一关系。
- source_word: וְהָיָה לִי
  choice: 这样，他就会……作我的
  rationale: 此处的连接形式表达亚吉从前述判断推导出的结果，“这样……就……”自然呈现其因果推论。
- source_word: לְעֶבֶד
  choice: 仆人
  rationale: עבד 可指仆人或奴隶；本处重点是亚吉所期待的长期隶属和效忠关系，并未特别强调作为财产的身份，因此正文采用“仆人”。
- source_word: עוֹלָם
  choice: 永远
  rationale: 表达持续到不可限定之将来的长久状态；“永远”简洁地传达亚吉所期待的永久效忠。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“臭不可闻”保留原文鲜明的嗅觉隐喻，同时在现代汉语中可自然表达名声败坏、遭人厌恶。引语用“说”而不用“心想”，以免把原文可兼指言说或思想的形式限定为内心独白。
