base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/027/003.yaml
  text: So David stayed with Achish in Gath[a], he and his men, each man with his household—David with his two wives, Ahinoam the Jezreelite and Abigail[b], the wife of Nabal the Carmelite.
translation:
  language: zh_hans
  text: 于是，大卫和跟随他的人住在迦特，与亚吉同在[a]；各人都带着自己的家眷[b]。大卫带着他的两个妻子：来自耶斯列的亚希暖，以及拿八的妻子、来自迦密的亚比该。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“留在迦特，与亚吉同在”。希伯来语动词既可指居住，也可指暂时停留。
    reason: lexical_alternative
  - marker: b
    text: 直译“各人和他的家”；这是逐一分配的表达，意思是每个人都带着自己家里的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: 住在
  rationale: ישׁב可表示居住、停留或住下；此处指大卫一行在亚吉那里居留一段时间。“住在”自然稳妥，又不必然表示永久定居。
- source_word: עִם אָכִישׁ בְּגַת
  choice: 住在迦特的亚吉那里
  rationale: עִם表示与亚吉同在或在其辖下，בְּגַת标明地点；这样译符合现代汉语地点结构。
- source_word: הוּא וַאֲנָשָׁיו
  choice: 大卫和跟随他的人
  rationale: 原文直译为“他和他的人”。叙事中指跟随大卫的一班人；此译比“士兵”少一层限定，也比直译更自然。
- source_word: אִישׁ וּבֵיתוֹ
  choice: 各人都带着自己的家眷
  rationale: אִישׁ在这里作逐一分配用法，בַּיִת指一家的人而非房屋。“家眷”准确表达同行的家庭成员。
- source_word: וּשְׁתֵּי נָשָׁיו
  choice: 大卫带着他的两个妻子
  rationale: 该短语具体说明大卫自己的家眷；补出“大卫带着”可使汉语层次清楚。
- source_word: הַיִּזְרְעֵאלִית
  choice: 耶斯列女子
  rationale: 阴性族称表明亚希暖来自耶斯列；“耶斯列女子”既保留来源信息，又符合现代汉语。
- source_word: אֵשֶׁת נָבָל הַכַּרְמְלִית
  choice: 迦密女子、拿八的妻子亚比该
  rationale: 阴性形式הַכַּרְמְלִית修饰亚比该，说明她是迦密女子；同时保留她与拿八的婚姻关系，避免误读为拿八的族称。
theological_decisions: []
