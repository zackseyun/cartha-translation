base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/027/006.yaml
  text: So Achish gave him Ziklag that day[b][a]. Therefore Ziklag has belonged to the kings of Judah to this day.
translation:
  language: zh_hans
  text: 当天，亚吉把洗革拉赐给了大卫。因此，洗革拉直到今日仍归犹大诸王所有。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתֶּן
  choice: 赐给
  rationale: נתן在此表示亚吉把城邑交给大卫；“赐给”自然体现君王授予城邑的语境，同时保留“给”的基本意义。
- source_word: לּוֹ
  choice: 大卫
  rationale: 原文为第三人称阳性单数“他”，按紧邻上下文所指明译为“大卫”，避免中文读者误认指代对象。
- source_word: אָכִישׁ
  choice: 亚吉
  rationale: 采用现代中文圣经传统中通行的人名音译。
- source_word: בַּיּוֹם הַהוּא
  choice: 当天
  rationale: 准确、自然地表达“在那一天”，并保持事件发生时间的明确性。
- source_word: צִקְלָג
  choice: 洗革拉
  rationale: 采用现代中文圣经传统中通行的地名音译。
- source_word: לָכֵן
  choice: 因此
  rationale: 清楚保留前一事件与后一历史状况之间的结果关系。
- source_word: הָיְתָה ... לְמַלְכֵי יְהוּדָה
  choice: 仍归犹大诸王所有
  rationale: 此处“是/成为……的”结合“直到今日”表达持续的归属状态；“仍归……所有”是自然且准确的现代汉语。
- source_word: עַד הַיּוֹם הַזֶּה
  choice: 直到今日
  rationale: 保留叙述者从后来的时间点回顾并说明该状况一直持续至其当代的表达。
theological_decisions:
- issue: “直到今日”及“犹大诸王”所体现的历史视角
  choice: 原样保留叙述者的回顾性说明，不在正文中解释成书或编修年代。
  alternative: 扩展译文，明确说明这是后来犹大王国时期的视角。
  rationale: 希伯来文本只陈述该城直到叙述者当时仍归犹大诸王；译文不应加入文本未明说的成书理论。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“赐给”符合君王授予城邑的叙事语境；“犹大诸王”简洁保留复数及王室归属含义。原文在本节没有需要以脚注保存的实质歧义，因此不设脚注。
