base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/027/010.yaml
  text: Then Achish said[a], “Where have you made a raid today?” And David said, “Against the Negev of Judah, against the Negev of the Jerahmeelites[b], and against the Negev of the Kenites.”
translation:
  language: zh_hans
  text: 亚吉问[a]：“你们今天袭击了哪里？”大卫回答：“犹大的南地、耶拉篾人的南地和基尼人的南地。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文本字面近似“你们今天没有袭击吗？”，但按上下文，此处是在问：“你们今天袭击了哪里？”
    reason: textual_variant
lexical_decisions:
- source_word: אַל פְּשַׁטְתֶּם הַיּוֹם
  choice: 你们今天到哪里袭击了？
  rationale: 马所拉文本字面近似“你们今天没有袭击吗？”，但 אַל 在此形成困难；结合上下文和古译本，亚吉是在询问袭击地点。译作“到哪里袭击了”自然呈现语境中的问意，同时以“袭击”保留 פּשט 所指的军事劫掠行动。
- source_word: נֶגֶב
  choice: 南地
  rationale: 此词既可泛指南方，也可指犹大南部干旱地区“南地”。三次与族群或领地名称连用，译作“南地”既保留地理指向，也符合中文圣经地名表达。
- source_word: עַל / אֶל
  choice: 到
  rationale: 原文前两项用 עַל，第三项用 אֶל。大卫是在回答袭击去向；中文以“到”统摄三项较自然，也不把其虚假报告中的目标关系解释得过死。敌对含义已由“袭击”表达。
- source_word: הַיַּרְחְמְאֵלִי
  choice: 耶拉篾人
  rationale: 族称形式，指耶拉篾人的群体或其区域；与“南地”连用译为“耶拉篾人的南地”。
- source_word: הַקֵּינִי
  choice: 基尼人
  rationale: 族称形式，指基尼人的群体或其区域；采用通行中文音译。
- source_word: וַיֹּאמֶר
  choice: 问／回答
  rationale: 希伯来语两处均为普通的“说”，但现代汉语按言语功能分别译作“问”和“回答”，使对话清楚自然，并未增加原文没有的实质信息。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“你们”对应复数动词。“南地”保留 נֶגֶב 既可作地理专称、也带“南方地区”含义的张力；不另设脚注，因为中文“南地”本身能够兼顾两义。
