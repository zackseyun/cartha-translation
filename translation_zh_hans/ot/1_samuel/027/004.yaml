  text: When it was reported to Saul that David had fled to Gath[b][a], he no longer continued to seek him.
translation:
  language: zh_hans
  text: 有人告诉扫罗，大卫已经逃到迦特；扫罗就不再寻找他了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֻּגַּד לְשָׁאוּל
  choice: 有人告诉扫罗
  rationale: 该被动叙事形式表示消息被告知扫罗，并未说明传信者是谁。中文用泛指的“有人”自然表达这一未指明的施事者。
- source_word: כִּי בָרַח דָּוִד גַּת
  choice: 大卫已经逃到迦特
  rationale: כִּי引出所传消息的内容；בָרַח表示逃离或逃走，גַּת虽无显明介词，却在句中充当逃往的目的地。“已经”体现逃到迦特先于扫罗得知消息。
- source_word: וְלֹא יֹסֶף עוֹד
  choice: 就不再继续
  rationale: יסף与עוד构成停止继续或不再重复某行动的习语。“不再继续”既保留停止之意，也适度反映原文“继续”的表达层次。
- source_word: לְבַקְשׁוֹ
  choice: 寻找他
  rationale: בקש基本义为寻找、寻求；本语境也可含追查或搜捕之意，但“寻找”保持了原词较宽的语义范围，避免过度解释。
