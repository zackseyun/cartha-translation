  yaml_path: translation/ot/1_samuel/027/007.yaml
  text: The number of days that David lived in the territory of the Philistines was a year and four months[a].
translation:
  language: zh_hans
  text: 大卫住在非利士人境内的时间，共有一年零四个月[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来原文直译为“日子和四个月”；这里的“日子”是时长表达中的惯用说法，意思是“一年”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי מִסְפַּר הַיָּמִים
  choice: 时间，共有
  rationale: 这里是叙事中的时长总结。译为“时间，共有”既自然地表达总时长，也避免把希伯来语“日子的数目”生硬直译成现代汉语。
- source_word: אֲשֶׁר יָשַׁב דָּוִד
  choice: 大卫住
  rationale: יָשַׁב 此处指居住、停留，并非字面的“坐”；“住”简洁自然，适合持续一段时间的居留。
- source_word: בִּשְׂדֵה פְלִשְׁתִּים
  choice: 在非利士人境内
  rationale: שְׂדֵה 字面可指“田野”，但与族名连用时表示其土地或地域；“境内”准确传达这里的地理意义。
- source_word: יָמִים וְאַרְבָּעָה חֳדָשִׁים
  choice: 一年零四个月
  rationale: 在这种时长表达中，יָמִים 是表示“一年”的惯用说法；译成“一年零四个月”传达实际意义，而脚注保留原文形式。
theological_decisions: []
