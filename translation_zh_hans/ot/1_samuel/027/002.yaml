  text: So David arose and crossed over, he and the six hundred men who were with him, to Achish son of Maoch, king of Gath.
translation:
  language: zh_hans
  text: 于是，大卫起身，和跟随他的六百人一同过去，到玛俄的儿子亚吉那里；亚吉是迦特王。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקָם
  choice: 动身
  rationale: קום的叙事形式在这里标志大卫开始采取行动；“动身”比直译“起来”更符合现代汉语叙事，同时不过度具体化为“离开”。
- source_word: וַיַּעֲבֹר
  choice: 投奔
  rationale: עבר本义为“越过、过去”；结合目的语 אֶל אָכִישׁ 及上下文，大卫是越境前往亚吉那里。汉语“投奔”自然表达这种行动及其投靠对象，但也比单纯“过去”略带语境性。
- source_word: הוּא וְשֵׁשׁ מֵאוֹת אִישׁ אֲשֶׁר עִמּוֹ
  choice: 带着跟随他的六百人
  rationale: 将希伯来语“他和与他同在的六百人”转化为自然汉语；“跟随他的”标明这是大卫已有的随从群体。
- source_word: אָכִישׁ
  choice: 亚吉
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: בֶּן מָעוֹךְ
  choice: 玛俄的儿子
  rationale: 保留希伯来语父子关系结构，并采用通行音译。
- source_word: מֶלֶךְ גַּת
  choice: 迦特王
  rationale: 准确表达附属结构“迦特的王”，并采用简洁自然的现代汉语称谓。
theological_decisions: []
translation_notes:
  register: 采用庄重而流畅的现代标准汉语。以“于是”承接连续叙事；调整人物头衔与父名的次序，使“迦特王玛俄的儿子亚吉”在汉语中清楚自然。
