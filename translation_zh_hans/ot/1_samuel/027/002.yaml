    issue: “投奔”超出原文的语义范围。
    rationale: עבר在此表示“越过／过去”；虽然上下文可让读者推知大卫前往非利士地寻求庇护，但本节本身并未用表达投靠、投降或求庇护的动词。应避免预先解释。
  - severity: low
    issue: “带着跟随他的六百人”弱化了“他和……六百人”的并列。
    rationale: 原文以独立代词和连词将大卫与六百人并列；“和……一同”能自然地保留这一点。
  revised_text: 于是，大卫起身，和跟随他的六百人一同过去，到玛俄的儿子亚吉那里；亚吉是迦特王。
