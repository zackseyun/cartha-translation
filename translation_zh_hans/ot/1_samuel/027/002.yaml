review_pass:
  verdict: revise
  source_fidelity: 草稿将 וַיַּעֲבֹר（“越过／过去”）译为“投奔”，加入了原文未明说的投靠意味，也没有明确保留“越过、过去”的行动。其余主要信息，包括六百人、玛俄的儿子和迦特王的身份，均已涵盖。
  naturalness: 草稿整体流畅，但“带着跟随他的六百人，投奔……”把“他和六百人”的并列结构改成大卫单方面带领的结构。修订以“和……一同过去”较贴近原文，且符合现代书面汉语。
  terminology: “亚吉”“玛俄”“迦特王”均可接受，并与常见中文圣经人地名用法一致。
  issues:
