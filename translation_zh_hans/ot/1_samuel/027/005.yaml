base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/027/005.yaml
  text: Then David said to Achish[a], “If I have now found favor in your eyes, let them give me a place in one of the towns in the countryside, so that I may live there[c][b]. For why should your servant live with you in the royal city?”
translation:
  language: zh_hans
  text: 大卫对亚吉说：“我若在你眼前蒙恩，请让人给我一处地方，在乡间的一座城里[a]，好让我住在那里。你的仆人为什么要和你一同住在王城里呢？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “乡间的一座城”，希伯来文直译为“田野的一座城”，指王城以外的城镇。
    reason: lexical_alternative
lexical_decisions:
- source_word: מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: 在你眼前蒙恩
  rationale: 保留希伯来语“在某人眼中找到恩惠”的惯用意象；“蒙恩”在现代中文中简洁、庄重，也适合向君王恭敬陈情的语境。
- source_word: נָא
  choice: 请
  rationale: 此语气词在这里缓和请求；汉语用“请”比直译为“现在”更自然地表达恭敬语气。
- source_word: יִתְּנוּ לִי
  choice: 请让人给我
  rationale: 第三人称复数未完成式在此有祈使或愿望语气，主语不特定，指亚吉权下负责安排的人；“让人给我”保留不定复数的意味。
- source_word: מָקוֹם
  choice: 一个地方
  rationale: 按其普通、宽泛的含义翻译，不把它过度具体化为产业或驻地。
- source_word: בְּאַחַת עָרֵי הַשָּׂדֶה
  choice: 在乡间的一座城里
  rationale: 较贴近字面“田野／乡间的城之一”，同时以自然中文表达与王城相对的外地城镇。
- source_word: וְאֵשְׁבָה שָּׁם
  choice: 居住
  rationale: ישב在这里指居住；中文将“在那里”所指地点并入“在乡间的一座城里居住”，避免重复而不损失信息。
- source_word: לָמָּה יֵשֵׁב
  choice: 为什么要……住
  rationale: 保留大卫用来说明请求理由的反问语气。
- source_word: עַבְדְּךָ
  choice: 你的仆人
  rationale: 这是宫廷陈情中的谦称，不宜在此强调奴隶身份。
- source_word: בְּעִיר הַמַּמְלָכָה
  choice: 在王城里
  rationale: 原文直译为“王国之城”；“王城”自然、凝练，并保留其作为君王所在之城的含义，而不像“首都”那样过度具体。
- source_word: עִמָּךְ
  choice: 和你一同
  rationale: 直接表达与亚吉同住一城的关系和接近性。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事与宫廷陈情语体。“我若在你眼前蒙恩”“你的仆人”保留原文的谦恭措辞；“王城”与“乡间的一座城”形成清楚对照。
