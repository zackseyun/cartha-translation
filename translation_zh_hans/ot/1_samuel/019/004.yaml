base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/004.yaml
  text: Jonathan spoke well of David to Saul his father[a], and said to him, “Let not the king sin against his servant David, because he has not sinned against you[b], and because his deeds have been very good for you.”
translation:
  language: zh_hans
  text: 约拿单向他父亲扫罗称赞大卫[a]，对他说：“王不可得罪自己的仆人大卫[b]，因为大卫没有得罪你，而且他所做的事对你大有益处。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“为大卫说好话”。希伯来语直译为“论到大卫说好话”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语在“仆人”和“大卫”之前重复介词，直译可作“王不可在自己的仆人、在大卫身上犯罪”；“大卫”同位说明“自己的仆人”，并加强语气。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר ... בְּדָוִד טוֹב
  choice: 替大卫说好话
  rationale: 这一希伯来语表达是指为某人说有利、正面的话。“替大卫说好话”符合现代汉语习惯，也体现约拿单为大卫辩护的语境。
- source_word: אֶל שָׁאוּל אָבִיו
  choice: 在父亲扫罗面前
  rationale: 这里的 אֶל 指话语所面对的对象；这样译既清楚交代扫罗是约拿单的父亲，也自然衔接“替大卫说好话”。
- source_word: אַל יֶחֱטָא הַמֶּלֶךְ
  choice: 王不可得罪
  rationale: אַל 加未完成式表达禁止。“王不可”保留约拿单以第三人称尊称扫罗的宫廷语气；“得罪”在此表示对人犯罪或行亏负之事。
- source_word: בְּעַבְדּוֹ בְדָוִד
  choice: 他的仆人大卫
  rationale: 两个介词短语构成同位说明，指明“他的仆人”就是大卫。正文采用自然汉语合并表达，并以脚注说明希伯来语的重复形式。
- source_word: כִּי לֹא חָטָא לָךְ
  choice: 因为大卫没有得罪你
  rationale: 保留前后 חטא 的词义呼应，突出扫罗若伤害大卫便是得罪他，而大卫并未得罪扫罗。补出“大卫”可避免现代汉语中代词指向含混。
- source_word: וְכִי מַעֲשָׂיו טוֹב לְךָ מְאֹד
  choice: 而且他所做的事对你大有益处
  rationale: וְכִי 引出第二项理由；טוֹב לְךָ 在语境中表示大卫的行动对扫罗有利。“大有益处”自然表达 מְאֹד 的加强语气。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“王不可”保留约拿单对扫罗说话时尊敬而克制的宫廷口吻；避免加入原文没有的尊称或神学解释。
