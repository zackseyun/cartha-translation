base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/010.yaml
  text: Saul sought to pin David to the wall with the spear, but he slipped away from Saul’s presence, and he drove the spear into the wall. Then David fled and escaped that night.
translation:
  language: zh_hans
  text: 扫罗想用枪把大卫钉在墙上；大卫却从扫罗面前闪开，扫罗就把枪刺进了墙里。那天夜里，大卫逃走，脱了险。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְהַכּוֹת בַּחֲנִית בְּדָוִד וּבַקִּיר
  choice: 用枪把大卫钉在墙上
  rationale: 该短语直译近于“用枪击打大卫和墙”，在叙事情境中表达企图以枪刺穿大卫、使他贴在墙上的意思；此译既自然，也保留动作的猛烈程度。
- source_word: וַיִּפְטַר מִפְּנֵי שָׁאוּל
  choice: 从扫罗面前躲开了
  rationale: נפטר在此指大卫从扫罗跟前迅速脱身、避开攻击；“躲开”符合枪掷来时的具体场景。
- source_word: וַיַּךְ אֶת־הַחֲנִית בַּקִּיר
  choice: 扫罗的枪刺进墙里
  rationale: 希伯来语字面结构是“他使枪击中墙”；中文以“枪刺进墙里”清楚呈现攻击落空后的结果，并按上下文明确主语为扫罗。
- source_word: נָס וַיִּמָּלֵט
  choice: 逃走，脱险了
  rationale: 分别传达“逃跑”和“逃脱、保全性命”两个连续动作，避免将同义递进压缩为一个动词。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。保留原文紧凑的动作推进，同时用自然汉语明确枪刺入墙中的结果；不增添原文没有的神学解释。
