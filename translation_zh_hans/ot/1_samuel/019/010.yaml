revisions:
- from: 扫罗想用枪把大卫钉在墙上，大卫却从扫罗面前躲开了；扫罗的枪刺进墙里。当天夜里，大卫逃走，脱险了。
  to: 扫罗想用枪把大卫钉在墙上；大卫却从扫罗面前闪开，扫罗就把枪刺进了墙里。那天夜里，大卫逃走，脱了险。
  rationale: 修订仅明确第二个动作由扫罗执行，并微调避让和时间表达，使中文动作叙述更自然。保留“钉在墙上”这一符合上下文及英语审校轨迹的译法，并保留“逃走，脱了险”所体现的两个连续动词。
