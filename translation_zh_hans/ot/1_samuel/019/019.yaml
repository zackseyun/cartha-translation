base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/019.yaml
  text: And it was reported to Saul[a], saying, “Look, David is at Naioth in Ramah.”
translation:
  language: zh_hans
  text: 有人禀告扫罗说：“看，大卫在拉玛的拿约[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“大卫在拉玛，在拿约。”
    reason: 原文两个地点短语的关系可理解为拿约位于拉玛，也可较直译地并列保留；“拿约”的具体性质并不完全确定。
lexical_decisions:
- source_word: וַיֻּגַּד
  choice: 有人禀告
  rationale: 原文是无施事者的被动叙事形式，表示消息被告知扫罗。现代汉语通常用不定施事者“有人禀告”自然表达这一功能；“禀告”也符合向君王报告的语境。
- source_word: לְשָׁאוּל
  choice: 扫罗
  rationale: 作“禀告”的间接对象；采用现代中文圣经中通行的人名译法。
- source_word: לֵאמֹר
  choice: 说
  rationale: 保留希伯来语引出直接引语的结构，同时符合自然汉语。
- source_word: הִנֵּה
  choice: 看
  rationale: 该指示语气词用于唤起注意；“看”比“看哪”更现代，又保留原文的即时感。
- source_word: דָוִד
  choice: 大卫
  rationale: 采用现代中文圣经中通行的人名译法。
- source_word: בְנוית
  choice: 在……拿约
  rationale: 将נוית视为地名并按传统音译为“拿约”；介词בְ表达地点关系。
- source_word: בָּרָמָה
  choice: 拉玛的
  rationale: 原文直译为“在拉玛”，说明拿约与拉玛的地点关系；汉语以“拉玛的拿约”简洁自然地表达。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“禀告”体现向扫罗这位君王报告的语境；正文将两个地点自然处理为所属关系，脚注保留更贴近原文结构的表达。
