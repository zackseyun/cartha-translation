base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/016.yaml
  text: When the messengers came in[a], behold, the teraphim was in the bed[b], with the quilt of goats’ hair at its head.
translation:
  language: zh_hans
  text: 使者们一进来，就看见床上有特拉非姆[a]，它头边有一块山羊毛制的盖毯[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “特拉非姆”是希伯来文音译，通常指与家庭宗教有关的神像或礼仪物件。该词形式为复数；本节的具体所指及数目并不完全确定。
    reason: lexical_alternative
  - marker: b
    text: 译作“盖毯”的希伯来词十分罕见，也可能泛指某种编织的覆盖物。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּלְאָכִים
  choice: 使者们
  rationale: 这里指扫罗派去捉拿大卫的人；“使者”保留了该词在人类奉差者语境中的一般含义，不会误解为天使。
- source_word: וְהִנֵּה
  choice: 一看，只见
  rationale: 用自然的现代汉语再现希伯来叙事中突然发现眼前情景的鲜明效果。
- source_word: הַתְּרָפִים
  choice: 家神像
  rationale: 该词指与家庭祭祀有关的神像或礼仪物件。正文采用普通读者容易理解的“家神像”，同时以脚注保留其希伯来专名和语法上的不确定性。
- source_word: אֶל הַמִּטָּה
  choice: 在床上
  rationale: 介词אֶל通常有“到、向”之意，但在这个发现床上替身的场景中表达位置，译作“在床上”最符合汉语习惯。
- source_word: וּכְבִיר
  choice: 盖毯
  rationale: 这是罕见词，可能泛指编织的覆盖物；按床铺语境译作“盖毯”，但在脚注中说明词义并不确定。
- source_word: הָעִזִּים
  choice: 山羊毛织成的
  rationale: 此处所指很可能是覆盖物的材料；这样翻译比直译“山羊的”更清楚自然。
- source_word: מְרַאֲשֹׁתָיו
  choice: 头部放着
  rationale: 原词指头所在的位置。这里所说的是床上作为替身的神像，译作“头部”既清楚，又不暗示床上是真人。
theological_decisions:
- issue: 如何翻译与家庭宗教和偶像崇拜有关的תְּרָפִים
  choice: 家神像
  alternative: 特拉非姆；偶像；神像
  rationale: 经文本身只点明这个物件，并未在本节加入评价。“家神像”既传达其大致性质，又不进一步断定其具体大小、形制或用途；脚注列出音译，以保留文化专名。
- issue: תְּרָפִים的复数形式与本节所指物件的数目
  choice: 正文按叙事情境译为单数“家神像”
  alternative: 家神像群；特拉非姆
  rationale: 该词在形式上是复数，但上下文描写的是放在床上充当大卫替身的一个物件。正文采用自然的单数表达，脚注保留原文形式可能引起的歧义。
translation_notes:
  register: 采用现代、庄重而自然的叙事汉语。“进来一看，只见”传达原文突见场景的叙事力度；“家神像”和“盖毯”便于普通读者理解，同时通过脚注保留文化专名、数的歧义及罕见词的不确定性。
