  terminology: “拉玛”“撒母耳”“大卫”“西沽”“拿约”均采用稳定、可辨识的中文圣经专名形式。“大井”是对בּוֹר הַגָּדוֹל的可行主译；脚注恰当保留“大蓄水池”与“大坑”的词义可能，未将原文的设施类别不确定性过度消除。
