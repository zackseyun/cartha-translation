base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/022.yaml
  text: He too went to Ramah[a], and he came as far as the great well that is at Seku. He asked and said, “Where are Samuel and David?” And one said, “Look[b], they are at Naioth in Ramah.”
translation:
  language: zh_hans
  text: 他也往拉玛去，来到西沽的大井[a]那里。他问道：“撒母耳和大卫在哪里？”有人回答说[b]：“看，他们在拉玛的拿约。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “大井”也可译作“大蓄水池”或“大坑”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译为“他说”；答话者是谁并未说明。
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרָמָתָה
  choice: 往拉玛去
  rationale: 地名后的方向词尾表示朝向拉玛；“往拉玛去”在现代汉语中自然地表达这一方向含义。
- source_word: בּוֹר הַגָּדוֹל
  choice: 大井
  rationale: בּוֹר 可指坑、蓄水池或井；此处是路线上的著名地标。“大井”简洁自然，但其具体设施类型仍不确定，故以脚注保留其他可能。
- source_word: בַּשֶּׂכוּ
  choice: 西沽
  rationale: 按专名音译；介词所表达的地点关系融入“西沽的大井”这一自然汉语结构。
- source_word: וַיִּשְׁאַל וַיֹּאמֶר
  choice: 他问道
  rationale: 两个连续动词直译为“他询问并说”在汉语中累赘；“问道”自然表达以直接引语发问，并保留其询问功能。
- source_word: אֵיפֹה
  choice: 在哪里
  rationale: 自然表达对撒母耳和大卫所在地点的询问；汉语无需按复合主语标示数的一致。
- source_word: הִנֵּה
  choice: 看
  rationale: 保留提示听者注意答案的指示语气，同时避免使用过于古雅的“看哪”。
- source_word: בנוית
  choice: 拿约
  rationale: 作为专名音译；其究竟是聚居地、住处或建筑群，正文不作解释性限定。
- source_word: בָּרָמָה
  choice: 拉玛的
  rationale: 用“拉玛的拿约”自然表达拿约与拉玛之间的地点关联；也可理解为“拉玛境内的拿约”。
- source_word: וַיֹּאמֶר
  choice: 有人回答说
  rationale: 希伯来文为无明确主语的阳性单数“他说”；上下文未说明答话者是谁。中文补出不定主语“有人”，并用“回答”明确其话语功能。
theological_decisions: []
