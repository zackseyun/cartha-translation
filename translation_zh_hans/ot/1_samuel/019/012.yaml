  source_fidelity: “缒下去”通常带有用绳索下放的明确含义；希伯来文 וַתֹּרֶד 只说明米甲使大卫下降，并未在本节交代所用方式。因此宜用不预设工具的“放下去”。末句原文连续列出“离去、逃跑、逃脱”三个动作，修订稿予以保留。
  naturalness: 修订后的“从窗户放下去”是现代汉语中自然、清楚的叙事表达。“他便离去、逃走，得以脱险”既保持动作递进，也避免不够自然的“逃走脱险了”连用。
  terminology: 人名“米甲”“大卫”规范。“脱险”准确传达 וַיִּמָּלֵט 的成功逃脱结果；“得以”自然表达其结果性，未增加神学或叙事因果。
