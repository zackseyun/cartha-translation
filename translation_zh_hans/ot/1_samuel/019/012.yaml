  text: 米甲把大卫从窗户放下去；他便离去、逃走，得以脱险。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֹּרֶד
  choice: 缒下去
  rationale: 该使役形式表示米甲将大卫从高处放下；“缒下去”自然、准确，也体现借助窗户向下送人的动作。
- source_word: בְּעַד הַחַלּוֹן
  choice: 从窗户
  rationale: 介词短语在此表示动作所经过的开口，现代汉语以“从窗户”表达最自然。
- source_word: וַיֵּלֶךְ וַיִּבְרַח וַיִּמָּלֵט
  choice: 他就离开，逃走脱险了
  rationale: 保留原文三个连续动词的推进：离开、逃跑、成功脱险；避免把末二词合并而削弱叙事强调。
