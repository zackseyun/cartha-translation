base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/017.yaml
  text: Then Saul said to Michal[a], “Why have you deceived me like this and sent away my enemy, so that he escaped?” And Michal said to Saul, “He said to me, ‘Let me go. Why should I kill you?’”
translation:
  language: zh_hans
  text: 扫罗对米甲说：“你为什么这样欺骗我，放走了我的仇敌，让他逃脱了？”米甲回答扫罗：“他对我说：‘放我走！我何必杀你呢？’”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可按其隐含的威胁意译为：“放我走，否则我就杀你。”希伯来文直译是：“放我走！我何必杀你呢？”
    reason: 说明原文直译与语境性意译之间的差异，避免在正文中消除歧义。
lexical_decisions:
- source_word: רִמִּיתִנִי
  choice: 欺骗我
  rationale: 该动词在这里指以诡计蒙骗；“欺骗”自然准确，又不额外强化为“背叛”。
- source_word: כָּכָה
  choice: 这样
  rationale: 表示行为的方式，对应扫罗所指责的做法，现代汉语简洁自然。
- source_word: וַתְּשַׁלְּחִי
  choice: 放走了
  rationale: שלח可指送走或放走；此处米甲帮助大卫脱身，“放走”最符合上下文。
- source_word: אֹיְבִי
  choice: 我的仇敌
  rationale: 保留扫罗对大卫的敌对称呼及叙事中的张力。
- source_word: וַיִּמָּלֵט
  choice: 让他逃脱了
  rationale: 该词意为逃脱；“让”自然表达前一行动所造成的结果，但不增添新的情节。
- source_word: שַׁלְּחִנִי
  choice: 放我走
  rationale: 祈使式在此是直接要求离开；汉语“放我走”比“送我走”更符合威迫语境，也与前文“放走”保持语义呼应。
- source_word: לָמָה אֲמִיתֵךְ
  choice: 我何必杀你呢？
  rationale: 直译保留“为什么/何必”加第一人称使役式“杀你”的措辞，不把隐含威胁明说成“否则我就杀你”。
- source_word: מִיכַל
  choice: 米甲
  rationale: 采用现代中文圣经人名的通行译名。
- source_word: שָׁאוּל
  choice: 扫罗
  rationale: 采用现代中文圣经人名的通行译名。
theological_decisions:
- issue: 米甲转述的大卫言语是否应明译为威胁
  choice: 按希伯来文两个分句译为“放我走！我何必杀你呢？”
  alternative: “放我走，否则我就杀了你。”
  rationale: 原文有祈使句，随后是“为什么/何必”加“我杀你”，并没有明写“否则”。正文保留其字面形式和语用张力，脚注说明可能隐含的威胁。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“欺骗”“仇敌”“逃脱”保留叙事力度；对末句不擅自补入“否则”，以保存原文的含蓄威胁和解释空间。
