base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/006.yaml
  text: Saul listened to Jonathan’s voice[a], and Saul swore, “As Yahweh lives, he shall not be put to death.”
translation:
  language: zh_hans
  text: 扫罗听从了约拿单的话，就起誓说：“我指着永活的雅威起誓，他绝不会被处死。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来原文的誓言公式直译为：“雅威永活；若他被处死……”其中“若／如果”在这类省略式誓言中表达强烈否定，意思是“他绝不会被处死”。
    reason: 说明希伯来誓言公式及其省略结构。
lexical_decisions:
- source_word: וַיִּשְׁמַע ... בְּקוֹל יְהוֹנָתָן
  choice: 听从了约拿单的话
  rationale: שׁמע בקול 在这里不只是听见声音，而是接受、听从约拿单的劝说；此译法自然传达其回应性的含义。
- source_word: וַיִּשָּׁבַע
  choice: 起誓说
  rationale: 该动词表示郑重起誓；加“说”可自然引出后面的直接引语。
- source_word: חַי יְהוָה
  choice: 永活的雅威作证
  rationale: 这是希伯来语庄严的起誓公式。中文用“永活的……作证”既传达以雅威之生命起誓的力量，也保持自然庄重。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按原文保留以色列上帝的专名，而不以“主”这一称号替代。
- source_word: אִם יוּמָת
  choice: 他绝不会被处死
  rationale: 誓言公式中的 אִם 是省略式表达，实际构成强烈否定；מות 的使役被动式表示“被处死”，不是单纯“死亡”。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；采用较贴近 YHWH 通常学术拟音的“雅威”，保留其专名性质。
- issue: 省略式誓言 אִם יוּמָת 的理解
  choice: 他绝不会被处死
  alternative: 如果他被处死……
  rationale: 这里的条件句在希伯来誓言中省略了咒诅后果，语用意义是强烈否定。正文译明其实际含义，同时以脚注保存原文形式。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“听从了……的话”体现上下文中的接受劝说；直接引语保持誓言的郑重和力度。
