base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/024.yaml
  text: He too stripped off his clothes[a], and he too prophesied before Samuel. He lay naked all that day and all that night. Therefore they say[b], “Is Saul also among the prophets?”
translation:
  language: zh_hans
  text: 他也脱掉了衣服[a]，也在撒母耳面前说预言。他赤身[b]躺卧了那一整天和一整夜。因此人们说：“扫罗也在先知中间吗？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“脱掉了衣袍”。
    reason: lexical_alternative
  - marker: b
    text: “赤身”可能指完全裸露，也可能指脱去了外层衣服；希伯来原文没有进一步说明。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְשַׁט ... בְּגָדָיו
  choice: 脱掉了衣服
  rationale: פשט与בגדים连用表示脱去衣物；“脱掉了衣服”符合现代汉语，又不限定只脱外袍。
- source_word: גַּם הוּא
  choice: 他也……也
  rationale: 原文重复גם הוא，强调扫罗本人也像先前的使者一样受影响；中文保留两处“也”以再现强调。
- source_word: וַיִּתְנַבֵּא
  choice: 说预言
  rationale: 采用常规、不过度解释的译法，不判定这是预告未来、受感说话，还是伴随特殊行为的先知状态。
- source_word: לִפְנֵי שְׁמוּאֵל
  choice: 在撒母耳面前
  rationale: 准确表达“在……面前、在……场”的含义，自然简洁。
- source_word: וַיִּפֹּל עָרֹם
  choice: 赤身躺卧
  rationale: נפל字面为“倒下”，但后接持续一昼夜的时间语，汉语用“躺卧”更自然；עָרֹם直译为“赤身”，其具体裸露程度留下注释说明。
- source_word: כָּל הַיּוֹם הַהוּא וְכָל הַלָּיְלָה
  choice: 一整天一整夜
  rationale: 自然地保留原文对整段持续时间的强调。
- source_word: עַל כֵּן יֹאמְרוּ
  choice: 因此人们说
  rationale: 保留原文现在时和因果关系，也显出这句话已成为流传的说法。
- source_word: הֲגַם שָׁאוּל בַּנְּבִיאִם
  choice: 扫罗也在先知中间吗？
  rationale: 直译这一带有谚语性质的反问，并保留“在先知中间”的群体含义。
theological_decisions:
- issue: 扫罗“赤身”（עָרֹם）的含义
  choice: 正文译为“赤身”，不附加道德或神学解释。
  alternative: 只脱去外衣，或只脱去王服
  rationale: 希伯来词通常表示裸露，但本节没有进一步说明是全裸还是脱去外层衣服；正文保留其力度，注释保留范围上的歧义。
- issue: 扫罗说预言的性质
  choice: 译为“说预言”，不界定具体表现形式。
  alternative: 进入狂喜的先知状态；表现得像先知
  rationale: וַיִּתְנַבֵּא指与先知活动有关的受感言行，但本节没有说明是预告、受感发言还是特殊行为；不在译文中缩窄含义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“脱掉了衣服”“一整天一整夜”便于普通读者理解；“在撒母耳面前”“在先知中间”则保留原文的结构和经文语体。所有注释标记均置于相关正文之后。
