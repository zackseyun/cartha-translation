  text: Then Saul sent the messengers to see David[a], saying, “Bring him up to me in the bed, so that I may put him to death.”
translation:
  language: zh_hans
  text: 于是，扫罗派使者去看大卫，吩咐说：“把躺在床上的他抬到我这里来，好让我杀死他。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: 于是……派
  rationale: 连续式叙事动词推进情节；“于是”符合现代汉语叙事习惯，并保留先后关系。
- source_word: הַמַּלְאָכִים
  choice: 使者
  rationale: מַלְאָךְ在此指扫罗派出的人，并非超自然的天使；“使者”既准确又符合宫廷叙事语境。
- source_word: לִרְאוֹת
  choice: 去察看
  rationale: ראה本义为“看”；在此语境中是前去查看、核实大卫的情况。“察看”自然表达该语用含义，又不作过度推断。
- source_word: לֵאמֹר
  choice: 吩咐说
  rationale: 该不定式引出直接引语；因下文是君王对使者下令，“吩咐说”比单纯“说”更贴合语境。
- source_word: הַעֲלוּ
  choice: 抬到……来
  rationale: עלה的使役形表示“使上去、带上来”。大卫被认为卧床，故“抬”符合情境；“到我这里来”也保留朝向扫罗的移动。
- source_word: בַמִּטָּה
  choice: 连床
  rationale: 介词ב在此可理解为“在床上、躺在床里”或带有“连同床”的意味。正文采用自然的“连床”，表达扫罗要人把卧床的大卫原样抬来，同时以脚注保留原文歧义。
- source_word: אֵלַי
  choice: 到我这里来
  rationale: 直接表达第一人称目的地，即扫罗要求把大卫带到自己面前。
- source_word: לַהֲמִתוֹ
  choice: 好让我杀死他
  rationale: 带ל的不定式表达目的；“好让我”清楚呈现目的关系，“杀死”直接而庄重。
theological_decisions: []
translation_notes:
  register: 采用现代、清楚而庄重的叙事语言。“察看”体现使者前去核实情况的语境；“连床抬来”简洁自然，脚注则保留希伯来语介词的真实歧义。
