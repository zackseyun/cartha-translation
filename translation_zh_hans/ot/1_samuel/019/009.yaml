base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/009.yaml
  text: And an evil spirit from Yahweh came upon Saul while he was sitting in his house with his spear in his hand[b][a], and David was playing the lyre with his hand.
translation:
  language: zh_hans
  text: 从耶和华那里来的恶灵[a]临到扫罗。那时，扫罗正坐在自己家里，手里拿着矛；大卫则正在用手演奏[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “恶灵”也可译作“有害的灵”或“使人痛苦的灵”；希伯来语形容词既可指道德上的恶，也可指带来伤害或苦楚。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“用手”，本节没有明确说出所奏的乐器；根据前文，大卫所奏的很可能是琴。
    reason: textual_clarification
lexical_decisions:
- source_word: וַתְּהִי
  choice: 临到
  rationale: 该动词配合表示方向的 אֶל，描述这灵来到扫罗身上并开始影响他；“临到”既保留事件的发生，也符合现代汉语叙事。
- source_word: רוּחַ יְהוָה רָעָה
  choice: 从耶和华那里来的恶灵
  rationale: רוּחַ 译为“灵”，רָעָה 直译为“恶”，也可指“有害、使人痛苦”；“从耶和华那里来”自然表达该灵与耶和华之间的来源关系，同时不把“恶”理解为耶和华本身的属性。
- source_word: אֶל שָׁאוּל
  choice: 临到扫罗
  rationale: אֶל 基本义为“向、到”；在有力量来到并影响某人的语境中，与动词合译为“临到扫罗”自然且不夸大为“攻击”。
- source_word: בְּבֵיתוֹ יוֹשֵׁב
  choice: 正坐在自己家里
  rationale: 分词 יוֹשֵׁב 表示持续中的背景动作，“正坐在”准确呈现其未完成、场景铺陈的作用。
- source_word: וַחֲנִיתוֹ בְּיָדוֹ
  choice: 手里拿着矛
  rationale: 原文是无动词状态句，字面为“他的矛在他手中”；现代汉语用“手里拿着矛”更自然，并保留场景中的威胁感。
- source_word: מְנַגֵּן
  choice: 弹奏
  rationale: נגן 的 Piel 分词指演奏乐器；“弹奏”在汉语中自然表达持续演奏，同时不在正文中补出本节未明说的乐器名称。
- source_word: בְּיָד
  choice: 用手
  rationale: 严格保留原文单数“用手”。本节没有明说所奏乐器，因此正文不直接补作“琴”，相关语境信息放入脚注。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。正文采用现代中文圣经读者最熟悉的专名“耶和华”，而不以“主”替代，从而保留这是专有名称这一点。
- issue: רוּחַ יְהוָה רָעָה 中“恶”与神之间的关系
  choice: 从耶和华那里来的恶灵
  alternative: 耶和华所差来的有害之灵
  rationale: 该结构明确把灵与耶和华联系起来，但 רָעָה 可描述道德上的恶，也可描述其有害、使人痛苦的作用。正文保留较直接的“恶灵”，以“从……那里来”表达来源，不把恶归为神的属性；脚注同时保留词义上的另一可能。
- issue: 是否在正文补出所奏乐器
  choice: 不补出乐器名称
  alternative: 大卫用手弹琴
  rationale: 本节仅说大卫“用手弹奏”，没有宾语。上下文可帮助识别所奏之物，但正文保留本节自身的省略，避免把语境推断写成明说的信息。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“临到”保留圣经叙事语感但仍通俗；“手里拿着矛”比逐字的“矛在他手中”更符合现代汉语。正文保留原文对 רָעָה 的张力及对乐器名称的省略，并用脚注说明真正存在的词义和语境问题。
