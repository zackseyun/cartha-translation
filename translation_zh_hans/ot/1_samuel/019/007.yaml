base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/007.yaml
  text: So Jonathan called David and told him all these things. Then Jonathan brought David to Saul[a], and he was in his presence as before.
translation:
  language: zh_hans
  text: 约拿单便叫大卫来，把这一切事都告诉大卫。随后，约拿单带大卫到扫罗那里；大卫仍像从前一样在扫罗面前。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “像从前一样”直译为“像昨天、前天一样”，是希伯来语惯用说法，意思是“像以往一样”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא יְהוֹנָתָן לְדָוִד
  choice: 约拿单就叫大卫来
  rationale: קרא 与 לְ 加人物连用，可表示呼叫或召来；“叫……来”符合现代汉语叙事，也不把语气限定为正式召见。
- source_word: וַיַּגֶּד לוֹ יְהוֹנָתָן
  choice: 把……告诉了他
  rationale: Hiphil 词形 נגד 表示使人知道、告诉；这里以“他”回指大卫，自然清楚。
- source_word: אֵת כָּל הַדְּבָרִים הָאֵלֶּה
  choice: 这一切事
  rationale: דבר 可指话语、事情或事项；上下文既涉及扫罗所说的话，也涉及他的态度与安排，“这一切事”保留了词义范围。
- source_word: וַיָּבֵא יְהוֹנָתָן אֶת דָּוִד אֶל שָׁאוּל
  choice: 约拿单带大卫到扫罗那里
  rationale: בוא 的 Hiphil 常表示“带来、带到”；“带……到……那里”准确表达使役意义而不添加具体方式。
- source_word: וַיְהִי לְפָנָיו
  choice: 大卫便……侍立在扫罗面前
  rationale: 字面为“他在他面前”。在王廷语境中可包含在王面前供职、侍候之意；“侍立在……面前”既自然，也保留宫廷关系。明说“大卫、扫罗”可避免中文代词指向含混。
- source_word: כְּאֶתְמוֹל שִׁלְשׁוֹם
  choice: 像从前一样
  rationale: 这是表示以往情形的希伯来惯用语，字面涉及“昨日、前日”；正文采用自然汉语“像从前一样”，字面形式另以脚注说明。
