base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/021.yaml
  text: When they told Saul[a], he sent other messengers, and they also prophesied. Then Saul again sent a third group of messengers[b], and they also prophesied.
translation:
  language: zh_hans
  text: 有人把这事告诉扫罗，他就派了另一批使者去，他们也说预言。扫罗又派第三批使者去，他们也说预言。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文“第三”；这里指扫罗第三次派遣使者。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגִּדוּ לְשָׁאוּל
  choice: 有人把这事告诉扫罗
  rationale: נגד 的使役词干表示“告诉、报告”。希伯来语未明说主语；中文补出泛指的“有人”，并以“这事”承接上文，使叙事自然。
- source_word: מַלְאָכִים אֲחֵרִים
  choice: 另一批使者
  rationale: מַלְאָכִים 在此指扫罗派出的人员，而不是天使；אֲחֵרִים 为复数。“另一批”自然表明这是继前一批之后再次派出的一组人。
- source_word: וַיִּתְנַבְּאוּ גַּם הֵמָּה
  choice: 他们也受感说话
  rationale: נבא 的 Hitpael 形式在本段指进入先知性的受感状态。“受感说话”比现代汉语中可能被误解为预告未来的“说预言”更贴近语境，同时不限定其具体表现；גַּם הֵמָּה 的强调由“他们也”保留。
- source_word: וַיֹּסֶף שָׁאוּל וַיִּשְׁלַח
  choice: 扫罗又……派
  rationale: יסף 与后续动作连用表示再次做某事，译作“又……派”符合现代中文的叙事习惯。
- source_word: מַלְאָכִים שְׁלִשִׁים
  choice: 第三次派使者去
  rationale: שְׁלִשִׁים 在此依上下文作序数意义，指第三次差派，而不是数字“三十”。此译法清楚传达重复差派的次数。
theological_decisions:
- issue: 使者所经历的先知性活动具体是什么
  choice: 译为“受感说话”，不说明其内容或外在表现
  alternative: “说预言”；“像先知一样行事”；“陷入狂喜状态”
  rationale: 经文说明他们经历了先知性的状态，却未界定这是预告、赞美、狂喜言语或其他表现。译文保留这种开放性，避免加入经文本身没有说明的现象学或神学判断。
translation_notes:
  register: 采用现代、庄重而清楚的叙事文体。“受感说话”保留先知性活动的含义和模糊性；“使者”明确指受差派的人。主文中的脚注标记与脚注完全对应。
