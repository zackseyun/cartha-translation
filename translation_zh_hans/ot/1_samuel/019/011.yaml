base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/011.yaml
  text: Then Saul sent messengers to David’s house to watch him and to kill him in the morning. And Michal his wife told David[a], saying, “If you do not save your life tonight, tomorrow you will be put to death.”
translation:
  language: zh_hans
  text: 扫罗派人到大卫家，要监视他，并在早晨杀死他。大卫的妻子米甲告诉大卫[a]说：“你今晚若不逃命，明天就会被杀。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “你今晚若不逃命”也可译作“你今晚若不救自己的性命”。
    reason: 原文 מְמַלֵּט אֶת־נַפְשְׁךָ 兼有使自己脱险和保全性命的含义。
lexical_decisions:
- source_word: מַלְאָכִים
  choice: 人
  rationale: 这里指扫罗派出的人员，而非天使；中文叙事中“派人”自然简洁，也准确表达人的使者。
- source_word: לְשָׁמְרוֹ
  choice: 监视他
  rationale: 此处的 שׁמר 是敌意看守，为防止大卫逃走并伺机杀害；“监视”避免“保护、守卫”的正面含义。
- source_word: וְלַהֲמִיתוֹ
  choice: 杀死他
  rationale: 使役形式表示使其死亡；“杀死”直接清楚，符合暗杀图谋的语境。
- source_word: בַּבֹּקֶר
  choice: 等到早晨
  rationale: 表达预定行杀的时间；结合前面的监视行动，“等到早晨”在现代汉语中自然，并未改变早晨杀他的基本语义。
- source_word: וַתַּגֵּד
  choice: 告诉
  rationale: 准确表达米甲把危险告知大卫，后面的直接引语显出警告的紧迫性。
- source_word: מִיכַל אִשְׁתּוֹ
  choice: 大卫的妻子米甲
  rationale: 以自然中文清楚说明米甲与大卫的关系，同时保留姓名和同位信息。
- source_word: מְמַלֵּט אֶת־נַפְשְׁךָ
  choice: 逃命
  rationale: 该习语指使自己的性命脱离危险；“逃命”简洁自然，兼具逃脱和保全生命的含义。
- source_word: הַלַּיְלָה
  choice: 今晚
  rationale: 指当前这一夜，“今晚”是现代汉语最自然的表达。
- source_word: מוּמָת
  choice: 会被杀
  rationale: 保留被动形式及有人加害的语境，比泛指自然死亡的“必死”更明确。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“派人”“监视”“逃命”“被杀”均为普通读者自然理解的表达；保留原文连续叙事语气，不额外加入神学解释。
