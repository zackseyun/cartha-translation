base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/001.yaml
  text: Saul spoke to Jonathan his son and to all his servants to put David to death[b][a], but Jonathan son of Saul delighted greatly in David.
translation:
  language: zh_hans
  text: 扫罗对他儿子约拿单和他所有的臣仆说，要杀死大卫[a]；但扫罗的儿子约拿单非常喜爱大卫[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“要处死大卫”。原文动词为使役形式，意为“使大卫死亡”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“非常喜欢大卫”或“以大卫为乐”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 说
  rationale: דבר在叙事中表示开口说话；结合后面的不定式，中文用“说，要……”可自然表达谈话内容及意图，又不把它过度限定为明确命令。
- source_word: עֲבָדָיו
  choice: 他的臣仆
  rationale: עבד在王室语境中可指侍从、臣属或官员。“臣仆”既保留“仆人”的词义色彩，也符合扫罗王廷的语境。
- source_word: לְהָמִית אֶת־דָּוִד
  choice: 要杀死大卫
  rationale: 使役式 המית 直指使大卫死亡；“杀死”在现代汉语中直接自然，并保留 לְ־ 在此可能兼具内容与目的的表达张力。
- source_word: וִיהוֹנָתָן
  choice: 但……约拿单
  rationale: 连接词在此引出扫罗意图与约拿单态度之间的明显反差，译作“但”符合汉语篇章关系。
- source_word: חָפֵץ בְּדָוִד מְאֹד
  choice: 非常喜爱大卫
  rationale: חפץ ב־表示以某人为喜悦、对其怀有强烈好感；“非常喜爱”自然传达这种深厚正面情感，同时不直接等同于另一个常译为“爱”的希伯来词 אהב。
- source_word: בְּנוֹ / בֶּן שָׁאוּל
  choice: 他儿子／扫罗的儿子
  rationale: 保留原文前后两次亲属身份说明，以突出约拿单既是被告知者，也是与扫罗态度相反的儿子。
theological_decisions:
- issue: 约拿单对大卫之情的性质
  choice: 译作“非常喜爱大卫”
  alternative: “深爱大卫”或“非常以大卫为乐”
  rationale: 原词 חפץ 表达喜悦、喜爱或乐意，并未在本节自行界定这种感情的神学或人际类别；译文保留其强烈而正面的含义，不额外限定。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“臣仆”体现王廷背景；分号清楚呈现扫罗的杀意与约拿单的喜爱之间的对比。所有脚注标记均置于相应正文之后。
