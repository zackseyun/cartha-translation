base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/014.yaml
  text: Then Saul sent messengers to seize David[a], and she said, “He is sick.”
translation:
  language: zh_hans
  text: 扫罗派人去捉拿大卫，米甲[a]说：“他病了。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来原文只说“她说”；根据上下文，这里的“她”是米甲。
    reason: 原文以阴性动词形式标示主语，但没有在本节再次写出米甲的名字。
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: 派
  rationale: 叙事中的连续式推进事件；现代汉语无需另加“然后”，用“派”即可自然承接上文。
- source_word: מַלְאָכִים
  choice: 人
  rationale: 此处指扫罗派出的人员，而非天使；汉语叙事中“派人”比“派使者”更自然，也符合他们前来拘捕大卫的任务。
- source_word: לָקַחַת
  choice: 捉拿
  rationale: 该动词基本义为“拿、取”，但在这里指奉命拘捕大卫；“捉拿”准确表达语境中的敌对行动。
- source_word: וַתֹּאמֶר
  choice: 说
  rationale: 希伯来语是阴性单数，主语承接语境中的米甲；保留简单并列关系，不额外加入带转折意味的“却”。
- source_word: חֹלֶה הוּא
  choice: 他病了
  rationale: 自然、简明地表达谓语形容词与代词构成的陈述，并符合米甲当时所称的大卫状态。
