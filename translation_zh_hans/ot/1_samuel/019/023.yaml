base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/023.yaml
  text: So he went there[a], to Naioth in Ramah, and the Spirit of God came upon him also; and he went on, prophesying[b], until he came to Naioth in Ramah.
translation:
  language: zh_hans
  text: 于是，他前往拉玛的拿约[a]；神的灵也临到他身上[b]。他一面前行，一面说预言，直到来到拉玛的拿约。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“在拉玛的拿约”。
    reason: lexical_alternative
  - marker: b
    text: 或译“神的灵也在他身上”。
    reason: lexical_alternative
lexical_decisions:
- source_word: נוית בָּרָמָה
  choice: 拉玛的拿约
  rationale: 将专名音译，并以“拉玛的”自然表达地点之间的关系；希伯来介词 ב 在这里也可理解为“在拉玛”。
- source_word: וַתְּהִי עָלָיו ... רוּחַ אֱלֹהִים
  choice: 神的灵也临到他身上
  rationale: “היה על + 人”与“灵”连用时，表示神的灵临到某人；“临到……身上”符合本段叙事语境，同时脚注保留较静态的译法。
- source_word: גַּם הוּא
  choice: 也……他身上
  rationale: “也”表明扫罗同样经历了先前使者所经历的事，不额外强化为“连他也”。
- source_word: וַיֵּלֶךְ הָלוֹךְ
  choice: 他一路走
  rationale: 限定动词与绝对不定式连用，带有持续、进行之意；“一路走”自然体现动作延续。
- source_word: וַיִּתְנַבֵּא
  choice: 一路说预言
  rationale: 采用该动词的常规译法，不把具体表现限定为狂热状态、特定言语形式或其他先知性行为。
- source_word: עַד בֹּאוֹ
  choice: 直到来到
  rationale: 将带代词后缀的不定式结构自然译为时间从句。
- source_word: שָׁם
  choice: 那里
  rationale: 保留承接上文目的地的指示词，并用破折号自然引出具体地点。
theological_decisions:
- issue: רוּחַ אֱלֹהִים 是指神的灵，还是泛指一种来自神的灵
  choice: 神的灵
  alternative: 来自神的一个灵
  rationale: 本叙事语境表明这是神所赐、使人产生先知性表现的灵；中文“神的灵”保留其明确归属于神的含义，又不额外加入后期教义术语。
- issue: 扫罗的先知性活动应否被具体解释
  choice: 说预言
  alternative: 作先知性的表现
  rationale: 经文使用 נבא 的 Hitpael 形式，却没有说明活动的具体样态；采用常规译法可保留这种开放性，不将其解释为狂热、失控或某种特定礼仪行为。
- issue: 神的灵与扫罗之间关系的动态或静态表达
  choice: 临到他身上
  alternative: 在他身上
  rationale: “临到”符合撒母耳记相关叙事中神的灵作用于人的表达；脚注保留希伯来语结构可容许的静态理解。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“一路走，一路说预言”体现两个动作持续相伴；不具体描绘扫罗说预言时的外在状态。地名采用常见音译“拉玛”“拿约”。
