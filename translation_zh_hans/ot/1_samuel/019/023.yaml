  source_fidelity: 译文准确传达了扫罗前往拿约、神的灵临到他、他持续说预言直至抵达的基本意思。惟“那里——拉玛的拿约”的破折号结构在中文中略显突兀，且“前往那里”之后以破折号补出目的地，不如直接陈述目的地清楚自然。修订保留“也”、持续性的行走及先知性活动，不对其具体方式作解释。
  naturalness: “他一路走，一路说预言”可以理解，但“一面前行，一面说预言”更庄重、流畅，也更清楚表现两个持续并行的动作。首句改为直接的目的地表达，符合现代标准汉语叙事习惯。
  terminology: “拉玛”“拿约”为合宜的音译；“神的灵”忠实对应 רוּחַ אֱלֹהִים，避免加入不必要的后期术语；“说预言”保留 נבא 所指活动的开放性。脚注保留“在他身上”的静态译法。
