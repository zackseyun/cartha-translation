  to: 于是，他前往拉玛的拿约[a]；神的灵也临到他身上[b]。他一面前行，一面说预言，直到来到拉玛的拿约。
  rationale: 修订仅改善中文句法和文体。地名关系仍以“拉玛的拿约”表达，并以脚注保留“在拉玛的拿约”的替代译法；“神的灵也临到他身上”及其静态替代译法均保留。将持续行走与说预言改写为“一面前行，一面说预言”，不增加关于扫罗先知性行为形式的解释。
