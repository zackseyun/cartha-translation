base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/008.yaml
  text: And the war broke out again[a], and David went out and fought against the Philistines and struck them with a great blow, so that they fled before him.
translation:
  language: zh_hans
  text: 战争又起[a]，大卫就出战，与非利士人交战，重创了他们；他们便从他面前逃跑了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“战争仍在继续”或“又发生了战争”。希伯来语习语直译为“战争又继续存在”，可指战事再起，也可指战事延续。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתּוֹסֶף הַמִּלְחָמָה לִהְיוֹת
  choice: 战争又起
  rationale: 该习语字面为“战争又继续存在”，可表示战争再度发生或延续。“战争又起”以自然简洁的现代汉语表达战事再起，同时用脚注保留“继续”的可能。
- source_word: וַיֵּצֵא דָוִד
  choice: 大卫就出战
  rationale: יצא本义为“出去”；在明确的军事语境中，“出战”自然传达其隐含目的，又不添加具体地点或差遣者。
- source_word: וַיִּלָּחֶם בַּפְּלִשְׁתִּים
  choice: 与非利士人交战
  rationale: 该动词与介词ב在此表示敌对交战；“与……交战”清楚自然，不会被误解为并肩作战。
- source_word: וַיַּךְ בָּהֶם מַכָּה גְדוֹלָה
  choice: 重创了他们
  rationale: נכה与מכה构成强调性的搭配，意为给予沉重打击。“重创”保留严重打击的力度，却不把原文未明说的伤亡程度解释成“大肆杀戮”。
- source_word: וַיָּנֻסוּ מִפָּנָיו
  choice: 他们便从他面前逃跑了
  rationale: מִפָּנָיו字面指“从他面前”；此译保留大卫临阵在场、敌军退逃的图景。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。用“战争又起”表达希伯来语习语，并以脚注保留“延续”与“再次发生”之间的真实歧义；“重创”避免过度限定伤亡规模。
