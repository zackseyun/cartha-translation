source:
  edition: WLC
  text: וַ/יָּשֶׂם֩ אֶת נַפְשׁ֨/וֹ בְ/כַפּ֜/וֹ וַ/יַּ֣ךְ אֶת הַ/פְּלִשְׁתִּ֗י וַ/יַּ֨עַשׂ יְהוָ֜ה תְּשׁוּעָ֤ה גְדוֹלָה֙ לְ/כָל יִשְׂרָאֵ֔ל רָאִ֖יתָ וַ/תִּשְׂמָ֑ח וְ/לָ֤/מָּה תֶֽחֱטָא֙ בְּ/דָ֣ם נָקִ֔י לְ/הָמִ֥ית אֶת דָּוִ֖ד חִנָּֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/005.yaml
  text: For he put his life in his hand and struck down the Philistine[a], and Yahweh brought about a great salvation for all Israel. You saw it and rejoiced[c][b]. So why should you sin against innocent blood by putting David to death for no reason?
translation:
  language: zh_hans
  text: 他把自己的性命放在手中[a]，击杀了那个非利士人；雅威为全以色列施行了极大的拯救[b]。你看见了，也很欢喜。你为什么要犯流无辜人血的罪，平白无故[c]杀死大卫呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“冒着生命危险”；直译为“把自己的性命放在手掌中”。
    reason: 说明希伯来语习语的字面意象及其含义。
  - marker: b
    text: “极大的拯救”也可译作“大胜利”或“极大的解救”。
    reason: תְּשׁוּעָה 在本段军事语境中可涵盖拯救、解救和胜利。
  - marker: c
    text: “平白无故”也可译作“无缘无故”或“没有理由”。
    reason: 说明 חִנָּם 在此处的语义范围。
lexical_decisions:
- source_word: וַיָּשֶׂם אֶת־נַפְשׁוֹ בְכַפּוֹ
  choice: 把自己的性命放在手中
  rationale: 保留希伯来语“把性命放在手掌中”的具体意象，同时用现代汉语可理解的表达传达冒生命危险之意。
- source_word: נַפְשׁוֹ
  choice: 自己的性命
  rationale: 这里 נֶפֶשׁ 指人在战斗中可能丧失的生命，并非特指与身体相对的“灵魂”。
- source_word: וַיַּךְ אֶת־הַפְּלִשְׁתִּי
  choice: 击杀了那个非利士人
  rationale: נכה 在此指大卫击倒并杀死歌利亚；“击杀”兼顾动作和致死结果。定冠词以“那个”体现，指上下文已知的非利士人。
- source_word: יְהוָה
  choice: 雅威
  rationale: 原文直接使用四字神名；“雅威”按其通常推定读音音译，保留专名性质而不以称号代替。
- source_word: וַיַּעַשׂ יְהוָה תְּשׁוּעָה גְדוֹלָה
  choice: 雅威施行了极大的拯救
  rationale: עשה 与抽象宾语连用表示成就或施行；תְּשׁוּעָה 在军事语境中兼有拯救、解救和胜利之义，“拯救”保留其较宽广的语义。
- source_word: רָאִיתָ וַתִּשְׂמָח
  choice: 你亲眼看见了，也很欢喜
  rationale: “亲眼”自然表达扫罗本人见证此事的强调意味；两个动词仍保持并列关系。
- source_word: וְלָמָּה תֶחֱטָא בְּדָם נָקִי
  choice: 你为什么还要犯流无辜人血的罪
  rationale: 该结构涉及杀害无辜者所招致的血债；汉语用“犯流无辜人血的罪”明确其法律与道德含义，并保持反问语气。
- source_word: לְהָמִית אֶת־דָּוִד חִנָּם
  choice: 平白无故杀死大卫
  rationale: המית 是使人死亡、杀死；חִנָּם 在此表示没有理由或正当缘由。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文使用神的专名而非 אֲדֹנָי 一类称号；正文采用音译“雅威”，避免把专名改成称号。“耶和华”是传统汉语形式，但所反映的元音组合并非该名字通常推定的古代读音。
- issue: 军事语境中 תְּשׁוּעָה 的译法
  choice: 极大的拯救
  alternative: 大胜利；极大的解救
  rationale: 事件确实是军事胜利，但该词也强调雅威使以色列脱离危难的行动；“拯救”保留这种语义张力，脚注列出合乎语境的其他译法。
- issue: בְּדָם נָקִי 所表达的罪责
  choice: 犯流无辜人血的罪
  alternative: 得罪无辜人的血
  rationale: 直译“在无辜的血上犯罪”在现代汉语中不够清楚；所选译法传达杀害无辜者造成血债的含义，但不额外判定司法程序等原文未说明的细节。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。保留“把性命放在手中”的希伯来语意象，并以脚注解释；“犯流无辜人血的罪”使原文的血债表达对普通读者清楚可懂。脚注标记均放在其实际所注释的词语之后。
