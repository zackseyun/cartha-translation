base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/020.yaml
  text: Then Saul sent messengers to seize David[a]. When they saw the company of prophets prophesying, with Samuel standing over them, the Spirit of God came upon Saul’s messengers[b], and they also prophesied.
translation:
  language: zh_hans
  text: 扫罗派使者去捉拿大卫。他们看见一群先知[a]正在说预言，撒母耳站在他们之上[b]。上帝的灵临到扫罗的使者，他们也说预言。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“一队先知”。原文指聚集在一起的一群人。
    reason: lexical_alternative
  - marker: b
    text: 或译“站在他们中间”。原文也可表示撒母耳处于他们之上，带领或监督他们。
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאָכִים / מַלְאֲכֵי
  choice: 使者
  rationale: 本叙事中指扫罗派出的人员，并非天使；“使者”既准确又符合现代汉语表达。
- source_word: לָקַחַת
  choice: 捉拿
  rationale: 该动词基本义为“取、拿”，但此处指奉扫罗之命拘捕大卫；“捉拿”自然传达敌对语境，又不过度扩写。
- source_word: לַהֲקַת הַנְּבִיאִים
  choice: 一群先知
  rationale: לַהֲקָה指聚集在一起的群体；“一群先知”简明自然，并保留群体含义。
- source_word: נִבְּאִים / וַיִּתְנַבְּאוּ
  choice: 正在说预言 / 也说起预言来
  rationale: 前者保留分词所表达的持续活动，后者保留事件的开始及גַּם“也”的强调；两处译法在汉语中自然对应。
- source_word: עֹמֵד נִצָּב עֲלֵיהֶם
  choice: 站在他们前面
  rationale: 该组合强调撒母耳稳固地站立，并处于相对于先知群体的显著位置；“前面”可兼容空间位置与带领意味，具体歧义交由脚注说明。
- source_word: רוּחַ אֱלֹהִים
  choice: 上帝的灵
  rationale: 此处指来自上帝并使人进入先知活动的神圣能力与临在；译文保留原文的神圣主体，不引入超出本文的系统教义界定。
- source_word: וַתְּהִי עַל
  choice: 临到
  rationale: 该表达描述上帝的灵来到人身上并使其有所行动；“临到”在现代中文圣经语体中庄重且易懂。
- source_word: וַיִּתְנַבְּאוּ גַּם הֵמָּה
  choice: 他们也说起预言来
  rationale: “也”保留גַּם的附加强调，突显扫罗的使者出乎意料地加入先知活动。
theological_decisions:
- issue: רוּחַ אֱלֹהִים在本叙事中的性质
  choice: 译作“上帝的灵临到扫罗的使者”
  alternative: “从上帝而来的一个灵临到扫罗的使者”
  rationale: 该短语在《撒母耳记》的相关语境中通常指上帝的灵施行有力的行动；这一译法保留上帝主动介入的神学力度，同时不把后期教义细节强加给经文。
translation_notes:
  register: 采用现代、庄重而通顺的叙事语体。“捉拿”明确表达上下文中的拘捕意图；“说预言”前后呼应。“站在他们前面”避免生硬直译，同时以脚注保留位置和领导角色之间的原文歧义。
