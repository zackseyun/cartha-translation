base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/013.yaml
  text: Then Michal took the household idol and laid it on the bed[b][a], and she put a cushion of goats’ hair at its head and covered it with the garment.
translation:
  language: zh_hans
  text: 米甲拿来家神像[a]，放在床上，又把一件山羊毛织物[b]放在它的头边，用衣服把它盖住。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“家神”“家庭偶像”或“神像”。希伯来语这个词指家庭祭祀所用的物件；这里看来是一个放在床上充作人形的神像。
    reason: lexical_alternative
  - marker: b
    text: 原文这个词组的确切含义不明，可能指山羊毛织成的覆盖物、网状物、垫子或类似物件，放在头部的位置。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַתְּרָפִים
  choice: 家神像
  rationale: 该词指家庭祭祀所用的神像或偶像，词形虽为复数，但本节语境把它作为床上的一个人形物件来安排；“家神像”既传达其祭祀性质，也符合此处单个形象的功能。
- source_word: אֶל הַמִּטָּה
  choice: 放在床上
  rationale: 介词 אֶל 常有“向、到、进入”之意，但与“放置”连用并结合伪装场景，现代汉语自然表达为“放在床上”。
- source_word: כְּבִיר הָעִזִּים
  choice: 一件山羊毛织物
  rationale: כְּבִיר 是罕见且含义不确定的词，可能指网状物、覆盖物、垫子或类似的编织品。“织物”保留材质和物件类别，同时避免无根据地确定其具体形制。
- source_word: מְרַאֲשֹׁתָיו
  choice: 放在它的头部
  rationale: 该表达指头部或枕头所在的位置；“它”就近指床上的家神像，并保留叙事中将其布置成人形的效果。
- source_word: בַּבָּגֶד
  choice: 盖上衣服
  rationale: בֶּגֶד 泛指衣服或衣物，带定冠词；汉语用“衣服”自然且不把它过度具体化为斗篷或被单。
- source_word: וַתְּכַס
  choice: 盖上
  rationale: 动词 כסה 的基本义是“遮盖、覆盖”；此处译作“盖上”简洁呈现米甲用衣物遮住神像的动作。
