  text: וַ/אֲנִ֨י אֵצֵ֜א וְ/עָמַדְתִּ֣י לְ/יַד אָבִ֗/י בַּ/שָּׂדֶה֙ אֲשֶׁ֣ר אַתָּ֣ה שָׁ֔ם וַ/אֲנִ֕י אֲדַבֵּ֥ר בְּ/ךָ֖ אֶל אָבִ֑/י וְ/רָאִ֥יתִי מָ֖ה וְ/הִגַּ֥דְתִּי לָֽ/ךְ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/003.yaml
  text: I will go out and stand beside my father in the field where you are[a], and I will speak to my father about you. Then I will see what happens and tell you.
translation:
  language: zh_hans
  text: 我要出去，在你所在的田野里站在我父亲身边，向我父亲谈起你；我会看看情况怎样[a]，再告诉你。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“我会看看什么”，是省略说法，也可理解为“我会看看会发生什么”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵצֵא
  choice: 我要出去
  rationale: 这是יצא的Qal未完成式第一人称单数，在语境中表达约拿单接下来打算采取的行动；“出去”自然保留其方向含义。
- source_word: וְעָמַדְתִּי לְיַד אָבִי
  choice: 站在我父亲身边
  rationale: עמד表示“站立”，לְיַד是“在……旁边”的惯用表达；合译既贴近原文，也符合现代汉语。
- source_word: בַּשָּׂדֶה אֲשֶׁר אַתָּה שָׁם
  choice: 在你所在的田野里
  rationale: 关系从句限定田野的位置；“你所在的”自然表达אַתָּה שָׁם，避免生硬重复“你在那里”。
- source_word: אֲדַבֵּר בְּךָ אֶל אָבִי
  choice: 向我父亲谈起你
  rationale: דבר ב某人在此意为谈论或提及某人，“谈起你”准确表达关乎大卫的谈话，并保持措辞自然。
- source_word: וְרָאִיתִי מָה
  choice: 我会看看情况怎样
  rationale: 原文直译为“我会看看什么”，是一种省略表达；“看看情况怎样”补足汉语所需成分，同时保留对结果尚未确定的意味。
- source_word: וְהִגַּדְתִּי לָךְ
  choice: 再告诉你
  rationale: נגד的Hiphil在此表示使人知道、告知；“再告诉你”自然体现观察之后报告的行动次序。
theological_decisions: []
translation_notes:
  register: 采用现代、清晰而庄重的叙事语体。“我父亲”按原文重复，以明确两项行动都以扫罗为对象；分号呈现谈话与随后察看、告知之间的推进关系。脚注标在“情况怎样”之后，使其对应希伯来文וְרָאִיתִי מָה。
