revisions:
- from: 约拿单告诉大卫说：“我父亲扫罗正想杀你。所以现在，请你早晨要小心防备，留在隐秘处[a]，把自己藏起来。”
  to: 约拿单告诉大卫说：“我父亲扫罗正设法杀你。现在，请你早晨务要小心，留在隐秘处[a]，藏好自己。”
  rationale: 修订“正想”为“正设法”，以准确反映扫罗持续寻求杀害大卫的意思；调整警告语序，使中文自然庄重；收窄脚注的替代译法，避免“暗处”所带来的非原文光线含义。保留原文在“隐秘处”与“藏好自己”之间的强调性重复，也不把“早晨”擅自具体化为“明天早晨”。
