  naturalness: “约拿单告诉大卫说”符合现代庄重叙事文体。“早晨务要小心”比“早晨要小心防备”更简洁自然；“藏好自己”自然地表达反身性的藏匿，并保留与前句“留在隐秘处”的刻意重复。
