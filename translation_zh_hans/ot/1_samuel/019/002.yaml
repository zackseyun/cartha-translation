base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/002.yaml
  text: Jonathan told David[a], saying, “Saul my father is seeking to kill you. So now, please be on your guard in the morning, and stay in a secret place and hide yourself.”
translation:
  language: zh_hans
  text: 约拿单告诉大卫说：“我父亲扫罗正设法杀你。现在，请你早晨务要小心，留在隐秘处[a]，藏好自己。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“留在隐蔽处”或“躲藏起来”。希伯来原文把“停留”与一个可指“隐秘、藏身处”的名词连用，随后又说“藏好自己”，以此加强语气。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגֵּד
  choice: 告诉
  rationale: 该词的使役词干在这里表示把消息告知某人；“告诉”自然、准确，也适合引出后面的直接引语。
- source_word: לֵאמֹר
  choice: 说
  rationale: 保留希伯来语引出直接引语的公式，与“告诉”连用虽略显重复，却符合庄重的叙事语体。
- source_word: מְבַקֵּשׁ
  choice: 正想
  rationale: 分词表达当前持续的意图。“正想”既体现正在形成或持续的杀害意图，又不擅自断定行动已经实施。
- source_word: לַהֲמִיתֶךָ
  choice: 杀你
  rationale: מות的使役形式意为使人死亡；此处直译为“杀你”，不加入正式处决的含义。
- source_word: הִשָּׁמֶר נָא
  choice: 请你……要小心防备
  rationale: 该命令式在语境中表示保护自己、提高警觉；“小心防备”清楚体现危险语境，且“请”表达נָא的劝请语气。
- source_word: בַבֹּקֶר
  choice: 早晨
  rationale: 按字面保留“早晨”，不根据上下文擅自明确为“明天早晨”。
- source_word: וְיָשַׁבְתָּ
  choice: 留在
  rationale: ישב可指坐、居住或停留；在躲避追杀的语境中，“留在”比字面的“坐在”更符合现代汉语。
- source_word: בַסֵּתֶר
  choice: 隐秘处
  rationale: סֵתֶר兼有隐蔽、秘密和藏身之处的含义；“隐秘处”保留其地点意义，并与下句的藏匿动作衔接。
- source_word: וְנַחְבֵּאתָ
  choice: 把自己藏起来
  rationale: 该词表示隐藏自己；此译保留反身含义，也让它与前面的“留在隐秘处”形成希伯来原文所具有的强调。
- source_word: יְהוֹנָתָן ... לְדָוִד ... שָׁאוּל אָבִי
  choice: 约拿单……大卫……我父亲扫罗
  rationale: 采用现代中文圣经中通行的人名译法；保留“我父亲”，呈现约拿单警告大卫时所处的亲情张力。
