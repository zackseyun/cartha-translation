  text: וְ/דָוִ֨ד בָּרַ֜ח וַ/יִּמָּלֵ֗ט וַ/יָּבֹ֤א אֶל שְׁמוּאֵל֙ הָ/רָמָ֔תָ/ה וַ/יַּ֨גֶּד ל֔/וֹ אֵ֛ת כָּל אֲשֶׁ֥ר עָֽשָׂה ל֖/וֹ שָׁא֑וּל וַ/יֵּ֤לֶךְ הוּא֙ וּ/שְׁמוּאֵ֔ל וַ/יֵּשְׁב֖וּ ב/נוית־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/018.yaml
  text: David fled and escaped[a], and he came to Samuel at Ramah and told him all that Saul had done to him. Then he and Samuel went and stayed at Naioth.
translation:
  language: zh_hans
  text: 大卫逃走，得以脱身。他来到拉玛见撒母耳，把扫罗对他所做的一切都告诉了撒母耳。随后，大卫和撒母耳一同前往拿约[a]，住在那里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “拿约”是希伯来语地名，可能指“住处”或一处与拉玛有关的聚落。
    reason: cultural_note
lexical_decisions:
- source_word: בָּרַח וַיִּמָּלֵט
  choice: 逃走，得以脱身
  rationale: 两个相连的动词分别表达逃离危险和成功脱身；译文保留二者，又不把后者解释为经文未明说的神圣拯救。
- source_word: הָרָמָתָה
  choice: 来到拉玛
  rationale: 词尾的方向标记表示朝拉玛而去；结合撒母耳是所见之人，译作“来到拉玛见撒母耳”符合现代汉语叙事。
- source_word: וַיַּגֶּד לוֹ
  choice: 告诉了撒母耳
  rationale: נגד 的使役式在此是“告诉、禀告”。明确复述撒母耳，避免连续代词在中文中产生指代不清。
- source_word: אֵת כָּל אֲשֶׁר עָשָׂה לוֹ שָׁאוּל
  choice: 扫罗对他所做的一切
  rationale: 保留 כָּל 的完整范围和“对他”的受事关系，不作扩充。
- source_word: וַיֵּלֶךְ הוּא וּשְׁמוּאֵל
  choice: 随后，大卫和撒母耳一同前往
  rationale: 显明原文并列的两个主体；“随后”自然承接希伯来叙事序列。
- source_word: וַיֵּשְׁבוּ
  choice: 住在那里
  rationale: ישׁב 在旅行叙事中表示停留、居住，而非字面的“坐”；“住在那里”自然明确。
- source_word: בְנוית
  choice: 拿约
  rationale: 按地名音译，不在正文中把名称可能具有的普通名词含义定死；相关信息置于脚注。
theological_decisions:
- issue: וַיִּמָּלֵט 是否含有神使其获救的意思
  choice: 得以脱身
  alternative: 蒙拯救
  rationale: 该动词在此说明逃脱成功，但本节没有明确指出施行拯救者；采用中性表达，以免加入经文未明说的神学因果。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。人名、地名使用简体中文圣经读者较熟悉的译名；为避免“他”连续出现造成歧义，第二处明确写出“撒母耳”和“大卫”。脚注标记紧随其实际说明的地名“拿约”。
