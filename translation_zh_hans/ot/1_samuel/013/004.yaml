base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/004.yaml
  text: And all Israel heard it said[a], “Saul has struck down the Philistine garrison[c][b], and Israel has also become odious to the Philistines.” Then the people were called out to join Saul at Gilgal.
translation:
  language: zh_hans
  text: 以色列众人都听说：“扫罗打击了非利士人的驻军[a]，以色列也成了非利士人厌恶的对象[b]。”于是百姓被召集起来，在吉甲跟随扫罗[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“非利士人的长官”或“非利士人的据点”。原文这个词既可指官员，也可指驻防的军队或据点；这里的军事语境较支持“驻军”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“以色列在非利士人中发臭了”，意即以色列成了他们憎恶、厌恶的对象。
    reason: lexical_alternative
  - marker: c
    text: 或译“百姓被召集到扫罗后面，在吉甲聚集”。原文很可能是指百姓被动员起来，跟随扫罗作战。
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמְעוּ לֵאמֹר
  choice: 听见消息说
  rationale: 这是引出传闻内容的表达；译作“听见消息说”既保留“听见—说”的结构，也符合现代汉语习惯。
- source_word: הִכָּה
  choice: 击败了
  rationale: נכה 的基本义是“击打”；在军事语境中可指重创或击败。此处译作“击败了”，表达对非利士驻军的军事行动，又不额外断定其被全部消灭。
- source_word: נְצִיב פְּלִשְׁתִּים
  choice: 非利士人的驻军
  rationale: נְצִיב 既可能指官员，也可能指设置的军事据点或驻军。结合上下文的军事冲突，正文采用“驻军”，并在脚注保留其他可能。
- source_word: נִבְאַשׁ
  choice: 成了……厌恶的对象
  rationale: 该词字面上带有“发臭”的意象，引申为变得可憎、令人厌恶。正文用自然汉语表达其比喻意义，脚注说明原文意象。
- source_word: בַּפְּלִשְׁתִּים
  choice: 非利士人……的对象
  rationale: 介词在此标示非利士人对以色列的负面看法；这一句式自然传达“在非利士人看来可憎”的关系。
- source_word: וַיִּצָּעֲקוּ
  choice: 被召集起来
  rationale: 该动词通常与呼喊、召集有关；在军事语境中表示征召、集结百姓。采用被动式，符合此处百姓被动员的含义。
- source_word: אַחֲרֵי שָׁאוּל
  choice: 跟随扫罗
  rationale: 字面是“在扫罗之后”，在集结出战的语境中表示归队跟随扫罗，避免误读为时间上的“扫罗之后”。
- source_word: הַגִּלְגָּל
  choice: 在吉甲
  rationale: 此处将吉甲理解为百姓集结并跟随扫罗的地点；地名采用通行译法“吉甲”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“听见消息说”保留希伯来语传闻公式；“驻军”“厌恶的对象”“被召集起来”兼顾军事语境和汉语自然度。脚注保留 נְצִיב 的人物／军事设施歧义、נִבְאַשׁ 的嗅觉隐喻，以及 וַיִּצָּעֲקוּ אַחֲרֵי 的召集含义。
