base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/022.yaml
  text: So on the day of battle[a], not a sword or spear was found in the hand of any of the people who were with Saul and Jonathan; but Saul and his son Jonathan had them.
translation:
  language: zh_hans
  text: 到了交战的日子[a]，扫罗和他儿子约拿单身边的众人手里，连一把刀剑或一支矛也没有；只有扫罗和他儿子约拿单手里有这些兵器。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文较直译为：“到了交战的日子，扫罗和约拿单身边的众人手里，没有找到刀剑和矛。”这里的否定表达是说，军中没有一个人拥有这两类兵器。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: 到了
  rationale: 承接上文所述局势并引出其在交战之日造成的结果；现代汉语用“到了”自然地保留叙事推进和时间转换。
- source_word: בְּיוֹם מִלְחֶמֶת
  choice: 交战的日子
  rationale: בְּיוֹם 表示具体时间，מִלְחֶמֶת 指战争或战斗；此处语境是双方即将交锋，译为“交战的日子”准确而自然。
- source_word: לֹא נִמְצָא
  choice: 也没有
  rationale: 原文为מצא的尼法勒式，直译为“没有被找到”；结合“手里”这一拥有结构，现代汉语用“没有”自然表达无人持有兵器的结果。
- source_word: חֶרֶב וַחֲנִית
  choice: 一把刀或一支矛
  rationale: 希伯来语连接词字面为“和”，但在否定范围内具有分配意义，即两类兵器任何一种都没有；汉语用“或”并配合量词，可清楚表达这一点。
- source_word: בְּיַד כָּל הָעָם
  choice: 众人手里
  rationale: 保留“在手中”的具体意象，同时按否定句的语义将כָּל理解为其中任何人都没有，而不是仅作集合性陈述。
- source_word: אֲשֶׁר אֶת שָׁאוּל וְאֶת יוֹנָתָן
  choice: 跟随扫罗和约拿单的
  rationale: 此处אֵת表示伴随、同在；“跟随”适合军队语境，也比生硬的“与……在一起”更自然。
- source_word: וַתִּמָּצֵא לְשָׁאוּל וּלְיוֹנָתָן בְּנוֹ
  choice: 只有扫罗和他儿子约拿单手里有这些兵器
  rationale: לְ表示兵器归他们持有或可供他们使用。阴性单数动词概括承接前述兵器，汉语明确补出“这些兵器”，并用“只有”呈现与众人的对比。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“手里”保留原文关于持有兵器的具体表达；“连……也没有；只有……”清楚呈现原句的强烈对比。
