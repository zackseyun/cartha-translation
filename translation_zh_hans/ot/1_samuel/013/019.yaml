  text: וְ/חָרָשׁ֙ לֹ֣א יִמָּצֵ֔א בְּ/כֹ֖ל אֶ֣רֶץ יִשְׂרָאֵ֑ל כִּֽי אמר פְלִשְׁתִּ֔ים פֶּ֚ן יַעֲשׂ֣וּ הָ/עִבְרִ֔ים חֶ֖רֶב א֥וֹ חֲנִֽית־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/019.yaml
  text: No blacksmith could be found in all the land of Israel[a], because the Philistines said, “Otherwise the Hebrews will make swords or spears.”
translation:
  language: zh_hans
  text: 以色列全境找不到一个铁匠，因为非利士人说：“不然，希伯来人就会制造剑或矛。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“免得希伯来人制造一把剑或一支矛。”希伯来文的“剑”和“矛”均为单数，在这里可作泛指。
    reason: 保留פֶּן较为形式对应的译法，并呈现兵器名词单数的另一种译法。
lexical_decisions:
- source_word: חָרָשׁ
  choice: 铁匠
  rationale: 该词可泛指工匠，但上下文涉及制造兵器及修整农具，因此这里特指从事金属锻造的工匠。
- source_word: יִמָּצֵא
  choice: 找不到
  rationale: 尼法勒式表达“被找到、存在”；“找不到”自然地传达以色列境内没有这类工匠的状况。
- source_word: בְּכֹל אֶרֶץ יִשְׂרָאֵל
  choice: 以色列全境
  rationale: 简洁而准确地表达整个以色列地域。
- source_word: כִּי
  choice: 因为
  rationale: 引出以色列境内没有铁匠的原因。
- source_word: אמר
  choice: 说
  rationale: 希伯来文完成式在叙事中可用普通过去意义理解；现代汉语无需另加“曾经”或“早已”。
- source_word: פֶּן
  choice: 不然
  rationale: 该词引出非利士人试图防止的后果；“不然”符合直接引语中的自然汉语，同时保留“免得”的语义。
- source_word: הָעִבְרִים
  choice: 希伯来人
  rationale: 原文明确使用“希伯来人”，常见于外族视角或族群关系语境，不改作“以色列人”。
- source_word: יַעֲשׂוּ
  choice: 就会制造
  rationale: 表达非利士人所预期并企图防止的结果；“就会”与前面的“不然”自然衔接。
- source_word: חֶרֶב אוֹ חֲנִית
  choice: 刀剑或长矛
  rationale: 原文两个名词均为单数，但在这里泛指兵器种类；汉语不强制标示单复数。“刀剑”传达古代作战用刃兵器，“长矛”则明确指长柄刺击兵器。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“以色列全境”避免生硬直译；直接引语用“不然……就会……”自然呈现非利士人的防范动机。脚注标记置于其所说明的引语之后。
