base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/012.yaml
  text: So I said[a], ‘Now the Philistines will come down against me at Gilgal[b], and I have not sought the favor of Yahweh.’ So I forced myself and offered up the burnt offering.
translation:
  language: zh_hans
  text: 我说：“现在非利士人要下到吉甲来攻击我，而我还没有求耶和华恩待我[a]。”于是我勉强自己[b]，献上了燔祭。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译：“我还没有恳求耶和华的面。”这是寻求耶和华恩待、施恩的说法。
    reason: lexical_alternative
  - marker: b
    text: 或译：“我克制了自己。”原文动词可指约束、控制自己；按这里的语境，也可指扫罗迫使自己采取行动。
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר
  choice: 我心里想
  rationale: 原文直译为“我说”，这里引出扫罗当时内心的判断；现代汉语用“我心里想”自然地表达这种自语，同时保留叙事推进作用。
- source_word: עַתָּה יֵרְדוּ פְלִשְׁתִּים אֵלַי הַגִּלְגָּל
  choice: 非利士人现在就要下到吉甲来攻击我了
  rationale: 保留 ירד“下去、下来”的地理方向感；אֵלַי 在军事语境中表示敌对行动，译作“来攻击我”。“就要”传达扫罗所感到的紧迫性。
- source_word: וּפְנֵי יְהוָה לֹא חִלִּיתִי
  choice: 我却还没有求耶和华施恩
  rationale: חלה 与“面”连用，是恳求某人恩待、求取 favor 的习语。译作“求耶和华施恩”比逐字翻译“恳求耶和华的面”更符合现代汉语，并以脚注保留原文意象。
- source_word: וָאֶתְאַפַּק
  choice: 于是我勉强自己
  rationale: התאפק 可表达克制自己，也可在此语境中表示迫使自己采取本不愿采取的行动。“勉强自己”贴合扫罗为自己辩解的语气，同时以脚注保留另一可能。
- source_word: וָאַעֲלֶה הָעֹלָה
  choice: 献上了燔祭
  rationale: עלה 与 עֹלָה 构成献祭用语；“献上燔祭”是准确、自然且通行的汉语表达。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用以色列神的专名 יהוה。正文采用现代中文圣经读者最熟悉的专名形式“耶和华”，不以“主”这一称号代替，也不据本节加入额外神学解释。
- issue: 扫罗所称“求耶和华施恩”的性质
  choice: 保留为扫罗对自己献祭行为的解释
  alternative: 将其解释为对献祭行为的认可或谴责
  rationale: 本节记录扫罗的自辩；译文不把“求施恩”扩展为神认可其行为，也不在本节内部预先加入撒母耳随后作出的评判。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“我心里想”呈现扫罗的内在判断；“却还没有”和“于是”清楚连接他自述的理由与行动。正文中的脚注标记与对应注释一致。
