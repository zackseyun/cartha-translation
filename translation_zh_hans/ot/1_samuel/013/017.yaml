base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/017.yaml
  text: And raiders came out from the camp of the Philistines in three companies[a]. One company turned toward the road to Ophrah[b], toward the land of Shual.
translation:
  language: zh_hans
  text: 有劫掠队[a]从非利士人的营中出来，共有三队[b]。其中一队转向通往俄弗拉的路，朝书亚地。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“毁灭者”或“施行毁灭的队伍”；这里指从非利士人营中出动的劫掠部队。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译为“三个头”，下句为“一个头”；这是指各支分队的说法。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּשְׁחִית
  choice: 劫掠队
  rationale: 该词字面意为“毁灭者”或“施行毁灭的队伍”，在此军事语境中是集合用法，指从非利士营中出动、随后分成三队的袭掠力量。
- source_word: שְׁלֹשָׁה רָאשִׁים
  choice: 分成三队
  rationale: 字面为“三个头”，在这里指三支分队；译作“分成三队”既表达希伯来习语的实际含义，也自然衔接下文。
- source_word: הָרֹאשׁ אֶחָד
  choice: 其中一队
  rationale: 与上文“三个头”属于同一军事分队习语；加“其中”使现代汉语叙述清楚自然。
- source_word: יִפְנֶה
  choice: 转向
  rationale: 该动词意为“转向、面向”；这里说明一队所取的行进方向。
- source_word: דֶּרֶךְ עָפְרָה
  choice: 通往俄弗拉的路
  rationale: דֶּרֶךְ 指道路或路线；此处表达朝俄弗拉方向延伸的道路。
- source_word: אֶרֶץ שׁוּעָל
  choice: 书亚地
  rationale: אֶרֶץ 可指土地或地区；“书亚地”简洁地保留其地域名称性质。
- source_word: פְלִשְׁתִּים
  choice: 非利士人
  rationale: 采用现代中文圣经语境中通行的人群名称音译。
- source_word: עָפְרָה
  choice: 俄弗拉
  rationale: 地名按现代中文圣经传统音译，不翻译其可能的词义。
- source_word: שׁוּעָל
  choice: 书亚
  rationale: 地区名称按现代中文圣经传统音译，不翻译其字面词义。
