source:
  edition: WLC
  text: וְ/עַתָּ֖ה מַמְלַכְתְּ/ךָ֣ לֹא תָק֑וּם בִּקֵּשׁ֩ יְהוָ֨ה ל֜/וֹ אִ֣ישׁ כִּ/לְבָב֗/וֹ וַ/יְצַוֵּ֨/הוּ יְהוָ֤ה לְ/נָגִיד֙ עַל עַמּ֔/וֹ כִּ֚י לֹ֣א שָׁמַ֔רְתָּ אֵ֥ת אֲשֶֽׁר צִוְּ/ךָ֖ יְהוָֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/014.yaml
  text: But now your kingdom will not endure[a]. Yahweh has sought for himself a man according to his own heart, and Yahweh has appointed him ruler over his people[c][b], because you have not kept what Yahweh commanded you.
translation:
  language: zh_hans
  text: 但现在，你的王权必不能长久[a]。耶和华已经为自己寻找了一个合他心意的人[b]，并立他作自己百姓的领袖[c]，因为你没有遵守耶和华吩咐你的事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“必不能坚立。”
    reason: 保留 לֹא תָקוּם 中“站立、确立”的较直译表达。
  - marker: b
    text: 直译：“一个照着他心意的人”；按上下文，“他”最自然地指耶和华。
    reason: 说明希伯来语表达及最自然的代词所指，同时不把“合心意”扩展为经文未明说的内容。
  - marker: c
    text: “自己百姓”指耶和华的百姓。
    reason: 明确 עַמּוֹ 的所属代词所指。
lexical_decisions:
- source_word: וְעַתָּה
  choice: 但现在
  rationale: 结合上文，这是从本可坚立的王权转入审判宣告；“但现在”自然表达语境中的转折。
- source_word: מַמְלַכְתְּךָ
  choice: 你的王权
  rationale: 此处主要指扫罗的君王统治及其延续，而非疆域意义上的国家；“王权”更准确。
- source_word: לֹא תָקוּם
  choice: 必不能长久
  rationale: 动词本义为“站立、确立”，在王权语境中表示不能持续稳立；正文采用自然汉语，并以脚注保留较直译的表达。
- source_word: בִּקֵּשׁ יְהוָה לוֹ
  choice: 耶和华已经为自己寻得
  rationale: 完成式把行动呈现为已经实现；“为自己”保留 לוֹ，强调耶和华按自己的旨意拣选。语境中的寻求已经指向选定，故译“寻得”。
- source_word: אִישׁ כִּלְבָבוֹ
  choice: 一个合他心意的人
  rationale: 这是现代汉语中自然且庄重的表达，保留“按照他的心”的含义，不把它扩展为经文未明说的品格判断或完全顺服。
- source_word: וַיְצַוֵּהוּ יְהוָה
  choice: 立他作
  rationale: צוה 常指吩咐，但与 לְנָגִיד 连用时表示委任某人担任职分；“立他作”符合王权语境。
- source_word: לְנָגִיד
  choice: 领袖
  rationale: נָגִיד 指被置于权柄地位的人；“领袖”避免把它过早技术化为“君王”或带入后来的头衔含义。
- source_word: עַל עַמּוֹ
  choice: 百姓
  rationale: 所属代词指耶和华。汉语正文承接前句主语即可自然理解；脚注明示这是耶和华的百姓。
- source_word: לֹא שָׁמַרְתָּ אֵת אֲשֶׁר צִוְּךָ יְהוָה
  choice: 你没有遵守耶和华吩咐你的事
  rationale: “遵守”准确表达 שׁמר 对命令的持守，并保留“耶和华吩咐你的事”这一原文结构。
theological_decisions:
- issue: כִּלְבָבוֹ 中“他的心”所指
  choice: 正文译“合他心意”，其中“他”指耶和华
  alternative: 把代词理解为所寻得之人的心，或较机械地译为“照着他的心”
  rationale: 句法和上下文最自然地把代词连于耶和华，表明所拣选的人符合耶和华的心意；但不扩写成“凡事遵行他的旨意”，以免引入本节没有明说的解释。
- issue: נָגִיד 的职分含义
  choice: 译为“领袖”
  alternative: “君王”“统治者”或“王子”
  rationale: 该词在此强调耶和华委任其治理百姓，不宜加入超出本段的王朝、弥赛亚或后世头衔意味。
- issue: 审判针对“王权”的范围
  choice: 译文只说扫罗的王权不能长久
  alternative: 明确扩写为扫罗的王朝、家系或个人统治即刻终止
  rationale: ממלכה 在语境中可能涉及统治及王朝延续；正文保留一定宽度，不把审判具体化到原文未明说的时间和范围。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“王权”比“国”更贴合此处统治及其延续的含义；“合他心意”是自然汉语，同时以脚注保存原文措辞；全节避免古奥句式和后设神学扩写。
