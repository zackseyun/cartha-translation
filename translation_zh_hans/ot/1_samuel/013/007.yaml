base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/007.yaml
  text: And Hebrews crossed over the Jordan into the land of Gad and Gilead[a]. But Saul was still at Gilgal[b], and all the people trembled behind him.
translation:
  language: zh_hans
  text: 希伯来人渡过约旦河，进入迦得和基列之地[a]。扫罗仍在吉甲，众百姓都战战兢兢地跟在他后面[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “希伯来人”或可理解为“以色列人”；原文用“希伯来人”，在本段叙事中可能是族群色彩较鲜明的称呼。
    reason: lexical_alternative
  - marker: b
    text: “跟在他后面”也可译作“跟随他”。
    reason: lexical_alternative
lexical_decisions:
- source_word: עִבְרִים
  choice: 希伯来人
  rationale: 原文明确使用“希伯来人”，可能是带有族群色彩的称呼，也可能在此指以色列人中的一部分；正文保留原词，不把其所指范围提前解释确定。
- source_word: עָבְרוּ אֶת הַיַּרְדֵּן
  choice: 过了约旦河
  rationale: עבר与“约旦河”连用表示渡过河流；现代汉语用“过了约旦河”自然简洁。
- source_word: אֶרֶץ גָּד וְגִלְעָד
  choice: 到了迦得和基列地
  rationale: אֶרֶץ可指土地或地域；“迦得和基列地”保留地理名称，而补出“到了”使汉语清楚表达渡河后的去向。
- source_word: עוֹדֶנּוּ
  choice: 仍在
  rationale: 该形式表达持续状态，说明扫罗当时还留在吉甲。
- source_word: בַגִּלְגָּל
  choice: 在吉甲
  rationale: 用现代汉语通常的地点介词表达。
- source_word: חָרְדוּ
  choice: 战战兢兢
  rationale: 该动词描写因恐惧而发抖；“战战兢兢”既保留身体颤抖的形象，也符合庄重叙事语体。
- source_word: אַחֲרָיו
  choice: 跟在他后面
  rationale: 兼顾“在后面”与“跟随”两层可能含义，避免只按空间关系或忠诚追随单方面理解。
