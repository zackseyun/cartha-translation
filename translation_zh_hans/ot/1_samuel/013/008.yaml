base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/008.yaml
  text: He waited seven days[a], until the appointed time that Samuel had set, but Samuel did not come to Gilgal[b], and the people were scattering from him.
translation:
  language: zh_hans
  text: 扫罗等了七天，直到撒母耳所定的时间[a]；可是撒母耳没有来到吉甲，百姓便纷纷离开他[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语此处的关系从句省略了动词，字面近于“直到撒母耳……的期限”；译文按上下文补出“所定的”。
    reason: lexical_alternative
  - marker: b
    text: “他”指扫罗；百姓正在陆续离开扫罗，四散而去。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּיחֶל
  choice: 等了
  rationale: 此处指扫罗在一段时间内等候，与后面的“七天”相配；不是抽象意义上的“盼望”。
- source_word: שִׁבְעַת יָמִים
  choice: 七天
  rationale: 直接表达等候持续的时间。
- source_word: לַמּוֹעֵד
  choice: 直到……所定的时间
  rationale: מוֹעֵד指预先指定的时刻；结合上下文，介词短语表达扫罗一直等到约定时间。
- source_word: אֲשֶׁר שְׁמוּאֵל
  choice: 撒母耳所定的
  rationale: 希伯来语关系从句有所省略，汉语须补出隐含的动作；上下文表明这个时间是撒母耳预先定下的。
- source_word: וְלֹא בָא שְׁמוּאֵל הַגִּלְגָּל
  choice: 可是撒母耳没有来到吉甲
  rationale: “可是”自然呈现语境中的转折：约定时间已到，撒母耳却尚未出现。
- source_word: וַיָּפֶץ הָעָם
  choice: 百姓便纷纷离开
  rationale: 动词表示人群分散；“纷纷”体现众人正在陆续散去的叙事状态。
- source_word: מֵעָלָיו
  choice: 他
  rationale: 保留原文代词；按上下文所指为扫罗，并以脚注说明。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而自然的叙事语言。“扫罗”补明希伯来语隐含的主语，便于单节阅读；“纷纷离开他”既传达四散之意，也保留百姓从扫罗身边散去的关系含义。
