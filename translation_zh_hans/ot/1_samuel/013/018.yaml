base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/018.yaml
  text: and one company turned toward the road to Beth-horon[a], and one company turned toward the road of the border that overlooks the Valley of Zeboim[b], toward the wilderness.
translation:
  language: zh_hans
  text: 一队转向通往伯和仑的路[a]；另一队转向通往那边界的路；那边界俯瞰洗波音谷[b]，朝着旷野。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “一队”直译为“一个头”，在这里也可译作“一支分队”或“一支小队”。
    reason: lexical_alternative
  - marker: b
    text: “洗波音”很可能是地名；其原文词语可能与“鬣狗”有关。
    reason: cultural_note
lexical_decisions:
- source_word: הָרֹאשׁ אֶחָד
  choice: 一队
  rationale: רֹאשׁ本义为“头”，但在本段军事语境中指劫掠队伍的一支；译作“一队”简明自然，也保留其分队之意。
- source_word: יִפְנֶה
  choice: 转向
  rationale: פנה表示转身或转向；用于军队移动时，“转向”既贴近原文，也自然表达行进方向。
- source_word: דֶּרֶךְ
  choice: 路
  rationale: דֶּרֶךְ在此指实际行进路线，译作“路”具体而自然。
- source_word: בֵּית חֹרוֹן
  choice: 伯和仑
  rationale: 地名按现代中文圣经常见音译处理。
- source_word: הַגְּבוּל
  choice: 边界
  rationale: גְּבוּל可指边界、疆界；此处处于地形路线描述中，采用中性的“边界”。
- source_word: הַנִּשְׁקָף
  choice: 俯瞰
  rationale: שׁקף的Nifal分词在这里描写居高临下、可俯视谷地的位置；“俯瞰”凝练地传达该地形关系。
- source_word: גֵּי הַצְּבֹעִים
  choice: 洗波音谷
  rationale: 该短语在此应作地名处理，因此将צְבֹעִים音译为“洗波音”；其词源可能与“鬣狗”有关，另以脚注说明。
- source_word: הַמִּדְבָּרָה
  choice: 通往旷野
  rationale: מִדְבָּר所带方向词尾表示朝向旷野；结合דֶּרֶךְ，译作“通往旷野”符合现代汉语路线表达。
theological_decisions: []
