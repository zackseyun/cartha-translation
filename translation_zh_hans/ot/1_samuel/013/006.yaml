  source_fidelity: 译文整体准确呈现了以色列人因困境和受压而躲藏，以及五类藏身地点。惟“民众”在现代汉语中较易指一般公众，未能充分承载原文 הָעָם 在本段中指以色列百姓这一群体的叙事用法；“遭受重压”也比“受到逼迫”更贴近 נִגַּשׂ 所表达的受压、被催逼，而不额外引入迫害意味。
  naturalness: 原句的两个“因为”及重复的“民众”反映了希伯来文的压缩和重复，但“百姓”更符合庄重、现代而通顺的圣经叙事语体。“看见”也比单音节“见”更自然，同时不改变原文的基本感知动词。
  terminology: “以色列人”“洞穴”“荆棘丛”“岩石间”“地窖”“坑里”均可保留。“百姓”是 הָעָם 在此军事危局中较合适的对应词。关于 צְרִחִים 的不确定性，正文保留“地窖”，脚注保留地下空间、洞穴及堡垒等可能解释，处理审慎。
