  rationale: 仅作轻微措辞调整：以“百姓”对应重复出现的 הָעָם，并以“遭受重压”较准确表达被动动词 נִגַּשׂ 的军事压力；将“见”改为“看见”、“处境危急”改为“陷入困境”，使译文更合现代标准汉语。地点名词及其脚注锚点均保留，罕见词 צְרִחִים 的歧义未在正文中武断消除。
