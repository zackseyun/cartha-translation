  text: וְ/אִ֨ישׁ יִשְׂרָאֵ֤ל רָאוּ֙ כִּ֣י צַר ל֔/וֹ כִּ֥י נִגַּ֖שׂ הָ/עָ֑ם וַ/יִּֽתְחַבְּא֣וּ הָ/עָ֗ם בַּ/מְּעָר֤וֹת וּ/בַֽ/חֲוָחִים֙ וּ/בַ/סְּלָעִ֔ים וּ/בַ/צְּרִחִ֖ים וּ/בַ/בֹּרֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/006.yaml
  text: When the men of Israel saw that they were in trouble[a], because the people were hard pressed, the people hid themselves in caves, in thickets, among rocks, in strongholds[c][b], and in pits.
translation:
  language: zh_hans
  text: 以色列人看见自己陷入困境，因为百姓遭受重压，百姓就躲藏在洞穴、荆棘丛[a]、岩石间、地窖[b]和坑里[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “荆棘丛”或译“灌木丛”；希伯来语这个词十分罕见，可能特指带刺的灌木。
    reason: lexical_alternative
  - marker: b
    text: “地窖”或译“地下洞室”“洞穴”，也可能指“堡垒”；希伯来语这个词的确切含义不能确定。
    reason: lexical_alternative
  - marker: c
    text: “坑”或译“蓄水池”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ יִשְׂרָאֵל
  choice: 以色列人
  rationale: אִישׁ虽为单数形式，却与复数动词רָאוּ连用，在此具有集合或逐一分配的意义；“以色列人”自然地表达这一群体所指。
- source_word: רָאוּ
  choice: 见
  rationale: 保留动词“看见、见到”的基本感知意义；下文说明他们所察觉的处境。
- source_word: כִּי צַר לוֹ
  choice: 见自己处境危急
  rationale: 原文是压缩的单数表达，承接集合主语；译文用“自己”保留回指关系，并以“处境危急”自然传达צַר לוֹ所表示的困窘和危难。
- source_word: כִּי נִגַּשׂ הָעָם
  choice: 因为民众受到逼迫
  rationale: נגשׂ的被动词形表示被催逼、压迫或逼迫；“受到逼迫”既保留被动意味，也适合当时的军事压力语境。
- source_word: וַיִּתְחַבְּאוּ
  choice: 就藏在
  rationale: 该反身词形表示躲藏起来；汉语“藏在”结合随后的一系列地点，表达自然清楚。
- source_word: בַּמְּעָרוֹת
  choice: 洞穴
  rationale: מְעָרָה通常指天然洞穴，此处译作“洞穴”准确而通顺。
- source_word: וּבַחֲוָחִים
  choice: 荆棘丛
  rationale: חֲוָחִים是罕见词，通常被理解为带刺的灌木或浓密草木；“荆棘丛”具体呈现其最可能的意义，同时用脚注说明不确定性。
- source_word: וּבַסְּלָעִים
  choice: 岩石间
  rationale: סֶלַע可指岩石、峭壁或岩壁；在藏身地点的并列清单中，“岩石间”自然且不过度限定地貌。
- source_word: וּבַצְּרִחִים
  choice: 地窖
  rationale: צְרִחִים罕见且词义不确定，可能指地下室、地下洞室或洞穴，也有人理解为堡垒；正文采用适合作为藏身处的“地窖”，并在脚注保留其他可能。
- source_word: וּבַבֹּרוֹת
  choice: 坑里
  rationale: בּוֹר可指坑、蓄水池或井状坑穴；“坑”是较宽泛的表达，不预设其原本是否用于储水。
