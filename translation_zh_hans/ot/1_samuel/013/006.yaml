    rationale: הָעָם 在此是以色列百姓/军民这一群体，不是现代意义的“民众”；נִגַּשׂ 的重点是被压迫、受重压或被逼迫。“百姓遭受重压”既保留被动压力，也避免把语义收窄为宗教或政治性的“迫害”。
