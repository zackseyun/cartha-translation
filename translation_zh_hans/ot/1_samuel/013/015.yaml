base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/015.yaml
  text: Then Samuel arose and went up from Gilgal to Gibeah of Benjamin[a], and Saul counted the people who were present with him, about six hundred men.
translation:
  language: zh_hans
  text: 于是，撒母耳起身，从吉甲上到便雅悯的基比亚[a]。扫罗数点与他同在的人，约有六百名男子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本和译本作“便雅悯的迦巴”，而不是“便雅悯的基比亚”。此处希伯来文本作“便雅悯的基比亚”。
    reason: textual_variant
lexical_decisions:
- source_word: וַיָּקָם
  choice: 起身
  rationale: קום的Qal叙事形式表示“起来、起身”；此处用“起身”自然承接后续行动，又不把词义缩减为单纯“出发”。
- source_word: וַיַּעַל
  choice: 上到
  rationale: עלה保留向上行进的方向意味；“上到”在现代汉语中既自然，也比单用“去”更贴近原文。
- source_word: מִן הַגִּלְגָּל
  choice: 从吉甲
  rationale: 介词短语清楚表明出发地点，按常用圣经地名音译为“吉甲”。
- source_word: גִּבְעַת בִּנְיָמִן
  choice: 便雅悯的基比亚
  rationale: 马所拉文本的元音指向“便雅悯的基比亚”；按目的地理解，并将其他见证的“迦巴”读法置于脚注。
- source_word: וַיִּפְקֹד
  choice: 数点
  rationale: פקד在此军事语境中指清点人数。“数点”准确而庄重，也不额外暗示正式整编军队。
- source_word: הָעָם
  choice: 人
  rationale: עם本义较宽，指“人民、人群”；此处语境是跟随扫罗的人员，译作“人”自然，并避免不必要地限定为职业军队。
- source_word: הַנִּמְצְאִים עִמּוֹ
  choice: 跟他在一起的
  rationale: מצא的Niphal分词字面为“被发现、在场”；这里惯用意义是当时与扫罗同在的人，不擅自强化为“仍然留下的人”。
- source_word: כְּשֵׁשׁ מֵאוֹת אִישׁ
  choice: 约有六百名
  rationale: 前缀כ表示约数；איש用于男性人员计数，但汉语在前文已有“人”的情况下以“六百名”表达自然，并符合军事场景。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“于是”承接希伯来语连续叙事；地名使用简体中文圣经常见译名。保留“上到”的地势方向感，并在脚注中交代“基比亚／迦巴”的文本异读。
