base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/010.yaml
  text: And it happened[a], as soon as he had finished offering up the burnt offering, that behold, Samuel came. And Saul went out to meet him, to bless him.
translation:
  language: zh_hans
  text: 他刚献完燔祭，看哪，撒母耳就来了。扫罗出去迎接他，要祝福他[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“向他问安”。这里的希伯来语动词直译为“祝福”，但在见面场合也可指正式问候。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: （不单独译出）
  rationale: 这是希伯来叙事中承接下一事件的常用形式；现代汉语可借句子推进自然表达，无须机械译作“事情是这样”。
- source_word: כְּכַלֹּתוֹ
  choice: 刚……完
  rationale: 介词כְּ加不定式结构表示时间关系；结合上下文，用“刚……完”自然体现动作完成后紧接着发生下一事件。
- source_word: לְהַעֲלוֹת הָעֹלָה
  choice: 献完燔祭
  rationale: עלה的使役式与祭物עֹלָה连用，指把燔祭献上；“献燔祭”是清楚、通行的汉语祭祀术语。
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留原文提示突发情况并增强现场感的叙事标记；“看哪”庄重且为普通读者可理解。
- source_word: שְׁמוּאֵל בָּא
  choice: 撒母耳就来了
  rationale: “来了”直接表达בָּא；“就”与前面的“刚”配合，体现紧接发生，同时保持原文的鲜明叙述。
- source_word: וַיֵּצֵא שָׁאוּל לִקְרָאתוֹ
  choice: 扫罗出去迎接他
  rationale: 既保留יצא的向外移动，也自然表达לִקְרָאתוֹ所指的迎面相见。
- source_word: לְבָרֲכוֹ
  choice: 要向他祝福
  rationale: ברך的基本义是“祝福”；目的结构以“要”表达。此处也可能是正式问候，因此用脚注保留语用上的另一可能。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而自然的叙事语言。“刚……完……就……”表达原文紧密的时间承接；保留“看哪”以呈现突然而鲜明的现场感。脚注标记已在正文对应位置出现。
