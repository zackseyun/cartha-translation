base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/003.yaml
  text: Jonathan struck down the Philistine garrison that was at Geba[a], and the Philistines heard of it. Then Saul blew the ram's horn throughout all the land, saying[b], “Let the Hebrews hear!”
translation:
  language: zh_hans
  text: 约拿单袭击了驻扎在迦巴的非利士守军[a]，非利士人听说了这事。随后，扫罗在全境吹响羊角号[b]，说：“希伯来人要听见！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“非利士人的长官”。希伯来语原词既可指官员，也可指驻军或军事据点；这里按军事语境译为“守军”。
    reason: lexical_alternative
  - marker: b
    text: 或译“号角”。希伯来语指用动物角制成的号，传统上常用公羊角。
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּךְ
  choice: 击溃了
  rationale: נכה表示击打、重创，在军事叙事中常指有力或决定性的打击。“击溃”自然地表达对守军的军事行动，又不具体断言每个人都被杀死。
- source_word: נְצִיב פְּלִשְׁתִּים
  choice: 非利士守军
  rationale: נְצִיב既可指官员，也可能指驻军或军事据点；上下文是军事冲突，正文采用“守军”，同时用脚注保留“长官”的可能。
- source_word: בְּגֶבַע
  choice: 驻在迦巴
  rationale: 将介词与“守军”自然结合，表明其所在地，而不武断说明事件发生在城内的具体位置。
- source_word: וַיִּשְׁמְעוּ פְּלִשְׁתִּים
  choice: 非利士人听说了这事
  rationale: 希伯来文直译为“非利士人听见了”；中文补出语境中隐含的“这事”，使意思完整自然。
- source_word: תָּקַע בַּשּׁוֹפָר
  choice: 吹响羊角号
  rationale: שׁוֹפָר是用动物角制成的号，传统上常为羊角；“羊角号”保留原文的具体文化形象。
- source_word: בְּכָל הָאָרֶץ
  choice: 在遍地
  rationale: 此处הָאָרֶץ指相关全境而非整个世界；“遍地”简洁表达通告传遍全境。
- source_word: לֵאמֹר
  choice: 说
  rationale: 按其常见功能引出后面的直接引语，中文以“说”最为清楚自然。
- source_word: יִשְׁמְעוּ הָעִבְרִים
  choice: 让希伯来人都听见
  rationale: 未完成式在这里带祈使或号召语气；保留“希伯来人”这一原文称谓，不改作“以色列人”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“击溃”“守军”体现军事场景；两处脚注保留原文词义的不确定性和文化背景。
