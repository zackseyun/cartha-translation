  text: Saul was one year old when he became king[a], and he reigned two years over Israel.
translation:
  language: zh_hans
  text: 扫罗登基时一岁[a]；他在以色列作王两年。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的希伯来文本难解，且很可能有文本残缺。直译为：“扫罗作王时是一岁之子；他在以色列作王两年。”一些古代见证和后来的校勘建议补入较大的数字，例如把扫罗登基时的年龄补作“三十岁”，把在位年数补作“四十二年”。
    reason: textual_variant
lexical_decisions:
- source_word: בֶּן שָׁנָה
  choice: 一岁
  rationale: בן שנה通常是表示年龄的希伯来语习惯表达，意为“一岁”。尽管此处造成明显的历史与文本困难，正文仍照马所拉文本直译其现存数字。
- source_word: שָׁאוּל
  choice: 扫罗
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: בְּמָלְכוֹ
  choice: 登基时
  rationale: 此结构在王朝纪年公式中指出开始作王时的年龄；“登基时”自然、简洁地表达即位之时。
- source_word: וּשְׁתֵּי שָׁנִים
  choice: 两年
  rationale: 直接保留马所拉文本所载的数字和年数；分号后的中文不必机械译出连接词，却保留两分句的并列关系。
- source_word: מָלַךְ
  choice: 作王
  rationale: מלך在此意为统治、作王；“作王”符合现代中文的君王纪年表达。
- source_word: עַל יִשְׂרָאֵל
  choice: 在以色列
  rationale: 与“作王”搭配时，现代汉语通常说“在以色列作王”，自然表达其统治对象和范围。
theological_decisions:
- issue: 马所拉文本中残缺或难解的君王纪年公式
  choice: 正文保留现存马所拉文本的“一岁”和“两年”，不作推测性增补
  alternative: 可据古代见证或后世校勘建议补作“三十岁”和“四十二年”等数字，或以省略号标示数字缺失
  rationale: 所提供的原文依据是WLC马所拉文本，其现存措辞虽明显困难，也可能存在文本残缺，但缺乏足够依据确定原来的数字。为保持原文优先和文本透明，正文不以推测数字取代现存读法，重要异文与疑难在脚注说明。
translation_notes:
  register: 采用现代、庄重且易懂的标准普通话。“登基时……岁；在以色列作王……年”保留君王纪年公式的简洁感。正文自然表达希伯来语年龄习语，同时用脚注明确呈现原文的异常及可能的文本残缺。
