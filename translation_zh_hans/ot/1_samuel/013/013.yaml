  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יֹּ֧אמֶר שְׁמוּאֵ֛ל אֶל שָׁא֖וּל נִסְכָּ֑לְתָּ לֹ֣א שָׁמַ֗רְתָּ אֶת מִצְוַ֞ת יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ אֲשֶׁ֣ר צִוָּ֔/ךְ כִּ֣י עַתָּ֗ה הֵכִ֨ין יְהוָ֧ה אֶת מַֽמְלַכְתְּ/ךָ֛ אֶל יִשְׂרָאֵ֖ל עַד עוֹלָֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/013.yaml
  text: And Samuel said to Saul[a], “You have acted foolishly. You have not kept the command of Yahweh your God, which he commanded you; for now Yahweh would have established your kingdom over Israel forever.”
translation:
  language: zh_hans
  text: 撒母耳对扫罗说：“你做了糊涂事[a]！你没有遵守耶和华你的上帝所吩咐你的命令；否则，耶和华现在本会使你的国在以色列之上永远坚立。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“你行事愚昧”。
    reason: 原词着重于扫罗所做之事带有愚昧性质；“做了糊涂事”较口语自然，“行事愚昧”则更贴近形式。
lexical_decisions:
- source_word: נִסְכָּלְתָּ
  choice: 你做了糊涂事
  rationale: 该词为סכל的尼法勒式，在这里评价扫罗的行为，而不只是描述一种愚昧状态；此译自然地保留行为和道德判断两方面。
- source_word: שָׁמַרְתָּ
  choice: 遵守
  rationale: שׁמר用于命令时有持守、谨守之意；现代汉语以“遵守”最自然，同时不需另行扩写“顺服”。
- source_word: מִצְוַת
  choice: 命令
  rationale: 单数形式指当前语境中的具体命令；“命令”比“诫命”更符合此处直接吩咐的语境。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代简体中文圣经语域中通行的专名“耶和华”呈现四字神名，而不以称号替代。
- source_word: אֱלֹהֶיךָ
  choice: 你上帝
  rationale: 直接保留第二人称所属关系，并采用现代标准普通话中的“上帝”。
- source_word: צִוָּךְ
  choice: 吩咐你的
  rationale: צוה表示发出命令；在“命令”之前译作定语，汉语流畅且保留施命者与领受者。
- source_word: כִּי עַתָּה
  choice: 不然……现在就
  rationale: 结合上下文，此处引出因扫罗未遵命而失去的结果；用“不然”明示汉语所需的反事实衔接，“现在就”保留עַתָּה。
- source_word: הֵכִין
  choice: 会使……坚立
  rationale: הכין有建立、巩固之意；语境要求反事实理解，因此用“会”，而“坚立”保留使王权稳固的语义。
- source_word: מַמְלַכְתְּךָ
  choice: 你的王国
  rationale: ממלכה可指王国、王权或统治；此处直译“王国”既自然，也保留其可能涵盖王朝统治的宽度。
- source_word: אֶל יִשְׂרָאֵל
  choice: 在以色列中
  rationale: אֶל字面为“向、到”；与王国坚立连用时表达其相对于以色列的统治范围。“在以色列中”自然且避免把介词过度具体化。
- source_word: עַד עוֹלָם
  choice: 永远
  rationale: 这是该固定短语自然、简洁的现代汉语对应，表达持续不止的时间。
theological_decisions:
- issue: 四字神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用上帝的专名而非称号。中文正文保留专名，并采用普通读者最熟悉、庄重且通行的“耶和华”；“雅威”是更贴近学术重构读音的可行替代。
- issue: כִּי עַתָּה הֵכִין יְהוָה的反事实意味
  choice: 不然，耶和华现在就会使……坚立
  alternative: 因为现在耶和华已经使……坚立
  rationale: 紧接“你没有遵守”以及后文王权被废弃的宣告，本句说的是扫罗若遵命本可得到、如今却失去的结果。中文需要明确反事实关系，但不补出原文没有明说的完整条件句。
- issue: “永远”与扫罗王权的关系
  choice: 保留“永远”，不解释其具体实现方式
  alternative: 长久坚立／世世代代坚立
  rationale: עַד עוֹלָם本身具有延续性，但本节没有说明是扫罗本人、其王朝还是其王权制度如何延续；正文保留原有张力，不作教派化或体系化解释。
translation_notes:
  register: 采用庄重而清楚的现代标准普通话。“做了糊涂事”自然可懂；“遵守……命令”“使……坚立”保留叙事中的盟约和王权语感。正文中的[a]与脚注相对应。
