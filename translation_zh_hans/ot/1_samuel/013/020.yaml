base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/020.yaml
  text: So all Israel went down to the Philistines[a], each man to sharpen his plowshare, his mattock, his axe, and his sickle.
translation:
  language: zh_hans
  text: 于是，以色列人都下到非利士人那里，各人去磨利自己的犁头、锄头、斧头和镰刀[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 最后一个希伯来词含义不确定，也可能指“犁刀”或另一种耕地农具。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרְדוּ
  choice: 下到
  rationale: 保留动词 ירד 所表达的向下移动，同时符合希伯来叙事的推进方式。
- source_word: כָל יִשְׂרָאֵל
  choice: 以色列人都
  rationale: 自然表达这一集合性称谓，兼顾“全体以色列”的整体含义。
- source_word: הַפְּלִשְׁתִּים
  choice: 非利士人那里
  rationale: 原文指向非利士人这个群体，而非非利士地；不增添原文没有明说的“铁匠”。
- source_word: לִלְטוֹשׁ
  choice: 去磨利
  rationale: לטש 在金属农具的语境中指使刃口锋利；“磨利”是现代汉语中清楚自然的表达。
- source_word: אִישׁ
  choice: 各人
  rationale: 保留集合主语之后的逐一分配含义，又避免不必要地强化性别。
- source_word: מַחֲרַשְׁתּוֹ
  choice: 自己的犁头
  rationale: 此词在农具清单中最可能指犁的金属刃部；“犁头”比泛称“犁”更符合需要磨利的对象。
- source_word: אֵתוֹ
  choice: 锄头
  rationale: אֵת 指挖土或锄地的农具；“锄头”是普通现代读者熟悉且符合语境的名称。
- source_word: קַרְדֻּמּוֹ
  choice: 斧头
  rationale: 该词通常指斧类砍削工具；这里没有足够依据将其进一步限定为锛。
- source_word: מַחֲרֵשָׁתוֹ
  choice: 镰刀
  rationale: 末项农具名称的确切含义不确定；“镰刀”能构成合理的农具清单，并将其他可能译法保留在脚注中。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“于是”承接叙事，“各人”保留原文的分配性表达；不补入原文仅由上下文暗示的“铁匠”或“请他们”。脚注标记置于存在词义疑难的末项农具之后。
