lexical_decisions:
- source_word: מֶה עָשִׂיתָ
  choice: 你做了什么？
  rationale: 以现代汉语自然表达质问，保留撒母耳针对已经发生之事的尖锐责问。
- source_word: כִּי רָאִיתִי כִּי
  choice: 因为我看见
  rationale: 第一个כִּי引出扫罗的解释，第二个כִּי引出他所观察到的情形；汉语合并为自然的因果陈述，不增加原文没有的判断。
- source_word: נָפַץ הָעָם מֵעָלַי
  choice: 百姓纷纷离开我
  rationale: נָפַץ在此指众人四散，מֵעָלַי突出他们从扫罗身边离去；“纷纷离开我”兼顾军队溃散和扫罗失去支持的语境。
- source_word: לֹא בָאתָ
  choice: 你又没有……来到
  rationale: 保留扫罗直接对撒母耳所说的第二人称，并用“又”自然连接他列举的几项理由。
- source_word: לְמוֹעֵד הַיָּמִים
  choice: 在约定的日子
  rationale: מוֹעֵד表示指定、约定的时间；保留הַיָּמִים“日子”的复数痕迹，同时让现代读者容易理解。
- source_word: נֶאֱסָפִים
  choice: 正在……聚集
  rationale: 尼法勒分词呈现正在形成或持续的集合状态；“正在聚集”保留迫近的军事压力。
- source_word: מִכְמָשׂ
  choice: 密抹
  rationale: 采用中文圣经传统中通行且简洁的地名译写。
