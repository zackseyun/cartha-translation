base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/021.yaml
  text: And the charge was a pim for the plowshares[a], for the mattocks, for the three-pronged forks, and for the axes[b], and for setting the goads.
translation:
  language: zh_hans
  text: 磨犁头、锄头、三齿叉和斧头，以及修整赶牛刺棒的费用是一比姆[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “比姆”很可能是一种小重量或付费单位，通常认为约等于三分之二舍客勒。
    reason: cultural_note
  - marker: b
    text: 或译：“磨修这些农具及赶牛刺棒要一比姆。”希伯来语措辞难解，本节可能是说所收的费用，也可能是在描述磨修本身。
    reason: alternative_reading
lexical_decisions:
- source_word: הַפְּצִירָה
  choice: 磨……收费
  rationale: 此词罕见；结合后面的“比姆”这一数额和上下文，最可能指磨修农具所收的费用。译文同时点明服务内容，使现代汉语自然易懂；其也可能指磨削行为本身，见脚注[b]。
- source_word: פִים
  choice: 比姆
  rationale: 这是古代的一种重量或付费单位，精确含义具有专门性，因此采用音译，并在脚注中说明其大致数值。
- source_word: מַחֲרֵשֹׁת
  choice: 犁头
  rationale: 指犁上需要磨利的铁制工作部分；“犁头”是现代汉语中自然且具体的表达。
- source_word: אֵתִים
  choice: 锄头
  rationale: 指用于刨土或砍掘的农具，具体形制不能完全确定；“锄头”通俗并符合上下文。
- source_word: שְׁלֹשׁ קִלְּשׁוֹן
  choice: 三齿叉
  rationale: 原文表示有三个尖齿的器具；“三齿叉”简洁保留其形象。
- source_word: קַּרְדֻּמִּים
  choice: 斧头
  rationale: 该词指砍削类工具，“斧头”是最直接自然的对应，尽管具体形制可能与锛一类工具有所重叠。
- source_word: לְהַצִּיב הַדָּרְבָן
  choice: 修整赶牛刺棒
  rationale: 动词可表示使之安妥、校正或重新装配，不必限定为磨利；“修整”保留这种语义宽度。“赶牛刺棒”明确这是驱赶牲畜所用的带刺长棒。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而通俗的叙事语言。“收费都是”将希伯来语中罕见名词与“比姆”数额之间的关系自然表达出来；脚注保留原文在“费用”与“磨修”之间的歧义。农具名称尽量具体，但不对无法确定的古代形制过度解释。
