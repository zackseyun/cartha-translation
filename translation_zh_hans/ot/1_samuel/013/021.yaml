  to: 磨犁头、锄头、三齿叉和斧头，以及修整赶牛刺棒的费用是一比姆[a][b]。
  rationale: 仅作句法和脚注范围的安全修订：以“费用是一比姆”对应原文中费用／磨修与数额的关系，避免“收费都是”造成逐项收费的额外含义；脚注继续明确保留罕见词的解释歧义，并涵盖原文列出的末项赶牛刺棒。
