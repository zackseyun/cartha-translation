base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/002.yaml
  text: And Saul chose for himself three thousand men from Israel[a]. Two thousand were with Saul at Michmash and in the hill country of Bethel, and a thousand were with Jonathan at Gibeah of Benjamin. The rest of the people he sent away[b], each man to his tent.
translation:
  language: zh_hans
  text: 扫罗从以色列人中为自己挑选了三千人：二千人与扫罗在一起，在密抹和伯特利山地[a]；一千人与约拿单在一起，在便雅悯的基比亚。其余的人，他都遣散了，各人回自己的帐篷[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“伯特利的山上”。原文可指伯特利周围的山地，也可指伯特利附近某处特定的高地。
    reason: lexical_alternative
  - marker: b
    text: “各人回自己的帐篷”是遣散众人、让他们各归住处的常用说法。
    reason: idiom_clarification
lexical_decisions:
- source_word: וַיִּבְחַר לוֹ
  choice: 为自己挑选了
  rationale: בּחר意为“选择、挑选”，间接受词לוֹ保留为“为自己”，表明这些人是扫罗亲自选作随从部队的。
- source_word: מִיִּשְׂרָאֵל
  choice: 从以色列人中
  rationale: 介词מִן表示挑选的来源；中文补出“人中”，既自然，也符合上下文所指的人员。
- source_word: וַיִּהְיוּ עִם שָׁאוּל / הָיוּ עִם יוֹנָתָן
  choice: 跟随扫罗／跟随约拿单
  rationale: 原文直译为“与……同在”；军事语境中译作“跟随”自然，并表达这些人分别归在二人身边，不额外推断军阶或编制。
- source_word: בְּמִכְמָשׂ
  choice: 驻在密抹
  rationale: 介词בְּ标示所在地；上下文是军队部署，中文用“驻在”比单说“在”更清楚。
- source_word: וּבְהַר בֵּית אֵל
  choice: 和伯特利山地
  rationale: הַר既可指具体的山或高地，也可指山区；正文采用适合区域性军事部署的“山地”，并以脚注保留具体山岭的可能。
- source_word: בְּגִבְעַת בִּנְיָמִין
  choice: 驻在便雅悯的基比亚
  rationale: 马所拉文本的读音支持“基比亚”；“便雅悯的”用来限定这一地名。
- source_word: וְיֶתֶר הָעָם
  choice: 其余的人
  rationale: יֶתֶר意为“剩余部分”，הָעָם直译为“人民、众人”；译作“其余的人”贴近原文，同时避免擅自限定为正式军队。
- source_word: שִׁלַּח
  choice: 遣散了
  rationale: 此处指扫罗让未被选中的人离开；“遣散”准确表达使其离队返家的语境。
- source_word: אִישׁ לְאֹהָלָיו
  choice: 各自回自己的帐篷
  rationale: 原文为“各人到自己的帐篷”，是让众人各归住处的惯用表达；正文保留“帐篷”的具体意象，并用脚注说明其惯用含义。
theological_decisions: []
