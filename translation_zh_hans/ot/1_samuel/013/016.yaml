base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/016.yaml
  text: Saul and Jonathan his son[a], and the people who were with them, were staying in Geba of Benjamin[b], while the Philistines had encamped at Michmash.
translation:
  language: zh_hans
  text: 扫罗和他儿子约拿单，以及跟他们在一起的百姓[a]，都驻在便雅悯的迦巴[b]；非利士人则在密抹安营。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“被发现跟他们在一起的百姓”，这里可能指其他人四散后仍留在扫罗和约拿单身边的人。
    reason: lexical_alternative
  - marker: b
    text: 这里的希伯来地名是“迦巴”，不是“基比亚”；在本段叙事中，两者是名称相关但彼此不同的地点。
    reason: alternative_reading
lexical_decisions:
- source_word: יֹשְׁבִים
  choice: 驻在
  rationale: ישׁב在这里表示停留、驻留于某地；军事叙事中译作“驻在”自然，也不局限于字面的“坐着”。
- source_word: הַנִּמְצָא עִמָּם
  choice: 跟他们在一起的百姓
  rationale: 字面为“被发现与他们同在的”，语境指当时仍留在扫罗和约拿单身边的人。正文采用自然汉语，脚注保留“被发现”的希伯来语表达及其语境含义。
- source_word: בְּגֶבַע בִּנְיָמִן
  choice: 在便雅悯的迦巴
  rationale: 地名גֶּבַע在此为“迦巴”，不是“基比亚”；בְּ按城镇处所译为“在”。
- source_word: חָנוּ
  choice: 安营
  rationale: חנה是军事语境中表示扎营、安营的常用动词；汉语“安营”准确而简洁。
- source_word: בְמִכְמָשׂ
  choice: 在密抹
  rationale: 保留地名音译；介词בְּ与安营地点搭配，自然译为“在密抹”。
- source_word: וְ
  choice: 和／以及／则
  rationale: 首句并列连接分别译为“和”“以及”；末一分句根据双方驻地的对照关系译为“则”，不额外添加表示时间的“那时”或“现在”。
theological_decisions: []
