base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/005.yaml
  text: 'And the Philistines gathered to fight against Israel: thirty thousand chariots[a], and six thousand horsemen, and troops as numerous as the sand that is on the seashore. They went up and camped at Mikmash, east of Beth-aven.'
translation:
  language: zh_hans
  text: 非利士人聚集，要与以色列交战；他们有三万辆战车[a]、六千名骑兵，还有多如海边沙子的军队。他们上去，在伯亚文以东的密抹安营。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文作“三万辆战车”。有些释经者和古代文本见证认为，按上下文看三万辆似乎异常庞大，因此提出较小的数字，例如“三千辆”；正文仍依照马所拉希伯来文本。
    reason: textual_variant
lexical_decisions:
- source_word: נֶאֶסְפוּ
  choice: 聚集
  rationale: 该词的尼法勒词干在这里表示为战争集结；“聚集”自然简明，也保留原文措辞。
- source_word: לְהִלָּחֵם עִם
  choice: 要与……交战
  rationale: 在此军事语境中表示敌对作战；“与……交战”符合现代汉语庄重叙事语体。
- source_word: שְׁלֹשִׁים אֶלֶף רֶכֶב
  choice: 三万辆战车
  rationale: 按马所拉希伯来文本直译；尽管数目存在文本与历史层面的争议，正文不擅自改小，另以脚注说明。
- source_word: שֵׁשֶׁת אֲלָפִים פָּרָשִׁים
  choice: 六千名骑兵
  rationale: פָּרָשִׁים在军事清单中指骑乘作战者；“骑兵”比“骑马的人”更准确自然。
- source_word: וְעָם
  choice: 军兵
  rationale: 该词字面为“民众”，但本节战争语境明确指作战人员；“军兵”保留群体含义而符合军事场景。
- source_word: כַּחוֹל אֲשֶׁר עַל שְׂפַת הַיָּם לָרֹב
  choice: 多如海边的沙
  rationale: 保留希伯来文表示数量极多的固定比喻，同时用简洁自然的现代汉语表达。
- source_word: וַיַּעֲלוּ
  choice: 他们上到
  rationale: 保留עלה所表达的向上移动，不额外解释为军事“推进”。
- source_word: וַיַּחֲנוּ
  choice: 安营
  rationale: 准确表达驻扎设营，并符合中文圣经历史叙事的庄重语体。
- source_word: בְמִכְמָשׂ
  choice: 在密抹
  rationale: 地名采用通行中文音译；介词按营地所在位置译为“在”。
- source_word: קִדְמַת בֵּית אָוֶן
  choice: 在伯亚文东边
  rationale: קִדְמַת在地理关系中表示东方；此译清楚自然，地名采用通行中文音译。
