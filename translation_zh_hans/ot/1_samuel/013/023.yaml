  text: And a garrison of the Philistines went out to the pass of Michmash[a].
translation:
  language: zh_hans
  text: 非利士人的一支驻军出动，前往密抹的隘口。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“非利士人的一支前哨部队出动，往密抹的通道去。”原文“驻军”也可指哨站或驻防据点；“隘口”也可指通道或渡越之处。
    reason: 原文 מַצַּב 可指驻守的部队、哨站或据点；מַעֲבַר 可指隘口、通道或渡越处。介词 אֶל 表示“往、向着”的方向，未明确说明已经抵达。
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: 出动
  rationale: 该动词表示向外而出；在军事叙事中译作“出动”自然，同时不额外断定其具体战术行动。
- source_word: מַצַּב
  choice: 一支驻军
  rationale: 此处指驻守的军事力量，也可能指据点或哨站；“一支驻军”既符合军事语境，又保留希伯来文单数形式。
- source_word: פְּלִשְׁתִּים
  choice: 非利士人的
  rationale: 采用现代中文圣经中通行的族名译法，并自然表达与“驻军”的所属关系。
- source_word: אֶל
  choice: 到了
  rationale: 该介词表示方向；结合运动动词译作“到了”，在中文叙事中顺畅，但原文也可理解为“往”。
- source_word: מַעֲבַר
  choice: 隘口
  rationale: 该词指通行、渡越之处；按密抹一带的地形和军事语境，“隘口”最为贴切，但“渡口”或“通道”在词义上亦有可能。
- source_word: מִכְמָשׂ
  choice: 密抹
  rationale: 采用该地名在现代中文圣经传统中的通行译名。
