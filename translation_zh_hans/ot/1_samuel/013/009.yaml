  text: וַ/יֹּ֣אמֶר שָׁא֔וּל הַגִּ֣שׁוּ אֵלַ֔/י הָ/עֹלָ֖ה וְ/הַ/שְּׁלָמִ֑ים וַ/יַּ֖עַל הָ/עֹלָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/009.yaml
  text: So Saul said[b][a], “Bring near to me the burnt offering and the peace offerings.” And he offered up the burnt offering.
translation:
  language: zh_hans
  text: 扫罗说：“把燔祭和平安祭[a]带到我这里来。”于是，扫罗献上了燔祭。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“团契祭”。希伯来语这个词可指与平安、福祉或共同分享有关的祭。
    reason: lexical_alternative
  - marker: b
    text: 末句最自然的意思是扫罗亲自献上燔祭；也有人理解为扫罗让人把祭献上。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 扫罗说
  rationale: 未将叙事连接词机械译为“和”；汉语用前后句次序自然推进叙事。
- source_word: הַגִּשׁוּ אֵלַי
  choice: 把……带到我这里来
  rationale: הגשׁ的使役命令式表示使某物靠近、带来或呈上；此译自然清楚，也保留了将祭物带到扫罗面前的含义。
- source_word: הָעֹלָה
  choice: 燔祭
  rationale: 这是עֹלָה在献祭语境中的标准术语，指全然焚烧献上的祭。
- source_word: וְהַשְּׁלָמִים
  choice: 和平安祭
  rationale: שְׁלָמִים可指与平安、福祉或共同分享有关的祭；“平安祭”是准确且通行的礼仪用语，并以脚注保留“团契祭”的可能表达。
- source_word: וַיַּעַל
  choice: 于是，扫罗献上了
  rationale: עלה在献祭语境中惯常表示“献上”；“于是”自然承接叙事。原文承接前句以扫罗为主语，正文明确写出“扫罗”，避免汉语代词指向不清。
theological_decisions:
- issue: 末句的施事者及其行动
  choice: 扫罗亲自献上了燔祭
  alternative: 扫罗让人献上或呈上燔祭
  rationale: 单数叙事动词自然承接前句的主语扫罗，因此最直接的理解是扫罗本人实施了献祭；这也符合随后责备的叙事脉络。不过，献祭用语有时可作较间接的理解，故在脚注中保留这一可能。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“燔祭”和“平安祭”保留经文献祭制度的通行术语；句法简洁，以“于是”体现叙事推进。
