  text: וַ/יֹּ֨אמֶר אֲלֵי/הֶ֜ם עֵ֧ד יְהוָ֣ה בָּ/כֶ֗ם וְ/עֵ֤ד מְשִׁיח/וֹ֙ הַ/יּ֣וֹם הַ/זֶּ֔ה כִּ֣י לֹ֧א מְצָאתֶ֛ם בְּ/יָדִ֖/י מְא֑וּמָה וַ/יֹּ֖אמֶר עֵֽד׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/005.yaml
  text: And he said to them[a], “Yahweh is witness against you, and his anointed is witness this day, that you have found nothing in my hand.” And they said[c][b], “He is witness.”
translation:
  language: zh_hans
  text: 他对他们说：“耶和华在你们中间为证；他的受膏者今日也为证：你们没有从我手中查出任何东西。”众人回答：“他为证。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֵד
  choice: 作证
  rationale: 该词具有法律或盟约语境中的“见证、证人”含义。这里用“作证”自然地表达撒母耳公开申明清白时的司法性语气。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文读者熟悉的上帝专名音译“耶和华”，不以“主”这一称号代替原文专名。
- source_word: בָּכֶם
  choice: 在你们中间
  rationale: 直译为“在你们中间／与你们同在”；结合上下文具有法庭性的含义，即耶和华在涉及百姓的这件事上作证。正文保留介词的空间表达，脚注说明其司法语气。
- source_word: מְשִׁיחוֹ
  choice: 他的受膏者
  rationale: 保留原词“被膏立者”的意义；在本节直接指刚被立为王的扫罗，避免在正文中直接译成带有后期专称意味的“弥赛亚”。
- source_word: הַיּוֹם הַזֶּה
  choice: 今日
  rationale: “今日”既准确表达时间，又保留公开宣告的庄重语气。
- source_word: מְצָאתֶם
  choice: 你们并没有查出
  rationale: 动词本义为“找到、发现”；在公开查验和申诉清白的语境中，“查出”较自然地传达百姓经检视后未发现罪证的意思。
- source_word: בְּיָדִי
  choice: 我手里
  rationale: 保留希伯来语“在我手中”的具体意象；中文“我手里”也可自然表示所占有或掌控之物。
- source_word: מְאוּמָה
  choice: 任何东西
  rationale: 该词与否定词连用，表示“任何事物都没有”；此译法不额外限定为财物、贿赂或罪证。
- source_word: וַיֹּאמֶר ... וַיֹּאמֶר
  choice: 他说……众人回答
  rationale: 首个单数动词指撒母耳；末尾动词在马所拉文本中也是单数，但上下文显示这是会众的集体回应，因此正文按中文习惯译作“众人回答”，并以脚注交代原文形式。
theological_decisions:
- issue: 非末世性王权语境中 מְשִׁיחוֹ 的译法
  choice: 他的受膏者
  alternative: 他的弥赛亚／他的王
  rationale: 此处所指是当时已受膏立的君王扫罗。译为“受膏者”既保留词义，也不把后来的专称“弥赛亚”及其基督论含义直接带入本节，同时不把原文概念简化为“王”。
- issue: 耶和华作为见证者的司法性语气
  choice: 在你们中间作证
  alternative: 作证指证你们／是你们的见证人
  rationale: 原介词表达可理解为“在你们中间、与你们同在”，而上下文又有法庭或盟约诉讼色彩。正文保留原文可感的关系表达，脚注说明其司法含义，避免将其过度解释为敌对控告。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“今日”“受膏者”“作证”保留公开盟约申明的正式语气；句法则按自然中文调整。正文没有补入“贿赂”“不义之物”等原文未明说的内容，并通过脚注保留 בָּכֶם 和末尾单数动词的解释空间。
