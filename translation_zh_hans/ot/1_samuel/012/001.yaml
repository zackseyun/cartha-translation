  yaml_path: translation/ot/1_samuel/012/001.yaml
  text: Then Samuel said to all Israel, “Look, I have listened to your voice in all that you have said to me, and I have made a king reign over you.”
translation:
  language: zh_hans
  text: 撒母耳对全以色列说：“看哪，我已经照着你们对我所说的一切，立了一位王来统治你们。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留引起听众注意的提示语气，同时采用庄重而易懂的现代汉语表达。
- source_word: שָׁמַעְתִּי בְקֹלְכֶם
  choice: 我都听从了你们的意见
  rationale: 希伯来语“听从某人的声音”在此表示接受其请求；译出其惯用含义，避免汉语“听了你们的声音”造成误解。
- source_word: וָאַמְלִיךְ עֲלֵיכֶם מֶלֶךְ
  choice: 并且立了一位王治理你们
  rationale: 使役形态表达“使一位王作王”；“立……治理”自然地保留撒母耳促成王权设立及王在百姓之上的统治含义。
theological_decisions:
- issue: 撒母耳在立王一事中的角色
  choice: 立了一位王治理你们
  alternative: 使一位王在你们之上作王
  rationale: 所选译法不把立王的最终主权归属作超出本节的解释，同时保留撒母耳作为执行者以及君王治理百姓的意思。
translation_notes:
  register: 采用现代、庄重、适合公开诵读的简体中文；保留“看哪”的经文语体，但将希伯来惯用语按自然汉语表达。
