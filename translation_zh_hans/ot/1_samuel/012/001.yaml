  terminology: “撒母耳”“以色列”“王”均准确一致。“看哪”适合保留 הִנֵּה 的提示性庄重语气；“立了一位王来统治你们”恰当表达使役动词“使……作王”及“在你们之上”的统治关系，而不引入额外的神学归因。
