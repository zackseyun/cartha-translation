base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/018.yaml
  text: Then Samuel called to Yahweh[a], and Yahweh sent thunder and rain that day; and all the people greatly feared Yahweh and Samuel.
translation:
  language: zh_hans
  text: 于是，撒母耳向雅威呼求。那一天，雅威发出雷声[a]，降下雨；众百姓都非常惧怕雅威和撒母耳。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雷声”原文直译为“声音”；在这里的风暴语境中指雷声。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא שְׁמוּאֵל אֶל־יְהוָה
  choice: 撒母耳呼求雅威
  rationale: קרא אל־יהוה在这里指向雅威呼求、祷告。“呼求”比单纯的“呼叫”更自然地表达祷告语境，同时不额外说明祷告内容或情绪。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常用音译“雅威”呈现四字神名，保留其专名性质，不以称号替代。
- source_word: וַיִּתֵּן יְהוָה
  choice: 雅威降下
  rationale: 字面为“雅威给了”。与雷雨搭配时，“降下”自然表达雅威使雷雨发生，也保留其主动施行的含义。
- source_word: קֹלוֹת
  choice: 雷声
  rationale: 该词字面可指“声音”，但在与雨并列的风暴语境中指雷声；脚注保留其字面信息。
- source_word: וּמָטָר
  choice: 和雨
  rationale: מָטָר直接指雨；不译作“暴雨”，避免加入原文未明说的强度。
- source_word: בַּיּוֹם הַהוּא
  choice: 那一天
  rationale: 准确保留原文的时间指示，并符合现代汉语叙事表达。
- source_word: וַיִּירָא כָל־הָעָם מְאֹד
  choice: 全体百姓都非常惧怕
  rationale: “惧怕”保留ירא在神迹显现后的恐惧及敬畏张力；“非常”传达מְאֹד的加强作用。
- source_word: אֶת־יְהוָה וְאֶת־שְׁמוּאֵל
  choice: 雅威和撒母耳
  rationale: 原文以同一个动词支配两个对象，译文也不把对雅威与对撒母耳的态度拆成不同词语，以保留原文的张力。
theological_decisions:
- issue: 如何翻译神名יְהוָה
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。采用“雅威”保留专名，并避免以称号替代。
- issue: 百姓同时惧怕雅威和撒母耳的含义
  choice: 惧怕雅威和撒母耳
  alternative: 敬畏雅威、尊敬撒母耳
  rationale: 希伯来文用同一动词ירא连接两个宾语。译文保留这一语法和神学张力，不擅自把两种态度分别解释为“敬畏”与“尊敬”；上下文本身可帮助读者理解二者地位并不相同。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“于是”承接前文叙事；用分号连接撒母耳呼求与雅威回应，以显明事件关系，但不增添原文未明说的因果连词。
