  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יִּזְעֲק֤וּ אֶל יְהוָה֙ ו/יאמר חָטָ֔אנוּ כִּ֤י עָזַ֨בְנוּ֙ אֶת יְהוָ֔ה וַ/נַּעֲבֹ֥ד אֶת הַ/בְּעָלִ֖ים וְ/אֶת הָ/עַשְׁתָּר֑וֹת וְ/עַתָּ֗ה הַצִּילֵ֛/נוּ מִ/יַּ֥ד אֹיְבֵ֖י/נוּ וְ/נַעַבְדֶֽ/ךָּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/010.yaml
  text: Then they cried out to the LORD and said, “We have sinned, because we have forsaken the LORD and have served the Baals and the Ashtaroths. But now, deliver us from the hand of our enemies, and we will serve you.”
translation:
  language: zh_hans
  text: 他们就向耶和华呼求，说：“我们犯罪了，因为我们离弃了耶和华，事奉众巴力和众亚斯她录。现在求你救我们脱离仇敌的手，我们必事奉你。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的专名译法，明确对应希伯来文四字神名。
- source_word: הַבְּעָלִים
  choice: 众巴力
  rationale: 原文为复数，指各地所崇拜的巴力神祇；用“众”保留复数含义。
- source_word: הָעַשְׁתָּרוֹת
  choice: 众亚斯她录
  rationale: 按希伯来文复数形式处理，并采用中文圣经传统中较为人熟悉的音译。
- source_word: מִיַּד אֹיְבֵינוּ
  choice: 脱离仇敌的手
  rationale: 保留希伯来语“从……手中”的权势意象，同时使中文表达自然。
- source_word: וְנַעַבְדֶךָּ
  choice: 我们必事奉你
  rationale: 在求救后的承诺语境中，未完成式表达意愿与将来行动；“必”简洁呈现其郑重承诺。
theological_decisions:
- issue: 以色列认罪中“因为”的因果关系
  choice: 因为我们离弃了耶和华
  alternative: 我们离弃了耶和华，又事奉……
  rationale: כִּי 在此自然引出犯罪的具体缘由和内容；保留“因为”可呈现认罪的逻辑关系。
- issue: 巴力与亚斯她录的复数形式
  choice: 众巴力和众亚斯她录
  alternative: 巴力和亚斯她录
  rationale: 复数可能反映这些神祇的不同地方形态或多个偶像，译文不将其无声地单数化。
- issue: וַיאמר 的语法数与前文复数主语之间的张力
  choice: 他们就向耶和华呼求，说
  alternative: 他们就向耶和华呼求，他说
  rationale: 马所拉文本的“说”在形式上是单数，但可将以色列作为集体发言者；中文连动结构中的“说”不标示数，既自然承接“他们”，也不必武断指定某个个人发言。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。认罪、呼求和承诺的结构保持紧凑；“事奉”保留敬拜与效忠的宗教含义。专名采用简体中文圣经语境中常见的“耶和华、巴力、亚斯她录”。
