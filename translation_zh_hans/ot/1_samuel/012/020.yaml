  text: וַ/יֹּ֨אמֶר שְׁמוּאֵ֤ל אֶל הָ/עָם֙ אַל תִּירָ֔אוּ אַתֶּ֣ם עֲשִׂיתֶ֔ם אֵ֥ת כָּל הָ/רָעָ֖ה הַ/זֹּ֑את אַ֗ךְ אַל תָּס֨וּרוּ֙ מֵ/אַחֲרֵ֣י יְהוָ֔ה וַ/עֲבַדְתֶּ֥ם אֶת יְהוָ֖ה בְּ/כָל לְבַבְ/כֶֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/020.yaml
  text: And Samuel said to the people[a], “Do not be afraid. You have done all this evil. Yet do not turn aside from following Yahweh[b], but serve Yahweh with all your heart.”
translation:
  language: zh_hans
  text: 撒母耳对百姓说：“不要害怕！你们确实做了这一切恶事；但不要离开雅威[a]，要全心事奉雅威。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译近于“不要从雅威后面转开”，意思是不要离弃他、停止跟随他。“雅威”音译希伯来文神名יהוה（YHWH）；有些译本译作“耶和华”或以“上主”代替。
    reason: 解释“从……后面转开”的希伯来惯用语及正文所用神名的原文形式和主要译法。
lexical_decisions:
- source_word: וַיֹּאמֶר שְׁמוּאֵל אֶל הָעָם
  choice: 撒母耳对百姓说
  rationale: 按希伯来叙事句式自然译出；הָעָם在语境中指撒母耳所面对的以色列百姓。
- source_word: אַל תִּירָאוּ
  choice: 不要害怕
  rationale: 准确表达ירא的禁止式，也符合现代汉语口吻。
- source_word: אַתֶּם עֲשִׂיתֶם
  choice: 你们确实做了
  rationale: 独立人称代词אַתֶּם带有强调作用；用“确实”保留这一强调，而不是把它理解为削弱责备。
- source_word: כָּל הָרָעָה הַזֹּאת
  choice: 这一切恶事
  rationale: רָעָה在这里具有明确的道德分量；“恶事”既庄重直接，又比单译“错误”更贴近原意。
- source_word: אַךְ
  choice: 但
  rationale: 这里承接对罪恶的确认，并转入劝戒；“但”自然表达其限制、转折作用。
- source_word: אַל תָּסוּרוּ מֵאַחֲרֵי יְהוָה
  choice: 不要转离雅威，不再跟随他
  rationale: 原文直译近于“不要从雅威后面转开”；译文保留“转离”与“跟随”的意象，同时以现代汉语说明其惯用含义。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以常见汉语音译呈现四字神名，而不以“主”这一称号替代；脚注说明其所对应的希伯来文神名。
- source_word: וַעֲבַדְתֶּם אֶת יְהוָה
  choice: 而要事奉雅威
  rationale: עבד在盟约语境中是“服事、事奉”，范围不限于礼仪性的敬拜；“而要”清楚呈现与前一禁止命令相对的正面要求。
- source_word: בְּכָל לְבַבְכֶם
  choice: 全心
  rationale: 这是表达完整委身和忠诚的希伯来惯用语；“全心”简洁、自然，并保留其整体性。
theological_decisions:
- issue: 四字神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文使用的是神的专名，而非“主”的普通称号。正文采用音译“雅威”以保留专名性质，同时不借此引入超出经文的教义解释。
- issue: רָעָה的道德力度
  choice: 恶事
  alternative: 坏事；过错
  rationale: 上下文是撒母耳对百姓行为的严肃责备。“恶事”保留其道德严重性，不把它淡化为一般失误。
- issue: 认罪事实与继续忠诚之间的张力
  choice: 保留“确实……但……”的并置
  alternative: 将后半句解释为赦免保证
  rationale: 本节确认百姓已经行恶，同时命令他们不要停止跟随雅威；原文并未在本句明说赦免，因此不增添这一结论。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“不要害怕”直接安慰百姓，“确实”保留原文人称代词的强调；分号呈现承认恶行与继续忠诚的命令之间的紧张关系。
