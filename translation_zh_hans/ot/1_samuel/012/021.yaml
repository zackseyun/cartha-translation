  text: וְ/לֹ֖א תָּס֑וּרוּ כִּ֣י אַחֲרֵ֣י הַ/תֹּ֗הוּ אֲשֶׁ֧ר לֹֽא יוֹעִ֛ילוּ וְ/לֹ֥א יַצִּ֖ילוּ כִּי תֹ֥הוּ הֵֽמָּה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/021.yaml
  text: And do not turn aside after worthless things that cannot profit or deliver[b][a], for they are worthless.
translation:
  language: zh_hans
  text: 不要转去追随那些虚空之物[a]；它们既无益处，也不能解救人[b]，因为它们本是虚空。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“空虚之物”“徒然之物”或“偶像”。希伯来语“托胡”（tohu）表示空虚、徒然或没有实质的事物。
    reason: lexical_alternative
  - marker: b
    text: 或译“拯救”或“搭救”。
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּסוּרוּ
  choice: 偏离
  rationale: סור表示转离、偏离。这里保留偏离正确忠诚方向的比喻，同时不擅自补出“正道”等原文没有明说的宾语。
- source_word: אַחֲרֵי
  choice: 去跟随
  rationale: אַחֲרֵי字面为“在……之后”，与转离的动词连用时表示转而追随；“去跟随”符合现代汉语表达。
- source_word: הַתֹּהוּ / תֹהוּ
  choice: 虚空之物 / 虚空
  rationale: תֹהוּ可指空虚、徒然、无实质之物。译作“虚空之物”既表达其毫无实效，也不把所指过早限定为偶像；末句以“虚空”重现原文的重复。
- source_word: אֲשֶׁר לֹא יוֹעִילוּ
  choice: 它们不能使人得益
  rationale: יעל的使役形式在此表示带来益处。“不能使人得益”传达这些对象无力提供实际帮助。
- source_word: וְלֹא יַצִּילוּ
  choice: 也不能解救人
  rationale: נצל的使役形式常指解救、搭救。“解救人”保留实际危难中施行拯救的含义，又避免无根据地把范围限于某种特定神学意义。
- source_word: הֵמָּה
  choice: 它们
  rationale: 阳性复数代词回指前面的虚空之物，现代汉语自然译为“它们”。
theological_decisions:
- issue: “虚空之物”的具体所指
  choice: 保留为概括性的“虚空之物”
  alternative: 明确译为“偶像”
  rationale: 上下文很可能涉及偶像或其他被错误信赖的对象，但原文使用含义较宽的תֹהוּ，而非明确的“偶像”一词；因此正文保留其开放性。
- issue: 不能“解救”的含义
  choice: 按一般性的危难解救来表达
  alternative: 译作带有更强神学色彩的“拯救”
  rationale: 本节强调这些虚空之物无力提供帮助或救援；“解救”忠实呈现能力上的对比，不额外限定为属灵或终末性的救恩。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“不要偏离，去跟随……”保留原文转离并追随的动态意象；分号使后面的理由和说明层次清晰。正文两次使用“虚空”，重现希伯来文关键词的首尾重复。
