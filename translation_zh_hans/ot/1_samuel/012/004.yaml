  text: וַ/יֹּ֣אמְר֔וּ לֹ֥א עֲשַׁקְתָּ֖/נוּ וְ/לֹ֣א רַצּוֹתָ֑/נוּ וְ/לֹֽא לָקַ֥חְתָּ מִ/יַּד אִ֖ישׁ מְאֽוּמָה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/004.yaml
  text: And they said[a], “You have not oppressed us, and you have not mistreated us, and you have not taken anything from any man's hand.”
translation:
  language: zh_hans
  text: 他们说：“你没有欺压我们，也没有虐待我们，也没有从任何人手里拿过什么[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“从任何人的手里拿过什么”。这句话可能指从人那里收取财物、礼物或贿赂。
    reason: 说明希伯来语惯用表达及其在本语境中可能包含的含义，同时不在正文中将其限定为“受贿”。
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: 他们说
  rationale: 以自然的汉语叙事表达承接上下文的 wayyiqtol 形式；本句不必另加“于是”来强化时间关系。
- source_word: עֲשַׁקְתָּנוּ
  choice: 你没有欺压我们
  rationale: עשׁק 可指凭权势压迫、勒索或侵占；“欺压”既保留公共公义语境中的权力滥用，也符合现代汉语表达。
- source_word: רַצּוֹתָנוּ
  choice: 也没有虐待我们
  rationale: רצץ 的基本意象是压碎、击碎，此处指以强暴手段伤害或恶待人；“虐待”保留其力度，同时避免让读者误解为字面的身体压碎。
- source_word: לָקַחְתָּ מִיַּד אִישׁ מְאוּמָה
  choice: 也没有从任何人手里拿过什么
  rationale: 保留“从……手里拿”的具体希伯来语意象，又以“任何人……什么”自然表达否定范围；该说法在语境中可能涉及收取财物、礼物或贿赂，但正文不将含义限定为其中一种。
- source_word: אִישׁ
  choice: 任何人
  rationale: 这里的阳性单数 אִישׁ 具有泛指作用；现代汉语“任何人”准确传达其范围，无须添加原文未强调的性别限定。
- source_word: מְאוּמָה
  choice: 什么
  rationale: 在否定句中表示“任何东西、丝毫东西”；“没有……什么”是简明自然的现代汉语。
theological_decisions: []
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“欺压”与“虐待”保留两个并列动词的区别；末句保留“从任何人手里拿”的原文意象。脚注标记置于所解释的短语之后。
