  rationale: 将“只要”调整为较明确的劝勉式“惟要”，并重组后半句，使其在现代标准汉语中完整、自然地表达“因为／当看（思量）耶和华所行何等大事”的关系。正文保留自然的“为你们”，脚注则简明保留原文“与你们”的形式，避免把“在你们中间”作为未经必要的额外释义。
