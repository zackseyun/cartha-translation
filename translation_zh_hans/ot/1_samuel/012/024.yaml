  text: אַ֣ךְ יְר֣אוּ אֶת יְהוָ֗ה וַ/עֲבַדְתֶּ֥ם אֹת֛/וֹ בֶּ/אֱמֶ֖ת בְּ/כָל לְבַבְ/כֶ֑ם כִּ֣י רְא֔וּ אֵ֥ת אֲשֶׁר הִגְדִּ֖ל עִמָּ/כֶֽם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/024.yaml
  text: Only fear Yahweh and serve him faithfully with all your heart[a], for consider what great things he has done with you.
translation:
  language: zh_hans
  text: 惟要敬畏耶和华，全心忠诚地事奉他；因为你们当想想，他为你们[a]所行的是何等大事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “为你们”：原文直译“与你们”。
    reason: 保留 עִמָּכֶם 的字面表达；在此语境中，正文“为你们”是自然的汉语表达。
lexical_decisions:
- source_word: אַךְ
  choice: 只要
  rationale: 在上下文中表示带强调的限定与劝勉，指出百姓唯一当有的回应。
- source_word: יְרְאוּ אֶת־יְהוָה
  choice: 敬畏耶和华
  rationale: “敬畏”保留 ירא 所包含的畏惧、尊崇与顺服；“耶和华”采用现代中文圣经读者熟悉的神名译法。
- source_word: וַעֲבַדְתֶּם אֹתוֹ
  choice: 事奉他
  rationale: עבד 的基本义为“服事”；用于神时，“事奉”兼具敬拜与忠顺的广义。
- source_word: בֶּאֱמֶת
  choice: 忠诚地
  rationale: אֱמֶת 在此修饰事奉，侧重真实、可靠、忠信；“忠诚地”自然表达盟约忠贞，同时不把词义收窄为仅仅主观真诚。
- source_word: בְּכָל־לְבַבְכֶם
  choice: 全心
  rationale: 准确而自然地表达希伯来语“用你们全部的心”，即全然投入与委身。
- source_word: רְאוּ
  choice: 思想
  rationale: 字面为“看”，此处命令式要求百姓留意并反思神的作为；“思想”传达其认知和省察作用。
- source_word: אֵת אֲשֶׁר הִגְדִּיל
  choice: 做了何等伟大的事
  rationale: 使役式 הגדיל 在这里惯用地指施行大事；此译法符合现代汉语。
- source_word: עִמָּכֶם
  choice: 为你们
  rationale: 字面是“与你们”，在此语境指神在百姓身上、与他们相交中所行的大事；正文采用更自然的“为你们”，脚注保留形式对应。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文明确使用四字神名。中文正文采用广为人知、可辨识为专名的“耶和华”，而不是以“主”这一称号代替；“雅威”是另一种更接近学界重构读音的音译。
- issue: בֶּאֱמֶת 所表达的事奉性质
  choice: 忠诚地
  alternative: 诚实地／按真理
  rationale: 这里既可能强调真实无伪，也可能强调忠信可靠。“忠诚地”较能承载盟约语境中的忠信含义，又不引入特定宗派解释。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“只要……；因为……”保留劝勉与理由之间的结构。“全心忠诚地事奉”避免文言化，同时保留经文的盟约语气。脚注标记置于正文相关句末。
