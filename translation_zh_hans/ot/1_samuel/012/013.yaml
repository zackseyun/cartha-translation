  text: וְ/עַתָּ֗ה הִנֵּ֥ה הַ/מֶּ֛לֶךְ אֲשֶׁ֥ר בְּחַרְתֶּ֖ם אֲשֶׁ֣ר שְׁאֶלְתֶּ֑ם וְ/הִנֵּ֨ה נָתַ֧ן יְהוָ֛ה עֲלֵי/כֶ֖ם מֶֽלֶךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/013.yaml
  text: And now[a], here is the king whom you have chosen, whom you have asked for; and look, Yahweh has set a king over you.
translation:
  language: zh_hans
  text: 现在，看，这就是你们所选择、所求的王；看，雅威已经立了一位王治理你们。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较直译：“雅威已经把一位王置于你们之上。”
    reason: 说明 נתן 的基本义为“给、置”；在 נתן עַל 的结构中，原文同时表达王被置于百姓之上、对他们施行统治的关系。
lexical_decisions:
- source_word: וְעַתָּה
  choice: 现在
  rationale: 作为时间兼话语推进标记，引出撒母耳根据上文所作的当下结论；汉语“现在”已能自然承载连接和转折推进作用。
- source_word: הִנֵּה
  choice: 看，这就是
  rationale: 第一个 הִנֵּה 指向听众眼前那位特定的王；“看，这就是”既保留提醒注意的功能，也符合现代汉语表达。
- source_word: הַמֶּלֶךְ
  choice: 王
  rationale: 定指百姓所求、当时在场的那一位王；“这就是……的王”自然表达其确定性。
- source_word: אֲשֶׁר בְּחַרְתֶּם
  choice: 你们所选择的
  rationale: 保留 בחר“选择”的基本意义和第二人称复数所强调的百姓责任，不改写为神的拣选。
- source_word: אֲשֶׁר שְׁאֶלְתֶּם
  choice: 你们所求的
  rationale: שאל 在此指百姓求立一位王；“所求的”简洁地呼应本书前文，并与“所选择的”形成平行。
- source_word: וְהִנֵּה
  choice: 看
  rationale: 第二个 הִנֵּה 再次要求听众留意随后的事实；保留重复的篇章作用，同时使用自然的现代汉语。
- source_word: נָתַן יְהוָה
  choice: 雅威已经立了
  rationale: נתן 的基本义是“给”，但与 עַל 和“王”连用时表达把王安置在百姓之上；正文用“立……治理”传达这一语境义，直译另见脚注。完成式以“已经”体现行动已经实现。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代普通话常见音译呈现四字神名，保留其作为专名的性质，而不以称号替代。
- source_word: עֲלֵיכֶם
  choice: 治理你们
  rationale: 在“立王”的语境中，עַל 表示王位居百姓之上并拥有治理权；“治理你们”比空间性的“在你们之上”更自然准确。
- source_word: מֶלֶךְ
  choice: 一位王
  rationale: 原文此处无冠词；汉语用数量结构“一位王”自然呈现其不定形式，同时上下文仍清楚表明是前述那位王。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用神的专名；“雅威”按较常见的学术重构读音音译，避免用“主”等称号替代专名。
- issue: 百姓选择王与雅威立王之间的张力
  choice: 同时保留“你们所选择”与“雅威已经立”
  alternative: 将两者协调为单一主体的拣选或任命
  rationale: 原文有意并置百姓的选择、请求和雅威实际把王置于他们之上的行动；译文不消解其中关于人类责任与神行动的张力。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“看”两次对应原文重复的 הִנֵּה；“所选择、所求”保留原文平行结构。脚注标记置于其实际说明的“立了一位王治理你们”之后。
