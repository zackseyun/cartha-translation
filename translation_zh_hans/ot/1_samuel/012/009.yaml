revisions:
- from: 可是，他们忘记了耶和华他们的上帝，他就把他们卖在夏琐军队统帅西西拉手中，又卖在非利士人和摩押王手中；这些人就攻打他们。[a]
  to: 他们却忘记了耶和华他们的上帝；他就把他们卖给夏琐军队的统帅西西拉，又卖给非利士人和摩押王；那些人就攻打他们。[a]
  rationale: 将不合现代汉语搭配的“卖在……手中”改为“卖给……”，保留原文“卖”的审判隐喻；脚注补足原文“在……手中”的字面意象及其惯用含义。加上“的”使官职短语自然。末句仍以“那些人”回指前述复数敌对势力，未额外指定原文未明说的名称。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T05:26:09Z'
