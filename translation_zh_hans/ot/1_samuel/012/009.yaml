base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/009.yaml
  text: But they forgot Yahweh their God[a], and he sold them into the hand of Sisera, commander of the army of Hazor, and into the hand of the Philistines, and into the hand of the king of Moab; and they fought against them.
translation:
  language: zh_hans
  text: 他们却忘记了耶和华他们的上帝；他就把他们卖给夏琐军队的统帅西西拉，又卖给非利士人和摩押王；那些人就攻打他们。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “卖给”也可译作“交在……手中”。希伯来文直译为“卖”，并说“在……手中”；这是盟约审判的说法，指把一群人交在仇敌的权势之下。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכְּחוּ
  choice: 他们忘记了
  rationale: 保留שׁכח“忘记”的基本意义；上下文可自然显出其对上帝失信、忽视他的盟约含义，而不在正文中强化为“离弃”。
- source_word: יְהוָה אֱלֹהֵיהֶם
  choice: 耶和华他们的上帝
  rationale: 用现代中文通行形式“耶和华”呈现神名，并保留“他们的上帝”所表达的盟约关系。
- source_word: וַיִּמְכֹּר אֹתָם בְּיַד
  choice: 他就把他们卖在……手中
  rationale: מכר直译为“卖”；“卖在……手中”保留审判性的隐喻和“手”所表达的权势意象。
- source_word: שַׂר צְבָא חָצוֹר
  choice: 夏琐军队统帅
  rationale: 简明呈现“夏琐军队的统帅”，符合现代汉语军事称谓。
- source_word: וַיִּלָּחֲמוּ בָם
  choice: 这些人就攻打他们
  rationale: 动词复数主语最自然地回指前述敌对势力；补出“这些人”以免现代中文误把主语理解为以色列人。
theological_decisions:
- issue: “他就把他们卖……”的主语
  choice: 承接前句，以耶和华为隐含主语
  alternative: 用被动式“他们就被卖……”
  rationale: 希伯来文单数动词自然承接紧邻的“耶和华他们的上帝”，表明这是耶和华施行的审判。
- issue: “忘记耶和华”的语力
  choice: 直译为“忘记了耶和华”
  alternative: 译为“离弃了耶和华”或“忽视了耶和华”
  rationale: 原词在盟约语境中含有不忠与忽视的意味，但直译可保留原文措辞及其神学张力，避免把隐含意义直接写成明说。
- issue: 末句复数主语的指向
  choice: 理解为前述西西拉、非利士人和摩押王等敌对势力
  alternative: 保持中文主语省略，或理解为以色列人
  rationale: 复数形式与前面列举的多个敌对势力相合；在中文中补出“这些人”可澄清句法，却不增加身份信息。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“可是”承接前文转折；保留“卖在……手中”的圣经意象，并以脚注解释其惯用意义。为避免末句代词连续造成歧义，补出“这些人”。
