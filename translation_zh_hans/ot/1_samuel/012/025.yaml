  text: וְ/אִם הָרֵ֖עַ תָּרֵ֑עוּ גַּם אַתֶּ֥ם גַּֽם מַלְכְּ/כֶ֖ם תִּסָּפֽוּ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/025.yaml
  text: But if you persist in doing evil[b][a], both you and your king will be swept away.
translation:
  language: zh_hans
  text: 但你们若一味作恶[a]，你们和你们的王都必被除灭[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“若作恶”或“若行恶”。希伯来语以不定式绝对形与同词根动词连用，强化语气。
    reason: lexical_alternative
  - marker: b
    text: 或译“必灭亡”或“必被毁灭”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: 但……若
  rationale: 原文直译为“而如果”；结合上文顺服与悖逆的对照，用“但……若”自然表达转折性的条件。
- source_word: הָרֵעַ תָּרֵעוּ
  choice: 一味作恶
  rationale: רעע 的不定式绝对形与限定动词连用以加强语气。“一味作恶”用自然汉语传达强化意味，同时以脚注保留较为中性的译法。
- source_word: גַּם אַתֶּם גַּם מַלְכְּכֶם
  choice: 你们和你们的王都
  rationale: 两个 גַּם 将百姓与他们的王一并纳入警告；“……和……都”准确而自然。
- source_word: תִּסָּפוּ
  choice: 必被除灭
  rationale: ספה 的尼法勒式可表示被除去、毁灭或灭亡。“被除灭”保留被动语态及审判中遭到清除的意味，又不限定审判的具体方式。
theological_decisions:
- issue: 百姓和君王将受何种审判
  choice: 译作“都必被除灭”，表达临到双方的整体性审判
  alternative: 仅指军事失败，或仅指属灵灭亡
  rationale: 本节发出严厉而概括的盟约性警告，却未说明审判的具体形式；因此不将含义缩窄为军事、政治或属灵层面的某一种后果。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“一味作恶”传达原文动词结构的加强语气；“被除灭”保留原文的被动色彩和审判力度。脚注标记均置于其所说明的词语之后。
