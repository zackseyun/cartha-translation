  text: וְ/אִם לֹ֤א תִשְׁמְעוּ֙ בְּ/ק֣וֹל יְהוָ֔ה וּ/מְרִיתֶ֖ם אֶת פִּ֣י יְהוָ֑ה וְ/הָיְתָ֧ה יַד יְהוָ֛ה בָּ/כֶ֖ם וּ/בַ/אֲבֹתֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/015.yaml
  text: But if you do not listen to the voice of Yahweh and rebel against the command of Yahweh[a], then the hand of Yahweh will be against you and against your fathers.
translation:
  language: zh_hans
  text: 但如果你们不听从雅威的声音，反叛雅威的命令，雅威的手就必与你们和你们的列祖[a]作对。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文本作“你们的列祖”；一些古译本和许多解释者读作“你们的王”，这与上下文对百姓及其君王的警告相呼应。
    reason: alternative_reading
lexical_decisions:
- source_word: וְאִם
  choice: 但如果
  rationale: 承接上一节的正面条件，并引出相反的条件与后果；“但如果”自然表达这种转折。
- source_word: לֹא תִשְׁמְעוּ בְּקוֹל יְהוָה
  choice: 不听从雅威的声音
  rationale: 保留“听……的声音”这一希伯来语意象，同时用“听从”传达其中顺服的含义。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来语四字神名的通常拟音译出，避免采用源自“Jehovah”的形式。
- source_word: וּמְרִיתֶם
  choice: 反叛
  rationale: 该动词表示抗拒、悖逆，语气强于一般的“不服从”；“反叛”体现其严肃性。
- source_word: אֶת פִּי יְהוָה
  choice: 雅威的命令
  rationale: 原文直译为“雅威的口”，在这里指他口中所发的吩咐；译为“命令”清楚自然。
- source_word: וְהָיְתָה יַד יְהוָה
  choice: 雅威的手就必攻击
  rationale: 保留“雅威的手”这一表示神主动施行权能与审判的圣经意象，并以“攻击”说明本句中的敌对含义。
- source_word: בָּכֶם
  choice: 你们
  rationale: 与“攻击”搭配，直接表达雅威的手将以他们为攻击对象。
- source_word: וּבַאֲבֹתֵיכֶם
  choice: 和你们的列祖
  rationale: 马所拉文本读作“你们的父辈”；“列祖”既忠实于该读法，也符合庄重而通顺的现代中文表达。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: “雅威”较直接反映 YHWH 的通常学术拟音；“耶和华”虽为中文传统常用形式，却对应后起的 Jehovah 读法。
- issue: 末句 וּבַאֲבֹתֵיכֶם 的文本读法
  choice: 和你们的列祖
  alternative: 和你们的王
  rationale: 正文依据所给 WLC 马所拉文本，保留“列祖”；鉴于一些古译本及文本解释传统采用“你们的王”，且这更贴合上下文中百姓与君王并列受警告的结构，因此在脚注中保留异读。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。保留“雅威的声音”和“雅威的手”等关键希伯来语意象，同时将“雅威的口”按其语境译为自然易懂的“雅威的命令”。
