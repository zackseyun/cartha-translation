  text: וַ/יֹּאמְר֨וּ כָל הָ/עָ֜ם אֶל שְׁמוּאֵ֗ל הִתְפַּלֵּ֧ל בְּעַד עֲבָדֶ֛י/ךָ אֶל יְהוָ֥ה אֱלֹהֶ֖י/ךָ וְ/אַל נָמ֑וּת כִּֽי יָסַ֤פְנוּ עַל כָּל חַטֹּאתֵ֨י/נוּ֙ רָעָ֔ה לִ/שְׁאֹ֥ל לָ֖/נוּ מֶֽלֶךְ־־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/019.yaml
  text: 'Then all the people said to Samuel[a], “Pray to Yahweh your God for your servants, and do not let us die, for we have added to all our sins this evil: to ask for a king for ourselves.”'
translation:
  language: zh_hans
  text: 众百姓就对撒母耳说：“请为你的仆人向雅威你的上帝祷告[a]，不要让我们死，因为我们在自己一切的罪上，又加了这件恶事：为自己求一个王。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“请为你的仆人代求”。
    reason: “祷告”与后面的“为”合起来具有代求之意；脚注给出更集中表达这一语义的译法。
lexical_decisions:
- source_word: וַיֹּאמְרוּ כָל הָעָם
  choice: 众百姓就……说
  rationale: 保留集体性的“全体百姓”与叙事推进关系；“众百姓”在现代中文中简洁而庄重。
- source_word: הִתְפַּלֵּל בְּעַד עֲבָדֶיךָ
  choice: 请为你的仆人……祷告
  rationale: הִתְפַּלֵּל 基本义为“祷告”，בְּעַד 明确表达“为、代表”；正文采用自然说法，并在脚注保留“代求”的可能译法。“仆人”保存百姓对撒母耳的谦卑自称。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译保存四字神名的专名性质，不用头衔替代。
- source_word: אֱלֹהֶיךָ
  choice: 你的上帝
  rationale: 直译第二人称单数所属形式，保留百姓向撒母耳求助时所说“你的上帝”带来的关系张力。
- source_word: וְאַל נָמוּת
  choice: 不要让我们死
  rationale: אַֽל 加未完成式表达否定愿望；结合向撒母耳请求祷告的语境，中文用“不要让我们死”直接而自然。
- source_word: כִּי יָסַפְנוּ עַל כָּל חַטֹּאתֵינוּ רָעָה
  choice: 因为我们在自己一切的罪上，又加了这件恶事
  rationale: 保留 יסף 与 עַל 所表达的累加关系，并以“恶事”呈现 רָעָה 的道德分量。
- source_word: לִשְׁאֹל לָנוּ מֶלֶךְ
  choice: 为自己求一个王
  rationale: 不定式说明所加恶事的具体内容；לָנוּ 译作“为自己”，保留百姓为自身求王的强调。
theological_decisions:
- issue: “雅威你的上帝”中的关系表达
  choice: 保留“你的上帝”
  alternative: 我们的上帝；雅威上帝
  rationale: 原文明确使用第二人称单数后缀。保留这一称呼可呈现百姓求撒母耳代祷时的修辞和属灵张力，不据此否定雅威与以色列的圣约关系，也不擅自将其改成“我们的”。
- issue: 百姓求王的道德定性
  choice: 这件恶事
  alternative: 这件错事；这罪恶
  rationale: רָעָה 在这里具有道德含义；“恶事”保留其严肃性，同时不额外扩大为原文没有明说的教义判断。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。句式尽量贴近希伯来文的叙事次序和认罪结构；神名译作“雅威”，并保留“你的上帝”及“在……罪上又加……”的张力。
