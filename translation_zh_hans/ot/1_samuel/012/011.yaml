base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/011.yaml
  text: And Yahweh sent Jerubbaal and Bedan and Jephthah and Samuel[a], and he delivered you from the hand of your enemies all around[b], and you lived in safety.
translation:
  language: zh_hans
  text: 耶和华差遣了耶路巴力[a]、比但[b]、耶弗他和撒母耳，救你们脱离四围仇敌的手；你们安然居住。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “耶路巴力”是基甸的另一个名字（见《士师记》6:32；7:1）。
    reason: cross_reference
  - marker: b
    text: 希伯来文作“比但”。此人的身份不能确定；有些解释者认为是巴拉，较少数认为是押顿。
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的专名形式，明确对应希伯来文本中的神圣名字。
- source_word: וַיִּשְׁלַח
  choice: 差遣了
  rationale: 准确表达“派遣、差派”，且用于上帝差派领袖的语境自然庄重。
- source_word: יְרֻבַּעַל
  choice: 耶路巴力
  rationale: 保留马所拉文本所载人名，不在正文中改写为较熟悉的“基甸”；其身份以脚注说明。
- source_word: בְּדָן
  choice: 比但
  rationale: 按马所拉文本音译，不因身份难定而擅自校改为巴拉或押顿。
- source_word: יִפְתָּח
  choice: 耶弗他
  rationale: 采用现代中文圣经中通行且可辨识的人名译法。
- source_word: שְׁמוּאֵל
  choice: 撒母耳
  rationale: 采用现代中文通行人名译法。
- source_word: וַיַּצֵּל
  choice: 救……脱离
  rationale: 表达 נצל 从危险或控制中解救出来的含义，并与后面的“仇敌的手”自然衔接。
- source_word: מִיַּד אֹיְבֵיכֶם
  choice: 脱离……仇敌的手
  rationale: 保留希伯来语“手”所表达的权势、控制这一形象，中文亦清楚自然。
- source_word: מִסָּבִיב
  choice: 四围
  rationale: 简洁表达仇敌从周边包围或威胁的空间含义。
- source_word: וַתֵּשְׁבוּ בֶּטַח
  choice: 使你们安然居住
  rationale: “安然居住”自然表达在安全、无惧状态中生活；用“使”呈现前一拯救行动所带来的结果，虽略显化意，但符合上下文逻辑。
theological_decisions:
- issue: בְּדָן 的身份
  choice: 正文保留“比但”
  alternative: 巴拉；押顿
  rationale: 以WLC马所拉文本为准，不在正文中默默协调为另一位士师；文本与身份的不确定性留在脚注中。
- issue: 耶路巴力与基甸的关系
  choice: 正文译作“耶路巴力”
  alternative: 基甸
  rationale: 原文使用的是耶路巴力，应在正文保留该名字，同时以脚注帮助读者辨认此人就是基甸。
- issue: 末句与拯救行动的逻辑关系
  choice: 译作“使你们安然居住”
  alternative: “你们就安然居住”或“你们安然居住”
  rationale: 希伯来文形式上以连接词串联事件；中文用“使”可自然显示拯救带来的结果，但不应理解为原文明确使用目的从句。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。正文保留原文人名和“仇敌的手”这一希伯来语形象；两个脚注标记均置于相关人名之后。
