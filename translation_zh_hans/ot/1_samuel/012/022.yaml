base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/022.yaml
  text: For Yahweh will not forsake his people[a], for the sake of his great name[b], because Yahweh has been pleased to make you his people.
translation:
  language: zh_hans
  text: 耶和华必不撇弃他的子民[a]，因为他伟大的名；又因为耶和华乐意[b]使你们成为他自己的子民。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“离弃”或“抛弃”。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“定意”。本分句也可译为：“因为耶和华定意使你们作归他自己的子民。”
    reason: lexical_alternative
lexical_decisions:
- source_word: יִטֹּשׁ
  choice: 绝不会撇弃
  rationale: 该动词在此表示离弃、抛下；“撇弃”自然庄重，也保留盟约语境中的分量。结合否定词译作“绝不会”，清楚传达希伯来语未完成式在本句中的将来性保证。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 直接以现代简体中文读者熟悉的专名“耶和华”呈现四字神名，而不以“主”这一称号替代。
- source_word: עַמּוֹ
  choice: 他的子民
  rationale: “子民”准确表达 עַם 在神与以色列关系中的群体及盟约身份，比泛指性的“人民”更贴合语境。
- source_word: בַּעֲבוּר שְׁמוֹ הַגָּדוֹל
  choice: 为了他伟大的名
  rationale: 保留目的或缘由意味以及“伟大的名”这一希伯来表达，使神的名所承载的尊荣与声誉不被改写。
- source_word: הוֹאִיל
  choice: 既乐意
  rationale: 该词可表达甘愿、乐意或决意；“乐意”保留神主动而恩惠性的意愿，“既”则自然承接本句作为前述保证之根据的 כִּי。
- source_word: לַעֲשׂוֹת אֶתְכֶם לוֹ לְעָם
  choice: 使你们成为自己的子民
  rationale: “使……成为”准确呈现构成性动作；“自己的”明确表达 לוֹ 的归属含义，同时保持现代汉语流畅。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用四字神名，正文应保留为专名而非以“主”替换。“耶和华”是现代中文圣经传统中最普遍、普通读者最易识别的形式；“雅威”则更接近当代常见的学术拟音。
- issue: הוֹאִיל 所表达的神圣意愿
  choice: 乐意
  alternative: 决定／选择
  rationale: “乐意”兼顾意愿、主动与恩惠色彩，不把原文收窄为技术性的拣选概念；脚注保留“定意”的可能性。
- issue: 神不撇弃其子民的依据
  choice: 保留“为了他伟大的名”与“既乐意使你们成为自己的子民”并列承接
  alternative: 把后半句解释为单纯的拣选教义陈述
  rationale: 原文以两个 כִּי 结构陈明保证及其根据。译文保留神的名与他先前立民之意愿之间的张力，不额外建立超出本节的系统神学结论。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“绝不会”增强保证语气，但不增加超出否定式与语境的绝对性；分号呈现前后因果与解释关系。所有脚注标记均置于正文对应位置。
