  text: הֲ/ל֤וֹא קְצִיר חִטִּים֙ הַ/יּ֔וֹם אֶקְרָא֙ אֶל יְהוָ֔ה וְ/יִתֵּ֥ן קֹל֖וֹת וּ/מָטָ֑ר וּ/דְע֣וּ וּ/רְא֗וּ כִּֽי רָעַתְ/כֶ֤ם רַבָּה֙ אֲשֶׁ֤ר עֲשִׂיתֶם֙ בְּ/עֵינֵ֣י יְהוָ֔ה לִ/שְׁא֥וֹל לָ/כֶ֖ם מֶֽלֶךְ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/017.yaml
  text: Is it not wheat harvest today? I will call to Yahweh[a], and he will send thunder and rain, so that you may know and see that your wickedness is great[b], which you have done in the sight of Yahweh by asking for yourselves a king.
translation:
  language: zh_hans
  text: 今天不是小麦收割的时候吗？我要呼求雅威，他就会降下[b]雷声[a]和雨；你们要知道并看清：你们为自己求一个王，在雅威眼中所行的恶是何等大！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雷声”原文直译为“声音”，在这里的雷雨语境中指雷声。
    reason: lexical_alternative
  - marker: b
    text: “降下”原文直译为“给”；这里指雅威使雷声和雨来到。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: 不是……吗
  rationale: 保留预期听者肯定回答的反问语气，也符合现代汉语表达。
- source_word: קְצִיר חִטִּים
  choice: 收割小麦的时候
  rationale: 自然表达小麦收割的时节，并保留本节以反常天气为神迹背景的季节信息。
- source_word: אֶקְרָא אֶל יְהוָה
  choice: 我要呼求雅威
  rationale: “呼求”既表达向神发声祈求，也自然体现介词 אֶל 所含的指向性。
- source_word: יְהוָה
  choice: 雅威
  rationale: 将四字神名作为专名音译，不以称号替代。
- source_word: וְיִתֵּן
  choice: 他就会降下
  rationale: נתן 字面为“给”，但与雷雨连用时，现代汉语以“降下”表达神使天气现象发生更自然；脚注保留字面信息。
- source_word: קֹלוֹת
  choice: 雷声
  rationale: קֹלוֹת 字面是“声音”的复数，但在雷雨语境中明确指雷声；脚注保留其字面形式。
- source_word: וּדְעוּ וּרְאוּ
  choice: 你们就要知道，也要看清
  rationale: 两个并列祈使式均予保留；“看清”在汉语中自然表达由神迹确认并认清其罪恶的含义。
- source_word: רָעַתְכֶם רַבָּה
  choice: 你们……所行的恶是何等大
  rationale: “恶”保留 רָעָה 的道德判断，“何等大”体现 רַבָּה 的强烈程度。
- source_word: לִשְׁאֹל לָכֶם מֶלֶךְ
  choice: 为自己求立君王
  rationale: “为自己”保留 לָכֶם，“求立君王”自然表达百姓要求得到一位王的行动。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；音译“雅威”保留其专名性质，避免以称号代替。
- issue: 百姓求王之事的道德定性
  choice: 在雅威眼中所行的恶
  alternative: 你们的罪大恶极；你们做了一件很坏的事
  rationale: 原文明确称此事为 רָעָה，并以“在雅威眼中”限定其评价视角；译文保留这一神学张力，不扩大为抽象的全面定罪，也不弱化其道德严重性。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。反问句保留原文现场感；“知道，也要看清”维持两个并列动词的力度；语序略作汉语化调整，使“为自己求立君王”清楚归入“在雅威眼中所行的恶”。
