source:
  edition: WLC
  text: גַּם עַתָּה֙ הִתְיַצְּב֣וּ וּ/רְא֔וּ אֶת הַ/דָּבָ֥ר הַ/גָּד֖וֹל הַ/זֶּ֑ה אֲשֶׁ֣ר יְהוָ֔ה עֹשֶׂ֖ה לְ/עֵינֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/016.yaml
  text: Now then[a], stand still and see this great thing that Yahweh is doing before your eyes.
translation:
  language: zh_hans
  text: 现在，你们要站定，看雅威[a]在你们眼前所行的这件大事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文为“YHWH”（四字神名）；传统中文常译作“耶和华”。
    reason: 说明神名的原文形式及传统译名。
lexical_decisions:
- source_word: גַּם עַתָּה
  choice: 现在
  rationale: 该组合在此承接上文，并引出接下来郑重的吩咐；现代汉语用“现在”简洁自然，已能表达转折推进的语篇功能。
- source_word: הִתְיַצְּבוּ
  choice: 要站好
  rationale: יצב 的 Hitpael 命令式要求听众站定位置、留心观看。“站好”兼顾身体姿态和郑重等候的语气，又比“站住不动”更自然。
- source_word: וּרְאוּ
  choice: 看
  rationale: 该命令邀请百姓亲眼观察即将发生的神迹；“看”直接、自然，并保留亲身见证的意味。
- source_word: הַדָּבָר הַגָּדוֹל הַזֶּה
  choice: 这件大事
  rationale: דבר 可指话、事情或事件；此处指即将发生的非凡作为。“这件大事”自然且保持词义宽度，不将其过度限定为某一种神迹。
- source_word: אֲשֶׁר יְהוָה עֹשֶׂה
  choice: 耶和华所行的
  rationale: 分词 עֹשֶׂה 将行动描绘为正在展开或迫近发生。汉语定语结构“所行的”既庄重自然，也可涵盖眼前正在施行的动作。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经传统中对四字神名最广为人知的音译“耶和华”，并以脚注说明其希伯来文形式；不以“主”替代专名。
- source_word: לְעֵינֵיכֶם
  choice: 在你们眼前
  rationale: 保留希伯来语具象表达，强调这作为是公开的、百姓能够亲眼看见的。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 原文直接使用四字神名。正文采用普通中文读者最熟悉的专名音译“耶和华”，既保留其作为名字的性质，也避免以称号“上主”取代；脚注交代原文为 YHWH，以保留名称读音重建上的问题。
- issue: עֹשֶׂה 的时间意味
  choice: 所行的
  alternative: 将要行的；正在行的
  rationale: 希伯来文分词可呈现正在展开或迫近的行动。中文“所行的”不强行限定为纯粹现在或将来，保留原文在此语境中的生动性和时间张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“站好”比生硬的“站立”更自然，同时保留命令的郑重性；句序贴近希伯来文的劝令—观看—对象结构。
