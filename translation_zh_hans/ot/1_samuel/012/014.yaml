  text: אִם תִּֽירְא֣וּ אֶת יְהוָ֗ה וַ/עֲבַדְתֶּ֤ם אֹת/וֹ֙ וּ/שְׁמַעְתֶּ֣ם בְּ/קֹל֔/וֹ וְ/לֹ֥א תַמְר֖וּ אֶת פִּ֣י יְהוָ֑ה וִ/הְיִתֶ֣ם גַּם אַתֶּ֗ם וְ/גַם הַ/מֶּ֨לֶךְ֙ אֲשֶׁ֣ר מָלַ֣ךְ עֲלֵי/כֶ֔ם אַחַ֖ר יְהוָ֥ה אֱלֹהֵי/כֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/014.yaml
  text: If you fear Yahweh and serve him and listen to his voice and do not rebel against the command of Yahweh[b][a], then both you and the king who reigns over you will follow Yahweh your God.
translation:
  language: zh_hans
  text: 如果你们敬畏耶和华，事奉他，听从他的话，不悖逆耶和华的命令，那么你们和统治你们的王都必跟随耶和华你们的上帝。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译近似：“你们也必成为——你们和统治你们的王——在耶和华你们的上帝之后。”这里的意思可能是，你们和王都继续忠于或跟随耶和华；原文句法较为含混。
    reason: alternative_reading
lexical_decisions:
- source_word: אִם
  choice: 如果
  rationale: 引出条件从句，保留本节盟约劝诫中明确的条件意味。
- source_word: תִּירְאוּ אֶת־יְהוָה
  choice: 敬畏耶和华
  rationale: “敬畏”兼具惧怕、尊崇和忠诚的意味，是现代中文圣经语体中自然且有神学分量的表达；神名按中文通行形式译为“耶和华”。
- source_word: וַעֲבַדְתֶּם אֹתוֹ
  choice: 事奉他
  rationale: עבד 用于人与上帝的关系时包括敬拜性的服事；“事奉”既贴近原文，又比单译“敬拜”涵盖面更广。
- source_word: וּשְׁמַעְתֶּם בְּקֹלוֹ
  choice: 听从他的话
  rationale: 该希伯来语结构通常含有顺服地听的意思；“听从”自然表达顺服含义，“他的话”则传达“他的声音”的语义而避免生硬。
- source_word: וְלֹא תַמְרוּ אֶת־פִּי יְהוָה
  choice: 不违背耶和华的命令
  rationale: מרה 表示反叛、抗命；“违背”与“命令”搭配自然，并传达对上帝所吩咐之事的抗拒。“耶和华的口”是指他所说或命令的话。
- source_word: גַּם אַתֶּם וְגַם הַמֶּלֶךְ
  choice: 你们和……王都
  rationale: 用“……都”自然表达 גַּם…וְגַם 的“双方都”结构。
- source_word: אֲשֶׁר מָלַךְ עֲלֵיכֶם
  choice: 那位治理你们的王
  rationale: 虽为完成式，语境指已经登位、现正统治百姓的王；“治理你们”比“统治你们”更适合庄重经文语体。
- source_word: אַחַר יְהוָה אֱלֹהֵיכֶם
  choice: 跟随耶和华你们的上帝
  rationale: אַחַר 可表达跟随某人、效忠于某人；正文采用语境上最通顺的积极理解，同时以脚注保留希伯来文本句法上的含混。
theological_decisions:
- issue: 末句 וִהְיִתֶם ... אַחַר יְהוָה אֱלֹהֵיכֶם 的意义和句法
  choice: 译作结果句：“那么你们和……王都必跟随耶和华你们的上帝。”
  alternative: 较直译为：“你们和……王也必在耶和华你们的上帝之后／跟随耶和华你们的上帝。”也有人根据古译本或语境补出“就必安好”等意思。
  rationale: 马所拉文本的“你们必成为／存在……在耶和华之后”较为突兀；按 אַחַר 表示追随、效忠的常见用法译为“跟随”最符合上下文，但脚注说明字面形式，避免掩盖原文的困难和其他理解的可能。
- issue: שׁמע בקול 的顺服含义
  choice: 译作“听从他的话”。
  alternative: 可较形式对应地译作“听他的声音”。
  rationale: 该固定表达不只是听见，通常含有服从之意；“听从”在中文中同时保留听与顺服的关联，无须另加教派性解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“敬畏、事奉、听从、跟随”保留盟约语境的分量，同时避免过度古雅。正文只设一条脚注，因为“听从”已在自然中文中准确承载顺服性聆听的词义；脚注集中说明末句真实存在的文本与句法张力。
