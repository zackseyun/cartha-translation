  rationale: 仅作两项安全的措辞修订：以“不悖逆”恢复原文“反叛”的力度，并简化对王的定语从句。保留正文对末句的积极、语境化理解，且保留脚注以明示希伯来文的字面形式和句法含混，避免将争议完全消除。
