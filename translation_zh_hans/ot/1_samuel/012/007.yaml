  text: וְ/עַתָּ֗ה הִֽתְיַצְּב֛וּ וְ/אִשָּׁפְטָ֥ה אִתְּ/כֶ֖ם לִ/פְנֵ֣י יְהוָ֑ה אֵ֚ת כָּל צִדְק֣וֹת יְהוָ֔ה אֲשֶׁר עָשָׂ֥ה אִתְּ/כֶ֖ם וְ/אֶת אֲבוֹתֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/007.yaml
  text: Now therefore[a], stand here[b], and I will contend with you before Yahweh concerning all the righteous acts of Yahweh that he did for you and for your fathers.
translation:
  language: zh_hans
  text: 现在，你们要站定；我要在耶和华面前同你们理论[a]，论及耶和华为你们和你们祖先所行的一切公义作为[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “同你们理论”也可译作“审断你们”“同你们辩论”或“同你们分辩”。原文带有在耶和华面前进入诉讼、辩明是非的意味，并非单指宣判。
    reason: lexical_alternative
  - marker: b
    text: “公义作为”指耶和华为他子民所行、公正而信实的具体作为。
    reason: cultural_note
lexical_decisions:
- source_word: וְעַתָּה
  choice: 现在
  rationale: 承接上文并转入正式陈述；汉语“现在”自然保留其时间与话语转换功能，不必额外添加原文未明说的因果词。
- source_word: הִתְיַצְּבוּ
  choice: 你们要站好
  rationale: 该复数命令式要求听众站定、准备参加正式程序；“站好”在现代汉语中自然，也保留庄重场景。
- source_word: וְאִשָּׁפְטָה אִתְּכֶם
  choice: 我要……与你们申辩
  rationale: שפט 在此搭配表示进入司法性争辩或陈诉，而不只是宣判。“申辩”保留诉讼语感，同时避免误解为撒母耳已经定他们的罪。
- source_word: לִפְנֵי יְהוָה
  choice: 在耶和华面前
  rationale: 直译这一盟约及司法场景中的固定表达，表示在神的临在与鉴察之下。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经传统中最通行且易于普通读者辨认的神名译法。
- source_word: אֵת כָּל־צִדְקוֹת יְהוָה
  choice: 耶和华……所行的一切公义之举
  rationale: 复数 צִדְקוֹת 指具体彰显公义与信实的行动，而非抽象属性；“公义之举”兼顾词义与自然汉语。
- source_word: אֲשֶׁר עָשָׂה
  choice: 所行的
  rationale: 以简洁的关系结构表达普通动词 עשה，并与“公义之举”自然搭配。
- source_word: אִתְּכֶם וְאֶת־אֲבוֹתֵיכֶם
  choice: 为你们和你们祖先
  rationale: 介词字面可作“与”，但在这里描述耶和华施惠的历史行动，按语境译作“为”更自然；“祖先”准确传达群体历代先人的含义。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。正文保留专名而不以“主”替代；“耶和华”是简体中文普通读者最熟悉的形式。
- issue: צִדְקוֹת יְהוָה 的含义
  choice: 公义之举
  alternative: 拯救之举
  rationale: 此词既可涵盖施救，也强调耶和华行事公正并忠于盟约；译作“拯救之举”会把语义不必要地缩窄。
- issue: וְאִשָּׁפְטָה 的司法性语气
  choice: 申辩
  alternative: 审判
  rationale: 这里是撒母耳在耶和华面前陈列历史事实、与百姓理论，不宜预先限定为宣判；“申辩”保留司法张力和原文可能包含的责问意味。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“站好”比生硬的“站立”更自然，同时维持正式场景；“申辩”与“公义之举”保留本节的司法及盟约色彩。
