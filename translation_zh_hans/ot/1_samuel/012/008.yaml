base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/008.yaml
  text: When Jacob came into Egypt[a], your fathers cried out to Yahweh, and Yahweh sent Moses and Aaron[b], and they brought your fathers out of Egypt and settled them in this place.
translation:
  language: zh_hans
  text: 雅各来到埃及的时候，你们的祖先[a]向雅威呼求；雅威就差遣摩西和亚伦。他们把你们的祖先从埃及领出来，使他们住在这地方[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “祖先”直译为“父辈”。
    reason: lexical_alternative
  - marker: b
    text: “使他们住在这地方”也可译为“把他们安置在这里”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר בָּא יַעֲקֹב מִצְרָיִם
  choice: 雅各来到埃及以后
  rationale: כַּאֲשֶׁר在这里引出时间背景；בָּא表示来到、进入。译作“来到埃及以后”符合现代汉语叙事习惯，又保留事件的先后关系。
- source_word: וַיִּזְעֲקוּ
  choice: 呼求
  rationale: זעק表示人在危难中迫切呼喊求助；“呼求”兼顾向神祈求的方向和急切语气。
- source_word: אֲבוֹתֵיכֶם
  choice: 你们的祖先
  rationale: 字面可译“你们的父辈”，但此处泛指雅各之后在埃及受苦的先祖；“祖先”在现代汉语中自然清楚，并避免误解为听众的亲生父亲。
- source_word: יְהוָה
  choice: 雅威
  rationale: 直接音译希伯来文四字神名，保留其作为以色列之神盟约名字的性质。
- source_word: וַיִּשְׁלַח
  choice: 差遣
  rationale: 此处不只是一般地“送去”，而是神委派摩西和亚伦执行使命；“差遣”准确而庄重。
- source_word: וַיּוֹצִיאוּ
  choice: 他们把……领出来
  rationale: 该使役形式表示使人出来，复数主语自然承接摩西和亚伦；“领出来”符合出埃及叙事，也保持人的执行角色。
- source_word: וַיֹּשִׁיבוּם
  choice: 使他们住在
  rationale: 该使役形式表示使人居住、安顿；“使他们住在”较贴近语法形式，同时不把安置方式说得过细。
- source_word: בַּמָּקוֹם הַזֶּה
  choice: 这地方
  rationale: 直译为“这个地方”；“这地方”自然地指说话者和听众所在之地。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文两次直接使用四字神名。正文采用“雅威”，既呈现专名性质，也不以称号替代原文神名。
- issue: 摩西、亚伦与雅威在拯救行动中的关系
  choice: 保留复数“他们”，指摩西和亚伦执行领出与安置的行动
  alternative: 改为单数并明确说雅威领出、安置
  rationale: 原文在“雅威差遣摩西和亚伦”之后使用两个复数动词。译文保留其直接语法指向，不为解决神是最终拯救者与受差者是执行者之间的张力而改写原文。
translation_notes:
  register: 采用自然、庄重的现代标准普通话。用“呼求”“差遣”保持经文叙事的宗教语域，但避免古奥表达；分为两句，使较长的希伯来语并列结构在汉语中清晰易读。
