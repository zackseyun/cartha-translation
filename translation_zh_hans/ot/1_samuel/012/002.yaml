  text: וְ/עַתָּ֞ה הִנֵּ֥ה הַ/מֶּ֣לֶךְ מִתְהַלֵּ֣ךְ לִ/פְנֵי/כֶ֗ם וַ/אֲנִי֙ זָקַ֣נְתִּי וָ/שַׂ֔בְתִּי וּ/בָנַ֖/י הִנָּ֣/ם אִתְּ/כֶ֑ם וַ/אֲנִי֙ הִתְהַלַּ֣כְתִּי לִ/פְנֵי/כֶ֔ם מִ/נְּעֻרַ֖/י עַד הַ/יּ֥וֹם הַ/זֶּֽה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/002.yaml
  text: And now[a], look, the king is walking before you, and I have grown old and gray, and here are my sons with you[c][b]. And I have walked before you from my youth until this day.
translation:
  language: zh_hans
  text: 如今，你们看，王正走在你们前面[a]；我已经年老，头发也白了[b]；你们看，我的儿子们和你们在一起。自幼年至今，我一直走在你们前面[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“王走在你们前面”，也可意译为“王领导你们”。希伯来语“走在……前面”可以表示公开带领。
    reason: lexical_alternative
  - marker: b
    text: 或译：“我已经年老，变得白发苍苍。”
    reason: lexical_alternative
  - marker: c
    text: 也可意译为“我一直领导你们”。撒母耳在这里刻意用与王相同的“走在……前面”，把自己过去的公开职分与王如今的角色相对照。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: 如今
  rationale: 这是承接上文并引出撒母耳当前申诉的话语标记；“如今”兼顾连接性与时间含义，语体庄重而自然。
- source_word: הִנֵּה
  choice: 你们看
  rationale: 保留提醒听众注意眼前情形的指示作用，同时避免使用较古雅的“看哪”。
- source_word: מִתְהַלֵּךְ לִפְנֵיכֶם
  choice: 正走在你们前面
  rationale: 保留希伯来语“走在……前面”的意象及分词所表达的当前持续状态；该惯用语也可暗指公开带领，但正文不将含义收窄为“领导”。
- source_word: זָקַנְתִּי וָשַׂבְתִּי
  choice: 我已经年老，头发也白了
  rationale: 两个完成式表示已经达到的状态；明确说“头发也白了”，自然地保留年老发白的具体意象。
- source_word: וּבָנַי הִנָּם אִתְּכֶם
  choice: 我的儿子们也在这里，与你们在一起
  rationale: “在这里”体现 הִנָּם 的呈现和强调作用，“与你们在一起”则直接对应 אִתְּכֶם。
- source_word: הִתְהַלַּכְתִּי לִפְנֵיכֶם
  choice: 我一直走在你们前面
  rationale: 与本节描述王的同一短语保持呼应，以显出撒母耳刻意作出的角色对照；“一直”结合后面的时间范围，自然表达延续至今的经历。
- source_word: מִנְּעֻרַי עַד הַיּוֹם הַזֶּה
  choice: 自幼年至今
  rationale: 简洁、自然地表达从青年时期一直延续到说话当日的时间范围，不将 נְעוּרִים 过度限定为童年。
theological_decisions:
- issue: “走在你们前面”是否直接译成“领导你们”
  choice: 正文保留“走在你们前面”
  alternative: 领导你们
  rationale: 该希伯来语表达可以指公开带领，但也保有行在众人面前的具体意象。直译既维持王与撒母耳之间的修辞平行，也不把其角色含义解释得过窄。
translation_notes:
  register: 采用现代、庄重且普通读者易懂的书面普通话。“你们看”保留现场感而不过分古雅；两次“走在你们前面”有意保持一致，以保存原文的修辞平行和潜在的领导含义。
