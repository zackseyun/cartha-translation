source:
  edition: WLC
  text: הִנְ/נִ֣י עֲנ֣וּ בִ/י֩ נֶ֨גֶד יְהוָ֜ה וְ/נֶ֣גֶד מְשִׁיח֗/וֹ אֶת שׁוֹר֩ מִ֨י לָקַ֜חְתִּי וַ/חֲמ֧וֹר מִ֣י לָקַ֗חְתִּי וְ/אֶת מִ֤י עָשַׁ֨קְתִּי֙ אֶת מִ֣י רַצּ֔וֹתִי וּ/מִ/יַּד מִי֙ לָקַ֣חְתִּי כֹ֔פֶר וְ/אַעְלִ֥ים עֵינַ֖/י בּ֑/וֹ וְ/אָשִׁ֖יב לָ/כֶֽם־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/003.yaml
  text: 'Here I am[a]; testify against me before Yahweh and before his anointed: whose ox have I taken, or whose donkey have I taken? Whom have I oppressed? Whom have I mistreated? From whose hand have I taken a bribe[b], that I should hide my eyes with it? I will restore it to you.'
translation:
  language: zh_hans
  text: “我在这里。你们在雅威和他所膏立的人面前指证我：我拿过谁的牛？拿过谁的驴？我欺压过谁？虐待过谁[a]？我从谁手里收过贿赂[b]，因而闭眼不看？我必偿还给你们。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “虐待过谁”所译的希伯来语词较难确定，也可理解为“伤害过谁”或“粗暴对待过谁”。
    reason: lexical_alternative
  - marker: b
    text: “贿赂”也可译作“赎价”或“补偿款”；但这里提到收钱后“闭眼不看”，因此语境更支持使人枉法的贿款。
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי
  choice: 看，我在这里
  rationale: 保留说话者公开现身、愿受查验的语气；“看”传达 הִנֵּה 的提示作用，“我在这里”符合现代汉语。
- source_word: עֲנוּ בִי
  choice: 指证我
  rationale: 在“雅威和他所膏立的人面前”的公开司法语境中，该短语指作证提出控告；“指证我”简洁自然。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以常见的现代汉语音译呈现神名，不用称号替代专名。
- source_word: מְשִׁיחוֹ
  choice: 他所膏立的人
  rationale: 此处直接所指是受膏的君王；这样既保留膏立观念，也避免把历史语境中的称谓直接专名化为“弥赛亚”。
- source_word: לָקַחְתִּי
  choice: 夺过／拿过
  rationale: 牛的问句用“夺过”凸显非法侵占，驴的问句用“拿过”保持自然汉语；两者都保留财物被取走的核心意义。
- source_word: עָשַׁקְתִּי
  choice: 欺压过
  rationale: 该词涵盖利用权势压迫、剥削或侵害他人，“欺压”保留其广泛的社会和法律含义。
- source_word: רַצּוֹתִי
  choice: 虐待过
  rationale: 该词形和确切含义较难确定，语境大致指粗暴对待或伤害；“虐待”与前面的“欺压”有所区分，又不把可能的具体意象定死。
- source_word: כֹפֶר
  choice: 贿赂
  rationale: 该词也可指赎价或补偿款，但随后“闭眼不看”的司法意象表明这里最可能是使人枉法的贿款。
- source_word: אַעְלִים עֵינַי בּוֹ
  choice: 因而闭眼不看
  rationale: 保留“闭眼”的身体意象，同时用“因而”表达收取款项与故意无视之间的语境关系；原文代词所指略有含混，正文不强行补出具体对象。
- source_word: וְאָשִׁיב לָכֶם
  choice: 我必偿还给你们
  rationale: 保持原文未明说受词的概括表达，意为若有侵占或不义所得，撒母耳愿意归还。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华／上主
  rationale: 原文使用四字神名；音译为“雅威”可将其作为专名呈现，而不以称号替代。
- issue: מְשִׁיחוֹ 在历史君王语境中的译法
  choice: 他所膏立的人
  alternative: 他的受膏者／他的弥赛亚
  rationale: 上下文指当时受膏的君王。采用描述性译法可保留与“膏立”的词义联系，同时不把后来的专门弥赛亚称号直接带入本节。
- issue: 司法问责语气
  choice: 在雅威和他所膏立的人面前指证我
  alternative: 在雅威和他的受膏者面前回答我
  rationale: 此处是撒母耳公开要求百姓提出控告；“指证”准确体现法律性的作证语气，但不预设确有罪行。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语，保留连续反问形成的公开自辩和司法查验语气。脚注标记放在其实际解释的疑难词之后；不沿用英语咨询层中把 [a] 误置于“Here I am”之后的位置。
