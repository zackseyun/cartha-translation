base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/023.yaml
  text: As for me[a], far be it from me that I should sin against Yahweh by ceasing to pray for you[c][b]; and I will instruct you in the good and upright way.
translation:
  language: zh_hans
  text: 至于我，我断不敢停止为你们祷告，以致得罪雅威[a]；我必教导你们那良善正直的道路。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威”是希伯来文神名 יהוה（YHWH）的音译；传统中文译本多译作“耶和华”，也有译本以“主”代替该神名。
    reason: 说明神名的原文形式及中文译名传统。
lexical_decisions:
- source_word: גַּם אָנֹכִי
  choice: 至于我
  rationale: 这一组合突出撒母耳本人，并与上下文中百姓的责任形成对照；“至于我”在现代汉语中自然地保留了这种强调。
- source_word: חָלִילָה לִּי
  choice: 我绝不至于
  rationale: 这是强烈否定、厌弃某种可能性的惯用语；“绝不至于”既表达坚决拒绝，也能顺畅连接后面的“因……而得罪”。
- source_word: מֵחֲטֹא לַיהוָה
  choice: 因……而得罪雅威
  rationale: 原文明确把停止代祷说成对雅威的犯罪；“得罪”保留了罪所针对的对象，没有弱化为一般的失职。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，保留其作为专名的性质，而不以称号代替。
- source_word: מֵחֲדֹל לְהִתְפַּלֵּל בַּעַדְכֶם
  choice: 因停止为你们祷告
  rationale: 准确表达原文所说的罪在于停止为百姓代求；“为你们祷告”是清楚自然的现代汉语。
- source_word: וְהוֹרֵיתִי אֶתְכֶם
  choice: 我还要教导你们
  rationale: 使役式动词在此兼有教诲和引导之意；“教导”适合先知给予道德与信仰指引的语境。
- source_word: בְּדֶרֶךְ הַטּוֹבָה וְהַיְשָׁרָה
  choice: 走良善正直的道路
  rationale: “道路”保留原文关于生活方式的比喻；补出汉语所需的“走”，使“教导你们”与道路意象自然衔接。“良善正直”保留两个并列的伦理形容词。
theological_decisions:
- issue: 撒母耳停止代祷究竟只是失职，还是对神犯罪
  choice: 明确译为“因停止为你们祷告而得罪雅威”
  alternative: 译作一般性的疏忽职责，不强调对神的冒犯
  rationale: 原文直接使用“向／对雅威犯罪”的表述，因此不可将其弱化为单纯的领导失责；同时不据此扩展为本节未明说的普遍教义。
- issue: 如何处理神名 יְהוָה
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文使用四字神名，正文以“雅威”音译，保留专名性质；脚注说明其他常见译法，避免把音译选择误当作对发音不确定性的消除。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“绝不至于”传达原文强烈的拒绝语气；“因停止……而得罪”保留原文将停止代祷明确界定为对神犯罪的逻辑关系。
