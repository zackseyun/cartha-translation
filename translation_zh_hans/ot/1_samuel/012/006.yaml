base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/006.yaml
  text: Then Samuel said to the people[b][a], “Yahweh is the one who appointed Moses and Aaron and who brought your fathers up from the land of Egypt.”
translation:
  language: zh_hans
  text: 撒母耳对百姓说：“那设立摩西和亚伦[a]、又领你们的先祖[b]从埃及地上来的，是雅威。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文动词通常意为“做、造”或“使成”。此处可能指雅威确立摩西和亚伦所承担的职分。
    reason: 保留 עָשָׂה 的基本词义范围，同时说明本节语境中“设立”的理解。
  - marker: b
    text: “先祖”原文直译为“父辈”，这里可泛指祖先。
    reason: 说明希伯来语阳性亲属称谓的字面形式与语境中的广义用法。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 撒母耳……说
  rationale: 未单独译出连接词 וַ，以符合现代汉语叙事习惯；动词 אמר 直译为“说”，上下文中的先后关系仍然清楚。
- source_word: אֶל הָעָם
  choice: 对百姓
  rationale: 自然、直接地表达介词 אֶל 与定冠词名词 הָעָם；“百姓”适合指在场的以色列民众。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，而不以“主”这一称号替代。
- source_word: אֲשֶׁר עָשָׂה אֶת מֹשֶׁה וְאֶת אַהֲרֹן
  choice: 那设立摩西和亚伦
  rationale: עָשָׂה 的基本义是“做、使成”，但此处以摩西和亚伦为宾语，语境指雅威使他们承担领袖职分；“设立”既自然，也保留其确立身份与职分的意味。脚注注明更直译的可能。
- source_word: וַאֲשֶׁר הֶעֱלָה
  choice: 又领……上来
  rationale: 保留 עלה 的使役义“使上来、领上来”，也保留出埃及叙事中常见的“上来”空间表达。
- source_word: אֶת אֲבֹתֵיכֶם
  choice: 你们的先祖
  rationale: אָבוֹת 字面为“父辈”，在此历史回顾中泛指听众的祖辈；“先祖”是现代汉语自然且庄重的对应词。
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: 从埃及地
  rationale: 贴近希伯来语“从埃及之地”的形式，同时在汉语中简洁自然。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用神的专名；采用音译“雅威”保留专名性质，避免以称号“主”代替。
- issue: עָשָׂה 用于摩西和亚伦时的含义
  choice: 设立摩西和亚伦
  alternative: 造了摩西和亚伦；使摩西和亚伦成就其职分
  rationale: 这里的重点是雅威在救赎历史中确立领袖，而不是创造他们的生命。“设立”清楚表达语境中的职分意义；脚注保留原词较宽的字面含义，避免掩盖措辞上的张力。
- issue: 无系词句 יְהוָה אֲשֶׁר... 的表达
  choice: 那……的，是雅威
  alternative: 雅威设立了……，又领……
  rationale: 倒装判断句明确呈现原文把雅威标举为行动主体的焦点结构，而不把它简化为普通叙述句。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“那……的，是雅威”保留原文判断句对行动主体的强调；“领……上来”有意保留出埃及传统表达中的方向意象。脚注标记紧跟相关词组。
