base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/012.yaml
  text: When you saw that Nahash king of the Ammonites was coming against you[a], you said to me, ‘No, but a king shall reign over us’—though Yahweh your God was your king.
translation:
  language: zh_hans
  text: 你们看见亚扪人的王拿辖前来攻打你们，就对我说：‘不，我们一定要有一位王统治我们。’尽管耶和华你们的上帝本是你们的王。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“耶和华你们的上帝是你们的王。”希伯来语此句没有明说系词，因此可按上下文补作过去时，也可理解为现在时。
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּרְאוּ כִּי
  choice: 你们看见……
  rationale: כִּי在此引出“看见”的内容；中文可直接以“看见……前来”自然表达，无须另译“看见……这件事”。
- source_word: נָחָשׁ מֶלֶךְ בְּנֵי עַמּוֹן
  choice: 亚扪人的王拿辖
  rationale: 按现代汉语习惯调整称号与人名的语序；בְּנֵי עַמּוֹן在民族意义上译作“亚扪人”。
- source_word: בָּא עֲלֵיכֶם
  choice: 前来攻打你们
  rationale: בוא加עַל在此军事语境中表示敌对进逼；“前来攻打”既体现行动方向，也明确其敌意。
- source_word: לֹא כִּי
  choice: 不！一定要
  rationale: 该结构先否定、再提出相反主张；“不！”保留强烈拒绝，“一定要”传达百姓坚持由人王统治的语气。
- source_word: מֶלֶךְ יִמְלֹךְ עָלֵינוּ
  choice: 有一位王统治我们
  rationale: 同根名词与动词的希伯来语结构在中文中不宜机械重复；“有一位王统治我们”自然表达其要求，并结合“一定要”体现强调。
- source_word: וַיהוָה אֱלֹהֵיכֶם
  choice: 耶和华你们的上帝
  rationale: יהוה采用现代中文圣经中通行且可辨识的专名“耶和华”；אֱלֹהֵיכֶם直译为“你们的上帝”。
- source_word: מַלְכְּכֶם
  choice: 本是你们的王
  rationale: 希伯来语为无显式系词的名词句；正文依叙事回顾补出过去含义，以“本是”突出他们要求人王时已有耶和华为王。
theological_decisions:
- issue: וַיהוָה אֱלֹהֵיכֶם מַלְכְּכֶם无显式系词，时间指向可有歧义
  choice: 耶和华你们的上帝本是你们的王
  alternative: 耶和华你们的上帝是你们的王
  rationale: 上下文是撒母耳回顾百姓当时要求立王，故正文用“本是”较贴合叙事责备；但原文名词句也可表达持续的现状，因此脚注保留现在时理解，不将神学张力单向化解。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“其实”承接前句并凸显百姓要求人王与耶和华为王之间的反差；引语用短促的“不！”保留原文纠正、坚持的力度。脚注标记已置于正文相关句末。
