base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/015.yaml
  text: David said to him[a], “Will you lead me down to this raiding party?” He said, “Swear to me by God that you will not kill me or hand me over into the hand of my master, and I will lead you down to this raiding party.”
translation:
  language: zh_hans
  text: 大卫对他说：“你能带我下到这支劫掠队[a]那里去吗？”他说：“请你指着上帝向我起誓，不杀我，也不把我交在我主人手里，我就带你下到这支劫掠队那里去。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“队伍”或“部队”；希伯来语这个词在此指一支四处劫掠的武装队伍。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתוֹרִדֵנִי
  choice: 你肯领我下到……那里吗
  rationale: 使役式的 ירד 表示“使下去、带下去”；结合这名仆人为大卫引路的语境，“领我下到”既保留方向含义，也符合现代汉语表达。
- source_word: הַגְּדוּד
  choice: 劫掠队
  rationale: גְּדוּד 在此指实施袭掠的武装群体，即袭击洗革拉的亚玛力队伍；“劫掠队”比笼统的“队伍”更能体现其行动性质。
- source_word: הִשָּׁבְעָה לִּי בֵאלֹהִים
  choice: 请你指着上帝向我起誓
  rationale: 保留誓言明确以上帝为凭的含义；“指着上帝……起誓”是自然、庄重的现代汉语。
- source_word: אִם תְּמִיתֵנִי
  choice: 绝不杀我
  rationale: אִם 在誓言格式中含有省略的否定和咒诅意味；汉语需明说否定。“绝不”体现誓言所要求的强烈保证。
- source_word: תַּסְגִּרֵנִי בְּיַד אֲדֹנִי
  choice: 把我交在我主人手里
  rationale: סגר 的使役式在此意为“交付”；保留“在……手里”的希伯来语意象，以表达落入主人权下。
- source_word: אֲדֹנִי
  choice: 我主人
  rationale: 此处指这名埃及仆人的人间主人，并非上帝；译作“主人”可避免歧义，也符合主仆关系。
- source_word: וְאוֹרִדְךָ
  choice: 我就领你下到……那里
  rationale: 与前面的 הֲתוֹרִדֵנִי 同为 ירד 的使役式，前后一致译为“领……下到”，保留引路及方向含义。
