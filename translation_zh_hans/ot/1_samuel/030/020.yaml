base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/020.yaml
  text: David took all the flocks and the herds[a]. They drove them ahead of the other livestock, and said[b], “This is David’s spoil.”
translation:
  language: zh_hans
  text: 大卫带走了所有的羊群和牛群。众人把这些牲畜赶在那些牲畜前面[a]，说：“这是大卫的战利品[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “那些牲畜”很可能指先前从亚玛力人手中夺回的牲畜；新取得的羊群和牛群被赶在它们前面。不过，希伯来文的指代较为简略。
    reason: 说明指示语的可能所指，同时保留原文的含混。
  - marker: b
    text: “战利品”也可译作“掠物”。
    reason: 提供שָׁלָל的词义替代译法。
lexical_decisions:
- source_word: וַיִּקַּח
  choice: 带走了
  rationale: לקח的基本义是“取、拿”。在牲畜和战利品的叙事语境中，“带走了”比生硬的“取了”更自然，也不像“抢夺了”那样额外强调暴力。
- source_word: כָּל הַצֹּאן וְהַבָּקָר
  choice: 所有的羊群和牛群
  rationale: 保留כָּל的完整范围，并以“羊群和牛群”自然表达צֹאן（羊、山羊等小型牲畜的集合称谓）与בָּקָר（牛群）的区别。
- source_word: נָהֲגוּ
  choice: 众人把这些牲畜赶
  rationale: נהג在这里指驱赶牲畜前行。希伯来语动词为复数，汉语补出语境中的不定复数主语“众人”，并补明承前省略的宾语“这些牲畜”。
- source_word: לִפְנֵי הַמִּקְנֶה הַהוּא
  choice: 在那些牲畜前面
  rationale: לִפְנֵי表示空间上的“在……前面”；מִקְנֶה是牲畜的集合称谓，הַהוּא保留为指示性的“那些”，不在正文中完全消除其所指可能存在的含混。
- source_word: זֶה שְׁלַל דָּוִד
  choice: 这是大卫的战利品
  rationale: זֶה按单数译为“这是”，指向整体所得；שָׁלָל指战争或袭击中取得的战利品，“战利品”在现代汉语中准确、自然。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“带走了”避免过度解释לקח，“众人”使希伯来语复数动词在汉语中表达清楚；正文保留“这些牲畜／那些牲畜”的对照，并以脚注解释可能的场景。
