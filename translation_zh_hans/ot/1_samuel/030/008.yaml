base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/008.yaml
  text: And David inquired of the LORD, saying, “Should I pursue this raiding party? Will I overtake them?” And he said to him, “Pursue, for you will surely overtake them, and you will surely rescue.”
translation:
  language: zh_hans
  text: 大卫求问耶和华说：“我可以追赶这支劫掠队吗？我能追上他们吗？”耶和华回答他：“追吧！你一定能追上，也一定能救回。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁאַל דָּוִד בַּיהוָה
  choice: 大卫求问耶和华
  rationale: “求问”准确表达在神面前寻求指示的语境；神名 יהוה 音义兼顾传统中文圣经惯例，译作“耶和华”。
- source_word: הַגְּדוּד
  choice: 这支劫掠队
  rationale: גְּדוּד 在本章指袭击洗革、掳走人口财物的队伍；“劫掠队”比泛称“军队”更切合上下文。
- source_word: הַשֵּׂג תַּשִּׂיג
  choice: 一定能追上
  rationale: 同源不定式加限定动词构成强调，译为“一定能”；השׂיג 在追赶语境中意为“追上、赶上”。
- source_word: וְהַצֵּל תַּצִּיל
  choice: 也一定能救回被掳的人
  rationale: 同源结构同样表示强调；הציל 意为解救、搭救。结合本章被掳者的语境，补明“被掳的人”，并以“救回”自然表达从劫掠者手中夺回之意。
theological_decisions:
- issue: 回答者的身份
  choice: 耶和华回答他
  alternative: 他回答大卫
  rationale: 希伯来文仅用第三人称单数“他”，语法上的先行者是耶和华。正文明确为“耶和华”可避免现代汉语代词指向含混，并不增加新的神学信息。
- issue: 救援应许的宾语
  choice: 救回被掳的人
  alternative: 施行拯救／救回
  rationale: 原文动词没有明示宾语，形式上可保留绝对用法；但叙事上下文明确涉及被掳的家眷。为使现代汉语完整自然而补出语境宾语，不将其扩大为一般性的属灵救恩。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“我可以……吗？我能……吗？”保留大卫先询问行动许可、再询问结果的两层问题；神谕中的两个强调结构均以“一定能”对应。
