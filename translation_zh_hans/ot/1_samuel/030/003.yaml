  text: When David and his men came to the city, behold, it had been burned with fire, and their wives, sons, and daughters had been taken captive.
translation:
  language: zh_hans
  text: 大卫和跟随他的人来到城里，只见城已经被火焚烧了；他们的妻子、儿子和女儿被掳走了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִנֵּה
  choice: 只见
  rationale: 以现代汉语自然地保留叙事中突然看见眼前景象的提示作用。
- source_word: שְׂרוּפָה בָּאֵשׁ
  choice: 已被火烧毁
  rationale: 保留被动含义及动作先于到达而完成的语境；“烧毁”自然表达城市遭焚烧后的状态。
- source_word: נִשְׁבּוּ
  choice: 被掳走了
  rationale: 准确表达被敌人俘掳并带走，而不弱化为一般的带走。
- source_word: אֲנָשָׁיו
  choice: 跟随他的人
  rationale: 在此军事叙事语境中指大卫麾下的人；此译法自然，并避免把范围误解为泛指男性。
