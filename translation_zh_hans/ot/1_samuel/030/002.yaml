base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/002.yaml
  text: They took captive the women who were in it[a], from small to great. They did not kill anyone, but led them away and went on their way.
translation:
  language: zh_hans
  text: 他们掳走了城里的妇女，从小到大[a]。他们没有杀一个人，却押着她们离去，继续上路。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“从年幼的到年长的”。希伯来语“从小到大”是一种惯用语，可以表示所有人，无一例外。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁבּוּ
  choice: 掳走了
  rationale: 该动词指在战争中掳人为俘虏；“掳走”既保留军事语境，也自然带出随后押走俘虏的动作。
- source_word: הַנָּשִׁים
  choice: 妇女
  rationale: 原词的基本含义是“妇女”，虽在上下文中包括妻子，却不宜缩窄为“妻子”。
- source_word: אֲשֶׁר בָּהּ
  choice: 城里的
  rationale: 阴性单数代词回指上一节的洗革城；汉语用“城里的”比直译“其中的”更清楚自然。
- source_word: מִקָּטֹן וְעַד גָּדוֹל
  choice: 从小到大
  rationale: 贴近希伯来语惯用语，同时保留它可能泛指整个范围、而不只明确按年龄划分的含混性。
- source_word: לֹא הֵמִיתוּ אִישׁ
  choice: 一个也没有杀
  rationale: אִישׁ在这里是不定指，表示任何一个人，并非专指成年男性；此译法自然表达无一被杀。
- source_word: וַיִּנְהֲגוּ
  choice: 带着这些人离去
  rationale: נהג可指驱赶或带领；这里宾语承接被掳的妇女，译文明确补出“这些人”，并表现强制带走之意。
- source_word: וַיֵּלְכוּ לְדַרְכָּם
  choice: 继续上路
  rationale: 这是表示离开并沿原定方向前行的惯用表达；“继续上路”符合现代汉语叙事。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。保留“从小到大”这一原文表达的范围含混性，并以脚注说明可能的年龄解释；避免把“妇女”缩窄为“妻子”。
