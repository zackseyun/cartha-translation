base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/009.yaml
  text: So David went[a], he and the six hundred men who were with him, and they came to the Brook Besor[b], where those who were left behind stayed.
translation:
  language: zh_hans
  text: 大卫和随从他的六百人一同前往，到了比梭溪[a]；其余的人留在那里[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “比梭溪”也可译作“比梭干河床”或“比梭旱溪”；所指可能是季节性有水的溪床或河谷。
    reason: cultural_note
  - marker: b
    text: “留在那里”原文直译为“站住了”；在行程语境中指停下并留在原处。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: 一同前往
  rationale: 该叙事性动词推进情节；结合后面的独立代词和同行者，用“一同前往”自然表达大卫带着众人出发前行。
- source_word: הוּא וְשֵׁשׁ מֵאוֹת אִישׁ אֲשֶׁר אִתּוֹ
  choice: 大卫和跟随他的六百人
  rationale: 独立代词 הוּא 将大卫与六百人并列；“跟随他的六百人”在现代汉语中自然，也准确表达 אֲשֶׁר אִתּוֹ。上下文表明这些人是大卫的男性随从。
- source_word: וַיָּבֹאוּ
  choice: 来到
  rationale: 复数动词以大卫和六百人为共同主语；“来到”简洁表达到达该地点。
- source_word: עַד נַחַל הַבְּשׂוֹר
  choice: 来到比梭溪
  rationale: עַד 在行程语境中表示抵达某处；נַחַל 可指溪流、河谷或季节性有水的溪谷。“比梭溪”通俗且保留地名。
- source_word: וְהַנּוֹתָרִים
  choice: 留下的人
  rationale: 该分词指余下或留下的人。译文不提前引入下一节才明确说明的疲惫原因，以保留本节的简略表达。
- source_word: עָמָדוּ
  choice: 停在那里
  rationale: עָמַד 的基本义是“站立”，但在行程语境中表示停下并留在原处；“停在那里”比直译“站着”更准确自然。
theological_decisions: []
