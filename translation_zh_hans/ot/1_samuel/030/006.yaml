source:
  edition: WLC
  text: וַ/תֵּ֨צֶר לְ/דָוִ֜ד מְאֹ֗ד כִּֽי אָמְר֤וּ הָ/עָם֙ לְ/סָקְל֔/וֹ כִּֽי מָ֨רָה֙ נֶ֣פֶשׁ כָּל הָ/עָ֔ם אִ֖ישׁ עַל בנ/ו וְ/עַל בְּנֹתָ֑י/ו וַ/יִּתְחַזֵּ֣ק דָּוִ֔ד בַּ/יהוָ֖ה אֱלֹהָֽי/ו־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/006.yaml
  text: And David was greatly distressed[a], because the people spoke of stoning him, for the soul of all the people was bitter, each man because of his sons and his daughters. But David strengthened himself in Yahweh his God.
translation:
  language: zh_hans
  text: 大卫极其困苦，因为众人扬言要用石头打死他；全体众人心中都愁苦[a]，各人都因自己的儿子和女儿。大卫却在雅威——他的上帝——里面使自己刚强起来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“全体众人的魂是苦的”。“苦”可指深切的悲痛，也可含因痛苦而愤懑的意味。
    reason: 保留希伯来语“魂是苦的”这一具体表达，以及其悲痛和愤懑的语义幅度。
lexical_decisions:
- source_word: וַתֵּצֶר לְדָוִד מְאֹד
  choice: 大卫处境极其危急
  rationale: 该结构以לְדָוִד说明承受困境的人，מְאֹד加强程度。“处境极其危急”既反映事情对大卫变得非常艰难，也符合现代汉语表达。
- source_word: הָעָם
  choice: 众人
  rationale: 原词是集合名词“百姓、众人”；上下文所指是跟随大卫的战士。译作“众人”不把原文过度具体化，也能自然指向在场群体。
- source_word: לְסָקְלוֹ
  choice: 说要用石头打死他
  rationale: 介词לְ加不定式说明众人所谈论、打算采取的行动。“说要……”保留尚在商议或扬言的语气，“用石头打死”明确表达סקל。
- source_word: מָרָה נֶפֶשׁ כָּל הָעָם
  choice: 众人……心里苦痛不堪
  rationale: 原文以单数“魂”集合性地描述全体众人，并用“苦”表达深切的悲痛与愤懑。正文采用自然汉语，脚注保留其具体意象与情感张力。
- source_word: אִישׁ עַל בָּנָיו וְעַל בְּנֹתָיו
  choice: 众人都因自己的儿女
  rationale: אִישׁ在这里作逐一分配用法，即各人；עַל表示悲苦的缘由。汉语以“众人都因自己的儿女”简洁表达每个人都为自己的儿子和女儿悲苦，且“儿女”完整涵盖两者。
- source_word: וַיִּתְחַזֵּק
  choice: 使自己刚强起来
  rationale: Hitpael词形具有反身或中动态意味。此译保留大卫主动坚定自己的层面，不把它单纯改成被动的“得了力量”。
- source_word: בַּיהוָה אֱלֹהָיו
  choice: 靠着他的上帝雅威
  rationale: בְּ可表示倚靠的对象或力量来源；“靠着”在现代汉语中自然清楚。将יהוה音译为“雅威”，并把אֱלֹהָיו译为“他的上帝”。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。音译“雅威”保留其作为专名的功能，避免以称号“主”代替；“耶和华”是另一种传统音译。
- issue: 大卫如何得着刚强
  choice: 靠着他的上帝雅威，使自己刚强起来
  alternative: 在雅威他的上帝里面刚强起来；从他的上帝雅威那里得着力量
  rationale: 原文的בְּ与反身/中动态动词同时呈现雅威是大卫力量所系，以及大卫主动坚定自己的行动。正文保留这两面，不将其化约为纯粹自我激励或纯粹被动领受。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“处境极其危急”“心里苦痛不堪”便于普通读者理解；“使自己刚强起来”稍具经文庄重感，同时保留原文反身语态。神名采用现代汉语音译“雅威”。
