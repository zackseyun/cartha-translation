revisions:
- from: 大卫处境极其危急，因为众人说要用石头打死他；众人都因自己的儿女而心里苦痛不堪[a]。大卫却靠着他的上帝雅威，使自己刚强起来。
  to: 大卫极其困苦，因为众人扬言要用石头打死他；全体众人心中都愁苦[a]，各人都因自己的儿子和女儿。大卫却在雅威——他的上帝——里面使自己刚强起来。
  rationale: 修订以“极其困苦”避免将大卫的困境过度限定为“危急”；以“扬言”表达众人正在谈论／打算石刑；以“全体众人……各人”保留集合与逐一分配的句法；并将末句调整为“在雅威——他的上帝——里面”，使神名同位语符合汉语习惯，同时保留原文介词和反身动词的表达。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T05:26:45Z'
review_pass:
  verdict: revise
  source_fidelity: 译文总体准确呈现了大卫所受的极大困境、众人意图用石头打死他、众人因儿女而苦痛，以及大卫在雅威里的自我坚强。惟“处境极其危急”较偏向客观险境，原文更直接说大卫极其受困／痛苦；末句“靠着他的上帝雅威”中神名与同位语的语序也不合汉语习惯，并稍将בְּ的“在……里面”收窄为工具性倚靠。
  naturalness: “众人都因自己的儿女而心里苦痛不堪”自然，但“全体众人”及“各人”的集合和分配层面可更清楚地在自然汉语中表达。“雅威他的上帝”或“雅威——他的上帝——”比“他的上帝雅威”更符合现代汉语中专名加同位说明的惯例。
  terminology: “雅威”与既定神名处理一致。“使自己刚强起来”恰当地保留了Hitpael的反身／中动态色彩。将נפש的“苦”在正文译为“心中愁苦”，并以脚注说明其可含愤懑，既自然又保留词义幅度。
