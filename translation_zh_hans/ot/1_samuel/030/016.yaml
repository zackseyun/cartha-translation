base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/016.yaml
  text: When he had led him down[a], behold, they were spread out over the face of all the land[b], eating and drinking and celebrating over all the great spoil that they had taken from the land of the Philistines and from the land of Judah.
translation:
  language: zh_hans
  text: 他把大卫领下去，只见那些人散布在遍地，正在吃喝，并因从非利士地和犹大地夺来的大量战利品而欢庆[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “因……而欢庆”也可译为“为着……欢庆”或“就……欢庆”。这里的介词可表示他们欢庆所关涉的战利品，也可表示欢庆的缘由或场合。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּרִדֵהוּ
  choice: 他把大卫领下去
  rationale: 使役词形表示“使下去、带下去”；上下文中的宾语是大卫。译出“大卫”可避免现代汉语代词所指不清，同时保留方向感。
- source_word: וְהִנֵּה
  choice: 只见
  rationale: 作为叙事中的提示语，生动引出眼前突然呈现的景象；“只见”比“看哪”更符合现代汉语叙事习惯。
- source_word: נְטֻשִׁים עַל־פְּנֵי כָל־הָאָרֶץ
  choice: 散布在遍地
  rationale: 被动分词描写众人分散或铺展开来的状态；“遍地”自然表达当地整个可见区域，不误解为全世界。
- source_word: אֹכְלִים וְשֹׁתִים וְחֹגְגִים
  choice: 正在吃喝，并……欢庆
  rationale: 分词表示持续进行的动作；保留吃、喝、欢庆三层内容，同时按现代汉语自然组合。
- source_word: בְּכֹל הַשָּׁלָל הַגָּדוֹל
  choice: 因……大量战利品而欢庆
  rationale: 介词可表示欢庆的缘由或所围绕的对象；正文采用自然的原因表达，并以脚注保留另一种理解。שָׁלָל在军事语境中译为“战利品”。
- source_word: אֲשֶׁר לָקְחוּ
  choice: 夺来的
  rationale: 关系从句修饰战利品；“夺来的”简洁表达其先于欢庆发生，并符合劫掠语境。
- source_word: מֵאֶרֶץ פְּלִשְׁתִּים וּמֵאֶרֶץ יְהוּדָה
  choice: 从非利士地和犹大地
  rationale: 保留两个平行的地域表达；“非利士地”和“犹大地”清楚、简洁。
