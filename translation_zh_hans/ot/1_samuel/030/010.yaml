  yaml_path: translation/ot/1_samuel/030/010.yaml
  text: So David pursued[a], he and four hundred men, while two hundred men stayed behind[b], who were too exhausted to cross the Brook Besor.
translation:
  language: zh_hans
  text: 大卫和四百人追赶；二百人因疲惫不堪，不能渡过比梭溪[a]，就留了下来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “溪”所译的希伯来语也可指季节性溪流或干谷河床。
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּרְדֹּף
  choice: 继续追赶
  rationale: רדף表示追赶、追击；结合上文行动已开始的语境，用“继续追赶”自然呈现叙事推进。
- source_word: הוּא וְאַרְבַּע מֵאוֹת אִישׁ
  choice: 大卫和四百人
  rationale: הוּא与“大卫”构成强调性的同位表达；现代汉语以“大卫和四百人”最为自然。
- source_word: וַיַּעַמְדוּ מָאתַיִם אִישׁ
  choice: 另有二百人……就留了下来
  rationale: עמד本义为“站立”，在此指停止前进、留在原处；“留了下来”准确表达其叙事功能。
- source_word: אֲשֶׁר פִּגְּרוּ מֵעֲבֹר
  choice: 因疲惫不堪，不能渡过
  rationale: פגר在此语境指疲乏、落后以致无法继续；结合מן加不定式，译为“因疲惫不堪，不能渡过”，兼顾原因和结果，同时不把它误解为主动拒绝。
- source_word: נַחַל הַבְּשׂוֹר
  choice: 比梭溪
  rationale: נחל可指溪流、季节性河道或干谷；正文采用简洁而通行的“溪”，专名音译为“比梭”，并以脚注保留地貌含义的范围。
