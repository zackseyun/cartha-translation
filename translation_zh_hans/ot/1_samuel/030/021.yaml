base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/021.yaml
  text: David came to the two hundred men who had become too exhausted to follow after David[a], and whom they had left at the Brook Besor. They came out to meet David and to meet the people who were with him[b], and David approached the people and asked them how they were.
translation:
  language: zh_hans
  text: 大卫来到那二百人那里；他们因疲惫不能继续跟随大卫，曾被留在比梭溪旁。他们出来迎接大卫和同他一起的人。大卫走近这些人，问他们是否安好。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “问他们是否安好”直译为“询问他们的平安”，指问候并关心他们的状况。
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּגְּרוּ מִלֶּכֶת אַחֲרֵי דָוִד
  choice: 疲惫得不能继续跟随大卫
  rationale: פּגר在此表示因疲惫而无法继续，מן加不定式表达不能或停止继续行动；此译既说明语境中的原因，也保留“继续跟随”的动态。
- source_word: וַיֹּשִׁיבֻם
  choice: 众人便把他们留在
  rationale: 使役形可指使人停留、安置或留下。希伯来文动词为复数，主语并未明说；译作“众人”保留群体行动的含义，避免武断指定为大卫一人。
- source_word: בְּנַחַל הַבְּשׂוֹר
  choice: 在比梭溪旁
  rationale: נחל可指溪流、旱溪或河谷；叙事中用“比梭溪”自然易懂，而“旁”符合他们停留在渡口一带的语境。
- source_word: לִקְרַאת
  choice: 迎接
  rationale: 这里描述留守者出来与归来的人相会；“迎接”比中性的“遇见”更符合主动出来相迎的场景，同时不额外加入庆贺之意。
- source_word: הָעָם אֲשֶׁר אִתּוֹ
  choice: 跟随他的人
  rationale: עָם在此指与大卫同行的群体；“人”不把范围过度限定为正规军，“跟随他”自然表达אִתּוֹ在本叙事中的同行关系。
- source_word: וַיִּגַּשׁ דָּוִד אֶת הָעָם
  choice: 大卫走近他们
  rationale: נגשׁ表示靠近、走近；与下一句问安分开翻译，保留两个连续动作。“他们”承接前述二百人，中文比重复“这些人”更自然。
- source_word: וַיִּשְׁאַל לָהֶם לְשָׁלוֹם
  choice: 问他们是否安好
  rationale: 这是询问对方平安、福祉的希伯来语习语。“是否安好”是现代中文自然且庄重的表达，并保留שלום的平安意涵。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。避免连续重复“大卫”，同时明确二百人因疲惫而无法继续前行。原文在“众人便把他们留在”一句没有明说复数主语，因此中文使用概括性的“众人”，不将责任单独归于大卫。
