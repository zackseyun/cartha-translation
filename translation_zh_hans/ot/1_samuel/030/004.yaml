  text: Then David and the people who were with him raised their voices and wept until they had no strength left to weep[a].
translation:
  language: zh_hans
  text: 于是，大卫和跟他在一起的众人放声哭了起来，直到再也没有力气哭了[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“他们提高声音，哭泣。”这是希伯来语表示“放声哭”的惯用说法。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא ... אֶת־קוֹלָם
  choice: 放声
  rationale: נָשָׂא与קוֹל连用，是“提高声音、发出声音”的惯用表达；结合后面的“哭”，译作“放声”既自然，又保留其强烈程度。
- source_word: דָוִד וְהָעָם אֲשֶׁר אִתּוֹ
  choice: 大卫和跟他在一起的众人
  rationale: עָם本义宽泛，可指“百姓、众人”；本节没有明确使用“士兵”或“男人”，因此译作“众人”，既符合上下文，也避免增添原文未明说的身份限定。
- source_word: וַיִּבְכּוּ
  choice: 哭了起来
  rationale: בכה表示哭泣、哀哭；“哭了起来”符合现代汉语叙事习惯，并与前面的“放声”自然搭配。
- source_word: עַד אֲשֶׁר אֵין בָּהֶם כֹּחַ
  choice: 直到再也没有力气
  rationale: 原文直陈“直到他们里面没有力量”，表达哭至筋疲力尽；“再也没有力气”自然地传达力量已经耗尽。
- source_word: לִבְכּוֹת
  choice: 哭了
  rationale: 保留原文对בכה词根的重复，以强调他们一直哭到无力再哭。
