base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/017.yaml
  text: David struck them down from the twilight until the evening of the next day[a], and not a man of them escaped, except four hundred young men who rode on the camels and fled.
translation:
  language: zh_hans
  text: 大卫从晨昏时分[a]直到第二天傍晚击杀他们；他们中没有一人逃脱，只有四百名年轻人骑着骆驼逃走了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语这个词可指黎明或黄昏的朦胧时分；有些人认为这里指清晨的曙光。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכֵּם
  choice: 击杀他们
  rationale: נכה在军事语境中表示猛烈击打、杀伤或击败；结合本节无人逃脱的叙述，“击杀”自然传达其强烈程度，又不使用古奥措辞。
- source_word: מֵהַנֶּשֶׁף
  choice: 从薄暮
  rationale: נשף可指晨昏两端光线朦胧之时。“薄暮”在正文中保留暮光含义，脚注说明也可理解为黎明，以免掩盖原文的词义歧义。
- source_word: וְעַד הָעֶרֶב לְמָחֳרָתָם
  choice: 直到次日晚上
  rationale: 该短语表示行动延续至随后一天的晚上；此译法简洁自然，并保留时间跨度。
- source_word: נִמְלַט מֵהֶם אִישׁ
  choice: 他们中没有一人逃脱
  rationale: 原文单数אִישׁ作逐一分配用法，强调无一例外；现代汉语以“没有一人”最自然地表达。
- source_word: כִּי אִם
  choice: 只有
  rationale: 该惯用语引出前述绝对陈述的例外；“只有”在本句结构中比“除了”更流畅。
- source_word: אַרְבַּע מֵאוֹת אִישׁ נַעַר
  choice: 四百名年轻人
  rationale: נַעַר可指少年、青年或仆役；这里所指者能骑骆驼逃走，译作“年轻人”最合语境，且不额外暗示幼年或仆役身份。
- source_word: רָכְבוּ עַל הַגְּמַלִּים
  choice: 骑上骆驼
  rationale: 准确表达骑乘骆驼这一逃生动作，现代汉语自然简洁。
- source_word: וַיָּנֻסוּ
  choice: 逃走
  rationale: נס表示逃跑；译作“逃走”并与前面的נמלט“逃脱”保持词义区别。
