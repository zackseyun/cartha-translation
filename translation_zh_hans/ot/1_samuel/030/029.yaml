    rationale: 所给原文与英文审校记录只支持 Rakal/Racal 的拼写异体；该脚注加入未经支持的跨经文等同与“临门”译名，会误导读者并超出证据。
  - severity: low
    issue: 三个受赠对象的中文句式不完全平行。
    rationale: 统一为“住在……的人”可更自然地呈现原文三次重复的 לַאֲשֶׁר בְּ 结构，且不改变含义。
