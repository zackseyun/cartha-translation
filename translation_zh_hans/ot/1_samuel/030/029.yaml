  text: and to those in Rakal[a], and to those in the towns of the Jerahmeelites, and to those in the towns of the Kenites.
translation:
  language: zh_hans
  text: 又送给住在拉迦勒[a]的人，送给住在耶拉篾人各城镇的人，也送给住在基尼人各城镇的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “拉迦勒”的英语拼写传统中也作 Racal。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלַאֲשֶׁר
  choice: 又送给……的人／也送给……的人
  rationale: 介词ל与关系词אֲשֶׁר连用，在这份分送战利品的名单中表示受赠者；结合上文补出“送”，使中文自然，同时保留连续列举的结构。
- source_word: בְּרָכָל
  choice: 在拉迦勒
  rationale: 这是地名，按希伯来语רָכָל音译为“拉迦勒”，不作含义翻译。
- source_word: בְּעָרֵי
  choice: 各城镇里
  rationale: עִיר可指城或镇；此处指某族群所属的一系列聚居地，“各城镇”兼顾词义范围与现代中文表达。
- source_word: הַיְּרַחְמְאֵלִי
  choice: 耶拉篾人
  rationale: 该带冠词的单数族称在“城镇”之后具有集合意义，中文用族群名称“耶拉篾人”。
- source_word: הַקֵּינִי
  choice: 基尼人
  rationale: 该单数族称在此作集合用法，指与这些城镇相关的基尼族群，译作“基尼人”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重且易懂的叙事语言。原文是承接上下文的名单片段，因此以“又送给”明确其分送礼物的语境；重复“送给”以保持受赠对象之间的并列关系。
