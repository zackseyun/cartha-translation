  text: and to those in Hormah[a], and to those in Bor-ashan, and to those in Athach.
translation:
  language: zh_hans
  text: 又给住在何珥玛、波珥·亚珊[a]和亚挞的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “波珥·亚珊”是地名；其组成部分按字面可理解为“烟井”或“烟坑”，此处采用音译。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלַאֲשֶׁר
  choice: 又给住在……的人
  rationale: וְ加介词ל和关系词אֲשֶׁר，在这份分送礼物的名单中指向受赠者；结合三个地点，自然译为“又给住在……的人”，既保留受词意义，也使中文流畅。
- source_word: בְּחָרְמָה
  choice: 住在何珥玛
  rationale: בְּ表示地点，חָרְמָה是地名；依常用圣经地名音译为“何珥玛”。
- source_word: בְּבוֹר עָשָׁן
  choice: 住在波珥·亚珊
  rationale: 该词组在此用作地名，采用音译而不按其构词直译；中点表明这是一个复合地名。
- source_word: בַּעֲתָךְ
  choice: 住在亚挞
  rationale: בַּ表示地点，עֲתָךְ是地名；音译为“亚挞”。
theological_decisions: []
translation_notes:
  register: 采用现代、简洁而庄重的名单体表达。“又给”承接上文分送礼物的语境；三个地点由同一个“住在”统领，避免机械重复。所有地名均音译，并保留原文所指的受赠居民。
