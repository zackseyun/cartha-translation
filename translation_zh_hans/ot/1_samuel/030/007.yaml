base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/007.yaml
  text: Then David said to Abiathar the priest[a], the son of Ahimelech[b], “Please bring me the ephod.” So Abiathar brought the ephod to David.
translation:
  language: zh_hans
  text: 大卫对祭司亚比亚他，就是亚希米勒的儿子，说：“请把以弗得[b]拿到我面前来[a]。”亚比亚他就把以弗得拿到大卫面前。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “拿到我面前来”也可译作“呈到我面前”；原文动词的意思是“使靠近”或“呈上”。
    reason: lexical_alternative
  - marker: b
    text: “以弗得”是以色列祭司相关的一种神圣物件或礼服。
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 未另译句首的 וַ，但以连续叙事的自然语序承接上文，避免生硬地反复使用“然后”。
- source_word: הַכֹּהֵן
  choice: 祭司
  rationale: 按其确定称号直译，并与“亚希米勒的儿子”共同作为亚比亚他的同位说明。
- source_word: בֶּן אֲחִימֶלֶךְ
  choice: 亚希米勒的儿子
  rationale: 准确表达希伯来语构造链所标明的父子关系。
- source_word: הַגִּישָׁה נָּא לִי
  choice: 请把……拿到我这里来
  rationale: הגישׁ 的使役命令式表示使某物靠近、把某物呈上；“拿到我这里来”自然表达方向与动作，נָא 译作“请”。
- source_word: הָאֵפֹד
  choice: 以弗得
  rationale: 这是以色列祭司制度中特定圣物或礼服的专名，音译可避免在本节中过度限定其具体形制或功用。
- source_word: וַיַּגֵּשׁ
  choice: 就把……拿到……面前
  rationale: 与前一句命令使用同一词根，译文保留“使之靠近”的含义；“就”自然表现叙事中的随即响应。
- source_word: אֶל דָּוִד
  choice: 到大卫面前
  rationale: אֶל 表示朝向大卫的移动；结合该动作，译为“到大卫面前”比单说“给大卫”更贴近原文。
theological_decisions:
- issue: אֵפוֹד 在本段中既是祭司物件，也与随后求问上帝有关
  choice: 正文保留音译“以弗得”，脚注仅作概括说明
  alternative: 译作“祭司礼服”或“圣服”
  rationale: 原词可指祭司服饰或相关礼仪物件；本节没有明确说明其形制。保留音译可维持这种历史与功能上的张力，不把某一种解释写进正文。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“亚希米勒的儿子、祭司亚比亚他”保留原文的双重身份说明；“拿到……面前”既自然，也呼应同一希伯来词根在命令与执行中的重复。
