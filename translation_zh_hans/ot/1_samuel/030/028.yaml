  yaml_path: translation/ot/1_samuel/030/028.yaml
  text: and to those in Aroer[a], and to those in Siphmoth, and to those in Eshtemoa[b],
translation:
  language: zh_hans
  text: 也送给住在亚罗珥的人、住在息末的人和住在以实提莫的人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלַאֲשֶׁר
  choice: 也送给住在……的人
  rationale: 该结构由连接词、介词和关系词组成，直译为“又给那些……的”。结合上一节“送礼物”的语境，补出“送”使本节在现代汉语中自然完整；希伯来文在每个地名前都重复这一结构，因此汉译保留三次“住在……的人”以体现逐地列举的强调。
- source_word: בַּעֲרֹעֵר
  choice: 住在亚罗珥
  rationale: 介词 בְּ 在此表示地点；亚罗珥是地名，采用现代中文圣经中通行的音译。
- source_word: בְּשִׂפְמוֹת
  choice: 住在息末
  rationale: 介词表示地点；息末为地名，采用通行音译，不对名称作意义翻译。
- source_word: בְּאֶשְׁתְּמֹעַ
  choice: 住在以实提莫
  rationale: 介词表示地点；以实提莫为希伯来地名 אֶשְׁתְּמֹעַ 的通行中文音译。
