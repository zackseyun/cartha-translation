  text: וַ/יָּבֹ֤א דָוִד֙ אֶל צִ֣קְלַ֔ג וַ/יְשַׁלַּ֧ח מֵֽ/הַ/שָּׁלָ֛ל לְ/זִקְנֵ֥י יְהוּדָ֖ה לְ/רֵעֵ֣/הוּ לֵ/אמֹ֑ר הִנֵּ֤ה לָ/כֶם֙ בְּרָכָ֔ה מִ/שְּׁלַ֖ל אֹיְבֵ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/026.yaml
  text: When David came to Ziklag[a], he sent some of the plunder to the elders of Judah, his friends, saying, “Look, here is a gift for you from the plunder of the enemies of Yahweh.”
translation:
  language: zh_hans
  text: 大卫到了洗革拉，就从战利品中取出一部分，送给犹大的长老——他的朋友，说：“你们看，这是从雅威仇敌的战利品中送给你们的礼物[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“祝福”。希伯来语这个词通常意为“祝福”，这里指从战利品中送出的实物礼物。
    reason: 保留 בְּרָכָה 的字面词义及其在本句中的语境义。
lexical_decisions:
- source_word: וַיָּבֹא
  choice: 大卫回到
  rationale: 叙事性连续形式推进情节；“回到”自然表达大卫返回洗革拉的语境，同时保留动作次序。
- source_word: צִקְלַג
  choice: 洗革拉
  rationale: 采用现代中文圣经中通行的地名译法。
- source_word: וַיְשַׁלַּח מֵהַשָּׁלָל
  choice: 就把一部分战利品送给
  rationale: 介词 מִן 表明所送的是从全部战利品中取出的一部分；“战利品”准确体现军事掳获物。
- source_word: לְזִקְנֵי יְהוּדָה
  choice: 犹大的长老
  rationale: “长老”指犹大群体中受认可的领袖。
- source_word: לְרֵעֵהוּ
  choice: 就是他的朋友
  rationale: רֵעַ 可指朋友、同伴或邻舍；此处描述大卫与这些长老的友好关系，译作“朋友”既自然又不作过度限定。
- source_word: הִנֵּה לָכֶם
  choice: 看，这是送给你们的
  rationale: הִנֵּה 用来引人注意；“看，这是……”在现代汉语中保留其指示和强调作用。
- source_word: בְּרָכָה
  choice: 礼物
  rationale: 本义为“祝福”，但在此物质分赠的语境中指赠礼；正文译出具体所指，并以脚注保留字面含义。
- source_word: מִשְּׁלַל
  choice: 从……战利品中取来的
  rationale: 与前面的 שָׁלָל 保持词义一致，并用自然汉语表明礼物的来源。
- source_word: אֹיְבֵי יְהוָה
  choice: 耶和华仇敌
  rationale: 保留构造链所表达的关系，即这些人被大卫称为耶和华的仇敌。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文读者熟悉的神名音译“耶和华”，使专名与一般称号相区别。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用四字神名而非称号；中文正文采用广为人知的专名形式“耶和华”，不以“主”替代，也不改变原文的人称神名性质。
- issue: בְּרָכָה 是译作“祝福”还是“礼物”
  choice: 礼物
  alternative: 祝福
  rationale: 眼前所指是从战利品中送出的实物，因此正文采用语境义“礼物”；脚注保留“祝福”这一字面义及其正面意味，避免抹去原文的词义张力。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“看”保留 הִנֵּה 的现场指示感，避免较古雅的“看哪”；“战利品”比“掳物”更符合当代普通读者的语言习惯。
