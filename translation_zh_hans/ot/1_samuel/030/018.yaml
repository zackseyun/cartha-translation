  text: David recovered all that Amalek had taken[a], and David rescued his two wives.
translation:
  language: zh_hans
  text: 大卫夺回了亚玛力人夺走的一切；大卫救回了自己的两个妻子。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文两处使用同一个动词，含有“解救、夺回”的意思；这里根据宾语和汉语习惯，分别译作“夺回”和“救回”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּצֵּל / הִצִּיל（נצל）
  choice: 夺回 / 救回
  rationale: 原文两处使用同一词根，基本义为从危险或他人控制下解救、夺回。第一处的宾语是亚玛力人夺走的一切，用“夺回”自然涵盖被掳的人和财物；第二处的宾语是大卫的两个妻子，用“救回”更符合现代汉语习惯。脚注说明原文用词相同。
- source_word: כָּל אֲשֶׁר לָקְחוּ עֲמָלֵק
  choice: 亚玛力人夺走的一切
  rationale: כָּל אֲשֶׁר 表示“一切……的”；לקח 在此语境中指敌人劫掠时带走。译作“夺走”比单纯的“拿走”更符合上下文，也能同时适用于人员和财物。
- source_word: עֲמָלֵק
  choice: 亚玛力人
  rationale: 原文以专名“亚玛力”集合性地指亚玛力族群。现代汉语用“亚玛力人”能清楚表达这一集合含义，避免误解为个人。
- source_word: שְׁתֵּי נָשָׁיו
  choice: 自己的两个妻子
  rationale: 明确保留数词“两个”。第二个“大卫”已经重述主语，因此用“自己的”自然明确其所属关系。
- source_word: דָּוִד ... דָּוִד
  choice: 大卫……大卫
  rationale: 保留原文两次直呼大卫之名的结构，不以代词替换第二处，以体现原文的重复和强调。
