  yaml_path: translation/ot/1_samuel/030/027.yaml
  text: to those in Bethel[a], to those in Ramoth-negeb, and to those in Jattir—
translation:
  language: zh_hans
  text: 给在伯特利的人、在南地拉末的人和在雅提珥的人——
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לַאֲשֶׁר
  choice: 给住在……的人
  rationale: 介词 לְ 与关系词 אֲשֶׁר 在这份收礼者名单中表示对象；结合 בְּ 所表达的地点关系，译为“给住在……的人”自然清楚，也保留了与上下文相连的与格意义。
- source_word: בְּבֵית אֵל
  choice: 住在伯特利
  rationale: 此处是地名 Bethel，而不是普通名词短语“上帝的殿”；按现代中文圣经通行译名作“伯特利”。
- source_word: בְּרָמוֹת נֶגֶב
  choice: 住在南地拉末
  rationale: 该表达最适合作地名理解。“南地拉末”保留 רָמוֹת 与 נֶגֶב 两个成分，同时避免径直断定 נֶגֶב 是单纯的形容词“南方的”；另一种结构理解列于脚注。
- source_word: בְּיַתִּר
  choice: 住在雅提珥
  rationale: 这是地名 Jattir，采用现代中文圣经中较通行且贴近希伯来语读音的译名“雅提珥”。
- source_word: וְ
  choice: 和
  rationale: 用于连接名单中的最后一项，符合现代汉语列举习惯。
