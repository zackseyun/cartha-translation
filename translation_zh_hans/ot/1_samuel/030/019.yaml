base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/019.yaml
  text: Nothing of theirs was missing[a], from small to great, sons and daughters, spoil, or anything that had been taken from them[b]; David brought back everything.
translation:
  language: zh_hans
  text: 他们的没有一样缺少：无论大小[a]、儿子女儿、掳物，还是被人夺去归自己的一切[b]；大卫都带回来了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“从最小的到最大的”；也可能指“从最卑微的到最尊贵的”。
    reason: 保留מִן הַקָּטֹן וְעַד הַגָּדוֹל在年龄、大小或地位方面的语义开放性。
  - marker: b
    text: 希伯来文直译：“他们为自己夺取的一切”；按上下文，“他们”指袭掠大卫众人的亚玛力人。
    reason: 说明原文未明说的施事者及“为自己”的受益结构，避免正文的中文表达掩盖希伯来文的含混。
lexical_decisions:
- source_word: נֶעְדַּר
  choice: 没有少
  rationale: 该词为עדר的尼法勒式，在此表示失缺、短少。中文“一样也没有少”自然地表达所有人员和财物均完整寻回。
- source_word: לָהֶם
  choice: 他们所有的
  rationale: 这里的与格代词与נֶעְדַּר连用，表示属于他们的人或物；译作“他们所有的”符合现代汉语表达。
- source_word: מִן הַקָּטֹן וְעַד הַגָּדוֹל
  choice: 从小到大
  rationale: 保留原文由“小”至“大”的概括性两极表达，不在正文中限定为年龄、地位或重要程度。
- source_word: בָּנִים וּבָנוֹת
  choice: 儿女
  rationale: 简洁而准确地涵盖原文明确列出的儿子和女儿，适合现代汉语叙事。
- source_word: מִשָּׁלָל
  choice: 掳物
  rationale: 指袭掠中夺取的财物；“掳物”在圣经历史叙事中简洁、庄重，也能与被掳人员相区分。
- source_word: כָּל אֲשֶׁר לָקְחוּ לָהֶם
  choice: 那些人夺去归自己的一切
  rationale: 尽量保留原文“他们为自己夺取的一切”的结构；“那些人”按上下文指实施袭掠者，同时避免把原文改写成单纯的被动句。
- source_word: הַכֹּל הֵשִׁיב
  choice: 全都带了回来
  rationale: שוב的使役形在这里表示使人或物返回；“带了回来”保留具体叙事动作，比抽象的“恢复”更贴切。
- source_word: דָּוִד
  choice: 大卫
  rationale: 采用该人名通行的现代中文译名。
theological_decisions:
- issue: “从小到大”具体指年龄、地位还是所寻回之人事物的范围
  choice: 正文保留概括性的“从小到大”
  alternative: 从最卑微的到最尊贵的／从最小的到最大的
  rationale: 希伯来文以“小”与“大”构成全括表达，本节未明确限定其分类标准；不宜在正文中排除年龄、地位等可能含义。
translation_notes:
  register: 采用现代、庄重而易懂的历史叙事语体。“一样也没有少”与末句“全都带了回来”形成自然照应；保留原文由概括、列举到总结的结构。
