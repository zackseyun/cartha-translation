base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/012.yaml
  text: They gave him a piece of fig cake and two clusters of raisins[a], and he ate, and his spirit returned to him[c][b], for he had not eaten bread or drunk water for three days and three nights.
translation:
  language: zh_hans
  text: 他们给了他一块无花果饼和两份葡萄干[a]。他吃了以后，精神就恢复了[b]，因为他已经三天三夜没有吃面饼，也没有喝水。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “两份葡萄干”也可能指两团或两饼压制的葡萄干；原文只明确说有两个单位。
    reason: lexical_alternative
  - marker: b
    text: 直译：“他的灵回到他那里”；也可译作“他恢复了体力”或“他苏醒过来”。
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶלַח דְּבֵלָה
  choice: 一块无花果饼
  rationale: פֶלַח 指一块或一片，דְּבֵלָה 指压制成饼的无花果；汉语“无花果饼”自然地表达这种古代食物，脚注补明其压制做法。
- source_word: שְׁנֵי צִמֻּקִים
  choice: 两份葡萄干
  rationale: צִמֻּקִים 指葡萄干，数词表明是两个计量单位，但原文没有明确说明是串、团还是饼；“两份”保留这种不确定性。
- source_word: וַתָּשָׁב רוּחוֹ אֵלָיו
  choice: 精神就恢复了
  rationale: 此句直译为“他的灵回到他那里”，是指人在进食后恢复精神或体力；正文采用现代汉语的自然表达，脚注保留原文意象。
- source_word: לֶחֶם
  choice: 饼
  rationale: לֶחֶם 在此具体指作为日常主食的饼；与“喝水”并列，保留了原文具体的饮食描写。
- source_word: שָׁתָה מַיִם
  choice: 喝水
  rationale: 原文明确说“喝水”，故不泛化为“喝东西”。
- source_word: שְׁלֹשָׁה יָמִים וּשְׁלֹשָׁה לֵילוֹת
  choice: 三天三夜
  rationale: 直接而自然地对应原文的时间表达。
theological_decisions:
- issue: רוּחַ 在复苏语境中的含义
  choice: 正文译为“精神就恢复了”，脚注注明直译
  alternative: 他的灵回到他那里；他恢复了体力；他苏醒过来
  rationale: 这里的希伯来习语既保有“灵返回”的形象，也实际描述生命活力恢复。正文采用现代读者易懂的表达，同时借脚注保存原文措辞，避免赋予其超出语境的灵魂论含义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“饼”比“面包”更贴近古代近东主食的形态；“两份”避免把词义不确定的葡萄干单位具体化。正文中的脚注标记与注释须完全对应。
