base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/013.yaml
  text: David said to him, “Whose are you, and where are you from?” He said, “I am an Egyptian young man, a slave of an Amalekite man, and my master abandoned me because I became sick three days ago.”
translation:
  language: zh_hans
  text: 大卫问他：“你是谁的人？你从哪里来？”他回答：“我是个埃及青年，是一个亚玛力人的奴隶。三天前我病了，我主人就把我撇下了。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְמִי אַתָּה
  choice: 你是谁的人
  rationale: 直译为“你属谁”，是在询问其主人或所属；“你是谁的人”保留所属关系，同时符合现代汉语表达。
- source_word: נַעַר מִצְרִי
  choice: 埃及青年
  rationale: נַעַר 在此指年轻男子；译作“青年”自然，也不额外限定其确切年龄。
- source_word: עֶבֶד
  choice: 奴仆
  rationale: 语境表明他受亚玛力主人支配；“奴仆”既表达从属身份，也保留该词可涵盖奴隶与仆役的语义范围。
- source_word: וַיַּעַזְבֵנִי
  choice: 把我撇下了
  rationale: 表达主人因其生病而将他遗弃在原地，符合叙事处境及动词“离弃、留下”的含义。
- source_word: כִּי חָלִיתִי הַיּוֹם שְׁלֹשָׁה
  choice: 三天前我病了
  rationale: 希伯来语习惯表达意为“我生病到今天已有三天”；此译自然呈现其已病三日的时间关系。
