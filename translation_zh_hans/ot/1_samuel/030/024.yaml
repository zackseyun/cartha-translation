base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/024.yaml
  text: And who will listen to you in this matter? For as is the share of the one who goes down into the battle[a], so is the share of the one who stays by the supplies[b]; together they shall divide.
translation:
  language: zh_hans
  text: 这件事上，谁会听你们的呢？上阵作战的人所得的份，和留在物资[a]旁的人的份，应当一样；他们要一同分配。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “物资”也可译作“行李”或“装备”。希伯来语这个词可泛指器物、用具、装备或随军物品。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִי יִשְׁמַע לָכֶם לַדָּבָר הַזֶּה
  choice: 这件事，谁会听你们的呢
  rationale: 保留反问语气及上下文中的反驳功能。שׁמע ל־在这里指听从、理会或接受某人的主张；现代汉语“听你们的”既自然，也保留其语义宽度。
- source_word: כְּחֵלֶק
  choice: 所得的份……应当一样
  rationale: חֵלֶק指所分得的一份，语境中特指战利品的份额。希伯来文用两个平行的“如同……的份”表达同等待遇，汉语以“所得的份……一样”自然呈现。
- source_word: הַיֹּרֵד בַּמִּלְחָמָה
  choice: 上阵作战的人
  rationale: 字面为“下到战事中的人”。“上阵作战”是自然的现代汉语军事表达，传达实际参战之意，而不机械复制希伯来语的方向性习语。
- source_word: הַיֹּשֵׁב עַל הַכֵּלִים
  choice: 留下看守物资的人
  rationale: יֹשֵׁב在此指留下，עַל在语境中含照管之意；כֵּלִים可泛指器具、装备、行李或物资。“看守物资”明确表达这些人留下承担的职责，同时用脚注保留词义范围。
- source_word: יַחְדָּו יַחֲלֹקוּ
  choice: 他们要一同分配
  rationale: יַחְדָּו强调共同参与，יַחֲלֹקוּ指分配、分取。译文保留集体分配战利品的具体动作；前句已清楚表明份额相同。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。反问句保持大卫驳斥对方主张的力度；关于参战者与留守者的平行结构，以流畅汉语明确呈现份额相同。脚注标记置于整节末尾，所注“物资”在正文中清楚可辨。
