base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/025.yaml
  text: 'And it was so from that day onward: he made it a statute and an ordinance for Israel to this day[a].'
translation:
  language: zh_hans
  text: 从那一天起，大卫就把这定为以色列人的律例和典章，直到今日。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“大卫把这确立为以色列人的律例和法令，直到今日。”
    reason: “定为”所译的动词也可表达“确立”；“典章”所译的词也可指判决或法令，在此与“律例”并列，指规范性的规定。
lexical_decisions:
- source_word: וַיְהִי
  choice: 事情就这样定了
  rationale: 结合下文“定为律例和规章”，表达该安排从此确立并持续生效；中文用“这样定了”比逐字译作“事情就这样”更自然。
- source_word: מֵהַיּוֹם הַהוּא וָמָעְלָה
  choice: 从那一天起
  rationale: 这是表示自某一时间点延续下去的希伯来语惯用语；“从那一天起”简洁自然，并保留持续含义。
- source_word: וַיְשִׂמֶהָ
  choice: 大卫把这定为
  rationale: שׂים 在此指设立、制定；阴性后缀回指上文所述的分配办法。主语由上下文确定为大卫，明说姓名可避免中文代词含混。
- source_word: לְחֹק
  choice: 律例
  rationale: חֹק 指固定、颁定而具规范性的条例；“律例”保留正式和约束性的语气。
- source_word: וּלְמִשְׁפָּט
  choice: 和规章
  rationale: מִשְׁפָּט 可指判决、法则或规范；与 חֹק 并列时，此处重在成为适用于以色列的固定规则，因此译作“规章”，同时以脚注保留“判例”的可能性。
- source_word: לְיִשְׂרָאֵל
  choice: 以色列的
  rationale: לְ 表明该规则适用于以色列；中文用所属结构“以色列的律例和规章”自然地表达其适用范围。
- source_word: עַד הַיּוֹם הַזֶּה
  choice: 直到今日
  rationale: 保留叙述者视角，说明这项规定持续至其写作时的“今日”。
