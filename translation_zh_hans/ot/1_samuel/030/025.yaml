revisions:
- from: 从那一天起，事情就这样定了：大卫把这定为以色列的律例和规章，直到今日。[a]
  to: 从那一天起，大卫就把这定为以色列人的律例和典章，直到今日。[a]
  rationale: 删除重复且不够自然的“事情就这样定了”，以“从那一天起……就……”表达原文的起始与延续。将“规章”调整为正式搭配中的“典章”，并将脚注的技术性“判例”改为语义更稳妥的“法令”，同时保留“判决”这一词义范围的说明。
