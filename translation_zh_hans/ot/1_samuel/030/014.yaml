base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/014.yaml
  text: We raided the Negev of the Kerethites[a], and the territory that belongs to Judah, and the Negev of Caleb; and we burned Ziklag with fire.
translation:
  language: zh_hans
  text: “我们侵袭了基利提人的南地[a]、属犹大的地区和迦勒的南地，又用火烧了洗革拉。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “基利提人”也可音译为“革利提人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּשַׁטְנוּ
  choice: 我们侵袭了
  rationale: 此动词在军事语境中指突袭或劫掠性进犯；“侵袭”简洁自然，也不弱化行动的敌对性质。
- source_word: נֶגֶב
  choice: 南地
  rationale: 这里指称南方干旱地区或地域，而不只是方位。“南地”既保留地理含义，也符合现代中文圣经地名表达。
- source_word: הַכְּרֵתִי
  choice: 基利提人
  rationale: 这是族群名称；采用贴近希伯来语辅音的常见中文音译。
- source_word: וְעַל אֲשֶׁר לִיהוּדָה
  choice: 属犹大的地区
  rationale: 介词承接前面的侵袭对象，关系结构表达归属；补出“地区”使中文清楚自然，而不把归属范围误解为仅指财物。
- source_word: נֶגֶב כָּלֵב
  choice: 迦勒的南地
  rationale: 保留希伯来语的地域归属结构，指与迦勒宗族或领地相关的南方地区。
- source_word: שָׂרַפְנוּ בָאֵשׁ
  choice: 用火烧了
  rationale: 保留原文“烧”与“用火”的显式组合及其强调，同时在中文中仍然通顺。
- source_word: צִקְלַג
  choice: 洗革拉
  rationale: 采用该地名的通行中文译名。
