  text: and to those in Hebron[a], and to all the places where David and his men had gone about.
translation:
  language: zh_hans
  text: 又送给住在希伯仑的人，也送到大卫和他的部下曾经往来过[a]的各处。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“走遍”或“到过”。原文动词含有反复从一处到另一处活动的意思。
    reason: 说明原文动词的反复、周游意味，并保留可行的中文译法。
lexical_decisions:
- source_word: וְלַאֲשֶׁר בְּחֶבְרוֹן
  choice: 又送给住在希伯仑的人
  rationale: 介词与关系词在此承接上文受赠者名单；中文补出“送给”和“人”，使句意自然完整，同时保留希伯仑作为所在地。
- source_word: וּלְכָל הַמְּקֹמוֹת
  choice: 也送到……各处
  rationale: 保留介词所表达的赠送方向以及כָל与复数名词的周遍含义；这里以地点代指当地的人群，中文无需进一步明说，以免过度解释。
- source_word: הִתְהַלֶּךְ
  choice: 曾经往来
  rationale: הלך的Hitpael形式在本语境中表示从一处到另一处反复活动，而非仅指一次步行；“往来”简洁地体现这种巡行、活动的意味。
- source_word: שָׁם
  choice: 由关系结构“……的各处”体现
  rationale: “那里”的方位意义已融入中文关系结构；若再直译为“在那里”，表达会显得重复。
- source_word: דָּוִד הוּא וַאֲנָשָׁיו
  choice: 大卫和跟随他的人
  rationale: 独立代词הוּא在此与“大卫”同位，不必机械译为“大卫他自己”；אֲנָשָׁיו按上下文指跟随大卫的同伴或部属，译作“跟随他的人”比“他的人”自然，也不局限为现代意义上的士兵。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。本节在原文中承接上一节的受赠者名单，因此以“又送给／也送到”补足中文句法。脚注标记置于其所说明的动词“往来”之后。
