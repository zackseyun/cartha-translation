  text: וַ/יְהִ֞י בְּ/בֹ֨א דָוִ֧ד וַ/אֲנָשָׁ֛י/ו צִֽקְלַ֖ג בַּ/יּ֣וֹם הַ/שְּׁלִישִׁ֑י וַ/עֲמָלֵקִ֣י פָֽשְׁט֗וּ אֶל נֶ֨גֶב֙ וְ/אֶל צִ֣קְלַ֔ג וַ/יַּכּוּ֙ אֶת צִ֣קְלַ֔ג וַ/יִּשְׂרְפ֥וּ אֹתָ֖/הּ בָּ/אֵֽשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/001.yaml
  text: When David and his men came to Ziklag on the third day[a], the Amalekites had made a raid against the Negev and against Ziklag, and they had struck Ziklag and burned it with fire.
translation:
  language: zh_hans
  text: 第三天，大卫和他的部下来到洗革拉时，亚玛力人已经袭击了南地[a]和洗革拉，攻打了洗革拉，并用火焚烧了它。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “南地”也可译作“南方”。希伯来语“内盖夫”既可泛指南方，也可特指称为南地的地区。
    reason: 保留נֶגֶב在普通方位与特定地理区域之间的词义歧义。
lexical_decisions:
- source_word: וַיְהִי בְּבֹא
  choice: 来到
  rationale: 这一结构交代叙事发生的时间；中文用“第三天……来到”自然呈现场景，不另加原文没有的“现在”。
- source_word: וַאֲנָשָׁיו
  choice: 跟随他的人
  rationale: 此处指大卫同行的武装随从；这样既符合上下文，也比泛称“他的百姓”准确。
- source_word: צִקְלַג
  choice: 洗革拉
  rationale: 采用现代中文圣经读者熟悉的地名音译。
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: 第三天
  rationale: 直接表达所指的时间，中文无需补出介词。
- source_word: וַעֲמָלֵקִי
  choice: 亚玛力人
  rationale: 形式虽为集合性单数，后接复数动词，所指是亚玛力群体。
- source_word: פָשְׁטוּ
  choice: 已经袭击了
  rationale: 该动词在军事语境中指突袭或劫掠；“已经”表明袭击发生在大卫抵达以前。
- source_word: אֶל נֶגֶב
  choice: 南地
  rationale: נֶגֶב既可指一般的南方，也可指称为南地的特定地区；正文采用中文常见地理名称，并用脚注保留歧义。
- source_word: וַיַּכּוּ אֶת צִקְלַג
  choice: 攻打了洗革拉
  rationale: נכה语义较宽，在此表示军事攻击；“攻打”自然且不额外断定城如何被攻破。
- source_word: וַיִּשְׂרְפוּ אֹתָהּ בָּאֵשׁ
  choice: 并放火烧了城
  rationale: 自然传达“用火烧”的明确含义；“城”清楚回指洗革拉，避免中文代词指向含混。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重的现代叙事语体。将脚注标记置于其实际说明的“南地”之后，而不是置于“第三天”之后。
