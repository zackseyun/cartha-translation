reference: 1 Samuel 30:23
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר דָּוִ֔ד לֹֽא תַעֲשׂ֥וּ כֵ֖ן אֶחָ֑/י אֵ֠ת אֲשֶׁר נָתַ֨ן יְהוָ֥ה לָ֨/נוּ֙ וַ/יִּשְׁמֹ֣ר אֹתָ֔/נוּ וַ/יִּתֵּ֗ן אֶֽת הַ/גְּד֛וּד הַ/בָּ֥א עָלֵ֖י/נוּ בְּ/יָדֵֽ/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/023.yaml
  text: But David said[a], “You must not do so, my brothers, with what Yahweh has given us[c][b]. He has preserved us and has given into our hand the raiding band that came against us.”
translation:
  language: zh_hans
  text: 大卫却说：“我的弟兄们，耶和华赐给我们的东西，你们不可这样处理[a]。他保护了我们，又把那来攻击我们的劫掠队交在我们手中[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文结构较紧缩，也可译作：“对于耶和华赐给我们的，你们不可这样做。”
    reason: lexical_alternative
  - marker: b
    text: “交在我们手中”是希伯来语惯用表达，意思是交在我们的权下，任由我们处置。
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא תַעֲשׂוּ כֵן
  choice: 你们不可这样处理
  rationale: 这是对复数听众的直接禁止；结合上下文所争议的是如何分配战利品，用“这样处理”比孤立的“这样做”更自然，同时没有预先规定具体分配办法。
- source_word: אֶחָי
  choice: 我的弟兄们
  rationale: 直译保留大卫对手下所用的兄弟式称呼，也符合当时男性战士群体的语境。
- source_word: אֵת אֲשֶׁר נָתַן יְהוָה לָנוּ
  choice: 耶和华赐给我们的东西
  rationale: 希伯来语结构较紧缩，提出大卫正在谈论的对象，即耶和华所赐的战利品；中文借助前置话题自然表达。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经传统中辨识度最高的神圣名字音译，明确保留专名而非以“主”这一称号替代。
- source_word: וַיִּשְׁמֹר אֹתָנוּ
  choice: 他保护了我们
  rationale: שׁמר 在战斗语境中表示看守、护卫，使他们得以保全；“保护了我们”是自然且准确的现代中文。
- source_word: הַגְּדוּד
  choice: 劫掠队
  rationale: 此处指来犯的亚玛力劫掠武装；“劫掠队”比泛称“军队”更贴合其行动性质。
- source_word: הַבָּא עָלֵינוּ
  choice: 那来攻击我们的
  rationale: 保留“向我们而来”的敌对意味，并以自然中文明确其来意。
- source_word: בְּיָדֵנוּ
  choice: 交在我们手中
  rationale: 保留希伯来语“在手中”这一表示落入权下、受人控制的惯用语，中文也易于理解。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用四字神名。中文正文保留神的专名；“耶和华”是普通现代中文读者最熟悉且长期通行的形式，不以称号“主”取代，也不借此加入宗派性解释。
- issue: 胜利与战利品的来源
  choice: 保留三个以神为主语的行动：赐给、保护、交付
  alternative: 将胜利概括为人的战功
  rationale: 原文刻意把所得、保全和制伏敌军都归于耶和华；译文保持这一神学重心，不弱化也不扩展。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“不可”保留劝阻的严肃力度；“我的弟兄们”保留原文亲属称谓；句法稍作话题化处理，以清楚呈现压缩的希伯来语结构。
