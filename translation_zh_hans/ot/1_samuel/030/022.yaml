source:
  edition: WLC
  text: וַ/יַּ֜עַן כָּל אִֽישׁ רָ֣ע וּ/בְלִיַּ֗עַל מֵֽ/הָ/אֲנָשִׁים֮ אֲשֶׁ֣ר הָלְכ֣וּ עִם דָּוִד֒ וַ/יֹּאמְר֗וּ יַ֚עַן אֲשֶׁ֣ר לֹֽא הָלְכ֣וּ עִמִּ֔/י לֹֽא נִתֵּ֣ן לָ/הֶ֔ם מֵ/הַ/שָּׁלָ֖ל אֲשֶׁ֣ר הִצַּ֑לְנוּ כִּֽי אִם אִ֤ישׁ אֶת אִשְׁתּ/וֹ֙ וְ/אֶת בָּנָ֔י/ו וְ/יִנְהֲג֖וּ וְ/יֵלֵֽכוּ־־־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/022.yaml
  text: Then every wicked and worthless man from among the men who had gone with David answered and said[a], “Because they did not go with me, we will not give them any of the spoil that we recovered[c][b], except that each man may take his wife and his children and lead them away and go.”
translation:
  language: zh_hans
  text: 跟随大卫去的那些人中，所有邪恶又无赖之徒都回答说：“他们既然没有跟我[a]一起去，我们夺回的战利品就一点也不给他们；只让各人带走自己的妻子儿女，领着他们离开。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “跟我一起去”原文为单数“我”，下文“我们……不给”则为复数。
    reason: 说明原文引语中有意保留的人称数转换，防止读者误以为译文失误。
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמְרוּ
  choice: 都回答说
  rationale: 希伯来文连续使用“回答”和“说”；现代汉语用“回答说”即可自然保留引语功能，避免生硬重复。
- source_word: כָּל אִישׁ רָע וּבְלִיַּעַל
  choice: 所有邪恶无赖的人
  rationale: “邪恶”保留 רָע 的道德评判；“无赖”表达 בְלִיַּעַל 在此处卑劣、不受约束的贬义，不把它误作后期专名“彼列”。
- source_word: מֵהָאֲנָשִׁים אֲשֶׁר הָלְכוּ עִם דָּוִד
  choice: 跟随大卫去的那些人中
  rationale: 体现介词 מִן 的部分集合含义，即说话者是随大卫出征者中的一部分。
- source_word: יַעַן אֲשֶׁר
  choice: 既然
  rationale: 自然表达说话者据此提出拒绝分配的理由，保留因果语气。
- source_word: לֹא הָלְכוּ עִמִּי
  choice: 没有跟我一起去
  rationale: 严格保留马所拉文本第一人称单数“我”，不因说话者是群体而改成“我们”。
- source_word: לֹא נִתֵּן לָהֶם
  choice: 就一点也不给他们
  rationale: 表达第一人称复数群体的坚决决定；“一点也不”自然体现从战利品中不给任何份额的部分否定结构。
- source_word: מֵהַשָּׁלָל אֲשֶׁר הִצַּלְנוּ
  choice: 我们夺回的战利品
  rationale: שָׁלָל 指战争中的掳物；נצל 的使役形在此语境指从亚玛力人手中抢救、收复，译作“夺回”最贴合事件。
- source_word: כִּי אִם
  choice: 只
  rationale: 简洁自然地引出唯一例外。
- source_word: אִישׁ אֶת אִשְׁתּוֹ וְאֶת בָּנָיו
  choice: 各人带走自己的妻子儿女
  rationale: אִישׁ 是逐一分配用法；בָּנָיו 在家庭语境可统称儿女。汉语补出“带走”，由后面的“领着离开”以及宾语结构自然得出。
- source_word: וְיִנְהֲגוּ וְיֵלֵכוּ
  choice: 领着他们离开
  rationale: 同时传达“引领”和“离去”两个动作，避免汉语中不自然的动词重复。
theological_decisions:
- issue: בְלִיַּעַל 是否作为专名处理
  choice: 无赖
  alternative: 彼列；不法之徒；卑劣的人
  rationale: 本节中该词描述人的品性，并非指称一个邪灵。译作普通贬义词可避免把后期神学意义带入叙事。
- issue: 引语中的单数“我”与复数“我们”
  choice: 保留“跟我一起去……我们……不给”
  alternative: 统一改为“跟我们一起去”
  rationale: 原文确有第一人称单数与复数的转换，可能是一名代表群体发言，也可能保留群体言语中的数变化；译文不替原文消除这一张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。叙事开头不机械翻译连接词 וַ；用“回答说”压缩希伯来语公式化的“回答并说”。保留引语中单数“我”和复数“我们”的转换，并以脚注说明。
