  yaml_path: translation/ot/1_samuel/030/005.yaml
  text: 'And David’s two wives had been taken captive: Ahinoam the Jezreelitess and Abigail[b][a], the wife of Nabal the Carmelite.'
translation:
  language: zh_hans
  text: 大卫的两个妻子也被掳去了：耶斯列女子[a]亚希暖，以及迦密人[b]拿八的妻子亚比该。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“来自耶斯列的女子”。
    reason: lexical_alternative
  - marker: b
    text: 这里的“迦密人”指来自迦密的人，与后来出现的同名宗教修会无关。
    reason: cultural_note
lexical_decisions:
- source_word: וּ/שְׁתֵּי נְשֵׁי דָוִד
  choice: 大卫的两个妻子也
  rationale: וּ承接上文，在此用“也”自然体现叙事联系；שְׁתֵּי נְשֵׁי דָוִד是“⼤卫的两个妻子”。
- source_word: נִשְׁבּוּ
  choice: 被掳去了
  rationale: 该词为שׁבה的尼法勒完成式，表示“被俘、被掳”；“去了”符合现代汉语叙事，也表明此事已经发生。
- source_word: אֲחִינֹעַם הַ/יִּזְרְעֵלִית
  choice: 耶斯列女子亚希暖
  rationale: 阴性族属词הַיִּזְרְעֵלִית表明亚希暖来自耶斯列；“耶斯列女子”既保留阴性含义，又比生硬的族称更自然。
- source_word: וַ/אֲבִיגַיִל
  choice: 以及……亚比该
  rationale: 连接词与人名按现代汉语列举方式处理；人名采用通行译名“亚比该”。
- source_word: אֵשֶׁת נָבָל הַ/כַּרְמְלִי
  choice: 迦密人拿八的妻子
  rationale: 原文以同位说明亚比该是“迦密人拿八的妻子”；“迦密人”表示来自迦密，修饰拿八。
