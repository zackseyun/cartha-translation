base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/011.yaml
  text: They found an Egyptian man in the field and brought him to David[a]. They gave him bread, and he ate[c][b], and they gave him water to drink.
translation:
  language: zh_hans
  text: 他们在田野里发现一名埃及男子，把他带到大卫那里。他们给他饼，他就吃了；他们又给他水喝。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּמְצְאוּ
  choice: 他们……发现
  rationale: 该叙事性连续式在现代汉语中自然译为过去发生的动作；“他们”承接上文的复数主语。
- source_word: אִישׁ מִצְרִי
  choice: 一个埃及男子
  rationale: 同时体现 אִישׁ 的男性所指和 מִצְרִי 的埃及身份，比单译“一个埃及人”更明确。
- source_word: בַּשָּׂדֶה
  choice: 在田野里
  rationale: שָׂדֶה 在此指户外的田野；此译法贴近原文，又不额外限定为耕地或荒野。
- source_word: וַיִּקְחוּ אֹתוֹ אֶל דָּוִד
  choice: 就把他带到大卫那里
  rationale: לקח 在带着某人前往某处的结构中可译为“带到”；“那里”使现代汉语表达自然，并保留目的地是大卫所在之处。
- source_word: וַיִּתְּנוּ לוֹ לֶחֶם
  choice: 他们给他饼
  rationale: 保留 לֶחֶם 的具体食物意象，不泛化为“食物”；“饼”也适合古代近东语境。
- source_word: וַיֹּאכַל
  choice: 他就吃了
  rationale: 原文没有明说宾语，译文同样不补出“饼”或“它”；“就”自然表达紧接着发生的动作。
- source_word: וַיַּשְׁקֻהוּ מָיִם
  choice: 又给他水喝
  rationale: שׁקה 的使役式表示使人饮用或给人喝；此译法自然保留使役含义，又避免“强迫他喝水”的误解。
