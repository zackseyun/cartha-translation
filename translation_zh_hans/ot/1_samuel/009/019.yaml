base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/019.yaml
  text: Samuel answered Saul and said[a], “I am the seer. Go up before me to the high place, and eat with me today. In the morning I will send you on your way[b], and I will tell you all that is in your heart.”
translation:
  language: zh_hans
  text: 撒母耳回答扫罗说：“我就是先见[a]。你先上丘坛去；今天你们要和我一同吃饭。到了早晨，我会让你离开。你心里的一切，我都会告诉你。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “先见”是较早的称谓，后来通常称为“先知”；参撒母耳记上9:9。
    reason: alternative_reading
lexical_decisions:
- source_word: הָרֹאֶה
  choice: 先见
  rationale: 原意为“看见者”，在本段历史语境中是“先知”的旧称（参撒母耳记上9:9）。“先见”既保留原词特色，也不把它直接等同改写为“先知”。
- source_word: הַבָּמָה
  choice: 丘坛
  rationale: 指设于高处或称为“高处”的敬拜场所。“丘坛”是简洁而具有历史语境的汉语表达，比“祭坛”更能涵盖整个敬拜地点。
- source_word: עֲלֵה לְפָנַי
  choice: 你走在我前面，上丘坛去
  rationale: 保留“上去”的方向以及“在我前面”的相对位置，不进一步断定扫罗是在领路还是仅先行。
- source_word: וַאֲכַלְתֶּם עִמִּי הַיּוֹם
  choice: 今天你们要和我一同吃饭
  rationale: 希伯来语动词为第二人称阳性复数，因而用“你们”明确保留复数信息；很可能包括扫罗和他的仆人。
- source_word: וְשִׁלַּחְתִּיךָ
  choice: 我会送你上路
  rationale: 在此表示次日让扫罗启程离去。“送你上路”符合现代汉语，也避免“打发你走”可能带有的排斥意味。
- source_word: בַבֹּקֶר
  choice: 到了早晨
  rationale: 原文直译为“在早晨”；结合前文“今天”，自然指接下来的早晨，但不额外加入“明天”。
- source_word: וְכֹל אֲשֶׁר בִּלְבָבְךָ
  choice: 你心里的一切
  rationale: 保留希伯来语“在心里”的表达；“心”在此可涵盖思想、牵挂和意向，不缩窄为单纯情绪。
- source_word: אַגִּיד לָךְ
  choice: 我都会告诉你
  rationale: 该使役词形表示使人知道；“告诉”在对话中自然准确，“都”与前面的“一切”呼应。
theological_decisions:
- issue: הָרֹאֶה 是否直接译为“先知”
  choice: 先见
  alternative: 先知
  rationale: 本章9节特意说明“先见”是较早的称谓。保留两者的词语区别，既尊重叙事的历史说明，也不对其职分作额外的神学界定。
translation_notes:
  register: 采用现代、庄重而口语可懂的叙事语言。“先见”和“丘坛”保留历史文化色彩，并用脚注解释较不常见的称谓；以“你们”直接呈现原文复数。
