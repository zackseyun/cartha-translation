  text: Yahweh had revealed to Samuel one day before Saul came[a], saying,
translation:
  language: zh_hans
  text: 扫罗来之前一天，耶和华已经向撒母耳启示[a]：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“揭开撒母耳的耳朵”，这是“向他透露、使他知道”的习语。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיהוָה
  choice: 耶和华
  rationale: 以现代中文中通行的音译呈现神的专名；句首的 וַ 按希伯来叙事衔接处理，不另加“现在”或“于是”，避免加入原文没有的显性时间词。
- source_word: גָּלָה אֶת־אֹזֶן שְׁמוּאֵל
  choice: 向撒母耳启示
  rationale: 原文直译为“揭开撒母耳的耳朵”，是把事情透露给某人、使其知道的习语。“向撒母耳启示”自然表达其含义，并以脚注保留原文意象。
- source_word: יוֹם אֶחָד לִפְנֵי בּוֹא שָׁאוּל
  choice: 扫罗来之前一天
  rationale: 准确表达“在扫罗来到以前一日”的时间关系；前置时间短语符合现代汉语叙事习惯。
- source_word: לֵאמֹר
  choice: ：
  rationale: 该词引出下节的直接话语；中文以冒号自然、简洁地承担“说”的引语功能，避免“启示说”的生硬搭配。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。采用现代简体中文圣经传统中最广为普通读者识别的“耶和华”，保留其作为专名的性质，而不以“主”替代。
translation_notes:
  register: 采用自然、庄重而简洁的现代标准汉语。将时间短语置于句首，使语序清楚；以冒号承接下一节的直接话语。脚注标记紧随“启示”，明确对应希伯来习语。
