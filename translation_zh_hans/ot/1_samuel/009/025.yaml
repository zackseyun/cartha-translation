  text: When they came down from the high place into the city[a], he spoke with Saul on the roof.
translation:
  language: zh_hans
  text: 他们从丘坛下来，进了城[a]；他在房顶上和扫罗交谈。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们从丘坛下到城里；他在房顶上和扫罗交谈。”“丘坛”指祭祀所用的高处。
    reason: 保留原文从丘坛向城中移动的另一自然表达，并说明“丘坛”对应的祭祀性地点含义。
lexical_decisions:
- source_word: וַיֵּרְדוּ
  choice: 他们……下来
  rationale: 该动词表示向下移动，复数形式保留“他们”这一主语；用连续叙事句式自然表达前缀连接词所推动的情节。
- source_word: מֵהַבָּמָה
  choice: 从祭祀的高处
  rationale: בָּמָה在本段语境中指用于献祭等礼仪活动的高地。“祭祀的高处”既保留其空间形象，也让现代普通读者明白其礼仪用途，避免把它仅仅理解为一般山丘。
- source_word: הָעִיר
  choice: 进了城
  rationale: 在下降移动的语境中，此处自然表示进入城中；“进了城”符合现代汉语表达。
- source_word: וַיְדַבֵּר
  choice: 他……交谈
  rationale: 希伯来语由复数动词转为单数动词，译文保留这一主语变化。“交谈”与后面的עִם相配，不额外指定谈话内容。
- source_word: עִם שָׁאוּל
  choice: 跟扫罗
  rationale: 介词עִם通常表示“与、跟”，呈现双方同在并交谈的意味，而不是改成单向的“对扫罗说”。
- source_word: עַל הַגָּג
  choice: 在房顶上
  rationale: גָּג指古代房屋可供活动的平顶；“房顶上”是清楚自然的现代汉语说法。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重的现代标准汉语。保留原文从复数“他们”转为单数“他”的变化，不在正文中把“他”明确替换为撒母耳；以“祭祀的高处”清楚表达בָּמָה在上下文中的礼仪含义。
