  text: וַ/תַּעֲנֶ֧ינָה אוֹתָ֛/ם וַ/תֹּאמַ֥רְנָה יֵּ֖שׁ הִנֵּ֣ה לְ/פָנֶ֑י/ךָ מַהֵ֣ר עַתָּ֗ה כִּ֤י הַ/יּוֹם֙ בָּ֣א לָ/עִ֔יר כִּ֣י זֶ֧בַח הַ/יּ֛וֹם לָ/עָ֖ם בַּ/בָּמָֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/012.yaml
  text: They answered them and said[a], “Yes, look—he is just ahead of you. Hurry now, because he came to the city today[b], because today there is a sacrifice for the people at the high place.”
translation:
  language: zh_hans
  text: 她们回答他们说：“是的，你看，他就在你前面。[a]现在快些，因为他今天来到城里；今天在丘坛[b]有为百姓举行的祭祀。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “是的，你看，他就在你前面”直译也可作“有，看哪，他在你前面”。希伯来文先用表示存在或肯定的词，再用提示注意的语词。
    reason: lexical_alternative
  - marker: b
    text: “丘坛”指设在高处的地方性敬拜场所。
    reason: cultural_note
lexical_decisions:
- source_word: וַתַּעֲנֶינָה אוֹתָם וַתֹּאמַרְנָה
  choice: 她们回答他们说
  rationale: 两个动词均为阴性复数，所指是上文的少女；保留希伯来叙事中“回答……说”的结构。
- source_word: יֵשׁ
  choice: 有
  rationale: 本义为“有、存在”，在回答上文“先见在这里吗”的问题时构成肯定答复；用“有”既符合汉语问答习惯，也保留其存在句色彩。
- source_word: הִנֵּה לְפָנֶיךָ
  choice: 看，他就在你前面
  rationale: הִנֵּה 用来提醒对方注意，译作“看”；לְפָנֶיךָ 表示空间上的“在你前面”，“就”自然传达语境中的近在前方。
- source_word: מַהֵר עַתָּה
  choice: 现在赶快去
  rationale: 命令式 מַהֵר 表达催促，עַתָּה 加强即时性；补出“去”使现代汉语完整自然，并未增加新的行动内容。
- source_word: כִּי הַיּוֹם בָּא לָעִיר
  choice: 因为他今天进了城
  rationale: כִּי 引出催促的理由；完成式 בָּא 在叙事语境中指当日已经发生的进城行动。
- source_word: זֶבַח הַיּוֹם לָעָם
  choice: 今天百姓要……献祭
  rationale: זֶבַח 指祭祀或祭牲；此处用汉语动词结构“献祭”表达当天为百姓举行的祭祀，不额外明确经文在本节未明说的宴席含义。
- source_word: בַּבָּמָה
  choice: 在丘坛
  rationale: במה 是设于高处的地方性敬拜场所；“丘坛”简洁保留其地势和礼仪性质，且不在正文中加入后期的负面评价。
theological_decisions:
- issue: 前王国时期 במה 的译法
  choice: 丘坛
  alternative: 高处的祭坛；山冈上的圣所
  rationale: “丘坛”可作为历史礼仪场所的名称，既呈现其高处特征，也避免把后世针对某些丘坛的贬义判断预先带入本节。
- issue: זֶבַח 是否明确译为宴席
  choice: 献祭
  alternative: 举行祭宴
  rationale: 本节词语本身首先指祭祀；虽然后文显示有共同进食的场景，本节不宜把该含义提前明说。
translation_notes:
  register: 采用现代、庄重而口语可懂的叙事语言。“她们”明确反映希伯来语阴性复数；“回答他们说”略带经文叙事风格，但在现代汉语中仍清楚自然。两个脚注标记均放在其实际解释的词句之后。
