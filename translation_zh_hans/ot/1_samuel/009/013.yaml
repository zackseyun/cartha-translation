base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/013.yaml
  text: As soon as you enter the city[a], you will find him, before he goes up to the high place to eat. For the people will not eat until he comes, because he is the one who blesses the sacrifice; afterward those who are invited eat. So go up now[c][b], for today you will find him.
translation:
  language: zh_hans
  text: 你们一进城，就会找到他，那时他还没有上丘坛[b]去吃饭。因为他还没有来，百姓不会吃；因为是他为祭物祝福[a]，此后受邀的人才吃。现在你们上去吧，因为今天[c]你们一定会找到他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “为祭物祝福”可能是指在受邀的人吃献祭宴席以前，宣告与这顿宴席相关的祝福。
    reason: cultural_note
  - marker: b
    text: “丘坛”指古代在高处设立、可举行献祭宴席的敬拜地点。
    reason: cultural_note
  - marker: c
    text: “今天”或译“此时”或“大约这个时候”。希伯来语 כְהַיּוֹם 在这里可能强调眼下的时机，也可能指当天。
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּבֹאֲכֶם הָעִיר
  choice: 你们一进城
  rationale: כְּ 加不定式结构表示时间；“一进城”自然表达此处紧接发生的语气。
- source_word: כֵּן תִּמְצְאוּן אֹתוֹ
  choice: 就会找到他
  rationale: כֵּן 在此加强随即发生或确定的结果；用“就”既自然又保留其作用。
- source_word: בְּטֶרֶם יַעֲלֶה הַבָּמָתָה
  choice: 那时他还没有上丘坛
  rationale: בְּטֶרֶם 表示“在……以前”；עלה 保留“上去”的方向感，במה 译为传统且准确的“丘坛”。
- source_word: יְבָרֵךְ הַזֶּבַח
  choice: 他要为祭物祝福
  rationale: 保留 ברך 与 זבח 的直接语义，并以“为……祝福”表达在献祭宴席前宣告祝福的动作，不把其具体礼仪方式写死。
- source_word: הַקְּרֻאִים
  choice: 受邀的人
  rationale: 准确呈现 קרא 的被动分词“被邀请者”，不额外添加原文没有的身份限定。
- source_word: וְעַתָּה עֲלוּ
  choice: 现在你们上去吧
  rationale: 保留 עלה 的向上移动含义，并以“吧”自然表达催促。
- source_word: כְהַיּוֹם
  choice: 就在这时候
  rationale: 该短语可表示“今天”，也可能强调当下、此时的即时性；上下文中的寻找与赶赴使“就在这时候”合适，同时以脚注保留另一译法。
