- from: 你们一进城，就会找到他，那时他还没有上丘坛去吃饭。因为他来以前，百姓不会吃；他要为祭物祝福[a]，然后受邀的人才吃。现在你们上去吧，因为就在这时候[b]，你们一定会找到他。
  to: 你们一进城，就会找到他，那时他还没有上丘坛[b]去吃饭。因为他还没有来，百姓不会吃；因为是他为祭物祝福[a]，此后受邀的人才吃。现在你们上去吧，因为今天[c]你们一定会找到他。
  rationale: 修订使时间与因果关系符合希伯来原文：百姓在他来到并为祭物祝福前不吃，受邀者在此后才吃。将末句正文译为“今天”以保留最直接的词义，并在脚注中保留其可能的即时性含义；同时补足“丘坛”的文化脚注锚点。
