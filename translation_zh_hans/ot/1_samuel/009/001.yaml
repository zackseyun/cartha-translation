base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/001.yaml
  text: There was a man of Benjamin[a], and his name was Kish son of Abiel, son of Zeror, son of Becorath, son of Aphiah, son of a Benjaminite, a mighty man of valor.
translation:
  language: zh_hans
  text: 有一个便雅悯支派的人，名叫基士，是亚别的儿子，亚别是洗罗的儿子，洗罗是比歌拉的儿子，比歌拉是亚斐亚的儿子，亚斐亚是一个便雅悯人的儿子；基士是个大有能力的人。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “大有能力的人”也可译作“英勇的战士”“显要人物”或“富有而有影响力的人”。原文短语可带有军事、社会地位或经济实力方面的含义，具体侧重由上下文决定。
    reason: 词义存在真实的语境歧义，正文不宜只选定军事、社会或经济含义。
lexical_decisions:
- source_word: וַיְהִי אִישׁ מִבֶּן־יָמִין
  choice: 有一个便雅悯支派的人
  rationale: וַיְהִי在这里引入新的叙事人物，不必另加表示时间的“那时”；מִבֶּן־יָמִין表示其支派归属，译出“支派”可使现代读者清楚理解。
- source_word: וּשְׁמוֹ קִישׁ
  choice: 名叫基士
  rationale: 采用自然的现代汉语人物介绍句式；קִישׁ按通行中文圣经人名译作“基士”。
- source_word: בֶּן אֲבִיאֵל בֶּן צְרוֹר בֶּן בְּכוֹרַת בֶּן אֲפִיחַ
  choice: 他是亚别的儿子，亚别是洗罗的儿子，洗罗是比歌拉的儿子，比歌拉是亚斐亚的儿子
  rationale: 逐层保留重复的בֶּן谱系结构，同时用完整分句避免中文里连续“某某的儿子的儿子”所造成的歧义。人名采用通行译名。
- source_word: בֶּן־אִישׁ יְמִינִי
  choice: 亚斐亚出自便雅悯人
  rationale: 该短语在谱系末尾标明祖系属于便雅悯；“出自”保留谱系来源之意，又避免把未具名的祖先生硬译成“一个便雅悯人的儿子”。
- source_word: גִּבּוֹר חָיִל
  choice: 有实力、有地位的人
  rationale: 该词组可涉及勇武、能力、财富或社会声望；本节是在介绍基士的家世，用较宽泛的表达保留其多重可能，不把含义限定为军事实绩。
theological_decisions:
- issue: גִּבּוֹר חָיִל所指的性质
  choice: 正文译作“有实力、有地位的人”，脚注列出军事、社会及经济层面的可能含义
  alternative: 大能的勇士／英勇的战士／富有而有影响力的人
  rationale: 上下文尚不足以断定这里专指勇士、富户或社会名流；采用涵盖性译法可保留原文张力，避免把扫罗家世的性质解释得过窄。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。谱系关系拆成连续分句，既忠实呈现世系，又便于普通读者辨认各代关系；不沿用较古奥的“玄孙、曾孙”压缩表达。
