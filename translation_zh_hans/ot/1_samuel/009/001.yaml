revisions:
- from: 有一个便雅悯支派的人，名叫基士。他是亚别的儿子，亚别是洗罗的儿子，洗罗是比歌拉的儿子，比歌拉是亚斐亚的儿子；亚斐亚出自便雅悯人。基士是个有实力、有地位的人。[a]
  to: 有一个便雅悯支派的人，名叫基士，是亚别的儿子，亚别是洗罗的儿子，洗罗是比歌拉的儿子，比歌拉是亚斐亚的儿子，亚斐亚是一个便雅悯人的儿子；基士是个大有能力的人。[a]
  rationale: 修订明确保留末尾“一个便雅悯人的儿子”的父子关系及单数表述，并以较宽泛、自然的“大有能力的人”承载גִּבּוֹר חָיִל的未决语义；脚注继续提供不宜在正文定论的具体可能。
