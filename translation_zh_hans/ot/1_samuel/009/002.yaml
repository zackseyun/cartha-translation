base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/002.yaml
  text: And he had a son whose name was Saul[a], a young man and handsome. There was not a man among the sons of Israel more handsome than he[b]; from his shoulders upward he was taller than all the people.
translation:
  language: zh_hans
  text: 他有一个儿子，名叫扫罗，是个英俊的年轻人[a]。以色列人中，没有一个男子比他更英俊；他比众人都高出一头[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “英俊”也可译作“仪表出众”。希伯来文所用的词也有“好、出色”的意思。
    reason: 保留טוֹב在此处可能兼具外貌俊美与整体出众的语义宽度。
  - marker: b
    text: 希伯来文直译：“从他的肩膀往上，他高过所有人。”
    reason: 主文采用自然汉语的身高说法，脚注保存原文独特的身体方位表达。
lexical_decisions:
- source_word: בֵן
  choice: 儿子
  rationale: 这里指基士的男性后代，亲属关系明确；“儿子”是现代汉语中自然准确的表达。
- source_word: וּשְׁמוֹ שָׁאוּל
  choice: 名叫扫罗
  rationale: 以自然汉语表达“他的名字是扫罗”，并采用通行的圣经人名译法。
- source_word: בָּחוּר
  choice: 年轻的人
  rationale: 该词在此指正值青壮年的男子；与后面的外貌描写连用时，译为“年轻……的人”自然清楚。
- source_word: טוֹב / וָטוֹב
  choice: 英俊
  rationale: טוֹב本义宽泛，可指“好、出众”；本节接着描述扫罗的身材，并以男子作比较，因此语境主要指外表俊美。
- source_word: וְאֵין אִישׁ מִבְּנֵי יִשְׂרָאֵל טוֹב מִמֶּנּוּ
  choice: 以色列人中，没有一个男子比他更英俊
  rationale: 保留存在句、性别明确的אִישׁ以及比较结构；“以色列人”是“以色列众子”在现代汉语中的自然群体称呼。
- source_word: מִשִּׁכְמוֹ וָמַעְלָה גָּבֹהַּ מִכָּל הָעָם
  choice: 他比众人都高出一头
  rationale: 这是现代汉语中自然的身高比较表达，传达扫罗从肩部以上高过众人的形象；脚注保留希伯来文具体而略显生硬的身体方位说法。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“年轻英俊的人”避免古雅的“俊美少年”；“高出一头”符合普通读者的自然表达。所有脚注标记均置于相关主文之后。
