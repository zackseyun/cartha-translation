  yaml_path: translation/ot/1_samuel/009/018.yaml
  text: Then Saul approached Samuel in the midst of the gate and said[b][a], “Please tell me where the seer’s house is.”
translation:
  language: zh_hans
  text: 扫罗在城门内走到撒母耳跟前，对他说：“请告诉我，先见[a]的家[b]在哪里？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “先见”是较早的称呼，后来通常称为“先知”；本章第9节对此有所说明。
    reason: cross_reference
  - marker: b
    text: 或译：“先见住在哪里？”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגַּשׁ
  choice: 走到……跟前
  rationale: 该动词表示靠近、走近某人；“走到撒母耳跟前”自然地表达了扫罗朝他靠近的动作。
- source_word: בְּתוֹךְ הַשָּׁעַר
  choice: 在城门内
  rationale: 原文直译为“在城门中间”；古代城门常指有内部空间的城门通道或建筑区域。“在城门内”既保留场景，也避免现代读者误解为站在门板正中。
- source_word: הַגִּידָה נָּא לִי
  choice: 请告诉我
  rationale: 命令式加语气词 נָא 构成礼貌请求，“请告诉我”准确而符合现代汉语习惯。
- source_word: אֵי זֶה
  choice: 在哪里
  rationale: 此处是在询问地点；译为“在哪里”比机械地译成“哪一个”更符合上下文。
- source_word: בֵּית הָרֹאֶה
  choice: 先见的家
  rationale: רֹאֶה 字面指“看见者”，是本章所保留的较早称谓；“先见”可体现这一历史用语，并与9:9的叙事说明呼应。构造短语 בֵּית הָרֹאֶה 直译为“先见的家”。
