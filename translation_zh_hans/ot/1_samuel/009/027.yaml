base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/027.yaml
  text: As they were going down to the edge of the city[a], Samuel said to Saul, “Tell the young man to go on ahead of us.” And he went on ahead. “But you, stand here now[b], and I will let you hear the word of God.”
translation:
  language: zh_hans
  text: 他们下到城边时，撒母耳对扫罗说：“叫那年轻人[a]走到我们前面去。”他就走到前面去了。撒母耳又说：“你暂且站在这里[b]，我要让你听见上帝的话。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“那随从”。希伯来语 נַעַר 可指年轻人、侍从或仆人。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语直译近于“现在站住”；这是叫扫罗暂时停留在原处的惯用表达。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵמָּה יֹרְדִים
  choice: 他们下到……时
  rationale: 分词描写当时正在进行的动作；汉语用“下到……时”既自然，也保留从较高处往下行的方向感。
- source_word: בִּקְצֵה הָעִיר
  choice: 城边
  rationale: קָצֶה 指边缘、尽头；“城边”简明现代，比“城郊”少一层解释。
- source_word: לַנַּעַר
  choice: 那年轻人
  rationale: נַעַר 可指年轻人、随从或仆人。正文保留较宽泛的年龄称谓，脚注说明本处按上下文也可译作“随从”。
- source_word: וְיַעֲבֹר לְפָנֵינוּ
  choice: 走到我们前面去
  rationale: עבר 与 לִפְנֵי 连用表示越过当前位置、走在前面；此译符合现代汉语表达。
- source_word: עֲמֹד כַּיּוֹם
  choice: 暂且站在这里
  rationale: כַּיּוֹם 在此为不易直译的时间性表达，意思是当下停留片刻；“暂且”表达其临时性，“在这里”由语境补出。
- source_word: וְאַשְׁמִיעֲךָ
  choice: 我要让你听见
  rationale: שׁמע 的使役式直指“使你听见”；此译保留使役意味，同时符合汉语习惯。
- source_word: דְּבַר אֱלֹהִים
  choice: 上帝的话
  rationale: דָּבָר 可指话、事情或信息；在先知启示语境中译作“上帝的话”，保留原文的启示分量而不过度释义。
theological_decisions:
- issue: דְּבַר אֱלֹהִים 的启示性表达
  choice: 上帝的话
  alternative: 上帝的信息
  rationale: “上帝的话”保留先知传达神圣启示的传统和神学张力，也不预先界定即将宣告内容的形式。
translation_notes:
  register: 采用自然、庄重而清楚的现代标准汉语。将说话者在后一句补作“撒母耳又说”，以免连续引语在汉语中产生说话者不明的问题；内容未增添新的命题。所有脚注标记均已置于正文相应位置。
