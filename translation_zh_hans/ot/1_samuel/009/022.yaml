base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/022.yaml
  text: Then Samuel took Saul and his young man and brought them into the hall[a], and gave them a place at the head of those who had been invited[c][b]; and they were about thirty men.
translation:
  language: zh_hans
  text: 撒母耳带着扫罗和他的侍从[a]进入宴会厅[b]，让他们坐在受邀的人中最尊贵的位置；受邀的约有三十人[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “侍从”或译“年轻人”或“仆人”。
    reason: lexical_alternative
  - marker: b
    text: “宴会厅”或译“房间”或“内室”；这里按宴席场景翻译。
    reason: lexical_alternative
  - marker: c
    text: 希伯来文直译：“他们约有三十人。”“他们”很可能指在场的受邀者。
    reason: referent_ambiguity
lexical_decisions:
- source_word: נַעֲרוֹ
  choice: 他的侍从
  rationale: נַעַר可指年轻人、仆人或随从；叙事中此人陪同扫罗并受其差遣，译作“侍从”自然，又不必断定其具体身份或年龄。
- source_word: לִשְׁכָּתָה
  choice: 进入宴会厅
  rationale: לִשְׁכָּה可指房间、内室或厅堂；本节是多人赴宴的场景，因此“宴会厅”清楚表达语境，同时以脚注保留较宽泛的词义。
- source_word: מָקוֹם בְּרֹאשׁ
  choice: 坐在……最尊贵的位置
  rationale: מָקוֹם字面为“地方、位置”，בְּרֹאשׁ字面为“在首位”；宴席语境中合译为“坐在最尊贵的位置”，自然呈现座次所表达的尊荣。
- source_word: הַקְּרוּאִים
  choice: 受邀的人
  rationale: 该被动分词源自קרא，在宴席语境中指被召来、受邀请的人；“受邀的人”忠实而简明。
- source_word: וְהֵמָּה כִּשְׁלֹשִׁים אִישׁ
  choice: 受邀的约有三十人
  rationale: 代词“他们”最自然地回指刚提到的受邀者。汉语明说“受邀的”可避免指代含混；同时脚注说明希伯来文的字面结构。
- source_word: וַיִּקַּח ... וַיְבִיאֵם
  choice: 带着……进入
  rationale: 两个连续动词字面为“带/取”与“使进入/带进”。现代汉语合译为“带着……进入”可避免生硬重复，并完整表达动作及方向。
