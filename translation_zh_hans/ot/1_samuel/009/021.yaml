  text: וַ/יַּ֨עַן שָׁא֜וּל וַ/יֹּ֗אמֶר הֲ/ל֨וֹא בֶן יְמִינִ֤י אָ֨נֹכִי֙ מִ/קַּטַנֵּי֙ שִׁבְטֵ֣י יִשְׂרָאֵ֔ל וּ/מִשְׁפַּחְתִּ/י֙ הַ/צְּעִרָ֔ה מִ/כָּֽל מִשְׁפְּח֖וֹת שִׁבְטֵ֣י בִנְיָמִ֑ן וְ/לָ֨/מָּה֙ דִּבַּ֣רְתָּ אֵלַ֔/י כַּ/דָּבָ֖ר הַ/זֶּֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/021.yaml
  text: Saul answered and said[a], “Am I not a Benjaminite, from the smallest of the tribes of Israel? And is not my clan the least of all the clans of the tribe of Benjamin? So why have you spoken to me in this way?”
translation:
  language: zh_hans
  text: 扫罗回答说：“我不是便雅悯人，出自以色列最小的支派吗？我的宗族，不也是便雅悯支派所有宗族中最微小的吗？你为什么对我说这样的话呢？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֲלוֹא
  choice: 不是……吗
  rationale: 引出预期对方认同的反问；现代汉语用“不是……吗”自然保留其语气。
- source_word: בֶן יְמִינִי
  choice: 便雅悯人
  rationale: 这里是族属称谓，指属于便雅悯支派的人，并非强调字面的“便雅悯之子”。
- source_word: מִקַּטַנֵּי שִׁבְטֵי יִשְׂרָאֵל
  choice: 出自以色列最小的支派
  rationale: 保留介词所表达的归属，并以“最小”传达 קטן 在此所指的规模或地位卑微。
- source_word: מִשְׁפַּחְתִּי
  choice: 我的宗族
  rationale: מִשְׁפָּחָה 是支派之下的亲族群体；“宗族”比现代汉语的“家庭”更准确。
- source_word: הַצְּעִרָה
  choice: 最微小的
  rationale: 既可指规模小，也可指地位低微；“微小”保留两方面的可能，并符合扫罗自谦的语境。
- source_word: מִכָּל מִשְׁפְּחוֹת שִׁבְטֵי בִנְיָמִן
  choice: 便雅悯支派所有宗族中
  rationale: 按上下文理解为便雅悯这一支派内部的各宗族；希伯来语虽有形式上的复数“支派”，汉语直译会造成多个便雅悯支派的误解。
- source_word: וְלָמָּה
  choice: 你为什么
  rationale: 承接前面的两个反问，汉语无须硬译连接词也能自然呈现其推论关系。
- source_word: דִּבַּרְתָּ אֵלַי כַּדָּבָר הַזֶּה
  choice: 你为什么对我说这样的话呢
  rationale: כַּדָּבָר הַזֶּה 可指“这样的话”或“这样的事”；此处直接回应撒母耳刚才所说的内容，译作“这样的话”自然且贴近原文。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而口语可懂的叙事体。“宗族”准确体现古代以色列支派之下的亲族单位；两个反问保持扫罗自谦和惊讶的语气。原文末句的可能译法“为什么对我说这样的事”与正文差异很小，不足以另设脚注。
