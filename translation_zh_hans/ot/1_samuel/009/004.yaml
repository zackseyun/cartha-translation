base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/004.yaml
  text: He passed through the hill country of Ephraim and passed through the land of Shalishah[a], but they did not find them. Then they passed through the land of Shaalim, but they were not there. Then he passed through the land of Benjamin[b], but they did not find them.
translation:
  language: zh_hans
  text: 他经过以法莲山地，又经过沙利沙地，却没有找到[a]。他们又经过沙琳地，那里也没有[b]。他又经过便雅悯地，还是没有找到。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文没有说明找到什么；按上文，是指走失的母驴。
    reason: implicit_object
  - marker: b
    text: 原文直译为“也没有”或“没有什么”，是一种省略说法；按上下文，是指母驴不在那里。
    reason: elliptical_expression
lexical_decisions:
- source_word: וַיַּעֲבֹר / וַיַּעַבְרוּ
  choice: 走遍
  rationale: עבר与介词בְ连用，表示穿行某一区域；“走遍”符合寻找失驴的语境，也自然呈现接连搜索多个地区的过程。原文单复数交替分别译为“他”和“他们”。
- source_word: בְּהַר אֶפְרַיִם
  choice: 以法莲山区
  rationale: הַר在地域名称中指山地或丘陵地区，并非单独一座山；“山区”简洁自然。
- source_word: אֶרֶץ שָׁלִשָׁה
  choice: 沙利沙地
  rationale: אֶרֶץ在此指以沙利沙为名的地域；保留地名音译，不推断其政治性质。
- source_word: וְלֹא מָצָאוּ
  choice: 却没有找到
  rationale: 复数动词表明扫罗和仆人一同寻找。希伯来文省略宾语，中文也可自然省略，并以脚注说明其所指；“却”体现寻找无果的转折。
- source_word: אֶרֶץ שַׁעֲלִים
  choice: 沙琳地
  rationale: 将该地域名称按传统中文圣经地名形式音译，并用“地”表达其地域含义。
- source_word: וָאַיִן
  choice: 也没有
  rationale: 原文是极简省略表达，直译近于“而没有”；正文保留其简练和含混，由脚注交代按语境所指。
- source_word: אֶרֶץ יְמִינִי
  choice: 便雅悯地
  rationale: יְמִינִי是与便雅悯相关的族称或形容词；在地理行程中译作“便雅悯地”清楚自然，同时不把它误解为某个个人的土地。
