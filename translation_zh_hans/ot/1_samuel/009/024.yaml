base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/024.yaml
  text: So the cook took up the leg and what was on it and set it before Saul[a]. And he said, “Look, what has been kept is set before you. Eat, because it was kept for you for the appointed time, from when I said[d][c][b], ‘I have invited the people.’” So Saul ate with Samuel that day.
translation:
  language: zh_hans
  text: 厨子拿起那条腿[a]，连同上面附着的部分[b]，摆在扫罗面前。撒母耳说：“看，特意留下的这一份[c]已经摆在你面前了。请吃吧，因为这是为你留到约定时刻的；当时我曾说：‘我请了[d]众人来。’”那一天，扫罗就和撒母耳一同吃饭。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“大腿”。希伯来语 שׁוֹק 指牲畜腿部的一块肉。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语直译“那条腿和在它上面的”。原文没有明确说明附带的部分是什么。
    reason: lexical_alternative
  - marker: c
    text: 或译“剩下的这一份”。这个希伯来词既可指剩下的，也可指留下备用的；上下文较支持这是特意为扫罗预留的一份。
    reason: alternative_reading
  - marker: d
    text: 或译“召来了”。希伯来语动词既可表示呼叫、召来，也可在筵席语境中表示邀请。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַטַּבָּח
  choice: 厨子
  rationale: 此人在献祭筵席中预备并端上肉食；“厨子”符合本节动作与现代汉语语境，同时不采用较易使人想到职业屠宰者的“屠夫”。
- source_word: הַשּׁוֹק
  choice: 那条腿
  rationale: 该词指牲畜的腿部肉块；“腿”清楚自然，又不像“腿肉”或“大腿”那样过度限定具体部位。
- source_word: וְהֶעָלֶיהָ
  choice: 连同上面附着的部分
  rationale: 原文直译近于“和在它上面的”；并未明确说出附带部分是什么，因此保留其概括性，不采纳“肥尾”等推定。
- source_word: הַנִּשְׁאָר
  choice: 特意留下的这一份
  rationale: 该词本可表示“剩下的”，但下文说明这一份是为扫罗预留的；“特意留下”表达语境所显出的预留意味，“这一份”则使中文指称自然。
- source_word: שִׂים לְפָנֶיךָ
  choice: 已经摆在你面前了
  rationale: 字面形式是命令语气“放在你面前”，但在场景中所指肉食刚刚已被摆下；按其语用功能译成状态陈述，更符合自然汉语。
- source_word: לַמּוֹעֵד
  choice: 留到约定时刻
  rationale: מוֹעֵד表示指定的时间或场合。“约定时刻”保留事先安排之意，同时不把它限定为宗教节期。
- source_word: שָׁמוּר לְךָ
  choice: 为你留
  rationale: 被动分词表明该肉份一直为扫罗保留；中文“为你留”简洁自然，并保留预留的结果状态。
- source_word: קָרָאתִי
  choice: 我请了众人来
  rationale: קרא基本义为“呼叫、召来”，在筵席语境中可表示邀请；“请了……来”既自然，也比单纯“邀请”略多保留“召来”的字面色彩。
- source_word: עִם שְׁמוּאֵל
  choice: 和撒母耳一同吃饭
  rationale: 介词表示共同进食；“一同吃饭”清楚表达席间相交，不加入额外解释。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“撒母耳说”补出原文省略但由上下文可辨的说话者，避免中文发生主语误读。引语中保留“留到约定时刻”与后接“我请了众人来”之间较为压缩的关系，不进一步推定具体安排过程。
