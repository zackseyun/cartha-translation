revisions:
- from: 他们清早起来。黎明初升时[a]，撒母耳在房顶上呼唤扫罗，说：“起来吧，我好送你上路[b]。”扫罗就起来；二人，也就是他和撒母耳，一同出到外面。
  to: 他们清早起来；黎明初升时[a]，撒母耳在屋顶上呼唤扫罗，说：“起来吧，我要送你启程[b]。”扫罗就起来；他们二人，就是扫罗和撒母耳，一同出到外面。
  rationale: 修订仅改善现代汉语的自然性与语义精确度：以“我要送你启程”直接表达撒母耳将遣送扫罗启程的意思，并以“扫罗和撒母耳”清楚呈现原文强调性的同位结构。时间推进、屋顶场景和未指明的“外面”均予保留。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T05:26:10Z'
