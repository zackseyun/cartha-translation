base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/026.yaml
  text: They rose early[a], and when the dawn was breaking, Samuel called to Saul on the roof, saying, “Get up, and I will send you on your way.” So Saul got up, and the two of them, he and Samuel[b], went outside.
translation:
  language: zh_hans
  text: 他们清早起来；黎明初升时[a]，撒母耳在屋顶上呼唤扫罗，说：“起来吧，我要送你启程[b]。”扫罗就起来；他们二人，就是扫罗和撒母耳，一同出到外面。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译近于“黎明升起的时候”。
    reason: lexical_alternative
  - marker: b
    text: 或译“我要让你离去”。这里的希伯来语可指送人启程，也可指让人离开。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכִּמוּ
  choice: 他们清早起来
  rationale: שׁכם 的使役词干在此表示一早起身或开始行动；译为“清早起来”自然地保留时间重点。
- source_word: כַּעֲלוֹת הַשַּׁחַר
  choice: 黎明初升时
  rationale: 原文直译近于“黎明升起的时候”；此译保留其意象，同时符合现代汉语表达。
- source_word: הַגָּג
  choice: 在房顶上
  rationale: 指古代房屋可供住宿和活动的平顶；“房顶上”简明清楚，并与上文场景衔接。
- source_word: קוּמָה
  choice: 起来吧
  rationale: 命令式要求扫罗起身；加“吧”使直接引语在现代汉语中自然，而不削弱命令意味。
- source_word: וַאֲשַׁלְּחֶךָּ
  choice: 我好送你上路
  rationale: שׁלח 在此可指送行、让人启程或打发离开；结合待客和启程的语境，“送你上路”较自然，也不带“赶走”的负面意味。
- source_word: וַיֵּצְאוּ ... הַחוּצָה
  choice: 出到外面
  rationale: 动词加方向副词表示从所在之处出去；不具体添加“街上”等原文未明说的地点。
- source_word: שְׁנֵיהֶם הוּא וּשְׁמוּאֵל
  choice: 二人，也就是他和撒母耳
  rationale: 保留原文带强调色彩的同位结构“他们二人——他和撒母耳”，其中“他”自然回指扫罗。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准普通话。保留原文叙事中先说“清早起来”、继而说明“黎明初升时”的时间推进，也保留“二人，也就是他和撒母耳”略带强调的结构。脚注标记均置于其实际说明的短语之后。
