base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/011.yaml
  text: As they were going up the ascent to the city[a], they found young women coming out to draw water, and they said to them, “Is the seer here?”
translation:
  language: zh_hans
  text: 他们正沿着通往城里的上坡路往上走时，遇见一些出来打水的年轻女子，就问她们：“先见在这里吗？”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “先见”是当时对后来称为“先知”的人的旧称；原文在这里特意使用“先见”。
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹלִים בְּמַעֲלֵה הָעִיר
  choice: 正沿着上城的坡路往上走
  rationale: 分词与独立代词连用，表现叙事中的持续动作；מַעֲלֶה指上坡的道路或坡道。此译既保留地形含义，也符合现代汉语表达。
- source_word: מָצְאוּ
  choice: 遇见
  rationale: 基本义为“找到”，但此处描写途中碰见出来打水的女子，译作“遇见”更自然，并未改变事件含义。
- source_word: נְעָרוֹת
  choice: 年轻女子
  rationale: 该词指年轻女性；“年轻女子”准确、自然，也避免“少女”可能带来的年龄范围过窄。
- source_word: יֹצְאוֹת לִשְׁאֹב מָיִם
  choice: 出来打水
  rationale: 分词加目的不定式表示她们出来是为打水；简洁地保留动作及目的。
- source_word: הֲיֵשׁ בָּזֶה
  choice: 在这里吗
  rationale: 该表达询问某人是否在此地；现代汉语以“在这里吗”最为自然。
- source_word: הָרֹאֶה
  choice: 先见
  rationale: 原文特意使用“看见者／先见”这一旧称，而非通常译作“先知”的נָבִיא；保留“先见”可维持本段的历史用语，并与下节的解释相呼应。
theological_decisions:
- issue: הָרֹאֶה的职分称谓
  choice: 正文译作“先见”
  alternative: “先知”
  rationale: 原文在此保留旧称，后文又明确说明今日所谓“先知”从前称为“先见”。因此不在正文中将两者直接同化，以免抹去叙事中的词义和历史差别。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“上城的坡路”具体呈现地形；“先见”虽非日常词语，却是本节及下文所需保留的历史称谓，并由脚注说明。
