source:
  edition: WLC
  text: כָּ/עֵ֣ת מָחָ֡ר אֶשְׁלַח֩ אֵלֶ֨י/ךָ אִ֜ישׁ מֵ/אֶ֣רֶץ בִּנְיָמִ֗ן וּ/מְשַׁחְתּ֤/וֹ לְ/נָגִיד֙ עַל עַמִּ֣/י יִשְׂרָאֵ֔ל וְ/הוֹשִׁ֥יעַ אֶת עַמִּ֖/י מִ/יַּ֣ד פְּלִשְׁתִּ֑ים כִּ֤י רָאִ֨יתִי֙ אֶת עַמִּ֔/י כִּ֛י בָּ֥אָה צַעֲקָת֖/וֹ אֵלָֽ/י׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/016.yaml
  text: About this time tomorrow I will send to you a man from the land of Benjamin[a], and you shall anoint him as ruler over my people Israel. He will save my people from the hand of the Philistines, for I have seen my people[b], because their cry has come to me.
translation:
  language: zh_hans
  text: 明天大约这个时候，我必差遣一个来自便雅悯境内的人到你这里。你要膏立他作我民以色列的统领[a]；他必从非利士人手中拯救我的百姓。因为我已经看见我的百姓，也因为他们的呼求[b]已经达到我这里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语为 נָגִיד，也可译作“领袖”，传统上译作“君”。这个词指受任命治理的人，并非仅具礼仪身份的人物。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语直译为“他的呼求”；单数后缀指向集合名词“我的百姓”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּעֵת מָחָר
  choice: 明天大约这个时候
  rationale: 保留原文所指约二十四小时后的特定时刻；“大约”对应介词כ所表达的近似意味，也符合现代汉语习惯。
- source_word: אֶשְׁלַח אֵלֶיךָ
  choice: 我会差……到你这里
  rationale: 保留אֶל的方向意味，并用自然的现代汉语表达上帝将那人差往撒母耳那里。
- source_word: מֵאֶרֶץ בִּנְיָמִן
  choice: 来自便雅悯境内
  rationale: אֶרֶץ在此指便雅悯支派的地域；“境内”比单说“来自便雅悯”更明确地保留地理含义。
- source_word: וּמְשַׁחְתּוֹ
  choice: 你要膏立他
  rationale: 该形式在这里承接上帝给撒母耳的指示，具有命令意味；“膏立”同时表达涂膏与任命。
- source_word: לְנָגִיד
  choice: 作……的统领
  rationale: נָגִיד指受任命、拥有治理权的人，却不必等同于完整的王号；“统领”保留政治与领导权威，又不提前译作“王”。
- source_word: וְהוֹשִׁיעַ
  choice: 他必……拯救
  rationale: יָשַׁע表示救援、解救；“必”清楚表达此处的将来结果，同时保留“拯救”的神学回响。
- source_word: מִיַּד פְּלִשְׁתִּים
  choice: 从非利士人手中
  rationale: 直译“手”的权势意象；这一说法在现代汉语中仍自然可懂。
- source_word: כִּי רָאִיתִי אֶת עַמִּי
  choice: 因为我已经看见我的百姓
  rationale: 保留רָאָה的直接措辞及上帝留意其百姓的含义，不擅自扩充为某种特定的神学解释。
- source_word: כִּי בָּאָה צַעֲקָתוֹ אֵלָי
  choice: 他们的呼求已经达到我这里
  rationale: “达到我这里”保留原文的运动方向；中文以“他们的”自然指回集合名词“我的百姓”。
theological_decisions:
- issue: נָגִיד所指扫罗职位的表达
  choice: 统领
  alternative: 领袖；君王；王子
  rationale: 原词强调上帝所委任的治理者，但本节没有使用מֶלֶךְ“王”。“统领”既体现实际治理权，也避免把后来的王号直接带入本节；“王子”在现代汉语中容易被误解为君王之子。
- issue: צַעֲקָתוֹ中单数后缀的集体所指
  choice: 他们的呼求
  alternative: 他的呼求；它的呼求
  rationale: 希伯来语阳性单数后缀指回集合名词“我的百姓”。现代汉语用复数人称“他们的”最清楚自然，并未改变其整体性呼求。
- issue: 两个כִּי分句之间的关系
  choice: 首句译作“因为”，次句以并列说明呈现
  alternative: 两处都重复译作“因为”
  rationale: 两处כִּי均保留在因果语境中，但若汉语机械重复“因为”会显得生硬。现译文让“他们的呼求已经达到我这里”说明上帝为何已经看见百姓，同时不进一步限定两分句间的逻辑关系。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“差……到你这里”“膏立”“从……手中”等表达保留原文意象；避免文言化过重，也避免把נָגִיד直接定为“王”。所有脚注标记均置于其实际解释的词语之后。
