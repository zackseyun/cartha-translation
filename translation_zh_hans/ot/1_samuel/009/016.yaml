    rationale: “王子”在现代汉语通常指国王之子，不能作为此处表示统治者的传统译词。应改为“君”，避免错误的亲属／继承人含义。
  - severity: low
    issue: “差一个来自便雅悯境内的人到你这里”搭配略不自然。
    rationale: “差遣一个来自便雅悯境内的人到你这里”更自然，并完整保留“从便雅悯地”与“到你那里”的两个方向性成分。
