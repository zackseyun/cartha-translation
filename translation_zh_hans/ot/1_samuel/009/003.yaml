base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/003.yaml
  text: The donkeys belonging to Kish[a], Saul’s father, were lost. So Kish said to Saul his son, “Please take with you one of the young men, and get up, go[b], seek the donkeys.”
translation:
  language: zh_hans
  text: 扫罗的父亲基士的母驴走失了。基士就对儿子扫罗说：“请你带上一个年轻人[a]，动身去找那些母驴。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “年轻人”也可译作“仆人”或“随从”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאבַדְנָה
  choice: 走失了
  rationale: 此处 אבד 表示牲畜不见了；“走失了”符合现代汉语叙事，也不暗示它们已经死亡。
- source_word: הָאֲתֹנוֹת
  choice: 母驴
  rationale: 希伯来语名词明确指雌驴；汉语“母驴”自然且准确，无须像英语那样省略性别。
- source_word: לְקִישׁ אֲבִי שָׁאוּל
  choice: 扫罗父亲基士的
  rationale: 介词 לְ 在此表示所属关系；按自然汉语重组为领属结构，同时保留基士是扫罗父亲这一信息。
- source_word: קַח נָא אִתְּךָ
  choice: 请你带上
  rationale: “带上”自然表达“带着与你同去”；“请”体现 נָא 对命令语气的缓和作用。
- source_word: אַחַד מֵהַנְּעָרִים
  choice: 一个年轻人
  rationale: נְעָרִים 的基本意思是年轻男子，在具体语境中也可指仆人或随从。正文采用较少解释性的译法，并以脚注保留语境性译法。
- source_word: וְקוּם לֵךְ
  choice: 动身去
  rationale: 两个连续的命令词直译为“起来，去”；“动身去”以自然现代汉语表达立即起身前往的整体动作。
- source_word: בַּקֵּשׁ
  choice: 找
  rationale: בקש 在此指寻找走失的牲畜；“找”简明自然，符合实际行动语境。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。叙事开头不增添原文没有的“那时”或“现在”；对白保留请求式命令的语气，并避免把 נְעָרִים 的社会身份在正文中过度确定。
