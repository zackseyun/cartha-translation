base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/007.yaml
  text: Then Saul said to his young man[a], “But look, if we go, what will we bring to the man? For the bread is gone from our bags, and there is no gift to bring to the man of God[b]. What do we have?”
translation:
  language: zh_hans
  text: 扫罗对他的年轻随从[a]说：“可是你看，如果我们去，要拿什么给那人呢？我们袋子里的饼已经用完了[b]，也没有礼物[c]可以带给神人。我们还有什么呢？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “年轻随从”也可译作“年轻人”；原词可兼指年轻人和服侍主人的随从。
    reason: lexical_alternative
  - marker: b
    text: 直译“饼已经从我们的器具（或容器）中用尽了”。
    reason: lexical_alternative
  - marker: c
    text: “礼物”也可译作“赠礼”，指带给受尊敬之人的东西。
    reason: lexical_alternative
lexical_decisions:
- source_word: נַעַר
  choice: 年轻随从
  rationale: 该词既可指年轻人，也可指随从；结合本段人物关系译作“年轻随从”，同时保留年龄与身份两方面的含义。
- source_word: וְהִנֵּה
  choice: 可是你看
  rationale: 该表达既引人注意，也在此引出扫罗的实际顾虑；“可是你看”符合现代汉语对话语气。
- source_word: נֵלֵךְ
  choice: 我们就算去了
  rationale: 在上下文中带有假设意味；这样译能自然衔接随后“要拿什么”的疑问。
- source_word: נָּבִיא
  choice: 拿……给
  rationale: 这是 בוא 的使役形，在此指把某物带去给人；汉语“拿什么给那人”自然传达此意。
- source_word: לֶחֶם
  choice: 饼
  rationale: 保留希伯来文具体的食物名称，而不泛化为“食物”或“干粮”。
- source_word: כְּלִי
  choice: 袋子
  rationale: 该词本义为器具或容器；在旅途中盛放食物的语境下，“袋子”具体而自然。
- source_word: אָזַל
  choice: 已经吃完了
  rationale: 该动词表示耗尽；结合饼这一宾语，“吃完了”是自然汉语，也明确表达供应已耗尽。
- source_word: תְּשׁוּרָה
  choice: 礼物
  rationale: 指带给受尊敬之人的赠礼；“礼物”清楚自然，并避免“供物”可能带来的祭祀含义。
- source_word: אִישׁ הָאֱלֹהִים
  choice: 神人
  rationale: 保留希伯来文对受神差遣者的固定称号，不将其直接改释为“先知”。
- source_word: מָה אִתָּנוּ
  choice: 我们还有什么呢
  rationale: 这一习语询问他们身边还有什么可用之物；“还有”也自然呼应前文食物和礼物都已没有。
theological_decisions:
- issue: אִישׁ הָאֱלֹהִים 的称号
  choice: 神人
  alternative: 先知
  rationale: 原文使用“神人”这一称号，而非通常表示“先知”的 נָבִיא；直译可保留叙事用词及其神学称谓，不把两者无声合并。
translation_notes:
  register: 采用现代、庄重而口语自然的叙事语言。“可是你看”体现对话中的实际顾虑；“神人”保留传统且准确的称号。避免使用过于古雅的“看哪”和可能暗示祭祀的“供物”。
