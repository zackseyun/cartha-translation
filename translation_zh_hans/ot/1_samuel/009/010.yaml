base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/010.yaml
  text: Then Saul said to his young man[a], “Your word is good. Come[b], let us go.” So they went to the city where the man of God was.
translation:
  language: zh_hans
  text: 扫罗对他的年轻随从说：“你说得好[a]。来，我们走吧！”于是，他们往神人[b]所在的那座城去了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“你的话是好的”，意思是“你所说的很好”。
    reason: lexical_alternative
  - marker: b
    text: “神人”是希伯来文中的一种称号，通常指先知或替神说话的人。
    reason: cultural_note
lexical_decisions:
- source_word: נַעַר
  choice: 年轻随从
  rationale: 该词基本义可指年轻人；本段语境又表明此人是陪同扫罗、地位从属的随从。“年轻随从”兼顾年龄含义与叙事角色，避免仅译“仆人”而过度限定身份。
- source_word: טוֹב דְּבָרְךָ
  choice: 你说得好
  rationale: 原文直译近于“你的话是好的”，实际是在赞同随从上一节所提的建议。“你说得好”是自然的现代汉语，也保留了对其话语的肯定。
- source_word: לְכָה נֵלֵכָה
  choice: 来，我们走吧
  rationale: 原文由带命令意味的形式与表劝勉、共同意愿的形式组成；此译保留邀请对方一同行动的语气。
- source_word: הָעִיר
  choice: 那座城
  rationale: עִיר可指城或城镇；此处带定冠词，并承接上文已提到的城，因此译作“那座城”。
- source_word: אִישׁ הָאֱלֹהִים
  choice: 神人
  rationale: 这是希伯来文对属神并代神发言之人的固定称谓，常用于先知。“神人”保留原文称号，不直接以解释性的“先知”取代。
- source_word: אֲשֶׁר שָׁם
  choice: 就在那里
  rationale: 原结构表达“……所在之处”。拆成分号后的“神人就在那里”，在现代汉语中自然，并准确交代那座城是神人所在之地。
theological_decisions:
- issue: 如何翻译 אִישׁ הָאֱלֹהִים 这一称号
  choice: 神人
  alternative: 先知
  rationale: 该称号在希伯来圣经中通常指先知或代表神发言的人，但本节使用的是“神人”这一称号。直译可保留原文的神学措辞，同时用脚注说明其通常所指，避免在正文中消除称号与职分之间的区别。
translation_notes:
  register: 采用现代、庄重而通顺的叙事语言。“年轻随从”兼顾人物年龄与从属角色；“你说得好”和“我们走吧”符合现代口语，同时不失经文语体。分号使末句自然清晰，并保留原文“神人在那里”的陈述重点。
