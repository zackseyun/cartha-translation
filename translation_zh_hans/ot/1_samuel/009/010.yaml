  source_fidelity: 译文准确传达扫罗赞同随从的建议、邀请同行，以及二人前往神人所在之城的叙事。惟“于是，他们往那座城去；神人就在那里”将原文的关系结构拆为两句，虽不致误译，却可能使“在那里”的指向略显松散。将其合并为“神人所在的那座城”，更直接保留原文“到……神人所在的城”的修饰关系。
  naturalness: “你说得好。来，我们走吧！”自然、现代，也适合叙事引语。“年轻随从”在本段可兼顾נַעַר的年龄基本义和陪从角色。修订后的末句更紧凑顺畅。
  terminology: “神人”恰当保留אִישׁ הָאֱלֹהִים这一称号，而不以“先知”替代。脚注对其通常用法的说明合宜；“替神说话的人”较“代表神发言的人”更自然，且不增加职分含义。
