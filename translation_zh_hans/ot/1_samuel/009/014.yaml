base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/014.yaml
  text: So they went up to the city. As they were entering the city[a], behold, Samuel was coming out to meet them, to go up to the high place.
translation:
  language: zh_hans
  text: 他们就上到城里去。他们正进城的时候[a]，看哪，撒母耳正出来迎接他们，要上丘坛去。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们正在城中来着。”希伯来原文作“他们正在城中（城的当中）来”；这空间表达可按上下文理解为正进入城内，或已身在城中。
    reason: 保留בְּתוֹךְ הָעִיר的字面空间表达及其语境歧义，且不加入原文未说明的“走着”。
  - marker: b
    text: “丘坛”指古代的高处祭祀场所。
    reason: 说明בָּמָה为祭祀场所，而非普通土丘或单一祭坛。
lexical_decisions:
- source_word: וַיַּעֲלוּ הָעִיר
  choice: 他们上到城里
  rationale: עלה保留向上行进的方向感；“上到城里”在现代汉语中自然，也反映该城地势较高。עיר在此可指城或镇，译作“城”符合叙事惯例。
- source_word: הֵמָּה בָּאִים בְּתוֹךְ הָעִיר
  choice: 他们正进城的时候
  rationale: 独立代词加分词表达正在进行的动作；בְּתוֹךְ הָעִיר直译为“在城中／城的当中”，上下文也可自然理解为正在进入城内，因此正文采用流畅的“正进城的时候”，并以脚注保留字面空间表达。
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: הִנֵּה用于吸引读者注意突然出现或重要的景象；“看哪”保留其鲜明的叙事提示作用。
- source_word: יֹצֵא לִקְרָאתָם
  choice: 出来迎着他们
  rationale: יֹצֵא是分词，呈现撒母耳正在出来；לִקְרָאתָם表示朝向他们、与他们相遇。“出来迎着他们”兼顾动作状态与方向。
- source_word: לַעֲלוֹת הַבָּמָה
  choice: 正要上丘坛去
  rationale: לַעֲלוֹת是不定式，说明撒母耳出来的目的；בָּמָה指设在高处或称为“高处”的敬拜场所。“丘坛”保留古代以色列宗教场所这一历史类别，而不预先加入褒贬判断。
theological_decisions:
- issue: 祭祀场所בָּמָה的译法
  choice: 丘坛
  alternative: 高处的祭祀场所／高地圣所
  rationale: “丘坛”是简洁而有历史感的术语，能表达古代以色列的特定敬拜场所；不译成单纯的“祭坛”，以免把整个场所缩窄为其中的坛，也不在本节加入后期经文对某些丘坛的评价。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“于是”承接上文，“看哪”保留希伯来叙事的现场感；整体维持原文短促推进的节奏。
