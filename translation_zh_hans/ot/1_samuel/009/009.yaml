  text: לְ/פָנִ֣ים בְּ/יִשְׂרָאֵ֗ל כֹּֽה אָמַ֤ר הָ/אִישׁ֙ בְּ/לֶכְתּ/וֹ֙ לִ/דְר֣וֹשׁ אֱלֹהִ֔ים לְכ֥וּ וְ/נֵלְכָ֖ה עַד הָ/רֹאֶ֑ה כִּ֤י לַ/נָּבִיא֙ הַ/יּ֔וֹם יִקָּרֵ֥א לְ/פָנִ֖ים הָ/רֹאֶֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/009.yaml
  text: Formerly in Israel[a], when a man went to inquire of God, he would say, “Come, and let us go to the seer,” for the prophet of today was formerly called the seer.
translation:
  language: zh_hans
  text: 从前在以色列[a]，人去求问上帝时，会说：“来吧，我们到先见那里去。”因为今日所称的“先知”，从前称为“先见”。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“以色列从前有人去寻求上帝时，会说：‘来吧，我们到先见那里去。’”
    reason: 原文开头的时间语和地点语在汉语中可有不同组合与停顿方式；本译文按旧时以色列惯例来表达，脚注保留另一种自然措辞，并呈现“求问／寻求”的词义幅度。
lexical_decisions:
- source_word: לְפָנִים
  choice: 从前
  rationale: 表示过去较早时期的时间副词；两处均译为“从前”，保留首尾呼应。
- source_word: כֹּה אָמַר
  choice: 会说
  rationale: 在叙述旧时惯例的语境中表示反复发生的习惯性言语；“会说”比逐字的“如此说”更符合现代汉语。
- source_word: הָאִישׁ
  choice: 人
  rationale: 此处阳性单数用于泛指，并非某个特定男子；现代汉语用“人”即可自然保留泛指意义。
- source_word: לִדְרֹשׁ אֱלֹהִים
  choice: 求问上帝
  rationale: 本语境指借先见寻求来自上帝的指示；“求问”兼具寻求与询问之意，又不额外规定求问的具体方式。
- source_word: לְכוּ וְנֵלְכָה
  choice: 来吧，我们……去
  rationale: 分别体现复数命令式与劝勉式，在自然汉语中保留共同前往的邀请语气。
- source_word: הָרֹאֶה
  choice: 先见
  rationale: 这是早期对相关人物的称号，字面与“看见”有关；“先见”是简洁且通行的圣经汉语称谓，也能与“先知”形成术语对照。
- source_word: לַנָּבִיא הַיּוֹם יִקָּרֵא
  choice: 今日所称的“先知”
  rationale: 按希伯来语被动结构表达叙述者时代的称呼，同时用“今日”与“从前”构成明确对比。
- source_word: עַד הָרֹאֶה
  choice: 到先见那里去
  rationale: עַד在此表示行动所趋向的人；汉语加“那里”可自然表达前往某人所在之处。
theological_decisions:
- issue: 如何表达 הָאִישׁ 的阳性单数泛指
  choice: 人
  alternative: 一个男子
  rationale: 上下文说明一般性的旧日习惯，并非强调性别；汉语“人”能准确、自然地表达泛指，不扩大也不缩小原文所指。
- issue: 如何理解 דָּרַשׁ אֱלֹהִים
  choice: 求问上帝
  alternative: 寻求上帝
  rationale: 上下文明确提到前往先见，因此这里侧重寻求神谕或指示。“求问”保留咨询意味，同时不引入关于先知职分的额外教义判断。
- issue: “先知”与“先见”的关系
  choice: 保留两个不同称号，并按原文说明时代用语的变化
  alternative: 将两者统一译作“先知”
  rationale: 经文自身旨在解释称号变迁；统一术语会抹去这项历史说明。译文不进一步断言两个称号在所有时期或所有语境中完全等同。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。“先见”作为历史称号予以保留，并用引号突出本节对“先知”和“先见”两个名称的解释；直接引语使用自然的劝同行语气。
