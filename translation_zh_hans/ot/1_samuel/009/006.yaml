  text: וַ/יֹּ֣אמֶר ל֗/וֹ הִנֵּה נָ֤א אִישׁ אֱלֹהִים֙ בָּ/עִ֣יר הַ/זֹּ֔את וְ/הָ/אִ֣ישׁ נִכְבָּ֔ד כֹּ֥ל אֲשֶׁר יְדַבֵּ֖ר בּ֣וֹא יָב֑וֹא עַתָּה֙ נֵ֣לֲכָה שָּׁ֔ם אוּלַי֙ יַגִּ֣יד לָ֔/נוּ אֶת דַּרְכֵּ֖/נוּ אֲשֶׁר הָלַ֥כְנוּ עָלֶֽי/הָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/006.yaml
  text: He said to him, “Look now, there is a man of God in this city, and the man is held in honor; everything that he says surely comes to pass. Now let us go there. Perhaps he will tell us the way we should go.”
translation:
  language: zh_hans
  text: 他对他说：“你看，这城里有一位神人。这人备受尊敬；凡他说的，都必定应验。现在我们到那里去吧，或许他会告诉我们，此行的路该怎么走。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“我们所走在其上的路”；在这里可指此行应走的路线，或此行该如何继续进行。
    reason: 保留原文较不寻常的“我们所走的路”措辞所带来的开放性，同时避免把含义无依据地扩展为行程结果。
lexical_decisions:
- source_word: אִישׁ אֱלֹהִים
  choice: 神人
  rationale: 这是希伯来圣经对奉上帝之名说话之人的固定称谓；“神人”简洁庄重，也保留其角色含义，不将其直接窄化为“先知”。
- source_word: נִכְבָּד
  choice: 备受尊敬
  rationale: 该词表示有分量、受尊重；结合语境，译作“备受尊敬”比直译“尊贵”更自然。
- source_word: בּוֹא יָבוֹא
  choice: 都必定应验
  rationale: 同词根不定式绝对形与限定动词连用，起加强语气的作用；这里指所说之事确实发生，因此译为“必定应验”。
- source_word: דַּרְכֵּנוּ אֲשֶׁר הָלַכְנוּ עָלֶיהָ
  choice: 此行的路该怎么走
  rationale: 原文以“我们的路”指当前行程，并用“我们已经走在其上”的关系从句加以说明。中文以“此行的路”表达语境，同时保留对行进方向或行程结果的开放性。
theological_decisions:
- issue: “神人”的身份是否直接解释为先知
  choice: 保留“神人”
  alternative: 译作“先知”
  rationale: 原文使用 אִישׁ אֱלֹהִים，而非 נָבִיא；保留原称谓可避免把相关概念完全等同。
- issue: 神人所说之话的可靠性
  choice: “凡他说的，都必定应验”
  alternative: “他说什么都一定会实现”
  rationale: 所述是仆人对该神人的评价；译文不额外说明其话语能力的神学机制，只忠实呈现强调语气。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“你看”“现在我们到那里去吧”保留仆人劝说时的现场感；标点和引语符合现代简体中文规范。
