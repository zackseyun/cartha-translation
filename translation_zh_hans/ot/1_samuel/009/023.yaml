  text: Then Samuel said to the cook[a], “Bring the portion that I gave you, of which I said to you, ‘Set it aside with you.’”
translation:
  language: zh_hans
  text: 撒母耳对厨子说：“把我给你的那一份拿来，就是我曾对你说：‘把它留在你那里。’的那一份。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: טַּבָּח
  choice: 厨子
  rationale: 该词可指屠宰或料理肉食的人；在宴席中，此人负责保管并端上预留的肉，因此译作“厨子”最符合语境，也自然易懂。
- source_word: תְּנָה
  choice: 拿来
  rationale: 字面义为“给”，但这里是吩咐厨子把先前留下的食物端来；“拿来”准确表达该语境中的命令语气。
- source_word: מָּנָה
  choice: 那一份
  rationale: 指分配给人的一份食物。“那一份”既体现特定、预留的份额，又符合现代汉语宴席语境。
- source_word: אֲשֶׁר נָתַתִּי לָךְ
  choice: 我交给你的
  rationale: נָתַתִּי 基本义是“我给了”；这里食物是交由厨子暂时保管，并非给他享用，故“交给”保留动词本义而避免误解。
- source_word: אֲשֶׁר אָמַרְתִּי אֵלֶיךָ
  choice: 就是我曾吩咐你的
  rationale: 原文第二个关系从句继续限定同一份食物。结合后接的命令引语，译作“吩咐”比泛泛的“说”更符合语用功能。
- source_word: שִׂים אֹתָהּ עִמָּךְ
  choice: 留在你那里
  rationale: 字面为“把它放在你那里／与你同在”。在上下文中指让厨子把该份食物保留在身边，以后端上；“留在你那里”兼顾原文措辞和实际含义。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“就是……的那一份”重现希伯来文连续关系从句的限定作用，同时避免生硬直译；本节没有必须以脚注保留的神学或文本歧义。
