base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/020.yaml
  text: And as for the donkeys that were lost to you three days ago[a], do not set your heart on them, for they have been found[b]. And for whom is all the desire of Israel? Is it not for you and for all your father's house?
translation:
  language: zh_hans
  text: 至于你三天前走失的那些母驴，不必挂心，它们已经找到了。以色列一切所羡慕的[a]，又是为了谁呢？不正是为了你和你父家[b]吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “以色列一切所羡慕的”也可译作“以色列中一切珍贵、可羡慕的事物”。原文既可指以色列所渴望的，也可指以色列中珍贵或可羡慕之物。
    reason: lexical_alternative
  - marker: b
    text: “父家”是古代以父系为中心的家庭或宗族单位，范围通常比现代所说的核心家庭更广。
    reason: cultural_note
lexical_decisions:
- source_word: אֲתֹנוֹת
  choice: 母驴
  rationale: 该名词明确指雌性的驴；现代汉语“母驴”自然准确，且保留原文信息。
- source_word: הָאֹבְדוֹת
  choice: 走失的
  rationale: 分词表示这些母驴处于失踪、遗失的状态；“走失”适合牲畜，也符合现代汉语叙事。
- source_word: הַיּוֹם שְׁלֹשֶׁת הַיָּמִים
  choice: 三天前
  rationale: 这是希伯来语的时间表达，指事情发生在三天以前；按现代汉语习惯译为“三天前”。
- source_word: אַל תָּשֶׂם אֶת־לִבְּךָ לָהֶם
  choice: 不要再挂心
  rationale: 原文直译为“不要把你的心放在它们上面”，意思是不要继续为它们操心；“不要再挂心”既自然，又保留“心”所表达的关注意味。
- source_word: נִמְצָאוּ
  choice: 已经找到了
  rationale: 尼法勒完成式表达被动及结果状态，即母驴已经被人找到。
- source_word: וּלְמִי כָּל חֶמְדַּת יִשְׂרָאֵל
  choice: 以色列一切所羡慕的，又归谁呢
  rationale: חֶמְדַּת 可指所渴望、所珍爱的，也可指可羡慕、珍贵之物；正文采用简洁而略带开放性的表达，并以脚注保留另一种理解。
- source_word: הֲלוֹא
  choice: 不正是……吗
  rationale: 该疑问词引出期待肯定回答的反问；此译法自然保留其修辞力量。
- source_word: לְךָ וּלְכֹל בֵּית אָבִיךָ
  choice: 归你和你父家所有
  rationale: 介词 לְ 在本句中表达归属或指向；“父家”保留古代以父系为中心的家族社会单位，脚注说明其范围。
theological_decisions:
- issue: “以色列一切所羡慕的”的具体所指
  choice: 保留为含义较开放的修辞问句，不在正文中明确补出王权或王位
  alternative: 明确译为“以色列所渴望的王权”，或理解为“以色列所有珍贵之物”
  rationale: 上下文预示扫罗将被立为领袖，但本节本身并未明说王权；חֶמְדַּת 的词义也可在“所渴望的”与“珍贵之物”之间摆动，因此不应在正文中消除这种神学与修辞张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“母驴”准确保留原文性别信息；“不要再挂心”自然传达希伯来语以“心”表示关注的惯用语。“父家”保留古代社会称谓并辅以脚注。脚注标记均在正文出现；[a]置于完整问答之后以说明该整句中的歧义，[b]紧随“父家”之后。
