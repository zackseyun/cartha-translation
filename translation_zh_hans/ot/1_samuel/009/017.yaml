  text: וּ/שְׁמוּאֵ֖ל רָאָ֣ה אֶת שָׁא֑וּל וַ/יהוָ֣ה עָנָ֔/הוּ הִנֵּ֤ה הָ/אִישׁ֙ אֲשֶׁ֣ר אָמַ֣רְתִּי אֵלֶ֔י/ךָ זֶ֖ה יַעְצֹ֥ר בְּ/עַמִּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/017.yaml
  text: When Samuel saw Saul[a], Yahweh answered him, “Look, this is the man of whom I spoke to you. This one shall rule over my people.”
translation:
  language: zh_hans
  text: 撒母耳看见扫罗时，雅威回答他：“看，这就是我对你说过的那个人；这人必治理我的百姓。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这人必约束（或管束）我的百姓。”希伯来语动词可表示约束、控制，也可在这里指治理。
    reason: 保留יַעְצֹר较为字面的词义及其在王权语境中的歧义。
lexical_decisions:
- source_word: רָאָה
  choice: 看见
  rationale: 此处表示直接的视觉感知；“看见”符合现代汉语叙事表达。
- source_word: וַיהוָה
  choice: 雅威
  rationale: 直接音译经文中的神圣名字יהוה，以保留其专名性质。
- source_word: עָנָהוּ
  choice: 回答他说
  rationale: 保留ענה“回答、回应”的基本含义；虽然本节没有写出撒母耳先前的提问，上文却有雅威先前向他启示的背景。
- source_word: הִנֵּה
  choice: 看
  rationale: 作为引人注意的指示词，“看”简洁自然，也保留原文现场指认的语气。
- source_word: הָאִישׁ אֲשֶׁר אָמַרְתִּי אֵלֶיךָ
  choice: 我对你说过的那个人
  rationale: 自然表达关系从句，并明确这是雅威先前向撒母耳提到的人。
- source_word: זֶה
  choice: 这就是
  rationale: 保留指示词的强调和现场指认作用，同时符合现代汉语习惯。
- source_word: יַעְצֹר
  choice: 治理
  rationale: עצר可表示约束、控制；在扫罗被指定为领袖的语境中，“治理”能自然传达其施行管治权的含义，同时在脚注保留较为字面的可能性。
- source_word: בְּעַמִּי
  choice: 我的百姓
  rationale: 与“治理”搭配时，介词ב所标示的是其施行权柄的对象或范围；汉语中无需另译介词。
theological_decisions:
- issue: 神圣名字יהוה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较贴近通常所重建的发音，并保留其作为专名的性质。
- issue: יַעְצֹר与扫罗王权的关系
  choice: 治理我的百姓
  alternative: 约束／管束我的百姓
  rationale: 王权语境支持“治理”的功能性含义，但动词本身仍带约束、控制的词义范围，因此不把这一层张力从脚注中抹去。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“回答他说”略带经文叙事色彩，但仍易懂，并比单译“对他说”更忠实于原文ענה。脚注标记置于其实际说明的“治理我的百姓”之后。
