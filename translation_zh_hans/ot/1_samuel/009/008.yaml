base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/008.yaml
  text: The young man answered Saul again and said[a], “Look, I have in my hand a quarter shekel of silver. I will give it to the man of God, and he will tell us our way.”
translation:
  language: zh_hans
  text: 仆人又回答扫罗说：“你看，我手里有四分之一舍客勒银子；我就把它给神人，他会告诉我们该走的路[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我们该怎么办。”希伯来文直译为“我们的路”，既可指前面的路线，也可指应当采取的行动。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּסֶף הַנַּעַר לַעֲנוֹת
  choice: 仆人又回答
  rationale: יסף加不定式表达再次或继续做某事；这里承接扫罗先前的异议，译作“又回答”自然。נער在上下文中明确是扫罗的随从，现代汉语用“仆人”比“年轻人”更清楚地交代其身份。
- source_word: הִנֵּה
  choice: 你看
  rationale: 这是引人注意的指示语；“你看”符合现代口语叙事，又保留其提示作用。
- source_word: נִמְצָא בְיָדִי
  choice: 我手里还有
  rationale: 希伯来语直译为“在我手中被找到/现有”；结合上文谈到没有礼物，“我手里还有”自然表达现存和持有之意。
- source_word: רֶבַע שֶׁקֶל כָּסֶף
  choice: 四分之一舍客勒银子
  rationale: 保留原文以重量计值的货币表达；“舍客勒”音译单位，“四分之一”准确表达רבע。
- source_word: וְנָתַתִּי
  choice: 我可以把它送给
  rationale: 该完成式在语境中表达随从所提议、愿意采取的行动；“可以”贴合汉语对方案的自然陈述，并避免误读为已发生。
- source_word: לְאִישׁ הָאֱלֹהִים
  choice: 神人
  rationale: 这是对先知或受神差遣者的固定称谓；“神人”是简洁且传统清楚的汉语对应。
- source_word: וְהִגִּיד לָנוּ אֶת דַּרְכֵּנוּ
  choice: 他就会告诉我们该走的路
  rationale: נגד的使役式意为告诉、使人知道；“我们的路”既可能指实际路线，也可能指应采取的行动，正文采用自然汉语“该走的路”，并以脚注说明其双重可能。
theological_decisions: []
