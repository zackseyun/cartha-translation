base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/005.yaml
  text: When they came into the land of Zuph[a], Saul said to his young man who was with him, “Come, let us return[b], lest my father stop caring about the donkeys and become anxious about us.”
translation:
  language: zh_hans
  text: 他们来到苏弗地时，扫罗对同他在一起的年轻人说：“来，我们回去吧，免得我父亲不再挂念那些母驴，反倒为我们担忧。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּאוּ בְּאֶרֶץ צוּף
  choice: 来到苏弗地
  rationale: בוא与介词ב连用，在此表示进入并到达一个地区；“来到苏弗地”符合现代汉语，也保留地名。
- source_word: נַעֲרוֹ אֲשֶׁר עִמּוֹ
  choice: 跟随他的年轻人
  rationale: נַעַר基本义为“年轻人”，语境也显示此人是扫罗的随行者；避免直接译作“仆人”而过度限定其身份。
- source_word: לְכָה וְנָשׁוּבָה
  choice: 来，我们回去吧
  rationale: 命令式לְכָה与鼓励式נָשׁוּבָה共同表达邀约、劝行的语气；“回去吧”自然传达这一力量。
- source_word: פֶּן
  choice: 免得
  rationale: פֶּן引出说话者所担心发生的结果；“免得”准确而简洁。
- source_word: יֶחְדַּל ... מִן הָאֲתֹנוֹת
  choice: 不再挂念那些母驴
  rationale: 字面为“停止／离开那些母驴”，是停止以其为关注对象之意；“不再挂念”保留关注转移的语义，又符合汉语表达。
- source_word: וְדָאַג לָנוּ
  choice: 反倒为我们担忧
  rationale: דאג表示忧虑、担心，לָנוּ指出忧虑的对象；“反倒”清楚呈现父亲的忧虑从母驴转向二人的对比。
