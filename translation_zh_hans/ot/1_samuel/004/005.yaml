  text: וַ/יְהִ֗י כְּ/ב֨וֹא אֲר֤וֹן בְּרִית יְהוָה֙ אֶל הַֽ/מַּחֲנֶ֔ה וַ/יָּרִ֥עוּ כָל יִשְׂרָאֵ֖ל תְּרוּעָ֣ה גְדוֹלָ֑ה וַ/תֵּהֹ֖ם הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/005.yaml
  text: When the ark of the covenant of Yahweh came into the camp[a], all Israel shouted with a great shout, and the earth resounded.
translation:
  language: zh_hans
  text: 雅威的约柜进入营中时，以色列众人就发出极大的呼声，大地也随之轰鸣。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“大地也震动了。”希伯来语动词既可表示喧腾、震响，也可表示震颤；正文译作“轰鸣”，避免在经文未明确说明时断定这里发生了地震。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּבוֹא
  choice: ……进入……时
  rationale: 这一叙事结构引出时间从句；译为“……时”既自然，也保留“当……来到”的时间关系，无须生硬译出“事情发生了”。
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: 雅威的约柜
  rationale: “约柜”是现代汉语圣经语境中对“约的柜”的通行表达；“雅威的”保留原文结构中此约属于雅威的关系。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译呈现四字神名，保留其作为以色列之神专名的性质，而不以“主”这一称号代替。
- source_word: הַמַּחֲנֶה
  choice: 营中
  rationale: 在军事叙事中，“营”简洁自然；“进入营中”准确表达进入营地范围。
- source_word: וַיָּרִיעוּ ... תְּרוּעָה גְדוֹלָה
  choice: 发出极大的呼声
  rationale: 原文以同根名词加强动词，表示众人发出强烈而响亮的喊声。“呼声”不把它过度限定为欢呼、战吼或喝彩。
- source_word: וַתֵּהֹם
  choice: 随之轰鸣
  rationale: 该动词可描述喧腾、震响或震动。“轰鸣”在此自然表现巨大呼声令大地回响的效果，同时不武断地断定发生了地震。
- source_word: הָאָרֶץ
  choice: 大地
  rationale: 这里指承受并回应巨大声响的地面或大地，而非政治意义上的国土；“大地”与“轰鸣”搭配自然。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。译作“雅威”保留其专名性质；“主”会以称号取代名字，“耶和华”则反映较晚形成的传统混合读法。
- issue: 以色列呼喊的性质
  choice: 呼声
  alternative: 欢呼；战吼
  rationale: 上下文可能使人理解为欢呼或战斗呐喊，但本节所用词本身主要表示响亮的呼喊。采用较宽泛的“呼声”，避免把动机和情绪解释得过于确定。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“极大的呼声”略带原文式的力度，保留同根动词与名词所产生的强调；脚注标记紧随存在词义歧义的“轰鸣”之后。
