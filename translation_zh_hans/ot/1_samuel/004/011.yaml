  text: 上帝的约柜被掳去了；以利的两个儿子何弗尼和非尼哈也死了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲרוֹן אֱלֹהִים
  choice: 上帝的约柜
  rationale: 该结构短语指属于上帝的约柜；用“上帝的约柜”既准确，也符合现代汉语习惯，并保留庄重语气。
- source_word: נִלְקָח
  choice: 被掳去了
  rationale: 这是לקח的尼פעל完成式，在战败语境中表示约柜落入敌手。“被掳去了”比泛泛的“被拿走”更能体现军事俘获的含义。
- source_word: וּשְׁנֵי בְנֵי עֵלִי
  choice: 以利的两个儿子
  rationale: 原文所指是上下文已经明确的以利二子；此译法自然体现其特指性。
- source_word: מֵתוּ
  choice: 死了
  rationale: מות的简单词干完成式直接陈述死亡；“死了”朴素准确，不增添原文没有的画面。
- source_word: חָפְנִי וּפִינְחָס
  choice: 何弗尼和非尼哈
  rationale: 按现代中文圣经人名的通行音译处理，并保留二名作为“以利的两个儿子”的同位说明。
