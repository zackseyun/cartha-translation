  text: Eli was ninety-eight years old[a], and his eyes were fixed so that he could not see.
translation:
  language: zh_hans
  text: 以利九十八岁；他的眼目发直[a]，不能看见。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“眼目已经定住”或“僵直”；希伯来语以眼睛的状态来描述他的失明。
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן תִּשְׁעִים וּשְׁמֹנֶה שָׁנָה
  choice: 九十八岁
  rationale: 希伯来语“某某岁数之子”是表示年龄的惯用语；现代汉语自然译为“九十八岁”。
- source_word: וְעֵינָיו
  choice: 他的双眼
  rationale: 准确表达复数名词及第三人称阳性单数所属后缀；“双眼”符合现代汉语习惯。
- source_word: קָמָה
  choice: 已经凝滞
  rationale: 此处源自动词קום，描述以利双眼固定、失去活动或反应能力的状态。“凝滞”保留具体形象，又不直接用解释性的“昏花”取代原文。
- source_word: וְלֹא יָכֹל לִרְאוֹת
  choice: 不能看见
  rationale: 简明自然地表达他已无能力看见；与前句并列，也让眼睛凝滞所造成的结果在语境中清楚可见。
- source_word: וְ
  choice: 不单独译出
  rationale: 句首连接词承接上下文；汉语以直接起句更自然，无需增添“那时”或“如今”等原文没有的时间成分。
