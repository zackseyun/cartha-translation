  text: וַ/יִּֽרְאוּ֙ הַ/פְּלִשְׁתִּ֔ים כִּ֣י אָמְר֔וּ בָּ֥א אֱלֹהִ֖ים אֶל הַֽ/מַּחֲנֶ֑ה וַ/יֹּאמְרוּ֙ א֣וֹי לָ֔/נוּ כִּ֣י לֹ֥א הָיְתָ֛ה כָּ/זֹ֖את אֶתְמ֥וֹל שִׁלְשֹֽׁם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/007.yaml
  text: The Philistines were afraid[a], for they said, “God has come into the camp.” And they said, “Woe to us! For nothing like this has happened before.”
translation:
  language: zh_hans
  text: 非利士人害怕起来，因为他们说：“上帝进到营里了[a]。”他们又说：“我们有祸了！从前从未发生过这样的事。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“有一位神明进到营里了。”希伯来语“上帝”一词在形态上是复数，但与它搭配的动词是单数，因此正文译作“上帝”。
    reason: 保留非利士人话语中可能的异教视角，并说明希伯来语数的一致关系。
lexical_decisions:
- source_word: וַיִּֽרְאוּ
  choice: 害怕起来
  rationale: 动词 ירא 的叙事形式表达非利士人当下产生的惧怕；“害怕起来”自然地体现反应的发生。
- source_word: הַפְּלִשְׁתִּים
  choice: 非利士人
  rationale: 现代中文圣经及一般历史语境中通行的族名译法。
- source_word: כִּי אָמְרוּ
  choice: 因为他们说
  rationale: כִּי 在此引出他们害怕的原因；直译为“因为”清楚自然。
- source_word: בָּא אֱלֹהִים
  choice: 上帝进到……了
  rationale: בָּא 是阳性单数动词，支持把 אֱלֹהִים 理解为单数；完成性语境用“进到……了”表现其所宣称的已然进入。鉴于说话者是非利士人，“有一位神明”的可能理解以脚注保留。
- source_word: אֶל הַמַּחֲנֶה
  choice: 进到营里
  rationale: אֶל 在移动语境中表示朝向并进入；“营里”简洁地指以色列人的营地。
- source_word: אוֹי לָנוּ
  choice: 我们有祸了！
  rationale: 保留哀叹与灾祸临头的强烈语气，同时符合现代汉语表达。
- source_word: לֹא הָיְתָה כָּזֹאת
  choice: 从未发生过这样的事
  rationale: 以自然汉语表达“未曾有过像这样的事”，不拘泥于希伯来语存在句式。
- source_word: אֶתְמוֹל שִׁלְשֹׁם
  choice: 从前
  rationale: 该词组是表示以往、先前的习语，并非仅限于字面的昨天和前天；“从前”准确而凝练。
theological_decisions:
- issue: 非利士人口中的 אֱלֹהִים 如何翻译
  choice: 上帝
  alternative: 有一位神明；诸神
  rationale: 与 אֱלֹהִים 搭配的动词 בָּא 为单数，因此正文采用单数的“上帝”。但说话者是多神信仰背景下的非利士人，且 אֱלֹהִים 在形态上是复数，故以脚注保留“有一位神明”的语用可能性；“诸神”与本句单数动词的一致关系较弱。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“害怕起来”体现即时反应；“我们有祸了”保留哀叹力度；以“从前从未”表达希伯来语习语所指的以往任何时候。脚注标记置于相关引语句末。
