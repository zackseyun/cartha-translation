  source_fidelity: 译文整体准确传达了差遣、从示罗运来约柜，以及何弗尼和非尼哈与约柜同在的叙事。惟“他坐在基路伯之上”在汉语中代词指向不够明确，且“之上”把希伯来文未明说的空间关系定得过实；原文是描述耶和华为“坐在／居于基路伯（之处）的那一位”。
  naturalness: “于是”“示罗”“约柜”“万军之耶和华”均自然且符合庄重叙事语体。“与上帝的约柜同在”略显神学化，改为“和上帝的约柜在一起”更直接表达עִם的陪同关系。将神名从代词中明说，也使句子更清楚。
  terminology: “万军之耶和华”“约柜”“基路伯”“以利”“何弗尼”“非尼哈”均可保留。后一处הָאֱלֹהִים译为“上帝”恰当。
