id: 1SA.4.4
reference: 1 Samuel 4:4
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֤ח הָ/עָם֙ שִׁלֹ֔ה וַ/יִּשְׂא֣וּ מִ/שָּׁ֗ם אֵ֣ת אֲר֧וֹן בְּרִית יְהוָ֛ה צְבָא֖וֹת יֹשֵׁ֣ב הַ/כְּרֻבִ֑ים וְ/שָׁ֞ם שְׁנֵ֣י בְנֵֽי עֵלִ֗י עִם אֲרוֹן֙ בְּרִ֣ית הָ/אֱלֹהִ֔ים חָפְנִ֖י וּ/פִֽינְחָֽס־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/004.yaml
  text: So the people sent to Shiloh[a], and they carried from there the ark of the covenant of Yahweh of hosts, who is enthroned above the cherubim. And the two sons of Eli, Hophni and Phinehas[b], were there with the ark of the covenant of God.
translation:
  language: zh_hans
  text: 于是百姓派人到示罗，从那里抬来万军之耶和华的约柜；耶和华坐在基路伯之间[a]。以利的两个儿子何弗尼和非尼哈也在那里，和上帝的约柜在一起。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译作“坐在基路伯（之处）的”；也可译作“坐在基路伯之上”或“在基路伯之间坐着为王”。原文未明确说明空间关系。
    reason: 保留יֹשֵׁב הַכְּרֻבִים在空间关系及王权意涵上的歧义。
lexical_decisions:
- source_word: וַיִּשְׁלַח הָעָם שִׁלֹה
  choice: 于是百姓派人到示罗
  rationale: 原文未明说所派对象，但汉语“派人到”自然表达差遣行动，也避免生硬的“派到示罗”。“于是”承接上下文叙事。
- source_word: וַיִּשְׂאוּ מִשָּׁם
  choice: 从那里抬来
  rationale: נשא在此指实际搬运约柜；“抬来”既保留负重搬运的具体含义，也符合约柜由人抬运的语境。
- source_word: אֲרוֹן בְּרִית
  choice: 约柜
  rationale: “约柜”是简明、透明且已广为理解的现代汉语固定译法，表达与圣约相关的柜。
- source_word: יְהוָה צְבָאוֹת
  choice: 万军之耶和华
  rationale: 保留神名“耶和华”，并以汉语传统而自然的“万军之”表达צְבָאוֹת的广泛军旅/众军含义，不限定为地上的军队。
- source_word: יֹשֵׁב הַכְּרֻבִים
  choice: 他坐在基路伯之上
  rationale: יֹשֵׁב字面为“坐着/居于”，在此具有王权临在的意涵；正文以较少解释性的“坐在”保留原文张力。“之上”符合约柜图像，但空间关系仍有歧义，故加注。
- source_word: שְׁנֵי בְנֵי עֵלִי
  choice: 以利的两个儿子
  rationale: 按自然现代汉语表达原文的属格结构。
- source_word: עִם אֲרוֹן בְּרִית הָאֱלֹהִים
  choice: 与上帝的约柜同在
  rationale: עִם基本义为“与……同在/一起”；不把它缩窄为特定的空间位置。
- source_word: חָפְנִי וּפִינְחָס
  choice: 何弗尼和非尼哈
  rationale: 采用现代中文圣经语境中易识别的人名音译。
theological_decisions:
- issue: 神名及称号יְהוָה צְבָאוֹת的表达
  choice: 万军之耶和华
  alternative: 耶和华军队之主；万军之雅威
  rationale: 正文保留专有神名而不以“主”替代；“万军”保持称号所含的宽广范围，不武断限定为人间军队。
- issue: יֹשֵׁב הַכְּרֻבִים是否明确译作登基坐着
  choice: 他坐在基路伯之上
  alternative: 他在基路伯之上坐着为王；他坐在两个基路伯之间
  rationale: 该表达确有君王登基的神学意象，但单词本身也可表示坐着或居于。正文避免添加“为王”，并以脚注交代“之间/之上”以及“坐着为王”的可能表达。
- issue: 重复称呼约柜时使用“上帝”
  choice: 上帝的约柜
  alternative: 神的约柜
  rationale: הָאֱלֹהִים在此明确指以色列的上帝。使用“上帝”是普通现代汉语中庄重且清楚的单数称呼，不把它误解为众神。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“抬来”具体呈现运送约柜的动作；“与……同在”保留原文陪同关系。脚注标记[a]已在正文对应位置出现。
