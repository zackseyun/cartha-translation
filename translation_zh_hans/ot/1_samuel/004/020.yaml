base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/020.yaml
  text: And about the time of her death[a], the women standing by her said, “Do not fear, for you have borne a son.” But she did not answer, nor did she take it to heart.
translation:
  language: zh_hans
  text: 在她临死的时候，站在她身旁的妇人对她说：“不要怕，你生了一个儿子。”她没有回答，也没有把这事放在心上。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“也没有留意这话。”
    reason: 希伯来语惯用语可表示把某事放在心上，也可表示留意、关注某事；正文保留“心”的意象，脚注说明语义范围。
lexical_decisions:
- source_word: וּכְעֵת מוּתָהּ
  choice: 她临死的时候
  rationale: 该短语引出她死亡临近之际的时间背景；译作“临死的时候”自然、庄重，并保留过程性，不把表达过度限定为死亡已经发生。
- source_word: וַתְּדַבֵּרְנָה
  choice: 对她说
  rationale: 阴性复数叙事动词指在场妇人向她讲话；汉语直接引语前译作“对她说”最自然。
- source_word: הַנִּצָּבוֹת עָלֶיהָ
  choice: 站在她身旁的妇人
  rationale: 保留 נצב 的具体“站立”意象，并按语境将阴性复数明确为妇人；עליה在这里自然表达为“在她身旁”。
- source_word: אַל תִּירְאִי
  choice: 不要怕
  rationale: 准确传达否定命令，在现代汉语中简洁自然。
- source_word: כִּי בֵן יָלָדְתְּ
  choice: 你生了一个儿子
  rationale: כִּי说明安慰她的理由；“生了一个儿子”忠实传达 ילד，且符合现代汉语表达。
- source_word: וְלֹא עָנְתָה
  choice: 她却不回答
  rationale: ענה在此为“回答、回应”；“却”体现她与妇人安慰之言之间的叙事转折。
- source_word: וְלֹא שָׁתָה לִבָּהּ
  choice: 也没有把这事放在心上
  rationale: 保留“心”的希伯来语意象，同时传达 שׁית לב 的惯用含义；“这事”承接妇人关于生子的宣告。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“妇人”与历史叙事语体相称；避免用“接生婆”等原文未明确表达的身份称谓。
