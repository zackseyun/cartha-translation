  text: וַ/יִּשְׁמַ֤ע עֵלִי֙ אֶת ק֣וֹל הַ/צְּעָקָ֔ה וַ/יֹּ֕אמֶר מֶ֛ה ק֥וֹל הֶ/הָמ֖וֹן הַ/זֶּ֑ה וְ/הָ/אִ֣ישׁ מִהַ֔ר וַ/יָּבֹ֖א וַ/יַּגֵּ֥ד לְ/עֵלִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/014.yaml
  text: When Eli heard the sound of the outcry[a], he said, “What is this sound of the uproar?” And the man hurried and came and told Eli.
translation:
  language: zh_hans
  text: 以利听见呼喊声[a]，就说：“这喧嚷声是怎么回事？”那人急忙过来，把消息告诉以利。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“哀号声”或“喊叫声”。
    reason: 词语צְעָקָה可指呼喊、喊叫或带有痛苦、惊慌意味的哀号；此处上下文容许不同侧重。
lexical_decisions:
- source_word: ק֣וֹל
  choice: 声
  rationale: קוֹל可指声音、嗓音或响声；本节两次与表示呼喊和喧嚷的词连用，译作“声”自然简洁，也保留原文对听觉现象的强调。
- source_word: הַצְּעָקָה
  choice: 呼喊
  rationale: צְעָקָה指大声呼叫，常带有苦痛或惊慌的色彩；此处全城因灾难消息而发声，“呼喊”兼顾其响亮与情绪力度。
- source_word: מֶה
  choice: 是怎么回事
  rationale: 疑问词在此询问喧嚷的性质或缘由。按汉语习惯译为“是怎么回事”，比生硬的“是什么”自然，同时不限定为单问原因。
- source_word: הֶהָמוֹן
  choice: 喧嚷
  rationale: הָמוֹן在此指人群造成的嘈杂骚动；“喧嚷”既表达众声嘈杂，也符合城市因噩耗而骚动的语境。
- source_word: וְהָאִישׁ
  choice: 那人
  rationale: 原文只称“那人”，回指前文的便雅悯人；不直接译为“报信的人”，以免加入本节未明说的身份称谓。
- source_word: מִהַר
  choice: 急忙
  rationale: 该动词表示赶快、迅速行动；“急忙”是现代汉语叙事中自然且有紧迫感的表达。
- source_word: וַיָּבֹא
  choice: 过来
  rationale: 字面为“来到”；结合他来到以利面前的场景，译作“过来”符合现代汉语叙述，也避免重复使用方向不明的“来”。
- source_word: וַיַּגֵּד לְעֵלִי
  choice: 把消息告诉以利
  rationale: נגד的使役式表示告知、报告。汉语若只说“告诉以利”略显宾语内容缺失，补出语境隐含的“消息”使句子通顺，但不具体说明消息内容。
- source_word: עֵלִי
  choice: 以利
  rationale: 采用现代中文圣经传统中通行的人名译法。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“喧嚷声是怎么回事”保留原文连续两次提到“声音”的效果；“那人”忠实保留原文指称，不把其身份解释性地写入正文。
