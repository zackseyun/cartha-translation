base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/022.yaml
  text: And she said[a], “The glory has departed from Israel[b], because the ark of God has been taken.”
translation:
  language: zh_hans
  text: 她说：“荣耀已经离开以色列[a]，因为[b]神的约柜被夺去了。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“荣耀从以色列流亡而去。”希伯来语动词也可含有流亡或被移走的意思。
    reason: lexical_alternative
  - marker: b
    text: 或译：“原来神的约柜被夺去了。”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: 她说
  rationale: 未完成式连续体推进叙事；中文不必机械译出连接词，而按上下文明确保留阴性主语“她”。
- source_word: גָּלָה
  choice: 已经离开
  rationale: 该动词可指离去、被迁走或流亡；以“荣耀”为主语时，“已经离开”自然庄重，并保留从以色列被移除的核心含义。
- source_word: כָבוֹד
  choice: 荣耀
  rationale: 此处既涉及以色列所失去的尊荣，也因约柜被夺而带有神同在彰显的神学分量；“荣耀”能保留这种张力。
- source_word: מִיִּשְׂרָאֵל
  choice: 离开以色列
  rationale: 介词 מִן 表示分离或移出；与 גָּלָה 合译为“离开以色列”符合现代汉语表达。
- source_word: כִּי
  choice: 因为
  rationale: 这里最自然地引出前述宣告的原因；脚注保留将其理解为说明性“原来”的可能。
- source_word: נִלְקַח
  choice: 被夺去了
  rationale: לקח 的尼法勒式为被动，表示约柜被人取走；战败语境下“被夺去了”比单纯“被拿走了”更贴切，又不像“被俘获”那样过度拟人化。
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: 神的约柜
  rationale: “约柜”是现代中文圣经语境中清楚而庄重的惯用名称；所有格结构准确表达该柜属于神。
theological_decisions:
- issue: “荣耀”与以色列及约柜之间的关系
  choice: 译作“荣耀已经离开以色列”，表达因约柜被夺而发生的荣耀移除，却不把“荣耀”严格等同于神本身或约柜。
  alternative: 可把“荣耀”仅理解为以色列的国家尊荣，或把这句话解释为神自己已经离开。
  rationale: 上下文将这句话直接联系于神的约柜被夺，说明它不只是军事羞辱；但经文本身没有界定神如何临在于约柜，因此译文保留其神学分量与未明说之处。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“已经”体现事件造成的当前结果；“被夺去了”符合战败语境。脚注保留 גָּלָה 的流亡色彩以及 כִּי 作为原因或说明的细微差别。
