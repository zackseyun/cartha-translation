base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/010.yaml
  text: So the Philistines fought[a], and Israel was defeated, and each man fled to his tent. The slaughter was very great[b], and thirty thousand foot soldiers from Israel fell.
translation:
  language: zh_hans
  text: 非利士人交战，以色列人战败；各人都逃往自己的帐棚[a]。这场杀戮极其惨重[b]，以色列有三万名步兵阵亡。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“各人都逃往自己的住处”。希伯来文直译为“自己的帐棚”，这个说法也可惯用地指人的住所。
    reason: lexical_alternative
  - marker: b
    text: 或译“这次败仗极其惨重”。希伯来文直译为“这次打击极其沉重”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלָּחֲמוּ פְלִשְׁתִּים
  choice: 非利士人就开战
  rationale: לחם在此表示军事交战；“开战”简洁自然，并以“就”承接叙事进程。
- source_word: וַיִּנָּגֶף יִשְׂרָאֵל
  choice: 以色列人战败
  rationale: נגף在战争语境中表示遭击败；“战败”准确表达军事结果，也不与下文逃跑重复。
- source_word: וַיָּנֻסוּ אִישׁ לְאֹהָלָיו
  choice: 各人都逃回自己的帐棚
  rationale: איש作分配用法，表示“各人”；אהל直译为“帐棚”，虽也可惯用地指住处，但正文保留具体意象，并用脚注说明。
- source_word: וַתְּהִי הַמַּכָּה גְּדוֹלָה מְאֹד
  choice: 这次杀戮极其惨重
  rationale: מכה本义为打击，在战事叙述中可指造成大量死亡的击杀；下文的阵亡人数支持“杀戮”，而“极其惨重”自然传达גדולה מאד。
- source_word: וַיִּפֹּל מִיִּשְׂרָאֵל
  choice: 以色列有……阵亡
  rationale: נפל用于战场上的人员时通常表示战死；现代汉语以“阵亡”清楚自然地表达这一含义。
- source_word: שְׁלֹשִׁים אֶלֶף רַגְלִי
  choice: 三万名步兵
  rationale: 直接表达数目；רגלי指徒步作战者，“步兵”是现代汉语中清楚而准确的对应词。
