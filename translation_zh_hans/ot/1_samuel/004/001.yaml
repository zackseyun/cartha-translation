  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יְהִ֥י דְבַר שְׁמוּאֵ֖ל לְ/כָל יִשְׂרָאֵ֑ל וַ/יֵּצֵ֣א יִשְׂרָאֵל֩ לִ/קְרַ֨את פְּלִשְׁתִּ֜ים לַ/מִּלְחָמָ֗ה וַֽ/יַּחֲנוּ֙ עַל הָ/אֶ֣בֶן הָעֵ֔זֶר וּ/פְלִשְׁתִּ֖ים חָנ֥וּ בַ/אֲפֵֽק־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/001.yaml
  text: And the word of Samuel came to all Israel[a]. Then Israel went out to meet the Philistines in battle, and they camped at Ebenezer[b], while the Philistines camped at Aphek.
translation:
  language: zh_hans
  text: 撒母耳的话传到了全以色列[a]。以色列人出去迎战非利士人，扎营在以便以谢[b]；非利士人则扎营在亚弗。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“关于撒母耳的消息传到了全以色列。”希伯来文既可指撒母耳所说的话或信息，也可指关于他的消息；结合上下文，较可能是指他的先知话语。
    reason: alternative_reading
  - marker: b
    text: “以便以谢”意思是“帮助之石”；这里用作地名。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי דְבַר שְׁמוּאֵל לְכָל יִשְׂרָאֵל
  choice: 撒母耳的话传到了全以色列
  rationale: 用“传到了”自然表达这话临到或达到全体以色列人的意思；保留单数“话”，既贴近原文，也维持它与上文先知话语的联系。
- source_word: וַיֵּצֵא יִשְׂרָאֵל
  choice: 以色列人出去
  rationale: 忠实表达“出去”，并用“以色列人”指明这里是作为整体的民族，符合现代汉语习惯。
- source_word: לִקְרַאת פְּלִשְׁתִּים לַמִּלְחָמָה
  choice: 迎战非利士人
  rationale: “迎战”简洁结合了“前去迎面相遇”和“为争战”的军事语境，既自然又不增加原文以外的行动细节。
- source_word: וַיַּחֲנוּ
  choice: 扎营
  rationale: “扎营”是现代汉语中自然且适合军事场景的表达。
- source_word: עַל הָאֶבֶן הָעֵזֶר
  choice: 在以便以谢
  rationale: 此处该词组用作地名，因此采用通行音译；其字面含义在脚注中说明。
- source_word: וּפְלִשְׁתִּים חָנוּ
  choice: 非利士人则扎营
  rationale: “则”清楚呈现两军分别驻扎的对照关系，同时不改变希伯来语连接词的基本功能。
- source_word: בַאֲפֵק
  choice: 在亚弗
  rationale: 亚弗是地名，采用通行音译，并以“在”自然表达驻扎地点。
theological_decisions:
- issue: דְבַר שְׁמוּאֵל 是指撒母耳的先知话语，还是关于撒母耳的消息或声望
  choice: 正文译作“撒母耳的话”，主要保留先知话语的理解
  alternative: “关于撒母耳的消息传到了全以色列”
  rationale: 第三章结尾强调耶和华借撒母耳的话显现，并且全以色列承认他为先知，因此这里较自然地承接他的先知话语；但希伯来文也容许“消息”的理解，故在脚注中保留这一歧义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“传到了”避免生硬直译，“迎战”和“扎营”符合战争叙事语境；人名、族名和地名沿用现代中文圣经中较熟悉的译法。
