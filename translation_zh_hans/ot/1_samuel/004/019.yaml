  text: וְ/כַלָּת֣/וֹ אֵֽשֶׁת פִּינְחָס֮ הָרָ֣ה לָ/לַת֒ וַ/תִּשְׁמַ֣ע אֶת הַ/שְּׁמֻעָ֔ה אֶל הִלָּקַח֙ אֲר֣וֹן הָ/אֱלֹהִ֔ים וּ/מֵ֥ת חָמִ֖י/הָ וְ/אִישָׁ֑/הּ וַ/תִּכְרַ֣ע וַ/תֵּ֔לֶד כִּֽי נֶהֶפְכ֥וּ עָלֶ֖י/הָ צִרֶֽי/הָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/019.yaml
  text: His daughter-in-law[a], the wife of Phinehas, was pregnant, about to give birth. When she heard the report that the ark of God had been taken, and that her father-in-law and her husband were dead, she bowed down and gave birth[c][b], because her labor pains came upon her.
translation:
  language: zh_hans
  text: 他的儿媳，就是非尼哈的妻子，怀孕，临近分娩。她听见消息，说上帝的约柜被掳去了[a]，她的公公和丈夫也死了[b]，就屈身，生了孩子，因为阵痛临到她身上[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “说上帝的约柜被掳去了”也可译作“关于上帝约柜被掳去的消息”。
    reason: 原文结构既可将约柜被掳理解为消息的内容，也可较名词化地理解为消息的主题。
  - marker: b
    text: “死了”也可理解为“已经死去”或“已死”。
    reason: מֵת可表达死亡这一事件，也可表达死亡后的结果状态。
  - marker: c
    text: 直译为“因为她的阵痛转到她身上”，是指阵痛临到她身上的说法。
    reason: 说明希伯来语习语的字面意象；不把“突然”作为原文必然明示的成分。
lexical_decisions:
- source_word: וְכַלָּתוֹ
  choice: 他的儿媳
  rationale: כַּלָּה在此指“儿媳”；句首וְ承接上文，现代汉语不必机械译作“并且”。
- source_word: אֵשֶׁת פִּינְחָס
  choice: 也就是非尼哈的妻子
  rationale: 保留原文同位语，明确这位儿媳的身份；“也就是”使现代汉语衔接自然。
- source_word: הָרָה לָלַת
  choice: 怀着孕，临近分娩
  rationale: 分别表达הָרָה的怀孕状态和לָלַת所表示的即将生产。
- source_word: וַתִּשְׁמַע אֶת־הַשְּׁמֻעָה
  choice: 她听见消息
  rationale: שְׁמוּעָה指传来的消息或报道；“听见消息”符合叙事语体。
- source_word: אֶל הִלָּקַח אֲרוֹן הָאֱלֹהִים
  choice: 说上帝的约柜被掳去了
  rationale: 将אֶל与不定式结构理解为消息的内容；הִלָּקַח为被动，结合战争语境译作“被掳去”。
- source_word: וּמֵת חָמִיהָ וְאִישָׁהּ
  choice: 她的公公和丈夫也死了
  rationale: מֵת在此可表达死亡事实或死亡后的状态；现代汉语用“死了”自然且保留两者之间的张力。
- source_word: וַתִּכְרַע וַתֵּלֶד
  choice: 就蹲下生产
  rationale: כרע表示屈身、跪下或蹲下；在分娩语境中“蹲下”较具体，同时不过度添加“倒下”等原文未明说的含义。 ילד在此意为生产。
- source_word: כִּי נֶהֶפְכוּ עָלֶיהָ צִרֶיהָ
  choice: 因为阵痛突然袭来
  rationale: צִרֶיהָ在此是生产阵痛；נֶהֶפְכוּ עָלֶיהָ字面意象较强，表达疼痛骤然临到她，译文以自然汉语传达其突发性。
