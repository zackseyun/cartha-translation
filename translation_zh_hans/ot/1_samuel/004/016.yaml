  rationale: 修订将以利的问题改为直接询问所发生之事，避免“情况怎样”转为当前状态的询问；将“逃了出来”改为“逃走了”，避免附加成功脱离的结果意味。脚注补足相关替代译法，同时保留“战阵”作为正文中最能体现军事编阵含义的译词。
