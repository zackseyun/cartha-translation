base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/016.yaml
  text: The man said to Eli[a], “I am the one who came from the battle line, and I fled from the battle line today.” And he said, “What happened, my son?”
translation:
  language: zh_hans
  text: 那人对以利说：“我就是从战阵[a]来的；今天我从战阵逃走了。”以利说：“我儿，发生了什么事？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“战场”“军营”或“军阵”；希伯来词指军队排列成的阵势或作战队列。
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאִישׁ
  choice: 那人
  rationale: 原文是普通名词“人”，并未使用“使者”的专门称谓；“那人”既承接上下文，也保留原文措辞。
- source_word: הַבָּא
  choice: 从……中来的
  rationale: 分词与 אָנֹכִי 连用，用来表明说话者身份；此人已经来到以利面前，因此用完成意味自然的“来的”。
- source_word: מִן הַמַּעֲרָכָה
  choice: 从战阵中
  rationale: מַעֲרָכָה 可指军队列成的阵势或战线；“战阵”保留军事队列的具体含义，也适合本节战场语境。
- source_word: נַסְתִּי
  choice: 我……逃了出来
  rationale: נוּס 的核心义是“逃跑、逃离”；“逃了出来”在现代汉语中自然，并明确表达他从战阵逃离，但不额外加入“成功脱险”等结果。
- source_word: הַיּוֹם
  choice: 今天
  rationale: 直接表达原文的时间指示，符合现代汉语。
- source_word: מֶה הָיָה הַדָּבָר
  choice: 情况怎样
  rationale: 字面近于“事情怎么样了”；在以利询问战况的语境中，“情况怎样”自然、简洁，又没有把问题限定为单一事件。
- source_word: בְּנִי
  choice: 我儿
  rationale: 保留第一人称所属后缀及长者对年轻人的亲切或礼貌称呼；“我儿”庄重而易懂。
