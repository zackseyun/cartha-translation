id: 1SA.4.3
reference: 1 Samuel 4:3
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יָּבֹ֣א הָ/עָם֮ אֶל הַֽ/מַּחֲנֶה֒ וַ/יֹּֽאמְרוּ֙ זִקְנֵ֣י יִשְׂרָאֵ֔ל לָ֣/מָּה נְגָפָ֧/נוּ יְהוָ֛ה הַ/יּ֖וֹם לִ/פְנֵ֣י פְלִשְׁתִּ֑ים נִקְחָ֧ה אֵלֵ֣י/נוּ מִ/שִּׁלֹ֗ה אֶת אֲרוֹן֙ בְּרִ֣ית יְהוָ֔ה וְ/יָבֹ֣א בְ/קִרְבֵּ֔/נוּ וְ/יֹשִׁעֵ֖/נוּ מִ/כַּ֥ף אֹיְבֵֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/003.yaml
  text: When the people came into the camp[a], the elders of Israel said, “Why has Yahweh struck us down today before the Philistines? Let us bring here from Shiloh the ark of the covenant of Yahweh, so that it may come into our midst and save us from the hand of our enemies.”
translation:
  language: zh_hans
  text: 百姓来到营中，以色列的长老说：“耶和华今天为什么使我们败在非利士人面前呢？让我们从示罗把耶和华的约柜带到我们这里来吧，好让它[a]来到我们中间，救我们脱离仇敌的手。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“好让他来到我们中间，救我们”，即将两个单数动词更直接地理解为指耶和华；他的临在与约柜相联系。
    reason: 保留希伯来文单数动词可能以约柜为语法所指、也可能更直接指向耶和华的解释空间。
lexical_decisions:
- source_word: הָעָם
  choice: 百姓
  rationale: 该词通常指“人民、百姓”；此处由军营语境自然表明他们是参战的以色列人，无须明说为“军队”或“士兵”。
- source_word: הַמַּחֲנֶה
  choice: 营中
  rationale: 准确表达军事语境中的营地，并与“回到”搭配自然。
- source_word: זִקְנֵי יִשְׂרָאֵל
  choice: 以色列的长老
  rationale: 保留这一公认领袖群体的传统、准确称谓。
- source_word: נְגָפָנוּ
  choice: 使我们败
  rationale: נגף在战事中表示击打并使之败退；“使我们败”既保留耶和华的主动作用，也清楚表达战败结果。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神名音译，而不以称号“主”替代原文专名。
- source_word: לִפְנֵי פְלִשְׁתִּים
  choice: 在非利士人面前
  rationale: 贴近原文“在……面前”，同时在战事语境中自然表达当着敌军战败。
- source_word: נִקְחָה אֵלֵינוּ
  choice: 我们……运到这里来吧
  rationale: 表达第一人称劝议式，并自然呈现把约柜从示罗带到营中的方向。
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: 耶和华的约柜
  rationale: “约柜”在现代中文中已固定表达“约的柜”，前置“耶和华的”自然呈现原文所属关系。
- source_word: וְיָבֹא בְקִרְבֵּנוּ
  choice: 好让它来到我们中间
  rationale: 以约柜为紧邻的语法先行词，用“它”承接，同时用脚注保留动词可能更直接指向耶和华临在的理解。
- source_word: וְיֹשִׁעֵנוּ
  choice: 救我们
  rationale: ישׁע的使役形在此意为拯救、解救；“救我们”简洁而有经文庄重感。
- source_word: מִכַּף אֹיְבֵינוּ
  choice: 脱离仇敌的手
  rationale: 保留希伯来语以“手”表示权势或掌控的习语，中文圣经语体中也清楚自然。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 原文使用四字神名，正文以中文读者广泛熟悉的专名“耶和华”呈现，不用称号替代，也不据单一重构发音改作较陌生形式。
- issue: וְיָבֹא和וְיֹשִׁעֵנוּ的主语所指
  choice: 正文以“它”指约柜
  alternative: 以“他”指耶和华
  rationale: 约柜是两个单数动词最近的语法先行词，因此正文用“它”；但约柜与耶和华临在密切相关，语义也可能更直接指向耶和华，故以脚注保留这一真实歧义，不消解叙事中的神学张力。
translation_notes:
  register: 采用现代、庄重而通顺的简体中文。“回到营中”结合上文战败后返回营地的语境；引语保持长老提议的直接语气。正文不把长老的想法解释为正确或迷信，让叙事本身作出评判。
