base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/002.yaml
  text: The Philistines drew up to meet Israel[a], and the battle spread out, and Israel was defeated before the Philistines; and they struck down about four thousand men in the battle line in the field.
translation:
  language: zh_hans
  text: 非利士人摆开阵势迎战以色列人，战斗展开了[a]；以色列人在非利士人面前战败。非利士人在田野的战阵里击杀了约四千人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“双方交战。”这里的希伯来语可能指战斗开始，也可能指战斗铺展开来、双方投入交战。
    reason: 保留 וַתִּטֹּשׁ הַמִּלְחָמָה 这一少见表达在战斗开始与战势展开之间的词义可能。
lexical_decisions:
- source_word: וַיַּעַרְכוּ
  choice: 摆开阵势
  rationale: 该动词在军事语境中指排兵布阵；“摆开阵势”既保留军事含义，也符合现代汉语表达。
- source_word: לִקְרַאת
  choice: 迎战
  rationale: 这里表示面对前来交战的对方；结合明确的战争语境译作“迎战”，比单纯的“迎接”自然，又不额外增加原文没有的细节。
- source_word: וַתִּטֹּשׁ הַמִּלְחָמָה
  choice: 战斗随即展开
  rationale: 这一少见结构可能描写战斗开始，也可能描写战线铺开、双方投入交战。“展开”在中文中能较自然地容纳这两层可能，脚注保留其词义张力。
- source_word: וַיִּנָּגֶף
  choice: 败下阵来
  rationale: 该词的尼法勒词形在敌军面前常表示战败；此译与后文具体伤亡相区分，且符合现代中文军事叙事。
- source_word: לִפְנֵי
  choice: 在……面前
  rationale: 保留希伯来语常见的军事表达，说明以色列人在非利士人面前战败，而不把它简化为单纯的施事标记“被”。
- source_word: וַיַּכּוּ
  choice: 击杀了
  rationale: 战争语境和随后的伤亡数字表明这里指致命击打；明确复原上下文中的主语“非利士人”，避免中文代词指向不清。
- source_word: בַמַּעֲרָכָה
  choice: 在……战阵中
  rationale: מַעֲרָכָה 指排列成形的战阵或战线；“战阵”简洁地保留了军队列阵的含义。
- source_word: בַּשָּׂדֶה
  choice: 在田野
  rationale: 按原文直译为“田野”，不擅自增添“开阔”等限定。
- source_word: כְּאַרְבַּעַת אֲלָפִים אִישׁ
  choice: 约四千人
  rationale: 数字前的 כְּ 表示约数，因此译作“约”；中文用“人”自然计数参战者，无须重复添加原文未明说的身份称谓。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。用“摆开阵势”“败下阵来”“战阵”等普通读者易懂的军事表达，同时避免古奥措辞；分号区分总体战败与具体伤亡。
