base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/006.yaml
  text: When the Philistines heard the sound of the shouting[a], they said[b], “What is this great sound of shouting in the camp of the Hebrews?” And they knew that the ark of Yahweh had come into the camp.
translation:
  language: zh_hans
  text: 非利士人听见那欢呼声，就说：“希伯来人的营中这响亮的欢呼声是怎么回事？”他们便得知，雅威的约柜已经进了营中。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קוֹל הַתְּרוּעָה
  choice: 欢呼的声音
  rationale: קוֹל在这里指可听见的声响；תְּרוּעָה可指呼喊、呐喊或战呼。结合第5节约柜进营时以色列人的反应，译作“欢呼”自然贴切，同时不将其限定为军事号令。
- source_word: מֶה קוֹל ... הַגְּדוֹלָה הַזֹּאת
  choice: 怎么会有这么响亮的……声
  rationale: מֶה在此询问这声音的性质或缘由；הַגְּדוֹלָה字面为“大”，修饰声音时现代汉语自然表达为“响亮”。
- source_word: מַחֲנֵה הָעִבְרִים
  choice: 希伯来人的营中
  rationale: 保留非利士人口中的族称“希伯来人”，不改写为“以色列人”；“营”准确体现军事营地语境。
- source_word: וַיֵּדְעוּ
  choice: 他们便得知
  rationale: 该动词在叙事中表示他们获得了新信息；“得知”比静态的“知道”更清楚地传达这一语义进展。
- source_word: אֲרוֹן יְהוָה
  choice: 雅威的约柜
  rationale: אֲרוֹן在本叙事中是神圣的约柜；以“雅威”音译专名יְהוָה，保留其作为以色列之神名字的性质。
- source_word: בָּא אֶל הַמַּחֲנֶה
  choice: 已经进了营中
  rationale: 完成式表示在非利士人得知消息时，约柜进入营地一事已经发生；“进了”也比直译“来到”更符合汉语空间表达。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华／上主
  rationale: 原文直接使用四字神名。正文采用现代汉语常见的学术性音译“雅威”，既保留专名性质，也避免以称号取代原文名字。
- issue: 约柜到营中是否暗示神亲自受人操控
  choice: 仅陈述约柜已经进营
  alternative: 解释为雅威亲自进入营中
  rationale: 原文主语明确是“雅威的约柜”。译文不额外认同以色列人把约柜带来必然保证神同在或得胜的观念，保留叙事中的神学张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“欢呼”承接上文的高声呼喊；“这么响亮”传达声音之“大”而避免生硬直译。句式保留希伯来叙事的先后推进，同时符合现代中文习惯。
