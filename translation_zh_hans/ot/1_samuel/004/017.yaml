base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/017.yaml
  text: The messenger answered and said[a], “Israel has fled before the Philistines, and there has also been a great slaughter among the people; and your two sons also are dead, Hophni and Phinehas[b]; and the ark of God has been taken.”
translation:
  language: zh_hans
  text: 报信的人回答说：“以色列人从非利士人面前逃走了，百姓中也有许多人丧生[a]；你的两个儿子何弗尼和非尼哈也死了；上帝的约柜也被夺走了[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“百姓遭受了沉重的打击”或“百姓遭遇了一场惨败。”这个希伯来词可以表示沉重的打击、灾祸或杀戮；这里的战斗语境较支持指大量伤亡。
    reason: lexical_alternative
  - marker: b
    text: 或译：“上帝的约柜被掳去了。”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמְבַשֵּׂר
  choice: 报信的人
  rationale: 该分词指带来消息的人；“报信的人”自然、准确，也符合叙事语境。
- source_word: נָס
  choice: 逃跑了
  rationale: 动词本义为“逃跑”；不译作“溃败”，以免把结果性的解释直接写入正文。
- source_word: לִפְנֵי פְלִשְׁתִּים
  choice: 在非利士人面前
  rationale: 保留希伯来语“在……面前”的表达，语境清楚地表明以色列人是在敌军面前败逃。
- source_word: מַגֵּפָה גְדוֹלָה
  choice: 一场大屠杀
  rationale: מַגֵּפָה可指重击、灾害或杀戮；在战斗语境中，“大屠杀”最能表达人员惨重伤亡，同时以脚注保留“惨败”的可能译法。
- source_word: בָעָם
  choice: 百姓中
  rationale: 原文直称“百姓”；虽在此主要指参战的以色列人，仍保留原词，不收窄为“军队”。
- source_word: שְׁנֵי בָנֶיךָ
  choice: 你的两个儿子
  rationale: 直接对应原文，并保留对这两个特定儿子的强调。
- source_word: מֵתוּ
  choice: 死了
  rationale: 完成式报告已经发生的死亡；现代汉语“死了”简洁自然。
- source_word: חָפְנִי וּפִינְחָס
  choice: 何弗尼和非尼哈
  rationale: 采用中文圣经传统中通行且易识别的人名音译。
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: 上帝的约柜
  rationale: “约柜”是该圣物在现代汉语中的通行名称；“上帝的约柜”准确表达属格关系。
- source_word: נִלְקָחָה
  choice: 被夺走了
  rationale: 保留原文被动语态；战场语境中的“夺走”自然明确，但脚注也列出“被掳去”这一可能表达。
