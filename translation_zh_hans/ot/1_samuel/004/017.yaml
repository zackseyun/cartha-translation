revisions:
- from: 报信的人回答说：“以色列人在非利士人面前逃跑了，百姓中又遭受了一场大屠杀[a]；你的两个儿子何弗尼和非尼哈也死了；上帝的约柜也被夺走了[b]。”
  to: 报信的人回答说：“以色列人从非利士人面前逃走了，百姓中也有许多人丧生[a]；你的两个儿子何弗尼和非尼哈也死了；上帝的约柜也被夺走了[b]。”
  rationale: 将“大屠杀”改为“许多人丧生”，以准确表达战斗中的严重伤亡，避免现代汉语“大屠杀”可能附带的蓄意屠戮意味；并微调“从非利士人面前逃走了”以提升自然度。脚注相应保留原词可指严重打击、灾祸或杀戮的词义范围及“惨败”的替代译法。
