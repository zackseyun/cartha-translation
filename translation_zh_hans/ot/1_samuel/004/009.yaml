  text: הִֽתְחַזְּק֞וּ וִֽ/הְי֤וּ לַֽ/אֲנָשִׁים֙ פְּלִשְׁתִּ֔ים פֶּ֚ן תַּעַבְד֣וּ לָ/עִבְרִ֔ים כַּ/אֲשֶׁ֥ר עָבְד֖וּ לָ/כֶ֑ם וִ/הְיִיתֶ֥ם לַ/אֲנָשִׁ֖ים וְ/נִלְחַמְתֶּֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/009.yaml
  text: Be strong and be men[a], O Philistines, lest you become slaves to the Hebrews as they have been to you[b]. Be men and fight!
translation:
  language: zh_hans
  text: 非利士人哪，要刚强，作大丈夫[a]！免得你们沦为希伯来人的奴仆，像他们曾作你们的奴仆一样。要作大丈夫，要作战！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “作大丈夫”对应原文以“男人”为意象的临战劝勉，指显出男子般的勇气；也可译作“表现得像男子汉”。本节此语重复出现一次。
    reason: 说明原文性别化习语及其语用含义，并避免将习语误作机械字面翻译。
lexical_decisions:
- source_word: הִתְחַזְּקוּ
  choice: 要刚强
  rationale: 该词是 חזק 的 Hitpael 祈使式复数，在临战劝勉中要求听者振作、坚强；“要刚强”简洁、庄重，也保留了原文的命令语气。
- source_word: וִהְיוּ לַאֲנָשִׁים / וִהְיִיתֶם לַאֲנָשִׁים
  choice: 作大丈夫
  rationale: 原文两次使用“成为男人”的性别化勇武习语。“作大丈夫”在现代汉语中仍可理解为表现出男子的胆量与气概，并能保留重复形成的修辞力量；脚注说明其字面和语用含义。
- source_word: פְּלִשְׁתִּים
  choice: 非利士人哪
  rationale: 原文在此直接呼唤非利士军兵；句末助词“哪”自然表达呼语语气。
- source_word: פֶּן
  choice: 免得
  rationale: 该词引出说话者警告他们要避免的结果；“免得”准确而自然。
- source_word: תַּעַבְדוּ לָעִבְרִים
  choice: 沦为希伯来人的奴仆
  rationale: עבד 在战争失败与政治屈服的语境中不只是一般的“服侍”，而指受制、服役的身份。“沦为……奴仆”既表达状态转变，也凸显被迫屈从。
- source_word: לָעִבְרִים
  choice: 希伯来人
  rationale: 严格保留 עִבְרִים 的族称，不将其调和为“以色列人”。
- source_word: כַּאֲשֶׁר עָבְדוּ לָכֶם
  choice: 像他们曾作你们的奴仆一样
  rationale: 明确表达希伯来人此前受非利士人辖制的对应关系，并与前句的“奴仆”形成原文所具有的词语复现。
- source_word: וְנִלְחַמְתֶּם
  choice: 奋勇作战
  rationale: 该完成式在连续命令的语境中具有劝令作用。“作战”直接表达战斗行动；“奋勇”使汉语承接前面的刚强劝勉，但不增加新的行动内容。
theological_decisions:
- issue: לַאֲנָשִׁים 的性别化勇武劝勉
  choice: 作大丈夫
  alternative: 勇敢起来／拿出勇气
  rationale: 说话对象是非利士军兵，原文有意用“男人”构成勇武劝勉。采用性别明确的表达，避免把这一修辞特征中性化；同时用脚注说明这是一种临战习语，并非另加伦理判断。
- issue: 战争语境中 עבד 的强度
  choice: 沦为……奴仆
  alternative: 服侍……／受……辖制
  rationale: 上下文所警告的是战败后被敌方支配，而非自愿服务。“奴仆”较充分地传达被迫从属的身份；但不把它扩展成原文未明说的具体奴隶制度。
translation_notes:
  register: 采用现代、庄重而有战场号召力的普通话。保留“要刚强”和“作大丈夫”的重复及直接呼语；“奴仆”用于呈现战败受制的强烈含义。正文中的脚注标记与脚注条目一致。
