base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/021.yaml
  text: And she named the boy Ichabod[a], saying, “The glory has departed from Israel,” because the ark of God had been taken, and because of her father-in-law and her husband.
translation:
  language: zh_hans
  text: 她给那男孩起名为“以迦博”[a]，说：“荣耀离开以色列了。”这是因为上帝的约柜被掳去，也因为她的公公和丈夫。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “以迦博”这个名字可能由与“没有荣耀”相关的希伯来语成分构成，也可能有“荣耀在哪里？”的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּקְרָא לַנַּעַר
  choice: 她给孩子起名叫
  rationale: קרא ל在命名语境中表示给人起名；נַעַר在这里指刚出生的男孩，汉语用“孩子”自然且符合上下文。
- source_word: אִי כָבוֹד
  choice: 以迦博
  rationale: 作为人名采用音译，并以脚注说明其希伯来语可能的含义，避免在正文中固定一种有争议的词源解释。
- source_word: גָּלָה כָבוֹד מִיִּשְׂרָאֵל
  choice: 荣耀离开以色列了
  rationale: גלה在这里表达离去或被撤去；“离开”自然保留“荣耀”离去的意象。כָבוֹד译作“荣耀”，不限定为上帝临在或以色列尊荣中的某一种。
- source_word: אֶל הִלָּקַח אֲרוֹן הָאֱלֹהִים
  choice: 这是因为上帝的约柜被掳去
  rationale: 此处אֶל结合语境可表原因；הִלָּקַח为被动，约柜在战争中落入敌手，译作“被掳去”贴合叙事。
- source_word: וְאֶל חָמִיהָ וְאִישָׁהּ
  choice: 也因为她的公公和丈夫死了
  rationale: 重复的אֶל延续原因关系。原文只列出公公和丈夫，但上下文明确二人已死；补出“死了”使现代汉语句意完整清楚。
theological_decisions:
- issue: “荣耀”与以色列的关系
  choice: 保留“荣耀离开以色列了”这一简洁表达
  alternative: “上帝的荣耀离开以色列了”或“以色列的尊荣不复存在了”
  rationale: 原文没有明说荣耀仅指上帝彰显的临在，还是也包含以色列的尊荣；约柜被掳和以利家遭难使两层意义彼此交织，因此正文不予收窄。
- issue: 公公和丈夫之死与起名的因果关系
  choice: 将二人的死亡与约柜被掳并列为所说之话和命名的背景原因
  alternative: 把末句仅理解为她临死的原因，而非命名或宣告的原因
  rationale: 重复使用אֶל在句法上把约柜被掳、公公和丈夫的遭遇并列起来；译文保留这一并列因果结构。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“上帝的约柜”沿用本段核心宗教用语；人名音译并用脚注保留词源歧义。正文脚注标记与脚注对应。
