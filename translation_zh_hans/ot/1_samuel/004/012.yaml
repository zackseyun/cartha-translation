base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/012.yaml
  text: Then a man of Benjamin ran from the battle line and came to Shiloh that same day[b][a], with his clothes torn and dirt on his head.
translation:
  language: zh_hans
  text: 有一个便雅悯人从战阵[a]跑来，当天到了示罗；他的衣服撕破了，头上有土[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“从战场”或“从军阵”。这里的希伯来词更具体地指列阵交战的阵线或军阵。
    reason: lexical_alternative
  - marker: b
    text: 撕破衣服、头上有土，是当时表示悲痛、危难或灾祸的惯常标志。
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּרָץ
  choice: 跑来
  rationale: רוץ表示快速奔跑；译作“跑来”自然准确，不以“逃来”擅自推断他的动机。
- source_word: אִישׁ בִּנְיָמִן
  choice: 一个便雅悯人
  rationale: 这是按支派身份称呼此人；现代汉语用“便雅悯人”简洁清楚，也忠实表达其归属。
- source_word: מֵהַמַּעֲרָכָה
  choice: 从战阵
  rationale: מַעֲרָכָה具体指列阵交战的阵线或军阵；“战阵”保留这一军事含义，又比单译“战场”更贴近原词。
- source_word: וַיָּבֹא שִׁלֹה
  choice: 到了示罗
  rationale: בוא在此表示抵达目的地；“到了示罗”符合现代汉语叙事习惯。
- source_word: בַּיּוֹם הַהוּא
  choice: 当天
  rationale: 原文直译为“在那一天”；结合上下文，“当天”自然表达他在同一天抵达，并未增加更具体的时间信息。
- source_word: וּמַדָּיו קְרֻעִים
  choice: 他的衣服撕破了
  rationale: מַדִּים在此指衣物，קְרֻעִים指被撕裂的状态；“衣服撕破了”既自然，也保留哀恸举动留下的可见状态。
- source_word: וַאֲדָמָה עַל רֹאשׁוֹ
  choice: 头上撒着土
  rationale: אֲדָמָה指土地、泥土；“土”比“灰尘”更贴近原词。“撒着”按这一哀恸习俗自然表达泥土在头上的状态。
