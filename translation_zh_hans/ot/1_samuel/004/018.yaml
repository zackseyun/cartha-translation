source:
  edition: WLC
  text: וַ/יְהִ֞י כְּ/הַזְכִּיר֣/וֹ אֶת אֲר֣וֹן הָ/אֱלֹהִ֗ים וַ/יִּפֹּ֣ל מֵֽ/עַל הַ֠/כִּסֵּא אֲחֹ֨רַנִּ֜ית בְּעַ֣ד יַ֣ד הַ/שַּׁ֗עַר וַ/תִּשָּׁבֵ֤ר מַפְרַקְתּ/וֹ֙ וַ/יָּמֹ֔ת כִּֽי זָקֵ֥ן הָ/אִ֖ישׁ וְ/כָבֵ֑ד וְ/ה֛וּא שָׁפַ֥ט אֶת יִשְׂרָאֵ֖ל אַרְבָּעִ֥ים שָׁנָֽה׀־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/018.yaml
  text: And it happened[a], when he mentioned the ark of God, that Eli fell backward from the seat by the side of the gate, and his neck was broken and he died, for the man was old and heavy[b]. And he had judged Israel forty years.
translation:
  language: zh_hans
  text: 他一提到上帝的约柜，以利就从门边[a]的座位上向后跌倒，颈项折断而死，因为他年老，身体沉重[b]。他作以色列的士师，共四十年。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“门旁”或“门的一侧”。希伯来语按字面是“在门的手边”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“沉重”。这个词可能暗示，以利的体重与年老一同使这次跌倒致命。
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּהַזְכִּירוֹ
  choice: 他一提到
  rationale: 希伯来语使役形在此表示“提到、说起”；“一提到”自然表达 כְּ 的时间关系，也体现消息触发以利跌倒的紧接性。
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: 上帝的约柜
  rationale: 按构造关系直译；上下文明确指以色列之上帝的约柜。“约柜”是现代汉语中清楚而通行的称呼。
- source_word: וַיִּפֹּל ... אֲחֹרַנִּית
  choice: 向后跌倒
  rationale: 准确保留 אֲחֹרַנִּית“向后”的副词意义，汉语表达自然。
- source_word: הַכִּסֵּא
  choice: 座位
  rationale: כִּסֵּא 可指座位、椅子或宝座；此处不是王权场景，采用中性的“座位”。
- source_word: בְּעַד יַד הַשַּׁעַר
  choice: 门边
  rationale: 该短语按字面含有“门的手边”之意，实际表示门旁或门侧；正文用简洁自然的“门边”，脚注保留字面习语及其他可能译法。
- source_word: וַתִּשָּׁבֵר מַפְרַקְתּוֹ
  choice: 折断颈项
  rationale: מַפְרֶקֶת 指颈部或后颈；“折断颈项”准确表达致命损伤，又不过度限定具体解剖部位。
- source_word: כִּי זָקֵן הָאִישׁ וְכָבֵד
  choice: 因为他年老，身体沉重
  rationale: 保留 כִּי 的因果解释和 כָבֵד“沉重”的基本意义；加“身体”使现代汉语明确这是体重状况，却不直接改释为“肥胖”。
- source_word: שָׁפַט אֶת יִשְׂרָאֵל
  choice: 作以色列的士师
  rationale: שׁפט 在《士师记—撒母耳记》的叙事语境中不只指法庭审判，也指士师对以色列的治理与带领；“作……的士师”保留其历史职分含义。
- source_word: אַרְבָּעִים שָׁנָה
  choice: 共四十年
  rationale: 直接表达任职时长；“共”符合汉语总结人物生平的语气。
theological_decisions:
- issue: אֱלֹהִים 在 אֲרוֹן הָאֱלֹהִים 中的所指
  choice: 上帝
  alternative: 诸神
  rationale: 本段叙事明确谈论以色列之上帝的约柜，语境要求单数所指；译作“上帝”是语法与语境判断，不额外引入宗派解释。
- issue: שָׁפַט 所表达的职分范围
  choice: 作以色列的士师
  alternative: 审判以色列／治理以色列
  rationale: “审判”在现代汉语中过窄，容易只让人想到司法裁决；“治理”虽传达功能，却淡化了叙事中的士师职分。正文保留“士师”，不进一步界定其神学或政治性质。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。叙事句保持紧凑的事件顺序；“颈项”和“士师”略具经文语体，但在普通读者可理解的范围内，并分别准确承载原文的身体部位与历史职分。所有脚注标记均放在其所解释的词语之后。
