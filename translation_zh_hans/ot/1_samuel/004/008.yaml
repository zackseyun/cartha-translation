base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/008.yaml
  text: Woe to us! Who can deliver us from the hand of these mighty gods? These are the gods who struck Egypt with every plague in the wilderness[a][b].
translation:
  language: zh_hans
  text: 我们有祸了！谁能救我们脱离这些大能之神的手呢？这些就是曾在旷野用每一场灾祸击打埃及的神[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “这些大能之神”也可理解为“这位大能的上帝”。非利士人使用复数说法，反映他们对以色列之上帝的理解。
    reason: lexical_alternative
  - marker: b
    text: 希伯来原文作“在旷野”。这句话在上下文中较难理解，因为灾祸是在以色列进入旷野以前降在埃及的；本译文按马所拉文本保留原句。
    reason: textual_variant
lexical_decisions:
- source_word: א֣וֹי לָ֔נוּ
  choice: 我们有祸了
  rationale: 这是表示惊恐与厄运临头的呼喊；“我们有祸了”自然、庄重，并保留原文的强烈语气。
- source_word: מִ֣י יַצִּילֵ֔נוּ
  choice: 谁能救我们
  rationale: נצל 的使役形表示搭救、解救；疑问句在语境中带有绝望的反问意味，用“能”恰当地传达这一点。
- source_word: מִיַּד
  choice: 脱离……的手
  rationale: 保留希伯来语以“手”表示权势或控制的形象，在现代汉语中也清楚可懂。
- source_word: הָאֱלֹהִים הָאַדִּירִים הָאֵלֶּה
  choice: 这些大能之神
  rationale: 复数形容词、指示词以及下文的复数分词支持复数理解；这是非利士人按其多神观念所说的话。“大能”传达 אַדִּירִים 的威力与崇高意味。
- source_word: אֵלֶּה הֵם הָאֱלֹהִים
  choice: 这些就是……的神
  rationale: “就是”保留 אֵלֶּה הֵם 的强调辨认语气，同时使中文流畅。
- source_word: הַמַּכִּים
  choice: 曾……击打
  rationale: 该分词在此指众所周知的过去事件；“曾”明确其叙事时序，“击打”保留原词的力度。
- source_word: אֶת מִצְרַיִם
  choice: 埃及
  rationale: 原文以“埃及”为受词，可统指其国土和人民；直译为“埃及”简洁且符合出埃及叙事惯用表达。
- source_word: בְּכָל מַכָּה
  choice: 用各样灾祸
  rationale: מַכָּה 可指击打、灾击或灾祸；在出埃及背景中译为“灾祸”自然。“各样”表达 כָּל 的全面范围，同时避免把原文限定为固定数目的灾难。
- source_word: בַּמִּדְבָּר
  choice: 在旷野
  rationale: 按马所拉文本直译；尽管这与灾祸发生在埃及的叙事次序形成难解之处，译文不作协调或删改。
theological_decisions:
- issue: 非利士人口中的 אֱלֹהִים 应作单数还是复数
  choice: 神（按复数含义）
  alternative: 上帝／神（单数）
  rationale: 以色列所敬拜的是独一的上帝，但说话者是非利士人；本节的复数形容词和复数分词反映他们以多神观念理解以色列的上帝。中文“这些……之神”“这些……的神”借上下文清楚表达复数，同时不把他们的话改写成正统信仰告白。
- issue: “在旷野”所造成的历史与句法张力
  choice: 保留“在旷野”
  alternative: 省略该短语，或改写为“击打埃及，又在旷野……”
  rationale: 马所拉文本明确有 בַּמִּדְבָּר。虽然埃及诸灾发生在以色列进入旷野之前，翻译仍应忠实呈现文本的困难，不以协调性改写消除张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“有祸了”保留危急呼喊的力度；“脱离……的手”保留圣经希伯来语的权势意象；“大能之神”既自然又保留非利士人复数措辞所产生的神学张力。脚注标记均置于相关正文之后。
