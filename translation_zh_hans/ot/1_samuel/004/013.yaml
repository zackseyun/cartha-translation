  text: וַ/יָּב֗וֹא וְ/הִנֵּ֣ה עֵ֠לִי יֹשֵׁ֨ב עַֽל הַ/כִּסֵּ֜א יך דֶּ֨רֶךְ֙ מְצַפֶּ֔ה כִּֽי הָיָ֤ה לִבּ/וֹ֙ חָרֵ֔ד עַ֖ל אֲר֣וֹן הָ/אֱלֹהִ֑ים וְ/הָ/אִ֗ישׁ בָּ֚א לְ/הַגִּ֣יד בָּ/עִ֔יר וַ/תִּזְעַ֖ק כָּל הָ/עִֽיר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/013.yaml
  text: When he came[a], behold, Eli was sitting on the seat by the road, watching, because his heart trembled for the ark of God. And the man came to report it in the city[b], and the whole city cried out.
translation:
  language: zh_hans
  text: 那人来到时，看哪，以利正坐在路旁的座位上[a]守望；因为他的心因上帝的约柜而颤抖[b]。那人来到城里报信，全城都呼喊起来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “路旁”原文直译为“道路的手边（侧边）”，是指道路旁边的习语。
    reason: cultural_note
  - marker: b
    text: 或译：“因为他的心为上帝的约柜而焦急不安。”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: 那人来到时
  rationale: 承接上一节的报信者；用“……时”自然引出随即呈现的场景，同时保留叙事推进。
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留希伯来语提示读者注意眼前场景的鲜明话语标记。
- source_word: יֹשֵׁב עַל־הַכִּסֵּא
  choice: 正坐在……座位上
  rationale: “正坐”表达分词所描写的持续状态；“座位”比“椅子”更中性，也不额外限定家具形制。
- source_word: יך דֶּרֶךְ (读作 יַד דֶּרֶךְ)
  choice: 路旁
  rationale: 马所拉旁注所示读法构成“道路一侧”的习语，现代汉语自然表达为“路旁”。
- source_word: מְצַפֶּה
  choice: 等候消息
  rationale: 该分词表示警醒地观望、期待；结合战报语境，“等候消息”自然传达以利焦急守候的情形，但不限定他实际看见什么。
- source_word: כִּי הָיָה לִבּוֹ חָרֵד
  choice: 因为他的心……战战兢兢
  rationale: 保留“心”这一具体的希伯来表达，并以“战战兢兢”传达 חרד 所含的颤抖、惧怕和焦虑。
- source_word: עַל אֲרוֹן הָאֱלֹהִים
  choice: 为上帝的约柜
  rationale: 介词 עַל 在此标明忧惧所关切的对象；“为……战战兢兢”保留他对约柜安危的深切忧虑。
- source_word: לְהַגִּיד בָּעִיר
  choice: 进城报信
  rationale: הגיד 是告知、报告；בָּעִיר 通常表示“在城里”。汉语“进城报信”顺畅概括他来到城中发布战况的动作。
- source_word: וַתִּזְעַק כָּל־הָעִיר
  choice: 全城就放声呼喊
  rationale: “全城”保留集合性转喻；“放声呼喊”表达 זעק 所指因震惊或悲痛发出的强烈呼声。
theological_decisions:
- issue: 神名 אֱלֹהִים 的译法
  choice: 上帝
  alternative: 神
  rationale: 采用现代普通话中庄重、通行的称谓；原文此处没有需要借译名进一步限定的神学含义。
- issue: 以利所忧虑的对象
  choice: 他的心为上帝的约柜战战兢兢
  alternative: 他因上帝的约柜而心里焦急
  rationale: 保留原文将约柜作为关切对象的措辞，不推断他主要担心约柜被掳、以色列战败或其他具体后果。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“看哪”有意保留原文突显场景的语气；“战战兢兢”较具文学感，但仍是通行现代汉语，并能保存原文具体而强烈的情绪表达。脚注标记置于与道路位置相关的场景句起始处，以免打断主句。
