  naturalness: 原译庄重自然；修订后“守望”“心因……而颤抖”“全城都呼喊起来”在现代汉语叙事中顺畅，同时保留原文的紧张感。
  terminology: “以利”“上帝”“约柜”均恰当且前后一致。“看哪”适合保留原文突显场景的话语功能。
