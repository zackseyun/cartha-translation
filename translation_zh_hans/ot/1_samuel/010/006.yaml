base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/006.yaml
  text: Then the Spirit of Yahweh will rush upon you[a], and you will prophesy with them[b], and be turned into another man.
translation:
  language: zh_hans
  text: 耶和华的灵必猛然临到你[a]，你就会和他们一同说预言，并且变成另一个人[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“必大有能力地临到你”。
    reason: 词语צלח在此强调耶和华的灵强有力地临到扫罗；该译法突出力度，主文则兼顾突发感。
  - marker: b
    text: 或译：“变成一个不同的人”。
    reason: אַחֵר既可表达“另一个”，也可强调“不同的”；两种汉语表达都不进一步界定改变的性质。
lexical_decisions:
- source_word: וְצָלְחָה
  choice: 必猛然临到
  rationale: 在以“耶和华的灵”为主语的叙事语境中，צלח表示强有力地临到某人；“猛然临到”兼顾动作的力度与现代汉语的自然表达。
- source_word: עָלֶיךָ
  choice: 临到你
  rationale: 介词עַל与צלח连用，表示灵来到扫罗身上；汉语以“临到你”表达最为自然。
- source_word: רוּחַ יְהוָה
  choice: 耶和华的灵
  rationale: רוּחַ在这里指上帝的灵，而非风或气息；“耶和华”是现代中文圣经语境中对四字神名的通行音译。
- source_word: וְהִתְנַבִּיתָ
  choice: 你就会……说预言
  rationale: נבא的Hitpael形式在本段指扫罗与先知群体一同参与先知性活动；“说预言”简明、自然，也不额外界定这种经历的具体形态。
- source_word: עִמָּם
  choice: 和他们一同
  rationale: עִם在此表示伴随，指扫罗加入他们的先知活动。
- source_word: וְנֶהְפַּכְתָּ
  choice: 变成
  rationale: הפך的Nifal形式表示状态发生改变；“变成”保留结果含义，又不把经文解释为某种特定教义意义上的彻底转化。
- source_word: לְאִישׁ אַחֵר
  choice: 另一个人
  rationale: 直译保留אִישׁ的男性单数表达，也保留原文对扫罗改变之性质与范围的开放性。
theological_decisions:
- issue: 扫罗所经历之改变的性质
  choice: 译为“变成另一个人”，陈述圣灵所促成的真实改变，但不界定其是否永久或是否等同于内在重生。
  alternative: 可将其解释为仅仅外在的先知性经历，或解释为完全的内在属灵更新。
  rationale: 原文把说预言与“变成另一个人”相连，却没有说明这种改变的确切神学范围或持久性，因此译文保留这一张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“说预言”便于普通读者理解；“变成另一个人”保留原文简洁、有力且神学上未加限定的表述。
