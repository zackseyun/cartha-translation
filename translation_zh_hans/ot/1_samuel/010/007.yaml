source:
  edition: WLC
  text: וְ/הָיָ֗ה כִּ֥י תבאינה הָ/אֹת֥וֹת הָ/אֵ֖לֶּה לָ֑/ךְ עֲשֵׂ֤ה לְ/ךָ֙ אֲשֶׁ֣ר תִּמְצָ֣א יָדֶ֔/ךָ כִּ֥י הָ/אֱלֹהִ֖ים עִמָּֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/007.yaml
  text: And when these signs come to you[a], do whatever your hand finds to do, for God is with you.
translation:
  language: zh_hans
  text: 这些兆头临到你的时候，凡你手所能做的[a]，就去做吧，因为神与你同在。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“你的手所找到的”，意思是手边可以做或力所能及的事。
    reason: 说明希伯来语习语及其字面形式。
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: ……的时候
  rationale: 该结构引出将来会出现的情形；用“……的时候”自然保留时间关系，不照搬希伯来语的形式性起句。
- source_word: תבאינה הָאֹתוֹת הָאֵלֶּה לָךְ
  choice: 这些兆头临到你
  rationale: בוא与“兆头”连用表示来到、出现或应验；“临到”既保留原文的动态意象，也符合庄重而通顺的现代汉语。
- source_word: עֲשֵׂה לְךָ
  choice: 就去做吧
  rationale: 命令式明确要求扫罗采取行动。לְךָ在这里带有亲身、自主行动的语气，汉语无需生硬译为“为自己”，以“就去做吧”结合上下文表达。
- source_word: אֲשֶׁר תִּמְצָא יָדֶךָ
  choice: 凡你手所能做的
  rationale: 原文直译为“你的手所找到的”，是指手边可做、力所能及之事。“凡你手所能做的”保留“手”的意象，同时让现代读者自然理解。
- source_word: כִּי
  choice: 因为
  rationale: 此处引出服从命令的理由，译为“因为”直接清楚。
- source_word: הָאֱלֹהִים
  choice: 神
  rationale: 虽带定冠词，此处明确指以色列的神；现代汉语直译为“神”，不另加不自然的限定语。
- source_word: עִמָּךְ
  choice: 与你同在
  rationale: 直接表达神的临在和支持，并保留原文简洁、有力的措辞。
theological_decisions:
- issue: 带定冠词的הָאֱלֹהִים如何表达
  choice: 神
  alternative: 那位神
  rationale: 该词在语境中是对以色列之神的确定指称；译作“神”已充分表达其专指意义。“那位神”会在汉语中引入原文没有的对比意味。
- issue: “神与你同在”与扫罗行动之间的关系
  choice: 以“因为”保留理由关系，不补充行动范围或道德判断
  alternative: 将其解释为神授权扫罗做任何想做的事
  rationale: 原文只说明神的同在是扫罗采取眼前行动的依据；译文不把这句话扩展为不受限制的普遍授权，也不削弱其直接命令的力度。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“临到”保留经文语体但仍属现代常用表达；“凡你手所能做的”在自然度与原文“手”的意象之间取得平衡。
