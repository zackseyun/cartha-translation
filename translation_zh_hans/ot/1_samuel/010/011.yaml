base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/011.yaml
  text: And it happened that all who had known him formerly saw[a], and behold, he was prophesying with the prophets. So the people said, each man to his neighbor[b], “What has happened to the son of Kish? Is Saul also among the prophets?”
translation:
  language: zh_hans
  text: 从前认识扫罗的人[a]都看见，忽然见他正同先知们一起说预言。众人就彼此说：“基士的儿子怎么了？扫罗也[b]在先知中间吗？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“从昨天、前天起认识他”；这是希伯来语惯用语，意思是“从前认识他”。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“连扫罗也在先知中间吗？”
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹדְעוֹ מֵאִתְּמוֹל שִׁלְשׁוֹם
  choice: 从前认识扫罗的人
  rationale: 该短语直译涉及“从昨天、前天起”，在希伯来语中惯指先前、从前。译为“从前认识扫罗”自然传达这些人熟悉他原先状况的意思，并与眼前的异常表现形成对比。
- source_word: וַיְהִי
  choice: 事情是这样
  rationale: 这是希伯来叙事的承接公式；此译保留叙事推进作用，同时避免文言式的“于是发生了”。
- source_word: וַיִּרְאוּ וְהִנֵּה
  choice: 看见，瞧
  rationale: “瞧”保留 וְהִנֵּה 所带出的现场感与惊讶，不把它弱化为单纯的宾语从句。
- source_word: עִם נְבִאִים
  choice: 同先知们一起
  rationale: עִם 的基本意思是“同、和”；如此也可与末句 בַּנְּבִיאִים 的“在先知中间”保持措辞区别。
- source_word: נִבָּא
  choice: 正……说预言
  rationale: 此处 נבא 的尼法勒式指正在进行的先知性活动。“正……说预言”贴合目击场景，又不暗示扫罗已取得永久的先知身份。
- source_word: אִישׁ אֶל־רֵעֵהוּ
  choice: 彼此说
  rationale: 该分配式表达在现代汉语中自然对应“彼此说”；无需机械保留“各人对邻舍”，也不改变众人互相交谈的含义。
- source_word: מַה־זֶּה הָיָה לְבֶן־קִישׁ
  choice: 基士的儿子怎么了
  rationale: 自然表达众人对扫罗突然变化的惊讶，不额外说明变化的性质。
- source_word: הֲגַם שָׁאוּל בַּנְּבִיאִים
  choice: 扫罗也在先知中间吗
  rationale: הֲגַם 可表示“也”或带惊讶意味的“连……也”。正文用“也”保持自然，并用脚注保留语气更强的可能译法。
theological_decisions:
- issue: 如何描述扫罗的先知性活动而不暗示固定职分
  choice: 正同先知们一起说预言
  alternative: 同先知们一起陷入先知性的狂热；在先知们中间表现得像先知
  rationale: 经文报告扫罗参与先知性活动，却未在本节断言他由此永久成为先知。正文保留“说预言”，既不把现象缩减为狂热状态，也不把暂时活动解释成固定职分。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“瞧”保留原文突显意外情景的语气；“说预言”沿用普通读者可理解的圣经用语。脚注标记均置于所说明的正文词语之后。
