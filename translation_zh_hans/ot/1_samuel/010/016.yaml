base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/016.yaml
  text: Saul said to his uncle[b][a], “He plainly told us that the donkeys had been found.” But he did not tell him about the matter of the kingship that Samuel had spoken of.
translation:
  language: zh_hans
  text: 扫罗对叔叔说：“他明明告诉我们，那些母驴已经找到了。”至于撒母耳所说的王权之事[a]，扫罗却没有告诉叔叔。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “王权之事”或译“国度之事”。这里更可能是指扫罗将要作王这件事，而不是作为疆域的国度。
    reason: alternative_reading
lexical_decisions:
- source_word: דּוֹדוֹ
  choice: 叔叔
  rationale: 在本叙事的亲属语境中，דּוֹד指叔父一类的男性长辈；现代汉语以“叔叔”表达自然，也不采用在此不合语境的“爱人”等义项。
- source_word: הַגֵּד הִגִּיד
  choice: 明明告诉
  rationale: 不定式绝对式与限定动词连用具有加强语气的作用；“明明告诉”既传达强调，也符合口语对答的自然表达。
- source_word: נִמְצְאוּ
  choice: 已经找到了
  rationale: 该形式在这里表示失去的驴已被找到；“已经”体现相对于扫罗转述时点而言事情已经完成。
- source_word: הָאֲתֹנוֹת
  choice: 母驴
  rationale: 希伯来词明确指雌驴；“母驴”在现代汉语中自然且准确，无须省略原文所含的性别信息。
- source_word: דְּבַר הַמְּלוּכָה
  choice: 王权之事
  rationale: דָּבָר在此指事情或事项，מְלוּכָה可指君王身份、王权或王国；结合撒母耳刚向扫罗宣告并膏立他的语境，“王权之事”最贴切，同时以脚注保留另一种理解。
- source_word: לֹא הִגִּיד לוֹ
  choice: 扫罗却没有告诉叔叔
  rationale: 原文以代词表达主语和间接宾语；中文若直译为“他没有告诉他”容易含混，因此按上下文明确为扫罗和叔叔，不增加新的解释。
- source_word: אֲשֶׁר אָמַר שְׁמוּאֵל
  choice: 撒母耳所说的
  rationale: 关系从句修饰“王权之事”；此译保持原文简洁，也不把“说”扩大解释为更具体的行动。
theological_decisions:
- issue: מְלוּכָה在本节指“王权”还是“国度”
  choice: 正文译“王权”
  alternative: “国度”
  rationale: 紧邻语境关乎扫罗被立为王，因此“王权”较可能指他所得的君王身份或统治权；但该名词也可指国度，故以脚注保留词义张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“至于……却……”清楚呈现前后对照；重复“扫罗”和“叔叔”以避免连续代词造成歧义。
