  yaml_path: translation/ot/1_samuel/010/026.yaml
  text: Saul also went to his home at Gibeah[b][a], and with him went the valiant men whose hearts God had touched.
translation:
  language: zh_hans
  text: 扫罗也回到他在基比亚的家；有一群勇士[a]与他同行，他们的心曾被上帝触动[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “勇士”也可译作“有能力的人”或“战士”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译为“上帝触动了他们的心”；这里表示上帝影响了他们内在的意愿和倾向。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: 也
  rationale: 承接上文并表示叙事中的增添；“也”在现代汉语中简洁自然。
- source_word: הָלַךְ לְבֵיתוֹ גִּבְעָתָה
  choice: 回到基比亚自己的家
  rationale: לְבֵיתוֹ 指“到自己的家”，גִּבְעָתָה 以方向词尾标明目的地是基比亚；“回到”符合回家的汉语表达，同时保留地点信息。
- source_word: וַיֵּלְכוּ עִמּוֹ
  choice: 也和他一同去了
  rationale: 保留同行之意及希伯来叙事的连续性；补出“也”使两个并列行动在汉语中衔接自然。
- source_word: הַחַיִל
  choice: 勇士
  rationale: 此处指随同扫罗的一群有能力、有勇力的人，而不是作为整体的军队；“勇士”简洁地保留其能力与军事色彩。
- source_word: אֲשֶׁר נָגַע אֱלֹהִים בְּלִבָּם
  choice: 那些被上帝触动了心的
  rationale: 直接保留“触动”与“心”的原文意象，表达上帝影响他们内在意愿，却不把这种作用具体解释为重生、强制或单纯的情感激励。
- source_word: אֱלֹהִים
  choice: 上帝
  rationale: 此处明确指以色列的上帝；“上帝”是现代汉语中清楚、庄重的通行译法。
- source_word: לֵב
  choice: 心
  rationale: 希伯来语“心”可涵盖思想、意志和内在倾向；保留“心”既忠于原文，也让上下文承载其较宽含义。
theological_decisions:
- issue: 上帝“触动”这些人之心的性质
  choice: 按原文意象译为“被上帝触动了心”，只明确上帝主动影响其内在倾向。
  alternative: 译为“上帝激励了他们”或“上帝感动了他们的心”。
  rationale: 原文肯定上帝的主动作为，却没有说明其具体机制或作用范围；直译意象可避免擅自解释为重生、不可抗拒的强制或仅仅情绪上的鼓舞。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“基比亚自己的家”兼顾地点与个人住所；“被上帝触动了心”保留希伯来文的身体意象和神学张力。
