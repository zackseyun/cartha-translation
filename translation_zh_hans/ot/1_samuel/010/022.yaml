  text: וַ/יִּשְׁאֲלוּ עוֹד֙ בַּֽ/יהוָ֔ה הֲ/בָ֥א ע֖וֹד הֲלֹ֣ם אִ֑ישׁ וַ/יֹּ֣אמֶר יְהוָ֔ה הִנֵּה ה֥וּא נֶחְבָּ֖א אֶל הַ/כֵּלִֽים־ס־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/022.yaml
  text: So they inquired of Yahweh again[a], “Has the man come here yet?” And Yahweh said, “Behold, he has hidden himself among the baggage.”
translation:
  language: zh_hans
  text: 他们又求问雅威：“那人已经到这里来了吗？”雅威说：“看哪，他藏在行装中间[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “行装”原文泛指器物、用具或装备；这里很可能指聚集之人所带的行李或物资。
    reason: 说明 כֵּלִים 的宽泛词义及其在本段语境中的具体译法。
lexical_decisions:
- source_word: וַיִּשְׁאֲלוּ עוֹד בַּיהוָה
  choice: 他们又求问雅威
  rationale: שׁאל 与 בַּיהוָה 连用，表示向神寻求答复，并非一般性的询问；“求问”自然保留了宗教咨询的正式意味。עוֹד 在此表示动作重复，译为“又”。
- source_word: הֲבָא עוֹד הֲלֹם אִישׁ
  choice: 那人已经到这里来了吗？
  rationale: 完成式 בָּא 询问到达是否已经发生；第二个 עוֹד 在问句中有“已经／尚未”的语用作用。אִישׁ 结合上下文指正在寻找的特定男子，即扫罗，故译“那人”。
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留原文引人注意、强调下文的语气，同时符合庄重而易懂的现代汉语叙事风格。
- source_word: נֶחְבָּא
  choice: 他藏
  rationale: חבא 的尼法勒形在此依上下文具有反身含义，表示扫罗把自己藏起来；汉语“他藏在……”已自然表达这一状态。
- source_word: אֶל הַכֵּלִים
  choice: 在行装中间
  rationale: כֵּלִים 可泛指器物、用具或装备；在众人聚集并携带物品的场景中，“行装”比“器皿”更清楚自然，同时以脚注保留词义范围。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；“雅威”较贴近其通常重构的读音，也保留其作为专名的性质，不以称号替代。
translation_notes:
  register: 采用现代、庄重而口语可懂的叙事语言。“求问”体现向神寻求答复的正式行为；“看哪”保留原文的强调语气。脚注标记紧随其所解释的“行装中间”。
