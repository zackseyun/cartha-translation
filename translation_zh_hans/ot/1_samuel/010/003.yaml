base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/003.yaml
  text: 'Then you will pass on from there and go farther[a], and you will come to the oak of Tabor. There three men going up to God at Bethel will meet you: one carrying three young goats, another carrying three loaves of bread[c][b], and another carrying a wineskin.'
translation:
  language: zh_hans
  text: 你从那里继续往前走，就会来到他泊的大树[a]那里。那里有三个正往伯特利上去见上帝的人会遇见你[b]：一个带着三只小山羊，一个带着三个饼，另一个带着一皮袋酒[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “大树”也可译作“橡树”或“笃耨香树”；希伯来语所用的词可泛指这一类高大的树。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“上到上帝那里，伯特利”；这可能是指前往伯特利的一处敬拜地点。
    reason: cultural_note
  - marker: c
    text: 直译为“一皮袋酒”，即装在兽皮袋中的酒。
    reason: cultural_note
lexical_decisions:
- source_word: וְחָלַפְתָּ מִשָּׁם וָהָלְאָה
  choice: 你从那里继续往前走
  rationale: 合并表达“从那里经过并再向前”的连续动作，使现代汉语自然，同时保留继续前行之意。
- source_word: אֵלוֹן תָּבוֹר
  choice: 他泊的大树
  rationale: אֵלוֹן可指橡树、笃耨香树一类显著的大树；正文采用不武断限定树种的“大树”，脚注列出常见具体译法。
- source_word: וּמְצָאוּךָ
  choice: 你会……遇见
  rationale: 原义为“他们会找到你”，在相遇场景中译为“遇见”更符合汉语习惯，也不暗示他们刻意寻找扫罗。
- source_word: עֹלִים אֶל הָאֱלֹהִים בֵּית אֵל
  choice: 上伯特利到上帝那里去的人
  rationale: 保留“上去”“到上帝那里”及“伯特利”三项信息，不擅自补入原文未明说的“敬拜”或“献祭”。
- source_word: גְדָיִים
  choice: 小山羊
  rationale: 准确表达幼羊为山羊羔，并避免单说“小羊”可能被理解为绵羊。
- source_word: כִּכְּרוֹת לֶחֶם
  choice: 饼
  rationale: 此处指成个的圆饼或面包；“三个饼”简洁自然，符合古代食物形态。
- source_word: נֵבֶל יָיִן
  choice: 一皮袋酒
  rationale: 同时表达容器及其内容；较单译“酒囊”更明确地保留原文的“酒”。
theological_decisions:
- issue: “上伯特利到上帝那里去”的含义
  choice: 保留朝向上帝并与伯特利相连的表述，不明确增译具体宗教行为。
  alternative: 上伯特利敬拜上帝；上伯特利到上帝的殿去
  rationale: 上下文很可能描述前往敬拜地点，但希伯来文本本句没有明说“敬拜”，也没有“殿”一词；直译式表达保留其宗教指向及原有张力。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“他泊”“伯特利”沿用常见圣经地名译法；句式按希伯来叙事次序展开，同时避免生硬重复。
