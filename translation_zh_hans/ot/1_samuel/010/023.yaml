base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/023.yaml
  text: So they ran and took him from there[a], and he stood in the midst of the people. And he was taller than all the people from his shoulders upward.
translation:
  language: zh_hans
  text: 他们就跑去，把他从那里带来[a]。他站在百姓中间，比所有百姓都高出一头。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“把他从那里带出来。”希伯来语动词通常表示“拿、带”；按上下文，这里是指把他从藏身之处带出来（见第22节）。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּרֻצוּ
  choice: 他们就跑去
  rationale: רוץ表示奔跑或急速前往；“跑去”直接保留叙事的生动感，也自然衔接后面的动作。
- source_word: וַיִּקָּחֻהוּ מִשָּׁם
  choice: 把他从那里带来
  rationale: לקח的基本义是“拿、带、领”；此处指众人从扫罗藏身之处将他带到会众面前。“带来”符合汉语场景方向，同时脚注保留更贴近字面的译法。
- source_word: וַיִּתְיַצֵּב בְּתוֹךְ הָעָם
  choice: 他站在百姓中间
  rationale: יצב的Hitpael形可指站定或站立；这里用“站在”自然清楚，不额外加入礼仪性或主动展示自己的含义。בְּתוֹךְ译作“中间”，保留空间意味。
- source_word: וַיִּגְבַּהּ מִכָּל הָעָם
  choice: 比所有人都高出
  rationale: גבהּ在此表示身量上的高；比较结构מִן译为“比……高”，符合现代汉语。הָעָם依上下文自然译作“所有人”，避免重复“百姓”造成生硬。
- source_word: מִשִּׁכְמוֹ וָמָעְלָה
  choice: 一个肩头
  rationale: 希伯来语字面为“从他的肩膀往上”，是说扫罗比众人高出肩膀以上的部分。汉语惯用“高出一个肩头”简洁准确地表达这一身高差。
