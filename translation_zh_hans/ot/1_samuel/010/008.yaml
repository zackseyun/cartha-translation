base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/008.yaml
  text: And you shall go down before me to Gilgal. And behold[a], I am coming down to you to offer burnt offerings and to sacrifice peace offerings. You shall wait seven days, until I come to you and make known to you what you shall do.
translation:
  language: zh_hans
  text: 你要先于我下到吉甲。看哪，我会下到你那里，献上燔祭，献平安祭[a]。你要等候七天，直到我到你那里，指示你该做什么。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “平安祭”也可理解为“团契祭”或“福祉祭”。这个希伯来语祭名包含平安、完整、福祉以及共同分享的含义。
    reason: 说明 שְׁלָמִים 的语义范围及可选译法。
lexical_decisions:
- source_word: וְיָרַדְתָּ
  choice: 你要下到
  rationale: 该形式在这里属于指示性、预告性的动作序列；“要”自然表达命令意味，“下到”保留 ירד 的空间方向。
- source_word: לְפָנַי
  choice: 先于我
  rationale: 原文直译为“在我面前”，在本语境中主要表示扫罗比撒母耳先到吉甲；“先于我”兼顾次序，并避免现代汉语中“在我面前”可能造成的误解。
- source_word: הַגִּלְגָּל
  choice: 吉甲
  rationale: 按现代中文圣经常用译名音译地名。
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留 הִנֵּה 提醒注意并增强现场感的功能，也符合庄重而易懂的经文语体。
- source_word: יֹרֵד אֵלֶיךָ
  choice: 我会下到你那里
  rationale: 分词表达已定或即将发生的行动；“会”在现代汉语中自然，“下到你那里”保留方向及说话者朝向对方所在地的含义。
- source_word: לְהַעֲלוֹת עֹלוֹת
  choice: 献上燔祭
  rationale: 这是献全牲燔祭的固定祭祀用语；“献上”自然传达 העלה 的使之上升及献祭含义。
- source_word: לִזְבֹּחַ זִבְחֵי שְׁלָמִים
  choice: 宰献平安祭
  rationale: “宰献”保留 זבח 的宰杀献祭含义；“平安祭”是 שְׁלָמִים 的通行中文术语，同时用脚注交代其完整、福祉与团契共享的语义范围。
- source_word: שִׁבְעַת יָמִים תּוֹחֵל
  choice: 你要等候七天
  rationale: יחל 可指等候或盼望；程序性语境明确要求在指定时间内等候。
- source_word: עַד בּוֹאִי אֵלֶיךָ
  choice: 直到我到你那里
  rationale: 将介词加带后缀的不定式结构自然译为现代汉语时间从句。
- source_word: וְהוֹדַעְתִּי לְךָ
  choice: 指示你
  rationale: הודיע 的基本义是“使知道”；此处所告知的是扫罗应采取的行动，“指示”简洁保留告知和指导的语境含义。
- source_word: אֵת אֲשֶׁר תַּעֲשֶׂה
  choice: 你该做什么
  rationale: 自然表达关系从句，并以“该”体现所要领受的行动指示，而不额外强化为绝对命令。
theological_decisions:
- issue: 祭名 שְׁלָמִים 的译法
  choice: 平安祭
  alternative: 团契祭；福祉祭
  rationale: 该词所指的祭与平安、完整、福祉以及共同分享有关。“平安祭”是最通行且易识别的中文祭名，但不应据此把其语义缩窄为单一教义概念，因此在脚注保留其他可能含义。
translation_notes:
  register: 采用现代、庄重而清楚的普通话。“看哪”保留原文的强调和现场感；祭祀术语采用通行译名，并以脚注补充其较宽的希伯来语含义。
