  text: When he had finished prophesying[a], he came to the high place.
translation:
  language: zh_hans
  text: 他说明预言后，来到那高处[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“丘坛”；希伯来文为“那高处”，在此可指设在高处的敬拜场所。
    reason: 说明“高处”的可选译法及其在语境中的敬拜场所含义，同时不在正文中预断其性质或合法性。
lexical_decisions:
- source_word: וַיְכַל
  choice: 停止……后
  rationale: 这里的 כלה 表示前一活动结束；用时间结构“停止……后”自然地表达该活动结束在随后行动之前。
- source_word: מֵהִתְנַבּוֹת
  choice: 说预言
  rationale: נבא 的这一形式指从事说预言的活动；不额外加入“受感”“狂热”等原文未明说的状态。
- source_word: וַיָּבֹא
  choice: 就来到
  rationale: בוא 可按叙事视角译为“来、去、到达”；“来到”自然表达扫罗抵达该处，又不过度限定移动视角。
- source_word: הַבָּמָה
  choice: 那高处
  rationale: במה 常指设在高处的敬拜场所。正文直译为“那高处”，保留希伯来语的表达，并以脚注说明其礼仪含义，避免在正文中预先判断该场所的性质或合法性。
theological_decisions:
- issue: הַבָּמָה 所指敬拜场所的礼仪性质
  choice: 那高处
  alternative: 邱坛；高处的敬拜场所
  rationale: 该词通常具有敬拜场所的含义，但本节没有对其合法性作出评价。采用“那高处”并加脚注，既保留原文措辞，也不替文本解决以色列敬拜史中有关这类场所的神学张力。
translation_notes:
  register: 采用简洁、庄重而通顺的现代标准汉语。“说预言”保留动作本身，不增添原文未明说的心理或灵性状态；脚注标记置于其实际说明的“那高处”之后。
