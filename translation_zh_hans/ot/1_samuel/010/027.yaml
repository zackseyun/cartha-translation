base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/027.yaml
  text: But worthless men said[a], “How can this man save us?” And they despised him and did not bring him a gift. But he was like one keeping silent.
translation:
  language: zh_hans
  text: 可是有些无赖说：“这人怎能救我们？”他们就藐视他，也没有给他送礼物。他却像没有听见一样[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他却像一个保持沉默的人。”希伯来语这一表达可指保持沉默，也可指仿佛没有听见。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְנֵי בְלִיַּעַל
  choice: 无赖
  rationale: 这是希伯来语习语，字面为“卑劣之子”，指品行卑劣、目无法纪的人。“无赖”自然简洁，并保留其道德贬义。
- source_word: מַה יֹּשִׁעֵנוּ זֶה
  choice: 这人怎能救我们？
  rationale: 疑问词与使役形态的“拯救”构成带轻蔑意味的质疑；“这人怎能救我们”在现代汉语中自然传达怀疑和蔑视。
- source_word: וַיִּבְזֻהוּ
  choice: 他们就藐视他
  rationale: בזה 表示轻看、视为无足轻重；“藐视”简洁地保持叙事语气及原文力度。
- source_word: מִנְחָה
  choice: 礼物
  rationale: 在君王语境中指献给统治者的礼物，也可能具有承认臣服的意味；“礼物”不把其限定为宗教祭物或正式贡物。
- source_word: כְּמַחֲרִישׁ
  choice: 像没有听见一样
  rationale: 该表达源于 חרשׁ，可描写保持沉默，也可作为惯用表达表示对挑衅置若罔闻。此译法保留比较词 כְּ，并自然表现扫罗不作回应的状态。
- source_word: וַיְהִי
  choice: 他却……一样
  rationale: 这里 היה 引出扫罗当时的表现；结合比较结构，汉语以“他却像……一样”自然表达，并用“却”显出他与无赖行为之间的反差。
theological_decisions:
- issue: 扫罗面对轻蔑时的反应
  choice: 他像没有听见一样，不作回应
  alternative: 他保持沉默
  rationale: כְּמַחֲרִישׁ 可侧重沉默，也可表示仿佛耳聋、对侮辱置若罔闻。正文采用自然的汉语惯用表达，脚注保留较直接的“保持沉默”，不进一步断定其内在动机。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“无赖”保留强烈贬义；“礼物”避免误解为祭物；句末保留原文对扫罗克制反应的含蓄描写。
