base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/004.yaml
  text: They will ask you about your welfare and give you two loaves of bread[c][b][a], and you shall receive them from their hand.
translation:
  language: zh_hans
  text: 他们会向你问安[a]，给你两个饼[b]；你要从他们手中接过来[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译为“他们会问你的平安”，意思是他们会询问你的近况，向你问安。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语直译为“两个饼”；这里的“饼”指供食用的面饼。
    reason: lexical_alternative
  - marker: c
    text: 或译：“你要从他们手中拿过来。”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁאֲלוּ לְךָ לְשָׁלוֹם
  choice: 他们会问候你
  rationale: 这个希伯来语习语字面指询问一个人的平安或近况，在此用于见面问安。现代汉语用“问候你”自然简洁，同时在脚注中保留较直译的含义。
- source_word: שָׁלוֹם
  choice: 平安（体现在“问候”这一习语译法中）
  rationale: 此处不是抽象意义上的和平，而是指一个人的安好、近况；结合整个习语译为“问候”。
- source_word: וְנָתְנוּ לְךָ
  choice: 给你
  rationale: 连续叙事形式承接前文的预告，中文用“会……给你”自然表达将来发生的事。
- source_word: שְׁתֵּי לֶחֶם
  choice: 两个饼
  rationale: לֶחֶם 在带数词的可数语境中指两个成形的饼。“两个饼”比“两个面包”更贴近古代食物形态，也符合现代汉语表达。
- source_word: וְלָקַחְתָּ מִיָּדָם
  choice: 你要从他们手中接过来
  rationale: לקח 基本义是“拿、取”，但在对方递给食物的语境中，“接过来”自然体现接受这一动作；“要”保留此处预告中带有指示性的语气。
- source_word: מִיָּדָם
  choice: 从他们手中
  rationale: 保留希伯来语“从他们的手”这一具体意象；中文集合式的“他们手中”自然，无须机械译成复数。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“问候”传达希伯来语问安习语，“两个饼”保留古代语境，“从他们手中接过来”兼顾原文意象与中文流畅度。所有脚注标记均紧随所解释的词语。
