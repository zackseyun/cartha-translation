base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/009.yaml
  text: And it happened[a], when he turned his back to go from Samuel, that God gave him another heart[b], and all these signs came to pass on that day.
translation:
  language: zh_hans
  text: 他转身离开撒母耳时[a]，上帝就使他有了另一颗心[b]。当天，这一切兆头都应验了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“他转过肩膀去离开撒母耳时”，意思是他转身离去时。
    reason: 说明希伯来语的身体意象及其惯用含义。
  - marker: b
    text: 原文的表达近似“上帝为他改变成另一颗心”，不合现代汉语的通常说法；也可译为“上帝使他有了一颗不同的心”。这里没有具体说明这种内在改变的性质。
    reason: 说明 הפך（改变、转变）与“另一颗心”的特殊组合，并保留其解释空间。
lexical_decisions:
- source_word: וְהָיָה
  choice: （融入“……时”句式，不另译）
  rationale: 这里与时间从句共同引出随后发生的事；现代汉语无需机械译作“事情是这样”，省去后更自然，叙事关系仍然清楚。
- source_word: כְּהַפְנֹתוֹ שִׁכְמוֹ
  choice: 他转身……时
  rationale: 希伯来语字面为“他转过肩膀时”，表示转身离去。正文采用自然汉语“转身”，脚注保留其字面意象。
- source_word: לָלֶכֶת מֵעִם שְׁמוּאֵל
  choice: 离开撒母耳
  rationale: 准确表达从撒母耳那里离去；比“从撒母耳那里走”更符合现代汉语。
- source_word: וַיַּהֲפָךְ לוֹ אֱלֹהִים לֵב אַחֵר
  choice: 上帝就为他换了另一颗心
  rationale: “换”保留 הפך 的转变、改变语义，并较贴近“为他……另一颗心”的特殊原文结构；不将其具体解释为重生、性格改造或勇气增加。
- source_word: כָּל הָאֹתוֹת הָאֵלֶּה
  choice: 这一切兆头
  rationale: אות 在此指撒母耳预告、随后发生以作印证的事件；“兆头”既保留指示性，也适合叙事语境。
- source_word: וַיָּבֹאוּ
  choice: 都应验了
  rationale: 字面为“都来了”；与预告的兆头搭配时，汉语“应验”自然表达这些事实际发生，但不额外说明其机制。
- source_word: בַּיּוֹם הַהוּא
  choice: 当天
  rationale: 简洁自然地表达“在那一天”，并强调这些兆头同日发生。
theological_decisions:
- issue: “另一颗心”所指的内在改变性质
  choice: 译作“上帝就为他换了另一颗心”，保留由上帝造成的真实内在改变，但不界定其教义性质。
  alternative: 上帝赐给他一颗新心／上帝改变了他的性情／上帝使他有勇气作王
  rationale: 原文说的是“另一颗心”，并未明确等同于重生，也未把改变限缩为性格或勇气。直译核心意象可保留这里的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“换了另一颗心”略带源语质感，用以保留原文不同寻常的表达；脚注说明字面结构和未决的神学含义。
