  rationale: 将“换了另一颗心”改为“使他有了另一颗心”，以自然汉语表达上帝所造成的内在改变，同时保留“另一颗心”的源语张力。修订脚注b，使其既如实说明原文的非常规表达，也不把改变的性质作教义化界定。
