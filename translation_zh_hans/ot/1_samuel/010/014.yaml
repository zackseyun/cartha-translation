base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/014.yaml
  text: Then Saul’s uncle said to him and to his young man[a], “Where did you go?” And he said, “To seek the donkeys. When we saw that they were nowhere to be found[b], we went to Samuel.”
translation:
  language: zh_hans
  text: 扫罗的叔叔问他和他的随从[a]：“你们到哪里去了？”扫罗回答：“去找那些母驴。我们发现找不到那些母驴，就到撒母耳那里去了[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “随从”或译“年轻人”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“就来到了撒母耳那里。”
    reason: lexical_alternative
lexical_decisions:
- source_word: דּוֹד שָׁאוּל
  choice: 扫罗的叔叔
  rationale: דּוֹד在此叙事亲属语境中通常指“叔叔”；采用明确而自然的现代汉语称谓。
- source_word: אֵלָיו וְאֶל נַעֲרוֹ
  choice: 问他和他的随从
  rationale: נַעַר可指年轻人、侍从或仆人；这里是陪同扫罗出行的人。“随从”自然表达其角色，又不刻意强调奴仆身份。
- source_word: אָן הֲלַכְתֶּם
  choice: 你们到哪里去了？
  rationale: אָן询问去向，动词为第二人称阳性复数；“到哪里去了”符合现代汉语对已发生行程的问法。
- source_word: לְבַקֵּשׁ אֶת הָאֲתֹנוֹת
  choice: 去找那些母驴
  rationale: בקשׁ意为寻找；אֲתֹנוֹת明确是阴性复数“母驴”，正文予以保留。
- source_word: וַנִּרְאֶה כִי אַיִן
  choice: 我们见找不着
  rationale: 原文简略，直义近于“我们看见没有”；按上下文指发现母驴不在、未能找到。“见找不着”保持简洁并补足自然汉语所需含义。
- source_word: וַנָּבוֹא אֶל שְׁמוּאֵל
  choice: 就到撒母耳那里去了
  rationale: בוא基本义为“来、到达”，与אֶל合用表示趋向撒母耳；中文采用“到……那里去”可自然叙述，并保留到达之意。
