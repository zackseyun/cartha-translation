source:
  edition: WLC
  text: אַ֣חַר כֵּ֗ן תָּבוֹא֙ גִּבְעַ֣ת הָ/אֱלֹהִ֔ים אֲשֶׁר שָׁ֖ם נְצִבֵ֣י פְלִשְׁתִּ֑ים וִ/יהִי֩ כְ/בֹאֲ/ךָ֨ שָׁ֜ם הָ/עִ֗יר וּ/פָגַעְתָּ֞ חֶ֤בֶל נְבִיאִים֙ יֹרְדִ֣ים מֵֽ/הַ/בָּמָ֔ה וְ/לִ/פְנֵי/הֶ֞ם נֵ֤בֶל וְ/תֹף֙ וְ/חָלִ֣יל וְ/כִנּ֔וֹר וְ/הֵ֖מָּה מִֽתְנַבְּאִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/005.yaml
  text: After that you will come to Gibeath-ha-Elohim[a], where the Philistine garrison is. And when you enter there, into the city, you will meet a band of prophets coming down from the high place, with harp, tambourine, flute, and lyre before them[c][b], and they will be prophesying.
translation:
  language: zh_hans
  text: 此后，你要到上帝之丘[a]，那里有非利士人的驻军[b]。你来到那座城时，会遇见一队先知从丘坛下来；他们前面有竖琴、手鼓、笛子和里拉琴[c]，他们正在说预言。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “上帝之丘”也可理解为地名“上帝的基比亚”；原文既可能是专名，也可能是对这个地点的描述。
    reason: alternative_reading
  - marker: b
    text: “驻军”也可译作“驻防点”或“官员”；原词既可指军事据点，也可指被委任的官员，本处语境较支持“驻军”。
    reason: alternative_reading
  - marker: c
    text: 这些古代乐器的确切形制不能完全确定：“竖琴”也可能是琉特琴一类的乐器，“笛子”也可理解为管笛。
    reason: lexical_alternative
lexical_decisions:
- source_word: גִּבְעַת הָאֱלֹהִים
  choice: 上帝之丘
  rationale: 该短语既可能是地名，也可能是对地点的描述。“上帝之丘”保留其构词意义，并以脚注说明其专名可能性，避免用生硬音译掩盖原文的双重理解。
- source_word: נְצִבֵי פְלִשְׁתִּים
  choice: 非利士人的驻军
  rationale: נְצִיב可指驻防点，也可指官员；本段的地域和叙事语境较支持军事意义，但以脚注保留另一可能。
- source_word: וִיהִי כְבֹאֲךָ שָׁם הָעִיר
  choice: 你进那里的城时
  rationale: 以自然现代汉语表达希伯来语的时间从句，同时兼顾“那里”和“城”两个成分。
- source_word: וּפָגַעְתָּ
  choice: 会遇见
  rationale: 准确表达在路上碰见或遇到之意，且符合现代汉语叙事习惯。
- source_word: חֶבֶל נְבִיאִים
  choice: 一队先知
  rationale: חֶבֶל在此指共同活动的一群人；“一队”简明自然，也与他们集体行进的画面相合。
- source_word: יֹרְדִים מֵהַבָּמָה
  choice: 从丘坛下来
  rationale: בָּמָה指设于高处或称为“高处”的祭祀场所。“丘坛”比单纯的“高地”更能传达其礼仪性质。
- source_word: נֵבֶל
  choice: 竖琴
  rationale: 古代乐器的准确形制不能确定；“竖琴”是便于普通读者理解的近似名称，并在脚注注明可能的其他辨识。
- source_word: תֹף
  choice: 手鼓
  rationale: 该词通常指手持的敲击乐器；“手鼓”比“鼓”具体，也不预设它具有现代铃鼓的全部构造。
- source_word: חָלִיל
  choice: 笛子
  rationale: 该词指管乐器；“笛子”通俗清楚，脚注保留“管笛”等可能。
- source_word: כִּנּוֹר
  choice: 里拉琴
  rationale: 该乐器一般辨识为里拉琴类；采用音意结合的现代名称，并与נֵבֶל所译“竖琴”区分。
- source_word: וְהֵמָּה מִתְנַבְּאִים
  choice: 他们正在说预言
  rationale: 保留动词所表达的先知性活动及其进行状态，不进一步断定这是狂喜行为、受感音乐或某种特定言语形式。
theological_decisions:
- issue: מִתְנַבְּאִים所指先知性活动的性质
  choice: 他们正在说预言
  alternative: 他们进入先知性的狂喜状态；他们受感唱颂
  rationale: 原文明确描述先知性活动，却没有限定其外在表现。“说预言”保留核心意义，不把可能的狂喜、音乐或颂赞性质写入正文。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“丘坛”传达古代祭祀高处的含义；乐器名称选用当代读者较易识别的近似词，并以脚注保留器物辨识上的不确定性。
