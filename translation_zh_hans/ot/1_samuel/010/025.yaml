id: 1SA.10.25
reference: 1 Samuel 10:25
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יְדַבֵּ֨ר שְׁמוּאֵ֜ל אֶל הָ/עָ֗ם אֵ֚ת מִשְׁפַּ֣ט הַ/מְּלֻכָ֔ה וַ/יִּכְתֹּ֣ב בַּ/סֵּ֔פֶר וַ/יַּנַּ֖ח לִ/פְנֵ֣י יְהוָ֑ה וַ/יְשַׁלַּ֧ח שְׁמוּאֵ֛ל אֶת כָּל הָ/עָ֖ם אִ֥ישׁ לְ/בֵיתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/025.yaml
  text: Then Samuel told the people the rights and duties of the kingship[a], and he wrote them in the book and laid it before Yahweh. Then Samuel sent all the people away[b], each man to his house.
translation:
  language: zh_hans
  text: 撒母耳向百姓说明王权的规章[a]，把这些写在书卷上，放在雅威面前。随后，撒母耳遣散众百姓，让他们各自回家[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“王权的惯例”或“王权制度的章程”。希伯来语可指有关君王统治的法定规范，也可指既定做法。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语直译为“各人回自己的家”，是表示百姓分别返回各自家庭的逐一分配说法。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 说明
  rationale: 此处动词带有说话对象和内容；“说明”自然地表达撒母耳向百姓陈述相关规定，而不只是泛指“说话”。
- source_word: מִשְׁפַּט הַמְּלֻכָה
  choice: 王权的规章
  rationale: מִשְׁפַּט 可指法定权利、规范、条例或惯例，מְלֻכָה 在这里指君王职分或王权制度。“王权的规章”简洁保留其制度性和规范性，同时不把含义限定为单方面的君王权利。
- source_word: וַיִּכְתֹּב בַּסֵּפֶר
  choice: 把这些写在书卷上
  rationale: “这些”回指刚说明的各项规章；סֵפֶר 可指书卷或文书，在古代叙事语境中译作“书卷”自然且具体。
- source_word: וַיַּנַּח לִפְנֵי יְהוָה
  choice: 放在雅威面前
  rationale: 忠实表达“安放、置于……面前”，并保留这份书面记录被存放在神面前的含义。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语中对四字神名的常见音译呈现其专名性质，而不以称号替代。
- source_word: וַיְשַׁלַּח
  choice: 遣散
  rationale: 上下文表示撒母耳让聚集的百姓离去，并非差派他们执行任务；“遣散”准确而简练。
- source_word: אִישׁ לְבֵיתוֹ
  choice: 让他们各自回家
  rationale: 希伯来语采用阳性单数作逐一分配表达；现代汉语“各自回家”自然传达每个人分别返回自己住处的意思。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名。正文采用“雅威”音译，以保留这是以色列之神专名的性质；“耶和华”是汉语传统中的另一种音译形式。
- issue: מִשְׁפַּט הַמְּלֻכָה 所指的王权规范
  choice: 王权的规章
  alternative: 王权的权利和义务／王权的惯例
  rationale: 该短语既可能侧重法定章程，也可能指既定的施政惯例。正文不将其限定为君王权利或双向义务，而用较宽泛的“规章”保留语义张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“王权”指君王职分及其统治制度，不指疆域；“书卷”符合古代书写背景。句式避免生硬照搬希伯来语，同时保留原文的叙事推进和制度性措辞。
