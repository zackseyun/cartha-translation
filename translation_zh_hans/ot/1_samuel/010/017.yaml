  text: Then Samuel called the people together to Yahweh at Mizpah[a].
translation:
  language: zh_hans
  text: 撒母耳在米斯巴把百姓召集到耶和华面前[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “召集”也可译作“召唤”或“召来”。原文动词在这里以“百姓”为宾语，指召集会众。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּצְעֵק
  choice: 召集
  rationale: 此处动词以“百姓”为直接宾语，表示召集或传唤众人，而不是向他们呼喊；“召集”准确且符合现代汉语叙事习惯。
- source_word: אֶת הָעָם
  choice: 百姓
  rationale: עָם在这里指以色列民众；“百姓”是自然、庄重且贴合上下文的译法。
- source_word: אֶל יְהוָה
  choice: 来到耶和华面前
  rationale: 介词אֶל基本表示朝向、到；这里描述百姓被召集到耶和华那里。“来到……面前”在中文中清楚表达其礼仪与盟约场景，同时不将其误解为地点名称。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名“耶和华”对应四字神名，保留其作为以色列之神专名的功能，而不译为一般称号“主”。
- source_word: הַמִּצְפָּה
  choice: 到米斯巴
  rationale: 此处是地名；结合前面的方向介词，译作“到米斯巴”，并调整中文语序，使地点与“来到耶和华面前”的关系清晰自然。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。中文采用广为人知且具有专名功能的“耶和华”，不以“主”替代，也不额外加入解释性神学内容。
- issue: אֶל יְהוָה与地点“米斯巴”的关系
  choice: 到米斯巴，来到耶和华面前
  alternative: 在米斯巴向耶和华召集百姓
  rationale: 原文连续使用“到/向耶和华”和“米斯巴”，语法较凝练。正文保留朝向耶和华的意义，并以自然中文表明聚集地点；脚注说明更贴近原文词序的译法，避免过度确定其礼仪含义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“召集百姓”简洁传达集会含义；通过“到米斯巴，来到耶和华面前”避免生硬的“把百姓召到耶和华”，同时用脚注保留希伯来文较凝练的结构及其可能的理解。
