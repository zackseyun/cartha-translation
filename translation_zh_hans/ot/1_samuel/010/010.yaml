  naturalness: 修订后删去重复的到达表述，并将“迎面而来”改为“来迎接扫罗”，使指向受词及相遇目的清晰。将“说起预言来”调整为较自然、同时仍保持宽泛的“说预言”。
  terminology: “上帝的灵”在此处准确且避免加入后期教义界定；“先知”“预言”“扫罗”“基比亚”均符合现代标准汉语圣经叙事的常用译法。脚注保留地名与普通名词两种可能，恰当保存原文歧义。
