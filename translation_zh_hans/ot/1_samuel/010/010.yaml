base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/010.yaml
  text: When they came there to the hill[a], behold, a band of prophets came to meet him, and the Spirit of God rushed upon him, and he prophesied among them.
translation:
  language: zh_hans
  text: 他们到了那山冈[a]，看哪，有一群先知来迎接扫罗；上帝的灵猛然临到他身上，他就在他们中间说预言。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“到了基比亚。”这个希伯来语形式既可理解为地名“基比亚”，也可理解为“那山冈”。
    reason: alternative_reading
lexical_decisions:
- source_word: הַגִּבְעָתָה
  choice: 来到那座山冈
  rationale: גִּבְעָה可作普通名词“山冈”，词形带定冠词和表示方向的词尾；结合上文所指的地点，正文采用普通名词，同时以脚注保留地名“基比亚”的可能。
- source_word: חֶבֶל נְבִאִים
  choice: 一群先知
  rationale: חֶבֶל在这里指结伴而行的一群人，并非“绳索”；“一群先知”准确、自然，也不额外断定其组织形式。
- source_word: לִקְרָאתוֹ
  choice: 迎面而来
  rationale: 该表达表示朝着扫罗而来、与他相遇；“迎面而来”简洁地传达移动和相遇的意味。
- source_word: רוּחַ אֱלֹהִים
  choice: 上帝的灵
  rationale: 在本段赐下征兆和能力的叙事中，此短语最自然地指上帝自己的灵；译文不加入原文未明说的后期神学界定。
- source_word: וַתִּצְלַח עָלָיו
  choice: 猛然临到扫罗身上
  rationale: צָלַח与“灵”连用时，表示带着力量突然临到某人；“猛然临到”保留了动作的突发性和强烈感。为避免中文代词在复数主语之后指代不清，将“他”明确为“扫罗”。
- source_word: וַיִּתְנַבֵּא
  choice: 说起预言来
  rationale: 该词表示从事先知性的活动；此译法保留其宽泛含义，不具体限定所说内容或表现方式。
- source_word: בְּתוֹכָם
  choice: 在他们中间
  rationale: 表示扫罗置身于那群先知之中并参与先知性活动；直译在现代汉语中也清楚自然。
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: הִנֵּה用于引起注意，并突出眼前突然出现的情景；“看哪”保留了叙事语气和庄重感。
theological_decisions:
- issue: רוּחַ אֱלֹהִים的所指
  choice: 上帝的灵
  alternative: 从上帝而来的一个灵
  rationale: 上下文描述上帝所赐的征兆以及扫罗所得的能力，因此理解为上帝自己的灵最合乎叙事；同时不借译文引入超出本节的教义性说明。
- issue: וַיִּתְנַבֵּא所描述的活动
  choice: 说起预言来
  alternative: 表现得像先知一样／受感说话
  rationale: 原文确认扫罗参与了先知性活动，却没有具体说明其内容和外在形式；采用宽泛表达，以保留这种未限定性。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“看哪”保留原文提示突发场景的语篇功能；其余措辞避免过度古雅。正文以“扫罗”代替可能含混的“他”，因为本句先以复数“他们”为主语，而原文后半明确转为单数指扫罗。
