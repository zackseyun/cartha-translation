id: 1SA.10.19
reference: 1 Samuel 10:19
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/אַתֶּ֨ם הַ/יּ֜וֹם מְאַסְתֶּ֣ם אֶת אֱלֹהֵי/כֶ֗ם אֲשֶׁר ה֣וּא מוֹשִׁ֣יעַ לָ/כֶם֮ מִ/כָּל רָעוֹתֵי/כֶ֣ם וְ/צָרֹֽתֵי/כֶם֒ וַ/תֹּ֣אמְרוּ ל֔/וֹ כִּי מֶ֖לֶךְ תָּשִׂ֣ים עָלֵ֑י/נוּ וְ/עַתָּ֗ה הִֽתְיַצְּבוּ֙ לִ/פְנֵ֣י יְהוָ֔ה לְ/שִׁבְטֵי/כֶ֖ם וּ/לְ/אַלְפֵי/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/019.yaml
  text: But today you have rejected your God[a], who himself saves you from all your calamities and distresses, and you have said to him, ‘No[b], but set a king over us.’ So now present yourselves before Yahweh by your tribes and by your thousands.
translation:
  language: zh_hans
  text: 可是今天，你们却厌弃了你们的上帝，就是那位救你们脱离一切灾祸[a]和患难的。你们竟对他说：‘你要立一个王治理我们。’如今，你们要按各支派、各千人单位[b]，站在耶和华面前。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “灾祸”所译的希伯来词也可指祸患、苦难或所遭遇的恶事。
    reason: 说明רָעוֹת在本语境中的词义范围，避免误解为以色列人所犯的恶。
  - marker: b
    text: “千人单位”也可译作“宗族”或“千人队”；这里的希伯来词可指社会或军事编组，不一定正好有一千人。
    reason: 保留אֲלָפִים在行政、宗族和军事语境中的真实歧义。
lexical_decisions:
- source_word: מְאַסְתֶּם
  choice: 厌弃了
  rationale: מָאַס表示拒绝、弃绝或轻看。“厌弃”既保留强烈的拒绝意味，也符合撒母耳责备以色列背弃上帝作王的语境。
- source_word: אֱלֹהֵיכֶם
  choice: 你们的上帝
  rationale: אֱלֹהִים虽在形式上为复数，此处由上下文和单数代词明确指以色列的独一上帝。
- source_word: מוֹשִׁיעַ לָכֶם
  choice: 救你们
  rationale: 分词表达上帝一贯施行拯救的作为；“救你们”自然简洁，并由“脱离”引出所救脱的灾难。
- source_word: מִכָּל רָעוֹתֵיכֶם וְצָרֹתֵיכֶם
  choice: 脱离一切灾祸和患难
  rationale: רָעוֹת在这里更可能指人所遭受的祸患，而非其所行的恶；צָרוֹת指困苦、患难。两个词分别译出，不将其合并。
- source_word: כִּי מֶלֶךְ תָּשִׂים עָלֵינוּ
  choice: 你要立一个王治理我们
  rationale: 本节马所拉文本先有לוֹ（“对他”），没有否定词לֹא；כִּי可引出或强调所说的内容。译文不从上下文补入“不要/不”，以免将上下文内容当作本节明文。עָלֵינוּ直译为“在我们之上”，汉语以“治理我们”自然表达王的统治关系。
- source_word: הִתְיַצְּבוּ
  choice: 列队站
  rationale: 该反身词形在此要求众人正式就位，接受拣选；“列队站”体现程序性场景，比单纯“站”更明确。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的专名“耶和华”直接表达四字神名，不用头衔替代。
- source_word: לְשִׁבְטֵיכֶם וּלְאַלְפֵיכֶם
  choice: 按各支派、各千人单位
  rationale: 两个לְ表示按群体编组。אֲלָפִים在行政或军事语境中可指“千人单位”，未必恰为一千人；正文保留其数字构词，脚注说明语义范围。
theological_decisions:
- issue: 四字神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 两者均为现代中文对神名的直接表达；采用普通中文读者更熟悉且庄重的“耶和华”，而不以“主”替换专名。
- issue: 是否在百姓的话中补出否定语气
  choice: 不补“不要/不，还是……”
  alternative: “不，还是要立一个王治理我们”
  rationale: 撒母耳记上8:19有明确的לֹא כִּי（“不，还是……”），但本节WLC读作לוֹ כִּי（“对他说……”）。翻译以本节的马所拉文本为先，保留其与前文措辞并非完全相同的张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。以“可是今天……却”表达责备性的转折；用“正是他”呈现הוּא的强调。句式避免古奥，也不额外引入特定宗派解释。
