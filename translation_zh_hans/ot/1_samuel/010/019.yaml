revisions:
- from: 可是今天，你们却厌弃了你们的上帝；正是他救你们脱离一切灾祸[a]和患难。你们竟对他说：‘你要立一个王治理我们。’如今，你们要按各支派、各千人单位[b]，列队站在耶和华面前。
  to: 可是今天，你们却厌弃了你们的上帝，就是那位救你们脱离一切灾祸[a]和患难的。你们竟对他说：‘你要立一个王治理我们。’如今，你们要按各支派、各千人单位[b]，站在耶和华面前。
  rationale: 仅作安全的中文行文调整：以同位结构连接“你们的上帝”和其拯救作为，并以较自然且不额外限定动作的“站在……面前”译הִתְיַצְּבוּ。保留原稿对本节לוֹ כִּי的处理，不采纳英语审计文本中基于上下文补出的“No, but”。
