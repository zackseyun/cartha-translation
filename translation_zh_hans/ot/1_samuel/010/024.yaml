base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/024.yaml
  text: Then Samuel said to all the people[a], “Do you see the one whom Yahweh has chosen? There is no one like him among all the people.” And all the people shouted and said[b], “Long live the king!”
translation:
  language: zh_hans
  text: 撒母耳对众民说：“你们看见雅威所拣选的这个人了吗[a]？在全体民众中，没有人像他。”众民就高声欢呼，说[b]：“王万岁！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作：“你们看，雅威所拣选的这个人！”
    reason: 原文动词在形态上是完成式疑问语，但在现场讲话中也可起引人注意的作用。
  - marker: b
    text: 希伯来文直译：“愿王活着！”
    reason: 说明“王万岁”所对应的希伯来文祈愿式表达。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 叙事中的连续式推动情节；现代汉语借上下文自然表达先后，无须机械加上“然后”。
- source_word: הַרְּאִיתֶם
  choice: 你们看见……了吗
  rationale: 保留第二人称复数完成式及疑问语气；此处也可能是引人注意的现场问语，因此在脚注列出更具即时感的译法。
- source_word: אֲשֶׁר בָּחַר בּוֹ יְהוָה
  choice: 雅威所拣选的这个人
  rationale: 关系从句所指的是当场被展示的扫罗；“这个人”在现代汉语中自然体现其现场指示性。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文四字神名的通行汉语音译处理，保留其作为专名的性质，不以称号替代。
- source_word: כִּי אֵין כָּמֹהוּ
  choice: 没有一个人能与他相比
  rationale: 准确表达无人像他的比较意义；כִּי在此引出说明，汉语用句间语义关系自然体现，不生硬添加“因为”。
- source_word: בְּכָל הָעָם
  choice: 在全体百姓中
  rationale: 表达比较范围，即聚集的全体百姓之中。
- source_word: וַיָּרִעוּ
  choice: 高声欢呼
  rationale: 该动词表示发出响亮呼声；结合拥立君王的场景译作“高声欢呼”，同时保留其公开呼喊的性质。
- source_word: וַיֹּאמְרוּ
  choice: 说
  rationale: 保留原文在发出欢呼之后引出具体话语的表达。
- source_word: יְחִי הַמֶּלֶךְ
  choice: 王万岁
  rationale: 这是现代汉语中与希伯来文祈愿式君王欢呼语功能相当的固定表达；直译另见脚注。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”更贴近 Yahweh 的学术重构读音，并明确保留专名，不把它改成“主”等称号。
- issue: 扫罗“无人能比”的含义
  choice: 在全体百姓中，没有一个人能与他相比
  alternative: 在全体百姓中，没有人像他
  rationale: 译文只保留原文陈述的群体内比较，不进一步断定所比较的是身高、外貌、品格或属灵资格，以免消解原文在本节中的概括性。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“百姓”保留古代以色列群体语境；“王万岁”是自然的汉语拥戴用语。译文保留“众民……欢呼，说”的原文动作次序，并避免把扫罗的独特之处具体化。
