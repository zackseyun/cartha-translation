base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/012.yaml
  text: 'Then a man from there answered and said[a], “And who is their father?” Therefore it became a proverb: “Is Saul also among the prophets?”'
translation:
  language: zh_hans
  text: 有一个当地人回答说[a]：“那么，谁是他们的父亲呢？”因此，这话就成了俗语：“扫罗也在先知中吗？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“谁是他的父亲呢？”有些译本将这问题理解为专指扫罗；但马所拉文本作“他们的父亲”。
    reason: 保留“他们的父亲／他的父亲”这一重要的解释性替代读法，并说明正文依照马所拉文本的复数形式。
lexical_decisions:
- source_word: וַיַּעַן
  choice: 回应说
  rationale: ענה的叙事形式常引出对前言的回应；“回应说”既体现承接关系，也符合现代汉语叙事习惯。
- source_word: אִישׁ מִשָּׁם
  choice: 一个当地人
  rationale: 直译为“一个从那里来的人”；结合语境，“一个当地人”自然地表达这是一位来自该处、身份未详的男子。
- source_word: וּמִי אֲבִיהֶם
  choice: 那么，谁是他们的父亲呢？
  rationale: 马所拉文本的后缀为第三人称阳性复数，故保留“他们”，指先知群体。“那么”体现ו在此承接并推进反问的语用功能。
- source_word: עַל כֵּן
  choice: 因此
  rationale: 准确表达由前述事件或话语引出的结果。
- source_word: הָיְתָה לְמָשָׁל
  choice: 这句话成了一句俗语
  rationale: מָשָׁל在此指广为流传的惯用说法，而非篇幅较长的寓言；“俗语”比“箴言”更贴合此处社会性用语。补出“这句话”使汉语指代清楚。
- source_word: הֲגַם
  choice: 也……吗
  rationale: 疑问词ה与גַּם共同表达对扫罗竟被包括在该群体中的惊讶；汉语“也……吗”保留这种反问意味。
- source_word: בַּנְּבִאִים
  choice: 在先知中
  rationale: ב在此表达置身于某一群体之中；“在先知中”简洁并保留原文的群体归属表达。
theological_decisions:
- issue: “他们的父亲”所指为何
  choice: 正文保留马所拉文本的复数“他们的父亲”，指先知群体。
  alternative: 译作“他的父亲”，专指扫罗的父亲。
  rationale: 希伯来语形态明确支持复数后缀。此问可能暗示先知身份或活动并非取决于共同的家族血统，从而回应人们对扫罗参与说预言的惊讶。由于单数理解见于部分译本和解释传统，列入脚注而不取代正文。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“当地人”避免生硬直译“从那里的人”；“俗语”表达מָשָׁל在本节中流传说法的含义。反问句保留原文对扫罗意外跻身先知群体的惊讶，不进一步消解其神学张力。
