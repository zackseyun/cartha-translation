  text: וַ/יֹּ֣אמֶר אֶל בְּנֵ֣י יִשְׂרָאֵ֗ל כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל אָנֹכִ֛י הֶעֱלֵ֥יתִי אֶת יִשְׂרָאֵ֖ל מִ/מִּצְרָ֑יִם וָ/אַצִּ֤יל אֶתְ/כֶם֙ מִ/יַּ֣ד מִצְרַ֔יִם וּ/מִ/יַּד֙ כָּל הַ/מַּמְלָכ֔וֹת הַ/לֹּחֲצִ֖ים אֶתְ/כֶֽם׀־פ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/018.yaml
  text: 'And he said to the sons of Israel[a], “Thus says Yahweh, the God of Israel: I brought Israel up from Egypt, and I delivered you from the hand of the Egyptians and from the hand of all the kingdoms that were oppressing you.”'
translation:
  language: zh_hans
  text: 他对以色列人[a]说：“以色列的上帝耶和华如此说：‘我曾领以色列从埃及上来，也曾救你们脱离埃及人的手，以及所有欺压你们的列国之手。’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译“以色列的众子”；传统也译“以色列子民”。
    reason: 说明希伯来语族称的字面形式和传统译法。
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 这是指以色列民族成员的固定族称；现代汉语用“以色列人”自然、准确，并不排除妇女儿童。脚注保留较为字面的表达。
- source_word: כֹּה אָמַר
  choice: 如此说
  rationale: 保留希伯来语使者宣告公式的庄重语气，同时符合中文圣经文体。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的专名形式呈现四字神名，不以“主”这一称号替代。
- source_word: הֶעֱלֵיתִי
  choice: 领……从……上来
  rationale: 保留עלה使役形在出埃及语境中的“使上来、领上来”意象，而不改写为较笼统的“领出来”。
- source_word: וָאַצִּיל
  choice: 救……脱离
  rationale: 准确表达נצל使役形从敌对权势下搭救、解救的含义。
- source_word: מִיַּד
  choice: 脱离……的手
  rationale: 保留“手”所表达的权势与控制这一希伯来语意象；中文仍可理解。
- source_word: מִצְרַיִם
  choice: 埃及人
  rationale: 在“手”这一搭配中，所指是埃及人的权势，而非地理意义上的埃及国土。
- source_word: כָּל הַמַּמְלָכוֹת
  choice: 所有……之国
  rationale: 保留复数和周遍范围，不增添原文没有的“周围”等限定。
- source_word: הַלֹּחֲצִים אֶתְכֶם
  choice: 欺压你们
  rationale: 分词描述这些国家持续或惯常施加压迫；中文“欺压”自然传达这种敌对压制。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 耶和华
  alternative: 雅威；主
  rationale: 原文直接使用神的专名。正文采用现代中文圣经传统中最通行的专名“耶和华”，既不把专名替换为称号，也避免在正文中引入读者较不熟悉的音译。
- issue: בְּנֵי יִשְׂרָאֵל所指群体的表达
  choice: 以色列人
  alternative: 以色列的众子；以色列子民
  rationale: 这里是惯用民族称谓，语境指整个以色列群体。译作“以色列人”可避免现代中文将“众子”误解为只包括男性，同时以脚注交代原文字面形式。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。保留“如此说”“从埃及上来”和“脱离……的手”等原文宣告公式与意象；引语层级用外双引号和内单引号区分。
