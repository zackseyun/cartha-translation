  yaml_path: translation/ot/1_samuel/010/015.yaml
  text: Then Saul’s uncle said[a], “Please tell me what Samuel said to you.”
translation:
  language: zh_hans
  text: 扫罗的叔叔接着说：“请告诉我，撒母耳对你们[a]说了什么？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “你们”原文是复数，可能指扫罗和他的仆人。
    reason: 说明原文第二人称为复数及其可能所指；中文正文虽已显明复数，注释仍保留其语境意义。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 接着说
  rationale: 叙事性连续式推动情节发展；“接着”以自然现代汉语表达前后相继的作用。
- source_word: דּוֹד שָׁאוּל
  choice: 扫罗的叔叔
  rationale: דּוֹד在此亲属关系语境中通常指“叔叔”；这一表达也自然体现原文的属格关系。
- source_word: הַגִּידָה נָּא לִי
  choice: 请告诉我
  rationale: הַגִּידָה是“告诉、禀告”的使役式命令，נָא带有请求语气；“请告诉我”准确而自然。
- source_word: מָה
  choice: 什么
  rationale: 作为“告诉我”所引出的间接疑问内容，“什么”直接保留原文的疑问形式。
- source_word: אָמַר
  choice: 说了
  rationale: אָמַר是普通的“说”；“说了”既保留其基本含义，也符合汉语句法。
- source_word: לָכֶם
  choice: 对你们
  rationale: 原文为第二人称阳性复数；“你们”明确保留复数信息，语境中可能包括扫罗和仆人。
- source_word: שְׁמוּאֵל
  choice: 撒母耳
  rationale: 采用现代中文圣经中通行的人名译法。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重且易懂的现代标准汉语。“接着说”承接叙事进程；“请”保留请求语气。正文明确译出复数“你们”，不把原文可能指向扫罗与仆人的含义改成单数。
