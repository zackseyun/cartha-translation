  text: וַ/יַּקְרֵ֣ב שְׁמוּאֵ֔ל אֵ֖ת כָּל שִׁבְטֵ֣י יִשְׂרָאֵ֑ל וַ/יִּלָּכֵ֖ד שֵׁ֥בֶט בִּנְיָמִֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/020.yaml
  text: Then Samuel brought near all the tribes of Israel[a], and the tribe of Benjamin was taken.
translation:
  language: zh_hans
  text: 于是，撒母耳使以色列各支派近前来；便雅悯支派就被抽中了。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “被抽中了”原文直译为“被捉住”或“被拿住”，这里指借拈阄被选出。
    reason: 说明原文被动动词的字面意象及其在拈阄语境中的含义。
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: 使……近前来
  rationale: 该词是קרב的使役式，基本义为“使靠近、使近前来”。此处指撒母耳让各支派依次上前参与拈阄；译文保留原文的动作意象，同时符合现代汉语表达。
- source_word: שְׁמוּאֵל
  choice: 撒母耳
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: כָּל שִׁבְטֵי יִשְׂרָאֵל
  choice: 以色列各支派
  rationale: כָּל在复数集合名词前表示整体范围；“各支派”自然地表达全部支派逐一参与的意思。
- source_word: וַיִּלָּכֵד
  choice: 便抽中了
  rationale: לכד的被动式字面可指“被捉住、被取中”，但本段语境是借拈阄作出选择。中文“抽中”既清楚传达拈阄选定的结果，也保留非主动自选的意味；“便”承接前句叙事。
- source_word: שֵׁבֶט בִּנְיָמִן
  choice: 便雅悯支派
  rationale: 采用通行专名“便雅悯”，以“便雅悯支派”自然表达该支派被选出的结果。
theological_decisions:
- issue: 抽签结果的施事者是否明说为上帝
  choice: 不补出施事者，只说“抽中了”
  alternative: “耶和华选中了便雅悯支派”
  rationale: 希伯来文使用被动式而未明说施事者。上下文可能暗示这是在耶和华面前借拈阄作出的选择，但本节本身没有直接说“耶和华选中”，因此不把隐含理解写入正文。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“使……近前来”保留原文较正式的礼仪性动作；“抽中了”让普通读者清楚理解选择方式。脚注标记置于整句之后，解释该动词的字面义与语境义。
