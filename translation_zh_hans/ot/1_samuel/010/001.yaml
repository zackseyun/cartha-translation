  terminology: “雅威”一致保留四字神名的专名性质；“膏立”同时保留仪式与任命的含义；“产业”可表达נַחֲלָתוֹ在此处的归属／承业意象。“领袖”没有把נָגִיד不必要地等同为正式王号；脚注所列“统治者”“君长”提供了适当的词义范围。
