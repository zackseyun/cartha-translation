source:
  edition: WLC
  text: וַ/יִּקַּ֨ח שְׁמוּאֵ֜ל אֶת פַּ֥ךְ הַ/שֶּׁ֛מֶן וַ/יִּצֹ֥ק עַל רֹאשׁ֖/וֹ וַ/יִּשָּׁקֵ֑/הוּ וַ/יֹּ֕אמֶר הֲ/ל֗וֹא כִּֽי מְשָׁחֲ/ךָ֧ יְהוָ֛ה עַל נַחֲלָת֖/וֹ לְ/נָגִֽיד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/001.yaml
  text: Then Samuel took the flask of oil and poured it on his head and kissed him[a], and said, “Has not Yahweh anointed you as ruler over his inheritance?”
translation:
  language: zh_hans
  text: 撒母耳拿起一小瓶油，倒在扫罗头上，又亲吻他，说：“雅威不是已经膏立你作他产业的领袖[a]吗？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “领袖”也可译作“统治者”或“君长”。希伯来语所用的词指受委任治理的人，其含义与后来明确的称号“王”并不完全相同。
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּךְ הַשֶּׁמֶן
  choice: 一小瓶油
  rationale: פַּךְ指盛放液体的小型容器；“一小瓶油”在现代汉语中自然清楚，也保留了具体形象。
- source_word: וַיִּצֹק עַל רֹאשׁוֹ
  choice: 倒在扫罗头上
  rationale: יצק意为“倾倒”，עַל רֹאשׁוֹ直指“在他头上”。为避免连续代词造成指代含混，译文依上下文明确为“扫罗”，未增加新的叙事信息。
- source_word: וַיִּשָּׁקֵהוּ
  choice: 亲吻他
  rationale: 此处נשׁק明确表示“亲吻”；直译保留膏立场景中的礼仪性动作，不作弱化或改写。
- source_word: הֲלוֹא כִּי
  choice: 不是已经……吗
  rationale: 该组合引出期待肯定回答的反问；“不是已经……吗”既保留反问语气，又符合现代汉语表达。
- source_word: מְשָׁחֲךָ
  choice: 膏立你
  rationale: משׁח既指以油膏抹的仪式，也含任命担任职分之意；“膏立”兼顾仪式和委任两层意义。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以常见的现代汉语音译呈现四字神名，保留原文所用的专名，不以“主”等称号替代。
- source_word: נַחֲלָתוֹ
  choice: 他的产业
  rationale: נַחֲלָה可指所承受或所分得的产业；在这里指属于雅威的以色列。“产业”保留其盟约和归属意味。
- source_word: לְנָגִיד
  choice: 作……的领袖
  rationale: נָגִיד指被设立来领导、治理的人，但其语义不完全等同于正式称号“王”。“领袖”在现代汉语中自然，并保留这一较宽的职分含义。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。译作“雅威”保留专名性质，避免以称号替代，也不把较晚形成的传统读音带入正文。
- issue: 王权委任语境中נָגִיד的译法
  choice: 领袖
  alternative: 统治者；君长；王
  rationale: 本节描述扫罗受委任，但נָגִיד并非通常表示“王”的מֶלֶךְ。采用“领袖”保留治理与领导之意，同时不提前把该词收窄为正式王号。
- issue: 反问句הֲלוֹא כִּי的语气
  choice: 雅威不是已经……吗？
  alternative: 雅威确实已经……；难道雅威没有……吗？
  rationale: 原文以反问表达强烈肯定。译文保留反问形式，不将其直接改写为陈述句，也避免“难道没有”可能产生的生硬或误读。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“一小瓶油”具体易懂；“又亲吻他”保留原文动作次序；反问句维持原文的肯定力度。脚注标记置于“领袖”之后，与所解释的词直接对应。
