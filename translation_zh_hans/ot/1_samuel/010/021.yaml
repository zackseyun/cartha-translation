source:
  edition: WLC
  text: וַ/יַּקְרֵ֞ב אֶת שֵׁ֤בֶט בִּנְיָמִן֙ ל/משפחת/ו וַ/תִּלָּכֵ֖ד מִשְׁפַּ֣חַת הַ/מַּטְרִ֑י וַ/יִּלָּכֵד֙ שָׁא֣וּל בֶּן קִ֔ישׁ וַ/יְבַקְשֻׁ֖/הוּ וְ/לֹ֥א נִמְצָֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/021.yaml
  text: Then he brought the tribe of Benjamin near by its clans[a], and the clan of the Matrites was taken. Then Saul son of Kish was taken, but when they sought him[b], he could not be found.
translation:
  language: zh_hans
  text: 随后，他让便雅悯支派按宗族近前来[a]，玛特利宗族被抽中。接着，基士的儿子扫罗被抽中[b]；众人寻找他，却找不到。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “宗族”也可译作“家族”。这里所指的是支派之下的扩展家族群体。
    reason: lexical_alternative
  - marker: b
    text: “被抽中”所译的希伯来语动词通常可指“被捉住”或“被夺取”；这里指通过抽签被选定，并非在战争中被俘。
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: 让……近前来
  rationale: 使役形在此表示使人近前、呈到面前；这一译法保留抽签程序中的动作感，又符合现代汉语叙事。
- source_word: שֵׁבֶט בִּנְיָמִן
  choice: 便雅悯支派
  rationale: “支派”准确表达以色列的部族组织，也是现代中文圣经语境中清楚自然的称呼。
- source_word: לְמִשְׁפְּחֹתָיו
  choice: 按宗族
  rationale: מִשְׁפָּחָה 在此指支派之下的扩展家族群体；“宗族”比普通的“家庭”更能体现该层级，介词 לְ 表达按各群体依次进行。
- source_word: וַתִּלָּכֵד / וַיִּלָּכֵד
  choice: 被抽中
  rationale: לכד 的被动形字面可表示“被捉住”，但本段语境是抽签逐级确定人选；“被抽中”自然、明确，并在两处保持同一译法。
- source_word: מִשְׁפַּחַת הַמַּטְרִי
  choice: 玛特利宗族
  rationale: 将 הַמַּטְרִי 作为群体称号音译为“玛特利”，并用“宗族”体现其在支派之下的社会单位。
- source_word: שָׁאוּל בֶּן־קִישׁ
  choice: 基士的儿子扫罗
  rationale: 按自然现代汉语表达希伯来文的父系称谓，同时保留人物姓名。
- source_word: וַיְבַקְשֻׁהוּ
  choice: 众人寻找他
  rationale: בקשׁ 在此意为寻找；希伯来文动词为复数，中文补出“众人”以自然体现未明说的复数主语。
- source_word: וְלֹא נִמְצָא
  choice: 却找不到
  rationale: 原文为“没有被找到”；中文用主动式结果表达更自然，“却”准确呈现转折。
theological_decisions: []
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“近前来”保留礼仪性、程序性的叙事色彩；“被抽中”则避免把抽签选定误解为军事俘获。句间用“随后”“接着”呈现逐级筛选的推进。
