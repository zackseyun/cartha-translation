  text: Saul’s servants told him[a], saying, “David spoke words like these.”
translation:
  language: zh_hans
  text: 扫罗的臣仆告诉扫罗说：“大卫所说的话是这样的。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּגִּדוּ
  choice: 告诉
  rationale: 该词的使役形在这里表示“告知、禀报”；“告诉”自然清楚，也符合后接受事者的句法。
- source_word: עַבְדֵי שָׁאוּל
  choice: 扫罗的臣仆
  rationale: עֶבֶד 可指仆人、侍从或臣属；在王宫语境中，“臣仆”既体现其服事君王的身份，又不具体限定其官职。
- source_word: לוֹ
  choice: 他
  rationale: 代词回指扫罗；汉语用“告诉他”最为自然。
- source_word: לֵאמֹר
  choice: 说
  rationale: 该不定式引出所禀报的内容；合并为“告诉他说”既保留原文结构，也符合庄重叙事语体。
- source_word: כַּדְּבָרִים הָאֵלֶּה
  choice: 这样的话
  rationale: כְּ 在此可表达“照着、如同、像”，整句指大卫所说的话与前述内容相符；“这样的话”自然地保留这种概括性，而不把它收窄为逐字复述。
- source_word: דִּבֶּר
  choice: 说了
  rationale: דבר 表示说话、发言；现代汉语中“说了”比“讲了”更自然，并在语义上忠实。
- source_word: דָּוִד
  choice: 大卫
  rationale: 采用该人名通行的现代中文译名。
