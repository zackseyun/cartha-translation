base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/021.yaml
  text: Then Saul said[a], “I will give her to him, so that she may become a snare to him and the hand of the Philistines may be against him.” So Saul said to David, “By the second one you may become my son-in-law today.”
translation:
  language: zh_hans
  text: 扫罗心里说：“我要把她给大卫，好让她成为他的网罗，使非利士人的手加在他身上。”于是扫罗对大卫说：“今天借着第二个[a]，你可以成为我的女婿。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“今天你可以第二次成为我的女婿。”希伯来语在这里有所省略，既可能指扫罗的第二个女儿，也可能指大卫第二次有机会与扫罗家结亲。
    reason: alternative_reading
lexical_decisions:
- source_word: אֶתְּנֶנָּה לּוֹ
  choice: 我要把她给大卫
  rationale: 在婚姻语境中，נתן加女性宾语和间接宾语表示把女儿给人婚配。译文保留“给”的简洁表达；为使扫罗内心独白中的代词所指清楚，以“大卫”表达希伯来文的“他”。
- source_word: וּתְהִי לוֹ לְמוֹקֵשׁ
  choice: 好让她成为他的网罗
  rationale: מוֹקֵשׁ指捕捉猎物的网罗或陷阱；“网罗”保留原文比喻。“好让”按上下文表达扫罗的目的。
- source_word: וּתְהִי בוֹ יַד פְּלִשְׁתִּים
  choice: 使非利士人的手攻击他
  rationale: 原文保留“手”的意象，用“攻击”明确其敌对含义，同时不将该惯用语完全改写为“非利士人杀死他”。
- source_word: בִּשְׁתַּיִם
  choice: 借着第二个
  rationale: 该短语省略了所修饰的名词，可能指扫罗的第二个女儿，也可能指大卫第二次与扫罗结亲的机会。正文直译其工具性和序数含义，并以脚注保留歧义。
- source_word: תִּתְחַתֵּן בִּי
  choice: 你可以成为我的女婿
  rationale: חתן的Hitpael形式配ב表示与某人缔结姻亲关系；在此具体指大卫成为扫罗的女婿。情态译为“可以”，符合扫罗向大卫提出婚事的语境。
- source_word: הַיּוֹם
  choice: 今天
  rationale: 按通常时间意义翻译，也保留扫罗话语中的即时性。
- source_word: וַיֹּאמֶר ... וַיֹּאמֶר
  choice: 扫罗心里说……于是扫罗对大卫说
  rationale: 两次叙事动词分别引出扫罗的内心盘算和对大卫的直接话语；添加“心里”和“对大卫”使现代汉语读者清楚区分两层话语，符合上下文。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而自然的叙事语言。“网罗”和“非利士人的手”保留希伯来文的形象表达；对难解的“借着第二个”不在正文中擅自消除歧义，而以脚注说明两种主要理解。
