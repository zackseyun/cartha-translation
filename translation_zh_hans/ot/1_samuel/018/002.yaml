  yaml_path: translation/ot/1_samuel/018/002.yaml
  text: Saul took him that day and did not allow him to return to his father's house[a].
translation:
  language: zh_hans
  text: 当天，扫罗留下大卫，不让他回父亲家里[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不准他回父亲家里。”希伯来文按字面可译为“没有给他返回”；这里“给”是表示准许的惯用说法。
    reason: 说明希伯来语נתן接不定式所表达的许可含义，并提供自然的中文替译。
lexical_decisions:
- source_word: וַיִּקָּחֵהוּ
  choice: 把大卫留在身边
  rationale: לקח本义为“取、带走”。结合上下文，这里指扫罗将大卫留在自己身边；补出“大卫”可避免中文代词指向不清，“留在身边”自然表达其语境含义，而不进一步限定为正式任职。
- source_word: שָׁאוּל
  choice: 扫罗
  rationale: 采用中文圣经传统中通行的人名译法。
- source_word: בַּיּוֹם הַהוּא
  choice: 当天
  rationale: 准确而自然地表达“在那一天”，保留明确的时间指向。
- source_word: וְלֹא נְתָנוֹ לָשׁוּב
  choice: 不让他回
  rationale: נתן接不定式在此表示准许；译为“不让”符合现代汉语，也保留扫罗不准大卫返回的含义。
- source_word: בֵּית אָבִיו
  choice: 父家
  rationale: 既可指父亲的家，也带有父系家庭或家族的意味；“父家”简洁保留了这一希伯来表达的范围。
