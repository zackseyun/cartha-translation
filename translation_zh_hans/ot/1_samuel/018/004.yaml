base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/004.yaml
  text: Then Jonathan stripped off the robe that was on him and gave it to David[a], along with his armor, and even his sword, his bow, and his belt.
translation:
  language: zh_hans
  text: 约拿单脱下身上所穿的外袍，给了大卫；又把自己的衣服[a]，连自己的刀、弓和腰带，也给了大卫。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “衣服”也可译“战服”或“军服”；该希伯来词可指衣着，常用于官服或军服的语境。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְפַּשֵּׁט
  choice: 脱下
  rationale: 该词的 Hitpael 词形表示从自己身上脱去衣物。“脱下”在现代汉语中自然清楚，也保留了动作的自身指向，但不暗示完全赤身。
- source_word: הַמְּעִיל
  choice: 外袍
  rationale: מְעִיל 指穿在外面的袍服或长衣；“外袍”既体现其外衣性质，也适合本段可能带有身份意味的服饰语境。
- source_word: אֲשֶׁר עָלָיו
  choice: 自己身上的
  rationale: 这一关系从句限定约拿单当时穿着的外袍；译为“自己身上的”简洁自然，并明确指向约拿单。
- source_word: וַיִּתְּנֵהוּ לְדָוִד
  choice: 给了大卫
  rationale: 直译叙事中的普通给予动作；希伯来语阳性单数宾语后缀回指“外袍”。
- source_word: וּמַדָּיו
  choice: 自己的战衣
  rationale: מַדִּים 可泛指衣服，也常指具有职分或军事性质的服装。鉴于随后列出刀、弓和腰带，“战衣”贴合语境，同时用脚注保留“衣服、军装”等词义可能。
- source_word: וְעַד
  choice: 甚至
  rationale: 反复出现的 עַד 将所赠物品的范围逐项扩展到刀、弓和腰带；“甚至”在汉语中自然表达这种递进和强调。
- source_word: חַרְבּוֹ
  choice: 刀
  rationale: חֶרֶב 在此指近战兵器；圣经叙事中的常用现代汉语对应词为“刀”。
- source_word: קַשְׁתּוֹ
  choice: 弓
  rationale: קֶשֶׁת 在此为武器“弓”，含义明确。
- source_word: חֲגֹרוֹ
  choice: 腰带
  rationale: חֲגוֹר 指束在腰间之物；“腰带”是清楚、现代且不古雅的译法。
theological_decisions:
- issue: 约拿单赠送物品这一行动的叙事意义
  choice: 正文只陈述约拿单所做的事，不明说这些赠礼象征王权转交、盟约性顺服或单纯友谊。
  alternative: 可将这些赠礼明确解释为约拿单承认大卫将作王，或主要解释为立约友谊的信物。
  rationale: 本节希伯来文本只叙述具体行动，没有明言其象征意义。保持描述性译法，可让相关神学与叙事张力由上下文呈现，而不把某一种解释写进正文。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“脱下自己身上的外袍”保留原文动作的鲜明感；后半句补出“也都给了他”，使省略谓语的希伯来语列举在汉语中顺畅，同时不增添对赠礼象征意义的解释。
