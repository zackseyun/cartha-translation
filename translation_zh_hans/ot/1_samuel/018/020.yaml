  text: וַ/תֶּאֱהַ֛ב מִיכַ֥ל בַּת שָׁא֖וּל אֶת דָּוִ֑ד וַ/יַּגִּ֣דוּ לְ/שָׁא֔וּל וַ/יִּשַׁ֥ר הַ/דָּבָ֖ר בְּ/עֵינָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/020.yaml
  text: Michal[a], Saul's daughter, loved David, and they told Saul, and the matter pleased him.
translation:
  language: zh_hans
  text: 扫罗的女儿米甲爱大卫。有人把这事告诉扫罗，扫罗觉得这事很好。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“这事在他眼中是正的（或‘好的’）。”
    reason: 保留希伯来文“在他眼中”这一评价性习语，以及יָשַׁר兼有“正、好、合意”的词义范围。
lexical_decisions:
- source_word: וַתֶּאֱהַב
  choice: 爱
  rationale: אהב在此直接表示爱；译作“爱”忠实而简洁，避免“爱上了”可能增添的起始意味。
- source_word: מִיכַל בַּת שָׁאוּל
  choice: 扫罗的女儿米甲
  rationale: 按现代汉语习惯先交代亲属身份，再写人名；מִיכַל采用通行译名“米甲”，שָׁאוּל采用“扫罗”。
- source_word: אֶת דָּוִד
  choice: 大卫
  rationale: אֶת是直接宾语标记，无须另译；דָּוִד采用通行译名“大卫”。
- source_word: וַיַּגִּדוּ לְשָׁאוּל
  choice: 有人把这事告诉扫罗
  rationale: נגד的使役形在此意为“告诉、报告”；希伯来文使用未具体指明身份的复数主语，汉语以“有人”自然表达其不定性，而不擅自确定是谁。
- source_word: הַדָּבָר
  choice: 这事
  rationale: דבר在此指米甲爱大卫这一情况或消息，而非单指一个“话语”；“这事”符合现代汉语叙事。
- source_word: וַיִּשַׁר הַדָּבָר בְּעֵינָיו
  choice: 扫罗觉得这事很好
  rationale: 该习语字面为“这事在他眼中是正的/好的”，表示扫罗认为此事合意；主句采用自然汉语，并以脚注保留原文意象和词义范围。
theological_decisions: []
