base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/023.yaml
  text: So Saul’s servants spoke these words in David’s hearing[a], and David said, “Does it seem to you a small thing to become the king’s son-in-law, when I am a poor and lightly regarded man?”
translation:
  language: zh_hans
  text: 扫罗的臣仆把这些话说给大卫听。大卫说：“你们以为，做王的女婿是一件小事吗？我不过是个贫穷、卑微的人。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבְּרוּ
  choice: 说
  rationale: 叙事语境中的常用译法，准确表达复数主语的言语行动，不额外引入正式传话等含义。
- source_word: עַבְדֵי שָׁאוּל
  choice: 扫罗的臣仆
  rationale: עֶבֶד 在王室语境中指服侍君王的人；“臣仆”兼顾其臣属身份和服侍关系。
- source_word: בְּאָזְנֵי דָוִד
  choice: 说给大卫听
  rationale: 希伯来语直译为“在大卫耳中”，这里采用自然汉语表达，保留让大卫亲耳听见的含义。
- source_word: אֶת־הַדְּבָרִים הָאֵלֶּה
  choice: 这些话
  rationale: 当前语境指扫罗吩咐臣仆所传达的话，“这些话”准确而自然。
- source_word: הַנְקַלָּה בְעֵינֵיכֶם
  choice: 你们以为……是一件小事吗
  rationale: 保留“在你们眼中”的评价意味及反问语气；“以为”是现代汉语中自然的对应表达。
- source_word: הִתְחַתֵּן בַּמֶּלֶךְ
  choice: 做王的女婿
  rationale: 该反身词形在此指借着迎娶王女而与王结亲；结合上下文译明具体亲属关系。
- source_word: רָשׁ
  choice: 贫穷
  rationale: 直接表达大卫所说的经济贫困和社会条件不足。
- source_word: נִקְלֶה
  choice: 卑微
  rationale: 该词表示不受重视、地位低微；“卑微”适合大卫自述的语境，也与前面的“一件小事”保留一定的轻微、低下语义呼应。
theological_decisions: []
