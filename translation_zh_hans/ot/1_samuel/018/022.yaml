  text: וַ/יְצַ֨ו שָׁא֜וּל אֶת עֲבָדָ֗/ו דַּבְּר֨וּ אֶל דָּוִ֤ד בַּ/לָּט֙ לֵ/אמֹ֔ר הִנֵּ֨ה חָפֵ֤ץ בְּ/ךָ֙ הַ/מֶּ֔לֶךְ וְ/כָל עֲבָדָ֖י/ו אֲהֵב֑וּ/ךָ וְ/עַתָּ֖ה הִתְחַתֵּ֥ן בַּ/מֶּֽלֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/022.yaml
  text: So Saul commanded his servants[a], “Speak to David privately, saying, ‘Look, the king delights in you, and all his servants love you[b]. So now become the king’s son-in-law.’”
translation:
  language: zh_hans
  text: 于是，扫罗吩咐臣仆说：“你们私下[a]对大卫说：‘看哪，王喜爱你，他的臣仆也都爱你。现在，你就与王结为姻亲[b]吧。’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “私下”也可译作“秘密地”或“悄悄地”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“作王的女婿。”原文直译为“与王结为姻亲”，也含有借婚姻与王结盟的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: 吩咐
  rationale: צוה表示发出命令或指示；“吩咐”既保留指令意味，也符合君王对臣仆说话的语境。
- source_word: עֲבָדָיו
  choice: 臣仆
  rationale: עבד在宫廷语境中可指仆人、侍从或臣属；“臣仆”既体现他们服侍扫罗，也不过度限定其官职。
- source_word: בַּלָּט
  choice: 私下
  rationale: 该词表示隐秘、不公开地行事；“私下”自然贴合这里暗中劝说大卫的场景，同时以脚注保留“秘密地、悄悄地”等可能。
- source_word: הִנֵּה
  choice: 看哪
  rationale: הנה用来唤起注意；“看哪”保留其话语强调作用，并维持庄重的叙事语体。
- source_word: חָפֵץ בְּךָ
  choice: 喜爱你
  rationale: חפץ ב可表示喜欢、悦纳或以某人为喜悦；“喜爱你”在现代汉语中自然，也避免把这里误读为情欲性的“想要你”。
- source_word: אֲהֵבוּךָ
  choice: 爱你
  rationale: אהב的直接含义是“爱”；此处可涵盖臣仆对大卫的好感与拥护，直译能够保留其力度。
- source_word: הִתְחַתֵּן בַּמֶּלֶךְ
  choice: 与王结为姻亲
  rationale: חתן的反身词干表示借婚姻建立亲属或联盟关系，介词短语直指“与王”；“与王结为姻亲”保留原文关系表达，不把隐含结果直接收窄为“作王的女婿”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“臣仆”体现宫廷背景；引语层次清楚。正文保留原文“结为姻亲”的关系性表达，并用脚注说明在本情境中具体指成为王的女婿。
