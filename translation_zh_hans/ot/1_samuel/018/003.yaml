  text: וַ/יִּכְרֹ֧ת יְהוֹנָתָ֛ן וְ/דָוִ֖ד בְּרִ֑ית בְּ/אַהֲבָת֥/וֹ אֹת֖/וֹ כְּ/נַפְשֽׁ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/003.yaml
  text: Then Jonathan made a covenant with David[b][a], because he loved him as his own soul.
translation:
  language: zh_hans
  text: 于是，约拿单与大卫立约[a]，因为他爱大卫，如同爱自己的生命[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “立约”直译为“割约”，是希伯来语的固定说法。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“因为他爱他，如同自己的生命”。这些代词在形式上可能有歧义；上下文较支持约拿单爱大卫，如同爱自己的生命。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּכְרֹת
  choice: 立
  rationale: כרת ברית直译为“割约”，是希伯来语中表示订立盟约的固定说法；现代汉语以“立约”自然、庄重地传达其含义，字面表达另见脚注。
- source_word: יְהוֹנָתָן
  choice: 约拿单
  rationale: 采用现代简体中文圣经人名的通行译名。
- source_word: וְדָוִד
  choice: 与大卫
  rationale: 虽然原文形式为连接词加人名，但在单数动词“立”及“约”的结构中，大卫是约拿单立约的对象；汉语用“与大卫”准确表达双方关系，同时保留约拿单为语法主语。
- source_word: בְּרִית
  choice: 约
  rationale: בְּרִית指具有约束力的正式关系或盟约；与“立”构成汉语中自然且庄重的“立约”，比“协议”更能保留其郑重和关系性。
- source_word: בְּאַהֲבָתוֹ
  choice: 因为他爱
  rationale: 介词ב在此可表达原因或伴随情形；结合上下文，译作“因为他爱”清楚表达立约以爱为基础，同时在脚注说明代词形式上的歧义。
- source_word: אֹתוֹ
  choice: 大卫
  rationale: 原文为阳性单数宾格代词“他”；上下文强烈支持所指为大卫。正文明确人名，可避免现代汉语连续使用“他”造成不必要的晦涩，但原文代词的形式歧义在脚注中保留。
- source_word: כְּנַפְשׁוֹ
  choice: 如同爱自己的生命
  rationale: נֶפֶשׁ可指生命、自身或魂；“自己的生命”保留原文意象，也以自然汉语表达极深的珍爱。“如同爱自己”虽更顺畅，却会淡化נֶפֶשׁ的词汇形象。
theological_decisions:
- issue: “因为他爱他，如同自己的生命”中第三人称代词的所指
  choice: 正文按上下文理解为约拿单爱大卫，如同爱自己的生命
  alternative: 若只看代词形式，也可能理解为大卫爱约拿单；原文形式本身并未明说人名
  rationale: 希伯来语中的第三人称单数代词孤立来看存在歧义，但18:1及本节以约拿单为动词主语的语境明显支持约拿单为爱者、大卫为被爱者。正文采用语境较强的理解，不对这份爱的性质作超出原文的神学推断，并以脚注保存形式上的歧义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“于是”承接叙事；“与大卫立约”保持约拿单为单数主语；“自己的生命”保留נֶפֶשׁ的生命意象。所有脚注标记均置于正文相关短语之后。
