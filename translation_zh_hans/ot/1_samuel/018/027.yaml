base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/027.yaml
  text: So David arose and went[a], he and his men, and struck down two hundred Philistine men. Then David brought their foreskins, and they counted them out in full to the king, so that he might become the king’s son-in-law. And Saul gave him Michal his daughter as a wife.
translation:
  language: zh_hans
  text: 大卫和他的部下就动身前去，击杀了二百名非利士人。大卫把他们的包皮带来，足数交给王[a]，好成为王的女婿。扫罗便把女儿米甲给大卫为妻。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在王面前把这些逐一数出。”此处希伯来语动词较难确定，既可能指足数呈交，也可能指当面清点，以表明数目已经凑足。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם דָּוִד וַיֵּלֶךְ הוּא וַאֲנָשָׁיו
  choice: 大卫和跟随他的人就动身前去
  rationale: קום与הלך连用，在叙事中表示开始采取行动；译作“动身前去”比字面化的“起来去”更符合现代汉语。明译הוּא וַאֲנָשָׁיו，保留大卫与随从共同出发的强调。
- source_word: וַיַּךְ בַּפְּלִשְׁתִּים מָאתַיִם אִישׁ
  choice: 击杀了二百名非利士人
  rationale: נכה在军事语境中表示击倒、杀死；随后割取阳皮的情节表明这里是致死性的行动。“二百名非利士人”自然表达数词后אִישׁ的计数功能。
- source_word: עָרְלֹתֵיהֶם
  choice: 他们的阳皮
  rationale: 原文是直接的身体部位名称。“阳皮”是现代中文圣经语域中清楚而庄重的对应词，不以委婉说法掩盖这项聘礼的性质。
- source_word: וַיְמַלְאוּם לַמֶּלֶךְ
  choice: 足数交给王
  rationale: 该短语句法和词义较难；在上下文中表示把所要求的数目凑足并呈交给王。正文采用简洁自然、能涵盖“足数”与“呈交”两层意思的译法，同时以脚注保留另一种可能。
- source_word: לְהִתְחַתֵּן בַּמֶּלֶךְ
  choice: 好成为王的女婿
  rationale: חתן的Hitpael词形表示借婚姻与对方结亲；本处随后明确说扫罗把米甲给大卫为妻，因此“成为王的女婿”准确而自然。
- source_word: וַיִּתֶּן לוֹ שָׁאוּל אֶת מִיכַל בִּתּוֹ לְאִשָּׁה
  choice: 扫罗便把女儿米甲给大卫为妻
  rationale: 保留原文正式的婚姻授予表达，并在中文中补出“大卫”作间接宾语，以免“给他”指代含混。
