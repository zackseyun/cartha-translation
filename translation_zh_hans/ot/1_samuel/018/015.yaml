lexical_decisions:
- source_word: וַיַּרְא שָׁאוּל
  choice: 扫罗见
  rationale: 叙事性的连续式推进情节；这里与后半句形成“见……就……”的因果兼时间关系，符合现代汉语表达。
- source_word: אֲשֶׁר הוּא
  choice: 大卫
  rationale: 原文为“他”，所指是上下文中的大卫。汉语在同一句中另有主语扫罗，明说“大卫”可避免代词混淆，而不改变所指。
- source_word: מַשְׂכִּיל מְאֹד
  choice: 事事都很成功
  rationale: שׂכל 的使役式在此可指明智、审慎地行事，也可指由此取得成功；上下文强调扫罗所观察到的大卫屡次顺利。“事事都很成功”自然表达其可见成效，同时以脚注保留“行事有智慧／亨通”的词义幅度。מְאֹד 的加强语气由“事事都很”表达。
- source_word: וַיָּגָר מִפָּנָיו
  choice: 就惧怕他
  rationale: גור 在本语境表示害怕、畏惧；מִפָּנָיו 字面为“从他面前”，在这里是表示惧怕某人的希伯来语习语。“惧怕他”准确且庄重自然，“就”体现前后叙事结果关系。
