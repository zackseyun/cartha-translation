source:
  edition: WLC
  text: וַ/יְהִ֗י כְּ/כַלֹּת/וֹ֙ לְ/דַבֵּ֣ר אֶל שָׁא֔וּל וְ/נֶ֨פֶשׁ֙ יְה֣וֹנָתָ֔ן נִקְשְׁרָ֖ה בְּ/נֶ֣פֶשׁ דָּוִ֑ד ו/יאהבו יְהוֹנָתָ֖ן כְּ/נַפְשֽׁ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/001.yaml
  text: And it happened[a], when he had finished speaking to Saul, that Jonathan’s soul was bound to David’s soul[b], and Jonathan loved him as his own soul.
translation:
  language: zh_hans
  text: 大卫对扫罗说完话以后，约拿单的心就与大卫的心连结在一起[a]；约拿单爱大卫，如同爱自己的生命[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “连结在一起”也可译作“系在一起”。原文以捆绑、系结为喻，形容极其紧密的连结。
    reason: lexical_alternative
  - marker: b
    text: 本节原文三次使用同一个希伯来词 נֶפֶשׁ，可指“生命”“自己”“整个人”或人的内在情感；这里分别译作“心……心……生命”。
    reason: lexical_repetition
lexical_decisions:
- source_word: וַיְהִי
  choice: ……以后，……就……
  rationale: 这是希伯来叙事中承接新情节的常用形式。汉语不另译成生硬的“事情发生了”，而用自然的时间—结果结构体现叙事推进。
- source_word: כְּכַלֹּתוֹ לְדַבֵּר אֶל־שָׁאוּל
  choice: 大卫对扫罗说完话以后
  rationale: 介词 כְּ 加不定式结构表示时间。动词的主语由上文可知是大卫；汉语补出“大卫”，避免孤立经节中代词指向不清。אֶל 在此表示话语朝向扫罗，译为“对扫罗说”。
- source_word: נֶפֶשׁ
  choice: 心／生命
  rationale: נֶפֶשׁ 可指生命、自己、整个人或内在情感。前两处在“相连”的关系隐喻中译作“心”最符合现代汉语；末处译作“生命”，保留“像珍爱自己的生命一样”的力度。脚注说明原文三处使用同一个词。
- source_word: נִקְשְׁרָה
  choice: 连结在一起
  rationale: קשר 的基本意象是捆绑、系结；“连结在一起”既保留紧密结合的隐喻，也比“被捆绑”更适合现代汉语中的人际关系表达。
- source_word: וַיֶּאֱהָבוֹ
  choice: 约拿单爱大卫
  rationale: 动词 אהב 表示爱，宾语后缀指大卫。汉语补明主语和宾语，避免连续代词造成歧义，不增添原文未说明的爱情性质。
- source_word: כְּנַפְשׁוֹ
  choice: 如同爱自己的生命
  rationale: 原文直译为“如同自己的 נפשׁ”，其中“爱”承接前一分句。此译法在现代汉语中自然，并保留对大卫深厚珍爱的强度。
theological_decisions:
- issue: 约拿单对大卫之爱的性质
  choice: 直接译为“约拿单爱大卫”，表达强烈而深厚的个人情谊，不进一步界定其性质。
  alternative: 将其限定为政治联盟之爱，或解释为浪漫／性爱关系。
  rationale: נֶפֶשׁ 与 אהב 清楚表达深厚的个人连结和爱，但本节本身没有说明情色内容，也没有把这份爱仅仅归结为政治关系。译文应保留其力度和开放性，不作超出经文的判定。
- issue: נֶפֶשׁ 的汉语表达及人的构成观
  choice: 按语境分别译为“心”和“生命”，并以脚注交代原文复现同一词。
  alternative: 三处一律译作“灵魂”。
  rationale: 一律译作“灵魂”虽能显示词语重复，却容易在现代汉语中引入与身体相对的独立实体观；希伯来语 נֶפֶשׁ 的语义范围更广。当前译法避免预设特定的人论，同时用脚注保存原文形式。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“连结在一起”保留原文的系结隐喻；分号呈现两个紧密相关而各有重心的分句。避免古雅的“及至”“灵魂契合”，也避免把深厚情谊解释成原文未明确说明的特定关系。
