  yaml_path: translation/ot/1_samuel/018/014.yaml
  text: And David was acting wisely in all his ways[a], and Yahweh was with him.
translation:
  language: zh_hans
  text: 大卫无论做什么，都表现得很明智[a]，雅威与他同在。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“事事顺利”或“凡事亨通”。这个希伯来词可指明智、审慎地行事，也可指由此取得成功。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: 都（与后文共同表达持续的一贯表现）
  rationale: 此处引出大卫持续、一贯的行为表现；汉语无需机械译出系词，结合“无论……都……”自然表达。
- source_word: דָוִד
  choice: 大卫
  rationale: 该人名在现代中文圣经传统中的通行译法。
- source_word: לְכָל דָּרְכָו
  choice: 无论做什么
  rationale: 原文直译为“在他一切的道路上”，此处“道路”指各种行动或所行的事；意译可使普通现代读者自然理解，同时保留范围无一例外的含义。
- source_word: מַשְׂכִּיל
  choice: 行事明智
  rationale: 该词首先表示审慎、明智地行事，也可延伸指因此顺利或成功；正文保留行为层面的核心意义，并以脚注呈现结果层面的可能译法。
- source_word: וַיהוָה
  choice: 雅威
  rationale: 直接译出四字神名，区别于作为称谓的“主”。
- source_word: עִמּוֹ
  choice: 与他同在
  rationale: 自然表达神的临在与相伴，不额外把经文可能蕴含的眷顾或支持明说出来。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文明确使用四字神名；“雅威”较直接地呈现其专名性质，也避免把专名改成称谓。
- issue: מַשְׂכִּיל 是强调明智行为还是成功结果
  choice: 正文译作“行事明智”
  alternative: 事事顺利；凡事亨通
  rationale: 希伯来词可兼含审慎行事及由此取得成功的意味。正文保留其行为层面的词义，脚注注明结果性译法，不把两者之间的张力静默消除。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“无论做什么都”比直译“在他一切道路上”更符合现代汉语；“行事明智”保留原文的行动含义。
