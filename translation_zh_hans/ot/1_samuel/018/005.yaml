base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/005.yaml
  text: David went out wherever Saul sent him[a], and he acted wisely. So Saul appointed him over the men of war[b], and this was good in the eyes of all the people and also in the eyes of Saul’s servants.
translation:
  language: zh_hans
  text: 大卫每次出去执行扫罗所差遣的任务，都行事明智[a]。于是扫罗立他为战士的统领；这在众百姓眼中都看为好，在扫罗的臣仆眼中也是如此[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “行事明智”或译“行事顺利”或“取得成功”。希伯来语这个词既可指明智、审慎地行事，也可包含由此成功的意思。
    reason: lexical_alternative
  - marker: b
    text: 或译：“这使众百姓和扫罗的臣仆都喜悦。”希伯来语所指的可能是大卫本人、对他的任命，或上文所述的整个情况。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: 去办
  rationale: 原义为“出去”。结合扫罗差派大卫执行任务的叙事语境，译作“去办”在现代汉语中自然，同时保留奉命外出办事的含义。
- source_word: בְּכֹל אֲשֶׁר יִשְׁלָחֶנּוּ שָׁאוּל
  choice: 扫罗无论派大卫去办什么事
  rationale: 该短语可表达每一次差派或各项任务；“无论……什么事”既符合汉语习惯，也不把意思限于地点。
- source_word: יַשְׂכִּיל
  choice: 办得明智
  rationale: שׂכל 的使役形兼有行事明智、审慎以及因此顺利成功的语义。“办得明智”保留智慧行事这一词义核心，并以脚注说明成功这一可能含义。
- source_word: וַיְשִׂמֵהוּ
  choice: 立他统领
  rationale: שׂים 与 עַל 连用在行政或军事语境中表示委任某人管理他人；“立他统领”简洁而庄重。
- source_word: עַל אַנְשֵׁי הַמִּלְחָמָה
  choice: 统领战士
  rationale: 直译为“在作战的人之上”。“战士”保留军事和男性集体含义，比现代制度色彩较强的“军队司令”更少增译。
- source_word: וַיִּיטַב בְּעֵינֵי
  choice: 这事在……眼中看为好
  rationale: 保留希伯来语“在……眼中为好”的评价习语，并用“这事”避免武断认定所喜悦的仅是大卫本人、任命本身或前述整体局面。
- source_word: כָל הָעָם
  choice: 众百姓
  rationale: עם 在此最自然地泛指人民；后文另提扫罗的臣仆，故不宜缩窄为军兵。
- source_word: עַבְדֵי שָׁאוּל
  choice: 扫罗的臣仆
  rationale: עבדים 在王室环境中可指服侍君王的臣属、官员或侍从。“臣仆”既保留从属关系，也符合宫廷语境。
theological_decisions: []
