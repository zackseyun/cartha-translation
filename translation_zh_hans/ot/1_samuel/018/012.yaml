base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/012.yaml
  text: Saul was afraid of David[a], because Yahweh was with him and had departed from Saul.
translation:
  language: zh_hans
  text: 扫罗害怕大卫[a]，因为雅威与大卫同在，已经离开扫罗。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“扫罗惧怕大卫。”希伯来文直译为“扫罗从大卫面前害怕”，这是一个惯用表达，意思是大卫是扫罗惧怕的对象或原因。
    reason: 词义替代译法
lexical_decisions:
- source_word: וַיִּרָא
  choice: 害怕
  rationale: 该词源自 ירא，表示惧怕。“害怕”是现代汉语中自然、清楚的表达，也保留了扫罗真实的恐惧感。
- source_word: מִלִּפְנֵי
  choice: 大卫
  rationale: 这一介词组合字面为“从……面前”，但与 ירא 连用并以人为宾语时，表示那人是惧怕的对象或原因；汉语自然表达为“害怕大卫”。
- source_word: כִּי
  choice: 因为
  rationale: 此处引出扫罗害怕大卫的原因，译作“因为”最清楚地表达因果关系。
- source_word: יְהוָה
  choice: 雅威
  rationale: 原文直接使用神的专名四字神名；采用现代汉语常见音译“雅威”，不以称号替代专名。
- source_word: עִמּוֹ
  choice: 与他同在
  rationale: 原文使用第三人称代词，按上下文自然指大卫；译文保留代词形式及其清楚的上下文指向。
- source_word: וּמֵעִם שָׁאוּל סָר
  choice: 却已经离开扫罗
  rationale: סור 可表示离开、转离或撤去。这里与“雅威与他同在”形成对照；“已经离开”自然表达在扫罗产生惧怕以前便已存在的状况，而不添加离开方式的说明。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文使用的是神的专名，而非“主”这一称号；“雅威”较直接地体现该名的学术通行拟音。
- issue: 雅威离开扫罗的具体含义
  choice: 仅译为“雅威……已经离开扫罗”
  alternative: “雅威的灵已经离开扫罗”或“雅威的恩宠已经离开扫罗”
  rationale: 本节本身没有“灵”或“恩宠”等限定语。译文不从邻近经文补入内容，也不把这一陈述缩减为某一种神学解释，从而保留原文的张力。
- issue: עִמּוֹ 中代词的指向
  choice: 保留“他”，由上下文指向大卫
  alternative: 明说“与大卫同在”
  rationale: 上下文清楚表明所指是大卫；保留代词更贴近原文，同时不妨碍理解。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“害怕”比“惧怕”更口语自然，脚注则保留较正式的替代译法。转折词“却”明确呈现雅威与大卫同在和离开扫罗之间的对照，但不增添原文没有说明的神学机制。
