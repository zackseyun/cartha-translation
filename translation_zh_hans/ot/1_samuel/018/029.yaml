  text: וַ/יֹּ֣אסֶף שָׁא֗וּל לֵ/רֹ֛א מִ/פְּנֵ֥י דָוִ֖ד ע֑וֹד וַ/יְהִ֥י שָׁא֛וּל אֹיֵ֥ב אֶת דָּוִ֖ד כָּל הַ/יָּמִֽים־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/029.yaml
  text: Saul continued to fear David even more[b][a], and Saul was David’s enemy all his days.
translation:
  language: zh_hans
  text: 扫罗就越发惧怕大卫[a]，并且一直与大卫为敌[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“扫罗仍旧惧怕大卫”或“扫罗继续惧怕大卫”。希伯来语同时使用“继续／进一步”和“还、仍”的表达，既可强调持续，也可强调程度加深。
    reason: lexical_alternative
  - marker: b
    text: 直译：“扫罗在所有的日子都是大卫的敌人。”这句话可强调敌意始终持续，也可能指扫罗一生都与大卫为敌。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאסֶף שָׁאוּל לֵרֹא
  choice: 扫罗就越发惧怕
  rationale: יָסַף加不定式表示动作继续或进一步发生；结合后面的עוֹד及上下文，用“越发惧怕”自然表达恐惧加深。
- source_word: מִפְּנֵי דָוִד
  choice: 大卫
  rationale: 在表示惧怕的动词之后，מִפְּנֵי按习语标明惧怕的对象，不宜机械译作“从大卫面前”。
- source_word: עוֹד
  choice: 越发
  rationale: 此处既可表示“仍旧、继续”，也可按叙事语境表示程度进一步加深；“越发”简明传达后者，并以脚注保留前者。
- source_word: וַיְהִי שָׁאוּל אֹיֵב אֶת דָּוִד
  choice: 并且一直与大卫为敌
  rationale: אֹיֵב是“敌人、仇敌”；汉语“与……为敌”自然表达以大卫为敌对对象，且“一直”与后面的持续时间相呼应。
- source_word: כָּל הַיָּמִים
  choice: 一直
  rationale: 字面为“所有的日子”，可表示持续不断，也可能指扫罗一生；正文采用自然的持续性表达，脚注说明字面形式及可能含义。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事用语。“越发惧怕”承接上下文的递进，“一直与大卫为敌”避免生硬照搬希伯来语，同时用脚注保留时间短语的语义幅度。
