base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/017.yaml
  text: Then Saul said to David, “Look, my older daughter Merab—I will give her to you as a wife. Only be a valiant man for me, and fight the LORD’s battles.” For Saul said, “Let not my hand be against him, but let the hand of the Philistines be against him.”
translation:
  language: zh_hans
  text: 扫罗对大卫说：“看，我的大女儿米拉，我要把她给你作妻子。只要你为我作勇士，为耶和华打仗。”扫罗说：“不要让我的手加害他，而要让非利士人的手加害他。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: 看
  rationale: 保留引人注意的语气，比单纯译作“这是”更自然，也与上下文中扫罗当面提出婚约的场景相称。
- source_word: בִתִּי הַגְּדוֹלָה
  choice: 我的大女儿
  rationale: הַגְּדוֹלָה在姐妹关系中指年长者；现代汉语用“大女儿”自然清楚。
- source_word: לְבֶן־חַיִל
  choice: 作勇士
  rationale: 该短语在军事语境中指勇敢善战的人；此处与随后“争战”衔接，译作“勇士”简洁准确。
- source_word: מִלְחֲמוֹת יְהוָה
  choice: 为耶和华争战
  rationale: 原文直译为“耶和华的战争”；汉语用“为耶和华争战”自然表达归属于耶和华的战事，同时不额外解释其神学性质。
- source_word: יָד
  choice: 手
  rationale: 保留希伯来文以“手”表示施害力量或手段的意象；在汉语中用“手加害”可通顺传达。
theological_decisions:
- issue: “耶和华的战争”与扫罗的隐秘杀意之间的张力
  choice: 保留扫罗口中的“为耶和华争战”，随后直接呈现其借非利士人之手害大卫的盘算
  alternative: 把前者解释性译成“为以色列打圣战”，或明说扫罗假借上帝之名
  rationale: 原文让公开的敬虔言辞与隐秘动机并置，并未由叙述者明确作神学评判；译文不替读者消解这种张力。
- issue: וְשָׁאוּל אָמַר所指的言说方式
  choice: 译作“扫罗心里说”
  alternative: 译作“扫罗说”或“扫罗想”
  rationale: 内容显然是未向大卫公开的谋划；“心里说”既符合希伯来叙事中内在言语的表达，也保留“说”的形式。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言；人名依通行圣经译名处理。句式保留原文先公开讲话、后揭示内心动机的对照。
