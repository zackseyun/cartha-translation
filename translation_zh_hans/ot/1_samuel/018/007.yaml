base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/007.yaml
  text: And the women who were celebrating sang responsively[a], saying, “Saul has struck down his thousands[c][b], and David his tens of thousands.”
translation:
  language: zh_hans
  text: '欢庆的妇女彼此应和着唱[a][b]，说：

    “扫罗击杀了千千[c]，

    大卫击杀了万万。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“彼此回应”；这里很可能指轮流对唱或应和歌唱。
    reason: lexical_alternative
  - marker: b
    text: 原文这个词也可表示嬉戏、跳舞或欢乐庆祝。
    reason: lexical_alternative
  - marker: c
    text: 或译“击倒”；希伯来文直译为“击打”，这里用于军事语境，含有杀敌之意。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעֲנֶינָה
  choice: 彼此应和着唱
  rationale: ענה在歌唱表演的语境中可指回应、对唱；此译既保留“回应”的词义，又自然表达轮流应和歌唱的场景。
- source_word: הַנָּשִׁים
  choice: 妇女
  rationale: 直接保留希伯来文复数名词所指的女性群体。
- source_word: הַמְשַׂחֲקוֹת
  choice: 欢庆的
  rationale: שׂחק的分词在节庆场景中可涵盖嬉戏、歌舞和欢乐庆祝；“欢庆”自然且不把动作限定为跳舞或游戏。
- source_word: וַתֹּאמַרְןָ
  choice: 说
  rationale: 保留叙事中的引语引介；前文已经明确她们在唱，因此“说”可自然引出歌词。
- source_word: הִכָּה
  choice: 击杀了
  rationale: נכה本义为“击打”，在军事战果的语境中指击倒或杀死敌人；“击杀”兼顾其字面动作和军事含义。
- source_word: באלפו
  choice: 千千
  rationale: 这里的介词加数词表示归于扫罗的战绩数目；“千千”与下句“万万”形成简洁而有节奏的诗歌对仗。
- source_word: בְּרִבְבֹתָיו
  choice: 万万
  rationale: רבבה通常指“一万”，其复数在此与“千千”平行；“万万”保留夸张有力的胜利歌谣语气和数量对比。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言；歌词以两行排布，突出希伯来诗歌的平行结构。“千千／万万”保留汉语中熟悉的歌谣节奏，同时不把这些数目强行解释为精确统计。
