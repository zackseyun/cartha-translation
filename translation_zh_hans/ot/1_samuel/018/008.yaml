base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/008.yaml
  text: Then Saul became very angry[a], and this matter displeased him. He said, “They have given David ten thousands, but to me they have given the thousands[b]; what more can he have but the kingdom?”
translation:
  language: zh_hans
  text: 扫罗就非常恼怒[a]，这话使他很不高兴。他说：“她们把万万归给大卫，却把千千归给我；他还会得到什么呢？只剩王位了[b]！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “恼怒”所译的希伯来词含有怒火燃烧的意味。
    reason: lexical_alternative
  - marker: b
    text: 希伯来原文十分简练，近似直译为：“而且，给他的只剩王权了。”意思是，在扫罗看来，大卫如今只差得到王权。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר לְשָׁאוּל מְאֹד
  choice: 扫罗就非常恼怒
  rationale: חָרָה描写怒气发作，字面有“燃烧”之意；“非常恼怒”以自然现代汉语表达 מְאֹד 的强烈程度。
- source_word: וַיֵּרַע בְּעֵינָיו
  choice: 使他很不高兴
  rationale: 希伯来习语字面为“在他眼中是坏的”，此处指扫罗听见这话后的不悦反应；译文避免生硬直译。
- source_word: הַדָּבָר הַזֶּה
  choice: 这话
  rationale: דָּבָר 可指事情、话语；上下文直接指妇女所唱的话，因此译作“这话”，同时不增添具体解释。
- source_word: נָתְנוּ
  choice: 归给
  rationale: 动词基本义为“给”；在歌谣对战绩的称颂中，“归给”自然传达把功绩或数目算在某人名下的意思。
- source_word: רְבָבוֹת / הָאֲלָפִים
  choice: 万万 / 千千
  rationale: 保留原文复数数词及鲜明平行对比，也呼应前一节歌谣式表达；这里侧重称颂规模，并非要求精确统计。
- source_word: וְעוֹד לוֹ אַךְ הַמְּלוּכָה
  choice: 他还缺什么呢？只差王位了
  rationale: 原文是高度压缩的感叹：“而且，对他还只有王权”；译文以自然汉语呈现扫罗的推断，即大卫如今只差取得王权。
- source_word: הַמְּלוּכָה
  choice: 王位
  rationale: מְלוּכָה 可指王权、王位或王国；此处扫罗惧怕的是大卫取得君王身份和统治权，“王位”最贴合语境。
theological_decisions:
- issue: 扫罗末句是否断言大卫必得王位
  choice: 保留为扫罗出于嫉妒和恐惧所作的推断
  alternative: 译成客观预言：“他接下来必得国度”
  rationale: 原文是扫罗的直接引语和反应，并未要求叙述者认可其判断；译文不将其提升为神学宣告。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。以“万万／千千”保留歌谣的对称和夸张色彩；末句用带感叹意味的口吻表现扫罗的嫉妒与警惕。所有脚注标记均已置于正文。
