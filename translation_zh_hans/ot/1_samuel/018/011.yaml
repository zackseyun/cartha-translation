  text: Saul hurled the spear and said, “I will pin David to the wall.” But David dodged away from him twice.
translation:
  language: zh_hans
  text: 扫罗把矛掷出去，说：“我要把大卫钉在墙上！”大卫却两次躲开了他。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּטֶל
  choice: 把矛掷出去
  rationale: 该动词在此表示投掷；结合宾语“矛”，译为“把矛掷出去”自然且准确。
- source_word: אַכֶּה בְדָוִד וּבַקִּיר
  choice: 我要把大卫钉在墙上
  rationale: 希伯来语字面近于“我要击中大卫和墙”；语境表达用矛刺穿大卫、使他贴在墙上的意图。“钉在墙上”保留这一强烈意象，也符合现代汉语表达。
- source_word: וַיִּסֹּב דָּוִד מִפָּנָיו
  choice: 大卫却……躲开了他
  rationale: וַיִּסֹּב 基本义为转开、避开；在躲避掷矛的场景中译作“躲开”清楚自然。
- source_word: פַּעֲמָיִם
  choice: 两次
  rationale: 直接保留原文次数，可能概括扫罗先后两次袭击而大卫均避开。
theological_decisions:
- issue: 扫罗话语中“击打大卫和墙”的关系
  choice: 译为“把大卫钉在墙上”
  alternative: “我要击中大卫和墙”
  rationale: 原文结构可直译为同时提到大卫与墙，但语境所指是以矛穿透或固定大卫于墙；采用自然汉语传达其杀意，不增添宗派性解释。
translation_notes:
  register: 采用现代、凝练而庄重的叙事语言。“把矛掷出去”呈现动作，“钉在墙上”保留原文的暴力意象；转折词“却”清楚表现袭击与躲避之间的关系。
