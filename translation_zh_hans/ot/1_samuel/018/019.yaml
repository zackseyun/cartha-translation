  text: But when the time came to give Merab[a], Saul’s daughter, to David, she was given to Adriel the Meholathite as a wife.
translation:
  language: zh_hans
  text: 到了该把扫罗的女儿米拉嫁给大卫的时候，她却被嫁作米何拉人亚得列的妻子。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי בְּעֵת
  choice: 到了……的时候
  rationale: 该叙事结构连同时间短语引出事态的发展；此译自然地表达“在……之时”，并让下文的意外转折显明。
- source_word: תֵּת אֶת מֵרַב בַּת שָׁאוּל לְדָוִד
  choice: 把扫罗的女儿米拉给大卫
  rationale: 保留נתן“给”的婚配语境，并按现代汉语习惯排列亲属称谓和人名。
- source_word: וְהִיא נִתְּנָה
  choice: 她却被嫁给了
  rationale: 保留希伯来文被动表达所聚焦的对象；“却”传达与原先安排相反的叙事转折，“嫁给”在汉语中清楚表达婚配含义。
- source_word: לְעַדְרִיאֵל הַמְּחֹלָתִי
  choice: 给了米何拉人亚得列
  rationale: 将族属形容词译为自然的籍贯称谓“米何拉人”，人名按常见中文圣经形式音译。
- source_word: לְאִשָּׁה
  choice: 嫁给
  rationale: 这是希伯来语惯用的婚姻表达；汉语“嫁给”简洁明确，也避免生硬直译为“给作妻子”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。句中前后两次“给”在原文都源于נתן，但后半句结合לְאִשָּׁה意译为“嫁给”，以符合现代汉语婚配表达；不增添原文未明说的动机或行动者。
