  rationale: 仅作汉语表达与婚配短语的微调：将前半句明确为“嫁给”，并将后半句改为“被嫁作……的妻子”，以自然、完整地对应原文的婚配语义和被动叙事焦点；人名、族称及转折关系均维持不变。
