- source_word: וַיְהִי
  choice: 就一直
  rationale: 这里的 היה 与后面的分词性形式共同表达持续状态；用“就一直”既承接叙事，也自然体现动作从此延续。
- source_word: שָׁאוּל
  choice: 扫罗
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: עון
  choice: 盯着
  rationale: 这个罕见或缺写形式在本语境中表示带有敌意、嫉妒或猜疑的注视。“盯着”保留了“注视、监看”的基本意象，又不在正文中把其具体动机限定为单一解释；负面语气由上下文和脚注说明。
- source_word: אֶת
  choice: —
  rationale: 希伯来语直接宾语标记，中文无需另译。
- source_word: דָּוִד
  choice: 大卫
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: מֵהַיּוֹם הַהוּא וָהָלְאָה
  choice: 从那天起
  rationale: 自然、完整地表达以那一天为起点并持续下去的时间含义；“一直”进一步体现 וָהָלְאָה 的延续性。
