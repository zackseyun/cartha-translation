base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/030.yaml
  text: Then the commanders of the Philistines went out[a], and as often as they went out, David acted more wisely than all the servants of Saul[c][b], so that his name was highly esteemed.
translation:
  language: zh_hans
  text: 非利士人的将领出战；每逢他们出战，大卫行事比扫罗所有的臣仆都更有智慧[a]，他的名声就极受尊重[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“大卫比扫罗所有的臣仆都更亨通”，或“更成功”。原文动词既可指明智审慎地行事，也可指由此取得成功。
    reason: lexical_alternative
  - marker: b
    text: 直译：“他的名极为宝贵（或尊贵）”，意思是他的声誉备受尊崇。
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרֵי פְלִשְׁתִּים
  choice: 非利士人的将领
  rationale: שָׂרִים可指首领、官长或军事统帅；本节处于交战语境，“将领”自然地表达其军事身份，又不过度限定具体军阶。
- source_word: וַיֵּצְאוּ / מִדֵּי צֵאתָם
  choice: 出战／每逢他们出战
  rationale: יצא本义为“出去”，这里指非利士将领反复采取军事行动；“出战”符合上下文。“每逢”准确表达מִדֵּי的反复、逐次含义。
- source_word: שָׂכַל מִכֹּל
  choice: 比……更有智慧
  rationale: שׂכל可表示明智审慎地行事，并可包含因此顺利、成功的意味；此译保留“智慧行事”的核心含义，比较级由מִכֹּל表达。
- source_word: עַבְדֵי שָׁאוּל
  choice: 扫罗所有的臣仆
  rationale: עֲבָדִים在王室语境中指服事君王的人，包括臣属和官员，并非专指奴隶；“臣仆”兼顾王室关系与中文表达。
- source_word: וַיִּיקַר שְׁמוֹ מְאֹד
  choice: 他的名声就极受尊重
  rationale: “他的名”在此指名望、声誉；יקר表示被看为宝贵、尊贵或受敬重，מְאֹד加强程度。“名声极受尊重”清楚传达原意，同时保留尊荣色彩。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“每逢”保留行动反复发生的语气；“臣仆”体现王室语境。正文不把שׂכל单纯收窄为“成功”，脚注保留其智慧、亨通和成功之间的语义张力。
