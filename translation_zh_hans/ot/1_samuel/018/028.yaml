  text: וַ/יַּ֤רְא שָׁאוּל֙ וַ/יֵּ֔דַע כִּ֥י יְהוָ֖ה עִם דָּוִ֑ד וּ/מִיכַ֥ל בַּת שָׁא֖וּל אֲהֵבַֽתְ/הוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/028.yaml
  text: Saul saw and knew that Yahweh was with David[a], and that Michal the daughter of Saul loved him.
translation:
  language: zh_hans
  text: 扫罗看见了，也知道雅威[a]与大卫同在；他也知道扫罗的女儿米甲爱他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威”是希伯来文上帝专名יהוה（YHWH）的译音；传统汉译常作“耶和华”。
    reason: 说明神名的原文性质及常见汉译，帮助普通读者识别。
lexical_decisions:
- source_word: וַיַּרְא
  choice: 看见了
  rationale: 保留ראה在叙事中的普通含义“看见”，并与下文“知道”形成从观察到确认的推进，不将两个动词合并为“意识到”。
- source_word: וַיֵּדַע
  choice: 知道
  rationale: ידע在这里表示扫罗根据所见而有了确定的认识；“知道”直接保留原词的基本意义。
- source_word: כִּי
  choice: （由后接分句直接表达内容）
  rationale: כִּי引出扫罗所知道的内容。现代汉语无需另译“that”，直接用“知道雅威与大卫同在”即可自然表达。
- source_word: יְהוָה
  choice: 雅威
  rationale: 这是四字神名יהוה（YHWH）。采用较贴近其通行学术拟音的“雅威”，保留其作为专名的性质，而不以称号替代。
- source_word: עִם דָּוִד
  choice: 与大卫同在
  rationale: עִם表示同在或相伴；“与大卫同在”既自然，也保留神临在和眷顾的含义而不作过度解释。
- source_word: וּמִיכַל בַּת שָׁאוּל
  choice: 并且扫罗的女儿米甲
  rationale: 原文没有重复כִּי，但此分句自然构成扫罗所知道的第二项内容。“扫罗的女儿米甲”是现代汉语中自然清楚的表达。
- source_word: אֲהֵבַתְהוּ
  choice: 爱他
  rationale: 该形式表达持续的爱；汉语简单动词“爱”足以传达这种状态。“他”保留原文的第三人称代词，所指由上下文确定为大卫。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文使用的是以色列上帝的专名，而非普通称号。“雅威”较贴近YHWH的通行拟音；脚注同时说明传统汉译，以便读者识别。
- issue: “与大卫同在”的含义
  choice: 保留“同在”措辞
  alternative: 帮助大卫；支持大卫
  rationale: 原文עִם可蕴含神的眷顾和支持，却直接表达“与……同在”。译文不把这一神学意味缩减为单一的实际帮助。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“看见了，也知道”保留原文两个并列动词及其认识上的推进；第二个内容分句以“并且”连接，避免生硬重复。
