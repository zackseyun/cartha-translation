base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/026.yaml
  text: So his servants told David these words[a], and the matter seemed right in David’s eyes, to become the king’s son-in-law[c][b]; and the days had not yet been fulfilled.
translation:
  language: zh_hans
  text: 扫罗的臣仆把这些话告诉大卫。大卫看这事为好，愿意与王结亲[a]；期限还没有届满[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 即成为王的女婿。原文也可译作“与王家结为姻亲”。
    reason: lexical_alternative
  - marker: b
    text: 直译“日子还没有满”，指限定的时间尚未结束。
    reason: idiom_clarification
lexical_decisions:
- source_word: וַיַּגִּדוּ
  choice: 告诉
  rationale: 使役词形在此表示“使人知道、告知”；“告诉”符合现代汉语叙事表达。
- source_word: עֲבָדָיו
  choice: 扫罗的臣仆
  rationale: 原文直译为“他的仆人”；根据上文，所指是扫罗派出的宫廷臣仆。明说“扫罗”可避免汉语代词指向不清。
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: 这些话
  rationale: דברים既可指“话”也可指“事情”；此处臣仆在转述扫罗的话，因此译作“这些话”。
- source_word: וַיִּשַׁר הַדָּבָר בְּעֵינֵי דָוִד
  choice: 大卫看这事为好
  rationale: 保留希伯来语“在某人眼中为正／好”的判断性习语，同时使现代汉语自然易懂；不把它过度收窄为单纯情绪上的“喜欢”。
- source_word: לְהִתְחַתֵּן בַּמֶּלֶךְ
  choice: 愿意与王结亲
  rationale: התחתן在此指借婚姻建立亲属关系。“与王结亲”贴近原文，具体情境则是大卫成为王的女婿。
- source_word: וְלֹא מָלְאוּ הַיָּמִים
  choice: 期限还没有届满
  rationale: 原文直译为“日子还没有满”，是指一段限定时间尚未结束；“期限还没有届满”在现代汉语中清楚自然。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“臣仆”体现王宫语境；“看这事为好”保留原文习语的判断意味；分号呈现后半句与大卫决定之间紧密但略显突转的叙事关系。
