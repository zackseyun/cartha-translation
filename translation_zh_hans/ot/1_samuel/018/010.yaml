source:
  edition: WLC
  text: וַ/יְהִ֣י מִֽ/מָּחֳרָ֗ת וַ/תִּצְלַ֣ח רוּחַ֩ אֱלֹהִ֨ים רָעָ֤ה אֶל שָׁאוּל֙ וַ/יִּתְנַבֵּ֣א בְ/תוֹךְ הַ/בַּ֔יִת וְ/דָוִ֛ד מְנַגֵּ֥ן בְּ/יָד֖/וֹ כְּ/י֣וֹם בְּ/י֑וֹם וְ/הַ/חֲנִ֖ית בְּ/יַד שָׁאֽוּל׀׀־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/010.yaml
  text: And it happened on the next day that an evil spirit from God rushed upon Saul[a], and he prophesied within the house while David was playing with his hand, as day by day[d][c][b]; and the spear was in Saul’s hand.
translation:
  language: zh_hans
  text: 第二天，从神而来的恶灵猛然临到扫罗[a]，他就在屋里说预言[b]。当时大卫照常用手弹奏[c]，扫罗手里拿着长矛。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“从神而来的有害之灵”；希伯来语较直译为“神的恶灵”。
    reason: 保留 רָעָה 可表示“恶的”或“有害的”，以及构造短语所含的来源或归属张力。
  - marker: b
    text: 或译“他作先知般地狂乱起来”，也可理解为“他进入先知性的出神状态”。该动词通常指说预言，也可指先知式的出神表现；本处语境可能带有失控、狂乱的意味。
    reason: 原动词可指说预言或先知式的出神表现；脚注保留本处具体含义的真实歧义及语境所支持的理解。
  - marker: c
    text: 本节没有说出所弹奏的乐器名称，虽然上下文其他经节有所交代。
    reason: 说明正文没有把上下文中的乐器名称补入本节。
lexical_decisions:
- source_word: מִמָּחֳרָת
  choice: 第二天
  rationale: 自然、简洁地表达前述事件之后的次日，并保持叙事顺序。
- source_word: וַתִּצְלַח
  choice: 猛然临到
  rationale: 该动词以“灵”为主语时表示强有力地袭来或降临；“猛然临到”兼顾动作的突然性和强度。
- source_word: רוּחַ אֱלֹהִים רָעָה
  choice: 从神而来的恶灵
  rationale: “从神而来”保留原文所表达的来源或差遣关系，“恶灵”直接对应 רוּחַ…רָעָה；脚注同时保留“有害的灵”和较直译说法。
- source_word: וַיִּתְנַבֵּא
  choice: 陷入先知般的狂乱
  rationale: 该词通常与先知活动有关，但本处在恶灵临到和随后暴力行为的语境中，也可指狂乱的出神状态。正文兼顾词源联系与具体语境，脚注保留“说起预言来”的可能。
- source_word: בְּתוֹךְ הַבַּיִת
  choice: 在屋里
  rationale: 用自然现代汉语准确表达地点。
- source_word: מְנַגֵּן בְּיָדוֹ
  choice: 用手弹奏
  rationale: 保留“弹奏”及原文明说的“用他的手”，但不在正文补出本节未提及的乐器。
- source_word: כְּיוֹם בְּיוֹם
  choice: 仍像每天一样
  rationale: 这是表示日常惯例的习语；此译法在现代汉语中自然，并保留每日反复之意。
- source_word: הַחֲנִית
  choice: 长矛
  rationale: 准确指称扫罗手中的投刺武器，也避免现代汉语“枪”容易使人联想到火器的歧义。
- source_word: בְּיַד שָׁאוּל
  choice: 扫罗手里拿着
  rationale: 采用自然汉语表达持有状态，并保留为下文蓄势的险恶细节。
theological_decisions:
- issue: 如何表达 רוּחַ אֱלֹהִים רָעָה 中神与恶灵的关系
  choice: 从神而来的恶灵
  alternative: 从神而来的有害之灵；直译“神的恶灵”
  rationale: 原文明确把这灵与神的来源或差遣联系起来，却未解释其运作机制。“从神而来”保留神在叙事中的主权和原文张力，同时避免让现代读者误以为“恶”是神本性的属性。
- issue: וַיִּתְנַבֵּא 是否表示真正的预言
  choice: 陷入先知般的狂乱
  alternative: 说起预言来；进入先知性的出神状态
  rationale: 原词确属“作先知／说预言”词族，因此不能完全抹去先知活动的关联；但恶灵和随后的攻击行为使“狂乱”成为本处重要的语境含义。正文不将其认定为真实启示，脚注保留较形式对应的译法。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“猛然临到”保留叙事力度；“陷入先知般的狂乱”避免把语境含义简化成真正的预言，同时以脚注保留原词的形式含义；“用手弹奏”紧贴原文而不擅自补出乐器；“长矛”比“枪”更能避免现代读者误解为火器。
