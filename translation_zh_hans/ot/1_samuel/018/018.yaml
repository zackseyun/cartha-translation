  text: וַ/יֹּ֨אמֶר דָּוִ֜ד אֶל שָׁא֗וּל מִ֤י אָֽנֹכִי֙ וּ/מִ֣י חַיַּ֔/י מִשְׁפַּ֥חַת אָבִ֖/י בְּ/יִשְׂרָאֵ֑ל כִּֽי אֶהְיֶ֥ה חָתָ֖ן לַ/מֶּֽלֶךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/018.yaml
  text: And David said to Saul[a], “Who am I, and what is my life, or my father’s family in Israel, that I should become the king’s son-in-law?”
translation:
  language: zh_hans
  text: 大卫对扫罗说：“我是谁？我的身世算什么？我父家在以色列中又算什么，竟能成为王的女婿呢？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר דָּוִד אֶל שָׁאוּל
  choice: 大卫对扫罗说
  rationale: 以自然的现代汉语表达希伯来语叙事推进；本节无需机械译出连接词 וַ。
- source_word: מִי אָנֹכִי
  choice: 我是谁
  rationale: 保留反问形式，准确传达大卫自谦的语气。
- source_word: וּמִי חַיַּי
  choice: 我的身世算什么
  rationale: 字面近于“我的生命／人生是谁（或算什么）”，措辞特殊且含义存在歧义；结合后面的父家身份，此处用“身世”兼顾个人处境、出身和社会地位，避免武断限定为“亲族”。
- source_word: מִשְׁפַּחַת אָבִי בְּיִשְׂרָאֵל
  choice: 我父家在以色列中又算什么
  rationale: מִשְׁפָּחָה 可指家族或宗族；“父家”简洁保留父系家族含义，“在以色列中”表达其群体内的身份地位。
- source_word: כִּי אֶהְיֶה חָתָן לַמֶּלֶךְ
  choice: 竟能成为王的女婿呢
  rationale: 在连续反问之后，“竟能……呢”自然传达 כִּי 所引出的自谦结论；חָתָן 在此具体指迎娶王女而成为王的女婿。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。连续三个“算什么”式反问凸显大卫的自谦，同时将较难确定的 חַיַּי 译为范围较宽的“身世”，保留其可能涉及人生处境、出身及身份的张力。
