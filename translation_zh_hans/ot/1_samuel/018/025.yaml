base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/025.yaml
  text: Then Saul said[a], “Thus you shall say to David, ‘The king has no desire for a bride-price except a hundred Philistine foreskins[c][b], to take vengeance on the king’s enemies.’” Now Saul intended to make David fall by the hand of the Philistines.
translation:
  language: zh_hans
  text: 扫罗说：“你们要这样对大卫说：‘王不要聘礼[a]，只要一百个非利士人的包皮，好向王的仇敌报仇。’”扫罗盘算着要借非利士人的手使大卫倒下[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “聘礼”指缔结婚姻时通常由男方或男方家族交给女方家族的财物，并非现代意义上的“嫁妆”。
    reason: cultural_note
  - marker: b
    text: “使大卫倒下”在这里很可能指使他丧命，但原文未明确说“死”，也可含有使他败亡的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: מֹהַר
  choice: 聘礼
  rationale: 指婚姻缔结时通常由男方或其家族交给女方家族的财物；现代汉语“聘礼”既准确又自然，不宜译作通常由女方带入婚姻的“嫁妆”。
- source_word: אֵין חֵפֶץ לַמֶּלֶךְ ... כִּי
  choice: 王不要……只要……
  rationale: 将“没有意愿/喜好……而是”按汉语交易语境自然表达，同时保留普通聘礼与特殊要求之间的对照。
- source_word: בְּמֵאָה עָרְלוֹת פְּלִשְׁתִּים
  choice: 一百个非利士人的包皮
  rationale: 直译具体而令人震惊的要求，不加委婉，也不把它泛化为杀敌凭证。
- source_word: לְהִנָּקֵם בְּאֹיְבֵי הַמֶּלֶךְ
  choice: 好向王的仇敌报仇
  rationale: 该尼法勒不定式在此表达所宣称的目的；汉语用“报仇”自然地涵盖复仇之意，并保留扫罗以“王”自称的措辞。
- source_word: חָשַׁב
  choice: 盘算着
  rationale: 上下文表明这不是单纯思想活动，而是带有谋划性质的意图；“盘算”贴合扫罗设局的语境。
- source_word: לְהַפִּיל אֶת־דָּוִד בְּיַד פְּלִשְׁתִּים
  choice: 使大卫死在非利士人手里
  rationale: הפיל 字面为“使……倒下”，结合“在……手里”的敌对行动语境，很可能指使大卫丧命；正文采用自然明确的汉语，并以脚注保存较字面的表达及其可能的宽泛含义。
theological_decisions:
- issue: 扫罗所称报仇的施事语态
  choice: 好向王的仇敌报仇
  alternative: 使王在仇敌身上得报复
  rationale: 原文尼法勒形式容许被动或反身色彩，但现代汉语若强行被动会生硬；采用目的性主动表达，不额外赋予神学主体。
- issue: “使大卫倒下”是否明确指死亡
  choice: 正文译为“使大卫死在……手里”，脚注保留字面歧义
  alternative: 使大卫倒在非利士人手下
  rationale: 叙事语境明显指扫罗企图借非利士人杀死大卫，但希伯来语本身使用“使倒下”的隐喻；以正文传达语境，以脚注保存原文张力。
translation_notes:
  register: 采用现代、庄重而清楚的叙事语言。“王不要……只要……”符合自然汉语；保留“包皮”的直截与冲击力。脚注标记均置于相关正文之后。
