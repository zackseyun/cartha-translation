base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/013.yaml
  text: So Saul removed him from his presence and appointed him commander of a thousand[a], and he went out and came in before the people.
translation:
  language: zh_hans
  text: 于是，扫罗使他离开自己身边，任命他作千夫长；他就在百姓面前出入[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “出入”直译希伯来文“出去、进来”，是指从事公开事务或军事行动的表达，也可能含有带领百姓之意。
    reason: 说明希伯来习语，并保留其在公开活动、军事行动和领导含义之间的语义空间。
lexical_decisions:
- source_word: וַיְסִרֵהוּ
  choice: 使他离开
  rationale: 该动词是סוּר的使役形式，表示使某人离开或将某人调离；译作“使他离开”保留具体动作，不额外断定这是贬谪或解职。
- source_word: מֵעִמּוֹ
  choice: 自己身边
  rationale: 字面为“从与他同在之处”；“离开自己身边”符合现代汉语，也保留扫罗将大卫调离近身位置的关系和宫廷语境。
- source_word: וַיְשִׂמֵהוּ לוֹ
  choice: 任命他作
  rationale: שׂוּם在此表示安置、委派某人担任职务；“任命”清楚传达正式委任，而不生硬直译לוֹ。
- source_word: שַׂר אָלֶף
  choice: 千夫长
  rationale: שַׂר是首领或统领，אָלֶף在军事编制语境中指一千人或“千人队”；“千夫长”简洁、庄重，并保留古代军职称谓。
- source_word: וַיֵּצֵא וַיָּבֹא
  choice: 出入
  rationale: 原文连用“出去、进来”，可指公开或军事活动，也可能含带领之意；正文保留“出入”，避免把潜在的领导含义定死。
- source_word: לִפְנֵי הָעָם
  choice: 在百姓面前
  rationale: 按基本意义译出“在百姓面前”，既可表示公开可见，也可能暗含走在百姓前头；不在正文中排除任一可能。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“千夫长”沿用读者较熟悉的古代军职表达；“在百姓面前出入”有意保留原文措辞及其可能的双重含义。
