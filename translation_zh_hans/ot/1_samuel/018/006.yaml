base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/006.yaml
  text: And it happened[a], as they were coming in, when David returned from striking down the Philistine, that the women came out from all the cities of Israel, singing and dancing, to meet King Saul with tambourines, with joy, and with three-stringed instruments.
translation:
  language: zh_hans
  text: 当他们归来、大卫击败那非利士人回来时，以色列各城的妇女们出来，唱歌跳舞，带着手鼓和三弦乐器[a]，欢欢喜喜地迎接扫罗王。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “三弦乐器”所译的希伯来词含义不确定；它可能指三弦乐器、鲁特琴一类的乐器，或其他音乐伴奏。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בְּבוֹאָם
  choice: 他们进城的时候
  rationale: 以自然的汉语时间从句表达叙事引介和“在他们来到时”；保留复数主语所指并不明确这一点，不擅自补明具体人物。
- source_word: בְּשׁוּב דָּוִד מֵהַכּוֹת אֶת־הַפְּלִשְׁתִּי
  choice: 大卫击杀那非利士人回来
  rationale: נכה 在此语境指将对方击倒并杀死；单数“那非利士人”承接前文的歌利亚，又不把名字直接加入正文。
- source_word: וַתֵּצֶאנָה הַנָּשִׁים מִכָּל עָרֵי יִשְׂרָאֵל
  choice: 妇女们就从以色列各城出来
  rationale: 直陈妇女从各城出来的动作；“各城”自然表达原文集合性的“所有城市”。
- source_word: לָשׁוּר וְהַמְּחֹלוֹת
  choice: 唱歌跳舞
  rationale: 原文由“歌唱”的不定式与“舞蹈”的名词并列；汉语采用惯用成对表达，准确传达伴随活动。
- source_word: לִקְרַאת שָׁאוּל הַמֶּלֶךְ
  choice: 迎接扫罗王
  rationale: לקראת 在此表示出来迎面会见，语境中“迎接”比单纯“会见”更贴切。
- source_word: בְּתֻפִּים
  choice: 打着手鼓
  rationale: תֹּף 是手持框鼓一类的打击乐器；“手鼓”现代、清楚，也避免将其等同于带铃片的现代铃鼓。
- source_word: בְּשִׂמְחָה
  choice: 欢欢喜喜地
  rationale: 以自然的汉语状语传达喜乐、欢庆的情态，并与演奏动作顺畅连接。
- source_word: וּבְשָׁלִשִׁים
  choice: 和三弦乐器
  rationale: 该词词义不确定，可能指具有“三”这一特征的乐器；正文采用较可能的理解，同时以脚注明确保留不确定性。
