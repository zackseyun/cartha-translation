  text: But all Israel and Judah loved David[a], because he went out and came in before them.
translation:
  language: zh_hans
  text: 但以色列和犹大众人都爱大卫[a]，因为他在他们面前出入。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为他率领他们出去，带领他们进来”，意思是他作他们的领袖，特别是在战事中。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כָל
  choice: 但……众人都
  rationale: 连词在此承接上文扫罗的惧怕与敌意，语篇上带有转折意味；“但”自然呈现这一关系，“众人都”保留 כָל 的全体含义。
- source_word: יִשְׂרָאֵל וִ/יהוּדָה
  choice: 以色列众人和犹大众人
  rationale: 原文分别提到以色列与犹大，保留两者的社会政治区分；在中文中补出“众人”，清楚表达 כָל 对这一并列群体的统摄。
- source_word: אֹהֵב
  choice: 都爱
  rationale: 该单数分词与复合主语连用，表达持续或一般性的状态；“都爱”既符合现代汉语叙事，也与前面的“众人”呼应。
- source_word: אֶת דָּוִד
  choice: 大卫
  rationale: אֶת 是直接宾语标记，不另行翻译；人名按通行中文译名译为“大卫”。
- source_word: כִּי
  choice: 因为
  rationale: 此处引出百姓爱大卫的原因，“因为”清楚保留因果关系。
- source_word: הוּא
  choice: 他
  rationale: 保留原文独立代词所明确标出的主语。
- source_word: יוֹצֵא וָ/בָא
  choice: 出入
  rationale: “出入”形式上贴近原文成对动词，又是自然、庄重的中文表达；同时保留其可能指公开活动或领军行动的习语空间，不在正文中擅自补入原文没有明说的宾语。
- source_word: לִ/פְנֵי/הֶם
  choice: 在他们前面
  rationale: 直接保留“在他们面前／前头”的空间表达，并允许读者感受到其可能包含率领众人的意味。
