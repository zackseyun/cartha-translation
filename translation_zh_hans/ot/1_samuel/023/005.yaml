base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/005.yaml
  text: So David and his men went to Keilah and fought against the Philistines[a], and he drove off their livestock and struck them with a great blow[c][b]. So David saved the inhabitants of Keilah.
translation:
  language: zh_hans
  text: 大卫和跟随他的人就往基伊拉去，与非利士人交战，赶走了他们的牲畜[a]，重重击败了他们[b]。这样，大卫救了基伊拉的居民[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“赶走了他们的牛群”；原文所用的词广指各类牲畜。
    reason: lexical_alternative
  - marker: b
    text: 或译“给他们以沉重打击”或“使他们遭受惨重败绩”。
    reason: lexical_alternative
  - marker: c
    text: “救了”也可译作“解救了”或“救出了”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ דָּוִד וַאֲנָשׁוֹ קְעִילָה
  choice: 大卫和跟随他的人就往基伊拉去
  rationale: הלך在连续叙事中表示“去、前往”；אֲנָשׁוֹ在军事语境中指跟随大卫的一班人。“跟随他的人”比泛称“他的人民”准确，也比单说“手下”略为庄重。基伊拉按专名音译。
- source_word: וַיִּלָּחֶם בַּפְּלִשְׁתִּים
  choice: 与非利士人交战
  rationale: לחם加ב在这里明确指以非利士人为交战对象；“与……交战”在现代汉语中自然且不会暗示同盟关系。
- source_word: וַיִּנְהַג אֶת־מִקְנֵיהֶם
  choice: 赶走了他们的牲畜
  rationale: נהג可指赶领动物，语境中含有从敌方带走之意；מִקְנֶה是牲畜的集合称谓，不限于牛，因此译作“牲畜”。
- source_word: וַיַּךְ בָּהֶם מַכָּה גְדוֹלָה
  choice: 重重击败了他们
  rationale: 该习语表示施以重大打击或造成惨重失败。“重重击败”保留强烈程度，又不把经文没有明说的死亡人数具体化。
- source_word: וַיֹּשַׁע דָּוִד אֵת יֹשְׁבֵי קְעִילָה
  choice: 大卫救了基伊拉的居民
  rationale: ישע在军事危难语境中意为拯救、解救；“救了”直接、自然。יֹשְׁבֵי是当地居住者，译作“居民”。
