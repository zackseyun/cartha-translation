base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/003.yaml
  text: But David’s men said to him[a], “Look, we are afraid here in Judah; how much more, then, if we go to Keilah against the battle lines of the Philistines?”
translation:
  language: zh_hans
  text: 但大卫的部下对他说：“你看，我们在犹大这里尚且害怕，更何况到基伊拉去，面对非利士人的战阵呢？”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“更不用说到基伊拉去，迎战非利士人的军阵了。”希伯来语的这一表达是从较轻的情形推论到更严重的情形。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: 但……说
  rationale: 该叙事形式推进情节；结合上下文，众人对行动表示畏惧，“但”自然体现与先前指示之间的转折。
- source_word: אַנְשֵׁי דָוִד
  choice: 大卫的部下
  rationale: 指跟随大卫的一群人；“部下”在军事处境中自然明确，也避免生硬直译为“大卫的人”。
- source_word: הִנֵּה
  choice: 你看
  rationale: 保留引起对方注意并加强申诉语气的功能，符合现代汉语口吻。
- source_word: אֲנַחְנוּ פֹה בִּיהוּדָה יְרֵאִים
  choice: 我们在犹大这里尚且害怕
  rationale: 保留地点和惧怕的陈述，并用“尚且”为下文由轻到重的论证自然铺垫。
- source_word: וְאַף כִּי
  choice: 更何况……呢
  rationale: 该希伯来语习语表达由较轻情形推到更严重情形；“更何况”准确而自然。
- source_word: נֵלֵךְ קְעִלָה
  choice: 到基伊拉去
  rationale: הלך与地名连用表示前往该目的地；按现代汉语语序表达。
- source_word: אֶל מַעַרְכוֹת פְּלִשְׁתִּים
  choice: 面对非利士人的战阵
  rationale: מַעַרְכוֹת指列阵作战的队伍或战线；介词在此语境含趋向并暗示交战，“面对”既保留方向性，也自然传达军事对峙。
theological_decisions: []
