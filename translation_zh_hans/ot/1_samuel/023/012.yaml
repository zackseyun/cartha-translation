base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/012.yaml
  text: Then David said[a], “Will the men of Keilah hand me and my men over into Saul’s hand?” And Yahweh said[c][b], “They will hand you over.”
translation:
  language: zh_hans
  text: 大卫问：“基伊拉人会把我和我的人交在扫罗手中[b]吗？”雅威说：“他们会把你交出去[c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 希伯来文直译为“在扫罗手里”，是指交入扫罗的权势和控制之下。
    reason: lexical_alternative
  - marker: c
    text: 希伯来文直译为“他们会把你交出去”，宾语“你”是单数。大卫所代表的随从可理解为也包括在内，但回答没有再次明说。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיַסְגִּרוּ / יַסְגִּירוּ
  choice: 会把……交出 / 会把……交出去
  rationale: 此处使役形表示把人交给敌对者、置于对方权下。“交出”是现代汉语中的自然说法，也保留了移交给敌方的含义；问答中尽量重复同一动词。
- source_word: בַּעֲלֵי קְעִילָה
  choice: 基伊拉人
  rationale: בַּעֲלֵי 字面可指“主人、拥有者”，但在这里指该城的居民或有身份的男子。“基伊拉人”自然且不武断限定为官长或全体公民。
- source_word: אֹתִי וְאֶת אֲנָשַׁי
  choice: 我和我的人
  rationale: אֲנָשַׁי 直译为“我的人”，语境中指跟随大卫的人，可能包括武装人员；不译作“士兵”，以免增加原文未明确说明的身份。
- source_word: בְּיַד שָׁאוּל
  choice: 落在扫罗手中
  rationale: 保留希伯来语“在某人手中”的意象，同时以“落在……手中”自然表达受其掌控的含义。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语中通行且贴近 YHWH 推定读音的形式音译上帝的专名，不以称号替代。
- source_word: יַסְגִּירוּ
  choice: 他们会把你交出去
  rationale: 原文回答中的宾语是第二人称阳性单数，直接指大卫；译文保留单数“你”，不擅自扩展为“你们”或“你和你的人”.
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文使用四字神名而非“主”这一称号；采用“雅威”保存其专名性质，并贴近学界通常重构的读音。
- issue: 回答中的单数宾语是否包括大卫的随从
  choice: 正文保留单数“你”
  alternative: 译为“你和你的人”或“你们”
  rationale: 大卫的问题同时提到自己和跟随者，但雅威的回答在语法上只用单数宾语。保留这一形式，避免消除大卫作为群体代表者的可能性及原文的简略表达。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“基伊拉人”避免把当地群体过度限定为官长或全体市民；“我的人”保留原文宽泛称谓；“落在扫罗手中”兼顾希伯来语意象与汉语习惯。所有注脚标记均置于相关正文之后。
