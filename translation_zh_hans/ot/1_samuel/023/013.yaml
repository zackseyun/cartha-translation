  text: וַ/יָּקָם֩ דָּוִ֨ד וַ/אֲנָשָׁ֜י/ו כְּ/שֵׁשׁ מֵא֣וֹת אִ֗ישׁ וַ/יֵּצְאוּ֙ מִ/קְּעִלָ֔ה וַ/יִּֽתְהַלְּכ֖וּ בַּ/אֲשֶׁ֣ר יִתְהַלָּ֑כוּ וּ/לְ/שָׁא֣וּל הֻגַּ֗ד כִּֽי נִמְלַ֤ט דָּוִד֙ מִ/קְּעִילָ֔ה וַ/יֶּחְדַּ֖ל לָ/צֵֽאת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/013.yaml
  text: Then David arose with his men[a], about six hundred men, and they went out from Keilah and went wherever they could go. And it was told to Saul that David had escaped from Keilah[b], so he stopped going out.
translation:
  language: zh_hans
  text: 于是，大卫和跟随他的人[a]，约有六百人，都动身离开基伊拉，辗转各处。有人报告扫罗说，大卫已经逃离基伊拉；扫罗就不再出兵了。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “跟随他的人”原文直译为“他的人”，在这里指跟随大卫的队伍。
    reason: lexical_alternative
  - marker: b
    text: “不再出兵”原文直译为“不再出去”，这里很可能是指扫罗得知大卫已逃离基伊拉后，不再出发追捕他。
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּקָם דָּוִד וַאֲנָשָׁיו
  choice: 于是，大卫和跟随他的人……都动身
  rationale: קום在叙事中表示起身采取行动；结合复数谓语，将大卫及其随从自然地表达为共同主语。“动身”既保留行动转折，也不重复后面的“离开”。
- source_word: כְּשֵׁשׁ מֵאוֹת אִישׁ
  choice: 约有六百人
  rationale: 介词כְּ用于数词前表示约数；这里指大卫的随从队伍，现代汉语用“约有六百人”自然准确。
- source_word: וַיֵּצְאוּ מִקְּעִלָה
  choice: 离开基伊拉
  rationale: יצא מן字面为“从……出去”，在城邑语境中译为“离开”更符合现代汉语，同时保留空间意义。
- source_word: וַיִּתְהַלְּכוּ בַּאֲשֶׁר יִתְהַלָּכוּ
  choice: 辗转各处
  rationale: 重复的הלך Hitpael形式强调持续从一处移往另一处。“辗转各处”简洁传达流动不定的处境，不额外断定他们毫无目的。
- source_word: וּלְשָׁאוּל הֻגַּד
  choice: 有人报告扫罗说
  rationale: 希伯来文是无人称被动“有话被告知扫罗”。汉语以不定施事“有人报告”表达自然，并不具体指认消息来源。
- source_word: כִּי נִמְלַט דָּוִד מִקְּעִילָה
  choice: 大卫已经逃离基伊拉
  rationale: נמלט表示逃脱、脱身；“逃离”符合扫罗追捕大卫的上下文。“已经”体现相对于报告时刻动作已完成。
- source_word: וַיֶּחְדַּל לָצֵאת
  choice: 扫罗就不再出兵了
  rationale: חדל加不定式意为停止某行动；לצאת字面是“出去”。上下文所指很可能是扫罗不再出发追捕，因此正文用自然的军事表达“出兵”，并以脚注说明字面与语境。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“辗转各处”保留原文持续移动的意味；专名按常见和合本传统音译为“基伊拉”。所有脚注标记均置于正文相应位置。
