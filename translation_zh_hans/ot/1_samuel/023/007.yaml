base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/007.yaml
  text: And it was reported to Saul that David had come to Keilah[a]. So Saul said, “God has delivered him into my hand[b], for he has shut himself in by entering a city with doors and bars.”
translation:
  language: zh_hans
  text: 有人向扫罗报告说，大卫已经到了基伊拉。扫罗就说：“上帝把他交在我手里了[a]，因为他进了一座有双扇城门和门闩的城，把自己困在里面了[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “交在我手里”意为交到我的权势或控制之下。这是扫罗对大卫处境的解释，并不表示叙述者认同他的判断。
    reason: theological_clarity
  - marker: b
    text: 原文直译为“一座有双扇门和门闩的城”，指城门由成对的门扇构成，并以横闩固定，是一座设防的城。
    reason: cultural_note
lexical_decisions:
- source_word: וַיֻּגַּד
  choice: 有人向……报告说
  rationale: 原文是使役被动形式，表示消息被告知扫罗；中文采用不定施事者“有人”可自然表达这一被动意义。
- source_word: בָא דָוִד קְעִילָה
  choice: 大卫已经到了基伊拉
  rationale: בוא可指来到或进入；此处以基伊拉为目的地，“到了”自然，并用“已经”体现报告时动作已发生。
- source_word: נִכַּר אֹתוֹ אֱלֹהִים בְּיָדִי
  choice: 上帝把他交在我手里了
  rationale: 此处נכר具有交出、交付之意；保留“在我手里”的希伯来惯用形象，表示落入扫罗权下。
- source_word: נִסְגַּר
  choice: 把自己困在里面了
  rationale: Nifal形式可作被动或反身理解；结合扫罗认为大卫进入设防城后无路可逃的语境，反身表达最自然，同时保留这是扫罗判断的意味。
- source_word: בְּעִיר דְּלָתַיִם וּבְרִיחַ
  choice: 一座有双扇城门和门闩的城
  rationale: דלתים为双数，指成对的门扇；בריח指横向固定城门的门闩。此译保留具体的城防图景。
theological_decisions:
- issue: 扫罗把大卫受困归因于上帝的行动
  choice: 在扫罗的直接引语中照实译为“上帝把他交在我手里了”
  alternative: 译为“扫罗以为上帝把他交在自己手里了”，明确与其判断拉开距离
  rationale: 原文直接记载扫罗的话，并未在句内加入叙述者评断。译文不替叙述者判断扫罗的说法是否正确，以保留经文中的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“基伊拉”沿用常见中文圣经地名译法；“上帝”对应אֱלֹהִים。主文保留城门和门闩的具体形象，并以脚注解释古代设防城门。
