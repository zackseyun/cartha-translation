base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/022.yaml
  text: Please go and make further preparations[a], and know and see his place where his foot is, who has seen him there; for I am told[c][b], ‘He is very cunning.’
translation:
  language: zh_hans
  text: 请你们去，进一步做好准备，查明并察看他所在的地方——他的脚在哪里，以及谁在那里见过他；因为我听说[b]：‘他极其狡猾[c]。’
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 或译：“因为他对我说。”原文没有明说“说”的主语是谁。
    reason: alternative_reading
  - marker: c
    text: 原文以同根词重复加强语气，直译近于“他狡猾地行狡猾之事”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הָכִינוּ עוֹד
  choice: 再仔细确认
  rationale: הכין的使役形可指预备、使稳妥或确认；结合扫罗要求进一步侦察的语境，“再仔细确认”自然表达继续把情报核实清楚的意思，同时不把它仅限于一般性的“准备”。
- source_word: וּדְעוּ וּרְאוּ
  choice: 查明并察看
  rationale: 保留两个并列命令的累加强调：既要确切弄清，也要亲自察看，而不将二者合并为一个动词。
- source_word: מְקוֹמוֹ
  choice: 他所在的地方
  rationale: 保留第三人称单数后缀“他的”，并以现代汉语自然表达具体地点。
- source_word: אֲשֶׁר תִּהְיֶה רַגְלוֹ
  choice: 就是他的脚踪在哪里
  rationale: 原文直译近于“他的脚在哪里”，指他的所在或行动踪迹；译文保留“脚”的意象，同时用“脚踪”使现代读者易于理解。
- source_word: מִי רָאָהוּ שָׁם
  choice: 谁在那里见过他
  rationale: 忠实保留对目击者或线人的追查；完成式按自然汉语译为“见过”。
- source_word: כִּי אָמַר אֵלַי
  choice: 因为我听说
  rationale: 原文动词为第三人称阳性单数，却未明说主语。“我听说”以自然汉语保留消息来源不明这一点，脚注列出较直译的可能。
- source_word: עָרוֹם יַעְרִם הוּא
  choice: 他实在非常狡猾
  rationale: 原文以同根词叠用加强语气；“实在非常”传达强调，“狡猾”符合扫罗对大卫带有敌意的评价。
