  text: וְ֠/עַתָּה לְ/כָל אַוַּ֨ת נַפְשְׁ/ךָ֥ הַ/מֶּ֛לֶךְ לָ/רֶ֖דֶת רֵ֑ד וְ/לָ֥/נוּ הַסְגִּיר֖/וֹ בְּ/יַ֥ד הַ/מֶּֽלֶךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/020.yaml
  text: Now then[a], O king, come down according to all the desire of your soul to come down[b], and it is for us to hand him over into the king’s hand.
translation:
  language: zh_hans
  text: 王啊，现在就照你心里一切所愿下来吧，下来吧[a]；至于我们，我们必把他交在王手中[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文连续两次使用“下来”这个动词（不定式绝对形加命令式），用来加强和催促语气。
    reason: lexical_alternative
  - marker: b
    text: “交在王手中”意为把他交给王，使他落在王的权势之下。
    reason: idiom
lexical_decisions:
- source_word: וְעַתָּה
  choice: 现在
  rationale: 作为话语转换语，引出眼前的请求；“现在”自然体现其即时性，前文的连接作用由语境承载。
- source_word: לְכָל אַוַּת נַפְשְׁךָ
  choice: 照你心里所愿的
  rationale: 这是表达内在强烈愿望的希伯来语说法。现代汉语用“心里所愿”既保留内在愿望的意象，也比直译“你灵魂的一切欲望”自然庄重。
- source_word: הַמֶּלֶךְ
  choice: 王啊
  rationale: 带定冠词的名词在此作呼语；“王啊”明确呈现对君王的直接称呼。
- source_word: לָרֶדֶת רֵד
  choice: 下来吧，只管下来
  rationale: 原文以不定式绝对形配合命令式重复同一动词，具有加强、催促的作用。译文保留重复，并以“只管”自然传达强调。
- source_word: וְלָנוּ
  choice: 至于我们，我们必
  rationale: 前置的“给我们/属我们”表示责任归属，即接下来的事由说话者承担；汉语用主题结构清楚表达这种分工。
- source_word: הַסְגִּירוֹ
  choice: 把他交在
  rationale: 使役形在此指把某人交付到另一人的权势之下；“交在……手中”准确且符合现代汉语。
- source_word: בְּיַד הַמֶּלֶךְ
  choice: 王手中
  rationale: 保留希伯来语“在某人手中”的权力意象，表示使大卫落入扫罗的控制。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而自然的叙事对话语体。“王啊”保留古代宫廷呼语；“只管下来”传达原文动词重复的强调；“至于我们，我们必……”体现双方行动分工，同时避免生硬直译。
