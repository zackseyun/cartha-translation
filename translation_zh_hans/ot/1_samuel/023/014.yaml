    issue: “山寨”额外限定地形，并可能产生现代语义联想。
    rationale: מְצָדוֹת意为防守据点、要塞或坚固处；本词本身并不说明其必为“山寨”。虽然上下文有山地，但将该地形特征附加在此词上会使译文较原文具体化。
  revised_text: 大卫住在旷野的坚固据点中，又住在西弗旷野的山区。扫罗不断寻找他，但上帝没有把他交在扫罗手中。
