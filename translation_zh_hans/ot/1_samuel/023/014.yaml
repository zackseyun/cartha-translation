  to: 大卫住在旷野的坚固据点中，又住在西弗旷野的山区。扫罗不断寻找他，但上帝没有把他交在扫罗手中。
  rationale: 仅将“山寨”修订为“坚固据点”，以准确、无附加地形限定地表达מְצָדוֹת的防御性含义；其余译文无需改动。原文及现有草稿均无须增设脚注锚点。
