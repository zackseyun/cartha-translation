base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/014.yaml
  text: David stayed in the wilderness strongholds[a], and he stayed in the hill country in the wilderness of Ziph. Saul sought him all the days, but God did not give him into his hand.
translation:
  language: zh_hans
  text: 大卫住在旷野的坚固据点中，又住在西弗旷野的山区。扫罗不断寻找他，但上帝没有把他交在扫罗手中。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: 住
  rationale: ישׁב在此表示居住、停留；“住”自然简洁，也符合叙事语境。
- source_word: בַּמִּדְבָּר
  choice: 在旷野
  rationale: מִדְבָּר通常指未开垦的荒野地带，并不专指沙漠；“旷野”准确且符合现代中文圣经语体。
- source_word: בַּמְּצָדוֹת
  choice: 山寨
  rationale: מְצָדוֹת指易守难攻的据点或堡垒；结合犹大山区和大卫逃亡的处境，“山寨”兼顾地形与防御意味。
- source_word: בָּהָר
  choice: 在山区
  rationale: הַר可指山或山地；此处描述西弗旷野一带的地形，用“山区”比理解为单独一座山更自然。
- source_word: בְּמִדְבַּר זִיף
  choice: 在西弗旷野
  rationale: 这是以西弗命名的特定旷野地区；“西弗旷野”简洁地保留地名关系。
- source_word: וַיְבַקְשֵׁהוּ
  choice: 寻找他
  rationale: בקשׁ在这里指搜寻、追索大卫；“寻找”自然，并由上下文体现追捕意味。
- source_word: כָּל הַיָּמִים
  choice: 不断
  rationale: 该短语直译为“所有的日子”，在此表达持续进行；“不断”以自然现代汉语传达持续追寻的意义。
- source_word: וְלֹא נְתָנוֹ
  choice: 没有把他交
  rationale: נתן与“在某人手中”连用，构成把人交由某人掌控的惯用表达；中文用“交在……手中”自然保留该意象。
- source_word: אֱלֹהִים
  choice: 上帝
  rationale: 此处虽为形态复数，却配合单数语义，明确指以色列的上帝；译作“上帝”。
- source_word: בְּיָדוֹ
  choice: 在扫罗手中
  rationale: 希伯来文直译为“在他手中”，意为落入其控制；中文明确为“扫罗”，避免连续男性代词造成指代不清，同时保留“手中”的原文意象。
theological_decisions:
- issue: 叙事中אֱלֹהִים所表达的护理行动
  choice: 上帝没有把大卫交在扫罗手中
  alternative: 上帝没有让扫罗抓住大卫
  rationale: 原文直接将大卫未落入扫罗控制归于上帝的行动。“交在……手中”既保留这一神学归因，也不扩展其具体方式。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“山寨”表示山区中可防守的据点；“扫罗不断寻找他”自然表达כָּל הַיָּמִים的持续性；末句明确代词所指，以免中文产生歧义。
