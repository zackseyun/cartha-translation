base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/011.yaml
  text: Will the men of Keilah hand me over into his hand? Will Saul come down[a], as your servant has heard? O Yahweh, God of Israel, please tell your servant.” And Yahweh said, “He will come down.”
translation:
  language: zh_hans
  text: 基伊拉的居民会把我交到他手里[a]吗？扫罗会正如你仆人所听说的那样下来吗？雅威，以色列的上帝啊，求你告诉你的仆人！”雅威说：“他会下来。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他手里”是希伯来语的惯用说法，指落入扫罗的权下。
    reason: 说明原文“手”所表达的权势隐喻，并明确“他”指扫罗。
lexical_decisions:
- source_word: יַסְגִּרֻנִי
  choice: 把我交在
  rationale: 此处使役词形表示把某人交给另一方，使其落入对方权下。“把我交在他手里”既自然，也保留敌意移交的含义。
- source_word: בַעֲלֵי קְעִילָה
  choice: 基伊拉的居民
  rationale: בעלים 字面可指“主人、拥有者”，但在城邑语境中指当地有身份的居民或城中人；“居民”不把范围过度限定为官长，也符合现代汉语。
- source_word: בְיָדוֹ
  choice: 在他手里
  rationale: 保留希伯来语以“手”表达权势、控制的惯用说法；这里的“他”指扫罗。
- source_word: יֵרֵד
  choice: 下来
  rationale: ירד 表示下去、下来；从大卫身在基伊拉的视角，用“下来”自然，并在问句与回答中保持一致。
- source_word: כַּאֲשֶׁר שָׁמַע עַבְדֶּךָ
  choice: 照你仆人所听见的
  rationale: 保留比较词 כַּאֲשֶׁר 与完成式“听见”的关系，表明大卫询问所听到的消息是否会实现。
- source_word: עַבְדֶּךָ
  choice: 你的仆人
  rationale: 在向上帝祷告时，这是谦卑的自称；“仆人”比“奴隶”更符合这里的语域。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来语四字神名作音译，保留其专名性质，而不以称号替代。
- source_word: הַגֶּד נָא
  choice: 求你告诉
  rationale: 命令式配合语气词 נָא，表达恳切而有礼的请求；“求你告诉”符合现代汉语祷告语体。
- source_word: וַיֹּאמֶר יְהוָה
  choice: 雅威说
  rationale: 简洁呈现希伯来叙事句式，引出上帝的回答；汉语无需机械添加“于是”或“并且”。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”按较通行的学术重构音译，保留这是以色列上帝专名的性质。
- issue: 预告“他会下来”的确定语气
  choice: 他会下来
  alternative: 他将下来
  rationale: 原文回答仅重复 יֵרֵד，没有说明事件最终是否因后续行动而实现；译文保留直接预告，不额外解释神的预知与条件性之间的关系。
translation_notes:
  register: 采用现代、庄重而易懂的祷告与叙事语言。“雅威—以色列的上帝啊”以破折号呈现同位呼语，避免误读；两个问句的次序及末句简短回答均依照马所拉文本保留。
