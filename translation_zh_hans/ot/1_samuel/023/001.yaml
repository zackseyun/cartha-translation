base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/001.yaml
  text: Then they told David[a], saying, “Look, the Philistines are fighting against Keilah, and they are plundering the threshing floors.”
translation:
  language: zh_hans
  text: 有人向大卫报告说：“看，非利士人正在攻打基伊拉[a]，他们正在抢掠禾场。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“正在基伊拉作战”。希伯来语介词的字面意思是“在”，但在这里的军事语境中，很可能是指非利士人正在攻打这座城。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגִּדוּ לְדָוִד לֵאמֹר
  choice: 有人来告诉大卫说
  rationale: וַיַּגִּדוּ是希斐使役词干的叙事性连续式，字面主语为未指明的复数“他们”；现代汉语用“有人”自然表达未指明的报告者，并以“来”体现叙事推进。保留“说”以对应לֵאמֹר并引出直接引语。
- source_word: הִנֵּה
  choice: 看
  rationale: 该指示语气词用于提醒大卫注意紧急消息；“看”简洁、现代，并保留原文的即时感。
- source_word: פְלִשְׁתִּים נִלְחָמִים בִּקְעִילָה
  choice: 非利士人正在攻打基伊拉[a]
  rationale: נִלְחָמִים为表示持续行动的分词；בְּ字面可表示“在”，但在此军事语境及后文拯救城邑的情节中，很可能表达以基伊拉为攻击目标。“攻打”符合自然汉语，同时用脚注保留地点义的可能性。
- source_word: וְהֵמָּה שֹׁסִים
  choice: 抢掠
  rationale: שֹׁסִים表示掠夺、劫掠；“抢掠”适合战争中夺取农产的语境。独立代词הֵמָּה带有主语强调，但汉语若直译为“而他们”较生硬，故凭连续动作自然承接。
- source_word: אֶת הַגֳּרָנוֹת
  choice: 禾场
  rationale: גֳּרָנוֹת指打谷、扬谷的场地。中文圣经语域中的“禾场”简洁庄重，也保留原文所指的具体场所，而不把含义缩窄为其中的粮食。
