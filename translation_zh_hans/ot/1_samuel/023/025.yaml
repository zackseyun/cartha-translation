base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/025.yaml
  text: So Saul and his men went to seek him. And they told David[a], so he went down to the rock and stayed in the wilderness of Maon. When Saul heard, he pursued David in the wilderness of Maon.
translation:
  language: zh_hans
  text: 于是，扫罗和他的随从前去寻找大卫。有人把这事告诉大卫，他就下到那岩石处[a]，住在玛云旷野。扫罗听说后，便在玛云旷野追赶大卫。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “岩石”也可译作“岩峰”或“峭壁”；原文可能指当地一处显著的岩石地形或险要岩地。
    reason: lexical_alternative
lexical_decisions:
- source_word: לְבַקֵּשׁ
  choice: 去搜寻大卫
  rationale: 该不定式表达目的；希伯来文省略的宾语由上下文明确为大卫。译出宾语可使现代汉语自然清楚。“搜寻”也保留有意寻找并追捕的语境。
- source_word: וַיַּגִּדוּ לְדָוִד
  choice: 有人把这事告诉了大卫
  rationale: 原文为主动复数，但主语未指明。汉语以“有人”自然保留行动者身份不明这一点；“这事”按语境补出所报告的内容。
- source_word: וַיֵּרֶד
  choice: 他就下到
  rationale: 保留动词所表达的向下移动；主语按紧接的“大卫”确定。
- source_word: הַסֶּלַע
  choice: 那磐石
  rationale: סֶלַע可指岩石、峭壁或岩石构成的险要地形。正文采用庄重而形象的“磐石”，并以脚注提示其他可能含义，不把具体地貌解释得过死。
- source_word: וַיֵּשֶׁב
  choice: 住在
  rationale: 此处表示在某地停留或居住。“住在”符合现代叙事汉语；并不必然暗示永久定居。
- source_word: בְּמִדְבַּר מָעוֹן / מִדְבַּר מָעוֹן
  choice: 在玛云旷野／到玛云旷野
  rationale: מִדְבָּר通常指人烟稀少的荒野地带，未必是沙漠，因此译作“旷野”。地名מָעוֹן音译为“玛云”。第二处依汉语移动表达补出“到”。
- source_word: וַיִּרְדֹּף אַחֲרֵי
  choice: 追赶
  rationale: 该动词与介词组合表示追逐某人。“追赶”简洁自然，并准确呈现扫罗追捕大卫的行动。
- source_word: וַיֵּלֶךְ שָׁאוּל וַאֲנָשָׁיו
  choice: 于是，扫罗和跟随他的人去
  rationale: 句首叙事形式承接上一节的事态发展，译为“于是”。אֲנָשָׁיו字面是“他的人”，在此指随从扫罗行动的人，译作“跟随他的人”比“他的人”更自然，也不限定其具体身份。
theological_decisions: []
