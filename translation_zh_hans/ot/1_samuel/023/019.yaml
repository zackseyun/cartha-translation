  yaml_path: translation/ot/1_samuel/023/019.yaml
  text: Then the Ziphites went up to Saul at Gibeah[a], saying, “Is not David hiding among us in the strongholds in the wooded area, on the hill of Hachilah[b], which is to the right of the Jeshimon?”
translation:
  language: zh_hans
  text: 西弗人上到基比亚去见扫罗，说：“大卫不是正藏在我们这里，藏在林地[a]的山寨中，在哈基拉山上，就是在耶希门的右边[b]吗？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“何列沙”，把这个词理解为地名，而不是“林地”。
    reason: alternative_reading
  - marker: b
    text: 直译“耶希门的右边”；按希伯来语的地理方位习惯，这很可能是指“耶希门南边”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: 上到……去见
  rationale: 保留עלה表示“上去”的方向含义，并以现代汉语自然地表达他们前往扫罗所在之处。
- source_word: זִפִים
  choice: 西弗人
  rationale: 这是表示西弗居民的复数族称，译作“西弗人”简明自然。
- source_word: הַגִּבְעָתָה
  choice: 到基比亚
  rationale: 词尾的方向词素表示朝向基比亚；与“去见扫罗”结合，清楚表达扫罗所在的目的地。
- source_word: הֲלוֹא
  choice: 不是……吗
  rationale: 保留原文期待肯定回答的反问语气。
- source_word: מִסְתַּתֵּר
  choice: 正藏
  rationale: 该反身词干的分词表示大卫正在隐藏自己；“正藏”简洁呈现持续状态。
- source_word: עִמָּנוּ
  choice: 在我们这里
  rationale: 字面为“与我们同在”，语境指在西弗人的地域内；“在我们这里”比“和我们在一起”更不易误解为结伴。
- source_word: בַמְּצָדוֹת
  choice: 在……山寨中
  rationale: מְצָדוֹת指可据守的坚固地点；“山寨”符合大卫在山野藏身的地形语境，又不暗示大型城堡。
- source_word: בַּחֹרְשָׁה
  choice: 林地
  rationale: 该形式可作普通名词“林地”，也可能是地名“何列沙”；正文采用普通名词，并在脚注保留另一可能。
- source_word: בְּגִבְעַת הַחֲכִילָה
  choice: 在哈基拉山上
  rationale: גִּבְעָה意为山冈或小山；此译自然地表达地形和专名。
- source_word: אֲשֶׁר מִימִין הַיְשִׁימוֹן
  choice: 就是耶希门右边
  rationale: 正文保留מִימִין的字面空间意象“右边”，不将古代方位习惯直接解释进正文；脚注说明其很可能指“南边”。
