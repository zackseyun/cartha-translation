base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/008.yaml
  text: So Saul summoned all the people to war[a], to go down to Keilah, to besiege David and his men.
translation:
  language: zh_hans
  text: 于是，扫罗召集众民出战[a]，要下到基伊拉，围困大卫和他手下的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“动员众民作战。”希伯来语动词可表示“使人听见”，在这里很可能是指发出号令，召集民众采取军事行动。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְשַׁמַּע
  choice: 召集
  rationale: שׁמע 的使役形可表示“使人听见”，在这里的军事语境中指发出号令、把人召集起来；“召集”自然表达了这一使役和动员含义。
- source_word: כָּל הָעָם
  choice: 众民
  rationale: 原文直译为“所有的民众”。语境表明他们被动员参战，但原文并未明确称他们为军队；“众民”既保留原文措辞，也符合叙事语体。
- source_word: לַמִּלְחָמָה
  choice: 出战
  rationale: 该短语表示召集的军事目的。“出战”在现代汉语中简洁自然，比直译“到战争中”更清楚。
- source_word: לָרֶדֶת
  choice: 下到
  rationale: 保留 ירד“下去、下到”的方向含义，也符合圣经地理叙事的常见表达。
- source_word: קְעִילָה
  choice: 基伊拉
  rationale: 采用该地名的通行中文音译。
- source_word: לָצוּר
  choice: 围困
  rationale: צור 在此军事语境中指包围并困住目标。因直接宾语是大卫及其随从，而非城名，“围困”比“围城”更贴切自然。
- source_word: אֶל־דָּוִד וְאֶל־אֲנָשָׁיו
  choice: 大卫和他手下的人
  rationale: אֲנָשָׁיו 字面是“他的人”。“他手下的人”保留其宽泛性，又自然表达这群跟随大卫、参与作战的人，避免擅自限定为正式士兵。
theological_decisions: []
