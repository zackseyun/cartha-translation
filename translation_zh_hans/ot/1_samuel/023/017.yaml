source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אֵלָ֜י/ו אַל תִּירָ֗א כִּ֠י לֹ֤א תִֽמְצָאֲ/ךָ֙ יַ֚ד שָׁא֣וּל אָבִ֔/י וְ/אַתָּה֙ תִּמְלֹ֣ךְ עַל יִשְׂרָאֵ֔ל וְ/אָנֹכִ֖י אֶֽהְיֶה לְּ/ךָ֣ לְ/מִשְׁנֶ֑ה וְ/גַם שָׁא֥וּל אָבִ֖/י יֹדֵ֥עַ כֵּֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/017.yaml
  text: He said to him[a], “Do not be afraid, for the hand of Saul my father will not find you. You will reign over Israel, and I will be second to you[b]. Even Saul my father knows this.”
translation:
  language: zh_hans
  text: 他对他说：“不要害怕，因为我父亲扫罗的手抓不到你[a]。你必作王，治理以色列；我必在你之下，位居第二[b]。连我父亲扫罗也知道这事。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“我父亲扫罗的手必找不到你。”“手”在这里可指权势或掌控，因此也可译作“我父亲扫罗的权势必达不到你”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“我必作你的副手。”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּירָא
  choice: 不要害怕
  rationale: 这是现代汉语中自然、直接的禁止式表达，准确传达希伯来语否定命令的语气。
- source_word: לֹא תִמְצָאֲךָ יַד שָׁאוּל אָבִי
  choice: 我父亲扫罗的手抓不到你
  rationale: 保留“手”这一表示权势或掌控的具体意象，同时用“抓不到”自然传达“手找不到你”的意思，避免直接窄化为“杀不了”或“害不了”。
- source_word: וְאַתָּה תִּמְלֹךְ עַל יִשְׂרָאֵל
  choice: 你必作王，治理以色列
  rationale: 既明确表达 מלך 的君王含义，也保留其动词性质；“治理”自然对应其对以色列施行王权的意思。
- source_word: וְאָנֹכִי אֶהְיֶה לְּךָ לְמִשְׁנֶה
  choice: 我必在你之下，位居第二
  rationale: מִשְׁנֶה 表示次于首位的地位。此译清楚保留双方的等级关系，又不引入过于现代的正式官衔。
- source_word: וְגַם שָׁאוּל אָבִי יֹדֵעַ כֵּן
  choice: 连我父亲扫罗也知道这事
  rationale: “连……也……”自然体现 וְגַם 在此处的强调作用；“这事”回指大卫将作王、约拿单将居其次的整项陈述。
theological_decisions:
- issue: 约拿单对大卫作王及自己居次位之话的性质
  choice: 按经文本身译为明确的政治与未来预期，不增添“预言”“受膏者”或上帝任命等说明
  alternative: 将这句话明说为关于上帝所立君王的神学性预言
  rationale: 本句明确断言大卫将治理以色列，也说扫罗知道此事，但本节没有直接提及耶和华或说明这一认识的神学来源。因此译文保留其力度而不补入经文未明说的解释。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“作王，治理以色列”避免仅用可能泛指管理的“统治”；“在你之下，位居第二”表达从属次序，同时不套用现代行政或军事职称。代词“他对他说”忠实保留本节希伯来文本的指代形式，不在正文中补入上下文人物姓名。
