  yaml_path: translation/ot/1_samuel/023/009.yaml
  text: When David learned that Saul was secretly plotting harm against him[a], he said to Abiathar the priest[b], “Bring the ephod here.”
translation:
  language: zh_hans
  text: 大卫得知扫罗正暗中图谋加害他[a]，就对祭司亚比亚他说：“把以弗得[b]拿过来。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“正在暗中图谋恶事，要对付他。”
    reason: lexical_alternative
  - marker: b
    text: 以弗得是祭司所用的物件；在本段叙事中，它与向上帝求问指引有关。
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּדַע
  choice: 得知
  rationale: 叙事中的未完成式连续形式表示大卫在此时获悉此事；“得知”比静态的“知道”更符合上下文。
- source_word: כִּי
  choice: （引出“得知”的内容）
  rationale: 此处引出大卫所得知的内容，汉语无需另译连接词。
- source_word: עָלָיו
  choice: 他
  rationale: 结合敌对行动的语境，在“谋害他”中自然表达“针对他”的含义。
- source_word: מַחֲרִישׁ הָרָעָה
  choice: 正在暗中谋害
  rationale: 分词表达持续进行的图谋；חרש在此有暗中筹划之意，הָרָעָה指拟加于大卫的祸害。“暗中谋害”简洁传达隐秘策划与敌意，并以脚注保留“图谋恶事”的词汇可能。
- source_word: אֶל אֶבְיָתָר הַכֹּהֵן
  choice: 对祭司亚比亚他说
  rationale: 自然表达说话对象，并保留亚比亚他的祭司身份。
- source_word: הַגִּישָׁה
  choice: 拿过来
  rationale: 使役命令式意为使之靠近、呈上；在直接吩咐中译作“拿过来”自然明确。
- source_word: הָאֵפוֹד
  choice: 以弗得
  rationale: 采用现代中文圣经语境中通行的专名，保留该祭司物件的具体名称，不泛化为普通衣物。
theological_decisions:
- issue: מַחֲרִישׁ הָרָעָה所表达的扫罗意图
  choice: 扫罗正在暗中谋害大卫
  alternative: 扫罗正在暗中图谋恶事，要对付大卫
  rationale: 原文兼有隐秘筹划和加害之意；正文用自然汉语呈现具体威胁，脚注保留较贴近字面的“图谋恶事”，不把“恶”限定为抽象的神学判断。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“正在”体现希伯来语分词的持续状态；“暗中谋害”符合现代汉语习惯。以弗得的文化背景放入脚注，避免正文解释过重。
