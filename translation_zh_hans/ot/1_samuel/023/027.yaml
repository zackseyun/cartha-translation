  text: But a messenger came to Saul, saying, “Hurry and come, for the Philistines have made a raid against the land.”
translation:
  language: zh_hans
  text: 但有使者来到扫罗那里，说：“赶快去吧！因为非利士人已经袭击这地了。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַלְאָךְ
  choice: 使者
  rationale: 此处指传递紧急军情的人；“使者”既贴近原词，也符合叙事语境。
- source_word: מַהֲרָה וְלֵכָה
  choice: 快走，赶紧去
  rationale: 保留两个连续命令所表达的急迫感；前者是催促迅速行动，后者命令扫罗离开当前地点前去应敌。
- source_word: פָשְׁטוּ
  choice: 已经突袭了
  rationale: 该动词在军事语境中表示出兵袭击或劫掠；“突袭”自然传达紧急来犯之意，完成体译作“已经”。
- source_word: עַל הָאָרֶץ
  choice: 这地
  rationale: 介词עַל带有“攻击、侵入”的方向性，已由“突袭”体现；定冠词所指为上下文中的以色列境地，译作“这地”自然且不额外限定范围。
