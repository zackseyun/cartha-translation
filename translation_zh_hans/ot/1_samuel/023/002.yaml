base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/002.yaml
  text: So David inquired of Yahweh[a], saying, “Shall I go and strike these Philistines?” And Yahweh said to David, “Go and strike the Philistines, and save Keilah.”
translation:
  language: zh_hans
  text: 于是，大卫求问耶和华说：“我可以去攻打这些非利士人吗？”耶和华对大卫说：“你去攻打非利士人，拯救基伊拉。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁאַל ... בַּיהוָה
  choice: 求问耶和华
  rationale: שׁאל 与介词 בּ 及神名连用，表示向耶和华寻求指引；“求问”比普通的“询问”更准确，也符合现代中文圣经语体。
- source_word: הַאֵלֵךְ וְהִכֵּיתִי
  choice: 我可以去攻打……吗
  rationale: 疑问词与未完成式表达行动前的请示和斟酌。“可以……吗”自然地呈现大卫求取许可与指引的语气；“攻打”在军事语境中比字面的“击打”自然，又不预先断定必然取胜。
- source_word: בַּפְּלִשְׁתִּים הָאֵלֶּה
  choice: 这些非利士人
  rationale: 保留指示词 הָאֵלֶּה，指当时侵袭基伊拉的特定非利士人。
- source_word: לֵךְ וְהִכִּיתָ
  choice: 你去攻打
  rationale: 保留命令语气，并与大卫问题中的同一动词相呼应；中文不必机械重复连接词。
- source_word: וְהוֹשַׁעְתָּ
  choice: 拯救
  rationale: ישׁע 的使役式在此指从军事危难中救出、解救；“拯救”简洁庄重，语境本身限定其含义。
- source_word: קְעִילָה
  choice: 基伊拉
  rationale: 按现代中文圣经中常见的地名音译处理。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的专名形式呈现四字神名，保留其作为专有名字的性质。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 原文直接使用神的专名。中文采用广为人知的“耶和华”，既显明其专名性质，也保持庄重和可读性；不以普通称号代替。
- issue: וְהוֹשַׁעְתָּ 在本节中的含义
  choice: 拯救基伊拉
  alternative: 解救基伊拉
  rationale: 保留 ישׁע 的“救援、使脱险”语义，而不把它限定为属灵救恩；上下文清楚表明这里是从非利士人的军事威胁中救出城邑。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“于是”承接前文事件；对话简洁直接。保留“这些”的指示作用及问答中“攻打”的对应关系，不额外解释求问方式或军事结果。
