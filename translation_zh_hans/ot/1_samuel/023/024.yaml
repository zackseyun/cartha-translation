revisions:
- from: 他们动身，赶在扫罗前面去了西弗。那时，大卫和跟随他的人在玛云旷野，在亚拉巴[a]、耶示门[b]以南[c]的地方。
  to: 他们动身，先于扫罗往西弗去了。那时，大卫和他的部下在亚拉巴的玛云旷野，就是耶示门以南的地方。
  rationale: 改用“他的部下”以避免将原文宽泛的“他的人”限定为“跟随者”，并重组末尾地点短语以消除修饰范围的含混。脚注锚点保留在“亚拉巴”“耶示门”“以南”之后，分别对应原文中保留的词义与方位歧义。
