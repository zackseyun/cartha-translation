base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/024.yaml
  text: They arose and went to Ziph ahead of Saul[a]. Now David and his men were in the wilderness of Maon, in the Arabah[b], to the south of the Jeshimon.
translation:
  language: zh_hans
  text: 他们动身，先于扫罗往西弗去了。那时，大卫和他的部下在亚拉巴的玛云旷野，就是耶示门以南的地方。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקֻמוּ וַיֵּלְכוּ
  choice: 他们动身……去了
  rationale: 两个连续叙事动词直译为“起来并去”在现代汉语中略显生硬；“动身……去了”自然表达起身出发并前往的连续动作。
- source_word: זִיפָה
  choice: 去了西弗
  rationale: 地名后的方向词尾表示朝西弗而去；汉语以“去西弗”自然表达。
- source_word: לִפְנֵי שָׁאוּל
  choice: 赶在扫罗前面
  rationale: לִפְנֵי在此表示先于、走在前面；“赶在……前面”清楚传达他们先行前往，同时不把它解释为单纯的空间位置。
- source_word: וְדָוִד וַאֲנָשָׁיו
  choice: 那时，大卫和跟随他的人
  rationale: 希伯来文无系词的名词句转而交代大卫一行所在的位置；“那时”自然标示场景转换。“跟随他的人”比直译“他的人”更符合现代汉语。
- source_word: בְּמִדְבַּר מָעוֹן
  choice: 在玛云旷野
  rationale: מִדְבָּר通常指荒野、野地，不一定是沙漠；“旷野”既准确又符合地理语境。
- source_word: בָּעֲרָבָה
  choice: 在亚拉巴
  rationale: עֲרָבָה既可指干旱平原或荒原，也可作特定地理区域名称；正文保留音译，以免过早消除歧义，并以脚注说明。
- source_word: אֶל יְמִין הַיְשִׁימוֹן
  choice: 耶示门以南
  rationale: יָמִין字面为“右边”，古代地理方位以面向东方为基准时可表示南方；正文采用此处最自然的方位表达，脚注保留字面意义。
- source_word: הַיְשִׁימוֹן
  choice: 耶示门
  rationale: 该词可意为“荒地、荒漠”，但在本段地理描述中很可能用作地名；正文音译，脚注保留普通名词的可能性。
theological_decisions: []
