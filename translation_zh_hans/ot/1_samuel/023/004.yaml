base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/004.yaml
  text: David again inquired of the LORD, and the LORD answered him and said, “Rise, go down to Keilah, for I am giving the Philistines into your hand.”
translation:
  language: zh_hans
  text: 大卫又求问耶和华，耶和华回答他说：“起来，下到基伊拉去，因为我要把非利士人交在你手中。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיּוֹסֶף עוֹד דָּוִד לִשְׁאֹל
  choice: 大卫又求问
  rationale: “又”自然表达动作再次发生；“求问”准确传达向上帝寻求指示的语境，无须把希伯来语叠加强调机械译出。
- source_word: בַּיהוָה / יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的专名形式，保留原文两次出现的神名。
- source_word: קוּם רֵד
  choice: 起来，下到……去
  rationale: 保留两个连续的命令；“下到”反映 רֵד 的方向含义，也符合前往基伊拉的地理叙述。
- source_word: נֹתֵן
  choice: 要把……交在
  rationale: 原文为分词，在此表达即将实行且确定的行动；中文用“要”比机械直译进行体更自然，同时不改成完成式。
- source_word: בְּיָדֶךָ
  choice: 在你手中
  rationale: 保留希伯来语“交在手中”的胜利与掌控意象，符合庄重而通顺的现代汉语。
theological_decisions:
- issue: 上帝应许交付非利士人的时态与确定性
  choice: 我要把非利士人交在你手中
  alternative: 我已经把非利士人交在你手中
  rationale: 希伯来文 נֹתֵן 是分词，并非完成式；译作“要把”既表达应许的确定性，也不把尚未发生的行动说成已经完成。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。保留原文神名的重复、连续命令和“交在你手中”的希伯来意象；本节无须脚注。
