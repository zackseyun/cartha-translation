base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/016.yaml
  text: Then Jonathan son of Saul arose and went to David at Horesh[a], and strengthened his hand in God.
translation:
  language: zh_hans
  text: 扫罗的儿子约拿单动身，往何列斯去见大卫，使大卫在上帝里面得坚固。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在上帝里面鼓励大卫。”原文直译为“在上帝里面坚固他的手”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: 动身
  rationale: קום在连续叙事中常引出有目的的行动；“动身”比直译“起来”更符合现代汉语叙事，同时保留行动开始之意。
- source_word: יְהוֹנָתָן בֶּן שָׁאוּל
  choice: 扫罗的儿子约拿单
  rationale: 直接表达希伯来语的亲子关系，并保留约拿单与扫罗之间在本段具有意义的身份联系。
- source_word: וַיֵּלֶךְ אֶל דָּוִד
  choice: 往……去见大卫
  rationale: הלך אל表示前往某人那里；结合地点成分，用“往何列沙去见大卫”自然表达约拿单前往并与大卫会面的意思。
- source_word: חֹרְשָׁה
  choice: 何列沙
  rationale: 将其按带方向词尾的地名理解，即“往何列沙”；不译作普通名词“树林”，以符合叙事地理语境。
- source_word: וַיְחַזֵּק אֶת־יָדוֹ
  choice: 使他的手……刚强起来
  rationale: 保留“使手刚强”这一希伯来语意象，而不在正文中直接释为“鼓励他”或“坚定他的心志”。
- source_word: בֵּאלֹהִים
  choice: 在上帝里面
  rationale: בְּ保留为“在……里面”，表达上帝是大卫得刚强的领域、根基或所倚靠者，同时避免武断限定为“借着上帝”或“靠上帝”。
theological_decisions:
- issue: אֱלֹהִים在本节中的神名译法
  choice: 上帝
  alternative: 耶和华
  rationale: 原文是אֱלֹהִים而非四字神名יהוה，因此译作“上帝”，不以“耶和华”替换。
- issue: בֵּאלֹהִים所表达的关系
  choice: 在上帝里面
  alternative: 靠着上帝／借着上帝
  rationale: 原文介词בְּ可涉及领域、根基或凭借；正文采用较贴近形式且保留张力的“在上帝里面”，不把关系单一解释为工具或手段。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“动身”避免生硬的“起来”；“使他的手……刚强起来”有意保留原文习语及神学张力，并以脚注说明自然汉语中的可能含义。人名、地名按现代中文圣经惯用音译处理。
