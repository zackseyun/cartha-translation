  naturalness: “扫罗的儿子约拿单动身”自然。“往何列沙去见大卫”中的地名宜改为“何列斯”；末句宜明确“大卫”，并将“使手刚强”的希伯来习语在正文按自然汉语表达，字面意象留在脚注说明。
  terminology: “上帝”恰当地对应本节的אֱלֹהִים。约拿单、扫罗、大卫均无须更改。“何列斯”是此处חֹרְשָׁה（Horesh）的中文圣经通行地名；词尾的方向含义可由“往”表达，无须将其纳入音译。
