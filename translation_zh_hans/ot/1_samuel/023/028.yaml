base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/028.yaml
  text: So Saul returned from pursuing David and went to meet the Philistines. Therefore that place was called the Rock of Division[a].
translation:
  language: zh_hans
  text: 于是，扫罗不再追赶大卫，转去迎见非利士人。因此，人们把那地方叫作“分隔磐石”[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“分离磐石”或“离别磐石”。这地名可能指扫罗在这里停止追赶大卫，二人因而分开。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: 转身不再
  rationale: שׁוב 在此表示扫罗改变行动方向、中止原先的追赶；结合后面的介词结构，译为“转身不再”自然地表达停止追赶。
- source_word: מִרְדֹף אַחֲרֵי
  choice: 追赶
  rationale: רָדַף 在军事叙事中指追逐、追捕；מִן 与不定式连用表示离开或停止该行动。
- source_word: לִקְרַאת פְּלִשְׁתִּים
  choice: 前去迎战非利士人
  rationale: לִקְרַאת 本义是前去迎接或相遇；本段语境是非利士人来犯，因此“迎战”自然传达敌对相遇，但不进一步说明战斗结果。
- source_word: עַל כֵּן
  choice: 因此
  rationale: 这是说明地名由来的惯用因果表达，译为“因此”简洁而庄重。
- source_word: קָרְאוּ לַמָּקוֹם הַהוּא
  choice: 那地方叫作
  rationale: 希伯来语使用未指明主语的复数动词；汉语用无主句可自然表达，不必补出具体命名者。
- source_word: סֶלַע
  choice: 磐石
  rationale: סֶלַע 指岩石或岩石地貌；作为地名成分，“磐石”庄重、清楚。
- source_word: הַמַּחְלְקוֹת
  choice: 分隔
  rationale: 该复数名词源于表示分开、划分的词根 ח־ל־ק；“分隔”既适合作地名，也呼应扫罗与大卫在此分开，但其确切含义仍有不确定性，故在脚注保留其他译法。
