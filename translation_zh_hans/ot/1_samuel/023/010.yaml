base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/010.yaml
  text: Then David said[a], “O Yahweh, God of Israel, your servant has surely heard that Saul is seeking to come to Keilah to destroy the city because of me.”
translation:
  language: zh_hans
  text: 大卫说：“雅威[a]，以色列的上帝啊，你的仆人确实听说，扫罗正设法来到基伊拉，要因我的缘故毁灭这城。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文：YHWH（四字神名）；传统常译作“耶和华”。
    reason: 说明神名的原文形式及传统中文译法。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 大卫说
  rationale: 未机械译出连接词וַ־；在当前叙事衔接中，现代汉语可凭语序自然推进，避免添加原文没有明确表达的时间副词。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经传统中广为人知的神名译法，并以脚注说明其对应希伯来文四字神名。
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: 以色列的上帝
  rationale: 准确表达构造关系，现代汉语自然清楚。
- source_word: שָׁמֹעַ שָׁמַע
  choice: 确实听说
  rationale: 以“确实”传达不定式绝对形与限定动词连用所形成的强调；“听说”符合此处获知扫罗意图的语境。
- source_word: עַבְדְּךָ
  choice: 你的仆人
  rationale: 保留大卫在向上帝祈求时谦恭的自称，而不改写为第一人称“我”。
- source_word: מְבַקֵּשׁ
  choice: 正企图
  rationale: 表达分词所带的持续、当前意向，并保留בקש所含寻求实施之意，不把它弱化成单纯的“打算”。
- source_word: לָבוֹא אֶל קְעִילָה
  choice: 来到基伊拉
  rationale: “来到”贴近בוא，并以大卫身处基伊拉的叙事视角自然表达。
- source_word: לְשַׁחֵת לָעִיר
  choice: 毁灭这城
  rationale: שׁחת在军事语境中表示毁坏、毁灭；定冠词所指即前述基伊拉，汉语用“这城”衔接自然。
- source_word: בַּעֲבוּרִי
  choice: 因我的缘故
  rationale: 保留该介词短语表示原因或缘由的含义，同时维持祷告语体的庄重感。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: “耶和华”是现代中文读者最熟悉且可辨识为专名的传统形式；脚注交代它对应希伯来文YHWH，避免将其仅处理为称号。
- issue: “你的仆人”的人称表达
  choice: 保留第三人称自称“你的仆人”
  alternative: 译作第一人称“我”
  rationale: 保留希伯来祷告中谦恭自称的形式及其神学关系意味，不为流畅而抹平原文表达。
translation_notes:
  register: 采用自然、庄重的现代标准汉语，保留祷告中的呼告和谦恭自称。“确实听说”体现原文强调结构；句式避免过度文言化。
