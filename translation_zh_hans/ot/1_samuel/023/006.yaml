  text: וַ/יְהִ֗י בִּ֠/בְרֹחַ אֶבְיָתָ֧ר בֶּן אֲחִימֶ֛לֶךְ אֶל דָּוִ֖ד קְעִילָ֑ה אֵפ֖וֹד יָרַ֥ד בְּ/יָדֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/006.yaml
  text: When Abiathar son of Ahimelech fled to David at Keilah[a], he came down with an ephod in his hand.
translation:
  language: zh_hans
  text: 亚希米勒的儿子亚比亚他逃到在基伊拉的大卫那里时，手里带着以弗得下来。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或按较直译的词序：“以弗得在他手中下来。”希伯来语的句法可作这种理解。
    reason: 保留 יָרַד 的主语及 אֵפוֹד 与动词关系上的句法歧义。
lexical_decisions:
- source_word: וַיְהִי
  choice: ……时
  rationale: 该叙事结构与后面的时间从句合并处理；不另加原文没有的“现在”，使现代汉语自然流畅。
- source_word: בִּבְרֹחַ
  choice: 逃……时
  rationale: 介词 בְּ 加不定式构词表示时间背景，用“……时”准确自然；ברח 表示逃离、逃亡。
- source_word: אֶבְיָתָר בֶּן אֲחִימֶלֶךְ
  choice: 亚希米勒的儿子亚比亚他
  rationale: 按现代中文圣经人名惯用译法处理，并保留原文的父子关系。
- source_word: אֶל דָּוִד קְעִילָה
  choice: 到基伊拉的大卫那里
  rationale: אֶל 表示趋向；“基伊拉”在此最自然地理解为大卫所在之处。此译法既保留“到大卫那里”的关系，也避免误读为两个并列目的地。
- source_word: אֵפוֹד
  choice: 以弗得
  rationale: 采用该特定祭司礼仪物件的传统音译，不在本节擅自限定为某一种衣物或器具。
- source_word: יָרַד
  choice: 下来
  rationale: 保留 ירד 的下行方向含义；中文无需补出叙述视角上的“来/去”区别。
- source_word: בְּיָדוֹ
  choice: 手里带着
  rationale: 原义为“在他手中”；“手里带着”保留具体意象，同时自然表达随身携带。
theological_decisions:
- issue: אֵפוֹד 在本节所指物件的性质
  choice: 保留音译“以弗得”，不进一步解释
  alternative: 祭司礼服；圣衣；用于求问的器具
  rationale: 上下文显示它具有祭司和求问方面的重要性，但本节只使用专名 אֵפוֹד；不应在译文中加入原文未明确限定的功能或形制。
- issue: יָרַד 的语法主语
  choice: 正文按亚比亚他为主语，译作“手里带着以弗得下来”
  alternative: 按希伯来语表面词序译作“以弗得在他手中下来”
  rationale: 正文所选读法符合叙事语境，也使现代汉语清楚自然；但希伯来语词序容许把“以弗得”看作紧邻动词的主语，因此以脚注保留这一真实歧义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。人名、地名及礼仪术语沿用简体中文圣经常见译名；不使用古雅的“事情是这样”等套语。
