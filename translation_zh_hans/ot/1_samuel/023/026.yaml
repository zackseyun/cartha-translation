  to: 扫罗在山的一边行进[a]，大卫和他的人在山的另一边。大卫急忙离开扫罗；扫罗和他的人正围拢[b]大卫和他的人，要捉住[c]他们。
  rationale: 修订避免将“离开”明确解释为“躲避”，并以“正围拢”表达希伯来文分词所描写的持续围困行动，而不加入“渐渐”或“包抄”的额外战术细节。补足并分列脚注锚点，说明空间对照这一必要的语用转换，以及围拢、捕获的可行译法。
