base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/026.yaml
  text: Saul was going on one side of the mountain[a], and David and his men were on the other side of the mountain. David was hurrying to go away from Saul[c][b], while Saul and his men were closing in on David and his men to capture them.
translation:
  language: zh_hans
  text: 扫罗在山的一边行进[a]，大卫和他的人在山的另一边。大卫急忙离开扫罗；扫罗和他的人正围拢[b]大卫和他的人，要捉住[c]他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文此处两次都近乎直译为“从山的这一边”；译文用“一边……另一边”表达双方隔山相对的空间对照。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“正在包围”。
    reason: alternative_reading
  - marker: c
    text: 也可译作“擒获”或“抓住”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: 沿着……走
  rationale: 叙事形式推进情节；结合山侧的空间短语，译为持续行进的自然汉语，不将动作过度点化为单次的“走了”。
- source_word: מִצַּד הָהָר מִזֶּה … מִצַּד הָהָר מִזֶּה
  choice: 山的一边……山的另一边
  rationale: 希伯来文两次直译均近于“从山的这一边”，语境显然形成双方隔山相对的空间对照；现代汉语用“一边……另一边”清楚表达其意，并以脚注保留原文措辞。
- source_word: נֶחְפָּז
  choice: 急忙
  rationale: 该词表示处于急迫、匆忙的状态；“急忙”自然传达紧迫感，又不额外引入惊慌等情绪。
- source_word: לָלֶכֶת מִפְּנֵי שָׁאוּל
  choice: 躲避扫罗
  rationale: 原文直义近于“从扫罗面前离去”；在追捕语境中，“躲避”自然表达离开其面前、避免被其追上的意思，但不强化为更具戏剧性的“逃命”。
- source_word: עֹטְרִים
  choice: 渐渐包抄过来
  rationale: 此处分词描写扫罗一方正在围拢大卫；“包抄过来”兼顾军事语境与动作的进行性。
- source_word: לְתָפְשָׂם
  choice: 要捉住……
  rationale: 不定式表示目的，后缀指大卫及其众人；“捉住”符合追捕语境，也保留“抓住、擒获”的基本词义。
