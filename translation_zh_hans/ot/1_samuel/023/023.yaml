  rationale: 修订删除原文未表达的“还”，避免将“地”过度限定为行政意义的“境内”；并将首句和“带着确定性返回”的表达调整为更自然、且更贴近希伯来文句法和语义的现代汉语。保留“宗族”及其字面脚注，以维持该术语的必要歧义。
