base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/023.yaml
  text: See and find out from all the hiding places where he hides there, then return to me with certainty, and I will go with you. And if he is in the land, I will search him out among all the clans of Judah.
translation:
  language: zh_hans
  text: 你们要察看，查明他藏身所在的一切隐匿处；然后带着确实的消息回来见我，我就和你们同去。若他在这地，我必在犹大的各宗族[a]中搜寻他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“犹大的所有千人单位”；这里很可能指犹大境内的宗族或家族编制。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּרְאוּ וּדְעוּ
  choice: 要察看，查明
  rationale: 两个复数命令式分别表达实地察看和确切获知；“查明”符合侦察语境，也保留两项连续命令。
- source_word: מִכֹּל הַמַּחֲבֹאִים אֲשֶׁר יִתְחַבֵּא שָׁם
  choice: 他在那里藏身的一切隐匿处
  rationale: “隐匿处”对应藏身地点；保留 שָׁם“在那里”的空间成分，并以自然汉语表达反身动词所指的藏身行为。
- source_word: וְשַׁבְתֶּם אֵלַי אֶל נָכוֹן
  choice: 查实以后，就回来见我
  rationale: נָכוֹן 在此表示情况已经确定、可靠；译为“查实以后”自然呈现他们应带着确切情报返回的意思，同时不额外加入原文没有明说的“报告”。
- source_word: וְהָלַכְתִּי אִתְּכֶם
  choice: 我会和你们同去
  rationale: 直接表达随后与他们一同前往的意思。
- source_word: וְהָיָה אִם יֶשְׁנוֹ בָאָרֶץ
  choice: 倘若他还在这境内
  rationale: “倘若”保留条件性；在上下文中 הָאָרֶץ 指当前搜捕所涉及的地域，以“这境内”比笼统的“地上”更自然。
- source_word: וְחִפַּשְׂתִּי אֹתוֹ
  choice: 我必……搜寻他
  rationale: חפשׂ 表示仔细搜查、寻找；“搜寻”保持力度而不过度解释为必定捕获。
- source_word: בְּכֹל אַלְפֵי יְהוּדָה
  choice: 在犹大的各宗族中
  rationale: אַלְפֵי 字面为“千”，在此可指犹大内部按家族或社会编制划分的单位；正文用“宗族”便于现代读者理解，字面形式收入脚注。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而清楚的叙事用语。“察看，查明”保留原文连续命令的节奏；“查实以后”使 אֶל נָכוֹן 在汉语中自然可懂。脚注标记已置于正文相应词语之后。
