base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/018.yaml
  text: And the two of them made a covenant before Yahweh[a]. Then David remained in the wooded area[b], and Jonathan went to his house.
translation:
  language: zh_hans
  text: 他们二人在耶和华[a]面前立了约。大卫仍住在林地[b]，约拿单回家去了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语直译为“切约”。
    reason: lexical_alternative
  - marker: b
    text: 或译“何烈”（地名）；这里的希伯来语既可理解为地名，也可理解为“林地”或“树林”。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּכְרְתוּ
  choice: 立了
  rationale: 希伯来语“切约”是固定习语；现代汉语通常说“立约”，既自然，也保留其庄严含义。
- source_word: שְׁנֵיהֶם
  choice: 他们二人
  rationale: 明确表达原文的双方，即大卫和约拿单。
- source_word: בְּרִית
  choice: 约
  rationale: “约”能体现双方关系中郑重而有约束力的承诺；“协议”语气偏弱，“条约”则过于政治化。
- source_word: לִפְנֵי יְהוָה
  choice: 在耶和华面前
  rationale: 贴近原文，并自然表达立约是在上帝临在和鉴察之下进行的。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用简体中文圣经读者广泛熟悉的神圣名译法，并与原文专名相对应。
- source_word: וַיֵּשֶׁב
  choice: 仍住
  rationale: 这里指继续留住在某处，不是字面的“坐”；“仍住”简洁表达其持续状态。
- source_word: בַּחֹרְשָׁה
  choice: 在林地
  rationale: חֹרֶשׁ可指树林、林地或灌木丛；此处形式也可能被理解为地名“何列沙”，故在脚注保留歧义。
- source_word: הָלַךְ לְבֵיתוֹ
  choice: 回家去了
  rationale: 原义为“往自己的家去”；“回家去了”是自然的现代汉语，同时准确传达行动方向。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。正文采用现代中文圣经传统中辨识度最高的“耶和华”，不以称号“主”替代专名。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“立了约”符合中文习惯；用“仍住”与“却回家去了”清楚呈现两人的去向分开，其中“却”只表达叙事中的对照，不增添敌对意味。
