revisions:
- from: 大卫看出扫罗已经出动，要取他的性命；那时，大卫正在西弗旷野的何列沙[a]。
  to: 大卫看见扫罗出来寻索他的性命；大卫当时在西弗旷野的何列沙[a]。
  rationale: 将“出动，要取他的性命”改为“出来寻索他的性命”，更贴近希伯来语的词汇和表达力度，也与英文审计文本的“had come out to seek his life”相对应。以“当时”呈现末尾并列的背景性地点说明；脚注以规范的中文标点及希伯来语前后空格清楚保留词义选择。
