  yaml_path: translation/ot/1_samuel/023/015.yaml
  text: David saw that Saul had come out to seek his life[a], while David was in the wilderness of Ziph at Horesh.
translation:
  language: zh_hans
  text: 大卫看见扫罗出来寻索他的性命；大卫当时在西弗旷野的何列沙[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“林地”或“树林里”。希伯来语 חֹרְשָׁה 可理解为普通名词，但这里很可能是地名“何列沙”。
    reason: 保留该词究竟是地名还是地貌普通名词的词义歧义。
lexical_decisions:
- source_word: וַיַּרְא
  choice: 看出
  rationale: ראה的基本义是“看见”，也可指察觉、得知；这里接由כִּי引出的内容从句，“看出”既保留感知含义，也符合现代汉语叙事。
- source_word: כִּי
  choice: （引出“看出”的内容，不另译）
  rationale: 此处כִּי引出大卫所察知的内容；汉语可直接把后句作为“看出”的宾语，无须机械译成“那”。
- source_word: יָצָא
  choice: 已经出动
  rationale: יצא本义为“出去”，此处指扫罗为追捕大卫而采取行动；“出动”自然表达这一语境，并以“已经”体现相对于大卫察知时的先行行动。
- source_word: לְבַקֵּשׁ אֶת נַפְשׁוֹ
  choice: 要取他的性命
  rationale: 该短语直指寻索某人的性命，语境中含杀害意图；“取他的性命”保留“性命”这一核心意象，又比直译“寻找他的性命”更符合现代汉语。
- source_word: בְּמִדְבַּר זִיף
  choice: 在西弗旷野
  rationale: מִדְבָּר指旷野、荒野或草原地带；“旷野”是此类圣经地理环境中准确而通行的译法。
- source_word: בַּחֹרְשָׁה
  choice: 在……何列沙
  rationale: חֹרְשָׁה可作“林地”解，但在本段语境中很可能用作地名；正文音译为“何列沙”，并用脚注保留普通名词的可能解释。
- source_word: וְדָוִד
  choice: 那时，大卫正在
  rationale: 这里的וְ引出说明大卫所在地点的背景性分句；“那时……正在”自然呈现其伴随情境，而不把它误读为新的顺序动作。
theological_decisions: []
