base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/004.yaml
  text: 'So Saul summoned the people and mustered them at Telaim: two hundred thousand foot soldiers[a], and ten thousand men of Judah.'
translation:
  language: zh_hans
  text: 于是，扫罗召集百姓，在提拉因[a]点阅他们：步兵二十万，犹大人一万。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “提拉因”也可能按字面译作“用羊羔”；希伯来语בַּטְּלָאִים可理解为地名，也可理解为普通名词“羊羔”。
    reason: 保留该希伯来语形式究竟是地名还是普通名词的文本歧义。
lexical_decisions:
- source_word: וַיְשַׁמַּע
  choice: 召集
  rationale: 此处使役式在军事语境中表示召集众人，而不只是“使……听见”。
- source_word: הָעָם
  choice: 百姓
  rationale: 原文直译为“百姓”；上下文虽指应召出战的人，但不宜直接改成“军队”。
- source_word: וַיִּפְקְדֵם
  choice: 点阅他们
  rationale: פקד在军事语境中指清点、检阅所召集的人员；“点阅”兼顾计数与军事检阅的含义。
- source_word: בַּטְּלָאִים
  choice: 在提拉因
  rationale: 按上下文和传统理解，将此词视为地名 Telaim；同时在脚注保留按普通名词“羊羔”理解的可能。
- source_word: מָאתַיִם אֶלֶף
  choice: 二十万
  rationale: 按希伯来文数词结构直译。
- source_word: רַגְלִי
  choice: 步兵
  rationale: 该词本义与“步行”有关，在军事统计中指徒步作战的兵士。
- source_word: וַעֲשֶׂרֶת אֲלָפִים
  choice: 另有……一万
  rationale: 清楚表达犹大人的一万是在前述二十万之外，同时保留并列关系。
- source_word: אֶת אִישׁ יְהוּדָה
  choice: 犹大人
  rationale: אִישׁ在这里具有集合意义，指属于犹大支派的人。
theological_decisions: []
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“召集”“点阅”符合军事场景；“百姓”保留原文用词，避免过度解释为“军队”。脚注标记置于与提拉因相关的分句之后，以免误以为注释针对“步兵”。
