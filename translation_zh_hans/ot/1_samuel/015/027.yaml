  yaml_path: translation/ot/1_samuel/015/027.yaml
  text: As Samuel turned to go[a], he seized the edge of his robe, and it tore.
translation:
  language: zh_hans
  text: 撒母耳转身要走，扫罗便抓住撒母耳外袍的衣角[a]，衣角就撕裂了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“衣边”或“下摆”。希伯来语这个词可指衣物的边缘部分。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסֹּב
  choice: 转身
  rationale: סבב在此表示撒母耳转过身准备离开；“转身”简洁自然，也与后面的目的表达相连。
- source_word: לָלֶכֶת
  choice: 要走
  rationale: הלך的不定式在“转身”之后表达离开的意图；“要走”符合现代汉语叙事习惯，同时保留原文简洁的行动意味。
- source_word: וַיַּחֲזֵק
  choice: 抓住
  rationale: חזק的使役词干在此指牢牢抓取；“抓住”既自然，又能传达动作的突然和用力。
- source_word: בִּכְנַף
  choice: 衣角
  rationale: כָּנָף本义为“翅膀”，用于衣物时指边缘或角部。“衣角”在现代汉语中自然清楚；“衣边”或“下摆”也有可能，故加注说明。
- source_word: מְעִילוֹ
  choice: 他外袍的
  rationale: מְעִיל指穿在外面的袍服。“外袍”清楚且庄重；所属代词依原文保留为“他”，在上下文中指撒母耳。
- source_word: וַיִּקָּרַע
  choice: 衣角就撕裂了
  rationale: Nifal形式表示被撕裂或自行裂开。“撕裂了”保留事件结果，不额外说明究竟是谁直接撕破；重复“衣角”可避免汉语代词指向不清。
theological_decisions:
- issue: וַיַּחֲזֵק的隐含主语
  choice: 在正文中明确为“扫罗”
  alternative: 只译作“他”
  rationale: 希伯来文承接上文，以省略主语的动词指向扫罗；若现代汉语只用“他”，紧接“撒母耳”之后容易误解为撒母耳抓住自己的外袍。补出上下文已经明确的“扫罗”是为消除语法歧义，并未增添新的神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“便”连接连续动作；“外袍”避免古奥的服饰称谓。脚注标记紧跟其所解释的“衣角”，而不是放在“要走”之后。
