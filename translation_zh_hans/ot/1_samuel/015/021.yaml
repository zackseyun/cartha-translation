base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/021.yaml
  text: But the people took from the spoil sheep and cattle[a], the best of what had been devoted to destruction[c][b], to sacrifice to Yahweh your God at Gilgal.
translation:
  language: zh_hans
  text: 可是，百姓从战利品[a]中取了羊和牛，就是被划定为要毁灭之物中最好的[b]，要在吉甲献祭给耶和华[c]你的上帝。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “战利品”也可译作“掳物”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译为“被划定为要毁灭之物中首先的部分”，在这里指其中上好、精选的牲畜。这些牲畜已被划定为必须毁灭、不可留下之物。
    reason: lexical_alternative
  - marker: c
    text: “耶和华”译自希伯来文的上帝之名יהוה（YHWH）。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקַּח
  choice: 可是……取了
  rationale: לקח在此指“取、拿”；句首连接形式结合上下文表达与扫罗先前说法之间的转折，因此译作“可是”。
- source_word: הָעָם
  choice: 百姓
  rationale: 保留עם的常用含义和扫罗把责任推给众人的修辞效果；在本段语境中具体指随军的人。
- source_word: מֵהַשָּׁלָל
  choice: 从战利品中
  rationale: שׁלל指战争中掳得的财物；“战利品”是现代汉语中准确自然的表达。
- source_word: צֹאן וּבָקָר
  choice: 羊和牛
  rationale: 具体呈现小型与大型牲畜，避免用较宽泛的“群畜”。
- source_word: רֵאשִׁית
  choice: 最好的
  rationale: 该词本义可指“首先、初熟、首要部分”，在挑选牲畜的语境中指其中上好、精选的部分；脚注保留“首先的部分”这一字面可能。
- source_word: הַחֵרֶם
  choice: 被指定毁灭之物
  rationale: חֵרֶם在此指归给上帝、因而必须毁灭而不可作为普通战利品保留的对象；此译法避免仅以术语“禁物”表达而导致普通读者难懂。
- source_word: לִזְבֹּחַ
  choice: 要……献祭
  rationale: 不定式表达目的，“要……献祭”在汉语中自然地呈现这一关系。
- source_word: לַיהוָה
  choice: 献祭给耶和华
  rationale: 介词标明献祭的对象；“耶和华”是现代中文圣经传统中对四字神名יהוה的通行译名。
- source_word: אֱלֹהֶיךָ
  choice: 你的上帝
  rationale: 保留第二人称单数后缀；扫罗对撒母耳说“你的上帝”而非“我们的上帝”，其中可能存在的疏离意味不在正文中加以解释或消除。
- source_word: בַּגִּלְגָּל
  choice: 在吉甲
  rationale: 地点介词与专名按自然现代汉语译为“在吉甲”。
theological_decisions:
- issue: 圣战语境中חֵרֶם的译法
  choice: 被指定毁灭之物
  alternative: 当灭之物；禁物；完全奉献之物
  rationale: 该词同时带有归给上帝和不可保留、必须毁灭的含义。正文明确毁灭这一语境含义，脚注说明其宗教法律色彩，不把它弱化为普通战利品，也不借译文进一步解释其伦理或神学问题。
- issue: יהוה的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 采用简体中文读者最熟悉的传统专名，同时以脚注说明这是希伯来文四字神名，避免读者误以为它是普通称号。
- issue: “你的上帝”所含关系意味
  choice: 直译为“你的上帝”
  alternative: 我们的上帝；上帝
  rationale: 原文明确使用第二人称单数。译文保留扫罗的措辞及其可能造成的神学和叙事张力，不把潜在的疏离意味明说为确定结论。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“可是”承接上下文中的反驳语气；“被指定毁灭之物”虽略长，却比单用“禁物”更便于普通读者理解。句子保留“你的上帝”，不消除原文可能带有的关系张力。
