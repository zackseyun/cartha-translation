  text: כֹּ֤ה אָמַר֙ יְהוָ֣ה צְבָא֔וֹת פָּקַ֕דְתִּי אֵ֛ת אֲשֶׁר עָשָׂ֥ה עֲמָלֵ֖ק לְ/יִשְׂרָאֵ֑ל אֲשֶׁר שָׂ֥ם ל/וֹ֙ בַּ/דֶּ֔רֶךְ בַּ/עֲלֹת֖/וֹ מִ/מִּצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/002.yaml
  text: 'Thus says Yahweh of hosts: ‘I have taken note of what Amalek did to Israel[c][b][a], how he opposed him on the way when he came up from Egypt.’'
translation:
  language: zh_hans
  text: 万军之雅威如此说：“我已留意[a]亚玛力对以色列所做的事：以色列从埃及上来的时候，亚玛力怎样在路上敌挡他[b][c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我已追究亚玛力对以色列所做的事”，或“我已记念亚玛力对以色列所做的事”。这里的希伯来语动词可以表示留意、记念、察看，也可以指带着审判而追究。
    reason: lexical_alternative
  - marker: b
    text: 或译：“怎样在路上与他为敌”；也可能是“怎样在路上埋伏袭击他”。这句希伯来语表达指亚玛力在以色列出埃及的途中采取敌对行动。
    reason: lexical_alternative
  - marker: c
    text: “他”指作为一个整体的以色列；原文使用阳性单数代词。
    reason: cultural_note
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: 如此说
  rationale: 保留先知与使者宣告中常见的固定格式，同时符合现代汉语圣经语体。
- source_word: יְהוָה
  choice: 雅威
  rationale: 采用神圣四字名的音译，保留其作为以色列上帝之专名的性质，而不以称号代替。
- source_word: צְבָאוֹת
  choice: 万军之
  rationale: “万军”是简洁而通行的译法，可涵盖属于雅威统辖的众军，不把所指范围限定为人间军队。
- source_word: פָּקַדְתִּי
  choice: 我已留意
  rationale: 该动词可表示关注、记念、察看并采取行动，也可在语境中含追究之意。“我已留意”保留上帝记着此事并将要处置的意味，却不把审判含义提前完全明说。
- source_word: אֵת אֲשֶׁר עָשָׂה עֲמָלֵק לְיִשְׂרָאֵל
  choice: 亚玛力怎样对待以色列
  rationale: 自然表达原文宽泛的“对……所做的”，由下文说明其行为带有敌意。
- source_word: אֲשֶׁר שָׂם לוֹ בַּדֶּרֶךְ
  choice: 亚玛力怎样在路上敌挡他
  rationale: 这一简缩表达在上下文中指亚玛力在出埃及途中敌对以色列；“敌挡”表达敌意，又不把具体行动过度限定为埋伏。
- source_word: לוֹ
  choice: 他
  rationale: 原文为阳性单数代词，回指作为集合单数的“以色列”；正文保留这一语法特征，并以脚注说明。
- source_word: בַּעֲלֹתוֹ מִמִּצְרַיִם
  choice: 以色列从埃及上来的时候
  rationale: “从埃及上来”保留原文常用表达；明说“以色列”可使现代汉语指代清楚，同时不改变所指。
theological_decisions:
- issue: 神名与称号 יְהוָה צְבָאוֹת 的译法
  choice: 万军之雅威
  alternative: 万军之耶和华；统领万军的主
  rationale: 正文保留神名的专名性质，也保留“万军”这一称号的广度，不将它局限为地上的军事力量。
- issue: פָּקַדְתִּי 中记念与审判的张力
  choice: 我已留意
  alternative: 我要追究；我已记得；我已察看
  rationale: 本节回顾亚玛力过去的恶行，并为下一节的审判命令奠定基础。“我已留意”既表示上帝没有忘记，也容许语境带出即将追究的含义，而不在此动词中消除其词义张力。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“如此说”保留宣告公式；“敌挡”略带圣经语体色彩，但普通读者容易理解。正文保留原文关于“留意、记念、追究”的语义张力，并用脚注交代主要译法。
