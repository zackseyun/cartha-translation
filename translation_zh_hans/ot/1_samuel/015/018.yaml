base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/018.yaml
  text: And Yahweh sent you on a mission and said[a], ‘Go and devote the sinners, the Amalekites, to destruction[b], and fight against them until they are consumed.’
translation:
  language: zh_hans
  text: 耶和华差遣你执行任务，说：“你去，将那些罪人，就是亚玛力人，归于毁灭[a]；要与他们争战，直到把他们灭尽。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“尽都毁灭。”希伯来文这个动词指把人或物置于禁令之下，交付毁灭。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלָחֲךָ יְהוָה בְּדָרֶךְ
  choice: 耶和华差遣你执行任务
  rationale: שלח直译为“差遣”；בדרך在“差遣”之后指受命前往的行程或使命，译作“执行任务”比字面的“在路上”更符合现代汉语语境。
- source_word: לֵךְ
  choice: 你去
  rationale: 直接保留祈使语气，现代汉语自然明确。
- source_word: וְהַחֲרַמְתָּה
  choice: 尽都毁灭
  rationale: חרם的使役式在此指置于禁令之下、献作毁灭；正文用自然而有力度的“尽都毁灭”，脚注说明其专门含义。
- source_word: הַחַטָּאִים אֶת עֲמָלֵק
  choice: 那些罪人，就是亚玛力人
  rationale: 保留希伯来文同位结构及其道德定性；“亚玛力”在此集体指亚玛力人。
- source_word: וְנִלְחַמְתָּ בוֹ
  choice: 要与他们争战
  rationale: בוֹ虽为单数形式，却回指作为集体的“亚玛力”；汉语按群体意义用“他们”自然。
- source_word: עַד כַּלּוֹתָם אֹתָם
  choice: 直到把他们灭尽
  rationale: 该短语表达使他们彻底终结；“灭尽”保留总括性，同时避免把语义弱化为一般的“结束”。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 中文圣经传统中“耶和华”是普通读者最熟悉、且明确作为专名使用的形式；它不以“主”替代原文神名。
- issue: חרם 的神学与礼仪含义
  choice: 正文译“尽都毁灭”，脚注说明“归于毁灭”
  alternative: 献作毁灭／置于禁令之下
  rationale: 兼顾现代汉语可懂度与原词的专门含义，不把该行动淡化为普通战争，也不额外引入宗派解释。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“争战”保留叙事的经文语体而仍易于理解；用“那些罪人，就是亚玛力人”明确呈现原文同位关系。
