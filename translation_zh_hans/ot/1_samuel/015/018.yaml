  to: 耶和华差遣你执行任务，说：“你去，将那些罪人，就是亚玛力人，归于毁灭[a]；要与他们争战，直到把他们灭尽。”
  rationale: 修订仅调整对חרם的译法及其脚注说明，以保留其“归于毁灭／置于禁令之下”的技术性含义，并消除“献作毁灭”可能造成的祭祀性误解。其余译文忠实而自然，予以保留。
