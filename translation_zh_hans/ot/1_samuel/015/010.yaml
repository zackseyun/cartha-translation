  text: וַֽ/יְהִי֙ דְּבַר יְהוָ֔ה אֶל שְׁמוּאֵ֖ל לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/010.yaml
  text: Then the word of Yahweh came to Samuel[a], saying,
translation:
  language: zh_hans
  text: 于是，雅威的话临到撒母耳，说：[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文为“YHWH”（יהוה），是神的名；传统上常译作“耶和华”。
    reason: 说明原文神名及传统中文译法。
lexical_decisions:
- source_word: וַיְהִי
  choice: 临到
  rationale: 这里与“耶和华的话”共同构成希伯来叙事中引入新启示的表达；汉语用“临到”既自然，也保留先知性启示公式的庄重语体。
- source_word: דְּבַר
  choice: 话
  rationale: 在“耶和华的话”这一固定启示公式中译作“话”，比“信息”更贴近原文，也保留其神学与文学联系。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 原文是神名四字母词 YHWH；“耶和华”是现代中文圣经传统中最通行、最易识别的神名形式。
- source_word: אֶל
  choice: 临到
  rationale: 介词 אֶל 标明神的话所到达的对象；汉语“临到撒母耳”整体自然地表达了这一关系。
- source_word: שְׁמוּאֵל
  choice: 撒母耳
  rationale: 采用现代中文圣经中通行的人名译法。
- source_word: לֵאמֹר
  choice: 说
  rationale: 该不定式用于引出随后神谕的内容；译作“说”简洁、庄重，并保留原文的引语衔接功能。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用神名 YHWH。正文采用中文读者最熟悉的专名“耶和华”，并以脚注说明其希伯来文形式及另一常见音译，既不以“主”这一称号替代神名，也让读者了解原文证据。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“耶和华的话临到……”保留希伯来先知性启示公式；标点以冒号引出下一节的直接话语。
