  terminology: “雅威”一致呈现 יהוה 为专名，合宜。“昨夜”“说吧”自然。脚注宜更明确说明这是辅音正文（ketiv）与传统读法（qere）所反映的差异，避免仅凭上下文改写原文形式而未交代文本依据。
