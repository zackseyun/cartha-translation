base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/016.yaml
  text: Then Samuel said to Saul[a], “Stop, and I will tell you what Yahweh said to me last night.” And he said to him, “Speak.”
translation:
  language: zh_hans
  text: 撒母耳对扫罗说：“且慢！我要把雅威昨夜对我所说的话告诉你。”扫罗对他说[a]：“说吧。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文辅音正文作“他们对他说”；传统读法作“他对他说”。按上下文，答话者是扫罗，故译作单数“扫罗对他说”。
    reason: textual_variant
lexical_decisions:
- source_word: הֶרֶף
  choice: 住口
  rationale: 这是动词 רפה 的命令式，在此要求扫罗停止说话；“住口”简洁有力，符合撒母耳斥止他的语气。
- source_word: וְאַגִּידָה לְּךָ
  choice: 我要……告诉你
  rationale: נגד 的使役式常指“告知、宣告”；接在命令之后，这一表达自然传达撒母耳接下来要告诉扫罗的意思。
- source_word: אֵת אֲשֶׁר דִּבֶּר
  choice: 所说的话
  rationale: 该结构引出雅威说话的内容；“所说的话”既贴近原文，也符合现代汉语表达。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，保留其作为以色列之上帝专名的性质，而不以称号替代。
- source_word: הַלָּיְלָה
  choice: 昨夜
  rationale: 结合前面的完成式和叙事时点，这里指刚刚过去的夜晚；“昨夜”自然且庄重。
- source_word: וַיֹּאמְרוּ לוֹ
  choice: 扫罗对他说
  rationale: 辅音正文写作复数“他们对他说”，但上下文只有扫罗是答话者，所表达的意义为单数；译文明确补出扫罗，以避免汉语代词指向含混，并用脚注保留文本现象。
- source_word: דַּבֵּר
  choice: 说吧
  rationale: 简短的命令式，表示让撒母耳继续说；“说吧”在现代汉语中直接自然，并保留原文的简洁。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: “雅威”较直接地按通常重建的读音音译四字神名，保留专名性质，不以“主”等称号代替；这不对经文本身以外的教义争议作额外判断。
translation_notes:
  register: 采用现代、简洁而庄重的叙事语言。“住口”保留撒母耳严厉斥止的语气；“昨夜”和“说吧”通顺自然。
