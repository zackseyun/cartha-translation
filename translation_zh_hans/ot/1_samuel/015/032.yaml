  text: וַ/יֹּ֣אמֶר שְׁמוּאֵ֗ל הַגִּ֤ישׁוּ אֵלַ/י֙ אֶת אֲגַג֙ מֶ֣לֶךְ עֲמָלֵ֔ק וַ/יֵּ֣לֶךְ אֵלָ֔י/ו אֲגַ֖ג מַעֲדַנֹּ֑ת וַ/יֹּ֣אמֶר אֲגָ֔ג אָכֵ֖ן סָ֥ר מַר הַ/מָּֽוֶת־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/032.yaml
  text: Then Samuel said[a], “Bring Agag king of Amalek to me.” And Agag came to him trembling, and Agag said, “Surely the bitterness of death has turned aside.”
translation:
  language: zh_hans
  text: 撒母耳说：“把亚玛力王亚甲带到我这里来。”亚甲战战兢兢地[a]来到他面前，说：“死亡的苦楚果然已经过去了。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “战战兢兢地”：原文这个词的含义不能确定。也有人译作“从容地”、“兴高采烈地”或“戴着锁链”。
    reason: 说明罕见希伯来词מַעֲדַנֹּת的主要释义分歧，保留原文的不确定性。
lexical_decisions:
- source_word: הַגִּישׁוּ
  choice: 带到我这里来
  rationale: 这是נגשׁ的使役命令式复数，吩咐在场的人把亚甲带到撒母耳面前；此译自然地保留了命令语气和趋向。
- source_word: אֲגַג מֶלֶךְ עֲמָלֵק
  choice: 亚玛力王亚甲
  rationale: 按现代汉语常用的“族名／国名＋王＋人名”次序表达其身份；亚甲、亚玛力均采用通行音译。
- source_word: וַיֵּלֶךְ אֵלָיו
  choice: 来到他面前
  rationale: 动词字面为“走去”，但上文以撒母耳为指向中心说“到我这里来”，故译作“来到他面前”更符合汉语叙事习惯，也明确亚甲被带到撒母耳面前。
- source_word: מַעֲדַנֹּת
  choice: 战战兢兢地
  rationale: 这个罕见词的含义有争议。正文采用“战战兢兢地”，与古代译本所反映的理解相符，并贴合亚甲面对死亡威胁的处境；脚注保留其他主要解释，避免把不确定含义绝对化。
- source_word: אָכֵן
  choice: 果然
  rationale: 表示亚甲对自己判断的确认；“果然”能自然传达他以为死亡威胁已经消退的语气。
- source_word: סָר
  choice: 已经过去了
  rationale: סור的完成式表示离开、消退；用于“死亡的苦楚”时，“已经过去了”比直译“转离”更符合现代汉语。
- source_word: מַר הַמָּוֶת
  choice: 死亡的苦楚
  rationale: 保留原文“死亡之苦”的意象，同时用现代汉语清楚表达死亡带来的痛苦或可怕威胁。
theological_decisions: []
