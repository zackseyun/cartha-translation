base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/001.yaml
  text: Then Samuel said to Saul[a], “Yahweh sent me to anoint you as king over his people, over Israel. So now, listen to the words of Yahweh.”
translation:
  language: zh_hans
  text: 撒母耳对扫罗说：“雅威差我来膏立你作王，治理他的子民以色列。现在，你要听从雅威所说的话[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译近于“听雅威话语的声音”；这里的“听”含有留心并服从的意思。
    reason: 保留希伯来语措辞及其兼具聆听与顺从的语义。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 叙事体未机械译出连接词；现代汉语可借语序自然推进情节。
- source_word: שְׁמוּאֵל אֶל שָׁאוּל
  choice: 撒母耳对扫罗
  rationale: 采用现代汉语标准圣经人名译法及自然的引语结构。
- source_word: אֹתִי שָׁלַח יְהוָה
  choice: 雅威差我来
  rationale: 保留受差遣之意；将前置的宾语代词按自然汉语语序表达，不额外强化其焦点。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以音译呈现四字神名，区别于“主”这一称号。
- source_word: לִמְשָׁחֳךָ לְמֶלֶךְ
  choice: 膏立你作王
  rationale: “膏立”既保留 משׁח 的具体礼仪背景，也自然传达任命君王的职分含义。
- source_word: עַל עַמּוֹ עַל יִשְׂרָאֵל
  choice: 治理他的子民以色列
  rationale: עַל 在君王语境中表示统治对象；两个短语为同位关系，“以色列”说明“他的子民”所指。
- source_word: וְעַתָּה
  choice: 现在
  rationale: 自然标明由回顾受膏转向当前命令；上下文已足以体现承接和推论。
- source_word: שְׁמַע לְקוֹל דִּבְרֵי יְהוָה
  choice: 你要听从雅威所说的话
  rationale: שׁמע 在命令语境中不仅指听见，也要求顺从；用“听从”自然传达此语用力量，同时以脚注保留希伯来语较具体的表达。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；“雅威”作为现代汉语音译，保留专名性质，不以称号取代。
- issue: שְׁמַע 的听见与顺从双重含义
  choice: 听从
  alternative: 听；听雅威话语的声音
  rationale: 此处是先知向君王发出的命令，语境要求留意并服从；“听从”符合现代汉语，但脚注注明原文措辞，以免抹去其“听”的意象。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“膏立”“作王”保留经文语域，但避免古奥句式；“治理他的子民以色列”清楚呈现君王职分及同位关系。
