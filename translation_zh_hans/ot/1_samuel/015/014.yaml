  text: וַ/יֹּ֣אמֶר שְׁמוּאֵ֔ל וּ/מֶ֛ה קֽוֹל הַ/צֹּ֥אן הַ/זֶּ֖ה בְּ/אָזְנָ֑/י וְ/ק֣וֹל הַ/בָּקָ֔ר אֲשֶׁ֥ר אָנֹכִ֖י שֹׁמֵֽעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/014.yaml
  text: But Samuel said[a], “Then what is this sound of sheep in my ears, and the sound of cattle that I hear?”
translation:
  language: zh_hans
  text: 但撒母耳说：“那么，我耳中这羊群的叫声，还有我所听见的牛群的叫声，是怎么回事呢？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 但撒母耳说
  rationale: 连词在叙事中承接上文，而在语境中撒母耳的话反驳扫罗自称已经遵命，因此用“但”自然体现转折。
- source_word: וּמֶה
  choice: 那么……是怎么回事呢
  rationale: 疑问词要求扫罗解释眼前证据；“那么……是怎么回事呢”既传达连接作用，也保留质问语气。
- source_word: קוֹל
  choice: 叫声
  rationale: קוֹל 可指“声音”或“嗓音”；这里具体指羊牛发出的可听声响，中文用“叫声”最自然，并在两处保持一致。
- source_word: הַצֹּאן
  choice: 羊群
  rationale: 该集合名词可包括绵羊和山羊；“羊群”保留集合含义，也避免无根据地限定为单一种类。
- source_word: הַזֶּה
  choice: 这
  rationale: 指向当下可以听见的声音，用“这”保留其近指意味。
- source_word: בְּאָזְנָי
  choice: 我耳中
  rationale: 较贴近希伯来语的身体意象，同时在现代汉语中自然可懂。
- source_word: וְקוֹל הַבָּקָר
  choice: 还有……牛群的叫声
  rationale: בָּקָר 是牛类牲畜的集合名词；“牛群”准确而自然，“还有”顺畅连接第二项证据。
- source_word: אֲשֶׁר אָנֹכִי שֹׁמֵעַ
  choice: 我所听见的
  rationale: 保留关系从句，并以“我”表达明确主语；上下文本身已使强调意味清楚，无需额外加入“亲自”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而口语可懂的质问句式。“叫声”比笼统的“声音”更符合动物语境；“羊群”“牛群”体现原文集合名词。未加脚注，因为相关词义在正文中可清楚自然地表达，且没有必须保留的实质歧义。
