  text: עַתָּה֩ לֵ֨ךְ וְ/הִכִּֽיתָ֜ה אֶת עֲמָלֵ֗ק וְ/הַֽחֲרַמְתֶּם֙ אֶת כָּל אֲשֶׁר ל֔/וֹ וְ/לֹ֥א תַחְמֹ֖ל עָלָ֑י/ו וְ/הֵמַתָּ֞ה מֵ/אִ֣ישׁ עַד אִשָּׁ֗ה מֵֽ/עֹלֵל֙ וְ/עַד יוֹנֵ֔ק מִ/שּׁ֣וֹר וְ/עַד שֶׂ֔ה מִ/גָּמָ֖ל וְ/עַד חֲמֽוֹר־־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/003.yaml
  text: Now go and strike Amalek[a], and devote to destruction all that belongs to him. Do not spare him, but put to death from man to woman, from child to nursing infant, from ox to sheep[b], from camel to donkey.
translation:
  language: zh_hans
  text: 现在你去击打亚玛力[a]，把他所有的一切全部毁灭[b]。不可怜惜他；无论男人女人、孩童和吃奶的婴儿、牛羊、骆驼驴，都要杀死。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “亚玛力”在这里是单数集合称谓，指亚玛力族群；本节的“他”也是如此。
    reason: lexical_alternative
  - marker: b
    text: 或译“彻底毁灭”或“置于禁毁之下”。希伯来文这个动词指在神圣审判下，把某物不可撤回地交付毁灭。
    reason: lexical_alternative
lexical_decisions:
- source_word: עַתָּה לֵךְ
  choice: 现在你去
  rationale: 保留时间／话语标记和直接命令的语气；现代汉语自然明白。
- source_word: וְהִכִּיתָה
  choice: 击打
  rationale: 对应 נכה 的基本意义，较“攻打”更贴近原文，也不使用古奥的措辞。
- source_word: עֲמָלֵק
  choice: 亚玛力
  rationale: 保留希伯来文的单数专名；上下文中它作为集合称谓，指亚玛力族群。
- source_word: וְהַחֲרַמְתֶּם
  choice: 尽行毁灭
  rationale: 表达 חרם 所含彻底、不可撤回的毁灭之意；其在神圣审判语境中的专门色彩由脚注说明，避免正文生硬地直译为“奉献给毁灭”。
- source_word: כָּל אֲשֶׁר לוֹ
  choice: 他所有的一切
  rationale: 保留原文把亚玛力视为一个整体的单数形式，同时表达范围的全面性。
- source_word: וְלֹא תַחְמֹל עָלָיו
  choice: 不可怜惜他
  rationale: חמל 在此兼有怜悯与饶过之意；“不可怜惜”简洁地保留两者之间的联系。
- source_word: וְהֵמַתָּה
  choice: 都要杀死
  rationale: 准确表达使之死亡的使役意义，语气严肃直接，不淡化原文。
- source_word: מֵאִישׁ עַד אִשָּׁה מֵעֹלֵל וְעַד יוֹנֵק
  choice: 无论男人女人、孩童和吃奶的婴儿
  rationale: 用现代汉语的总括结构传达反复“从……到……”所表示的无一例外，并保留男性、女性以及两类幼儿的明确称谓。
- source_word: מִשּׁוֹר וְעַד שֶׂה מִגָּמָל וְעַד חֲמוֹר
  choice: 牛羊、骆驼驴
  rationale: 以汉语自然的类别并列方式呈现牲畜清单；שֶׂה 可泛指绵羊或山羊，这里正文采用概括性的“羊”。
theological_decisions:
- issue: חרם 战争用语的译法
  choice: 尽行毁灭
  alternative: 彻底毁灭；置于禁毁之下；奉献给毁灭
  rationale: 该动词不只是普通军事破坏，也带有在神圣审判下使对象不可撤回地归于毁灭的意味。正文采用清楚自然的表达，脚注保留其礼仪／审判色彩，不额外引入宗派解释。
- issue: 亚玛力的集合单数
  choice: 亚玛力……他
  alternative: 亚玛力人……他们
  rationale: 希伯来文以单数专名和单数代词把整个族群视为一个整体；译文保留这种形式及其张力，并用脚注防止误解为单独一人。
- issue: 人类类别的明确表达
  choice: 男人女人、孩童和吃奶的婴儿
  alternative: 所有人；男女老幼
  rationale: 原文明确列出男女及幼儿类别；不以概括成语取代这些严峻而具体的称谓，也不淡化经文内容。
translation_notes:
  register: 采用现代、庄重而直接的普通话。保留经文命令的严厉语气，不以委婉语弱化内容；同时避免“当灭之物”等普通读者不易理解的传统术语。以“无论……都……”自然传达希伯来文反复“从……到……”的总括功能。
