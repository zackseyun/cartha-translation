  text: וַ/יָּ֥שָׁב שְׁמוּאֵ֖ל אַחֲרֵ֣י שָׁא֑וּל וַ/יִּשְׁתַּ֥חוּ שָׁא֖וּל לַֽ/יהוָֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/031.yaml
  text: So Samuel went back after Saul[a], and Saul bowed down to Yahweh.
translation:
  language: zh_hans
  text: 于是，撒母耳跟着扫罗回去了；扫罗向耶和华俯伏。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“敬拜耶和华。”这个希伯来语动词可按语境表示俯伏或敬拜。
    reason: 保留וַיִּשְׁתַּחוּ的词义选择及其语境含义。
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: 回去了
  rationale: 该词源自שׁוב，在叙事中表示撒母耳改变先前不肯与扫罗同回的行动而返回；“回去了”符合现代汉语表达，也保留“返回”的含义。
- source_word: אַחֲרֵי
  choice: 跟着
  rationale: 该介词本义为“在……之后、后面”；此处指撒母耳随扫罗返回。“跟着”自然表达同行关系，同时不增添原文没有说明的目的。
- source_word: וַיִּשְׁתַּחוּ
  choice: 俯伏
  rationale: 该动词可指身体俯伏，也可按语境指敬拜。正文采用具体的身体动作“俯伏”，保留词义张力；“敬拜”的译法列入脚注。
- source_word: לַיהוָה
  choice: 向耶和华
  rationale: 前缀ל表示动作所朝向的对象；יהוה采用中文圣经中通行且明确的专名译法“耶和华”。
- source_word: שְׁמוּאֵל
  choice: 撒母耳
  rationale: 采用中文圣经通行人名译法。
- source_word: שָׁאוּל
  choice: 扫罗
  rationale: 采用中文圣经通行人名译法。
theological_decisions:
- issue: וַיִּשְׁתַּחוּ应明确译作敬拜，还是保留身体俯伏的动作含义
  choice: 正文译作“向耶和华俯伏”
  alternative: “敬拜耶和华”或“俯伏敬拜耶和华”
  rationale: 因耶和华是动作所朝向的对象，语境显然带有敬拜意味；但该希伯来动词本身首先描写俯伏动作。正文保留具体动作，脚注说明“敬拜”的可能译法，以免过早消除词义层次。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“于是”承接上文；分号体现两个连续而关系紧密的动作。正文避免使用较生硬的“在扫罗后面”，改用自然的“跟着扫罗”。
