  text: וְ/גַם֙ נֵ֣צַח יִשְׂרָאֵ֔ל לֹ֥א יְשַׁקֵּ֖ר וְ/לֹ֣א יִנָּחֵ֑ם כִּ֣י לֹ֥א אָדָ֛ם ה֖וּא לְ/הִנָּחֵֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/029.yaml
  text: Moreover[a], the Glory of Israel will not lie, nor will he relent, for he is not a man[b], that he should relent.
translation:
  language: zh_hans
  text: 并且，以色列的荣耀[a]绝不说谎，也不改变心意[b]；因为他不是人，不会改变心意。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“以色列的永恒者”“以色列的力量”或“以色列的胜利”。这里的希伯来语称号含义较广。
    reason: lexical_alternative
  - marker: b
    text: 或译“也不后悔”或“也不收回决定”。同一希伯来语动词在不同语境中可有“后悔、改变心意、回心转意”等含义。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: 并且
  rationale: 兼顾连接与递进语气，承接上文对扫罗的宣告；现代汉语中简洁自然。
- source_word: נֵצַח יִשְׂרָאֵל
  choice: 以色列的荣耀
  rationale: נֵצַח在此构成尊称，语义可涉及荣耀、恒久、力量或胜利。“以色列的荣耀”保留庄重的称号性质，同时不把其中的多义性限定为抽象的永恒观念。
- source_word: יְשַׁקֵּר
  choice: 绝不说谎
  rationale: שקר的皮勒尔式可指说谎、虚假待人；“说谎”直接表达其常见含义，“绝不”也传达לֹא在此断言中的坚定语气。
- source_word: וְלֹא יִנָּחֵם
  choice: 也不改变心意
  rationale: נחם的尼法勒式可指后悔、回心转意或收回决定。此处关乎神对扫罗所作判决不会逆转，“改变心意”自然易懂，并保留该词与上下文之间的神学张力。
- source_word: כִּי
  choice: 因为
  rationale: 明确引出前述断言的理由，符合现代汉语表达。
- source_word: לֹא אָדָם הוּא
  choice: 他不是人
  rationale: 忠实保留原文单数谓语结构，表达神与人之间的对照，而不将其扩展成原文未明说的哲学命题。
- source_word: לְהִנָּחֵם
  choice: 不会改变心意
  rationale: 与前面的יִנָּחֵם保持词汇一致，并以自然汉语表达目的或结果性的补足关系。
theological_decisions:
- issue: 如何表达神不改变决定而又不过度引申为抽象的神学命题
  choice: 在扫罗被弃的具体审判语境中译为“绝不说谎，也不改变心意”
  alternative: “绝不后悔”或“绝不收回决定”
  rationale: 本节强调神的话可靠，并且不会撤回对扫罗的判决。“改变心意”保留נחם的常见语义及其与本章其他用法之间的张力，不把经文默默协调成更广泛的哲学陈述。
- issue: 神圣称号נֵצַח יִשְׂרָאֵל的多义性
  choice: 正文采用“以色列的荣耀”，脚注保留其他可行译法
  alternative: “以色列的永恒者”“以色列的力量”或“以色列的胜利”
  rationale: 该词在这里的确切侧重点有争议。正文使用庄重而不过度限定的称号，脚注则公开其词义范围，避免以单一解释消除原文歧义。
- issue: “他不是人”的神人对照
  choice: 保留原文直陈式对照
  alternative: “他不像世人”或“他不是凡人”
  rationale: “他不是人”最贴近לֹא אָדָם הוּא，并把解释范围留给经文本身；上下文所强调的是神不会像人那样说谎或反复。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。句式保留希伯来文的递进、否定与因果结构；“以色列的荣耀”作为神圣称号处理。两个脚注标记均已置于正文相应位置。
