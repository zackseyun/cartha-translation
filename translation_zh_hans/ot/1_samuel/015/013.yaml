revisions:
- from: 撒母耳来到扫罗那里，扫罗对他说：“愿耶和华赐福给你！我已经履行了耶和华的话。”
  to: 撒母耳来到扫罗那里，扫罗对他说：“你蒙耶和华赐福了！我已经遵行了耶和华的话。”
  rationale: 修订仅调整祝福语的语气，使之由未来祈愿恢复为原文的祝福宣告；并以更自然的“遵行”表达扫罗声称已将耶和华的话付诸实行。未增添对扫罗宣称真伪的评断。
