base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/013.yaml
  text: Then Samuel came to Saul[a], and Saul said to him, “Blessed are you to Yahweh[b]; I have carried out the word of Yahweh.”
translation:
  language: zh_hans
  text: 撒母耳来到扫罗那里，扫罗对他说：“你蒙耶和华赐福了！我已经遵行了耶和华的话。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  choice: 来到
  rationale: 此处叙述撒母耳来到扫罗面前；“来到”自然表达朝向叙事焦点人物的移动。
- source_word: וַיֹּאמֶר לוֹ
  choice: 对他说
  rationale: 保留希伯来文明确的间接宾语，同时符合现代汉语叙事习惯。
- source_word: בָּרוּךְ אַתָּה לַיהוָה
  choice: 愿耶和华赐福给你
  rationale: 这是祝福语式；意译为自然、庄重的现代汉语，并将耶和华表达为赐福者，避免生硬的“你向耶和华是有福的”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经语境中广为人知的神名形式，作为四字神名的音译性传统表达，而非仅以称号“主”替代。
- source_word: הֲקִימֹתִי
  choice: 我已经履行了
  rationale: קום的使役形与“话”连用，表示使之成立、付诸实行；“履行”既自然，也保留扫罗声称自己完成神所吩咐之事的语气。
- source_word: דְּבַר יְהוָה
  choice: 耶和华的话
  rationale: “话”保留דָּבָר的宽泛语义及原文表达；上下文自然表明这里指神的命令，无须窄化为“命令”。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: “耶和华”是普通现代中文读者最熟悉的专名形式，保留其作为神名而非称号的功能；“雅威”更接近现代学界常见的拟音，但在通行中文经文中熟悉度较低。
- issue: 扫罗祝福语的语义关系
  choice: 愿耶和华赐福给你
  alternative: 你是属于耶和华所赐福的
  rationale: לַיהוָה在这一祝福语式中的精确关系可按归属或施事理解；正文采用自然汉语表达其祝愿功能，不把它译成对撒母耳属灵状态的额外断言。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。对话保留扫罗热情问候和自信宣称的语气；不在本节文字中预先评断其宣称是否真实。
