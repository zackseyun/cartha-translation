  text: וַ/יֹּ֣אמֶר שָׁא֣וּל אֶֽל הַ/קֵּינִ֡י לְכוּ֩ סֻּ֨רוּ רְד֜וּ מִ/תּ֣וֹךְ עֲמָלֵקִ֗י פֶּן אֹֽסִפְ/ךָ֙ עִמּ֔/וֹ וְ/אַתָּ֞ה עָשִׂ֤יתָה חֶ֨סֶד֙ עִם כָּל בְּנֵ֣י יִשְׂרָאֵ֔ל בַּ/עֲלוֹתָ֖/ם מִ/מִּצְרָ֑יִם וַ/יָּ֥סַר קֵינִ֖י מִ/תּ֥וֹךְ עֲמָלֵֽק־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/006.yaml
  text: Then Saul said to the Kenite[a], “Go, turn aside, go down from among the Amalekites, lest I sweep you away with them[c][b]. For you showed kindness to all the sons of Israel when they came up from Egypt.” So the Kenite turned aside from among the Amalekites.
translation:
  language: zh_hans
  text: 扫罗对基尼人[a]说：“你们走吧，离开亚玛力人，从他们中间下去，免得我把你们和他们一同毁灭[b]；因为以色列众人[d]从埃及上来的时候，你们曾恩待[c]他们。”于是基尼人便从亚玛力人中间撤离了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文用单数族称“基尼人”，在这里很可能是指整个基尼族群。
    reason: collective_singular
  - marker: b
    text: 或译：“免得我把你们和他们一同扫除（或除去）。”原文动词在这里可表示在审判中一并除去。
    reason: lexical_alternative
  - marker: c
    text: “恩待”所译的希伯来词也可表示“忠诚”“慈爱”或关系中的坚定善意。
    reason: lexical_alternative
  - marker: d
    text: 原文直译为“以色列所有的儿子”，是指以色列全体人民的惯用民族称谓。
    reason: source_form
lexical_decisions:
- source_word: הַקֵּינִי / קֵינִי
  choice: 基尼人
  rationale: 希伯来文使用单数族称，但在本节中作集合名词，既可指基尼族群，也可由其代表承接命令。汉语“基尼人”可自然保留这种单数形式与集合含义。
- source_word: לְכוּ סֻּרוּ רְדוּ
  choice: 你们走吧，转身离开，从……中间下去
  rationale: 保留原文连续三个复数命令及其行动层次；“下去”对应 ירד 的具体方向用语，不将其泛化为单纯“撤走”。
- source_word: מִתּוֹךְ עֲמָלֵקִי
  choice: 从亚玛力人中间
  rationale: מִתּוֹךְ 表示“从……中间”；族称在此指亚玛力族群。
- source_word: פֶּן אֹסִפְךָ עִמּוֹ
  choice: 免得我把你们和他们一同除掉
  rationale: אסף 在审判语境中可指被收去、清除；此处威胁是基尼人可能与亚玛力人一同遭毁灭。“除掉”传达语境意义，同时脚注保留“扫除/毁灭”的可能表达。
- source_word: חֶסֶד
  choice: 恩待
  rationale: 此处指基尼人过去向以色列所施的忠厚善行。“恩待”在现代汉语中自然、庄重，并保留行为性的善意，不预先断定双方存在正式圣约关系。
- source_word: כָּל בְּנֵי יִשְׂרָאֵל
  choice: 以色列众人
  rationale: 这是指整个以色列民族的惯用表达；“众人”在现代汉语中准确传达其集体所指，脚注注明原文形式。
- source_word: בַּעֲלוֹתָם מִמִּצְרָיִם
  choice: 从埃及上来的时候
  rationale: 保留 עלה 的“上来”意象，这是描述以色列出埃及的常用方向表达。
- source_word: וַיָּסַר
  choice: 离开了
  rationale: 与前面的 סֻּרוּ 同根，表示基尼人遵命撤离；汉语结句用“离开了”比重复“转身离开”更自然。
theological_decisions:
- issue: חֶסֶד 在非神圣主体、历史关系语境中的译法
  choice: 恩待
  alternative: 忠诚；慈爱；守约的忠诚
  rationale: 原文可涵盖仁厚、忠诚与关系性的善意，但本节没有明说基尼人与以色列订立圣约。译作“恩待”避免把“正式圣约”引入经文，同时由脚注保留词义宽度。
- issue: בְּנֵי יִשְׂרָאֵל 的民族性表达
  choice: 以色列众人
  alternative: 以色列众子；所有以色列人
  rationale: 该短语是全民族称谓，不仅指男性后裔。“以色列众人”以自然现代汉语表达其范围，脚注交代希伯来文的字面结构。
- issue: 审判语境中 אסף 的力度
  choice: 一同除掉
  alternative: 一同扫除；一同毁灭；一同收去
  rationale: 该动词本身可有“收聚、收去”义，但上下文是对亚玛力人的战争审判。“除掉”体现实际威胁而不过度规定具体毁灭方式。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。保留原文连续命令、“下去”和“从埃及上来”的空间意象；以复数代词显明单数族称的集合用法。脚注标记按其所解释的词语就近安放。
