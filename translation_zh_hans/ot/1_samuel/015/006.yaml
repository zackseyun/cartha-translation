  to: 扫罗对基尼人[a]说：“你们走吧，离开亚玛力人，从他们中间下去，免得我把你们和他们一同毁灭[b]；因为以色列众人[d]从埃及上来的时候，你们曾恩待[c]他们。”于是基尼人便从亚玛力人中间撤离了。
