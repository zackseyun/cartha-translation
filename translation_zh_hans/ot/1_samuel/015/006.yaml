  terminology: “基尼人”“亚玛力人”“扫罗”“以色列”均合适。“恩待”适切地表达 חֶסֶד 在此处的仁厚善行，且不强加正式圣约关系。“以色列众人”可接受，脚注说明“以色列所有的儿子”的原文形式也处理得当。
