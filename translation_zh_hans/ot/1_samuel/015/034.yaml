  yaml_path: translation/ot/1_samuel/015/034.yaml
  text: Then Samuel went to Ramah[a], and Saul went up to his house in Gibeah of Saul.
translation:
  language: zh_hans
  text: 于是，撒母耳往拉玛去了；扫罗则上到自己在扫罗的基比亚的家里去了。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“扫罗基比亚”。希伯来文保留了“扫罗的基比亚”这一地名形式。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: 往……去了
  rationale: הלך的叙事性未完成式在这里推进情节，表示简单的“去”；“往拉玛去了”符合现代汉语叙事习惯。
- source_word: הָרָמָתָה
  choice: 往拉玛
  rationale: 地名后的方向词尾־ה表示朝向拉玛；汉语自然表达为“往拉玛”。
- source_word: עָלָה
  choice: 上到
  rationale: עלה通常表示“上去”，可能含有地势上的意味；译作“上到”保留这一语义，而不简化成单纯的“去”。
- source_word: בֵּיתוֹ
  choice: 自己的家
  rationale: בַּיִת加第三人称阳性单数后缀直译为“他的家”。本句主语是扫罗，现代汉语用反身代词“自己的”可清楚避免指代含混；“家”在此比“房屋”自然。
- source_word: גִּבְעַת שָׁאוּל
  choice: 扫罗的基比亚
  rationale: 保留专名“基比亚”以及希伯来文的属格形式，不武断判定它表示所有关系还是固定地名。
theological_decisions: []
