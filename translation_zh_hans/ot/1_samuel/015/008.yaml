  - severity: low
    issue: “尽行毁灭”不如“尽行灭绝”贴合此处既有中文经文语域。
    rationale: 两者均可表达毁灭，但“尽行灭绝”更明确地传达原文חרם在战争叙事中的彻底毁灭，并与脚注的“彻底灭绝”一致。
  revised_text: 他活捉了亚玛力人的王亚甲，又用刀剑把所有百姓尽行灭绝[a]。
