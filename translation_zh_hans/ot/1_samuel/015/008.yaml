  text: וַ/יִּתְפֹּ֛שׂ אֶת אֲגַ֥ג מֶֽלֶךְ עֲמָלֵ֖ק חָ֑י וְ/אֶת כָּל הָ/עָ֖ם הֶחֱרִ֥ים לְ/פִי חָֽרֶב־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/008.yaml
  text: He captured Agag king of Amalek alive[a], and devoted all the people to destruction with the edge of the sword.
translation:
  language: zh_hans
  text: 他活捉了亚玛力人的王亚甲，又用刀剑把所有百姓尽行灭绝[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“把所有百姓都彻底灭绝。”译作“尽行灭绝”的希伯来语，指把人或物置于禁令之下，归于毁灭。
    reason: 说明חרם的词义范围，并保留较直白的译法。
lexical_decisions:
- source_word: וַיִּתְפֹּשׂ
  choice: 活捉
  rationale: 该动词表示抓住、擒获；与后面的“活着”合译为“活捉”，符合军事语境，也自然简洁。
- source_word: אֲגַג
  choice: 亚甲
  rationale: 采用该人名在现代中文圣经中的通行音译。
- source_word: מֶלֶךְ עֲמָלֵק
  choice: 亚玛力王
  rationale: 直接表达原文的属格结构“亚玛力的王”，中文以“亚玛力王”更自然。
- source_word: חָי
  choice: 活捉（其中“活”）
  rationale: 这是表语形容词，说明亚甲被擒时仍然活着；中文并入“活捉”表达。
- source_word: כָּל הָעָם
  choice: 所有百姓
  rationale: עָם 基本义为“人民、百姓”。此处不限定为军队，保留原文较宽泛的指称。
- source_word: הֶחֱרִים
  choice: 尽行毁灭
  rationale: חרם 的使役形在战争语境中指置于禁令之下、献作毁灭。“尽行毁灭”既保留彻底毁灭的行动，也不把该词简化为普通的杀戮。
- source_word: לְפִי חָרֶב
  choice: 用刀
  rationale: 原文直译为“按着刀剑之口”，是指用刀剑杀戮的惯用语。现代汉语用“用刀”自然清楚；“尽行毁灭”已表达行动结果，无须生硬译作“用刀刃”。
theological_decisions:
- issue: חרם 战争用语的翻译
  choice: 将所有百姓尽行毁灭
  alternative: 把所有百姓都彻底灭绝；把所有百姓置于禁令之下
  rationale: 原词兼有置于禁令之下和彻底毁灭的含义。“尽行毁灭”保留其特殊而严厉的战争语义，同时避免使用普通读者难懂的技术性说法；脚注列出另一种直白译法并说明其背景。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“活捉”自然合并原文的“擒获”和“活着”；“又”忠实连接两个并列行动，不额外解释扫罗对亚甲与百姓采取不同处置的动机。
