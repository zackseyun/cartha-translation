review_pass:
  verdict: revise
  source_fidelity: 原文先说扫罗擒获亚甲且使其存活，再说他以刀剑将全体百姓置于חרם、毁灭。草案的“活捉”可合并表达前一分句；但“亚玛力王”在现代汉语中容易被读为名叫“亚玛力”的王，未清楚表达“亚玛力人的王”。“尽行灭绝”比“尽行毁灭”更贴近此处战争语境及中文圣经常见的对应表达。
  naturalness: 建议用“亚玛力人的王亚甲”消除修饰关系歧义，并将“又用刀将”调整为“又用刀剑把”，使叙事更自然庄重。“尽行灭绝”在此类经文语域中自然且明确。
  terminology: 亚甲、亚玛力采用通行译名。“尽行灭绝”保留חרם所含的彻底毁灭与禁令背景；脚注说明其技术性含义，避免把它仅理解为一般军事行动。
