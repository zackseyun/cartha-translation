- from: 他活捉了亚玛力王亚甲，又用刀将所有百姓尽行毁灭[a]。
  to: 他活捉了亚玛力人的王亚甲，又用刀剑把所有百姓尽行灭绝[a]。
  rationale: 修订仅消除“亚玛力王”的现代汉语歧义，并以更贴合该段经文语域的“尽行灭绝”替换“尽行毁灭”；保留“活捉”对“擒获……活着”的简洁合译，也保留原文两个并列行动及刀剑意象。
