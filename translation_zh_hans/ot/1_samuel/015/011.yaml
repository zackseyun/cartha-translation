  to: “我后悔立扫罗为王[a]，因为他转身不再跟从我[b]，也没有遵行我的话[c]。”撒母耳怒火中烧[d]，整夜向耶和华呼求。
  rationale: 仅作一项文体与搭配上的安全修订：以‘遵行我的话’替换‘实行我的话’。这在现代汉语中更自然，并能表达原文‘使我的话得以成立／落实’所指的顺从行动。其余译文及脚注忠实保留原文的情感张力、惯用语意象和可讨论的语境理解。
