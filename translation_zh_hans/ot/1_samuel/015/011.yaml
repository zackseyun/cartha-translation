  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: נִחַ֗מְתִּי כִּֽי הִמְלַ֤כְתִּי אֶת שָׁאוּל֙ לְ/מֶ֔לֶךְ כִּֽי שָׁב֙ מֵ/אַֽחֲרַ֔/י וְ/אֶת דְּבָרַ֖/י לֹ֣א הֵקִ֑ים וַ/יִּ֨חַר֙ לִ/שְׁמוּאֵ֔ל וַ/יִּזְעַ֥ק אֶל יְהוָ֖ה כָּל הַ/לָּֽיְלָה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/011.yaml
  text: I regret that I made Saul king[a], because he has turned back from following me and has not carried out my words. And Samuel burned with anger[d][c][b], and he cried out to Yahweh all night.
translation:
  language: zh_hans
  text: “我后悔立扫罗为王[a]，因为他转身不再跟从我[b]，也没有遵行我的话[c]。”撒母耳怒火中烧[d]，整夜向耶和华呼求。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “后悔”也可译作“痛惜”或“改变心意”。原文表达耶和华因立扫罗为王而有的深切哀痛。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“从我后面转回”，是指转离、不再跟从耶和华。
    reason: lexical_alternative
  - marker: c
    text: “遵行我的话”也可译作“成就我的话”或“听从我的话”。
    reason: lexical_alternative
  - marker: d
    text: 原文是以“燃烧”描写愤怒的惯用语；按上下文，也有人理解为撒母耳深感痛心或极其不悦。
    reason: alternative_reading
lexical_decisions:
- source_word: נִחַמְתִּי
  choice: 我后悔
  rationale: 此处 נחם 的尼法勒式表达因扫罗作王而有的真实痛惜与悔意。“我后悔”保留原文强烈而有张力的拟人表达，却不额外断言上帝犯了道德错误。
- source_word: הִמְלַכְתִּי אֶת־שָׁאוּל לְמֶלֶךְ
  choice: 立扫罗为王
  rationale: 使役式 מלך 表示使某人登基或设立某人为王；“立……为王”自然、庄重，并准确体现君王任命。
- source_word: שָׁב מֵאַחֲרַי
  choice: 转身不再跟从我
  rationale: 原文直译近于“从我后面转回”，是离弃跟从者身份的惯用语。此译既保留转身的动态意象，也清楚表达不再跟从。
- source_word: וְאֶת־דְּבָרַי לֹא הֵקִים
  choice: 也没有实行我的话
  rationale: קום 的使役式与“话”连用，指将所说的话付诸实行、使之成立。“实行”比单纯的“听从”更保留原文具体的落实含义。
- source_word: וַיִּחַר לִשְׁמוּאֵל
  choice: 撒母耳怒火中烧
  rationale: חרה 的惯用表达以“燃烧”描绘愤怒；“怒火中烧”保留其鲜明意象。上下文也可能使人理解为痛心或强烈不悦，故在脚注说明。
- source_word: וַיִּזְעַק אֶל־יְהוָה
  choice: 向耶和华呼求
  rationale: זעק 表示在困苦或迫切中大声呼喊；“呼求”自然体现祷告对象及强烈、持续的恳求。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的专名形式“耶和华”，以专名而非称号呈现四字神名。
- source_word: כָּל־הַלַּיְלָה
  choice: 整夜
  rationale: 简洁自然地表达整个夜晚持续不断。
theological_decisions:
- issue: 上帝所说 נִחַמְתִּי 的含义
  choice: 我后悔
  alternative: 我遗憾；我痛惜；我改变心意
  rationale: “我后悔”直接保留经文本身有关上帝回应历史中扫罗悖逆的强烈情感与神学张力，不把它弱化为一般悲伤，也不将其解释成上帝犯错或犯罪。
- issue: 撒母耳在 וַיִּחַר לִשְׁמוּאֵל 中的情绪
  choice: 撒母耳怒火中烧
  alternative: 撒母耳很痛心；撒母耳非常不悦
  rationale: 惯用语的首要词义指向发怒，因此正文保留“燃烧”的愤怒意象；鉴于语境可带出悲痛或强烈不悦，脚注保留这一理解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“立……为王”“转身不再跟从”“实行我的话”兼顾原文意象与中文自然度；“怒火中烧”保留希伯来语的鲜明惯用表达。所有词义或语境上的重要可能性均置于脚注，不在正文中消解神学张力。
