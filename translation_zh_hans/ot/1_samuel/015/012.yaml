base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/012.yaml
  text: Samuel rose early in the morning to meet Saul[a], and it was reported to Samuel, saying, “Saul came to Carmel, and look, he has set up a monument for himself; then he turned and passed on and went down to Gilgal.”
translation:
  language: zh_hans
  text: 撒母耳清早起来，去迎接扫罗。有消息传给撒母耳说：“扫罗到了迦密。看，他为自己立了一座纪念碑[a]，然后转身继续前行，下到吉甲去了。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“为自己立了一只手”。这里的“手”是指纪念性的标志物或碑。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכֵּם
  choice: 清早起来
  rationale: 使役词干在此构成“早起”的惯用表达；“清早起来”自然保留了时间上的强调。
- source_word: לִקְרַאת שָׁאוּל
  choice: 去迎接扫罗
  rationale: 介词ל与不定式表达目的；“去迎接”既体现主动前往，也符合现代汉语习惯。
- source_word: וַיֻּגַּד לִשְׁמוּאֵל לֵאמֹר
  choice: 有消息传给撒母耳说
  rationale: 原文为无明确施事者的被动式；此译法不指明报信者，并保留引语公式。
- source_word: בָּא שָׁאוּל הַכַּרְמֶלָה
  choice: 扫罗到了迦密
  rationale: 词尾的方向成分表示朝向迦密的移动；“到了”在转述行程时自然，并突出抵达。
- source_word: וְהִנֵּה
  choice: 看
  rationale: 该话语标记用于引人注意；“看”比“看哪”更符合现代普通话，同时保留其指示和突显作用。
- source_word: מַצִּיב
  choice: 立了
  rationale: 分词与הִנֵּה连用，使动作及其结果显得鲜明；汉语“立了”自然呈现已经形成的结果状态。
- source_word: יָד
  choice: 纪念碑
  rationale: 该词字面义为“手”，但在这里是指纪念性标志物；直译会掩盖语境中的惯用意义。
- source_word: לּוֹ
  choice: 为自己
  rationale: 此处与主语扫罗形成反身关系，表明纪念碑是为他自己而立。
- source_word: וַיִּסֹּב וַיַּעֲבֹר
  choice: 然后转身继续前行
  rationale: 两个连续动词分别表达转向和接着行进；该译法保留行动次序，又避免生硬逐词翻译。
- source_word: וַיֵּרֶד הַגִּלְגָּל
  choice: 下到吉甲去了
  rationale: ירד包含向下行的地势意味；“下到”保留方向色彩，“去了”使行程叙述符合汉语表达。
