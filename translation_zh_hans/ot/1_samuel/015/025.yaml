id: 1SA.15.25
reference: 1 Samuel 15:25
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/עַתָּ֕ה שָׂ֥א נָ֖א אֶת חַטָּאתִ֑/י וְ/שׁ֣וּב עִמִּ֔/י וְ/אֶֽשְׁתַּחֲוֶ֖ה לַֽ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/025.yaml
  text: Now please forgive my sin[a], and return with me[b], so that I may bow down to Yahweh.
translation:
  language: zh_hans
  text: 现在，求你赦免我的罪[a]，跟我一起回去，好让我向雅威俯伏敬拜[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语直译为“举起（或带走）我的罪”，是“赦免我的罪”的习惯说法。
    reason: lexical_alternative
  - marker: b
    text: 原文动词指俯身或俯伏；在这里，这一动作表达对雅威的敬拜。也可译作“向雅威俯伏”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: 现在
  rationale: 承接撒母耳的责备，引出扫罗眼下的恳求；现代汉语中“现在”自然清楚。
- source_word: שָׂא נָא
  choice: 求你赦免
  rationale: נָשָׂא 字面有“举起、承担、带走”之意，与“罪”连用时是请求宽恕的习语；“求你”也传达 נָא 的恳求语气。
- source_word: אֶת חַטָּאתִי
  choice: 我的罪
  rationale: 上下文是扫罗认罪并求宽恕，“我的罪”准确而直接。
- source_word: וְשׁוּב עִמִּי
  choice: 跟我一起回去
  rationale: שׁוּב 表示返回，עִמִּי 表示与我同去；此处是扫罗请求撒母耳陪他回去。
- source_word: וְאֶשְׁתַּחֲוֶה
  choice: 好让我……俯伏敬拜
  rationale: 该动词本义是俯身或俯伏，在以雅威为对象时同时表达敬拜；译文兼顾身体动作及其宗教含义，并以“好让我”体现命令后续分句的目的意味。
- source_word: לַיהוָה
  choice: 向雅威
  rationale: 介词 לְ 标明俯伏所朝向的对象；以“雅威”音译四字神名，保留专名性质。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。音译“雅威”保留其专名性质，不以称号替代，也不借此加入宗派性解释。
- issue: וְאֶשְׁתַּחֲוֶה 是译作身体动作还是概括为敬拜
  choice: 俯伏敬拜
  alternative: 俯伏；敬拜
  rationale: 单译“俯伏”最贴近动作，却可能让现代读者漏掉此处对神的敬拜含义；单译“敬拜”则会隐去原文明确的身体姿态。“俯伏敬拜”兼顾二者。
translation_notes:
  register: 采用现代、庄重而口语可懂的表达。“求你”保留恳求语气；“跟我一起回去”比生硬的“与我返回”更自然；“好让我”清楚呈现目的关系。
