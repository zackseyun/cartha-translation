base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/028.yaml
  text: And Samuel said to him[a], “Yahweh has torn the kingdom of Israel away from you today and has given it to your neighbor[b], who is better than you.”
translation:
  language: zh_hans
  text: 撒母耳对他说：“雅威今天已经把以色列的王权从你身上撕去，赐给了你的同伴[a]，就是那比你好的人[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “同伴”也可译作“伙伴”或“邻舍”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“比你好”；这里没有说明是在哪一方面更好。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלָיו שְׁמוּאֵל
  choice: 撒母耳对他说
  rationale: 承接叙事，不必机械译出句首连接词；“对他说”准确表达 אֵלָיו。
- source_word: קָרַע
  choice: 撕去
  rationale: 保留“撕裂”的鲜明意象，并与上一节衣襟被撕裂的动作相呼应；“去”同时表达从扫罗身上夺走。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按其作为上帝专名的性质音译四字神名，而不以称号替代。
- source_word: מַמְלְכוּת יִשְׂרָאֵל
  choice: 以色列的王权
  rationale: 此处所夺去并转交的是扫罗对以色列的君王统治权；“王权”比“王国”更准确地表达语境，同时不排除该词“国度”的词义范围。
- source_word: מֵעָלֶיךָ
  choice: 从你身上
  rationale: 贴近介词短语的空间意象，并与“撕去”自然搭配，突出王权从扫罗身上被除去。
- source_word: הַיּוֹם
  choice: 今天
  rationale: 采用现代汉语的自然表达，保留审判宣告的即时性。
- source_word: וּנְתָנָהּ
  choice: 赐给了
  rationale: 希伯来语完成式在此把上帝的决定说成已经成就；“赐给了”保留其确定和完成的语气。
- source_word: לְרֵעֲךָ
  choice: 给了你的一位同伴
  rationale: רֵעַ 可指同伴、伙伴或与某人相对应的另一人；“一位同伴”避免误解为住处相邻的人，也不暗示亲密友情。
- source_word: הַטּוֹב מִמֶּךָּ
  choice: 就是那比你好的人
  rationale: 保留原文直接的比较表达，并明确该短语修饰接受王权的人；不擅自限定“好”究竟指品格、资格还是合宜程度。
theological_decisions:
- issue: 上帝夺去并转交王权的行动是已完成还是将来发生
  choice: 以完成、判决已定的方式表达：“已经……撕去，赐给了”
  alternative: 译作将来时：“将要……撕去，并赐给”
  rationale: 两个完成式在先知性的审判宣告中把决定呈现为已经确立，即使其历史实现仍会逐步展开；中文采用完成表达可保留判决不可撤回的力度。
- issue: “比你好”具体指何种优越
  choice: 保留宽泛的“比你好”
  alternative: 明确译为“比你更配”或“品格比你好”
  rationale: 原文没有限定比较的具体方面；不把它收窄为道德品格、王位资格或能力，以保留经文本身的开放性。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“撕去”保留上下文的象征性动作，“王权”清楚指向君王统治权；整体避免古奥措辞，也不替原文解释“比你好”的具体含义。
