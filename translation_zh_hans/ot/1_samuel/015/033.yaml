base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/033.yaml
  text: Samuel said[a], “As your sword has made women childless[b], so your mother will be childless among women.” And Samuel hacked Agag to pieces before Yahweh at Gilgal.
translation:
  language: zh_hans
  text: 撒母耳说：“你的刀怎样使妇女丧子[a]，你母亲也必照样在妇女中丧子。”撒母耳在吉甲、在雅威面前把亚甲砍成碎块[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “丧子”也可译作“失去儿女”。希伯来文上下两句使用同一词根，突出相应的报应。
    reason: lexical_alternative
  - marker: b
    text: “砍成碎块”也可译作“砍碎”或“肢解”。原文动词比笼统的“处死”更为强烈。
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁכְּלָה / תִּשְׁכַּל（שׁכל）
  choice: 使妇女丧子／你母亲也必……丧子
  rationale: 此词根在上下两句重复，指因儿女死亡而丧子。译文重复“丧子”，既表达实际的丧亲之痛，也保留以同样报应相还的对应结构。
- source_word: חַרְבֶּךָ
  choice: 你的刀
  rationale: 直译这一兵器意象；“刀”在此也自然地代指亚甲以武力实施的杀戮。
- source_word: מִנָּשִׁים
  choice: 在妇女中
  rationale: 保留介词短语的比较或群体范围意味，不擅自将其明确化为“比众妇女更为丧子”等解释。
- source_word: וַיְשַׁסֵּף（שׁסף）
  choice: 把……砍成碎块
  rationale: 该动词强烈而具体，表示砍开或肢解；此译法不将暴力弱化为笼统的“处死”，也不额外渲染。
- source_word: לִפְנֵי יְהוָה
  choice: 在雅威面前
  rationale: לִפְנֵי 表示在某位面前或临在之中；译文保留这一司法或礼仪性的空间表达。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，保留原文所用的专名。
- source_word: בַּגִּלְגָּל
  choice: 就在吉甲
  rationale: 自然表达事件发生的地点；“就”承接叙事而不增加因果解释。
theological_decisions:
- issue: 是否弱化或强化撒母耳亲自处决亚甲的暴力描写
  choice: 明确由撒母耳施行，并译为“把亚甲砍成碎块”
  alternative: “杀死亚甲”或“把亚甲砍碎”
  rationale: 原文明确以撒母耳为主语，并使用语义强烈的动词。译文保留其严酷程度，却不补入赞许、辩护或谴责。
- issue: 同一词根所表达的对等报应
  choice: 上下两句都用“丧子”
  alternative: 上句译“使妇女失去儿女”，下句译“你母亲也必失去儿子”
  rationale: 重复用词让读者看见诗性对应和衡量式报应，同时不进一步解释这句话的神学正当性。
- issue: 神名的呈现
  choice: 雅威
  alternative: 耶和华／上主
  rationale: 原文直接使用四字神名；采用专名音译，避免把它改成称号。
translation_notes:
  register: 采用现代、庄重而直接的叙事语言。“丧子”简洁自然，并保留上下句的重复；“砍成碎块”忠实传达原文的暴烈动作，但避免使用猎奇或额外煽情的措辞。标点按现代简体中文规范处理。
