  yaml_path: translation/ot/1_samuel/015/007.yaml
  text: Then Saul struck Amalek[a], from Havilah as you go to Shur[b], which is opposite Egypt.
translation:
  language: zh_hans
  text: 扫罗击打亚玛力人[a]，从哈腓拉一直到书珥，就是在埃及对面的地方[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文作“亚玛力”，以祖先之名统称亚玛力人。
    reason: lexical_alternative
  - marker: b
    text: “在埃及对面”也可译作“在埃及东面”或“在埃及前面”；原文可指面对或位于埃及对面的地方。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּךְ
  choice: 击打
  rationale: נכה可指击打、攻打或击败；“击打”保留动词的具体力度，又不把本句明确化为彻底击败。
- source_word: שָׁאוּל
  choice: 扫罗
  rationale: 采用现代中文圣经读者熟悉的标准人名译法。
- source_word: עֲמָלֵק
  choice: 亚玛力人
  rationale: 原文为单数祖先名“亚玛力”，在此集合性地指其族人；中文正文补出“人”更自然，脚注保留其原文形式。
- source_word: מֵחֲוִילָה
  choice: 从哈腓拉
  rationale: 介词מִן标示地理范围的起点，直译为“从”。
- source_word: בּוֹאֲךָ שׁוּר
  choice: 直到通往书珥的路上
  rationale: בּוֹאֲךָ是地理惯用语，意为“你往……去时”或“通往……的路上”；结合“从”表达范围时，用“直到通往……的路上”较符合现代汉语。
- source_word: שׁוּר
  choice: 书珥
  rationale: 采用现代中文圣经传统中通行的地名译法。
- source_word: אֲשֶׁר עַל־פְּנֵי מִצְרַיִם
  choice: 书珥在埃及对面
  rationale: עַל־פְּנֵי可表示在某地前面、对面或面向某地；“在埃及对面”保留空间关系而不武断指定方位。
