source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר שָׁא֜וּל מֵ/עֲמָלֵקִ֣י הֱבִיא֗וּ/ם אֲשֶׁ֨ר חָמַ֤ל הָ/עָם֙ עַל מֵיטַ֤ב הַ/צֹּאן֙ וְ/הַ/בָּקָ֔ר לְמַ֥עַן זְבֹ֖חַ לַ/יהוָ֣ה אֱלֹהֶ֑י/ךָ וְ/אֶת הַ/יּוֹתֵ֖ר הֶחֱרַֽמְנוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/015.yaml
  text: And Saul said[a], “They brought them from the Amalekites, because the people spared the best of the sheep and the cattle, in order to sacrifice them to Yahweh your God; but the rest we devoted to destruction.”
translation:
  language: zh_hans
  text: 扫罗说：“这些是他们从亚玛力人那里带来的，因为百姓留下了羊群和牛群中最好的，为要献祭给耶和华你的神；至于其余的，我们已将它们都尽行毁灭了[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我们已将它们都归于毁灭。”原文所用的חָרַם是一个专门用语，指把某物置于禁令之下，归于毁灭。
    reason: 说明חרם在此不只是普通的“毁灭”，并提供较贴近其技术含义的译法。
lexical_decisions:
- source_word: הֱבִיאוּם
  choice: 这些是他们……带来的
  rationale: 该词为בוא的使役形，带第三人称复数宾语后缀；中文以“这些”承接牲畜，并保留原文第三人称复数主语“他们”。
- source_word: מֵעֲמָלֵקִי
  choice: 从亚玛力人那里
  rationale: 此处是族群名称，指亚玛力人，而非单指亚玛力地区。
- source_word: חָמַל ... עַל
  choice: 留下了
  rationale: 在执行毁灭令的军事语境中，该短语表示没有毁灭、予以保留；“留下”比单纯表达情感的“怜惜”更准确地呈现实际行动。
- source_word: מֵיטַב הַצֹּאן וְהַבָּקָר
  choice: 羊群和牛群中最好的
  rationale: מֵיטַב表示其中上好的部分；“羊群和牛群中最好的”自然清楚，也保留两类牲畜。
- source_word: לְמַעַן זְבֹחַ
  choice: 为要献祭
  rationale: לְמַעַן标明目的；中文无需重复宾语，也能明确所留下的牲畜是祭物。
- source_word: לַיהוָה
  choice: 给耶和华
  rationale: 直接音译神的盟约名יהוה，保留专名性质。
- source_word: אֱלֹהֶיךָ
  choice: 你的神
  rationale: 保留第二人称单数后缀；扫罗对撒母耳说“你的神”，其修辞距离不应被改成“我们的神”。
- source_word: הַיּוֹתֵר
  choice: 其余的
  rationale: 简洁指称未被留下的其余部分。
- source_word: הֶחֱרַמְנוּ
  choice: 我们都归于毁灭了
  rationale: חרם在此为使役形，指把对象置于当毁灭的禁令之下；“归于毁灭”兼顾实际毁灭和专门的审判含义，脚注补充其术语色彩。
theological_decisions:
- issue: 圣战和审判语境中חרם的译法
  choice: 归于毁灭
  alternative: 尽行毁灭；置于禁令之下
  rationale: 该词不只是一般意义的杀灭，也含有把对象划归神所命定之毁灭的意味。正文采用较自然而仍保留“归于”色彩的表达，脚注说明其专门含义。
- issue: 神名יהוה的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 原文直接使用四字神名。正文采用现代中文读者熟悉的专名“耶和华”，而不以称号取代；这不消除其作为盟约名的性质。
- issue: “你的神”所呈现的修辞距离
  choice: 保留“你的神”
  alternative: 我们的神
  rationale: 希伯来文明确为第二人称单数。即使措辞可能显出扫罗与耶和华之间的距离，译文也不应替他改写或解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。保留原文从“他们／百姓”转为“我们”的人称变化，以及扫罗所说“耶和华你的神”的措辞。脚注标记紧随其实际说明的短语，而非置于“扫罗说”之后。
