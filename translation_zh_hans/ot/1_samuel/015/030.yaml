  text: וַ/יֹּ֣אמֶר חָטָ֔אתִי עַתָּ֗ה כַּבְּדֵ֥/נִי נָ֛א נֶ֥גֶד זִקְנֵֽי עַמִּ֖/י וְ/נֶ֣גֶד יִשְׂרָאֵ֑ל וְ/שׁ֣וּב עִמִּ֔/י וְ/הִֽשְׁתַּחֲוֵ֖יתִי לַֽ/יהוָ֥ה אֱלֹהֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/030.yaml
  text: And he said[a], “I have sinned. Now please honor me before the elders of my people and before Israel, and return with me, so that I may bow down to Yahweh your God.”
translation:
  language: zh_hans
  text: 他说：“我犯了罪。现在求你在我百姓的长老和以色列面前抬举我，同我回去，好让我向雅伟——你的上帝——下拜[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我就向雅伟——你的上帝——下拜。”这里的希伯来语形式既可理解为简单的承接（“我就……下拜”），也可理解为前一请求的目的（“好让我……下拜”）。
    reason: 保留连接词 וְ 在此处可能表示承接或目的的语义歧义。
lexical_decisions:
- source_word: חָטָאתִי
  choice: 我犯了罪
  rationale: 该词是 חטא 的 Qal 完成式第一人称单数，表达扫罗对已犯之罪的承认；现代汉语用“我犯了罪”自然、明确。
- source_word: עַתָּה
  choice: 现在
  rationale: 保留时间副词，标明扫罗在认罪后随即提出请求。
- source_word: כַּבְּדֵנִי נָא
  choice: 求你……抬举我
  rationale: כבד 的 Piel 命令式在此指给予公开的尊荣或体面；“抬举我”体现扫罗请求撒母耳维护其公众身份，נָא 由“求你”表达。
- source_word: נֶגֶד זִקְנֵי עַמִּי וְנֶגֶד יִשְׂרָאֵל
  choice: 在我百姓的长老和以色列面前
  rationale: נֶגֶד 表示在众人眼前或当着众人的面；保留“我百姓”和未明说“全”的“以色列”。
- source_word: וְשׁוּב עִמִּי
  choice: 同我回去
  rationale: שׁוב 表示返回；上下文中扫罗请求撒母耳陪他回去，“同我回去”简洁自然。
- source_word: וְהִשְׁתַּחֲוֵיתִי
  choice: 好让我……下拜
  rationale: 该形式表示俯伏、下拜；在以雅伟为对象时具有敬拜含义，但“下拜”保留原文所说的身体动作。“好让我”按前一请求将连接词理解为目的。
- source_word: לַיהוָה
  choice: 向雅伟
  rationale: 原文直接使用四字神名 יהוה；采用“雅伟”音译，以区别于称号“主”。
- source_word: אֱלֹהֶיךָ
  choice: 你的上帝
  rationale: 保留第二人称单数后缀，呈现扫罗称雅伟为撒母耳“你的上帝”所形成的叙事与神学张力。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅伟
  alternative: 耶和华／主
  rationale: 原文使用上帝的专名而非称号；“雅伟”较直接地按常见学术复原音译，并保留专名性质。
- issue: אֱלֹהֶיךָ 的人称归属
  choice: 你的上帝
  alternative: 我们的上帝／上帝
  rationale: 希伯来文明确使用第二人称单数；不将其改成“我们的”，以保留扫罗话语中的叙事和神学张力。
- issue: וְהִשְׁתַּחֲוֵיתִי 与前句的关系
  choice: 目的关系：“好让我……下拜”
  alternative: 简单承接：“我就……下拜”
  rationale: 连接词可在命令式请求之后表达目的，但其形式也容许简单延续；正文采用自然的目的表达，并以脚注保留另一种理解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“抬举我”传达公开给予尊荣的社会语境；“下拜”既自然，又保留 שׁחה 所指的俯伏动作。脚注标记置于相关分句之后。
