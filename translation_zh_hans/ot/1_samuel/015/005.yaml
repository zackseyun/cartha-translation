  yaml_path: translation/ot/1_samuel/015/005.yaml
  text: Saul came to the city of Amalek and lay in wait in the wadi[a][b][c].
translation:
  language: zh_hans
  text: 扫罗来到亚玛力城[c]，在干河谷[b]设下埋伏[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 此处希伯来语动词的意义较难确定；也可理解为“争斗”或“相争”，但语境较支持“设下埋伏”的意思。
    reason: lexical_alternative
  - marker: b
    text: “干河谷”指季节性水道所在的谷地，除雨季外可能没有流水。
    reason: cultural_note
  - marker: c
    text: 或译：“亚玛力人的城。”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּבֹא
  choice: 来到
  rationale: בוא可按叙事视角译为“来、去、到达”；这里描写扫罗抵达目标地点，“来到”自然且准确。
- source_word: עַד
  choice: 到
  rationale: עַד与移动动词连用时可表示“直到、到达”；现代汉语以“来到”合并表达最为顺畅。
- source_word: עִיר עֲמָלֵק
  choice: 亚玛力城
  rationale: 原文为组合结构，直指“亚玛力的城”；“亚玛力”也可指亚玛力人群体，因此另在脚注保留“亚玛力人的城”这一理解。
- source_word: וַיָּרֶב
  choice: 设下埋伏
  rationale: 马所拉文本所保留的动词形式较难解释，按通常词根可有“争斗、相争”之意；但本节军事语境及古代译本传统支持埋伏或战术部署的理解。正文采用合乎语境的“设下埋伏”，脚注保留原文歧义。
- source_word: בַּנָּחַל
  choice: 在干河谷
  rationale: נחל常指季节性水道及其谷地，雨季可能有水，旱季则可干涸。“干河谷”比“溪边”更能呈现当地地貌，也比音译术语更便于普通读者理解。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而通俗的叙事语言。“干河谷”兼顾地理准确性与可理解性；正文以军事语境所支持的“设下埋伏”表达行动，同时用脚注明确保留希伯来文本在动词上的真实困难与其他可能译法。
