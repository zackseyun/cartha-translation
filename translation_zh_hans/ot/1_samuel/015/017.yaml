  text: וַ/יֹּ֣אמֶר שְׁמוּאֵ֔ל הֲ/ל֗וֹא אִם קָטֹ֤ן אַתָּה֙ בְּ/עֵינֶ֔י/ךָ רֹ֛אשׁ שִׁבְטֵ֥י יִשְׂרָאֵ֖ל אָ֑תָּה וַ/יִּמְשָׁחֲ/ךָ֧ יְהוָ֛ה לְ/מֶ֖לֶךְ עַל יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/017.yaml
  text: And Samuel said[a], “Though you were small in your own eyes, were you not the head of the tribes of Israel? And Yahweh anointed you king over Israel.”
translation:
  language: zh_hans
  text: 撒母耳说：“你在自己眼中虽微小[a]，不是以色列众支派的首领吗？雅威又膏立你作以色列的王。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“即使你在自己眼中微小。”希伯来语在这里的连接语气可有略微不同的理解；所指是扫罗曾看自己地位低微。
    reason: 保留 אִם קָטֹן אַתָּה בְּעֵינֶיךָ 可作让步或“即使”条件理解的细微歧义。
lexical_decisions:
- source_word: וַיֹּאמֶר שְׁמוּאֵל
  choice: 撒母耳说
  rationale: 按希伯来语叙事句式直译；中文无需机械保留句首连接词，仍清楚承接上文。
- source_word: הֲלוֹא
  choice: 不还是……吗
  rationale: 表达期待肯定回答的反问语气，也自然呈现扫罗自视微小与实际身份之间的反差。
- source_word: אִם קָטֹן אַתָּה בְּעֵינֶיךָ
  choice: 你虽然自以为微不足道
  rationale: “虽然”体现此处较可能的让步关系；“自以为”传达“在你自己眼中”的希伯来语习惯说法，“微不足道”则保留地位低微、自认渺小的含义。原句也可理解为“即使”，故加注保留歧义。
- source_word: רֹאשׁ שִׁבְטֵי יִשְׂרָאֵל
  choice: 以色列众支派的首领
  rationale: רֹאשׁ字面为“头”，在此指居首位、统领者；译作“首领”比“头”更符合现代汉语，同时未过度限定具体职衔。
- source_word: וַיִּמְשָׁחֲךָ
  choice: 膏立了你
  rationale: 保留מָשַׁח所指的膏抹行动及其君王任命意义；“膏立”在中文中兼顾仪式和任命。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代中文常见音译呈现四字神名，保留其专名性质，而不以称号替代。
- source_word: לְמֶלֶךְ עַל־יִשְׂרָאֵל
  choice: 作以色列的王
  rationale: 自然表达膏立的结果，并忠实保留君王治理以色列之意。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”是较贴近学界通常重构读音的现代中文音译，也明确将其作为专名呈现。
- issue: 扫罗“微小”与首领身份之间的关系
  choice: 以让步句“虽然……不还是……吗”表达
  alternative: “即使你自以为微不足道”
  rationale: 上下文重点在扫罗自我估量与受立为首领之间的反差；不过אִם的细微语气并非毫无歧义，因此正文采用较顺畅的让步理解，并在脚注保留另一可能。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“微不足道”自然表达自觉低微；“首领”“膏立”“王”保持经文的政治与礼仪语义。反问句保留撒母耳责问的力度。
