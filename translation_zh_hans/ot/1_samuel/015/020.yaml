  text: וַ/יֹּ֨אמֶר שָׁא֜וּל אֶל שְׁמוּאֵ֗ל אֲשֶׁ֤ר שָׁמַ֨עְתִּי֙ בְּ/ק֣וֹל יְהוָ֔ה וָ/אֵלֵ֕ךְ בַּ/דֶּ֖רֶךְ אֲשֶׁר שְׁלָחַ֣/נִי יְהוָ֑ה וָ/אָבִ֗יא אֶת אֲגַג֙ מֶ֣לֶךְ עֲמָלֵ֔ק וְ/אֶת עֲמָלֵ֖ק הֶחֱרַֽמְתִּי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/020.yaml
  text: Saul said to Samuel[a], “But I did obey the voice of Yahweh, and I went on the way that Yahweh sent me, and I brought Agag king of Amalek[b], and I devoted Amalek to destruction.”
translation:
  language: zh_hans
  text: 扫罗对撒母耳说：“我确实听从了雅威的话[b]，按着雅威差我去的路而行；我把亚玛力王亚甲带来了，并把亚玛力人完全毁灭了[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“把亚玛力人归于毁灭”，又或“把亚玛力人置于禁令之下”。希伯来语动词含有将对象归于毁灭的特殊意义。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语直译“听从雅威的声音”。
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַעְתִּי בְּקוֹל
  choice: 我确实听从了……的话
  rationale: שׁמע בְּקוֹל是“听从、服从某人的声音/话”的惯用语。“听从……的话”是自然的现代汉语；“确实”表达扫罗在反驳中坚持自辩的语气。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译保留四字神名，而不以称号代替。
- source_word: וָאֵלֵךְ בַּדֶּרֶךְ אֲשֶׁר שְׁלָחַנִי יְהוָה
  choice: 按着雅威差我去的路而行
  rationale: 保留דֶּרֶךְ“路、道路”的意象和差遣的含义，同时避免生硬直译。
- source_word: וָאָבִיא
  choice: 带来了
  rationale: בוא的使役形表示使之来到，即“带来”；原文没有明确表达“带回来”，因此不增添“回”的方向含义。
- source_word: אֲגַג מֶלֶךְ עֲמָלֵק
  choice: 亚玛力王亚甲
  rationale: 用自然的汉语同位结构表达“亚甲，亚玛力的王”。
- source_word: וְאֶת עֲמָלֵק
  choice: 亚玛力人
  rationale: 专名“亚玛力”在此集合性地指其民族；译作“亚玛力人”可使现代读者直接理解所指。
- source_word: הֶחֱרַמְתִּי
  choice: 尽行毁灭了
  rationale: 该使役形表示将对象置于禁令之下、献作毁灭。“尽行毁灭”在正文中简洁自然，其礼仪和审判色彩由脚注保留。
theological_decisions:
- issue: חרם在奉献毁灭语境中的含义
  choice: 将亚玛力人尽行毁灭了
  alternative: 将亚玛力人归于毁灭／置于禁令之下
  rationale: 正文传达彻底毁灭的行动，同时脚注说明该词不只泛指杀灭，也含有在禁令之下献作毁灭的特殊含义，避免抹平其神学张力。
- issue: 扫罗自辩的强调语气
  choice: 我确实听从了雅威的话
  alternative: 我听从了雅威的话／我可是听从了雅威的话
  rationale: 句首אֲשֶׁר在此处结合上下文带有坚持、反驳的语用力量；“确实”自然表达扫罗的强烈自辩，又不替读者判断其说法是否真实。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“确实”体现扫罗的辩解口吻；分号保留其陈述中连续列举行动的节奏。神名统一音译为“雅威”。
