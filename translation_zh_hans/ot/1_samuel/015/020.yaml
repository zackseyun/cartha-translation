- from: 扫罗对撒母耳说：“我确实听从了雅威的话[b]，按着雅威差我去的路而行；我把亚玛力王亚甲带来了，并将亚玛力人尽行毁灭了[a]。”
  to: 扫罗对撒母耳说：“我确实听从了雅威的话[b]，按着雅威差我去的路而行；我把亚玛力王亚甲带来了，并把亚玛力人完全毁灭了[a]。”
  rationale: 仅作必要的汉语表达与脚注释义修订。“完全毁灭了”替代不自然的“尽行毁灭了”，不改变扫罗所作的宣称；脚注继续保留חרם可译为“归于毁灭”或“置于禁令之下”的语义张力。原有脚注锚点b对应“听从”、a对应毁灭动词，均予保留。
