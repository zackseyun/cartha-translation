base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/009.yaml
  text: But Saul and the people spared Agag and the best of the sheep and cattle[a], and the fattened calves, and the lambs, and all that was good, and they were not willing to devote them to destruction[b]. But every despised and worthless thing they devoted to destruction.
translation:
  language: zh_hans
  text: 扫罗和百姓却留下亚甲，以及羊群和牛群中最好的牲畜、肥壮的牲畜[a]、公羊，以及一切上好的东西；他们不肯将这些尽行毁灭[b]。凡低劣无用的东西，他们都尽行毁灭了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “肥壮的牲畜”所译的希伯来词含义不确定；也可能指“第二等的牲畜”或某类精选牲畜。
    reason: lexical_alternative
  - marker: b
    text: “尽行毁灭”原文是一个专门用语，指把人或物置于禁令之下，归于毁灭。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחְמֹל
  choice: 留下
  rationale: 此处不只描述怜惜之情，更指实际没有执行毁灭的命令。“留下”以自然汉语准确表达行动结果，同时上下文仍显明这是出于顾惜。
- source_word: מֵיטַב הַצֹּאן וְהַבָּקָר
  choice: 羊群和牛群中最好的
  rationale: מֵיטַב 表示其中最优良的部分；采用“……中最好的”既保留范围关系，也符合现代汉语表达。
- source_word: הַמִּשְׁנִים
  choice: 肥壮的牲畜
  rationale: 该罕见词的确切含义不明，在牲畜清单中传统上常理解为肥壮或精选的牲畜。正文采用语境通顺的译法，并以脚注保留词义不确定性及另一种可能。
- source_word: הַכָּרִים
  choice: 公羊
  rationale: כָּרִים 可指公羊或雄性的幼羊；“公羊”适合此处牲畜清单，同时不过度限定年龄。
- source_word: כָּל הַטּוֹב
  choice: 一切上好的
  rationale: 保留原文对所有被视为优良、可取之物的概括，并与前面的“最好的”自然呼应。
- source_word: לֹא אָבוּ
  choice: 不肯
  rationale: 该动词表达意愿而非能力；“不肯”简洁地呈现他们有意拒绝执行。
- source_word: הַחֲרִימָם / הֶחֱרִימוּ
  choice: 把它们尽行毁灭／都尽行毁灭了
  rationale: חרם 在此指将人或物置于禁令之下而毁灭。正文用自然且庄重的“尽行毁灭”表达实际结果，技术含义则由脚注说明。
- source_word: כָל־הַמְּלָאכָה נְמִבְזָה וְנָמֵס
  choice: 凡低劣无用的
  rationale: מְלָאכָה 在这里泛指掳获之物；两个修饰语共同表示被轻视、没有价值或不堪使用的东西。“凡低劣无用的”简明保留其评价色彩。
theological_decisions:
- issue: 战争语境中 חרם 的译法
  choice: 尽行毁灭
  alternative: 列为当毁灭之物／置于禁令之下
  rationale: 本节的张力在于扫罗等人故意不执行 חרם。正文译出毁灭的实际要求，不弱化其严厉性；脚注说明这是把对象置于禁令之下、归于毁灭的专门用语，避免将其处理成一般军事杀戮。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“却”突出扫罗和百姓的行为与先前命令相反；分号保留原文前后两类对象的鲜明对照。所有脚注标记均置于正文相应位置。
