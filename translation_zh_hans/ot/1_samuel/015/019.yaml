id: 1SA.15.19
reference: 1 Samuel 15:19
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/לָ֥/מָּה לֹא שָׁמַ֖עְתָּ בְּ/ק֣וֹל יְהוָ֑ה וַ/תַּ֨עַט֙ אֶל הַ/שָּׁלָ֔ל וַ/תַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֥י יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/019.yaml
  text: Why then did you not obey the voice of Yahweh[a], but rush upon the spoil and do what was evil in the eyes of Yahweh?
translation:
  language: zh_hans
  text: 你为什么没有听从雅威的话，反而扑向战利品[a]，做雅威眼中看为恶的事呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“冲向战利品”“急切扑取战利品”；这里的希伯来语动词表示急切地朝战争中掳获之物而去，并带有攫取的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָמָּה
  choice: 你为什么
  rationale: 以自然的现代汉语引出撒母耳的责问；上下文中的连接意味由全句承接，不生硬译作“而为什么”。
- source_word: שָׁמַעְתָּ בְּקוֹל
  choice: 听从……的话
  rationale: שׁמע 与 בְּקוֹל 连用，在命令语境中表示听从、服从；“听从……的话”既保留“听”的具体意象，也明确表达顺服之意。
- source_word: יְהוָה
  choice: 雅威
  rationale: 直接音译四字神名，保留其作为以色列之神专名的性质，不以称号替代。
- source_word: וַתַּעַט אֶל
  choice: 反而扑向
  rationale: 该动词描写朝战利品急切扑去的动作；“扑向”传达急切、攫取意味，“反而”则自然表现前后行为的逆转与责备语气。
- source_word: הַשָּׁלָל
  choice: 战利品
  rationale: 在战争叙事中，“战利品”是准确、自然且不易产生歧义的现代汉语表达。
- source_word: וַתַּעַשׂ הָרַע
  choice: 做……看为恶的事
  rationale: 将希伯来语“行那恶”译成自然汉语，同时保留道德评价。
- source_word: בְּעֵינֵי יְהוָה
  choice: 雅威眼中看为
  rationale: 保留希伯来语“在……眼中”的评价性意象，又使整句符合现代汉语习惯。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；采用“雅威”作为现代汉语音译，保留专名性质，而不以“主”这一称号代替。
- issue: “听见”与“顺服”的关系
  choice: 听从雅威的话
  alternative: 听雅威的声音；顺服雅威
  rationale: 原文习语兼具听取与服从的含义；“听从……的话”保留两层意义，避免只译为听觉行为或完全抹去“声音/话语”的具体意象。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“你为什么……呢”保留责问语气；“扑向战利品”使扫罗一方急切贪取掳物的动作鲜明，但以脚注交代该罕见动词可有的译法范围。
