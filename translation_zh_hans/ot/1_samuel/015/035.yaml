source:
  edition: WLC
  text: וְ/לֹא יָסַ֨ף שְׁמוּאֵ֜ל לִ/רְא֤וֹת אֶת שָׁאוּל֙ עַד י֣וֹם מוֹת֔/וֹ כִּֽי הִתְאַבֵּ֥ל שְׁמוּאֵ֖ל אֶל שָׁא֑וּל וַ/יהוָ֣ה נִחָ֔ם כִּֽי הִמְלִ֥יךְ אֶת שָׁא֖וּל עַל יִשְׂרָאֵֽל־־־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/035.yaml
  text: And Samuel did not see Saul again until the day of his death[a], for Samuel mourned over Saul. And Yahweh regretted that he had made Saul king over Israel.
translation:
  language: zh_hans
  text: 撒母耳再也没有见过扫罗，直到他去世的日子[a]；因为撒母耳为扫罗哀伤。雅威因自己立扫罗为以色列王而懊悔[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他”在希伯来语中可指撒母耳或扫罗。按后文的叙事，撒母耳先于扫罗去世（撒母耳记上25:1；28:3），因此通常理解为撒母耳。
    reason: 指代歧义
  - marker: b
    text: 或译“感到遗憾”。这个希伯来语动词依上下文也可表示“回心转意”；这里表达雅威因立扫罗为王而有的痛惜或懊悔。
    reason: 词义选择
lexical_decisions:
- source_word: יָסַף ... לִרְאוֹת
  choice: 再也没有见
  rationale: 否定词与“继续、再做”加不定式构成惯用表达，意为此后不再做某事；“再也没有见”自然地传达这一含义。
- source_word: לִרְאוֹת אֶת שָׁאוּל
  choice: 见扫罗
  rationale: 保留 ראה“看见、见”的基本意义；上下文自然表明这是指亲自相见。
- source_word: עַד יוֹם מוֹתוֹ
  choice: 直到他去世之日
  rationale: 贴近原文结构和庄重语气；希伯来语第三人称后缀的所指在形式上可能是撒母耳或扫罗，因此正文保留代词，并以脚注说明。
- source_word: הִתְאַבֵּל
  choice: 悲伤
  rationale: 该词指哀悼、悲痛；此处扫罗尚未死亡，译作“悲伤”既自然，也避免让读者误以为是在为死者举哀。
- source_word: אֶל שָׁאוּל
  choice: 为扫罗
  rationale: 介词本义为“向、对”，与悲伤动词连用时表示悲伤所关涉的对象；现代汉语以“为扫罗悲伤”最自然。
- source_word: יְהוָה
  choice: 雅威
  rationale: 采用神圣四字名的音译，保留这是以色列之神的专名，而非以“主”这一称号替代。
- source_word: נִחָם
  choice: 懊悔
  rationale: 在“立扫罗作王”这一已发生之事的宾语从句前，该词表达遗憾、痛惜之意；“懊悔”保留原文直接归于雅威的情感性语言及其神学张力。
- source_word: הִמְלִיךְ
  choice: 立……作……的王
  rationale: 该使役形式意为使某人成王；“立扫罗作以色列的王”准确且符合现代汉语。
- source_word: עַל יִשְׂרָאֵל
  choice: 作以色列的王
  rationale: 原介词表达统治范围；汉语在“作……的王”结构中自然体现“统治以色列”的关系，无须生硬直译为“在以色列之上”。
theological_decisions:
- issue: נִחָם 用于雅威时的拟人性和神学张力
  choice: 懊悔
  alternative: 遗憾；回心转意
  rationale: 原文明确把 נִחָם 归于雅威。正文不把它弱化为单纯的行政决定，也不借译文预先调和它与本章29节之间的张力。“懊悔”最贴合这里对立扫罗作王一事的痛惜；脚注列出词义范围。
- issue: מוֹתוֹ 中第三人称后缀的指代
  choice: 正文保留“他”的形式歧义
  alternative: 明确译为“撒母耳去世之日”或“扫罗去世之日”
  rationale: 希伯来语后缀在形式上可指撒母耳或扫罗；叙事后文显示撒母耳先于扫罗去世，因此通常理解为撒母耳，但正文不默默消除原文的指代张力。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“再也没有见”“为扫罗悲伤”避免生硬照搬希伯来语结构；“雅威”保留神名；两处脚注分别呈现代词指向和 נִחָם 的真实语义范围。
