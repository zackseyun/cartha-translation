base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/022.yaml
  text: And Samuel said, “Does the LORD delight in burnt offerings and sacrifices as much as in obeying the voice of the LORD? Look, to obey is better than sacrifice, and to listen than the fat of rams.”
translation:
  language: zh_hans
  text: 撒母耳说：“耶和华喜爱燔祭和祭物，能胜过人听从耶和华的声音吗？看哪，听从胜过献祭；留心听命胜过公羊的脂油。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַחֵפֶץ לַיהוָה
  choice: 耶和华喜爱……吗
  rationale: חפץ 表示喜悦、喜爱；以反问句保留原文修辞，并按希伯来语比较结构补出第二个“喜爱”，使现代汉语清楚自然。
- source_word: בְּעֹלוֹת וּזְבָחִים
  choice: 燔祭和祭物
  rationale: עֹלוֹת 指全牲焚烧的燔祭；זְבָחִים 是较广义的宰牲祭物，译作“祭物”避免不必要地限定祭类。
- source_word: כִּשְׁמֹעַ בְּקוֹל יְהוָה
  choice: 像喜爱人听从耶和华的话一样
  rationale: שמע בקול 是“听从某人的声音/话”的惯用语，在语境中含顺服之意；加入“人”使比较双方在汉语中完整，但不指定对象。
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留原文引人注意、强调随后宣告的语气，采用庄重而仍可理解的圣经文体。
- source_word: שְׁמֹעַ
  choice: 听从
  rationale: 此处不仅是听见，更指听而顺服；与扫罗未遵行命令的上下文一致。
- source_word: לְהַקְשִׁיב
  choice: 留心听命
  rationale: קשׁב 强调侧耳、留意；“留心听命”既保留专注聆听的语义，也表达该语境中的服从含义。
- source_word: מֵחֵלֶב אֵילִים
  choice: 胜过公羊的脂油
  rationale: מן 表比较，חֵלֶב 指献祭中上好的脂油；直译保留古代祭祀意象。
theological_decisions:
- issue: 献祭与听从之间的关系
  choice: 保留“喜爱……能像……一样吗”以及“胜过”的比较表达
  alternative: 译成耶和华完全不喜爱献祭
  rationale: 原文在本节中以反问和比较强调听从优先于祭物，并未直接宣称一切合规献祭本身都不蒙悦纳；因此不将比较绝对化。
- issue: שמע 与 קשׁב 是否都直接译为“顺服”
  choice: 分别译作“听从”和“留心听命”
  alternative: 两处都译作“顺服”
  rationale: 这样既呈现平行句共同指向服从，也保留两个希伯来词在聆听、留意方面的细微差别。
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 采用现代简体中文圣经读者最熟悉的传统专名，同时明确对应原文四字神名，而非普通称号“主”。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“燔祭”“祭物”“公羊的脂油”保留必要的祭祀术语；反问与平行比较结构均依原文呈现。无脚注，故正文不设脚注标记。
