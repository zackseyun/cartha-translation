  text: וַ/יֹּ֤אמֶר שְׁמוּאֵל֙ אֶל שָׁא֔וּל לֹ֥א אָשׁ֖וּב עִמָּ֑/ךְ כִּ֤י מָאַ֨סְתָּה֙ אֶת דְּבַ֣ר יְהוָ֔ה וַ/יִּמְאָסְ/ךָ֣ יְהוָ֔ה מִ/הְי֥וֹת מֶ֖לֶךְ עַל יִשְׂרָאֵֽל־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/026.yaml
  text: And Samuel said to Saul, “I will not return with you, because you have rejected the word of Yahweh, and Yahweh has rejected you from being king over Israel.”
translation:
  language: zh_hans
  text: 撒母耳对扫罗说：“我不跟你回去，因为你厌弃了雅威的话，雅威也厌弃了你，不让你再作以色列的王。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 叙事中的连续式推进情节；现代汉语通常无需另译句首连接词。
- source_word: לֹא אָשׁוּב עִמָּךְ
  choice: 我不跟你回去
  rationale: שׁוּב 表示“返回、回去”，עִמָּךְ 表示伴随；合译自然地表达撒母耳拒绝陪扫罗返回。
- source_word: כִּי
  choice: 因为
  rationale: 明确引出撒母耳拒绝同行的原因。
- source_word: מָאַסְתָּה / וַיִּמְאָסְךָ
  choice: 厌弃了／也厌弃了
  rationale: 两处采用同一译词，保留 מאס 的刻意重复及对应关系；“厌弃”兼有拒绝与轻视之意。
- source_word: דְּבַר יְהוָה
  choice: 雅威的话
  rationale: דָּבָר 在此指雅威所传达的命令，但译作“话”可保留原词较宽的语义和圣经惯用表达。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，而不以称号替代。
- source_word: מִהְיוֹת מֶלֶךְ עַל יִשְׂרָאֵל
  choice: 不让你再作以色列的王
  rationale: מִן 加 היה 不定式表示从君王身份中被排除；汉语用“不让你再作”清楚表达这一结果，עַל 所含的统治关系由“以色列的王”自然传达。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用神的专名，音译可保留其作为以色列之神名字的性质；“雅威”较贴近学界通常重构的读音。
- issue: מאס 在扫罗与雅威两个分句中的对应关系
  choice: 两处都译作“厌弃”
  alternative: 前句译“违背”或“弃绝”，后句译“废弃”
  rationale: 原文重复同一词根，形成严肃的对应：扫罗厌弃雅威的话，雅威也厌弃扫罗，不让他继续为王。统一译词可保留这种神学与修辞张力。
- issue: 雅威厌弃扫罗的具体范围
  choice: 明确限定为“不让你再作以色列的王”
  alternative: 译成对扫罗整个人或其终极命运的无条件弃绝
  rationale: מִהְיוֹת מֶלֶךְ 明确说明这里的弃绝关乎君王身份；译文不将其扩展为经文未明说的终极救恩判断。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“跟你回去”符合对话语境；“厌弃”保留司法性的拒绝及轻视色彩，并通过重复呈现原文修辞。全节无需脚注。
