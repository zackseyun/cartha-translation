  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר שָׁא֤וּל אֶל שְׁמוּאֵל֙ חָטָ֔אתִי כִּֽי עָבַ֥רְתִּי אֶת פִּֽי יְהוָ֖ה וְ/אֶת דְּבָרֶ֑י/ךָ כִּ֤י יָרֵ֨אתִי֙ אֶת הָ/עָ֔ם וָ/אֶשְׁמַ֖ע בְּ/קוֹלָֽ/ם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/024.yaml
  text: Then Saul said to Samuel[a], “I have sinned, for I transgressed the command of Yahweh and your words[b], for I feared the people and listened to their voice.”
translation:
  language: zh_hans
  text: 扫罗对撒母耳说：“我犯了罪，因为我违背了雅威的命令[a]和你的话；因为我惧怕百姓，听从了他们[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语直译为“雅威的口”。
    reason: lexical_alternative
  - marker: b
    text: 或译“听了他们的话”；希伯来语直译为“听了他们的声音”。
    reason: lexical_alternative
lexical_decisions:
- source_word: חָטָאתִי
  choice: 我犯了罪
  rationale: 希伯来语完成式在此是对已经犯下之罪的当下承认；“我犯了罪”在现代汉语中自然明确，也保留扫罗亲自认罪的语气。
- source_word: עָבַרְתִּי
  choice: 我违背了
  rationale: 该动词本义为“越过”，在违反命令的语境中表示越界、触犯；“违背”既自然，又保留其道德与规范意味。
- source_word: פִּי יְהוָה
  choice: 雅威的命令
  rationale: 原文直译为“雅威的口”，是指雅威亲口所发的指示；本段涉及一项明确命令，因此正文按习语译出，并以脚注保留字面形式。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来语四字神名作音译，保留其作为以色列之上帝专名的性质，而不以称号代替。
- source_word: דְּבָרֶיךָ
  choice: 你的话
  rationale: 保留原文复数名词加第二人称单数后缀的直接表达，指撒母耳所传达的话。
- source_word: יָרֵאתִי
  choice: 我惧怕
  rationale: 准确表达动词“害怕、畏惧”的含义；“惧怕”语体庄重，并保留扫罗为自己行为所作解释中的道德分量。
- source_word: הָעָם
  choice: 百姓
  rationale: 原词通常指“人民、百姓”；本处虽主要涉及随军人员，但原文未限定为军队，故不作窄化。
- source_word: וָאֶשְׁמַע בְּקוֹלָם
  choice: 听从了他们
  rationale: 该希伯来习语字面为“听了他们的声音”，语境含义是顺从他们；正文以自然汉语表达其实际意义，脚注保留字面措辞及其与“听从雅威之声”主题的呼应。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。音译“雅威”保留其专名性质，不以“主”这一称号替换，也不借译法加入宗派性解释。
- issue: 习语 פִּי יְהוָה 的处理
  choice: 雅威的命令
  alternative: 雅威的口；雅威的话
  rationale: “雅威的口”是原文形象，但在现代汉语正文中容易令人费解；本段明确涉及被违反的神圣指示，故译为“命令”，并以脚注保存字面形式。
- issue: 扫罗的话是认罪还是推诿
  choice: 同时保留认罪与以惧怕百姓作解释的张力
  alternative: 把后半句明确解释成悔改或推卸责任
  rationale: 原文先直接说“我犯了罪”，随后两次使用 כִּי 说明违背及其缘由。译文不额外评断扫罗认罪是否真诚，也不消除其承认责任与解释行为之间的张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“因为……；因为……”保留原文两个 כִּי 的重复和解释关系；分号帮助现代读者辨明层次。正文使用“听从了他们”表达希伯来习语的实际含义，避免生硬直译。
