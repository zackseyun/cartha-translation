id: 1SA.15.23
reference: 1 Samuel 15:23
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּ֤י חַטַּאת קֶ֨סֶם֙ מֶ֔רִי וְ/אָ֥וֶן וּ/תְרָפִ֖ים הַפְצַ֑ר יַ֗עַן מָאַ֨סְתָּ֙ אֶת דְּבַ֣ר יְהוָ֔ה וַ/יִּמְאָסְ/ךָ֖ מִ/מֶּֽלֶךְ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/023.yaml
  text: For rebellion is like the sin of divination[a], and stubbornness is like wickedness and household idols. Because you have rejected the word of Yahweh[c][b], he has also rejected you from being king.
translation:
  language: zh_hans
  text: 因为悖逆如同占卜的罪[a]，顽梗如同罪孽和家中的偶像[b]。你既厌弃雅威的话，他也厌弃你，不让你作王[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “占卜”也可译作“巫术”。希伯来语 קֶסֶם 泛指用被禁止的手段求问隐秘之事。
    reason: lexical_alternative
  - marker: b
    text: “家中的偶像”译自希伯来语 תְּרָפִים，指家庭祭祀所用的神像或偶像。
    reason: lexical_alternative
  - marker: c
    text: 或译：“他也厌弃你作王。”
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 引出撒母耳对上一节责备的解释；后半句的 יַעַן 则用“既”表达更具体的因果关系，避免连续两个“因为”造成拗口。
- source_word: חַטַּאת קֶסֶם
  choice: 占卜的罪
  rationale: 该结构最自然地指借禁忌手段求问隐秘之事的“占卜之罪”；“占卜”比“巫术”范围更准确，也更少时代错置。
- source_word: מֶרִי
  choice: 悖逆
  rationale: 指公然抗拒权威，在本节特指扫罗拒不遵行雅威的命令；“悖逆”简洁、庄重，并保留强烈的伦理意味。
- source_word: וְאָוֶן
  choice: 罪孽
  rationale: 此处与家神并列，语境强调道德邪恶，而非该词也可能表达的灾祸、虚妄等义；“罪孽”与上下文相称。
- source_word: וּתְרָפִים
  choice: 家神
  rationale: תְּרָפִים 指家庭祭祀所用的神像或偶像；“家神”简明地表达其家庭崇拜背景，脚注补充其性质。
- source_word: הַפְצַר
  choice: 顽梗
  rationale: 该词表达固执坚持、傲慢不肯让步；“顽梗”在现代中文中仍清楚，并能承接扫罗拒绝顺服的语境。
- source_word: יַעַן
  choice: 既
  rationale: 标明扫罗厌弃雅威之言是所受判决的原因；“既……也……”自然地呈现原文前后呼应的因果与对称。
- source_word: מָאַסְתָּ אֶת דְּבַר יְהוָה
  choice: 你既厌弃雅威的话
  rationale: מָאַס 表示拒绝、弃绝或厌弃；选“厌弃”既有主动拒斥的力度，也便于在下句重复同一动词，保存原文修辞。
- source_word: יְהוָה
  choice: 雅威
  rationale: 采用神名四字母的常见现代汉语音译，不以称号替代专名。
- source_word: וַיִּמְאָסְךָ מִמֶּלֶךְ
  choice: 他也厌弃你，不让你作王
  rationale: 重复“厌弃”以保存 מָאַס 的修辞呼应；“不让你作王”明确表达介词 מִן 所含的剥夺王位或排除于王权之外之意。
theological_decisions:
- issue: 上半节两个分句的比较结构
  choice: “悖逆如同占卜的罪，顽梗如同罪孽和家神”
  alternative: “悖逆就是占卜的罪，顽梗就是罪孽和家神”
  rationale: 希伯来文没有明写“如同”，但平行结构可表达等同比较。译作“如同”既自然，也保留撒母耳将悖逆与禁忌占卜、将顽梗与偶像之恶并论的强烈判断，而不把修辞性比较过度处理为严格定义。
- issue: 对扫罗王位判决的表达
  choice: “他也厌弃你，不让你作王”
  alternative: “他也厌弃你作王”
  rationale: מִמֶּלֶךְ 可理解为从王位上弃绝或弃绝其作王资格。正文较明确地表达剥夺王权的结果，脚注保留更紧缩、具有一定歧义的译法，不进一步断定判决实现的具体时间。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“悖逆”“顽梗”“罪孽”保留先知责备的力度；句式以两个平行比较句开篇，再用“既……也……”呈现原文 מָאַס 的重复和因果对称。所有脚注标记均在正文中对应出现。
