base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/015.yaml
  text: And there was trembling in the camp[a], in the field, and among all the people; the garrison and the raiding party also trembled. And the earth quaked, so that it became a trembling from God.
translation:
  language: zh_hans
  text: 营中、田野和众人中间都起了恐慌；驻军和突袭队也都惊慌。大地震动，于是成了从上帝而来的恐慌。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“极大的恐慌”或“神所降的恐惧”。希伯来语既可表示这恐慌来自上帝，也可强调其程度极大。
    reason: alternative_reading
lexical_decisions:
- source_word: חֲרָדָה / חרד
  choice: 恐慌／惊慌
  rationale: 该词族表示因恐惧而战栗、惊惶。中文用“恐慌／惊慌”自然表达群体受到惊吓的状态，并尽量保留本节的词根复现。
- source_word: בַמַּחֲנֶה בַשָּׂדֶה וּבְכָל הָעָם
  choice: 营中、田野和众人中间
  rationale: 依次保留三个地点或范围；“众人”不把 עָם 过度限定为军队，军事语境仍清楚。
- source_word: הַמַּצָּב
  choice: 驻军
  rationale: 此处指驻守在军事据点的部队；“驻军”在现代汉语中简明自然。
- source_word: הַמַּשְׁחִית
  choice: 突袭队
  rationale: 该使役分词在军事叙事中可作集合称谓，指执行破坏、劫掠任务的队伍；“突袭队”比直译“毁灭者”更符合语境，同时不具体断定其人数。
- source_word: וַתִּרְגַּז הָאָרֶץ
  choice: 大地震动
  rationale: רגז 在此描述地面震颤；“大地震动”既自然又保留从人的恐慌升级到地动的画面。
- source_word: לְחֶרְדַּת אֱלֹהִים
  choice: 从上帝而来的大恐慌
  rationale: 主文采用来源属格，明确保留“从上帝而来”的神学力度；加入“大”使结果短语在中文中自然，并与另一种强度性理解保持接触，歧义则在脚注交代。
theological_decisions:
- issue: לְחֶרְדַּת אֱלֹהִים 中 אֱלֹהִים 的功能
  choice: 从上帝而来的大恐慌
  alternative: 极大的恐慌；神所降的恐惧
  rationale: 希伯来语既可表示恐慌源于上帝，也可能是以“上帝”表达极高程度的惯用结构。主文采用来源义，脚注保留强度义，不把原文的神学张力静默消除。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“恐慌／惊慌”避免生硬重复，同时呼应原文 חרד 词族；脚注标记置于相关歧义短语之后。
