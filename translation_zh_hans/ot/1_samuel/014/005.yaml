base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/005.yaml
  text: One crag stood on the north[a], opposite Michmash, and the other on the south[b], opposite Geba.
translation:
  language: zh_hans
  text: 一个尖岩[a]耸立在北边，正对密抹；另一个在南边，正对迦巴[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “尖岩”原文直译为“牙齿”，在这里比喻像牙齿般突出的岩石。
    reason: lexical_alternative
  - marker: b
    text: 有些译本在这里作“基比亚”，但希伯来文的地名是“迦巴”。
    reason: alternative_reading
lexical_decisions:
- source_word: הַשֵּׁן
  choice: 尖岩
  rationale: 本义为“牙齿”，在这里比喻像牙齿般突出的尖锐岩石。“尖岩”既自然地表达地貌，也保留了原文的形象，具体字面义见脚注。
- source_word: הָאֶחָד / וְהָאֶחָד
  choice: 一个……另一个
  rationale: 重复的“一个”用于分别指两处岩石；现代汉语用“一个……另一个”表达最自然。
- source_word: מָצוּק
  choice: 耸立
  rationale: 此词在这里描述尖岩陡峭、突出的状态或位置；“耸立”符合地形语境，同时避免采用生硬且不确定的字面表达。
- source_word: מִצָּפוֹן / מִנֶּגֶב
  choice: 在北边 / 在南边
  rationale: 两个介词短语彼此平行，标明两处尖岩分处隘口的北侧和南侧。
- source_word: מוּל
  choice: 正对
  rationale: 表示空间上面对或相对的位置；“正对”简洁清楚。
- source_word: מִכְמָשׂ
  choice: 密抹
  rationale: 采用该地名通行的现代中文圣经译名。
- source_word: גָּבַע
  choice: 迦巴
  rationale: 希伯来文本所用地名是“迦巴”，应与“基比亚”区别；这一区分关系到叙事中的地理位置。
theological_decisions: []
