base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/041.yaml
  text: Then Saul said to Yahweh[a], the God of Israel, “Give a perfect lot.” And Jonathan and Saul were taken, but the people escaped.
translation:
  language: zh_hans
  text: 扫罗对耶和华——以色列的上帝——说：“求你给出无可指摘的签。”[a]于是约拿单和扫罗被抽中，百姓却脱了身。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“求你给出纯全（或：无可指摘）”。这里很可能是求上帝借掣签作出无可指摘的判定。七十士译本保存了一个较长的古代读法：“你今日为什么没有回答你的仆人呢？如果这罪责在我或我儿子约拿单身上，耶和华以色列的上帝啊，求你赐乌陵；如果这罪责在你的百姓以色列身上，求你赐土明。”
    reason: textual_variant
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 在现代简体中文圣经语境中，以“耶和华”音译四字神名，保留其作为以色列之上帝专名的功能，而不以“主”这一称号代替。
- source_word: הָבָה
  choice: 求你给出
  rationale: 这是向上帝发出的祈求；“求你”体现语用上的请求语气，“给出”则直接对应原文命令式。
- source_word: תָמִים
  choice: 无可指摘的签
  rationale: תָמִים本义可指完整、纯全或无可指摘；结合本段掣签判定罪责的语境，正文补出隐含的“签”，并用“无可指摘”保留其对可靠、公正结果的要求。
- source_word: וַיִּלָּכֵד
  choice: 被抽中
  rationale: לכד在掣签或司法辨认的语境中可表示被选出、被认定；“被抽中”自然呈现其被动意义和本段的掣签背景。
- source_word: יָצָאוּ
  choice: 脱了身
  rationale: 字面为“出去”；与“被抽中”相对，此处指百姓未被签选中。“脱了身”传达语境意义，同时避免把他们判为无罪这一更强的解释直接写入正文。
theological_decisions:
- issue: 扫罗祷告的文本形态
  choice: 正文依照马所拉文本，保留简短而艰涩的“求你给出无可指摘的签”。
  alternative: 采用七十士译本保存的较长读法，明确提到没有得到回答，并分别求“乌陵”和“土明”。
  rationale: 指定的希伯来语底本是WLC，其正文较短。较长读法古老且有助于解释这句难文，但不宜未经说明取代希伯来正文，因此列入脚注。
- issue: תָמִים在此处的具体所指
  choice: 理解为对一次无可指摘、可靠之掣签判定的请求，并在正文补出“签”。
  alternative: 直译为“求你赐下纯全”或解释为“显明真相”。
  rationale: 原文极其简略，单独使用形容词。上下文随即叙述谁被抽中，支持掣签之意；但其确切措辞仍有不确定性，故脚注说明字面意义与古代异文。
translation_notes:
  register: 采用庄重而易懂的现代标准普通话。“无可指摘的签”保留原文תָמִים的伦理—司法色彩及掣签语境；“被抽中／脱了身”形成清楚对照。脚注标记[a]已置于正文对应难句之后。
