source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר שָׁא֣וּל פֻּ֣צוּ בָ/עָ֡ם וַ/אֲמַרְתֶּ֣ם לָ/הֶ֡ם הַגִּ֣ישׁוּ אֵלַ/י֩ אִ֨ישׁ שׁוֹר֜/וֹ וְ/אִ֣ישׁ שְׂיֵ֗/הוּ וּ/שְׁחַטְתֶּ֤ם בָּ/זֶה֙ וַ/אֲכַלְתֶּ֔ם וְ/לֹֽא תֶחֶטְא֥וּ לַֽ/יהוָ֖ה לֶ/אֱכֹ֣ל אֶל הַ/דָּ֑ם וַ/יַּגִּ֨שׁוּ כָל הָ/עָ֜ם אִ֣ישׁ שׁוֹר֧/וֹ בְ/יָד֛/וֹ הַ/לַּ֖יְלָה וַ/יִּשְׁחֲטוּ שָֽׁם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/034.yaml
  text: And Saul said[a], “Spread out among the people and tell them, ‘Each man must bring me his ox and each man his sheep, and you must slaughter them here and eat, so that you may not sin against Yahweh by eating with the blood.’” So all the people brought, each man his ox in his hand that night[b], and they slaughtered them there.
translation:
  language: zh_hans
  text: 扫罗说：“你们分散到百姓中间，告诉他们：‘各人要把自己的牛和羊牵到我这里，在这里宰杀了再吃，免得因带着血吃而得罪雅威。’于是，那天夜里，众百姓各自亲手牵来自己的牛[a]，在那里宰杀。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“各人把自己的牛放在手中带来”，意思可能是“各人亲手牵来自己的牛”。
    reason: lexical_alternative
lexical_decisions:
- source_word: פֻּצוּ בָעָם
  choice: 分散到百姓中间
  rationale: פוץ的命令式有分散、散开的具体含义；此处是吩咐多人到百姓各处传话。
- source_word: הַגִּישׁוּ אֵלַי
  choice: 牵到我这里
  rationale: נגשׁ使役式意为带近、呈到面前；对象是牲畜，中文用“牵到”自然且符合场景。
- source_word: אִישׁ שׁוֹרוֹ וְאִישׁ שְׂיֵהוּ
  choice: 各人要把自己的牛和羊
  rationale: 重复的אִישׁ具有逐一分配的作用。“羊”在此自然概括שֶׂה；该词本身也可指绵羊或山羊等小牲畜。
- source_word: וּשְׁחַטְתֶּם בָּזֶה וַאֲכַלְתֶּם
  choice: 在这里宰杀了再吃
  rationale: שׁחט特指宰杀牲畜；“再”清楚表达先宰杀放血、后食用的顺序。בָּזֶה按地点理解为“在这里”。
- source_word: וְלֹא תֶחֶטְאוּ לַיהוָה
  choice: 免得……得罪雅威
  rationale: 表达命令的预防目的；לַיהוָה在伦理关系上译作“得罪雅威”。
- source_word: לֶאֱכֹל אֶל־הַדָּם
  choice: 因带着血吃
  rationale: 保留原文“与血/带着血吃”的表达张力，不直接扩写为解释性的“血尚未放净就吃”。
- source_word: אִישׁ שׁוֹרוֹ בְיָדוֹ הַלַּיְלָה
  choice: 那天夜里，众百姓各自亲手牵来自己的牛
  rationale: בְיָדוֹ直译为“在他手中”，用于牲畜时自然理解为亲手牵来；“那天夜里”表达הַלַּיְלָה的叙事时间。
- source_word: וַיִּשְׁחֲטוּ שָׁם
  choice: 在那里宰杀
  rationale: 宾语由上文的牛羊自然补足，中文无需重复；“宰杀”准确传达שׁחט。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”按其通常学术拟音保留专名性质，不以称号代替。
- issue: “吃血”之罪的具体含义
  choice: 保留“带着血吃”的原文措辞
  alternative: 吃血尚未放净的肉
  rationale: 上下文很可能指牲畜未妥善放血便食用，但译文不把解释完全写入正文，以保留אֶל־הַדָּם的语言张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语；以“百姓”“宰杀”“得罪”等常用圣经语汇维持经文体，同时避免生硬逐字直译。正文仅在确有歧义处设置脚注，且脚注标记已在正文出现。
