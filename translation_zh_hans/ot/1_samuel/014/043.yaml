base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/043.yaml
  text: Then Saul said to Jonathan[a], “Tell me what you have done.” And Jonathan told him and said, “I indeed tasted a little honey on the tip of the staff that was in my hand, and here I am, about to die.”
translation:
  language: zh_hans
  text: 扫罗对约拿单说：“告诉我，你做了什么。”约拿单就告诉他，说：“我确实尝了手中杖尖上的一点蜜。看，我就要死了。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我确实尝了手中杖尖上的一点蜜，难道我现在就得死吗？”希伯来语强调“尝”这一动作；末句既可理解为认命的陈述，也可理解为带抗议意味的反问。
    reason: 保存“尝”的强调结构，以及末句陈述／反问的歧义。
lexical_decisions:
- source_word: הַגִּידָה לִּי
  choice: 告诉我
  rationale: 这是נגד的祈使式加第一人称间接受词；“告诉我”自然直接，符合扫罗质问的语气。
- source_word: מֶה עָשִׂיתָה
  choice: 你做了什么
  rationale: 直译完成的行为，并保留该行为在当前审判情境中的后果。
- source_word: וַיַּגֶּד לוֹ
  choice: 就告诉他
  rationale: 与前面的“告诉我”保持词汇呼应，同时符合现代汉语叙事表达。
- source_word: טָעֹם טָעַמְתִּי
  choice: 我确实……尝了
  rationale: 不定式绝对形与限定动词连用，强调或确认“尝”这一行为；“确实”比“只”更直接保存希伯来语的形式功能，而“一点”已由后文מְעַט表达。
- source_word: בִּקְצֵה הַמַּטֶּה
  choice: 用……杖的尖端
  rationale: קצה指末端；介词ב在此按工具意义译为“用”，与上文约拿单以杖蘸蜜的动作相符。
- source_word: הַמַּטֶּה אֲשֶׁר בְּיָדִי
  choice: 手中杖的
  rationale: 以紧凑自然的汉语表达“在我手中的杖”，不损失所属与场景信息。
- source_word: מְעַט דְּבַשׁ
  choice: 一点蜜
  rationale: 准确表达少量蜂蜜；叙事中用“蜜”简洁而庄重。
- source_word: הִנְנִי
  choice: 看，我
  rationale: 保留指示、引人注意和当下性的语用力量；“看”比机械的“看哪”更符合现代标准汉语。
- source_word: אָמֽוּת
  choice: 就要死了
  rationale: 未完成式在誓言及判决背景下可表示临近的结果；此译保留约拿单面对死亡的迫近感，同时不把语气限定为义务性的“必须”。
theological_decisions:
- issue: 末句是认命陈述还是反问抗议
  choice: 正文作陈述：“看，我就要死了。”
  alternative: “看，难道我就得死吗？”
  rationale: 无标记的希伯来语形式可自然读作迫近死亡的陈述，但语境也容许带抗议意味的反问；正文不强加问号，脚注保存另一种真实可能。
translation_notes:
  register: 采用现代、清楚而庄重的叙事语体。“约拿单就告诉他，说”略带希伯来叙事的重复感，保留原文中נגד的词汇呼应；脚注标记置于整节末句之后。
