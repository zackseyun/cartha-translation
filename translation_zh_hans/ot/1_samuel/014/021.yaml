  text: וְ/הָ/עִבְרִ֗ים הָי֤וּ לַ/פְּלִשְׁתִּים֙ כְּ/אֶתְמ֣וֹל שִׁלְשׁ֔וֹם אֲשֶׁ֨ר עָל֥וּ עִמָּ֛/ם בַּֽ/מַּחֲנֶ֖ה סָבִ֑יב וְ/גַם הֵ֗מָּה לִֽ/הְיוֹת֙ עִם יִשְׂרָאֵ֔ל אֲשֶׁ֥ר עִם שָׁא֖וּל וְ/יוֹנָתָֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/021.yaml
  text: The Hebrews who had previously been with the Philistines[a], who had gone up with them into the camp all around—even they also came to be with Israel[c][b], who were with Saul and Jonathan.
translation:
  language: zh_hans
  text: 先前与非利士人在一起的希伯来人[a]，就是那些随他们上到周围一带的营地中的人[b]，也转而与同扫罗和约拿单在一起的以色列人同在[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “先前”原文直译近于“像昨天、前天”，是表示“从前、以往”的习语。
    reason: lexical_alternative
  - marker: b
    text: “上到周围一带的营地中”所对应的希伯来语句法和空间关系较难确定；可能指这些希伯来人随非利士人进入营地，或指营地周围一带。
    reason: lexical_alternative
  - marker: c
    text: “转而与……同在”原文直译是“与以色列同在”；上下文暗示他们改变了所归属的阵营。
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָעִבְרִים
  choice: 希伯来人
  rationale: 保留原文的族群称呼“希伯来人”，不改作“以色列人”，因为本节后半另用“以色列”，两者在叙述中不宜混同。句首连接词按现代汉语叙事自然承接，不机械译为“而”。
- source_word: הָיוּ לַפְּלִשְׁתִּים
  choice: 归在非利士人一边
  rationale: 该结构直译近于“属于／归于非利士人”，语境所指更可能是随从或阵营关系；“归在……一边”既表达关联，也避免断言他们受非利士人所有。
- source_word: כְּאֶתְמוֹל שִׁלְשׁוֹם
  choice: 先前
  rationale: 原文是“如昨天、前天”一类表示往昔的习语；译作“先前”符合现代汉语，并保留与随后阵营变化的时间对照。
- source_word: אֲשֶׁר עָלוּ עִמָּם
  choice: 就是那些随他们上到……的人
  rationale: 保留עלה的上行意味和“随他们”的伴随关系；“他们”按紧邻语境指非利士人。
- source_word: בַּמַּחֲנֶה סָבִיב
  choice: 四围营地中
  rationale: 原短语句法和空间关系不够明确。“四围营地中”保留“营地”与“四围”两个要素，不在正文中强行断定是营地环绕某处，还是这些人散处营中四周。
- source_word: וְגַם הֵמָּה
  choice: 也
  rationale: “也”表达这些希伯来人同样加入以色列一方的强调包含关系；汉语不必叠用“甚至他们也”才可传达此意。
- source_word: לִהְיוֹת עִם יִשְׂרָאֵל
  choice: 转而与……以色列人同在
  rationale: 原文形式上是“与以色列同在／在一起”，上下文暗示阵营发生变化。“转而”使汉语句子完整并呈现这一语境含义，但脚注说明较贴近字面的译法。
- source_word: אֲשֶׁר עִם שָׁאוּל וְיוֹנָתָן
  choice: 跟随扫罗和约拿单的
  rationale: 关系从句修饰集合意义的“以色列”；“跟随”在此自然表达与两位领袖同在同一阵营，并不增添门徒意义。
theological_decisions:
- issue: 这些希伯来人与非利士人及以色列人的关系性质
  choice: 采用“归在……一边”“转而与……同在”等阵营性措辞
  alternative: 译为“属于非利士人”“背叛非利士人并投奔以色列人”
  rationale: 原文显示他们先与非利士人有关联，继而与扫罗、约拿单一方的以色列同在，却没有明确界定先前是被迫服役、自愿归附还是正式隶属，也没有使用明确表示“背叛”或“逃亡”的动词，因此不作过度判断。
translation_notes:
  register: 采用现代、庄重而清楚的叙事汉语。“希伯来人”与“以色列人”按原文分别保留；对难解的空间短语和阵营转变只作最低限度的正文顺译，并以脚注交代字面形式与不确定性。
