  rationale: 修订消除两处无必要的解释性强化：“归在……一边”改为较中性的“与……在一起”，“跟随”改为“同……在一起”；同时将不自然的“上到四围营地中”改为可读的现代汉语，并保留脚注对原文空间短语的歧义说明。删去“这时”，使译文不加入原文未明说的时间指示。
