  text: וַ/יֹּ֣אמֶר שָׁא֔וּל כֹּֽה יַעֲשֶׂ֥ה אֱלֹהִ֖ים וְ/כֹ֣ה יוֹסִ֑ף כִּֽי מ֥וֹת תָּמ֖וּת יוֹנָתָֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/044.yaml
  text: And Saul said[a], “May God do so and more also, for you shall surely die, Jonathan.”
translation:
  language: zh_hans
  text: 扫罗说[a]：“愿上帝如此行，并且再加添；因为你必死无疑，约拿单。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这是希伯来语的起誓公式，直译为“愿上帝这样做，并且这样加添”。原文没有说明上帝将采取什么行动，也没有明说该行动会临到谁身上。
    reason: 说明固定誓言公式，并保留原文对所咒誓行动及其对象的省略。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 未机械译出连接词וַ；现代汉语叙事中直接用“说”即可自然承接上文，不额外限定为时间先后。
- source_word: שָׁאוּל
  choice: 扫罗
  rationale: 采用现代简体中文圣经人名的通行音译。
- source_word: כֹּה יַעֲשֶׂה אֱלֹהִים וְכֹה יוֹסִף
  choice: 愿上帝这样做，并且加倍惩罚
  rationale: 这是固定的起誓兼自咒用语。“这样做”保留原文未明说受罚对象和具体行动的含蓄；“加倍惩罚”以自然中文表达יוֹסִף的递加强调和咒誓意味，但不补入“对我”。
- source_word: אֱלֹהִים
  choice: 上帝
  rationale: 此处指扫罗起誓时所诉诸的神；用单数称谓“上帝”符合语境及现代标准汉语。
- source_word: כִּי
  choice: （不单独译出）
  rationale: 此处引出誓言所断定的内容或根据。中文以标点和后句直接承接更自然，也不削弱断言力度。
- source_word: מוֹת תָּמוּת
  choice: 必死无疑
  rationale: 以“必……无疑”表达不定式绝对形与限定动词同根连用所产生的强烈确定语气。
- source_word: יוֹנָתָן
  choice: 约拿单
  rationale: 采用现代简体中文圣经人名的通行音译，并作为呼语置于死亡宣告之前，符合自然汉语。
theological_decisions:
- issue: 起誓公式是否补出自咒对象
  choice: 不补入“对我”，译作“愿上帝这样做，并且加倍惩罚”
  alternative: 愿上帝这样惩罚我，并且加倍惩罚我
  rationale: 希伯来文本没有明说受罚对象；虽然惯用公式通常含有自咒意味，正文仍保留原文的省略，避免把语用上的理解写成明说的内容。
- issue: 是否把扫罗的宣告弱化为普通预测
  choice: “你必死无疑”
  alternative: “你一定会死”
  rationale: 原文מוֹת תָּמוּת具有强调和司法宣判般的确定性；“必死无疑”既保留强度，也不对扫罗誓言的正当性作神学判断。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“愿……”“必死无疑”保留誓言和宣判的强烈语气；脚注解释较陌生的希伯来起誓公式。
