  yaml_path: translation/ot/1_samuel/014/031.yaml
  text: That day they struck down the Philistines from Mikmash to Aijalon[a], and the people were very weary.
translation:
  language: zh_hans
  text: 那一天，他们从密抹直到亚雅仑击杀非利士人；百姓极其疲惫。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּכּוּ
  choice: 他们……击杀
  rationale: 动词נכה在叙事中表示已经发生的军事打击；“击杀”保留其战斗语境，又不像“彻底击败”那样增添原文没有明说的结果。
- source_word: בַּיּוֹם הַהוּא
  choice: 那一天
  rationale: 自然、准确地表达希伯来语常见的时间短语。
- source_word: בַּפְּלִשְׁתִּים
  choice: 非利士人
  rationale: 介词ב在此标示攻击的对象；采用现代中文圣经读者熟悉的族名。
- source_word: מִמִּכְמָשׂ אַיָּלֹנָה
  choice: 从密抹一路……直到亚雅仑
  rationale: מִן表示起点，אַיָּלֹנָה的方向词尾表示朝亚雅仑而去；“从……一路……直到……”自然呈现战斗推进的地理范围。
- source_word: וַיָּעַף
  choice: 疲惫
  rationale: 该词表示困乏、疲倦；“疲惫”准确而不过分强化为完全力竭。
- source_word: הָעָם
  choice: 百姓都
  rationale: הָעָם是集合单数，指民众整体；中文用“百姓都”自然表达其集合意义。
- source_word: מְאֹד
  choice: 极其
  rationale: 保留原文程度副词的强烈语气，搭配“疲惫”自然庄重。
