base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/016.yaml
  text: And Saul’s watchmen in Gibeah of Benjamin looked[a], and behold, the multitude was melting away, and it went here and there.
translation:
  language: zh_hans
  text: 扫罗的瞭望兵在便雅悯的基比亚望去，只见那一大群人正在溃散，四下移动。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本句希伯来文措辞简短，也可较直译为“那一大群人正在融化，并且来来去去”。“融化”是形容其失去凝聚、瓦解的意象；末尾的方向性短语简略，描绘混乱中的移动。
    reason: 保留נָמוֹג的“融化”意象，并提示末尾方向性短语的简略性及其解释空间。
lexical_decisions:
- source_word: הַצֹּפִים לְשָׁאוּל
  choice: 扫罗设……的瞭望兵
  rationale: צֹפִים指被安排观察敌情的人；לְשָׁאוּל表示这些人隶属或关联于扫罗。译作“扫罗设……的瞭望兵”符合军事语境，也比单纯所有格更自然。
- source_word: בְּגִבְעַת בִּנְיָמִן
  choice: 在便雅悯的基比亚
  rationale: 按地名关系直译，说明瞭望兵所在之处。
- source_word: וְהִנֵּה
  choice: 只见
  rationale: הִנֵּה用于引导突然映入眼帘的景象；“只见”在现代汉语叙事中简洁而传神。
- source_word: הֶהָמוֹן
  choice: 那一大群人
  rationale: הָמוֹן可指众人、喧闹的人群或大队；此处用集体称谓，不直接补出“非利士军队”，以免把上下文推断写进正文。
- source_word: נָמוֹג
  choice: 正在溃散
  rationale: מוג本义涉及融化，转义可表示失去力量或凝聚力；军事语境中的“溃散”自然呈现其可见的瓦解状态。
- source_word: וַיֵּלֶךְ וַהֲלֹם
  choice: 四处奔走
  rationale: 原文措辞极简，描写集体向不同方向移动。“四处奔走”在现代汉语中清楚表现混乱动态，同时不额外说明其原因。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“瞭望兵”保留军事职能；“只见”传达突见景象的现场感。正文流畅表达可见的混乱，脚注则保留希伯来文的具体隐喻和简短句法。
