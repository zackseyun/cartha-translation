base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/019.yaml
  text: And it happened[a], while Saul was speaking to the priest, that the tumult in the camp of the Philistines kept increasing more and more. So Saul said to the priest, “Withdraw your hand.”
translation:
  language: zh_hans
  text: 扫罗正在对祭司说话时，非利士人营中的骚动越来越大。于是扫罗对祭司说：“收回你的手[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译为“收拢你的手”，意思是叫祭司停止正在进行的动作。
    reason: 说明希伯来语的具体表达及其语境含义，避免正文直接改写成较宽泛的“停下”。
lexical_decisions:
- source_word: וַיְהִי עַד דִּבֶּר
  choice: 正……说话的时候
  rationale: 将叙事推进词与表示同时进行的结构合并为自然的现代汉语，表达扫罗尚在说话、事态便继续发展的场景。
- source_word: הַכֹּהֵן
  choice: 祭司
  rationale: 对应明确指称的祭司；汉语在上下文已知时通常无需另加“那位”。
- source_word: הֶהָמוֹן
  choice: 骚乱
  rationale: 此词在这里不仅指响声，也指非利士营中混乱喧嚷的局面；“骚乱”兼顾声音与失序。
- source_word: בְּמַחֲנֵה פְלִשְׁתִּים
  choice: 非利士人营中
  rationale: 简洁、自然地保留地点与所属关系。
- source_word: וַיֵּלֶךְ הָלוֹךְ וָרָב
  choice: 越来越大
  rationale: 原文以有限动词配合独立不定式表达持续加剧；现代汉语“越来越大”准确呈现渐进增强。
- source_word: אֱסֹף יָדֶךָ
  choice: 收回你的手
  rationale: 保留原文具体的“手”这一意象，同时让读者从语境看出扫罗命祭司停止正在进行的动作。
theological_decisions: []
