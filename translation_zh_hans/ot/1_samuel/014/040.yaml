base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/040.yaml
  text: Then he said to all Israel[a], “You be on one side, and I and Jonathan my son will be on the other side.” And the people said to Saul, “Do what seems good in your eyes.”
translation:
  language: zh_hans
  text: 于是他对全以色列人说：“你们站在一边，我和我儿子约拿单站在另一边。”百姓对扫罗说：“你看怎么好，就怎么做吧。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְעֵבֶר אֶחָד
  choice: 在一边／在另一边
  rationale: עֵבֶר 指一侧或一方；在此抽签查明罪责的语境中，两次“在一边”形成双方对列。中文以“在一边……在另一边”自然表达这一空间和阵营上的对照。
- source_word: תִּהְיוּ / נִהְיֶה
  choice: 站在
  rationale: היה 本义为“是、处于”，与 לְעֵבֶר אֶחָד 连用时表示各自处在一边。现代汉语若直译为“是在一边”不自然；“站在”贴合现场分列的位置安排，又不额外说明抽签程序。
- source_word: כָּל יִשְׂרָאֵל
  choice: 全以色列人
  rationale: 这是对在场以色列群体的集合称呼；加“人”符合现代汉语习惯，并避免把地名误作说话对象。
- source_word: בְּנִי
  choice: 我儿子
  rationale: 明确保留原文的父子关系，并按自然汉语置于专名“约拿单”之前。
- source_word: הַטּוֹב בְּעֵינֶיךָ עֲשֵׂה
  choice: 你看怎么好，就怎么做吧
  rationale: 原文直义为“你眼中好的，你就做”，表达由扫罗按自己认为妥当的方式行事。此译保留“看”的意象，同时采用自然、庄重而易懂的现代汉语。
- source_word: וַיֹּאמֶר / וַיֹּאמְרוּ
  choice: 于是他……说／百姓……说
  rationale: 首处以“于是”承接叙事进程；次处直接转入百姓回应，避免机械重复连接词。
theological_decisions: []
translation_notes:
  register: 采用现代标准简体中文，句式清楚庄重。两组“站在一边”保持原文的平行对照；末句保留希伯来语“眼中为好”的基本意象，但调整为自然汉语“你看怎么好”。本节不存在必须以脚注保留的实质歧义。
