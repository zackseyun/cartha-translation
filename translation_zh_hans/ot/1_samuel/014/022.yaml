  text: וְ/כֹל֩ אִ֨ישׁ יִשְׂרָאֵ֜ל הַ/מִּֽתְחַבְּאִ֤ים בְּ/הַר אֶפְרַ֨יִם֙ שָֽׁמְע֔וּ כִּֽי נָ֖סוּ פְּלִשְׁתִּ֑ים וַֽ/יַּדְבְּק֥וּ גַם הֵ֛מָּה אַחֲרֵי/הֶ֖ם בַּ/מִּלְחָמָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/022.yaml
  text: And every man of Israel who had hidden themselves in the hill country of Ephraim heard that the Philistines had fled[a], and they too joined the pursuit in the battle.
translation:
  language: zh_hans
  text: 所有藏身在以法莲山区的以色列人，听说非利士人逃跑了，也都在战斗中紧追他们[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“在战斗中紧紧跟在他们后面”，这是表示紧追逃跑之敌的说法。
    reason: 说明 דבק אַחֲרֵי 在军事语境中的字面表达和惯用含义。
lexical_decisions:
- source_word: וְכֹל אִישׁ יִשְׂרָאֵל
  choice: 所有……的以色列人
  rationale: כֹל אִישׁ 是具有整体分配意味的表达；结合后面的复数分词和复数动词，译为“所有……的以色列人”既自然，也保留全体参与的含义。
- source_word: הַמִּתְחַבְּאִים
  choice: 藏身
  rationale: 分词表示这些人当时处于躲藏的状态；“藏身”简洁自然，并可由叙事语境体现其先于“听说”的时间关系。
- source_word: בְּהַר אֶפְרַיִם
  choice: 在以法莲山区
  rationale: הַר 在这里指以法莲的高地地区，而不是某一座单独的山峰；“山区”符合现代汉语地理表达。
- source_word: שָׁמְעוּ כִּי נָסוּ פְּלִשְׁתִּים
  choice: 听说非利士人逃跑了
  rationale: נָסוּ 表示非利士人已经转身逃走；“逃跑了”清楚表达他们所听到的消息及动作的完成性。
- source_word: וַיַּדְבְּקוּ גַם הֵמָּה אַחֲרֵיהֶם
  choice: 也都……紧追他们
  rationale: דבק 与 אַחֲרֵי 连用，在军事语境中表示紧随、穷追；“紧追他们”直接保留动作及其宾语，同时“也”体现这些先前藏身者如今与其他人一同行动。
- source_word: בַּמִּלְחָמָה
  choice: 在战斗中
  rationale: 这里指正在进行的具体交战，而非整场战争；“在战斗中”准确而自然。
theological_decisions: []
