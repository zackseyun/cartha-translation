  text: וַ/יַּגִּ֤ידוּ לְ/שָׁאוּל֙ לֵ/אמֹ֔ר הִנֵּ֥ה הָ/עָ֛ם חֹטִ֥אים לַֽ/יהוָ֖ה לֶ/אֱכֹ֣ל עַל הַ/דָּ֑ם וַ/יֹּ֣אמֶר בְּגַדְתֶּ֔ם גֹּֽלּוּ אֵלַ֥/י הַ/יּ֖וֹם אֶ֥בֶן גְּדוֹלָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/033.yaml
  text: Then they told Saul[a], saying, “Look, the people are sinning against Yahweh by eating over the blood.” And he said, “You have acted treacherously. Roll a large stone to me today.”
translation:
  language: zh_hans
  text: 有人告诉扫罗说：“看哪，百姓吃带血的肉[a]，得罪了耶和华。”扫罗说：“你们行事诡诈了！今天把一块大石头滚到我这里来。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “吃带血的肉”原文直译为“在血上吃”，指肉里的血尚未妥善放尽就食用。
    reason: 说明希伯来语习语的字面形式及其在上下文中的含义。
lexical_decisions:
- source_word: וַיַּגִּידוּ לְשָׁאוּל לֵאמֹר
  choice: 有人告诉扫罗说
  rationale: 原文动词为复数，但主语未明说；用“有人”自然表达不定施事者，并保留“说”所体现的引语结构。
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留引人注意、带有紧迫感的语气，同时符合庄重的现代汉语叙事风格。
- source_word: הָעָם
  choice: 百姓
  rationale: 该集合名词在上下文中指扫罗所率领的众人；“百姓”既贴近传统经文语域，也容易理解。
- source_word: חֹטִאים לַיהוָה
  choice: 得罪了耶和华
  rationale: חטא 与 ל 连用表示对耶和华犯罪；“得罪了”在汉语中自然表达针对某位对象所犯的罪。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文圣经读者最熟悉的神名音译，明确保留专名性质，而不译作称号“主”。
- source_word: לֶאֱכֹל עַל הַדָּם
  choice: 吃带血的肉
  rationale: 希伯来语直译近似“在血上吃”，在本段语境中指肉中的血尚未妥善放尽便食用；正文以自然汉语明示其含义，脚注保留原文意象。
- source_word: בְּגַדְתֶּם
  choice: 你们行事不忠
  rationale: בגד 表示背信、不忠或行事诡诈；“行事不忠”保留其关系性和道德严重性，避免泛化为单纯“犯错”。
- source_word: גֹּלּוּ אֵלַי
  choice: 滚……到我这里来
  rationale: גֹּלּוּ 是复数命令式，字面为“滚动”；所滚的是大石头，因此按具体动作直译。
- source_word: הַיּוֹם
  choice: 今天
  rationale: 按其通常时间意义直译，不擅自改成“立刻”；语境中的急迫感可由命令语气体现。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用四字神名，应以专名呈现。中文正文采用读者广泛熟悉的“耶和华”；“雅威”虽更接近学界常见的拟音，但尚未成为普通中文读者最通行的形式。
- issue: 百姓所犯之罪的性质
  choice: 吃带血的肉，得罪了耶和华
  alternative: 在血上吃，得罪了耶和华
  rationale: 此处关涉不可食血的禁令。译文明确实际行为，但不进一步添加经文未明说的祭仪解释；脚注注明原文字面表达，以保留其意象和可能的语义张力。
- issue: בגד 的关系性含义
  choice: 行事不忠
  alternative: 背信弃义／犯罪了
  rationale: 选词保留该词常有的背信、不忠色彩，又不把扫罗责备的对象或神学含义解释得超过原文。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“看哪”略带经文语体，用来保留 הִנֵּה 的提示力度；其余句式尽量避免古奥表达。脚注标记[a]紧接“告诉扫罗”之后，以符合所给资料的标记位置，同时脚注内容实际说明后文“吃带血的肉”这一短语。
