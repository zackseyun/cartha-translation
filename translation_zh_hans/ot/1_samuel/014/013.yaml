  text: וַ/יַּ֣עַל יוֹנָתָ֗ן עַל יָדָי/ו֙ וְ/עַל רַגְלָ֔י/ו וְ/נֹשֵׂ֥א כֵלָ֖י/ו אַחֲרָ֑י/ו וַֽ/יִּפְּלוּ֙ לִ/פְנֵ֣י יוֹנָתָ֔ן וְ/נֹשֵׂ֥א כֵלָ֖י/ו מְמוֹתֵ֥ת אַחֲרָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/013.yaml
  text: Then Jonathan climbed up on his hands and feet[a], with his armor-bearer behind him. They fell before Jonathan, and his armor-bearer killed them after him.
translation:
  language: zh_hans
  text: 约拿单手脚并用地爬上去，为他拿兵器的侍从跟在后面。他们倒在约拿单面前；拿兵器的侍从在约拿单后面不断杀死他们。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “不断杀死他们”也可译作“杀死他们”。希伯来语分词在这里可能强调动作持续进行，也可能描写反复发生的动作。
    reason: 保留分词体貌在持续性与反复性之间的语义弹性。
lexical_decisions:
- source_word: וַיַּעַל
  choice: 爬上去
  rationale: 该动词通常意为“上去”，但上下文明确描写约拿单手脚并用地攀上陡坡，因此译作“爬上去”自然且符合具体动作。
- source_word: עַל יָדָיו וְעַל רַגְלָיו
  choice: 手脚并用地
  rationale: 保留“用手、用脚”的鲜明身体姿态，同时采用现代汉语自然表达。
- source_word: נֹשֵׂא כֵלָיו
  choice: 为他拿兵器的侍从
  rationale: 字面为“拿他器具／兵器的人”，在军事叙事中指随从战士、携带兵器的侍从；此译既说明职责，也避免使用现代特定军职称谓。
- source_word: אַחֲרָיו
  choice: 跟在后面／在他身后
  rationale: 该词在本节两次出现，主要表达空间位置和跟随次序；按汉语语境分别自然处理，同时保留重复所形成的画面。
- source_word: וַיִּפְּלוּ לִפְנֵי יוֹנָתָן
  choice: 他们倒在约拿单面前
  rationale: “倒在某人面前”可表示在战斗中被击倒或败亡；不进一步断定每个人倒下的具体方式，保留原文的概括性。
- source_word: מְמוֹתֵת
  choice: 不断杀死他们
  rationale: 这是使役词干的分词形式，描写拿兵器者在约拿单身后持续或反复杀敌；“不断杀死”传达进行中的动作，但以脚注保留较简单的表达可能。
theological_decisions: []
