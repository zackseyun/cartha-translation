base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/050.yaml
  text: The name of Saul’s wife was Ahinoam daughter of Ahimaaz[a], and the name of the commander of his army was Abner son of Ner, Saul’s uncle.
translation:
  language: zh_hans
  text: 扫罗的妻子名叫亚希暖，是亚希玛斯的女儿；扫罗军队的统帅名叫押尼珥，是尼珥的儿子。尼珥是扫罗的叔叔[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“男性近亲”。这里的希伯来词可泛指关系亲近的男性亲属；结合紧接着的家谱资料，“叔叔”最合适。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשֵׁם
  choice: 名叫
  rationale: 希伯来语名词句用于介绍姓名；“名叫”符合现代汉语表达，也保留了识别人物的功能。
- source_word: אֵשֶׁת שָׁאוּל
  choice: 扫罗的妻子
  rationale: אִשָּׁה 在与扫罗构成属格关系时明确指婚姻关系，译为“妻子”准确自然。
- source_word: בַּת אֲחִימָעַץ
  choice: 亚希玛斯的女儿
  rationale: 这是标准的家谱亲属表达；按现代汉语语序译出父女关系。
- source_word: שַׂר צְבָאוֹ
  choice: 他的军队统帅
  rationale: שַׂר 在军事语境中指领导者，צָבָא 指军队；“军队统帅”庄重而易懂。
- source_word: בֶּן נֵר
  choice: 尼珥的儿子
  rationale: 标准父子谱系表达，按汉语习惯译为“尼珥的儿子”。
- source_word: דּוֹד שָׁאוּל
  choice: 扫罗的叔叔
  rationale: דּוֹד 在此家谱语境中最可能指父辈的男性亲属；结合下一节的谱系资料，“叔叔”最为贴切。
theological_decisions:
- issue: דּוֹד 在扫罗家谱中的含义及所修饰的人物
  choice: 将尼珥称为“扫罗的叔叔”
  alternative: “扫罗的男性近亲”；或按较少见词义理解为“扫罗所爱的”
  rationale: 希伯来语的紧邻结构最自然地把“扫罗的叔叔”看作“尼珥”的同位说明；下一节又表明扫罗之父基士与押尼珥之父尼珥同属亚别的儿子，支持叔侄关系。由于 דּוֹד 的亲属语义可稍宽，脚注保留“男性近亲”的可能。
translation_notes:
  register: 采用现代、庄重而通俗的叙事语言。用分号对应原文两组平行的姓名介绍，并调整末尾亲属说明的语序，使“尼珥是扫罗的叔叔、押尼珥是尼珥的儿子”在汉语中清楚无歧义。
