base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/048.yaml
  text: He fought valiantly and struck Amalek[c][b][a], and he delivered Israel from the hand of those who plundered it.
translation:
  language: zh_hans
  text: 他奋勇作战[a]，击败了亚玛力人[b]，把以色列从劫掠者手中解救出来[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语直译近似“施展勇力”，可指英勇行动，也可指取得军事战果。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语作“亚玛力”，是以族名统指亚玛力人。
    reason: lexical_alternative
  - marker: c
    text: 希伯来语直译为“从劫掠他的那人手中”；“以色列”在原文中作为集体以单数形式出现，这里的“劫掠者”也可按集合意义理解。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ חַיִל
  choice: 奋勇作战
  rationale: 希伯来语习语直译近似“施展力量／勇力”，在这里表示英勇行动或取得军事战果；结合战争语境译为“奋勇作战”，自然且保留其勇武含义。
- source_word: וַיַּךְ
  choice: 击败了
  rationale: נכה 可表示击打、攻打或击败。此处宾语是敌对族群，译作“击败了”符合现代汉语的军事叙事，也不采用古雅而生硬的“击杀”。
- source_word: עֲמָלֵק
  choice: 亚玛力人
  rationale: 原文用单数族名“亚玛力”，在上下文中集体指亚玛力族；汉语用“亚玛力人”能清楚表达这一集体所指。
- source_word: וַיַּצֵּל
  choice: 解救出来
  rationale: נצל 的使役形表示夺回、营救或解救；“解救出来”准确表达以色列脱离掠夺者控制的意思，同时不额外加入专门的神学含义。
- source_word: מִיַּד
  choice: 从……手中
  rationale: 保留希伯来语以“手”表示权势或控制的惯用意象；这一表达在现代汉语中也自然易懂。
- source_word: שֹׁסֵהוּ
  choice: 劫掠者
  rationale: 该分词指进行抢夺、掠夺的人。原文在形态上为单数，并带有回指集体名词“以色列”的单数后缀；汉语用集合性的“劫掠者”可自然保留这种概括意义。
