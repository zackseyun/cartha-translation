base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/012.yaml
  text: And the men of the garrison answered Jonathan and his armor-bearer and said[a], “Come up to us, and we will tell you something.” Then Jonathan said to his armor-bearer, “Come up after me[d][c][b], for Yahweh has given them into the hand of Israel.”
translation:
  language: zh_hans
  text: 哨所的人回答约拿单和替他拿兵器的人说：“上到我们这里来，我们有件事要告诉你们。”约拿单就对替他拿兵器的人说：“跟着我上去，因为雅威已经把他们交在以色列手中了。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַנְשֵׁי הַמַּצָּבָה
  choice: 驻防的非利士人
  rationale: מַצָּבָה在此指驻守的军事据点或驻军；结合上下文，所指是驻守此处的非利士人。这样译比生硬的“驻防地的人”更自然。
- source_word: נֹשֵׂא כֵלָיו
  choice: 给他拿兵器的人
  rationale: 原文直指替约拿单携带装备或兵器的人。此译清楚自然，也避免现代读者把“拿盔甲的人”误解为只携带护具。
- source_word: עֲלוּ אֵלֵינוּ
  choice: 上到我们这里来
  rationale: 保留עלה所表达的向高处移动，也保留说话者视角中的“到我们这里来”。
- source_word: וְנוֹדִיעָה אֶתְכֶם דָּבָר
  choice: 我们有件事要告诉你们
  rationale: ידע的使役式表示使人知道、告知；דָּבָר在此保持含混，仅译作“件事”，不把敌意或威胁明说出来。
- source_word: עֲלֵה אַחֲרַי
  choice: 跟着我上去
  rationale: 兼顾单数命令、跟随次序和向上攀登的动作，符合现代汉语叙事。
- source_word: כִּי נְתָנָם יְהוָה בְּיַד יִשְׂרָאֵל
  choice: 因为雅威已经把他们交在以色列手中了
  rationale: “交在……手中”自然保留希伯来语将敌人置于某方权下的战争惯用语，并保留完成式所表达的确信。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以常见汉语音译呈现四字神名，而不以称号替代。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较贴近学界通常重构的读音，并保留其作为专名的性质。
- issue: 约拿单所说完成式נְתָנָם的时态与语气
  choice: 已经把他们交在……手中了
  alternative: 必把他们交在……手中
  rationale: 保留希伯来语完成式的表达：约拿单把尚待实现的胜利说成已经成就，体现其确信，而不改写为单纯将来时。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“驻防的非利士人”根据叙事上下文补明族属；其余措辞尽量保留军事场景、上行方向和“交在手中”的圣经惯用意象。
