base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/006.yaml
  text: Then Jonathan said to the young man who carried his armor[a], “Come, let us cross over to the garrison of these uncircumcised men. Perhaps Yahweh will act for us[c][b], for nothing can hinder Yahweh from saving by many or by few.”
translation:
  language: zh_hans
  text: 约拿单对给他拿兵器的青年[a]说：“来，我们过去，到这些未受割礼之人[b]的驻地[c]去。也许雅威会为我们行事，因为没有什么能拦阻雅威施行拯救，无论借着多人还是少数人[d]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “拿兵器的青年”也可按传统称为“拿兵器的侍从”；原文直译是“拿着他的器具（或兵器）的青年”。
    reason: lexical_alternative
  - marker: b
    text: “未受割礼之人”在这里不只是身体状况的描述，也是带有圣约色彩的贬称。
    reason: cultural_note
  - marker: c
    text: “驻地”也可译作“哨站”或“据点”。
    reason: lexical_alternative
  - marker: d
    text: 原文也可较直译为：“雅威施行拯救，并没有限制，无论借着多人还是少数人。”
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹשֵׂא כֵלָיו
  choice: 给他拿兵器的青年
  rationale: 原文是分词短语，直指“拿着他的器具／兵器的人”。结合军事语境译作“给他拿兵器的青年”，既保留句法信息，也比固定称谓更易懂。
- source_word: לְכָה וְנַעְבְּרָה
  choice: 来，我们过去
  rationale: 祈使式与鼓励式连用，表达邀请和共同采取行动的决心；“过去”自然贴合眼前的地形与军事移动。
- source_word: מַצַּב
  choice: 驻地
  rationale: 这里指非利士人的军事据点；“驻地”在现代汉语中清楚自然，同时不把规模限定得过死。
- source_word: הָעֲרֵלִים
  choice: 这些未受割礼之人
  rationale: 原文以形容词作名词，并带有圣约背景下的贬斥意味；直译可保留其文化和修辞力度，而不以“非利士人”取代原词。
- source_word: אוּלַי
  choice: 也许
  rationale: 保留约拿单满怀盼望却不妄自断定的语气。
- source_word: יַעֲשֶׂה יְהוָה לָנוּ
  choice: 雅威会为我们行事
  rationale: 动词本义宽泛，意为“做／行”；“为我们行事”既符合语境，又不擅自具体说明雅威将采取何种行动。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以常见的现代汉语音译呈现四字神名，保留其作为以色列之神专名的性质，而不以称号替代。
- source_word: מַעְצוֹר
  choice: 不受拦阻
  rationale: 该名词表示限制、阻碍或拦阻；在汉语中将整句译为“不受拦阻”，清楚传达雅威施救不受人数限制的意思。
- source_word: לְהוֹשִׁיעַ
  choice: 施行拯救
  rationale: 在本节首先指军事上的解救，但该词也有更广泛的圣经用法；“施行拯救”兼顾两者。
- source_word: בְּרַב אוֹ בִמְעָט
  choice: 无论借着多人还是少数人
  rationale: 介词可表示施救所借助的人数或手段；“借着”保留这种工具性，“多人／少数人”则准确呈现数量对比。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名。正文采用“雅威”这一较贴近学界通行重构读音的音译，以专名呈现，不用“主”这一称号替代；脚注不强行裁定古代确切读音。
- issue: אוּלַי 所表达的信心与不确定性
  choice: 也许雅威会为我们行事
  alternative: 雅威必会为我们行事
  rationale: “也许”是原文明确出现的情态词。保留它可呈现约拿单信靠雅威能力，却不预先断言雅威在此刻必定采取行动的张力。
- issue: הָעֲרֵלִים 的圣约色彩
  choice: 这些未受割礼之人
  alternative: 这些非利士人
  rationale: 原文没有在这里直接使用族名，而以“未受割礼的”称呼对方。保留这一说法，既不抹去圣约背景，也不额外扩展其神学含义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。对话保持简洁有力；以“也许”保留原文的谨慎语气，以“无论……还是……”清楚呈现人数对比。正文不使用过度古雅的“膀臂”“岂有难成”等表达，也不把军事语境中的拯救缩窄为一般意义的“帮助”。
