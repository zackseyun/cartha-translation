  yaml_path: translation/ot/1_samuel/014/035.yaml
  text: And Saul built an altar to Yahweh[a]; this was the first altar he built to Yahweh.
translation:
  language: zh_hans
  text: 扫罗为雅威筑了一座祭坛；这是他第一次为雅威筑坛。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较直译：“他开始筑这座献给雅威的祭坛。”这个希伯来语表达通常被理解为：这是扫罗第一次为雅威筑坛。
    reason: 保留 אֹתוֹ הֵחֵל לִבְנוֹת 较贴近字面的读法，同时说明正文所采用的惯用解释。
lexical_decisions:
- source_word: וַיִּבֶן
  choice: 筑
  rationale: בנה在这里指建造祭坛；现代汉语通常说“筑坛”，简洁自然，也符合庄重的经文语体。
- source_word: שָׁאוּל
  choice: 扫罗
  rationale: 采用该人名在现代中文圣经中的通行译名。
- source_word: מִזְבֵּחַ
  choice: 坛
  rationale: מזבח指献祭用的祭坛；在“筑坛”这一固定搭配中译作“坛”最自然。
- source_word: לַיהוָה
  choice: 为雅威
  rationale: 介词ל在此表示祭坛归属、奉献的对象；“为雅威筑坛”既自然，又保留神名יהוה。
- source_word: אֹתוֹ הֵחֵל לִבְנוֹת
  choice: 这是他第一次……筑坛
  rationale: 该结构字面近于“他开始把它筑作……坛”，但通常被理解为这是扫罗首次为雅威筑坛；正文采用通顺的惯用义，脚注保留较直译的可能。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。译作“雅威”以音译方式呈现专名，避免以称号“主”替代；“耶和华”是中文传统形式，但较不贴近通常重构的读音。
- issue: אֹתוֹ הֵחֵל לִבְנוֹת的解释
  choice: 这是他第一次为雅威筑坛
  alternative: 他开始把它筑作献给雅威的坛
  rationale: 希伯来语结构较为突兀，可按惯用法理解为这座坛是扫罗首次所筑；同时，此句也能作较贴近字面的“开始建造”解释，因此以脚注保留歧义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“筑坛”是自然且凝练的宗教语汇；分号清楚呈现两个分句之间的解释关系。
