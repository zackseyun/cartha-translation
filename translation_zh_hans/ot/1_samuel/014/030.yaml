base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/030.yaml
  text: How much more if the people had eaten today from the spoil of their enemies that they found! For then the slaughter among the Philistines would have been much greater[a].
translation:
  language: zh_hans
  text: 何况，百姓今天若吃了他们所找到的、从敌人那里得来的掠物，如今对非利士人的打击岂不更大吗？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“百姓今天要是吃了他们所找到的、从敌人那里得来的掠物，如今对非利士人的打击岂不就更大了吗！”
    reason: 原文开头的 אַף כִּי לוּא 可理解为递进式的“何况……若”，也可将全句处理为带惋惜语气的反事实感叹；מַכָּה 也可译为“杀伤”或“击败”。
lexical_decisions:
- source_word: אַף כִּי לוּא
  choice: 何况……若
  rationale: 这一组合加强与事实相反的假设，并从实际战果推向本可取得的更大战果。“何况……若”保留了递进和反事实语气；另一个可能是带惋惜色彩的“但愿……”。
- source_word: אָכֹל אָכַל
  choice: 吃了
  rationale: 不定式绝对形与限定动词连用，强调“吃”这一动作。现代汉语若直加“尽情”或“饱饱地”容易引入原文未明说的程度，因此正文以语境和句式承载强调。
- source_word: מִשְּׁלַל אֹיְבָיו
  choice: 敌军掠物
  rationale: שָׁלָל 指战斗中夺得的掠物。后缀在希伯来语中为单数形式，与集合名词“百姓”呼应；汉语用“敌军”可自然保留集合意义。
- source_word: אֲשֶׁר מָצָא
  choice: 他们所找到的
  rationale: 动词形态上为单数，与集合名词 הָעָם 一致；现代汉语按实际所指用复数“他们”更自然。
- source_word: מַכָּה
  choice: 杀伤
  rationale: מַכָּה 在军事语境可指打击、击杀或败亡。“杀伤”既符合战场语境，也不把词义过度限定为单纯的“屠杀”。
- source_word: לֹא רָבְתָה
  choice: 岂不更大吗
  rationale: 否定词在此构成反问，表达未实现的结果；“岂不更大吗”自然体现反事实和加强语气。
- source_word: בַּפְּלִשְׁתִּים
  choice: 非利士人遭受的
  rationale: 介词 בְּ 可表示打击发生的范围或对象。改用汉语受事结构，清楚表达杀伤临到非利士人，同时避免生硬的介词直译。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“何况……若”略带书面色彩，但适合叙事中的反问和感叹。正文保留原文前半句的感叹式结构，不擅自补入“战果”等名词。
