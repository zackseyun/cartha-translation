  text: וַ/אֲחִיָּ֣ה בֶן אֲחִט֡וּב אֲחִ֡י אִיכָב֣וֹד בֶּן פִּינְחָ֨ס בֶּן עֵלִ֜י כֹּהֵ֧ן יְהוָ֛ה בְּ/שִׁל֖וֹ נֹשֵׂ֣א אֵפ֑וֹד וְ/הָ/עָם֙ לֹ֣א יָדַ֔ע כִּ֥י הָלַ֖ךְ יוֹנָתָֽן־׀־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/003.yaml
  text: Ahijah son of Ahitub[a], brother of Ichabod, son of Phinehas, son of Eli, priest of Yahweh at Shiloh, was carrying an ephod. And the people did not know that Jonathan had gone.
translation:
  language: zh_hans
  text: 亚希突的儿子亚希亚——他是以迦博的兄弟、非尼哈的儿子、以利的孙子，也是在示罗侍奉耶和华的祭司——当时正带着以弗得[a]。百姓并不知道约拿单已经走了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “带着”也可理解为“穿着”。希伯来文直译是“携带／背负以弗得”。
    reason: 保留 נֹשֵׂא 在祭司服饰语境中究竟指携带还是穿戴的词义含混。
lexical_decisions:
- source_word: וַ/אֲחִיָּה
  choice: 亚希亚
  rationale: 按通行中文圣经人名音译；前缀 waw 在此衔接并推进叙事，中文无需机械译作“而”或“现在”。
- source_word: בֶן אֲחִטוּב
  choice: 亚希突的儿子
  rationale: 直接保留希伯来文家谱关系。
- source_word: אֲחִי אִיכָבוֹד
  choice: 以迦博的哥哥
  rationale: אֲחִי 的通常含义是“兄弟”；结合家谱可知亚希亚与以迦博同为非尼哈之子，而亚希亚此时已任祭司，译作“哥哥”自然，但原文严格说只明示兄弟关系。
- source_word: בֶּן פִּינְחָס בֶּן עֵלִי
  choice: 非尼哈的儿子、以利的孙子
  rationale: 希伯来文逐层写作“非尼哈之子、以利之子”；中文用“孙子”明确实际代际关系，避免误读为亚希亚同时是两人的儿子。
- source_word: כֹּהֵן יְהוָה בְּ/שִׁלֹה
  choice: 在示罗侍奉耶和华的祭司
  rationale: “祭司”与前面的家谱说明同位身份；地点短语可修饰祭司职分。补出“侍奉”使现代中文自然，但不增添宗派性含义。
- source_word: נֹשֵׂא אֵפוֹד
  choice: 正带着以弗得
  rationale: נשא 的词义核心是携带、带着；此处未明确说明究竟是穿戴还是手持，因此正文保留较宽泛的“带着”，脚注说明可能的理解。
- source_word: וְ/הָ/עָם לֹא יָדַע
  choice: 百姓并不知道
  rationale: 集合名词 העם 在中文可自然译作“百姓”；“并”承接上下文并表达其不知情。
- source_word: כִּי הָלַךְ יוֹנָתָן
  choice: 约拿单已经走了
  rationale: כי 引出“知道”的内容，הלך 表示约拿单的离开先于百姓不知此事，故用“已经”。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 正文采用现代中文圣经读者最熟悉且明确作为专名使用的“耶和华”，不以“主”这一称号替代原文神名。
- issue: נֹשֵׂא אֵפוֹד 所指的动作
  choice: 带着以弗得
  alternative: 穿着以弗得
  rationale: 原文仅用“携带／负载”一词，既可能在祭司语境中表示穿戴，也可能表示携带；正文不替原文消除这一含混性。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。用破折号划清较长的家谱和身份插入说明，使普通读者容易辨认主句；人名、地名和祭司用品沿用简体中文圣经常见译名。
