  naturalness: 修订后“以迦博的兄弟”在家谱式插入语中自然、庄重。破折号处理长同位语清晰；“当时正带着”也符合现代标准汉语。
  terminology: 人名、地名、“耶和华”和“以弗得”的译法一致且适切。“祭司”及“带着以弗得”保持原文的礼仪语境，不作不必要的具体化。
