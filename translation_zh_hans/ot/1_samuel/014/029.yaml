base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/029.yaml
  text: Then Jonathan said[a], “My father has troubled the land. See, please, how my eyes have brightened because I tasted a little of this honey.”
translation:
  language: zh_hans
  text: 约拿单说：“我父亲给这地带来了祸患。你们看，我只尝了这一点蜂蜜，眼睛就明亮了[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “眼睛就明亮了”是希伯来语习语，表示吃过东西后恢复了精力或警觉。
    reason: lexical_alternative
lexical_decisions:
- source_word: עָכַר
  choice: 给……带来了祸患
  rationale: 该动词有搅扰、使陷入困境或招致祸患之意；此译保留其使动意味，又避免把后果强化为明确的“灾难”
- source_word: הָאָרֶץ
  choice: 这地
  rationale: 直译为“地”；在叙事中可兼指扫罗誓言所影响的地域及其民众，保留原文的指涉弹性。
- source_word: רְאוּ נָא
  choice: 你们看
  rationale: 复数命令式要求听众留意；נָא带有请求、劝请语气，现代汉语用“你们看”已能自然传达，不另加生硬的“请”。
- source_word: אֹרוּ עֵינַי
  choice: 眼睛就明亮了
  rationale: 保留希伯来语的身体意象；此习语在上下文中表示进食后恢复精神、视力清明或警醒。
- source_word: טָעַמְתִּי
  choice: 尝了
  rationale: 准确反映“品尝、尝一点”的词义，并与下文少量蜂蜜相呼应。
- source_word: מְעַט דְּבַשׁ הַזֶּה
  choice: 这一点蜂蜜
  rationale: 同时表达少量、蜂蜜和指示词“这”，用现代汉语自然重组语序。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“给这地带来了祸患”保留约拿单对父亲行为的尖锐评价；后一句按汉语信息结构调整语序，但未改变“只尝少量蜂蜜便恢复精神”的因果关系。
