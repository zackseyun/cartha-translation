base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/018.yaml
  text: Then Saul said to Ahijah[b][a], “Bring the ark of God here,” for the ark of God was that day with the sons of Israel.
translation:
  language: zh_hans
  text: 扫罗就对亚希亚说：“把神的柜拿到这里来[a]。”因为那一天，神的柜在以色列人那里[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些文本传统和解释者在这里作“把以弗得拿来”，而不是“把神的柜拿来”；本节希伯来文本作“神的柜”。
    reason: textual_variant
  - marker: b
    text: 也可译：“因为那一天，神的柜与以色列人在一起。”
    reason: previous_rendering
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 就……说
  rationale: 承接前文并推进叙事；“就”符合现代汉语叙事语序。
- source_word: לַאֲחִיָּה
  choice: 对亚希亚
  rationale: 按希伯来语人名音译，并自然表达说话对象。
- source_word: הַגִּישָׁה
  choice: 抬到这里来
  rationale: 使役命令式表示“使靠近、拿来”；约柜通常由人抬行，因此“抬到这里来”既自然又符合对象特征。
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: 神的约柜
  rationale: 原文直译为“神的柜”；“约柜”是该器物在现代汉语圣经语境中的通行名称，但不增添原文未明说的“神的约”。
- source_word: כִּי
  choice: 因为
  rationale: 引出叙述者对命令背景的解释，同时保留原文因果或说明关系。
- source_word: הָיָה
  choice: 同在
  rationale: 结合后面的介词短语，表达约柜当时“与以色列人一起、在他们那里”；不额外加入原文没有的地点副词。
- source_word: בַּיּוֹם הַהוּא
  choice: 那一天
  rationale: 直接而自然地表达原文时间短语。
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: 与以色列人
  rationale: בְּ在此表达伴随关系；“以色列人”是现代汉语对“以色列之子”的自然群体称谓。
theological_decisions:
- issue: “神的约柜”与异文“以弗得”
  choice: 神的约柜
  alternative: 以弗得
  rationale: 所提供的马所拉希伯来文本两次均作“神的柜”，故正文据此翻译；其他文本传统或解释所采用的“以弗得”保留在脚注中，不据此改写正文。
- issue: 末句中约柜与以色列人的关系
  choice: 与以色列人同在
  alternative: 那一天就在那里，与以色列人同在
  rationale: 希伯来语明确有“与以色列人”的介词短语，却没有独立的“那里”；正文避免补入地点词，同时以脚注保留可补足地点意味的译法。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“抬到这里来”贴合约柜这一具体对象；“与以色列人同在”保留原文关系表达及其轻微含混，不将其神学化为特别的临在宣告。
