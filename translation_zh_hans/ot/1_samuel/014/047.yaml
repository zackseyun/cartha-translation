source:
  edition: WLC
  text: וְ/שָׁא֛וּל לָכַ֥ד הַ/מְּלוּכָ֖ה עַל יִשְׂרָאֵ֑ל וַ/יִּלָּ֣חֶם סָבִ֣יב בְּֽ/כָל אֹיְבָ֡י/ו בְּ/מוֹאָ֣ב וּ/בִ/בְנֵי עַמּ֨וֹן וּ/בֶ/אֱד֜וֹם וּ/בְ/מַלְכֵ֤י צוֹבָה֙ וּ/בַ/פְּלִשְׁתִּ֔ים וּ/בְ/כֹ֥ל אֲשֶׁר יִפְנֶ֖ה יַרְשִֽׁיעַ־׀־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/047.yaml
  text: 'Saul had secured the kingship over Israel[a], and he fought against all his enemies on every side: against Moab, against the Ammonites, against Edom, against the kings of Zobah, and against the Philistines. Wherever he turned, he inflicted punishment.'
translation:
  language: zh_hans
  text: 扫罗巩固了对以色列的王权，便与四围所有的仇敌交战，就是摩押人、亚扪人、以东人、琐巴诸王和非利士人。他无论转向哪里，都惩治敌人。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “惩治”或较直译作“定他们有罪”。这个希伯来语动词可指宣判有罪；在这里很可能是指使敌人受到惩罚性的失败。
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכַד הַמְּלוּכָה עַל יִשְׂרָאֵל
  choice: 巩固了对以色列的王权
  rationale: לכד 的基本义是“夺取、抓住”，但与“王权”和“对以色列”连用时，此处描述扫罗确立并稳固统治。“巩固……王权”既保留取得牢固掌控的力度，也避免暗示不合法的篡夺。
- source_word: וַיִּלָּחֶם סָבִיב בְּכָל אֹיְבָיו
  choice: 便与四围所有的仇敌交战
  rationale: “交战”自然对应 לחם；介词 ב 在此标明交战对象，译作“与……交战”。סביב 表示周围各方，译为“四围”。
- source_word: בְּמוֹאָב וּבִבְנֵי עַמּוֹן וּבֶאֱדוֹם וּבְמַלְכֵי צוֹבָה וּבַפְּלִשְׁתִּים
  choice: 就是摩押人、亚扪人、以东人、琐巴诸王和非利士人
  rationale: 按现代汉语习惯将敌对民族名称译作“……人”；保留 מַלְכֵי 的复数，译为“琐巴诸王”，不擅自改成单数。
- source_word: וּבְכֹל אֲשֶׁר יִפְנֶה
  choice: 他无论转向哪里
  rationale: 保留该结构的周遍、分配意义，表达扫罗在各个战向上的行动。
- source_word: יַרְשִׁיעַ
  choice: 都惩治敌人
  rationale: רשע 的使役形在此语境中可能指判为有罪、施加惩罚，或以惩罚性的军事失败制服对方。“惩治”保留审判与处罚色彩，同时适合战争叙事；补出“敌人”以使汉语指向清楚。
theological_decisions:
- issue: יַרְשִׁיעַ 的审判性与军事性含义
  choice: 正文译为“惩治敌人”，脚注说明较直译法
  alternative: 定他们有罪；使他们遭受惨败
  rationale: 希伯来词形带有宣告或显明为恶、为有罪的语义，但上下文是对敌作战。正文不把它单纯化为“得胜”，以保留审判意味；也不机械译成汉语中语境突兀的“定罪”。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“王权”表达抽象的君王统治，不误解为领土；“四围”“诸王”略具经文庄重感，但普通读者仍易理解。脚注标记置于所解释的末句之后。
