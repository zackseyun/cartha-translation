base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/020.yaml
  text: Then Saul and all the people who were with him were summoned, and they came to the battle[a]. And behold, every man's sword was against his companion[b], with very great confusion.
translation:
  language: zh_hans
  text: 于是，扫罗和所有与他在一起的人都被召集起来[a]，他们来到战场。看哪，各人的刀都对着自己的同伴，混乱极其严重[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“高声呼喊”或“集合起来”。这里的希伯来语动词可以有不同理解。
    reason: lexical_alternative
  - marker: b
    text: 或译“极大的恐慌”或“极大的骚动”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזָּעֵק
  choice: 被召集起来
  rationale: 该动词为זעק的尼法勒形式；结合众人随后赶到战场的叙事语境，译作被动意义的“被召集起来”较为合适，同时以脚注保留“高声呼喊”或“集合起来”的可能理解。
- source_word: הָעָם אֲשֶׁר אִתּוֹ
  choice: 跟随他的众人
  rationale: עָם在此军事语境中指与扫罗同在的一队人；“众人”保留原词的宽泛性，“跟随他的”用自然汉语表达אֲשֶׁר אִתּוֹ。
- source_word: וַיָּבֹאוּ עַד הַמִּלְחָמָה
  choice: 来到战场
  rationale: בוא与עד连用表示抵达交战之处；“来到战场”自然表达其移动终点，又不明确断言他们已经投入交战。
- source_word: וְהִנֵּה
  choice: 不料
  rationale: הִנֵּה在此引出突然映入眼帘的景象；“不料”保留叙事中的突转和惊异感，比直译“看哪”更符合现代汉语叙事。
- source_word: חֶרֶב אִישׁ בְּרֵעֵהוּ
  choice: 每个人的刀都砍向自己的同伴
  rationale: 原文直译为“各人的刀攻击他的同伴”，描写敌军彼此残杀。“砍向”使汉语画面清楚，“同伴”保留רֵעַ在此处“同一方的人”的含义，不译成感情色彩较强的“朋友”。
- source_word: מְהוּמָה גְּדוֹלָה מְאֹד
  choice: 场面极其混乱
  rationale: מְהוּמָה可指混乱、惊慌或骚动；上下文强调营中自相攻击的失序景象，因此正文用涵盖面较广的“混乱”，并以“极其”表达גְּדוֹלָה מְאֹד的加强语气。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“不料”呈现原文突见异象的效果；“场面极其混乱”避免生硬照搬希伯来语名词结构。正文保留动词语态及关键词的开放性，词义上的其他可能通过脚注说明。
