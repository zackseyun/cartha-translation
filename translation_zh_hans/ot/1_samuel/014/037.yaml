  text: וַ/יִּשְׁאַ֤ל שָׁאוּל֙ בֵּֽ/אלֹהִ֔ים הַֽ/אֵרֵד֙ אַחֲרֵ֣י פְלִשְׁתִּ֔ים הֲ/תִתְּנֵ֖/ם בְּ/יַ֣ד יִשְׂרָאֵ֑ל וְ/לֹ֥א עָנָ֖/הוּ בַּ/יּ֥וֹם הַ/הֽוּא׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/037.yaml
  text: Then Saul inquired of God[a], “Should I go down after the Philistines? Will you give them into the hand of Israel?” But he did not answer him that day.
translation:
  language: zh_hans
  text: 扫罗求问上帝：“我可以下去追赶非利士人吗？你会把他们交在以色列手中吗？[a]”但那一天，他没有回答扫罗。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你会把他们交给以色列吗？”
    reason: “交在……手中”是希伯来语表示交由某方掌控的惯用语；意译可省去“手中”这一意象。
lexical_decisions:
- source_word: וַיִּשְׁאַל ... בֵּאלֹהִים
  choice: 求问上帝
  rationale: שׁאל 与介词 ב 连用，在这里指寻求上帝的指示或裁决；“求问上帝”既体现正式寻求神谕的语境，也符合现代汉语表达。
- source_word: הַאֵרֵד
  choice: 我可以下去……吗
  rationale: 疑问词与第一人称未完成式表达扫罗寻求许可或指引；“可以……吗”自然传达商询语气，“下去”保留 ירד 的方向含义。
- source_word: אַחֲרֵי פְלִשְׁתִּים
  choice: 追赶非利士人
  rationale: אַחֲרֵי 字面为“在……后面”，军事语境中表示追击；“追赶”在现代汉语中清楚呈现该语境含义。
- source_word: הֲתִתְּנֵם בְּיַד יִשְׂרָאֵל
  choice: 你会把他们交在以色列手中吗
  rationale: נתן 加“在……手中”是把敌人交由对方掌控的战事惯用语；保留“手中”既贴近原文意象，也能为现代读者理解。
- source_word: וְלֹא עָנָהוּ
  choice: 但……他没有回答扫罗
  rationale: 连接词在上下文中带转折效果，译作“但”；原文主语省略而由语境指向上帝，中文保留代词“他”，宾语用“扫罗”避免连续代词造成指代不清。
- source_word: בַּיּוֹם הַהוּא
  choice: 那一天
  rationale: 准确、自然地表达原文的特指时间短语。
theological_decisions:
- issue: “没有回答”这一动作的隐含主语
  choice: 以“他”保留代词表达，由上下文指向上帝
  alternative: 明确译作“上帝没有回答扫罗”
  rationale: 上文刚说扫罗求问上帝，因此上帝是最自然的主语；但原文未重复“上帝”，用“他”可保留其简练与形式上的含蓄。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“求问”体现寻求神圣指引的语境；“追赶”使军事行动明确；整体保持原文两问一转折的紧凑结构。
