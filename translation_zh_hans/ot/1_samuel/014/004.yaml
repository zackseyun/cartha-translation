base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/004.yaml
  text: Between the passes by which Jonathan sought to cross over to the Philistine garrison[a], there was a crag of rock on one side and a crag of rock on the other side; and the name of the one was Bozez, and the name of the other Seneh.
translation:
  language: zh_hans
  text: 在约拿单想越过、前往非利士人驻防地的两道隘口之间，两边各有一座尖峭的岩峰[a]；一座名叫波薛，另一座名叫西尼。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“岩石之牙”，指尖锐突出的岩峰或岩壁。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּעְבְּרוֹת
  choice: 隘口
  rationale: 该词指可供通行或穿越之处；结合两侧尖峭岩峰的地形，译作“隘口”自然且不误导为渡口。
- source_word: בִּקֵּשׁ ... לַעֲבֹר
  choice: 想……过去
  rationale: 表达有意前往并设法越过的意思；现代汉语中“想从……过去”自然，也不把行动程度强化为已经尝试。
- source_word: מַצַּב פְּלִשְׁתִּים
  choice: 非利士人的驻防地
  rationale: מַצָּב在军事语境中可指驻扎的部队或据点；“驻防地”保留地点与军事驻守两方面，不强行限定为营寨。
- source_word: שֵׁן הַסֶּלַע
  choice: 尖峭的岩峰
  rationale: 原文直译为“岩石之牙”，形容尖锐突出的岩体；“尖峭的岩峰”在现代汉语中清楚保留其地貌形象。
- source_word: מֵהָעֵבֶר מִזֶּה ... מֵהָעֵבֶר מִזֶּה
  choice: 这边……那边
  rationale: 原文重复指相对的两侧；“这边……那边”简洁自然，并清楚呈现隘口两边的地势。
- source_word: שֵׁם הָאֶחָד ... וְשֵׁם הָאֶחָד
  choice: 一个名叫……另一个名叫……
  rationale: 以自然现代汉语表达原文对称的命名结构。
- source_word: בּוֹצֵץ
  choice: 波薛
  rationale: 专名按希伯来语读音音译。
- source_word: סֶנֶּה
  choice: 西尼
  rationale: 专名按希伯来语读音音译。
- source_word: וּבֵין
  choice: 从两道隘口之间
  rationale: 连接词在汉语叙事中无须机械译作“现在”或“并且”；其衔接作用由句序自然体现。
