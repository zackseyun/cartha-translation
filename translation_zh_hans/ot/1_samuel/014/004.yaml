  to: 在约拿单想越过、前往非利士人驻防地的两道隘口之间，两边各有一座尖峭的岩峰[a]；一座名叫波薛，另一座名叫西尼。
  rationale: 修订恢复原文以“在两道隘口之间”开头的空间框架，并使“约拿单想越过”明确修饰“隘口”。“两边各有一座”对应原文重复的“两侧各有一处‘岩石之牙’”；命名句相应明确这两座岩峰分别得名。
