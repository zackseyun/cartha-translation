base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/049.yaml
  text: 'Saul’s sons were Jonathan[a], Ishvi, and Malchi-shua; and the names of his two daughters were these: the name of the firstborn was Merab[b], and the name of the younger was Michal.'
translation:
  language: zh_hans
  text: 扫罗的儿子是约拿单、亦施韦和麦基舒亚；他的两个女儿中，长女名叫米拉，幼女名叫米甲。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: 是
  rationale: 此处用于列举扫罗的子女；中文以判断句自然表达，不另加原文没有明确对应词的“现在”。
- source_word: בְּנֵי שָׁאוּל
  choice: 扫罗的儿子
  rationale: 按构造链直译并符合现代汉语习惯；保留“儿子”，与下文“女儿”相区分。
- source_word: יוֹנָתָן
  choice: 约拿单
  rationale: 采用中文圣经传统中通行且易于识别的人名译法。
- source_word: יִשְׁוִי
  choice: 伊施韦
  rationale: 按马所拉文本的辅音及读音音译，以区别于其他相近名字。
- source_word: מַלְכִּי שׁוּעַ
  choice: 麦基舒亚
  rationale: 将希伯来文两个成分合为一个中文人名音译，符合现代中文人名呈现习惯。
- source_word: וְשֵׁם שְׁתֵּי בְנֹתָיו
  choice: 他的两个女儿
  rationale: 希伯来文形式上用单数“名”，随后分别列出两个名字；中文改用分句“长女名叫……，幼女名叫……”即可自然保留列举功能，无须机械呈现单数。
- source_word: הַבְּכִירָה
  choice: 长女
  rationale: 该阴性词在家庭关系中指先出生或年长的女儿；“长女”简洁保留出生次序含义。
- source_word: מֵרַב
  choice: 米拉
  rationale: 采用中文圣经传统中通行的人名译法。
- source_word: הַקְּטַנָּה
  choice: 幼女
  rationale: 此处表示两个女儿中较年幼者，并非体形较小；“幼女”与“长女”对应自然。
- source_word: מִיכַל
  choice: 米甲
  rationale: 采用中文圣经传统中通行且易于识别的人名译法。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而简洁的家谱式列举语体。以“长女……幼女……”自然表达两位女儿的相对出生次序，并避免把希伯来文单数“名”的句法生硬移入中文。人名采用简体中文读者熟悉的传统译名。
