  terminology: “兵器”对应 כֵלִים 合宜；“替他拿兵器的人”准确表达 נֹשֵׂא כֵלָיו。保留“心里”和“心意”可反映本节两次 לֵבָב 的修辞关联，同时不牺牲现代汉语自然度。
