  source_fidelity: 译文总体准确传达了随从对约拿单行动的支持。“去吧”可接受地处理了 נְטֵה לָךְ 在此处的简短行动催促。但末句“与你同心”将 כִּלְבָבֶךָ（按你的心意／照你的心愿）概括为“同心”，未明确保留原文所说随从按对方心意支持的意思。
