  yaml_path: translation/ot/1_samuel/014/007.yaml
  text: His armor-bearer said to him, “Do all that is in your heart. Go on; here I am with you, according to your heart.”
translation:
  language: zh_hans
  text: 替他拿兵器的人对他说：“你心里想做什么，就尽管做吧。去吧！我在这里，必照你的心意支持你。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נֹשֵׂא כֵלָיו
  choice: 给他拿兵器的人
  rationale: 按希伯来语构词直译其职分，现代汉语清楚自然，也避免“拿兵器的”可能产生的歧义。
- source_word: עֲשֵׂה כָּל אֲשֶׁר בִּלְבָבֶךָ
  choice: 你心里想做什么，就尽管做吧
  rationale: 保留“心里”的原文意象；“尽管做吧”自然表达全力支持和许可的语气。
- source_word: נְטֵה לָךְ
  choice: 去吧
  rationale: 该短语在此语境中表示继续行动、照自己的意向前去；采用简洁自然的命令语，符合上下文。
- source_word: הִנְנִי עִמְּךָ כִּלְבָבֶךָ
  choice: 我在这里与你同心
  rationale: “我在这里”对应 הִנְנִי，“与你同心”凝练表达“我与你同在，照着你的心意”，在汉语中自然地传达完全支持。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而口语自然的叙事语体。保留“心”的重复语义核心，但末句以“同心”避免生硬的“照着你的心”，同时传达拿兵器者坚定支持约拿单的态度。
