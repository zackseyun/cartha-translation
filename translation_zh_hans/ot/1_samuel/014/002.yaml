base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/002.yaml
  text: Saul was staying at the outskirts of Gibeah[a], under the pomegranate tree that is at Migron[b], and the people who were with him were about six hundred men.
translation:
  language: zh_hans
  text: 扫罗留在[a]基比亚的边缘，在那棵位于米矶仑的石榴树下[b]；和他在一起的约有六百人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “留在”也可译作“坐在”。希伯来语分词既可表示坐着，也可表示停留或留在某处。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“石榴下”；这里按语境补出“树”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹשֵׁב
  choice: 留在
  rationale: 该分词可指“坐着”，也可指居住、停留或留在某处。军事叙事中，“留在”自然表达扫罗持续身处该地，同时不把词义限定为身体姿势。
- source_word: בִּקְצֵה הַגִּבְעָה
  choice: 在基比亚边缘
  rationale: קָצֶה表示尽头、边缘或边界；这里保留空间意义，不进一步断定为城内边缘还是外围。הַגִּבְעָה结合上下文作地名“基比亚”。
- source_word: תַּחַת הָרִמּוֹן
  choice: 在……石榴树下
  rationale: רִמּוֹן字面为“石榴”，但在这一方位表达中指石榴树；汉语补出“树”才能自然清楚。
- source_word: אֲשֶׁר בְּמִגְרוֹן
  choice: 那棵位于米矶仑的
  rationale: 关系从句最自然地修饰石榴树，说明其所在地点；“米矶仑”按专名音译。
- source_word: וְהָעָם אֲשֶׁר עִמּוֹ
  choice: 和他在一起的
  rationale: עָם本义较宽，可指百姓或随行人员；这里避免直接窄化为“军队”，并以自然汉语表达其与扫罗同在。
- source_word: כְּשֵׁשׁ מֵאוֹת אִישׁ
  choice: 约有六百人
  rationale: 前缀כְּ־表示约数，因此译出“约”；数词后的אִישׁ在此自然译为“人”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事用语。“留在”避免生硬的“驻留”，也不额外引入“驻扎”所暗示的正式军营含义；分号清楚连接扫罗的位置与随行人数。
