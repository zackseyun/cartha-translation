  text: וְ/אִֽישׁ יִשְׂרָאֵ֥ל נִגַּ֖שׂ בַּ/יּ֣וֹם הַ/ה֑וּא וַ/יֹּאֶל֩ שָׁא֨וּל אֶת הָ/עָ֜ם לֵ/אמֹ֗ר אָר֣וּר הָ֠/אִישׁ אֲשֶׁר יֹ֨אכַל לֶ֜חֶם עַד הָ/עֶ֗רֶב וְ/נִקַּמְתִּי֙ מֵ/אֹ֣יְבַ֔/י וְ/לֹֽא טָעַ֥ם כָּל הָ/עָ֖ם לָֽחֶם־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/024.yaml
  text: The men of Israel were hard-pressed that day[a], and Saul put the people under an oath, saying, “Cursed is the man who eats food before evening, before I have avenged myself on my enemies.” So none of the people tasted food.
translation:
  language: zh_hans
  text: 那一天，以色列人困乏不堪。扫罗叫百姓起誓，说：“凡在傍晚以前、在我向仇敌报仇以前吃食物的，必受咒诅！”因此，百姓没有一个人尝食物。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节两处“食物”，希伯来文直译都是“饼”；这里很可能泛指食物，而不只是饼。
    reason: lexical_alternative
lexical_decisions:
- source_word: נִגַּשׂ
  choice: 困乏不堪
  rationale: 此处尼法勒形态按上下文表达受压、困苦的状态，而非空间意义上的“走近”；与战事和禁食造成的困境相合。
- source_word: וַיֹּאֶל ... אֶת־הָעָם
  choice: 叫百姓起誓
  rationale: 本句由随后的咒诅宣告说明其含义是以誓言约束百姓；“叫百姓起誓”自然清楚，也保留扫罗施加约束的意味。
- source_word: הָעָם
  choice: 百姓
  rationale: 保留常用词“百姓”；在本段军事语境中具体指随扫罗作战的人。
- source_word: אָרוּר הָאִישׁ
  choice: 凡……的，必受咒诅
  rationale: 用现代汉语的条件结构自然表达希伯来文对泛指单数之人的正式咒诅宣告。
- source_word: יֹאכַל לֶחֶם / טָעַם ... לָחֶם
  choice: 吃食物／尝食物
  rationale: לֶחֶם 字面为“饼”，这里按惯用法泛指食物；末句保留“尝”的生动措辞。
- source_word: עַד הָעֶרֶב
  choice: 在晚上以前
  rationale: 准确表达禁令持续至晚上的时间界限，并与汉语咒诅条件句自然衔接。
- source_word: וְנִקַּמְתִּי מֵאֹיְבַי
  choice: 在我向仇敌报仇以前
  rationale: 保留第一人称的个人色彩和“报仇”的语义，同时在汉语中明确它与禁食期限的时间关系。
- source_word: וְלֹא טָעַם כָּל־הָעָם
  choice: 百姓没有一个人尝
  rationale: 以自然汉语表达希伯来文“全体……不”的否定集合含义。
theological_decisions:
- issue: 扫罗所说报仇的个人色彩
  choice: 我向仇敌报仇
  alternative: 向我们的仇敌报仇／战胜仇敌
  rationale: 原文明确使用第一人称单数“我的仇敌”，故不将其集体化或弱化为一般军事胜利，以保留叙事中的张力。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。“困乏不堪”表达受压与疲惫的叙事情境；咒诅句使用“凡……的，必……”结构，既正式又易懂。脚注标记置于本节末，说明两处相同的词汇选择。
