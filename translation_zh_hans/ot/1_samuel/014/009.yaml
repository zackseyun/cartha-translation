base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/009.yaml
  text: If they say to us like this[b][a], ‘Stay there until we come to you,’ then we will stand where we are and will not go up to them.
translation:
  language: zh_hans
  text: 如果他们对我们这样说：‘你们待在那里[a]，等我们到你们那里去’，我们就站在原地[b]，不向他们那里上去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “待在那里”也可译作“不要动”或“等着”；希伯来语这个祈使词可指留在原处不动或保持安静。
    reason: lexical_alternative
  - marker: b
    text: 直译是“站在我们自己下面”，这是表示“留在原地”的习语。
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: 如果
  rationale: 标准条件连词，引出约拿单所设定的情形。
- source_word: כֹּה יֹאמְרוּ אֵלֵינוּ
  choice: 他们对我们这样说
  rationale: 保留כֹּה的指示意味，并以自然的现代汉语引出直接引语。
- source_word: דֹּמּוּ
  choice: 你们待在那里
  rationale: דמם的复数祈使式可表示静止、安静或等候；在此军事场景中，实际意思是留在原处。
- source_word: עַד הַגִּיעֵנוּ אֲלֵיכֶם
  choice: 等我们到你们那里去
  rationale: 表达非利士人来到约拿单和拿兵器者所在之处；“到你们那里去”符合引语说话者的视角。
- source_word: וְעָמַדְנוּ תַחְתֵּינוּ
  choice: 我们就站在原地
  rationale: 条件句后的连续表达结果；תַחְתֵּינוּ字面与“在我们下面”有关，在这里是留在自己位置的习语。
- source_word: וְלֹא נַעֲלֶה אֲלֵיהֶם
  choice: 不上他们那里去
  rationale: 保留עלה所含向高处移动的地形意味，也不额外解释为发动攻击。
