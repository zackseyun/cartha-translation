  yaml_path: translation/ot/1_samuel/014/042.yaml
  text: Then Saul said[a], “Cast lots between me and Jonathan my son.” And Jonathan was taken.
translation:
  language: zh_hans
  text: 扫罗说[a]：“你们在我和我儿子约拿单之间抽签。”结果抽中了约拿单。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“使签落在我和我儿子约拿单之间。”意思是以签决定。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַפִּילוּ
  choice: 抽签
  rationale: 这是נפל的使役式复数祈使语，字面为“使……落下”；结合上下文以签判定的场景，译为现代汉语习用的“抽签”，补出原文隐含的“签”。
- source_word: בֵּינִי וּבֵין
  choice: 在我和……之间
  rationale: 成对介词表示在两方之间作出选择；此译准确保留双方对举的结构。
- source_word: בְּנִי
  choice: 我儿子
  rationale: בֵּן加第一人称单数词尾明确表示“我的儿子”；“我儿子”自然、简洁。
- source_word: וַיִּלָּכֵד
  choice: 结果抽中了
  rationale: לכד的尼פעל式在此表示被签选中或标明。译作“抽中了”清楚呈现语境中的被动结果；加“结果”体现叙事推进，而不赋予额外神学判断。
- source_word: יוֹנָתָן
  choice: 约拿单
  rationale: 采用现代中文圣经人名的通行译法。
- source_word: וַיֹּאמֶר
  choice: 扫罗说
  rationale: 连续式叙事动词推进情节；汉语无需机械译出连接词，也能自然表达先后关系。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“抽签”明示希伯来语按语境省略的宾语；末句用“结果抽中了约拿单”，避免“约拿单被抓住”在现代汉语中可能造成遭逮捕的误解。脚注保留原文“使……落下”的字面意象。
