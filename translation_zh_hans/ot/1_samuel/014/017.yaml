base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/017.yaml
  text: Then Saul said to the people who were with him[a], “Please take a count and see who has gone from among us.” So they took a count, and behold, Jonathan and his armor-bearer were not there.
translation:
  language: zh_hans
  text: 扫罗对同他在一起的人说：“请查点一下人数，看看谁离开我们了。”他们就查点人数，发现约拿单和替他拿兵器的人都不在。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “查点”也可译为“清点”或“点名”。这里的希伯来语动词指核查在场人员，以查明谁缺席。
    reason: 说明重复出现的“查点”所对应的人员核查含义及可行译法。
lexical_decisions:
- source_word: פִּקְדוּ / וַיִּפְקְדוּ
  choice: 点点人数 / 点了人数
  rationale: 此处 פקד 指核查在场人员，以确定谁不在；“点人数”既贴近原义，也符合现代汉语表达。第一次用重叠式“点点”配合 נָא 的缓和语气，第二次保持词义一致。
- source_word: נָא
  choice: 请
  rationale: נָא 缓和命令语气；“请”自然传达请求意味。
- source_word: וּרְאוּ
  choice: 看看
  rationale: 保留“看”的基本意义，同时重叠式在现代汉语中自然表达经查明、确认之意，并与前面的请求语气协调。
- source_word: מִי הָלַךְ מֵעִמָּנוּ
  choice: 谁从我们中间走了
  rationale: 保留 הלך 的“走、离去”和 מֵעִמָּנוּ 的群体性含义，不额外说明离开的目的。
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: הִנֵּה 引出值得注意的发现；“看哪”保留叙事中的突显作用和庄重语体。
- source_word: נֹשֵׂא כֵלָיו
  choice: 给他拿兵器的人
  rationale: 该短语直指为约拿单携带兵器者；这一译法比专门称谓更透明，普通现代读者容易理解。
- source_word: אֵין יוֹנָתָן וְנֹשֵׂא כֵלָיו
  choice: 约拿单和给他拿兵器的人不在
  rationale: 用自然汉语表达希伯来文所陈述的二人缺席，不把 אֵין 生硬直译为“没有”。
