revisions:
- from: 扫罗对跟随他的百姓说：“请点点人数，看看谁从我们中间走了。”他们就点了人数；看哪，约拿单和给他拿兵器的人不在。[a]
  to: 扫罗对同他在一起的人说：“请查点一下人数，看看谁离开我们了。”他们就查点人数，发现约拿单和替他拿兵器的人都不在。[a]
  rationale: 修订避免把“同在的人”解释为“跟随者”，并以现代自然的“查点”“离开我们”表达人员核查和离开队伍。将发现结果译为“发现”，在不使用较文言的“看哪”之余保留其叙事突显功能。脚注改为说明本节重复的核心动词，并删除可能误导的“护兵”替代说法。
