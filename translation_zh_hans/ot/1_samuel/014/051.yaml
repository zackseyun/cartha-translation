  text: Kish was the father of Saul[a], and Ner was the father of Abner, the son of Abiel.
translation:
  language: zh_hans
  text: 基士是扫罗的父亲，尼珥是押尼珥的父亲；基士和尼珥都是亚比业的儿子。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译可作：“基士，扫罗的父亲；尼珥，押尼珥的父亲，亚比业的儿子。”末尾“亚比业的儿子”在原文中是单数，句法上也可能只修饰尼珥；本节译文结合9:1，将它理解为同时说明基士和尼珥的父系。
    reason: textual_ambiguity
lexical_decisions:
- source_word: וְקִישׁ
  choice: 基士
  rationale: 专有男性人名，采用现代中文圣经中通行的音译。
- source_word: אֲבִי שָׁאוּל
  choice: 是扫罗的父亲
  rationale: 原文是无系词的家谱性名词结构“扫罗的父亲”；中文补出“是”，使句子自然明确。
- source_word: וְנֵר
  choice: 尼珥
  rationale: 专有男性人名，采用通行音译；前面的连接词通过整句并列结构表达。
- source_word: אֲבִי אַבְנֵר
  choice: 是押尼珥的父亲
  rationale: 保留与前半句平行的家谱表达，并补出中文所需的“是”。
- source_word: בֶּן אֲבִיאֵל
  choice: 基士和尼珥都是亚比业的儿子
  rationale: 原文形式为单数“亚比业的儿子”，紧接在两个平行的父子关系之后。结合本书9:1所载基士为亚比业之子，这里理解为基士和尼珥同出于亚比业；中文用“都是”明确该家谱关系，同时以脚注保留原文单数形式及其可能产生的句法歧义。
