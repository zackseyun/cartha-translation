  text: וְ/אִם כֹּ֨ה יֹאמְר֜וּ עֲל֤וּ עָלֵ֨י/נוּ֙ וְ/עָלִ֔ינוּ כִּֽי נְתָנָ֥/ם יְהוָ֖ה בְּ/יָדֵ֑/נוּ וְ/זֶה לָּ֖/נוּ הָ/אֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/010.yaml
  text: But if they say this[a], ‘Come up to us,’ then we will go up, for Yahweh has given them into our hand[b], and this will be the sign for us.
translation:
  language: zh_hans
  text: 但如果他们这样说：“上到我们这里来！”[a]我们就上去，因为耶和华已经把他们交在我们手中[b]；这就作为我们的记号。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“上来攻击我们。”此处可指向说话者所在之处上来；在军事语境中，也可含有敌对的意味。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语直译“在我们手中”，是指落在我们的权势或掌控之下。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: 但如果
  rationale: 承接上一节的另一种条件，同时形成对比；“但如果”符合现代汉语的篇章衔接。
- source_word: כֹּה יֹאמְרוּ
  choice: 他们这样说
  rationale: כֹּה引出后面的直接引语；译为“这样说”自然且保留指示作用。
- source_word: עֲלוּ עָלֵינוּ
  choice: 上到我们这里来
  rationale: 保留עלה所表达的向上移动，以及על在此指向非利士人所在阵地的意思；军事敌意由语境体现，不直接加入“攻打”。
- source_word: וְעָלִינוּ
  choice: 我们就上去
  rationale: 此处连续式表达条件成立后的结果，用“就”清楚呈现后承关系。
- source_word: כִּי נְתָנָם
  choice: 因为……已经把他们交在
  rationale: כִּי引出采取行动的理由；完成式表达约拿单在兆头出现后对结果的确信，“已经”体现其确定性。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神名音译“耶和华”，以专名而非称号呈现四字神名。
- source_word: בְּיָדֵנוּ
  choice: 在我们手中
  rationale: 保留希伯来文“手”的意象；现代汉语“交在我们手中”也自然表达落入掌控。
- source_word: וְזֶה לָּנוּ הָאוֹת
  choice: 这就是给我们的兆头
  rationale: 准确表达该事件将成为他们所求的确认标志；“兆头”在此比日常的“记号”更能体现预示和确认作用。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名，应译作专名而非以“主”替代；“耶和华”是现代中文普通读者最熟悉且具尊严的传统音译。
- issue: 完成式נְתָנָם所表达的确定性
  choice: 已经把他们交在我们手中
  alternative: 必把他们交在我们手中
  rationale: 保留希伯来文完成式把尚待实现之胜利视为已确定的表达，不把它简化为一般将来时；这里呈现约拿单因兆头而有的确信，并不额外界定神意旨的运作方式。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“上到我们这里来”保留地势方向和原文可含敌意的开放性；正文保留“手中”的希伯来语意象，并用脚注解释其惯用意义。所有脚注标记均已置于正文相应位置。
