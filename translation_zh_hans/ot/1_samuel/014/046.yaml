  text: Then Saul went up from pursuing the Philistines[a], and the Philistines went to their own place.
translation:
  language: zh_hans
  text: 于是，扫罗停止追赶非利士人[a]，非利士人就往自己的地方去了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“于是，扫罗从非利士人后面撤走。”希伯来语直译为“从非利士人后面上去”，这里指结束追赶。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: 停止
  rationale: עלה本义为“上去”，但与מֵאַחֲרֵי连用并置于军事追击语境中，表达离开、结束追赶；现代汉语用“停止追赶”自然传达该习语。
- source_word: מֵאַחֲרֵי
  choice: 追赶
  rationale: 该短语字面为“从……后面离开”，在此指不再追击非利士人；与前面的动词合译为“停止追赶”。
- source_word: פְּלִשְׁתִּים
  choice: 非利士人
  rationale: 采用该族名在现代中文圣经及一般中文中的通行译法。
- source_word: הָלְכוּ
  choice: 去了
  rationale: הלך是普通的“去、行走”；在“到自己的地方”这一方向补语下，译作“去了”直接自然，同时不把动词本身过度解释为“返回”。
- source_word: לִמְקוֹמָם
  choice: 回到自己的地方
  rationale: 字面为“到他们的地方”。“自己的地方”保留所属关系；根据双方停止交战的语境，以“回到”使中文顺畅，但不具体化为“家乡”或“营地”。
