base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/032.yaml
  text: Then the people rushed upon the spoil and took sheep and cattle and calves[a], and they slaughtered them on the ground[b], and the people ate with the blood.
translation:
  language: zh_hans
  text: 百姓便扑向战利品[a]，取了羊、牛和牛犊，把它们宰在地上；百姓吃肉时，连血也一起吃了[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这个希伯来语短语也可译作“百姓扑在掳物上”或“百姓转向战利品”。
    reason: lexical_alternative
  - marker: b
    text: 原文的简短说法可译作“连同血吃了”；意思是肉里的血尚未妥善放净，他们就吃了。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ הָעָם אֶל־שָׁלָל
  choice: 百姓便扑向战利品
  rationale: 这个少见的短语在本段语境中表示百姓因饥饿而急切、近乎失控地奔向并取用战利品。“扑向”既传达动作的突然和猛烈，也避免把原文弱化为单纯的“转向”。
- source_word: שָׁלָל
  choice: 战利品
  rationale: 指战争中夺得的财物或牲畜；“战利品”是现代汉语中清楚、自然的军事用语。
- source_word: צֹאן
  choice: 羊
  rationale: 该词可泛指羊群，包括绵羊和山羊；此处动物并列，汉语用概括性的“羊”最自然。
- source_word: בָּקָר
  choice: 牛
  rationale: 泛指牛类牲畜；“牛”准确而简洁。
- source_word: בְּנֵי בָקָר
  choice: 牛犊
  rationale: 字面为“牛之子”，是幼牛的惯用表达；译作“牛犊”符合现代汉语。
- source_word: וַיִּשְׁחֲטוּ אָרְצָה
  choice: 就地宰杀
  rationale: אָרְצָה 表示在地上或向着地面。“就地宰杀”自然地表达他们直接在那里、在地上宰杀牲畜，同时不在正文中加入原文未明说的操作细节。
- source_word: עַל־הַדָּם
  choice: 吃了那些还带着血的肉
  rationale: 原文短语极简，字面近于“连同血吃”。现代汉语若直译为“在血上吃”容易误解；此译清楚表达肉中的血尚未放净，同时由脚注保留希伯来语的简短措辞。
theological_decisions:
- issue: 是否在正文中明确 עַל־הַדָּם 所指的违例行为
  choice: 吃了那些还带着血的肉
  alternative: 连同血吃了／在血上吃了
  rationale: 上下文表明问题在于宰杀后未妥善放血便食用。正文采用自然而不过度扩展的表达，使现代读者理解行为本身；脚注说明原文的字面简洁形式，不进一步加入律法评价。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“扑向”呈现百姓饥饿之下急切失控的动作；“就地宰杀”简洁保留场景；末句为汉语可理解性略作显明，同时以脚注保留原文措辞。
