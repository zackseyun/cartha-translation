  text: וַ/יֹּ֨אמֶר הָ/עָ֜ם אֶל שָׁא֗וּל הֲֽ/יוֹנָתָ֤ן יָמוּת֙ אֲשֶׁ֣ר עָ֠שָׂה הַ/יְשׁוּעָ֨ה הַ/גְּדוֹלָ֣ה הַ/זֹּאת֮ בְּ/יִשְׂרָאֵל֒ חָלִ֗ילָ/ה חַי יְהוָה֙ אִם יִפֹּ֞ל מִ/שַּׂעֲרַ֤ת רֹאשׁ/וֹ֙ אַ֔רְצָ/ה כִּֽי עִם אֱלֹהִ֥ים עָשָׂ֖ה הַ/יּ֣וֹם הַ/זֶּ֑ה וַ/יִּפְדּ֥וּ הָ/עָ֛ם אֶת יוֹנָתָ֖ן וְ/לֹא מֵֽת־׀־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/045.yaml
  text: But the people said to Saul[a], “Should Jonathan die, who has brought about this great deliverance in Israel? Far from it! As Yahweh lives, not one hair of his head shall fall to the ground, for he has worked with God this day.” So the people redeemed Jonathan[d][c][b], and he did not die.
translation:
  language: zh_hans
  text: 但百姓对扫罗说：“难道约拿单要死吗？他可是在以色列中成就了这场大拯救的！绝对不可！雅威永活！连他的一根头发也不会落在地上，因为他今天是与上帝一同行事的。”于是百姓救赎了约拿单[a]，他就没有死。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “救赎”也可译作“救下”“解救”或“赎出”。原文动词含有使人从某种要求、刑罚或死亡中获释的意思；这里没有说明百姓是否付了赎价。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיוֹנָתָן יָמוּת
  choice: 难道他该死吗
  rationale: 疑问词与未完成式在此构成带强烈抗议意味的反问；“难道……该死吗”自然传达百姓的愤慨，而不把它弱化为对未来事实的询问。
- source_word: הַיְשׁוּעָה הַגְּדוֹלָה הַזֹּאת
  choice: 这场大拯救
  rationale: יְשׁוּעָה 在军事语境中兼有拯救、解救和胜利之意；“大拯救”保留上帝施救的神学维度，又不把含义缩窄为单纯的战果。
- source_word: בְּיִשְׂרָאֵל
  choice: 在以色列
  rationale: 保留介词 ב 所表达的范围，说明这场拯救发生在以色列中，同时自然蕴含其惠及以色列。
- source_word: חָלִילָה
  choice: 绝对不可
  rationale: 这是强烈否定和拒绝的感叹语；“绝对不可”符合现代汉语表达，也不额外加入原文未明说的神名。
- source_word: חַי יְהוָה
  choice: 我们指着永活的雅威起誓
  rationale: 这是标准起誓公式。汉语补出“起誓”，使语用功能清楚；“永活的雅威”保留神名及其活着的宣告。
- source_word: אִם יִפֹּל מִשַּׂעֲרַת רֹאשׁוֹ אַרְצָה
  choice: 连他的一根头发也不会落在地上
  rationale: 在起誓公式之后，אִם 表达强调性的否定；此惯用语表示约拿单必得完全保全。
- source_word: כִּי עִם אֱלֹהִים עָשָׂה
  choice: 因为他今天是与上帝一同做成这事的
  rationale: 按原文保留 עִם 的“与……一同”，不将其解释性改写为“靠上帝帮助”或“为上帝”，从而保留神人行动关系的张力。
- source_word: וַיִּפְדּוּ הָעָם אֶת יוֹנָתָן
  choice: 于是百姓赎回了约拿单
  rationale: פדה 表示从某种权利要求、刑罚或死亡中赎出、释放；“赎回”保留其法律与救拔色彩，而不泛化为普通的“救下”。
- source_word: וְלֹא מֵת
  choice: 他就没有死
  rationale: 直接陈述百姓介入后的结果；“就”自然体现叙事中的结果关系，却不改写为较强解释性的“没有被处死”。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；音译为“雅威”保留其作为立约之神专名的性质，不以称号替代。
- issue: עִם אֱלֹהִים 所表达的神人行动关系
  choice: 与上帝一同做成这事
  alternative: 靠上帝的帮助做成这事
  rationale: עִם 最自然的意义是“与……一同”。直译保留原文对于约拿单行动与上帝同在、协力之间关系的开放性，避免过早规定具体的因果或代理模式。
- issue: פדה 在约拿单获释事件中的含义
  choice: 赎回
  alternative: 救下
  rationale: “赎回”保留从死亡判决或誓言所形成的要求下使人获释的意味，但不主张百姓实际支付了赎价。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“难道……该死吗”“绝对不可”传达百姓强烈抗议的语气；“与上帝一同做成”有意保留原文的神学张力。脚注标记紧随“赎回了约拿单”之后。
