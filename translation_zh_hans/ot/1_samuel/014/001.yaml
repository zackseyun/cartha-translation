base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/001.yaml
  text: One day Jonathan son of Saul said to the young man who carried his armor[a], “Come[b], let us cross over to the Philistine garrison that is on the other side.” But he did not tell his father.
translation:
  language: zh_hans
  text: 有一天，扫罗的儿子约拿单对给他拿兵器的年轻人说：“来，我们到对面那边的非利士人驻地[a][b]去。”但他没有告诉父亲。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“非利士人的驻军”或“非利士人的哨站”。希伯来语这个词既可指驻扎的部队，也可指军事据点。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语直译近于“在这边的另一边”。这里可能是指下文所描述、两边有峭壁的通道，但原文没有明说“通道”或“隘口”。
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי הַיּוֹם
  choice: 有一天
  rationale: 这是希伯来叙事中常见的时间引入语；译为“有一天”自然、简洁，也不额外加入原文没有明确表达的“现在”。
- source_word: הַנַּעַר
  choice: 年轻人
  rationale: נַעַר 可指男孩、青年或仆人；此人承担军事随从的职责，译作“年轻人”最符合语境，又不把身份解释得过死。
- source_word: נֹשֵׂא כֵלָיו
  choice: 给他拿兵器的
  rationale: 原文直指“拿着他的器具／兵器的人”。“给他拿兵器的”保留描述性结构，比直接使用职衔更贴近原文，也符合现代汉语。
- source_word: לְכָה וְנַעְבְּרָה
  choice: 来，我们到……去
  rationale: לְכָה 是催促语“来”，后接表示共同意愿的“让我们过去”。汉语以“来，我们到对面……去”自然表达这一邀请及越到另一边的方向感。
- source_word: מַצַּב פְּלִשְׁתִּים
  choice: 非利士人的驻地
  rationale: מַצָּב 在军事语境中可指驻扎的部队，也可指其据点。“驻地”在正文中较自然，并以脚注保留“驻军／哨站”的词义范围。
- source_word: אֲשֶׁר מֵעֵבֶר הַלָּז
  choice: 对面那边
  rationale: 该短语带有空间指示，基本意思是“在那一边／对面那边”。原文并未明说“隘口”，因此正文不补入该名词，并用脚注说明与下文地形的可能联系。
- source_word: וּלְאָבִיו לֹא הִגִּיד
  choice: 但他没有告诉父亲
  rationale: 此句是带转折意味的叙事补充。“但”自然表现上下文关系；汉语中所属关系明确，无须补出“他的”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“给他拿兵器的年轻人”避免生硬职衔，同时贴近希伯来语的描述性表达；空间短语保持原文的指示性与一定含混度，不在正文中提前补明下文才出现的地形。
