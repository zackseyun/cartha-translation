base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/014.yaml
  text: That first slaughter[a], which Jonathan and his armor-bearer made, was about twenty men within about half a furrow in an acre of a field.
translation:
  language: zh_hans
  text: 约拿单和替他拿兵器的人发动的第一次攻击，击杀了约二十人；地点约在一块田中，范围约有一对牛所犁之地的半畦那么大。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译近于“约半条犁沟，一对〔牛／轭〕的田地”。这是一种难以确定的古代农业量地说法；“一对〔牛／轭〕的田地”可能指一对牛所能耕犁的土地，前面的“半条犁沟”与之如何相连则有不同理解。因此确切面积不详。
    reason: 原文农业量地短语的词义和句法关系均有不确定性；脚注保留主要理解，避免擅自换算为现代面积单位。
lexical_decisions:
- source_word: הַמַּכָּה הָרִאשֹׁנָה
  choice: 头一次击杀
  rationale: מַכָּה在此军事语境中指造成伤亡的打击；译作“击杀”体现致命结果，又比“屠杀”更适合叙述约拿单发动的首次攻击。הָרִאשֹׁנָה译作“头一次”，自然地表达首次行动。
- source_word: אֲשֶׁר הִכָּה
  choice: 击杀了
  rationale: נכה的基本意象是击打，在本节伤亡语境中指击倒并杀死。中文用“击杀”兼顾动作和结果，同时避免把希伯来语名词与动词的同根表达译得生硬重复。
- source_word: וְנֹשֵׂא כֵלָיו
  choice: 和替他拿兵器的人
  rationale: 直译保留“拿/携带其器具”的角色称谓，现代读者容易理解，也不把כֵלִים过窄地限定为防护性的“盔甲”。
- source_word: כְּעֶשְׂרִים אִישׁ
  choice: 约二十人
  rationale: 前缀כ־在此表示约数；“约二十人”简洁自然。
- source_word: כְּבַחֲצִי מַעֲנָה צֶמֶד שָׂדֶה
  choice: 范围约有一对牛所犁之地的半畦那么大
  rationale: 保留农业量地意象及重复出现的约数含义。מַעֲנָה可指犁沟、畦或犁过的条带；צֶמֶד在此与一对套轭耕牛及其可犁面积相关。原文结构和确切面积均不明确，因此正文采用可理解但不换算为现代单位的表达，并以脚注说明。
