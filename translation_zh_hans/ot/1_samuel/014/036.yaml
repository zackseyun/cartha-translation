  text: וַ/יֹּ֣אמֶר שָׁא֡וּל נֵרְדָ֣ה אַחֲרֵי֩ פְלִשְׁתִּ֨ים לַ֜יְלָה וְֽ/נָבֹ֥זָה בָ/הֶ֣ם עַד א֣וֹר הַ/בֹּ֗קֶר וְ/לֹֽא נַשְׁאֵ֤ר בָּ/הֶם֙ אִ֔ישׁ וַ/יֹּ֣אמְר֔וּ כָּל הַ/טּ֥וֹב בְּ/עֵינֶ֖י/ךָ עֲשֵׂ֑ה וַ/יֹּ֨אמֶר֙ הַ/כֹּהֵ֔ן נִקְרְבָ֥ה הֲלֹ֖ם אֶל הָ/אֱלֹהִֽים׀׀־־־ס־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/036.yaml
  text: Then Saul said[a], “Let us go down after the Philistines by night and plunder them until the light of the morning, and let us not leave a man among them.” And they said, “Do whatever seems good in your eyes.” But the priest said, “Let us draw near here to God.”
translation:
  language: zh_hans
  text: 扫罗说：“我们趁夜下去追赶非利士人，抢掠他们，直到晨光出现；他们中间一个人也不留下。”众人说：“你看怎么好，就怎么做。”但祭司说：“我们到这里来亲近上帝吧[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我们到这里来，到上帝面前来。”祭司的话很可能是要众人在行动前寻求上帝的指引。
    reason: 说明“亲近”的替代译法及其语境含义，同时不在正文中将其明确改译为“求问”，也不添加原文未明说的时间次序。
lexical_decisions:
- source_word: נֵרְדָה
  choice: 我们……下去
  rationale: 保留 ירד 的方向含义及第一人称复数劝勉语气；“下去”在中文叙事中自然。
- source_word: אַחֲרֵי פְלִשְׁתִּים
  choice: 追赶非利士人
  rationale: אַחֲרֵי 字面为“在……后面”，军事语境中表示追击；中文以“追赶”清楚传达语境含义。
- source_word: לַיְלָה
  choice: 趁夜
  rationale: 表达夜间行动的时间背景，不额外限定为“今晚”。
- source_word: וְנָבֹזָה בָהֶם
  choice: 抢掠他们
  rationale: בזז 表示抢掠、掳掠；中文及物表达自然，也保留对非利士人施行抢掠的含义。
- source_word: עַד אוֹר הַבֹּקֶר
  choice: 直到晨光出现
  rationale: 保留原文“早晨的光”的意象，同时符合现代汉语表达。
- source_word: וְלֹא נַשְׁאֵר בָּהֶם אִישׁ
  choice: 他们中间一个人也不留下
  rationale: 保留 אִישׁ 的单数分配性表达和彻底消灭的含义，但不添加原文未明说的“活口”。
- source_word: כָּל הַטּוֹב בְּעֵינֶיךָ עֲשֵׂה
  choice: 你看怎么好，就怎么做
  rationale: 自然呈现希伯来语“在你眼中为好”的惯用表达，并保留由扫罗自行判断的意味。
- source_word: נִקְרְבָה הֲלֹם אֶל הָאֱלֹהִים
  choice: 我们先在这里亲近上帝
  rationale: “亲近上帝”保留 קרב 的接近含义，“在这里”对应 הֲלֹם；“先”根据祭司在行动前提出异议的语境，使中文衔接自然，但不把具体仪式写入正文。
theological_decisions:
- issue: 祭司是否明确要求求问上帝
  choice: 译作“我们先在这里亲近上帝”
  alternative: “我们先在这里求问上帝”
  rationale: 原文使用“亲近、接近”而非明确的“求问”动词。上下文很可能暗示在出战前寻求上帝指引，但正文不把这种暗示具体化为某种祭司仪式。
translation_notes:
  register: 采用现代、庄重而清楚的叙事语言。“趁夜”“晨光出现”保留原文的时间和光亮意象；祭司的话保持含蓄，不替原文明确具体的求问程序。
