id: 1SA.14.23
reference: 1 Samuel 14:23
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יּ֧וֹשַׁע יְהוָ֛ה בַּ/יּ֥וֹם הַ/ה֖וּא אֶת יִשְׂרָאֵ֑ל וְ/הַ֨/מִּלְחָמָ֔ה עָבְרָ֖ה אֶת בֵּ֥ית אָֽוֶן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/023.yaml
  text: So Yahweh saved Israel that day[a], and the battle passed beyond Beth-aven.
translation:
  language: zh_hans
  text: 当日，雅威拯救了以色列；战事越过了伯亚文[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“战事经过了伯亚文”，或“战事推进到伯亚文以外”。
    reason: 原文עָבְרָה אֶת既可侧重经过、越过某地，也可在此语境中表达战事向该地以外推进。
lexical_decisions:
- source_word: וַיּוֹשַׁע
  choice: 拯救了
  rationale: 该词是ישׁע的使役式，表示使人得救、脱离危难。译作“拯救了”既简洁，也保留雅威亲自施行救助的神学分量；“使……得胜”虽符合战事情境，却缩窄了原词含义。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文四字神名音译为“雅威”，保留其作为以色列之神专名的性质，而不以称号代替。
- source_word: בַּיּוֹם הַהוּא
  choice: 当日
  rationale: 自然、庄重地表达“在那一天”，并与叙事语体相称。
- source_word: אֶת יִשְׂרָאֵל
  choice: 以色列
  rationale: 直译民族名称；此处整体指以色列民及其作战群体。
- source_word: וְהַמִּלְחָמָה
  choice: 战事
  rationale: מִלְחָמָה可指战争或战斗；此处描述正在推进的具体交战，译作“战事”自然，并能与表示移动的谓语搭配。
- source_word: עָבְרָה אֶת בֵּית אָוֶן
  choice: 越过了伯亚文
  rationale: עבר表示经过、越过或向前推进；与地点及宾语标记אֶת连用时，伯亚文可理解为战事经过并越过的地点。“越过了”保留空间移动，也不把军事推进的细节说得过实。
- source_word: בֵּית אָוֶן
  choice: 伯亚文
  rationale: 采用该地名在现代中文圣经语境中通行且易辨识的音译。
theological_decisions:
- issue: 如何译出神名יְהוָה
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用以色列之神的专名。音译“雅威”可保留专名身份，并避免用称号取代原文神名。
- issue: וַיּוֹשַׁע在战事情境中的含义
  choice: 拯救了
  alternative: 使……得胜；解救了
  rationale: “拯救”保留原词较宽的救助、解救意义，同时让上下文表明这次拯救包含军事胜利；不将其直接收窄为“使……得胜”。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“当日”简洁承接上下文；分号体现雅威施行拯救与战事推进之间紧密但并列的关系。脚注标记紧接存在词义与空间关系歧义的短语。
