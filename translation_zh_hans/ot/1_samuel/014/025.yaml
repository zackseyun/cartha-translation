  yaml_path: translation/ot/1_samuel/014/025.yaml
  text: And all the people of the land entered the forest[b][a], and there was honey on the surface of the ground.
translation:
  language: zh_hans
  text: 那地所有的人[a]都进了树林，地面上有蜜[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“全地都进了树林”；这里的“全地”很可能是以地域代指全体的人。
    reason: lexical_alternative
  - marker: b
    text: 或译：“田野表面有蜜。”这里的希伯来语也可泛指可见的地面。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כָל הָ/אָ֖רֶץ
  choice: 全地的人
  rationale: 希伯来文直译为“全地”，但复数动词 בָּאוּ 和上下文表明这里以地域代指其中的人；译作“全地的人”既显明集合意义，也保留范围感。
- source_word: בָּ֣אוּ בַ/יָּ֑עַר
  choice: 进了树林
  rationale: בוא 后接表示地点的介词短语，在此自然表示进入；יַעַר 指树林或森林。现代汉语中“进了树林”简洁自然。
- source_word: וַ/יְהִ֥י
  choice: 只见……有
  rationale: 此处 היה 引入场景中存在的事物。“只见……有”自然呈现叙事视角，不额外改变事件含义。
- source_word: דְבַ֖שׁ
  choice: 蜜
  rationale: דבש 通常指蜂蜜；原文未明确说“野蜜”，故不作增补。
- source_word: עַל פְּנֵ֥י הַ/שָּׂדֶֽה
  choice: 地面上
  rationale: עַל־פני 表示“在……表面上”；שדה 虽常指田野，在树林语境中可泛指地面或野地。译作“地面上”避免使读者误以为蜜位于耕田中，同时保留可见表面的意象。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“全地的人”保留原文的转喻；“地面上”切合树林语境。脚注标记均置于相关正文之后。
