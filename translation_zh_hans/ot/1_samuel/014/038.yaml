  text: וַ/יֹּ֣אמֶר שָׁא֔וּל גֹּ֣שֽׁוּ הֲלֹ֔ם כֹּ֖ל פִּנּ֣וֹת הָ/עָ֑ם וּ/דְע֣וּ וּ/רְא֔וּ בַּ/מָּ֗ה הָֽיְתָ֛ה הַ/חַטָּ֥את הַ/זֹּ֖את הַ/יּֽוֹם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/038.yaml
  text: Then Saul said[a], “Come here, all you chiefs of the people, and know and see by what this sin has happened today.”
translation:
  language: zh_hans
  text: 扫罗说：“民众的众首领[a]，你们都到这里来！要查明并察看，今天这罪是怎么发生的。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“民众所有的角”，是指民众中的首领或代表。
    reason: 说明希伯来语习语的字面形式及其在此处的含义。
lexical_decisions:
- source_word: גֹּשׁוּ הֲלֹם
  choice: 都到这里来
  rationale: 复数祈使式配合表示地点的 הֲלֹם，是召集众人来到扫罗所在之处；此译自然地表达召唤语气。
- source_word: כֹּל פִּנּוֹת הָעָם
  choice: 民众的各位首领
  rationale: 字面为“民众所有的角”，在此是指民众中居于要位的首领或代表。正文译出习语所指，脚注保留其字面形象。
- source_word: וּדְעוּ וּרְאוּ
  choice: 查明察看
  rationale: 保留两个并列祈使动词的强调作用，同时用现代汉语表达调查并确认的意思。
- source_word: בַּמָּה
  choice: 究竟是怎样
  rationale: 介词 ב 与疑问词 מָה 在此询问这罪发生的方式或缘由；“究竟是怎样”既符合语境，也不限定具体手段。
- source_word: הָיְתָה
  choice: 发生
  rationale: 该动词字面为“成为、存在”，在这里指这罪如何出现或发生。
- source_word: הַחַטָּאת הַזֹּאת
  choice: 这罪
  rationale: חַטָּאת 在叙事中指导致上帝不回应的犯罪之事；译作“罪”保留其明确的道德与神学分量。
- source_word: הַיּוֹם
  choice: 今天
  rationale: 准确、自然地表达时间副词。
theological_decisions:
- issue: כֹּל פִּנּוֹת הָעָם 的习语含义
  choice: 正文译作“民众的各位首领”
  alternative: 民众所有的角；民众各方的代表
  rationale: 此处不是指实际的“角”，而是指民众中的首领或代表。正文采用清楚的习语义，同时以脚注呈现原文意象。
- issue: חַטָּאת 的道德含义
  choice: 译作“罪”
  alternative: 过犯；罪责；恶行
  rationale: 上下文涉及人在上帝面前的违犯；“罪”最直接地保留原词的道德和神学力度，又不超出原文。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“都到这里来”保留召集语气；“查明察看”保留原文两个并列命令的力度；用“究竟”体现问查语境，但不替原文断定罪的具体性质或成因。
