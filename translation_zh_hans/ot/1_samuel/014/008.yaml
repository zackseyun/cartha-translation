  yaml_path: translation/ot/1_samuel/014/008.yaml
  text: Jonathan said[a], “Look, we are crossing over to the men, and we will show ourselves to them.”
translation:
  language: zh_hans
  text: 约拿单说：“看，我们要过去，到那些人那里去，并向他们现身。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 这是叙事中引出直接引语的常用表达；译作“说”自然准确。
- source_word: יְהוֹנָתָן
  choice: 约拿单
  rationale: 采用现代中文圣经人名的通行音译。
- source_word: הִנֵּה
  choice: 看
  rationale: 此词用于唤起听者注意，引出约拿单眼下的行动计划；“看”简洁地保留了这一话语功能。
- source_word: אֲנַחְנוּ עֹבְרִים
  choice: 我们这就到……去
  rationale: 显明的复数代词保留主语强调；分词在此表示即将采取的行动，“这就……去”比机械直译为“正在过去”更符合上下文和现代汉语表达。
- source_word: אֶל הָאֲנָשִׁים
  choice: 到那些人那里
  rationale: 定冠词所指的是上下文中可辨认的非利士驻军人员；“那些人”既保留指称，也符合中文叙事习惯。
- source_word: וְנִגְלִינוּ אֲלֵיהֶם
  choice: 现身给他们看
  rationale: גלה 的尼法勒式在此表示主动让对方发现或看见自己；“现身给他们看”自然地传达刻意显露行踪的意思，而不加入额外解释。
