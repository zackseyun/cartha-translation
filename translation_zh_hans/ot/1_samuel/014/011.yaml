base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/011.yaml
  text: When the two of them revealed themselves to the Philistine garrison[a], the Philistines said, “Look[b], the Hebrews are coming out of the holes where they had hidden themselves.”
translation:
  language: zh_hans
  text: 他们二人就在非利士人的驻军面前现身[a]。非利士人说：“看哪，希伯来人[b]正从他们藏身的洞穴里出来！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“向非利士人的哨所现身。”
    reason: lexical_alternative
  - marker: b
    text: “希伯来人”是非利士人对以色列人所用的族群称呼。
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּגָּלוּ
  choice: 现身
  rationale: 该词为גלה的尼法勒式；结合上下文，约拿单和拿兵器的人有意让非利士人看见自己。“现身”既自然，也保留主动显露自己的语境含义。
- source_word: שְׁנֵיהֶם
  choice: 他们二人
  rationale: 明确突出约拿单和拿兵器的人这两个人，简洁自然。
- source_word: מַצַּב פְּלִשְׁתִּים
  choice: 非利士人的驻军
  rationale: מַצָּב在此军事语境中可指驻守的部队或哨所；“驻军”保留以驻守人员为中心的理解，地点性的译法列入脚注。
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留引人注意的感叹语气；“看哪”庄重而仍为现代读者所理解。
- source_word: עִבְרִים
  choice: 希伯来人
  rationale: 保留非利士人对以色列人所用的族群称呼，不改译为“以色列人”，从而保存叙事视角。
- source_word: יֹצְאִים
  choice: 正……出来
  rationale: 分词表达说话者眼前正在发生的动作，“正……出来”自然呈现其进行意味。
- source_word: מִן הַחֹרִים
  choice: 从……洞穴里
  rationale: חֹרִים字面指洞、孔穴或凹洞；“洞穴”保留具体意象，又不限定为天然山洞。
- source_word: אֲשֶׁר הִתְחַבְּאוּ שָׁם
  choice: 他们藏身的
  rationale: 该关系从句说明那些洞穴是他们躲藏之处；“藏身”自然传达חבא反身式的含义。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而清楚的叙事语言。“现身”体现二人有意让敌军看见自己；引语用“看哪”保留原文突发而带注意力指向的语气。脚注标记均置于其所说明的词语之后。
