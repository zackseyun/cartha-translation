- from: 他们二人就在非利士人的驻军面前现身[a]。非利士人说：“看哪，希伯来人[b]正从他们藏身的洞穴里出来！”
  to: 他们二人就在非利士人的驻军面前现身[a]。非利士人说：“看哪，希伯来人[b]正从他们藏身的洞穴里出来！”
  rationale: 仅修订脚注a，使其准确反映“驻军”的地点性替代译法，并避免不自然且较原文更强的使役表达。正文无须改动。
