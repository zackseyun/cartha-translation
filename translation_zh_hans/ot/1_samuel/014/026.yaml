base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/026.yaml
  text: When the people came into the forest[a], behold, there was a flow of honey, but no one put his hand to his mouth[c][b], because the people feared the oath.
translation:
  language: zh_hans
  text: 众人进入树林，只见蜜在流淌[a]；可是没有人把手伸到嘴边[b]，因为众人惧怕那誓言[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译近于“蜜的流动”，也可译作“有蜜在流淌”或“一股蜜流”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“没有人把手伸到嘴边”；意思是没有人取蜜来吃。
    reason: lexical_alternative
  - marker: c
    text: “那誓言”指扫罗先前所立的誓言；他宣告，凡在晚上以前吃东西的人必受咒诅（见撒母耳记上14:24）。
    reason: cross_reference
lexical_decisions:
- source_word: וַיָּבֹא
  choice: 来到
  rationale: 该叙事性动词表示众人进入或来到树林；“来到”在现代汉语叙事中自然，也保留了移动含义。
- source_word: הָעָם
  choice: 众人
  rationale: עָם本义较宽，可指“人民、众人”；上下文虽是军旅场景，但原词并非专指军队，因此译作“众人”，并在本节两处保持一致。
- source_word: הַיַּעַר
  choice: 树林
  rationale: יַעַר指树木茂密之地；“树林”是清楚自然的现代汉语表达。
- source_word: וְהִנֵּה
  choice: 只见
  rationale: הִנֵּה用于引起注意并使叙述更鲜明；“只见”既保留其展示作用，又比直译“看哪”更适合此处现代汉语叙事。
- source_word: הֵלֶךְ דְּבָשׁ
  choice: 有蜜流淌
  rationale: 该短语字面近于“蜜的流动/行流”，描述蜜正在流淌；正文采用自然的动词结构，同时以脚注保留名词结构的其他理解。
- source_word: וְאֵין מַשִּׂיג יָדוֹ אֶל פִּיו
  choice: 可是没有人把手送到嘴边
  rationale: 原文具体描写没有人让手够到嘴边，语境含义是无人取蜜来吃；译文保留这一身体动作，而不直接改写为“没有人吃蜜”。
- source_word: כִּי יָרֵא הָעָם
  choice: 因为众人惧怕
  rationale: כִּי说明原因；יָרֵא在此指因违背所起之誓的后果而害怕。“惧怕”简洁地保留原文措辞。
- source_word: הַשְּׁבֻעָה
  choice: 那誓言
  rationale: שְׁבֻעָה通常指誓言或誓约。定冠词及上下文指向扫罗先前所立、带有咒诅后果的誓言；正文仍按词义译作“誓言”，不改译为“咒诅”。
theological_decisions:
- issue: “誓言”与其咒诅性质的关系
  choice: 正文译作“那誓言”
  alternative: “那咒诅”
  rationale: 本节所用名词是שְׁבֻעָה（誓言），而14:24表明该誓言对违犯者带有咒诅后果。译文保留本节的词汇选择，并在脚注交代上下文，不把两者等同。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“只见”传达הִנֵּה的现场感；“把手送到嘴边”保留希伯来文的具体意象；分号呈现所见之蜜与众人不敢取食之间的转折。所有脚注标记均按所解释的词语紧邻安放。
