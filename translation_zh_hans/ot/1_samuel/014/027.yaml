base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/027.yaml
  text: But Jonathan had not heard when his father put the people under oath[a], so he stretched out the tip of the staff that was in his hand and dipped it into the honeycomb, and he brought his hand to his mouth[b], and his eyes brightened.
translation:
  language: zh_hans
  text: 约拿单却没有听见他父亲使百姓起誓。他就把手中杖的尖端伸出去，蘸在蜜脾[a]里，然后把手放到嘴边；他的眼睛就明亮起来[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文较直译为“蜂蜜的树林（或密丛）”；这里可能指蜜脾，或一大片浓密的蜂蜜。
    reason: lexical_alternative
  - marker: b
    text: “眼睛明亮起来”是希伯来语的形象说法，表示吃过东西后恢复了精力和警醒。
    reason: cultural_note
lexical_decisions:
- source_word: שָׁמַע
  choice: 没有听见
  rationale: 上下文强调约拿单当时并不知道扫罗所立的誓约，而非故意不听从；汉语“没有听见”自然保留这一含义。
- source_word: בְּהַשְׁבִּיעַ אָבִיו אֶת־הָעָם
  choice: 他父亲叫百姓起誓
  rationale: 使役形式表示使人起誓、使人受誓言约束；此译法通顺，并保留誓言的约束力。
- source_word: וַיִּשְׁלַח אֶת־קְצֵה הַמַּטֶּה
  choice: 伸出手中杖的尖端
  rationale: 在此语境中，动词表示把杖伸出去；“杖的尖端”准确表达所蘸入蜂蜜的部位。
- source_word: בְּיַעְרַת הַדְּבָשׁ
  choice: 蘸进蜜脾
  rationale: יַעְרָה 字面意象与树林、密集之物有关，此处很可能指成片或成块的蜂蜜、蜜脾；正文采用适合动作场景的“蜜脾”，脚注保留字面上的不确定性。
- source_word: וַיָּשֶׁב יָדוֹ אֶל־פִּיו
  choice: 再把手送到嘴边
  rationale: 较贴近希伯来文“使手回到嘴边”的叙述，同时自然表达取蜜食用的动作，不额外补入原文未明说的细节。
- source_word: וַתָּרְאֶנָה עֵינָיו
  choice: 他的眼睛就明亮起来
  rationale: 保留希伯来语的身体意象；该表达在语境中表示吃蜜之后精神和体力恢复、变得警醒。
