  text: כִּ֣י חַי יְהוָ֗ה הַ/מּוֹשִׁ֨יעַ֙ אֶת יִשְׂרָאֵ֔ל כִּ֧י אִם יֶשְׁנ֛/וֹ בְּ/יוֹנָתָ֥ן בְּנִ֖/י כִּ֣י מ֣וֹת יָמ֑וּת וְ/אֵ֥ין עֹנֵ֖/הוּ מִ/כָּל הָ/עָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/039.yaml
  text: For as Yahweh lives[a], who saves Israel, even if it is in Jonathan my son, he shall surely die.” But not one of all the people answered him.
translation:
  language: zh_hans
  text: “我指着拯救以色列、永活的耶和华起誓：即使这事是在我儿子约拿单身上[a]，他也必死！”可是，全体百姓中没有一个人回答他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“即使它是在我儿子约拿单身上”；所指的事物没有明说，上下文暗示是正在查问的罪责或过犯。正文的“这事”仅为使中文句法通顺而加。
    reason: 原文省略所指对象；脚注说明其字面形式、语境所暗示的含义，以及中文泛指代词的功能。
lexical_decisions:
- source_word: חַי יְהוָה
  choice: 我指着永活耶和华起誓
  rationale: 这是希伯来语标准的起誓用语。译文明确表达原文隐含的起誓行为，同时保留“耶和华活着／永活”的庄严意象。
- source_word: הַמּוֹשִׁיעַ אֶת יִשְׂרָאֵל
  choice: 拯救以色列的
  rationale: 带冠词的分词修饰耶和华，刻画他一贯是以色列的拯救者；用“拯救”保留持续性的特征，而不局限于某一次过去的行动。
- source_word: כִּי אִם
  choice: 即使
  rationale: 在誓言语境中引出极端假设，即罪责哪怕涉及扫罗自己的儿子，判决也不会改变。
- source_word: יֶשְׁנוֹ בְּיוֹנָתָן בְּנִי
  choice: 是在我儿子约拿单身上
  rationale: 原文省略了所指之物；译文也不在正文中擅自补明“罪”或“过犯”，从而保留原文的省略与语境张力。
- source_word: מוֹת יָמוּת
  choice: 他也必死
  rationale: 不定式绝对形与未完成式同用，加强死亡判决的确定性；“必死”以简洁、庄严的现代汉语传达这种强调。
- source_word: וְאֵין עֹנֵהוּ מִכָּל הָעָם
  choice: 可是，全体百姓中没有一个人回答他
  rationale: “没有一个人”准确表达整体中的全然无人回应；“可是”体现扫罗严厉誓言与百姓沉默之间的叙事反差。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 采用现代中文圣经读者最熟悉的专名“耶和华”，将四字神名作为名字呈现，而不以普通称号代替。
- issue: 是否明说约拿单身上的是“罪责”
  choice: 正文保留省略，以脚注说明
  alternative: 即使罪责在我儿子约拿单身上
  rationale: 上下文确实暗示所查问的罪责或过犯，但本节希伯来文本没有明说宾语；保留省略可避免把语境推断写成明文。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“我指着……起誓”使希伯来誓言公式在中文中清楚可懂；“永活耶和华”保留原文神学意象。正文不补出原文省略的“罪责”，并将解释放入脚注。
