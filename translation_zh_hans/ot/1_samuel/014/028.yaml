base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/028.yaml
  text: Then one of the people answered and said[a], “Your father strictly put the people under oath, saying[b], ‘Cursed is the man who eats food today.’ So the people were faint.”
translation:
  language: zh_hans
  text: 民中有一人回答说：“你父亲严令百姓起誓，说：‘今天吃东西[a]的人必受咒诅。’”百姓就疲乏了[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “吃东西”原文直译为“吃饼”；这里泛指进食、吃食物。
    reason: lexical_alternative
  - marker: b
    text: 或译：“百姓就困乏了”或“百姓就疲倦了”。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַן
  choice: 回答
  rationale: 这是叙事中常见的回应动词；“回答”保留希伯来语表达，也符合此处有人回应约拿单的语境。
- source_word: אִישׁ מֵהָעָם
  choice: 民中有一个人
  rationale: 既保留说话者为单数且身份未指明，也自然表达“从百姓中出来的一人”。
- source_word: הַשְׁבֵּעַ הִשְׁבִּיעַ
  choice: 严令……起誓
  rationale: 使役式动词表示叫百姓起誓，不定词绝对式加强语气；“严令……起誓”兼顾使役和强调意味。
- source_word: אָבִיךָ
  choice: 你父亲
  rationale: 这是对约拿单的直接称呼，按原文保留第二人称领属关系。
- source_word: אָרוּר
  choice: 必受咒诅
  rationale: 保留咒诅宣告的严肃效力；加“必”使现代汉语中的宣告句自然有力，但不额外说明咒诅的施行者。
- source_word: הָאִישׁ אֲשֶׁר יֹאכַל
  choice: 吃……的人
  rationale: 希伯来语阳性单数在此为概括性的禁令公式；现代汉语用“的人”自然涵盖任何违令者。
- source_word: לֶחֶם
  choice: 食物
  rationale: 该词字面义为“饼、粮食”，但上下文所禁的是进食，且约拿单吃的是蜜；因此正文用上位概念“食物”，脚注保留字面信息。
- source_word: הַיּוֹם
  choice: 今天
  rationale: 准确而自然地表达禁令的时间范围。
- source_word: וַיָּעַף
  choice: 疲惫不堪
  rationale: 该动词表示因劳累或缺乏食物而疲乏、衰弱；此译法自然表达百姓当时的严重疲惫，同时以脚注保留“困乏/发昏”的可能表达。
- source_word: הָעָם
  choice: 百姓
  rationale: 保留原文的集体称谓；上下文表明这里具体指参与作战的民众，但正文不窄化为“军兵”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事文体。“严令……起誓”体现原文的使役和强调结构；“必受咒诅”保留誓言公式的严肃性。脚注标记已放在各自所解释的词语之后，避免咨询层脚注位置错配。
