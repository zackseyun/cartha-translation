revisions:
- from: 民中有一个人回答说：“你父亲严令百姓起誓，说：‘今天吃食物[a]的人必受咒诅。’”因此，百姓都疲惫不堪[b]。
  to: 民中有一人回答说：“你父亲严令百姓起誓，说：‘今天吃东西[a]的人必受咒诅。’”百姓就疲乏了[b]。
  rationale: 修订仅调整汉语搭配，并将末句及其脚注恢复到原文所容许的较宽泛“疲乏／困乏”语义，避免把程度强化为“疲惫不堪”或限定为“饿得发昏”。删除“因此”而用“就”，使叙事衔接自然，并不改变上下文所显示的结果关系。
