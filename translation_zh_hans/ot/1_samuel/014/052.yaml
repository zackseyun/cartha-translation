base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/052.yaml
  text: And the war against the Philistines was severe all the days of Saul[a]. Whenever Saul saw any mighty man or any valiant man[c][b], he gathered him to himself.
translation:
  language: zh_hans
  text: 扫罗在世的日子，对非利士人的战争一直很激烈。[a]扫罗每逢看见勇士或有勇力的人，[b]就把他招到自己身边。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “很激烈”也可译作“很猛烈”或“很艰苦”；希伯来语这个形容词的字面意思是“强”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语直译：“每一个勇士和每一个勇力之子。”这里“勇力之子”是指有勇力、能干或有价值的人。
    reason: lexical_alternative
  - marker: c
    text: 意思是扫罗招募这样的人为他效力。
    reason: cultural_note
lexical_decisions:
- source_word: וַתְּהִי הַמִּלְחָמָה
  choice: 战事一直
  rationale: 这里指持续的战争状态，不是某一次战役；用“战事一直”既承接叙事，也自然表达延续性。
- source_word: חֲזָקָה
  choice: 很激烈
  rationale: 该词本义为“强”，形容战争时表示猛烈、艰苦或激烈；“很激烈”符合现代汉语搭配，并保留语义范围。
- source_word: עַל פְּלִשְׁתִּים
  choice: 跟非利士人的
  rationale: 介词在战争语境中标明交战对象；“跟……的战事”是自然的现代汉语表达，含义相当于“对抗非利士人”。
- source_word: כֹּל יְמֵי שָׁאוּל
  choice: 扫罗在世的日子
  rationale: 保留希伯来语“……所有日子”的时间意味，又避免明确限定为执政期；上下文可指扫罗一生或其统治期间。
- source_word: וְרָאָה
  choice: 每逢……看见
  rationale: 此处与后面的叙事动词组合，表达反复发生的惯常行为；“每逢”清楚呈现这一迭代意义。
- source_word: כָּל אִישׁ גִּבּוֹר
  choice: 勇猛的人
  rationale: גִּבּוֹר在军事语境中指勇士或强有力的人；“勇猛的人”既自然，又不将其过度具体化为某种正式军职。
- source_word: וְכָל בֶּן חַיִל
  choice: 或英勇善战的人
  rationale: בֶּן־חַיִל字面为“勇力之子”，是指有勇力、才干或英勇之人的习语；军事语境支持“英勇善战”，脚注保留字面形式。
- source_word: וַיַּאַסְפֵהוּ אֵלָיו
  choice: 就把他招聚到自己身边
  rationale: אָסַף本义为聚集、收拢；这里含招募进扫罗队伍之意。“招聚”兼顾字面动作和语境功能，而脚注说明其实际指向。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“在世的日子”保留时间范围上的含混；“每逢……就……”表现扫罗惯常招募勇士的行动。脚注标记依正文出现顺序排列。
