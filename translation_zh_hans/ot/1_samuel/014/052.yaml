    rationale: 该习语可指有勇力、能干或有价值的人；上下文支持勇武含义，但原文没有明确说其“善战”。宜用“有勇力的人”，并以脚注保留字面及语义范围。
  - severity: low
    issue: “跟非利士人的战事”略有关系指向不够明确。
    rationale: 虽然通常可理解为与非利士人交战，但“对非利士人的战争”更直接对应 מלחמה על，明确非利士人为对手。
  - severity: low
    issue: “招聚到自己身边”搭配略显生硬。
    rationale: אָסף的字面核心是收聚，语境中是招揽入自己的队伍；“招到自己身边”更自然，脚注可说明其招募含义。
