revisions:
- from: 扫罗在世的日子，跟非利士人的战事一直很激烈。[a]扫罗每逢看见勇猛的人或英勇善战的人，[b]就把他招聚到自己身边。[c]
  to: 扫罗在世的日子，对非利士人的战争一直很激烈。[a]扫罗每逢看见勇士或有勇力的人，[b]就把他招到自己身边。[c]
  rationale: 修订澄清战争的敌对对象，避免将“有勇力/有才能”的习语限定为“善战”，并改善招揽动作的现代汉语表达。保留“扫罗在世的日子”，不把未明说的时间范围强行限定为其统治期；保留“每逢……就……”所表达的惯常、反复行动。脚注标记及出现顺序均保持一致。
