  yaml_path: translation/ot/1_samuel/031/003.yaml
  text: And the battle grew heavy against Saul[a], and the archers found him[b], and he was greatly wounded by the archers.
translation:
  language: zh_hans
  text: 战事越发激烈，直逼扫罗；弓箭手发现了他，他因弓箭手而极其痛苦[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他被弓箭手射成重伤”，又或：“他因弓箭手而极其惊惶。”这里的希伯来语动词较难确定，可指剧痛、战栗或极度惊惶。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּכְבַּד הַמִּלְחָמָה אֶל שָׁאוּל
  choice: 战事越发激烈，直逼扫罗
  rationale: כבד 的基本含义是“沉重”，用于战事时表示战斗加剧、压力增大；“越发激烈，直逼”以自然中文表达战局重压扫罗的意思。
- source_word: וַיִּמְצָאֻהוּ
  choice: 发现了他
  rationale: מצא 的直接含义是“找到、发现”。此处保留这一叙事表达，不进一步解释为“射中了”或“追上了”。
- source_word: הַמּוֹרִים אֲנָשִׁים בַּקָּשֶׁת
  choice: 弓箭手
  rationale: 原文直译为“射手，就是持弓的人”；现代中文用“弓箭手”即可自然、完整地传达其所指，避免重复累赘。
- source_word: וַיָּחֶל מְאֹד מֵהַמּוֹרִים
  choice: 他因弓箭手而极其痛苦
  rationale: ויחל 的词义和词根分析存在困难，可表示剧痛、战栗或极度惊惶，也传统上被理解为受重伤。“极其痛苦”有意保留身体与心理两方面的可能性；מן 在此译作原因性的“因”。
theological_decisions:
- issue: 扫罗当时的状态是身体受伤，还是惊惶痛苦
  choice: 正文采用含义较宽的“极其痛苦”
  alternative: “被弓箭手射成重伤”或“因弓箭手而极其惊惶”
  rationale: 希伯来语动词难解，既不宜把身体受伤确定为唯一解释，也不宜排除这一可能；正文保留张力，脚注列明主要译法。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“直逼扫罗”传达战势集中压向扫罗；分号保留原文连续推进的三个叙事动作。
