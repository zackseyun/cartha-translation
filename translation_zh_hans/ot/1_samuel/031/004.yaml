revisions:
- from: 扫罗对给他拿兵器的人说：“拔出你的刀来，用刀刺透我，免得这些未受割礼的人来刺透我，凌辱我[a]。”但给他拿兵器的人不肯，因为他非常害怕。于是扫罗拿起刀来，伏在刀上。
  to: 扫罗对替他拿兵器的人说：“拔出你的刀来，用刀刺穿我，免得这些未受割礼的人来刺穿我，凌辱我[a]。”但替他拿兵器的人不肯，因为他非常害怕。于是扫罗拿起刀来，扑在刀上。
  rationale: 仅作两项安全的语言修订：“替他拿兵器的人”改善现代汉语流畅度；“扑在刀上”更直接对应“倒／扑在剑上”的叙事动作。其余措辞及脚注均忠实保留原文的重复、语气和含混性。
