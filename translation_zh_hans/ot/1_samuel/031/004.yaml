  text: וַ/יֹּ֣אמֶר שָׁאוּל֩ לְ/נֹשֵׂ֨א כֵלָ֜י/ו שְׁלֹ֥ף חַרְבְּ/ךָ֣ וְ/דָקְרֵ֣/נִי בָ֗/הּ פֶּן יָ֠בוֹאוּ הָ/עֲרֵלִ֨ים הָ/אֵ֤לֶּה וּ/דְקָרֻ֨/נִי֙ וְ/הִתְעַלְּלוּ בִ֔/י וְ/לֹ֤א אָבָה֙ נֹשֵׂ֣א כֵלָ֔י/ו כִּ֥י יָרֵ֖א מְאֹ֑ד וַ/יִּקַּ֤ח שָׁאוּל֙ אֶת הַ/חֶ֔רֶב וַ/יִּפֹּ֖ל עָלֶֽי/הָ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/031/004.yaml
  text: Then Saul said to his armor-bearer[a], “Draw your sword and thrust me through with it, lest these uncircumcised men come and thrust me through and mistreat me.” But his armor-bearer was not willing, because he was very afraid. So Saul took the sword and fell on it.
translation:
  language: zh_hans
  text: 扫罗对替他拿兵器的人说：“拔出你的刀来，用刀刺穿我，免得这些未受割礼的人来刺穿我，凌辱我[a]。”但替他拿兵器的人不肯，因为他非常害怕。于是扫罗拿起刀来，扑在刀上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“戏弄我”“虐待我”或“羞辱我”。
    reason: 原词表示以羞辱性的方式恶待或任意摆布某人，但没有明确说明具体行为。
lexical_decisions:
- source_word: נֹשֵׂא כֵלָיו
  choice: 给他拿兵器的人
  rationale: 原文是“拿他兵器的人”，指随侍武士并携带其装备者。此译比专门称谓“拿兵器的”更符合现代汉语，也不增加原文未明说的身份细节。
- source_word: שְׁלֹף חַרְבְּךָ
  choice: 拔出你的刀来
  rationale: 准确表达从鞘中拔刀的命令，语言自然简洁。
- source_word: וְדָקְרֵנִי בָהּ / וּדְקָרֻנִי
  choice: 用刀刺透我／刺透我
  rationale: דקר表示用尖锐武器刺入或刺穿；两处采用同一表达，以保留扫罗话中的重复。
- source_word: פֶּן
  choice: 免得
  rationale: 自然表达原文所引出的、扫罗想要避免的结果。
- source_word: הָעֲרֵלִים הָאֵלֶּה
  choice: 这些未受割礼的人
  rationale: 保留原文带有盟约及贬抑色彩的称呼，不直接改写为上下文中的“非利士人”。
- source_word: וְהִתְעַלְּלוּ בִי
  choice: 凌辱我
  rationale: 该词在此表示带有羞辱性质的恶待。“凌辱”保留其严重性，同时不限定为嘲弄、折磨或其他特定行为。
- source_word: וְלֹא אָבָה
  choice: 不肯
  rationale: 简明自然地表达不愿照办，而不额外强化为公开抗命。
- source_word: כִּי יָרֵא מְאֹד
  choice: 因为他非常害怕
  rationale: 直接保留原因从句及מְאֹד的强化语气。
- source_word: וַיִּפֹּל עָלֶיהָ
  choice: 伏在刀上
  rationale: 保留“倒在／落在其上”的动作图景；“伏在刀上”在现代汉语中能自然表达以身体压向刀刃，又避免扩写为“自刎”等不同动作。
theological_decisions:
- issue: 扫罗所惧怕的凌辱具体指什么
  choice: 译作“凌辱我”，不说明具体形式
  alternative: 戏弄我／虐待我／羞辱我
  rationale: התעלל指带有羞辱、任意摆布意味的恶待，但本节没有界定其形式。译文保留这种严重性和含混性，不将其限定为嘲弄、酷刑或性侵犯。
- issue: “未受割礼的人”是否直接译成“非利士人”
  choice: 保留“这些未受割礼的人”
  alternative: 这些非利士人
  rationale: 上下文所指虽是非利士人，但原文刻意使用“未受割礼者”这一称呼。保留它可呈现原文的盟约背景和人物语气。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。保留原文“刺透我”的重复和“未受割礼的人”的称呼；用“给他拿兵器的人”避免生硬的专门术语。脚注标记[a]已置于对应词语之后。
