  naturalness: “给他拿兵器的人”可理解，但“替他拿兵器的人”在现代汉语中更顺畅。“伏在刀上”虽有传统译经用语的背景，在现代汉语里却较易被理解为静态姿势；“扑在刀上”更清楚地表达此处连续叙事中的动作，且不添加原文没有明说的具体方式。
  terminology: “未受割礼的人”“凌辱我”“不肯”“非常害怕”均合乎原文语义与庄重的现代译经语体。“凌辱”没有把含义限定为嘲笑、酷刑或其他某一种具体恶待，脚注也恰当地保留词义范围。
