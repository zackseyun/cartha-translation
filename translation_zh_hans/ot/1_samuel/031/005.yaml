  text: When his armor-bearer saw that Saul was dead[a], he too fell on his sword and died with him.
translation:
  language: zh_hans
  text: 替扫罗拿兵器的人见扫罗已经死了[a]，也倒在自己的刀上，和他一同死了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“扫罗死了。”希伯来文可描述扫罗当时已死的状态，也可把他的死亡表述为这人随后行动之前已完成的事件。
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹשֵׂא כֵלָיו
  choice: 拿兵器的人
  rationale: 原文是“拿他器具/兵器的人”，指为扫罗携带兵器的随从；“拿兵器的人”自然易懂，并保留原文表述。
- source_word: כִּי
  choice: （见）……已经……
  rationale: 这里引出“见”的内容，即他看见扫罗处于死亡状态；汉语无需另译连接词。
- source_word: מֵת
  choice: 已经死了
  rationale: 既可表达扫罗当时“是死的”这一状态，也可自然呈现其死亡已成事实；脚注保留“死了”的可能译法。
- source_word: גַּם הוּא
  choice: 也
  rationale: 保留原文的附加和对应意味，表明拿兵器的人采取了与扫罗相同的行动。
- source_word: עַל חַרְבּוֹ
  choice: 伏在自己的刀上
  rationale: 贴近原文“倒在/伏在自己的刀上”的表达，也符合本段叙事语境。
- source_word: וַיָּמָת עִמּוֹ
  choice: 和他一同死了
  rationale: 直接表达 עִם 的伴随意义，不额外加入空间或时间细节。
- source_word: וַיַּרְא
  choice: ……见……
  rationale: 以顺承叙事的汉语句式表达该动作，并自然引出后续反应。
