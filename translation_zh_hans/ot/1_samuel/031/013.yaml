  yaml_path: translation/ot/1_samuel/031/013.yaml
  text: They took their bones and buried them under the tamarisk tree in Jabesh[b][a], and they fasted seven days.
translation:
  language: zh_hans
  text: 他们取了他们的骸骨，把这些骸骨葬在雅比[a]的柽柳树下[b]，并禁食七天。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的“雅比”是承接上文对“基列·雅比”的简称。
    reason: cross_reference
  - marker: b
    text: 或译：“柽柳下”；希伯来文明确指出树的种类。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: 他们……带走
  rationale: לקח的基本义是“拿、取”；结合上一节他们把遗体运回雅比的叙事，“带走”自然表达其动作，同时不额外添加时间连接词。
- source_word: עַצְמֹתֵיהֶם
  choice: 他们的骸骨
  rationale: עֶצֶם在此具体指焚烧遗体后留下的骨头；“骸骨”既保留具体含义，也符合庄重的丧葬语境，不泛化为“遗骸”。
- source_word: וַיִּקְבְּרוּ
  choice: 埋
  rationale: קבר是通常表示“埋葬”的动词；此处用“埋”与后面的地点短语衔接自然，语义明确。
- source_word: תַחַת
  choice: 在……下
  rationale: תַחַת表示“在……下面”；译为“在……下”简明自然。
- source_word: הָאֶשֶׁל
  choice: 柽柳树
  rationale: אֶשֶׁל具体指柽柳；加入“树”帮助普通读者立即识别其为树木，同时保留原文所指物种。
- source_word: בְּיָבֵשָׁה
  choice: 在雅比
  rationale: 这是地名“雅比”，据上文为“基列·雅比”的简称；介词בְ在此作地点标记，译为“在”。
- source_word: וַיָּצֻמוּ
  choice: 并且禁食了
  rationale: צום意为“禁食”；“禁食”是现代中文中清楚、庄重且适合哀悼语境的直接对应。
- source_word: שִׁבְעַת יָמִים
  choice: 七天
  rationale: 直接保留原文明确的时长表达。
