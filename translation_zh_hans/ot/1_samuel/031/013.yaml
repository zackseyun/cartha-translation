  naturalness: 原句“他们把他们的骸骨带走，埋在……”中，“把”字结构与后续“埋在”衔接不够顺畅，且“他们”连续重复略显别扭。改用“取了……，把这些骸骨葬在……”可保持指代，同时使现代汉语叙事更自然庄重。
