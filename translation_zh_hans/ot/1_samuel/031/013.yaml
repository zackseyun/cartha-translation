- from: 他们把他们的骸骨带走，埋在雅比[a]的柽柳树下[b]，并且禁食了七天。
  to: 他们取了他们的骸骨，把这些骸骨葬在雅比[a]的柽柳树下[b]，并禁食七天。
  rationale: 修订仅删除“带走”所可能附加的方向含义，并调整句法以使“取骨”与“埋葬”两个动作在汉语中清晰连贯。“这些骸骨”只为避免歧义和不自然的重复，仍指前述“他们的骸骨”，不改变原文指代关系或意义。脚注锚点与内容均保留。
