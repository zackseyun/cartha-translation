base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/031/001.yaml
  text: The Philistines were fighting against Israel[a], and the men of Israel fled from before the Philistines and fell slain on Mount Gilboa.
translation:
  language: zh_hans
  text: 非利士人正在与以色列交战；以色列人从非利士人面前逃跑，倒毙在基利波山上。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/פְלִשְׁתִּים
  choice: 非利士人
  rationale: וּ承接前文，在中文叙事中无需机械译成“并且”；“非利士人”是该族名的通行译法。
- source_word: נִלְחָמִים בְּ/יִשְׂרָאֵל
  choice: 正在与以色列交战
  rationale: 分词נִלְחָמִים表示持续进行的背景动作；“正在……交战”体现这一进行状态。此处介词בְּ与לחם连用，表示敌对对象。
- source_word: וַ/יָּנֻסוּ
  choice: 逃跑
  rationale: נוּס在战争语境中指逃离敌军；“逃跑”现代、直接，又保留败退之意。
- source_word: אַנְשֵׁי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 原文直指“以色列的男人”，在此战争语境中是参战的以色列人；中文用“以色列人”较自然，且不会误解为全国所有男性。
- source_word: מִ/פְּנֵי פְלִשְׁתִּים
  choice: 从非利士人面前
  rationale: 保留מִפְּנֵי“从……面前”的空间性表达，鲜明呈现他们面对敌军败逃的场景。
- source_word: וַ/יִּפְּלוּ חֲלָלִים
  choice: 纷纷倒下，战死了
  rationale: חֲלָלִים指被杀者、阵亡者；“倒下，战死了”同时保留נפל“倒下”的画面和阵亡的结果。“纷纷”自然表达复数群体接连倒下。
- source_word: בְּ/הַר הַ/גִּלְבֹּעַ
  choice: 在基利波山上
  rationale: הַר加专名指基利波山；“在……山上”符合现代中文地点表达。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而清楚的战争叙事语言。首句保留希伯来分词所表达的持续背景，次句呈现逃跑、倒下与战死的连续动作；不另加原文没有的时间副词或神学解释。
