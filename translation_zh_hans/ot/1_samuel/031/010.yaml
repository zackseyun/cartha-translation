base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/031/010.yaml
  text: They put his armor in the house of the Ashtaroths[c][b][a], and they fastened his body to the wall of Beth-shan.
translation:
  language: zh_hans
  text: 他们把扫罗的军用装备[a]放在亚斯她录神庙[b]里，又把他的尸身固定在伯珊的城墙上[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“兵器”；这个希伯来词也可泛指各种军用器具或装备。
    reason: lexical_alternative
  - marker: b
    text: 直译“亚斯她录的殿（或房屋）”。“亚斯她录”在希伯来文中为复数形式，也可理解为神祇名称。
    reason: lexical_alternative
  - marker: c
    text: 或译“把他的尸身钉在伯珊的城墙上”。该动词可指打入、钉住或固定；原文没有精确说明展示尸身的方式。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשִׂמוּ
  choice: 放在
  rationale: שׂוּם的基本义是“放、安置”；“放在”符合现代汉语叙事表达。
- source_word: כֵּלָיו
  choice: 他的军装
  rationale: כְּלִי可泛指器具、兵器或装备；此处是战败君王的军事装备，“军装”能概括其军用器具，同时以脚注保留“兵器、装备”等可能。
- source_word: בֵּית עַשְׁתָּרוֹת
  choice: 亚斯她录神庙
  rationale: בֵּית直译为“殿、房屋”，在敬拜场所的语境中指神庙；עַשְׁתָּרוֹת采用传统且易辨认的音译“亚斯她录”。
- source_word: גְּוִיָּתוֹ
  choice: 他的尸身
  rationale: גְּוִיָּה在此指死者的身体；“尸身”明确扫罗已经死亡，又比“尸体”略显庄重。
- source_word: תָּקְעוּ
  choice: 固定在
  rationale: תקע可表示打入、钉住或牢牢安置；“固定在”表达陈尸于墙上的结果，而不武断确定具体方式。
- source_word: בְּחוֹמַת
  choice: 在……的城墙上
  rationale: חוֹמָה指城墙；介词ב与תקע连用，在汉语中自然表达为“固定在城墙上”。
- source_word: בֵּית שָׁן
  choice: 伯珊
  rationale: 采用现代中文圣经读者熟悉的地名译法。
theological_decisions:
- issue: עַשְׁתָּרוֹת的复数形式与专名性质
  choice: 亚斯她录
  alternative: 众亚斯她录／亚斯她录诸神
  rationale: 该形式虽在形态上为复数，却可作为神祇名称或称号使用；正文保留传统专名，不将其神学含义强行解释为多个神祇。
- issue: 扫罗尸身被展示的具体方式
  choice: 固定在城墙上
  alternative: 钉在／刺穿挂在城墙上
  rationale: תקע的语义允许“打入、钉住”等理解，但原文没有精确说明尸身如何被固定，故不在正文中过度具体化。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“尸身”适合历史叙事；“固定在”有意保留原文动词所容许的方式不确定性。正文补出“扫罗”，使单节独立阅读时所指清楚；这是依据上文明确所指作出的语境补足。
