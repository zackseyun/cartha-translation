base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/031/002.yaml
  text: The Philistines overtook Saul and his sons[a], and the Philistines struck down Jonathan, Abinadab, and Malchi-shua[b], the sons of Saul.
translation:
  language: zh_hans
  text: 非利士人追上扫罗和他的儿子们[a]；非利士人击杀约拿单、亚比拿达和麦基舒亚，他们都是扫罗的儿子[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“紧紧追赶扫罗和他的儿子们”或“追及扫罗和他的儿子们”。希伯来语动词表示紧密追赶并追及目标。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“击倒约拿单、亚比拿达和麦基舒亚”。希伯来语动词字面义为“击打”；在这里的战场语境中，很可能含有将他们杀死之意。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּדְבְּקוּ
  choice: 紧追……终于追上
  rationale: דבק在此处描写战场上的紧密追赶，并含有追及目标之意；这一译法兼顾追赶的过程和追上的结果。
- source_word: פְלִשְׁתִּים
  choice: 非利士人
  rationale: 这是该族群名称在现代中文圣经语境中的通行译名。
- source_word: אֶת שָׁאוּל וְאֶת בָּנָיו
  choice: 扫罗和他的儿子们
  rationale: בָּנָיו明确指他的众子，随后经文列出其中三人的名字。
- source_word: וַיַּכּוּ
  choice: 击杀
  rationale: נכה本义范围包括击打、击倒；在此战场语境中，所列人物均为阵亡者，因此“击杀”自然表达致命结果，同时保留击打动作。
- source_word: יְהוֹנָתָן
  choice: 约拿单
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: אֲבִינָדָב
  choice: 亚比拿达
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: מַלְכִּי שׁוּעַ
  choice: 麦基舒亚
  rationale: 按希伯来语人名音译，并采用中文圣经中常见的写法。
- source_word: בְּנֵי שָׁאוּל
  choice: 扫罗的儿子
  rationale: 将希伯来语同位说明自然地置于三个人名之前，清楚交代他们与扫罗的关系。
