  text: וַ/יִּרְא֣וּ אַנְשֵֽׁי יִ֠שְׂרָאֵל אֲשֶׁר בְּ/עֵ֨בֶר הָ/עֵ֜מֶק וַ/אֲשֶׁ֣ר בְּ/עֵ֣בֶר הַ/יַּרְדֵּ֗ן כִּֽי נָ֨סוּ֙ אַנְשֵׁ֣י יִשְׂרָאֵ֔ל וְ/כִי מֵ֖תוּ שָׁא֣וּל וּ/בָנָ֑י/ו וַ/יַּעַזְב֤וּ אֶת הֶֽ/עָרִים֙ וַ/יָּנֻ֔סוּ וַ/יָּבֹ֣אוּ פְלִשְׁתִּ֔ים וַ/יֵּֽשְׁב֖וּ בָּ/הֶֽן־־׀־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/031/007.yaml
  text: When the men of Israel who were on the other side of the valley[a], and those on the other side of the Jordan, saw that the men of Israel had fled and that Saul and his sons were dead, they abandoned the cities and fled[b]; and the Philistines came and lived in them.
translation:
  language: zh_hans
  text: 住在谷地另一边和约旦河另一边的以色列人[a]，看见以色列人已经逃跑，扫罗和他的儿子们也死了，就弃城逃走。非利士人便前来，住在那些城里[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “另一边”也可译作“对面”或“对岸”。希伯来语的方位表达是相对于某个参照点而言，但本句没有明说参照点。
    reason: 保留 בְּעֵבֶר 在“另一边、对面、彼岸”之间的空间表达弹性。
  - marker: b
    text: “住在”也可译作“定居在”。希伯来语动词既可表示居住，也可表示住下来、定居。
    reason: 保留 ישב 在一般居住与占领后定居之间的词义幅度。
lexical_decisions:
- source_word: וַיִּרְאוּ
  choice: 看见
  rationale: 保留 ראה“看见”的具体叙事意味；此处也含有由眼前局势得知事实的语用色彩，但不需解释为“意识到”。
- source_word: אַנְשֵׁי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 字面为“以色列的男子”，但本节首先指相关地区的以色列居民，现代汉语用“以色列人”自然且不把所指范围过度限定为军人；后一次出现沿用同一译法，以保留原文重复。
- source_word: בְּעֵבֶר הָעֵמֶק
  choice: 在谷地另一边
  rationale: עֵבֶר 表示相对于叙述视点的另一边或对面；עֵמֶק 可指谷地或低平的宽谷，“谷地”比“山谷”较少加入狭窄地形的意味。
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: 在约旦河另一边
  rationale: 保留与前一地理短语相同的表达结构，也保留参照点未明所带来的空间相对性。
- source_word: כִּי נָסוּ
  choice: 已经逃跑
  rationale: 该从句说明他们所看见的情况；“已经”自然表达逃跑相对于看见这一动作已经发生。
- source_word: מֵתוּ
  choice: 死了
  rationale: מות 只陈述死亡，并未在本句中说明死亡方式；“死了”避免增译为“被杀”。
- source_word: וַיַּעַזְבוּ אֶת־הֶעָרִים
  choice: 弃城
  rationale: עזב 表示离弃、撇下；“弃城”简洁地传达因战败而放弃各城的军事语境。“城”在汉语中可作集合性表达，对应复数 עָרִים。
- source_word: וַיָּנֻסוּ
  choice: 逃走
  rationale: 准确表达 נוס 的逃离含义，并与前文“逃跑”稍作自然变化而不改变意义。
- source_word: וַיָּבֹאוּ פְלִשְׁתִּים
  choice: 非利士人便前来
  rationale: בוא 的基本义是“来、进入”；“前来”保留叙述视角，后句已说明他们进入并占据那些城。
- source_word: וַיֵּשְׁבוּ בָּהֶן
  choice: 住在那些城里
  rationale: ישב 可指居住或定居；正文采用中性的“住在”，不预先断定其永久性，并以脚注保留“定居”的可能。
