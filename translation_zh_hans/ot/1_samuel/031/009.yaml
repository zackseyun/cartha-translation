    issue: “军装”将כֵּלָיו的语义范围限得过窄。
    rationale: 该词在战场语境可指武器、盔甲或装备整体；现代汉语“军装”主要指军服。译为“装备”更忠实地保留原文的宽泛性。
  - severity: low
    issue: “到非利士全地四处”不够自然。
    rationale: “走遍非利士全境”是现代标准汉语中更顺畅的范围表达，并可传达סָבִיב的遍及之意。
  - severity: low
