base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/031/009.yaml
  text: They cut off his head and stripped off his armor[a], and sent messengers throughout the land of the Philistines all around[b], to proclaim the good news to the house of their idols and to the people.
translation:
  language: zh_hans
  text: 他们砍下扫罗的头，剥下他的装备，又派人走遍非利士全境，向他们偶像的庙宇和百姓报捷。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּכְרְתוּ אֶת־רֹאשׁוֹ
  choice: 砍下扫罗的头
  rationale: 动词与“头”连用，明确表示砍下、割下。代词所指是上文的扫罗；在中文独立经节中明说姓名可避免指代不清。
- source_word: וַיַּפְשִׁיטוּ אֶת־כֵּלָיו
  choice: 剥下他的军装
  rationale: וַיַּפְשִׁיטוּ表示从人身上剥除衣物或装备；כֵּלָיו可泛指器具、兵器或装备，在阵亡将士的语境中译作“军装”自然，并保留盔甲与随身武备的整体含义。
- source_word: וַיְשַׁלְּחוּ
  choice: 又派人
  rationale: 原文仅说“派出／发送”，未明说宾语；后面的报信目的表明所派的是传信者。中文补出“人”使句意完整，而不增加新的事件。
- source_word: בְאֶרֶץ פְּלִשְׁתִּים סָבִיב
  choice: 到非利士全地四处
  rationale: בְאֶרֶץ标明活动范围，סָבִיב有周围、遍处之意；“全地四处”体现消息在非利士境内广泛传布。
- source_word: לְבַשֵּׂר
  choice: 报捷
  rationale: 该动词表示宣告好消息；从非利士人的视角，这是战胜扫罗的喜讯。“报捷”准确体现其胜利宣告的语境，又不表示叙述者对此作道德认同。
- source_word: בֵּית עֲצַבֵּיהֶם
  choice: 他们的偶像庙
  rationale: בֵּית在祭祀语境中指庙宇或神殿，עֲצַבִּים指偶像；“偶像庙”在现代中文中简洁清楚，也不承认这些神祇真实存在。
- source_word: וְאֶת־הָעָם
  choice: 和百姓
  rationale: אֵת将“百姓”标为报信行为的受事者，与前面的偶像庙并列；译文用“向……和……”保留这一并列结构。
theological_decisions:
- issue: 如何称呼非利士人的祭祀场所及崇拜对象
  choice: 偶像庙
  alternative: 他们偶像的殿／偶像之家
  rationale: 原文的“房屋”在此具有庙宇含义，而עֲצַבִּים通常带有“偶像”之意。“偶像庙”既符合古代宗教场景，也保留经文对这些崇拜对象的称谓，不把它们中性化为真实神明。
- issue: “报好消息”的叙事立场
  choice: 报捷
  alternative: 传报好消息
  rationale: 这里的“好”是非利士人从战争胜利角度作出的评价，并非经文对扫罗死亡的神学或道德称许。“报捷”以语境限定这一视角。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“砍下”“剥下”保留原文动作的直接和残酷；“派人……报捷”使省略宾语的希伯来语在中文中自然。“非利士”沿用通行圣经专名。
