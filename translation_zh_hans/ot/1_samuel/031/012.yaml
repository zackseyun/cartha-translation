base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/031/012.yaml
  text: Then all the valiant men arose and went all night[a], and they took the body of Saul and the bodies of his sons from the wall of Beth-shan[b], and they came to Jabesh and burned them there.
translation:
  language: zh_hans
  text: 所有勇士都起身，整夜赶路；他们从伯珊的城墙上取下扫罗的尸体和他儿子们的尸体[a]，来到雅比[b]，在那里焚烧了这些尸体。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文所用的词特指死者的身体。
    reason: lexical_alternative
  - marker: b
    text: 结合上下文，这里的“雅比”指基列的雅比。
    reason: cross_reference
lexical_decisions:
- source_word: כָּל אִישׁ חַיִל
  choice: 所有勇士
  rationale: 这一习语在当前军事营救语境中指勇敢、有作战能力的男子；“所有勇士”简洁自然，也保留了原文的男性所指。
- source_word: וַיָּק֜וּמוּ
  choice: 都起来
  rationale: 保留动词“起来”的基本意义和叙事推进功能；在上下文中也自然含有立即行动之意。
- source_word: וַיֵּלְכ֣וּ כָל הַלַּיְלָה
  choice: 走了一整夜
  rationale: 准确表达他们整夜持续前行，不额外限定具体交通方式。
- source_word: גְּוִיַּת ... גְּוִיֹּת
  choice: 尸体……尸体
  rationale: גְּוִיָּה 特指死者的身体；现代汉语“尸体”准确、清楚，比泛称“身体”更符合原文。
- source_word: מֵחוֹמַת
  choice: 从……城墙上
  rationale: מִן 表示从某处移离；结合尸体先前被悬挂在城墙上的语境，汉语用“从城墙上取下”自然明确。
- source_word: בֵּית שָׁן
  choice: 伯珊
  rationale: 采用现代中文圣经地名中通行且易辨认的音译。
- source_word: יָבֵשָׁה
  choice: 带到雅比
  rationale: 原文地名带有表示趋向的词尾，意为前往雅比；“带到”同时承接他们携带尸体的动作。
- source_word: וַיִּשְׂרְפ֥וּ אֹתָ֖ם שָׁם
  choice: 在那里焚烧了
  rationale: 忠实表达“在那里烧了他们”；中文省略已明确的宾语更自然，而“焚烧”保持叙事庄重，且不擅自解释焚烧的具体方式或范围。
theological_decisions:
- issue: 营救者的男性集合称谓
  choice: 所有勇士
  alternative: 所有勇敢的人
  rationale: 原文使用男性形式，且军事语境指参与行动的男性战士；“勇士”保留这一具体所指，避免不必要的中性化。
- issue: 尸体被焚烧的表述
  choice: 在那里焚烧了
  alternative: 在那里把他们火化了
  rationale: 原文只说“烧”，未说明这是正式火化仪式，也未解决焚烧程度等问题；因此不用解释性更强的“火化”。
translation_notes:
  register: 采用现代、庄重而易懂的叙事文体。“走了一整夜”贴近原文而不过度发挥；将英文咨询层中错置的脚注标记按其实际内容移到“尸体”和“雅比”之后。
