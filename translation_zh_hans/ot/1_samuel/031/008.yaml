base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/031/008.yaml
  text: The next day[a], the Philistines came to strip the slain, and they found Saul and his three sons fallen on Mount Gilboa.
translation:
  language: zh_hans
  text: 第二天[a]，非利士人来剥取阵亡者的衣甲；他们发现扫罗和他的三个儿子倒在基利波山上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “剥取阵亡者的衣甲”也可译作“剥下死者的衣物或铠甲”或“掠夺阵亡者”。这里的希伯来语动词是指从战场死者身上剥下衣服或铠甲。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִמָּחֳרָת
  choice: 第二天
  rationale: 这是承接前述战事的时间习语，指紧接着的次日；“第二天”简洁自然。
- source_word: לְפַשֵּׁט
  choice: 剥取……的衣甲
  rationale: פשט在此指从战死者身上剥下衣服、铠甲等物；补出“衣甲”可在现代汉语中准确表达具体动作，又不把含义泛化为一般抢掠。
- source_word: הַחֲלָלִים
  choice: 阵亡者
  rationale: 该词指战场上被杀的人；“阵亡者”保留战争语境，且比“尸体”更贴近原文对死者的称谓。
- source_word: וַיִּמְצְאוּ
  choice: 他们发现
  rationale: 忠实表达希伯来叙事链中的普通动词“找到、发现”。
- source_word: נֹפְלִים
  choice: 倒毙
  rationale: 原词直译为“倒下”，在战事语境中表示倒地身亡；“倒毙”既保留倒下的图景，也清楚传达其已死亡。
- source_word: בְּהַר הַגִּלְבֹּעַ
  choice: 在基利波山上
  rationale: 采用该地名的常见中文音译，并自然表达地点关系。
- source_word: שְׁלֹשֶׁת בָּנָיו
  choice: 他的三个儿子
  rationale: 直接、自然地保留数量与亲属关系。
theological_decisions: []
