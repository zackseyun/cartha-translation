  register: 采用现代、庄重而清楚的叙事语言。“衣甲”略带书面色彩，但能简洁涵盖衣物和铠甲；“倒毙”保留原文“倒下”的战场意象，同时避免读者误以为扫罗及其众子仍然活着。
