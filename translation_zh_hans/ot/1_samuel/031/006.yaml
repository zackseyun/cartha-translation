base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/031/006.yaml
  text: So Saul died[a], and his three sons, and his armor-bearer, and all his men[b], together on that day.
translation:
  language: zh_hans
  text: 扫罗、他的三个儿子、替他拿兵器的人，以及他所有的部下[a][b]，都在那一天一同死了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“他所有的士兵”。希伯来文作“他所有的人”；在这场战役的语境中，可能指扫罗的作战人员或随从，而不是一切与他有关的人。
    reason: lexical_alternative
  - marker: b
    text: 有些希腊文抄本作“他所有的兵器”，而不是“他所有的人”；希伯来文本作“他所有的人”。
    reason: textual_variant
lexical_decisions:
- source_word: וַיָּמָת
  choice: 于是……死了
  rationale: 连续式叙事动词承接前文并推进情节；“于是”自然表达这一进展，同时将“死了”置于句末，符合现代汉语列举多个主语时的表达习惯。
- source_word: שָׁאוּל
  choice: 扫罗
  rationale: 采用现代中文圣经中通行的人名译法。
- source_word: וּשְׁלֹשֶׁת בָּנָיו
  choice: 和他的三个儿子
  rationale: 准确表达数词、名词及第三人称单数领属后缀，且符合现代汉语语序。
- source_word: וְנֹשֵׂא כֵלָיו
  choice: 给他拿兵器的人
  rationale: 该分词短语直指替扫罗携带装备或兵器的人；此译法清楚、自然，也避免把 כֵלִים 的语义过窄地限定为防护性“铠甲”。
- source_word: גַּם
  choice: 以及
  rationale: 在列举末项前起追加作用；“以及”在汉语中自然地保留末项被纳入的意味，不额外强化为原文未必要求的“甚至”。
- source_word: כָּל אֲנָשָׁיו
  choice: 他所有的人
  rationale: 形式上保留 אֲנָשִׁים 的宽泛表达及领属关系，不直接将其解释为“士兵”；战事语境所指的可能范围另以脚注说明。
- source_word: בַּיּוֹם הַהוּא
  choice: 在那一天
  rationale: 直接、自然地表达原文的时间短语。
- source_word: יַחְדָּו
  choice: 一同
  rationale: 保留这些人在同一天共同死亡的联合性含义。
