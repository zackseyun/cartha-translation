  register: 采用庄重而通顺的现代标准汉语。句末统一使用“死了”，既避免机械重复，又保持原文中各并列主语同受一个谓语支配的结构；“他所有的人”保留原文可解释空间，并用脚注交代战事语境和文本异文。
