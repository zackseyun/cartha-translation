revisions:
- from: 撒母耳就照雅威所说的做了。他来到伯利恒，城里的长老战战兢兢地出来迎接他，问[a]：“你是平安而来的吗？”
  to: 撒母耳就照雅威所说的做了，来到伯利恒。城里的长老去迎接他时，都战战兢兢；其中有人问[a]：“你是平安而来的吗？”
  rationale: 修订删除“出来”这一原文未明说的动作细节，并以“其中有人问”在自然汉语中保留希伯来文单数发言动词所显示的代表性发言。其余核心译法维持：撒母耳遵行雅威所说的话，长老们因迎见他而战栗，并询问其来意是否平安。
