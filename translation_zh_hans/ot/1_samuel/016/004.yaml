  text: וַ/יַּ֣עַשׂ שְׁמוּאֵ֗ל אֵ֚ת אֲשֶׁ֣ר דִּבֶּ֣ר יְהוָ֔ה וַ/יָּבֹ֖א בֵּ֣ית לָ֑חֶם וַ/יֶּחֶרְד֞וּ זִקְנֵ֤י הָ/עִיר֙ לִ/קְרָאת֔/וֹ וַ/יֹּ֖אמֶר שָׁלֹ֥ם בּוֹאֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/004.yaml
  text: So Samuel did what Yahweh had spoken and came to Bethlehem. The elders of the city trembled at his coming and said[a], “Do you come in peace?”
translation:
  language: zh_hans
  text: 撒母耳就照雅威所说的做了，来到伯利恒。城里的长老去迎接他时，都战战兢兢；其中有人问[a]：“你是平安而来的吗？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文此处的发言动词为单数，直译可作“他问”。这可能指长老中一人代表众人发问；说话者的具体身份未说明。
    reason: 保留复数“长老”之后单数发言动词的语法现象，同时避免在正文中指定该发言者。
lexical_decisions:
- source_word: וַיַּעַשׂ שְׁמוּאֵל אֵת אֲשֶׁר דִּבֶּר יְהוָה
  choice: 撒母耳就照雅威所说的做了
  rationale: 准确表达撒母耳在叙事进程中依照雅威先前所说的话行事；保留“说”的原义，不强化为原文未明说的“命令”或“吩咐”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常用音译呈现以色列上帝的专名，而不以头衔替代。
- source_word: וַיָּבֹא בֵּית לָחֶם
  choice: 他来到伯利恒
  rationale: בוא在此表示抵达某地；“来到”符合中文叙事习惯。
- source_word: וַיֶּחֶרְדוּ זִקְנֵי הָעִיר לִקְרָאתוֹ
  choice: 城里的长老战战兢兢地出来迎接他
  rationale: חרד兼有惧怕和发颤的意味，“战战兢兢”自然保留这种身心反应；לקראת指朝着某人前去相迎，译为“出来迎接他”使动作关系清楚。
- source_word: שָׁלֹם בּוֹאֶךָ
  choice: 你是平安而来的吗？
  rationale: 保留שָׁלוֹם的“平安”意象，同时用自然问句表达长老询问撒母耳此行是否带有和平、无害的意图。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名，故保留为专名音译；“雅威”较贴近学界通常重构的读音，也避免以称号取代名字。
- issue: 长老们发问与原文单数动词וַיֹּאמֶר的关系
  choice: 正文按群体语境译为“问”，脚注说明原文为单数“他问”
  alternative: 译作“一位长老问”
  rationale: 前项主语是复数“城里的长老”，但发言动词采用单数。正文不擅自指定某一位长老，同时以脚注保留语法上的张力及代表发言的可能性。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“战战兢兢地出来迎接”兼顾动作与惧怕情绪；问句保留“平安”这一贯穿圣经语汇的核心词。
