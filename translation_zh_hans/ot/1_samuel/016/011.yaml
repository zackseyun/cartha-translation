source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר שְׁמוּאֵ֣ל אֶל יִשַׁי֮ הֲ/תַ֣מּוּ הַ/נְּעָרִים֒ וַ/יֹּ֗אמֶר ע֚וֹד שָׁאַ֣ר הַ/קָּטָ֔ן וְ/הִנֵּ֥ה רֹעֶ֖ה בַּ/צֹּ֑אן וַ/יֹּ֨אמֶר שְׁמוּאֵ֤ל אֶל יִשַׁי֙ שִׁלְחָ֣/ה וְ/קָחֶ֔/נּוּ כִּ֥י לֹא נָסֹ֖ב עַד בֹּא֥/וֹ פֹֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/011.yaml
  text: Then Samuel said to Jesse[a], “Are these all the young men?” And he said, “The youngest still remains, and behold, he is shepherding the flock.” Then Samuel said to Jesse, “Send and bring him[b], for we will not sit down until he comes here.”
translation:
  language: zh_hans
  text: 撒母耳问耶西：“年轻人都到齐了吗？”他回答：“还剩下最小的；你看，他正在放羊[a]。”撒母耳对耶西说：“派人去把他带来[b]，他不到这里，我们就不入席。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“牧放羊群”，也可译作“照看羊群”。
    reason: lexical_alternative
  - marker: b
    text: “不入席”也可译作“不坐下”或“不就位”，很可能是说在他来到以前，他们不会开始用餐或正式聚集。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתַמּוּ הַנְּעָרִים
  choice: 年轻人都到齐了吗
  rationale: תמם在这里表示人员是否齐全；结合耶西众子的语境，“都到齐了吗”自然表达撒母耳询问是否所有儿子都已到场。נְעָרִים保留为较宽泛的“年轻人”，不限定为孩童。
- source_word: עוֹד שָׁאַר הַקָּטָן
  choice: 还剩下最小的
  rationale: עוֹד שָׁאַר强调尚有一人未被带来；הַקָּטָן在兄弟排行语境中指最年幼者。“最小的”既自然，也保留原文“较小者”的表达。
- source_word: וְהִנֵּה
  choice: 你看
  rationale: הִנֵּה引人注意后面的情况。“你看”在现代汉语中保留其提示语气，比“看哪”更自然。
- source_word: רֹעֶה בַּצֹּאן
  choice: 正在放羊
  rationale: 分词רֹעֶה表示正在持续进行的动作；צֹאן是羊群的集合称呼。“正在放羊”简明自然，并保留牧养活动的含义。
- source_word: שִׁלְחָה וְקָחֶנּוּ
  choice: 派人去把他带来
  rationale: 原文连续表达“差遣”与“带来”。汉语用“派人去把他带来”清楚保留两个动作及命令语气。
- source_word: לֹא נָסֹב
  choice: 我们就不入席
  rationale: סבב本义与转动、围绕有关，但此处常被理解为众人尚不就位开始宴席或正式聚集。“不入席”符合上下文，同时避免直译造成费解。
- source_word: עַד בֹּאוֹ פֹה
  choice: 他不到这里
  rationale: 将“直到他来到这里”按汉语条件式表达为“他不到这里……就不……”，自然保留时间界限与强调。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“你看”保留הִנֵּה的提示作用；“入席”体现לֹא נָסֹב在当前场景中的惯用含义，并以脚注保留其可能的字面和语境译法。
