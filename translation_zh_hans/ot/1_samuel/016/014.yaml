  text: וְ/ר֧וּחַ יְהוָ֛ה סָ֖רָה מֵ/עִ֣ם שָׁא֑וּל וּ/בִֽעֲתַ֥תּ/וּ רֽוּחַ רָעָ֖ה מֵ/אֵ֥ת יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/014.yaml
  text: The Spirit of Yahweh had departed from Saul[a], and an evil spirit from Yahweh terrified him.
translation:
  language: zh_hans
  text: 耶和华的灵离开了扫罗；从耶和华那里来的恶灵[a]使他惊恐。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “恶灵”也可译作“有害的灵”或“带来灾祸的灵”。希伯来文形容词可指邪恶，也可指所造成的伤害或灾祸。
    reason: 保留רָעָה在道德性质与有害后果之间的词义幅度。
lexical_decisions:
- source_word: וְרוּחַ יְהוָה
  choice: 耶和华的灵
  rationale: רוּחַ可指灵、风或气息；本叙事语境承接扫罗先前所得的属神能力与同在，因此译作“灵”。专名יהוה按其希伯来文形式译作“耶和华”。句首וְ仅作叙事连接，不另加“现在”。
- source_word: סָרָה מֵעִם
  choice: 离开了
  rationale: סוּר与מֵעִם连用，表示不再与某人同在、从其身边离去；“离开了”简明自然，也保留撤去同在之意。
- source_word: שָׁאוּל
  choice: 扫罗
  rationale: 采用现代中文圣经读者熟悉的人名译法。
- source_word: וּבִעֲתַתּוּ
  choice: 使他惊恐
  rationale: בעת的核心意义是突然而强烈地使人害怕；“使他惊恐”准确表达恐惧反应，不把它扩大解释为较宽泛的“折磨”。
- source_word: רוּחַ רָעָה
  choice: 恶灵
  rationale: רָעָה可表示邪恶，也可表示有害、带来灾祸；正文采用最直接简洁的“恶灵”，并以脚注保留效果层面的其他可能。
- source_word: מֵאֵת יְהוָה
  choice: 从耶和华那里来的
  rationale: מֵאֵת明确表示来源。“从耶和华那里来的”在现代中文中自然地保留来源关系；不译作“耶和华差来的”，以免加入原文未明说的差遣动作。
theological_decisions:
- issue: 如何表达使扫罗惊恐之灵与耶和华之间的来源关系
  choice: 从耶和华那里来的恶灵
  alternative: 耶和华差来的有害之灵／恶灵
  rationale: 原文明言该灵“从耶和华而来”，正文保留这一神学张力，不以解释性措辞弱化来源，也不增添原文未明说的“差遣”。同时，רָעָה兼有“邪恶”与“有害、带来灾祸”的语义可能，故在脚注中说明。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。以分号呈现两项紧密相连而形成对照的陈述；脚注标记紧随“恶灵”，使其明确对应所解释的词语。
