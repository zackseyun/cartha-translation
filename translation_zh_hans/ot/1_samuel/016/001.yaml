  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל שְׁמוּאֵ֗ל עַד מָתַי֙ אַתָּה֙ מִתְאַבֵּ֣ל אֶל שָׁא֔וּל וַ/אֲנִ֣י מְאַסְתִּ֔י/ו מִ/מְּלֹ֖ךְ עַל יִשְׂרָאֵ֑ל מַלֵּ֨א קַרְנְ/ךָ֜ שֶׁ֗מֶן וְ/לֵ֤ךְ אֶֽשְׁלָחֲ/ךָ֙ אֶל יִשַׁ֣י בֵּֽית הַלַּחְמִ֔י כִּֽי רָאִ֧יתִי בְּ/בָנָ֛י/ו לִ֖/י מֶֽלֶךְ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/001.yaml
  text: And Yahweh said to Samuel[a], “How long will you grieve over Saul, since I have rejected him from being king over Israel? Fill your horn with oil and go; I am sending you to Jesse the Bethlehemite, for I have provided for myself a king among his sons.”
translation:
  language: zh_hans
  text: 耶和华对撒母耳说：“你要为扫罗悲哀到几时呢？我已经弃绝他，不让他作以色列的王。你要把你的角盛满油，去吧！我要差遣你到伯利恒人耶西那里去，因为我已经在他众子中为自己看中了一位王。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文读者熟悉的神圣专名“耶和华”，不以“主”这一称号替代原文四字神名。
- source_word: מִתְאַבֵּל
  choice: 悲哀
  rationale: 该词指哀悼、悲伤；“悲哀”既保留情感力度，也自然适合撒母耳为扫罗持续忧伤的语境。
- source_word: מְאַסְתִּיו מִמְּלֹךְ עַל יִשְׂרָאֵל
  choice: 我已经弃绝他，不让他作以色列的王
  rationale: 明确把弃绝限定于扫罗的王位，避免将经文扩展为关于他终极属灵结局的判断。
- source_word: מַלֵּא קַרְנְךָ שֶׁמֶן
  choice: 把膏油装满你的角
  rationale: 保留 קֶרֶן 的具体意象“角”；补出“膏油”以自然表达此处为膏立所用的油。
- source_word: אֶשְׁלָחֲךָ
  choice: 我要差你
  rationale: 表达上帝当前发出的明确差遣，符合汉语直接引语的自然语气。
- source_word: יִשַׁי בֵּית הַלַּחְמִי
  choice: 伯利恒人耶西
  rationale: 以自然、简洁的现代汉语保留原文对耶西籍贯或族属式的称谓。
- source_word: רָאִיתִי
  choice: 看中
  rationale: 原义为“看见”，但在此语境中含辨认、拣选之意；“看中”保留视觉意象，同时自然传达选定的语用含义。
- source_word: בְּבָנָיו
  choice: 在他的儿子中
  rationale: בְּ 在这里表示群体范围，即王是耶西众子中的一位。
- source_word: לִי
  choice: 为自己
  rationale: 保留与上帝利益、归属及旨意有关的与格含义。
- source_word: מֶלֶךְ
  choice: 一位王
  rationale: 原文名词无定，译作“一位王”体现尚未点名的身份。
theological_decisions:
- issue: 上帝弃绝扫罗的范围
  choice: 我已经弃绝他，不让他作以色列的王
  alternative: 我已经弃绝他，不让他统治以色列
  rationale: 译文把弃绝与王权直接相连，不将其扩大为对扫罗全部身份或最终结局的裁断。
- issue: רָאִיתִי לִי 的含义
  choice: 为自己看中了一位王
  alternative: 为自己预备了一位王
  rationale: “看中”兼顾动词“看见”的词汇表面和此处选定君王的语境含义；“预备”虽符合上下文，却较少保留原文视觉意象。
translation_notes:
  register: 采用庄重而易懂的现代标准普通话。句式保持直接有力；“你的角”保留古代膏立器皿的具体形象，“看中”则在不抹去原文意象的前提下传达拣选含义。
