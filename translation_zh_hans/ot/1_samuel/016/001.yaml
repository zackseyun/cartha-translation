revisions:
- from: 耶和华对撒母耳说：“你要为扫罗悲哀到几时呢？我已经弃绝他，不让他作以色列的王。你要把膏油装满你的角，去吧！我要差你到伯利恒人耶西那里，因为我已经在他的儿子中为自己看中了一位王。”
  to: 耶和华对撒母耳说：“你要为扫罗悲哀到几时呢？我已经弃绝他，不让他作以色列的王。你要把你的角盛满油，去吧！我要差遣你到伯利恒人耶西那里去，因为我已经在他众子中为自己看中了一位王。”
  rationale: 仅作语言和句法层面的安全修订：将盛油用的‘角’译得更清楚自然，并调整‘差遣’的搭配。其余关键措辞保留，包括对扫罗王权范围的限定，以及‘看中’所保留的原文视觉词根与语境中的选定之意。
  reviewer_model: gpt-5.6-terra
