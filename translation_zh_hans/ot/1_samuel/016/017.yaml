  text: וַ/יֹּ֥אמֶר שָׁא֖וּל אֶל עֲבָדָ֑י/ו רְאוּ נָ֣א לִ֗/י אִ֚ישׁ מֵיטִ֣יב לְ/נַגֵּ֔ן וַ/הֲבִיאוֹתֶ֖ם אֵלָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/017.yaml
  text: Then Saul said to his servants[a], “Please find for me a man who can play well, and bring him to me.”
translation:
  language: zh_hans
  text: 于是，扫罗对他的臣仆说：“请为我找一个弹奏得好[a]的人，把他带到我这里来。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文为“善于弹奏”，指弹奏技艺娴熟。
    reason: 说明希伯来语短语的字面形式及其能力含义。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 于是……说
  rationale: 连续式叙事动词推进情节；“于是”在现代汉语中自然表达事件的先后承接。
- source_word: עֲבָדָיו
  choice: 他的臣仆
  rationale: עֶבֶד 可指仆人、臣仆或侍从；这里是王宫语境，“臣仆”既符合身份，也保留服事君王的含义。
- source_word: רְאוּ נָא
  choice: 请……找
  rationale: ראה 的复数命令式与礼貌语气词 נָא 连用，在此不是单纯叫人观看，而是吩咐他们寻得合适的人；“请……找”自然保留了请求式语气。
- source_word: לִי
  choice: 为我
  rationale: 介词 ל־ 在此表示受益者或所服务的对象，即为扫罗本人寻找。
- source_word: אִישׁ
  choice: 一个……的人
  rationale: 保留原文单数阳性所指，同时采用自然的现代汉语表达。
- source_word: מֵיטִיב לְנַגֵּן
  choice: 弹奏得好
  rationale: 该短语字面表达“善于弹奏”，指具有娴熟的弹奏能力；不在本节自行补明具体乐器。
- source_word: וַהֲבִיאוֹתֶם אֵלָי
  choice: 把他带到我这里来
  rationale: 原文是向众臣仆发出的复数命令，宾语承接前面的单数“一个人”；此译法准确而符合现代汉语习惯。
