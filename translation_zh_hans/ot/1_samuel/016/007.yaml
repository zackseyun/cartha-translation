  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל שְׁמוּאֵ֗ל אַל תַּבֵּ֧ט אֶל מַרְאֵ֛/הוּ וְ/אֶל גְּבֹ֥הַּ קוֹמָת֖/וֹ כִּ֣י מְאַסְתִּ֑י/הוּ כִּ֣י לֹ֗א אֲשֶׁ֤ר יִרְאֶה֙ הָ/אָדָ֔ם כִּ֤י הָֽ/אָדָם֙ יִרְאֶ֣ה לַ/עֵינַ֔יִם וַ/יהוָ֖ה יִרְאֶ֥ה לַ/לֵּבָֽב־־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/007.yaml
  text: But Yahweh said to Samuel[a], “Do not look at his appearance or at the height of his stature, because I have rejected him. For not as man sees does God see, for man sees what is before the eyes[c][b], but Yahweh sees the heart.”
translation:
  language: zh_hans
  text: 但雅威对撒母耳说：“不要看他的外貌，也不要看他高大的身材，因为我已经弃绝他。因为雅威不像人那样看[a]：人看眼前所见，雅威却看内心。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文这里采用省略的比较说法，字面近于“因为并非人所看的那样”；上下文表明，是说雅威看人的方式不像人那样。
    reason: 说明原文的省略句法，以及正文为使汉语完整而补出的比较关系。
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 以常见的现代汉语音译呈现神的专名，不以称号替代；本节两处均保持一致。
- source_word: תַּבֵּט
  choice: 看
  rationale: 这里禁止撒母耳凭外在特征判断；“看”自然简明，也不额外强化为“凝视”。
- source_word: מַרְאֵהוּ
  choice: 他的外貌
  rationale: 准确表达肉眼可见的外在样貌，并与后面的身材相呼应。
- source_word: גְּבֹהַּ קוֹמָתוֹ
  choice: 他高大的身材
  rationale: 表达原文所强调的身量高大，同时符合现代汉语习惯。
- source_word: מְאַסְתִּיהוּ
  choice: 我已经弃绝他
  rationale: 保留动词“拒绝、不接纳”的力度及完成体语气；在本段语境中，指雅威不选他作王。
- source_word: הָאָדָם
  choice: 人
  rationale: 此处是泛指全人类的单数集合用法；汉语“人”可自然保留这种概括性。
- source_word: לַעֵינַיִם
  choice: 眼前
  rationale: 原文直译近于“向着眼睛／眼睛所见”；“看眼前”保留视觉意象，又比解释性的“外表”更贴近原文。
- source_word: לַלֵּבָב
  choice: 内心
  rationale: לֵבָב 指人的思想、意愿和品格所在的内在核心；“内心”既自然，也能与“眼前”形成清楚对照。
theological_decisions:
- issue: 人和雅威观看方式的对比
  choice: 雅威看事不像人看事
  alternative: 并不像人所看的
  rationale: 希伯来文在此省略了明确的神圣主语，字面近于“并非人所看的那样”。正文根据上下文补出“雅威”，使现代汉语完整通顺；脚注保留原文的省略性，避免掩盖句法上的含混。
- issue: “弃绝”在拣选君王语境中的含义
  choice: 我已经弃绝他
  alternative: 我不拣选他
  rationale: 正文保留 מָאַס 的直接力度，而不把它完全解释为“未拣选”；但其叙事语境确实是雅威拒绝以利押作为受膏者。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“不要……也不要……”重现并列禁令；末句用“眼前／内心”的简洁对照保留原文的修辞力量。
