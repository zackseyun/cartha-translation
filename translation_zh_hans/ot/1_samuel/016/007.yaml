  naturalness: “人看眼前”略显截断，容易被理解为“看当前局势”。改为“眼前所见”既保留“眼睛所见”的意象，也使汉语完整自然。以“雅威不像人那样看”表达原文省略的比较句，庄重流畅而不多作释义。
  terminology: “雅威”“撒母耳”“弃绝”“外貌”“内心”的用语一致、恰当。“内心”可自然承载 לֵבָב 所指的人的内在中心，未限定为单指情感。
