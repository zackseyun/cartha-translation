base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/006.yaml
  text: When they came in[a], he saw Eliab and said, “Surely Yahweh’s anointed is before Yahweh.”
translation:
  language: zh_hans
  text: 他们进来时，撒母耳看见以利押，就说：“耶和华的受膏者[a]必定在耶和华面前。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“耶和华的弥赛亚”。这里译作“受膏者”的希伯来词，后来也用作“弥赛亚”；本节所指的是撒母耳以为耶和华所拣选的那一位。
    reason: 说明同一希伯来词在本段王权语境中的直接含义及其后来作为“弥赛亚”称号的词汇联系，同时避免添加原文未明确的拣选与膏立时序。
lexical_decisions:
- source_word: וַיְהִי בְּבוֹאָם
  choice: 他们进来时
  rationale: 以现代汉语的时间从句表达叙事结构，既保留“他们来到/进入时”的意义，又避免使用生硬的“事情发生了”式套语。
- source_word: וַיַּרְא אֶת־אֱלִיאָב
  choice: 撒母耳看见以利押
  rationale: 原文动词主语由上下文确定为撒母耳；汉语补出姓名可避免连续代词造成歧义。“看见”直接对应 ראה，不额外加入“端详”等解释。
- source_word: וַיֹּאמֶר
  choice: 就说
  rationale: 保留 אמר 的通常含义“说”，不擅自改成“心想”；“就”自然承接看见以利押后的即时判断。
- source_word: אַךְ
  choice: 必定
  rationale: 此处表达撒母耳强烈而肯定的判断；“必定”在现代汉语中自然传达这种确信。
- source_word: נֶגֶד יְהוָה
  choice: 就在耶和华面前
  rationale: נֶגֶד 表示“在……面前”；重复神名虽然略显郑重，却清楚保留原文明确出现的 יהוה，避免代词指向不明。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经语境中通行的神名音译，作为专名处理，而不以“主”这一称号替代。
- source_word: מְשִׁיחוֹ
  choice: 耶和华的受膏者
  rationale: 该词在本段指撒母耳以为已蒙耶和华选立、将受膏为王的人。“受膏者”保留词义及其与后来“弥赛亚”称号的词汇联系，又不把后期的特定含义直接带入此处。
theological_decisions:
- issue: 在选立君王的叙事中如何翻译 מְשִׁיחוֹ
  choice: 受膏者
  alternative: 弥赛亚
  rationale: 此处首先指耶和华所拣选并膏立为王的人，并非直接使用后来已专名化的基督论称号；正文采用“受膏者”，脚注说明其与“弥赛亚”是同一希伯来词。
- issue: נֶגֶד יְהוָה 的所指
  choice: 就在耶和华面前
  alternative: 就在他面前
  rationale: 原文在 נֶגֶד 后明确写出神名 יהוה。译出“耶和华”可保持原文措辞，并避免中文“他”可能指撒母耳或以利押的歧义；不进一步解释“在……面前”的神学含义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“他们进来时……就说”保持叙事流畅；重复“耶和华”是为忠实呈现原文并消除代词歧义。脚注标记置于实际涉及词“受膏者”之后。
