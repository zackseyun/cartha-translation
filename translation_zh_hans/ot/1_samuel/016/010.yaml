base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/010.yaml
  text: So Jesse had seven of his sons pass before Samuel, and Samuel said to Jesse, “Yahweh has not chosen any of these.”
translation:
  language: zh_hans
  text: 耶西让他的七个儿子依次走到撒母耳面前。撒母耳对耶西说：“雅威没有拣选他们中的任何一个。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲבֵר
  choice: 让……经过
  rationale: 这是עבר的使役形，表示耶西使儿子们逐一从撒母耳面前经过；“让……经过”自然地保留了使役含义。
- source_word: שִׁבְעַת בָּנָיו
  choice: 他的七个儿子
  rationale: 该结构指耶西的七个儿子；结合下一节仍有最小的儿子未到场，此处不会被理解为耶西总共只有七子。
- source_word: לִפְנֵי
  choice: 从撒母耳面前
  rationale: לִפְנֵי在此表达空间及呈现关系，“从……面前经过”符合现代汉语习惯。
- source_word: לֹא בָחַר
  choice: 没有拣选
  rationale: בחר意为选择、拣选；“拣选”保留此处上帝为特定使命选人的语义，同时不额外说明具体使命。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文本直接音译四字神名，以区别于“主”等称号。
- source_word: בָּאֵלֶּה
  choice: 这些人中的任何一个
  rationale: 介词ב与指示代词结合，在否定句中表示这些人当中没有一人被选；这一译法自然、明确地传达该范围。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文使用四字神名；“雅威”较直接反映学界通常重构的读音，并保留其作为专名的性质。
- issue: בחר在本节中的语义
  choice: 拣选
  alternative: 选择
  rationale: “拣选”能体现这是雅威为特定身份或使命作出的选择；译文不补出“作王”，以免加入本节未明说的内容。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。首句保留耶西使儿子们经过撒母耳面前的使役关系；末句用“任何一个”清楚表达对这七人的逐一排除。
