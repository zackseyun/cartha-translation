  yaml_path: translation/ot/1_samuel/016/019.yaml
  text: So Saul sent messengers to Jesse and said[a], “Send me your son David, who is with the flock.”
translation:
  language: zh_hans
  text: 于是，扫罗派使者到耶西那里，说：“把你儿子大卫，就是在羊群中[a]的那个，送到我这里来。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“跟羊群在一起”。
    reason: 希伯来语 בַּצֹּאן 可表示在羊群中，也可较宽泛地表示与羊群在一起。
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: 派
  rationale: 该叙事性动词表示扫罗差遣人员；与“使者”搭配时，“派”是自然、准确的现代汉语表达。
- source_word: מַלְאָכִים
  choice: 使者
  rationale: 此处指人所派出的传信者，并非天使；“使者”既保留原词意义，也不额外暗示正式外交身份。
- source_word: אֶל־יִשָׁי
  choice: 到耶西那里
  rationale: 介词表示使者前往耶西所在之处；此译符合现代汉语叙事习惯。
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 该动词引出扫罗的直接引语；“说”保留了原文简洁的引语结构。
- source_word: שִׁלְחָה אֵלַי
  choice: 送到我这里来
  rationale: 祈使形式要求耶西把大卫送来见扫罗；“到我这里来”清楚表达 אֵלַי 的趋向。
- source_word: אֶת־דָּוִד בִּנְךָ
  choice: 你儿子大卫
  rationale: 按自然汉语次序呈现“大卫”与“你儿子”的同位关系。
- source_word: אֲשֶׁר בַּצֹּאן
  choice: 就是在羊群中的那个
  rationale: 原文以关系从句限定大卫；“在羊群中”较贴近介词 בְּ 的空间含义，同时不擅自补出“牧放”等动作。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重的现代标准汉语。保留原文简洁的叙事推进和直接引语；未将大卫明确译作“正在放羊”，因为本节原文只说明他与羊群的位置关系。
