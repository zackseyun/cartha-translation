  text: וַ/יַּעֲבֵ֥ר יִשַׁ֖י שַׁמָּ֑ה וַ/יֹּ֕אמֶר גַּם בָּ/זֶ֖ה לֹא בָחַ֥ר יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/009.yaml
  text: Then Jesse made Shammah pass by, and he said, “Yahweh has not chosen this one either.”
translation:
  language: zh_hans
  text: 耶西又让沙玛从撒母耳面前经过。撒母耳说：“雅威也没有拣选这个。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲבֵר
  choice: 让……从……面前经过
  rationale: עבר的使役式表示耶西使沙玛走过；结合上下文补出“从撒母耳面前”，使中文自然并清楚呈现动作场景。
- source_word: יִשַׁי
  choice: 耶西
  rationale: 采用该人名在现代中文圣经中的通行译法。
- source_word: שַׁמָּה
  choice: 沙玛
  rationale: 按希伯来语人名音译，并采用现代中文常见形式。
- source_word: וַיֹּאמֶר
  choice: 撒母耳说
  rationale: 希伯来文直译为“他说”；根据紧接的上下文，说话者是撒母耳。中文若只用“他说”容易误指耶西，因此明确主语。
- source_word: גַּם
  choice: 也
  rationale: 表示沙玛与先前受察看的儿子同样未被拣选；在否定句中用“也”自然表达其附加意义。
- source_word: בָּזֶה
  choice: 这个
  rationale: 指眼前正受察看的沙玛；“这个”保留原文指示语的简洁表达。
- source_word: לֹא בָחַר
  choice: 没有拣选
  rationale: בחר意为选择、拣选；“没有拣选”符合叙事当下的判断，也保留本段关于神选择受膏者的语境。
- source_word: יְהוָה
  choice: 雅威
  rationale: 将四字神名作为专名音译为“雅威”，而不以头衔替代。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较贴近学界通常所复原的读音，也明确保留其专名性质。
- issue: 是否将 בחר 译为带有神学色彩的“拣选”
  choice: 拣选
  alternative: 选择
  rationale: 此处是雅威认定以色列未来受膏者的行动。“拣选”既准确表达“选择”，也与本段语境相称，但不额外说明拣选的方式或原因。
translation_notes:
  register: 采用现代、庄重而易懂的叙事中文。“又”承接前一位儿子受察看的情节；第二句明确说话者为撒母耳，以避免中文代词歧义。
