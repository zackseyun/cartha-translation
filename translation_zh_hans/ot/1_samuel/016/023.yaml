  text: וְ/הָיָ֗ה בִּֽ/הְי֤וֹת רֽוּחַ אֱלֹהִים֙ אֶל שָׁא֔וּל וְ/לָקַ֥ח דָּוִ֛ד אֶת הַ/כִּנּ֖וֹר וְ/נִגֵּ֣ן בְּ/יָד֑/וֹ וְ/רָוַ֤ח לְ/שָׁאוּל֙ וְ/ט֣וֹב ל֔/וֹ וְ/סָ֥רָה מֵ/עָלָ֖י/ו ר֥וּחַ הָ/רָעָֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/023.yaml
  text: And whenever the spirit of God came upon Saul[a], David would take the lyre and play it with his hand; then Saul found relief, and it was well with him[c][b], and the harmful spirit departed from him.
translation:
  language: zh_hans
  text: 每当上帝的灵[a]临到扫罗，大卫就拿起里拉琴[b]，用手弹奏；扫罗便得到舒缓，情况也好转了，那有害的灵[c]就离开了他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本句前半直译为“上帝的灵”，末尾则说“那有害的灵”。译文保留希伯来文这两种不同说法，没有把它们统一。
    reason: alternative_reading
  - marker: b
    text: 传统上也译作“竖琴”。希伯来语 kinnor 指一种古代弦乐器，形制可能更接近里拉琴，而非现代竖琴。
    reason: lexical_alternative
  - marker: c
    text: 也可译作“那邪恶的灵”。希伯来语在此可指“邪恶的”，也可指“有害的”；本节语境可能侧重这个灵给扫罗带来的伤害和痛苦。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה בִּהְיוֹת
  choice: 每当
  rationale: 该结构在这里引出反复发生的情形；“每当”既表达其重复性，也符合现代汉语叙事习惯。
- source_word: רוּחַ אֱלֹהִים
  choice: 上帝的灵
  rationale: 希伯来文此处直作“上帝的灵”，并未带“邪恶”或“有害”等修饰语，因此不从相邻经文补入限定。
- source_word: אֶל שָׁאוּל
  choice: 临到扫罗
  rationale: “临到”自然表达这个灵开始作用于扫罗，同时保留原文介词结构所呈现的动态意味。
- source_word: הַכִּנּוֹר
  choice: 里拉琴
  rationale: כִּנּוֹר 指古代弦乐器，形制更接近里拉琴，而不是现代竖琴。
- source_word: וְנִגֵּן בְּיָדוֹ
  choice: 用手弹奏
  rationale: נגן 在此指弹奏弦乐器；汉语可依据上文自然省略宾语，并保留“用手”这一原文表达。
- source_word: וְרָוַח לְשָׁאוּל
  choice: 扫罗便得到舒缓
  rationale: 该动词表示得到缓解或喘息；此译法明确扫罗是这种状态的体验者。
- source_word: וְטוֹב לוֹ
  choice: 情况也好转了
  rationale: 原意为“对他而言变好了”；此译法在现代汉语中自然，同时不过度限定为单纯的情绪改善。
- source_word: רוּחַ הָרָעָה
  choice: 那有害的灵
  rationale: רָעָה 可表示邪恶，也可表示带来伤害或祸患；上下文着重其对扫罗造成的痛苦，故正文采用“有害”，并以脚注保留“邪恶”的可能。
- source_word: וְסָרָה מֵעָלָיו
  choice: 就离开了他
  rationale: סור 在此表示移开、离去；“离开了他”清楚自然，也准确传达原意。
theological_decisions:
- issue: 本节前半的 רוּחַ אֱלֹהִים 与末尾的 רוּחַ הָרָעָה 应如何彼此关联
  choice: 分别译作“上帝的灵”和“那有害的灵”，不在正文中将两者措辞统一。
  alternative: 将前者解释性地译作“从上帝那里来的有害之灵”，或将后者译作“邪灵”。
  rationale: 希伯来文本身在两处使用不同表达。保留这一区别，可避免把上下文中的解释直接写进前半句，也不武断判定后一个灵的道德属性，从而保留原文的神学张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。句式保留原文各动作与结果的推进关系，同时避免生硬直译；“得到舒缓，情况也好转了”分别对应原文两个并列分句。
