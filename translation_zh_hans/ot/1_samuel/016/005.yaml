base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/005.yaml
  text: He said[a], “Peace. I have come to sacrifice to Yahweh. Consecrate yourselves, and come with me to the sacrifice.” And he consecrated Jesse and his sons and invited them to the sacrifice.
translation:
  language: zh_hans
  text: 他说：“平安。[a]我来是要向雅威献祭。你们要使自己分别为圣，跟我一同来参加献祭。”于是，他使耶西和他的众子分别为圣，并邀请他们来参加献祭。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“是为平安而来。”希伯来文这里只说“平安”，意在表明撒母耳此行并无敌意。
    reason: 说明שָׁלוֹם在问答语境中的省略式、惯用含义，并保留另一种自然译法。
lexical_decisions:
- source_word: שָׁלוֹם
  choice: 平安
  rationale: 这是对上一节“你是为平安而来吗”的回答。保留原文单独使用名词的简洁形式，同时表达撒母耳此行并无敌意。
- source_word: לִזְבֹּחַ לַיהוָה
  choice: 向雅威献祭
  rationale: 不定式表达来访的目的；“向……献祭”自然、简洁，也保留祭祀敬拜的含义。
- source_word: הִתְקַדְּשׁוּ
  choice: 使自己分别为圣
  rationale: 该词在此指为参与献祭而作礼仪上的圣洁预备。“分别为圣”比单说“洁净”更完整地保留קדשׁ的分别、归圣含义。
- source_word: וּבָאתֶם אִתִּי בַּזָּבַח
  choice: 跟我一同来参加献祭
  rationale: 承接前面的吩咐，表达预备之后与撒母耳共同参与这次献祭；“参加”使现代汉语清楚自然。
- source_word: וַיְקַדֵּשׁ
  choice: 他使……分别为圣
  rationale: 与前句同一词根相呼应，表示撒母耳为耶西和众子作参与献祭所需的圣洁预备。
- source_word: וַיִּקְרָא לָהֶם לַזָּבַח
  choice: 邀请他们来参加献祭
  rationale: קרא ל在本语境中表示叫人前来参与；“邀请”比“召来”更符合献祭场合中的接纳含义，又不暗示强制。
- source_word: יִשַׁי וְאֶת־בָּנָיו
  choice: 耶西和他的众子
  rationale: 按通行中文形式音译人名，并准确保留原文所指的男性后代。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名。采用“雅威”作为现代汉语中对YHWH的音译，以神名而非称号“主”来呈现。
- issue: קדשׁ在献祭语境中的含义
  choice: 分别为圣
  alternative: 洁净
  rationale: 此处涉及参与神圣礼仪前的预备，但原词的意义不只限于洗濯或除去污秽；“分别为圣”保留其礼仪和归圣层面，不进一步规定具体仪式。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。对献祭礼仪术语适度直译，以保留原文קדשׁ前后呼应；句法则按现代汉语调整，避免仿古表达。
