- from: 于是，扫罗派人去见耶西，说：“请让大卫留在我面前[a]，因为他在我眼中蒙了恩。”
  to: 于是，扫罗派人到耶西那里去，说：“请让大卫侍立在我面前[a]，因为他在我眼中得了恩宠。”
  rationale: 修订以“侍立在我面前”呈现 עמד לְפָנַי 的字面及宫廷服务含义，并以脚注保留“留在”的持续任职解释。将“蒙了恩”改为“得了恩宠”，明确这是扫罗的个人青睐，忠实呈现 מָצָא חֵן בְּעֵינַי，而不引入不必要的神学联想。
