base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/022.yaml
  text: Then Saul sent to Jesse[a], saying, “Please let David stand before me, for he has found favor in my eyes.”
translation:
  language: zh_hans
  text: 于是，扫罗派人到耶西那里去，说：“请让大卫侍立在我面前[a]，因为他在我眼中得了恩宠。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“请让大卫留在我面前。”此处“侍立在……面前”指在扫罗身边继续侍奉。
    reason: עמד 字面为“站立”，在王室语境中可指侍立、持续供职；保留“留在”的语境性译法。
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: 于是，扫罗派人去
  rationale: 该叙事性连续式推动情节发展；“于是”自然表达承接关系。希伯来文未明说所派何人，汉语用“派人去”补出动作所必含的受差者，而不增添其身份。
- source_word: אֶל יִשַׁי לֵאמֹר
  choice: 去见耶西，说
  rationale: אֶל 表示朝向人物，לֵאמֹר 引入直接引语；“去见耶西，说”符合现代汉语传话语境，并保留引语结构。
- source_word: יַעֲמָד נָא
  choice: 请让……留在
  rationale: עמד 的祈愿式配合 נָא 构成礼貌请求。字面可译“站立”，但在王宫语境中指继续侍立、服侍；“留在”更自然地传达此处持续任职的含义，同时以脚注保留字面表达。
- source_word: לְפָנַי
  choice: 我面前
  rationale: 保留希伯来语“在某人面前”的宫廷性意象，在上下文中可理解为在扫罗身边侍候。
- source_word: כִּי
  choice: 因为
  rationale: 引出扫罗提出请求的理由，现代汉语中“因为”清楚自然。
- source_word: מָצָא חֵן בְּעֵינַי
  choice: 他在我眼中蒙了恩
  rationale: 保留“找到恩惠/在眼中”的希伯来习语意象；“蒙了恩”在此表示获得扫罗的喜爱与认可，并非特指神学意义上的恩典。
- source_word: שָׁאוּל / יִשַׁי / דָוִד
  choice: 扫罗／耶西／大卫
  rationale: 采用现代中文圣经传统中通行的人名译法。
theological_decisions: []
