base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/002.yaml
  text: Samuel said[a], “How can I go? If Saul hears, he will kill me.” And Yahweh said, “Take a heifer with you and say, ‘I have come to sacrifice to Yahweh.’”
translation:
  language: zh_hans
  text: 撒母耳说：“我怎能去呢？扫罗若听见了，就会杀我。”雅威说：“你要带一头小母牛[a]，并说：‘我是来向雅威献祭的。’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“一头母牛犊”。
    reason: עֶגְלַת בָּקָר 指幼小的雌性牛；正文用较自然的“小母牛”，脚注保留较贴近构词的替代译法。
lexical_decisions:
- source_word: אֵיךְ אֵלֵךְ
  choice: 我怎能去呢
  rationale: 疑问词与未完成式在这里表达实际可行性；“我怎能去呢”自然传达撒母耳因危险而提出的疑问。
- source_word: וְשָׁמַע שָׁאוּל
  choice: 扫罗若听见了
  rationale: 形式上由连接词加完成式构成，但语境表明这是条件从句；用“若”明确原文隐含的条件关系。
- source_word: וַהֲרָגַנִי
  choice: 必定会杀我
  rationale: 表示扫罗得知此事后可预期的后果；“必定会”保留撒母耳所感受到的现实威胁和确定性。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神名音译，不以称号替代原文专名。
- source_word: עֶגְלַת בָּקָר
  choice: 一头小母牛
  rationale: 该结构指幼小的雌性牛，适合作祭牲；“小母牛”在现代汉语中清楚自然，也保留其性别信息。
- source_word: תִּקַּח בְּיָדֶךָ
  choice: 你要带……去
  rationale: 原文直译为“拿在你手中”，实际是随身带去的惯用表达；中文译作“带……去”更自然。
- source_word: לִזְבֹּחַ לַיהוָה
  choice: 向耶和华献祭
  rationale: 准确表达祭祀行为及其对象，不额外限定具体礼仪细节。
- source_word: בָּאתִי
  choice: 我是来……的
  rationale: 完成式在到达后说明来意；汉语“我是来……的”最自然地表达已经来到并陈明目的。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用四字神名而非一般称号；正文保留专名，并采用现代中文圣经传统中最广为人知的音译“耶和华”。
- issue: 撒母耳所说话语的条件关系
  choice: 扫罗若听见了，必定会杀我
  alternative: 扫罗听见，就会杀我
  rationale: 原文并未使用显式条件词，但上下文构成清楚的条件—结果关系；加入“若”不消除其神学张力，只使汉语逻辑自然明确。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。用“怎能”“若”“献祭”保持经文语体，但避免生硬文言；引语层级和标点按现代简体中文规范处理。脚注标记置于其实际对应的“一头小母牛”之后。
