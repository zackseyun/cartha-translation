revisions:
- from: 撒母耳说：“我怎能去呢？扫罗若听见了，必定会杀我。”耶和华说：“你要带一头小母牛[a]去，并且说：‘我是来向耶和华献祭的。’”
  to: 撒母耳说：“我怎能去呢？扫罗若听见了，就会杀我。”雅威说：“你要带一头小母牛[a]，并说：‘我是来向雅威献祭的。’”
  rationale: 修订神名以遵循英语审校轨迹所确立的 Yahweh 音译原则；删去“必定”以避免强化原文未明示的确定性；并使“带”的表达不额外引入方向。其余句法、条件关系、祭祀术语及脚注锚点均予保留。
