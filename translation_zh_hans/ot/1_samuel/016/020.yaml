  source_fidelity: “牵来”和“带上”分别给 וַיִּקַּח 加入了原文未说明的动作与方向；原文以一个动词统领驴、饼、酒和山羊羔。将“驮着饼”置于正文虽合乎语境，却把原文未明说的关系确定化；宜依脚注所述保留其简略性。其余礼物、单数、亲属关系和借大卫送达扫罗的意思均传达准确。
  naturalness: 修订后以“备了”自然统领所列物品；“托他儿子大卫送给扫罗”是现代汉语中准确自然的委托、递送表达。
  terminology: “皮袋酒”“山羊羔”“扫罗”“耶西”“大卫”均恰当。“饼”可作集体性食物名词，无须擅加数量词。
