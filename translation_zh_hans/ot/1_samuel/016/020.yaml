  text: So Jesse took a donkey[a], bread, a skin of wine, and one young goat[b], and sent them by the hand of David his son to Saul.
translation:
  language: zh_hans
  text: 耶西就备了一头驴、饼、一皮袋酒和一只山羊羔，托他儿子大卫送给扫罗。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקַּח
  choice: 就牵来……又带上
  rationale: 该叙事性连续式推动情节；因宾语包括驴和食物，按现代汉语分别用“牵来”和“带上”，比笼统译作“拿”自然。
- source_word: חֲמוֹר לֶחֶם
  choice: 一头驮着饼的驴[a]
  rationale: 希伯来文仅将“驴”和“饼”并列，未明说二者关系；上下文表明驴是运载礼物的牲畜。正文采用自然明确的表达，脚注保留原文的简略结构。
- source_word: נֹאד יַיִן
  choice: 一皮袋酒
  rationale: נֹאד 指以兽皮制成的容器；“一皮袋酒”既体现容器材质，也符合简洁的现代汉语。
- source_word: גְּדִי עִזִּים אֶחָד
  choice: 一只山羊羔
  rationale: 该短语指一只年幼的山羊；“山羊羔”保留种类、幼龄和单数含义。
- source_word: וַיִּשְׁלַח בְּיַד
  choice: 托……送给
  rationale: בְּיַד 字面为“借着……的手”，在此是委托某人携送的惯用语；“托……送给”准确而自然。
- source_word: דָּוִד בְּנוֹ
  choice: 他儿子大卫
  rationale: 符合现代汉语亲属称谓和专名的自然次序，同时清楚表明大卫与耶西的关系。
- source_word: אֶל שָׁאוּל
  choice: 给扫罗
  rationale: 准确表达礼物被送往扫罗这一方向和接受者关系。
