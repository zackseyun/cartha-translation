    rationale: 希伯来文是“你要为我膏立我对你说的那一位”的关系从句结构，并非直接疑问“是谁”。现有译文虽大体达意，却在现代汉语中显得迂回，且“我告诉你的是谁”可暂时被理解为询问或说明“我告诉你的内容”。改用“我告诉你的那一位”更贴近原文并更自然。
