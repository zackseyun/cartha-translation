base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/003.yaml
  text: Invite Jesse to the sacrifice[a], and I will make known to you what you shall do[c][b]; and you shall anoint for me the one whom I tell you.
translation:
  language: zh_hans
  text: 你要请耶西来参加献祭[a]，我会让你知道你该做什么[b]；你要为我膏立我告诉你的那一位[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你要召耶西来参加献祭。”
    reason: lexical_alternative
  - marker: b
    text: 或译：“我会把你该做的事指示你。”
    reason: lexical_alternative
  - marker: c
    text: 直译：“你要为我膏立我对你所说的那一位。”
    reason: literal_rendering
lexical_decisions:
- source_word: וְקָרָאתָ
  choice: 你要请
  rationale: קרא在献祭场合表示召来或邀请某人参加；“请……来”既自然，也保留命令语气。
- source_word: לְיִשַׁי
  choice: 耶西
  rationale: 按现代中文圣经人名的通行译法音译。
- source_word: בַּזָּבַח
  choice: 来参加献祭
  rationale: זבח可指献祭行为，也可指相关场合或筵席；结合קרא，译为“来参加献祭”最符合此处语境，同时不把它限定为献祭后的筵席。
- source_word: וְאָנֹכִי אוֹדִיעֲךָ
  choice: 我会让你知道
  rationale: ידע的使役形表示“使……知道、告知”；“让你知道”保留使役意味，也符合现代汉语表达。独立代词אָנֹכִי所带的强调由明确的“我”体现，不额外强化为“我亲自”，以免过译。
- source_word: אֵת אֲשֶׁר תַּעֲשֶׂה
  choice: 该做什么
  rationale: 表达将来指示和应当采取的行动；“该做什么”比逐字式“你将要做的事”更自然，而未增加更强的义务色彩。
- source_word: וּמָשַׁחְתָּ
  choice: 你就要……膏立
  rationale: משׁח指以膏抹施行正式分别或任命；在此叙事语境中“膏立”自然且保留其正式意义，但正文不明说所立的职分。
- source_word: לִי
  choice: 为我
  rationale: 表示这次膏立是为上帝、按上帝的旨意而行；“为我”直接保留原文关系。
- source_word: אֵת אֲשֶׁר אֹמַר אֵלֶיךָ
  choice: 我告诉你的是谁
  rationale: 原文直译近于“我对你所说的那一位”，指上帝随后指定的人。“我告诉你的是谁”在中文中自然，并避免把אמר过度具体化为“点名”或“指给”。
theological_decisions:
- issue: 膏立的性质与职分
  choice: 保留“膏立”这一正式分别、任命行动，但不在本节正文中明说“作王”。
  alternative: 译作“膏立为王”。
  rationale: 上下文表明这是君王的膏立，但本节希伯来文本没有明说职分；让叙事上下文提供这一信息，可避免把隐含内容写入正文。
- issue: 上帝指定受膏者的表达
  choice: 译为“我告诉你的是谁，你就要为我膏立谁”。
  alternative: 译为“我指给你谁，你就膏立谁”。
  rationale: אמר的基本义是“说、告诉”，不是“指给看”；所选译法保留由上帝指定对象的意义，同时不过度引入视觉性的“指示”。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“请……来参加献祭”适合礼仪场合；“膏立”保留古代正式任命的文化与神学分量。分成两句以符合现代汉语节奏，同时保留原文命令、应许和随后执行的逻辑关系。
