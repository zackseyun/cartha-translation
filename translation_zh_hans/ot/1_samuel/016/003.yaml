  verdict: revise
  source_fidelity: 草稿准确传达了邀请耶西参加祭祀、上帝将告知撒母耳当做之事，以及奉上帝之命膏立指定者的基本意思。“为我膏立”忠实保留了לִי，且没有擅自加入“作王”。但“我告诉你的是谁，你就要为我膏立谁”在汉语中较像间接疑问句式，指称关系不如原文的“那一位”结构清楚，也使原文直接宾语的表达显得迂回。
  naturalness: “请耶西来参加献祭”自然、庄重。“我会让你知道该做什么”虽可懂，但补出“你”后更符合现代汉语的完整表达。末句改为“膏立我告诉你的那一位”可避免“是谁……谁”的口语式回指，并保留庄重叙事语体。
  terminology: “耶西”“献祭”“膏立”均为恰当且通行的中文圣经用语。“膏立”不应改作“膏立为王”，因为本节未明言职分。“为我”应保留，表明该行动是按上帝的旨意、为上帝而行。
