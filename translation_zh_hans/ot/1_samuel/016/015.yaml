base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/015.yaml
  text: And Saul’s servants said to him[a], “Look now, an evil spirit from God is terrifying you.”
translation:
  language: zh_hans
  text: 扫罗的臣仆对他说：“你看，如今有一个从上帝来的恶灵[a]正在使你惊恐。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “恶灵”也可译作“有害的灵”或“使人痛苦的灵”。希伯来语既可描述这灵为恶，也可描述它带来伤害或痛苦。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: 对他说
  rationale: 未完成式连续体推进叙事；汉语不必机械补出“于是”，由语序自然表达事件的承接。
- source_word: עַבְדֵי שָׁאוּל
  choice: 扫罗的臣仆
  rationale: עֶבֶד可指仆人、臣属；此处是王室环境，“臣仆”既符合身份，也不突出奴隶制度含义。
- source_word: אֵלָיו
  choice: 对他说
  rationale: 将介词及第三人称代词自然并入汉语引语引介句。
- source_word: הִנֵּה נָא
  choice: 你看，现在
  rationale: 保留提醒对方注意和眼前情势的语用功能，同时避免过于古雅的“看哪”。
- source_word: רוּחַ אֱלֹהִים
  choice: 一个从上帝来的……灵
  rationale: 此处表达这灵与上帝之间的来源或差遣关系；译作“从上帝来的”可保留经文的主张，又不把它等同于“上帝的灵”。
- source_word: רָעָה
  choice: 恶
  rationale: רָעָה可表示邪恶，也可表示有害、使人痛苦；正文采用直接而传统的“恶”，并以脚注保留语义上的其他可能。
- source_word: מְבַעִתֶּךָ
  choice: 正使你惊恐
  rationale: 分词表达持续或正在发生的作用；该动词含强烈惊骇、恐惧之意，“正使你惊恐”兼顾力度与现代汉语表达。
theological_decisions:
- issue: 如何翻译 רוּחַ אֱלֹהִים רָעָה，既保留它与上帝的关系，又不加入后来的教义判断
  choice: 一个从上帝来的恶灵
  alternative: 一个从上帝来的有害之灵；上帝的一个恶灵
  rationale: 希伯来文表明这灵在某种意义上来自上帝或受上帝差遣，不能淡化这一张力；同时，“从上帝来的”避免让读者误以为它就是上帝自己的圣灵。רָעָה究竟侧重“恶”还是“有害、使人痛苦”，正文不作教义化裁定，而由脚注保留另一种理解。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“臣仆”体现王室语境；“你看，现在”传达原文的提醒与紧迫感；避免以过度古雅或教义化的措辞消解原文张力。
