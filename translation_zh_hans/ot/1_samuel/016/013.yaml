  text: וַ/יִּקַּ֨ח שְׁמוּאֵ֜ל אֶת קֶ֣רֶן הַ/שֶּׁ֗מֶן וַ/יִּמְשַׁ֣ח אֹת/וֹ֮ בְּ/קֶ֣רֶב אֶחָי/ו֒ וַ/תִּצְלַ֤ח רֽוּחַ יְהוָה֙ אֶל דָּוִ֔ד מֵ/הַ/יּ֥וֹם הַ/ה֖וּא וָ/מָ֑עְלָ/ה וַ/יָּ֣קָם שְׁמוּאֵ֔ל וַ/יֵּ֖לֶךְ הָ/רָמָֽתָ/ה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/013.yaml
  text: Then Samuel took the horn of oil and anointed him in the midst of his brothers[a]. And the Spirit of Yahweh rushed upon David from that day onward[b]. Then Samuel rose and went to Ramah.
translation:
  language: zh_hans
  text: 撒母耳就拿起那盛着油的角，在大卫的众兄弟中间膏了大卫。雅威的灵从那日起就猛然临到大卫身上，并一直如此[a][b]。随后，撒母耳起身往拉玛去了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “猛然临到”也可译作“大有能力地临到”。这里的希伯来语动词强调有力、使人得能力的临到。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文没有类似英语大小写的形式，不能借此判定这里的“灵”是否作为专有称谓。本译文依照上下文译作“雅威的灵”。
    reason: alternative_reading
lexical_decisions:
- source_word: קֶרֶן הַשֶּׁמֶן
  choice: 盛油的角
  rationale: קֶרֶן本义为动物的角，此处指用作油器的角。“盛油的角”既保留具体意象，也让现代读者清楚其用途，不误解为普通瓶罐。
- source_word: וַיִּמְשַׁח
  choice: 膏了
  rationale: משׁח是礼仪性膏立的标准动词。“膏了”同时保留实际涂油的动作及其君王膏立意义，避免以“立为王”等解释性措辞提前说尽其含义。
- source_word: בְּקֶרֶב אֶחָיו
  choice: 在大卫的众兄弟中间
  rationale: בְּקֶרֶב意为“在……中间”；אֶחָיו指他的兄弟。补出“大卫的”以消除现代汉语代词可能造成的歧义，但不推断在场者对此事的政治认识。
- source_word: וַתִּצְלַח רוּחַ יְהוָה אֶל דָּוִד
  choice: 雅威的灵……猛然临到大卫身上
  rationale: צלח在《撒母耳记》中与神的灵连用时，描写带着力量、使人得能力的临到。“猛然临到”保留动词的力度和叙事鲜明性；“身上”符合现代汉语搭配。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语中较通行、接近学术重构读音的音译呈现四字神名，保留其作为以色列之神专名的性质，而不以称号替代。
- source_word: מֵהַיּוֹם הַהוּא וָמָעְלָה
  choice: 从那日起
  rationale: 该短语表示由那一天开始并持续下去。汉语“从那日起”简洁自然，结合“便”与上下文可表达持续起点。
- source_word: וַיָּקָם
  choice: 起身
  rationale: קום在连续叙事中表示起身并采取下一行动。“起身”比单纯“起来”更符合庄重而自然的叙事语体。
- source_word: הָרָמָתָה
  choice: 往拉玛去了
  rationale: 词尾方向标记表示朝拉玛而去；“往……去了”自然表达目的方向。地名按常用汉语形式音译为“拉玛”。
theological_decisions:
- issue: רוּחַ יְהוָה的所指
  choice: 雅威的灵
  alternative: 雅威的气息／从雅威而来的灵
  rationale: רוּחַ可指灵、风或气息；在本段与神名组成属格结构，并以赋能性的方式临到大卫，最自然是指神的灵。但希伯来文没有英文字母大小写所形成的“Spirit/spirit”区别，因此不借排版消除其语言层面的张力。
- issue: 大卫受膏的公开程度
  choice: 在大卫的众兄弟中间
  alternative: 在他的家人面前私下受膏
  rationale: 原文明确提到大卫的兄弟们，却没有说明更广泛的公众是否在场，也没有交代兄弟们如何理解此举。译文只保留经文明说的在场范围，不加入政治或教义推论。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。保留“盛油的角”“膏”“猛然临到”等源文的具体意象和力度；神名译作“雅威”。两处脚注标记均紧随相关分句，避免英文咨询层中脚注标记位置错置的问题。
