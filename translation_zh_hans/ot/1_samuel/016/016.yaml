  text: יֹאמַר נָ֤א אֲדֹנֵ֨/נוּ֙ עֲבָדֶ֣י/ךָ לְ/פָנֶ֔י/ךָ יְבַקְשׁ֕וּ אִ֕ישׁ יֹדֵ֖עַ מְנַגֵּ֣ן בַּ/כִּנּ֑וֹר וְ/הָיָ֗ה בִּֽ/הְי֨וֹת עָלֶ֤י/ךָ רֽוּחַ אֱלֹהִים֙ רָעָ֔ה וְ/נִגֵּ֥ן בְּ/יָד֖/וֹ וְ/ט֥וֹב לָֽ/ךְ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/016.yaml
  text: Please let our lord say to your servants before you that they should seek out a man who knows how to play the lyre; and when a harmful spirit from God is upon you[a], he will play with his hand, and it will be well for you.
translation:
  language: zh_hans
  text: 请我主吩咐侍立在你面前的仆人，让他们寻找一个会弹琴的人；当从上帝而来的有害之灵临到你时[a]，他就用手弹奏，你便会好起来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“从上帝而来的恶灵”；原文也可直译为“上帝的有害之灵（或恶灵）”。
    reason: 保留 רָעָה 可表示“有害的／恶的”，以及 אֱלֹהִים 属格关系可理解为“上帝的／从上帝而来”的歧义。
lexical_decisions:
- source_word: יֹאמַר נָא אֲדֹנֵינוּ
  choice: 请我主吩咐
  rationale: 未完成式配合 נָא 表示恭敬的请求；在宫廷语境中，“我主”是对扫罗的尊称，“请……吩咐”自然传达臣仆请君王下令的语气。
- source_word: עֲבָדֶיךָ לְפָנֶיךָ
  choice: 侍立在你面前的仆人
  rationale: 既保留“在你面前”的空间意象，也明确这些仆人是随侍君王的臣仆。
- source_word: יְבַקְשׁוּ אִישׁ
  choice: 让他们寻找一个……的人
  rationale: 体现复数动词所表达的提议或命令，即由仆人有目的地物色合适的人。
- source_word: יֹדֵעַ מְנַגֵּן
  choice: 会弹琴
  rationale: 该结构表示具备演奏能力；“会弹琴”是简洁自然的现代汉语。
- source_word: כִּנּוֹר
  choice: 琴
  rationale: 指古代拨弦乐器，具体形制近似里拉琴；正文用普通读者熟悉的“琴”，脚注说明其器类，避免误认作现代特定乐器。
- source_word: רוּחַ אֱלֹהִים רָעָה
  choice: 从上帝而来的有害之灵
  rationale: “从上帝而来”保留来源关系；רָעָה 在此可强调其带来的伤害或灾祸，“有害”避免无依据地限定为道德意义上的邪恶，同时以脚注保留“恶灵”和“上帝的……”等可能表达。
- source_word: עָלֶיךָ
  choice: 临到你
  rationale: 自然表达灵作用于或压迫扫罗的动态情形。
- source_word: וְנִגֵּן בְּיָדוֹ
  choice: 他就用手弹奏
  rationale: 保留希伯来文具体的“用他的手”，同时在汉语中清楚指向乐器演奏。
- source_word: וְטוֹב לָךְ
  choice: 你便会好起来
  rationale: 表达状况得到改善，较“感觉好些”更宽泛，也符合此处预期缓解的语境。
theological_decisions:
- issue: 如何翻译 רוּחַ אֱלֹהִים רָעָה，并保留其来源和性质上的张力
  choice: 从上帝而来的有害之灵
  alternative: 从上帝而来的恶灵；上帝的有害之灵／恶灵
  rationale: 原文明确把该灵与上帝相联，属格结构可表达“属于”或“来自”。正文采用“从上帝而来”呈现来源关系，并以“有害”突出 רָעָה 在本语境中的伤害性；脚注保留“恶”以及“上帝的”这一更贴近形式的可能译法，不额外解释上帝与该灵之间的因果或许可关系。
translation_notes:
  register: 采用现代、庄重而易懂的宫廷叙事语言。“我主”在此是臣仆对扫罗的尊称，并非上帝的称号；“侍立”交代宫廷随侍身份。正文避免过度古雅，也不加入原文未说明的神学解释。
