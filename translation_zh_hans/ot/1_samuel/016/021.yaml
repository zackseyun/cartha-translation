base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/021.yaml
  text: So David came to Saul and stood before him[a], and Saul loved him greatly, and he became his armor-bearer.
translation:
  language: zh_hans
  text: 大卫来到扫罗那里，侍立在他面前；扫罗非常喜爱大卫，大卫就成了扫罗的拿兵器的侍从[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“拿武器的人”或“携带军用装备的人”。希伯来语字面指携带装备的人；在这里指为战士携带军事装备的侍从。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: 来到
  rationale: בוא 与 אֶל שָׁאוּל 连用，表示朝扫罗所在之处而来；“来到扫罗那里”自然地保留了移动方向，而不额外限定为进入某个建筑。
- source_word: וַיַּעֲמֹד לְפָנָיו
  choice: 侍立在他面前
  rationale: עמד לפני 字面是“站在……面前”，在君王宫廷语境中也有随侍、供职之意；“侍立在他面前”同时保留站立的图景和服侍的含义。
- source_word: וַיֶּאֱהָבֵהוּ מְאֹד
  choice: 扫罗非常喜爱大卫
  rationale: 原文直译为“他非常爱他”；上下文表明主语是扫罗、宾语是大卫。译出人名可避免现代汉语连续代词造成歧义；“喜爱”表达强烈的个人好感与器重，不过度赋予亲情或浪漫意味。
- source_word: וַיְהִי לוֹ
  choice: 大卫就作了给他的
  rationale: 这一结构表示形成新的身份或关系。“就作了给他的……”符合汉语叙事习惯，也保留其成为扫罗侍从的结果。
- source_word: נֹשֵׂא כֵלִים
  choice: 拿兵器的侍从
  rationale: 该词组字面指“携带器具／装备的人”，在军事和宫廷语境中是为战士携带武器装备的随从。“拿兵器的侍从”比单用较古雅的“拿兵器者”更易懂，同时不把 כֵלִים 过窄地限定为铠甲。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“侍立”保留宫廷场景的正式感，“拿兵器的侍从”则以普通读者容易理解的方式表达古代军事职分。为消除汉语代词指向不清，第二句重复“大卫”，但“给他”仍自然指向扫罗。
