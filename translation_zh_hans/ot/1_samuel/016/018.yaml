  text: וַ/יַּעַן֩ אֶחָ֨ד מֵ/הַ/נְּעָרִ֜ים וַ/יֹּ֗אמֶר הִנֵּ֨ה רָאִ֜יתִי בֵּ֣ן לְ/יִשַׁי֮ בֵּ֣ית הַלַּחְמִי֒ יֹדֵ֣עַ נַ֠גֵּן וְ/גִבּ֨וֹר חַ֜יִל וְ/אִ֧ישׁ מִלְחָמָ֛ה וּ/נְב֥וֹן דָּבָ֖ר וְ/אִ֣ישׁ תֹּ֑אַר וַ/יהוָ֖ה עִמּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/018.yaml
  text: Then one of the young men answered and said[a], “Look, I have seen a son of Jesse the Bethlehemite who is skillful in playing, a mighty man of valor, a man of war, prudent in speech, and a handsome man[d][c][b], and Yahweh is with him.”
translation:
  language: zh_hans
  text: 其中一个侍从回答说[a]：“我见过伯利恒人耶西的一个儿子；他善于弹奏，勇武有能，是个战士，言谈明智，相貌俊美，并且雅威与他同在。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “侍从”所译的希伯来词也可指“年轻人”或“仆人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן
  choice: 回答说
  rationale: 这是希伯来叙事中引出回应的惯用表达；现代汉语用“回答说”自然清楚。
- source_word: אֶחָד מֵהַנְּעָרִים
  choice: 侍从中有一个
  rationale: נְעָרִים 可指年轻人、仆人或侍从；本节处于扫罗宫廷的语境，“侍从”最符合其职分，同时以脚注保留词义范围。
- source_word: הִנֵּה רָאִיתִי
  choice: 我见过
  rationale: הִנֵּה 用于引人注意，汉语直接引出举荐内容更自然；完成式 רָאִיתִי 表示先前见过而如今据此推荐。
- source_word: בֵּן לְיִשַׁי בֵּית הַלַּחְמִי
  choice: 伯利恒人耶西的一个儿子
  rationale: 保留“耶西的一个儿子”以及表示籍贯的族称；语序明确将“伯利恒人”修饰耶西。
- source_word: יֹדֵעַ נַגֵּן
  choice: 善于弹奏
  rationale: 该短语表示懂得并擅长演奏；本节没有明说乐器，因此不补入“琴”等具体名称。
- source_word: גִּבּוֹר חַיִל
  choice: 勇武有能
  rationale: 这一固定短语兼有勇武、能力和英勇之意；“勇武有能”保留较宽的称赞意味，并避免与紧接的“战士”完全重复。
- source_word: אִישׁ מִלְחָמָה
  choice: 是个战士
  rationale: 直陈其军事身份或作战能力；现代汉语“战士”比“战争之人”自然。
- source_word: נְבוֹן דָּבָר
  choice: 言谈明达
  rationale: נבון 表示有理解力、明智，דבר 在此可涉及言语或事务；“言谈明达”保留其与说话、表达有关的主要理解。
- source_word: אִישׁ תֹּאַר
  choice: 相貌俊美
  rationale: תֹּאַר 指外形、容貌；此处是正面评价，用“相貌俊美”简洁自然。
- source_word: וַיהוָה עִמּוֹ
  choice: 并且雅威与他同在
  rationale: 直接音译神名 יהוה 为“雅威”，并保留“与他同在”这一有关神同在与眷顾的表述。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；“雅威”较贴近学界普遍采用的发音重构，也不把专名改写成称号。
- issue: “雅威与他同在”的含义
  choice: 保留原句，不解释为特定形式的认可或赐能
  alternative: 雅威帮助他；雅威赐福给他
  rationale: 原文只陈述神与他同在，可能蕴含眷顾、帮助或赐能，但本节没有进一步界定，因此保留其神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。人物优点以节奏清楚的并列短语表达；不补出原文未点明的乐器，也不把“雅威与他同在”解释得超过原文。
