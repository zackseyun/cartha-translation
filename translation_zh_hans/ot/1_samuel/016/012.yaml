  text: וַ/יִּשְׁלַ֤ח וַ/יְבִיאֵ֨/הוּ֙ וְ/ה֣וּא אַדְמוֹנִ֔י עִם יְפֵ֥ה עֵינַ֖יִם וְ/ט֣וֹב רֹ֑אִי וַ/יֹּ֧אמֶר יְהוָ֛ה ק֥וּם מְשָׁחֵ֖/הוּ כִּֽי זֶ֥ה הֽוּא־פ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/012.yaml
  text: So he sent and brought him in. Now he was ruddy[a], with beautiful eyes and a handsome appearance. And Yahweh said, “Rise, anoint him, for this is he.”
translation:
  language: zh_hans
  text: 于是，他派人把大卫带来。大卫肤色红润[a]，眼目俊美，容貌英俊。雅威说：“起来，膏他，因为这就是他。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “肤色红润”所译的希伯来词也可指外表带红色；原文并未明确说他有红头发。
    reason: 保留 אַדְמוֹנִי 所指究竟是肤色还是较宽泛外貌色泽的词义范围，并避免将其过度具体化为红发。
lexical_decisions:
- source_word: וַיִּשְׁלַח וַיְבִיאֵהוּ
  choice: 于是，他派人去把大卫带来
  rationale: 两个叙事性连续动词推动情节发展。原文宾语为“他”；中文补出“大卫”可避免连续代词造成指代不清，同时“派人去……带来”自然表达耶西差人召他的语义。
- source_word: אַדְמוֹנִי
  choice: 肤色红润
  rationale: 该词表示偏红的外貌或肤色，但不足以确定是红发；译作“肤色红润”既符合上下文的人物外貌描写，也避免过度具体化。
- source_word: עִם יְפֵה עֵינַיִם
  choice: 双目俊美
  rationale: 较贴近原文“眼睛美丽”的结构，并以庄重、自然的现代中文表达。
- source_word: וְטוֹב רֹאִי
  choice: 容貌英俊
  rationale: 该短语指外表悦目、好看；“容貌英俊”符合对年轻男性的自然描述，不赋予道德含义。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经传统中广为人知的专名形式表达四字神名，而不以“主”这一称号代替。
- source_word: קוּם מְשָׁחֵהוּ
  choice: 起来，膏立他
  rationale: 保留两个直接命令。“膏立”兼顾 משׁח 的实际动作及本段拣选君王的语境，比单说“膏他”更易为现代读者理解。
- source_word: כִּי זֶה הוּא
  choice: 因为就是他
  rationale: 保留原文简短而强调的确认语气；不额外补明“所拣选的人”等原文未明说的内容。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 原文使用神的专名而非普通称号。正文采用中文读者熟悉的专名“耶和华”，避免以“主”取代专名。
- issue: 大卫外貌描写的意义
  choice: 按身体外貌直接翻译，不赋予象征或道德意义
  alternative: 将红润、俊美解释为属灵品格或王权象征
  rationale: 本节只描写可见外貌；上下文同时强调神的鉴察与拣选，因此译文保留这种张力，不将外貌美化为内在德行。
- issue: 膏抹命令的王权语境
  choice: 膏立他
  alternative: 膏他
  rationale: “膏立”在中文中清楚传达此处借膏抹设立受选者的行动，但没有补写原文此句未出现的“作王”。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。叙事简洁，神的直接引语保持短促有力；人物外貌使用普通读者易懂的词语，不采用生僻或过度古雅的表达。
