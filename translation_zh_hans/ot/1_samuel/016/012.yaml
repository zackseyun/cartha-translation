  terminology: 神名应统一译作“雅威”，以对应项目指定的 Yahweh，而非“耶和华”。“膏他”准确保留仪式动作，不预先释为“膏立”。“肤色红润”可接受，但脚注应保留该词也可泛指带红色外貌、并非特指红发的限制。
