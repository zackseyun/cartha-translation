base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/008.yaml
  text: Then Jesse called Abinadab and made him pass before Samuel. And he said[a], “Yahweh has not chosen this one either.”
translation:
  language: zh_hans
  text: 耶西就叫来亚比拿达，让他从撒母耳面前经过。撒母耳说：“雅威也没有拣选这个人。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרָא יִשַׁי אֶל־אֲבִינָדָב
  choice: 耶西就叫来亚比拿达
  rationale: קרא在此表示叫某人前来；“叫来”自然地表达动作方向，并保留叙事推进。人名按通行中文圣经译名处理。
- source_word: וַיַּעֲבִרֵהוּ לִפְנֵי שְׁמוּאֵל
  choice: 让他从撒母耳面前经过
  rationale: עבר的使役式表明耶西使亚比拿达经过；“让他……经过”既保留使役含义，也符合现代汉语表达。
- source_word: וַיֹּאמֶר
  choice: 他说
  rationale: 希伯来文仅用隐含主语的第三人称单数动词；译作“他说”保留原文的指代方式，不在正文中直接补明撒母耳。
- source_word: גַּם בָּזֶה
  choice: 也……这个人
  rationale: גַּם表达追加关系；在否定句中用“也没有……这个人”自然传达“这个也不例外”的意思。
- source_word: לֹא בָחַר
  choice: 没有拣选
  rationale: בחר在此指为特定身份而选择；“拣选”准确而庄重，也适合本段受膏选王的语境。
- source_word: יְהוָה
  choice: 雅威
  rationale: 将四字神名按其常见学术重构音译为“雅威”，保留其作为专名的性质，而不以称号替代。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用以色列之神的专名；采用“雅威”保留专名，并避免把它改译为头衔。
- issue: וַיֹּאמֶר的说话者
  choice: 正文保留“他说”，脚注说明语境所指
  alternative: 直接译作“撒母耳说”
  rationale: 上下文表明说话者是撒母耳，但本节希伯来文本身未明说姓名；保留代词可忠实呈现原文的指代形式。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“叫来……让他……经过”保留连续叙事和使役关系；“这个人”比单说“这个”更符合现代汉语人物指称。
