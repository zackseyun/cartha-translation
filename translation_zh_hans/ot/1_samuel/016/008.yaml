- from: 耶西就叫来亚比拿达，让他从撒母耳面前经过。他说[a]：“雅威也没有拣选这个人。”
  to: 耶西就叫来亚比拿达，让他从撒母耳面前经过。撒母耳说：“雅威也没有拣选这个人。”
  rationale: 修改仅限于将汉语中会误指耶西的“他说”明确为“撒母耳说”，以忠实传达上下文确定的说话者并使译文自然清楚。原脚注因正文不再保留该形式性含蓄而删除；其余措辞保留。
