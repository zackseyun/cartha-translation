  text: וַ/יִּקַּ֣ח שְׁמוּאֵ֗ל טְלֵ֤ה חָלָב֙ אֶחָ֔ד ו/יעלה עוֹלָ֛ה כָּלִ֖יל לַֽ/יהוָ֑ה וַ/יִּזְעַ֨ק שְׁמוּאֵ֤ל אֶל יְהוָה֙ בְּעַ֣ד יִשְׂרָאֵ֔ל וַֽ/יַּעֲנֵ֖/הוּ יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/009.yaml
  text: So Samuel took one nursing lamb and offered it as a whole burnt offering to Yahweh. And Samuel cried out to Yahweh on behalf of Israel[a], and Yahweh answered him.
translation:
  language: zh_hans
  text: 于是，撒母耳取了一只还在吃奶的羊羔[a]，把整只羊羔作为燔祭献给雅威。撒母耳为以色列向雅威呼求，雅威就回应了他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“一只哺乳期的羊羔。”希伯来语指仍在吃奶的羊羔。
    reason: 说明טְלֵה חָלָב所指的是仍以奶为食的幼羊，并提供自然的简短替代译法。
lexical_decisions:
- source_word: טְלֵה חָלָב אֶחָד
  choice: 一只还在吃奶的羊羔
  rationale: טְלֶה指幼羊，חָלָב意为“奶”，合起来指仍以奶为食的羊羔。“还在吃奶的羊羔”是自然清楚的现代汉语，也保留了原文强调其幼小的含义。
- source_word: וַיַּעֲלֵה
  choice: 献
  rationale: עלה的使役形在献祭语境中是献上祭物的惯用动词；译作“献”简洁自然，并由后面的“燔祭”明确其祭祀含义。
- source_word: עוֹלָה כָּלִיל
  choice: 全牲燔祭
  rationale: עוֹלָה是全部焚烧献上的“燔祭”，כָּלִיל强调祭牲整体献上。“全牲燔祭”以简洁的祭祀用语同时表达两层含义。
- source_word: לַיהוָה / אֶל יְהוָה / יְהוָה
  choice: 献给雅威／向雅威／雅威
  rationale: 原文三次使用神的专名יהוה；统一音译为“雅威”，保留其作为圣约之名的性质，并按各处介词关系自然表达。
- source_word: וַיִּזְעַק
  choice: 呼求
  rationale: זעק表示在急迫处境中高声求助。“呼求”既保留恳切求援的力度，也符合庄重的经文语体。
- source_word: בְּעַד יִשְׂרָאֵל
  choice: 为以色列
  rationale: בְּעַד在这里表示为某方代求或代表某方。“为以色列”在汉语中自然地保留这种代求关系，而不额外规定更具体的中保含义。
- source_word: וַיַּעֲנֵהוּ יְהוָה
  choice: 雅威就回应了他
  rationale: ענה意为回答、回应，宾语后缀指撒母耳。“回应了他”贴近原文，也不把回应的具体方式或内容提前解释出来。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华／上主
  rationale: 原文直接使用四字神名。采用“雅威”音译，明确保留专名，而不以称号替代。
- issue: 雅威“回应”撒母耳的含义
  choice: 回应了他
  alternative: 应允了他
  rationale: 原文ענה本身表示回答或回应；“应允”可能更明确地暗示请求按所求蒙准。译作“回应”保留原文措辞及其在上下文中由后续事件显明的结果。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“全牲燔祭”保留古代祭祀术语的准确性；其余句法尽量简明。脚注标记置于其所说明的“羊羔”之后。
