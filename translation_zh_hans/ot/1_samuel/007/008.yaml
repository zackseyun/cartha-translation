base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/008.yaml
  text: Then the sons of Israel said to Samuel[a], “Do not be silent for us from crying out to Yahweh our God, that he may save us from the hand of the Philistines.”
translation:
  language: zh_hans
  text: 以色列人对撒母耳说：“不要停止为我们向雅威我们的上帝呼求，好让他救我们脱离非利士人的手。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 该词组直译为“以色列的众子”，但在这里指以色列全体民众；“以色列人”既准确又符合现代汉语习惯。
- source_word: אַל תַּחֲרֵשׁ מִמֶּנּוּ מִזְּעֹק
  choice: 不要默不作声，要为我们……呼求
  rationale: 保留 חרשׁ“沉默、不作声”的意象，同时用现代汉语可理解的句式表达“不要停止为我们呼求”的语境含义；脚注保留原文结构及另一种译法。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来语四字神名的通行汉语音译处理，保留其作为以色列之上帝专名的性质，不以称号替代。
- source_word: אֱלֹהֵינוּ
  choice: 我们的上帝
  rationale: 直接表达第一人称复数所属关系，保留以色列民称雅威为“我们的上帝”的盟约性诉求。
- source_word: וְיֹשִׁעֵנוּ
  choice: 好让他救我们
  rationale: 此处连接词与未完成式在请求之后表示目的或预期结果；“好让”自然表达这一关系，同时不把结果说成已经确定发生。
- source_word: מִיַּד פְּלִשְׁתִּים
  choice: 脱离非利士人的手
  rationale: 保留希伯来语“从……手中”的权势与控制意象；汉语“脱离……的手”也清楚可懂。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文使用以色列之上帝的四字神名，而非“主”这一称号；“雅威”较直接反映学界通常重构的读音，同时不把专名改译为称号。
- issue: “好让他救我们”所表达的目的与结果
  choice: 保留目的或预期结果的开放性
  alternative: “他必救我们”
  rationale: 原文可表达呼求的目的或所期待的结果，并未在本句中直接作出无条件必然得救的断言，因此不强化为“必”。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“以色列人”避免生硬的“以色列的众子”；“呼求”保留危急中向上帝大声求助的力度；“非利士人的手”保留原文形象。
