  text: וַ/יִּכָּֽנְעוּ֙ הַ/פְּלִשְׁתִּ֔ים וְ/לֹא יָסְפ֣וּ ע֔וֹד לָ/ב֖וֹא בִּ/גְב֣וּל יִשְׂרָאֵ֑ל וַ/תְּהִ֤י יַד יְהוָה֙ בַּ/פְּלִשְׁתִּ֔ים כֹּ֖ל יְמֵ֥י שְׁמוּאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/013.yaml
  text: So the Philistines were subdued and did not again come into the territory of Israel[a]. And the hand of Yahweh was against the Philistines all the days of Samuel.
translation:
  language: zh_hans
  text: 非利士人就被制伏，不再进入以色列境内。在撒母耳有生之年，耶和华的手一直攻击非利士人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּכָּנְעוּ
  choice: 被制伏
  rationale: 该词为כנע的尼法勒式，在此军事语境中表示被压服、归于受制状态；“被制伏”保留被动及结果意味。
- source_word: וְלֹא יָסְפוּ עוֹד לָבוֹא
  choice: 不再进入
  rationale: יסף与עוד连用表示某事不再重复；结合地点短语，译为“不再进入”自然明晰。
- source_word: בִּגְבוּל יִשְׂרָאֵל
  choice: 以色列的境内
  rationale: גְּבוּל既可指边界，也可指边界以内的领土；此处说非利士人进入之处，故“境内”比单指边界线更合语境。
- source_word: וַתְּהִי יַד יְהוָה בַּפְּלִשְׁתִּים
  choice: 耶和华的手攻击非利士人
  rationale: 保留“手”的希伯来语形象，同时用“攻击”表达介词在军事上下文中的敌对意味。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神名传统音译“耶和华”，将其作为专名而非称号处理。
- source_word: כֹּל יְמֵי שְׁמוּאֵל
  choice: 贯穿撒母耳在世的所有日子
  rationale: 原文直译为“撒母耳的所有日子”；补出“在世”以自然表达这是撒母耳一生期间，同时保留“所有日子”的时间范围。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用四字神名。中文正文采用广为人知且庄重的专名形式“耶和华”；不以“主”替代，以保留专名性质。
- issue: “耶和华的手在非利士人身上”的方向性
  choice: 耶和华的手攻击非利士人
  alternative: 耶和华的手临到非利士人
  rationale: “手”表示神主动施展的能力；上下文是非利士人遭制伏，介词短语具有敌对、惩治意味。“攻击”明确这一语境，同时保留原文的“手”这一隐喻。
- issue: “撒母耳的所有日子”的时间范围
  choice: 撒母耳在世的所有日子
  alternative: 撒母耳任职的所有日子
  rationale: 原文没有明确说任职期，因此不引入职务期限；“在世”是自然理解，但原表达本身较简略，故以脚注说明。
translation_notes:
  register: 采用现代、庄重而易懂的叙事文体。“制伏”“境内”适合军事政治语境；保留“耶和华的手”这一圣经意象。脚注标记置于所说明的时间短语之后。
