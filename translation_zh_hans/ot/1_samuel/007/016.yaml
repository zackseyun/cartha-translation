base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/016.yaml
  text: And he would go year by year and make the circuit of Bethel[a], Gilgal, and Mizpah[b], and he judged Israel in all these places.
translation:
  language: zh_hans
  text: 他年年巡行伯特利、吉甲和米斯巴[a]，在所有这些地方为以色列人施行审判。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “巡行”或译“周游”；原文表示他按固定路线往来于这些城镇。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָלַךְ
  choice: 他……巡行
  rationale: 完成式与年度惯常时间语连用，表达撒母耳过去经常进行的行动；汉语以“年年巡行”自然体现反复性。
- source_word: מִדֵּי שָׁנָה בְּשָׁנָה
  choice: 年年
  rationale: 该习语表示每年规律性的反复；“年年”简洁、自然，也保留迭次意味。
- source_word: וְסָבַב
  choice: 巡行
  rationale: 此处指沿固定路线周行多个城镇。“巡行”既体现循环往返，也符合撒母耳履行审判职责的语境。
- source_word: בֵּית אֵל
  choice: 伯特利
  rationale: 采用现代中文圣经地名的通行译名。
- source_word: הַגִּלְגָּל
  choice: 吉甲
  rationale: 采用现代中文圣经地名的通行译名。
- source_word: הַמִּצְפָּה
  choice: 米斯巴
  rationale: 采用现代中文圣经地名的通行译名。
- source_word: וְשָׁפַט
  choice: 审理……的事务
  rationale: שפט在此指撒母耳施行司法性领导。“审理……的事务”在现代汉语中比单说“审判以色列人”更自然，并避免被误解为定罪，同时保留司法职能。
- source_word: אֶת יִשְׂרָאֵל
  choice: 以色列人的事务
  rationale: 原文以“以色列”为שפט的宾语，所指是以色列民；汉语用所属结构自然表达他为百姓审理案件、处理司法事务。
- source_word: אֵת כָּל הַמְּקוֹמוֹת הָאֵלֶּה
  choice: 在这些地方
  rationale: 此处第二个אֵת短语按地点状语理解，说明撒母耳施行审理的地点；“在这些地方”符合现代汉语表达。
theological_decisions:
- issue: שפט的职能范围
  choice: 审理以色列人的事务
  alternative: 治理以色列／审判以色列人
  rationale: 该词可涵盖司法与领导职能，但本节强调巡回地点。译文明确其司法活动而不把含义扩大为一般政治治理，也不暗示他在定罪全体以色列人。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“年年”清楚表达惯常年度行动；“巡行”凝练地表现固定路线；地名采用简体中文通行形式。脚注标记已在正文对应位置出现。
