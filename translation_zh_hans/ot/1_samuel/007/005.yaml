  text: וַ/יֹּ֣אמֶר שְׁמוּאֵ֔ל קִבְצ֥וּ אֶת כָּל יִשְׂרָאֵ֖ל הַ/מִּצְפָּ֑תָ/ה וְ/אֶתְפַּלֵּ֥ל בַּעַדְ/כֶ֖ם אֶל יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/005.yaml
  text: Then Samuel said[a], “Gather all Israel to Mizpah, and I will pray to Yahweh on your behalf.”
translation:
  language: zh_hans
  text: 撒母耳说：“要把全以色列人召集到米斯巴，我就为你们向雅威[a]祷告。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威”是希伯来文 יהוה（YHWH）这一神名的音译；中文也常译作“耶和华”或“上主”。
    reason: 说明神名的原文形式及常见中文译法。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 叙事中的连续式推进事件；现代汉语无需机械译出“然后”，上下文已自然表达先后关系。
- source_word: קִבְצוּ
  choice: 召集
  rationale: 复数命令式，指把众民聚集起来；“召集”比单纯“聚集”更清楚地表达撒母耳发出的号召。
- source_word: כָּל יִשְׂרָאֵל
  choice: 全以色列人
  rationale: 保留全体民族的集合意义，同时符合现代汉语表达。
- source_word: הַמִּצְפָּתָה
  choice: 到米斯巴来
  rationale: 词尾方向格明确表示朝向该地移动；“来”也自然体现撒母耳指定众人到会合地点。
- source_word: וְאֶתְפַּלֵּל
  choice: 我好……祷告
  rationale: 第一人称未完成式接在命令之后，表示召集众人的后续目的或预期行动；“我好”在汉语中自然保留这一衔接。
- source_word: בַּעַדְכֶם
  choice: 为你们
  rationale: בְּעַד 表示代表他人或为他人代求；此处“为你们祷告”已自然传达代求含义。
- source_word: אֶל יְהוָה
  choice: 向雅威祷告
  rationale: 介词 אֶל 与祷告动词搭配，译作“向”；יְהוָה 是以色列上帝的专名，正文采用“雅威”音译。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。采用较贴近学界通行复原读音的“雅威”，既把它作为专名呈现，也不以称号取代；脚注交代中文读者熟悉的其他译法。
- issue: 撒母耳祷告的中保性表达
  choice: 为你们向雅威祷告
  alternative: 替你们向雅威代求
  rationale: בַּעַדְכֶם 确有代表、代求意味，但原文动词只是“祷告”，正文不额外加入“代求”一词，以免强化原文未明说的神学表述。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。命令句用“要把……召集……来”清楚传达复数命令；“我好……”保留召集与随后祷告之间的目的关系。地名采用中文圣经中通行的“米斯巴”。
