source:
  edition: WLC
  text: וַ/יָּסִ֨ירוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל אֶת הַ/בְּעָלִ֖ים וְ/אֶת הָ/עַשְׁתָּרֹ֑ת וַ/יַּעַבְד֥וּ אֶת יְהוָ֖ה לְ/בַדּֽ/וֹ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/004.yaml
  text: So the sons of Israel removed the Baals and the Ashtaroths[a], and they served Yahweh alone.
translation:
  language: zh_hans
  text: 于是，以色列人除掉了诸巴力和亚斯她录，单单事奉耶和华[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “事奉”也可译作“敬拜”。希伯来语动词以神为对象时，可以兼指服事和敬拜。
    reason: 保留 וַיַּעַבְדוּ 在此处“事奉／敬拜”的词义幅度。
lexical_decisions:
- source_word: וַיָּסִירוּ
  choice: 除掉了
  rationale: 使役形在此表示移除、摒弃；“除掉”既保留具体行动，也自然表达他们弃绝偶像。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 这是指以色列民族的固定表达。现代汉语用“以色列人”准确自然；若直译为“以色列的儿子们”，容易被误解为仅指男性或雅各的亲生儿子。
- source_word: הַבְּעָלִים
  choice: 诸巴力
  rationale: 保留希伯来文复数，可能指巴力的不同地方形态或相关神像；“诸巴力”不把具体所指过早限定为神祇或偶像形像。
- source_word: הָעַשְׁתָּרֹת
  choice: 亚斯她录
  rationale: 按希伯来文复数名称音译，保留特定异教崇拜对象的指称，不泛化为“女神”或“偶像”。
- source_word: וַיַּעַבְדוּ
  choice: 事奉
  rationale: עבד以神为宾语时兼有服事、敬拜之意；“事奉”保留委身效忠的广义，同时在宗教语境中自然包含敬拜。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的专名形式呈现四字神名，避免用“主”这一称号替代原文专名。
- source_word: לְבַדּוֹ
  choice: 单单
  rationale: 这里强调对象的排他性；“单单事奉耶和华”自然清楚地表达只归向耶和华。
theological_decisions:
- issue: 如何翻译神名 יְהוָה
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用以色列上帝的专名。中文正文保留专名而不替换成“主”；“耶和华”是现代中文圣经传统中最通行、普通读者最易识别的形式。
- issue: עבד 表示“事奉”还是“敬拜”
  choice: 单单事奉耶和华
  alternative: 单单敬拜耶和华
  rationale: 原词既可指服事，也可在以上帝为对象时指敬拜。“事奉”更完整保留归顺、效忠和敬拜的宽广含义；脚注注明较窄的语境译法，以保存词义张力。
- issue: 复数 הַבְּעָלִים 与 הָעַשְׁתָּרֹת 的理解
  choice: 诸巴力和亚斯她录
  alternative: 巴力神像和亚斯她录神像
  rationale: 原文使用两个复数名称，但没有明确说明究竟指地方性神祇形态还是其神像，因此正文保留复数名称，不自行补入“神像”。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“于是”承接上文劝告及百姓的回应；“诸巴力”保留原文复数；“亚斯她录”作为复数神名音译保留。脚注标记置于“亚斯她录”之后以符合所给标记位置，但脚注内容说明本句后半的“事奉”译法。
