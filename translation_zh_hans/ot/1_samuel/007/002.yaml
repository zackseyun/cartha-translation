  text: וַ/יְהִ֗י מִ/יּ֞וֹם שֶׁ֤בֶת הָֽ/אָרוֹן֙ בְּ/קִרְיַ֣ת יְעָרִ֔ים וַ/יִּרְבּוּ֙ הַ/יָּמִ֔ים וַ/יִּֽהְי֖וּ עֶשְׂרִ֣ים שָׁנָ֑ה וַ/יִּנָּה֛וּ כָּל בֵּ֥ית יִשְׂרָאֵ֖ל אַחֲרֵ֥י יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/002.yaml
  text: From the day the ark remained at Kiriath-jearim[a], the days became many, and they were twenty years[b]; and all the house of Israel lamented after Yahweh.
translation:
  language: zh_hans
  text: 从约柜留在基列·耶琳那日起，日子渐多，满了二十年；以色列全家都哀恸，归向耶和华。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“哀恸着寻求耶和华”或“渴慕耶和华”。原文直译近于“在耶和华之后哀恸”；此处短语含义不寻常，可能表达哀痛中转向、寻求耶和华。
    reason: 原文短语 וַיִּנָּהוּ ... אַחֲרֵי יְהוָה 的关系与语义存在歧义；脚注保留替代理解，避免正文将其完全定为明确的悔改公式。
lexical_decisions:
- source_word: שֶׁבֶת הָאָרוֹן
  choice: 约柜安放
  rationale: שׁבת在此表示约柜持续留在某地；“安放”符合现代汉语对圣物置于一处的自然说法，同时表达持续状态。
- source_word: בְּקִרְיַת יְעָרִים
  choice: 在基列·耶琳
  rationale: 采用现代中文圣经地名的常见音译，并以间隔号清楚标示复合地名。
- source_word: וַיִּרְבּוּ הַיָּמִים
  choice: 日子渐多
  rationale: 保留希伯来文“日子增多”的形象，也能让现代读者理解为时间逐渐过去。
- source_word: וַיִּהְיוּ עֶשְׂרִים שָׁנָה
  choice: 共有二十年
  rationale: 自然表达前一句所累计的时日达到二十年，避免生硬直译为“它们是二十年”。
- source_word: וַיִּנָּהוּ
  choice: 哀恸
  rationale: 该动词主要表示哀哭、悲叹；“哀恸”保留其强烈的悲痛色彩，而不直接将其解释为“渴慕”。
- source_word: כָּל בֵּית יִשְׂרָאֵל
  choice: 以色列全家
  rationale: 保留“以色列家”这一整体性、群体性的表达，并使汉语简洁自然。
- source_word: אַחֲרֵי יְהוָה
  choice: 转向耶和华
  rationale: אַחֲרֵי字面为“在……之后”，与哀恸动词连用时语义罕见，可能含有哀恸并归向、追随或渴慕之意；“转向”在上下文中通顺，但以脚注保留其他可能。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文圣经传统中对四字神名最通行且易识别的译名，作为专名而非改译为头衔“主”。
theological_decisions:
- issue: וַיִּנָּהוּ ... אַחֲרֵי יְהוָה 所表达的以色列回应
  choice: 译为“都哀恸，转向耶和华”，表达悲痛中归向上帝的动向
  alternative: “为耶和华哀恸”“哀恸着寻求耶和华”“渴慕耶和华”
  rationale: 原文没有使用明确的“悔改”公式，而“哀恸”和אַחֲרֵי的组合也存在语义张力；正文不明说完全悔改，脚注保留哀恸、寻求和渴慕等可能含义。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“日子渐多”有意保留原文意象；分号划分二十年的时间说明与以色列全家的回应。神名用“耶和华”，不以“主”替代。
