translation:
  language: zh_hans
  text: 撒母耳一生作以色列的士师[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“治理以色列”或“以士师的身份带领以色列”；希伯来语动词兼有审判和治理的含义。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁפֹּט
  choice: 作……的士师
  rationale: 希伯来语动词 שׁפט 在此可指施行审判，也可涵盖士师治理和带领百姓的职分。译作“作……的士师”既保留本书的历史语境和司法意味，也不把含义缩窄为单纯“审判”。
- source_word: שְׁמוּאֵל
  choice: 撒母耳
  rationale: 采用现代中文圣经传统中通行的人名音译。
- source_word: אֶת יִשְׂרָאֵל
  choice: 以色列
  rationale: אֶת 是直接宾语标记，无须另译；专名 יִשְׂרָאֵל 采用通行译名“以色列”。
- source_word: כֹּל יְמֵי חַיָּיו
  choice: 一生都
  rationale: 该短语直指他有生之年的全部时日；“一生都”是自然、简洁的现代汉语表达，并保留持续到终身的范围。
theological_decisions:
- issue: 撒母耳的角色是否仅为司法审判者
  choice: 作以色列的士师
  alternative: 治理以色列／审判以色列
  rationale: “士师”能同时承载司法、治理与带领的历史角色，避免把 שׁפט 的含义仅限于法庭审判，也不以宽泛的“治理”抹去其士师职分。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“一生都”比逐字译作“在他一生所有的日子”更符合自然汉语；“作以色列的士师”保留原文动词在本书历史语境中的多重意味。
