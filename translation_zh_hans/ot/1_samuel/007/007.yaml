source:
  edition: WLC
  text: וַ/יִּשְׁמְע֣וּ פְלִשְׁתִּ֗ים כִּֽי הִתְקַבְּצ֤וּ בְנֵֽי יִשְׂרָאֵל֙ הַ/מִּצְפָּ֔תָ/ה וַ/יַּעֲל֥וּ סַרְנֵֽי פְלִשְׁתִּ֖ים אֶל יִשְׂרָאֵ֑ל וַֽ/יִּשְׁמְעוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וַ/יִּֽרְא֖וּ מִ/פְּנֵ֥י פְלִשְׁתִּֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/007.yaml
  text: When the Philistines heard that the sons of Israel had gathered at Mizpah[a], the rulers of the Philistines went up against Israel. When the sons of Israel heard it[b], they were afraid because of the Philistines.
translation:
  language: zh_hans
  text: 非利士人听说以色列人聚集在米斯巴[a]，非利士人的首领就上去攻打以色列。以色列人听见这事，就因非利士人而害怕。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“到米斯巴”。希伯来文的地名带有表示方向的词尾，但上下文表明百姓聚集在那里。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמְעוּ
  choice: 听说／听见
  rationale: 叙事中表示得知消息；前句用“听说”自然引出消息内容，后句用“听见这事”补明希伯来文隐含的所闻之事，同时保留动词的重复。
- source_word: פְלִשְׁתִּים
  choice: 非利士人
  rationale: 该族名在现代中文圣经语境中的通行译法。
- source_word: הִתְקַבְּצוּ
  choice: 聚集
  rationale: 准确表达קבץ的Hitpael形式所指的共同集合，中文简洁自然。
- source_word: בְנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 该希伯来习语在此指以色列民众；“以色列人”比逐字译作“以色列的众子”更符合现代中文，且不缩窄所指群体。
- source_word: הַמִּצְפָּתָה
  choice: 在米斯巴
  rationale: 词形带方向后缀，可形式化理解为“到米斯巴”；但上下文描述聚集发生于该地，正文用“在米斯巴”最自然，并以脚注保留形式上的另一可能。
- source_word: וַיַּעֲלוּ
  choice: 上去攻打
  rationale: עלה表示“上去”，军事语境结合אֶל表明敌对进军；译文保留“上去”并用“攻打”明示语境。
- source_word: סַרְנֵי פְלִשְׁתִּים
  choice: 非利士人的首领
  rationale: סרנים是非利士特有的统治者称号；“首领”清楚、自然，又不额外规定其具体政治等级。
- source_word: אֶל יִשְׂרָאֵל
  choice: 攻打以色列
  rationale: אֶל本义为“向、到”，在军事进军语境中表示敌对方向，中文以“攻打”传达实际含义。
- source_word: וַיִּירְאוּ
  choice: 害怕
  rationale: 直接表达ירא所指的恐惧，符合现代叙事中文。
- source_word: מִפְּנֵי פְלִשְׁתִּים
  choice: 因非利士人而
  rationale: מִפְּנֵי在此表示恐惧的对象或缘由；“因……而害怕”既自然，也避免生硬直译“在……面前”。
theological_decisions: []
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“上去攻打”兼顾希伯来文的移动动词与军事语境；第二个“听见”补入“这事”，使中文完整而不增加具体内容。英文材料中的脚注[b]与正文标记错位，且内容说明的是“首领”一词，并不对应第二次“听见”；本稿不沿用该错误标记，也未另设必要性不足的词汇脚注。
