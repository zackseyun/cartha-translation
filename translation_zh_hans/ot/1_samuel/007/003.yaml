  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר שְׁמוּאֵ֗ל אֶל כָּל בֵּ֣ית יִשְׂרָאֵל֮ לֵ/אמֹר֒ אִם בְּ/כָל לְבַבְ/כֶ֗ם אַתֶּ֤ם שָׁבִים֙ אֶל יְהוָ֔ה הָסִ֜ירוּ אֶת אֱלֹהֵ֧י הַ/נֵּכָ֛ר מִ/תּוֹכְ/כֶ֖ם וְ/הָ/עַשְׁתָּר֑וֹת וְ/הָכִ֨ינוּ לְבַבְ/כֶ֤ם אֶל יְהוָה֙ וְ/עִבְדֻ֣/הוּ לְ/בַדּ֔/וֹ וְ/יַצֵּ֥ל אֶתְ/כֶ֖ם מִ/יַּ֥ד פְּלִשְׁתִּֽים־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/003.yaml
  text: Then Samuel said to all the house of Israel[a], “If you are returning to Yahweh with all your heart, remove the foreign gods and the Ashtaroths from among you, and direct your heart to Yahweh and serve him alone[d][c][b], and he will deliver you from the hand of the Philistines.”
translation:
  language: zh_hans
  text: 撒母耳对以色列全家说：“你们若一心归向雅威[a]，就要从你们中间除掉外族的神和亚斯她录[b]，专心归向雅威[c]，单单事奉他；他必救你们脱离非利士人的手[d]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “归向”也可译作“回转归向”；原文动词形式可表达正在回转、归回。
    reason: lexical_alternative
  - marker: b
    text: “亚斯她录”是复数形式，可能指与女神亚斯她特（阿斯塔蒂）有关的不同地方性形态、神像或崇拜物。
    reason: cultural_note
  - marker: c
    text: 或译：“预备你们的心归向雅威”，也可理解为“坚定你们的心，朝向雅威”。
    reason: lexical_alternative
  - marker: d
    text: “脱离……的手”是希伯来语表达，意思是脱离非利士人的权势或控制。
    reason: idiom_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 撒母耳……说
  rationale: 未机械译出句首连接词；在中文叙事中，语境已能自然表达事件推进。
- source_word: כָּל בֵּית יִשְׂרָאֵל
  choice: 以色列全家
  rationale: 保留“家”的群体性比喻和全体圣约群体的意味，同时符合现代汉语表达。
- source_word: אִם בְּכָל לְבַבְכֶם אַתֶּם שָׁבִים אֶל יְהוָה
  choice: 你们若一心归向雅威
  rationale: “归向”表达 שׁוּב 的回转、归回含义；“一心”自然传达“以全部的心”，不额外加入后期神学术语。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以常见的现代汉语音译呈现四字神名，保留其作为专名的性质。
- source_word: הָסִירוּ
  choice: 除掉
  rationale: 准确表达命令他们把偶像从群体中移除，语气明确有力。
- source_word: אֱלֹהֵי הַנֵּכָר
  choice: 外族的神
  rationale: נֵכָר 指外来的、异族的；此译法既说明这些是别族神明，也避免将其误解为仅仅“奇怪的神”。
- source_word: מִתּוֹכְכֶם
  choice: 从你们中间
  rationale: 保留从群体内部清除这些神祇及其崇拜物的空间和群体意味。
- source_word: וְהָעַשְׁתָּרֹת
  choice: 和亚斯她录
  rationale: 用音译保留希伯来文复数名称，不在正文中武断限定为女神本身、神像或不同地方性形态。
- source_word: וְהָכִינוּ לְבַבְכֶם אֶל יְהוָה
  choice: 专心归向雅威
  rationale: 以自然中文表达坚定地把心定向雅威；脚注保留“预备你们的心”这一较形式对应的译法。
- source_word: וְעִבְדֻהוּ לְבַדּוֹ
  choice: 单单事奉他
  rationale: “事奉”兼顾敬拜、服从和效忠，比单译“敬拜”更能保留 עבד 的宽广含义。
- source_word: וְיַצֵּל אֶתְכֶם
  choice: 他必救你们
  rationale: 将未完成式理解为遵行前述命令后所应许的结果；“救”准确表达 נצל 使役式的搭救、解救含义。
- source_word: מִיַּד פְּלִשְׁתִּים
  choice: 脱离非利士人的手
  rationale: 保留希伯来语具体而易懂的“手”之比喻，表示他们的权势和控制。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；音译为“雅威”保留专名性质，也较贴近学界通常重建的读音。
- issue: שָׁבִים 所表达的回应
  choice: 归向雅威
  alternative: 回转归向雅威
  rationale: “归向”保留圣约关系中回转、重新效忠的含义，却不把后来的系统神学范畴直接写进经文。
- issue: עבד 在本节中的范围
  choice: 事奉他
  alternative: 敬拜他
  rationale: 这里要求排除别神、专一效忠；“事奉”既包括敬拜，也包括顺服和忠诚，较完整地保留原词范围。
- issue: וְיַצֵּל 的语气关系
  choice: 他必救你们
  alternative: 愿他救你们／好使他救你们
  rationale: 在条件句和一连串命令之后，将其译作应许的结果最合乎句法脉络；不将得救与前述专一归向之间的张力消解为单纯愿望。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“一心”“除掉”“单单事奉”等措辞保留劝诫的力度；对“亚斯她录”采用音译并以脚注解释，以免正文过度诠释。
