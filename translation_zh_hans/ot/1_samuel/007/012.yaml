base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/012.yaml
  text: Then Samuel took one stone and set it between Mizpah and Shen, and he called its name Ebenezer, for he said, “Up to this point the LORD has helped us.”
translation:
  language: zh_hans
  text: 于是，撒母耳拿了一块石头，把它立在米斯巴和善之间，给它起名叫“以便以谢”[a]，说：“到这里[b]，耶和华一直帮助我们。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “以便以谢”意思是“帮助之石”。
    reason: 说明希伯来名称אֶבֶן הָעָזֶר的字面意义，以及它与下文“帮助”的文字呼应。
  - marker: b
    text: “到这里”也可理解为“直到如今”或“到目前为止”。
    reason: 保留עַד הֵנָּה可能兼具的空间和时间含义，避免正文过早消除歧义。
lexical_decisions:
- source_word: אֶבֶן אַחַת
  choice: 一块石头
  rationale: 保留数词אַחַת“一”，同时按现代汉语量词习惯表达。
- source_word: הַמִּצְפָּה
  choice: 米斯巴
  rationale: 按希伯来语地名音译，并采用中文圣经读者熟悉的形式。
- source_word: הַשֵּׁן
  choice: 善
  rationale: 按专名处理并音译；原文有定冠词，但中文地名不需显明。
- source_word: אֶבֶן הָעָזֶר
  choice: 以便以谢
  rationale: 保留该纪念石名称的传统音译，其字面意义另以脚注说明。
- source_word: עַד הֵנָּה
  choice: 到这里
  rationale: 贴近原文空间指示语，也保留它可延伸为“直到如今”的时间含义。
- source_word: עֲזָרָנוּ
  choice: 一直帮助我们
  rationale: “帮助我们”直接对应动词；加入“一直”使“到这里”的持续、截至此刻之意在现代汉语中自然可辨。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的专名形式表达四字神名，而非改作泛称“主”。
theological_decisions:
- issue: “到这里”的空间与时间双重可能性
  choice: 正文保留“到这里”，脚注说明也可理解为“直到如今”
  alternative: 直接译作“直到如今”或“到目前为止”
  rationale: 原文הֵנָּה本义为“这里”，置于立石地点的叙事中可能兼有空间和时间意味；不宜在正文中只固定为时间解释。
- issue: 纪念石名称与神帮助之间的解释关系
  choice: 音译名称，并在脚注给出字面义
  alternative: 正文直接译作“帮助之石”
  rationale: 既让名称保持专名性质，也使读者看见它与后一句“帮助我们”的希伯来语词根呼应。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“于是”承接前文叙事；“立”比“放”更符合设置纪念石的语境。地名和石名使用中文圣经传统中较熟悉的音译形式；引语保持简洁有力。
