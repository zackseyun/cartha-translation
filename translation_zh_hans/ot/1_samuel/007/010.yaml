  text: וַ/יְהִ֤י שְׁמוּאֵל֙ מַעֲלֶ֣ה הָ/עוֹלָ֔ה וּ/פְלִשְׁתִּ֣ים נִגְּשׁ֔וּ לַ/מִּלְחָמָ֖ה בְּ/יִשְׂרָאֵ֑ל וַ/יַּרְעֵ֣ם יְהוָ֣ה בְּ/קוֹל גָּ֠דוֹל בַּ/יּ֨וֹם הַ/ה֤וּא עַל פְּלִשְׁתִּים֙ וַ/יְהֻמֵּ֔/ם וַ/יִּנָּגְפ֖וּ לִ/פְנֵ֥י יִשְׂרָאֵֽל׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/010.yaml
  text: And as Samuel was offering up the burnt offering[a], the Philistines drew near for battle against Israel. But Yahweh thundered with a great sound on that day against the Philistines and threw them into confusion, and they were defeated before Israel.
translation:
  language: zh_hans
  text: 撒母耳正在献上燔祭的时候，非利士人逼近，要攻击以色列。那一天，雅威向非利士人发出巨大的雷声[a]，使他们陷入混乱；于是，他们败在以色列人面前。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文此处直译为“以巨大的声音”；结合“打雷”的语境，也可译作“大发雷声”或“发出巨响”。
    reason: 保留 בְּקוֹל גָּדוֹל 的字面意义，并说明其在雷鸣语境中的可能译法，避免把由上下文补足的“打雷”误称为该短语本身的直译。
lexical_decisions:
- source_word: מַעֲלֶה הָעוֹלָה
  choice: 正献燔祭
  rationale: 分词 מַעֲלֶה 在叙事中表示正在进行的献祭动作；“献燔祭”准确表达祭祀语境，也符合现代汉语习惯。
- source_word: נִגְּשׁוּ לַמִּלְחָמָה בְּיִשְׂרָאֵל
  choice: 逼近，要与以色列交战
  rationale: נגשׁ 表示临近或逼近；结合军事语境及 לַמִּלְחָמָה，以“逼近，要……交战”自然表达敌对行动。
- source_word: וַיַּרְעֵם ... בְּקוֹל גָּדוֹל
  choice: 发出巨大的雷声
  rationale: רעם 表示打雷，קוֹל גָּדוֹל 字面为“巨大的声音”。正文采用自然汉语合并表达，并以脚注保留原文措辞及其他可能译法。
- source_word: וַיְהֻמֵּם
  choice: 使他们陷入混乱
  rationale: המם 的使役形在战争语境中表示使敌军惊慌、混乱；此译法保留使役意义，又不提前并入下一分句所说的战败结果。
- source_word: וַיִּנָּגְפוּ לִפְנֵי יִשְׂרָאֵל
  choice: 他们败在以色列人面前
  rationale: נָגַף 的被动形在战争语境中表示被击败；לִפְנֵי 是“在……面前”的惯用表达。此译法不额外暗示敌军全遭杀灭。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常用音译呈现四字神名，保留其作为专名的性质，而不以称号替代。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名。正文采用较贴近 YHWH 通常学术复原读音的“雅威”，避免把专名改作“主”等称号；“耶和华”是汉语传统中的另一音译。
- issue: 神以雷声介入战事与非利士人战败之间的关系
  choice: 保留“使他们陷入混乱；于是，他们败……”两个相连而有区别的分句
  alternative: 合译为“以雷声击溃他们”
  rationale: 原文先说雅威使敌军混乱，再说他们败在以色列面前。分开翻译可保留神的行动与战场结果之间的叙事层次，不把两者简化为单一动作。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“正献……的时候”体现同步发生的叙事关系；“逼近”“陷入混乱”“败在……面前”保留军事语境，但避免古奥或过度解释。脚注标记置于其实际说明的“巨大的雷声”之后。
