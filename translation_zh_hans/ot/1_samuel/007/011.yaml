base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/011.yaml
  text: Then the men of Israel went out from Mizpah[a], pursued the Philistines[b], and struck them down as far as below Beth-car.
translation:
  language: zh_hans
  text: 以色列的男子从米斯巴出来，追赶非利士人，击打他们[a]，直至伯甲下方[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“击败他们”。这里的希伯来语动词在战事中可指击打，也可带有击败之意；未必仅指身体上的击打。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译“伯甲下方”，可能指一处地势低于伯甲的地点。
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּצְאוּ
  choice: 出来
  rationale: 这是יצא的常见叙事用法；结合“从米斯巴”，译为“出来”自然明确。
- source_word: אַנְשֵׁי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 原文直译为“以色列的男人”；语境所指是出战追敌的人。现代汉语用“以色列人”最自然，也不额外加入原文没有明说的身份称谓。
- source_word: מִן הַמִּצְפָּה
  choice: 从米斯巴
  rationale: 将地名מִצְפָּה按通行形式音译为“米斯巴”。
- source_word: וַיִּרְדְּפוּ
  choice: 追赶
  rationale: רדף在军事语境中表示追逐敌军；“追赶”简洁自然。
- source_word: פְּלִשְׁתִּים
  choice: 非利士人
  rationale: 采用该族名通行的现代中文译名。
- source_word: וַיַּכּוּם
  choice: 一路击败他们
  rationale: נכה在战事叙述中可指击打、击杀或打败；“击败”保留战胜之意，又不武断地断定所有被击者都被杀。“一路”使连续追击至某地的句法在汉语中更顺畅。
- source_word: עַד
  choice: 直到
  rationale: 与地点范围连用，表示追击所达到的界限；汉语“直到”准确自然。
- source_word: מִתַּחַת
  choice: 下方
  rationale: 这里指相对于伯甲较低的位置；“下方”保留其地形关系。
- source_word: לְבֵית כָּר
  choice: 伯甲
  rationale: 作为地名音译，不按字面译作“牧场之家”。
