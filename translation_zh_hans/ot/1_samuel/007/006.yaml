  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יִּקָּבְצ֣וּ הַ֠/מִּצְפָּתָ/ה וַ/יִּֽשְׁאֲבוּ מַ֜יִם וַֽ/יִּשְׁפְּכ֣וּ לִ/פְנֵ֣י יְהוָ֗ה וַ/יָּצ֨וּמוּ֙ בַּ/יּ֣וֹם הַ/ה֔וּא וַ/יֹּ֣אמְרוּ שָׁ֔ם חָטָ֖אנוּ לַ/יהוָ֑ה וַ/יִּשְׁפֹּ֧ט שְׁמוּאֵ֛ל אֶת בְּנֵ֥י יִשְׂרָאֵ֖ל בַּ/מִּצְפָּֽה־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/006.yaml
  text: So they gathered at Mizpah[a], drew water, and poured it out before Yahweh. They fasted on that day and said there[c][b], “We have sinned against Yahweh.” And Samuel judged the sons of Israel at Mizpah.
translation:
  language: zh_hans
  text: 于是，他们聚集到米斯巴[a]，打了水，把水倒在雅威面前[b]。那一天，他们禁食，并在那里说：“我们得罪了雅威。”撒母耳在米斯巴为以色列人施行审判。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “到米斯巴”：原文的地名带有表示方向的词尾。
    reason: lexical_alternative
  - marker: b
    text: 把水倒在雅威面前是一种仪式性行动，可能与悔改或哀恸有关，但经文没有明确解释其象征意义。
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּקָּבְצוּ הַמִּצְפָּתָה
  choice: 他们聚集到米斯巴
  rationale: נפעל形式在这里表示众人聚集；地名后的方向词尾明确表示朝米斯巴而去，因此译为“聚集到米斯巴”，既贴近原文，也符合现代汉语。
- source_word: וַיִּשְׁאֲבוּ מַיִם
  choice: 打了水
  rationale: שׁאב通常指从井或水源打水；“打水”是自然、准确的现代汉语表达。
- source_word: וַיִּשְׁפְּכוּ לִפְנֵי יְהוָה
  choice: 把水倒在雅威面前
  rationale: שׁפך意为“倒出、倾倒”，לִפְנֵי意为“在……面前”。明确重复“水”，使汉语指代清楚而不增加解释。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以“雅威”音译四字神名，保留其作为以色列之神专名的性质，而不以称号代替。
- source_word: וַיָּצוּמוּ בַּיּוֹם הַהוּא
  choice: 那一天，他们禁食
  rationale: צום直接表示禁食；这一语序在现代汉语中自然，并保留原文的时间强调。
- source_word: חָטָאנוּ לַיהוָה
  choice: 我们得罪了雅威
  rationale: חטא与ל连用可表达“得罪某人、对某人犯罪”；“得罪了雅威”简洁保留认罪的对象与完成性。
- source_word: וַיִּשְׁפֹּט שְׁמוּאֵל אֶת בְּנֵי יִשְׂרָאֵל
  choice: 撒母耳为以色列人施行审判
  rationale: שׁפט可涵盖审理、施行公义及士师职分。“施行审判”保留核心词义，又避免“审判以色列人”被误解为单纯定罪。בְּנֵי יִשְׂרָאֵל在此是民族群体称谓，译作自然的“以色列人”。
theological_decisions:
- issue: 倒水仪式的含义
  choice: 正文只按原文叙述他们把水倒在雅威面前，不解释其象征意义。
  alternative: 直接译成悔改、哀恸、献奠或自我倾倒的象征行为。
  rationale: 经文本身没有说明这一行动的象征意义；将可能的理解放入注释，可避免把某一种解释写进正文。
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 音译专名可保留原文中神的个人名，并避免以称号取代专名。
- issue: 撒母耳“审判”以色列的范围
  choice: 为以色列人施行审判
  alternative: 治理以色列人；作以色列人的士师；审判以色列人
  rationale: 原词可涉及司法判断和士师治理，正文保留“审判”这一核心意义，同时不把它缩减为定罪或扩展成纯粹行政统治。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“打水”“禁食”“施行审判”均为普通读者易懂的表达；不在正文中补入仪式解释，也不把撒母耳的职分限定为单一的司法或行政含义。
