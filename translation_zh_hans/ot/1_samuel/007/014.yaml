  terminology: “非利士人”“以色列”“以革伦”“迦特”“亚摩利人”均恰当且一致。“城邑”“疆域”保持庄重的历史叙事语域；“疆域”对应此处复数后缀所指的各城地域，避免误解为以色列单数的领土。
