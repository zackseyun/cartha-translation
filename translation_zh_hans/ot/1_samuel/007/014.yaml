  text: וַ/תָּשֹׁ֣בְנָה הֶ/עָרִ֡ים אֲשֶׁ֣ר לָֽקְחוּ פְלִשְׁתִּים֩ מֵ/אֵ֨ת יִשְׂרָאֵ֤ל לְ/יִשְׂרָאֵל֙ מֵ/עֶקְר֣וֹן וְ/עַד גַּ֔ת וְ/אֶ֨ת גְּבוּלָ֔/ן הִצִּ֥יל יִשְׂרָאֵ֖ל מִ/יַּ֣ד פְּלִשְׁתִּ֑ים וַ/יְהִ֣י שָׁל֔וֹם בֵּ֥ין יִשְׂרָאֵ֖ל וּ/בֵ֥ין הָ/אֱמֹרִֽי־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/014.yaml
  text: And the cities that the Philistines had taken from Israel were restored to Israel[a], from Ekron to Gath; and Israel delivered its territory from the hand of the Philistines. And there was peace between Israel and the Amorites.
translation:
  language: zh_hans
  text: 非利士人从以色列夺去的城邑，从以革伦直到迦特，都归回以色列；以色列也从非利士人手中收复了这些城的疆域。以色列与亚摩利人[a]之间有和平。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “亚摩利人”在这里也可能是对当地迦南各族的广义称呼。
    reason: 说明该族名可能具有较广的指称范围，同时保留正文对希伯来词的直接翻译。
lexical_decisions:
- source_word: וַתָּשֹׁבְנָה
  choice: 都归还了
  rationale: 动词以“城邑”为主语，表达这些城重新归于以色列掌管；汉语用“归还了”自然传达这一结果，同时不明说归还者。
- source_word: הֶעָרִים
  choice: 城邑
  rationale: “城邑”既符合古代地缘政治语境，又比单用“城市”更具庄重而自然的经文语体。
- source_word: אֲשֶׁר לָקְחוּ פְלִשְׁתִּים מֵאֵת יִשְׂרָאֵל
  choice: 非利士人从以色列夺去的
  rationale: “夺去”体现战争中取得控制权的语境；定语结构清楚表示此事发生在城邑归还以前。
- source_word: מֵעֶקְרוֹן וְעַד גַּת
  choice: 从以革伦直到迦特
  rationale: 保留原文所标示的地理范围，“直到”对应 וְעַד 的界限含义。
- source_word: וְאֶת גְּבוּלָן
  choice: 这些城的疆土
  rationale: 阴性复数后缀指向前文的“城邑”，不是语法上单数的“以色列”；“疆土”在此比“边界”更能表达城邑所属地域。
- source_word: הִצִּיל יִשְׂרָאֵל
  choice: 以色列也……夺了回来
  rationale: נצל 的使役式表示从敌方控制下解救或夺回；在领土语境中，“夺了回来”比“拯救疆土”更符合现代汉语，同时保留脱离敌手的意义。
- source_word: מִיַּד פְּלִשְׁתִּים
  choice: 从非利士人手中
  rationale: 保留希伯来语“从……手中”的具体意象；这一说法在现代汉语中也自然，表示脱离其权势或控制。
- source_word: וַיְהִי שָׁלוֹם
  choice: 之间也有和平
  rationale: 直接保留存在句和“和平”的核心含义，不把它限定为盟约、停战或其他更具体的关系。
- source_word: הָאֱמֹרִי
  choice: 亚摩利人
  rationale: 正文按马所拉文本保留具体族名；虽然该词在此可能广指当地迦南居民，但不在正文中预先消解这一歧义。
theological_decisions:
- issue: 末句族名 הָאֱמֹרִי 的指称范围
  choice: 亚摩利人
  alternative: 迦南人
  rationale: 原文明确使用“亚摩利人”这一族名，因此正文照译；有些理解认为这里以该名称广指当地各族，这一可能性置于脚注，以保存历史解释上的张力。
translation_notes:
  register: 采用现代、庄重且便于普通读者理解的书面汉语。“城邑”“疆土”维持历史叙事的经文语域；整体句法尽量自然，并保留原文两项恢复行动及末句和平状态的并列结构。
