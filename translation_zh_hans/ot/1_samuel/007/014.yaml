revisions:
- from: 非利士人从以色列夺去的城邑，从以革伦直到迦特，都归还了以色列；这些城的疆土，以色列也从非利士人手中夺了回来。以色列与亚摩利人[a]之间也有和平。
  to: 非利士人从以色列夺去的城邑，从以革伦直到迦特，都归回以色列；以色列也从非利士人手中收复了这些城的疆域。以色列与亚摩利人[a]之间有和平。
  rationale: 修订仅处理汉语搭配与表达清晰度：“归回以色列”保留原文城邑作主语的返回/恢复归属含义；“收复了这些城的疆域”清楚对应“他们的疆域”，并自然表达从非利士人手中脱离控制。删除末句“也”以使存在句更顺畅，不改变原文并列关系。脚注保留原有解释范围和锚点。
