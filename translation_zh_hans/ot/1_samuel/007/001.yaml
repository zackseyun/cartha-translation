base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/001.yaml
  text: Then the men of Kiriath-jearim came and brought up the ark of Yahweh[a], and they brought it into the house of Abinadab on the hill[b]. And they consecrated Eleazar his son to keep the ark of Yahweh.
translation:
  language: zh_hans
  text: 基列·耶琳人来到，把耶和华[a]的约柜抬上去，送进山冈[b]上亚比拿达的家里；他们又把亚比拿达的儿子以利亚撒分别为圣，让他看守耶和华的约柜。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来原文使用神名YHWH；通常也音译为“雅威”。
    reason: lexical_alternative
  - marker: b
    text: “山冈”也可能译作地名“基比亚”。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּבֹאוּ אַנְשֵׁי קִרְיַת יְעָרִים
  choice: 基列·耶琳人就来
  rationale: אַנְשֵׁי在此指当地的人；汉语用“基列·耶琳人”自然简洁。“就”体现连续叙事中的推进关系。
- source_word: וַיַּעֲלוּ אֶת אֲרוֹן יְהוָה
  choice: 把耶和华的约柜抬上去
  rationale: עלה在使役形态中有“使上去、带上去”之意；“抬上去”既符合约柜由人搬运的情境，也保留向高处移动的方向感。
- source_word: אֶל בֵּית אֲבִינָדָב
  choice: 送进……亚比拿达的家里
  rationale: אֶל表示目的地；结合“家”，译为“送进……家里”自然表达进入屋内或宅院的意思。
- source_word: בַּגִּבְעָה
  choice: 山冈上
  rationale: 该词带定冠词，最直接可理解为普通名词“山冈”，不必确定为地名“基比亚”。
- source_word: קִדְּשׁוּ
  choice: 分别为圣
  rationale: קדשׁ在这里表示为神圣职责而分别出来；“分别为圣”保留礼仪和宗教含义。
- source_word: לִשְׁמֹר
  choice: 看守
  rationale: שׁמר在此含照管、守护之意；“看守”清楚表达以利亚撒对约柜负有守护责任。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 正文采用现代中文圣经读者广泛熟悉的“耶和华”，同时以脚注说明希伯来原文使用四字神名，以免掩盖原文信息。
- issue: בַּגִּבְעָה应理解为普通名词还是地名
  choice: 山冈上
  alternative: 在基比亚
  rationale: 带定冠词的形式最自然地理解为“那山冈”；但地名解释仍有可能，因此保留在脚注中，不在正文中消除这一歧义。
- issue: קִדְּשׁוּ的神圣职分含义
  choice: 分别为圣
  alternative: 选派
  rationale: 原词不仅表示任命，也含为神圣用途分别出来的意义；“分别为圣”保留这一宗教张力，而不进一步推断具体仪式或职衔。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“基列·耶琳”以间隔号标示复合音译地名；句法适度顺应汉语叙事习惯，同时保留原文的动作顺序、上行方向以及“分别为圣”的礼仪色彩。
