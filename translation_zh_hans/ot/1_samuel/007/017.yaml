  naturalness: 修订后的句子保持现代汉语的自然、庄重叙事风格；“总是”准确表达上下文中的惯常巡回活动，而不把“之后”误作单次时间顺序。
  terminology: “拉玛”“祭坛”“雅威”均可保留。“审判以色列”是对原文动词的标准而直接的翻译；其较广的职分含义可由语境理解，无须在正文改为“治理”。
