base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/017.yaml
  text: Then he would return to Ramah[a], for his house was there, and there he judged Israel. He built there an altar to Yahweh.
translation:
  language: zh_hans
  text: 他总是回到拉玛[a]，因为他的家在那里；他在那里审判以色列。他在那里为雅威筑了一座祭坛。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较直译：“他的归返是向拉玛。”
    reason: 原文使用带第三人称单数后缀的名词“归返”；正文根据上文所述的定期巡行，译为习惯性的动作。
lexical_decisions:
- source_word: וּתְשֻׁבָתוֹ
  choice: 之后，他总会回到
  rationale: 原文是名词性表达“他的返回”，结合上一节所述定期巡行，译为习惯性的“总会回到”更符合现代汉语；“之后”承接叙事中的连接词。
- source_word: הָרָמָתָה
  choice: 拉玛
  rationale: 地名后的方向词尾表示朝向、到达，汉语用“回到拉玛”自然表达。
- source_word: כִּי
  choice: 因为
  rationale: 在此说明他返回拉玛的原因。
- source_word: בֵּיתוֹ
  choice: 他的家
  rationale: בַּיִת 在此既指居所，也带有生活基地之意；“家”比“房屋”更自然。
- source_word: וְשָׁם
  choice: 他也在那里
  rationale: 保留原文重复的“在那里”，突出拉玛既是撒母耳的家，也是他履行职责的地点；“也”自然连接前一分句。
- source_word: שָׁפַט אֶת־יִשְׂרָאֵל
  choice: 治理以色列
  rationale: שׁפט 在此指撒母耳作为士师施行判断并带领百姓的广义职责；“治理”避免让现代读者误以为仅指法庭审判。
- source_word: וַיִּבֶן
  choice: 他……筑了
  rationale: 承接叙事并陈述撒母耳在拉玛所做的另一件事，不额外强化原文没有明确表达的逻辑关系。
- source_word: מִזְבֵּחַ
  choice: 一座祭坛
  rationale: 祭坛是 מִזְבֵּחַ 的常规、准确译法；量词“一座”符合现代汉语。
- source_word: לַיהוָה
  choice: 为雅威
  rationale: 介词 ל 表示祭坛归于或献给雅威；“为”在汉语中自然表达其奉献对象，神名 יהוה 音译为“雅威”。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；“雅威”以常见现代汉语音译保留其专名性质，不将其改成称号。
- issue: שׁפט 所表达的撒母耳职分
  choice: 治理以色列
  alternative: 审判以色列；作以色列的士师
  rationale: 该动词涵盖裁断、领导和履行士师职责。“治理”保留广义功能，不把它缩窄为司法审判，也不把动词明确改写为职衔。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。保留“在那里”的重复，以呈现原文围绕拉玛安排句子的结构；用分号避免连续短句显得零碎。
