  to: 他总是回到拉玛[a]，因为他的家在那里；他在那里审判以色列。他在那里为雅威筑了一座祭坛。
  rationale: 删除“之后”和两处无原文依据的“也”，以免把惯常的归返叙述处理成单次顺序事件或增添附加关系。将“治理以色列”改为“审判以色列”，以直接对应 שָׁפַט，同时保留该词在士师语境中的广义空间。其余译文忠实、自然，神名“雅威”及脚注的词汇替代均可保留。
