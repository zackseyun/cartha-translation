base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/029/009.yaml
  text: Achish answered and said to David[a], “I know that you are good in my eyes, like an angel of God. Yet the commanders of the Philistines have said, ‘He must not go up with us into battle.’”
translation:
  language: zh_hans
  text: 亚吉回答大卫说：“我知道，你在我眼中很好，如同上帝的使者[a]。然而，非利士人的将领们说：‘他不可同我们一起上阵。’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“如同上帝的天使。”希伯来语词 מַלְאָךְ 可指“使者”或“天使”；在“上帝的使者”这一表达中，两种理解都有可能。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: 回答……说
  rationale: 保留希伯来叙事中“回答—说”的双重表达；现代汉语虽可简化为“回答”，但此译法仍自然且贴近原文结构。
- source_word: יָדַעְתִּי
  choice: 我知道
  rationale: 完成式在当前话语中表达亚吉已经形成并持续持有的判断，汉语现在时“我知道”最自然。
- source_word: טוֹב אַתָּה בְּעֵינַי
  choice: 你在我眼中是好的
  rationale: 保留“在我眼中”的希伯来评价习语，并以宽泛的“好”避免擅自限定为忠诚、可靠或蒙悦纳。
- source_word: כְּמַלְאַךְ אֱלֹהִים
  choice: 如同上帝的使者
  rationale: מַלְאָךְ兼有“使者”和“天使”之义；“上帝的使者”保留词义开放性，也符合该固定表达的庄重语域。脚注说明另一自然译法。
- source_word: אַךְ
  choice: 然而
  rationale: 体现亚吉个人评价与非利士将领决定之间的让步性转折。
- source_word: שָׂרֵי פְלִשְׁתִּים
  choice: 非利士人的将领们
  rationale: 上下文是军事行动，שָׂרִים在此指掌权的军事领袖；“将领”比“首领”更切合战事语境。
- source_word: לֹא יַעֲלֶה
  choice: 他不可……上阵
  rationale: 未完成式在引语中表达禁止或已作出的否决；“不可”准确传达其规范性力度。“上阵”自然表达参加此次战斗，也保留עלה所含的出征意味。
- source_word: עִמָּנוּ בַּמִּלְחָמָה
  choice: 同我们一起上阵
  rationale: 以自然现代汉语表达“与我们一同参加战斗”，不将冠词机械译出。
theological_decisions:
- issue: מַלְאַךְ אֱלֹהִים在亚吉比喻中的含义
  choice: 正文译作“上帝的使者”，并用脚注列出“上帝的天使”这一可能译法
  alternative: 如同上帝的天使
  rationale: 该词既可指人间使者，也可指天使；此处是表达极高评价的比喻，并非对大卫本体身份的断言。正文与脚注共同保留原词的词义张力，不作教义化推断。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“在我眼中是好的”有意保留原文习语及宽泛评价；“上阵”使军事语境自然清楚。
