base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/029/002.yaml
  text: And the lords of the Philistines were passing by by hundreds and by thousands[a], and David and his men were passing by at the rear with Achish.
translation:
  language: zh_hans
  text: 非利士人的首领们成百上千地列队经过[a]；大卫和他的部下同亚吉一起走在最后。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“按百人、千人的单位列队经过。”原文也可能指军队按百人和千人的单位编组。
    reason: 原文“按百人、千人”的短语可作数量性的描述，也可能指军事编制；脚注保留这一未决的解释空间。
lexical_decisions:
- source_word: סַרְנֵי פְלִשְׁתִּים
  choice: 非利士人的首领
  rationale: סֶרֶן特指非利士各城邦中兼具政治、军事地位的统治者；“首领”在现代汉语中自然，也能表达其高位身份。
- source_word: עֹבְרִים
  choice: 列队经过
  rationale: 分词描写行进中的持续场景；结合军事语境译作“列队经过”，比单纯“经过”更清楚自然。
- source_word: לְמֵאוֹת וְלַאֲלָפִים
  choice: 率领百人队、千人队
  rationale: 介词结构很可能表示军队按百人、千人的单位编组；此译使中文读者清楚理解其军事含义，同时用脚注保留较直译的可能。
- source_word: וְדָוִד וַאֲנָשָׁיו
  choice: 大卫和跟随他的人
  rationale: אֲנָשָׁיו在此指大卫麾下的男性随从或战士；“跟随他的人”比“他的人”自然，又避免把范围过度限定为正规士兵。
- source_word: בָּאַחֲרֹנָה
  choice: 走在队伍最后
  rationale: 该词表示行列末尾的位置；补出“队伍”符合上下文，在现代汉语中清晰顺畅。
- source_word: עִם אָכִישׁ
  choice: 同亚吉
  rationale: 准确表达简单的同行关系，并采用圣经人物通行译名“亚吉”。
