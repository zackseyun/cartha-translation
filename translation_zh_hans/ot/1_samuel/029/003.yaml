  text: וַ/יֹּֽאמְרוּ֙ שָׂרֵ֣י פְלִשְׁתִּ֔ים מָ֖ה הָ/עִבְרִ֣ים הָ/אֵ֑לֶּה וַ/יֹּ֨אמֶר אָכִ֜ישׁ אֶל שָׂרֵ֣י פְלִשְׁתִּ֗ים הֲ/לֽוֹא זֶ֨ה דָוִ֜ד עֶ֣בֶד שָׁא֣וּל מֶֽלֶךְ יִשְׂרָאֵ֗ל אֲשֶׁ֨ר הָיָ֤ה אִתִּ/י֙ זֶ֤ה יָמִים֙ אוֹ זֶ֣ה שָׁנִ֔ים וְ/לֹֽא מָצָ֤אתִי ב/וֹ֙ מְא֔וּמָה מִ/יּ֥וֹם נָפְל֖/וֹ עַד הַ/יּ֥וֹם הַ/זֶּֽה־־׀־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/029/003.yaml
  text: Then the Philistine commanders said[a], “What are these Hebrews?” And Achish said to the Philistine commanders, “Is this not David, the servant of Saul king of Israel, who has been with me these days or these years? And I have found nothing against him from the day of his defecting until this very day.”
translation:
  language: zh_hans
  text: 非利士人的将领说：“这些希伯来人是怎么回事？”亚吉对非利士人的将领说：“这不是以色列王扫罗的臣仆大卫吗？他跟我在一起，已经有些日子，或有些年了。从他投奔我那天起，直到今天，我没有发现他有什么过错。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译可作“从他倒向（我）那天起”；在此军事政治语境中，也可理解为“从他归附我”或“从他变节来到我这里”那天起。
    reason: 说明 נפל 的字面形象及其在军事政治语境中的可能含义；括号保留原文短语未明说受词、而由上下文指向亚吉的空间。
lexical_decisions:
- source_word: שָׂרֵי פְלִשְׁתִּים
  choice: 非利士人的将领
  rationale: 上下文是军队集结与出战，“将领”准确表达 שָׂרִים 在此处的军事领导含义，也比“首领”更具体。
- source_word: מָה הָעִבְרִים הָאֵלֶּה
  choice: 这些希伯来人是怎么回事？
  rationale: 原文是省略式问句，直译近于“这些希伯来人是什么？”中文用“是怎么回事”既保留简略、质疑的语气，又不明确补入原文没有的“在这里做什么”。
- source_word: הָעִבְרִים
  choice: 希伯来人
  rationale: 保留非利士人所用的族群称谓，不改为“以色列人”。
- source_word: הֲלוֹא
  choice: 这不是……吗？
  rationale: 自然表达预期对方认同的反问语气。
- source_word: עֶבֶד
  choice: 臣仆
  rationale: 此处指大卫从前与扫罗之间的君臣和服侍关系；“臣仆”比现代汉语单用“仆人”更符合王室政治语境，又不强化奴隶身份。
- source_word: זֶה יָמִים אוֹ זֶה שָׁנִים
  choice: 已有这些日子，甚至这些年了
  rationale: 保留原文从“日子”到“年岁”的不确定、延展表达；“甚至”使该略显特殊的希伯来措辞在中文中连贯，但不把期限具体化。
- source_word: מְאוּמָה
  choice: 有什么过错
  rationale: 该词本义为“任何事物”，在“没有发现他……”的语境中指没有查出可责之处；中文如此表达自然清楚。
- source_word: מִיּוֹם נָפְלוֹ
  choice: 从他投奔我那天起
  rationale: נפל 在军事政治语境中可指倒向、归附某人；“投奔”符合大卫来到亚吉处的情境，同时脚注保留字面形象及“变节”的可能语气。
- source_word: עַד הַיּוֹם הַזֶּה
  choice: 直到今天
  rationale: 是自然、庄重的现代汉语时间表达，充分传达“直到这日”的强调。
- source_word: אָכִישׁ / דָוִד / שָׁאוּל
  choice: 亚吉／大卫／扫罗
  rationale: 采用简体中文圣经人名的通行译法。
theological_decisions:
- issue: 亚吉对大卫行为的评价范围
  choice: 我没有发现他有什么过错
  alternative: 我没有发现任何反对他的事／我没有发现他有任何不妥
  rationale: 原文 מָצָאתִי בוֹ מְאוּמָה 字面为“我在他里面没有发现任何东西”，语境表示亚吉没有查出可指责大卫之处；译文只呈现亚吉的判断，不将其扩展为对大卫道德状况的绝对评价。
- issue: 大卫来到亚吉处的政治性质
  choice: 投奔我
  alternative: 归附我／变节来到我这里／倒向我
  rationale: “投奔”能表达转而依附的政治动作，却不替叙述者判定其道德性质；脚注交代更字面的说法和可译选择。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。问句保留原文的突兀质疑感，不擅自补入“在这里做什么”；同时用自然中文避免生硬直译。脚注标记置于与其所释“投奔”相关的句末。
