base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/029/007.yaml
  text: So now[a], return and go in peace, and do not do evil in the eyes of the Philistine lords.
translation:
  language: zh_hans
  text: 如今，你回去，平平安安地走吧；不要在非利士众首领眼中行恶。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不要做非利士众首领看为不妥的事。”希伯来文这一表达既可指他们判断为恶的事，也可指他们认为不可接受的事。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: 所以现在
  rationale: וְ既承接上文，也引出结论性的吩咐；“所以现在”自然表达这种连接和推进作用。
- source_word: שׁוּב וְלֵךְ
  choice: 你回去……走吧
  rationale: 保留原文连续使用的两个命令动词，既传达返回之意，也保留让大卫离开的强调语气。
- source_word: בְּשָׁלוֹם
  choice: 平平安安地
  rationale: 这是希伯来文常用表达，可指安然、无事地离开；此译法自然且保留“平安”的字面意象。
- source_word: וְלֹא תַעֲשֶׂה רָע
  choice: 不要……行恶
  rationale: 直译עשה רע的道德色彩，不将רָע狭义化为“伤害”；其在本语境中也可能泛指做对方认为不妥的事，因此加注说明。
- source_word: בְּעֵינֵי
  choice: 在……眼中
  rationale: 保留希伯来文表示评价或判断的惯用语，同时在现代汉语中清楚可懂。
- source_word: סַרְנֵי פְלִשְׁתִּים
  choice: 非利士人的首领
  rationale: סֶרֶן是非利士城邦最高统治者的特定称谓；“首领”比泛称“官长”更能体现其政治地位。
theological_decisions:
- issue: “行恶”是客观道德判断，还是指非利士首领认为不可接受的行为
  choice: 正文保留“在……眼中行恶”的原文张力
  alternative: 不要做非利士人的首领看为不妥的事
  rationale: בְּעֵינֵי表明评价与非利士首领的看法有关，但רָע本身仍有“恶”的含义；正文不把它完全弱化为“得罪”或“不妥”，脚注则说明语境中的另一种理解。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“平平安安地走吧”保留希伯来语的平安表达；分号清楚区分离开的命令与后续禁令。
