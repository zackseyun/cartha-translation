  text: וַ/יִּקְצְפ֨וּ עָלָ֜י/ו שָׂרֵ֣י פְלִשְׁתִּ֗ים וַ/יֹּ֣אמְרוּ ל/וֹ֩ שָׂרֵ֨י פְלִשְׁתִּ֜ים הָשֵׁ֣ב אֶת הָ/אִ֗ישׁ וְ/יָשֹׁב֙ אֶל מְקוֹמ/וֹ֙ אֲשֶׁ֣ר הִפְקַדְתּ֣/וֹ שָׁ֔ם וְ/לֹֽא יֵרֵ֤ד עִמָּ֨/נוּ֙ בַּ/מִּלְחָמָ֔ה וְ/לֹא יִֽהְיֶה לָּ֥/נוּ לְ/שָׂטָ֖ן בַּ/מִּלְחָמָ֑ה וּ/בַ/מֶּ֗ה יִתְרַצֶּ֥ה זֶה֙ אֶל אֲדֹנָ֔י/ו הֲ/ל֕וֹא בְּ/רָאשֵׁ֖י הָ/אֲנָשִׁ֥ים הָ/הֵֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/029/004.yaml
  text: But the Philistine commanders were angry with him[a], and the Philistine commanders said to him, “Send the man back, so that he may return to his place where you assigned him, and let him not go down with us into battle, lest he become an adversary to us in the battle[b]. For with what could this man reconcile himself to his lord? Would it not be with the heads of those men?”
translation:
  language: zh_hans
  text: 非利士人的统领却向亚吉发怒。非利士人的统领对他说：“把这人送回去，让他回到你给他安排的地方。他不可同我们下去作战，免得他在战场上反过来与我们为敌[a]。这人要靠什么重新讨他主人的欢心呢[b]？岂不是靠那些人的首级吗？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的希伯来语 שָׂטָן 意为“敌手”或“对头”，不是专名“撒但”。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“使自己与主人和好”。这个希伯来语表达指使自己重新得到上级的悦纳。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְצְפוּ עָלָיו
  choice: 向亚吉发怒
  rationale: קצף表示发怒或震怒；代词所指为上下文中的亚吉。译出专名可避免现代汉语中代词指向不清，同时不改变原意。
- source_word: שָׂרֵי פְלִשְׁתִּים
  choice: 非利士人的统领
  rationale: שָׂרִים在此兼有政治与军事领袖之意；“统领”符合战事语境，又不局限为现代军衔。
- source_word: הָשֵׁב אֶת הָאִישׁ
  choice: 把这人送回去
  rationale: שוב的使役命令式意为使某人返回；“送回去”自然地保留命令语气和使役含义。
- source_word: וְיָשֹׁב אֶל מְקוֹמוֹ
  choice: 让他回到……地方
  rationale: 承接前面的命令，表达所要求的结果；“让他回到”符合现代汉语。
- source_word: אֲשֶׁר הִפְקַדְתּוֹ שָׁם
  choice: 你给他安排的地方
  rationale: הפקיד可指委派、安置或派驻；“安排”保留其较宽泛的含义，不强行断定具体职务或驻地性质。
- source_word: וְלֹא יֵרֵד עִמָּנוּ בַּמִּלְחָמָה
  choice: 他不可同我们下去作战
  rationale: 保留ירד“下去”的空间性表达，并以“作战”自然呈现במלחמה在语境中的含义。
- source_word: וְלֹא יִהְיֶה לָּנוּ לְשָׂטָן
  choice: 免得他……反过来与我们为敌
  rationale: שָׂטָן在此是普通名词，指敌手或对头；“反过来与我们为敌”清楚表达非利士统领担心大卫临阵倒戈的意思。
- source_word: יִתְרַצֶּה זֶה אֶל אֲדֹנָיו
  choice: 这人要靠什么重新讨他主人的欢心呢
  rationale: רצה的Hitpael形式在此指使自己重新蒙上级悦纳、恢复关系；“重新讨……欢心”自然表达实际语义，脚注保留“与主人和好”的另一种表达。
- source_word: אֲדֹנָיו
  choice: 他的主人
  rationale: 此处指大卫原来的君主扫罗；“主人”保留上下级归属关系，而不把所指直接补进正文。
- source_word: הֲלוֹא בְּרָאשֵׁי הָאֲנָשִׁים הָהֵם
  choice: 岂不是靠那些人的首级吗
  rationale: 原文措辞简略，意指以那些人的首级为手段；译文保留“那些人”的指示性和原句的反问力度。
theological_decisions:
- issue: שָׂטָן的含义
  choice: 普通名词“敌人／敌手”
  alternative: 专名“撒但”
  rationale: 在这段历史叙事中，该词指战场上的敌手，并非邪恶灵体的专名；译作“与我们为敌”避免加入原文没有表达的魔鬼论含义。
- issue: יִתְרַצֶּה所表达的关系恢复
  choice: 重新讨他主人的欢心
  alternative: 使自己与主人和好
  rationale: 原文可着重于重新蒙悦纳，也可表述为恢复与上级的关系；正文采用自然汉语，脚注保留另一种理解角度，不把该关系赋予额外的宗教性和好含义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。对话保持军事场景中的直接与紧迫；保留“下去”和“首级”等原文意象。脚注标记均放在相关词句之后，并纠正了英文咨询层中脚注标记与脚注内容错位的问题。
