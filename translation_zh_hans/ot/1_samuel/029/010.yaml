  text: וְ/עַתָּה֙ הַשְׁכֵּ֣ם בַּ/בֹּ֔קֶר וְ/עַבְדֵ֥י אֲדֹנֶ֖י/ךָ אֲשֶׁר בָּ֣אוּ אִתָּ֑/ךְ וְ/הִשְׁכַּמְתֶּ֣ם בַּ/בֹּ֔קֶר וְ/א֥וֹר לָ/כֶ֖ם וָ/לֵֽכוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/029/010.yaml
  text: Now rise early in the morning[a], you and your master's servants who came with you. When you rise early in the morning and it is light for you, go.
translation:
  language: zh_hans
  text: 现在，你要清早起来；那些跟你一同来的、你主人的仆人也要起来。你们清早起来，天一亮[a]就走吧。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“有光给你们”，意思可能是“天光一出现，你们就走”或“黎明时就走”。
    reason: 保留וְאוֹר לָכֶם这一不寻常表达的字面形态及其时间含义。
lexical_decisions:
- source_word: וְעַתָּה
  choice: 现在
  rationale: 作为话语标记，引出眼前要执行的命令；“现在”自然保留了转折和推进作用。
- source_word: הַשְׁכֵּם בַּבֹּקֶר
  choice: 清早起来
  rationale: שׁכם的使役式在此表示早起或及早动身；与“清早”结合，既体现动作，也保留时间信息。
- source_word: וְעַבְדֵי אֲדֹנֶיךָ אֲשֶׁר בָּאוּ אִתָּךְ
  choice: 同你来的、你主人的仆人也要起来
  rationale: 原文以并列名词短语接在单数命令之后，中文补出“也要起来”以清楚表达其共同受命，同时保留“同你来的”这一限定。אֲדֹנֶיךָ在这里指人的主人，不作神圣称号处理。
- source_word: וְהִשְׁכַּמְתֶּם בַּבֹּקֶר
  choice: 你们清早起来
  rationale: 复数形式转而包括大卫及其随从；保留原文重复的“清早起来”，不将两句合并。
- source_word: וְאוֹר לָכֶם
  choice: 天一亮
  rationale: 该短语字面近于“有光给你们”，在语境中指天亮、可以启程之时；正文采用自然现代汉语，脚注注明字面形式。
- source_word: וָלֵכוּ
  choice: 就走吧
  rationale: 复数命令要求众人离去；“走吧”直接而自然，“就”清楚连接天亮与启程。
theological_decisions:
- issue: אֲדֹנֶיךָ是否采用可能带神学色彩的称谓
  choice: 你主人
  alternative: 你主／你的主
  rationale: 上下文所指是大卫在人间所效忠的主人，因此采用普通人际称谓“主人”，避免误读为神圣称号。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。保留原文两次“清早起来”的重复，以及第一句单数命令转入后文复数表达的范围变化；为使中文句法完整，在并列的“仆人”之后补出“也要起来”。
