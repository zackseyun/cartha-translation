base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/029/001.yaml
  text: The Philistines gathered all their camps at Aphek[b][a], while Israel was encamped by the spring that is in Jezreel.
translation:
  language: zh_hans
  text: 非利士人将他们各营[a]集结在亚弗；以色列人则在耶斯列的泉旁[b]安营。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“他们所有的营地”或“他们所有的军队”；希伯来文直译为“他们所有的营”。
    reason: lexical_alternative
  - marker: b
    text: 或译“水源旁”；这个希伯来词可指泉或水源。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְבְּצוּ
  choice: 集结
  rationale: קבץ表示聚集、集合；本节处于军事语境，“集结”自然传达军队会合之意，又没有增添具体的军事程序。句首不另加“那时”或“现在”，因为原文没有相应的显性时间词。
- source_word: פְלִשְׁתִּים
  choice: 非利士人
  rationale: 采用现代中文圣经和历史叙事中通行的族名译法。
- source_word: כָּל מַחֲנֵיהֶם
  choice: 他们所有的营队
  rationale: מַחֲנֶה本义可指营地、营盘，也可借指驻营的军队或队伍。中文说把“营地”集结到某处略显生硬，因此正文用“营队”兼顾字面意象和军事语境，并以脚注保留其他可能译法。
- source_word: אֲפֵקָה
  choice: 到亚弗
  rationale: 地名采用通行音译；词尾方向词素表示朝向，结合“集结”译为“到亚弗”。
- source_word: וְיִשְׂרָאֵל
  choice: 以色列人则
  rationale: 连词在这里连接同时存在并形成对照的两方军情；“则”简洁呈现这种场景对照。
- source_word: חֹנִים
  choice: 安营
  rationale: חנה的分词描述以色列人当时驻扎的状态；“安营”符合现代中文军事叙事。
- source_word: בַּעַיִן
  choice: 在……泉旁
  rationale: עַיִן可指泉、水泉；“泉旁”是清楚自然的地理表达，并以脚注注明可选译法。
- source_word: אֲשֶׁר בְּיִזְרְעֶאל
  choice: 耶斯列的
  rationale: 关系从句说明泉所在之处。中文用“耶斯列的泉”自然凝练地表达“在耶斯列的泉”，不把关系解释得更具体。
