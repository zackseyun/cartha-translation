  yaml_path: translation/ot/1_samuel/029/005.yaml
  text: Is this not David[a], of whom they sang to one another in the dances, saying, ‘Saul has struck down his thousands[b], and David his ten thousands’?”
translation:
  language: zh_hans
  text: “这不是大卫吗？人们跳舞时曾唱和说：‘扫罗击杀千千，大卫击杀万万！’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֲלוֹא זֶה דָוִד
  choice: 这不是大卫吗
  rationale: 保留原文期待肯定回答的反问形式，也自然表达说话者对大卫身份的明确指认。
- source_word: יַעֲנוּ לוֹ
  choice: 为他唱和
  rationale: ענה在歌舞语境中指应答式、轮流式的歌唱；“唱和”既体现这种形式，也保留לוֹ所表达的歌曲以大卫为对象。
- source_word: בַּמְּחֹלוֹת
  choice: 在舞蹈中
  rationale: מְחֹלוֹת指庆祝时的舞蹈或舞圈；此译保留原文复数所呈现的歌舞场景。
- source_word: הִכָּה
  choice: 击杀
  rationale: נכה在军事语境中表示击倒并杀死；“击杀”兼顾动作力度与战事含义。
- source_word: בַּאֲלָפָיו
  choice: 千千
  rationale: 采用简洁而有节奏的数目表达，与下句“万万”构成原文鲜明的平行和递增。
- source_word: בְרִבְבֹתָיו
  choice: 万万
  rationale: רְבָבוֹת是רְבָבָה（万）的复数；“万万”保留诗歌式复数和与“千千”的数量对照，而脚注说明其也可泛指极多之数。
