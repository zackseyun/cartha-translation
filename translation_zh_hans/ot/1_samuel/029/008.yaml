  text: וַ/יֹּ֨אמֶר דָּוִ֜ד אֶל אָכִ֗ישׁ כִּ֣י מֶ֤ה עָשִׂ֨יתִי֙ וּ/מַה מָּצָ֣אתָ בְ/עַבְדְּ/ךָ֔ מִ/יּוֹם֙ אֲשֶׁ֣ר הָיִ֣יתִי לְ/פָנֶ֔י/ךָ עַ֖ד הַ/יּ֣וֹם הַ/זֶּ֑ה כִּ֣י לֹ֤א אָבוֹא֙ וְ/נִלְחַ֔מְתִּי בְּ/אֹיְבֵ֖י אֲדֹנִ֥/י הַ/מֶּֽלֶךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/029/008.yaml
  text: David said to Achish[a], “But what have I done? And what have you found against your servant from the day I entered your service until this day[b], that I should not go and fight against the enemies of my lord the king?”
translation:
  language: zh_hans
  text: 大卫对亚吉说：“可是，我做了什么？从我来到你面前的那一天直到今日，你在仆人身上发现了什么过错，竟不让我去与我主我王[a]的仇敌交战呢？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “我主我王”照大卫的原话保留。按表面语境，这可以指亚吉；但在整个叙事中，这句话也可能带有刻意保留的双重意味。希伯来文没有明确说明大卫心中所指。
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי מֶה עָשִׂיתִי
  choice: 可是，我做了什么？
  rationale: כִּי在此引出大卫对前言的抗议；译作“可是”自然表达转折和反问语气。
- source_word: וּמַה מָּצָאתָ בְעַבְדְּךָ
  choice: 你在仆人身上发现了什么过错
  rationale: 保留מצא与ב的“在……身上发现”结构，同时补出上下文明确蕴含的“过错”，使现代汉语自然清楚。
- source_word: בְעַבְדְּךָ
  choice: 仆人
  rationale: 这里是臣属对君王的谦称，并非着重其奴隶身份；“仆人”符合宫廷语域。
- source_word: מִיּוֹם אֲשֶׁר הָיִיתִי לְפָנֶיךָ עַד הַיּוֹם הַזֶּה
  choice: 从我来到你面前的那一天直到今日
  rationale: 希伯来文直译近于“从我在你面前的那一天”；“来到你面前”既较贴近原文，也能自然指大卫归附亚吉以来的时期，而不将“服事”这一解释直接写入正文。
- source_word: כִּי לֹא אָבוֹא וְנִלְחַמְתִּי
  choice: 竟不让我去……交战呢
  rationale: 该分句说明大卫抗议的内容，即为何不准他随军作战；“竟不让我”在汉语中自然承接前面的反问。
- source_word: בְּאֹיְבֵי
  choice: 与……的仇敌交战
  rationale: נלחם搭配ב时，介词标示交战对象；汉语用“与……交战”最自然。
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: 我主我王
  rationale: 保留原文对人间君王的尊称及其紧凑表达，不将所指对象解释性地写明。
theological_decisions:
- issue: “我主我王的仇敌”中“我主我王”的所指及修辞作用
  choice: 按大卫所说保留“我主我王”，不在正文中指明所指。
  alternative: 明确译成亚吉，或解释为大卫有意暗指扫罗、以色列的王。
  rationale: 希伯来文没有说明大卫内心所指；叙事语境可能使这句话具有双关意味。译文应保留这种张力，不替读者作出判断。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“仆人”“我主我王”保留古代宫廷中的谦称和尊称，但避免文言化。正文贴近希伯来文，同时以自然反问表达大卫的抗议。
