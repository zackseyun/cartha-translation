base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/029/011.yaml
  text: So David rose early[a], he and his men, to leave in the morning and return to the land of the Philistines[b]. And the Philistines went up to Jezreel.
translation:
  language: zh_hans
  text: 于是，大卫和他的人清早起来，为要在早晨动身返回非利士人的土地[a]。非利士人则上到耶斯列去[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文的两个不定式也可较直译为：“在早晨去，返回非利士人的土地。”
    reason: 保留 לָלֶכֶת 与 לָשׁוּב 之间句法关系的另一种可能表达。
  - marker: b
    text: “上到”反映希伯来语表示前往某地的惯用说法，可能带有地势或军事行进的意味；也可译作“向耶斯列进发”。
    reason: 说明 עָלוּ 的希伯来语空间用法，并保留较具军事色彩的译法。
lexical_decisions:
- source_word: וַיַּשְׁכֵּם
  choice: 清早起来
  rationale: שׁכם 的使役词干在此表示早起或一早行动；“清早起来”既自然，也保留了原文的时间强调。
- source_word: הוּא וַאֲנָשָׁיו
  choice: 大卫和手下的人
  rationale: 原文直译为“他和他的人”，指随同大卫的男性队伍；“手下的人”比“仆人”或“军队”更中性，也符合现代汉语。
- source_word: לָלֶכֶת בַּבֹּקֶר לָשׁוּב
  choice: 要在早晨动身，返回
  rationale: 两个不定式依次表达行动及其方向或目的。“动身”自然地传达 לָלֶכֶת 在此处从营地出发之意，同时保留“早晨”和“返回”两个要素。
- source_word: אֶל אֶרֶץ פְּלִשְׁתִּים
  choice: 返回非利士人的土地
  rationale: 保留 אֶרֶץ 的具体含义和族群称谓，不把所指范围缩窄为某座城。
- source_word: וּפְלִשְׁתִּים עָלוּ
  choice: 非利士人则上到
  rationale: “则”清楚标示叙事转向另一方；“上到”保留 עלה 的地势或军事行进意味，而不额外断定他们是在进军。
- source_word: יִזְרְעֶאל
  choice: 耶斯列
  rationale: 采用该地名通行的现代中文圣经译名。
theological_decisions: []
