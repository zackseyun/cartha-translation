  text: וַ/יִּקְרָ֨א אָכִ֜ישׁ אֶל דָּוִ֗ד וַ/יֹּ֣אמֶר אֵ֠לָי/ו חַי יְהוָ֞ה כִּי יָשָׁ֣ר אַתָּ֗ה וְ/ט֣וֹב בְּ֠/עֵינַ/י צֵאתְ/ךָ֨ וּ/בֹאֲ/ךָ֤ אִתִּ/י֙ בַּֽ/מַּחֲנֶ֔ה כִּ֠י לֹֽא מָצָ֤אתִֽי בְ/ךָ֙ רָעָ֔ה מִ/יּ֛וֹם בֹּאֲ/ךָ֥ אֵלַ֖/י עַד הַ/יּ֣וֹם הַ/זֶּ֑ה וּ/בְ/עֵינֵ֥י הַ/סְּרָנִ֖ים לֹֽא ט֥וֹב אָֽתָּה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/029/006.yaml
  text: Then Achish called David and said to him[a], “As Yahweh lives, you are upright, and your going out and your coming in with me in the camp is good in my sight; for I have not found any evil in you from the day of your coming to me to this day. But in the eyes of the lords of the Philistines[c][b], you are not good.”
translation:
  language: zh_hans
  text: 亚吉把大卫叫来，对他说：“我指着永活的雅威起誓，你为人正直。你在营中与我一同出入，我看为好；从你来到我这里的那一天直到今日，我没有发现你有什么恶行。不过，在非利士众首领[a]看来，你却不合他们的心意[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “首领”是原文对非利士各统治者所用的特定称号。
    reason: cultural_note
  - marker: b
    text: 原文直译为“但在众首领眼中，你并不好”；也可理解为“他们却不接纳你”。
    reason: alternative_reading
lexical_decisions:
- source_word: חַי יְהוָה
  choice: 我指着永活的雅威起誓
  rationale: 这是希伯来语的标准起誓公式。这样译既明确表达起誓的语用功能，也保留“雅威是活的”这一措辞内涵。
- source_word: יָשָׁר
  choice: 为人正直
  rationale: 该词表示正直、端正或无可指摘；“为人正直”在现代汉语中自然，也保留其道德评价。
- source_word: טוֹב בְּעֵינַי
  choice: 我看为好
  rationale: 保留希伯来语“在我眼中为好”的评价意象，同时避免生硬直译。
- source_word: צֵאתְךָ וּבֹאֲךָ אִתִּי בַּמַּחֲנֶה
  choice: 你在营中与我一同出入
  rationale: “出入”既贴近原文成对表达，也可自然指人在军营中的行动和表现，没有把含义缩窄为某一次军事行动。
- source_word: לֹא מָצָאתִי בְךָ רָעָה
  choice: 我没有发现你有什么恶行
  rationale: 原文直指没有在大卫身上发现“恶”；“恶行”符合此处对行为和过错的评价，又不弱化为单纯能力问题。
- source_word: סְרָנִים
  choice: 非利士首领
  rationale: 这是非利士统治者特有的称号；“首领”比“君王”或“将领”更能避免过度限定其具体政治或军事职分。
- source_word: לֹא טוֹב אָתָּה
  choice: 看你却不顺眼
  rationale: 原文简洁地说“你并不好”，在“他们眼中”的结构中表示不认可、不满意或不接纳。“看你不顺眼”自然保留这种主观否定评价。
theological_decisions:
- issue: 非利士王亚吉在誓言中使用神名 יְהוָה
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文明确使用四字神名，而非一般性的神称号。采用“雅威”以保留专名；经文并未解释亚吉如此起誓所反映的信仰立场，因此译文不作推断。
- issue: 亚吉称大卫正直且没有恶行
  choice: 按亚吉的陈述直接保留
  alternative: 将其解释为大卫在一切事上完全无罪
  rationale: 这是叙事人物对大卫在其手下期间表现的评价，并不必然等同于叙述者对大卫全部道德状况的神学裁定；译文不扩张其范围。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“一同出入”保留原文惯用语及军营背景；末句用“不顺眼”表达主观的不认可，并以脚注保存原文较为生硬、含义略开放的说法。
