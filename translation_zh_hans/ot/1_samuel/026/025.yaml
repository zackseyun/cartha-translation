base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/025.yaml
  text: Then Saul said to David[a], “Blessed are you, my son David. You will surely do, and you will surely prevail.” Then David went on his way, and Saul returned to his place.
translation:
  language: zh_hans
  text: 扫罗对大卫说：“我儿大卫，你是蒙福的！你必定会有所作为，也必定能够成功。[a]”于是大卫走自己的路，扫罗也回自己的地方去了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“做，你必做；能够，你必能够”。两个“不定式绝对形＋未完成式”的结构加强了对大卫日后成功的肯定。
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ אַתָּה
  choice: 愿你蒙福
  rationale: 这是直接对大卫说的祝福语。中文用“愿你蒙福”自然、庄重，也保留其祝福功能；其语法也可理解为“你是有福的”。
- source_word: בְּנִי דָוִד
  choice: 我儿大卫
  rationale: 保留扫罗带有亲属式或庇护者口吻的称呼，并使人名与称谓自然衔接。
- source_word: גַּם עָשֹׂה תַעֲשֶׂה
  choice: 你必能成就大事
  rationale: 不定式绝对形与未完成式同根连用，加强肯定语气。עָשָׂה本义为“做、行、成就”；结合后句，译作“成就大事”表达对大卫日后作为的肯定，但“大事”属于语境性补足。
- source_word: וְגַם יָכֹל תּוּכָל
  choice: 也必能得胜
  rationale: 同根强调结构直译为“能够，你必能够”；在此语境中指成功克服阻力，中文以“必能得胜”表达其结果性含义。
- source_word: וַיֵּלֶךְ דָּוִד לְדַרְכּוֹ
  choice: 于是大卫继续上路
  rationale: לְדַרְכּוֹ是希伯来语常见的离去表达；“继续上路”符合现代汉语叙事习惯。
- source_word: וְשָׁאוּל שָׁב לִמְקוֹמוֹ
  choice: 扫罗也回自己的地方去了
  rationale: 忠实保留“自己的地方”，不具体化为原文未说明的“家”或营地。
theological_decisions:
- issue: 扫罗祝福语的陈述与祈愿色彩
  choice: 愿你蒙福
  alternative: 你是有福的
  rationale: 希伯来语被动分词祝福公式兼具宣告和祝愿意味；正文采用自然的中文祝福表达，不将其解释为特殊神学宣告。
- issue: 大卫未来行动的内容
  choice: 成就大事
  alternative: 有所作为／必定去做
  rationale: 原文未明说所“做”的具体内容。“成就大事”按上下文表达成功作为，但略带解释性；不把它限定为王权、战争或其他特定使命。
translation_notes:
  register: 采用现代、庄重且口语可懂的叙事体。“我儿大卫”保留古代称呼的关系色彩；两个“必能”对应原文两组强调结构。
