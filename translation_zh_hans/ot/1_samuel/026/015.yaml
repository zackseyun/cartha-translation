base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/015.yaml
  text: David said to Abner[b][a], “Are you not a man? And who is like you in Israel? Why then have you not kept watch over your lord the king? For one of the people came to destroy the king your lord.”
translation:
  language: zh_hans
  text: 大卫对押尼珥说：“你不是男人吗？在以色列有谁能与你相比[a]？那么，你为什么没有守护你的主上，就是王呢？因为民中有一个人[b]来了，要毁灭王——你的主上。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在以色列有谁能与你相等？”
    reason: lexical_alternative
  - marker: b
    text: 直译“民中的一个人”；这里指营中的一个人。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלוֹא אִישׁ אַתָּה
  choice: 你不是男子汉吗？
  rationale: אִישׁ本义为“男人、男子”。“男子汉”保留反问中对押尼珥身份和担当的质问，但不额外加入“勇猛”等原文没有的形容。
- source_word: וּמִי כָמוֹךָ בְּיִשְׂרָאֵל
  choice: 在以色列有谁能与你相比
  rationale: כָמוֹךָ表示“像你、与你相比”。译文保留比较式反问，也自然表达无人可比的语气。
- source_word: וְלָמָּה לֹא שָׁמַרְתָּ אֶל
  choice: 那么，你为什么没有守护
  rationale: שׁמר在此指警戒并保护；“守护”兼顾看守和护卫之意。“那么”承接前面的反问。
- source_word: אֲדֹנֶיךָ הַמֶּלֶךְ
  choice: 你的主，就是王
  rationale: אֲדֹנֶיךָ表示押尼珥所服从的主上；“就是王”保留同位关系，同时符合现代汉语表达。
- source_word: כִּי בָא אַחַד הָעָם
  choice: 民中有一个人进来
  rationale: 贴近“民中的一个人”的字面结构，不擅自限定为士兵；上下文表明这是从营中来的人。
- source_word: לְהַשְׁחִית
  choice: 要毁灭
  rationale: 使役形态在此意为毁坏、消灭；语境所指最终是杀死王，但译作“毁灭”保留原词较宽的语义。
- source_word: הַמֶּלֶךְ אֲדֹנֶיךָ
  choice: 王——你的主
  rationale: 保留原文先说“王”、后说“你的主”的次序和重复所形成的责备力度；破折号使汉语同位关系清楚。
theological_decisions: []
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。反问句保留大卫公开责备押尼珥的力度；没有把“男子”扩译为“勇士”，也没有把“毁灭”直接收窄为“杀死”。脚注标记均置于所说明的词组之后。
