  rationale: 修订仅处理可安全确定的语义与脚注问题：以“来了”准确对应“来”，删除“进来”所附加的方向含义；将脚注a恢复为比较／相等的语义；以“男人”避免“男子汉”可能带入的“勇武”褒义。其余表达保留原译的句法推进、称谓重复及“毁灭”的宽泛语义。
