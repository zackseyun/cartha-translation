id: 1SA.26.11
reference: 1 Samuel 26:11
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: חָלִ֤ילָ/ה לִּ/י֙ מֵֽ/יהוָ֔ה מִ/שְּׁלֹ֥חַ יָדִ֖/י בִּ/מְשִׁ֣יחַ יְהוָ֑ה וְ֠/עַתָּה קַח נָ֨א אֶֽת הַ/חֲנִ֜ית אֲשֶׁ֧ר מראשת/ו וְ/אֶת צַפַּ֥חַת הַ/מַּ֖יִם וְ/נֵ֥לֲכָה לָּֽ/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/011.yaml
  text: Far be it from me[a], by Yahweh, to stretch out my hand against Yahweh’s anointed. But now, please take the spear that is at his head, and the jar of water[c][b], and let us go.
translation:
  language: zh_hans
  text: 愿耶和华[a]禁止我伸手攻击耶和华的受膏者[b]！现在，请你拿起他头旁的枪，以及水瓶；我们走吧。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我绝不敢……”。希伯来语这一强烈拒绝语连同“耶和华”，可表示愿耶和华禁止我这样做，也可带有援引耶和华郑重表明拒绝的意味。
    reason: 保留 מֵיְהוָה 与 חָלִילָה לִּי 连用时的语义歧义，并说明正文所采用的较直接译法。
  - marker: b
    text: “受膏者”与“弥赛亚”源自同一个希伯来词；这里特指耶和华膏立为王的扫罗。
    reason: 说明词汇联系，同时避免读者误以为本节直接把扫罗称为后来意义上的弥赛亚。
lexical_decisions:
- source_word: חָלִילָה לִּי
  choice: 我绝不敢
  rationale: 这是表达强烈拒绝或厌恶的惯用语；“我绝不敢”在现代汉语中自然有力，也符合大卫因敬畏耶和华而断然拒绝伤害扫罗的语境。
- source_word: מֵיְהוָה
  choice: 在耶和华面前
  rationale: 介词短语与前面的拒绝语连用，可表示在耶和华面前此事断不可行，也可能带有凭耶和华郑重起誓的意味；正文采用自然的汉语表达，并以脚注保留另一种理解。
- source_word: מִשְּׁלֹחַ יָדִי
  choice: 伸手攻击
  rationale: 保留“伸手”的希伯来语意象，同时用“攻击”明示这里所指的是敌对行动，而不只是一般的触碰。
- source_word: בִּמְשִׁיחַ יְהוָה
  choice: 攻击耶和华的受膏者
  rationale: 介词在这里表示敌对行动的对象；“受膏者”保留 מָשִׁיחַ 的基本词义，并准确指向受膏作王的扫罗。
- source_word: קַח נָא
  choice: 请拿走
  rationale: 命令式后的 נָא 带有请求或缓和语气；“请拿走”既自然，也符合随后离开的情境。
- source_word: אֲשֶׁר מראשתו
  choice: 他头旁的
  rationale: 表示枪放在熟睡的扫罗头部附近；“头旁”简洁清楚。
- source_word: צַפַּחַת הַמַּיִם
  choice: 水瓶
  rationale: 指盛水的小型容器；“水瓶”是现代汉语中清楚、常用的对应表达。
- source_word: וְנֵלֲכָה לָּנוּ
  choice: 我们走吧
  rationale: 第一人称复数祈愿式提出共同离开的行动；“我们走吧”自然保留了提议语气。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: “耶和华”是现代汉语圣经传统中最广为人知的专名形式，能够让普通读者清楚辨认四字神名，同时不把它改写成一般称号。
- issue: מָשִׁיחַ 在本节王权语境中的译法
  choice: 受膏者
  alternative: 弥赛亚
  rationale: 本节直接指受耶和华膏立为王的扫罗。“受膏者”既保存词义和后来的弥赛亚词汇联系，又不把扫罗直接称作末世性的“弥赛亚”。
- issue: מֵיְהוָה 与强烈拒绝语的关系
  choice: 在耶和华面前
  alternative: 凭耶和华起誓
  rationale: 希伯来语可理解为此举在耶和华面前断不可行，也可能具有援引耶和华作证的誓言色彩。正文选择较自然且不把誓言意味说死的译法，脚注说明另一可能。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“绝不敢”传达强烈拒绝，“伸手攻击”兼顾原文意象与现代可懂度；句末“我们走吧”自然呈现共同离开的提议。
