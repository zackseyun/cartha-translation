  yaml_path: translation/ot/1_samuel/026/002.yaml
  text: Then Saul arose and went down to the wilderness of Ziph[a], and with him were three thousand chosen men of Israel, to seek David in the wilderness of Ziph.
translation:
  language: zh_hans
  text: 于是，扫罗起身，下到西弗旷野，带着三千名以色列精兵，去在西弗旷野寻找大卫。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקָם
  choice: 动身
  rationale: קום的叙事性用法标志果断行动的开始；现代汉语用“动身”自然表达“起来并采取行动”，避免生硬直译为“起来”。
- source_word: וַיֵּרֶד
  choice: 下到
  rationale: 保留ירד的方向含义，同时符合现代汉语地理行程的表达。
- source_word: מִדְבַּר זִיף
  choice: 西弗旷野
  rationale: מִדְבָּר指荒野、未开垦之地，不一定是沙漠；“旷野”准确且符合圣经地名表达习惯。
- source_word: וְאִתּוֹ
  choice: 跟随他的有
  rationale: 该词表示伴随；结合军事语境译为“跟随他的有”，自然呈现希伯来语前置的伴随成分，又不额外加入具体军职。
- source_word: שְׁלֹשֶׁת אֲלָפִים אִישׁ
  choice: 三千名
  rationale: אִישׁ在汉语量词“名”中已得到自然体现，无须重复译作“三千名男子”。
- source_word: בְּחוּרֵי יִשְׂרָאֵל
  choice: 以色列精兵
  rationale: 该短语在军事语境中指从以色列人中挑选出的优秀战士；“精兵”简洁传达精选部队之意。
- source_word: לְבַקֵּשׁ
  choice: 要……搜寻
  rationale: בקש在追捕语境中表示寻找、搜寻；“搜寻”比一般的“寻找”更能体现有组织的追索，同时不擅自明确其最终意图。
- source_word: דָּוִד
  choice: 大卫
  rationale: 采用现代中文圣经通行人名译法。
