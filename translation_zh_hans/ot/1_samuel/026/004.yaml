lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: 派出
  rationale: שׁלח意为“派遣”；结合军事侦察语境，“派出”自然准确。
- source_word: מְרַגְּלִים
  choice: 侦察的人
  rationale: 该词指执行窥探、侦察任务的人；此处是军事侦察语境，这一表达比“间谍”更自然，也不过度强调政治或秘密身份。
- source_word: וַיֵּדַע
  choice: 确认
  rationale: ידע通常表示“知道”，但在派人侦察之后，此处强调大卫根据所得消息获知并确认事实；与句末נָכוֹן的确定意味合并表达。
- source_word: כִּי
  choice: （引出确认的内容）
  rationale: 此处כִּי引出大卫所确认的事实，汉语无需另译成独立词语。
- source_word: בָא
  choice: 已经来了
  rationale: 完成式表示扫罗来到是大卫确认时已经发生的事实；“已经来了”自然体现其先成性。
- source_word: אֶל נָכוֹן
  choice: 确实
  rationale: 较可能作副词性表达，增添确定、证实的意味；因其构词和句法罕见，保留其他理解于脚注。
- source_word: דָּוִד
  choice: 大卫
  rationale: 采用现代中文圣经传统通行人名。
- source_word: שָׁאוּל
  choice: 扫罗
  rationale: 采用现代中文圣经传统通行人名。
