base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/014.yaml
  text: Then David called to the troops and to Abner son of Ner, saying, “Will you not answer, Abner?” Abner answered and said, “Who are you, calling to the king?”
translation:
  language: zh_hans
  text: 大卫就向军兵和尼珥的儿子押尼珥喊道：“押尼珥，你不回答吗？”押尼珥回答说：“你是谁，竟向王呼喊？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָעָם
  choice: 军兵
  rationale: 该词通常指“百姓/众人”，但此处具体指随扫罗扎营的武装人员；译作“军兵”符合叙事情境，也避免误解为一般民众。
- source_word: וַיִּקְרָא ... אֶל
  choice: 向……喊道／向……呼喊
  rationale: 此处是大卫隔着距离高声呼叫营中的人，用“喊道/呼喊”比泛泛的“叫”更贴合场景。
- source_word: הֲלוֹא תַעֲנֶה
  choice: 你不回答吗
  rationale: 保留反问形式及责问语气，不额外补入原因。
- source_word: מִי אַתָּה קָרָאתָ אֶל הַמֶּלֶךְ
  choice: 你是谁，竟向王呼喊
  rationale: 希伯来语后半句是紧接“你是谁”的分词性/关系性表达；“竟”自然传达押尼珥对向王呼喊之人的质问语气，但不把问题具体化为身份或动机。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而口语自然的叙事体。“尼珥的儿子押尼珥”沿用中文圣经人物名的通行形式；直接引语简洁，保留原文连续回答动词所呈现的对话节奏。
