base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/013.yaml
  text: Then David crossed over to the other side and stood on the top of the mountain at a distance[a]; there was a great space between them.
translation:
  language: zh_hans
  text: 大卫走到另一边，远远地站在山顶上；他们之间相隔很远。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们之间有很大的空间。”希伯来文直译为“他们之间的空间很大”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: 渡到
  rationale: עבר在这里表示从一边越到另一边；“渡到对面”自然地保留了跨越、换到另一侧的方向感。
- source_word: הָעֵבֶר
  choice: 对面
  rationale: 带冠词的עֵבֶר指另一边或对面；结合动词译为“渡到对面”，符合现代汉语叙事习惯。
- source_word: וַיַּעֲמֹד
  choice: 站
  rationale: 采用动词的基本义，不额外加入“站定”“驻足”等带有更强意图色彩的解释。
- source_word: עַל רֹאשׁ הָהָר
  choice: 在山顶上
  rationale: רֹאשׁ在地形语境中指顶部或顶峰；הָהָר译作“山”，简洁准确。
- source_word: מֵרָחֹק
  choice: 远远地
  rationale: 表达空间上的远离；“远远地站”是自然的现代汉语，同时保留原文与营地保持距离的含义。
- source_word: רַב הַמָּקוֹם
  choice: 相隔很远
  rationale: 原文直译为“地方／空间很大”；在此指双方之间距离很大，译作“相隔很远”清楚自然，并以脚注保留较直译的表达。
- source_word: בֵּינֵיהֶם
  choice: 他们之间
  rationale: 直接标明这段距离位于大卫与营中众人之间；原文使用复数代词，译文保留“他们”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“渡到对面”呈现跨越至另一侧的动作；末句以汉语惯用表达说明距离，并用脚注保留希伯来文“地方／空间很大”的具体意象。
