  text: וְ/הִנֵּ֗ה כַּ/אֲשֶׁ֨ר גָּדְלָ֧ה נַפְשְׁ/ךָ֛ הַ/יּ֥וֹם הַ/זֶּ֖ה בְּ/עֵינָ֑/י כֵּ֣ן תִּגְדַּ֤ל נַפְשִׁ/י֙ בְּ/עֵינֵ֣י יְהוָ֔ה וְ/יַצִּלֵ֖/נִי מִ/כָּל צָרָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/024.yaml
  text: And look[a], just as your life was precious in my eyes this day, so may my life be precious in the eyes of Yahweh, and may he deliver me from all distress.
translation:
  language: zh_hans
  text: 看哪[a]，正如今天你的性命在我眼中宝贵，愿我的性命在耶和华眼中也同样宝贵，愿他救我脱离一切患难。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你今天的性命在我眼中为大……愿我的性命在耶和华眼中也为大。”希伯来语以“为大”表示受到高度重视、被看为宝贵。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 用于郑重唤起听者注意，既保留原文强调作用，也符合现代汉语中庄重的经文语体。
- source_word: כַּאֲשֶׁר ... כֵּן
  choice: 正如……也同样
  rationale: 清楚呈现原文前后两项的对应比较关系。
- source_word: גָּדְלָה ... נַפְשְׁךָ ... בְּעֵינַי
  choice: 你的性命在我眼中宝贵
  rationale: 字面是“你的性命在我眼中为大”，此处表达高度珍视；结合大卫饶扫罗性命的语境，译作“宝贵”自然准确。
- source_word: נֶפֶשׁ
  choice: 性命
  rationale: 两处均指处于危险中、可被保全或救出的生命，并非专指非物质的“灵魂”；“性命”也适合本节生死攸关的语境。
- source_word: הַיּוֹם הַזֶּה
  choice: 今天
  rationale: 自然保留原文的时间强调。
- source_word: תִּגְדַּל ... נַפְשִׁי ... בְּעֵינֵי יְהוָה
  choice: 愿我的性命在耶和华眼中也同样宝贵
  rationale: 未完成式在此表达愿望；重复“宝贵”维持与前句的对应，并保留祈愿语气。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名呈现四字神名，而不以“主”替代。
- source_word: וְיַצִּלֵנִי
  choice: 愿他救我脱离
  rationale: 使役词干在此意为搭救、解救；与前句并列，宜保留愿望或祈求语气。
- source_word: מִכָּל צָרָה
  choice: 脱离一切患难
  rationale: צָרָה泛指困苦、危难或灾患；“一切患难”保留其广泛范围和庄重语感。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名，正文以中文传统且普遍可识别的专名“耶和华”呈现，不用称号“主”取代；“雅威”是更接近学界常见拟音的可选译法。
- issue: 大卫话语的祈愿性质
  choice: 以两个“愿”明确表达愿望
  alternative: 直陈为“我的性命也必……他必救我……”
  rationale: 两个未完成式可在语境中表达愿望。译为“愿”避免把大卫的话强化成无条件的确定预言，同时保留其向神求护佑的意味。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“看哪”保留原文的郑重提示功能；“性命”贴合上下文中饶命与获救的具体处境。
