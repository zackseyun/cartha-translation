  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַֽ/יהוָה֙ יָשִׁ֣יב לָ/אִ֔ישׁ אֶת צִדְקָת֖/וֹ וְ/אֶת אֱמֻנָת֑/וֹ אֲשֶׁר֩ נְתָנְ/ךָ֨ יְהוָ֤ה הַ/יּוֹם֙ בְּ/יָ֔ד וְ/לֹ֣א אָבִ֔יתִי לִ/שְׁלֹ֥חַ יָדִ֖/י בִּ/מְשִׁ֥יחַ יְהוָֽה־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/023.yaml
  text: And Yahweh will repay each man for his righteousness and his faithfulness[a], because Yahweh gave you into my hand today[b], but I was not willing to stretch out my hand against Yahweh’s anointed.
translation:
  language: zh_hans
  text: 雅威必照各人的公义和忠信报偿他[a]；因为今天雅威把你交在我手里，我却不肯伸手加害雅威的受膏者[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作：“雅威必将各人的公义和忠信归还给他。”
    reason: 原文动词的基本意思是“使返回”，在这里可理解为按人的行为回报或报偿。
  - marker: b
    text: “雅威的受膏者”在这里指由雅威膏立为王的人，即扫罗。
    reason: 说明古代以膏立确立君王身份的文化和历史背景，避免把此称号直接理解为专指后来的弥赛亚。
lexical_decisions:
- source_word: וַיהוָה
  choice: 雅威
  rationale: 按希伯来文直接保留上帝的立约之名；句首连接词在中文中无需机械译出，以保持自然庄重。
- source_word: יָשִׁיב לָאִישׁ
  choice: 必照各人的……报偿他
  rationale: שׁוב的使役式在此表示按行为回报、报偿；לָאִישׁ具有逐一而普遍的指向，译作“各人”符合现代汉语表达。
- source_word: צִדְקָתוֹ וְאֶת אֱמֻנָתוֹ
  choice: 他的公义和忠信
  rationale: צְדָקָה在此指行为正直、公义；אֱמוּנָה指可靠、忠诚的品格与行动。“忠信”既保留忠诚之意，也与“公义”形成庄重而自然的并列。
- source_word: אֲשֶׁר נְתָנְךָ יְהוָה הַיּוֹם בְּיָד
  choice: 因为今天雅威把你交在我手里
  rationale: 关系词在此引出大卫所说的具体根据，译作“因为”使逻辑清楚；“在手里”按上下文补出第一人称“我”。
- source_word: וְלֹא אָבִיתִי
  choice: 我却不肯
  rationale: אָבָה表示愿意；否定形式是“不愿、不肯”。“却”准确表达得到机会与克制不下手之间的转折。
- source_word: לִשְׁלֹחַ יָדִי בִּמְשִׁיחַ יְהוָה
  choice: 伸手加害雅威的受膏者
  rationale: “伸手”保留希伯来语意象，“加害”明示该习语在此指采取暴力行动；מָשִׁיחַ指受雅威膏立为王的扫罗。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名，音译“雅威”保留其作为立约之名的性质，而不以称号替代。
- issue: אִישׁ的泛指范围
  choice: 各人
  alternative: 各个男人；每个人
  rationale: 希伯来文为阳性单数，但在这里具有代表性和普遍性。现代汉语“各人”自然表达逐一受报偿的普遍含义，又不额外限定为成年男性。
- issue: מְשִׁיחַ在扫罗语境中的含义
  choice: 受膏者
  alternative: 弥赛亚
  rationale: 此处是对被雅威膏立为王的扫罗的称呼，并非直接使用后来的专名式弥赛亚称号；“受膏者”保留词义及历史语境。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“报偿”“忠信”“受膏者”保留经文的伦理和王权语汇；通过“我却不肯”和“伸手加害”使句间张力及希伯来习语清楚可懂。脚注标记均置于其所解释的正文内容之后。
