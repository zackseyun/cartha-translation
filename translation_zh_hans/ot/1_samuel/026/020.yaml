  text: וְ/עַתָּ֗ה אַל יִפֹּ֤ל דָּֽמִ/י֙ אַ֔רְצָ/ה מִ/נֶּ֖גֶד פְּנֵ֣י יְהוָ֑ה כִּֽי יָצָ֞א מֶ֣לֶךְ יִשְׂרָאֵ֗ל לְ/בַקֵּשׁ֙ אֶת פַּרְעֹ֣שׁ אֶחָ֔ד כַּ/אֲשֶׁ֛ר יִרְדֹּ֥ף הַ/קֹּרֵ֖א בֶּ/הָרִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/020.yaml
  text: So now[a], do not let my blood fall to the ground away from the presence of Yahweh, for the king of Israel has come out to seek a single flea[b], as one hunts a partridge in the mountains.
translation:
  language: zh_hans
  text: 现在，求你不要让我的血流在地上，远离耶和华的面前[a]；因为以色列王竟出来寻找一只跳蚤，好像人在山中追赶一只鹧鸪一样[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“离开耶和华的面前”。这句话可能指远离耶和华的临在，也可能暗示离开以色列之地；原文的具体所指并不明确。
    reason: 说明 מִנֶּגֶד פְּנֵי יְהוָה 的空间性表达及其可能含义，同时避免将其限定为单一解释。
  - marker: b
    text: “鹧鸪”所译的希伯来词字面与“呼叫”有关，所指的确切鸟种不能完全确定。
    reason: 说明鸟名辨识上的词汇不确定性。
lexical_decisions:
- source_word: דָּמִי
  choice: 我的血
  rationale: 保留希伯来文具体的“血”这一意象，既指大卫可能遭受的暴死，也隐含流血之责；译作“我的性命”会削弱原文形象。
- source_word: אַל יִפֹּל ... אַרְצָה
  choice: 不要让……流在……地方
  rationale: 血在汉语中通常说“流”而不说“落”，如此既自然，又保留血洒于地的具体画面。
- source_word: מִנֶּגֶד פְּנֵי יְהוָה
  choice: 远离耶和华面的地方
  rationale: 保留“面”所表达的临在及空间距离感，不将其只抽象化为一般的“同在”；脚注给出较顺畅的替代译法。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的专名形式表达四字神名，而不以称号“主”替代。
- source_word: יָצָא
  choice: 出来
  rationale: 保留王亲自出动追寻的动态含义。
- source_word: לְבַקֵּשׁ
  choice: 寻找
  rationale: 采用该动词宽泛的基本义，不预先强化为“追杀”，让上下文中的讽刺意味自行显明。
- source_word: פַּרְעֹשׁ אֶחָד
  choice: 一只跳蚤
  rationale: 保留大卫自谦的比喻和 אֶחָד 所强调的微不足道。
- source_word: הַקֹּרֵא
  choice: 一只鹧鸪
  rationale: 依照此处传统且符合狩猎语境的词义处理；其确切鸟种并非完全确定，故以脚注说明。
- source_word: יִרְדֹּף ... בֶּהָרִים
  choice: 在山中追捕
  rationale: “追捕”准确传达持续追赶猎物的动作，“山中”对应复数 הָרִים，并符合自然汉语。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用以色列神的专名；正文采用现代中文圣经传统中最为人熟悉的“耶和华”，不以“主”这一称号取代神名。
- issue: “远离耶和华的面”的含义
  choice: 保留空间性与临在意味
  alternative: 在耶和华看不见的地方
  rationale: 原文可能同时涉及远离神的临在、圣地或约的疆域；不把它收窄为神视觉上的“看不见”，也不将神学张力解释掉。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“竟”凸显以色列王为追寻一只跳蚤而亲自出动的强烈反差；句末保留原文“跳蚤—山鹧鸪”连续比喻的讽刺力度。
