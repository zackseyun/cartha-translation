base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/008.yaml
  text: Then Abishai said to David[a], “God has delivered your enemy into your hand today. So now, please let me pin him to the earth with the spear in one blow[c][b], and I will not strike him a second time.”
translation:
  language: zh_hans
  text: 亚比筛对大卫说：“今天，上帝把你的仇敌交在你手里了。现在，请让我用这支矛一击把他刺穿，钉在地上；我不会再刺他第二下。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: סִגַּר
  choice: 交在……手里
  rationale: 此处该动词表示把某人交由另一人掌控；结合 בְּיָדֶךָ 译为“交在你手里”，既保留希伯来语意象，也自然表达落入其权下的意思。
- source_word: אֱלֹהִים
  choice: 上帝
  rationale: 动词为单数，语境所指是以色列的上帝；“上帝”是现代汉语中自然、庄重的译法。
- source_word: אוֹיִבְךָ
  choice: 你的仇敌
  rationale: 准确表达带第二人称阳性单数词尾的名词，也符合军事语境。
- source_word: בְּיָדֶךָ
  choice: 在你手里
  rationale: 保留原文“手”的意象，在汉语中也能自然表示处于某人的掌控之下。
- source_word: אַכֶּנּוּ נָא
  choice: 现在请让我……把他刺透
  rationale: נָא 配合意愿式表达亚比筛的请求；“请让我”自然传达这一语气。动词本义较宽泛，结合矛和地面的语境，以“刺透”具体表达这一击。
- source_word: בַּחֲנִית
  choice: 用矛
  rationale: 明确表达所用兵器；汉语在该语境中无需机械体现定冠词。
- source_word: וּבָאָרֶץ
  choice: 钉在地上
  rationale: 原文直译近于“用矛并进入地里”，描写用矛将扫罗贯穿并钉到地面的动作；此译自然清楚。
- source_word: פַּעַם אַחַת
  choice: 一下
  rationale: 这里强调一击即可；“一下”简洁自然，并与后文“第二下”形成呼应。
- source_word: וְלֹא אֶשְׁנֶה לוֹ
  choice: 我绝不用第二下
  rationale: 原文“我不对他重复”省略了重复的动作；汉语补出“第二下”，既清楚又保留其自信而简练的语气。
- source_word: וַיֹּאמֶר ... אֶל
  choice: 亚比筛对大卫说
  rationale: 现代汉语叙事中无需固定译出句首连接词，语序自然且忠实。
theological_decisions:
- issue: 扫罗陷入险境是否表明上帝赞同杀他
  choice: 保留亚比筛所说“上帝把你的仇敌交在你手里了”
  alternative: 改写为较弱的“上帝让你的仇敌落在你手里”或加入“亚比筛认为”等解释
  rationale: 原文直接记录亚比筛对上帝作为的判断，却没有在本句中认可他的杀人建议。译文不削弱神圣行动的表述，也不添加赞同或反对，从而保留叙事中的神学张力。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准普通话。“刺透，钉在地上”较直译更符合汉语表达，同时保留原文以矛一击贯穿至地面的强烈动作意象；“绝不用第二下”传达亚比筛声称一击足够的语气。
