base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/009.yaml
  text: But David said to Abishai[a], “Do not destroy him, for who can stretch out his hand against Yahweh’s anointed and remain guiltless?”
translation:
  language: zh_hans
  text: 大卫却对亚比筛说：“不可杀害他！谁能伸手攻击耶和华的受膏者[a]而不负罪责呢？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “受膏者”与后来译作“弥赛亚”的称号源自同一个希伯来词；这里指耶和华所膏立为王的扫罗。
    reason: 说明词汇关联，同时避免读者误以为本节直接称扫罗为末世性的弥赛亚。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 大卫却……说
  rationale: 叙事体中的 waw 推进情节；结合上下文，大卫是在反对亚比筛杀死扫罗的提议，因此用“却”自然表达转折。
- source_word: אַל תַּשְׁחִיתֵהוּ
  choice: 不可杀害他
  rationale: שׁחת 的使役式可指毁坏或毁灭；这里直接回应致命一击的提议，用“杀害”符合语境，也比“毁灭他”更自然。
- source_word: שָׁלַח יָדוֹ
  choice: 伸手攻击
  rationale: 保留“伸手”这一希伯来语意象，同时补出该习语在本句中针对某人采取暴力行动的含义。
- source_word: בִּמְשִׁיחַ יְהוָה
  choice: 攻击耶和华的受膏者
  rationale: 介词 ב 在“伸手”习语中表示敌对的对象；מָשִׁיחַ 在此指耶和华所膏立的君王扫罗，译作“受膏者”既符合历史语境，也保留其词汇关联。
- source_word: וְנִקָּה
  choice: 还能不被定罪呢
  rationale: נקה 表示免于罪责或责任。中文反问句用“不被定罪”自然传达不可能无罪免责的意思，同时不将含义缩窄为仅仅逃过惩罚。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉且庄重的形式音译神的专名 YHWH。
theological_decisions:
- issue: מְשִׁיחַ 在扫罗身上的译法
  choice: 耶和华的受膏者
  alternative: 耶和华的弥赛亚
  rationale: 本句所指是受耶和华膏立为王的扫罗，并非直接使用后来的末世性称号；“受膏者”保留原词含义而不提前导入不属于本处的基督论结论。词根与“弥赛亚”的关联由脚注说明。
- issue: וְנִקָּה 所表达的是罪责还是惩罚
  choice: 不被定罪
  alternative: 不受惩罚
  rationale: 原词首先涉及无罪、免除罪责或责任，也可能连带含有免受惩罚之意；正文保留罪责层面的重点，不把含义限定为现实后果。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“不可杀害他”比直译为“不可毁灭他”更符合普通话搭配；反问句以“还能……呢”呈现原文强烈的道德否定。脚注标记置于实际需要解释的“受膏者”之后。
