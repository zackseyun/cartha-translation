  naturalness: 正文庄重自然，人物译名也合乎常用圣经汉语。将“谁愿意跟我下到”改为“谁跟我一同下到”既更贴近原文，也自然。为保留原文两个“到”的形式，正文可保留“到扫罗那里、到营中去”；脚注则以自然汉语说明其惯常理解。
  terminology: “赫人”“亚希米勒”“洗鲁雅”“约押”“亚比筛”“营”均可接受；“营”在此足以表示军营／营地。无需神学性调整。
