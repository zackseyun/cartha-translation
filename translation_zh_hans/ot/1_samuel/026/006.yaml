base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/006.yaml
  text: Then David answered and said to Ahimelech the Hittite and to Abishai son of Zeruiah[a], Joab’s brother, “Who will go down with me to Saul, to the camp?” And Abishai said, “I will go down with you.”
translation:
  language: zh_hans
  text: 大卫回答赫人亚希米勒和洗鲁雅的儿子、约押的兄弟亚比筛说：“谁跟我一同下到扫罗那里、到营中去[a]？”亚比筛说：“我跟你一同下去。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可按汉语习惯译作：“谁跟我一同下到扫罗所在的营中去？”原文在“扫罗”和“营”前都重复使用“到”。
    reason: 说明原文重复介词的结构，并提供语义明确、符合现代汉语语序的替代读法。
lexical_decisions:
- source_word: וַיַּעַן דָּוִד וַיֹּאמֶר
  choice: 大卫就开口……说
  rationale: 希伯来语直译为“大卫回答说”，是常见的叙事引语公式；本节没有明说先前有人向大卫发问，因此用现代汉语自然的“开口……说”，既引出发言，也避免凭空增添“回答某人”的意味。
- source_word: אֲחִימֶלֶךְ הַחִתִּי
  choice: 赫人亚希米勒
  rationale: 音译人名，族称译为“赫人”，符合现代中文圣经人名与族名的常用表达。
- source_word: אֲבִישַׁי בֶּן צְרוּיָה אֲחִי יוֹאָב
  choice: 洗鲁雅的儿子、约押的兄弟亚比筛
  rationale: 保留原文两层亲属身份说明，并依汉语习惯把身份置于姓名之前；顿号清楚连接两个同位说明。
- source_word: מִי יֵרֵד אִתִּי
  choice: 谁愿意跟我下到
  rationale: יֵרֵד表达向下行进，译为“下到”保留方向感；疑问在语境中是征求同行者，加入“愿意”使现代汉语自然，并未改变自愿响应的语用含义。
- source_word: אֶל שָׁאוּל אֶל הַמַּחֲנֶה
  choice: 到扫罗那里，到营中去
  rationale: 保留原文在“扫罗”和“营”前重复使用的אֶל，呈现目的地与所在营地之间略显并列、但可理解的结构；脚注提供更顺畅的汉语读法。
- source_word: הַמַּחֲנֶה
  choice: 营
  rationale: מַחֲנֶה在此指军队驻扎的营地；“营”简洁自然，并与叙事场景相符。
- source_word: אֲנִי אֵרֵד עִמָּךְ
  choice: 我愿意跟你下去
  rationale: 重复“下”以呼应大卫的问题；在回应中用“愿意”自然表达亚比筛主动应允同行。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。人名使用简体中文圣经中通行的译名；主句避免生硬照搬希伯来语“回答说”的公式，但问题与回应中的“下”保持一致。
