  text: וַ/יֹּאמֶר֩ שָׁא֨וּל חָטָ֜אתִי שׁ֣וּב בְּנִֽ/י דָוִ֗ד כִּ֠י לֹֽא אָרַ֤ע לְ/ךָ֙ ע֔וֹד תַּ֠חַת אֲשֶׁ֨ר יָקְרָ֥ה נַפְשִׁ֛/י בְּ/עֵינֶ֖י/ךָ הַ/יּ֣וֹם הַ/זֶּ֑ה הִנֵּ֥ה הִסְכַּ֛לְתִּי וָ/אֶשְׁגֶּ֖ה הַרְבֵּ֥ה מְאֹֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/021.yaml
  text: Then Saul said[a], “I have sinned. Return, my son David, for I will not harm you again, because my life was precious in your eyes this day. Look[b], I have acted foolishly and have gone badly astray.”
translation:
  language: zh_hans
  text: 扫罗说：“我有罪了。回来吧，我儿大卫！我再也不伤害你了，因为今天你珍视我的性命[a]。看哪，我行事愚昧，我实在错得太厉害了[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “我的性命”也可译作“我的生命”或“我本人”。原文用נֶפֶשׁ，这里指扫罗被大卫饶过的性命或本人。
    reason: lexical_alternative
  - marker: b
    text: “我实在错得太厉害了”也可译作“我实在大大偏离了正路”。
    reason: lexical_alternative
lexical_decisions:
- source_word: חָטָאתִי
  choice: 我有罪了
  rationale: 直译其认罪含义，并用现代汉语完成体表达当下的承认。
- source_word: שׁוּב
  choice: 回来吧
  rationale: 保留命令语气；“回来”在现代汉语中比“归回”更自然，且不额外限定返回的地点。
- source_word: בְּנִי דָוִד
  choice: 我儿大卫
  rationale: 保留关系称谓和专名，也符合庄重的叙事语体。
- source_word: לֹא אָרַע לְךָ עוֹד
  choice: 我再也不伤害你了
  rationale: 该使役形式在此表示加害；译法自然，并保留将来的承诺。
- source_word: תַּחַת אֲשֶׁר
  choice: 因为
  rationale: 本处引出扫罗作出承诺的原因。
- source_word: יָקְרָה נַפְשִׁי בְּעֵינֶיךָ
  choice: 你看重我的性命
  rationale: 叙事背景是大卫饶了扫罗的性命；נֶפֶשׁ在这里具体指生命或本人。“看重”自然表达“在你眼中宝贵”的习语意义。
- source_word: הַיּוֹם הַזֶּה
  choice: 今天
  rationale: 准确而自然地表达希伯来语指示性时间短语。
- source_word: הִנֵּה
  choice: 看哪
  rationale: 作为引人注意的语篇标记，保留其郑重语气；虽略具经文色彩，在现代中文中仍清楚可懂。
- source_word: הִסְכַּלְתִּי
  choice: 我行事愚昧
  rationale: 表达的是行为愚昧，而非单纯智力不足。
- source_word: וָאֶשְׁגֶּה הַרְבֵּה מְאֹד
  choice: 实在大大错了
  rationale: שגה可指犯错或走迷；汉语中“大大错了”保留强烈程度，也比生硬的“极其走迷”自然。脚注保留“偏离正路”的可能意象。
theological_decisions:
- issue: נֶפֶשׁ在扫罗认错中的含义
  choice: 译为“性命”
  alternative: “生命”或“本人”
  rationale: 大卫在本段叙事中饶了扫罗的肉身性命，因此这里不是在界定灵魂的性质；“性命”准确承载具体语境。
- issue: שגה的错误/偏离意象
  choice: 正文译为“错了”
  alternative: “大大偏离了正路”
  rationale: 原词可表达犯错或迷失、偏离；正文采用自然汉语，不把隐喻解释得过实，同时用脚注保存另一种可能表达。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。称呼“我儿大卫”保留关系意味；“看哪”保留原文提示听者注意的郑重语气。所有脚注标记均已置于正文对应位置。
