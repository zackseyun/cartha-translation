base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/003.yaml
  text: And Saul camped on the hill of Hachilah[a], which is opposite Jeshimon, by the road. But David was staying in the wilderness, and he saw that Saul had come after him into the wilderness.
translation:
  language: zh_hans
  text: 扫罗在路旁、面对耶示门[a]的哈基拉山上安营。大卫住在旷野；他得知扫罗来到旷野追赶他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “耶示门”也可按普通名词理解为“荒地”或“旷野”。
    reason: 原文הַיְשִׁימֹן可理解为地名，也可理解为普通名词；正文保留地名用法，脚注保留词义歧义。
lexical_decisions:
- source_word: וַיִּחַן
  choice: 安营
  rationale: חנה在军事与行旅语境中指扎营；“安营”自然、简洁，并保留具体动作。
- source_word: בְּגִבְעַת הַחֲכִילָה
  choice: 在哈基拉山上
  rationale: גִּבְעָה意为山丘，חֲכִילָה为地名；译出普通名词并音译专名，符合汉语地名表达。
- source_word: אֲשֶׁר עַל פְּנֵי הַיְשִׁימֹן
  choice: 旷野对面
  rationale: עַל־פְּנֵי在此表示面对或在对面；הַיְשִׁימֹן可作地名，也可作普通名词“荒地、旷野”。正文采用自然的普通名词译法，并以脚注保留专名可能。
- source_word: עַל הַדָּרֶךְ
  choice: 靠路的地方
  rationale: 此处עַל表示临近；“靠路的地方”避免误解为营地直接设在路面上。
- source_word: יֹשֵׁב
  choice: 住
  rationale: ישב的分词在地点叙述中表示居留或停留；“住”简明自然，并体现持续状态。
- source_word: בַּמִּדְבָּר
  choice: 在旷野
  rationale: מִדְבָּר通常指荒僻、少人居住之地，不必特指沙漠；“旷野”较准确。
- source_word: וַיַּרְא כִּי בָא שָׁאוּל אַחֲרָיו
  choice: 他看出扫罗已经……来找他
  rationale: ראה כי表示看见或察知某事；בוא保留“来”的移动含义，אַחֲרָיו在此具有追随、追赶的语境色彩。“来找他”表达敌对追踪而不过度技术化。
- source_word: הַמִּדְבָּרָה
  choice: 追到旷野来
  rationale: 词尾方向性-ה表示朝向旷野的移动；结合汉语语序译作“追到旷野来”，体现进入或来到该区域。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。保留前后两个“旷野”的地理关联；用分号区分扫罗安营与大卫所在之处。脚注标记[a]已置于正文相应词后。
