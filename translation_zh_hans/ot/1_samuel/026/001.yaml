base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/001.yaml
  text: Then the Ziphites came to Saul at Gibeah[a], saying, “Is not David hiding on the hill of Hachilah, which is before the wasteland?”
translation:
  language: zh_hans
  text: 西弗人到基比亚去见扫罗，说：“大卫不是藏在位于荒原前面[a]的哈基拉山上吗？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“位于耶示门前面”或“位于荒原对面”。希伯来语中的这个地理表述既可把“耶示门”理解为地域名称，也可把它理解为“荒原、旷野”这一普通名词。
    reason: 保留 עַל־פְּנֵי 的空间关系及 הַיְשִׁימֹן 是普通名词还是地名的词义歧义。
lexical_decisions:
- source_word: וַיָּבֹאוּ הַזִּפִים
  choice: 西弗人……去见
  rationale: וַיָּבֹאוּ 推进叙事，基本义为“来、到”；结合扫罗在基比亚这一目的地，用“到基比亚去见扫罗”自然表达趋向。הַזִּפִים 指西弗的居民，译作“西弗人”。
- source_word: הַגִּבְעָתָה
  choice: 到基比亚
  rationale: 地名后的方向词尾 ה 表示朝向基比亚；译文保留这一移动方向，而不只把基比亚处理为静态地点。
- source_word: הֲלוֹא
  choice: 不是……吗
  rationale: 该疑问词引出预期得到肯定回答的反问；现代汉语“不是……吗”既自然，也保留原文的修辞力量。
- source_word: מִסְתַּתֵּר
  choice: 藏
  rationale: סתר 的 Hitpael 分词表示使自己处于隐蔽状态；“藏”简洁自然，并保留持续躲藏的语境意义。
- source_word: בְּגִבְעַת הַחֲכִילָה
  choice: 在哈基拉山上
  rationale: גִּבְעָה 通常指小山、山冈；介词 בְּ 在此表示所在位置，故译为“在……山上”。
- source_word: עַל פְּנֵי הַיְשִׁימֹן
  choice: 就在荒原前面
  rationale: עַל פְּנֵי 的空间关系可指“在……前面、对面”，不宜无明文依据限定为“东面”。הַיְשִׁימֹן 既可按普通名词理解为荒芜之地，也可能作为地域名称；正文采用易懂的普通名词义，并以脚注保留其他可能。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“到基比亚去见扫罗”明确表达原文的移动方向；引语用自然的反问句式。脚注标记紧随存在词义和地理关系歧义的短语，避免误指“基比亚”。
