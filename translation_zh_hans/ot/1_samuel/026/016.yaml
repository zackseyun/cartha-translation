  text: לֹא ט֞וֹב הַ/דָּבָ֣ר הַ/זֶּה֮ אֲשֶׁ֣ר עָשִׂיתָ֒ חַי יְהוָ֗ה כִּ֤י בְנֵי מָ֨וֶת֙ אַתֶּ֔ם אֲשֶׁ֧ר לֹֽא שְׁמַרְתֶּ֛ם עַל אֲדֹנֵי/כֶ֖ם עַל מְשִׁ֣יחַ יְהוָ֑ה וְ/עַתָּ֣ה רְאֵ֗ה אֵֽי חֲנִ֥ית הַ/מֶּ֛לֶךְ וְ/אֶת צַפַּ֥חַת הַ/מַּ֖יִם אֲשֶׁ֥ר מראשת/ו־־־־־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/016.yaml
  text: This thing that you have done is not good. As Yahweh lives[a], you are sons of death, because you did not keep watch over your master, over Yahweh’s anointed. And now, look—where are the king’s spear and the water jar that were by his head?
translation:
  language: zh_hans
  text: 你做的这事不好。雅威活着，我起誓：你们都该受死刑，因为你们没有守护你们的主人——雅威的受膏者。现在你看看，王的枪和那原在他头旁的水罐在哪里？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֹא טוֹב הַדָּבָר הַזֶּה אֲשֶׁר עָשִׂיתָ
  choice: 你做的这事不好
  rationale: 保留“不好”这一直接评价，不强化为“邪恶”；“你”为单数，与希伯来文对押尼珥的直接责问一致。
- source_word: חַי יְהוָה
  choice: 我指着永活的雅威起誓
  rationale: 这是希伯来语庄严的起誓公式；译文明确其语用功能，同时保留“雅威永活”的内容。
- source_word: בְנֵי מָוֶת אַתֶּם
  choice: 你们都是该死的人
  rationale: 该习语直译为“死亡之子”，在本语境表示应受死刑或罪该致死；正文采用现代汉语中自然且有司法严肃感的表达，并以脚注保留字面形式。
- source_word: שְׁמַרְתֶּם עַל
  choice: 守护
  rationale: 这里指军士未尽警戒和保护之责；“守护”兼顾看守与保护。
- source_word: אֲדֹנֵיכֶם
  choice: 你们的主人
  rationale: 所指是作为众人上级的扫罗，不是神圣称号；“主人”也避免与雅威混淆。
- source_word: מְשִׁיחַ יְהוָה
  choice: 雅威的受膏者
  rationale: 保留君王受膏身份的宗教和王权含义，不把此处直接解释为后来的专称“弥赛亚”。
- source_word: חֲנִית הַמֶּלֶךְ
  choice: 王的枪
  rationale: חֲנִית在本叙事中指扫罗的长枪；“王的枪”简明自然。
- source_word: צַפַּחַת הַמַּיִם אֲשֶׁר מראשתו
  choice: 原来在他头旁的水罐
  rationale: 表达水罐先前放在王头旁这一位置关系；“原来”符合物品已经被取走的叙事情境。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 按希伯来文直接呈现四字神名，并采用现代汉语常见的学术音译“雅威”。
- issue: מְשִׁיחַ יְהוָה 在王权语境中的含义
  choice: 雅威的受膏者
  alternative: 雅威所膏立的；雅威的弥赛亚
  rationale: “受膏者”既保留希伯来语的王权—圣礼称号，也不把扫罗与后来作为专称的“弥赛亚”混同。
- issue: בְנֵי מָוֶת 的司法力度
  choice: 该死的人
  alternative: 死亡之子；必死的人
  rationale: 上下文是对失职卫士应受死刑的严厉宣告；“该死的人”表达应受死亡惩罚，而“必死的人”可能只被理解为凡人皆会死亡。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。保留原文从单数“你”（押尼珥）转为复数“你们”（全体卫士）的变化，并用破折号表现“你们的主人”与“雅威的受膏者”之间的同位关系。
