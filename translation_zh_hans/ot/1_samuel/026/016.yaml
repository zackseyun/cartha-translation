review_pass:
  verdict: revise
  source_fidelity: “我指着永活的雅威起誓”虽能传达起誓功能，却在希伯来文“雅威活着”（常用起誓公式）之外补出了第一人称“我”，且“永活的”在此不如直接保留公式自然。“该死的人”在现代汉语中也常作咒骂语，司法上的“应受死刑”含义不够明确。其余人称由单数“你”转为复数“你们”、以及“雅威的受膏者”等均与原文相符。
  naturalness: 修订后以“雅威活着，我起誓”表达庄严而自然的汉语誓言公式；“你们都该受死刑”明确、庄重，也避免“该死的人”的口语咒骂色彩。“那原在他头旁的水罐”清楚表达该器皿先前所在的位置。
  terminology: “雅威”一致对应 יהוה；“受膏者”恰当保留 מְשִׁיחַ 的王权—宗教语境，未预设后来的专称含义。“主人”可对应对扫罗的 אֲדֹנֵיכֶם；“枪”可对应 חֲנִית。
  issues:
  - severity: medium
    issue: 起誓公式补入了原文未明说的第一人称，并使用“永活的雅威”这一较不贴合本处惯用语的表达。
    rationale: חַי־יהוה 字面为“雅威活着”，是庄严的起誓公式。汉语可用“雅威活着，我起誓”自然表达其功能，同时更贴近原文。
  - severity: medium
    issue: “该死的人”可能被理解为咒骂，而非失职卫士依法应受死刑。
    rationale: בְנֵי מָוֶת 是“死亡之子”的习语，意为应受死刑／当死；正文宜明确其司法力度，脚注保留字面形式。
  revised_text: 你做的这事不好。雅威活着，我起誓：你们都该受死刑，因为你们没有守护你们的主人——雅威的受膏者。现在你看看，王的枪和那原在他头旁的水罐在哪里？
