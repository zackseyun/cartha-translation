base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/007.yaml
  text: So David and Abishai came to the troops by night[a], and behold, Saul was lying asleep within the encampment, with his spear stuck in the ground at his head, and Abner and the troops were lying around him.
translation:
  language: zh_hans
  text: 大卫和亚比筛夜间来到军兵那里。看哪，扫罗正躺在营地[a]内熟睡；他的矛插在他头旁的地上，押尼珥和军兵躺卧在他四周。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“营圈中”；希伯来语可能指军营的环形布置。
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעָם
  choice: 军兵
  rationale: 本节是军事场景，所指是扫罗带领的武装人员，而非泛指百姓；“军兵”也适合本节两次出现之处。
- source_word: לַיְלָה
  choice: 夜间
  rationale: 作时间状语，简洁自然地表达事情发生在夜里。
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留希伯来叙事中引人注意、呈现眼前景象的语气。
- source_word: שֹׁכֵב יָשֵׁן
  choice: 正躺着熟睡
  rationale: 同时表达扫罗躺卧的姿势和睡眠状态；正文依汉语语序作“正躺在……熟睡”。
- source_word: בַּמַּעְגָּל
  choice: 在营圈内
  rationale: מַעְגָּל在此可能指军营的环形布置或由此围成的营地；“营圈”既保留形象，又符合军事语境。
- source_word: חֲנִיתוֹ
  choice: 他的矛
  rationale: “矛”是现代汉语中自然、准确的长柄刺兵器名称，也符合扫罗叙事中的用词。
- source_word: מְעוּכָה בָאָרֶץ
  choice: 插在地上
  rationale: 该分词表示矛被压入或扎入地面；“插在地上”自然地传达其固定状态。
- source_word: מראשתו
  choice: 在他头旁
  rationale: 该形式惯指一个人头部所在的位置；“头旁”比直译复数形式更符合现代汉语。
- source_word: סביבתו
  choice: 在他四周
  rationale: 准确表达押尼珥和军兵围绕扫罗躺卧的空间关系。
theological_decisions: []
