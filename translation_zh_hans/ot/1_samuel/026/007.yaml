  register: 采用庄重而通顺的现代标准汉语。“看哪”保留原文叙事的现场感；“营圈”配合脚注保留מַעְגָּל的具体意象及其一定程度的词义不确定性。脚注标记置于它实际说明的“营圈”之后。
