base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/022.yaml
  text: David answered and said[a], “Here is the king’s spear[b]. Let one of the young men come over and take it.”
translation:
  language: zh_hans
  text: 大卫回答说：“王的枪在这里。让一个年轻人[a]过来[b]拿走吧。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “年轻人”也可译作“仆人”或“侍从”；希伯来语这个词可指年龄，也可指从属身份，须按上下文判断。
    reason: lexical_alternative
  - marker: b
    text: “过来”也可译作“越过来”；希伯来语动词本义是“经过、越过”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן דָּוִד וַיֹּאמֶר
  choice: 大卫回答说
  rationale: 保留希伯来叙事中“回答”和“说”两个动词，同时按现代汉语习惯紧凑表达。
- source_word: הִנֵּה
  choice: 在这里
  rationale: 该指示词唤起听者注意眼前之物；结合存在句译作“王的枪在这里”，自然且保留指示意味。
- source_word: הַחֲנִית הַמֶּלֶךְ
  choice: 王的枪
  rationale: חֲנִית指枪、矛一类的刺击兵器；“枪”符合本叙事中的惯常称呼，所属关系译为自然的汉语领属结构。
- source_word: וְיַעֲבֹר
  choice: 过来
  rationale: עבר本义是经过、越过；此处是叫扫罗一方的人到大卫这边取枪，“过来”符合说话方位，也保留移动到另一边的语境。
- source_word: אֶחָד מֵהַנְּעָרִים
  choice: 一个年轻人
  rationale: אֶחָד明确表示其中一个；נַעַר既可按年龄理解为年轻人，也可按从属身份指仆人或侍从，正文采用较少限定身份的“年轻人”。
- source_word: וְיִקָּחֶהָ
  choice: 拿走吧
  rationale: לקח意为拿、取，阴性宾语后缀回指“枪”；“拿走”贴合对方前来取回枪的场景，句末“吧”自然表达第三人称祈使语气。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“王的枪在这里”比“看哪”更自然地传达 הִנֵּה 的现场指示作用；脚注分别保留 נַעַר 的身份歧义和 עבר 的空间移动含义。
