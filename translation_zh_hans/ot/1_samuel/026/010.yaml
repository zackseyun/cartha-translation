  text: וַ/יֹּ֤אמֶר דָּוִד֙ חַי יְהוָ֔ה כִּ֥י אִם יְהוָ֖ה יִגָּפֶ֑/נּוּ אֽוֹ יוֹמ֤/וֹ יָבוֹא֙ וָ/מֵ֔ת א֧וֹ בַ/מִּלְחָמָ֛ה יֵרֵ֖ד וְ/נִסְפָּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/010.yaml
  text: And David said[a], “As Yahweh lives, surely Yahweh will strike him, or his day will come to die[c][b], or he will go down into battle and perish.”
translation:
  language: zh_hans
  text: 大卫说：“我指着永活的雅威起誓：雅威必击打他[a]；或是他的日子来到，他就死去[b]；或是他下到战场，便灭亡[c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “击打他”也可译作“使他遭灾”或按语境译作“击杀他”；原词没有说明具体方式。
    reason: lexical_alternative
  - marker: b
    text: 直译：“他的日子来到，他就死去。”这里的“日子”指他死亡的时候。
    reason: idiom_clarification
  - marker: c
    text: “灭亡”也可译作“被除灭”或“丧命”。
    reason: lexical_alternative
lexical_decisions:
- source_word: חַי יְהוָה
  choice: 我指着永活的雅威起誓
  rationale: 这是希伯来语庄严的起誓套语。中文明确补出“起誓”，自然传达其言语功能；“永活的雅威”保留以神的生命为誓的内容。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按辅音神名 יהוה 音译，保留以色列之神的专名，不以称号替代。
- source_word: כִּי אִם
  choice: 必
  rationale: 在起誓语境中表达强烈断言；中文用“必”简洁呈现其确定、强调的语气，而不误解为单纯的例外条件。
- source_word: יִגָּפֶנּוּ
  choice: 必亲自击打他
  rationale: נָגַף 表示施以打击，也可在语境中产生致命后果。“击打”保留行动方式的开放性；“亲自”体现动词所带宾语后缀与明确主语形成的强调，但不把具体死法说死。
- source_word: יוֹמוֹ יָבוֹא וָמֵת
  choice: 他的死期来到，他便死去
  rationale: 字面意象是“他的日子来到，而他死去”。译作“死期”使现代读者明白这是死亡之日，同时保留时候来到的表达。
- source_word: בַמִּלְחָמָה יֵרֵד
  choice: 他下到战场
  rationale: 保留 יָרַד“下去”的空间或军事行进措辞，不擅自改成单纯“参战”。
- source_word: וְנִסְפָּה
  choice: 葬身其中
  rationale: ספה 在这里指在战事中被除灭、丧命。“葬身其中”是自然中文，并与前面的普通“死去”保持措辞区别。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。音译“雅威”保留专名性质，避免以称号替代，也不依赖较晚形成的混合读音。
- issue: 扫罗死亡的三种表述及神的主权
  choice: 保留三个并列可能：雅威击打、死期来到、战场丧命
  alternative: 把三者合并解释为雅威必以其中一种方式处死扫罗
  rationale: 原文列出三个“或”项，第一项明确以雅威为主语，后两项则以扫罗的死期和战场遭遇来表述。译文不额外判定三者在神学因果上如何彼此关联。
translation_notes:
  register: 采用庄重而易懂的现代标准普通话。“我指着永活的雅威起誓”自然呈现希伯来誓言公式；分号清楚区分三种并列结局。保留“下到战场”的原文方向动词，并用“死去／葬身其中”体现 מות 与 ספה 的词汇差异。
