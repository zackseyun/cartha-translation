  rationale: 删去原文未见的“又”与“亲自”。将“死期”恢复为“日子”，以保留希伯来习语的表层表达，并以脚注说明其语境含义。将“葬身其中”改为“灭亡”，较直接对应וְנִסְפָּה，且不添加“其中”所暗示的指代关系。
