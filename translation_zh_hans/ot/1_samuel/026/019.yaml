  terminology: “耶和华”准确对应神名；“我主我王”保留对扫罗的非神性宫廷尊称；“祭物”和“产业”维持献祭及盟约归属的语义。脚注b将“耶和华所得的”修正为“属耶和华的”，避免暗示原文没有表达的‘取得’意义。
