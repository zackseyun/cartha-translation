source:
  edition: WLC
  text: וְ/עַתָּ֗ה יִֽשְׁמַֽע נָא֙ אֲדֹנִ֣/י הַ/מֶּ֔לֶךְ אֵ֖ת דִּבְרֵ֣י עַבְדּ֑/וֹ אִם יְהוָ֞ה הֱסִֽיתְ/ךָ֥ בִ/י֙ יָרַ֣ח מִנְחָ֔ה וְ/אִ֣ם בְּנֵ֣י הָ/אָדָ֗ם אֲרוּרִ֥ים הֵם֙ לִ/פְנֵ֣י יְהוָ֔ה כִּֽי גֵרְשׁ֣וּ/נִי הַ/יּ֗וֹם מֵ/הִסְתַּפֵּ֜חַ בְּ/נַחֲלַ֤ת יְהוָה֙ לֵ/אמֹ֔ר לֵ֥ךְ עֲבֹ֖ד אֱלֹהִ֥ים אֲחֵרִֽים־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/019.yaml
  text: And now[a], please let my lord the king hear the words of his servant. If Yahweh has stirred you up against me, may he accept an offering; but if it is men, they are cursed before Yahweh, because they have driven me out today from having a share in Yahweh’s inheritance, saying, ‘Go[b], serve other gods.’
translation:
  language: zh_hans
  text: “现在，请我主我王听仆人的话。若是耶和华激动你与我作对，愿他悦纳祭物[a]；若是人所为，他们在耶和华面前是受咒诅的，因为他们今日把我赶出去，不让我在耶和华的产业中有分[b]，说：‘你去事奉别的神吧！’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“愿他闻祭物”；这是表示神接受祭物或礼物的用语。
    reason: lexical_alternative
  - marker: b
    text: 或译“不让我依附于耶和华的产业”。原文可强调归附或被接纳在属耶和华的土地和子民之中。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: 现在
  rationale: 作为话语转换语，引出大卫接下来的恳求；现代汉语用“现在”自然清楚，连接作用由上下文体现。
- source_word: יִשְׁמַע נָא
  choice: 请……听
  rationale: 祈愿式配合语气词 נָא，表达恭敬的请求，并非生硬命令。
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: 我主我王
  rationale: 保留大卫对扫罗的宫廷式尊称；此处“主”指君王，不指神。
- source_word: דִּבְרֵי עַבְדּוֹ
  choice: 仆人的话
  rationale: 保留大卫以“仆人”自称的谦卑语气；汉语无需机械复现第三人称所有格。
- source_word: אִם יְהוָה הֱסִיתְךָ בִי
  choice: 若是耶和华激动你攻击我
  rationale: הסית 表示促使、激动或煽动；“激动……攻击”保留使役意味，又不预先判定其中的道德责任。
- source_word: יָרַח מִנְחָה
  choice: 愿他悦纳祭物
  rationale: 原文直译为“愿他闻祭物”，是表示接受祭物的献祭用语；正文以自然汉语传达其功能，直译保留在脚注。
- source_word: וְאִם בְּנֵי הָאָדָם
  choice: 若是人
  rationale: 与前句的耶和华形成对照，指人的因素或人的作为；简洁保留原文条件句。
- source_word: אֲרוּרִים הֵם לִפְנֵי יְהוָה
  choice: 他们在耶和华面前是受咒诅的
  rationale: 按原文谓语形容词结构译作陈述，而不是改成祈愿；“在耶和华面前”保留审判和盟约层面的意味。
- source_word: גֵרְשׁוּנִי
  choice: 他们……把我赶出去
  rationale: 表达被强行排斥、驱逐的处境。
- source_word: מֵהִסְתַּפֵּחַ בְּנַחֲלַת יְהוָה
  choice: 不让我在耶和华的产业中有分
  rationale: 自然表达大卫被排除在耶和华所赐的土地及其子民群体之外，同时保留“产业”的广泛盟约含义。
- source_word: לֵאמֹר לֵךְ עֲבֹד אֱלֹהִים אֲחֵרִים
  choice: 说：‘你去事奉别的神吧！’
  rationale: 保留原文引语形式；这里的话也可表达那些人行动所造成的实际后果。
theological_decisions:
- issue: 耶和华激动扫罗攻击大卫与人的责任之间的关系
  choice: 保留“若是耶和华激动你”的条件陈述
  alternative: 解释为耶和华直接促使，或仅仅许可扫罗如此行
  rationale: 原文没有说明神的主权与人的责任如何协调；译文不替经文消解这一张力。
- issue: “耶和华的产业”的范围
  choice: 保留“产业”，并译为“在……中有分”
  alternative: 仅解释为以色列土地，或仅解释为参与敬拜的群体
  rationale: 此语兼具土地、子民和盟约归属的意味，不宜在正文中缩窄为单一层面。
- issue: 被赶逐等同于叫大卫事奉别神
  choice: 保留直接引语，不把它改写成大卫已经改信别神
  alternative: 理解为实际命令，或理解为驱逐行为所传达的效果
  rationale: לֵאמֹר 可引出言语，也可说明行为所表达的含义；译文保留其修辞力度和一定的开放性。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“我主我王”保留宫廷式敬语；“悦纳祭物”和“在……产业中有分”兼顾自然表达与原文的献祭、盟约意涵。脚注标记均置于正文相关词组之后。
