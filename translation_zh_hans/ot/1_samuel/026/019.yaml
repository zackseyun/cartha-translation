revisions:
- from: “现在，请我主我王听仆人的话。若是耶和华激动你攻击我，愿他悦纳祭物[a]；若是人，他们在耶和华面前是受咒诅的，因为他们今日把我赶出去，不让我在耶和华的产业中有分[b]，说：‘你去事奉别的神吧！’”
  to: “现在，请我主我王听仆人的话。若是耶和华激动你与我作对，愿他悦纳祭物[a]；若是人所为，他们在耶和华面前是受咒诅的，因为他们今日把我赶出去，不让我在耶和华的产业中有分[b]，说：‘你去事奉别的神吧！’”
  rationale: 仅作两项安全修订：以“与我作对”避免把原文广义的敌对关系限定为“攻击”，并在脚注b以“属耶和华的”准确表达产业的归属。将“若是人”调整为“若是人所为”，使汉语条件分句更完整，同时保持原文与耶和华作为行动者的对照。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T05:27:33Z'
