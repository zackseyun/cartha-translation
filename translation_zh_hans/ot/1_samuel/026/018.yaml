base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/018.yaml
  text: And he said[a], “Why is my lord pursuing his servant like this? For what have I done[b], and what evil is in my hand?”
translation:
  language: zh_hans
  text: 他说：“我主为什么这样追赶他的仆人[a]呢？我究竟做了什么？我手中又有什么恶事[b]呢？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文作“他的仆人”。在直接称呼中通常会说“你的仆人”，有些译本据此作了顺译；马所拉文本则为第三人称形式。
    reason: alternative_reading
  - marker: b
    text: “在手中”是希伯来语表达，可指一个人应负的罪责、作恶的意图，或施害的能力。
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 他又说
  rationale: 叙事性连续式引出接下来的话；“又说”自然承接上文，同时不额外强化时间先后。
- source_word: לָמָּה זֶּה
  choice: 为什么这样
  rationale: 保留原文带强调意味的“为什么如此”，并采用现代汉语自然表达。
- source_word: אֲדֹנִי
  choice: 我主
  rationale: 这是大卫对作为人间尊长的扫罗所用的敬称，并非对上帝的称呼；“我主”保留宫廷语境中的恭敬色彩。
- source_word: רֹדֵף אַחֲרֵי
  choice: 追赶
  rationale: 准确表达持续追逐的行动，不采用解释意味更强的“迫害”。
- source_word: עַבְדּוֹ
  choice: 他的仆人
  rationale: 马所拉文本是第三人称单数后缀，直译为“他的仆人”。虽然直接对话中通常会说“你的仆人”，正文仍保留现存希伯来文本的异常形式。
- source_word: כִּי מֶה עָשִׂיתִי
  choice: 我究竟做了什么
  rationale: כִּי在这里引出说明性的反问；汉语以“究竟”自然体现追问语气，无须机械译出连接词。
- source_word: וּמַה בְּיָדִי רָעָה
  choice: 我手中又有什么恶事
  rationale: 保留“在我手中”的希伯来意象，并以“恶事”传达רָעָה较强而宽泛的负面含义。
theological_decisions: []
