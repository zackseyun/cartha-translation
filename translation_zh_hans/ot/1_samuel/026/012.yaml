  terminology: 神名יהוה译为“雅威”符合既定译名。将兵器改为“长矛”可避免“枪”被理解为现代火器。以“从雅威而来的深沉的睡眠”表达属格的来源／施行意义，不将其过度系统化为独一的句法解释。
