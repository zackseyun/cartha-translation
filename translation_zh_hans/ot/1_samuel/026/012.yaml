source:
  edition: WLC
  text: וַ/יִּקַּח֩ דָּוִ֨ד אֶֽת הַ/חֲנִ֜ית וְ/אֶת צַפַּ֤חַת הַ/מַּ֨יִם֙ מֵרַאֲשֹׁתֵ֣י שָׁא֔וּל וַ/יֵּלְכ֖וּ לָ/הֶ֑ם וְ/אֵ֣ין רֹאֶה֩ וְ/אֵ֨ין יוֹדֵ֜עַ וְ/אֵ֣ין מֵקִ֗יץ כִּ֤י כֻלָּ/ם֙ יְשֵׁנִ֔ים כִּ֚י תַּרְדֵּמַ֣ת יְהוָ֔ה נָפְלָ֖ה עֲלֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/012.yaml
  text: So David took the spear and the jar of water from beside Saul’s head[a], and they went away. No one saw it, and no one knew it, and no one awoke, for they were all sleeping[b], because a deep sleep from Yahweh had fallen on them.
translation:
  language: zh_hans
  text: 于是，大卫从扫罗头旁取走了长矛和水罐，二人就离去了。没有人看见，也没有人知道，也没有人醒来，因为他们全都睡着了；原来，有从雅威而来的深沉的睡眠临到了他们。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “从雅威而来的深沉的睡眠”也可按字面译作“雅威的深沉睡眠”。这里的属格表达表明，这睡眠出于雅威、由他所施行。“雅威”是希伯来文神名 יהוה 的音译；传统上也常译作“耶和华”。
    reason: 说明תַּרְדֵּמַת יְהוָה的属格可表达来源或施行，并交代神名译法。
lexical_decisions:
- source_word: הַחֲנִית
  choice: 枪
  rationale: חֲנִית指用于作战的长柄刺击兵器；现代汉语叙事中“枪”简洁自然，也符合古代兵器语境，并非指现代火器。
- source_word: צַפַּחַת הַמַּיִם
  choice: 水罐
  rationale: צַפַּחַת可指瓶、壶或罐一类盛器；“水罐”清楚表达其用途和实体性质。
- source_word: מֵרַאֲשֹׁתֵי שָׁאוּל
  choice: 从扫罗头旁
  rationale: 该空间表达指扫罗躺卧时头部所在或头旁的位置，并非说物件放在他的头上；“头旁”准确且自然。
- source_word: וַיֵּלְכוּ לָהֶם
  choice: 两人便离开了
  rationale: 复数动词所指的是大卫和亚比筛；中文补出“两人”可明确主语，而“离开了”自然传达他们走掉之意。
- source_word: וְאֵין רֹאֶה וְאֵין יוֹדֵעַ וְאֵין מֵקִיץ
  choice: 没有人看见，没有人知道，也没有人醒来
  rationale: 保留原文三个并列的否定分句及其递进式叙事节奏；“知道”不把语义限缩为“察觉”，从而保留原文的宽度。
- source_word: תַּרְדֵּמַת יְהוָה
  choice: 从雅威而来的沉睡
  rationale: תַּרְדֵּמָה指异常深沉的睡眠；属格结构可表达来源或施行者。“从雅威而来”在自然汉语中呈现神圣作用，同时不改写为更强的显式使役句。
- source_word: נָפְלָה עֲלֵיהֶם
  choice: 临到了他们
  rationale: 希伯来语直译为“落在他们身上”，是状态临到人的惯用表达；“临到”庄重自然，并保留事件发生在他们身上的意象。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文使用四字神名而非“主”这一称号；“雅威”直接音译该专名，避免以头衔替代，同时在注释中说明读音传统。
- issue: תַּרְדֵּמַת יְהוָה 中神的作用
  choice: 从雅威而来的沉睡
  alternative: 雅威使沉睡临到他们
  rationale: 所选译法表达沉睡源于雅威，却不把希伯来语属格结构完全展开为明确使役句，因而保留原文形式中的一定张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“于是”“便”维持历史叙事的推进感；三个“没有人”保留原文的重复和强调。分号区分直接原因与最终原因，使连续两个 כִּי 的逻辑在现代汉语中清楚可读。
