base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/017.yaml
  text: Then Saul recognized David’s voice and said, “Is this your voice, my son David?” And David said, “It is my voice, my lord the king.”
translation:
  language: zh_hans
  text: 扫罗听出是大卫的声音，就说：“我儿大卫，这是你的声音吗？”大卫说：“是我的声音，我主我王。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּכֵּר
  choice: 听出
  rationale: נכר在此指凭听觉辨认；现代汉语用“听出”既自然，又明确表达扫罗从声音认出大卫。
- source_word: קוֹל
  choice: 声音
  rationale: קוֹל在上下文中指人的声音；三处均译作“声音”，保留原文问答中的词语呼应。
- source_word: הֲקוֹלְךָ זֶה
  choice: 这是你的声音吗
  rationale: 按希伯来语疑问结构直译，并采用自然的现代汉语语序，不把“声音”意译为“是你吗”。
- source_word: בְּנִי
  choice: 我儿
  rationale: 保留阳性亲属称谓及其叙事张力；“我儿”比“我的儿子”更符合此处直接称呼的庄重语体。
- source_word: קוֹלִי
  choice: 是我的声音
  rationale: 原文是省略系词的“我的声音”；补出汉语所需的“是”，同时不改写成“是我”。
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: 我主我王
  rationale: אֲדֹנִי在此是对人的尊称，不是神名；“我主我王”保留两个称号及大卫恭敬的口吻，在中文圣经叙事中也自然庄重。
- source_word: דָּוִד / שָׁאוּל
  choice: 大卫／扫罗
  rationale: 采用现代中文圣经中通行的人名译法。
theological_decisions:
- issue: 扫罗以בְּנִי称呼大卫所形成的关系张力
  choice: 译为“我儿”
  alternative: “我的孩子”或省略亲属称谓
  rationale: 直译保留扫罗虽敌对大卫却仍以父辈式称呼相待的叙事张力，也不淡化原词的阳性含义。
- issue: אֲדֹנִי是否应理解为神圣称号
  choice: 译为对君王的尊称“我主”
  alternative: 按神的称号处理
  rationale: 其后紧接“王”，说话对象明确是扫罗，因此这里是人际敬称，而非对上帝的称呼。
translation_notes:
  register: 采用现代、清楚而庄重的叙事汉语。用“听出”体现凭声音辨认；直接引语保留“声音”的三重呼应以及“我儿”与“我主我王”之间的关系和身份张力。
