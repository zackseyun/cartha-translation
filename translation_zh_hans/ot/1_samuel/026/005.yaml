base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/005.yaml
  text: Then David arose and came to the place where Saul had camped[a], and David saw the place where Saul lay, and Abner son of Ner, the commander of his army. Saul was lying within the encampment, and the people were camped around him.
translation:
  language: zh_hans
  text: 大卫起身，来到扫罗扎营的地方。他看见扫罗躺卧之处，也看见尼珥的儿子、扫罗的军队统帅押尼珥。扫罗躺在营圈[a]中，众人环绕着他安营。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “营圈”直译为“圆圈”，可能指营地内圈或中央区域。
    reason: 说明原文空间词的字面意象及其可能所指。
lexical_decisions:
- source_word: וַיָּקָם
  choice: 起身
  rationale: קום的叙事性连续式在这里推进下一步行动；“起身”既贴近原文，又符合庄重自然的现代汉语。
- source_word: וַיָּבֹא אֶל־הַמָּקוֹם
  choice: 来到……地方
  rationale: בוא与אֶל表示朝某处移动；“来到……地方”简明自然。
- source_word: חָנָה
  choice: 扎营
  rationale: 该完成式位于关系从句中，说明扫罗在那处驻营；汉语无需另加时态标记。
- source_word: וַיַּרְא ... אֶת־הַמָּקוֹם
  choice: 看见……之处
  rationale: ראה采用基本义“看见”；“躺卧之处”自然表达原文所指的地点。
- source_word: שָׁכַב ... שֹׁכֵב
  choice: 躺卧……躺在
  rationale: 前者用来界定地点，后者是分词，描写扫罗当时持续的姿态；中文以不同措辞保留这一功能差异。
- source_word: וְאַבְנֵר בֶּן־נֵר שַׂר צְבָאוֹ
  choice: 也看见尼珥的儿子、扫罗的军队统帅押尼珥
  rationale: 原文以并列结构接续押尼珥，表达较为省略。“也看见”补足汉语所需的谓语，同时不强行断定押尼珥与扫罗同卧；“扫罗的军队统帅”明确代词所指。
- source_word: בַּמַּעְגָּל
  choice: 在营圈中
  rationale: מַעְגָּל本义涉及圆形或环状布局；“营圈”既保留这一空间意象，也能让现代读者理解为营地内部的环状区域。
- source_word: חֹנִים סְבִיבֹתָיו
  choice: 环绕着他安营
  rationale: 分词描述众人当时驻营的状态，סביבתיו明确表示他们围绕扫罗。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体；人名依中文圣经通行译法。保留原文关于押尼珥的省略式并列所带来的轻微歧义，不擅自断定他是否也在躺卧。
