base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/019.yaml
  text: And he struck down some of the men of Beth-shemesh because they had looked into the ark of Yahweh[a]. He struck down seventy men among the people, fifty thousand men[b], and the people mourned because Yahweh had struck the people with a great blow.
translation:
  language: zh_hans
  text: 耶和华击杀了伯示麦人中的一些人，因为他们观看了耶和华的约柜[a]。他在百姓中击杀了七十人，五万人[b]。百姓就哀悼，因为耶和华重重击打了百姓。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为他们往耶和华的约柜里面看。”这里的希伯来语介词也可作较一般的理解，即“观看耶和华的约柜”；在本段语境中，“往里面看”可能更具体地说明他们的过犯。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语直译为“七十人，五万人”，措辞难解。它可能指“五万人中的七十人”或“五万零七十人”，也可能反映抄本文本上的问题；有些古代见证支持小得多的数目。
    reason: textual_variant
lexical_decisions:
- source_word: וַיַּךְ
  choice: 击杀
  rationale: נכה本义为“击打”；本节涉及死亡人数，因此译作“击杀”自然地表达致命结果，同时保留全节反复出现的“击打”意象。末句则译作“击打”，以贴近מַכָּה的词根呼应。
- source_word: בְּאַנְשֵׁי בֵית שֶׁמֶשׁ
  choice: 伯示麦人中的一些人
  rationale: 介词בְּ可表达受击者出自伯示麦人之中；加入“一些”可避免误解为全体伯示麦人都被击杀。地名按现代中文圣经常用形式译作“伯示麦”。
- source_word: כִּי רָאוּ בַּאֲרוֹן יְהוָה
  choice: 因为他们观看了耶和华的约柜
  rationale: ראה与בְּ连用在此可指“观看”或更具体的“往里面看”。正文采用较贴近希伯来语且保留歧义的“观看”，把“往里面看”列入脚注，避免仅凭语境把动作具体化。
- source_word: אֲרוֹן יְהוָה
  choice: 耶和华的约柜
  rationale: אֲרוֹן在本叙事中指承载圣约法版的柜，现代中文惯译“约柜”；יהוה按中文通行的专名形式译作“耶和华”。
- source_word: שִׁבְעִים אִישׁ חֲמִשִּׁים אֶלֶף אִישׁ
  choice: 七十人，五万人
  rationale: 马所拉文本的数字次序语法困难。正文按原文保留并列式措辞，不擅自决定是“五万零七十人”还是“五万人中的七十人”；可能解释及文本问题见脚注。
- source_word: וַיִּתְאַבְּלוּ
  choice: 悲哀
  rationale: אבל的反身词干表示因死亡或灾难而哀悼；“悲哀”庄重自然，也符合群体面对重大死亡事件的反应。
- source_word: מַכָּה גְדוֹלָה
  choice: 重重击打
  rationale: 直译为“重大的击打”。中文以“重重击打”表达灾祸严重，并保留其与נכה“击打”的词汇呼应，而不把它限定为瘟疫或屠杀。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用四字神名。正文保留为专名而不以“主”这一称号代替；“耶和华”是现代简体中文读者最熟悉且通行的形式。“雅威”是较接近学术拟音的另一译法。
- issue: 观看约柜这一罪行的具体性质
  choice: 正文译“观看”，不确定是否指往约柜里面看
  alternative: 往约柜里面看
  rationale: בַּאֲרוֹן可以较一般地表示看约柜，也可能在本语境中表示往柜内看。译文不应把语法没有完全解决的问题转化为确定的罪行描述，故正文保留宽泛表达并用脚注说明。
- issue: 死亡人数的困难读法
  choice: 保留“七十人，五万人”的马所拉文本次序
  alternative: 五万零七十人；五万人中的七十人；仅七十人
  rationale: 原文数字组合异常，古代见证也不完全一致。正文不静默校订或合并数字，而把主要解释和文本问题公开列在脚注中。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。保留原文中“击杀／击打”的重复意象，并通过脚注透明呈现观看约柜和死亡人数两处真实歧义。所有脚注标记均已置于正文对应位置。
