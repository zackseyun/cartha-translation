reference: 1 Samuel 6:9
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וּ/רְאִיתֶ֗ם אִם דֶּ֨רֶךְ גְּבוּל֤/וֹ יַֽעֲלֶה֙ בֵּ֣ית שֶׁ֔מֶשׁ ה֚וּא עָ֣שָׂה לָ֔/נוּ אֶת הָ/רָעָ֥ה הַ/גְּדוֹלָ֖ה הַ/זֹּ֑את וְ/אִם לֹ֗א וְ/יָדַ֨עְנוּ֙ כִּ֣י לֹ֤א יָד/וֹ֙ נָ֣גְעָה בָּ֔/נוּ מִקְרֶ֥ה ה֖וּא הָ֥יָה לָֽ/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/009.yaml
  text: 'And watch: if it goes up by the way of its territory to Beth-shemesh[a], then he is the one who has done this great harm to us; but if not, then we will know that it was not his hand that struck us[b]; it happened to us by chance.'
translation:
  language: zh_hans
  text: 你们要看：如果它经由本境[a]的道路上到伯示麦去，那么，就是他使这大灾祸临到我们；如果不是，我们就知道，击打我们的并不是他的手；这事是偶然临到我们的[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “本境”也可译作“边界”或“境内”。这里可能指约柜所属的以色列境域，路线的目的地是伯示麦。
    reason: lexical_alternative
  - marker: b
    text: 或译：“这是偶然临到我们的事。”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּרְאִיתֶם
  choice: 你们要看
  rationale: 复数命令式在此要求非利士人观察试验结果；“要看”既贴近原文，也符合现代汉语。
- source_word: דֶּרֶךְ גְּבוּלוֹ
  choice: 沿着通往它本境的路
  rationale: דֶּרֶךְ 指道路，גְּבוּל 可指边界或境域；后缀所指存在一定含混，此译结合目的地伯示麦，表达朝约柜所属之境前行，同时不把“边界”理解得过窄。
- source_word: יַעֲלֶה
  choice: 上到
  rationale: 保留 עלה 的“上去”方向意味；伯示麦位于较高地势，中文“上到……去”自然且具体。
- source_word: בֵּית שֶׁמֶשׁ
  choice: 伯示麦
  rationale: 采用现代中文圣经地名的通行音译。
- source_word: הוּא עָשָׂה לָנוּ
  choice: 就是他降给我们的
  rationale: 独立代词 הוּא 带强调，译作“就是他”；עָשָׂה לָנוּ 直义为“对我们做了”，结合灾祸语境译为“降给我们”。
- source_word: הָרָעָה הַגְּדוֹלָה הַזֹּאת
  choice: 这场大灾祸
  rationale: רָעָה 在此指严重灾害或祸患，而非行为上的邪恶；“大灾祸”保留事件的严重性。
- source_word: וְיָדַעְנוּ
  choice: 我们就知道
  rationale: 表达试验另一结果所带来的推论，现代汉语用“就”清楚自然。
- source_word: יָדוֹ נָגְעָה בָּנוּ
  choice: 击打我们的……他的手
  rationale: 原文是“他的手触及我们”；在审判和灾害语境中，“击打”准确传达神之手施加的打击，同时保留“手”的意象。
- source_word: מִקְרֶה הוּא הָיָה לָנוּ
  choice: 而是我们偶然遇上了这事
  rationale: מִקְרֶה 指偶发之事或偶然事件；此译保留说话者提出的“偶然”解释，并使中文句法顺畅。
theological_decisions:
- issue: רָעָה 用于所推定的神圣行动
  choice: 大灾祸
  alternative: 大恶事／大伤害／大祸患
  rationale: 语境所指是临到非利士人的严重灾害。“大灾祸”不把 רָעָה 误解为神在道德上行恶，也不淡化审判的严厉。
- issue: 神的作为与偶然事件之间的试验性判断
  choice: 保留“他的手”与“偶然”的直接对照
  alternative: 将“偶然”解释为表面偶然或神的护理
  rationale: 经文呈现的是非利士人所设计的判别标准，并未在本节内系统解释偶然与神护理的关系；译文不替说话者解决这一神学张力。
translation_notes:
  register: 采用庄重而明白的现代标准普通话。“你们要看”保留命令语气；“上到伯示麦去”体现地理方向；全句维持原文条件试验的逻辑和“神的手／偶然”之间未被化解的张力。
