revisions:
- from: 你们要看：如果车沿着通往它本境的路上到伯示麦去[a]，那么这场大灾祸就是他降给我们的；如果不是，我们就知道，击打我们的并不是他的手，而是我们偶然遇上了这事[b]。
  to: 你们要看：如果它经由本境[a]的道路上到伯示麦去，那么，就是他使这大灾祸临到我们；如果不是，我们就知道，击打我们的并不是他的手；这事是偶然临到我们的[b]。
  rationale: 修正首句不自然的中文句法，将脚注a由地名移至其实际说明的“本境”，并以“使这大灾祸临到我们”更清楚表达原文中强调的施事“他”。末句改为独立分句，以对应原文“这是偶然临到我们的”，避免“而是我们偶然遇上了这事”在中文中显得将偶然性误作与“不是他的手”完全排他的解释性连词。
