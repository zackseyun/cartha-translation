id: 1SA.6.18
reference: 1 Samuel 6:18
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/עַכְבְּרֵ֣י הַ/זָּהָ֗ב מִסְפַּ֞ר כָּל עָרֵ֤י פְלִשְׁתִּים֙ לַ/חֲמֵ֣שֶׁת הַ/סְּרָנִ֔ים מֵ/עִ֣יר מִבְצָ֔ר וְ/עַ֖ד כֹּ֣פֶר הַ/פְּרָזִ֑י וְ/עַ֣ד אָבֵ֣ל הַ/גְּדוֹלָ֗ה אֲשֶׁ֨ר הִנִּ֤יחוּ עָלֶ֨י/הָ֙ אֵ֚ת אֲר֣וֹן יְהוָ֔ה עַ֚ד הַ/יּ֣וֹם הַ/זֶּ֔ה בִּ/שְׂדֵ֥ה יְהוֹשֻׁ֖עַ בֵּֽית הַשִּׁמְשִֽׁי־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/018.yaml
  text: and the golden mice[a], according to the number of all the cities of the Philistines belonging to the five rulers, from fortified city to unwalled village, and as far as the great stone on which they set down the ark of Yahweh, which remains to this day in the field of Joshua the Beth-shemite.
translation:
  language: zh_hans
  text: 金老鼠的数目，按非利士人五位首领所辖一切城邑的数目计算，从坚城到无城墙的村庄；又直到那块大石头[a]，他们曾把雅威的约柜放在那块石头上。这石头至今仍在伯示麦人约书亚的田里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“又直到大亚伯。”这里的希伯来文本也可理解为地名；正文按上下文将其理解为“大石头”。
    reason: 保留“大亚伯”这一可能的替代译法，同时避免把有争议的文本/词义判断表述为确定事实。
lexical_decisions:
- source_word: עַכְבְּרֵי הַזָּהָב
  choice: 金老鼠
  rationale: עַכְבָּר可指鼠类；“金老鼠”在现代汉语中自然，也保留了这些以黄金制成之灾祸形像的含义。
- source_word: מִסְפַּר כָּל עָרֵי פְלִשְׁתִּים
  choice: 数目与非利士人……各城的数目相同
  rationale: מִסְפַּר在此表达数量上的对应；用“数目相同”清楚传达金鼠与城邑一一对应。
- source_word: לַחֲמֵשֶׁת הַסְּרָנִים
  choice: 五位首领所辖
  rationale: סְרָנִים是非利士城邦统治者的专称；“首领”通俗而庄重，“所辖”说明各城与五位统治者的隶属关系。
- source_word: מֵעִיר מִבְצָר וְעַד כֹּפֶר הַפְּרָזִי
  choice: 从设防的城直到没有城墙的村庄
  rationale: 该短语涵盖各种聚落，并突出坚固城与开放式乡村聚落之间的对比。
- source_word: וְעַד אָבֵל הַגְּדוֹלָה
  choice: 还直到那块大石头
  rationale: 马所拉文本字面读作“大亚伯”，但紧接着的关系从句说约柜曾安放在其上，且本章14—15节已提到同一块大石头，因此正文采用有强烈语境支持的“大石头”，同时以脚注保留地名读法和文本张力。
- source_word: אֲשֶׁר הִנִּיחוּ עָלֶיהָ אֵת אֲרוֹן יְהוָה
  choice: 他们曾把雅威的约柜安放在那石头上
  rationale: הִנִּיחוּ表示放下、安放；“安放”适合约柜这一庄重对象，并自然表达叙事动作。
- source_word: עַד הַיּוֹם הַזֶּה
  choice: 至今仍在
  rationale: 这是表示某物在叙述成书时仍然存在的惯用语；汉语用“至今仍在”简洁自然。
- source_word: בִּשְׂדֵה יְהוֹשֻׁעַ בֵּית הַשִּׁמְשִׁי
  choice: 在伯示麦人约书亚的田里
  rationale: בֵּית הַשִּׁמְשִׁי是表示籍贯的称谓，意为来自伯示麦的人；译作“伯示麦人约书亚”准确而自然。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”按其较通行的学术复原音译，保留专名性质，不以称号替代。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。正文保留原文由城邑数目转到大石头的并列结构，不替作者消除其略显突兀之处；用分号和补明指代对象，使汉语关系清楚。
