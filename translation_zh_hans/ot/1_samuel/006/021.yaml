source:
  edition: WLC
  text: וַֽ/יִּשְׁלְחוּ֙ מַלְאָכִ֔ים אֶל יוֹשְׁבֵ֥י קִרְיַת יְעָרִ֖ים לֵ/אמֹ֑ר הֵשִׁ֤בוּ פְלִשְׁתִּים֙ אֶת אֲר֣וֹן יְהוָ֔ה רְד֕וּ הַעֲל֥וּ אֹת֖/וֹ אֲלֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/021.yaml
  text: So they sent messengers to the inhabitants of Kiriath-jearim[a], saying, “The Philistines have returned the ark of Yahweh. Come down; bring it up to yourselves.”
translation:
  language: zh_hans
  text: 于是，他们派使者到基列耶琳的居民那里，说：“非利士人已经把雅威的约柜送回来了。你们下来[a]，把它带上去，带到你们那里。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “下来”也可译作“下去”。原文使用表示地势方向的动词“下去／下来”和“带上去”，很可能反映伯示麦与基列耶琳之间的地形。
    reason: 说明“下来／下去”的人称视角译法，并保留原文地势动词所传达的空间信息。
lexical_decisions:
- source_word: וַיִּשְׁלְחוּ
  choice: 于是，他们派
  rationale: 叙事性连续式推动情节；“于是”自然表达前后承接，“派”与“使者”搭配顺畅。
- source_word: מַלְאָכִים
  choice: 使者
  rationale: 这里指受差遣传话的人，并非天使。
- source_word: יוֹשְׁבֵי קִרְיַת יְעָרִים
  choice: 基列耶琳的居民
  rationale: 按原文分词结构译为“居民”；地名采用简体中文圣经中通行的音译。
- source_word: הֵשִׁבוּ
  choice: 已经……送回来了
  rationale: שוב 的使役式表示使某物返回；“已经……送回来了”既表达动作完成，也体现其对当前局面的影响。
- source_word: אֲרוֹן יְהוָה
  choice: 雅威的约柜
  rationale: אֲרוֹן 在本语境中是神圣的约柜；יהוה 按其专名译作“雅威”。
- source_word: רְדוּ
  choice: 你们下来
  rationale: 保留 ירד 的地势方向含义；“来”采用发话者邀请对方到自己所在之处的视角。
- source_word: הַעֲלוּ אֹתוֹ אֲלֵיכֶם
  choice: 把约柜抬上去，接到你们那里
  rationale: “抬上去”保留 עלה 使役式的上行含义；补出“约柜”避免中文代词指向含混，“接到你们那里”自然表达 אֲלֵיכֶם。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”以音译保留其作为神之专名的性质，不以称号替代。
- issue: אֲרוֹן 是否明确译作“约柜”
  choice: 约柜
  alternative: 柜
  rationale: 本段明确涉及以色列敬拜中的神圣柜；现代汉语用“约柜”可准确指认该对象，并与上下文保持一致。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。直接引语简明清楚，同时保留“下来／抬上去”这组具有地形色彩的方向动词；“接到你们那里”使原文目的地表达在中文中更顺畅。
