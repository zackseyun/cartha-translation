base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/007.yaml
  text: Now then[a], take and make one new cart, and two nursing cows on which no yoke has come, and hitch the cows to the cart[b], but take their calves away from them to the house.
translation:
  language: zh_hans
  text: 现在，你们要造一辆新车，并取两头正在哺乳、从未负过轭的母牛[a]；把母牛套在车上，并把它们的小牛从它们身边带回家去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“两头有奶的母牛”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: 现在
  rationale: 作为话语转换语，引出祭司指示的下一步；现代汉语用“现在”自然明晰。
- source_word: קְחוּ וַעֲשׂוּ עֲגָלָה חֲדָשָׁה אֶחָת
  choice: 取一辆新车
  rationale: 这里的עשׂה与קחו构成连动式指令，重点是置备一辆新车；汉语若直译为“取并做”不自然。“一辆”保留数词אחת。
- source_word: שְׁתֵּי פָרוֹת עָלוֹת
  choice: 两头正在哺乳的母牛
  rationale: עלות指有乳、正在哺育幼畜的母牛；此译既准确，也为后文提到小牛提供自然语境。
- source_word: אֲשֶׁר לֹא עָלָה עֲלֵיהֶם עֹל
  choice: 这两头牛从未负过轭
  rationale: 保留“轭”的具体意象，并用“从未负过”表达此前没有用于牵引劳作的含义。
- source_word: וַאֲסַרְתֶּם אֶת־הַפָּרוֹת בָּעֲגָלָה
  choice: 把母牛套在车上
  rationale: אסר在此指把牲畜系套于车；“套在车上”是现代汉语中自然、准确的畜力车用语。
- source_word: בְּנֵיהֶם
  choice: 它们的小牛
  rationale: 字面为“它们的孩子”，用于母牛时按语境译为“小牛”最自然。
- source_word: וַהֲשֵׁיבֹתֶם ... מֵאַחֲרֵיהֶם הַבָּיְתָה
  choice: 把它们的小牛从它们身边带回家去
  rationale: 使役形表达使小牛返回；“从它们身边”体现母子分开，方向词“回家去”对应הביתה。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“负轭”“套在车上”保留古代畜力运输场景，又能为普通读者理解；不另加神学解释。
