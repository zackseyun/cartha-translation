revisions:
- from: 现在，你们要取一辆新车和两头正在哺乳的母牛[a]；这两头牛从未负过轭。要把母牛套在车上，并把它们的小牛从它们身边带回家去。
  to: 现在，你们要造一辆新车，并取两头正在哺乳、从未负过轭的母牛[a]；把母牛套在车上，并把它们的小牛从它们身边带回家去。
  rationale: 修订仅恢复原文中造备新车的命令，并将“从未负过轭”紧接其所修饰的母牛。其余措辞保留草稿对母牛、小牛、轭和送回房屋的准确且自然的表达。
