source:
  edition: WLC
  text: וּ/בֵ֣ית שֶׁ֔מֶשׁ קֹצְרִ֥ים קְצִיר חִטִּ֖ים בָּ/עֵ֑מֶק וַ/יִּשְׂא֣וּ אֶת עֵינֵי/הֶ֗ם וַ/יִּרְאוּ֙ אֶת הָ֣/אָר֔וֹן וַֽ/יִּשְׂמְח֖וּ לִ/רְאֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/013.yaml
  text: The people of Beth-shemesh were reaping the wheat harvest in the valley[a], and they lifted up their eyes and saw the ark, and they rejoiced to see it.
translation:
  language: zh_hans
  text: 伯示麦人正在谷中收割小麦；他们抬眼一看，见了约柜，就因看见它而欢喜。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבֵית שֶׁמֶשׁ
  choice: 伯示麦人
  rationale: 地名在此借指当地居民，因为后面的分词和动词均为复数；译作“伯示麦人”自然简洁，也不额外限定性别。句首 וּ 仅承接上下文，以分号组织汉语叙事，不增添“那时”等原文没有的时间词。
- source_word: קֹצְרִים קְצִיר חִטִּים
  choice: 正在……收割小麦
  rationale: 复数分词表达持续进行的背景动作；现代汉语用“正在”体现其延续性。“收割小麦”比直译“收割小麦的收成”更自然，并完整传达所收作物。
- source_word: בָּעֵמֶק
  choice: 在谷中
  rationale: עֵמֶק 指山谷或低洼地带；“谷中”在此准确、简洁且符合叙事语体。
- source_word: וַיִּשְׂאוּ אֶת עֵינֵיהֶם
  choice: 他们抬眼一看
  rationale: 这是希伯来语惯用表达，意为抬起目光观看；“抬眼一看”既保留原文形象，又是自然的现代汉语。
- source_word: וַיִּרְאוּ אֶת הָאָרוֹן
  choice: 见了约柜
  rationale: הָאָרוֹן 在本段上下文中指先前已明确的上帝之柜，即约柜；“见了”忠实呈现连续发生的叙事动作。
- source_word: וַיִּשְׂמְחוּ לִרְאוֹת
  choice: 就因看见它而欢喜
  rationale: 介词 ל 加不定式说明欢喜的缘由或契机；“因看见它而欢喜”保留这种关系，“它”按汉语需要补出，明确回指约柜。
theological_decisions:
- issue: הָאָרוֹן 的称谓
  choice: 约柜
  alternative: 柜；上帝的约柜
  rationale: 上下文已确立此柜的身份。传统且清楚的“约柜”足以指明所指，又不在本节增添原文此处未出现的“上帝的”或“盟约的”等限定语。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。以“正在”呈现背景性持续动作，以“抬眼一看”传达希伯来语惯用语；句式简洁，保留原文从劳作、看见到欢喜的叙事推进。
