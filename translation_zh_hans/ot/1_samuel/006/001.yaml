  yaml_path: translation/ot/1_samuel/006/001.yaml
  text: And the ark of Yahweh was in the territory of the Philistines seven months[a].
translation:
  language: zh_hans
  text: 雅威的约柜在非利士人的境内停留了七个月[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“在非利士人的田野中”；这里的“田野”也可指非利士人的地域或国土。
    reason: 说明 שָׂדֶה 的字面意义及其在本句中的地域义。
lexical_decisions:
- source_word: וַיְהִי
  choice: 停留了
  rationale: 该形式承接前文，叙述约柜在当地持续一段时间的状态。现代汉语用“停留了”自然表达这一延续状态；无需机械译出句首连接词。
- source_word: אֲרוֹן יְהוָה
  choice: 雅威的约柜
  rationale: “约柜”准确表达此敬拜语境中的 אֲרוֹן；属格结构自然译为“雅威的约柜”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来语圣名的通常拟音译作“雅威”，保留其作为专名的性质，不以称号替代。
- source_word: בִּשְׂדֵה פְלִשְׁתִּים
  choice: 在非利士人的境内
  rationale: שָׂדֶה 本义为“田野”，也可指一地的乡野或地域；本处语境指非利士人控制的地区，译作“境内”自然且准确，并以脚注保留字面表达。
- source_word: שִׁבְעָה חֳדָשִׁים
  choice: 七个月
  rationale: 直接保留原文的数目和时间单位。
theological_decisions:
- issue: 圣名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文使用以色列上帝的专名；“雅威”较直接地体现该圣名的希伯来语拟音，同时不把它改译为“主”等称号。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“停留了”补足现代汉语谓语，使持续七个月的状态清楚自然；脚注保留希伯来语“田野”的措辞和词义幅度。
