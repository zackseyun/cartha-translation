  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יֹּֽאמְרוּ֙ אַנְשֵׁ֣י בֵֽית שֶׁ֔מֶשׁ מִ֚י יוּכַ֣ל לַ/עֲמֹ֔ד לִ/פְנֵ֨י יְהוָ֧ה הָ/אֱלֹהִ֛ים הַ/קָּד֖וֹשׁ הַ/זֶּ֑ה וְ/אֶל מִ֖י יַעֲלֶ֥ה מֵ/עָלֵֽי/נוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/020.yaml
  text: Then the men of Beth-shemesh said[a], “Who is able to stand before Yahweh, this holy God? And to whom shall he go up from us?”
translation:
  language: zh_hans
  text: 伯示麦人说：“谁能站立在雅威这位圣洁的上帝面前呢？又要离开我们，上到谁那里去呢？”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 后一句原文没有明说主语；很可能是指雅威的约柜，也可译作：“它要离开我们，上到谁那里去呢？”
    reason: 说明隐含主语及其最可能的上下文所指，同时保留原文的含混。
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: 说
  rationale: 未将叙事连接词 וַ 独立译出；现代汉语按上下文自然推进叙事即可，避免添加不必要的“然后”。
- source_word: אַנְשֵׁי בֵית שֶׁמֶשׁ
  choice: 伯示麦人
  rationale: אַנְשֵׁי 可指当地的男子或居民；“伯示麦人”在现代汉语中自然简洁，也不超出原文所能确定的范围。
- source_word: מִי יוּכַל לַעֲמֹד לִפְנֵי
  choice: 谁能站立在……面前
  rationale: 保留 יכל 的能力含义和 עמד לפני 的庄严表达，传达人在神圣者面前无法站立承受的语气。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以常见的现代汉语音译呈现四字神名，而不以称号代替原文中的专名。
- source_word: הָאֱלֹהִים הַקָּדוֹשׁ הַזֶּה
  choice: 这位圣洁的上帝
  rationale: 保留“圣洁”及指示词“这位”的临场感；量词“位”使现代汉语表达自然而庄重。
- source_word: וְאֶל מִי יַעֲלֶה מֵעָלֵינוּ
  choice: 又要离开我们，上到谁那里去呢
  rationale: עלה 译作“上到”，מֵעָלֵינוּ 译作“离开我们”。汉语省略未明说的主语，既自然，也保留希伯来文的指代含混。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；采用“雅威”以呈现该专名，不以“主”等称号替换。
- issue: יַעֲלֶה 的隐含主语
  choice: 正文不补出主语
  alternative: “它要……”，明确指约柜；或“他要……”
  rationale: 该动词为阳性单数，但原文没有明说主语；上下文很可能指约柜。汉语可自然省略主语，从而不把上下文推断写死在正文中，并以脚注说明最可能的所指。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“站立在……面前”保留原文的肃穆力度；第二问省略主语，以符合汉语习惯并忠实保存原文的歧义。
