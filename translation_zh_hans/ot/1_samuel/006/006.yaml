  to: 你们为什么要使自己的心刚硬[a]，像埃及和法老使他们的心刚硬一样呢？当他严厉对付他们时，他们岂不是把以色列人放走，以色列人也就离去了吗？
  rationale: 修订保留原文对上帝行动者的隐含指向（“他”），保留埃及与法老的集合性并列，也明确中文中两组代词的不同所指。末句恢复原文“放走”之后以色列人“离去”的并列连续动作，避免新增使役关系。
