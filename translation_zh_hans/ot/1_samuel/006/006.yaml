base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/006.yaml
  text: Why then do you harden your hearts[a], as Egypt and Pharaoh hardened their hearts? Was it not when he dealt harshly with them that they sent them away[b], and they went?
translation:
  language: zh_hans
  text: 你们为什么要使自己的心刚硬[a]，像埃及和法老使他们的心刚硬一样呢？当他严厉对付他们时，他们岂不是把以色列人放走，以色列人也就离去了吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “使自己的心刚硬”原文直译为“使你们的心沉重”；这是指内心刚硬、顽梗的希伯来语表达。
    reason: lexical_alternative
lexical_decisions:
- source_word: תְכַבְּדוּ / כִּבְּדוּ
  choice: 硬着心
  rationale: כבד 的加强词干与“心”连用，字面是“使心沉重”，在此是顽固、不肯顺服的习语；“硬着心”既自然，也保留主动抗拒的含义。
- source_word: לְבַבְכֶם / לִבָּם
  choice: 你们的心 / 他们的心
  rationale: “心”在希伯来语中指人的内在意志和思想。现代汉语常以单数“心”表达群体中各人的内心，无须机械译成复数。
- source_word: מִצְרַיִם וּפַרְעֹה
  choice: 埃及人和法老
  rationale: “埃及”在原文中以地名集合性地指埃及人；译作“埃及人”可避免现代读者误以为地理区域本身有心，同时保留与法老并列的结构。
- source_word: הִתְעַלֵּל
  choice: 严厉对付
  rationale: 此处指施加强力而带惩罚性的处置；“严厉对付”符合出埃及事件的语境，同时不把具体方式说得超过原文。
- source_word: וַיְשַׁלְּחוּם
  choice: 他们就把以色列人放走了
  rationale: שלח 在这里有打发走、释放之意。原文宾语代词与前一个“他们”所指不同；正文补出“以色列人”可消除中文中的严重指代混淆。
- source_word: וַיֵּלֵכוּ
  choice: 让他们离去
  rationale: הלך 的基本义是“去、走”。结合前句译成“让他们离去”，保留简洁动作，同时使汉语句子自然；主语仍是被放走的以色列人。
theological_decisions:
- issue: הִתְעַלֵּל 的隐含主语
  choice: 以“他”保留隐含指向，由上下文理解为上帝
  alternative: 明确译作“上帝严厉对付他们”
  rationale: 出埃及记背景清楚表明行动者是上帝，但本节希伯来文没有明说主语。用“他”既符合汉语语法，又不替原文消除这种省略。
- issue: 两组第三人称代词的指向
  choice: 前一个“他们”指埃及人和法老，后续被放走和离去者明确为以色列人
  alternative: 全都直译为“他们”，仅用脚注说明
  rationale: 原文依靠共同背景区分代词对象，中文若连续使用“他们”会造成实质歧义；补明“以色列人”是在不改变事件角色的前提下传达原意。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“你们为什么要……呢”传达原文责问语气；末句整合为中文反问句。“以色列人”虽在原文中以代词出现，但为厘清两个所指不同的复数代词而在正文补明。
