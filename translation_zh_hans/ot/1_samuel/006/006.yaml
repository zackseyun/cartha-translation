  source_fidelity: 首句基本准确地表达了“使心刚硬”的责问与埃及、法老的类比。后半句虽正确识别了两组“他们”的不同所指，但“让他们离去”把原文并列的“他们放走了他们；他们就去了”改成了埃及人使以色列人离去的使役结构，略削弱了以色列人自行离开的动作。
  naturalness: 整体庄重自然。“硬着心”可懂，但“使自己的心刚硬”更贴近原文的使动表达，也更适合与后面的“使他们的心刚硬”保持平行。将末句改为“以色列人也就离去了”可消除指代混乱，同时保留原文的动作并列。
  terminology: “法老”“以色列人”及“严厉对付”均适当。“埃及人和法老”是对集合性“埃及”的可接受释义；为保留原文表述及与英文审计轨迹的一致性，正文宜用“埃及和法老”，而由上下文理解“埃及”为其民众／统治势力。脚注a不宜把习语含义具体化为“不肯顺服”，应限于“刚硬、顽梗”的内在态度。
