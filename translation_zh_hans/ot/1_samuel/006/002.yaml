base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/002.yaml
  text: So the Philistines called for the priests and the diviners[a], saying, “What shall we do with the ark of Yahweh? Tell us with what we should send it to its place.”
translation:
  language: zh_hans
  text: 非利士人召来祭司和占卜者，说：“我们该怎样处理雅威的约柜？请告诉我们，该用什么把它送往它的地方。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“凭什么／用什么把它送往它的地方”。这可指送回所用的方式或手段；在本段上下文中，也可能涉及送还约柜时附带之物。
    reason: 说明 בַּמֶּה 的字面意义，并保留其在本节尚未完全限定的所指。
lexical_decisions:
- source_word: וַיִּקְרְאוּ
  choice: 召来
  rationale: 此处指非利士人召请宗教人员前来提供意见；“召来”自然地表达了这一叙事动作。
- source_word: לַכֹּהֲנִים וְלַקֹּסְמִים
  choice: 祭司和占卜者
  rationale: 准确区分两类非利士宗教人员；“占卜者”是现代汉语中对 קֹסְמִים 清楚而庄重的表达。
- source_word: מַה נַּעֲשֶׂה לַאֲרוֹן
  choice: 我们该怎样处理……约柜
  rationale: לַאֲרוֹן 在商议性问句中表示如何处置约柜；“怎样处理”符合现代汉语习惯。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，保留原文所用的专名，而不以称号替代。
- source_word: הוֹדִיעֻנוּ
  choice: 请告诉我们
  rationale: 自然表达 ידע 的使役命令式“使我们知道”，并符合向专业人士求问的语气。
- source_word: בַּמֶּה
  choice: 用什么
  rationale: 贴近字面“凭什么／带着什么”，保留它可能指运送方式或随约柜附带之物的开放性。
- source_word: נְשַׁלְּחֶנּוּ לִמְקוֹמוֹ
  choice: 把它送回原处
  rationale: “原处”自然表达“它的地方”；“回”由约柜先前被掳离其所在地这一明确语境得出，使汉语流畅。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文使用以色列上帝的专名，而非“主”这一称号；采用“雅威”以直接呈现该专名。
- issue: בַּמֶּה 所问的是方式还是随附之物
  choice: 在正文中译作“用什么”，不限定具体所指
  alternative: 送回时应当附带什么
  rationale: 希伯来语本身可直译为“用什么／带着什么”；紧接的上下文指向随附的赔罪礼，但本节没有明说，故正文保留张力，并以脚注说明。
translation_notes:
  register: 采用现代、庄重且口语可懂的叙事语言。“祭司和占卜者”不额外加上“非利士的”，因为上下文已经明确；引语保留商议和求问的语气。
