revisions:
- from: 他们说：“你们若要送走以色列神的约柜，不可让它空着离去；你们务要把赎愆祭献给他。[a]这样，你们就会痊愈，也会明白他的手为什么一直没有离开你们。”[b]
  to: 他们说：“你们若要送走以色列神的约柜，不可空空地送走它；务必向他献上赎愆祭。[a]这样，你们就会痊愈，也会知道他的手为何不从你们身上离开。”[b]
  rationale: 修订使“送走”的重复更自然，稍微恢复“务必”的命令强调，并删除没有充分依据的古译本/异读断言。正文仍保留“他的手”以及“为何不离开”的马所拉文本难句，未将其调和为“手会离开”。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T05:26:21Z'
review_pass:
  verdict: revise
  source_fidelity: 正文总体忠实保留了送走约柜、不可空手、必须献上אָשָׁם、得医治，以及“他的手”为何未离开他们的结构。惟“献给他”虽可成立，却比原文“归还/送还给他”稍加强了献祭动作；末句脚注所称“古译本”支持“他的手就会……离开”的说法，在所给依据中未获证实，宜删除，免将校勘性推测作为既定异读。
  naturalness: 原译庄重通顺。“不可让它空着离去”略显把约柜拟人化，改作“不可空空地送走它”更贴近现代汉语，也呼应希伯来文重复的“送走”。“你们就会知道，他的手为何不从你们身上离开”比“也会明白……”更直接保留被动/非人称的认知结果。
  terminology: “以色列神的约柜”“赎愆祭”均属汉语圣经传统中可识别的庄重术语；“赎愆祭”宜以脚注说明其赔偿/补偿含义。保留“他的手”，并以脚注简要说明其指神施行审判和降灾的能力，不将该意象替换为单一解释。
