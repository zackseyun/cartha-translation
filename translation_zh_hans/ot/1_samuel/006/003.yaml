  text: וַ/יֹּאמְר֗וּ אִֽם מְשַׁלְּחִ֞ים אֶת אֲר֨וֹן אֱלֹהֵ֤י יִשְׂרָאֵל֙ אַל תְּשַׁלְּח֤וּ אֹת/וֹ֙ רֵיקָ֔ם כִּֽי הָשֵׁ֥ב תָּשִׁ֛יבוּ ל֖/וֹ אָשָׁ֑ם אָ֤ז תֵּרָֽפְאוּ֙ וְ/נוֹדַ֣ע לָ/כֶ֔ם לָ֛/מָּה לֹא תָס֥וּר יָד֖/וֹ מִ/כֶּֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/003.yaml
  text: And they said[a], “If you are sending away the ark of the God of Israel, do not send it away empty, for you must surely return to him a guilt offering. Then you will be healed[b], and it will be made known to you why his hand has not turned away from you.”
translation:
  language: zh_hans
  text: 他们说：“你们若要送走以色列神的约柜，不可空空地送走它；务必向他献上赎愆祭。[a]这样，你们就会痊愈，也会知道他的手为何不从你们身上离开。”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “赎愆祭”也可译作“赔罪祭”或“赔偿祭”。“向他”最自然地指以色列的神；也可理解为把祭物随约柜一同送回。
    reason: 说明אָשָׁם所含罪责和赔偿意义，并保留לּוֹ的句法指代歧义。
  - marker: b
    text: “他的手”是希伯来语常用意象，这里指神施行审判、降下灾祸的能力。
    reason: 说明该文化意象，同时不以未证实的替代读法改写马所拉文本。
lexical_decisions:
- source_word: מְשַׁלְּחִים / תְּשַׁלְּחוּ
  choice: 送走／让……离去
  rationale: 本段指非利士人将约柜送离其境、归还给以色列；译文保留原文动词的重复，同时使现代汉语自然。
- source_word: אֲרוֹן אֱלֹהֵי יִשְׂרָאֵל
  choice: 以色列神的约柜
  rationale: 直接保留原文的属格关系，不增添本节没有出现的“约”字作为名称的一部分。
- source_word: רֵיקָם
  choice: 空着
  rationale: 意为不可不附带礼物或赔偿就送走约柜；“空着”与约柜搭配自然，也保留原文简洁的意象。
- source_word: הָשֵׁב תָּשִׁיבוּ
  choice: 务要……献给
  rationale: 不定式绝对形与限定动词连用，表达强烈的强调和义务；“务要”传达这一语气。这里的“归还”结合祭物，在汉语中以“献给”表达其实际行动。
- source_word: לּוֹ
  choice: 给他
  rationale: 阳性单数代词最自然地指向“以色列神”，而非无生命的约柜；“他”保留个人性的神圣指称。
- source_word: אָשָׁם
  choice: 赎愆祭
  rationale: 该词兼有罪责、补偿以及相应祭物的含义。“赎愆祭”是准确而较为通行的圣经用语，脚注补充现代释义。
- source_word: תֵּרָפְאוּ
  choice: 你们就会痊愈
  rationale: 保留尼法勒词形的被动或结果意味，并符合上下文中灾病得以解除的情境。
- source_word: וְנוֹדַע לָכֶם
  choice: 也会明白
  rationale: 原文可直译为“这事就会让你们知道／为你们所知”；现代汉语用“会明白”自然表达其结果，而不补明原文未说明的认知方式。
- source_word: לָמָּה לֹא תָסוּר יָדוֹ מִכֶּם
  choice: 他的手为什么一直没有离开你们
  rationale: 保留“他的手”这一关于神施行能力与审判的希伯来语意象；“一直没有离开”传达灾祸持续不退的语境。
theological_decisions:
- issue: לּוֹ 的指代对象
  choice: 祭物献“给他”，即以色列的神
  alternative: 把祭物归还“给它”，即随约柜送回
  rationale: 紧邻的“以色列神”和 אָשָׁם 的献祭、赔偿含义较支持神为指代对象；但脚注保留祭物随约柜送回这一句法可能。
- issue: “他的手”的含义
  choice: 在正文中保留“他的手”的比喻
  alternative: 解释性地译为“他的惩罚”或“他所降的灾祸”
  rationale: 这是旧约中具有神学分量的常见意象，表示神施行审判的大能；保留比喻可避免把含义过度限定。
- issue: “为什么”所引出的逻辑关系
  choice: 保留为“会明白他的手为什么一直没有离开你们”
  alternative: 依据古译本或校勘思路理解为“他的手就会从你们身上离开”
  rationale: 马所拉文本明确有 לָמָּה（为什么）及否定词 לֹא，应在正文中忠实保留其较难的表述，不以较顺畅的替代读法改写。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“务要”保留原文强调语气；“赎愆祭”作为必要的祭祀术语，以脚注提供通俗替代说法。正文保留“他的手”和末句的张力，不静默改成解释性结论。
