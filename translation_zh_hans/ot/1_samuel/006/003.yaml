    rationale: 马所拉文本明确读作“为何他的手不从你们身上离开”。在没有具体版本、读法和可靠校勘依据时，不宜声称古译本支持“他的手就会……离开”，否则会误导读者并削弱正文对现有文本的忠实呈现。
  - severity: low
