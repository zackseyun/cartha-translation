base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/016.yaml
  text: When the five rulers of the Philistines saw it[b][a], they returned to Ekron that same day.
translation:
  language: zh_hans
  text: 非利士人的五位首领看见了这一切，就在当天返回以革伦。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“那一天就返回以革伦。”
    reason: 保留 בַּיּוֹם הַהוּא 较贴近字面的时间表达“在那一天”，并反映时间短语与动词结合时可采用的另一种自然汉语语序。
lexical_decisions:
- source_word: וַ/חֲמִשָּׁה סַרְנֵי פְלִשְׁתִּים
  choice: 非利士人的五位首领
  rationale: 该短语指叙事中已经出现的五位非利士城邦统治者。“首领”自然、庄重，也能表达其政治权威；相较“领主”，更符合现代普通话。
- source_word: רָאוּ
  choice: 看见了这一切
  rationale: 希伯来文仅作“看见”，宾语由上下文补足，所指是刚才发生的事。汉语若只说“看见了”略显悬空，因此译作“看见了这一切”，但不进一步限定具体对象。
- source_word: וַ/יָּשֻׁבוּ
  choice: 就……返回
  rationale: 叙事性连续形式表示随后发生的动作；“返回”简洁自然，“就”体现事件的顺承。
- source_word: עֶקְרוֹן
  choice: 以革伦
  rationale: 地名依普通中文圣经传统音译；运动动词“返回”可直接带目的地。
- source_word: בַּ/יּוֹם הַ/הוּא
  choice: 在当天
  rationale: 字面为“在那日”。“在当天”以现代汉语自然表达同一叙事时间关系，同时避免把“同一天”的强调说得过重。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“首领”保留非利士统治者的正式身份；正文不以“领主”等较陈旧称谓增加陌生感。
