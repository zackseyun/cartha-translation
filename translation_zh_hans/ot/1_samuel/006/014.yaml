  text: וְ/הָ/עֲגָלָ֡ה בָּ֠אָה אֶל שְׂדֵ֨ה יְהוֹשֻׁ֤עַ בֵּֽית הַשִּׁמְשִׁי֙ וַ/תַּעֲמֹ֣ד שָׁ֔ם וְ/שָׁ֖ם אֶ֣בֶן גְּדוֹלָ֑ה וַֽ/יְבַקְּעוּ֙ אֶת עֲצֵ֣י הָ/עֲגָלָ֔ה וְ/אֶת הַ֨/פָּר֔וֹת הֶעֱל֥וּ עֹלָ֖ה לַ/יהוָֽה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/014.yaml
  text: The cart came into the field of Joshua the Beth-shemite and stopped there[a], where there was a large stone[c][b]. Then they split up the wood of the cart and offered up the cows as a burnt offering to Yahweh.
translation:
  language: zh_hans
  text: 车来到伯示麦人约书亚的田里[a]，停在那里[b]。那里有一块大石头。他们劈开车的木料，又把母牛献给雅威[c]作燔祭。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“伯示麦的约书亚的田”。原文以“伯示麦的”说明约书亚与伯示麦的关系。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“站在那里”；这里是说车停了下来。
    reason: lexical_alternative
  - marker: c
    text: “雅威”是希伯来文上帝专名יהוה的音译，传统上也常译作“耶和华”或“上主”。
    reason: alternative_reading
lexical_decisions:
- source_word: הָעֲגָלָה
  choice: 车
  rationale: 此处指运送约柜和赎愆礼物的车辆；现代汉语用“车”简洁自然，上下文足以明确其所指。
- source_word: שְׂדֵה יְהוֹשֻׁעַ בֵּית הַשִּׁמְשִׁי
  choice: 伯示麦人约书亚的田
  rationale: “伯示麦的”在希伯来文中修饰约书亚，表明他与伯示麦的关系；译作“伯示麦人约书亚”既准确又符合现代汉语表达。
- source_word: וַתַּעֲמֹד שָׁם
  choice: 停在那里
  rationale: עמד本义为“站立”，用于行进中的车，表示车停下来；“停在那里”自然地传达语境含义。
- source_word: וְשָׁם אֶבֶן גְּדוֹלָה
  choice: 那里有一块大石头
  rationale: 保留原文的地点指示和大石头的存在，同时使用自然清楚的现代汉语句式。
- source_word: וַיְבַקְּעוּ אֶת עֲצֵי הָעֲגָלָה
  choice: 他们劈开车的木料
  rationale: בקע表示劈开、剖开；“车的木料”准确表达车辆木材被当作祭火燃料。
- source_word: הַפָּרוֹת
  choice: 母牛
  rationale: פרות明确指雌性牛；前文说明这些牛正在哺乳，因此“母牛”比“牛犊”或“母犊”准确。
- source_word: הֶעֱלוּ עֹלָה
  choice: 献……作燔祭
  rationale: 这是固定的献祭表达，指把祭牲焚烧献上；“燔祭”保留该祭礼的专门含义。
- source_word: לַיהוָה
  choice: 献给雅威
  rationale: לַ表示祭物献给的对象；יהוה是以色列上帝的专名，此处音译为“雅威”。
theological_decisions:
- issue: 上帝专名יהוה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名יהוה。音译“雅威”明确保留其作为专名的性质；脚注同时说明常见传统译法，避免把不同译法误认为不同称谓。
- issue: 献祭者的身份
  choice: 他们
  alternative: 伯示麦人
  rationale: 希伯来文动词仅以第三人称复数表达行动者，本节没有明说其身份；译文用“他们”保留原文未明确指认的状态，不根据上下文擅自补成“伯示麦人”。
translation_notes:
  register: 采用现代、庄重而清楚的叙事语体。“劈开车的木料”直观呈现他们拆车取柴的动作；“献……作燔祭”保留必要的古代祭礼术语。各脚注标记均紧跟所说明的词语，避免咨询文本中标记位置错置的问题。
