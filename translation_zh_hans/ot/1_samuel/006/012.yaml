  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יִשַּׁ֨רְנָה הַ/פָּר֜וֹת בַּ/דֶּ֗רֶךְ עַל דֶּ֨רֶךְ֙ בֵּ֣ית שֶׁ֔מֶשׁ בִּ/מְסִלָּ֣ה אַחַ֗ת הָלְכ֤וּ הָלֹךְ֙ וְ/גָע֔וֹ וְ/לֹא סָ֖רוּ יָמִ֣ין וּ/שְׂמֹ֑אול וְ/סַרְנֵ֤י פְלִשְׁתִּים֙ הֹלְכִ֣ים אַחֲרֵי/הֶ֔ם עַד גְּב֖וּל בֵּ֥ית שָֽׁמֶשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/012.yaml
  text: And the cows went straight on the road toward Beth-shemesh[a], along one highway; they went on, lowing as they went, and did not turn aside to the right or to the left[c][b]. And the lords of the Philistines were walking behind them as far as the border of Beth-shemesh.
translation:
  language: zh_hans
  text: 母牛径直沿着通往伯示麦的路走，只走一条大道[a]；它们一边走一边哞叫[b]，不偏向右，也不偏向左。非利士人的首领[c]跟在它们后面，一直到伯示麦的边界。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“沿着一条固定的路”。原文强调母牛始终走同一条路线。
    reason: lexical_alternative
  - marker: b
    text: “哞叫”指牛发出的声音；原文表明它们一路走，一路不断叫。
    reason: cultural_note
  - marker: c
    text: 也可译作“非利士人的统治者”。原词是非利士各城邦首领的称号。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִשַּׁרְנָה
  choice: 径直……走
  rationale: 该动词在这里表示沿笔直、直接的路线前进；“径直”既保留方向含义，也符合现代汉语叙事。
- source_word: הַפָּרוֹת
  choice: 母牛
  rationale: 上下文说明这些是正在哺乳的牛（6:7、10）；“母牛”比泛称“牛”更准确，也不误指尚未产犊的幼母牛。
- source_word: בַּדֶּרֶךְ עַל דֶּרֶךְ בֵּית שֶׁמֶשׁ
  choice: 沿着通往伯示麦的路
  rationale: 原文重复“路”，突出明确的行进路线；汉语以流畅表达保留其目的地和路线含义。
- source_word: בִּמְסִלָּה אַחַת
  choice: 只走一条大道
  rationale: מְסִלָּה可指修筑或隆起的道路，“大道”避免让人联想到现代高速公路；“只走一条”体现אַחַת所强调的单一、固定路线。
- source_word: הָלְכוּ הָלוֹךְ
  choice: 一边走一边
  rationale: 有限动词与绝对不定式连用，带有持续进行之意；结合后面的牛叫声译成“一边走一边”，自然传达行进持续不断。
- source_word: וְגָעוֹ
  choice: 哞叫
  rationale: 该词特指牛发出的叫声；“哞叫”是现代汉语中准确、清楚且自然的表达。
- source_word: וְלֹא סָרוּ יָמִין וּשְׂמֹאול
  choice: 不偏向右，也不偏向左
  rationale: 保留סור所含的偏离路线之意，也保留希伯来语“右、左”并列的惯用表达。
- source_word: וְסַרְנֵי פְלִשְׁתִּים
  choice: 非利士人的首领
  rationale: סַרְנֵי是非利士城邦统治者的特定称号；正文用“首领”既自然又保留政治领导者的含义，脚注补充其制度背景。
- source_word: הֹלְכִים אַחֲרֵיהֶם
  choice: 跟在它们后面
  rationale: 分词表示持续伴随的动作；此译清楚呈现首领们一路尾随牛车的情景。
- source_word: עַד גְּבוּל בֵּית שָׁמֶשׁ
  choice: 一直到伯示麦的边界
  rationale: גְּבוּל在此可指地域边界；“边界”准确表达他们到达伯示麦辖区边缘为止。
