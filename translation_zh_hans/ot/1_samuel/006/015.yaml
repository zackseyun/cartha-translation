reference: 1 Samuel 6:15
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/הַ/לְוִיִּ֞ם הוֹרִ֣ידוּ אֶת אֲר֣וֹן יְהוָ֗ה וְ/אֶת הָ/אַרְגַּ֤ז אֲשֶׁר אִתּ/וֹ֙ אֲשֶׁר בּ֣/וֹ כְלֵֽי זָהָ֔ב וַ/יָּשִׂ֖מוּ אֶל הָ/אֶ֣בֶן הַ/גְּדוֹלָ֑ה וְ/אַנְשֵׁ֣י בֵֽית שֶׁ֗מֶשׁ הֶעֱל֨וּ עֹל֜וֹת וַֽ/יִּזְבְּח֧וּ זְבָחִ֛ים בַּ/יּ֥וֹם הַ/ה֖וּא לַֽ/יהוָֽה׀־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/015.yaml
  text: And the Levites took down the ark of Yahweh[a], and the box that was with it, in which were the gold objects, and set them on the great stone[c][b]. And the men of Beth-shemesh offered burnt offerings and sacrificed sacrifices on that day to Yahweh.
translation:
  language: zh_hans
  text: 利未人把雅威[a]的约柜和随同约柜的匣子卸下来；匣子里装着金制物件[b]。他们把约柜和匣子放在那块大石头上[c]。那一天，伯示麦的男子向雅威献上燔祭，也献上祭物[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文为 יהוה（YHWH），这里音译作“雅威”；中文传统也常译作“耶和华”或“上主”。
    reason: alternative_reading
  - marker: b
    text: “金制物件”所译的希伯来词含义较广，也可指金器、器具或其他金制品。
    reason: lexical_alternative
  - marker: c
    text: “放在……上”也可理解为“放到那块大石头旁”或“放在那块大石头那里”。
    reason: textual_ambiguity
  - marker: d
    text: 原文直译近似“献祭祭物”：动词和名词出自同一词根，也蕴含宰杀作为祭物的意思；也可较顺畅地译作“献了祭”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַלְוִיִּם
  choice: 利未人
  rationale: 这是指利未支派的成员；“利未人”是现代中文中清楚、通行的称呼。
- source_word: הוֹרִידוּ
  choice: 卸下来
  rationale: 使役形在此表示把约柜和匣子从运载它们的车上移下；“卸下来”具体而自然。
- source_word: אֲרוֹן יְהוָה
  choice: 雅威的约柜
  rationale: אֲרוֹן 在此是敬拜语境中的约柜；יהוה 作为神的专名音译为“雅威”。
- source_word: הָאַרְגַּז אֲשֶׁר אִתּוֹ
  choice: 随同约柜的匣子
  rationale: “匣子”既与约柜有别，也符合盛放金制物件的容器意象；将代词明确为“约柜”可避免中文歧义。
- source_word: אֲשֶׁר בּוֹ כְלֵי זָהָב
  choice: 匣子里装着金制物件
  rationale: כְלִי 可泛指器具、物品或器皿；“金制物件”不擅自限定其具体种类。
- source_word: וַיָּשִׂמוּ אֶל הָאֶבֶן הַגְּדוֹלָה
  choice: 他们把约柜和匣子放在那块大石头上
  rationale: 复数宾语指约柜和匣子；结合上下文，“放在……上”最符合叙事场景，但介词本身也容许“放到石头旁/石头那里”的理解，故加注说明。
- source_word: וְאַנְשֵׁי בֵית שֶׁמֶשׁ
  choice: 伯示麦的男子
  rationale: אַנְשֵׁי 是明确的阳性复数，译作“男子”保留原文的性别表达。
- source_word: הֶעֱלוּ עֹלוֹת
  choice: 献上燔祭
  rationale: 这是希伯来献祭用语的通行中文表达，并保留燔祭的特定类别。
- source_word: וַיִּזְבְּחוּ זְבָחִים
  choice: 宰献了祭牲
  rationale: 动词与宾语同源，兼有宰杀和献祭之意；“宰献了祭牲”在自然中文中尽量保留两方面含义。
- source_word: בַּיּוֹם הַהוּא לַיהוָה
  choice: 那一天……向雅威
  rationale: 准确表达时间，并以“向”标明祭物所献的对象。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；正文以“雅威”音译，明确将它作为专名处理，同时在脚注中交代中文传统译法。
- issue: 伯示麦献祭者的性别表达
  choice: 伯示麦的男子
  alternative: 伯示麦人
  rationale: 原文 אַנְשֵׁי 为阳性复数。正文保留“男子”，不将其无根据地泛化为全体居民。
- issue: 献祭短语的同源结构
  choice: 宰献了祭牲
  alternative: 献了祭
  rationale: 原文使用同源动词和名词，强调实际宰杀并献祭的行动；所选译法避免把它简化为仅有一般性的“献祭”。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“约柜”“燔祭”等必要的礼仪术语予以保留；其余措辞尽量具体自然。通过拆分长句并明确代词所指，提高中文可读性，同时不消除介词和祭祀表达中的原文张力。
