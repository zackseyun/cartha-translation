id: 1SA.6.5
reference: 1 Samuel 6:5
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/עֲשִׂיתֶם֩ צַלְמֵ֨י עפלי/כם וְ/צַלְמֵ֣י עַכְבְּרֵי/כֶ֗ם הַ/מַּשְׁחִיתִם֙ אֶת הָ/אָ֔רֶץ וּ/נְתַתֶּ֛ם לֵ/אלֹהֵ֥י יִשְׂרָאֵ֖ל כָּב֑וֹד אוּלַ֗י יָקֵ֤ל אֶת יָד/וֹ֙ מֵֽ/עֲלֵי/כֶ֔ם וּ/מֵ/עַ֥ל אֱלֹהֵי/כֶ֖ם וּ/מֵ/עַ֥ל אַרְצְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/005.yaml
  text: So make images of your tumors and images of your mice that are ravaging the land[a], and give glory to the God of Israel. Perhaps he will lighten his hand from upon you, and from upon your gods, and from upon your land.
translation:
  language: zh_hans
  text: 所以，你们要照着自己的肿块[a]和那些毁坏这地的老鼠做出模型，把荣耀归给以色列的上帝。也许他会减轻压在你们、你们的神明和你们土地上的手。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “肿块”也可译作“肿胀”；传统上常译作“痔疮”。希伯来词指身体上的肿胀或肿块，但不能确定具体病症。
    reason: 保留עפלים在病症性质上的词义不确定性。
lexical_decisions:
- source_word: וַעֲשִׂיתֶם
  choice: 所以，你们要……做出
  rationale: 该形式在上下文中承接前文，表达带有结果意味的指示；“所以……要”自然呈现其顺承和劝令语气。
- source_word: צַלְמֵי
  choice: 照着……做出模型
  rationale: צֶלֶם指所制作的形像或复制品；本节涉及作为赔罪礼的实物模型，此译法比单说“像”更清楚自然。
- source_word: עפלי/כם
  choice: 自己的肿瘤
  rationale: 该词指身体上的肿块或肿胀，但具体部位和病症不确定；“肿瘤”保持医学意义上的宽泛性，传统的具体译法放入脚注。
- source_word: וְצַלְמֵי עַכְבְּרֵיכֶם הַמַּשְׁחִיתִם אֶת הָאָרֶץ
  choice: 和那些毁坏这地的老鼠做出模型
  rationale: עַכְבָּר通常指老鼠，也可泛指鼠类；分词הַמַּשְׁחִיתִם表示持续造成破坏。中文中将修饰语紧接“老鼠”，保留其语法关系。
- source_word: וּנְתַתֶּם לֵאלֹהֵי יִשְׂרָאֵל כָּבוֹד
  choice: 把荣耀归给以色列的上帝
  rationale: 直译结构是“给……荣耀”；“把荣耀归给”是现代中文中自然、庄重的表达，也保留承认其权能的含义。
- source_word: אוּלַי
  choice: 也许
  rationale: 表达可能或期望，不把结果说成确定事实。
- source_word: יָקֵל אֶת יָדוֹ מֵעֲלֵיכֶם
  choice: 他会减轻压在你们……上的手
  rationale: 保留“手”的拟人化意象，并以“减轻压在……上的手”表达原文‘使其手变轻’以及מֵעַל所含的重压画面。
- source_word: וּמֵעַל אֱלֹהֵיכֶם וּמֵעַל אַרְצְכֶם
  choice: 你们的神明和你们土地上的
  rationale: 保留三个对象的并列：百姓、他们的神明和土地。“神明”在此清楚指非以色列的诸神，也避免与本句“以色列的上帝”混淆。
theological_decisions:
- issue: עפלים所指疾病的性质
  choice: 肿瘤
  alternative: 痔疮；肿块
  rationale: 希伯来词可指身体肿胀或肿块，却不足以确定具体是痔疮；正文采用较宽泛的“肿瘤”，脚注保留传统译法，避免消除原文的不确定性。
- issue: 是否保留“他的手”这一拟人化表达
  choice: 保留“手”及其重压的意象
  alternative: 译作“惩罚”或“权能”
  rationale: 原文以“手”表现上帝施加的力量和灾害，这一意象在中文中可以理解；若直接解释为“惩罚”或“权能”，会缩窄并淡化原文。
- issue: 非利士人的אֱלֹהִים如何表达
  choice: 你们的神明
  alternative: 你们的神；你们的诸神
  rationale: 原词形式可按单数或复数理解，语境也未要求明确数量。“神明”既自然又不强行判定单复数，保留这一张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“把荣耀归给”保留经文语体；“减轻压在……上的手”刻意保存希伯来文的拟人化和重压意象。脚注标记[a]已置于正文相应词语之后。
