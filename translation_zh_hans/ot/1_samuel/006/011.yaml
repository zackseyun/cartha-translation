base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/011.yaml
  text: Then they put the ark of Yahweh on the cart[a], along with the box and the gold mice and the images of their tumors.
translation:
  language: zh_hans
  text: 他们把耶和华的约柜放在车上，又把那匣子、金老鼠和他们肿块的像[a]一并放在车上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“他们肿胀的像”；也可能指“他们痔疮的像”。
    reason: 原文טְחֹרֵיהֶם所指的具体病症有争议；正文以“肿块”保留较宽泛的含义，脚注列出可能的替代译法。
lexical_decisions:
- source_word: וַיָּשִׂמוּ
  choice: 他们把……放在……上
  rationale: 该叙事性动词承接并推进事件；现代汉语无需机械译出句首的“于是”，用把字句自然表达放置动作。
- source_word: אֲרוֹן יְהוָה
  choice: 耶和华的约柜
  rationale: אֲרוֹן在此指以色列敬拜中的特定圣物，译作“约柜”符合上下文和现代中文圣经惯用语；יהוה以“耶和华”音译，保留专名性质。
- source_word: אֶל הָעֲגָלָה
  choice: 放在车上
  rationale: 介词短语在此表示把物件移放到车辆之上；“在车上”是自然、清楚的现代汉语表达。
- source_word: הָאַרְגַּז
  choice: 那匣子
  rationale: 指盛放赔罪礼物的容器；“匣子”既区别于“约柜”，也比“箱柜”等说法更简洁。定冠词结合前文语境译作“那”。
- source_word: עַכְבְּרֵי הַזָּהָב
  choice: 金老鼠
  rationale: 原文直义为“金制的老鼠”；“金老鼠”在中文中简洁自然，并明确材质。
- source_word: צַלְמֵי טְחֹרֵיהֶם
  choice: 他们毒疮的像
  rationale: צַלְמֵי指所造的形像或模型；טְחֹרֵיהֶם指临到他们身上的病患，但确切医学所指有争议，正文采用较宽泛且符合叙事语境的“毒疮”，脚注保留其他可能。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。中文正文采用读者最熟悉、且作为专名而非称号的传统音译“耶和华”；“雅威”较接近学界常用的拟音，但在普通现代中文读者中不如前者通行。
- issue: טְחֹרֵיהֶם所指的病症
  choice: 毒疮
  alternative: 肿块；痔疮
  rationale: 该词所指病症并不完全确定。“毒疮”保留严重病患的语境而不作过度医学诊断；脚注列出较直义的“肿块”及可能但更具体的“痔疮”。
translation_notes:
  register: 采用自然、庄重而清楚的现代标准汉语。“一并放上去”补足并列成分与同一放置动作的关系，不增添新的事件信息。脚注标记[a]紧接争议词组。
