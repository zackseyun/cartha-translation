base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/010.yaml
  text: 'So the men did so: they took two milk cows and harnessed them to the cart[b][a], and shut up their calves in the house.'
translation:
  language: zh_hans
  text: 那些人就照着做了：他们牵来两头正在哺乳的母牛[a]，把它们套在车上，又把它们的小牛关在屋里[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“两头产奶的母牛”。希伯来语所指的是正在产奶、带有小牛的母牛。
    reason: lexical_alternative
  - marker: b
    text: “关在”也可译作“圈在”。希伯来语称小牛为母牛的“儿子”，即它们的幼崽。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ הָאֲנָשִׁים כֵּן
  choice: 那些人就照着做了
  rationale: “照着做了”自然传达希伯来语“如此行”的惯用表达；“那些人”保留原文对特定男性行动者的指称。
- source_word: שְׁתֵּי פָרוֹת עָלוֹת
  choice: 两头正在哺乳的母牛
  rationale: עָלוֹת在这里指正在产奶、带着幼崽的母牛；“正在哺乳”既自然，也保留母牛与小牛分离所形成的叙事张力。
- source_word: וַיִּקְחוּ
  choice: 牵来
  rationale: 字面义为“取、带来”；用于牛时，“牵来”符合现代汉语习惯，并未增添原文没有的目的信息。
- source_word: וַיַּאַסְרוּם בָּעֲגָלָה
  choice: 把它们套在车上
  rationale: אָסַר本义为“绑、缚”，在役畜与车辆的语境中，“套在车上”准确表达把牛系上车、用于拉车的动作。
- source_word: וְאֶת בְּנֵיהֶם
  choice: 它们的小牛
  rationale: בָּנִים字面为“儿子、后代”，以母牛为先行词时，现代汉语自然表达为“小牛”。
- source_word: כָּלוּ בַבָּיִת
  choice: 关在屋里
  rationale: כָּלוּ在此表示扣住、禁闭；בַּבָּיִת字面是“在屋里”。译文保留具体而简洁的叙述，不擅自改成“牛棚”。
