base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/004.yaml
  text: 'And they said[a], “What is the guilt offering that we should return to him?” They said, “According to the number of the Philistine rulers: five golden tumors and five golden mice[c][b], for one plague was on all of them and on your rulers.”'
translation:
  language: zh_hans
  text: 他们说：“我们应当归还给他的赎愆祭[a]是什么？”他们说：“照非利士首领[b]的数目：五个金制的肿块[c]和五只金制的老鼠；因为一场灾祸临到你们所有人，也临到你们的首领。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “赎愆祭”也可译作“赔偿祭”或“补偿祭”。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“非利士的统治者”或“非利士的领主”。
    reason: lexical_alternative
  - marker: c
    text: 原文很可能指与疫病有关的肿胀或肿块；有些译本更具体地译作“痔疮”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאָשָׁם
  choice: 赎愆祭
  rationale: 该词在祭祀与赔偿语境中指为过犯作补偿的祭物；“赎愆祭”既保留其礼仪性质，也表达补偿过犯之意。
- source_word: נָשִׁיב לוֹ
  choice: 归还给他
  rationale: 使役形的 שוב 表示“使之返回、归还”；阳性单数代词按上下文指向以色列的神，同时保留原文的人称表达。
- source_word: מִסְפַּר סַרְנֵי פְלִשְׁתִּים
  choice: 照非利士统治者的数目
  rationale: 原文结构表达数量上的对应；“照……的数目”在现代汉语中自然清楚。
- source_word: סַרְנֵי
  choice: 统治者
  rationale: 这是非利士主要领袖的称号；“统治者”表达政治权威，又避免“诸侯”等可能带入中国制度背景的词。
- source_word: עפלי זָהָב
  choice: 金肿瘤
  rationale: 该名词大概指瘟疫造成的肿块；“肿瘤”保留具体身体意象，但不武断限定为痔疮。
- source_word: עַכְבְּרֵי זָהָב
  choice: 金老鼠
  rationale: עַכְבָּר通常指老鼠；此译法直接、自然，并保留这些物件由金制成的含义。
- source_word: מַגֵּפָה אַחַת
  choice: 同一场灾祸
  rationale: אַחַת 强调众人所受的是同一个灾害；“同一场”比直译“一场”更清楚呈现本句论证。
- source_word: לְכֻלָּם וּלְסַרְנֵיכֶם
  choice: 临到你们所有人，也临到你们的统治者
  rationale: 介词与“灾祸”连用，表示灾祸施加于众人；按第二人称复数语境明确译作“你们所有人”。
theological_decisions:
- issue: לוֹ 所指的是神还是约柜
  choice: 译作“给他”，按语境指以色列的神
  alternative: 译作“给它”，指约柜
  rationale: 原文是阳性单数代词，并未明说所指对象；上下文讨论因得罪以色列的神而献上的补偿祭，因此正文保留有位格的“他”，但不额外加入“神”一词。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“归还给他”保留原文代词的指向张力；“赎愆祭”体现礼仪与赔偿双重内涵。脚注标记均置于正文相应词语之后，并依出现顺序排列。
