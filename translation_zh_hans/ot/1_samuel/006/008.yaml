source:
  edition: WLC
  text: וּ/לְקַחְתֶּ֞ם אֶת אֲר֣וֹן יְהוָ֗ה וּ/נְתַתֶּ֤ם אֹת/וֹ֙ אֶל הָ֣/עֲגָלָ֔ה וְ/אֵ֣ת כְּלֵ֣י הַ/זָּהָ֗ב אֲשֶׁ֨ר הֲשֵׁבֹתֶ֥ם ל/וֹ֙ אָשָׁ֔ם תָּשִׂ֥ימוּ בָ/אַרְגַּ֖ז מִ/צִּדּ֑/וֹ וְ/שִׁלַּחְתֶּ֥ם אֹת֖/וֹ וְ/הָלָֽךְ־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/008.yaml
  text: Then take the ark of Yahweh and place it on the cart[a], and put the gold objects that you are returning to him as a guilt offering in a box beside it. Then send it away[c][b], and let it go.
translation:
  language: zh_hans
  text: 你们要取耶和华的约柜，放在车上；又要把你们归还给他、作赔罪祭的金制品[a]放在一个匣子[b]里，把匣子放在约柜旁边。然后把它送走，让它走。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “金制品”也可译作“金器”或“金物件”；原词范围较广，可指各种器具或物品。
    reason: lexical_alternative
  - marker: b
    text: “匣子”也可译作“箱子”或“柜子”。
    reason: lexical_alternative
  - marker: c
    text: 原文直译为“把它送走，它就会走”。两个“它”均为阳性单数，语法上指向“约柜”；“车”在原文中为阴性。末句承接指令，表示任约柜离去。
    reason: source_ambiguity
lexical_decisions:
- source_word: אֲרוֹן יְהוָה
  choice: 耶和华的约柜
  rationale: אֲרוֹן在此指神圣的约柜；所属结构自然译为“耶和华的约柜”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代汉语圣经传统中广为人知的专名音译，清楚保留原文的神名。
- source_word: הָעֲגָלָה
  choice: 车
  rationale: עֲגָלָה指运输用的车；上下文已说明是由母牛拉的车，简洁译作“车”自然准确。
- source_word: כְּלֵי הַזָּהָב
  choice: 金制品
  rationale: כְּלִי语义宽泛，可指器物、物件或器皿；上下文中的物品是金制的瘤和老鼠，故不宜限定为“器皿”。
- source_word: הֲשֵׁבֹתֶם לוֹ
  choice: 你们……归还给他的
  rationale: 使役词干的שׁוב在此表示归还或送还；“他”保留原文阳性单数代词，所指为耶和华。
- source_word: אָשָׁם
  choice: 赔罪祭
  rationale: 既保留祭献性质，也表达אָשָׁם所含的罪责与赔偿意味；比仅译“礼物”更忠于原文的礼仪术语。
- source_word: בָאַרְגַּז
  choice: 装在匣子里
  rationale: אַרְגָּז指箱、匣一类容器；“匣子”适合盛放这些金制品，且为现代汉语常用词。
- source_word: מִצִּדּוֹ
  choice: 放在约柜旁边
  rationale: 字面为“在它旁边”；结合语序和场景，最自然的所指是约柜。为避免汉语代词指向含混，在正文中明确为约柜。
- source_word: וְשִׁלַּחְתֶּם אֹתוֹ
  choice: 然后把它送走
  rationale: שׁלח在此为送出、放行；保留“它”而不额外指定所指，以免超出原文。
- source_word: וְהָלָךְ
  choice: 它就会前行
  rationale: 原文形式上是“它将行去”，承接送走的动作；直陈式译法保留其结果性，并避免把它无依据地改成命令“任它走”。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: “耶和华”是普通现代汉语读者最熟悉的专名形式，并清楚区别于通称“主”；不借此处理关于古代准确发音的争论。
- issue: 非利士人语境中的אָשָׁם
  choice: 赔罪祭
  alternative: 赎愆祭；赔偿礼
  rationale: 原叙述者使用具有祭祀和补偿意味的术语。译作“赔罪祭”既保留与罪责有关的祭献性质，也不把后来的完整以色列礼仪制度强加给非利士人的理解。
- issue: 末句וְהָלָךְ的语气
  choice: 它就会前行
  alternative: 任它走；它便走了
  rationale: 希伯来文形式是完成式连续结构，在指示序列中可表示随后发生的结果。采用直陈结果句，保留原文在命令与结果之间的张力。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。以“要”承接连续指示，用分号呈现动作层次；避免古雅的“抬去”“金器皿”“赎愆”等较难懂表达，同时保留祭祀术语、神名以及末句的语法张力。
