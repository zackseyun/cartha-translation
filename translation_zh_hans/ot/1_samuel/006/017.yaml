    text: 或译“金制肿胀物”。希伯来语所指是这些还愿物所代表的身体病患；传统上也更具体地译作“痔疮”。
    reason: 保留原词在病变性质和部位上的词义不确定性，避免正文采用过度具体的医学判断。
  revision_rationale: 修订明确“归还给雅威”与“作为赎愆祭”的修饰关系，并将容易被理解为现代肿瘤疾病的“肿瘤”改为较中性的“肿块”。保留原有逐城、逐一列举的结构，以及神名和祭物术语。
