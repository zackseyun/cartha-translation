base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/017.yaml
  text: 'And these are the golden tumors that the Philistines returned as a guilt offering to Yahweh: one for Ashdod[a], one for Gaza, one for Ashkelon, one for Gath, one for Ekron.'
translation:
  language: zh_hans
  text: 以下是非利士人作为赎愆祭归还给雅威的金制肿块[a]：亚实突一个，迦萨一个，亚实基伦一个，迦特一个，以革伦一个。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“金制肿胀物”。希伯来语所指是这些还愿物所代表的身体病患；传统上也更具体地译作“痔疮”。
    reason: 保留原词在病变性质和部位上的词义不确定性，避免正文采用过度具体的医学判断。
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: 这些……是
  rationale: 承接上文并引出具体清单；汉语无需机械译出句首连接词，仍可由“这些”自然体现衔接。
- source_word: טְחֹרֵי הַזָּהָב
  choice: 金制肿瘤
  rationale: 该词指灾病及代表这灾病的金制还愿物。“肿瘤”保持较宽泛的身体肿胀含义，不把所患部位定得过死；“金制”自然表达其材质。
- source_word: אֲשֶׁר הֵשִׁיבוּ
  choice: 献还
  rationale: 使役词形在此有送回、归还之意；结合祭物语境译作“献还”，兼顾归还行为与献祭用途。
- source_word: פְלִשְׁתִּים
  choice: 非利士人
  rationale: 采用现代中文圣经传统中通行且易识别的族名译法。
- source_word: אָשָׁם
  choice: 赎愆祭
  rationale: 该词指因罪责并带有赔偿性质的祭物；“赎愆祭”是中文中较通行的专门译名，并能与一般赎罪祭区分。
- source_word: לַיהוָה
  choice: 给雅威
  rationale: 直接音译四字神名，保留其作为以色列之神立约名字的性质。
- source_word: לְאַשְׁדּוֹד אֶחָד ... לְעֶקְרוֹן אֶחָד
  choice: 亚实突一个，迦萨一个，亚实基伦一个，迦特一个，以革伦一个
  rationale: 重复“一个”保留原文逐城列举、每城对应一件祭物的结构；地名采用通行中文译名。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较贴近学界通常重构的读音，也明确保留专名性质，不以称号替代。
- issue: אָשָׁם 的祭物类别
  choice: 赎愆祭
  alternative: 赔罪祭
  rationale: 原词同时涉及罪责与补偿；正文采用中文读者较熟悉的祭名“赎愆祭”，但不据此扩展本节未明说的祭仪细节。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。保留原文简洁的清单句式，以重复“一个”呈现五座非利士城各自对应一件金制祭物；脚注说明关键病名的真实词义歧义。
