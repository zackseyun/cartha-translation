  text: וְ/עַתָּ֣ה שָׁמַ֔עְתִּי כִּ֥י גֹזְזִ֖ים לָ֑/ךְ עַתָּ֗ה הָ/רֹעִ֤ים אֲשֶׁר לְ/ךָ֙ הָי֣וּ עִמָּ֔/נוּ לֹ֣א הֶכְלַמְנ֗וּ/ם וְ/לֹֽא נִפְקַ֤ד לָ/הֶם֙ מְא֔וּמָה כָּל יְמֵ֖י הֱיוֹתָ֥/ם בַּ/כַּרְמֶֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/007.yaml
  text: And now I have heard that you have shearers. Now your shepherds[a], who were with us, we did not mistreat, and nothing of theirs was missing all the days they were in Carmel.
translation:
  language: zh_hans
  text: 现在，我听说你那里正在剪羊毛。如今，你的牧羊人曾和我们在一起；我们没有欺辱他们[a]。他们在迦密的那些日子，什么也没有少。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我们没有使他们蒙羞。”希伯来语动词可指使人受辱；在这里也可泛指没有刁难、欺压他们。
    reason: 保留 לֹא הֶכְלַמְנוּם 的“使人蒙羞”义及其在牧人受保护这一语境中的较宽含义。
lexical_decisions:
- source_word: וְעַתָּה
  choice: 现在
  rationale: 作为话语转换和时间标记，引出大卫眼下的请求；现代汉语中无需另加生硬的连接词。
- source_word: שָׁמַעְתִּי כִּי
  choice: 我听说
  rationale: 希伯来语完成式在此表达刚得知且与当前有关的消息；“听说”自然涵盖其后的报道内容。
- source_word: גֹזְזִים לָךְ
  choice: 你正在剪羊毛
  rationale: 字面为“有剪毛的人为你剪毛”，所指是拿八正值剪羊毛的时节；译文采用自然汉语，但不增添宴席等上下文信息。
- source_word: הָרֹעִים אֲשֶׁר לְךָ
  choice: 你的牧人
  rationale: 将“属于你的牧人”自然地译为领属结构。
- source_word: הָיוּ עִמָּנוּ
  choice: 曾和我们在一起
  rationale: 保留 עִם 的共同在场含义，不进一步解释为住宿或受雇。
- source_word: לֹא הֶכְלַמְנוּם
  choice: 我们没有欺负他们
  rationale: כלם 的使役式可指使人蒙羞、受辱；在保护牧群的语境中也包含没有刁难或侵害之意。“欺负”以通顺现代汉语表达实际语境，同时用脚注保留更贴近字面的羞辱义。
- source_word: וְלֹא נִפְקַד לָהֶם מְאוּמָה
  choice: 没有丢失过任何东西
  rationale: נפקד 在此为“缺少、失落”；汉语以主动经验式表达牧人所有之物没有损失，避免生硬照译与格结构。
- source_word: כָּל יְמֵי הֱיוֹתָם בַּכַּרְמֶל
  choice: 他们在迦密的那些日子
  rationale: 保留整个停留期间的时间范围；“迦密”按犹大地名处理。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“现在”保留开头的时间推进；第二个 עַתָּה 未机械重复，以免汉语累赘，其当前语境由后句直接承接。句子分为三句，使口头传话清楚流畅。
