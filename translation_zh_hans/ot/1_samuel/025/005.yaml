base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/005.yaml
  text: So David sent ten young men[a], and David said to the young men, “Go up to Carmel, and go to Nabal, and greet him in my name with peace.”
translation:
  language: zh_hans
  text: 于是，大卫派了十个年轻人。大卫对他们说：“你们上迦密去，到拿八那里，以我的名义向他问安[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“以我的名义问他是否平安。”
    reason: 保留וּשְׁאֶלְתֶּם לוֹ בִשְׁמִי לְשָׁלוֹם既可作为问安惯用语、也可较直译为询问其平安状况的表达空间。
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: 派了
  rationale: 叙事中自然表达差遣之意；比“打发”更符合现代普通话。
- source_word: עֲשָׂרָה נְעָרִים
  choice: 十个年轻人
  rationale: נְעָרִים可指年轻人或仆役；原文在此并未明说其身份，故不具体化为“仆人”。
- source_word: עֲלוּ כַרְמֶלָה
  choice: 上迦密去
  rationale: 保留עלה所表达的上行，也自然传达地名所带方向词尾的趋向意义。
- source_word: וּבָאתֶם אֶל נָבָל
  choice: 到拿八那里
  rationale: 按中文差遣语境自然表达“前往并到达某人那里”，避免机械译作“来到”。
- source_word: וּשְׁאֶלְתֶּם לוֹ ... לְשָׁלוֹם
  choice: 向他问安
  rationale: 这是询问对方平安、福祉的问候表达；“问安”简洁自然，同时保留“询问平安”的语义。
- source_word: בִשְׁמִי
  choice: 以我的名义
  rationale: 直接保留“奉我名／以我名”的代表性含义，且符合现代汉语。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“问安”避免生硬的“以平安向他问候”，脚注则呈现原文较直译的结构。
