base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/010.yaml
  text: Nabal answered David’s servants and said[a], “Who is David? And who is the son of Jesse? These days many servants are breaking away, each man from before his master.”
translation:
  language: zh_hans
  text: 拿八回答大卫的仆人说：“大卫是谁？耶西的儿子是谁？如今，各自挣脱主人而去的仆人多起来了。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作：“如今，仆人增多了；他们一个个挣脱而离开自己的主人。”希伯来文此处直译为“各人从自己主人面前”。
    reason: 保留רַבּוּ“增多”的动态意味，以及אִישׁ מִפְּנֵי אֲדֹנָיו“各人离开自己的主人”的分配性和字面空间意象。
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: 回答……说
  rationale: 保留希伯来叙事中“回答并说”的话语引介功能，同时采用自然的现代汉语表达，避免生硬重复“回答……又说”。
- source_word: עַבְדֵי דָוִד
  choice: 大卫的仆人
  rationale: עבד可指仆人、奴仆或臣属；这里指大卫派来的随从或使者。“仆人”既贴近原词，也不额外强化奴隶身份。
- source_word: מִי דָוִד וּמִי בֶן־יִשָׁי
  choice: 大卫是谁？耶西的儿子是谁？
  rationale: 保留重复的疑问句和“耶西的儿子”这一称呼，使拿八轻蔑、否认其地位的口吻仍可由上下文呈现，而不把修辞疑问明说成解释。
- source_word: הַיּוֹם
  choice: 如今
  rationale: 此处并非仅指当天，而是对当前世道作概括；“如今”简洁、自然，并符合本句略带讥讽的泛论语气。
- source_word: רַבּוּ
  choice: 多起来了
  rationale: רבה在这里是“增多、变得众多”；译成“多起来了”保留其动态意味，而不只静态地说“有许多”。
- source_word: עֲבָדִים הַמִּתְפָּרְצִים
  choice: 挣脱……而去的仆人
  rationale: פרץ的反身形在此表示强行挣开、脱离；“挣脱……而去”保留力度，却不把行为进一步定性为正式叛乱。
- source_word: אִישׁ מִפְּנֵי אֲדֹנָיו
  choice: （仆人）挣脱主人而去
  rationale: איש在此有逐一、各自之意，מִפְּנֵי字面为“从……面前”，整体表示离开主人。正文将这一分配性关系自然融入定语，脚注另存较贴近原句次序的译法。
- source_word: אֲדֹנָיו
  choice: 主人
  rationale: 此处指仆人的人间主上；“主人”准确表达社会关系，也避免“主”可能引起的神学联想。
theological_decisions:
- issue: 拿八所问“大卫是谁”是否应显译为轻蔑或否认
  choice: 保留原文疑问形式，不在正文添加“算什么”等解释性措辞
  alternative: “大卫算什么？耶西的儿子算什么？”
  rationale: 上下文强烈暗示轻蔑，但原文本身仍采用“谁”的疑问形式；保留形式可让修辞力度由语境显出，避免替读者消除原有张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“如今”与“多起来了”传达拿八对时势的讥讽概括；全文不加入原文没有的敬称或宗派性解释。
