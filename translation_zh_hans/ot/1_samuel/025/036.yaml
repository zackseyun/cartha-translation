  text: וַ/תָּבֹ֣א אֲבִיגַ֣יִל אֶל נָבָ֡ל וְ/הִנֵּה ל/וֹ֩ מִשְׁתֶּ֨ה בְּ/בֵית֜/וֹ כְּ/מִשְׁתֵּ֣ה הַ/מֶּ֗לֶךְ וְ/לֵ֤ב נָבָל֙ ט֣וֹב עָלָ֔י/ו וְ/ה֥וּא שִׁכֹּ֖ר עַד מְאֹ֑ד וְ/לֹֽא הִגִּ֣ידָה לּ֗/וֹ דָּבָ֥ר קָטֹ֛ן וְ/גָד֖וֹל עַד א֥וֹר הַ/בֹּֽקֶר׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/036.yaml
  text: When Abigail came to Nabal[a], behold, he was holding a feast in his house like the feast of a king, and Nabal’s heart was merry within him, and he was very drunk. So she told him nothing at all, small or great[b], until the light of morning.
translation:
  language: zh_hans
  text: 亚比该来到拿八那里，只见他正在家里举行筵席，如同君王的筵席。拿八心里畅快，且酩酊大醉。亚比该无论大事小事[a]，什么都没有告诉他，直到晨光出现[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“小事或大事”，是总括说法，意思是“任何事都没有”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“直到天亮。”希伯来文直译为“直到早晨的光”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּבֹא אֲבִיגַיִל אֶל נָבָל
  choice: 亚比该回到拿八那里
  rationale: וַתָּבֹא 推进叙事；结合前文亚比该外出迎见大卫的场景，现代汉语用“回到”自然表达她来到拿八所在之处，同时不额外说明具体地点。
- source_word: וְהִנֵּה
  choice: 只见
  rationale: 保留希伯来语提示读者注意眼前场景的功能，比直译“看哪”更符合现代汉语叙事。
- source_word: מִשְׁתֶּה בְּבֵיתוֹ
  choice: 正在家里大摆筵席
  rationale: מִשְׁתֶּה 指设宴欢饮；“摆筵席”自然表达其活动，“大”结合下文与君王筵席的比较，传达盛大场面而不必重复解释饮酒。
- source_word: כְּמִשְׁתֵּה הַמֶּלֶךְ
  choice: 如同君王的筵席
  rationale: 保留原文的明喻及 הַמֶּלֶךְ 的定冠结构；汉语“君王的筵席”庄重自然，并突出奢盛程度。
- source_word: וְלֵב נָבָל טוֹב עָלָיו
  choice: 拿八心里畅快
  rationale: 这是表示内心欢快、兴致高昂的习语；“心里畅快”既保留“心”的意象，也避免在醉酒语境中误译为道德上的“心好”。
- source_word: וְהוּא שִׁכֹּר עַד מְאֹד
  choice: 而且酩酊大醉
  rationale: עַד מְאֹד 强烈修饰醉酒程度；“酩酊大醉”是自然且明确的现代汉语表达。
- source_word: וְלֹא הִגִּידָה לוֹ
  choice: 因此……什么都没有告诉他
  rationale: 上下文显示亚比该因拿八醉得厉害而暂不告知；“因此”清楚呈现语境中的结果关系，但不增添动机细节。
- source_word: דָּבָר קָטֹן וְגָדוֹל
  choice: 无论大事小事，什么都没有
  rationale: 原文以“小与大”的总括表达“任何事都不说”；汉语调整为惯用顺序“大事小事”，并以“什么都没有”明确其否定范围，同时在脚注保留原文字面顺序。
- source_word: עַד אוֹר הַבֹּקֶר
  choice: 直到晨光出现
  rationale: 保留“早晨之光”的具体意象，又以“出现”组成自然的现代汉语时间表达。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“只见”承接场景转换，“心里畅快”保留希伯来语心灵意象；两个脚注分别说明总括式习语和时间短语的字面表达。
