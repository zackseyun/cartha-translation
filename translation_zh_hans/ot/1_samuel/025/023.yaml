  text: וַ/תֵּ֤רֶא אֲבִיגַ֨יִל֙ אֶת דָּוִ֔ד וַ/תְּמַהֵ֕ר וַ/תֵּ֖רֶד מֵ/עַ֣ל הַ/חֲמ֑וֹר וַ/תִּפֹּ֞ל לְ/אַפֵּ֤י דָוִד֙ עַל פָּנֶ֔י/הָ וַ/תִּשְׁתַּ֖חוּ אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/023.yaml
  text: When Abigail saw David[a], she hurried and got down from the donkey, and fell before David on her face and bowed to the ground.
translation:
  language: zh_hans
  text: 亚比该看见大卫，就急忙从驴上下来，伏倒在大卫面前，脸贴着地，俯伏下拜[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“俯伏在地”。希伯来语动词既可指深深下拜，也可指全身俯伏；这里描述亚比该向大卫表示尊敬和臣服，不一定指宗教意义上的敬拜。
    reason: 说明词义范围，并防止将向人的礼敬动作误解为对神的敬拜。
lexical_decisions:
- source_word: וַתֵּרֶא
  choice: 看见
  rationale: ראה在此是普通的视觉动词；“看见”自然、准确，不额外强化为“瞥见”或“认出”。
- source_word: וַתְּמַהֵר
  choice: 急忙
  rationale: מהר表示迅速行动；“急忙”保留叙事中的紧迫感，也符合现代汉语表达。
- source_word: וַתֵּרֶד מֵעַל הַחֲמוֹר
  choice: 从驴上下来
  rationale: 直译其从所骑牲畜上向下移动的动作；比“下驴”自然，比“翻身下驴”少添动作细节。
- source_word: וַתִּפֹּל לְאַפֵּי דָוִד
  choice: 伏在大卫面前
  rationale: 保留“在大卫面前倒伏”的臣服姿态，不译成原文未明说的“伏在大卫脚前”。
- source_word: עַל פָּנֶיהָ
  choice: 脸贴着地
  rationale: 以自然现代汉语表达身体正面朝下、脸向地面的具体姿势，并保留原文对“脸”的明确提及。
- source_word: וַתִּשְׁתַּחוּ אָרֶץ
  choice: 俯伏下拜
  rationale: שׁחה在这里表示向人行深度敬礼或俯伏致敬；“俯伏下拜”传达动作强度，又不误导为对神的敬拜。
theological_decisions:
- issue: 在人与人的场景中如何翻译שׁחה
  choice: 俯伏下拜
  alternative: 敬拜；向地俯伏
  rationale: 此动作是亚比该向大卫表示尊敬和臣服，并不必然具有宗教敬拜含义。“俯伏下拜”保留礼敬姿态，同时避免把大卫当作受神圣敬拜的对象。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“伏在……面前，脸贴着地，俯伏下拜”保留原文连续描写的三个身体动作，虽有适度语义重叠，却反映希伯来文刻意强调的谦卑姿态。
