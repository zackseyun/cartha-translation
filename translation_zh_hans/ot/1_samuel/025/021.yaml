  text: וְ/דָוִ֣ד אָמַ֗ר אַךְ֩ לַ/שֶּׁ֨קֶר שָׁמַ֜רְתִּי אֶֽת כָּל אֲשֶׁ֤ר לָ/זֶה֙ בַּ/מִּדְבָּ֔ר וְ/לֹא נִפְקַ֥ד מִ/כָּל אֲשֶׁר ל֖/וֹ מְא֑וּמָה וַ/יָּֽשֶׁב לִ֥/י רָעָ֖ה תַּ֥חַת טוֹבָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/021.yaml
  text: David had said, “Surely I have guarded all that belongs to this man in the wilderness for nothing, so that not a thing of all that belonged to him was missing; and he has repaid me evil for good.”
translation:
  language: zh_hans
  text: 大卫先前说：“我在旷野保护这人的一切财物，真是白费了！他所有的，没有一样失落；他却以恶报我所行的善。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַךְ לַשֶּׁקֶר
  choice: 真是白费了
  rationale: אַךְ在此加强语气，לַשֶּׁקֶר表示行动徒然、没有得到应有回报；此译法自然传达大卫的愤懑。
- source_word: שָׁמַרְתִּי
  choice: 保护
  rationale: 该动词基本义为看守、守护；在上下文中，大卫及其部下使拿八的财物免遭损失，译作“保护”较符合实际作用。
- source_word: כָּל אֲשֶׁר לָזֶה
  choice: 这人的一切财物
  rationale: 原文直译为“这人所有的一切”；结合下文财物毫无失落，补出汉语所需的“财物”，不限定具体种类。
- source_word: וְלֹא נִפְקַד ... מְאוּמָה
  choice: 没有一样失落
  rationale: נִפְקַד在此表示缺少或失去；“没有一样失落”保留原文对财物完整无缺的强调。
- source_word: וַיָּשֶׁב לִי רָעָה תַּחַת טוֹבָה
  choice: 他却以恶报善
  rationale: 采用现代汉语中自然而庄重的固定表达，准确保留“以恶代替善回报我”的鲜明对照。
theological_decisions:
- issue: וְדָוִד אָמַר的叙事时序
  choice: 大卫先前说
  alternative: 大卫说
  rationale: 希伯来语形式本身可作普通过去时，但上下文显示亚比该前来时，大卫已经说过这些话；“先前”在汉语中清楚表达这一背景时序，而不把它误解为原文另有“现在”一词。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“这人”保留大卫对拿八带有距离感的称呼；“真是白费了”及“却以恶报善”传达原文强烈的失望和控诉语气。
