review_pass:
  verdict: revise
  source_fidelity: 译文整体准确反映了逐人佩刀、大卫也佩刀、约四百人随大卫上去以及二百人留下的叙事。惟“跟随他的人”把לַאֲנָשָׁיו（他的部下／手下的人）的“跟随”意味提前加入称谓中，虽不严重，却不如原文中性准确；“留在物资旁”略显生硬，且中文容易理解为单纯空间上的“旁边”。
  naturalness: “佩上自己的刀”自然且适合庄重叙事。改用“他的部下”更凝练贴合军事处境；“留在物资那里”较符合现代汉语，也仍不加入“看守”的解释。
  terminology: “刀”可恰当地对应חֶרֶב；“佩上”准确表达军事语境中的束上／佩带。“物资”可作为כֵּלִים在此行军语境中的宽泛译法，脚注保留“行装”“装备”等可能解释是合宜的。
