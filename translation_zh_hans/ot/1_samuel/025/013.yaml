revisions:
- from: 大卫对跟随他的人说：“你们各人都佩上自己的刀！”他们就各自佩上自己的刀，大卫也佩上了自己的刀。约有四百人跟随大卫上去，另有二百人留在物资旁[a]。
  to: 大卫对他的部下说：“你们各人都佩上自己的刀！”于是他们各人都佩上自己的刀，大卫也佩上了自己的刀。约有四百人跟随大卫上去；二百人留在物资那里[a]。
  rationale: 修订仅消除“跟随他的人”对称谓的轻微增译，并使“留在物资旁”的中文更自然。其余措辞保留原译对希伯来文重复、约数、方向性和物资含义宽度的良好处理。
