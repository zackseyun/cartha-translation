    rationale: לַאֲנָשָׁיו直译为“对他的 men／部下”，本身并未在此称谓中使用“跟随”的表达；下文才以אַחֲרֵי大卫明确说众人随大卫上去。
  - severity: low
    issue: “留在物资旁”中文表达略不自然。
    rationale: עַל־הַכֵּלִים在此可指留在随队物资、行装或装备处；“留在物资那里”保留其宽泛性和留后之意，且不擅自补出“看守”。
