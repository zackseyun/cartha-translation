base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/013.yaml
  text: Then David said to his men[a], “Each man strap on his sword.” So each man strapped on his sword, and David also strapped on his sword. About four hundred men went up after David, while two hundred stayed with the supplies.
translation:
  language: zh_hans
  text: 大卫对他的部下说：“你们各人都佩上自己的刀！”于是他们各人都佩上自己的刀，大卫也佩上了自己的刀。约有四百人跟随大卫上去；二百人留在物资那里[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “物资”也可译作“行装”或“装备”。
    reason: 希伯来语כֵּלִים含义较广，可指器具、装备、行装或随队携带的物品；上下文不能把具体类别限定得更窄。
lexical_decisions:
- source_word: לַאֲנָשָׁיו
  choice: 对跟随他的人
  rationale: 在此军事语境中指大卫手下的人；译文避免泛化为普通“人们”，也不把他们特定称为仆人。
- source_word: חִגְרוּ / וַיַּחְגְּרוּ / וַיַּחְגֹּר
  choice: 佩上
  rationale: חגר在武器语境中指束上、佩带；“佩上”既保留具体动作，也符合现代汉语对刀剑的自然表达。
- source_word: אִישׁ אֶת־חַרְבּוֹ
  choice: 各人都佩上自己的刀
  rationale: 保留אִישׁ的逐人分配意味，以及第三人称所有格所表达的“自己的刀”。
- source_word: חַרְבּוֹ
  choice: 自己的刀
  rationale: חֶרֶב特指刀剑类兵器，不宜泛译为“武器”；“刀”在此简洁自然。
- source_word: גַּם
  choice: 也
  rationale: 明确大卫本人同样参与佩刀。
- source_word: וַיַּעֲלוּ אַחֲרֵי דָוִד
  choice: 跟随大卫上去
  rationale: 同时保留עלה的“上去”和אַחֲרֵי的跟随含义。
- source_word: כְּאַרְבַּע מֵאוֹת אִישׁ
  choice: 约有四百人
  rationale: 数字前的כְּ表示约数，译作“约有”保留其近似意味。
- source_word: יָשְׁבוּ
  choice: 留在
  rationale: 此处不是强调坐姿，而是说这些人没有随队前进，仍留在原处。
- source_word: עַל־הַכֵּלִים
  choice: 在物资旁
  rationale: כֵּלִים可指器具、装备、行装或物资；结合行军场景，“物资”较清楚，而“在……旁”保留עַל在此处的位置关系，不直接增添“看守”的含义。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。重复“佩上自己的刀”以保留希伯来文有意的动作复现；将脚注标记置于其实际解释的“物资”之后。
