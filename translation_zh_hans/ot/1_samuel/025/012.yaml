id: 1SA.25.12
reference: 1 Samuel 25:12
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יַּהַפְכ֥וּ נַעֲרֵֽי דָוִ֖ד לְ/דַרְכָּ֑/ם וַ/יָּשֻׁ֨בוּ֙ וַ/יָּבֹ֔אוּ וַ/יַּגִּ֣דוּ ל֔/וֹ כְּ/כֹ֖ל הַ/דְּבָרִ֥ים הָ/אֵֽלֶּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/012.yaml
  text: So David’s young men turned back on their way[a], and they returned and came and told him all these words.
translation:
  language: zh_hans
  text: 于是，大卫的年轻人转身原路返回。他们回去，来到大卫那里，把这一切话[a]都告诉了他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这一切事”。希伯来语“话”也可指事情或事件；此处因所报告的是拿八说出的答复，正文译作“话”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּהַפְכוּ
  choice: 转身原路返回
  rationale: הפך在此处表示改变行进方向，而非字面意义上的“翻转”；结合לְדַרְכָּם，译为“转身原路返回”自然地表达折返。
- source_word: נַעֲרֵי דָוִד
  choice: 大卫的年轻人
  rationale: נַעַר可指年轻人、侍从或仆人；此处这些人奉大卫差遣传话。“年轻人”保留其基本词义，又不额外限定其身份。
- source_word: לְדַרְכָּם
  choice: 原路
  rationale: 字面为“往他们的路”；在转身的语境中，“原路”简洁表达他们沿来路折返，但不具体添加路线信息。
- source_word: וַיָּשֻׁבוּ וַיָּבֹאוּ
  choice: 他们回去，来到大卫那里
  rationale: 分别保留“返回”和“来到”两个连续动作，以反映希伯来叙事的动词链；补出“大卫那里”是依据后接代词“他”明确中文所需的到达对象。
- source_word: וַיַּגִּדוּ לוֹ
  choice: 都告诉了他
  rationale: נגד在此表示把消息报告给某人；“告诉了他”是现代汉语中自然、准确的说法。
- source_word: כְּכֹל הַדְּבָרִים הָאֵלֶּה
  choice: 这一切话
  rationale: דְּבָרִים既可指“话”，也可指“事情”；这里所报告的是拿八先前所说的答复，因此正文采用“话”，同时以脚注保留另一可能。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言；适度保留原文“回去—来到—告诉”的连续动作，避免过度压缩希伯来语的叙事节奏。
