base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/044.yaml
  text: Saul had given Michal his daughter[a], David’s wife, to Palti son of Laish, who was from Gallim.
translation:
  language: zh_hans
  text: 扫罗已经把女儿米甲，就是大卫的妻子，给了迦琳人拉亿的儿子帕提[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “帕提”是本节希伯来文所用的名字形式；撒母耳记下3:15称他为“帕铁”。
    reason: 说明同一人物在相关经文中的希伯来名字形式差异，避免读者误以为是不同的人。
lexical_decisions:
- source_word: וְ/שָׁאוּל
  choice: 扫罗
  rationale: 句首וְ承接上下文，但现代汉语无须机械译作“并且”；由语序自然体现叙事衔接，也不增添原文没有的时间副词。
- source_word: נָתַן
  choice: 已经……给了
  rationale: 完成式在本段叙事中指此前已经完成的行动；“已经……给了”自然表达其先于当前叙事时点。保留“给”而不明确增译“嫁”，避免超出动词本身所表达的范围。
- source_word: מִיכַל בִּתּוֹ
  choice: 女儿米甲
  rationale: 以自然汉语表达同位关系，清楚指出米甲是扫罗的女儿。
- source_word: אֵשֶׁת דָּוִד
  choice: 就是大卫的妻子
  rationale: 忠实表达附加说明，突出米甲当时与大卫的婚姻关系，同时不替原文消解其中的张力。
- source_word: לְ/פַלְטִי בֶן לַיִשׁ
  choice: 给了……拉亿之子帕提
  rationale: 介词לְ标明接受者；“拉亿之子”按常见汉语谱系表达处理，专名依希伯来文音译。
- source_word: אֲשֶׁר מִ/גַּלִּים
  choice: 来自迦琳的
  rationale: 关系从句说明帕提的籍贯；前置作定语符合现代汉语表达。
theological_decisions:
- issue: 米甲与大卫的婚姻身份及扫罗将她给另一人的张力
  choice: 保留“就是大卫的妻子”与“给了”并列
  alternative: 译作“原是大卫的妻子”或“改嫁给”
  rationale: 原文直接称米甲为“大卫的妻子”，并说扫罗把她给了帕提；译文保留这两项陈述，不以“原是”暗示关系已经终止，也不以“改嫁”替文本作法律或神学判断。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“已经”交代先前完成的动作；“就是”清楚标示同位说明。地名和人名采用简体中文圣经语境中易辨识的音译。
