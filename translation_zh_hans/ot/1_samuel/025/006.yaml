base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/006.yaml
  text: 'And say this: ‘To the living one: Peace to you[a], peace to your house[b], and peace to all that is yours.’'
translation:
  language: zh_hans
  text: 你们要这样说：“愿你长寿！[a]愿你平安，[b]愿你家平安，愿你所有的一切也都平安。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “愿你长寿”所译的希伯来语字面近于“向着生命”或“给活着的人”，很可能是祝愿或问候。也可理解为“向活着的人问安”。
    reason: alternative_reading
  - marker: b
    text: “平安”所译的希伯来语 שָׁלוֹם 也包含安康、完好或兴盛的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲמַרְתֶּם
  choice: 你们要……说
  rationale: 连接词加完成式在连续指令中具有命令语气；用“你们要说”自然表达复数对象所领受的吩咐。
- source_word: כֹּה
  choice: 这样
  rationale: 此词引出随后要传达的话；“这样”准确而符合现代汉语习惯。
- source_word: לֶחָי
  choice: 愿你长寿
  rationale: 字面近于“向着生命”或“给活着的人”，在本段语境中很可能是向拿八所说的祝愿或问候。“愿你长寿”保留生命与祝福的含义，同时以自然汉语表达；原文的困难与其他理解在脚注中说明。
- source_word: וְאַתָּה שָׁלוֹם
  choice: 愿你平安
  rationale: 原文是省略动词的名词句，表达祝愿。“愿你平安”在汉语中清楚传达其祝福语气，并保留后文反复出现的“平安”。
- source_word: וּבֵיתְךָ שָׁלוֹם
  choice: 愿你家平安
  rationale: “家”既可指房屋，也可涵盖家人和整个家室；此译保留希伯来语意象，并符合汉语问安习惯。
- source_word: וְכֹל אֲשֶׁר לְךָ שָׁלוֹם
  choice: 愿你所有的一切也都平安
  rationale: 原文把祝愿扩展到属于拿八或由他照管的一切。“所有的一切”保持范围的宽泛性，“也都”自然承接三重祝愿。
- source_word: שָׁלוֹם
  choice: 平安
  rationale: שָׁלוֹם 不只表示没有冲突，也可包含安康、完好和兴盛；“平安”是简洁、庄重且能承载较广含义的对应词。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的祝愿句式。以四次“愿”明确原文省略动词的祝福语气，并保留三重“平安”的修辞结构；对难解的 לֶחָי 不作无提示的单一化处理，而在正文采用最可能的习语义，在脚注保留其字面形式与另一种理解。
