source:
  edition: WLC
  text: וַ/יָּ֤קָם אָדָם֙ לִ/רְדָפְ/ךָ֔ וּ/לְ/בַקֵּ֖שׁ אֶת נַפְשֶׁ֑/ךָ וְֽ/הָיְתָה֩ נֶ֨פֶשׁ אֲדֹנִ֜/י צְרוּרָ֣ה בִּ/צְר֣וֹר הַ/חַיִּ֗ים אֵ֚ת יְהוָ֣ה אֱלֹהֶ֔י/ךָ וְ/אֵ֨ת נֶ֤פֶשׁ אֹיְבֶ֨י/ךָ֙ יְקַלְּעֶ֔/נָּה בְּ/ת֖וֹךְ כַּ֥ף הַ/קָּֽלַע־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/029.yaml
  text: Though a man has risen to pursue you and to seek your life[a], yet the life of my lord shall be bound in the bundle of the living with Yahweh your God[b], and the lives of your enemies he shall sling out from the hollow of the sling.
translation:
  language: zh_hans
  text: 即使有人起来追赶你，要取你的性命[a]，我主的性命必与雅威——你的上帝一同系在活人之囊中[b]；至于你仇敌的性命，他必从投石带的兜中甩出去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “性命”也可译作“生命”或“本人”。这里指有人企图杀害大卫。
    reason: 说明 נֶפֶשׁ 在本处的语境义，避免按“灵魂”理解。
  - marker: b
    text: 直译“系在活人之囊中”。原文描绘贵重之物被包裹、捆扎起来妥善保存的形象；不必将它专门解释为来世。
    reason: 解释较陌生的希伯来保全意象，同时保留其神学开放性。
lexical_decisions:
- source_word: וַיָּקָם אָדָם
  choice: 即使有人起来
  rationale: 将 waw + qatal 理解为让步性的处境，而非单纯叙事顺序；“有人”自然表达此处一个具体的人，并未将其泛化为全人类。
- source_word: לִרְדָפְךָ וּלְבַקֵּשׁ אֶת נַפְשֶׁךָ
  choice: 追赶你，要取你的性命
  rationale: רדף 表示敌意追赶；נפש 在此指人的性命。“取你的性命”以自然汉语明确表达致命意图。
- source_word: נֶפֶשׁ אֲדֹנִי
  choice: 我主的性命
  rationale: 保留亚比该对大卫的敬称，并与后文仇敌的“性命”形成平行。
- source_word: צְרוּרָה בִּצְרוֹר הַחַיִּים
  choice: 安稳地包在活人之囊中
  rationale: 保留“包裹／捆扎在囊中”的具体保管意象；“安稳地”传达这一被包存之物受到妥善保全的语用含义，而“活人之囊”保留 הַחַיִּים 的复数实体色彩。
- source_word: אֵת יְהוָה אֱלֹהֶיךָ
  choice: 与雅威你的上帝同在
  rationale: 此处 אֵת 表示关联或相伴；“与……同在”保留性命在上帝那里蒙保守的空间性隐喻，而不改写成解释性的“由……保护”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以常见汉语音译呈现上帝的专名，不用称号替代。
- source_word: וְאֵת נֶפֶשׁ אֹיְבֶיךָ
  choice: 至于你仇敌的性命
  rationale: נפש 为单数集合用法，故保留“性命”单数，同时“至于”清楚标示它与大卫蒙保全之间的强烈对照。
- source_word: יְקַלְּעֶנָּה
  choice: 他必……甩出去
  rationale: 动词 קלע 特指用机弦甩射；结合后面的“机弦”保留其动作意象，同时使用自然汉语。“他”依上下文指雅威。
- source_word: בְּתוֹךְ כַּף הַקָּלַע
  choice: 从机弦的窝中
  rationale: כף 原指手掌或凹处，此处为机弦容纳石子的兜状部位；“窝”简洁保留其凹陷形象。
theological_decisions:
- issue: 大卫蒙保全与仇敌被除去之间的比喻对照
  choice: 保留“包在活人之囊中”与“从机弦的窝中甩出去”的具体对照。
  alternative: 将两幅图像概括为“上帝必保护你并消灭仇敌”，或把“活人之囊”明确解释为永生。
  rationale: 希伯来文本以两幅鲜明图像表达上帝的保全和审判，但本节本身没有展开来世教义；译文既不淡化图像，也不加入超出文本的体系性解释。
- issue: אֵת יְהוָה 所表达的关系
  choice: 译作“与雅威你的上帝同在”。
  alternative: 译作“蒙雅威你的上帝保守”或“由雅威你的上帝包裹”。
  rationale: “与……同在”较直接地保留关联义及其可能的空间隐喻，避免把隐含的保守意义变成语法上明说的施事关系。
- issue: 仇敌之 נֶפֶשׁ 的数
  choice: 采用集合性的单数“你仇敌的性命”。
  alternative: 按汉语逻辑复数化为“你仇敌们的性命”。
  rationale: 原文 נֶפֶשׁ 为单数而“仇敌”是复数；保留集合性单数既忠于形式，也维持与“我主的性命”的对称。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“我主”保留古代敬称语境；“雅威”呈现神名。“活人之囊”和“机弦的窝”刻意保留原文互相对照的实体意象，并以脚注帮助普通读者理解。所有脚注标记均已置于正文相应位置。
