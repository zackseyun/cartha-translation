base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/024.yaml
  text: She fell at his feet and said[a], “On me, my lord, be the guilt. Please let your servant speak in your hearing[b], and hear the words of your servant.”
translation:
  language: zh_hans
  text: 她俯伏在他脚前，说[a]：“我主啊，罪责归我！求你容婢女[b]向你陈说，请听婢女的话。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我主啊，这罪在我身上。”希伯来语原句十分简练，直译近于“在我身上，我主啊，这罪责”。
    reason: lexical_alternative
  - marker: b
    text: “婢女”原文是特指女性仆役的词，在这里也是亚比该自谦的称呼。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּפֹּל עַל־רַגְלָיו
  choice: 她俯伏在他脚前
  rationale: 原文直译近于“倒在他的脚上”，在此表示恳求和降卑；“俯伏在他脚前”符合现代汉语叙事习惯，也保留了动作与姿态。
- source_word: בִּי אֲנִי אֲדֹנִי הֶעָוֹן
  choice: 我主啊，罪责归我
  rationale: 这是压缩而强调的希伯来语表达，意为说话者主动把罪责归到自己身上。“罪责归我”既保留“在我身上”的意象，又比逐字译法自然。
- source_word: אֲדֹנִי
  choice: 我主啊
  rationale: 此处是亚比该对大卫的尊称，并非对上帝的称呼；“我主”保留其郑重、谦恭的社会语体。
- source_word: וּתְדַבֶּר־נָא
  choice: 求你容……说
  rationale: 未完成式带נָא表达恳切而礼貌的请求；“求你容”准确传达请求准许发言的语气。
- source_word: אֲמָתְךָ / אֲמָתֶךָ
  choice: 婢女
  rationale: 原词特指女性仆役，也是女性自谦称呼。“婢女”简洁地保留性别、自谦和社会地位色彩；正文重复两次，以对应原文的重复。
- source_word: בְּאָזְנֶיךָ
  choice: 说给你听
  rationale: 原文直译为“在你耳中”，是“让你听见”的惯用表达；“说给你听”在现代汉语中自然清楚。
- source_word: וּשְׁמַע אֵת דִּבְרֵי אֲמָתֶךָ
  choice: 也请听婢女的话
  rationale: 保留“听”与“话”的直接搭配，并以“也请”延续恳求语气。
