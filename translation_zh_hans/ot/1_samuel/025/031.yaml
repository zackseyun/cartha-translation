revisions:
- from: 这事就不至于使我主痛苦[a]，成为心里的绊脚石[b]——因为你曾无故流血，或因为我主曾靠自己救自己[c]。雅威善待我主的时候，请你记念你的婢女[d]。
  to: 这事就不至于使我主因无故流血，或因亲自为自己伸冤[c]，而日后痛苦[a]、心中有绊脚石[b]。雅威恩待我主的时候，求你记念你的婢女[d]。
  rationale: 修订消除了把被劝阻的流血行动译成过去既成事实的问题，并将不自然的“靠自己救自己”改为符合上下文和现代汉语的“亲自为自己伸冤”。脚注仍保留该动词“为自己施行拯救”的字面表达。其余神名、敬称、女性自称及两个内心痛苦意象均予保留。
