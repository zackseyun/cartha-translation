  source_fidelity: 草稿大体传达了亚比该劝大卫不要自行流血和报复的意思，也正确保留了“雅威”、敬称“我主”及阴性自称“婢女”。但“这事就不至于使我主痛苦”遗漏了原文中“给你／对你”的受词关系；而“因为你曾无故流血”把尚未发生、正被劝阻的行动误作既成事实。“靠自己救自己”虽试图保留词面意义，却不合现代汉语搭配，且未充分表达此处与自行伸冤相连的语境意义。
  naturalness: “使我主痛苦，成为心里的绊脚石——因为……”的句法关系略显生硬。“使我主因……而日后痛苦、心中有绊脚石”能以自然庄重的现代汉语表达原文所说日后良心上的痛苦，同时保持两项并列意象。
  terminology: “雅威”“我主”“婢女”均合适，应保留。“无故流血”准确。将“为自己救自己”修订为“亲自为自己伸冤”，并以脚注保留“为自己施行拯救”的字面表达，可兼顾语境与词汇张力。
