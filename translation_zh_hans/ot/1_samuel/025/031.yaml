  text: וְ/לֹ֣א תִהְיֶ֣ה זֹ֣את לְ/ךָ֡ לְ/פוּקָה֩ וּ/לְ/מִכְשׁ֨וֹל לֵ֜ב לַ/אדֹנִ֗/י וְ/לִ/שְׁפָּךְ דָּם֙ חִנָּ֔ם וּ/לְ/הוֹשִׁ֥יעַ אֲדֹנִ֖/י ל֑/וֹ וְ/הֵיטִ֤ב יְהוָה֙ לַֽ/אדֹנִ֔/י וְ/זָכַרְתָּ֖ אֶת אֲמָתֶֽ/ךָ׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/031.yaml
  text: 'And this will not be a cause of grief to you or a stumbling block of heart to my lord: either that you have shed blood without cause or that my lord has avenged himself[a]. And when Yahweh has dealt well with my lord[d][c][b], then remember your servant.'
translation:
  language: zh_hans
  text: 这事就不至于使我主因无故流血，或因亲自为自己伸冤[c]，而日后痛苦[a]、心中有绊脚石[b]。雅威恩待我主的时候，求你记念你的婢女[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “痛苦”所译的希伯来词十分罕见，也可理解为“使人踉跄的缘由”“触犯”或“悔恨的缘由”。这里似乎指日后痛苦的懊悔。
    reason: lexical_alternative
  - marker: b
    text: 直译“心的绊脚石”，指内心或良心上的障碍与不安。
    reason: lexical_alternative
  - marker: c
    text: 直译“我主为自己施行拯救”。在本段语境中，指大卫亲自报复、为自己伸冤。
    reason: ambiguity
  - marker: d
    text: 希伯来语明确是阴性称谓“你的婢女”，是亚比该谦卑的自称。
    reason: lexical_note
lexical_decisions:
- source_word: לְפוּקָה
  choice: 使……痛苦
  rationale: 这是一个罕见名词，可能指令人踉跄、震动或事后痛悔的缘由。这里指大卫若贸然流血，日后将承受的内心痛苦；译文采用自然汉语，同时以脚注保留词义的不确定性。
- source_word: מִכְשׁוֹל לֵב
  choice: 心里的绊脚石
  rationale: 基本保留希伯来语“心的绊脚石”这一比喻，表达良心上的障碍或不安，而不直接把它窄化为单一解释。
- source_word: לַאדֹנִי / אֲדֹנִי
  choice: 我主
  rationale: 亚比该以敬语称呼大卫；“我主”保留其谦恭的社会语域，在上下文中并非神性称谓。
- source_word: לִשְׁפָּךְ דָּם חִנָּם
  choice: 无故流血
  rationale: חִנָּם在这里指没有正当理由、无辜或徒然的流血。“无故流血”简洁地保留其道德含义。
- source_word: לְהוֹשִׁיעַ אֲדֹנִי לוֹ
  choice: 我主曾靠自己救自己
  rationale: 动词通常意为“拯救、解救”，而反身性的לוֹ强调为自己采取行动。上下文暗含亲自报复或自行伸冤，但正文保留原文“救自己”的张力，并在脚注说明语境含义。
- source_word: וְהֵיטִב יְהוָה
  choice: 雅威善待……的时候
  rationale: 连词加完成式在预告性的言语中自然表达将来的时间关系；“善待”体现雅威将福祉赐给大卫。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译直接呈现四字神名，区别于作为称号的“主”。
- source_word: אֲמָתֶךָ
  choice: 你的婢女
  rationale: 该词明确为阴性，既指女性仆人，也是亚比该谦卑的自称；“婢女”同时保留性别和礼貌语气。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。正文采用“雅威”这一汉语音译，以保留其作为专名而非称号的性质。
- issue: לְהוֹשִׁיעַ ... לוֹ是“救自己”还是“为自己报仇”
  choice: 正文作“靠自己救自己”，脚注交代语境中的自行伸冤含义
  alternative: 亲自报仇；为自己伸冤
  rationale: 词汇本义是“拯救”，叙事语境则明显涉及大卫以暴力报复拿八。正文保留这种本义与语境之间的张力，避免把解释直接取代原文。
translation_notes:
  register: 采用现代、庄重而可懂的书面汉语。保留亚比该反复称大卫为“我主”的恭敬口吻，并用“婢女”呈现她的女性身份和自谦语气。句中破折号标明后两项是前述痛苦与内心绊脚石的具体缘由。
