  text: They were a wall around us both by night and by day[b][a], all the days we were with them tending the flock.
translation:
  language: zh_hans
  text: 在我们与他们一同牧放羊群[a]的所有日子里，他们夜间和白天都像一堵墙，护卫着我们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “羊群”原文是集合词，可包括绵羊和山羊。
    reason: lexical_alternative
lexical_decisions:
- source_word: חוֹמָה
  choice: 像墙一样
  rationale: 保留“墙”的具体比喻，同时以“像……一样”自然表达其保护作用。
- source_word: הָיוּ עָלֵינוּ
  choice: 护卫我们
  rationale: 介词 עַל 字面可作“在我们之上”，但与“墙”连用时表达保护性的临在；译作“护卫我们”符合现代汉语，也不把比喻改成抽象名词。
- source_word: גַּם לַיְלָה גַּם יוֹמָם
  choice: 昼夜都
  rationale: 简洁保留 גם…גם 所强调的夜间和白天持续不断的保护。
- source_word: כָּל יְמֵי הֱיוֹתֵנוּ עִמָּם
  choice: 我们和他们一起……的那些日子
  rationale: 将带代词后缀的不定式结构自然转换成现代汉语时间从句，并保留“所有日子”的范围。
- source_word: רֹעִים הַצֹּאן
  choice: 放羊
  rationale: רעה 表示牧放、照料；צאן 是可包括绵羊和山羊的小型牲畜集合词。汉语“放羊”在此自然地概括牧放羊群的活动。
