base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/042.yaml
  text: Abigail quickly got up and rode on the donkey, with five of her young women going after her; she went after David's messengers and became his wife.
translation:
  language: zh_hans
  text: 亚比该急忙起来，骑上驴；她的五个侍女随侍在她身边。她随后跟着大卫的使者去了，作了大卫的妻子。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתְּמַהֵר וַתָּקָם
  choice: 急忙起来
  rationale: 既保留动作迅速的含义，也以自然现代汉语表达连续动作。
- source_word: נַעֲרֹתֶיהָ
  choice: 她的五个侍女
  rationale: 此处指随侍亚比该的年轻女性；“侍女”比泛称“年轻女子”更符合叙事语境。
- source_word: הַהֹלְכוֹת לְרַגְלָהּ
  choice: 跟在她身后
  rationale: 希伯来语字面为“行在她脚后”，惯用义是随行、跟随；此译保留队列关系且自然。
- source_word: וַתֵּלֶךְ אַחֲרֵי מַלְאֲכֵי דָוִד
  choice: 她跟随大卫的使者去了
  rationale: 保留“在……之后走/跟随”的表达，并用“去了”体现叙事推进。
- source_word: וַתְּהִי לוֹ לְאִשָּׁה
  choice: 作了大卫的妻子
  rationale: 希伯来语直义为“成为他的妻子”；明确代词所指可避免中文歧义。
