base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/003.yaml
  text: The man's name was Nabal[a], and his wife's name was Abigail. The woman was intelligent and beautiful in appearance, but the man was harsh and evil in his dealings; he was a Calebite.
translation:
  language: zh_hans
  text: 那人名叫拿八，妻子名叫亚比该。那女人聪慧，容貌美丽；那男人却为人刚硬，行为恶劣。他是迦勒族人[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文此处大概指“迦勒族人”，即迦勒宗族的一员；原文的书写形式不寻常，也有人认为可能有别的读法。
    reason: textual_variant
lexical_decisions:
- source_word: נָבָל
  choice: 拿八
  rationale: 人名按现代中文圣经通行形式音译；本节语境也可能使读者联想到该名的普通词义，但正文不将名字意译。
- source_word: אֲבִגָיִל
  choice: 亚比该
  rationale: 采用现代中文圣经中通行、易辨识的人名音译。
- source_word: טוֹבַת שֶׂכֶל
  choice: 聪慧
  rationale: 原文指有良好的悟性、见识或判断力；“聪慧”自然简洁，并保留正面的才智评价。
- source_word: וִיפַת תֹּאַר
  choice: 容貌美丽
  rationale: 原文具体描述外形或容貌之美；此译法自然且不削弱其身体外貌层面的含义。
- source_word: קָשֶׁה
  choice: 性情粗暴
  rationale: 该词本义为刚硬、严厉；在人物性格及人际语境中，“性情粗暴”比单译“刚硬”更清楚自然。
- source_word: רַע מַעֲלָלִים
  choice: 行为恶劣
  rationale: מַעֲלָלִים 指行为、作为或行事方式；“行为恶劣”既保留道德负面评价，也符合现代汉语表达。
- source_word: כלבו
  choice: 迦勒族人
  rationale: 依传统读法理解为族属名称，即迦勒宗族的人；原文字形不寻常，其他理解的可能性在脚注中保留。
theological_decisions:
- issue: וְהוּא כלבו 的解释
  choice: 他是迦勒族人
  alternative: 属于迦勒家；或按不寻常的书写形式作其他理解
  rationale: 这主要是文本与词汇问题。传统读法将其理解为迦勒族属，最切合叙事背景；但原文字形特殊，因此不在正文中假装毫无歧义，而以脚注提示。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。两组人物描写以“却”形成鲜明对比；不添加原文没有的时间副词。脚注标记置于相关族属判断之后。
