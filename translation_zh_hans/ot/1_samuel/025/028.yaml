source:
  edition: WLC
  text: שָׂ֥א נָ֖א לְ/פֶ֣שַׁע אֲמָתֶ֑/ךָ כִּ֣י עָשֹֽׂה יַעֲשֶׂה֩ יְהוָ֨ה לַֽ/אדֹנִ֜/י בַּ֣יִת נֶאֱמָ֗ן כִּי מִלְחֲמ֤וֹת יְהוָה֙ אֲדֹנִ֣/י נִלְחָ֔ם וְ/רָעָ֛ה לֹא תִמָּצֵ֥א בְ/ךָ֖ מִ/יָּמֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/028.yaml
  text: Please forgive the transgression of your servant[a], for Yahweh will surely make my lord a lasting house, because my lord fights Yahweh’s battles, and evil will not be found in you all your days.
translation:
  language: zh_hans
  text: 求你饶恕婢女的过犯，因为雅威必定为我主建立一个稳固的家[a]；因为我主一向为雅威争战，在你一生的日子里，也必找不到你有什么恶行[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“可靠的家”或“长存的王朝”。这里的“家”主要指稳固长存的家系，并非仅指住所或家庭。
    reason: 说明 בַּיִת נֶאֱמָן 的家系隐喻及可行译法。
  - marker: b
    text: “恶行”所译的希伯来词也可指祸患或灾害。
    reason: 保留 רָעָה 在道德邪恶与祸患之间的词义幅度。
lexical_decisions:
- source_word: שָׂא נָא לְפֶשַׁע
  choice: 求你饶恕……的过犯
  rationale: “举起／承担过犯”在此是请求宽恕的习语；“求你”体现 נָא 的恳求语气，“过犯”保留 פֶשַׁע 的道德分量。
- source_word: אֲמָתֶךָ
  choice: 婢女
  rationale: 该词明确指女性仆人；“婢女”保留亚比该自谦的女性称谓，并符合庄重的叙事语域。
- source_word: עָשֹׂה יַעֲשֶׂה
  choice: 必定……建立
  rationale: 不定式绝对式与限定动词连用，强化动作的确定性；“必定”体现这一强调，“建立”自然表达为某人创立并稳固一个家系。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以通行的现代汉语音译呈现上帝的专名，而不以称号替代。
- source_word: בַּיִת נֶאֱמָן
  choice: 一个永固的家
  rationale: “家”保留希伯来文的家系／王室隐喻和经文互文性；“永固”传达 נֶאֱמָן 在此处可靠、稳固、持久的含义。
- source_word: מִלְחֲמוֹת יְהוָה
  choice: 雅威的战事
  rationale: “战事”既可涵盖具体战斗，也能表达为雅威的事业而争战，语气较“战争”更贴合上下文。
- source_word: נִלְחָם
  choice: 争的是
  rationale: 分词表示持续或特征性的行动；此表达说明大卫一贯所参与之争战的性质。
- source_word: וְרָעָה לֹא תִמָּצֵא בְךָ
  choice: 也必查不出你有恶事
  rationale: 保留被动概念“不得在你身上发现”，同时用自然汉语表达；“恶事”以道德意义为主，但不完全排除该词所含的祸害意味。
- source_word: מִיָּמֶיךָ
  choice: 你一生之中
  rationale: 这是表示一生期间的惯用说法；译文避免生硬直译为“从你的日子”。
theological_decisions:
- issue: “家”的王朝／家系含义
  choice: 正文译作“永固的家”，脚注说明家系或王朝含义
  alternative: 长存的王朝；稳固的家
  rationale: 保留“家”这一重要圣经隐喻，不把潜在的王朝应许直接收窄为技术性政治术语，同时帮助现代读者理解其所指。
- issue: רָעָה 的道德与灾祸语义
  choice: 正文译作“恶事”
  alternative: 祸患；邪恶
  rationale: 上下文着重劝阻大卫流无辜人的血，因此道德意义较突出；脚注保留该词也可指祸患或灾害的语义可能，避免过度消解歧义。
translation_notes:
  register: 采用现代、庄重且可朗读的标准普通话。“婢女”“我主”保留亚比该恭敬自谦的说话姿态；整体句式保持两个 כִּי 所表达的因果推进，但以分号降低汉语中连续重复“因为”的滞重感。
