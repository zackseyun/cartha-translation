  to: 求你饶恕婢女的过犯，因为雅威必定为我主建立一个稳固的家[a]；因为我主一向为雅威争战，在你一生的日子里，也必找不到你有什么恶行[b]。
  rationale: 将“永固”改为“稳固”，避免超过原文“可靠、坚固”的语义力度；将“争的是雅威的战事”改为“为雅威争战”，使汉语自然并保留争战是为雅威而进行的含义；重构末句以消除“查不出你有恶事”的句法滞碍，同时保留“恶不在你身上被发现”和“一生之中”的表达。脚注相应将“恶事”改为“恶行”。
