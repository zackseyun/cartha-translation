  text: וְ/הָ֣/אֲנָשִׁ֔ים טֹבִ֥ים לָ֖/נוּ מְאֹ֑ד וְ/לֹ֤א הָכְלַ֨מְנוּ֙ וְ/לֹֽא פָקַ֣דְנוּ מְא֔וּמָה כָּל יְמֵי֙ הִתְהַלַּ֣כְנוּ אִתָּ֔/ם בִּֽ/הְיוֹתֵ֖/נוּ בַּ/שָּׂדֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/015.yaml
  text: Yet the men were very good to us[a], and we were not mistreated[b], nor did we miss anything all the days we went about with them while we were in the field.
translation:
  language: zh_hans
  text: 可是，那些人待我们非常好[a]；我们没有受辱，也没有丢失任何东西[b]。我们在野外与他们同行的所有日子，都是如此。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“那些人对我们十分友善。”
    reason: “好”在这里可指善待或友善的行为。
  - marker: b
    text: 或译：“也没有任何东西短少。”
    reason: 原文可侧重没有发现任何财物缺失。
lexical_decisions:
- source_word: וְהָאֲנָשִׁים
  choice: 可是，那些人
  rationale: וְ 结合上下文可带转折语气，回应拿八对大卫一行人的敌意评价；אֲנָשִׁים直译为“人”，此处用“那些人”自然指大卫的部下。
- source_word: טֹבִים לָנוּ מְאֹד
  choice: 待我们非常好
  rationale: טוֹבִים与לָנוּ连用，表达他们给“我们”的善待；“待我们非常好”保留原文朴素而强烈的肯定。
- source_word: וְלֹא הָכְלַמְנוּ
  choice: 我们没有受辱
  rationale: כלם的Hofal形态是被动，核心义为“被羞辱、受辱”。选择“没有受辱”比宽泛的“没有受欺负”更贴近词义，同时在上下文中自然。
- source_word: וְלֹא פָקַדְנוּ מְאוּמָה
  choice: 也没有丢失任何东西
  rationale: 否定式פקד与מְאוּמָה在此表示没有发现任何东西短少或遗失；译文明确传达财物毫无损失。
- source_word: כָּל יְמֵי הִתְהַלַּכְנוּ אִתָּם
  choice: 我们跟他们一起往来的那些日子……一直都是这样
  rationale: התהלך表达持续或反复的走动、交往。“一起往来”兼顾活动与相处的含义；“一直都是这样”承接כָּל יְמֵי所强调的整个时段。
- source_word: בִּהְיוֹתֵנוּ בַּשָּׂדֶה
  choice: 就是我们在野外的时候
  rationale: 该时间从句说明双方相处发生在田野或牧场环境。“野外”在现代汉语中比“田里”更符合牧放牲畜的场景。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而口语可懂的叙事体。“受辱”保留希伯来文被动语态及荣辱色彩；分为三句以提高普通读者的可读性，同时用“一直都是这样”保持原句时间范围对前述两个否定陈述的统摄。
