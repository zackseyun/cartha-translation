base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/038.yaml
  text: And about ten days later[a], Yahweh struck Nabal, and he died.
translation:
  language: zh_hans
  text: 约十天后[a]，雅威击打拿八，拿八死了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“过了约十天”。希伯来语表示大约十天的一段时间。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: 后
  rationale: 该叙事形式承接并推进事件；汉语用时间短语中的“后”自然表达事件的先后，无须生硬译作“事情发生了”。
- source_word: כַּעֲשֶׂרֶת הַיָּמִים
  choice: 约十天后
  rationale: 前缀כַּ־表示约数，“约十天后”既保留大约十天的含义，也自然呈现与前事的时间关系。
- source_word: וַיִּגֹּף
  choice: 击打
  rationale: נָגַף表示击打或使受重创，常用于神施行的行动；“击打”保留原文的直接性，同时不擅自说明疾病等具体方式。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常用音译呈现四字神名，保留其专名性质，不以称号替代。
- source_word: אֶת נָבָל
  choice: 拿八
  rationale: אֶת是直接宾语标记，在汉语中不另译；人名按通行圣经译名译作“拿八”。
- source_word: וַיָּמֹת
  choice: 他就死了
  rationale: 直译死亡这一后续事件；“就”自然衔接叙事结果，但没有把两个动词合并成解释性更强的“击杀”。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文使用的是神的专名；音译“雅威”保留专名性质，避免以称号替代。
- issue: 神击打与拿八死亡之间的因果表达
  choice: 雅威击打拿八，他就死了
  alternative: 雅威把拿八击杀了；雅威降灾给拿八，使他死了
  rationale: 原文以两个连续动词分别叙述雅威击打和拿八死亡。此译明确保留事件关联，却不把它们压缩为“击杀”，也不额外指定击打的方式。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“约十天后”符合当代叙事习惯；“击打”保留原文力度及方式上的未确定性。脚注标记已在正文中对应呈现。
