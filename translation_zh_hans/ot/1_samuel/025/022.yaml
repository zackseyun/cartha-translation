base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/022.yaml
  text: May God do so to David’s enemies[a], and more also[b], if by morning I leave so much as one male of all who belong to him.
translation:
  language: zh_hans
  text: 愿上帝这样惩罚大卫的仇敌[a]，并且加重惩罚；若到早晨我还让属他的人中有一个男丁[b]存留。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些解释者认为，“大卫的仇敌”是抄写者用来避讳的说法，实际所指可能是“大卫”或“我”，因为这种誓言通常是说话人咒诅自己。
    reason: textual_variant
  - marker: b
    text: 希伯来语字面作“对着墙撒尿的”，是一个粗俗的习语，指男性。
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה ... וְכֹה יֹסִיף
  choice: 愿上帝这样惩罚……并且加倍惩罚
  rationale: 这是希伯来语常见的起誓兼自咒公式。“惩罚”补明语境中隐含的降祸含义；“并且加倍惩罚”以自然、庄重的现代汉语表达“还要加上”的加强语气。
- source_word: אֱלֹהִים
  choice: 上帝
  rationale: 尽管该词在形态上是复数形式，这里搭配单数动词，并在誓言公式中指独一的神；“上帝”是自然清楚的普通话表达。
- source_word: לְאֹיְבֵי דָוִד
  choice: 大卫的仇敌
  rationale: 忠实保留马所拉文本的实际措辞，不在正文中暗改为更符合通常自咒公式的“大卫”或“我”；其疑难在脚注中说明。
- source_word: אִם
  choice: 如果
  rationale: 在誓言中引出条件句，实际含义由前面的咒诅公式限定，即说话人断言自己绝不会让这种情况发生。中文保留原文的条件结构及其张力。
- source_word: אַשְׁאִיר
  choice: 我还让……留下
  rationale: 使役形表示“使之留下、让其存留”。此处不译作“饶过”，以免把语义解释得过满。
- source_word: מִכָּל אֲשֶׁר לוֹ
  choice: 他所有的人中
  rationale: 字面可指“凡属他的”，但下文明确限定为人；此译在中文中自然，也符合眼前语境。
- source_word: עַד הַבֹּקֶר
  choice: 到了早晨
  rationale: 自然表达原文所设的时间界限，同时保留“直到早晨”的基本意象。
- source_word: מַשְׁתִּין בְּקִיר
  choice: 一个男丁
  rationale: 该粗俗习语字面意为“对着墙撒尿的”，在这里指男性。“一个男丁”清楚传达所指，也与否定语境中的“一个也不留”相合；字面措辞收入脚注。
theological_decisions:
- issue: 誓言公式中的马所拉文本“大卫的仇敌”
  choice: 正文保留“大卫的仇敌”
  alternative: 按通常的自咒誓言理解为“大卫”或“我”
  rationale: 所给希伯来文本明确写“大卫的仇敌”，即使这在上下文中显得反常，也不应默默订正。脚注交代这可能是抄写传统中的避讳性代称，从而保存文本上的真实疑难。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。正文保留希伯来誓言的条件结构和马所拉文本的反常措辞；以省略号表示誓言的咒诅后果由固定公式含蓄表达，而不擅自补出具体灾祸。
