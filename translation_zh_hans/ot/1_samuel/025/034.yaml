source:
  edition: WLC
  text: וְ/אוּלָ֗ם חַי יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁ֣ר מְנָעַ֔/נִי מֵ/הָרַ֖ע אֹתָ֑/ךְ כִּ֣י לוּלֵ֣י מִהַ֗רְתְּ ו/תבאתי לִ/קְרָאתִ֔/י כִּ֣י אִם נוֹתַ֧ר לְ/נָבָ֛ל עַד א֥וֹר הַ/בֹּ֖קֶר מַשְׁתִּ֥ין בְּ/קִֽיר־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/034.yaml
  text: But as Yahweh[a], the God of Israel, lives, who has kept me from harming you, if you had not hurried and come to meet me, surely by the light of morning not one male would have been left to Nabal.
translation:
  language: zh_hans
  text: 然而，我指着永活的雅威——以色列的神起誓，就是那位阻止我加害于你的神：要不是你赶快来迎接我，到了早晨天亮时，拿八家中必不会留下一个男子[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来原文直译为“向墙撒尿的”，是一个粗俗的说法，指男性。
    reason: 保留原文粗俗习语的字面形象和语气，同时使正文清楚易懂。
lexical_decisions:
- source_word: וְאוּלָם
  choice: 然而
  rationale: 作为转折和话语推进语，引出大卫与先前可能发生之事相对照的郑重断言。
- source_word: חַי יְהוָה
  choice: 我指着永活的雅威……起誓
  rationale: 这是希伯来语标准起誓公式；汉语补出语用上隐含的“起誓”，自然传达其庄严效力，同时保留“永活”这一核心表述。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以常见音译呈现四字神名，不用称号代替专名。
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: 以色列的神
  rationale: 直接表达原文的从属结构和对雅威身份的说明。
- source_word: אֲשֶׁר מְנָעַנִי מֵהָרַע אֹתָךְ
  choice: 他拦阻了我，不让我伤害你
  rationale: מנע表示阻止或约束；הרע在此指大卫本来会施加的伤害。保留第二人称阴性单数“你”，不擅自改成“你们”或“你家”。
- source_word: כִּי לוּלֵי מִהַרְתְּ וַתָּבֹאתִי לִקְרָאתִי
  choice: 你若没有赶快来迎接我
  rationale: 按反事实条件表达，准确反映对亚比该所用的阴性单数动词，并以自然汉语呈现“赶快”和“迎接”。
- source_word: עַד אוֹר הַבֹּקֶר
  choice: 到了早晨天亮时
  rationale: 兼顾עַד的时限意义和“早晨的光”这一时间表达。
- source_word: מַשְׁתִּין בְּקִיר
  choice: 男子
  rationale: 原文直译为“向墙撒尿的”，是粗俗且带轻蔑色彩的男性称谓；正文用现代汉语可理解的“男子”，脚注保留原文修辞。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；正文以音译“雅威”保留其专名性质，而不以称号替换。
- issue: אֲשֶׁר 从句与起誓公式的关系
  choice: 将“他拦阻了我”作为对雅威的说明
  alternative: 将整句处理为较松散的独立陈述
  rationale: 原文关系从句明确修饰雅威；译文用冒号承接，既保持句法关系，也符合现代汉语表达。
- issue: “伤害你”所指范围
  choice: 保留单数“你”
  alternative: 译作“伤害你家”或“害你们”
  rationale: 原文宾语是阴性单数，直接指亚比该；上下文虽涉及拿八全家，正文不应替原文消解这一张力。
translation_notes:
  register: 采用庄重而现代的叙事语言。“我指着永活的雅威……起誓”传达希伯来语誓言公式；破折号标明“以色列的神”是同位说明。正文避免古奥措辞，并将粗俗习语置于脚注说明。
