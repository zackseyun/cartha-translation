  rationale: 修订明确了原文反事实条件的语义，调整“属于拿八的人”为自然的“拿八家中”，并以“加害于你”更贴近原文措辞。神名、誓言的庄严语气、对亚比该的单数称呼及粗俗习语脚注均予保留。
