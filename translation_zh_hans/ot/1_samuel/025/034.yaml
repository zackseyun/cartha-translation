  - severity: low
    issue: “拿八所有的男子”略显生硬且重复
    rationale: לְנָבָל指属拿八、与拿八有关的人；“拿八家中”在中文中自然表达这一关系。“一个男子也不留下”已足以表达全称否定，无须“所有的”。
