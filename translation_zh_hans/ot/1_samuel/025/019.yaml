  text: וַ/תֹּ֤אמֶר לִ/נְעָרֶ֨י/הָ֙ עִבְר֣וּ לְ/פָנַ֔/י הִנְ/נִ֖י אַחֲרֵי/כֶ֣ם בָּאָ֑ה וּ/לְ/אִישָׁ֥/הּ נָבָ֖ל לֹ֥א הִגִּֽידָה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/019.yaml
  text: She said to her young men[a], “Go on ahead of me. Look, I am coming behind you.” But she did not tell her husband Nabal.
translation:
  language: zh_hans
  text: 她对自己的年轻仆人说：“你们先走在我前面。看哪，我会随后跟来[a]。”但她没有把这事告诉她丈夫拿八。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“看哪，我正在你们后面来。”
    reason: 原文 אַחֲרֵיכֶם בָּאָה 可较直译为“正在你们后面来”；正文“我会随后跟来”以自然汉语表达她跟在先行仆人之后。
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: 她……说
  rationale: 该叙事动词承接前文，现代汉语无须机械译出连接词，也能自然表达动作的先后。
- source_word: לִנְעָרֶיהָ
  choice: 对自己的年轻仆人
  rationale: נַעַר 可指年轻人、仆人或随从；本段中这些人为亚比该搬运礼物并先行，因此译作“年轻仆人”兼顾其年龄含义和服侍身份。
- source_word: עִבְרוּ לְפָנַי
  choice: 你们走在我前面
  rationale: עָבַר 在这里表示先行，לְפָנַי 表示“在我前面”；合译后既贴近原文空间关系，也符合现代汉语。
- source_word: הִנְנִי
  choice: 看哪
  rationale: 该指示语强调说话者接下来的行动；“看哪”保留其引人注意的语用作用和叙事庄重感。
- source_word: אַחֲרֵיכֶם בָּאָה
  choice: 我随后就来
  rationale: 原文以分词表达正在或即将进行的动作，意思是亚比该跟在众人后面来；“随后就来”在汉语中自然，并保留跟随先行者的关系。
- source_word: וּלְאִישָׁהּ נָבָל לֹא הִגִּידָה
  choice: 但她没有把这事告诉丈夫拿八
  rationale: אִישָׁהּ 在语境中是“她的丈夫”；连接词在这里形成对比，故译“但”。“把这事告诉”自然表达 הִגִּידָה 的告知含义，所指内容由上下文补足。
- source_word: נָבָל
  choice: 拿八
  rationale: 按现代汉语圣经人名的通行音译处理该专名。
theological_decisions: []
