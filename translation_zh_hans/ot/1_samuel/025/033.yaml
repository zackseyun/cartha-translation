base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/033.yaml
  text: And blessed be your judgment[a], and blessed be you[c][b], who have kept me this day from coming into bloodshed and from saving myself by my own hand.
translation:
  language: zh_hans
  text: 愿你的明辨[a]蒙福！愿你也蒙福！你今天拦住了我，使我不至于流血杀人[b]，也不至于亲手救自己[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “明辨”也可译作“判断力”或“审慎”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“进入血中”；“血”为复数，常指流血或血腥之事，也可含有“流血罪责”的意思。
    reason: lexical_alternative
  - marker: c
    text: 按上下文，也可译作“亲手为自己报仇”或“亲手为自己伸冤”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָרוּךְ טַעְמֵךְ
  choice: 愿你的明辨蒙福
  rationale: טַעַם在这里指阿比该审慎而明智的判断；“明辨”在现代汉语中自然、庄重，也能兼顾判断力与洞察力。祝福句式译为“愿……蒙福”，保留原文的赞颂语气。
- source_word: וּבְרוּכָה אָתְּ
  choice: 愿你也蒙福
  rationale: 保留对阿比该本人的直接祝福，并用“也”连接前一句，使中文流畅而不削弱平行结构。
- source_word: כְּלִתִנִי
  choice: 你……拦住了我
  rationale: 此处动词表示阻止、约束；“拦住”清楚呈现阿比该使大卫停手的叙事情境。
- source_word: הַיּוֹם הַזֶּה
  choice: 今天
  rationale: 准确表达强调当日之事的时间短语，也符合现代标准汉语。
- source_word: מִבּוֹא בְדָמִים
  choice: 使我没有去杀人流血
  rationale: 原文直译近于“进入血中/血事”；“去杀人流血”保留行动趋向，并自然表达大卫原本将要实施的暴力，同时不排除由此招致流血罪责的含义。
- source_word: וְהֹשֵׁעַ יָדִי לִי
  choice: 也没有靠自己的手救自己
  rationale: 尽量保留ישׁע“拯救、解救”的本义及原文“自己的手为自己行事”的反讽张力；上下文中的报复或自行伸冤含义在脚注说明。
theological_decisions:
- issue: דָּמִים可指实际流血，也可带有流血罪责的含义
  choice: 杀人流血
  alternative: 陷入流血罪
  rationale: 叙事直接关注大卫将要杀害拿八家中的男丁，因此正文表达具体暴行；脚注保留“流血罪”的道德和神学含义，不把原文张力单向化。
- issue: וְהֹשֵׁעַ יָדִי לִי是按字面译作自救，还是按语境译作报仇伸冤
  choice: 靠自己的手救自己
  alternative: 亲手为自己报仇／亲手为自己伸冤
  rationale: 正文保留ישׁע的拯救语义，使读者听见大卫把亲手报复视为自我解救的张力；脚注交代语境中的报仇或伸冤含义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“愿……蒙福”保留祝福公式的抬高语体；“明辨”避免过于口语化。“靠自己的手救自己”有意保留原文略显突出的表达及其反讽意味，并用脚注帮助普通读者理解语境。
