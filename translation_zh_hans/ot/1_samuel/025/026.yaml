  text: וְ/עַתָּ֣ה אֲדֹנִ֗/י חַי יְהוָ֤ה וְ/חֵֽי נַפְשְׁ/ךָ֙ אֲשֶׁ֨ר מְנָעֲ/ךָ֤ יְהוָה֙ מִ/בּ֣וֹא בְ/דָמִ֔ים וְ/הוֹשֵׁ֥עַ יָדְ/ךָ֖ לָ֑/ךְ וְ/עַתָּ֗ה יִֽהְי֤וּ כְ/נָבָל֙ אֹיְבֶ֔י/ךָ וְ/הַֽ/מְבַקְשִׁ֥ים אֶל אֲדֹנִ֖/י רָעָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/026.yaml
  text: '[A], my lord, as Yahweh lives and as you yourself live, since Yahweh has kept you from bloodguilt and from saving yourself by your own hand[b], now let your enemies and those who seek evil against my lord be like Nabal.'
translation:
  language: zh_hans
  text: 如今，我主啊，我指着永活的雅威和你的性命起誓：雅威既拦阻你犯流血之罪，也拦阻你用自己的手为自己解救[a]。现在，愿你的仇敌和那些图谋加害我主的人都像拿八一样[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “用自己的手为自己解救”按本段语境也可理解为“亲手为自己报仇”。
    reason: lexical_alternative
  - marker: b
    text: “拿八”在这里首先是人名；这个名字同时与希伯来语中表示“愚顽人”的词相呼应。
    reason: wordplay
lexical_decisions:
- source_word: וְעַתָּה
  choice: 如今／现在
  rationale: 原文在本节开头和后半句各有一次 וְעַתָּה。分别译为“如今”和“现在”，既保留两个明确的时间—话语标记，也避免现代汉语中机械重复。
- source_word: אֲדֹנִי
  choice: 我主
  rationale: 这是亚比该对大卫的尊称，不是对神的称呼；“我主”庄重而符合叙事语境。
- source_word: חַי יְהוָה וְחֵי נַפְשְׁךָ
  choice: 我指着永活的雅威和你的性命起誓
  rationale: 这是以雅威和受话者的生命为凭的誓言格式。汉语明确补出“起誓”，自然传达该固定格式的语用功能；“你的性命”保留 נֶפֶשׁ 的表达，而不生硬直译为“你的魂活着”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译呈现四字神名，保留其作为以色列之神专名的性质，不用表示头衔的“主”替代。
- source_word: מְנָעֲךָ
  choice: 阻止你
  rationale: 该动词表示拦阻、制止；“阻止你”简洁准确，适合这里神阻止大卫采取行动的语境。
- source_word: מִבּוֹא בְדָמִים
  choice: 陷入流血罪
  rationale: 字面结构是“进入血中／流血之中”，在此不仅指发生流血，也包含因流血而负罪的含义。“陷入流血罪”兼顾动作和道德—法律后果。
- source_word: וְהוֹשֵׁעַ יָדְךָ לָךְ
  choice: 亲手救自己
  rationale: 保留 ישׁע“拯救、解救”的基本词义和“你的手”的意象。语境中的报复含义是真实可能的解释，但不在正文中取代原词，而以脚注说明。
- source_word: יִהְיוּ כְנָבָל
  choice: 都像拿八一样
  rationale: נָבָל 在直接语境中首先是亚比该丈夫的名字，因此正文保留人名；该名字与“愚顽人”的普通名词意义形成双关，另见脚注。
- source_word: הַמְבַקְשִׁים אֶל אֲדֹנִי רָעָה
  choice: 那些谋害我主的人
  rationale: 该短语表示寻求给某人带来祸害。“谋害”是自然现代汉语，准确表达蓄意加害，不必生硬译作“寻求恶事”。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华／主
  rationale: “雅威”直接音译神名，保留原文使用专名而非称号的区别；“耶和华”是传统汉译形式，“主”则会遮蔽专名。
- issue: 大卫被阻止之行动的性质
  choice: 正文译“亲手救自己”，脚注说明可按语境理解为“亲手为自己报仇”
  alternative: 直接译为“亲手为自己报仇”
  rationale: ישׁע 的词汇意义是拯救或解救，但本章语境显然涉及大卫以暴力自行讨回公道。正文保留词义张力，脚注呈现更明确的语境解释。
- issue: בְדָמִים 的道德含义
  choice: 流血罪
  alternative: 流血／杀戮
  rationale: 复数“血”在此具有血债或流血罪责的意味；译为“流血罪”比单纯“流血”更能表达亚比该所说大卫将被保守免负的罪责。
translation_notes:
  register: 采用庄重、自然的现代标准汉语。“我主”保留古代尊称的礼貌色彩；誓言格式采用汉语习惯表达，避免逐字译成不自然的“雅威活着、你的魂也活着”。正文保留原文两次 וְעַתָּה，并用“如今／现在”作适度变化。
