  text: וְ/עַתָּ֗ה דְּעִ֤י וּ/רְאִי֙ מַֽה תַּעֲשִׂ֔י כִּֽי כָלְתָ֧ה הָ/רָעָ֛ה אֶל אֲדֹנֵ֖י/נוּ וְ/עַ֣ל כָּל בֵּית֑/וֹ וְ/הוּא֙ בֶּן בְּלִיַּ֔עַל מִ/דַּבֵּ֖ר אֵלָֽי/ו־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/017.yaml
  text: Now know this and consider what you should do[a], for disaster has been determined against our master and against all his household, and he is such a worthless man that one cannot speak to him.
translation:
  language: zh_hans
  text: 现在，你要明白，也要想想该怎么办，因为灾祸已经注定要临到我们的主人和他的全家。他是个无赖之徒[a]，谁也无法跟他说话。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语直译“卑劣之子”；传统译作“彼列之子”。
    reason: 说明原文习语的字面形式及传统译法，避免正文音译造成专名化误解。
lexical_decisions:
- source_word: וְעַתָּה
  choice: 现在
  rationale: 作为话语转折，引出仆人紧迫的劝告；现代汉语用“现在”自然简洁。
- source_word: דְּעִי וּרְאִי
  choice: 你要明白，也要想想
  rationale: 两个阴性单数祈使式都指向亚比该。“明白”保留ידע的认知意义；ראה在此与后面的行动问题连用，具有审慎考虑的含义，译为“想想”比字面的“看”自然。
- source_word: מַה תַּעֲשִׂי
  choice: 该怎么办
  rationale: 未完成式指所要采取的行动；“该怎么办”表达紧迫的审慎抉择，又不把它强化为原文没有明说的绝对命令。
- source_word: כָלְתָה הָרָעָה
  choice: 灾祸已经定要临到
  rationale: 该惯用语表示有害的结局已经确定。“灾祸”符合即将发生暴力报复的语境，“已经定要”保留事情已成定局的意味。
- source_word: אֶל אֲדֹנֵינוּ וְעַל כָּל בֵּיתוֹ
  choice: 临到我们的主人和他的全家
  rationale: 介词在此表示灾祸所针对的对象。“主人”符合仆人与拿八的关系；“全家”在现代汉语中自然涵盖其家属和家中人员。
- source_word: בֶּן בְּלִיַּעַל
  choice: 无赖之徒
  rationale: 这是形容卑劣、顽梗之人的希伯来语习语；“无赖之徒”传达其道德与性格意味，同时避免把“彼列”误解为此处明确出现的专名。
- source_word: מִדַּבֵּר אֵלָיו
  choice: 谁也无法跟他说话
  rationale: 原文结构表达因其顽梗而无法与之交谈的结果；译文保留泛指主体，不进一步解释为“听不进劝”。
theological_decisions:
- issue: בְּלִיַּעַל在本节是普通名词性习语还是专名
  choice: 按描述卑劣之人的习语译为“无赖之徒”
  alternative: 音译为“彼列之子”
  rationale: 本节上下文要求的是对拿八品格顽劣、难以沟通的描述，并不要求后期将“彼列”视为邪恶者专名的含义；脚注保留直译和传统译法。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。保留仆人劝告中的紧迫感，并以句末引号表明这是上一节延续下来的直接引语。
