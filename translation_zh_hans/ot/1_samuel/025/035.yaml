base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/035.yaml
  text: So David took from her hand what she had brought him[a], and he said to her, “Go up in peace to your house. See, I have listened to your voice and accepted you.”
translation:
  language: zh_hans
  text: 大卫从她手里接过她带给他的东西，对她说：“平平安安地回家去吧。你看，我已经听了你的话，也接纳了你[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“也恩待了你”或“也答应了你的请求”。希伯来文直译为“抬起了你的脸”。
    reason: 说明“抬起脸”的希伯来习语可指悦纳、施恩或允准请求；正文采用自然且不过度限定的译法。
lexical_decisions:
- source_word: וַיִּקַּח
  choice: 接过
  rationale: 基本义是“拿、取”；结合“从她手里”和所带来的礼物，“接过”既保留具体动作，也符合现代汉语表达。
- source_word: מִיָּדָהּ
  choice: 从她手里
  rationale: 保留希伯来文具体而生动的表达，不简化为“从她那里”。
- source_word: אֵת אֲשֶׁר הֵבִיאָה לוֹ
  choice: 她带给他的东西
  rationale: 自然呈现关系从句，并保留这些物品是亚比该带来给大卫的含义。
- source_word: עֲלִי לְשָׁלוֹם לְבֵיתֵךְ
  choice: 平平安安地回家去吧
  rationale: עֲלִי 字面为“上去”，但此处指亚比该离开大卫、返回家中；汉语用“回家去”自然地表达语境，לְשָׁלוֹם 则译为“平平安安地”。
- source_word: רְאִי
  choice: 你看
  rationale: 作为引起注意的命令语，“你看”是现代汉语中自然、庄重而不古奥的表达。
- source_word: שָׁמַעְתִּי בְקוֹלֵךְ
  choice: 我听从了你的话
  rationale: 原文直译为“我听了你的声音”，在本语境中包含听取并采纳请求之意；“听从了你的话”保留听闻与响应的双重意味。
- source_word: וָאֶשָּׂא פָּנָיִךְ
  choice: 也给了你情面[a]
  rationale: 该习语字面为“抬起你的脸”，语境中表示顾念对方、施以好意并准许其请求。“给了你情面”保留“脸面”意象，同时在现代汉语中可理解。脚注列出其他可能译法，以免将其含义限定得过窄。
theological_decisions:
- issue: וָאֶשָּׂא פָּנָיִךְ 所表达的接纳、施恩或允准请求
  choice: 也给了你情面[a]
  alternative: 也恩待了你；也接纳了你；也答应了你的请求
  rationale: 此处并非专门的教义术语，但原文习语兼有顾念其人、向其施恩和允准其请求的意味。正文保留“脸面”意象，脚注说明语义范围，不将其缩减为单一解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“接过”“平平安安地回家去吧”符合自然汉语；“给了你情面”保留原文有关“脸”的习语形象，并由脚注避免可能的误解。
