  text: וְ/אֶת אֲחִינֹ֛עַם לָקַ֥ח דָּוִ֖ד מִֽ/יִּזְרְעֶ֑אל וַ/תִּהְיֶ֛יןָ גַּֽם שְׁתֵּי/הֶ֥ן ל֖/וֹ לְ/נָשִֽׁים־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/043.yaml
  text: David also took Ahinoam of Jezreel[b][a], and both of them became his wives.
translation:
  language: zh_hans
  text: 大卫又娶了来自耶斯列的亚希暖；她和亚比该二人都成了他的妻子。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָקַח
  choice: 娶了
  rationale: 该动词本义为“拿、取”，但在此婚姻语境中指娶女子为妻；现代汉语用“娶了”自然、明确，后半句也印证这一含义。
- source_word: אֲחִינֹעַם
  choice: 亚希暖
  rationale: 采用现代中文圣经人名的通行音译。
- source_word: מִיִּזְרְעֶאל
  choice: 来自耶斯列的
  rationale: 介词 מִן 与地名连用，最直接表示来源地“来自耶斯列”；同时自然地修饰亚希暖。
- source_word: וַתִּהְיֶיןָ גַּם שְׁתֵּיהֶן
  choice: 她和亚比该二人都成了
  rationale: 阴性复数动词及“她们二人”回指亚希暖与上一节的亚比该。为避免现代汉语代词指向不清，明确补出亚比该的名字，同时保留“二人都”和“成了”的语义。
- source_word: לְנָשִׁים
  choice: 他的妻子
  rationale: לּוֹ לְנָשִׁים 直译为“作妻子归给他”，现代汉语自然表达为“他的妻子”；“二人”已清楚表明妻子不止一位。
- source_word: גַּם
  choice: 又；都
  rationale: 前一个增添关系在“大卫又娶了”中体现；后一个 גַּם 与 שְׁתֵּיהֶן 结合，在“二人都”中体现。
theological_decisions:
- issue: 一夫多妻婚姻的叙述
  choice: 明确译出亚希暖和亚比该二人都成为大卫的妻子
  alternative: 采用较含蓄的说法，淡化复数婚姻关系
  rationale: 希伯来文本直接陈述两位女子都成为大卫的妻子。译文只作如实描述，不加以赞许、谴责或淡化。
translation_notes:
  register: 采用自然、庄重而清楚的现代标准普通话。“她和亚比该二人”承接上文并消除单独使用“她们二人”可能造成的指代含混。原文无须以脚注保留的实质性异文或歧义。
