base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/025.yaml
  text: 'Please[a], my lord, do not set your heart on this worthless man, on Nabal, for as his name is, so is he: Nabal is his name, and folly is with him. But I, your servant, did not see the young men of my lord whom you sent.'
translation:
  language: zh_hans
  text: 我主啊，求你不要把这个无赖——拿八——当回事。因为他人如其名：拿八是他的名字，愚妄也与他相伴。至于我，你的婢女，没有看见我主所差来的那些年轻人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יָשִׂים אֶת־לִבּוֹ אֶל
  choice: 把……当回事
  rationale: 这个现代汉语表达自然传达“把心放在某人身上”、认真理会或在意某人的意思；相较于直译“把心放在”，更清楚且不误导。
- source_word: אִישׁ הַבְּלִיַּעַל
  choice: 无赖
  rationale: 此处בְּלִיַּעַל是对拿八卑劣、毫无可取之处的道德评价，并非专名。“无赖”符合叙事语境，也保留强烈贬义。
- source_word: נָבָל
  choice: 拿八
  rationale: 作为人名采用音译；其与“愚妄”的希伯来语双关通过正文后句及脚注保留。
- source_word: כִּי כִשְׁמוֹ כֶּן הוּא
  choice: 因为他人如其名
  rationale: 简洁保留原文“名字怎样，人也怎样”的格言式结构，并为后面的文字游戏铺垫。
- source_word: וּנְבָלָה עִמּוֹ
  choice: 愚妄也与他相伴
  rationale: 保留原文“愚妄与他同在”的意象和拿八之名的文字呼应，不扩展为单纯性格判断。
- source_word: אֲמָתְךָ
  choice: 你的婢女
  rationale: 准确体现阴性仆役称谓，也是亚比该在此自谦的说法；现代读者能够理解，且语体庄重。
- source_word: נַעֲרֵי
  choice: 那些年轻人
  rationale: 按词语本义译作“年轻人”，不把其叙事角色提前解释成“使者”或“仆人”。
- source_word: אֲדֹנִי
  choice: 我主
  rationale: 这是亚比该对大卫的敬称；“我主”既保留重复出现的称谓，也符合庄重的历史叙事语体。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而自然的叙事语言。“我主啊，求你”保留恳求和敬称；“把……当回事”略带口语感，但能清楚表达希伯来语习语，且与亚比该直接劝阻大卫的紧迫语境相称。正文保留“愚妄也与他相伴”的希伯来式意象，以维持文字游戏及修辞力度。
