  source_fidelity: 原文的核心意思是大卫的仆人来到迦密的亚比该那里，并转达大卫差他们来娶她为妻。草稿整体准确，但引语中“接你，娶你”把一个希伯来语婚姻惯用表达拆成两个并列动作，且“娶你”的施事在汉语句法上可能暂时被理解为仆人，未能清楚表达“为大卫娶她”。
