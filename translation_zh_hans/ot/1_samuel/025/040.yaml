  yaml_path: translation/ot/1_samuel/025/040.yaml
  text: So David’s servants came to Abigail at Carmel and spoke to her[a], saying, “David has sent us to you to take you for himself as a wife.”
translation:
  language: zh_hans
  text: 大卫的仆人来到迦密，见到亚比该，对她说：“大卫派我们来接你去作他的妻子。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: 来到
  rationale: בוא可依叙事视角译为“来”或“去”；本句以亚比该所在之处为落点，“来到”自然表达抵达之意。
- source_word: עַבְדֵי דָוִד
  choice: 大卫的仆人
  rationale: עֶבֶד可指仆人、奴隶或臣属；此处重在他们奉大卫差遣担任使者，并未强调受奴役身份，因此译作“仆人”。
- source_word: הַכַּרְמֶלָה
  choice: 来到迦密
  rationale: 地名后的方向词尾表示朝向迦密的移动；与בוא连用时，汉语以“来到迦密”清楚表达抵达目的地。
- source_word: וַיְדַבְּרוּ אֵלֶיהָ לֵאמֹר
  choice: 对她说
  rationale: 这是希伯来语常见的引语引介结构；汉语无需逐字重复“说话……说”，译为“对她说”更自然。
- source_word: שְׁלָחָנוּ
  choice: 派我们来
  rationale: 完成式加第一人称复数宾语后缀表示大卫已经差遣他们；“派我们来”符合使者当面说明来意的现代汉语表达。
- source_word: לְקַחְתֵּךְ לוֹ לְאִשָּׁה
  choice: 接你，娶你作他的妻子
  rationale: לקח与“作妻子”连用是婚娶表达。译文用“接你，娶你作他的妻子”，既保留使者前来带她走的具体意味，也明确婚姻含义；“他的”对应לוֹ，所指为大卫。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“娶你作他的妻子”明确原文婚姻语境；不加脚注，因为正文已自然传达该惯用表达，无需另列字面译法。
