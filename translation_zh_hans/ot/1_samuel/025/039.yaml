  text: וַ/יִּשְׁמַ֣ע דָּוִד֮ כִּ֣י מֵ֣ת נָבָל֒ וַ/יֹּ֡אמֶר בָּר֣וּךְ יְהוָ֡ה אֲשֶׁ֣ר רָב֩ אֶת רִ֨יב חֶרְפָּתִ֜/י מִ/יַּ֣ד נָבָ֗ל וְ/אֶת עַבְדּ/וֹ֙ חָשַׂ֣ךְ מֵֽ/רָעָ֔ה וְ/אֵת֙ רָעַ֣ת נָבָ֔ל הֵשִׁ֥יב יְהוָ֖ה בְּ/רֹאשׁ֑/וֹ וַ/יִּשְׁלַ֤ח דָּוִד֙ וַ/יְדַבֵּ֣ר בַּ/אֲבִיגַ֔יִל לְ/קַחְתָּ֥/הּ ל֖/וֹ לְ/אִשָּֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/039.yaml
  text: When David heard that Nabal was dead[a], he said, “Blessed be Yahweh, who has pleaded the case of my reproach from the hand of Nabal, and has kept his servant back from evil. Yahweh has returned Nabal’s evil on his own head.” Then David sent and spoke to Abigail[e][d][c][b], to take her as his wife.
translation:
  language: zh_hans
  text: 大卫听说拿八死了，就说：“耶和华当受颂赞！他为我所受的羞辱向拿八申了冤[a]，又拦阻他的仆人作恶[b]。耶和华使拿八所行的恶报应在他自己头上[c]。”随后，大卫派人向亚比该提亲，要娶她为妻[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “申了冤”原文带有争讼、为案件辩护的法律意象；也可译作“为我所受的羞辱主持了公道”。
    reason: lexical_alternative
  - marker: b
    text: “作恶”也可译作“行伤害人的事”；这里指大卫被拦阻，没有亲手报复、流无辜人的血。
    reason: lexical_alternative
  - marker: c
    text: “报应在他自己头上”直译为“使拿八所行的恶归回他头上”，是指恶果归到作恶者本人。
    reason: cultural_note
  - marker: d
    text: 原文直译为“大卫差遣，并向（或就）亚比该说，要为自己娶她为妻”。这里的“提亲”概括差遣使者传达娶她为妻的意思。
    reason: translation_clarity
lexical_decisions:
- source_word: בָּרוּךְ יְהוָה
  choice: 耶和华当受颂赞
  rationale: 保留希伯来语祝颂公式的颂赞与宣告语气，并以神的专名“耶和华”对应四字神名。
- source_word: רָב אֶת רִיב חֶרְפָּתִי
  choice: 为我所受的羞辱向拿八申了冤
  rationale: “申冤”自然传达 ריב 的诉讼、争讼意象；“我所受的羞辱”保留 חֶרְפָּה 的受辱含义，且不把经文仅仅化约为私人报复。
- source_word: מִיַּד נָבָל
  choice: 向拿八
  rationale: 此处 מִיַּד 表明羞辱来自拿八；汉语直译为“从拿八手中”容易误解为解救，结合“申冤”译作“向拿八”更清楚。
- source_word: וְאֶת עַבְדּוֹ חָשַׂךְ מֵרָעָה
  choice: 又拦阻他的仆人作恶
  rationale: חָשַׂךְ 表示阻止、抑制；רָעָה 在语境中兼有恶行和造成伤害的意味。“作恶”保留大卫对自己原拟行动的道德判断。
- source_word: וְאֵת רָעַת נָבָל הֵשִׁיב יְהוָה בְּרֹאשׁוֹ
  choice: 耶和华使拿八的恶报应在他自己头上
  rationale: 保留“归到头上”的希伯来报偿意象，同时以“报应在”使现代汉语读者明白这是恶果返归作恶者。
- source_word: וַיִּשְׁלַח דָּוִד וַיְדַבֵּר בַּאֲבִיגַיִל
  choice: 大卫派人去向亚比该说
  rationale: 主语大卫不可能既“派遣”又亲自在场说话，因此“派人去”补出希伯来叙事中隐含的使者；“向……说”仍保留 דבר 的字面动作，不直接改成“求婚”。
- source_word: לְקַחְתָּהּ לוֹ לְאִשָּׁה
  choice: 要娶她为妻
  rationale: 这是常见的希伯来婚姻表达；“娶她为妻”在现代汉语中自然、庄重，并准确表达目的。
theological_decisions:
- issue: 拿八之死中的神圣审判与护理
  choice: 按大卫的宣告，明确说耶和华为他申冤，并使拿八的恶报应在拿八自己头上
  alternative: 弱化为拿八只是自食其果，或扩写为普遍性的神学命题
  rationale: 原文明确将此事的申冤和报偿归于耶和华；译文保留叙事中的归因，却不把这一具体事件扩展为对一切苦难或死亡的概括。
- issue: 大卫被拦阻离开 רָעָה 的道德含义
  choice: 译为“拦阻他的仆人作恶”
  alternative: “使他的仆人免受灾祸”或“拦阻他的仆人伤害人”
  rationale: 上下文所指是大卫原拟进行的流血报复；“作恶”保留原词的道德力度，也不将其误解成大卫自己免遭祸患。
- issue: 大卫向亚比该传达的内容
  choice: 正文保留“派人去向亚比该说”，并由目的短语表明婚姻意图
  alternative: 直接译作“派人向亚比该求婚”
  rationale: 直接说“求婚”较流畅但解释性更强；原文只用“说”及“娶她为妻”的目的结构，宜保留其表达层次。
translation_notes:
  register: 采用现代、庄重而清楚的叙事语体。“耶和华当受颂赞”保留圣经祝颂语感；“申冤”“作恶”“娶她为妻”均为普通读者易懂的标准汉语。正文避免生硬照搬“从拿八手中”“把恶归回头上”，但脚注保留原文的法律与报偿意象。所有脚注标记均置于相应正文位置。
