base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/018.yaml
  text: Then Abigail hurried and took two hundred loaves of bread[a], two skins of wine, five sheep already prepared, five seahs of roasted grain, a hundred clusters of raisins, and two hundred cakes of figs, and put them on the donkeys.
translation:
  language: zh_hans
  text: 亚比该赶紧取了二百个饼、两皮袋酒、五只已经预备好的羊、五细亚的烘烤谷物[a]、一百串葡萄干和二百块无花果饼，把这些都装在驴背上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “细亚”是古代的干量单位。
    reason: cultural_note
lexical_decisions:
- source_word: וַתְּמַהֵר
  choice: 赶紧
  rationale: 该动词意为“赶快、急忙”；“赶紧”自然传达叙事中的紧迫感。
- source_word: מָאתַיִם לֶחֶם
  choice: 二百个饼
  rationale: לֶחֶם在可数的物资清单中指一份份饼；中文以“个饼”表达数量，避免误解为散装面包。
- source_word: שְׁנַיִם נִבְלֵי יַיִן
  choice: 两皮袋酒
  rationale: נֵבֶל在此是盛液体的皮制容器；“皮袋酒”既符合古代背景，也避免现代玻璃瓶的联想。
- source_word: חָמֵשׁ צֹאן עֲשׂוּיוֹת
  choice: 五只已经宰备好的羊
  rationale: עֲשׂוּיוֹת表示羊已预备妥当，可供食用；“宰备好”比单说“预备好”清楚，又不进一步断定具体烹调方式。
- source_word: חָמֵשׁ סְאִים קָלִי
  choice: 五细亚烘过的谷物
  rationale: סְאָה是古代干量单位，音译为“细亚”以保留原文精度；קָלִי指烘烤或炒过的谷物。
- source_word: מֵאָה צִמֻּקִים
  choice: 一百串葡萄干
  rationale: צִמֻּקִים指葡萄干；在有明确数量的物资清单中，“串”表达成团或成束的形态，同时与后面的无花果饼区分。
- source_word: מָאתַיִם דְּבֵלִים
  choice: 二百块无花果饼
  rationale: דְּבֵלָה指压制成块的无花果饼；“块”是现代中文自然的量词。
- source_word: וַתָּשֶׂם עַל הַחֲמֹרִים
  choice: 把这些都驮在驴上
  rationale: 原文直译为“放在驴上”；中文“驮在驴上”自然说明这些物资被装载到驴背上。
theological_decisions: []
