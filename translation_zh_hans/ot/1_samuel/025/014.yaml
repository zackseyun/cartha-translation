    rationale: 该动词可有猛冲、扑向的形象，并在这里指粗暴的言语攻击；“斥责”常暗示针对某项过失的责备。改为“冲着他们恶声呵斥”保留强烈敌意与口头反应，同时不虚构具体的责备理由。
  revised_text: 但有一个仆人告诉拿八的妻子亚比该：“看哪，大卫从旷野派使者来向我们的主人问安，主人却冲着他们恶声呵斥。”
