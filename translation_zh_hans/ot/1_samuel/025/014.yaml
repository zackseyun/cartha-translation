revisions:
- from: 但有一个仆人告诉拿八的妻子亚比该说：“看哪，大卫从旷野派使者来向我们的主人问安，主人却厉声斥责他们。”
  to: 但有一个仆人告诉拿八的妻子亚比该：“看哪，大卫从旷野派使者来向我们的主人问安，主人却冲着他们恶声呵斥。”
  rationale: 仅将末句的“厉声斥责”调整为“冲着他们恶声呵斥”，以更贴近原文所表达的粗暴敌对反应，并保留该罕见动词在具体方式上的一定含混性。其余措辞可保留。
