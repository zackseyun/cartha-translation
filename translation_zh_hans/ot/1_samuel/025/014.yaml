base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/014.yaml
  text: But one of the young men told Abigail[a], Nabal’s wife, saying, “Look, David sent messengers from the wilderness to greet our master[b], and he shouted at them.”
translation:
  language: zh_hans
  text: 但有一个仆人告诉拿八的妻子亚比该：“看哪，大卫从旷野派使者来向我们的主人问安，主人却冲着他们恶声呵斥。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלַאֲבִיגַיִל אֵשֶׁת נָבָל
  choice: 但……拿八的妻子亚比该
  rationale: 连接词承接叙事，并在拿八拒绝使者之后转向仆人向亚比该报告此事；“但”自然体现这一转折。
- source_word: נַעַר אֶחָד מֵהַנְּעָרִים
  choice: 有一个仆人
  rationale: נַעַר可指年轻男子或仆役；此处是拿八家中的人员，译作“仆人”能清楚表达其身份，且避免生硬重复为“年轻人中的一个年轻人”。
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留该指示语引人注意、强调报告内容的作用，同时符合庄重的现代汉语叙事语体。
- source_word: מַלְאָכִים
  choice: 使者
  rationale: 此处明确指大卫所派的人类传信者，“使者”准确且自然。
- source_word: מֵהַמִּדְבָּר
  choice: 从旷野
  rationale: 指大卫及其随从所在的荒野地区；“旷野”是贴近原文且符合圣经叙事语境的现代译法。
- source_word: לְבָרֵךְ אֶת אֲדֹנֵינוּ
  choice: 来向我们的主人问安
  rationale: ברך基本义为“祝福”，但在此社交语境中指礼貌致意；“问安”与上文使者的问候内容相符。
- source_word: וַיָּעַט בָּהֶם
  choice: 主人却厉声斥责他们
  rationale: עָט是形象而罕见的动词，可表达猛扑般的激烈反应；在此指拿八粗暴地以言语攻击使者。“厉声斥责”既保留强烈语气，也比单纯“喊叫”更准确地传达敌意。补出“主人”使中文指代清楚。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。避免把人物对拿八的称呼“主人”误解为神圣称号；本节没有需要以脚注处理的神学性歧义。
