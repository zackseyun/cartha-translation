  naturalness: 原句整体自然、语体适合叙事中的愤怒反问。“我不知道是从哪里来的人”在中文中较容易仅理解为“不知道其来源”，而非同时包括“不认识这些人”；改为“我不认识、也不知道……的人”更清楚且仍自然。
