base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/011.yaml
  text: Should I take my bread and my water and my meat that I have slaughtered for my shearers[b][a], and give it to men whom I do not know where they are from?
translation:
  language: zh_hans
  text: 难道我要拿我的饼、我的水和我为剪羊毛的人宰杀的肉[b][a]，给那些我不认识、也不知道他们是从哪里来的人吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较直译：“我要拿……又要给……”希伯来文在反问中使用完成式。
    reason: lexical_alternative
  - marker: b
    text: “剪羊毛的人”指当时替拿八剪羊毛的工人。
    reason: cultural_note
lexical_decisions:
- source_word: וְלָקַחְתִּי
  choice: 难道我要拿
  rationale: 连词加完成式在此置于反问语境中，表达拿八愤怒的商议式语气；“难道我要……”既自然，也保留强烈的否定暗示。
- source_word: לַחְמִי
  choice: 我的饼
  rationale: 保留“饼”的具体意象及第一人称所有格，凸显拿八反复强调财物属于自己。
- source_word: מֵימַי
  choice: 我的水
  rationale: 按字面译出，与饼和肉构成具体的供应品清单，并保留所有格的强调。
- source_word: טִבְחָתִי ... טָבַחְתִּי
  choice: 我……宰杀的肉
  rationale: 名词与动词同属“宰杀”词根；中文用“宰杀的肉”自然地表达已备好的肉食，但无法完整重现希伯来文的同根复现。
- source_word: לְגֹזְזָי
  choice: 为剪羊毛的人
  rationale: 分词指从事剪毛者；结合上下文明确为剪羊毛的工人，译文直接点明对象，便于现代读者理解。
- source_word: וְנָתַתִּי
  choice: 给
  rationale: 与前面的“难道我要拿”共同受反问结构支配；中文省略重复主语和宾语更为自然。
- source_word: לָאֲנָשִׁים
  choice: 给那些……人
  rationale: 译出阳性复数“人”，并以“那些”承接后置关系从句，符合自然汉语。
- source_word: אֲשֶׁר לֹא יָדַעְתִּי
  choice: 我不知道
  rationale: ידע在此表示认识或知道；与后面的来源问句连读，译为“我不知道是从哪里来”最符合现代汉语。
- source_word: אֵי מִזֶּה הֵמָּה
  choice: 是从哪里来
  rationale: 该表达询问来历或出处；“是从哪里来”准确而自然，不把拿八声称不知对方来历强化为绝对不认识。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而口语自然的反问句式。“难道”传达拿八愤怒且预期否定回答的语气；连续三个“我的”保留原文对所有权的强调。脚注标记依其所说明内容置于“剪羊毛的人宰杀的肉”之后，并保留所给的[b][a]顺序。
