  text: וַ/יָּבֹ֨אוּ֙ נַעֲרֵ֣י דָוִ֔ד וַ/יְדַבְּר֧וּ אֶל נָבָ֛ל כְּ/כָל הַ/דְּבָרִ֥ים הָ/אֵ֖לֶּה בְּ/שֵׁ֣ם דָּוִ֑ד וַ/יָּנֽוּחוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/009.yaml
  text: When David’s young men came[a], they spoke to Nabal all these words in David’s name, and then they rested.
translation:
  language: zh_hans
  text: 大卫手下的年轻人来到拿八那里，就奉大卫的名，把这一切话都对他说了，然后停下来等候[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“然后歇息了”或“然后停了下来”。希伯来语动词通常有“安歇、停下”的意思；在这里可能是说他们传完话后停下来，等候拿八答复。
    reason: lexical_alternative
lexical_decisions:
- source_word: נַעֲרֵי דָוִד
  choice: 大卫手下的年轻人
  rationale: נַעַר 可指年轻人、仆人或随从。这里是奉大卫差遣传话的人；“手下的年轻人”既保留年龄色彩，也自然表明他们与大卫的从属关系。
- source_word: וַיָּבֹאוּ
  choice: 来到拿八那里
  rationale: בוא 是常用的“来、到达”；结合后面的间接受词拿八，译作“来到拿八那里”符合现代汉语叙事习惯。
- source_word: וַיְדַבְּרוּ אֶל נָבָל כְּכָל הַדְּבָרִים הָאֵלֶּה
  choice: 把这一切话都对拿八说了
  rationale: 保留 דְּבָרִים 的“话”这一具体含义，并以自然汉语表达他们完整转述了前述信息。
- source_word: בְּשֵׁם דָּוִד
  choice: 奉大卫的名
  rationale: 该短语表示受大卫授权、代表大卫说话；“奉……的名”兼具代表性和正式语气。
- source_word: וַיָּנוּחוּ
  choice: 停下来等候
  rationale: נוח 的基本义是停下、安歇或歇息；在传话完毕的语境中，很可能指停止说话并等候答复。“停下来等候”呈现叙事功能，脚注同时保留其较直译的可能。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“手下的年轻人”避免让“年轻人”显得只是大卫身边偶然出现的人；末句借脚注保留希伯来语动词在“歇息”与“停下等候”之间的语义张力。
