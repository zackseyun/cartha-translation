base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/032.yaml
  text: David said to Abigail[a], “Blessed be Yahweh, the God of Israel, who sent you this day to meet me.”
translation:
  language: zh_hans
  text: 大卫对亚比该说：“以色列的上帝雅威是应当称颂的；他今天[a]差遣你来见我。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“这一天”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 该叙事动词承接前文、引出大卫的话；现代汉语无须逐字译出连接词 וַ־。
- source_word: לַאֲבִיגַל
  choice: 对亚比该
  rationale: 介词 ל־在此标明说话的对象；“对亚比该说”符合现代汉语叙事习惯。
- source_word: בָּרוּךְ
  choice: 当称颂
  rationale: 该被动分词用于颂赞公式。“当称颂”既保留庄重语气，也避免把它过度解释为单纯的愿望。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文四字神名 YHWH 的常见现代音译处理，保留其作为上帝专名的性质，而不以称号替代。
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: 以色列的上帝
  rationale: 该附属结构说明雅威就是以色列的上帝；“上帝”是清楚、庄重的现代汉语表达。
- source_word: אֲשֶׁר
  choice: 是他
  rationale: 希伯来关系词引出说明雅威行动的从句。汉语以独立句“是他……”自然承接颂赞，同时保留关系从句的强调作用。
- source_word: שְׁלָחֵךְ
  choice: 差你
  rationale: 该完成式带第二人称阴性单数后缀，表示上帝差派亚比该。“差你”简洁地保留差派含义及性别中性的汉语代词形式。
- source_word: הַיּוֹם הַזֶּה
  choice: 今天
  rationale: 该短语直译为“这一天”，在此指说话当日；“今天”是现代汉语最自然的对应表达。
- source_word: לִקְרָאתִי
  choice: 来迎接我
  rationale: 介词 ל־与不定式结构表示目的或趋向，后缀指大卫；结合上下文，“来迎接我”准确表达亚比该前来与大卫相遇。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。译作“雅威”保留专名并较贴近通常重构的读音；不以“主”这一称号替换，也不采用源于较晚混合读法的“耶和华”。
- issue: בָּרוּךְ 的颂赞语气
  choice: 当称颂
  alternative: 愿……受称颂；是有福的
  rationale: 这里是对上帝的颂赞公式，不是在说明上帝“有福”，也未必只是表达愿望。“当称颂”保留宣告与劝赞之间的庄重张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“雅威——以色列的上帝——”以破折号标示同位说明；将关系从句译成“是他……”的独立句，使汉语自然，同时突出差派亚比该的是雅威。脚注标记置于其实际所解释的“今天”之后。
