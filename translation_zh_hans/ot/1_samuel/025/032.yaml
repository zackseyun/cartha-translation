revisions:
- from: 大卫对亚比该说：“当称颂雅威——以色列的上帝！是他今天[a]差你来迎接我。”
  to: 大卫对亚比该说：“以色列的上帝雅威是应当称颂的；他今天[a]差遣你来见我。”
  rationale: 修订使颂赞公式在现代标准汉语中完整明确，保留雅威作为专名及“以色列的上帝”的同位说明；并将“迎接”改为中性的“来见我”，避免超出原文的语义。脚注仍准确说明“今天”的字面表达，且标记紧随所注词语。
