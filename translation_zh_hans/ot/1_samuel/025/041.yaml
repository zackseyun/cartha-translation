base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/041.yaml
  text: She rose and bowed with her face to the ground and said[a], “Behold[b], your slave is a maidservant to wash the feet of the servants of my lord.”
translation:
  language: zh_hans
  text: 她就起来，俯伏在地，说：“看哪，你的婢女愿作使女，为我主的仆人洗脚。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתָּקָם
  choice: 她就起来
  rationale: קום的Qal连续式依次推进叙事；“就起来”自然地承接使者的话。
- source_word: וַתִּשְׁתַּחוּ אַפַּיִם אָרְצָה
  choice: 俯伏在地
  rationale: 该组合表示面向地面的深度敬拜或臣服姿态；汉语“俯伏在地”简洁、庄重，并自然包含脸朝地的含义。
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留引出郑重自谦陈述的指示感和语气，同时符合庄重的现代圣经汉语。
- source_word: אֲמָתְךָ
  choice: 你的婢女
  rationale: אָמָה是阴性仆役称谓；“婢女”既保留性别及卑微身份，也适合亚比该的自谦语境。
- source_word: לְשִׁפְחָה
  choice: 愿作使女
  rationale: שִׁפְחָה与前面的אָמָה是两个近义的女性仆役词；以“使女”区别于“婢女”，避免抹平原文措辞变化。系词结构按语境译为自愿承担卑微服侍的“愿作”。
- source_word: לִרְחֹץ רַגְלֵי
  choice: 为……洗脚
  rationale: 目的不定式与其宾语直译为服侍目的；“洗脚”是自然准确的现代汉语。
- source_word: עַבְדֵי אֲדֹנִי
  choice: 我主的仆人
  rationale: עבד在这里指大卫的随从，译“仆人”符合场景；אֲדֹנִי是尊称，译“我主”保留社会礼仪语气。
theological_decisions:
- issue: 如何处理אמה与שפחה两个近义的女性仆役词
  choice: 分别译为“婢女”和“使女”
  alternative: 两者均译为“婢女”或“仆女”；或强化为“女奴”
  rationale: 原文有意连续使用两个不同但相近的词来表达亚比该的自谦。分别译出可保留这种修辞变化；但本处重点在她甘愿承担最低微的服侍，不宜仅凭此句把法律身份过度确定为奴隶。
- issue: לְשִׁפְחָה所表达的关系
  choice: 译作“愿作使女”
  alternative: 直译为“是使女”或“作使女”
  rationale: 希伯来语表达较压缩，结合求婚回应的上下文，汉语补出“愿”可自然表达她接受并自谦地表明服侍意愿，同时不改变命题内容。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“看哪”保留郑重语气；“俯伏在地”避免冗长，却准确传达深度敬伏。以“婢女／使女”呈现两个近义女性仆役词，不使用过于口语的“女佣”，也不武断强化为法律意义明确的“女奴”。
