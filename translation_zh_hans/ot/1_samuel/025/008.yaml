  text: שְׁאַ֨ל אֶת נְעָרֶ֜י/ךָ וְ/יַגִּ֣ידוּ לָ֗/ךְ וְ/יִמְצְא֨וּ הַ/נְּעָרִ֥ים חֵן֙ בְּ/עֵינֶ֔י/ךָ כִּֽי עַל י֥וֹם ט֖וֹב בָּ֑נוּ תְּנָ/ה נָּ֗א אֵת֩ אֲשֶׁ֨ר תִּמְצָ֤א יָֽדְ/ךָ֙ לַ/עֲבָדֶ֔י/ךָ וּ/לְ/בִנְ/ךָ֖ לְ/דָוִֽד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/008.yaml
  text: Ask your young men[a], and they will tell you. So let the young men find favor in your eyes, for we have come on a festive day[b]. Please give whatever your hand finds to your servants and to your son David.
translation:
  language: zh_hans
  text: 你问问你的年轻人[a]，他们会告诉你。愿年轻人在你眼中蒙恩，因为我们是在喜庆的日子来到的[b]。求你把你手头能拿出来的东西[c]，给你的仆人和你儿子大卫。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “年轻人”也可译作“仆人”或“随从”。
    reason: lexical_alternative
  - marker: b
    text: “喜庆的日子”原文直译为“好日子”；这里指剪羊毛时设宴庆贺的日子。
    reason: cultural_note
  - marker: c
    text: “你手头能拿出来的东西”原文直译为“你手所找到的”，指你手边可提供、力所能及之物。
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁאַל אֶת־נְעָרֶיךָ
  choice: 你问问你的年轻人
  rationale: שְׁאַל是阳性单数命令式；נַעַר可指青年、仆人或随从。这里指拿八手下能为大卫等人作证的人；译作“年轻人”既不过度限定身份，也保留与下文הַנְּעָרִים的词语呼应。“问问”在现代汉语中自然地传达直接吩咐。
- source_word: וְיַגִּידוּ לָךְ
  choice: 他们就会告诉你
  rationale: נגד的使役形在此意为告诉、说明；“就会”自然呈现询问之后所得的结果。
- source_word: וְיִמְצְאוּ הַנְּעָרִים חֵן בְּעֵינֶיךָ
  choice: 所以，愿这些年轻人在你眼前蒙恩
  rationale: מצא חן בעיני是“在某人眼中蒙恩”的惯用语。“愿”表达未完成式在此的祈愿语气，“所以”呈现连接词与前后请求的推进关系；“这些”指向大卫派来的年轻人。
- source_word: כִּי עַל־יוֹם טוֹב בָּאנוּ
  choice: 因为我们是在喜庆的日子来的
  rationale: יוֹם טוֹב字面是“好日子”，但剪羊毛的语境表明这是宴饮庆贺的日子。“喜庆的日子”传达语境含义，同时以脚注保留字面表达。介词עַל在此按时间情境自然译出。
- source_word: תְּנָה־נָּא
  choice: 求你……赐给
  rationale: 命令式加נָא构成恳求。“求你”传达礼貌请求；“赐给”符合大卫自称仆人、向拿八谦卑求赠的语域。
- source_word: אֵת אֲשֶׁר תִּמְצָא יָדְךָ
  choice: 把手头所有的
  rationale: 原文直译为“你手所找到的”，指手边现有、能够拿出的东西。“手头所有的”保留“手”的意象而又符合现代汉语，并不表示必须交出全部财物；脚注说明其实际含义。
- source_word: לַעֲבָדֶיךָ
  choice: 给你的仆人
  rationale: עֶבֶד可指仆人或奴隶；此处是大卫一方谦卑的自称，并非强调法律身份，故译“仆人”。
- source_word: וּלְבִנְךָ לְדָוִד
  choice: 和你儿子大卫
  rationale: 大卫自称拿八的“儿子”，是谦恭的社会称谓，并非实际亲子关系。保留这一表达，以呈现请求中的自谦语气。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留“在你眼前蒙恩”和“你儿子大卫”等希伯来语修辞意象，同时用“喜庆的日子”和“手头所有的”传达语境中的自然含义。所有脚注标记均置于正文对应位置。
