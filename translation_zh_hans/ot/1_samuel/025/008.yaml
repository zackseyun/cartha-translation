revisions:
- from: 你问问你的年轻人[a]，他们就会告诉你。所以，愿这些年轻人在你眼前蒙恩，因为我们是在喜庆的日子来的[b]。求你把手头所有的，赐给你的仆人和你儿子大卫。
  to: 你问问你的年轻人[a]，他们会告诉你。愿年轻人在你眼中蒙恩，因为我们是在喜庆的日子来到的[b]。求你把你手头能拿出来的东西[c]，给你的仆人和你儿子大卫。
  rationale: 修订避免把“你手所找到的”误译为“手头所有的”，并将两个不同的说明分别锚定在对应短语。删去无必要的“这些”，使中文不额外限定指称，同时保留原文的谦卑请求、用词呼应及庆贺日的语境含义。
