  register: 采用自然、庄重的现代叙事语体。“不料”传达וְהִנֵּה的突现感；“迎着她下来”保留方向性而不强化目的。脚注保留בְּסֵתֶר הָהָר在“隐蔽处”与“山背后”之间的地形歧义。
