revisions:
- from: 正当她骑着驴，从山的隐蔽处往下走时[a]，不料，大卫和他的手下也迎着她下来，她就遇见了他们。
  to: 她骑着驴，正当在山的隐蔽处下去时[a]，看哪，大卫和他的手下正朝她所在之处下来；她就遇见了他们。
  rationale: 修订以“看哪”对应 וְהִנֵּה，避免“不料”所附加的意外或转折意味；删除无对应的“也”，并将大卫一行的动作译为“朝她所在之处下来”，保留“下行”与朝向她的运动而不额外断定其迎接性质。将地点短语调整为“在山的隐蔽处下去”，保留原文的地形歧义并使汉语更顺畅。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T05:26:37Z'
