base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/020.yaml
  text: And as she was riding on the donkey and going down under cover of the mountain[a], behold, David and his men were coming down to meet her, and she met them.
translation:
  language: zh_hans
  text: 她骑着驴，正当在山的隐蔽处下去时[a]，看哪，大卫和他的手下正朝她所在之处下来；她就遇见了他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在山的背面下去。”希伯来语所指的是山上被遮蔽或不易看见的地方。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה הִיא
  choice: 正当她……时
  rationale: 该叙事结构引入同时发生的场景；用“正当……时”自然表达其时间和叙事功能，避免生硬直译为“事情是，她……”。
- source_word: רֹכֶבֶת עַל הַחֲמוֹר
  choice: 骑着驴
  rationale: 准确表达持续中的骑乘动作；“驴”是现代汉语中自然、通行的称呼。
- source_word: וְיֹרֶדֶת
  choice: 往下走
  rationale: 保留分词所表达的持续动作，也符合山地行进的语境。
- source_word: בְּסֵתֶר הָהָר
  choice: 从山的隐蔽处
  rationale: סֵתֶר具有遮蔽、隐蔽之意；此处可能指山势遮蔽的地方或山的背面。正文保留空间上的隐蔽含义，脚注列出自然的地形性译法。
- source_word: וְהִנֵּה
  choice: 不料
  rationale: 在现代汉语叙事中鲜明标示突然出现、值得注意的新情况，比“看哪”更自然，同时保留原文的话语功能。
- source_word: דָוִד וַאֲנָשָׁיו
  choice: 大卫和他的手下
  rationale: “手下”自然表达随同大卫并受其带领的众人，比直译“他的人”更符合现代汉语。
- source_word: יֹרְדִים לִקְרָאתָהּ
  choice: 也迎着她下来
  rationale: לִקְרָאתָהּ表达朝她所在方向而来；“迎着她”保留相向运动，且不必断定他们下来的目的就是会见她。
- source_word: וַתִּפְגֹּשׁ אֹתָם
  choice: 她就遇见了他们
  rationale: פגש在此指相遇；“遇见”简洁、自然，并承接双方相向而行的叙述。
theological_decisions: []
