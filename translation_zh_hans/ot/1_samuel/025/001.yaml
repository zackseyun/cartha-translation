  terminology: “撒母耳”“以色列”“拉玛”“大卫”“巴兰旷野”均符合通行圣经专名用法。“哀悼”适合 סָפַד 的宽泛语义；脚注恰当说明其可包含礼仪性的举哀或哀哭。“旷野”适切对应 מִדְבָּר。
