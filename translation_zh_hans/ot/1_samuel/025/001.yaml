  text: וַ/יָּ֣מָת שְׁמוּאֵ֔ל וַ/יִּקָּבְצ֤וּ כָל יִשְׂרָאֵל֙ וַ/יִּסְפְּדוּ ל֔/וֹ וַ/יִּקְבְּרֻ֥/הוּ בְּ/בֵית֖/וֹ בָּ/רָמָ֑ה וַ/יָּ֣קָם דָּוִ֔ד וַ/יֵּ֖רֶד אֶל מִדְבַּ֥ר פָּארָֽן־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/001.yaml
  text: Samuel died[a], and all Israel gathered and mourned for him, and they buried him at his house in Ramah. Then David arose and went down to the wilderness of Paran.
translation:
  language: zh_hans
  text: 撒母耳死了。以色列众人都聚集起来，为他哀悼[a]，把他葬在他位于拉玛的家中[b]。随后，大卫动身下到巴兰旷野。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“为他举哀”。原文动词可指为死者哀哭、作哀歌等丧礼行为。
    reason: 保留 וַיִּסְפְּדוּ 在一般哀悼与礼仪性举哀之间的词义范围。
  - marker: b
    text: “家中”也可能指属于他家宅的地方或家族产业，并不一定指住宅内部。
    reason: 原文 בְּבֵיתוֹ 可按字面理解为“在他的房屋中”，也可较宽泛地指与其家宅相关的地方；脚注避免过度确定埋葬的精确位置。
lexical_decisions:
- source_word: וַיָּמָת שְׁמוּאֵל
  choice: 撒母耳死了
  rationale: 直译死亡事件；叙事前缀推进情节，但不另加原文没有的“现在”等显性时间词。
- source_word: וַיִּקָּבְצוּ כָל־יִשְׂרָאֵל
  choice: 以色列众人都聚集起来
  rationale: “以色列众人”保留以色列作为民族整体的集合表达；“都”对应 כָל，“聚集起来”自然表达动词的自发聚合语态。
- source_word: וַיִּסְפְּדוּ לוֹ
  choice: 为他哀悼[a]
  rationale: 该动词指为死者举行哀悼或作哀歌；“哀悼”在现代汉语中清楚、庄重，并保留礼仪性哀丧的宽泛含义。
- source_word: וַיִּקְבְּרֻהוּ
  choice: 把他葬在
  rationale: 以自然的现代汉语把字句明确表达动词及其宾语。
- source_word: בְּבֵיתוֹ בָּרָמָה
  choice: 在拉玛他自己的家中[b]
  rationale: 尽量保留“他的家/房屋中”这一空间表达及拉玛这一地点；同时用脚注提示其所指也可能是与家宅相连的产业，而不武断限定为住宅内部。
- source_word: וַיָּקָם דָּוִד
  choice: 随后，大卫动身
  rationale: 此处 קום 与后续移动动词连用，表示起身出发；“动身”比机械直译“起来”更符合现代汉语叙事，同时“随后”承接连续叙事。
- source_word: וַיֵּרֶד אֶל־מִדְבַּר פָּארָן
  choice: 下到巴兰旷野
  rationale: 保留 ירד 的下降方向含义；“旷野”准确表达 מִדְבָּר，不把它窄化为纯沙漠地貌；专名 פָּארָן 音译为“巴兰”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。短句开篇保留原文事件推进的力度；地名按通行圣经译名处理。用“动身”自然表达起身出发，用“下到”保留地势方向。
