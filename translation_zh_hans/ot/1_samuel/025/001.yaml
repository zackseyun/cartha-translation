  to: 撒母耳死了。以色列众人都聚集起来，为他哀悼[a]，把他葬在他位于拉玛的家中[b]。随后，大卫动身下到巴兰旷野。
  rationale: 仅调整“拉玛”与“他的家”的汉语修饰语序，并删除无原文依据的强调词“自己的”。其余译文和脚注均忠实、自然，无须改动。
