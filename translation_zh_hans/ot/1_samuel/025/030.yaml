  text: וְ/הָיָ֗ה כִּֽי יַעֲשֶׂ֤ה יְהוָה֙ לַֽ/אדֹנִ֔/י כְּ/כֹ֛ל אֲשֶׁר דִּבֶּ֥ר אֶת הַ/טּוֹבָ֖ה עָלֶ֑י/ךָ וְ/צִוְּ/ךָ֥ לְ/נָגִ֖יד עַל יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/030.yaml
  text: And when Yahweh has done for my lord according to all the good that he spoke concerning you[a], and has appointed you ruler over Israel[b],
translation:
  language: zh_hans
  text: 当耶和华为我主成就他所说关乎你的一切美事[a]，并立你为以色列的领袖[b]时，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他所应许给你的一切美事。”原文直译为“他所说的、关乎你的一切美事”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“吩咐你作以色列的领袖。”这里的动词通常意为“吩咐”，在本句中也可指委任或设立人担任领袖。
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: 当……时
  rationale: 这是引出将来情形的惯用结构；结合本节从属于下一节的句法，用“当……时”自然且准确。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的传统音译呈现四字神名，保留其专名性质，而不以称号替代。
- source_word: לַאדֹנִי
  choice: 恩待我主
  rationale: 介词ל与动词“行、做”相连，表达耶和华为“我主”成就好事；“我主”保留亚比该对大卫的敬称。
- source_word: כְּכֹל אֲשֶׁר דִּבֶּר אֶת הַטּוֹבָה עָלֶיךָ
  choice: 照着他论到你所说的一切福分
  rationale: 保留דבר“说”的明确措辞，不直接释为“应许”；הַטּוֹבָה在语境中指将临到大卫的好事或福分。
- source_word: וְצִוְּךָ
  choice: 并立你
  rationale: צוה通常可指“吩咐”，但与לְנָגִיד连用时表达委任、设立担任权柄职位；正文采用符合本语境的“立”。
- source_word: לְנָגִיד
  choice: 作……的领袖
  rationale: נָגִיד指被置于权柄地位的领导者；“领袖”自然、庄重，也避免将其过度具体化为某一王室头衔。
- source_word: עַל יִשְׂרָאֵל
  choice: 以色列的
  rationale: 原文介词表达对以色列的治理权；中文“作以色列的领袖”自然传达此意。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用四字神名。正文采用现代中文圣经传统中最广为人知的专名音译“耶和华”，既不以“主”等称号取代，也便于普通读者辨认。
- issue: דִּבֶּר是否明确译成“应许”
  choice: 说
  alternative: 应许
  rationale: 语境确实涉及上帝对大卫的美好应许，但原文动词只是“说”。正文保留较宽的措辞，将“应许”列作脚注中的语境性译法，避免消除词义张力。
- issue: וְצִוְּךָ表示命令还是委任
  choice: 立你
  alternative: 吩咐你作
  rationale: 该动词本义常为“吩咐、命令”，但在“作领袖”这一补语前，语境很可能指委任或设立。正文表达语境意义，脚注保留较直译的可能。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。本节在希伯来文中是未完的时间从句，意思延续到下一节，因此以逗号收尾。称呼“我主”保留亚比该恭敬的语气；“福分”比抽象的“好处”更适合此处所指上帝将为大卫成就的美事。
