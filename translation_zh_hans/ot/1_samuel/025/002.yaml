base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/002.yaml
  text: There was a man in Maon whose business was in Carmel[a]. The man was very wealthy, and he had three thousand sheep and a thousand goats[b]. He was shearing his sheep in Carmel.
translation:
  language: zh_hans
  text: 玛云有一个人，他的经营在迦密[a]。这人非常富有[b]，有三千只绵羊和一千只山羊。他正在迦密给自己的羊剪毛。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“他的事务在迦密”或“他的产业在迦密”。希伯来语这个词可泛指一个人的工作、事务或产业。
    reason: lexical_alternative
  - marker: b
    text: 直译“这人极其伟大”；在这里可指他在社会或经济上十分显赫。
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: 有一个人
  rationale: 符合希伯来叙事中引入新人物的常见表达，保留不定意味，又使现代汉语自然。
- source_word: בְמָעוֹן
  choice: 住在玛云
  rationale: 介词短语在此说明人物所在或居住之地；补出“住”使汉语清楚自然。地名按音译处理。
- source_word: מַעֲשֵׂהוּ
  choice: 他的产业
  rationale: 该词可指工作、事务、经营或所有产业；结合下文的大量牲畜，“产业”能自然表达其经济活动与资产，同时以脚注保留词义范围。
- source_word: בַכַּרְמֶל
  choice: 在迦密
  rationale: 此处是地名迦密，不按普通名词“果园”翻译；经文两次出现，译文均予保留。
- source_word: הָאִישׁ גָּדוֹל מְאֹד
  choice: 这人非常富有
  rationale: “极其大”在上下文中主要表示经济与社会地位显赫，紧接着的牲畜数目支持财富含义；脚注保留“非常显赫”的可能表达。
- source_word: וְלוֹ צֹאן שְׁלֹשֶׁת אֲלָפִים וְאֶלֶף עִזִּים
  choice: 有三千只绵羊和一千只山羊
  rationale: 以现代汉语自然的领有句表达希伯来语的所属结构，并准确保留牲畜种类和数目。
- source_word: וַיְהִי בִּגְזֹז אֶת־צֹאנוֹ
  choice: 那时，他正在……给羊剪毛
  rationale: 该叙事结构交代正在发生的情境；“那时……正在”既传达背景时态，也符合自然汉语。“给羊剪毛”避免误解为剪取已经脱离羊体的羊毛。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事文体。地名使用通行圣经音译“玛云”“迦密”。首句不添加原文没有的“现在”；末句用“那时”表达希伯来叙事结构所引入的背景情境。
