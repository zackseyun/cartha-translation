  yaml_path: translation/ot/1_samuel/025/004.yaml
  text: David heard in the wilderness that Nabal was shearing his sheep[a].
translation:
  language: zh_hans
  text: 大卫在旷野听说拿八正在剪羊毛[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“剪他的羊”；“羊”原文也可泛指由绵羊、山羊等组成的羊群。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: 听说
  rationale: 该形式在叙事中表示过去发生的事；结合其后由 כִּי 引出的消息内容，现代汉语用“听说”比直译“听见”更自然，也不过度引申为“得知”。
- source_word: בַּמִּדְבָּר
  choice: 在旷野
  rationale: מִדְבָּר 通常指荒野、野外地带，不必然是沙漠；“在旷野”保留了大卫听到消息时所在地点的自然理解。
- source_word: כִּי
  choice: （听说……）
  rationale: 此处 כִּי 引出所听消息的内容；汉语以“听说”直接带出内容，无须另译连词。
- source_word: גֹזֵז
  choice: 正在剪羊毛
  rationale: 分词表示当时正在进行的动作；“正在”清楚传达持续、同时发生的意味。
- source_word: נָבָל
  choice: 拿八
  rationale: 按现代中文圣经人名的通行音译处理，不翻译其名字含义。
- source_word: אֶת צֹאנוֹ
  choice: 羊毛
  rationale: צֹאן 是集合名词，可泛指绵羊和山羊等小型牲畜；在 גזז 的剪毛语境中，汉语惯用“剪羊毛”，自然地表达对其羊群进行剪毛的事件。脚注保留更宽泛的词义。
