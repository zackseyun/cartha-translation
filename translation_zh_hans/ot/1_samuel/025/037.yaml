base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/037.yaml
  text: And in the morning[a], when the wine had gone out of Nabal, his wife told him these things, and his heart died within him[b], and he became like a stone.
translation:
  language: zh_hans
  text: 到了早晨，拿八酒醒后，他的妻子把这些事告诉他；他的心在他里面就死了[b]，他就像石头一样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 也可理解为“他的心在里面衰竭了”。原文使用鲜明的意象，并不是具体的医学诊断。
    reason: lexical_alternative
lexical_decisions:
- source_word: בַבֹּקֶר
  choice: 到了早晨
  rationale: 这是自然、清楚的现代汉语时间表达，也保留了希伯来文叙事推进的语气。
- source_word: בְּצֵאת הַיַּיִן מִנָּבָל
  choice: 拿八醒了酒以后
  rationale: 原文直译为“酒从拿八那里出去”。汉语若照字面翻译会显得费解，因此正文采用其语境含义“醒了酒”，并在脚注中保留原文的具体意象。
- source_word: וַתַּגֶּד לוֹ אִשְׁתּוֹ
  choice: 妻子把……告诉他
  rationale: נגד的使役形在此意为“告诉、陈明、报告”；“告诉他”符合现代汉语叙事习惯。
- source_word: אֶת הַדְּבָרִים הָאֵלֶּה
  choice: 这些事
  rationale: דברים既可指“话”，也可指“事情”。这里所指的是先前发生的一连串事件，因此译作“这些事”。
- source_word: וַיָּמָת לִבּוֹ בְּקִרְבּוֹ
  choice: 他的心就在他里面死了
  rationale: 保留原文强烈而含混的意象，不把它改写成心脏病、休克或中风等具体医学诊断。
- source_word: וְהוּא הָיָה לְאָבֶן
  choice: 他就变得像石头一样
  rationale: 以自然汉语表达希伯来文“成为石头”的比喻，既保留形象，也不额外断定其具体身体状况。
theological_decisions:
- issue: 是否把拿八的状况解释为具体疾病
  choice: 保留“他的心就在他里面死了，他就变得像石头一样”的叙事意象
  alternative: 译为“他心脏病发作”“他中风瘫痪”或其他明确医学诊断
  rationale: 希伯来文使用形象化叙述，并未给出技术性的医学诊断。译文应保留这种含混性，不加入经文没有明确表达的结论。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“醒了酒”确保普通读者能直接理解；“他的心就在他里面死了”则有意保留希伯来文突兀而强烈的表达。分号用来呈现妻子告知此事与拿八随即反应之间的紧密关系。
