base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/026.yaml
  text: And he said, “Blessed be the LORD, the God of Shem, and let Canaan be their slave.”
translation:
  language: zh_hans
  text: 他说：“耶和华——闪的上帝——当受称颂！愿迦南作他们[a]的奴仆。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他们”所对应的希伯来语代词通常为复数；在诗体中也可能用作单数“他”。这里所指的对象并不明确。
    reason: 保留 לָמוֹ 在数和指代对象上的真实歧义。
lexical_decisions:
- source_word: בָּרוּךְ
  choice: 是当受称颂的
  rationale: 保留希伯来语对耶和华的颂赞含义；此处并非祈求上帝蒙福，而是宣告他配受称颂。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的传统专名来对应四字神名。
- source_word: עֶבֶד
  choice: 奴仆
  rationale: 该词在此处表达受制于人的卑下身份；“奴仆”既保留奴役含义，也符合庄重叙事语体。
- source_word: לָמוֹ
  choice: 他们的
  rationale: 按其通常的复数形式译为“他们的”，与所给审定文本一致；其指代对象及诗体中可能的单数用法另以脚注说明。
theological_decisions:
- issue: 祝颂的对象
  choice: 耶和华是当受称颂的
  alternative: 愿耶和华赐福
  rationale: 原文 בָּרוּךְ יְהוָה 是对耶和华的颂赞，不能转化为向耶和华求福。
- issue: לָמוֹ 的数与指代
  choice: 正文采用复数“他们的”，同时保留歧义脚注
  alternative: 译作单数“他的”，并具体认定指向闪
  rationale: לָמוֹ 形态上通常是复数，但诗歌中偶可作单数；原文没有明确说出其所指，不宜在正文中替作者消除歧义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“耶和华——闪的上帝——”以破折号清楚呈现同位关系；“愿”表达 וִיהִי 的祈愿或宣告语气。
