  text: שְׁלֹשָׁ֥ה אֵ֖לֶּה בְּנֵי נֹ֑חַ וּ/מֵ/אֵ֖לֶּה נָֽפְצָ֥ה כָל הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/019.yaml
  text: These three were the sons of Noah[a], and from these the whole earth was populated.
translation:
  language: zh_hans
  text: 这三人是挪亚的儿子；全地的人都从这三人而出，分散各地。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“全地从这三人分散开来。”这里“全地”可指全地的居民；“分散”也可译为“散布开来”。
    reason: 说明原文以“全地”为主语的表达，并保留נָפְצָה“分散、散布”的字面核心及其转喻用法。
lexical_decisions:
- source_word: שְׁלֹשָׁה אֵלֶּה
  choice: 这三个人
  rationale: 原文是前置并带强调意味的名词短语，直译近于“这三个”；加“人”符合现代汉语表达，也清楚指向上文所列的三个儿子。
- source_word: בְּנֵי נֹחַ
  choice: 就是挪亚的儿子
  rationale: 希伯来文没有明写系词；“就是”自然补足判断关系，并保留对这三人身份的强调。
- source_word: וּמֵאֵלֶּה
  choice: 都是从他们
  rationale: מִן与指示代词连用，意为“从这些人”。中文用“他们”避免生硬，同时明确后世人群源自挪亚的这三个儿子。
- source_word: נָפְצָה
  choice: 繁衍散布开来
  rationale: 该动词的核心意象是分散、散布；在洪水后族群发展的语境中，也涉及人口由他们而出。“繁衍散布开来”兼顾语境意义与词根的分散意象，不把两者之一悄然抹去。
- source_word: כָל הָאָרֶץ
  choice: 全地的人
  rationale: 字面为“全地”，但与“散布”搭配时以地域代指其居民。正文补出“人”以符合现代汉语，并保留“全地”的普遍范围；字面形式在脚注中说明。
theological_decisions:
- issue: 洪水后列国语境中הָאָרֶץ的范围
  choice: 全地
  alternative: 全境／全地的人群
  rationale: 本节概括挪亚三个儿子的后裔散布各处，普遍性的“全地”比局部性的“全境”更符合上下文；这属于语境中的词义判断，不额外引入教派立场。
- issue: נָפְצָה所表达的是人口繁衍还是分散
  choice: 繁衍散布开来
  alternative: 散布开来／遍布全地
  rationale: 原词本身突出分散，而家谱语境表明人群由三子繁衍而出。正文并列呈现这两层含义，避免只采用“人口增加”而丢失原文意象，也避免将其理解成单纯混乱的驱散。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“这三个人就是……”承接上文名单；分号呈现原文两个紧密相连的分句。“繁衍散布开来”既自然交代人口来源，也保留希伯来文“分散、散布”的语义张力。
