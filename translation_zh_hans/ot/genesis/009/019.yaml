revisions:
- from: 这三个人就是挪亚的儿子；全地的人都是从他们繁衍散布开来的。[a]
  to: 这三人是挪亚的儿子；全地的人都从这三人而出，分散各地。[a]
  rationale: 修订删除原文未明说的“繁衍”，以“从这三人而出”交代家谱语境中的来源，再以“分散各地”准确呈现原文动词。脚注保留更贴近希伯来文的表述，并说明“全地”指居民的可能转喻，兼顾源文忠实、中文自然度与英文审计轨迹所记录的词义歧义。
