base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/013.yaml
  text: I have set my bow in the cloud[a], and it will be a sign of the covenant between me and the earth.
translation:
  language: zh_hans
  text: 我把我的弓放在云中[a]，它要作为我与大地之间的约的记号。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“我的彩虹”。希伯来文直译为“我的弓”，使用的是通常表示弓的词；在这里的语境中，它指云中的彩虹。
    reason: lexical_alternative
lexical_decisions:
- source_word: קַשְׁתִּי
  choice: 我的弓
  rationale: קֶשֶׁת通常指弓，尤指武器；本节因其在云中，所指是彩虹。正文保留“弓”的原文意象，脚注说明语境意义。
- source_word: נָתַתִּי
  choice: 我把……放在
  rationale: נתן可表示给予、放置或安设；此处搭配“在云中”，译为“把……放在”自然且准确，并体现完成动作的现时效力。
- source_word: בֶּעָנָן
  choice: 在云中
  rationale: 原文为带定指含义的单数“云”；汉语“在云中”可自然地作集合或泛指理解，无须改为复数。
- source_word: וְהָיְתָה
  choice: 它要作
  rationale: 此处表示由前一行动所产生的未来功用；“要作”既自然，也保留指定其为记号的语气。
- source_word: לְאוֹת בְּרִית
  choice: 作……立约的记号
  rationale: אוֹת是记号、标记；בְּרִית指上下文已经设立的约。汉语用“立约的记号”能清楚表达这是约的标志。
- source_word: בֵּינִי וּבֵין הָאָרֶץ
  choice: 我与大地
  rationale: אֶרֶץ可指土地或大地；洪水叙事及此约的普世范围支持“大地”。“我与大地”嵌入“立约的记号”结构，准确表达双方关系。
theological_decisions:
- issue: 约的语境中קַשְׁתִּי所指为何
  choice: 正文直译为“我的弓”，按语境理解为彩虹
  alternative: 我的彩虹
  rationale: 原文使用普通的“弓”一词，保留它可呈现弓形以及可能的武器意象，而不替原文消解张力；脚注则确保现代读者明白此处指云中的彩虹。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“大地”比“地”更清楚地体现洪水之约的普世范围；“立约的记号”避免生硬的“约的记号”，同时不添加宗派性解释。
