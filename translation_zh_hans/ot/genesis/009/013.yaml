  terminology: “弓”“云中”“记号”“约”“大地”均合宜。“约”应明确为双方之间的约，不宜用“立约的记号”替代，以免改变修饰关系。脚注保留“彩虹”这一语境性释义，同时说明正文“弓”的字面含义，符合源语优先原则。
