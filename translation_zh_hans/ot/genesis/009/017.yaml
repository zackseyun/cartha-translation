  text: וַ/יֹּ֥אמֶר אֱלֹהִ֖ים אֶל נֹ֑חַ זֹ֤את אֽוֹת הַ/בְּרִית֙ אֲשֶׁ֣ר הֲקִמֹ֔תִי בֵּינִ֕/י וּ/בֵ֥ין כָּל בָּשָׂ֖ר אֲשֶׁ֥ר עַל הָ/אָֽרֶץ־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/017.yaml
  text: And God said to Noah[a], “This is the sign of the covenant that I have established between me and all flesh that is on the earth.”
translation:
  language: zh_hans
  text: 上帝对挪亚说：“这就是我在我和地上一切有血肉的活物之间所立之约的记号。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 承接前文推进叙事；现代汉语通常无需把连接词机械译作“然后”或“于是”.
- source_word: אֱלֹהִים
  choice: 上帝
  rationale: 此处指向挪亚说话的独一上帝；“上帝”是现代汉语中自然、庄重的通行译法。
- source_word: אֶל נֹחַ
  choice: 对挪亚
  rationale: 介词标明说话对象；“挪亚”采用中文圣经传统中通行的人名译法。
- source_word: זֹאת
  choice: 这就是
  rationale: 指示词构成判断句；“这就是”自然表达对约之记号的确认和指认。
- source_word: אוֹת
  choice: 记号
  rationale: 该词指可见的标志或凭据；结合虹与约的语境，“记号”准确而自然。
- source_word: הַבְּרִית
  choice: 约
  rationale: בְּרִית是重要的圣经用语；“约”简洁地保留其关系性和神学连续性。
- source_word: הֲקִמֹתִי
  choice: 我……所立
  rationale: קום的使役式与“约”搭配，表示设立或确立约；“所立之约”符合庄重而自然的现代汉语表达。
- source_word: בֵּינִי וּבֵין
  choice: 在我与……之间
  rationale: 准确表达约所涉及的双方关系。
- source_word: כָּל בָּשָׂר
  choice: 一切有血肉的
  rationale: 尽量保留“所有肉体”的希伯来语意象，同时在汉语中指向有血肉的生命，避免缩窄为全人类。
- source_word: אֲשֶׁר עַל הָאָרֶץ
  choice: 地上
  rationale: 修饰“一切有血肉的”，表达其位于大地之上；此处不宜缩窄为某一片土地。
theological_decisions:
- issue: 挪亚之约中כָּל בָּשָׂר的范围
  choice: 一切有血肉的
  alternative: 一切活物；全人类
  rationale: 本章语境中的措辞范围广于人类，包括地上的动物生命。“一切有血肉的”保留原文的身体性意象和范围上的张力，不把它解释性地缩窄为人类。
translation_notes:
  register: 采用现代、庄重且易懂的叙事语言。“所立之约”略带经文语体，但仍属当代读者易于理解的表达；脚注保留原文“一切肉体”的字面意象及其广泛含义。
