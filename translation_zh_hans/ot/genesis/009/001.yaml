  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יְבָ֣רֶךְ אֱלֹהִ֔ים אֶת נֹ֖חַ וְ/אֶת בָּנָ֑י/ו וַ/יֹּ֧אמֶר לָ/הֶ֛ם פְּר֥וּ וּ/רְב֖וּ וּ/מִלְא֥וּ אֶת הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/001.yaml
  text: And God blessed Noah and his sons[a], and said to them, “Be fruitful and multiply and fill the earth.”
translation:
  language: zh_hans
  text: 上帝赐福给挪亚和他的儿子们，对他们说：“要生养众多，遍满大地。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “大地”也可译作“那地”；但洪水后的语境以及与创世记1:28的呼应，更支持这里指整个大地。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבָרֶךְ
  choice: 赐福
  rationale: 此处 ברך 的加强词干表示上帝实际赐下福分，而不只是口头称颂；“赐福”在现代汉语中准确、自然。
- source_word: אֱלֹהִים
  choice: 上帝
  rationale: 在本叙事中指独一的上帝；采用现代标准汉语中通行且庄重的称谓。
- source_word: נֹחַ
  choice: 挪亚
  rationale: 采用现代中文圣经传统中广为人知的标准音译。
- source_word: בָּנָיו
  choice: 他的儿子们
  rationale: 原文明确为复数“儿子”，不泛化为“儿女”或“孩子”。
- source_word: וַיֹּאמֶר לָהֶם
  choice: 对他们说
  rationale: 自然保留希伯来叙事中引出直接引语的常用表达，不增添命令之外的解释色彩。
- source_word: פְּרוּ וּרְבוּ
  choice: 要生养众多
  rationale: 这是创世记中固定而凝练的繁衍用语，既表达生育和人数增多，也保留与创世记1:28的语言呼应。
- source_word: וּמִלְאוּ
  choice: 遍满
  rationale: 在“生养众多”的搭配中，“遍满”自然表达充满广大地域的结果，也保留命令语气。
- source_word: הָאָרֶץ
  choice: 大地
  rationale: 洪水后的上下文和创世记1:28的呼应支持全球范围；“大地”比局部性的“那地”更合适，同时保持庄重自然。
theological_decisions:
- issue: 与创世记1:28创造使命的关系
  choice: 采用“要生养众多，遍满大地”以保留重复用语和神学连续性
  alternative: 译作“要多生儿女，使人类遍布全世界”等解释性表达
  rationale: 原文有意重申创造时的赐福与命令；凝练的传统表达可保留这种呼应，而不把含义扩写为解释。
- issue: 赐福与随后命令的关系
  choice: 并列呈现“赐福……说”，不解释命令是赐福的内容还是结果
  alternative: 增译为“上帝赐福……，吩咐他们”或“赐福说”
  rationale: 原文仅以叙事连接词并列赐福和说话；译文不应替读者预先界定二者的精确逻辑关系。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“生养众多，遍满大地”保留创世记关键语句的凝练节奏；使用“儿子们”忠实反映原文性别和复数。脚注标记置于相关句末。
