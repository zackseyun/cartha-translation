  text: וַ/יֹּ֤אמֶר אֱלֹהִים֙ אֶל נֹ֔חַ וְ/אֶל בָּנָ֥י/ו אִתּ֖/וֹ לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/008.yaml
  text: Then God said to Noah and to his sons with him, saying,
translation:
  language: zh_hans
  text: 于是，上帝对挪亚和同他在一起的儿子们说：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 于是……说
  rationale: 叙事性连续式推动情节向前；“于是”自然体现先后承接关系。
- source_word: אֱלֹהִים
  choice: 上帝
  rationale: 此处指向挪亚说话的独一上帝；“上帝”是现代汉语中清楚、通行的译法。
- source_word: אֶל נֹחַ
  choice: 对挪亚
  rationale: 介词 אֶל 在言说动词后标明说话对象，汉语自然表达为“对挪亚”。
- source_word: וְאֶל בָּנָיו
  choice: 和……儿子们
  rationale: 保留并列的第二组受话者；בָּנִים 在此明确指儿子，不泛化为“孩子”。
- source_word: אִתּוֹ
  choice: 同他在一起的
  rationale: 该短语修饰挪亚的儿子们，说明他们与挪亚同在；此译法避免汉语中“和他的儿子们一起”可能误修饰说话者的歧义。
- source_word: לֵאמֹר
  choice: 说：
  rationale: 该不定式引出下文直接话语。汉语以“说：”及冒号自然承担这一功能，无须重复译成“说道”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而自然的叙事用语。“于是”承接前文并推进叙事；通过“同他在一起的儿子们”清楚保留 אִתּוֹ 的修饰关系。
