base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/015.yaml
  text: and I will remember my covenant that is between me and you and every living creature among all flesh[b][a], and the waters will never again become a flood to destroy all flesh.
translation:
  language: zh_hans
  text: 我必记念我的约，就是我同你们和一切有血肉的活物之间的约；水必不再成为洪水，毁灭一切有血肉的活物。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְזָכַרְתִּי
  choice: 我必记念
  rationale: 该形式在上帝的宣告中表达将来意义；保留“记念”这一盟约用语，不改写为解释性的表达。
- source_word: בְּרִיתִי
  choice: 我……所立的约
  rationale: “约”准确保留בְּרִית的正式关系与应许含义；汉语以“所立的约”自然表达约存在于各方之间。
- source_word: כָּל נֶפֶשׁ חַיָּה בְּכָל בָּשָׂר
  choice: 一切有血肉的活物
  rationale: נֶפֶשׁ חַיָּה在此指有生命的受造物；בְּכָל בָּשָׂר限定其有血肉的范围。此译法包括动物，不缩窄为人类。
- source_word: וְלֹא יִהְיֶה עוֹד הַמַּיִם לְמַבּוּל
  choice: 水必不再泛滥成洪水
  rationale: “不再”表达永久不重演；“泛滥成洪水”自然呈现水成为מַבּוּל的结果或作用。
- source_word: לְשַׁחֵת כָּל בָּשָׂר
  choice: 毁灭一切有血肉的
  rationale: “毁灭”保留动词的沉重语义；“一切有血肉的”维持原文重复及其涵盖人和动物的广泛范围。
theological_decisions:
- issue: 上帝“记念”的拟人性盟约语言
  choice: 保留“我必记念”
  alternative: 我必顾念／我必履行我的约
  rationale: 原文明确使用“记念”；直接保留可维持盟约语言及其神学张力，避免用解释性改写来界定上帝如何记念。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“有血肉的活物”既贴近原文，又避免将盟约对象误限于人类；分号清楚呈现记念盟约与洪水不再毁灭之间的关联。
