- source_word: וַיְחִי
  choice: 又活了
  rationale: חיה的叙事式未完成时在这里说明挪亚在洪水之后继续存活的年数。“又活了”自然表达从洪水以后延续的寿命，同时不把重点转成“幸存”。
- source_word: נֹחַ
  choice: 挪亚
  rationale: 采用现代中文圣经传统中广为人知的人名译法。
- source_word: אַחַר
  choice: 以后
  rationale: 表示时间上的随后；与“洪水”搭配时，“洪水以后”简明自然。
- source_word: הַמַּבּוּל
  choice: 洪水
  rationale: 带定冠词，指前文叙述的那场洪水；“洪水”是清楚、通行的现代中文表达。
- source_word: שְׁלֹשׁ מֵאוֹת שָׁנָה וַחֲמִשִּׁים שָׁנָה
  choice: 三百五十年
  rationale: 按现代汉语数词习惯合并表达总数，准确对应三百年加五十年。
