source:
  edition: WLC
  text: וְ/אֵ֨ת כָּל נֶ֤פֶשׁ הַֽ/חַיָּה֙ אֲשֶׁ֣ר אִתְּ/כֶ֔ם בָּ/ע֧וֹף בַּ/בְּהֵמָ֛ה וּֽ/בְ/כָל חַיַּ֥ת הָ/אָ֖רֶץ אִתְּ/כֶ֑ם מִ/כֹּל֙ יֹצְאֵ֣י הַ/תֵּבָ֔ה לְ/כֹ֖ל חַיַּ֥ת הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/010.yaml
  text: 'and with every living creature that is with you: the birds[a], the livestock, and every beast of the earth with you, from all that came out of the ark[d][c][b], every beast of the earth.'
translation:
  language: zh_hans
  text: 以及所有与你们同在的活物[a]，就是飞鸟、牲畜和一切与你们同在的地上野兽；凡从方舟里出来的，地上一切野兽，都包括在内。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “活物”也可较直译为“活的生命”或“有生命的活物”；这里泛指活着的动物。
    reason: 说明נֶפֶשׁ הַחַיָּה的字面构成和语境含义。
  - marker: b
    text: 本节末尾的希伯来文结构较难，也可较直译为：“从所有出方舟的，到地上一切野兽”；其中末尾短语也有人理解为“为着地上一切野兽”。
    reason: 保存מִכֹּל…לְכֹל及重复短语的真实句法歧义。
lexical_decisions:
- source_word: נֶפֶשׁ הַחַיָּה
  choice: 活物
  rationale: 该词组在这里泛指有生命的动物。“活物”简洁自然，也保留“有生命的受造物”这一宽泛含义，不采用容易使现代读者联想到非物质灵魂的“活的魂”。
- source_word: בָּעוֹף
  choice: 飞鸟
  rationale: עוֹף可泛指会飞的生物；在飞鸟、牲畜、野兽的分类中，“飞鸟”符合现代汉语圣经叙事的庄重语体，并避免增添原文没有的“空中”。
- source_word: בַּבְּהֵמָה
  choice: 牲畜
  rationale: 此处与飞鸟和地上野兽并列，主要指家养陆生动物。“牲畜”比“牛”范围更准确。
- source_word: חַיַּת הָאָרֶץ
  choice: 地上野兽
  rationale: 该表达在此与בְּהֵמָה“牲畜”有类别上的区别，故用“野兽”而非笼统的“走兽”或“动物”；“地上”保留הָאָרֶץ。
- source_word: מִכֹּל יֹצְאֵי הַתֵּבָה לְכֹל חַיַּת הָאָרֶץ
  choice: 凡从方舟里出来的，地上一切野兽，都包括在内
  rationale: 希伯来文结尾结构紧缩且有重复。正文以自然汉语表达其概括、重申范围的作用，同时用脚注保存较形式对应的读法及句法难点。
theological_decisions:
- issue: 立约所涵盖动物的范围及本节末尾的句法
  choice: 将末尾理解为概括并重申：与挪亚同出方舟的动物、直至地上一切野兽，都在所述范围内
  alternative: 较形式化地译作“从所有出方舟的，到地上一切野兽”或“为着地上一切野兽”
  rationale: 原文的מִן与לְ结构及末尾重复容许不同句法分析。正文不把它解释为新的目的从句，也不缩小动物参与者的范围；脚注明确保留另一种形式对应的可能。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“就是”清楚引出动物类别；分号呈现原文后半句紧缩而重复的结构。“都包括在内”属于最少量的汉语补足，用来表达语境中的范围重申，具体形式歧义则在脚注中保留。
