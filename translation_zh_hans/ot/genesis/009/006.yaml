base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/006.yaml
  text: Whoever sheds the blood of man[a], by man shall his blood be shed[b], for God made man in his image.
translation:
  language: zh_hans
  text: 凡流人血的，他的血也必被人所流[a]；因为上帝照着自己的形象造了人[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “人”译自希伯来语אָדָם（adam），在这里泛指人或人类，并非只指男性。“被人所流”表达原文中“由人”执行的意思。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为：“因为上帝按上帝的形象造了人。”本节三次出现的“人”都译自希伯来语אָדָם（adam）。
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁפֵךְ דַּם הָאָדָם
  choice: 凡流人血的
  rationale: Qal分词在这里表达泛指、格言式的法律陈述。“凡……的”自然传达“无论谁”的含义；“流人血”保留原文的血之意象，并在现代汉语中可自然指夺取人的性命。
- source_word: בָּאָדָם
  choice: 由人来
  rationale: 将介词ב理解为表示施事者，说明流人血者的血要由人来流；这一译法符合句法和上下文，同时避免扩展为经文本身没有明说的制度性论述。
- source_word: דָּמוֹ יִשָּׁפֵךְ
  choice: 他的血也必……流
  rationale: 保留“他的血”以及Niphal未完成式的被动含义和庄严确定的语气；“必”比“必须”较少额外强调义务性。
- source_word: כִּי
  choice: 因为
  rationale: 引出前述规定的理由，现代汉语清楚自然。
- source_word: בְּצֶלֶם אֱלֹהִים
  choice: 照着自己的形象
  rationale: בְּצֶלֶם表示按着或以……形象；“自己”回指明确的主语“上帝”，自然表达原文“上帝的形象”，而不造成上帝具有另一个指涉对象的误解。
- source_word: עָשָׂה אֶת־הָאָדָם
  choice: 造了人
  rationale: עָשָׂה直译为“造、做”，这里用“造”符合创造语境，却不把它改成原文未使用的בָּרָא。“人”泛指人类或人，与本节前两处אָדָם形成语义呼应。
theological_decisions:
- issue: בָּאָדָם表示人的施事，还是表示在人类中发生
  choice: 由人来流
  alternative: 在人中被流
  rationale: 施事用法最符合这句对称结构：流人血者的血将由人来流。但介词ב本身容许范围性的理解，因此以脚注保留较少采用的可能性，不把译文扩充成完整的刑罚制度教义。
- issue: אָדָם在本节中的泛指含义
  choice: 人
  alternative: 人类／一个人
  rationale: 希伯来语אָדָם在这里不是专指男性，而是泛指人或人类。汉语“人”既简洁又自然，并能保留三次出现אָדָם所形成的修辞联系。
- issue: 上帝形象从句的表达
  choice: 因为上帝照着自己的形象造了人
  alternative: 因为上帝照着上帝的形象造了人
  rationale: 原文的语序较直：“因为上帝按上帝的形象造了人。”用反身代词“自己”不改变指涉，且使现代汉语自然流畅，保留人的生命尊严以其受造于上帝形象为依据的论述。
translation_notes:
  register: 采用现代、庄重而易懂的书面语。“凡……的……必……”保留原文格言式、司法性的节奏；重复“流”和“血”，呈现希伯来文前后对应的结构。
