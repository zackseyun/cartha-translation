  yaml_path: translation/ot/genesis/009/020.yaml
  text: Noah[a], a man of the soil[b], began to plant a vineyard.
translation:
  language: zh_hans
  text: 挪亚是个耕种土地的人；他开始栽种葡萄园。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文句式简略；也可译为：“挪亚是个耕种土地的人，是第一个栽种葡萄园的人。”或：“挪亚开始作农夫，栽种了一个葡萄园。”
    reason: 保留简略希伯来句式可能产生的不同理解。
lexical_decisions:
- source_word: וַיָּחֶל
  choice: 开始
  rationale: 该词在这里最自然地表示“开始”；希伯来文句式简略，其意义延续到后面的“栽种”。
- source_word: נֹחַ
  choice: 挪亚
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: אִישׁ הָאֲדָמָה
  choice: 种地的人
  rationale: 直译为“土地之人”，在上下文中指耕种土地的人；“种地的人”既保留农业含义，也比“土地的人”更符合现代汉语。
- source_word: וַיִּטַּע
  choice: 栽种
  rationale: נָטַע是栽植植物的常用动词；与“葡萄园”搭配时，“栽种”自然准确。
- source_word: כָּרֶם
  choice: 葡萄园
  rationale: 指栽培葡萄的园地，采用准确而通行的中文表达。
theological_decisions:
- issue: 如何理解简略结构 וַיָּחֶל ... וַיִּטַּע
  choice: 开始栽种葡萄园
  alternative: 是第一个栽种葡萄园的人；或：开始作农夫，栽种了葡萄园
  rationale: 把“开始”的意义接续到后面的“栽种”，最符合叙事语流，又不增加原文未明说的“第一个”。不过，原文结构高度凝练，其他理解仍有语法与释义传统上的依据，因此在脚注中保留。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“这个种地的人”表达同位说明关系；“开始栽种”将两个连续动词顺畅地合并，同时保留原文的主要语义。
