reference: Genesis 9:11
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/הֲקִמֹתִ֤י אֶת בְּרִיתִ/י֙ אִתְּ/כֶ֔ם וְ/לֹֽא יִכָּרֵ֧ת כָּל בָּשָׂ֛ר ע֖וֹד מִ/מֵּ֣י הַ/מַּבּ֑וּל וְ/לֹֽא יִהְיֶ֥ה ע֛וֹד מַבּ֖וּל לְ/שַׁחֵ֥ת הָ/אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/011.yaml
  text: 'And I will establish my covenant with you: never again will all flesh be cut off by the waters of the flood[b][a], and never again will there be a flood to destroy the earth.'
translation:
  language: zh_hans
  text: 我要与你们立定我的约：一切有血肉的[a]，再也不会因洪水而被剪除[b]；也再不会有洪水毁灭大地。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “一切有血肉的”广指有血肉的活物，包括人和动物，并非只指人类。
    reason: lexical_alternative
  - marker: b
    text: “被剪除”也可译作“被毁灭”；希伯来语动词的字面意思是“被剪除”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲקִמֹתִי
  choice: 立定
  rationale: קום的使役式用于“约”时表示使之确立、坚定。“立定”既保留立约语体的庄重，也不武断判定这是首次设立还是确认既有之约。
- source_word: בְּרִיתִי
  choice: 我的约
  rationale: בְּרִית是《创世记》中固定的立约用语；“约”是现代中文圣经语境中自然、庄重且意义明确的对应词。
- source_word: אִתְּכֶם
  choice: 与你们
  rationale: 准确表达复数受约对象，中文也自然清楚。
- source_word: יִכָּרֵת
  choice: 剪除
  rationale: כרת的尼法勒式字面义为“被剪除”，在本语境指遭毁灭。正文保留其形象，脚注说明可按结果理解为“毁灭”。
- source_word: כָּל־בָּשָׂר
  choice: 凡有血肉的
  rationale: 保留希伯来语“所有肉体”的广泛表达，不将范围缩窄为人类；在本段语境中包括人和动物。
- source_word: עוֹד
  choice: 再也不／再不会
  rationale: 在否定的应许语境中，עוֹד自然表达“永不再”的意思；中文用“再也不会”和“再不会”体现两次否定的力度。
- source_word: מִמֵּי הַמַּבּוּל
  choice: 被洪水淹没而
  rationale: מן在此表达洪水之水作为造成毁灭的原因或媒介。中文将其译为“被洪水淹没而”，比“被洪水的水”自然，同时保留因洪水而剪除的关系。
- source_word: מַבּוּל
  choice: 洪水
  rationale: 这是挪亚叙事中מַבּוּל的标准、通俗而准确的中文表达。
- source_word: לְשַׁחֵת
  choice: 毁灭
  rationale: שׁחת在此表示毁坏、灭绝；“毁灭”直接体现审判性破坏的力度。
- source_word: הָאָרֶץ
  choice: 大地
  rationale: 洪水叙事中的הָאָרֶץ范围广泛；“大地”既能表达整体陆地世界，又比“土地”更符合此处的普遍范围。
theological_decisions:
- issue: “凡有血肉的”的范围
  choice: 保留广义表达“凡有血肉的”，并以脚注说明包括人和动物。
  alternative: 全人类；一切活物
  rationale: 洪水之后立约的上下文明确涉及人和动物。保留原文表达可避免把应许错误地限于人类，也避免在正文中将其完全解释化。
- issue: קום与“约”连用的含义
  choice: 译作“立定我的约”。
  alternative: 设立我的约；坚立我的约；确认我的约
  rationale: “立定”保留约的庄重语域，同时不过度裁定此约究竟是新设立还是正式确认。
- issue: 洪水应许的具体范围
  choice: 表述为不再以洪水剪除凡有血肉的，也不再有洪水毁灭大地。
  alternative: 泛化为上帝不再以任何方式毁灭世界
  rationale: 原文的应许具体限定于洪水；译文不把这一应许扩大为绝不发生任何其他形式的审判或毁灭。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“立定我的约”保留立约语体；“被洪水淹没而剪除”兼顾中文流畅度与希伯来语כרת的字面形象。两个脚注标记均置于正文相关词语之后。
