base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/018.yaml
  text: The sons of Noah who came out of the ark were Shem, Ham, and Japheth; and Ham was the father of Canaan.
translation:
  language: zh_hans
  text: 从方舟里出来的挪亚的儿子是闪、含和雅弗；含是迦南的父亲。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: 是
  rationale: 此处是叙事中的系词用法，说明从方舟出来的挪亚众子是谁；译作“是”自然准确，不加入“成为”的状态变化含义。
- source_word: בְנֵי נֹחַ
  choice: 挪亚的儿子
  rationale: 忠实表达希伯来语构造关系；结合后列三个人名，汉语无需另加“众”也能自然表示复数。
- source_word: הַיֹּצְאִים מִן הַתֵּבָה
  choice: 从方舟里出来的
  rationale: 定冠词加分词在此作限定性修饰语；“从方舟里出来”自然表达由封闭空间出来，并保留介词所指的来源。
- source_word: שֵׁם וְחָם וָיָפֶת
  choice: 闪、含和雅弗
  rationale: 采用现代中文圣经语境中通行且易辨识的人名译法，并按汉语列举习惯连接。
- source_word: וְחָם הוּא אֲבִי כְנָעַן
  choice: 含是迦南的父亲
  rationale: 保留原文明确的亲属身份说明及其为后文铺垫的叙事作用；“是……的父亲”直接、庄重而自然。
theological_decisions:
- issue: 含与迦南的族谱说明
  choice: 在正文中明确保留“含是迦南的父亲”
  alternative: 将此句弱化为附带说明，或用标点、措辞淡化其叙事分量
  rationale: 原文明确指出含与迦南的父子关系，为下文情节预作铺垫。译文只保留文本本身的身份说明，不引入后世的族群或神学推论。
translation_notes:
  register: 采用现代、庄重且易懂的书面普通话。“从方舟里出来的挪亚的儿子”保留原文修饰结构；分号呈现后半句既承接前文又具有背景说明作用。
