  text: וַ/יִּקַּח֩ שֵׁ֨ם וָ/יֶ֜פֶת אֶת הַ/שִּׂמְלָ֗ה וַ/יָּשִׂ֨ימוּ֙ עַל שְׁכֶ֣ם שְׁנֵי/הֶ֔ם וַ/יֵּֽלְכוּ֙ אֲחֹ֣רַנִּ֔ית וַ/יְכַסּ֕וּ אֵ֖ת עֶרְוַ֣ת אֲבִי/הֶ֑ם וּ/פְנֵי/הֶם֙ אֲחֹ֣רַנִּ֔ית וְ/עֶרְוַ֥ת אֲבִי/הֶ֖ם לֹ֥א רָאֽוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/023.yaml
  text: Then Shem and Japheth took the garment and laid it on both their shoulders[a], and they walked backward and covered their father's nakedness. Their faces were turned backward, so they did not see their father's nakedness.
translation:
  language: zh_hans
  text: 于是，闪和雅弗拿起那件外衣，搭在两人的肩上[a]，倒退着走，遮盖了他们父亲的赤身。他们的脸都朝后，所以没有看见父亲的赤身。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “外衣”也可译作“衣服”。希伯来语所用的词指可披在身上的衣物，这里被用来遮盖挪亚。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: 拿起
  rationale: לקח在叙事中表示拿取；“拿起”自然地表达二人取来并使用衣物的动作。希伯来语动词虽为单数，但复合主语“闪和雅弗”在中文中自然按二人共同施行动作来表达。
- source_word: שֵׁם וָיֶפֶת
  choice: 闪和雅弗
  rationale: 采用现代中文圣经人名的通行译法。
- source_word: הַשִּׂמְלָה
  choice: 那件外衣
  rationale: שׂמלה指衣服，常为外衣；定冠词在语境中可自然译作“那件”。“外衣”保留可用于遮盖挪亚的具体衣物意象，又不译成用途更专一的“遮盖物”。
- source_word: וַיָּשִׂימוּ עַל שְׁכֶם שְׁנֵיהֶם
  choice: 搭在两人的肩上
  rationale: 原文直译为“放在他们二人的肩上”。“搭在”符合衣物共同置于肩上的动作；“两人的肩上”保留שְׁנֵיהֶם所强调的二人共同承托。
- source_word: וַיֵּלְכוּ אֲחֹרַנִּית
  choice: 倒退着走进去
  rationale: אֲחֹרַנִּית表示向后；“倒退着走”准确而自然。中文补出“进去”，使他们接近并遮盖父亲的场景动作清楚，但不改变方向与目的。
- source_word: וַיְכַסּוּ
  choice: 遮盖了
  rationale: כסה在此表示用衣物盖住，译作“遮盖”兼具具体性和庄重感。
- source_word: עֶרְוַת אֲבִיהֶם
  choice: 他们父亲的赤身
  rationale: עֶרְוָה可指裸露状态或羞处；本节具体描述用衣物遮盖并避免看见，因此“赤身”保留原文的裸露与羞耻含义，同时不擅自引入更特定的性含义。第二次出现依中文自然表达省去“他们”，仍保持原文重复。
- source_word: וּפְנֵיהֶם אֲחֹרַנִּית
  choice: 他们的脸朝向后面
  rationale: 原文为无动词句，直陈他们脸的朝向。“朝向后面”在现代中文中清楚，并与前句“倒退”形成刻意重复。
- source_word: לֹא רָאוּ
  choice: 没有看见
  rationale: ראה的普通含义为“看见”；不采用“注视”等译法，以免增添原文未明说的主观意图。
theological_decisions:
- issue: “父亲的赤身”在本节中的含义
  choice: 保留为挪亚身体赤裸、被儿子用衣物遮盖的具体描述
  alternative: 按其他经文中相关表达的委婉用法，解释为某种性行为
  rationale: 本节的直接语境是拿衣物、倒退而行、遮盖身体，并避免看见；因此正文应保留具体而不露骨的“赤身”，既不消除原文的羞耻含义，也不把后来的委婉用法强加于此。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。保留原文两次提及向后以及两次提及父亲赤身的重复，以突出闪和雅弗刻意回避观看的行动。脚注标记置于相关短语之后。
