base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/014.yaml
  text: And when I bring clouds over the earth[a], the bow will be seen in the cloud,
translation:
  language: zh_hans
  text: 将来我使云彩笼罩大地时，那弓[a]就会在云中显现。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“彩虹”。希伯来文用的是通常表示“弓”的词；在这里指作为立约记号的彩虹。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: 将来……时
  rationale: 这一结构引出将来的时间情境；这样译既表达未来指向，也自然衔接主句。
- source_word: בְּעַנְנִי עָנָן
  choice: 我使云彩笼罩
  rationale: ענן在此作使役性动词，后接同根名词；“使云彩笼罩”以自然汉语传达“使云覆盖”的意思。
- source_word: עַל הָאָרֶץ
  choice: 大地
  rationale: 洪水之约的语境涉及全地；“大地”比局部性的“土地”更合适。
- source_word: וְנִרְאֲתָה
  choice: 就会……显现
  rationale: ראה的Niphal形态可表示“被看见”或“显现”；“显现”在现代汉语中自然，也保留其进入可见状态的含义。
- source_word: הַקֶּשֶׁת
  choice: 那弓
  rationale: 希伯来文使用普通表示“弓”的词，并以定冠词指向上文已经设立的记号；正文保留“弓”的意象，脚注说明这里所指的是彩虹。
- source_word: בֶּעָנָן
  choice: 在云中
  rationale: 按希伯来文的单数形式直译，并与前半句集合意义的“云彩”形成自然对应。
theological_decisions:
- issue: 挪亚之约中קֶשֶׁת的译法
  choice: 那弓
  alternative: 彩虹
  rationale: 原文用的是普通表示弓的词，在此语境中指作为立约记号的彩虹。正文保留词汇意象和潜在的神学张力，脚注则澄清实际所指，避免读者误解。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“将来……时……就会……”清楚表达时间关系；“笼罩”“显现”通顺易懂，同时不削弱原文意象。
