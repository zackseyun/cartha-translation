source:
  edition: WLC
  text: וְ/אַתֶּ֖ם פְּר֣וּ וּ/רְב֑וּ שִׁרְצ֥וּ בָ/אָ֖רֶץ וּ/רְבוּ בָֽ/הּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/007.yaml
  text: And as for you[a], be fruitful and multiply; swarm in the earth and multiply in it.
translation:
  language: zh_hans
  text: 至于你们，要生养众多，在地上繁衍滋生[a]，并在其上增多。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在地上成群繁衍。”希伯来语动词带有大量滋生、群集繁衍的生动意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתֶּם
  choice: 至于你们
  rationale: 连词加独立人称代词带有强调和承接作用；“至于你们”自然地体现与上文的对照及话题突出。
- source_word: פְּרוּ
  choice: 要生养
  rationale: 在祝福兼命令的语境中，פרה指生育、繁衍；与רבה连用时，“生养”符合现代中文圣经语体，也避免农业性的“结果子”。
- source_word: וּרְבוּ
  choice: 众多／增多
  rationale: רבה表示数量增加。首次与“生养”搭配译作“众多”，末次译作“增多”，既保留两次出现，也使中文自然。
- source_word: שִׁרְצוּ
  choice: 繁衍滋生
  rationale: שׁרץ带有大量滋生、群集繁衍的鲜明意象。“繁衍滋生”比单纯“遍满”更贴近其繁殖增长的语义，同时适合用于人类。
- source_word: בָאָרֶץ
  choice: 在地上
  rationale: 此处אֶרֶץ指洪水之后人类繁衍所处的全地；中文以“在地上”表达其空间范围最自然。
- source_word: וּרְבוּ בָהּ
  choice: 并在其上增多
  rationale: 保留经文末尾重复的רבה；“其”回指“地”，“在其上”清楚表达בָהּ的指代关系。
theological_decisions:
- issue: 本节与创造使命及洪水后祝福的关系
  choice: 按原文译为对挪亚一家所发出的更新命令兼祝福，不在正文中增添神学解释。
  alternative: 将其仅视为创世记1:28的机械重复，或扩写成带有特定 covenant 神学结论的公式。
  rationale: 命令式措辞明显呼应创世记1:28，但译文应保留这种呼应和张力，而不加入原文未明说的教义结论。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。“至于你们”体现强调；“繁衍滋生”保留原文强烈的增殖意象；末句重复“增多”，对应希伯来文的刻意复现。
