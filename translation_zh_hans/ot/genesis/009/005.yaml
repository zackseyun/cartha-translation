id: GEN.9.5
reference: Genesis 9:5
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/אַ֨ךְ אֶת דִּמְ/כֶ֤ם לְ/נַפְשֹֽׁתֵי/כֶם֙ אֶדְרֹ֔שׁ מִ/יַּ֥ד כָּל חַיָּ֖ה אֶדְרְשֶׁ֑/נּוּ וּ/מִ/יַּ֣ד הָֽ/אָדָ֗ם מִ/יַּד֙ אִ֣ישׁ אָחִ֔י/ו אֶדְרֹ֖שׁ אֶת נֶ֥פֶשׁ הָֽ/אָדָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/005.yaml
  text: And surely I will require your blood for your lives[a]. From the hand of every beast I will require it[e][d][c][b], and from the hand of man—from the hand of each man's brother—I will require the life of the man.
translation:
  language: zh_hans
  text: 只是，你们生命的血，我必追讨[a]；我必向每一种走兽追讨这血；我也必向人——向每个人的弟兄[b]——追讨人的生命。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译为“你们的血，为着你们的生命”。原文分别说“血”和“生命”，表明血与生命密切相关。
    reason: lexical_alternative
  - marker: b
    text: 直译为“从人手中，从各人弟兄的手中”。“每个人的弟兄”以亲属语言指另一人，强调人对他人生命所负的责任，并不只限于亲兄弟。
    reason: lexical_and_syntactic_clarification
lexical_decisions:
- source_word: וְאַךְ
  choice: 但……必
  rationale: וְ承接上文，אַךְ带有限定和强调作用；结合前节准许食用动物的语境，以“但”自然表达转折，并用“必”体现强调。
- source_word: דִּמְכֶם לְנַפְשֹׁתֵיכֶם
  choice: 你们的血，就是你们的生命
  rationale: 分别保留“血”和“生命”两个概念，并以“就是”表明此处血与生命的紧密关系，避免“生命之血……生命”的重复。
- source_word: אֶדְרֹשׁ
  choice: 追讨
  rationale: דרשׁ在流血的司法语境中指要求交账、追究责任；“追讨”简洁庄重，并可在全节重复使用。
- source_word: מִיַּד
  choice: 向……追讨
  rationale: 希伯来语直译为“从……手中”，在这里表示向肇事者追责；中文“向……追讨”自然地传达其司法和责任含义。
- source_word: כָּל חַיָּה
  choice: 无论哪一种走兽
  rationale: חַיָּה在与人对举的语境中指动物；“走兽”保持庄重，并与人明确区分。
- source_word: אֶדְרְשֶׁנּוּ
  choice: 我都要向它追讨
  rationale: 阳性单数后缀可形式上指向动物，也可理解为所追讨的血债；正文采用自然中文表达，保留追责对象。
- source_word: הָאָדָם
  choice: 人
  rationale: 此处泛指人类个体，与走兽对举；现代汉语“人”既准确又不额外限定性别。
- source_word: אִישׁ אָחִיו
  choice: 每个人的弟兄
  rationale: 保留原文“各人—他的弟兄”的分配性和亲属称谓，强调人对同类生命所负的责任。
- source_word: נֶפֶשׁ הָאָדָם
  choice: 人的生命
  rationale: נֶפֶשׁ在血债语境中指具体的生命，而非强调与身体分离的“灵魂”。
theological_decisions:
- issue: 流血语境中נֶפֶשׁ的含义
  choice: 译为“生命”
  alternative: 灵魂
  rationale: 上下文直接把血与生命联系起来，并论及夺取生命后的责任；“灵魂”会引入本节并未着重陈述的身心二分观念。
- issue: אִישׁ אָחִיו所表达的人际关系
  choice: 保留“每个人的弟兄”
  alternative: 同胞／同类／别人
  rationale: 原文以亲属语言描述人与人之间的责任。保留“弟兄”可维持其修辞张力，而不把它缩窄为仅指亲兄弟。
- issue: 动物与人造成死亡时的神圣追责
  choice: 两者均用“追讨”表达
  alternative: 要求偿还／叫……交账
  rationale: 原文三次重复דרשׁ，形成统一的司法语气；一致译为“追讨”能保留这种结构，又不具体规定经文未明说的执行方式。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。以“追讨”维持原文反复出现的司法语气；正文适度补出“使人丧命”，使“向走兽／人追讨血”的希伯来习语在中文中清楚，同时用脚注保留原文形式。
