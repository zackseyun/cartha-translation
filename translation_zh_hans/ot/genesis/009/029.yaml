  language: zh_hans
  text: 挪亚一生共活了九百五十岁；他死了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ כָּל יְמֵי נֹחַ
  choice: 挪亚一生共
  rationale: 希伯来语直译为“挪亚所有的日子是”，是概括一生年岁的固定表达；译作“一生共”既准确传达总寿数，也符合现代汉语习惯。
- source_word: תְּשַׁע מֵאוֹת שָׁנָה וַחֲמִשִּׁים שָׁנָה
  choice: 九百五十岁
  rationale: 原文将“九百年”和“五十年”并列；现代汉语自然合并为“九百五十岁”，用于人的寿数清楚顺畅。
- source_word: וַיָּמֹת
  choice: 后来他死了
  rationale: 该叙事动词承接寿数总结，并以挪亚之死结束本段；“后来”自然表达顺接关系，不额外规定死亡与前句之间的具体时间间隔。
