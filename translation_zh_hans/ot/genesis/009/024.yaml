  text: וַ/יִּ֥יקֶץ נֹ֖חַ מִ/יֵּינ֑/וֹ וַ/יֵּ֕דַע אֵ֛ת אֲשֶׁר עָ֥שָׂה ל֖/וֹ בְּנ֥/וֹ הַ/קָּטָֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/024.yaml
  text: When Noah awoke from his wine[a], he knew what his youngest son had done to him.
translation:
  language: zh_hans
  text: 挪亚从酒中醒来[a]，知道了小儿子向他所做的事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“从酒醉中清醒过来”。原文直译为“从他的酒中醒来”。
    reason: 说明希伯来语习语，并列出较具解释性的自然中文译法。
lexical_decisions:
- source_word: וַיִּיקֶץ
  choice: 醒来
  rationale: יקץ指从睡眠中醒来；本节语境是挪亚从酒后沉睡中醒来。“醒来”既自然，也不把词义扩大为“酒醒了”。
- source_word: מִיֵּינוֹ
  choice: 从酒中
  rationale: 直译为“从他的酒中”。中文“从酒中醒来”保留希伯来语的简洁表达，也让读者从语境理解这是酒后醒来，避免解释性改写为“从醉酒中清醒”。
- source_word: וַיֵּדַע
  choice: 知道了
  rationale: ידע通常意为“知道”。此处叙事次序暗示挪亚醒来后得知此事；“知道了”在现代汉语中自然地表达进入知晓状态，同时不过度说明他如何得知。
- source_word: אֵת אֲשֶׁר עָשָׂה לוֹ
  choice: 向他所做的事
  rationale: 原文只说有人“向他所做的”，没有界定具体行为。“向他所做的事”保留宾语关系和事件本身的含混性。
- source_word: בְּנוֹ הַקָּטָן
  choice: 小儿子
  rationale: קָטָן可表示小、年幼或最年幼。亲属称谓“小儿子”在现代汉语中自然，可指较小或最小的儿子，因而比明确译成“最小的儿子”更能保留原词的语义幅度。
theological_decisions:
- issue: 向挪亚所做之事的性质
  choice: 笼统译作“向他所做的事”，不说明具体行为。
  alternative: 解释为含看见并宣扬挪亚赤身之事，或解释为更严重的性侵犯。
  rationale: 本节希伯来文本没有说明该行为究竟是什么。译文应保留这一叙事和神学上的张力，不将任何特定解释写入正文。
- issue: “小儿子”所指及年龄次序
  choice: 译作“小儿子”，不在正文中明确判定是较小还是最小，也不添加具体名字。
  alternative: 译作“最小的儿子”或“较小的儿子”，并进一步认定具体所指。
  rationale: הַקָּטָן有年龄或大小比较的含义，但单凭本节不能无争议地确定其精确级别；上下文对人物所指也存在解释问题。因此保留原文称谓，不补入名字。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“从酒中醒来”有意保留原文略显凝练的习语；“小儿子”保留 קָטָן 在“较小”与“最小”之间的可能性。
