  text: וַ/יֹּ֣אמֶר אֱלֹהִ֗ים זֹ֤את אֽוֹת הַ/בְּרִית֙ אֲשֶׁר אֲנִ֣י נֹתֵ֗ן בֵּינִ/י֙ וּ/בֵ֣ינֵי/כֶ֔ם וּ/בֵ֛ין כָּל נֶ֥פֶשׁ חַיָּ֖ה אֲשֶׁ֣ר אִתְּ/כֶ֑ם לְ/דֹרֹ֖ת עוֹלָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/012.yaml
  text: And God said[a], “This is the sign of the covenant that I am giving between me and you and every living creature that is with you[b], for perpetual generations:”
translation:
  language: zh_hans
  text: 上帝说：“这是我所赐的、在我和你们以及与你们同在的一切活物之间、历世历代的约的记号：”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר אֱלֹהִים
  choice: 上帝说
  rationale: 叙事性连接词在现代汉语中可不显译；“上帝”准确指说话者，表达自然庄重。
- source_word: זֹאת אוֹת הַבְּרִית
  choice: 这是……约的记号
  rationale: 补出判断词“是”，并以“约的记号”表达该记号标示此约；“记号”符合 אוֹת 在上下文中的可见标志含义。
- source_word: אֲשֶׁר אֲנִי נֹתֵן
  choice: 我赐下的
  rationale: 保留 נֹתֵן 的“给予、赐下”意象，不改写为“订立”；“赐下”也符合上帝作为说话者的语境。
- source_word: בֵּינִי וּבֵינֵיכֶם וּבֵין
  choice: 立在我与你们，以及……之间
  rationale: 用汉语自然的“立在……之间”承接“约”，同时保留重复介词所标明的各方关系。
- source_word: כָּל נֶפֶשׁ חַיָּה
  choice: 所有……活物
  rationale: 此处涵盖与挪亚一家同在的动物；“活物”既宽泛，又避免“灵魂”可能引入的人论含义。
- source_word: אֲשֶׁר אִתְּכֶם
  choice: 同你们在一起的
  rationale: 如实保留关系从句，限定所说的活物。
- source_word: לְדֹרֹת עוֹלָם
  choice: 直到世世代代
  rationale: 自然表达跨越持续不断的历代之意，同时避免把 עוֹלָם 的语义范围过度限定为抽象的绝对永恒。
theological_decisions:
- issue: 约与分词 נֹתֵן 的关系
  choice: 我赐下的约
  alternative: 我所立的约
  rationale: 原文用的是“给予”的分词，而非通常表示“立约”的表达；译作“赐下”保留原文措辞及其张力，不以汉语惯用的“立约”取代。
- issue: נֶפֶשׁ חַיָּה 的范围
  choice: 活物
  alternative: 有生命的存在／活的魂
  rationale: 上下文明确包括动物；“活物”维持广泛的受造生命范围，也不导入有关“灵魂”的额外神学判断。
- issue: לְדֹרֹת עוֹלָם 的持续性
  choice: 直到世世代代
  alternative: 直到永远的世代／历世历代
  rationale: 该表达强调约的记号延续于不断相承的世代；所选译法保留长久持续性，而不强行裁定 עוֹלָם 在此是否必须指形而上的无限时间。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“赐下”紧贴原文 נֹתֵן；分号帮助读者看清“记号”与随后所说明之约的关系。保留句末冒号，以衔接下一节对记号的具体说明。
