source:
  edition: WLC
  text: יַ֤פְתְּ אֱלֹהִים֙ לְ/יֶ֔פֶת וְ/יִשְׁכֹּ֖ן בְּ/אָֽהֳלֵי שֵׁ֑ם וִ/יהִ֥י כְנַ֖עַן עֶ֥בֶד לָֽ/מוֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/027.yaml
  text: May God enlarge Japheth[a], and may he dwell in the tents of Shem, and let Canaan be a slave to them.
translation:
  language: zh_hans
  text: 愿上帝使雅弗扩张；愿他住在闪的帐棚里[a]；愿迦南作他们的奴隶。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他”可能指上帝，也可能指雅弗。希伯来文没有明说“住”的主语，因此本句也可理解为“愿上帝住在闪的帐棚里”或“愿雅弗住在闪的帐棚里”。
    reason: alternative_reading
lexical_decisions:
- source_word: יַפְתְּ
  choice: 使……扩张
  rationale: 这是表示愿望的使役形式，基本意思是“使宽广、使扩展”。译作“使雅弗扩张”，既保留空间扩展的意象，也尽量呼应原文与“雅弗”（יֶפֶת）之间的谐音文字游戏；汉语无法完整再现该谐音。
- source_word: אֱלֹהִים
  choice: 上帝
  rationale: 尽管词形为复数形式，此处动词为单数，所指是独一的上帝；“上帝”是现代汉语自然、庄重的对应词。
- source_word: לְיֶפֶת
  choice: 雅弗
  rationale: 按传统通行译名音译人名；前缀 לְ 在此随使役结构处理为“使雅弗扩张”，不另行直译。
- source_word: וְיִשְׁכֹּן
  choice: 愿他住
  rationale: 动词为阳性单数愿望式，主语在希伯来文中没有明说，可能是上帝，也可能是雅弗。“他”保留单数形式及上下文中的指代歧义，不在正文中替读者作出判断。
- source_word: בְּאָהֳלֵי שֵׁם
  choice: 在闪的帐棚里
  rationale: 保留具体的“帐棚”意象，不泛化为“住处”；介词按自然汉语译作“在……里”。
- source_word: וִיהִי
  choice: 愿……作
  rationale: 延续本节祝愿与宣告的语气；“愿……作”在现代汉语中简洁而庄重。
- source_word: כְנַעַן
  choice: 迦南
  rationale: 采用该人名的通行汉语译名；此处指挪亚宣告所涉及的人及其后裔。
- source_word: עֶבֶד
  choice: 奴隶
  rationale: 此处强调受制和从属身份，“奴隶”比“仆人”更准确地传达该宣告中的强制性地位。
- source_word: לָמוֹ
  choice: 他们的
  rationale: 该代词形式在此通常按复数理解，最自然地指向前文涉及的闪和雅弗；汉语以“作他们的奴隶”表达其从属关系。
theological_decisions:
- issue: “住在闪的帐棚里”的主语是谁
  choice: 正文用“愿他住”保留指代歧义
  alternative: 可理解为“愿上帝住在闪的帐棚里”，也可理解为“愿雅弗住在闪的帐棚里”
  rationale: 希伯来文动词是阳性单数，却未明说主语；语境既容许以上帝为主语，也容许以雅弗为主语。正文不消除这一真实歧义，脚注列出两种主要理解。
translation_notes:
  register: 采用现代、庄重而易懂的祝愿式表达。以分号呈现三个并列分句，保留原文的诗性节奏；“帐棚”和“奴隶”均按原文具体词义直译。
