source:
  edition: WLC
  text: אַךְ בָּשָׂ֕ר בְּ/נַפְשׁ֥/וֹ דָמ֖/וֹ לֹ֥א תֹאכֵֽלוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/004.yaml
  text: But you shall not eat flesh with its life[a], that is[b], its blood.
translation:
  language: zh_hans
  text: '只是，肉还带着它的生命，也就是带着它的血，你们不可吃。[a]


    [a] 或译：“只是，肉带着它的生命——它的血——，你们不可吃。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“只是，肉带着它的生命——它的血——，你们不可吃。”
    reason: 保留בְּנַפְשׁוֹ דָמוֹ较直接的同位结构及原文较凝练的语序。
lexical_decisions:
- source_word: אַךְ
  choice: 只是
  rationale: 本词在这里限制上一节对食用动物的许可。“只是”既能表达转折，也能突出例外和限制，比单纯的“但是”更贴近其语用功能。
- source_word: בָּשָׂר
  choice: 肉
  rationale: בָּשָׂר本义为“肉、肉体”；本节谈论食用动物，因此译作现代汉语自然的“肉”，同时保留其具体含义。
- source_word: בְּנַפְשׁוֹ
  choice: 还带着生命
  rationale: נֶפֶשׁ在此指使生物活着的“生命”，不是后期神学意义上的非物质“灵魂”。介词בְּ表达伴随关系；加入“还”使汉语清楚表达肉与生命尚未分离的情形。
- source_word: דָמוֹ
  choice: 还带着血
  rationale: דָם直接意为“血”。在“也就是”的同位说明中保留“血”，不提前将其解释为“生命之血”。
- source_word: לֹא תֹאכֵלוּ
  choice: 你们就不可吃
  rationale: 否定未完成式在本法律语境中表示禁令。“不可吃”庄重而自然，也明确保留复数第二人称。
theological_decisions:
- issue: נֶפֶשׁ与血的关系
  choice: 将נֶפֶשׁ译为“生命”，并以“也就是”表达它与“血”的同位说明关系
  alternative: 译为“灵魂”，或将整个短语合并为“带着生命之血”
  rationale: 上下文关注动物的生命与血，并非论述非物质灵魂。将两词分别译出，可保留经文本身把生命与血紧密联系起来的表达，避免引入后来的神学范畴。
- issue: 希伯来语短语בְּנַפְשׁוֹ דָמוֹ的省略结构
  choice: 正文按条件情形自然表达：“若还带着生命，也就是还带着血”
  alternative: 按直接同位语译为“带着生命——它的血——的肉”
  rationale: 原文关系简练且可作直接同位说明。正文采用现代汉语较清楚的表达，脚注保留更贴近原文次序和省略结构的译法，不把其句法张力完全消除。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“不可吃”保持律法禁令的语气；“生命”避免“灵魂”在现代读者中可能引发的非物质实体联想。正文为清晰起见使用“若……就……”结构，脚注提供更形式对应的译法。
