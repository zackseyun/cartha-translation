id: GEN.9.9
reference: Genesis 9:9
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/אֲנִ֕י הִנְנִ֥/י מֵקִ֛ים אֶת בְּרִיתִ֖/י אִתְּ/כֶ֑ם וְ/אֶֽת זַרְעֲ/כֶ֖ם אַֽחֲרֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/009.yaml
  text: And as for me[a], behold, I am establishing my covenant with you and with your offspring after you.
translation:
  language: zh_hans
  text: 至于我，看哪，我要与你们和你们以后的后裔[a]立我的约。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“种子”。希伯来语这个词是集合名词，可指后裔或子孙。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: 至于我
  rationale: 连词加独立人称代词带有轻微强调，并标示话语转折；“至于我”自然保留这种突出作用。
- source_word: הִנְנִי
  choice: 看哪
  rationale: 该词用于郑重唤起注意；“看哪”保留庄严的盟约语气，又不把意思改成自我呈现的“我在这里”。
- source_word: מֵקִים
  choice: 我要……立
  rationale: קום的使役分词在此表达设立盟约这一郑重而带施行性的行动；现代汉语用“我要……立”比“我正在建立”更自然，也不预设这是对既有盟约的再次确认。
- source_word: בְּרִיתִי
  choice: 我的约
  rationale: “约”是圣经中神人正式关系语境下בְּרִית的标准译法，简洁且不加入经文以外的教义说明。
- source_word: אִתְּכֶם
  choice: 与你们
  rationale: 忠实表达盟约同挪亚及其同行者之间的关系，且符合现代汉语习惯。
- source_word: וְאֶת זַרְעֲכֶם
  choice: 和你们……的后裔[a]
  rationale: זֶרַע是集合名词，可指“种子”或人的后代；正文译作“后裔”自然清楚，并以脚注保留原词的具体意象和集合性。
- source_word: אַחֲרֵיכֶם
  choice: 你们以后的
  rationale: 表明随后世代；“你们以后的后裔”简明传达时间与世代关系。
theological_decisions:
- issue: 神人关系语境中的盟约术语
  choice: 我的约
  alternative: 我的协定／我的条约
  rationale: 本节讲神与挪亚一方建立正式关系；“约”保留圣经核心术语，而“协定”或“条约”容易显得过于世俗或限于政治关系。
- issue: מֵקִים是否表示首次设立还是确认既有之约
  choice: 立
  alternative: 坚立／确认
  rationale: “立”容许此处表示设立盟约的施行性行动，不额外断定是在重新确认先前已有的盟约；因此保留原文在具体关系上的开放性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“至于我，看哪”保留原文双重强调；整体调整为自然汉语语序“与……立约”。脚注标记置于其实际所说明的“后裔”之后。
