source:
  edition: WLC
  text: וְ/הָיְתָ֥ה הַ/קֶּ֖שֶׁת בֶּֽ/עָנָ֑ן וּ/רְאִיתִ֗י/הָ לִ/זְכֹּר֙ בְּרִ֣ית עוֹלָ֔ם בֵּ֣ין אֱלֹהִ֔ים וּ/בֵין֙ כָּל נֶ֣פֶשׁ חַיָּ֔ה בְּ/כָל בָּשָׂ֖ר אֲשֶׁ֥ר עַל הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/016.yaml
  text: The bow will be in the cloud[b][a], and I will see it and remember the everlasting covenant between God and every living creature among all flesh that is on the earth.
translation:
  language: zh_hans
  text: 彩虹[a]必在云中；我看见它，就会记念上帝和地上一切有血肉的活物之间的永约。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“弓”；这里指云中的彩虹。
    reason: 保留 הַקֶּשֶׁת 的字面意象及其语境所指。
lexical_decisions:
- source_word: וְהָיְתָה
  choice: 必在
  rationale: 该形式在持续的将来性神谕中承接上文；“必在”自然表达将来及确定性，同时不额外译作“出现”。
- source_word: הַקֶּשֶׁת
  choice: 彩虹
  rationale: 该词字面义为“弓”，但在此明确指云中的虹；现代汉语正文用“彩虹”最清楚，字面意象保留于脚注。
- source_word: בֶּעָנָן
  choice: 在云中
  rationale: 保留希伯来语带冠词的单数表达，中文“在云中”自然且无需改成复数。
- source_word: וּרְאִיתִיהָ לִזְכֹּר
  choice: 我看见它，就会记念
  rationale: 既保留第一人称看见与记念的顺序，也以自然汉语表达 לִ 不定式所示的目的或结果关系，避免生硬的“为了记念”。
- source_word: בְּרִית עוֹלָם
  choice: 永约
  rationale: “永约”是简洁、庄重而易懂的圣经汉语，表达约持续长久、世世代代有效。
- source_word: כָּל נֶפֶשׁ חַיָּה בְּכָל בָּשָׂר
  choice: 一切有血肉的活物
  rationale: נֶפֶשׁ חַיָּה 指活着的受造物；בְּכָל בָּשָׂר 在此进一步界定其为有血肉者。此译法避免把 נֶפֶשׁ 误解为专指人的“灵魂”，也比“所有肉体中的每个活物”自然。
- source_word: אֲשֶׁר עַל הָאָרֶץ
  choice: 地上
  rationale: 准确表达关系从句的范围；在普世洪水之约的语境中，“地上”比“陆地上”恰当。
theological_decisions:
- issue: 上帝的拟人化记念
  choice: 保留“我看见它，就会记念”
  alternative: 解释性改译为“我看见它，就会按我的约行事”
  rationale: 原文直接以“看见”和“记念”描述上帝。译文保留这种盟约性的拟人表达，不将其化解为神学解释。
- issue: “永”所表达的时限
  choice: 译作“永约”
  alternative: 译作“永久的约”或“世代长存的约”
  rationale: עוֹלָם 强调跨越世代、长久持续；“永约”保留其力度，同时不在译文中进一步界定哲学意义上的无限时间。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“上帝”与“永约”简洁明确；分号划分记号的出现与上帝的看见、记念。脚注标记紧随“彩虹”，正文与脚注对应完整。
