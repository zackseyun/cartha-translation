    issue: “所立的永约”增添了原文未在本节明说的动作。
    rationale: 原文说的是“上帝和地上一切有血肉的活物之间的永约”，并未在此重述“立约”的行为。虽然“所立”不改变整体教义或上下文含义，但删去后更为等值，也更清楚地保留 covenant 的双方关系。
