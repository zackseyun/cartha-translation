source:
  edition: WLC
  text: כָּל רֶ֨מֶשׂ֙ אֲשֶׁ֣ר הוּא חַ֔י לָ/כֶ֥ם יִהְיֶ֖ה לְ/אָכְלָ֑ה כְּ/יֶ֣רֶק עֵ֔שֶׂב נָתַ֥תִּי לָ/כֶ֖ם אֶת כֹּֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/003.yaml
  text: Every moving thing that is alive shall be food for you. As I gave you the green plants[a], I have given you everything.
translation:
  language: zh_hans
  text: 凡活着的动物[a]，都可以作你们的食物。正如我把绿色植物赐给你们一样，我也把这一切都赐给你们了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “动物”也可译为“爬行之物”。希伯来语 רֶמֶשׂ 常指爬行、蠕动或群集活动的生物；但按这里的上下文，其含义很可能较为广泛。
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל רֶמֶשׂ
  choice: 凡……的动物
  rationale: רֶמֶשׂ通常指爬行、群集或活动的生物；本节受כָּל和末句“这一切”限定，语境范围较广。中文用“动物”自然地表达可作食物的活动生物，同时避免把范围不必要地缩窄为爬行动物。
- source_word: אֲשֶׁר הוּא חַי
  choice: 活着的
  rationale: 保留关系从句的限定作用，强调所说的是活物；“活着的”是现代汉语自然、清楚的表达。
- source_word: לָכֶם יִהְיֶה לְאָכְלָה
  choice: 都可以作你们的食物
  rationale: 该结构表示给予人作食物；“可以”传达许可和供应的语用含义，而不把句子误解为所有动物实际都会成为食物。
- source_word: כְּיֶרֶק עֵשֶׂב
  choice: 正如我把绿色植物赐给你们一样
  rationale: יֶרֶק עֵשֶׂב是集合性表达，指绿色植物或草本植被；补出由后半句动词统摄的“赐给”，使中文比较结构完整自然。
- source_word: נָתַתִּי לָכֶם אֶת כֹּל
  choice: 我把这一切都赐给你们了
  rationale: 完成式表示已经作出的、现今有效的赐予；“了”体现完成及当前结果，“这一切”保留כֹּל的概括范围并承接前文。
theological_decisions:
- issue: 洪水后食物许可的范围
  choice: 按上下文表达广泛的动物食用许可，不把本节限定为爬行或群集的小动物。
  alternative: 把רֶמֶשׂ窄译为“爬物”或“爬行动物”，从而将许可限于该类生物。
  rationale: 虽然רֶמֶשׂ本身可指爬行或群集的生物，但כָּל、限定语“活着的”以及末尾“这一切”共同支持这里的概括用法。译文保持广泛范围，同时以脚注保留词义上的真实可能性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“凡……都……”保留希伯来语的周全范围；“绿色植物”避免较古旧的“青草”“菜蔬”，并与创世记前文的食物赐予相呼应。脚注标记置于整节末尾，所注释的是首句“动物”的词义。
