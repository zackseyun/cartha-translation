  text: וַ/יַּ֗רְא חָ֚ם אֲבִ֣י כְנַ֔עַן אֵ֖ת עֶרְוַ֣ת אָבִ֑י/ו וַ/יַּגֵּ֥ד לִ/שְׁנֵֽי אֶחָ֖י/ו בַּ/חֽוּץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/022.yaml
  text: And Ham[a], the father of Canaan, saw his father's nakedness and told his two brothers outside.
translation:
  language: zh_hans
  text: 迦南的父亲含看见了父亲裸露的身体[a]，就把这事告诉了在外面的他的两个兄弟。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译可作“父亲的赤裸”。这个说法在旧约某些语境中可用作与性有关的委婉语；这里正文保留身体裸露的基本意思，不对这一解释问题作进一步断定。
    reason: 说明希伯来语短语的字面形式及其可能具有的委婉含义，保留原文的解释空间。
lexical_decisions:
- source_word: וַיַּרְא
  choice: 看见了
  rationale: ראה在连续叙事形式中通常表示“看见”；不采用带有刻意凝视意味的更强译法。
- source_word: חָם
  choice: 含
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: אֲבִי כְנַעַן
  choice: 迦南的父亲
  rationale: 按原文附加说明保留含与迦南的父子关系。
- source_word: עֶרְוַת אָבִיו
  choice: 父亲裸露的身体
  rationale: 既自然表达人在赤裸状态下身体暴露的意思，又不把原文限定为某种具体的性行为；脚注说明该短语在其他语境中可能具有更广的性含义。
- source_word: וַיַּגֵּד
  choice: 就把这事告诉了
  rationale: נגד的使役形在此意为“告诉、报告”；补出中文叙事中自然的宾语“这事”，所指仍由上文限定。
- source_word: לִשְׁנֵי אֶחָיו
  choice: 两个兄弟
  rationale: 明确保留原文的数词“二”，并以自然中文表达所属关系。
- source_word: בַּחוּץ
  choice: 外面的
  rationale: 表示帐篷之外，与挪亚所在之处形成对照；译为“外面的两个兄弟”，避免无根据地强调含走出去这一动作。
theological_decisions:
- issue: 本叙事中“父亲的赤裸”所指为何
  choice: 正文译为“父亲裸露的身体”，只陈述含看见挪亚身体暴露，不进一步指明某种性行为。
  alternative: 将此短语理解为暗指更严重的性侵犯，或依据后来的律法用语理解为与母亲乱伦有关的委婉语。
  rationale: 该希伯来短语在部分旧约语境中可有更广的性含义，但本节明确使用“看见”，随后又说含将此事告诉兄弟；紧邻语境也聚焦于挪亚身体裸露。正文因此保留直观含义，脚注同时留下其他解释的可能。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“迦南的父亲含”保留原文的附加身份说明；“父亲裸露的身体”比生硬的“父亲的赤裸”更符合现代汉语，同时避免“下体”可能带来的过度具体化。脚注标记紧随相关短语，而不置于人名之后。
