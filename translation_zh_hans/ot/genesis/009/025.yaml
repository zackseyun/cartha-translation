  rationale: 修订仅改善中文句法和流畅度：删去非必要的“于是”，并把“给他的弟兄作奴隶中的奴隶”改为两个并列谓语。译文仍明确以迦南为受诅咒者，保留未来宣告及“奴隶中的奴隶”的重复强化修辞，不增添对诅咒对象、历史适用范围或神学含义的解释。
