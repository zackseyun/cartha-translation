  text: וַ/יֹּ֖אמֶר אָר֣וּר כְּנָ֑עַן עֶ֥בֶד עֲבָדִ֖ים יִֽהְיֶ֥ה לְ/אֶחָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/025.yaml
  text: And he said[a], “Canaan is cursed[c][b]; he shall be a slave of servants to his brothers.”
translation:
  language: zh_hans
  text: 他说：“迦南[a]受诅咒！他必作他弟兄[b]的奴隶，成为奴隶中的奴隶[c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文明确说受诅咒的是“迦南”，不是含。
    reason: 防止把后来的解释代入正文。
  - marker: b
    text: “弟兄”在这里也可泛指兄弟族群或亲族。
    reason: 说明该亲属词在家族与族群语境中的可能范围。
  - marker: c
    text: “奴隶中的奴隶”是加强语气的希伯来语表达，意思是处于最低下、最受辖制的奴役地位。
    reason: 解释原文重复构式的强化作用，同时保留正文的字面修辞。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 于是他说
  rationale: 这是叙事中常见的连续动词形式，用“于是”自然承接上文，又不额外限定话语关系。
- source_word: אָרוּר
  choice: 受诅咒
  rationale: 该词在无系词句中作谓语，表达迦南处于被诅咒的状态；此译法保留宣告的力度。
- source_word: כְּנָעַן
  choice: 迦南
  rationale: 按通行中文译名音译；原文明确点名迦南。
- source_word: עֶבֶד עֲבָדִים
  choice: 奴隶中的奴隶
  rationale: 保留希伯来语重复构式及其强烈语气；该构式表示极低、极重的奴役地位，而“奴隶”比“仆人”更能体现此处受辖制的严酷含义。
- source_word: יִהְיֶה
  choice: 必……作
  rationale: 未完成式在诅咒宣告中指向将来的结果；“必”符合庄重而确定的语气。
- source_word: לְאֶחָיו
  choice: 给他的弟兄作
  rationale: 贴近介词“向、给”以及“他的弟兄”的字面意义，同时符合现代汉语表达。
theological_decisions:
- issue: 挪亚诅咒的对象
  choice: 正文明确译为“迦南受诅咒”
  alternative: 将诅咒对象解释或改写为含
  rationale: 希伯来原文明确写的是“迦南”，译文不以传统解释替换经文本身。
- issue: 奴役用语的力度
  choice: 采用“奴隶中的奴隶”
  alternative: 仆人中的仆人；最低下的奴隶
  rationale: “奴隶”保留受奴役和被支配的严酷性质；重复构式又保留原文修辞，不把其含义完全改写成解释性意译。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“奴隶中的奴隶”略带希伯来语修辞色彩，但中文可以理解，并由脚注说明其强化含义。
