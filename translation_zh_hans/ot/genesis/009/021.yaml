base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/021.yaml
  text: He drank some of the wine[a], became drunk[b], and uncovered himself inside his tent.
translation:
  language: zh_hans
  text: 他喝了些酒[a]，就醉了，在帐篷里赤身露体[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“从那酒中喝”。希伯来文直译为“从那酒中喝”，这里很可能带有部分的意思。
    reason: lexical_alternative
  - marker: b
    text: 或译“露着身子”“身体露了出来”或“被露出来”。希伯来动词也可侧重裸露的状态；其词形通常可理解为他使自己裸露。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשְׁתְּ
  choice: 他喝了
  rationale: שׁתה 的 Qal 叙事形式表示接续发生的动作；现代汉语用“他喝了”自然呈现，不必逐一译出连接词。
- source_word: מִן הַיַּיִן
  choice: 一些酒
  rationale: 介词 מִן 在此最自然地表达部分含义，即喝了先前所酿之酒中的一些；脚注保留较贴近字面的“从酒中喝”。
- source_word: וַיִּשְׁכָּר
  choice: 就醉了
  rationale: שׁכר 的 Qal 表示进入醉酒状态；“就醉了”简洁体现动作的结果及叙事次序。
- source_word: וַיִּתְגַּל
  choice: 露出身体
  rationale: גלה 的 Hitpael 在此可作反身理解，指挪亚使自己身体裸露；这一表达不额外限定裸露程度，也保留较偏状态或被动理解的可能性。
- source_word: בְּתוֹךְ אָהֳלֹה
  choice: 在帐篷里
  rationale: בְּתוֹךְ 表示处于某空间内部；“在帐篷里”是清楚自然的现代汉语。
theological_decisions:
- issue: 如何表述挪亚醉酒后身体裸露的状态
  choice: 描述为“露出身体”，不添加道德评断或性意味
  alternative: 赤身躺卧／身体露了出来／被露出来
  rationale: 希伯来文本只叙述饮酒、醉酒和身体显露，并未在本节明说其道德性质或具体姿态。译文保持叙事事实，让后文说明事件的意义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“酒”依上下文指葡萄酒；“露出身体”避免生硬的“揭露自己”，也不把原文未明确说明的“全身赤裸”、姿势或道德评价写入正文。
