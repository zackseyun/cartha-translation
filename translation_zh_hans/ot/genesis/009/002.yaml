base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/002.yaml
  text: And the fear of you and the dread of you shall be upon every beast of the earth and upon every bird of the heavens[a], on everything that creeps on the ground, and on all the fish of the sea[c][b]; into your hand they are given.
translation:
  language: zh_hans
  text: 地上一切的走兽、空中一切的飞鸟、地上所有爬行的活物，以及海里所有的鱼，都必惧怕你们，对你们心怀惊恐；它们都交在你们手中。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “交在你们手中”是希伯来语惯用语，表示被交付给你们，置于你们的权力或掌管之下。
    reason: lexical_alternative
lexical_decisions:
- source_word: מוֹרַאֲכֶם וְחִתְּכֶם
  choice: 惧怕你们、惊恐不安
  rationale: 两个近义名词并列，表示动物因人而生的惧怕与恐慌。译作两个递进而自然的汉语表达，既保留强化作用，也避免误解为人的主观恐惧。
- source_word: חַיַּת הָאָרֶץ
  choice: 地上一切的走兽
  rationale: 此处指陆地动物；“走兽”在现代中文圣经语体中庄重且易懂，并避免把范围限定为凶猛野兽。
- source_word: עוֹף הַשָּׁמַיִם
  choice: 空中一切的飞鸟
  rationale: שָׁמַיִם 在此语境自然指天空；עוֹף 通常指飞鸟。译为“空中的飞鸟”符合现代汉语习惯。
- source_word: בְּכֹל אֲשֶׁר תִּרְמֹשׂ הָאֲדָמָה
  choice: 地上所有爬行的活物
  rationale: רמשׂ 描写贴近地面移动或爬行；该短语具有集合意义。“活物”补足汉语所需的名词中心，同时不具体限定物种。
- source_word: דְּגֵי הַיָּם
  choice: 海里所有的鱼
  rationale: 直接表达该构造短语，并保留全称范围。
- source_word: בְּיֶדְכֶם נִתָּנוּ
  choice: 它们都交在你们手中了
  rationale: 保留希伯来语“交在手中”的权力隐喻；完成体译为“交……中了”，表达已经授予并持续有效的状态。
theological_decisions:
- issue: 洪水以后人对动物的权柄
  choice: 保留“交在你们手中”的隐喻，表明动物被置于人的权下
  alternative: 直译意涵为“它们都受你们管辖”或弱化其中的支配意义
  rationale: 原文确实表达授予人实际权力，但没有在本节进一步界定这种权力的伦理范围；保留隐喻可避免增添后来的神学或伦理体系。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。为使长句关系清楚，将惧怕的主体依次列出，再落到谓语；末句保留原文的“手”这一具体隐喻。
