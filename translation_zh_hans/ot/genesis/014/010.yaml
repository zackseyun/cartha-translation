  text: וְ/עֵ֣מֶק הַ/שִׂדִּ֗ים בֶּֽאֱרֹ֤ת בֶּאֱרֹת֙ חֵמָ֔ר וַ/יָּנֻ֛סוּ מֶֽלֶךְ סְדֹ֥ם וַ/עֲמֹרָ֖ה וַ/יִּפְּלוּ שָׁ֑מָּ/ה וְ/הַ/נִּשְׁאָרִ֖ים הֶ֥רָ/ה נָּֽסוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/010.yaml
  text: The Valley of Siddim was full of bitumen pits[a], and the kings of Sodom and Gomorrah fled and fell there[c][b], while the rest fled to the hill country.
translation:
  language: zh_hans
  text: 西订谷到处都是沥青坑[a]。所多玛王和蛾摩拉王逃跑，跌倒在那里[b]；其余的人逃到山区去了[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“焦油坑”或“柏油坑”；希伯来语指盛有天然沥青的坑。
    reason: lexical_alternative
  - marker: b
    text: 即跌倒在西订谷中；按上下文，很可能是掉进了沥青坑，但希伯来原文没有明说。
    reason: ambiguity_preservation
  - marker: c
    text: 或译“逃到山里去了”。
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵמֶק הַשִּׂדִּים
  choice: 西订谷
  rationale: עֵמֶק意为“谷”，הַשִּׂדִּים是地名；采用现代中文圣经读者较熟悉的音译“西订”。
- source_word: בֶּאֱרֹת בֶּאֱרֹת חֵמָר
  choice: 到处都是沥青坑
  rationale: 名词“坑”重复，强调坑很多；חֵמָר指天然沥青一类物质。“到处都是沥青坑”既传达重复所表达的密集程度，也符合现代汉语。
- source_word: מֶלֶךְ סְדֹם וַעֲמֹרָה
  choice: 所多玛王和蛾摩拉王
  rationale: 尽管“王”在希伯来语中形式为单数，两个城名所构成的并列结构以及后面的复数动词表明，这里指两位王；中文分别称“所多玛王”和“蛾摩拉王”最为清楚。
- source_word: וַיָּנֻסוּ ... וַיִּפְּלוּ שָׁמָּה
  choice: 逃跑时，跌落在那里
  rationale: 保留“逃跑”和“跌落”两个动作。“在那里”忠实保留原文未明说跌入何物的含混性，不在正文中擅自补出“坑里”。
- source_word: וְהַנִּשְׁאָרִים
  choice: 其余的人
  rationale: 直指剩下的其他人，比译作“幸存者”更少加入结果性的解释。
- source_word: הֶרָה נָסוּ
  choice: 都逃到山区去了
  rationale: הֶרָה含朝向山地之意；“山区”在现代汉语中自然，也保留可理解为山岭或山地地区的范围。
theological_decisions: []
