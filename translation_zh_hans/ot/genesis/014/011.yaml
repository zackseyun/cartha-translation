  yaml_path: translation/ot/genesis/014/011.yaml
  text: Then they took all the possessions of Sodom and Gomorrah[a], and all their food, and went away.
translation:
  language: zh_hans
  text: 他们把所多玛和蛾摩拉的一切财物和一切食物〔a〕都拿走了，就离去了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: 拿走了
  rationale: לקח的叙事形式基本义为“拿、取”；在掳掠语境中，“拿走”既自然地表达带走战利品，又不加入“抢夺”等更强的解释色彩。
- source_word: כָּל
  choice: 所有的／一切
  rationale: 原文两次使用量词，分别修饰财物和食物；用“所有的”和“一切”保留其全面性，同时避免中文表达重复生硬。
- source_word: רְכֻשׁ
  choice: 财物
  rationale: 指可拥有或搬运的财产、物品；“财物”符合军事掳掠的语境，也比抽象的“财富”范围更广。
- source_word: סְדֹם וַעֲמֹרָה
  choice: 所多玛和蛾摩拉
  rationale: 采用现代中文圣经传统中通行且易识别的地名音译。
- source_word: אָכְלָם
  choice: 食物
  rationale: 该名词带第三人称阳性复数后缀，直译为“他们的食物”；中文中置于“所多玛和蛾摩拉所有的”这一共同领属结构之下，译作“一切食物”即可清楚表达。该词也可按语境指供应品，但此处保留较宽泛的基本义。
- source_word: וַיֵּלֵכוּ
  choice: 然后离去
  rationale: הלך的叙事形式在此表示拿走财物后离开；“离去”简洁自然，并明确表达行动的先后。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。句序贴近希伯来文的连续叙事结构；不增添原文未明说的主语身份，也不把“拿走”强化为带评价色彩的“洗劫”。
