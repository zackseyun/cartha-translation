  text: וַ/יֵּצֵ֣א מֶֽלֶךְ סְדֹם֮ לִ/קְרָאת/וֹ֒ אַחֲרֵ֣י שׁוּב֗/וֹ מֵֽ/הַכּוֹת֙ אֶת כְּדָרלָעֹ֔מֶר וְ/אֶת הַ/מְּלָכִ֖ים אֲשֶׁ֣ר אִתּ֑/וֹ אֶל עֵ֣מֶק שָׁוֵ֔ה ה֖וּא עֵ֥מֶק הַ/מֶּֽלֶךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/017.yaml
  text: Then the king of Sodom went out to meet him after his return from defeating Kedorlaomer and the kings who were with him[a], to the Valley of Shaveh (that is[b], the King's Valley).
translation:
  language: zh_hans
  text: 亚伯兰击败基多拉俄默和与他同在的众王后返回。所多玛王出来迎接他，来到沙微谷，也就是王谷。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: 出来
  rationale: 该叙事动词表示所多玛王从自己的所在地出去；中文以“出来”自然承接事件进展，无须机械译出句首的连接词。
- source_word: מֶלֶךְ סְדֹם
  choice: 所多玛王
  rationale: 按现代汉语自然表达处理希伯来语属格结构，并采用通行的地名音译“所多玛”。
- source_word: לִקְרָאתוֹ
  choice: 迎接他
  rationale: 该表达指主动出去与返回者会面；“迎接”比中性的“遇见”更准确地传达动作方向和目的。
- source_word: אַחֲרֵי שׁוּבוֹ
  choice: 亚伯兰……后返回
  rationale: 第三人称后缀在上下文中指亚伯兰。为避免连续多个“他”造成现代汉语指代混乱，正文明确其姓名，但未增添上下文以外的信息。
- source_word: מֵהַכּוֹת
  choice: 击败
  rationale: נכה 的使役式在此描述军事胜利；“击败”自然准确，不把词义收窄为亲手杀死或击杀。
- source_word: כְּדָרלָעֹמֶר
  choice: 基多拉俄默
  rationale: 依希伯来语形式作适合现代普通话的音译，避免受传统英语拼写影响。
- source_word: וְאֶת הַמְּלָכִים אֲשֶׁר אִתּוֹ
  choice: 和与他同在的众王
  rationale: 保留原文较宽泛的“与他同在”，不擅自限定为同盟、随军或一同出战；其中“他”依句法最自然地指基多拉俄默。
- source_word: אֶל עֵמֶק שָׁוֵה
  choice: 来到沙微谷
  rationale: אֶל 保有朝向某地的方向意义；在中文中用“来到”自然表明迎接行动抵达该谷。
- source_word: הוּא עֵמֶק הַמֶּלֶךְ
  choice: 也就是王谷
  rationale: הוּא 在此引出地点的同一认定或解释；“也就是”以自然中文保留这种说明关系。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。将希伯来语中较长的单句分为两句，以清楚区分亚伯兰返回与所多玛王出来迎接两个动作；不改变事件次序。正文明确“亚伯兰”以消除中文代词歧义，同时保留“与他同在”本身对诸王关系的宽泛表述。
