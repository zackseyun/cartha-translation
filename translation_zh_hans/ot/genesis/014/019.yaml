  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַֽ/יְבָרְכֵ֖/הוּ וַ/יֹּאמַ֑ר בָּר֤וּךְ אַבְרָם֙ לְ/אֵ֣ל עֶלְי֔וֹן קֹנֵ֖ה שָׁמַ֥יִם וָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/019.yaml
  text: And he blessed him and said[a], “Blessed be Abram by God Most High[b], possessor of heaven and earth.”
translation:
  language: zh_hans
  text: 他给亚伯兰祝福，说：“愿亚伯兰蒙至高的上帝——天地[b]的拥有者[a]——赐福！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“创造者”。希伯来语分词可表示“拥有者”“所有者”，在此语境中也可能表示“创造者”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“诸天和地”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבָרְכֵהוּ
  choice: 他给亚伯兰祝福
  rationale: 该词是叙事中的连续过去动作，带第三人称阳性单数宾语后缀。结合上下文将“他”明确为亚伯兰，使现代汉语表达自然清楚。
- source_word: וַיֹּאמַר
  choice: 说
  rationale: 保留希伯来叙事中引出直接引语的常用表达；汉语不必重复翻出连接词，语流更自然。
- source_word: בָּרוּךְ
  choice: 愿……蒙……赐福
  rationale: 这是祝福公式中的被动分词；采用祈愿式表达，兼顾庄重语气和现代汉语习惯。
- source_word: אַבְרָם
  choice: 亚伯兰
  rationale: 按本段叙事阶段保留其尚未改名为亚伯拉罕时的名字。
- source_word: לְאֵל
  choice: 蒙……上帝……赐福
  rationale: 祝福公式中的介词לְ可表达祝福与赐福者的关系；此译法自然地呈现上帝为祝福的来源，而不机械译为“向”。
- source_word: אֵל עֶלְיוֹן
  choice: 至高的上帝
  rationale: 将名词加修饰语构成的神圣称号译为现代汉语中自然、庄重的表达。
- source_word: קֹנֵה
  choice: 拥有者
  rationale: קנה的分词在此可指拥有者，也可能指创造者。正文采用较贴近“拥有、占有”词义核心的译法，并以脚注保留“创造者”这一重要可能。
- source_word: שָׁמַיִם וָאָרֶץ
  choice: 天地
  rationale: “天地”是现代汉语表达宇宙整体的自然对举，也准确传达该希伯来语总括结构。形态上更显复数的译法另见脚注。
theological_decisions:
- issue: 神圣称号中קֹנֵה的语义
  choice: 天地的拥有者
  alternative: 天地的创造者
  rationale: 该词可表达取得、拥有，也可能在这一语境中表达创造。正文不把语义范围收窄为单一的创造论断，而在脚注中保留传统且合乎语境的“创造者”理解。
- issue: 祝福公式中לְ的关系
  choice: 亚伯兰蒙至高的上帝赐福
  alternative: 亚伯兰归于至高的上帝而为有福
  rationale: 介词可被理解为标示赐福来源，也可较形式化地表达归属或关联。正文选择现代汉语中最通顺的来源表达，但不增添经文没有明说的宗派性含义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。“愿……蒙……赐福”保留祝福语的礼仪感；破折号标明“天地的拥有者”是对“至高的上帝”的同位说明。脚注标记均紧随其所说明的词语。
