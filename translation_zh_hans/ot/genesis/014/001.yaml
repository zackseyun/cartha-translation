base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/001.yaml
  text: 'And it happened in the days of Amraphel king of Shinar[a], Arioch king of Ellasar, Chedorlaomer king of Elam, and Tidal king of nations:'
translation:
  language: zh_hans
  text: 当示拿王暗拉非、以拉撒王亚略、以拦王基大老玛和列国[a]王提达在位的时候：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “列国”或可音译为“戈印”，视为地名。希伯来语“戈印”通常意为“列国”，但这里与本节其他王国名称并列，也可能是一个地域名称。
    reason: 保留גּוֹיִם究竟是普通名词还是地名的词义歧义。
lexical_decisions:
- source_word: וַיְהִי בִּימֵי
  choice: 事情发生在……的时代
  rationale: 该叙事公式交代事件发生的时代背景；这样译既保留“发生”与时间框架，也符合现代汉语表达。
- source_word: אַמְרָפֶל מֶלֶךְ שִׁנְעָר
  choice: 示拿王暗拉非
  rationale: 按现代汉语习惯将王国称号置于人名前；地名与人名采用通行的圣经译名。
- source_word: אַרְיוֹךְ מֶלֶךְ אֶלָּסָר
  choice: 以拉撒王亚略
  rationale: 保留希伯来文的王名与所辖地域，按自然汉语语序表达。
- source_word: כְּדָרְלָעֹמֶר מֶלֶךְ עֵילָם
  choice: 以拦王基大老玛
  rationale: 人名和地名采用通行译法，并清楚表达其君王身份。
- source_word: וְתִדְעָל מֶלֶךְ גּוֹיִם
  choice: 和列国王提达
  rationale: גּוֹיִם通常意为“列国、各国”；正文保留这一常见词义，同时以脚注说明它在此也可能是地名。
