base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/004.yaml
  text: For twelve years they had served Kedorlaomer[a], but in the thirteenth year they rebelled.
translation:
  language: zh_hans
  text: 他们臣服于基大老玛十二年，第十三年却反叛了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׁתֵּים עֶשְׂרֵה שָׁנָה
  choice: 十二年
  rationale: 希伯来文是时长表达；现代汉语将“十二年”置于动词之后，自然表达持续时间。
- source_word: עָבְדוּ
  choice: 服事
  rationale: עבד基本义为“服事、效力”；在这里指诸王臣服于宗主。译作“服事”既保留原词措辞，也让政治从属的语境显明。
- source_word: אֶת כְּדָרְלָעֹמֶר
  choice: 基大老玛
  rationale: 人名按希伯来语形式音译；采用现代汉语中较简洁、可读的音译。
- source_word: וּשְׁלֹשׁ עֶשְׂרֵה שָׁנָה
  choice: 到第十三年
  rationale: 字面形式为“而十三年”，语境表明这是继十二年服事之后的第十三年；“到第十三年”自然传达时间推进，同时避免误解为又持续十三年。
- source_word: מָרָדוּ
  choice: 反叛了
  rationale: מרד指反叛或背叛统治者；“反叛”符合诸王反抗宗主的政治军事语境。
