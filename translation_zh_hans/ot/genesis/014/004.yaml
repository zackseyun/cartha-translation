  source_fidelity: “服事”可以表达עָבְדוּ，但在此诸王与宗主的政治关系中，“臣服于”更明确传达附庸／受辖制的含义，且不把一般性的服事误作宗教或私人服侍。时间推进和“反叛”的基本意思均应保留。
  naturalness: “他们臣服于基大老玛十二年，第十三年却反叛了”在现代标准汉语中简洁自然；“却”恰当地呈现原文连接词在上下文中的转折。
