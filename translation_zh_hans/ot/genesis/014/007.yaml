  text: וַ֠/יָּשֻׁבוּ וַ/יָּבֹ֜אוּ אֶל עֵ֤ין מִשְׁפָּט֙ הִ֣וא קָדֵ֔שׁ וַ/יַּכּ֕וּ אֶֽת כָּל שְׂדֵ֖ה הָ/עֲמָלֵקִ֑י וְ/גַם֙ אֶת הָ֣/אֱמֹרִ֔י הַ/יֹּשֵׁ֖ב בְּ/חַֽצְצֹ֥ן תָּמָֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/007.yaml
  text: Then they turned back and came to En-mishpat (that is[a], Kadesh), and struck all the country of the Amalekites[c][b], and also the Amorites who were living in Hazazon-tamar.
translation:
  language: zh_hans
  text: 他们转回，来到隐·米施帕（就是加低斯）[a]，击打了亚玛力人的整个地区[b]，又击打了住在哈洗逊·他玛[c]的亚摩利人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “隐·米施帕”意为“审判之泉”。
    reason: cultural_note
  - marker: b
    text: 或译“亚玛力人的全部田野（或地区）”。希伯来文直译为“亚玛力人的全部田野”，很可能指亚玛力人居住的地域。
    reason: lexical_alternative
  - marker: c
    text: 《历代志下》20:2称哈洗逊·他玛为隐·基底。
    reason: cross_reference
lexical_decisions:
- source_word: וַיָּשֻׁבוּ
  choice: 后来，他们转回来
  rationale: 叙事性连续形式表示随后发生的行动；“转回来”保留 שוב 在此处改变行进方向的含义。
- source_word: וַיָּבֹאוּ אֶל
  choice: 来到
  rationale: בוא 与 אֶל 连用表示到达某处；“来到”符合现代汉语叙事表达。
- source_word: עֵין מִשְׁפָּט
  choice: 隐·米施帕
  rationale: 这是地名，采用音译；其字面含义放入脚注，以免把专名误作普通名词。
- source_word: הִוא קָדֵשׁ
  choice: （就是加低斯）
  rationale: 代词加专名用于说明前一地名就是加低斯；括注形式自然保留其解释作用。
- source_word: וַיַּכּוּ
  choice: 击打了
  rationale: נכה 可指击打、攻打或打败；“击打”较贴近原文，也不把结果明确化为彻底征服。
- source_word: כָּל שְׂדֵה הָעֲמָלֵקִי
  choice: 亚玛力人的全境
  rationale: שָׂדֶה 字面为“田野”，在此与族名连用，很可能泛指该族所居的地域；“全境”自然且保留地域意义。
- source_word: וְגַם אֶת הָאֱמֹרִי
  choice: 又击打了……亚摩利人
  rationale: וְגַם 表示附加对象；汉语重复“击打了”可清楚呈现并列关系。族称的单数形式具有集合意义，译作群体名称“亚摩利人”。
- source_word: הַיֹּשֵׁב בְּחַצְצֹן תָּמָר
  choice: 住在哈洗逊·他玛的
  rationale: 分词表示这些亚摩利人是该地居民；“住在”是自然、准确的现代汉语。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。地名依普通中文圣经传统作音译，并以间隔号标明复合名称。正文保留“击打”的宽泛语义，不擅自明确为“彻底打败”。所有脚注标记均置于正文相关词句之后。
