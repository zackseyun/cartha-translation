  to: 他们转回，来到隐·米施帕（就是加低斯）[a]，击打了亚玛力人的整个地区[b]，又击打了住在哈洗逊·他玛[c]的亚摩利人。
  rationale: 修订仅改善叙事连贯性、避免将“田野／地区”过度具体化为有疆界的“全境”，并使脚注c的锚点和交叉经文表述更准确；未改变原文的行动次序、地名同一说明、族群名称或“击打”的宽泛含义。
