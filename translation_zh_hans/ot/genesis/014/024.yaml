base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/024.yaml
  text: I will take nothing except only what the young men have eaten[a], and the share of the men who went with me—Aner, Eshcol, and Mamre[c][b]. Let them take their share.
translation:
  language: zh_hans
  text: 除了少年们所吃的[a]，和跟我同去的那些人——亚乃、以实各和幔利——的那一份，我什么也不要。让他们拿走自己的份吧。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “少年们”也可译作“仆从”或“随从”。希伯来语 נְעָרִים 可按语境指年轻人或侍从。
    reason: lexical_alternative
  - marker: b
    text: “让他们拿走自己的份吧”也可译作“他们会拿走自己的份”。原文动词形式可以表示简单将来，但这里的语境更像是准许。
    reason: alternative_reading
lexical_decisions:
- source_word: בִּלְעָדַי רַק
  choice: 除了……我什么也不要
  rationale: 希伯来语的排除表达承接上一节亚伯兰拒绝取物的誓言；中文补出“我什么也不要”，使句子完整。“除了”自然承载双重限制语气，而不形成生硬重复。
- source_word: אֲשֶׁר אָכְלוּ הַנְּעָרִים
  choice: 少年们所吃的
  rationale: נְעָרִים 可指年轻人，也可指侍从；正文采用较贴近字面的“少年们”，并以脚注保留语境中的另一可能。
- source_word: וְחֵלֶק הָאֲנָשִׁים
  choice: 那些人……应得的份
  rationale: חֵלֶק 指分配所得的份额；“应得的份”在战利品分配语境中自然，也清楚表明这部分不属于亚伯兰本人。
- source_word: אֲשֶׁר הָלְכוּ אִתִּי
  choice: 跟我同去的
  rationale: 贴近 הלך 的行动意象，并用现代汉语自然表达同行、参战之意。
- source_word: עָנֵר אֶשְׁכֹּל וּמַמְרֵא
  choice: 亚乃、以实各和幔利
  rationale: 按常见现代中文圣经人名音译处理。
- source_word: הֵם יִקְחוּ חֶלְקָם
  choice: 让他们拿自己的份吧
  rationale: 未完成式在这里最可能表达许可或允准，而非单纯预告未来；“让……吧”保留这一语用力量。
theological_decisions:
- issue: 本节开头依赖上一节的省略结构
  choice: 补出“我什么也不要”
  alternative: 保留片段式表达：“只除了……”
  rationale: 原文 בִּלְעָדַי רַק 承接上一节“不拿任何东西”的话。现代汉语补出隐含谓语，既明确亚伯兰拒取战利品的意思，也不增加新的神学判断。
- issue: 盟友取得份额的语气
  choice: 理解为许可：“让他们拿自己的份吧”
  alternative: 理解为简单将来：“他们会拿自己的份”
  rationale: 上下文是亚伯兰区分自己所拒绝的份与盟友可得的份，因此许可义更合适；脚注保留简单将来这一语法可能。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。以破折号标出三个人名是前述“那些人”的同位说明；不另设关于“只/除了”的脚注，因为中文“除了……什么也不”已充分表达原文限制关系。
