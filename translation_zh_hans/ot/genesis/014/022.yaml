  text: וַ/יֹּ֥אמֶר אַבְרָ֖ם אֶל מֶ֣לֶךְ סְדֹ֑ם הֲרִימֹ֨תִי יָדִ֤/י אֶל יְהוָה֙ אֵ֣ל עֶלְי֔וֹן קֹנֵ֖ה שָׁמַ֥יִם וָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/022.yaml
  text: But Abram said to the king of Sodom[a], “I have raised my hand to Yahweh, God Most High[c][b], possessor of heaven and earth.”
translation:
  language: zh_hans
  text: 亚伯兰却对所多玛王说：“我已向雅威——至高的上帝、天地的拥有者[b]——举起手来[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “举起手来”是希伯来语中表示起誓的动作；亚伯兰是在郑重起誓。
    reason: cultural_note
  - marker: b
    text: “拥有者”也可译作“创造者”。这里的希伯来词可以表示拥有，也可能在本语境中含有创造之意。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 却……说
  rationale: 连词推动叙事；结合上文所多玛王的提议，此处亚伯兰的回答带有转折意味，现代汉语用“却”自然表达这一语篇关系。
- source_word: הֲרִימֹתִי יָדִי
  choice: 我已经……举手
  rationale: 保留希伯来语“举起我的手”这一具体动作，并用“已经”体现完成式；该动作在此表示起誓，另以脚注说明，避免在正文中把形象直接改写掉。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来语四字神名的常见汉语音译处理，保留其作为专名的性质，不以称号代替。
- source_word: אֵל עֶלְיוֹן
  choice: 至高的上帝
  rationale: 准确表达该称号的含义，语言庄重而为现代普通读者易懂。
- source_word: קֹנֵה
  choice: 拥有者
  rationale: 该分词的核心语义可指取得、拥有，也可能在本语境中含有创造之意；正文采用“拥有者”以保留其较直接的词义，脚注列出“创造者”这一重要可能。
- source_word: שָׁמַיִם וָאָרֶץ
  choice: 天地
  rationale: “天地”是自然、凝练的现代汉语表达，也保留了希伯来语以两极概括万有的修辞。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华／主
  rationale: 原文直接使用四字神名，正文以“雅威”音译，既保留专名，也不以“主”这一称号取代它。
- issue: קֹנֵה שָׁמַיִם וָאָרֶץ 的语义
  choice: 天地的拥有者
  alternative: 天地的创造者
  rationale: 希伯来词可涉及取得或拥有，在此也可能指创造。正文不把语义直接限定为“创造”，同时以脚注保存另一种有根据的理解。
- issue: הֲרִימֹתִי יָדִי 的誓言含义
  choice: 保留“举手”的动作表达
  alternative: 我已经起誓
  rationale: 原文用举手这一立誓动作表达誓言。正文保留具体意象，脚注交代其文化和语用含义。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“雅威——至高的上帝、天地的拥有者——”以破折号标示同位称号，避免误读句法；正文保留“举手”的希伯来意象，并用脚注补足起誓含义。
