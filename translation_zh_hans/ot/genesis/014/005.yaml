base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/005.yaml
  text: In the fourteenth year[a], Kedorlaomer came, along with the kings who were with him, and they defeated the Rephaim at Ashteroth-karnaim, the Zuzim at Ham[c][b], and the Emim at Shaveh-kiriathaim.
translation:
  language: zh_hans
  text: 第十四年，基大老玛和与他同来的众王前来，在亚特律·加宁击败了利乏音人[a]，在含击败了苏西人，并在沙微·基列亭[b]击败了以米人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “利乏音人”是族群名称；有些译本译作“巨人”。
    reason: lexical_alternative
  - marker: b
    text: “沙微·基列亭”也可理解为“基列亭平原”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְאַרְבַּע עֶשְׂרֵה שָׁנָה
  choice: 第十四年
  rationale: 作为承接上文的时间短语；中文叙事无需机械译出句首连接词“和”。
- source_word: בָּא
  choice: 前来
  rationale: 保留בוא“来、到来”的宽泛意义，不将军事行动过度具体化为“进军”。
- source_word: כְדָרְלָעֹמֶר
  choice: 基大老玛
  rationale: 按希伯来语人名音译，并采用适合现代普通话的汉字形式。
- source_word: וְהַמְּלָכִים אֲשֶׁר אִתּוֹ
  choice: 和跟随他的众王
  rationale: 自然表达这些王与基大老玛同行、结盟的关系；“跟随”在此表示随同，不额外断定臣属身份。
- source_word: וַיַּכּוּ
  choice: 击败了
  rationale: נכה本义可指击打；在列举战争对象的语境中，“击败”准确而自然。
- source_word: רְפָאִים
  choice: 利乏音人
  rationale: 视为族群名称而音译，不解释为“巨人”，以避免引入正文未明说的诠释。
- source_word: בְּעַשְׁתְּרֹת קַרְנַיִם
  choice: 住在亚特律·加宁的
  rationale: 介词短语标示该族群所在地点；地名按复合专名音译，以间隔号增强辨读性。
- source_word: הַזּוּזִים
  choice: 苏西人
  rationale: 作为族群名称音译，并用“人”明确其所指。
- source_word: בְּהָם
  choice: 住在含的
  rationale: 将הם视为地名“含”，地点关系按中文列举结构表达。
- source_word: הָאֵימִים
  choice: 以米人
  rationale: 作为族群名称音译，并用“人”明确其所指。
- source_word: בְּשָׁוֵה קִרְיָתָיִם
  choice: 住在沙微·基列亭的
  rationale: 正文保留为复合地名，避免将שָׁוֵה确定解释为普通名词“平原”；脚注说明另一种可能理解。
theological_decisions: []
translation_notes:
  register: 采用庄重而易懂的现代标准普通话。三个族名统一以音译加“人”处理，地名使用常见圣经汉语音译风格；保留“沙微”究竟是专名组成部分还是“平原”之意的歧义。
