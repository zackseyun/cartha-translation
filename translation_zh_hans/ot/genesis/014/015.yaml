base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/015.yaml
  text: By night he and his servants divided themselves against them, struck them down, and pursued them as far as Hobah, which is north of Damascus.
translation:
  language: zh_hans
  text: 夜里，亚伯兰和他的仆人分头进攻他们，击败他们，又追赶他们，直到大马士革北面的何巴。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּחָלֵק עֲלֵיהֶם
  choice: 分队袭击他们
  rationale: 该短语直译为“分开来对付他们”，在战事语境中表示分兵、分队发动攻击；此译既保留“分开”的动作，也使现代汉语自然清楚。
- source_word: עֲבָדָיו
  choice: 他的仆人
  rationale: עֶבֶד 可指仆人、奴仆或臣属；这里指亚伯兰家中随行作战的人，译作“仆人”保留原词的一般称谓，不扩写为“军队”。
- source_word: וַיַּכֵּם
  choice: 把他们击败
  rationale: נכה 在军事语境中可表示击打、杀伤或击败；上下文未明说全部杀死，因此用“击败”保留适当范围。
- source_word: מִשְּׂמֹאל לְדַמָּשֶׂק
  choice: 大马士革北面
  rationale: 字面为“大马士革的左边”；按古代面向东方的方位表达，“左边”即北面，译出实际方位以便现代读者理解。
