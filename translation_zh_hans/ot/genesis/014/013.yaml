revisions:
- from: 有一个逃脱的人来，把消息告诉希伯来人亚伯兰。那时，亚伯兰住在亚摩利人幔利的橡树[a]那里；幔利是以实各和亚乃的兄弟[b]。他们都与亚伯兰结盟[c]。
  to: 有一个逃出来的人前来，向希伯来人亚伯兰报告。那时，亚伯兰正住在亚摩利人幔利的橡树[a]旁；幔利是以实各和亚乃的兄弟[b]。他们是亚伯兰的盟友[c]。
  rationale: 修订仅改善现代汉语的自然度，并使地点与盟约习语的表达更清晰。保留“兄弟”的默认译法及其较广亲属含义的脚注，也保留树种辨识的不确定性。
