base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/013.yaml
  text: Then a fugitive came and told Abram the Hebrew[a]. Now he was dwelling by the oaks of Mamre the Amorite, brother of Eshcol and brother of Aner[c][b]; these were allies of Abram.
translation:
  language: zh_hans
  text: 有一个逃出来的人前来，向希伯来人亚伯兰报告。那时，亚伯兰正住在亚摩利人幔利的橡树[a]旁；幔利是以实各和亚乃的兄弟[b]。他们是亚伯兰的盟友[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“笃耨香树”。原文所用的词指大树，常被辨认为橡树或笃耨香树。
    reason: lexical_alternative
  - marker: b
    text: “兄弟”也可指较广义的男性亲属。
    reason: lexical_alternative
  - marker: c
    text: 原文字面意思是“盟约的拥有者”，指与亚伯兰立约、受条约约束的人。
    reason: cultural_note
lexical_decisions:
- source_word: הַפָּלִיט
  choice: 一个逃脱的人
  rationale: 该词指从战乱或危险中逃出来的人；此译比“逃犯”更能避免犯罪含义，也比单说“幸存者”更突出逃脱这一动作。
- source_word: וַיַּגֵּד
  choice: 把消息告诉
  rationale: 该动词表示告诉、报告；结合上下文补出“消息”，使现代汉语自然，又不增添具体内容。
- source_word: הָעִבְרִי
  choice: 希伯来人
  rationale: 保留原文对亚伯兰的族群或社会身份称谓，不将其解释为其他专名。
- source_word: שֹׁכֵן
  choice: 住在
  rationale: 分词表达当时持续居住的状态；“那时……住在”以自然汉语呈现这一持续性。
- source_word: בְּאֵלֹנֵי מַמְרֵא
  choice: 在幔利的橡树那里
  rationale: אֵלֹנֵי 指显著的大树，常辨认为橡树或笃耨香树；正文采用较通俗的“橡树”，脚注保留植物辨识上的不确定性。
- source_word: הָאֱמֹרִי
  choice: 亚摩利人
  rationale: 按原文作修饰幔利的族群称谓。
- source_word: אֲחִי אֶשְׁכֹּל וַאֲחִי עָנֵר
  choice: 以实各和亚乃的兄弟
  rationale: אָח 的通常意义是兄弟，汉语合并重复成分以求自然；其也可能泛指男性亲属，故在脚注说明。
- source_word: בַּעֲלֵי בְרִית אַבְרָם
  choice: 与亚伯兰结盟
  rationale: 原文字面为“亚伯兰之约的拥有者”，是指与他受盟约或条约约束的人；“结盟”清楚表达其政治盟友关系，脚注保留字面文化背景。
