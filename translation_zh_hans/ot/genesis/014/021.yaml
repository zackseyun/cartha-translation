base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/021.yaml
  text: Then the king of Sodom said to Abram[a], “Give me the people[b], and take the possessions for yourself.”
translation:
  language: zh_hans
  text: 所多玛王对亚伯兰说：“把人交给我[a]，财物你自己拿去。”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “人”原文为单数“生命、本人”，这里用作集合名词，指被夺走后又救回的人。
    reason: lexical_alternative
  - marker: b
    text: “财物”也可译为“物品”或“产业”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 未单独译出叙事性的连续词缀；现代汉语在上下文中可自然体现事件推进，避免机械添加“然后”。
- source_word: מֶלֶךְ סְדֹם
  choice: 所多玛王
  rationale: 按现代汉语地名与头衔的自然结构翻译该属格结构。
- source_word: אֶל אַבְרָם
  choice: 对亚伯兰
  rationale: 介词 אֶל 在言说结构中自然译为“对”；“亚伯兰”采用通行中文圣经人名。
- source_word: תֶּן לִי
  choice: 把……交给我
  rationale: 命令式与第一人称受益者在此译为自然的处置式表达；上下文涉及夺回的人，中文“交给我”比直译“给我”更清楚。
- source_word: הַנֶּפֶשׁ
  choice: 人
  rationale: נֶפֶשׁ 为单数集合用法，在夺回人口与财物的语境中指人或人员；译作“人”自然，并保留脚注说明其字面形式。
- source_word: וְהָרְכֻשׁ
  choice: 财物
  rationale: רְכוּשׁ 指产业、物品或可占有的财货；“财物”与这里的“人”形成清楚而自然的对照。
- source_word: קַח לָךְ
  choice: 你自己拿去
  rationale: 命令式加 לָךְ 表达归本人所有或受益；“你自己拿去”准确传达这一语气。
