  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וּ/בָרוּךְ֙ אֵ֣ל עֶלְי֔וֹן אֲשֶׁר מִגֵּ֥ן צָרֶ֖י/ךָ בְּ/יָדֶ֑/ךָ וַ/יִּתֶּן ל֥/וֹ מַעֲשֵׂ֖ר מִ/כֹּֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/020.yaml
  text: And blessed be God Most High[a], who delivered your enemies into your hand[b]. And he gave him a tenth of everything.
translation:
  language: zh_hans
  text: 愿至高的上帝受称颂！他把你的仇敌交在你手中。亚伯兰把一切的十分之一给了麦基洗德。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“他把一切的十分之一给了他”，没有再次说明“给”的主语。根据上下文，这里最自然地指亚伯兰给麦基洗德。
    reason: alternative_reading
lexical_decisions:
- source_word: וּבָרוּךְ
  choice: 是当受称颂的
  rationale: 保留祝颂公式的语气；用现代汉语自然表达希伯来语被动分词的述谓用法。
- source_word: אֵל עֶלְיוֹן
  choice: 至高的上帝
  rationale: 将神圣称号译出而不音译；“至高”准确表达 עֶלְיוֹן 的尊称含义。
- source_word: מִגֵּן
  choice: 交在
  rationale: 此处动词表示交付、交出，而非“保护”；与“手中”合用，保留军事语境中的希伯来语意象。
- source_word: צָרֶיךָ
  choice: 你的仇敌
  rationale: 清楚表达带第二人称阳性单数后缀的复数名词，指敌对者。
- source_word: בְּיָדֶךָ
  choice: 在你手中
  rationale: 保留希伯来语“交在某人手中”的具体意象，现代读者也容易理解为置于其权势之下。
- source_word: וַיִּתֶּן
  choice: 把……给了
  rationale: 按叙事连续形式译出简单的后续动作；根据上下文在正文中明确亚伯兰为主语，同时用脚注说明原文并未复述主语。
- source_word: מַעֲשֵׂר
  choice: 十分之一
  rationale: 直译其数量含义，通俗透明，也避免“十一奉献”等后期制度性联想。
- source_word: מִכֹּל
  choice: 所得的一切拿出
  rationale: “一切”保留范围的完整性；结合上下文补出“所得”，使中文自然，但不把具体物品限定为战利品。
theological_decisions:
- issue: וַיִּתֶּן 的隐含主语及 לו 的指代
  choice: 正文明确为“亚伯兰……给了他”，其中“他”指麦基洗德
  alternative: 麦基洗德把一切的十分之一给了亚伯兰
  rationale: 希伯来文没有重述“给”的主语，因而在句法表面上存在歧义；但上下文最自然地以亚伯兰为施予者、麦基洗德为接受者。为免中文连续两个代词造成不必要的晦涩，正文补明亚伯兰，并在脚注保存原文的形式歧义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“是当受称颂的”保留祝颂语气；“十分之一”比宗教术语“十一”更透明。正文补出“亚伯兰”以避免汉语代词混乱，同时以脚注如实保留希伯来文未明说主语的特点。
