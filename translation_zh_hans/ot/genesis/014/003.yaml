  text: All these joined together in the Valley of Siddim (that is[a], the Salt Sea).
translation:
  language: zh_hans
  text: 这些人都聚集在西订谷；这地方就是盐海[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 后来的名称为“死海”。
    reason: 说明该地点较晚、较为人熟知的名称，同时保留正文的希伯来文名称。
lexical_decisions:
- source_word: כָּל אֵלֶּה
  choice: 这些王全都
  rationale: 希伯来文直译为“所有这些”；结合上文所列诸王，中文补出“王”可使指代清楚自然，而“全都”保留集合性的强调。
- source_word: חָבְרוּ
  choice: 聚集
  rationale: חבר在此表示联合、会合；“聚集”自然表达他们来到一处的动作，又不把关系过度解释为正式结盟。
- source_word: אֶל
  choice: 在
  rationale: 介词אֶל通常可表示“向、到”，但与会合动词及地点连用时，中文以“在”表达会合发生之处最为自然。
- source_word: עֵמֶק הַשִּׂדִּים
  choice: 西订谷
  rationale: עֵמֶק意为“谷”，שִׂדִּים为地名，采用音译“西订”，合译为“西订谷”。
- source_word: הוּא
  choice: 就是
  rationale: 此处代词用于说明性同位关系，将西订谷认同为盐海；“就是”简明保留这一指认作用。
- source_word: יָם הַמֶּלַח
  choice: 盐海
  rationale: 按希伯来文的字面名称翻译为“盐海”，不以较晚、较熟悉的名称“死海”替代正文。
