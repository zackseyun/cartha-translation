source:
  edition: WLC
  text: עָשׂ֣וּ מִלְחָמָ֗ה אֶת בֶּ֨רַע֙ מֶ֣לֶךְ סְדֹ֔ם וְ/אֶת בִּרְשַׁ֖ע מֶ֣לֶךְ עֲמֹרָ֑ה שִׁנְאָ֣ב מֶ֣לֶךְ אַדְמָ֗ה וְ/שֶׁמְאֵ֨בֶר֙ מֶ֣לֶךְ צביים וּ/מֶ֥לֶךְ בֶּ֖לַע הִיא צֹֽעַר־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/002.yaml
  text: they made war against Bera king of Sodom[a], Birsha king of Gomorrah, Shinab king of Admah, Shemeber king of Zeboiim, and the king of Bela (that is[c][b], Zoar).
translation:
  language: zh_hans
  text: 他们与所多玛王比拉、蛾摩拉王比沙、押玛王示纳、洗扁王善以别，以及比拉的王交战[a]；比拉就是琐珥。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“向……发动战争。”
    reason: lexical_alternative
lexical_decisions:
- source_word: עָשׂוּ מִלְחָמָה אֶת
  choice: 与……交战
  rationale: 希伯来语直译为“作战/发动战争”，其中 אֶת 在这一搭配中引出交战的对象。“与……交战”既准确表达敌对关系，也符合现代汉语习惯。
- source_word: בֶּרַע
  choice: 比拉
  rationale: 按现代中文圣经中较为通行的人名音译处理；虽与本节地名 בֶּלַע 的传统译名同形，原文却是两个不同的希伯来语名称。
- source_word: סְדֹם
  choice: 所多玛
  rationale: 采用现代中文中通行且易识别的圣经地名。
- source_word: בִּרְשַׁע
  choice: 比沙
  rationale: 采用通行的人名音译。
- source_word: עֲמֹרָה
  choice: 蛾摩拉
  rationale: 采用现代中文中通行的圣经地名。
- source_word: שִׁנְאָב
  choice: 示纳
  rationale: 采用通行的人名音译。
- source_word: אַדְמָה
  choice: 押玛
  rationale: 采用通行的圣经地名音译。
- source_word: שֶׁמְאֵבֶר
  choice: 善以别
  rationale: 采用通行的人名音译。
- source_word: צביים
  choice: 洗扁
  rationale: 采用中文圣经传统中较为通行的地名形式；该词对应英语常见形式 Zeboiim/Zeboim。
- source_word: מֶלֶךְ בֶּלַע
  choice: 比拉王
  rationale: 原文未说出这位王的名字，只以其所统治的城比拉来称呼他；中文以“比拉王”简洁保留这一结构。
- source_word: הִיא צֹעַר
  choice: 比拉就是琐珥
  rationale: 阴性代词 הִיא 回指城名 בֶּלַע，作用是说明该城后来或另称琐珥；“就是”自然保留其辨识说明功能。
theological_decisions:
- issue: 交战对象的范围
  choice: 将五位王并列为同一动词“交战”所支配的对象
  alternative: 只在前两位王前明确表达敌对关系，后面三位保留较松散的并列形式
  rationale: 原文虽只在前两项使用 אֶת／וְאֶת，后续三项在希伯来语中自然延续同一并列结构。中文统一列举可避免误解为只与前两王交战，并未增加原文没有的神学判断。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。王名与城名依中文圣经中广为识别的形式处理；用“与……交战”统摄完整名单，使希伯来语的并列关系在中文中清晰自然。
