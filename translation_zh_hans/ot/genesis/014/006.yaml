translation:
  language: zh_hans
  text: 又击败了在西珥山地的何利人，直到旷野边的以勒·巴兰[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“巴兰的橡树（或笃耨香树）”；若将其视为固定地名，也可写作“以勒巴兰”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת
  choice: 又击败了
  rationale: 此处以连词和宾语标记延续上文“击败”的一系列宾语；现代汉语需从上下文补出谓语，译作“又击败了”自然清楚。
- source_word: הַחֹרִי
  choice: 何利人
  rationale: 这是指称族群的集合性名称，采用通行的中文音译“何利人”。
- source_word: בְּהַרְרָם שֵׂעִיר
  choice: 住在西珥山区的
  rationale: 原文直译近于“在他们的山地西珥”；结合族群与地域关系，以“住在西珥山区的”表达其居地，符合现代汉语习惯。
- source_word: עַד
  choice: 一直追到
  rationale: 该词标明行动所达到的地理界限；谓语“击败”由上文补出后，“一直追到”自然传达战事延伸至该处，但“追”属于语境性明确化。
- source_word: אֵיל פָּארָן
  choice: 以勒·巴兰
  rationale: 将其作为固定地名音译，避免在正文中把 אֵיל 确定解释为“橡树”或“笃耨香树”；词源上的可能性保留在脚注。
- source_word: אֲשֶׁר עַל הַמִּדְבָּר
  choice: 旷野边的
  rationale: 关系从句说明以勒·巴兰的位置；עַל 在这里表达邻接关系，译作“旷野边”简洁自然。
