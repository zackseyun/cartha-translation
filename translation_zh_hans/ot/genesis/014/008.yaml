  text: וַ/יֵּצֵ֨א מֶֽלֶךְ סְדֹ֜ם וּ/מֶ֣לֶךְ עֲמֹרָ֗ה וּ/מֶ֤לֶךְ אַדְמָה֙ וּ/מֶ֣לֶךְ צביים וּ/מֶ֥לֶךְ בֶּ֖לַע הִוא צֹ֑עַר וַ/יַּֽעַרְכ֤וּ אִתָּ/ם֙ מִלְחָמָ֔ה בְּ/עֵ֖מֶק הַ/שִּׂדִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/008.yaml
  text: Then the king of Sodom[a], the king of Gomorrah, the king of Admah, the king of Zeboiim, and the king of Bela (that is, Zoar) went out, and they drew up for battle with them in the Valley of Siddim.
translation:
  language: zh_hans
  text: 于是，所多玛王、蛾摩拉王、押玛王、洗扁王和比拉王（比拉就是琐珥）都出来，在西订谷列阵，与他们交战[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“列阵攻击他们。”希伯来语此处作“与他们……交战”；在战事语境中，也可按意思译为“攻击他们”。
    reason: 说明אִתָּם字面对应“与他们”，同时保留其在敌对语境中可译作“攻击他们”的解释性可能。
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: 于是……出兵
  rationale: 连续式叙事动词推进情节；原文虽用单数，后接由五位王构成的复合主语，汉语按整体行动表达。“出兵”既自然，也符合本节军事语境。
- source_word: מֶלֶךְ
  choice: 王
  rationale: 这是各城统治者的常规称号；译文依照原文在各地名前重复表达。
- source_word: סְדֹם / עֲמֹרָה / אַדְמָה / צביים
  choice: 所多玛／蛾摩拉／押玛／洗扁
  rationale: 采用现代中文圣经读者熟悉的传统地名音译。
- source_word: בֶּלַע הִוא צֹעַר
  choice: 比拉（比拉就是琐珥）
  rationale: 保留原文以琐珥说明比拉的同位语关系；括号自然呈现补充说明。
- source_word: וַיַּעַרְכוּ
  choice: 列阵
  rationale: ערך在军事语境中指排布兵力、摆开阵势；“列阵”简洁、庄重，并准确保留军事含义。
- source_word: אִתָּם מִלְחָמָה
  choice: 与他们交战
  rationale: אִתָּם字面为“与他们”；结合“战争、战斗”表达敌对交锋。正文保留介词的形式，同时用“交战”使现代汉语清楚自然。
- source_word: בְּעֵמֶק הַשִּׂדִּים
  choice: 在西订谷
  rationale: עֵמֶק译为“谷”，Siddim采用惯用音译“西订”。
theological_decisions: []
