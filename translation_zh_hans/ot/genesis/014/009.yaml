base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/009.yaml
  text: Chedorlaomer king of Elam[a], Tidal king of Goiim, Amraphel king of Shinar, and Arioch king of Ellasar—four kings against the five.
translation:
  language: zh_hans
  text: 以拦王基大老玛、戈印[a]王提达、示拿王暗拉非和以拉撒王亚略——四王对抗五王。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “戈印”或译“列国”。希伯来语 גּוֹיִם 可作普通名词“列国”，但在这里也可能是地名。
    reason: 保留 גּוֹיִם 作为普通名词或专有地名的真实歧义。
lexical_decisions:
- source_word: אֵת ... אֶת
  choice: 对阵
  rationale: 本节以“这四王”与“那五王”的战事双方为框架；אֵת在此结构中表达交战双方的对立关系。现代汉语用“对阵”既简洁，也符合战事语境。
- source_word: כְּדָרְלָעֹמֶר
  choice: 基大老玛
  rationale: 按现代中文圣经人名的通行音译处理，不赋予推测性的词义。
- source_word: מֶלֶךְ עֵילָם
  choice: 以拦王
  rationale: 直接表达希伯来语的属格结构，并采用中文自然的“地名＋王”语序。
- source_word: תִדְעָל
  choice: 提达
  rationale: 按专名音译，不作词义解释。
- source_word: גּוֹיִם
  choice: 戈印
  rationale: 在王号中把该词按地名音译，保留其可能的专名性质；其也可按普通名词理解为“列国”，故以脚注保留歧义。
- source_word: אַמְרָפֶל
  choice: 暗拉非
  rationale: 按专名音译，不作未经文本支持的历史身份认定。
- source_word: שִׁנְעָר
  choice: 示拿
  rationale: 保留希伯来地名的音译，不以“巴比伦尼亚”等历史解释替代原文名称。
- source_word: אַרְיוֹךְ
  choice: 亚略
  rationale: 按专名音译。
- source_word: אֶלָּסָר
  choice: 以拉撒
  rationale: 按地名音译，不把它推定为其他已知地区。
- source_word: אַרְבָּעָה מְלָכִים אֶת הַחֲמִשָּׁה
  choice: 四王对阵五王
  rationale: 保留原文简练的数字对举；“王”在中文两边明示，使句意自然清楚，而“对阵”呈现战斗中的对立关系。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言；四个王号使用一致的“地名＋王＋人名”结构，并以破折号突出原文总结性的“四王对阵五王”。脚注标记置于存在词义歧义的“提达”王号之后。
