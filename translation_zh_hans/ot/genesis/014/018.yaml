id: GEN.14.18
reference: Genesis 14:18
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וּ/מַלְכִּי צֶ֨דֶק֙ מֶ֣לֶךְ שָׁלֵ֔ם הוֹצִ֖יא לֶ֣חֶם וָ/יָ֑יִן וְ/ה֥וּא כֹהֵ֖ן לְ/אֵ֥ל עֶלְיֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/018.yaml
  text: And Melchizedek king of Salem brought out bread and wine[b][a]. He was a priest of God Most High.
translation:
  language: zh_hans
  text: 撒冷王麦基洗德拿出饼和酒来。他是至高上帝的祭司。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַלְכִּי צֶדֶק
  choice: 麦基洗德
  rationale: 按中文圣经传统音译此人名，不在正文中译出其可能含义，因为这里用作专名。
- source_word: מֶלֶךְ שָׁלֵם
  choice: 撒冷王
  rationale: 将王的称号与地名按自然现代汉语组合；שָׁלֵם作为地名音译为“撒冷”。
- source_word: הוֹצִיא
  choice: 拿出……来
  rationale: 该词为יצא的使役式，表示使某物出来，即“拿出、带出”；“拿出……来”具体自然，不加入款待、献上等原文未明说的目的。
- source_word: לֶחֶם וָיָיִן
  choice: 饼和酒
  rationale: 分别直译为“饼”和“酒”，保留朴素的叙事措辞，不强化后来的圣礼联想。
- source_word: כֹהֵן
  choice: 祭司
  rationale: 准确表达宗教职分，同时不把后来以色列祭司制度的细节读入本节。
- source_word: אֵל עֶלְיוֹן
  choice: 至高上帝
  rationale: 将神圣称号译出而不作不透明的音译；“至高上帝”在现代中文中简洁、庄重，并表达“至高的神”。
- source_word: וְהוּא
  choice: 他是
  rationale: 另起一句，以自然汉语表达突出麦基洗德身份的新分句；系词“是”由中文语法补出。
theological_decisions:
- issue: 是否用措辞凸显饼和酒的后世圣礼含义
  choice: 仅陈述“拿出饼和酒来”
  alternative: 采用暗示圣餐预表的措辞，如“献上饼和酒”
  rationale: 本节只叙述麦基洗德拿出饼和酒，并未说明这是祭献或圣礼；译文不把后来的神学解释加入正文。
- issue: אֵל עֶלְיוֹן应音译为专名还是译作称号
  choice: 译作“至高上帝”
  alternative: 音译作“伊勒·以利昂”，或译作“至高者上帝”
  rationale: 该短语在此可理解为神的称号或称谓。译出其含义更便于普通读者理解，同时不进一步判定其与周边宗教名称的关系。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。保留原文简洁的叙事结构，不增添麦基洗德行为的目的或饼酒的象征意义。
