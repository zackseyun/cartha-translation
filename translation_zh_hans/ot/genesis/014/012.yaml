revisions:
- from: 他们掳走了亚伯兰兄弟的儿子罗得和他的财物，就离去了；那时罗得正住在所多玛。
  to: 他们掳走了罗得——亚伯兰兄弟的儿子——，带走了他的财物，然后离去。罗得当时住在所多玛。
  rationale: 仅作汉语搭配与句法清晰度的安全修订。“掳走”用于罗得，“带走”用于财物；破折号清楚标示“亚伯兰兄弟的儿子”是对罗得的同位说明。“当时住在”保留原文末句的背景性持续居住状态。
  reviewer_model: gpt-5.6-terra
