review_pass:
  verdict: revise
  source_fidelity: 译文准确传达了罗得及其财物被带走、罗得与亚伯兰的亲属关系，以及他住在所多玛这一背景说明。惟“掳走……财物”在现代汉语中搭配不够自然；“掳走”通常以人为宾语，财物宜说“带走”或“掠走”。
  naturalness: 原句的亲属短语可理解，但“亚伯兰兄弟的儿子罗得”略显密集；以破折号标出同位说明更清楚。将罗得与财物分别用“掳走／带走”表述，行文自然且保持叙事庄重。
  terminology: 人名“亚伯兰”“罗得”、地名“所多玛”均恰当。“财物”可对应 רְכֻשׁוֹ；保留“亚伯兰兄弟的儿子”忠实反映原文亲属措辞，不强行概括为“侄儿”。
  issues:
  - severity: low
    issue: “掳走了……和他的财物”搭配不自然
    rationale: “掳走”主要指强行带走人；同一动词直接统摄“财物”虽可由语境推知，但现代汉语较别扭。分别说“掳走罗得，带走他的财物”更自然，且不改变原文所述的共同被带走这一事实。
  revised_text: 他们掳走了罗得——亚伯兰兄弟的儿子——，带走了他的财物，然后离去。罗得当时住在所多玛。
