  yaml_path: translation/ot/genesis/014/012.yaml
  text: They took Lot[a], Abram’s nephew, and his possessions, and went away[b]. Now he was dwelling in Sodom.
translation:
  language: zh_hans
  text: 他们掳走了罗得——亚伯兰兄弟的儿子——，带走了他的财物，然后离去。罗得当时住在所多玛。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: 他们掳走了
  rationale: לקח本义为“拿、带走”；在战争中连人带财物一并带走的语境下，“掳走”自然地表达被强行带走，但不使用更强烈的“抢夺”。
- source_word: רְכֻשׁוֹ
  choice: 他的财物
  rationale: רְכוּשׁ指所拥有的财产，常包括可搬运的物品；“财物”符合本段战利品语境，也适合庄重的现代汉语。
- source_word: בֶּן אֲחִי אַבְרָם
  choice: 亚伯兰兄弟的儿子
  rationale: 保留希伯来文明确的亲属表达“亚伯兰兄弟的儿子”，避免将其完全改写为概括性的“侄儿”。
- source_word: וַיֵּלֵכוּ
  choice: 就离去了
  rationale: הלך在叙事中意为“去、离去”；此处指掳走人和财物后离开，“离去了”比单说“去了”更明确。
- source_word: וְהוּא יֹשֵׁב בִּסְדֹם
  choice: 那时罗得正住在所多玛
  rationale: 分词יֹשֵׁב表示持续居住状态；重复“罗得”可消除中文代词可能指向“亚伯兰兄弟”的歧义，“那时”体现该从句的背景说明作用。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。将亲属短语紧接在“罗得”之前，使修饰关系清楚；用分号区分主要行动与关于罗得居所的背景说明。
