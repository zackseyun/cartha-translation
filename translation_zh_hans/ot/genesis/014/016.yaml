  yaml_path: translation/ot/genesis/014/016.yaml
  text: He brought back all the possessions[a]; he also brought back Lot his kinsman, and his possessions[d][c][b], and also the women and the people.
translation:
  language: zh_hans
  text: 他把全部财物都带了回来；也把他的亲属罗得[a]和罗得的财物，以及妇女和众人，都带了回来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译“罗得，他的兄弟”。这里的“兄弟”可泛指近亲；按本书叙事，罗得是亚伯兰的侄儿。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׁב / הֵשִׁיב
  choice: 带了回来
  rationale: 两个动词都源自שׁוב的使役形，表示使人或物返回。两处重复译作“带了回来”，既符合夺回被掳人口和财物的语境，也保留原文前后呼应的结构。
- source_word: כָּל הָרְכֻשׁ / וּרְכֻשׁוֹ
  choice: 全部财物 / 罗得的财物
  rationale: רְכוּשׁ指财产、物品或财物；“财物”简洁自然，也适合这里被掳走后夺回的动产。第二处明确译出罗得，避免汉语代词指向含混。
- source_word: וְגַם
  choice: 也……以及
  rationale: 原文两次使用וְגַם，具有递进增列作用。汉语以“也”和“以及”自然呈现其添加关系，避免机械重复而仍保留层次。
- source_word: לוֹט אָחִיו
  choice: 他的亲族罗得
  rationale: אָחִיו字面为“他的兄弟”，但希伯来语可泛指近亲；本段叙事已说明罗得是亚伯兰的侄儿。“亲族”既合乎上下文，也不把关系误读成同胞兄弟，字面形式在脚注中保留。
- source_word: הַנָּשִׁים
  choice: 妇女
  rationale: 该词本义为“女人、妇女”，语境并不要求限定为“妻子”，因此保留较宽泛的含义。
- source_word: הָעָם
  choice: 众人
  rationale: עָם在此指一同被掳而获救的人群。“众人”在现代汉语中自然，并且不把群体缩限为男性。
