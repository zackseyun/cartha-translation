  text: וַ/יִּשְׁמַ֣ע אַבְרָ֔ם כִּ֥י נִשְׁבָּ֖ה אָחִ֑י/ו וַ/יָּ֨רֶק אֶת חֲנִיכָ֜י/ו יְלִידֵ֣י בֵית֗/וֹ שְׁמֹנָ֤ה עָשָׂר֙ וּ/שְׁלֹ֣שׁ מֵא֔וֹת וַ/יִּרְדֹּ֖ף עַד דָּֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/014.yaml
  text: When Abram heard that his kinsman had been taken captive[a], he led out his trained men, born in his household, three hundred and eighteen[b], and pursued them as far as Dan.
translation:
  language: zh_hans
  text: 亚伯兰听说他的弟兄被掳了[a]，就调集[b]他家中出生、受过训练的人，共三百一十八名，一直追赶到但。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弟兄”在希伯来语中也可指男性近亲；这里指亚伯兰的侄儿罗得。
    reason: lexical_alternative
  - marker: b
    text: 译作“调集”的这个希伯来语动词含义不确定，也可理解为“带领出战”“使……出动”，或可能是“武装”。
    reason: lexical_alternative
lexical_decisions:
- source_word: נִשְׁבָּה
  choice: 被掳了
  rationale: 该词是 שׁבה 的尼法勒式，在战争语境中指被敌方掳去；“被掳”简洁保留了俘虏之意。
- source_word: אָחִיו
  choice: 他的弟兄
  rationale: 原文直称“他的弟兄”；希伯来语 אָח 也可泛指近亲男性。正文保留原文亲属称谓，不直接改释为“亲属”。
- source_word: וַיָּרֶק
  choice: 调集
  rationale: 此动词含义有争议，语境表明亚伯兰使其人员准备并投入追击。“调集”符合军事行动，又不过度限定为“武装”或单纯“带出去”。
- source_word: חֲנִיכָיו
  choice: 受过训练的人
  rationale: 指在亚伯兰权下受过训练或培养的人；“受过训练的人”自然明确，又不额外断定其具体身份。
- source_word: יְלִידֵי בֵיתוֹ
  choice: 他家中出生
  rationale: 保留这些人出生于亚伯兰家中的社会身份含义，避免使用生僻或容易误解的称谓。
- source_word: שְׁמֹנָה עָשָׂר וּשְׁלֹשׁ מֵאוֹת
  choice: 三百一十八名
  rationale: 按原文完整数词译出，并加量词“名”以符合现代汉语表达。
- source_word: וַיִּרְדֹּף
  choice: 一直追赶
  rationale: רדף 在此表示军事追击；原文未明说宾语，汉语也可自然省略。“一直”与后面的范围终点相配。
- source_word: עַד דָּן
  choice: 到但
  rationale: עַד 表示行动所达到的界限；“到但”在“一直追赶到但”的句式中自然准确。
theological_decisions:
- issue: 对罗得的亲属称谓
  choice: 正文译作“他的弟兄”
  alternative: 他的亲属／他的侄儿
  rationale: אָחִיו 的字面形式是“他的弟兄”，但可泛指近亲男性。保留“弟兄”可呈现原文措辞及其张力，并以脚注说明此处实际所指可包括侄儿等男性近亲。
- issue: וַיָּרֶק 的具体动作
  choice: 译作“调集”
  alternative: 带领出战／使……出动／武装
  rationale: 该动词的确切语义存在争议。上下文明确涉及组织人员追击，但不足以唯一确定是“武装”还是“带出去”，因此采用较宽而符合军事语境的“调集”。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“被掳”“调集”“追赶”保持叙事的军事语境；句法简明，避免古奥表达。正文中的[a]、[b]分别紧随其所说明的词语。
