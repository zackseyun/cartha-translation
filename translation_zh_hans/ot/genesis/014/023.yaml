source:
  edition: WLC
  text: אִם מִ/חוּט֙ וְ/עַ֣ד שְׂרֽוֹךְ נַ֔עַל וְ/אִם אֶקַּ֖ח מִ/כָּל אֲשֶׁר לָ֑/ךְ וְ/לֹ֣א תֹאמַ֔ר אֲנִ֖י הֶעֱשַׁ֥רְתִּי אֶת אַבְרָֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/023.yaml
  text: that I would not take from a thread to a sandal strap[a], or anything that is yours, lest you say, ‘I have made Abram rich.’
translation:
  language: zh_hans
  text: 我绝不拿从一根线到一根鞋带[a]，或任何属于你的东西，免得你说：‘是我使亚伯兰富足的。’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文采用省略式的誓言句型，直译为：“如果从一根线直到一根鞋带，如果我拿任何属于你的东西……”其意思是起誓坚决不拿。
    reason: 说明原文的省略式誓言结构以及正文将其明译为否定的依据。
lexical_decisions:
- source_word: אִם ... וְאִם
  choice: 都不会……或……
  rationale: 承接第22节举手起誓的语境，这是省略了咒诅后果的誓言句式；译文明确表达坚决拒绝，而不误作普通条件句。
- source_word: מִחוּט וְעַד שְׂרוֹךְ נַעַל
  choice: 连一根线、一根鞋带
  rationale: חוּט是“线”，שְׂרוֹךְ נַעַל是系鞋用的带子。中文用“连……、……”自然表达连最微小之物也不取；脚注保留原文“从……到……”的形式。
- source_word: אֶקַּח מִכָּל אֲשֶׁר לָךְ
  choice: 或任何属于你的东西，都不会拿
  rationale: 保留כָּל的全面含义和לָךְ的归属关系，并以自然中文纳入誓言式否定。
- source_word: וְלֹא תֹאמַר
  choice: 免得你说
  rationale: 该分句表达亚伯兰拒绝财物的目的，即不让所多玛王日后如此夸口；“免得”简洁而庄重。
- source_word: הֶעֱשַׁרְתִּי אֶת אַבְרָם
  choice: 是我使亚伯兰富足的
  rationale: 使役形态表达“使……富足”；加“是”自然呈现潜在夸口中的强调，未增添实质内容。
- source_word: אַבְרָם
  choice: 亚伯兰
  rationale: 采用现代中文圣经传统中通行的人名译法。
theological_decisions:
- issue: 省略式誓言的解释
  choice: 按起誓拒绝来译：“都不会拿”
  alternative: 逐字译作“如果从一根线直到鞋带，如果我拿……”
  rationale: אִם在希伯来誓言中可引出省略咒诅后果的否定誓词；第22节举手起誓的上下文确定了这一功能。明确否定能让现代读者理解，同时由脚注交代原文形式。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“一根线、一根鞋带”保留原文具体意象；“免得”适合誓言语境。脚注标记[a]已置于正文对应短语之后。
