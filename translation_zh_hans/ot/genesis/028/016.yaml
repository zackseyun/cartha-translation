  text: וַ/יִּיקַ֣ץ יַעֲקֹב֮ מִ/שְּׁנָת/וֹ֒ וַ/יֹּ֕אמֶר אָכֵן֙ יֵ֣שׁ יְהוָ֔ה בַּ/מָּק֖וֹם הַ/זֶּ֑ה וְ/אָנֹכִ֖י לֹ֥א יָדָֽעְתִּי׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/016.yaml
  text: Then Jacob awoke from his sleep and said[a], “Surely Yahweh is in this place, and I did not know it.”
translation:
  language: zh_hans
  text: 雅各从睡梦中醒来，说：“原来雅威[a]就在这里，我竟然不知道！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威”是希伯来文神名יהוה（YHWH）的音译。
    reason: 帮助普通读者识别音译神名，同时不在正文中以称号替代原文专名。
lexical_decisions:
- source_word: וַיִּיקַץ
  choice: 醒来
  rationale: 该动词表示从睡眠中醒来；“醒来”简洁自然，符合现代汉语叙事。
- source_word: מִשְּׁנָתוֹ
  choice: 从睡梦中
  rationale: 原文直指“从他的睡眠中”；汉语用“从睡梦中醒来”自然流畅，并未改变所指。
- source_word: אָכֵן
  choice: 原来
  rationale: 该语气词表达突然确认、恍然领悟；在本语境中，“原来”比单纯的“确实”更自然地传达雅各醒悟时的语气。
- source_word: יֵשׁ
  choice: 就在
  rationale: 存在词在此表示雅威临在这个地方；“就在这里”以自然汉语表达真实的在场，并与“原来”共同体现突然发现。
- source_word: יְהוָה
  choice: 雅威
  rationale: 采用神名四字母יהוה的常见现代汉语音译“雅威”，保留专名，不以“耶和华”或“主”等传统形式替代。
- source_word: בַּמָּקוֹם הַזֶּה
  choice: 在这里
  rationale: 指雅各睡卧并领受异梦的这个具体地点；“在这里”准确且符合直接引语的自然表达。
- source_word: וְאָנֹכִי
  choice: 我竟然
  rationale: 独立代词突出雅各本人，并与雅威的临在形成反差；“竟然”自然传达他对自己先前不知情的惊讶。
- source_word: לֹא יָדָעְתִּי
  choice: 不知道
  rationale: 完成式表示雅各此前并不知晓；汉语无需另加宾语，所不知道的是雅威在此临在，语境清楚。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用以色列上帝的专名יהוה。译作“雅威”可保留其专名性质，也避免用称号取代神名。
- issue: 雅威“在这里”的含义
  choice: 按原文保留为地点性的临在陈述
  alternative: 解释为雅威只居住在此地，或仅指雅各主观感受到上帝
  rationale: 原文断言雅威在这个地方，却未进一步界定这种临在的性质；译文不把它扩展成地域限制，也不弱化为纯粹的主观感受。
translation_notes:
  register: 采用现代、庄重而口语自然的直接引语。“原来……就在……”体现突然领悟，“我竟然不知道”保留惊讶与自我反差。
