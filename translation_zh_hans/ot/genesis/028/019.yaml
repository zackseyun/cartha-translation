base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/019.yaml
  text: And he called the name of that place Bethel[a], but formerly the name of the city was Luz.
translation:
  language: zh_hans
  text: 他给那地方起名叫伯特利[a]；不过，那城从前名叫路斯。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “伯特利”意思是“上帝的家”。
    reason: 说明希伯来地名 בֵּית אֵל 的词义；正文保留专名音译。
lexical_decisions:
- source_word: וַיִּקְרָא אֶת־שֵׁם
  choice: 起名叫
  rationale: 希伯来语直译为“称……的名”，在命名语境中用现代汉语“起名叫”自然准确，也保留了明确的命名动作。
- source_word: הַמָּקוֹם הַהוּא
  choice: 那地方
  rationale: 准确表达名词“地方”和指示成分“那”，符合现代汉语习惯。
- source_word: בֵּית אֵל
  choice: 伯特利
  rationale: 正文采用这一地名的通行中文音译，并以脚注说明其希伯来语含义。
- source_word: וְאוּלָם
  choice: 不过
  rationale: 该词引出对照性的补充说明；“不过”比生硬的直译更符合现代汉语，同时保留转折关系。
- source_word: לוּז
  choice: 路斯
  rationale: 采用该地名在中文圣经传统中的通行译名。
- source_word: שֵׁם הָעִיר
  choice: 那城……名叫
  rationale: 将希伯来语“那城的名字”按自然汉语重组，含义不变。
- source_word: לָרִאשֹׁנָה
  choice: 从前
  rationale: 这里指城市先前的名称；“从前”简明自然地表达时间上的较早阶段。
theological_decisions: []
