base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/017.yaml
  text: And he was afraid and said[a], “How awesome this place is! This is none other than the house of God[b], and this is the gate of heaven.”
translation:
  language: zh_hans
  text: 他就害怕，说：“这地方多么令人敬畏[a]！这地方不是别的，正是上帝的家，也是天的门[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这地方多么可怕！”希伯来语该词可表达恐惧、惊惧或敬畏。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语直译：“诸天的门”；现代汉语通常用“天”指属天的领域。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּירָא
  choice: 他就害怕
  rationale: 该词源自 ירא，在叙事中直接表达雅各因所见所闻而产生的惧怕；“害怕”是自然的现代汉语，也不把这种反应单纯解释为敬虔。
- source_word: מַה נּוֹרָא
  choice: 多么令人敬畏
  rationale: נוֹרָא 可指令人恐惧、惊畏或肃然起敬；“令人敬畏”保留神圣临在所引起的畏惧与崇敬，而“多么”传达 מַה 的感叹语气。
- source_word: הַמָּקוֹם הַזֶּה
  choice: 这地方
  rationale: 直接、自然地传达带指示词的名词短语。
- source_word: אֵין זֶה כִּי אִם
  choice: 这里不是别处，正是
  rationale: 该习语表示强烈的限定和认定；这一表达既保留郑重的强调，也比“无非是”更自然，且避免贬抑语感。
- source_word: בֵּית אֱלֹהִים
  choice: 上帝的家
  rationale: 忠实保留“家／房屋”的基本意象，不提前将此处具体化为后来制度化的圣殿。
- source_word: שַׁעַר הַשָּׁמָיִם
  choice: 天的门
  rationale: 保留门的空间意象；希伯来语 שָׁמַיִם 形式上为复数，但现代汉语通常以“天”指属天领域。
theological_decisions:
- issue: 单数指称语境中的 אֱלֹהִים
  choice: 上帝
  alternative: 众神
  rationale: 该词虽然具有复数形态，但在雅各异象及圣约叙事的语境中明确指独一的上帝，因此采用单数称谓。
- issue: 神圣语境中 נוֹרָא 的含义
  choice: 令人敬畏
  alternative: 可怕／令人恐惧
  rationale: 此处既含真实的惧怕，也含面对神圣临在时的惊畏；“令人敬畏”保留两者之间的张力，不将其化约为纯粹恐怖或一般赞叹。
- issue: בֵּית אֱלֹהִים 是否应具体译为圣殿
  choice: 上帝的家
  alternative: 上帝的殿／上帝的居所
  rationale: 原文使用普通的“家、房屋”，此时尚未描述一座实际建成的圣所；直译能保留其意象以及与后续圣所语言的呼应，而不提前具体化。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“上帝的家”保留原文具体而朴素的“房屋”意象；“天的门”保留原文比喻，不增添“通往”等解释性成分。
