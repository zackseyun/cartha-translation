  text: and that Jacob listened to his father and his mother[a], and went to Paddan-aram.
translation:
  language: zh_hans
  text: 又看见雅各听从父亲和母亲的话，前往巴旦·亚兰。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: 听从了……的话
  rationale: שׁמע与介词אֶל连用，在本语境中表示听取并接受父母的吩咐；“听从……的话”在现代汉语中自然地兼顾“听”与“遵从”的含义。
- source_word: אֶל אָבִיו וְאֶל אִמּוֹ
  choice: 父亲和母亲的话
  rationale: 希伯来文在“父亲”和“母亲”前重复אֶל，并分别带有“他的”后缀。汉语依上下文可省略重复的“他的”，仍清楚指雅各的父母；“……的话”与“听从”搭配自然。
- source_word: וַיֵּלֶךְ
  choice: 往……去了
  rationale: הלך是常用的“去、行走”；结合目的地，以“往……去了”直接而自然地表达。
- source_word: פַּדֶּנָה אֲרָם
  choice: 往巴旦·亚兰
  rationale: 将地名音译为“巴旦·亚兰”；פַּדֶּנָה的方向词尾以“往”表达。中点清楚标示复合外来地名的两个部分。
- source_word: וַ
  choice: 又
  rationale: 此处叙事连接词承接前文，并且本节在句法上属于前面“以扫看见/知道”的一系列宾语内容；“又”能自然保留这种并列承接关系。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。保留本节承接上文的句法特点，以“又知道”提示这是以扫所观察到的另一件事；“听从……的话”表达雅各对父母指示的回应，同时用脚注保留原词在“听”与“遵从”之间的语义幅度。
