- from: 又知道雅各听从了父亲和母亲的话[a]，往巴旦·亚兰去了。
  to: 又看见雅各听从父亲和母亲的话，前往巴旦·亚兰。
  rationale: 以“又看见”在现代汉语中明示本节从属于前文“以扫看见”的结构，避免无根据地改为“知道”。将“往……去了”改为“前往……”使连动叙述更简洁自然；保留“听从”及其脚注，以表达原文在听取与遵行之间的语义幅度。
  reviewer_model: gpt-5.6-terra
