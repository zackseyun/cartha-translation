  yaml_path: translation/ot/genesis/028/010.yaml
  text: Jacob departed from Beersheba and went to Haran[a].
translation:
  language: zh_hans
  text: 雅各离开别是巴，往哈兰去[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语为“往哈兰”，地名“哈兰”带有表示方向的词尾。
    reason: 说明原文方向词尾所表达的语法细节，并保留“朝向”与“抵达”之间的区别。
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: 离开
  rationale: 该词源于 יצא，表示从某地出去或离去；“离开”在现代汉语中自然、准确，也明确呼应后面的出发地点。
- source_word: יַעֲקֹב
  choice: 雅各
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: מִבְּאֵר שָׁבַע
  choice: 别是巴
  rationale: 介词 מִן 表示起点或来源；בְּאֵר שָׁבַע 是地名，采用中文通行译名“别是巴”。
- source_word: וַיֵּלֶךְ
  choice: 去
  rationale: הלך 是常用的“行走、前往”动词；此处“去”简洁自然，不额外加入“旅行”或“赶路”等原文未明说的意味。
- source_word: חָרָנָה
  choice: 往哈兰
  rationale: 地名后的方向词尾־ָה表示朝某地而去；“往哈兰”自然保留了方向性，又不强行说明当时已经抵达。
