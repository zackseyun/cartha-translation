base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/005.yaml
  text: So Isaac sent Jacob away[a], and he went to Paddan-aram, to Laban son of Bethuel the Aramean, the brother of Rebekah, the mother of Jacob and Esau.
translation:
  language: zh_hans
  text: 以撒就打发雅各走了；雅各便往巴旦·亚兰去，到亚兰人[a]彼土利之子拉班那里。拉班是利百加的兄弟；利百加是雅各和以扫的母亲。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 传统上也有译作“叙利亚人”的；希伯来语更确切地指“亚兰人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: 让……动身离开
  rationale: שׁלח在此表示差遣某人离去。“让……动身离开”既保留以撒主动差遣的意思，也自然衔接下文雅各启程的叙事；避免“打发”在现代汉语中可能带有轻慢意味。
- source_word: וַיֵּלֶךְ
  choice: 便去了
  rationale: הלך是常用的“去、行走”。“便去了”自然表达希伯来叙事中前后相继的动作。
- source_word: פַּדֶּנָה אֲרָם
  choice: 去了巴旦·亚兰
  rationale: 这是地名，采用音译；词尾的方向后缀以“去了”表达其“往、到”的含义。
- source_word: בֶּן בְּתוּאֵל
  choice: 彼土利的儿子
  rationale: 直接表达希伯来语的父子关系结构，符合现代汉语习惯。
- source_word: הָאֲרַמִּי
  choice: 亚兰人
  rationale: אֲרַמִּי具体指亚兰人；此译比传统的“叙利亚人”更准确，也避免与现代叙利亚国族概念混同。
- source_word: אֲחִי רִבְקָה
  choice: 利百加的兄弟
  rationale: אח指男性手足，但本节没有说明长幼；译作“兄弟”保留这一点，避免用“哥哥”或“弟弟”增添原文没有的信息。
- source_word: אֵם יַעֲקֹב וְעֵשָׂו
  choice: 利百加是雅各和以扫的母亲
  rationale: 将希伯来语同位说明转为独立分句，使现代读者容易理解，同时完整保留对利百加身份的明确交代。
