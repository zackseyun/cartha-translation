  text: Then Jacob made a vow[a], saying, “If God will be with me and will keep me on this way that I am going[d][c][b], and will give me bread to eat and clothing to wear,”
translation:
  language: zh_hans
  text: 雅各就许愿说：“如果上帝与我同在，在我所走的这条路上看顾我，又给我饼[a]吃，给我衣服穿，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “饼”也可泛指食物。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּדַּר יַעֲקֹב נֶדֶר
  choice: 雅各就许愿
  rationale: 动词 נדר 与同根名词 נֶדֶר 构成惯用表达；现代汉语用“许愿”自然地表达正式立愿的行动，无须生硬重复为“许下一个愿”。“就”承接上文叙事。
- source_word: לֵאמֹר
  choice: 说
  rationale: 自然引出誓愿的具体内容。
- source_word: אִם
  choice: 如果
  rationale: 直接保留希伯来语的条件形式，不把它改释为“当……时”或“既然”。
- source_word: אֱלֹהִים
  choice: 上帝
  rationale: 上下文明确指先前向雅各显现的那位上帝，按单数所指翻译。
- source_word: עִמָּדִי
  choice: 与我同在
  rationale: 准确表达上帝临在并陪伴雅各的关系含义。
- source_word: וּשְׁמָרַנִי
  choice: 看顾我
  rationale: שׁמר 在此含保护、守护之意；“看顾”在现代汉语中自然庄重，也比单纯“看守”更切合语境。
- source_word: בַּדֶּרֶךְ הַזֶּה אֲשֶׁר אָנֹכִי הוֹלֵךְ
  choice: 在我所走的这条路上
  rationale: 保留“这条路”和雅各正在行走的关系从句，同时在汉语中流畅自然；既可指实际道路，也不排除旅程含义。
- source_word: וְנָתַן לִי
  choice: 又给我
  rationale: 在条件句中与前面的动词并列；“又”自然连接连续条件。
- source_word: לֶחֶם לֶאֱכֹל
  choice: 给我饼吃
  rationale: 保留 לֶחֶם 的具体词义“饼”，并自然表达 לֶאֱכֹל 的用途；其泛指食物的可能性列入脚注。
- source_word: וּבֶגֶד לִלְבֹּשׁ
  choice: 衣服穿
  rationale: 以简洁自然的汉语保留“衣服”和“穿”的对应关系，与“饼吃”构成平行结构。
theological_decisions:
- issue: 雅各条件性誓愿的性质
  choice: 用“如果”直接呈现条件句
  alternative: 译为“当上帝与我同在”或“既然上帝必与我同在”
  rationale: 希伯来语 אִם 明确引出条件。译文不预先判定雅各是在怀疑、试探，还是带着信心回应应许，从而保留经文本身的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“在我所走的这条路上”兼顾原文形式与汉语自然度；句末保留逗号，因为誓愿的条件和结果在后续经文中继续。
