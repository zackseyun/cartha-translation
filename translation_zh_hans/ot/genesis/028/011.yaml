  text: וַ/יִּפְגַּ֨ע בַּ/מָּק֜וֹם וַ/יָּ֤לֶן שָׁם֙ כִּי בָ֣א הַ/שֶּׁ֔מֶשׁ וַ/יִּקַּח֙ מֵ/אַבְנֵ֣י הַ/מָּק֔וֹם וַ/יָּ֖שֶׂם מְרַֽאֲשֹׁתָ֑י/ו וַ/יִּשְׁכַּ֖ב בַּ/מָּק֥וֹם הַ/הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/011.yaml
  text: He came to a certain place and spent the night there[a], because the sun had set. He took one of the stones of the place, put it under his head[c][b], and lay down in that place.
translation:
  language: zh_hans
  text: 他来到那地方[a]，因为太阳已经落了，就在那里过夜。他从那地方的石头中取了一块[b]，放在头边[c]，便在那地方躺下。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文首次提到这里时直译为“那地方”；这一表达突出该地点在后文中的重要性。
    reason: lexical_alternative
  - marker: b
    text: 或译：“他取了那地方的几块石头。”原文可表示从复数的“石头”中取出一部分；上下文通常理解为取了一块。
    reason: alternative_reading
  - marker: c
    text: “头边”所译的希伯来词可指头所在的位置或头枕处；也可译作“头下”或“当作枕头”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְגַּע בַּמָּקוֹם
  choice: 来到那地方
  rationale: פגע 与地点介词连用，在此行旅语境中表示到达。希伯来文首次提及便用定冠词，译作“那地方”既自然，也保留叙事对该地点的突出强调。
- source_word: וַיָּלֶן שָׁם
  choice: 就在那里过夜
  rationale: לון 指留宿、过夜；“过夜”是现代汉语中自然且准确的表达。
- source_word: כִּי בָא הַשֶּׁמֶשׁ
  choice: 因为太阳已经落了
  rationale: 太阳与 בוא 连用是日落的惯用表达；“已经”清楚呈现它是停宿的原因。
- source_word: וַיִּקַּח מֵאַבְנֵי הַמָּקוֹם
  choice: 他从那地方的石头中取了一块
  rationale: 介词 מִן 接复数名词可表部分关系。正文依上下文译为取“一块”，脚注保留理解为取若干石头的可能。
- source_word: מְרַאֲשֹׁתָיו
  choice: 放在头边
  rationale: 该词指头所在的位置或头部周围，而不必明确表示压在头下；“头边”保留其空间意义，也避免把石头的具体用途说得过死。
- source_word: וַיִּשְׁכַּב בַּמָּקוֹם הַהוּא
  choice: 便在那地方躺下
  rationale: שכב 在这里指躺卧；不直接译成“睡了”，以免超出动作本身。重复“那地方”保留原文对地点的强调。
