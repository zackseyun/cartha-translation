base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/001.yaml
  text: Then Isaac called Jacob and blessed him and commanded him[a], saying, “You shall not take a wife from the daughters of Canaan.”
translation:
  language: zh_hans
  text: 于是，以撒把雅各叫来，为他祝福，又吩咐他说：“你不可娶迦南的女子为妻。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרָא יִצְחָק אֶל יַעֲקֹב
  choice: 以撒把雅各叫来
  rationale: קרא אל在此表示叫某人前来；“把雅各叫来”符合现代汉语叙事，也不过度强化为正式召见。
- source_word: וַיְבָרֶךְ אֹתוֹ
  choice: 为他祝福
  rationale: ברך是“祝福”的标准用词；“为他祝福”自然表达动作对象。
- source_word: וַיְצַוֵּהוּ
  choice: 又吩咐他
  rationale: צוה表示带权威的命令或嘱咐。父亲在此明确下达禁令，“吩咐”既保留权威性，也符合亲属语境。
- source_word: וַיֹּאמֶר לוֹ
  choice: 说
  rationale: 直译为“对他说”；结合前面的“吩咐他”，译作“吩咐他说”可自然引出直接引语，并保留希伯来语连续动词的结构。
- source_word: לֹא תִקַּח
  choice: 你不可娶
  rationale: 否定词לֹא加未完成式在这里表达禁令；“不可”庄重而清楚。“娶”也准确体现婚姻语境。
- source_word: אִשָּׁה
  choice: 为妻
  rationale: אִשָּׁה在此指婚娶对象；与לקח连用时，汉语自然表达为“娶……为妻”。
- source_word: מִבְּנוֹת כְּנָעַן
  choice: 迦南的女子
  rationale: 字面是“迦南的女儿们”，属于族群表达，实际指迦南女子。“迦南的女子”保留原文表达的基本形态，同时比“迦南的女儿”更符合现代汉语。
- source_word: וַ
  choice: 于是／又
  rationale: 叙事中的连续וַ按汉语语流分别译为“于是”和“又”，清楚呈现事件推进，避免机械重复“和”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重且易懂的叙事语言。“你不可娶迦南的女子为妻”保留禁令力度；不另加脚注，因为“迦南的女子”在现代汉语中已能自然表达该族群含义。
