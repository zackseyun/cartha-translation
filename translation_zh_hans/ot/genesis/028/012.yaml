  naturalness: 原句“神的使者正在上面上去下来”中“上面上去”连用显得拗口，且“上面”的指代在汉语中不如原文清晰。改作“神的使者在梯子上，上去下来”符合现代汉语中庄重的圣经叙事语体，也保留原文动作的进行性画面而不作过度解释。
