base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/012.yaml
  text: And he dreamed[a], and behold, a ladder was set up on the earth, and its top reached to heaven; and behold[b], the angels of God were ascending and descending on it.
translation:
  language: zh_hans
  text: 他做了一个梦：看哪，有一架梯子[a]立在地上，梯顶伸到天上；看哪，神的使者在梯子上，上去下来[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“阶梯”。希伯来语这个词也可泛指供人上下的结构。
    reason: lexical_alternative
  - marker: b
    text: “在梯子上”也可能译作“在他身上”，但按上下文，最自然的所指是梯子。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּחֲלֹם
  choice: 他做了一个梦
  rationale: 以自然的现代汉语表达叙事推进，并保留这是梦中所见。
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留原文两次突显梦中景象的提示语及其生动、庄重的修辞力量。
- source_word: סֻלָּם
  choice: 梯子
  rationale: 该词指供上下的结构；“梯子”贴近传统译法，但原词未必限定为有横档的窄梯，因此以脚注保留较宽泛的可能。
- source_word: מֻצָּב אַרְצָה
  choice: 立在地上
  rationale: 简洁表达该结构被安置并稳立于地面的状态，也保留与天上的垂直对照。
- source_word: וְרֹאשׁוֹ מַגִּיעַ הַשָּׁמָיְמָה
  choice: 梯顶直达天上
  rationale: “梯顶”自然对应物体的“头/顶端”，“直达天上”准确呈现其向天延伸的景象。
- source_word: מַלְאֲכֵי אֱלֹהִים
  choice: 神的使者
  rationale: 在异象语境中所指为超自然使者；此译法同时保留 מַלְאָךְ 的基本含义，避免加入原文没有的细节。
- source_word: עֹלִים וְיֹרְדִים
  choice: 正在……上去下来
  rationale: “正在”反映分词所描绘的持续动态；按原文次序保留先上后下。
- source_word: בּוֹ
  choice: 在上面
  rationale: 最近且最自然的先行词是梯子；“在上面”避免汉语重复，同时以脚注注明语法上可能的另一指向。
theological_decisions:
- issue: סֻלָּם 所呈现的形象
  choice: 梯子
  alternative: 阶梯或其他供上下的结构
  rationale: 传统的“梯子”有充分词义依据，但希伯来词本身并未明确结构细节；脚注保留其较宽泛的词义，不把梦中形象过度具体化。
- issue: בּוֹ 的所指
  choice: 在梯子上面
  alternative: 在他身上
  rationale: 阳性单数后缀在语法上容许其他理解，但上下文中最近、最自然的先行词是 סֻלָּם（梯子）。正文采用顺畅读法，脚注保留真实歧义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“看哪”刻意保留原文异象叙述的突显语气；两个脚注标记均置于正文相关词句之后。
