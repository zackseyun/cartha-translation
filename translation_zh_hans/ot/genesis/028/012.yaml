revisions:
- from: 他做了一个梦：看哪，有一架梯子[a]立在地上，梯顶直达天上；看哪，神的使者正在上面上去下来[b]。
  to: 他做了一个梦：看哪，有一架梯子[a]立在地上，梯顶伸到天上；看哪，神的使者在梯子上，上去下来[b]。
  rationale: 仅作必要的汉语表达和细微语义校正：明确“在梯子上”的所指，消除不自然的词语连用；以“伸到”准确表达梯顶达到天上的视觉图像。保留“看哪”、梯子意象、使者称谓、先上后下的顺序，以及两个原有脚注锚点和其所保留的歧义。
