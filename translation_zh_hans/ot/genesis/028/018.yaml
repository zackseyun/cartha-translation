base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/018.yaml
  text: Jacob rose early in the morning[a], took the stone that he had placed at his head, set it up as a pillar[c][b], and poured oil on its top.
translation:
  language: zh_hans
  text: 雅各清早起来，拿起那块曾放在他头边的石头，把它立作石柱[a]，又把油浇在石柱顶上[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“立作一块竖石”。
    reason: מַצֵּבָה可指石柱或竖立的石头。
  - marker: b
    text: 直译：“在它头上”。
    reason: 希伯来文以“头”指石柱的顶部；正文采用较自然、明确的汉语表达。
lexical_decisions:
- source_word: וַיַּשְׁכֵּם יַעֲקֹב בַּבֹּקֶר
  choice: 雅各清早起来
  rationale: וַיַּשְׁכֵּם表示早起，בַּבֹּקֶר说明时间；“清早起来”自然简洁，并保留原文的时间强调。
- source_word: הָאֶבֶן
  choice: 那块……石头
  rationale: 保留定冠词和单数；中文以量词“块”自然表达石头。
- source_word: אֲשֶׁר שָׂם מְרַאֲשֹׁתָיו
  choice: 曾放在他头旁
  rationale: מְרַאֲשֹׁתָיו指头部所在之处；译作“头旁”比“枕在头下”更贴近原文，避免断定石头确实位于头下。
- source_word: וַיָּשֶׂם אֹתָהּ מַצֵּבָה
  choice: 把它立作石柱
  rationale: מַצֵּבָה是竖立的石头或石柱；“立作石柱”同时表达竖立的动作与所得形态。
- source_word: וַיִּצֹק שֶׁמֶן
  choice: 把油浇在
  rationale: 原文动词是“倾倒、浇”，并未直接使用“膏抹”；采取描述性译法，不额外加入礼仪解释。
- source_word: עַל רֹאשָׁהּ
  choice: 在柱顶上
  rationale: 字面为“在它的头上”，指石柱顶部；“柱顶上”是现代汉语中自然清楚的对应表达。
theological_decisions:
- issue: 石柱及浇油行为可能具有的宗教礼仪意义
  choice: 按叙事动作直译为“立作石柱”并“把油浇在柱顶上”
  alternative: 译作“立作纪念碑”或“用油膏抹它”
  rationale: 原文只叙述雅各竖立石头并浇油，没有在本节明确评价其性质，也未直接称其为纪念物或使用“膏抹”一词。描述性译法可避免将后来的正面或负面神学评价带入经文。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。以单一主语带出连续动作，体现希伯来文连续动词的明快节奏；不照搬英语材料中标记位置明显错置的脚注，而按希伯来文本重新配置脚注。
