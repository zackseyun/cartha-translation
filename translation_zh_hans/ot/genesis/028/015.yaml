  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/הִנֵּ֨ה אָנֹכִ֜י עִמָּ֗/ךְ וּ/שְׁמַרְתִּ֨י/ךָ֙ בְּ/כֹ֣ל אֲשֶׁר תֵּלֵ֔ךְ וַ/הֲשִׁ֣בֹתִ֔י/ךָ אֶל הָ/אֲדָמָ֖ה הַ/זֹּ֑את כִּ֚י לֹ֣א אֶֽעֱזָבְ/ךָ֔ עַ֚ד אֲשֶׁ֣ר אִם עָשִׂ֔יתִי אֵ֥ת אֲשֶׁר דִּבַּ֖רְתִּי לָֽ/ךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/015.yaml
  text: And behold[a], I am with you, and I will keep you wherever you go, and I will bring you back to this land[c][b]. For I will not leave you until I have done what I have spoken to you.
translation:
  language: zh_hans
  text: 看哪，我与你同在；无论你去哪里，我都必看顾你，也必带你回到这片土地。我不会离开你，直到我成就了我对你所说的一切。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “直到”在这里强调：神必不在成就自己所说的一切之前离开雅各；这句话本身没有说明此后会怎样。
    reason: preserve_source_ambiguity
lexical_decisions:
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留希伯来语引人注意并增强现场感的话语标记；“看哪”庄重而清楚。
- source_word: אָנֹכִי עִמָּךְ
  choice: 我与你同在
  rationale: 直接保留第一人称强调及神同在的表达，不额外加入解释。
- source_word: וּשְׁמַרְתִּיךָ
  choice: 我都必看顾你
  rationale: שׁמר兼有守护、保护、照看的含义；“看顾”能自然涵盖持续照料与保护，避免将语义限缩为防御危险。
- source_word: בְּכֹל אֲשֶׁר תֵּלֵךְ
  choice: 无论你去哪里
  rationale: 以自然的现代汉语表达“在你所去的一切地方”，准确传达范围不受地点限制。
- source_word: וַהֲשִׁבֹתִיךָ
  choice: 我也必带你回到
  rationale: 保留שׁוב使役形的含义，即神使雅各返回；“带你回到”比生硬的“使你返回”更自然。
- source_word: אֶל הָאֲדָמָה הַזֹּאת
  choice: 这片土地
  rationale: אֲדָמָה可指地面、土壤或地域；此处涉及雅各离开后归回的地方，“土地”既自然，也保留具体地域含义。
- source_word: לֹא אֶעֱזָבְךָ
  choice: 我不会离开你
  rationale: עזב可译为离开、撇下或离弃；“离开”最宽泛直接，并与前文“我与你同在”相呼应。
- source_word: עַד אֲשֶׁר אִם עָשִׂיתִי
  choice: 直到我成就了
  rationale: 该结构指向将来某一完成点；汉语用“直到……了”表达神所说之事必定完成，同时保留原文的时间界限措辞。
- source_word: אֵת אֲשֶׁר דִּבַּרְתִּי לָךְ
  choice: 我对你所说的一切
  rationale: 原文是“所说的”，并未直接使用“应许”一词；译文因此保留原有表述，不把隐含的应许意味写成明说。
theological_decisions:
- issue: 神同在、保护并使雅各归回的保证
  choice: 以“同在—看顾—带回—成就所说之事”的顺序直译核心承诺
  alternative: 采用“保守”“不离弃”“实现应许”等更具传统或解释色彩的措辞
  rationale: 译文保留经文中神亲自同在和信实成就其话语的张力，但不借后来的神学术语扩大或限定其范围。
- issue: “直到”是否暗示此后神会离开
  choice: 正文保留原文的“直到”，并用脚注说明其语用重点
  alternative: 改写为“我绝不会离开你，必成就……”以排除可能误解
  rationale: 原文确实使用时间界限结构，主要保证神不会在话语成就之前离开；直接改成“永不”会超出本句明说的范围，故保留措辞及其开放性。
translation_notes:
  register: 采用现代、自然而庄重的普通话。“看哪”保留叙事中的郑重提示；“看顾”虽略带经文语体，但现代读者容易理解，并能兼顾保护与照料之意。句子以分号和逗号呈现原文连续的应许结构。
