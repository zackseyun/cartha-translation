  text: וַ/יַּ֣רְא עֵשָׂ֔ו כִּ֥י רָע֖וֹת בְּנ֣וֹת כְּנָ֑עַן בְּ/עֵינֵ֖י יִצְחָ֥ק אָבִֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/008.yaml
  text: And Esau saw that the daughters of Canaan were evil in the eyes of Isaac his father[a].
translation:
  language: zh_hans
  text: 以扫看出，迦南的女子在他父亲以撒眼中并不好[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “不好”也可译作“恶”或“坏”。这里可能是说，以撒不赞同以迦南女子为婚配对象。
    reason: 说明רָעוֹת的词义范围及其在本句评价语境中的可能含义。
lexical_decisions:
- source_word: וַיַּרְא
  choice: 看出
  rationale: 动词本义是“看见”；结合上下文，它也包含由所见而认识到的意思。“看出”既保留视觉词义，又自然表达以扫明白父亲态度的语境。
- source_word: עֵשָׂו
  choice: 以扫
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: כִּי
  choice: （看出）……
  rationale: 这里引出以扫所察觉的内容，在中文中无需另译连接词。
- source_word: רָעוֹת
  choice: 是不好的
  rationale: 该形容词可指“坏的”或“恶的”。在“在某人眼中”这一评价结构里，主要表达以撒对这些女子作为婚配对象持负面看法；“不好”保留原文负面措辞，又不武断地把它限定为道德邪恶。
- source_word: בְּנוֹת כְּנָעַן
  choice: 迦南的女子
  rationale: 字面为“迦南的女儿们”，在此指迦南女子；采用自然现代汉语表达，同时保留地域或族群指向。
- source_word: בְּעֵינֵי
  choice: 在……眼中
  rationale: 保留希伯来语表达评价与观感的常见习语，现代中文也易于理解。
- source_word: יִצְחָק אָבִיו
  choice: 他父亲以撒
  rationale: 明确“他的”所指为以扫，并采用自然中文语序。
theological_decisions:
- issue: רָעוֹת是否应明确译为道德上的“邪恶”
  choice: 正文译为“不好”，脚注说明也可译作“恶”或“坏”
  alternative: 译为“是恶的”
  rationale: 原词具有“坏、恶”的语义范围，但本句的“在以撒眼中”侧重以撒的负面评价，具体是否断言这些女子本身道德邪恶并不完全明确，因此不在正文中消除这一张力。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准普通话。“在……眼中”保留原文习语；“迦南的女子”比字面的“迦南的女儿们”更符合现代汉语指称成年婚配对象的习惯。
