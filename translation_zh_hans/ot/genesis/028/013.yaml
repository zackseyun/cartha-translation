id: GEN.28.13
reference: Genesis 28:13
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/הִנֵּ֨ה יְהוָ֜ה נִצָּ֣ב עָלָי/ו֮ וַ/יֹּאמַר֒ אֲנִ֣י יְהוָ֗ה אֱלֹהֵי֙ אַבְרָהָ֣ם אָבִ֔י/ךָ וֵ/אלֹהֵ֖י יִצְחָ֑ק הָ/אָ֗רֶץ אֲשֶׁ֤ר אַתָּה֙ שֹׁכֵ֣ב עָלֶ֔י/הָ לְ/ךָ֥ אֶתְּנֶ֖/נָּה וּ/לְ/זַרְעֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/013.yaml
  text: And behold[a], Yahweh was standing above it, and he said, “I am Yahweh, the God of Abraham your father and the God of Isaac[b]. The land on which you are lying I will give to you and to your offspring.”
translation:
  language: zh_hans
  text: 看哪，雅威站在它上方[a]，说：“我是雅威，是你祖先亚伯拉罕的上帝，也是以撒的上帝。你现在躺卧的这片土地，我要赐给你和你的后裔[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “它”指上文的梯子。原文也可理解为“雅威站在他旁边”或“站在他上方”，其中“他”指雅各。
    reason: 保留希伯来语代词 עָלָיו 的指代歧义。
  - marker: b
    text: 原文直译为“你的种子”，在这里是集合用法，指你的后裔。
    reason: 说明 זֶרַע 的字面意义及集合性单数用法。
lexical_decisions:
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留希伯来语提示读者注意、使异象场景鲜明起来的语篇作用；“看哪”庄重而易懂。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来语四字神名的通行学术拟音直接译出其专名性质，不以“主”这一称号代替。
- source_word: נִצָּב
  choice: 站在
  rationale: 该分词描写异象中持续呈现的姿态；汉语“站在”自然地表达这一状态。
- source_word: עָלָיו
  choice: 在它上方
  rationale: 阳性单数代词最近的先行词是上文的梯子，因此正文取“它”；“上方”保留 עַל 的垂直空间关系，同时在脚注保留指向雅各的可能。
- source_word: אֱלֹהֵי אַבְרָהָם אָבִיךָ
  choice: 你祖先亚伯拉罕的上帝
  rationale: אָב 可指父亲，也可在家族谱系中指先祖；亚伯拉罕是雅各的祖父，现代汉语用“祖先”既符合语境，也避免把他误解为雅各的直接生父。
- source_word: הָאָרֶץ
  choice: 这片土地
  rationale: 族长应许的语境指所应许之地，不只是身体下面的一小块地面；“这片土地”兼顾指示性和自然汉语。
- source_word: שֹׁכֵב עָלֶיהָ
  choice: 你现在躺卧的
  rationale: 分词表达当下持续的动作；加入“现在”使现代汉语清楚呈现其进行状态。
- source_word: לְךָ אֶתְּנֶנָּה
  choice: 我要赐给你
  rationale: 未完成式在应许语境中表达将来的赐予；“赐给”符合上帝赐地的庄重语境。
- source_word: וּלְזַרְעֶךָ
  choice: 和你的后裔
  rationale: זֶרַע 是集合性单数，可涵盖延续的后代群体；“后裔”在现代汉语中自然且保留这一集合意义。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用以色列上帝的专名。正文以“雅威”音译，保留专名，不以称号“主”替代；“耶和华”是传统音译，但较不贴近通常重建的读音。
- issue: 异象中 עָלָיו 所指的对象
  choice: 在它上方，即在梯子上方
  alternative: 在他旁边／在他上方，即以雅各为参照
  rationale: 最近的语法先行词是上文的梯子，所以正文采用此读法；但阳性单数后缀也可能指雅各，因此用脚注保留歧义。
- issue: “亚伯拉罕，你的父亲”中 אָב 的关系含义
  choice: 你祖先亚伯拉罕
  alternative: 你父亲亚伯拉罕
  rationale: 希伯来语 אָב 可用于较广的祖先关系。现代汉语“父亲”通常专指直接生父，会在此造成事实性误解，因此译作“祖先”，而不改变亚伯拉罕作为雅各家族之父的神学关联。
translation_notes:
  register: 采用现代、庄重而清楚的叙事语体。“看哪”保留异象展开时的郑重与鲜明感；整体句式尽量顺应现代普通话，同时保留原文的应许语气和代词歧义。
