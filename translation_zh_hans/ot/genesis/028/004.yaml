  text: וְ/יִֽתֶּן לְ/ךָ֙ אֶת בִּרְכַּ֣ת אַבְרָהָ֔ם לְ/ךָ֖ וּ/לְ/זַרְעֲ/ךָ֣ אִתָּ֑/ךְ לְ/רִשְׁתְּ/ךָ֙ אֶת אֶ֣רֶץ מְגֻרֶ֔י/ךָ אֲשֶׁר נָתַ֥ן אֱלֹהִ֖ים לְ/אַבְרָהָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/004.yaml
  text: May he give you the blessing of Abraham[a], to you and to your offspring with you, so that you may possess the land of your sojournings[b], which God gave to Abraham.
translation:
  language: zh_hans
  text: 愿他把亚伯拉罕的福赐给你，也赐给与你同在的后裔[a]，使你得着你寄居的土地为业[b]，就是上帝赐给亚伯拉罕的土地。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“与你同在的种子”；希伯来词的形式是单数，但在这里具有集合意义，指后代。
    reason: lexical_alternative
  - marker: b
    text: 或译“使你占有你寄居的土地”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִתֶּן
  choice: 愿他……赐给
  rationale: 在祝福语境中，此动词形式表达愿望或祈愿；“愿他”自然传达这一语气。句首连接词承接上文，在中文中无需机械译出。
- source_word: בִּרְכַּת אַבְרָהָם
  choice: 亚伯拉罕的福
  rationale: 直接呈现希伯来语所属结构，并保留其与亚伯拉罕之约的联系。
- source_word: לְךָ וּלְזַרְעֲךָ אִתָּךְ
  choice: 赐给你和与你同在的后裔
  rationale: 保留重复的“给你”以及原文的“与你同在”，不将雅各与其后裔之间的关系隐去。“后裔”可自然表达集合意义。
- source_word: זַרְעֲךָ
  choice: 后裔
  rationale: 该词字面与“种子”有关，语法形式为单数，但此处集合性地指后代；“后裔”在现代中文中准确、庄重且自然。
- source_word: לְרִשְׁתְּךָ
  choice: 使你得着……为业
  rationale: 带介词的动词不定式表达目的或结果。ירש可指取得、占有或承受产业；“得着……为业”兼顾土地占有与应许产业的语境。
- source_word: אֶרֶץ מְגֻרֶיךָ
  choice: 你寄居的土地
  rationale: מָגוּר指以寄居者身份居住，而非泛指漂泊；此译法自然保留族长在应许之地寄居的主题。
- source_word: אֲשֶׁר נָתַן אֱלֹהִים לְאַבְרָהָם
  choice: 就是上帝赐给亚伯拉罕的土地
  rationale: 明确关系从句所修饰的是“土地”，也忠实译出אֱלֹהִים为“上帝”。
theological_decisions:
- issue: 亚伯拉罕之约的应许含义
  choice: 保留“亚伯拉罕的福”和土地“为业”的具体措辞
  alternative: 意译为“应许给亚伯拉罕的福”，或将土地表达抽象化
  rationale: 本节直接把以撒对雅各的祝福与亚伯拉罕之约相连。译文保留福、后裔和土地这些具体元素，不将其缩减为一般性的兴盛。
- issue: ירש在土地语境中的含义
  choice: 译为“得着……为业”
  alternative: 译为“占有”或“取得”
  rationale: 原词兼有取得占有和承受产业的语义范围。“为业”保留盟约土地的产业意味，但脚注列出更直接的占有性译法，以免排除原词张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“寄居”保留族长作为外来居民暂住的含义；“得着……为业”具有适度的经文语体，但仍为普通读者所能理解。脚注标记均置于所解释的词语之后。
