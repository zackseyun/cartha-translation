base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/009.yaml
  text: So Esau went to Ishmael and took Mahalath[a], the daughter of Ishmael son of Abraham, the sister of Nebaioth, as a wife for himself in addition to his wives.
translation:
  language: zh_hans
  text: 于是，以扫到以实玛利那里，在原有的妻子以外[a]，又娶了玛哈拉为妻。玛哈拉是亚伯拉罕的儿子以实玛利的女儿、尼拜约的妹妹。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“加在他原有的妻子之上”。这里的希伯来语表示玛哈拉是以扫在已有妻子之外另娶的，并非取代原有的妻子。
    reason: 说明介词עַל在本句中的语义，并保留其较直译的表达。
lexical_decisions:
- source_word: וַיֵּלֶךְ עֵשָׂו אֶל יִשְׁמָעֵאל
  choice: 以扫到以实玛利那里
  rationale: הלך接אֶל表示前往某人那里；这样译符合希伯来叙事顺序，也比直译“走向以实玛利”更自然。
- source_word: וַיִּקַּח
  choice: 又娶了
  rationale: לקח本义为“取、带走”，但本句以לְאִשָּׁה明确婚姻关系；现代汉语用“娶”自然准确，“又”同时传达这是已有妻子之外的婚娶。
- source_word: מָחֲלַת
  choice: 玛哈拉
  rationale: 按现代中文圣经人名的通行音译处理该专名。
- source_word: בַּת יִשְׁמָעֵאל בֶּן אַבְרָהָם אֲחוֹת נְבָיוֹת
  choice: 玛哈拉是亚伯拉罕的儿子以实玛利的女儿、尼拜约的妹妹
  rationale: 完整保留人物谱系和同位说明，并调整为清楚自然的现代汉语句序。
- source_word: עַל נָשָׁיו
  choice: 在原有的妻子以外
  rationale: עַל在此结合婚娶语境表示追加、并列，即玛哈拉是以扫在已有妻子之外另娶的妻子，而不是取代她们。
- source_word: לוֹ לְאִשָּׁה
  choice: 娶了……为妻
  rationale: 该结构说明娶她归自己为妻；中文婚姻惯用语已经自然包含לוֹ的归属意味，无须生硬译作“为自己”。
