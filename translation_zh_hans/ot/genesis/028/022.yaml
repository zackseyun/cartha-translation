  text: וְ/הָ/אֶ֣בֶן הַ/זֹּ֗את אֲשֶׁר שַׂ֨מְתִּי֙ מַצֵּבָ֔ה יִהְיֶ֖ה בֵּ֣ית אֱלֹהִ֑ים וְ/כֹל֙ אֲשֶׁ֣ר תִּתֶּן לִ֔/י עַשֵּׂ֖ר אֲעַשְּׂרֶ֥/נּוּ לָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/022.yaml
  text: And this stone[a], which I have set up as a pillar, will be God’s house[b], and of all that you give me I will surely give a tenth to you.
translation:
  language: zh_hans
  text: 我立为柱子的这块石头，必成为神的家[a]；凡你赐给我的一切，我必献上其中的十分之一给你[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“神的房屋”。
    reason: 保留בֵּית אֱלֹהִים的另一自然直译，并避免把“神的家”限定为后来的正式圣殿建筑。
  - marker: b
    text: 原文用同根词重复，表示强调；也可译“我必定把其中的十分之一献给你”。
    reason: 说明עַשֵּׂר אֲעַשְּׂרֶנּוּ的不定词绝对式加同根动词所表达的强调。
lexical_decisions:
- source_word: מַצֵּבָה
  choice: 柱子
  rationale: 指竖立起来的石制标志或纪念物。“柱子”简洁自然，也保留了具体的石柱形象，未增添“纪念”这一解释。
- source_word: יִהְיֶה בֵּית אֱלֹהִים
  choice: 必成为神的殿
  rationale: בֵּית אֱלֹהִים直译为“神的家／神的房屋”，在此指与神相遇并归给神的神圣之处。“神的殿”在现代汉语中较自然，但不特指后来建成的圣殿；脚注保留更直译的表达。
- source_word: אֱלֹהִים
  choice: 神
  rationale: 上下文明确指雅各先前遇见的独一之神，而非泛指某位神明。
- source_word: תִּתֶּן לִי
  choice: 你赐给我的
  rationale: 保留神作为赐予者的含义；“赐给”符合对神说话的庄重语体，也自然表达未完成式在誓愿语境中的将来含义。
- source_word: עַשֵּׂר אֲעַשְּׂרֶנּוּ
  choice: 我必把十分之一献给你
  rationale: 不定词绝对式与同根限定动词连用，具有加强语气的作用，以“必”体现；“把十分之一献给你”清楚表达归给神的誓愿，同时避免把后来的制度化用语读入本节。
- source_word: לָךְ
  choice: 给你
  rationale: 直接保留神为所献十分之一的接受者。
- source_word: הָאֶבֶן הַזֹּאת אֲשֶׁר שַׂמְתִּי
  choice: 我所立作柱子的这块石头
  rationale: 按汉语语序将关系从句前置，并结合שַׂמְתִּי与מַצֵּבָה表达“立作”，清楚呈现雅各竖立石头的动作。
theological_decisions:
- issue: 雅各所立石头成为“神的殿”的性质
  choice: 保留石头将成为“神的殿”这一陈述，将其呈现为与神相遇并归给神的神圣地点，不作进一步解释。
  alternative: 把石头本身明确说成神龛，或直接解释为预表后来某座圣殿。
  rationale: 希伯来文本直接称这块石头将成为בֵּית אֱלֹהִים，但未说明其与后来圣殿制度的关系。译文因此保留原有张力，不加入后期神学框架。
- issue: 十分之一的誓愿
  choice: 译为雅各必从神所赐的一切中献上十分之一。
  alternative: 采用带有后世律法或教会制度色彩的固定“十一奉献”术语。
  rationale: 本节说的是雅各个人所许的愿。译文保留献给神及十分之一的含义，却不预设后来的制度。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“立作柱子”保留古代竖石行为的具体形象；“必”表达誓愿和原文加强语气。标点按汉语习惯处理，并避免使用可能使读者直接联想到后世宗教制度的术语。
