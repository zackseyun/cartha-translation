source:
  edition: WLC
  text: וְ/אֵ֤ל שַׁדַּי֙ יְבָרֵ֣ךְ אֹֽתְ/ךָ֔ וְ/יַפְרְ/ךָ֖ וְ/יַרְבֶּ֑/ךָ וְ/הָיִ֖יתָ לִ/קְהַ֥ל עַמִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/003.yaml
  text: And may God Almighty bless you[a], and make you fruitful, and multiply you[b], so that you may become an assembly of peoples.
translation:
  language: zh_hans
  text: 愿全能的上帝[a]赐福给你，使你繁衍，使你增多，叫你成为由许多民族组成的群体。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文作“伊勒·沙代”（El Shaddai）；传统译作“全能的上帝”，但“沙代”的确切含义并不确定。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵל שַׁדַּי
  choice: 全能的上帝
  rationale: 采用汉语中通行且庄重的神圣称号译法；同时以脚注保留希伯来语音译，并说明其确切含义存在争议。
- source_word: יְבָרֵךְ
  choice: 愿……赐福
  rationale: 此处未完成式在祝福语境中表达祈愿，而非单纯预告未来；“愿”自然传达这一语气。
- source_word: וְיַפְרְךָ
  choice: 使你繁衍
  rationale: 使役词形表示使之结实、生育；在族长祝福的语境中，“繁衍”自然指后裔的生养。
- source_word: וְיַרְבֶּךָ
  choice: 使你增多
  rationale: 保留使役意义，并与前一动词分别表达“繁衍”和数量增长，未将希伯来文的并列完全合并。
- source_word: וְהָיִיתָ
  choice: 使你成为
  rationale: 在连续祝福中理解为前述赐福带来的结果；汉语用“使……成为”清楚衔接上下文。
- source_word: לִקְהַל עַמִּים
  choice: 众族的群体
  rationale: “群体”传达 קהל 所指的集合或共同体，又避免“会众”可能过早带入礼拜群体的含义；“众族”保留 עַמִּים 的复数。
theological_decisions:
- issue: 神圣称号 אֵל שַׁדַּי 的译法
  choice: 全能的上帝
  alternative: 伊勒·沙代／上帝沙代
  rationale: 正文采用传统且易懂的称号译法，但不把“全能”当作无争议的词源结论；音译及语义不确定性见脚注。
- issue: וְהָיִיתָ 与前文的关系
  choice: 使你成为（结果关系）
  alternative: 你将成为／并且你要成为
  rationale: 祝福语序支持将其理解为前述繁衍增多所带来的结果；此译法没有把它提升为与上下文无关的绝对预言。
translation_notes:
  register: 采用现代、庄重而易懂的祝福语体。“使你繁衍，使你增多”有意保留原文两个近义使役动词的递进与重复；“众族的群体”保留复数“众族”，并避免赋予 קהל 过强的宗教制度含义。
