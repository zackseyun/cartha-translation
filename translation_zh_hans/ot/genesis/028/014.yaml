base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/014.yaml
  text: Your offspring will be like the dust of the earth[a], and you will spread out to the west and to the east and to the north and to the south; and in you and in your offspring all the families of the earth will be blessed.
translation:
  language: zh_hans
  text: 你的后裔必像地上的尘土那样多；你必向西、向东、向北、向南扩展。地上万族都必因你和你的后裔蒙福[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“地上万族都必以你和你的后裔为自己求福。”这里的希伯来语动词也可理解为反身或中动态。
    reason: 保留וְנִבְרֲכוּ可能具有反身或中动态意义的另一种读法。
lexical_decisions:
- source_word: וְהָיָה זַרְעֲךָ
  choice: 你的后裔必……多
  rationale: זֶרַע是集合名词，可指后代整体；“后裔”既自然又保留集合意义。结合“像地上的尘土”这一比喻，补出“多”，明确其不可胜数的含义。
- source_word: כַּעֲפַר הָאָרֶץ
  choice: 像地上的尘土那样多
  rationale: 直译意象为“像地上的尘土”；“地上的尘土”在现代汉语中自然，并保留族长应许中数量众多的比喻。
- source_word: וּפָרַצְתָּ
  choice: 你必……扩展
  rationale: פרץ本有冲破、向外拓展之意；在四方方位的语境中，“扩展”清楚表达人数与疆域向外发展的图景。
- source_word: יָמָּה וָקֵדְמָה וְצָפֹנָה וָנֶגְבָּה
  choice: 向西、向东、向北、向南
  rationale: 四个词的方向词尾表示朝某方向移动；按希伯来文次序译出四方。此处נֶגֶב在方位序列中指“南”。
- source_word: וְנִבְרֲכוּ
  choice: 都必……蒙福
  rationale: ברך的Niphal形式在本应许语境中可自然理解为被动，即“蒙福”；同时以脚注保留反身或中动态的可能。
- source_word: בְךָ ... וּבְזַרְעֶךָ
  choice: 因你和你的后裔
  rationale: 介词ב在汉语中若机械译为“在……里”会生硬；“因”自然表达祝福与雅各及其后裔的关联，同时不过度限定具体媒介方式。
- source_word: כָּל מִשְׁפְּחֹת הָאֲדָמָה
  choice: 地上万族
  rationale: מִשְׁפְּחֹת指家族或宗族群体；“万族”是简洁庄重的集合表达，也传达כָּל所指的普世范围。אֲדָמָה在此应许公式中指全地。
theological_decisions:
- issue: 族长应许公式中ברך的Niphal形式如何理解
  choice: 主文采用被动义：“地上万族都必……蒙福”
  alternative: 反身或中动态：“地上万族都必借着你和你的后裔为自己求福”
  rationale: 被动义切合上下文中的应许语气，也是该公式直接而合理的理解；但希伯来语形式存在反身或中动态理解的可能，因此在脚注中保留，不把相关神学张力静默消除。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“后裔”“蒙福”“万族”保留经文应许的凝练语体；用“扩展”呈现向四方伸展的动态。脚注标记置于其所说明的“蒙福”之后。
