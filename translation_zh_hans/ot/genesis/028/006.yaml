base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/006.yaml
  text: Esau saw that Isaac had blessed Jacob and sent him to Paddan-aram to take a wife for himself from there[a], and that when he blessed him, he commanded him, saying, “You shall not take a wife from the daughters of Canaan.”
translation:
  language: zh_hans
  text: 以扫看见以撒已经祝福雅各，并打发他到巴旦亚兰去，从那里娶妻；又看见以撒祝福雅各时，吩咐他说：“不可娶迦南的女子[a]为妻。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“迦南的女儿们”，指迦南女子。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: 以扫看见
  rationale: 叙事性 wayyiqtol 推进情节；中文无需另加原文没有的“那时”或“如今”。
- source_word: בֵרַךְ
  choice: 已经……祝福
  rationale: 祝福发生在以扫看见此事之前；“已经”自然表明相对时序。
- source_word: וְשִׁלַּח אֹתוֹ
  choice: 打发他
  rationale: 与“祝福”并列，表示以撒差遣雅各前往异地；“打发”符合庄重的现代叙事语体。
- source_word: פַּדֶּנָה אֲרָם
  choice: 到巴旦亚兰去
  rationale: 按传统且易辨识的中文地名音译处理，保留方向后缀所表达的趋向。
- source_word: לָקַחַת לוֹ מִשָּׁם אִשָּׁה
  choice: 从那里娶妻
  rationale: 在婚姻语境中，לָקַחַת אִשָּׁה 自然译作“娶妻”；中文无需明说“为自己”，其反身含义已由“娶妻”体现。
- source_word: בְּבָרֲכוֹ אֹתוֹ
  choice: 给他祝福时
  rationale: 介词 בְּ 在此表达伴随或时间背景；“……时”保留命令与祝福之间的时间关系。
- source_word: וַיְצַו עָלָיו לֵאמֹר
  choice: 曾吩咐他说
  rationale: צוה 表示有权威的命令或嘱咐；“吩咐”既保留其权威性，也符合父亲对儿子的叙事情境。“说”保留希伯来语引语公式。
- source_word: לֹא תִקַּח
  choice: 不可娶
  rationale: 未完成式带否定词 לֹא 在直接引语中表达禁令；“不可”简洁而有命令力度。
- source_word: מִבְּנוֹת כְּנָעַן
  choice: 迦南的女子
  rationale: 保留“迦南”这一归属表达，同时用现代中文可自然理解的“女子”；脚注说明字面措辞。
theological_decisions: []
