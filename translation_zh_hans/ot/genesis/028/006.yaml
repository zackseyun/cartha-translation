  to: 以扫看见以撒已经祝福雅各，并打发他到巴旦亚兰去，从那里娶妻；又看见以撒祝福雅各时，吩咐他说：“不可娶迦南的女子[a]为妻。”
  rationale: 仅作轻微时序和指代澄清：删除“曾”，使中文准确对应祝福时发出命令的叙事关系；第二分句重述“雅各”，避免代词在中文中的潜在歧义。其余内容及脚注均保留。
