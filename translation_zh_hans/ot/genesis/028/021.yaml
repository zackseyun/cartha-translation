base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/021.yaml
  text: and I return in peace to my father's house[a], and Yahweh will be my God.
translation:
  language: zh_hans
  text: 我平安回到我父亲的家[a]，雅伟必作我的神。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我安全无恙地回到我父亲的家。”希伯来语“平安”也可侧重安全返回或安好无恙。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׁבְתִּי
  choice: 我……回到
  rationale: 源自动词שׁוב，意为“返回、回去”。本句延续前文誓愿中的条件结构，用现代汉语“回到”自然表达将来可能实现的返回。
- source_word: בְשָׁלוֹם
  choice: 平安
  rationale: שָׁלוֹם在此兼有平安、安好和安全无恙之意；“平安”既直接对应原文，也不把含义缩窄为仅仅“安全”。
- source_word: אֶל בֵּית אָבִי
  choice: 到我父亲家
  rationale: 保留“父亲的家/家室”的亲属与家庭含义；现代汉语说“我父亲家”简洁自然。
- source_word: וְהָיָה
  choice: 就必作
  rationale: היה在条件—结果结构中表达“成为、作”；“就”显出承接前文的结果关系，“必”体现未然陈述的确定语气。
- source_word: יְהוָה
  choice: 雅伟
  rationale: 按希伯来文四字神名作音译，保留其作为以色列之神专名的性质，而不以“主”这一称号替代。
- source_word: לִי לֵאלֹהִים
  choice: 作我的神
  rationale: 原文直译近于“对我作神”；汉语以“作我的神”自然表达归属、关系与敬奉的含义。
theological_decisions:
- issue: 雅各的话是以条件方式接受雅伟为神，还是单纯作无条件的确认
  choice: 以“就必作我的神”保留前文条件与本句结果之间的联系
  alternative: 译作“雅伟也必作我的神”，弱化或不明确表达条件结果关系
  rationale: 本句延续28:20起的誓愿，马所拉重音在“我父亲家”后形成分界，使后半句自然可读为条件实现后的结果。译文不把其中的神学张力改写成无条件宣告。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“平安回到”保留希伯来语表达的宽广含义；“雅伟”作为神名音译，与普通称号“主”区分。脚注标记紧接其所说明的短语。
