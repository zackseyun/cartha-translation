base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/002.yaml
  text: Arise[a], go to Paddan-aram, to the house of Bethuel, your mother's father, and take for yourself from there a wife from the daughters of Laban, your mother's brother.
translation:
  language: zh_hans
  text: 起来，前往巴旦·亚兰，到你外祖父彼土利的家中，从那里从你舅父拉班的众女儿中娶一位为妻。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ק֥וּם לֵךְ֙
  choice: 起来，到……去
  rationale: 两个连续的命令分别译出；“起来”保留 קום 的起身行动和命令语气，“到……去”自然表达 הלך 及目的地。
- source_word: פַּדֶּ֣נָֽה אֲרָ֔ם
  choice: 到巴旦·亚兰去
  rationale: 将地名按常见中文圣经音译处理，并以“到……去”表达方向词尾。
- source_word: בֵּ֥יתָה בְתוּאֵ֖ל
  choice: 往……彼土利家里去
  rationale: בַּיִת 在这里既可指住所，也可指家族或家户；结合移动方向，译作“家里”自然，并保留目的地含义。
- source_word: אֲבִ֣י אִמֶּ֑ךָ
  choice: 你外祖父
  rationale: 字面为“你母亲的父亲”；现代汉语以“外祖父”准确、自然地表达同一亲属关系。
- source_word: וְקַח לְךָ֤
  choice: 娶……为妻
  rationale: לקח לְךָ 与 אִשָּׁה 连用，在婚配语境中意为“为自己娶妻”；汉语“娶……为妻”既自然，也表达 לְךָ 的自身相关含义。
- source_word: מִשָּׁם֙
  choice: 从那里
  rationale: 明确保留 מִן 的来源义。
- source_word: מִ/בְּנ֥וֹת לָבָ֖ן
  choice: 拉班的一个女儿
  rationale: מִן 表示从拉班众女儿中选取一位；“一个女儿”在现代汉语中自然呈现这种部分关系。
- source_word: אֲחִ֥י אִמֶּֽךָ
  choice: 你舅父
  rationale: 字面为“你母亲的兄弟”；“舅父”是现代汉语中准确而简洁的对应亲属称谓。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。亲属称谓使用汉语中信息更精确且自然的“外祖父”“舅父”，无需脚注重复字面结构；地名采用“巴旦·亚兰”。
