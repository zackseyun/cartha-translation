  yaml_path: translation/ot/genesis/005/012.yaml
  text: Kenan lived seventy years and fathered Mahalalel[a].
translation:
  language: zh_hans
  text: 该南活到七十岁，生了玛勒列[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 较为直译：该南活了七十年，生了玛勒列。
    reason: 说明希伯来语家谱公式更形式对应的译法。
lexical_decisions:
- source_word: וַיְחִי
  choice: 活到
  rationale: 在家谱年龄公式中，חיה表示“活了/活到”某一年龄；结合后续生子事件，“活到七十岁”符合现代汉语表达。
- source_word: קֵינָן
  choice: 该南
  rationale: 采用现代中文圣经中通行且能对应希伯来语 קֵינָן 的人名译法。
- source_word: שִׁבְעִים שָׁנָה
  choice: 七十岁
  rationale: 该时间成分说明该南生玛勒列时的年龄，汉语以“七十岁”表达最自然。
- source_word: וַיּוֹלֶד
  choice: 生了
  rationale: 使役形态在家谱公式中表示男子“生育、成为……的父亲”；“生了”简洁自然，并保留亲生关系。
- source_word: אֶת
  choice: 不单独译出
  rationale: 这是希伯来语确定直接宾语标记，现代汉语无需另行对应。
- source_word: מַהֲלַלְאֵל
  choice: 玛勒列
  rationale: 采用现代中文圣经中通行的人名译法，对应希伯来语 מַהֲלַלְאֵל。
