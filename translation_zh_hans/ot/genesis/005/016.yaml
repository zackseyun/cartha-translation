  yaml_path: translation/ot/genesis/005/016.yaml
  text: After he fathered Jared, Mahalalel lived eight hundred and thirty years and fathered sons and daughters.
translation:
  language: zh_hans
  text: 玛勒列生雅列之后，又活了八百三十年，并且生了儿子和女儿。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: 又活了
  rationale: 在家谱的固定句式中，חיה 的连续式表示生下所提名儿子之后继续存活；“又活了”自然表达这一延续关系。
- source_word: מַהֲלַלְאֵל
  choice: 玛勒列
  rationale: 采用现代中文圣经中较通行且易于辨认的人名译法。
- source_word: אַחֲרֵי הוֹלִידוֹ אֶת־יֶרֶד
  choice: 生雅列之后
  rationale: 准确保留时间关系；希伯来语使役式 ילד 在男性主语下表示生育、成为父亲，中文以“生”表达最自然。
- source_word: יֶרֶד
  choice: 雅列
  rationale: 采用现代中文圣经中较通行且易于辨认的人名译法。
- source_word: שְׁלֹשִׁים שָׁנָה וּשְׁמֹנֶה מֵאוֹת שָׁנָה
  choice: 八百三十年
  rationale: 按现代汉语数字次序表达总数，同时完整保留原文数值。
- source_word: וַיּוֹלֶד
  choice: 并且生了
  rationale: 保留与前一处 ילד 的词汇联系及叙事连接；“生了”比“又有了”更贴近原文的生育含义。
- source_word: בָּנִים וּבָנוֹת
  choice: 儿子和女儿
  rationale: 原文明确并列男性与女性后代，不概括为“儿女”或“孩子”。
