base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/010.yaml
  text: And Enosh lived eight hundred and fifteen years after he fathered Kenan[c][b][a], and he fathered sons and daughters.
translation:
  language: zh_hans
  text: 以挪士生该南之后，又活了八百一十五年，并且生了儿女。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: 又活了
  rationale: 在家谱的固定叙述中，חיה 表示继续活了若干年；“又活了”自然承接该南出生之后的年数。
- source_word: אֱנוֹשׁ
  choice: 以挪士
  rationale: 采用现代中文圣经读者熟悉、并与希伯来语人名相对应的通行译名。
- source_word: אַחֲרֵי הוֹלִידוֹ אֶת־קֵינָן
  choice: 生该南之后
  rationale: הוליד 是 ילד 的使役形，在男性家谱中表示生育、成为父亲；中文用“生”简洁自然，也保留家谱关系。
- source_word: קֵינָן
  choice: 该南
  rationale: 采用中文传统通行译名；所据文本为希伯来语 Kênān，而非另立受希腊语形式影响的音译。
- source_word: חֲמֵשׁ עֶשְׂרֵה שָׁנָה וּשְׁמֹנֶה מֵאוֹת שָׁנָה
  choice: 八百一十五年
  rationale: 希伯来语按十五加八百的次序表达；中文依通常数词顺序译为“八百一十五年”，总数不变。
- source_word: וַיּוֹלֶד בָּנִים וּבָנוֹת
  choice: 并且生了儿女
  rationale: “儿女”自然且完整地表达原文明确列举的“儿子和女儿”；“并且”保留叙事连接。
