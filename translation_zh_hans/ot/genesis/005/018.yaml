  text: 雅列活到一百六十二岁，生了以诺。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: 活到
  rationale: 在《创世记》第5章家谱的年龄公式中，חיה引出某人生育后代时的年龄；现代汉语用“活到……岁”自然准确。
- source_word: יֶרֶד
  choice: 雅列
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: שְׁתַּיִם וְשִׁשִּׁים שָׁנָה וּמְאַת שָׁנָה
  choice: 一百六十二岁
  rationale: 希伯来语按“二和六十……并一百”的次序表达，现代汉语依通常数词顺序译为“一百六十二岁”。
- source_word: וַיּוֹלֶד
  choice: 生了
  rationale: 在男性家谱语境中，ילד的使役形式表示生育、成为父亲；“生了”简洁自然，并与本章重复的家谱公式相符。
- source_word: אֶת חֲנוֹךְ
  choice: 以诺
  rationale: אֶת是直接宾语标记，不另译；חֲנוֹךְ采用现代中文圣经传统中通行的人名译法“以诺”。
