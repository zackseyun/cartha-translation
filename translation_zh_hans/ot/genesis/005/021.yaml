- source_word: וַיּוֹלֶד
  choice: 生了
  rationale: ילד使役形以男性为主语，在家谱中表示生育、成为某人的父亲；“生了”简洁自然，并保留家谱公式的直接性。
- source_word: אֶת
  choice: 不单独译出
  rationale: 这是希伯来语直接宾语标记，现代汉语无需对应词。
- source_word: מְתוּשָׁלַח
  choice: 玛土撒拉
  rationale: 采用现代中文圣经传统中通行的人名音译。
