  text: So all the days of Methuselah were nine hundred sixty-nine years, and he died.
translation:
  language: zh_hans
  text: 玛土撒拉一生共九百六十九岁，就死了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ כָּל יְמֵי
  choice: 一生共
  rationale: 这是族谱中总结寿数的固定表达。译作“一生共”自然清楚，同时准确传达“所有日子”的总和；若直译为“所有的日子”，现代汉语较生硬。
- source_word: מְתוּשֶׁלַח
  choice: 玛土撒拉
  rationale: 采用现代简体中文圣经语境中通行的人名音译。
- source_word: תֵּשַׁע וְשִׁשִּׁים שָׁנָה וּתְשַׁע מֵאוֹת שָׁנָה
  choice: 九百六十九岁
  rationale: 按现代汉语数词顺序合并表达总年龄；“岁”比重复使用“年”更符合汉语叙述人的寿数的习惯。
- source_word: וַיָּמֹת
  choice: 就死了
  rationale: “就”自然承接寿数总结后的结局，保留希伯来叙事推进关系；“死了”直截了当地保存本章反复出现的死亡公式。
