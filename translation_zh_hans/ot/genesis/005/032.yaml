  text: וַֽ/יְהִי נֹ֕חַ בֶּן חֲמֵ֥שׁ מֵא֖וֹת שָׁנָ֑ה וַ/יּ֣וֹלֶד נֹ֔חַ אֶת שֵׁ֖ם אֶת חָ֥ם וְ/אֶת יָֽפֶת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/032.yaml
  text: When Noah was five hundred years old[a], he fathered Shem, Ham[b], and Japheth.
translation:
  language: zh_hans
  text: 挪亚五百岁时，生了闪、含和雅弗。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “闪、含和雅弗”依照希伯来文本的排列；这个次序不一定表示他们的出生顺序，也不表示三人都在同一年出生。
    reason: cross_reference
lexical_decisions:
- source_word: וַיְהִי
  choice: ……时
  rationale: 这里的叙事形式引出时间背景；用“……时”自然地表达其句法功能，不拘泥于“事情是这样发生的”之类生硬套语。
- source_word: בֶּן חֲמֵשׁ מֵאוֹת שָׁנָה
  choice: 五百岁
  rationale: 希伯来语“……岁数之子”是表示年龄的惯用语；现代汉语自然表达为“五百岁”。
- source_word: וַיּוֹלֶד
  choice: 生了
  rationale: ילד的使役式以男性为主语时表示“生育、成为……的父亲”。“生了”符合汉语家谱叙述习惯，简洁而不使用古奥的“生下了儿子”式扩译。
- source_word: נֹחַ
  choice: 挪亚
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: שֵׁם
  choice: 闪
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: חָם
  choice: 含
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: יָפֶת
  choice: 雅弗
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: אֶת שֵׁם אֶת חָם וְאֶת יָפֶת
  choice: 闪、含和雅弗
  rationale: 宾语标记不另译；按希伯来文本保留三人的排列次序，并采用自然的现代汉语并列形式。
theological_decisions:
- issue: “闪、含和雅弗”的排列是否表示出生顺序，以及三人是否同年出生
  choice: 正文保留希伯来文本的人名次序，不明说出生先后，也不把三人解释为都在挪亚五百岁那一年出生。
  alternative: 按推定的出生顺序重排人名，或将句子明确译成三人同年出生。
  rationale: 本节列出挪亚达到五百岁时所生的三个儿子，但这种家谱式列名本身不必严格表示出生顺序，也不要求三人同年出生。保留原文次序，并用脚注指出其限度，可避免把协调解释写进正文。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语，保持创世记家谱叙述的凝练风格。“生了”在男性作主语的家谱语境中清楚表达“成为……的父亲”，同时避免古雅的“生子”或冗长的解释性措辞。
