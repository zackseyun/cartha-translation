base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/003.yaml
  text: Adam lived one hundred thirty years and fathered a son in his likeness[a], according to his image[c][b], and called his name Seth.
translation:
  language: zh_hans
  text: 亚当活到一百三十岁时，生了一个儿子，照着自己的样式，按着自己的形象，给他起名叫塞特[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “照着自己的样式，按着自己的形象”呼应创世记1:26—27。
    reason: cross_reference
lexical_decisions:
- source_word: וַיְחִי
  choice: 活到……岁时
  rationale: 在家谱年龄公式中，חיה 表示活到生育事件发生时的年龄；用“活到……岁时”符合现代汉语习惯。
- source_word: אָדָם
  choice: 亚当
  rationale: 此处在家谱中用作第一人的专名，而非泛指“人”。
- source_word: שְׁלֹשִׁים וּמְאַת שָׁנָה
  choice: 一百三十岁
  rationale: 准确表达希伯来文的年龄数目，并采用自然的现代汉语说法。
- source_word: וַיּוֹלֶד
  choice: 生了一个儿子
  rationale: 该词为 ילד 的使役式，主语为男性，意为生育、成为父亲；上下文由命名塞特表明所生的是一个儿子。
- source_word: בִּדְמוּתוֹ
  choice: 样式和自己相似
  rationale: דמות 表示样式或相似性；此译保留与创世记1:26的词语呼应。
- source_word: כְּצַלְמוֹ
  choice: 形像也和自己相同
  rationale: צלם 译为“形像”，כ 表示依照或相合；与前一短语并列，同时保留“样式”和“形像”的词汇区别。
- source_word: וַיִּקְרָא אֶת־שְׁמוֹ שֵׁת
  choice: 给他起名叫塞特
  rationale: 自然表达希伯来文“称他的名为塞特”的命名惯用语。
- source_word: שֵׁת
  choice: 塞特
  rationale: 采用现代中文圣经传统中通行的人名音译。
theological_decisions:
- issue: 亚当之子与亚当的样式、形像之间的关系
  choice: 直接表达儿子与亚当相似，并保留“样式”和“形像”对创世记1:26—27的呼应
  alternative: 把这句话解释为堕落后上帝形像的减损，或视为没有神学意义的单纯重复
  rationale: 经文本身没有说明这一呼应的完整神学含义，因此译文不替经文断定上帝形像是否丧失、减损或改变。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“形像”保留常见圣经术语，以显明与创世记1章的互文联系；整体避免生硬直译，也不加入经文未明说的神学结论。
