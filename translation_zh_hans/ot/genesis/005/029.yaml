source:
  edition: WLC
  text: וַ/יִּקְרָ֧א אֶת שְׁמ֛/וֹ נֹ֖חַ לֵ/אמֹ֑ר זֶ֞֠ה יְנַחֲמֵ֤/נוּ מִֽ/מַּעֲשֵׂ֨/נוּ֙ וּ/מֵ/עִצְּב֣וֹן יָדֵ֔י/נוּ מִן הָ֣/אֲדָמָ֔ה אֲשֶׁ֥ר אֵֽרְרָ֖/הּ יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/029.yaml
  text: And he called his name Noah[a], saying, “This one will comfort us from our work and from the painful toil of our hands, from the ground that Yahweh has cursed.”
translation:
  language: zh_hans
  text: 他给他起名叫挪亚[a]，说：“这孩子必安慰我们，使我们脱离因耶和华所咒诅的土地而有的劳作和双手的辛苦。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “挪亚”在希伯来文中与“安息”或“舒缓”相关的词近音；本节的“安慰”一词也与这个名字形成语音上的文字游戏。
    reason: 说明原文中挪亚之名与“安慰”动词及“安息／舒缓”联想之间无法在中文正文中完全保留的文字游戏。
lexical_decisions:
- source_word: וַיִּקְרָא אֶת־שְׁמוֹ
  choice: 他给儿子取名叫
  rationale: 这是希伯来语常见的命名公式。中文补出“儿子”，使指代自然清楚，而不改变原意。
- source_word: נֹחַ
  choice: 挪亚
  rationale: 采用现代中文圣经人名的通行译法，并以脚注保留其与后文动词之间的语音双关。
- source_word: זֶה
  choice: 这个儿子
  rationale: 保留指示代词“这个”的呈现意味；补出“儿子”符合上下文，也比单说“这个”更自然。
- source_word: יְנַחֲמֵנוּ
  choice: 必使我们……得安慰
  rationale: 动词 נחם 的直接词义是“安慰、慰藉”。此处同时与“挪亚”所带出的“安息、舒缓”之音义联想构成双关，脚注予以说明。
- source_word: מִמַּעֲשֵׂנוּ
  choice: 从劳作中
  rationale: 此处 מַעֲשֶׂה 指人的工作或劳作，而非道德意义上的行为。
- source_word: וּמֵעִצְּבוֹן יָדֵינוּ
  choice: 从双手的辛苦中
  rationale: 保留“双手”的具体意象；עִצָּבוֹן 呼应创世记3章受咒诅后的痛苦劳作，“辛苦”在现代中文中自然涵盖劳苦与痛楚。
- source_word: מִן־הָאֲדָמָה
  choice: 这一切都来自……土地
  rationale: 希伯来语介词短语的修饰关系可有一定弹性。此译使其自然地说明劳作和辛苦的来源，同时保留“来自土地”的基本表达。
- source_word: אֲשֶׁר אֵרְרָהּ יְהוָה
  choice: 耶和华所咒诅的
  rationale: 按原文关系从句修饰“土地”，并采用简体中文中神名 יהוה 的通行音译“耶和华”。
theological_decisions:
- issue: 挪亚之名与 יְנַחֲמֵנוּ 的文字游戏
  choice: 正文译作“必使我们……得安慰”，脚注说明“挪亚”又令人联想到“安息、舒缓”。
  alternative: 必使我们得舒缓；必使我们得安息
  rationale: 原文动词 נחם 通常意为“安慰”，而“挪亚”נֹחַ 在语音上又接近表示安息的词根。这里是名称的语音联想，并非严格的词源推导，故不应只保留其中一层。
- issue: מִן־הָאֲדָמָה 的连接范围
  choice: 将“来自……土地”理解为说明前述劳作与辛苦的来源。
  alternative: 把它直接接在“安慰我们脱离……”之后，译为“使我们从……土地得安慰/解脱”
  rationale: 希伯来语连续使用 מִן，可容许不同的句法归属。当前译法较符合中文表达及创世记3章土地受咒诅的背景，但不将另一种连接方式提升为教义性结论。
translation_notes:
  register: 采用庄重而清楚的现代标准普通话。“劳作”“双手的辛苦”“土地”保持创世记受咒诅土地的叙事意象；句法略作调整，以免连续介词结构在中文中生硬。
