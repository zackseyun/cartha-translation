  yaml_path: translation/ot/genesis/005/031.yaml
  text: So all the days of Lamech were seven hundred seventy-seven years[a], and he died.
translation:
  language: zh_hans
  text: 拉麦一生共活了七百七十七年[a]，就死了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文的数序直译为“七又七十年，又七百年”，合计七百七十七年。
    reason: 说明希伯来文独特的数字排列次序，同时保留正文自然的现代汉语表达。
lexical_decisions:
- source_word: וַיְהִי כָּל יְמֵי
  choice: 一生共活了
  rationale: 这是概括一个人全部寿命的固定表达。现代汉语用“一生共活了”既准确传达总寿数，也比逐字译作“所有的日子是”自然。
- source_word: לֶמֶךְ
  choice: 拉麦
  rationale: 采用现代中文圣经中通行的人名音译。
- source_word: שֶׁבַע וְשִׁבְעִים שָׁנָה וּשְׁבַע מֵאוֹת שָׁנָה
  choice: 七百七十七年
  rationale: 希伯来文按个位、十位、百位排列，合计为七百七十七年；中文按通常数序表达。
- source_word: וַיָּמֹת
  choice: 就死了
  rationale: “就”自然承接寿命总结，并保留创世记第五章反复出现的死亡结语及其庄重分量。
theological_decisions:
- issue: 创世记第五章家谱中的寿命表述
  choice: 将数字直接译为实际寿命的概括，不在正文中添加解释性限定
  alternative: 在译文中把数字处理为象征性数字
  rationale: 希伯来文本身以直接的数字陈述拉麦的寿命并记载其死亡；翻译应保留这一明示，不加入文本未说明的象征化解释。
translation_notes:
  register: 采用现代、庄重而易懂的家谱叙述语体。“一生共活了……就死了”保持本章公式化句式的节奏；正文中的[a]与脚注标记一致。
