lexical_decisions:
- source_word: וַיִּהְיוּ כָּל יְמֵי
  choice: 一生的年日共
  rationale: 这是族谱中总结一生年数的固定表达；“一生的年日共”既保留“所有日子”的希伯来语意象，也符合现代汉语表达。
- source_word: אֱנוֹשׁ
  choice: 以挪士
  rationale: 采用现代中文圣经读者较熟悉的希伯来人名音译，并与本章上下文保持一致。
- source_word: חָמֵשׁ שָׁנִים וּתְשַׁע מֵאוֹת שָׁנָה
  choice: 九百零五年
  rationale: 按现代汉语数词顺序自然表达总数905年，不机械保留原文“五年和九百年”的次序。
- source_word: וַיָּמֹת
  choice: 他就死了
  rationale: 准确传达本章反复出现的族谱结束公式；“就”自然承接前面的寿数总结，但不额外赋予因果含义。
