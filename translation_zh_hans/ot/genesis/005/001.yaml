  text: זֶ֣ה סֵ֔פֶר תּוֹלְדֹ֖ת אָדָ֑ם בְּ/י֗וֹם בְּרֹ֤א אֱלֹהִים֙ אָדָ֔ם בִּ/דְמ֥וּת אֱלֹהִ֖ים עָשָׂ֥ה אֹתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/001.yaml
  text: This is the book of the generations of Adam[a]. In the day God created man[b], he made him in the likeness of God.
translation:
  language: zh_hans
  text: 这是亚当的后代记[a]。上帝创造人[b]的时候[c]，照着上帝的样式造了他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “后代记”也可译作“家族史”或“族谱”。这里的希伯来语是《创世记》中反复出现的篇章标题用语，既可指世代或后裔，也可指关于他们的记载。
    reason: lexical_alternative
  - marker: b
    text: 此处的“人”与前面的“亚当”在希伯来语中是同一个词；前面的“亚当”是人名，此处则可泛指“人类”。
    reason: lexical_alternative
  - marker: c
    text: “……的时候”直译为“在……的日子”；这一希伯来语惯用语可表示“当……时”。
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶה סֵפֶר
  choice: 这是……记
  rationale: 以自然的现代汉语表达标题式名词句；“记”体现书面记录之意，同时避免把古代文献载体限定为现代意义的“书”。
- source_word: תּוֹלְדֹת
  choice: 后代记
  rationale: 兼顾“后代、世代”与“相关记载”两层含义，并保留其作为《创世记》结构性标题用语的功能。
- source_word: אָדָם（首次）
  choice: 亚当
  rationale: 本句引出其后的家谱，所指是具名的先祖亚当。
- source_word: בְּיוֹם בְּרֹא
  choice: 创造……的时候
  rationale: 介词短语加不定式在此表达时间关系；现代汉语用“……的时候”最自然，直译形式在脚注中保留。
- source_word: אֱלֹהִים
  choice: 上帝
  rationale: 本处搭配单数语义的动词，指独一的上帝；采用现代汉语中庄重而通行的译名。
- source_word: אָדָם（再次）
  choice: 人
  rationale: 此处回指创造叙事，作普通名词，可代表人或人类；“人”在汉语中保留个体与集合两种可能。
- source_word: בִּדְמוּת
  choice: 照着……的样式
  rationale: דְּמוּת意为样式、相似之处；译作“样式”可与“形象”所对应的另一希伯来词保持区别。
- source_word: עָשָׂה אֹתוֹ
  choice: 造了他
  rationale: עשה与前面的“创造”用词不同，故译为“造”；“他”保留原文阳性单数代词形式。
theological_decisions:
- issue: 同一节中两次אָדָם的不同语义
  choice: 首次译作人名“亚当”，再次译作普通名词“人”
  alternative: 两处都译作“亚当”，或第二处译作“人类”
  rationale: 家谱标题要求首次作专名理解；创造从句则承接创造人类的叙事。译作“人”既不把第二处误限为专名，也不排除其代表全人类的含义。
- issue: “上帝的样式”与创造叙事中“形象”用语的关系
  choice: 保留“样式”
  alternative: 译作“上帝的形象”
  rationale: 本节使用דְּמוּת而不是צֶלֶם；不将二者合并，可保留原文的词汇区别与神学张力。
- issue: 阳性单数宾语的表达
  choice: 译作“他”
  alternative: 重复译作“人”或改为“他们”
  rationale: 原文宾语为阳性单数，既指向所造的“人”，又以单数形式代表人类；“他”保留这一语法特征而不改成复数。
translation_notes:
  register: 采用现代、庄重且容易理解的标准普通话。“后代记”保留《创世记》标题用语的凝练感；正文用“……的时候”避免生硬直译，并以脚注交代希伯来语字面形式。
