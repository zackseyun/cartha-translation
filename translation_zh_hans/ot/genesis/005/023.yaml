  language: zh_hans
  text: 以诺一生的年日共三百六十五年。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: 共
  rationale: 该叙事形式在此引出家谱中的寿数总结；汉语无需另译一个系词，以“共”自然表达汇总意义。
- source_word: כָּל יְמֵי
  choice: 一生的年日
  rationale: 字面为“所有的日子”，在家谱公式中指完整寿命；“一生的年日”既保留“年日”的希伯来表达色彩，也让现代读者清楚理解其含义。
- source_word: חֲנוֹךְ
  choice: 以诺
  rationale: 采用现代中文圣经传统中通行的人名音译。
- source_word: חָמֵשׁ וְשִׁשִּׁים ... וּשְׁלֹשׁ מֵאוֹת
  choice: 三百六十五
  rationale: 原文按“六十五加三百”的次序表达；按现代汉语自然数序译为“三百六十五”。
- source_word: שָׁנָה ... שָׁנָה
  choice: 岁
  rationale: 原文在两个数值成分后分别使用“年”；现代汉语总结人的寿数时用“岁”最自然，并可将整个数值合并表达。
