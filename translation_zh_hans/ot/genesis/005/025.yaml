base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/025.yaml
  text: Methuselah lived one hundred and eighty-seven years and fathered Lamech[a].
translation:
  language: zh_hans
  text: 玛土撒拉活到一百八十七岁，生了拉麦[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“成为拉麦的父亲。”
    reason: 词义替代译法；更明确地表达希伯来语使役形在男性家谱中的父子关系。
lexical_decisions:
- source_word: וַיְחִי
  choice: 活到
  rationale: 在创世记第五章的家谱句式中，该动词引出人在生子时已经活过的年数；“活到……岁”符合现代汉语表达，也保留时间推进的含义。
- source_word: מְתוּשֶׁלַח
  choice: 玛土撒拉
  rationale: 采用现代中文圣经传统中通行且易于辨认的人名音译。
- source_word: שֶׁבַע וּשְׁמֹנִים שָׁנָה וּמְאַת שָׁנָה
  choice: 一百八十七岁
  rationale: 希伯来语按“七、八十、一百”的次序组合数字；依现代汉语习惯重排为“一百八十七岁”。
- source_word: וַיּוֹלֶד
  choice: 生了
  rationale: 使役形在家谱中表示男性生育后代，即“作了……的父亲”。正文用简洁自然的“生了”，脚注列出更形式对应的译法。
- source_word: אֶת
  choice: 不单独译出
  rationale: 这是直接宾语标记，现代汉语无需用单独词语对应，其语法功能由句序体现。
- source_word: לָמֶךְ
  choice: 拉麦
  rationale: 采用现代中文圣经传统中通行且易于辨认的人名音译。
