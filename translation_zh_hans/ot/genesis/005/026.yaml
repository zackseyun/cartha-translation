  yaml_path: translation/ot/genesis/005/026.yaml
  text: After he fathered Lamech, Methuselah lived 782 years and fathered sons and daughters.
translation:
  language: zh_hans
  text: 玛土撒拉生拉麦以后，又活了七百八十二年，并且生了儿子和女儿。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: 又活了
  rationale: 在家谱叙事中，חיה 的连续式引出指定儿子出生后的寿数；“又活了”自然表达继续存活的时段，并与“以后”衔接。
- source_word: מְתוּשֶׁלַח
  choice: 玛土撒拉
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: אַחֲרֵי הוֹלִידוֹ אֶת־לֶמֶךְ
  choice: 生拉麦以后
  rationale: אַחֲרֵי 表示时间上的“以后”；使役形 הוֹלִידוֹ 在男性家谱语境中指他使拉麦出生，中文以“生”简洁自然地表达父系生育关系。
- source_word: שְׁתַּיִם וּשְׁמוֹנִים שָׁנָה וּשְׁבַע מֵאוֹת שָׁנָה
  choice: 七百八十二年
  rationale: 希伯来文按“二又八十……又七百”排列，中文依通常数序合并为总数，不损失信息。
- source_word: וַיּוֹלֶד
  choice: 并且生了
  rationale: 保留与前一处 ילד 的词汇联系；“并且”承接家谱叙事中的连续动作。
- source_word: בָּנִים וּבָנוֹת
  choice: 儿子和女儿
  rationale: 原文明确分别提到男性与女性后代，不泛化为“儿女”或“孩子”。
