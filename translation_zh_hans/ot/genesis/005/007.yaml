  text: After he fathered Enosh, Seth lived eight hundred and seven years and fathered sons and daughters.
translation:
  language: zh_hans
  text: 塞特生了以挪士以后，又活了八百零七年，并且生了儿子和女儿。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: 又活了
  rationale: 在家谱公式中表示某一事件之后继续存活的年数；“又活了”自然体现这段延续时间。
- source_word: אֲחֲרֵי הוֹלִידוֹ אֶת אֱנוֹשׁ
  choice: 生以挪士以后
  rationale: 保留明确的时间关系、男性家谱语境和直接宾语专名，同时采用自然的现代汉语表达。
- source_word: אֱנוֹשׁ
  choice: 以挪士
  rationale: 采用中文圣经传统中通行且易于识别的人名音译。
- source_word: שֶׁבַע שָׁנִים וּשְׁמֹנֶה מֵאוֹת שָׁנָה
  choice: 八百零七年
  rationale: 希伯来文先列个位数再列百位数；中文按自然数序表达同一总数。
- source_word: וַיּוֹלֶד
  choice: 并且生了
  rationale: 延续家谱中的生育意义；“生了”比“生养了”更直接对应 ילד 的使役形，同时避免古雅的“生了……众子女”。
- source_word: בָּנִים וּבָנוֹת
  choice: 儿子和女儿
  rationale: 明确保留原文分别提到男性与女性后代的措辞，不概括为“儿女”或“孩子”。
