base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/024.yaml
  text: Enoch walked with God[a], and he was no more, because God took him.
translation:
  language: zh_hans
  text: 以诺与上帝同行；他不在了[a]，因为上帝把他带走了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他不见了。”希伯来文直译为“他不在”。
    reason: 说明希伯来语惯用表达的字面形式及可接受的译法，同时保留以诺不再出现的含义。
lexical_decisions:
- source_word: וַיִּתְהַלֵּךְ
  choice: 同行
  rationale: התהלך在此表示持续的生活方式或行事为人；与介词短语连用时，译作“与……同行”既保留希伯来语“行走”的意象，也自然传达持续与上帝相伴而行的含义。
- source_word: אֶת הָאֱלֹהִים
  choice: 与上帝
  rationale: אֶת在הלך的这一结构中表示陪伴关系，因此译作“与上帝”，而不译作“在上帝面前”。
- source_word: וְאֵינֶנּוּ
  choice: 他不在了
  rationale: 原文直陈“他不在”，所表达的是以诺已不再在那里。“不在了”在现代汉语中自然，也避免擅自说明他如何离去。
- source_word: כִּי
  choice: 因为
  rationale: 这里引出以诺不在的原因；“因为”清楚表达原文的因果关系。
- source_word: לָקַח אֹתוֹ
  choice: 把他取去了
  rationale: לקח的基本义是“拿、取、带走”。“取去”保留原文简洁而含蓄的措辞，不增添“升天”或“不死”等原文未明说的内容。
- source_word: אֱלֹהִים
  choice: 上帝
  rationale: 在本叙事语境中指独一的神；“上帝”是现代标准汉语中庄重、通行的对应词。
theological_decisions:
- issue: 是否明确说明以诺没有死，或被接到天上
  choice: 保留原文含蓄的说法：“他不在了……上帝把他取去了。”
  alternative: 译作“他没有死”“上帝把他接到天上”或“上帝将他迁去”
  rationale: 本节明显描述上帝以非同寻常的方式使以诺离开，但希伯来文本身没有明说“到天上”，也没有在本节直接说“没有死”。保留简洁措辞，可维持原文的神学张力，不把后来的经文解释提前写入正文。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“与上帝同行”保留圣经原文的核心意象；分号呈现原句两个紧密相连的陈述。“取去了”略带经文语体色彩，但在现代汉语中仍清楚可懂，并能保持原文的克制。
