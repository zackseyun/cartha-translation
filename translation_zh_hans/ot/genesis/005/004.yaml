base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/004.yaml
  text: After he fathered Seth[a], Adam lived eight hundred years and fathered sons and daughters.
translation:
  language: zh_hans
  text: 亚当生塞特以后[a]，又活了八百年，并且生了儿子和女儿。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译：“亚当生塞特以后，亚当的日子是八百年。”
    reason: 说明原文以“某人的日子是……”表达其又活了多久。
lexical_decisions:
- source_word: וַיִּהְיוּ יְמֵי אָדָם
  choice: 亚当……又活了
  rationale: 希伯来文形式上是“亚当的日子是……”，这是表达寿命时长的惯用说法；译为“又活了”符合现代汉语，并准确传达其含义。
- source_word: אָדָם
  choice: 亚当
  rationale: 在本段家谱中，此词是个人名字，不是泛指“人”或“人类”。
- source_word: אַחֲרֵי
  choice: 以后
  rationale: 表达一个事件之后的时间关系，与前面的分句自然衔接。
- source_word: הוֹלִידוֹ
  choice: 生塞特
  rationale: 使役形态在家谱语境中表示男性生育后代；汉语以“生”自然表达，不必使用较古雅的“生了……为子”。
- source_word: אֶת שֵׁת
  choice: 塞特
  rationale: אֶת是直接宾语标记，无须另译；שֵׁת按人名音译为“塞特”。
- source_word: שְׁמֹנֶה מֵאֹת שָׁנָה
  choice: 八百年
  rationale: 直接表达年数和持续时间。
- source_word: וַיּוֹלֶד
  choice: 并且生了
  rationale: 与前面的同一词根相呼应，保留家谱中的生育含义，同时使用自然的现代汉语。
- source_word: בָּנִים וּבָנוֹת
  choice: 儿子和女儿
  rationale: 原文明确分别提到男性与女性后代，不笼统译作“儿女”或“孩子”。
theological_decisions:
- issue: אָדָם在本节中的所指
  choice: 作为个人名字译为“亚当”
  alternative: 译为“人”或“人类”
  rationale: 家谱上下文指向名为亚当的具体人物；译作泛称会模糊本节的个人所指。
translation_notes:
  register: 采用清楚、庄重的现代标准汉语。“又活了”自然呈现希伯来语寿命表达；“儿子和女儿”保留原文明确列举两类后代的措辞。
