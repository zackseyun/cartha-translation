  text: So all the days of Yered were nine hundred and sixty-two years[a], and he died.
translation:
  language: zh_hans
  text: 耶列德[a]一生的年日共计九百六十二年；他死了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语作“耶列德”；传统中文译本多译作“雅列”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ כָּל יְמֵי
  choice: 一生的年日共
  rationale: 这是家谱中总结寿数的固定表达；“一生的年日”保留希伯来语“所有日子”的措辞，“共”则自然表达总计之意。
- source_word: יֶרֶד
  choice: 耶列德
  rationale: 按希伯来语 Yered 的读音音译，比传统译名“雅列”更直接反映原文形式。
- source_word: שְׁתַּיִם וְשִׁשִּׁים שָׁנָה וּתְשַׁע מֵאוֹת שָׁנָה
  choice: 九百六十二岁
  rationale: 依现代汉语数词顺序合并表达总寿数，并以“岁”自然表示年龄。
- source_word: וַיָּמֹת
  choice: 他就死了
  rationale: 保留《创世记》第5章反复出现的死亡总结公式；“就”自然承接前面的寿数总结。
