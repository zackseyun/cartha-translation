  text: וַ/יִּתְהַלֵּ֨ךְ חֲנ֜וֹךְ אֶת הָֽ/אֱלֹהִ֗ים אַֽחֲרֵי֙ הוֹלִיד֣/וֹ אֶת מְתוּשֶׁ֔לַח שְׁלֹ֥שׁ מֵא֖וֹת שָׁנָ֑ה וַ/יּ֥וֹלֶד בָּנִ֖ים וּ/בָנֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/022.yaml
  text: Enoch walked with God three hundred years after he fathered Methuselah[b][a], and he fathered sons and daughters.
translation:
  language: zh_hans
  text: 以诺生玛土撒拉以后，与神同行[a]三百年，又生了儿子和女儿。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可理解为“与神相交而生活”。原文直译为“与神同行”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְהַלֵּךְ
  choice: 同行
  rationale: התהלך的Hitpael形式在这里描述持续的生活方式；与后面的אֶת הָאֱלֹהִים合成关系性的习语。译作“与神同行”既保留原文“行走”的隐喻，也符合现代汉语的庄重表达。
- source_word: אֶת הָאֱלֹהִים
  choice: 与神
  rationale: 此处אֶת在“同行”习语中表达相伴关系；אֱלֹהִים在这里指神，汉语不需译出定冠词。
- source_word: אַחֲרֵי הוֹלִידוֹ אֶת מְתוּשֶׁלַח
  choice: 生玛土撒拉以后
  rationale: אַחֲרֵי明确表示时间先后；הוֹלִידוֹ是使役词干，指以诺成为玛土撒拉的父亲。汉语以“生……以后”自然表达。
- source_word: מְתוּשֶׁלַח
  choice: 玛土撒拉
  rationale: 采用现代中文圣经传统中通行的人名音译。
- source_word: שְׁלֹשׁ מֵאוֹת שָׁנָה
  choice: 三百年
  rationale: 直接对应原文数词短语；按希伯来语句法，这是以诺与神同行的时长。
- source_word: וַיּוֹלֶד בָּנִים וּבָנוֹת
  choice: 又生了儿子和女儿
  rationale: 保留原文明确列出的男性和女性后代；“又”自然承接前面玛土撒拉的出生，并体现וַ的叙事连接作用。
theological_decisions:
- issue: “与神同行”所表达的以诺与神之关系
  choice: 正文保留“与神同行”的关系性隐喻
  alternative: 与神相交而生活；在神面前忠信度日
  rationale: 原文的表达既涉及生活方式，也带有亲近神的关系意味。保留隐喻可维持其神学张力和丰富性，避免把它限定为某一种解释。
translation_notes:
  register: 采用现代、庄重而通顺的叙事语言。语序明确表明“三百年”修饰“与神同行”，避免误解为生玛土撒拉所经历的时间。
