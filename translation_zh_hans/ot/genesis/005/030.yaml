  yaml_path: translation/ot/genesis/005/030.yaml
  text: And Lamech lived five hundred and ninety-five years after he fathered Noah[a], and he fathered sons and daughters.
translation:
  language: zh_hans
  text: 拉麦生挪亚以后，又活了五百九十五年，并且生了儿子和女儿。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: 又活了
  rationale: 在《创世记》第5章的家谱套语中，חיה表示某一事件之后继续生活的年数；“又活了”自然呈现这段延续的寿命。
- source_word: אַחֲרֵי הוֹלִידוֹ אֶת־נֹחַ
  choice: 生挪亚以后
  rationale: אַחֲרֵי明确表示时间上的“以后”；הוליד在使役形中指男性生育、成为父亲。汉语家谱语境用“生挪亚”简洁自然，并保留父系叙述角度。
- source_word: חָמֵשׁ וְתִשְׁעִים שָׁנָה וַחֲמֵשׁ מֵאוֹת שָׁנָה
  choice: 五百九十五年
  rationale: 希伯来文按九十五加五百的次序表达；现代汉语按常规数词顺序合并为“五百九十五年”，数值不变。
- source_word: וַיּוֹלֶד
  choice: 并且生了
  rationale: 该动词同样是ילד的使役形，表示拉麦后来又成为其他子女的父亲；“并且生了”承接前句自然，也保留生育含义。
- source_word: בָּנִים וּבָנוֹת
  choice: 儿子和女儿
  rationale: 原文分别明说男性与女性后代，因此不概括为较宽泛的“儿女”或“孩子”。
theological_decisions: []
