  text: So all the days of Adam that he lived were nine hundred and thirty years[a], and he died.
translation:
  language: zh_hans
  text: 亚当的年日共九百三十年[a]，他死了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语“亚当”在某些语境中可指“人”或“人类”，但这里在家谱中指名为亚当的个人。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ כָּל יְמֵי
  choice: 一生的日子共
  rationale: 保留希伯来文以“日子”概括寿命的家谱套语，同时用“一生……共”使现代汉语自然清楚。
- source_word: אָדָם
  choice: 亚当
  rationale: 本节位于家谱中，所指是名为亚当的个人，而不是泛指“人”或“人类”。
- source_word: אֲשֶׁר חַי
  choice: 一生
  rationale: 该关系从句直译为“他所活的”在汉语中生硬；合入“一生的日子”准确表达其限定作用。
- source_word: תְּשַׁע מֵאוֹת שָׁנָה וּשְׁלֹשִׁים שָׁנָה
  choice: 九百三十年
  rationale: 按希伯来文完整表达岁数，并采用适合庄重叙事的中文数字写法。
- source_word: וַיָּמֹת
  choice: 他就死了
  rationale: “就”自然承接寿命总数与死亡结语，又保留本章反复出现、简短而沉重的死亡公式。
theological_decisions:
- issue: אָדָם的身份
  choice: 译作个人名“亚当”
  alternative: 译作“人”或“人类”
  rationale: 家谱语境明确指向这位具名人物；泛称会模糊家谱关系。脚注仍提示该词在其他语境中的词义范围。
- issue: 死亡公式的保留
  choice: “他就死了”
  alternative: “他便离世了”
  rationale: 采用直接的“死”对应וַיָּמֹת，不以委婉语削弱本章反复强调的人必死亡这一主题。
translation_notes:
  register: 采用现代、庄重而易懂的家谱叙述语体；保留“日子”的希伯来表达特色，并让句法符合自然汉语。
