base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/013.yaml
  text: And Kenan lived eight hundred and forty years after he fathered Mahalalel[b][a], and he fathered sons and daughters.
translation:
  language: zh_hans
  text: 该南生玛勒列以后，又活了八百四十年，并且生了儿子和女儿。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: 又活了
  rationale: 在创世记家谱公式中表示某人生育所列儿子之后继续存活的年数；“又活了”自然承接前节。
- source_word: קֵינָן
  choice: 该南
  rationale: 采用现代中文圣经中较通行、且以希伯来文本为依据的人名译法。
- source_word: אַחֲרֵי הוֹלִידוֹ אֶת מַהֲלַלְאֵל
  choice: 生玛勒列以后
  rationale: 准确表达时间关系；希伯来语使役式在男性主语下指生育后代，中文“生”简明自然，无须使用古雅的“生了……为儿子”。
- source_word: אַרְבָּעִים שָׁנָה וּשְׁמֹנֶה מֵאוֹת שָׁנָה
  choice: 八百四十年
  rationale: 按现代中文数词顺序合并表达总数，完整保留原文数值。
- source_word: וַיּוֹלֶד
  choice: 并且生了
  rationale: 保留原文重复使用 ילד 的生育含义，并以“并且”连接后续家谱信息。
- source_word: בָּנִים וּבָנוֹת
  choice: 儿子和女儿
  rationale: 原文明确分别提到男性与女性后代，不泛化为“儿女”或“孩子”。
