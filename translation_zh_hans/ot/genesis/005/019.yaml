base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/019.yaml
  text: And Yered lived eight hundred years after he fathered Hanokh[a], and he fathered sons and daughters.
translation:
  language: zh_hans
  text: 耶列德生了哈诺赫[a]以后，又活了八百年，还生了儿子和女儿。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “耶列德”和“哈诺赫”的传统中文译名是“雅列”和“以诺”。
    reason: 说明按希伯来语音译的名字与读者熟悉的传统中文形式之间的对应关系。
lexical_decisions:
- source_word: וַיְחִי
  choice: 又活了
  rationale: 在家谱公式中，חיה表示在所述事件之后继续存活的年数；“又活了”自然传达这一延续时段。
- source_word: יֶרֶד
  choice: 耶列德
  rationale: 按希伯来语形式作普通话音译，比传统译名“雅列”更直接反映原名。
- source_word: אַחֲרֵי
  choice: 以后
  rationale: 准确表达以哈诺赫出生为起点的后续时期，也符合现代汉语叙述习惯。
- source_word: הוֹלִידוֹ
  choice: 生了
  rationale: 使役词干的 ילד 在父系家谱中指男子使孩子出生，即成为其父；汉语用“生了”简洁自然，主语已明确为男性。
- source_word: אֶת חֲנוֹךְ
  choice: 哈诺赫
  rationale: 按希伯来语 חֲנוֹךְ 的读音音译，保留末尾喉音的近似表达。
- source_word: שְׁמֹנֶה מֵאוֹת שָׁנָה
  choice: 八百年
  rationale: 直接、自然地表达原文的年数和持续时间。
- source_word: וַיּוֹלֶד
  choice: 还生了
  rationale: “还”连接哈诺赫以外后续出生的子女；“生了”保持家谱公式简洁，同时不弱化父亲身份。
- source_word: בָּנִים וּבָנוֹת
  choice: 儿子和女儿
  rationale: 保留原文分别明说男性与女性后代的表达，而不概括为“孩子”。
theological_decisions: []
