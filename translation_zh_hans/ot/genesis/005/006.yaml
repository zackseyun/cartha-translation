  language: zh_hans
  text: 塞特活到一百零五岁，生了以挪士[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较为明确地译作：“作了以挪士的父亲。”
    reason: 说明家谱语境中“生了”指父亲生育后代，而非母亲分娩。
lexical_decisions:
- source_word: וַיְחִי
  choice: 活到
  rationale: 在家谱年龄公式中，חיה表示一个人活到所述年龄，随后发生下一件家谱事件；“活到”符合现代汉语表达。
- source_word: שֵׁת
  choice: 塞特
  rationale: 采用现代中文圣经中通行、易识别的希伯来人名译法。
- source_word: חָמֵשׁ שָׁנִים וּמְאַת שָׁנָה
  choice: 一百零五岁
  rationale: 希伯来语字面次序为“五年和一百年”，实际表示一百零五岁；按现代汉语数词习惯表达。
- source_word: וַיּוֹלֶד
  choice: 生了
  rationale: ילד的使役式在家谱中指男子生育后代，即成为某人的父亲；“生了”简洁自然，并保留家谱用语的直接性。
- source_word: אֶת אֱנוֹשׁ
  choice: 以挪士
  rationale: 宾格标记אֶת不另行翻译；人名采用与希伯来语אֱנוֹשׁ相对应的通行中文译名。
