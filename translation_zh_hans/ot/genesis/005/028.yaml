  text: And Lamech lived one hundred and eighty-two years, and fathered a son.
translation:
  language: zh_hans
  text: 拉麦活到一百八十二岁，生了一个儿子。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: 活到
  rationale: 在家谱句式中，此词引出下一事件发生前所度过的年数；现代汉语用“活到……岁”自然、准确。
- source_word: לֶמֶךְ
  choice: 拉麦
  rationale: 采用现代中文圣经中通行的人名音译。
- source_word: שְׁתַּיִם וּשְׁמֹנִים שָׁנָה וּמְאַת שָׁנָה
  choice: 一百八十二岁
  rationale: 按现代汉语的标准数字次序表达希伯来语“一百加八十二年”的数词结构。
- source_word: וַיּוֹלֶד
  choice: 生了
  rationale: 使役词干以男性为主语时表示生育、成为父亲；“生了”符合现代汉语家谱叙述，简洁自然。
- source_word: בֵּן
  choice: 一个儿子
  rationale: 原文指“儿子”，本节尚未提名；“一个”自然表达其不定性。
