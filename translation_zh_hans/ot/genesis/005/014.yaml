  text: וַ/יִּֽהְיוּ֙ כָּל יְמֵ֣י קֵינָ֔ן עֶ֣שֶׂר שָׁנִ֔ים וּ/תְשַׁ֥ע מֵא֖וֹת שָׁנָ֑ה וַ/יָּמֹֽת־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/014.yaml
  text: So all the days of Kenan were nine hundred and ten years[b][a], and he died.
translation:
  language: zh_hans
  text: 基南[a]一生的年日[b]共有九百一十年，他就死了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这个名字按希伯来语音译为“基南”；传统译本也常译作“该南”。
    reason: alternative_reading
  - marker: b
    text: 原文直译为“基南所有的日子”，这是家谱中反复出现的说法，指他一生的全部年日。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: 共有
  rationale: 该形式承接并推进家谱叙述；用“共有”自然引出寿数总计，同时保留总结意味。
- source_word: כָּל יְמֵי
  choice: 一生的年日
  rationale: 原文直译为“所有……的日子”，在本章反复出现的家谱公式中指完整寿命；译文兼顾原文措辞和现代汉语可懂度。
- source_word: קֵינָן
  choice: 基南
  rationale: 按希伯来语 Kênān 的读音直接音译，避免依从受其他语言传统影响的旧译形式。
- source_word: עֶשֶׂר שָׁנִים וּתְשַׁע מֵאוֹת שָׁנָה
  choice: 九百一十年
  rationale: 按现代汉语习惯调整希伯来语数字“十年和九百年”的排列，并统一量词表达。
- source_word: וַיָּמֹת
  choice: 他就死了
  rationale: 直接保留本章家谱段落反复出现的结语；“就”自然表达叙事承接，不额外解释死亡的原因或性质。
theological_decisions: []
