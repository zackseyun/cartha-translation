  rationale: 调整首句语序，使“男和女”直接对应上帝的创造行动；将命名表达改为“称他们为‘人’”，以庄重自然的现代汉语呈现二人共用一个集合名称。脚注保留原有的词义歧义，未将其决断为专名。
