base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/002.yaml
  text: Male and female he created them[a], and he blessed them and called their name Man on the day they were created.
translation:
  language: zh_hans
  text: 男和女，他创造了他们；他赐福给他们，并在他们受造的日子称他们为“人”[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文为“亚当”（אָדָם）；这个词可统称“人”或“人类”，也可用作人名“亚当”。
    reason: 保留该希伯来词在集合名词与专名之间的双重可能。
lexical_decisions:
- source_word: זָכָר וּנְקֵבָה
  choice: 有男有女
  rationale: 这两个名词分别指男性与女性。译作“有男有女”既保留成对的性别表达，也比生硬的“男性和女性”更符合现代汉语叙事。
- source_word: בְּרָאָם
  choice: 他创造他们
  rationale: ברא的Qal完成式带第三人称阳性复数后缀，指上帝创造二人；用一般过去叙事表达其完成的行动。
- source_word: וַיְבָרֶךְ אֹתָם
  choice: 又赐福给他们
  rationale: “赐福”是ברך在上帝施福语境中的准确、自然表达；“又”承接前一行动。
- source_word: וַיִּקְרָא אֶת־שְׁמָם
  choice: 给他们起名叫
  rationale: 希伯来文直译为“称他们的名”，其中“名”为单数、所指为复数。现代汉语“给他们起名叫”自然地保留二人共用一个名称的含义。
- source_word: אָדָם
  choice: 人
  rationale: 本节所命名的对象包括男性与女性，因此此处首先是集合意义的“人／人类”。选用单数形式“人”，保留希伯来词的集合性及其与专名“亚当”相同所形成的含混。
- source_word: בְּיוֹם הִבָּרְאָם
  choice: 在他们受造的日子
  rationale: 保留בְּיוֹם的“在……的日子”这一时间框架，并以被动式“受造”反映הִבָּרְאָם的Niphal语态。
theological_decisions:
- issue: אָדָם在对男女二人的集合命名语境中的译法
  choice: 人
  alternative: 亚当；人类
  rationale: 直接宾语“他们”包括男性与女性，表明这里是给二人一个共同名称；故正文采用集合意义的“人”。不过，希伯来文形式与专名“亚当”完全相同，而本章家谱也以该词指亚当本人，因此用脚注保留这一真实的词义张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“有男有女”保持性别配对；“给他们起名叫‘人’”避免生硬直译，同时保留二人共用一个集合名称的重点。
