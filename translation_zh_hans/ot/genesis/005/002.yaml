  source_fidelity: 草稿准确传达了上帝创造男女、赐福并以共同名称称呼他们的主要意思，也恰当地以脚注保留אָדָם的集合义与专名义。不过，正文将“男和女”后置为“他创造他们，有男有女”，弱化了希伯来文句首成对陈述及其与“创造”的直接关系；宜改为“男和女，他创造了他们”。
  naturalness: “有男有女”虽自然，却在此句中容易读成对已被创造之人的补充说明，而不是“创造为男、为女”的内容。“称他们为‘人’”较“给他们起名叫‘人’”更简洁庄重，并能自然表达共同称名。
  terminology: “赐福”“受造”均合适。将אָדָם译为“人”能保留本节对男女共同的集合称谓，不应在正文改作仅指男性个人的“亚当”。脚注适当说明其亦可作专名。
