  text: 塞特一生的年日共计九百一十二年，他就死了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ כָּל יְמֵי
  choice: 一生的年日共
  rationale: 这是家谱中总结一生年数的固定表达。“一生的年日”保留原文“所有日子”的措辞特点，“共”自然表达总计之意。
- source_word: שֵׁת
  choice: 塞特
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: שְׁתֵּים עֶשְׂרֵה שָׁנָה וּתְשַׁע מֵאוֹת שָׁנָה
  choice: 九百一十二岁
  rationale: 原文按“十二年和九百年”的次序表达总数；中文依自然数序译为“九百一十二岁”，总数不变。
- source_word: וַיָּמֹת
  choice: 随后他死了
  rationale: 保留家谱反复出现的庄严收束语；“随后”体现叙事连接，同时避免中文中连续使用“共……，他就……”可能产生的突兀感。
