lexical_decisions:
- source_word: וַיִּהְיוּ כָּל יְמֵי
  choice: 一生的年日共
  rationale: 保留希伯来文“所有日子”的族谱套语，同时用“共”自然表达寿数总计，避免生硬直译。
- source_word: מַהֲלַלְאֵל
  choice: 玛勒列
  rationale: 采用现代中文圣经中通行且易于辨认的人名音译。
- source_word: חָמֵשׁ וְתִשְׁעִים שָׁנָה וּשְׁמֹנֶה מֵאוֹת שָׁנָה
  choice: 八百九十五岁
  rationale: 按现代汉语数词次序合并表达总年龄；“岁”自然传达此处计算寿命的“年”。
- source_word: וַיָּמֹת
  choice: 后来他死了
  rationale: 准确保留死亡结语；“后来”承接总寿数之后的叙事次序，也维持本章反复出现的庄重节奏。
