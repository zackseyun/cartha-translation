base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/009.yaml
  text: Enosh lived ninety years and fathered Kenan[a][b].
translation:
  language: zh_hans
  text: 以挪士活到九十岁，生了该南[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “该南”音译自希伯来文קֵינָן；请勿与该隐混淆。
    reason: name_clarification
lexical_decisions:
- source_word: וַיְחִי
  choice: 活到
  rationale: 在族谱的年龄公式中，חיה表示某人活到所述年龄；“活到九十岁”符合现代汉语表达。
- source_word: אֱנוֹשׁ
  choice: 以挪士
  rationale: 采用现代中文圣经中通行且可辨识的希伯来人名译法。
- source_word: תִּשְׁעִים שָׁנָה
  choice: 九十岁
  rationale: 希伯来语直陈“九十年”，中文叙述年龄自然表达为“九十岁”。
- source_word: וַיּוֹלֶד
  choice: 生了
  rationale: ילד的使役形在男性为主语的族谱公式中表示生育后代；中文“生了”简洁自然，也不额外断定该儿子是否为其九十岁时所生的全部子女中的唯一一个。
- source_word: אֶת
  choice: 不单独翻译
  rationale: 这是直接宾语标记，在中文中由语序体现，无须另译。
- source_word: קֵינָן
  choice: 该南
  rationale: 采用中文圣经传统上对希伯来名קֵינָן的通行音译；此名不同于前文的该隐。
