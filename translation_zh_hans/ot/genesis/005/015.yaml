  text: 玛勒列活到六十五岁，生了雅列。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: 活到
  rationale: 在创世记家谱公式中，חיה 的叙事形式说明生育下一代之前所度过的年数；“活到六十五岁”符合现代汉语表达，也保留时间推进的含义。
- source_word: מַהֲלַלְאֵל
  choice: 玛勒列
  rationale: 人名按现代中文圣经中通行的音译处理，不翻译其可能的词源意义。
- source_word: חָמֵשׁ שָׁנִים וְשִׁשִּׁים שָׁנָה
  choice: 六十五岁
  rationale: 希伯来语字面次序为“五年又六十年”；中文按自然数序表达为“六十五岁”，数值不变。
- source_word: וַיּוֹלֶד
  choice: 生了
  rationale: ילד 的使役形在男性家谱语境中指生育或成为父亲；“生了”是简洁、自然且庄重的现代中文家谱用语。
- source_word: אֶת יָרֶד
  choice: 雅列
  rationale: אֶת 是直接宾语标记，中文无需另译；יָרֶד 按通行中文形式音译为“雅列”。
