base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/009.yaml
  text: So the servant put his hand under the thigh of Abraham his master and swore to him concerning this matter[a].
translation:
  language: zh_hans
  text: 于是，仆人把手放在他主人亚伯拉罕的大腿底下[a]，为这件事向他起誓。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “把手放在……大腿底下”直译自希伯来文，是郑重起誓时的一种动作；有人认为这动作象征性地与腰部或圣约的后裔有关。
    reason: 文化背景说明
lexical_decisions:
- source_word: הָעֶבֶד
  choice: 仆人
  rationale: עֶבֶד 可指仆人或奴仆；本段着重其在亚伯拉罕家中的受托身份，译作“仆人”自然且保留主从关系。
- source_word: וַיָּשֶׂם ... אֶת יָדוֹ
  choice: 把手放在
  rationale: שׂוּם 的基本义为“放、安放”；“把手放在”符合现代汉语表达，并忠实呈现动作。
- source_word: תַּחַת יֶרֶךְ
  choice: 大腿底下
  rationale: יָרֵךְ 的具体词义是“大腿”；正文保留直译，不把可能涉及腰部、后裔或圣约的象征解释写入正文。
- source_word: אַבְרָהָם אֲדֹנָיו
  choice: 他主人亚伯拉罕
  rationale: אֲדוֹן 在此指人间家主，“主人”准确表达其权柄，也避免与对上帝的称谓混淆；按自然汉语调整语序。
- source_word: וַיִּשָּׁבַע לוֹ
  choice: 向他起誓
  rationale: שׁבע 的尼法勒词干表示“起誓”；“向他”保留 לוֹ 所标明的对象，表达庄重而自然。
- source_word: עַל הַדָּבָר הַזֶּה
  choice: 为这件事
  rationale: דָּבָר 在这里指亚伯拉罕刚才交代的事项；“为这件事”简明地表达起誓所关乎的内容。
theological_decisions:
- issue: 誓约动作应直译还是解释其象征意义
  choice: 正文直译为“把手放在……大腿底下”，另以脚注说明这是郑重起誓的动作。
  alternative: 解释性地译成与腰部、生殖部位、圣约后裔有关的动作。
  rationale: 希伯来文本只陈述具体动作，并未明说其象征含义；直译可保留原文的含混与神学张力，避免在正文中采纳某一种解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“于是”承接前文叙事；保留具体身体动作，并用脚注提供必要的文化说明。
