  text: וַ/יֹּ֤אמֶר אֲלֵ/הֶם֙ אַל תְּאַחֲר֣וּ אֹתִ֔/י וַֽ/יהוָ֖ה הִצְלִ֣יחַ דַּרְכִּ֑/י שַׁלְּח֕וּ/נִי וְ/אֵלְכָ֖ה לַֽ/אדֹנִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/056.yaml
  text: But he said to them[a], “Do not delay me, since Yahweh has made my journey successful. Send me away so that I may go to my master.”
translation:
  language: zh_hans
  text: 他对他们说：“不要留住我；雅威既已使我此行顺利，就请让我走，好到我主人那里去。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵהֶם
  choice: 他对他们说
  rationale: 叙事中的 waw-consecutive 推进情节；中文无需另加“但是”，上下文中的转折已可自然领会。
- source_word: אַל תְּאַחֲרוּ אֹתִי
  choice: 不要耽搁我
  rationale: אַל 加未完成式表达禁止；אחר 的使役词干在此表示使人迟延、耽搁。
- source_word: וַיהוָה
  choice: 雅威
  rationale: 直接音译四字神名 יהוה，以保留经文所用的专名。
- source_word: הִצְלִיחַ דַּרְכִּי
  choice: 已经使我的路顺利
  rationale: הִצְלִיחַ 是使役式，保留雅威使事情成功的主动因果；דַּרְכִּי 直译为“我的路”，在语境中兼指旅程和使命，保留原文的表达幅度。
- source_word: שַׁלְּחוּנִי
  choice: 就让我走
  rationale: Piel 命令式在此请求家人放行；现代汉语用“让我走”比字面的“送我走”自然，也符合离开的语境。
- source_word: וְאֵלְכָה לַאדֹנִי
  choice: 好回到我主人那里去
  rationale: 愿望式表达随后的意愿或目的；上下文表明仆人要回到主人那里，因此用“回到”自然呈现方向，而“主人”清楚指人间的主人亚伯拉罕。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华／上主
  rationale: 原文直接使用四字神名，音译“雅威”可明确保留其专名性质，不将其改作称号。
- issue: 雅威使“我的路”顺利的含义
  choice: 保留“使我的路顺利”
  alternative: 使我的旅程／使命成功
  rationale: “路”在希伯来语中可涵盖所走的旅程及所办的使命；直译能够保留这种真实的语义宽度，同时中文也可自然理解。
translation_notes:
  register: 采用现代、庄重而口语可懂的叙事表达。“耽搁我”“让我走”符合人物对话；保留“我的路”以贴近原文并维持旅程与使命之间的语义张力。
