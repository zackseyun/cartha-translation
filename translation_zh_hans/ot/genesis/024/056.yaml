  rationale: 修改“回到”为“到”，避免补入原文未表达的“返回”意义；将“我的路顺利”调整为“我此行顺利”，使中文自然且忠实反映旅程／使命的语境含义；以“不要留住我”自然表达禁止对方扣留或延误他。其余核心术语和句法关系均予保留。
