base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/013.yaml
  text: Look[a], I am standing by the spring of water[c][b], and the daughters of the men of the city are coming out to draw water.
translation:
  language: zh_hans
  text: 看哪，我正站在泉边[a]，城中人的女儿们[b]正出来打水。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “泉”也可译作“泉源”。希伯来语 עֵין הַמָּיִם 指水源或泉，并非通常表示“井”的词。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语直译为“城中男子的女儿们”，在这里指城中的年轻女子。
    reason: lexical_clarification
lexical_decisions:
- source_word: הִנֵּה
  choice: 看哪
  rationale: 这是引人注意现场情景的指示词；“看哪”既保留原文的鲜明语气，也符合庄重的现代中文表达。
- source_word: אָנֹכִי נִצָּב
  choice: 我正站
  rationale: 独立人称代词明确指出说话者，尼法勒分词表示当下持续的站立状态；“我正站”自然传达此意。
- source_word: עַל עֵין הַמָּיִם
  choice: 在水泉旁
  rationale: עַל 在此表示位于水源近旁；עֵין הַמָּיִם 指泉源而非通常所说的井。“水泉”既体现水源性质，也保留原文较具体的表达。
- source_word: בְנוֹת אַנְשֵׁי הָעִיר
  choice: 城中人的女儿们
  rationale: 原文直指“城中人的女儿们”，是以家庭和社会关系称呼城中年轻女子的表达；正文保留这一形式，并用脚注说明其自然含义。
- source_word: יֹצְאֹת
  choice: 正出来
  rationale: 阴性复数分词表示正在发生的动作；从站在水泉旁之人的视角，用“正出来”贴合场景。
- source_word: לִשְׁאֹב מָיִם
  choice: 打水
  rationale: 这是现代汉语表示从泉井等水源汲取水的自然说法，准确简洁。
theological_decisions: []
translation_notes:
  register: 采用庄重而易懂的现代标准普通话。“看哪”保留叙事中的现场感；“城中人的女儿们”略带原文色彩，但仍可理解，并借脚注交代其社会性含义。
