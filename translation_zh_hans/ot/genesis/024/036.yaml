  text: וַ/תֵּ֡לֶד שָׂרָה֩ אֵ֨שֶׁת אֲדֹנִ֥/י בֵן֙ לַֽ/אדֹנִ֔/י אַחֲרֵ֖י זִקְנָתָ֑/הּ וַ/יִּתֶּן לּ֖/וֹ אֶת כָּל אֲשֶׁר לֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/036.yaml
  text: And Sarah[a], my master's wife, bore a son to my master after her old age, and he gave him all that he had.
translation:
  language: zh_hans
  text: 我主人的妻子撒拉年老以后[a]，给我主人生了一个儿子；我主人把自己所有的一切都给了他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“年老时”；原文直译为“在她的老年之后”。
    reason: 原短语 אַחֲרֵי זִקְנָתָהּ 的字面结构与惯用时间含义之间存在表达差异，脚注保留较自然的另一译法及字面形式。
lexical_decisions:
- source_word: וַתֵּלֶד
  choice: 生了
  rationale: 这是 ילד 的 Qal 叙事形式，表示生育；“生了”简洁、自然，符合现代汉语叙事表达。
- source_word: אֵשֶׁת אֲדֹנִי
  choice: 我主人的妻子
  rationale: 保留原文的领属结构和仆人对亚伯拉罕的敬称。
- source_word: בֵן
  choice: 一个儿子
  rationale: 希伯来语此处无冠词；“一个儿子”符合汉语出生叙事，也不必在正文中补出“以撒”。
- source_word: לַאדֹנִי
  choice: 给我主人
  rationale: 介词 ל 在生育表达中标明关系或受益者；“给我主人生了一个儿子”是自然的现代汉语。
- source_word: אַחֲרֵי זִקְנָתָהּ
  choice: 年老以后
  rationale: 较贴近字面的“在她的老年之后”，同时用自然汉语表达撒拉已经年老这一时间含义；脚注保留“年老时”的可译法。
- source_word: וַיִּתֶּן לוֹ
  choice: 我主人把……都给了他
  rationale: 叙事动词的隐含主语按语境是亚伯拉罕，间接宾语指刚提到的儿子；汉语补出“我主人”可避免代词连续造成歧义。
- source_word: אֶת כָּל אֲשֶׁר לוֹ
  choice: 自己所有的一切
  rationale: 表达原文涵盖全部产业的所有权公式，并保持简明庄重。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。重复“我主人”既保留仆人的恭敬口吻，也澄清后半句施予者是亚伯拉罕；末尾“他”依上下文指所生的儿子。
