base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/020.yaml
  text: She quickly emptied her jar into the trough[a], and ran again to the well to draw water, and drew for all his camels.
translation:
  language: zh_hans
  text: 她赶紧把水罐里的水倒进水槽[a]，又跑到井边去打水，给他所有的骆驼打水。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“把她水罐里的水倒空在饮水槽里。”
    reason: 原文动词可侧重“倒出”或“倒空”；“饮水槽”明确该槽供牲畜饮水。
lexical_decisions:
- source_word: וַתְּמַהֵר
  choice: 她赶紧
  rationale: 该动词表示迅速、赶快行动；“赶紧”自然地表现她立即采取行动。
- source_word: וַתְּעַר כַּדָּהּ
  choice: 把罐里的水倒进
  rationale: ערה在这里指倾倒或倒空，כַּד指盛水的罐；中文以“把罐里的水倒进”清楚表达所倒的是罐中之水，同时不使人误解为把罐本身投入水槽。
- source_word: הַשֹּׁקֶת
  choice: 水槽
  rationale: 该词指盛水的槽，常供牲畜饮水；上下文已提到骆驼，因此“水槽”简洁自然。
- source_word: וַתָּרָץ עוֹד
  choice: 又跑
  rationale: וַתָּרָץ表示“跑”，עוֹד表示再次或继续；“又跑”保留重复行动的含义。
- source_word: הַבְּאֵר
  choice: 井
  rationale: בְּאֵר通常指井，符合本段取水的叙事场景。
- source_word: לִשְׁאֹב
  choice: 打水
  rationale: 该不定式表示从井中汲取水；“打水”是现代汉语中自然、准确的说法。
- source_word: וַתִּשְׁאַב
  choice: 打了水
  rationale: 重复使用汲水动词，叙述她实际完成了为骆驼取水的行动；中文用完成体使叙事流畅。
- source_word: לְכָל גְּמַלָּיו
  choice: 为他的所有骆驼都
  rationale: לְ表示受益对象，כָּל强调全体；“所有……都”明确保留总括意义。
theological_decisions: []
