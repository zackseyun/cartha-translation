  text: And he said[a], “I am Abraham’s servant.”
translation:
  language: zh_hans
  text: 他说[a]：“我是亚伯拉罕的仆人。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “仆人”或译“奴隶”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמַר
  choice: 他说
  rationale: 未逐字译出连接词 וַ，以符合现代汉语叙事习惯；动词“说”自然承接上文，并不额外限定为“于是”或“然后”所表达的逻辑关系。
- source_word: עֶבֶד
  choice: 仆人
  rationale: עֶבֶד 可指“仆人”或“奴隶”。本节是说话者对自己在亚伯拉罕家中身份的郑重介绍；“仆人”符合当前语境和现代汉语表达，同时以脚注保留“奴隶”这一词义可能。
- source_word: אַבְרָהָם
  choice: 亚伯拉罕
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: אָנֹכִי
  choice: 我是
  rationale: 独立人称代词 אָנֹכִי 明确突出说话者的自我身份；汉语用“我是”可自然、完整地表达这一判断句。
theological_decisions: []
