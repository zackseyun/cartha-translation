  text: וַ/תֹּ֣אמֶר אֵלָ֔י/ו בַּת בְּתוּאֵ֖ל אָנֹ֑כִי בֶּן מִלְכָּ֕ה אֲשֶׁ֥ר יָלְדָ֖ה לְ/נָחֽוֹר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/024.yaml
  text: She said to him[a], “I am the daughter of Bethuel son of Milcah, whom she bore to Nahor.”
translation:
  language: zh_hans
  text: 她对他说：“我是彼土利的女儿；彼土利是密迦给拿鹤生的儿子[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“为拿鹤生的儿子。”希伯来语的生育表达常用“给／为某人生”来指明父亲。
    reason: 说明לְ在生育句式中的译法，并保留“给”与“为”之间的词义选择。
lexical_decisions:
- source_word: וַתֹּאמֶר אֵלָיו
  choice: 她对他说
  rationale: וַתֹּאמֶר承接叙事中的下一动作；现代汉语不必机械译出“于是”或“又”。אֵלָיו明确表示说话对象是男性单数。
- source_word: בַּת בְּתוּאֵל אָנֹכִי
  choice: 我是彼土利的女儿
  rationale: 按希伯来语无系词的身份说明句译成自然的现代汉语，并保留独立代词אָנֹכִי所表达的明确自我指认。
- source_word: בְּתוּאֵל
  choice: 彼土利
  rationale: 采用现代中文圣经语境中通行的人名音译。
- source_word: בֶּן מִלְכָּה
  choice: 彼土利是密迦……生的儿子
  rationale: בֶּן与前面的彼土利同位，说明彼土利是密迦之子。为避免汉语连续属格产生歧义，将同位关系展开为分句。
- source_word: מִלְכָּה
  choice: 密迦
  rationale: 采用现代中文圣经语境中通行的人名音译。
- source_word: אֲשֶׁר יָלְדָה
  choice: 生的
  rationale: 阴性单数动词יָלְדָה以密迦为主语，关系代词所指的是彼土利；汉语用“密迦……生的儿子”自然呈现这一关系。
- source_word: לְנָחוֹר
  choice: 给拿鹤
  rationale: לְ与生育动词连用时常在族谱表达中标明父亲；“给拿鹤生的”既符合汉语习惯，也保留该结构的关系含义。
- source_word: נָחוֹר
  choice: 拿鹤
  rationale: 采用现代中文圣经语境中通行的人名音译。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。将希伯来语紧凑的同位结构展开为两个分句，以清楚表明彼土利是密迦所生的儿子，避免读者误以为“密迦”是彼土利的父亲。
