source:
  edition: WLC
  text: וַ/יהוָ֞ה בֵּרַ֧ךְ אֶת אֲדֹנִ֛/י מְאֹ֖ד וַ/יִּגְדָּ֑ל וַ/יִּתֶּן ל֞/וֹ צֹ֤אן וּ/בָקָר֙ וְ/כֶ֣סֶף וְ/זָהָ֔ב וַ/עֲבָדִם֙ וּ/שְׁפָחֹ֔ת וּ/גְמַלִּ֖ים וַ/חֲמֹרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/035.yaml
  text: And Yahweh has greatly blessed my master[a], and he has become great. He has given him flocks and herds, silver and gold, male servants and female servants, camels and donkeys.
translation:
  language: zh_hans
  text: 耶和华大大赐福给我主人；我主人就昌盛起来。耶和华又赐给他羊群、牛群、金银、仆婢[a]、骆驼和驴。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “仆婢”也可译作“男女奴仆”。希伯来语词可指家内仆役，也可指奴隶，须按具体处境判断。
    reason: 保留原词在仆役与奴隶身份之间的词义范围，避免正文过度确定其法律地位。
lexical_decisions:
- source_word: יהוה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名“耶和华”译出四字神名，保留原文在本节直接使用上帝名字的特点。
- source_word: בֵּרַךְ ... מְאֹד
  choice: 大大赐福
  rationale: 准确表达动词“赐福”和程度副词“极其、非常”，中文自然凝练。
- source_word: אֲדֹנִי
  choice: 我主人
  rationale: 这里指仆人的人间主人亚伯拉罕；“主人”清楚表达其社会关系，不会误作神圣称号。
- source_word: וַיִּגְדָּל
  choice: 使他日益昌盛
  rationale: 该动词本义为“变得强大／伟大”。结合随后列出的财富，“昌盛”自然传达地位与产业的增长，同时不把含义仅限于富有；补出使役联系，反映上下文中耶和华仍是赐福与赐予者。
- source_word: צֹאן וּבָקָר
  choice: 羊群、牛群
  rationale: צֹאן是以绵羊和山羊为主的小型牲畜集合词，中文惯用“羊群”；בָקָר指牛类牲畜，译作“牛群”与前者对应。
- source_word: כֶסֶף וְזָהָב
  choice: 金银
  rationale: 原文顺序为“银和金”，中文固定搭配通常说“金银”，调序不改变所指，并使表达自然。
- source_word: עֲבָדִם וּשְׁפָחֹת
  choice: 仆婢
  rationale: 两个词分别指男性与女性的家内仆役，也可能指奴隶；“仆婢”简洁保留性别对应，较适合庄重叙事，另以脚注保留“奴仆”的可能性。
- source_word: גְּמַלִּים וַחֲמֹרִים
  choice: 骆驼和驴
  rationale: 直接而自然地对应两类牲畜。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文明确使用四字神名。正文采用现代中文圣经传统中辨识度最高的专名“耶和华”，而不以“主”代替，从而保留专名性质；“雅威”是较接近学术重构读音的另一选择。
- issue: עֲבָדִים / שְׁפָחֹת 在财产清单中的身份含义
  choice: 仆婢
  alternative: 男女奴仆
  rationale: 这些词可涵盖家内仆役与受奴役者；本节列举家产，使“奴隶”义确有可能，但原词本身及本节并不足以精确界定每个人的法律身份，因此正文不将歧义单向定死，并在脚注说明。
- issue: וַיִּגְדָּל 的主语及因果关系
  choice: 使他日益昌盛
  alternative: 他变得强盛
  rationale: 希伯来语动词的语法主语可直接理解为“他（主人）变得强盛”，但整句把其现状归于耶和华的赐福，中文采用“使他……昌盛”显明语境中的因果关系；仍避免把“昌盛”缩减为纯粹财富。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“大大赐福”“日益昌盛”流畅表达赐福所带来的持续结果；“仆婢”略带传统叙事色彩，但仍为普通读者所理解，并比冗长的“男仆和女仆”更凝练。
