  text: but you shall go to my land and to my kindred[b][a], and take a wife for my son Isaac.
translation:
  language: zh_hans
  text: 而要到我的故土，到我的亲族[a]那里去，为我儿子以撒[b]娶一位妻子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我的出生地”。希伯来语这个词既可指人的出生地，也可指其亲族；这里的语境较支持“亲族”。
    reason: lexical_alternative
  - marker: b
    text: 直译：“为我的儿子，为以撒”。
    reason: source_structure
lexical_decisions:
- source_word: כִּי
  choice: 而要
  rationale: 本节承接上一节的禁令，表达转折和正面的吩咐；“而要”在现代汉语中自然地体现“不可……而要……”的对照。
- source_word: אֶל אַרְצִי
  choice: 到我的故土
  rationale: אֶרֶץ可指土地或地域；结合亚伯拉罕离乡的语境，“故土”自然表达“我的本土/家乡之地”，又不带现代民族国家色彩。
- source_word: וְאֶל מוֹלַדְתִּי
  choice: 和我的亲族那里
  rationale: מוֹלֶדֶת既可指出生地，也可指亲族群体；本节为以撒择妻，语境较支持亲族义。“那里”使与介词אֶל的搭配在汉语中顺畅。
- source_word: תֵּלֵךְ
  choice: 要……去
  rationale: 未完成式在此具有指令意味；“要……去”保留义务和吩咐的语气。
- source_word: וְלָקַחְתָּ אִשָּׁה
  choice: 娶一个妻子
  rationale: לקח אשה是婚姻语境中的惯用表达。对受命替以撒办理婚事的仆人而言，“为……娶一个妻子”比字面“取一个女人”自然且准确。
- source_word: לִבְנִי לְיִצְחָק
  choice: 为我儿子以撒
  rationale: 重复的לְ表达受益对象并带同位说明；现代汉语用“为我儿子以撒”即可清楚保留关系，脚注另列较形式对应的译法。
