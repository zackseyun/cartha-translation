id: GEN.24.38
reference: Genesis 24:38
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אִם לֹ֧א אֶל בֵּית אָבִ֛/י תֵּלֵ֖ךְ וְ/אֶל מִשְׁפַּחְתִּ֑/י וְ/לָקַחְתָּ֥ אִשָּׁ֖ה לִ/בְנִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/038.yaml
  text: But you shall go to my father's house and to my clan[a], and you shall take a wife for my son.
translation:
  language: zh_hans
  text: 你却要到我父家和我的本族[a]那里去，为我儿子娶妻。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“亲族”。希伯来语所指的是范围较广的家族群体，不只是直系家庭。
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם לֹא
  choice: 却要
  rationale: 这里不是普通的“如果不”，而是在誓言要求中承接上文禁令，表达转折和明确指示；“却要”在现代汉语中自然地保留这种语气。
- source_word: בֵּית אָבִי
  choice: 我父家
  rationale: 保留“父亲的家”这一亲属与家族概念；“我父家”简洁庄重，也不把含义限缩为一处住宅。
- source_word: תֵּלֵךְ
  choice: 要到……那里去
  rationale: 未完成式在此具有指示、义务意味；“要……去”既自然，又传达亚伯拉罕吩咐仆人的语气。
- source_word: מִשְׁפַּחְתִּי
  choice: 我的本族
  rationale: 该词指较广的家族或亲族群体。“本族”比现代汉语的“家庭”范围更广，并适合本段古代亲属语境。
- source_word: וְלָקַחְתָּ אִשָּׁה
  choice: 娶妻
  rationale: לקח אשה 在婚姻语境中表示娶妻；汉语“娶妻”准确表达其惯用含义，避免生硬直译为“取一个女人”。
- source_word: לִבְנִי
  choice: 为我儿子
  rationale: 介词 ל־ 在此表示受益者或目的；“为我儿子”符合安排婚事的语境。
theological_decisions: []
