base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/064.yaml
  text: Rebekah lifted up her eyes and saw Isaac[a], and she got down from the camel.
translation:
  language: zh_hans
  text: 利百加抬眼看见以撒，就从骆驼上下来了。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或直译：“从骆驼上掉下来。”这里的希伯来语很可能以“落下”表示下骆驼。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּשָּׂא ... אֶת־עֵינֶיהָ
  choice: 抬眼
  rationale: 保留希伯来语“举起双眼”的叙事性表达，同时采用现代汉语自然、简洁的说法。
- source_word: וַתֵּרֶא
  choice: 看见
  rationale: 这里表示直接的视觉感知；“看见”准确对应其基本义，也符合连续叙事的语气。
- source_word: אֶת־יִצְחָק
  choice: 以撒
  rationale: 采用中文圣经传统中通行的人名译法。
- source_word: וַתִּפֹּל מֵעַל הַגָּמָל
  choice: 从骆驼上下来了
  rationale: נפל通常意为“落下、跌下”，但本句结合上下文很可能是下骆驼的惯用表达。“下来”在现代汉语中自然地传达这一可能含义，同时用脚注保留字面理解。
theological_decisions: []
translation_notes:
  register: 采用自然、端庄的现代标准汉语。“抬眼”保留原文叙事风格；“下来”避免让正文误导读者以为利百加意外摔落，同时脚注保留原文措辞及其歧义。
