    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְסַפֵּר
  choice: 告诉了
  rationale: 此处为叙事中的转述，表示仆人向以撒讲明经过；“告诉了”自然清楚，也保留完成的叙事动作。
- source_word: הָעֶבֶד
  choice: 仆人
  rationale: עֶבֶד可指“仆人”或“奴隶”；本段着重其受差遣、办理事务的角色，因此正文采用“仆人”。
- source_word: לְיִצְחָק
  choice: 以撒
  rationale: 采用现代中文圣经中通行的人名译法。
- source_word: אֵת כָּל הַדְּבָרִים
  choice: 一切事
  rationale: דְּבָרִים可指话语、事项或事情；这里概括仆人使命中的行动和经过，译作“一切事”既宽泛又合乎语境。
- source_word: אֲשֶׁר עָשָׂה
  choice: 自己所做的
  rationale: 希伯来语第三人称单数的主语按最近且合乎语境的先行者理解为仆人；加入“自己”可在中文中清楚指明是仆人所做的事，而不改变原意。
