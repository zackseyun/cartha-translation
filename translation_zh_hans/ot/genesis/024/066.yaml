  text: 仆人[b]把他所做的一切事[a]都告诉了以撒。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “事”也可译作“事项”或“话”；希伯来语 דְּבָרִים 可按上下文指话语、事项或事件。
    reason: lexical_alternative
  - marker: b
