base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/054.yaml
  text: Then he and the men who were with him ate and drank[a], and they spent the night there. When they arose in the morning, he said, “Send me away to my master.”
translation:
  language: zh_hans
  text: 他和随行的人吃喝过后，就在那里住了一夜。清早他们起来，他说：“请让我到我的主人那里去。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאכְלוּ וַיִּשְׁתּוּ
  choice: 吃了喝了
  rationale: 按希伯来叙事的简洁次序直译两个并列动作，在现代汉语中自然清楚。
- source_word: הוּא וְהָאֲנָשִׁים אֲשֶׁר עִמּוֹ
  choice: 他和随行的人
  rationale: 保留原文明确的代词“他”，并以“随行的人”自然表达“与他同在的人”。
- source_word: וַיָּלִינוּ
  choice: 就在那里住了一夜
  rationale: 该动词表示过夜；“住了一夜”符合现代汉语，并用“在那里”明确承接当前地点。
- source_word: וַיָּקֻמוּ בַבֹּקֶר
  choice: 清早他们起来
  rationale: 忠实保留复数主语和早晨起身这一后续动作，同时维持简洁的叙事节奏。
- source_word: שַׁלְּחֻנִי
  choice: 请让我回到……那里去
  rationale: 命令式在此是向主人家人请求准许离去；汉语加“请”符合礼貌语境，“让我……去”自然传达放行之意。
- source_word: לַאדֹנִי
  choice: 到我主人那里去
  rationale: אָדוֹן在此指亚伯拉罕，是说话者在人间的主人；“主人”准确表达双方关系，也避免误解为神圣称号。
theological_decisions:
- issue: אָדוֹן指亚伯拉罕时的译法
  choice: 我主人
  alternative: 我的主
  rationale: 上下文所指是仆人的人间主人亚伯拉罕；“我主人”在现代汉语中更明确，同时以脚注保留原词也可译作“我的主”。
translation_notes:
  register: 采用现代、庄重而易懂的叙事用语。“随行的人”“住了一夜”自然简洁；引语中的“请”体现请求语气而不改变原命令式的实际功能。
