  text: וְ/הַֽ/נַּעֲרָ֗ טֹבַ֤ת מַרְאֶה֙ מְאֹ֔ד בְּתוּלָ֕ה וְ/אִ֖ישׁ לֹ֣א יְדָעָ֑/הּ וַ/תֵּ֣רֶד הָ/עַ֔יְנָ/ה וַ/תְּמַלֵּ֥א כַדָּ֖/הּ וַ/תָּֽעַל׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/016.yaml
  text: The young woman was very beautiful in appearance[a], a virgin; no man had known her. She went down to the spring, filled her jar[b], and came up.
translation:
  language: zh_hans
  text: 这年轻女子容貌极其美丽，是个处女；从未有男人与她同房[a]。她下到泉边[b]，把水罐装满，就上来了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“没有男人认识过她”；这里的“认识”是指发生性关系。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文作“泉”；有些译本译作“井”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנַּעֲרָ
  choice: 这年轻女子
  rationale: נַעֲרָה指年轻女性，常处于适婚年龄。“年轻女子”现代、自然，也避免“女孩”显得年龄过小或“少女”可能带来的特定年龄联想；“这”承接上下文中已被叙述的人物。
- source_word: טֹבַת מַרְאֶה מְאֹד
  choice: 容貌极其美丽
  rationale: 该短语直指外貌之美，מְאֹד加强程度。“容貌极其美丽”既保留视觉焦点，也符合庄重自然的现代汉语。
- source_word: בְּתוּלָה
  choice: 是个处女
  rationale: בְּתוּלָה在此叙事语境中通常指未有性经历的女子；“处女”是直接、清楚的对应。
- source_word: וְאִישׁ לֹא יְדָעָהּ
  choice: 从未有男人与她同房
  rationale: יָדַע“知道、认识”在这里是指性关系的委婉说法。“同房”保留原文的含蓄和庄重，同时让现代读者明白其含义；脚注注明直译。
- source_word: הָעַיְנָה
  choice: 下到泉边
  rationale: עַיִן在这里指自然涌出的水泉，而非通常由בְּאֵר表示的井；方向词与后文“上来”形成空间对照。
- source_word: כַדָּהּ
  choice: 水罐
  rationale: כַּד指汲水和盛水用的罐。“水罐”比单说“罐”更明确，也比“水瓶”更符合古代器物。
- source_word: וַתָּעַל
  choice: 就上来了
  rationale: עָלָה表示上去或上来，与先前“下到”相对。“上来了”自然呈现地势移动；“就”顺畅连接连续动作，不增加实质内容。
theological_decisions:
- issue: “没有男人知道她”这一希伯来委婉语的处理
  choice: 正文译为“从未有男人与她同房”，脚注保留直译
  alternative: 没有男人认识过她
  rationale: 若在现代汉语正文中直译为“认识”，容易被理解为一般相识关系，不能准确传达语境中的性含义。译作“同房”既明确又保留委婉语体，并由脚注呈现原文措辞。
translation_notes:
  register: 采用现代、庄重且易懂的叙事语言。保留“下到……上来”的地势对照；不用古雅的“童女”或可能显得年龄过小的“女孩”。脚注标记紧跟其实际解释的词句。
