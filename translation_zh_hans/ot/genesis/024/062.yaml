  yaml_path: translation/ot/genesis/024/062.yaml
  text: Isaac had come from Beer-lahai-roi[b][a], and he was dwelling in the land of the Negev.
translation:
  language: zh_hans
  text: 以撒从庇耳·拉海·莱[a]而来；他住在南地。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 庇耳·拉海·莱这个地名先前与夏甲的经历有关（见创世记16:14）。
    reason: cross_reference
lexical_decisions:
- source_word: בָּא
  choice: 已经……回来
  rationale: 该词是 בוא 的完成式，表示已经完成的移动；结合叙事进程，用“已经……回来”自然地交代下一幕发生前的情况。
- source_word: מִבּוֹא
  choice: 从
  rationale: 介词 מִן 与 בוא 的不定式连用，结构较为压缩；此处最自然地表示移动的起点。“从……回来”符合现代汉语表达。
- source_word: בְּאֵר לַחַי רֹאִי
  choice: 庇耳·拉海·莱
  rationale: 作为地名采用音译，并用间隔号标明复合名称的组成部分。
- source_word: יוֹשֵׁב
  choice: 住
  rationale: 分词表示持续状态或惯常居住；现代汉语的“住”在上下文中自然表达这种延续状态。
- source_word: בְּאֶרֶץ הַנֶּגֶב
  choice: 在南地
  rationale: נֶגֶב 在这里是南方干旱地区的地理名称；“南地”是简洁而明确的专名式译法，也涵盖 אֶרֶץ 所表达的地域概念。
- source_word: וְהוּא
  choice: ；他
  rationale: 原文明确使用第三人称代词并连接背景说明；分号既保留并列关系，也符合现代汉语的行文习惯。
