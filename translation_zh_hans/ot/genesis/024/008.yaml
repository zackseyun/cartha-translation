source:
  edition: WLC
  text: וְ/אִם לֹ֨א תֹאבֶ֤ה הָֽ/אִשָּׁה֙ לָ/לֶ֣כֶת אַחֲרֶ֔י/ךָ וְ/נִקִּ֕יתָ מִ/שְּׁבֻעָתִ֖/י זֹ֑את רַ֣ק אֶת בְּנִ֔/י לֹ֥א תָשֵׁ֖ב שָֽׁמָּ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/008.yaml
  text: But if the woman is not willing to go after you[a], then you will be free from this oath of mine[b]; only you must not take my son back there.
translation:
  language: zh_hans
  text: 但那女子若不愿跟你去[a]，你就不再受我这个誓言的约束[b]；只是不可把我的儿子带回那里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“随你去”或“跟随你”；直译为“走在你后面”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“你就可免除我这个誓言所规定的责任。”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: 但……若
  rationale: 承接上一节并引出与先前吩咐相对的条件；“但……若”在现代汉语中自然地表达这种转折条件。
- source_word: לֹא תֹאבֶה
  choice: 不愿
  rationale: אָבָה表示意愿或同意；与否定词连用时译作“不愿”，保留意志层面的含义，又不强化为公然拒绝。
- source_word: הָאִשָּׁה
  choice: 那女子
  rationale: 此时她尚未成为以撒的妻子；“那女子”既符合语境中的特指，也避免过早称她为“妻子”。
- source_word: לָלֶכֶת אַחֲרֶיךָ
  choice: 跟你去
  rationale: 原文直译为“走在你后面／跟在你后面”，在此旅行语境中指随同仆人前往；“跟你去”是自然、清楚的现代汉语表达，脚注保留原文意象和其他可能译法。
- source_word: וְנִקִּיתָ
  choice: 你就不再受……约束
  rationale: נקה的Nifal在此表示从誓言所带来的义务中得以清白、解除或释放；此译明确表达法律—誓约语境中的约束解除。
- source_word: מִשְּׁבֻעָתִי זֹאת
  choice: 我这个誓言
  rationale: 同时保留第一人称所属后缀和指示词“这个”；“誓言”符合本段庄重的起誓语境。
- source_word: רַק
  choice: 只是
  rationale: 标明解除誓言约束仍受后一项严格限制；“只是”自然地表达这一限定作用。
- source_word: אֶת־בְּנִי לֹא תָשֵׁב שָׁמָּה
  choice: 不可把我的儿子带回那里
  rationale: שׁוב的Hifil具有使役义，即“使……返回／带回”；“不可”传达禁止语气，“那里”保留原文的地点副词。
theological_decisions: []
