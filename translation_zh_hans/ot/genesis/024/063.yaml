  text: וַ/יֵּצֵ֥א יִצְחָ֛ק לָ/שׂ֥וּחַ בַּ/שָּׂדֶ֖ה לִ/פְנ֣וֹת עָ֑רֶב וַ/יִּשָּׂ֤א עֵינָי/ו֙ וַ/יַּ֔רְא וְ/הִנֵּ֥ה גְמַלִּ֖ים בָּאִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/063.yaml
  text: And Isaac went out to meditate in the field toward evening[a], and he lifted up his eyes and looked, and behold, camels were coming.
translation:
  language: zh_hans
  text: 傍晚将近时，以撒到田野里去默想[a]。他抬眼一看，只见骆驼正走来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“散步”“沉思”或“交谈”，也可能是“祷告”。这里的希伯来语动词很少见，确切含义不能确定。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: 到……去
  rationale: 该词是 יצא 的 Qal 叙事形，表示从一处出去；结合中文语序，以“到田野里去”自然表达向外移动。
- source_word: יִצְחָק
  choice: 以撒
  rationale: 采用现代简体中文圣经传统中通行的人名音译。
- source_word: לָשׂוּחַ
  choice: 默想
  rationale: שׂוח 在此是罕见且含义有争议的词。“默想”符合独自在田野中的场景，也不过度限定为祷告；因确切含义不明，在脚注中保留其他可能。
- source_word: בַּשָּׂדֶה
  choice: 在田野里
  rationale: שׂדה 指田野或郊野；“在田野里”直接、自然。
- source_word: לִפְנוֹת עָרֶב
  choice: 傍晚时分
  rationale: 该短语字面涉及夜晚转近之际，表示临近傍晚；“傍晚时分”是自然简洁的现代汉语表达。
- source_word: וַיִּשָּׂא עֵינָיו וַיַּרְא
  choice: 他抬眼一看
  rationale: 将“举目”和“看见”两个连续动作合为自然的汉语惯用表达，同时保留抬眼观看的意象。
- source_word: וְהִנֵּה
  choice: 瞧
  rationale: הִנֵּה 用于唤起注意并突出突然映入眼帘的景象；“瞧”比单纯陈述更能保留叙事的现场感，也比“看哪”更符合现代普通话。
- source_word: גְמַלִּים בָּאִים
  choice: 几匹骆驼正迎面而来
  rationale: 分词 בָּאִים 表示正在来到或接近。“正……而来”保留进行状态；“迎面”按以撒观看来者的场景自然呈现接近方向。“几匹”是不定复数的自然汉语表达，不指定确数。
theological_decisions:
- issue: לָשׂוּחַ 是否特指祷告
  choice: 正文译作“默想”，不明确限定为祷告
  alternative: 祷告、散步、沉思或交谈
  rationale: 原词罕见，语境不能确定它是否具有专门的宗教含义；正文采用较宽泛的反思性活动，并以脚注保留歧义，避免引入未经文本证实的神学限定。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准普通话。叙事节奏简洁；“抬眼一看，瞧”保留希伯来文连续观看动作及 הִנֵּה 的现场感。
