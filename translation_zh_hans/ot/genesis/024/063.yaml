- from: 傍晚时分，以撒到田野里去默想[a]。他抬眼一看，瞧，几匹骆驼正迎面而来。
  to: 傍晚将近时，以撒到田野里去默想[a]。他抬眼一看，只见骆驼正走来。
  rationale: The revision removes unsupported quantity and direction implications, more closely represents the temporal phrase, and maintains the lexical ambiguity of לָשׂוּחַ in the footnote. It retains concise, natural modern Mandarin narrative style.
