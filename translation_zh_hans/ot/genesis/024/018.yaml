  yaml_path: translation/ot/genesis/024/018.yaml
  text: She said[a], “Drink, my lord,” and she quickly lowered her jar onto her hand and gave him a drink.
translation:
  language: zh_hans
  text: 她说：“请喝吧，我主[a]。”她连忙把水罐放下来，托在手上，给他喝。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“先生”。希伯来文直译为“我主”，这里是对男子表示尊敬的称呼。
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁתֵה
  choice: 请喝吧
  rationale: 这是 שׁתה 的阳性单数祈使式；“请喝吧”保留直接邀请的语气，也符合现代汉语礼貌表达。
- source_word: אֲדֹנִי
  choice: 我主
  rationale: 原文直译为“我主”，在此是女子对陌生男子表示尊敬的称呼，并非指上帝；正文保留其字面形式，脚注说明现代汉语可对应“先生”。
- source_word: וַתְמַהֵר
  choice: 连忙
  rationale: 该动词强调动作迅速；“连忙”自然地表现她立即采取行动的叙事语气。
- source_word: וַתֹּרֶד כַּדָּהּ
  choice: 把水罐放下来
  rationale: ירד 的使役形式在这里表示将所携的罐子向下移；“放下来”符合具体动作和现代汉语习惯。
- source_word: עַל יָדָהּ
  choice: 托在手上
  rationale: 原文意为“在她手上”；“托在手上”清楚呈现她把罐子移至手上以便给人喝的动作，又不引入本节未明说的肩部细节。
- source_word: וַתַּשְׁקֵהוּ
  choice: 让他喝
  rationale: שׁקה 的使役形式意为使某人喝或给某人喝；“让他喝”简洁保留其使役含义，不额外补入原文未明说的宾语“水”。
theological_decisions:
- issue: אֲדֹנִי 是否为神圣称号
  choice: 按对人的尊称处理
  alternative: 理解为对上帝的称呼
  rationale: 叙事中的受话者是亚伯拉罕的仆人；词形在此用于对男子的礼貌称呼，并无神圣称号之意。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“我主”有意保留希伯来文称呼的字面色彩，并以脚注避免现代读者误解；动作描写用“连忙”“放下来，托在手上”保持叙事的迅速感和具体性。
