base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/046.yaml
  text: She quickly lowered her jar from her shoulder and said[a], ‘Drink, and I will also give water to your camels.’ So I drank, and she also gave water to the camels.
translation:
  language: zh_hans
  text: 她连忙把水罐从肩上[a]放下来，说：“请喝吧，我也要给你的骆驼水喝。”于是我喝了，她也给骆驼喝了水。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“从她上面”或“从她身上”。这里没有明确指出身体部位，但结合上下文，很可能是指肩上。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּמַהֵר
  choice: 连忙
  rationale: 该动词表示迅速行动；“连忙”自然地体现利百加立即回应、动作敏捷。
- source_word: וַתּוֹרֶד
  choice: 放下来
  rationale: ירד的使役形在此表示使水罐向下移动；“放下来”符合现代汉语叙事和具体动作。
- source_word: כַּדָּהּ
  choice: 她的水罐
  rationale: כד指取水所用的罐或瓶；上下文明确是盛水器皿，“水罐”简明清楚。
- source_word: מֵעָלֶיהָ
  choice: 从肩上[a]
  rationale: 希伯来文直译为“从她上面／身上”，并未明说身体部位；结合本章上下文，以“从肩上”表达最自然，同时用脚注保留原文的不明确性。
- source_word: שְׁתֵה
  choice: 请喝吧
  rationale: 保留直接命令的简洁性；“请……吧”符合款待陌生人的自然汉语语气，不削弱命令形式。
- source_word: וְגַם גְּמַלֶּיךָ אַשְׁקֶה
  choice: 我也要给你的骆驼水喝
  rationale: שקה的使役形意为使其喝水、给其水喝；此译法自然，并保留“也”的递进重点。
- source_word: וָאֵשְׁתְּ
  choice: 于是我喝了
  rationale: 叙事连接词推动事件发展；“于是”恰当地表达她邀请之后仆人便喝水。
- source_word: וְגַם הַגְּמַלִּים הִשְׁקָתָה
  choice: 她也给骆驼喝了水
  rationale: 与前一句的使役意义保持一致，并以自然现代汉语说明她让骆驼饮水。
