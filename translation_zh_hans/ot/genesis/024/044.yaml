base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/044.yaml
  text: and says to me[a], ‘You also drink, and I will draw water for your camels as well’—let her be the woman whom Yahweh has appointed for my master’s son.
translation:
  language: zh_hans
  text: 并对我说：‘你也请喝，我也要为你的骆驼打水。’她就是耶和华为我主人的儿子选定[a]的女子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “选定”也可译作“指定”或“决定”。
    reason: 保留 הֹכִיחַ 在本语境中“选定、指定、决定”的词义幅度。
lexical_decisions:
- source_word: וְאָמְרָה אֵלַי
  choice: 并对我说
  rationale: 完成时处在仆人复述祷告内容的语境中，中文用“说”即可自然涵盖预期发生的话语，无须强行标明过去或现在。
- source_word: גַּם אַתָּה שְׁתֵה
  choice: 你也请喝
  rationale: 保留גַּם所表达的“也”和命令式的邀请语气；“请”符合女子对陌生人的礼貌应答。
- source_word: וְגַם לִגְמַלֶּיךָ אֶשְׁאָב
  choice: 我也要给你的骆驼打水
  rationale: שׁאב指从井中打水；第二个גַּם与前句平行，译作“也”。
- source_word: הִוא הָאִשָּׁה
  choice: 愿她就是……的女子
  rationale: 字面是“她是那女子”，但在本段祷告和求印证的句法语境中具有祈愿意味；用“愿”自然呈现这一语用功能，同时保留身份确认。
- source_word: אֲשֶׁר הֹכִיחַ
  choice: 选定
  rationale: יכח的使役式在此表示决定、指定或选定；“选定”贴合神为以撒确定对象的上下文，但不把该词解释为已经成婚。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经传统中通行的神名音译，明确其为专名而非称号。
- source_word: לְבֶן אֲדֹנִי
  choice: 为我主人的儿子
  rationale: לְ在此表示对象或关系；该译法直接保留原文所属关系。
theological_decisions:
- issue: הִוא הָאִשָּׁה在祷告中的语气
  choice: 愿她就是……的女子
  alternative: 她就是……的女子
  rationale: 名词句本身可直陈身份，但上下文是仆人向神提出印证，因此中文以祈愿句更自然；这不改变所选女子由神决定的含义。
- issue: אֲשֶׁר הֹכִיחַ所表达的神圣决定
  choice: 选定
  alternative: 指定／决定
  rationale: 原词在此可涵盖指定、决定、判定等意义。“选定”能表达神的拣定行动，又避免引入超出经文的婚姻或预定论细节。
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: “耶和华”是现代简体中文读者最熟悉且可辨识为神名的传统音译；不以“主”替代专名。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“我主人”保留仆人口吻；“女子”比“女人”更适合婚配语境，却不提前称她为妻子。脚注标记置于相关分句之后。
