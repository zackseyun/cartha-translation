  yaml_path: translation/ot/genesis/024/025.yaml
  text: Then she said to him[a], “We have plenty of both straw and fodder, and also a place to spend the night.”
translation:
  language: zh_hans
  text: 她对他说：“我们有许多秸秆和饲料，也有可以过夜的地方。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֹּאמֶר אֵלָיו
  choice: 她又对他说
  rationale: וַתֹּאמֶר承接并推进叙事；结合上一节她已经作答的语境，用“又”自然表达继续说话。אֵלָיו直译为“对他”。
- source_word: גַּם ... גַּם ... גַּם
  choice: ……也……
  rationale: 重复的גַּם使信息逐项累加。汉语将前两项合为“草料”，并以“也”引出住宿地点，保留累加语气而避免生硬重复。
- source_word: תֶּבֶן גַּם מִסְפּוֹא
  choice: 草料
  rationale: תֶּבֶן指秸秆、干草一类材料，מִסְפּוֹא指牲畜饲料；本节重点是牲畜所需供应充足，现代汉语用“草料”概括二者，简洁自然。
- source_word: רַב עִמָּנוּ
  choice: 我们有充足的
  rationale: 字面为“很多在我们这里”。按现代汉语领有表达译作“我们有充足的”，既传达רַב的丰富之意，也保持自然。
- source_word: מָקוֹם לָלוּן
  choice: 住宿的地方
  rationale: מָקוֹם是“地方”，לָלוּן指过夜、投宿；“住宿的地方”自然清楚，且不把地点过度具体化为房间。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“住宿”比“下榻”通俗，比“过夜”略正式，适合经文语体。原文分别列出秸秆与牲畜饲料；正文以汉语常用集合词“草料”表达，避免译成不自然的“稻草和饲料”。
