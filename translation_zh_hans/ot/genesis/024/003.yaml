base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/003.yaml
  text: and I will make you swear by Yahweh[a], the God of heaven and the God of the earth, that you shall not take a wife for my son from the daughters of the Canaanites, among whom I dwell.
translation:
  language: zh_hans
  text: 我要使你指着雅威[a]——天上的上帝、地上的上帝——起誓：你不可从我所居住的迦南人中，为我儿子娶妻。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文：‘指着雅威’（בַּיהוָה）；“雅威”（יהוה，YHWH）是上帝的专名。传统汉译常作“耶和华”。
    reason: 说明起誓公式中介词的意义，并说明神名的原文形式及常见传统译法。
lexical_decisions:
- source_word: וְאַשְׁבִּיעֲךָ
  choice: 我要使你……起誓
  rationale: 使役式表达“使某人起誓”，保留希伯来语的使役含义，并符合现代汉语表达。
- source_word: בַּיהוָה
  choice: 指着雅威
  rationale: 介词标明起誓所指的对象；“指着……起誓”是自然、庄重的汉语誓言用语。神名 יְהוָה 音译为“雅威”。
- source_word: אֱלֹהֵי הַשָּׁמַיִם וֵאלֹהֵי הָאָרֶץ
  choice: 天上的上帝、地上的上帝
  rationale: 保留原文两次重复的“上帝”，以及“天—地”的宇宙性对应，避免压缩为“天地的上帝”。
- source_word: אֲשֶׁר לֹא תִקַּח
  choice: 你不可……娶
  rationale: 这是誓言的具体内容；“不可”保留严肃的禁止语气，而“娶”准确体现婚姻语境。
- source_word: אִשָּׁה לִבְנִי
  choice: 为我儿子娶妻
  rationale: אִשָּׁה 在此指妻子；汉语“为我儿子娶妻”自然表达替儿子选择并迎娶妻子的意思。
- source_word: מִבְּנוֹת הַכְּנַעֲנִי
  choice: 从……迦南人女子中
  rationale: “……的女儿”在此是族群习语；译作“迦南人女子”可清楚传达所指，同时不误导为某些人的直系女儿。
- source_word: אֲשֶׁר אָנֹכִי יוֹשֵׁב בְּקִרְבּוֹ
  choice: 我所居住之地的
  rationale: 原文直译近于“我住在他们中间”；此处以自然汉语将关系从句连到“迦南人”，表达亚伯拉罕寄居于他们中间。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。音译“雅威”较直接地区别专名与称号，又以脚注说明原文形式及常见译法，不把神名无标记地改作称号。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“指着……起誓”保留誓言语体；破折号标明“天上的上帝、地上的上帝”是对“雅威”的同位说明。
