revisions:
- from: 我要使你指着雅威[a]——天上的上帝、地上的上帝——起誓：你不可从我所居住之地的迦南人女子中为我儿子娶妻。
  to: 我要使你指着雅威[a]——天上的上帝、地上的上帝——起誓：你不可从我所居住的迦南人中，为我儿子娶妻。
  rationale: 将“我所居住之地的迦南人女子”改为“我所居住的迦南人中”，恢复原文“我住在他们中间”的指向，同时保留“从……中为我儿子娶妻”所表达的婚配对象范围。脚注相应改为说明本节完整的原文短语。
