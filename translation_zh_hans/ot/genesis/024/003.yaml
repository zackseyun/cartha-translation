  naturalness: “我要使你指着……起誓”庄重且可理解；用冒号引出誓言内容自然。修订后“我所居住的迦南人中”既合现代汉语，也准确表达“在他们中间居住”。
  terminology: “雅威”与项目对 יהוה 的既定处理一致。“上帝”“娶妻”“迦南人”均恰当。脚注应准确说明此处原文短语是“指着雅威”，不宜笼统说原文只是“雅威”；并可简洁说明“耶和华”为常见传统汉译。
