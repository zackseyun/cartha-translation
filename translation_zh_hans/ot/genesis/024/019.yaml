  yaml_path: translation/ot/genesis/024/019.yaml
  text: When she had finished giving him a drink[a], she said, “I will draw water for your camels also, until they have finished drinking.”
translation:
  language: zh_hans
  text: 她给他喝完了水，就说：“我也要为你的骆驼打水，直到它们喝完水。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתְּכַל לְהַשְׁקֹתוֹ
  choice: 她让他喝足了
  rationale: כלָה与使役式שׁקה连用，表示她完成了给他水喝这件事。译为“让他喝足了”自然地表达动作完成，但不暗示他只喝了一口。
- source_word: וַתֹּאמֶר
  choice: 就说
  rationale: 承接前一动作，现代汉语用“就”自然表达叙事次序，无须机械重复希伯来语连接词“和”。
- source_word: גַּם לִגְמַלֶּיךָ
  choice: 也要为你的骆驼
  rationale: “也”保留גַּם的添加意义；“为”表明骆驼是打水这一动作的受益者。
- source_word: אֶשְׁאָב
  choice: 打水
  rationale: שׁאב指从井或水源汲水；“打水”是现代汉语中自然、准确的对应表达。
- source_word: עַד אִם כִּלּוּ לִשְׁתֹּת
  choice: 直到它们都喝足
  rationale: עַד אִם在此引出终点，“直到”；כִּלּוּ לִשְׁתֹּת直指骆驼完成饮水。“都喝足”简洁表达复数主体及饮水完毕。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重的现代标准普通话。“喝足”前后呼应，既传达动作完成，也符合人和骆驼饮水的语境。未添加原文没有的神学解释。
