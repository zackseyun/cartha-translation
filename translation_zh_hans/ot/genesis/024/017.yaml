  language: zh_hans
  text: 仆人就跑去见她，说：“请让我从你的水罐里喝一点水。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּרָץ
  choice: 跑过去
  rationale: רוץ在连续叙事形式中表示“跑”；“跑过去”自然地表现动作的迅速和方向。
- source_word: הָעֶבֶד
  choice: 仆人
  rationale: עֶבֶד可指仆人或奴仆；本段强调他作为亚伯拉罕家中受托之人的角色，因此译作“仆人”贴合语境。
- source_word: לִקְרָאתָהּ
  choice: 迎着她
  rationale: לִקְרַאת加人称后缀表示朝向某人、上前相迎；“迎着她”简洁保留了主动趋近之意。
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 这是希伯来叙事中引出直接引语的常规表达；中文接续句用“说”即可，无须重复主语。
- source_word: הַגְמִיאִינִי
  choice: 让我喝
  rationale: גמא的使役命令式带第一人称单数宾语后缀，可表示“让我喝”或“给我喝”；正文采用自然且贴近结构的“让我喝”。
- source_word: נָא
  choice: 请
  rationale: נָא表达恳求或礼貌语气，现代汉语自然对应为“请”。
- source_word: מְעַט מַיִם
  choice: 一点……水
  rationale: מְעַט表示少量；“一点水”既准确，也体现请求的克制语气。
- source_word: מִכַּדֵּךְ
  choice: 你水罐里的
  rationale: כַּד指取水用的罐或罐状容器，阴性单数后缀表示“你的”；按现代汉语习惯译为“你水罐里的水”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而口语自然的叙事体。“请让我喝一点你水罐里的水”保留原文礼貌请求的语气；“让我喝”与“给我喝”在此均可表达使役命令式，正文选择更顺畅且贴近希伯来语结构的说法。未设脚注，因为这一差异在中文中不影响实质意义，也无须以脚注增加阅读负担。
