  text: וַ/יֹּ֨אמֶר֙ בַּת מִ֣י אַ֔תְּ הַגִּ֥ידִי נָ֖א לִ֑/י הֲ/יֵ֧שׁ בֵּית אָבִ֛י/ךְ מָק֥וֹם לָ֖/נוּ לָ/לִֽין־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/023.yaml
  text: And he said[a], “Whose daughter are you? Please tell me. Is there room in your father’s house for us to spend the night?”
translation:
  language: zh_hans
  text: 他问：“你是谁的女儿？请告诉我。你父亲家里有没有地方让我们过夜？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 他问
  rationale: 原词直译为“他说”；因后接两个问句，现代汉语用“他问”更自然，也准确表达这里的言语功能。
- source_word: בַּת מִי אַתְּ
  choice: 你是谁的女儿？
  rationale: 保留希伯来语以父系家族身份为焦点的问法，同时符合现代汉语表达。
- source_word: הַגִּידִי נָא לִי
  choice: 请告诉我
  rationale: “请”体现语气词נָא使祈使语气缓和、带有礼貌请求的作用。
- source_word: הֲיֵשׁ
  choice: 有没有
  rationale: 自然表达希伯来语存在句的是非问法。
- source_word: בֵּית אָבִיךְ
  choice: 你父亲家里
  rationale: 既保留“父亲之家”的家族与家庭场景，也采用自然的现代汉语措辞。
- source_word: מָקוֹם
  choice: 地方
  rationale: 保持原词“地方、空间”的宽泛含义，不把它收窄为特定房间。
- source_word: לָנוּ
  choice: 让我们
  rationale: 明确保留第一人称复数，指仆人及其同行者。
- source_word: לָלִין
  choice: 过夜
  rationale: 在接待住宿的语境中，清楚自然地表达留宿一夜之意。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而口语自然的叙事语言；保留家族身份问法和复数“我们”，不添加原文未明说的同行者身份。
