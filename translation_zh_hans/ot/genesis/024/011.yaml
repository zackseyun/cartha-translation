  yaml_path: translation/ot/genesis/024/011.yaml
  text: And he made the camels kneel down outside the city by the well of water at evening time[b][a], at the time when the women go out to draw water.
translation:
  language: zh_hans
  text: 他便让骆驼在城外的水井旁跪下。那时正值傍晚，正是妇女们出来打水的时候。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּבְרֵךְ
  choice: 让……跪下
  rationale: 该词是ברך的使役形，用于骆驼，表示使它们屈膝伏下；“让……跪下”在现代汉语中自然，也保留了原文的具体动作。
- source_word: הַגְּמַלִּים
  choice: 骆驼
  rationale: 带定冠词的复数名词，指上下文中已经提到的那群骆驼；汉语通常不必另译定冠词。
- source_word: מִחוּץ לָעִיר
  choice: 在城外
  rationale: 准确表达“城的外面”；“城”既简洁又符合古代聚居地的叙事语体。
- source_word: אֶל בְּאֵר הַמָּיִם
  choice: 在水井旁
  rationale: אֶל本可表示“向、到”，但此处叙述骆驼跪下后的所在位置，译作“在……旁”更符合汉语表达；“水井”保留原文“水之井”的具体含义。
- source_word: לְעֵת עֶרֶב
  choice: 那时正值傍晚
  rationale: 清楚表达原文的时间短语，同时用“那时正值”自然承接前句。
- source_word: לְעֵת צֵאת הַשֹּׁאֲבֹת
  choice: 正是妇女们出来打水的时候
  rationale: הַשֹּׁאֲבֹת是阴性复数分词，明确指从事打水工作的妇女；汉语译文直接保留这一性别信息，并自然表达“出来打水”的惯常活动。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而通顺的叙事汉语。将希伯来文连续的两个时间短语译为“那时正值……，正是……的时候”，既保留其并列强调，又避免汉语生硬重复。
