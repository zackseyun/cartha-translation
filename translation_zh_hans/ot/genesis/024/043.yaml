base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/043.yaml
  text: Look[a], I am standing by the spring of water, and let it be that the young woman who comes out to draw, to whom I say[b], ‘Please let me drink a little water from your jar,’
translation:
  language: zh_hans
  text: 看哪，我正站在泉水旁；愿这样：那出来打水的年轻女子[a]，我对她说：“请让我从你的水罐里喝一点水[b]”，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “年轻女子”也可译作“少女”。希伯来语 עַלְמָה 指适婚年龄的年轻女子，该词本身并不明确表示“童女”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“请从你的水罐里给我一点水喝。”
    reason: translation_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: 看哪
  rationale: 作为指示语，引出眼前情景并增强现场感；“看哪”庄重而仍为现代读者所熟悉。
- source_word: נִצָּב
  choice: 正站在
  rationale: 分词表达当时持续的姿态；“正站在”自然呈现进行中的状态。
- source_word: עַל עֵין הַמָּיִם
  choice: 在水泉旁
  rationale: עֵין 在此指天然泉源，而不是人工挖掘的井；“水泉”保留原文意象。
- source_word: וְהָיָה
  choice: 愿……时
  rationale: 此处处于祈求神显明记号的语境，带有愿望色彩；并以跨节句式保留原文尚未完成的条件结构。
- source_word: הָעַלְמָה
  choice: 少女
  rationale: 指适婚年龄的年轻女子；该词本身不明确断定童贞。“少女”在此简洁、自然，也不额外加入原词未明说的信息。
- source_word: הַיֹּצֵאת לִשְׁאֹב
  choice: 那出来打水的
  rationale: 保留定冠词和分词所描绘的预期人物，并把省略的宾语“水”按汉语习惯明确表达。
- source_word: הַשְׁקִינִי נָא
  choice: 请让我喝
  rationale: הַשְׁקִינִי 是使役形式，意为使某人喝或给某人水喝；“请让我喝”自然传达请求，נָא 译作“请”。
- source_word: מְעַט מַיִם מִכַּדֵּךְ
  choice: 一点你水罐里的水
  rationale: 准确保留少量之意以及水来自女子所携水罐的信息。
theological_decisions:
- issue: עַלְמָה 是否译为“童女”
  choice: 少女
  alternative: 童女；年轻女子
  rationale: 该希伯来词指年轻女子，常含适婚年龄背景，但其词义本身并不明确断定童贞。译作“少女”可避免把本节词语承载的信息说得过强；本章其他经文本身提供的相关描述不受此决定影响。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“看哪”保留原文的现场感；句末逗号刻意保留本节与下一节之间尚未完成的条件句关系。引号采用中文全角形式。
