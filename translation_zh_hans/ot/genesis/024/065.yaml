base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/065.yaml
  text: And she said to the servant[a], “Who is this man walking in the field to meet us?” And the servant said[c][b], “He is my master.” Then she took the veil and covered herself.
translation:
  language: zh_hans
  text: 她问那仆人：“田野里那个朝我们走来的人是谁？”仆人回答：“他是我的主人。”于是她拿起面纱，用面纱遮住自己。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“把自己蒙起来。”原文动词为反身形式，表示她拿起面纱遮盖自己。
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֶבֶד
  choice: 仆人
  rationale: עֶבֶד 可指仆人或奴仆；本节着重其作为亚伯拉罕家中代理人的身份，译作“仆人”自然且符合语境。
- source_word: הָאִישׁ הַלָּזֶה
  choice: 那个人
  rationale: 该短语指田野里可见的一名男子；现代汉语在询问远处或被指认者时用“那个人”最自然。
- source_word: הַהֹלֵךְ בַּשָּׂדֶה לִקְרָאתֵנוּ
  choice: 田野里那个朝我们走来的人
  rationale: 保留 הלך 的行走含义，并以“朝我们走来”自然表达 לִקְרָאתֵנוּ 所指向着他们、前来相迎的方向。
- source_word: הוּא אֲדֹנִי
  choice: 他是我的主人
  rationale: אֲדֹנִי 在这里表示仆人所属的人间主人；“主人”准确反映社会关系，也避免误解为神圣称号。
- source_word: הַצָּעִיף
  choice: 面纱
  rationale: צָעִיף 指女子用来遮盖自己的衣物；在本段婚姻叙事中，“面纱”清楚而自然。
- source_word: וַתִּתְכָּס
  choice: 蒙上了自己
  rationale: 该反身动词表示利百加用刚拿起的面纱遮盖自己；此译保留反身意义，不额外限定具体遮盖部位。
theological_decisions: []
