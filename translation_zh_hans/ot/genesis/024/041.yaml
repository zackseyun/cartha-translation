base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/041.yaml
  text: Then you will be free from my oath when you come to my family; and if they do not give to you[a], you will be free from my oath.
translation:
  language: zh_hans
  text: 你到了我亲族那里，就不再受我誓言的约束；如果他们不把她交给你，你也不再受我誓言的约束。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “誓言”也可译作“咒诅”；希伯来语原词可指带有咒诅或制裁后果的誓言。
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּנָּקֶה / נָקִי
  choice: 可以不受……约束
  rationale: 这里表示从誓言所带来的义务或责任中得以解除，并非抽象意义上的道德清白；前后两处采用一致译法。
- source_word: מֵאָלָתִי
  choice: 不受我誓言的约束
  rationale: אָלָה可指带有咒诅或惩罚后果的誓言；本段重点是仆人获准解除亚伯拉罕所加给他的誓约责任。
- source_word: כִּי
  choice: 到了……就
  rationale: 此处引出解除责任的时间兼条件情形；现代汉语以“到了……就”自然保留这种语义。
- source_word: מִשְׁפַּחְתִּי
  choice: 我的家族
  rationale: 该词指范围较广的亲族或宗族；“家族”比“家庭”更能体现扩展亲属群体。
- source_word: וְאִם לֹא יִתְּנוּ לָךְ
  choice: 如果他们不把她交给你
  rationale: 希伯来文未明说宾语，但上下文明指作为婚配对象的女子；汉语补出“她”可避免句意残缺，“交给你”保留古代婚姻安排语境。
theological_decisions:
- issue: 誓言语境中אָלָה的译法
  choice: 誓言
  alternative: 咒诅
  rationale: 该词包含违誓所招致的咒诅或制裁意味，但叙事焦点是仆人从宣誓义务中获释；正文译作“誓言”而在脚注保留“咒诅”的词义张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“家族”体现扩展亲族范围；“不受……约束”清楚表达法律—誓约层面的解除。脚注标记置于相关分句末，说明本节两次出现的同一关键词。
