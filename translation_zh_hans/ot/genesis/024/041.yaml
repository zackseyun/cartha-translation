  naturalness: “到了我的家族那里”不符合现代汉语的自然搭配；“我的亲族那里”或“我亲族那里”更自然，也较准确地表达מִשְׁפָּחָה的扩展亲属含义。将“可以不受……约束”改为“不再受……约束”可更直接地表达解除既有誓约责任。
  terminology: “誓言”可保留为אָלָה的正文译法；脚注保留“咒诅”这一带制裁意味的词义可能，处理恰当。前后两次均译为不再受该誓言约束，保持了术语和语义的一致性。
