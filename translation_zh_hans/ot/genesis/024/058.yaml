base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/058.yaml
  text: So they called Rebekah and said to her, “Will you go with this man?” And she said, “I will go.”
translation:
  language: zh_hans
  text: 于是他们叫来利百加，问她：“你愿意跟这个人一起去吗？”她说：“我去。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרְאוּ לְרִבְקָה
  choice: 他们叫来利百加
  rationale: קרא 在此指叫某人来参与商议。“叫来”自然地表达了这一语境，又不带“召见”可能具有的强制意味；“利百加”采用现代中文圣经中通行的人名译法。
- source_word: וַיֹּאמְרוּ אֵלֶיהָ
  choice: 问她
  rationale: 原文直译为“对她说”，但随后直接引出问句；现代汉语用“问她”更自然，并未改变话语功能。
- source_word: הֲתֵלְכִי
  choice: 你愿意……走吗
  rationale: 该疑问形式在此询问利百加是否肯同行。中文“愿意……吗”自然表达意愿性问句；并未把动词 הלך 本身改译为“愿意”，核心动作仍由“走”表达。
- source_word: עִם הָאִישׁ הַזֶּה
  choice: 跟这个人
  rationale: אִישׁ 是“人、男人”；尽管所指是亚伯拉罕的仆人，原文此处没有使用“仆人”，因此保留“这个人”。“跟”符合自然现代汉语。
- source_word: וַתֹּאמֶר אֵלֵךְ
  choice: 她说：‘我愿意去。’
  rationale: וַתֹּאמֶר 直译为“她说”；אֵלֵךְ 是第一人称单数“我去/我要去”。在对“你愿意……吗”的回答中，“我愿意去”既自然又清楚地表达她肯定同行的决定。
theological_decisions:
- issue: 利百加回答中的意愿色彩
  choice: 我愿意去
  alternative: 我去／我要去
  rationale: אֵלֵךְ 本身是简洁的“我去/我要去”，并未另含“愿意”一词；但它作为对意愿性问题的直接肯定回答，在现代汉语中译作“我愿意去”较为自然。此处不进一步推导有关婚姻同意或其他制度性神学结论。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。叙述简洁，保留“这个人”而不按上下文改成“这个仆人”。无需脚注。
