  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: הִנֵּֽה רִבְקָ֥ה לְ/פָנֶ֖י/ךָ קַ֣ח וָ/לֵ֑ךְ וּ/תְהִ֤י אִשָּׁה֙ לְ/בֶן אֲדֹנֶ֔י/ךָ כַּ/אֲשֶׁ֖ר דִּבֶּ֥ר יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/051.yaml
  text: Look[a], Rebekah is before you. Take her and go, and let her be the wife of your master's son, just as Yahweh has spoken.
translation:
  language: zh_hans
  text: “看，利百加就在你面前。你带她走吧，让她作[a]你主人儿子的妻子，正如雅威所说的。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“成为”。这里的希伯来语可表示“作”或“成为”。
    reason: 保留 היה 在此婚姻表达中“作／成为”的词义幅度。
lexical_decisions:
- source_word: הִנֵּה
  choice: 看
  rationale: 这是引人注意眼前情形的指示词；“看”简洁、现代，也保留了原文鲜明的现场感。
- source_word: רִבְקָה
  choice: 利百加
  rationale: 采用现代中文圣经读者熟悉的希伯来人名传统译法。
- source_word: לְפָנֶיךָ
  choice: 就在你面前
  rationale: 保留“在你面前”的空间表达，同时“就”自然传达她已在场、可由对方作出安排的语用含义。
- source_word: קַח וָלֵךְ
  choice: 你带她走吧
  rationale: 原文是两个连续的命令“取、去”；中文以“带她走”自然表达其合成动作，并按上下文补出宾语“她”。句末“吧”契合此处同意并准许仆人带走利百加的语气。
- source_word: וּתְהִי אִשָּׁה
  choice: 让她作……的妻子
  rationale: 未完成式在此有祈使、许可意味；“让她作”既自然，也保留“让她成为／作”的语义范围。
- source_word: לְבֶן אֲדֹנֶיךָ
  choice: 你主人儿子的
  rationale: לְ 表示婚姻关系所指向的对象；中文“作你主人儿子的妻子”准确而自然。“主人”符合仆人与主人的叙事关系。
- source_word: כַּאֲשֶׁר דִּבֶּר
  choice: 正如……所说的
  rationale: כַּאֲשֶׁר 表示与先前话语相符；该译法保留神已经说话、眼前之事与其相应的含义。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译四字神名，保留其作为专名的性质，不以称号替代。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。译作“雅威”较直接地音译该专名，也避免以“上主”等称号取代神名。
- issue: וּתְהִי 的许可／愿望语气
  choice: 让她作
  alternative: 让她成为；她要作
  rationale: 此处形式可表达许可或愿望，并非单纯预告未来。“让她作”保留说话者同意这桩婚事的语气，而不将其强化为绝对命令或预言。
translation_notes:
  register: 采用现代、庄重而口语可懂的叙事语言。“就在你面前”保留原文意象；“你带她走吧”使连续命令在中文中自然连贯。引号标明本节人物的直接引语。
