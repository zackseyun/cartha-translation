  yaml_path: translation/ot/genesis/024/059.yaml
  text: So they sent away Rebekah their sister[a], and her nurse, and Abraham’s servant, and his men.
translation:
  language: zh_hans
  text: 于是，他们送利百加——他们的姐妹——和她的乳母[a]，以及亚伯拉罕的仆人和他的随从启程。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “乳母”指给婴儿哺乳的女子；或译作“奶妈”。
    reason: 说明原词所指的哺乳妇女，并保留较通俗的中文对应说法。
lexical_decisions:
- source_word: וַיְשַׁלְּחוּ
  choice: 送……离去
  rationale: 此处 שׁלח 的皮埃勒式表示使人离开、送其启程。“送……离去”既体现正式送行的动作，也避免现代汉语“打发走”可能带有的轻蔑意味。
- source_word: רִבְקָה
  choice: 利百加
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: אֲחֹתָם
  choice: 他们的姐妹
  rationale: 原文直指“他们的 sister”。译作“姐妹”保留亲属关系，同时不擅自断定利百加比相关亲属年长或年幼。
- source_word: מֵנִקְתָּהּ
  choice: 她的乳母
  rationale: 该词源自动词 ינק，指给婴儿哺乳的女子。“乳母”在现代中文中简洁、庄重，并准确表达其特定职责。
- source_word: עֶבֶד אַבְרָהָם
  choice: 亚伯拉罕的仆人
  rationale: 属格结构自然译为“亚伯拉罕的仆人”。עֶבֶד 可指奴仆，但本段重在其受托身份，“仆人”较符合语境，也不对其法律身份作过度限定。
- source_word: אֲנָשָׁיו
  choice: 跟随他的人
  rationale: 原文为“他的人”，后缀所指是亚伯拉罕的仆人。“跟随他的人”在中文中自然，并避免把这些人的具体职分擅自定为仆役。
theological_decisions: []
translation_notes:
  register: 采用自然而庄重的现代标准汉语。为避免“妹妹”或“姐姐”加入原文未说明的长幼关系，使用“姐妹”。中文中单次使用“送……离去”统领较长的并列宾语略显费解，因此在第二组宾语前重复“送”，但不改变原文各人一同被送行的意思。
