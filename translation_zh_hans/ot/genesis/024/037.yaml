base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/037.yaml
  text: And my master made me swear[a], saying, ‘You shall not take a wife for my son from the daughters of the Canaanites, in whose land I am dwelling.’
translation:
  language: zh_hans
  text: 我主人曾叫我起誓[a]说：‘你不可从迦南人的女儿中为我儿子娶妻；我正住在他们的土地上[b]。’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“曾使我立誓”。
    reason: 说明使役动词也可用更正式的誓约措辞表达。
  - marker: b
    text: 原文作单数集合用法，直译为“迦南人……我正住在他的土地上”；也可按意思译作“我住在他们中间”。
    reason: 说明“迦南人”的集合单数形式，并保留原文以土地表述居住处的措辞。
lexical_decisions:
- source_word: וַיַּשְׁבִּעֵנִי
  choice: 叫我起誓
  rationale: 使役形式表示使某人起誓；“叫我起誓”自然清楚，也保留了主人要求仆人立誓的含义。
- source_word: אֲדֹנִי
  choice: 我主人
  rationale: 这里指仆人的人间主人亚伯拉罕，不是对上帝的称呼；“我主人”符合叙事中的主仆关系。
- source_word: לֹא תִקַּח אִשָּׁה לִבְנִי
  choice: 你不可……为我儿子娶妻
  rationale: 在誓言所包含的命令中，未完成式带禁止意味；“为我儿子娶妻”准确表达婚配语境。
- source_word: מִבְּנוֹת הַכְּנַעֲנִי
  choice: 从……迦南人中
  rationale: 希伯来语直译为“从迦南人的女儿中”；现代汉语用“从迦南人中……娶妻”更自然，且未改变所指对象。
- source_word: אֲשֶׁר אָנֹכִי יֹשֵׁב בְּאַרְצוֹ
  choice: 我所居住的这片土地上的
  rationale: 原文按字面是“我住在其土地上的”，其中“迦南人”以单数作集合名词；此译保留土地这一表达重点，同时使中文关系清楚。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“不可”保留誓约命令的严肃语气；调整关系从句次序，以符合自然汉语，同时保留原文以“土地”为重点的表述。
