  text: וָ/אָבֹ֥א הַ/יּ֖וֹם אֶל הָ/עָ֑יִן וָ/אֹמַ֗ר יְהוָה֙ אֱלֹהֵי֙ אֲדֹנִ֣/י אַבְרָהָ֔ם אִם יֶשְׁ/ךָ נָּא֙ מַצְלִ֣יחַ דַּרְכִּ֔/י אֲשֶׁ֥ר אָנֹכִ֖י הֹלֵ֥ךְ עָלֶֽי/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/042.yaml
  text: Today I came to the spring and said[a], ‘O Yahweh, God of my master Abraham[b], if now you are prospering my way on which I am going—’
translation:
  language: zh_hans
  text: “我今天来到泉边[a]，说：‘雅威，我主人亚伯拉罕的上帝啊，若你肯使我所走的路[b]顺利——’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“井边”。这里的希伯来词更确切地指泉或水源。
    reason: lexical_alternative
  - marker: b
    text: 原文直译“我的路”；这里的“路”可指仆人的旅程，也可包括他此行所办的事。
    reason: lexical_clarification
lexical_decisions:
- source_word: וָאָבֹא הַיּוֹם
  choice: 我今天来到
  rationale: וַ־连接叙事中的过去动作；הַיּוֹם作时间副词。“我今天来到”既保留“今天”的强调，也符合现代汉语语序。
- source_word: הָעָיִן
  choice: 泉边
  rationale: עַיִן在此指天然涌出的泉或水源；介词אֶל与汉语处所表达结合译为“来到泉边”，比笼统的“井边”更贴近该词本义。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 直接译出四字神名，而不以“主”这一称号替代；“耶和华”是现代中文圣经传统中广为人知的音译。
- source_word: אֱלֹהֵי אֲדֹנִי אַבְרָהָם
  choice: 我主人亚伯拉罕的上帝
  rationale: אֲדֹנִי在这里指仆人的人间主人亚伯拉罕；“我主人”清楚表达其主仆关系，避免误作神圣称号。
- source_word: אִם יֶשְׁךָ נָּא מַצְלִיחַ
  choice: 你若真使……顺利
  rationale: 原文结构简略，אִם保留条件语气，נָא带有恳求或强调色彩，מַצְלִיחַ是使役分词。“若真使……顺利”保留祷告中尚待证实的条件意味，不把它改写成断然陈述。
- source_word: דַּרְכִּי
  choice: 我的路
  rationale: 直译为“我的路”，保留第一人称所有关系；在上下文中可自然理解为仆人所走的旅程或所办的差事。
- source_word: אֲשֶׁר אָנֹכִי הֹלֵךְ עָלֶיהָ
  choice: 我正在走的
  rationale: 原文直义为“我正行在其上的”；中文关系结构“我正在走的路”既保留进行中的行动，也避免生硬重复“在其上”。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用神的专名，而非“主”这一称号。正文采用中文读者最熟悉的传统音译“耶和华”；“雅威”则是按现代学术界常见拟音形成的另一译法。
- issue: 条件式祷告אִם יֶשְׁךָ נָּא מַצְלִיחַ的语气
  choice: 你若真使……顺利
  alternative: 求你使……顺利
  rationale: 选择“若真”保留אִם的条件形式以及原句延续至下一节的未完结构；单译为“求你”虽能表达祈求，却会淡化原文的条件性和悬念。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“耶和华——我主人亚伯拉罕的上帝啊”以破折号和呼语助词呈现祷告中的称呼关系；末尾破折号保留原文在本节结束时尚未说完、继续到下一节的句法张力。
