base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/067.yaml
  text: And Isaac brought her into the tent of Sarah his mother[a], and he took Rebekah, and she became his wife, and he loved her[b]. So Isaac was comforted after his mother's death.
translation:
  language: zh_hans
  text: 以撒把她带进他母亲撒拉的帐篷[a]，娶了利百加；她就成了他的妻子，以撒也爱她。母亲去世以后[b]，以撒得了安慰。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译为“他母亲撒拉的帐篷”。原文中“撒拉”和“他母亲”是同位语，指同一人；两种语序基本意思相同。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“在他母亲之后”，没有明说“去世”；这里按上文撒拉去世的背景译出其含义。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבִאֶהָ
  choice: 把她带进
  rationale: 这是בוא的使役形，带有阴性单数宾语后缀，意思是“使她进入／把她带来”。结合后面的方向词尾，译作“把她带进”最自然。
- source_word: הָאֹהֱלָה
  choice: 进……帐篷
  rationale: אֹהֶל所带的方向词尾表示朝向某处的移动；上下文表明实际进入帐篷，因此译作“进……帐篷”。
- source_word: שָׂרָה אִמּוֹ
  choice: 他母亲撒拉的
  rationale: “撒拉”和“他母亲”构成同位关系，并说明帐篷属于谁。现代汉语用“他母亲撒拉的帐篷”清楚自然。
- source_word: וַיִּקַּח אֶת־רִבְקָה
  choice: 娶了利百加
  rationale: לקח本义为“取、接”，在婚姻语境中表示娶妻。直译成“取了利百加”在现代汉语中生硬，故按语境译作“娶了”。下一分句仍保留“她就成了他的妻子”，没有省略原文的叙事推进。
- source_word: וַתְּהִי לוֹ לְאִשָּׁה
  choice: 她就成了他的妻子
  rationale: היה + ל + אשה表示成为某人的妻子；“她就成了他的妻子”既自然，也保留事件的先后发展。
- source_word: וַיֶּאֱהָבֶהָ
  choice: 以撒也爱她
  rationale: אהב是通常表示“爱”的动词；补出主语“以撒”可使较长的汉语句子更清楚，“也”承接前面的婚姻关系。
- source_word: וַיִּנָּחֵם
  choice: 得了安慰
  rationale: נחם的被动形在这里表示受到安慰，而非懊悔；“得了安慰”符合现代汉语表达。
- source_word: אַחֲרֵי אִמּוֹ
  choice: 母亲去世以后
  rationale: 字面为“在他母亲之后”。结合创世记23章撒拉去世的背景，这里指母亲离世之后；正文作明晰的语境翻译，同时用脚注说明原文没有明说“去世”。
theological_decisions:
- issue: אַחֲרֵי אִמּוֹ是否在正文补明“去世”
  choice: 正文译作“母亲去世以后”，并加脚注说明
  alternative: 直译为“在他母亲之后”
  rationale: 直译在现代汉语中含义不完整，容易造成误解；叙事背景明确指撒拉死后。脚注保留原文简略措辞，避免把语境补足误当成希伯来文的明文。
translation_notes:
  register: 采用现代、庄重而通顺的叙事语体。“娶了”按婚姻语境传达לקח，避免生硬的“取了”；各连续动词分句均予保留。脚注标记[a]、[b]均已置于正文对应位置。
