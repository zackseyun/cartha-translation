base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/005.yaml
  text: And the servant said to him[a], “Perhaps the woman will not be willing to follow me to this land[b]. Should I then take your son back to the land from which you came?”
translation:
  language: zh_hans
  text: 仆人对他说：“也许那女子不愿跟我到这地来。我是否真的要把你的儿子带回你离开的那地吗？[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “真的要把……带回”在希伯来文中用了不定式绝对形和同一动词的限定形式连用，以加强语气；也可译作“我该把你的儿子带回你离开的那地吗？”
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֶבֶד
  choice: 仆人
  rationale: עֶבֶד可指仆人或奴仆；本叙事强调他作为亚伯拉罕家中受命办事的下属身份，“仆人”自然、庄重，也保留等级关系。
- source_word: אוּלַי
  choice: 也许
  rationale: 准确表达可能性和不确定性，符合现代汉语叙事语体。
- source_word: לֹא תֹאבֶה
  choice: 不愿
  rationale: אָבָה表示愿意、同意；“不愿”简洁地保留女子是否愿意同行这一关键含义。
- source_word: הָאִשָּׁה
  choice: 那女子
  rationale: 原文只称“那女人/女子”，尚未称她为妻子；“那女子”在现代汉语中自然，也不额外断定年龄或婚姻身份。
- source_word: לָלֶכֶת אַחֲרַי
  choice: 跟我……来
  rationale: 字面为“走在我后面”，语境义是跟随仆人前来；结合目的地译作“跟我到这地来”最自然。
- source_word: אֶל הָאָרֶץ הַזֹּאת
  choice: 到这地来
  rationale: אֶרֶץ在此指地域；“这地”保留简洁而庄重的圣经叙事风格，“来”体现以当前所在地为指向中心。
- source_word: הֶהָשֵׁב אָשִׁיב
  choice: 我该把……带回……吗
  rationale: 不定式绝对形与限定动词连用，使“带回”受到强调；问句在语境中询问应采取的行动，“该……吗”比“必须……吗”更妥善地保留商议语气。
- source_word: אֶת בִּנְךָ
  choice: 你的儿子
  rationale: 直接对应原文，含义明确，无须扩展。
- source_word: אֶל הָאָרֶץ אֲשֶׁר יָצָאתָ מִשָּׁם
  choice: 你离开的那地
  rationale: 较贴近יָצָא“出去、离开”的词义，同时符合现代汉语；不将其弱化为仅表示籍贯的“你来的地方”。
theological_decisions:
- issue: 仆人是否应把以撒带往亚伯拉罕原居之地
  choice: 保留为仆人的询问：“我该……吗？”
  alternative: 译为带有强制意味的“我必须……吗？”或带强烈强调的“我真要……吗？”
  rationale: 原文提出的是在女子不愿同行这一条件下应如何行动，并未在本节给出答案；译文不预先消解随后经文所呈现的神学与叙事张力。
translation_notes:
  register: 采用现代、清楚而庄重的叙事汉语。“那女子”避免提前称其为新娘或妻子；“跟我到这地来”自然呈现原文“走在我后面”的含义。脚注标记置于完整问句之后。
