  text: וְ֠/עַתָּה אִם יֶשְׁ/כֶ֨ם עֹשִׂ֜ים חֶ֧סֶד וֶֽ/אֱמֶ֛ת אֶת אֲדֹנִ֖/י הַגִּ֣ידוּ לִ֑/י וְ/אִם לֹ֕א הַגִּ֣ידוּ לִ֔/י וְ/אֶפְנֶ֥ה עַל יָמִ֖ין א֥וֹ עַל שְׂמֹֽאל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/049.yaml
  text: Now if you are going to show kindness and faithfulness to my master[a], tell me; but if not, tell me, so that I may turn to the right or to the left.
translation:
  language: zh_hans
  text: 现在，你们若愿意以慈爱和信实待我的主人[a]，就告诉我；若不愿意，也告诉我，好让我转向右边或左边。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“坚定的爱和信实”。这对希伯来词常指忠诚、可靠并落实于行动的慈爱。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: 现在
  rationale: 引出仆人讲话的即时实际结论；现代汉语用“现在”自然清楚。
- source_word: אִם יֶשְׁכֶם עֹשִׂים
  choice: 你们若愿意……待
  rationale: 原文以“有你们”加分词的结构表达是否有意采取行动；“若愿意”保留此处面向将来、要求对方表态的意愿色彩。
- source_word: חֶסֶד וֶאֱמֶת
  choice: 慈爱和信实
  rationale: 这一词组兼含关系中的忠诚善意与可靠可信；“慈爱和信实”保留两个成分，也符合庄重而易懂的现代圣经语体。
- source_word: אֶת אֲדֹנִי
  choice: 待我的主人
  rationale: 宾格标记在此指明慈爱和信实所指向的对象；汉语以“待我的主人”表达最自然。
- source_word: הַגִּידוּ לִי
  choice: 告诉我
  rationale: 直接传达要求对方明确答复的命令语气。
- source_word: וְאִם לֹא
  choice: 若不愿意
  rationale: 原文省略前述行动，中文补出“愿意”以形成自然而明确的对照，同时不添加新的实质内容。
- source_word: וְאֶפְנֶה
  choice: 好让我转向
  rationale: 意愿式表达说话者随后将采取的行动，并带有结果或目的意味；“好让我”自然保留这一功能。
- source_word: עַל יָמִין אוֹ עַל שְׂמֹאל
  choice: 转向右边或左边
  rationale: 保留原文方向性意象，同时中文读者可自然理解为另寻行动方向。
theological_decisions:
- issue: חֶסֶד וֶאֱמֶת 是否应明确译作圣约术语
  choice: 慈爱和信实
  alternative: 坚定的爱和信实；忠诚和可靠
  rationale: 上下文强调对亚伯拉罕一家采取善意而可靠的行动，但本节并未明说“圣约”；正文保留关系忠诚的含义，不把可能的圣约色彩教义化。
translation_notes:
  register: 采用现代、庄重而口语可懂的叙事对话体。“若愿意……若不愿意”体现仆人要求对方立即表态；分号保留两个条件分句之间清楚的对照。
