base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/002.yaml
  text: And Abraham said to his servant[a], the oldest of his household, who ruled over all that belonged to him[b], “Please put your hand under my thigh.”
translation:
  language: zh_hans
  text: 亚伯拉罕对他家中资历最深、掌管他一切所有的仆人说：“请把你的手放在我大腿下面。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 把手放在对方大腿下面，是古代起誓时所用的一种郑重姿势，可能表示严肃的承诺。
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 亚伯拉罕……说
  rationale: 未单独译出连接词 וַ，以符合现代汉语叙事习惯；动词仍按连续叙事的过去事件处理。
- source_word: עַבְדּוֹ
  choice: 他的仆人
  rationale: עֶבֶד 可指奴仆或仆人；本节着重其作为受信任的家中主管身份，译作“仆人”自然且不过度界定其法律地位。
- source_word: זְקַן בֵּיתוֹ
  choice: 他家中年资最深的
  rationale: זָקֵן 可表达年长或资深；此处与“仆人”构成同位说明。“年资最深”保留年龄与资历之间的语义空间，也符合其家中主管的语境。
- source_word: הַמֹּשֵׁל בְּכָל אֲשֶׁר־לוֹ
  choice: 就是管理他一切所有的
  rationale: מֹשֵׁל 表示掌管、治理；中文用“管理”准确表达实际职责，又不暗示独立主权。“他一切所有的”保留原文涵盖全部产业的意思。
- source_word: שִׂים נָא
  choice: 请把……放在
  rationale: 祈使式加 נָא 带有恳请或礼貌语气，现代汉语以“请”自然传达。
- source_word: יָדְךָ
  choice: 你的手
  rationale: 直接对应原文。
- source_word: תַּחַת יְרֵכִי
  choice: 在我大腿下面
  rationale: 按原文直译这一具有古代文化背景的动作，不在正文中加入原文未明说的委婉解释。
