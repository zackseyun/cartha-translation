  yaml_path: translation/ot/genesis/024/029.yaml
  text: Rebekah had a brother[a], and his name was Laban; and Laban ran out to the man[b], outside by the spring.
translation:
  language: zh_hans
  text: 利百加有一个兄弟[a]，名叫拉班。拉班跑到外面，往泉边那人那里去[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文只说“兄弟”，没有说明是哥哥还是弟弟。
    reason: lexical_ambiguity
  - marker: b
    text: 原文直译为“跑到外面，往那人那里，往泉那里”；后两个方向短语的关系也可理解为那人在泉边。
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: וּלְרִבְקָה אָח
  choice: 利百加有一个兄弟
  rationale: 希伯来语以“对利百加有……”的所有结构表达“利百加有……”。אָח意为男性同胞，但未说明年长或年幼，因此不用“哥哥”或“弟弟”。句首וּ承接上文，汉语无需机械译出“并且”。
- source_word: וּשְׁמוֹ לָבָן
  choice: 名叫拉班
  rationale: 这是常见的希伯来语命名表达；译作“名叫拉班”简洁、自然，并保留人名音译。
- source_word: וַיָּרָץ
  choice: 跑
  rationale: 该动词的基本义是“跑”；方向由后续成分表达，不将其弱化为“赶忙”。
- source_word: אֶל־הָאִישׁ
  choice: 到……那人那里
  rationale: אֶל表示朝向或到达某人所在之处。“那人”保留原文通称，不直接解释为亚伯拉罕的仆人。
- source_word: הַחוּצָה
  choice: 到外面
  rationale: 方向形式表示“向外、到外面”，与“跑”自然结合，且不遗漏原文空间信息。
- source_word: אֶל־הָעָיִן
  choice: 泉边
  rationale: עַיִן在此指天然涌出的泉水，与通常表示井的בְּאֵר有别。“泉边”在主译中自然说明那人所在的位置，同时脚注保留两个אֶל短语并列理解的可能。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事用语。“兄弟”虽比“哥哥”略显书面，却避免加入原文没有提供的年龄次序。分为两句以符合现代汉语节奏；“跑到外面泉边那人那里”保留动作、向外方向、人物目标和泉边地点。
