  text: וַ/יִּקַּ֣ח הָ֠/עֶבֶד עֲשָׂרָ֨ה גְמַלִּ֜ים מִ/גְּמַלֵּ֤י אֲדֹנָי/ו֙ וַ/יֵּ֔לֶךְ וְ/כָל ט֥וּב אֲדֹנָ֖י/ו בְּ/יָד֑/וֹ וַ/יָּ֗קָם וַ/יֵּ֛לֶךְ אֶל אֲרַ֥ם נַֽהֲרַ֖יִם אֶל עִ֥יר נָחֽוֹר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/010.yaml
  text: Then the servant took ten of his master's camels and went[a], with all kinds of good things from his master in his hand. And he arose and went to Aram-naharaim[d][c][b], to the city of Nahor.
translation:
  language: zh_hans
  text: 仆人从他主人的骆驼中带了十匹，就出发了；主人各样美物都在他手中[a]。他起身前往亚兰·拿哈拉音[b]，到拿鹤的城去[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他掌管着主人各样财物。”原文“在他手中”可表示持有、支配或负责。
    reason: lexical_alternative
  - marker: b
    text: “亚兰·拿哈拉音”传统上译作“美索不达米亚”或“二河亚兰”。
    reason: alternative_reading
  - marker: c
    text: “拿鹤的城”也可理解为与拿鹤有关的城；原文没有具体说明二者的关系。
    reason: ambiguity
lexical_decisions:
- source_word: הָעֶבֶד
  choice: 仆人
  rationale: עֶבֶד可指仆人或奴仆；本段着重其受主人委托办事的身份，因此译作现代汉语自然的“仆人”，不额外强调其法律身份。
- source_word: עֲשָׂרָה גְמַלִּים מִגְּמַלֵּי אֲדֹנָיו
  choice: 从他主人的骆驼中牵了十匹
  rationale: 保留מן所表达的部分关系，即这十匹是从主人所有的骆驼中选取的；“牵”符合汉语中取用骆驼的自然表达。
- source_word: וַיֵּלֶךְ
  choice: 便出发了
  rationale: הלך的基本意义是“去、行走”；此处尚未紧接目的地，译作“出发”较符合汉语叙事，同时不与后文目的地短语强行合并。
- source_word: וְכָל טוּב אֲדֹנָיו בְּיָדוֹ
  choice: 他主人的一切贵重物品都在他手中
  rationale: טוּב在语境中指主人的财物或用于馈赠的好东西；“在他手中”保留希伯来语的具体意象，也可自然表达由他持有、支配或负责。
- source_word: וַיָּקָם וַיֵּלֶךְ
  choice: 他起身前往
  rationale: 保留קום所标示的起身行动，并以“前往”自然承接目的地；不把两个动词完全压缩为一个。
- source_word: אֲרַם נַהֲרַיִם
  choice: 亚兰·拿哈拉音
  rationale: 按希伯来语地名音译，而不直接采用带有解释性的传统名称“美索不达米亚”或意译“二河亚兰”。
- source_word: עִיר נָחוֹר
  choice: 拿鹤的城
  rationale: 直译该附属结构，保留这座城与拿鹤之间关系的开放性，不断定拿鹤是建城者或城的所有者。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“便出发了；……他起身前往”保留原文连续出现הלך及随后קום־הלך的叙事节奏；分号帮助汉语读者理解插入的财物说明。地名采用音译，并用脚注提供传统译法。
