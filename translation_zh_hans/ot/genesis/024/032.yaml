base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/032.yaml
  text: So the man came into the house and unloaded the camels and gave straw and feed to the camels[b][a], and water to wash his feet and the feet of the men who were with him.
translation:
  language: zh_hans
  text: 那人进了屋。有人给骆驼卸下驮具[a]，给骆驼秸秆和饲料，又给那人和跟他同来的人洗脚用的水。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“打开骆驼”，是指松开或解下骆驼身上的驮具，使其得到安顿；也可译作“解开骆驼”或“卸下骆驼的装备”。
    reason: 说明希伯来语习语及可行译法，避免将其限定为卸货。
  - marker: b
    text: 原文没有再次明说是谁卸下驮具、供应秸秆、饲料和水；语法上可承接“那人”，按上下文也可能指接待他的拉班。
    reason: 保留原文中未具名施事者的真实歧义，避免擅自补名。
lexical_decisions:
- source_word: וַיָּבֹא הָאִישׁ הַבַּיְתָה
  choice: 那人进了屋
  rationale: 保留原文“那人”，不把身份解释性地改为“仆人”；方向词尾表明进入屋内。
- source_word: וַיְפַתַּח הַגְּמַלִּים
  choice: 给骆驼卸下驮具
  rationale: פתח本义为“打开”，此处与骆驼连用，指松开或取下所负的装备；“卸下驮具”既符合场景，又避免把具体动作限定为单纯卸货或解鞍。
- source_word: תֶּבֶן וּמִסְפּוֹא
  choice: 草和饲料
  rationale: תבן指秸秆、干草一类的牲畜用料，מספוא泛指饲料；用两个并列名词保留原文的区分。
- source_word: וּמַיִם לִרְחֹץ רַגְלָיו וְרַגְלֵי הָאֲנָשִׁים אֲשֶׁר אִתּוֹ
  choice: 又拿水给那人和跟他同来的人洗脚
  rationale: 目的不定式译为“给……洗脚”；按叙事情境明确水是供来客一行洗脚，同时保留“跟他同来的人”的关系从句。
theological_decisions:
- issue: 卸驮具、供草料和水等动作的施事者
  choice: 正文用“有人”保留未具名的施事者，并以脚注说明歧义
  alternative: 把后续动词都理解为“那人”所做，或直接补出“拉班”作主语
  rationale: 希伯来语后续两个动词都是第三人称阳性单数，却没有重新写出主语；形式上可延续“那人”，叙事情境也可理解为主人拉班在接待客人。正文不直接补入原文未出现的“拉班”，也不强行断定是客人亲自招待自己。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“驮具”比“装备”更切合骆驼旅行场景；“饲料”比“饲草”更能与前面的“草”形成原文所具的并列区分。正文借“有人”避免在原文未明说处武断指定施事者。
