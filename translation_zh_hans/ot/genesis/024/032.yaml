    issue: “拿水给那人和跟他同来的人洗脚”可能表示有人替他们洗脚。
    rationale: לִרְחֹץ表达水的用途，即供那人及随行者洗脚；原文并未说施事者为他们洗脚。应改为“给……洗脚用的水”。
  - severity: low
    issue: “草”对תבן过于宽泛。
    rationale: תבן通常是经脱粒后作牲畜饲用的秸秆／麦秆；译为“秸秆”能更准确地区别于广义的“饲料”。
  - severity: low
