revisions:
- from: 那人进了屋。有人给骆驼卸下驮具[a]，拿草和饲料喂骆驼，又拿水给那人和跟他同来的人洗脚。[b]
  to: 那人进了屋。有人给骆驼卸下驮具[a]，给骆驼秸秆和饲料，又给那人和跟他同来的人洗脚用的水。[b]
  rationale: 修订仅澄清水是供来客自行洗脚之用，并提高“秸秆”及习语脚注的词义精确度。后续动作的施事者仍以“有人”不具名处理，并保留说明性脚注，既不将其强定为那人，也不在正文补入原文没有明说的拉班。
