source:
  edition: WLC
  text: וַ/יֹּאמַ֓ר יְהוָ֗ה אֱלֹהֵי֙ אֲדֹנִ֣/י אַבְרָהָ֔ם הַקְרֵה נָ֥א לְ/פָנַ֖/י הַ/יּ֑וֹם וַ/עֲשֵׂה חֶ֕סֶד עִ֖ם אֲדֹנִ֥/י אַבְרָהָֽם׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/012.yaml
  text: And he said[a], “O Yahweh, God of my master Abraham, please grant success before me today[c][b], and show steadfast love to my master Abraham.”
translation:
  language: zh_hans
  text: 他说：“雅威，我主人亚伯拉罕的上帝啊，求你今天使这事在我面前发生[a]，并向我主人亚伯拉罕施慈爱[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“求你今天使这事在我面前成就”。原文的动词表示求上帝促成所盼望的事；“在我面前”也可指这事临到说话者面前。
    reason: 保留 הַקְרֵה נָא לְפָנַי הַיּוֹם 的使役语气及“在我面前”的表达，并说明自然的译法空间。
  - marker: b
    text: “慈爱”所译的希伯来语也可表示忠贞的恩慈或信实的爱。
    reason: 说明 חֶסֶד 的丰富语义，避免将其理解为一般性的好意。
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语中对四字神名的常见音译“雅威”呈现专名，不以称号代替。
- source_word: אֱלֹהֵי אֲדֹנִי אַבְרָהָם
  choice: 我主人亚伯拉罕的上帝
  rationale: 保留属格结构；按仆人与亚伯拉罕的关系，将 אֲדֹנִי 译为“我主人”，自然且明确。
- source_word: הַקְרֵה נָא לְפָנַי הַיּוֹם
  choice: 求你使我今天所行的顺利
  rationale: הַקְרֵה 是 קרה 的使役命令式，请求上帝促成即将发生的相遇；“使……顺利”在汉语祷告中自然，并保留上帝主动安排事情的含义。“求”体现 נָא 的恳请语气。
- source_word: וַעֲשֵׂה חֶסֶד
  choice: 施慈爱
  rationale: “施”自然对应 עשה 与 חֶסֶד 的搭配；“慈爱”既包含恩慈，也能承载忠贞、持守关系的意味。
- source_word: עִם אֲדֹנִי אַבְרָהָם
  choice: 向我主人亚伯拉罕
  rationale: עִם 字面为“与”，但与“施慈爱”组合时，现代汉语用“向”更自然，意义不变。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；采用“雅威”音译以明确呈现其专名性质，同时不把它替换为“主”等称号。
- issue: חֶסֶד 的语义范围
  choice: 慈爱
  alternative: 恩待；忠贞之爱
  rationale: “慈爱”能兼顾仁慈与忠贞之意，而不在正文中将该词过度限定为某一种系统神学意义；脚注提示其更宽的语义范围。
- issue: הַקְרֵה 的使役与上帝护理
  choice: 使我今天所行的顺利
  alternative: 使这事今天在我面前发生
  rationale: 上下文是仆人求上帝促成合宜的相遇。“顺利”表达实际功能意义，但脚注保留原文“使事情发生在我面前”的具体意象和使役色彩。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“上帝啊，求你……”符合祷告语体；避免古奥句式。“所行的顺利”承接本段寻找妻子的使命，又不过度明说尚未发生的具体相遇。
