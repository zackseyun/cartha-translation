  text: וַֽ/יְהִי ה֗וּא טֶרֶם֮ כִּלָּ֣ה לְ/דַבֵּר֒ וְ/הִנֵּ֧ה רִבְקָ֣ה יֹצֵ֗את אֲשֶׁ֤ר יֻלְּדָה֙ לִ/בְתוּאֵ֣ל בֶּן מִלְכָּ֔ה אֵ֥שֶׁת נָח֖וֹר אֲחִ֣י אַבְרָהָ֑ם וְ/כַדָּ֖/הּ עַל שִׁכְמָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/015.yaml
  text: And it happened[a], before he had finished speaking, that behold, Rebekah was coming out—she who had been born to Bethuel son of Milcah, the wife of Nahor[b], Abraham’s brother—with her jar on her shoulder.
translation:
  language: zh_hans
  text: 他还没有说完话，看哪[a]，利百加正走出来；她是彼土利所生的。彼土利是密迦所生的儿子；密迦是拿鹤的妻子，拿鹤是亚伯拉罕的兄弟。利百加的罐子在她肩上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “看哪”也可译作“你看”；原文用这个词引导读者注意眼前突然出现的情景。
    reason: discourse_marker
lexical_decisions:
- source_word: וַיְהִי הוּא טֶרֶם כִּלָּה לְדַבֵּר
  choice: 就在他还没有说完的时候
  rationale: 将叙事引入语 וַיְהִי 与时间从句合并为自然的现代汉语；“还没有说完”准确表达 טֶרֶם 与“完成”义。
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留原文提示读者注意、使场景顿显眼前的叙事功能，并维持庄重语体。
- source_word: יֹצֵאת
  choice: 正走出来
  rationale: 阴性单数分词呈现正在进行的动作；“正……出来”比单纯的“出来了”更能保留其动态画面。
- source_word: אֲשֶׁר יֻלְּדָה לִבְתוּאֵל
  choice: 她是彼土利所生的
  rationale: 保留 ילד 被动式所表达的亲子血缘关系；汉语用“所生的”自然承接人物身世说明。
- source_word: בֶּן מִלְכָּה אֵשֶׁת נָחוֹר אֲחִי אַבְרָהָם
  choice: 彼土利是密迦给亚伯拉罕的兄弟拿鹤所生的儿子
  rationale: 明确原文同位结构中的关系：彼土利是密迦之子，密迦是拿鹤之妻，拿鹤是亚伯拉罕的兄弟；这样避免汉语连续属格造成误读。
- source_word: כַדָּהּ
  choice: 罐子
  rationale: כַּד 指盛装或汲取液体的罐类器皿；本节原文未明说“水”，故不在正文增补。
- source_word: עַל שִׁכְמָהּ
  choice: 肩上扛着
  rationale: 表达器皿位于肩上的携带方式；“扛着”是自然、清楚的现代汉语。
theological_decisions: []
