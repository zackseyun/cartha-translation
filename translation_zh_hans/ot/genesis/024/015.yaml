    rationale: “密迦给……拿鹤所生的儿子”不是自然的现代汉语表达。原文依次说明彼土利是密迦之子，密迦是拿鹤之妻，拿鹤是亚伯拉罕之兄弟；应明确呈现这些关系。
  - severity: low
