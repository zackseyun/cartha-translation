id: GEN.24.21
reference: Genesis 24:21
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/הָ/אִ֥ישׁ מִשְׁתָּאֵ֖ה לָ֑/הּ מַחֲרִ֕ישׁ לָ/דַ֗עַת הַֽ/הִצְלִ֧יחַ יְהוָ֛ה דַּרְכּ֖/וֹ אִם לֹֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/021.yaml
  text: The man watched her silently[a], to know whether Yahweh had made his journey successful or not.
translation:
  language: zh_hans
  text: 那人默默地注视着她[a]，要知道雅威是否使他的行程顺利。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“那人惊讶地望着她，一言不发。”
    reason: 原词除专注观看外，也可能含惊讶、诧异的意味；相邻分词可直译为“保持沉默”。
lexical_decisions:
- source_word: הָאִישׁ
  choice: 那人
  rationale: 原文用普通名词“那人”，虽按上下文是亚伯拉罕的仆人，此处不将其身份直接写入译文。
- source_word: מִשְׁתָּאֵה לָהּ
  choice: 注视着她
  rationale: 该分词表示持续、专注地观看，也可能含惊讶或诧异之意；“注视着她”自然地保留观察的持续性，而不在正文中坐实情绪色彩。
- source_word: מַחֲרִישׁ
  choice: 默默地
  rationale: 该分词意为保持安静、不出声；用副词表达其观看时的状态，符合现代汉语。
- source_word: לָדַעַת
  choice: 要知道
  rationale: 不定式表达目的；“要知道”贴近原文，同时在此语境中可理解为想要查明。
- source_word: הַהִצְלִיחַ
  choice: 使……顺利
  rationale: צָלַח的使役式表达“使之成功、顺利”；此译保留使役关系。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按专名音译四字神名，不以“主”这一称号替代。
- source_word: דַּרְכּוֹ
  choice: 他的行程
  rationale: דֶּרֶךְ本义为道路、路途，此处指那人所进行的旅程或任务；“行程”既自然又符合叙事语境。
- source_word: אִם לֹא
  choice: 是否
  rationale: 在间接疑问句中表达“是否……”，现代汉语无需另加“还是没有”即可完整传达正反疑问。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较贴近学界通常采用的读音重构，并保留其作为专名的性质，而不是改译为称号。
- issue: 雅威是否已使行程顺利
  choice: 保留为尚待确认的间接疑问
  alternative: 译成那人已经认定雅威使行程顺利
  rationale: 原文表达那人仍在观察，要知道结果是否出于雅威所赐的成功；译文不预先替他作出判断。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“默默地注视着”呈现两个同时进行的分词动作；脚注保留“惊讶”这一可能但不确定的词义。
