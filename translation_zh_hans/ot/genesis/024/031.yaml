base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/031.yaml
  text: And he said[a], “Come in, blessed of Yahweh. Why do you stand outside? I have prepared the house, and a place for the camels.”
translation:
  language: zh_hans
  text: 他说：“蒙雅威赐福的人啊，请进来！你为什么站在外面呢？我已经腾出了房子，也为骆驼预备了地方。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 他说
  rationale: 以简洁的叙事承接表达希伯来语 wayyiqtol；中文无需机械加入“于是”或“并且”。
- source_word: בּוֹא
  choice: 请进来
  rationale: 命令式本义为“来、进入”；款待语境中译作“请进来”自然得体，并明确进入住所的含义。
- source_word: בְּרוּךְ יְהוָה
  choice: 蒙雅威赐福的人
  rationale: 被动分词与神名连用，在此充当称呼；此译保留“蒙福”状态，也自然表达其称呼功能。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，保留专名性质，不以称号替代。
- source_word: לָמָּה תַעֲמֹד בַּחוּץ
  choice: 为什么站在外面呢？
  rationale: 直接保留疑问以及“站立／停留在外面”的位置含义；语气词“呢”使现代汉语邀请语气自然。
- source_word: פִּנִּיתִי הַבַּיִת
  choice: 我已经收拾好房屋
  rationale: פנה 在此有清理、腾出和预备之意；“收拾好”兼顾具体动作与款待所需的预备结果。
- source_word: וּמָקוֹם לַגְּמַלִּים
  choice: 也为骆驼预备了地方
  rationale: 保留 מקום 的宽泛“地方”，不额外指定拴系、喂养或住宿等原文未明说的用途。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华／上主
  rationale: 原文直接使用四字神名；译作“雅威”保留其专名性质，避免以称号取代，也不把较晚形成的传统读音当作原始发音。
- issue: בְּרוּךְ יְהוָה 中赐福者与所属关系
  choice: 蒙雅威赐福的人
  alternative: 属雅威的蒙福者
  rationale: 希伯来语结构可理解为“被雅威赐福”或“雅威的蒙福者”。正文采用现代汉语较自然且符合被动分词的表达，但不扩展为更具体的盟约身份主张。
translation_notes:
  register: 采用现代、庄重而口语可懂的款待用语。“请进来”与“呢”使直接引语自然；“房屋”比“家”更贴近 הַבַּיִת 的具体住所含义。
