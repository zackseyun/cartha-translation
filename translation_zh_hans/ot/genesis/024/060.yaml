  text: וַ/יְבָרֲכ֤וּ אֶת רִבְקָה֙ וַ/יֹּ֣אמְרוּ לָ֔/הּ אֲחֹתֵ֕/נוּ אַ֥תְּ הֲיִ֖י לְ/אַלְפֵ֣י רְבָבָ֑ה וְ/יִירַ֣שׁ זַרְעֵ֔/ךְ אֵ֖ת שַׁ֥עַר שֹׂנְאָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/060.yaml
  text: And they blessed Rebekah and said to her[a], “Our sister, may you become thousands of ten thousands[b], and may your offspring possess the gate of those who hate them.”
translation:
  language: zh_hans
  text: 他们为利百加祝福，对她说：“我们的妹妹啊，愿你成为千千万万人的母亲[a]；愿你的后裔占领恨你后裔之人的城门[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“愿你成为千个一万”，即“千个万”；这是祝愿后代极其众多的数字夸张表达。正文补出“人的母亲”，使中文意思自然明确。
    reason: 说明希伯来语数词短语及正文为中文自然度所作的隐含补足。
  - marker: b
    text: 或译“愿你的后裔拥有恨他之人的城门”。原文以单数“他”回指集合名词“后裔”；“城门”既指具体的城门，也象征一座城的防御和控制权。
    reason: 交代ירש的可译法、集合单数回指，并说明城门意象。
lexical_decisions:
- source_word: וַיְבָרֲכוּ
  choice: 为……祝福
  rationale: 此处是向利百加说出祝福的话；“为……祝福”直接、自然，并保留正式祝福的动作。
- source_word: רִבְקָה
  choice: 利百加
  rationale: 采用现代中文圣经语境中通行且易识别的人名译法。
- source_word: אֲחֹתֵנוּ
  choice: 我们的妹妹啊
  rationale: 这是家人对利百加的呼语；按上下文她是家中的妹妹，用“妹妹”比泛称“姐妹”更自然，“啊”体现呼语语气。
- source_word: הֲיִי לְאַלְפֵי רְבָבָה
  choice: 愿你成为千千万万人的母亲
  rationale: 希伯来语字面为“愿你成为千个万”，是祝愿她繁衍出极多后代的数字夸张语。中文补出“人的母亲”使隐含意义清楚，同时以脚注保留字面形式。
- source_word: וְיִירַשׁ
  choice: 愿……占领
  rationale: ירש在此与敌对者的城门连用，侧重取得并控制；“占领”自然表达得胜控制之意。
- source_word: זַרְעֵךְ
  choice: 你的后裔
  rationale: 希伯来语是集合单数“种子、后裔”；中文“后裔”既自然，也可保持集合性而不限定为单个或多个。
- source_word: שַׁעַר
  choice: 城门
  rationale: 古代城市的门是防御、权力与控制的关键所在；译作“城门”保留具体意象，并避免现代读者误解为普通门户。
- source_word: שֹׂנְאָיו
  choice: 恨他之人
  rationale: 原文是带阳性单数代词的分词结构，直译为“恨他的人”。保留单数“他”，使其与集合单数“后裔”的语法呼应，不擅自改成复数。
theological_decisions:
- issue: 集合单数“后裔”及其单数回指
  choice: 你的后裔……恨他之人
  alternative: 你的后代……恨他们的人／他的仇敌
  rationale: זַרְעֵךְ是集合单数，שֹׂנְאָיו以阳性单数后缀回指。中文虽可按意义改用复数，但保留“后裔……他”更忠实呈现原文的语法张力及族长应许语言的文学呼应，同时不把它限定为某一个个体。
- issue: “城门”的胜利意象
  choice: 占领……城门
  alternative: 承受……城门／控制……城池
  rationale: 城门代表一座城的防御和控制权。正文保留具体意象，不将其完全抽象化为“战胜仇敌”；脚注说明其含义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“千千万万”传达原文夸张的繁衍祝愿；“占领……城门”保留古代战争与城市控制的具体图像。正文有两处脚注标记[a]、[b]，均与脚注对应。
