base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/039.yaml
  text: And I said to my master[a], ‘Perhaps the woman will not follow me.’
translation:
  language: zh_hans
  text: 我对我主人说：“也许那女子不会跟我走。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאֹמַר
  choice: 我……说
  rationale: 叙事性 wayyiqtol 推进过去事件；汉语不必机械译出连接词“于是/而”，句序已自然表达承接。
- source_word: אֶל־אֲדֹנִי
  choice: 对我主人
  rationale: אָדוֹן 加第一人称单数后缀在此指亚伯拉罕，即仆人的人间主人；“我主人”准确表达社会关系，也避免与神圣称号混淆。
- source_word: אֻלַי
  choice: 也许
  rationale: 该语气词表示可能或不确定；“也许”是现代汉语中自然且庄重适中的表达。
- source_word: לֹא תֵלֵךְ הָאִשָּׁה אַחֲרָי
  choice: 那女子不肯跟我来
  rationale: הלך אַחֲרֵי 字面为“走在……后面”，此处惯用义是随从来人同行；结合婚事语境，“不肯”自然表达女子可能不愿同行，但不把 הָאִשָּׁה 提前解释为“妻子”或“新娘”。
- source_word: הָאִשָּׁה
  choice: 那女子
  rationale: 名词本义为“女人/女子”，定冠词指向上下文所谈的特定对象；“那女子”自然且不预先赋予她妻子身份。
theological_decisions: []
translation_notes:
  register: 采用现代、清楚而庄重的叙事汉语。“跟我来”比直译“走在我后面”更符合普通读者的表达习惯；本节无须脚注，因为这一惯用表达未造成实质性歧义。
