base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/045.yaml
  text: Before I had finished speaking in my heart[a], behold, Rebekah came out with her jar on her shoulder, and she went down to the spring and drew water. Then I said to her[b], ‘Please give me a drink.’
translation:
  language: zh_hans
  text: 我还没有在心里说完话[a]，看哪，利百加就出来了，肩上扛着水罐。她下到泉边[b]打水。我就对她说：‘请给我水喝。’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“对我的心说话”，指内心的话，也可能指默祷。
    reason: lexical_alternative
  - marker: b
    text: 或译“泉源”。这里的希伯来词指泉，不是通常表示“井”的词。
    reason: lexical_alternative
lexical_decisions:
- source_word: טֶרֶם אֲכַלֶּה
  choice: 还没有说完
  rationale: טֶרֶם与未完成式合用，表示在参照时点动作尚未完成；中文用“还没有……完”自然保留这一时间关系。
- source_word: לְדַבֵּר אֶל־לִבִּי
  choice: 在心里说
  rationale: 原文直译为“对我的心说话”，在本段指内心的话或默祷；正文采用自然中文，同时以脚注保留希伯来语表达。
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 该话语标记使人物的出现显得突然、鲜明；“看哪”保留其叙事强调，并符合庄重经文语体。
- source_word: רִבְקָה
  choice: 利百加
  rationale: 采用现代中文圣经传统中广为人知且稳定的人名译法。
- source_word: יֹצֵאת
  choice: 就出来了
  rationale: 分词置于הִנֵּה之后呈现眼前发生的鲜活动作；“就出来了”兼顾即时感与自然中文叙事。
- source_word: כַדָּהּ
  choice: 水罐
  rationale: כַּד指用于汲水的罐或瓶；“水罐”在中文中清楚说明器物用途而不过度具体化材质。
- source_word: עַל־שִׁכְמָהּ
  choice: 肩上扛着
  rationale: 原文意为“在她肩上”；中文用“肩上扛着”自然表达携带水罐的姿态。
- source_word: וַתֵּרֶד הָעַיְנָה
  choice: 她下到泉边
  rationale: עַיִן在此指天然涌出的泉，而非通常表示水井的בְּאֵר；“下到泉边”也保留了动词“下去”的地势信息。
- source_word: וַתִּשְׁאָב
  choice: 打水
  rationale: שׁאב意为汲水；“打水”是现代汉语中自然、准确的表达。
- source_word: הַשְׁקִינִי נָא
  choice: 请给我水喝
  rationale: 使役命令式意为“给我喝”，נָא表示礼貌请求；“请给我水喝”准确且口语自然。
theological_decisions:
- issue: 内心言语是否明确解释为祷告
  choice: 正文译作“在心里说”，不直接增添“祷告”
  alternative: 在心里祷告
  rationale: 上下文表明这是向上帝所发的内心请求，但本节希伯来文只说“对我的心说话”；保留原文的表达范围，避免在正文中把隐含意义明说。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“看哪”保留原文突显利百加突然出现的叙事效果；引语用简洁自然的请求语气。脚注标记均紧随相关词句。
