  text: וְ/אַבְרָהָ֣ם זָקֵ֔ן בָּ֖א בַּ/יָּמִ֑ים וַֽ/יהוָ֛ה בֵּרַ֥ךְ אֶת אַבְרָהָ֖ם בַּ/כֹּֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/001.yaml
  text: Abraham was old[a], advanced in years, and Yahweh had blessed Abraham in all things.
translation:
  language: zh_hans
  text: 亚伯拉罕老了，年事已高[a]；耶和华在一切事上都赐福给亚伯拉罕。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “年事已高”希伯来文直译为“进入日子中”，是指年岁很高的习语。
    reason: 说明原文习语的字面形象与实际含义。
lexical_decisions:
- source_word: וְ/אַבְרָהָם
  choice: 亚伯拉罕
  rationale: 句首的连接词 וְ 在此承接叙事并开启新的段落；现代汉语无需机械译作“而”或“现在”，上下文即可体现衔接。
- source_word: זָקֵן
  choice: 老了
  rationale: 直接表达亚伯拉罕已经年老，语言自然明白，并与下文的年龄习语形成强调。
- source_word: בָּא בַּ/יָּמִים
  choice: 年事已高[a]
  rationale: 这是希伯来语习语，字面为“进入日子中”，实际指年岁很高；正文采用自然、庄重的现代汉语，脚注保留原文形象。
- source_word: וַֽ/יהוָה
  choice: 耶和华
  rationale: 原文明确使用神的专名四字神名；“耶和华”是简体中文圣经语境中广为人知的专名形式，不以称号“主”替代。
- source_word: בֵּרַךְ
  choice: 都赐福给
  rationale: 完成式在此概括截至当时持续有效的赐福背景；汉语用“都”与“一切事上”配合，表达其全面性。
- source_word: בַּ/כֹּל
  choice: 在一切事上
  rationale: 表达赐福范围的全面性，同时不把意义限定为物质财富。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；主
  rationale: 原文使用神的专名，因此正文保留专名而不改成称号“主”。“耶和华”在现代中文读者中辨识度最高；“雅威”更接近学界常见的拟音，但未完全确定原始读音。
- issue: בַּכֹּל 所指赐福的范围
  choice: 在一切事上
  alternative: 用一切所有的赐福；凡事赐福
  rationale: 原文可概括各方面的福分，并未明确只指财物；采用宽泛表达，以免缩窄其含义。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“老了，年事已高”保留原文两重表达的强调；后半句重复“亚伯拉罕”，对应希伯来文的重复，不改为代词。
