  text: וָ/אֶקֹּ֥ד וָֽ/אֶשְׁתַּחֲוֶ֖ה לַ/יהוָ֑ה וָ/אֲבָרֵ֗ךְ אֶת יְהוָה֙ אֱלֹהֵי֙ אֲדֹנִ֣/י אַבְרָהָ֔ם אֲשֶׁ֤ר הִנְחַ֨/נִי֙ בְּ/דֶ֣רֶךְ אֱמֶ֔ת לָ/קַ֛חַת אֶת בַּת אֲחִ֥י אֲדֹנִ֖/י לִ/בְנֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/048.yaml
  text: Then I bowed down and worshiped Yahweh[a], and I blessed Yahweh, the God of my master Abraham, who led me on the true way to take the daughter of my master's brother for his son.
translation:
  language: zh_hans
  text: 于是我低头，俯伏敬拜雅威，又称颂雅威——我主人亚伯拉罕的上帝；他引导我走在真实可靠的道路上[a]，去为我主人的儿子迎娶我主人兄弟的女儿。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译“在真实（或信实）的道路上”。这句话既可指正确、可靠的道路，也可强调雅威的引导信实可靠。
    reason: 说明אֱמֶת在此可表达真确、可靠，也可强调神信实可靠的引导；避免将短语限定为单一含义。
lexical_decisions:
- source_word: וָאֶקֹּד וָאֶשְׁתַּחֲוֶה
  choice: 我低头，俯伏敬拜
  rationale: 分别保留“低头屈身”和“俯伏敬拜”两个相连的动作，同时采用自然、庄重的现代汉语表达。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以常见的现代汉语音译保留四字神名，将其呈现为专名而非用称号替代。
- source_word: וָאֲבָרֵךְ
  choice: 称颂
  rationale: בּרך以神为宾语时表示宣扬、赞美神；“称颂”既符合汉语圣经语体，也避免让现代读者误解为人向神赐福。
- source_word: אֱלֹהֵי אֲדֹנִי אַבְרָהָם
  choice: 我主人亚伯拉罕的上帝
  rationale: 此处אֲדֹנִי指仆人的人间主人亚伯拉罕，因此译作“主人”，不作神圣称号。
- source_word: הִנְחַנִי
  choice: 引导我
  rationale: 准确表达נחה使役式在此处“带领、引导”的含义。
- source_word: בְּדֶרֶךְ אֱמֶת
  choice: 走在真实的道路上
  rationale: 保留אֱמֶת“真实、信实、可靠”的语义张力，不仅将其窄化为方向正确的“正路”；脚注说明可理解的不同侧重。
- source_word: לָקַחַת ... לִבְנוֹ
  choice: 为……的儿子娶到
  rationale: 在婚姻安排的语境中，“娶到”比机械直译“取来”更符合现代汉语，又保留目的和结果意味。
- source_word: בַּת אֲחִי אֲדֹנִי
  choice: 我主人兄弟的女儿
  rationale: 按原文亲属称谓直译，不在正文中依据族谱将宽泛或压缩的亲属表达改写为“孙女”或“后裔”。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华／主
  rationale: 原文直接使用四字神名；“雅威”保留其专名性质，不以“主”这一称号替代。
- issue: בְּדֶרֶךְ אֱמֶת中אֱמֶת的语义
  choice: 真实的道路
  alternative: 正路／信实可靠的道路
  rationale: 正文保留“真实”这一核心词义，脚注同时指出该短语也可能强调神信实可靠的引导，避免把含义仅限定为路线正确或仅限定为抽象神学属性。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“低头，俯伏敬拜”保留连续动作；“称颂”符合向神发出的赞美；整体句式尽量贴近希伯来文的叙述推进，同时用破折号和分号帮助现代读者辨明同位语及后续说明。
