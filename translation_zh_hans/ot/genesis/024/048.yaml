    text: 原文直译“在真实（或信实）的道路上”。这句话既可指正确、可靠的道路，也可强调雅威的引导信实可靠。
    reason: 说明אֱמֶת在此可表达真确、可靠，也可强调神信实可靠的引导；避免将短语限定为单一含义。
  revision_rationale: 修订仅处理两处汉语表达：以“真实可靠的道路”改善自然度并保留原文语义张力；以“去为……迎娶……”明确仆人受引导所执行的是为主人之子安排婚事，而非仆人自己结婚。其余措辞保持不变。
