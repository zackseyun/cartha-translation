revisions:
- from: 于是我低头，俯伏敬拜雅威，又称颂雅威——我主人亚伯拉罕的上帝；他引导我走在真实的道路上[a]，为我主人的儿子娶到我主人兄弟的女儿。
  to: 于是我低头，俯伏敬拜雅威，又称颂雅威——我主人亚伯拉罕的上帝；他引导我走在真实可靠的道路上[a]，去为我主人的儿子迎娶我主人兄弟的女儿。
  rationale: 修订仅处理两处汉语表达：以“真实可靠的道路”改善自然度并保留原文语义张力；以“去为……迎娶……”明确仆人受引导所执行的是为主人之子安排婚事，而非仆人自己结婚。其余措辞保持不变。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T04:22:31Z'
review_pass:
  verdict: revise
  source_fidelity: 译文准确保留了两次连续的敬拜动作、雅威这一神名、称颂、亚伯拉罕作为仆人的主人，以及“主人兄弟的女儿”这一原文的亲属表述。惟“为我主人的儿子娶到”在汉语中容易使仆人成为实际结婚者，未清楚表达其受引导去为以撒安排婚事；宜改为“去为……迎娶……”，以保留לָקַחַת的目的不定式和婚姻安排语境。
  naturalness: “真实的道路”在现代汉语中较不自然，且容易被理解为道路本身并非虚假。以“真实可靠的道路”表达可较自然地保留אֱמֶת所含真确／可靠的语义范围；脚注继续说明其可能强调雅威信实的引导。
  terminology: “雅威”“上帝”“主人”“称颂”“俯伏敬拜”均符合庄重的现代汉语圣经语体，也准确区分了神名与亚伯拉罕的人间主人身份。
  issues:
  - severity: medium
    issue: “为我主人的儿子娶到我主人兄弟的女儿”可能误指仆人为儿子本人结婚。
    rationale: 原文的主语仍是仆人：雅威引导他去“取”女子，目的在于给其主人之子。汉语“为某人的儿子娶到”虽可勉强理解为代为办婚事，但搭配不够明确。改作“去为我主人的儿子迎娶我主人兄弟的女儿”更清楚地表达婚姻安排，且不增添具体仪式。
  - severity: low
    issue: “真实的道路”不够合乎现代汉语搭配。
    rationale: 此译法可能使“真实”被理解为道路的物理属性。采用“真实可靠的道路”并以脚注保留直译和语义张力，能更自然地传达בְּדֶרֶךְ אֱמֶת。
  revised_text: 于是我低头，俯伏敬拜雅威，又称颂雅威——我主人亚伯拉罕的上帝；他引导我走在真实可靠的道路上[a]，去为我主人的儿子迎娶我主人兄弟的女儿。
  revised_footnotes:
