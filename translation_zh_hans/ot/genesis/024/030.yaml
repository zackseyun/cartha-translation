base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/030.yaml
  text: And it happened[a], when he saw the nose ring and the bracelets on his sister’s hands, and when he heard the words of Rebekah his sister, saying, “This is what the man said to me,” that he went to the man. And behold[d][c][b], he was standing by the camels at the spring.
translation:
  language: zh_hans
  text: 拉班看见他妹妹手上的鼻环和手镯，又听见他妹妹利百加说：“那人就是这样对我说的。”就去见那人。看哪，那人正站在泉边，靠近骆驼。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “靠近骆驼”也可译作“在骆驼旁”；“泉边”中的“泉”指水泉或水源。原文以两个表示位置的短语说明那人站立的地点。
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: וַיְהִי
  choice: 不单独译出，以“于是”承接主句
  rationale: 这里是希伯来叙事的推进形式；汉语若直译“事情发生了”会显得累赘，长句的时间背景和主句承接已表达其功能。
- source_word: הַנֶּזֶם
  choice: 鼻环
  rationale: נֶזֶם 本可泛指环饰，但创世记24:47明确说明这件饰物戴在利百加鼻子上。
- source_word: הַצְּמִדִים עַל יְדֵי אֲחֹתוֹ
  choice: 他妹妹手上的……手镯
  rationale: 保留 יָד 的“手”这一表达，同时用现代汉语常见的“手镯”准确指明饰物。
- source_word: דִּבְרֵי רִבְקָה אֲחֹתוֹ לֵאמֹר
  choice: 听见他妹妹利百加说
  rationale: 将“利百加的话……说”自然整合为汉语引语结构，既保留发言者和亲属关系，也避免生硬重复。
- source_word: כֹּה דִבֶּר אֵלַי הָאִישׁ
  choice: 那人就是这样对我说的
  rationale: “这样”保留 כֹּה 指向所述话语或方式的指示意味，语气自然。
- source_word: וַיָּבֹא אֶל הָאִישׁ
  choice: 于是他就到那人那里去
  rationale: 按拉班的行动视角译为“去”，比“来到”更符合现代汉语叙事。
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留希伯来文突然呈现眼前情景的生动叙事功能。
- source_word: עֹמֵד
  choice: 仍站在
  rationale: 分词表示当时持续的状态；“仍”也自然显示那人还在原处等候。
- source_word: עַל הַגְּמַלִּים
  choice: 骆驼旁
  rationale: 介词 עַל 在此表示临近、照看或倚着所在，不宜按字面译成站在骆驼上。
- source_word: עַל הָעָיִן
  choice: 泉边
  rationale: עַיִן 在此指天然泉源或水源；“泉边”同时自然表达介词所示的位置。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而通顺的叙事汉语。明确补出主语“拉班”，以符合汉语篇章习惯；引语后以“于是”清楚带出主句。保留“看哪”的经文叙事色彩，但避免“事情发生了”等生硬希伯来语式表达。
