  text: Then the servant brought out articles of silver and articles of gold and garments[a], and gave them to Rebekah; he also gave choice gifts to her brother and to her mother.
translation:
  language: zh_hans
  text: 仆人拿出银制品、金制品和衣裳，送给利百加；又把精美礼物[a]送给她哥哥和母亲。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “精美礼物”所译的希伯来词可指上好或珍贵的礼物，在某些语境中也可指美味食品。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצֵא
  choice: 拿出
  rationale: 该词是יצא的使役形，表示使某物出来；在此语境中，“拿出”自然、具体。
- source_word: הָעֶבֶד
  choice: 仆人
  rationale: עֶבֶד可指仆人或奴仆；本叙事强调其受差遣的身份，“仆人”符合现代汉语表达，也不额外强化其法律身份。
- source_word: כְּלֵי כֶסֶף וּכְלֵי זָהָב
  choice: 银制品、金制品
  rationale: כְּלִי语义宽泛，可指器皿、物件或用具；“制品”避免把这些礼物限定为容器，并保留其由银、金制成之意。
- source_word: וּבְגָדִים
  choice: 和衣裳
  rationale: בְּגָדִים指衣物；“衣裳”自然庄重，适合赠礼的叙事语境。
- source_word: וַיִּתֵּן לְרִבְקָה
  choice: 送给利百加
  rationale: נתן基本义为“给”；结合上下文中的礼物，“送给”更符合现代汉语，同时不改变动作含义。
- source_word: וּמִגְדָּנֹת
  choice: 精美礼物
  rationale: 该词指上好、珍贵之物，在此婚姻赠礼语境中宜理解为精选的礼物；“精美礼物”保留其品质上乘之意，而不把含义限定为食品或单纯强调价格。
- source_word: לְאָחִיהָ וּלְאִמָּהּ
  choice: 送给她哥哥和母亲
  rationale: 忠实表达两个接受者及其与利百加的亲属关系；汉语中一个“她”即可自然统摄后面的两项。
