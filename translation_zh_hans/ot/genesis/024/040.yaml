source:
  edition: WLC
  text: וַ/יֹּ֖אמֶר אֵלָ֑/י יְהוָ֞ה אֲשֶׁר הִתְהַלַּ֣כְתִּי לְ/פָנָ֗י/ו יִשְׁלַ֨ח מַלְאָכ֤/וֹ אִתָּ/ךְ֙ וְ/הִצְלִ֣יחַ דַּרְכֶּ֔/ךָ וְ/לָקַחְתָּ֤ אִשָּׁה֙ לִ/בְנִ֔/י מִ/מִּשְׁפַּחְתִּ֖/י וּ/מִ/בֵּ֥ית אָבִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/040.yaml
  text: And he said to me[a], ‘Yahweh, before whom I have walked, will send his angel with you and make your journey successful[b], and you will take a wife for my son from my clan and from my father’s house.’
translation:
  language: zh_hans
  text: 他对我说：‘那位我一向行在他面前的雅威，必差遣他的使者与你同去，使你的行程顺利[a]；你必从我的宗族[b]和我父家中，为我儿子娶妻。’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“使你所走的路亨通。”
    reason: 保留דֶּרֶךְ“道路”与צָלַח“使亨通”的较直译表达。
  - marker: b
    text: 或译：“亲族”；这里的希伯来语可指范围较广的亲属群体。
    reason: 说明מִשְׁפָּחָה的亲属范围及可选译法。
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常用音译呈现以色列上帝的专名，不以“主”这一称号替代。
- source_word: הִתְהַלַּכְתִּי לְפָנָיו
  choice: 我一向行在他面前
  rationale: 保留“行在……面前”的盟约性表达；“一向”传达完成式在此所概括的持续生活与行事。
- source_word: מַלְאָכוֹ
  choice: 他的使者
  rationale: מַלְאָך基本义为受差遣的使者；此处是雅威所差遣的超自然使者。“使者”既合乎上下文，也保留该词本身的功能性含义。
- source_word: אִתָּךְ
  choice: 与你同去
  rationale: 按差遣与行程的语境，用“同去”自然表达陪伴同行。
- source_word: וְהִצְלִיחַ דַּרְכֶּךָ
  choice: 使你的行程顺利
  rationale: 准确表达צָלַח使役形的致使意义，并将“道路”这一希伯来语行程习语译成自然现代汉语。
- source_word: וְלָקַחְתָּ אִשָּׁה
  choice: 你必……为我儿子娶妻
  rationale: 保留“娶妻”的婚姻用语，并按前文应许的未来结果译为“必”，避免误作新的命令。
- source_word: מִמִּשְׁפַּחְתִּי
  choice: 从我的宗族
  rationale: מִשְׁפָּחָה可指范围大于核心家庭的亲属群体；“宗族”在本语境中较准确。
- source_word: וּמִבֵּית אָבִי
  choice: 我父家中
  rationale: “父家”简洁保留父系家族或家室的古代社会表达，且在现代汉语中仍可理解。
theological_decisions:
- issue: 如何译出神名יְהוָה
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 采用神名的直接音译，以区别于称号；不以传统替代读法或称号取代原文专名。
- issue: “行在他面前”的含义
  choice: 保留原文的行走隐喻
  alternative: 在他面前忠诚生活；活在他面前
  rationale: 原表达兼有在上帝面前生活、行事并向他负责的意味；直保隐喻可避免把“忠诚”等解释成分直接写入正文。
- issue: 使者的身份
  choice: 译作“使者”，不进一步界定
  alternative: 天使
  rationale: 上下文表明这是雅威所差遣的使者，但本节并未详细说明其本体身份；“使者”保留מַלְאָך的词义宽度与经文张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。保留“行在他面前”“父家”等具有原文文化与神学质感、同时仍易理解的表达；其余行程用语按现代汉语习惯处理。
