  text: וַ/יַּ֨עַן לָבָ֤ן וּ/בְתוּאֵל֙ וַ/יֹּ֣אמְר֔וּ מֵ/יְהוָ֖ה יָצָ֣א הַ/דָּבָ֑ר לֹ֥א נוּכַ֛ל דַּבֵּ֥ר אֵלֶ֖י/ךָ רַ֥ע אוֹ טֽוֹב־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/050.yaml
  text: Then Laban and Bethuel answered and said[a], “The matter has come from Yahweh[b]; we cannot speak to you bad or good.”
translation:
  language: zh_hans
  text: 拉班和彼土利回答说：“这事出于雅威，我们不能对你说好说歹。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译为“不能对你说坏或好”。在这里，这一说法表示他们无法反对或改变雅威所定的事。
    reason: 说明希伯来语的两极表达及其语境含义。
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמְרוּ
  choice: 回答说
  rationale: 希伯来语以两个言说动词构成常见的叙事引语公式；现代汉语用“回答说”自然地保留回应与发言两层功能。
- source_word: מֵיְהוָה
  choice: 出于雅威
  rationale: 介词 מִן 表示来源；“出于”准确表达此事源自雅威。神名 יְהוָה 音译为“雅威”。
- source_word: יָצָא הַדָּבָר
  choice: 这事出于
  rationale: דָּבָר 在婚事商议的语境中指当前这件事，而非单指话语；与 יָצָא 连用表示事情由某一来源而来。汉语将来源短语整合为“这事出于雅威”，简洁自然。
- source_word: לֹא נוּכַל דַּבֵּר אֵלֶיךָ
  choice: 我们不能对你说
  rationale: 保留 יכל 的能力含义及 אֶל 所标明的言说对象，不额外解释为拒绝、同意或反对。
- source_word: רַע אוֹ טוֹב
  choice: 说好说歹
  rationale: 原文直译为“坏或好”，是一组涵盖两端的表达。“说好说歹”在现代汉语中自然，也保留了不能作出正面或负面置评的张力；具体语用含义以脚注说明。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。采用“雅威”以神名形式呈现，而不以称号替代。
- issue: “不能说好说歹”的含义
  choice: 正文保留能力表达和两极措辞
  alternative: 我们不能反对或更改这事
  rationale: 后者虽能解释语境中的言外之意，却会把习语的开放性直接化约为一种解释。正文保留原文张力，脚注指出在本语境中可理解为不能反对或改变雅威所定之事。
translation_notes:
  register: 采用现代、庄重而易懂的叙事用语。“回答说”符合汉语圣经叙事语体；“说好说歹”较直译自然，同时借脚注保留原文措辞和语用含义。
