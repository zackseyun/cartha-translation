  yaml_path: translation/ot/genesis/024/006.yaml
  text: Abraham said to him[a], “Be careful that you do not take my son back there.”
translation:
  language: zh_hans
  text: 亚伯拉罕对他说：“你要当心，不可把我的儿子带回那里。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלָיו
  choice: 对他说
  rationale: אמר的叙事形式用现代汉语自然译为“说”；אֵלָיו明确表示话语所指向的对象，因此译作“对他说”。
- source_word: הִשָּׁמֶר לְךָ
  choice: 你要当心
  rationale: שׁמר的Nifal祈使式配合לְךָ构成强烈的自我警戒表达；“你要当心”既保留警告语气，也符合现代汉语。
- source_word: פֶּן
  choice: 不可
  rationale: פֶּן引出所警戒、务必避免的行动；在本句直接命令中，“不可”简洁自然，并保留强烈的否定警告。
- source_word: תָּשִׁיב
  choice: 带回
  rationale: 这是שׁוב的Hifil未完成式，基本义为“使……返回”。“带回”在汉语中自然表达仆人使儿子返回那里的意思，同时保留由谁陪同或采取何种方式的开放性。
- source_word: אֶת־בְּנִי
  choice: 我的儿子
  rationale: 宾格标记后接带第一人称单数后缀的“儿子”，直译为“我的儿子”。
- source_word: שָׁמָּה
  choice: 那里
  rationale: 方向副词表示“到那里”；与“带回”连用时译作“那里”最自然，方向意义已由动词体现。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“你要当心，不可……”传达原文祈使警告与פֶּן从句的力度；“带回”贴近使役形式“使返回”，且不额外限定旅行动作。
