  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר בָּר֤וּךְ יְהוָה֙ אֱלֹהֵי֙ אֲדֹנִ֣/י אַבְרָהָ֔ם אֲ֠שֶׁר לֹֽא עָזַ֥ב חַסְדּ֛/וֹ וַ/אֲמִתּ֖/וֹ מֵ/עִ֣ם אֲדֹנִ֑/י אָנֹכִ֗י בַּ/דֶּ֨רֶךְ֙ נָחַ֣/נִי יְהוָ֔ה בֵּ֖ית אֲחֵ֥י אֲדֹנִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/027.yaml
  text: And he said[a], “Blessed be Yahweh, the God of my master Abraham, who has not forsaken his steadfast love and his faithfulness from my master. As for me[b], Yahweh has led me on the way to the house of my master’s brothers.”
translation:
  language: zh_hans
  text: 他说：“雅威——我主人亚伯拉罕的上帝——当受称颂！他没有从我主人那里收回他的慈爱和信实[a]。我呢，雅威一路引领我，来到我主人弟兄[b]的家。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “慈爱和信实”也可译作“忠贞的爱和可靠”；这组希伯来语词常表达坚定不移的恩爱与可靠。
    reason: 说明重要词组的语义范围及可行译法。
  - marker: b
    text: 原文直译“弟兄”；这里指亚伯拉罕的男性亲族或家族一系。
    reason: 说明亲属词在本段叙事中的实际所指。
lexical_decisions:
- source_word: בָּרוּךְ
  choice: 是当受称颂的
  rationale: 保留希伯来语颂赞公式的述谓形式，同时用庄重而自然的现代汉语表达对上帝的称颂。
- source_word: יְהוָה
  choice: 雅威
  rationale: 音译四字神名，保留其作为以色列上帝专名的性质，不以称号代替。
- source_word: אֱלֹהֵי אֲדֹנִי אַבְרָהָם
  choice: 我主人亚伯拉罕的上帝
  rationale: 直接呈现原文的领属关系，并保留仆人称亚伯拉罕为“我主人”的叙事视角。
- source_word: לֹא עָזַב
  choice: 从未收回
  rationale: 与后面的“慈爱和信实”搭配，表达雅威没有撤去或中止对亚伯拉罕的忠贞恩待；比逐字译作“没有离弃他的慈爱”更符合现代汉语。
- source_word: חַסְדּוֹ וַאֲמִתּוֹ
  choice: 他的慈爱和信实
  rationale: “慈爱”体现חֶסֶד的恩慈与忠贞，“信实”体现אֱמֶת在关系语境中的可靠性；二者并列保留原文重要的词语组合。
- source_word: מֵעִם אֲדֹנִי
  choice: 对我的主人
  rationale: 该介词短语与“没有收回”合译，表示雅威没有从主人那里撤去慈爱与信实；避免生硬的“从我的主人”。
- source_word: אָנֹכִי
  choice: 我呢
  rationale: 体现前置独立代词的强调和话题转换，比单用“我”更能传达原文语用功能。
- source_word: בַּדֶּרֶךְ נָחַנִי
  choice: 一路引领我
  rationale: 自然表达在行程中蒙引导的含义，并保留雅威主动引领的形象。
- source_word: בֵּית אֲחֵי אֲדֹנִי
  choice: 我主人弟兄的家
  rationale: 保留בֵּית的“家”和אֲחֵי的阳性复数“弟兄”；脚注说明此处所指范围是亚伯拉罕的男性亲族或家族。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名，因此正文保留专名，而不以“主”这一称号替代。
- issue: חֶסֶד וֶאֱמֶת这一词组的含义
  choice: 慈爱和信实
  alternative: 慈爱和诚实；忠贞之爱和真实
  rationale: 该组合既有关系中的忠贞恩爱，也有可靠可信之意；“慈爱和信实”保持两项并列及其神学张力，不把חֶסֶד缩窄为抽象的盟约术语。
- issue: אֲחֵי的亲属范围
  choice: 正文译作“弟兄”，脚注说明可指男性亲族
  alternative: 亲属；族人
  rationale: 保留原文阳性亲属词，不在正文中把它泛化；同时用脚注防止读者误以为只指亚伯拉罕的亲兄弟。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“我呢”保留仆人话语中的强调；破折号突出“我主人亚伯拉罕的上帝”这一同位说明。全句避免古奥表达，同时维持颂赞祷词的尊严。
