source:
  edition: WLC
  text: יְהוָ֣ה אֱלֹהֵ֣י הַ/שָּׁמַ֗יִם אֲשֶׁ֨ר לְקָחַ֜/נִי מִ/בֵּ֣ית אָבִ/י֮ וּ/מֵ/אֶ֣רֶץ מֽוֹלַדְתִּ/י֒ וַ/אֲשֶׁ֨ר דִּבֶּר לִ֜/י וַ/אֲשֶׁ֤ר נִֽשְׁבַּֽע לִ/י֙ לֵ/אמֹ֔ר לְ/זַ֨רְעֲ/ךָ֔ אֶתֵּ֖ן אֶת הָ/אָ֣רֶץ הַ/זֹּ֑את ה֗וּא יִשְׁלַ֤ח מַלְאָכ/וֹ֙ לְ/פָנֶ֔י/ךָ וְ/לָקַחְתָּ֥ אִשָּׁ֛ה לִ/בְנִ֖/י מִ/שָּֽׁם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/007.yaml
  text: Yahweh[a], the God of heaven, who took me from my father's house and from the land of my birth, and who spoke to me and who swore to me, saying, ‘To your offspring I will give this land’—he will send his angel before you, and you shall take a wife for my son from there.
translation:
  language: zh_hans
  text: 耶和华——天上的上帝，曾把我从我父家和我出生之地领出来；他曾对我说，也曾向我起誓说：‘我要把这地赐给你的后裔。’他必差遣他的使者[a]在你前面；你就必能从那里为我儿子娶一位妻子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “使者”也可译作“天使”。希伯来语 מַלְאָךְ 可指一般使者，也可指天上的使者；在这里，后者的意思较为可能。
    reason: 保留原词真实存在的词义歧义。
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代简体中文中通行且庄重的专名“耶和华”译出四字神名，不以头衔代替。
- source_word: אֱלֹהֵי הַשָּׁמַיִם
  choice: 天上的上帝
  rationale: 自然表达构造关系，并保留“天”作为上帝统管领域的含义。
- source_word: לְקָחַנִי
  choice: 领我出来
  rationale: 此处指上帝使亚伯拉罕离开原来的家乡；“领我出来”兼顾 לקח 的带离之意和汉语自然度。
- source_word: מִבֵּית אָבִי
  choice: 从我父家
  rationale: “父家”简洁保留家庭、宗族与家业共同体的含义。
- source_word: וּמֵאֶרֶץ מוֹלַדְתִּי
  choice: 和我出生之地
  rationale: מוֹלֶדֶת 可涉及出生地、故土或亲族；正文采用贴近字面的“出生之地”，避免过度限定为亲族。
- source_word: דִּבֶּר לִי
  choice: 对我说话
  rationale: 保留普通动词“说话”，不提前解释为“应许”，因为后文另行给出其话语内容和誓言。
- source_word: נִשְׁבַּע לִי
  choice: 向我起誓
  rationale: 直接、自然地表达誓言用法。
- source_word: לְזַרְעֲךָ
  choice: 你的后裔
  rationale: “后裔”可自然表达 זֶרַע 的集合意义，又比直译“种子”更易懂。
- source_word: אֶתֵּן אֶת הָאָרֶץ הַזֹּאת
  choice: 我要把这地赐给
  rationale: “赐给”符合上帝作为赐予者的庄重语境，“这地”保留盟约应许中的土地含义。
- source_word: יִשְׁלַח מַלְאָכוֹ לְפָנֶיךָ
  choice: 差遣他的使者走在你前面
  rationale: מַלְאָךְ 本义为受差遣的使者，可指天使；“走在你前面”自然表达 לְפָנֶיךָ 所含的先行、引导意味。
- source_word: וְלָקַחְתָּ אִשָּׁה לִבְנִי
  choice: 你就可以从那里为我儿子娶妻
  rationale: 此处连词加完成式在语境中表达预期结果；“为我儿子娶妻”符合现代汉语婚配语境，“可以”体现上帝先行引导后使命得以完成。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 中文圣经传统中“耶和华”辨识度最高，也明确作为专名出现；原文读音的精确复原仍有讨论，因此不将某一重构读音绝对化。
- issue: מַלְאָכוֹ 指天上使者还是一般使者
  choice: 正文译“他的使者”，脚注说明也可译“他的天使”
  alternative: 他的天使
  rationale: 该词本身兼有“使者”和“天使”两义；本语境很可能指上帝所差的天上使者，但正文用较宽的“使者”保存原词的词义张力，并以脚注交代较具体的理解。
- issue: וְלָקַחְתָּ 的语气
  choice: 你就可以……娶妻
  alternative: 你要……娶妻
  rationale: 该形式可在连贯话语中表达结果、预期或命令。这里上帝差遣使者在先，随后任务得以完成；译作“就可以”不把它收窄为单纯命令，同时保留亚伯拉罕的确信。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“父家”“后裔”“赐给”等词保留经文的家族与盟约语域；分号和引号使原文连续的关系从句及誓言内容清楚可读。
