  text: Then the young woman ran and told her mother's household about these things[a].
translation:
  language: zh_hans
  text: 那位年轻女子跑去，把这些事告诉她母亲家里的人。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“她母亲的家。”这个希伯来语短语既可指她母亲的住所，也可指与她母亲相关的家人或家庭。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּרָץ
  choice: 跑去
  rationale: רוץ表示快速奔跑；“跑去”既保留动作的迅速，也自然衔接后面的报告行动。
- source_word: הַנַּעֲרָ
  choice: 那年轻女子
  rationale: נַעֲרָה指年轻女性；“年轻女子”现代、庄重，也避免“女孩”可能带来的年幼意味。
- source_word: וַתַּגֵּד
  choice: 告诉了
  rationale: נגד的使役词干在此表示使人知道、讲述；“告诉了”符合现代汉语叙事。
- source_word: לְבֵית אִמָּהּ
  choice: 她母亲家里的人
  rationale: בַּיִת既可指房屋，也可指家人或家庭。正文采用较符合语境的家庭成员之义，同时以脚注保留实体房屋的可能。
- source_word: כַּדְּבָרִים הָאֵלֶּה
  choice: 这些事
  rationale: דְּבָרִים可指言语、事情或事项；这里是利百加转述刚才发生的事，译作“这些事”自然且贴合语境。
