  naturalness: “食物摆在他面前，供他吃”及“在我把要说的话说完以前，我不吃”符合现代汉语庄重叙事语体，意思清楚自然。“对方说”使对话说话人转换明确，同时不补出姓名或关系。
  terminology: 本节没有需固定处理的专门神学术语。将 דְּבָרָי 译为“要说的话”自然表达其所要陈述的事；“说完”在此准确传达完成其发言的时间界限。
