base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/033.yaml
  text: Food was set before him to eat[a], but he said, “I will not eat until I have spoken my words.” And he said, “Speak.”
translation:
  language: zh_hans
  text: 食物摆在他面前，供他吃；但他说：“在我把要说的话说完以前，我不吃。”对方说：“请说吧。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשֶׂם לְפָנָיו לֶאֱכֹל
  choice: 有人把食物摆在他面前，请他吃
  rationale: 原文动词是单数，主语未明说。用“有人”保留主语未指明的特点；“请他吃”自然表达目的不定式 לֶאֱכֹל 在款待语境中的含义。
- source_word: לֹא אֹכַל
  choice: 绝不吃
  rationale: 未完成式在此表达坚定的意愿；“绝不吃”比单纯“不会吃”更自然地传达说话人的坚决态度。
- source_word: עַד אִם דִּבַּרְתִּי דְּבָרָי
  choice: 我把要说的话说完以前
  rationale: 字面接近“直到我说了我的话”。现代汉语用“把要说的话说完以前”清楚表达时间界限，也保留 דְּבָרָי 所指的发言内容，避免生硬的“我的话”。
- source_word: דַּבֵּר
  choice: 请说吧
  rationale: 这是简短的命令式许可语。“请说吧”在现代汉语对话中自然、庄重，不额外增添实质内容。
theological_decisions: []
translation_notes:
  register: 采用现代、清楚而庄重的叙事语言。原文第二个“他说”的人物身份依上下文可知但本节未明说，因此译作“那人说”，不擅自补成具体姓名或关系。
