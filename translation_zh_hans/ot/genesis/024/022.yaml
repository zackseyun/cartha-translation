translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“那人”照应上下文且忠于本节称谓；古代重量单位保留音译，并用脚注解释。正文脚注标记依其实际说明对象分别置于“金环”和全句重量信息之后。
