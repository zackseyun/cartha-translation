base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/022.yaml
  text: And when the camels had finished drinking[a], the man took a gold ring weighing a beka[b], and two bracelets for her hands weighing ten shekels of gold.
translation:
  language: zh_hans
  text: 骆驼喝完水后，那人拿了一个重一比加的金环[a]，又拿了给她戴在手上的两只手镯，共重十舍客勒金子[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“金鼻环”；希伯来语这个词可指戴在鼻上或耳上的环。
    reason: lexical_alternative
  - marker: b
    text: “比加”是古代重量单位，等于半舍客勒。这里两只手镯的“十舍客勒”指其合计重量。
    reason: cultural_note
lexical_decisions:
- source_word: כַּאֲשֶׁר כִּלּוּ הַגְּמַלִּים לִשְׁתּוֹת
  choice: 骆驼喝完水后
  rationale: 该结构表示骆驼饮水完毕之后，下一动作随即发生；此译自然地保留完成和时序关系，但不额外强调动作有多么立即。
- source_word: הָאִישׁ
  choice: 那人
  rationale: 原文只称其为“那人”，虽上下文表明他是亚伯拉罕的仆人，本节却未使用“仆人”一词，因此不在译文中明说。
- source_word: נֶזֶם זָהָב
  choice: 金环
  rationale: נֶזֶם 可指戴在鼻上或耳上的环；正文用较宽泛的“金环”保留词义的不确定性，并以脚注说明可能的具体佩戴部位。
- source_word: בֶּקַע מִשְׁקָלוֹ
  choice: 重一比加
  rationale: בֶּקַע 是古代重量单位。正文保留该单位的名称，避免直接以解释性的“半舍客勒”取代原文，并在脚注说明其数值。
- source_word: וּשְׁנֵי צְמִידִים
  choice: 两只……手镯
  rationale: 原文明说数目为二；“两只手镯”在现代汉语中清楚自然。
- source_word: עַל יָדֶיהָ
  choice: 给她手上戴的
  rationale: 原文直译为“在她双手上”。此处所指是佩戴首饰，“给她手上戴的”既保留身体部位的表达，也符合自然汉语。
- source_word: עֲשָׂרָה זָהָב מִשְׁקָלָם
  choice: 共重十舍客勒金子
  rationale: 此语说明两只手镯合计的黄金重量；原文省略了可由语境理解的重量单位，译文补出“舍客勒”，使现代读者能够理解。
