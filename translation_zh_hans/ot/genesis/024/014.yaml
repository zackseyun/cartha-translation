  to: 愿那位年轻女子，就是我对她说：‘请把你的水罐放低，让我喝水’，而她回答：‘请喝，我也给你的骆驼喝水’的女子，成为你为你的仆人、为以撒所选定的那一位[a]。借着她[b]，我就知道你向我主人施了信实的慈爱。
