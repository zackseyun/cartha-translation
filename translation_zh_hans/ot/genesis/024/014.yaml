source:
  edition: WLC
  text: וְ/הָיָ֣ה הַֽ/נַּעֲרָ֗ אֲשֶׁ֨ר אֹמַ֤ר אֵלֶ֨י/הָ֙ הַטִּי נָ֤א כַדֵּ/ךְ֙ וְ/אֶשְׁתֶּ֔ה וְ/אָמְרָ֣ה שְׁתֵ֔ה וְ/גַם גְּמַלֶּ֖י/ךָ אַשְׁקֶ֑ה אֹתָ֤/הּ הֹכַ֨חְתָּ֙ לְ/עַבְדְּ/ךָ֣ לְ/יִצְחָ֔ק וּ/בָ֣/הּ אֵדַ֔ע כִּי עָשִׂ֥יתָ חֶ֖סֶד עִם אֲדֹנִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/014.yaml
  text: And let it be that the young woman to whom I say[a], ‘Please lower your jar so that I may drink,’ and who says, ‘Drink, and I will also water your camels’—let her be the one you have appointed for your servant, for Isaac[c][b]. By her I will know that you have shown steadfast love to my master.
translation:
  language: zh_hans
  text: 愿那位年轻女子，就是我对她说：‘请把你的水罐放低，让我喝水’，而她回答：‘请喝，我也给你的骆驼喝水’的女子，成为你为你的仆人、为以撒所选定的那一位[a]。借着她[b]，我就知道你向我主人施了信实的慈爱。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “为你的仆人、为以撒”也可译作“为你的仆人以撒”。希伯来语既可把两个短语分别理解，也可把“以撒”看作“你的仆人”的同位语。
    reason: alternative_reading
  - marker: b
    text: “借着她”也可译作“借此”，即借着这个兆头。希伯来语直译为“借着她”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: 愿……愿她就是
  rationale: 在祷告语境中表达请求和期愿；中文采用前后呼应的“愿”，承载希伯来语的祈愿语气，同时使长句清楚自然。
- source_word: הַנַּעֲרָ
  choice: 年轻女子
  rationale: 指适婚年龄的年轻女性；此译法现代、庄重，也避免“女孩”可能暗示年龄过小。
- source_word: הַטִּי נָא כַדֵּךְ
  choice: 请放低你的水罐
  rationale: הטה在此指把所携水罐倾下或放低，נָא以“请”表达礼貌请求。
- source_word: וְאֶשְׁתֶּה
  choice: 让我喝一点
  rationale: 表达说话者请求喝水的意愿；“一点”符合现代汉语请求语气，不改变动作核心。
- source_word: וְגַם גְּמַלֶּיךָ אַשְׁקֶה
  choice: 我也给你的骆驼水喝
  rationale: 准确表达使役动词“使……喝水”，比“饮骆驼”更通俗自然。
- source_word: אֹתָהּ הֹכַחְתָּ
  choice: 她就是你……所选定的
  rationale: 该使役形式在此表示神藉征兆指明或选定女子；“选定”自然传达语境意义，又不把过程解释得过细。
- source_word: לְעַבְדְּךָ לְיִצְחָק
  choice: 为你的仆人、为以撒
  rationale: 保留两个介词短语的并列可能性：说话者自称神的仆人，而以撒是婚姻安排的受益者；另一个合理读法见脚注。
- source_word: וּבָהּ אֵדַע
  choice: 借着她，我就知道
  rationale: 阴性单数后缀最直接回指年轻女子，表明她是辨认兆头的媒介；同时以脚注保留指向整件事情或兆头的译法。
- source_word: חֶסֶד
  choice: 信实的慈爱
  rationale: 兼顾该词所含的恩慈、忠诚和恒久关系意味，避免仅译“善待”而削弱其分量，也不将其限定为特定神学术语。
- source_word: עִם אֲדֹנִי
  choice: 向我主人
  rationale: 按现代汉语“向某人施慈爱”的自然搭配处理希伯来语字面的“与我主人”。
theological_decisions:
- issue: לְעַבְדְּךָ中“你的仆人”的所指
  choice: 理解为祷告者自称神的仆人，随后“为以撒”是另一个与格短语。
  alternative: 理解为同位语：“为你的仆人以撒”。
  rationale: 希伯来语允许两种句法分析。正文保留两个ל短语的次序和区分，脚注明确列出常见的同位语读法，不将真正的歧义静默消除。
- issue: וּבָהּ的指向
  choice: 按阴性后缀直译为“借着她”，回指年轻女子。
  alternative: 按所指的兆头或整件事译为“借此”。
  rationale: 语法形式最直接指向女子，但语用上也可指借她的回应形成的兆头，因此正文从形式，脚注保留语境性译法。
- issue: חֶסֶד的表达
  choice: 信实的慈爱
  alternative: 恩待；忠贞之爱；守约的慈爱
  rationale: 在不预设狭义盟约技术含义的前提下，表达关系中的忠诚和恩慈。
translation_notes:
  register: 采用现代标准普通话和简体中文，语气为庄重而自然的祷告。以引语和前后两个“愿”理清希伯来语长句结构；不用古雅的“使女”“汲饮”等词。所有脚注标记均置于正文相应位置。
