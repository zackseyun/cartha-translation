  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יְהִ֕י כַּ/אֲשֶׁ֥ר שָׁמַ֛ע עֶ֥בֶד אַבְרָהָ֖ם אֶת דִּבְרֵי/הֶ֑ם וַ/יִּשְׁתַּ֥חוּ אַ֖רְצָ/ה לַֽ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/052.yaml
  text: And when Abraham’s servant heard their words[c][b][a], he bowed down to the ground before Yahweh.
translation:
  language: zh_hans
  text: 亚伯拉罕的仆人听见他们所说的话，就俯伏在地，向雅威下拜。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “下拜”也可译作“俯伏敬拜”；希伯来语这个动词既可描述俯伏的动作，也可表达敬拜。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: ……听见……，就……
  rationale: 这是希伯来叙事中承接下一事件的句式。汉语用“……就……”自然表达事件的先后关系，无须逐字译出“事情发生了”。
- source_word: שָׁמַע
  choice: 听见
  rationale: 此处指听到对方所说的话；“听见”直接而自然。
- source_word: עֶבֶד אַבְרָהָם
  choice: 亚伯拉罕的仆人
  rationale: עֶבֶד 可指仆人或奴仆；本节着重其作为亚伯拉罕家中代表的身份，“仆人”准确且符合上下文。
- source_word: דִּבְרֵיהֶם
  choice: 他们所说的话
  rationale: 比直译“他们的话”更符合现代汉语，同时保留复数所属关系和言语内容。
- source_word: וַיִּשְׁתַּחוּ
  choice: 下拜
  rationale: 该词表示俯身、伏地下拜，在相关语境中也可带有敬拜意味；“下拜”保留身体动作及敬畏含义，而不直接把词义收窄为抽象的“敬拜”。
- source_word: אַרְצָה
  choice: 俯伏在地
  rationale: 方向形式表示身体朝地面俯下；与“下拜”组合，可自然而具体地呈现动作。
- source_word: לַיהוָה
  choice: 向雅威
  rationale: 介词 לְ 在下拜动词后标明动作所指向的对象；译作“向”符合汉语习惯。“雅威”音译神名 יהוה。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文明确使用四字神名。采用“雅威”较直接地呈现其专名性质，不以称号替代，也不采用较传统但语音依据较弱的“耶和华”。
- issue: וַיִּשְׁתַּחוּ 是否明确译为“敬拜”
  choice: 俯伏在地，向雅威下拜
  alternative: 俯伏在地敬拜雅威
  rationale: 原文既突出身体伏地的动作，也因对象是雅威而具有敬拜意味。正文保留动作性与神学张力，不把词义完全收窄为“敬拜”；脚注说明其可能含义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“俯伏在地，向雅威下拜”略带经文语体，但并不古奥，并能清楚保留原文的身体姿态和敬拜意味。
