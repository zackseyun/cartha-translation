revisions:
- from: 我就问她：“你是谁的女儿？”她回答：“我是彼土利的女儿；彼土利是密迦给拿鹤生的儿子。”于是，我把环子戴在她鼻子上[a]，把手镯戴在她双手上[b]。
  to: 我就问她：“你是谁的女儿？”她回答：“我是彼土利的女儿；彼土利是拿鹤的儿子，是密迦所生的。”于是，我把鼻环戴在她鼻子上[a]，把手镯戴在她手腕上[b]。
  rationale: 修订仅处理两处中文表达：以“手腕”准确表达手镯的语境义，并将母系关系从句改写为自然清楚的现代汉语。其余叙事顺序、问答形式、谱系信息及饰物位置均按希伯来原文保留。
