base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/047.yaml
  text: Then I asked her[a], saying, ‘Whose daughter are you?’ And she said, ‘The daughter of Bethuel son of Nahor[c][b], whom Milcah bore to him.’ Then I put the ring on her nose and the bracelets on her hands.
translation:
  language: zh_hans
  text: 我就问她：“你是谁的女儿？”她回答：“我是彼土利的女儿；彼土利是拿鹤的儿子，是密迦所生的。”于是，我把鼻环戴在她鼻子上[a]，把手镯戴在她手腕上[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “鼻环”原文可泛指环饰；后文“戴在她鼻子上”说明这里是鼻环。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“她的双手”；在手镯的语境中可指手腕。
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשְׁאַל אֹתָהּ וָאֹמַר
  choice: 我就问她
  rationale: 两个连续动词直译为“我问她并说”，现代汉语显得重复；“我就问她”自然表达叙事推进及以言语发问的含义。
- source_word: בַּת מִי אַתְּ
  choice: 你是谁的女儿？
  rationale: 保留原文以父系亲属身份询问的句式，也是自然的现代汉语表达。
- source_word: בַּת בְּתוּאֵל בֶּן נָחוֹר
  choice: 我是彼土利的女儿；彼土利是……拿鹤生的儿子
  rationale: 将紧凑的希伯来语族谱同位结构拆为两个分句，使亲属关系清楚，同时不增添原文没有的信息。
- source_word: אֲשֶׁר יָלְדָה לּוֹ מִלְכָּה
  choice: 彼土利是密迦给拿鹤生的儿子
  rationale: 关系从句修饰彼土利；“给拿鹤生的儿子”表达 לּוֹ 所指的父亲拿鹤，并明确密迦是母亲。
- source_word: הַנֶּזֶם
  choice: 环子
  rationale: נֶזֶם 可泛指环饰；下文“在她鼻子上”具体说明这里是鼻环，因此正文保留较宽泛的词义。
- source_word: עַל אַפָּהּ
  choice: 戴在她鼻子上
  rationale: אַף 在此指鼻子；“戴在……上”符合现代汉语描述饰物佩戴的方式。
- source_word: הַצְּמִידִים עַל יָדֶיהָ
  choice: 把手镯戴在她双手上
  rationale: צְמִידִים 是成对的镯状饰物；יָדֶיהָ 字面为“她的双手”，其语义范围也可包括手腕，故正文从原文，脚注提示语境义。
