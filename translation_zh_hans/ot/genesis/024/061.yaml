base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/061.yaml
  text: Then Rebekah and her young women arose[a], mounted the camels, and went after the man. And the servant took Rebekah and went on his way.
translation:
  language: zh_hans
  text: 利百加和她的年轻女侍[a]起身，骑上骆驼，跟着那人去了。仆人带着利百加上路了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“年轻女子”或“年轻女伴”。希伯来语指年轻女子；在本段语境中，她们很可能是陪伴利百加的女侍从。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּקָם
  choice: 起来
  rationale: קום的Qal连续式首先表示起身；“起来”既保留动作次序，也比“出发”少一层解释。
- source_word: נַעֲרֹתֶיהָ
  choice: 她的年轻女伴
  rationale: נַעֲרָה的词义核心是年轻女子；上下文表明她们陪同利百加，但该词本身未明确标示奴仆身份。“年轻女伴”兼顾词义与现代汉语自然度。
- source_word: וַתִּרְכַּבְנָה עַל הַגְּמַלִּים
  choice: 骑上骆驼
  rationale: רכב与עַל连用可指骑乘或登上；此处位于启程动作序列中，“骑上”自然表达上骆驼并开始骑行。
- source_word: אַחֲרֵי הָאִישׁ
  choice: 跟着那人
  rationale: אַחֲרֵי在行旅语境中表示在后跟随；“跟着”比字面“在……后面”更符合现代汉语叙事。
- source_word: הָאִישׁ
  choice: 那人
  rationale: 原文称其为“那人”，虽上下文所指是亚伯拉罕的仆人，正文仍保留叙事中的称谓转换，不直接改作“仆人”。
- source_word: וַיִּקַּח הָעֶבֶד אֶת רִבְקָה
  choice: 仆人就带着利百加
  rationale: לקח基本义为“取、带”；行旅语境中“带着”自然传达带领或陪同，而不过度具体化为“护送”。
- source_word: הָעֶבֶד
  choice: 仆人
  rationale: עֶבֶד可指奴隶或仆人；此处是受托办理婚事的家中仆役，“仆人”最符合上下文，同时不对其法律身份作额外断定。
- source_word: וַיֵּלַךְ
  choice: 上路了
  rationale: הלך基本义为“去、行走”；本节描述返程启行，汉语“上路了”自然体现继续旅程，但不增加目的地或方式。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而通顺的叙事汉语。保留原文先称“那人”、后称“仆人”的措辞变化；以两个“了”呈现连续动作及启程结果，避免文言化的“起身”“随从”。
