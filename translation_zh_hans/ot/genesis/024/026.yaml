base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/026.yaml
  text: Then the man bowed down and worshiped Yahweh[a][b].
translation:
  language: zh_hans
  text: 那人就俯身，敬拜雅威[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“俯伏在雅威面前”。
    reason: lexical_alternative
  - marker: b
    text: 原文作“那人”，这里指亚伯拉罕的仆人。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקֹּד
  choice: 低下头
  rationale: קָדַד表示俯身、低头的身体动作；“低下头”在现代汉语中自然清楚，并与后一个表示敬拜性俯伏的动词有所区分。
- source_word: הָאִישׁ
  choice: 那人
  rationale: 原文明确使用普通名词אִישׁ（“人、男人”），而非“仆人”；“那人”保留原文措辞，所指在上下文中是亚伯拉罕的仆人。
- source_word: וַיִּשְׁתַּחוּ
  choice: 敬拜
  rationale: שׁחה的这一词形表示俯伏、下拜；因动作对象是雅威，此处具有宗教敬拜的含义。前一动词已表达身体上的低头，因此正文用“敬拜”传达其意义，脚注保留较具形体性的译法。
- source_word: לַיהוָה
  choice: 雅威
  rationale: 原文直接使用神名四字母יהוה；“雅威”以现代汉语常见音译保留这一专名，而不以称号替代。介词לְ在此标明敬拜所指向的对象，译文以“敬拜雅威”自然表达。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华／上主
  rationale: 原文使用神的专名，而非一般称号；采用音译“雅威”可保留专名性质，同时不把特定宗派解释带入正文。
- issue: וַיִּשְׁתַּחוּ应侧重身体俯伏还是敬拜含义
  choice: 敬拜
  alternative: 俯伏在……面前／向……下拜
  rationale: 该词本身包含俯伏下拜的身体动作，而以雅威为对象时也明确带有敬拜意义。正文以“敬拜”传达语境中的宗教含义，脚注保留身体动作的可能表达，避免抹去词义张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“低下头，敬拜”保留原文两个连续动词的层次；正文不直接改写为“仆人”，以维持源文指称方式。
