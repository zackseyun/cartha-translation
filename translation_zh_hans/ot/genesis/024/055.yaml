base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/055.yaml
  text: But her brother and her mother said[a], “Let the young woman stay with us a few days, or ten; after that she may go.”
translation:
  language: zh_hans
  text: 她哥哥和母亲却说：“让这年轻女子同我们再住几天，或十天[a]，然后她就可以离开。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“日子，或十”；很可能是指“几天，或十天”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 却说
  rationale: 连续式叙事在这里承接上一节，同时表达家人对仆人要求立即动身的转折回应；中文用“却说”自然呈现这一语篇关系。
- source_word: אָחִיהָ וְאִמָּהּ
  choice: 她哥哥和母亲
  rationale: 保留希伯来文单数“哥哥”和原有次序；依上下文，所指为利百加的哥哥和母亲。
- source_word: תֵּשֵׁב
  choice: 让……再住
  rationale: ישב在此指留下、暂住；“再住”符合延后离开的语境，也比“居住”更自然。
- source_word: הַנַּעֲרָ
  choice: 这年轻女子
  rationale: נַעֲרָה指年轻女子；此译法现代、庄重，并以“这”自然指回利百加。
- source_word: אִתָּנוּ
  choice: 同我们
  rationale: 直接表达陪伴、同住之意，符合现代汉语书面叙事语体。
- source_word: יָמִים אוֹ עָשׂוֹר
  choice: 几天，或十天
  rationale: 原文直译为“日子，或十”；יָמִים在此可作不定的若干日子理解，而עָשׂוֹר表示“十”。正文采用通顺译法，并以脚注保留原文表达的简略和可能歧义。
- source_word: אַחַר
  choice: 然后
  rationale: 表示前述停留期之后，中文以“然后”自然交代行动次序。
- source_word: תֵּלֵךְ
  choice: 她可以走
  rationale: 上下文主语是年轻女子；该形式在此表达许可或提议的语气，“可以走”比单纯将来式更贴切。
