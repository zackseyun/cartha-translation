  yaml_path: translation/ot/genesis/024/057.yaml
  text: And they said[b][a], “Let us call the young woman and ask her.”
translation:
  language: zh_hans
  text: 他们说：“我们把那年轻女子叫来，问问她自己怎么说吧。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: 他们说
  rationale: 以现代汉语自然承接叙事；本节语境已清楚表明这是接续发生的回应，无须机械加入“于是”或“然后”。
- source_word: נִקְרָא
  choice: 我们把……叫来
  rationale: 该复数意愿式表达提议，汉语用“我们……吧/我们把……叫来”自然传达“让我们叫来”的意思；此处引语整体已显出商议语气。
- source_word: לַנַּעֲרָ
  choice: 那年轻女子
  rationale: נַעֲרָה指年轻女性；结合利百加已到适婚年龄的语境，“年轻女子”比可能显得年幼的“女孩”更准确，也避免“少女”的额外语感。
- source_word: וְנִשְׁאֲלָה
  choice: 问问
  rationale: 第二个复数意愿式延续前一提议；叠词“问问”符合现代汉语商议语气，同时不削弱实际征询她答复的含义。
- source_word: אֶת־פִּיהָ
  choice: 亲口问问她
  rationale: 原文直译为“问她的口”，是要直接听取她本人答复的表达。汉语“亲口问问她”自然保留直接向她本人询问的重点；其字面结构另以脚注说明。
