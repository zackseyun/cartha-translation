base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/027.yaml
  text: He asked them about their well-being and said[a], “Is your elderly father, whom you spoke of[b], well? Is he still alive?”
translation:
  language: zh_hans
  text: 他询问他们是否安好，又说：“你们提到的那位年老的父亲好吗？他还健在吗？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁאַל לָהֶם לְשָׁלוֹם
  choice: 他询问他们是否安好
  rationale: 这是希伯来语中询问他人近况、福祉的惯用表达；译为“询问他们是否安好”既传达 שָׁלוֹם 在此处的整体安康之意，也符合现代汉语习惯。
- source_word: הֲשָׁלוֹם
  choice: 好吗
  rationale: 此处询问父亲总体是否安好，不仅限于身体健康；“好吗”简洁自然，并保留原文语义范围。
- source_word: אֲבִיכֶם הַזָּקֵן
  choice: 你们……那位年老的父亲
  rationale: הַזָּקֵן 表明父亲年事已高；“年老的父亲”忠实而自然，“那位”也使后接的关系从句更顺畅。
- source_word: אֲשֶׁר אֲמַרְתֶּם
  choice: 你们提到的
  rationale: 原文直译为“你们所说的”；在本语境中，“提到的”准确指向兄弟们先前谈及父亲一事。
- source_word: הַעוֹדֶנּוּ חָי
  choice: 他还健在吗
  rationale: 原文意为“他还活着吗”；汉语谈及年长者时，“还健在吗”自然、尊重，并清楚表达仍然活着的含义。
theological_decisions: []
