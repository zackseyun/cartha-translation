  yaml_path: translation/ot/genesis/043/006.yaml
  text: Then Israel said[a], “Why did you do me harm by telling the man that you still had another brother?”
translation:
  language: zh_hans
  text: 以色列说：“你们为什么要这样害我，把你们还有一个兄弟的事告诉那人呢？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 叙事中的连续式推进情节；现代汉语通常无需另加“然后”，上下文已能表达承接关系。
- source_word: יִשְׂרָאֵל
  choice: 以色列
  rationale: 忠实保留原文此处所用的名字，不改作“雅各”。
- source_word: לָמָה
  choice: 为什么
  rationale: 直接、自然地表达原因疑问。
- source_word: הֲרֵעֹתֶם לִי
  choice: 这样害我
  rationale: רעע 的使役形式在此指给说话者造成伤害或祸患；“害我”简洁自然，也保留责怨语气。“这样”体现其所指的具体行为。
- source_word: לְהַגִּיד לָאִישׁ
  choice: 告诉那人
  rationale: 不定式说明造成伤害的方式；“那人”自然指向前文已知的埃及官员。
- source_word: הַעוֹד לָכֶם אָח
  choice: 你们还有一个兄弟
  rationale: 原文直指是否仍有/另有一位兄弟；汉语“还有一个兄弟”自然保留存在与追加的含义。
