  text: וַ/יֹּ֨אמֶר אֲלֵ/הֶ֜ם יִשְׂרָאֵ֣ל אֲבִי/הֶ֗ם אִם כֵּ֣ן אֵפוֹא֮ זֹ֣את עֲשׂוּ֒ קְח֞וּ מִ/זִּמְרַ֤ת הָ/אָ֨רֶץ֙ בִּ/כְלֵי/כֶ֔ם וְ/הוֹרִ֥ידוּ לָ/אִ֖ישׁ מִנְחָ֑ה מְעַ֤ט צֳרִי֙ וּ/מְעַ֣ט דְּבַ֔שׁ נְכֹ֣את וָ/לֹ֔ט בָּטְנִ֖ים וּ/שְׁקֵדִֽים־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/011.yaml
  text: 'Then Israel their father said to them[a], “If it must be so, then do this: take some of the choice products of the land in your containers, and carry down to the man a gift—a little balm and a little honey, gum and myrrh[c][b], pistachio nuts and almonds.”'
translation:
  language: zh_hans
  text: 他们的父亲以色列对他们说：“若非这样不可，你们就这么办：把本地一些上等的出产[a]装在器皿里，带下去送给那人作礼物，就是一点香膏、一点蜜[b]、香胶和没药[c]、开心果和杏仁。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“本地一些最好的物产”。原文泛指本地精选的出产，并不只限于水果。
    reason: lexical_alternative
  - marker: b
    text: “蜜”在某些语境中也可能指用果实制成的甜浆。
    reason: lexical_alternative
  - marker: c
    text: 译作“香胶”和“没药”的两个希伯来词究竟指何种物质，不能确定；也可能是黄蓍胶、岩蔷薇脂等芳香树脂。
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׂרָאֵל אֲבִיהֶם
  choice: 他们的父亲以色列
  rationale: 保留叙事中雅各的名称“以色列”及“他们的父亲”这一同位说明，同时符合现代汉语语序。
- source_word: אִם כֵּן אֵפוֹא
  choice: 若非这样不可
  rationale: 该习语带有迫于情势而让步的意味，不仅是中性的“如果这样”。
- source_word: מִזִּמְרַת הָאָרֶץ
  choice: 本地一些上等的出产
  rationale: 原词指当地精选、珍贵的物产，范围不限于水果；“出产”可保留其宽泛含义。
- source_word: בִּכְלֵיכֶם
  choice: 装在器皿里
  rationale: כְּלִי 泛指盛装物品的器具；“器皿”避免武断地具体化为袋子。
- source_word: וְהוֹרִידוּ
  choice: 带下去
  rationale: 保留前往埃及在叙事地理上“下去”的方向感，也自然表达携带礼物。
- source_word: לָאִישׁ
  choice: 那人
  rationale: 指前文已经提到的埃及官员；现代汉语用“那人”比“这人”或单纯“人”更清楚。
- source_word: מִנְחָה
  choice: 礼物
  rationale: 此处是为求取好意而赠送的礼物，并非明确的祭祀供物；“礼物”自然且不过度诠释。
- source_word: צֳרִי
  choice: 乳香膏
  rationale: 该词指可作药用或芳香用途的树脂性香膏；“乳香膏”表达其香脂性质，但不把它处理为礼仪用香。
- source_word: דְּבַשׁ
  choice: 蜜
  rationale: “蜜”是该词通常的对应，也允许脚注说明它在某些语境中可能指果实熬成的甜浆。
- source_word: נְכֹאת
  choice: 香胶
  rationale: 所指植物性芳香树胶无法确定；采用宽泛的“香胶”，并在脚注保留鉴定上的不确定性。
- source_word: לֹט
  choice: 没药
  rationale: 沿用熟悉的传统译法，但原物质也可能是岩蔷薇脂等树脂，故以脚注说明。
- source_word: בָּטְנִים
  choice: 开心果
  rationale: 此处通常指阿月浑子果，即现代通称的开心果。
- source_word: שְׁקֵדִים
  choice: 杏仁
  rationale: 准确对应扁桃仁，在现代汉语中通常称为杏仁。
