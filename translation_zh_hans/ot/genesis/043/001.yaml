- source_word: וְהָרָעָב
  choice: 饥荒
  rationale: רָעָב在本叙事语境中指粮食短缺造成的饥荒。句首וְ承接上文；现代汉语无需机械译作“并且”，以自然的叙事衔接表达其功能。
- source_word: כָּבֵד
  choice: 很严重
  rationale: כָּבֵד本义为“沉重”，用于饥荒时表示程度深、灾情严重；“很严重”自然清楚地传达这一强度。
- source_word: בָּאָרֶץ
  choice: 那地
  rationale: אֶרֶץ在此指叙事中的那片地区，而非全世界；“那地”既符合上下文，也保留原文简洁的地域指称。
