  yaml_path: translation/ot/genesis/043/019.yaml
  text: So they approached the man who was over Joseph’s household and spoke to him at the entrance of the house,[a]
translation:
  language: zh_hans
  text: 于是，他们走近管理约瑟家中事务的那个人，在屋门口[a]跟他说话。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在屋子的入口处”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְּשׁוּ
  choice: 走近
  rationale: 该动词表示向某人靠近；“走近”自然地保留了动作和方向感。
- source_word: הָאִישׁ
  choice: 那个人
  rationale: 希伯来文只称他为“那个人”；虽然上下文表明他是管家，本节并未使用具体职称，因此不直接译作“管家”。
- source_word: אֲשֶׁר עַל בֵּית יוֹסֵף
  choice: 管理约瑟家务的
  rationale: 介词结构表示对约瑟整个家庭事务负有管理职责；“家务”在这里指家中的事务与人员管理，不只指房屋建筑。
- source_word: וַיְדַבְּרוּ אֵלָיו
  choice: 跟他说话
  rationale: דבר 与 אֶל 连用通常表示“对某人说话”；下一节才引出具体话语内容。
- source_word: פֶּתַח הַבָּיִת
  choice: 在屋门口
  rationale: פֶּתַח 可指入口或门口；“屋门口”简洁自然，也符合他们尚在进入屋内之前交谈的场景。
theological_decisions: []
