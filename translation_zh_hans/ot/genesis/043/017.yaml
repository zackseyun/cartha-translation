  yaml_path: translation/ot/genesis/043/017.yaml
  text: So the man did as Joseph said[a], and the man brought the men into Joseph’s house.
translation:
  language: zh_hans
  text: 那人就照约瑟所说的做了，把那些人带进约瑟的家。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: 做了
  rationale: 这里的 עשה 表示遵照吩咐行事；“照……所说的做了”在现代汉语中自然，也准确表达顺从之意。
- source_word: הָאִישׁ
  choice: 那人
  rationale: 希伯来文只称其为“那人”；上下文虽表明他是约瑟的管家，本节却没有明说其职分，因此不增译为“管家”或“仆人”。
- source_word: כַּאֲשֶׁר אָמַר יוֹסֵף
  choice: 照约瑟所说的
  rationale: 该短语表达行动与约瑟所说的话相符；这一译法简洁、自然，并保留原文表述。
- source_word: וַיָּבֵא
  choice: 带进
  rationale: בוא 的使役式表示使人进入，即“带来、带进去”；结合带入房屋的方向语义，“带进”比单纯“带到”更准确。
- source_word: הָאֲנָשִׁים
  choice: 那些人
  rationale: 原文使用普通名词“那些人”，虽指约瑟的兄弟，却未在本节称他们为“兄弟”，故保留叙事措辞。
- source_word: בֵּיתָה יוֹסֵף
  choice: 约瑟的家
  rationale: בֵּיתָה 带方向词尾，表示朝向或进入房屋；与“带进”连用，清楚表达进入约瑟住所。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。保留“那人”和“那些人”的原文泛称，不依据上下文增添身份说明；以“带进”自然体现使役动词及方向词尾所表达的进入动作。
