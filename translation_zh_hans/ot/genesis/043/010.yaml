  text: 要不是我们耽搁了[a]，我们现在早就已经回来两次了[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“逗留了”或“迟疑了”。希伯来语动词可表示耽搁、逗留或迟疑。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“我们现在就已经回来这两次了”；这是表示“回来两次”的说法。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי לוּלֵא
  choice: 要不是
  rationale: 这里引出与过去事实相反的条件；现代汉语用“要不是”自然表达犹大据此提出的反事实推论。句首的כִּי主要承接并说明前文理由，不必另译为“因为”。
- source_word: הִתְמַהְמָהְנוּ
  choice: 我们耽搁了
  rationale: 该词可指延误、逗留或迟疑；本处语境是启程一再推迟，“耽搁”既贴近词义，也自然易懂，同时以脚注保留其他可能语气。
- source_word: כִּי עַתָּה
  choice: 现在都已经
  rationale: 在反事实结果句中，这一组合强调截至说话时本可完成之事；“现在都已经”自然传达“到如今早已”的含义。
- source_word: שַׁבְנוּ
  choice: 往返
  rationale: 字面是“我们返回了”；但结合“两次”与上下文的行程，所指是本来足以完成两趟来回。“往返”使汉语意义清楚，脚注说明原文的字面表达。
- source_word: זֶה פַעֲמָיִם
  choice: 两次
  rationale: 这是表示“两次”的希伯来语习语；译作“两次”符合现代汉语表达。
