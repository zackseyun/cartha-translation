  yaml_path: translation/ot/genesis/043/033.yaml
  text: And they sat before him[a], the firstborn according to his birthright and the youngest according to his youth[b], and the men looked at one another in astonishment.
translation:
  language: zh_hans
  text: 他们在约瑟面前坐席，按出生次序，从长子到幼子；众人彼此相望，甚觉惊讶。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּשְׁבוּ לְפָנָיו
  choice: 他们在约瑟面前坐席
  rationale: 动词为主动叙事形式，直译是“坐”；结合宴席语境译作“坐席”更自然。代词所指为约瑟，汉语明说姓名可避免指代含混。
- source_word: הַבְּכֹר כִּבְכֹרָתוֹ וְהַצָּעִיר כִּצְעִרָתוֹ
  choice: 从长子到幼子，都按长幼次序排列
  rationale: 希伯来语以“长子/长子身份”和“幼子/年幼身份”相对，描述众兄弟依年龄与出生次序就座。中文用“从长子到幼子，按长幼次序”自然表达该结构；“排列”说明上下文所含的座次安排，而不把动词本身改成被动。
- source_word: וַיִּתְמְהוּ
  choice: 惊讶
  rationale: תמה表示惊奇、诧异；“惊讶”是现代汉语中准确而自然的对应词。
- source_word: הָאֲנָשִׁים אִישׁ אֶל־רֵעֵהוּ
  choice: 众人就彼此
  rationale: 原文称他们为“众人/那些人”，而非明说“兄弟”；איש אל־רעהו表示相互关系，译作“彼此”保留其互相反应的含义。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而通顺的叙事汉语。“坐席”贴合宴饮场景；“长子”“幼子”保留出生次序的家族语义。原文的惊讶对象或表现方式略为凝练，因此正文以“彼此惊讶”保留这种简约与一定的开放性，不扩写成“彼此对望”。
