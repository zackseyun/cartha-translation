  to: 他们在约瑟面前坐席，按出生次序，从长子到幼子；众人彼此相望，甚觉惊讶。
  rationale: 修订保留宴席语境中的“坐席”和明确的“约瑟”，并以“按出生次序，从长子到幼子”清楚呈现席位依年龄排列的意思。末句采用汉语自然的相互反应表达，对应“各人向同伴”及惊异之意，而不推定他们惊讶的具体缘由。
