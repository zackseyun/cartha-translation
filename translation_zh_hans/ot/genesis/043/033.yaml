    rationale: “彼此”在此对应“各人向同伴”的相互反应。用“彼此相望，甚觉惊讶”更自然，也保留原文所表达的互相惊异。
  revised_text: 他们在约瑟面前坐席，按出生次序，从长子到幼子；众人彼此相望，甚觉惊讶。
