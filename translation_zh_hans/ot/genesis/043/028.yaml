  text: וַ/יֹּאמְר֗וּ שָׁל֛וֹם לְ/עַבְדְּ/ךָ֥ לְ/אָבִ֖י/נוּ עוֹדֶ֣/נּוּ חָ֑י וַֽ/יִּקְּד֖וּ ו/ישתחו׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/028.yaml
  text: They said[a], “Your servant our father is well; he is still alive.” Then they bowed down and prostrated themselves.
translation:
  language: zh_hans
  text: 他们回答说：“你的仆人——我们的父亲——平安无恙[a]；他还活着。”于是他们俯身下拜，俯伏在地。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “平安无恙”所译的希伯来语“平安”（shalom），在这里惯指安好、康健。
    reason: 说明 שָׁלוֹם 在询问近况的语境中表示福祉、安好的惯用含义。
lexical_decisions:
- source_word: שָׁלוֹם
  choice: 平安
  rationale: 此处是对父亲近况询问的回答，表示安好、康健。现代汉语“平安”自然贴合问安语境，同时保留希伯来语“完整、安宁、福祉”的表达色彩；脚注说明其语用含义。
- source_word: לְעַבְדְּךָ
  choice: 你仆人
  rationale: 兄弟们在约瑟面前以谦卑的宫廷用语称父亲；“仆人”保留尊卑语气，而不将此处过度解释为奴隶身份。
- source_word: לְאָבִינוּ
  choice: 我们的父亲
  rationale: 按原文保留领属关系，并与“你仆人”构成同位语：“你仆人我们的父亲”。
- source_word: עוֹדֶנּוּ חָי
  choice: 他还活着
  rationale: “还”准确传达 עוֹד 的持续意味，表达他至今仍然活着。
- source_word: וַיִּקְּדוּ
  choice: 低头下拜
  rationale: קדד 指身体俯低或低头致敬；“低头下拜”清楚呈现这一动作。
- source_word: וישתחו
  choice: 俯伏在地
  rationale: השתחוה 在此表示向尊长俯伏致敬。“俯伏在地”呈现身体姿态，并避免误导为对神的敬拜。
theological_decisions:
- issue: וישתחו 所表达的是礼敬还是宗教敬拜
  choice: 俯伏在地
  alternative: 敬拜；下拜
  rationale: 叙事场景是兄弟们在约瑟面前表示臣服和尊敬，并非宗教敬拜；译文保留具体身体动作，不加入原文未明说的神学含义。
- issue: 是否合并两个连续的俯身动作
  choice: 保留为“低头下拜，俯伏在地”
  alternative: 合并译为“俯伏下拜”
  rationale: 原文使用两个不同动词，可能描写相继或加强的动作。分别翻译可保留这种重复及动作层次，而不武断判定两者完全同义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“你仆人我们的父亲”略带正式和谦恭色彩，以反映兄弟们面对埃及高官时的尊卑语域；正文保留两个俯身动词的动作层次。
