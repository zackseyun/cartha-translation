base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/029.yaml
  text: He lifted up his eyes and saw Benjamin[a], his brother, his mother's son, and said, “Is this your youngest brother, of whom you spoke to me?” Then he said, “May God be gracious to you, my son.”
translation:
  language: zh_hans
  text: 他抬眼看见便雅悯[a]，他同母的弟弟，就问：“这就是你们对我说过的那个最小的弟弟吗？”又说：“我儿，愿上帝恩待你。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“他的兄弟、他母亲的儿子”，强调便雅悯是约瑟同母的弟弟。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא עֵינָיו
  choice: 他抬起眼来
  rationale: 较直接地保留希伯来语“举目”的生动表达，同时符合现代汉语叙事习惯。
- source_word: וַיַּרְא אֶת בִּנְיָמִין
  choice: 看见了便雅悯
  rationale: ראה在这里表示实际看见；人名按现代中文圣经通行译法音译为“便雅悯”。
- source_word: אָחִיו בֶּן אִמּוֹ
  choice: 他的弟弟，就是他母亲所生的儿子
  rationale: 保留原文的同位说明，突出便雅悯与约瑟同母；根据叙事关系将אָח译为“弟弟”，但不压缩成解释性的“同母弟弟”。
- source_word: אֲחִיכֶם הַקָּטֹן
  choice: 你们……那个最小的弟弟
  rationale: 结合兄弟排行，הַקָּטֹן指最年幼者；“最小的弟弟”自然传达这一含义。
- source_word: אֲשֶׁר אֲמַרְתֶּם אֵלָי
  choice: 你们对我说过的
  rationale: 贴近原文“你们向我说过”，又在汉语中清楚指向先前提到便雅悯一事。
- source_word: אֱלֹהִים יָחְנְךָ
  choice: 愿上帝恩待你
  rationale: 用“愿”表达希伯来语祈愿式的祝福语气；“恩待”准确传达חנן所表示的施恩眷顾。
- source_word: בְּנִי
  choice: 我儿
  rationale: 保留阳性、亲切的称呼，并采用庄重自然的现代汉语表达。
theological_decisions:
- issue: אֱלֹהִים所构成的祝福祈愿
  choice: 愿上帝恩待你
  alternative: 上帝恩待你吧
  rationale: “愿”明确表达原文动词的祈愿语气，不把祝福误写成事实陈述，也不增添原文没有的神学内容。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。破折号保留原文同位语的强调作用，使“他母亲所生的儿子”清楚说明便雅悯与约瑟同母，同时避免用“亲弟弟”等可能带入额外现代亲属分类色彩的压缩说法。
