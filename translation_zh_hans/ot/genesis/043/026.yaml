base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/026.yaml
  text: When Joseph came into the house[a], they brought to him the gift that was in their hands into the house[c][b], and they bowed down to the ground before him.
translation:
  language: zh_hans
  text: 约瑟进了屋，他们就把手中的礼物带进屋里，呈给他，并俯伏在地，向他下拜。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא יוֹסֵף הַבַּיְתָה
  choice: 约瑟进了屋
  rationale: בוא 配合带方向词尾的 הַבַּיְתָה，表示进入屋内；现代汉语用“进了屋”自然且准确。
- source_word: וַיָּבִיאוּ לוֹ
  choice: 呈给他
  rationale: בוא 的使役式表示“带来”；此处带有把礼物交到约瑟面前的语境，因此以“呈给他”表达交付与敬意，同时不把动作提升为宗教献祭。
- source_word: הַמִּנְחָה
  choice: 礼物
  rationale: מִנְחָה 可指礼物、贡物或供物；本节是兄弟们为求善待而带来的礼品，“礼物”最清楚，也避免误解为祭物。
- source_word: אֲשֶׁר בְּיָדָם
  choice: 手中的
  rationale: 原文直译为“在他们手中的”；“手中的”保留具体意象，又符合简洁自然的现代汉语。
- source_word: הַבָּיְתָה
  choice: 带进屋里
  rationale: 原文第二次使用“进入屋内”的方向表达。译文保留这一信息，但以“屋里”避免汉语措辞生硬。
- source_word: וַיִּשְׁתַּחֲווּ לוֹ אָרְצָה
  choice: 俯伏在地，向他下拜
  rationale: שׁחה 表示俯身下拜、致敬，אָרְצָה 指向地面；此译既呈现身体姿态，也明确敬礼的对象。
theological_decisions:
- issue: 下拜是否含有敬拜神明之意
  choice: 向他下拜
  alternative: 敬拜他
  rationale: 这里是向埃及高官行臣服和尊敬之礼，并非明确的宗教敬拜；“下拜”保留行为含义而不引入神学判断。
translation_notes:
  register: 采用现代、庄重、易懂的叙事语体。保留原文两次进入屋内的空间信息，但按汉语习惯分别译为“进了屋”和“带进屋里”。
