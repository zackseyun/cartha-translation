  yaml_path: translation/ot/genesis/043/003.yaml
  text: Then Judah said to him[a], “The man solemnly warned us, saying[b], ‘You shall not see my face unless your brother is with you.’”
translation:
  language: zh_hans
  text: 犹大对他说：“那人郑重警告我们说：[a]‘除非你们的兄弟和你们在一起，你们不得见我的面。[b]’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “郑重警告”也可译作“严严地警告”或“明确告诫”。希伯来文以不定式绝对式与同一动词连用，加强语气。
    reason: lexical_alternative
  - marker: b
    text: “见我的面”也可理解为“到我面前来”或“来见我”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלָיו יְהוּדָה
  choice: 犹大对他说
  rationale: 未将叙事连接词 וַ 单独译出，以符合现代汉语叙事习惯；“他”按上下文指雅各。
- source_word: הָעֵד הֵעִד בָּנוּ
  choice: 郑重警告我们
  rationale: 不定式绝对式与限定动词连用，强化“警告、告诫”的语气；“郑重警告”保留其强调和严肃性。
- source_word: הָאִישׁ
  choice: 那人
  rationale: 保留希伯来文对那位埃及官员的一般称呼；汉语在回指已知人物时用“那人”自然。
- source_word: לֹא תִרְאוּ פָנַי
  choice: 不得见我的面
  rationale: 尽量保留原文“见我的面”的鲜明表达，同时以“不得”传达禁令或坚决条件。
- source_word: בִּלְתִּי אֲחִיכֶם אִתְּכֶם
  choice: 你们的弟弟若不和你们一起来
  rationale: בִּלְתִּי 在这里引出排除性条件；结合上下文，单数“你们的兄弟”特指便雅悯，现代汉语用“弟弟”更明确。加入“一起来”自然表达同行到场之意。
