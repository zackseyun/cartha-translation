base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/016.yaml
  text: When Joseph saw Benjamin with them[a], he said to the one over his household, “Bring the men into the house, slaughter an animal, and prepare it[c][b], because the men will eat with me at noon.”
translation:
  language: zh_hans
  text: 约瑟看见便雅悯和他们在一起，就对管家[a]说：“把这些人带进屋里，宰一头牲畜，预备好[b]，因为中午这些人要和我一起吃饭。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“管理他家的人”，也可译作“他家的主管”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“宰杀一场宰杀，预备好”。前一表达是希伯来语习语，指为用餐宰杀牲畜；“预备好”的宾语在原文中未明说，语境指所宰之物及用餐的安排。
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּרְא
  choice: 看见
  rationale: ראה的Qal叙事形式在此表示约瑟注意到便雅悯在场；“看见”直接自然。
- source_word: אִתָּם אֶת־בִּנְיָמִין
  choice: 看见便雅悯和他们在一起
  rationale: אִתָּם表示便雅悯与众兄弟同行；汉语调整语序以清楚表达宾语及其伴随关系。
- source_word: לַאֲשֶׁר עַל־בֵּיתוֹ
  choice: 对管家说
  rationale: 原文直译为“对那管理他家的人”；上下文所指为管理约瑟家务的人，用“管家”简洁自然，并以脚注保留字面表达。
- source_word: הָבֵא אֶת־הָאֲנָשִׁים הַבָּיְתָה
  choice: 把这些人带进屋里
  rationale: הַבָּיְתָה带方向词尾，明确表示进入屋内；“这些人”符合当前场景的指称。
- source_word: וּטְבֹחַ טֶבַח
  choice: 宰一只牲畜
  rationale: 动词与同根名词连用，字面为“宰杀一场宰杀”，是为餐食屠宰牲畜的希伯来语表达；译文补出自然的汉语宾语，但不指定牲畜种类。
- source_word: וְהָכֵן
  choice: 预备筵席
  rationale: כון的Hiphil祈使式表示“预备妥当”。结合宰牲畜和随后同席吃饭的语境，“预备筵席”在汉语中清楚自然；脚注说明也可理解为预备所宰之物。
- source_word: כִּי אִתִּי יֹאכְלוּ הָאֲנָשִׁים
  choice: 因为中午这些人要和我一起吃饭
  rationale: כִּי引出命令的原因；“和我一起吃饭”平实准确地传达אִתִּי יֹאכְלוּ。
- source_word: בַּצָּהֳרָיִם
  choice: 中午
  rationale: 该词表示正午或中午；置于原因分句开头更合现代汉语语序。
