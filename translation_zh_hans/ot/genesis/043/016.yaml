revisions:
- from: 约瑟看见便雅悯和他们在一起，就对管家[a]说：“把这些人带进屋里，宰一只牲畜，预备筵席[b]，因为中午这些人要和我一起吃饭。”
  to: 约瑟看见便雅悯和他们在一起，就对管家[a]说：“把这些人带进屋里，宰一头牲畜，预备好[b]，因为中午这些人要和我一起吃饭。”
  rationale: 修订仅收回“筵席”这一原文未明说的具体补充，保留命令的省略宾语及其由语境产生的指向；同时以更自然的量词表达未指定种类的供食动物。脚注相应说明希伯来语习语和省略现象。
