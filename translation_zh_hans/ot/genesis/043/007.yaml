base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/007.yaml
  text: They said, “The man questioned us closely about us and about our family, saying, ‘Is your father still alive? Do you have another brother?’ So we told him according to these words. How could we possibly know that he would say, ‘Bring your brother down’?”
translation:
  language: zh_hans
  text: 他们说：“那人仔细盘问我们和我们的家人，说：‘你们的父亲还活着吗？你们还有兄弟吗？’我们就照这些问题告诉了他。我们怎么会知道他会说：‘把你们那位兄弟带下来’呢？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׁאוֹל שָׁאַל
  choice: 仔细盘问
  rationale: 希伯来语以同根不定式加强限定动词，表示反复或详尽地询问；“仔细盘问”自然传达其强调意味，也符合当时兄弟们受审问的语境。
- source_word: מוֹלַדְתֵּנוּ
  choice: 我们的亲属
  rationale: 该词可指家世、家族或亲属关系；此处后续问题涉及父亲和兄弟，因此“亲属”比抽象的“家世”更贴合上下文，同时不把范围限缩为现代核心家庭。
- source_word: עַל־פִּי הַדְּבָרִים הָאֵלֶּה
  choice: 照他所问的
  rationale: 字面为“按照这些话/事情”；语境指他们依照那人的具体问题作答。这样表达在现代汉语中清楚自然，并保留问答之间的对应关系。
- source_word: הֲיָדוֹעַ נֵדַע
  choice: 我们怎么会知道
  rationale: 同根不定式结构配合疑问词形成强烈反问，意为他们不可能预先知道；此译保留反问语气。
- source_word: הוֹרִידוּ
  choice: 带下来
  rationale: 该动词意为“使下去、带下去”；叙事地理中从迦南前往埃及惯称“下去”，故保留方向性表达。
