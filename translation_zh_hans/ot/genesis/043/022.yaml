  text: וְ/כֶ֧סֶף אַחֵ֛ר הוֹרַ֥דְנוּ בְ/יָדֵ֖/נוּ לִ/שְׁבָּר אֹ֑כֶל לֹ֣א יָדַ֔עְנוּ מִי שָׂ֥ם כַּסְפֵּ֖/נוּ בְּ/אַמְתְּחֹתֵֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/022.yaml
  text: And we have brought down other silver in our hands to buy food[c][b][a]. We do not know who put our silver in our sacks.
translation:
  language: zh_hans
  text: 我们还随身带了别的银子下来[a][b]，要买食物[c]。我们不知道是谁把我们的银子放进了我们的袋子里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “随身”直译为“在我们手里”。
    reason: previous_rendering
  - marker: b
    text: “银子”也可译作“钱”；希伯来语כֶּסֶף既可指银，也可指作为货币的钱。本节两处相同。
    reason: lexical_alternative
  - marker: c
    text: “买食物”也可译作“买粮食”；这里的动词常指购买粮食，但宾语本身是范围较广的“食物”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כֶסֶף אַחֵר
  choice: 还……别的银子
  rationale: כֶּסֶף既可指银这种金属，也常指作为货币的钱财；译作“银子”既保留具体意象，也符合本段以银子购买粮食的语境。אַחֵר表示这是原先那笔银子之外另带的银子；“还……别的”在现代汉语中自然地表达追加和区别。
- source_word: הוֹרַדְנוּ
  choice: 带了下来
  rationale: 这是ירד的使役形，字面义为“使下去、带下去”。《创世记》惯常把从迦南前往埃及称为“下去”，故保留“下来”以呈现叙事中的地理视角。
- source_word: בְ/יָדֵ/נוּ
  choice: 随身
  rationale: 希伯来语字面为“在我们手里”，这里表示携带在身、由自己带来。“随身”准确传达其功能意义，并避免现代汉语中“在我们手里带下来”的生硬表达。
- source_word: לִ/שְׁבָּר אֹכֶל
  choice: 要买食物
  rationale: שׁבר在本语境中指购买粮食或口粮，אֹכֶל则是较宽泛的“食物”。正文采用“买食物”，既符合词义范围，也自然清楚。
- source_word: לֹא יָדַעְנוּ
  choice: 我们不知道
  rationale: 完成式在直接引语中可表达延续至说话时的认知状态；“不知道”自然呈现他们当前的声明，同时不额外断定他们过去某一刻才开始不知情。
- source_word: מִי שָׂם
  choice: 是谁……放进了
  rationale: מִי引出间接疑问“谁”，שׂים在此为“放、安放”；“是谁把……放进了”是自然准确的现代汉语表达。
- source_word: כַּסְפֵּ/נוּ בְּ/אַמְתְּחֹתֵי/נוּ
  choice: 把我们的银子放进了我们的袋子里
  rationale: 重复译出“银子”以保留原文同一词语的呼应。אַמְתַּחַת指装运粮食或物品的袋、口袋；“袋子”准确而不古旧。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而口语自然的叙事语言。“随身带了……下来”兼顾汉语流畅性和从迦南“下”埃及的原文视角；正文保留“银子”这一具体意象，并用脚注说明其货币义。
