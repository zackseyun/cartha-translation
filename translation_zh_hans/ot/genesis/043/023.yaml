base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/023.yaml
  text: He said[a], “Peace to you. Do not be afraid. Your God and the God of your father has given you treasure in your sacks[b]. Your silver came to me.” Then he brought Simeon out to them.
translation:
  language: zh_hans
  text: 他说：“愿你们平安！不要害怕。你们的上帝和你们父亲的上帝把财宝[a]赐给了你们，就在你们的袋子里。你们的银子[b]已经到我这里了。”随后，他把西缅带出来到他们那里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“隐藏的财宝”。
    reason: lexical_alternative
  - marker: b
    text: 或译“钱”。希伯来语“银子”常用来指钱财。
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלוֹם לָכֶם
  choice: 愿你们平安
  rationale: 这是用于安抚对方的问候或祝愿；“平安”保留שָׁלוֹם的核心含义，“愿你们”使表达符合现代汉语习惯。
- source_word: אַל תִּירָאוּ
  choice: 不要害怕
  rationale: 直接、自然地表达否定命令，并与上文的安抚语气衔接。
- source_word: אֱלֹהֵיכֶם וֵאלֹהֵי אֲבִיכֶם
  choice: 你们的上帝和你们父亲的上帝
  rationale: 保留原文两个并列称谓以及“父亲”的单数形式，不改写为“祖先”，也不判断管家的个人信仰。
- source_word: מַטְמוֹן
  choice: 财宝
  rationale: 该词指珍藏或隐藏之物；正文用自然简洁的“财宝”，脚注保留“隐藏的财宝”这一词义色彩。
- source_word: בְּאַמְתְּחֹתֵיכֶם
  choice: 就在你们的袋子里
  rationale: אַמְתַּחַת指装粮食等物品的袋子；“袋子”是清楚自然的现代汉语表达，“就在”呈现财宝所在之处。
- source_word: כַּסְפְּכֶם בָּא אֵלָי
  choice: 你们的银子已经到我这里了
  rationale: 保留כֶּסֶף的具体字面“银子”和“来到我这里”的原文表达，同时以“已经”体现其对当前情形的解释作用。
- source_word: וַיּוֹצֵא אֲלֵהֶם אֶת שִׁמְעוֹן
  choice: 随后，他把西缅带出来，交给他们
  rationale: “带出来”保留使役动词的方向含义；“交给他们”自然表达אֲלֵהֶם所指的趋向和交接结果。
theological_decisions:
- issue: 管家提到兄弟们的上帝和他们父亲的上帝
  choice: 按原文直接保留这两个称谓，不说明管家本人是否信奉这位上帝
  alternative: 将其解释为纯粹的外交性迎合，或视为管家个人信仰的明确宣认
  rationale: 原文只记载管家的话，并未揭示他的内在信念；译文应保留这一神学张力。
- issue: 财宝的来源与上帝的作为
  choice: 用“赐给”表达上帝主动给予财宝
  alternative: 仅译为中性的“放了”或把事件解释为人的秘密安排
  rationale: נָתַן明确以上帝为主语并表示给予；译文不应削弱这一归因，也不额外解释上帝如何施行。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“愿你们平安”保留原文的祝福与安抚意味；叙事部分使用“随后”保持自然推进。脚注标记均放在对应词语之后，修正了咨询层中标记位置与脚注内容不相符的问题。
