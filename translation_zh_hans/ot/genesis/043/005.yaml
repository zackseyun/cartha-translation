id: GEN.43.5
reference: Genesis 43:5
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/אִם אֵינְ/ךָ֥ מְשַׁלֵּ֖חַ לֹ֣א נֵרֵ֑ד כִּֽי הָ/אִ֞ישׁ אָמַ֤ר אֵלֵ֨י/נוּ֙ לֹֽא תִרְא֣וּ פָנַ֔/י בִּלְתִּ֖י אֲחִי/כֶ֥ם אִתְּ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/005.yaml
  text: But if you will not send him[a], we will not go down, because the man said to us, ‘You will not see my face unless your brother is with you.’
translation:
  language: zh_hans
  text: 但你若不让他去，我们就不下去，因为那人对我们说：‘除非你们的弟弟和你们一起来，否则你们不得见我的面。’[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “见我的面”是希伯来语惯用语，指到某人面前或获准晋见某人。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: 但你若
  rationale: 本节与上一节愿意下埃及的条件形成转折；“但……若”自然表达这一语境关系。
- source_word: אֵינְךָ מְשַׁלֵּחַ
  choice: 你若不让他去
  rationale: 否定词与分词表示雅各不肯或不打算放行；希伯来文省略宾语，按上下文补出指便雅悯的“他”。“让他去”比单纯“差派他”更符合父亲准许儿子同行的场景。
- source_word: לֹא נֵרֵד
  choice: 我们就不下去
  rationale: 保留从迦南前往埃及惯用的“下去”，也与叙事中的地理表达一致。
- source_word: כִּי
  choice: 因为
  rationale: 此处引出他们不下去的理由，因果关系明确。
- source_word: הָאִישׁ
  choice: 那人
  rationale: 说话者尚不知道约瑟的真实身份；译作“那人”既自然，也不加入人物当时并不知道的信息。
- source_word: לֹא תִרְאוּ פָנַי
  choice: 你们不得见我的面
  rationale: 保留“见我的面”的希伯来表达，同时用“不得”传达那人所下禁令的语气。
- source_word: בִּלְתִּי אֲחִיכֶם אִתְּכֶם
  choice: 除非你们的弟弟和你们一起来，否则
  rationale: בִּלְתִּי在此引出必要条件。“弟弟”符合兄长们谈论便雅悯的关系语境；“一起来”自然表达同行和到场之意。
