  text: וַ/יֹּ֨אמֶר יְהוּדָ֜ה אֶל יִשְׂרָאֵ֣ל אָבִ֗י/ו שִׁלְחָ֥/ה הַ/נַּ֛עַר אִתִּ֖/י וְ/נָק֣וּמָה וְ/נֵלֵ֑כָה וְ/נִֽחְיֶה֙ וְ/לֹ֣א נָמ֔וּת גַּם אֲנַ֥חְנוּ גַם אַתָּ֖ה גַּם טַפֵּֽ/נוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/008.yaml
  text: And Judah said to Israel his father[a], “Send the boy with me, and let us arise and go, so that we may live and not die—both we and you and our little ones.”
translation:
  language: zh_hans
  text: 犹大对他父亲以色列说：“请让那年轻人[a]跟我去。我们起身走吧，好让我们、你和我们的孩子们都可以活下去，不至于死。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “年轻人”或译“少年”。希伯来语 נַעַר 可指少年或年轻男子，并不只指幼童。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 未另译句首叙事连接词 וַ；现代汉语连续叙事中省略“于是/然后”更自然，也不额外限定其逻辑关系。
- source_word: יִשְׂרָאֵל אָבִיו
  choice: 他父亲以色列
  rationale: 保留原文所用的名字“以色列”，并自然表达 אָבִיו 的同位关系，不以“雅各”替换。
- source_word: שִׁלְחָה הַנַּעַר אִתִּי
  choice: 请让那年轻人跟我去
  rationale: 命令式在儿子对父亲说话的语境中用“请”表达恳求语气；שלח 在这里是让便雅悯随犹大出发。נער 可指少年或年轻男子，并非必指幼童。
- source_word: וְנָקוּמָה וְנֵלֵכָה
  choice: 我们这就动身
  rationale: 两个鼓励式动词共同催促立即起身前往；“这就动身”以自然现代汉语传达联合行动和紧迫感，避免生硬直译“起来去”。
- source_word: וְנִחְיֶה וְלֹא נָמוּת
  choice: 好让……可以活下去，不至于死
  rationale: 在语境中表达出行动的目的或预期结果，同时保留“活”与“死”的鲜明对照。
- source_word: גַּם אֲנַחְנוּ גַם אַתָּה גַּם טַפֵּנוּ
  choice: 我们、你和我们的孩子们都
  rationale: 用句末范围副词“都”自然承载三次 גַּם 的全面包含意味，并保留三个群体。
- source_word: טַפֵּנוּ
  choice: 我们的孩子们
  rationale: טף 指家中的幼小儿女或受扶养者；此处“孩子们”清楚自然，并保留他们作为家庭中脆弱成员的含义。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“这就动身”传达催促立即行动的语气；“活下去，不至于死”保留原文的生死对照。脚注标记已置于“年轻人”之后。
