base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/012.yaml
  text: Take double money in your hand[a], and take back in your hand the money that was returned in the mouth of your sacks[b]; perhaps it was a mistake.
translation:
  language: zh_hans
  text: 你们手里要带上双倍的钱，也要把放回你们袋口的钱带回去；也许是弄错了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֶסֶף מִשְׁנֶה
  choice: 加倍的钱
  rationale: מִשְׁנֶה 修饰“钱”，表示双倍的数额。“加倍的钱”既保留数量含义，也不武断判定这是原货款之外另备的一份，还是总共两倍。
- source_word: קְחוּ בְיֶדְכֶם
  choice: 手里要带上
  rationale: 希伯来语直译为“拿在你们手中”，实际指随身携带；译文保留“手里”的具体意象，同时符合现代汉语表达。
- source_word: הַכֶּסֶף הַמּוּשָׁב
  choice: 放回……的钱
  rationale: שוב 的使役被动分词表示钱被使之返回，即被放回原处；“放回”贴合前文钱重新出现在袋中的叙事情境，也不暗示兄弟们已经归还过这笔钱。
- source_word: בְּפִי אַמְתְּחֹתֵיכֶם
  choice: 你们袋口
  rationale: פִּי 字面为“口”，用于容器时自然指开口；“袋口”在现代汉语中直接、清楚，并保留原文意象。
- source_word: תָּשִׁיבוּ בְיֶדְכֶם
  choice: 一并带回去
  rationale: 使役形态 תָּשִׁיבוּ 表示使之返回、带回；结合重复的 בְיֶדְכֶם，译为随身带回。“一并”自然传达两笔钱都要携带，但不改变动作对象。
- source_word: אוּלַי מִשְׁגֶּה הוּא
  choice: 也许那是弄错了
  rationale: אוּלַי 表示不确定的推测；מִשְׁגֶּה 指错误或疏忽。“弄错了”适合此处交易语境，不引入欺骗或道德罪责。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而通顺的叙事语言。“袋口”自然保留希伯来语“袋子的口”的形象；两处 בְיֶדְכֶם 不机械重复为“在手里”，以免汉语生硬，但在首处保留其具体意象。
