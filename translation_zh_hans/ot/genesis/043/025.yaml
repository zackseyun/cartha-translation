source:
  edition: WLC
  text: וַ/יָּכִ֨ינוּ֙ אֶת הַ/מִּנְחָ֔ה עַד בּ֥וֹא יוֹסֵ֖ף בַּֽ/צָּהֳרָ֑יִם כִּ֣י שָֽׁמְע֔וּ כִּי שָׁ֖ם יֹ֥אכְלוּ לָֽחֶם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/025.yaml
  text: And they prepared the gift until Yosef came at noon[a], because they had heard that they would eat bread there.
translation:
  language: zh_hans
  text: 他们预备好礼物，等约瑟中午来到，因为他们听说要在那里吃饭[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“吃饼”，是指进餐或一同吃饭的习语。
    reason: 说明正文采用习语意义，同时保留原文“饼”的具体意象。
lexical_decisions:
- source_word: וַיָּכִינוּ
  choice: 预备好
  rationale: 该词是כון的使役式叙事形，表示把某物准备妥当；“预备好”既体现完成结果，也符合庄重而自然的现代汉语。
- source_word: הַמִּנְחָה
  choice: 礼物
  rationale: 本段指兄弟们带给约瑟的赠礼，并非祭祀用的供物；译作“礼物”可避免不必要的宗教含义。
- source_word: עַד בּוֹא יוֹסֵף
  choice: 等约瑟……来到
  rationale: עַד与不定词结构表示动作持续或安排延伸至约瑟到来之时；汉语用“等……来到”自然表达这一时间关系，同时不把它误解为目的。
- source_word: בַּצָּהֳרָיִם
  choice: 中午
  rationale: 该词明确指正午或白昼中段；“中午”是现代汉语最自然的对应词。
- source_word: כִּי שָׁמְעוּ
  choice: 因为他们听说
  rationale: 第一个כִּי表示原因；“听说”在汉语中自然表达他们先前所得的消息，无须另用完成时标记。
- source_word: כִּי שָׁם
  choice: 要在那里
  rationale: 第二个כִּי引出他们听见的内容，שָׁם表示地点；按汉语语序整合为“听说要在那里……”。
- source_word: יֹאכְלוּ לָחֶם
  choice: 吃饭
  rationale: 字面为“吃饼/吃食物”，在此是共餐、进餐的习语；正文译作自然清楚的“吃饭”，脚注保留原文意象。
- source_word: יוֹסֵף
  choice: 约瑟
  rationale: 采用现代中文圣经读者熟悉且稳定的希伯来人名音译。
theological_decisions: []
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“预备好礼物，等……”避免生硬直译，却保留原文从预备礼物延续到约瑟抵达的时间关系；“吃饭”传达希伯来习语的实际意义，并以脚注注明字面表达。
