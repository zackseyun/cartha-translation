  to: 他们给他单独摆上饭食，给他们单独摆上饭食，也给那些与他一同吃饭的埃及人单独摆上饭食；因为埃及人不能跟希伯来人一同吃饭[a]，这在埃及人看来是可憎的事。
  rationale: 仅补足第三分句并在各分句明示省略的“饭食”，使三次“单独”各自明确对应原文的三重分隔；未确定代词所指，也未解释埃及人禁忌的具体原因。将“同席”调整为“一同”以避免现代汉语中“同一张桌子”的过度具体化，同时保留共同用餐之意。
