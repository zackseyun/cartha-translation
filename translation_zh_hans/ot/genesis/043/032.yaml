base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/032.yaml
  text: So they served him by himself[a], and them by themselves, and the Egyptians who ate with him by themselves, because the Egyptians could not eat bread with the Hebrews, for that is an abomination to the Egyptians.
translation:
  language: zh_hans
  text: 他们给他单独摆上饭食，给他们单独摆上饭食，也给那些与他一同吃饭的埃及人单独摆上饭食；因为埃及人不能跟希伯来人一同吃饭[a]，这在埃及人看来是可憎的事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“跟希伯来人吃饼（或食物）”，是指一同用餐。
    reason: 说明希伯来语惯用表达及正文“一同吃饭”的译法。
lexical_decisions:
- source_word: וַיָּשִׂימוּ
  choice: 摆上饭食
  rationale: 该动词本义为“放置、摆上”；在用餐语境中指摆上饭食。译文补出隐含的“饭食”，使现代汉语自然，同时保留“摆上”的具体动作。
- source_word: לְבַדּוֹ / לְבַדָּם
  choice: 单独
  rationale: 反复使用“单独”，对应原文三次强调的分席安排与群体隔离。
- source_word: הָאֹכְלִים אִתּוֹ
  choice: 与他一同吃饭的
  rationale: 按分词短语的关系从句功能翻译，既自然，也不额外确定这些埃及人的具体身份。
- source_word: לֹא יוּכְלוּן
  choice: 不能
  rationale: 保留原文所表达的不能或社会禁忌所造成的不可能，不擅自限定为生理能力或正式法律禁令。
- source_word: לֶאֱכֹל אֶת הָעִבְרִים לֶחֶם
  choice: 跟希伯来人同席吃饭
  rationale: “吃饼/吃食物”在这里是共同用餐的惯用表达；“同席吃饭”自然传达共享餐席的含义，字面形式在脚注说明。
- source_word: תוֹעֵבָה
  choice: 可憎的事
  rationale: 保留该词强烈的厌恶和禁忌色彩，又避免在正文中擅自将其专门化为礼仪、宗教或种族层面的术语。
- source_word: מִצְרִים / הָעִבְרִים
  choice: 埃及人 / 希伯来人
  rationale: 准确保留原文对两个族群的明确对照。
theological_decisions:
- issue: 埃及人拒绝共同进餐的性质
  choice: 译作“不能”及“可憎的事”，不进一步解释禁忌缘由
  alternative: 明确译成礼仪不洁、宗教禁忌或种族歧视
  rationale: 本节说明这是埃及人所厌恶、不能接受的事，却未交代具体原因；保留这种未说明的张力，避免加入原文没有明说的解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。以三次“单独摆上”尽量再现原文的重复和分隔感；代词“他、他们”按原文保留，由上下文确定所指，不在本节擅自补入人名。
