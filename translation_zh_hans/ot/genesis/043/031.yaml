  text: Then he washed his face[a], came out, controlled himself, and said, “Serve the food.”
translation:
  language: zh_hans
  text: 他洗了脸，出来，克制住自己，说：“把饭食[a]摆上来。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “饭食”原文为“饼”，这里泛指所摆设的食物或饭食。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְחַץ פָּנָיו
  choice: 他洗了脸
  rationale: רחץ通常表示“洗”，פָּנִים虽为复数形式，在这里按现代汉语习惯译作单数“脸”。上下文表明约瑟哭过后洗脸再出去。
- source_word: וַיֵּצֵא
  choice: 出来后
  rationale: יצא表示“出去、出来”；叙事焦点随约瑟从内室回到众人所在之处，译作“出来”自然。加“后”使连续动作符合现代汉语表达。
- source_word: וַיִּתְאַפַּק
  choice: 强忍住自己
  rationale: אפק的Hitpael形式表示克制自己；结合前文哭泣的情境，“强忍住自己”保留了主动压抑强烈情绪的力度。
- source_word: שִׂימוּ לָחֶם
  choice: 摆饭吧
  rationale: שׂים字面为“放、摆”，לֶחֶם字面为“饼、食物”，在设宴语境中合起来是吩咐人把饭食摆上。“摆饭”既保留“摆放”的意象，也自然表达开席前上饭菜的动作。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“强忍住自己”比单纯“控制住自己”更贴合约瑟刚刚哭过、需要压住情绪的语境；“摆饭吧”以简洁口语化命令表达宴席场景。脚注标记置于整句之后，说明“饭”所对应的希伯来语字面意义。
