base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/015.yaml
  text: So the men took this gift[a], and they took double the money in their hand, and Benjamin[d][c][b]. Then they arose and went down to Egypt and stood before Joseph.
translation:
  language: zh_hans
  text: 这些人就带着这份礼物，手里拿着双倍的钱，又带上便雅悯。他们动身下到埃及[a]，站在约瑟面前。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “下到埃及”是希伯来语从迦南前往埃及时常用的地理说法。
    reason: cultural_note
lexical_decisions:
- source_word: הַמִּנְחָה הַזֹּאת
  choice: 这份礼物
  rationale: 此处指带给埃及统治者、意在示好的馈赠，并非祭祀用的供物；“礼物”符合叙事语境，也适合现代汉语。
- source_word: מִשְׁנֶה כֶּסֶף
  choice: 双倍的钱
  rationale: מִשְׁנֶה 表示相对于先前数额加倍；כֶּסֶף 字面为“银子”，在交易语境中指钱款。
- source_word: בְיָדָם
  choice: 带在手中
  rationale: 保留希伯来语“在他们手中”的携带、掌握意象，同时用现代汉语可理解的表达呈现。
- source_word: וְאֶת־בִּנְיָמִן
  choice: 并带上便雅悯
  rationale: 第二个 לָקְחוּ 的宾语包括钱和便雅悯；汉语补出“带上”，可清楚表达其句法关系。
- source_word: וַיָּקֻמוּ
  choice: 他们动身
  rationale: 该动词字面是“起来”，在旅行叙事中常表示起身出发；“动身”自然地传达此处语用意义。
- source_word: וַיֵּרְדוּ מִצְרַיִם
  choice: 下到埃及
  rationale: 保留从迦南前往埃及时惯用的“下去”这一地理表达。
- source_word: וַיַּעַמְדוּ לִפְנֵי יוֹסֵף
  choice: 站在约瑟面前
  rationale: 忠实保留“站立”及“在……面前”的正式觐见姿态，不将其释义化为单纯的“见到”。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重的现代标准汉语。保留“下到埃及”和“站在约瑟面前”等原文意象；对旅行语境中的“起来”译作“动身”，避免生硬直译。
