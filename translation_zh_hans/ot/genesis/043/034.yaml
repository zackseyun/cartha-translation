  to: 约瑟从自己面前把食物分给他们[a]，但便雅悯所得的那一份，是他们各人所得的一份的五倍[b]。他们便和约瑟一同喝酒，喝醉了[c]。
  rationale: 仅修正“多五倍”在现代汉语中的倍数歧义，并微调比较结构和首句语序以提升清晰度；保留原文的宴席意象、五倍份额和明确醉酒的含义。
