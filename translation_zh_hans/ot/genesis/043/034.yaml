base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/034.yaml
  text: He sent portions to them from before him[a], but Benjamin’s portion was five times as much as all of theirs[c][b]. So they drank and became drunk with him.
translation:
  language: zh_hans
  text: 约瑟从自己面前把食物分给他们[a]，但便雅悯所得的那一份，是他们各人所得的一份的五倍[b]。他们便和约瑟一同喝酒，喝醉了[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译是“从他面前”，可能指从约瑟自己席前送来的食物。
    reason: cultural_note
  - marker: b
    text: 原文直译是“五只手”，这是表示分量为五倍的希伯来语说法。
    reason: lexical_alternative
  - marker: c
    text: 这个希伯来语动词也有译本较委婉地译作“尽欢”，但它更直接的意思是“喝醉”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא מַשְׂאֹת
  choice: 把……食物分给
  rationale: 该组合在宴席语境中指把一份份食物送到赴宴者那里；译作“把食物分给”比字面的“举起份额”自然，也没有误作一般礼物。
- source_word: מֵאֵת פָּנָיו
  choice: 从自己面前
  rationale: 保留希伯来文“从他面前”的空间意象，语境表明这些食物来自约瑟席前，而不必在正文中直接解释为“从他的桌上”。
- source_word: מַשְׂאַת בִּנְיָמִן
  choice: 便雅悯所得的一份
  rationale: 在宴席中 מַשְׂאַת 指所分得的一份食物；加入“所得”使现代汉语表达顺畅。
- source_word: מִמַּשְׂאֹת כֻּלָּם
  choice: 比他们任何一人所得的
  rationale: 这里是把便雅悯的一份与其余每个人各自所得的一份相比；如此处理可避免误解为比众人的食物总和还多。
- source_word: חָמֵשׁ יָדוֹת
  choice: 多五倍
  rationale: 字面为“五只手”，是表示分量倍数的习语；现代汉语以“多五倍”清楚传达其比较意义。
- source_word: וַיִּשְׁתּוּ
  choice: 喝酒
  rationale: 宴席语境中的一般饮用动词；汉语补出“酒”，并由下一动词“喝醉”明确其所饮为何。
- source_word: וַיִּשְׁכְּרוּ
  choice: 喝醉了
  rationale: 该动词直接表示醉酒，不宜弱化为“畅饮”或“尽欢”。
- source_word: עִמּוֹ
  choice: 和约瑟一同
  rationale: 代词所指是约瑟；汉语明确复现姓名，可避免“和他”在本节多个人物中的潜在指代含混。
