  yaml_path: translation/ot/genesis/043/030.yaml
  text: Then Joseph hurried[a], because his compassion for his brother was stirred, and he sought a place to weep[b]. He entered the room and wept there.
translation:
  language: zh_hans
  text: 约瑟因对弟弟的怜爱之情涌起，便赶忙找地方哭[a]；他进了内室，在那里哭了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文更直译为“他寻求哭泣”或“他寻找哭泣”；正文根据他随后进入内室的语境译为“找地方哭”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמַהֵר
  choice: 急忙离开
  rationale: 该动词意为“赶快、急忙”。原文未明说“离开”，但下文表明约瑟为哭泣而进入内室；中文补出“离开”，可自然表达他匆忙退出当前场合的动作，并以脚注注明原文的简略说法。
- source_word: נִכְמְרוּ רַחֲמָיו
  choice: 怜爱之情激荡起来
  rationale: 这是一个强烈的身体—情感习语，字面涉及“怜悯/慈爱”在内心翻腾或发热。“怜爱之情激荡起来”既保留情感强度，也符合现代汉语表达。
- source_word: אֶל אָחִיו
  choice: 对弟弟
  rationale: אָח 可指兄弟；根据叙事语境，此人是约瑟的弟弟便雅悯。中文用“弟弟”准确表达已由上下文确定的亲属关系，无须在本节补出姓名。
- source_word: וַיְבַקֵּשׁ לִבְכּוֹת
  choice: 想找个地方哭
  rationale: 字面为“寻求/设法哭”。结合紧接着进入内室的动作，所寻求的是可以哭泣的私密地方；译文将这一隐含宾语自然表达出来，并用脚注保留较直译的可能。
- source_word: הַחַדְרָה
  choice: 内室
  rationale: חֶדֶר 指房间或内间；此处是约瑟进去独自哭泣的私密房间。“内室”简洁地传达其内部、隐蔽的性质。
- source_word: וַיֵּבְךְּ שָׁמָּה
  choice: 在那里哭了
  rationale: 直接保留哭泣动作及 שָׁמָּה 的地点强调。
