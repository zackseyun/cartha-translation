  text: וְ/אֵ֣ל שַׁדַּ֗י יִתֵּ֨ן לָ/כֶ֤ם רַחֲמִים֙ לִ/פְנֵ֣י הָ/אִ֔ישׁ וְ/שִׁלַּ֥ח לָ/כֶ֛ם אֶת אֲחִי/כֶ֥ם אַחֵ֖ר וְ/אֶת בִּנְיָמִ֑ין וַ/אֲנִ֕י כַּ/אֲשֶׁ֥ר שָׁכֹ֖לְתִּי שָׁכָֽלְתִּי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/014.yaml
  text: May God Almighty grant you mercy before the man[a], so that he may send back your other brother and Benjamin. And as for me, if I am bereaved[c][b], I am bereaved.
translation:
  language: zh_hans
  text: 愿全能的上帝使你们在那人面前蒙怜悯[a]，并让那人把你们的另一个兄弟[b]和便雅悯送回来。至于我，我若丧子，就丧子吧[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译近于“在那人面前赐给你们怜悯”；“怜悯”也可译作“同情”或“慈悲”。
    reason: lexical_alternative
  - marker: b
    text: “另一个兄弟”指先前被扣留在埃及的西缅。
    reason: cross_reference
  - marker: c
    text: 原文重复同一个“丧子”动词，直译可作“我若丧子，我就丧子”，表达雅各无奈接受可能发生的损失。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵל שַׁדַּי
  choice: 全能的上帝
  rationale: 将神的称号译出而不音译；“全能的上帝”是现代汉语中清楚、庄重且惯用的表达。
- source_word: יִתֵּן לָכֶם רַחֲמִים לִפְנֵי הָאִישׁ
  choice: 使那人怜悯你们
  rationale: 希伯来语直译近于“在那人面前赐给你们怜悯”；汉语以使役结构自然表达他们盼望从那人得到怜悯，同时保留 רַחֲמִים 所含的怜悯、同情之意。
- source_word: וְשִׁלַּח לָכֶם
  choice: 放……回来
  rationale: 语境所指是被扣留者获释并与他们一同返回；“放……回来”兼顾释放与返回的含义。
- source_word: אֶת אֲחִיכֶם אַחֵר
  choice: 你们的另一个兄弟
  rationale: 按 אַחֵר 的通常意义译为“另一个”；上下文表明此人是被扣留的西缅，但正文不直接补出名字。
- source_word: וַאֲנִי
  choice: 至于我
  rationale: 反映独立人称代词的强调作用和话题转折。
- source_word: כַּאֲשֶׁר שָׁכֹלְתִּי שָׁכָלְתִּי
  choice: 我若丧子，就丧子吧
  rationale: 保留同一动词的重复和雅各无奈接受后果的语气；“丧子”明确表达 שׁכל 在此处失去儿女的含义。
theological_decisions:
- issue: 神的称号 אֵל שַׁדַּי 的译法
  choice: 全能的上帝
  alternative: 伊勒·沙代
  rationale: 这里是有意义的神圣称号，不是普通专名；译出称号可让现代读者直接理解，同时不额外引入特定宗派解释。
- issue: 末句的语气与句法
  choice: 我若丧子，就丧子吧
  alternative: 我既已丧子，就仍是丧子
  rationale: כַּאֲשֶׁר 在这一固定式重复中可呈现条件或比较色彩；结合叙事情境，条件式最自然地表达雅各对可能继续失去儿子的无奈，但脚注说明原文重复及其可理解方式。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“愿”保持祝愿与祈求语气；末句用“吧”自然传达无奈的决绝。所有解释性补充均置于脚注，正文不直接把“另一个兄弟”改写为“西缅”。
