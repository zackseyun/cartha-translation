base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/024.yaml
  text: The man brought the men into Joseph’s house and gave them water[a], and they washed their feet[c][b]; then he gave fodder to their donkeys.
translation:
  language: zh_hans
  text: 那人把那些人带进约瑟的家，给了他们水，他们便洗了脚；他又给他们的驴喂了草料。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文称“那人”和“那些人”，本节没有明说那人是约瑟的管家，也没有明说那些人是约瑟的兄弟，尽管上下文清楚表明了他们的身份。
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֵא
  choice: 带进
  rationale: 该词是 בוא 的使役形式，表达使人进入；“带进”自然地保留了使役和进入屋内的方向。
- source_word: הָאִישׁ / הָאֲנָשִׁים
  choice: 那人 / 众人
  rationale: 原文分别只说单数的“那人”和复数的“那些人”。不将前者明说为管家，也不将后者明说为约瑟的兄弟，以保留本节措辞；汉语中“众人”可避免“那人把那些人”过于拗口。
- source_word: בֵּיתָה יוֹסֵף
  choice: 进约瑟的家
  rationale: בֵּיתָה 的方向词尾表示向内移动，“进……的家”准确表达进入，而不只是到达。
- source_word: וַיִּתֶּן מַיִם
  choice: 给他们水
  rationale: 原文直译为“给水”；汉语补出由语境明确的受事“他们”，使表达自然。
- source_word: וַיִּרְחֲצוּ רַגְלֵיהֶם
  choice: 他们就洗了脚
  rationale: 动词是主动复数，明确由众人自己洗脚；不改为被动或暗示仆人为他们洗脚。
- source_word: מִסְפּוֹא
  choice: 草料
  rationale: 指牲畜的饲料；“草料”是现代汉语中自然、具体且符合驴所食用饲料的说法。
- source_word: וַיִּתֵּן מִסְפּוֹא לַחֲמֹרֵיהֶם
  choice: 给他们的驴添上草料
  rationale: “添上草料”自然表达为牲畜供应饲料的动作，并保留受益对象“他们的驴”。
