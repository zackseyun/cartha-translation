base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/018.yaml
  text: The men were afraid because they had been brought into Joseph’s house[a], and they said, “It is because of the money that was returned in our sacks the first time that we are being brought in, so that he may make a pretext against us and fall upon us and take us as slaves, along with our donkeys.”
translation:
  language: zh_hans
  text: 那些人见自己被带进约瑟家里，就害怕，说：“因为上次银子被放回我们袋里，才把我们带进来；这是要找借口对付我们[a]，袭击我们，把我们抓去作奴隶，并夺走我们的驴。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“要伺机对付我们。”这里的希伯来语是一个含义较难确定的习语。
    reason: 说明原文习语的词义不确定性，并提供同样符合语境的译法。
lexical_decisions:
- source_word: וַיִּירְאוּ
  choice: 就害怕
  rationale: 这里的 ירא 表示那些人因被带进约瑟家而产生恐惧；“就害怕”自然地承接叙事因果。
- source_word: הוּבְאוּ בֵּית יוֹסֵף
  choice: 被带进约瑟家里
  rationale: הוּבְאוּ 是 בוא 的使役被动式，表示他们被人带入；“约瑟家里”准确表达处所和所属关系。
- source_word: עַל דְּבַר הַכֶּסֶף
  choice: 是因为……银子
  rationale: עַל דְּבַר 在这里表示原因或事由，而不只是谈论的主题。
- source_word: הַשָּׁב בְּאַמְתְּחֹתֵינוּ בַּתְּחִלָּה
  choice: 上次放回我们袋里的
  rationale: הַשָּׁב 描写银子被放回或返回袋中的结果；בַּתְּחִלָּה 在上下文中指先前第一次来埃及的时候，以“上次”表达更符合现代汉语叙事。אַמְתַּחַת 指旅途或装粮食用的袋子。
- source_word: לְהִתְגֹּלֵל עָלֵינוּ
  choice: 要找借口对付我们
  rationale: 这一希伯来语习语含义较难确定，在本语境中可能指借故发难、伺机对付或寻找控告的由头；正文采用自然且保留敌对意图的表达，并以脚注说明另一种译法。
- source_word: וּלְהִתְנַפֵּל עָלֵינוּ
  choice: 袭击我们
  rationale: נפל 的反身词干与 עַל 连用，在这里表达扑向或攻击；“袭击”在现代汉语中清楚而不生硬。
- source_word: וְלָקַחַת אֹתָנוּ לַעֲבָדִים
  choice: 把我们……抓去做奴隶
  rationale: 该短语表示强行夺取并使人成为奴隶，不只是一般意义上的服侍；“抓去做奴隶”传达其强制性。
- source_word: וְאֶת חֲמֹרֵינוּ
  choice: 和我们的驴都
  rationale: 将驴与他们一并列为被夺取的对象；“都”自然涵盖人和牲畜，同时不改变原意。
