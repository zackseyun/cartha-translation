revisions:
- from: 那些人见自己被带进约瑟家里，就害怕，说：“我们被带进来，是因为上次放回我们袋里的银子；这是要找借口对付我们[a]，袭击我们，把我们和我们的驴都抓去做奴隶。”
  to: 那些人见自己被带进约瑟家里，就害怕，说：“因为上次银子被放回我们袋里，才把我们带进来；这是要找借口对付我们[a]，袭击我们，把我们抓去作奴隶，并夺走我们的驴。”
  rationale: 修订仅消除末句的结构性歧义，使“作奴隶”明确只指人，而驴作为被夺走的财物另列；同时略调顺因果与目的关系。未对困难习语作超出原文证据的解释。
