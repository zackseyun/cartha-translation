review_pass:
  verdict: revise
  source_fidelity: 草稿总体准确反映了他们因被带进约瑟家而恐惧，以及他们将此事归因于先前被放回袋中的银子。可是末句把“我们”和“我们的驴”共同置于“做奴隶”的补语之下，容易且实际会被理解为连驴也被抓去“做奴隶”。希伯来文的“作奴隶”只修饰“我们”；驴是另一个被夺取的对象，须明确分开表达。
  naturalness: 原文“这是要找借口对付我们”中“这”指代略松散；改为“为要……，袭击……，把……抓去作奴隶，并夺走……”可使恐惧中的推断和并列目的更清楚，也更符合现代汉语叙事。
  terminology: “约瑟家里”“银子”“袋里”“奴隶”均恰当。“找借口对付我们”可保留为对困难习语的审慎译法，脚注提供“伺机对付我们”的替代译文并说明习语的不确定性，合宜。
