base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/002.yaml
  text: And when they had finished eating the grain that they had brought from Egypt[a], their father said to them, “Go back; buy us a little food.”
translation:
  language: zh_hans
  text: 他们吃完了从埃及带来的粮食后，父亲对他们说：“你们再回去，给我们买一点食物。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: ……，……就……
  rationale: 这一叙事结构引出随后发生的事。汉语用前一分句交代时间背景，并以“就”连接主句，比直译“事情发生在……”自然，同时保留事件的先后关系。
- source_word: כִּלּוּ לֶאֱכֹל
  choice: 吃完了
  rationale: כלה与不定式“吃”连用，表示动作完成；“吃完了”准确而自然。
- source_word: הַשֶּׁבֶר
  choice: 粮食
  rationale: 在约瑟故事的饥荒语境中，该词特指购得的谷粮；“粮食”比泛称“食物”更准确，也符合现代汉语。
- source_word: הֵבִיאוּ מִמִּצְרָיִם
  choice: 从埃及带来的
  rationale: 定语结构自然表达这些粮食此前已从埃及带回，并清楚保留来源。
- source_word: אֲבִיהֶם
  choice: 父亲
  rationale: 希伯来文使用亲属称谓而非雅各的名字；汉语语境中省略已明确的“他们的”更自然，关系仍无歧义。
- source_word: שֻׁבוּ
  choice: 再去一趟
  rationale: 命令他们再次前往埃及。结合后面的“回来”，“再去一趟”自然传达返回原地采购的意思。
- source_word: שִׁבְרוּ
  choice: 买
  rationale: 该动词在本语境中特指购买粮食或供应品；因宾语随后出现，译作“买”即可，避免重复或过度限定。
- source_word: לָנוּ
  choice: 给我们
  rationale: 明确表达受益者，与现代汉语“给我们买”这一常用结构相符。
- source_word: מְעַט אֹכֶל
  choice: 一点食物
  rationale: מְעַט表示少量，אֹכֶל是一般意义的食物；译文保留由前文具体“粮食”转为此处广义“食物”的词汇差异。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而口语自然的叙事语言。“粮食”与“食物”分别对应原文较具体的שֶׁבֶר和较宽泛的אֹכֶל；“再去一趟……回来”使父亲要求他们重返埃及采购的方向关系在汉语中清楚自然。
