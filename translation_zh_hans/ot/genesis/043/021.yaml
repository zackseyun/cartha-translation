base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/021.yaml
  text: And when we came to the lodging place and opened our sacks[a], behold[b], each man's silver was in the mouth of his sack—our silver in its full weight—and we brought it back in our hand.
translation:
  language: zh_hans
  text: 我们到了住宿的地方，打开袋子一看，只见各人的银子都在各自的袋口[a]，我们的银子分量丝毫不少[b]；我们把银子带回来了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语直译为“在各自袋子的口中”，即在袋子的开口处。
    reason: lexical_alternative
  - marker: b
    text: 或译“我们的银子按原有的重量”；意思是退回的正是原先按重量付出的足额银子。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמָּלוֹן
  choice: 住宿的地方
  rationale: 指旅途中住宿过夜之处，不一定是现代意义上的商业客店；此译法自然且不过度具体化。
- source_word: וַנִּפְתְּחָה
  choice: 打开
  rationale: 此处带附加词尾的形式在叙事中表达第一人称复数动作；汉语结合主语“我们”自然译为“打开”。
- source_word: אַמְתְּחֹתֵינוּ / אַמְתַּחְתּוֹ
  choice: 袋子 / 各自的袋
  rationale: 该词指装粮食或旅行用品的袋子；“袋子”符合约瑟叙事语境，也比“包”更准确。
- source_word: וְהִנֵּה
  choice: 不料
  rationale: 该词凸显突然发现和出乎意料；“不料”以自然的现代汉语保留其叙事冲击力。
- source_word: כֶּסֶף אִישׁ
  choice: 各人的银子
  rationale: אִישׁ 在这里具有逐一分配的意义；保留“银子”而不泛化为“钱”，与希伯来语用词一致。
- source_word: בְּפִי אַמְתַּחְתּוֹ
  choice: 在各自的袋口
  rationale: 希伯来语直译为“在他袋子的口中”；汉语通常称“袋口”，既保留容器开口的意象，又清楚自然。
- source_word: כַּסְפֵּנוּ בְּמִשְׁקָלוֹ
  choice: 我们的银子分量丝毫不少
  rationale: 短语强调按重量计算，原先付出的银子原数退回、没有短缺；此译法清楚表达其实际含义。
- source_word: וַנָּשֶׁב אֹתוֹ
  choice: 我们又把银子带回来了
  rationale: 该形式在直接引语中叙述他们发现后把银子带回来这一行动；“带回来了”兼顾已完成的行动及说话时银子已被带到现场的语境。
- source_word: בְּיָדֵנוּ
  choice: 亲手
  rationale: 原文直译为“在我们手中”；“亲手”在此简洁保留由他们自己携带回来的含义，而不显得生硬。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“打开袋子一看，不料”自然呈现发现银子时的突然感；“分量丝毫不少”传达按重量足额退回的含义。未加入任何宗派性解释。
