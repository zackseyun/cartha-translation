  text: אָֽנֹכִי֙ אֶֽעֶרְבֶ֔/נּוּ מִ/יָּדִ֖/י תְּבַקְשֶׁ֑/נּוּ אִם לֹ֨א הֲבִיאֹתִ֤י/ו אֵלֶ֨י/ךָ֙ וְ/הִצַּגְתִּ֣י/ו לְ/פָנֶ֔י/ךָ וְ/חָטָ֥אתִֽי לְ/ךָ֖ כָּל הַ/יָּמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/009.yaml
  text: I myself will guarantee him. From my hand you may require him. If I do not bring him to you and set him before you[a], then I will bear the blame to you all my days.
translation:
  language: zh_hans
  text: 我亲自为他担保；你可以向我索要他。我要是不把他带到你这里，呈在你面前，我就终身对你有罪。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我就一生对你负罪。”
    reason: lexical_alternative
lexical_decisions:
- source_word: אָנֹכִי
  choice: 我亲自
  rationale: 独立人称代词在此带有强调意味，突出犹大本人承担责任。
- source_word: אֶעֶרְבֶנּוּ
  choice: 为他担保
  rationale: ערב在此表示作保、承担保证责任；现代汉语“为他担保”自然且保留法律责任意味。
- source_word: מִיָּדִי תְּבַקְשֶׁנּוּ
  choice: 你可以向我追讨他
  rationale: 直译涉及“从我手中索取他”的责任意象；“向我追讨他”在现代汉语中较自然，也表达父亲可向犹大问责。
- source_word: הֲבִיאֹתִיו אֵלֶיךָ
  choice: 把他带到你这里
  rationale: 忠实表达“把他带给你”，不额外加入原文未明说的“带回来”。
- source_word: וְהִצַּגְתִּיו לְפָנֶיךָ
  choice: 领他站在你面前
  rationale: 保留使他被呈到雅各面前的具体场景，同时比生硬的“把他置于你面前”更符合现代汉语。
- source_word: וְחָטָאתִי לְךָ
  choice: 我就……得罪你
  rationale: חטא通常指犯罪、得罪；此处是人际承诺中的罪责。译作“得罪你”既保留道德分量，也符合 לְךָ 的关系指向。
- source_word: כָּל הַיָּמִים
  choice: 一生
  rationale: 该短语表示终身持续；“一生”是简洁自然的现代汉语表达。
theological_decisions:
- issue: וְחָטָאתִי לְךָ 在人际担保誓言中的含义
  choice: 我就一生得罪你
  alternative: 我就一生在你面前担当罪责／我就一生对你负罪
  rationale: 不把普通的“犯罪、得罪”动词淡化为单纯的“受责备”，从而保留其道德与关系层面的张力；脚注说明责任性译法。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“我亲自”体现强调，“向我追讨他”呈现担保责任；末句保留“得罪”这一道德性用语，避免将 חטא 仅法律化。
