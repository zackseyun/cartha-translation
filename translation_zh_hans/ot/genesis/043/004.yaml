  text: If you will send our brother with us[a], we will go down and buy food for you.
translation:
  language: zh_hans
  text: 你若肯让我们的弟弟和我们一起去[a]，我们就下去给你买食物。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你若差我们的弟弟同我们去。”希伯来语这一表达既可侧重“愿意差他去”，也可侧重实际差遣他同行。
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: 若
  rationale: 引出真实条件句；“若”简洁庄重，不额外添加强调。
- source_word: יֶשְׁךָ + מְשַׁלֵּחַ
  choice: 你肯让……去
  rationale: 该结构结合存在词、第二人称后缀和分词，在此可表达意愿或实际行动。“肯让”在现代汉语条件句中自然，也保留父亲是否同意差遣的意味；正文脚注说明另一种较偏行动层面的理解。
- source_word: אֶת אָחִינוּ
  choice: 我们的弟弟
  rationale: 字面为“我们的兄弟”；上下文所指是便雅悯，即众人的弟弟。现代汉语用“弟弟”自然地呈现亲属关系及叙事情境。
- source_word: אִתָּנוּ
  choice: 和我们一起
  rationale: 直接表达陪同关系，说明便雅悯必须与他们同行。
- source_word: נֵרְדָה
  choice: 我们就下去
  rationale: 第一人称复数意愿式在条件句结果部分表达决意或预期行动；“就下去”自然呈现条件成立后的行动。
- source_word: וְנִשְׁבְּרָה
  choice: 买
  rationale: שבר 在本段采购供应品的语境中指购买；与后面的“粮食”搭配简洁自然。
- source_word: לְךָ
  choice: 给你
  rationale: 表达受益者；在现代汉语中“给你买”比“为你买”更口语自然，同时不改变其代父亲及全家采购的基本含义。
- source_word: אֹכֶל
  choice: 粮食
  rationale: 该词本义较广，可指食物；本叙事具体涉及从埃及购粮，汉语“粮食”符合语境。若译作“食物”则更贴近词项的宽泛范围，但在本节略显不够具体。
