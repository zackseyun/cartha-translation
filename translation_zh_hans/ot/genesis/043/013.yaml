    issue: “你们的弟弟”将原文‘你们的兄弟’具体化。
    rationale: אֲחִיכֶם字面是‘你们的兄弟’，并不含‘弟弟’这一词义；虽上下文所指确为便雅悯，仍宜由脚注交代，而非在正文增添。
  - severity: low
    issue: “动身回到”合并了两个连续命令。
    rationale: קום与שוב分别是‘起来／动身’和‘返回’。汉语可用“起来，回到……”保留其连续命令结构与催促语气。
  revised_text: 你们也要带上你们的兄弟[a]；起来，回到那人那里去。
