  yaml_path: translation/ot/genesis/043/013.yaml
  text: Take your brother also[a], and arise[b], return to the man.
translation:
  language: zh_hans
  text: 你们也要带上你们的兄弟[a]；起来，回到那人那里去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文作“你们的兄弟”；根据上下文，指便雅悯。
    reason: cross_reference
lexical_decisions:
- source_word: וְ/אֶת
  choice: 也要
  rationale: 连接词加宾格标记在这里引出另一个需要带去的人；用“也要”自然表达附加之意，宾格标记本身不另译。
- source_word: אֲחִי/כֶם
  choice: 你们的弟弟
  rationale: 原文直译为“你们的兄弟”；结合上下文所指为便雅悯，即众人的弟弟。现代汉语用“弟弟”更自然明确，同时不在正文中直接补出名字。
- source_word: קָחוּ
  choice: 带上
  rationale: לקח的复数命令式意为“拿、带”；这里指带人同行，“带上”符合现代汉语用法，也保留命令语气。
- source_word: וְ/ק֖וּמוּ
  choice: 动身
  rationale: קום本义为“起来”，在出行命令中表示起身行动；“动身”既自然，又传达行动的催促感。
- source_word: שׁ֥וּבוּ
  choice: 回到
  rationale: שוב在此表示返回先前去过之处；与目的地搭配时，“回到”比单说“返回”更顺畅。
- source_word: אֶל הָ/אִישׁ
  choice: 那人那里
  rationale: 介词אֶל表示朝向或到达，הָאִישׁ是带定冠词的“那/这人”。汉语按既知指称自然译作“那人那里”，指上下文中的埃及官员。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“动身回到”将原文连续的两个复数命令式קום、שוב合并为流畅的汉语动作序列，同时保留两者的语义；正文不补出“便雅悯”，以避免把上下文信息写入原文字面。
