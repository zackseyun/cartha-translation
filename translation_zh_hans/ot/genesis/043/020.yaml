  text: וַ/יֹּאמְר֖וּ בִּ֣י אֲדֹנִ֑/י יָרֹ֥ד יָרַ֛דְנוּ בַּ/תְּחִלָּ֖ה לִ/שְׁבָּר אֹֽכֶל־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/020.yaml
  text: And they said[a], “Please, my lord[b], we came down the first time to buy food.”
translation:
  language: zh_hans
  text: 他们说：“我主[b]，请听我们说：我们头一次下来，确是来买食物的[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “确是”：希伯来语以同词根的不定式绝对形和限定动词连用，加强“下来”的语气。整句也可译为“我们头一次下来，实在是来买食物的”。
    reason: lexical_alternative
  - marker: b
    text: “我主”是对身份较高之人的恭敬称呼，这里不是对上帝的称号。
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: 他们说
  rationale: 未另译连接词 וַ，以符合现代汉语叙事习惯；复数主语由“他们”明确表达。
- source_word: בִּי
  choice: 请听我们说
  rationale: 此处是恭敬请求对方准许陈情的感叹语；译作“请听我们说”比字面处理自然，也符合后续申辩语境。
- source_word: אֲדֹנִי
  choice: 我主
  rationale: 保留对上位者恭敬而郑重的称呼；此处指人，并非对上帝的称号。
- source_word: יָרֹד יָרַדְנוּ
  choice: 我们……确实……下来
  rationale: 以“确实”传达不定式绝对形与限定动词并用所产生的强调语气。
- source_word: בַּתְּחִלָּה
  choice: 头一次
  rationale: 结合叙事语境，指先前第一次来到埃及，而非抽象的“起初”。
- source_word: לִשְׁבָּר
  choice: 买
  rationale: 该动词在此指以购买方式取得粮食供应；现代汉语用“买”简明自然。
- source_word: אֹכֶל
  choice: 食物
  rationale: 原词意义较广，虽上下文涉及粮食，本节不宜将其无依据地收窄为“粮”。
theological_decisions:
- issue: אֲדֹנִי 是否具有神圣称号含义
  choice: 按对人类上位者的尊称译为“我主”并加注说明
  alternative: “先生”或将其理解为对上帝的称号
  rationale: 在本段中兄弟们正向约瑟的管家陈情，语境明确是社会性敬称；“我主”保留原文的恭敬等级感，脚注则防止神学误读。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“我主，请听我们说”体现低位者向上位者陈情的恭敬语气；“头一次”自然承接前次来埃及的叙事。“确实”保留希伯来语强调结构。脚注标记均置于正文中：词法说明紧接相关分句，文化说明置于整句之后。
