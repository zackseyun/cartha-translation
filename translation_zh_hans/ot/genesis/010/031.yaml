  yaml_path: translation/ot/genesis/010/031.yaml
  text: These are the sons of Shem[a], by their clans, by their languages, in their lands, by their nations.
translation:
  language: zh_hans
  text: 这些是闪的子孙[a]，按他们的宗族，按他们的语言，在他们的土地上，按他们的邦国。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译可作：“这些是闪的众子，按他们的宗族，按他们的语言，在他们的土地上，按他们的邦国。”希伯来语以重复的介词标明分类；“子孙”在此家谱概括中表达其后裔之意。
    reason: 说明“子孙”相对于“众子”的家谱性译法，并保留原文重复介词所形成的分类结构。
lexical_decisions:
- source_word: אֵלֶּה
  choice: 这些就是
  rationale: 用于引出本段家谱的总结；希伯来语是无系词句，现代汉语补出“就是”更自然。
- source_word: בְנֵי שֵׁם
  choice: 闪的子孙
  rationale: בֵּן 的复数在家谱语境中可涵盖后代；译作“子孙”比“儿子”更符合本节对闪系族群的概括，同时保留父系家谱框架。
- source_word: לְמִשְׁפְּחֹתָם
  choice: 按各自的宗族
  rationale: מִשְׁפָּחָה 在部族家谱语境中指宗族；前缀 לְ 表示分类或归属。
- source_word: לִלְשֹׁנֹתָם
  choice: 按各自的……语言
  rationale: לָשׁוֹן 字面为“舌头”，此处指语言；译作“语言”清楚而符合现代汉语。
- source_word: בְאַרְצֹתָם
  choice: 住在各自的土地上
  rationale: 前缀 בְ 表示所在之处；“土地”避免使人误解为现代意义的国家。汉语补出“住”以表达地点关系。
- source_word: לְגוֹיֵהֶם
  choice: 归属各自的邦国
  rationale: גּוֹי 指民族性政治群体或邦国；“邦国”既不同于单纯血缘宗族，也避免过度现代化。前缀 לְ 的归类关系以“归属”表达。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“宗族—语言—土地—邦国”的次序严格依照原文；通过“按……、住在……、归属……”清楚呈现不同介词的作用，避免把所有短语机械处理为同一种关系。
