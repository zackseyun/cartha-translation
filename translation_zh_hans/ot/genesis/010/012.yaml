  yaml_path: translation/ot/genesis/010/012.yaml
  text: and Resen[a], between Nineveh and Calah[b]; that is the great city.
translation:
  language: zh_hans
  text: 以及位于尼尼微和迦拉[a]之间的利鲜；那就是那座大城。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “迦拉”的亚述语名称作“卡尔胡”。
    reason: lexical_alternative
  - marker: b
    text: “那就是那座大城”可能专指利鲜，也可能指尼尼微与迦拉之间这一较大的城市区域。
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֶת
  choice: 以及
  rationale: וְ加直接宾语标记 אֵת 延续上一节的建城清单；“以及”自然承接前文，又不把原文省略的动词重复写出。
- source_word: רֶסֶן
  choice: 利鲜
  rationale: 采用现代中文圣经读者较熟悉的希伯来地名音译。
- source_word: בֵּין ... וּבֵין
  choice: 在……和……之间
  rationale: 直接表达这一对关联介词所标明的地理位置。
- source_word: נִינְוֵה
  choice: 尼尼微
  rationale: 采用该地名通行的中文圣经译名。
- source_word: כָּלַח
  choice: 迦拉
  rationale: 采用希伯来文本所载地名的传统中文音译；亚述语形式“卡尔胡”保留在脚注中。
- source_word: הִוא
  choice: 那就是
  rationale: 以指示性系词结构传达独立代词的复指、说明作用，同时不明确限定其所指。
- source_word: הָעִיר הַגְּדֹלָה
  choice: 那座大城
  rationale: 两个定冠词体现特指；“大”既可指规模，也不完全排除重要、显著之意。
theological_decisions:
- issue: “那就是那座大城”所指为何
  choice: 正文保留指代上的开放性，不明确断定“大城”只指利鲜，还是指尼尼微至迦拉一带较大的城市区域。
  alternative: 可理解为专指利鲜；也可理解为包括尼尼微、利鲜和迦拉在内的较大城市区域。
  rationale: 希伯来语末句的确切所指存在句法争议；译文不作原文未明确作出的判定。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“以及”承接上一节的建城动词；分号保留原文末句的独立说明语气。脚注标记均置于正文相应位置。
