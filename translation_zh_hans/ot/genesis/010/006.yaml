  text: 'And the sons of Ham: Cush[a], Mizraim, Put[b], and Canaan.'
translation:
  language: zh_hans
  text: 含的儿子是古实、米斯拉音[a]、弗[b]和迦南。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “米斯拉音”也常译作“埃及”。这里在家谱中作为祖先或族系名称出现，因此正文按希伯来语名称音译。
    reason: alternative_reading
  - marker: b
    text: “弗”也可音译作“普特”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: 的儿子是
  rationale: בְנֵי 是“儿子们”的组合形式；在家谱中可兼指由这些祖先而出的族系。正文保留“儿子”这一正式而传统的表达，并以“是”自然引出名单。句首 ו 承接家谱上下文，现代汉语在此不必机械译为“并且”。
- source_word: חָם
  choice: 含
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: כּוּשׁ
  choice: 古实
  rationale: 采用中文圣经传统中通行的专名译法；此处作为含的儿子及族系祖先之名。
- source_word: וּ/מִצְרַיִם
  choice: 米斯拉音[a]
  rationale: 此词在本家谱中作为个人或族系祖先的名称，因此按希伯来语形式音译，而不直接译作地名“埃及”；脚注保留通行的另一译法。
- source_word: וּ/פוּט
  choice: 弗[b]
  rationale: 采用现代中文圣经传统中较通行的专名译法；脚注列出较贴近希伯来语发音的音译，以显示名称对应关系。
- source_word: וּ/כְנָעַן
  choice: 和迦南
  rationale: 采用中文通行专名“迦南”，并用“和”连接名单末项，使现代汉语自然，同时保留原文并列结构。
theological_decisions: []
translation_notes:
  register: 采用简洁、庄重的现代标准汉语。专名优先沿用中文读者熟悉的圣经译名；但 מִצְרַיִם 在本节具有家谱人名功能，故以“米斯拉音”呈现，并以脚注说明“埃及”这一常见译法。英文咨询层的脚注标记 a 原置于 Cush 后，与脚注内容不符；本稿依据希伯来词项将其置于“米斯拉音”后。
