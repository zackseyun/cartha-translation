  to: 列国的沿海地区[a]从这些后裔中分出；他们各按自己的语言、宗族和邦国，在各自的土地上居住。[b]
  rationale: 修订纠正“从这些人分开”在汉语中的关系歧义，并恢复原文中土地、语言、宗族、邦国的分类框架。为使“沿海地区”这一地理表述在汉语中可理解，补出承接上下文后裔的“他们”；这不是指定主语为纯地理实体或纯人群，而是反映本节列国谱中地域与族群相连的表达。
