base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/005.yaml
  text: From these the coastlands of the nations were separated in their lands[a], each according to his language, by their clans[c][b], in their nations.
translation:
  language: zh_hans
  text: 列国的沿海地区[a]从这些后裔中分出；他们各按自己的语言、宗族和邦国，在各自的土地上居住。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“列国的海岛”。希伯来语这个词既可指海岛，也可指沿海地区。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语直译为“各人按自己的语言”，是表示逐一分配的说法。
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵאֵלֶּה
  choice: 从这些人
  rationale: 介词 מִן 与指示词 אֵלֶּה 表示来源；结合前文家谱，“这些人”指刚刚列出的后裔。
- source_word: נִפְרְדוּ
  choice: 分开
  rationale: פרד 的 Niphal 形态表示分离或被分开；此处保留原文没有明确说明施事者的表达。
- source_word: אִיֵּי הַגּוֹיִם
  choice: 列国的沿海地区
  rationale: אִיִּים 可指海岛，也可广指沿海地带；正文采用较适合列国谱地理语境的“沿海地区”，并以脚注保留“海岛”这一真实词义可能。
- source_word: בְּאַרְצֹתָם
  choice: 各在自己的土地上
  rationale: אֶרֶץ 在此指各群体所居住的地域；用“各在自己的土地上”自然表达复数领属关系。
- source_word: אִישׁ לִלְשֹׁנוֹ
  choice: 按各自的语言
  rationale: אִישׁ 在此为分配性用法，直译虽是“各人”，整体意思是各自按其语言归类。
- source_word: לְמִשְׁפְּחֹתָם
  choice: 宗族
  rationale: מִשְׁפָּחָה 在列国谱和部族语境中指较大的亲族或氏族群体，“宗族”比现代意义的“家庭”更准确。
- source_word: בְּגוֹיֵהֶם
  choice: 邦国
  rationale: גּוֹי 指民族性或政治性的人民共同体；“邦国”既与前面的“列国”呼应，也避免连续重复同一词语。
theological_decisions:
- issue: 本节的主语究竟侧重地理区域还是居住其中的族群
  choice: 正文保留“列国的沿海地区”这一原文结构，不直接改写为“沿海各族”
  alternative: 列国沿海地区的各族从这些人分散出去
  rationale: 希伯来语表面主语是 אִיֵּי הַגּוֹיִם，而上下文又明显涉及族群分布。正文保留这种地理与民族之间的张力，不把解释性的“居民”直接写入经文。
translation_notes:
  register: 采用现代、庄重而通顺的书面普通话。“分开”保留原文被动或自发分离的含混性；末尾用“分布”使汉语句子完整，但不额外规定分离发生的具体方式。
