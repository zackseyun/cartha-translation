  yaml_path: translation/ot/genesis/010/027.yaml
  text: and Hadoram[a], and Uzal, and Diklah.
translation:
  language: zh_hans
  text: 还有哈多兰、乌萨和德拉。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这些是《列国表》中的专名；不同译本的音译写法可能略有差异，并不表示含义不同。
    reason: cultural_note
lexical_decisions:
- source_word: וְ/אֶת
  choice: 还有／、／和
  rationale: אֵת在此是不可直译的直接宾语标记，וְ连接家谱名单中的各项。中文用“还有”承接上文，并以顿号和“和”自然协调三个名字。
- source_word: הֲדוֹרָם
  choice: 哈多兰
  rationale: 这是族谱中的专名，按希伯来语读音音译；末尾ם以“兰”近似表达，采用现代中文圣经姓名的常见音译形式。
- source_word: אוּזָל
  choice: 乌萨
  rationale: 这是专名，按希伯来语音译，不按可能的词源含义意译。
- source_word: דִּקְלָה
  choice: 德拉
  rationale: 这是专名，按希伯来语音译，不意译；简洁呈现其辅音和元音轮廓。
theological_decisions: []
