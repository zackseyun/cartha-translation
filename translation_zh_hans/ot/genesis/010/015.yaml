base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/015.yaml
  text: And Canaan fathered Sidon his firstborn[a], and Heth.
translation:
  language: zh_hans
  text: 迦南生了长子西顿，又生了赫[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 在这段族谱中，赫与后来所说的赫人有关，被视为他们的祖先。
    reason: 交叉参照并说明族谱关系；解释信息放在脚注中，不增补进正文。
lexical_decisions:
- source_word: וּ/כְנַעַן
  choice: 迦南
  rationale: וְ承接族谱的连续叙述；现代汉语在逐项列举的族谱中不必机械译作“又”。כְנַעַן采用通行圣经人名“迦南”。
- source_word: יָלַד
  choice: 生了
  rationale: 在男性家系语境中表示生育、成为父亲；“生了”简洁自然，并保留原文的亲子关系表达。
- source_word: אֶת
  choice: 不单独译出
  rationale: 这是希伯来语直接宾语标记，现代汉语没有对应词。
- source_word: צִידֹן
  choice: 西顿
  rationale: 采用现代汉语圣经和地名传统中的通行译名。
- source_word: בְּכֹר/וֹ
  choice: 长子
  rationale: 该词带第三人称阳性单数后缀，说明西顿是迦南的长子；汉语中“长子”已自然表达“他的第一个儿子”，无需另加“他的”。
- source_word: וְ/אֶת
  choice: 又生了
  rationale: וְ引出第二个后裔，אֶת不单独翻译；补出承前省略的“生了”，使现代汉语清楚流畅。
- source_word: חֵת
  choice: 赫
  rationale: 按通行中文圣经人名译作“赫”；原文这里只给出名字，不在正文中扩写其与赫人的关系。
theological_decisions: []
