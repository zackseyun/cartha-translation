base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/024.yaml
  text: Arpachshad fathered Shelah[a], and Shelah fathered Eber.
translation:
  language: zh_hans
  text: 亚法撒生了舍拉[a]；舍拉生了希伯。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “亚法撒”是希伯来文人名 אַרְפַּכְשַׁד 的中文惯用译名；其按希伯来文较完整音译可作“亚珥帕革沙德”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַרְפַּכְשַׁד
  choice: 亚珥帕革沙德
  rationale: 按马所拉文本 אַרְפַּכְשַׁד 的希伯来语形式音译；句首连接词 וְ 在中文家谱叙述中不必机械译出。
- source_word: יָלַד
  choice: 生了
  rationale: 男性作主语时，此词在家谱语境中表示“生育、成为……的父亲”。“生了”简洁自然，也保留家谱公式的传统庄重感。
- source_word: אֶת
  choice: 不单独译出
  rationale: 这是直接宾语标记，中文以语序表达其语法功能。
- source_word: שָׁלַח / שֶׁלַח
  choice: 舍拉
  rationale: 依据本节马所拉文本的读音音译，并在两次出现时保持一致。
- source_word: וְ/שֶׁלַח
  choice: 舍拉
  rationale: 连接词 וְ 通过分号所表达的并列关系自然体现，无须另译“并且”；人名仍译作“舍拉”。
- source_word: עֵבֶר
  choice: 希伯
  rationale: 采用现代中文圣经读者熟悉的人名形式“希伯”；这是对希伯来人名 עֵבֶר 的惯用译名。
theological_decisions:
- issue: 家谱中的 יָלַד 是否必然表示直接父子关系
  choice: 译作“生了”，不在正文中额外限定代际距离
  alternative: 译作“是……的父亲”或“成为……的祖先”
  rationale: 希伯来家谱公式可着重谱系承接，未必由该动词本身明确排除代际省略；正文保留原文简洁表达，不作超出文本的解释。
translation_notes:
  register: 采用简洁、庄重的现代汉语家谱句式。以分号呈现两个并列谱系公式，避免重复连接词造成生硬；人名优先依据希伯来文本，同时用脚注交代常见传统译名。
