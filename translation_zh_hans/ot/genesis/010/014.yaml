  text: וְֽ/אֶת פַּתְרֻסִ֞ים וְ/אֶת כַּסְלֻחִ֗ים אֲשֶׁ֨ר יָצְא֥וּ מִ/שָּׁ֛ם פְּלִשְׁתִּ֖ים וְ/אֶת כַּפְתֹּרִֽים־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/014.yaml
  text: and the Pathrusites[a], and the Casluhites (from whom the Philistines came), and the Caphtorites.
translation:
  language: zh_hans
  text: 帕斯鲁人、迦斯路人（非利士人从那里出来）[a]和迦斐托人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译是“非利士人从那里出来”。这句话可能是说非利士人源自前面刚提到的迦斯路人。
    reason: 保留“从那里”的字面表达，同时说明其最可能的句法关联，避免正文过度确定族源关系。
lexical_decisions:
- source_word: פַּתְרֻסִים
  choice: 帕斯鲁人
  rationale: 这是由“帕斯鲁”构成的族名；采用音译并加“人”，既保留希伯来语名称，也让现代汉语读者清楚这是族群。
- source_word: כַּסְלֻחִים
  choice: 迦斯路人
  rationale: 该族群在圣经外的确切身份不明，因此采用音译，不赋予原文未明说的含义。
- source_word: אֲשֶׁר יָצְאוּ מִשָּׁם
  choice: 非利士人从那里出来
  rationale: 按希伯来语较直译地保留“从那里出来”，避免把关系强化为“后裔”或直接确定为“从迦斯路人而出”；括号显示这是族谱中的来源说明。
- source_word: פְּלִשְׁתִּים
  choice: 非利士人
  rationale: 采用现代中文圣经传统中通行的族名。
- source_word: כַּפְתֹּרִים
  choice: 迦斐托人
  rationale: 这是与“迦斐托”相关的族名；采用通行音译并加“人”。
- source_word: וְאֶת
  choice: 、／和
  rationale: 希伯来语反复使用连词及宾语标记；现代汉语列举中用顿号连接前项，并在末项前用“和”，不机械翻出宾语标记。
theological_decisions:
- issue: “非利士人从那里出来”所指的来源
  choice: 正文保留“从那里出来”，并按原文位置置于“迦斯路人”之后，但不将“那里”直接改写为“迦斯路人”。
  alternative: 译作“非利士人从迦斯路人而出”或“非利士人是迦斯路人的后裔”。
  rationale: 关系从句紧接“迦斯路人”，很可能与其相连；但希伯来语实际使用地点副词“从那里”，并未明说“后裔”。保留这一表达可维持原文在句法所指和族源关系上的张力。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。经文是上一节族谱名单的延续，因此保持名词列举形式，不补入原文在本节没有重复的“生了”。族名以通行汉语音译为基础，并统一用“人”标明族群。
