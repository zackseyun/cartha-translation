  text: and Obal[a], and Abimael, and Sheba.
translation:
  language: zh_hans
  text: 俄巴[a]、亚比玛利和示巴。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文在每个名字前都重复“和”及宾语标记，直译为：“和［宾语标记］俄巴，和［宾语标记］亚比玛利，和［宾语标记］示巴。”现代汉语通常不译出这种宾语标记，并用顿号及“和”列举名字。
    reason: 说明希伯来文重复的并列词和无直接汉语对应词的宾语标记。
lexical_decisions:
- source_word: וְ/אֶת
  choice: 用顿号及“和”连接各名字；宾语标记不另译
  rationale: וְ表示并列，אֶת是希伯来语的确定直接宾语标记。现代汉语没有与之直接对应的成分，因此按自然的汉语列举方式，用顿号和末项前的“和”表达。
- source_word: עוֹבָל
  choice: 俄巴
  rationale: 这是专名，采用现代中文圣经中通行且易于辨认的音译，不按名字可能包含的词义意译。
- source_word: אֲבִימָאֵל
  choice: 亚比玛利
  rationale: 这是专名，采用通行的中文音译；在家谱名单中不拆解或翻译其内部词素。
- source_word: שְׁבָא
  choice: 示巴
  rationale: 这是专名或地名形式，采用中文圣经中对 שְׁבָא 的通行译名“示巴”，并与拼写不同的相关名称相区别。
