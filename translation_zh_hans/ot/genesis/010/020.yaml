base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/020.yaml
  text: These are the sons of Ham[a], by their clans, by their languages, in their lands[b], by their nations.
translation:
  language: zh_hans
  text: 这些是含的子孙，按着他们的宗族、语言、土地和民族。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה
  choice: 以上是
  rationale: 本句是对前文含系谱的总结；“以上是”自然地表达指示词的总结功能。
- source_word: בְנֵי חָם
  choice: 含的子孙
  rationale: בְנֵי 字面为“儿子们”，但在族谱语境中涵盖后裔；现代汉语用“子孙”既保留亲缘关系，也避免误解为仅指含的亲生儿子。
- source_word: לְמִשְׁפְּחֹתָם
  choice: 各按自己的宗族
  rationale: 介词 לְ 在此表示按群体分类；“宗族”比“家庭”更准确地指较大的亲缘群体。
- source_word: לִלְשֹׁנֹתָם
  choice: 语言
  rationale: לָשׁוֹן 字面为“舌头”，此处惯用义为语言；译作“语言”清楚自然。
- source_word: בְּאַרְצֹתָם
  choice: 在自己的地域中
  rationale: בְּ 为处所用法；“地域”表达各群体所处的土地或领地，又避免现代民族国家的含义。
- source_word: בְּגוֹיֵהֶם
  choice: 在自己的邦国中
  rationale: גּוֹי 指民族或邦国群体；“邦国”保留其社会政治层面，并与“宗族”有所区别。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。“各按……分布在……”补足希伯来语总结公式在汉语中省略的逻辑关系，同时保留宗族、语言、地域、邦国四个分类层面。
