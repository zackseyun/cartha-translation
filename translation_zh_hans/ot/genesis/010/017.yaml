  text: 还有希未人[a]、亚基人和西尼人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“希未族、亚基族和西尼族。”希伯来文使用带定冠词的单数族称，在这里统指各族群。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת
  choice: 还有
  rationale: וְ连接族名，אֶת是宾语标记，在汉语中不需另译；用“还有”自然承接上文的族群名单。
- source_word: הַחִוִּי
  choice: 希未人
  rationale: 这是带定冠词的单数族称，在此具有集合意义；采用现代中文圣经中通行的族名“希未人”。
- source_word: הָעַרְקִי
  choice: 亚基人
  rationale: 这是与亚基相关的族称，在名单中指一个群体；采用通行译名“亚基人”。
- source_word: הַסִּינִי
  choice: 西尼人
  rationale: 这是族群称谓，单数形式在此作集合用；采用通行译名“西尼人”。
