lexical_decisions:
- source_word: וּ/בְנֵי
  choice: 的儿子是
  rationale: בְנֵי是בֵּן的复数构造形，在家谱语境中直译为“儿子”最为准确自然。句首连接词וּ承接上文；现代汉语家谱列表中无需机械译出“和”，由上下文自然体现衔接。
- source_word: גֹּמֶר
  choice: 歌篾
  rationale: 专名采用中文圣经传统中通行、且与希伯来语音相近的译名。
- source_word: אַשְׁכֲּנַז
  choice: 亚实基拿
  rationale: 专名采用中文圣经传统中通行的音译。
- source_word: וְ/רִיפַת
  choice: 利法
  rationale: 正文依据WLC马所拉文本רִיפַת音译；其前连接词在中文列举中由末项前的“和”统一表达。历代志上1:6的异文另见脚注。
- source_word: וְ/תֹגַרְמָה
  choice: 和陀迦玛
  rationale: 专名采用中文圣经传统中通行的音译，并保留希伯来语连接词在列举末项上的功能。
