base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/001.yaml
  text: 'These are the generations of the sons of Noah: Shem[a], Ham, and Japheth. And sons were born to them after the flood.'
translation:
  language: zh_hans
  text: 以下是挪亚儿子们的世系[a]：闪、含、雅弗。洪水以后，他们有儿子出生。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “世系”或译“后代”。希伯来语这个家谱标题用语可泛指一个人的血统、后代，或由他而展开的家族记载。
    reason: 说明《创世记》结构性关键词的语义范围，并保留可行的另一译法。
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: 以下是
  rationale: 用于引出新的家谱段落，符合现代汉语标题式表达；不另加带时间含义的“现在”。
- source_word: תּוֹלְדֹת
  choice: 世系
  rationale: 这是《创世记》中反复出现的结构性用语。“世系”既可指血统与后代，也能保留家谱记录的意味，比单译“后代”涵盖面更广。
- source_word: בְּנֵי נֹחַ
  choice: 挪亚儿子们
  rationale: 准确保留复数“儿子”，并以自然的现代汉语领属结构表达。
- source_word: שֵׁם חָם וָיָפֶת
  choice: 闪、含、雅弗
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: וַיִּוָּלְדוּ לָהֶם בָּנִים
  choice: 他们生了儿子
  rationale: 自然表达希伯来语“有儿子为他们而生”的关系，并保留 בָּנִים 明确的阳性复数含义；汉语“儿子”可按集合意义使用，无须增添原文没有的数量。
- source_word: אַחַר הַמַּבּוּל
  choice: 洪水以后
  rationale: 清楚标明时间背景，并采用《创世记》洪水叙事的通行用语。
theological_decisions:
- issue: 《创世记》结构公式 תּוֹלְדֹת 的译法
  choice: 世系
  alternative: 后代；家族史
  rationale: “世系”能维持本书反复出现的文学结构，又不把该词仅限于后裔名单或仅限于叙事记载。
- issue: בָּנִים 的性别含义
  choice: 儿子
  alternative: 孩子
  rationale: 原文明确使用阳性名词，且下文家谱列举男性后代；译作“孩子”会淡化原文特征。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“以下是……的世系”具有家谱标题感；第二句简洁直述，不补入原文未明说的“都”等限定词。
