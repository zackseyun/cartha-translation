base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/022.yaml
  text: 'The sons of Shem: Elam[a], Asshur, Arpachshad, Lud[b], and Aram.'
translation:
  language: zh_hans
  text: 闪的儿子是：以拦、亚述、亚法撒、路德和亚兰。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “亚述”和“亚兰”这两个名字，也与后来称为亚述和亚兰的地区及民族相关。
    reason: cultural_note
lexical_decisions:
- source_word: בְּנֵי
  choice: 儿子
  rationale: 这是בֵּן的复数构造形式；在家谱语境中直译为“儿子”，保留原文的男性谱系表述，不扩大为“后代”。
- source_word: שֵׁם
  choice: 闪
  rationale: 专名采用现代中文圣经读者熟悉的传统译名。
- source_word: עֵילָם
  choice: 以拦
  rationale: 该专名在此作为家谱中的人名，采用通行的中文音译。
- source_word: אַשּׁוּר
  choice: 亚述
  rationale: 保留希伯来专名；此名也与后来称为亚述的地区和民族相关，但本节按家谱名单处理，不直接意译为地域。
- source_word: אַרְפַּכְשַׁד
  choice: 亚法撒
  rationale: 采用现代中文圣经传统中通行且可辨识的希伯来人名译法；不照受希腊文及英语传统影响的 Arphaxad 另造音译。
- source_word: לוּד
  choice: 路德
  rationale: 原文为单数专名לוּד，采用通行中文音译，不扩展为另一形式“路低人”等。
- source_word: אֲרָם
  choice: 亚兰
  rationale: 保留希伯来专名及其家谱功能；不以较晚的地域名称“叙利亚”替代。
theological_decisions: []
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语，维持希伯来文家谱名单的结构。中文专名以广为人知的传统译名为主。英语咨询层的脚注a内容与其正文标记明显不相符：该注谈“亚法撒”，却标在“Elam”之后；因此不照搬这一错位标记，仅保留有明确文本依据的文化说明，并在全句末标注。
