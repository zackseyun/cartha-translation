base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/032.yaml
  text: These are the families of the sons of Noah[a], according to their generations, by their nations[c][b]; and from these the nations were separated on the earth after the flood.
translation:
  language: zh_hans
  text: 这些是挪亚儿子们的宗族[a]，按着他们的世系，照着他们的邦国；洪水以后，地上的列国从这些宗族分散开来[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “宗族”也可译作“家族”。
    reason: lexical_alternative
  - marker: b
    text: “分散开来”也可译作“彼此分开”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁפְּחֹת
  choice: 宗族
  rationale: 指以血缘为基础的家族群体或支系；“宗族”比现代汉语的“家庭”更能体现群体范围，也适合族谱总结的语境。
- source_word: לְתוֹלְדֹתָם
  choice: 按着他们的世系
  rationale: תּוֹלְדוֹת在此可指世代、后裔或谱系；“世系”自然地保留其族谱含义，同时不把它仅限于书面的家谱。
- source_word: בְּגוֹיֵהֶם
  choice: 归入各自的邦国
  rationale: בְּ可表达归属或分类，גּוֹי指民族性的国家群体；此译法在汉语中清楚表达这些宗族按各邦国归类，并与前一介词短语形成并列说明。
- source_word: וּמֵאֵלֶּה
  choice: 就是从他们
  rationale: 直译为“而从这些”；这里所指的是前述挪亚众子的宗族，用“他们”承接自然，“就是”体现总结语气。
- source_word: נִפְרְדוּ
  choice: 分散出去
  rationale: פרד的Nifal形表示彼此分开、分离；“分散出去”既保留分离之意，也符合列国从共同源头向各处分布的语境。
- source_word: הַגּוֹיִם
  choice: 列国
  rationale: 指挪亚后裔形成的多个民族—国家群体；“列国”庄重、简明，并能保持复数和整体性。
- source_word: בָּאָרֶץ
  choice: 地上的
  rationale: 此处אֶרֶץ概括洪水之后人类列国的分布，范围是全地；“地上的列国”是自然且具普世范围的汉语表达。
- source_word: אַחַר הַמַּבּוּל
  choice: 洪水以后
  rationale: 直接表达时间关系，指向前文的洪水事件。
theological_decisions:
- issue: בָּאָרֶץ在洪水后列国分布总结中的范围
  choice: 全地范围的“地上”
  alternative: 特定地域的“那地”或“地中”
  rationale: 创世记第10章总括挪亚后裔所形成的列国，语境具有普世范围；“地上”不将其缩限为某一特定地区。
- issue: נִפְרְדוּ所表达的分离方式
  choice: 分散出去
  alternative: 被分开／彼此分离
  rationale: 原文Nifal形容列国发生分离，但未明说外在施动者；“分散出去”保留这种未指定施动者的表达，也不额外断定分散机制。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“宗族、世系、列国”适合族谱总结语境；句序略作汉语化处理，把时间和地点置于后半句前部，同时保留原文从挪亚后裔到列国分散的逻辑。
