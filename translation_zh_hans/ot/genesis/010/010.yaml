  register: 采用庄重而通顺的现代标准汉语。以“起初包括”自然呈现希伯来语系词句，同时避免把 רֵאשִׁית 过度解释为“首都”或“主要部分”。地名以中文圣经传统形式为主，并用脚注补充现代历史名称。
