base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/010.yaml
  text: The beginning of his kingdom was Babel[a], Erech, Accad, and Calneh[b], in the land of Shinar.
translation:
  language: zh_hans
  text: 他的王国的开端是巴别[a]、以力、亚甲和甲尼[b]，在示拿地。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “巴别”也可译作“巴比伦”。
    reason: lexical_alternative
  - marker: b
    text: “以力”通常被认定为古代的乌鲁克；“亚甲”则是阿卡德。
    reason: cultural_note
lexical_decisions:
- source_word: וַתְּהִי
  choice: 包括
  rationale: 希伯来语在此以系词连接“王国的开端”和一组城名；汉语若直译为“是”略显生硬，用“包括”自然表达这些城构成其王国最初范围的意思。
- source_word: רֵאשִׁית
  choice: 起初
  rationale: 该词可指开端、最初部分或首要部分。这里译作“起初”，保留时间和初始范围的含义，不把它限定解释为首都或最重要的城市。
- source_word: מַמְלַכְתּוֹ
  choice: 他的王国
  rationale: 该词可指王国、王权或统治；本节列举城邑，因此“他的王国”最清楚自然。
- source_word: בָּבֶל
  choice: 巴别
  rationale: 按希伯来语地名音译，并保留与创世记十一章“巴别”的文学联系；“巴比伦”作为异译列入脚注。
- source_word: אֶרֶךְ
  choice: 以力
  rationale: 采用现代中文圣经读者较熟悉的希伯来地名传统译名；其与古代乌鲁克的通常认定在脚注中说明。
- source_word: אַכַּד
  choice: 亚甲
  rationale: 按希伯来语形式采用中文圣经传统音译；历史名称“阿卡德”在脚注中说明。
- source_word: כַלְנֵה
  choice: 甲尼
  rationale: 按马所拉文本 כַלְנֵה 音译，不以其他经文中的相关地名形式取代本节读法。
- source_word: בְּאֶרֶץ שִׁנְעָר
  choice: 都在示拿地
  rationale: 保留“地”这一地理称谓；补出“都”使其与前列四座城的关系在现代汉语中清楚。
theological_decisions: []
