  text: וַֽ/יְהִ֞י גְּב֤וּל הַֽ/כְּנַעֲנִי֙ מִ/צִּידֹ֔ן בֹּאֲ/כָ֥ה גְרָ֖רָ/ה עַד עַזָּ֑ה בֹּאֲ/כָ֞ה סְדֹ֧מָ/ה וַ/עֲמֹרָ֛ה וְ/אַדְמָ֥ה וּ/צְבֹיִ֖ם עַד לָֽשַׁע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/019.yaml
  text: And the border of the Canaanites was from Sidon[a], as you go toward Gerar, as far as Gaza; and as you go toward Sodom and Gomorrah and Admah and Zeboiim, as far as Lasha.
translation:
  language: zh_hans
  text: 迦南人的疆界从西顿起，向基拉耳延伸，直到迦萨；又向所多玛、蛾摩拉、押玛和洗扁延伸，直到拉沙[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“利沙”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: （译入“疆界……起……延伸”）
  rationale: 叙事性的连续式在本句引出疆界说明；汉语无需逐字译出“于是成为”，以自然的陈述句表达。
- source_word: גְּבוּל הַכְּנַעֲנִי
  choice: 迦南人的疆界
  rationale: גְּבוּל在地理语境中指领土的边界；单数族称הַכְּנַעֲנִי具有集合意义，译为“迦南人”。
- source_word: מִצִּידֹן
  choice: 从西顿起
  rationale: 介词מִן标明疆界描述的起点；“西顿”采用现代中文圣经地名的通行译法。
- source_word: בֹּאֲכָה גְרָרָה
  choice: 向基拉耳延伸
  rationale: בֹּאֲכָה在疆界公式中表示朝某处的方向；地名后的方向词尾也支持“向……”。用“延伸”衔接疆界这一主语，符合现代汉语。
- source_word: עַד עַזָּה
  choice: 直到迦萨
  rationale: עַד表示边界所达到的限点；“迦萨”采用通行中文地名。
- source_word: בֹּאֲכָה סְדֹמָה וַעֲמֹרָה וְאַדְמָה וּצְבֹיִם
  choice: 向所多玛、蛾摩拉、押玛和洗扁延伸
  rationale: 保留第二条方向说明及四个地名的并列关系，同时按自然汉语使用顿号与“和”。
- source_word: עַד לָשַׁע
  choice: 直到拉沙
  rationale: 按马所拉文本的元音לָשַׁע音译为“拉沙”，并在脚注保留另一种音译。
theological_decisions: []
