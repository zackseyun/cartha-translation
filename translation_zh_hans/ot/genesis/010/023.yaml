base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/023.yaml
  text: 'The sons of Aram: Uz[a], Hul, Gether, and Mash.'
translation:
  language: zh_hans
  text: 亚兰的儿子是乌斯、户勒、基帖和玛施[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文本作“玛施”；《历代志上》1:17作“米设”。
    reason: textual_variant
lexical_decisions:
- source_word: וּבְנֵי
  choice: ……的儿子是
  rationale: בְּנֵי是בֵּן的复数附属形，直译为“……的儿子”；句首连接词וּ承接整段家谱，在中文独立经节中不必另译“和”，用“是”自然引出名单。
- source_word: אֲרָם
  choice: 亚兰
  rationale: 专名采用现代中文圣经中通行且易辨识的音译。
- source_word: עוּץ
  choice: 乌斯
  rationale: 按希伯来专名音译，并采用中文圣经传统中的通行形式。
- source_word: חוּל
  choice: 户勒
  rationale: 按希伯来专名音译，采用清楚、通行的中文形式。
- source_word: גֶתֶר
  choice: 基帖
  rationale: 按希伯来专名音译，采用中文圣经传统中的常见形式。
- source_word: מַשׁ
  choice: 玛施
  rationale: 忠实反映马所拉文本本节所读的מַשׁ，不以《历代志上》1:17的异文“米设”取代正文。
theological_decisions: []
