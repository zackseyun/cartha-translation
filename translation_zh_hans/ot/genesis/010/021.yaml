source:
  edition: WLC
  text: וּ/לְ/שֵׁ֥ם יֻלַּ֖ד גַּם ה֑וּא אֲבִי֙ כָּל בְּנֵי עֵ֔בֶר אֲחִ֖י יֶ֥פֶת הַ/גָּדֽוֹל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/021.yaml
  text: And to Shem also[a], the father of all the sons of Eber, the brother of Japheth the elder, children were born.
translation:
  language: zh_hans
  text: 闪也生了儿女。他是希伯众子孙的祖先，是雅弗的哥哥[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“是年长的雅弗的兄弟。”希伯来语中的“年长”既可能指闪，也可能指雅弗。
    reason: alternative_reading
lexical_decisions:
- source_word: וּ/לְ/שֵׁם
  choice: 闪也
  rationale: 前缀连词和介词把闪作为家谱中另一位生养后代的人引入；现代汉语用“闪也”自然表达承接和增添之意。
- source_word: יֻלַּד גַּם הוּא
  choice: 也生了儿女
  rationale: 原文是被动式，直译为“也有……为他而生”，但汉语家谱叙述用主动式“也生了儿女”更自然，并保留“也”的强调。
- source_word: אֲבִי כָּל בְּנֵי עֵבֶר
  choice: 希伯所有子孙的祖先
  rationale: אָב在跨代家谱关系中可指祖先；בְּנֵי在这里指后裔。此译避免让现代读者误以为闪是希伯众亲生儿子的直接父亲，同时保留希伯这一人名。
- source_word: אֲחִי יֶפֶת
  choice: 雅弗的哥哥
  rationale: 该结构基本义为“雅弗的兄弟”；结合הַגָּדוֹל取年龄义并按主文本所选句法关系，译为“雅弗的哥哥”。
- source_word: הַגָּדוֹל
  choice: 哥哥
  rationale: 在亲属关系语境中，גָּדוֹל通常表示年长。希伯来语中它可能修饰闪，也可能修饰雅弗；主文本取修饰闪的读法，另一读法列入脚注。
theological_decisions:
- issue: הַגָּדוֹל究竟修饰闪还是雅弗
  choice: 修饰闪，即“雅弗的哥哥”
  alternative: 修饰雅弗，即“年长的雅弗的兄弟”或“雅弗的兄弟；雅弗是哥哥”
  rationale: 原文的句法附着存在真实歧义。正文采用一种通顺且合理的读法，但以脚注保留另一种可能，不把不确定之处说成确定。
translation_notes:
  register: 采用现代、庄重而通顺的家谱叙述。“祖先”和“子孙”按实际家谱关系传达原文，不将“希伯的众子”误解为仅指希伯的亲生儿子。脚注明确保留年龄形容词所修饰对象的句法歧义。
