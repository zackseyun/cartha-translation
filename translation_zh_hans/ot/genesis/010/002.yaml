  text: 'The sons of Japheth: Gomer[a], Magog, Madai, Javan, Tubal, Meshech, and Tiras.'
translation:
  language: zh_hans
  text: 雅弗的儿子是歌篾、玛各、玛代[a]、雅完[a]、土巴、米设和提拉。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这些名称在后来的用法中也可能指族群或地域；“玛代”可指“米底人”，“雅完”可指“爱奥尼亚”或“希腊人”。正文按希伯来文家谱的形式保留音译名。
    reason: 说明“玛代”和“雅完”在后期用法中可能具有族群或地域含义，同时避免在正文中把家谱名称直接解释为民族名称。
lexical_decisions:
- source_word: בְּנֵי
  choice: 儿子
  rationale: 这是בֵּן的复数构造形式，用来引出家谱名单；译作“儿子”直接保留希伯来文按男性后裔列名的表达，不扩大为“后代”或“儿女”。
- source_word: יֶפֶת
  choice: 雅弗
  rationale: 人名，采用现代中文圣经读者熟悉的通行音译。
- source_word: גֹּמֶר
  choice: 歌篾
  rationale: 在本节家谱中作专名，采用通行音译，不作族群或地域解释。
- source_word: מָגוֹג
  choice: 玛各
  rationale: 在本节作专名；虽然后来可带有民族或地域关联，此处保留音译。
- source_word: מָדַי
  choice: 玛代
  rationale: 本节将其列为雅弗之子，因此正文保留人名形式；其与米底人的可能对应留在注释说明。
- source_word: יָוָן
  choice: 雅完
  rationale: 本节按家谱专名处理并采用通行音译，不在正文中直接解释为爱奥尼亚或希腊人。
- source_word: תֻבָל
  choice: 土巴
  rationale: 专名，采用通行中文音译。
- source_word: מֶשֶׁךְ
  choice: 米设
  rationale: 专名，采用通行中文音译。
- source_word: תִירָס
  choice: 提拉
  rationale: 专名，采用通行中文音译。
