  text: מִן הָ/אָ֥רֶץ הַ/הִ֖וא יָצָ֣א אַשּׁ֑וּר וַ/יִּ֨בֶן֙ אֶת נִ֣ינְוֵ֔ה וְ/אֶת רְחֹבֹ֥ת עִ֖יר וְ/אֶת כָּֽלַח־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/011.yaml
  text: From that land Asshur went out and built Nineveh[a], Rehoboth-Ir, and Calah.
translation:
  language: zh_hans
  text: 亚述从那地出来，建造了尼尼微[a]、利河伯城和迦拉。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他从那地往亚述去，建造了尼尼微、利河伯城和迦拉。”这种译法承接上一节，以宁录为主语，并把“亚述”理解为地区，而不是人物。
    reason: alternative_reading
lexical_decisions:
- source_word: מִן הָאָרֶץ הַהִוא
  choice: 从那地
  rationale: 介词 מִן 表示来源或起点；אֶרֶץ 在此指地域。“从那地”简洁自然，并承接上文。
- source_word: יָצָא
  choice: 出来
  rationale: יצא 的基本义是“出去、出来”。这里采用“出来”，与“从那地”自然搭配，又不增添方向细节。
- source_word: אַשּׁוּר
  choice: 亚述
  rationale: 该专名既可指人物亚述，也可指亚述地区。正文按紧邻句法将其理解为动词后的明确主语，即人物“亚述”；另一种地域解释收入脚注。
- source_word: וַיִּבֶן
  choice: 建造了
  rationale: בנה 的常用义为“建造”。不译作“建立”，以免将“建城”的含义解释得过窄。
- source_word: נִינְוֵה
  choice: 尼尼微
  rationale: 采用现代中文圣经与历史地名中通行的音译。
- source_word: רְחֹבֹת עִיר
  choice: 利河伯城
  rationale: 上下文以重复的 אֶת 列举城市，因此将该词组作为地名处理。“利河伯城”兼顾传统音译和 עִיר“城”的可辨含义；字面理解为“城中的宽阔处”虽在词汇上可能，但在此较不可能。
- source_word: כָּלַח
  choice: 迦拉
  rationale: 采用该地名通行的中文音译。
theological_decisions:
- issue: אַשּׁוּר 的所指及本句主语
  choice: 将 אַשּׁוּר 视为人物“亚述”，作“出来”和“建造”的主语。
  alternative: 将 אַשּׁוּר 视为地区“亚述”，并以上一节的宁录为省略的主语：“他从那地往亚述去……”。
  rationale: 希伯来语辅音文本容许两种理解，因为 אַשּׁוּר 可指人物，也可指地区。紧邻句法自然可读为动词后出现明确主语“亚述”，无需从上一节补出主语；但另一读法真实且由来已久，故在脚注中保留，不在正文中消除歧义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。地名使用简体中文常见译名；正文保持简洁，并以脚注保存原文中关于主语和“亚述”所指的真实歧义。
