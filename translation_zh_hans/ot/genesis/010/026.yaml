  text: Joktan fathered Almodad[a], Sheleph, Hazarmaveth, and Jerah.
translation:
  language: zh_hans
  text: 约坍生了亚摩答[a]、沙列、哈萨玛非和耶拉。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译：“约坍生了亚摩答、沙列、哈萨玛非和耶拉”，每个名字前都重复使用“和”；中文为行文自然作了调整。
    reason: 说明原文在各名字前重复连接词，而正文按现代汉语习惯顺畅表达。
