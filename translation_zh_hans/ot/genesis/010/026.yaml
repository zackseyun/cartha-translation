- source_word: וְיָקְטָן
  choice: 约坍
  rationale: 专有名词按现代中文圣经中通行的译名音译；句首的连接词 וְ 结合上下文处理，不机械译出。
- source_word: יָלַד
  choice: 生了
  rationale: 在男性家谱语境中表示生育后代或成为其父；“生了”简洁自然，并保留原文家谱表达。
- source_word: אֶת
  choice: 不单独译出
  rationale: 这是直接宾语标记，现代汉语没有对应的独立词，其语法功能由语序体现。
- source_word: אַלְמוֹדָד
  choice: 亚摩答
  rationale: 专有名词采用现代中文圣经中通行的音译。
- source_word: שָׁלֶף
  choice: 沙列
  rationale: 专有名词采用现代中文圣经中通行的音译。
- source_word: חֲצַרְמָוֶת
  choice: 哈萨玛非
  rationale: 专有名词采用现代中文圣经中通行的音译。
- source_word: יָרַח
  choice: 耶拉
  rationale: 专有名词采用现代中文圣经中通行的音译。
