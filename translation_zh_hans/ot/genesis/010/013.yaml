  text: וּ/מִצְרַ֡יִם יָלַ֞ד אֶת לוּדִ֧ים וְ/אֶת עֲנָמִ֛ים וְ/אֶת לְהָבִ֖ים וְ/אֶת נַפְתֻּחִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/013.yaml
  text: And Mizraim fathered the Ludim[a], the Anamim, the Lehabim[b], and the Naphtuhim.
translation:
  language: zh_hans
  text: 麦西生了[a]路低人、亚拿米人、利哈比人[b]和拿弗土希人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “生了”也可译作“成为……的父祖”；原文动词是家谱中表示生育、产生后裔的常用词。
    reason: lexical_alternative
  - marker: b
    text: 本节这些名称均按族群名称音译，不译作地名，也不按不确定的后世民族认定来翻译。
    reason: cultural_note
lexical_decisions:
- source_word: מִצְרַיִם
  choice: 麦西
  rationale: 在列国谱系中按人名音译，而不直接译作“埃及”；此处名字代表祖先，也与其后裔群体相关。
- source_word: יָלַד
  choice: 生了
  rationale: 这是希伯来语家谱中表示生育或产生后裔的常用动词。“生了”简洁自然，同时以脚注保留“成为……的父祖”等谱系含义。
- source_word: אֶת
  choice: 不单独译出
  rationale: 这是希伯来语直接宾语标记，汉语中由语序体现其语法功能。
- source_word: לוּדִים
  choice: 路低人
  rationale: 按复数族群名称音译，并用“人”表明所指为族群，不将其确定为某一后世民族或地点。
- source_word: עֲנָמִים
  choice: 亚拿米人
  rationale: 按希伯来语形式音译为族群名称，以保留列国谱系中的专名性质。
- source_word: לְהָבִים
  choice: 利哈比人
  rationale: 按希伯来语形式音译；其具体历史族群认定并不确定，因此不在正文中采用推定身份。
- source_word: נַפְתֻּחִים
  choice: 拿弗土希人
  rationale: 按希伯来语形式音译为族群名称，不把它改译为未经确定的地名或后世民族名称。
- source_word: וְ
  choice: 和
  rationale: 用于连接名单最后一项，符合现代汉语列举习惯。
theological_decisions:
- issue: “生了”所表达的是直接父子关系还是祖先与族群的谱系关系
  choice: 正文保留家谱惯用语“生了”，脚注说明也可理解为“成为……的父祖”
  alternative: 直接译为“成为……的祖先”
  rationale: 原文使用标准生育动词，却以复数族群名作宾语；正文与脚注的组合既保留原文表达，也避免武断限定为直接生育个体或仅为遥远祖源。
translation_notes:
  register: 采用现代、庄重而简洁的家谱表述。人名“麦西”与各族名沿用易辨认的汉语圣经音译形式；列举时使用顿号，并在末项前用“和”。
