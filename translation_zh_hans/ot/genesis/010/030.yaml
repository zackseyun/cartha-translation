  yaml_path: translation/ot/genesis/010/030.yaml
  text: And their settlement was from Mesha as you go toward Sephar[a], the hill country of the east.
translation:
  language: zh_hans
  text: 他们居住的地域，是从米沙起，往东边山区的西发方向。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们居住的地方，从米沙起，往西发方向，东边的山。”
    reason: 保留“东边的山”对希伯来文 הַר 的单数译法，并保留“西发”与“东边的山（区）”之间可作补充说明的句法关系。
lexical_decisions:
- source_word: וַיְהִי
  choice: 是
  rationale: 该叙事连接形式引出地域说明；用“是”贴近希伯来文“成为／是”的表达，同时在中文中保持自然。
- source_word: מוֹשָׁבָם
  choice: 他们居住的地域
  rationale: מוֹשָׁב既可指居所，也可指聚居之地；本节是在描述族群分布范围，因此“居住的地域”比个人性的“住处”更合适。
- source_word: מִמֵּשָׁא
  choice: 从米沙起
  rationale: מִן表示起点；“米沙”按希伯来地名音译，并以“起”明确地域范围的起点。
- source_word: בֹּאֲכָה
  choice: 往……方向
  rationale: 该地理表达源自בוא，表示朝某地而去或趋向某地；“往……方向”自然地保留方向含义。
- source_word: סְפָרָה
  choice: 西发
  rationale: 将地名סְפָר音译为“西发”；词尾的方向含义已由“往……方向”体现。
- source_word: הַר
  choice: 山区
  rationale: הַר既可指一座山，也可在地理描述中指山地；正文采用“山区”表达区域意义，另以脚注保留单数“山”的可能。
- source_word: הַקֶּדֶם
  choice: 东边的
  rationale: קֶדֶם在此指东方或东部地区；“东边的”与“山区”搭配，形成自然的地域描述。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“居住的地域”适合《列国表》的地理语境；正文以“山区”作区域性理解，脚注保留“山”及同位说明的句法可能。
