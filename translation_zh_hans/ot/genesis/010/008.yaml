  yaml_path: translation/ot/genesis/010/008.yaml
  text: And Cush fathered Nimrod[d][c][b][a]; he began to be a mighty man on the earth.
translation:
  language: zh_hans
  text: 古实生了宁录；他开始成为地上的勇士。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “勇士”也可译作“强人”“英雄”或“战士”。
    reason: lexical_alternative
  - marker: b
    text: “地上”也可译作“这地”或“那地”；希伯来语“地”既可指全地，也可指某片土地。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכּוּשׁ
  choice: 古实
  rationale: וְ承接前文，在中文族谱叙述中可不另译；כּוּשׁ按通行圣经人名译作“古实”。
- source_word: יָלַד
  choice: 生了
  rationale: 族谱语境中表示生育、为父；“生了”简洁自然，并符合现代中文族谱表达。
- source_word: נִמְרֹד
  choice: 宁录
  rationale: 采用现代简体中文圣经中通行的人名译法。
- source_word: הוּא הֵחֵל לִהְיוֹת
  choice: 他开始成为
  rationale: 直译希伯来语“他开始成为”，保留起始义，不增添“第一个”的优先含义。
- source_word: גִּבֹּר
  choice: 勇士
  rationale: 该词可指强有力者、英雄或战士；“勇士”自然庄重，并保留力量与武勇的语义范围。
- source_word: בָּאָרֶץ
  choice: 地上
  rationale: אֶרֶץ可指全地或某片土地；结合列国族谱，正文采用较广的“地上”，同时以脚注保留“这地”的可能。
theological_decisions:
- issue: הֵחֵל לִהְיוֹת是否表示“第一个成为”
  choice: 开始成为
  alternative: 第一个成为
  rationale: 原文明确表达“开始”，但未明说时间或地位上的第一；采用较形式对应的译法，避免加入解释性优先含义。
- issue: אֶרֶץ的范围
  choice: 地上（较广范围）
  alternative: 这地／那地（区域范围）
  rationale: 创世记10章列国背景支持较广义，但该词本身仍可指特定土地，因此不将区域义排除，而在脚注中说明。
- issue: גִּבֹּר的身份性质
  choice: 勇士
  alternative: 强人／英雄／战士
  rationale: 原文并未在本节单独限定其力量属于军事、政治或其他领域；“勇士”保留一定宽度，不进一步作道德评价。
translation_notes:
  register: 采用现代、简洁而庄重的族谱叙述。分号呈现后半句对宁录的补充说明；避免使用文言色彩较重的“始为”，也不把“开始”解释为“第一个”。
