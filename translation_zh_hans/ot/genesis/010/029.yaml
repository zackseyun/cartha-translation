  language: zh_hans
  text: 俄斐、哈腓拉和约巴。这些全都是约坍的儿子。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“约坍的后代。”希伯来语“儿子”在家谱中有时可泛指后代，但这里最自然是指刚列出的这些儿子。
    reason: 词义替代
lexical_decisions:
- source_word: וְ/אֶת
  choice: （在中文并列结构中省略宾语标记；末项前译作“和”）
  rationale: 重复的אֵת承接上一节，标明各专名为家谱列举中的宾语；现代汉语没有对应的宾语标记，因此省略，并用顿号及末项前的“和”保留并列结构。
- source_word: אוֹפִר
  choice: 俄斐
  rationale: 专名，采用现代中文圣经中通行且易辨识的音译。
- source_word: חֲוִילָה
  choice: 哈腓拉
  rationale: 专名，采用现代中文圣经中通行且易辨识的音译。
- source_word: יוֹבָב
  choice: 约巴
  rationale: 专名，采用现代中文圣经中通行且易辨识的音译。
- source_word: כָּל אֵלֶּה
  choice: 这些全都
  rationale: 准确表达概括性短语，并以自然现代汉语总结此前列出的所有名字。
- source_word: בְּנֵי
  choice: 儿子
  rationale: 该词在家谱中有时可泛指后代，但此处紧接约坍所生男性后裔的名单，直译“儿子”最符合词义和近距离语境；较宽泛的可能性以脚注保留。
- source_word: יָקְטָן
  choice: 约坍
  rationale: 专名，采用现代中文圣经中通行的音译。
