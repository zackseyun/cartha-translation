base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/004.yaml
  text: 'And the sons of Javan: Elishah[a], Tarshish, Kittim, and Dodanim.'
translation:
  language: zh_hans
  text: 雅完的儿子是以利沙[a]、他施、基提和多大宁。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本以及《历代志上》1:7作“罗大宁”，而不是“多大宁”。
    reason: textual_variant
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: ……的儿子是
  rationale: בְּנֵי是“儿子”的复数构造形式；在家谱中也可广指后裔，但此处直译为“儿子”既保留希伯来文的家谱表达，也符合现代汉语。句首连接词וּ不必机械译作“和”，以免中文突兀。
- source_word: יָוָן
  choice: 雅完
  rationale: 采用现代中文圣经中较通行的专名音译，指雅完及与其相关的族群。
- source_word: אֱלִישָׁה
  choice: 以利沙
  rationale: 按希伯来语专名音译，并采用中文读者熟悉的传统形式。
- source_word: וְ/תַרְשִׁישׁ
  choice: 他施
  rationale: 这是族名或地名，采用现代中文圣经中通行的音译；连接词וְ在列举中由中文顿号自然表达。
- source_word: כִּתִּים
  choice: 基提
  rationale: 这是族名或地名的复数形式；采用中文圣经通行译名“基提”，不强行补出“人”，以保留名单的简洁形式。
- source_word: וְ/דֹדָנִים
  choice: 多大宁
  rationale: 正文依WLC马所拉文本דֹדָנִים音译为“多大宁”；“罗大宁”的异文另列脚注。
