  yaml_path: translation/ot/genesis/010/016.yaml
  text: and the Jebusites[a], and the Amorites, and the Girgashites.
translation:
  language: zh_hans
  text: 以及耶布斯人[a]、亚摩利人和革迦撒人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语的三个族称均为单数形式（即“耶布斯族的人”“亚摩利族的人”“革迦撒族的人”），但在这份族系名单中都集体指相应族群，因此译作“……人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיְבוּסִי
  choice: 耶布斯人
  rationale: 希伯来语是带定冠词的单数族称，但在创世记第10章的族系名单中集体指耶布斯族；现代汉语用“耶布斯人”可自然表达这一群体含义。
- source_word: הָאֱמֹרִי
  choice: 亚摩利人
  rationale: 该单数族称在列举迦南诸族的语境中具有集合意义；“亚摩利人”符合现代汉语民族名称的通常表达。
- source_word: הַגִּרְגָּשִׁי
  choice: 革迦撒人
  rationale: 该形式虽为单数族称，语境却指整个族群；采用通行译名“革迦撒人”，自然传达集合意义。
- source_word: וְאֶת / וְאֵת
  choice: 以及／、／和
  rationale: וְ连接本节与前文并串联名单项目，אֵת是直接宾语标记，不另行翻译。汉语以“以及”承接前文，并用顿号和“和”自然列举。
theological_decisions: []
