id: GEN.10.7
reference: Genesis 10:7
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וּ/בְנֵ֣י כ֔וּשׁ סְבָא֙ וַֽ/חֲוִילָ֔ה וְ/סַבְתָּ֥ה וְ/רַעְמָ֖ה וְ/סַבְתְּכָ֑א וּ/בְנֵ֥י רַעְמָ֖ה שְׁבָ֥א וּ/דְדָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/007.yaml
  text: 'And the sons of Cush: Seba[a], Havilah, Sabtah, Raamah, and Sabteca[b]. And the sons of Raamah: Sheba and Dedan.'
translation:
  language: zh_hans
  text: 古实的儿子[a]是西巴、哈腓拉、撒弗他、拉玛和撒弗提迦[b]。拉玛的儿子是示巴和底但。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语家谱中的“儿子”也可以指后裔，或表示某一宗族、民族的来源，并不一定只指亲生儿子。
    reason: cultural_note
  - marker: b
    text: 本节若干名称可能指民族、地区，或作为民族始祖的人物，并不一定只指个人。
    reason: cultural_note
lexical_decisions:
- source_word: וּבְנֵי
  choice: ……的儿子是
  rationale: 保留希伯来语家谱公式的基本表达；“儿子”在家谱中也可泛指后裔或由其而出的族群。句首连接词 וּ־ 在中文承接前文时不必机械译作“和”。
- source_word: כּוּשׁ
  choice: 古实
  rationale: 采用现代中文圣经中通行且辨识度高的专名译法。
- source_word: סְבָא
  choice: 西巴
  rationale: 按中文圣经传统音译该专名，不限定其究竟指个人、族群还是地域。
- source_word: חֲוִילָה
  choice: 哈腓拉
  rationale: 采用通行中文音译，保留专名性质。
- source_word: סַבְתָּה
  choice: 撒弗他
  rationale: 采用通行中文音译，与相近名称“撒弗提迦”保持区分。
- source_word: רַעְמָה
  choice: 拉玛
  rationale: 采用通行中文音译，避免对其身份作超出原文的解释。
- source_word: סַבְתְּכָא
  choice: 撒弗提迦
  rationale: 采用通行中文音译，保留原文专名。
- source_word: וּבְנֵי רַעְמָה
  choice: 拉玛的儿子是
  rationale: 重复家谱公式，以清楚呈现原文层级；中文不重复句首“和”，使行文自然。
- source_word: שְׁבָא
  choice: 示巴
  rationale: 采用通行中文专名译法；不把它具体解释为某一地区或民族。
- source_word: דְדָן
  choice: 底但
  rationale: 采用通行中文专名译法，不改译为族称。
theological_decisions:
- issue: 家谱中“儿子”的指称范围
  choice: 正文直译为“儿子”，并以脚注说明其范围可能更广
  alternative: 正文译为“后裔”或“族群”
  rationale: 这样既保留 בְנֵי 的字面家谱表达，也不把个人、后裔与族群之间的真实歧义提前消解。
translation_notes:
  register: 采用庄重而自然的现代标准汉语；专名沿用中文圣经中较通行的译法。列举时使用现代标点和“和”，同时保留原文家谱结构及其指称上的开放性。
