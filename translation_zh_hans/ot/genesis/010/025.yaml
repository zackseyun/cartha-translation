base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/025.yaml
  text: 'And to Eber two sons were born: the name of the one was Peleg[a], for in his days the earth was divided, and his brother''s name was Joktan.'
translation:
  language: zh_hans
  text: 希伯得了两个儿子：一个名叫法勒；因为在他的时代，大地被分开了。法勒的兄弟名叫约坍。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּלְעֵבֶר יֻלַּד שְׁנֵי בָנִים
  choice: 希伯生了两个儿子
  rationale: 希伯来文直译为“给希伯生了两个儿子”，其中 יֻלַּד 是被动式。现代汉语用主动表达“希伯生了”更自然，同时准确传达亲子关系和两个儿子的复数信息。
- source_word: שֵׁם הָאֶחָד
  choice: 一个名叫
  rationale: 原文是“一个的名字”，与后面的“他的兄弟名叫”形成对照；译作“一个名叫”既保留这种区分，又符合现代汉语习惯，不擅自改成“长子”或“第一个”。
- source_word: פֶּלֶג
  choice: 法勒
  rationale: 采用现代中文圣经读者熟悉的传统人名译法；此名与后文“分开”存在语音和词根上的关联。
- source_word: כִּי בְיָמָיו
  choice: 因为在他的日子
  rationale: כִּי 引出取名的解释；“在他的日子”贴近原文的时间表达，并避免把所指进一步限定为某个具体事件或年份。
- source_word: נִפְלְגָה
  choice: 分开了
  rationale: פלג 的尼法勒式表示“被分开、分裂”。“分开了”自然简明，也尽可能体现它与“法勒”之名的词根呼应。
- source_word: הָאָרֶץ
  choice: 大地
  rationale: אֶרֶץ 可指全地，也可指土地或地域。“大地”适合创世记第10章列国谱系的广阔语境，同时脚注保留“土地”的可能译法。
- source_word: וְשֵׁם אָחִיו יָקְטָן
  choice: 法勒的兄弟名叫约坍
  rationale: 原文“他的兄弟”中的代词在语境中指法勒。汉语明确说“法勒的兄弟”，可避免误读为希伯的兄弟，同时未增加原文没有的排行信息。
- source_word: יָקְטָן
  choice: 约坍
  rationale: 采用现代中文圣经读者熟悉的传统人名译法。
theological_decisions:
- issue: הָאָרֶץ 所指范围
  choice: 大地
  alternative: 土地
  rationale: 创世记第10章涉及列国和人群的广泛分布，“大地”能保留较广的叙事范围，却不具体断定这里所说的划分机制。由于 אֶרֶץ 本身也可指一片土地或地域，脚注保留这一真实的词义歧义。
- issue: “分开”所指的历史事件
  choice: 不在正文中具体说明
  alternative: 明确解释为语言分散、疆域划分或大陆分裂
  rationale: 本节只说大地或土地在法勒的日子“分开了”，并未明说其具体机制。译文不把某种解释写入正文，以保留经文自身的开放性。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。人名使用中文圣经传统通行译名；句式略作汉语化处理，但保留原文的家谱结构、因果说明，以及“大地／土地”的歧义。
