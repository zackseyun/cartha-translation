  text: וְ/אֶת הָֽ/אַרְוָדִ֥י וְ/אֶת הַ/צְּמָרִ֖י וְ/אֶת הַֽ/חֲמָתִ֑י וְ/אַחַ֣ר נָפֹ֔צוּ מִשְׁפְּח֖וֹת הַֽ/כְּנַעֲנִֽי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/018.yaml
  text: and the Arvadites[a], the Zemarites, and the Hamathites. Afterward the clans of the Canaanites were scattered.
translation:
  language: zh_hans
  text: 还有亚瓦底人、洗玛利人和哈马人。后来，迦南人的各族[a]分散开来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文“迦南人”采用单数形式的族称，集合性地指整个迦南族群。
    reason: 说明原文的集合性单数，以免读者把“迦南人”误解为某一个人。
lexical_decisions:
- source_word: הָאַרְוָדִי
  choice: 亚瓦底人
  rationale: 这是单数形式的族称，在列举迦南后裔的语境中具有集合意义；用“亚瓦底人”自然地指整个族群。
- source_word: הַצְּמָרִי
  choice: 洗玛利人
  rationale: 原文为单数族称，但在列国谱的名单中指一个群体；汉语以“洗玛利人”表达其集合意义。
- source_word: הַחֲמָתִי
  choice: 哈马人
  rationale: 这是集合性族称，指与哈马有关的族群；译作“哈马人”简洁自然。
- source_word: וְאַחַר
  choice: 后来
  rationale: 表示上述族群出现之后发生的事，译作“后来”准确而符合现代汉语表达。
- source_word: נָפֹצוּ
  choice: 分散开来
  rationale: Nifal形式在此表达分散、散布的状态变化，未说明施事者；“分散开来”既保留这种含义，也避免擅自补出使其分散者。
- source_word: מִשְׁפְּחוֹת
  choice: 各族
  rationale: 在族谱和民族谱系语境中，该词指由亲缘关系构成的群体，不只限于核心家庭；“各族”比“各家”更切合本章语境。
- source_word: הַכְּנַעֲנִי
  choice: 迦南人
  rationale: 原文采用带冠词的单数族称，集合性地指迦南族群；汉语“迦南人”可自然保留这种群体意义。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。族名沿用中文圣经中通行的译名；以“各族”体现民族谱系语境，并用“分散开来”保留原文未明说施事者的表达。
