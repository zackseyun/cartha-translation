  to: 他也做了美味的食物，带给父亲，对父亲说：“请父亲起来，吃你儿子打来的野味，好让你[a]赐福给我。”
  rationale: 修订正文以自然的“你赐福给我”表达原文中נֶפֶשׁ指代本人的习语，同时藉脚注保留其字面“生命／灵魂”的措辞。删除“从心里”的解释，以免添加本节未明示的意思；并将“拿到父亲那里”调整为更自然的“带给父亲”。
