base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/031.yaml
  text: He too prepared tasty food and brought it to his father[a], and he said to his father, “Let my father rise and eat of his son's game[b], so that your soul may bless me.”
translation:
  language: zh_hans
  text: 他也做了美味的食物，带给父亲，对父亲说：“请父亲起来，吃你儿子打来的野味，好让你[a]赐福给我。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“好让你的生命（或灵魂）赐福给我”；“生命／灵魂”在此是指“你本人”的希伯来语表达。
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם הוּא
  choice: 他也
  rationale: 保留以扫与雅各先前行动之间的附加和平行意味，现代汉语自然简洁。
- source_word: מַטְעַמִּים
  choice: 美味的食物
  rationale: 本词在本章指特意烹制、味道可口的食物；此译清楚自然，也与上下文的重复主题相称。
- source_word: וַיָּבֵא לְאָבִיו
  choice: 拿到父亲那里
  rationale: 希伯来文宾语由上下文补足为所做的食物；汉语可承接前句而不必重复“它”。
- source_word: יָקֻם אָבִי
  choice: 请父亲起来
  rationale: 第三人称祈使语气是儿子对父亲的恭敬请求；以“请”传达礼貌，保留“父亲”的自称式称呼。
- source_word: מִצֵּיד בְּנוֹ
  choice: 吃你儿子打来的野味
  rationale: צַיִד指狩猎所得，而非一般食物；“打来的野味”既点明来源，也符合自然汉语。
- source_word: בַּעֲבוּר
  choice: 好让
  rationale: 准确表达目的关系，且适合口语中的恭敬请求。
- source_word: נַפְשֶׁךָ
  choice: 你的心
  rationale: נֶפֶשׁ在此可代指本人或内在意愿；“你的心”保留身体／内在主体的表达，比直译“灵魂”更符合现代汉语，同时不完全消解原文措辞。
- source_word: תְּבָרֲכַנִּי
  choice: 给我祝福
  rationale: 表达饭后所期待的祝福行动，符合本段父亲正式赐福的叙事语境。
theological_decisions:
- issue: נַפְשֶׁךָ是否按习语直接译作第二人称
  choice: 正文译作“你的心”，并以脚注说明字面与习语意义
  alternative: “你给我祝福”或“你的灵魂给我祝福”
  rationale: 原文明确含נֶפֶשׁ，既可作强调本人的习语，也保有内在意愿的色彩；正文保留这一张力，同时避免现代汉语“灵魂”可能引出的不必要本体论联想。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“请父亲起来”保留儿子以第三人称称呼父亲的恭敬方式；“野味”维持狩猎语境。脚注标记[a]已置于正文相应词语之后。
