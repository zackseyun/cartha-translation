base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/041.yaml
  text: And Esau hated Jacob because of the blessing with which his father had blessed him[a], and Esau said in his heart, “The days of mourning for my father are drawing near[c][b]; then I will kill Jacob my brother.”
translation:
  language: zh_hans
  text: 以扫因父亲赐给雅各的祝福而怨恨雅各[a]。以扫心里说：“为我父亲哀悼的日子临近了[b]；到那时，我要杀死我的兄弟雅各。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “怨恨”所译的希伯来语表示持续的敌意或仇恨，不只是一时的情绪。
    reason: lexical_alternative
  - marker: b
    text: 或译：“我父亲哀伤的日子临近了。”希伯来语既可理解为以撒死后人为他哀悼，也可能指以撒自己哀伤的时期。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂטֹם
  choice: 怨恨
  rationale: שׂטם表示持续的敌意或仇恨，并非一时的不快。“怨恨”在现代汉语中自然地传达这种积蓄、延续的敌意，也与下文杀害雅各的决意相称。
- source_word: עַל הַבְּרָכָה
  choice: 因……所祝的福
  rationale: 介词עַל在这里表示原因；“因”简洁、自然地保留了因果关系。
- source_word: אֲשֶׁר בֵּרֲכוֹ אָבִיו
  choice: 父亲给雅各所祝的福
  rationale: 保留原文“祝福”动词与“福”的重复，并将代词所指明示为雅各，以免汉语产生指代歧义。
- source_word: בְּלִבּוֹ
  choice: 心里说
  rationale: 直译原文习语，表示内心的言语或盘算；这一表达在现代汉语中清楚自然。
- source_word: יִקְרְבוּ יְמֵי אֵבֶל אָבִי
  choice: 为我父亲哀悼的日子近了
  rationale: 按上下文理解为以撒死后众人为他哀悼的日子将近，同时用脚注保留希伯来语结构可能容许的另一理解。
- source_word: וְאַהַרְגָה
  choice: 到那时，我要杀死
  rationale: 该形式表达以扫已定的意图。“我要杀死”传达决意；“到那时”将上下句隐含的时间关系自然表达出来。
- source_word: אָחִי
  choice: 我弟弟
  rationale: 原文明确说“我的兄弟”；按人物关系译为“我弟弟”，既自然又凸显这场家庭暴力的悲剧性。
theological_decisions:
- issue: “哀悼日子”与父亲的关系
  choice: 为我父亲哀悼的日子
  alternative: 我父亲哀伤的日子
  rationale: 上下文更自然地指以撒死后为他哀悼，但希伯来语组合在语法上也可能指父亲自己哀伤的时期，因此不在正文中混合两种解释，而以脚注保存歧义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“所祝的福”保留原文祝福动词与名词的呼应；“心里说”保留希伯来语的内心言语表达。
