revisions:
- from: 以扫因父亲给雅各所祝的福，就怨恨雅各[a]。以扫心里说：“为我父亲哀悼的日子近了[b]；到那时，我要杀死我弟弟雅各。”
  to: 以扫因父亲赐给雅各的祝福而怨恨雅各[a]。以扫心里说：“为我父亲哀悼的日子临近了[b]；到那时，我要杀死我的兄弟雅各。”
  rationale: 修订仅改善现代汉语的自然度，并避免将“兄弟”具体化为“弟弟”。“为我父亲哀悼的日子”保留正文对以撒死后哀悼的自然理解；脚注继续明确保留原文构词关系所容许的另一理解。
