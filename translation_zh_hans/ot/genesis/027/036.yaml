base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/036.yaml
  text: 'And he said[a], “Is he not rightly named Jacob? For he has supplanted me these two times: he took my birthright, and look, now he has taken my blessing.” And he said, “Have you not reserved a blessing for me?”'
translation:
  language: zh_hans
  text: 他就说[a]：“他的名字叫雅各，岂不是名副其实吗？他已经两次算计我了：先是夺走我的长子名分，看哪，如今又夺走我的祝福。”他又说：“难道你没有为我保留一份祝福吗？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅各”这个名字与下文译作“算计我”的希伯来语动词构成双关。该动词也可译为“欺骗了我”“取代了我”，或“占了我的便宜”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲכִי קָרָא שְׁמוֹ יַעֲקֹב
  choice: 他不是名副其实地叫雅各吗
  rationale: 用反问表达以扫苦涩的感叹；“名副其实”自然传达“这名字取得真合适”的语气，同时为下文有关“雅各”之名的双关铺垫。
- source_word: וַיַּעְקְבֵנִי
  choice: 夺了我的位
  rationale: 该动词与“雅各”同根，含有从后面取代、占人位置或欺骗占便宜的意味。“夺了我的位”保留取代感，并能统摄长子名分与祝福两件事；同根双关无法在中文正文中完整复制，故加脚注说明。
- source_word: זֶה פַעֲמַיִם
  choice: 这两次
  rationale: 贴近希伯来语强调性的表达，也符合现代汉语。
- source_word: בְּכֹרָתִי
  choice: 我长子的名分
  rationale: 明确指作为长子的身份及相应权利，比单说“长子权”更自然庄重。
- source_word: וְהִנֵּה עַתָּה
  choice: 看哪，现在
  rationale: “看哪”保留 הִנֵּה 的感叹和指示力量，而“现在”保持时间对比。
- source_word: בִּרְכָתִי
  choice: 我的祝福
  rationale: 直接保留族长祝福在叙事中的关键用语及其神学分量。
- source_word: הֲלֹא אָצַלְתָּ לִּי בְּרָכָה
  choice: 你没有为我留下一份祝福吗
  rationale: אָצַל 在此表示留下、保留；“一份祝福”自然表达以扫询问是否还有祝福留给自己。
