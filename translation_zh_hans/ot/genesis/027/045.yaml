base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/045.yaml
  text: until your brother’s anger turns away from you[a], and he forgets what you have done to him. Then I will send and bring you from there[c][b]. Why should I be bereaved of both of you in one day?
translation:
  language: zh_hans
  text: 直到你哥哥不再向你发怒[a]，忘记你对他所做的事；我就会派人把你从那里带回来[b]。我为什么要在同一天失去你们两个人呢？[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译可作“直到你哥哥的怒气从你身上转离”。希伯来文以“转回、转离”描述怒气不再针对某人。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译为“把你从那里带走”或“把你从那里带来”；“带回来”按上下文表达雅各日后归返的方向。
    reason: lexical_alternative
  - marker: c
    text: “失去你们两个人”可能是指这场冲突所造成的不同后果，不一定表示两人会以相同方式死亡或离开她。原文没有进一步说明。
    reason: cultural_note
lexical_decisions:
- source_word: עַד שׁוּב אַף אָחִיךָ מִמְּךָ
  choice: 直到你哥哥对你的怒气消退
  rationale: עַד加不定式表示时间界限；שׁוב与אַף连用，按现代汉语习惯译作“怒气消退”，同时由脚注保留“转离”的形式意象。
- source_word: וְשָׁכַח אֵת אֲשֶׁר עָשִׂיתָ לוֹ
  choice: 忘了你对他所做的事
  rationale: 直接保留原文内容，不弱化雅各先前行为对以扫造成的伤害。
- source_word: וְשָׁלַחְתִּי
  choice: 我会派人去
  rationale: 及物动词“派”在希伯来文中未明说宾语；中文需补出泛指的“人”，才能自然表达利百加将差人传信的意思。
- source_word: וּלְקַחְתִּיךָ מִשָּׁם
  choice: 把你从那里接回来
  rationale: לקח基本义为“取、带”；由“从那里”及当前语境中的归返方向，中文“接回来”最自然，但脚注说明“回来”是语境所含而非独立词项。
- source_word: אֶשְׁכַּל גַּם שְׁנֵיכֶם
  choice: 失去你们两个人
  rationale: שכל常指父母丧失儿女；“失去”比“丧子”更符合现代口语可读性，并保留原文没有交代两人将以何种方式失去的开放性。
- source_word: יוֹם אֶחָד
  choice: 在一天之内
  rationale: 表达双重丧失发生于同一天的意思，符合中文习惯。
theological_decisions:
- issue: 利百加为何会同时失去两个儿子
  choice: 正文仅说“失去你们两个人”，不指定具体机制
  alternative: 解释为以扫杀死雅各后，以扫又被处死或遭报复
  rationale: 原文没有说明两人分别如何失去；不把一种常见推断写入正文，以保留叙事张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“哥哥”符合雅各对以扫的关系；“怒气消退”“派人去”“接回来”自然流畅。三个脚注标记均置于正文相应位置，并避免把未明说的冲突后果教义化。
