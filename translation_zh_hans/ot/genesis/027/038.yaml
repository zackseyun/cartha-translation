base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/038.yaml
  text: Esau said to his father[a], “Do you have only one blessing, my father? Bless me too, my father!” Then Esau raised his voice and wept.
translation:
  language: zh_hans
  text: 以扫对父亲说：“我父啊，你只有一个祝福吗[a]？我父啊，也为我祝福吧！”于是，以扫放声哭了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“你只有一个祝福吗，我父啊？”希伯来文是无动词问句，表达以扫痛苦地追问：以撒似乎只有一个可赐下的祝福。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבְּרָכָה אַחַת הִוא לְךָ
  choice: 你只有一个祝福吗
  rationale: 原文是无系词问句，字面近于“祝福——一个——是你的吗？”语境中是以扫痛苦而震惊地追问父亲是否只有一个祝福可赐；此译在现代汉语中自然，并保留反问意味。
- source_word: אָבִי
  choice: 我父啊
  rationale: 保留第一人称单数所属后缀，并两次重复，以呈现以扫恳切而激动的呼求；“啊”自然传达呼格语气。
- source_word: בָּרֲכֵנִי גַּם אָנִי
  choice: 也请为我祝福
  rationale: 命令式直译为“为我祝福”，“也”保留以扫要求自己同样得到祝福的强调；加入“请”符合汉语恳求语境，不改变命题内容。
- source_word: וַיִּשָּׂא ... קֹלוֹ וַיֵּבְךְּ
  choice: 放声痛哭
  rationale: 希伯来语字面为“举起他的声音，就哭了”。“放声痛哭”是自然凝练的汉语表达，同时传达可听见的高声哀哭及强烈悲痛。
- source_word: עֵשָׂו
  choice: 以扫
  rationale: 采用现代中文圣经传统中通行的人名译法。
theological_decisions:
- issue: 以撒是否本体上只能给予一个祝福
  choice: 保留为以扫的反问：“你只有一个祝福吗？”
  alternative: 将其解释为“你难道再没有别的祝福了吗？”
  rationale: 原文强调“一个”，但并未明确说明祝福的神学机制或以撒绝对无法另赐祝福；译文保留人物话语中的张力，不替叙事作神学判定。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“我父啊”保留原文两次呼唤的情感力度；“放声痛哭”自然呈现希伯来语“举声而哭”的惯用表达。
