  text: וַ/יֹּ֤אמֶר יִצְחָק֙ אֶֽל יַעֲקֹ֔ב גְּשָׁ/ה נָּ֥א וַ/אֲמֻֽשְׁ/ךָ֖ בְּנִ֑/י הַֽ/אַתָּ֥ה זֶ֛ה בְּנִ֥/י עֵשָׂ֖ו אִם לֹֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/021.yaml
  text: Then Isaac said to Jacob[a], “Please come near, that I may feel you, my son, whether you are really my son Esau or not.”
translation:
  language: zh_hans
  text: 以撒对雅各说：“我儿，请走近些，让我摸摸你[a]，看看你究竟是不是我的儿子以扫。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“好让我摸摸你”。
    reason: 希伯来语的连接形式在这里既可按动作承接表达，也可突出走近的目的。
lexical_decisions:
- source_word: גְּשָׁה נָּא
  choice: 请走近些
  rationale: גְּשָׁה是“走近、靠近”的命令式；נָּא使语气较为委婉，以“请”表达。“走近些”符合现代汉语叙事对话习惯。
- source_word: וַאֲמֻשְׁךָ
  choice: 让我摸摸你
  rationale: מושׁ在此指用手触摸、辨认。重叠式“摸摸”自然传达父亲要借触觉查验身份的动作；“让”可表达接续命令后的目的或许可意味。
- source_word: בְּנִי
  choice: 我儿／我的儿子
  rationale: 保留两处带第一人称单数后缀的称呼：前一处是直接呼语“我儿”，后一处与名字以扫构成身份表述“我的儿子以扫”。
- source_word: הַאַתָּה זֶה
  choice: 你究竟是不是
  rationale: 这一疑问结构聚焦眼前之人是否确为所声称的对象。“究竟”自然传达以撒试探、核实身份时的疑虑，不把疑问消解为断言。
- source_word: בְּנִי עֵשָׂו
  choice: 我的儿子以扫
  rationale: 将带所属后缀的“儿子”与专名“以扫”的同位关系自然表达出来，同时保留亲属关系和被查验的具体身份。
- source_word: אִם לֹא
  choice: 是不是
  rationale: 此处构成“是否……或不”的间接选择问句；现代汉语以正反问形式“是不是”简洁、完整地表达。
- source_word: וַיֹּאמֶר
  choice: 以撒……说
  rationale: 前置连接词推动叙事发展；汉语可不机械译出“然后”，由语序和上下文自然体现事件承接。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而自然的叙事对话。“我儿”保留亲密呼语，“究竟是不是”保留以撒对雅各身份的怀疑与查验语气。
