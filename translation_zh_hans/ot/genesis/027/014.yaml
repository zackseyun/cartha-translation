  text: So he went and took them and brought them to his mother[a], and his mother prepared tasty food, just as his father loved.
translation:
  language: zh_hans
  text: 于是他去取了两只山羊羔，带到他母亲那里；他母亲就做了美味的食物，正是他父亲所喜爱的。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: 于是他去
  rationale: 连续式叙事动词推进情节；“于是”自然表达承接上文命令后的行动。
- source_word: וַיִּקַּח
  choice: 捉来
  rationale: 基本义为“拿、取”；结合上一节所说的两只山羊羔，现代汉语用“捉来”更符合活物这一语境，同时不重复明说宾语。
- source_word: וַיָּבֵא לְאִמּוֹ
  choice: 带到母亲那里
  rationale: 准确表达“带来/带到母亲那里”；对象可由上一动词和前文自然承接。
- source_word: וַתַּעַשׂ אִמּוֹ
  choice: 他母亲就……做成
  rationale: עָשָׂה含义宽泛，在烹调食物的语境中译为“做成”自然且准确。
- source_word: מַטְעַמִּים
  choice: 美味佳肴
  rationale: 该复数名词指精心烹制、味美可口的食物；“美味佳肴”是现代汉语中自然、庄重且易懂的表达。
- source_word: כַּאֲשֶׁר אָהֵב אָבִיו
  choice: 照他父亲所爱吃的
  rationale: כַּאֲשֶׁר表达“照着、正如”，אָהֵב直译“爱”；汉语加“吃”明确此处所爱的是这种食物，符合上下文，也保留喜爱程度。
