    issue: 首句加入“有人”
    rationale: 原文使用被动式“以扫……的话被告知利百加”，并未指明传话者；“有人”虽可理解为汉语补足，却把原文未明示的主体引入正文。
  - severity: low
    issue: “盘算着杀你，好安慰自己”稍弱化并松开原文语义关系
    rationale: מִתְנַחֵם的核心是“安慰自己”，而“杀你”紧随其后，表达杀害雅各是其自我安慰的途径或内容；“以杀你来安慰自己”更贴近且自然。
