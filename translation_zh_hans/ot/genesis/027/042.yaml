revisions:
- from: 有人把以扫，就是利百加大儿子所说的话，告诉了利百加。她就派人去叫小儿子雅各来，对他说：“你看，你哥哥以扫正盘算着杀你，好安慰自己。”
  to: 以扫——利百加的大儿子——所说的话被告知利百加。她便打发人去叫她的小儿子雅各来，对他说：“你看，你哥哥以扫正以杀你来安慰自己。”
  rationale: 删除原文未指明的“有人”，以被动句保留希伯来文的信息结构；将“派人去叫”调整为“打发人去叫”，对应“差遣并召来”的叙事动作；将末句改为“以杀你来安慰自己”，更清楚保留原文的心理描写及其与杀害意图的关系，且不替原文所含的紧缩语义作过度解释。
