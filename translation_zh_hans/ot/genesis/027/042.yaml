base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/042.yaml
  text: And the words of Esau, her older son, were told to Rebekah. So she sent and called Jacob, her younger son, and said to him, “Look, Esau your brother is consoling himself about you by planning to kill you.”
translation:
  language: zh_hans
  text: 以扫——利百加的大儿子——所说的话被告知利百加。她便打发人去叫她的小儿子雅各来，对他说：“你看，你哥哥以扫正以杀你来安慰自己。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דִּבְרֵי עֵשָׂו
  choice: 以扫……所说的话
  rationale: דְּבָרִים在此指以扫先前说出的谋杀意图；译为“所说的话”自然且不超出原文。
- source_word: בְּנָהּ הַגָּדֹל / בְּנָהּ הַקָּטָן
  choice: 大儿子 / 小儿子
  rationale: 在双生兄弟的语境中，分别指年长与年幼的儿子；现代汉语以“大儿子、小儿子”表达自然。
- source_word: מִתְנַחֵם
  choice: 盘算着……好安慰自己
  rationale: 该词是נחם的反身/中动态分词，核心含义涉及使自己得到安慰；结合杀害雅各的意图，用目的结构保留这种反常而强烈的心理描写。
- source_word: לְךָ
  choice: （通过“杀你”体现其针对对象）
  rationale: 该介词短语表达以扫的意念针对雅各；汉语若直译“关于你安慰自己”生硬，故在整体句式中自然呈现。
- source_word: לְהָרְגֶךָ
  choice: 杀你
  rationale: 不定式带第二人称宾语，直指以扫杀害雅各的意图。
theological_decisions:
- issue: מִתְנַחֵם לְךָ לְהָרְגֶךָ的语义关系
  choice: 正盘算着杀你，好安慰自己
  alternative: 正因要杀你而自我安慰／正以杀你为安慰
  rationale: 原文语法关系较紧缩，既有“安慰自己”的词义，也清楚指向杀害雅各。正文用自然汉语保留两层意义，不将其弱化为单纯的“计划”。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。保留原文先以亲属说明人物身份、再转述警告的结构；“你看”对应הִנֵּה，带有提醒对方注意眼前危险的语气。
