    text: 本节希伯来文三次使用同一个名词，依次指“衣服的气味”“我儿子的气味”和“田野的气味”；译文重复“气味”，以保留这种修辞效果。
    reason: lexical_repetition
  - marker: b
    text: “看哪”在这里用于引起注意，也可译作“你看”。
    reason: lexical_alternative
