base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/027.yaml
  text: So he came near and kissed him[a], and he smelled the smell of his garments and blessed him and said, “See[b], the smell of my son is like the smell of a field that Yahweh has blessed.”
translation:
  language: zh_hans
  text: 他就走近，亲了父亲。父亲闻到他衣服的气味，就祝福他，说：“看哪，我儿子的气味，好像雅威所赐福的田野的气味。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּגַּשׁ
  choice: 他就走近
  rationale: נגשׁ表示靠近；“就”自然承接希伯来叙事中的连续动作。
- source_word: וַיִּשַּׁק לוֹ
  choice: 亲了父亲
  rationale: 原文直译为“亲了他”。汉语连续使用“他”容易混淆施事者与受事者，因此依直接语境明确为“父亲”，不增加动作本身的感情色彩。
- source_word: וַיָּרַח אֶת רֵיחַ בְּגָדָיו
  choice: 闻到他衣服的气味
  rationale: 保留“闻”与“气味”的同源式表达及具体复数名词בְּגָדָיו的意义，同时采用自然现代汉语。
- source_word: וַיְבָרֲכֵהוּ
  choice: 给他祝福
  rationale: 直接表达ברך及其宾语后缀，也保持祝福的施受关系清楚。
- source_word: רְאֵה
  choice: 看哪
  rationale: 这是引起注意的命令式；“看哪”庄重而仍为现代读者所懂，并保留话语的感叹力度。
- source_word: רֵיחַ בְּנִי / כְּרֵיחַ שָׂדֶה
  choice: 我儿子的气味，好像……田野的气味
  rationale: 两处均用“气味”，连同前句共同保留רֵיחַ在本节中的反复及比喻结构。שָׂדֶה按普通义译为“田野”。
- source_word: אֲשֶׁר בֵּרֲכוֹ
  choice: 赐福之
  rationale: 以简洁的定语结构表达关系从句“雅威所赐福的”，突出田野处于蒙福状态。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按YHWH的通行学术拟音译出上帝的专名，而不以“主”等称号替代，也不采用源自Jehovah的“耶和华”。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文明确使用四字神名。译作“雅威”保留其专名性质，并对应Yahweh的拟音；不用称号“主”取代，也不采用源自较晚混合读法Jehovah的“耶和华”。
- issue: 父亲所说“我儿子”的身份认定
  choice: 保留“我儿子”，不在引语中改为雅各或以扫
  alternative: 我儿子雅各；我儿子以扫
  rationale: 原文只说“我儿子”；叙事情境中存在冒认与误认，明确加入姓名会消解原文刻意保留的戏剧张力。
translation_notes:
  register: 采用现代、清楚而庄重的叙事语言。为避免汉语代词连续出现造成角色混淆，叙述部分按直接语境两次使用“父亲”；引语则严格保留“我儿子”的身份张力。整体保留原文“气味”的反复，不刻意润饰为不同近义词。
