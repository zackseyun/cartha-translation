revisions:
- from: 他就走近，亲了父亲。父亲闻到他衣服的气味[a]，就给他祝福，说：“看哪[b]，我儿子的气味，好像雅威赐福之田野的气味。”
  to: 他就走近，亲了父亲。父亲闻到他衣服的气味，就祝福他，说：“看哪，我儿子的气味，好像雅威所赐福的田野的气味。”
  rationale: 仅将不自然且可能妨碍理解的“雅威赐福之田野”改为“雅威所赐福的田野”，并将“给他祝福”调整为更直接自然的“祝福他”。保留人物指代的清楚性、神名、叙事顺序、“我儿子”的含混张力，以及“气味”的三重重复。
