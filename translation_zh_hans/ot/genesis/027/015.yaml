base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/015.yaml
  text: Then Rebekah took the choice garments of Esau her older son[a], which were with her in the house[b], and put them on Jacob her younger son.
translation:
  language: zh_hans
  text: 利百加拿了她大儿子以扫上好的衣服[a]，就是那些在她身边、在屋里的衣服[b]，给她小儿子雅各穿上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“以扫那珍贵的衣服”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“她在屋里所拥有的衣服”；希伯来文较直译为“那些与她同在屋里的衣服”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּקַּח
  choice: 拿来
  rationale: 连续式叙事动词推进情节；现代汉语可直接用“拿来”，无需机械译出连接词。
- source_word: בִּגְדֵי
  choice: 衣服
  rationale: 指所穿的衣物；“衣服”自然、庄重且易懂，比“衣裳”更符合现代标准普通话。
- source_word: הַחֲמֻדֹת
  choice: 上好的
  rationale: 该词表达可喜爱、珍贵或精选之意；用于衣服时，“上好的”既传达其优质可贵，也不武断限定为唯一一套“最好的”。
- source_word: בְּנוֹ הַגָּדֹל
  choice: 大儿子
  rationale: 在家庭关系中与后文 הַקָּטָן 对举，表示年长的儿子；汉语“大儿子”自然地保留这一对比。
- source_word: אֲשֶׁר אִתָּהּ בַּבָּיִת
  choice: 就是放在她屋里的
  rationale: 较自然地表达原文“在她那里、在屋里”的位置或保管关系；“放在”未明确断言衣物的所有权。
- source_word: וַתַּלְבֵּשׁ
  choice: 给……穿上
  rationale: 使役意义是把前述衣服穿到雅各身上；此表达符合现代汉语习惯，并由语境清楚承接“衣服”。
- source_word: בְּנוֹ הַקָּטָן
  choice: 小儿子
  rationale: 与“大儿子”对举，表示较年轻的儿子，并非身体较小。
theological_decisions: []
