  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: לֶךְ נָא֙ אֶל הַ/צֹּ֔אן וְ/קַֽח לִ֣/י מִ/שָּׁ֗ם שְׁנֵ֛י גְּדָיֵ֥י עִזִּ֖ים טֹבִ֑ים וְ/אֶֽעֱשֶׂ֨ה אֹתָ֧/ם מַטְעַמִּ֛ים לְ/אָבִ֖י/ךָ כַּ/אֲשֶׁ֥ר אָהֵֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/009.yaml
  text: Please go to the flock and get for me from there two good young goats[a], and I will make them into tasty food for your father, just as he loves.
translation:
  language: zh_hans
  text: 请到羊群那里去，从那里给我取两只上好的小山羊来；我要把它们做成你父亲爱吃的美味佳肴[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “美味佳肴”或译“可口的菜肴”。
    reason: 说明 מַטְעַמִּים 可指美味、可口的菜肴；两种译法都保留其强调合人口味的含义。
lexical_decisions:
- source_word: לֶךְ נָא
  choice: 请到……去
  rationale: 命令式 לֶךְ 带语气词 נָא，既是吩咐，也带请求或催促的缓和语气；“请到……去”符合现代汉语表达。
- source_word: הַצֹּאן
  choice: 羊群
  rationale: צֹאן 泛指绵羊、山羊等小型牲畜组成的群；下文明确提到小山羊，因此“羊群”自然且不过度限定。
- source_word: וְקַח לִי מִשָּׁם
  choice: 从那里给我取……来
  rationale: לקח 的基本义为“拿、取”；结合差遣去羊群取牲畜的语境，“给我取……来”清楚表达行动及受益者。
- source_word: שְׁנֵי גְּדָיֵי עִזִּים
  choice: 两只……小山羊
  rationale: 该结构直指两只山羊的幼畜；“小山羊”是准确、通俗的现代汉语。
- source_word: טֹבִים
  choice: 上好的
  rationale: טֹבִים 在此表示牲畜品质好、适合烹制；“上好的”比单说“好的”更符合挑选食材的语境，同时没有具体化为“肥美”。
- source_word: וְאֶעֱשֶׂה אֹתָם מַטְעַמִּים
  choice: 我要把它们做成……美味佳肴
  rationale: מַטְעַמִּים 指合人口味的可口菜肴或珍馐美食；“做成美味佳肴”自然表达烹制过程和食物特点。
- source_word: לְאָבִיךָ
  choice: 你父亲
  rationale: 保留原文亲属称谓，并采用庄重而通行的现代汉语。
- source_word: כַּאֲשֶׁר אָהֵב
  choice: 爱吃的
  rationale: אָהֵב 字面为“喜爱”；此处宾语承接所做的菜肴，汉语以“爱吃的”明确表达以撒对这类食物的喜爱，不增加额外含义。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重、易懂的现代标准汉语。“请”体现 נָא 对命令语气的缓和；分号保留两个紧密相连的行动步骤。脚注标记置于其实际对应的“美味佳肴”之后。
