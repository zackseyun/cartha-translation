base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/004.yaml
  text: Prepare for me tasty food[a], just as I love, and bring it to me, that I may eat[c][b], so that my soul may bless you before I die.
translation:
  language: zh_hans
  text: 你要给我做些合我口味的美味食物[a]，拿来给我，让我吃，好叫我[b]在死以前给你祝福。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “美味的食物”也可译作“佳肴”或“可口的食物”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译为“我的魂给你祝福”；这里的“我的魂”是指以撒本人，即他的整个自己。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲשֵׂה
  choice: 做
  rationale: עָשָׂה含义宽泛；在烹调语境中，现代汉语用“做”自然明确，也忠实表达预备食物的行动。
- source_word: מַטְעַמִּים
  choice: 美味的食物
  rationale: 该复数名词指精心烹制、味道可口的食物。“美味的食物”通俗自然；“佳肴”更凝练，但文体色彩稍强。
- source_word: כַּאֲשֶׁר אָהַבְתִּי
  choice: 照我喜爱的口味
  rationale: 希伯来文直陈“照我所喜爱的”；结合烹调语境，以“口味”自然表达以撒对食物做法和味道的偏爱，而不限定具体菜品。
- source_word: וְהָבִיאָה לִּי וְאֹכֵלָה
  choice: 拿来给我吃
  rationale: “拿来给我吃”简洁保留了拿到说话者面前以及随后进食的动作关系；意愿式וְאֹכֵלָה在此自然地依附于命令序列。
- source_word: בַּעֲבוּר
  choice: 好让
  rationale: 该词在此引出目的。“好让”在现代汉语中自然清楚地连接进食与祝福。
- source_word: תְּבָרֶכְךָ נַפְשִׁי
  choice: 亲自给你祝福
  rationale: נַפְשִׁי字面为“我的生命／我的魂”，在这里以整个人作为主语，等于强调以撒本人。“亲自”在现代汉语中自然传达这一全人、自身的意味，并以脚注保留原文形式。
- source_word: בְּטֶרֶם אָמוּת
  choice: 在我死以前
  rationale: 直接、自然地保留时间从句及以撒对自己将死的陈述。
theological_decisions:
- issue: “我的魂给你祝福”的表达
  choice: 正文译为“亲自给你祝福”，脚注说明原文形式
  alternative: “我的心给你祝福”或“我的魂给你祝福”
  rationale: 此处נֶפֶשׁ是以全人代称本人，并非要区分身体与非物质灵魂。正文采用现代汉语自然表达，避免导入灵魂论上的额外含义，同时脚注保留原文的修辞特征。
translation_notes:
  register: 采用庄重而口语自然的现代标准汉语。“照我喜爱的口味”使烹调语境清楚；“拿来给我吃，好让……”避免连续目的结构显得生硬。正文中的每个脚注标记均与脚注对应。
