  yaml_path: translation/ot/genesis/027/035.yaml
  text: And he said[a], “Your brother came with deceit and took your blessing.”
translation:
  language: zh_hans
  text: 他说：“你弟兄用诡计前来，取走了你的祝福。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 他说
  rationale: 这是叙事中常见的 wayyiqtol 形式，用来引出以撒的回答；现代汉语不必机械译出连接词，译为“他说”自然且忠实。
- source_word: בָּא
  choice: 来
  rationale: בוא 的 Qal 完成式在此指已经发生的动作；与后面的“夺走了”连用，汉语可自然表达为“用诡计来”。
- source_word: אָחִיךָ
  choice: 你弟兄
  rationale: 保留原文的亲属称谓及第二人称单数后缀，不以“雅各”替代，以维持原句的修辞力量。
- source_word: בְּמִרְמָה
  choice: 用诡计
  rationale: 介词 בְּ 加名词 מִרְמָה 在此表示方式或手段。“用诡计”既符合现代汉语，也保留名词所带的明确道德意味。
- source_word: וַיִּקַּח
  choice: 夺走了
  rationale: לקח 的基本义是“拿、取”；在祝福原本预定给以扫、却被其弟取去的语境中，“夺走了”自然表达受话者所承受的失去，但不采用更强烈的暴力措辞。
- source_word: בִּרְכָתֶךָ
  choice: 你的祝福
  rationale: 直译名词及第二人称单数后缀，保留它既指父亲所赐之祝福、又指本应临到以扫之祝福的叙事含义。
