  to: 他说：“把野味拿到我这里来，让我吃些我儿子的野味，好让我给你祝福。”雅各就把野味拿到父亲跟前，父亲吃了；雅各又把酒拿给父亲，父亲喝了。
  rationale: 将不自然且可能误导的“我的心给你祝福”改为自然的“我给你祝福”，并以脚注保留原文的强调性习语。也明确后半节人物和宾语的指向，维持原文中雅各呈上野味与酒、以撒吃喝的叙事次序；“些”适度体现 מִן 的部分义。
