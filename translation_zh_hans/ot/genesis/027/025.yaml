base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/025.yaml
  text: And he said[a], “Bring it near to me, and I will eat of my son’s game, so that my soul may bless you.” So he brought it near to him, and he ate; and he brought him wine, and he drank.
translation:
  language: zh_hans
  text: 他说：“把野味拿到我这里来，让我吃些我儿子的野味，好让我给你祝福。”雅各就把野味拿到父亲跟前，父亲吃了；雅各又把酒拿给父亲，父亲喝了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַגִּשָׁה לִּי
  choice: 把野味拿到我这里来
  rationale: 使役命令式表示“拿近、呈上”；结合上下文补出宾语“野味”，并用现代汉语自然表达朝以撒所在之处拿来的动作。
- source_word: וְאֹכְלָה מִצֵּיד בְּנִי
  choice: 让我吃我儿子的野味
  rationale: 第一人称祈愿式在命令之后表达意愿或目的；“让我吃”比直译“我就吃”更自然。צַיִד 指狩猎所得的野味，מִן 在此有部分义，汉语无需另译“从……中”。
- source_word: לְמַעַן
  choice: 好让
  rationale: 清楚保留目的关系，同时符合现代叙事语体。
- source_word: תְּבָרֶכְךָ נַפְשִׁי
  choice: 让我的心给你祝福
  rationale: נֶפֶשׁ 在此以第一人称主体的强调性习语出现。“我的心”保留原文异于单纯“我”的表达及其郑重、全心之意，又比“我的灵魂”更符合现代汉语语境；另以脚注说明较自然的译法。
- source_word: וַיַּגֶּשׁ לוֹ
  choice: 他就拿到父亲那里
  rationale: 保留与前句“拿到我这里来”的词语呼应；为避免连续代词造成指代含混，将 לוֹ 的所指明确为“父亲”。
- source_word: יַיִן
  choice: 酒
  rationale: יַיִן 通常指葡萄酒；本节无需特别强调种类，汉语叙事中译作“酒”自然准确。
- source_word: וַיֵּשְׁתְּ
  choice: 父亲也喝了
  rationale: 直陈叙事动作；补明主语“父亲”以消除汉语中雅各与以撒之间的指代歧义，“也”承接前面的进食。
theological_decisions:
- issue: נַפְשִׁי 是否应简化为第一人称“我”
  choice: 正文保留为“我的心”，脚注说明可意译为“我”
  alternative: 好让我给你祝福
  rationale: 原文明确以 נֶפֶשׁ 为语法主语。保留这一措辞可呈现其郑重而全人的语气，同时脚注提供自然汉语理解，不把它解释成独立于人的实体，也不引入特定灵魂论。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。为避免本节多个男性人物导致代词含混，在后半节以“父亲”明确指以撒；“他”仍指雅各。正文保留 נַפְשִׁי 的强调性表达，并以脚注交代更自然的意译。
