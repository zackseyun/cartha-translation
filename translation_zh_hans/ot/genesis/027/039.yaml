base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/039.yaml
  text: Then his father Isaac answered and said to him[a], “Behold, your dwelling shall be away from the richness of the earth, and away from the dew of heaven above.”
translation:
  language: zh_hans
  text: 他父亲以撒回答他说[a]：“看哪，你的住处必远离地上的肥沃之地，也远离天上所降的甘露。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“看哪，你的住处必有地上的肥沃之地和天上所降的甘露。”希伯来语介词既可表示来源或享有，也可表示远离或缺失。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַן
  choice: 回答
  rationale: 这是叙事中引出回应之言的常见用法；“回答”自然地保留对话结构。
- source_word: הִנֵּה
  choice: 看哪
  rationale: 作为郑重唤起注意的话语标记，“看哪”既保留原文语气，也符合庄重的现代汉语经文体。
- source_word: מִשְׁמַנֵּי הָאָרֶץ
  choice: 远离地上的肥沃之地
  rationale: שְׁמַנִּים 字面含“肥美、丰饶”之意，在此指土地的肥沃；结合上下文，将 מִן 取为分离、缺失义，但在脚注保留来源或享有义的可能。
- source_word: מוֹשָׁבֶךָ
  choice: 你的住处
  rationale: מוֹשָׁב 指居住之处；“住处”简明自然，并保留空间意义。
- source_word: וּמִטַּל הַשָּׁמַיִם
  choice: 也远离天上所降的甘露
  rationale: 与前一 מִן 短语平行，正文取分离义；“所降”使汉语搭配自然，也表达甘露来自天上。
- source_word: מֵעָל
  choice: 天上
  rationale: 原文表达上方的天空；融入“天上所降的甘露”可自然传达其空间含义。
theological_decisions:
- issue: 以撒对以扫所说之言中介词 מִן 的含义
  choice: 取分离、缺失义：住处“远离”土地的肥沃和天上的甘露
  alternative: 取来源或享有义：住处“得享”土地的肥沃和天上的甘露
  rationale: מִן 在语法上容许两种理解。上下文中，这句话与27:28给雅各的祝福形成对照，因此正文采用分离义；但希伯来文本并未排除正面理解，故以脚注明示另一译法，保留原文的真实歧义与神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“肥沃之地”避免生硬直译为“地的肥美”；“看哪”保留宣告的郑重语气。脚注标记已置于正文“他说”之后。
