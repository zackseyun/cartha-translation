base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/022.yaml
  text: So Jacob went near to Isaac his father[a], and he felt him and said, “The voice is Jacob’s voice, but the hands are Esau’s hands.”
translation:
  language: zh_hans
  text: 于是，雅各走近他父亲以撒。以撒摸了摸他，说：“声音是雅各的声音，双手却是以扫的双手。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּגַּשׁ
  choice: 走近
  rationale: 该动词在此表示雅各按父亲的要求靠近；“走近”既保留叙事动作，也符合现代汉语表达。
- source_word: וַיְמֻשֵּׁהוּ
  choice: 以撒摸了摸他
  rationale: 此处指以撒借触摸来查验雅各的身份。“摸了摸”自然地表达有意辨认的动作；为避免连续代词造成施受关系含混，明确补出主语“以撒”。
- source_word: הַקֹּל
  choice: 声音
  rationale: קול可指声音或嗓音；这里以撒根据说话声辨认身份，“声音”准确而自然。
- source_word: קוֹל יַעֲקֹב
  choice: 雅各的声音
  rationale: 保留希伯来语属格结构及其重复强调，同时采用现代汉语自然的领属表达。
- source_word: וְהַיָּדַיִם יְדֵי עֵשָׂו
  choice: 双手却是以扫的双手
  rationale: “双手”对应希伯来语双数形式；“却”表达两项证据之间隐含的转折，而重复“以扫的双手”则保留原文的修辞力度。
- source_word: אָבִיו
  choice: 他父亲
  rationale: 原文明说以撒是雅各的父亲，译文予以保留，以呈现人物关系。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重且易懂的叙事语言。保留“声音……声音，双手……双手”的原文对称和重复；将第二个连续动作的主语明确为“以撒”，仅为消除汉语代词歧义，不改变原文所指。
