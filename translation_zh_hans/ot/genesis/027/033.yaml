base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/033.yaml
  text: Then Isaac trembled with a very great trembling and said[a], “Who then was it who hunted game and brought it to me, and I ate from all of it before you came and blessed him? Yes, and he will be blessed.”
translation:
  language: zh_hans
  text: 以撒大大地战栗，战栗得非常厉害，说：“那么，究竟是谁猎取野味带来给我，使我在你来到以前吃了他带来的一切，又祝福了他呢？他也必蒙福。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֶּחֱרַד יִצְחָק חֲרָדָה גְּדֹלָה עַד מְאֹד
  choice: 以撒就极其剧烈地战抖起来
  rationale: 动词与同根名词构成强调结构，并由“极大、非常”进一步加强。译为“极其剧烈地战抖起来”，以自然现代汉语传达身体与情绪上的强烈震动。
- source_word: מִי אֵפוֹא הוּא
  choice: 那么……究竟是谁呢
  rationale: “那么”表现 אֵפוֹא 的推论语气，“究竟”传达以撒震惊之下的强调和追问。
- source_word: הַצָּד צַיִד
  choice: 那打了野味……的人
  rationale: 保留“猎取—野味”的同源意义，同时采用普通现代汉语表达；不把 צַיִד 过度限定为鹿肉。
- source_word: וַיָּבֵא לִי
  choice: 带给我的
  rationale: 宾语承接前面的“野味”，汉语关系结构简洁清楚。
- source_word: וָאֹכַל מִכֹּל
  choice: 我就已经吃了他带来的各样食物
  rationale: מִכֹּל 字面为“从一切中”，语境指来者所带并预备的食物；“各样食物”保留范围性，又避免中文“从全部中吃了”的生硬表达。
- source_word: בְּטֶרֶם תָּבוֹא
  choice: 你还没有来
  rationale: 自然表达“在你来以前”，并与后面的“已经”形成清楚的先后关系。
- source_word: וָאֲבָרֲכֵהוּ
  choice: 也给他祝了福
  rationale: 明确保留第一人称主语所实施的完成动作；“祝了福”符合本段族长祝福的叙事语域。
- source_word: גַּם בָּרוּךְ יִהְיֶה
  choice: 他也必蒙福
  rationale: “也”保留 גַּם 的附加兼确认语气，“必”体现 יִהְיֶה 在此处坚定的将来或持续效力；“蒙福”自然且庄重。
theological_decisions:
- issue: 以撒最后一句对已经发出之祝福的效力有何语气
  choice: 译作“他也必蒙福”，表达坚定确认该祝福仍然成立
  alternative: “他也会蒙福”，可理解为较平淡或无奈的承认
  rationale: גַּם 与 בָּרוּךְ יִהְיֶה 在语境中具有强调确认作用。译文保留祝福不可轻易收回的叙事张力，但不进一步引入后来的教义解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“战抖”比单纯“发抖”力度更强，适合希伯来文高度强化的表达；整体保留连续动作和以撒震惊追问的语势。
