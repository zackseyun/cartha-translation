- from: 以扫听见父亲的话，就放声痛哭，哭声极其凄苦。他对父亲说：“我父啊，也请为我祝福！”
  to: 以扫听见父亲的话，就发出一声极大的、极其悲痛的呼喊，对父亲说：“父亲啊，也请祝福我！”
  rationale: 以“呼喊”取代“痛哭”，避免把原文未明说的流泪读入译文；以“极大的、极其悲痛的”分别传达 גְּדֹלָה、מָרָה 和 עַד מְאֹד 的累加强调，同时保留简洁自然的现代汉语表达。
