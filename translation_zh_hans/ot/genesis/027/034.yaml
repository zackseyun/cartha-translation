review_pass:
  verdict: revise
  source_fidelity: “放声痛哭”将希伯来语 צעק（呼喊、喊叫）具体化为流泪哭泣，原文并未明确流泪；且“极其凄苦”未清楚承载“极大”与“极其”的双重加强。修订为“发出一声极大的、极其悲痛的呼喊”，保留呼喊及其强烈、痛苦的性质。
  naturalness: 修订后的叙事与直接引语符合现代标准汉语，庄重自然；“父亲啊，也请祝福我！”保留哀求语气而不添加原文之外的礼貌程度。
  terminology: “祝福我”准确对应 בָּרֲכֵנִי；“也”对应 גַּם，“父亲啊”保留 אָבִי 的呼语及所属意味。
