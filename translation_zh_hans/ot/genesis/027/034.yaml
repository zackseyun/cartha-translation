base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/034.yaml
  text: When Esau heard his father’s words[a], he cried out with an exceedingly great and bitter cry, and said to his father, “Bless me too, my father!”
translation:
  language: zh_hans
  text: 以扫听见父亲的话，就发出一声极大的、极其悲痛的呼喊，对父亲说：“父亲啊，也请祝福我！”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּשְׁמֹעַ
  choice: 听见……就
  rationale: כִּי加不定词结构表示时间情境；“听见……就”自然地表达紧接发生的叙事次序，又不额外强调瞬时性。
- source_word: דִּבְרֵי אָבִיו
  choice: 父亲的话
  rationale: 保留דָּבָר“话、言语”的基本词义，比“父亲所说的”更贴近原文形式。
- source_word: וַיִּצְעַק צְעָקָה
  choice: 放声痛哭，哭声……
  rationale: 原文以同源动词和名词强化呼喊；汉语若直译为“喊了一个喊声”生硬，故用动词加“哭声”重现重复和强烈情绪。
- source_word: גְּדֹלָה וּמָרָה עַד מְאֹד
  choice: 哭声极其凄苦
  rationale: גְּדֹלָה表示强烈或宏大，מָרָה表示苦涩、悲苦，עַד מְאֹד极度加强；“极其凄苦”在现代汉语中凝练而有分量，“放声”同时传达声音强烈。
- source_word: בָּרֲכֵנִי
  choice: 请为我祝福
  rationale: 命令式表达急切请求；加“请”符合儿子向父亲哀求的现代汉语语气，“为我祝福”清楚表达祝福落在说话者身上。
- source_word: גַם אָנִי
  choice: 也……我
  rationale: 在译文中作“也请为我”，自然传达以扫请求自己也得到祝福的强调。
- source_word: אָבִי
  choice: 我父啊
  rationale: 保留第一人称所属后缀，并以呼语“啊”表现原句哀求的情感力度，语体庄重而可懂。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而富有情感的叙事语言。没有机械复制希伯来语同源宾语结构，而以“放声痛哭，哭声……”保留其重复强化效果；不对祝福的性质或效力作原文之外的神学解释。
