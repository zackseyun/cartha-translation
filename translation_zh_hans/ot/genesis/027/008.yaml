  text: וְ/עַתָּ֥ה בְנִ֖/י שְׁמַ֣ע בְּ/קֹלִ֑/י לַ/אֲשֶׁ֥ר אֲנִ֖י מְצַוָּ֥ה אֹתָֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/008.yaml
  text: Now[a], my son[b], listen to my voice as to what I command you.
translation:
  language: zh_hans
  text: 现在，我儿，你要听我的话，照我所吩咐你的去做。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 较直译：“现在，我儿，听我的声音，按我所吩咐你的。”这里“听我的话”含有听从、遵行的意思。
    reason: 说明希伯来语的字面表达及“听”在语境中所含的顺从意味。
lexical_decisions:
- source_word: וְעַתָּה
  choice: 现在
  rationale: 这是引出紧接着之指示的时间兼话语标记；现代汉语用“现在”自然地表达即时性，句首的 וְ 无须机械译为“而”。
- source_word: בְּנִי
  choice: 我儿
  rationale: 这是带第一人称单数后缀的呼格。用“我儿”既保留母亲对儿子的称呼，也符合庄重而自然的叙事语体。
- source_word: שְׁמַע בְּקֹלִי
  choice: 听我的话
  rationale: 字面为“听我的声音”，在此是听取并留心所说之话，也隐含顺从。译作“听我的话”保留“听”的基本意象，不直接收窄为“服从”。
- source_word: לַאֲשֶׁר
  choice: 照……
  rationale: 该结构把“听我的话”与随后具体的吩咐连接起来。汉语用“照……去做”自然表达按所吩咐的内容行事。
- source_word: אֲנִי מְצַוָּה אֹתָךְ
  choice: 我所吩咐你的
  rationale: 分词 מְצַוָּה 表示当前正在作出的命令；“我所吩咐你的”在汉语中自然涵盖这一即时语境。“吩咐”准确表达 צוה 的命令性，又适合母亲对儿子的说话场景。
theological_decisions:
- issue: “听”与“服从”的语义张力
  choice: 正文保留“听我的话”，并以“照……去做”呈现语境中所要求的行动
  alternative: 直接译为“服从我”或“听从我”
  rationale: שׁמע 的基本义是听、留心，在此又明显要求遵行。当前译法既不抹去听取话语的意象，也不遗漏顺从的语境含义。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“我儿”保留亲属呼语的温度；“照我所吩咐你的去做”使希伯来语关系结构在汉语中清楚自然。
