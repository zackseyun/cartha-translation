- source_word: לֹא יָדַעְתִּי יֹום מוֹתִי
  choice: 不知道自己哪一天会死
  rationale: 原文直译为“不知道我死亡的日子”；此译在不改变含义的前提下，用自然汉语表达死亡日期不可知。
