  text: וְ/לֹ֣א הִכִּיר֔/וֹ כִּֽי הָי֣וּ יָדָ֗י/ו כִּ/ידֵ֛י עֵשָׂ֥ו אָחִ֖י/ו שְׂעִרֹ֑ת וַֽ/יְבָרְכֵֽ/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/023.yaml
  text: And he did not recognize him[a], because his hands were hairy like the hands of his brother Esau; so he blessed him.
translation:
  language: zh_hans
  text: 他没有认出雅各，因为雅各的手像他哥哥以扫的手一样多毛；于是他为雅各祝福。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他为雅各祝福。”希伯来语的叙事形式可以只表示事件的先后承接，但这里也含有结果的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: הִכִּירוֹ
  choice: 没有认出雅各
  rationale: נכר 的使役式在此意为“认出、辨认出”。用“雅各”明确代词所指，避免连续多个“他”造成现代汉语歧义。
- source_word: כִּי
  choice: 因为
  rationale: 此处引出以撒未能认出雅各的原因，译作“因为”准确而自然。
- source_word: יָדָיו
  choice: 雅各的手
  rationale: 原文是“他的手”；为清楚区分以撒、雅各和以扫，以姓名明确所指。
- source_word: כִּידֵי עֵשָׂו אָחִיו
  choice: 像他哥哥以扫的手一样
  rationale: 保留 כְּ 的比较意义及“他哥哥以扫”这一亲属关系；这里的“他”指雅各。
- source_word: שְׂעִרֹת
  choice: 多毛
  rationale: 该阴性复数形容词与“手”相应，描述触摸时感到毛多；“多毛”简洁、自然。
- source_word: וַיְבָרְכֵהוּ
  choice: 于是他给雅各祝福
  rationale: 叙事式连接既推进事件，也在语境中呈现结果。“于是”自然保留这种承接；用“雅各”消除宾语歧义。
theological_decisions:
- issue: וַיְבָרְכֵהוּ 的叙事关系
  choice: 于是他给雅各祝福
  alternative: 他就给雅各祝福／他给雅各祝福
  rationale: 希伯来语叙事形式本身主要表示事件承接，语境中又有结果意味；“于是”兼顾两者，不把因果关系说得过强。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。为避免本节多个第三人称男性代词造成歧义，在不改变意义的前提下，用“雅各”明确部分代词所指。脚注标记置于全句之后，对“于是”的翻译作说明。
