base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/019.yaml
  text: And Jacob said to his father[a], “I am Esau your firstborn. I have done as you told me. Please rise, sit, and eat from my game[b], so that your soul may bless me.”
translation:
  language: zh_hans
  text: 雅各对父亲说：“我是以扫，你的长子。你吩咐我的，我已经照办了。请起来坐下，吃我打来的野味，好给我祝福[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“好让你的生命（或：你本人）给我祝福”。这里的希伯来语“生命”用来指整个人。
    reason: 保留נַפְשֶׁךָ的字面形式及其习语功能，避免正文产生不必要的人论含义。
lexical_decisions:
- source_word: וַיֹּאמֶר יַעֲקֹב אֶל־אָבִיו
  choice: 雅各对父亲说
  rationale: 以现代汉语自然的叙事句式表达连续叙事中的发言，并忠实保留父子关系。
- source_word: אָנֹכִי עֵשָׂו בְּכֹרֶךָ
  choice: 我是你的长子以扫
  rationale: 保留雅各冒充以扫并自称长子的欺骗性陈述；此语序在现代汉语中清楚自然。
- source_word: עָשִׂיתִי כַּאֲשֶׁר דִּבַּרְתָּ אֵלָי
  choice: 你吩咐我的，我已经照办了
  rationale: “照办”自然表达按先前指示行事；“已经”体现完成性语境。
- source_word: קוּם נָא שְׁבָה
  choice: 请起来坐下
  rationale: קוּם与שְׁבָה是两个连续的命令，נָא带有请求、礼貌语气；译文保留看似突兀却符合场景的动作次序。
- source_word: וְאָכְלָה מִצֵּידִי
  choice: 吃我打来的野味
  rationale: צַיִד在本语境指猎获并制成食物的野味；“打来的野味”比仅说“我的猎物”更适合进食场景。
- source_word: בַּעֲבוּר תְּבָרֲכַנִּי נַפְשֶׁךָ
  choice: 好给我祝福
  rationale: בַּעֲבוּר引出目的；נַפְשֶׁךָ在这里以“你本人”指整个人，汉语通常无需直译为“你的灵魂”，直译细节以脚注保留。
theological_decisions:
- issue: נַפְשֶׁךָ在“给我祝福”这一表达中的处理
  choice: 正文按希伯来习语译为“给我祝福”
  alternative: “让你的灵魂给我祝福”或“让你本人给我祝福”
  rationale: 这里的נֶפֶשׁ指说话对象本人，并非有意陈述灵魂与身体的关系。直译“灵魂”会使现代汉语读者误以为经文在作特定的人论陈述；脚注保留字面形式和强调意味。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“照办”“打来的野味”便于普通读者理解；不美化雅各的谎言，也不额外加入道德评语。
