base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/040.yaml
  text: And by your sword you shall live[a], and you shall serve your brother; but when you break loose, you shall break his yoke from off your neck.
translation:
  language: zh_hans
  text: 你必靠刀剑度日，也必服侍你的兄弟；但当你奋力反抗时[a]，你必将他的轭从你颈项上折断。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“但当你变得躁动不安时”。希伯来语动词 תָּרִיד 的含义难以确定；下文关于挣脱轭的语境支持译作“奋力反抗”，但“变得躁动不安”也有可能。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל חַרְבְּךָ תִחְיֶה
  choice: 你必靠刀剑度日
  rationale: עַל在此表示凭借的手段；保留חֶרֶב“刀剑”的具体意象，并以现代汉语自然表达其生活方式。
- source_word: וְאֶת אָחִיךָ תַּעֲבֹד
  choice: 也必服侍你的兄弟
  rationale: עבד在Qal词形中通常指“服侍”；不进一步限定这种从属关系的政治或家庭形式。
- source_word: וְהָיָה כַּאֲשֶׁר
  choice: 但当……时
  rationale: 既表达将来的时间情境，也传达末句相对于前文的转折。
- source_word: תָּרִיד
  choice: 你挣脱
  rationale: 该词在此含义困难；下文关于除去轭的语境支持“挣脱”，但脚注保留“变得躁动不安”这一可能解释。
- source_word: וּפָרַקְתָּ
  choice: 你就必……挣开
  rationale: פרק表示用力扯开、挣开或折断；“挣开”与颈项上的轭这一动作意象自然衔接。
- source_word: עֻלּוֹ מֵעַל צַוָּארֶךָ
  choice: 把他的轭从你颈项上挣开
  rationale: 保留“他的轭”和“你颈项上”的具体比喻，同时调整语序，使汉语清楚自然。
theological_decisions:
- issue: 以扫将来与雅各的关系
  choice: 将神谕译为先服侍兄弟、后来挣脱其轭，保留从属与脱离之间的张力。
  alternative: 把服侍解释为永久奴役，或弱化为一般的家庭礼让。
  rationale: 原文明确提到服侍兄弟以及后来除去他的轭，但本节本身没有要求把这种关系扩展为更广泛的教义或历史结论。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“靠刀剑度日”保留原文鲜明意象；“轭”和“颈项”保留神谕中的具体比喻。脚注标记置于有词义争议的“挣脱时”之后。
