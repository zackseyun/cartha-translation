  yaml_path: translation/ot/genesis/027/010.yaml
  text: Then you shall bring it to your father, and he will eat, so that he may bless you before his death.
translation:
  language: zh_hans
  text: 你要把食物拿给你父亲，他会吃，好让他在去世以前给你祝福。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהֵבֵאתָ
  choice: 你要把食物拿给
  rationale: 该形式在连续指示中具有命令式将来语气；结合上文所说要做的美食，补出“食物”使现代汉语自然清楚。
- source_word: לְאָבִיךָ
  choice: 你父亲
  rationale: 准确表达“给你的父亲”；“父亲”符合庄重的叙事语体。
- source_word: וְאָכָל
  choice: 他就会吃
  rationale: 表达前一行动之后预期发生的结果，“就会”自然体现叙事顺序。
- source_word: בַּעֲבֻר אֲשֶׁר
  choice: 好
  rationale: 该组合在此引出目的；“好……”以简洁自然的现代汉语保留目的关系。
- source_word: יְבָרֶכְךָ
  choice: 给你祝福
  rationale: 准确传达ברך的加强词干及第二人称宾语，在族长祝福的语境中清楚自然。
- source_word: לִפְנֵי מוֹתוֹ
  choice: 在去世以前
  rationale: 保留“在他死亡之前”的时间含义，同时以“去世”维持庄重、自然的中文语体。
theological_decisions: []
translation_notes:
  register: 采用现代、清楚而庄重的叙事语言；不增加原文没有的神学解释。以“你要……他就会……”呈现母亲对雅各所述计划的连续步骤，并以“好”自然表达目的。
