  text: Now[a], my son, listen to my voice, and arise, flee to my brother Laban in Haran.
translation:
  language: zh_hans
  text: 现在，我儿，听我的话；起来，逃往哈兰，去我哥哥拉班那里。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: 现在
  rationale: 作为话语标记，引出利百加随即发出的紧急指示；现代汉语中省去句首“并且”更自然。
- source_word: בְנִי
  choice: 我儿
  rationale: 保留母亲对雅各亲切而庄重的男性亲属称呼。
- source_word: שְׁמַע בְּקֹלִי
  choice: 听我的话
  rationale: 希伯来语直译为“听我的声音”，语境含有听从之意；“听我的话”既自然，也不把含义强化为明确的“服从我”。
- source_word: וְקוּם
  choice: 起来
  rationale: 准确表达קום命令式，并保留一连串命令的急迫感。
- source_word: בְּרַח לְךָ
  choice: 逃……去
  rationale: ברח表示逃走；לְךָ无需在汉语中另译，“逃……去”自然传达趋向与紧迫性。
- source_word: אֶל לָבָן אָחִי
  choice: 到……我哥哥拉班那里去
  rationale: 保留拉班与说话者的兄妹关系，并采用自然的汉语处所结构。
- source_word: חָרָנָה
  choice: 哈兰
  rationale: 词尾方向性ה表示朝哈兰而去；与“到……那里去”的结构合用，清楚表达目的地。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而口语可懂的叙事用语。“我儿”保留亲属称呼的情感色彩；冒号呈现随后连续命令的结构。未设脚注，因为希伯来语连接词和利益与格在本句中可由自然汉语充分表达，不构成需要另注的实质歧义。
