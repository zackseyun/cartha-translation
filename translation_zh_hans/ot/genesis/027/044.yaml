  text: And stay with him for a few days[a], until your brother's fury turns away.
translation:
  language: zh_hans
  text: 你要同他住几天，直到你哥哥的怒气消退。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיָשַׁבְתָּ
  choice: 你要……住
  rationale: ישׁב可表示“居住、停留”。这里是利百加吩咐雅各暂住在拉班那里；“和他住”自然地表达暂时居住之意。句首连接词在中文连续话语中无需机械译出。
- source_word: עִמּוֹ
  choice: 和他
  rationale: עם加第三人称阳性单数后缀，指上文的拉班，直译为“和他”。
- source_word: יָמִים אֲחָדִים
  choice: 些日子
  rationale: 原文意为“若干日子、少数几日”。“些日子”既自然，也保留说话者认为停留时间不长的表达。
- source_word: עַד אֲשֶׁר
  choice: 直到
  rationale: 这是常见的时间连接结构，标明暂住结束的条件或时间点。
- source_word: תָּשׁוּב
  choice: 消退
  rationale: שׁוב本义为“返回、转回”；以怒气为主语时表示怒气退去。“消退”在现代汉语中自然清楚，同时反映此处的习惯用法。
- source_word: חֲמַת
  choice: 怒气
  rationale: חֵמָה表示强烈、炽热的愤怒。结合前后文，“怒气”庄重自然；其强烈程度也由以扫谋杀雅各的语境充分体现。
- source_word: אָחִיךָ
  choice: 你哥哥的
  rationale: 原文为“你兄弟的”。在叙事关系中以扫是雅各的哥哥，因此中文译作“你哥哥的”更明确自然。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。译文保持利百加所说“些日子”的主观预期，不因后来雅各长期滞留而改写；“怒气消退”准确表达抽象主语与שׁוב搭配时的惯用意义。
