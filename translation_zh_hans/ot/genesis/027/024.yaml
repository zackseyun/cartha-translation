  yaml_path: translation/ot/genesis/027/024.yaml
  text: He said[a], “Are you really my son Esau?” And he said, “I am.”
translation:
  language: zh_hans
  text: 他说：“你真是我儿子以扫吗？”[a]他说：“我是。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“你是这个——我儿子以扫吗？”，这种措辞是带强调意味的身份确认问句。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 他说
  rationale: אמר在叙事中表示“说”；句首的连续式וַ推进情节，现代汉语无需机械译出“于是”或“又”。
- source_word: אַתָּה זֶה
  choice: 你真是……吗
  rationale: 独立人称代词与指示词连用，构成带强调意味的身份确认问句；“真是”自然传达这种强调，同时不把它改写成单纯的是非问句。
- source_word: בְּנִי
  choice: 我儿子
  rationale: 保留名词与第一人称单数所属后缀所表达的关系。
- source_word: עֵשָׂו
  choice: 以扫
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: וַיֹּאמֶר
  choice: 他说
  rationale: 第二个אמר仍按原文简洁译作“说”，不增译为“回答”，以保留原文重复。
- source_word: אָנִי
  choice: 我是
  rationale: 独立代词在此作简短的自我确认；汉语以“我是”自然回应前面的身份确认问句。
