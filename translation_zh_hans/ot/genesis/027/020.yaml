base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/020.yaml
  text: Then Isaac said to his son[a], “How is it that you found it so quickly, my son?” And he said[b], “Because Yahweh your God caused it to happen before me.”
translation:
  language: zh_hans
  text: 以撒对他儿子说：“我儿，你怎么这么快就找到了？”他回答说：“因为雅威——你的上帝——使我正好碰上了。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַה זֶּה מִהַרְתָּ לִמְצֹא
  choice: 你怎么这么快就找到了
  rationale: 以自然现代汉语表达以撒因速度之快而惊讶的问话；“找到”保留 מצא，宾语依上下文省略。
- source_word: בְּנִי
  choice: 我儿
  rationale: 保留第一人称所有关系和亲昵的直接称呼，并符合庄重自然的叙事语体。
- source_word: הִקְרָה ... לְפָנַי
  choice: 使我正好碰上了
  rationale: הִקְרָה 是 קרה 的使役式，表示使某事偶然临到或使人遇见；结合 לְפָנַי，译文保留神促成这次遇见的含义，又避免生硬的“使它发生在我面前”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以通行的现代汉语音译呈现四字神名，不以称号替代专名。
- source_word: אֱלֹהֶיךָ
  choice: 你的上帝
  rationale: 准确保留第二人称单数后缀；叙事中“你的”所形成的张力不加解释或弱化。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华／上主
  rationale: 原文使用神的专名，故以现代汉语音译直接呈现，不用称号替换。
- issue: הִקְרָה 所表达的神圣促成
  choice: 使我正好碰上了
  alternative: 使事情发生在我面前／使我顺利找到
  rationale: 译文保留使役含义和偶遇色彩，但不把它扩展为原文未明说的“赐我成功”；同时使中文自然可懂。
- issue: “你的上帝”中的人称张力
  choice: 你的上帝
  alternative: 我们的上帝／上帝
  rationale: 严格保留原文第二人称所有格，让雅各话语中的叙事和神学张力保持开放。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“我儿”略带经文叙事色彩但仍自然；末句以“正好碰上”传达偶遇与神促成并存的语义。
