base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/030.yaml
  text: And it happened that as soon as Isaac had finished blessing Jacob[a], and Jacob had just gone out from the presence of Isaac his father[b], Esau his brother came in from his hunting.
translation:
  language: zh_hans
  text: 以撒刚给雅各祝福完，雅各刚刚从他父亲以撒面前出去[a]，他哥哥以扫就打猎回来了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“雅各才从他父亲以撒面前出去。”原文用同一词根的不定式绝对形和限定动词连用（直译：“出去，出去了”），并有强调词，突出雅各离开与以扫回来之间相隔极短。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי ... וַיְהִי
  choice: 以撒刚……，雅各才……，……就……
  rationale: 两个 וַיְהִי 推进紧接发生的叙事。用现代汉语“刚……才……就……”自然呈现事件衔接，不另译为生硬的“事情发生了”。
- source_word: כַּאֲשֶׁר כִּלָּה ... לְבָרֵךְ
  choice: 刚给……祝福完
  rationale: כלה 加不定式表示完成某项行动；“祝福完”既自然，也保留动作已经完成的意思。
- source_word: אַךְ יָצֹא יָצָא
  choice: 才……出去
  rationale: אַךְ 与不定式绝对形加限定动词共同强调离开的时间极近；“才……就……”能传达雅各刚离开、以扫随即回来的紧迫感。
- source_word: מֵאֵת פְּנֵי
  choice: 从……面前
  rationale: 较贴近原文的空间与面对面意味，同时符合现代汉语表达。
- source_word: אָבִיו / אָחִיו
  choice: 他父亲 / 他哥哥
  rationale: 保留原文明确写出的亲属关系；按上下文，以扫是雅各的哥哥。
- source_word: בָּא מִצֵּידוֹ
  choice: 打猎回来了
  rationale: ציד 在此可指打猎活动或猎获物；介词 מִן 表明从打猎处返回。“打猎回来了”在汉语中自然，并保留活动义。
