  yaml_path: translation/ot/genesis/027/018.yaml
  text: So he went in to his father and said[a], “My father.” And he said, “Here I am. Who are you, my son?”
translation:
  language: zh_hans
  text: 于是，雅各到了他父亲那里，说：“父亲！”父亲说：“我在这里。我儿，你是谁？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  choice: 于是，雅各到……那里
  rationale: בוא 的叙事式未完成体推进情节；此处表示雅各来到父亲面前。中文用“到……那里”自然表达趋近，补出上下文已明确的主语“雅各”，避免代词含混。
- source_word: אֶל אָבִיו
  choice: 父亲那里
  rationale: אֶל 表示方向，אָבִיו 是“他的父亲”；译作“到父亲那里”符合现代汉语，不额外加入希伯来文未出现的父亲名字。
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 这是希伯来叙事中常见的引语引介；中文按自然叙事习惯简洁译为“说”。
- source_word: אָבִי
  choice: 我父亲
  rationale: 名词带第一人称单数后缀，直译为“我的父亲”；作为呼语，采用庄重而自然的“我父亲”。
- source_word: הִנֶּנִּי
  choice: 我在这里
  rationale: 保留该希伯来应答语表示在场和回应的基本含义；比仅译“什么事？”更贴近原文。
- source_word: מִי אַתָּה
  choice: 你是谁
  rationale: 疑问代词加第二人称阳性单数代词，直接询问对方身份，保留原文直问形式。
- source_word: בְּנִי
  choice: 我儿
  rationale: 名词带第一人称单数后缀并作呼语；“我儿”简洁、自然，也保留亲属称谓中的所属意味。
theological_decisions: []
translation_notes:
  register: 采用现代、清楚而略带庄重感的叙事语言。为避免单节呈现时“他”所指不明，按上下文补明主语“雅各”；对话保留原文的简短和紧张感。
