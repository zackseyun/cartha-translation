base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/013.yaml
  text: His mother said to him[a], “Your curse be on me, my son. Only listen to my voice, and go[b], get them for me.”
translation:
  language: zh_hans
  text: '他母亲对他说：“我儿，你要受的咒诅归到我身上吧！你只管听我的话[a]，去给我把它们取来[b]。”


    [a] 希伯来文直译为“听我的声音”，这是一个也可表示“服从我”的惯用语。

    [b] 原文没有明说“它们”；这里根据上一节补出，指那两只山羊羔。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“听我的声音”，这是一个也可表示“服从我”的惯用语。
    reason: lexical_alternative
  - marker: b
    text: 原文没有明说“它们”；这里根据上一节补出，指那两只山羊羔。
    reason: cross_reference
lexical_decisions:
- source_word: וַתֹּאמֶר ל/וֹ אִמּוֹ
  choice: 他母亲对他说
  rationale: 按希伯来叙事常用表达译出אמר的普通陈述义，并保留“他的母亲”和间接宾语。
- source_word: עָלַי קִלְלָתְךָ
  choice: 你要受的咒诅归到我身上吧
  rationale: 无动词短句表达利百加愿意承担本会临到雅各的咒诅；“归到我身上”保留עָלַי的空间—承担意象，“你要受的”避免把“你的咒诅”误解为雅各发出的咒诅。
- source_word: בְּנִי
  choice: 我儿
  rationale: 保留带第一人称单数后缀的亲属称呼及其恳切语气，中文圣经叙事中自然而庄重。
- source_word: אַךְ
  choice: 只管
  rationale: 在命令语境中表达限制与强调：雅各只需照母亲的话去做。
- source_word: שְׁמַע בְּקֹלִי
  choice: 听我的话
  rationale: 这是现代中文自然的表达，也保留“听从、服从”的语用含义；脚注说明原文的声音意象。
- source_word: וְלֵךְ קַח לִי
  choice: 去给我把它们取来
  rationale: 顺畅表达两个连续命令及利益与格לִי；“它们”是根据上一节山羊羔补出的宾语，并以脚注标明。
theological_decisions:
- issue: 利百加承担咒诅之语的语气与范围
  choice: 译为“你要受的咒诅归到我身上吧”
  alternative: “你的咒诅在我身上”
  rationale: 原文是简短的无动词结构，可理解为主动承担后果。译文不进一步断言咒诅能否实际转移，也不评价利百加的承诺，只保留其愿意代受的表态。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“我儿”保留亲密而恳切的称呼；“只管”自然传达限制性语气。脚注标记紧随各自所解释的词组，避免英文咨询层中标记位置与说明对象不一致的问题。
