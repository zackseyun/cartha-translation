  yaml_path: translation/ot/genesis/027/026.yaml
  text: Then his father Isaac said to him[a], “Come near, please, and kiss me, my son.”
translation:
  language: zh_hans
  text: 他父亲以撒对他说：“我儿，请走近些，亲我。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 叙事中的连续式推动情节；现代汉语按上下文自然承接，无须机械增译“然后”。
- source_word: אֵלָיו
  choice: 对他说
  rationale: 介词与第三人称单数后缀表示说话的对象，汉语惯用“对他说”。
- source_word: יִצְחָק אָבִיו
  choice: 他父亲以撒
  rationale: 保留希伯来语中亲属称谓与人名的同位结构，也延续本段对父子关系的强调。
- source_word: גְּשָׁה נָּא
  choice: 请走近些
  rationale: 动词表示靠近、上前；“请”体现 נָא 对命令语气的缓和，“些”使现代汉语表达自然。
- source_word: וּשְׁקָה לִּי
  choice: 亲亲我
  rationale: נשׁק 在这里指亲吻，לִי 在该结构中指动作所及的对象；叠词“亲亲”符合父亲对儿子的自然口吻，又不改变动作含义。
- source_word: בְּנִי
  choice: 我儿
  rationale: 保留呼语及父子间亲近而庄重的语气；“我儿”比“我的儿子”更适合作直接称呼。
theological_decisions: []
translation_notes:
  register: 采用现代、自然而庄重的叙事语言。“请走近些，亲亲我”体现年迈父亲对儿子的亲近请求，避免生硬直译，也不补入原文没有的解释。
