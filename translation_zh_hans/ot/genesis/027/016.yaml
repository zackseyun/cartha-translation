  text: וְ/אֵ֗ת עֹרֹת֙ גְּדָיֵ֣י הָֽ/עִזִּ֔ים הִלְבִּ֖ישָׁה עַל יָדָ֑י/ו וְ/עַ֖ל חֶלְקַ֥ת צַוָּארָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/016.yaml
  text: And she put the skins of the young goats on his hands and on the smooth part of his neck.
translation:
  language: zh_hans
  text: 她又把小山羊的皮包在雅各的手上和颈项光滑的地方。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֹרֹת
  choice: 皮
  rationale: 此处复数构造形式指取自小山羊、用来覆盖身体的皮；现代汉语以“皮”作集合性表达最自然，无须机械标出复数。
- source_word: גְּדָיֵי הָעִזִּים
  choice: 小山羊
  rationale: 该短语指山羊的幼崽；“小山羊”准确、自然，也与本章上下文相合。
- source_word: הִלְבִּישָׁה
  choice: 包在
  rationale: 使役式动词本义为给人穿上或披上；因宾语是皮，且覆盖部位是手和颈项，“包在”比“穿在”更符合现代汉语表达。
- source_word: עַל יָדָיו
  choice: 在雅各的手上
  rationale: 直译为“在他的手上”。为避免连续代词可能造成的指代不清，在不改变所指的前提下明确为“雅各”。
- source_word: חֶלְקַת צַוָּארָיו
  choice: 颈项光滑的地方
  rationale: חֶלְקַת 表示光滑处或光滑部分；此译具体保留其身体部位含义，并与以扫多毛的上下文形成对照。
