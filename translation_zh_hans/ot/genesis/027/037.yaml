base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/037.yaml
  text: Isaac answered and said to Esau[a], “Look, I have made him master over you, and I have given all his brothers to him as servants. I have sustained him with grain and new wine. What then can I do for you[c][b], my son?”
translation:
  language: zh_hans
  text: 以撒回答以扫说：“看哪，我已经立他为你的主人，把他所有的弟兄都给他作仆人[a]，又用粮食和新酒供养他[b]。那么[c]，我又能为你做什么呢，我儿？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“作奴仆”。原文词语可指仆人，也可指奴隶，须按语境判断。
    reason: lexical_alternative
  - marker: b
    text: 或译“用粮食和新酒扶持他”。原文动词可着重表达扶持或供应。
    reason: lexical_alternative
  - marker: c
    text: 或译“既是这样”。
    reason: discourse_alternative
lexical_decisions:
- source_word: וַיַּעַן
  choice: 回答
  rationale: 这是叙事中引出对话回应的常见用法；“回答”自然、准确。
- source_word: הֵן
  choice: 看哪
  rationale: 保留原文用以唤起注意并加强语气的感叹词，同时维持庄重语体。
- source_word: גְּבִיר
  choice: 主人
  rationale: 此词指拥有权柄、居支配地位的人；“主人”适合这里家族关系中的从属语境，也避免将其误解为神圣称号。
- source_word: שַׂמְתִּיו לָךְ
  choice: 我已经立他作你的主人
  rationale: שׂים加身份名词表示设立或置于某种地位；此译清楚表达雅各被立于以扫之上。
- source_word: כָּל אֶחָיו
  choice: 他所有的弟兄
  rationale: 按原文保留明确的亲属称谓，不擅自扩大为泛指的亲族。
- source_word: לַעֲבָדִים
  choice: 作仆人
  rationale: עבד可指仆人或奴隶；正文采用较不限定具体法律身份的“仆人”，并在脚注保留另一可能。
- source_word: דָגָן
  choice: 五谷
  rationale: 指谷类农产；“五谷”在祝福和农产语境中自然、庄重，并不限定某一种谷物。
- source_word: תִּירֹשׁ
  choice: 新酒
  rationale: 该词指新近酿成的酒或葡萄汁所产之酒，“新酒”保留其农业语义。
- source_word: סְמַכְתִּיו
  choice: 供养他
  rationale: סמך本义为扶持、支撑；与五谷和新酒连用时侧重以物产维持、供应，故译为“供养”。
- source_word: וּלְכָה אֵפוֹא
  choice: 那么
  rationale: 该表达转向以扫所面临的结果；“那么”自然传达承接和推论语气。
- source_word: מָה אֶעֱשֶׂה לְךָ
  choice: 我还能为你做什么呢
  rationale: 这是反问，语境显示祝福既已授予，所能再做的十分有限；“还能”传达这种语用含义。
- source_word: בְּנִי
  choice: 我儿
  rationale: 保留句末直接而带亲情的称呼，也维持原文的情感张力。
