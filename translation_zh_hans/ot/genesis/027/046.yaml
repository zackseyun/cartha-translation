base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/046.yaml
  text: Then Rebekah said to Isaac[a], “I am weary of my life because of the daughters of Heth. If Jacob takes a wife from the daughters of Heth like these, from the daughters of the land, what is life to me?”
translation:
  language: zh_hans
  text: 利百加对以撒说：“我因赫人的女子[a]，连活着都厌烦了。要是雅各娶赫人的女子为妻，像这些本地女子一样，我活着还有什么意思呢？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “赫人的女子”也可译作“赫人妇女”；原文直译为“赫的女儿们”。
    reason: 说明族群称谓的字面形式及自然汉语译法。
lexical_decisions:
- source_word: קַצְתִּי בְחַיַּי
  choice: 连活着都厌烦了
  rationale: 该习语表达因某事而对自己的生活感到厌倦、憎烦；此译自然传达强烈情绪，又不将其夸大为明确求死。
- source_word: מִפְּנֵי
  choice: 因
  rationale: 此处介词表示原因，现代汉语用“因”简洁、庄重。
- source_word: בְּנוֹת חֵת
  choice: 赫人的女子
  rationale: “赫”是专名，בנות在民族归属语境中自然指该族女子；此译兼顾希伯来语的族系表达和现代汉语可懂度。
- source_word: אִם לֹקֵחַ יַעֲקֹב אִשָּׁה
  choice: 要是雅各也……娶妻
  rationale: לקח אשה是婚娶惯用语；补出“也”承接上下文及“像她们这样”的比较关系，不改变条件句本义。
- source_word: כָּאֵלֶּה
  choice: 像她们这样
  rationale: 阴性复数指向前述女子，可能尤其关联以扫的妻子；保留指代，不明确补出经文未明说的人名。
- source_word: מִבְּנוֹת הָאָרֶץ
  choice: 娶这地方的女子
  rationale: 直译为“这地的女子”；“这地方的女子”在现代汉语中自然，并保留本地族群与亲族婚配之间的对照。
- source_word: לָמָּה לִּי חַיִּים
  choice: 我活着还有什么意思呢
  rationale: 保留反问及生命对说话者而言失去意义的语气；不直接译成“我为什么还要活”，以免将隐含意味强化成明确意愿。
theological_decisions:
- issue: חֵת的族群称谓
  choice: 正文译作“赫人的女子”
  alternative: “赫的女儿们”或“赫人妇女”
  rationale: 此处是族群称谓，不涉及需要教派化处理的教义判断。“赫人的女子”既保留专名，也比逐字的“赫的女儿们”更符合现代汉语。
- issue: 结尾反问的含义强度
  choice: “我活着还有什么意思呢？”
  alternative: “我活着还有什么好处呢？”或“我为什么还要活呢？”
  rationale: 原文表达生命对她还有何意义或价值，语势强烈但含有语用开放性；所选译法避免加入“好处”，也避免将其定性为明确的求死表达。
translation_notes:
  register: 采用现代、庄重而口语可懂的叙事语言。“连活着都厌烦了”传达利百加强烈的情绪；末句使用自然反问，并保留原文在“生命有何意义/价值”上的张力。
