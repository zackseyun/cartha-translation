base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/011.yaml
  text: But Jacob said to Rebekah his mother[a], “Look, Esau my brother is a hairy man[b], and I am a smooth man.”
translation:
  language: zh_hans
  text: 雅各却对他母亲利百加说：“你看，我哥哥以扫身上有毛，而我皮肤光滑[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “皮肤光滑”指雅各身体没有毛，与以扫身上有毛形成对比。
    reason: clarity_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 雅各却……说
  rationale: 叙事性连接词推进情节；结合上文，雅各是在对利百加的安排提出异议，因此用“却”自然表达语境中的转折，而不过度增译。
- source_word: אֶל רִבְקָה אִמּוֹ
  choice: 对他母亲利百加
  rationale: 保留人名及其与雅各的关系；现代汉语中“他母亲利百加”自然清楚。
- source_word: הֵן
  choice: 你看
  rationale: 这是引起对方注意并引出异议的语气词；“你看”比“看哪”更符合现代口语，同时保留其话语功能。
- source_word: אִישׁ שָׂעִר
  choice: 浑身有毛
  rationale: 该短语直指以扫身体多毛；译为“浑身有毛”在汉语中自然，也与后面的身体光滑形成鲜明对照。
- source_word: וְאָנֹכִי
  choice: 而我
  rationale: 独立人称代词带有强调作用，并与以扫形成对比；“而我”准确传达这种对照。
- source_word: אִישׁ חָלָק
  choice: 身上光滑
  rationale: 这里与“有毛”相对，指雅各身体少毛或无毛；“身上光滑”既保留“光滑”的基本意象，也避免被误解为性格圆滑。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。对话中的“你看”自然呈现雅各提出异议的语气；“浑身有毛／身上光滑”明确表达原文的身体特征对比。
