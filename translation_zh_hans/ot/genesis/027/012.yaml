  source_fidelity: 草稿基本传达了原文的可能性、触摸查验、被视为欺骗者及招致咒诅而非祝福的意思。但“像个欺骗他的人”把原文未明说的受事“他”补为父亲，缩窄了原文的表述；末句“给自己招来的就不是祝福，而是咒诅了”句法也较迂回，弱化了与前句并列的“我会招来”结构。
  naturalness: “看我像个欺骗他的人”在现代汉语中不够顺畅，且“看我像”略显口语和结构含混。改为“我在他眼中就像个骗子”，自然、庄重，并准确表达“在他看来”的习语。
  terminology: “咒诅”与“祝福”保留，适合本段圣经叙事及原文对照。“骗子”在正文中自然地表达欺骗者；脚注保留“戏弄人的人”等较宽的词义可能。
