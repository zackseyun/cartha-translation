revisions:
- from: 说不定我父亲会摸我[a]，看我像个欺骗他的人[b]；这样，我给自己招来的就不是祝福，而是咒诅了。
  to: 恐怕我父亲会摸我[a]，我在他眼中就像个骗子[b]；我会给自己招来咒诅，而不是祝福。
  rationale: 以“恐怕”传达雅各带有忧虑的可能性；将“在他眼中”明确译出，以自然汉语表达该习语；删除“欺骗他”这一原文未明示的受事；并恢复“我会给自己招来咒诅，而不是祝福”的直接并列和对照。脚注锚点保留且均对应正文中的相关词语。
