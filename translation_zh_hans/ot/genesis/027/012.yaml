  text: אוּלַ֤י יְמֻשֵּׁ֨/נִי֙ אָבִ֔/י וְ/הָיִ֥יתִי בְ/עֵינָ֖י/ו כִּ/מְתַעְתֵּ֑עַ וְ/הֵבֵאתִ֥י עָלַ֛/י קְלָלָ֖ה וְ/לֹ֥א בְרָכָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/012.yaml
  text: Perhaps my father will feel me[a], and I will seem to him like a deceiver[b], and I will bring a curse on myself and not a blessing.
translation:
  language: zh_hans
  text: 恐怕我父亲会摸我[a]，我在他眼中就像个骗子[b]；我会给自己招来咒诅，而不是祝福。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“触摸我”。原文动词指用手触摸、摸索；这里指以撒想借触觉确认雅各的身份。
    reason: lexical_alternative
  - marker: b
    text: 或译“戏弄人的人”或“使人受骗的人”。原文可指欺骗人、戏弄人或使人误入歧途的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: אוּלַי
  choice: 说不定
  rationale: 表达雅各担忧中的不确定可能性，现代汉语自然，也保留原文语气。
- source_word: יְמֻשֵּׁנִי
  choice: 会摸我
  rationale: משש指用手触摸、摸索或查验；上下文中以撒会借触觉确认雅各身份，“摸我”简洁准确。
- source_word: אָבִי
  choice: 我父亲
  rationale: 直接表达第一人称所属关系，符合现代汉语叙事用语。
- source_word: וְהָיִיתִי בְעֵינָיו
  choice: 看我像
  rationale: 将“在他眼中我会成为”这一希伯来语习语自然转达为他对雅各的看法，同时避免生硬直译。
- source_word: כִּמְתַעְתֵּעַ
  choice: 像个欺骗他的人
  rationale: 该词可指欺骗、戏弄或使人误入歧途者；本段核心是雅各冒充以扫欺骗父亲，译文保留欺骗之义，并以“他”明确动作所针对的对象。
- source_word: וְהֵבֵאתִי עָלַי
  choice: 给自己招来的
  rationale: 准确传达使某事临到自己、招致某种结果的使役含义，符合自然汉语。
- source_word: קְלָלָה
  choice: 咒诅
  rationale: 与本句及上下文中的“祝福”形成明确对照，也是圣经语境中稳定而庄重的表达。
- source_word: וְלֹא בְרָכָה
  choice: 就不是祝福，而是咒诅了
  rationale: 按汉语习惯调整对照次序，使“不是祝福，而是咒诅”自然有力，同时完整保留原文的否定与反差。
theological_decisions: []
translation_notes:
  register: 采用现代、清楚而庄重的叙事语言。“说不定”传达人物的忧虑；“给自己招来的就不是祝福，而是咒诅了”以自然汉语重现原文强烈对照。所有脚注标记均已置于正文。
