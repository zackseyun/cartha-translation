  text: וְ/עַתָּה֙ שָׂא נָ֣א כֵלֶ֔י/ךָ תֶּלְיְ/ךָ֖ וְ/קַשְׁתֶּ֑/ךָ וְ/צֵא֙ הַ/שָּׂדֶ֔ה וְ/צ֥וּדָ/ה לִּ֖/י צידה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/003.yaml
  text: Now then[b][a], please take your equipment—your quiver and your bow—and go out to the field and hunt game for me.
translation:
  language: zh_hans
  text: 现在，请带上你的装备[a]，就是箭囊和弓，到田野去，为我猎取野味[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“用具”。这个宽泛的词由后面的“箭囊和弓”进一步说明。
    reason: lexical_alternative
  - marker: b
    text: 或译“猎物”。原文指从野外猎取、用作食物的东西。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: 现在
  rationale: 既承接上文，又引出眼前的吩咐；现代汉语用“现在”自然简洁，无须机械译出连接词。
- source_word: שָׂא נָא
  choice: 请带上
  rationale: שָׂא在此指拿取并携带打猎用具；נָא带有请求或缓和命令语气的作用，译作“请”。
- source_word: כֵלֶיךָ
  choice: 你的装备
  rationale: כְּלִי是涵盖器具、用具或武器的宽泛词，后面的“箭囊和弓”将其具体说明；“装备”既自然，也不把词义过早限定为武器。
- source_word: תֶּלְיְךָ
  choice: 箭囊
  rationale: 该名词在此指悬挂携带的盛箭用具；“箭囊”符合打猎语境，也比直译“悬挂之物”清楚。
- source_word: וְקַשְׁתֶּךָ
  choice: 和弓
  rationale: קֶשֶׁת在此明确指弓；与“箭囊”并列。
- source_word: וְצֵא הַשָּׂדֶה
  choice: 到田野去
  rationale: שָׂדֶה可指田地或野外；此处是外出打猎的开阔地带。“到田野去”保留原文具体意象，并符合现代汉语表达。
- source_word: וְצוּדָה
  choice: 猎取
  rationale: 该动词表示狩猎或捕获猎物；“猎取”既体现行动，也能自然支配后面的“野味”。
- source_word: לִּי
  choice: 为我
  rationale: 保留受益对象，表明以撒要以扫替他取得猎物。
- source_word: צידה
  choice: 野味
  rationale: 在弓箭和田野的语境中，该词指狩猎所得、可供食用的猎物；“野味”比“鹿肉”宽泛准确，也比“食物”更能体现来源。
theological_decisions: []
