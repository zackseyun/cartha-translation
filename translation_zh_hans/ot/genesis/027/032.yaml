base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/032.yaml
  text: His father Isaac said to him[a], “Who are you?” And he said, “I am your son, your firstborn[b], Esau.”
translation:
  language: zh_hans
  text: 他的父亲以撒对他说[a]：“你是谁？”他说：“我是你儿子——你的长子以扫[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语原文的次序是“以撒，他的父亲”；正文按现代汉语习惯译作“他的父亲以撒”。
    reason: lexical_alternative
  - marker: b
    text: 或译“你的头生儿子”；原文强调出生次序，这一点在上下文中十分重要。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: אמר是普通的说话动词；虽然后接问句，中文用“说”引出直接引语自然准确，也不必解释性地译成“问”。
- source_word: לּוֹ
  choice: 对他说
  rationale: 介词ל加第三人称阳性单数后缀标明说话的对象，中文自然表达为“对他说”。
- source_word: יִצְחָק אָבִיו
  choice: 他父亲以撒
  rationale: 希伯来语字面次序为“以撒，他的父亲”；译作“他父亲以撒”符合现代汉语表达，同时保留亲属关系和说话者身份。
- source_word: מִי אַתָּה
  choice: 你是谁？
  rationale: 直接、自然地对应疑问词מִי和代词אַתָּה。
- source_word: אֲנִי
  choice: 我是
  rationale: 希伯来语名词句不明说系词；现代汉语在这里补出“是”最自然。
- source_word: בִּנְךָ
  choice: 你儿子
  rationale: בן加第二人称阳性单数后缀，直译为“你的儿子”；在并列自称中用“你儿子”更符合现代汉语。
- source_word: בְכֹרְךָ
  choice: 你的长子
  rationale: בכור指头生的儿子，并带有本叙事所强调的出生次序及长子权背景；“长子”在现代汉语中准确而庄重。
- source_word: עֵשָׂו
  choice: 以扫
  rationale: 采用现代中文圣经传统中通行的人名音译。
theological_decisions:
- issue: בְכֹרְךָ所含的出生次序与长子身份
  choice: 你的长子
  alternative: 你的大儿子／你的头生儿子
  rationale: “长子”既自然又能保留上下文中与长子名分相关的叙事意义，不将其弱化为单纯年龄较大，也不额外解释其法律或神学含义。
translation_notes:
  register: 采用自然、庄重、易懂的现代标准汉语。保留אמר为中性的“说”，不因引语是问句而改译为“问”；以“长子”保留בכור在叙事中的出生次序和长子身份含义。
