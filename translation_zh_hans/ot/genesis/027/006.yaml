  yaml_path: translation/ot/genesis/027/006.yaml
  text: And Rebekah said to Jacob her son[a], “Look, I heard your father speaking to Esau your brother, saying,”
translation:
  language: zh_hans
  text: 利百加对她儿子雅各说：“你看，我听见你父亲对你哥哥以扫说：”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/רִבְקָה
  choice: 利百加
  rationale: 叙事连接词וְ在中文中可由上下文自然承接，不必机械译作“于是”或“而”；人名按通行译名译为“利百加”。
- source_word: אָמְרָה אֶל יַעֲקֹב בְּנָהּ לֵאמֹר
  choice: 对她儿子雅各说
  rationale: 保留“雅各”与“她儿子”的同位关系；第一个לֵאמֹר用引号体现，避免重复译成“说道”。
- source_word: הִנֵּה
  choice: 你看
  rationale: 用于唤起对方注意，采用现代、自然的“你看”，比“看哪”更符合当代口语，又不把含义缩窄为单纯的“听”。
- source_word: שָׁמַעְתִּי
  choice: 我听见
  rationale: 完成式在此叙事语境中表示已经发生的听闻；“听见”也适合后接所听到的具体话语。
- source_word: אֶת אָבִיךָ מְדַבֵּר אֶל עֵשָׂו אָחִיךָ
  choice: 你父亲对你哥哥以扫说
  rationale: 中文以“听见某人对某人说”自然表达希伯来文“听见……正在讲话”的结构；保留“以扫”与“你哥哥”的身份说明。
- source_word: לֵאמֹר
  choice: 说：
  rationale: 末尾的לֵאמֹר引出下一节所载的内层引语，用冒号清楚标示引语层级，同时保留其引介话语的功能。
