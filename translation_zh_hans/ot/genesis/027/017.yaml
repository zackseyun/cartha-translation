  text: Then she put the tasty food and the bread that she had made into the hand of Jacob her son[a].
translation:
  language: zh_hans
  text: 她把做好的美味和饼交到她儿子雅各手里[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来原文直译为“交在她儿子雅各手中”，意思是她直接把这些食物交给他。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּתֵּן
  choice: 她把……交到……手里
  rationale: 该叙事动词推进事件；נתן与בְּיַד连用，表示把东西递交、放到某人手中。此译既自然，也保留具体动作。
- source_word: הַמַּטְעַמִּים
  choice: 美味
  rationale: 此词指特意烹制的可口食物；“美味”简洁自然，且不超出上下文具体说明食物种类。
- source_word: הַלֶּחֶם
  choice: 饼
  rationale: לֶחֶם在此指食用的饼；“饼”符合古代近东无酵或扁平面饼的通常表达，也避免现代汉语“面包”可能带来的特定形态联想。
- source_word: אֲשֶׁר עָשָׂתָה
  choice: 自己做好的
  rationale: 关系从句修饰前面的美味和饼；“做好的”自然体现这些食物在交付前已经备妥，“自己”明确希伯来语阴性单数主语仍是利百加。
- source_word: בְּיַד
  choice: 交到……手里
  rationale: 保留希伯来语单数“手”的具体意象，同时用现代汉语常见的交付表达传达其习语意义。
- source_word: יַעֲקֹב בְּנָהּ
  choice: 她儿子雅各
  rationale: 按现代汉语自然语序表达“雅各，她的儿子”，清楚保留亲属关系。
