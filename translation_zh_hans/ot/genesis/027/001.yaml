  text: וַ/יְהִי֙ כִּֽי זָקֵ֣ן יִצְחָ֔ק וַ/תִּכְהֶ֥יןָ עֵינָ֖י/ו מֵ/רְאֹ֑ת וַ/יִּקְרָ֞א אֶת עֵשָׂ֣ו בְּנ֣/וֹ הַ/גָּדֹ֗ל וַ/יֹּ֤אמֶר אֵלָי/ו֙ בְּנִ֔/י וַ/יֹּ֥אמֶר אֵלָ֖י/ו הִנֵּֽנִ/י־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/001.yaml
  text: It happened that when Isaac was old and his eyes were too dim to see[a], he called Esau his older son and said to him, “My son,” and he said to him, “Here I am.”
translation:
  language: zh_hans
  text: 以撒年老、眼睛昏花看不见的时候，就叫了他的大儿子以扫[a]来，对他说：“我儿！”以扫回答：“我在这里。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他的长子以扫”。
    reason: הַגָּדֹל可按兄弟间的相对年龄译为“大儿子”，也可结合以扫的身份译为“长子”。
lexical_decisions:
- source_word: וַיְהִי כִּי
  choice: ……的时候，就……
  rationale: 这是希伯来叙事中引出新场景及其时间背景的常用结构。用现代汉语的“……的时候，就……”自然承接事件，不额外加入原文没有的“有一天”或“现在”。
- source_word: זָקֵן
  choice: 年老
  rationale: 准确表达以撒已进入老年，措辞简明自然。
- source_word: וַתִּכְהֶיןָ עֵינָיו מֵרְאֹת
  choice: 眼睛昏花看不见
  rationale: כהה描述视力衰退，מֵרְאֹת表示在看见方面受到阻碍；此译既保留“眼睛昏花”的形象，也清楚表达不能看见的结果。
- source_word: וַיִּקְרָא
  choice: 叫了……来
  rationale: 此处指叫以扫到自己跟前；“叫……来”比单用“呼叫”更符合现代汉语语境，又不强化为正式的“召见”。
- source_word: אֶת־עֵשָׂו בְּנוֹ הַגָּדֹל
  choice: 他的大儿子以扫
  rationale: הַגָּדֹל在两兄弟的关系中指年长者。“大儿子”是自然的现代汉语表达，同时用脚注保留可译作“长子”的可能。
- source_word: בְּנִי
  choice: 我儿
  rationale: 保留第一人称所属后缀及父亲呼唤儿子的亲切、庄重语气。
- source_word: הִנֵּנִי
  choice: 我在这里
  rationale: 这是表示在场并愿意回应的固定用语；直译在现代汉语中仍清楚自然。
