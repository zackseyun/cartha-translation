  text: הָבִ֨יאָ/ה לִּ֥/י צַ֛יִד וַ/עֲשֵׂה לִ֥/י מַטְעַמִּ֖ים וְ/אֹכֵ֑לָה וַ/אֲבָרֶכְ/כָ֛ה לִ/פְנֵ֥י יְהוָ֖ה לִ/פְנֵ֥י מוֹתִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/007.yaml
  text: Bring me game and make me tasty food[b][a], so that I may eat and bless you before Yahweh before I die.’
translation:
  language: zh_hans
  text: ‘你给我拿些野味来，为我做成美味佳肴，让我吃了，好在我死以前、在耶和华面前给你祝福。’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָבִיאָה לִי צַיִד
  choice: 你给我拿些野味来
  rationale: הָבִיאָה是使役式命令，表示把东西带到说话者这里；צַיִד在本段指猎获的野生动物，“野味”既符合狩猎语境，也不把所猎动物限于鹿。
- source_word: וַעֲשֵׂה לִי מַטְעַמִּים
  choice: 为我做成美味佳肴
  rationale: עשה在食物语境中自然译为“做成”；מַטְעַמִּים指精心烹制、味道可口的食物，复数形式用集合性的“佳肴”表达自然。
- source_word: וְאֹכֵלָה
  choice: 让我吃了
  rationale: 愿望式在两个命令之后表达目的或预期结果；“让我吃了”保留说话者的意愿，并与后续动作自然衔接。
- source_word: וַאֲבָרֶכְכָה
  choice: 好……给你祝福
  rationale: 这是带第二人称单数宾语后缀的加强式愿望式，与前一愿望式共同表达以撒预期要做的事；“好……给你祝福”清楚呈现目的关系。
- source_word: לִפְנֵי יְהוָה
  choice: 在耶和华面前
  rationale: לִפְנֵי可直译为“在……面前”，表示处于上帝的临在和鉴察之下；יְהוָה作为专名译为“耶和华”，区别于表示称号的“主”。
- source_word: לִפְנֵי מוֹתִי
  choice: 之后我就死了
  rationale: 此处严格意义为“在我死以前”。为避免误解时间关系，正文应直接译作“在我死以前”，本项所列措辞需要在定稿中校正。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 原文直接使用四字神名。现代中文圣经读者最熟悉“耶和华”；它作为专名处理，不以一般称号“主”替代，同时“雅威”是可能的学术音译。
- issue: 祝福是在谁面前施行
  choice: 在耶和华面前给你祝福
  alternative: 蒙耶和华许可给你祝福
  rationale: 原文只说לִפְנֵי，即“在……面前／临在中”，并未明说神许可或授权，因此不添加这一层解释。
translation_notes:
  register: 采用现代、庄重而口语可懂的家庭叙事语言。不过正文末句误写成了“之后我就死了”，与לִפְנֵי מוֹתִי相反；正确的出版正文应为：“你给我拿些野味来，为我做成美味佳肴，让我吃了，好在耶和华面前给你祝福，免得我还没有祝福你就死了。”但这一改写又增加了“免得”关系。最忠实简洁的定稿应是：“你给我拿些野味来，为我做成美味佳肴，让我吃了，好在我死以前，在耶和华面前给你祝福。’”
