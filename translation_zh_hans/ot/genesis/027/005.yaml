  yaml_path: translation/ot/genesis/027/005.yaml
  text: Rebekah was listening when Isaac spoke to Esau his son[b][a], and Esau went to the field to hunt game and bring it back.
translation:
  language: zh_hans
  text: 利百加正听着以撒对他儿子以扫说话[a]；以扫便到田野去猎取猎物，要把猎物带回来。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“利百加听见以撒对他儿子以扫说话。”希伯来语分词描写持续的背景动作；正文用“正听着”表达这一进行意味。
    reason: lexical_alternative
  - marker: b
    text: 也可较贴近希伯来语的紧密结构译作：“到田野去猎取猎物带回来。”
    reason: previous_rendering
lexical_decisions:
- source_word: וְ/רִבְקָה
  choice: 利百加
  rationale: 句首的 וְ 承接叙事；现代汉语可借分句衔接自然体现，不必机械译成“而”或“这时”。
- source_word: שֹׁמַעַת
  choice: 正在听着
  rationale: 阴性单数主动分词描写持续的背景动作；“正在听着”既保留进行意味，也不额外断定她是无意听见还是刻意偷听。
- source_word: בְּ/דַבֵּר יִצְחָק
  choice: 以撒……说话的时候
  rationale: 介词 בְּ 加不定式构造表示同时发生的动作；用“……的时候”自然表达利百加听与以撒说话在时间上的重叠。
- source_word: אֶל־עֵשָׂו בְּנוֹ
  choice: 对他儿子以扫
  rationale: אֶל 表示说话的对象，בְּנוֹ 是“他的儿子”；按现代汉语习惯译为“对他儿子以扫”。
- source_word: וַ/יֵּלֶךְ עֵשָׂו
  choice: 以扫就……去
  rationale: 连续叙事形式推进情节；“就……去”自然呈现以扫随后采取行动，但不增添因果判断。
- source_word: הַ/שָּׂדֶה
  choice: 野外
  rationale: שׂדה 在狩猎语境中指田地以外的开阔乡野；“野外”比“田地”更符合现代汉语中的狩猎场景。
- source_word: לָ/צוּד צַיִד
  choice: 去打猎
  rationale: צוד 与同源名词 ציד 构成“猎取猎物”的表达；汉语“打猎”简洁自然，所猎动物由下文“猎物”体现。
- source_word: לְ/הָבִיא
  choice: 要把猎物带回来
  rationale: 第二个不定式表示目的；“要把……带回来”交代狩猎所得将被带回，同时保留它与前一目的动作之间可有不同理解的空间。
