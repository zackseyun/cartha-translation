base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/028.yaml
  text: May God give you some of the dew of heaven[a], and some of the richness of the earth, and an abundance of grain and new wine.
translation:
  language: zh_hans
  text: 愿上帝赐给你天上的甘露、大地的肥美[a]，以及丰盛的五谷和新酒。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“从天而来的甘露和大地的丰饶”。这里的希伯来语介词可表示从中所得的部分，或表示来源；“肥美”指土地肥沃、出产丰盛的农业意象。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִתֶּן
  choice: 愿……赐给
  rationale: 在以撒祝福的语境中，这一带连接词的未完成式表达祝愿；用“愿……赐给”既保留祝福话语的施行意味，也符合现代汉语表达。
- source_word: הָאֱלֹהִים
  choice: 上帝
  rationale: 此处虽带定冠词，但在希伯来语中作为对独一上帝的确定称谓使用；“上帝”是自然、庄重的普通话译法。
- source_word: מִטַּל הַשָּׁמַיִם
  choice: 天上的甘露
  rationale: 保留“天”与“露”的农业祝福意象。介词 מִן 在此可表达部分或来源关系，汉语正文不生硬加入“一些”，相关歧义在脚注说明。
- source_word: וּמִשְׁמַנֵּי הָאָרֶץ
  choice: 和大地的肥美
  rationale: שְׁמַנֵּי 字面与“肥厚、肥美”有关，在土地语境中指肥沃与丰饶；“大地的肥美”保留原文意象，同时仍为现代读者所能理解。
- source_word: וְרֹב
  choice: 又赐给你丰盛的
  rationale: רֹב 表示众多、充裕；“丰盛的”自然修饰后面的五谷与新酒。为使汉语句法顺畅而重复“赐给你”，没有增加新的语义。
- source_word: דָּגָן
  choice: 五谷
  rationale: דָּגָן 泛指谷物出产；“五谷”在现代汉语中自然地表达各类粮谷，并适合庄重的祝福语体。
- source_word: וְתִירֹשׁ
  choice: 和新酒
  rationale: תִּירוֹשׁ 通常指新酿的酒或作为农产的鲜酒，与一般的“酒”有所区别；“新酒”保留这一词汇区别。
theological_decisions:
- issue: 话语的性质
  choice: 译作祝愿：“愿上帝赐给你”
  alternative: 译作将来陈述：“上帝必赐给你”
  rationale: 动词形式及以撒正在祝福的上下文支持祝愿语气。此译法保留族长祝福作为当面宣告之祝愿的功能，不把它简化为一般未来预测。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“甘露”“肥美”“五谷”“新酒”保留诗性农业意象，但避免过度古雅。正文以汉语自然表达为优先，脚注保留介词关系及土地“肥美”意象可能产生的译法差异。
