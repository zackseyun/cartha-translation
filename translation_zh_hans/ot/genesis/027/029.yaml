id: GEN.27.29
reference: Genesis 27:29
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: יַֽעַבְד֣וּ/ךָ עַמִּ֗ים ו/ישתחו לְ/ךָ֙ לְאֻמִּ֔ים הֱוֵ֤ה גְבִיר֙ לְ/אַחֶ֔י/ךָ וְ/יִשְׁתַּחֲוּ֥וּ לְ/ךָ֖ בְּנֵ֣י אִמֶּ֑/ךָ אֹרְרֶ֣י/ךָ אָר֔וּר וּֽ/מְבָרֲכֶ֖י/ךָ בָּרֽוּךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/029.yaml
  text: Let peoples serve you[a], and nations bow down to you. Be master over your brothers, and let your mother's sons bow down to you. Cursed be those who curse you[b], and blessed be those who bless you.
translation:
  language: zh_hans
  text: 愿万民侍奉你，列国向你下拜[a]。愿你作你弟兄的主[b]；愿你母亲的儿子向你下拜。凡咒诅你的，愿他受咒诅；凡祝福你的，愿他蒙福。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “下拜”也可译作“俯伏致敬”。希伯来语可指在尊长面前俯伏，也可指敬拜上帝；这里的语境指向对人的臣服与尊敬。
    reason: lexical_alternative
  - marker: b
    text: “作……的主”也可译作“统管……”。这里的“主”指居于掌权地位的人，并非上帝的专称。
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַבְדוּךָ
  choice: 侍奉你
  rationale: עבד的Qal形式带第二人称阳性单数宾语后缀；在祝福语境中表示服事并归服于受祝福者。“侍奉”既保留服事之意，也能表达从属关系。
- source_word: עַמִּים
  choice: 万民
  rationale: 指多个民族或族群；“万民”是自然、庄重的中文集合表达，并与下句“列国”形成诗体平行。
- source_word: וְיִשְׁתַּחֲווּ לְךָ
  choice: 向你下拜
  rationale: 该动词表示俯伏、下拜，可用于对人或对上帝的举动。这里受礼者是家族祝福中的人，“下拜”保留具体动作而不擅自解释为敬拜。
- source_word: לְאֻמִּים
  choice: 列国
  rationale: 与עַמִּים近义平行，指各民族或国家群体；“列国”既符合诗体，又与“万民”形成自然变化。
- source_word: הֱוֵה גְבִיר
  choice: 愿你作……的主
  rationale: הוה加表语名词在此构成带祝愿色彩的命令式表达；גביר指居于支配地位的人。“作……的主”保留名词性表达和权柄关系，脚注说明其含义，避免误读为神名。
- source_word: לְאַחֶיךָ
  choice: 你弟兄的
  rationale: 介词ל与גביר连用，表达相对于弟兄居于主导或统治地位；中文以“作你弟兄的主”自然呈现这种关系。
- source_word: בְּנֵי אִמֶּךָ
  choice: 你母亲的儿子
  rationale: 直译这一亲属称谓，保留从较宽泛的“弟兄”转到同母之子的诗意重述，不笼统处理为“亲族”。
- source_word: אֹרְרֶיךָ אָרוּר
  choice: 凡咒诅你的，愿他受咒诅
  rationale: 前者是复数分词，后者为阳性单数谓语形式，可按逐一分配理解。“凡……愿他……”既保留这种数的张力，也呈现祝福宣告中的咒诅公式。
- source_word: וּמְבָרֲכֶיךָ בָּרוּךְ
  choice: 凡祝福你的，愿他蒙福
  rationale: 与上一分句严格平行；“蒙福”是自然庄重的中文，也保留复数施行者与单数谓语所形成的逐一分配表达。
theological_decisions:
- issue: 对人所行的俯伏动作是否译作敬拜
  choice: 向你下拜
  alternative: 向你致敬；敬拜你
  rationale: 希伯来语动词本身可指向上帝或向人俯伏。此处直接语境是以撒为雅各祝福，重点在民族与家族中的尊荣和权柄；“下拜”保留动作及其语义宽度，不把受礼者神化，也不削弱其臣服意味。
- issue: גְבִיר所表达的权柄称谓
  choice: 作你弟兄的主
  alternative: 统管你的弟兄；作你弟兄的主人
  rationale: 原文使用身份名词而非单纯的统治动词。“主”可保留其简练和庄重；脚注明确此处指掌权者，不将它当作上帝的专称。
- issue: 末尾咒诅与祝福公式的语气
  choice: 以“愿……”呈现祝愿性宣告
  alternative: “必受咒诅／必蒙福”
  rationale: 上下文是父亲所宣告的祝福，希伯来语名词性结构兼具宣告和祝愿色彩。“愿”保持这一语用张力，避免只译成确定预言。
translation_notes:
  register: 采用现代、庄重而易懂的祝福语体。以“万民／列国”和两次“向你下拜”保留希伯来诗歌的同义平行与重复；末两句用对称句式呈现咒诅与祝福公式。
