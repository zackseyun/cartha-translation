base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/018.yaml
  text: And as her life was departing—for she was dying—she called his name Ben-oni[b][a]; but his father called him Benjamin.
translation:
  language: zh_hans
  text: 当她的生命正在离去时——因为她正在死去——她给儿子起名叫便俄尼[a]；但他父亲给他起名叫便雅悯[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “便俄尼”可能意为“我忧伤之子”或“我苦难之子”。
    reason: lexical_alternative
  - marker: b
    text: “便雅悯”可能意为“右手之子”；也有人理解为“南方之子”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּצֵאת נַפְשָׁהּ
  choice: 她的生命即将逝去时
  rationale: נֶפֶשׁ在死亡语境中可指生命、活着的自我，也可译作“灵魂”。此处译为“生命”，既符合现代汉语表达，也避免把经文限定为对灵魂与身体关系的技术性陈述；ב加不定式结构按时间关系译出。
- source_word: כִּי מֵתָה
  choice: 因为她快要死了
  rationale: כִּי在这里说明前一句；完成式מֵתָה在叙事语境中描述她临死的状态，译作“快要死了”能体现起名发生在她生命逝去之际。
- source_word: וַתִּקְרָא שְׁמוֹ
  choice: 她给孩子起名叫
  rationale: 按现代汉语常用的命名表达翻译希伯来语“她称他的名”，并用“孩子”明确代词所指。
- source_word: בֶּן אוֹנִי
  choice: 便·俄尼
  rationale: 正文保留人名的音译，并以间隔号帮助读者辨认该复合名字的两个成分；名字可能具有“我忧患之子”或“我苦难之子”的含义，置于脚注说明。
- source_word: וְאָבִיו קָרָא לוֹ
  choice: 孩子的父亲却给他起名叫
  rationale: וְ在这里连接两个彼此对照的命名，故译作“却”；“孩子的父亲”比单用“他的父亲”指代更清楚。
- source_word: בִנְיָמִין
  choice: 便雅悯
  rationale: 采用现代中文圣经读者熟悉的人名译法；其可能的词源意义在脚注中保留。
theological_decisions:
- issue: 死亡语境中נֶפֶשׁ的人论含义
  choice: 正文译为“生命”，不译为“灵魂”
  alternative: 她的灵魂离去时
  rationale: 原词可以表示生命、活着的自我或生命气息，并不必然是在界定非物质灵魂如何离开身体。“生命”保留叙事重点，同时不排除相关神学讨论。
- issue: 两个名字的词源意义
  choice: 正文音译，脚注列出较可能的意义
  alternative: 在正文直接意译为“我忧患之子”和“右手之子”
  rationale: 二者都是人物名字，正文音译可保持叙事连贯；由于名字的意义与情节有关，脚注说明词源，同时保留“便雅悯”另一种可能解释。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“生命即将逝去”保持临终叙事的肃穆感；破折号保留原句解释性插入语的结构。“却”清楚呈现母亲与父亲两次命名之间的对照。
