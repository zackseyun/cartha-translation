source:
  edition: WLC
  text: וְ/נָק֥וּמָה וְ/נַעֲלֶ֖ה בֵּֽית אֵ֑ל וְ/אֶֽעֱשֶׂה שָּׁ֣ם מִזְבֵּ֗חַ לָ/אֵ֞ל הָ/עֹנֶ֤ה אֹתִ/י֙ בְּ/י֣וֹם צָֽרָתִ֔/י וַ/יְהִי֙ עִמָּדִ֔/י בַּ/דֶּ֖רֶךְ אֲשֶׁ֥ר הָלָֽכְתִּי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/003.yaml
  text: Let us rise and go up to Bethel[a], and there I will make an altar to the God who answered me in the day of my distress and was with me on the way that I went.
translation:
  language: zh_hans
  text: 我们起来，上伯特利去；我要在那里为那位在我遭难的日子应允我[a]、又在我所走的路上与我同在的上帝筑一座坛。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在我遭难的日子应允我”也可译作“那位应允我的上帝”，以保留希伯来文分词所可能表达的对上帝一般性或持续性的描述。
    reason: 保留הָעֹנֶה既可回指一次过去回应、也可表达特征性或持续行动的语法歧义。
lexical_decisions:
- source_word: וְנָק֥וּמָה וְנַעֲלֶ֖ה
  choice: 我们起来，上……去
  rationale: 两个第一人称复数鼓励式动词表达共同采取行动的劝勉；“起来，上……去”既保留意愿语气，也传达עלה的上行含义。
- source_word: בֵּֽית אֵ֑ל
  choice: 伯特利
  rationale: 作为地名采用现代中文圣经读者熟悉的音译，不在正文中意译为“上帝之家”。
- source_word: וְאֶֽעֱשֶׂה שָּׁ֣ם מִזְבֵּ֗חַ
  choice: 我要在那里……筑一座坛
  rationale: עשה本义宽泛，意为“做、造”；与“坛”搭配时，现代汉语以“筑坛”最自然，同时准确表达设立实体祭坛。
- source_word: לָאֵ֞ל
  choice: 为上帝
  rationale: 介词ל在此表示祭坛奉献或归属的对象；“为上帝筑坛”符合自然中文，并由后续关系从句明确所指。
- source_word: הָעֹנֶ֤ה אֹתִי֙
  choice: 他……应允了我
  rationale: 分词可表示特征性、持续性动作，也可在回顾语境中指向过去的回应；正文按雅各回顾特定困境译为过去事件，并以脚注保留一般或持续描述的可能。
- source_word: בְּי֣וֹם צָֽרָתִ֔י
  choice: 在我遭难的日子
  rationale: 保留“在……的日子”这一希伯来语时间表达，并用“遭难”自然传达צָרָה所含的困苦、危急之意。
- source_word: וַיְהִי֙ עִמָּדִ֔י
  choice: 也与我同在
  rationale: 直接表达过去旅途中上帝的临在；“也”使其与前一项作为并列描述自然衔接。
- source_word: בַּדֶּ֖רֶךְ אֲשֶׁ֥ר הָלָֽכְתִּי
  choice: 在我所走的路上
  rationale: 保留“道路”与“行走”的具体意象，同时符合现代汉语表达。
theological_decisions:
- issue: אֵל在雅各话语中的指称
  choice: 上帝
  alternative: 那位上帝
  rationale: 希伯来文的定冠词和后接分词短语共同限定所指。中文“上帝”配合后句“他……”已能明确指向那位曾回应并陪伴雅各的神；不额外加入可能显得对比性过强的“那位”。
- issue: 分词הָעֹנֶה的时间与体貌
  choice: 应允了我
  alternative: 应允我的／应允我
  rationale: 上下文回顾雅各从前遭难时的一次具体经历，过去完成的表达在中文中较清楚；但分词也可能描述上帝一贯或持续的作为，因此以脚注保留这一张力。
- issue: וַיְהִי עִמָּדִי所表达的神圣临在
  choice: 与我同在
  alternative: 一直与我同在
  rationale: 原文断言上帝在雅各所行之路上与他同在，但未明确加入“一直”所强调的全程持续性，故正文不作强化。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“我们起来，上伯特利去”保留原文劝勉与上行意象；“筑一座坛”符合中文惯用搭配。脚注标记置于整节末尾，所注对象由脚注文明确指出。
