  text: 以撒的年日共一百八十年。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译：“以撒的日子是一百年又八十年”；“日子”是指人的一生或寿命。
    reason: 说明原文以“日子”指寿命的惯用语，以及数字的原文表达方式。
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: 是
  rationale: 此处叙事形式用于陈述以撒寿命的总数；汉语以“是”自然连接主语与岁数。
- source_word: יְמֵי
  choice: 一生的年日
  rationale: “……的日子”是表示寿命的希伯来语惯用语；译作“一生的年日”既说明其所指，又保留原文以“日子”表达一生时日的色彩。
- source_word: יִצְחָק
  choice: 以撒
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: מְאַת שָׁנָה וּשְׁמֹנִים שָׁנָה
  choice: 一百八十岁
  rationale: 原文按“一百年和八十年”列出总数；中文在年龄陈述中自然合并为“一百八十岁”。
- source_word: שָׁנָה
  choice: 岁
  rationale: 这里是在陈述人的寿命，现代汉语用“岁”比逐字译作“年”更自然准确。
