  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וּ/בְנֵ֥י זִלְפָּ֛ה שִׁפְחַ֥ת לֵאָ֖ה גָּ֣ד וְ/אָשֵׁ֑ר אֵ֚לֶּה בְּנֵ֣י יַעֲקֹ֔ב אֲשֶׁ֥ר יֻלַּד ל֖/וֹ בְּ/פַדַּ֥ן אֲרָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/026.yaml
  text: 'And the sons of Zilpah[a], Leah’s servant: Gad and Asher[b]. These are the sons of Jacob who were born to him in Paddan-aram.'
translation:
  language: zh_hans
  text: 还有利亚的婢女悉帕所生的儿子：迦得和亚设。[a]这些都是雅各的儿子，是在巴旦·亚兰为他所生的。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “婢女”所译的希伯来词也可译作“女仆”或更直接的“女奴”，表示她在当时家庭中的从属身份。
    reason: lexical_alternative
  - marker: b
    text: 本节概括说这些儿子是在巴旦·亚兰为雅各所生的，但便雅悯后来是在迦南出生的（16—18节）。这里可能是在概括雅各于巴旦·亚兰建立家室的时期，而地点说明并不包括便雅悯。
    reason: cross_reference
lexical_decisions:
- source_word: וּבְנֵי זִלְפָּה
  choice: 还有……悉帕所生的儿子
  rationale: 延续上文的名单；“儿子”准确对应复数构造形式 בְנֵי。中文加入“所生”使悉帕与儿子的关系自然明确。
- source_word: שִׁפְחַת לֵאָה
  choice: 利亚的婢女
  rationale: שִׁפְחָה 指处于从属身份的女性仆役，也可能带有奴婢含义。“婢女”简洁保留性别和社会地位，同时避免把其身份淡化为一般佣人。
- source_word: גָּד וְאָשֵׁר
  choice: 迦得和亚设
  rationale: 采用现代中文圣经读者较熟悉的人名音译。
- source_word: אֵלֶּה בְּנֵי יַעֲקֹב
  choice: 这些都是雅各的儿子
  rationale: 直译总结句，保留“这些”所指范围以及 בְּנֵי 的男性后裔含义。
- source_word: אֲשֶׁר יֻלַּד לוֹ
  choice: 是……为他所生的
  rationale: 保留希伯来文被动表达及 לוֹ 的受益或关系指向，不擅自补出某一位母亲作主语。
- source_word: בְּפַדַּן אֲרָם
  choice: 在巴旦·亚兰
  rationale: 按专名处理，不采用词源性意译；间隔号清楚标示复合地名。
theological_decisions:
- issue: “在巴旦·亚兰为他所生”与便雅悯出生地点的表面张力
  choice: 正文照原文保留概括性地点陈述，并以脚注提示叙事张力
  alternative: 在正文中改写为“除便雅悯以外，都是在巴旦·亚兰为他所生的”
  rationale: 原文没有明说例外；创世记35:16–18却明确记载便雅悯生于迦南途中。译文不应擅自消除这一张力。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。“婢女”比“使女”更易为现代读者理解，又保留原词所表达的女性与从属身份。正文保持希伯来文的被动概括句，不在译文中补入原文没有的例外。
