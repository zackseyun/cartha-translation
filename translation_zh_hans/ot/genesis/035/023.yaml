base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/023.yaml
  text: 'The sons of Leah: Jacob’s firstborn[a], Reuben, Simeon, Levi, Judah, Issachar, and Zebulun.'
translation:
  language: zh_hans
  text: 利亚的儿子是：雅各的长子[a]吕便、西缅、利未、犹大、以萨迦和西布伦。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 较为直译：“雅各的头生者吕便”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי לֵאָה
  choice: 利亚的儿子
  rationale: בְּנֵי 是 בֵּן 的复数构造形，本节列举利亚所生的六个男性后代；译作“儿子”直接、准确。
- source_word: בְּכוֹר יַעֲקֹב
  choice: 雅各的长子
  rationale: 该构造短语修饰吕便，表明他是雅各的头生子。“长子”是现代汉语中自然且庄重的表达；脚注保留更贴近“头生者”概念的译法。
- source_word: רְאוּבֵן
  choice: 吕便
  rationale: 采用现代中文圣经中通行的人名译法。
- source_word: שִׁמְעוֹן
  choice: 西缅
  rationale: 采用现代中文圣经中通行的人名译法。
- source_word: לֵוִי
  choice: 利未
  rationale: 采用现代中文圣经中通行的人名译法。
- source_word: יְהוּדָה
  choice: 犹大
  rationale: 采用现代中文圣经中通行的人名译法。
- source_word: יִשָּׂשכָר
  choice: 以萨迦
  rationale: 采用现代中文圣经中通行的人名译法。
- source_word: זְבוּלֻן
  choice: 西布伦
  rationale: 采用现代中文圣经中通行的人名译法。
- source_word: וְ / וּ
  choice: 和
  rationale: 希伯来文在名单各项前反复使用连接词；现代汉语通常只在末项前译出“和”，既保留并列关系，也避免生硬重复。
theological_decisions:
- issue: בְּכוֹר יַעֲקֹב 与 רְאוּבֵן 的句法关系
  choice: 将“雅各的长子”理解为“吕便”的同位说明
  alternative: 把“雅各的长子”视为名单中独立的一项
  rationale: 希伯来语的词序和上下文均表明吕便就是雅各的长子；采用同位结构，不增加额外人物，也不改变经文的家谱信息。
translation_notes:
  register: 采用自然、庄重的现代标准普通话。冒号引出名单；人名使用简体中文圣经传统中广为人知的译名。正文以“长子”求自然，脚注呈现更形式对应的译法。
