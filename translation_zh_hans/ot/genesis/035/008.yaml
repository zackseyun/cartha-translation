base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/008.yaml
  text: And Deborah[a], Rebekah’s nurse, died, and she was buried below Bethel, under the oak[b]. So he called its name Allon-bacuth.
translation:
  language: zh_hans
  text: 利百加的乳母底波拉死了；她被葬在伯特利下方那棵橡树[a]底下。他就给那棵树起名叫“亚伦·巴古”[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “橡树”所译的希伯来语词也可能指笃耨香树；确切树种无法确定。
    reason: lexical_alternative
  - marker: b
    text: “亚伦·巴古”很可能意为“哀哭之橡树”；若前一个词指笃耨香树，也可理解为“哀哭之笃耨香树”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵינֶקֶת
  choice: 奶母
  rationale: 该词指曾给孩子哺乳并照料孩子的女子。“奶母”在现代汉语中简洁自然，也符合底波拉长期服侍利百加的身份；“乳母”较为书面。
- source_word: מִתַּחַת לְבֵית אֵל
  choice: 在伯特利下方
  rationale: 保留原文相对于伯特利地势较低或位于其下方的空间含义，不擅自解释为“南边”。
- source_word: תַּחַת הָאַלּוֹן
  choice: 一棵橡树底下
  rationale: תַּחַת意为“在……底下”；אַלּוֹן通常可译为“橡树”，但树种并不完全确定，另一可能译法在脚注说明。希伯来语带定冠词，汉语此处首次提及该树，用“一棵”更自然。
- source_word: וַתִּקָּבֵר
  choice: 葬在
  rationale: 原文为尼法勒式，表达被动意义；汉语“葬在”无需补出执行安葬的人，也自然保留了原文的被动语义。
- source_word: וַיִּקְרָא שְׁמוֹ
  choice: 他就给那棵树起名叫
  rationale: 原文动词为第三人称阳性单数主动式，主语承接上下文而未在本节明说，因此译作“他”；阳性单数代词后缀最自然地回指前述的树。
- source_word: אַלּוֹן בָּכוּת
  choice: 亚伦·巴古
  rationale: 正文音译这个专名，以保留其名称形式；其可理解的词义在脚注中说明。
- source_word: וַתָּמָת
  choice: 死了
  rationale: 直接对应原文“死”，不使用弱化语气的委婉表达。
theological_decisions:
- issue: 起名者的身份
  choice: 使用“他”，不在正文明确补作“雅各”
  alternative: 译作“雅各就给那棵树起名”或“有人给它起名”
  rationale: 希伯来语明确使用第三人称阳性单数主动动词，但本节没有明说主语。译作“他”既保留语法信息，也避免把上下文推定的雅各直接写入正文；“有人”则会削弱原文明确的单数阳性形式。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“利百加”“底波拉”“伯特利”沿用通行中文圣经人名地名；“亚伦·巴古”按希伯来语音译，并用脚注交代名称含义。
