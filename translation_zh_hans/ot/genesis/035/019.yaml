  text: So Rachel died and was buried on the way to Ephrath (that is[a], Bethlehem).
translation:
  language: zh_hans
  text: 拉结死了，葬在通往以法他[a]的路上（即伯利恒）。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “以法他”也可译作“以法拉他”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּמָת
  choice: 死了
  rationale: מות在此直指肉身死亡；“死了”直接、自然，不采用委婉说法。
- source_word: רָחֵל
  choice: 拉结
  rationale: 采用现代中文圣经中通行的人名译法。
- source_word: וַתִּקָּבֵר
  choice: 葬在
  rationale: קבר的尼法勒形表达被动意义；中文用“葬在”自然体现“被安葬”，且不增添原文没有的“那里”。
- source_word: בְּדֶרֶךְ
  choice: 通往……的路上
  rationale: בְּדֶרֶךְ表示处于行程或道路之上；结合后接的地名方向词，译为“通往……的路上”符合现代汉语。
- source_word: אֶפְרָתָה
  choice: 以法他
  rationale: 采用该地名在现代中文圣经中的通行音译；词尾־ָה在此可反映方向意义，也可能被理解为地名形式。
- source_word: הִוא
  choice: 就是
  rationale: 阴性代词在此具有同位解释作用，将以法他与伯利恒对应起来；“就是”简明自然。
- source_word: בֵּית לָחֶם
  choice: 伯利恒
  rationale: 采用现代中文圣经中通行的地名译法。
