base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/027.yaml
  text: And Jacob came to Isaac his father at Mamre[a], Kiriath-arba (that is, Hebron), where Abraham and Isaac had sojourned.
translation:
  language: zh_hans
  text: 雅各来到他父亲以撒那里，就是在幔利、基列·亚巴（即希伯仑）；亚伯拉罕和以撒曾在那里寄居[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “寄居”指以外来者或暂住者的身份居住，并非仅指一般的居住。
    reason: lexical_clarification
lexical_decisions:
- source_word: וַיָּבֹא
  choice: 来到
  rationale: בוא可表示“来、去、到达”；叙事视角聚焦雅各抵达以撒所在之处，用“来到”自然且忠实。
- source_word: אֶל יִצְחָק אָבִיו
  choice: 来到他父亲以撒那里
  rationale: 保留“他父亲”这一亲属说明，并以现代汉语自然表达方向关系。
- source_word: מַמְרֵא
  choice: 幔利
  rationale: 地名按中文圣经通行译名音译。
- source_word: קִרְיַת הָאַרְבַּע
  choice: 基列·亚巴
  rationale: 作为地名音译，并以间隔号清楚标示复合专名；不直接意译为“亚巴城”，以保留地名性质。
- source_word: הִוא חֶבְרוֹן
  choice: （就是希伯仑）
  rationale: 原文用代词加地名作解释性辨认；“就是希伯仑”符合现代汉语表达。
- source_word: אֲשֶׁר ... שָׁם
  choice: 在那里
  rationale: 关系词与地点副词合并为自然的汉语地点关系表达。
- source_word: גָּר
  choice: 寄居
  rationale: גור指以外来者或暂住者身份居住，不只是一般意义的“住”；“寄居”准确保留这一语义。
- source_word: אַבְרָהָם וְיִצְחָק
  choice: 亚伯拉罕和以撒
  rationale: 采用中文圣经中通行的人名译法。
