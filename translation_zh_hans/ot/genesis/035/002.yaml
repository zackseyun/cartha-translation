  source_fidelity: 译文准确传达了希伯来文的叙述与三项命令。“他的家人”合乎此处בֵּיתוֹ指家庭共同体的语境；“所有跟他在一起的人”准确表达כָּל אֲשֶׁר עִמּוֹ。“除掉你们中间的外族神明、洁净自己、更换衣服”分别保留了移除、反身洁净及更换衣物的命令力度与次序。
  naturalness: 整体为自然、清楚而庄重的现代普通话。“你们要……”恰当地表达连续的复数命令；“更换衣服”通顺。“外族神明”虽较书面，仍属可理解且适合经文语域的表达。
  terminology: “外族神明”在正文中保留了אֱלֹהֵי הַנֵּכָר的外来／外族归属含义，脚注也提供“外来的神明”及“外族人的神”等合理替代。“洁净自己”保留וְהִטַּהֲרוּ可能具有的礼仪性，不将其缩窄为身体洗涤；脚注对其预备亲近上帝的可能性说明适度，未越过经文。脚注锚点位置明确且与英文审校轨迹相符。
