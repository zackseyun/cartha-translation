  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יַעֲקֹב֙ אֶל בֵּית֔/וֹ וְ/אֶ֖ל כָּל אֲשֶׁ֣ר עִמּ֑/וֹ הָסִ֜רוּ אֶת אֱלֹהֵ֤י הַ/נֵּכָר֙ אֲשֶׁ֣ר בְּ/תֹכְ/כֶ֔ם וְ/הִֽטַּהֲר֔וּ וְ/הַחֲלִ֖יפוּ שִׂמְלֹתֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/002.yaml
  text: Then Jacob said to his household and to all who were with him[a], “Put away the foreign gods that are among you, purify yourselves[b], and change your clothes.”
translation:
  language: zh_hans
  text: 雅各对他的家人和所有跟他在一起的人说：“你们要除掉你们中间的外族神明[a]，洁净自己[b]，更换衣服。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “外族神明”也可译作“外来的神明”或“外族人的神”。
    reason: lexical_alternative
  - marker: b
    text: “洁净自己”可能指为亲近上帝而作礼仪上的洁净预备。
    reason: cultural_note
lexical_decisions:
- source_word: בֵּיתוֹ
  choice: 他的家人
  rationale: 这里的“家”指雅各家庭共同体中的成员，并非房屋；“家人”自然地表达这一群体含义。
- source_word: כָּל אֲשֶׁר עִמּוֹ
  choice: 所有跟他在一起的人
  rationale: 按上下文指与雅各同行、同住的众人；此译明确为人，同时贴近原文。
- source_word: הָסִרוּ
  choice: 除掉
  rationale: 该命令要求把这些神像或异教崇拜对象从群体中移除；“除掉”保留命令的力度，又不额外说明处置方式。
- source_word: אֱלֹהֵי הַנֵּכָר
  choice: 外族神明
  rationale: 原构词可指外族人的神或外来的神明；“外族神明”既清楚表明其与雅各所敬拜之神有别，也保留与外族归属相关的含义。
- source_word: בְּתֹכְכֶם
  choice: 你们中间的
  rationale: 原文意为“在你们中间”，可能兼指群体中的存在和个人持有；此译不把含义缩窄为仅仅“拥有”。
- source_word: וְהִטַּהֲרוּ
  choice: 洁净自己
  rationale: 反身形式要求众人使自己洁净；措辞可涵盖礼仪性洁净，也不排除更广的属灵与群体预备。
- source_word: וְהַחֲלִיפוּ
  choice: 更换
  rationale: 与衣服搭配时表示换掉原有衣物；“更换衣服”自然且保留动作的完整性。
- source_word: שִׂמְלֹתֵיכֶם
  choice: 衣服
  rationale: 指衣物，可能尤其涉及外衣；现代汉语用“衣服”明白自然，不必使用较古雅的“衣裳”。
theological_decisions:
- issue: 洁净命令的性质
  choice: 译作“洁净自己”，保留礼仪或盟约性预备的可能
  alternative: 译作“把自己洗干净”，理解为单纯身体清洗
  rationale: 上下文是除掉外族神明并预备前往敬拜上帝，因此命令很可能带有礼仪意义；但经文本节未交代具体洁净程序，所以不把它限定为洗澡或某套仪式。
- issue: אֱלֹהֵי הַנֵּכָר 的归属含义
  choice: 译作“外族神明”
  alternative: 译作“外来的神明”或“异神”
  rationale: 原文可理解为“外族人的神明”，也可强调相对于应当敬拜之神的异质性；正文采用自然而较贴近构词关系的表达，并以脚注保留其他理解。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“家人”表达家庭共同体，“外族神明”避免“外国神”等可能显得地缘政治化的现代联想；命令句使用“要”体现明确而自然的训令语气。
