base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/013.yaml
  text: Then God went up from him in the place where he had spoken with him[a].
translation:
  language: zh_hans
  text: 神在与他交谈的地方从他那里升上去了。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“从他那里上去了。”原文保留了神离开这次相遇时向上移动的图景。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: 升上去了
  rationale: Qal形式的עלה通常表示“上去、升上去”。这里描述神在向雅各显现后离开；译作“升上去了”既保留原文明确的向上动态，也符合现代汉语叙事表达。
- source_word: מֵעָלָיו
  choice: 从他那里
  rationale: 该形式字面带有“从他上方、从他身上”的空间意味；在本处译为“从他那里”较自然，并与“升上去”共同保留神离开雅各的空间图景。
- source_word: אֱלֹהִים
  choice: 神
  rationale: 该词形式上为复数形态，但本句搭配单数动词，叙事中指独一的神，因此译为“神”。
- source_word: בַּמָּקוֹם
  choice: 就在……的地方
  rationale: 介词ב与מקום表示事件发生的位置。用“就在……的地方”自然传达“在那地方”，并突出神是在先前交谈之处升上去的。
- source_word: אֲשֶׁר
  choice: ……的地方
  rationale: 关系词承接“地方”，汉语宜将关系从句前置，构成“与他交谈的地方”，比逐字译出关系代词更自然。
- source_word: דִּבֶּר אִתּוֹ
  choice: 与他交谈
  rationale: דבר的Piel形式与אֵת连用，表示“与某人说话”。“与他交谈”保留双向接触的表达，不把它弱化为单纯“对他说话”；上下文清楚表明主语是神、宾语是雅各。
theological_decisions:
- issue: 神离开时拟人化、空间化的描写
  choice: 保留“从他那里升上去了”的垂直运动语言
  alternative: 神就离开了他／神就从他那里退去了
  rationale: 原文使用普通的“上去、升上去”一词。保留这一空间图景，忠实呈现神显现后离开的叙事方式，同时不对神临在的性质作文本之外的哲学解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“升上去了”比单用“离开了”更贴近希伯来文，又比“升天了”少作一层目的地推断。脚注标记已在正文中列出。
