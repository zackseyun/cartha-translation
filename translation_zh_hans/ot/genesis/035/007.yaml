base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/007.yaml
  text: There he built an altar and called the place El-bethel[a], because there God had revealed himself to him when he fled from his brother.
translation:
  language: zh_hans
  text: 他在那里筑了一座坛，把那地方叫作伊勒·伯特利[a]，因为他逃避他兄弟的时候，神曾在那里向他显现。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “伊勒·伯特利”可能意为“伯特利的神”。
    reason: 说明音译地名 אֵל בֵּית אֵל 的可能词义，同时保留其作为地点名称的功能。
lexical_decisions:
- source_word: וַיִּבֶן שָׁם מִזְבֵּחַ
  choice: 他在那里筑了一座坛
  rationale: 按希伯来叙事句式直译其核心意义；“筑坛”是现代中文圣经语体中自然、庄重且易懂的表达。
- source_word: וַיִּקְרָא לַמָּקוֹם
  choice: 把那地方叫作
  rationale: 准确表达 קרא 与地点宾语构成的命名行为；“叫作”比“称呼为”更自然。
- source_word: אֵל בֵּית אֵל
  choice: 伊勒·伯特利
  rationale: 该短语在句中是雅各给地点所起的名称，因此正文音译；其可能含义在脚注说明。
- source_word: כִּי שָׁם
  choice: 因为……在那里
  rationale: כִּי 引出命名的原因，并保留 שָׁם 与句首“在那里”的呼应。
- source_word: נִגְלוּ אֵלָיו הָאֱלֹהִים
  choice: 神曾……向他显现
  rationale: נִגְלוּ 是 גלה 的尼法勒式，在此表达神的显现或自我彰显；中文“向他显现”自然保留此义。“曾”标明这是此前发生的事件。
- source_word: בְּבָרְחוֹ מִפְּנֵי אָחִיו
  choice: 他逃避哥哥的时候
  rationale: בְּ 加不定词结构表示时间背景；מִפְּנֵי 在逃离语境中表示躲避、逃离。“逃避哥哥”既传达威胁背景，也符合现代中文表达。
theological_decisions:
- issue: אֱלֹהִים 与复数形式动词 נִגְלוּ 的数不一致及其所指
  choice: 按上下文译为单数“神……向他显现”
  alternative: 形式上译成复数“众神向他显现”
  rationale: 上下文指雅各在伯特利所遇见的那一位神。虽然希伯来文动词为复数形式，但中文若译为复数会造成多神含义，偏离叙事语境；因此按实际所指采用单数，同时不附加关于复数形式成因的推测。
- issue: אֵל בֵּית אֵל 是地名还是释义性短语
  choice: 正文保留为音译地名“伊勒·伯特利”
  alternative: 正文意译为“伯特利的神”
  rationale: 句法明确说雅各给那地方命名，因此正文呈现专名功能；其词义可能为“伯特利的神”，另以脚注保存。
translation_notes:
  register: 采用现代、庄重而通顺的普通话书面语。“筑了一座坛”保留传统圣经语汇但不显陈旧；“叫作”与“显现”清晰易懂。专名采用中点分隔复合音译。
