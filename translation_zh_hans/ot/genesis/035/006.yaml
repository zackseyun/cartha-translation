base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/006.yaml
  text: So Jacob came to Luz (that is[a], Bethel), which is in the land of Canaan, he and all the people who were with him.
translation:
  language: zh_hans
  text: 于是，雅各和所有跟他在一起的人都到了迦南地的路斯（也就是伯特利）[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文保留地名“路斯”，并说明这地方就是“伯特利”。
    reason: cross_reference
lexical_decisions:
- source_word: וַיָּבֹא
  choice: 到了
  rationale: בוא在此表示抵达目的地；“到了”符合现代汉语叙事习惯，也清楚表达向该地移动并抵达。
- source_word: לוּזָה
  choice: 路斯
  rationale: לוּז为地名，“路斯”采用通行译名；词尾表示方向的־ָה由汉语动词结构“到了”体现，无须音译。
- source_word: אֲשֶׁר בְּאֶרֶץ כְּנַעַן
  choice: 迦南地的
  rationale: 关系从句说明路斯位于迦南地；汉语用前置定语表达更自然，同时保留地理限定。
- source_word: הִוא בֵּית אֵל
  choice: 也就是伯特利
  rationale: 阴性代词הִוא回指路斯，后接地名作解释性同位语，表明路斯即伯特利；“也就是”自然传达这种辨认说明。
- source_word: הוּא וְכָל הָעָם אֲשֶׁר עִמּוֹ
  choice: 雅各和所有跟他在一起的人
  rationale: 独立代词הוּא重新提出并略微强调雅各，再把同行者包括在内；汉语将这一并列主语前置，可避免生硬重复而不改变所指。
- source_word: הָעָם
  choice: 人
  rationale: עָם在本节指随雅各同行的一群人，并非特指一个民族；译为“人”比“百姓”或“民族”更合语境。
