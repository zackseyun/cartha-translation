  yaml_path: translation/ot/genesis/035/020.yaml
  text: And Jacob set up a pillar over her grave[a]. It is the pillar of Rachel’s grave to this day.
translation:
  language: zh_hans
  text: 雅各在她的坟上立了一根石柱[a]。这就是拉结坟墓的石柱，直到今日仍在。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“立了一块墓碑”，或“立了一根标记拉结坟墓的石柱”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּצֵּב
  choice: 立了
  rationale: 使役词形在这里表示把某物竖立起来；“立了”简洁自然，也与“石柱”搭配。
- source_word: מַצֵּבָה
  choice: 一根石柱
  rationale: 该名词指竖立的石块或柱石；“石柱”保留具体形象，不预先把功能限定为纪念碑。
- source_word: עַל קְבֻרָתָהּ
  choice: 在她的坟上
  rationale: עַל 表示相对于坟墓的位置；“在……上”贴近原文，而“坟”准确表达埋葬处，不暗示宏大的墓室。
- source_word: הִוא
  choice: 这就是
  rationale: 阴性代词回指前面的石柱，并引出对其身份的说明；汉语用“这就是”衔接自然。
- source_word: מַצֶּבֶת קְבֻרַת רָחֵל
  choice: 拉结坟前的石柱
  rationale: 保留石柱与拉结坟墓之间的限定关系，同时用自然汉语表明它是坟墓的标志物；“坟前”不强求石柱恰在遗体正上方。
- source_word: עַד הַיּוֹם
  choice: 直到今日还在
  rationale: 该习语表示持续到叙述者所处的时代；补出“还在”使现代汉语句义完整，而不改变其时间含义。
theological_decisions: []
