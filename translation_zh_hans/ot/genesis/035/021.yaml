  text: Then Israel journeyed on and pitched his tent beyond Migdal-eder[a].
translation:
  language: zh_hans
  text: 以色列继续前行，越过米得勒·以得[a]，支搭帐篷。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “米得勒·以得”意为“羊群塔”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסַּע
  choice: 继续前行
  rationale: נסע在连续叙事中表示拔营上路、继续行程；“继续前行”自然体现动作的推进和叙事次序。
- source_word: יִשְׂרָאֵל
  choice: 以色列
  rationale: 希伯来文本在此使用“以色列”这一名字，因此照原文保留，不改作“雅各”。
- source_word: וַיֵּט
  choice: 支搭
  rationale: נטה以“帐篷”为宾语时，惯常表示把帐篷支搭起来；“支搭帐篷”是现代汉语圣经语境中自然且准确的搭配。
- source_word: אָהֳלֹה
  choice: 帐篷
  rationale: 该词为“帐篷”并带第三人称阳性单数后缀。汉语在主语明确时通常不必另译“他的”，可避免累赘而不损失所指。
- source_word: מֵהָלְאָה
  choice: 那边
  rationale: 该副词短语表示位于某参照点更远处或越过去的地方；结合后接地标的结构，“在……那边”保留其空间关系，同时避免误把方位说得过于确定。
- source_word: לְמִגְדַּל עֵדֶר
  choice: 米得勒·以得
  rationale: 此处整体作为地名使用，采用音译；其字面意义“羊群塔”置于脚注说明。
theological_decisions: []
