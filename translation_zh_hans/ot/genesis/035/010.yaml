source:
  edition: WLC
  text: וַ/יֹּֽאמֶר ל֥/וֹ אֱלֹהִ֖ים שִׁמְ/ךָ֣ יַעֲקֹ֑ב לֹֽא יִקָּרֵא֩ שִׁמְ/ךָ֨ ע֜וֹד יַעֲקֹ֗ב כִּ֤י אִם יִשְׂרָאֵל֙ יִהְיֶ֣ה שְׁמֶ֔/ךָ וַ/יִּקְרָ֥א אֶת שְׁמ֖/וֹ יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/010.yaml
  text: And God said to him[a], “Your name is Jacob. Your name will no longer be called Jacob, but Israel will be your name.” So he called his name Israel.
translation:
  language: zh_hans
  text: 神对他说：“你的名字是雅各。你的名字将不再称为雅各，以色列将是你的名字。”于是，神给他起名叫以色列[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“神称他为以色列。”希伯来文较直译为：“他称他的名为以色列。”
    reason: 说明原文命名公式的字面结构，并提供较简洁的译法。
lexical_decisions:
- source_word: אֱלֹהִים
  choice: 神
  rationale: 虽然词形为复数形式，但本句搭配单数动词，所指明确是独一的神；“神”是现代汉语中准确、自然的译法。
- source_word: שִׁמְךָ
  choice: 你的名字
  rationale: 直接译出名词及第二人称阳性单数后缀，并保留原文的重复，以体现正式更名宣告的语气。
- source_word: לֹא יִקָּרֵא ... עוֹד
  choice: 将不再称为
  rationale: 准确表达קרא的被动命名含义及לֹא ... עוֹד所表示的“不再”，同时避免把陈述误译成命令。
- source_word: כִּי אִם
  choice: （不用单独译词，以前后分句的对比表达）
  rationale: 该结构表示排除和替代；汉语以“将不再……，……将是……”自然呈现“不是雅各，而是以色列”的对比。
- source_word: יִשְׂרָאֵל יִהְיֶה שְׁמֶךָ
  choice: 以色列将是你的名字
  rationale: 保留原文把新名字“以色列”置于句首的强调，同时符合庄重、清楚的现代汉语。
- source_word: וַיִּקְרָא אֶת־שְׁמוֹ יִשְׂרָאֵל
  choice: 于是，神给他起名叫以色列
  rationale: 以自然汉语表达希伯来语的命名公式；根据紧邻上文明确的主语“神”，将省略的主语译明，避免汉语代词指向含混。
- source_word: יַעֲקֹב
  choice: 雅各
  rationale: 采用现代中文圣经传统中通行的人名音译。
- source_word: יִשְׂרָאֵל
  choice: 以色列
  rationale: 采用现代中文圣经传统中通行的人名音译。
theological_decisions:
- issue: 正式更名宣告是否表示旧名在此后叙事中绝对废止
  choice: 你的名字将不再称为雅各，以色列将是你的名字
  alternative: 以后不要再叫雅各，只要叫以色列
  rationale: 原文以正式宣告的强度陈述更名，但后文仍使用“雅各”这一名字。译文保留原话的张力，不把它弱化，也不加入调和性解释。
- issue: 末句省略主语的身份
  choice: 神给他起名叫以色列
  alternative: 他给他起名叫以色列
  rationale: 希伯来语动词为第三人称单数，最近的明确主语是“神”；汉语若连续使用两个“他”会产生不必要的指代歧义，因此译明为“神”，并未改变原文所指。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“将不再称为”保留被动命名结构及未来宣告语气；末句用“给他起名叫”使汉语自然，并将脚注标记置于其所说明的命名公式之后。
