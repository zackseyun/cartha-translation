revisions:
- from: 他们从伯特利出发。离以法他[a]还有一段路程时，拉结生孩子，生产十分艰难。
  to: 他们从伯特利出发；离以法他还有一段路程时，拉结分娩，过程十分艰难。
  rationale: 删除不可靠的“以法大”异译脚注，并作轻微文体调整。其余译法忠实保留原文对剩余路程的非精确表达及分娩艰难的叙述。
