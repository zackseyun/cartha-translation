base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/016.yaml
  text: Then they journeyed from Bethel[a], and when there was still some distance to go before reaching Ephrath, Rachel gave birth, and she had difficulty in childbirth.
translation:
  language: zh_hans
  text: 他们从伯特利出发；离以法他还有一段路程时，拉结分娩，过程十分艰难。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: 他们……出发
  rationale: נסע在叙事中常指拔营启程；“出发”自然简洁，也保留继续行程的含义。
- source_word: מִבֵּית אֵל
  choice: 从伯特利
  rationale: 采用该地名在现代中文圣经传统中的通行译名。
- source_word: וַיְהִי עוֹד כִּבְרַת הָאָרֶץ
  choice: 还有一段路程时
  rationale: כִּבְרַת הָאָרֶץ是罕见的距离表达，具体长度不明；“一段路程”既传达尚有距离，也不引入原文没有的精确单位。
- source_word: לָבוֹא אֶפְרָתָה
  choice: 离以法他……时
  rationale: לָבוֹא表示前往并到达目的地；结合前面的距离表达，译为“离……还有一段路程时”符合现代汉语，并明确尚未抵达。
- source_word: אֶפְרָתָה
  choice: 以法他
  rationale: 采用中文中较通行的地名音译；希伯来语形式也可按较长形式音译，故以脚注保留另一译法。
- source_word: וַתֵּלֶד רָחֵל
  choice: 拉结生孩子
  rationale: ילד以女性为主语时指分娩；“生孩子”是清楚、自然的现代汉语。
- source_word: וַתְּקַשׁ בְּלִדְתָּהּ
  choice: 生产十分艰难
  rationale: קשה在此表示分娩过程困难、艰苦；该译法直接传达严重困难，而不添加原文未明说的细节。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。将罕见的距离短语作非精确表达，以保留原文的不确定性；句号分开启程与途中生产两层叙事，使中文清晰自然。英文咨询层的脚注标记显然误置在“Bethel”之后；本稿按脚注内容将[a]置于“以法他”之后。
