  yaml_path: translation/ot/genesis/035/025.yaml
  text: 'And the sons of Bilhah[a], Rachel’s female servant: Dan and Naphtali.'
translation:
  language: zh_hans
  text: 拉结的婢女[a]辟拉所生的儿子是但和拿弗他利。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“女仆”。希伯来语这个词指社会地位较低的女性仆役；在某些语境中也可含“女奴”之意。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: 所生的儿子是
  rationale: בְנֵי是“儿子”的复数附属形式，在家谱名单中引出下一组人物；结合汉语语序译为“所生的儿子是”，自然表达母子关系。希伯来语词首连接词וּ承接上文的列举结构，汉语中不必机械译作“和”。
- source_word: בִלְהָה
  choice: 辟拉
  rationale: 人名按现代中文圣经通行译名处理。
- source_word: שִׁפְחַת
  choice: 婢女
  rationale: שִׁפְחָה指社会地位较低的女性仆役，也可能含女性奴隶之意。“婢女”简洁保留其女性身份与从属地位；以脚注说明语义范围，避免正文过度限定。
- source_word: רָחֵל
  choice: 拉结的
  rationale: 采用现代中文圣经通行人名，并以领属结构表达附属关系。
- source_word: דָּן
  choice: 但
  rationale: 人名按现代中文圣经通行译名处理。
- source_word: וְ/נַפְתָּלִי
  choice: 和拿弗他利
  rationale: 保留连接词וְ，以“和”连接名单中的两个人名；人名采用现代中文圣经通行译名。
