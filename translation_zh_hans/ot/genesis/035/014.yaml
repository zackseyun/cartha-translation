base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/014.yaml
  text: And Jacob set up a pillar in the place where he had spoken with him[a], a pillar of stone; and he poured out a drink offering on it[b], and he poured oil on it.
translation:
  language: zh_hans
  text: 雅各在神与他说话的地方立了一根柱子，就是一根石柱[a]；他把奠祭浇在柱上[b]，又把油浇在柱上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文先说“柱子”，随后以“石柱”进一步说明。
    reason: 说明希伯来文重复并具体说明石柱的表达，正文以“就是”自然保留这一结构。
  - marker: b
    text: “奠祭”指将液体倾倒献上的祭。
    reason: 解释礼仪术语，同时不把原文未明说的液体限定为酒。
lexical_decisions:
- source_word: וַיַּצֵּב
  choice: 立了
  rationale: 使役词形表示使某物竖立；“立了”简洁自然，准确表达把石柱竖立起来的动作。
- source_word: מַצֵּבָה / מַצֶּבֶת אָבֶן
  choice: 一根石柱
  rationale: מַצֵּבָה指竖立的石制标志或柱；后面的מַצֶּבֶת אָבֶן明确材质，合译为“一根石柱”最符合现代汉语习惯。
- source_word: בַּמָּקוֹם אֲשֶׁר דִּבֶּר אִתּוֹ
  choice: 在神与他说话的地方
  rationale: 希伯来文动词的主语省略，承接上文可确定为神；汉语若照样只译“他”，指代容易混淆，因此明示“神”，而不改变原句所指。
- source_word: וַיַּסֵּךְ ... נֶסֶךְ
  choice: 浇了奠酒
  rationale: 动词与同根名词连用，描述礼仪性的浇奠；“奠酒”既传达祭献性质，也比音译或生僻术语更便于现代读者理解。
- source_word: וַיִּצֹק ... שָׁמֶן
  choice: 浇上油
  rationale: 原文使用另一浇注动词，宾语仅为“油”；不擅自具体化为橄榄油。“浇上”自然表达油施于石柱之上。
theological_decisions:
- issue: 雅各立柱并浇奠酒、浇油之举的意义
  choice: 仅按经文描述这些礼仪动作，不增添“奉献”“分别为圣”或“纪念”等解释。
  alternative: 将此举明确解释为奉献石柱、使其成圣，或纪念神显现。
  rationale: 本节没有明说这些动作的神学意义；保持叙述性译法可避免把合理推论写入正文。
- issue: 关系从句中说话者的身份
  choice: 译为“神与他说话”，按紧接的上下文明确隐含主语。
  alternative: 机械保留为“他与他说话”，维持希伯来文代词形式。
  rationale: 希伯来文依语境可自然识别说话者为神，而现代汉语的两个“他”会造成不必要的歧义；明示所指属于语法性澄清，不是额外神学解释。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“一根石柱”符合汉语量词习惯；两个连续动作分别译作“浇了奠酒”和“浇上油”，保留原文动词差异并避免拗口。所有脚注标记均已置于正文对应位置。
