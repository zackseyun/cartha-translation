source:
  edition: WLC
  text: וַ/יִּתְּנ֣וּ אֶֽל יַעֲקֹ֗ב אֵ֣ת כָּל אֱלֹהֵ֤י הַ/נֵּכָר֙ אֲשֶׁ֣ר בְּ/יָדָ֔/ם וְ/אֶת הַ/נְּזָמִ֖ים אֲשֶׁ֣ר בְּ/אָזְנֵי/הֶ֑ם וַ/יִּטְמֹ֤ן אֹתָ/ם֙ יַעֲקֹ֔ב תַּ֥חַת הָ/אֵלָ֖ה אֲשֶׁ֥ר עִם שְׁכֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/004.yaml
  text: So they gave Jacob all the foreign gods that were in their hands[a], and the rings that were in their ears[b], and Jacob hid them under the terebinth that was near Shechem.
translation:
  language: zh_hans
  text: 于是，他们把手中所有外族的神明和耳朵上的环饰[a]都交给雅各。雅各把这些东西藏在示剑附近的笃耨香树[b]下。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“耳环”。希伯来词可泛指戴在不同部位的环状饰物；这里后面的短语说明它们是在耳朵上。
    reason: lexical_alternative
  - marker: b
    text: 或译“橡树”；这里的希伯来词更可能特指笃耨香树。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ אֶל־יַעֲקֹב
  choice: 于是，他们……都交给雅各
  rationale: 叙事性连续式推动情节；“于是”自然表达承接关系，“交给雅各”明确保留间接宾语。
- source_word: כָּל אֱלֹהֵי הַנֵּכָר
  choice: 所有外族的神明
  rationale: 保留“外来的、异族的神”这一基本含义，不擅自把所交出的对象具体化为神像或偶像。
- source_word: אֲשֶׁר בְּיָדָם
  choice: 手中
  rationale: 保留希伯来文具体的身体意象，同时在现代汉语中也可自然表示持有、掌握。
- source_word: הַנְּזָמִים אֲשֶׁר בְּאָזְנֵיהֶם
  choice: 耳朵上的环饰
  rationale: נְזָמִים 本身可指戴在不同部位的环状饰物，后面的地点短语明确这里是在耳朵上；“环饰”既保留词义宽度，也避免添加“摘下”等原文没有的动作。
- source_word: וַיִּטְמֹן אֹתָם
  choice: 雅各把这些东西藏
  rationale: טמן 可表示藏匿、掩埋；“藏”保留其较宽泛的语义，不强行断定具体处置方式。
- source_word: תַּחַת הָאֵלָה
  choice: 笃耨香树下
  rationale: אֵלָה 更可能指 terebinth，即笃耨香树，而非通常所说的橡树；正文采用较精确的树种名称。
- source_word: אֲשֶׁר עִם שְׁכֶם
  choice: 示剑附近的
  rationale: עִם 与地名连用在此表达邻近关系；“附近”符合现代汉语地点表达。
theological_decisions:
- issue: 交出并藏起的环饰是否本身具有偶像崇拜或护符性质
  choice: 正文只陈述他们交出耳朵上的环饰，不说明其宗教性质
  alternative: 把环饰明确称为异教护符，或说明它们只是普通贵重饰物
  rationale: 经文明说“外族的神明”，并另行提到环饰，却没有解释环饰为何也被交出；译文保留这一含混和克制。
- issue: “外族的神明”是否应具体译为实体偶像
  choice: 保留为“神明”
  alternative: 译作“神像”或“偶像”
  rationale: 上下文表明这些是可以交出的物件，但 אֱלֹהִים 本身仍是“神、神明”；正文不以推断替代原词，避免过度具体化。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“外族的神明”避免古旧的“外邦神”，“环饰”保留原词的词义宽度；对较陌生但更准确的树名“笃耨香树”用脚注加以说明。
