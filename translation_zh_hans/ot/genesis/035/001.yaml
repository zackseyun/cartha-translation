  text: וַ/יֹּ֤אמֶר אֱלֹהִים֙ אֶֽל יַעֲקֹ֔ב ק֛וּם עֲלֵ֥ה בֵֽית אֵ֖ל וְ/שֶׁב שָׁ֑ם וַ/עֲשֵׂה שָׁ֣ם מִזְבֵּ֔חַ לָ/אֵל֙ הַ/נִּרְאֶ֣ה אֵלֶ֔י/ךָ בְּ/בָרְחֲ/ךָ֔ מִ/פְּנֵ֖י עֵשָׂ֥ו אָחִֽי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/001.yaml
  text: Then God said to Jacob[a], “Arise, go up to Bethel and dwell there, and make there an altar to the God who appeared to you when you fled from the presence of Esau your brother.”
translation:
  language: zh_hans
  text: 上帝对雅各说：“起来，上伯特利去，住在那里，并在那里为那位在你逃离你哥哥以扫时向你显现的上帝筑一座坛。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 叙事中的连续式推进事件；现代汉语通常无需另译“然后”，上下文已自然表达顺序。
- source_word: אֱלֹהִים
  choice: 上帝
  rationale: 虽然词形为复数，但本句搭配单数动词，且语境明确指独一的上帝。
- source_word: קוּם
  choice: 起来
  rationale: 准确表达命令式“起身”，自然且保持庄重。
- source_word: עֲלֵה
  choice: 上……去
  rationale: 保留“上去、登上”的方向和地势含义，同时符合现代汉语表达。
- source_word: בֵּית אֵל
  choice: 伯特利
  rationale: 采用通行的圣经地名音译，不在正文中译作“上帝之家”。
- source_word: וְשֶׁב שָׁם
  choice: 住在那里
  rationale: ישב在此表示居住或停留；“住在那里”清楚自然，并保留命令的持续意味。
- source_word: וַעֲשֵׂה שָׁם מִזְבֵּחַ
  choice: 要在那里……筑一座坛
  rationale: עשה字面为“做、造”，与祭坛搭配时，汉语惯用“筑坛”；“要”承接命令语气。
- source_word: לָאֵל הַנִּרְאֶה אֵלֶיךָ
  choice: 曾向你显现的那位上帝，你要……为他
  rationale: 通过汉语前置关系结构保留“向那位上帝献筑祭坛”的指向，并清楚表达神显。
- source_word: בְּבָרְחֲךָ
  choice: 你逃避……的时候
  rationale: 介词加不定式结构表示时间情境，译成“……的时候”自然准确。
- source_word: מִפְּנֵי
  choice: 逃避
  rationale: 此处短语整体表示因以扫的威胁而逃离；汉语“逃避”自然传达“从……面前逃走”，无需生硬保留“面前”。
- source_word: עֵשָׂו אָחִיךָ
  choice: 你哥哥以扫
  rationale: 汉语亲属称谓需体现长幼；创世记叙事明确以扫是雅各的哥哥，此译自然清楚。
theological_decisions:
- issue: אֱלֹהִים的所指
  choice: 译为单数的“上帝”
  alternative: 诸神
  rationale: 单数动词和叙事语境明确表明，是向雅各显现并对他说话的同一位上帝。
- issue: בֵּית אֵל的处理
  choice: 将地名音译为“伯特利”
  alternative: 上帝之家
  rationale: 本处作为既定地名使用；音译可避免把地名误读成普通名词短语。
- issue: לָאֵל及关系从句的表达
  choice: “曾向你显现的那位上帝，你要在那里为他筑一座坛”
  alternative: “为上帝筑一座坛；他曾向你显现”
  rationale: 所选表达保留定冠词和关系从句对“上帝”的特指作用，也不额外解释神显的性质。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。调整希伯来语语序，使“曾向你显现的那位上帝”与“为他筑坛”的关系在中文中清楚；不使用古雅的“居住”“显现于你”或生硬的“从……面前逃跑”。
