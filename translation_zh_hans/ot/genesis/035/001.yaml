revisions:
- from: 上帝对雅各说：“起来，上伯特利去，住在那里；你逃避你哥哥以扫的时候，曾向你显现的那位上帝，你要在那里为他筑一座坛。”
  to: 上帝对雅各说：“起来，上伯特利去，住在那里，并在那里为那位在你逃离你哥哥以扫时向你显现的上帝筑一座坛。”
  rationale: 修订仅调整中文语序和动词搭配：把“那位……上帝”直接作为“为……筑坛”的对象，保留希伯来文对上帝的特指及关系从句；以“逃离”自然表达雅各从以扫面前逃走。没有加入任何神学解释，也不需要脚注。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T04:21:45Z'
review_pass:
  verdict: revise
  source_fidelity: 译文准确传达了上帝对雅各发出的连续命令、前往伯特利并居住、筑坛，以及该上帝在雅各逃离哥哥以扫时向他显现。现有译文的“逃避”基本涵盖 מִפְּנֵי 所表示的逃离对象，未造成实质性偏差。
  naturalness: 现有句子将“曾向你显现的那位上帝”前置后再以“你要……为他”承接，语法可通，但命令链被较长的关系结构打断，略显滞重。将该定语直接置于“上帝”前，能使中文更顺畅，同时更贴近原文中“筑坛给……上帝”的结构。
  terminology: “上帝”“雅各”“伯特利”“以扫”和“坛”均符合现代汉语圣经译名及庄重、易懂的文体。“筑一座坛”自然，且适合本处的祭坛语境。
  issues:
  - severity: low
    issue: 关系定语前置后以代词“他”回指，造成命令结构轻微断裂。
    rationale: 原文的“在那里筑一座坛给那位……的上帝”可在中文中直接表达为“在那里为那位……的上帝筑一座坛”，指向更清楚，也避免“那位上帝，你要……为他”的话题转换。
  - severity: low
    issue: “逃避你哥哥以扫”可改为“逃离你哥哥以扫”。
    rationale: “逃离”在此更直接表达从以扫面前逃走的动作；不必逐字保留“面前”，也不改变其因躲避以扫而离开的含义。
  revised_text: 上帝对雅各说：“起来，上伯特利去，住在那里，并在那里为那位在你逃离你哥哥以扫时向你显现的上帝筑一座坛。”
  revised_footnotes: []
