  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יְהִ֗י בִּ/שְׁכֹּ֤ן יִשְׂרָאֵל֙ בָּ/אָ֣רֶץ הַ/הִ֔וא וַ/יֵּ֣לֶךְ רְאוּבֵ֔ן וַ/יִּשְׁכַּב֙ אֶת בִּלְהָה֙ פִּילֶ֣גֶשׁ אָבִ֔י/ו וַ/יִּשְׁמַ֖ע יִשְׂרָאֵ֑ל וַ/יִּֽהְי֥וּ בְנֵֽי יַעֲקֹ֖ב שְׁנֵ֥ים עָשָֽׂר־פ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/022.yaml
  text: And it happened[a], while Israel was dwelling in that land, that Reuben went and lay with Bilhah, his father's concubine, and Israel heard of it[b]. Now the sons of Jacob were twelve.
translation:
  language: zh_hans
  text: 以色列住在那地的时候，吕便去与他父亲的妾辟拉同寝；以色列听说了这事。[a] 雅各的儿子共有十二人。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“以色列听见了”，没有明说他听见什么；“这事”指上文吕便所做的事。
    reason: 说明原文省略的宾语及汉语为求清楚所作的补足。
  - marker: b
    text: 或较直译：“雅各的儿子是十二个。”本句很可能是下文儿子名单的过渡句。
    reason: 提供较形式对应的译法，并说明本句的篇章作用。
lexical_decisions:
- source_word: וַיְהִי בִּשְׁכֹּן
  choice: 住在……的时候
  rationale: בּ加不定式构词表示持续行动中的时间背景；汉语以“……的时候”自然表达。句首וַיְהִי的叙事推进功能已融入整句，不另加生硬的“事情发生了”。
- source_word: בָּאָרֶץ הַהִוא
  choice: 在那地
  rationale: אָרֶץ在此指当地的土地或地区，并非整个世界；“那地”简洁并贴近原文。
- source_word: וַיֵּלֶךְ
  choice: 去
  rationale: 保留希伯来文独立的动作动词，使“去与……同寝”的叙事次序不被省略。
- source_word: וַיִּשְׁכַּב אֶת
  choice: 与……同寝
  rationale: 该结构是发生性关系的惯用语。“同寝”保持原文委婉而明确的表达，庄重且不作临床式扩写。
- source_word: פִּילֶגֶשׁ
  choice: 妾
  rationale: 指古代家族中具有从属婚姻地位的女性；“妾”是现代汉语中简明且较准确的对应词。
- source_word: וַיִּשְׁמַע יִשְׂרָאֵל
  choice: 以色列听说了这事
  rationale: 原文直说“以色列听见了”，没有明说宾语；汉语补出由上文显然可知的“这事”，使语句自然。
- source_word: וַיִּהְיוּ בְנֵי יַעֲקֹב שְׁנֵים עָשָׂר
  choice: 雅各的儿子共有十二人
  rationale: 自然表达人数，同时保留原文从“以色列”转用“雅各”这一称呼的变化；本句也承接下文的儿子名单。
theological_decisions:
- issue: 如何表达吕便与辟拉的性行为
  choice: 与他父亲的妾辟拉同寝
  alternative: 与他父亲的妾辟拉发生性关系
  rationale: 原文直接报告严重的不当行为，却使用固定的“躺卧”性用语；“同寝”既不淡化其含义，也不增加原文没有的露骨程度。
- issue: 是否从“以色列听说”推断他的反应
  choice: 只陈述他听说了这事
  alternative: 补写他的愤怒、沉默或处置
  rationale: 本节没有说明以色列的情绪或行动，因此不应加入道德、司法或神学上的推断。
- issue: 末句与前文及下文的关系
  choice: 将“雅各的儿子共有十二人”作为独立的过渡句
  alternative: 把它解释为对吕便行为的神学评语
  rationale: 该句在形式和语境上引入随后十二个儿子的名单；译文保留其过渡作用，不赋予未明说的含义。
- issue: 同一人物称呼由“以色列”转为“雅各”
  choice: 照原文分别译作“以色列”和“雅各”
  alternative: 统一为同一个名字
  rationale: 称呼变化属于原文的叙事特征，统一处理会抹去文本细节。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“同寝”保留原文性用语的含蓄与严肃；“妾”简明呈现古代家庭身份。分号连接吕便的行为与以色列听闻此事，随后另起一句，显示向十二子名单的过渡。
