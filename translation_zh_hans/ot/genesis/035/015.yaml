  text: וַ/יִּקְרָ֨א יַעֲקֹ֜ב אֶת שֵׁ֣ם הַ/מָּק֗וֹם אֲשֶׁר֩ דִּבֶּ֨ר אִתּ֥/וֹ שָׁ֛ם אֱלֹהִ֖ים בֵּֽית אֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/015.yaml
  text: And Jacob called the name of the place where God had spoken with him there[b][a], Bethel.
translation:
  language: zh_hans
  text: 雅各给上帝在那里与他说话的地方起名叫伯特利[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “伯特利”意思是“上帝的家”。
    reason: 说明希伯来地名 בֵּית אֵל 的词义。
lexical_decisions:
- source_word: וַיִּקְרָא ... אֶת שֵׁם
  choice: 起名叫
  rationale: 希伯来语直译为“称……的名”，在此是给地方命名的惯用表达；“起名叫”既准确又符合现代汉语习惯。
- source_word: הַמָּקוֹם
  choice: 地方
  rationale: 按其带定冠词的普通地点含义译出；汉语关系从句中无需另加“那个”。
- source_word: אֲשֶׁר דִּבֶּר אִתּוֹ שָׁם אֱלֹהִים
  choice: 上帝在那里与他说话的
  rationale: 保留 שָׁם“在那里”，并将 אִתּוֹ 译为“与他”，体现相伴介词的表达；按汉语语序将主语“上帝”前置，使关系从句自然清楚。
- source_word: אֱלֹהִים
  choice: 上帝
  rationale: 此处动词和叙事语境均表明所指为独一的上帝，故用单数称谓。
- source_word: בֵּית אֵל
  choice: 伯特利
  rationale: 采用现代中文圣经中通行的地名音译，不在正文中直接意译其词义。
theological_decisions:
- issue: אֱלֹהִים 的单数或复数理解
  choice: 上帝
  alternative: 诸神
  rationale: 此处叙事所指是向雅各显现并与他说话的那一位上帝；按上下文和句法应作单数理解。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“起名叫”避免生硬直译“称那地方的名为”；“在那里”明确保留原文 שָׁם，同时不造成明显赘余。
