  yaml_path: translation/ot/genesis/035/017.yaml
  text: And when her labor was hard[a], the midwife said to her, “Do not fear[b], for this also is a son for you.”
translation:
  language: zh_hans
  text: 她难产的时候，接生婆对她说：“不要怕，因为这个孩子也是你的儿子。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי בְהַקְשֹׁתָהּ בְלִדְתָּהּ
  choice: 她难产的时候
  rationale: 该结构交代随后话语发生的时间背景，直指她生产艰难。“难产”是现代汉语中简洁自然的表达，不必保留希伯来语“事情发生了”这一叙事套语。
- source_word: הַמְיַלֶּדֶת
  choice: 接生婆
  rationale: 该词指协助妇女生产的女性；“接生婆”符合古代叙事背景，也比带有现代职业色彩的“助产士”更贴切。
- source_word: אַל תִּירְאִי
  choice: 不要怕
  rationale: 保留禁止式的直接安慰语气，现代汉语自然明白。
- source_word: כִּי
  choice: 因为
  rationale: 此处引出接生婆劝她不要害怕的理由。
- source_word: גַּם זֶה לָךְ בֵּן
  choice: 你生的这个也是儿子
  rationale: “这个”保留指向眼前婴儿的示指意味，“也”对应 גַּם，并以“你生的”自然表达 לָךְ 所体现的与产妇相关、归她所得之意。
