  text: וַ/יִּסָּ֑עוּ וַ/יְהִ֣י חִתַּ֣ת אֱלֹהִ֗ים עַל הֶֽ/עָרִים֙ אֲשֶׁר֙ סְבִיבֹ֣תֵי/הֶ֔ם וְ/לֹ֣א רָֽדְפ֔וּ אַחֲרֵ֖י בְּנֵ֥י יַעֲקֹֽב׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/005.yaml
  text: Then they set out[a], and a terror from God fell on the cities that were around them, so that they did not pursue the sons of Jacob.
translation:
  language: zh_hans
  text: 于是他们启程；上帝所降的恐惧[a]临到他们周围的各城，以致那些城的人没有追赶雅各的儿子们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“上帝的恐惧”；也可能意为“极大的恐惧”。
    reason: 保留 חִתַּת אֱלֹהִים 这一属格结构可能表示来源、所属或程度的歧义。
lexical_decisions:
- source_word: וַיִּסָּעוּ
  choice: 他们就启程了
  rationale: וַ־连续推进叙事；“启程”自然表达 נסע 在旅行语境中的起行、出发之意。
- source_word: וַיְהִי חִתַּת אֱלֹהִים עַל
  choice: 上帝所降的恐惧笼罩了
  rationale: וַיְהִי 在此具有事件性，与 עַל 连用表示恐惧临到各城；“笼罩”保留其压在各城之上的意象。“上帝所降的”表达该属格最可能的来源含义，同时以脚注保留其他解释。
- source_word: הֶעָרִים אֲשֶׁר סְבִיבֹתֵיהֶם
  choice: 他们周围的各城
  rationale: 简洁自然地表达关系从句，指雅各一行人四周的城邑。
- source_word: וְלֹא רָדְפוּ אַחֲרֵי
  choice: 因此没有人追赶
  rationale: 上下文表明不追赶是恐惧临到后的结果，故以“因此”明示语义关系；中文补出泛指主语“人”，使句子自然，而不指定原文未说明的具体群体。
- source_word: בְּנֵי יַעֲקֹב
  choice: 雅各的儿子们
  rationale: 保留 בְּנֵי 明确的阳性复数亲属称谓，并符合现代汉语表达。
theological_decisions:
- issue: חִתַּת אֱלֹהִים 中属格的含义
  choice: 上帝所降的恐惧
  alternative: 上帝的恐惧；极大的恐惧
  rationale: 结合上帝保护雅各一家的叙事语境，该短语最自然地指源自上帝、由上帝降下的恐惧。不过，希伯来语结构本身也可较形式化地译作“上帝的恐惧”，或将 אֱלֹהִים 理解为表示程度而译作“极大的恐惧”，故在脚注中保留歧义。
- issue: בְּנֵי יַעֲקֹב 的性别所指
  choice: 雅各的儿子们
  alternative: 雅各的孩子们
  rationale: 原文是明确的阳性复数，叙事中所指也是雅各的男性后裔，因此不将其泛化为性别中性的“孩子们”。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“启程”“笼罩”“追赶”均为普通读者易懂的现代表达；分为两句以对应希伯来叙事推进，并避免冗长。
