revisions:
- from: 他们就启程了。上帝所降的恐惧[a]笼罩了他们周围的各城，因此没有人追赶雅各的儿子们。
  to: 于是他们启程；上帝所降的恐惧[a]临到他们周围的各城，以致那些城的人没有追赶雅各的儿子们。
  rationale: 将末句的泛指“没有人”改为“那些城的人没有追赶”，使其明确承接“他们周围的各城”，并避免把原文限定于相关城邑人群的否定陈述扩展成无范围限定的普遍否定。以“临到”表达恐惧落在各城之上，语义自然且贴近原文意象；其余关键措辞和脚注均予保留。
