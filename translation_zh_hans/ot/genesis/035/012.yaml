base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/012.yaml
  text: And the land that I gave to Abraham and to Isaac[a], I will give to you[b]; and to your offspring after you I will give the land.
translation:
  language: zh_hans
  text: 我曾赐给亚伯拉罕和以撒的那片土地[a]，我要赐给你；我也要把那片土地赐给你之后的后裔[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“已经赐给亚伯拉罕和以撒的那片土地”。
    reason: lexical_alternative
  - marker: b
    text: “后裔”所译的希伯来语是集合单数，也可译作“子孙”或直译为“种子”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאָרֶץ
  choice: 那片土地／这片土地
  rationale: אֶרֶץ在族长蒙应许的语境中指特定的土地。关系从句中用“那片土地”，末句再次提及时用“这片土地”，既自然又保留原文的重复。
- source_word: נָתַתִּי
  choice: 我曾赐给
  rationale: 完成式在这里指上帝先前赐给亚伯拉罕和以撒的行动；“曾”明确表达过去，同时不把赐予的性质解释得过细。
- source_word: לְאַבְרָהָם וּלְיִצְחָק
  choice: 给亚伯拉罕和以撒
  rationale: 现代汉语无需重复介词，合并为一个“给”更自然，所指关系不变。
- source_word: לְךָ אֶתְּנֶנָּה
  choice: 也要赐给你
  rationale: 动词所带的阴性单数宾语代词回指“土地”；汉语可由前置宾语自然承接。“也”体现同一应许延及雅各。
- source_word: זַרְעֲךָ
  choice: 你的后裔
  rationale: זֶרַע是集合单数；“后裔”在现代汉语中可作集合称谓，比直译“种子”自然，也不限定人数。
- source_word: אַחֲרֶיךָ
  choice: 你之后的
  rationale: 保留时间和世代承接的含义，修饰“后裔”时符合现代汉语表达。
- source_word: אֶתֵּן אֶת הָאָרֶץ
  choice: 我要把这片土地赐给
  rationale: 保留原文第二次出现的“赐给”和“土地”，突显应许延续到雅各之后的后裔。
theological_decisions:
- issue: 族长土地应许中过去赐予与未来赐予的关系
  choice: 将נָתַתִּי译为“曾赐给”，将两个未完成式译为“要赐给”，保留先前赐予与未来实现之间的张力。
  alternative: 将נָתַתִּי译为“已经赐给”，强调该应许持续有效。
  rationale: 原文把上帝先前对亚伯拉罕和以撒的赐予，与将来对雅各及其后裔的赐予并列；译文不把二者合并为单一时态，也不额外界定这是法律授予、应许还是实际占有。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。保留“土地”和“赐给”的重复，以呈现原文应许句式；用“曾……要……”清楚表达时态对照，不添加宗派性解释。
