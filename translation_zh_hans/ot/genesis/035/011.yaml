  text: וַ/יֹּאמֶר֩ ל֨/וֹ אֱלֹהִ֜ים אֲנִ֨י אֵ֤ל שַׁדַּי֙ פְּרֵ֣ה וּ/רְבֵ֔ה גּ֛וֹי וּ/קְהַ֥ל גּוֹיִ֖ם יִהְיֶ֣ה מִמֶּ֑/ךָּ וּ/מְלָכִ֖ים מֵ/חֲלָצֶ֥י/ךָ יֵצֵֽאוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/011.yaml
  text: And God said to him[a], “I am God Almighty. Be fruitful and multiply. A nation and an assembly of nations shall come from you[c][b], and kings shall come from your loins.”
translation:
  language: zh_hans
  text: 神对他说：“我是全能的神[a]。你要生养众多。必有一个国族和一群国族从你而出[b]；也必有君王从你身中而出[c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文作“伊勒·沙代”（El Shaddai），传统译作“全能的神”。
    reason: lexical_alternative
  - marker: b
    text: “一群国族”也可译作“众国的会众”或“众国的群体”。希伯来词可指聚集起来的群体、会众或集合。
    reason: lexical_alternative
  - marker: c
    text: 直译“从你的腰”；这是指亲身所出的后裔的古代说法。
    reason: cultural_note
lexical_decisions:
- source_word: אֱלֹהִים
  choice: 神
  rationale: 虽为复数形式，但本句使用单数动词，且叙事语境明确指以色列的神，因此译作单数称谓“神”。
- source_word: אֵל שַׁדַּי
  choice: 全能的神
  rationale: 这是神的称号；“全能的神”沿用其传统且可理解的意义，同时以脚注保留希伯来语称号本身。
- source_word: פְּרֵה וּרְבֵה
  choice: 你要生养众多
  rationale: 两个阳性单数命令式构成创世及族长叙事中反复出现的祝福用语；此译自然地表达繁衍增多之意。
- source_word: גּוֹי
  choice: 一国
  rationale: 在族长应许的语境中，指由共同后裔形成的国族；“一国”直接而简洁。
- source_word: קְהַל גּוֹיִם
  choice: 众国的群体
  rationale: קָהָל可指聚集起来的群体、会众或集合；“众国的群体”保留其集合性，也避免把它直接解释为单纯的“许多国家”。
- source_word: יִהְיֶה מִמֶּךָּ
  choice: 从你而出
  rationale: 原文直译为“将从你而有”；在此指从雅各繁衍而出的后裔，用“从你而出”既自然又保留谱系含义。
- source_word: מְלָכִים
  choice: 君王
  rationale: 该词直接指掌权的王；“君王”符合庄重的现代汉语经文语体。
- source_word: מֵחֲלָצֶיךָ
  choice: 从你腰间
  rationale: 原文以“腰间”表达亲身所出的肉身后裔；正文保留其具体意象，并以脚注说明这一古代习语。
- source_word: יֵצֵאוּ
  choice: 而出
  rationale: 这里不是一般空间移动，而是指君王由雅各的血脉产生；“而出”简洁地保留原文意象。
theological_decisions:
- issue: 神圣称号 אֵל שַׁדַּי 的译法
  choice: 全能的神
  alternative: 伊勒·沙代／沙代神
  rationale: 将称号译出意义，使普通读者可直接理解，同时以脚注注明希伯来语形式；不对שַׁדַּי词源上的争议作超出证据的推断。
- issue: 后裔应许中的身体意象
  choice: 从你而出／从你腰间而出
  alternative: 从你而有／从你的后代中兴起
  rationale: 应许明确涉及雅各亲身繁衍的血脉。译文在自然表达“从你而出”的同时保留“腰间”这一具体意象，不把身体性内容抽象化。
- issue: קְהַל גּוֹיִם 的集合含义
  choice: 众国的群体
  alternative: 多国／众国的会众／一群国族
  rationale: 原文既有复数“众国”，也有表示聚集群体的קָהָל；所选译法保留二者，不把它神学化为特定宗教会众。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“生养众多”保留创世与族长祝福公式的经文回响；“众国的群体”略带正式色彩，以保存原文集合性；“腰间”保留希伯来语的身体意象，并由脚注帮助现代读者理解。
