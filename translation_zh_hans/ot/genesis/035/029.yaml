base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/029.yaml
  text: Then Isaac breathed his last and died[a], and was gathered to his people, old and full of days. And Esau and Jacob, his sons, buried him.
translation:
  language: zh_hans
  text: 以撒断了气，死了，又归到他本族那里[a]；他年纪老迈，日子满足。他的儿子以扫和雅各把他安葬了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“归到他的亲族（或列祖）那里”。这是希伯来文惯用的死亡表达，其含义可能不止于身体被安葬。
    reason: 说明词义替代及原文死亡套语所保留的含义空间。
lexical_decisions:
- source_word: וַיִּגְוַע
  choice: 断了气
  rationale: גוע在死亡记述中表示气绝、生命终止；“断了气”是自然的现代汉语表达，也与后面的“死了”有所区别。
- source_word: וַיָּמָת
  choice: 死了
  rationale: מות是“死亡”的常用动词；直译为“死了”，保留希伯来文连续陈述的次序。
- source_word: וַיֵּאָסֶף אֶל־עַמָּיו
  choice: 归到他本族那里
  rationale: 这是希伯来文惯用的死亡套语。“本族”保留עַמָּיו所含的群体和亲属意味；采用自然汉语表达，同时不把它限定为埋葬或死后与祖先相聚。
- source_word: זָקֵן
  choice: 年纪老迈
  rationale: 准确表达年老的状态，语体庄重而仍为现代读者所理解。
- source_word: וּשְׂבַע יָמִים
  choice: 日子满足
  rationale: 贴近希伯来文“日子饱足”的族长死亡套语，保留其文学意象，不将其简化为“高寿”或“享尽天年”。
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: 把他安葬了
  rationale: קבר意为埋葬；“安葬”在中文死亡记述中自然、庄重。
- source_word: עֵשָׂו וְיַעֲקֹב בָּנָיו
  choice: 他的儿子以扫和雅各
  rationale: 清楚说明以扫和雅各是以撒的儿子，并保持原文姓名次序。
theological_decisions:
- issue: “归到他本族那里”这一死亡套语的含义
  choice: 保留为未作具体解释的惯用表达
  alternative: 明确解释为葬入家族坟墓，或死后与列祖相聚
  rationale: 原文可能包含亲属归属、祖先团聚或死亡状态等意味，却没有明确界定；译文不应把这种神学张力化约为单一解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“断了气，死了”保留原文两个连续死亡动词；“日子满足”有意保留希伯来文习语的文学质感。
