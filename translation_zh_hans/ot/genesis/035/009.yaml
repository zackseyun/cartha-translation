base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/009.yaml
  text: God appeared to Jacob again when he came from Paddan-aram[a], and he blessed him.
translation:
  language: zh_hans
  text: 雅各从巴旦·亚兰回来时，神又向他显现[a]，并赐福给他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“神又让雅各看见他。”原文动词可以表示“显现”或“使自己被看见”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרָא
  choice: 向……显现
  rationale: 该动词为ראה的尼发勒式，在这里表示神使自己被看见、显现；“向他显现”是自然、庄重的现代汉语表达，同时不具体限定显现的方式。
- source_word: אֱלֹהִים
  choice: 神
  rationale: 动词采用单数形式，叙事语境也明确指独一的神，因此译为“神”。
- source_word: עוֹד
  choice: 又
  rationale: 这里表示先前事件的重复；“又”简洁自然，对应“再次、再一次”。
- source_word: בְּבֹאוֹ
  choice: 回来以后
  rationale: 介词ב加带代词后缀的不定式在此具有时间意义。结合雅各从巴旦·亚兰返回的叙事语境，“回来以后”符合现代汉语，也保留事件发生的时间关系。
- source_word: מִפַּדַּן אֲרָם
  choice: 从巴旦·亚兰
  rationale: 这是地名，采用音译；前缀מִן译为“从”。中点用于清楚标示复合音译名称。
- source_word: וַיְבָרֶךְ אֹתוֹ
  choice: 并赐福给他
  rationale: ברך的皮勒式意为“赐福”。“并赐福给他”清楚保留神为施事者、雅各为受事者的关系。
theological_decisions:
- issue: 神显现的性质
  choice: 译为“神又向他显现”
  alternative: “神又让雅各看见他”或“神又向雅各启示自己”
  rationale: 原文陈述真实的神圣显现，却没有说明其机制或形式。“显现”保留这种开放性，不将其限定为异象、内在启示或某种特定方式。
translation_notes:
  register: 采用现代、庄重且易懂的叙事语言。“巴旦·亚兰”按传统而清晰的汉语音译处理；句序略作汉语化，将时间状语置于句首。
