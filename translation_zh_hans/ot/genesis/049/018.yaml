  text: לִֽ/ישׁוּעָתְ/ךָ֖ קִוִּ֥יתִי יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/018.yaml
  text: For your salvation I wait[a], O Yahweh.
translation:
  language: zh_hans
  text: 雅威啊，我等候你的拯救[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“雅威啊，我一直等候你的解救。”希伯来语“拯救”也可译作“解救”；“我等候”也可理解为“我一直等候”。
    reason: 保留יְשׁוּעָה的词义范围以及קִוִּיתִי在时态、体貌上的可能译法。
lexical_decisions:
- source_word: לִישׁוּעָתְךָ
  choice: 你的拯救
  rationale: יְשׁוּעָה可指拯救、解救或得胜；“拯救”既保留其广泛含义，也不把本诗句局限为军事上的获救。前缀לִ在汉语“等候……”的结构中自然体现，无须另译。
- source_word: קִוִּיתִי
  choice: 我等候
  rationale: קוה表示带着盼望和期待而等候。希伯来语完成式在此可有“我一直等候”或当下郑重宣告的意味；汉语无体标记的“我等候”自然简洁，并保留时态与体貌上的一定开放性。
- source_word: יְהוָה
  choice: 雅威
  rationale: 原文直接使用四字神名YHWH，而非“主”这一称号；“雅威”以现代汉语音译呈现该专名。
theological_decisions:
- issue: 如何译出神名יְהוָה
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文是神的专名YHWH。采用“雅威”可明确保留专名，避免以称号“主”代替；“耶和华”虽是汉语传统形式，但其读音源于较晚的混合读法。
- issue: קִוִּיתִי的时态与体貌
  choice: 我等候
  alternative: 我一直等候；我曾等候
  rationale: 该完成式可侧重已经持续的等候，也可在诗歌中表达坚定的现时盼望。正文不用体貌助词，以免把原文的开放性缩窄；脚注列出较明确的持续式译法。
translation_notes:
  register: 采用简洁、庄重而自然的现代汉语。将呼语“雅威啊”置于句首，符合汉语表达；正文“我等候你的拯救”清楚传达原文中带着盼望的等候，同时不额外加入解释性神学含义。
