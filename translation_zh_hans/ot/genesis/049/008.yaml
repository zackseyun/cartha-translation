base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/008.yaml
  text: Judah[a], your brothers will praise you; your hand will be on the neck of your enemies[b]; the sons of your father will bow down to you.
translation:
  language: zh_hans
  text: 犹大啊，你的兄弟必称赞你[a]；你的手必按在仇敌的颈项上；你父亲的众子必向你下拜。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“必向你称谢”。希伯来语这个动词可表示称谢、承认或称赞；这里译作“称赞”，也呼应“犹大”这个名字。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוּדָה
  choice: 犹大
  rationale: 采用现代中文圣经中通行的人名译法；呼格语气以“啊”自然呈现。
- source_word: יוֹדוּךָ
  choice: 必称赞你
  rationale: ידה 的这一使役词形在此表示称赞、认可或称谢；“称赞”最符合祝福语境，并尽量保留与“犹大”之名相关的希伯来语文字呼应。
- source_word: אַחֶיךָ
  choice: 你的兄弟
  rationale: 原文为阳性复数并带第二人称阳性单数后缀；上下文指雅各的众子，译作“兄弟”准确自然。
- source_word: יָדְךָ בְּעֹרֶף אֹיְבֶיךָ
  choice: 你的手必按在仇敌的颈项上
  rationale: 保留“手”与“颈项”的具体征服意象；补出“按”以使中文句法完整，又不消解其制伏仇敌的含义。
- source_word: יִשְׁתַּחֲווּ לְךָ
  choice: 必向你下拜
  rationale: 该动词可指俯伏致敬，也可在其他语境指敬拜；此处对象是犹大，语境为家族与王权性的臣服，因此“下拜”既保留身体动作，也不引入对神的敬拜含义。
- source_word: בְּנֵי אָבִיךָ
  choice: 你父亲的众子
  rationale: 贴近原文“你父亲的儿子们”，并用“众子”保持庄重、简洁的祝福体风格。
theological_decisions:
- issue: יִשְׁתַּחֲווּ לְךָ 所表达的敬意性质
  choice: 译为人对人的俯伏臣服与尊崇
  alternative: 译作带有神圣敬拜意味的“敬拜你”
  rationale: 雅各在祝福中直接对犹大说话，因此原句首先描写其弟兄向他表示臣服或尊崇。“下拜”保留王权色彩和后续神学发展的空间，却不把本节本身未明说的神性含义写入译文。
translation_notes:
  register: 采用现代、庄重而易懂的祝福体中文。“颈项”“众子”“下拜”略具经文庄重感，但仍属当代读者可理解的表达。主文仅设置确有词义差异的脚注；英文咨询层中标作 b 的内容实际是主文末句的措辞替代，并非“仇敌的颈项”的替代，因此未沿用该错位标记。
