base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/028.yaml
  text: 'All these are the twelve tribes of Israel[a], and this is what their father spoke to them when he blessed them: he blessed each one with the blessing appropriate to him.'
translation:
  language: zh_hans
  text: 以上这些都是以色列的十二支派；这是他们的父亲对他们所说的话。他祝福他们，按着各人的祝福，分别祝福他们。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“他祝福他们；各人按着自己的祝福，他祝福他们。”
    reason: 说明原文两次重复“祝福”一词，以及“各人按着自己的祝福”的分配结构；“自己的祝福”在上下文中可指分别配给各人的祝福。
lexical_decisions:
- source_word: כָּל אֵלֶּה
  choice: 以上这些
  rationale: 承接前文对众子的逐一陈说，用现代汉语“以上这些”自然概括，同时保留指示语的总结作用。
- source_word: שִׁבְטֵי יִשְׂרָאֵל שְׁנֵים עָשָׂר
  choice: 以色列的十二支派
  rationale: 直接表达原文的领属结构和数目，也是现代汉语中通行而清楚的说法。
- source_word: וְזֹאת אֲשֶׁר דִּבֶּר לָהֶם אֲבִיהֶם
  choice: 这是他们的父亲对他们所说的话
  rationale: “所说的话”自然表达 אֲשֶׁר דִּבֶּר 的内容关系，并保留父亲向众子发言的方向。
- source_word: וַיְבָרֶךְ אֹתָם
  choice: 他给他们祝福
  rationale: 将连接式动词按并列关系处理，不增添“当……时”的时间解释，并保留 ברך 的明确祝福含义。
- source_word: אִישׁ
  choice: 各人
  rationale: 此处是分配用法，指十二子中的每一个；“各人”简洁保留单数分配意味。
- source_word: כְּבִרְכָתוֹ
  choice: 按着各人的福分
  rationale: 贴近“按照他的祝福”这一结构，不在正文中将其完全解释为“适合他的”，从而保留“福分／祝福”所指的适度开放性。
- source_word: בֵּרַךְ אֹתָם
  choice: 一一给他们祝福
  rationale: 再次使用“祝福”，保留原文 ברך 的重复；加入“一一”使汉语明确呈现 אִישׁ 的分配关系。
theological_decisions:
- issue: 各人之“福分”是否明确表示量身相称的祝福
  choice: 按着各人的福分
  alternative: 照着适合各人的祝福
  rationale: 原文 כְּבִרְכָתוֹ 可在语境中理解为与各人相应的祝福，但没有明说“适合”；正文保留较贴近原文且较开放的表达，避免把语境推论写成明示内容。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“支派”“祝福”“福分”是普通读者易懂且符合经文语域的词。分号体现总结陈说与具体祝福动作之间的紧密并列关系；末句略作汉语语序调整，同时用脚注交代原文的重复形式。
