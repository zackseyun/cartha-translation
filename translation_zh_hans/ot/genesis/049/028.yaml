revisions:
- from: 以上这些就是以色列的十二支派。这是他们的父亲对他们所说的话；他给他们祝福，按着各人的福分，一一给他们祝福。[a]
  to: 以上这些都是以色列的十二支派；这是他们的父亲对他们所说的话。他祝福他们，按着各人的祝福，分别祝福他们。[a]
  rationale: 将“福分”改为“祝福”，以保留希伯来文同一词根的重复及其语义开放性；以“分别祝福他们”自然表达分配性的“各人”，而不把“适合”或“应得”等解释写入正文。将“给他们祝福”改为“祝福他们”，使现代汉语更自然。
