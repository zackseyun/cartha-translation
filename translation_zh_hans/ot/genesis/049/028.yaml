  naturalness: “他给他们祝福”在现代标准汉语中不如“他祝福他们”自然。末句若保留原文的重复，需要以清楚而不过度生硬的语序表达。
  terminology: “以色列的十二支派”及“祝福”均恰当。“福分”可有“命数、际遇或所享的福气”之义，不宜在此替代与原文同根重复的“祝福”。
