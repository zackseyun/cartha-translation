base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/033.yaml
  text: When Jacob finished commanding his sons[a], he drew his feet up into the bed, breathed his last[b], and was gathered to his people.
translation:
  language: zh_hans
  text: 雅各吩咐完众子，就把双脚收回到床上[a]，咽了气，归到他本族的人那里[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译可作“把双脚收拢到床上”。原文用“收拢、聚集”一词描写这个动作。
    reason: lexical_alternative
  - marker: b
    text: “归到他本族的人那里”是与死亡有关的希伯来表达，不只是说他被安葬；雅各的安葬记在下一章。
    reason: cultural_note
lexical_decisions:
- source_word: וַיְכַל
  choice: 完
  rationale: 表示雅各吩咐众子的行动已经结束；与“吩咐”搭配为“吩咐完”，自然地保留叙事的先后顺序。
- source_word: לְצַוֹּת
  choice: 吩咐
  rationale: צוה可指命令、嘱咐；此处是雅各临终向众子所作的郑重交代。“吩咐”既贴近原义，也符合现代汉语语境。
- source_word: בָּנָיו
  choice: 众子
  rationale: 原文明确指雅各的儿子们；“众子”简洁、庄重，并保留性别与上下文所指。
- source_word: וַיֶּאֱסֹף רַגְלָיו אֶל הַמִּטָּה
  choice: 把双脚收回床上
  rationale: אָסַף本义为“收拢、聚集”；这里描写雅各把原先伸下或放在床外的双脚收回床上。“收回床上”是自然汉语，同时保留动作意象。
- source_word: הַמִּטָּה
  choice: 床
  rationale: מִטָּה可指床或卧榻；临终场景中译作“床”最直白自然。
- source_word: וַיִּגְוַע
  choice: 咽了气
  rationale: גוע表示气绝、断气。“咽了气”以自然汉语表达生命终止，并避免简单重复为“死了”。
- source_word: וַיֵּאָסֶף אֶל עַמָּיו
  choice: 归到他本族那里
  rationale: 保留这一死亡用语中“归到自己族人那里”的意象，不把它窄化为埋葬，也不额外断定其死后状态；“本族”传达 עַמָּיו 所指与他相属的人群。
theological_decisions:
- issue: “归到他本族那里”的含义
  choice: 保留归属并与族人相聚的希伯来表达，不解释为单纯安葬。
  alternative: 与列祖同葬；死后与祖先团聚
  rationale: 雅各的安葬发生在下一章，因此本句不能只理解为埋葬通知。译文保留死亡、亲族与死后归聚之间的张力，而不进一步界定其具体性质。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“众子”略带经文体色彩，但在现代汉语中仍清楚自然；“咽了气”直接而不粗俗。“归到他本族那里”有意保留原文异于日常汉语的表达及其神学张力，并以脚注说明。
