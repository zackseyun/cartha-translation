base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/027.yaml
  text: Benjamin is a ravenous wolf[a]; in the morning he devours the prey[d][c][b], and in the evening he divides the spoil.
translation:
  language: zh_hans
  text: 便雅悯是一只撕掠的狼[a]；早晨吞吃猎物[b]，晚上分配战利品[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “撕掠”所译的希伯来语动词着重于撕裂、攫取；也可译作“捕食”。
    reason: lexical_alternative
  - marker: b
    text: “猎物”所译的希伯来语词也可理解为“掠物”或“战利品”。
    reason: lexical_alternative
  - marker: c
    text: “战利品”也可译作“掠物”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּנְיָמִין
  choice: 便雅悯
  rationale: 采用现代中文圣经传统中通行的人名音译。
- source_word: זְאֵב יִטְרָף
  choice: 一只撕咬猎物的狼
  rationale: זְאֵב意为“狼”，יִטְרָף源于טרף，突出猛兽撕咬猎物的动作；此译保留鲜明的捕食意象，也符合现代汉语表达。
- source_word: בַּבֹּקֶר
  choice: 早晨
  rationale: 直接表达时间状语，并与后文“晚上”构成诗歌上的平行。
- source_word: יֹאכַל
  choice: 吞吃
  rationale: 该词通常意为“吃”，但在狼捕食的语境中译作“吞吃”更能传达诗句的力度，同时不超出原有意象。
- source_word: עַד
  choice: 猎物
  rationale: 此处承接狼的意象，译作“猎物”最自然；该罕见名词也可能指战利品或掠物，因此以脚注保留词义空间。
- source_word: וְלָעֶרֶב
  choice: 晚上
  rationale: 与“早晨”平行，简洁自然地表达原文的时间对照。
- source_word: יְחַלֵּק שָׁלָל
  choice: 瓜分战利品
  rationale: חלק的加强式在此表示分配、分取，שָׁלָל指战争或劫掠所得；“瓜分战利品”自然地传达得胜后分取掠物的画面。
theological_decisions:
- issue: 雅各对便雅悯祝福中的比喻所指
  choice: 保留狼捕食及分取战利品的诗歌意象，不在正文中指定其历史应验对象。
  alternative: 将其明确解释为便雅悯支派后来尚武历史的预言。
  rationale: 希伯来文只呈现形象鲜明的诗歌描述，并未明说具体历史人物或事件；译文不应替原文消除这种开放性。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。以分号和前后对应的“早晨／晚上”保留希伯来诗歌的平行结构；狼的捕食意象与战士分取战利品的意象均不作解释性扩写。
