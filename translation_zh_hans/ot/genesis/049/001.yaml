  yaml_path: translation/ot/genesis/049/001.yaml
  text: Then Jacob called his sons and said[a], “Gather yourselves, and I will tell you what will happen to you in the latter days.”
translation:
  language: zh_hans
  text: 雅各叫他的儿子们来，说：“你们聚集起来，我要告诉你们，日后[a]会有什么事临到你们。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“在末后的日子”。这个希伯来语短语在某些语境中也可带有末世的意味。
    reason: 保留 בְּאַחֲרִית הַיָּמִים 较贴近字面的译法及其在部分语境中可能具有的末世含义。
lexical_decisions:
- source_word: וַיִּקְרָא יַעֲקֹב אֶל־בָּנָיו
  choice: 雅各把众子召来
  rationale: קרא אֶל 在这里表示召唤人来到跟前；“把……召来”符合现代汉语叙事习惯。“众子”准确指雅各的儿子们，也与下文各支派先祖的语境相合。
- source_word: הֵאָסְפוּ
  choice: 你们聚集起来
  rationale: 该词是 אסף 的尼斐勒命令式，要求众子集合；译文保留命令语气和庄重感。
- source_word: וְאַגִּידָה לָכֶם
  choice: 我要告诉你们
  rationale: 此处意愿式表达雅各在众子聚集之后要做的事；“我要告诉你们”自然传达其意向。
- source_word: אֲשֶׁר יִקְרָא אֶתְכֶם
  choice: 将有什么事临到你们
  rationale: קרה 与宾语连用表示某事发生或临到某人；“临到你们”比单纯“发生”更贴近原文表达，同时仍是清楚、自然的现代汉语。
- source_word: בְּאַחֲרִית הַיָּמִים
  choice: 日后的岁月里
  rationale: 该短语可泛指未来的日子，在某些语境中也可带有末世意味。正文采用较宽泛的未来指向，并在脚注保留更贴近字面的传统译法。
theological_decisions:
- issue: בְּאַחֲרִית הַיָּמִים 是否应明确译成带有末世论色彩的说法
  choice: 日后的岁月里
  alternative: 末后的日子里
  rationale: 本节直接谈到雅各众子及其后裔将来的遭遇，因此正文保留一般性的未来指向；原短语可能具有的末世意味则通过脚注呈现，避免在正文中预先消除其语义张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“众子”“临到”等措辞保留经文语体的凝练感，但不使用难懂的古语。脚注标记紧接其所说明的时间短语。
