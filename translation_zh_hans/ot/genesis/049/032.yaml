  text: מִקְנֵ֧ה הַ/שָּׂדֶ֛ה וְ/הַ/מְּעָרָ֥ה אֲשֶׁר בּ֖/וֹ מֵ/אֵ֥ת בְּנֵי חֵֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/032.yaml
  text: The field and the cave that is in it were purchased from the sons of Heth[a][b].
translation:
  language: zh_hans
  text: 那块田和田里的洞，是从赫的子孙[a]买来的。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“赫人”。希伯来原文直译为“赫的子孙”。
    reason: lexical_alternative
  - marker: b
    text: 本句也可译为：“那块田和田里的洞，是从赫的子孙那里购得的产业。”希伯来语 מִקְנֵה 可指购置或购得的产业。
    reason: source_ambiguity
lexical_decisions:
- source_word: מִקְנֵה
  choice: 买来的
  rationale: 该名词在这里指经购买而取得之物或取得行为。结合创世记二十三章的交易背景，用“买来的”把希伯来语省略的名词句自然地表达为现代汉语，同时保留购买取得的含义。
- source_word: הַשָּׂדֶה
  choice: 那块田
  rationale: שָׂדֶה在此指前文已经提到并购得的田地；“那块田”符合汉语回指习惯。
- source_word: וְהַמְּעָרָה
  choice: 和……洞
  rationale: מְעָרָה指洞穴，尤其是用作墓地的洞；本节依原文保留简洁的“洞”。
- source_word: אֲשֶׁר בּוֹ
  choice: 田里的
  rationale: 关系结构直译为“在其中的”；现代汉语以“田里的”清楚表明洞位于田中。
- source_word: מֵאֵת
  choice: 从
  rationale: 该复合介词标明取得的来源；“从”是自然且充分的汉语对应。
- source_word: בְּנֵי חֵת
  choice: 赫的子孙
  rationale: 保留原文的亲属式族称“赫的众子”，用“子孙”表达其族群意义；通行的族名“赫人”列入脚注。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“那块”承接前文已知的田；“田里的洞”避免生硬复制希伯来语关系从句。主句用“买来的”补出希伯来语名词句在汉语中所需的谓语，脚注保留 מִקְנֵה 在“购置”与“购得之物”之间的词义张力。
