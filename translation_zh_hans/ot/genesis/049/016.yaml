  yaml_path: translation/ot/genesis/049/016.yaml
  text: Dan will judge his people as one of the tribes of Israel[a].
translation:
  language: zh_hans
  text: '但必审判自己的人民，

    作为以色列众支派之一。[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“但必为自己的人民主持公道。”原文动词也可指为人伸冤、维护正义，而不只是作出审判。
    reason: lexical_alternative
lexical_decisions:
- source_word: דָּן
  choice: 但
  rationale: 雅各之子及其支派的专名，采用现代中文圣经中通行的译名“但”。原文此名与下文动词 יָדִין 构成语音和词根双关；中文无法完整复现。
- source_word: יָדִין
  choice: 必……主持公道
  rationale: דין 的 Qal 未完成式在祝福预言中表达将来，可指施行判断、治理或为人伸张正义。“主持公道”自然地涵盖审断和维护公正的意味，同时不把语义局限为宣判。
- source_word: עַמּוֹ
  choice: 自己的人民
  rationale: עם 加第三人称阳性单数后缀，直指“他的人民”。“自己的”清楚表达所属关系，而不进一步限定为但支派的成员。
- source_word: כְּאַחַד
  choice: 如同……一个
  rationale: 比较介词 כ 与 אחד 合用，意为“像一个／作为一个”，表示但在以色列众支派中具有相应地位。
- source_word: שִׁבְטֵי
  choice: 支派
  rationale: שֵׁבֶט 的复数附属形；本处与“以色列”连用，语境明确指以色列的各支派，而非“杖”或“权杖”。
- source_word: יִשְׂרָאֵל
  choice: 以色列
  rationale: 采用现代汉语通行专名译法。
theological_decisions:
- issue: 但在祝福中所承担角色的性质
  choice: 译作“为自己的人民主持公道”，保留审断、治理及维护正义的语义范围。
  alternative: “审判自己的人民”或“为自己的人民伸冤”。
  rationale: דין 可表示审判、治理、辨明是非或伸张正义。上下文将但与以色列的支派并列，可能着重其作为完整支派行使治理与司法职能；因此正文采用较宽而自然的“主持公道”，脚注列出较为字面的译法。
translation_notes:
  register: 采用庄重、自然的现代标准汉语。“必”体现祝福预言中的将来语气；分行保留希伯来诗句的平行节奏。中文无法保留“但”（דָּן）与“主持公道／审判”（יָדִין）之间的词根双关，未另行强造双关。
