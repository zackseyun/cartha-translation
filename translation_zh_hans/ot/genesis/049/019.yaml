  yaml_path: translation/ot/genesis/049/019.yaml
  text: Gad—a raiding band will raid him[b][a], but he will raid at their heels.
translation:
  language: zh_hans
  text: 迦得必遭一队劫掠者劫掠[a]；他却要从后方袭击他们[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来原文在“迦得”、表示“一队劫掠者”的词和两次“劫掠”之间运用重复、谐音式的文字游戏（gad / gedud / yegudennu / yagud）；中文无法完全重现。
    reason: lexical_alternative
  - marker: b
    text: 直译“在脚跟”；可指从后方袭击，也可指紧追在他们后面。
    reason: alternative_reading
lexical_decisions:
- source_word: גָּד
  choice: 迦得
  rationale: 雅各之子及其支派的专名，采用现代中文圣经中通行的译名。
- source_word: גְּדוּד
  choice: 袭击者
  rationale: 该名词指成群出击、劫掠的人；译作“袭击者”能自然表达敌对行动，并与同根动词“袭击”形成有限的汉语呼应。
- source_word: יְגוּדֶנּוּ
  choice: 必……袭击
  rationale: 这是גדד的未完成式，带第三人称阳性单数宾语后缀；在此表示敌对袭扰。“必遭……袭击”准确表达迦得是受事者。
- source_word: וְהוּא
  choice: 但他
  rationale: 连接词本可译作“而”，但上下句呈现由受袭到反击的转折，故译“但他”。
- source_word: יָגֻד
  choice: 必反击
  rationale: 与前一动词同根，语境显示迦得随后回击；“反击”自然呈现逆转，虽不能完全复制希伯来语的同根双关。
- source_word: עָקֵב
  choice: 脚跟
  rationale: 保留原文“脚跟”的具体意象；在语境中可指从后方打击，或紧追敌人之后。
