  text: אָר֤וּר אַפָּ/ם֙ כִּ֣י עָ֔ז וְ/עֶבְרָתָ֖/ם כִּ֣י קָשָׁ֑תָה אֲחַלְּקֵ֣/ם בְּ/יַעֲקֹ֔ב וַ/אֲפִיצֵ֖/ם בְּ/יִשְׂרָאֵֽל׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/007.yaml
  text: Cursed be their anger[a], for it is fierce, and their wrath, for it is harsh. I will divide them in Jacob and scatter them in Israel.
translation:
  language: zh_hans
  text: 他们的怒气当受咒诅，因其猛烈；他们的暴怒也当受咒诅，因其严酷。我要将他们分开在雅各中，散布在以色列中。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָרוּר
  choice: 当受咒诅
  rationale: 该词是被动分词，在这里作诅咒宣告；“当受咒诅”既保留宣告的力度，也明确诅咒所指的是怒气和暴怒，而不是直接指向二人本身。
- source_word: אַפָּם
  choice: 他们的怒气
  rationale: אַף本义与鼻孔有关，但在此是表达发怒的惯用语；按现代汉语译出其惯用含义。
- source_word: עָז
  choice: 猛烈
  rationale: 该词表示强烈、有力；修饰怒气时，“猛烈”自然地传达其强暴的程度。
- source_word: עֶבְרָתָם
  choice: 他们的暴怒
  rationale: עֶבְרָה表示汹涌、越界般的烈怒；“暴怒”既与前面的“怒气”有所区别，也保留诗句递进的强度。
- source_word: קָשָׁתָה
  choice: 严酷
  rationale: 该词在此表达刚硬、严厉或残酷的性质；“严酷”保留其基本语义，同时不过度将经文解释为单一的道德评价。
- source_word: אֲחַלְּקֵם
  choice: 我要使他们分散
  rationale: 该动词为强调词干第一人称单数，带第三人称复数宾语后缀；“使他们分散”表达将他们拆分在群体之中的意思，并与下一分句形成近义平行而非完全重复。
- source_word: בְּיַעֲקֹב
  choice: 在雅各中
  rationale: “雅各”在这里兼指其后裔组成的民族；直译保留与“在以色列中”的诗体对应。
- source_word: וַאֲפִיצֵם
  choice: 使他们散布
  rationale: 使役词干表示令其散开；“散布”与前面的“分散”相应，同时保留两个希伯来动词的区别。
- source_word: בְּיִשְׂרָאֵל
  choice: 在以色列中
  rationale: 保留原文用“雅各”和“以色列”构成的平行结构，不将两个名称合并。
theological_decisions:
- issue: 诅咒的对象
  choice: 诅咒落在西缅和利未的怒气与暴怒上
  alternative: 将西缅和利未本人直接视为受咒诅者
  rationale: 希伯来文明确以“他们的怒气”和“他们的暴怒”为אָרוּר所指的对象，因此译文维持原文对其暴烈性情与行为的谴责，不把诅咒对象扩大为二人本身。
- issue: 第一人称宣告的主语
  choice: 保留“我要”的第一人称，不在正文中指明究竟由雅各还是上帝施行
  alternative: 解释为“上帝要使他们分散”或明确说“雅各宣告自己要使他们分散”
  rationale: 原文只有第一人称动词，语境容许将其理解为雅各的先知性宣告，但正文不补入原文未明说的主语身份，以保留其表达张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话，保留希伯来诗歌中“怒气／暴怒”“分散／散布”“雅各／以色列”的平行层次。为使汉语结构清楚，在第二分句补出“也当受咒诅”，这是原文谓语辖域在汉语中的自然展开，并未增加新的诅咒对象。
