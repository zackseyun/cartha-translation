  rationale: 修订仅恢复两个希伯来动词的区别：אֲחַלְּקֵם译作“将他们分开”，וַאֲפִיצֵם译作“散布”。“在雅各中／在以色列中”保留原文的平行名称；第一人称“我要”不指定施行者身份。前半句以“因其”明确原因分句的所指，同时维持原有庄重语体及诅咒对象的限定。
