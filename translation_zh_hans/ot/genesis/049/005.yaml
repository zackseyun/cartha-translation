  yaml_path: translation/ot/genesis/049/005.yaml
  text: Simeon and Levi are brothers[a]; weapons of violence are their swords.
translation:
  language: zh_hans
  text: 西缅和利未是兄弟；施暴的兵器，是他们的刀剑[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “刀剑”所译的希伯来词罕见，词义不确定。也可译作：“施暴的兵器，是他们的器具。”一些较早的译本则作“他们的住处”。
    reason: 说明罕见词 מְכֵרֹתֵיהֶם 的词义不确定，并保留主要异译。
lexical_decisions:
- source_word: שִׁמְעוֹן
  choice: 西缅
  rationale: 按现代中文圣经中通行的人名译法音译。
- source_word: וְלֵוִי
  choice: 和利未
  rationale: 将连词自然译为“和”，人名按现代中文通行译法音译。
- source_word: אַחִים
  choice: 是兄弟
  rationale: 原文是无系词名词句；中文补出“是”以表达完整谓语。“兄弟”既保留二人的血缘关系，也不消除他们在行为上的联合。
- source_word: כְּלֵי חָמָס
  choice: 施暴的兵器
  rationale: כְּלֵי 可泛指器具，在 חָמָס（暴力、暴行）的语境中具有武器含义；“施暴的兵器”既自然，又保留其用于暴力的关系。
- source_word: מְכֵרֹתֵיהֶם
  choice: 他们的刀剑
  rationale: 该词罕见且词义不确定；依据语境及将其理解为武器的传统译作“刀剑”，同时以脚注保留“器具”和“住处”等重要异译。
