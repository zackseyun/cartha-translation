source:
  edition: WLC
  text: בְּ/סֹדָ/ם֙ אַל תָּבֹ֣א נַפְשִׁ֔/י בִּ/קְהָלָ֖/ם אַל תֵּחַ֣ד כְּבֹדִ֑/י כִּ֤י בְ/אַפָּ/ם֙ הָ֣רְגוּ אִ֔ישׁ וּ/בִ/רְצֹנָ֖/ם עִקְּרוּ שֽׁוֹר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/006.yaml
  text: Let my soul not enter their council[a]; let my honor not be joined to their assembly. For in their anger they killed a man[c][b], and in their self-will they hamstrung an ox.
translation:
  language: zh_hans
  text: 我的灵不可进入他们的议事会[a]；愿我的尊荣不与他们的集会相合[b]。因为他们在怒气中杀了人，又随己意砍断牛的腿筋[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “议事会”或译“密会”；סוֹד可指秘密或亲密圈子中的商议、议事群体。
    reason: lexical_alternative
  - marker: b
    text: “我的尊荣”或译“我的荣耀”。
    reason: lexical_alternative
  - marker: c
    text: 马所拉文本作“牛”。有些人以不同方式理解这里的辅音，将末句译作“又拆毁了一面墙”。
    reason: alternative_reading
lexical_decisions:
- source_word: בְּסֹדָם
  choice: 他们的密会
  rationale: סוֹד可指亲密、秘密的议事圈或密议；结合与“会众”的诗体平行，“密会”既保留群体聚议之意，也体现其非公开色彩，但脚注保留较中性的译法。
- source_word: תָּבֹא נַפְשִׁי
  choice: 我的灵不可进入
  rationale: אַל加未完成式在此表达强烈的否定意愿；保留“我的灵”这一希伯来诗歌中的自指方式，不将其简化为“我”。
- source_word: בִּקְהָלָם
  choice: 他们的会众
  rationale: קָהָל指聚集起来的群体或大会；“会众”简洁庄重，并与前句的“密会”形成平行。
- source_word: תֵּחַד כְּבֹדִי
  choice: 我的尊荣不可与……联合
  rationale: יחד在此表示联合、相连；כָּבוֹד可指荣耀、尊荣或声誉。“尊荣”在本句中自然地表达雅各不愿自己的尊严和名誉沾染他们暴行的意思，同时以脚注保留“荣耀”。
- source_word: בְאַפָּם
  choice: 在怒气中
  rationale: אַף在此是“怒气、烈怒”的惯用义；此译法直接保留原文介词结构。
- source_word: הָרְגוּ אִישׁ
  choice: 杀了人
  rationale: 保留אִישׁ的单数表达，不擅自泛化为“众人”；中文“杀了人”可自然表达不定指单数。
- source_word: וּבִרְצֹנָם
  choice: 随己意
  rationale: רָצוֹן可表示意愿或喜好；在谴责暴行的语境中，“随己意”传达任性而行的意味，又不过度增添原文没有的评断词。
- source_word: עִקְּרוּ
  choice: 砍断……腿筋
  rationale: עקר与牲畜连用时通常指割断或砍断后腿筋，使其残废；采用具体、易懂的现代汉语表达。
- source_word: שׁוֹר
  choice: 牛
  rationale: 马所拉读音明确为“牛、公牛”；中文“牛”不强加性别或役用状态，适合此处泛指。
theological_decisions:
- issue: 诗歌自指语中כָּבוֹדִי的理解
  choice: 我的尊荣
  alternative: 我的荣耀
  rationale: 此处重在雅各使自己的尊严、名誉与西缅和利未的暴行划清界限。“尊荣”在现代汉语中较自然，也避免让“荣耀”被误听为专属神学术语；原文确有“荣耀”的词义，故列入脚注。
- issue: 末句שׁוֹר的读法
  choice: 牛
  alternative: 墙
  rationale: 马所拉元音将其读作שׁוֹר（牛），且与表示砍断腿筋的עקר搭配合理。部分解释依据另一种辅音理解译作“墙”，这一重要异读在脚注中保留，不在正文中替代马所拉文本。
translation_notes:
  register: 采用现代、庄重而易懂的诗体散文；两个否定分句保持平行，后两个原因分句也保持对应。“不可”表达强烈的拒绝和疏离；“砍断牛的腿筋”将古代动作明确化而不使用生僻术语。
