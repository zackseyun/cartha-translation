id: GEN.49.26
reference: Genesis 49:26
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: בִּרְכֹ֣ת אָבִ֗י/ךָ גָּֽבְרוּ֙ עַל בִּרְכֹ֣ת הוֹרַ֔/י עַֽד תַּאֲוַ֖ת גִּבְעֹ֣ת עוֹלָ֑ם תִּֽהְיֶ֨ין֙ לְ/רֹ֣אשׁ יוֹסֵ֔ף וּ/לְ/קָדְקֹ֖ד נְזִ֥יר אֶחָֽי/ו־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/026.yaml
  text: The blessings of your father have prevailed beyond the blessings of my parents[a], to the utmost bounds of the ancient hills. May they be on the head of Joseph[b], and on the crown of the head of the one set apart from his brothers.
translation:
  language: zh_hans
  text: 你父亲的福分，胜过我祖先的福分，直到亘古山冈的极处[a]。愿这些福临到约瑟的头上，临到那从弟兄中分别出来的人的头顶[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本句原文含义不确定；“极处”也可理解为“亘古山冈所向往的佳美之物”。“亘古山冈”也可译作“永恒的山冈”。
    reason: 保留 תַּאֲוַת 的词义及其在此困难诗句中的句法解释，并保留 עוֹלָם 可指久远或永恒的可能性。
  - marker: b
    text: “从弟兄中分别出来的人”也可译作“在弟兄中作首领的人”或“弟兄中被分别为圣的人”。
    reason: 保留 נְזִיר 可指分别、奉献，或卓然居首之身份的解释空间。
lexical_decisions:
- source_word: בִּרְכֹת אָבִיךָ
  choice: 你父亲所赐的福
  rationale: 保留复数所表达的多重福分，但按现代汉语习惯用集合性的“福”；“你父亲”符合雅各直接对约瑟说话的语境。
- source_word: גָּבְרוּ עַל
  choice: 胜过
  rationale: 该动词与介词组合表达强盛、超越的比较关系；“胜过”简洁自然，也保留诗句中的优胜意味。
- source_word: בִּרְכֹת הוֹרַי
  choice: 我双亲所赐的福
  rationale: הוֹרַי 字面指生育雅各的人，用“双亲”准确表达复数，并比“祖先”更贴近词义。
- source_word: עַד תַּאֲוַת גִּבְעֹת עוֹלָם
  choice: 直达亘古山冈的极境
  rationale: 这是含义困难的诗句。结合 עַד 所表达的范围，将 תַּאֲוַת 理解为所达的极处；“亘古山冈”保留 עוֹלָם 在此处表示年代久远而又带诗意的语感。
- source_word: תִּהְיֶיןָ
  choice: 愿这些福临到
  rationale: 在祝福宣告中，未完成式带有愿望或祈愿语气；“愿……临到”符合汉语祝福体裁。
- source_word: לְרֹאשׁ / לְקָדְקֹד
  choice: 临到……头上／临到……头顶
  rationale: 两词形成诗体平行；“头上”和“头顶”既有区别，也保留福分落在受福者身上的形象。
- source_word: נְזִיר אֶחָיו
  choice: 那与弟兄分别之人
  rationale: נְזִיר 的核心含义是被分别、离开众人；此译不把它提前技术化为后来的“拿细耳人”，也不直接限定为政治性的“首领”。
theological_decisions:
- issue: 约瑟称号 נְזִיר אֶחָיו 的含义
  choice: 那与弟兄分别之人
  alternative: 那在弟兄中作首领的人；弟兄中被分别为圣的人
  rationale: “分别之人”保留该词关于分离或奉献的基本语义，也契合约瑟独特的经历和地位，同时避免断定它专指拿细耳制度或王侯身份。不同解释列入脚注，以保留诗句的张力。
- issue: תַּאֲוַת גִּבְעֹת עוֹלָם 这一诗句的理解
  choice: 亘古山冈的极境
  alternative: 亘古山冈的佳美之物；永恒山冈的愿望
  rationale: 原文措辞罕见且含混。正文采用在上下文中较通顺的范围解释，但脚注保留更贴近 תַּאֲוַת 常见词义的可能译法。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“所赐的福”使省略关系更符合汉语表达；“直达”“亘古”“头顶”保留希伯来诗歌的空间意象和平行结构。所有歧义均在正文或脚注中保留，未引入特定宗派术语。
