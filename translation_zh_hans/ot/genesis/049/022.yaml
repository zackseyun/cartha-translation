  text: בֵּ֤ן פֹּרָת֙ יוֹסֵ֔ף בֵּ֥ן פֹּרָ֖ת עֲלֵי עָ֑יִן בָּנ֕וֹת צָעֲדָ֖ה עֲלֵי שֽׁוּר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/022.yaml
  text: Joseph is a fruitful son[a], a fruitful son by a spring[b]; daughters step over the wall.
translation:
  language: zh_hans
  text: '约瑟是多结果实的儿子[a]，

    是泉边多结果实的儿子；

    女儿们[b]迈步越过墙垣。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“约瑟是结果累累的枝子，是泉边结果累累的枝子。”希伯来原文诗意浓缩；传统的“枝子”译法更明确地解释了其中的植物意象。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“女儿们”；这里也可能以此比喻越过墙垣伸展的枝条或嫩枝。
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּן
  choice: 儿子
  rationale: 该词的通常含义是“儿子”。虽然上下文中的植物意象使“枝子”成为可能的解释，但正文保留希伯来语直陈而略显凝练的表达。
- source_word: פֹּרָת
  choice: 多结果子的
  rationale: 该词与“结果子、繁衍”相关；译作“多结果子的”既保留其形容性作用，也与本节的丰盛、生长意象相合。
- source_word: בֵּן פֹּרָת
  choice: 多结果子的儿子
  rationale: 原短语富有诗意且较为凝练。此译保留两个词各自的基本意义；“结果累累的枝子”作为较明确的植物意象解释列入脚注。
- source_word: עֲלֵי עָיִן
  choice: 泉边
  rationale: עַיִן既可指“眼睛”，也可指“泉”。在丰产与生长的语境中，“泉”最为自然；介词短语按现代汉语译作“泉边”。
- source_word: בָּנוֹת
  choice: 女儿们
  rationale: 该词字面义为“女儿们”。它可能隐喻枝条或嫩枝，但正文不消解这一诗性歧义，而在脚注说明。
- source_word: צָעֲדָה
  choice: 迈步越过
  rationale: 该动词表示迈步、行进；“迈步越过”在汉语中保持动态画面，并能与墙垣这一界限自然搭配。
- source_word: עֲלֵי שׁוּר
  choice: 越过墙垣
  rationale: שׁוּר在此宜理解为“墙”。“越过墙垣”传达生长或行动突破边界的诗意图景。
