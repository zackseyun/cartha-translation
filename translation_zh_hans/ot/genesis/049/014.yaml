  yaml_path: translation/ot/genesis/049/014.yaml
  text: Issachar is a strong-boned donkey[a], lying down between the sheepfolds.
translation:
  language: zh_hans
  text: 以萨迦是一头骨骼强壮的驴，卧在羊圈[a]之间。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“卧在一对驮篓之间。”这里的希伯来词十分罕见，含义尚有争议；“羊圈”是传统解释，也很符合本段的牧业图景。
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשָּׂשכָר
  choice: 以萨迦
  rationale: 采用现代中文圣经中通行的人名音译，清楚且便于读者辨认。
- source_word: חֲמֹר
  choice: 驴
  rationale: 原词基本义为“驴”；希伯来语此处未要求明确译作公驴，故不作过度限定。
- source_word: גָּרֶם
  choice: 骨骼强壮
  rationale: 该词本义与“骨头”有关，在此作修饰语，描述驴体格结实；译作“骨骼强壮”既保留具体意象，也避免“骨瘦如柴”的误解。
- source_word: רֹבֵץ
  choice: 卧
  rationale: 分词描写牲畜伏卧或躺卧的状态；“卧”简洁自然，也符合诗歌语体。
- source_word: בֵּין
  choice: 在……之间
  rationale: 直接表达该介词的空间关系，不作不必要的泛化。
- source_word: הַמִּשְׁפְּתָיִם
  choice: 羊圈
  rationale: 这是罕见且有争议的双数形式；正文采用传统且符合牧业图景的“羊圈”，同时以脚注保留“驮篓”等可能解释。
