base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/030.yaml
  text: in the cave that is in the field of Machpelah[a], which is opposite Mamre, in the land of Canaan[d][c][b], which Abraham bought with the field from Ephron the Hittite as a burial property.
translation:
  language: zh_hans
  text: 在迦南地、幔利对面[a]的麦比拉田里的洞中。那块田是亚伯拉罕从赫人以弗仑手中买来作坟地产业[b]的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “对面”也可译作“面向”或“前面”；希伯来语原文是在说明麦比拉田相对于幔利的位置。
    reason: lexical_alternative
  - marker: b
    text: “坟地产业”也可译作“安葬用的产业”；原文强调这是依法持有、指定用来安葬的地产。
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּמְּעָרָה אֲשֶׁר בִּשְׂדֵה הַמַּכְפֵּלָה
  choice: 在麦比拉田里的洞中
  rationale: 保留介词所表达的地点关系，并把连续关系从句自然地整合为现代汉语定语结构；“麦比拉”按专名音译。
- source_word: אֲשֶׁר עַל פְּנֵי מַמְרֵא
  choice: 幔利对面的
  rationale: עַל פְּנֵי 在这里表示相对于幔利的空间位置；“对面”简洁自然，同时不把它弱化为单纯的“附近”。
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: 在迦南地
  rationale: 这是直接、通行的地理表达。
- source_word: אֲשֶׁר קָנָה אַבְרָהָם אֶת הַשָּׂדֶה
  choice: 那块田是亚伯拉罕……买来
  rationale: אֶת 明确标示“那块田”为“买”的直接宾语。另起一句并以“那块田”为主题，可在自然汉语中准确处理希伯来语关系词与重复宾语的结构，避免误译为“连同那块田买下洞”。
- source_word: מֵאֵת עֶפְרֹן הַחִתִּי
  choice: 从赫人以弗仑手中
  rationale: מֵאֵת 标明交易的卖方或来源；“赫人”翻译族称，“以弗仑”音译人名。“从……手中”符合汉语买卖语境。
- source_word: לַאֲחֻזַּת קָבֶר
  choice: 作坟地产业
  rationale: “坟地”表达安葬用途，“产业”保留 אֲחֻזָּה 所含合法持有、不动产归属的意味。
theological_decisions:
- issue: 购买对象及产业归属
  choice: 明确亚伯拉罕买下的是“那块田”，并将其用作坟地产业
  alternative: 译作亚伯拉罕“连同那块田”买下洞
  rationale: 希伯来语 אֶת הַשָּׂדֶה 将“那块田”标为 קָנָה 的直接宾语。上下文虽表明洞随田一并归属亚伯拉罕，但本节语法不宜改写为“连同田买下洞”。这样既保留土地合法取得的叙事重点，也不额外引入宗派性解释。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。原文承接上一节，是一个地点短语；译文保留这一承接感，并把末尾冗长的关系结构拆为第二句，以免误认购买对象。专名采用现代中文圣经中通行的译名“迦南、幔利、麦比拉、以弗仑”。
