  yaml_path: translation/ot/genesis/049/020.yaml
  text: Asher's food will be rich[a], and he will provide royal delicacies.
translation:
  language: zh_hans
  text: 亚设的食物必丰美[a]；他必供给君王的佳肴。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“亚设出产的饼肥美；他必给出君王的美味佳肴。”
    reason: 保留שְׁמֵנָה的较直译“肥美”、לֶחֶם的具体义“饼”，并以“给出”反映יִתֵּן的基本义。
lexical_decisions:
- source_word: מֵאָשֵׁר
  choice: 亚设出产的
  rationale: 介词 מִן 表示来源，可指来自亚设支派或其地域；译作“亚设出产的”既保留来源含义，也使希伯来语无动词分句在现代汉语中自然通顺。
- source_word: שְׁמֵנָה
  choice: 丰美
  rationale: 该词本义为“肥、肥美”，在此形容食物富足优良；“丰美”兼顾丰富与上佳，避免现代汉语中“肥的食物”可能产生的误解。
- source_word: לַחְמוֹ
  choice: 食物
  rationale: לֶחֶם 可专指“饼”，也可泛指食物或粮食；下句谈到佳肴，此处采用较宽泛的“食物”，并在脚注保留“饼”的直译。第三人称单数词尾所表达的归属关系已由“亚设出产的”体现。
- source_word: וְהוּא
  choice: 他
  rationale: 独立代词强调并重新指向亚设；汉语用“他”保留其拟人化表达。
- source_word: יִתֵּן
  choice: 必供给
  rationale: נָתַן 基本义为“给”；在出产并供应佳肴的语境中，“供给”自然贴切，“必”体现祝福诗歌中未完成式所指向的将来。
- source_word: מַעֲדַנֵּי
  choice: 佳肴
  rationale: 该词指令人喜悦的精美食物；“佳肴”是现代汉语中庄重而易懂的对应表达。
- source_word: מֶלֶךְ
  choice: 君王的
  rationale: 保留希伯来语属格结构“君王的佳肴”，不把它完全改写为形容词，从而容纳“供君王享用”或“王室级别”两层相近含义。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而简洁的祝福诗体。“丰美”“佳肴”“君王”易于普通读者理解，同时保留原文的诗意与亚设作为支派／地域却用男性代词指称的拟人化表达。
