  text: פַּ֤חַז כַּ/מַּ֨יִם֙ אַל תּוֹתַ֔ר כִּ֥י עָלִ֖יתָ מִשְׁכְּבֵ֣י אָבִ֑י/ךָ אָ֥ז חִלַּ֖לְתָּ יְצוּעִ֥/י עָלָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/004.yaml
  text: Unstable as water[a], you shall not excel, because you went up to your father’s bed; then you defiled it—he went up to my couch.
translation:
  language: zh_hans
  text: 你如水般轻浮不定[a]，必不得居首；因为你上了你父亲的床。那时你玷污了我的卧榻——他上去了！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “轻浮不定”也可译作“轻率冲动”或“奔放难制”。末句希伯来文按语序直译为“我的卧榻——他上去了”，突然从第二人称转为第三人称；也可较顺畅地理解为：“那时你玷污了我的卧榻——你上去了！”这里的“他”可能是雅各以感叹语气再次指流便。
    reason: 保留פַּחַז的语义幅度，并准确说明末句第三人称突变、原文语序及较顺畅的替代理解。
lexical_decisions:
- source_word: פַּחַז
  choice: 放纵不定
  rationale: 此词兼有不稳定、轻率冲动和不受约束之意。“放纵不定”既能与水的比喻自然搭配，也保留对流便性情与行为的道德评价。
- source_word: כַּמַּיִם
  choice: 如水般
  rationale: 直接保留原文的明喻，表达水难以约束、流动不定的形象。
- source_word: אַל תּוֹתַר
  choice: 必不得居首
  rationale: יתר在此涉及优势或尊位；结合长子名分的语境，“不得居首”比泛泛的“不得昌盛”更准确，同时没有把后文未明说的制度细节加入本节。
- source_word: כִּי עָלִיתָ
  choice: 因为你上了
  rationale: 保留כִּי的因果关系及“上去”这一含蓄但可理解的性行为委婉说法。
- source_word: מִשְׁכְּבֵי אָבִיךָ
  choice: 你父亲的床
  rationale: 希伯来文为复数形态，可指床铺或寝床；现代汉语用单数“床”更自然，也清楚指向父亲的婚床。
- source_word: חִלַּלְתָּ
  choice: 玷污了
  rationale: 此动词可指亵渎或使之污秽；在性与家庭伦理语境中，“玷污”清楚自然，并保留严厉的道德分量。
- source_word: יְצוּעִי
  choice: 我的卧榻
  rationale: 保留第一人称“我的”，并以“卧榻”对应床榻、铺位之义，与前面的“床”有所区别而不失庄重。
- source_word: עָלָה
  choice: 他竟上去了
  rationale: 严格保留马所拉文本第三人称阳性单数的突兀转换；加入“竟”表现感叹语气，但不把“他”暗改成“你”。
theological_decisions:
- issue: 对流便性行为的委婉表达及道德评价
  choice: 译作“上了你父亲的床”和“玷污了”，保持原文含蓄而清楚的指控。
  alternative: 明确扩译为“与父亲的妾同寝”，或采用较礼仪化的“亵渎”。
  rationale: 原文以寝床为委婉说法，本节没有直接重述创世记35:22的全部细节。译文不淡化罪行，也不从其他经文补入本句未明说的信息。
- issue: 末句עָלָה的人称突变
  choice: 正文保留第三人称：“他竟上去了！”
  alternative: 顺译为“你上了我的卧榻”，或将末句整体整理为“你上去玷污了我的卧榻”。
  rationale: 马所拉文本从第二人称突然转为第三人称，语法与修辞都较突兀。保留这一形式可避免静默消除真实歧义，并以脚注说明较顺畅的理解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“卧榻”略带诗体色彩，适合雅各祝言的语域；正文刻意保留末句突然转为第三人称的修辞冲击。
