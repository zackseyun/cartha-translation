  to: 你如水般轻浮不定[a]，必不得居首；因为你上了你父亲的床。那时你玷污了我的卧榻——他上去了！
  rationale: 修订“放纵不定”为更自然且语义较宽的“轻浮不定”。末句保留马所拉文本的第三人称突变和原有语序，将“我的卧榻”置于“他上去了”之前，使汉语能理解其处所关联，而不将“他”静默改成“你”。脚注相应更正为对原文语序和替代顺译的准确说明。
