base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/013.yaml
  text: Zebulun will dwell by the shore of the seas[a]; he will be by the shore of ships[c][b], and his flank will be toward Sidon.
translation:
  language: zh_hans
  text: 西布伦必住在众海之滨[a]；他也必在船只出入的海岸边[b]；他的边侧必延向西顿[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “众海”原文为复数；也可按中文习惯译作“海边”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“在船只的港湾”。原文直译为“在船只的岸边”。
    reason: lexical_alternative
  - marker: c
    text: “边侧”也可译作“侧面”、“边界”或“尽头”；这里是在地域意义上使用。
    reason: lexical_alternative
lexical_decisions:
- source_word: זְבוּלֻן
  choice: 西布伦
  rationale: 按现代中文圣经人名的通行译法音译。
- source_word: לְחוֹף יַמִּים
  choice: 在众海岸边
  rationale: חֹוף 表示岸、海岸；יַמִּים 是复数，正文以“众海”保留原文形式及其可能指广阔海域的意味。介词 לְ 在此按地点关系译为“在……边”。
- source_word: יִשְׁכֹּן
  choice: 必住
  rationale: שכן 的未完成式在祝福预言语境中表达将来的居住或定居；“必住”简洁而庄重。
- source_word: וְהוּא
  choice: 他
  rationale: 明确保留代词，以呈现希伯来诗句中的强调和平行结构；连接词则按自然中文不另译。
- source_word: לְחוֹף אֳנִיּוֹת
  choice: 在船只的岸边
  rationale: 尽量贴近原文“船只之岸”的具体意象，不在正文中扩译为较具解释性的“港口”。
- source_word: וְיַרְכָתוֹ
  choice: 他的侧翼
  rationale: יַרְכָה 可指侧面、边缘或尽头；“侧翼”保留身体隐喻，同时可用于地域描述，其他可能译法列入脚注。
- source_word: עַל צִידֹן
  choice: 朝向西顿
  rationale: עַל 与地名连用时可表达方位或延伸方向；“朝向”既自然，又避免把疆界关系解释得过于确定。
- source_word: צִידֹן
  choice: 西顿
  rationale: 采用现代中文圣经地名的通行音译。
