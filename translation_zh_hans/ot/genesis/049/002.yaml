  yaml_path: translation/ot/genesis/049/002.yaml
  text: Gather yourselves and listen[a], sons of Jacob; listen to Israel your father.
translation:
  language: zh_hans
  text: 雅各的儿子们，你们要聚集，要听；要听你们的父亲以色列。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִקָּבְצוּ
  choice: 你们要聚集
  rationale: 该词是קבץ的尼法勒命令式复数，呼召众子聚到一起。“你们要聚集”在现代汉语中自然，也保留了共同聚集的语义。
- source_word: שִׁמְעוּ
  choice: 要听
  rationale: 命令式在此要求专心聆听，而不只是听见声音。“要听”简洁庄重，并保留原文两次重复所形成的强调。
- source_word: בְּנֵי יַעֲקֹב
  choice: 雅各的儿子们
  rationale: 原文明确为阳性复数，所指是聚集来领受话语的雅各众子，因此不泛化为“儿女”或“子孙”。
- source_word: שִׁמְעוּ אֶל
  choice: 要听
  rationale: 介词אֶל标明听从、留心的对象；汉语直接说“要听你们的父亲以色列”即可自然表达这一关系，并避免添加原文没有的解释性词语。
- source_word: יִשְׂרָאֵל
  choice: 以色列
  rationale: 保留专名，并与前句的“雅各”形成原文刻意安排的平行。
- source_word: אֲבִיכֶם
  choice: 你们的父亲
  rationale: 按原文的复数第二人称领属关系直译；置于“以色列”之前，符合现代汉语的自然语序，同时保留二者的同位关系。
theological_decisions:
- issue: 雅各与以色列两个名字的平行
  choice: 在正文中分别保留“雅各的儿子们……你们的父亲以色列”
  alternative: 为行文顺畅而统一使用“雅各”或“以色列”一个名字
  rationale: 希伯来文有意并列两个名字，具有诗歌修辞和身份层面的张力；译文不将其合并或解释化。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留两个“要听”，使原文的重复命令和诗性强调清楚可见；标点呈现两个平行呼召。
