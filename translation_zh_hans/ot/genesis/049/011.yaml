  text: אֹסְרִ֤י לַ/גֶּ֨פֶן֙ עיר/ה וְ/לַ/שֹּׂרֵקָ֖ה בְּנִ֣י אֲתֹנ֑/וֹ כִּבֵּ֤ס בַּ/יַּ֨יִן֙ לְבֻשׁ֔/וֹ וּ/בְ/דַם עֲנָבִ֖ים סות/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/011.yaml
  text: Binding his donkey to the vine[a], and his donkey’s colt to the choice vine, he washes his garments in wine[c][b], and his robe in the blood of grapes.
translation:
  language: zh_hans
  text: 他把他的小驴拴在葡萄树上[a]，把他母驴所生的驹拴在上等的葡萄树上[b]；他在酒中洗衣服，在葡萄的血[c]中洗袍子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “小驴”也可译作“驴驹”；希伯来语 עַיִר 指幼驴或驴驹。
    reason: lexical_alternative
  - marker: b
    text: “上等的葡萄树”也可译作“佳美的葡萄树”；希伯来语 שֹׂרֵקָה 指精选或优良品种的葡萄树。
    reason: lexical_alternative
  - marker: c
    text: “葡萄的血”是希伯来诗歌中指葡萄汁或酒的形象说法；正文保留这一意象。
    reason: cultural_note
lexical_decisions:
- source_word: אֹסְרִי
  choice: 拴
  rationale: 这是动词 אסר 的主动分词，在诗歌中描绘鲜明、持续可见的动作。现代汉语不必勉强复制分词形式，用“拴”配合全句的图景式叙述，既自然又保留其生动感。
- source_word: לַגֶּפֶן
  choice: 在葡萄树上
  rationale: גפן 指葡萄树；介词 ל 表示系拴的着落处，汉语惯用“拴在……上”。原文单数在此可作类别性表达。
- source_word: עירֹה
  choice: 自己的驴驹
  rationale: עַיִר 通常指幼驴或驴驹，并带第三人称阳性单数所属后缀。译作“自己的驴驹”明确表达所属关系，也不把它泛化为成年驴。
- source_word: וְלַשֹּׂרֵקָה
  choice: 把……拴在上等的葡萄树上
  rationale: שֹׂרֵקָה 指精选、优良品种的葡萄树。“上等的葡萄树”通俗而庄重，保留其品质上乘的含义。
- source_word: בְּנִי אֲתֹנוֹ
  choice: 母驴的驹
  rationale: 直译为“他母驴的儿子”。汉语用“母驴的驹”自然表达亲子关系和动物类别；所属关系在同一平行句的语境中清楚。
- source_word: כִּבֵּס
  choice: 洗
  rationale: 这是 Piel 完成式。祝福诗中可作为生动的完成式来展现特征性或将来的景象；汉语以无时态标记的“洗”保留这种时间上的开放性，不强行限定为过去或将来。
- source_word: בַּיַּיִן
  choice: 在酒中
  rationale: 介词 ב 保留为“在……中”，呈现衣物浸在酒中洗涤的夸张丰盛图景，而非仅把酒表达为工具。
- source_word: לְבֻשׁוֹ
  choice: 衣服
  rationale: לְבוּשׁ 虽为单数形式，却可集合性地指衣着。“衣服”是自然汉语，并与下一分句的“袍子”形成诗歌平行。
- source_word: וּבְדַם עֲנָבִים
  choice: 在葡萄的血中
  rationale: 保留“葡萄的血”这一具体而强烈的希伯来诗歌意象，不将其平化为“葡萄汁”或“酒”。
- source_word: סוּתוֹ
  choice: 袍子
  rationale: 这是与 לְבֻשׁוֹ 平行的衣物用语，具体形制并不确定。“袍子”庄重易懂，又不过度限定其样式。
theological_decisions:
- issue: 雅各对犹大的祝福中是否应明示弥赛亚含义
  choice: 正文只保留葡萄酒极其丰盛、尊荣富足的诗歌图景，不明加“弥赛亚”等解释。
  alternative: 把本节直接译成明确的弥赛亚预言，或仅视为对犹大支派历史繁荣的描述。
  rationale: 本节希伯来文本本身以夸张的葡萄树、酒和衣袍意象描绘丰盛。其在整段犹大祝福中的弥赛亚解释具有重要传统，但不是本节明说的内容，因此译文不替读者消除这一诠释张力。
- issue: כִּבֵּס 的时间指向
  choice: 采用汉语无明确时态的图景式表达“洗”。
  alternative: 明确译为“洗了”或“将要洗”。
  rationale: 希伯来诗歌中的完成式可描绘仿佛已经呈现的未来景象，也可表达特征性行动。汉语不标明过去或将来，更能保存原文在祝福语境中的时间张力。
translation_notes:
  register: 采用现代标准普通话，语气庄重而清楚。保留两组平行结构：“拴在……上”与“在……中洗……”，并保留“葡萄的血”的诗性意象。避免用文言“其”“之”等造成距离感，也不在正文加入弥赛亚或支派历史的解释。
