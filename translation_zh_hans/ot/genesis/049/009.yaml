  text: גּ֤וּר אַרְיֵה֙ יְהוּדָ֔ה מִ/טֶּ֖רֶף בְּנִ֣/י עָלִ֑יתָ כָּרַ֨ע רָבַ֧ץ כְּ/אַרְיֵ֛ה וּ/כְ/לָבִ֖יא מִ֥י יְקִימֶֽ/נּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/009.yaml
  text: Judah is a lion’s cub[a]; from the prey, my son, you have gone up. He crouched, he lay down like a lion[b], and like a lioness—who will rouse him?
translation:
  language: zh_hans
  text: 犹大是只小狮子；我儿啊，你从猎物那里上来了。他屈身，卧伏，如狮子，又如壮狮[a]；谁能使他起来呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “壮狮”译自一个不同于前面“狮子”的希伯来词；也可译作“母狮”或“大狮子”。
    reason: lexical_alternative
lexical_decisions:
- source_word: גּוּר אַרְיֵה
  choice: 小狮子
  rationale: גּוּר指幼兽，与אַרְיֵה构成“小狮子”之意；现代汉语自然明白，也保留成长与猛狮的意象。
- source_word: מִטֶּרֶף
  choice: 从猎物旁
  rationale: טֶרֶף是猛兽捕获或撕裂的猎物；介词מִן表示离开、从……而来。“从猎物旁”保留画面，同时避免把未明说的动作具体化。
- source_word: בְּנִי
  choice: 我儿啊
  rationale: 按雅各对犹大的直接称呼处理；“啊”自然体现汉语呼语语气，并未改变称谓内容。
- source_word: עָלִיתָ
  choice: 你……上来了
  rationale: 保留עלה的上行意义及第二人称形式，不把狮子离开猎物、返回高处等可能情景解释得过细。
- source_word: כָּרַע רָבַץ
  choice: 屈身蹲伏
  rationale: 两个连续动词分别传达俯身与卧伏；结合狮子意象译为“屈身蹲伏”，保留诗歌的动作层次。
- source_word: כְּאַרְיֵה
  choice: 如公狮
  rationale: אַרְיֵה是狮子的通称；此处用“公狮”与前面的幼狮形成成熟、强壮的意象，也与后一个近义词保持区别。
- source_word: וּכְלָבִיא
  choice: 又如壮狮
  rationale: לָבִיא可指强壮成熟的狮子，性别指向并不确定；“壮狮”比“母狮”更审慎地保留其力量重点和词义歧义。
- source_word: מִי יְקִימֶנּוּ
  choice: 谁敢使他起来呢？
  rationale: 字面为“谁使他起来”；在安卧猛狮的语境中，疑问含有无人敢惊动他的修辞意味。“敢”使现代汉语自然，但正文仍以“使他起来”保留קום的因使义。
theological_decisions:
- issue: 犹大狮子意象是支派祝福还是弥赛亚预表
  choice: 正文直接指向雅各祝福中的犹大，不明说弥赛亚意义。
  alternative: 把狮子意象明确解释为后来君王或弥赛亚盼望的预表。
  rationale: 本节直接称呼犹大，以狮子描绘其力量与安稳；后来的王权和弥赛亚关联可以在正典脉络中讨论，却不应被添加进本节正文。
- issue: לָבִיא的性别与形象
  choice: 译作“壮狮”，强调成熟强壮而不判定性别。
  alternative: 译作“母狮”或“雄狮”。
  rationale: 该词在诗歌中的确切性别指向存在词汇争议；采用不限定性别的“壮狮”可保留歧义，并与אַרְיֵה有所区分。
translation_notes:
  register: 采用现代、庄重而可朗读的诗体汉语。“小狮子—公狮—壮狮”呈现意象递进，并用脚注保留לָבִיא的词义不确定性；正文不加入后来的弥赛亚解释。
