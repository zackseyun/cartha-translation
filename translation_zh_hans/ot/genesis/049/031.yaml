  source_fidelity: 原文两次 קָבְרוּ 是未明说主语的第三人称复数主动式，草案“亚伯拉罕……葬在那里”在现代汉语中容易理解为无施事的被动/状态性表述，未充分呈现原文的复数人称施事。末句第一人称“我”及三次地点副词均已得到保留。
  naturalness: 改为“他们在那里葬了……”既是自然、庄重的现代汉语，也清楚表达原文未指明身份的复数施事者。三分句的重复保持原文列举节奏。
  terminology: “亚伯拉罕、撒拉、以撒、利百加、利亚”均为现代中文圣经中通行的人名译法；“葬”准确一致地对应三次 קבר。
