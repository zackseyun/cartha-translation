  text: There they buried Abraham and Sarah his wife; there they buried Isaac and Rebekah his wife; and there I buried Leah.
translation:
  language: zh_hans
  text: 他们在那里葬了亚伯拉罕和他的妻子撒拉；他们在那里葬了以撒和他的妻子利百加；我在那里葬了利亚。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׁמָּה
  choice: 在那里
  rationale: 该处所副词回指上文所说的洞与田地；“在那里”既自然又准确。
- source_word: קָבְרוּ
  choice: 葬
  rationale: 希伯来语为Qal完成式第三人称复数，主语未明说。汉语用主动结构“葬在那里”，不必补出身份不明的“他们”，同时保留有人执行安葬的语义。
- source_word: אִשְׁתּוֹ
  choice: 他的妻子
  rationale: 保留两处所属关系，分别表明撒拉是亚伯拉罕的妻子、利百加是以撒的妻子。
- source_word: קָבַרְתִּי
  choice: 我也把……葬在那里
  rationale: 明确保留第一人称单数，表明雅各亲自述说安葬利亚一事；“把”字句符合现代汉语表达。
- source_word: קָבְרוּ ... קָבְרוּ ... קָבַרְתִּי
  choice: 葬……葬……葬
  rationale: 三处统一译作“葬”，保留原文词根重复及整齐的列举结构。
- source_word: לֵאָה
  choice: 利亚
  rationale: 采用现代中文圣经人名的通行译法。
