base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/017.yaml
  text: Let Dan be a serpent by the road[a], a viper by the path, that bites the horse’s heels so that its rider falls backward.
translation:
  language: zh_hans
  text: 愿[a]但成为路旁的蛇，成为小径边咬马脚跟的毒蛇[b]，使骑马的人向后跌落。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “愿”也可译作“必成为”；原文在祝福语境中兼有愿望与宣告的意味。
    reason: grammatical_ambiguity
  - marker: b
    text: “毒蛇”所译的希伯来词十分罕见，也可译作某种“蝰蛇”；确切种类不详，但指一种危险的蛇。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהִי
  choice: 但愿……作
  rationale: 该词为היה的祈愿式，在雅各的祝福诗中兼有愿望与宣告色彩；“但愿……作”保留其意愿语气，又符合中文诗性表达。
- source_word: דָן
  choice: 但
  rationale: 采用现代中文圣经人名的通行译法。
- source_word: נָחָשׁ
  choice: 蛇
  rationale: 泛指蛇类；现代中文中“蛇”自然清楚，也能与下句较具体但物种不确定的蛇名形成平行。
- source_word: עֲלֵי דֶרֶךְ
  choice: 路旁
  rationale: 表达蛇位于道路边、伺机袭击的意象；比直译“路上”更自然，也避免暗示蛇必在路面中央。
- source_word: שְׁפִיפֹן
  choice: 毒蛇
  rationale: 这是罕见的蛇类名称，具体物种无法确定；“毒蛇”传达其危险性而不作过度精确的动物学判断。
- source_word: עֲלֵי אֹרַח
  choice: 小径边
  rationale: 与“路旁”构成诗歌平行，同时用“小径”保留אֹרַח与דֶרֶךְ之间近义而不完全相同的表达。
- source_word: הַנֹּשֵׁךְ
  choice: 它咬
  rationale: 分词描述前述蛇的典型行动；用独立分句在现代中文中清楚自然。
- source_word: עִקְּבֵי סוּס
  choice: 马的脚跟
  rationale: 指马后足的跟部；保留原文身体部位的形象，而不泛化为“马腿”。
- source_word: וַיִּפֹּל
  choice: 使……跌落
  rationale: 上下文显示骑手跌落是咬马脚跟所造成的结果；“使”自然表达该结果关系。
- source_word: רֹכְבוֹ
  choice: 骑马的人
  rationale: 代词后缀最自然地指向马；译为“骑马的人”比“它的骑手”更符合现代中文习惯。
- source_word: אָחוֹר
  choice: 向后
  rationale: 准确表达骑手跌落的方向，并保持动作画面的鲜明。
theological_decisions:
- issue: יְהִי在祝福中的语气
  choice: 译作“但愿……作”，保留祈愿色彩
  alternative: 译作“必成为”，理解为直接的预言性陈述
  rationale: 希伯来语形式是祈愿式，语境又带宣告性质；正文保留形式上的意愿语气，不把祝福与预言之间的张力单向化。
translation_notes:
  register: 采用自然、庄重而简洁的现代标准汉语，保留希伯来诗歌的两行平行结构及伏击、咬击、跌落的连贯意象。
