revisions:
- from: 但愿[a]作路旁的蛇，作小径边的毒蛇[b]；它咬马的脚跟，使骑马的人向后跌落。
  to: 愿[a]但成为路旁的蛇，成为小径边咬马脚跟的毒蛇[b]，使骑马的人向后跌落。
  rationale: 修订的必要原因是恢复被“但愿”遮蔽的专名“但”。“愿但成为”保留原文祈愿式在祝福语境中的愿望／宣告张力；将“咬马脚跟”纳入第二行蛇的描述，反映希伯来文分词的修饰作用。保留“使”表达咬击导致骑者后仰跌落的结果。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T04:27:30Z'
