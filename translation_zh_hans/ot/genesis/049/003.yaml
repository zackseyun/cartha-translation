base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/003.yaml
  text: Reuben[a], you are my firstborn, my strength and the firstfruits of my vigor[b], excelling in honor and excelling in power.
translation:
  language: zh_hans
  text: 吕便，你是我的长子，是我的力量，是我精力初发的果实[a]；尊荣超群，能力超群[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“我精力的开端”。希伯来语这一短语指父亲精力最初的表现，含有生育方面的意味。
    reason: lexical_alternative
  - marker: b
    text: 或译“在尊荣上居首，在能力上居首”。
    reason: lexical_alternative
lexical_decisions:
- source_word: רְאוּבֵן
  choice: 吕便
  rationale: 采用现代简体中文圣经语境中通行的人名译法，清楚自然。
- source_word: בְּכֹרִי
  choice: 我的长子
  rationale: 既表达出生次序，也保留长子在家庭身份与继承方面的含义。
- source_word: כֹּחִי
  choice: 我的力量
  rationale: 直接对应“力量、能力”，并保持诗句中父亲对长子的强烈称述。
- source_word: רֵאשִׁית אוֹנִי
  choice: 我旺盛生命力初结的果实
  rationale: רֵאשִׁית 表示起初、最先之物，אוֹן 在这里指父亲具有生育意味的精力或生命力；此译兼顾首生与生殖活力的含义，同时保持现代中文的庄重和可读性。
- source_word: יֶתֶר שְׂאֵת
  choice: 尊荣超群
  rationale: יֶתֶר 表达超越、居先，שְׂאֵת 可指高位、尊荣或尊贵；“尊荣超群”保留比较和卓越之意。
- source_word: יֶתֶר עָז
  choice: 能力超群
  rationale: עָז 指力量、威力；与前一分句采用平行结构，并避免与前面的“我的力量”完全重复。
- source_word: אַתָּה
  choice: 你是
  rationale: 保留希伯来文独立人称代词的强调作用，使直接称呼清楚有力。
