  yaml_path: translation/ot/genesis/049/023.yaml
  text: They bitterly attacked him[a], and shot at him, and hated him—the archers.
translation:
  language: zh_hans
  text: 他们苦待他[a]，又向他射箭，又仇恨他——这些弓箭手。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们使他受苦，又攻击他，又仇恨他——这些弓箭手。”中间的动词在希伯来文中较难确定；也可较笼统地理解为“与他争斗”或“袭击他”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמָרֲרֻהוּ
  choice: 苦苦攻击他
  rationale: 该词源于 מרר 的加强语干，带第三人称阳性单数宾语后缀，可表示“使他受苦、使他苦恼”或“苦待他”。结合本节连续的敌对动作，译为“苦苦攻击他”，既保留“苦”的语义色彩，也符合现代汉语表达。
- source_word: וָרֹבּוּ
  choice: 向他射箭
  rationale: 此形式的解释困难；按常见词根可理解为“增多”或引申为“相争、袭击”，但诗歌语境及末尾“弓箭手”的意象支持传统的“射击”理解。正文采用“向他射箭”，脚注保留其他可能。
- source_word: וַיִּשְׂטְמֻהוּ
  choice: 仇恨他
  rationale: שטם 表示怀有敌意、仇恨或敌视。“仇恨他”简洁地表达了这里强烈而持续的敌意。
- source_word: בַּעֲלֵי חִצִּים
  choice: 弓箭手
  rationale: 字面为“箭的拥有者/主人”，是指以箭为特征之人的习语，现代汉语自然译作“弓箭手”。将其前置为主语，使句意清楚，同时保留它统摄前三个敌对动作的作用。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事诗体。“苦苦攻击”保留首个动词的苦涩/苦待意味；“向他射箭”延续弓箭意象。为使汉语自然，将希伯来文末尾的施事者“弓箭手”前置，但未消除疑难动词本身的歧义，另以脚注说明。
