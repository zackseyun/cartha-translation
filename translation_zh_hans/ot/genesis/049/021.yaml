  yaml_path: translation/ot/genesis/049/021.yaml
  text: Naphtali is a doe let loose[b][a], giving beautiful words.
translation:
  language: zh_hans
  text: 拿弗他利是一只被放出的母鹿[a]，说出优美的话语[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“自由奔跑的母鹿”；希伯来文描绘一只被放出、可以自由奔跑的雌鹿。
    reason: lexical_alternative
  - marker: b
    text: 末句也有不同解释，可译作“他发出优美的言辞”；若对末尾几个词采用另一种词义分析，也可理解为“生下美丽的小鹿”。
    reason: alternative_reading
lexical_decisions:
- source_word: נַפְתָּלִי
  choice: 拿弗他利
  rationale: 按现代中文圣经人名的通行音译处理这一人名和支派名。
- source_word: אַיָּלָה
  choice: 母鹿
  rationale: 该词明确指雌鹿；“母鹿”自然清楚，也保留原诗的阴性动物意象。
- source_word: שְׁלֻחָה
  choice: 被放开的
  rationale: 这是שלח的被动形式；在母鹿的诗歌意象中，译作“被放开的”既贴近字面，也表达获准自由奔跑之意。
- source_word: הַנֹּתֵן
  choice: 说出
  rationale: 其基本意义为“给予”；与“话语”搭配时，现代汉语以“说出”较为自然。希伯来文为阳性单数形式，可能回指拿弗他利，而非语法上为阴性的母鹿。
- source_word: אִמְרֵי
  choice: 话语
  rationale: 这是אמר相关名词的复数构造形式，表示所说的话；“话语”适合庄重的诗体语域。
- source_word: שָׁפֶר
  choice: 优美的
  rationale: 该词表达美好、悦人之意；“优美”既可自然修饰“话语”，也保留诗意。
theological_decisions:
- issue: 末句分词结构的主语及意义
  choice: 将“说出优美的话语”理解为继续描述拿弗他利，同时不添加明确代词，以保留诗句的紧凑与一定的句法含混。
  alternative: 末句可理解为明确说“他发出优美的言辞”；也有解释根据不同词义分析，认为母鹿“生下美丽的小鹿”。
  rationale: 马所拉文本的元音标注直接支持“给予／说出优美话语”，而阳性分词较自然地回指“拿弗他利”。不过诗句高度凝练，古今解释并不一致，因此正文采用马所拉读法，脚注保留其他理解。
translation_notes:
  register: 采用现代、庄重而易懂的中文诗体表达。“被放开的母鹿”保留原文意象；末句不补出“他”，以避免过度限定其句法关系。
