  text: וַ/יְצַ֣ו אוֹתָ֗/ם וַ/יֹּ֤אמֶר אֲלֵ/הֶם֙ אֲנִי֙ נֶאֱסָ֣ף אֶל עַמִּ֔/י קִבְר֥וּ אֹתִ֖/י אֶל אֲבֹתָ֑/י אֶל הַ֨/מְּעָרָ֔ה אֲשֶׁ֥ר בִּ/שְׂדֵ֖ה עֶפְר֥וֹן הַֽ/חִתִּֽי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/029.yaml
  text: Then he commanded them and said to them[a], “I am about to be gathered to my people. Bury me with my fathers in the cave that is in the field of Ephron the Hittite,”
translation:
  language: zh_hans
  text: 他吩咐他们，说：“我快要归到我本族那里[a]。你们要把我与我列祖同葬，葬在赫人以弗仑田地里的那洞穴中。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我正在归到我本族那里。”这是希伯来语表示临近死亡的习语，也保留死后归到本族或先人那里的意味。
    reason: 说明希伯来语分词可按语境表达正在发生或将临的状态，并说明该习语的死亡与归聚意象，而不将其简化为单纯的“死亡”或界定具体来世教义。
lexical_decisions:
- source_word: וַיְצַו
  choice: 嘱咐
  rationale: 该动词表示郑重地吩咐或交代；此处是雅各临终托付，用“嘱咐”既保留命令的分量，也符合现代汉语语境。
- source_word: וַיֹּאמֶר אֲלֵהֶם
  choice: 他们说
  rationale: 与前面的“嘱咐”合成自然的汉语叙事句式“嘱咐他们说”，保留原文引出直接引语的结构。
- source_word: נֶאֱסָף אֶל־עַמִּי
  choice: 我快要归到我本族那里去了
  rationale: 保留“被收聚/归到自己族人那里”的死亡委婉语，不将其简化为“我要死了”；“快要”表达上下文中的临近之意。
- source_word: עַמִּי
  choice: 我本族那里
  rationale: עַם 在这一固定死亡用语中指死者所属的族人或先人群体。“本族”比单纯“人民”更符合现代汉语，也保留其群体和亲族色彩。
- source_word: קִבְרוּ אֹתִי
  choice: 你们要把我葬
  rationale: 复数祈使句；补出“你们”清楚传达复数受命者，并以“要”保持郑重指令的语气。
- source_word: אֶל־אֲבֹתָי
  choice: 在我祖先那里
  rationale: 介词字面为“到、向”，在安葬语境中表示葬在祖先所在之处；这一译法比“归到祖先那里”更能避免与前一句死亡委婉语混同。
- source_word: הַמְּעָרָה
  choice: 洞
  rationale: 原词意为洞穴；上下文已明确是安葬地点，无须增译“墓”。
- source_word: אֲשֶׁר בִּשְׂדֵה עֶפְרוֹן
  choice: 以弗仑田间的
  rationale: 以自然、紧凑的现代汉语表达“在以弗仑田地中的”，并保留地点与所有者关系。
- source_word: הַחִתִּי
  choice: 赫人
  rationale: 采用中文圣经传统且通行的族名译法，标明以弗仑的族属。
theological_decisions:
- issue: “归到我本族那里”所表达的死亡与归聚意象
  choice: 保留原文委婉语“我快要归到我本族那里去了”
  alternative: 我快要死了
  rationale: 原文不只直接陈述死亡，还以归到所属族群那里表达死亡。保留这一意象，可维持其家族性及潜在的死后归聚含义，而不据此建立超出经文所说的详细来世教义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“嘱咐”契合临终托付；“本族”保留 עַמִּי 的群体与亲族意味。主句维持原文意象，脚注交代时态可能性及委婉含义。
