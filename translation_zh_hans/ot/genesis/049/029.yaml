revisions:
- from: 他又嘱咐他们说：“我快要归到我本族那里去了[a]。你们要把我葬在我祖先那里，就是赫人以弗仑田间的洞里。
  to: 他吩咐他们，说：“我快要归到我本族那里[a]。你们要把我与我列祖同葬，葬在赫人以弗仑田地里的那洞穴中。”
  rationale: 修订补足了缺失的结束引号，并以“他吩咐他们”自然呈现叙事连接。“我快要归到我本族那里”保留原文的死亡习语而避免完成体色彩。“与我列祖同葬，葬在……洞穴中”清楚表达安葬关系、洞穴及其所在的田地，同时维持庄重的现代汉语文体。
