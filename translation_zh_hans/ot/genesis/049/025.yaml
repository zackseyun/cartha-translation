base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/025.yaml
  text: by the God of your father[a], who will help you, and by the Almighty, who will bless you with blessings of heaven above, blessings of the deep lying beneath[b], blessings of breasts and womb.
translation:
  language: zh_hans
  text: 你父亲的上帝必帮助你[a]；全能者必赐福给你：赐下来自上天的福，赐下下方伏卧的深渊之福[b]，赐下乳房和子宫的福。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“从你父亲的上帝而来……并与全能者有关。”希伯来文这里的介词和“全能者”前的助词句法紧缩，可表示来源、施动关系，也可理解为紧密的同位关系。
    reason: alternative_reading
  - marker: b
    text: “伏卧”也可译作“蹲伏”或“躺卧”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵאֵל אָבִיךָ
  choice: 你父亲的上帝
  rationale: אָבִיךָ直指约瑟的父亲；מִן在此诗行中句法紧缩，可表达来源或施动关系。正文借助后面的“必帮助你”自然呈现上帝为帮助的来源与施行者。
- source_word: יַעְזְרֶךָ
  choice: 必帮助你
  rationale: 保留第三人称单数主语和第二人称单数宾语，并以“必”表达祝福语境中的未完成式。
- source_word: אֵת שַׁדַּי
  choice: 全能者
  rationale: אֵת在此用法罕见，可能连接或同位于前句；正文将“全能者”作为后续动词的主语，不强行界定其与前一短语的句法关系。
- source_word: וִיבָרְכֶךָ
  choice: 必赐福给你
  rationale: 清楚保留动词的主语和受词关系，并符合现代汉语祝福语体。
- source_word: בִּרְכֹת שָׁמַיִם מֵעָל
  choice: 来自上天的福
  rationale: 保留“上”的垂直意象，并以自然汉语表达福分的来源。
- source_word: תְּהוֹם רֹבֶצֶת תָּחַת
  choice: 伏卧在地下的深渊
  rationale: תְּהוֹם指深处或地下水渊；רֹבֶצֶת可指躺卧或蹲伏。“伏卧”兼顾其具象诗意与词义张力。
- source_word: שָׁדַיִם וָרָחַם
  choice: 乳房和子宫
  rationale: 保留具体的身体意象，表达哺育、生育与丰产之福，不将原文概括为抽象的“儿女之福”。
theological_decisions:
- issue: 神圣称号שַׁדַּי的译法
  choice: 全能者
  alternative: 沙代
  rationale: 将称号译出而非音译；“全能者”是现代中文圣经语境中清楚、庄重且通行的对应，也不额外引入宗派性解释。
- issue: מֵאֵל与אֵת שַׁדַּי的紧缩句法
  choice: 以两个连续分句表达同一位上帝的帮助与赐福，同时用脚注保留来源、施动或伴同关系的可能性
  alternative: 从你父亲的上帝而来……并与全能者同在
  rationale: 希伯来语介词与אֵת的组合含混，正文需可读，但不应将某一种句法分析定为唯一解释。
translation_notes:
  register: 采用现代、庄重而易懂的祝福诗体。“上天／地下”保留上下平行意象；“乳房和子宫”直译具体生育意象，不作委婉化处理。所有脚注标记均已置于正文。
