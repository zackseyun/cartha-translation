source:
  edition: WLC
  text: לֹֽא יָס֥וּר שֵׁ֨בֶט֙ מִֽ/יהוּדָ֔ה וּ/מְחֹקֵ֖ק מִ/בֵּ֣ין רַגְלָ֑י/ו עַ֚ד כִּֽי יָבֹ֣א שילה וְ/ל֖/וֹ יִקְּהַ֥ת עַמִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/010.yaml
  text: The scepter will not depart from Judah[a], nor the ruler’s staff from between his feet, until Shiloh comes[b]; and to him will be the obedience of the peoples.
translation:
  language: zh_hans
  text: 权杖必不离开犹大，统治者的杖也必不离开他两脚之间，直到示罗来到[a]；万民都必归顺他[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “示罗”所对应的希伯来文含义很难确定。或译“直到那拥有合法权利者来到”；也有人将其理解为称号、地名，或与贡物有关。
    reason: alternative_reading
  - marker: b
    text: “归顺”或译为“聚集”或“臣服”。
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׁבֶט
  choice: 权杖
  rationale: 本节是君王诗歌语境，并与מְחֹקֵק平行；这里指统治权的标志，而不是“支派”或普通棍杖。
- source_word: מִיהוּדָה
  choice: 离开犹大
  rationale: 介词表示离开或脱离；“犹大”既保留专名，也没有擅自限定为个人、支派或地域。
- source_word: מְחֹקֵק
  choice: 统治者的杖
  rationale: 该词可指颁令者、统治者，也可指象征其权柄的杖。结合与“权杖”的平行及“在他两脚之间”的位置描写，译为统治者的杖最符合本节意象。
- source_word: מִבֵּין רַגְלָיו
  choice: 离开他两脚之间
  rationale: 保留希伯来文具体而含蓄的身体意象，不在正文中将其解释成后裔或王位传承。
- source_word: עַד כִּי
  choice: 直到
  rationale: 自然表达前述情形持续至某一时点，同时不额外说明此后权杖是否终止。
- source_word: שילה
  choice: 示罗
  rationale: 原文形式极为疑难。正文依传统读法音译为专名“示罗”，避免把有争议的词义直接定为唯一解释；其他主要理解列入脚注。
- source_word: וְלוֹ
  choice: 他
  rationale: 正文既将“示罗”作为具人格指向的专名，代词相应译作“他”，同时不进一步指明其身份。
- source_word: יִקְּהַת
  choice: 归顺
  rationale: 此罕见词的含义有争议。在王权语境中，“归顺”自然表达众民服从或效忠，又不如“聚集”那样选定另一词源解释。
- source_word: עַמִּים
  choice: 万民
  rationale: 复数形式指多个族群；“万民”是庄重自然的中文表达，并传达范围广泛，而不把它严格限定为现代民族国家。
theological_decisions:
- issue: 疑难词שילה的身份及译法
  choice: 正文保留音译“示罗”，不明说其就是弥赛亚。
  alternative: 译作“那应得权柄者”、理解为地名，或按贡物相关解释。
  rationale: 希伯来文本身存在真正的语文学歧义。保留音译既反映传统读法，也避免在翻译中提前解决长期存在的弥赛亚诠释争议。
- issue: 本节的君王及弥赛亚意涵
  choice: 采用“权杖”“统治者的杖”“归顺”等君王语言。
  alternative: 淡化为一般支派或政治意义，或直接改写成明确的弥赛亚预言。
  rationale: 原文明确使用王权意象并把它与犹大相连；译文应保留这种力度，却不加入原文没有明说的身份认定。
- issue: “直到”的神学含义
  choice: 直译为“直到”，不说明所到时点之后权杖是否离开。
  alternative: 释义为权柄只维持到该时点，或强调权柄从此永不终止。
  rationale: 原文界定了期待中的到来，却没有单凭该连接词明确断言后续情形；译文保留这种张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“权杖”和“万民”保留诗歌及王室语域；句法保持两组平行结构。脚注标记均置于正文相关疑难词之后。
