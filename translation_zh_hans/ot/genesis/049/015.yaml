  text: וַ/יַּ֤רְא מְנֻחָה֙ כִּ֣י ט֔וֹב וְ/אֶת הָ/אָ֖רֶץ כִּ֣י נָעֵ֑מָה וַ/יֵּ֤ט שִׁכְמ/וֹ֙ לִ/סְבֹּ֔ל וַ/יְהִ֖י לְ/מַס עֹבֵֽד־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/015.yaml
  text: He saw that the resting place was good[a], and that the land was pleasant, so he bent his shoulder to bear[c][b], and became a servant for forced labor.
translation:
  language: zh_hans
  text: 他看出安歇之处是美好的[a]，那地是宜人的，就屈肩负重，成为服徭役的人[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“安歇是美好的”。希伯来语 מְנֻחָה 既可指“安歇”，也可指“安歇之处”。
    reason: lexical_alternative
  - marker: b
    text: 或译“成为纳贡的仆人”或“成为奴工”。希伯来语 לְמַס עֹבֵד 的确切社会含义存在争议；מַס 常指征发的劳役或徭役。
    reason: alternative_reading
lexical_decisions:
- source_word: מְנֻחָה
  choice: 安歇之处
  rationale: 该词既可指“安歇”，也可指“安歇之处”。这里与下句的“那地”平行，具体的地点含义更切合语境，同时在脚注保留抽象义。
- source_word: טוֹב
  choice: 美好的
  rationale: 保留原文宽泛而简洁的正面评价，并与下句“宜人的”有所区别。
- source_word: הָאָרֶץ
  choice: 那地
  rationale: 在支派祝福的语境中，指以萨迦所见的土地或地域；“那地”自然承接前句。
- source_word: נָעֵמָה
  choice: 宜人的
  rationale: 表达土地令人喜爱、适合居住的性质，语气克制而自然。
- source_word: וַיֵּט שִׁכְמוֹ
  choice: 就屈肩
  rationale: 保留原文以肩膀承受重担的身体意象，也暗示顺服于负担。
- source_word: לִסְבֹּל
  choice: 负重
  rationale: 该不定式指承担或背负重担；“负重”简洁地保留动作及其比喻意味。
- source_word: לְמַס עֹבֵד
  choice: 成为服劳役的人
  rationale: מַס常指征发的劳役或徭役，עֹבֵד则描写服事或劳作的人。“服劳役的人”避免误解为普通雇工，也不过度断定为动产奴隶。
theological_decisions:
- issue: 末句所描述的受制性质
  choice: 成为服劳役的人
  alternative: 成为纳贡的仆人；成为奴工
  rationale: 原文诗句可能指被征发服徭役，也可能泛指纳贡服役。מַס在此较自然地指强制劳役，因此正文采用“服劳役”，并以脚注保留其他可能的社会含义。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。句式保留希伯来诗歌的两组并列推进及“屈肩负重”的形象，不将末句的社会身份过度具体化。
