  yaml_path: translation/ot/genesis/049/024.yaml
  text: Yet his bow remained steady, and his arms were made agile by the hands of the Mighty One of Jacob; from there is the Shepherd, the Stone of Israel.
translation:
  language: zh_hans
  text: '他的弓却仍然稳固；


    他的双臂借着雅各大能者的手变得灵活有力。


    从那里而来的，是以色列的牧者、磐石。[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “从那里而来的，是……”原文极为简略，也可理解为“从那里，就是……”。“牧者”和“磐石”与前面的“雅各大能者”究竟如何连接，并不完全明确。
    reason: 保存מִשָּׁם רֹעֶה אֶבֶן יִשְׂרָאֵל的句法歧义，避免正文过度确定其指代和神学身份。
lexical_decisions:
- source_word: בְּאֵיתָן
  choice: 强韧
  rationale: 该词表示坚固、持久、有力量；与“弓”搭配时，“强韧”既体现稳固不屈，也符合现代汉语对弓的自然描述。
- source_word: וַיָּפֹזּוּ
  choice: 灵活有力
  rationale: 此罕见动词在本句中描述约瑟的双臂，语义可能兼有敏捷、灵巧或强健之意；采用并列短语保留其动作能力与力量色彩。
- source_word: אֲבִיר יַעֲקֹב
  choice: 雅各大能者
  rationale: אֲבִיר是神的称号，意为强大者或大能者；不用特定宗派术语，并保留“雅各”的属格关系。
- source_word: רֹעֶה
  choice: 牧者
  rationale: 按马所拉读音译作“牧者”，保留其作为称号的庄重语体。
- source_word: אֶבֶן יִשְׂרָאֵל
  choice: 以色列的……磐石
  rationale: אֶבֶן本义为石头；在称号语境中译作“磐石”更自然，并传达稳固、庇护的意象。
theological_decisions:
- issue: “从那里”（מִשָּׁם）与随后两个称号的句法关系
  choice: 译为“从那里而来的，是以色列的牧者、磐石”，并加脚注说明原文简略
  alternative: “从那里，就是以色列的牧者、磐石”或将“牧者、磐石”直接同“雅各大能者”连为同位称号
  rationale: 希伯来文句法高度凝练，“从那里”所指及其与称号的连接并不完全明确；正文给出可读的理解，同时不把这一解释伪装成毫无歧义。
- issue: “牧者”与“磐石”是否指向弥赛亚或直接等同于上帝
  choice: 仅按原文保留两个称号，不在正文中明确其具体所指
  alternative: 明确译成“弥赛亚”或补出“上帝”
  rationale: 原文本身没有明说称号所指，补出特定身份会消除真实的神学与句法张力。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语，分行呈现希伯来诗句。避免生硬直译“他双手的臂”，以“他的双臂”表达 זְרֹעֵי יָדָיו；末行保留原文凝练而带张力的称号结构，并以脚注交代歧义。
