  text: חַכְלִילִ֥י עֵינַ֖יִם מִ/יָּ֑יִן וּ/לְבֶן שִׁנַּ֖יִם מֵ/חָלָֽב־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/012.yaml
  text: His eyes are darker than wine[b][a], and his teeth whiter than milk.
translation:
  language: zh_hans
  text: 他的眼睛因酒而红[a]，牙齿因奶而白。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本句也可译作：“他的眼睛比酒更深暗（或：更有光泽），牙齿比奶更洁白。”希伯来语中的形容词较罕见，而介词既可表示原因或来源，也可表示比较。
    reason: 保留罕见词语及介词结构所容许的另一种译法。
lexical_decisions:
- source_word: חַכְלִילִי
  choice: 红
  rationale: 这个罕见形容词描写眼睛的颜色或光泽；其词根与箴言23:29中饮酒所致的眼目发红有关。结合上一节酒极其丰盛的意象，正文采用“红”，同时在脚注保留“深暗／有光泽”的比较性理解。
- source_word: עֵינַיִם
  choice: 眼睛
  rationale: 按现代汉语自然表达译出表示双眼的名词。
- source_word: מִיָּיִן
  choice: 因酒
  rationale: 介词 מִן 既可表示原因或来源，也可表示比较。上下文强调酒与奶的丰盛，故正文取原因义“因酒”；比较义收入脚注。
- source_word: וּלְבֶן
  choice: 而白
  rationale: 形容牙齿洁白，并以“而”承接前一平行分句；不在正文补出比较级，以配合对 מִן 的原因义理解。
- source_word: שִׁנַּיִם
  choice: 牙齿
  rationale: 直接、自然地译出表示牙齿的名词。
- source_word: מֵחָלָב
  choice: 因奶
  rationale: 与“因酒”形成诗歌平行，正文将 מִן 理解为原因或来源，表达奶极其丰盛的图景。
theological_decisions: []
translation_notes:
  register: 采用简洁、庄重而自然的现代汉语，保留希伯来诗句两分句的平行结构。正文按上下文中的丰盛意象采用原因义；脚注明确保留比较义及形容词的词义不确定性。
