  text: וַ/יֹּ֤אמֶר יִשְׂרָאֵל֙ אֶל יוֹסֵ֔ף הִנֵּ֥ה אָנֹכִ֖י מֵ֑ת וְ/הָיָ֤ה אֱלֹהִים֙ עִמָּ/כֶ֔ם וְ/הֵשִׁ֣יב אֶתְ/כֶ֔ם אֶל אֶ֖רֶץ אֲבֹתֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/021.yaml
  text: Then Israel said to Joseph[a], “Behold, I am about to die[b], but God will be with you and will bring you back to the land of your fathers.”
translation:
  language: zh_hans
  text: 以色列对约瑟说：“看哪，我快要死了，但上帝必与你们同在，也必领你们回到你们祖先之地。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “你们”在原文中是复数，指约瑟及其家属或后裔。“但”所译的希伯来语连接词也可直译为“而且”；这里按上下文译出转折：以色列虽然将死，上帝仍与他们同在。
    reason: 说明复数代词的指向，并说明连接词的形式及其语境中的转折功能。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 叙事性连续式推进事件；现代汉语通常无须另译“然后”，由语序自然表达承接。
- source_word: יִשְׂרָאֵל
  choice: 以色列
  rationale: 原文使用“以色列”而非“雅各”，故保留原文称名。
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留提示听者注意的语用功能，同时维持庄重的经文语体。
- source_word: אָנֹכִי מֵת
  choice: 我快要死了
  rationale: 分词结构在此表达死亡临近，而非已经死亡；此译自然且准确。
- source_word: וְהָיָה אֱלֹהִים עִמָּכֶם
  choice: 但上帝必与你们同在
  rationale: וְ 字面为连接词，但上下文构成对比：以色列将死，上帝却仍与他们同在。“但”清楚传达这一话语关系。
- source_word: עִמָּכֶם
  choice: 与你们同在
  rationale: 后缀为第二人称阳性复数，故明确译作“你们”，使应许不限于约瑟个人。
- source_word: וְהֵשִׁיב אֶתְכֶם
  choice: 也必领你们回到
  rationale: שׁוב 的使役式表示使人返回；“领……回到”在汉语中自然地保留使役意义。
- source_word: אֶל אֶרֶץ אֲבֹתֵיכֶם
  choice: 回到你们祖先之地
  rationale: 指列祖所得应许之地；“祖先”是现代汉语中自然、准确的集合称谓，“之地”保持庄重。
theological_decisions:
- issue: 应许中复数代词的指向
  choice: 将两处复数后缀明确译为“你们”，使应许涵盖约瑟及其家属或后裔。
  alternative: 按对约瑟个人说话的表层语境译成单数“你”。
  rationale: 希伯来文两处后缀均为复数；保留复数既忠于语法，也不缩窄回归祖先之地这一应许的范围。
- issue: “上帝必与你们同在”前 וְ 的话语功能
  choice: 译作转折性的“但”。
  alternative: 按形式译作连接性的“而且”或“并且”。
  rationale: 原词本身是普通连接词，但语境明显对照以色列将死与上帝持续同在；正文采用自然的转折表达，同时在脚注说明形式上的可能译法。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“看哪”保留原文提示注意的语气；“祖先之地”比“列祖之地”更便于普通读者理解。脚注标记置于涵盖两项说明的整句之后。
