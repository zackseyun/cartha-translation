base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/007.yaml
  text: As for me[a], when I came from Paddan, Rachel died to my sorrow in the land of Canaan on the way, while there was still some distance to go to Ephrath; and I buried her there on the way to Ephrath (that is[c][b], Bethlehem).
translation:
  language: zh_hans
  text: 至于我，我从巴旦回来时，拉结在迦南地的路上死在我身边[a]；那时离以法他还有一段路程[b]。我就把她葬在那里，在通往以法他的路上（以法他就是伯利恒）。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “死在我身边”直译近于“死在我身上／临到我而死”。这个希伯来语说法可能强调拉结死在雅各身边，也可能强调她的死给雅各带来的沉重悲痛。
    reason: lexical_alternative
  - marker: b
    text: “一段路程”所译的希伯来语说法表示尚有一段路要走，确切距离无法确定。
    reason: cultural_note
lexical_decisions:
- source_word: וַאֲנִי
  choice: 至于我
  rationale: 独立代词带连接词标示话题转折，并突出雅各的亲身回忆；“至于我”自然体现这种强调。
- source_word: בְּבֹאִי מִפַּדָּן
  choice: 我从巴旦回来时
  rationale: ב 加不定式结构表达时间；“回来”符合雅各从巴旦返回迦南的语境。原文仅作“巴旦”，不补作“巴旦·亚兰”。
- source_word: מֵתָה עָלַי
  choice: 死在我身边
  rationale: 尽量保留“死在我这里／临到我”的空间与个人关联，而不把这一含混习语单一解释为悲伤情绪。
- source_word: בְּאֶרֶץ כְּנַעַן בַּדֶּרֶךְ
  choice: 在迦南地、路上
  rationale: 保留原文地理范围与途中发生之意，用顿号使现代中文结构清楚。
- source_word: בְּעוֹד כִּבְרַת אֶרֶץ לָבֹא אֶפְרָתָה
  choice: 那时离以法他还有一段路程
  rationale: כברת ארץ 指尚余的一段距离，具体长度不明，因此不作精确量化。
- source_word: וָאֶקְבְּרֶהָ שָּׁם
  choice: 我就把她葬在那里
  rationale: “就”自然承接叙事次序，并保留地点副词“那里”。
- source_word: בְּדֶרֶךְ אֶפְרָת
  choice: 通往以法他的路旁
  rationale: 表达坟墓位于前往以法他的路上；中文“路旁”在安葬语境中自然，但不主张坟墓一定与道路有特定距离。
- source_word: הִוא בֵּית לָחֶם
  choice: 以法他就是伯利恒
  rationale: 按原文保留解释性地名同定。
theological_decisions:
- issue: מֵתָה עָלַי 的个人意味
  choice: 正文译作“死在我身边”，脚注说明也可理解为死亡临到雅各并令他悲痛
  alternative: “死了，使我悲痛”
  rationale: 原习语兼有临近、临到与个人重负的可能性；正文避免只保留情感解释，脚注呈现真实歧义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。保留“巴旦”而不据平行经文扩充为“巴旦·亚兰”；对“死在我身边”的希伯来语歧义以脚注说明，不在正文中武断消解。
