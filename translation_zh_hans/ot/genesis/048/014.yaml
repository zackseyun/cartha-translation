revisions:
- from: 以色列伸出右手，按在以法莲头上，虽然他是弟弟；又把左手按在玛拿西头上。他特意交叉双手[a]，因为玛拿西是长子。
  to: 以色列伸出右手，放在以法莲的头上；以法莲虽是弟弟。他又把左手放在玛拿西的头上，特意交叉双手，因为玛拿西是长子。[a]
  rationale: 修订将可能过强的“按在”改为中性的“放在”，并明确让步分句的主语。正文仍将 שִׂכֵּל אֶת־יָדָיו 译为“特意交叉双手”，同时以脚注保留其“有意安排双手”的词义幅度；不引入额外神学解释。
