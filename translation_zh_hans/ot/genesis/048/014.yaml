  naturalness: “以法莲虽是弟弟”比“虽然他是弟弟”更清楚地消除代词所指，且保持庄重、自然的现代叙事表达。“放在……头上”也更符合汉语中描述此动作的中性措辞。
  terminology: 人名“以色列、以法莲、玛拿西”及“长子”均恰当。“长子”保留了 בכור 在此处有关出生次序的意义。
