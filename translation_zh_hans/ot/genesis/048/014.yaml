base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/014.yaml
  text: Then Israel stretched out his right hand and placed it on Ephraim’s head[a], though he was the younger, and his left hand on Manasseh’s head, crossing his hands, for Manasseh was the firstborn.
translation:
  language: zh_hans
  text: 以色列伸出右手，放在以法莲的头上；以法莲虽是弟弟。他又把左手放在玛拿西的头上，特意交叉双手，因为玛拿西是长子。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他有意安排双手的位置。”原文短语可强调有意、巧妙地摆放双手；从上下文看，这一动作涉及交叉双手。
    reason: 词义存在合理的翻译选择，需要保留原文措辞的幅度。
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: 伸出
  rationale: 这里指伸出手施行祝福；“伸出”既贴近原义，也符合现代汉语表达。
- source_word: וַיָּשֶׁת עַל רֹאשׁ
  choice: 按在……头上
  rationale: 原文表示把手放置在头上；“按在……头上”自然呈现祝福时按手的动作，同时不增添仪式细节。
- source_word: וְהוּא הַצָּעִיר
  choice: 虽然他是弟弟
  rationale: הַצָּעִיר 指两人中较年幼者；语境带有让步意味，因为年幼的以法莲反而承受右手。用“弟弟”在兄弟关系中自然清楚。
- source_word: שִׂכֵּל אֶת יָדָיו
  choice: 特意交叉双手
  rationale: 该短语词义有难度，可强调有意而巧妙地安排双手；上下文明确显示右手按以法莲、左手按玛拿西，因此“特意交叉双手”兼顾动作及其有意性。
- source_word: כִּי
  choice: 因为
  rationale: 引出这种反常手势的背景缘由：玛拿西是长子。
- source_word: הַבְּכֹר
  choice: 长子
  rationale: 在此兄弟与祝福语境中，“长子”准确保留出生次序及其文化分量。
theological_decisions:
- issue: שִׂכֵּל אֶת יָדָיו 的解释
  choice: 雅各有意交叉双手
  alternative: 雅各有意或巧妙地安排双手，但不明说交叉
  rationale: 紧接的上下文表明，右手落在弟弟以法莲头上，左手落在长子玛拿西头上，强烈支持交叉双手的理解；“特意”保留原短语所含的有意安排意味，又不进一步解释这一长幼次序逆转的神学意义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“弟弟／长子”清楚呈现两人的相对身份；分号划分两只手的平行动作，随后独立说明交叉双手及其原因。
