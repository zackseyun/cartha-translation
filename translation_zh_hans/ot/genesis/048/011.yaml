  text: וַ/יֹּ֤אמֶר יִשְׂרָאֵל֙ אֶל יוֹסֵ֔ף רְאֹ֥ה פָנֶ֖י/ךָ לֹ֣א פִלָּ֑לְתִּי וְ/הִנֵּ֨ה הֶרְאָ֥ה אֹתִ֛/י אֱלֹהִ֖ים גַּ֥ם אֶת זַרְעֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/011.yaml
  text: And Israel said to Joseph[a], “I did not expect to see your face, and behold, God has let me see even your offspring.”
translation:
  language: zh_hans
  text: 以色列对约瑟说：“我本没有指望再见到你的面；看哪，神竟使我连你的后代也见到了。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 以自然的汉语叙事承接上下文；无需机械译出连接词。
- source_word: יִשְׂרָאֵל
  choice: 以色列
  rationale: 原文使用盟约名“以色列”，不改作“雅各”。
- source_word: רְאֹה פָנֶיךָ
  choice: 再见到你的面
  rationale: 保留“见到你的面”这一具体而富感情的希伯来表达；依重逢语境补出“再”，使现代汉语自然。
- source_word: לֹא פִלָּלְתִּי
  choice: 我本没有指望
  rationale: 此处 פִלָּלְתִּי 表示料想、期望，而非狭义的祷告；“本没有指望”也传达以色列先前认为再无相见可能的语气。
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留表示惊奇和强调的话语标记，同时符合庄重的经文语体。
- source_word: הֶרְאָה אֹתִי
  choice: 使我……见到了
  rationale: 准确表达 ראה 的使役形态，即神使以色列得以看见。
- source_word: אֱלֹהִים
  choice: 神
  rationale: 这是普通的神圣称号，不是专名 יהוה；译作“神”简洁准确。
- source_word: גַּם
  choice: 竟……连……也
  rationale: 不仅表示附加，还突出超乎预期的惊喜：不但见到约瑟，甚至见到其后代。
- source_word: זַרְעֶךָ
  choice: 你的后代
  rationale: זֶרַע 是集合性单数，可指子孙、后裔；“后代”既自然，又不把词义限缩为“儿子”。
theological_decisions:
- issue: 族长叙事中 אֱלֹהִים 的译法
  choice: 神
  alternative: 上帝
  rationale: 原文使用普通神圣称号 אֱלֹהִים；“神”在现代中文圣经语体中直接、庄重，也不额外加入宗派性解释。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“看哪”有意保留原文的惊叹与强调；句中“竟使我连……也……”重现原文 וְהִנֵּה 与 גַּם 所形成的意外喜悦。
