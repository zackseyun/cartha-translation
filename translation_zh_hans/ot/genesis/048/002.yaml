base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/002.yaml
  text: And it was told to Jacob[a], and it was said, “Look, your son Joseph has come to you.” And Israel strengthened himself and sat up on the bed.
translation:
  language: zh_hans
  text: 有人告诉雅各说：“看，你儿子约瑟到你这里来了。”以色列就鼓起力气，在床上坐了起来。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּגֵּד לְיַעֲקֹב וַיֹּאמֶר
  choice: 有人告诉雅各说
  rationale: נגד 的使役词干表示“告诉、报告”；希伯来文未说明施事者，汉语以不定主语“有人”自然表达。后面的“说”保留 וַיֹּאמֶר 引出直接引语的作用。
- source_word: הִנֵּה
  choice: 看
  rationale: 该指示语气词用于唤起注意；“看”简洁、现代，并保留其提示作用。
- source_word: בִּנְךָ יוֹסֵף
  choice: 你儿子约瑟
  rationale: 按原文直译所有关系及人名，表达自然清楚。
- source_word: בָּא אֵלֶיךָ
  choice: 到你这里来了
  rationale: 完成式在此描述已经发生且与当下相关的到来；“来了”符合约瑟已经前来探望的语境。
- source_word: וַיִּתְחַזֵּק
  choice: 鼓起力气
  rationale: חזק 的反身形在患病卧床的语境中表示使自己强健、振起力量；“鼓起力气”既保留主动振作之意，也贴合身体虚弱的情境，而不把它限定为单纯的勇气。
- source_word: יִשְׂרָאֵל
  choice: 以色列
  rationale: 保留原文从“雅各”转称“以色列”的人名变化。
- source_word: וַיֵּשֶׁב עַל הַמִּטָּה
  choice: 在床上坐了起来
  rationale: ישב 基本义为“坐”；因雅各正卧病在床，“坐了起来”自然表达由躺卧转为坐起的动作。מִטָּה 译为现代常用的“床”。
theological_decisions:
- issue: 同一节中先称“雅各”、后称“以色列”
  choice: 依原文保留两个人名的转换
  alternative: 为行文一致而全部译作“雅各”
  rationale: 这一名称转换可能具有叙事或神学意味；译文不加解释，也不将其抹平。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“有人告诉雅各说”兼顾希伯来文的两个言说动词与自然汉语；全节不需脚注即可准确传达原文。
