base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/010.yaml
  text: Israel’s eyes were dim with age[a]; he could not see. So he brought them near to him[b], and he kissed them and embraced them.
translation:
  language: zh_hans
  text: 以色列年老，眼睛昏花[a]，不能看见。约瑟就把两个孩子领到他跟前[b]；以色列亲吻他们，又拥抱他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“以色列的眼睛因年老而沉重”，意思是他的视力已经衰退。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文只说“他把他们领到他跟前”，没有明说主语；按上下文译作“约瑟”。
    reason: source_ambiguity
lexical_decisions:
- source_word: עֵינֵי יִשְׂרָאֵל
  choice: 以色列……眼睛
  rationale: 保留原文所用的人名“以色列”，不改作“雅各”；按现代汉语调整领属结构。
- source_word: כָּבְדוּ מִזֹּקֶן
  choice: 年老，眼睛昏花
  rationale: כָּבְדוּ 字面为“沉重”，在此描述老年导致的视力衰退；“眼睛昏花”自然传达该习语，同时以脚注保留字面意象。
- source_word: לֹא יוּכַל לִרְאוֹת
  choice: 已经看不见了
  rationale: 直接表达原文“不能看见”的能力缺失；“已经……了”自然体现年老所致的现状。
- source_word: וַיַּגֵּשׁ אֹתָם אֵלָיו
  choice: 约瑟就把两个孩子领到他跟前
  rationale: 使役形表达“使……靠近、领近”。依48:9的命令和本节随后以色列亲吻、拥抱孩子的动作，将省略的主语按上下文明确为约瑟；“两个孩子”明确复数代词的所指。
- source_word: וַיִּשַּׁק לָהֶם
  choice: 以色列亲吻他们
  rationale: 原文随后主语仍以动词形式隐含；在汉语中明确为以色列，可避免误读为约瑟亲吻孩子。
- source_word: וַיְחַבֵּק לָהֶם
  choice: 又拥抱他们
  rationale: “拥抱”符合叙事的庄重语体，也准确表达亲昵的动作。
theological_decisions:
- issue: וַיַּגֵּשׁ 的隐含主语
  choice: 正文明确为“约瑟”
  alternative: 保留“他”，或理解为以色列把孩子拉近自己
  rationale: 希伯来文动词只以阳性单数形式标示主语，没有明说姓名；但48:9中以色列吩咐约瑟把孩子带来，本节又由以色列亲吻、拥抱他们，因此约瑟作“领近”的主语最符合叙事场景。脚注说明形式上的含混，不把语法形式本身说得比原文更明确。
translation_notes:
  register: 采用现代、自然而庄重的叙事汉语。“眼睛昏花”传达希伯来语视觉习语，“亲吻”“拥抱”避免过度口语化。为免连续多个“他”造成角色混淆，正文按上下文明确写出“约瑟”和“以色列”，并用脚注保留原文主语隐含所产生的解释空间。
