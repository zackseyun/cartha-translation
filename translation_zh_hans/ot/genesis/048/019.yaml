revisions:
- from: 但他父亲不肯，说：“我知道，我儿，我知道。他也必成为一族，也必强盛；然而，他的弟弟必比他更强盛，他的后裔必成为万族之充盈[a]。”
  to: 但他父亲不肯，说：“我知道，我儿，我知道。他也必成为一族，也必昌大；然而，他的弟弟必比他更为昌大，他的后裔必成为列国之众[a]。”
  rationale: 修订只处理末句不自然且不够明确的汉语仿译，并微调“昌大”以更贴近גדל的宽泛含义。脚注保留原文罕见短语的字面意象和“众多民族”的可行理解，未将其用于任何后设神学解释。
