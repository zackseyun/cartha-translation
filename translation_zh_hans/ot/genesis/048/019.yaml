base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/019.yaml
  text: But his father refused and said[a], “I know, my son, I know. He too will become a people, and he too will become great. Nevertheless, his younger brother will become greater than he, and his offspring will become the fullness of nations.”
translation:
  language: zh_hans
  text: 但他父亲不肯，说：“我知道，我儿，我知道。他也必成为一族，也必昌大；然而，他的弟弟必比他更为昌大，他的后裔必成为列国之众[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“众多民族。”希伯来文较直译为“列国的充满（或充盈）”。
    reason: 说明מְלֹא הַגּוֹיִם这一罕见短语可按上下文理解为众多民族，同时保留其字面“充满／充盈”的表达张力。
lexical_decisions:
- source_word: וַיְמָאֵן
  choice: 不肯
  rationale: מאן表示明确拒绝；结合约瑟试图挪开父亲之手的语境，“不肯”自然地表达雅各有意拒绝。
- source_word: יָדַעְתִּי ... יָדַעְתִּי
  choice: 我知道，我儿，我知道
  rationale: 保留原文重复所产生的强调，也保留未明说宾语的简洁表达。
- source_word: גַּם הוּא יִהְיֶה לְעָם
  choice: 他也必成为一族
  rationale: עָם指作为群体的人民；“一族”在此比“一国”更贴近支派后裔形成族群的语境。
- source_word: וְגַם הוּא יִגְדָּל
  choice: 也必强盛
  rationale: גדל在此指地位、规模或影响力增长；“强盛”符合中文族群语境，同时避免仅理解为身体长大。
- source_word: וְאוּלָם
  choice: 然而
  rationale: 准确表达前后命运之间的强烈转折。
- source_word: אָחִיו הַקָּטֹן
  choice: 他的弟弟
  rationale: הַקָּטֹן在兄弟排行中表示较年幼者，现代汉语自然译为“弟弟”。
- source_word: יִגְדַּל מִמֶּנּוּ
  choice: 必比他更强盛
  rationale: 比较介词מִן明确表达超过玛拿西，并与前面的“强盛”保持措辞一致。
- source_word: וְזַרְעוֹ
  choice: 他的后裔
  rationale: זֶרַע是集合单数；“后裔”既自然，又保留其群体含义。
- source_word: יִהְיֶה מְלֹא הַגּוֹיִם
  choice: 必成为万族之充盈
  rationale: 保留מְלֹא“充盈、满溢之量”的词义及原文短语的张力，不直接将其解释性地化约为“许多民族”。הַגּוֹיִם在此以“万族”表达众民族的集合概念。
theological_decisions:
- issue: מְלֹא הַגּוֹיִם的含义
  choice: 万族之充盈
  alternative: 众多民族／多族之众
  rationale: 原短语较为罕见，既可能描述数量众多，也保留“充盈”这一名词意象，并可能具有后续经文互文意义。正文不把这种张力静默化解，脚注提供较通顺的理解。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“我知道，我儿，我知道”保留父子对话的郑重与重复强调；末句刻意保留原文不寻常的“充盈”意象，并用脚注辅助理解。
