base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/013.yaml
  text: And Joseph took the two of them—Ephraim in his right hand, at Israel’s left, and Manasseh in his left hand, at Israel’s right—and brought them near to him.
translation:
  language: zh_hans
  text: 约瑟就带着他们二人：以法莲在他的右边、以色列的左边；玛拿西在他的左边、以色列的右边；随后把他们带到以色列跟前。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקַּח
  choice: 带来
  rationale: 此处不是单指“拿住”，而是约瑟安排并带领两个儿子的位置；译作“带来”符合叙事情境，也与下文“领……到……跟前”自然衔接。
- source_word: מִשְּׂמֹאל יִשְׂרָאֵל / מִימִין יִשְׂרָאֵל
  choice: 以色列的左手边 / 以色列的右手边
  rationale: 介词מִן在此表达相对于以色列所在的方位，而非移动的起点；“……的左/右手边”清楚呈现约瑟有意安排两子的站位。
- source_word: וַיַּגֵּשׁ אֵלָיו
  choice: 领他们到以色列跟前
  rationale: נגש的使役形表示使人靠近；明确代词“他”所指的以色列，可避免现代汉语中的指代含混。
theological_decisions:
- issue: 两子左右位置与长幼祝福次序
  choice: 保留约瑟右手对应以色列左边、左手对应以色列右边的交叉方位安排
  alternative: 简化为“把两个儿子带到以色列面前”
  rationale: 这些方位细节为下一节以色列交叉双手以及后来祝福次序的反转作铺垫，不应省略或提前解释其神学意义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。用“右手边/左手边”同时保留约瑟所用之手与两子相对于以色列的位置；末句明确“以色列”，避免连续使用“他”造成歧义。
