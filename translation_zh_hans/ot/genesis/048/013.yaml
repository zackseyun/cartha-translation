revisions:
- from: 约瑟把他们二人带来，让以法莲在自己的右手边、以色列的左手边，让玛拿西在自己的左手边、以色列的右手边，然后领他们到以色列跟前。
  to: 约瑟就带着他们二人：以法莲在他的右边、以色列的左边；玛拿西在他的左边、以色列的右边；随后把他们带到以色列跟前。
  rationale: 修订保留原文的叙事顺序和全部空间关系：以法莲位于约瑟右边、以色列左边，玛拿西位于约瑟左边、以色列右边，之后约瑟使二人靠近以色列。删去不自然的重复表达，未添加任何神学解释。
