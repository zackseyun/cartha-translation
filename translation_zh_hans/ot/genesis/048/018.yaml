  text: וַ/יֹּ֧אמֶר יוֹסֵ֛ף אֶל אָבִ֖י/ו לֹא כֵ֣ן אָבִ֑/י כִּי זֶ֣ה הַ/בְּכֹ֔ר שִׂ֥ים יְמִינְ/ךָ֖ עַל רֹאשֽׁ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/018.yaml
  text: And Joseph said to his father, “Not so, my father, for this one is the firstborn. Put your right hand on his head.”
translation:
  language: zh_hans
  text: 约瑟对父亲说：“父亲，不是这样；这一个是长子。请把你的右手放在他头上。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 未机械译出连接词；现代汉语叙事中承接关系由语序自然表达，避免不必要的“于是”或“但”。
- source_word: אֶל אָבִיו
  choice: 对父亲
  rationale: 准确表达 אֶל 的言说对象及三单阳性所属后缀；上下文已明确是约瑟的父亲，汉语无需重复“他的”。
- source_word: לֹא כֵן
  choice: 不是这样
  rationale: 保留纠正、制止手势的直接语气，比单说“不”更具体，也不过度扩展为“不能这样”。
- source_word: אָבִי
  choice: 我父亲
  rationale: 明确表达第一人称单数后缀，并保留约瑟恭敬而急切的称呼。
- source_word: כִּי זֶה הַבְּכֹר
  choice: 这个才是长子
  rationale: כִּי 引出纠正的理由；“才是”在自然汉语中突出约瑟所指的这一位，保留 זֶה 的指示性。“长子”兼具出生次序和家庭身份含义。
- source_word: שִׂים יְמִינְךָ עַל רֹאשׁוֹ
  choice: 请把你的右手放在他的头上
  rationale: 忠实呈现命令式、右手及按在头上的祝福动作；加“请”传达儿子对父亲说话时的恭敬语用色彩，不削弱请求的直接性。
theological_decisions:
- issue: 祝福语境中的长子身份
  choice: 长子
  alternative: 头生的；年长的
  rationale: בְּכוֹר 不仅指年龄较大，也指家庭中的出生次序和相应身份；“长子”是现代汉语中准确、自然且保留该身份意义的对应词。
- issue: 右手在祝福动作中的表达
  choice: 右手
  alternative: 右边
  rationale: יָמִין 在此明确指用于按头祝福的手；直译“右手”保留叙事所呈现的象征性动作，但不在正文中额外解释其神学意义。
translation_notes:
  register: 采用现代、庄重而口语自然的叙事表达。“不是这样，我父亲”保留原文的尊称与抗议之间的张力；“请”符合现代汉语中儿子向父亲提出纠正性请求的礼貌语感。无脚注。
