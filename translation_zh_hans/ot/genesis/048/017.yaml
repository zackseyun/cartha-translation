  text: וַ/יַּ֣רְא יוֹסֵ֗ף כִּי יָשִׁ֨ית אָבִ֧י/ו יַד יְמִינ֛/וֹ עַל רֹ֥אשׁ אֶפְרַ֖יִם וַ/יֵּ֣רַע בְּ/עֵינָ֑י/ו וַ/יִּתְמֹ֣ךְ יַד אָבִ֗י/ו לְ/הָסִ֥יר אֹתָ֛/הּ מֵ/עַ֥ל רֹאשׁ אֶפְרַ֖יִם עַל רֹ֥אשׁ מְנַשֶּֽׁה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/017.yaml
  text: When Joseph saw that his father had placed his right hand on Ephraim’s head[a], it was displeasing in his eyes, and he took hold of his father’s hand to remove it from Ephraim’s head to Manasseh’s head.
translation:
  language: zh_hans
  text: 约瑟看见父亲把右手放在以法莲头上，心里很不高兴[a]，就扶住父亲的手，要把它从以法莲头上移到玛拿西头上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译是“这在他眼中为不好”；意思是“这使他不高兴”。
    reason: 说明希伯来语身体部位惯用语及其语境含义。
lexical_decisions:
- source_word: וַיַּרְא ... כִּי
  choice: 约瑟看见……
  rationale: וַיַּרְא 推进叙事，כִּי 引出所看见的内容；汉语直接用“看见”带宾语从句，自然且准确。
- source_word: יָשִׁית
  choice: 把……放在
  rationale: 该动词表示放置；上下文已明确动作先于约瑟的反应，现代汉语无须另加完成标记。
- source_word: יַד יְמִינוֹ
  choice: 右手
  rationale: 保留祝福动作中具体而有意义的右手。
- source_word: וַיֵּרַע בְּעֵינָיו
  choice: 心里很不高兴
  rationale: 这是表示主观不悦的希伯来语惯用语；译为自然现代汉语，避免“眼中为恶”被误解为道德判断。
- source_word: וַיִּתְמֹךְ
  choice: 托住
  rationale: תמך 可指支撑、扶住或抓住；“托住”既贴合手部动作，又不夸大约瑟用力的程度。
- source_word: לְהָסִיר אֹתָהּ
  choice: 要把它……移到
  rationale: הסיר 表示移开或挪走；结合后面的起点与目标，“移到”清楚表达改换位置的意图。
- source_word: מֵעַל רֹאשׁ אֶפְרַיִם עַל רֹאשׁ מְנַשֶּׁה
  choice: 从以法莲头上移到玛拿西头上
  rationale: 完整保留从一个头上转移到另一个头上的方向关系。
theological_decisions: []
