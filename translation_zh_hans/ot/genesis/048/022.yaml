  naturalness: 建议将授予的对象直接置于“赐给”之后，并把关系从句明确连接到“那一份”。“用我的刀、我的弓”在庄重现代汉语中自然，且完整反映原文。
  terminology: “亚摩利人”适合作为单数族名的集合性表达。“一份”可保留为正文中的语境义，但脚注应说明其对应的希伯来词可有“肩／山脊”义，并可能与“示剑”构成双关；不应将该词义歧义在正文中消除而不加提示。
