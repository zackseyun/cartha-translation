base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/022.yaml
  text: And I give you one portion above your brothers[a], which I took from the hand of the Amorite with my sword and with my bow.
translation:
  language: zh_hans
  text: 至于我，我赐给你比你的弟兄多一份[a]，就是我用我的刀、我的弓从亚摩利人手中取来的那一份。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “一份”所译的希伯来词也可指“肩”或“山脊”，并可能与地名“示剑”构成双关；这里或同时暗指约瑟所得的额外一份，以及后来与约瑟相关的示剑之地。
    reason: 保留שְׁכֶם的词义多重性及其与“示剑”地名可能存在的双关。
lexical_decisions:
- source_word: וַאֲנִי
  choice: 至于我，我
  rationale: 独立代词在动词已含主语的情况下带有强调作用；此译法保留强调，同时符合庄重的现代汉语表达。
- source_word: נָתַתִּי
  choice: 我赐给
  rationale: 该完成式在雅各的遗嘱性宣告中可作即时生效的授予，译作现在时的“赐给”比单纯过去时更贴合语境。
- source_word: שְׁכֶם אַחַד
  choice: 多一份
  rationale: 语境指约瑟所得超过弟兄的额外份额；שְׁכֶם本身又可指肩、山脊，并可能与示剑地名构成双关，故正文采用通顺的语境义，其他可能性保留在脚注。
- source_word: עַל אַחֶיךָ
  choice: 比你的弟兄多
  rationale: עַל在此表达超出或额外所得；“比……多”清楚传达约瑟所得超过弟兄，而不引入具体的继承制度术语。
- source_word: אֲשֶׁר לָקַחְתִּי
  choice: 这是我……夺来的
  rationale: לקח基本义为“取、拿”；武器语境使“夺来”自然贴切，并保留主动取得的力度。
- source_word: מִיַּד הָאֱמֹרִי
  choice: 从亚摩利人手中
  rationale: 保留希伯来语“从……手中”的权势或占有关系习语；单数族称按汉语习惯译为集合性的“亚摩利人”。
- source_word: בְּחַרְבִּי וּבְקַשְׁתִּי
  choice: 用刀和弓
  rationale: 直接保留两种武器及第一人称所有关系在上下文中的明确指向，汉语无需重复“我的”仍可自然理解为雅各所说自己的刀和弓。
theological_decisions:
- issue: שְׁכֶם与示剑地名及约瑟额外份额之间的关系
  choice: 正文译为“多一份”，脚注保留“肩、山脊”和“示剑”的可能双关
  alternative: 正文译为“一道山脊”或“示剑这一份”
  rationale: 继承祝福的上下文支持“份额”义，但原词的地形义及其与示剑的同形关系不可忽略。正文采用可理解的语境义，脚注呈现词义张力，避免把双关武断地限定为单一解释。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“至于我，我”保留原文主语强调；分号使授予宣告与其来源说明层次清楚。脚注标记[a]已置于正文相关词语之后。
