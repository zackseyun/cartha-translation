base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/005.yaml
  text: And now[a], your two sons, who were born to you in the land of Egypt before I came to you in Egypt, are mine; Ephraim and Manasseh shall be mine[c][b], like Reuben and Simeon.
translation:
  language: zh_hans
  text: 现在，你在埃及地所生的两个儿子，就是我到埃及来见你以前出生的，都归我；以法莲和玛拿西要归我，正如吕便和西缅一样。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “我到埃及来见你以前”也可较形式化地译作“直到我到埃及来见你”。这里指雅各抵达埃及之前出生的两个儿子。
    reason: 保留עַד בֹּאִי的形式对应译法及其在语境中的时间含义。
lexical_decisions:
- source_word: וְעַתָּה
  choice: 现在
  rationale: 承接前文并引出雅各此刻作出的郑重安排；现代汉语中无需机械加入“而”。
- source_word: שְׁנֵי בָנֶיךָ הַנּוֹלָדִים לְךָ
  choice: 你的两个儿子，就是……给你生的
  rationale: 保留“两子”、所属关系及被动出生含义；用“就是”引出较长的定语说明，使汉语清楚自然。
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: 在埃及地
  rationale: 保留原文明确出现的“地”，也与后面的地点表达有所区分。
- source_word: עַד בֹּאִי אֵלֶיךָ מִצְרָיְמָה
  choice: 我到埃及你这里来以前
  rationale: עַד בֹּאִי 字面可作“直到我来”，但在这里界定的是雅各到达前已经出生的儿子，因此正文用自然清楚的“以前”，同时保留“到你这里”和“埃及”。
- source_word: לִי הֵם
  choice: 都归我
  rationale: 表达雅各把二人算作自己儿子的归属与身份关系；“归我”比单说“是我的”更适合此处郑重宣告的语境。
- source_word: אֶפְרַיִם וּמְנַשֶּׁה
  choice: 以法莲和玛拿西
  rationale: 采用现代中文圣经传统中通行且易辨认的人名译法。
- source_word: כִּרְאוּבֵן וְשִׁמְעוֹן יִהְיוּ לִי
  choice: 要归我，正如吕便和西缅一样
  rationale: 保留未完成式的宣告意味和כְּ的比较关系，不把比较所涉及的具体法律效果过度写入正文。
theological_decisions:
- issue: 雅各宣称以法莲和玛拿西“归我”的性质
  choice: 按原文直译为“归我”，并以与吕便、西缅的比较表达其儿子身份
  alternative: 明确译成“我要收养他们作我的儿子”
  rationale: 经文确实把二人纳入雅各儿子的地位，但没有使用技术性的“收养”术语；保留原文措辞可避免对法律机制作超出文本的界定。
- issue: “正如吕便和西缅一样”的比较范围
  choice: 保留开放的比较表达
  alternative: 解释为“享有与吕便和西缅同等的支派和产业地位”
  rationale: 上下文涉及家族与产业安排，但本节本身只直接说明二人像吕便和西缅一样归雅各，不宜在正文中补足所有后续含义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。保留原文两次提到埃及的重复，不以“这里”取代明确地点；“都归我／要归我”维持原文重复和郑重语气。
