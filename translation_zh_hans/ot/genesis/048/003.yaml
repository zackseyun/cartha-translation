  yaml_path: translation/ot/genesis/048/003.yaml
  text: And Jacob said to Joseph[a], “God Almighty appeared to me at Luz in the land of Canaan and blessed me,”
translation:
  language: zh_hans
  text: 雅各对约瑟说：“全能的上帝[a]曾在迦南地的路斯向我显现，并赐福给我。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语作“伊勒·沙代”。传统译作“全能的上帝”；“沙代”的确切含义仍有争议。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 叙事中的连续式推进下一事件；现代汉语通常无需另加“于是”或“然后”，以免过度限定时间关系。
- source_word: אֶל יוֹסֵף
  choice: 对约瑟
  rationale: 自然表达说话的对象，准确对应希伯来语介词结构。
- source_word: אֵל שַׁדַּי
  choice: 全能的上帝
  rationale: 将神圣称号译出而不只音译；这是现代中文中明确、庄重且通行的表达，同时以脚注保留“沙代”含义仍有争议这一事实。
- source_word: נִרְאָה אֵלַי
  choice: 向我显现
  rationale: 准确表达ראה的尼法勒式在此所指的可感知显现，不额外加入“启示自己”等原文未明说的反身含义。
- source_word: בְּלוּז
  choice: 在……路斯
  rationale: 地名前的介词表示事件发生地点；“在路斯”符合现代汉语地名表达。
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: 在迦南地
  rationale: 保留原文中的“地”，兼顾地理明确性与中文圣经语体的自然表达。
- source_word: וַיְבָרֶךְ אֹתִי
  choice: 并赐福给我
  rationale: 延续同一主语“全能的上帝”；“赐福”比普通的“祝福”更适合上帝施福的语境，而“并”保留动作的承接。
theological_decisions:
- issue: 神圣称号 אֵל שַׁדַּי 的译法
  choice: 全能的上帝
  alternative: 伊勒·沙代／大能的上帝
  rationale: “全能的上帝”是清楚而通行的中文称号译法，但 שַׁדַּי 的确切词义仍有争议，因此脚注注明其希伯来语形式及词义的不确定性，避免把传统译法说成无争议的词源结论。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“迦南地的路斯”自然呈现地点的包含关系；以“曾”标明雅各回述先前经历，但不添加原文没有的具体时间。引文在本节结束，使用完整句号。
