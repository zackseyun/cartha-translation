  text: When Israel saw Joseph's sons[a], he said[b], “Who are these?”
translation:
  language: zh_hans
  text: 以色列[a]看见约瑟的儿子们，就问：“这些是谁？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文作“以色列”，即雅各所用的名字。
