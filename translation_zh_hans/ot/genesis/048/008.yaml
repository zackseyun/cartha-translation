lexical_decisions:
- source_word: וַיַּרְא
  choice: 看见……就
  rationale: 连续式叙事动词推进情节；用“看见……就问”自然表达先后关系。
- source_word: יִשְׂרָאֵל
  choice: 以色列
  rationale: 原文使用族长的名字“以色列”，不改作“雅各”。
- source_word: אֶת
  choice: 不单独译出
  rationale: 这是直接宾语标记，现代汉语没有对应的独立词。
- source_word: בְּנֵי יוֹסֵף
  choice: 约瑟的儿子们
  rationale: 忠实表达希伯来语属格结构，并明确所指为约瑟的多个儿子。
- source_word: וַיֹּאמֶר
  choice: 就问
  rationale: אָמר本义为“说”；因后接疑问句，汉语用“问”更自然，且保留其言语行为。
- source_word: מִי אֵלֶּה
  choice: 这些是谁？
  rationale: 直译原文的身份问句，现代汉语自然清楚。
