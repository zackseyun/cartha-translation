  text: הַ/מַּלְאָךְ֩ הַ/גֹּאֵ֨ל אֹתִ֜/י מִ/כָּל רָ֗ע יְבָרֵךְ֮ אֶת הַ/נְּעָרִים֒ וְ/יִקָּרֵ֤א בָ/הֶם֙ שְׁמִ֔/י וְ/שֵׁ֥ם אֲבֹתַ֖/י אַבְרָהָ֣ם וְ/יִצְחָ֑ק וְ/יִדְגּ֥וּ לָ/רֹ֖ב בְּ/קֶ֥רֶב הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/016.yaml
  text: The angel who has redeemed me from all evil[a], may he bless the boys; and may my name and the name of my fathers Abraham and Isaac be called on them[e][d][c][b]; and may they multiply greatly in the midst of the land.
translation:
  language: zh_hans
  text: 那位救赎我脱离一切祸患的天使，愿他赐福给这两个孩子。愿我的名，以及我祖先亚伯拉罕和以撒的名，归在他们身上[a]；愿他们在这地当中繁衍众多[b][c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译是“愿我的名，以及我祖先亚伯拉罕和以撒的名，被称在他们身上”，意思可能是他们承接这些名字所代表的家族身份和传承。
    reason: lexical_alternative
  - marker: b
    text: “繁衍”所译的希伯来词很少见，可能带有鱼群大量增殖的意象；也可译作“增长成为众多”。
    reason: lexical_alternative
  - marker: c
    text: “这地”也可译作“全地”或“世上”。
    reason: alternative_reading
lexical_decisions:
- source_word: הַמַּלְאָךְ
  choice: 天使
  rationale: מַלְאָךְ可指“使者”或“天使”；本段语境中“天使”自然且保留传统理解，又不进一步界定其本体身份。
- source_word: הַגֹּאֵל אֹתִי
  choice: 那位救赎我的
  rationale: גאל带有救赎、解救的含义；分词指持续作为救赎者的那一位。结合雅各回顾一生蒙保守的语境，用“那位救赎我的”既保留救赎色彩，也符合中文表达。
- source_word: מִכָּל רָע
  choice: 脱离一切祸患
  rationale: רָע既可指道德上的恶，也可指灾祸、患难。此处回顾蒙拯救的经历，“祸患”较贴合语境，同时不把它缩窄为单一事件。
- source_word: יְבָרֵךְ
  choice: 愿他赐福
  rationale: 未完成式在祝福语境中具有祈愿语气；“愿他赐福”准确传达这一功能。
- source_word: הַנְּעָרִים
  choice: 这两个孩子
  rationale: 定冠词所指为在场的以法莲和玛拿西；中文用“这两个孩子”明确、自然，也符合上下文。
- source_word: וְיִקָּרֵא בָהֶם שְׁמִי וְשֵׁם אֲבֹתַי
  choice: 愿我的名，以及我祖先……的名，归在他们身上
  rationale: קרא的被动式与ב连用，表达名字加在、归在某人身上的习语。“归在他们身上”保留名字与家族身份相连的意象，同时比逐字译作“被称在他们身上”自然。
- source_word: אֲבֹתַי
  choice: 我祖先
  rationale: 复数אָבוֹת在这里指亚伯拉罕和以撒这两位先祖；现代中文用“祖先”比“父亲们”准确自然。
- source_word: וְיִדְגּוּ לָרֹב
  choice: 繁衍众多
  rationale: 罕见动词דגה含大量增殖之意，可能唤起鱼群繁衍的形象。“繁衍众多”清楚表达结果，并在脚注保留该词的特殊意象。
- source_word: בְּקֶרֶב הָאָרֶץ
  choice: 在这地上
  rationale: אָרֶץ可指“地、土地”或“全地、世界”。在族长与后裔的语境中译作“这地”较合适；较宽泛的可能性列入脚注。
theological_decisions:
- issue: “天使”的身份
  choice: 保留“天使”，不进一步说明其身份
  alternative: 解释为上帝的显现，或解释为受造的使者
  rationale: 本节把这位天使与雅各所敬拜并赐福的上帝紧密相连，却没有明言其本体身份；正文应保留这种神学张力，不替经文作进一步判定。
- issue: 名字归在两个孩子身上的含义
  choice: 用“归在他们身上”保留家族身份、承继与归属的综合含义
  alternative: 译为“他们要以我的名为名”或“他们要称为我的名下”
  rationale: 希伯来习语可能涉及命名、归属和延续家族身份。正文不把它限定为单纯改名或称谓。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“赐福”“救赎”保留经文的神学与礼仪语感；其余句式避免文言化。“这两个孩子”依上下文明确复数所指；脚注只处理正文无法同时呈现的希伯来习语、罕见词意象及“地”的歧义。
