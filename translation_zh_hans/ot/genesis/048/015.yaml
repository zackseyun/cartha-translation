base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/015.yaml
  text: And he blessed Joseph and said[a], “The God before whom my fathers Abraham and Isaac walked[b], the God who has shepherded me from my beginning to this day,”
translation:
  language: zh_hans
  text: 他给约瑟祝福，说：“我的祖先亚伯拉罕和以撒在他面前行走的那位上帝，就是自我生命之初[b]直到今日一直牧养我[a]的上帝，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“作我的牧者”，也可理解为“喂养我”。希伯来语动词带有牧人持续照料、引导和供应羊群的意象。
    reason: lexical_alternative
  - marker: b
    text: “自我生命之初”也可译作“从我有生以来”或“我一生”。原文强调上帝的照料从雅各生命之初一直延续到当日。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבָרֶךְ אֶת־יוֹסֵף
  choice: 他给约瑟祝福
  rationale: 忠实保留希伯来文明确以约瑟为受祝福者的表述，不因上下文提到约瑟的儿子而加以协调。
- source_word: הָאֱלֹהִים
  choice: 上帝
  rationale: 采用现代标准普通话中庄重而通行的称呼；定冠词的限定作用通过后接的关系分句自然体现。
- source_word: אֲשֶׁר הִתְהַלְּכוּ אֲבֹתַי לְפָנָיו
  choice: 我的祖先……在他面前行走
  rationale: 保留“在上帝面前行走”这一关系性、生活性的圣经意象，不将其缩减为单纯的“顺从”或“跟随”。
- source_word: אַבְרָהָם וְיִצְחָק
  choice: 亚伯拉罕和以撒
  rationale: 采用简体中文圣经传统中通行的人名译法。
- source_word: הָרֹעֶה אֹתִי
  choice: 一直牧养我
  rationale: 保留主动的牧者意象，并以“一直”表达分词所含的持续照料之意，避免仅译作“供养”而削弱意象。
- source_word: מֵעוֹדִי
  choice: 从我有生以来
  rationale: 表达自雅各生命起初以来的时间范围，又不把原文过窄地限定为某一具体的出生时刻或青年时期。
- source_word: עַד הַיּוֹם הַזֶּה
  choice: 直到今日
  rationale: 自然、庄重地表达从生命起初延续到说话当下的时间跨度。
theological_decisions:
- issue: 列祖“在上帝面前行走”的表达
  choice: 我的祖先亚伯拉罕和以撒在他面前行走
  alternative: 我的祖先亚伯拉罕和以撒一生在他面前生活
  rationale: 保留原文“行走”的盟约性和关系性意象，同时不把它解释成某一特定教义体系中的技术用语。
- issue: 上帝作为牧者的意象
  choice: 从我有生以来直到今日一直牧养我的上帝
  alternative: 从我有生以来直到今日一直作我牧者的上帝
  rationale: 原文使用主动分词；“一直牧养我”既保留牧者意象，也突出上帝持续施行看顾的行动。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留“在他面前行走”和“牧养”两处核心意象；句末用逗号并不闭合引号，以反映祝福内容在下一节继续。
