base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/004.yaml
  text: And he said to me, ‘Look, I will make you fruitful and multiply you, and I will make you into an assembly of peoples, and I will give this land to your offspring after you as an everlasting possession.’
translation:
  language: zh_hans
  text: 他对我说：“看哪，我必使你繁衍，使你增多，并使你成为多族的会众；我又必把这地赐给你以后的后裔，作为永远的产业。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנְנִי
  choice: 看哪，我必
  rationale: 保留原文引人注意的语气，并以自然汉语引出上帝的应许；其中分词结构按语境译为确定的将来行动。
- source_word: מַפְרְךָ וְהִרְבִּיתִךָ
  choice: 使你繁衍增多
  rationale: 分别体现“使结果实、繁衍”和“使增多”的并列含义，同时符合现代汉语表达。
- source_word: קְהַל עַמִּים
  choice: 众族的群体
  rationale: קהל指聚集而成的群体，עמים为复数，可指多个民族或族群；此译法保留复数和集合意味，不将其收窄为单一国家。
- source_word: זַרְעֲךָ
  choice: 你的后裔
  rationale: 原词字面为“种子”，在此是集合名词，指雅各的后代；“后裔”既自然，也保留集合性。
- source_word: אֲחֻזַּת עוֹלָם
  choice: 永远的产业
  rationale: אֲחֻזָּה指持有、承受的地产或产业，עוֹלָם表示长久或永远；采用庄重且常见的圣经语汇。
theological_decisions:
- issue: 土地应许的持续时间
  choice: 永远的产业
  alternative: 长久的产业
  rationale: 原文עוֹלָם在此直接修饰产业；正文保留其强烈、开放的时间表达，不另行限定应许的神学实现方式。
- issue: 应许对象זֶרַע的范围
  choice: 你的后裔
  alternative: 你的子孙
  rationale: “后裔”更能保留希伯来语集合名词的宽泛范围，不擅自限定为近代子孙或某一位特定后代。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“看哪”保留原文郑重提示语气；“众族的群体”虽略具书面色彩，但能较准确地表达קהל עמים，避免把它解释性地改成“许多民族”。
