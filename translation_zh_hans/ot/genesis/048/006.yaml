base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/006.yaml
  text: But your offspring whom you father after them will be yours[b][a]; they will be called by the name of their brothers in their inheritance.
translation:
  language: zh_hans
  text: 至于你在他们以后所生的儿女，他们要归你[a]；他们在承受产业时，要归在他们弟兄的名下[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“至于你在他们以后所生的后代，他们要归你。”
    reason: lexical_alternative
  - marker: b
    text: 意思是：他们不会作为独立支派另得产业，而会归入以法莲和玛拿西的名下。
    reason: cross_reference
lexical_decisions:
- source_word: וּמוֹלַדְתְּךָ
  choice: 你……所生的后代
  rationale: 该词指由约瑟所生的人；“后代”保留集合性和一定宽度，而与后面的“所生”合用，明确这里首先指后来出生的儿女。
- source_word: הוֹלַדְתָּ
  choice: 所生
  rationale: 使役形在男性受话者约瑟身上表示生育、作父亲；现代汉语用“所生”自然简洁，无需采用较生硬的“所生育”或“所生下”。
- source_word: אַחֲרֵיהֶם
  choice: 在他们以后
  rationale: 直接保留相对于以法莲和玛拿西的出生次序，不将代词在正文中解释替换为姓名。
- source_word: לְךָ יִהְיוּ
  choice: 他们要归你
  rationale: 表达家族和法律上的归属，与前文以法莲、玛拿西被雅各视为自己儿子的安排形成对照；“归你”比单说“是你的”更能体现此处的归属关系。
- source_word: עַל שֵׁם אֲחֵיהֶם
  choice: 归在自己兄弟的名下
  rationale: “名下”自然表达按其兄弟的名字或支派身份登记、归属；加入“归在”传达 עַל 在此语境中的归属含义。
- source_word: אֲחֵיהֶם
  choice: 自己兄弟
  rationale: 保留希伯来文的亲属称谓，不在正文中直接改为“以法莲和玛拿西”；“自己”使中文代词指向清楚。
- source_word: יִקָּרְאוּ
  choice: 要归在……名下
  rationale: 该被动式直译为“被称为”，但在产业登记语境中含按某名归算之意；中文“归在……名下”既保留命名观念，也清楚表达登记归属。
- source_word: בְּנַחֲלָתָם
  choice: 在产业中
  rationale: נַחֲלָה 指承受的产业或分得的地业；“产业”沿用圣经语域并保持范围，不把意义过早限定为某一块土地。
theological_decisions:
- issue: 后来出生的后代是否另立支派并单独承受产业
  choice: 正文说他们在产业中归在兄弟名下，脚注说明其继承安排
  alternative: 将正文直接解释为“不另得支派产业”
  rationale: 希伯来文以“归在兄弟的名下”表达结果，并未直接出现“不另得”字样；把制度含义放入脚注，可避免正文释义过度，同时让读者理解上下文。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“至于”承接前文并突出对后来子女的安排；“产业”和“名下”兼顾圣经继承语境与现代可读性。所有脚注标记均置于相关正文之后。
