  rationale: 修订消除了“所生的后代”的冗余和范围不够具体的问题，并将产业短语改为自然的中文状语结构。正文仍保留“弟兄”及“名下”的原文表达，不把支派制度的解释扩展进正文；脚注继续说明其在继承安排中的含义。
