  naturalness: 建议使用“你在他们以后所生的儿女”，这在现代庄重汉语中自然，也符合此处直接指约瑟后来所生子女的上下文。“在承受产业时，要归在他们兄弟的名下”顺畅地交代产业分配的语境。
  terminology: 保留“儿女”“归你”“产业”“弟兄”“名下”等庄重而可懂的圣经语汇。“弟兄”对应希伯来文的亲属称谓，不在正文中将其替换为以法莲和玛拿西；具体所指及支派继承含义保留在脚注说明。
