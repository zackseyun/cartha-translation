base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/009.yaml
  text: And Joseph said to his father[a], “They are my sons, whom God has given me here.” And he said, “Please bring them to me[b], and I will bless them.”
translation:
  language: zh_hans
  text: 约瑟对父亲说：“他们是上帝在这里赐给我的儿子[a]。”父亲说：“请把他们带到我这里来[b]，我要给他们祝福。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在这地方赐给我的。”希伯来语可更具体地指约瑟当时所在之处。
    reason: lexical_alternative
  - marker: b
    text: 或译：“请把他们带到我这里来，好让我给他们祝福。”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר יוֹסֵף אֶל־אָבִיו
  choice: 约瑟对父亲说
  rationale: 按希伯来叙事的顺序直译；“父亲”符合庄重而自然的现代汉语表达。
- source_word: בָּנַי הֵם
  choice: 他们是我的儿子
  rationale: בָּנַי明确为阳性复数“我的儿子”；保留代词判断句，也与上文所指的两个孩子衔接。
- source_word: אֲשֶׁר נָתַן לִי אֱלֹהִים
  choice: 是上帝……赐给我的
  rationale: “赐给”自然表达把儿子视为来自上帝的恩赐；אֱלֹהִים在此依语境指独一的上帝。
- source_word: בָּזֶה
  choice: 在这里
  rationale: 该指示表达在语境中最自然地指约瑟现今所在之地，即埃及；脚注保留更具体的直译。
- source_word: קָחֶם־נָא אֵלַי
  choice: 请把他们带到我这里来
  rationale: לקח本可作“拿、带”，但移动方向是“到我这里”，故汉语用“带……来”；“请”体现נָא的礼貌请求语气。
- source_word: וַאֲבָרֲכֵם
  choice: 我要为他们祝福
  rationale: 承接请求，表达雅各接下来施行祝福的意愿；“为他们祝福”是自然、庄重的现代汉语。
theological_decisions:
- issue: אֱלֹהִים所指为何
  choice: 译作“上帝”，指以色列的上帝，是约瑟儿子的赐予者
  alternative: 泛指“神”或“诸神”
  rationale: 族长叙事及约瑟话语的语境清楚指向独一的上帝；此译法不额外加入宗派性解释。
- issue: וַאֲבָרֲכֵם与前一请求的关系
  choice: 译作“我要为他们祝福”，保留意愿和后续行动的语气
  alternative: 译作“好让我为他们祝福”，明确处理为目的从句
  rationale: 希伯来语连接形式可自然理解为请求之后的目的或意愿；正文采用直接自然的汉语，脚注保留目的式表达。
translation_notes:
  register: 采用现代、清楚而庄重的叙事语体。“他就说”按上下文指约瑟的父亲雅各，不在正文补出名字，以保留原文的代词衔接。所有脚注标记均置于其所说明的短语之后。
