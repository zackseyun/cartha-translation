revisions:
- from: 那一天，他为他们祝福说：“以色列要用你来祝福[a]，说：‘愿上帝使你像以法莲，也像玛拿西。’”他就把以法莲列在玛拿西之前。
  to: 那一天，他祝福他们，说：“以色列要用你来为人祝福，说：‘愿上帝使你像以法莲，也像玛拿西。’”他把以法莲置于玛拿西之前。
  rationale: 修订仅处理汉语句法、脚注的解释限度，以及“置于……之前”的词义贴合度。保留“以色列”的未扩展表达、第二人称单数、“愿上帝使你像……”的祝愿语气，以及以法莲先于玛拿西的次序。
  reviewer_model: gpt-5.6-terra
