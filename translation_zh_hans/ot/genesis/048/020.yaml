base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/020.yaml
  text: So he blessed them that day[a], saying, “By you Israel will bless, saying, ‘May God make you like Ephraim and like Manasseh.’” And he set Ephraim before Manasseh.
translation:
  language: zh_hans
  text: 那一天，他祝福他们，说：“以色列要用你来为人祝福，说：‘愿上帝使你像以法莲，也像玛拿西。’”他把以法莲置于玛拿西之前。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְבָרֲכֵם
  choice: 他为他们祝福
  rationale: ברך 的强意形在此表示“祝福”；复数宾语后缀同时指以法莲和玛拿西。
- source_word: בַּיּוֹם הַהוּא
  choice: 那一天
  rationale: 保留原文明确的时间指称，也符合现代汉语表达。
- source_word: בְּךָ יְבָרֵךְ יִשְׂרָאֵל
  choice: 以色列要用你来祝福
  rationale: 保留介词 בְּ 的工具或依据意味，以及第二人称单数形式；“要”可表达未完成式在这里所指向的将来或惯常用法。
- source_word: יְשִׂמְךָ אֱלֹהִים
  choice: 愿上帝使你
  rationale: 在祝福语境中，该形式表达愿望；שׂים 在这一结构中自然译作“使……成为／像……”。
- source_word: כְּאֶפְרַיִם וְכִמְנַשֶּׁה
  choice: 像以法莲，也像玛拿西
  rationale: 用“也像”体现原文重复的比较介词，保留两个名字并列的节奏。
- source_word: וַיָּשֶׂם אֶת־אֶפְרַיִם לִפְנֵי מְנַשֶּׁה
  choice: 他就把以法莲列在玛拿西之前
  rationale: “列在……之前”既保留 לִפְנֵי 的位置意象，也自然传达祝福次序上的优先。
theological_decisions:
- issue: 祝福语中“以色列”的所指
  choice: 保留“以色列”，不扩写为雅各或以色列人
  alternative: 雅各；以色列人；以色列民族
  rationale: 原文只写“以色列”，在语境中可指向祖先雅各，也可预示后来以色列群体采用这句祝福语；直译可保留这种张力。
- issue: 以法莲被列在玛拿西之前的含义
  choice: 译作“列在……之前”
  alternative: 置于……之上；使……高过……
  rationale: 原文明确表达先后或优先，却没有使用抽象的地位术语；译文不进一步解释这种优先的神学意义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“用你来祝福”保留原文第二人称单数及介词表达，脚注说明其希伯来语习惯用法；人名采用中文圣经通行译名。
