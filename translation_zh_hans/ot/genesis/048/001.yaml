  text: וַ/יְהִ֗י אַחֲרֵי֙ הַ/דְּבָרִ֣ים הָ/אֵ֔לֶּה וַ/יֹּ֣אמֶר לְ/יוֹסֵ֔ף הִנֵּ֥ה אָבִ֖י/ךָ חֹלֶ֑ה וַ/יִּקַּ֞ח אֶת שְׁנֵ֤י בָנָי/ו֙ עִמּ֔/וֹ אֶת מְנַשֶּׁ֖ה וְ/אֶת אֶפְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/001.yaml
  text: After these things[a], it was said to Yoseph, “Look, your father is sick.” So he took his two sons with him, Manasseh and Ephraim.
translation:
  language: zh_hans
  text: 这些事以后，有人[a]对约瑟说：“看，你父亲病了。”约瑟就带上他的两个儿子玛拿西和以法莲。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“他对约瑟说”，但没有说明“他”是谁；这里译作“有人”，以保留说话者身份不明的特点。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי הַדְּבָרִים הָאֵלֶּה
  choice: 这些事以后
  rationale: 以自然的现代汉语承接前文，同时保留“这些事”这一宽泛表述，不把 דְּבָרִים 具体化为某一类事件或言语。叙事性的 וַיְהִי 无须另译为古雅的“事情发生了”。
- source_word: וַיֹּאמֶר לְיוֹסֵף
  choice: 有人对约瑟说
  rationale: 希伯来文使用未指明所指的第三人称阳性单数动词，未交代说话者。“有人”在汉语中自然地保留这种不确定性，不擅自补出具体人物。
- source_word: הִנֵּה
  choice: 看
  rationale: 作为引人注意的指示语气词，“看”简洁、自然，并保留话语的即时感，避免使用较古雅的“看哪”。
- source_word: אָבִיךָ חֹלֶה
  choice: 你父亲病了
  rationale: חֹלֶה 描述雅各当时患病的状态；“病了”符合现代汉语口语中的报信场景，又不额外说明病情轻重。
- source_word: וַיִּקַּח אֶת שְׁנֵי בָנָיו עִמּוֹ
  choice: 约瑟就带上他的两个儿子
  rationale: “带上”自然涵盖“把……带在身边、与自己同行”的意思；明确重复“约瑟”可避免汉语中主语不清，“就”体现叙事随即推进，但不强加因果解释。
- source_word: מְנַשֶּׁה וְאֶת אֶפְרָיִם
  choice: 玛拿西和以法莲
  rationale: 采用现代中文圣经传统中通行且易识别的人名译法，并保留二者作为“两个儿子”的同位说明。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。避免古雅套语，也不补出原文未说明的报信者、目的地或病情细节。
