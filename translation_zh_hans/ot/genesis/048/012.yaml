  yaml_path: translation/ot/genesis/048/012.yaml
  text: Then Joseph brought them out from between his knees[a], and he bowed with his face to the ground.
translation:
  language: zh_hans
  text: 随后，约瑟把他们从雅各膝旁带开[a]，随即脸伏于地下拜。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文也可译作“从雅各两膝之间带开”。这里的希伯来语表达描述两个孩子在雅各身边的近距离位置。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצֵא
  choice: 带开
  rationale: 这是יצא的使役形，表示约瑟使两个儿子离开原先靠近雅各的位置。“带开”在现代汉语中自然，也保留了使役和移动的含义。
- source_word: אֹתָם
  choice: 他们
  rationale: 宾语代词，指以法莲和玛拿西。
- source_word: מֵעִם בִּרְכָּיו
  choice: 从雅各膝旁
  rationale: מֵעִם基本表示从某人或某物身旁、近处离开。上下文表明物主最自然地指雅各；“膝旁”保留位置上的贴近，却不在正文中过度限定二人必定处于两膝之间。
- source_word: וַיִּשְׁתַּחוּ
  choice: 下拜
  rationale: 该动词表示以俯身或伏地的姿势表达敬意；“下拜”庄重、清楚，后面的姿势描述进一步说明其程度。
- source_word: לְאַפָּיו אָרְצָה
  choice: 面伏于地
  rationale: 原文合起来表示脸朝向地面的俯伏姿势。“面伏于地”简洁而明确地保留了身体姿态。
theological_decisions:
- issue: “他的膝”中物主代词的指向
  choice: 在正文中明确为雅各
  alternative: 理解为约瑟的膝
  rationale: 此前雅各把两个孩子拉近、亲吻并拥抱他们；本节随后描述约瑟将孩子从雅各身边带开并向长者下拜。因此，上下文最自然地以雅各为物主。这是叙事中的指代判断，并非教义性解释。
- issue: 下拜的明确对象
  choice: 不在正文中补出对象
  alternative: 译作“向雅各下拜”
  rationale: 上下文很可能表明约瑟是在向雅各行礼，但希伯来文本只陈述他面伏于地下拜，没有明说间接宾语；正文因此不补入原文未明示的对象。
translation_notes:
  register: 采用现代、庄重且易懂的叙事语言。“随后”承接前文动作；“面伏于地，下拜”既传达完整姿势，也避免生硬直译。脚注保留“膝旁”与“两膝之间”的词义空间。
