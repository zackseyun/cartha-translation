source:
  edition: WLC
  text: וְ/הַ/בָּאִ֗ים זָכָ֨ר וּ/נְקֵבָ֤ה מִ/כָּל בָּשָׂר֙ בָּ֔אוּ כַּֽ/אֲשֶׁ֛ר צִוָּ֥ה אֹת֖/וֹ אֱלֹהִ֑ים וַ/יִּסְגֹּ֥ר יְהוָ֖ה בַּֽעֲדֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/016.yaml
  text: And those that entered[a], male and female from all flesh, as God had commanded him[c][b]; and Yahweh shut him in.
translation:
  language: zh_hans
  text: 凡有血肉的活物[a]中，进去的有雄有雌；它们都照着上帝吩咐他的进去了；雅威就把他关在里面[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “凡有血肉的”是希伯来语的集合说法，指各类有血肉的活物。
    reason: 说明 מִכָּל־בָּשָׂר 的集合性用法，避免误解为仅指人类。
  - marker: b
    text: 也可译作“雅威在他身后关上了”。原文没有明说所关的是“门”，虽然方舟的语境使此意可被推知。
    reason: 保留 בַּעֲדוֹ 在此处“在他身后／使他留在里面”的表达空间，不把隐含的“门”写入正文。
lexical_decisions:
- source_word: וְהַבָּאִים ... בָּאוּ
  choice: 那些进去的……都进去了
  rationale: 保留希伯来文先用带冠词的分词指称“进去的那些”，随后再用限定动词“进去了”的重复结构；中文虽略有复沓，却能清楚呈现原文句法和叙事强调。
- source_word: זָכָר וּנְקֵבָה
  choice: 有雄有雌
  rationale: 上下文指动物，现代汉语用“雄、雌”自然准确；原文陈述性别类别，并未明确说每一种恰好“一雄一雌”，故不增添数量含义。
- source_word: מִכָּל בָּשָׂר
  choice: 从凡有血肉的当中来的
  rationale: 用“从……当中”体现 מִן 的部分、来源含义，同时保留 בָּשָׂר“肉”的集体表达；脚注说明此处所指。
- source_word: כַּאֲשֶׁר צִוָּה אֹתוֹ אֱלֹהִים
  choice: 正如上帝吩咐他的那样
  rationale: 忠实保留比较/符合关系和代词“他”，不在正文中擅自把代词改成专名；上下文表明所指是挪亚。
- source_word: וַיִּסְגֹּר
  choice: 关
  rationale: 表达“关闭、封闭”的动作；与“在里面”连用，形成自然的现代汉语。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语中对神圣四字名常见的音译呈现专名，而不以“主”这一称号代替。
- source_word: בַּעֲדוֹ
  choice: 把他关在里面
  rationale: 在 סגר 的搭配和方舟语境中，该词可表示从他后面关上，因而使他留在里面；正文不补出原文没有明说的“门”。
theological_decisions:
- issue: 神圣四字名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文使用的是专名而非“主”的称号。“雅威”较直接反映学界通常重构的读音；不以称号替换，也不把后起的“耶和华”形式放入正文。
- issue: 谁把挪亚关在里面
  choice: 雅威把他关在里面
  alternative: 雅威替他关上了门；雅威在他身后关上了
  rationale: 原文明确以雅威为主语，但没有明说“门”。译文保留神主动关闭、保护或封住方舟的叙述，同时不将隐含宾语写成明示内容。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。刻意保留“进去的……进去了”的希伯来式复现，但用“就是”“都”使中文层次清楚；用“有雄有雌”避免误加逐类成对数量。脚注标记均置于相关句末。
