revisions:
- from: 那些进去的，就是从凡有血肉的当中来的，有雄有雌，都进去了，正如上帝吩咐他的那样；雅威把他关在里面。[a][b]
  to: 凡有血肉的活物[a]中，进去的有雄有雌；它们都照着上帝吩咐他的进去了；雅威就把他关在里面[b]。
  rationale: 修订以“凡有血肉的活物中”重建 מִכָּל־בָּשָׂר 与“进去的”的关系，避免草稿中“从……当中来的”的误导性来源读法。保留“进去的……进去了”所反映的希伯来文带冠词分词与后续限定动词的复现；“它们”使中文指代明确。脚注内容仅作必要说明，并将锚点移至对应词语。
