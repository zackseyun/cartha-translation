base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/014.yaml
  text: they[a], and every wild animal according to its kind, and every livestock animal according to its kind, and every creeping thing that creeps on the earth according to its kind[b], and every bird according to its kind—every winged bird.
translation:
  language: zh_hans
  text: 他们和各从其类的一切野兽、各从其类的一切牲畜、各从其类的一切在地上爬行之物，以及各从其类的一切飞禽——各样的鸟类，凡有翅膀的。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֵמָּה
  choice: 他们
  rationale: 这是第三人称阳性复数独立代词，承接上文所列的挪亚及其家人；现代汉语用“他们”自然清楚。
- source_word: הַחַיָּה
  choice: 野兽
  rationale: 在本节的动物分类中与 בְּהֵמָה 相对，指野生陆栖动物；“野兽”简洁地保留这一区别。
- source_word: הַבְּהֵמָה
  choice: 牲畜
  rationale: 指家养的四足动物或畜类；“牲畜”既不局限于牛，也与“野兽”形成清楚对照。
- source_word: לְמִינָהּ / לְמִינֵהוּ
  choice: 各从其类
  rationale: 准确表达按种类分别归类的意思，并保留《创世记》分类语境中的重复句式。
- source_word: הָרֶמֶשׂ הָרֹמֵשׂ עַל הָאָרֶץ
  choice: 在地上爬行的一切动物
  rationale: “爬行”体现名词与同根分词的呼应；“动物”避免把范围不必要地缩限为现代生物分类中的爬行动物。
- source_word: הָעוֹף
  choice: 飞禽
  rationale: עוֹף 泛指飞行生物，但下文 צִפּוֹר 和“翅膀”的并列说明此处着眼于鸟类；“飞禽”既体现飞行特征，也符合汉语动物分类表达。
- source_word: כֹּל צִפּוֹר כָּל כָּנָף
  choice: 一切有翅膀的鸟
  rationale: 希伯来语直译近于“一切鸟，一切翅膀”，属于同位分类表达；汉语合译为“一切有翅膀的鸟”，保留其强调作用而避免生硬误解。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代书面汉语。保留原文反复出现的“各从其类”和逐项列举的节奏；破折号标明末句对“飞禽”的同位说明。本节在句法上承接前文，因此以“他们和……”起句并保留片段式结构。
