source:
  edition: WLC
  text: כֹּ֡ל אֲשֶׁר֩ נִשְׁמַת ר֨וּחַ חַיִּ֜ים בְּ/אַפָּ֗י/ו מִ/כֹּ֛ל אֲשֶׁ֥ר בֶּ/חָֽרָבָ֖ה מֵֽתוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/022.yaml
  text: Everything on the dry land in whose nostrils was the breath of the spirit of life died[a][b].
translation:
  language: zh_hans
  text: 陆地上一切鼻孔里有生命气息的，都死了。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “生命气息”按希伯来语较直译可作“生命之灵的气息”；“灵”也可译为“气”或“气息”。
    reason: 保留 נִשְׁמַת רוּחַ חַיִּים 的复合表达，并说明 רוּחַ 的词义范围。
lexical_decisions:
- source_word: כֹּל אֲשֶׁר
  choice: 凡……的，全都
  rationale: 这个结构概括所有符合后面条件的生物；“凡……的，全都”既保留全面涵盖的语气，也适合同时指人和动物。
- source_word: נִשְׁמַת רוּחַ חַיִּים
  choice: 生命气息
  rationale: 这一复合短语直译层次较多，其中 נְשָׁמָה 与 רוּחַ 在呼吸、气息的语义上有所重叠。“生命气息”在现代汉语中自然清楚，表达维持生命的呼吸，同时以脚注保留原文较完整的形式与歧义。
- source_word: בְּאַפָּיו
  choice: 鼻孔里
  rationale: 原文为带第三人称阳性单数后缀的复数名词，按个体分配使用；汉语无需明说“他的”，可自然译为“鼻孔里”。
- source_word: מִכֹּל אֲשֶׁר בֶּחָרָבָה
  choice: 凡在旱地上……的
  rationale: מִן 在这里与 כֹּל אֲשֶׁר 连用，界定死者的范围；“旱地上”准确体现与水域相对的干地，并避免暗示水中生物也包括在内。
- source_word: מֵתוּ
  choice: 全都死了
  rationale: 动词直接陈述死亡的结果；“死了”朴素明确，加“全都”在汉语中承接句首“凡”，表达原文的总体范围。
theological_decisions:
- issue: רוּחַ 在复合短语中应译作“灵”还是与“气息”合并表达
  choice: 正文译“生命气息”
  alternative: “生命之灵的气息”或“生命之气的气息”
  rationale: רוּחַ 可指风、气息或灵；在此与 נִשְׁמַת 和 חַיִּים 连用，很可能整体表示使生物存活的气息。正文不把它专门解释为独立的属灵实体，以免加入原文未明确要求的形而上含义；脚注保留较直译的可能。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“凡……的，全都……”清楚呈现原文的总括结构；“旱地”贴合洪水叙事中陆地与水域的对比。
