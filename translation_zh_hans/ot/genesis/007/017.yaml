  text: And the flood was on the earth forty days[a], and the waters increased and lifted up the ark, so that it rose above the earth.
translation:
  language: zh_hans
  text: 洪水在地上持续了四十天[a]；水势上涨，把方舟托起，使方舟高出地面。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“洪水在地上有四十天。”希伯来语动词可较形式化地译作“有”或“在”，但“持续了”在汉语中更自然地表达这里的时长。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: 持续了
  rationale: 这里与“四十天”连用，表示洪水延续的时长；“持续了”符合现代汉语叙事习惯，同时保留其时间意义。
- source_word: הַמַּבּוּל
  choice: 洪水
  rationale: 这是挪亚叙事中对这场特定大洪水的常用称呼，清楚自然。
- source_word: אַרְבָּעִים יוֹם
  choice: 四十天
  rationale: 直接表达原文的时长；汉语由“持续了”自然带出持续时间。
- source_word: עַל הָאָרֶץ
  choice: 在地上
  rationale: עַל表示“在……上”，אֶרֶץ在此可指地或大地；“在地上”简洁，并符合洪水语境。
- source_word: וַיִּרְבּוּ הַמַּיִם
  choice: 水势上涨
  rationale: רבה表示水增多、增强；“水势上涨”以自然汉语传达水量和水位不断增加的情景。
- source_word: וַיִּשְׂאוּ אֶת־הַתֵּבָה
  choice: 把方舟托起
  rationale: נשא在此指水将方舟向上抬起；“托起”准确表现水的承托作用。
- source_word: הַתֵּבָה
  choice: 方舟
  rationale: 这是现代中文圣经传统中对挪亚船只的通行译名，语境明确。
- source_word: וַתָּרָם
  choice: 方舟就浮离了
  rationale: 该阴性单数动词与“方舟”呼应，表示方舟升起；补明主语并用“浮离”自然呈现它被水抬升的结果。
- source_word: מֵעַל הָאָרֶץ
  choice: 地面
  rationale: מֵעַל表示从原先所在的表面升离；与“浮离”结合译为“浮离了地面”，清楚表达方舟不再停留在地面上。
