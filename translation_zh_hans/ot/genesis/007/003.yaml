base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/003.yaml
  text: Also from the birds of the sky[a], seven and seven, male and female, to keep offspring alive on the face of all the earth.
translation:
  language: zh_hans
  text: 天空的飞鸟也要带上七个七个[a]，公的和母的，好使后代在全地上存活。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“七对”。希伯来文直译为“七个，七个”，是一种分配式表达，可理解为每类各七只，也可理解为七对；正文较贴近地保留了希伯来文的形式。
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: 也
  rationale: 承接上一节关于动物的吩咐，表示飞鸟是另加的一类；“也”简洁自然。
- source_word: מֵעוֹף הַשָּׁמַיִם
  choice: 天空的飞鸟
  rationale: עוֹף在此指飞鸟，הַשָּׁמַיִם指天空；采用现代汉语的自然表达。希伯来语介词מִן的分类、选取意味由“带七个七个”的语境体现。
- source_word: שִׁבְעָה שִׁבְעָה
  choice: 七个七个
  rationale: 保留希伯来语数词重复的分配式表达，不在正文中预先断定是每类七只还是七对。
- source_word: זָכָר וּנְקֵבָה
  choice: 有公有母
  rationale: 在动物语境中，“公、母”比“男、女”准确，也自然表达两性的配合，同时避免擅自补成“一公一母”。
- source_word: לְחַיּוֹת
  choice: 好使……存活
  rationale: 该使役式不定词表达保存生命、使之继续存活的目的；“好使……存活”清楚呈现目的关系。
- source_word: זֶרַע
  choice: 后代
  rationale: זֶרַע本义为“种子”，此处指洪水之后延续的动物后裔；“后代”在现代汉语中明确自然。
- source_word: עַל פְּנֵי כָל הָאָרֶץ
  choice: 在全地上
  rationale: 准确传达希伯来语“在全地表面上”的空间意象，同时避免生硬的“在全地的面上”。
theological_decisions:
- issue: “七个七个”所指的数量
  choice: 正文保留数词重复形式
  alternative: 译作“七对”或“每类七只”
  rationale: 希伯来语的分配式表达可以有不同理解；正文不消除原文的真实歧义，另以脚注说明。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“七个七个”刻意保留原文略显特殊的重复形式，并以脚注帮助读者理解；“好使后代……存活”清楚表达目的。
