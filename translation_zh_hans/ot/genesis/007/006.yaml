  text: וְ/נֹ֕חַ בֶּן שֵׁ֥שׁ מֵא֖וֹת שָׁנָ֑ה וְ/הַ/מַּבּ֣וּל הָיָ֔ה מַ֖יִם עַל הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/006.yaml
  text: Noah was six hundred years old[b][a], and the flood was upon the earth.
translation:
  language: zh_hans
  text: 挪亚六百岁时，洪水已在大地[b]上泛滥[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文的两个分句以“而”并列：直按词序可表达为“挪亚六百岁；洪水是水在地上”。后一句的“是／成为水在地上”结构在汉语中不自然，正文按其语境译为“洪水已在大地上泛滥”。
    reason: 保留原文הָיָה מַיִם及两个分句并列的特殊结构，说明正文的惯用语改写。
  - marker: b
    text: “大地”也可译作“地”或“土地”。
    reason: 希伯来语הָאָרֶץ可指大地，也可指土地；该词本身未完全消除范围上的歧义。
lexical_decisions:
- source_word: וְ/נֹחַ
  choice: 挪亚
  rationale: וְ承接前文，但现代汉语在本句开头不必机械译作“于是”或“而”；人名按通行译法译为“挪亚”。
- source_word: בֶּן שֵׁשׁ מֵאוֹת שָׁנָה
  choice: 六百岁时
  rationale: 希伯来语直译为“六百岁之子”，是表达年龄的固定用法；译成“六百岁时”自然清楚，也把年龄与当时发生的洪水相连。
- source_word: וְ/הַ/מַּבּוּל
  choice: 洪水
  rationale: מַבּוּל在创世记6—9章特指这场大洪水；“洪水”是现代汉语中准确而通行的表达。
- source_word: הָיָה מַיִם
  choice: 泛滥
  rationale: 原文形式上是“成为／是水”，与“洪水”组合后表达水已遍布地面的情形。译作“泛滥”符合汉语习惯，同时用脚注保留原文较特殊的句法。
- source_word: עַל הָאָרֶץ
  choice: 在大地上
  rationale: עַל表示“在……上”；הָאָרֶץ在此上下文中宜译为范围较广的“大地”，但也可理解为“地上／土地”，故加脚注说明。
theological_decisions:
- issue: הָאָרֶץ的范围
  choice: 大地
  alternative: 地上；土地
  rationale: 该词本身既可指“大地／全地”，也可指“土地／一片地方”。洪水叙事的语境支持较广的“大地”，但译文不借此额外界定洪水的地理范围，并在脚注中保留词义上的可能性。
- issue: 两分句之间的关系
  choice: 用“时”表达同一时点
  alternative: “挪亚六百岁，洪水在大地上成了水”或以“而”连接
  rationale: 原文以וְ并列两个分句，没有明说因果关系。“时”仅自然表达年龄与事件的时间关联，不引入因果解释；脚注保留更贴近形式的并列结构。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“泛滥在大地上”保留洪水与水覆盖地面的意象，避免生硬照搬“洪水是水”的希伯来语结构。脚注标记均置于正文相应位置。
