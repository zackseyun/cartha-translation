  text: מִן הַ/בְּהֵמָה֙ הַ/טְּהוֹרָ֔ה וּ/מִן הַ֨/בְּהֵמָ֔ה אֲשֶׁ֥ר אֵינֶ֖נָּ/ה טְהֹרָ֑ה וּ/מִ֨ן הָ/ע֔וֹף וְ/כֹ֥ל אֲשֶׁר רֹמֵ֖שׂ עַל הָֽ/אֲדָמָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/008.yaml
  text: From the clean animals and from the animals that are not clean[a], and from the birds and everything that creeps on the ground—
translation:
  language: zh_hans
  text: 从洁净的动物中，从不洁净[a]的动物中，从飞鸟和一切在地上爬行的生物中——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“不是洁净的（动物）”。
    reason: 保留希伯来文使用分析式否定，而非单一反义词的措辞特点。
lexical_decisions:
- source_word: מִן
  choice: 从……中
  rationale: 介词表示从各类别中选取；在中文里用“从……中”自然呈现来源和类别关系，并适度保留原文反复列举的节奏。
- source_word: בְּהֵמָה
  choice: 牲畜
  rationale: 该词通常指陆生的大型动物，常包括家畜；本节与飞鸟及地上爬行的生物并列。结合挪亚叙事中洁净动物的语境，“牲畜”比泛指一切生物的“动物”更贴切。
- source_word: טְּהוֹרָה
  choice: 洁净的
  rationale: 这里涉及动物的礼仪类别，“洁净”是现代中文圣经语境中准确而通行的表达，也避免把它误解为普通卫生意义上的“干净”。
- source_word: אֲשֶׁר אֵינֶנָּה טְהֹרָה
  choice: 不洁净的
  rationale: 原文直译为“不是洁净的”。正文采用自然简洁的“不洁净”，并以脚注保留原文分析式否定的表达。
- source_word: עוֹף
  choice: 飞鸟
  rationale: 该词可泛指有翼飞行的生物；此处译作“飞鸟”符合上下文，且比单说“鸟”略能体现原词的飞行类别意味。
- source_word: כֹּל אֲשֶׁר רֹמֵשׂ
  choice: 一切……爬行的生物
  rationale: רֹמֵשׂ描写贴地移动或爬行。加“生物”使中文句法完整，同时保留类别的广泛性。
- source_word: עַל הָאֲדָמָה
  choice: 在地上
  rationale: אֲדָמָה在此指这些生物活动的地面，译作“在地上”自然准确。
theological_decisions:
- issue: 洁净与不洁净动物的分类
  choice: 沿用礼仪类别用语“洁净／不洁净”，不解释其制度来源
  alternative: 译为“干净／不干净”或在正文说明摩西律法
  rationale: 原文只陈述分类，并未在本节解释其依据；采用通行的礼仪术语可传达含义，同时避免把后来的制度细节导入正文。
translation_notes:
  register: 采用现代、庄重而易懂的叙事中文。以破折号保留原文句末未完的列举结构，使本节自然衔接下一节。
