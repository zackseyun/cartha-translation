base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/009.yaml
  text: Two by two they came to Noah into the ark[a], male and female[b], just as God had commanded Noah.
translation:
  language: zh_hans
  text: 它们一对一对地[a]来到挪亚那里，进入方舟；每对都是一公一母[b]，正如上帝所吩咐挪亚的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“两个两个地”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“雄性和雌性”。
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁנַיִם שְׁנַיִם
  choice: 一对一对地
  rationale: 希伯来语重复数字“二”具有分配意义，表示动物两个一组而来；此译自然地保留了成对、逐组而来的含义。
- source_word: בָּאוּ
  choice: 来到
  rationale: בוא是常用的移动动词，可表示“来、去、进入”；结合“挪亚那里”的叙事视角，译作“来到”最为贴切。
- source_word: אֶל נֹחַ
  choice: 到挪亚那里
  rationale: אֶל表示朝向某人或某处移动；“到挪亚那里”符合现代汉语表达。
- source_word: אֶל הַתֵּבָה
  choice: 进入方舟
  rationale: 虽然אֶל本义常为“到、向”，但在以方舟为目的地的移动语境中，实际含有进入其中之意；译作“进入方舟”清楚而自然。
- source_word: זָכָר וּנְקֵבָה
  choice: 一公一母
  rationale: 原文是动物性别的配对称谓。中文叙述动物时，“一公一母”自然简洁，并与前面的成对而来相呼应；脚注保留较形式对应的译法。
- source_word: כַּאֲשֶׁר
  choice: 正如
  rationale: 该连接词表示事情与先前命令相符；“正如”准确表达这种对应关系。
- source_word: צִוָּה אֱלֹהִים אֶת נֹחַ
  choice: 上帝所吩咐挪亚的
  rationale: 希伯来语完成式所指的吩咐先于动物到来；“所……的”结构在中文中自然表达其遵照先前命令而行。
- source_word: אֱלֹהִים
  choice: 上帝
  rationale: 此处在创世记叙事中指独一的上帝，采用现代汉语常用的单数称谓。
theological_decisions:
- issue: 动物来到方舟的行为主体与方式
  choice: 保留“它们来到”的主动表述，并说明此事符合上帝对挪亚的吩咐
  alternative: 明说上帝以超自然方式驱使动物，或说全由挪亚亲自聚集动物
  rationale: 原文陈述动物来到挪亚那里，并将此事与上帝的命令相联系，却没有说明具体机制；译文不额外限定动物如何到来。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“一对一对地”保留原文句首的强调；“来到挪亚那里，进入方舟”依次呈现两个以אֶל引出的趋向语，不另加原文没有的并列连词。
