  text: And the waters prevailed over the earth for 150 days[a].
translation:
  language: zh_hans
  text: 水势在大地上极其浩大，持续了一百五十天。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “大地”也可译作“土地”；希伯来语אֶרֶץ可依上下文指大地或土地。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְבְּרוּ
  choice: 水势浩大
  rationale: גבר的Qal连续叙事形式表示变强、强盛或占据优势。结合洪水语境，“水势浩大”自然表达洪水强盛、压倒一切的状态，同时与单纯的“上涨”有所区别。
- source_word: הַמַּיִם
  choice: 水势
  rationale: 希伯来语为形态上的复数“众水”。现代汉语在此通常以“水”或“水势”表达；采用“水势”也能顺畅承接动词所强调的强盛状态。
- source_word: עַל הָאָרֶץ
  choice: 淹没大地
  rationale: עַל表示在……之上；在洪水叙事中，译作“淹没大地”比逐字的“在大地之上”更符合现代汉语，并表达洪水覆盖、压倒大地。אֶרֶץ在此按叙事的普遍范围译为“大地”。
- source_word: חֲמִשִּׁים וּמְאַת יוֹם
  choice: 共一百五十天
  rationale: 原文直序为“五十和一百天”，即一百五十天；“共”自然标明持续时间，未增添新的内容。
theological_decisions:
- issue: 洪水叙事中אֶרֶץ的范围
  choice: 大地
  alternative: 那地／陆地
  rationale: 上下文以普遍性的措辞描写洪水，因此正文采用“大地”；但אֶרֶץ本身也可指“地、土地、陆地”，故以脚注保留词义上的真实可能性，不把范围问题处理成词汇上毫无歧义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“水势浩大，淹没大地”兼顾原文גבר的强盛含义和汉语表达习惯；数字写作中文全称，以适合正文朗读。
