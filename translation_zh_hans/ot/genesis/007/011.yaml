id: GEN.7.11
reference: Genesis 7:11
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: בִּ/שְׁנַ֨ת שֵׁשׁ מֵא֤וֹת שָׁנָה֙ לְ/חַיֵּי נֹ֔חַ בַּ/חֹ֨דֶשׁ֙ הַ/שֵּׁנִ֔י בְּ/שִׁבְעָֽה עָשָׂ֥ר י֖וֹם לַ/חֹ֑דֶשׁ בַּ/יּ֣וֹם הַ/זֶּ֗ה נִבְקְעוּ֙ כָּֽל מַעְיְנֹת֙ תְּה֣וֹם רַבָּ֔ה וַ/אֲרֻבֹּ֥ת הַ/שָּׁמַ֖יִם נִפְתָּֽחוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/011.yaml
  text: In the six hundredth year of Noah’s life[a], in the second month, on the seventeenth day of the month, on that day all the springs of the great deep burst open[b], and the windows of the heavens were opened.
translation:
  language: zh_hans
  text: 挪亚六百岁那一年，二月十七日，就在那一天，大渊的一切泉源[a]都裂开了，天上的窗户[b]也打开了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“大渊的一切水泉”。
    reason: lexical_alternative
  - marker: b
    text: 或译“天上的水闸”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּשְׁנַת שֵׁשׁ מֵאוֹת שָׁנָה לְחַיֵּי נֹחַ
  choice: 挪亚六百岁那一年
  rationale: 这是按挪亚一生年岁标明时间的希伯来语日期公式。此译自然、清楚，并保留“第六百年”的含义。
- source_word: בַּחֹדֶשׁ הַשֵּׁנִי בְּשִׁבְעָה עָשָׂר יוֹם לַחֹדֶשׁ
  choice: 二月十七日
  rationale: 希伯来语直陈“第二个月、当月第十七日”；现代汉语以“二月十七日”自然表达同一日期，不把“二月”理解为现代公历二月。
- source_word: בַּיּוֹם הַזֶּה
  choice: 就在那一天
  rationale: “就在”体现指示语的强调作用，“那一天”承接前述确切日期。
- source_word: נִבְקְעוּ
  choice: 都裂开了
  rationale: בקע 的 Nifal 形态表示被劈开、裂开；译文保留灾变性的动态意象，同时不额外说明其物理机制。
- source_word: כָּל מַעְיְנֹת תְּהוֹם רַבָּה
  choice: 大渊的一切泉源
  rationale: מַעְיָן 可指泉、水源；תְּהוֹם רַבָּה 指“广大/巨大的深渊之水”。“大渊”凝练地保留古代宇宙图景，“泉源”则较“喷泉”更符合现代汉语。
- source_word: וַאֲרֻבֹּת הַשָּׁמַיִם
  choice: 天上的窗户
  rationale: אֲרֻבּוֹת 基本意象是窗、开口；“天上的窗户”保留原文图像，而不直接把它解释成降雨机制。
- source_word: נִפְתָּחוּ
  choice: 也打开了
  rationale: Nifal 形式在此描述窗户被打开；现代汉语无需机械添加“被”，仍可自然表达该事件，并与前句形成平行。
theological_decisions:
- issue: 洪水叙事中的宇宙图景
  choice: 保留“大渊”和“天上的窗户”的现象性、宇宙性语言
  alternative: 释义为“地下水喷涌、天空的水闸开启”等现代化或机制化表述
  rationale: 原文以古代宇宙图像描写洪水爆发。翻译应保存叙事张力与意象，不把经文改写成现代科学说明，也不对其物理结构作教义化断定。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“挪亚六百岁那一年”比“一生的第六百年”更符合现代汉语；“就在那一天”保留日期公式的强调。“大渊”“窗户”保存原文意象，脚注提供较解释性的词汇选择。英文咨询层的脚注标记与脚注内容似有错位，本稿依原文把词汇脚注分别置于“泉源”和“窗户”之后。
