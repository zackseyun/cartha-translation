id: GEN.7.2
reference: Genesis 7:2
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: מִ/כֹּ֣ל הַ/בְּהֵמָ֣ה הַ/טְּהוֹרָ֗ה תִּֽקַּח לְ/ךָ֛ שִׁבְעָ֥ה שִׁבְעָ֖ה אִ֣ישׁ וְ/אִשְׁתּ֑/וֹ וּ/מִן הַ/בְּהֵמָ֡ה אֲ֠שֶׁר לֹ֣א טְהֹרָ֥ה הִ֛וא שְׁנַ֖יִם אִ֥ישׁ וְ/אִשְׁתּֽ/וֹ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/002.yaml
  text: From every clean animal you shall take for yourself seven pairs[a], a male and its mate; and from the animals that are not clean, two[b], a male and its mate.
translation:
  language: zh_hans
  text: 凡洁净的牲畜，你要为自己带上七对[a]，每对一公一母；凡不洁净的牲畜，要带上两个[b]，一公一母。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“七个七个，一公一母”；这里很可能指七对，但也有人理解为七只。
    reason: alternative_reading
  - marker: b
    text: 希伯来文直译为“不是洁净的牲畜”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִכֹּל הַבְּהֵמָה
  choice: 凡……的牲畜
  rationale: מִן与כֹּל构成周遍、分配性的表达。בְּהֵמָה主要指陆生四足牲畜；此处用“牲畜”比泛称“动物”更贴近词义和上下文。
- source_word: הַטְּהוֹרָה
  choice: 洁净的
  rationale: טָהוֹר在此涉及洁净与不洁净的分类；“洁净”是简明且不过度解释其礼仪性质的常用译法。
- source_word: תִּקַּח לְךָ
  choice: 你要为自己带上
  rationale: 未完成式在语境中表达指令；“为自己”保留לְךָ，“带上”自然表达挪亚将牲畜带入方舟的动作。
- source_word: שִׁבְעָה שִׁבְעָה
  choice: 七对
  rationale: 重复数词具有分组或分配作用，且下接“一公一母”，最自然地理解为七个雌雄配对；原文形式及另一种理解在脚注中保留。
- source_word: אִישׁ וְאִשְׁתּוֹ
  choice: 一公一母
  rationale: 字面为“一个男子和他的妻子”，用于牲畜时是拟人化的配偶表达；现代汉语以“一公一母”准确、自然地传达雌雄成对。
- source_word: אֲשֶׁר לֹא טְהֹרָה הִוא
  choice: 不洁净的
  rationale: 原文分析式地说“不是洁净的”。汉语“不洁净的”既简洁，又保持与前文“洁净的”的直接对照。
- source_word: שְׁנַיִם
  choice: 两个
  rationale: 直接保留阳性数词“二”；随后“一公一母”说明这两个个体构成一对。
theological_decisions:
- issue: 洁净牲畜数目短语的含义
  choice: 七对洁净牲畜
  alternative: 七只洁净牲畜；或更直译为“七个七个”
  rationale: שִׁבְעָה שִׁבְעָה后接“一公一母”，并与不洁净牲畜的“两个，一公一母”对照，较可能指七对。由于重复数词的字面形式也可被理解为七个个体，脚注明确保留此歧义。
- issue: 洁净分类的性质
  choice: 仅译作“洁净／不洁净”
  alternative: “礼仪上洁净／不洁净”
  rationale: 经文本身没有在本节明确加上“礼仪上”这一限定；正文避免超出原文作神学分类说明。
translation_notes:
  register: 采用现代、庄重而通俗的叙事指令语体。“凡……要……”符合现代标准汉语；“牲畜”贴近בְּהֵמָה所指的四足家畜或牲畜类别。“每对”是为使“一公一母”与“七对”的关系清楚而作的轻度显明化。
