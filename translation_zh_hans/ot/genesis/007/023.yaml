  to: 他把地面上一切有生之物都抹去了[a]，从人[b]到牲畜、爬行的动物，再到天空的飞鸟[c]。它们都从地上被抹去了；只有挪亚和在方舟里与他同在的还存留着。
  rationale: 修订仅处理两个安全且必要的汉语表达问题：以“爬行的动物”避免把 רמש 窄化为现代分类学术语；重构末句以消除句法悬置，并保留原文对方舟中与挪亚同在者并未明确限定类别的开放指称。其余内容保留原文的重复、列举范围和叙事力度。
