language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יִּ֜מַח אֶֽת כָּל הַ/יְק֣וּם אֲשֶׁ֣ר עַל פְּנֵ֣י הָֽ/אֲדָמָ֗ה מֵ/אָדָ֤ם עַד בְּהֵמָה֙ עַד רֶ֨מֶשׂ֙ וְ/עַד ע֣וֹף הַ/שָּׁמַ֔יִם וַ/יִּמָּח֖וּ מִן הָ/אָ֑רֶץ וַ/יִשָּׁ֧אֶר אַךְ נֹ֛חַ וַֽ/אֲשֶׁ֥ר אִתּ֖/וֹ בַּ/תֵּבָֽה־־׀׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/023.yaml
  text: He blotted out every living thing that was on the face of the ground[a], from man to livestock to creeping things and to the birds of the heavens. They were blotted out from the earth, and only Noah was left[c][b], and those who were with him in the ark.
translation:
  language: zh_hans
  text: 他把地面上一切有生之物都抹去了[a]，从人[b]到牲畜、爬行的动物，再到天空的飞鸟[c]。它们都从地上被抹去了；只有挪亚和在方舟里与他同在的还存留着。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “抹去”也可译作“擦除”或“除灭”；希伯来语动词含有擦去、抹掉的形象。
    reason: lexical_alternative
  - marker: b
    text: “人”在这里以集合意义指全人类，也可译作“人类”。
    reason: lexical_alternative
  - marker: c
    text: “天空的飞鸟”也可译作“天上的飞鸟”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמַח / וַיִּמָּחוּ
  choice: 抹去了 / 被抹去了
  rationale: מחה含有擦除、抹去的形象；“抹去”既保留这一意象，也能在洪水语境中自然表达彻底除灭。第二处采用被动式，以反映尼法勒词干。
- source_word: כָּל הַיְקוּם
  choice: 一切有生之物
  rationale: יקום本义与站立、存在有关，在洪水叙事中指地上的各种活物；译作“一切有生之物”比抽象的“一切存在”更符合上下文。
- source_word: עַל פְּנֵי הָאֲדָמָה
  choice: 地面上
  rationale: 以自然的现代汉语表达希伯来语“在土地表面上”的惯用意象，并清楚修饰被抹去的活物。
- source_word: מֵאָדָם
  choice: 从人
  rationale: אָדָם在此以单数集合意义代表人类，并引出受造物类别的列举；“从人”保留原文形式和范围结构。
- source_word: בְּהֵמָה
  choice: 牲畜
  rationale: 在该受造物分类语境中，בְּהֵמָה主要指家养的大型陆生动物；“牲畜”是清楚、常用的现代汉语。
- source_word: רֶמֶשׂ
  choice: 爬行动物
  rationale: 此词泛指贴近地面活动的小型动物。“爬行动物”按圣经叙事中的普通分类理解，并非严格限定为现代生物分类学中的爬行纲。
- source_word: עוֹף הַשָּׁמַיִם
  choice: 天空的飞鸟
  rationale: “天空的飞鸟”自然保留原文的属格结构和创世记文体；“天空”在现代汉语中比“诸天”更适合此处可见天空的含义。
- source_word: מִן הָאָרֶץ
  choice: 从地上
  rationale: אֶרֶץ可指地、土地或大地；此处“从地上”与前文“地面上”呼应，同时不把经文改写成现代科学范围陈述。
- source_word: וַיִּשָּׁאֶר אַךְ נֹחַ
  choice: 只剩下挪亚
  rationale: “只”体现限制词אַךְ，“剩下”准确表达שׁאר的存留之意，且符合现代汉语习惯。
- source_word: וַאֲשֶׁר אִתּוֹ בַּתֵּבָה
  choice: 以及同他一起在方舟里的
  rationale: 原文关系结构没有明说所指仅为人或包括动物。汉语采用开放的名词化结构，保留其包容性，避免擅自缩窄为“那些人”。
theological_decisions:
- issue: 洪水毁灭范围的表述
  choice: 直接译出经文所列地上活物被抹去、从地上消失的叙事性宣告
  alternative: 将其限定为区域性夸张，或扩写为明确的全球科学陈述
  rationale: 译文保留希伯来语强烈而全面的叙事措辞，却不加入经文本身未明说的现代地理或科学界定，让读者面对原文保有的解释张力。
- issue: 方舟中与挪亚同在者的范围
  choice: 采用“同他一起在方舟里的”这一开放表达
  alternative: 明确译成“同他一起在方舟里的那些人”或“方舟里与他同在的一切活物”
  rationale: אֲשֶׁר אִתּוֹ并未在本句明示其先行对象；上下文可包括人和动物，因此不应在译文中无根据地只限定为人。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。保留原文两次使用“抹去”的重复，以呈现其修辞力度；列举结构用“从……到……再到……”表达。末句有意不补出“人”或“一切活物”，以保留希伯来语关系从句在所指范围上的开放性。
