  text: וַ/יַּ֖עַשׂ נֹ֑חַ כְּ/כֹ֥ל אֲשֶׁר צִוָּ֖/הוּ יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/005.yaml
  text: And Noah did according to all that Yahweh had commanded him[a].
translation:
  language: zh_hans
  text: 挪亚就照着耶和华吩咐他的一切做了。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：挪亚就照着耶和华吩咐他的一切做了。
    reason: 说明原文采用“照着……一切”的结构，强调行动与命令完全相符。
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: 就……做了
  rationale: עָשָׂה含义宽泛，可指“做、行”。在本句与“照着……一切”连用时，“做了”自然地表达挪亚遵命而行，又不额外具体化其行动。וַ־在叙事中承接上文，译作“就”。
- source_word: נֹחַ
  choice: 挪亚
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: כְּכֹל אֲשֶׁר
  choice: 照着……的一切
  rationale: כְּ表示依照、符合，כֹל表示全部；此译法保留“完全依照”的结构和语义，同时符合现代汉语表达。
- source_word: צִוָּהוּ
  choice: 吩咐他
  rationale: צוה表示有权柄地命令。“吩咐”是中文圣经语体中自然且庄重的对应词；宾语后缀־הוּ明确译为“他”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代简体中文读者最熟悉的专名形式呈现四字神名，保留其作为专名而非称号的性质。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名，应译作专名而非以“主”替代。“耶和华”是现代中文圣经传统中最通行、普通读者最易识别的形式；“雅威”更接近学界常见的拟音，但在中文公众语境中通行度较低。
- issue: 挪亚顺服程度的表达
  choice: 照着……的一切做了
  alternative: 凡……都照做了
  rationale: 保留כְּכֹל的形式和“完全符合命令”的强调，但不进一步加入对挪亚动机或品格的神学评断。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“就”承接叙事，“照着……的一切做了”略带经文语体，但仍属现代汉语可自然理解的表达。
