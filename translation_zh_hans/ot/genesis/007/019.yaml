  text: וְ/הַ/מַּ֗יִם גָּֽבְר֛וּ מְאֹ֥ד מְאֹ֖ד עַל הָ/אָ֑רֶץ וַ/יְכֻסּ֗וּ כָּל הֶֽ/הָרִים֙ הַ/גְּבֹהִ֔ים אֲשֶׁר תַּ֖חַת כָּל הַ/שָּׁמָֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/019.yaml
  text: And the waters prevailed exceedingly over the earth[b][a], and all the high mountains under all the heavens were covered.
translation:
  language: zh_hans
  text: 水势在大地[a]上极其强盛，普天之下[b]所有的高山都被水覆盖了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“土地”。希伯来语אֶרֶץ既可指“大地”，也可指“土地”；具体范围须结合上下文理解。
    reason: alternative_reading
  - marker: b
    text: 直译“在诸天之下”；也可译“在整个天空之下”。
    reason: lexical_alternative
lexical_decisions:
- source_word: גָּבְרוּ
  choice: 水势……浩大
  rationale: גבר表示强盛、增强或占据优势；结合洪水语境，用“水势浩大”既保留水势强盛的意象，也符合现代汉语表达。
- source_word: מְאֹד מְאֹד
  choice: 极其
  rationale: 原文重复מְאֹד以加强程度。“极其”自然、庄重地传达高度强化的语气；不把它解释成原文未明确表达的时间性递增。
- source_word: עַל הָאָרֶץ
  choice: 在大地上
  rationale: עַל在此表示“在……上”；אֶרֶץ可指“大地”或“土地”。正文采用“大地”，与本节广阔的叙事措辞相称，同时以脚注保留“土地”的可能。
- source_word: וַיְכֻסּוּ
  choice: 都被水覆盖了
  rationale: 该形式表达高山被覆盖；补出语境中明确的施事“水”，使现代汉语清楚自然，而不改变原意。
- source_word: כָּל הֶהָרִים הַגְּבֹהִים
  choice: 所有的高山
  rationale: 直接保留כָּל的全称范围、הָרִים的“山”义和גְּבֹהִים的“高”义。
- source_word: תַּחַת כָּל הַשָּׁמָיִם
  choice: 普天之下
  rationale: 这是自然、庄重的现代汉语表达，准确传达“整个天空之下”的广泛范围；脚注说明更贴近词形的译法。
theological_decisions:
- issue: 洪水叙事中אֶרֶץ的范围
  choice: 大地
  alternative: 土地
  rationale: “普天之下”的措辞使本节以普遍性的语言描写洪水，故正文用“大地”；但אֶרֶץ本身也可指一片“土地”，脚注保留这一真实的词义歧义，不据此加入现代科学层面的断言。
translation_notes:
  register: 采用自然、庄重且易懂的现代标准汉语。“极其浩大”保留原文双重程度副词的强烈语气；“普天之下”传达希伯来语的广泛范围，同时借脚注保留其字面形式。
