  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ לְ/נֹ֔חַ בֹּֽא אַתָּ֥ה וְ/כָל בֵּיתְ/ךָ֖ אֶל הַ/תֵּבָ֑ה כִּֽי אֹתְ/ךָ֥ רָאִ֛יתִי צַדִּ֥יק לְ/פָנַ֖/י בַּ/דּ֥וֹר הַ/זֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/001.yaml
  text: Then Yahweh said to Noah, “Enter the ark, you and all your household, because I have seen that you are righteous before me in this generation.”
translation:
  language: zh_hans
  text: 耶和华对挪亚说：“你和你全家都要进入方舟，因为在这一代人中，我看你在我面前是义人。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名“耶和华”译出四字神名，不用“主”这一称号代替。
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 叙事性前接连词推动情节；中文按上下文自然承接，无须机械增译“然后”。
- source_word: בֹּא
  choice: 进入
  rationale: 该命令式可表达“来、进入”；“进入方舟”在现代汉语中简洁自然，也保留原文的空间指向。
- source_word: בֵּיתְךָ
  choice: 你全家
  rationale: 这里的“家”指家庭成员构成的家户，而非建筑物；“全家”准确而通俗。
- source_word: הַתֵּבָה
  choice: 方舟
  rationale: 该词指挪亚进入的箱形船体；“方舟”是中文中明确且约定俗成的对应词。
- source_word: כִּי
  choice: 因为
  rationale: 引出命令的原因，译为“因为”清楚保留因果关系。
- source_word: רָאִיתִי
  choice: 我看
  rationale: 希伯来语完成式在此表示上帝已经察看并作出认定；中文“我看……是”自然表达这种评断及其当前效力。
- source_word: צַדִּיק
  choice: 义人
  rationale: 该词在此作为表语，指在上帝面前被认定为正直、公义的人；“义人”保留其圣经语义和神学分量。
- source_word: לְפָנַי
  choice: 在我面前
  rationale: 较直接保留希伯来语“在我面前”的表达，指上帝亲自察看和评断。
- source_word: בַּדּוֹר הַזֶּה
  choice: 在这一代人中
  rationale: 指挪亚同时代的人群；加“人”使现代中文含义明确，并保留其群体比较背景。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名，正文以中文传统且广为人知的专名“耶和华”呈现，而不以“主”代替；“雅威”则更接近现代学界通常推定的读音。
- issue: 挪亚被称为义人的含义
  choice: 我看你在我面前是义人
  alternative: 我认为你是义人
  rationale: 保留原文对挪亚在上帝面前为义的直接评断，不加入“唯独”、称义依据或相对程度等原文未明说的解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“你和你全家都要进入方舟”清楚传达命令范围；后半句尽量保留原文语序和“在我面前”的意象。
