  - severity: medium
    issue: “血肉之躯”在本节指称不当。
    rationale: 该汉语词通常指人的身体；原文בָּשָׂר在洪水叙事中泛指有生命的肉身活物。
  revised_text: 凡有生命气息[a]的血肉活物，都一对一对地来到挪亚那里，进入方舟。
