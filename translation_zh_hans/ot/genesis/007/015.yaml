  text: וַ/יָּבֹ֥אוּ אֶל נֹ֖חַ אֶל הַ/תֵּבָ֑ה שְׁנַ֤יִם שְׁנַ֨יִם֙ מִ/כָּל הַ/בָּשָׂ֔ר אֲשֶׁר בּ֖/וֹ ר֥וּחַ חַיִּֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/015.yaml
  text: They came to Noah into the ark[a], two by two from all flesh in which was the breath of life.
translation:
  language: zh_hans
  text: 凡有生命气息[a]的血肉活物，都一对一对地来到挪亚那里，进入方舟。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“生命之灵”。希伯来语 רוּחַ 可指“气息”“风”或“灵”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: 它们……来到
  rationale: בוא在叙事中表示来到或进入；“来到”保留其基本移动义，并由后面的介词短语交代终点。
- source_word: אֶל נֹחַ אֶל הַתֵּבָה
  choice: 来到挪亚那里，进入方舟
  rationale: 两个אֶל短语依次指向挪亚和方舟；前者译为“到……那里”，后者按登舟语境译为“进入”，既保留结构，也符合现代汉语表达。
- source_word: שְׁנַיִם שְׁנַיִם
  choice: 一对一对地
  rationale: 重复数词表达分配意义，即每两个为一组；“一对一对地”自然且准确。
- source_word: מִכָּל הַבָּשָׂר
  choice: 来自一切……血肉之躯
  rationale: בָּשָׂר字面为“肉、血肉”，洪水叙事中泛指有血肉的活物；保留“血肉”可维持本段反复出现的主题词。为避免现代汉语误解，句中补出“这些动物”。
- source_word: אֲשֶׁר בּוֹ
  choice: 有……的
  rationale: 希伯来文直译为“其中有”；现代汉语用领属结构“有……的”更自然，同时不改变关系从句所修饰的范围。
- source_word: רוּחַ חַיִּים
  choice: 生命气息
  rationale: רוּחַ可指气息、风或灵；在描述各类动物生命状态的语境中，“生命气息”最贴切。חַיִּים虽为复数形式，此处惯用义为“生命”。
theological_decisions:
- issue: רוּחַ חַיִּים中רוּחַ的含义
  choice: 生命气息
  alternative: 生命之灵
  rationale: 此处着重说明进入方舟的血肉活物具有生命，故正文采用“气息”；脚注保留“灵”的可能性，避免把原文的词义张力完全消除。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“一对一对地”传达分配结构；“血肉之躯”保留原文בָּשָׂר的具象表达，避免完全泛化为“生物”。
