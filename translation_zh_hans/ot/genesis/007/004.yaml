  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּי֩ לְ/יָמִ֨ים ע֜וֹד שִׁבְעָ֗ה אָֽנֹכִי֙ מַמְטִ֣יר עַל הָ/אָ֔רֶץ אַרְבָּעִ֣ים י֔וֹם וְ/אַרְבָּעִ֖ים לָ֑יְלָה וּ/מָחִ֗יתִי אֶֽת כָּל הַ/יְקוּם֙ אֲשֶׁ֣ר עָשִׂ֔יתִי מֵ/עַ֖ל פְּנֵ֥י הָֽ/אֲדָמָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/004.yaml
  text: For in seven more days I will make it rain on the earth forty days and forty nights[d][c][b][a], and I will wipe out every living thing that I have made from the face of the ground.
translation:
  language: zh_hans
  text: 因为再过七天，我要使雨降在地上，四十天四十夜；我要把我所造的一切活物从地面上除灭。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “除灭”也可译作“抹去”；原文动词带有擦去或抹除的意象。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上一节的命令，说明其原因；现代汉语用“因为”自然保留解释关系。
- source_word: לְיָמִים עוֹד שִׁבְעָה
  choice: 再过七天
  rationale: 这是表示尚余七日才发生某事的希伯来语时间表达；“再过七天”简洁自然。
- source_word: אָנֹכִי מַמְטִיר
  choice: 我要使雨降
  rationale: 使役形明确表达上帝使雨降下；保留显式代词所带出的主语强调，同时避免把神的主动作用弱化为单纯的“会下雨”。
- source_word: עַל הָאָרֶץ
  choice: 在地上
  rationale: אֶרֶץ 在洪水语境中指大地；“地上”符合现代汉语表达，并与后文“地面”保持适度词汇区别。
- source_word: אַרְבָּעִים יוֹם וְאַרְבָּעִים לָיְלָה
  choice: 四十天四十夜
  rationale: 采用自然、固定的汉语时间表达，完整保留持续时长。
- source_word: וּמָחִיתִי
  choice: 我要……除灭
  rationale: מחה 有擦去、抹除之意；“除灭”既传达彻底消除的结果，也保持庄重而易懂的圣经叙事语体。脚注补充其具体意象。
- source_word: כָּל הַיְקוּם
  choice: 一切活物
  rationale: יקום 字面涉及站立、存在之物，在此洪水审判语境中指受造的生命总体；“一切活物”清楚而不过度扩大为所有存在。
- source_word: אֲשֶׁר עָשִׂיתִי
  choice: 我所造的
  rationale: 保留关系从句及上帝作为创造者的明确陈述，汉语表达凝练自然。
- source_word: מֵעַל פְּנֵי הָאֲדָמָה
  choice: 从地面上
  rationale: 保留“从……上除去”的空间关系，并用“地面”区别于前面的 אֶרֶץ“地上”；不机械翻作不自然的“从土地的脸面上”。
theological_decisions:
- issue: 洪水审判在 אֶרֶץ / היקום 中所呈现的范围
  choice: 采用广泛的受造界语言“地上”“一切活物”，不把经文限定为纯粹地方性事件。
  alternative: 把 אֶרֶץ 译作“那片地方”，从而明确指向区域性范围。
  rationale: 本节将审判对象概括为上帝所造的“一切活物”，语气广泛；译文保留这种力度，但不加入有关洪水地理或科学范围的额外断言。
- issue: מחה 的审判意象
  choice: 正文译作“除灭”，脚注说明也可译作“抹去”。
  alternative: 正文直译为“抹去”。
  rationale: “除灭”在中文中清楚表达生命被彻底消除，而脚注保留原动词如擦除、抹除般的具体意象，避免将其神学含义过度抽象化。
translation_notes:
  register: 采用现代、庄重且易懂的叙事语体。“再过七天”自然传达尚余七日；分号呈现降雨与审判结果之间紧密而有层次的关系。“地上”与“地面上”分别对应 אֶרֶץ 和 אֲדָמָה，尽量保留原文词汇区别。
