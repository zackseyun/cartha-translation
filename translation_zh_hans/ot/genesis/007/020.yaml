  text: 水势向上高出十五肘，群山都被淹没了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גָּבְרוּ הַמַּיִם
  choice: 水势……高出
  rationale: גבר在此表示水势增强并达到更高高度；结合מִלְמַעְלָה和上下文，用“水势……高出”自然表达水位上升并超过山顶的意思。
- source_word: חֲמֵשׁ עֶשְׂרֵה אַמָּה
  choice: 十五肘
  rationale: 保留原文古代长度单位“肘”，避免用现代单位作未经文本支持的精确换算。
- source_word: וַיְכֻסּוּ הֶהָרִים
  choice: 群山都被淹没了
  rationale: כסה的基本义是“遮盖、覆盖”；在洪水语境中，“被淹没”是自然且明确的中文表达。“群山”对应带定冠词的复数ההרים。
theological_decisions:
- issue: 十五肘的参照点
  choice: 向上高出十五肘
  alternative: 水上涨了十五肘
  rationale: 原文מִלְמַעְלָה可理解为“向上/在上面”，但没有在本节明说测量起点；译文保留相对高度表达，不擅自指定参照点。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言；“水势”贴合洪水场景，“肘”保留经文的古代计量特色。
