base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/018.yaml
  text: The waters prevailed and increased greatly over the earth[a], and the ark moved along on the surface of the waters.
translation:
  language: zh_hans
  text: 水势越发强盛，水在地上大大上涨，方舟便在水面上行进。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“行在水面上。”希伯来文直译为“在水面上行”，在这里指方舟在水面上移动。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְבְּרוּ
  choice: 水势越发强盛
  rationale: גבר表示变得强大、占优势；用“水势越发强盛”既保留洪水力量不断增强的含义，也符合现代汉语表达。
- source_word: הַמַּיִם
  choice: 水
  rationale: 希伯来文采用复数形式，但现代汉语通常用集合名词“水”；上下文已清楚表明是洪水。
- source_word: וַיִּרְבּוּ מְאֹד
  choice: 水在地上大大上涨
  rationale: רבה与מְאֹד强调水量显著增加；“大大上涨”在洪水语境中自然传达这种增多，同时与前句的水势增强有所区别。
- source_word: עַל הָאָרֶץ
  choice: 在地上
  rationale: אֶרֶץ可指“地、土地、大地”；“在地上”保留其语义宽度，不在本节中额外判定地域范围。
- source_word: וַתֵּלֶךְ
  choice: 漂行
  rationale: הלך本义为“行、走”；方舟以水为承托时，“漂行”是自然的语境对应，表达移动而不指定方向或动力。
- source_word: הַתֵּבָה
  choice: 方舟
  rationale: “方舟”是挪亚叙事中תֵּבָה通行而准确的现代汉语译法。
- source_word: עַל פְּנֵי הַמָּיִם
  choice: 在水面上
  rationale: 字面为“在水的面上”；“在水面上”清楚、自然地表达该希伯来语习语。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。保留原文两个并列动词所表达的递进：水势增强，水量大增；以“地上”保留אֶרֶץ可能指地、土地或大地的语义空间。脚注标记置于其实际说明的“漂行”之后。
