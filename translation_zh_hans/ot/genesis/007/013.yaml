  register: 采用庄重而通顺的现代标准汉语。“就在”保留原文对日期的强调；人物名单按汉语习惯稍作整合，但没有删减成员或改变亲属关系。句末“都一同”承接希伯来语复数表达 אִתָּם，避免生硬重复“和……与他们一起”。
