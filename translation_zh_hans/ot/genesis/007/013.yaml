base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/013.yaml
  text: On that very day Noah entered the ark[a], with Shem, Ham, and Japheth, Noah’s sons, and Noah’s wife[c][b], and the three wives of his sons with them.
translation:
  language: zh_hans
  text: 正是在这一天，挪亚和他的儿子闪、含、雅弗，以及挪亚的妻子和他三个儿子的妻子，都一同进了方舟[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “进了”也可按字面译为“来到方舟”。希伯来语动词本义为“来、来到”；在这里与“方舟”连用，按上下文指进入方舟。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: 就在这一天
  rationale: “就在”自然传达 בְּעֶצֶם 在日期表达中的强调意味，表明事情发生在所指的那一天本身。
- source_word: בָּא ... אֶל הַתֵּבָה
  choice: 进了方舟
  rationale: בָּא 基本义为“来、来到”，与表示目标的 אֶל הַתֵּבָה 连用时，语境所指是进入方舟；“进了方舟”是现代汉语中自然、准确的表达。
- source_word: וְשֵׁם וְחָם וָיֶפֶת בְּנֵי נֹחַ
  choice: 和他的儿子闪、含、雅弗
  rationale: 将同位语“挪亚的儿子”前置为领属成分，使人物关系在现代汉语中清楚自然，同时保留三人的姓名和并列关系。
- source_word: וְאֵשֶׁת נֹחַ
  choice: 以及挪亚的妻子
  rationale: 直接保留原文的领属关系；使用“以及”衔接较长的人物名单。
- source_word: וּשְׁלֹשֶׁת נְשֵׁי בָנָיו
  choice: 和他三个儿子的妻子
  rationale: 保留原文明确的数目及亲属关系，比概括为“三个儿媳”更贴近源语结构。
- source_word: אִתָּם
  choice: 都一同
  rationale: 该词为阳性复数“与他们一起”。结合汉语整句结构，用“都一同”表达全家共同进入，并保留复数群体意味。
- source_word: הַתֵּבָה
  choice: 方舟
  rationale: “方舟”是挪亚叙事中 תֵּבָה 的通行中文译法。
theological_decisions: []
