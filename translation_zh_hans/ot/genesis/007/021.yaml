  text: וַ/יִּגְוַ֞ע כָּל בָּשָׂ֣ר הָ/רֹמֵ֣שׂ עַל הָ/אָ֗רֶץ בָּ/ע֤וֹף וּ/בַ/בְּהֵמָה֙ וּ/בַ֣/חַיָּ֔ה וּ/בְ/כָל הַ/שֶּׁ֖רֶץ הַ/שֹּׁרֵ֣ץ עַל הָ/אָ֑רֶץ וְ/כֹ֖ל הָ/אָדָֽם־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/021.yaml
  text: 'And all flesh that moved on the earth died: birds[a], livestock, wild animals, every swarming thing that swarms on the earth, and all mankind.'
translation:
  language: zh_hans
  text: 凡在地上活动的一切有肉身的活物都死了：飞鸟、牲畜、野兽、地上一切成群活动的小动物，以及全人类。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּגְוַע
  choice: 都死了
  rationale: גוע表示死亡、断气；现代汉语用“死了”直接、自然，并以“都”照应כָּל。
- source_word: כָּל בָּשָׂר
  choice: 凡……有血肉之物
  rationale: 保留“肉身/血肉”这一希伯来语表达，同时用“之物”表明此处泛指下文列举的陆上有生命者，而非仅指人。
- source_word: הָרֹמֵשׂ
  choice: 活动的
  rationale: רמש可指移动、爬行或群集活动；因下文包括飞鸟、牲畜和野兽，宜采用范围较广的“活动”，避免误限为爬行动物。
- source_word: עַל הָאָרֶץ
  choice: 在地上
  rationale: אָרֶץ在此可作“大地”或“地面”；“在地上”自然地表达这些生物活动的领域，也与后文同一短语呼应。
- source_word: בָּעוֹף
  choice: 飞鸟
  rationale: עוֹף泛指飞行生物；在创世记的动物分类语境中，“飞鸟”简洁、庄重且自然。
- source_word: וּבַבְּהֵמָה
  choice: 牲畜
  rationale: בְּהֵמָה在与חַיָּה并列时通常指家养的大型陆生动物，“牲畜”能清楚保留这种分类区别。
- source_word: וּבַחַיָּה
  choice: 野兽
  rationale: חַיָּה与“牲畜”相对，此处指野生动物；“野兽”简洁并符合经文列举的庄重语体。
- source_word: וּבְכָל הַשֶּׁרֶץ הַשֹּׁרֵץ
  choice: 成群滋生的各种小动物
  rationale: שׁרץ可表达成群活动、繁生；名词与同根分词的重复在汉语中难以完全复制，译作“成群滋生的各种小动物”兼顾其群集、繁生特征，避免把范围窄化为仅会爬行的动物。
- source_word: וְכֹל הָאָדָם
  choice: 以及全人类
  rationale: 带定冠词的אָדָם在此为集合用法，指整个人类，不只指男性；“全人类”是现代汉语中准确而自然的表达。
theological_decisions:
- issue: הָאָדָם的集合意义
  choice: 全人类
  alternative: 所有的人；全体世人
  rationale: 上下文把人类作为与各类动物并列的整体类别。译作“全人类”保留其集体范围，不把אָדָם误解为亚当个人或仅限男性。
- issue: כָּל בָּשָׂר的范围
  choice: 凡在地上活动的有血肉之物
  alternative: 一切活物；所有生灵
  rationale: 原文先用“凡有肉身者”概括，再以动物和人类展开。“有血肉之物”保留原文身体性用语；“在地上活动的”也保存经文本身对范围的限定，不额外扩展到水生物。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。句式保留原文“总括—列举”的结构；动物分类依次译为“飞鸟、牲畜、野兽、成群滋生的各种小动物”，结尾用“全人类”突出人类作为最后一类。无需脚注，因为译文没有必须另列说明才能保留的实质歧义。
