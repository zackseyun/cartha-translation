  yaml_path: translation/ot/genesis/007/010.yaml
  text: And after seven days[b][a], the waters of the flood came upon the earth.
translation:
  language: zh_hans
  text: 七天过后[a]，洪水就临到大地[b]上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“事情是这样：七天过后，洪水的水在地上。”
    reason: lexical_alternative
  - marker: b
    text: 或译：“土地”。希伯来语 אֶרֶץ 可指“大地”，也可指“土地”，须按上下文判断。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי לְשִׁבְעַת הַיָּמִים
  choice: 过了七天
  rationale: וַיְהִי承接叙事，后接带לְ的时间短语，表示到了所说时段之后。译作“过了七天”自然地表达事件推进；脚注保留较贴近形式的表达。
- source_word: וּמֵי הַמַּבּוּל
  choice: 洪水
  rationale: 原文直译为“洪水的水”。现代汉语用“洪水”即可自然、准确地表达该定指短语，避免累赘的“洪水之水”。
- source_word: הָיוּ עַל
  choice: 临到……上
  rationale: 字面义为“在……上”。在此叙事语境中，描述洪水开始出现在大地上，译作“临到……上”保留事件发生的动态感，同时不扩增原意。
- source_word: הָאָרֶץ
  choice: 大地
  rationale: אֶרֶץ可指“大地、地”或特定“土地”。“大地”符合洪水叙事的广阔语境，也比“地球”少带现代科学术语色彩；脚注注明另一可能。
theological_decisions:
- issue: 洪水叙事中אֶרֶץ的范围
  choice: 大地
  alternative: 土地
  rationale: 该词本身可指广义的大地，也可指某一片土地。本节语境较支持广义理解，正文采用“大地”，但以脚注保留“土地”的真实词义可能，不借翻译裁定超出本节的范围争议。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“过了七天”简洁承接上文；“临到大地上”兼顾希伯来语的方位表达和事件性。所有脚注标记均置于正文相关位置。
