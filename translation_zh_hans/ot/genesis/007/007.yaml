  yaml_path: translation/ot/genesis/007/007.yaml
  text: And Noah, with his sons, his wife, and his sons’ wives with him, entered the ark because of the waters of the flood.
translation:
  language: zh_hans
  text: 挪亚和他的儿子、妻子以及儿子们的妻子一同进了方舟，因为洪水。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  choice: 进了
  rationale: בוא可表示“来、去、进入”；与“方舟”连用时，“进了”自然、准确地表达进入其中的动作。
- source_word: נֹחַ
  choice: 挪亚
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: בָנָיו
  choice: 他的儿子
  rationale: 原文明确指“儿子”，不泛化为“儿女”或“孩子”。
- source_word: אִשְׁתּוֹ
  choice: 妻子
  rationale: 此处אִשָּׁה带第三人称男性单数后缀，语境中明确指挪亚的妻子。
- source_word: נְשֵׁי בָנָיו
  choice: 儿媳妇
  rationale: 原文字面是“他儿子们的妻子”；中文“儿媳妇”简洁自然，并准确表达亲属关系。
- source_word: אִתּוֹ
  choice: 一起
  rationale: 表达家人跟挪亚同行的陪伴关系；中文合并为“一起”可避免生硬重复“同他”。
- source_word: אֶל הַתֵּבָה
  choice: 进了方舟
  rationale: 介词אֶל与动词בוא共同表示朝向并进入方舟；中文以“进了方舟”自然呈现。
- source_word: מִפְּנֵי
  choice: 躲避
  rationale: 该介词在此表示因洪水而采取行动，也带有避开其威胁的语境含义；“躲避”比直译“因为”更符合现代中文叙事表达。
- source_word: מֵי הַמַּבּוּל
  choice: 洪水
  rationale: 原文字面为“洪水的水”；现代中文直接说“洪水”即可完整传达所指，避免同义重复。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。保留家庭成员的具体身份与共同进入方舟的动作；末句以“躲避洪水”自然表达מִפְּנֵי的原因兼避险含义，不增添神学解释。
