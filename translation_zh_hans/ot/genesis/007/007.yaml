  rationale: 以“因为洪水”对应 מִפְּנֵי מֵי הַמַּבּוּל，保留原文所陈述的因果关系，而不把它限定为“躲避”的目的。以“一同”自然表达“与他同在／同行”，并保留所列家庭成员及进入方舟的动作。
