base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/008.yaml
  text: Then Jacob was very afraid and distressed[a], and he divided the people who were with him, and the flocks, and the herds, and the camels, into two camps.
translation:
  language: zh_hans
  text: 雅各非常害怕，心里愁苦，就把跟他在一起的人、羊群、牛群和骆驼分成两营[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“两队”。希伯来语这个词既可指营地，也可指有组织的队伍。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּירָא יַעֲקֹב מְאֹד
  choice: 雅各非常害怕
  rationale: 将表示惧怕的动词与程度副词מְאֹד合并自然表达为“非常害怕”，准确保留强烈程度。
- source_word: וַיֵּצֶר לוֹ
  choice: 心里愁苦
  rationale: 这一惯用表达指雅各内心受压、苦恼；“心里愁苦”既符合现代汉语，也保留其情绪困迫之意。
- source_word: וַיַּחַץ
  choice: 分成
  rationale: חצה表示分开、分为若干部分；这里是雅各有意将同行者和牲畜分作两组。
- source_word: הָעָם אֲשֶׁר אִתּוֹ
  choice: 跟他在一起的人
  rationale: 此处עָם指随雅各同行的人群，并非民族或国家；这一译法清楚自然。
- source_word: הַצֹּאן
  choice: 羊群
  rationale: צֹאן是绵羊、山羊等小型牲畜的集合称呼；在本语境中“羊群”简明自然。
- source_word: הַבָּקָר
  choice: 牛群
  rationale: בָּקָר指牛类牲畜，集合意义用“牛群”表达。
- source_word: הַגְּמַלִּים
  choice: 骆驼
  rationale: 直接对应גְּמַלִּים，并在并列结构中采用汉语自然的集合表达。
- source_word: לִשְׁנֵי מַחֲנוֹת
  choice: 分成两营
  rationale: מַחֲנוֹת可指营地，也可指成队的人畜；“两营”保留原文的营队意象及其与下文的词语衔接。
