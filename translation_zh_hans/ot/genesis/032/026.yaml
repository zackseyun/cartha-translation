  yaml_path: translation/ot/genesis/032/026.yaml
  text: When he saw that he could not prevail against him[a], he touched the socket of his thigh[c][b], and the socket of Jacob’s thigh was dislocated as he wrestled with him.
translation:
  language: zh_hans
  text: 他看见自己胜不过对方[a][c]，就触及了对方大腿根部的关节窝[b]；雅各大腿根部的关节窝在他与对方摔跤时脱了臼。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“制服不了对方”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译为“大腿的窝（或凹处）”；传统常译“大腿窝”。这里所指的是大腿上端、髋部的关节区域。
    reason: lexical_alternative
  - marker: c
    text: 希伯来文在本节使用的代词所指仍有含混之处，并未再次明确说出雅各对手的身份。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּרְא
  choice: 他见
  rationale: 承接叙事进程，并自然表达后一句行动发生的缘由；希伯来语未在本节重新点明主语身份。
- source_word: לֹא יָכֹל לוֹ
  choice: 自己胜不过对方
  rationale: יכל与ל连用表示相对于对手不能取胜；“胜不过”贴合摔跤语境，又不把含义强化为全然无能。
- source_word: וַיִּגַּע
  choice: 触碰了
  rationale: נגע的通常含义是“触碰”，即使结果强烈，也不应擅自译成“击打”。
- source_word: בְּכַף יְרֵכוֹ
  choice: 对方大腿根部的关节窝
  rationale: כף与ירך的组合在此指大腿上端、髋部凹陷的关节区域；此译法兼顾原文的“大腿”和现代汉语的清晰度。
- source_word: וַתֵּקַע
  choice: 脱了臼
  rationale: 此处表示关节被移出原位；“脱了臼”是自然、准确的现代汉语。
- source_word: כַּף יֶרֶךְ יַעֲקֹב
  choice: 雅各大腿根部的关节窝
  rationale: 保留原文在此明确说出雅各的名字，并与前一处身体部位的译法一致。
- source_word: בְּהֵאָבְקוֹ עִמּוֹ
  choice: 他同对方摔跤时
  rationale: 介词加不定式结构表示同时发生的动作；“……时”自然传达这一时间关系，“对方”则避免擅自点明人物身份。
theological_decisions:
- issue: 摔跤场景中代词所指及雅各对手的身份
  choice: 正文以“他”和“对方”表达人物关系，不在本节明说雅各对手是谁。
  alternative: 把主语明确译为“那人”“天使”或“上帝”。
  rationale: 希伯来文本本节只使用代词，没有重新陈明雅各对手的身份；上下文逐步展现其意义，译文不应提前消除这种叙事与神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“胜不过”符合摔跤语境；“触碰”保留原文轻触动词与强烈结果之间的张力；以“对方”避免汉语中连续使用“他……他”造成的生硬，同时不擅自确定对手身份。
