base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/030.yaml
  text: Then Jacob asked[a], “Please tell me your name.” But he said[c][b], “Why is it that you ask my name?” And he blessed him there.
translation:
  language: zh_hans
  text: 雅各问道：“请把你的名字告诉我。”他却说：“你为什么问我的名字？”他就在那里给雅各祝福。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁאַל יַעֲקֹב וַיֹּאמֶר
  choice: 雅各问道
  rationale: 希伯来语直译为“雅各问并说”，是常见的叙事表达；现代汉语用“问道”既保留询问和发言的含义，又避免生硬重复。
- source_word: הַגִּידָה נָּא
  choice: 请把……告诉我
  rationale: נגד 的使役命令式表示“告知、说明”，נָא 使请求语气较为委婉；“请把……告诉我”自然地传达了这一语气。
- source_word: שְׁמֶךָ
  choice: 你的名字
  rationale: 按其基本词义直译；名字在上下文中可能涉及身份，但正文不作解释性扩展。
- source_word: לָמָּה זֶּה תִּשְׁאַל לִשְׁמִי
  choice: 你为什么问我的名字
  rationale: לָמָּה זֶּה 是带有一定强调色彩的“为什么”表达；现代汉语直接说“为什么”最自然，也完整传达其质问意味。
- source_word: וַיְבָרֶךְ אֹתוֹ שָׁם
  choice: 他就在那里给雅各祝福
  rationale: ברך 译为“祝福”，שָׁם 译为“在那里”。将宾语代词明确回指为“雅各”，可避免连续两个“他”造成指代混乱，同时不改变原意。
theological_decisions:
- issue: 拒绝透露名字并施行祝福者的身份
  choice: 沿用未指明身份的“他”
  alternative: 那人／上帝／天使
  rationale: 本节希伯来文没有在这些分句中明确说出主语身份。上下文虽引导读者思考其身份，译文仍不应在本节擅自将其确定为“上帝”“那人”或“天使”。
translation_notes:
  register: 采用现代、庄重而通顺的叙事语言。“问道”符合现代汉语叙事习惯；“他却说”体现对方没有回答名字、反而提出质问的转折。末句以“雅各”替代宾语代词，使汉语指代清楚，同时保留施福者身份未明的叙事张力。
