  text: וַ/יֹּ֗אמֶר לֹ֤א יַעֲקֹב֙ יֵאָמֵ֥ר עוֹד֙ שִׁמְ/ךָ֔ כִּ֖י אִם יִשְׂרָאֵ֑ל כִּֽי שָׂרִ֧יתָ עִם אֱלֹהִ֛ים וְ/עִם אֲנָשִׁ֖ים וַ/תּוּכָֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/029.yaml
  text: And he said[a], “Your name shall no longer be called Jacob, but Israel, because you have striven with God and with men[b], and have prevailed.”
translation:
  language: zh_hans
  text: 他说：“你的名字不再叫雅各，要叫以色列，因为你与上帝[a]和人[b]较力，并且得了胜。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “上帝”也可译作“神明”或“天上的神圣者”。希伯来语אֱלֹהִים在不同语境中可指上帝、众神或天上的神圣者；正文按本段叙事语境译作“上帝”。
    reason: 保留原词的语义范围及摔跤者身份的叙事张力。
  - marker: b
    text: “人”也可译作“人们”或“世人”。
    reason: 说明希伯来语复数名词在此可作概括性称呼。
lexical_decisions:
- source_word: יֵאָמֵר
  choice: 叫
  rationale: 在改名宣告中，这个被动形式自然表达“被称为”；现代汉语用“名字……叫”既准确又顺畅。
- source_word: עוֹד
  choice: 不要再
  rationale: 表示旧称从此停止使用；与后面的“而要”构成自然、明确的改名对比。
- source_word: כִּי אִם
  choice: 而要
  rationale: 这里是否定旧名、确立新名的转折结构，译作“而要”符合现代汉语命名表达。
- source_word: יִשְׂרָאֵל
  choice: 以色列
  rationale: 采用通行人名译法；名字与后文“较力”的语源呼应由解释从句承载。
- source_word: שָׂרִיתָ
  choice: 较力
  rationale: 该动词表示争斗、角力或抗争，并与“以色列”形成文字呼应；“较力”简洁庄重，也贴合摔跤叙事。
- source_word: אֱלֹהִים
  choice: 上帝
  rationale: 叙事语境指向雅各与上帝的神秘相遇；正文采用单数“上帝”，同时以脚注保留“神圣者”等词义可能。
- source_word: אֲנָשִׁים
  choice: 人
  rationale: 此处复数泛指人类或人们，与“上帝”构成对照；汉语“人”无需以性别化复数表达，且不损失原意。
- source_word: וַתּוּכָל
  choice: 胜过了
  rationale: יכל在此表示争斗中取得优势、占了上风；“胜过了”保留成功结果，又比“彻底战胜”更克制。
theological_decisions:
- issue: אֱלֹהִים的所指
  choice: 上帝
  alternative: 神圣者（或神明）
  rationale: 紧邻叙事把这次相遇理解为与上帝相遇，但摔跤者以人的形态出现，其身份仍带有刻意的神秘性；正文译“上帝”，脚注保留词汇层面的另一可能。
- issue: אֲנָשִׁים的范围
  choice: 人
  alternative: 人们；世人
  rationale: 希伯来语使用אִישׁ的复数，但在此可作人类的概括性称呼。现代汉语“人”准确保留“上帝与人”的修辞对照，不必额外限定为男性。
- issue: וַתּוּכָל所表达的结果
  choice: 胜过了
  alternative: 占了上风；坚持住了
  rationale: 该词可表达“有能力、胜任、胜过”。上下文要求争斗取得成功，却不必理解为雅各彻底征服上帝，因此采用相对克制的“胜过了”。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“不要再叫……而要叫……”清楚呈现正式改名宣告；“较力”与“胜过了”保留原文的争斗意象和结果，同时避免把神秘相遇解释得过于确定。
