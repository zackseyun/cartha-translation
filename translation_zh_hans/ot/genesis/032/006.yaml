base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/006.yaml
  text: I have oxen and donkeys[a], flocks, male servants and female servants, and I have sent to tell my lord, so that I may find favor in your eyes.
translation:
  language: zh_hans
  text: 我有牛、驴、羊群、男仆和婢女[a]。我派人来禀告我主，为要在我主眼前蒙恩。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “男仆和婢女”也可译作“男奴和女奴”；希伯来语所用词可指隶属于家中的男女奴仆。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי לִי
  choice: 我有
  rationale: היה与ל连用表示拥有；用现代汉语“我有”自然表达雅各现有的产业。
- source_word: שׁוֹר וַחֲמוֹר
  choice: 牛、驴
  rationale: 两个单数名词在财产清单中均具有类别或集合意义；汉语用不标数的“牛、驴”即可自然保留这一点。
- source_word: צֹאן
  choice: 羊群
  rationale: 该集合名词指绵羊、山羊等小型牲畜；“羊群”既保留集合意义，也避免无根据地细分种类。
- source_word: עֶבֶד וְשִׁפְחָה
  choice: 仆人和婢女
  rationale: 原文分别指男性与女性的从属家内人员。“仆人和婢女”保留性别区分并符合本节财产清单的语境；其可能包含奴隶身份的语义以脚注说明。
- source_word: וָאֶשְׁלְחָה לְהַגִּיד
  choice: 我派人来禀告
  rationale: 动词的宾语可由语境补出为先前所派的使者；“禀告”自然体现雅各对以扫自称卑下的恭敬口吻。
- source_word: לַאדֹנִי
  choice: 我主
  rationale: 这是对以扫的尊称，并非神圣称号；“我主”保留原文的社会性敬语和雅各的谦卑姿态。
- source_word: לִמְצֹא חֵן בְּעֵינֶיךָ
  choice: 为要在你眼前蒙恩
  rationale: 保留希伯来语“在某人眼前蒙恩”的惯用意象，同时在现代中文中仍清楚可懂。
theological_decisions:
- issue: 财产清单中עֶבֶד与שִׁפְחָה的身份含义
  choice: 正文译作“仆人和婢女”，脚注注明也可译作“男奴和女奴”
  alternative: 正文直接译作“男奴和女奴”
  rationale: 原词可指处于从属或受奴役地位的家内人员，不能简单等同于现代自由雇工；但本句重点是列举家产，并未具体说明其法律身份。正文采用自然而有历史感的称呼，脚注保留更强的身份含义，避免消除原文的语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“禀告我主”体现雅各向以扫传话时刻意谦卑的语气；“在你眼前蒙恩”保留原文意象。
