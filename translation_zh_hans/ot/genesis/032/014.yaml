  naturalness: “从手头所有的当中”搭配略显重复、书面不够自然；“从手头现有的东西中”更符合现代汉语。原脚注的“从来到他手中的当中”亦不成句，需要改正。
  terminology: “礼物”恰当地对应此处人际语境中的 מִנְחָה。“他的哥哥以扫”在中文叙事中自然，同时明确以扫与雅各的关系；这里“哥哥”由上下文所知的年龄关系支持，但不宜把它当作原词本身的唯一含义。
