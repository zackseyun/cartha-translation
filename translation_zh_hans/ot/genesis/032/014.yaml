  yaml_path: translation/ot/genesis/032/014.yaml
  text: 'So he spent that night there[a], and he took from what came to his hand a gift for Esau his brother:'
translation:
  language: zh_hans
  text: 于是，雅各在那里过了那一夜，又从手头现有的东西中[a]取出一份礼物，送给他的哥哥以扫：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“从来到他手中的东西中”；也可译作“从他随身所有的东西中”或“从现有的东西中”。
    reason: 说明希伯来语习语的字面形式，并保留较为直译和较为意译的可能表达。
lexical_decisions:
- source_word: וַיָּלֶן
  choice: 过了……一夜
  rationale: 该动词表示留宿、过夜；此译自然地保留整夜停留的时间含义。
- source_word: שָׁם
  choice: 在那里
  rationale: 直接表达原文的地点副词。
- source_word: בַּלַּיְלָה הַהוּא
  choice: 那一夜
  rationale: 对应原文“在那一夜”，符合现代汉语的时间表达。
- source_word: וַיִּקַּח
  choice: 取出
  rationale: 基本义为“拿、取”；在此表示雅各从现有之物中拿出一部分，译作“取出”清楚自然，又不过度解释为“挑选”。
- source_word: מִן הַבָּא בְיָדוֹ
  choice: 从手头所有的当中
  rationale: 原文是一个表示当时归他支配或可供使用之物的习语；此译保留“手头”的意象，同时让现代读者易于理解。
- source_word: מִנְחָה
  choice: 一份礼物
  rationale: 在此人与人交往的语境中，指送给以扫的礼物，而非礼仪性的祭物；“礼物”清楚且不夸大政治臣属意味。
- source_word: לְעֵשָׂו אָחִיו
  choice: 送给哥哥以扫
  rationale: 介词 לְ 标示接受者；“哥哥以扫”自然表达亲属关系，并符合上下文中以扫是雅各之兄的事实。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“于是”承接前文；句末保留冒号，因为下文将具体列举这份礼物。脚注标记紧随其实际说明的短语，避免误指“在那里过夜”。
