  yaml_path: translation/ot/genesis/032/022.yaml
  text: So the gift passed on ahead of him[a], but he himself stayed that night in the camp.
translation:
  language: zh_hans
  text: 于是，礼物先行，走在他前面[a]；他自己却在那一夜留在营中。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “礼物”也可译作“礼品”或“贡物”。希伯来语 מִנְחָה 可指礼物、贡物或祭物；这里指雅各预先送给以扫的礼物。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעֲבֹר
  choice: 过去了
  rationale: 此处动词 עבר 的叙事形式表示礼物继续前行；译作“过去了”自然地表达从雅各前面向前行进，又不额外指定经渡某条河流。
- source_word: הַמִּנְחָה
  choice: 礼物
  rationale: מִנְחָה 可指礼物、贡物或祭物；本节语境是雅各送给以扫的礼物，并非礼仪性的祭物。
- source_word: עַל־פָּנָיו
  choice: 从他前面
  rationale: 希伯来语习语字面为“在他面前”，此处表示礼物在雅各前头行进；与“先……过去”结合，清楚传达其先行之意。
- source_word: וְהוּא
  choice: 他自己却
  rationale: 独立人称代词具有强调和对比作用，将先行的礼物与仍留在营中的雅各相对照。
- source_word: לָן
  choice: 留在
  rationale: לון/לין 表示过夜或住宿；后接“在那一夜”和“营中”，译作“留在”简洁自然，并保留他没有随礼物前行的对比。
- source_word: בַּלַּיְלָה הַהוּא
  choice: 在那一夜
  rationale: 忠实表达定指的时间短语，同时保持庄重、流畅的现代汉语。
- source_word: בַּמַּחֲנֶה
  choice: 在营中
  rationale: מַחֲנֶה 指营地或营盘；“营中”简明自然，符合叙事语体。
