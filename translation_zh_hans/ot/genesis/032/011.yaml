base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/011.yaml
  text: I am unworthy of all the steadfast love and all the faithfulness that you have shown to your servant[a], for with my staff I crossed this Jordan[c][b], and now I have become two camps.
translation:
  language: zh_hans
  text: 你向仆人所施的一切慈爱和一切信实，我一点也不配得；当初我带着手杖渡过这约旦河，如今我却成了两个营。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “成了两个营”也可译作“有了两个营”。
    reason: lexical_alternative
lexical_decisions:
- source_word: קָטֹנְתִּי
  choice: 我一点也不配得
  rationale: 字面是“我太小／我变得微小”，在这里是雅各面对上帝厚恩而自谦的说法。译作“不配得”符合现代汉语习惯，也保留其自觉不足的语气。
- source_word: הַחֲסָדִים
  choice: 一切慈爱
  rationale: חסד 表示坚定、忠诚并落实于行动的恩慈；复数在此可概括多次具体施恩。中文“一切慈爱”自然简洁，并可与“信实”清楚区分。
- source_word: הָאֱמֶת
  choice: 一切信实
  rationale: 与 חסד 并列时，אמת 侧重可靠、忠实，而非抽象的“真理”；“信实”准确体现关系语境。
- source_word: עָשִׂיתָ אֶת עַבְדֶּךָ
  choice: 你向仆人所施的
  rationale: 原文直译为“你向／与仆人所做的”。因宾语是慈爱与信实，“所施的”是自然庄重的中文表达。
- source_word: בְמַקְלִי
  choice: 只拿着手杖
  rationale: 原文为“带着／凭着我的杖”。语境强调雅各当时身无长物；中文加“只”自然传达这一隐含对比，但不改变叙事重点。
- source_word: עָבַרְתִּי אֶת הַיַּרְדֵּן הַזֶּה
  choice: 过了这约旦河
  rationale: 保留指示词“这”，体现雅各身处当地、指向眼前约旦河的现场感。
- source_word: הָיִיתִי לִשְׁנֵי מַחֲנוֹת
  choice: 成了两队
  rationale: 原文直译“成了两个营队”。上下文指雅各的家眷和牲畜分成两队；中文“成了两队”简明自然，也保留具体的队伍意象。
theological_decisions:
- issue: חסד 与 אמת 描写上帝对雅各的作为
  choice: 慈爱和信实
  alternative: 坚定的爱和忠诚／恩慈和真实
  rationale: 该词组同时表达上帝主动施恩与可靠守信的品格。“慈爱和信实”是清楚、庄重且不偏向特定宗派术语的现代中文，也保留两个希伯来词之间的区别。
- issue: 雅各自谦之语 קָטֹנְתִּי
  choice: 我一点也不配得
  alternative: 我比这一切都微小／我实在不配
  rationale: “不配得”表达雅各承认自己无资格要求上帝的恩惠，但不将此句扩展为关于功德或救恩机制的系统教义判断。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。“仆人”保留雅各在上帝面前自称的谦卑身份；以分号呈现蒙恩与今昔对比。所有脚注标记均置于正文相关位置。
