base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/023.yaml
  text: That night he arose and took his two wives[a], his two female servants, and his eleven children, and crossed the ford of the Jabbok.
translation:
  language: zh_hans
  text: 那一夜，他起身，带着他的两个妻子、两个女仆[a]和十一个孩子，从雅博渡口过河。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“女奴”。希伯来语指家中地位从属的女性，可能包含奴隶身份。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: 起来
  rationale: קום的Qal叙事形式表示起身；“起来”自然、准确，也符合现代汉语叙事表达。
- source_word: בַּלַּיְלָה הוּא
  choice: 那一夜，他
  rationale: 原文直译近于“在那夜，他”，独立代词使主语略带强调；“那一夜，他”既自然，也保留了时间背景和主语的显明表达。
- source_word: וַיִּקַּח
  choice: 带着
  rationale: לקח基本义为“拿、带”；此处宾语是家人，语境指带他们同行，因此“带着”比机械的“拿着”自然，又没有加入原文未明说的差遣含义。
- source_word: שְׁתֵּי נָשָׁיו
  choice: 两个妻子
  rationale: נָשִׁים虽可泛指女人，此处按上下文明确指雅各的妻子。
- source_word: שְׁתֵּי שִׁפְחֹתָיו
  choice: 两个婢女
  rationale: שִׁפְחָה指家庭中地位从属的女性仆役，也可能涉及奴隶身份；“婢女”简洁地保留其女性及从属身份，并以脚注注明更直接的社会身份译法。
- source_word: אַחַד עָשָׂר יְלָדָיו
  choice: 十一个孩子
  rationale: יְלָדִים本义是“孩子、儿女”，并非专指儿子；译作“孩子”避免为配合人物名单而把词义解释成“儿子”。
- source_word: וַיַּעֲבֹר
  choice: 渡过了
  rationale: עבר在渡水语境中表示越过、渡过；“渡过”与后面的河流渡口自然搭配。
- source_word: אֵת מַעֲבַר יַבֹּק
  choice: 雅博渡口
  rationale: מַעֲבַר指过河处或浅滩渡口；现代汉语以“雅博渡口”简明表达“雅博河的渡口”。
- source_word: יַבֹּק
  choice: 雅博
  rationale: 采用该河名在中文圣经传统中通行且易识别的音译。
theological_decisions:
- issue: “十一个孩子”是否应按叙事人物理解为“十一个儿子”
  choice: 十一个孩子
  alternative: 十一个儿子
  rationale: 原文使用可涵盖儿女的יְלָדִים，而非明确表示“儿子”的בָּנִים；翻译保留词汇本身的范围，不借上下文名单消除这一张力。
translation_notes:
  register: 采用自然、庄重的现代汉语叙事体。“那一夜，他起来”保留原文显明主语的节奏；“婢女”避免过度淡化从属身份，同时用脚注呈现“女奴”这一可能更直接的译法。脚注标记置于其实际说明的词语之后。
