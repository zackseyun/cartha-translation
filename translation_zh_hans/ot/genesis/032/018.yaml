base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/018.yaml
  text: And he commanded the first one, saying, “When Esau my brother meets you and asks you, ‘Whose are you, and where are you going, and whose are these before you?’...”
translation:
  language: zh_hans
  text: 他吩咐最先走的人说：“我哥哥以扫若遇见你，问你说：‘你是谁的人？要往哪里去？你前面这些是谁的？’……”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָרִאשׁוֹן
  choice: 走在最前面的人
  rationale: 结合上下文，指各队中行在最前面的领队；这样译比单说“第一个”更自然，也保留其先后位置。
- source_word: לְמִי אַתָּה
  choice: 你是谁的人
  rationale: 直译为“你属谁”，询问其主人或所属；中文用“你是谁的人”既自然，也不额外限定为奴仆身份。
- source_word: וְאָנָה תֵלֵךְ
  choice: 要往哪里去
  rationale: 准确表达目的方向，并符合现代汉语问法。
- source_word: וּלְמִי אֵלֶּה לְפָנֶיךָ
  choice: 你前面这些是谁的
  rationale: 保留原文“这些”所指对象未明说的特点；上下文可知是牲畜礼物，但本节不宜补明。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而口语自然的叙事表达。保留原文三连问及其所属关系，不将“这些”解释性改写为“牲畜”或“礼物”。句末省略号表明雅各的指示在下一节继续。
