  text: וְ/יַעֲקֹ֖ב הָלַ֣ךְ לְ/דַרְכּ֑/וֹ וַ/יִּפְגְּעוּ ב֖/וֹ מַלְאֲכֵ֥י אֱלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/002.yaml
  text: And Jacob went on his way[b][a], and the angels of God met him.
translation:
  language: zh_hans
  text: 雅各继续上路，上帝的天使[a]遇见了他[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“上帝的使者”。希伯来语这个词既可指人的使者，也可指天使；这里的上下文指向天使。
    reason: lexical_alternative
  - marker: b
    text: “遇见”也可译作“碰见”或“遇上”。原文没有说明这次相遇是否出于偶然。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיַעֲקֹב
  choice: 雅各
  rationale: 叙事开头的连接词 וְ 在现代汉语中无需机械译作“于是”或“并且”；省译可自然承接上文，又不赋予它更强的逻辑意义。人名按通行译名译作“雅各”。
- source_word: הָלַךְ לְדַרְכּוֹ
  choice: 继续上路
  rationale: 字面意思接近“走他的路”，在这里表示雅各接着自己的行程前行；“继续上路”既符合现代汉语习惯，也保留叙事中的行程延续感。
- source_word: וַיִּפְגְּעוּ בוֹ
  choice: 遇见了他
  rationale: פגע 与介词 ב 连用可表示遇见、碰见或迎面相遇。“遇见了他”自然简洁，并不额外断定相遇是偶然、敌对或事先安排的。
- source_word: מַלְאֲכֵי אֱלֹהִים
  choice: 上帝的天使
  rationale: מַלְאָךְ 本义为“使者”，既可指人，也可指天上的使者；下一节称该地为“上帝的营”，支持这里指天使。“上帝的天使”在现代汉语中清楚自然，同时以脚注交代词义范围。
theological_decisions:
- issue: מַלְאֲכֵי אֱלֹהִים 所指的是天使还是人的使者
  choice: 正文译为“上帝的天使”
  alternative: “上帝的使者”
  rationale: 该词本身可指人间使者，但紧接着雅各把那里称为“上帝的营”，上下文更有力地指向超自然的天上使者。脚注保留原词较宽的词义。
- issue: פגע 所表达的相遇性质
  choice: 译为“遇见了他”，不说明是否偶然或主动迎接
  alternative: “碰见了他”或“迎面遇上他”
  rationale: 原文动词可表示相遇或遭遇，却未明确交代双方意图；正文避免加入偶然性、敌意或欢迎等原文未明说的含义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“继续上路”比逐字译法“走他的路”自然；“上帝的天使”清楚表达上下文所指，同时用脚注保留希伯来词的词义张力。
