base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/025.yaml
  text: And Jacob was left alone[b][a], and a man wrestled with him until the dawn came up.
translation:
  language: zh_hans
  text: 雅各独自留了下来；有一个人[a]跟他摔跤，直到曙光初升[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文作“一个人”。后文以及何西阿书12:4有助于进一步理解这位摔跤者的身份。
    reason: cross_reference
  - marker: b
    text: 也可译作“直到天亮”；原文直译为“直到黎明升起”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּוָּתֵר
  choice: 留了下来
  rationale: 该词为尼法勒式，带有“被留下”的被动色彩；结合上文众人已经过河，汉语用“留了下来”较自然，也保留雅各独自留下的叙事结果。
- source_word: לְבַדּוֹ
  choice: 独自
  rationale: 简洁、自然地表达雅各身边无人，突出其孤立处境。
- source_word: וַיֵּאָבֵק
  choice: 摔跤
  rationale: 这个罕见动词在此指近身扭斗或摔跤；“摔跤”比泛泛的“搏斗”更具体。
- source_word: אִישׁ
  choice: 一个人
  rationale: 本节只把这位神秘者称为“一个人”；不在正文中提前断定其为天使或上帝，以保留叙事张力。
- source_word: עִמּוֹ
  choice: 跟他
  rationale: 自然表达对方与雅各摔跤；代词所指由上下文清楚确定。
- source_word: עַד עֲלוֹת הַשָּׁחַר
  choice: 直到黎明升起
  rationale: 贴近原文“直到黎明升起”的意象，同时在现代汉语中清楚可懂。
theological_decisions:
- issue: 摔跤者 אִישׁ 的身份
  choice: 正文译作“一个人”，不进一步确定身份
  alternative: 译作“天使”或“以人的形态显现的上帝／耶和华”
  rationale: 本节本身只称其为“一个人”。后文及何西阿书12:4有助于更完整地理解其身份，但不应把后来的辨认提前写入本节正文。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“这时”使两个连续事件在汉语中衔接自然；“一个人”保留人物身份的神秘性；“黎明升起”保留希伯来语的具体意象。
