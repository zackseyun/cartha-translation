source:
  edition: WLC
  text: וַ/אֲמַרְתֶּ֕ם גַּ֗ם הִנֵּ֛ה עַבְדְּ/ךָ֥ יַעֲקֹ֖ב אַחֲרֵ֑י/נוּ כִּֽי אָמַ֞ר אֲכַפְּרָ֣ה פָנָ֗י/ו בַּ/מִּנְחָה֙ הַ/הֹלֶ֣כֶת לְ/פָנָ֔/י וְ/אַחֲרֵי כֵן֙ אֶרְאֶ֣ה פָנָ֔י/ו אוּלַ֖י יִשָּׂ֥א פָנָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/021.yaml
  text: And you shall also say[a], ‘Look, your servant Jacob is behind us,’ for he said, ‘I will appease him with the gift that is going ahead of me, and afterward I will see his face[b]; perhaps he will accept me.’
translation:
  language: zh_hans
  text: 你们还要说：“看哪，你的仆人雅各就在我们后面。”因为雅各想：“我要用走在我前面的礼物平息他的怒气[a]，然后再见他的面；或许他会接纳我[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“我要平息他的脸面”。这里所用的动词与“赎罪”的用语有关，但在本节是指雅各用礼物安抚以扫，并非举行祭仪。
    reason: lexical_alternative
  - marker: b
    text: 原文是“抬起我的脸”，这是表示有利接待的习语，也可理解为“向我施恩”。
    reason: lexical_alternative
lexical_decisions:
- source_word: עַבְדְּךָ
  choice: 你的仆人
  rationale: 这是雅各对以扫表示谦卑和恭敬的自称；“仆人”既保留从属语气，也避免在此外交性言辞中使用容易误解为法律身份的“奴隶”。
- source_word: הִנֵּה
  choice: 看哪
  rationale: 该话语助词用于唤起对方注意。“看哪”庄重而清楚，也保留原文的现场感。
- source_word: אַחֲרֵינוּ
  choice: 就在我们后面
  rationale: 表示雅各跟在使者和礼物之后；“就在我们后面”符合现代汉语表达，并传达相对位置。
- source_word: אֲכַפְּרָה פָנָיו
  choice: 求他息怒
  rationale: כפר在这里不是祭仪语境，而是指雅各借礼物平息以扫、争取和解。“求他息怒”自然地表达这一人际意义；脚注说明原文含“脸面”措辞及其与赎罪用语的词汇关联。
- source_word: מִנְחָה
  choice: 礼物
  rationale: 此处指送给以扫以求和解的赠礼。“礼物”清楚自然，不会像“祭物”那样引入祭仪含义，也不会像“贡物”那样过度强调政治臣属关系。
- source_word: הַהֹלֶכֶת לְפָנַי
  choice: 走在我前面的
  rationale: 分词结构描写礼物正先于雅各前行；该译法保留行进中的动态画面。
- source_word: אֶרְאֶה פָנָיו
  choice: 去见他的面
  rationale: 原文直译为“看见他的脸”。“见他的面”在汉语中仍然自然，并保留本节反复出现的“脸面”意象。
- source_word: יִשָּׂא פָנַי
  choice: 接纳我
  rationale: 原文习语直译为“抬起我的脸”，表示有利地接待、施恩或认可。“接纳我”在正文中准确自然，脚注保留其字面形式和语义范围。
- source_word: אוּלַי
  choice: 或许
  rationale: 表达雅各的希望与不确定性；“或许”符合本段庄重而紧张的语气。
theological_decisions:
- issue: 人际语境中כפר的译法
  choice: 求他息怒
  alternative: 在他面前赎罪／平息他的脸
  rationale: 本节的对象是以扫，手段是预先送去的礼物，语境是兄弟重逢前的安抚，而非祭祀仪式。因此正文采用人际性的自然表达，同时用脚注保留该动词与赎罪用语的词汇关联，避免把祭仪神学强加于叙事。
- issue: 是否在正文中直译יִשָּׂא פָנַי
  choice: 接纳我
  alternative: 抬起我的脸
  rationale: “抬起我的脸”在现代汉语中难以自行传达有利接待之意，容易造成误读；正文表达其语用意义，脚注则保留原文习语，从而兼顾可懂度与形式透明度。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“看哪”和“见他的面”略带经文庄重感，但在现代汉语中仍可理解。正文以自然表达处理两个希伯来语脸面习语，脚注则保留字面意象和词汇张力。
