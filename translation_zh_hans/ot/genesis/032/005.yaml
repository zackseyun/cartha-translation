base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/005.yaml
  text: 'And he commanded them[a], saying[c][b], “Thus you shall say to my lord Esau: ‘Thus says your servant Jacob: I have sojourned with Laban and have stayed until now.’”'
translation:
  language: zh_hans
  text: 他吩咐他们说：“你们要对我主以扫这样说：‘你的仆人[b]雅各这样说：我在拉班那里寄居[a]，一直留到如今。’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “寄居”也可译作“以外来者的身份居住”；原文可以强调雅各住在拉班那里时是寄居者。
    reason: lexical_alternative
  - marker: b
    text: “你的仆人”是雅各在以扫面前谦恭的自称，不一定表示他实际是以扫的奴仆。
    reason: cultural_note
lexical_decisions:
- source_word: וַיְצַו
  choice: 吩咐
  rationale: 保留צוה发出明确指示的语气；在此差遣使者的场景中，“吩咐”比“命令”更符合自然、庄重的现代汉语。
- source_word: כֹּה תֹאמְרוּן
  choice: 你们要……这样说
  rationale: כֹּה引出使者必须传达的话；这一表达既体现指令语气，也自然引出原话。
- source_word: לַאדֹנִי לְעֵשָׂו
  choice: 对我主以扫
  rationale: “我主”保留雅各对以扫的恭敬称呼；此处是人际尊称，并非神性称号。
- source_word: כֹּה אָמַר
  choice: 这样说
  rationale: 保留古代使者传话公式，同时避免采用在现代汉语中可能显得过分古奥的“如此说”。
- source_word: עַבְדְּךָ
  choice: 你仆人
  rationale: 此处是雅各对以扫谦恭的自称；“仆人”保留原词意象而不把它限定为实际奴役身份。
- source_word: גַּרְתִּי
  choice: 寄居
  rationale: גור不只是一般的“住”，还可表示以外来者或暂居者身份居住；“寄居”简洁保留这一层含义。
- source_word: וָאֵחַר עַד עָתָּה
  choice: 一直留到如今
  rationale: אחר在这里表示逗留、迟延至今；“一直留到如今”自然表达延续到说话时的状态，又不过度强调负面的耽搁意味。
theological_decisions:
- issue: “你仆人”的身份含义
  choice: 按谦恭自称处理
  alternative: 理解为雅各承认自己是以扫实际拥有的奴仆
  rationale: 外交式传话语境和“我主”这一配套称呼表明，这主要是礼貌而自谦的表达；译文保留“仆人”，脚注说明其语用功能，不把社会身份作绝对化解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“我主”“你仆人”保留原文礼貌而自谦的社会称谓；两层引语以冒号和单双引号清楚呈现。
