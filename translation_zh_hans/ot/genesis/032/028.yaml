  language: zh_hans
  text: 他对他说：“你叫什么名字？”他说：“雅各。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 他对他说
  rationale: 连续式叙事动词推进情节；译为“说”保留 אָמַר 的普通含义，而“对他说”自然表达 אֵלָיו 所指的言语方向。
- source_word: מַה שְּׁמֶךָ
  choice: 你叫什么名字
  rationale: 希伯来语直译为“你的名字是什么”；现代汉语以“你叫什么名字”表达最自然，意义不变。
- source_word: וַיֹּאמֶר
  choice: 他说
  rationale: 第二个 אָמַר 仍译为“说”，不擅自改成含义更具体的“回答”。
- source_word: יַעֲקֹב
  choice: 雅各
  rationale: 采用该人名在现代汉语圣经传统中的通行音译。
