revisions:
- from: 雅各说：“我祖亚伯拉罕的上帝、我父以撒的上帝，雅威啊，你曾对我说：‘回到你的土地和亲族[a]那里去，我必厚待你[b]。’
  to: 雅各说：“我祖亚伯拉罕的上帝、我父以撒的上帝，雅威啊，你曾对我说：‘回到你的土地和你的亲族那里去，我必善待你。’
  rationale: 修订仅改善现代汉语搭配并校正脚注b的表述：“你的亲族那里”更自然；“我必善待你”准确传达神施恩、以善相待的应许，且不把福分具体化。保留外层引号未闭合，以反映雅各的祷告在下一节继续。
