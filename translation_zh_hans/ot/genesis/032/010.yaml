    rationale: יטב使役式与עִם表达“善待、使之得好处”的应许。“我必善待你”更中性、直接，也更符合现代庄重汉语。
  revised_text: 雅各说：“我祖亚伯拉罕的上帝、我父以撒的上帝，雅威啊，你曾对我说：‘回到你的土地和你的亲族那里去，我必善待你。’
