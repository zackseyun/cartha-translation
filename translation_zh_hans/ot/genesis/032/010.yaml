base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/010.yaml
  text: And Jacob said[a], “O God of my father Abraham and God of my father Isaac, O Yahweh, who said to me, ‘Return to your land and to your kindred[b], and I will do you good,’”
translation:
  language: zh_hans
  text: 雅各说：“我祖亚伯拉罕的上帝、我父以撒的上帝，雅威啊，你曾对我说：‘回到你的土地和你的亲族那里去，我必善待你。’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר יַעֲקֹב
  choice: 雅各说
  rationale: 未完成式连 waw 推进叙事；现代汉语通常无需机械译出“于是/而”，用“雅各说”即可自然承接上下文。
- source_word: אֱלֹהֵי אָבִי אַבְרָהָם וֵאלֹהֵי אָבִי יִצְחָק
  choice: 我祖亚伯拉罕的上帝、我父以撒的上帝
  rationale: 直呼祷告对象。希伯来语 אָב 可指父亲或先祖；亚伯拉罕是雅各的祖父，故以“我祖”自然表达其先祖关系，而以撒译作“我父”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译上帝的专名 YHWH，不以“主”这一称号替代；“啊”体现呼格语气。
- source_word: הָאֹמֵר אֵלַי
  choice: 你曾对我说
  rationale: 带定冠词的分词描述雅威为曾向雅各说话的那一位；祷告中的第二人称在汉语中比关系从句更自然。
- source_word: שׁוּב לְאַרְצְךָ
  choice: 回到你的土地
  rationale: שׁוּב 是“返回”，אֶרֶץ 是“土地/地方”；保留“你的土地”，避免把此词与后面的出生地或亲族概念合并。
- source_word: וּלְמוֹלַדְתְּךָ
  choice: 和亲族那里去
  rationale: מוֹלֶדֶת 可指亲族、家乡或出生之地；正文采用本语境中自然的“亲族”，并以脚注保留其词义幅度。
- source_word: וְאֵיטִיבָה עִמָּךְ
  choice: 我必厚待你
  rationale: יטב 的使役式与 עִם 连用，表示施恩、善待或使对方得福；“厚待你”既自然，又保留应许性的善意行动。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。采用“雅威”作汉语音译，以保留其专名性质；不以称号“主”替代。
- issue: וְאֵיטִיבָה עִמָּךְ 所表达的应许
  choice: 我必厚待你
  alternative: 我必善待你；我必使你得福
  rationale: 原文可表示以善意相待，也可能带来福祉结果；正文不将其具体化为某一种物质或属灵福分。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。“我祖……我父……”简洁呈现两代先祖关系；“雅威啊”明确直接呼告。末尾暂不闭合外层引号，因为雅各的祷告在下一节继续。
