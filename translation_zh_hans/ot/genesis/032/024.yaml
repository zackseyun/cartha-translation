  text: He took them and brought them across the stream[b][a], and he brought across what belonged to him.
translation:
  language: zh_hans
  text: 他带他们过了那条溪流[a]，又把他所有的东西带了过去[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“河谷”或“季节性水道”。希伯来语 נחל 可指溪流、沟谷，或季节性有水的河道。
    reason: lexical_alternative
  - marker: b
    text: 直译“那属于他的”或“归他的”；这里指属于他的东西，即他的财物。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקָּחֵם
  choice: 他带着他们
  rationale: לקח的基本义是“拿、带”；这里宾语是前文提到的人，用“带着他们”符合现代汉语叙事，也不额外加入原文没有明说的动作。
- source_word: וַיַּעֲבִרֵם
  choice: 过了
  rationale: עבר的使役形表示雅各使他们过到另一边；汉语“带着他们过了”在整体结构中自然表达这一使役关系。
- source_word: הַנָּחַל
  choice: 溪流
  rationale: נחל可指溪流、沟谷或季节性水道。此处叙述涉水而过，“溪流”清楚易懂，同时以脚注保留地貌上的语义范围。
- source_word: וַיַּעֲבֵר
  choice: 送了过去
  rationale: עבר的使役形再次出现，宾语是雅各拥有的事物。“送了过去”自然表达使这些东西到达对岸的意思，而不限定具体搬运方式。
- source_word: אֲשֶׁר לוֹ
  choice: 属于他的
  rationale: 该短语直译为“对他所有的／归他的”，在上下文中指雅各的财物；“属于他的”贴近原有关系结构，也避免将范围擅自限定为某一类财产。
