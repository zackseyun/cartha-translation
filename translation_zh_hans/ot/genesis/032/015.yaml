  text: 母山羊二百只，公山羊二十只；母绵羊二百只，公绵羊二十只。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עִזִּים
  choice: 母山羊
  rationale: 该词指山羊；本节与公山羊配列，语境明确区分性别，因此译作现代汉语自然明确的“母山羊”。
- source_word: מָאתַיִם
  choice: 二百
  rationale: 准确对应基数词“二百”。
- source_word: תְיָשִׁים
  choice: 公山羊
  rationale: 该词特指雄性山羊；“公山羊”通俗清楚，并与“母山羊”形成对应。
- source_word: עֶשְׂרִים
  choice: 二十
  rationale: 准确对应基数词“二十”。
- source_word: רְחֵלִים
  choice: 母绵羊
  rationale: 该词指雌性绵羊；译作“母绵羊”既保留性别信息，也比仅译“羊”更准确，并与公绵羊对应。
- source_word: אֵילִים
  choice: 公绵羊
  rationale: 该词指雄性绵羊、公羊；“公绵羊”明确说明羊的类别与性别，避免“公羊”在孤立语境中可能产生的泛指。
