  text: וְ/אָֽמַרְתָּ֙ לְ/עַבְדְּ/ךָ֣ לְ/יַעֲקֹ֔ב מִנְחָ֥ה הִוא֙ שְׁלוּחָ֔ה לַֽ/אדֹנִ֖/י לְ/עֵשָׂ֑ו וְ/הִנֵּ֥ה גַם ה֖וּא אַחֲרֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/019.yaml
  text: Then you shall say[a], ‘Your servant Jacob's gift is sent to my lord, to Esau; and look[b], he also is behind us.’
translation:
  language: zh_hans
  text: 你要说：“这是你仆人雅各的礼物[a]，是送给我主以扫的。看，他也在我们后面[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “礼物”也可译作“赠礼”或“贡礼”。希伯来语 minḥah 在这里指为与以扫和解而送上的礼物。
    reason: lexical_alternative
  - marker: b
    text: 或译：“正在我们后面赶来。”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָֽמַרְתָּ
  choice: 你要说
  rationale: 这里的连词加完成式承接雅各对仆人的一连串吩咐；“你要说”在现代汉语中自然地表达指令语气。
- source_word: לְעַבְדְּךָ לְיַעֲקֹב
  choice: 你仆人雅各的
  rationale: 两个带 לְ 的短语在语境中说明礼物属于谁，并保留雅各对以扫自称“你仆人”的谦卑措辞。
- source_word: מִנְחָה
  choice: 礼物
  rationale: 此处指为缓和与以扫关系而送出的赠礼，并非祭祀性供物；“礼物”清楚、自然，也不把政治臣属意味说得过重。
- source_word: שְׁלוּחָה
  choice: 是送给……的
  rationale: 保留被动分词所表达的“已被送出／作为赠礼送去”的意思，同时符合现代汉语表达。
- source_word: לַאדֹנִי לְעֵשָׂו
  choice: 给我主以扫
  rationale: “我主”保留雅各对以扫所用的尊称；“以扫”作为同位成分说明“我主”所指何人，汉语中无需加入逗号。
- source_word: וְהִנֵּה
  choice: 看
  rationale: 该话语标记引人注意后面的信息；“看”比“看哪”更现代，又保留提示作用。
- source_word: גַם הוּא
  choice: 他也
  rationale: 保留附加和强调意味，说明雅各本人也跟在礼物和仆人之后。
- source_word: אַחֲרֵינוּ
  choice: 在我们后面
  rationale: 直接表达雅各相对于先行队伍的位置，不额外断定移动状态；“在我们后面赶来”也是语境上可能的理解。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“你仆人”“我主”保留原文刻意的谦卑和尊敬语气；句式略作汉语化调整，但不消除“在后面”既可表示位置、也可暗含随后而来的语义空间。
