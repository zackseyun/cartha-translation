    rationale: נכה 的基本语义是击打、打击或攻击；本节的语境确实严重，但原文并未使用明确的“杀死”动词。译作“攻击”保留其暴力性及结果范围，而不添加死亡这一确定断言。
  - severity: low
    issue: “就是以扫的手”弱化了原文两次“从……手中”的重复。
    rationale: 原文重复 מִיַּד，用以强调威胁者既是“我的兄弟”又是“以扫”。中文重复“脱离”可自然保留这一修辞。
