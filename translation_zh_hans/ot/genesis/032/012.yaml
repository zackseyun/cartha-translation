  naturalness: 前半句自然庄重。“就是以扫的手”虽可理解，但用重复的“脱离……的手”更贴近原文的强调，也更顺畅。将末句改为“连母亲和孩子也一同遭攻击”可避免把“母亲和孩子”误作与“我”同位，同时保持现代汉语清楚的句法。
  terminology: “以扫”规范；“求你救我”适合祷告语体。“攻击”比“击杀”更适合对应 נכה，既保留暴力威胁，也不预断其必然致死。脚注应说明该短语的字面形式和习语用法，但不应把“击杀”作为唯一含义。
