  text: הַצִּילֵ֥/נִי נָ֛א מִ/יַּ֥ד אָחִ֖/י מִ/יַּ֣ד עֵשָׂ֑ו כִּֽי יָרֵ֤א אָנֹכִי֙ אֹת֔/וֹ פֶּן יָב֣וֹא וְ/הִכַּ֔/נִי אֵ֖ם עַל בָּנִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/012.yaml
  text: Please deliver me from the hand of my brother[a], from the hand of Esau, for I am afraid of him, lest he come and strike me[b], the mother with the children.
translation:
  language: zh_hans
  text: 求你救我脱离我哥哥的手，脱离以扫的手，因为我怕他，恐怕他来攻击我，连母亲和孩子也一同遭攻击。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“母亲在孩子之上”；这是一个希伯来语习语，指母亲和孩子一同遭受攻击。
    reason: 说明希伯来语 אֵם עַל בָּנִים 的字面形式及习语含义，并避免把“攻击”限定为“击杀”。
lexical_decisions:
- source_word: הַצִּילֵנִי נָא
  choice: 求你救我
  rationale: הַצִּילֵנִי 是 נצל 的使役式命令形，意为“救出、搭救”；נָא 使请求语气柔和。合译为“求你救我”，自然地保留祈求语气。
- source_word: מִיַּד אָחִי מִיַּד עֵשָׂו
  choice: 脱离我哥哥的手，就是以扫的手
  rationale: 保留“手”这一表示权势或控制的希伯来语具体意象，也保留“我哥哥”与“以扫”的重复同位关系，以突出威胁来自亲兄弟的张力。
- source_word: כִּי יָרֵא אָנֹכִי אֹתוֹ
  choice: 因为我怕他
  rationale: כִּי 引出请求的理由；显明的第一人称代词 אָנֹכִי 加强雅各亲自承认恐惧的语气，现代汉语用简洁自然的“我怕他”表达。
- source_word: פֶּן יָבוֹא
  choice: 恐怕他来
  rationale: פֶּן 引出所担忧的可能结果；“恐怕”既自然，又不把尚未发生的事说成确定事实。
- source_word: וְהִכַּנִי
  choice: 来击杀我
  rationale: נכה 的使役式在此表示猛烈击打或击倒；语境涉及对全家的致命袭击。“击杀”传达暴力严重性，同时不像单纯译作“杀死”那样完全消除原词“击打”的语义。
- source_word: אֵם עַל בָּנִים
  choice: 连母亲和孩子也一同击杀
  rationale: 这是描述母亲与孩子一同遭受毁灭的希伯来语表达。中文补出承前的“击杀”，使句法清楚；“连……也一同”保留无差别殃及全家的骇人图景。
theological_decisions:
- issue: אֵם עַל בָּנִים 的暴力习语如何表达
  choice: 连母亲和孩子也一同击杀
  alternative: 母亲连同孩子／母亲在孩子之上
  rationale: 原文的介词 עַל 字面可作“在……之上”，但全句表示母亲与孩子一起遭袭。正文采用可懂的现代汉语，不改成特定的“妻子儿女”，以免加入原文没有明说的家庭身份；脚注保留直译形式及其不寻常意象。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语言。“求你”表达恳求；保留两次“手”的希伯来意象和“我哥哥／以扫”的重复。末句为避免中文误把雅各与“母亲”视为同位语，补出承前谓语，并以脚注保存原文较生硬且含混的结构。
