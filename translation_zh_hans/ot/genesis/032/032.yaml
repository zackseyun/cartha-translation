  yaml_path: translation/ot/genesis/032/032.yaml
  text: The sun rose upon him as he passed Penuel[c][b][a], and he was limping on his thigh.
translation:
  language: zh_hans
  text: 他经过毗努伊勒[a]时，太阳升起，照在他身上；他正瘸着腿走路[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节的希伯来文地名写作“毗努伊勒”（Penuel）；其他经文也有“毗尼伊勒”（Peniel）这一形式。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文较直译为“在他的大腿上”。这里的用语也可理解为“因他的大腿的缘故”；“大腿”一词按上下文可指大腿上部，或涉及髋部。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְרַח לוֹ הַשֶּׁמֶשׁ
  choice: 太阳升起，照在他身上
  rationale: זרח以太阳为主语时表示“升起、发光”；לוֹ描写太阳临到他。译文拆成两个相连的动作，使现代汉语自然，同时保留太阳“照在他身上”的希伯来语视角。
- source_word: כַּאֲשֶׁר עָבַר
  choice: 经过……时
  rationale: כַּאֲשֶׁר在这里引出时间背景；עבר可指经过或越过。原文没有明说他越过河流，因此采用不额外限定的“经过”。
- source_word: פְּנוּאֵל
  choice: 毗努伊勒
  rationale: 按本节的元音形式Penuel音译，并沿用现代中文圣经读者较熟悉的译名；脚注说明另有Peniel形式。
- source_word: וְהוּא צֹלֵעַ
  choice: 他……走路一瘸一拐
  rationale: 分词צֹלֵעַ描写持续的跛行动作或状态。“走路一瘸一拐”自然、具体，也不把它强化为永久残疾。
- source_word: עַל יְרֵכוֹ
  choice: 因大腿而
  rationale: יָרֵךְ本义范围包括大腿、上腿，也可依语境涉及髋部；עַל在此可按原因理解。正文采用自然的因果表达，但以脚注保留较直译的空间表达及解剖范围上的含混。
