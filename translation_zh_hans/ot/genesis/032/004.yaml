  yaml_path: translation/ot/genesis/032/004.yaml
  text: Jacob sent messengers ahead of him to Esau his brother[a], to the land of Seir, the country of Edom.
translation:
  language: zh_hans
  text: 雅各打发使者先行，往西珥地、以东地区去见他哥哥以扫[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “以东地区”希伯来文直译为“以东的田野”，这里可能是一个地域名称。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: 差遣
  rationale: 该叙事动词表示雅各派人执行任务；“差遣”自然、庄重，又不过度强调正式使团的意味。
- source_word: מַלְאָכִים
  choice: 使者
  rationale: מַלְאָכִים 可指天使或受差派传信的人；本处是雅各派往以扫那里的人员，因此译作“使者”。
- source_word: לְפָנָיו
  choice: 走在自己前面
  rationale: 原文直指“在他面前”，语境中表示预先派他们前往；此译保留了空间意象，也清楚表达先行之意。
- source_word: עֵשָׂו אָחִיו
  choice: 他哥哥以扫
  rationale: 保留亲属关系；按汉语习惯将称谓置于名字之前。以扫是雅各的哥哥，译出“哥哥”比宽泛的“兄弟”更准确自然。
- source_word: אַרְצָה שֵׂעִיר
  choice: 往西珥地
  rationale: אַרְצָה 带方向词尾，表示朝某地而去；“往西珥地”同时体现方向和“地”这一名词。
- source_word: שְׂדֵה אֱדֹם
  choice: 以东地区
  rationale: 该构造短语字面为“以东的田野”，在此用作地域称呼；“以东地区”符合现代汉语，并以脚注保留其字面表达。
theological_decisions: []
translation_notes:
  register: 采用现代、清楚而庄重的叙事语言。“走在自己前面”保留希伯来文的空间表达；“就是”表明“西珥地”和“以东地区”是对同一目的地的并列说明。
