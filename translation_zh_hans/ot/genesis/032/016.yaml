base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/016.yaml
  text: thirty nursing camels and their young[a], forty cows and ten bulls, twenty female donkeys and ten foals.
translation:
  language: zh_hans
  text: 三十匹正在哺乳的母骆驼，连同它们的小骆驼；母牛四十头，公牛十头；母驴二十头，驴驹十头。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “驴驹”或译“公驴”。希伯来语这个词通常可指幼驴；但在这份牲畜清单中，它也可能指与母驴相对的公驴。
    reason: 保留 וַעְיָרִם 在年龄和性别指向上的词义歧义。
lexical_decisions:
- source_word: גְּמַלִּים מֵינִיקוֹת
  choice: 正在哺乳的母骆驼
  rationale: מֵינִיקוֹת 是阴性复数分词，指正在给幼崽吃奶的雌骆驼；译出“母”和“正在哺乳”可自然、准确地表达性别与状态。
- source_word: וּבְנֵיהֶם
  choice: 和它们的小骆驼
  rationale: בנים 字面为“儿女、后代”，用于牲畜时指幼崽；结合骆驼语境明确译为“小骆驼”。
- source_word: שְׁלֹשִׁים
  choice: 共三十匹
  rationale: 数词位于“正在哺乳的母骆驼和它们的小骆驼”之后，最自然地修饰整个并列组；“共”显明合计关系，但不额外规定母骆驼与幼崽各自的数目。
- source_word: פָּרוֹת
  choice: 母牛
  rationale: 该词明确指雌性牛；“母牛”是现代汉语中自然且准确的表达。
- source_word: וּפָרִים
  choice: 公牛
  rationale: פָרִים 指雄性牛，与前面的母牛形成性别对应。
- source_word: אֲתֹנֹת
  choice: 母驴
  rationale: 该阴性复数名词特指雌驴；“母驴”简洁自然。
- source_word: וַעְיָרִם
  choice: 驴驹
  rationale: עַיִר 通常指幼驴，故正文译为“驴驹”；该词在此牲畜清单中也可能侧重与母驴相配的公驴，故以脚注保留另一理解。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的牲畜清单表达；按动物类别用分号分组。骆驼用量词“匹”，牛和驴用“头”。数目“三十”按希伯来语词序理解为母骆驼与幼骆驼的合计，避免误译为三十匹母骆驼之外另有未计数的幼骆驼。
