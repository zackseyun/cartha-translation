id: GEN.32.3
reference: Genesis 32:3
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יַעֲקֹב֙ כַּ/אֲשֶׁ֣ר רָאָ֔/ם מַחֲנֵ֥ה אֱלֹהִ֖ים זֶ֑ה וַ/יִּקְרָ֛א שֵֽׁם הַ/מָּק֥וֹם הַ/ה֖וּא מַֽחֲנָֽיִם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/003.yaml
  text: When Jacob saw them[a], he said, “This is God’s camp.” So he called the name of that place Mahanaim.
translation:
  language: zh_hans
  text: 雅各看见他们，就说：“这是上帝的营地。”于是，他给那地方起名叫玛哈念[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “玛哈念”这个名字与希伯来语“营地”相关，可能有“两个营地”或“双营”的意思，与雅各所说“这是上帝的营地”相呼应。
    reason: 说明地名与“营地”之间的文字呼应，以及该名称可能具有的双数含义。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 就说
  rationale: 这是叙事中常见的连续动词形式，引出雅各看见他们后的话；原文没有说明说话对象，因此不增译“自言自语”或“喊道”。
- source_word: כַּאֲשֶׁר רָאָם
  choice: 看见他们
  rationale: כַּאֲשֶׁר 在这里表达时间关系；רָאָם 的后缀是第三人称阳性复数，承接上一节的“上帝的使者”。中文用“看见他们，就……”自然表达这一时序。
- source_word: מַחֲנֵה אֱלֹהִים
  choice: 上帝的营地
  rationale: 这是一个所属结构，直译为“上帝的营地”。“营地”既符合 מַחֲנֶה 的常用义，也保留了与地名 מַחֲנָיִם 的文字呼应。
- source_word: זֶה
  choice: 这是
  rationale: 指示词在此作判断句的主语，现代汉语自然补出系词“是”。
- source_word: וַיִּקְרָא שֵׁם
  choice: 给……起名叫
  rationale: 原文习语字面为“称……的名”；“给那地方起名叫”是自然、清楚的现代汉语，同时保留命名这一动作。
- source_word: הַמָּקוֹם הַהוּא
  choice: 那地方
  rationale: 准确表达定冠词和远指成分所指的特定地点。
- source_word: מַחֲנָיִם
  choice: 玛哈念
  rationale: 作为地名采用音译；其词形与“营地”相关，并可能带有“双营”或“两个营地”的意味，另以脚注说明，而不在正文中把地名意译。
theological_decisions:
- issue: אֱלֹהִים 在所属结构中的所指
  choice: 上帝的
  alternative: 神的／诸神的
  rationale: 上下文中的“上帝的使者”以及雅各的宣告表明，这里指上帝而非复数的诸神；译为“上帝的”既符合语法，也不额外引入解释。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“就说”呈现看见之后随即作出的回应；“于是”衔接命名结果。地名保留音译，并用脚注保存原文的双关和可能的双数含义。
