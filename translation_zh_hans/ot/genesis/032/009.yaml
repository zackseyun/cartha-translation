  source_fidelity: “把他们击杀”将 נכה（击打、攻击）具体化为“击杀”，并把单数后缀所指的营队改成复数的人，超过了原文所明说的程度。应保留“攻击／击打那一营”的表达。
  naturalness: 原译整体通顺；“那一营”比“那一队”更贴近营地、营队的叙事语境，也较符合中文圣经的庄重叙述文体。
  terminology: “以扫”通行且恰当。“营”对应 מַחֲנֶה；“逃脱”能自然表达 לִפְלֵיטָה 的逃生、幸存结果。
