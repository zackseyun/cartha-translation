- from: 他说：“如果以扫来到其中一队，把他们击杀，剩下的那一队就能逃脱[a]。”
  to: 他说：“如果以扫来到那一营，攻击它，剩下的那一营就能逃脱[a]。”
  rationale: 修订以“攻击它”对应“来到……并击打它”的原文次序及动词强度，避免无依据地译为“击杀”。“那一营／剩下的那一营”保留原文冠词加数词以及上下文两营之间的对应关系；脚注以可理解的中文说明“归于逃脱”这一名词性结果结构。
