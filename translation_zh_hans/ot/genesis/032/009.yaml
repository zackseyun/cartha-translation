base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/009.yaml
  text: He said[a], “If Esau comes to the one camp and strikes it, then the camp that remains will escape.”
translation:
  language: zh_hans
  text: 他说：“如果以扫来到那一营，攻击它，剩下的那一营就能逃脱[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“剩下的那一营将得以幸存。”原文直译可作“剩下的那一营将归于逃脱”，即得以逃生或逃过毁灭。
    reason: 词义及希伯来语名词结构的不同译法
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 他说
  rationale: 该形式是叙事中常见的 wayyiqtol；现代汉语通常不必机械译出连接词，译为“他说”自然且忠实。
- source_word: אִם
  choice: 如果
  rationale: 引出条件句，保留雅各推断中的条件性，不把它确定化为“当……时”。
- source_word: יָבֹא
  choice: 来到
  rationale: בוא 的基本义是“来、进入”；敌对行动由后面的 נכה 表达，因此不在此处提前译作“攻击”。
- source_word: עֵשָׂו
  choice: 以扫
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: אֶל־הַמַּחֲנֶה הָאַחַת
  choice: 来到其中一队
  rationale: 上下文已有两队，“其中一队”自然表达定冠词加数词所指的两者之一；“来到”也直接反映介词 אֶל，而不提前加入敌意。
- source_word: וְהִכָּהוּ
  choice: 把他们击杀
  rationale: נכה 表示击打、击杀；阳性单数后缀回指作为集合体的“营队”。中文以“他们”指该队的人，比“击打它”自然，并保留行动的暴力含义。
- source_word: הַמַּחֲנֶה הַנִּשְׁאָר
  choice: 剩下的那一队
  rationale: 准确表达 נשאר 的“留下、剩余”之义，并清楚指向两队中的另一队。
- source_word: לִפְלֵיטָה
  choice: 就能逃脱
  rationale: פְלֵיטָה 是表示逃脱、幸存的名词；中文将该结果结构自然地动词化为“能逃脱”，同时用脚注保留原文较直译的表达。
