base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/020.yaml
  text: And he commanded the second also[a], and the third also, and all those going behind the droves, saying, “According to this word you shall speak to Esau when you find him.”
translation:
  language: zh_hans
  text: 他又吩咐第二个、第三个，也吩咐所有跟在各群牲畜后面的人，说：“你们遇见以扫时，要照这话对他说。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你们遇见以扫时，要这样对他说。”
    reason: “照这话”较贴近原文单数的措辞；“要这样说”则是同一希伯来短语较自然的意译。
lexical_decisions:
- source_word: וַיְצַו
  choice: 吩咐
  rationale: 该词在此表示雅各向众人下达明确指示；“吩咐”既保留指令性，也比“命令”更符合现代汉语叙事语体。
- source_word: הַשֵּׁנִי / הַשְּׁלִישִׁי
  choice: 第二个、第三个
  rationale: 原文是名词化的序数词，没有明说“仆人”或“队”；译作“第二个、第三个”保留这种省略和语境中的指代。
- source_word: כָּל הַהֹלְכִים אַחֲרֵי הָעֲדָרִים
  choice: 所有跟在各群牲畜后面的人
  rationale: 分词结构指跟随畜群前行的全体人员；“各群牲畜”体现 עֲדָרִים 所指分批赶行的动物群。
- source_word: כַּדָּבָר הַזֶּה
  choice: 照这些话
  rationale: 原义为“照这话／这件事”，在这里回指雅各已经规定的说辞；“照这些话”在中文中自然，并保留对具体措辞的关联。
- source_word: תְּדַבְּרוּן אֶל עֵשָׂו
  choice: 对以扫说
  rationale: דבר 的基本义是“说话”；中文以“对……说”自然表达其对象和指令语气。
- source_word: בְּמֹצַאֲכֶם אֹתוֹ
  choice: 你们遇见以扫时
  rationale: ב 加不定式结构表达时间情境；מצא 在此语境可自然译为“遇见”，代词则以“以扫”复现，使中文指向清楚。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“第二个、第三个”刻意不补出原文没有的“仆人”或“队”；重复“吩咐”以清楚呈现原文 גם 的递进结构。
