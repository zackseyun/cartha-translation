  text: עַל כֵּ֡ן לֹֽא יֹאכְל֨וּ בְנֵֽי יִשְׂרָאֵ֜ל אֶת גִּ֣יד הַ/נָּשֶׁ֗ה אֲשֶׁר֙ עַל כַּ֣ף הַ/יָּרֵ֔ךְ עַ֖ד הַ/יּ֣וֹם הַ/זֶּ֑ה כִּ֤י נָגַע֙ בְּ/כַף יֶ֣רֶךְ יַעֲקֹ֔ב בְּ/גִ֖יד הַ/נָּשֶֽׁה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/033.yaml
  text: Therefore[a], to this day the sons of Israel do not eat the sinew of the hip, which is on the socket of the thigh[d][c][b], because he touched the socket of Jacob’s thigh at the sinew of the hip.
translation:
  language: zh_hans
  text: 因此，直到今天，以色列人[a]仍不吃髋部凹处上的那条筋[b]，因为那人碰到了雅各髋部凹处的那条筋。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“以色列的众子”，即以色列的后裔。
    reason: lexical_alternative
  - marker: b
    text: 这里所说的是髋部或大腿附近的一条筋；其确切所指不明，传统上有人认为是坐骨神经或相关的肌腱。
    reason: cultural_note
lexical_decisions:
- source_word: עַל כֵּן
  choice: 因此
  rationale: 自然表达因果承接关系，说明这一习俗的由来。
- source_word: לֹא יֹאכְלוּ
  choice: 仍不吃
  rationale: 否定未完成式在此描述延续至叙述者当时的惯常做法；配合“直到今天”，用“仍不吃”最自然。
- source_word: בְנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 在现代汉语中比直译“以色列的众子”自然，同时准确指以色列的后裔；脚注保留原文的亲属表达。
- source_word: גִּיד הַנָּשֶׁה
  choice: 那条筋
  rationale: גיד指筋、腱或神经一类条索状组织，而הנשה的确切含义不明；正文采用宽泛、非技术性的“筋”，避免武断认定为坐骨神经或特定肌腱。
- source_word: אֲשֶׁר עַל כַּף הַיָּרֵךְ
  choice: 大腿窝上的
  rationale: כף在此指凹处或关节窝，ירך可指大腿至髋部区域；“大腿窝”保留原文身体部位表达，又不强行限定为现代解剖学的髋臼。
- source_word: עַד הַיּוֹם הַזֶּה
  choice: 直到今天
  rationale: 对应希伯来语惯用的时间表达，表示该习俗一直延续到叙述者所处的时代。
- source_word: כִּי נָגַע
  choice: 因为那人碰了
  rationale: נגע通常意为“触碰”；虽然上下文显示这一触碰带有致伤作用，仍不宜把动词加强为“击打”。补出“那人”以符合汉语指代需要，其身份由上下文确定。
- source_word: בְּכַף יֶרֶךְ יַעֲקֹב בְּגִיד הַנָּשֶׁה
  choice: 碰了雅各的大腿窝，正碰在那条筋上
  rationale: 重复“大腿窝”和“那条筋”以对应原文，并用“正碰在”自然表达第二个בְ所标示的触碰部位。
theological_decisions:
- issue: 触碰雅各者的指代
  choice: 那人
  alternative: 他
  rationale: 本节希伯来文只使用动词第三人称单数，并未再次明说身份。汉语单写“他”易造成指代不清；“那人”承接上文，同时不在本节替原文判定其神学身份。
- issue: 该筋的精确解剖学认定
  choice: 正文用“那条筋”，脚注说明可能认定
  alternative: 坐骨神经／坐骨腱
  rationale: 原词组的精确所指有争议；正文保存这种不确定性，避免把传统或现代解剖认定写成原文明说的事实。
translation_notes:
  register: 采用现代、庄重而易懂的叙事文体。“大腿窝”比技术性的“髋臼”更贴近原文宽泛的身体部位用语；“那条筋”避免生硬重复“髋部之筋”，也保存原词组的词义不确定性。所有脚注标记均置于正文相应位置。
