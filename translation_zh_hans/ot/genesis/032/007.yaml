base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/007.yaml
  text: The messengers returned to Jacob[a], saying, “We came to your brother, to Esau, and he is also coming to meet you, and four hundred men are with him.”
translation:
  language: zh_hans
  text: 使者们回到雅各那里[a]，说：“我们到了你哥哥以扫那里；他也正迎着你来，有四百人与他同行。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “使者们”也可译作“天使们”，因为希伯来语 מַלְאָכִים 可有这两种含义；但按上下文，本节指雅各派去见以扫的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֻׁבוּ
  choice: 回到
  rationale: שׁוב的连续式叙事形式表示使者完成使命后返回；“回到雅各那里”自然表达其方向和已完成的动作。
- source_word: הַמַּלְאָכִים
  choice: 使者们
  rationale: מַלְאָךְ既可指“使者”，也可指“天使”；本段紧接雅各差人去见以扫的叙述，语境明确指人间使者。
- source_word: לֵאמֹר
  choice: 说
  rationale: 该不定式结构用于引出直接引语，现代汉语以“说”最自然。
- source_word: בָּאנוּ
  choice: 我们到了
  rationale: בוא为第一人称复数完成式；按使者已抵达以扫所在之处的语境译作“到了”，比生硬的“来了”更符合现代汉语视角。
- source_word: אֶל אָחִיךָ אֶל עֵשָׂו
  choice: 到了你哥哥以扫那里
  rationale: 第二个אֶל以同位结构说明“你哥哥”就是“以扫”；汉语合并表达，可保留亲属关系及身份说明。
- source_word: וְגַם הֹלֵךְ לִקְרָאתְךָ
  choice: 现在他也正迎着你来
  rationale: גם保留递进、附加意味；分词הֹלֵךְ表达正在进行，לִקְרָאתְךָ表示朝向雅各前来相遇。“迎着你来”保留相向而行的动态，同时不预断敌意或善意。
- source_word: וְאַרְבַּע מֵאוֹת אִישׁ עִמּוֹ
  choice: 并且有四百人跟着他
  rationale: אִישׁ在此指随行的男性群体；“有四百人跟着他”自然传达陪同关系，不额外添加“武装”等原文未明说的信息。
theological_decisions:
- issue: מַלְאָכִים在此应译为“使者”还是“天使”
  choice: 正文译“使者们”
  alternative: 天使们
  rationale: 该词本身有两义，但本节所指是雅各此前差往以扫那里的人员。脚注保留词汇层面的另一可能，并说明此处语境判断。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“迎着你来”保留לִקְרָאתְךָ的相向意味，不把以扫的意图解释成友好或敌对；“四百人”不增译为军队或武装人员。
