base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/031.yaml
  text: And Jacob called the name of the place Peniel[a], for I have seen God face to face[c][b], and my life has been delivered.
translation:
  language: zh_hans
  text: 雅各便给那地方起名叫毗努伊勒[a]，因为我面对面见了上帝[c]，我的性命得以保全[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “毗努伊勒”在希伯来语中意为“上帝的面”，与后面的解释“我面对面见了上帝”形成文字关联。
    reason: cultural_note
  - marker: b
    text: “我的性命”也可译作“我的生命”或“我本人”；这里指雅各得以存活，并非专指非物质的“灵魂”。
    reason: lexical_alternative
  - marker: c
    text: “上帝”也可能较宽泛地理解为“一位神性存在者”，但上下文更支持译作“上帝”。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקְרָא יַעֲקֹב שֵׁם הַמָּקוֹם
  choice: 雅各给那地方起名叫
  rationale: קרא与“名”连用表示命名；用“给那地方起名叫”既准确表达希伯来语命名公式，也符合现代汉语。
- source_word: פְּנִיאֵל
  choice: 毗努伊勒
  rationale: 采用通行的圣经地名译法，并以脚注说明该名称与“上帝的面”的希伯来语双关。
- source_word: כִּי
  choice: 因为
  rationale: 保留其因果作用，直接引出雅各为地名所作的解释；不增添原文没有的“他说”。
- source_word: רָאִיתִי אֱלֹהִים
  choice: 我见了上帝
  rationale: 上下文倾向于雅各将这次相遇理解为见了上帝；同时以脚注保留אֱלֹהִים也可泛指神性存在者的可能。
- source_word: פָּנִים אֶל פָּנִים
  choice: 面对面
  rationale: 这是现代汉语中自然且准确的直接相见表达，也保留了与“毗努伊勒”名称解释之间的关联。
- source_word: וַתִּנָּצֵל
  choice: 得以保全
  rationale: 体现נצל的被解救、蒙保全之意，并突出雅各经历这次相遇后仍存活的结果。
- source_word: נַפְשִׁי
  choice: 我的性命
  rationale: נֶפֶשׁ在此具体指生命或本人，而非专指与身体相对的非物质“灵魂”；“性命”在语境中准确而自然。
theological_decisions:
- issue: 雅各所见之אֱלֹהִים的身份
  choice: 上帝
  alternative: 一位神性存在者
  rationale: 本段叙事和雅各对相遇的解释更支持直接指向上帝；脚注保留该词较宽泛的词义可能，避免抹去原文的张力。
- issue: “面对面见了上帝”与人仍存活之间的张力
  choice: 直译为“面对面见了上帝……性命得以保全”
  alternative: 将“面对面”弱化为间接经历或异象
  rationale: 原文有意并置直接相见与生命获保全，不应以解释性改写消除这一神学张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。保留原文从第三人称叙述直接转入第一人称解释的形式，不添加“他说”；地名使用通行译名，并通过脚注呈现希伯来语文字游戏。
