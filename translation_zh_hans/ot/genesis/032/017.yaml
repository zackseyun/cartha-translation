  text: וַ/יִּתֵּן֙ בְּ/יַד עֲבָדָ֔י/ו עֵ֥דֶר עֵ֖דֶר לְ/בַדּ֑/וֹ וַ֤/יֹּאמֶר אֶל עֲבָדָי/ו֙ עִבְר֣וּ לְ/פָנַ֔/י וְ/רֶ֣וַח תָּשִׂ֔ימוּ בֵּ֥ין עֵ֖דֶר וּ/בֵ֥ין עֵֽדֶר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/017.yaml
  text: He put each herd by itself into the hand of his servants[a], and said to his servants, “Pass on ahead of me[d][c][b], and put a space between herd and herd.”
translation:
  language: zh_hans
  text: 他把牲畜一群一群地分别交在仆人手中[a]，对仆人说：“你们走在我前面，在一群和一群之间留些空隙。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “交在仆人手中”也可译作“交给仆人照管”。原文直译为“放在仆人手中”，这是指交由他们掌管的说法。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן בְּיַד עֲבָדָיו
  choice: 交在仆人手中
  rationale: 保留“交在……手中”的具体意象，同时自然表达把牲畜交由仆人掌管。
- source_word: עֵדֶר עֵדֶר לְבַדּוֹ
  choice: 牲畜一群一群地分别
  rationale: 重复的 עֵדֶר 具有逐群分配的作用；“一群一群地分别”既体现重复，也表达各群分开的安排。“牲畜”由上下文补明群体性质，避免中文单说“群”不够自然。
- source_word: עִבְרוּ לְפָנַי
  choice: 你们走在我前面
  rationale: עבר 在此指行进、经过，而 לְפָנַי 指在雅各前面；此译不额外假定具体跨越某处。
- source_word: וְרֶוַח תָּשִׂימוּ
  choice: 留些空隙
  rationale: רֶוַח 指空间或间隔；中文命令语境中“留些空隙”比逐字译作“放一个空间”自然。
- source_word: בֵּין עֵדֶר וּבֵין עֵדֶר
  choice: 在一群和一群之间
  rationale: 保留原文重复而带分配意味的句式，清楚表达各群彼此相隔。
theological_decisions: []
