  text: וְ/אַתָּ֣ה אָמַ֔רְתָּ הֵיטֵ֥ב אֵיטִ֖יב עִמָּ֑/ךְ וְ/שַׂמְתִּ֤י אֶֽת זַרְעֲ/ךָ֙ כְּ/ח֣וֹל הַ/יָּ֔ם אֲשֶׁ֥ר לֹא יִסָּפֵ֖ר מֵ/רֹֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/013.yaml
  text: But you said[a], ‘I will surely do you good, and I will make your offspring like the sand of the sea[c][b], which cannot be counted because of its abundance.’
translation:
  language: zh_hans
  text: 可是你曾说：“我必定善待你[a]，使你的后裔[b]像海沙一样，多得数不清[c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我一定会赐福给你。”希伯来文以不定式绝对形和限定动词连用来加强语气。
    reason: lexical_alternative
  - marker: b
    text: 或译：“你的子孙。”希伯来文“后裔”是集合意义的单数，指后代整体。
    reason: lexical_alternative
  - marker: c
    text: 或译：“多得无法计数。”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה אָמַרְתָּ
  choice: 可是你曾说
  rationale: 独立代词“你”带有强调作用，连词在雅各的恳求中形成转折，突出眼前危难与上帝先前应许之间的张力；“可是你曾说”自然保留这一语气。
- source_word: הֵיטֵב אֵיטִיב עִמָּךְ
  choice: 我必定善待你
  rationale: 不定式绝对形与限定动词连用以加强语气，故用“必定”；היטיב עם 表示向某人施惠，“善待你”准确而自然，不将福分窄化为物质兴旺。
- source_word: וְשַׂמְתִּי
  choice: 使
  rationale: שׂים 在此表示使后裔达到某种数量状态，汉语用“使”比直译为“放置”自然。
- source_word: זַרְעֲךָ
  choice: 你的后裔
  rationale: זֶרַע 是集合意义的单数，指一个人的后代整体；“后裔”既保留集合含义，也符合庄重的现代汉语。
- source_word: כְּחוֹל הַיָּם
  choice: 像海沙一样
  rationale: 直译并自然表达希伯来语的比喻，指海边或海岸大量的沙。
- source_word: אֲשֶׁר לֹא יִסָּפֵר מֵרֹב
  choice: 多得数不清
  rationale: 被动式表达不可数算，מֵרֹב 说明原因在于数量极多；“多得数不清”在现代汉语中简洁保留两层意思。
theological_decisions: []
