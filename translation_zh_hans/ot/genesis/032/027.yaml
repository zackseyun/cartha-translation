base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/027.yaml
  text: And he said[a], “Let me go, for the dawn has risen.” But he said[c][b], “I will not let you go unless you bless me.”
translation:
  language: zh_hans
  text: 他说[a]：“放开我吧，因为天已经亮了[b]。”他却说[c]：“除非你给我祝福，否则我不放开你。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “放开我”也可译作“让我走”或“释放我”。
    reason: lexical_alternative
  - marker: b
    text: 也可直译为“因为黎明已经升起”。
    reason: lexical_alternative
  - marker: c
    text: 本节希伯来文没有明确指出两处“他说”分别是谁；说话者的身份需根据上下文判断。
    reason: cultural_note
lexical_decisions:
- source_word: שַׁלְּחֵנִי
  choice: 放开我吧
  rationale: שׁלח带第一人称单数宾语后缀，基本义为“释放我／让我离开”。在摔跤的语境中，“放开我吧”自然贴切，也保留对方正被抓住的意味。
- source_word: כִּי עָלָה הַשָּׁחַר
  choice: 因为天快亮了
  rationale: כִּי在此表原因；עָלָה הַשָּׁחַר字面描写“黎明升起”。现代汉语通常说“天快亮了”，既自然又传达破晓正在来到。
- source_word: לֹא אֲשַׁלֵּחֲךָ
  choice: 我就不放开你
  rationale: 否定词加未完成式表达坚定拒绝；重复“放开”对应前面的同一希伯来词根，保留对话中的呼应。
- source_word: כִּי אִם
  choice: 你不……，我就不……
  rationale: כִּי אִם在这里引出例外条件。汉语用“你不……，我就不……”自然表达“除非”的条件关系，同时不增加额外解释。
- source_word: בֵּרַכְתָּנִי
  choice: 你不给我祝福
  rationale: 该完成式处于条件结构中，所指是放手之前必须发生的祝福行动。“给我祝福”在现代汉语中清楚自然。
- source_word: וַיֹּאמֶר ... וַיֹּאמֶר
  choice: 他说……他却说
  rationale: 原文两次只用第三人称阳性单数“他说”，未点明说话者。“却”体现第二句的转折和拒绝，但不替原文指定身份。
theological_decisions:
- issue: 两位说话者的身份
  choice: 正文沿用两次“他说”，不直接补出“那人”“雅各”“神”或“天使”。
  alternative: 依据上下文分别明确译作“那人说”和“雅各说”，或将第一位说话者认定为神／天使。
  rationale: 本节希伯来文的两个动词都只隐含第三人称阳性单数主语，并未明说身份。保留泛称可忠实呈现本节措辞及叙事中的神学张力；脚注说明身份需由上下文判断。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“放开”贴合摔跤语境，并在两句中重复以保留希伯来文 שׁלח 的词语呼应；不在正文中补明说话者身份。
