base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/001.yaml
  text: Laban rose early in the morning[a], kissed his sons and his daughters, and blessed them. Then Laban departed and returned to his place.
translation:
  language: zh_hans
  text: 拉班清早起来，亲吻了他的儿子和女儿[a]，为他们祝福。随后，拉班离去，回到他的地方。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文作“他的儿子和女儿”；这里很可能指拉班的后代，即他的外孙和外孙女。
    reason: 说明希伯来亲属称谓在本段语境中可能具有较宽的指称范围，同时保留其不确定性。
lexical_decisions:
- source_word: וַיַּשְׁכֵּם בַּבֹּקֶר
  choice: 清早起来
  rationale: שׁכם的使役词干在这里表示早起，בַּבֹּקֶר说明时间；“清早起来”自然简洁，并保留原文的时间重点。
- source_word: וַיְנַשֵּׁק
  choice: 亲吻了
  rationale: נשׁק在本处指家人分别时的亲吻；“亲吻”直接传达其含义，也符合庄重的叙事语体。
- source_word: לְבָנָיו וְלִבְנוֹתָיו
  choice: 他的儿子和女儿
  rationale: 原文明确使用阳性和阴性的亲属称谓。虽然其中可能包括外孙辈，正文仍保留原文形式，并以脚注说明其指称范围。
- source_word: וַיְבָרֶךְ אֶתְהֶם
  choice: 又给他们祝福
  rationale: ברך的基本含义是“祝福”。离别语境可能包含告别之意，但不宜将明确的祝福含义弱化为单纯道别。
- source_word: וַיֵּלֶךְ
  choice: 离开那里
  rationale: הלך本义为“走、去”；结合下文“回到”，译为“离开那里”可自然表达动作次序。“那里”是由叙事场景补出的汉语指示语，不改变事件内容。
- source_word: וַיָּשָׁב לִמְקֹמוֹ
  choice: 回到自己的地方去了
  rationale: שׁוב表示“返回”，מקום是“地方”。此译保留原文未明确说“家”的宽泛表达，同时符合现代汉语叙事习惯。
theological_decisions:
- issue: 带性别的亲属称谓及其指称范围
  choice: 他的儿子和女儿
  alternative: 他的孩子们；他的外孙辈
  rationale: 希伯来文分别使用“儿子”和“女儿”，因此正文不将其合并为中性的“孩子们”，也不直接限定为“外孙辈”。脚注说明这些词在语境中可能涵盖后代，以保留指称上的张力。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“清早起来”“亲吻”“祝福”清楚易懂；结句保留“自己的地方”的宽泛性，避免把原文未明说的地点具体化为“家”。
