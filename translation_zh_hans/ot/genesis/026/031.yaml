  text: And they rose early in the morning and swore an oath, each man to his brother; then Isaac sent them away[a], and they departed from him in peace.
translation:
  language: zh_hans
  text: 他们清早起来，彼此起誓；随后，以撒送他们走，他们就平平安安地离开了他。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּשְׁכִּימוּ בַבֹּקֶר
  choice: 他们清早起来
  rationale: שׁכם的使役式在叙事中表示早起；与בַבֹּקֶר合译为“清早起来”，自然简洁，并保留时间信息。
- source_word: וַיִּשָּׁבְעוּ
  choice: 起誓
  rationale: שׁבע的尼法勒式表示发誓、起誓；“起誓”保留正式盟誓语气，又不额外补入经文未明说的誓言内容。
- source_word: אִישׁ לְאָחִיו
  choice: 彼此
  rationale: 字面为“各人向自己的弟兄”，在这里表达双方相互起誓。正文采用自然的现代汉语“彼此”，字面形式收入脚注。
- source_word: וַיְשַׁלְּחֵם
  choice: 以撒送他们走
  rationale: שׁלח的加强式带宾语后缀，表示打发、送走；“送他们走”在和约后的离别场景中自然，也避免“赶走”的负面意味。
- source_word: וַיֵּלְכוּ מֵאִתּוֹ
  choice: 他们就……离开了他
  rationale: הלך与מֵאֵת连用表示从某人那里离去；译文明确保留离开以撒之意。
- source_word: בְּשָׁלוֹם
  choice: 平平安安地
  rationale: שָׁלוֹם在此兼有和平相处与安然离去的意味；“平平安安地”是自然汉语，并保留安全、和睦的语义色彩。
