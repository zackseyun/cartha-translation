  text: וַ/יֵּרָ֤א אֵלָי/ו֙ יְהוָ֔ה וַ/יֹּ֖אמֶר אַל תֵּרֵ֣ד מִצְרָ֑יְמָ/ה שְׁכֹ֣ן בָּ/אָ֔רֶץ אֲשֶׁ֖ר אֹמַ֥ר אֵלֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/002.yaml
  text: Then Yahweh appeared to him and said[a], “Do not go down to Egypt. Dwell in the land that I will tell you.”
translation:
  language: zh_hans
  text: 雅威向他显现，说：“不要下埃及去；你要住在我将告诉你的那地[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我对你说的那地。”原文直译近于此；动词可按语境理解为将来。
    reason: 保留 אֲשֶׁר אֹמַר אֵלֶיךָ 的较直译措辞，以及未完成式可作现在或将来理解的轻微歧义。
lexical_decisions:
- source_word: וַיֵּרָא
  choice: 显现
  rationale: ראה 的尼法勒式在这里表示可感知的显现。“显现”自然、庄重，也不额外限定显现的具体方式。
- source_word: יְהוָה
  choice: 雅威
  rationale: 原文使用四字神名 יהוה；采用现代汉语中对 Yahweh 的常见音译“雅威”，保留其作为专名的性质，而不以称号替代。
- source_word: אַל תֵּרֵד מִצְרָיְמָה
  choice: 不要下埃及去
  rationale: אַל 加未完成式构成禁止命令；“下埃及去”保留希伯来语关于前往埃及的方向表达，同时符合汉语习惯。
- source_word: שְׁכֹן
  choice: 住
  rationale: שכן 的祈使式指居住、停留；“住”是现代汉语中自然明白的表达，不额外加入“寄居”或“定居”的含义。
- source_word: בָּאָרֶץ
  choice: 在……地
  rationale: אֶרֶץ 在此指特定地域，而非整个大地；译作“地”简洁，并与后面的限定语自然衔接。
- source_word: אֲשֶׁר אֹמַר אֵלֶיךָ
  choice: 我将指示你的
  rationale: 原文直译近于“我将对你说的”。按语境，神将告诉以撒应住在哪里；“指示”在现代汉语中更自然，同时以脚注保留原文较直译的表达。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: יהוה 在本节是神的专名。译作“雅威”较直接反映通常重构的读音，并避免用“主”等称号代替；传统译名“耶和华”则是另一种广为人知的汉语形式。
translation_notes:
  register: 采用现代、清楚而庄重的叙事语言。“下埃及去”保留原文方向意象；分号呈现禁止命令与正面命令之间的对照。脚注标记已置于相关短语之后。
