    rationale: 原文动词的基本义是“说”；本节语境可作将来理解，但未明确使用“指示”一词。改用“告诉”既自然，又避免增加引导或命令的语义。
  - severity: low
    issue: “我将指示你的地”的汉语搭配略有歧义。
    rationale: “那地”能清楚标示关系从句所限定的是“地”，并使句子更符合现代标准汉语。
