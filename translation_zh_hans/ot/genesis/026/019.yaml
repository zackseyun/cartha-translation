  yaml_path: translation/ot/genesis/026/019.yaml
  text: Then Isaac’s servants dug in the wadi and found there a well of living water[a][b].
translation:
  language: zh_hans
  text: 以撒的仆人在河谷[a]中挖掘，在那里找到了一口有活水的井[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“谷”或“河床”；希伯来语这个词常指季节性水道。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语直译“活水”，指从泉源涌出的新鲜水或流动的水，而不是死水。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחְפְּרוּ
  choice: 挖井
  rationale: 该词是 חפר 的 Qal 叙事形式，基本义为“挖”；结合下文找到一口井的语境，译作“挖井”自然明确。
- source_word: עַבְדֵי יִצְחָק
  choice: 以撒的仆人
  rationale: 构造短语指服侍以撒的人；עבד 可指仆人或奴隶，但本节并未强调其法律身份，故采用自然且符合叙事语境的“仆人”。
- source_word: בַּנָּחַל
  choice: 在谷中
  rationale: נחל 在此可指谷地、河谷或季节性水道；正文用普通读者容易理解的“谷”，脚注保留更具体的地理可能性。
- source_word: וַיִּמְצְאוּ שָׁם
  choice: 在那里找到
  rationale: 保留 שָׁם“那里”的地点强调，并以自然汉语表达叙事推进。
- source_word: בְּאֵר
  choice: 一口……井
  rationale: באר 指井；量词“口”符合现代汉语习惯。
- source_word: מַיִם חַיִּים
  choice: 活水
  rationale: 直译为“活水”，是指新鲜、流动或由泉源涌出的水，而非死水；此译法也保留该表达在圣经中的语言呼应。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而通俗的叙事语言。“谷中”避免生僻的音译地理术语，具体含义由脚注说明；“活水”保留原文意象与可能的经文呼应。
