base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/034.yaml
  text: When Esau was forty years old[a], he took as wives Judith daughter of Beeri the Hittite, and Basemath daughter of Elon the Hittite.
translation:
  language: zh_hans
  text: 以扫四十岁时，娶了赫人比利的女儿犹滴，以及赫人以伦的女儿巴实抹为妻。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或更直译为：“娶了一个妻子：赫人比利的女儿犹滴，以及赫人以伦的女儿巴实抹。”希伯来原文在列出两名女子之前使用的是单数“妻子／女人”。
    reason: 保留原文单数名词与随后列出两名女子之间的语法张力。
lexical_decisions:
- source_word: וַיְהִי עֵשָׂו בֶּן אַרְבָּעִים שָׁנָה
  choice: 以扫四十岁时
  rationale: וַיְהִי在这里引入叙事的时间背景；בֶּן אַרְבָּעִים שָׁנָה是希伯来语常用的年龄表达。译为“以扫四十岁时”自然简洁。
- source_word: וַיִּקַּח אִשָּׁה
  choice: 娶了……为妻
  rationale: לקח与“妻子/女人”连用时表达婚娶。原文אִשָּׁה为单数，但后面列出两名女子；正文用汉语数目上较中性的“娶了……为妻”，并以脚注保留原文形式上的张力。
- source_word: יְהוּדִית
  choice: 犹滴
  rationale: 采用现代中文圣经读者较熟悉的人名音译。
- source_word: בְּאֵרִי
  choice: 比利
  rationale: 采用现代中文圣经通行的人名音译。
- source_word: הַחִתִּי
  choice: 赫人
  rationale: 该带定冠词的族称在此用于说明比利和以伦的族属；“赫人”是中文圣经通行译名。
- source_word: בָּשְׂמַת
  choice: 巴实抹
  rationale: 采用现代中文圣经通行的人名音译。
- source_word: אֵילֹן
  choice: 以伦
  rationale: 采用现代中文圣经通行的人名音译。
- source_word: בַּת
  choice: ……的女儿
  rationale: 准确表达希伯来语构词关系，并符合现代汉语人物身份说明的习惯。
