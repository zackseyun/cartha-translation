base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/029.yaml
  text: that you will do us no harm[a], just as we have not touched you and just as we have done to you only good and sent you away in peace[c][b]. You are now blessed by Yahweh.”
translation:
  language: zh_hans
  text: 你绝不可加害我们[a]，正如我们没有碰过你[b]，只善待你，并送你平安离去。你如今是雅威所赐福的。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “你绝不可加害我们”原文直译可作“若你加害我们”。这里的“若”可能是誓言中省略了后果的条件句，也可理解为引出他们要求以撒作出的保证。
    reason: 保留希伯来誓言句式的歧义。
  - marker: b
    text: “碰过”在这里也可理解为“伤害过”或“加害过”。
    reason: 说明נגע在语境中的引申义。
lexical_decisions:
- source_word: אִם תַּעֲשֵׂה עִמָּנוּ רָעָה
  choice: 你绝不可加害我们
  rationale: אִם在此承接上一节订立誓约的请求，属于誓言用语；按上下文表达所要求的保证，比直译为条件句更自然。“加害”准确传达עָשָׂה עִם־ רָעָה的非侵害含义。脚注保留其字面条件式及省略咒诅语的可能。
- source_word: לֹא נְגַעֲנוּךָ
  choice: 我们没有碰过你
  rationale: 保留נגע的具体基本义“碰、触碰”，不把说话者的辩称直接强化为“没有伤害”；其在本语境中也可指加害，见脚注。
- source_word: עָשִׂינוּ עִמְּךָ רַק טוֹב
  choice: 只善待你
  rationale: “善待”是现代汉语对该短语自然凝练的表达，“只”保留רַק的排他性强调。
- source_word: וַנְּשַׁלֵּחֲךָ בְּשָׁלוֹם
  choice: 并让你平安离去
  rationale: שׁלח在此指让以撒离开；“平安离去”兼顾בְּשָׁלוֹם所含的安全与和平关系，且不替说话者判断其自我陈述是否公允。
- source_word: בְּרוּךְ יְהוָה
  choice: 蒙雅威赐福的
  rationale: 将被动分词בְּרוּךְ自然译为“蒙……赐福”，并按专名呈现יהוה为“雅威”。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；“雅威”较贴近学界通常重构的读音，并明确保留其专名性质。
- issue: אִם在誓约语境中的功能
  choice: 正文译作禁止性誓约内容“绝不可”
  alternative: 若你加害我们
  rationale: 此处可能是省略了自我咒诅后果的誓言条件句，也可按上下文理解为要求以撒保证不加害他们。正文采用符合现代汉语的誓约要求，脚注保留字面结构及其张力。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。保留亚比米勒一方“只善待你”的自我陈述，不替叙事者评断其真实性；句首按上一节未完的誓约请求处理。
