lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵהֶם יִצְחָק
  choice: 以撒对他们说
  rationale: 按希伯来语叙事引语公式直译；אמר采用自然、常规的“说”，不因下文是问句而改作“问”。
- source_word: מַדּוּעַ בָּאתֶם אֵלָי
  choice: 为什么还到我这里来呢
  rationale: מַדּוּעַ译为“为什么”；完成式בָּאתֶם在当前对话中指他们已经来到，现代汉语以“到……来”自然表达。加入“还”和句末“呢”，体现以撒鉴于他们先前敌意而提出的诘问，不改变命题内容。
- source_word: וְאַתֶּם
  choice: 既然你们
  rationale: 连词וְ在此可按语境理解为原因或情势关系。“既然”自然呈现他们先前的敌意与如今来访之间的张力，同时用脚注保留较字面的并列译法。
- source_word: שְׂנֵאתֶם אֹתִי
  choice: 你们……恨我
  rationale: שׂנא通常表示“恨”，保留原文较强的措辞，不弱化为“敌视”或“不喜欢”。
- source_word: וַתְּשַׁלְּחוּנִי מֵאִתְּכֶם
  choice: 把我从你们中间赶走了
  rationale: שׁלח在本语境中是使人离开；“赶走”符合双方冲突及逐离的语境。מֵאִתְּכֶם译为“从你们中间”，保留离开他们群体和所在之处的关系含义。
