base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/010.yaml
  text: And Abimelech said[a], “What is this you have done to us? One of the people might easily have lain with your wife, and you would have brought guilt upon us.”
translation:
  language: zh_hans
  text: 亚比米勒说：“你怎么能这样对待我们呢？百姓中差一点就会有人与你的妻子同寝，你就会使我们担当罪责。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “差一点就会”也可译为“很容易会”或“很可能会”：百姓中很容易会有人与你的妻子同寝。
    reason: 说明כִּמְעַט既可表示事情险些发生，也可在此反事实语境中强调其容易发生；避免把未然事件说成已经发生。
lexical_decisions:
- source_word: מַה זֹּאת עָשִׂיתָ לָּנוּ
  choice: 你怎么能这样对待我们呢？
  rationale: 保留希伯来语“这是什么，你竟向我们做了”的惊诧与责问语气，同时用自然的现代汉语表达，并保留复数对象“我们”。
- source_word: כִּמְעַט
  choice: 差一点就
  rationale: 此处最直接表示事情几乎发生。正文采用自然明确的“差一点就”，同时在脚注说明也可理解为“很可能／很容易”，以保留词语在语境中的解释空间。
- source_word: שָׁכַב ... אֶת אִשְׁתֶּךָ
  choice: 与你的妻子同寝
  rationale: 该结构是发生性关系的委婉说法；“同寝”庄重而清楚，也与原文意象较为贴近。
- source_word: אַחַד הָעָם
  choice: 百姓中……有人
  rationale: 自然表达原文直译“百姓中的一个”，不在正文中额外限定为“男人”，尽管上下文已表明所指。
- source_word: וְהֵבֵאתָ עָלֵינוּ אָשָׁם
  choice: 你就会使我们担当罪责
  rationale: אָשָׁם在这里指因过犯而承担的客观罪责，不只是社会性的责备；“担当罪责”自然传达罪责临到群体的含义。
- source_word: וַיֹּאמֶר אֲבִימֶלֶךְ
  choice: 亚比米勒说
  rationale: 以简洁的汉语叙事式处理wayyiqtol；上下文足以表达事件推进，无须机械加入“于是”或“又”。
theological_decisions:
- issue: 此处אָשָׁם的性质
  choice: 罪责
  alternative: 过错；责罚；罪
  rationale: 语境所说的是百姓可能因不知情的性行为而陷入客观的道德罪责。“罪责”既保留宗教和道德分量，又不把该词在此处专门解释为后来的献祭术语。
- issue: כִּמְעַט所表达的是近乎发生还是容易发生
  choice: 正文译作“差一点就”，脚注保留“很可能／很容易”的理解
  alternative: 正文译作“很可能已经”
  rationale: 希伯来语通常首先表达“几乎、差一点”，但结合未然反事实语境，也可强调危险很容易成为事实；用脚注保存这一真实歧义，避免正文过度释义。
translation_notes:
  register: 采用现代、庄重且口语可懂的叙事语言。“同寝”保持圣经叙事所需的委婉与尊严；“你怎么能这样对待我们呢”传达亚比米勒的震惊和责问。脚注标记置于整节末尾，所说明的是前句中的“差一点就”。
