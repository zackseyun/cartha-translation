  text: וַ/יִּזְרַ֤ע יִצְחָק֙ בָּ/אָ֣רֶץ הַ/הִ֔וא וַ/יִּמְצָ֛א בַּ/שָּׁנָ֥ה הַ/הִ֖וא מֵאָ֣ה שְׁעָרִ֑ים וַֽ/יְבָרֲכֵ֖/הוּ יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/012.yaml
  text: Isaac sowed in that land[a], and in that year he found a hundredfold, and Yahweh blessed him.
translation:
  language: zh_hans
  text: 以撒在那片土地上撒种；那一年，他得了百倍的收成[a]。耶和华赐福给他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“得了一百份”。希伯来原文作“找到／得着一百 שְׁעָרִים”，这是表示收成极其丰厚的说法；具体是指百倍产量还是一百份收获，并不完全确定。
    reason: 保留罕见农业表达 מֵאָה שְׁעָרִים 的词义和计量含义不确定性，并更准确说明 וַיִּמְצָא 的原文措辞。
lexical_decisions:
- source_word: וַיִּזְרַע
  choice: 撒种
  rationale: 希伯来语 זרע 在农业语境中指播撒种子；“撒种”直接、自然，并保留耕作意象。
- source_word: בָּאָרֶץ הַהִוא
  choice: 在那片土地上
  rationale: אֶרֶץ 在此指以撒寄居并耕种的地域；“那片土地”既贴近原文，也避免赋予现代政治意义。
- source_word: וַיִּמְצָא
  choice: 得了
  rationale: מצא 的基本义是“找到”，但在此与收成表达连用，语境义为获得产出；“得了”保留较宽泛的取得之意，又符合现代汉语农业语境。
- source_word: בַּשָּׁנָה הַהִוא
  choice: 那一年
  rationale: 简洁对应原文时间短语，并保持叙事自然。
- source_word: מֵאָה שְׁעָרִים
  choice: 百倍的收成
  rationale: 该短语是罕见的农业产量表达，通常表示极其丰厚、达到百倍的产出；“百倍的收成”清楚传达语境意义，同时以脚注保留“百份/百倍”的词义不确定性。
- source_word: וַיְבָרֲכֵהוּ
  choice: 赐福给他
  rationale: ברך 是标准的“赐福”；此译明确保留丰收源于上帝赐福的神学陈述。
- source_word: יְהוָה
  choice: 耶和华
  rationale: “耶和华”是现代简体中文圣经语境中对四字神名最通行、最易识别的专名译法；不以“主”这一称号替代原文专名。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用以色列上帝的专名。中文采用广为人知的“耶和华”，既保留专名性质，也便于普通读者理解；“雅威”是更接近学界重构发音的可行替代。
- issue: 如何表达以撒所得的农业产出
  choice: 得了百倍的收成
  alternative: 得了百份；收获了百倍
  rationale: 原文以 מצא（“找到、得到”）搭配 מֵאָה שְׁעָרִים，表达丰厚产出。正文用自然汉语说明农业结果，却不把动词具体化为原文未明说的“收割”；脚注保留名词短语的另一种理解。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“那片土地”符合汉语方位习惯；分为两句，使耕种所得与耶和华赐福之间的关系清楚而不作额外解释。
