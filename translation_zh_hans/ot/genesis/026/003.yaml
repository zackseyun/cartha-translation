reference: Genesis 26:3
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: גּ֚וּר בָּ/אָ֣רֶץ הַ/זֹּ֔את וְ/אֶֽהְיֶ֥ה עִמְּ/ךָ֖ וַ/אֲבָרְכֶ֑/ךָּ כִּֽי לְ/ךָ֣ וּֽ/לְ/זַרְעֲ/ךָ֗ אֶתֵּן֙ אֶת כָּל הָֽ/אֲרָצֹ֣ת הָ/אֵ֔ל וַ/הֲקִֽמֹתִי֙ אֶת הַ/שְּׁבֻעָ֔ה אֲשֶׁ֥ר נִשְׁבַּ֖עְתִּי לְ/אַבְרָהָ֥ם אָבִֽי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/003.yaml
  text: Stay in this land[a], and I will be with you and bless you, for to you and to your offspring I will give all these lands[c][b], and I will establish the oath that I swore to Abraham your father.
translation:
  language: zh_hans
  text: 你要寄居在这地[a]，我必与你同在，赐福给你；因为我要把这些土地赐给你和你的后裔[b]，我也必使我向你父亲亚伯拉罕所起的誓言得以坚立[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “寄居”也可译作“暂住”；原文动词可指以外来者或临时居民的身份居住。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“种子”，在这里是集合用语，指“后裔”。
    reason: lexical_alternative
  - marker: c
    text: “使……得以坚立”也可译作“确认”或“成就”。
    reason: alternative_reading
lexical_decisions:
- source_word: גּוּר
  choice: 寄居
  rationale: 该动词常指以外来者或暂住者的身份居住；“寄居”既保留这一语义，又符合本段以撒不可下埃及、应留在当地的语境。
- source_word: בָּאָרֶץ הַזֹּאת
  choice: 在这地
  rationale: אֶרֶץ在此指具体地域；“这地”简洁自然，也保留与后文“这一切土地”的词义联系。
- source_word: וְאֶהְיֶה עִמְּךָ
  choice: 我必与你同在
  rationale: 直接保留神同在的应许表达及其关系性、盟约性分量，不作扩充。
- source_word: וַאֲבָרְכֶךָ
  choice: 赐福给你
  rationale: 与前句共同延续神的应许；现代汉语中补出“给”较自然。
- source_word: כִּי
  choice: 因为
  rationale: 在此引出命令及同在、赐福应许的根据，采用明确而自然的因果连接。
- source_word: לְךָ וּלְזַרְעֲךָ
  choice: 给你和你的后裔
  rationale: זֶרַע在此是集合名词，指以撒的后代；“后裔”在现代汉语中自然，并保留群体所指。
- source_word: אֶתֵּן
  choice: 我要……赐给
  rationale: 表达直接的将来应许；“赐给”适合神作为赐予者的语境，又不额外增添含义。
- source_word: כָּל הָאֲרָצֹת הָאֵל
  choice: 这一切土地
  rationale: 复数形式指眼前相关的各片地域；“土地”保留其地域意义及复数概念。
- source_word: וַהֲקִמֹתִי
  choice: 我也必坚立
  rationale: קום的使役形在此可指使先前所起的誓确立、持续有效或得以落实；“坚立”保留庄重语气和一定语义开放性。
- source_word: הַשְּׁבֻעָה
  choice: 所起的誓
  rationale: 该名词明确指誓言；结合关系从句译为“所起的誓”，避免汉语中“起誓言”的生硬重复。
- source_word: אֲשֶׁר נִשְׁבַּעְתִּי לְאַבְרָהָם אָבִיךָ
  choice: 我向你父亲亚伯拉罕所起的誓
  rationale: 按希伯来语关系从句自然转成汉语定语结构，并清楚保留亚伯拉罕与以撒的父子关系及应许的延续。
theological_decisions:
- issue: 如何表达神使先前誓言生效的盟约性语言
  choice: 我也必坚立我向你父亲亚伯拉罕所起的誓
  alternative: 我也必确认／成就我向你父亲亚伯拉罕所起的誓
  rationale: 原文使用קום的使役形，可有确立、确认或使之实现的意味。“坚立”贴近原文措辞及庄重语气，同时不把经文限定为某个技术性的“更新盟约”概念。
- issue: זֶרַע的集合意义及潜在张力
  choice: 后裔
  alternative: 种子／子孙
  rationale: 本节直接语境主要指以撒的后代群体，因此正文采用自然的“后裔”；脚注说明原文直译为“种子”，以保留该关键词的字面形式和可能的更广泛经文关联。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“寄居”保留原文暂住者或外来者的含义；“必”体现神谕应许的确定语气；整体句式避免过度古雅，同时保持经文的肃穆感。
