  text: And he called it Shibah[a]; therefore the name of the city is Beersheba to this day.
translation:
  language: zh_hans
  text: 他给那口井起名叫示巴[a]；因此，那城名叫别是巴，直到今日。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “示巴”就是希伯来语“七”的形式，也与“别是巴”一名背后的双关有关；“别是巴”可理解为“七之井”或“誓言之井”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא אֹתָהּ
  choice: 他给那口井起名叫
  rationale: קרא在命名语境中意为“称为、起名”；阴性代词所指是上文的井。中文明说“那口井”，既消除代词表达的不自然，也保留其上下文所指。
- source_word: שִׁבְעָה
  choice: 示巴
  rationale: 这里是井名，采用音译；其形式与希伯来语“七”及“誓言”的文字游戏有关，不在正文中单独固定为某一个词义。
- source_word: עַל כֵּן
  choice: 因此
  rationale: 准确表达由井的命名引出城名的解释性结论，简洁而自然。
- source_word: שֵׁם הָעִיר
  choice: 那城名叫
  rationale: 以自然现代汉语表达“那城的名字是”，同时保留希伯来文的命名说明。
- source_word: בְּאֵר שֶׁבַע
  choice: 别是巴
  rationale: 采用中文圣经传统中通行的地名音译；其希伯来语名称可能兼有“七之井”和“誓言之井”的双关，留在脚注说明。
- source_word: עַד הַיּוֹם הַזֶּה
  choice: 直到今日
  rationale: 这是希伯来叙事中该时间短语自然、庄重且通行的中文表达。
