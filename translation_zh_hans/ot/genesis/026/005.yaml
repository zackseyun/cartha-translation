source:
  edition: WLC
  text: עֵ֕קֶב אֲשֶׁר שָׁמַ֥ע אַבְרָהָ֖ם בְּ/קֹלִ֑/י וַ/יִּשְׁמֹר֙ מִשְׁמַרְתִּ֔/י מִצְוֺתַ֖/י חֻקּוֹתַ֥/י וְ/תוֹרֹתָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/005.yaml
  text: because Abraham obeyed my voice and kept my charge[a], my commandments, my statutes[b], and my laws.
translation:
  language: zh_hans
  text: 因为亚伯拉罕听从了我的话[a]，谨守我的吩咐、诫命、律例和教导[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“听了我的声音”；这一希伯来语习语通常含有听从、顺服的意思。
    reason: lexical_alternative
  - marker: b
    text: “教导”或译“律法”。希伯来语“妥拉”可按语境表示教导、训诲或律法。
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵקֶב
  choice: 因为
  rationale: 本词在上下文中引出前述应许的原因；“因为”自然、明确地表达因果关系。
- source_word: שָׁמַע ... בְּקֹלִי
  choice: 听从了我的话
  rationale: 希伯来语字面涉及“听我的声音”，但该习语通常表示带有顺服回应的聆听。“听从了我的话”既保留听闻意象，也清楚传达顺服含义。
- source_word: וַיִּשְׁמֹר
  choice: 谨守
  rationale: שׁמר可指守护、持守或遵行；面对一连串约法性用语，“谨守”既自然，也保留认真遵行的意味。
- source_word: מִשְׁמַרְתִּי
  choice: 我的吩咐
  rationale: מִשְׁמֶרֶת指受托应当持守之事、职责或命令。“我的吩咐”在现代汉语中清楚可懂，并尽量不与后面的“诫命”完全合并。
- source_word: מִצְוֺתַי
  choice: 我的诫命
  rationale: “诫命”准确表达约法语境中的מִצְוָה，也是清楚而通行的译法。
- source_word: חֻקּוֹתַי
  choice: 我的律例
  rationale: “律例”保留本词与“诫命”“教导”的区别，并传达所制定规范的含义。
- source_word: וְתוֹרֹתָי
  choice: 和我的教导
  rationale: תּוֹרָה的基本语义是教导、训诲，也可指律法；此处为复数。“教导”保留其较宽的语义范围，脚注同时注明“律法”这一合乎语境的译法。
theological_decisions:
- issue: 西奈立约之前出现的一组约法性术语
  choice: 保留“吩咐、诫命、律例和教导”四项并列，不将其压缩或调和。
  alternative: 概括译为“我的一切规定和律法”，或把这些术语直接等同于后来西奈律法的具体类别。
  rationale: 原文刻意累积多个相近但不完全相同的词，强调亚伯拉罕顺服的全面性。译文保留这种修辞分量，也不预先解决亚伯拉罕的顺服与后来摩西律法之间的神学关系。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“谨守”与四项并列用语保留原文的约法语体和强调效果；避免加入后世宗派性的解释。
