  text: וַ/יָּרִ֜יבוּ רֹעֵ֣י גְרָ֗ר עִם רֹעֵ֥י יִצְחָ֛ק לֵ/אמֹ֖ר לָ֣/נוּ הַ/מָּ֑יִם וַ/יִּקְרָ֤א שֵֽׁם הַ/בְּאֵר֙ עֵ֔שֶׂק כִּ֥י הִֽתְעַשְּׂק֖וּ עִמּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/020.yaml
  text: Then the shepherds of Gerar quarreled with Isaac’s shepherds[a], saying, “The water is ours.” So he named the well Esek, because they had quarreled with him.
translation:
  language: zh_hans
  text: 基拉耳的牧人与以撒的牧人争吵，说：“这水是我们的！”以撒就给那口井起名叫“埃色”[a]，因为他们曾与他争执。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “埃色”一名与希伯来语中表示“争执、争夺”的词同源。
    reason: 说明原文中井名与动词之间无法在汉语正文中完整保留的文字关联。
lexical_decisions:
- source_word: וַיָּרִיבוּ
  choice: 争吵
  rationale: ריב表示争论、争执；“争吵”自然地表达双方因水井归属而起的冲突。
- source_word: רֹעֵי גְרָר
  choice: 基拉耳的牧人
  rationale: רֹעִים指照管羊群或牲畜的人；“牧人”简洁、常用，也符合族长叙事的语境。
- source_word: עִם רֹעֵי יִצְחָק
  choice: 同以撒的牧人
  rationale: 保留双方牧人的平行关系，并采用自然的现代汉语表达。
- source_word: לֵאמֹר לָנוּ הַמָּיִם
  choice: 说：“这水是我们的！”
  rationale: 希伯来语直译为“水归我们”，这里明确表达对水源所有权的主张；“这水是我们的”自然有力。
- source_word: וַיִּקְרָא שֵׁם הַבְּאֵר
  choice: 以撒就给那口井起名叫
  rationale: 将“称那井的名”这一希伯来语习语译成自然汉语；按叙事语境补明主语“以撒”。
- source_word: עֵשֶׂק
  choice: 埃色
  rationale: 作为井名采用音译，并用脚注说明它与表示争执、争夺的希伯来语词同源。
- source_word: כִּי הִתְעַשְּׂקוּ עִמּוֹ
  choice: 因为他们曾与他争执
  rationale: התעשקו与井名עֵשֶׂק同源，表示争执或争夺；“他”保留原文单数指代，按上下文指以撒，不擅自补入原文没有明说的宾语。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“却”凸显前文挖得水井之后随即发生的冲突；感叹号体现牧人强硬的归属主张。正文保留末句“与他争执”的简约和指代，不把“他”改释为“他们”，也不额外补明争夺对象。
