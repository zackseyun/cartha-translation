  text: And the man became great[a], and he continued to grow greater until he became very great.
translation:
  language: zh_hans
  text: 这人强大起来，并且越来越强大[a]，直到变得极其强大。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“并不断壮大”。希伯来语以“行走”的有限动词、同词根的不定式绝对形和“增长”的分词连用，表达持续而递进的增长。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְדַּל
  choice: 日渐强盛
  rationale: גדל表示变大、壮大或地位提升；结合本节及上文的产业背景，“强盛”既能包含兴旺发达之意，又不把词义限缩为单纯富有。“日渐”体现变化过程。
- source_word: הָאִישׁ
  choice: 这人
  rationale: איש在此指以撒。“这人”准确保留阳性单数所指，并承接上下文，比重复姓名更贴近原文表达。
- source_word: וַיֵּלֶךְ הָלוֹךְ וְגָדֵל
  choice: 并且越来越强盛
  rationale: 有限动词、同词根不定式绝对形与分词的组合表达持续推进的过程。现代汉语以“越来越”自然传达不断增长，同时保留גדל与前后分句的词义呼应。
- source_word: עַד כִּי
  choice: 直到
  rationale: 该短语引出持续增长所达到的顶点；“直到”简洁表达这一进程及其终点，不额外规定因果关系。
- source_word: גָדַל מְאֹד
  choice: 极其强盛
  rationale: מאד强化גדל。“极其强盛”保留全节反复使用同一词根所形成的递进与强调，也避免仅解释为财富增加。
