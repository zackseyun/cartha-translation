  yaml_path: translation/ot/genesis/026/015.yaml
  text: All the wells that his father's servants had dug in the days of Abraham his father[c][b][a], the Philistines stopped up and filled them with earth.
translation:
  language: zh_hans
  text: 他父亲亚伯拉罕在世时，他父亲的仆人所挖的井，非利士人全都堵住，并用土填满了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכָל הַבְּאֵרֹת
  choice: 井……全都
  rationale: כָל 表示全部；וְ承接上文，在中文中无需机械译为“并且”。将“全都”置于主句谓语前，更符合现代汉语表达。
- source_word: אֲשֶׁר חָפְרוּ
  choice: 所挖的
  rationale: 以“所……的”构成自然、庄重的关系从句，并体现挖井发生在非利士人堵井之前。
- source_word: עַבְדֵי אָבִיו
  choice: 他父亲的仆人
  rationale: עֶבֶד 可指仆人或奴隶；本处未着重其受奴役身份，因此正文采用较中性的“仆人”，并以脚注保留另一可能。
- source_word: בִּימֵי אַבְרָהָם אָבִיו
  choice: 亚伯拉罕在世时
  rationale: “在……的日子”在这里表示亚伯拉罕生前的时期；“在世时”是自然现代汉语，同时保留时间范围。后文“他父亲”已明确亚伯拉罕与以撒的关系，避免中文中生硬重复“他父亲亚伯拉罕的日子”。
- source_word: סִתְּמוּם
  choice: 把……堵塞了
  rationale: 该动词表示将井堵住；“堵塞”准确而适合叙事文体。
- source_word: פְּלִשְׁתִּים
  choice: 非利士人
  rationale: 采用该族名的通行中文译法。
- source_word: וַיְמַלְאוּם עָפָר
  choice: 用土填满
  rationale: 两个动词上的宾语后缀均指这些井；中文前句已明示对象，后句自然省略重复宾语。עָפָר 在此指土、泥土或尘土，用“土”最符合填井语境。
