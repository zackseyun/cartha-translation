base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/007.yaml
  text: When the men of the place asked about his wife[a], he said, “She is my sister,” because he was afraid to say, “She is my wife,” lest the men of the place kill me because of Rebekah, because she was beautiful in appearance.
translation:
  language: zh_hans
  text: 当地的男子问起他的妻子，他说：“她是我的姊妹[a]。”因为他不敢说“她是我的妻子”，惟恐当地的男子因利百加而杀他，因为她容貌美丽。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “姊妹”原文指女性同胞，未说明她比说话者年长或年幼。
    reason: 希伯来语亲属称谓不区分姐姐和妹妹；脚注保留原文的长幼歧义。
lexical_decisions:
- source_word: וַיִּשְׁאֲלוּ אַנְשֵׁי הַמָּקוֹם לְאִשְׁתּוֹ
  choice: 当地人问起他的妻子
  rationale: שׁאל与介词ל在此表示询问的对象或话题；“问起”符合现代汉语习惯。“当地人”在语境中自然指当地男子，避免“那地方的人”过于生硬。
- source_word: אֲחֹתִי הִוא
  choice: 她是我的妹妹
  rationale: 按现代汉语直述身份；希伯来语אָחוֹת只表示女性同胞，不标明长幼，因此加注说明汉语用词所不可避免的具体化。
- source_word: כִּי יָרֵא לֵאמֹר אִשְׁתִּי
  choice: 因为他不敢说“她是我的妻子”
  rationale: יָרֵא在此表示因害怕而不敢承认；补出汉语所需的主谓结构，同时保留话语内容。
- source_word: פֶּן יַהַרְגֻנִי אַנְשֵׁי הַמָּקוֹם עַל רִבְקָה
  choice: 惟恐当地人因利百加而杀他
  rationale: פֶּן引出所惧怕的后果；“惟恐”准确且庄重。希伯来语在内心引语中用第一人称“杀我”，汉语改用间接叙述“杀他”以衔接前句而不改变所指。
- source_word: כִּי טוֹבַת מַרְאֶה הִיא
  choice: 原来利百加容貌美丽
  rationale: טוֹבַת מַרְאֶה指外貌美好；“容貌美丽”自然而准确。末句כִּי说明以撒惧怕的缘由，用“原来”清楚表达因果关系。
