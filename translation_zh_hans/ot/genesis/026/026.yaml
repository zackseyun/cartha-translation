  yaml_path: translation/ot/genesis/026/026.yaml
  text: Then Abimelech went to him from Gerar[a], with Ahuzzath his friend and Phicol the commander of his army.
translation:
  language: zh_hans
  text: 后来，亚比米勒从基拉耳来到他那里，随行的有他的同伴亚户撒[a]和他的军队统帅非各。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “同伴”或译“朋友”，也可能指宫廷中的随从或顾问。
    reason: 希伯来语 מֵרֵעֵהוּ 可表示私人朋友、同伴或具有宫廷身份的亲近人员，具体角色并不明确。
lexical_decisions:
- source_word: וַאֲבִימֶלֶךְ
  choice: 后来，亚比米勒
  rationale: 叙事性前缀 וַ 推进情节；译作“后来”符合现代汉语叙事习惯。专名采用通行译名“亚比米勒”。
- source_word: הָלַךְ אֵלָיו מִגְּרָר
  choice: 从基拉耳到他那里去
  rationale: 保留 הלך 的移动意义及 אֵלָיו 的代词表达，不将“他”明说为以撒；מִן 表示出发地“从”。
- source_word: וַאֲחֻזַּת מֵרֵעֵהוּ
  choice: 他的同伴亚户撒
  rationale: מֵרֵעֵהוּ 可指朋友、同伴，也可能是宫廷中的随从或顾问。“同伴”既自然，又避免把未确定的私人友情或官职写死。
- source_word: וּפִיכֹל שַׂר צְבָאוֹ
  choice: 军队统帅非各
  rationale: שַׂר 在军事语境中译为“统帅”，צְבָאוֹ 为“他的军队”；汉语中将头衔置于专名前更自然。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“与他同去的有……”清楚表达两人陪同亚比米勒前往，同时保留原文对亚户撒身份的含混性。
