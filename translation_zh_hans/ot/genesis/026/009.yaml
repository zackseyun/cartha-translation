review_pass:
  verdict: revise
  source_fidelity: 整体忠实呈现叙事、强调性陈述、责问以及以撒对可能死亡的忧惧。“恐怕我会因她而死”准确保留了 פֶּן 和 עָלֶיהָ 的简略因果表达，且脚注恰当地说明上下文所暗示的“被人杀死”，没有把该施事者写入正文。惟“妹妹”在现代汉语中明确加入了利百加年龄较小的信息；希伯来语 אֲחֹתִי 仅称其为“姐妹/姊妹”，并未表达长幼。
  naturalness: 文字庄重通顺。“看哪，她明明是……”虽带经文语体，仍可理解，并能较好传达 אַךְ הִנֵּה 的强调和提示作用。“你怎么还说……呢”自然体现责问语气。将“妹妹”改为“姊妹”后，语义更准确；“姊妹”在此保留经文叙事所需的非长幼限定。
  terminology: 人名“亚比米勒”“以撒”规范。“妻子”“姊妹”“因她而死”等关键称谓和表达适切。应避免以“妹妹”替代不标示年龄的 אחות。
  issues:
  - severity: medium
    issue: “她是我的妹妹”将 אֲחֹתִי 无依据地限定为较年轻的女性同胞。
    rationale: אחות 的基本义为“姐妹/姊妹”，本节本身不说明利百加相对于以撒的年龄。现代汉语“妹妹”通常明确表示较年轻，因而改变了原文未定的信息。应改作“姊妹”。
