base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/009.yaml
  text: So Abimelech called Isaac and said[a], “Surely, she is your wife! So how could you say, ‘She is my sister’?” And Isaac said to him, “Because I said[c][b], ‘Lest I die because of her.’”
translation:
  language: zh_hans
  text: 亚比米勒就召以撒来，对他说：“看哪，她明明是你的妻子！你怎么还说‘她是我的姊妹’呢？”以撒回答他：“因为我心想：‘恐怕我会因她而死。’”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “因她而死”意思是：因她的缘故被人杀死。
    reason: 说明原文简略表达在上下文中的含义，同时不把隐含的施害者加入正文。
lexical_decisions:
- source_word: וַיִּקְרָא ... לְיִצְחָק
  choice: 召以撒来
  rationale: קרא 与 לְ 加人名在此表示叫来或召来；“召……来”既保留语义，也符合君王命人前来的叙事场景。
- source_word: אַךְ הִנֵּה
  choice: 看哪，她明明是
  rationale: הִנֵּה 用“看哪”保留引人注意的语气，אַךְ 用“明明”表达确认事实的强调，避免把陈述误译成疑问。
- source_word: וְאֵיךְ אָמַרְתָּ
  choice: 你怎么还说……呢
  rationale: וְאֵיךְ 引出带责问和难以置信语气的问题；“怎么还说……呢”在现代汉语中自然传达这种语气。
- source_word: אֲחֹתִי הִוא
  choice: 她是我的妹妹
  rationale: אחות 的基本义是姐妹；按中文亲属称谓及本叙事人物关系译作“妹妹”，不泛化为女性亲属。
- source_word: כִּי אָמַרְתִּי
  choice: 因为我心想
  rationale: אמר 在这里指以撒先前内心的盘算，而不是对亚比米勒说过的话；“心想”自然呈现这一语境。
- source_word: פֶּן אָמוּת
  choice: 恐怕我会……死
  rationale: פֶּן 表示对可能后果的忧惧；“恐怕……会”准确表达希伯来语未完成式在此所指的潜在结果。
- source_word: עָלֶיהָ
  choice: 因她
  rationale: עַל 在此表示缘由或起因；“因她”简洁保留原文，并不在正文中明说谁会杀以撒。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“看哪”略带经文语体，用来保留 הִנֵּה 的指示和惊觉作用；与口语自然的“明明”“怎么还说”配合，避免整体显得古奥。
