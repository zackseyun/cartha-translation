review_pass:
  verdict: approve
  source_fidelity: 正文准确传达三重应许：上帝使以撒的后裔增多，如天上的星；将所有这些土地赐给后裔；地上万国因/藉此后裔蒙福。“后裔”恰当地保留 זֶרַע 的集合单数性质；“这一切土地”对应 כָּל הָאֲרָצֹת הָאֵל；“地上万国”对应 כֹּל גּוֹיֵי הָאָרֶץ。末句的“因你的后裔蒙福”在汉语中可保留 בְ 的关联、缘由和媒介性，未不当限定其机制。
  naturalness: 译文为自然、庄重且清晰的现代标准汉语。“我要使你的后裔多如天上的星”流畅，且与土地和万国祝福的后续应许形成适当递进。分号用于连接末项应许也合乎汉语书面表达。
  terminology: “后裔”“赐给”“蒙福”“万国”在此类应许语境中一致、准确且不过分仿古。脚注以“为自己求福”说明反身理解，能够使读者得知该动词的另一可行分析，而正文未把争议性语法判断当作唯一含义。脚注标记紧随相关祝福分句，锚点正确。
