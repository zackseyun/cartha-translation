  text: וְ/הִרְבֵּיתִ֤י אֶֽת זַרְעֲ/ךָ֙ כְּ/כוֹכְבֵ֣י הַ/שָּׁמַ֔יִם וְ/נָתַתִּ֣י לְ/זַרְעֲ/ךָ֔ אֵ֥ת כָּל הָ/אֲרָצֹ֖ת הָ/אֵ֑ל וְ/הִתְבָּרֲכ֣וּ בְ/זַרְעֲ/ךָ֔ כֹּ֖ל גּוֹיֵ֥י הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/004.yaml
  text: And I will multiply your offspring like the stars of the heavens[a], and I will give to your offspring all these lands, and in your offspring all the nations of the earth will be blessed.
translation:
  language: zh_hans
  text: 我要使你的后裔多如天上的星，并把这一切土地赐给你的后裔；地上万国都必因你的后裔蒙福。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“地上万国都要以你的后裔为自己求福。”希伯来语动词也可作反身理解；不过在盟约应许的语境中，译作“蒙福”也很合适。
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִרְבֵּיתִי
  choice: 我要使……多
  rationale: 该词是 רבה 的使役形，表示使数量增多；“使……多”自然保留了上帝主动成就应许的含义。
- source_word: זַרְעֲךָ
  choice: 你的后裔
  rationale: זֶרַע 是集合单数，可指一人的后代整体；“后裔”在现代汉语中庄重自然，也不强行限定为单数或复数。
- source_word: כְּכוֹכְבֵי הַשָּׁמַיִם
  choice: 如天上的星
  rationale: 保留 כ 的明喻关系；“天上的星”符合现代汉语习惯，并维持应许语境的庄重感。
- source_word: וְנָתַתִּי
  choice: 并把……赐给
  rationale: נתן 基本义为“给”；在上帝赐予土地的应许中，“赐给”自然且庄重。
- source_word: כָּל הָאֲרָצֹת הָאֵל
  choice: 这一切土地
  rationale: אֲרָצוֹת 在此指所应许的多片地域，הָאֵל 是指示语；“这一切土地”准确表达地域应许。
- source_word: וְהִתְבָּרֲכוּ
  choice: 都必……蒙福
  rationale: 该 Hitpael 形式在族长应许公式中可作被动理解；“蒙福”简洁表达接受福分，同时将反身解读保留在脚注。
- source_word: בְזַרְעֲךָ
  choice: 因你的后裔
  rationale: 介词 ב 在此可表达关联、凭借或媒介；“因”在现代汉语中自然，又不把具体作用方式解释得过细。
- source_word: כֹּל גּוֹיֵי הָאָרֶץ
  choice: 地上万国
  rationale: גּוֹיִם 指各民族或列国；“地上万国”是简洁、庄重且通顺的对应表达。
theological_decisions:
- issue: וְהִתְבָּרֲכוּ בְזַרְעֲךָ 的祝福公式如何理解
  choice: 地上万国都必因你的后裔蒙福
  alternative: 地上万国都要以你的后裔为自己求福
  rationale: 族长应许的上下文支持被动含义，即万国领受福分；但 Hitpael 形式也可作反身理解，因此正文采用语境较适切的被动读法，并以脚注保存另一种可能。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“后裔”保留原文集合单数的开放性；句式维持三项应许的递进结构。脚注标记置于相关分句之后。
