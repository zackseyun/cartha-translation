  text: וַ/יִּ֧בֶן שָׁ֣ם מִזְבֵּ֗חַ וַ/יִּקְרָא֙ בְּ/שֵׁ֣ם יְהוָ֔ה וַ/יֶּט שָׁ֖ם אָהֳל֑/וֹ וַ/יִּכְרוּ שָׁ֥ם עַבְדֵי יִצְחָ֖ק בְּאֵֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/025.yaml
  text: So he built an altar there and called on the name of Yahweh[a], and he pitched his tent there[b]. And Isaac’s servants dug a well there.
translation:
  language: zh_hans
  text: 他就在那里筑了一座坛，求告雅威的名[a]，又在那里支搭帐篷。以撒的仆人也在那里挖了一口井。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“宣告雅威的名。”这个希伯来语习语既可指求告，也可指宣告；本节筑坛的语境较支持“求告”。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּבֶן שָׁם מִזְבֵּחַ
  choice: 在那里筑了一座坛
  rationale: “筑坛”是现代汉语圣经叙事中自然、庄重的表达；保留“在那里”，体现原文对地点的反复强调。
- source_word: וַיִּקְרָא בְּשֵׁם יְהוָה
  choice: 求告雅威的名
  rationale: 祭坛语境更支持向神呼求、敬拜的含义；“求告……的名”既贴近希伯来语习语，也保留可能含有宣告之意的张力。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以常见的现代汉语音译呈现四字神名，避免用称号替代原文专名。
- source_word: וַיֶּט שָׁם אָהֳלוֹ
  choice: 又在那里支搭帐篷
  rationale: נטה与“帐篷”连用时指支搭帐篷；汉语可依上下文省略“他的”，而所指仍明确为以撒的帐篷。
- source_word: עַבְדֵי יִצְחָק
  choice: 以撒的仆人
  rationale: 此处指为以撒劳作的家内人员，原文未突出其法律身份；“仆人”比“奴隶”更符合该叙事情境，同时不作过度限定。
- source_word: וַיִּכְרוּ שָׁם בְּאֵר
  choice: 也在那里挖了一口井
  rationale: “挖井”准确自然；量词“一口”符合现代汉语习惯，并保留地点副词“在那里”。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用神的专名；音译“雅威”保留专名性质，不以称号取代，也不采用较晚形成的混合读音。
- issue: וַיִּקְרָא בְּשֵׁם יְהוָה 的语义
  choice: 求告雅威的名
  alternative: 宣告雅威的名
  rationale: 该习语可指呼求，也可能指宣告；本节筑坛的敬拜语境较支持“求告”，但以脚注保留另一种真实可能。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。保留三次“在那里”所形成的地点强调；用“又”“也”自然呈现连续动作，避免生硬照搬希伯来语连接词。
