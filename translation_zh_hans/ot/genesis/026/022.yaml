revisions:
- from: 他从那里迁走，又挖了一口井；人们没有为这井争吵。于是，他给这井起名叫“利河伯”[a]，说：“因为如今雅威为我们开了宽广之地，我们必在这地繁衍。”
  to: 他从那里迁到别处，又挖了一口井；没有人为这口井争吵。于是他给这井起名叫“利河伯”[a]，说：“因为如今雅威已为我们腾出了地方，我们必在这地繁衍。”
  rationale: 修订使“使宽阔／给空间”的希伯来语意象在现代标准汉语中更准确自然，并以脚注保留利河伯与“宽阔空间”的词语关联。其余叙事内容、神名译法、土地语境与“繁衍”的祝福性用语均予保留。
