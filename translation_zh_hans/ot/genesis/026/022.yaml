base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/022.yaml
  text: He moved from there and dug another well[a], and they did not quarrel over it. So he called its name Rehoboth, and said, “For now Yahweh has made room for us, and we will be fruitful in the land.”
translation:
  language: zh_hans
  text: 他从那里迁到别处，又挖了一口井；没有人为这口井争吵。于是他给这井起名叫“利河伯”[a]，说：“因为如今雅威已为我们腾出了地方，我们必在这地繁衍。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “利河伯”与希伯来语“宽阔处”或“宽广空间”相关；以撒所说“雅威已为我们腾出了地方”与这地名形成文字呼应。
    reason: 说明希伯来语地名与随后的“腾出地方／使宽阔”之间的文字呼应；该呼应无法仅从中文音译中完整看出。
lexical_decisions:
- source_word: וַיַּעְתֵּק מִשָּׁם
  choice: 他从那里迁走
  rationale: עתק在此指以撒离开原处、转往别处；“迁走”自然地表达了地点转移，又不额外说明搬迁方式。
- source_word: בְּאֵר אַחֶרֶת
  choice: 又挖了一口井
  rationale: אַחֶרֶת表示另一口井；结合连续叙事，用“又挖了一口井”符合现代汉语表达。
- source_word: וְלֹא רָבוּ עָלֶיהָ
  choice: 人们没有为这井争吵
  rationale: ריב表示争执、争吵；希伯来文主语未明说，中文以泛指的“人们”承接上下文，避免误将具体群体写死。
- source_word: וַיִּקְרָא שְׁמָהּ רְחֹבוֹת
  choice: 他给这井起名叫“利河伯”
  rationale: 保留希伯来文的命名动作，同时采用自然现代汉语；“利河伯”为专名音译。
- source_word: כִּי עַתָּה הִרְחִיב יְהוָה לָנוּ
  choice: 因为如今雅威为我们开了宽广之地
  rationale: הרחיב的核心意象是使宽阔、给出空间；“开了宽广之地”既通顺，也保留与“利河伯”之间的词义呼应。כי译作“因为”，保留以撒为命名所作的解释。
- source_word: יְהוָה
  choice: 雅威
  rationale: 直接音译四字神名，以区别于称号“主”，并保留原文使用神圣专名的特点。
- source_word: וּפָרִינוּ בָאָרֶץ
  choice: 我们必在这地繁衍
  rationale: פרה指生养、繁衍、增多；“繁衍”保留其生命增长及创世记祝福语境的意味。“这地”依上下文指以撒寄居之地。
theological_decisions:
- issue: 四字神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华／上主
  rationale: 原文使用神的专名，而非一般称号；“雅威”较直接地反映学界通常采用的发音重构，也避免把专名改作称号。
- issue: וּפָרִינוּ所表达的增长
  choice: 繁衍
  alternative: 昌盛／兴旺
  rationale: “繁衍”紧扣פרה的生养增多义，并保留可能与创世记赐福语言的呼应；不把它单独解释为经济上的兴旺。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。以分号和短句呈现希伯来文连续动作；专名用“利河伯”，神名用“雅威”。脚注标记紧随相关地名。
