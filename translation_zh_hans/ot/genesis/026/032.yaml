base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/032.yaml
  text: And it happened on that day that Isaac’s servants came and told him about the well that they had dug[a], and they said to him[b], “We have found water.”
translation:
  language: zh_hans
  text: 就在那一天[a]，以撒的仆人[b]来，把他们所挖的那口井的事告诉他，又对他说：“我们找到水了。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“同一天”，强调仆人前来报告，正是在前文立约事件发生的那一天。
    reason: lexical_alternative
  - marker: b
    text: “仆人”也可译作“奴隶”；希伯来语这个词可指隶属于家主的劳役者，但本节的语境并未着重其社会身份。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַּיּוֹם הַהוּא
  choice: 就在那一天
  rationale: וַיְהִי是希伯来叙事中承接事件的常用形式；与时间短语合译为“就在那一天”，既自然地推进叙事，也保留הַהוּא所指的特定日子及其与前文事件的紧密联系。
- source_word: וַיָּבֹאוּ
  choice: 来
  rationale: בוא在此表示来到以撒那里；“来”简洁、自然，并符合叙事视角。
- source_word: עַבְדֵי יִצְחָק
  choice: 以撒的仆人
  rationale: עֶבֶד可指仆人或奴隶；此处着重他们替以撒挖井并前来报告的身份和职责，译作“仆人”较符合现代汉语语境，同时以脚注保留其社会身份可能包含的另一层含义。
- source_word: וַיַּגִּדוּ לוֹ
  choice: 告诉他
  rationale: נגד的使役词干在此意为告知或报告；“告诉他”准确而通顺。
- source_word: עַל אֹדוֹת הַבְּאֵר
  choice: 把……那口井的事
  rationale: עַל אֹדוֹת表示“关于、有关”；采用“把那口井的事告诉他”的汉语句式，清楚自然。
- source_word: אֲשֶׁר חָפָרוּ
  choice: 他们所挖的
  rationale: 关系从句限定“井”；“所挖的”明确表达挖井发生在报告之前，无须另加原文没有的时间说明。
- source_word: וַיֹּאמְרוּ לוֹ
  choice: 又对他说
  rationale: 保留原文在“告诉他”之后再次出现的引语引介，不将其省略；“又”自然承接前一动作。
- source_word: מָצָאנוּ מָיִם
  choice: 我们找到水了
  rationale: מצאנו表示已经发现，מים泛指水；句末“了”突出刚刚获得且当前相关的结果，不额外限定水量。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“就在那一天”承接前文，“又对他说”保留希伯来文重复引介直接引语的结构。脚注标记均置于所解释的词语之后。
