- source_word: יִצְחָק
  choice: 以撒
  rationale: 采用现代中文圣经中通行的人名音译。
- source_word: בִּגְרָר
  choice: 在基拉耳
  rationale: 介词בִּ表示地点，译作“在”；地名גְרָר采用通行音译“基拉耳”。
- source_word: וַ
  choice: 于是
  rationale: 前缀וַ在此承接并推进叙事；“于是”自然表达本节是以撒对上文吩咐的回应。
