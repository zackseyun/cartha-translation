base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/024.yaml
  text: And Yahweh appeared to him that night and said[a], “I am the God of Abraham your father. Do not fear, for I am with you[b], and I will bless you and multiply your offspring for the sake of Abraham my servant.”
translation:
  language: zh_hans
  text: 那一夜，耶和华向他显现，说：“我是你父亲亚伯拉罕的上帝。不要害怕，因为我与你同在；我必赐福给你，使你的后裔增多；这是为了我仆人亚伯拉罕的缘故。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的专名“耶和华”译出四字神名，不以“主”这一称号替代。
- source_word: וַיֵּרָא אֵלָיו
  choice: 向他显现
  rationale: ראה 的尼法勒式在此表示神可感知的显现；“向他显现”自然且保留神显的直接性。
- source_word: בַּלַּיְלָה הַהוּא
  choice: 那一夜
  rationale: 保留指示词的回指作用，同时符合庄重自然的现代汉语表达。
- source_word: אָנֹכִי אֱלֹהֵי אַבְרָהָם אָבִיךָ
  choice: 我是你父亲亚伯拉罕的上帝
  rationale: 用自然汉语表达亚伯拉罕与以撒的父子关系，并保留上帝以亚伯拉罕之上帝的身份自我启示。
- source_word: אַל תִּירָא
  choice: 不要害怕
  rationale: 准确表达否定命令，在现代汉语中比“不要惧怕”更日常而不失庄重。
- source_word: כִּי אִתְּךָ אָנֹכִי
  choice: 因为我与你同在
  rationale: כִּי 在此说明不必害怕的理由；“与你同在”保留原文简洁而富神学张力的应许。
- source_word: וּבֵרַכְתִּיךָ
  choice: 我必赐福给你
  rationale: 在应许语境中译出将来和确定意味；“赐福”符合自然的圣经汉语。
- source_word: וְהִרְבֵּיתִי אֶת זַרְעֲךָ
  choice: 使你的后裔增多
  rationale: 译出 רבה 的使动意义，并以“后裔”表达 זֶרַע 的集合意义，避免现代汉语中“种子”的误解。
- source_word: בַּעֲבוּר
  choice: 为了
  rationale: 保留该介词所表达的缘故或受益关联，不额外说明其具体契约机制。
- source_word: עַבְדִּי
  choice: 我的仆人
  rationale: 此处指亚伯拉罕与上帝的归属和受命关系，“仆人”比社会身份色彩更强的“奴隶”更合语境。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用神的专名。中文稿保留专名而不以“主”替代；采用现代中文圣经传统中最广为人知的“耶和华”。
- issue: בַּעֲבוּר אַבְרָהָם עַבְדִּי 所表达的应许根据
  choice: 为了我的仆人亚伯拉罕
  alternative: 因我的仆人亚伯拉罕的缘故
  rationale: 保持原文将赐福与亚伯拉罕相联系的表述，不擅自将其限定为亚伯拉罕的功德、行为或其他具体神学解释。
translation_notes:
  register: 采用现代、庄重而通顺的简体中文。“那一夜”承接叙事；神谕部分保持简洁有力。未设置脚注，因为本节的主要词义可在正文中清楚呈现，且英文所列脚注标记与其实际附注内容似有错位。
