- from: 那一夜，耶和华向他显现，说：“我是你父亲亚伯拉罕的上帝。不要害怕，因为我与你同在；我必赐福给你，使你的后裔增多，为了我的仆人亚伯拉罕。”
  to: 那一夜，耶和华向他显现，说：“我是你父亲亚伯拉罕的上帝。不要害怕，因为我与你同在；我必赐福给你，使你的后裔增多；这是为了我仆人亚伯拉罕的缘故。”
  rationale: 仅修订末句，以完整、自然的中文表达בַּעֲבוּר אַבְרָהָם עַבְדִּי对前述应许所构成的根据。“这是为了……的缘故”保留“for the sake of”的宽泛因由含义，不将其解释为亚伯拉罕的功德或任何特定契约机制。
