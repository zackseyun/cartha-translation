source:
  edition: WLC
  text: וַ/יֹּאמְר֗וּ רָא֣וֹ רָאִינוּ֮ כִּֽי הָיָ֣ה יְהוָ֣ה עִמָּ/ךְ֒ וַ/נֹּ֗אמֶר תְּהִ֨י נָ֥א אָלָ֛ה בֵּינוֹתֵ֖י/נוּ בֵּינֵ֣י/נוּ וּ/בֵינֶ֑/ךָ וְ/נִכְרְתָ֥ה בְרִ֖ית עִמָּֽ/ךְ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/028.yaml
  text: And they said[a], “We have clearly seen that Yahweh has been with you. So we said, ‘Please let there be an oath between us, between you and us[b], and let us make a covenant with you.’”
translation:
  language: zh_hans
  text: 他们说：“我们确实看出雅威与你同在。因此我们说：‘请让我们双方——就是我们和你之间[b]——立下誓言[a]，并让我们与你立约。’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “誓言”所译的希伯来语也可指“咒誓”，即起誓时以违誓所招致的咒诅作为约束。
    reason: lexical_alternative
  - marker: b
    text: 原文略显重复，直译为“在我们之间，在我们和你之间”。
    reason: source_texture
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: 他们说
  rationale: 承接叙事而不额外强化时间先后；现代汉语中省去句首“于是/然后”更自然。
- source_word: רָאוֹ רָאִינוּ
  choice: 我们确实看出
  rationale: 以“确实”表达不定式绝对形与限定动词连用所产生的强调；“看出”也符合说话人从以撒的境况得出判断的语境。
- source_word: כִּי הָיָה יְהוָה עִמָּךְ
  choice: 雅威与你同在
  rationale: 中文“同在”可以自然涵盖此前已经显明、如今仍具现实意义的状态，不强行限定为纯过去或纯现在。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文直接音译四字神名，保留其专名性质，不以称号替代。
- source_word: וַנֹּאמֶר
  choice: 因此我们说
  rationale: “因此”表达前面的观察与后面提议之间的推论关系，同时保留“说”的直陈形式。
- source_word: תְּהִי נָא
  choice: 请让……有
  rationale: “请”体现 נָא 所带的恳请、礼貌语气，并以自然汉语表达祈愿式。
- source_word: אָלָה
  choice: 誓约
  rationale: 在缔约语境中，“誓约”既清楚表达正式起誓，也比单用“誓言”更能体现双方约束；其可能包含违誓招致咒诅的含义收入脚注。
- source_word: בֵּינוֹתֵינוּ בֵּינֵינוּ וּבֵינֶךָ
  choice: 我们之间，就是我们和你之间
  rationale: 保留原文略显重复的正式强调，并用“就是”使汉语关系清晰自然。
- source_word: וְנִכְרְתָה בְרִית
  choice: 让我们……立约
  rationale: “立约”是自然、庄重的汉语对应，传达希伯来语字面为“切约”的固定习语，而不生硬直译。
- source_word: עִמָּךְ
  choice: 与你
  rationale: 准确保留对以撒的第二人称单数指称。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文使用神的四字专名；译作“雅威”直接保留专名，不用称号替代，也不把后期传统读法写入正文。
- issue: אָלָה 是否明确译为带咒诅的誓言
  choice: 正文作“誓约”，脚注说明可能的咒诅意味
  alternative: 咒誓
  rationale: 该词可指以违约后果或自我咒诅作保证的誓言，但本节并未明说咒诅内容；正文保留较宽泛的意义，脚注呈现真实的词义张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留原文正式缔约语境中的重复强调，以“就是”衔接，避免生硬；引语层次按原文呈现。
