base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/016.yaml
  text: Then Abimelech said to Isaac[a], “Go away from us, because you have become much stronger than we are.”
translation:
  language: zh_hans
  text: 亚比米勒对以撒说：“你离开我们吧，因为你已经比我们强盛多了[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为你已经远比我们强大。”
    reason: 词义与表达的可选译法；עָצַם可译为“强盛”或“强大”，מְאֹד可用“多了”或“远”体现其加强作用。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 叙事中的连续式推动情节；现代汉语通常不必机械译出“于是”，上下文已清楚表达先后关系。
- source_word: אֲבִימֶלֶךְ
  choice: 亚比米勒
  rationale: 采用现代中文圣经人名的通行音译。
- source_word: אֶל יִצְחָק
  choice: 对以撒
  rationale: 自然表达说话的对象。
- source_word: לֵךְ מֵעִמָּנוּ
  choice: 你离开我们吧
  rationale: לֵךְ是命令式，结合מֵעִמָּנוּ表示离开他们所在之处或群体；“吧”使中文命令自然，但不削弱逐客之意。
- source_word: כִּי
  choice: 因为
  rationale: 引出亚比米勒要求以撒离开的原因；“因为”清楚、现代，也不附加原文没有的文体色彩。
- source_word: עָצַמְתָּ
  choice: 你已经……强盛
  rationale: 该动词表示变得强大、强盛；完成体在这里表达已经形成的状态。“强盛”可涵盖以撒在财富、人口和势力方面的增长。
- source_word: מִמֶּנּוּ מְאֹד
  choice: 比我们……多了
  rationale: מִן在此构成比较，מְאֹד强化差距；“比我们强盛多了”是自然中文，并保留显著超过的意思。
