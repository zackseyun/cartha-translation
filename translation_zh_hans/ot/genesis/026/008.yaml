base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/008.yaml
  text: And it happened[a], when he had been there a long time, that Abimelech king of the Philistines looked out through the window and saw, and behold, Isaac was laughing with Rebekah his wife.
translation:
  language: zh_hans
  text: 他在那里住了很久以后，非利士人的王亚比米勒从窗户向外望去，只见以撒正和他的妻子利百加亲昵嬉戏。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “亲昵嬉戏”也可译作“同她嬉笑”“同她玩闹”或“爱抚她”。这里的希伯来语动词与“以撒”这个名字相关，可表示嬉戏或亲密举动；在本节中，这一行为显露了利百加是他的妻子。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּי
  choice: ……以后，有一天
  rationale: וַיְהִי推进叙事并引出新的情节，כִּי在此引入时间背景；合译为现代汉语自然的叙事衔接。
- source_word: אָרְכוּ לוֹ שָׁם הַיָּמִים
  choice: 他在那里住了很久
  rationale: 这是表示逗留日久的希伯来语习惯表达，不逐字译作“日子延长”，以免中文生硬。
- source_word: וַיַּשְׁקֵף
  choice: 从窗户往外看
  rationale: 该动词表示从某个有利位置向外或向下观看；结合窗户，译作“往外看”自然准确。
- source_word: בְּעַד הַחַלּוֹן
  choice: 从窗户
  rationale: בְּעַד在此表示透过或从窗口观看；中文与“往外看”搭配，译作“从窗户”。
- source_word: וַיַּרְא וְהִנֵּה
  choice: 他一看，只见
  rationale: 既保留连续动作，也以“只见”传达הִנֵּה所带出的突然发现和现场感。
- source_word: מְצַחֵק
  choice: 亲昵嬉戏
  rationale: צחק的这一形式可指嬉笑、玩耍或亲密举动，并与“以撒”之名形成词根呼应。上下文表明这一行为显露了二人的夫妻关系；“亲昵嬉戏”保留玩笑与亲密两层含义，而不把动作说得过于具体。
- source_word: אֵת רִבְקָה אִשְׁתּוֹ
  choice: 和妻子利百加
  rationale: 原文以宾语标记引出利百加，并同位说明她是以撒的妻子；按自然中文调整为“和妻子利百加”。
theological_decisions:
- issue: 以撒的行为具体为何
  choice: 亲昵嬉戏
  alternative: 嬉笑／爱抚
  rationale: 原文故意使用语义范围较宽的מְצַחֵק；上下文只要求这一举动足以使亚比米勒识破二人的夫妻关系，不宜把它限定为某一种明确的身体动作。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“有一天”自然承担希伯来语叙事推进功能；“他一看，只见”保留现场感。脚注说明核心动词的多义性及其与以撒名字的文字关联。
