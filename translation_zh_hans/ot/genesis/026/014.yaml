base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/014.yaml
  text: He had flocks[a], herds, and a large household[b], and the Philistines envied him.
translation:
  language: zh_hans
  text: 他拥有羊群、牛群和许多仆役[a]，非利士人就嫉妒他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语直译为“大量的服役（或劳作）”，这里可能指人数众多的仆役或工人。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי לוֹ
  choice: 他拥有
  rationale: 希伯来语“有……归他”的存在句式在此表达所有关系；译为“他拥有”自然清楚，并与后列财产相衔接。
- source_word: מִקְנֵה צֹאן
  choice: 羊群
  rationale: מִקְנֶה 指牲畜产业，与 צֹאן 连用时指绵羊、山羊等小型牲畜；汉语“羊群”简洁自然。
- source_word: וּמִקְנֵה בָקָר
  choice: 牛群
  rationale: בָקָר 指牛类牲畜；“牛群”与前面的“羊群”结构对称，也保留集合意义。
- source_word: וַעֲבֻדָּה רַבָּה
  choice: 许多仆役
  rationale: 该短语字面涉及大量服役、劳作或劳动力；在牲畜产业的语境中，很可能指以仆役或工人为主体的庞大劳动力。正文采用自然具体的“许多仆役”，脚注保留词义范围。
- source_word: וַיְקַנְאוּ אֹתוֹ
  choice: 嫉妒他
  rationale: קנא 在此指因以撒兴盛而对他产生嫉妒或眼红；“嫉妒他”是现代汉语中准确自然的表达。
- source_word: פְּלִשְׁתִּים
  choice: 非利士人
  rationale: 这是该族名在现代中文圣经语境中的通行译名。
