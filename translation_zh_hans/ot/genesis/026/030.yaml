  text: And he prepared a feast for them[a], and they ate and drank.
translation:
  language: zh_hans
  text: 以撒为他们摆设筵席[a]，他们就吃了喝了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“宴席”；希伯来语这个词可指以饮酒为显著内容的宴席。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: 摆设
  rationale: עשה本义为“做、制造”；以מִשְׁתֶּה为宾语时，汉语用“摆设筵席”自然地表达筹备并提供宴饮。
- source_word: לָהֶם
  choice: 为他们
  rationale: 介词ל在此表示受益者，译作“为他们”符合上下文和现代汉语习惯。
- source_word: מִשְׁתֶּה
  choice: 筵席
  rationale: 该词指宴席，且常突出饮酒这一要素；“筵席”庄重自然，而下文“吃了喝了”已明确呈现宴饮含义。
- source_word: וַיֹּאכְלוּ
  choice: 他们就吃了
  rationale: 直接表达复数主语的进食动作；“就”承接摆设筵席之后发生的动作，使叙事自然。
- source_word: וַיִּשְׁתּוּ
  choice: 喝了
  rationale: 直接表达饮用动作，与“吃了”并列；汉语无需重复主语。
