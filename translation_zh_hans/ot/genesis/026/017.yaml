base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/017.yaml
  text: So Isaac went away from there and camped in the Valley of Gerar[a], and settled there.
translation:
  language: zh_hans
  text: 于是，以撒离开那里，在基拉耳谷[a]扎营，并在那里住了下来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“基拉耳河谷”。希伯来语这个词可指季节性河道、峡谷或谷地。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ מִשָּׁם
  choice: 离开那里
  rationale: וַיֵּלֶךְ 表示叙事中的移动，结合 מִשָּׁם 清楚表达从先前所在地离去；“离开那里”自然简洁，也符合上文语境。
- source_word: וַיִּחַן
  choice: 扎营
  rationale: חנה 常指安营、驻扎；“扎营”是现代汉语中自然明确的表达。
- source_word: בְּנַחַל גְּרָר
  choice: 在基拉耳谷
  rationale: נַחַל 可指季节性河道、溪谷或谷地。正文用通俗的“谷”，脚注保留其地貌含义的范围。
- source_word: וַיֵּשֶׁב שָׁם
  choice: 并在那里住了下来
  rationale: ישב 可表示居住、定居或停留；在“扎营”之后译作“住了下来”，自然呈现从安营到居住的叙事推进，同时不过度断言永久定居。
theological_decisions: []
