  text: Then Abimelech commanded all the people[a], saying, “Whoever touches this man or his wife shall surely be put to death.”
translation:
  language: zh_hans
  text: 亚比米勒下令全体民众说：“谁碰这人或他妻子，必被处死。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְצַו
  choice: 吩咐
  rationale: 该动词的皮埃勒式表示权威性的命令；“吩咐”在现代汉语中自然，也保留了君王下令的语气。
- source_word: כָּל הָעָם
  choice: 众民
  rationale: 这里指亚比米勒权下的全体民众；“众民”简洁庄重，不把该词误解为特定民族或国家。
- source_word: הַנֹּגֵעַ
  choice: 凡碰……的
  rationale: 带冠词的分词在此具有泛指作用，意为“任何碰……的人”。“碰”保留 נגע 的基本词义，避免擅自强化为“伤害”或“侵犯”。
- source_word: בָּאִישׁ הַזֶּה וּבְאִשְׁתּוֹ
  choice: 这人或他妻子
  rationale: 介词 ב 标示 נגע 的对象。希伯来文以 ו 连接两个受保护者，在这一禁令中汉语用“或”最自然，表示无论碰其中哪一人都受刑罚。
- source_word: מוֹת יוּמָת
  choice: 必被处死
  rationale: 不定式绝对形与使役被动式动词连用，加强刑罚的确定性；“必被处死”既表达强调，也保留这是由人执行的死刑，而非仅仅“必死”。
theological_decisions: []
translation_notes:
  register: 采用简洁、庄重而通顺的现代标准汉语。“这人”保留亚比米勒在公开命令中指称以撒的措辞；全句不额外说明“碰”是否专指暴力行为，以保留原文用词的宽度。
