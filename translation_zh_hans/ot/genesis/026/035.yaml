  text: And they were a bitterness of spirit to Isaac and Rebekah[a][b][c].
translation:
  language: zh_hans
  text: 她们成了以撒和利百加心中的苦楚。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“她们使以撒和利百加心里愁苦。”
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“灵里的苦涩／苦楚”，是指内心深切的烦恼或忧伤。
    reason: cultural_note
lexical_decisions:
- source_word: וַתִּהְיֶיןָ
  choice: 她们使……
  rationale: 该动词为阴性复数，承接上一节以扫的两个妻子。希伯来语直译为“她们是／成了”，结合后面的受影响者结构，现代汉语用“使……心里愁苦”更自然，同时保留持续状态或结果的开放性。
- source_word: מֹרַת רוּחַ
  choice: 心里愁苦
  rationale: 这一构造短语字面为“灵里的苦涩”，表示内心深受烦扰、忧伤或痛苦。“心里愁苦”保留苦楚意象，又符合现代汉语表达。
- source_word: לְיִצְחָק וּלְרִבְקָה
  choice: 以撒和利百加
  rationale: 两个 לְ 均标明受影响者；汉语在“使”字结构中直接列出二人最为自然，无须重复介词。
