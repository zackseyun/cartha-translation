  - severity: low
    issue: “去见”略具体化 אֶל 亚比米勒。
    rationale: 原文仅说以撒“往／到亚比米勒那里去”；在叙事中“去见”可通，但“到……那里去”更直接保留原文的移动表达，也避免补入会面行为。
