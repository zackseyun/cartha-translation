base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/001.yaml
  text: There was a famine in the land[a], besides the first famine that had been in the days of Abraham. So Isaac went to Abimelech king of the Philistines at Gerar.
translation:
  language: zh_hans
  text: 那地发生了饥荒；此外还有一次饥荒，就是亚伯拉罕在世时的那一次。以撒就前往基拉耳，到非利士人的王亚比米勒那里去。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “基拉耳”的希伯来文词形带有表示方向的词尾，可明确表示“往基拉耳去”。
    reason: 说明地名的希伯来文方向词尾；正文以“前往基拉耳”表达这一方向意义。
lexical_decisions:
- source_word: וַיְהִי רָעָב בָּאָרֶץ
  choice: 那地发生了饥荒
  rationale: 以自然的现代汉语引入新的叙事情境；“那地”指当地地域，“发生了饥荒”准确表达粮食严重短缺。
- source_word: מִלְּבַד הָרָעָב הָרִאשׁוֹן
  choice: 不同于……那一次饥荒
  rationale: מִלְּבַד在此把本次饥荒与亚伯拉罕时代的饥荒区分开；中文用“不同时于”避免把两者误读为同时发生。רִאשׁוֹן在叙事关系上指先前的那次，后续定语已清楚标明。
- source_word: אֲשֶׁר הָיָה בִּימֵי אַבְרָהָם
  choice: 亚伯拉罕在世时的
  rationale: “在世时”是“在……的日子”的自然中文表达，明确指亚伯拉罕生活的时代。
- source_word: וַיֵּלֶךְ יִצְחָק
  choice: 以撒就前往
  rationale: “就”承接饥荒这一叙事情境，但不把因果关系说得过强；“前往”也与末尾地名的方向词尾相呼应。
- source_word: אֶל אֲבִימֶּלֶךְ
  choice: 去见……亚比米勒
  rationale: אֶל以人物为宾语，表示以亚比米勒为前往的对象；中文补出“去见”可自然地区分人物对象与地点目的地。
- source_word: מֶלֶךְ פְּלִשְׁתִּים
  choice: 非利士人的王
  rationale: 直译该领属结构，保留其族群和政治身份。
- source_word: גְּרָרָה
  choice: 前往基拉耳
  rationale: 地名词形带方向词尾，明确表示朝基拉耳移动；将地点提前符合现代汉语语序。
theological_decisions:
- issue: פְּלִשְׁתִּים的历史族群称谓
  choice: 非利士人
  alternative: 非利士族
  rationale: 采用现代中文圣经读者熟悉的常规族名，不附加年代或神学判断。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“不同于……那一次”清楚区分两场饥荒；后句将地点置于人物对象之前，使希伯来文的双重方向信息在中文中清晰顺畅。
