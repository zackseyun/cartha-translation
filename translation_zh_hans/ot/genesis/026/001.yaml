  naturalness: “那地发生了饥荒”自然，但“不同于……那一次饥荒”在此不合原意。修订后的“此外还有……”既自然也更贴近原文。
  terminology: “饥荒”“亚伯拉罕”“以撒”“基拉耳”“非利士人”“亚比米勒”均为恰当且通行的现代中文圣经译名。“非利士人的王”准确保留原文领属结构。
