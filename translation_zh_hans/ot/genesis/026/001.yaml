revisions:
- from: 那地发生了饥荒，不同于亚伯拉罕在世时的那一次饥荒。以撒就前往基拉耳[a]，去见非利士人的王亚比米勒。
  to: 那地发生了饥荒；此外还有一次饥荒，就是亚伯拉罕在世时的那一次。以撒就前往基拉耳，到非利士人的王亚比米勒那里去。[a]
  rationale: 将“不同于”改为“此外还有……就是……”，以准确表达 מִלְּבַד 所标示的先前饥荒为本次饥荒之外的另一场饥荒。后句改为“前往基拉耳，到……亚比米勒那里去”，保留地名的方向性以及 אֶל 亚比米勒所表达的趋向，且不额外具体化为“去见”。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T04:21:35Z'
