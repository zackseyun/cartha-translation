  text: Then they dug another well[a], and they also quarreled over it, so he called its name Sitnah.
translation:
  language: zh_hans
  text: 他们又挖了一口井，也为这井争吵；他就给这井起名叫“西提拿”[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “西提拿”与希伯来语中表示敌对或反对的词有关。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחְפְּרוּ
  choice: 他们又挖
  rationale: חפר在此为复数叙事形式，通常指“挖”；“又”自然表达连续发生的下一件事。
- source_word: בְּאֵר אַחֶרֶת
  choice: 一口井
  rationale: בְּאֵר意为“井”，אַחֶרֶת意为“另一”；汉语中前面的“又”已清楚表达“另一口井”的递进关系，避免重复生硬。
- source_word: וַיָּרִיבוּ גַּם עָלֶיהָ
  choice: 也为这井争吵
  rationale: ריב表示争执、争吵；עַל在本语境中表示争执所围绕的对象，译作“为这井”，既自然又保留争夺意味；גַּם译作“也”。
- source_word: וַיִּקְרָא שְׁמָהּ
  choice: 他就给这井起名叫
  rationale: 原文直译为“他称它的名”，这里采用现代汉语常用的命名表达，同时保留单数主语“他”，不在本节中擅自补明其身份。
- source_word: שִׂטְנָה
  choice: 西提拿
  rationale: 这是井的专名，采用音译；其与“敌对、反对”有关的词义关联在脚注中说明。
