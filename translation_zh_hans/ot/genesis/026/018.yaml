revisions:
- from: 后来，以撒重新挖掘他父亲亚伯拉罕在世时所挖的水井[a]。这些井在亚伯拉罕死后被非利士人堵住了。以撒仍照他父亲给这些井所起的名字称呼它们。
  to: 以撒重新挖掘了在他父亲亚伯拉罕在世时所挖的水井[a]；非利士人在亚伯拉罕死后把这些井堵住了。以撒照他父亲给这些井所起的名字称呼它们。
  rationale: 修订仅消除汉语中可能将未明示的复数施事者指定为亚伯拉罕的句法歧义，并删去略有强化作用的“仍”；其余内容、段落层级和词汇选择均保留原译的忠实性与自然度。
