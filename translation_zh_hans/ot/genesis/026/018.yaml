base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/018.yaml
  text: Then Isaac dug again the wells of water that had been dug in the days of Abraham his father[a], which the Philistines had stopped up after Abraham's death, and he called them by the names that his father had given them.
translation:
  language: zh_hans
  text: 以撒重新挖掘了在他父亲亚伯拉罕在世时所挖的水井[a]；非利士人在亚伯拉罕死后把这些井堵住了。以撒照他父亲给这些井所起的名字称呼它们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或更直译为“以撒回来挖掘”。这里的希伯来语动词可以明确表示“回来”，但它与后一个动词连用时，很可能表示再次进行某个动作，即“重新挖掘”。
    reason: 说明וַיָּשָׁב既可按字面理解为“回来”，也可在此结构中表示动作再次发生。
lexical_decisions:
- source_word: וַיָּשָׁב וַיַּחְפֹּר
  choice: 重新挖掘
  rationale: שוב接续另一个动词时可表示动作的再次进行；结合这些旧井已被堵住的语境，“重新挖掘”自然传达恢复挖井的意思，同时保留חפר“挖掘”的基本含义。
- source_word: בְּאֵרֹת הַמַּיִם
  choice: 水井
  rationale: 现代汉语中“水井”自然、明确，已包含希伯来语“有水之井”的意思，无须生硬译作“水的井”。
- source_word: אֲשֶׁר חָפְרוּ בִּימֵי אַבְרָהָם אָבִיו
  choice: 他父亲亚伯拉罕在世时所挖的
  rationale: 原文复数动词的施事者未明确；汉语“所挖的”可自然保留这种不确定性。“在世时”准确传达“在……的日子”的时间含义。
- source_word: וַיְסַתְּמוּם
  choice: 被……堵住了
  rationale: סתם表示堵塞或封住；“堵住”适用于井，也不擅自说明使用了何种材料。
- source_word: פְּלִשְׁתִּים
  choice: 非利士人
  rationale: 采用现代中文圣经及历史语境中通行的族名译法。
- source_word: אַחֲרֵי מוֹת אַבְרָהָם
  choice: 在亚伯拉罕死后
  rationale: 直接、自然地表达原文的时间关系。
- source_word: וַיִּקְרָא לָהֶן שֵׁמוֹת כַּשֵּׁמוֹת אֲשֶׁר קָרָא לָהֶן אָבִיו
  choice: 仍照他父亲给这些井所起的名字称呼它们
  rationale: כ表示与先前名称相符；“仍照……名字称呼”既体现名称相同，也贴近קרא“称呼”的表达，避免不必要地改写为单纯“命名”。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。为避免单句过长，将希伯来语连续叙事分为三句；“后来”承接叙事，“仍照”突出以撒沿用父亲所起的井名。
