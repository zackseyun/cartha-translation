base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/025.yaml
  text: As she was being brought out[a], she sent word to her father-in-law, saying, “I am pregnant by the man to whom these belong.” And she said, “Please identify whose signet ring, cords, and staff these are.”
translation:
  language: zh_hans
  text: 她正被带出去的时候，就给她公公捎话说：“使我怀孕的那个人，是这些东西的主人。”她又说：“请辨认[a]一下，这印章、带子和手杖是谁的。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“请认一认”。原文动词既可指认出某物，也可指辨明、确认其归属；这里的话带有以物为证的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: מוּצֵאת
  choice: 正被带出去
  rationale: 这是 יצא 的使役被动分词；“正被带出去”既保留被动含义，也表达当时动作正在进行。上下文表明她正被带去受刑，但原文此处没有明说地点或刑罚方式。
- source_word: שָׁלְחָה אֶל־חָמִיהָ לֵאמֹר
  choice: 派人给她公公传话说
  rationale: שׁלח 的基本义是“派遣、送去”；结合后面的间接引语，这里自然指派人传话。“公公”准确表达 חָמִיהָ。
- source_word: לְאִישׁ אֲשֶׁר־אֵלֶּה לּוֹ אָנֹכִי הָרָה
  choice: 我怀的是这些东西主人的孩子
  rationale: 原文以领属关系指出使她怀孕的男子；汉语如此表达自然清楚，也没有额外指明该男子是谁。
- source_word: הַכֶּר־נָא
  choice: 请辨认一下
  rationale: נכר 的使役命令式可表示“认出”或“辨明、确认”；“辨认”兼顾实物识别和本段带有证据性质的语境，נָא 由“请……一下”表达。
- source_word: הַחֹתֶמֶת
  choice: 印章
  rationale: 指可代表个人身份并用于盖印的私章。原文没有明确说明它镶在戒指上，因此不译作“印戒”。
- source_word: הַפְּתִילִים
  choice: 带子
  rationale: 复数形式指细绳或系带，很可能与印章相连；“带子”在现代汉语中自然，也保留其具体形态未完全确定的余地。
- source_word: הַמַּטֶּה
  choice: 手杖
  rationale: מַטֶּה 可指杖或棍；在族长叙事及随身物品的语境中，“手杖”最为贴切。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“正被带出去”保留原文分词所表达的进行状态；“印章、带子和手杖”维持三件物品的并列及原文对具体形制所留的空间。脚注标记置于其实际所说明的“辨认”之后。
