base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/001.yaml
  text: At that time Judah went down from his brothers and turned aside to a certain Adullamite whose name was Hirah[a][b].
translation:
  language: zh_hans
  text: 那时，犹大离开他的弟兄们，下去，转到一个亚杜兰人那里；那人名叫希拉。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“那时，事情发生了。”
    reason: lexical_alternative
  - marker: b
    text: “转到……那里”也可译为“到……那里”；“一个亚杜兰人”也可译为“一个亚杜兰男子”。希伯来文可仅说明其籍贯，也可用于引出一个特定人物。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בָּעֵת הַהִוא
  choice: 那时
  rationale: 这是希伯来叙事中引入新一幕的惯用表达。“那时”自然保留时间衔接；较完整的形式见脚注[a]。
- source_word: וַיֵּרֶד
  choice: 下到
  rationale: 保留 ירד 的方向意味，同时符合现代汉语叙事表达。
- source_word: מֵאֵת אֶחָיו
  choice: 离开他的弟兄们
  rationale: 这里表示犹大与他的弟兄们分开；“离开”比仅译“从”更清楚地传达分离关系。
- source_word: וַיֵּט עַד
  choice: 到……那里
  rationale: נטה 本有转向、转去之意，与 עַד 连用表示转向某人；正文采用自然汉语表达，相关语义在脚注[b]说明。
- source_word: אִישׁ עֲדֻלָּמִי
  choice: 一个亚杜兰人
  rationale: אִישׁ 加地域称谓可指一名来自该地的人；“一个亚杜兰人”既自然，又不强行判定是否含“某一个特定的人”的强调。
- source_word: וּשְׁמוֹ חִירָה
  choice: 那人名叫希拉
  rationale: 直接保留希伯来文命名分句的结构，并以自然现代汉语表达。
- source_word: חִירָה
  choice: 希拉
  rationale: 按中文圣经人名的通行音译处理。
