- from: 那时，犹大离开他的弟兄们，下到一个亚杜兰人那里；那人名叫希拉。[a][b]
  to: 那时，犹大离开他的弟兄们，下去，转到一个亚杜兰人那里；那人名叫希拉。[a][b]
  rationale: 修订在保持原有现代、庄重叙事语体及人名地名译法的同时，以“下去，转到”分别对应 וַיֵּרֶד 与 וַיֵּט，避免遗漏后者的转向动作。脚注[a]改为更自然的汉语直译说明；脚注[b]调整为与修订后正文一致，且保留关于“亚杜兰人”语法功能的必要歧义。
