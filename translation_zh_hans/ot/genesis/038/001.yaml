  naturalness: “那时，犹大离开他的弟兄们，下去，转到一个亚杜兰人那里；那人名叫希拉。”在现代书面汉语中自然、庄重，也较明确地对应原文连续的叙事动作。
  terminology: “犹大”“亚杜兰人”“希拉”均符合中文圣经常见译名。“弟兄们”保留原文的男性亲属指称。“一个亚杜兰人”可自然涵盖 אישׁ 加地名形容词的表述，无须在正文硬译“男子”。
