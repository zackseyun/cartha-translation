  text: She conceived again and bore a son, and she named him Onan.
translation:
  language: zh_hans
  text: 她又怀孕，生了一个儿子，给他取名叫俄南。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתַּהַר
  choice: 她怀孕
  rationale: 希伯来语动词 הרה 表示怀孕或受孕；现代汉语叙事中“怀孕”自然清楚，也不超出原文所表达的事实。
- source_word: עוֹד
  choice: 又
  rationale: 这里处于连续生育的叙事中，עוֹד 表示动作再次发生；“又”简洁自然。
- source_word: וַתֵּלֶד בֵּן
  choice: 生了一个儿子
  rationale: 准确表达 ילד 与“儿子”构成的生育用语，并符合现代汉语习惯。
- source_word: וַתִּקְרָא אֶת־שְׁמוֹ
  choice: 给他取名叫
  rationale: 原文直译为“称他的名”；“给他取名叫”以自然汉语保留命名这一含义，并体现动词为阴性单数，即命名者是她。
- source_word: אוֹנָן
  choice: 俄南
  rationale: 采用中文圣经传统中通行的人名音译，便于辨识和跨经文对应。
