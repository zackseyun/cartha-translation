base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/029.yaml
  text: And as he drew back his hand[a], behold, his brother came out. Then she said[b], “What a breach you have made for yourself!” So his name was called Perez.
translation:
  language: zh_hans
  text: 他把手缩回去的时候，不料，他的兄弟出来了。她就说：“你竟为自己冲开了一个缺口！”[a] 于是，他的名字叫法勒斯。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “冲开”和“缺口”所对应的希伯来语出自同一词根；“法勒斯”这个名字也源于该词根。原文是强调式感叹，可直译为“你为自己冲破了何等的缺口！”
    reason: lexical_wordplay
lexical_decisions:
- source_word: כְּמֵשִׁיב יָדוֹ
  choice: 他把手缩回去的时候
  rationale: 使役式分词在这里描述把已经伸出的手收回；“把手缩回去”具体、自然，也符合分娩场景。
- source_word: וְהִנֵּה
  choice: 不料
  rationale: הִנֵּה在此凸显出人意料的转折；现代汉语用“不料”可自然传达叙事中的突然与惊讶。
- source_word: יָצָא אָחִיו
  choice: 他的兄弟出来了
  rationale: יָצָא在出生语境中直指婴儿出来；保留“出来”也与下文“冲开”形成连贯画面。
- source_word: מַה פָּרַצְתָּ עָלֶיךָ פָּרֶץ
  choice: 你竟为自己冲开了一个缺口！
  rationale: 以“冲开……缺口”再现同根动词与名词的强调式表达，并保留עָלֶיךָ所含“为自己”的困难措辞；“竟”传达מַה在感叹句中的惊异语气。
- source_word: פָּרֶץ
  choice: 法勒斯
  rationale: 采用现代中文圣经读者熟悉的人名译法；脚注说明该名与希伯来语“冲破、缺口”的文字游戏。
- source_word: וַיִּקְרָא שְׁמוֹ פָּרֶץ
  choice: 于是，他的名字叫法勒斯
  rationale: 希伯来文动词为第三人称阳性单数，但上下文没有明确指出命名者；中文采用不点明命名主体的表达，避免擅自补出人物。
