  text: When it was time for her to give birth, behold, there were twins in her womb.
translation:
  language: zh_hans
  text: 到了她分娩的时候，看哪，她腹中有一对双胞胎。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: 到了……的时候
  rationale: 该叙事形式承接前文并引入下一事件；与בְּעֵת合译为自然的现代汉语时间从句，不另加原文没有的“如今”。
- source_word: בְּעֵת לִדְתָּהּ
  choice: 她分娩的时候
  rationale: עֵת标示时间，ילד的不定式附第三人称阴性单数词尾，表示她生产；“分娩”准确、简洁而庄重。
- source_word: וְהִנֵּה
  choice: 看哪……竟
  rationale: “看哪”保留הִנֵּה引人注意的显著话语功能，“竟”在汉语中自然传达发现双胞胎时的意外感，并非另添事实内容。
- source_word: תְאוֹמִים
  choice: 双胞胎
  rationale: 该复数名词直接指同胎所生的两个孩子；“双胞胎”是现代汉语通常说法。
- source_word: בְּבִטְנָהּ
  choice: 她腹中
  rationale: בֶּטֶן在生产语境中指孕育胎儿之处；“腹中”自然且准确，也避免生硬重复“子宫里”。
