base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/028.yaml
  text: And when she was giving birth[a], he put out a hand, and the midwife took it and tied a scarlet thread on his hand, saying[c][b], “This one came out first.”
translation:
  language: zh_hans
  text: 她分娩的时候，一个孩子伸出一只手来[a]；接生婆便抓住那只手，在他的手上系了一根朱红线，说：“这个是先出来的。”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“他给出一只手”，是描述婴儿的手在分娩时伸出来的说法；也可译作“一只手伸了出来”。
    reason: lexical_alternative
  - marker: b
    text: 接生婆系上朱红线，是为了标明双胞胎中哪一个先露出来。
    reason: cultural_note
lexical_decisions:
- source_word: בְּלִדְתָּהּ
  choice: 她分娩的时候
  rationale: ב 加上带第三人称阴性单数后缀的 ילד 不定式附属形，表示分娩正在发生的时间背景；此译自然、清楚。
- source_word: וַיִּתֶּן יָד
  choice: 一个孩子伸出一只手来
  rationale: 字面为“他给出一只手”，在分娩语境中是手从产道伸出的表达。补出“一个孩子”可明确未点名的阳性单数主语，同时不预先判定是哪一个双胞胎。
- source_word: הַמְיַלֶּדֶת
  choice: 接生婆
  rationale: 该词指协助妇女分娩的人；“接生婆”是现代中文叙事中简明易懂且符合古代场景的称呼。
- source_word: וַתִּקְשֹׁר עַל יָדוֹ שָׁנִי
  choice: 拿朱红线系在他的手上
  rationale: שָׁנִי 指朱红色的材料；上下文表明它被用作系在手上的标记，因此补出“线”既自然又不过度具体化。
- source_word: זֶה יָצָא רִאשֹׁנָה
  choice: 这个是先出来的
  rationale: 保留指示词和先后次序；不译作“长子”，以免加入原文此处未明确使用的身份称号。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“分娩”准确表达生产过程；“接生婆”贴合古代场景。“一个孩子”保留说话者当时尚未辨明双胞胎身份的叙事视角。
