revisions:
- from: 犹大对俄南说：“你要与你哥哥的妻子同房，向她尽兄弟娶寡嫂的本分，为你哥哥延续后代。[a]”
  to: 犹大对俄南说：“你要同你兄弟的妻子同房，向她尽作兄弟的本分[a]，为你兄弟延续后代。”
  rationale: 修订保留原文三个并列命令的结构：与兄弟之妻同房、向她履行夫兄弟婚义务、为兄弟建立后代。以“尽作兄弟的本分”作自然的正文表达，以脚注交代技术性制度含义；同时将“哥哥”改为“兄弟”，不在正文中额外限定原文未标示的长幼关系。
