  naturalness: “向她尽兄弟娶寡嫂的本分”搭配生硬，普通读者不易自然理解。改为“向她尽作兄弟的本分”，并以脚注说明其为夫兄弟婚的专门义务，既自然也保留原文术语的功能。
  terminology: “犹大”“俄南”“同房”“后代”均庄重、通行且合乎现代标准普通话。将“哥哥”统一改为“兄弟”，避免无必要地缩窄 אָח。“夫兄弟婚”仅置于脚注作为解释性技术术语，不使正文显得学术化。
