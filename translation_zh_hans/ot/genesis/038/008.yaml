  text: וַ/יֹּ֤אמֶר יְהוּדָה֙ לְ/אוֹנָ֔ן בֹּ֛א אֶל אֵ֥שֶׁת אָחִ֖י/ךָ וְ/יַבֵּ֣ם אֹתָ֑/הּ וְ/הָקֵ֥ם זֶ֖רַע לְ/אָחִֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/008.yaml
  text: Then Judah said to Onan[a], “Go in to your brother’s wife, perform the duty of a brother-in-law to her, and raise up offspring for your brother.”
translation:
  language: zh_hans
  text: 犹大对俄南说：“你要同你兄弟的妻子同房，向她尽作兄弟的本分[a]，为你兄弟延续后代。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“向她履行夫兄弟婚的义务”。这是指男子为已故而未留下后代的兄弟延续家系的责任。
    reason: 解释原文 יִבֵּם 的专门夫兄弟婚含义，并使脚注锚定在所解释的短语上。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 未单独译出连接词 וַ；现代汉语叙事中上下文已能自然表达事件推进，避免机械加入“然后”。
- source_word: יְהוּדָה
  choice: 犹大
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: לְאוֹנָן
  choice: 对俄南
  rationale: 介词 לְ 在言说结构中标示对象，译作“对”；人名采用通行译法“俄南”。
- source_word: בֹּא אֶל אֵשֶׁת אָחִיךָ
  choice: 与你哥哥的妻子同房
  rationale: בֹּא אֶל 在此婚姻与生育语境中是指发生性关系；“同房”既明确又庄重，比逐字译作“进去到……那里”更符合现代汉语。אָחִיךָ 本身可指兄弟，语境表明他是已故的哥哥珥，故译“哥哥”。
- source_word: וְיַבֵּם אֹתָהּ
  choice: 向她尽兄弟娶寡嫂的本分
  rationale: יִבֵּם 是履行夫兄弟婚责任的专门动词。此译法说明亲属身份、婚姻责任及受益对象，又避免使用普通读者难懂的纯术语。
- source_word: וְהָקֵם זֶרַע
  choice: 延续后代
  rationale: 该搭配意为使死者的家系得以延续；“延续后代”自然传达建立后嗣、维系家系的意思，同时避免将 זֶרַע 生硬译作“种子”。
- source_word: לְאָחִיךָ
  choice: 为你哥哥
  rationale: לְ 表示归属、受益或目的；“为你哥哥”保留后代归于已故兄长这一关键含义。
theological_decisions:
- issue: 如何翻译夫兄弟婚义务而不套入后期法律或宗派解释
  choice: 向她尽兄弟娶寡嫂的本分
  alternative: 向她尽夫兄弟婚的义务；娶她为嫂妻
  rationale: 原文使用技术性动词 יִבֵּם，所指不只是发生性关系，也包括为已故兄弟延续后代的家族责任。正文采用普通读者可理解的表达，脚注补充其制度背景，但不引入原文未明说的后期规定。
- issue: “为你哥哥延续后代”中后代的归属
  choice: 保留“为你哥哥”
  alternative: 给你哥哥生一个儿子
  rationale: זֶרַע 可指后裔，并未限定一定是儿子；译作“后代”保留词义范围，而“为你哥哥”体现孩子在家系意义上归于已故兄长。
translation_notes:
  register: 采用自然、庄重的现代标准普通话。“同房”清楚而不粗俗；“尽兄弟娶寡嫂的本分”兼顾技术含义与可读性。脚注标记置于整句末尾，所注释的是句中的专门制度表达。
