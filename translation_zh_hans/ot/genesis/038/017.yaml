- from: 他说：“我会从羊群中送一只山羊羔来。”她说：“可以，只要你在送来以前给我一件抵押物[a]。”
  to: 他说：“我会从羊群中送一只小山羊给你。”她说：“若你在送来以前给我一件担保物，就可以。”
  rationale: 将עֵרָבוֹן改译为“担保物”，避免“抵押物”的现代法律技术含义，并保留其作为预先交付之保证物的功能。将犹大的话改为“送……给你”，避免无根据地指定“来”的方向；以“若……，就可以”自然呈现她的条件性回应。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T04:21:48Z'
review_pass:
  verdict: revise
  source_fidelity: 原文中犹大承诺从羊群中送一只山羊羔；她提出的条件是，在他送来该羊羔以前，须先给她一件作为保证的物件。草稿整体保留了这两层意思，但“抵押物”带有较强的现代借贷、抵押法律语境，较原文泛指的担保／保证物略窄。
  naturalness: “我会从羊群中送一只山羊羔来”可懂，但“送……来”加入了原文未明说的方向性；改为“送一只小山羊给你”更符合现代汉语对话，也明确受领者。“可以，只要……”自然，却将原文的条件句显性扩展为接受提议；采用“若你……，就可以”可保留原文省略而条件性的表达。
  terminology: עֵרָבוֹן宜译为“担保物”或“保证物”，指为保证日后履约而预先交付的物件；不宜限定为具有特定物权／借贷含义的“抵押物”。脚注应提供“抵押物”和“保证物”等可行替代，不以“凭据”作为主要词义替代。
  issues:
  - severity: medium
    issue: “抵押物”对עֵרָבוֹן的语义限定过强。
    rationale: 该词指为保证履约而交付的保证物；本节并非借贷或以财产设定抵押的情境。用“担保物”较能保留原文的广义和叙事功能。
  - severity: low
    issue: “送……来”添加方向性，“可以”略微明说了原文仅以条件句表达的接受。
    rationale: 这些表达不致改变事件，但可用“送……给你”及“若……，就可以”更贴近原文对话的条件结构，同时保持汉语通顺。
  revised_text: 他说：“我会从羊群中送一只小山羊给你。”她说：“若你在送来以前给我一件担保物，就可以。”
  revised_footnotes:
  - marker: a
    text: “担保物”也可译作“保证物”或“抵押物”。
    reason: lexical_alternative
  revision_rationale: 将עֵרָבוֹן改译为“担保物”，避免“抵押物”的现代法律技术含义，并保留其作为预先交付之保证物的功能。将犹大的话改为“送……给你”，避免无根据地指定“来”的方向；以“若……，就可以”自然呈现她的条件性回应。
