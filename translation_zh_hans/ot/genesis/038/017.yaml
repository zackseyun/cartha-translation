  text: And he said[a], “I will send a young goat from the flock.” And she said, “If you will give a pledge until you send it.”
translation:
  language: zh_hans
  text: 他说：“我会从羊群中送一只小山羊给你。”她说：“若你在送来以前给我一件担保物，就可以。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גְּדִי עִזִּים
  choice: 一只山羊羔
  rationale: 该短语指山羊的幼崽；“山羊羔”在现代汉语中自然明确，也保留了动物种类。
- source_word: מִן הַצֹּאן
  choice: 从羊群中
  rationale: צֹאן泛指绵羊、山羊等小型牲畜组成的群；上下文已明确是山羊羔，因此译作“从羊群中”简洁自然。
- source_word: עֵרָבוֹן
  choice: 一件抵押物
  rationale: 此词指在承诺履行前交付、作为担保的具体物件；“抵押物”符合本段叙事情境。
- source_word: עַד שָׁלְחֶךָ
  choice: 在送来以前
  rationale: 希伯来语字面为“直到你送来”；所送之物由上文的山羊羔明确，现代汉语可自然省略宾语而仍保持指向清楚。
- source_word: אִם תִּתֵּן
  choice: 可以，只要你……给我
  rationale: 这里的אִם引出她接受提议的条件；汉语用“可以，只要……”比机械直译“如果”更符合对话语气，同时保留条件关系。
- source_word: אָנֹכִי אֲשַׁלַּח
  choice: 我会……送……来
  rationale: 独立人称代词带有一定强调，但汉语主语“我”结合“会”已自然表达犹大的亲自承诺；“来”体现从女子视角接收所送之物。
