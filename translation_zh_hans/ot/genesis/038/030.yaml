  yaml_path: translation/ot/genesis/038/030.yaml
  text: Afterward his brother came out[a], with the scarlet thread on his hand[b], and he called his name Zerah.
translation:
  language: zh_hans
  text: 随后，他的兄弟出来了，手上带着朱红线[a]；他给孩子起名叫谢拉[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“手上有那朱红色”；“线”承接第28节补出。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“他称他的名为谢拉”。这里没有明确说明“他”具体指谁。
    reason: ambiguity
lexical_decisions:
- source_word: וְאַחַר
  choice: 随后
  rationale: 表示紧接前文的时间顺序；“随后”简洁自然，也保留了“在那之后”的意思。
- source_word: יָצָא
  choice: 生了出来
  rationale: 该动词基本义为“出来”；在分娩语境中译作“生了出来”，既保留动作意象，也符合现代汉语表达。
- source_word: אָחִיו
  choice: 他的兄弟
  rationale: 直译带第三人称阳性单数后缀的亲属称谓，指另一个双胞胎。
- source_word: אֲשֶׁר עַל־יָדוֹ הַשָּׁנִי
  choice: 手上系着朱红线
  rationale: 原文直述“他手上有那朱红色之物”；根据38:28紧邻语境补出“线”及其系在手上的关系，使汉语清楚自然。
- source_word: הַשָּׁנִי
  choice: 朱红线
  rationale: 该词本身指朱红色或朱红色材料；此处承接38:28所说的线，因此译为“朱红线”。
- source_word: וַיִּקְרָא שְׁמוֹ
  choice: 他就给孩子起名叫
  rationale: 希伯来语直译为“他称他的名”；现代汉语以“给孩子起名叫”自然表达命名，同时用“他”保留动词的阳性单数形式，不擅自认定此人的具体身份。
- source_word: זָרַח
  choice: 谢拉
  rationale: 采用现代中文圣经传统中通行的人名音译。
theological_decisions:
- issue: 命名者的身份
  choice: 以“他”保留原文阳性单数主语，但不说明具体是谁
  alternative: 采用无主句“给他起名叫谢拉”，或明确说父亲、接生者等人命名
  rationale: 原文动词为阳性单数，却没有在本节明确指出命名者；不应根据推测补定其身份。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“生了出来”照应分娩场景；“朱红线”借助紧邻语境补足省略成分。句号分开出生与命名两个动作，使中文清晰，并保留命名者身份未明的张力。
