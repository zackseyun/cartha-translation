  text: Then she arose and went away[b][a], and she removed her veil from upon her and put on the garments of her widowhood.
translation:
  language: zh_hans
  text: 她就起身离去，摘下身上的面纱，穿上她寡居时的衣服。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתָּקָם
  choice: 她就起来
  rationale: קום的Qal连续式在叙事中推进下一步行动；“起来”既贴近原文，又符合现代汉语叙事表达。
- source_word: וַתֵּלֶךְ
  choice: 离去
  rationale: הלך接在“起来”之后，语境表明她离开当时所在之处；“离去”简洁而庄重。
- source_word: וַתָּסַר
  choice: 摘下
  rationale: סור的Hiphil在此表示把遮盖物从自己身上除去；汉语谈及面纱时，“摘下”比“移除”自然。
- source_word: צְעִיפָהּ
  choice: 身上的面纱
  rationale: צָעִיף指遮盖物或面纱，前文中是她伪装的一部分；译作“面纱”最合语境，并以“身上的”体现מֵעָלֶיהָ。
- source_word: מֵעָלֶיהָ
  choice: 身上的
  rationale: 该短语直指面纱从她身上被除去；融入“身上的面纱”，既保留信息，也避免生硬直译为“从她上面”。
- source_word: וַתִּלְבַּשׁ
  choice: 穿上
  rationale: לבש表示穿衣；“穿上”直接、自然，并保留动作的完成性。
- source_word: בִּגְדֵי אַלְמְנוּתָהּ
  choice: 守寡的衣服
  rationale: 该结构指与她寡居身份相称或作为其标志的衣服；“守寡的衣服”保留“寡居状态”的含义，也与本章前文语境呼应。
