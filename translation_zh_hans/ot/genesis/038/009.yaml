base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/009.yaml
  text: But Onan knew that the offspring would not be his[a]; so whenever he went in to his brother’s wife, he spilled it on the ground[b], so as not to give offspring to his brother.
translation:
  language: zh_hans
  text: 俄南知道，后代不会算作他的[a]；所以，他每逢与哥哥的妻子同房，就把精液泄在地上[b]，免得给哥哥留下后代。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文作“种子不会属于他”；这里的“种子”指在兄终弟及的婚姻安排下所生的后代，这后代会归在亡兄名下。
    reason: lexical_alternative
  - marker: b
    text: 原文直译近于“就使之毁坏在地上”，宾语并未明说；上下文表明这是指把精液泄在地上，以阻止受孕。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּדַע
  choice: 知道
  rationale: 叙事中 ידע 的直接、自然译法；这里表示俄南清楚后代的归属。
- source_word: לֹא לוֹ יִהְיֶה הַזָּרַע
  choice: 后代不会算作他的
  rationale: זֶרַע 字面为“种子”，但在兄终弟及的语境中指所生的后代；“算作他的”表达该后代在家族关系上归于亡兄的含义。
- source_word: וְהָיָה אִם־בָּא אֶל־אֵשֶׁת אָחִיו
  choice: 所以，他每逢与哥哥的妻子同房
  rationale: 该结构在过去时叙事中表示反复发生的行为；“同房”以现代汉语自然表达原文的性关系委婉语。
- source_word: וְשִׁחֵת אַרְצָה
  choice: 就让精液流在地上
  rationale: שחת 本义涉及毁坏或使之无效，宾语在原文中省略；结合上下文，此处指使精液落地以阻止受孕。译文明确必要的隐含所指，但不增加行为方式以外的解释。
- source_word: לְבִלְתִּי נְתָן זֶרַע לְאָחִיו
  choice: 免得给哥哥留下后代
  rationale: 准确表达目的从句；“留下后代”符合现代汉语习惯，也保留为亡兄延续后代的家族语境。
theological_decisions:
- issue: 本节中 זֶרַע 的双重语境及俄南行为的性质
  choice: 在涉及家族归属的两处将 זֶרַע 译为“后代”，并在中间的行为描述中明确原文省略宾语所指为“精液”。
  alternative: 全节统一译作“种子”，或较含蓄地译作“让它落在地上”。
  rationale: 本节同时涉及法律／家族意义上的后代，以及阻止受孕的具体行为。分别按语境表达，可使中文清楚而不把经文扩展为对其他性伦理问题的教义判断。
translation_notes:
  register: 采用庄重、清晰的现代标准汉语。“哥哥”按上下文表达已故兄长；“同房”保留委婉而明确的叙事语体。主文本中的脚注标记与脚注一一对应。
