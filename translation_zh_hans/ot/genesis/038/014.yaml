  text: וַ/תָּסַר֩ בִּגְדֵ֨י אַלְמְנוּתָ֜/הּ מֵֽ/עָלֶ֗י/הָ וַ/תְּכַ֤ס בַּ/צָּעִיף֙ וַ/תִּתְעַלָּ֔ף וַ/תֵּ֨שֶׁב֙ בְּ/פֶ֣תַח עֵינַ֔יִם אֲשֶׁ֖ר עַל דֶּ֣רֶךְ תִּמְנָ֑תָ/ה כִּ֤י רָאֲתָה֙ כִּֽי גָדַ֣ל שֵׁלָ֔ה וְ/הִ֕וא לֹֽא נִתְּנָ֥ה ל֖/וֹ לְ/אִשָּֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/014.yaml
  text: So she took off her widow’s garments from herself, and wrapped herself in a veil, and sat at the entrance to Enaim, which is on the road to Timnah. For she saw that Shelah had grown up, yet she had not been given to him as a wife.
translation:
  language: zh_hans
  text: 于是她脱去守寡时所穿的衣服，用面纱遮住自己，又把自己裹起来，坐在通往亭拿的路上、以拿音的入口处[a]。因为她看出示拉已经长大，自己却还没有被许配给他为妻。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “以拿音”也可按普通名词理解；其字面义与“眼睛”有关。此处将它视为地名。
    reason: עֵינַיִם可作地名，亦可按普通名词解释。脚注保留这一歧义，但不把解释性较强的“岔路口”误述为直接词义。
lexical_decisions:
- source_word: בִּגְדֵי אַלְמְנוּתָהּ
  choice: 寡妇的衣服
  rationale: 直译为“她守寡的衣服”，指表明寡妇身份的服装；中文用“寡妇的衣服”自然且不额外解释其礼俗功能。
- source_word: וַתְּכַס בַּצָּעִיף
  choice: 蒙上面纱
  rationale: צָעִיף指遮盖头脸的纱巾或面纱；“蒙上”准确表达遮盖动作。
- source_word: וַתִּתְעַלָּף
  choice: 把自己裹起来
  rationale: 该反身动词在此表示将自己包裹、遮掩起来；与前面的蒙面纱相关，却仍保留原文独立的动作，不将其省略或直接解释成“乔装”。
- source_word: בְּפֶתַח עֵינַיִם
  choice: 在以拿音入口处
  rationale: 将עֵינַיִם按地名处理，פֶּתַח译作“入口处”；此理解与后面的道路方位说明相合，同时以脚注保留另一种可能。
- source_word: תִּמְנָתָה
  choice: 通往亭拿
  rationale: 词尾-ה表示方向，故在句法上译为“通往亭拿”。
- source_word: גָדַל שֵׁלָה
  choice: 示拉已经长大
  rationale: 保留原文简洁说法，语境中意为已到适婚年龄，但不在正文中增添解释。
- source_word: לֹא נִתְּנָה לוֹ לְאִשָּׁה
  choice: 还没有被给他作妻子
  rationale: 保留原文被动表达，突出她并未按先前安排被交给示拉为妻，也不改写为主动主体。
theological_decisions:
- issue: 是否把示拉“长大”解释为履行娶寡嫂责任的年龄
  choice: 正文仅译“已经长大”
  alternative: 译作“已经长大成人，可以娶妻了”
  rationale: 原文只说גָדַל（长大），其法律与家族责任由上下文显明；正文不加入原文没有明说的资格判断。
- issue: 是否将她的遮盖动作明说为乔装妓女
  choice: 保留“蒙上面纱，把自己裹起来”的动作描写
  alternative: 译作“乔装打扮”或“装成妓女”
  rationale: 本节没有直接说她装成妓女；后文人物如何认定她应由叙事本身呈现，不在此提前化解张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“寡妇的衣服”“蒙上面纱”“裹起来”保持动作层次；“被给他作妻子”略带原文式被动感，以保留她在家族安排中的处境。所有脚注标记均已置于正文对应位置。
