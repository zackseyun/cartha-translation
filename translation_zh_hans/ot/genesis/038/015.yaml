base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/015.yaml
  text: When Judah saw her[a], he thought she was a prostitute, because she had covered her face.
translation:
  language: zh_hans
  text: 犹大看见她，就以为她是妓女，因为她蒙着脸。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּרְאֶהָ
  choice: 犹大看见她
  rationale: ראה意为“看见”；以顺承叙事表达动作，并在下一分句用“就”自然呈现先后关系。
- source_word: וַיַּחְשְׁבֶהָ
  choice: 就以为她是
  rationale: חשב在此表示犹大对她身份所作的判断，而这个判断后来显明是错误的；“以为”在现代汉语中自然准确。
- source_word: לְזוֹנָה
  choice: 妓女
  rationale: זונה指卖淫的女子；“妓女”是现代汉语中明确、常见的对应词，不采用古雅的“娼妓”，也不引入“性工作者”的现代社会学色彩。
- source_word: כִּי
  choice: 因为
  rationale: כִּי在此引出犹大作出判断的原因，“因为”直接体现因果关系。
- source_word: כִסְּתָה פָּנֶיהָ
  choice: 她蒙着脸
  rationale: כסּה意为“遮盖”，פָּנֶיהָ意为“她的脸”；结合当时持续存在并构成判断依据的状态，汉语“蒙着脸”比生硬的“已经遮盖了她的脸”更自然。
