base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/005.yaml
  text: She conceived again and bore a son[a], and she called his name Shelah[b]. And he was at Chezib when she bore him.
translation:
  language: zh_hans
  text: 她又生了一个儿子，给他起名叫示拉。她生他的时候，他当时在基悉[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文本作“他当时在”；这里的“他”所指何人有争议。有些古代文本见证和解释者理解为：“她生他的时候，她当时在基悉。”
    reason: alternative_reading
  - marker: b
    text: “基悉”也可音译为“基西布”；这个地名在其他经文中也有不同的拼写形式，所指是同一地点。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּסֶף עוֹד וַתֵּלֶד בֵּן
  choice: 她又生了一个儿子
  rationale: יסף与עוד合用表示动作再次发生；结合上下文，现代汉语用“又生了”即可自然表达再次生育，无须补出原文没有明说的“怀孕”。
- source_word: וַתִּקְרָא אֶת־שְׁמוֹ שֵׁלָה
  choice: 给他起名叫示拉
  rationale: 准确传达“称他的名为”的希伯来语命名句式，同时采用现代汉语自然表达；שֵׁלָה按通行中文圣经人名译作“示拉”。
- source_word: וְהָיָה
  choice: 他正在
  rationale: 马所拉文本的动词为阳性单数，正文以“他”保留这一语法信息，不擅自改作“她”；具体所指在上下文中并不完全明确，因此不直接补成“犹大”。
- source_word: בִכְזִיב
  choice: 在基悉
  rationale: 介词ב在此表示地点；כזיב为地名，采用通行中文音译“基悉”。
- source_word: בְּלִדְתָּהּ אֹתוֹ
  choice: 她生他的时候
  rationale: 带ב的动词不定式结构表达时间关系，直译意义为“在她生他时”；中文用“她生他的时候”清楚而自然。
theological_decisions:
- issue: וְהָיָה的主语及所指
  choice: 正文译作“他正在”，保留马所拉文本的阳性单数形式，但不明说是犹大
  alternative: “她正在”，或“犹大正在”
  rationale: 有些古代见证和解释传统把主语理解为产妇，但马所拉文本为阳性单数；若直接译作“犹大”，又会把可能但未明说的先行词固定下来。正文保留“他”，脚注交代异读与歧义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事文体。“给他起名叫”比逐字译作“称他的名为”更符合当代普通话；末句刻意保留“他”的指代张力，并用脚注说明文本问题。
