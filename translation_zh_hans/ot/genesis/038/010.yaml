  text: וַ/יֵּ֛רַע בְּ/עֵינֵ֥י יְהוָ֖ה אֲשֶׁ֣ר עָשָׂ֑ה וַ/יָּ֖מֶת גַּם אֹתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/010.yaml
  text: What he did was evil in the sight of Yahweh, so he put him to death also.
translation:
  language: zh_hans
  text: 他所做的事在雅威眼中是恶的，于是雅威也使他死亡。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּרַע
  choice: 是恶的
  rationale: 该动词在此表达道德上的负面评价；“是恶的”比“令……不悦”更直接，也符合上下文中神的审判。
- source_word: בְּעֵינֵי יְהוָה
  choice: 在雅威眼中
  rationale: 保留希伯来语“在……眼中”的常见评价性表达，在现代汉语中也自然易懂。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以常见的汉语音译呈现四字神名，保留原文所用的专名。
- source_word: אֲשֶׁר עָשָׂה
  choice: 他所做的事
  rationale: 自然呈现关系从句，并明确所受评价的是俄南在上文中的行为。
- source_word: וַיָּמֶת
  choice: 使他死了
  rationale: 该词是מות的使役形，直接表明雅威使俄南死亡，保留原文的使役意义和神主动施行审判的表达。
- source_word: גַּם אֹתוֹ
  choice: 也
  rationale: “也”把俄南的结局与前文珥的死亡相连，准确保留גם的承接作用。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；采用“雅威”以专名形式呈现，而不以称号替代。
- issue: וַיָּמֶת所表达的神圣审判
  choice: 雅威也使他死了
  alternative: 他也死了
  rationale: 使役形明确把死亡归因于雅威的行动；主动表达避免把原文弱化为仅仅陈述俄南死亡。
- issue: 两分句之间的逻辑关系
  choice: 因此
  alternative: 于是
  rationale: 原文以叙事连接词衔接，但上下文清楚呈现恶行与审判之间的因果关系；“因此”自然表达这一关系，同时不增加审判原因之外的具体解释。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。句式紧贴原文的评价与审判结构，不把“恶”具体限定为某一种行为或教义解释。
