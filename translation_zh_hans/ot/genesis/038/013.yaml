  yaml_path: translation/ot/genesis/038/013.yaml
  text: And Tamar was told[a], saying, “Look, your father-in-law is going up to Timnah to shear his sheep.”
translation:
  language: zh_hans
  text: 有人告诉他玛说：“你看，你的公公正要上亭拿去给自己的羊剪毛。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֻּגַּד לְתָמָר
  choice: 有人告诉他玛
  rationale: 原文用被动式表达“消息被告知他玛”。现代汉语以不定施事“有人”表达更自然，也不擅自指明报信者。
- source_word: לֵאמֹר
  choice: 说
  rationale: 保留希伯来语引出直接引语的常用公式，同时符合自然汉语叙事。
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留原文引人注意、提示新消息的语篇功能；用语庄重而仍易懂。
- source_word: חָמִיךְ
  choice: 你公公
  rationale: 准确表达该亲属称谓及第二人称阴性单数所属关系；对他玛而言，犹大是其公公。
- source_word: עֹלֶה
  choice: 正上……去
  rationale: 分词表示正在发生或即将发生的行动；“上……去”保留עלה的上行方向意味，又不强行解释具体地势。
- source_word: תִמְנָתָה
  choice: 亭拿
  rationale: 按现代中文圣经地名惯例音译；原文方向词尾由“去”体现。
- source_word: לָגֹז צֹאנוֹ
  choice: 去给他的羊剪毛
  rationale: ל加不定式表示目的；צאן在剪毛语境中自然指羊，所属后缀明确为“他的”。
theological_decisions: []
translation_notes:
  register: 采用现代、清楚而庄重的叙事语言。“有人告诉他玛”自然呈现原文的被动传讯结构；“看哪”保留原文的提示语气。
