  text: וַ/יִּשְׁאַ֞ל אֶת אַנְשֵׁ֤י מְקֹמָ/הּ֙ לֵ/אמֹ֔ר אַיֵּ֧ה הַ/קְּדֵשָׁ֛ה הִ֥וא בָ/עֵינַ֖יִם עַל הַ/דָּ֑רֶךְ וַ/יֹּ֣אמְר֔וּ לֹא הָיְתָ֥ה בָ/זֶ֖ה קְדֵשָֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/021.yaml
  text: He asked the men of her place[a], saying, “Where is the cult prostitute who was at Enaim by the road?” But they said[b], “There has been no cult prostitute here.”
translation:
  language: zh_hans
  text: 他问那地方的人说：“那个在伊拿印[b]路旁的祭祀妓女[a]在哪里？”他们回答：“这里从来没有过祭祀妓女。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“庙妓”。希伯来语在这里所用的词与本章其他地方表示一般“妓女”的词不同，通常指与宗教祭仪有关的妓女；“祭祀妓女”不暗示一定有某座特定的神庙建筑。
    reason: lexical_alternative
  - marker: b
    text: “伊拿印”是地名；其希伯来语形式与“眼睛”一词相同，也可能使人联想到“泉水”。
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁאַל
  choice: 他问
  rationale: 以自然的现代汉语表达叙事中的连续动作，同时保留“询问”的基本意义。
- source_word: אַנְשֵׁי מְקֹמָהּ
  choice: 那地方的人
  rationale: 希伯来语直译为“她那地方的人”；此处的阴性单数后缀所指略有含混。译作“那地方的人”既符合汉语习惯，也避免把所指过度限定为女子的家乡或固定住所。
- source_word: לֵאמֹר
  choice: 说
  rationale: 保留希伯来语引出直接引语的常见结构；“问……说”在庄重的现代汉语叙事中可以成立。
- source_word: הַקְּדֵשָׁה
  choice: 祭祀妓女
  rationale: קְדֵשָׁה在本节指与宗教祭仪有关的妓女，并有别于本章其他地方所用的一般“妓女”一词。此译比“庙妓”更宽泛，不暗示现场必有特定神庙建筑。
- source_word: בָעֵינַיִם
  choice: 在伊拿印
  rationale: 上下文表明这是地名，故采用音译，不按其字面关联译作“眼睛”或“泉水”。
- source_word: עַל הַדָּרֶךְ
  choice: 路旁
  rationale: 此处介词短语表示位于道路边，译作“路旁”简洁自然。
- source_word: לֹא הָיְתָה בָזֶה קְדֵשָׁה
  choice: 这里从来没有过祭祀妓女
  rationale: 自然表达当地人否认这种女子曾在此处出现或存在；“从来没有过”贴合对先前存在情况的否定。
theological_decisions:
- issue: קְדֵשָׁה是否应直接等同于普通妓女
  choice: 译作“祭祀妓女”以保留其宗教祭仪色彩
  alternative: 妓女；庙妓；圣妓
  rationale: 本章另用זֹנָה表示一般妓女，而本节特意采用קְדֵשָׁה。译文保留这一词语区别，但不进一步断定其所属神庙、仪式或制度的具体性质。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“问……说”适度保留希伯来语话语结构；“他们回答”则使后半句在汉语中更自然。脚注标记均置于所解释的词语之后。
