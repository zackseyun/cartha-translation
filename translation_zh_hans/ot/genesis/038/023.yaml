base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/023.yaml
  text: And Judah said[a], “Let her keep them, lest we become a laughingstock. Look, I sent this young goat, but you did not find her.”
translation:
  language: zh_hans
  text: 犹大说：“让她留着吧，免得我们成为笑柄[a]。你看，我已经送了这只小山羊，你却没有找到她。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“免得我们受辱”或“免得我们遭人嘲笑”。希伯来语表达的是成为受人轻蔑或讥笑的对象。
    reason: 词义有“轻蔑、羞辱、嘲弄”等相近可能，正文采用自然且贴合语境的“成为笑柄”，脚注保留其他译法。
lexical_decisions:
- source_word: תִּקַּח לָהּ
  choice: 让她留着吧
  rationale: 该表达由阴性第三人称单数未完成式与לָהּ构成，在语境中带有准许、让步意味。译文自然表达犹大同意那女子留下抵押物；原文未明说宾语，中文也不必补出。
- source_word: פֶּן נִהְיֶה לָבוּז
  choice: 免得我们成为笑柄
  rationale: פֶּן表示为避免某种结果；בּוּז涉及轻蔑、羞辱或嘲弄。“成为笑柄”既传达社会性的羞耻和讥笑，也符合现代汉语表达。
- source_word: הִנֵּה
  choice: 看
  rationale: הִנֵּה在此引人注意接下来的事实。“看”保留其提示作用，又避免使用较古雅的“看哪”。
- source_word: שָׁלַחְתִּי הַגְּדִי הַזֶּה
  choice: 我已经把这只小山羊送去了
  rationale: גְּדִי指山羊幼崽，译作“小山羊”清楚自然；保留指示词“这只”。“已经……送去了”体现完成动作及其与当前处境的关联。
- source_word: וְאַתָּה לֹא מְצָאתָהּ
  choice: 可是你没有找到她
  rationale: וְ在这里连接前后相反的事实，译作“可是”更能体现转折。动词后的阴性单数宾语后缀指所寻找的女子，因此译作“她”。
- source_word: יְהוּדָה
  choice: 犹大
  rationale: 采用现代中文圣经传统中通行的人名译法。
