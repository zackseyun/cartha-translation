  to: 他问：“我该给你什么作抵押物呢？”她说：“你的印章、你的带子，还有你手里的杖。”他就把这些给了她，与她同房[a]；她便因他怀了孕。
  rationale: 修订以消除不自然的“从他怀了孕”，并以“因他怀了孕”保留לוֹ所表达的父系关联。将“印章带”改为“带子”，避免把原文未明说的物件关系具体化；“抵押物”则更清楚地表达所要求的担保物。其余措辞保留原译的庄重、现代叙事风格及原文的性行为委婉表达。
