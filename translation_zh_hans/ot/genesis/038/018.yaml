base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/018.yaml
  text: He said[a], “What pledge shall I give you?” And she said, “Your seal, your cord, and your staff that is in your hand.” So he gave them to her and went in to her[c][b], and she conceived by him.
translation:
  language: zh_hans
  text: 他问：“我该给你什么作抵押物呢？”她说：“你的印章、你的带子，还有你手里的杖。”他就把这些给了她，与她同房[a]；她便因他怀了孕。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “与她同房”是希伯来语表示发生性关系的委婉说法。
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֵרָבוֹן
  choice: 抵押
  rationale: 指在随后付款前交出的担保物；中文用“作抵押”自然地表达其功能，又不把它限定为商业定金。
- source_word: חֹתָמְךָ
  choice: 你的印章
  rationale: 该词指用于确认身份的印章或印鉴，原文没有说明是戒指，故不译作“印戒”。
- source_word: פְתִילֶךָ
  choice: 印章带
  rationale: פְּתִיל本义为绳、带；此处很可能是系印章的带子。译作“印章带”使三个物件之间的关系清楚，同时不额外指定佩戴方式。
- source_word: מַטְּךָ אֲשֶׁר בְּיָדֶךָ
  choice: 你手里的杖
  rationale: 保留原文具体的“在手里”意象；“杖”简洁庄重，符合随身所持物件的语境。
- source_word: וַיִּתֶּן לָּהּ
  choice: 他就把这些给了她
  rationale: 希伯来文未明说代词宾语，中文补出“这些”，自然回指前述三样物件。
- source_word: וַיָּבֹא אֵלֶיהָ
  choice: 与她同房
  rationale: 这是希伯来语表示性交的惯用委婉语；“同房”在现代中文中清楚、庄重，并保留委婉语体。
- source_word: וַתַּהַר לוֹ
  choice: 她便从他怀了孕
  rationale: 既表达“怀孕”，也保留לוֹ所标示的父系关系；“从他怀了孕”比单说“怀孕了”更贴近原文。
