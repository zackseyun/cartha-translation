  yaml_path: translation/ot/genesis/038/006.yaml
  text: And Judah took a wife for Er his firstborn, and her name was Tamar.
translation:
  language: zh_hans
  text: 犹大为他的长子珥娶了一个妻子，名叫她玛。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקַּח
  choice: 娶了
  rationale: לָקַח的基本义是“取、拿”，但此处是父亲为儿子迎娶妻子的婚姻语境；汉语用“为……娶了”既自然，也保留犹大促成婚配的动作。
- source_word: אִשָּׁה
  choice: 一个妻子
  rationale: 在为珥成婚的语境中，该词明确指“妻子”，而非泛指“女人”。
- source_word: לְעֵר
  choice: 为……珥
  rationale: 介词לְ在这里表示动作所为了的对象；“为珥娶”符合现代汉语表达。
- source_word: בְּכוֹרוֹ
  choice: 他的长子
  rationale: בְּכוֹר指头生的儿子；叙事语境中译作“长子”自然清楚，同时保留家庭次序的含义。
- source_word: וּשְׁמָהּ
  choice: 名叫
  rationale: 这是希伯来语常见的报姓名句式；“名叫”比逐字译作“她的名字是”更符合现代汉语叙事。
- source_word: תָּמָר
  choice: 她玛
  rationale: 按中文圣经人名的通行音译处理。
