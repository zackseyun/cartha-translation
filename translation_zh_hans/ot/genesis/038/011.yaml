  naturalness: “你回你父亲家里守寡”虽可理解，但“回”既提前加入了移动方向，也使居住命令略显不够清楚。改为“你要在你父亲家里守寡”更自然且贴合原文。以“心里想”引出内心言语，符合现代汉语叙事习惯。
  terminology: “儿媳”“守寡”“示拉”“恐怕”“哥哥们”均恰当。“哥哥们”在上下文中准确指示拉的两位年长兄弟。保留脚注，说明“说”可引出内心想法，且标记置于相应词语后。
