base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/011.yaml
  text: Then Judah said to Tamar his daughter-in-law[a], “Remain a widow in your father’s house until my son Shelah grows up,” for he said, “Lest he also die like his brothers.” So Tamar went and lived in her father’s house.
translation:
  language: zh_hans
  text: 犹大对他的儿媳他玛说：“你要在你父亲家里守寡，等我儿子示拉长大。”因为他心里想[a]：“恐怕他也会像他的哥哥们一样死去。”于是他玛去了，住在她父亲家里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为他说。”希伯来文的“说”在这里可引出心里的想法。
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁבִי אַלְמָנָה
  choice: 守寡
  rationale: 该命令直译为“以寡妇身份居住/留下”。现代汉语“守寡”自然表达持续处于寡妇身份的意思，并未加入终身不嫁的含义；与“回你父亲家里”合用也符合语境。
- source_word: בֵית אָבִיךְ
  choice: 你父亲家里
  rationale: 指回到父亲的家或家户中居住；“家里”比“房屋中”自然，也保留家庭归属和居所两层含义。
- source_word: עַד יִגְדַּל שֵׁלָה בְנִי
  choice: 等我儿子示拉长大
  rationale: יגדל在此指长大、成熟；译作“长大”清楚自然，又不把婚龄等语境推论直接写进正文。
- source_word: כִּי אָמַר
  choice: 因为他心里说
  rationale: אמר字面为“说”，但此处显然引出犹大的内在盘算。正文用汉语惯用的“心里说”，兼顾原词意象和叙事功能，并以脚注保留较形式对应的译法。
- source_word: פֶּן
  choice: 恐怕
  rationale: פֶּן引出所担忧或设法避免的结果。“恐怕”在现代汉语中准确表达犹大的忧惧和顾虑。
- source_word: כְּאֶחָיו
  choice: 像他的哥哥们一样
  rationale: 后缀所指为示拉，因此是“他的”；结合上下文，珥和俄南都是示拉的兄长，译作“哥哥们”比泛称“弟兄们”更明确，且未超出叙事已提供的信息。
- source_word: וַתֵּלֶךְ תָּמָר וַתֵּשֶׁב
  choice: 于是他玛回去，住在
  rationale: 两个连续叙事动词分别表示离去和居住。按目的地语境将“去”自然译为“回去”，再以“住在”表达持续居留。
- source_word: כַּלָּתוֹ
  choice: 儿媳
  rationale: 标准亲属称谓，简洁自然，准确表达他玛与犹大的关系。
- source_word: בֵּית אָבִיהָ
  choice: 她父亲家里
  rationale: 与前文对应，表达他玛实际回到父亲的家中居住。
theological_decisions:
- issue: 犹大是否真心承诺日后把示拉给他玛
  choice: 正文只保留“等我儿子示拉长大”的话，并紧接其内心担忧，不判断承诺是否真诚。
  alternative: 明确译成犹大以此为借口欺骗或拖延他玛。
  rationale: 本节揭示犹大害怕示拉死亡，却没有直接说明他是否已决定永不履行义务；译文不应提前消除这种叙事张力。
- issue: 两位兄长死亡的原因
  choice: 仅译出犹大所想的“像他的哥哥们一样死去”。
  alternative: 补充说明他认为他玛会导致示拉死亡，或说明死亡是上帝的审判。
  rationale: 本句呈现犹大的顾虑，但没有明确交代他如何理解因果关系；应保留这种含混，不把前文神学信息或人物可能的误解添加进本节。
translation_notes:
  register: 采用现代、庄重而口语可懂的叙事体。“守寡”“心里说”“恐怕”均为普通读者熟悉的表达；避免古雅的“寡居”“惟恐”和带解释性的增译。脚注标记[a]已置于对应正文处。
