base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/020.yaml
  text: Then Judah sent the young goat by the hand of his Adullamite friend to take back the pledge from the woman's hand[c][b][a], but he did not find her.
translation:
  language: zh_hans
  text: 于是，犹大托他的亚杜兰朋友把那只小山羊送去，要从那女人手中取回担保物[a]；可是他的朋友没有找到她。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “担保物”也可译作“抵押物”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: 于是……托……送去
  rationale: 承接叙事次序；结合 בְיַד 所表达的代理关系，现代汉语用“托……送去”自然且准确。
- source_word: גְּדִי הָעִזִּים
  choice: 那只山羊羔
  rationale: 指幼小的山羊，并以“那只”衔接前文所许诺的同一只羊羔。
- source_word: בְּיַד רֵעֵהוּ הָעֲדֻלָּמִי
  choice: 托他的亚杜兰朋友
  rationale: בְיַד 字面为“借……的手”，在这里表示由某人代办；“托”符合现代汉语习惯。“朋友”自然表达 רֵעֵהוּ 的同伴关系。
- source_word: לָקַחַת
  choice: 取回
  rationale: 目的不只是“拿”，而是收回先前交给那女人的物件。
- source_word: הָעֵרָבוֹן
  choice: 抵押物
  rationale: 指作为担保而交出的具体物件；“抵押物”比单说“抵押”更明确，也符合本段语境。
- source_word: מִיַּד הָאִשָּׁה
  choice: 从那女人手中
  rationale: 保留希伯来语“从……手中”的具体表达，在现代汉语中也自然，表示从她占有或保管之下取回。
- source_word: וְלֹא מְצָאָהּ
  choice: 可是他的朋友没有找到她
  rationale: “可是”呈现任务与结果的反差；补出“他的朋友”以避免汉语中误解为犹大亲自寻找。
theological_decisions: []
translation_notes:
