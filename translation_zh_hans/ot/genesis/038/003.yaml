  yaml_path: translation/ot/genesis/038/003.yaml
  text: She conceived and bore a son[a], and he called his name Er.
translation:
  language: zh_hans
  text: 她怀孕，生了一个儿子；他[a]给孩子取名叫珥。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“他称他的名为珥”；动词为阳性单数，主语最自然的理解是犹大。
    reason: 说明原文阳性单数动词及其主语的自然判断，同时保留正文中未明示的指代空间。
lexical_decisions:
- source_word: וַתַּהַר
  choice: 她怀孕
  rationale: 动词 הרה 表示怀孕或受孕；“怀孕”是现代汉语叙事中自然、清楚的表达。
- source_word: וַתֵּלֶד בֵּן
  choice: 生了一个儿子
  rationale: ילד 的 Qal 形式在此指生产，בֵּן 指儿子；这一译法简洁自然，并保留亲属意义。
- source_word: וַיִּקְרָא אֶת־שְׁמוֹ
  choice: 犹大给他取名叫
  rationale: 原文动词为阳性单数，主语最自然地承接前文的犹大；现代汉语若只译“他”可能指代不清，因此明示“犹大”，同时以“取名叫”自然传达“称他的名为”的意思。
- source_word: עֵר
  choice: 珥
  rationale: 采用现代中文圣经传统中该人名的通行音译。
theological_decisions:
- issue: וַיִּקְרָא（“他取名”）的主语
  choice: 正文译作“犹大给他取名叫珥”
  alternative: 译作“她给他取名叫珥”，或用“他名叫珥”回避主语
  rationale: 希伯来文动词明确为阳性单数，与前面的阴性单数动词形成转换，因此不应改成母亲作主语。结合上下文，犹大是最自然的所指；脚注说明原文形式，以保留语法依据及少量指代上的解释空间。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“怀孕，生了一个儿子”保持希伯来文连续动作的节奏；“取名叫”比逐字译作“称他的名为”更符合现代普通话。
