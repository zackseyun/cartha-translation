base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/024.yaml
  text: And it happened about three months later that Judah was told[a], “Tamar your daughter-in-law has acted as a prostitute, and behold, she is also pregnant by prostitution.” Then Judah said, “Bring her out[b], and let her be burned.”
translation:
  language: zh_hans
  text: 约三个月后，有人告诉犹大说：“你的儿媳他玛行了淫[a]，而且你看，她还因淫行怀了孕[b]。”犹大说：“把她带出来，让她被烧死！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“作了妓女”；较宽泛地说，也可译为“犯了淫乱”。
    reason: lexical_alternative
  - marker: b
    text: 也可译：“因淫乱怀孕”或“由淫行而怀孕”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּמִשְׁלֹשׁ חֳדָשִׁים
  choice: 约三个月后
  rationale: 以自然的现代汉语表达叙事推进和约数含义；כְּ表明时间是大约三个月。
- source_word: וַיֻּגַּד לִיהוּדָה לֵאמֹר
  choice: 有人告诉犹大说
  rationale: 原文是被动式“有人向犹大报告”，汉语用不定主语既自然，也保留报告者未被指明这一点。
- source_word: זָנְתָה
  choice: 行了淫
  rationale: זנה可指卖淫，也可指带有娼妓意象的非法性行为。“行了淫”保留控告语气，又不武断认定存在金钱交易。
- source_word: כַּלָּתֶךָ
  choice: 你的儿媳
  rationale: 准确对应亲属称谓，符合现代汉语。
- source_word: וְגַם הִנֵּה
  choice: 而且你看，她还
  rationale: “而且……还”表达וְגַם的递进，“你看”传达הִנֵּה所带的强调和惊讶。
- source_word: הָרָה לִזְנוּנִים
  choice: 因淫行怀了孕
  rationale: “怀了孕”准确表达הָרָה；“因淫行”保留לִזְנוּנִים的因果意味，并与前面的זנה形成词义呼应。
- source_word: הוֹצִיאוּהָ
  choice: 把她带出来
  rationale: 准确表达复数命令式及阴性单数宾语；不额外指定执行者。
- source_word: וְתִשָּׂרֵף
  choice: 让她被烧死
  rationale: 保留尼法勒式的被动表达和命令意味；“烧死”在汉语中清楚传达这里作为处刑判决的语境。
theological_decisions:
- issue: 法律控告语境中的性行为用语
  choice: 采用“行了淫／因淫行”，并以脚注保留“作了妓女”等译法。
  alternative: “卖淫了／因卖淫怀孕”或较宽泛的“犯了淫乱／因性方面的不道德行为怀孕”。
  rationale: 原文使用זנה与זנונים这一组同源词，带有娼妓或卖淫的意象，但未必明确涉及金钱交易。译文保留两处词义呼应，同时避免把较具体的解释写死。
- issue: 犹大命令的力度与语态
  choice: “把她带出来，让她被烧死！”
  alternative: “把她带出来烧死！”或“把她带出来焚烧。”
  rationale: 原文是立即执行的严厉命令，动词为被动形式。主译文保留被动意味，也按语境清楚表达这是处死的判决，而不指定具体执行者。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“行了淫／淫行”略带司法控告色彩，适合本节语境；避免使用过于古雅的“有孕”“焚烧之”等表达。脚注标记[a]、[b]均置于所解释的词组之后。
