base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/026.yaml
  text: Then Judah recognized them and said[a], “She is more righteous than I[b], because I did not give her to Shelah my son.” And he did not know her again.
translation:
  language: zh_hans
  text: 犹大认出那些东西，就说：“她比我更有理[a]，因为我没有把她给我的儿子示拉。”此后，他没有再与她同房[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“她比我更公义”。这里是说，在这件事上她比犹大更站得住脚。
    reason: 词义选择及比较结构说明
  - marker: b
    text: 希伯来文直译为“认识她”，是指发生性关系的委婉说法。
    reason: 文化与语言说明
lexical_decisions:
- source_word: וַיַּכֵּר
  choice: 认出那些东西
  rationale: 动词表示认出或辨认；希伯来文未明说宾语，中文依第25节的近文语境补出“那些东西”，指印章、带子和杖。
- source_word: צָדְקָה מִמֶּנִּי
  choice: 她比我更有理
  rationale: 介词 מִן 构成比较，表示她在这件事上比犹大更站得住脚。“更有理”既自然，也保留了相对性的道德判断，不把她说成绝对无罪。
- source_word: כִּי עַל כֵּן
  choice: 因为
  rationale: 此处引出犹大承认她更有理的原因；译作“因为”准确而自然。
- source_word: לֹא נְתַתִּיהָ לְשֵׁלָה בְנִי
  choice: 我没有把她给我的儿子示拉
  rationale: 贴近原文“把她给我儿子示拉”；结合上下文，读者可明白这是指让她与示拉成婚。
- source_word: וְלֹא יָסַף עוֹד לְדַעְתָּהּ
  choice: 此后，他没有再与她同房
  rationale: ידע（知道、认识）在这里是性关系的委婉语。中文若直译“认识她”会造成误解，因此在正文中明确表达其语境含义；“没有再”体现 יָסַף עוֹד 的停止与不再重复。
- source_word: יְהוּדָה
  choice: 犹大
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: שֵׁלָה
  choice: 示拉
  rationale: 采用现代中文圣经传统中通行的人名译法。
theological_decisions:
- issue: 犹大认错时对她的道德评价
  choice: 译作“她比我更有理”，表达她在这件事上相对于犹大更合乎正当。
  alternative: “她比我更公义”或“她是对的，我不是”
  rationale: 原文是比较结构，既有道德分量，又是针对当前事件的相对判断。译文不把这句话弱化为单纯程序上的合理，也不扩大为宣告她全然无罪。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“就说”承接认出物件后的反应；“与她同房”是现代中文读者容易理解且不过分露骨的表达。所有脚注标记均置于对应词句之后。
