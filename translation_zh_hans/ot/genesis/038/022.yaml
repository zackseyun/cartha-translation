base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/022.yaml
  text: So he returned to Judah and said[a], “I did not find her, and also the men of the place said[b], ‘There has been no cult prostitute here.’”
translation:
  language: zh_hans
  text: 他回到犹大那里，说：“我没有找到她；当地人也说：‘这里没有祭祀娼妓[a]。’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “祭祀娼妓”：希伯来语 qĕdēšâ，字面与“圣”或“分别出来”有关；传统上常理解为与祭祀相关的娼妓，也可译作“庙妓”。该词所指的具体社会制度仍有争议。
    reason: 说明该词与上下文普通妓女称谓不同，并保留传统译法及其历史含义的不确定性。
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: 他回到
  rationale: 以自然的汉语叙事顺序表达 wayyiqtol 所推进的后续动作。
- source_word: אֶל־יְהוּדָה
  choice: 犹大那里
  rationale: אֶל 表示朝向某人；加“那里”使现代汉语更自然，并明确他回到犹大身边。
- source_word: לֹא מְצָאתִיהָ
  choice: 我没有找到她
  rationale: 准确表达否定完成式所报告的既成结果，不增添“无法”等情态含义。
- source_word: וְגַם
  choice: 而且……也
  rationale: 保留原文追加另一项报告的语气，同时符合现代汉语表达习惯。
- source_word: אַנְשֵׁי הַמָּקוֹם
  choice: 那地方的人
  rationale: 原文直译为“那地方的男人们”；此处指当地受询问的居民，汉语用“人”自然且不影响所指。
- source_word: לֹא הָיְתָה בָזֶה
  choice: 这里没有过
  rationale: 用汉语存在句表达该处不曾有此类女子；“这里”自然对应 בָזֶה。
- source_word: קְדֵשָׁה
  choice: 祭祀娼妓
  rationale: 保留该词区别于上下文普通“妓女”的祭祀或宗教关联，同时避免“庙妓”可能暗示正式庙宇编制的较窄含义。
theological_decisions:
- issue: קְדֵשָׁה 的宗教性与性交易含义
  choice: 正文译作“祭祀娼妓”，并以脚注说明词义
  alternative: 庙妓；被分别为圣的女子
  rationale: 译文需保留该称谓的宗教祭祀色彩及其在本语境中的性交易含义，却不把它过度限定为某座庙宇中的正式职位。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“犹大那里”与“这里没有过”使叙事自然；分号呈现使者报告中的两项内容。脚注标记已在正文对应词后标出。
