  naturalness: “这里没有过祭祀娼妓”在现代汉语中略显生硬，且“没有过”容易把原文的地点性否认扩展为强调历来从未有过。改为“这里没有祭祀娼妓”更自然，也更贴近原文的存在性否认。“当地人”简洁自然地表达“那地方的人”。
  terminology: “祭祀娼妓”可保留英语审校轨迹所采用的 cult prostitute 理解，但不宜在脚注中把该词定义为确定的“与不正当祭祀性行为有关”，因为其具体制度性含义在学界有争议。脚注改为说明其字面义、传统译法和争议，避免将“庙妓”所暗示的正式庙宇制度当作确定事实。
