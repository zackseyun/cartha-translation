  text: וַ/יְהִ֗י עֵ֚ר בְּכ֣וֹר יְהוּדָ֔ה רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה וַ/יְמִתֵ֖/הוּ יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/007.yaml
  text: Er[a], Judah’s firstborn, was evil in the sight of Yahweh, and Yahweh put him to death.
translation:
  language: zh_hans
  text: 犹大的长子珥在雅威眼中是邪恶的，雅威就杀了他[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较形式化地译为：“雅威使他死亡。”
    reason: 词义替代译法：反映希伯来语使役形的较逐字表达。
lexical_decisions:
- source_word: וַיְהִי
  choice: 是
  rationale: 叙事性连接形式推进叙述；现代汉语不必机械补出“于是”或“现在”，由整句语序自然承接上下文。
- source_word: עֵר
  choice: 珥
  rationale: 采用现代中文圣经中通行的人名音译。
- source_word: בְּכוֹר יְהוּדָה
  choice: 犹大的长子
  rationale: 准确表达所属关系和出生次序，符合现代汉语亲属称谓习惯。
- source_word: רַע
  choice: 恶的
  rationale: 这里是在雅威面前的道德评价，不是一般意义上的不好、遭祸或品质低劣；“恶的”保留原文简洁而严肃的判断。
- source_word: בְּעֵינֵי יְהוָה
  choice: 在雅威眼中
  rationale: 保留希伯来语“在……眼中”的评价性惯用语，现代汉语也自然易懂。
- source_word: יְהוָה
  choice: 雅威
  rationale: 将四字神名作为专名音译，不以“主”等称号替代。
- source_word: וַיְמִתֵהוּ
  choice: 处死了他
  rationale: מות的使役形明确把珥的死亡归于雅威的行动；“处死”比直译“使他死”自然庄重，也不补充原文未说明的方式。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名，因此以“雅威”音译，保留其专名性质，而不以称号替换。
- issue: 珥之死中的神圣行动主体
  choice: 雅威就处死了他
  alternative: 雅威使他死了；雅威杀了他
  rationale: 希伯来语使用מות的使役形，直接将死亡归因于雅威；译文既不淡化这一行动，也不推断其手段或添加原文没有给出的解释。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“在雅威眼中是恶的”保留原文的评价结构与神学张力；句首不另加“现在”或“于是”，避免把叙事连接词过度实词化。
