  text: וַ/יַּרְא שָׁ֧ם יְהוּדָ֛ה בַּת אִ֥ישׁ כְּנַעֲנִ֖י וּ/שְׁמ֣/וֹ שׁ֑וּעַ וַ/יִּקָּחֶ֖/הָ וַ/יָּבֹ֥א אֵלֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/002.yaml
  text: There Judah saw the daughter of a Canaanite man whose name was Shua[b][a], and he took her and went in to her.
translation:
  language: zh_hans
  text: 犹大在那里看见一个迦南人的女儿；那人名叫书亚[a]。犹大娶了她，与她同房[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译：“他的名字叫书亚。”这里的“他”指那位迦南人，不是他的女儿。
    reason: lexical_alternative
  - marker: b
    text: “与她同房”是希伯来语表示发生性关系的委婉说法。
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּרְא שָׁם
  choice: 在那里看见
  rationale: 按叙事次序直译“在那里看见”，自然保留地点副词和ראה的基本义，不扩释为“遇见”或“注意到”。
- source_word: בַּת אִישׁ כְּנַעֲנִי
  choice: 一个迦南人的女儿
  rationale: 准确表达“一个人，即迦南人，的女儿”这一修饰关系，同时符合现代汉语习惯。
- source_word: וּשְׁמוֹ שׁוּעַ
  choice: 那人名叫书亚
  rationale: 阳性代词后缀指向前述迦南男子；补出“那人”可避免汉语读者误以为书亚是女儿的名字。
- source_word: וַיִּקָּחֶהָ
  choice: 娶了她
  rationale: לקח以女子为宾语时，在本叙事语境中表示娶她为妻；汉语若直译“把她带走”容易造成错误理解。
- source_word: וַיָּבֹא אֵלֶיהָ
  choice: 与她同房
  rationale: 这是表示发生性关系的希伯来语委婉说法；“同房”在现代中文圣经叙事中清楚、庄重，也保留委婉语气。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“娶了她”传达语境中的婚姻含义；“与她同房”既清楚又不过度露骨。脚注澄清“书亚”的所指及希伯来语习语。
