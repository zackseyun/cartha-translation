base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/012.yaml
  text: After many days had passed[a], the daughter of Shua, Judah’s wife, died. When Judah was comforted[c][b], he went up to Timnah to his sheep shearers—he and his friend Hirah the Adullamite.
translation:
  language: zh_hans
  text: 过了许久[a]，犹大的妻子、书亚的女儿[b]死了。犹大得了安慰之后[c]，就和他的朋友、亚杜兰人希拉一同上到亭拿，到给他的羊剪毛的人那里去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“过了多日”。直译是“日子增多了”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文作“书亚的女儿”；有人将其视为人名“拔书亚”。
    reason: alternative_reading
  - marker: c
    text: 也可译“犹大得了安慰”。这里的希伯来动词是指他在哀悼后得到安慰。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְבּוּ הַיָּמִים
  choice: 过了许久
  rationale: 原文直译为“日子增多了”，是表示经过较长时间的叙事习语；“过了许久”自然、简洁，并以脚注保留字面形式。
- source_word: וַתָּמָת
  choice: 死了
  rationale: מות在叙事语境中的常规含义。
- source_word: בַּת שׁוּעַ
  choice: 书亚的女儿
  rationale: 原文是清楚的亲属结构，不必直接视为复合人名；正文保留其关系性表达。
- source_word: אֵשֶׁת יְהוּדָה
  choice: 犹大的妻子
  rationale: 以现代汉语自然表达希伯来文属格结构。
- source_word: וַיִּנָּחֶם יְהוּדָה
  choice: 犹大得了安慰之后
  rationale: נחם的Nifal形在此指丧亲哀悼后得到安慰，不是“悔改”；“之后”体现它与下一行动的时间关系。
- source_word: וַיַּעַל
  choice: 上
  rationale: 保留עלה所含“上去”的方向意味。
- source_word: עַל גֹּזֲזֵי צֹאנוֹ
  choice: 到给他的羊剪毛的人那里
  rationale: 介词加分词指前往为他的羊群剪毛的人那里；这样既保留人员焦点，也符合现代汉语。
- source_word: הוּא וְחִירָה רֵעֵהוּ
  choice: 和他的朋友……希拉一同
  rationale: 自然表达同行关系，并将רֵעַ译为“朋友”。
- source_word: הָעֲדֻלָּמִי
  choice: 亚杜兰人
  rationale: 该族属形容词表明希拉来自亚杜兰。
- source_word: תִּמְנָתָה
  choice: 上亭拿
  rationale: 地名后的方向词尾表示朝亭拿而去；与עלה合译为“上亭拿”。
theological_decisions:
- issue: וַיִּנָּחֶם是否表示悔改
  choice: 理解为丧亲后得了安慰
  alternative: 犹大后悔了／改变了心意
  rationale: 上下文紧接妻子去世，Nifal形在此表示哀悼后受安慰；译作“悔改”会引入上下文没有支持的神学含义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“过了许久”避免生硬直译；“书亚的女儿”保留原文亲属表达；“上亭拿”保留方向色彩。所有脚注标记均已置于正文对应位置。
