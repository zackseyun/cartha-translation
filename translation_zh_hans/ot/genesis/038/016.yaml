base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/016.yaml
  text: So he turned aside to her by the road and said[a], “Please, let me come in to you,” for he did not know that she was his daughter-in-law. And she said, “What will you give me[b], that you may come in to me?”
translation:
  language: zh_hans
  text: 于是，犹大转到路边，走到她那里，说[a]：“请让我与你同房。”他原不知道她是自己的儿媳。她说：“你要给我什么，才可以与我同房呢[b]？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“到你那里去”，在这里是指发生性关系的委婉说法。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“你要付给我什么，才可以与我同房呢？”原文更直译为“你要给我什么……？”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּט אֵלֶיהָ אֶל־הַדֶּרֶךְ
  choice: 转到路边她那里
  rationale: נטה表示偏离原来的路线、转向某人；结合她在路边的叙事场景，此译法兼顾动作与地点。
- source_word: הָבָה נָּא
  choice: 请让我
  rationale: 这一组合表达敦促或请求；现代汉语用“请让我”自然、简洁。
- source_word: אָבוֹא אֵלַיִךְ / תָבוֹא אֵלַי
  choice: 与你同房 / 与我同房
  rationale: בוא אל在本语境中是性关系的委婉说法。汉语“同房”同样委婉而含义明确，比逐字译为“到你那里”更不易造成误解。
- source_word: כִּי לֹא יָדַע
  choice: 他原不知道
  rationale: כִּי在此引出解释性原因；中文调整为独立叙述句更自然，“原”体现该事实对前述行动的解释作用。
- source_word: כִּי כַלָּתוֹ הִוא
  choice: 她是自己的儿媳
  rationale: כַלָּה在这里明确指儿媳；“自己的”清楚指回犹大。
- source_word: מַה תִּתֶּן לִּי
  choice: 你要给我什么
  rationale: 保留 נתן“给”的宽泛字义，不在正文中直接收窄为“付给”；语境中的报酬含义由脚注说明。
- source_word: כִּי תָבוֹא אֵלַי
  choice: 才可以与我同房呢
  rationale: 此处כִּי连接所给之物与同房的条件或交换关系；“才可以”符合自然汉语对话，同时保留句中关系。
