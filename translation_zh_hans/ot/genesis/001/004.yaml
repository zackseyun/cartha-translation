base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/004.yaml
  text: And God saw that the light was good[a], and God separated the light from the darkness.
translation:
  language: zh_hans
  text: 上帝看见光是好的；上帝就把光和黑暗分开了[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“把光从黑暗中分开”；希伯来语动词也可表示区分两者。
    reason: 词义替代
lexical_decisions:
- source_word: וַיַּרְא
  choice: 看
  rationale: ראה在连续叙事形式中基本义为“看”；这里也含有评价性的察看，但译作“看”可保留其语义幅度，不额外解释。
- source_word: אֱלֹהִים
  choice: 上帝
  rationale: 该词虽为复数形式，在本节却与单数动词搭配，指独一的创造者；“上帝”是现代标准普通话中自然、庄重的称呼。
- source_word: אֶת
  choice: 不单独译出
  rationale: 这是直接宾语标记，汉语无需对应词，其语法功能由语序体现。
- source_word: הָאוֹר
  choice: 光
  rationale: 希伯来语有定冠词，指上一节刚被造出的特定之光；现代汉语在此无需另加“这”或“那”也能自然表达其特指性。
- source_word: כִּי
  choice: 是
  rationale: כִּי在此引出上帝所看见并判断的内容；汉语以“看光是好的”自然表达“看见光是好的”。
- source_word: טוֹב
  choice: 好的
  rationale: טוֹב是宽泛的肯定性评价“好”；“好的”既自然，也避免缩窄为“悦目”或“有益”。
- source_word: וַיַּבְדֵּל
  choice: 分开
  rationale: בדל可指分开、划分或区别。“分开”符合创造秩序的语境，同时不限定这种分隔究竟是空间、时间还是概念性的。
- source_word: בֵּין ... וּבֵין
  choice: 把……和……分开
  rationale: 希伯来语字面为“在……之间和在……之间”；配合汉语动词“分开”，用“把光和黑暗分开”最自然，并忠实表达两者被分隔。
- source_word: הַחֹשֶׁךְ
  choice: 黑暗
  rationale: 该词有定冠词，指前文已提到的黑暗；汉语裸名词“黑暗”在此已能表达特指，无需添加指示词。
theological_decisions:
- issue: 两小句都明确出现主语אֱלֹהִים
  choice: 两次都译作“上帝”
  alternative: 第二小句改用“他”或省略主语
  rationale: 原文在第二小句明确重复“上帝”，保留重复可反映其节奏和强调，而不加入额外的神学解释。
- issue: 光与黑暗之间分隔的性质
  choice: 译作“分开”，不说明具体机制
  alternative: 译作“划分”或“区分开”
  rationale: 经文没有说明这种分隔是空间、时间还是概念性的；“分开”保留了原文的开放性。
translation_notes:
  register: 采用现代、庄重而通俗的标准普通话。“上帝看光是好的”简洁保留原文的察看与评价；分号呈现两个并列叙事小句，并保留主语的重复。脚注标记置于“分开了”之后，因为脚注说明的是该动词。
