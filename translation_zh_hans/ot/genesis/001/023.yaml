base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/023.yaml
  text: And there was evening[a], and there was morning—the fifth day.
translation:
  language: zh_hans
  text: 于是有了晚上，有了早晨——第五日。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或更直译：“于是有了晚上，于是有了早晨——第五日。”
    reason: 说明两个 וַיְהִי 的叙事性重复；正文为避免重复而作自然的汉语压缩，未改变原文的时间公式或对“日”的理解。
lexical_decisions:
- source_word: וַיְהִי
  choice: 有
  rationale: 此处是创世记第一章反复出现的叙事句式。译作“有”符合现代汉语表达，也保留了原文简洁、重复的节奏；较直译的“成了”列入脚注。
- source_word: עֶרֶב
  choice: 晚上
  rationale: 该名词指晚上或傍晚；“晚上”自然易懂，并与下句“早晨”形成平行。
- source_word: בֹּקֶר
  choice: 早晨
  rationale: 直接表达清晨或早晨，与“晚上”构成原文的对应结构。
- source_word: יוֹם
  choice: 日
  rationale: 此处标示有序数编号的创造日。“日”是准确而庄重的对应词，不额外限定其时长或性质。
- source_word: חֲמִישִׁי
  choice: 第五
  rationale: 序数词修饰“日”，直译为“第五”。
theological_decisions:
- issue: 创造日公式的性质
  choice: 保留“有晚上，有早晨，是第五日”这一时间性复句，不解释该“日”的长度或性质。
  alternative: 可作带有解释性的翻译，使其明确指二十四小时，或明确指一个时代或时期。
  rationale: 希伯来文本给出反复出现的“晚上—早晨”句式和带序数的“日”，但本节自身并未裁定后来关于创造日时长或文学性质的争论。译文因此保留经文本身的措辞与张力。
translation_notes:
  register: 采用现代、简洁而庄重的叙事语言；以“有晚上，有早晨”保留创世记第一章反复句式的节奏。脚注标记置于整节末尾，正文与脚注对应。
