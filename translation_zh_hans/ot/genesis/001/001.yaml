  yaml_path: translation/ot/genesis/001/001.yaml
  text: In the beginning, when God created the heavens and the earth[a]—
translation:
  language: zh_hans
  text: 起初，当上帝创造天地的时候[a]——
  philosophy: optimal-equivalence
  footnotes: &id001
  - marker: a
    text: 传统上译作完整的一句：“起初，上帝创造了天地。”希伯来文中 בְּרֵאשִׁית（“起初”）不带冠词，后接有限动词 בָּרָא（“创造”），较自然地可读作从属的时间分句，可与创世记2:4下半节的结构相比；主句到第3节才出现：“上帝说：‘要有光。’”
    reason: alternative_reading；采用规范术语“有限动词”，并澄清与创世记2:4的对应位置。
lexical_decisions:
- source_word: בְּרֵאשִׁית
  choice: 起初……的时候
  rationale: 无冠词的 בְּרֵאשִׁית 后接限定动词 בָּרָא，较自然地构成从属的时间表达。“起初”保留 רֵאשִׁית 的基本词义，“……的时候”则显明其与后文相连的句法关系。
- source_word: בָּרָא
  choice: 创造
  rationale: בָּרָא 是希伯来圣经中表达上帝创造作为的常用动词；“创造”直接、庄重，也不额外说明创造的方式。
- source_word: אֱלֹהִים
  choice: 上帝
  rationale: 该词形态上是复数形式，但此处搭配单数动词 בָּרָא，所指为独一的上帝。
- source_word: אֵת
  choice: 不另译（直接宾语标记）
  rationale: אֵת 标示确定的直接宾语，现代汉语没有对应词，其语法功能由语序体现。
- source_word: הַשָּׁמַיִם
  choice: 天
  rationale: 在“天和地”这一概括整体受造界的配对表达中，现代汉语惯用单音节的“天”，无需机械复现希伯来语的复数形式。
- source_word: הָאָרֶץ
  choice: 地
  rationale: אָ֫רֶץ 可指“地”或“土地”；与“天”配对用于宇宙范围时，应译作“地”。
theological_decisions:
- issue: 开篇分句的句法
  choice: 译作从属时间分句：“起初，上帝创造天地的时候——”
  alternative: 译作独立完整句：“起初，上帝创造了天地。”
  rationale: בְּרֵאשִׁית 不带冠词，后面紧接限定动词 בָּרָא，这种结构较自然地可理解为从属时间分句，并可与创世记2:4下及何西阿书1:2的时间性开头比较。破折号保留句子尚未完结、通向后文主句的效果；同时以脚注保存传统的独立句读法，不让译文替读者消除真实的句法歧义。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“天地”是汉语中自然的整体性表达，对应希伯来文“天与地”这一涵盖受造万有的配对语。句末破折号表明本节按所选句法并非独立完句。
