  text: וַ/תּוֹצֵ֨א הָ/אָ֜רֶץ דֶּ֠שֶׁא עֵ֣שֶׂב מַזְרִ֤יעַ זֶ֨רַע֙ לְ/מִינֵ֔/הוּ וְ/עֵ֧ץ עֹֽשֶׂה פְּרִ֛י אֲשֶׁ֥ר זַרְע/וֹ ב֖/וֹ לְ/מִינֵ֑/הוּ וַ/יַּ֥רְא אֱלֹהִ֖ים כִּי טֽוֹב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/012.yaml
  text: And the earth brought forth vegetation[a], plants yielding seed according to their kinds, and trees bearing fruit in which is their seed, according to their kinds[b]. And God saw that it was good.
translation:
  language: zh_hans
  text: 于是，地长出了草木：结种子的植物，各从其类；结果子的树木，果子里有种子，各从其类。上帝看这是好的。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתּוֹצֵא
  choice: 长出了
  rationale: 该词是 יצא 的使役式叙事形态，表示地使草木生出；“地长出了”在现代汉语中自然，也保留大地生发植物的图景。
- source_word: הָאָרֶץ
  choice: 地
  rationale: 本章处于宇宙创造的语境；“地”既符合创世记第一章的惯用表达，也比“土地”更能涵盖整体性的受造大地。
- source_word: דֶּשֶׁא
  choice: 草木
  rationale: 这是新鲜绿色植物生长的集合词，并非只指草。“草木”简明自然，可概括随后列举的植物。
- source_word: עֵשֶׂב מַזְרִיעַ זֶרַע
  choice: 结种子的植物
  rationale: עֵשֶׂב 指草本植物或一般植物，分词结构说明其产生种子的能力；“结种子的植物”通顺且不作现代植物学的过度细分。
- source_word: לְמִינֵהוּ
  choice: 各从其类
  rationale: מין 指类别或种类，并非现代生物学术语“物种”；“各从其类”凝练、庄重，同时保留古代文本的分类语言。
- source_word: וְעֵץ עֹשֶׂה פְּרִי
  choice: 结果子的树木
  rationale: עֵץ 虽为单数形式，此处作集合用法；“结果子的树木”准确表达持续结果的性质。
- source_word: אֲשֶׁר זַרְעוֹ בוֹ
  choice: 果子里都有种子
  rationale: 希伯来语代词的具体所指在汉语中若逐字直译会显得含混；结合紧邻的 פְּרִי，“果子里都有种子”自然表达种子在果实之中的意思，同时不添加文本之外的信息。
- source_word: וַיַּרְא אֱלֹהִים כִּי טוֹב
  choice: 上帝看这是好的
  rationale: 保留创世记第一章反复出现的评价句式；“这是好的”在现代汉语中自然、庄重。
theological_decisions:
- issue: 如何表达受造物的类别而不引入现代生物分类学
  choice: 各从其类
  alternative: 各按其物种
  rationale: מין 表示类别或种类，但并不等同于现代科学定义的“物种”。采用“各从其类”可保留原文的分类概念，而不把后世科学或神学争论带入经文。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“草木”作为总称，后以“植物”和“树木”展开；保留两次“各从其类”的平行结构，以反映希伯来文的节奏与分类表达。
