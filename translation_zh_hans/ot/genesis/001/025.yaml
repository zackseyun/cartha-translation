language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יַּ֣עַשׂ אֱלֹהִים֩ אֶת חַיַּ֨ת הָ/אָ֜רֶץ לְ/מִינָ֗/הּ וְ/אֶת הַ/בְּהֵמָה֙ לְ/מִינָ֔/הּ וְ/אֵ֛ת כָּל רֶ֥מֶשׂ הָֽ/אֲדָמָ֖ה לְ/מִינֵ֑/הוּ וַ/יַּ֥רְא אֱלֹהִ֖ים כִּי טֽוֹב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/025.yaml
  text: And God made the beasts of the earth according to their kinds[a], and the livestock according to their kinds, and every creeping thing of the ground according to its kind[c][b]. And God saw that it was good.
translation:
  language: zh_hans
  text: 上帝造了地上的野兽，各从其类；又造了牲畜，各从其类；并造了地面上一切爬行的动物，各从其类[a]。上帝看这一切是好的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “类”指受造物的类别，不应被严格理解为现代生物学分类中的“物种”。
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: 造了
  rationale: עָשָׂה通常意为“做、制造”；在创造叙事中译作“造了”自然直接，也不增添原文未明说的塑造方式。
- source_word: אֱלֹהִים
  choice: 上帝
  rationale: 本章中该复数形态的名词与单数动词搭配，指独一的创造者；“上帝”是现代汉语中庄重而通行的译法。
- source_word: חַיַּת הָאָרֶץ
  choice: 地上的野兽
  rationale: 该短语在此与牲畜及爬行动物并列，主要指野生陆生动物；“野兽”保留类别区分，又比笼统的“动物”更准确。
- source_word: לְמִינָהּ / לְמִינֵהוּ
  choice: 各从其类
  rationale: מִין指种类或类别。“各从其类”准确、凝练，并避免将其等同于现代生物学的“物种”。
- source_word: הַבְּהֵמָה
  choice: 牲畜
  rationale: בְּהֵמָה在本处与野兽有别，尤指较大型的家养动物；“牲畜”比“牛”范围更合适。
- source_word: כָּל רֶמֶשׂ הָאֲדָמָה
  choice: 地面上一切爬行的动物
  rationale: רֶמֶשׂ指贴近地面活动的小动物；“爬行的动物”在现代汉语中清楚易懂。将אֲדָמָה译为“地面”，也保留它与前面אֶרֶץ“地”的用词差别。
- source_word: וַיַּרְא אֱלֹהִים כִּי טוֹב
  choice: 上帝看这一切是好的
  rationale: 这是创世记第一章反复出现的评价句。补出“这一切”符合汉语表达，并承接本节刚列出的受造之物。
theological_decisions:
- issue: 受造物类别是否采用现代科学分类术语
  choice: 各从其类
  alternative: 各从其物种
  rationale: 希伯来语מִין表示种类或类别，并不要求现代生物分类学意义上的“物种”；译文保留经文本身的分类方式。
- issue: 同一节中הָאָרֶץ与הָאֲדָמָה的区别
  choice: 地上……地面上
  alternative: 地上……地上
  rationale: 分别译作“地上”和“地面上”，在自然汉语中保留两个相关却不同的希伯来词所呈现的细微区别。
- issue: 评价句中省略主语所指的处理
  choice: 这一切是好的
  alternative: 是好的
  rationale: 原文的כִּי־טוֹב简洁而所指依语境确定；汉语补出“这一切”使句子完整，但不改变上帝对所造之物的肯定。
translation_notes:
  register: 采用现代、庄重、易懂的标准普通话。句式保留希伯来叙事的并列节奏；以“野兽—牲畜—爬行的动物”呈现原文三个类别，并用“地上—地面上”反映אֶרֶץ与אֲדָמָה的词汇区别。
