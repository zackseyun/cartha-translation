  text: וַ/יֹּ֣אמֶר אֱלֹהִ֗ים הִנֵּה֩ נָתַ֨תִּי לָ/כֶ֜ם אֶת כָּל עֵ֣שֶׂב זֹרֵ֣עַ זֶ֗רַע אֲשֶׁר֙ עַל פְּנֵ֣י כָל הָ/אָ֔רֶץ וְ/אֶת כָּל הָ/עֵ֛ץ אֲשֶׁר בּ֥/וֹ פְרִי עֵ֖ץ זֹרֵ֣עַ זָ֑רַע לָ/כֶ֥ם יִֽהְיֶ֖ה לְ/אָכְלָֽה־־׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/029.yaml
  text: And God said[a], “Behold, I have given you every seed-bearing plant that is on the face of all the earth, and every tree in which is the fruit of a tree bearing seed[c][b]. It will be for you as food.”
translation:
  language: zh_hans
  text: 上帝说：“看哪[a]，我把全地的地面上一切结种子的植物，以及一切果实里有种子的树[b]，都赐给你们。这一切要作你们的食物。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “看哪”是引人注意的表达，也可译作“看”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文按字面结构可译为“其中有结种子的树果实的每一棵树”；即树上有含种子的果实。
    reason: source_structure
lexical_decisions:
- source_word: אֱלֹהִים
  choice: 上帝
  rationale: 在现代普通话中自然、庄重，并在创造叙事中清楚指称独一的创造主；此处不额外加入原文没有的称号。
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留希伯来语引人注意的语用功能，同时采用现代读者仍能理解的庄重表达。
- source_word: נָתַתִּי
  choice: 我……都赐给你们
  rationale: 希伯来语完成式在此表示已经作出的赐予，且对当前仍然有效；“赐给”也自然表达上帝给予食物的语境。
- source_word: כָּל עֵשֶׂב זֹרֵעַ זֶרַע
  choice: 一切结种子的植物
  rationale: עֵשֶׂב泛指植物或草本植被，不限于现代汉语所谓可作调味品的“香草”；“结种子”自然表达分词结构。
- source_word: אֲשֶׁר עַל־פְּנֵי כָל־הָאָרֶץ
  choice: 全地面上
  rationale: 简明保留“在全地表面上”的空间意象，不将הָאָרֶץ擅自窄化为某个地区。
- source_word: אֲשֶׁר בּוֹ פְרִי עֵץ זֹרֵעַ זָרַע
  choice: 结有带籽果实的树
  rationale: 以自然汉语表达树上有果实、果实带种子的含义，同时不把种子的具体形态说得超过原文。
- source_word: לָכֶם יִהְיֶה לְאָכְלָה
  choice: 这一切要作你们的食物
  rationale: “这一切”承接前述两类植物，并保留希伯来语集合性单数谓语的整体视角；“要作……的食物”准确表达用途。
theological_decisions:
- issue: 这节经文所述食物赐予的范围
  choice: 按原文直译为上帝将结种子的植物和带籽果实的树赐给人作食物
  alternative: 加入这是否永久排除其他食物的解释
  rationale: 本节本身只陈述创造叙事此刻的赐予；译文不提前引入后文，也不据此裁定超出原文的饮食教义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“看哪”略带经文体色彩，用来保留原文的提示语气；其余句式尽量自然。“这一切”既避免汉语中生硬的单数代词，也反映原文把前述植物整体视为食物的表达。
