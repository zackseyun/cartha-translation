  text: וּֽ/לְ/כָל חַיַּ֣ת הָ֠/אָרֶץ וּ/לְ/כָל ע֨וֹף הַ/שָּׁמַ֜יִם וּ/לְ/כֹ֣ל רוֹמֵ֣שׂ עַל הָ/אָ֗רֶץ אֲשֶׁר בּ/וֹ֙ נֶ֣פֶשׁ חַיָּ֔ה אֶת כָּל יֶ֥רֶק עֵ֖שֶׂב לְ/אָכְלָ֑ה וַֽ/יְהִי כֵֽן־־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/030.yaml
  text: And to every beast of the earth[a], and to every bird of the heavens, and to everything that creeps on the earth in which there is a living creature, every green plant is for food[c][b]. And it was so.
translation:
  language: zh_hans
  text: 至于地上各样的走兽、天空各样的飞鸟，以及地上一切爬行、其中有生命的活物[a]，各样青绿的植物都作它们的食物。事就这样成了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “其中有生命的活物”原文直译可作“其中有活着的生命”；“生命”（נֶפֶשׁ）也可按较传统的用语译为“魂”。这里不是“生命之气”。
    reason: lexical_alternative
lexical_decisions:
- source_word: חַיַּת הָאָרֶץ
  choice: 地上各样的走兽
  rationale: 该结构指地上的动物；“走兽”在现代中文圣经语体中自然凝练，又不把范围限定为野生动物。
- source_word: עוֹף הַשָּׁמַיִם
  choice: 天空各样的飞鸟
  rationale: עוֹף可泛指飞行生物，但本段按受造物类别表达时，“飞鸟”清楚自然；“天空”准确传达שָׁמַיִם在此处的空间意义。
- source_word: כֹל רוֹמֵשׂ עַל הָאָרֶץ
  choice: 地上一切爬行的……活物
  rationale: 保留רמש的具体爬行意象，同时避免用现代动物分类意义较窄的“爬行动物”。
- source_word: אֲשֶׁר בּוֹ נֶפֶשׁ חַיָּה
  choice: 有生命的活物
  rationale: נֶפֶשׁ חַיָּה在创世记1章指活着的生物或生命体，不应与创世记2:7的“生命之气”混同。中文采用自然表达，并以脚注保留较贴近形式的译法。
- source_word: כָּל יֶרֶק עֵשֶׂב
  choice: 各样青绿的植物
  rationale: 组合词组指青绿的草本植物或植被；此译既保留“青绿”的意象，也比“青草”覆盖面更广。
- source_word: לְאָכְלָה
  choice: 作它们的食物
  rationale: לְ表示用途，意思是供食用。中文补出“它们”以明确前列动物与食物之间的关系。
- source_word: וַיְהִי כֵן
  choice: 事就这样成了
  rationale: 这是创世记1章反复出现的成就公式；该译庄重、自然，并表达所宣告之事随即实现。
theological_decisions:
- issue: 动物语境中נֶפֶשׁ חַיָּה的含义
  choice: 有生命的活物
  alternative: 有活的生命／有活的魂
  rationale: 该词组在本章用于动物，表示有生命的生物；译作“生命之气”会混同另一希伯来语词组נִשְׁמַת חַיִּים。主文不借“魂”引入后来的身魂二分观念，脚注则保留原文形式上的可能表达。
- issue: 本节省略而由上节承接的谓语
  choice: 用“都作它们的食物”构成中文完整句，不明说“我赐给”
  alternative: 我把各样青绿的植物赐给它们作食物
  rationale: 希伯来文本在本节没有重复29节的נָתַתִּי“我赐给”；中文名词性陈述既能形成完整句，也避免把承接成分直接写成本文明说的动词。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留创造叙事的列举节奏，以“天空”而非较古雅的“诸天”，并避免把רמש译成现代分类意义较窄的“爬行动物”。
