base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/003.yaml
  text: And God said[a], “Let there be light,” and there was light.
translation:
  language: zh_hans
  text: 上帝说[a]：“要有光。”就有了光。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“愿有光。”希伯来文使用祈愿式，表达意愿或命令。
    reason: 词义与语法上的可选译法
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 于是……说
  rationale: 该叙事性连续式推动情节向前；“于是”自然表达先后承接，同时不过度解释连接词。
- source_word: אֱלֹהִים
  choice: 上帝
  rationale: 此处虽为复数形式，所搭配的动词为单数，指独一的创造者；“上帝”是现代标准普通话中庄重而通行的译法。
- source_word: יְהִי
  choice: 要有
  rationale: 这是 היה 的祈愿式，用于表达意愿或命令；“要有”简洁自然，能体现创造性宣告的命令力量，同时保留其可理解为意愿表达的语法张力。
- source_word: אוֹר
  choice: 光
  rationale: 采用该词在本处的基本义“光”，不将其限定为某一种光源，也不作隐喻化处理。
- source_word: וַיְהִי
  choice: 就有了
  rationale: 该叙事性连续式陈述神发言后随即产生的结果；“就有了”在现代汉语中简洁地呈现即时实现的结果意味。
- source_word: אוֹר
  choice: 光
  rationale: 保留原文中“光”的重复，以凸显宣告与实现之间的直接对应。
theological_decisions:
- issue: 神创造命令的译法
  choice: 要有光
  alternative: 愿有光；光，出现吧
  rationale: 原文祈愿式兼具意愿和命令色彩。“要有光”既庄重自然，又保留有效命令的力量；脚注说明其也可译作愿望式，以免消除原文的语法张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“于是”衔接叙事，“要有光……就有了光”保留原文简洁、对称且有力的表达。
