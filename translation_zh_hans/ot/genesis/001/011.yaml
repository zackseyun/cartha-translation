  text: וַ/יֹּ֣אמֶר אֱלֹהִ֗ים תַּֽדְשֵׁ֤א הָ/אָ֨רֶץ֙ דֶּ֔שֶׁא עֵ֚שֶׂב מַזְרִ֣יעַ זֶ֔רַע עֵ֣ץ פְּרִ֞י עֹ֤שֶׂה פְּרִי֙ לְ/מִינ֔/וֹ אֲשֶׁ֥ר זַרְע/וֹ ב֖/וֹ עַל הָ/אָ֑רֶץ וַֽ/יְהִי כֵֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/011.yaml
  text: 'And God said[a], “Let the earth sprout vegetation: plants yielding seed, and fruit trees bearing fruit according to their kinds, with their seed in them[c][b], on the earth.” And it was so.'
translation:
  language: zh_hans
  text: 神说：“地要使植物在地上生长出来：结种子的草本植物，以及各从其类结果子的果树；种子在其中[a]。”事情就这样成了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“它的种子在其中”。“其中”可指果树，也可指果实。
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּדְשֵׁא
  choice: 要长出
  rationale: 这是דשא的使役式祈愿语气，命令对象是“地”；“要长出”既体现命令语气，也自然呈现植物从地里萌生的意象。
- source_word: דֶּשֶׁא
  choice: 植物
  rationale: 此词泛指新鲜绿色的植物生长，范围不限于“草”；译作“植物”可保留其集合性与广义。
- source_word: עֵשֶׂב
  choice: 草本植物
  rationale: 指非木本的植物；“草本植物”比单说“草”范围更准确，也避免“香草”等过窄理解。
- source_word: מַזְרִיעַ זֶרַע
  choice: 结种子的
  rationale: 分词加同根语义宾语描述植物持续具有产生种子的特征；“结种子的”简洁自然。
- source_word: עֵץ פְּרִי
  choice: 结果子的树
  rationale: 构造词组直指以果实为特征的树；此译比现代分类意味较强的“果树”更贴近上下文表达。
- source_word: עֹשֶׂה פְּרִי
  choice: 结果子的
  rationale: 分词表示树的典型活动；汉语用“结果子”自然保留农业意象。
- source_word: לְמִינוֹ
  choice: 各从其类
  rationale: 希伯来文为单数，具有逐类分配的作用；“各从其类”保留单数分配意味，又符合庄重而通顺的现代汉语。
- source_word: אֲשֶׁר זַרְעוֹ בוֹ
  choice: 果子里都有种子
  rationale: 关系从句的单数代词最自然地回指紧邻的“果子”；汉语以分配性“都”表达每一类果子自身含种子的意思。
- source_word: עַל הָאָרֶץ
  choice: 长在地上
  rationale: 原文是地点短语“在地上”；结合汉语句法补出“长”，使其归属清楚而不改变地点意义。
- source_word: וַיְהִי כֵן
  choice: 事情就这样成了
  rationale: 这是创世记第一章反复出现的实现公式；此译保留神命令随即实现的语气，并比“于是如此”更自然。
theological_decisions:
- issue: 受造植物类别的范围与性质
  choice: 按经文的现象性语言译为“植物、结种子的草本植物、结果子的树”，保留其类别区分。
  alternative: 形式化译作“青草、结种子的菜蔬、结果子的树”，或概括为“各种植物和树木”。
  rationale: 原文呈现有秩序的植物类别，却不是现代植物学分类。译文既不赋予经文后世科学精度，也不把原有区别压平。
- issue: “种子在其中”的指代
  choice: 正文译作“果子里都有种子”，让“其中”按最近的单数先行词“果子”理解。
  alternative: 理解为树或植物本身有种子，译作“本身都有种子”。
  rationale: 希伯来文的性数形式可支持紧邻的单数“果子”，但整体类别语境也容许较宽理解；正文采用句法上较直接的读法，并以脚注保留另一可能。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“各从其类”保留创世叙事的凝练节奏；避免使用容易把עֵשֶׂב窄化为可食用蔬菜的“菜蔬”。所有脚注标记均已置于正文相应位置。
