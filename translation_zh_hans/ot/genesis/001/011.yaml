  naturalness: 原译整体庄重通顺，但“果子里都有种子，长在地上”容易使“长在地上”仅修饰种子／果子，且将代词指向及范围说得过实。修订后以现代自然的句法保留类别和指代空间。
  terminology: “植物／草本植物／果树”能分别表达广义植被、非木本结籽植物和结果之树；“果树”是现代汉语中自然且不失原意的表达。“各从其类”保留叙事的凝练、庄重语域。
