revisions:
- from: 神说：“地要长出植物：结种子的草本植物，和结果子的树，各从其类，果子里都有种子[a]，长在地上。”事情就这样成了。
  to: 神说：“地要使植物在地上生长出来：结种子的草本植物，以及各从其类结果子的果树；种子在其中[a]。”事情就这样成了。
  rationale: 修订保留“地”受命使植物萌生的使役／愿望语气，明确“在地上”是全句的地点范围，并把“各从其类”置于其在原文中最直接关联的果树结果描述内。对于“种子在其中”，正文采用不预先判定先行词的表达，脚注说明果树与果实两种可行关联，避免原译将其限定为果子。
