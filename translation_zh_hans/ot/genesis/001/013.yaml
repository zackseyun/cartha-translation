  text: וַֽ/יְהִי עֶ֥רֶב וַֽ/יְהִי בֹ֖קֶר י֥וֹם שְׁלִישִֽׁי־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/013.yaml
  text: And there was evening[a], and there was morning—the third day.
translation:
  language: zh_hans
  text: 有晚上，有早晨；是第三日。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文语序为：“有晚上，有早晨，日第三。”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: 有
  rationale: 在这一反复出现的叙事句式中，היה 表示某一时段的出现或存在。中文用“有”最自然简洁，也能与“晚上”“早晨”构成庄重而有节奏的复句。
- source_word: עֶרֶב
  choice: 晚上
  rationale: 该词指傍晚或晚上；“晚上”是现代普通话中清楚自然的对应词，也保留了创造叙事中的固定表达。
- source_word: בֹּקֶר
  choice: 早晨
  rationale: 该词指早晨；“早晨”与“晚上”形成自然、清楚的对举。
- source_word: יוֹם
  choice: 日
  rationale: 此处指创造叙事中按次序编号的一日。“日”在庄重书面语中自然，并与序数“第三”搭配。
- source_word: שְׁלִישִׁי
  choice: 第三
  rationale: 该序数词意为“第三”，在此修饰“日”。
- source_word: וַיְהִי עֶרֶב וַיְהִי בֹקֶר
  choice: 有晚上，有早晨
  rationale: 保留两个并列分句及原文的反复节奏；现代汉语无需重复系词，两个“有”仍准确反映原文结构。
theological_decisions:
- issue: 如何翻译创造日的固定结语而不预先裁定其时长或文学功能
  choice: 有晚上，有早晨；这是第三日。
  alternative: 有晚上，有早晨，是第三日。
  rationale: 译文按原文陈述时间次序和日数，不添加“二十四小时”等解释，也不将“日”改释为时代或阶段，因此保留关于创造日性质的解释空间。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。分号清楚区分时间公式与日数标记；“这是”使中文成句自然，而脚注保留希伯来语省略系词的紧凑结构。
