language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֱלֹהִ֔ים נַֽעֲשֶׂ֥ה אָדָ֛ם בְּ/צַלְמֵ֖/נוּ כִּ/דְמוּתֵ֑/נוּ וְ/יִרְדּוּ֩ בִ/דְגַ֨ת הַ/יָּ֜ם וּ/בְ/ע֣וֹף הַ/שָּׁמַ֗יִם וּ/בַ/בְּהֵמָה֙ וּ/בְ/כָל הָ/אָ֔רֶץ וּ/בְ/כָל הָ/רֶ֖מֶשׂ הָֽ/רֹמֵ֥שׂ עַל הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/026.yaml
  text: Then God said[a], “Let us make man in our image, according to our likeness[d][c][b], and let them rule over the fish of the sea and over the birds of the heavens and over the livestock and over all the earth and over every creeping thing that creeps on the earth.”
translation:
  language: zh_hans
  text: 于是，上帝说：“我们来照着我们的形象，按着我们的样式造人[a]，让他们管理海里的鱼、天空中的飞鸟、牲畜、全地，以及地上一切在地上爬行的生物。”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “人”在希伯来文中是集合性单数，指人类这一类，所以后文用复数“他们”来承接。也可译作“人类”。
    reason: 说明 אָדָם 的集合性单数及原文由单数转为复数。
  - marker: b
    text: “我们来……我们的……”的复数形式依原文保留。对此有不同理解，包括上帝的自我商议、上帝向天上的议会说话；在基督教整本圣经的阅读中，也有人认为这与后来关于三一的启示相呼应。“管理”也可译作“管辖”。
    reason: 保留原文复数表达的解释开放性，并说明 רדה 的可行词义。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 于是……说
  rationale: 连续式叙事动词推进创造叙事；“于是”自然表达先后进展。
- source_word: אֱלֹהִים
  choice: 上帝
  rationale: 本处动词为单数，所指是独一的上帝；采用现代汉语中庄重而通行的称呼。
- source_word: נַעֲשֶׂה
  choice: 我们要……造
  rationale: 保留第一人称复数及商议、意愿语气，不改写成单数，也不预先判定复数的解释。
- source_word: אָדָם
  choice: 人
  rationale: 此处为集合性单数，指人类这一类；“人”既自然，又能与后面的复数“他们”形成原文所有的单复数转换。
- source_word: בְּצַלְמֵנוּ
  choice: 照着我们的形象
  rationale: “形象”对应 צלם；“照着”在汉语中自然表达作为范型或对应关系，同时保留与“样式”的词汇区别。
- source_word: כִּדְמוּתֵנוּ
  choice: 按着我们的样式
  rationale: דמות 表示相似、样式；此译保留两个近义表达的并列，不把二者合并或作教义性区分。
- source_word: וְיִרְדּוּ
  choice: 让他们管理
  rationale: 表达第三人称复数意愿式的目的或结果色彩；“管理”通俗庄重，并保留受托治理的基本语义。
- source_word: בִדְגַת הַיָּם
  choice: 海里的鱼
  rationale: 自然对应希伯来语属格结构。
- source_word: וּבְעוֹף הַשָּׁמַיִם
  choice: 天空的飞鸟
  rationale: עוף 指飞禽，שמים 在此语境中自然译作“天空”；“飞鸟”保留其飞行生物的类别意义。
- source_word: וּבַבְּהֵמָה
  choice: 牲畜
  rationale: בהמה 在本处指陆地上的家畜类；“牲畜”比泛称“动物”更准确。
- source_word: וּבְכָל הָאָרֶץ
  choice: 全地
  rationale: 在创世叙事中指整个大地；“全地”简洁地保留宇宙性范围。
- source_word: וּבְכָל הָרֶמֶשׂ הָרֹמֵשׂ עַל הָאָרֶץ
  choice: 地上一切爬行的生物
  rationale: 保留 רמש 及同根分词所表达的贴地移动类别，但避免汉语中生硬的同词重复。
theological_decisions:
- issue: “我们要……我们的形象……我们的样式”中的复数表达
  choice: 正文完整保留第一人称复数，不说明上帝在向谁说话。
  alternative: 将其解释为神圣自议、对天上议会说话，或在基督教正典阅读中视为与后来三一启示相符的暗示。
  rationale: 希伯来文本明确使用复数，但本节本身没有界定复数的对象或神学机制；翻译应保存其张力，而不把某一种解释写入正文。
- issue: אָדָם 的集合性单数
  choice: 译作“人”，并以复数“他们”承接。
  alternative: 译作“人类”或“世人”。
  rationale: 原文先用集合性单数“人”，随后转用复数动词；“人……他们”能够在自然汉语中保留这一结构及其神学含义。
- issue: 人对受造界的 רדה
  choice: 译作“管理”。
  alternative: 译作“统治”或“管辖”。
  rationale: “管理”保留行使权柄的核心意义，同时不额外赋予暴虐或剥削色彩；脚注列出更强调权柄的译法。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。句式紧凑，保留创造叙事的郑重感；不用古奥的“照我们的形像、按我们的样式”式表达，也不以性别化词语缩窄集合性 אָדָם 的范围。
