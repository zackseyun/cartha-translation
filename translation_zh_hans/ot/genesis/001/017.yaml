base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/017.yaml
  text: And God set them in the expanse of the heavens to give light on the earth[a].
translation:
  language: zh_hans
  text: 上帝把它们安置在天穹[a]中，使它们照亮大地。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “天穹”也可译作“诸天的广阔空间”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: 安置
  rationale: נתן在此表示把众光体置于特定位置；“安置”自然、庄重，并体现有意安排的语意。
- source_word: אֹתָם
  choice: 它们
  rationale: 指回前文的两个大光体和众星；现代汉语以“它们”清楚承接这些非人称对象。
- source_word: אֱלֹהִים
  choice: 上帝
  rationale: 在《创世记》1章中，该词虽为复数形式，却与单数谓语搭配，指独一的创造者；“上帝”是现代汉语通行译法。
- source_word: בִּרְקִיעַ
  choice: 在……穹苍中
  rationale: רָקִיעַ指铺展开的广阔空间。“穹苍”保留创造叙事的庄重语域及古代文本意象，同时避免加入现代科学解释。
- source_word: הַשָּׁמַיִם
  choice: 诸天的
  rationale: 保留希伯来语复数形式及其较庄重的表达；与“穹苍”组合为“诸天的穹苍”。
- source_word: לְהָאִיר
  choice: 使它们照亮
  rationale: 这是אור的使役式不定词，表达使光照出的功能；补出主语“它们”符合现代汉语习惯，也使所指清楚。
- source_word: עַל הָאָרֶץ
  choice: 大地
  rationale: עַל在此表示光照所及的对象。“照亮大地”是自然的现代汉语，并保留全地的宏阔语感。
theological_decisions:
- issue: 创造叙事中的宇宙空间用语רָקִיעַ
  choice: 译作“穹苍”
  alternative: 天空；穹顶；广阔空间
  rationale: “穹苍”既能承载原词所指铺展空间的古代叙事意象，又不把经文改写成特定的现代科学模型。脚注提供较直白的空间性译法，以保留词义幅度。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语；句式紧凑，承接前文创造众光体的叙事。保留“诸天”这一复数表达，并以脚注呈现רָקִיעַ的词义选择。
