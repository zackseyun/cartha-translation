source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֱלֹהִ֗ים יְהִ֤י מְאֹרֹת֙ בִּ/רְקִ֣יעַ הַ/שָּׁמַ֔יִם לְ/הַבְדִּ֕יל בֵּ֥ין הַ/יּ֖וֹם וּ/בֵ֣ין הַ/לָּ֑יְלָה וְ/הָי֤וּ לְ/אֹתֹת֙ וּ/לְ/מ֣וֹעֲדִ֔ים וּ/לְ/יָמִ֖ים וְ/שָׁנִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/014.yaml
  text: And God said[a], “Let there be lights in the expanse of the heavens to separate the day from the night, and let them be for signs and for appointed times[d][c][b], and for days and years.”
translation:
  language: zh_hans
  text: 上帝说：“天空中要有光体[a]，好把白昼和黑夜分开；它们要作记号，也用来定时节[b]、日子和年岁。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “光体”也可译作“发光体”或“光源”。“天空”所译的原词也可译作“穹苍”“穹顶”或“天空的广阔空间”。
    reason: lexical_alternative
  - marker: b
    text: “时节”也可译作“指定的时间”或“节期”。希伯来语原词常指规定的时刻，在其他语境中也可包括节庆日期。
    reason: lexical_alternative
lexical_decisions:
- source_word: מְאֹרֹת
  choice: 发光体
  rationale: 原词指发出或承载光的天体。“发光体”比单说“光”更准确，也比“光体”更符合现代汉语。
- source_word: רָקִיעַ
  choice: 穹苍
  rationale: 保留原词所指铺展开来的天空空间，并与本章创造叙事的用语相呼应；脚注注明较通俗的译法。
- source_word: הַשָּׁמַיִם
  choice: 天上
  rationale: 在“天上的穹苍中”这一结构里自然表达诸天或天空的领域，不把它限定为上帝居所意义的“天堂”。
- source_word: לְהַבְדִּיל
  choice: 把……分开
  rationale: 清楚表达目的，并保留创世记第1章反复出现的分隔主题。
- source_word: בֵּין הַיּוֹם וּבֵין הַלַּיְלָה
  choice: 把白昼和黑夜分开
  rationale: 采用自然的现代汉语句式，同时保留两个时段之间的对举。
- source_word: לְאֹתֹת
  choice: 作为记号
  rationale: “记号”保持含义宽泛，可指可观察的标志或指示，不额外限定其具体功能。
- source_word: לְמוֹעֲדִים
  choice: 指定的时间
  rationale: 原词表示规定或约定的时刻，也可在其他语境中指节期；此处用宽泛表达，既符合宇宙秩序与计时的上下文，也不排除其潜在的节期含义。
- source_word: לְיָמִים וְשָׁנִים
  choice: 日子和年岁
  rationale: 直接保留原文所列的时间单位；“年岁”符合庄重而易懂的叙事语体。
- source_word: יְהִי ... וְהָיוּ
  choice: 要有……它们要……
  rationale: 用汉语祈使式创造宣告表达神的命令，并使前后两个动词形式相互呼应。
theological_decisions:
- issue: מוֹעֲדִים在创造叙事中的含义
  choice: 译作宽泛的“指定的时间”
  alternative: “季节”或“节期”
  rationale: 本节谈天体安排时间的宇宙性功能，不能确定只指气候季节或礼仪节期。宽泛译法保留原词的语义范围及其可能的后续经文呼应。
- issue: 天体作为“记号”的范围
  choice: 保留宽泛的“记号”，不具体说明为预兆、历法标志或宗教征兆
  alternative: 明确译为“计时的标志”或“预兆”
  rationale: 原文没有在本节内限定这些记号的全部性质；直译可避免加入特定宇宙观或神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“上帝说”“要有”保持创造宣告的简洁力度；“穹苍”略带文学色彩，因此以脚注补充通俗释义。句末将原文各项功能自然组织为“作为记号，用来标示……”，以符合汉语表达，同时不缩窄“指定的时间”的语义。
