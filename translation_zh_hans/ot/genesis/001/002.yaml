source:
  edition: WLC
  text: וְ/הָ/אָ֗רֶץ הָיְתָ֥ה תֹ֨הוּ֙ וָ/בֹ֔הוּ וְ/חֹ֖שֶׁךְ עַל פְּנֵ֣י תְה֑וֹם וְ/ר֣וּחַ אֱלֹהִ֔ים מְרַחֶ֖פֶת עַל פְּנֵ֥י הַ/מָּֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/002.yaml
  text: And the earth was formless and empty[a], and darkness was over the surface of the deep, and the Spirit of God was hovering over the surface of the waters.
translation:
  language: zh_hans
  text: 大地无形而空虚；黑暗笼罩着深渊的表面，神的灵[a]盘旋在水面上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“从神而来的风”或“神的风”盘旋在水面上。
    reason: 原文רוּחַ可指“灵”或“风”；אֱלֹהִים可理解为所属关系，也可表达来源，因此这两种读法都有语言依据。
lexical_decisions:
- source_word: וְהָאָרֶץ
  choice: 大地
  rationale: הָאָרֶץ在这里指“大地”。希伯来语前缀וְ连接上下文；现代汉语不宜机械译作“和”，句序本身已能自然表达承接关系。
- source_word: הָיְתָה
  choice: 尚未成形，空空荡荡（状态表述）
  rationale: היה的Qal完成式在此最自然地充当系词，描述大地当时的状态，而非表示它后来“变成”这种状态。
- source_word: תֹהוּ וָבֹהוּ
  choice: 尚未成形，空空荡荡
  rationale: 这一并列表达兼有未成形与空无荒寂之意。此译文保留两个相应层面，又比传统的“空虚混沌”更符合现代普通读者的语言习惯，且避免“混沌”可能带来的额外宇宙论联想。
- source_word: וְחֹשֶׁךְ
  choice: 黑暗
  rationale: 直接表达名词חֹשֶׁךְ，并延续对当时景象的描述。
- source_word: עַל־פְּנֵי תְהוֹם
  choice: 笼罩着深渊的水面
  rationale: עַל־פְּנֵי表示在某物表面之上，תְהוֹם指深水或深渊。译文以自然汉语呈现其空间图景，并表明这里的深渊是深水。
- source_word: וְרוּחַ אֱלֹהִים
  choice: 神的灵
  rationale: רוּחַ可指“灵”“风”或“气息”。正文采用有充分传统和上下文支持的“神的灵”，同时用脚注保留“从神而来的风／神的风”这一真实可能。
- source_word: מְרַחֶפֶת
  choice: 盘旋
  rationale: 该分词表示持续进行的悬飞或振翼般运动；“盘旋”在现代汉语中简洁自然，也保留动态画面。
- source_word: הַמָּיִם
  choice: 水面
  rationale: 希伯来语用复数形式指广阔的水域。汉语通常以“水面”自然表达עַל־פְּנֵי הַמָּיִם所描绘的水域表面。
theological_decisions:
- issue: הָיְתָה应译为静态的“是／处于”，还是变化意义的“变成”
  choice: 以“大地尚未成形，空空荡荡”描述其状态
  alternative: 大地变得尚未成形，空空荡荡
  rationale: 本句最自然是在交代大地当时的状态；希伯来语并不要求变化义。采用状态表述可避免把经文本身没有明说的先前状态或神学重构带入译文。
- issue: וְרוּחַ אֱלֹהִים指“神的灵”还是“从神而来的风／神的风”
  choice: 神的灵
  alternative: 从神而来的风；神的风
  rationale: 希伯来语רוּחַ兼有“灵”和“风”等义，结构本身也容许不同理解。正文采用“神的灵”，脚注则明确保留气象性的读法，不消除原文的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“尚未成形，空空荡荡”清楚表达原文成对词语的意义；“深渊的水面”和“盘旋”保留宏阔的空间与动态意象。脚注标记紧随其所解释的“神的灵”，避免误指前半句。
