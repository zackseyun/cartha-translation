base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/015.yaml
  text: And let them be for lights in the expanse of the heavens to give light on the earth[b][a]. And it was so.
translation:
  language: zh_hans
  text: 让它们在天空[a]中作光体[b]，照亮大地。事就这样成了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “天空”所译的希伯来语短语也可译作“诸天的穹苍”；“穹苍”指展开的广阔空间。
    reason: lexical_alternative
  - marker: b
    text: “光体”指发出或带来光的物体，不是抽象的“光”。或译“发光体”。
    reason: lexical_clarification
lexical_decisions:
- source_word: וְהָיוּ
  choice: 又让它们成为
  rationale: 该完成式处在上文创造命令的延续中，承接祈使语气；译为“让它们成为”比简单将来时更能体现神谕命令与随后应验的结构。“又”自然连接前一分句。
- source_word: לִמְאוֹרֹת
  choice: 光体
  rationale: מָאוֹר指发光或带来光的物体，而不是抽象的“光”。“光体”简洁地保留这一实体含义，也不把现代天文学关于自身发光的分类强加给古文。
- source_word: בִּרְקִיעַ הַשָּׁמַיִם
  choice: 天空中
  rationale: 该短语直指天上的广阔空间。“天空”是现代汉语中自然清楚的表达；脚注保留更贴近词形和创世记术语的“诸天的穹苍”。
- source_word: לְהָאִיר
  choice: 照亮
  rationale: אור的使役式不定词表示“使有光、给予光”；“照亮”在汉语中自然体现使役含义。
- source_word: עַל הָאָרֶץ
  choice: 大地
  rationale: עַל在此表示光所照及的范围；“照亮大地”符合现代汉语搭配，并保留הָאָרֶץ在本章中的整体性指向。
- source_word: וַיְהִי כֵן
  choice: 事就这样成了
  rationale: 保留创世记第一章反复出现的命令—成就公式，语气庄重而不古奥。
theological_decisions:
- issue: וְהָיוּ在创造话语中的意愿或命令语气
  choice: 译作“又让它们成为”
  alternative: 译作“它们将成为”
  rationale: 上下文仍处于神的创造命令之内，本句延续上一节“要有”的意愿语气；如此翻译保留命令随后得到成就的文学结构，不额外加入教义解释。
- issue: רָקִיעַ的宇宙空间意象
  choice: 正文译“天空”，脚注列“诸天的穹苍”
  alternative: 正文直接译“诸天的穹苍”
  rationale: “天空”便于现代普通读者理解；脚注则保留原词可能带有的展开之广阔空间或穹苍意象，不武断规定其物理性质。
translation_notes:
  register: 采用现代、庄重且易懂的叙事语言。“天空中的光体”自然表达位置与功用；脚注补足רָקִיעַ和מָאוֹר的词义范围。
