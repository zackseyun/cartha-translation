base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/008.yaml
  text: And God called the expanse Heaven[a]. And there was evening[b], and there was morning—the second day.
translation:
  language: zh_hans
  text: 神称穹苍[a]为“天”[b]。有晚上，有早晨——这是第二日。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “穹苍”的原文指铺展、延展开的事物；也可译作“天空”或“穹顶”。传统中文译本常译作“空气”。
    reason: lexical_alternative
  - marker: b
    text: “天”的原文可指“天空”或“诸天”；这里是神给穹苍所起的名称。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: 称……为
  rationale: קרא与ל连用在这里表示命名；“称……为”自然、准确地表达这一结构。
- source_word: אֱלֹהִים
  choice: 神
  rationale: 该复数形式在本章与单数动词搭配，指独一的创造者；“神”是现代汉语中简洁庄重的译法。
- source_word: לָרָקִיעַ
  choice: 穹苍
  rationale: רָקִיעַ指铺展、延展开的空间。“穹苍”保持创造叙事的庄重语体，也避免把古代图景过度具体化为某种固定宇宙模型；另以脚注说明其词义。
- source_word: שָׁמָיִם
  choice: 天
  rationale: שָׁמַיִם在此是神给穹苍所起的名称，可指天空或诸天。“天”在汉语中自然保留这种语义幅度。
- source_word: וַיְהִי
  choice: 有
  rationale: 在反复出现的日序公式中，“有晚上，有早晨”简洁地保留叙事推进和重复结构。
- source_word: עֶרֶב
  choice: 晚上
  rationale: 这是现代汉语对עֶרֶב的常用表达，也适合本章反复出现的公式。
- source_word: בֹקֶר
  choice: 早晨
  rationale: 这是现代汉语对בֹקֶר的常用表达，并与“晚上”形成自然对应。
- source_word: יוֹם שֵׁנִי
  choice: 第二日
  rationale: 该短语在创造日序列中标示次序；“第二日”既庄重又清楚。
theological_decisions:
- issue: שָׁמַיִם作为רָקִיעַ之名称的译法
  choice: 天
  alternative: 天空；诸天
  rationale: “天”既可指可见的天空，也具有较宽广的“诸天”含义，能保留原词的语义张力，不把本节限定为神居所或某种特定宇宙结构。
- issue: רָקִיעַ所呈现的宇宙图景
  choice: 穹苍
  alternative: 天空；苍穹；穹顶
  rationale: 原词与“铺展”有关，但本节并未详述其物理性质。“穹苍”避免明确断定它是实体穹顶，同时保留古代创造叙事的形象与庄重感。
translation_notes:
  register: 采用现代、简洁而庄重的叙事语言。“有晚上，有早晨”保留创世记第一章反复句式的节奏；“第二日”与全章的日序标记协调。
