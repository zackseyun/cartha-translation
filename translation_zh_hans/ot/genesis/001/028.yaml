base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/028.yaml
  text: And God blessed them[a], and God said to them, “Be fruitful, and multiply, and fill the earth, and subdue it, and rule over the fish of the sea, and over the birds of the heavens[b], and over every living thing that moves on the earth.”
translation:
  language: zh_hans
  text: 上帝赐福给他们，又对他们说：“要繁衍增多，遍满大地；要征服大地，统管海里的鱼、天空的鸟，以及地上爬行的各样活物。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “爬行的”也可译作“活动的”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבָרֶךְ
  choice: 赐福
  rationale: 此处皮埃勒词干表示上帝实际赐下福分；“赐福”比单说“祝福”更清楚地体现这一施予意义。
- source_word: אֱלֹהִים
  choice: 上帝
  rationale: 虽然词形为复数，但搭配单数动词，在《创世记》第一章中指独一的上帝。
- source_word: פְּרוּ וּרְבוּ
  choice: 繁衍增多
  rationale: 两个命令共同表达生育并在数量上增加；“繁衍增多”在现代汉语中自然、清楚，也保留了原文的两个动作。
- source_word: וּמִלְאוּ אֶת־הָאָרֶץ
  choice: 遍满大地
  rationale: מלא意为充满；在宇宙性创造叙事中，הָאָרֶץ指大地，而非某一局部地域。“遍满”自然表达充满各处。
- source_word: וְכִבְשֻׁהָ
  choice: 征服大地
  rationale: כבש具有使之屈服、置于控制之下的强烈含义。“征服”保留原文力度，不擅自弱化为照管，也不额外引入滥用之意。
- source_word: וּרְדוּ
  choice: 统管
  rationale: רדה表示施行统治或管辖。“统管”是庄重而易懂的现代汉语，并保留权柄含义。
- source_word: בִּדְגַת הַיָּם
  choice: 海里的鱼
  rationale: 该结构具体指海中的鱼类，不宜泛化为一切海洋生物。
- source_word: בְעוֹף הַשָּׁמַיִם
  choice: 天空的鸟
  rationale: עוֹף在此最自然地指鸟类；הַשָּׁמַיִם在这一搭配中译作“天空”符合现代汉语。
- source_word: בְכָל־חַיָּה הָרֹמֶשֶׂת עַל־הָאָרֶץ
  choice: 地上爬行的各样活物
  rationale: חַיָּה泛指活物或动物；רמש在此描写沿地面活动。“爬行”保留其较具体的动作意象，同时用“活物”维持类别的广度。
theological_decisions:
- issue: 人类对受造界使命中כבש与רדה的力度
  choice: 译为“征服大地，统管……”
  alternative: “治理并照管大地”或“管理大地”
  rationale: 原文两个动词强于单纯照料或受托管理。译文保留其统治和使之受制的力度，同时不加入剥削式统治或生态管家论等原文未明说的解释。
- issue: הָאָרֶץ的范围
  choice: 大地
  alternative: 土地
  rationale: 《创世记》第一章的普世创造语境表明，这里不是指某一块地方性土地；“大地”能自然体现整体范围。
translation_notes:
  register: 采用现代、庄重、易懂的标准普通话。句式保留连续命令的力度，但通过分号和并列结构避免生硬。原英文咨询层的脚注标记与内容疑似错位；本稿依据希伯来原文重新设置脚注，并确保[a]出现在正文中。
