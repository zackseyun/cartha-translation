  text: וַ/יִּקְרָ֨א אֱלֹהִ֤ים לָ/אוֹר֙ י֔וֹם וְ/לַ/חֹ֖שֶׁךְ קָ֣רָא לָ֑יְלָה וַֽ/יְהִי עֶ֥רֶב וַֽ/יְהִי בֹ֖קֶר י֥וֹם אֶחָֽד׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/005.yaml
  text: And God called the light Day[a], and the darkness he called Night. And there was evening, and there was morning—the first day.
translation:
  language: zh_hans
  text: 神称光为“昼”，称黑暗为“夜”。有了晚上，有了早晨：这是第一日。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译：“一日”。
    reason: 保留יוֹם אֶחָד使用基数词“一”而非序数词“第一”的原文形式。
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: 称……为
  rationale: קרא与命名补语连用，表示“称为、命名”；“称……为”既自然，也保留命名公式。
- source_word: אֱלֹהִים
  choice: 神
  rationale: 本节中该复数形式的名词与单数动词搭配，指独一的创造者；“神”是现代汉语圣经语体中准确而通行的译法。
- source_word: לָאוֹר
  choice: 光
  rationale: 介词ל在命名结构中引出被命名的对象；汉语以“称光为……”自然表达，无须另译介词或冠词。
- source_word: יוֹם
  choice: “昼”
  rationale: 此处指神赋予光的名称，并与“夜”相对；“昼”比“日”更明确地表达白昼。引号标明命名行为。
- source_word: וְלַחֹשֶׁךְ
  choice: 黑暗
  rationale: 与“光”平行，是被命名的对象；译为“黑暗”准确而自然。
- source_word: קָרָא
  choice: 称……为
  rationale: 希伯来文在第二分句再次使用命名动词；汉语合并在平行结构中表达，避免生硬重复，同时完整保留语义。
- source_word: לָיְלָה
  choice: “夜”
  rationale: 这是赋予黑暗的名称；“夜”与“昼”形成简洁、自然的对应。
- source_word: וַיְהִי
  choice: 有了
  rationale: 在“晚上—早晨”的时间序列中，“有了”自然表达叙事中的出现或形成，并以重复句式反映原文节奏。
- source_word: עֶרֶב
  choice: 晚上
  rationale: 基本义为“傍晚、晚上”；此处用现代汉语常用的“晚上”，不把含义收窄为“日落”。
- source_word: בֹקֶר
  choice: 早晨
  rationale: 准确表达一般意义的“早晨”，不限定为更狭窄的“黎明”或“破晓”。
- source_word: יוֹם אֶחָד
  choice: 这是第一日
  rationale: 原文形式直译为“一日”，但在连续计数的叙事中，现代汉语用“第一日”更清楚自然；“这是”补足汉语判断句，使收束语气顺畅。原文的基数形式在脚注中保留。
theological_decisions:
- issue: 如何翻译创造日公式末尾的יוֹם אֶחָד
  choice: 这是第一日
  alternative: 一日；第一天
  rationale: 希伯来文使用基数词אֶחָד（“一”），而不是序数词“第一”。不过，本句在叙事序列中起标示首日的作用，“第一日”符合现代汉语表达。由于“一日”这一原文字面形式可能具有解经意义，脚注予以说明，不在正文中替读者消解这种形式差异。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“昼／夜”用于命名对举，“晚上／早晨”用于时间进程，以免混淆两个层面。正文保留希伯来文的平行节奏；脚注标记[a]置于“第一日”之后，与所注释的短语准确对应。
