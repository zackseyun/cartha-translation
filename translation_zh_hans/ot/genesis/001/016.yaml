  text: וַ/יַּ֣עַשׂ אֱלֹהִ֔ים אֶת שְׁנֵ֥י הַ/מְּאֹרֹ֖ת הַ/גְּדֹלִ֑ים אֶת הַ/מָּא֤וֹר הַ/גָּדֹל֙ לְ/מֶמְשֶׁ֣לֶת הַ/יּ֔וֹם וְ/אֶת הַ/מָּא֤וֹר הַ/קָּטֹן֙ לְ/מֶמְשֶׁ֣לֶת הַ/לַּ֔יְלָה וְ/אֵ֖ת הַ/כּוֹכָבִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/016.yaml
  text: 'And God made the two great lights: the greater light to rule the day[a], and the lesser light to rule the night, and the stars.'
translation:
  language: zh_hans
  text: 上帝造了两个大光体：较大的光体掌管白昼，较小的光体掌管黑夜；还有众星[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可明确译作：“上帝也造了众星。”
    reason: 原文把“众星”作为“造了”的附加宾语，动词承前省略；明确译法补出了中文语境中隐含的动词。
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: 造了
  rationale: עָשָׂה在此表示“制作、造成”；“造了”自然承接创造叙事，又不把周围经文所说的功能误加进这个动词。
- source_word: אֱלֹהִים
  choice: 上帝
  rationale: 本章中该词与单数动词搭配，指独一的上帝；“上帝”是现代普通话中准确、庄重且通行的称呼。
- source_word: שְׁנֵי הַמְּאֹרֹת הַגְּדֹלִים
  choice: 两个大光体
  rationale: מָאוֹר指发光或承载光的天体；“光体”既保留原文没有直接称其为日月的措辞，也比音译或专业术语更易理解。
- source_word: הַמָּאוֹר הַגָּדֹל
  choice: 较大的光体
  rationale: 原文字面为“大光体”，但与后面的“小光体”构成对比；中文用“较大的”自然表达两者之间的比较关系。
- source_word: לְמֶמְשֶׁלֶת הַיּוֹם
  choice: 掌管白昼
  rationale: מֶמְשֶׁלֶת表示统治、管辖；“掌管”庄重而通顺，也保留光体对昼夜所具功能性的权柄。
- source_word: הַמָּאוֹר הַקָּטֹן
  choice: 较小的光体
  rationale: קָטֹן意为“小、较小”；与“较大的光体”平衡对应，准确呈现原文的对比。
- source_word: לְמֶמְשֶׁלֶת הַלַּיְלָה
  choice: 掌管黑夜
  rationale: 采用与前一分句相同的译法，保留希伯来文的平行结构。
- source_word: וְאֵת הַכּוֹכָבִים
  choice: 还有众星
  rationale: 原文以连词和宾语标记简短补上“众星”，动词“造”承前省略；“还有众星”保留这种突出的附加语气，避免擅自扩写。
theological_decisions:
- issue: 是否把两个光体直接译成太阳和月亮
  choice: 保留“较大的光体”和“较小的光体”
  alternative: 译作“太阳”和“月亮”
  rationale: 希伯来文刻意使用מָאוֹר（光体），而没有采用太阳和月亮的通常名称。保留原文措辞可避免加入经文本身未明说的名称。
- issue: 众星与动词“造”的关系
  choice: 正文保留“还有众星”的省略结构
  alternative: 明确译作“上帝又造了众星”
  rationale: 从句法看，“众星”是וַיַּעַשׂ（造了）的另一个宾语，但原文在句末采用简短的追加表达。正文保留其突兀而有力的附加效果，脚注说明可明确补出省略的动词。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“光体”保留原文不用“太阳、月亮”的特点；以冒号和平行分句呈现结构，并用分号突出句末“众星”的简短追加语。
