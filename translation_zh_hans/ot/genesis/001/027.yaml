  text: וַ/יִּבְרָ֨א אֱלֹהִ֤ים אֶת הָֽ/אָדָם֙ בְּ/צַלְמ֔/וֹ בְּ/צֶ֥לֶם אֱלֹהִ֖ים בָּרָ֣א אֹת֑/וֹ זָכָ֥ר וּ/נְקֵבָ֖ה בָּרָ֥א אֹתָֽ/ם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/027.yaml
  text: So God created man in his image[a]; in the image of God he created him; male and female he created them.
translation:
  language: zh_hans
  text: 上帝就照着自己的形象创造人；他照着上帝的形象创造人；他创造他们为男为女。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּבְרָא / בָּרָא
  choice: 创造
  rationale: “创造”准确表达本章中上帝的创造行动，并保留原文三次重复同一动词所形成的庄重节奏。
- source_word: אֱלֹהִים
  choice: 上帝
  rationale: 该词虽在形态上为复数形式，此处却与单数动词搭配，指独一的上帝；“上帝”是现代普通话中自然、庄重且通行的译法。
- source_word: הָאָדָם
  choice: 人
  rationale: 此处的单数“人”具有代表性，指向整个人类；中文“人”既能保留原文单数形式，也可按语境作集合性理解。
- source_word: בְּצַלְמוֹ
  choice: 照着自己的形象
  rationale: 介词短语表达依照上帝形象而造；因主语是上帝，用“自己的”自然消除中文代词指向上的歧义。
- source_word: בְּצֶלֶם אֱלֹהִים
  choice: 照着上帝的形象
  rationale: 重复“形象”保留原文的平行结构、复述和神学强调。
- source_word: אֹתוֹ
  choice: 那人
  rationale: 原文为阳性单数代词，回指具有代表性的“人”。直译成“他”在中文中容易误指上帝，因此用“那人”保留单数回指，同时使所指清楚。
- source_word: זָכָר וּנְקֵבָה
  choice: 有男有女
  rationale: 原词指男性与女性的性别区分，而非夫妻等关系身份；“有男有女”在中文中准确自然，并与后面的复数“他们”相配。
- source_word: אֹתָם
  choice: 他们
  rationale: 保留原文从代表性的单数“人”转向复数人群的刻意变化。
theological_decisions:
- issue: 代表全人类的 אָדָם 如何翻译
  choice: 人
  alternative: 人类／那人
  rationale: 原文先以单数名词和单数代词指称人，随后以“男、女”和复数“他们”展开其群体性。“人”最能同时保留代表性单数和全人类的含义；脚注说明也保存“人类”这一理解。
- issue: 是否保留单数到复数的转换
  choice: 保留为“人／那人”到“他们”
  alternative: 全句统一译作“人类”
  rationale: 单复数转换是原文显著的文学和神学张力：人类作为一个整体受造，却具体体现为男性与女性。统一改成集合名词会削弱这一结构。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。句式尽量保留原文三重“创造”和“形象”的重复；以“那人”避免“他创造了他”在中文中的指代混乱，并保留单数到复数的推进。
