  text: וַ/יֹּ֣אמֶר אֱלֹהִ֗ים יִקָּו֨וּ הַ/מַּ֜יִם מִ/תַּ֤חַת הַ/שָּׁמַ֨יִם֙ אֶל מָק֣וֹם אֶחָ֔ד וְ/תֵרָאֶ֖ה הַ/יַּבָּשָׁ֑ה וַֽ/יְהִי כֵֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/009.yaml
  text: And God said[a], “Let the waters under the heavens be gathered into one place, and let the dry land appear.” And it was so.
translation:
  language: zh_hans
  text: 神说：“天[a]底下的水要聚到一处，使旱地显露出来。”事就这样成了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “天”也可译作“天空”。希伯来语 שָׁמַיִם 可依语境指天空或诸天。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 神说
  rationale: 连续式叙事形式推进情节；现代汉语中省略机械性的“于是/然后”更自然，仍清楚表达叙事进展。
- source_word: אֱלֹהִים
  choice: 神
  rationale: 本节动词为单数，语境指独一的创造主；“神”是准确、通行且庄重的译法。
- source_word: יִקָּווּ הַמַּיִם
  choice: 水要聚
  rationale: 祈愿式在神的直接话语中表达命令或旨意；“要聚”自然传达水汇集起来的被动或结果性含义。希伯来语 מַיִם 形态为复数，但现代汉语通常以集合名词“水”表达。
- source_word: מִתַּחַת הַשָּׁמַיִם
  choice: 天下的
  rationale: 该短语直指位于天之下的水；“天下的水”简洁自然，并保留 שָׁמַיִם 的“天”这一宇宙论用语。
- source_word: אֶל מָקוֹם אֶחָד
  choice: 到一处
  rationale: 保留向一个地点汇聚的方向和 אֶחָד“一”的明确含义；“一处”符合现代汉语表达。
- source_word: וְתֵרָאֶה הַיַּבָּשָׁה
  choice: 使旱地显露出来
  rationale: Niphal祈愿式表示原先被遮盖的干地变得可见；汉语“使……显露出来”自然呈现与前一命令相联的结果，同时不把旱地解释为新受造。
- source_word: וַיְהִי כֵן
  choice: 事情就这样成了
  rationale: 保留创世记第一章反复出现的命令实现公式；此译法比单说“果然如此”更明确地表达神所说之事得以实现。
theological_decisions:
- issue: 创世叙事中 שָׁמַיִם 的宇宙论含义
  choice: 天
  alternative: 天空
  rationale: שָׁמַיִם 可按语境指“天”或“天空”。本节采用“天”，既与本章庄重语体和前文术语一致，也不额外规定具体宇宙结构；脚注保留“天空”这一真实词义可能。
- issue: 旱地“显露”与创造行为的关系
  choice: 按原文译为“显露出来”
  alternative: 被造出来
  rationale: 原文使用“被看见/显现”的动词，而非“创造”；译文保留这一措辞及其张力，不推断旱地是在此刻才开始存在。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“天下的水”避免生硬的“诸天以下的众水”；“旱地”与水形成清楚对照。脚注标记置于整节末尾，正文中的 [a] 与脚注对应。
