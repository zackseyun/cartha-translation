base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/031.yaml
  text: And God saw all that he had made, and behold, it was very good. And there was evening and there was morning, the sixth day.
translation:
  language: zh_hans
  text: 上帝看见他所造的一切；看哪，都非常好。有晚上，有早晨；这是第六日。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּרְא
  choice: 看
  rationale: ראה在连续叙事形式中基本义为“看”；此处也含有评估意味，但译作“看”可避免过度解释。
- source_word: אֱלֹהִים
  choice: 上帝
  rationale: 该复数形式名词在本章与单数动词搭配，指独一的创造者；“上帝”是现代标准普通话中自然、庄重且通行的译法。
- source_word: כָּל אֲשֶׁר עָשָׂה
  choice: 他所造的一切
  rationale: 准确概括受造万有的总和，并以自然汉语表达相对于察看的先成行动。
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留הִנֵּה引人注意、增强现场感的篇章功能，也符合经文的庄重语体。
- source_word: טוֹב מְאֹד
  choice: 都非常好
  rationale: טוֹב译为“好”，מְאֹד译为“非常”；补出“都”承接前面的“一切”，使汉语自然，同时不把“好”限缩为道德、美学或功能层面的某一种含义。
- source_word: וַיְהִי עֶרֶב וַיְהִי בֹקֶר
  choice: 到了晚上，又到了早晨
  rationale: 以自然现代汉语保留两个平行的叙事分句及其先后次序，并与本章反复出现的日终公式相协调。
- source_word: יוֹם הַשִּׁשִּׁי
  choice: 是第六日
  rationale: 保留名词与带定冠词序数词的表达；“第六日”庄重简洁，“是”使其作为前述公式的总结在汉语中完整。
theological_decisions:
- issue: טוֹב מְאֹד所表达的受造界之“好”的性质
  choice: 非常好
  alternative: 极其美好
  rationale: “非常好”保留原文宽泛的肯定，不把它特定化为道德、美学或功能意义，也不引入后来的教义表述。
- issue: 日终公式是否预先裁定创造之“日”的长度或文学功能
  choice: 到了晚上，又到了早晨，是第六日
  alternative: 有晚上，有早晨；第六日
  rationale: 紧随希伯来语公式及次序，不加入关于这些日子的时长或文学性质的解释。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“看哪”保留原文的提示与强调功能；“第六日”与创世记第一章的礼仪性、公式化节奏相称。
