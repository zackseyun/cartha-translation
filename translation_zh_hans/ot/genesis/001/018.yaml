source:
  edition: WLC
  text: וְ/לִ/מְשֹׁל֙ בַּ/יּ֣וֹם וּ/בַ/לַּ֔יְלָה וּֽ/לֲ/הַבְדִּ֔יל בֵּ֥ין הָ/א֖וֹר וּ/בֵ֣ין הַ/חֹ֑שֶׁךְ וַ/יַּ֥רְא אֱלֹהִ֖ים כִּי טֽוֹב־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/018.yaml
  text: and to rule over the day and over the night[a], and to separate the light from the darkness. And God saw that it was good.
translation:
  language: zh_hans
  text: 掌管白昼和黑夜，并把光与暗分开。[a] 神看这是好的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“使光与暗有所区别。”
    reason: בדל既可侧重实际分开，也可侧重划分、区别；正文采用本章更具体且反复出现的“分开”，脚注保留另一种词义侧重。
lexical_decisions:
- source_word: וְ/לִ/מְשֹׁל
  choice: 管理
  rationale: מָשַׁל在此表示受命掌管、治理。现代汉语用“管理”自然清楚，保留天体在上帝所立秩序中的功能，同时不赋予其神性或独立主权。
- source_word: בַּ/יּוֹם וּ/בַ/לַּיְלָה
  choice: 白昼和黑夜
  rationale: 这一对词分别指白昼与黑夜；“白昼和黑夜”既准确体现对称结构，也比单说“昼夜”更清楚地呈现两个受管理的领域。
- source_word: וּֽ/לֲ/הַבְדִּיל
  choice: 把……分开
  rationale: בדל在创世记第一章反复表示设立界限、使二者分离。“把……分开”具体、自然，并与本章的用语保持一致。
- source_word: בֵּין הָ/אוֹר וּ/בֵין הַ/חֹשֶׁךְ
  choice: 光与暗
  rationale: 希伯来语采用“在……之间”的对举结构；配合汉语“把……分开”，译为“光与暗”简洁自然，并保留两者的对称。
- source_word: וַ/יַּרְא אֱלֹהִים
  choice: 神看
  rationale: 连续叙事形式推进叙述；“神看”保留创世记第一章反复出现的简洁节奏。
- source_word: כִּי טוֹב
  choice: 这是好的
  rationale: טוֹב涵盖美好、合宜、符合受造秩序等意义。“这是好的”不把含义缩窄为悦目或有益，并保留本章评语的庄重与重复性。
theological_decisions:
- issue: 天体在受造秩序中的功能
  choice: 将天体的作用译为“管理白昼和黑夜”，保留原文的治理用语，同时让上下文表明它们是神所设立的受造物。
  alternative: 译成更强的“统治白昼和黑夜”，可能使天体显得具有独立主权；译成较弱的“照管”则会淡化מָשַׁל的治理含义。
  rationale: 原文赋予天体秩序性的功能，却没有把它们描写为神明。结尾仍由神评定受造秩序为好，因此既不应消除“治理”的力度，也不应导入天体神格化的观念。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“白昼和黑夜”“光与暗”形成整齐对举；句法承接上一节所述天体的用途。脚注标记置于其实际对应的“把光与暗分开”之后。
