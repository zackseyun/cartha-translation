base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/007.yaml
  text: So God made the expanse and separated the waters that were under the expanse from the waters that were above the expanse[a]. And it was so.
translation:
  language: zh_hans
  text: 于是，上帝造了穹苍[a]，把穹苍以下的水和穹苍以上的水分开。事情就这样成了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原词指铺展开来的空间或物体；也可译作“广阔空间”或“穹顶”。
    reason: 保留רָקִיעַ在空间范围与具体形态上的词义选择及解释张力。
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: 造了
  rationale: עָשָׂה通常表示“做、制造”；在创造叙事中译为“造了”自然、直接，又不加入“塑造”等更专门的含义。
- source_word: אֱלֹהִים
  choice: 上帝
  rationale: 本节与单数动词连用，指独一的创造主；“上帝”是现代汉语中准确、通行的称呼。
- source_word: הָרָקִיעַ
  choice: 穹苍
  rationale: רָקִיעַ指铺展开来的空间或物体。“穹苍”庄重、简洁，并与本章创造语境相称；脚注保留原词在具体形态上的不确定性。
- source_word: וַיַּבְדֵּל
  choice: 分开
  rationale: בדל表示使两者分离或区别；“把……和……分开”符合现代汉语表达，也保留本章反复出现的区分秩序。
- source_word: בֵּין ... וּבֵין
  choice: 把……和……分开
  rationale: 希伯来语结构直译为“在……与……之间分开”；转换为汉语处置式，意义完整且表达自然。
- source_word: הַמַּיִם
  choice: 水
  rationale: מַיִם虽在形式上为复数，但通常是集合或物质名词；汉语以“水”表达最自然，无须勉强体现复数形式。
- source_word: אֲשֶׁר מִתַּחַת לָרָקִיעַ
  choice: 穹苍以下的水
  rationale: 准确表达位于穹苍下方的水，并与“以上”构成清楚的垂直对照。
- source_word: אֲשֶׁר מֵעַל לָרָקִיעַ
  choice: 穹苍以上的水
  rationale: 准确表达位于穹苍上方的水，与前半句平行。
- source_word: וַיְהִי כֵן
  choice: 事情就这样成了
  rationale: 这是创世记第一章反复出现的成就公式；该译法既表达上帝所命之事成为现实，也保留叙事性的固定回响。
theological_decisions:
- issue: 创造叙事中רָקִיעַ的译法及其宇宙观含义
  choice: 穹苍
  alternative: 广阔空间；穹顶
  rationale: 正文采用简洁而有文学庄重感的传统汉语词“穹苍”，但不据此断定其具体材质或形状；脚注说明原词的展开意象及其他可能译法，以免翻译替经文解决其未明说的宇宙结构问题。
translation_notes:
  register: 采用现代、清楚而庄重的叙事语言。“于是”承接上一节的神谕；“穹苍以下……穹苍以上……”保留原文的平行结构。脚注标记[a]置于该词首次出现处。
