id: GEN.1.10
reference: Genesis 1:10
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יִּקְרָ֨א אֱלֹהִ֤ים לַ/יַּבָּשָׁה֙ אֶ֔רֶץ וּ/לְ/מִקְוֵ֥ה הַ/מַּ֖יִם קָרָ֣א יַמִּ֑ים וַ/יַּ֥רְא אֱלֹהִ֖ים כִּי טֽוֹב׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/010.yaml
  text: And God called the dry land Earth[a], and the gathering of the waters he called Seas. And God saw that it was good.
translation:
  language: zh_hans
  text: 神称旱地为“地”[a]，称聚集的水为“海”。神看这是好的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“大地”或“土地”；希伯来文 אֶרֶץ 既可作普通名词，也可在这里的命名语境中理解为给旱地所起的名称。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא / קָרָא
  choice: 称……为
  rationale: 此处表示命名或指定名称；“称……为”自然、庄重，并保留原文两次命名的平行结构。
- source_word: אֱלֹהִים
  choice: 神
  rationale: 在《创世记》第1章中，该复数形式的名词与单数动词搭配，指独一的创造者；现代汉语圣经语体中以“神”直译。
- source_word: לַיַּבָּשָׁה
  choice: 旱地
  rationale: 指与聚集之水相区别的干燥陆地；“旱地”简洁，并与本段创造、分隔的语境相符。
- source_word: אֶרֶץ
  choice: 地
  rationale: 该词可指地、土地或大地；此处处于命名句式中，“地”既自然，又不把含义限定为现代意义上的行星。
- source_word: מִקְוֵה הַמַּיִם
  choice: 聚集的水
  rationale: מִקְוֵה表示汇聚、聚集之物；译作“聚集的水”在现代汉语中自然，也承接上一节水聚到一处的叙述。
- source_word: יַמִּים
  choice: 海
  rationale: 希伯来文形式为复数，可指海洋或各片水域；汉语以集合性名词“海”更符合自然命名表达，且不必机械标示复数。
- source_word: וַיַּרְא
  choice: 看
  rationale: 保留《创世记》第1章反复出现的评断公式，并采用简明常用的汉语表达。
- source_word: כִּי טוֹב
  choice: 这是好的
  rationale: טוֹב含义宽广，可涵盖良善、合宜、美好；“好的”保留其简洁和神学广度，不缩减为审美或功用判断。
theological_decisions:
- issue: אֶרֶץ在命名句式中应理解为名称还是普通名词
  choice: 以引号标示命名：“地”
  alternative: 不加引号译作普通名词“地”或“大地”
  rationale: 原文明确叙述神给旱地命名；汉语没有大小写之别，用引号可清楚显示命名功能，同时脚注保留其也可按普通名词理解的可能。
- issue: יַמִּים的复数是否须在汉语中显明
  choice: 译作集合性名词“海”
  alternative: 译作“众海”或“各海”
  rationale: 原文为复数，但“众海”会增加诗化或数量强调，“各海”则可能过度具体化；汉语“海”本身足以概括聚集的各水域。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。以“称……为”保留两次命名的平行结构；用引号承担英语大写所表达的名称功能。句首不机械补出连接词“于是/又”，使单节中文更自然，同时保持叙事次序。
