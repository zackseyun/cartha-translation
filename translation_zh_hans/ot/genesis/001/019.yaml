  text: וַֽ/יְהִי עֶ֥רֶב וַֽ/יְהִי בֹ֖קֶר י֥וֹם רְבִיעִֽי־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/019.yaml
  text: And there was evening[a], and there was morning—the fourth day.
translation:
  language: zh_hans
  text: 有晚上，有早晨——这是第四日。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 较为形式对应地译作：“有晚上，有早晨，第四日。”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: 有
  rationale: 此处 היה 的叙事形式在反复出现的日程结语中表达存在或发生；译作“有”简洁自然，也不额外解释为“变成”。
- source_word: עֶרֶב
  choice: 晚上
  rationale: 该词指傍晚、晚上；“晚上”是现代汉语中直接自然的对应，也符合本段反复句式。
- source_word: וַיְהִי
  choice: 有
  rationale: 与前一处相同，保持原文重复结构和节奏。
- source_word: בֹקֶר
  choice: 早晨
  rationale: 该词指早晨；此译法直接、庄重，并与“晚上”形成自然对应。
- source_word: יוֹם רְבִיעִי
  choice: 这是第四日
  rationale: 原文以序数词标明日次；汉语用“这是第四日”自然地收束句子。“日”比“天”更适合此处庄重且反复的创造叙事措辞。
theological_decisions:
- issue: 如何翻译创造日的反复结语而不预设有关创造日性质或时长的特定解释
  choice: 有晚上，有早晨——这是第四日。
  alternative: 有晚上，有早晨，是第四日。
  rationale: 译文直接保留“晚上—早晨—第四日”的原文次序与反复结构，不借措辞裁定创造日的性质或时长。破折号只用于呈现汉语中的总结语气，并不增添时间学解释。
translation_notes:
  register: 采用现代、简明而庄重的标准普通话。“有晚上，有早晨”保留希伯来文重复的存在句式；“这是”使结尾在现代汉语中自然清楚。脚注提供更贴近原文省略判断词的形式对应译法。
