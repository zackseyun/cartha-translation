  text: וַ/יֹּ֣אמֶר אֱלֹהִ֔ים יִשְׁרְצ֣וּ הַ/מַּ֔יִם שֶׁ֖רֶץ נֶ֣פֶשׁ חַיָּ֑ה וְ/עוֹף֙ יְעוֹפֵ֣ף עַל הָ/אָ֔רֶץ עַל פְּנֵ֖י רְקִ֥יעַ הַ/שָּׁמָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/020.yaml
  text: And God said[a], “Let the waters swarm with swarms of living creatures[c][b], and let birds fly above the earth across the face of the expanse of the heavens.”
translation:
  language: zh_hans
  text: 神说：“水要滋生出成群的活物[a]；飞禽[b]要飞在地面上空，掠过天上穹苍[c]的表面。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “滋生出成群的活物”直译近于“滋生出成群之物”。希伯来文使用同根的动词和名词，强调生命大量涌现。
    reason: lexical_alternative
  - marker: b
    text: “飞禽”也可译作“飞行的生物”；希伯来词 עוֹף 的范围可能比“鸟类”更广。
    reason: lexical_alternative
  - marker: c
    text: “穹苍”也可译作“天空”或“穹顶”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 神说
  rationale: 以简洁的叙事表达承接上文；汉语不必机械译出连接词，仍保留连续叙事的语气。
- source_word: יִשְׁרְצוּ הַמַּיִם שֶׁרֶץ
  choice: 水要成群地滋生
  rationale: 用“成群地滋生”兼顾动词与同根名词所强调的繁多、涌现之意，同时避免生硬重复。
- source_word: נֶפֶשׁ חַיָּה
  choice: 有生命的活物
  rationale: 指有生命的动物，不把 נֶפֶשׁ 技术化为后期神学意义上的“灵魂”。
- source_word: עוֹף
  choice: 飞禽
  rationale: “飞禽”简洁而庄重，也比单说“鸟”略宽，可涵盖希伯来词所指的飞行生物。
- source_word: יְעוֹפֵף
  choice: 飞翔
  rationale: 准确表达飞行动作，并与命令式语气“要”自然搭配。
- source_word: עַל הָאָרֶץ
  choice: 在大地上空
  rationale: 在飞行语境中，עַל 表示位于或经过大地之上，而非接触地面。
- source_word: עַל פְּנֵי
  choice: 沿着……的表面
  rationale: 保留“在……面上”的具体空间意象，不将其简化为泛指的“在”。
- source_word: רְקִיעַ הַשָּׁמָיִם
  choice: 天上穹苍
  rationale: “穹苍”保留 רְקִיעַ 的独特意象与语义张力，“天上”则体现其与 הַשָּׁמָיִם 的从属关系。
theological_decisions:
- issue: 创造语境中 נֶפֶשׁ חַיָּה 的译法
  choice: 有生命的活物
  alternative: 活的魂；有生命的存在
  rationale: 此处描述动物生命，并非对“魂”作技术性的神学界定；所选译法避免把后期灵魂观念带入经文。
- issue: רְקִיעַ 的宇宙图景
  choice: 穹苍
  alternative: 天空；穹顶
  rationale: “穹苍”保留原词的空间意象和可能的实体感，却不武断规定其具体物理性质；脚注列出其他可行译法。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“成群地滋生”传达希伯来文同根词的强调而不作生硬复现；“天上穹苍”保留创世叙事的崇高语体及原文宇宙空间意象。
