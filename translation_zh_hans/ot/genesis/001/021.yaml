  - severity: low
    issue: “水中成群游动的”可能改变修饰关系
    rationale: 原文强调“众水”因这些活物而滋生、群集；该措辞可能主要表达活物结群游泳。改为“水中所滋生的各样游动活物”更清楚地保留水中繁多生命的图景。
