  text: וַ/יִּבְרָ֣א אֱלֹהִ֔ים אֶת הַ/תַּנִּינִ֖ם הַ/גְּדֹלִ֑ים וְ/אֵ֣ת כָּל נֶ֣פֶשׁ הַֽ/חַיָּ֣ה הָֽ/רֹמֶ֡שֶׂת אֲשֶׁר֩ שָׁרְצ֨וּ הַ/מַּ֜יִם לְ/מִֽינֵ/הֶ֗ם וְ/אֵ֨ת כָּל ע֤וֹף כָּנָף֙ לְ/מִינֵ֔/הוּ וַ/יַּ֥רְא אֱלֹהִ֖ים כִּי טֽוֹב־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/021.yaml
  text: So God created the great sea creatures[a], and every living creature that moves, with which the waters swarmed, according to their kinds, and every winged bird according to its kind. And God saw that it was good.
translation:
  language: zh_hans
  text: 于是，上帝创造了巨大的海兽[a]、水中所滋生的各样游动活物，各从其类；以及各样有翅膀的飞鸟，各从其类。上帝看着是好的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“巨大的海怪”或“巨龙”。希伯来语 tanninim 可指巨大的蛇形或可怖生物；这里的水域语境支持译作“海兽”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבְרָא
  choice: 创造了
  rationale: 保留创世叙事中 ברא 的关键用词及庄重语体；此处主语是上帝。
- source_word: אֱלֹהִים
  choice: 上帝
  rationale: 该复数形名词在此搭配单数动词，指独一的上帝；“上帝”是现代标准汉语中自然、庄重的通行译法。
- source_word: הַתַּנִּינִם הַגְּדֹלִים
  choice: 巨大的海兽
  rationale: תנינים 可指巨大的蛇形、可怖或水生动物；水域语境支持“海兽”，同时比“海洋生物”更能保留原词所带的大型、非凡意味。其他可能译法列入脚注。
- source_word: כָּל נֶפֶשׁ הַחַיָּה
  choice: 各样活物
  rationale: נפש חיה 在此指有生命的动物，并非后世神学意义上的“灵魂”；“活物”简洁且符合创造叙事语体。
- source_word: הָרֹמֶשֶׂת
  choice: 游动的
  rationale: רמש 表示移动、爬动；在水生语境中译作“游动”自然，但不把类别缩窄为爬行动物。
- source_word: אֲשֶׁר שָׁרְצוּ הַמַּיִם
  choice: 水中成群……的
  rationale: שרץ 强调大量滋生、群集涌动；“成群”自然传达水中生命繁多的图景。
- source_word: לְמִינֵהֶם / לְמִינֵהוּ
  choice: 各从其类
  rationale: 保留 מין 所表达的受造物分类，并采用现代读者可懂而又庄重凝练的固定表达。
- source_word: כָּל עוֹף כָּנָף
  choice: 各样有翅膀的飞鸟
  rationale: 兼顾 עוף 的飞禽范畴与 כנף 对翅膀的明确说明，避免遗漏原文成分。
- source_word: וַיַּרְא אֱלֹהִים כִּי טוֹב
  choice: 上帝看这一切是好的
  rationale: 以自然汉语保留创世记第一章反复出现的评价公式；“这一切”承接本节所造之物。
theological_decisions:
- issue: 创造语境中 תַּנִּינִם 的译法及其潜在神话联想
  choice: 巨大的海兽
  alternative: 巨大的海怪；巨龙
  rationale: 原词可以指大型蛇形或可怖生物，但本节直接将其置于上帝所造的水生动物之列。“海兽”既不额外强化神话含义，也没有把原词淡化成泛指的“海洋生物”；其他真实可能性保留在脚注中。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“于是”承接上文；分号呈现两组“各从其类”的平行结构。正文脚注标记 [a] 已置于相关词语之后。
