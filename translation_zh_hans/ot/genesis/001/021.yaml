revisions:
- from: 于是，上帝创造了巨大的海兽[a]，又创造了水中成群游动的各样活物，各从其类；也创造了各样有翅膀的飞鸟，各从其类。上帝看这一切是好的。
  to: 于是，上帝创造了巨大的海兽[a]、水中所滋生的各样游动活物，各从其类；以及各样有翅膀的飞鸟，各从其类。上帝看着是好的。
  rationale: 修订以单一“创造了”统摄原文并列的三类受造物，删除汉语中虽顺畅但原文未重复的动词。将水生生命改为“水中所滋生的各样游动活物”，以较好表达众水繁多、涌动的语义，同时保留水生语境下“游动”的自然表达。结尾改为“上帝看着是好的”，避免额外加入“这一切”的指示成分，并维持创世记一章评价公式的庄重、自然语气。
