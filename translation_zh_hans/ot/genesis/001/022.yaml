  text: וַ/יְבָ֧רֶךְ אֹתָ֛/ם אֱלֹהִ֖ים לֵ/אמֹ֑ר פְּר֣וּ וּ/רְב֗וּ וּ/מִלְא֤וּ אֶת הַ/מַּ֨יִם֙ בַּ/יַּמִּ֔ים וְ/הָ/ע֖וֹף יִ֥רֶב בָּ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/022.yaml
  text: And God blessed them[a], saying, “Be fruitful and multiply, and fill the waters in the seas, and let the birds multiply on the earth.”
translation:
  language: zh_hans
  text: 上帝赐福给它们，说：“要繁衍增多，充满海中的水；愿飞鸟[a]在地上增多。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “飞鸟”或译“飞行的生物”；希伯来语 עוֹף 可泛指会飞的生物。
    reason: 保留希伯来词义范围比汉语“飞鸟”更宽的可能性。
lexical_decisions:
- source_word: וַיְבָרֶךְ
  choice: 赐福给
  rationale: 此处 ברך 的加强词干表示上帝实际赐下福分；“赐福给”自然、庄重，也保留上帝主动施福的含义。
- source_word: אֹתָם
  choice: 它们
  rationale: 直接宾语代词回指上一节所造的水中生物和飞鸟；现代汉语指动物用“它们”。
- source_word: אֱלֹהִים
  choice: 上帝
  rationale: 本章中该词与单数动词搭配，指独一的创造主；“上帝”是现代汉语通行且庄重的译法。
- source_word: לֵאמֹר
  choice: 说
  rationale: 这是引出直接引语的标准结构，译作“说”简洁自然。
- source_word: פְּרוּ וּרְבוּ
  choice: 要繁衍增多
  rationale: פרה 表示生育繁衍，רבה 表示数量增多；合译为“繁衍增多”既保留两个并列概念，又符合现代汉语表达。
- source_word: וּמִלְאוּ
  choice: 充满
  rationale: 准确表达 מלא 的“填满、充满”义，不额外加强语气。
- source_word: אֶת הַמַּיִם בַּיַּמִּים
  choice: 海里的水域
  rationale: 兼顾 מַיִם“水”和 יַמִּים“海”的表达；“海里的水域”在现代汉语中较为自然，并保留两者的关系。
- source_word: וְהָעוֹף
  choice: 飞鸟
  rationale: עוֹף 是集合名词，可泛指飞行生物；本处结合上一节语境译作“飞鸟”最自然，同时以脚注保留较宽泛的词义。
- source_word: יִרֶב
  choice: 愿……增多
  rationale: 该未完成式在此有祈愿语气。“愿”既反映祝福中的意愿，也避免将其压平为单纯命令或未来预告。
- source_word: בָּאָרֶץ
  choice: 在地上
  rationale: אָרֶץ 在此指与海相对的陆地领域；“在地上”直接、自然，并与创世叙事的空间对比相符。
theological_decisions:
- issue: 祝福话语兼有命令和祈愿的性质
  choice: 前半用“要繁衍增多……”，末句用“愿飞鸟……增多”。
  alternative: 全部译为命令式，或把末句译成单纯的未来陈述“飞鸟将会增多”。
  rationale: 希伯来文先用复数命令式，再用第三人称祈愿式。这样翻译保留上帝的祝福以命令式话语表达、同时末句带祈愿色彩的张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“繁衍增多”避免古奥表达；分号呈现水中生物与飞鸟两部分祝福的结构。脚注标记置于“飞鸟”之后，与所说明的词直接对应。
