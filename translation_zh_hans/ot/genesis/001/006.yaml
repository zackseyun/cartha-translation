  text: וַ/יֹּ֣אמֶר אֱלֹהִ֔ים יְהִ֥י רָקִ֖יעַ בְּ/ת֣וֹךְ הַ/מָּ֑יִם וִ/יהִ֣י מַבְדִּ֔יל בֵּ֥ין מַ֖יִם לָ/מָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/006.yaml
  text: And God said[a], “Let there be an expanse in the midst of the waters[b], and let it separate water from water.”
translation:
  language: zh_hans
  text: 神说：“在众水中要有穹苍[a]，使水与水分开[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“广阔空间”“穹顶”或“苍穹”。原文所用的词指铺展、延展开的事物；不同译法对古代宇宙图景的体现程度不同。
    reason: lexical_alternative
  - marker: b
    text: 原文直译近似“让它在水与水之间起分隔作用”；即把一个水体与另一个水体区分开。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 神说
  rationale: 未单独译出连接词 וַ，以符合现代汉语叙事习惯；“说”准确表达叙事推进中的发言动作。
- source_word: אֱלֹהִים
  choice: 神
  rationale: 本节中该词虽为复数形态，却与单数动词搭配，指创造万物的独一位神；“神”是现代汉语圣经语体中自然、庄重的通行译法。
- source_word: יְהִי
  choice: 要有
  rationale: 该祈使式表达神宣告即成的命令；“要有”既简洁自然，也保留神圣谕令的施行力量。
- source_word: רָקִיעַ
  choice: 穹苍
  rationale: 该词指铺展、延展开的事物。“穹苍”庄重而为普通读者熟悉，又不在正文中过度断定其具体材质；相关可能译法在脚注中保留。
- source_word: בְּתוֹךְ הַמָּיִם
  choice: 众水之间
  rationale: בְּתוֹךְ 表示处于其中或中间；מַיִם 在此指起初的水体。“众水之间”凝练地保留原文空间关系和复数意象。
- source_word: וִיהִי מַבְדִּיל
  choice: 把……分开
  rationale: 延续前一分句的命令语气，说明穹苍的功能。现代汉语用“把”字句清楚表达使两者分隔的因果动作。
- source_word: בֵּין מַיִם לָמָיִם
  choice: 把水和水分开
  rationale: 原文近似直译为“在水与水之间作分隔”。“把水和水分开”自然地表达将两个水体彼此区分，同时保留原文重复用“水”的措辞。
theological_decisions:
- issue: רָקִיעַ 与古代宇宙图景的关系
  choice: 穹苍
  alternative: 广阔空间、穹顶、苍穹
  rationale: 本节强调神在众水之间设立一个铺展开、具有分隔作用之物。正文采用“穹苍”，保留传统且庄重的图像，但不明确断定其材质或具体形状；脚注列出其他译法，以呈现该词真实存在的词义与宇宙观解释张力。
translation_notes:
  register: 采用现代、简洁而庄重的叙事语体。“众水”保留创世叙事的原初水域意象；“穹苍”避免直接译成后文才命名的“天”，也不在正文中把该词限定为某一种具体宇宙结构。
