  text: וַ/יֹּ֣אמֶר אֱלֹהִ֗ים תּוֹצֵ֨א הָ/אָ֜רֶץ נֶ֤פֶשׁ חַיָּה֙ לְ/מִינָ֔/הּ בְּהֵמָ֥ה וָ/רֶ֛מֶשׂ וְ/חַֽיְתוֹ אֶ֖רֶץ לְ/מִינָ֑/הּ וַֽ/יְהִי כֵֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/024.yaml
  text: 'And God said[a], “Let the earth bring forth living creatures according to their kinds: livestock, creeping things, and wild animals of the earth according to their kinds.” And it was so.'
translation:
  language: zh_hans
  text: 上帝说：“地要生出活物，各从其类：牲畜、地上爬行的动物和地上的野兽，各从其类。”就这样成了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תּוֹצֵא
  choice: 要生出
  rationale: 这是יצא的使役式祈愿用法，以“地”为主语，表达上帝命令地使活物出现；“要生出”自然地保留了命令与使生的意味。
- source_word: הָאָרֶץ
  choice: 地
  rationale: 在创世语境中指陆地领域；中文“地”既符合本章上下文，也避免将其误解为现代所说的整个行星。
- source_word: נֶפֶשׁ חַיָּה
  choice: 活物
  rationale: 该短语在这里泛指有生命的动物。“活物”简洁自然，保留其生命体含义，又不引入现代汉语中“灵魂”的形而上学联想。
- source_word: לְמִינָהּ
  choice: 各从其类
  rationale: 原文形式为阴性单数，但在集合名词语境中具有分配意义；“各从其类”准确而庄重地表达按类别繁衍或出现。
- source_word: בְּהֵמָה
  choice: 牲畜
  rationale: 此词在与爬行动物及野兽并列时，主要指较大型、驯养或家养的陆生动物；“牲畜”清楚呈现与野兽的对比。
- source_word: רֶמֶשׂ
  choice: 地上爬行的动物
  rationale: 泛指贴近地面移动的小动物；此译法比单独的“爬物”更符合现代汉语，也不限定为现代动物分类中的爬行动物。
- source_word: חַיְתוֹ אֶרֶץ
  choice: 野兽
  rationale: 该短语指地上的野生动物，并与“牲畜”形成对照；“野兽”在本句中简练清楚，其中“地上”的范围已由相邻短语和“地要生出”交代。
- source_word: וַיְהִי כֵן
  choice: 事情就这样成了
  rationale: 这是创世记第一章反复出现的成就公式；此译法保留事情依上帝所言实现的含义，并符合现代庄重汉语。
theological_decisions:
- issue: 是否用带有神学负载的词翻译נֶפֶשׁ
  choice: 活物
  alternative: 有生命的魂；有生命的存在
  rationale: 此处所说的是动物性生命，并非专门论述动物的形而上构成。“活物”既传达生命实体的意义，也不把后来的“灵魂”观念带入经文。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“各从其类”保留创世叙事的节奏；“地上爬行的动物”避免现代读者将“爬行动物”误当作严格的生物分类术语。
