id: GEN.13.16
reference: Genesis 13:16
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/שַׂמְתִּ֥י אֶֽת זַרְעֲ/ךָ֖ כַּ/עֲפַ֣ר הָ/אָ֑רֶץ אֲשֶׁ֣ר אִם יוּכַ֣ל אִ֗ישׁ לִ/מְנוֹת֙ אֶת עֲפַ֣ר הָ/אָ֔רֶץ גַּֽם זַרְעֲ/ךָ֖ יִמָּנֶֽה־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/016.yaml
  text: And I will make your offspring like the dust of the earth[a], so that if a man can count the dust of the earth[b], then your offspring also can be counted.
translation:
  language: zh_hans
  text: 我要使你的后裔[a]多如地上的尘土；若有人[b]能数清地上的尘土，你的后裔也能数得清。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “后裔”原文也可译作“种子”或“子孙”；该词在这里是集合名词。
    reason: lexical_alternative
  - marker: b
    text: “有人”原文直译为“一个男人”，这里具有泛指作用。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתִּי
  choice: 我要使
  rationale: שׂוּם本义为“放置、设立”，但在“后裔”作宾语并接比较语的结构中，表达“使……成为／达到某种情形”；译为“我要使”自然且保留使成之意。
- source_word: זַרְעֲךָ
  choice: 你的后裔
  rationale: זֶרַע既可指实际的“种子”，也可集合性地指人的后代。本节论亚伯兰的后代，现代汉语用“后裔”清楚而庄重，并保留集合含义。
- source_word: כַּעֲפַר הָאָרֶץ
  choice: 多如地上的尘土
  rationale: 原文直译为“像地上的尘土”。结合随后关于能否数清的说明，比较点是数量繁多；“多如”在现代汉语中自然呈现这一明确的语境含义，同时保留尘土意象。
- source_word: אֲשֶׁר אִם
  choice: 若
  rationale: 这一组合引出假设性的比较条件；汉语“若”简洁、庄重，并与后句“也”形成自然对应。
- source_word: אִישׁ
  choice: 有人
  rationale: אִישׁ形式上是阳性单数“男人”，此处具有泛指作用，所说的是任何可能数清尘土的人；汉语“有人”准确传达这种泛指，并不额外限定性别。
- source_word: לִמְנוֹת / יִמָּנֶה
  choice: 能数清／也能数得清
  rationale: מנה表示计数、点算。条件句谈的是可数性而非预言实际会被数点，因此用“能数清／能数得清”准确体现假设和可能性。
- source_word: גַּם
  choice: 也
  rationale: גַּם标示尘土与后裔在可数性上的对应；“也”是最自然的汉语表达。
theological_decisions:
- issue: 亚伯拉罕应许中集合名词זֶרַע的译法
  choice: 你的后裔
  alternative: 你的种子；你的子孙
  rationale: 本节把亚伯兰的后代作为不可胜数的整体来描述。“后裔”保留集合意义，又不在本节中预先限定为某一个单数人物或加入特定神学解释。
- issue: אִישׁ的阳性形式与泛指功能
  choice: 有人
  alternative: 一个男人；任何人
  rationale: 原文名词虽为阳性单数，但语境功能是泛指能够数尘土的人。现代汉语“有人”忠实传达这一功能，避免让读者误以为应许所设的条件仅限男性。
- issue: 尘土比喻的比较点
  choice: 多如地上的尘土
  alternative: 如同地上的尘土
  rationale: 下半句明确以“数清”为焦点，表明比较点是数目繁多。“多如”将原文由语境确定的意义自然表达出来，而不改变其不可胜数的神学强调。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“若……也……”保留原文假设性比较；“数清／数得清”比单用“数”更自然地表达能否计数穷尽。脚注标记按其实际解释对象分别置于“后裔”和“有人”之后。
