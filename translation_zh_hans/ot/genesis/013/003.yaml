base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/003.yaml
  text: And he journeyed by stages from the Negev as far as Bethel[a], to the place where his tent had been at the beginning, between Bethel and Ai.
translation:
  language: zh_hans
  text: 他从南地一站一站地[a]前行，直到伯特利，到了他起初支搭帐篷的地方；那地方在伯特利和艾城之间。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “一站一站地”也可译作“按着先前的行程”，意思是从一个营地到另一个营地，分段前行。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: 往前走
  rationale: הלך是常用的“走、去”；在带有路线说明的旅行叙事中，“往前走”自然表达持续行程，又不过度增译。
- source_word: לְמַסָּעָיו
  choice: 一站一站地
  rationale: מַסָּע可指拔营后的一段行程；复数形式在此表示按 successive stages 行进。“一站一站地”清楚传达从一个营地到另一个营地的旅行方式。
- source_word: מִנֶּגֶב
  choice: 从南地
  rationale: נֶגֶב既可指“南方”，也可特指该干旱地区；本节族长叙事的地理语境支持地域名“南地”。
- source_word: וְעַד בֵּית אֵל
  choice: 直到伯特利
  rationale: עַד表示范围或终点，“直到”准确表达行程所达之处。
- source_word: עַד הַמָּקוֹם
  choice: 到了……地方
  rationale: 第二个עַד进一步限定目的地；汉语用“到了”承接前句，比机械重复“直到”更自然。
- source_word: אֲשֶׁר הָיָה שָׁם אהל/ה
  choice: 他……搭帐篷的地方
  rationale: 关系从句回指亚伯兰先前安置帐篷之处；“地方”已自然包含שָׁם“那里”的地点意义。
- source_word: בַּתְּחִלָּה
  choice: 起初
  rationale: 该词回指亚伯兰较早的一次扎营；“起初”简洁保留时间上的回顾。
- source_word: בֵּין בֵּית אֵל וּבֵין הָעָי
  choice: 伯特利和艾城之间
  rationale: בֵּין…וּבֵין表示处于两地之间；“艾城”是现代中文圣经地名的自然表达。
theological_decisions: []
