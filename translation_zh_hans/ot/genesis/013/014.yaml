base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/014.yaml
  text: 'And Yahweh said to Abram[a], after Lot had separated from him, “Please lift up your eyes and look from the place where you are: northward and southward and eastward and westward.”'
translation:
  language: zh_hans
  text: 罗得离开亚伯兰以后，耶和华[a]对亚伯兰说：“请你举目，从你所在的地方向北、向南、向东、向西观看。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “耶和华”是希伯来文神名 יהוה 的传统中文音译；也常音译作“雅威”。
    reason: 说明神名的原文形式及另一常见音译。
lexical_decisions:
- source_word: וַיהוָה
  choice: 耶和华
  rationale: 以汉语中通行的神名音译“耶和华”对应四字神名 יהוה；句首的 וַ 在汉语叙事中不必机械译作“并且”，其承接关系由语序自然表达。
- source_word: אַחֲרֵי הִפָּרֶד לוֹט מֵעִמּוֹ
  choice: 罗得离开亚伯兰以后
  rationale: אַחֲרֵי 加不定式结构表示其后的时间；פרד 的尼法勒词干在此表示分开、离开。将代词所指明说为“亚伯兰”，可避免现代汉语中“离开他”的指代含混。
- source_word: שָׂא נָא עֵינֶיךָ
  choice: 请你举目
  rationale: “举目”自然保留“抬起眼睛”的希伯来语意象；נָא 使命令语气较为和缓，译作“请”。
- source_word: וּרְאֵה
  choice: 观看
  rationale: 此处是命令亚伯兰朝各方察看土地；“观看”比单独的“看见”更能表达主动定睛察看的动作。
- source_word: מִן הַמָּקוֹם אֲשֶׁר אַתָּה שָׁם
  choice: 从你所在的地方
  rationale: 准确表达观看的出发位置；“所在”已包含 שָׁם 的处所含义，不增添原文没有的“站立”。
- source_word: צָפֹנָה וָנֶגְבָּה וָקֵדְמָה וָיָמָּה
  choice: 向北、向南、向东、向西
  rationale: 四个词的方向词尾 -ה 表示朝向；按原文次序保留北、南、东、西四方。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用以色列上帝的四字神名，而非普通称谓“主”。正文采用现代中文圣经读者最熟悉的传统音译“耶和华”，脚注说明其性质；“雅威”是较接近学界常见复原读音的另一种音译。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“举目”虽略具书面色彩，但在现代汉语中仍清楚自然，并保留原文意象；四个方向以顿号连接，避免重复连词造成生硬，同时保持原文次序。
