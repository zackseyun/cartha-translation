base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/017.yaml
  text: Get up[a], walk through the land, through its length and its width[b], for I will give it to you.
translation:
  language: zh_hans
  text: 起来，走遍这地，纵横全境[a]，因为我要把这地赐给你。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“沿着这地的长度和宽度行走。”
    reason: 保留原文以“长度”和“宽度”表示全地范围的具体空间措辞。
lexical_decisions:
- source_word: ק֚וּם
  choice: 起来
  rationale: 命令式，意为起身、起来；“起来”自然、直接，并保留命令语气。
- source_word: הִתְהַלֵּ֣ךְ בָּאָ֔רֶץ
  choice: 走遍这地
  rationale: התהלך在此表示四处行走、遍行；结合地点短语，译为“走遍这地”既自然，也表达巡视全境的意味。
- source_word: לְאָרְכָּ֖הּ וּלְרָחְבָּ֑הּ
  choice: 纵横各处
  rationale: 原文直指这地的长度和宽度，是表示全境范围的成对说法；“纵横各处”在现代汉语中简洁地传达遍及全地，同时以脚注保留较直译表达。
- source_word: כִּ֥י
  choice: 因为
  rationale: 引出前述命令的理由。
- source_word: לְךָ֖ אֶתְּנֶֽנָּה
  choice: 我要把这地赐给你
  rationale: 未完成式在应许语境中表达将来；阴性单数后缀回指“地”。把代词明译为“这地”，可避免汉语中的指代含混；“赐给”符合神作为给予者的庄重语境。
theological_decisions:
- issue: אֶתְּנֶנָּה中阴性单数后缀的所指
  choice: 明译为“这地”
  alternative: 译为“它”
  rationale: 该后缀在语法上自然回指阴性名词אֶרֶץ“地”；明译所指不增加文本之外的神学解释，并使汉语清楚。
- issue: 应许的时态表达
  choice: “我要……赐给你”
  alternative: “我正把……赐给你”
  rationale: 未完成式可依语境有不同时间色彩；此处作为神的应许，以将来表达最贴切，但不额外说明兑现方式或时间。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“走遍这地，纵横各处”避免生硬照搬希伯来语介词结构；脚注则保存原文的空间表达。
