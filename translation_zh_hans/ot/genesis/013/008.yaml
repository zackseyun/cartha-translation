base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/008.yaml
  text: So Abram said to Lot[a], “Please, let there be no strife between me and you, and between my herdsmen and your herdsmen[b], for we are kinsmen.”
translation:
  language: zh_hans
  text: 于是，亚伯兰对罗得说：“请不要让你我之间起争执，也不要让我的牧人和你的牧人之间起争执，因为我们是亲属。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“我们是弟兄”；希伯来语“弟兄”也可泛指有血缘关系的亲属。
    reason: 说明原文字面表达及其较广的亲属含义。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 于是，亚伯兰……说
  rationale: 连续式叙事动词推进情节；“于是”自然表达承接关系，同时不把连接词解释得过重。
- source_word: אַל נָא תְהִי מְרִיבָה
  choice: 请……不要相争
  rationale: אַל与祈愿式表达否定请求，נָא使语气委婉；“请……不要相争”既保留劝止意味，也符合现代汉语表达。
- source_word: בֵּינִי וּבֵינֶיךָ
  choice: 你我之间
  rationale: 保留“在……之间”的关系结构，同时采用自然简洁的汉语语序。
- source_word: רֹעַי ... רֹעֶיךָ
  choice: 我的牧人……你的牧人
  rationale: 该词指照管牲畜的人；“牧人”不局限于羊群，适合本段涉及多种牲畜的语境。
- source_word: כִּי
  choice: 因为
  rationale: 明确表达后半句是亚伯兰劝和的理由。
- source_word: אֲנָשִׁים אַחִים אֲנָחְנוּ
  choice: 我们是亲族
  rationale: אַבְרָם与罗得并非同胞兄弟；אַחִים在此表示较广的血缘亲属关系。“亲族”在现代汉语中自然传达其语境意义，脚注保留“弟兄”的字面形式。
theological_decisions:
- issue: אַחִים在亚伯兰与罗得关系中的含义
  choice: 正文译为“亲族”
  alternative: “弟兄”或“我们是作弟兄的人”
  rationale: 希伯来语“弟兄”可涵盖更广泛的男性亲属关系。正文采用不致误导现代读者的“亲族”，同时用脚注呈现原文的字面措辞，不把两人的关系误解为同父母所生。
translation_notes:
  register: 采用现代、庄重而口语自然的叙事语体。“请”表现亚伯兰的温和劝告；两个“之间”及重复的“不要相争”适度保留原文的平行结构，使劝和的对象清楚明确。
