base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/007.yaml
  text: And there was strife between the herdsmen of Abram’s livestock and the herdsmen of Lot’s livestock[b][a]. Now the Canaanite and the Perizzite were dwelling in the land at that time.
translation:
  language: zh_hans
  text: 亚伯兰牲畜的牧人和罗得牲畜的牧人之间起了争执。那时，迦南人和比利洗人[a]住在那地。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “迦南人”和“比利洗人”的希伯来原文均为带定冠词的单数族名，在这里作集合称谓。
    reason: 说明原文两个单数族名的集合性用法；汉语正文中的族名形式可自然表集合。
lexical_decisions:
- source_word: וַיְהִי רִיב
  choice: 起了争执
  rationale: וַיְהִי引入叙事中的事件，רִיב指争端或争吵；“起了争执”自然地表达冲突的发生。
- source_word: רֹעֵי מִקְנֵה
  choice: 牧人……为牲畜
  rationale: רֹעֵי是照管畜群的人，מִקְנֶה泛指牲畜。汉语若逐字重复“牲畜的牧人”显得生硬，因此以“牧人……为牲畜”表达双方牧人因牲畜而争执，并结合上下文保留所指。
- source_word: בֵּין ... וּבֵין
  choice: ……和……
  rationale: 原文标明争执发生在两方之间；现代汉语用并列双方加“起了争执”即可自然体现双边关系。
- source_word: וְהַכְּנַעֲנִי וְהַפְּרִזִּי
  choice: 迦南人和比利洗人
  rationale: 两个带冠词的单数族名均作集合称谓；汉语族名“人”本身可作单复数集合表达。
- source_word: אָז יֹשֵׁב
  choice: 那时……住
  rationale: אָז表示叙事中的时间背景，分词יֹשֵׁב表达持续居住状态；“那时……住”简洁自然。
- source_word: בָּאָרֶץ
  choice: 在那地
  rationale: “那地”保留הָאָרֶץ的地域指向，也不削弱《创世记》中可能具有的土地意涵。
theological_decisions:
- issue: הָאָרֶץ可能具有的应许之地意涵
  choice: 那地
  alternative: 那个地方／那个地区
  rationale: “那地”既符合当下地理语境，又保留《创世记》中“地”可能承载的盟约性回响，而不在正文中增添解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事文体。“起了争执”比“有相争”更符合当代普通话；族名采用常见圣经译名。脚注标记置于两个并列族名之后，明确涵盖二者。
