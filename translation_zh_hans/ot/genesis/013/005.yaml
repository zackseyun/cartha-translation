  yaml_path: translation/ot/genesis/013/005.yaml
  text: And Lot[a], who went with Abram, also had flocks and herds and tents.
translation:
  language: zh_hans
  text: 与亚伯兰同行的罗得也有羊群[a]、牛群和帐篷。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “羊群”所译的希伯来语泛指小型牲畜，尤其是绵羊和山羊；“牛群”则指牛类牲畜。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: 也
  rationale: 此处连接上文，并强调罗得同样拥有产业；现代汉语用“也”自然表达附加意义，不必机械译出句首连接词。
- source_word: לְלוֹט ... הָיָה
  choice: 罗得……有
  rationale: 介词לְ与存在动词构成领属表达，直译为“对罗得有”；现代汉语自然表达为“罗得有”。
- source_word: הַהֹלֵךְ אֶת אַבְרָם
  choice: 与亚伯兰同行的
  rationale: 分词短语修饰罗得，表示他陪同亚伯兰而行；“同行”既简洁，又保留持续伴随的意味。
- source_word: צֹאן
  choice: 羊群
  rationale: 该词泛指小型牲畜，尤其绵羊和山羊。正文采用汉语圣经叙事中自然简洁的“羊群”，并以脚注说明其范围。
- source_word: וּבָקָר
  choice: 牛群
  rationale: 该词指牛类牲畜；“牛群”与“羊群”结构平行，也准确表达集体意义。
- source_word: וְאֹהָלִים
  choice: 帐篷
  rationale: 复数名词指帐篷，可反映罗得家族营地的规模及其物质产业；汉语中无需显式标示复数。
