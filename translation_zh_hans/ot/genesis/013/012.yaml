base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/012.yaml
  text: Abram lived in the land of Canaan[a], and Lot lived in the cities of the plain and pitched his tents as far as Sodom.
translation:
  language: zh_hans
  text: 亚伯兰住在迦南地；罗得住在平原的城邑中，把帐棚一直支搭到所多玛。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“把帐棚迁移到所多玛一带。”原文动词可指支搭帐棚，也可指以帐棚迁移驻扎；这里是说罗得的营地向所多玛延伸，不一定表示他此时已经住进城内。
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשַׁב
  choice: 住在
  rationale: 该动词在本节表示居住、定居；“住在”是现代汉语中自然且准确的表达，并保留其状态性含义。
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: 在迦南地
  rationale: 保留原文 אֶרֶץ（地、土地），同时符合中文对该地名的惯常表达。
- source_word: בְּעָרֵי הַכִּכָּר
  choice: 在平原的城邑中
  rationale: כִּכָּר 在此指约旦河一带的平原区域；“城邑”保留复数集合意义，也适合叙事文体。
- source_word: וַיֶּאֱהַל
  choice: 把帐棚一路搭到
  rationale: 该动词源于“帐棚”，可指搭帐棚或以帐棚迁移驻扎；结合 עַד，译文表达罗得的营地向所多玛延伸，同时不明说他此时已经住进城内。
- source_word: עַד סְדֹם
  choice: 到所多玛
  rationale: עַד 表示空间上的界限或延伸终点；与“一路搭到”组合，传达营地朝所多玛方向延伸、以所多玛为界的意思。
- source_word: אַבְרָם
  choice: 亚伯兰
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: לוֹט
  choice: 罗得
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: סְדֹם
  choice: 所多玛
  rationale: 采用现代中文圣经传统中通行的地名译法。
theological_decisions:
- issue: 罗得与所多玛的关系
  choice: 把帐棚一路搭到所多玛
  alternative: 住进所多玛
  rationale: 原文只说明其搭帐棚的范围延伸至所多玛，并未在本节明确说罗得已经进入或定居城内；译文不提前消除这一叙事上的区别。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“城邑”略具叙事文体色彩，但普通读者易懂；“一路搭到”清楚表达营地延伸的动态，也避免将原文误解为单次搭棚或已经入住城中。
