  text: Abram was very wealthy in livestock[a], silver, and gold.
translation:
  language: zh_hans
  text: 亚伯兰非常富有，牲畜、银子和金子都很多。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אַבְרָם
  choice: 亚伯兰
  rationale: 人名按现代中文圣经通行形式音译。句首的 וְ 是叙事承接词；本句在现代汉语中无需机械译作“和”或“于是”，上下文已能自然体现承接关系。
- source_word: כָּבֵד מְאֹד
  choice: 非常富有
  rationale: כָּבֵד 本义为“重”，在列举财产的语境中是“富有、财力雄厚”的习语；מְאֹד 加强程度，译作“非常”。合译既准确又符合现代汉语表达。
- source_word: בַּ/מִּקְנֶה
  choice: 拥有大量牲畜
  rationale: מִקְנֶה 在族长叙事中主要指所拥有的家畜、畜群。将介词结构自然转换为“拥有大量”，也具体说明其财富体现在哪些方面。
- source_word: בַּ/כֶּסֶף
  choice: 银子
  rationale: כֶּסֶף 在此指作为财物的银；“银子”比单说“银”更自然地表达财富类别。
- source_word: וּ/בַ/זָּהָב
  choice: 和金子
  rationale: זָהָב 指金；连词 וּ 译作“和”，与前面的牲畜、银子共同构成财富清单。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“非常富有”传达希伯来语习语，后半句保留牲畜、银、金三类具体财富。句首叙事连接词未单独译出，以免形成生硬的汉语句式。
