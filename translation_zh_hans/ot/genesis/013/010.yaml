id: GEN.13.10
reference: Genesis 13:10
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יִּשָּׂא ל֣וֹט אֶת עֵינָ֗י/ו וַ/יַּרְא֙ אֶת כָּל כִּכַּ֣ר הַ/יַּרְדֵּ֔ן כִּ֥י כֻלָּ֖/הּ מַשְׁקֶ֑ה לִ/פְנֵ֣י שַׁחֵ֣ת יְהוָ֗ה אֶת סְדֹם֙ וְ/אֶת עֲמֹרָ֔ה כְּ/גַן יְהוָה֙ כְּ/אֶ֣רֶץ מִצְרַ֔יִם בֹּאֲ/כָ֖ה צֹֽעַר־־־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/010.yaml
  text: Lot lifted up his eyes and saw all the plain of the Jordan[a], that all of it was well watered before Yahweh destroyed Sodom and Gomorrah, like the garden of Yahweh, like the land of Egypt[d][c][b], as you go toward Zoar.
translation:
  language: zh_hans
  text: 罗得举目，看见约旦河流域的整个平原[a]，那里全都水源充足；那是在雅威毁灭所多玛和蛾摩拉以前。那地如同雅威的园子[b]，如同埃及地，在通往琐珥的方向[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “约旦河流域的整个平原”也可译作“整个约旦河谷”；较直译为“约旦河整个环形地带”。
    reason: lexical_alternative
  - marker: b
    text: “雅威的园子”很可能使人联想到伊甸园的丰美景象。
    reason: cross_reference
  - marker: c
    text: 或译：“往琐珥方向去。”原文这一表达标示通往或朝向琐珥的方向；在此也可能涉及地域范围。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא ... אֶת־עֵינָיו
  choice: 举目
  rationale: 这是表示抬眼观看、把目光投向某处的希伯来语惯用语。“举目”既保留叙事质感，也符合庄重而自然的现代汉语。
- source_word: וַיַּרְא
  choice: 看见
  rationale: 采用直接的感知动词，准确呈现叙事动作。
- source_word: כָּל־כִּכַּר הַיַּרְדֵּן
  choice: 约旦河整个平原
  rationale: כִּכָּר在这里指约旦河一带的平坦区域，也可理解为圆形地带或河谷；正文用“平原”表达地理意义，其他可能译法列入脚注。
- source_word: כִּי כֻלָּהּ מַשְׁקֶה
  choice: 全都水源充足
  rationale: מַשְׁקֶה描写整片地区水量充沛、灌溉条件良好。“水源充足”在现代汉语中自然，并避免过度限定为人工灌溉。
- source_word: לִפְנֵי שַׁחֵת יְהוָה
  choice: 那是在雅威毁灭……以前
  rationale: לִפְנֵי在此表示时间上的“以前”，שׁחת结合所多玛和蛾摩拉的语境明确指毁灭。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以常见的现代汉语音译呈现四字神名，保留原文使用专名而非称号的特点。
- source_word: כְּגַן־יְהוָה
  choice: 好像雅威的园子
  rationale: 保留原文的明喻及“园子”意象，不在正文中直接把它等同于伊甸园。
- source_word: כְּאֶרֶץ מִצְרַיִם
  choice: 也像埃及地
  rationale: 保留אֶרֶץ“地、国土”的地理含义以及与前一明喻平行的结构。
- source_word: בֹּאֲכָה צֹעַר
  choice: 一直延伸到琐珥
  rationale: 这一惯用表达标示朝向或界限。结合本句对地域范围的描写，译为“一直延伸到琐珥”较自然；较贴近形式的方向性译法保留在脚注。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。正文采用“雅威”，以专名对应专名，避免用称号“主”取代；“耶和华”则是另一传统音译。
- issue: “雅威的园子”是否明确译作伊甸园
  choice: 保留“雅威的园子”
  alternative: 伊甸园
  rationale: 这个表达很可能唤起伊甸园的意象，但原文没有在此直接使用“伊甸”一词；保留原有措辞可避免把暗示解释成明说。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“举目”保留经文叙事风格，但仍为普通读者熟悉；地名采用通行译名“所多玛、蛾摩拉、琐珥”。将较长的希伯来语句子分为两句，并以分号维持毁灭前景况与两项比喻之间的联系。
