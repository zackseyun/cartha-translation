base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/018.yaml
  text: So Abram moved his tent and came and settled by the oaks of Mamre[a], which are at Hebron[b], and there he built an altar to Yahweh.
translation:
  language: zh_hans
  text: 于是，亚伯兰迁移了帐篷，来到希伯仑幔利的橡树那里，住下；他在那里为雅威筑了一座坛。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “橡树”也可译作“笃耨香树”或“大树”；希伯来语所指的确切树种不确定。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּאֱהַל
  choice: 迁移帐篷
  rationale: 该动词源于“帐篷”，在这里表示亚伯兰带着帐篷迁移；这样既保留原文意象，也避免与后面的“来到、住下”重复。
- source_word: וַיָּבֹא וַיֵּשֶׁב
  choice: 来到……住下
  rationale: 依次保留原文的移动与居住动作，并使用自然的现代汉语叙事表达。
- source_word: בְּאֵלֹנֵי מַמְרֵא
  choice: 在……幔利橡树那里
  rationale: אֵלוֹן／אֵלֹנֵי可指橡树或笃耨香树等高大树木；正文采用传统且易懂的“橡树”，脚注保留树种的不确定性。
- source_word: אֲשֶׁר בְּחֶבְרוֹן
  choice: 希伯仑的
  rationale: 关系从句用于说明幔利橡树所在之处；汉语以定语结构表达更自然，没有增添超出原文的地理关系。
- source_word: וַיִּבֶן שָׁם מִזְבֵּחַ
  choice: 并在那里……筑了一座坛
  rationale: 保留地点副词“在那里”和建造祭坛的动作；“筑坛”是现代中文圣经语体中清楚而庄重的表达。
- source_word: לַיהוָה
  choice: 为耶和华
  rationale: 介词ל表示坛是为敬拜耶和华而筑；“耶和华”是现代汉语中对四字神名的通行音译。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。正文采用中文读者最熟悉的传统音译“耶和华”，而不以“主”替代，从而保留专名性质；“雅威”是较接近学界拟音的另一译法。
- issue: אֵלֹנֵי所指树种
  choice: 橡树
  alternative: 笃耨香树（terebinth）或泛指大树
  rationale: 希伯来词所指的确切树种有争议，因此正文选用通行译法，同时以脚注明确保留词义的不确定性。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。以“迁移帐篷—来到—住下”呈现希伯来文连续动作；地名关系压缩为符合汉语习惯的“希伯仑的幔利橡树那里”。
