- from: 于是，亚伯兰迁移帐篷，来到希伯仑的幔利橡树那里[a]住下，并在那里为耶和华筑了一座坛。
  to: 于是，亚伯兰迁移了帐篷，来到希伯仑幔利的橡树那里，住下；他在那里为雅威筑了一座坛。[a]
  rationale: 修订地点语序以符合现代标准汉语，并将“住下”与到达动作清楚衔接。保留原文连续动作、地点强调及筑坛行为；脚注继续呈现树种的真实词义不确定性。神名改为“雅威”，以对应本项目英文审校轨迹所规定的 Yahweh。
