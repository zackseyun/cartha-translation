  text: וְ/לֹא נָשָׂ֥א אֹתָ֛/ם הָ/אָ֖רֶץ לָ/שֶׁ֣בֶת יַחְדָּ֑ו כִּֽי הָיָ֤ה רְכוּשָׁ/ם֙ רָ֔ב וְ/לֹ֥א יָֽכְל֖וּ לָ/שֶׁ֥בֶת יַחְדָּֽו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/006.yaml
  text: And the land could not support them living together, because their possessions were too great for them to live together.
translation:
  language: zh_hans
  text: 那地容不下他们住在一起，因为他们的财物很多，他们无法住在一起。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נָשָׂא
  choice: 容得下
  rationale: 此处字面义为“承载”，用于土地与人口、牲畜及财物的关系时，自然表达为“容得下”，保留土地承载能力不足的意象。
- source_word: לָשֶׁבֶת יַחְדָּו
  choice: 住在一起
  rationale: יָשַׁב在此指居住；“住在一起”准确、自然，并保留原文前后重复。
- source_word: רְכוּשָׁם רָב
  choice: 他们的财物很多
  rationale: רְכוּשׁ泛指所得的财产，包括牲畜等；译作“财物”比单纯“财富”更具体，也不额外限定范围。
- source_word: יָכְלוּ
  choice: 无法
  rationale: 表达能力或现实可行性上的不能，与前半句土地容纳不足相呼应。
theological_decisions: []
