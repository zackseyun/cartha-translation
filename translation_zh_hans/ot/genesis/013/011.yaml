base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/011.yaml
  text: So Lot chose for himself all the plain of the Jordan[a], and Lot journeyed eastward; and they separated from each other.
translation:
  language: zh_hans
  text: 于是，罗得为自己选择了约旦河一带的整个平原，罗得就向东迁去[a]；他们便彼此分开了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“从东边迁去。”希伯来语短语既可表示行进方向，也可表示出发地点。
    reason: 保留 מִקֶּדֶם 的真实句法与词义歧义，并避免“迁来”附加原文没有的趋向意义。
lexical_decisions:
- source_word: וַיִּבְחַר לוֹ
  choice: 为自己选择了
  rationale: בּחר意为“选择”，间接受词לוֹ强调这是罗得为自己作出的选择；汉语用“为自己”自然保留这一层意思。
- source_word: כָּל כִּכַּר הַיַּרְדֵּן
  choice: 约旦河一带的整个平原
  rationale: כִּכָּר在此指约旦河周边的平坦地区。“一带的整个平原”既表达地域范围，也避免把该词生硬直译为“圆圈”。
- source_word: וַיִּסַּע
  choice: 迁去
  rationale: נסע常指拔营启程、迁移。上下文涉及牧群与住处，“迁去”比单纯“走去”更贴切，也符合现代汉语叙事。
- source_word: מִקֶּדֶם
  choice: 向东
  rationale: 此短语可表示行进方向“向东”，也可能表示出发点“从东边”。正文采用较符合上下文的方向义，并以脚注保留另一种可能。
- source_word: וַיִּפָּרְדוּ
  choice: 彼此分开了
  rationale: פרד的尼法勒形表达双方分离；“彼此分开”自然呈现相互关系。
- source_word: אִישׁ מֵעַל אָחִיו
  choice: 他们便彼此分开了
  rationale: 原文是分配式单数表达，字面近于“各人离开自己的弟兄”，在此表示亚伯兰与罗得互相分离。现代汉语用“彼此分开”准确传达其语义，同时避免让“弟兄”被误解为二人是亲兄弟。
theological_decisions:
- issue: 亲属称谓 אָחִיו 的表达
  choice: 彼此分开
  alternative: 各人离开自己的弟兄
  rationale: אָח可广指同族或近亲，不一定是亲兄弟；亚伯兰与罗得实际是叔侄。正文采用自然的关系性表达，不把希伯来语亲属惯用语误收窄为汉语的亲兄弟关系。
- issue: מִקֶּדֶם 的方向歧义
  choice: 向东迁去
  alternative: 从东边迁来
  rationale: 希伯来语形式可按方向或起点理解。上下文较支持罗得朝东迁移，但证据不足以排除起点义，因此在脚注中明确保留异读。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“于是”“便”维持希伯来叙事的推进感；重复“罗得”对应原文重复主语，并使长句关系清楚。脚注标记紧接产生歧义的“向东迁去”。
