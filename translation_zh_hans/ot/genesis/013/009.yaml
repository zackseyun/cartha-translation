base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/009.yaml
  text: Is not the whole land before you? Please separate from me. If you go to the left[a], then I will go to the right; and if you go to the right, then I will go to the left.
translation:
  language: zh_hans
  text: 整片土地不都在你面前吗？请你与我分开。你若往左边去[a]，我就往右边去；你若往右边去，我就往左边去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文的两个条件句都省略了动作，直译为：“若左边，我就往右边去；若右边，我就往左边去。”正文补出“往……去”，使汉语意思清楚。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: 不都……吗
  rationale: 引出预期对方赞同的反问；现代汉语以“不都……吗”自然传达这一语气。
- source_word: כָל הָאָרֶץ
  choice: 整片土地
  rationale: 这里指眼前可供居住、放牧的全部地域，并非整个地球；“整片土地”既准确又自然。
- source_word: לְפָנֶיךָ
  choice: 在你面前
  rationale: 保留希伯来语的空间意象，也能让现代读者理解为土地就在罗得眼前、可由他选择。
- source_word: הִפָּרֶד נָא מֵעָלָי
  choice: 请你与我分开
  rationale: נָא 表示礼貌请求；“与我分开”准确表达彼此分居、分道而行的意思，避免误解为关系决裂。
- source_word: אִם הַשְּׂמֹאל
  choice: 你若往左边去
  rationale: 原文条件句省略动作动词；汉语补出“往……去”，使意思清楚，同时不增添“选择”等较强解释。
- source_word: וְאֵימִנָה
  choice: 我就往右边去
  rationale: 方向形式表示朝右边移动；“就”清楚呈现与前一条件相应的结果。
- source_word: וְאִם הַיָּמִין
  choice: 你若往右边去
  rationale: 与前一条件句保持平行，并补出原文省略但语境隐含的动作。
- source_word: וְאַשְׂמְאִילָה
  choice: 我就往左边去
  rationale: 表达亚伯兰将向相反方向移动，保留原文左右对称的结构。
theological_decisions: []
