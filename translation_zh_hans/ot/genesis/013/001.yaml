  text: So Abram went up from Egypt[a], he and his wife and all that he had, and Lot with him, to the Negev.
translation:
  language: zh_hans
  text: 亚伯兰从埃及上到南地[a]；他的妻子、他所有的一切和罗得都与他同行。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“往南方”。希伯来语“南地”既可指迦南南部的特定地区，也可泛指南方或南方之地。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: 上到
  rationale: 保留עלה“上去、上行”的空间表达；从埃及进入迦南在圣经叙事中常称为“上去”。“上到”在现代汉语中既自然，也比单译“离开”更贴近原文。
- source_word: מִמִּצְרַיִם
  choice: 从埃及
  rationale: 直接表达介词מן所标明的出发地。
- source_word: הוּא וְאִשְׁתּוֹ
  choice: 带着妻子
  rationale: 结合汉语叙事习惯处理独立代词与并列成分，明确亚伯兰本人是行动主体，并自然表达妻子同行；其主体身份已由句首“亚伯兰”充分体现。
- source_word: וְכָל אֲשֶׁר לוֹ
  choice: 和他所有的一切
  rationale: 保持原文范围宽泛，不局限于财物，也可包括牲畜、人员及其他所属之物。
- source_word: וְלוֹט עִמּוֹ
  choice: 罗得也和他一起
  rationale: 保留罗得作为附加同行者的叙事位置，并用“也”自然体现希伯来语连续并列中的追加意味。
- source_word: הַנֶּגְבָּה
  choice: 到南地
  rationale: 此处נֶגֶב很可能指迦南南部称为“南地”的区域；方向词尾译作“到”。“南地”兼具地名色彩，也保留其与“南方”这一普通方位义的联系。
