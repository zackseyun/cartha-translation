source:
  edition: WLC
  text: כִּ֧י אֶת כָּל הָ/אָ֛רֶץ אֲשֶׁר אַתָּ֥ה רֹאֶ֖ה לְ/ךָ֣ אֶתְּנֶ֑/נָּה וּֽ/לְ/זַרְעֲ/ךָ֖ עַד עוֹלָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/015.yaml
  text: For all the land that you see[a], I will give to you and to your offspring forever.
translation:
  language: zh_hans
  text: 因为你所看见的所有土地，我要赐给你和你的后裔[a]，直到永远。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“种子”。希伯来语 זֶרַע 是集合名词，可以指“种子”、“后裔”或“子孙”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文观看土地的命令，引出其依据和应许；“因为”在现代汉语中自然保留连接和解释作用。
- source_word: כָּל הָאָרֶץ אֲשֶׁר אַתָּה רֹאֶה
  choice: 你所看见的全部土地
  rationale: 保留כָּל的整体范围以及关系从句的直接含义，同时符合现代汉语语序。
- source_word: לְךָ אֶתְּנֶנָּה
  choice: 我都要赐给你
  rationale: 未完成式在此表达将来的应许；“赐给”适合神作为施予者的庄重语境，“都”照应“全部土地”。
- source_word: וּלְזַרְעֲךָ
  choice: 和你的后裔[a]
  rationale: זֶרַע是集合名词，可指种子、后代或子孙；“后裔”自然庄重，也不限定后代人数。脚注保留其“种子”的字面词义和集合性。
- source_word: עַד עוֹלָם
  choice: 直到永远
  rationale: 准确表达持续、无尽的时间范围，并保留土地应许在神学上的分量，不替读者限定其实现方式。
theological_decisions:
- issue: 土地应许中עַד עוֹלָם的持续时间
  choice: 直到永远
  alternative: 永久；直到久远
  rationale: “直到永远”最直接地保留原文持久乃至无尽的语义力度，同时不引入特定的末世论或圣约体系。
- issue: זֶרַע的集合性及可能的单复数张力
  choice: 后裔
  alternative: 种子；子孙
  rationale: “后裔”既可作集合称谓，又是现代读者容易理解的庄重表达；脚注提示原文字面义，避免把其语义范围过早限定为明确的复数个体。
translation_notes:
  register: 采用现代、自然而庄重的标准普通话。“全部土地”明确保留范围，“赐给”契合神圣应许语境；不对土地应许的最终实现作宗派性解释。
