  yaml_path: translation/ot/genesis/013/004.yaml
  text: to the place of the altar that he had made there at first[b][a]. And there Abram called on the name of Yahweh.
translation:
  language: zh_hans
  text: 到了他先前在那里筑坛的地方。亚伯兰就在那里求告雅威[a]的名[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文是“YHWH”（יהוה）；这里音译为“雅威”。传统中文常译作“耶和华”，也有译作“上主”的。
    reason: 说明神名的原文形式及主要中文译法。
  - marker: b
    text: 也可译作“宣告雅威的名”或“呼求雅威”。这个希伯来语惯用语既可含有呼求之意，也可含有宣告之意。
    reason: 保留קרא בשם יהוה在呼求与宣告之间的语义广度。
lexical_decisions:
- source_word: מְקוֹם הַמִּזְבֵּחַ
  choice: 筑坛的地方
  rationale: מְקוֹם是“地方”，הַמִּזְבֵּחַ是特指前文的“坛”。结合关系从句译为“筑坛的地方”，符合现代汉语表达，同时保留地点与祭坛的关联。
- source_word: אֲשֶׁר עָשָׂה שָׁם בָּרִאשֹׁנָה
  choice: 他起初在那里筑坛
  rationale: עָשָׂה字面为“做、造”，用于祭坛时汉语自然说“筑坛”；בָּרִאשֹׁנָה在此回指亚伯兰先前到过此地，译作“起初”。保留שָׁם“在那里”。
- source_word: וַיִּקְרָא שָׁם
  choice: 亚伯兰就在那里求告
  rationale: 明确译出主语亚伯兰，并保留第二个שָׁם，以呈现原文的地点重复和叙事强调；וַיִּקְרָא在本惯用语中译为“求告”。
- source_word: קרא בשם יהוה
  choice: 求告雅威的名
  rationale: 这是希伯来语惯用表达，可涉及呼求、敬拜或宣告。“求告……的名”是自然且庄重的汉语，也不把含义限定为单纯念出名字；脚注保留其他可能。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译呈现四字神名YHWH，避免在正文中以称号替代专名；脚注说明传统译法。
- source_word: אַבְרָם
  choice: 亚伯兰
  rationale: 采用现代中文圣经读者熟悉的人名译法。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名YHWH。正文采用较接近“Yahweh”的音译“雅威”，保留其专名性质；脚注列出中文传统译名及以称号替代的译法。
- issue: קרא בשם יהוה这一敬拜用语的含义
  choice: 求告雅威的名
  alternative: 宣告雅威的名；按名呼求雅威
  rationale: 该惯用语可能兼有向神呼求、敬拜和宣告其名的意味。正文采用包容性较强的“求告……的名”，脚注明示其他可能，避免消除原文的语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“筑坛”符合汉语宗教与历史叙事习惯；保留两次“在那里”，重现原文的重复和地点强调。
