  text: וְ/אַנְשֵׁ֣י סְדֹ֔ם רָעִ֖ים וְ/חַטָּאִ֑ים לַ/יהוָ֖ה מְאֹֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/013.yaml
  text: The men of Sodom were exceedingly wicked and sinful against Yahweh[a].
translation:
  language: zh_hans
  text: 所多玛人罪恶极大，得罪耶和华[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“所多玛人在耶和华面前罪恶极大。”
    reason: 原文介词ל既可表示犯罪所冒犯的对象，也可能表示在耶和华面前、在他眼中。
lexical_decisions:
- source_word: וְ/אַנְשֵׁי סְדֹם
  choice: 所多玛人
  rationale: אַנְשֵׁי是אִישׁ的复数构造形式，指所多玛的居民，语境中特别着眼于其中的男子；现代汉语用“所多玛人”最自然，也不把句首连接词וְ机械译成不必要的“而且”。
- source_word: רָעִים
  choice: 邪恶
  rationale: 此处表示道德上的恶，不是一般意义上的不好或不幸；“邪恶”准确保留其伦理分量。
- source_word: וְ/חַטָּאִים
  choice: 得罪
  rationale: 该词描写这些人以犯罪为特征。与后面的לַיהוָה合译为“得罪耶和华”，符合现代汉语表达，并保留罪所具有的关系性和冒犯性。
- source_word: לַ/יהוָה
  choice: 得罪耶和华
  rationale: 介词ל与“犯罪”词根连用时，可表示犯罪所冒犯的对象；主文据此译作“得罪耶和华”。יהוה按其专名译为“耶和华”。
- source_word: מְאֹד
  choice: 极其……深深……
  rationale: מְאֹד位于句末，加强整个负面描述。汉语以“极其邪恶，深深得罪”自然传达强烈程度；虽然为保持汉语节奏而分别表达，仍只承载原文一次总体加强的语气。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。中文采用广为人知且庄重的专名“耶和华”，不以“主”替代神名。
- issue: לַיהוָה与חַטָּאִים连用时的含义
  choice: 得罪耶和华
  alternative: 在耶和华面前犯罪
  rationale: ל可标示罪所冒犯的对象，也可能表达罪是在耶和华面前、在他眼中。主文采用关系性较强且自然的“得罪耶和华”，并以脚注保留另一种真实可行的理解。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“极其邪恶，深深得罪”保留原文强烈的道德谴责；不增添时间性话语标记。
