base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/004.yaml
  text: But the serpent said to the woman[b][a], “You will not surely die.”
translation:
  language: zh_hans
  text: 蛇却对女人说：“你们[a]一定不会死[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文“你们”是复数。
    reason: 说明希伯来语动词的人称和数；现代汉语可明确呈现这一点。
  - marker: b
    text: 原文采用“不定词绝对式＋限定动词”的强调结构，直译近于“你们绝不会死”，表示断然否认。
    reason: 说明原文的强调语法及其否定力度，避免将其误解为“未必会死”。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 却……说
  rationale: וַ־推动叙事；结合上下文，此话直接反驳上帝先前的警告，因此用“却”自然表达转折和对立，但不额外增添解释。
- source_word: הַנָּחָשׁ
  choice: 蛇
  rationale: נָחָשׁ指蛇；“蛇”是现代汉语中自然、准确且符合本段叙事用语的译法。
- source_word: אֶל הָאִשָּׁה
  choice: 对女人
  rationale: אֶל标明说话对象；אִשָּׁה在这里保留为“女人”，与创世记2—3章在夏娃得名以前的叙事称呼一致，不收窄为“妻子”。
- source_word: לֹא מוֹת תְּמֻתוּן
  choice: 你们一定不会死
  rationale: לֹא否定由不定词绝对式מוֹת与限定动词תְּמֻתוּן构成的强调结构。汉语将“一定”置于“不会”之前，清楚表达蛇的断然否认，避免“不一定会死”所可能产生的弱化歧义。复数形式译为“你们”。
theological_decisions:
- issue: 蛇否认警告的力度
  choice: “你们一定不会死”
  alternative: “你们不会死”或“你们不一定会死”
  rationale: 原文采用强调结构，并与创世记2:17的警告形成直接对立。“一定不会死”保留其断然否认的力度，同时不替读者解释死亡是即时的、肉体的还是最终的。
- issue: 第二人称复数的指向
  choice: 保留为“你们”
  alternative: 按直接受话者译为“你”
  rationale: תְּמֻתוּן是第二人称阳性复数。即使蛇直接对女人说话，译文仍保留原文的复数，不预先限定该话只涉及女人一人。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“蛇却对女人说”保持叙事节奏；“一定不会死”既符合现代汉语语序，也准确传达原文强调性的否定。
