source:
  edition: WLC
  text: וְ/הַ/נָּחָשׁ֙ הָיָ֣ה עָר֔וּם מִ/כֹּל֙ חַיַּ֣ת הַ/שָּׂדֶ֔ה אֲשֶׁ֥ר עָשָׂ֖ה יְהוָ֣ה אֱלֹהִ֑ים וַ/יֹּ֨אמֶר֙ אֶל הָ֣/אִשָּׁ֔ה אַ֚ף כִּֽי אָמַ֣ר אֱלֹהִ֔ים לֹ֣א תֹֽאכְל֔וּ מִ/כֹּ֖ל עֵ֥ץ הַ/גָּֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/001.yaml
  text: The serpent was more crafty than any beast of the field that Yahweh God had made[a]. And he said to the woman, “Indeed, has God said[c][b], ‘You shall not eat from any tree of the garden’?”
translation:
  language: zh_hans
  text: 蛇比耶和华上帝所造的田野中的任何走兽都更狡猾[a]。它对女人说：“上帝[b]真的说过：‘你们不可吃园中任何一棵树上的果子[c]’吗？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “狡猾”也可译作“精明”“机敏”或“诡诈”。这个希伯来词在某些语境中可有正面含义，但在这里因下文的诱导性问话而带有负面色彩。
    reason: lexical_alternative
  - marker: b
    text: 叙述者称“耶和华上帝”，蛇却只称“上帝”；译文保留了希伯来原文中这一称谓变化。
    reason: alternative_reading
  - marker: c
    text: “园中任何一棵树上的果子”也可较直译为“园中每一棵树上的果子”。在这个否定问句中，“任何树”更自然地传达蛇对上帝命令的夸大。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַנָּחָשׁ
  choice: 蛇
  rationale: 定冠词所指明确；中文叙事起首无需机械译出连接词 וְ，也不添加原文没有的时间副词。
- source_word: עָרוּם
  choice: 更狡猾
  rationale: 该词可指精明、机敏或狡猾；此处紧接诱导性的问话，负面语境使“狡猾”最贴切，同时“更”体现比较结构。
- source_word: מִכֹּל חַיַּת הַשָּׂדֶה
  choice: 比……任何田野走兽都
  rationale: 保留 מִן 构成的比较关系，并以“任何……都”自然表达 כֹּל 的全称范围；“田野走兽”对应 חַיַּת הַשָּׂדֶה。
- source_word: יְהוָה אֱלֹהִים
  choice: 耶和华上帝
  rationale: 以中文通行的专名“耶和华”呈现四字神名，并保留与 אֱלֹהִים 的复合称谓。
- source_word: וַיֹּאמֶר אֶל־הָאִשָּׁה
  choice: 它对女人说
  rationale: 主语承接“蛇”；现代汉语通常以“它”指动物。“女人”保留原文称谓，不提前使用“夏娃”。
- source_word: אַף כִּי אָמַר
  choice: 真的说过
  rationale: 在此疑问语境中，אַף כִּי 带有质疑、试探的语气；“真的……吗”既自然又保留其暗示性。
- source_word: אֱלֹהִים
  choice: 上帝
  rationale: 蛇的话只用“上帝”，没有叙述者所用的“耶和华上帝”；译文保留这一称谓变化。
- source_word: לֹא תֹאכְלוּ
  choice: 你们都不可吃
  rationale: 动词为复数第二人称，故明确译作“你们”；“不可”保留禁令语气。
- source_word: מִכֹּל עֵץ הַגָּן
  choice: 园中任何树上的果子
  rationale: 在否定疑问中译为“任何树”最自然，并体现蛇对命令范围的夸大；中文补出“果子”是由“从树上吃”自然推知的宾语，使表达通顺。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: “耶和华”是现代中文圣经传统中最广为识别的专名形式；正文不以“主”替代，以保留叙述者所用专名与蛇只说“上帝”之间的差异。
- issue: עָרוּם 的道德色彩
  choice: 狡猾
  alternative: 精明／机敏
  rationale: 该词本身可依语境呈正面或负面含义；本节随即出现扭曲禁令的诱导性问话，因此采用负面但不过度扩展的“狡猾”。
- issue: 蛇的身份
  choice: 仅译作“蛇”
  alternative: 添加“撒但”或“魔鬼”
  rationale: 本节希伯来文本只称其为蛇；不把后续经文或特定神学认定直接加入正文。
- issue: מִכֹּל 在否定问句中的范围
  choice: 任何树
  alternative: 每一棵树／所有树
  rationale: 希伯来语在否定结构下可按“任何”理解，也可较形式地呈现“所有／每一”；正文采用自然体现蛇夸大语气的“任何”，脚注保留另一种形式对应。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。避免文言式“岂是”，用“真的……吗”传达质疑语气；保留“耶和华上帝”与“上帝”的称谓差异。所有脚注标记均置于正文相关位置。
