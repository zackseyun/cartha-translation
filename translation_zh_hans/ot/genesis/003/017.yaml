  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וּ/לְ/אָדָ֣ם אָמַ֗ר כִּֽי שָׁמַעְתָּ֮ לְ/ק֣וֹל אִשְׁתֶּ/ךָ֒ וַ/תֹּ֨אכַל֙ מִן הָ/עֵ֔ץ אֲשֶׁ֤ר צִוִּיתִ֨י/ךָ֙ לֵ/אמֹ֔ר לֹ֥א תֹאכַ֖ל מִמֶּ֑/נּוּ אֲרוּרָ֤ה הָֽ/אֲדָמָה֙ בַּֽ/עֲבוּרֶ֔/ךָ בְּ/עִצָּבוֹן֙ תֹּֽאכֲלֶ֔/נָּה כֹּ֖ל יְמֵ֥י חַיֶּֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/017.yaml
  text: And to Adam he said[a], “Because you listened to the voice of your wife and ate from the tree about which I commanded you, saying, ‘You shall not eat from it,’ the ground is cursed because of you[f][e][d][c][b]; in painful toil you shall eat from it all the days of your life.”
translation:
  language: zh_hans
  text: 他对亚当[a]说：“因为你听了你妻子的话，吃了我曾吩咐你说‘不可吃’的那棵树上的果子，土地就因你受了咒诅[b]；你必终身在劳苦[c]中从土地得食。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “亚当”也可译作“那人”。
    reason: alternative_reading
  - marker: b
    text: 也可译作：“因你的缘故，土地受了咒诅。”
    reason: lexical_alternative
  - marker: c
    text: “劳苦”所译的希伯来语也可指痛苦或忧苦；这里着重指为获得食物而经历的艰辛。
    reason: lexical_alternative
lexical_decisions:
- source_word: לְאָדָם
  choice: 对亚当
  rationale: 本节指叙事中的特定男子，采用人名“亚当”；同时以脚注保留“那人”这一可能译法。
- source_word: שָׁמַעְתָּ לְקוֹל אִשְׁתֶּךָ
  choice: 你听了你妻子的话
  rationale: “听……的话”是自然的现代汉语，也能表达留意并听从其言语；不直接译作“顺从”，以免将原文含义说得过满。
- source_word: וַתֹּאכַל מִן הָעֵץ
  choice: 吃了……那棵树上的果子
  rationale: 原文直说“从树上吃”，汉语按语境补出“果子”，避免误解为吃树本身。
- source_word: אֲשֶׁר צִוִּיתִיךָ לֵאמֹר לֹא תֹאכַל מִמֶּנּוּ
  choice: 我曾吩咐你说‘不可吃’的那棵树
  rationale: 保留关系从句和“说”所引出的禁令，同时调整语序，使现代汉语自然清楚。
- source_word: אֲרוּרָה הָאֲדָמָה בַּעֲבוּרֶךָ
  choice: 土地就因你受了咒诅
  rationale: “土地”适合耕作取食的语境；“因你”明确表达亚当是这一判语的缘由，而非土地为他的益处受咒诅。
- source_word: בְּעִצָּבוֹן
  choice: 劳苦
  rationale: 该词可涵盖痛苦、忧苦和艰辛；在从土地获取食物的语境中，“劳苦”最自然，同时用脚注保留其痛苦色彩。
- source_word: תֹּאכֲלֶנָּה
  choice: 才能从土地得食
  rationale: 阴性后缀回指“土地”；原意不是吃土，而是靠土地出产得食，因此采用符合汉语习惯的表达。
- source_word: כֹּל יְמֵי חַיֶּיךָ
  choice: 终身
  rationale: 简洁自然地表达“你一生所有的日子”，并保留判语持续一生的严肃意味。
theological_decisions:
- issue: אָדָם在本节是人名还是普通名词
  choice: 亚当
  alternative: 那人
  rationale: 这里是对伊甸叙事中的特定男子说话，译作人名较自然；但希伯来语形式本身也可理解为“那人”，故以脚注保留。
- issue: 土地受咒诅与亚当的关系
  choice: 土地因你受了咒诅
  alternative: 因你的缘故，土地受了咒诅
  rationale: 原文בַּעֲבוּרֶךָ表达“由于你／因你的缘故”；此译法保留因果关系，不将其解释成以亚当的福祉为目的。
- issue: בְּעִצָּבוֹן与前节生产之苦的关联
  choice: 劳苦
  alternative: 痛苦／忧苦
  rationale: 同一词根在相邻经文中形成语义呼应；本节农业语境突出艰辛劳动，但脚注保留“痛苦”的语义范围，避免抹去呼应。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“听了你妻子的话”既贴近原文“听……的声音／话”，又避免生硬直译；“才能从土地得食”把农业语境中的实际含义说清楚。
