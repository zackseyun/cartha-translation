  text: וְ/ק֥וֹץ וְ/דַרְדַּ֖ר תַּצְמִ֣יחַֽ לָ֑/ךְ וְ/אָכַלְתָּ֖ אֶת עֵ֥שֶׂב הַ/שָּׂדֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/018.yaml
  text: It will produce thorns and thistles for you[c][b][a], and you will eat the plants of the field.
translation:
  language: zh_hans
  text: 地必给你长出荆棘和蒺藜来[a]；你将吃田野的植物[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“地必使荆棘和蒺藜为你生长出来。”原文动词是使役形式，主语承接上一节的“地”。
    reason: lexical_alternative
  - marker: b
    text: “田野的植物”也可译作“田野的草木”或较传统的“田间的菜蔬”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקֹוץ
  choice: 荆棘
  rationale: קוֹץ指带刺的植物；“荆棘”是现代汉语中自然、庄重的集合性表达，并与下文的另一种刺草形成搭配。
- source_word: וְדַרְדַּר
  choice: 蒺藜
  rationale: דַּרְדַּר指一种带刺的杂草。“蒺藜”沿用汉语圣经传统的对应词，同时避免把它与קוֹץ完全合并；原词未必指可精确鉴定的现代植物种类。
- source_word: תַּצְמִיחַ לָךְ
  choice: 必给你长出
  rationale: 动词为צמח的使役形，阴性单数主语承接上一节的“地”。“给你长出”既保留לָךְ“给你”的关系，也以自然汉语表达土地使这些植物生长出来的意思；“必”传达语境中的确定后果。
- source_word: וְאָכַלְתָּ
  choice: 你也要吃
  rationale: 该形式承接上一节所宣告的后果；“要吃”在现代汉语中自然表达此处的将来结果，“也”对应连接词并衔接前句。
- source_word: עֵשֶׂב הַשָּׂדֶה
  choice: 田野的植物
  rationale: עֵשֶׂב泛指草本植物或植被，并非仅指现代分类中的“草”或调味用的“香草”。“田野的植物”清楚、通俗，并保留原文的属格结构。
theological_decisions:
- issue: 阴性单数动词תַּצְמִיחַ的主语
  choice: 在正文中明确译作“地”，承接上一节的הָאֲדָמָה（地土）
  alternative: 采用无明确先行词的“它”，或省略主语
  rationale: 希伯来语动词的阴性单数形式自然回指上一节的“地”。汉语若只说“它”会显得指代不清，因此补出“地”并未增加新的解释，而是明确原文的语法衔接。
- issue: 荆棘与蒺藜是否指可精确鉴定的植物种类
  choice: 保留两个不同的传统通称，不断定具体植物学物种
  alternative: 统一译作“各种带刺的杂草”，或按某一现代物种名称精确翻译
  rationale: 两个希伯来词构成并列、彼此有别，但其精确植物学所指并不确定；当前译法既保留区别，也不作超出证据的认定。
translation_notes:
  register: 采用现代、通顺而庄重的叙事语言。“地必给你长出”比生硬的“地必使……生长”更符合现代汉语，同时保留使役含义和לָךְ“给你”。“植物”使用日常广义，不把עֵשֶׂב缩窄为某一种草本或蔬菜。
