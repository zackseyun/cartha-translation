  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וּ/מִ/פְּרִ֣י הָ/עֵץ֮ אֲשֶׁ֣ר בְּ/תוֹךְ הַ/גָּן֒ אָמַ֣ר אֱלֹהִ֗ים לֹ֤א תֹֽאכְלוּ֙ מִמֶּ֔/נּוּ וְ/לֹ֥א תִגְּע֖וּ בּ֑/וֹ פֶּן תְּמֻתֽוּ/ן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/003.yaml
  text: But from the fruit of the tree that is in the middle of the garden[a], God said, ‘You shall not eat from it, and you shall not touch it, lest you die.’
translation:
  language: zh_hans
  text: 不过，园子中间那棵树的果子[a]，上帝说：‘你们不可吃，也不可碰那棵树，免得你们死。’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “中间”也可译作“中央”。
    reason: 词语בְּתוֹךְ可指中间、当中或内部；“中央”是较具体的空间表达。
lexical_decisions:
- source_word: וּ/מִ/פְּרִי
  choice: 但……的果子
  rationale: 连词在上下文中承接第2节并形成对比，因此译为“但”；מִן所表达的取食来源按现代汉语习惯融入“那棵树的果子”这一结构。
- source_word: הָעֵץ
  choice: 那棵树
  rationale: 定冠词表明所指明确；汉语用量词“棵”自然地表达这棵特定的树。
- source_word: אֲשֶׁר בְּ/תוֹךְ הַ/גָּן
  choice: 园子中央
  rationale: בְּתוֹךְ表示在内部或中间；“园子中央”简洁、自然，并保留空间位置的强调。
- source_word: אָמַר אֱלֹהִים
  choice: 上帝说
  rationale: 完成式在这里回述上帝先前的话；汉语用“说”即可自然表达，不额外加入时态词。
- source_word: לֹא תֹאכְלוּ מִמֶּנּוּ
  choice: 你们不可吃
  rationale: 否定未完成式在所引述的命令中表达禁令，“不可”兼具庄重和清晰；所吃的是前置的“那棵树的果子”，汉语无需重复宾语。
- source_word: וְלֹא תִגְּעוּ בּוֹ
  choice: 也不可碰那棵树
  rationale: נגע的基本义是“碰、触碰”。明确补出代词所指的“那棵树”，避免汉语把省略的宾语误解为仅指果子。
- source_word: פֶּן תְּמֻתוּן
  choice: 免得你们死
  rationale: פֶּן引出要避免或担心的后果；“免得”保留这种模态关系，不把它强化为直陈式的“否则你们必死”。
theological_decisions:
- issue: 夏娃转述的话比创世记2:17多出“也不可碰”这一禁令。
  choice: 按本节希伯来文本完整译出“也不可碰那棵树”。
  alternative: 为与创世记2:17一致而省略或弱化这句话。
  rationale: 这里是夏娃的实际转述；译文应保留叙事中的措辞差异及其神学张力，而不擅自与先前命令协调。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“上帝”“不可”“免得”适合经文语体，又不显陈旧；通过前置主题和必要的所指补足，使希伯来语结构在汉语中清楚自然。
