revisions:
- from: 女人见那棵树的果子好作食物，又赏心悦目[a]，而且那棵树能使人有智慧[b]，令人向往，就摘下它的果子来吃了。她又把果子给了和她在一起的丈夫，他也吃了。
  to: 那女人看见那棵树好作食物，又悦人眼目，并且是使人有智慧所羡慕的[a]，就取了它的果子来吃。她又把果子给了她丈夫；她丈夫和她在一起[b]，也吃了。
  rationale: 修订恢复原文三项评价均以“树”为中心的句法推进，明确“可羡慕”与“使人有智慧”的关联，并以“取了”避免将一般的“拿/取”限定为采摘。脚注a移至第三评价项，说明使动与得智的词义张力；脚注b附于“和她在一起”，准确说明其句法所指，且不引入对丈夫参与程度的推断。
