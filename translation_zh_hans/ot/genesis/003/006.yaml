  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/תֵּ֣רֶא הָֽ/אִשָּׁ֡ה כִּ֣י טוֹב֩ הָ/עֵ֨ץ לְ/מַאֲכָ֜ל וְ/כִ֧י תַֽאֲוָה ה֣וּא לָ/עֵינַ֗יִם וְ/נֶחְמָ֤ד הָ/עֵץ֙ לְ/הַשְׂכִּ֔יל וַ/תִּקַּ֥ח מִ/פִּרְי֖/וֹ וַ/תֹּאכַ֑ל וַ/תִּתֵּ֧ן גַּם לְ/אִישָׁ֛/הּ עִמָּ֖/הּ וַ/יֹּאכַֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/006.yaml
  text: So the woman saw that the tree was good for food[a], and that it was a delight to the eyes, and that the tree was desirable to make one wise. So she took from its fruit and ate, and she also gave some to her husband, who was with her[b], and he ate.
translation:
  language: zh_hans
  text: 那女人看见那棵树好作食物，又悦人眼目，并且是使人有智慧所羡慕的[a]，就取了它的果子来吃。她又把果子给了她丈夫；她丈夫和她在一起[b]，也吃了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“是可使人通达而令人向往的”或“是为得智慧所羡慕的”。希伯来语可表达这棵树使人明智，也可指借此获得智慧或洞见。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“给她丈夫，和她在一起的”；“和她在一起”说明丈夫当时与她同在，但本句本身未说明他此前见闻的细节。
    reason: syntactic_clarification
lexical_decisions:
- source_word: וַתֵּרֶא
  choice: 见
  rationale: 采用基本的视觉与认知动词，既符合叙事语气，也不额外加入“仔细察看”等含义。
- source_word: הָאִשָּׁה
  choice: 女人
  rationale: 忠实保留本段对她的叙事称呼，不提前改称“妻子”或直接使用“夏娃”。
- source_word: טוֹב ... לְמַאֲכָל
  choice: 果子好作食物
  rationale: 表达树所结的果子适合食用；中文补出“果子”，使语义自然，同时不改变所指。
- source_word: תַאֲוָה ... לָעֵינַיִם
  choice: 赏心悦目
  rationale: 传达希伯来语所强调的视觉吸引力，避免用“贪欲”等词预先加入负面的道德判断。
- source_word: וְנֶחְמָד הָעֵץ
  choice: 那棵树……令人向往
  rationale: נחמד表示可喜爱、可向往或令人渴望；“令人向往”保留其吸引力而不过度强化为“贪恋”。
- source_word: לְהַשְׂכִּיל
  choice: 能使人有智慧
  rationale: 保留Hiphil形式可能具有的使动含义；脚注同时说明也可理解为获得智慧或洞见。
- source_word: מִפִּרְיוֹ
  choice: 摘下它的果子
  rationale: מן表示从树的果实中取用；中文以“摘下”自然表达这一动作，未限定果子的具体数量。
- source_word: וַתִּתֵּן גַּם
  choice: 她又把果子给了
  rationale: “又”体现גם所表示的追加动作；根据上下文补出省略的宾语“果子”。
- source_word: לְאִישָׁהּ עִמָּהּ
  choice: 给了和她在一起的丈夫
  rationale: 明确保留עִמָּהּ“和她在一起”这一叙事细节，并使其在现代中文中修饰关系清楚。
theological_decisions:
- issue: 女人对树的评价是否应带有明确的罪恶色彩
  choice: 采用“好作食物、赏心悦目、令人向往”等相对中性的正面评价词
  alternative: 译作“诱人、引起贪欲、令人垂涎”等带有强烈负面色彩的措辞
  rationale: 原文先从女人的视角陈述树的吸引力，再叙述她的行动；译文不应把后文的道德判断预先加入这些评价词。
- issue: לְהַשְׂכִּיל的使动或得智含义
  choice: 正文译作“能使人有智慧”，脚注保留“使人通达／获得智慧”的可能性
  alternative: 只译作“可获得智慧”或“可使人通达”
  rationale: 该词形可表达使人明智、通达，也可在语境中指获得智慧；正文采用自然的使动表达，脚注保留词义张力。
- issue: 丈夫是否被描述为当时与女人在一起
  choice: 明确译出“和她在一起的丈夫”
  alternative: 简略译作“给她丈夫”
  rationale: עִמָּהּ明确表示“和她在一起”；保留这一点是忠实呈现叙事细节，而不是推断他此前所见所闻的一切。
translation_notes:
  register: 采用现代、庄重而易懂的叙事中文。“赏心悦目”自然传达视觉吸引力；“令人向往”保留欲求意味，却不擅自加重为邪欲。句式按希伯来语的三重评价推进，再转入连续行动。
