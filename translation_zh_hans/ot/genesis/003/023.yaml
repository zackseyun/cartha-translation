base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/023.yaml
  text: So Yahweh God sent him out from the garden of Eden to work the ground from which he had been taken[a].
translation:
  language: zh_hans
  text: 于是，雅威上帝把他送出伊甸园，让他耕作他从中被取出的土地[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“耕种土地。”希伯来语动词可指“工作”“服事”，在这里也可指“耕种”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְשַׁלְּחֵהוּ
  choice: 把他送出
  rationale: שׁלח 的皮埃勒式在这里表示送走、遣出；“送出”体现离开伊甸园的方向，又不提前采用下一节 גרשׁ 所带有的较强烈“赶出”意味。
- source_word: יְהוָה אֱלֹהִים
  choice: 雅威上帝
  rationale: 将四字神名 יְהוָה 音译为“雅威”，并保留与 אֱלֹהִים 构成的复合称谓。
- source_word: מִגַּן עֵדֶן
  choice: 出伊甸园
  rationale: 介词 מִן 表示从某处离开；与“送出”搭配，现代汉语自然简洁。
- source_word: לַעֲבֹד אֶת הָאֲדָמָה
  choice: 耕作……土地
  rationale: עבד 可表示工作、服事，在土地作宾语的语境中指劳作或耕种；“耕作土地”既自然，也保留人与土地之间的叙事联系。
- source_word: אֲשֶׁר לֻקַּח מִשָּׁם
  choice: 他从中被取出的
  rationale: 保留原文被动语态及关系从句，指明人先前是从这土地被取出的，与创世记2章的叙述相呼应。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；采用“雅威”以音译其专名，不以称号代替。
- issue: 人在园外所承担的工作与原初使命的关系
  choice: 耕作土地
  alternative: 服事土地；在土地上劳作
  rationale: 译文保留 עבד 与先前园中使命的词汇联系，但不额外说明这项工作在咒诅或救赎中的神学性质。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“那片……土地”使关系从句的所指清楚；保留“被取出”的被动表达，以维持原文与前文造人叙事的联系。
