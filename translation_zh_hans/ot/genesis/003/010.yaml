- from: 他说：“我在园中听见了你的声音[a]，就害怕了，因为我赤身裸体，所以躲了起来。”
  to: 他说：“我在园中听见你的声音[a]，就因自己赤身裸体而害怕，于是躲了起来。”
  rationale: 修订仅改善现代汉语的因果表达，并精简脚注。正文仍保留“声音”这一自然译法，脚注仍保留较宽泛的“声响”，不将原文的词义范围限定为明确说出的话语。
