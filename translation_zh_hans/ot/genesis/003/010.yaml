  text: וַ/יֹּ֕אמֶר אֶת קֹלְ/ךָ֥ שָׁמַ֖עְתִּי בַּ/גָּ֑ן וָ/אִירָ֛א כִּֽי עֵירֹ֥ם אָנֹ֖כִי וָ/אֵחָבֵֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/010.yaml
  text: And he said[a], “I heard your voice in the garden, and I was afraid because I was naked, so I hid myself.”
translation:
  language: zh_hans
  text: 他说：“我在园中听见你的声音[a]，就因自己赤身裸体而害怕，于是躲了起来。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你的声响”。希伯来语此词可指“声音”或“声响”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 他说
  rationale: 以现代汉语自然的叙事表达承接上下文；希伯来语叙事连接形式无需机械译出“于是”或“并且”。
- source_word: אֶת קֹלְךָ
  choice: 你的声音
  rationale: קוֹל既可指嗓音，也可泛指可听见的声音或声响。“你的声音”在本语境中自然，同时以脚注保留“你的声响”这一较宽泛的理解。
- source_word: שָׁמַעְתִּי
  choice: 我……听见了
  rationale: 直接表达שמע的完成式，并符合汉语叙事习惯。
- source_word: בַּגָּן
  choice: 在园中
  rationale: 保留已由上下文明确的园子场景；“园中”简洁、庄重而自然。
- source_word: וָאִירָא
  choice: 就害怕了
  rationale: 准确表达惧怕的状态；“就”自然承接听见声音后的反应。
- source_word: כִּי
  choice: 因为
  rationale: 在这里引出害怕的原因，保留明确的因果关系。
- source_word: עֵירֹם אָנֹכִי
  choice: 我赤身裸体
  rationale: 希伯来语名词句本身不标时态；汉语无需补入过去时，因而保留其直接陈述的性质。“赤身裸体”准确且为现代读者易懂。
- source_word: וָאֵחָבֵא
  choice: 所以躲了起来
  rationale: 该动词含有主体把自己隐藏起来的意义；汉语“躲了起来”已自然表达反身含义，“所以”明确呈现语境中的结果关系。
theological_decisions:
- issue: קוֹל与上帝临在的关系
  choice: 你的声音
  alternative: 你的声响
  rationale: 原词可指“声音”或较宽泛的“声响”。正文采用自然且传统的“声音”，但不据此断定这里必指已经说出的言语；脚注保留较宽泛的译法，以免消除原文的词义张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“赤身裸体”比“没穿衣服”更庄重，也比过度古雅的表达更适合普通现代读者；句中的“就……因为……所以……”清楚呈现听见、害怕、说明原因及躲藏之间的关系。
