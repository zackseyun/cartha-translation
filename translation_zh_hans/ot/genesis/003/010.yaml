    issue: 因果连接词重复
    rationale: “就害怕了，因为我赤身裸体，所以躲了起来”在现代汉语中将“因为”和“所以”并置，且“就”也参与连接，读来略有堆叠。调整语序和连接词即可保留原意。
  - severity: low
    issue: 脚注含不必要的原词音译
    rationale: “科勒”（qol）不是通行的中文圣经术语；脚注的目的仅为呈现词义替代，不必加入音译。
  revised_text: 他说：“我在园中听见你的声音[a]，就因自己赤身裸体而害怕，于是躲了起来。”
