  text: וַ/יֹּ֕אמֶר מִ֚י הִגִּ֣יד לְ/ךָ֔ כִּ֥י עֵירֹ֖ם אָ֑תָּה הֲ/מִן הָ/עֵ֗ץ אֲשֶׁ֧ר צִוִּיתִ֛י/ךָ לְ/בִלְתִּ֥י אֲכָל מִמֶּ֖/נּוּ אָכָֽלְתָּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/011.yaml
  text: And he said[b][a], “Who told you that you were naked? Have you eaten from the tree from which I commanded you not to eat?”
translation:
  language: zh_hans
  text: 他说：“谁告诉你你是赤身的？你是不是吃了我吩咐你不可吃的那棵树上的果子？”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“你是不是从我吩咐你不可吃的那棵树上吃了？”希伯来文只说“从树上／从它吃”，并未明说“果子”。
    reason: 说明中文正文为自然表达而补出语境中隐含的宾语，同时保留原文较形式化的译法。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 他问
  rationale: 该动词本义为“说”；因后接两个直接问句，现代汉语用“问”更自然，也不改变言语行为的实质。主语依原文仅译为“他”，不在本节补出称谓。
- source_word: מִי הִגִּיד לְךָ
  choice: 谁告诉你
  rationale: 准确传达疑问代词及 נגד 的使役词干“告知”之义，符合现代汉语表达。
- source_word: כִּי עֵירֹם אָתָּה
  choice: 你是赤身的
  rationale: כִּי 引出所告知的内容；עֵירֹם 指未穿衣服。“赤身”庄重自然，并与上下文相呼应。希伯来语无系词时态标记，因此不用“曾是”限定时间。
- source_word: הֲמִן הָעֵץ ... אָכָלְתָּ
  choice: 莫非你吃了……那棵树上的果子
  rationale: 疑问词 הֲ 引出是非问句；“莫非”保留带有追问意味的疑问语气。中文通常说“吃树上的果子”，这是对希伯来语“从树上/从它吃”的自然表达，宾语“果子”由语境补明。
- source_word: אֲשֶׁר צִוִּיתִיךָ לְבִלְתִּי אֲכָל מִמֶּנּוּ
  choice: 我吩咐你不可吃的
  rationale: צוה 译作“吩咐”，לְבִלְתִּי 加不定式表达禁止，译为“不可吃”；关系从句在中文中置于“那棵树”之前。
theological_decisions:
- issue: 阳性单数说话者是否明确补作“耶和华神”
  choice: 仅译作“他”
  alternative: 耶和华神问
  rationale: 本节希伯来文只有第三人称阳性单数动词，未重述主语名称；虽然上文明确其所指，正文仍保留本节的表达方式，不增添称谓。
- issue: 第二问是否直接断定人已经吃过
  choice: 保留为问句“莫非你吃了……？”
  alternative: 译成带有明确控告意味的陈述
  rationale: 原文使用疑问词 הֲ，形式上是是非问句。译文不把神学上的全知预设转化为原文没有明说的陈述。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“赤身”比“裸体”更适合圣经叙事语域；“吩咐……不可吃”简洁保留命令和禁止的力度。脚注标记置于相关问句之后。
