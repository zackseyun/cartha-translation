  text: וַ/יֹּ֣אמֶר יְהוָ֣ה אֱלֹהִ֗ים הֵ֤ן הָֽ/אָדָם֙ הָיָה֙ כְּ/אַחַ֣ד מִמֶּ֔/נּוּ לָ/דַ֖עַת ט֣וֹב וָ/רָ֑ע וְ/עַתָּ֣ה פֶּן יִשְׁלַ֣ח יָד֗/וֹ וְ/לָקַח֙ גַּ֚ם מֵ/עֵ֣ץ הַֽ/חַיִּ֔ים וְ/אָכַ֖ל וָ/חַ֥י לְ/עֹלָֽם׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/022.yaml
  text: Then Yahweh God said[a], “Behold, the man has become like one of us, knowing good and evil. And now, lest he reach out his hand and also take from the tree of life and eat, and live forever—”
translation:
  language: zh_hans
  text: 雅威上帝说：“看哪，这人已经变得像我们中的一个[a]，知道善恶了。现在，免得他伸手，也从生命树上取来吃，便永远活着——”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“像我们中的一个”。“我们”是复数；有人理解为天上议会的说法、商议用的复数，或上帝内部复数性的初步显露。原文没有明确说明取哪一种理解。
    reason: 保留原文复数所产生的真实歧义和神学张力，不在正文中代为解决。
lexical_decisions:
- source_word: יְהוָה אֱלֹהִים
  choice: 雅威上帝
  rationale: 将四字神名 יְהוָה 按其通行学术读音音译为“雅威”，保留其作为上帝专名的性质；אֱלֹהִים 译为现代普通话中庄重而通行的“上帝”。
- source_word: הֵן
  choice: 看哪
  rationale: 保留希伯来语提示听者注意的感叹语气，也符合庄重叙事中的直接引语。
- source_word: הָאָדָם
  choice: 这人
  rationale: 此处指上下文中的那个具体的人，而非抽象的全人类；“这人”在引语中自然地体现其特指性。
- source_word: הָיָה כְּאַחַד מִמֶּנּוּ
  choice: 已经变得像我们中的一个
  rationale: “已经变得”表达犯罪之后形成的结果状态；“我们中的一个”如实保留第一人称复数，不作神学解释。
- source_word: לָדַעַת טוֹב וָרָע
  choice: 知道善恶
  rationale: 直接保留“知道”以及“善恶”这一成对表达，不将其缩窄为单纯的道德判断能力或经验知识。
- source_word: פֶּן
  choice: 免得
  rationale: 准确表达预防、避免某种结果的从句关系，并能让中文句末自然保留原文未说完的悬置感。
- source_word: יִשְׁלַח יָדוֹ
  choice: 他伸手
  rationale: 保留原文具体的身体动作意象，中文简洁自然。
- source_word: וְלָקַח גַּם מֵעֵץ הַחַיִּים וְאָכַל
  choice: 也从生命树上摘来吃
  rationale: 保留 גַּם 的添加义“也”；“从……树上摘来吃”以自然中文表达从树取物并吃，未在名词层面补入原文没有明说的“果子”。
- source_word: וָחַי לְעֹלָם
  choice: 便永远活着
  rationale: “便”表达前述取食所导致的结果，“永远活着”直接对应持续至永久的生命。
theological_decisions:
- issue: “我们中的一个”里的复数
  choice: 在正文保留“我们”，不加解释性扩写。
  alternative: 将复数解释为天上议会、商议复数、尊贵复数，或上帝内部的复数性。
  rationale: 希伯来文明确使用第一人称复数。正文应保留其真实张力，而不替读者确定某一种神学解释。
- issue: 上帝话语的突然中止
  choice: 以破折号结束本节引语。
  alternative: 补出主句或用完整句号把意思说完。
  rationale: 原文以 פֶּן 引出的预防从句悬置，没有明说相应的处置主句；破折号保留这种突然中止，并避免增添原文没有的话。
translation_notes:
  register: 采用现代、庄重而可懂的普通话。“看哪”保留古代叙事的郑重提示语气；其余句法尽量现代自然。句末破折号刻意呈现希伯来文未完成的防止从句。
