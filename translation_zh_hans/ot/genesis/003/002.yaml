base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/002.yaml
  text: And the woman said to the serpent[a], “We may eat from the fruit of the trees of the garden,”
translation:
  language: zh_hans
  text: 女人对蛇说：“园中树上的果子，我们可以吃[a]；”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译：“园中树的果子，我们可以吃。”这里“树”为单数形式，但可按集合意义理解为园中的树木。
    reason: 说明原文单数形式，以及正文按语境采用集合意义的依据。
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: 说
  rationale: 该叙事形式推进情节；现代汉语直接用“说”即可自然承接上文，无须机械译出连接词。
- source_word: הָאִשָּׁה
  choice: 女人
  rationale: 此处指叙事中的女性，而非特别强调其妻子身份；“女人”也与上下文一致。
- source_word: הַנָּחָשׁ
  choice: 蛇
  rationale: נָחָשׁ指蛇；“蛇”是现代汉语中自然、准确且不额外引入解释的对应词。
- source_word: מִפְּרִי
  choice: ……上的果子
  rationale: מִן在此表示取食的来源。汉语用“树上的果子”比直译为“从……的果子”更自然，同时保留来源关系。
- source_word: עֵץ הַגָּן
  choice: 园中各样树
  rationale: עֵץ虽为单数形式，但此处在语境中具有集合或分配意义；译作“各样树”表达普遍许可，并与下一节所述例外自然衔接。
- source_word: נֹאכֵל
  choice: 我们都可以吃
  rationale: 第一人称复数未完成式在此语境中表达获准取食；“可以吃”准确传达许可，“都”对应许可范围的概括性。
theological_decisions:
- issue: 女人所说许可范围中的“树”是单数还是集合意义
  choice: 按集合意义译为“园中各样树上的果子”
  alternative: 直译为“园中那棵树的果子”或“园中树的果子”
  rationale: 希伯来文עֵץ在形态上是单数，但结合创世记2:16的普遍许可及3:3即将提出的例外，此处最自然地表示园中树木这一类。脚注保留原文形式，避免掩盖其语法特征。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“女人对蛇说”简洁承接叙事；保留直接引语。句末用分号，是因本节话语在下一节继续。
