  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/תִּפָּקַ֨חְנָה֙ עֵינֵ֣י שְׁנֵי/הֶ֔ם וַ/יֵּ֣דְע֔וּ כִּ֥י עֵֽירֻמִּ֖ם הֵ֑ם וַֽ/יִּתְפְּרוּ֙ עֲלֵ֣ה תְאֵנָ֔ה וַ/יַּעֲשׂ֥וּ לָ/הֶ֖ם חֲגֹרֹֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/007.yaml
  text: Then the eyes of both of them were opened[a], and they knew that they were naked[b]. So they sewed fig leaves together and made coverings for themselves.
translation:
  language: zh_hans
  text: 于是，两个人的眼睛都开了；他们知道自己赤身裸体，就把无花果树的叶子缝在一起，为自己做了围腰[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“腰布”或“围裙”；原文指束在腰间的物件，具体形制不详。
    reason: 词义可能有不同理解
lexical_decisions:
- source_word: וַתִּפָּקַחְנָה עֵינֵי שְׁנֵיהֶם
  choice: 两个人的眼睛都开了
  rationale: 保留希伯来语“眼睛开了”的叙事意象和对二人的强调，不增添“良知觉醒”等解释。汉语不宜机械译成被动式。
- source_word: וַיֵּדְעוּ כִּי
  choice: 他们知道
  rationale: 按 ידע 的基本义译为“知道”，而不译作带有较强解释色彩的“意识到”或“察觉”。
- source_word: עֵירֻמִּם
  choice: 赤身裸体
  rationale: 准确表达“裸着”的状态，并与创世记2:25的叙事联系相呼应。
- source_word: וַיִּתְפְּרוּ עֲלֵה תְאֵנָה
  choice: 把无花果树的叶子缝在一起
  rationale: “缝在一起”自然表达他们用多片叶子制作物件的动作；“无花果树的叶子”清楚而符合现代汉语。
- source_word: וַיַּעֲשׂוּ לָהֶם חֲגֹרֹת
  choice: 为自己做了围腰
  rationale: חֲגֹרֹת 指束在腰间之物；“围腰”既点明佩戴位置，又不过度限定具体样式。脚注保留“腰布、围裙”等可能译法。
theological_decisions:
- issue: 眼睛开启与羞耻或道德意识之间的关系
  choice: 只叙述他们眼睛开了、知道自己赤身裸体并制作围腰
  alternative: 增译“他们感到羞耻”或“良知觉醒”
  rationale: 经文本节虽暗示自我认知发生变化，却没有直接使用“羞耻”或“良知”等词；译文不替叙事张力作神学定论。
- issue: חֲגֹרֹת 所指物件的具体形制
  choice: 围腰
  alternative: 腰布、围裙、遮蔽物
  rationale: 原词表示束在腰间的物件，但形制并不明确。“围腰”在可读性与词义范围之间较为平衡，并用脚注保留其他可能。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“于是”承接前文；分号呈现看见与行动之间紧密的叙事推进。避免使用带有后设神学解释的词语。
