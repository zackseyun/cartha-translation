revisions:
- from: 于是，他把那人赶了出去，又在伊甸园东边安设基路伯和那自行转动的剑焰[a]，守住通往生命树的路。
  to: 于是，他把那人赶了出去，又在伊甸园东边安设基路伯和那不断转动的剑焰[a]，守住通往生命树的路。
  rationale: 仅将“自行转动”改为更自然、并能表达持续动作的“不断转动”，同时校正脚注，使其既保留传统的“火焰之剑”译法，也更准确说明原文“剑的火焰”及修饰关系的歧义。其余译文无需改动。
