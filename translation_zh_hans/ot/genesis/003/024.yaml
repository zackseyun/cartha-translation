base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/024.yaml
  text: So he drove out the man[a], and to the east of the garden of Eden he stationed the cherubim and the flame of the sword that turns every way[b], to guard the way to the tree of life.
translation:
  language: zh_hans
  text: 于是，他把那人赶了出去，又在伊甸园东边安设基路伯和那不断转动的剑焰[a]，守住通往生命树的路。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“那把四面转动的火焰之剑”。希伯来文较直译为“剑的火焰，那转动的”；“转动的”与“剑／火焰”的关联在句法上较为紧密，也有一定歧义。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְגָרֶשׁ
  choice: 赶了出去
  rationale: גרשׁ表示强行驱逐；“赶了出去”自然、准确，又不额外加入“流放”等解释色彩。
- source_word: הָאָדָם
  choice: 那人
  rationale: 这里承接上文，指受造并被安置在园中的那个具体的人，而不是抽象的全人类。
- source_word: וַיַּשְׁכֵּן
  choice: 安设
  rationale: שׁכן的使役式表示使其驻留或安置；“安设”既保留使役含义，也符合守卫的语境。
- source_word: מִקֶּדֶם לְגַן עֵדֶן
  choice: 在伊甸园东边
  rationale: 该空间短语指园的东面或东侧；“在伊甸园东边”是现代汉语中自然且不失准确的表达。
- source_word: הַכְּרֻבִים
  choice: 基路伯
  rationale: 采用中文圣经传统中对这种天上活物的专名音译；希伯来语形式为复数，汉语专名无需另加复数标记。
- source_word: לַהַט הַחֶרֶב הַמִּתְהַפֶּכֶת
  choice: 那自行转动的剑焰
  rationale: 尽量保留原文“剑的火焰”及分词所表达的持续、自行转动之意，同时用紧凑自然的汉语呈现。
- source_word: לִשְׁמֹר
  choice: 守住
  rationale: שׁמר在此有守卫并阻止通行的意味；“守住”比单纯“看守”更贴合限制进入的语境。
- source_word: דֶּרֶךְ עֵץ הַחַיִּים
  choice: 通往生命树的路
  rationale: 原文形式上是“生命树的路”，语境所指为到达生命树的道路；此译法使关系在汉语中清楚自然。
theological_decisions:
- issue: אָדָם在本节是个体还是泛指人类
  choice: 那人
  alternative: 人类／人
  rationale: 叙事在此指向先前被造并置于园中的特定个体；译作“那人”既保持单数指称，也不把本节抽象化为全人类。
- issue: 守卫对象的关系
  choice: 通往生命树的路
  alternative: 生命树的道路
  rationale: 此处表达的是阻止人接近生命树；“通往”明示原文属格结构在本语境中的方向关系，但不对守卫的具体机制作神学发挥。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“于是……又……”呈现连续动作；保留“基路伯”这一专名，并以脚注呈现剑与火焰之间在原文中较为紧密且略有歧义的结构。
