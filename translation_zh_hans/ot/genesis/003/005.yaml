revisions:
- from: 因为上帝知道，你们吃它的那一天，眼睛就会打开，你们便会像上帝[a]一样，知道善恶。
  to: 因为上帝知道，在你们吃它的果子那一天，你们的眼睛就会睁开；你们便会像上帝一样[a]，知道善恶。
  rationale: 修订仅澄清“从它吃”的取食关系，并调整一处更自然的现代汉语表达和脚注措辞。保留正文“像上帝一样”，同时以脚注呈现该处 אֱלֹהִים 的争议性替代读法，未将其神学所指作超出文本的断定。
