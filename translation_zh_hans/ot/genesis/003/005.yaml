  text: כִּ֚י יֹדֵ֣עַ אֱלֹהִ֔ים כִּ֗י בְּ/יוֹם֙ אֲכָלְ/כֶ֣ם מִמֶּ֔/נּוּ וְ/נִפְקְח֖וּ עֵֽינֵי/כֶ֑ם וִ/הְיִיתֶם֙ כֵּֽ/אלֹהִ֔ים יֹדְעֵ֖י ט֥וֹב וָ/רָֽע׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/005.yaml
  text: For God knows that on the day you eat from it[a], your eyes will be opened, and you will be like God, knowing good and evil.
translation:
  language: zh_hans
  text: 因为上帝知道，在你们吃它的果子那一天，你们的眼睛就会睁开；你们便会像上帝一样[a]，知道善恶。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“像众神一样”或“像神明一样”。希伯来语 אֱלֹהִים 在某些语境中可有这些含义。
    reason: 保留 כֵּאלֹהִים 所含真实存在的词义与所指歧义。
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接蛇上一句的话，引出其所声称的理由；“因为”自然体现解释关系。
- source_word: יֹדֵעַ אֱלֹהִים
  choice: 上帝知道
  rationale: 以现代汉语的一般现在表达希伯来语分词所表示的持续认知状态。
- source_word: כִּי
  choice: （不单独译出）
  rationale: 此处引出“知道”的内容，汉语可直接接宾语从句，无须机械译为“即”。
- source_word: בְּיוֹם
  choice: 在……的那一天
  rationale: 保留希伯来语的时间表达；这里指吃的时刻或时候，不必限定为完整的二十四小时。
- source_word: אֲכָלְכֶם מִמֶּנּוּ
  choice: 你们吃它
  rationale: 准确保留复数第二人称和“从它取食”的意思，同时采用自然简洁的现代汉语。
- source_word: וְנִפְקְחוּ עֵינֵיכֶם
  choice: 眼睛就会打开
  rationale: 保留尼法勒式的被动或自发意味及关于感知开启的隐喻；汉语“会打开”自然且未明确添加施事者。
- source_word: וִהְיִיתֶם
  choice: 你们便会……一样
  rationale: 表达动作之后形成的状态，并以“便会”体现上下文中的结果关系。
- source_word: כֵּאלֹהִים
  choice: 像上帝一样
  rationale: 上下文以 אֱלֹהִים 指独一的上帝，此处采用最可能的单数所指；同时在脚注中保留“众神”和“神圣者”等真实可能。
- source_word: יֹדְעֵי
  choice: 知道
  rationale: 用谓语性表达自然呈现分词，说明“像上帝一样”的具体方面。
- source_word: טוֹב וָרָע
  choice: 善恶
  rationale: “善恶”是现代汉语中凝练、庄重且语义分量相当的固定搭配，也保留其道德与辨识层面的张力。
theological_decisions:
- issue: כֵּאלֹהִים 中 אֱלֹהִים 的所指
  choice: 像上帝一样
  alternative: 像众神一样；像神圣者一样
  rationale: 紧邻语境中的 אֱלֹהִים 指上帝，而“知道善恶”也与叙事中的神圣知识相呼应，因此正文采用“上帝”；但该名词在形态和语义上确有其他可能，故以脚注保留，不把争议默然消除。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“吃它的那一天”较贴近原文时间表达；“眼睛就会打开”保留原文隐喻及未明说施事者的特点。脚注标记置于发生歧义的“上帝”之后。
