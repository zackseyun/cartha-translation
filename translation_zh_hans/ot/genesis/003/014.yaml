revisions:
- from: 耶和华上帝对蛇[a]说：“既然你做了这事，你必比一切牲畜和田野的一切走兽受更重的咒诅。你必用肚子行走[b]，一生都吃尘土。”
  to: 耶和华上帝对蛇[a]说：“既然你做了这事，你必比一切牲畜和田野的一切野兽更受咒诅。你必用肚子行走[b]，一生都吃尘土。”
  rationale: 修订仅调整比较性咒诅语句，使其更直接反映希伯来文的谓语及比较结构；以“野兽”明确田野动物为野生动物；并将脚注a收束为词汇说明。正文继续保留蛇作为直接受话者、神名组合、腹部行走和吃尘土的字面意象及其未决张力。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T04:21:04Z'
review_pass:
  verdict: revise
  source_fidelity: “你必比一切牲畜和田野的一切走兽受更重的咒诅”正确把握了比较结构，但“受更重的咒诅”将原文的谓语“受咒诅”较明显地名词化，并加入“重”来补足中文表达。改为“你比……更受咒诅”更贴近原文的宣判语气。חַיַּת הַשָּׂדֶה宜明确为“田野的一切野兽”，以保持与“牲畜”的类别区别。其余句子忠实保留了“腹部而行”及“吃尘土”的具体意象，未导入后来的身份解释。
  naturalness: 修订后的“你比一切牲畜和田野的一切野兽更受咒诅”庄重、清楚且符合现代标准汉语。 “你必用肚子行走”虽略带刻意的直译感，但在这一庄严叙事语境中自然可懂，并且避免把原文普通的“行走”预先译成“爬行”。
  terminology: “耶和华上帝”适当地保留神名与称谓的组合；“蛇”“牲畜”“田野的一切野兽”“尘土”均合乎原文及中文圣经叙事的正式语域。脚注a不应超出词汇备选而讨论该蛇的身份；脚注b恰当地保留“吃尘土”作为屈辱和失败意象的可能性，而不取消字面表述。
