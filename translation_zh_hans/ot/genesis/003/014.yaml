  - severity: low
    issue: “田野的一切走兽”可更准确译为“田野的一切野兽”。
    rationale: חַיַּת הַשָּׂדֶה指田野中的野生动物，并与前面的“牲畜”形成区分；“野兽”比“走兽”更明确表达此点。
