  text: וַ/יֹּאמֶר֩ יְהֹוָ֨ה אֱלֹהִ֥ים אֶֽל הַ/נָּחָשׁ֮ כִּ֣י עָשִׂ֣יתָ זֹּאת֒ אָר֤וּר אַתָּה֙ מִ/כָּל הַ/בְּהֵמָ֔ה וּ/מִ/כֹּ֖ל חַיַּ֣ת הַ/שָּׂדֶ֑ה עַל גְּחֹנְ/ךָ֣ תֵלֵ֔ךְ וְ/עָפָ֥ר תֹּאכַ֖ל כָּל יְמֵ֥י חַיֶּֽי/ךָ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/014.yaml
  text: Then Yahweh God said to the serpent[a], “Because you have done this, cursed are you above all livestock and above every beast of the field. On your belly you shall go[b], and dust you shall eat all the days of your life.”
translation:
  language: zh_hans
  text: 耶和华上帝对蛇[a]说：“既然你做了这事，你必比一切牲畜和田野的一切野兽更受咒诅。你必用肚子行走[b]，一生都吃尘土。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “蛇”也可译作“蛇类动物”。
    reason: lexical_alternative
  - marker: b
    text: “吃尘土”也可作为蒙受屈辱、遭到失败的形象说法，不一定只是在说明实际吃什么。
    reason: cultural_note
lexical_decisions:
- source_word: יְהֹוָה אֱלֹהִים
  choice: 耶和华上帝
  rationale: 保留神名与“上帝”的组合；“耶和华”是现代中文圣经语境中广为人知且庄重的音译。
- source_word: הַנָּחָשׁ
  choice: 蛇
  rationale: 直接对应原文所指的蛇类动物，不在正文中加入后来经文中的身份解释。
- source_word: כִּי עָשִׂיתָ זֹּאת
  choice: 既然你做了这事
  rationale: 清楚表达后续宣判的原因；“既然”也保留了面向既成事实作出判决的语气。
- source_word: אָרוּר אַתָּה מִכָּל הַבְּהֵמָה וּמִכֹּל חַיַּת הַשָּׂדֶה
  choice: 你必比一切牲畜和田野的一切走兽受更重的咒诅
  rationale: 将 מִן 理解为比较用法，并用自然中文明确蛇在动物中所受咒诅尤重；“牲畜”与“田野的走兽”保留家畜和野兽的区别。
- source_word: עַל גְּחֹנְךָ תֵלֵךְ
  choice: 你必用肚子行走
  rationale: 原文动词是“行走、去”，并未明确使用“爬行”；采用较直译的说法以免过度解释。
- source_word: וְעָפָר תֹּאכַל
  choice: 吃尘土
  rationale: 保留具体而强烈的咒诅意象，不将其在正文中缩减为单纯的饮食陈述或改写为抽象的受辱。
- source_word: כָּל יְמֵי חַיֶּיךָ
  choice: 一生都
  rationale: 以自然简洁的现代汉语表达“你生命的一切日子”的持续性。
theological_decisions:
- issue: 蛇的身份与咒诅的性质
  choice: 正文按当前叙事直接译作对蛇的宣判，不加入撒但等后来经文中的身份说明。
  alternative: 在正文中把蛇明确解释为撒但，或将咒诅完全抽象化。
  rationale: 本节原文本身称对象为“蛇”，并以具体的受造物语言描述咒诅；译文应保留本节直接所指，同时不否认后续经文可能赋予的更广神学意义。
- issue: “吃尘土”的含义
  choice: 正文保留字面意象，并以脚注说明它也可表达受辱和败亡。
  alternative: 只按实际食物理解，或直接意译为“蒙羞败亡”。
  rationale: 原文意象可同时承载具体描述和文化性的受辱含义；将二者并存可避免武断消除张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“受更重的咒诅”使希伯来语比较结构在中文中清楚可懂；“用肚子行走”刻意保留原文普通的“行走”动词。所有脚注标记均已置于正文。
