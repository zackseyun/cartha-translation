source:
  edition: WLC
  text: וְ/אֵיבָ֣ה אָשִׁ֗ית בֵּֽינְ/ךָ֙ וּ/בֵ֣ין הָֽ/אִשָּׁ֔ה וּ/בֵ֥ין זַרְעֲ/ךָ֖ וּ/בֵ֣ין זַרְעָ֑/הּ ה֚וּא יְשׁוּפְ/ךָ֣ רֹ֔אשׁ וְ/אַתָּ֖ה תְּשׁוּפֶ֥/נּוּ עָקֵֽב׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/015.yaml
  text: And I will put enmity[a] between you and the woman, and between your seed[b] and her seed; he will crush your head[c][d], and you will bruise his heel.
translation:
  language: zh_hans
  text: 我要使你和女人彼此为仇[a]，你的后裔[b]和她的后裔也彼此为仇；他要击碎你的头[c][d]，你要击伤他的脚跟。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“彼此敌对”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文两处都是“种子”；这个词可以集合性地指后代，也可以指代表这些后代的一个个体。
    reason: lexical_alternative
  - marker: c
    text: 或译“它要击碎你的头”。原文代词为阳性单数，承接一个集合名词。
    reason: alternative_reading
  - marker: d
    text: 原文两个分句使用同一个动词。这个罕见动词也可译为“击打”或“击伤”；这里把头部译为“击碎”，是要表达头部受创比脚跟受创更为严重。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵיבָה
  choice: 彼此为仇
  rationale: 该词表示持续而主动的敌对关系。“彼此为仇”在现代汉语中自然、庄重，也保留了原文较强的关系性含义。
- source_word: אָשִׁית
  choice: 我要使
  rationale: שׂים在此有“放置、设立、使之存在”之意；结合汉语句法，译作“我要使……彼此为仇”比直译“我要放置仇恨”更自然。
- source_word: בֵּינְךָ ... וּבֵין הָאִשָּׁה
  choice: 你和女人彼此
  rationale: 以“彼此”表达原文重复的“在……之间”，清楚呈现双方关系，同时符合现代汉语表达。
- source_word: זַרְעֲךָ ... זַרְעָהּ
  choice: 你的后裔……她的后裔
  rationale: זֶרַע字面为“种子”，用于人时可集合性地指后代，也可由一个代表性个体来体现。“后裔”在汉语中庄重自然；脚注说明原文意象及其集合与个体两种可能。
- source_word: הוּא
  choice: 他
  rationale: 原文代词为阳性单数，承接集合名词זֶרַע。译作“他”保留代表性个体的可能，但不在正文中进一步指定其身份；集合性理解由脚注保留。
- source_word: יְשׁוּפְךָ ... תְּשׁוּפֶנּוּ
  choice: 要击碎……要击伤
  rationale: 两处使用同一个罕见动词שׁוּף，但宾语“头”和“脚跟”暗示伤害程度不同。“击碎……击伤”呈现这种不对称；脚注同时说明原文动词相同及其他可译方式。
- source_word: רֹאשׁ
  choice: 头
  rationale: 按字面译出身体部位，含义清楚。
- source_word: עָקֵב
  choice: 脚跟
  rationale: 按字面译出身体部位；“脚跟”是现代汉语常用表达。
theological_decisions:
- issue: 女人的“后裔”应如何同时保留集合性和代表性个体的可能
  choice: 正文重复使用“后裔”，并把随后的阳性单数代词译为“他”
  alternative: 把后裔明确译成复数的“后代们”，或用“它／他们”承接
  rationale: 希伯来文两次使用同一个集合名词זֶרַע，随后却使用阳性单数代词。此译法既不抹去群体意义，也不排除代表性个体的解读，并避免把特定神学身份直接写入正文。
- issue: 如何表达שׁוּף在两个分句中的力度
  choice: 头部译为“击碎”，脚跟译为“击伤”
  alternative: 两处都译为“击打”或“击伤”
  rationale: 原文虽重复同一罕见动词，但头与脚跟形成明显对照。正文用不同力度的汉语动词表达伤害后果的不对称，脚注则让读者知道希伯来文用词相同。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“彼此为仇”保留宣告的力度；“后裔”避免把人称意义下的זֶרַע生硬译成“种子”，同时借脚注保留原文意象和语义张力。句式维持原文的两组平行关系以及“头／脚跟”的鲜明对照。
