base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/013.yaml
  text: Then Yahweh God said to the woman[a], “What is this you have done?” And the woman said, “The serpent deceived me, and I ate.”
translation:
  language: zh_hans
  text: 耶和华上帝对女人说：“你做的这是什么事？”女人说：“蛇欺骗了我，我吃了。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה אֱלֹהִים
  choice: 耶和华上帝
  rationale: 保留四字神名的传统汉语音译“耶和华”，并以现代普通话常用的“上帝”译 אֱלֹהִים，清楚呈现神名与称谓的组合。
- source_word: לָאִשָּׁה
  choice: 对女人
  rationale: אִשָּׁה 可指“女人”或“妻子”；此处是叙事中对她的称呼，译作“女人”较为直接，也不额外突出婚姻身份。
- source_word: מַה זֹּאת עָשִׂית
  choice: 你做的这是什么事？
  rationale: 兼顾疑问词 מַה、指示词 זֹּאת 和动词“做”，保留原文带有责问意味的完整表达，而不改译成因果性的“你为什么这样做”。
- source_word: הַנָּחָשׁ
  choice: 蛇
  rationale: “蛇”是现代汉语对 נָחָשׁ 自然、准确的对应，也符合创世记第三章的叙事语境。
- source_word: הִשִּׁיאַנִי
  choice: 欺骗了我
  rationale: 该使役形式表示误导、蒙骗；“欺骗了我”清楚自然，并保留其道德与叙事分量。
- source_word: וָאֹכֵל
  choice: 我就吃了
  rationale: “就”自然表达前述欺骗与随后吃下之间的叙事承接；它不必被理解为替女人免责的强因果断言。
theological_decisions:
- issue: 女人如何陈述蛇对她所做的事
  choice: 蛇欺骗了我
  alternative: 蛇诱骗了我／蛇迷惑了我
  rationale: 原文动词明确涉及欺骗或误导，但不要求加入更具体的诱惑方式；“欺骗”既忠实又不额外化解责任与受骗之间的张力。
- issue: 神名 יְהוָה 的呈现
  choice: 耶和华
  alternative: 雅威
  rationale: “耶和华”是普通简体中文读者最熟悉、可识别的神名音译，并明确呈现专名而非以“主”这一称号替代。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。句式保留原文问答结构；“你做的这是什么事？”比“你做了什么？”更充分呈现 זֹּאת 的指示和责问语气。本文无需脚注。
