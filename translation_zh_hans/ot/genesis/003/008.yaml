  text: וַֽ/יִּשְׁמְע֞וּ אֶת ק֨וֹל יְהוָ֧ה אֱלֹהִ֛ים מִתְהַלֵּ֥ךְ בַּ/גָּ֖ן לְ/ר֣וּחַ הַ/יּ֑וֹם וַ/יִּתְחַבֵּ֨א הָֽ/אָדָ֜ם וְ/אִשְׁתּ֗/וֹ מִ/פְּנֵי֙ יְהוָ֣ה אֱלֹהִ֔ים בְּ/ת֖וֹךְ עֵ֥ץ הַ/גָּֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/008.yaml
  text: And they heard the sound of Yahweh God walking in the garden in the breeze of the day[c][b][a], and the man and his wife hid themselves from the presence of Yahweh God among the trees of the garden.
translation:
  language: zh_hans
  text: 他们听见雅威上帝在园中行走的声音[a]，那是在一天的风中[b]；那人[c]和他的妻子就藏在园中的树木之间，从雅威上帝面前躲藏起来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “声音”也可译作“说话声”。希伯来词可指一般的声音，也可指说话声。
    reason: lexical_alternative
  - marker: b
    text: 或译：“一天凉爽的时候”。直译为“在一天的风中”。
    reason: lexical_alternative
  - marker: c
    text: 希伯来文作“那人”；也可理解为“亚当”。
    reason: alternative_reading
lexical_decisions:
- source_word: קוֹל
  choice: 声音
  rationale: 该词既可指“声音、响声”，也可指“说话声”。本节没有明确说上帝开口，因此正文采用较宽泛的“声音”，不把它限定为话语。
- source_word: יְהוָה אֱלֹהִים
  choice: 雅威上帝
  rationale: 将四字神名作为专名音译为“雅威”，并将 אֱלֹהִים 译为“上帝”，保留原文中专名与称号并列的形式。
- source_word: מִתְהַלֵּךְ
  choice: 行走
  rationale: 保留原文具体而拟人化的叙述，不改写为抽象的“临在”或弱化为“移动”。
- source_word: לְרוּחַ הַיּוֹם
  choice: 一天起风的时候
  rationale: רוּחַ 在这里自然可指风；这一译法保留“日间之风”的意象，同时不擅自断定是傍晚或仅指凉爽。
- source_word: הָאָדָם
  choice: 那人
  rationale: 定冠词和上下文支持“那人”；与“他的妻子”并列时，所指为叙事中的具体男人，同时不排除其代表性含义。
- source_word: מִפְּנֵי
  choice: 躲避……的面
  rationale: 较直接地保留“从……面前／躲避……的面”的空间与关系意味，而不增添原文没有明说的行动或动机。
- source_word: בְּתוֹךְ עֵץ הַגָּן
  choice: 在园中的树木之间
  rationale: עֵץ 虽为单数形式，在此可作集合名词；按藏身的语境译为复数“树木”最符合现代汉语。
theological_decisions:
- issue: 上帝在园中“行走”的拟人化描写
  choice: 保留具体的“行走”
  alternative: 译作“在园中活动”或“上帝的临在来到园中”
  rationale: 原文以鲜明的叙事语言描写上帝；译文不将其寓意化，也不以系统神学解释消解这种张力。
- issue: הָאָדָם 是普通名词还是专名
  choice: 正文译作“那人”
  alternative: 译作“亚当”
  rationale: 此处有定冠词，且“和他的妻子”表明普通名词义十分自然；脚注保留将其理解为“亚当”的可能。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“便藏在”使句子自然连贯；“躲避……的面”略带庄重的圣经语体，用来保留原文 מִפְּנֵי 的“面／面前”意象。所有脚注标记均置于相应词语之后。
