  to: 那人说：“你赐给我、让她与我在一起的那女人，是她把那树的果子[a]给了我，我吃了。”
  rationale: 修订仅改善来源介词在汉语中的表达，并避免“就”对叙事连词所可能增加的顺承意味。“让她与我在一起”自然呈现“你所赐给、与我同在的女人”，不将关系具体化为婚姻角色或其他神学解释。
