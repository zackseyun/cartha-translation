source:
  edition: WLC
  text: וַ/יֹּ֖אמֶר הָֽ/אָדָ֑ם הָֽ/אִשָּׁה֙ אֲשֶׁ֣ר נָתַ֣תָּה עִמָּדִ֔/י הִ֛וא נָֽתְנָה לִּ֥/י מִן הָ/עֵ֖ץ וָ/אֹכֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/012.yaml
  text: And the man said[a], “The woman whom you gave to be with me—she gave me from the tree, and I ate.”
translation:
  language: zh_hans
  text: 那人说：“你赐给我、让她与我在一起的那女人，是她把那树的果子[a]给了我，我吃了。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“她从那树给了我”；原文没有明说“果子”，但上下文暗示了这一宾语。
    reason: 说明为使现代汉语表达完整而补出的隐含宾语。
lexical_decisions:
- source_word: הָאָדָם
  choice: 那人
  rationale: 此处指上文特定的男性个体，而不是泛指人类；“那人”既承接叙事，也保留普通名词的表达。
- source_word: הָאִשָּׁה
  choice: 那个女人
  rationale: 保留希伯来文“女人”的直接称呼；此处虽可按关系译作“妻子”，但原文并未明确采用该释义。
- source_word: אֲשֶׁר נָתַתָּה עִמָּדִי
  choice: 你赐给我、与我在一起的
  rationale: 既表达“赐给”的动作，也保留 עִמָּדִי“与我在一起”的关系含义，不将其进一步解释为“作伴”或其他特定功能。
- source_word: הִוא
  choice: 是她
  rationale: 独立代词带有强调作用；“是她”在现代汉语中自然地保留这种突出语气。
- source_word: נָתְנָה לִי
  choice: 给了我
  rationale: 用完成体“了”表达叙事中已经发生的动作。
- source_word: מִן הָעֵץ
  choice: 那树上的果子
  rationale: 原文直译为“从那树〔取来的东西〕”，宾语由上下文暗示。汉语补出“果子”可避免表达残缺，并用脚注说明原文形式。
- source_word: וָאֹכֵל
  choice: 我就吃了
  rationale: “就”自然呈现领受之后随即吃下的叙事顺序，不额外加入因果辩解。
theological_decisions:
- issue: 男人的话可能把责任推向女人和上帝
  choice: 保留“你赐给我、与我在一起的那个女人”以及强调性的“是她”
  alternative: 弱化为“和我在一起的女人”或强化为“都是你给我的女人害的”
  rationale: 原文措辞隐含推诿，却没有明说指责上帝；译文既不淡化，也不夸大这种张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“赐给”适合对上帝作为施予者的叙述；逗号隔开的“与我在一起”尽量保留原文关系从句的结构，“是她”则传达希伯来文独立代词的强调。
