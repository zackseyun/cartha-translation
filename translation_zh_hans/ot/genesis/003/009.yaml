  text: וַ/יִּקְרָ֛א יְהוָ֥ה אֱלֹהִ֖ים אֶל הָֽ/אָדָ֑ם וַ/יֹּ֥אמֶר ל֖/וֹ אַיֶּֽ/כָּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/009.yaml
  text: Then Yahweh God called to the man and said to him[a], “Where are you?”
translation:
  language: zh_hans
  text: 于是，雅威[a]上帝呼唤那人，对他说：“你在哪里？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威”也常译作“耶和华”，是希伯来文神名 יהוה（YHWH）的音译。
    reason: 说明神名的另一常见汉语译法。
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: 于是……呼唤
  rationale: 这是叙事中的连续动作。用“于是”承接上文，用“呼唤”表达 קרא 的基本意义；不额外加入“厉声”或“召来”等原文未明说的语气。
- source_word: יְהוָה אֱלֹהִים
  choice: 雅威上帝
  rationale: 将四字神名 יְהוָה 音译为“雅威”，并将 אֱלֹהִים 译为现代汉语中庄重自然的“上帝”。
- source_word: הָאָדָם
  choice: 那人
  rationale: 定冠词形式在此指叙事中那个特定的人，而不是泛指全人类；“那人”既保留具体指称，也避免在此处直接把普通名词改作专名“亚当”。
- source_word: וַיֹּאמֶר לוֹ
  choice: 对他说
  rationale: 保留原文 לוֹ“对他”的明确指向，同时符合现代汉语表达。
- source_word: אַיֶּכָּה
  choice: 你在哪里？
  rationale: 准确表达带第二人称阳性单数后缀的地点疑问，不添加“现在”等原文没有的限定。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名。正文采用较贴近学界通常重构读音的“雅威”，脚注保留汉语传统译名“耶和华”，不以“主”替代神名。
- issue: הָאָדָם 的所指
  choice: 那人
  alternative: 亚当；人类
  rationale: 本节所呼唤的是园中那位具体的男性人物，但该词仍带定冠词，形式上是普通名词“那人”，不宜在此无提示地专名化，也不宜泛化为“人类”。
- issue: “你在哪里？”的语用含义
  choice: 保留直接问句，不解释其目的
  alternative: 你为什么躲藏？
  rationale: 原文只明说地点问题；它究竟是寻问、责问还是引导认罪，属于上下文中的神学张力，正文不替读者判定。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“于是”自然承接前文；“呼唤那人，对他说”兼顾希伯来文两个连续言说动词及汉语可读性。
