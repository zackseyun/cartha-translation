  text: וַ/יִּקְרָ֧א הָֽ/אָדָ֛ם שֵׁ֥ם אִשְׁתּ֖/וֹ חַוָּ֑ה כִּ֛י הִ֥וא הָֽיְתָ֖ה אֵ֥ם כָּל חָֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/020.yaml
  text: And the man called his wife's name Eve[b][a], because she was the mother of all the living.
translation:
  language: zh_hans
  text: 那人[a]给他的妻子取名为夏娃，因为她是所有活着者的母亲[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“亚当”。希伯来文作“那人”，带定冠词。
    reason: alternative_reading
  - marker: b
    text: 或译：“所有活人的母亲”或“一切生物的母亲”。希伯来文直译为“一切活着者的母亲”。“夏娃”一名在希伯来语中与“活着”一词音近。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: 起名叫
  rationale: 此处是命名公式；“起名叫”既准确表达命名行为，也比直译“称……的名为”更符合现代汉语。
- source_word: הָאָדָם
  choice: 那人
  rationale: 原文带定冠词，意为“那人”，而不是无冠词的专名形式“亚当”；“那人”也自然承接上文已经出现的男子。
- source_word: אִשְׁתּוֹ
  choice: 他的妻子
  rationale: 此处 אִשָּׁה 指这人的配偶，译作“妻子”准确自然。
- source_word: חַוָּה
  choice: 夏娃
  rationale: 采用现代中文圣经传统中通行的人名形式。
- source_word: כִּי
  choice: 因为
  rationale: 明确表达后句是起名的原因。
- source_word: הָיְתָה
  choice: 是
  rationale: 这里描述她的身份或地位，未必表示状态变化，因此不译作“成了”。
- source_word: אֵם כָּל חָי
  choice: 众生之母
  rationale: 简洁保留希伯来文“所有活着者之母”的广泛表达，不把范围限定为人类或一切生物。
theological_decisions:
- issue: הָאָדָם 应译为专名“亚当”还是描述性称谓“那人”
  choice: 那人
  alternative: 亚当
  rationale: 定冠词支持描述性理解。译作“那人”保留这一语法特征，同时不否认所指正是后来称为亚当的那个人。
- issue: “所有活着者”的范围
  choice: 以“众生”保留宽泛含义
  alternative: 所有活人／一切生物
  rationale: 原文措辞简练，范围存在一定开放性；正文不将其限定为全体人类，也不明确扩展为所有动植物。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“起名叫”符合日常命名表达；“众生之母”凝练且有经文语体色彩，但仍易于普通读者理解。脚注保留“亚当”的传统读法、末句范围的歧义及原文中的语音联系。
