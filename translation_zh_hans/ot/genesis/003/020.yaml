  rationale: 将“众生之母”改为“所有活着者的母亲”，以准确保留原文对范围的开放性，避免目标语中“众生”所带的有情生命或佛教语境联想。相应调整脚注，使其不再把正文的直译重复标作直译，并保留人类与一切生物两种解释性译法及原文的语音关联。
