base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/021.yaml
  text: And Yahweh God made garments of skin for the man and for his wife[b][a], and clothed them.
translation:
  language: zh_hans
  text: 耶和华上帝为那人和他的妻子做了皮衣[a][b]，给他们穿上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “那人”或译“亚当”。希伯来语 אָדָם 在不同语境中既可作普通名词“人”，也可作人名“亚当”。
    reason: alternative_reading
  - marker: b
    text: “皮衣”或译“皮制长衣”。原词指穿在身上的衣服或长衣。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה אֱלֹהִים
  choice: 耶和华上帝
  rationale: 将神名四字母词音译惯例“耶和华”与 אֱלֹהִים“上帝”并列，保留原文的复合称谓及神名的位格性。
- source_word: לְאָדָם
  choice: 为那人
  rationale: 此处与“他的妻子”相对，指叙事中的男性个体；“那人”自然保留普通名词的叙事作用，也不把仍有的姓名读法绝对化。
- source_word: וּלְאִשְׁתּוֹ
  choice: 和他的妻子
  rationale: אִשָּׁה 加第三人称阳性单数后缀，在婚姻语境中自然指“他的妻子”。
- source_word: כָּתְנוֹת עוֹר
  choice: 皮衣
  rationale: כֻּתֹּנֶת 指穿在身上的衣服或长衣，עוֹר 指皮或兽皮；“皮衣”简洁自然，同时保留材料信息。
- source_word: וַיַּעַשׂ
  choice: 做了
  rationale: עשה 的基本义是“做、制造”；现代汉语中“做了”朴素自然，不作额外发挥。
- source_word: וַיַּלְבִּשֵׁם
  choice: 给他们穿上
  rationale: לבש 的使役式表示使某人穿着；“给他们穿上”准确传达上帝亲自使二人穿上衣服的动作。
theological_decisions:
- issue: אָדָם 应译为普通名词还是人名
  choice: 普通名词“那人”
  alternative: 人名“亚当”
  rationale: 本节把该男性个体与“他的妻子”并提，普通名词读法在此仍然突出；正文采用“那人”，脚注保留人名读法，以保存希伯来文的歧义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“皮衣”较“皮制长袍”更简练；“给他们穿上”比“使他们穿着”更符合现代汉语。脚注标记均置于相关词语之后。
