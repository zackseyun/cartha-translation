language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אֶֽל הָ/אִשָּׁ֣ה אָמַ֗ר הַרְבָּ֤ה אַרְבֶּה֙ עִצְּבוֹנֵ֣/ךְ וְ/הֵֽרֹנֵ֔/ךְ בְּ/עֶ֖צֶב תֵּֽלְדִ֣י בָנִ֑ים וְ/אֶל אִישֵׁ/ךְ֙ תְּשׁ֣וּקָתֵ֔/ךְ וְ/ה֖וּא יִמְשָׁל בָּֽ/ךְ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/016.yaml
  text: To the woman he said[a], “I will greatly multiply your pain and your conception; in pain you will bear children. Your desire will be for your husband[c][b], and he will rule over you.”
translation:
  language: zh_hans
  text: 他对女人说：“我必大大加增你的痛苦和怀孕[a]；你必在痛苦中生儿女[b]。你必渴望[c]你的丈夫，他必管辖你。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “怀孕”也可译作“受孕”。希伯来语这个词可指受孕或怀孕。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译为“儿子们”，此处很可能泛指儿女或后代。
    reason: lexical_alternative
  - marker: c
    text: “渴望”也可译作“恋慕”。这个希伯来词很少见，广义上可表示欲求；有人结合创世记4:7，理解为想要控制，也有人理解为关系上或性方面的渴望。
    reason: alternative_reading
lexical_decisions:
- source_word: הָאִשָּׁה
  choice: 女人
  rationale: 此处是在审判场景中对女性本人说话，译作“女人”最贴合当前语境；后文 אִישֵׁךְ 则明确表达婚姻关系。
- source_word: הַרְבָּה אַרְבֶּה
  choice: 我必大大加增
  rationale: 不定式绝对形与限定动词连用，具有加强语气的作用；“必大大加增”既保留强调，也符合庄重的现代汉语。
- source_word: עִצְּבוֹנֵךְ
  choice: 你的艰苦
  rationale: 该词可指痛苦、劳苦或艰辛。它与怀孕并列，又在下句由“痛苦”具体落实于生产，因此此处用较宽泛的“艰苦”保留其语义范围，避免把两处词语完全扁平化。
- source_word: וְהֵרֹנֵךְ
  choice: 你怀孕
  rationale: 该名词可指受孕或怀孕。汉语“怀孕”在此自然，并可与“艰苦”组成通顺表达；“受孕”作为词义可能性收入脚注。
- source_word: בְּעֶצֶב
  choice: 在痛苦中
  rationale: 介词短语表示生育时的处境或方式；“在痛苦中”直接、自然地对应原文。
- source_word: תֵּלְדִי בָנִים
  choice: 你必生儿女
  rationale: בָנִים 字面为“儿子们”，但在此泛指所生的后代；“儿女”在现代汉语中自然表达统称，同时脚注保留字面信息。
- source_word: אִישֵׁךְ
  choice: 你的丈夫
  rationale: 在此婚姻关系中，אִישׁ 自然指“丈夫”，而非泛指“男人”。
- source_word: תְּשׁוּקָתֵךְ
  choice: 你必恋慕
  rationale: 该词罕见且含义有争议。“恋慕”保留指向丈夫的强烈欲求或倾向，却不在正文中断定它是情欲、关系上的依恋，还是控制欲；相关解释列入脚注。
- source_word: יִמְשָׁל בָּךְ
  choice: 他必管辖你
  rationale: 该动词意为治理、管辖。“管辖”直接表达统治关系，却不像“支配”或“压制”那样额外强化负面意味。
theological_decisions:
- issue: 女人对丈夫“恋慕”的具体含义
  choice: 正文译为“你必恋慕你的丈夫”，不限定其为情欲、关系上的依恋或控制欲。
  alternative: 译为“你必渴望你的丈夫”，或解释为“你必想控制你的丈夫”。
  rationale: תְּשׁוּקָה 在希伯来圣经中很少见，本节语境不足以排除多种理解。正文应保留这一真实歧义，而不把某种神学解释写进译文。
- issue: 丈夫“管辖”女人是描述还是规范
  choice: 译作对堕落后状况的陈述：“他必管辖你。”
  alternative: 将其表达为上帝所规定、所认可的男性权柄。
  rationale: 希伯来文直接陈述将要发生的事，并未用命令或义务形式说明应当如此；译文不额外加入规范性判断。
translation_notes:
  register: 采用庄重、清晰的现代标准汉语。正文保留原文的强调结构和关键语义张力；“艰苦／痛苦”体现 עִצָּבוֹן 与 עֶצֶב 的词根关联，同时避免机械重复。所有解释性替代读法置于脚注，不在正文中消解歧义。
