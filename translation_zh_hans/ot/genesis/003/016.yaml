  to: 他对女人说：“我必大大加增你的痛苦和怀孕[a]；你必在痛苦中生儿女[b]。你必渴望[c]你的丈夫，他必管辖你。”
  rationale: 修订恢复了希伯来文“你的痛苦”和“你的受孕／怀孕”的并列关系，并保留“加增怀孕”这一源文中不完全寻常、但不可自行消解的措辞。将“恋慕”改为“渴望”，以避免在正文预先判定该罕见词是浪漫／性欲、依恋，还是控制欲。其余措辞及脚注锚点均可保留。
