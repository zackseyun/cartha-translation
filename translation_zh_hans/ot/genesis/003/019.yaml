  text: בְּ/זֵעַ֤ת אַפֶּ֨י/ךָ֙ תֹּ֣אכַל לֶ֔חֶם עַ֤ד שֽׁוּבְ/ךָ֙ אֶל הָ֣/אֲדָמָ֔ה כִּ֥י מִמֶּ֖/נָּה לֻקָּ֑חְתָּ כִּֽי עָפָ֣ר אַ֔תָּה וְ/אֶל עָפָ֖ר תָּשֽׁוּב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/019.yaml
  text: By the sweat of your face you will eat bread until you return to the ground[a], because from it you were taken; for you are dust, and to dust you will return.
translation:
  language: zh_hans
  text: 你必靠着脸上的汗水[a]吃饭，直到你归回土地；因为你是从土地取出的。你本是尘土，必归回尘土。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“靠着（或：在）你脸上的汗水”；“汗流满面”是较自然的汉语惯用表达。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּזֵעַת אַפֶּיךָ
  choice: 汗流满面
  rationale: 希伯来文直译为“你脸上的汗”。“汗流满面”既保留“脸/面”的原有意象，又是自然、庄重的现代汉语表达。
- source_word: תֹּאכַל לֶחֶם
  choice: 才有饭吃
  rationale: לֶחֶם本义为“饼、食物”，在这里可借指维持生计的食物。汉语“有饭吃”自然传达这一广义，同时“才”体现劳苦是获得食物的条件。
- source_word: עַד שׁוּבְךָ אֶל הָאֲדָמָה
  choice: 直到你归回土地
  rationale: אֲדָמָה指土地、土壤；“土地”与人从地而出的上下文联系清楚，也能与后文“尘土”形成呼应。
- source_word: כִּי מִמֶּנָּה לֻקָּחְתָּ
  choice: 因为你是从土地取出的
  rationale: 保留希伯来文被动语态及因果关系。重复“土地”而不用“它”，使现代汉语指代明确。
- source_word: עָפָר
  choice: 尘土
  rationale: “尘土”准确表达עָפָר，并保留人之物质来源、脆弱与死亡的意蕴。
- source_word: תָּשׁוּב
  choice: 必归回
  rationale: 未完成式在此宣告确定将临的结果；“必”传达其确定性，“归回”则保留与前句相同的שׁוב用词。
theological_decisions:
- issue: 人的必死性与物质来源
  choice: 将本节译为人最终必在身体上归回土地和尘土的宣告。
  alternative: 把归回尘土主要理解为受辱或卑微的比喻。
  rationale: 上下文以及“土地—取出—尘土—归回”的词语链条，明显指向人的物质来源和死亡；译文不在此基础上加入经文本身未明说的后世教义解释。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“汗流满面”兼顾原文意象与汉语习惯；“才有饭吃”按לֶחֶם在语境中的广义处理，避免将古代主食误解为现代汉语中特定种类的“饼”。“归回”重复出现，以保留原文修辞呼应。
