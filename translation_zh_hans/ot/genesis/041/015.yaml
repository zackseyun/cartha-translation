base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/015.yaml
  text: And Pharaoh said to Joseph, “I have dreamed a dream, and there is no one to interpret it. But I have heard it said about you that when you hear a dream, you can interpret it.”
translation:
  language: zh_hans
  text: 法老对约瑟说：“我做了一个梦，没有人能解这个梦。我听说，你听了梦就能解梦。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֲלוֹם חָלַמְתִּי
  choice: 我做了一个梦
  rationale: 希伯来语以同源名词和动词加强表达；现代汉语用自然的“做了一个梦”传达，不机械重复。
- source_word: וּפֹתֵר אֵין אֹתוֹ
  choice: 却没有人能解
  rationale: “解”在上下文中明确指解梦，简洁保留“无人解释它”的意思。
- source_word: שָׁמַעְתִּי עָלֶיךָ לֵאמֹר
  choice: 我听人说起你，说
  rationale: 保留间接传闻以及 לֵאמֹר 引出所闻内容的结构，避免把传闻表述成法老亲自确认的事实。
- source_word: תִּשְׁמַע חֲלוֹם לִפְתֹּר אֹתוֹ
  choice: 你听了梦就能解
  rationale: תִּשְׁמַע 字面为“你听”；不改成“听说你善于解梦”，从而保留“听梦—解梦”的表达。目的式不定词在此自然表达为能力或结果“就能解”。
theological_decisions:
- issue: 约瑟解梦能力的表述
  choice: 按法老所听到的传言表述为“你听了梦就能解”
  alternative: 你只要听到一个梦，就知道怎样解释
  rationale: 本节只报告法老的认知，尚未说明能力的真正来源；译文不提前加入神学解释，也不把传言强化为绝对断言。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“法老”“约瑟”“解（梦）”符合圣经叙事的通行表达；句式简洁，适合普通读者朗读和理解。
