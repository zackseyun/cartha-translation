  text: וְ/יִקְבְּצ֗וּ אֶת כָּל אֹ֨כֶל֙ הַ/שָּׁנִ֣ים הַ/טֹּבֹ֔ת הַ/בָּאֹ֖ת הָ/אֵ֑לֶּה וְ/יִצְבְּרוּ בָ֞ר תַּ֧חַת יַד פַּרְעֹ֛ה אֹ֥כֶל בֶּ/עָרִ֖ים וְ/שָׁמָֽרוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/035.yaml
  text: Let them gather all the food of these coming good years[a], and let them store up grain under Pharaoh’s authority as food in the cities[b], and let them keep it.
translation:
  language: zh_hans
  text: 让他们收集这些将要来到的丰年所出的一切粮食，并把谷物积存在各城，归法老掌管[a]，作为粮食，并加以保管[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“在法老的手下”；这是表示处于法老权柄或控制之下的希伯来语习语。
    reason: lexical_alternative
  - marker: b
    text: 或译“看守”或“保存”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִקְבְּצוּ
  choice: 要让他们收集
  rationale: 未完成式在约瑟提出方案的语境中带有指令、建议的语气；“要让他们”既保留第三人称复数，也自然表达此处的祈使意味。
- source_word: כָּל אֹכֶל
  choice: 一切的粮食
  rationale: אֹכֶל 泛指食物或粮食；本节语境是丰年所收的农产储备，“粮食”比宽泛的“食物”更贴合，同时不限定为某一种谷物。
- source_word: הַשָּׁנִים הַטֹּבוֹת הַבָּאֹת הָאֵלֶּה
  choice: 这些将临的丰年
  rationale: 保留指示词“这些”、分词“将临”以及“好年景”的语境义；中文用“丰年”简洁自然。
- source_word: וְיִצְבְּרוּ
  choice: 积存
  rationale: 该动词有堆积、大量储存之意；“积存”适合有计划储粮的行政语境。
- source_word: בָר
  choice: 五谷
  rationale: בָר 指谷粒，尤其是脱粒后的谷物；“五谷”在现代中文中可自然统称谷物，又不把原文缩窄为小麦。
- source_word: תַּחַת יַד פַּרְעֹה
  choice: 在法老的掌管之下
  rationale: 直译为“在法老手下”，是表示权柄、控制或监管的习语；“在法老的掌管之下”清楚传达其行政归属。
- source_word: אֹכֶל בֶּעָרִים
  choice: 在各城，作为储备的粮食
  rationale: 原文结构简练，可理解为这些谷物要成为存放在各城的粮食；译文保留地点和用途，并以“储备”显明上下文中的存粮功能。
- source_word: וְשָׁמָרוּ
  choice: 他们要把粮食保管好
  rationale: שׁמר 可表示保留、看守或保存；此处宾语由上下文补足为粮食。“保管好”自然涵盖看守与保存，脚注保留其他可能侧重。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“丰年”“积存”“掌管”等词符合古代行政储粮的场景，又避免过度古雅。正文中的脚注标记均紧随其所解释的表达。
