  rationale: 修订以“谷物”准确对应不限定种类的בָר，并改善“将临”的现代汉语自然度。保留“各城”作为储存地点、“作为粮食”的用途说明，以及“归法老掌管”所表达的权柄／控制关系。脚注锚点分别紧随所说明的“归法老掌管”和“加以保管”。
