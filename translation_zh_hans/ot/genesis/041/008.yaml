base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/008.yaml
  text: In the morning[a], his spirit was troubled, so he sent and called all the magicians of Egypt and all its wise men. Pharaoh told them his dreams, but there was no one who could interpret them for Pharaoh.
translation:
  language: zh_hans
  text: 到了早晨，法老心神不安，就派人召来埃及所有的术士和智者。法老把他的梦讲给他们听，却没有人能为法老解释它们[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来原文作“解释它们”。前面的“梦”是单数，而这里的代词是复数，可能指梦中的各个部分，也可能把整个梦境经历按不同内容来看。有些译本将其顺译为“解释这个梦”。
    reason: 保留原文中单数名词与复数代词之间的语法张力，并说明可能的理解。
lexical_decisions:
- source_word: וַיְהִי בַבֹּקֶר
  choice: 到了早晨
  rationale: 自然表达叙事中的时间推进，兼顾希伯来语结构和现代汉语习惯。
- source_word: וַתִּפָּעֶם רוּחוֹ
  choice: 法老心神不安
  rationale: פעם在此表示内在受扰、烦乱；“心神不安”自然传达其含义，同时以“心神”保留רוּחַ所指的内在精神状态。为避免汉语代词指向不清，明说“法老”。
- source_word: וַיִּשְׁלַח וַיִּקְרָא
  choice: 派人召来
  rationale: 两个连续动词在语境中合指派人去传召；此译法符合现代汉语，又保留实际行动过程。
- source_word: חַרְטֻמֵּי מִצְרַיִם
  choice: 埃及所有的术士
  rationale: 该词指埃及宫廷中从事秘术、礼仪并解释梦兆的专业人士；“术士”比泛称“文士”更符合本段语境。
- source_word: כָּל חֲכָמֶיהָ
  choice: 智者
  rationale: 指埃及的智慧人士或宫廷贤士；“智者”简洁自然，并与专业性的“术士”有所区分。
- source_word: וַיְסַפֵּר פַּרְעֹה לָהֶם אֶת חֲלֹמוֹ
  choice: 法老把他的梦讲给他们听
  rationale: “梦”依照马所拉文本保留单数；“讲给他们听”自然表达 recount 的叙述动作。
- source_word: וְאֵין פֹּתֵר אֹתָם לְפַרְעֹה
  choice: 却没有人能为法老解释它们
  rationale: פתר在梦境语境中意为解释、解明。原文宾语代词为复数，因此以“它们”保留单数“梦”与复数代词之间的张力，并用脚注说明。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“派人召来”避免生硬直译两个连续动词；“心神不安”自然传达法老内在受到搅扰的状态。末句刻意保留“梦／它们”的数不一致，并以脚注解释，而不在正文中消除原文的含混。
