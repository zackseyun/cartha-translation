  text: וַ/יֹּ֤אמֶר פַּרְעֹה֙ אֶל יוֹסֵ֔ף אַחֲרֵ֨י הוֹדִ֧יעַ אֱלֹהִ֛ים אוֹתְ/ךָ֖ אֶת כָּל זֹ֑את אֵין נָב֥וֹן וְ/חָכָ֖ם כָּמֽוֹ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/039.yaml
  text: Then Pharaoh said to Joseph[a], “Since God has made all this known to you, there is no one as discerning and wise as you.”
translation:
  language: zh_hans
  text: 于是，法老对约瑟说：“既然[a]神使你知道这一切，没有人像你这样有见识、有智慧。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在神使你知道这一切以后。”希伯来语介词较形式化地可译为“以后”，但在这里也表达法老据此作出结论。
    reason: 词义替代译法
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 于是……说
  rationale: 连续式叙事动词推动情节发展；“于是”自然表达先后承接关系。
- source_word: פַּרְעֹה
  choice: 法老
  rationale: 现代汉语圣经传统中对埃及君王称号的标准译法。
- source_word: אַחֲרֵי
  choice: 既然
  rationale: 该词通常表示“在……以后”，但此处同时构成法老作出结论的依据；“既然”在现代汉语中更自然地传达这种推论关系，形式较直译的译法收入脚注。
- source_word: הוֹדִיעַ
  choice: 使……知道
  rationale: 准确体现ידע使役形的含义，即“使某人知道、把……告知某人”。
- source_word: אֱלֹהִים
  choice: 神
  rationale: 动词形式及上下文均指单数的神；“神”是庄重且通行的现代汉语译法。
- source_word: אֶת כָּל זֹאת
  choice: 这一切
  rationale: 简洁自然地指约瑟所解释和说明的整件事。
- source_word: אֵין
  choice: 再没有人
  rationale: 将希伯来语存在否定结构译成自然汉语；“再”加强法老在既定范围内找不到他人的语气，并未改变否定含义。
- source_word: נָבוֹן
  choice: 明辨
  rationale: 表达洞察、理解和判断的能力，符合约瑟在上下文中表现出的识见。
- source_word: וְחָכָם
  choice: 而有智慧
  rationale: 保留与נָבוֹן并列而有区别的“智慧”概念；“而”使汉语形容结构顺畅。
- source_word: כָּמוֹךָ
  choice: 像你这样
  rationale: 在否定比较句中自然表达“无人与你相同或相当”。
theological_decisions:
- issue: 法老话语中אֱלֹהִים的所指
  choice: 神
  alternative: 诸神
  rationale: אֱלֹהִים在形态上可呈复数形式，但这里与单数动词搭配，并承接那位把梦的含义显明给约瑟的神；因此单数“神”最符合希伯来语句法和上下文。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“明辨而有智慧”保留原文两个相邻但不完全相同的品质；脚注保留אַחֲרֵי的时间性直译可能。
