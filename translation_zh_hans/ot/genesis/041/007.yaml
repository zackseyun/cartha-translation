base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/007.yaml
  text: And the thin ears swallowed up the seven healthy and full ears[a]. Then Pharaoh awoke, and behold[b], it was a dream.
translation:
  language: zh_hans
  text: 那些细瘦的穗子吞下了那七个肥壮[b]而饱满的穗子[a]。法老醒来，看哪，原来是一场梦。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “穗子”也可译作“谷穗”。希伯来语所指的是谷物结籽的穗部，不是整根秆。
    reason: lexical_alternative
  - marker: b
    text: “肥壮”也可译作“健壮”或“肥硕”。这个形容词可表示健康、长势良好或丰满壮实。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּבְלַעְנָה
  choice: 吞下了
  rationale: 直接保留“吞咽”的具体意象及梦境中反常、鲜明的画面，不增添“吞噬”可能带有的捕食意味。
- source_word: הַשִּׁבֳּלִים
  choice: 穗子
  rationale: 此词在上下文中指谷物结籽的穗部，而非整根秆；“穗子”自然简洁，也不擅自限定为某一种谷物。
- source_word: הַדַּקּוֹת
  choice: 细瘦的
  rationale: 兼顾该形容词“细、薄、瘦”的含义；用于穗子时，“细瘦”比单用“瘦”更自然，并与丰满的穗子形成清楚对照。
- source_word: שֶׁבַע
  choice: 七个
  rationale: 按原文保留明确数目，并使用适合“穗子”的现代汉语量词。
- source_word: הַבְּרִיאוֹת
  choice: 肥壮
  rationale: 该词可表示健康、壮实或肥硕；用于谷穗时，“肥壮”保留其长势良好、充实粗壮的意味。
- source_word: וְהַמְּלֵאוֹת
  choice: 而饱满
  rationale: 忠实表达“满、充满”，在谷穗语境中“饱满”自然指籽粒充实；“而”使两个并列性质在汉语中衔接顺畅。
- source_word: וַיִּיקַץ
  choice: 醒来
  rationale: 符合现代汉语叙事习惯，准确表达从睡眠中醒来的动作。
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留原文提示注意、表现突然察觉的叙事标记及其文学力度。
- source_word: חֲלוֹם
  choice: 原来是一场梦
  rationale: 原文简洁地说“看哪，梦”；汉语补出判断结构，“原来”表达醒来后突然明白这是梦，同时不改动事件内容。
