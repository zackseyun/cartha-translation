  text: וְ/הִנֵּה֙ שֶׁ֣בַע שִׁבֳּלִ֔ים צְנֻמ֥וֹת דַּקּ֖וֹת שְׁדֻפ֣וֹת קָדִ֑ים צֹמְח֖וֹת אַחֲרֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/023.yaml
  text: And behold[a], seven ears, thin and scorched by the east wind[b], were sprouting after them.
translation:
  language: zh_hans
  text: 看哪，随后又长出七个谷穗，干瘪、细弱，被东风吹焦了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留希伯来语在梦境叙述中引人注意、使画面显得鲜明的提示作用。
- source_word: שֶׁבַע שִׁבֳּלִים
  choice: 七个谷穗
  rationale: שִׁבֳּלִים 指谷物的穗部；“谷穗”准确而自然，也不擅自指定为某一种谷物。
- source_word: צְנֻמוֹת
  choice: 干瘪
  rationale: 该词描述谷穗枯缩、瘪弱的状态；译作“干瘪”可与下一个形容词区分，并保留原文形容语叠加的力度。
- source_word: דַּקּוֹת
  choice: 细弱
  rationale: 该词基本义为细、薄；在谷穗语境中“细弱”比单说“细”自然，并与“干瘪”共同呈现原文的两个描述词。
- source_word: שְׁדֻפוֹת קָדִים
  choice: 被东风吹焦了
  rationale: 被动分词表示谷穗因炎热干燥的东风而受损；“吹焦”形象、易懂，同时保留东风是致损原因。
- source_word: צֹמְחוֹת אַחֲרֵיהֶם
  choice: 随后又长出
  rationale: 分词描绘谷穗正在长出的梦境画面，אַחֲרֵיהֶם 表明它们在先前七个谷穗之后出现；汉语用“随后又长出”自然表达这一先后关系。
