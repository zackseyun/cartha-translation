base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/020.yaml
  text: And the thin and ugly cows ate up the first seven healthy cows[a].
translation:
  language: zh_hans
  text: 那些瘦弱丑陋的母牛吃掉了先前那七头肥壮的母牛。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “瘦弱丑陋”也可译作“消瘦难看”；“肥壮”也可译作“健康”。
    reason: 说明 הָרַקּוֹת、רָעוֹת 和 בְּרִיאֹת 在体态与外观描写上的可行译法。
lexical_decisions:
- source_word: וַתֹּאכַלְנָה
  choice: 吃掉了
  rationale: 动词 אכל 意为“吃”；在梦境叙述中，“吃掉了”自然表达这些母牛被完全吃下，又不像“吞噬”那样额外增强语气。
- source_word: הַפָּרוֹת
  choice: 母牛
  rationale: 希伯来语名词为阴性复数，在此明确指母牛；译作“母牛”比泛称“牛”更准确。
- source_word: הָרַקּוֹת
  choice: 瘦弱
  rationale: 该词描写牛身体单薄、消瘦的样子；“瘦弱”是现代汉语中清楚自然的表达。
- source_word: וְהָרָעוֹת
  choice: 丑陋
  rationale: רעות 在此描述外观不佳，并非道德上的邪恶；“丑陋”贴合梦中母牛的形貌。
- source_word: אֵת שֶׁבַע הַפָּרוֹת
  choice: 那七头……母牛
  rationale: 将直接宾语结构及数词按自然汉语表达；以“头”作牛的量词。
- source_word: הָרִאשֹׁנוֹת
  choice: 先前
  rationale: 该词表明这是较早出现的第一群母牛；“先前那七头”比机械地说“最初的七头”更符合叙事语序。
- source_word: הַבְּרִיאֹת
  choice: 肥壮
  rationale: 该形容词在此表示身体肥实、强健；“肥壮”既与“瘦弱”形成鲜明对比，也保留古代畜牧语境中的体态含义。
