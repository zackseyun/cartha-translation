  text: 埃及地的七个丰年结束了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּכְלֶינָה
  choice: 结束了
  rationale: 该词源自 כלה，为叙事性连续式、阴性复数，与“年”一致，表达一段时期完全终结；“结束了”简洁自然。
- source_word: שֶׁבַע שְׁנֵי הַשָּׂבָע
  choice: 七个丰年
  rationale: שְׁנֵי 与 הַשָּׂבָע 构成属格结构，指七个物产丰盛的年份；“七个丰年”符合现代汉语，也承接本章语境。
- source_word: אֲשֶׁר הָיָה
  choice: （融入“埃及地的七个丰年”）
  rationale: 希伯来文关系从句说明这些丰年曾发生在埃及地；汉语用领属结构自然表达同一关系，无须生硬译作“曾有的”。
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: 埃及地
  rationale: 明确保留 אֶרֶץ“地、国土”的成分；“埃及地”是庄重而易懂的圣经叙事用语。
