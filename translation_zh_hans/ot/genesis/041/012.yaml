  text: וְ/שָׁ֨ם אִתָּ֜/נוּ נַ֣עַר עִבְרִ֗י עֶ֚בֶד לְ/שַׂ֣ר הַ/טַּבָּחִ֔ים וַ/נְּ֨סַפֶּר ל֔/וֹ וַ/יִּפְתָּר לָ֖/נוּ אֶת חֲלֹמֹתֵ֑י/נוּ אִ֥ישׁ כַּ/חֲלֹמ֖/וֹ פָּתָֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/012.yaml
  text: And there with us was a young Hebrew man[a], a slave of the captain of the guard, and we told him, and he interpreted our dreams for us[c][b]; he interpreted each man's dream according to his dream.
translation:
  language: zh_hans
  text: 当时有一个希伯来青年同我们在一起，是护卫长的奴隶。我们把梦讲给他听，他就为我们解梦；他按各人的梦，分别解释了各人的梦。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译可作：“他按各人的梦为各人解释。”意思是，他分别给出了与每个人的梦相应的解释。
    reason: lexical_alternative
lexical_decisions:
- source_word: נַעַר עִבְרִי
  choice: 一个希伯来青年
  rationale: נַעַר在此指青年男子，并非孩童；“希伯来青年”自然、简洁地保留年龄和族群身份。
- source_word: עֶבֶד
  choice: 奴隶
  rationale: 该词在这里表明约瑟从属于护卫长的受奴役身份；“奴隶”比“仆人”更准确地呈现其法律和社会地位。
- source_word: שַׂר הַטַּבָּחִים
  choice: 护卫长
  rationale: 这是埃及宫廷职衔；字面与屠宰、处决有关，但在本叙事中通常指统领王室护卫或行刑人员的官员。“护卫长”清楚且符合上下文。
- source_word: וַנְּסַפֶּר לוֹ
  choice: 我们把梦讲给他听
  rationale: ספר在此指叙述梦的内容；补出宾语“梦”是由上下文明确许可的汉语表达，使句意自然。
- source_word: וַיִּפְתָּר לָנוּ אֶת חֲלֹמֹתֵינוּ
  choice: 他就为我们解梦
  rationale: פתר用于梦时是解释梦意；“解梦”是现代汉语中准确、自然的对应表达。
- source_word: אִישׁ כַּחֲלֹמוֹ פָּתָר
  choice: 他按各人的梦，分别作了解释
  rationale: 保留希伯来文的分配意味，即每个人所得的解释都对应自己的梦，同时避免汉语中生硬重复“梦”。
