base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/042.yaml
  text: Then Pharaoh removed his signet ring from his hand and put it on Joseph’s hand[c][b][a], and he clothed him in garments of fine linen and put a gold chain around his neck.
translation:
  language: zh_hans
  text: 法老摘下自己手上的印章戒指[a]，给约瑟戴上，又给他穿上细麻布衣服[b]，把金项链[c]挂在他颈上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“戒指”。希伯来语原词可泛指戒指；但在这一王室语境中，很可能指法老的印章戒指，象征授予权柄。
    reason: lexical_alternative
  - marker: b
    text: “细麻”所译的希伯来语 שֵׁשׁ，指与财富和尊荣相关的上等麻布。
    reason: cultural_note
  - marker: c
    text: 或译“金链”或“金领饰”。希伯来语原词所指颈饰的确切样式不能确定。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּסַר
  choice: 摘下
  rationale: 该动词意为移去、取下；用于从手上取下戒指时，“摘下”自然准确。
- source_word: טַבַּעְתּוֹ
  choice: 自己的印章戒指
  rationale: טַבַּעַת本可泛指戒指，但在法老授予行政权柄的语境中，很可能是用于盖印的王室印章戒指；“自己的”清楚表达三单数所属。
- source_word: מֵעַל יָדוֹ
  choice: 从自己手上
  rationale: 按现代汉语空间表达自然转换希伯来语“从他手上方/手上”。
- source_word: וַיִּתֵּן אֹתָהּ עַל יַד יוֹסֵף
  choice: 戴在约瑟手上
  rationale: נתן基本义为“给、放置”，与戒指及“在约瑟手上”连用时表示把戒指置于其手上；汉语用“戴在”最自然，也保留授职动作。
- source_word: וַיַּלְבֵּשׁ אֹתוֹ
  choice: 给他穿上
  rationale: 使役形式表示使约瑟穿着；“给他穿上”兼顾动作性与现代汉语可读性。
- source_word: בִּגְדֵי שֵׁשׁ
  choice: 细麻衣
  rationale: שֵׁשׁ指上等细麻布，具有财富、尊荣和高位的文化含义；“细麻衣”简洁而符合圣经语域。
- source_word: רְבִד הַזָּהָב
  choice: 金项链
  rationale: רְבִד所指颈饰的具体样式不确定，可理解为链子、项链或领饰；正文采用现代汉语最易理解的“金项链”，并以脚注保留不确定性。
- source_word: עַל צַוָּארוֹ
  choice: 戴在他颈上
  rationale: 希伯来语直译为“在他颈上”；结合颈饰，汉语以“戴在他颈上”自然表达其位置和动作。
theological_decisions: []
translation_notes:
  register: 采用庄重、自然的现代标准汉语。“摘下—戴在—穿上—戴在”清楚呈现授职仪式的一连串动作；正文不把印章戒指和颈饰的具体形制说得过死，相关词义范围由脚注说明。
