base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/030.yaml
  text: Then seven years of famine will arise after them[a], and all the abundance in the land of Egypt will be forgotten[b], and the famine will consume the land.
translation:
  language: zh_hans
  text: 在那七年之后，必有七个荒年兴起；埃及地先前的一切丰足[a]都将被遗忘，饥荒也必吞尽[b]这地。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“所有的饱足”。希伯来语指饱足或丰裕，在这里与饥荒相对。
    reason: lexical_alternative
  - marker: b
    text: 或译“毁掉”。这里的动词可表示耗尽或彻底毁坏。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקָמוּ
  choice: 必有……兴起
  rationale: 这里的完成式带连接词，处于约瑟预告未来的语境中，宜译为将来意义；“兴起”保留原文“起来、出现”的意象。
- source_word: שֶׁבַע שְׁנֵי רָעָב
  choice: 七个荒年
  rationale: 这是“七年”与“饥荒”的组合。“七个荒年”符合现代汉语习惯，也准确表达持续七年的饥荒。
- source_word: אַחֲרֵיהֶן
  choice: 在那七年之后
  rationale: 阴性复数代词回指上文丰收的七年；汉语明确补出“七年”，避免“在它们之后”的生硬和含混。
- source_word: וְנִשְׁכַּח
  choice: 都将被遗忘
  rationale: שׁכח 的尼法勒形表达被动意义，指先前的丰足因饥荒严重而不再为人记念。
- source_word: כָּל הַשָּׂבָע
  choice: 先前的一切丰足
  rationale: שָׂבָע 表示饱足、充裕或富足，与饥荒形成鲜明对照；“丰足”保留宽泛含义，不把所指限缩为粮食储备。
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: 埃及地
  rationale: 保留原文正式的地域表达，同时使中文简洁自然。
- source_word: וְכִלָּה
  choice: 必吞尽
  rationale: כלה 的皮勒形在此表示耗尽、毁灭；以饥荒为主语时，“吞尽”既自然又保留彻底消耗的形象。
- source_word: הָרָעָב
  choice: 饥荒
  rationale: 定冠词所指的是本节前半已提到的饥荒；中文无需重复指示词也能保持衔接。
- source_word: אֶת הָאָרֶץ
  choice: 这地
  rationale: אָרֶץ 在此指埃及全地；“这地”自然回指前面的“埃及地”，并保留其整体范围。
