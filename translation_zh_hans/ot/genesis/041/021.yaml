base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/021.yaml
  text: And they went into their bellies[a], but it was not known that they had gone into their bellies, and their appearance was bad, just as at the beginning[b]. Then I awoke.
translation:
  language: zh_hans
  text: 它们进了那些母牛的腹中[a]，却看不出它们已经进了那些母牛的腹中；那些母牛的样子仍然很难看，和起初一样。随后我醒了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “腹中”原文直译为“内部”或“内里”。
    reason: 说明此处按梦境语境作具体化翻译，同时保留原词较宽泛的空间含义。
lexical_decisions:
- source_word: וַתָּבֹאנָה אֶל־קִרְבֶּנָה
  choice: 它们就进了那些母牛的肚腹
  rationale: בוא表示进入，קֶרֶב本指内部或里面；在母牛吞吃母牛的梦境中，译作“肚腹”能自然、具体地呈现画面。“那些母牛”帮助现代汉语读者辨明肚腹属于先前所说瘦弱丑陋的母牛，同时保留主语“它们”与上文的衔接。
- source_word: וְלֹא נוֹדַע כִּי בָאוּ אֶל־קִרְבֶּנָה
  choice: 却看不出它们已经进了肚腹
  rationale: נוֹדַע为ידע的尼法勒式，语境重点是这件事从外表无法察觉；“看不出”比直译“无人知道”更切合梦中母牛外观未变的情景。“已经”表达此前进入所形成的状态。
- source_word: וּמַרְאֵיהֶן רַע
  choice: 那些母牛的样子仍旧很难看
  rationale: מַרְאֶה指可见的外貌，רַע在此形容外观不佳。“难看”保留其宽泛程度，不将含义限定为“丑陋”或“消瘦”；“仍旧”与随后“和起初一样”的比较自然衔接。
- source_word: כַּאֲשֶׁר בַּתְּחִלָּה
  choice: 和起初一样
  rationale: 准确表达吞吃之后的外貌与最初出现时相同，符合现代汉语表达。
- source_word: וָאִיקָץ
  choice: 随后我醒了
  rationale: 该叙事式动词结束梦的叙述；“随后”自然呈现事件次序，不额外赋予因果意义。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。通过“它们”承接上文被吞下的肥壮母牛，并以“那些母牛”指吞吃它们的母牛，避免汉语中产生进入自身肚腹的误解。保留原文对“进入肚腹”的重复及外貌未变所形成的梦境张力。
