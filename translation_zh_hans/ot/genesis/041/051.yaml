base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/051.yaml
  text: Joseph called the name of the firstborn Manasseh[a], for he said[c][b], “God has made me forget all my hardship and all my father’s house.”
translation:
  language: zh_hans
  text: 约瑟给长子起名叫玛拿西[a]，因为他说：“上帝使我忘记了我的一切苦难[b]和我父亲的全家[c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “玛拿西”在希伯来语中的读音与下文“使我忘记”一词相近。
    reason: lexical_alternative
  - marker: b
    text: “苦难”也可译作“劳苦”或“患难”。
    reason: lexical_alternative
  - marker: c
    text: “父亲的全家”是希伯来语表达，可指父亲的家族或家庭。
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּקְרָא יוֹסֵף אֶת שֵׁם הַבְּכוֹר
  choice: 约瑟给长子起名叫
  rationale: קרא שׁם在此表示“起名、命名”。中文采用自然的“给……起名叫”，并保留“长子”这一明确且具有叙事意义的信息。
- source_word: מְנַשֶּׁה
  choice: 玛拿西
  rationale: 采用现代中文圣经人名的通行音译；其与下文“使我忘了”的希伯来语文字呼应由脚注说明。
- source_word: כִּי
  choice: 因为他说
  rationale: כִּי引出起名的缘由。原文未明说“他说”，但后文是约瑟对名字的解释；补出“他说”使现代汉语句法清楚，同时不改变内容。
- source_word: נַשַּׁנִי אֱלֹהִים
  choice: 上帝使我忘了
  rationale: נַשַּׁנִי在此具有使役含义，即“使我忘记”；אֱלֹהִים按上下文作单数“上帝”。
- source_word: כָּל עֲמָלִי
  choice: 我一切的苦难
  rationale: עָמָל可指劳苦、患难或困苦；结合约瑟此前的经历，“苦难”自然概括其所受的艰难，同时以脚注保留其他可能译法。
- source_word: כָּל בֵּית אָבִי
  choice: 我父亲的全家
  rationale: “父家”是希伯来语亲属与家庭单位的表达。“我父亲的全家”在现代汉语中自然，并保留约瑟声称忘却父家所形成的叙事张力。
theological_decisions:
- issue: 约瑟说上帝使他忘记“父亲的全家”可能产生的含义
  choice: 按原文直接译出“上帝使我忘了……我父亲的全家”
  alternative: 解释为“上帝使我忘了与父家有关的痛苦”，或视为夸张地表示痛苦已消退
  rationale: 希伯来文直接把“一切的苦难”和“父亲的全家”并列为“忘了”的宾语。译文不以释义淡化或调和这一张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。正文用“给长子起名叫”保持汉语自然度；不在正文中解释名字的双关，也不弱化“忘了父亲的全家”所包含的张力。
