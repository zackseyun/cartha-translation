base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/049.yaml
  text: And Yoseph stored up grain[a], like the sand of the sea, in very great abundance, until he stopped counting[c][b], because there was no number.
translation:
  language: zh_hans
  text: 约瑟积蓄了极多的粮食，如同海边的沙；他停止计数，因为数目多得不可计量。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּצְבֹּר
  choice: 积蓄
  rationale: צבר表示把东西聚积、储存起来；结合约瑟在丰年收储粮食的行政背景，“积蓄”既保留累积之意，也符合现代汉语表达。
- source_word: יוֹסֵף
  choice: 约瑟
  rationale: 采用现代中文圣经及一般汉语中通行的人名形式，清楚对应希伯来名 יוֹסֵף。
- source_word: בָּר
  choice: 粮食
  rationale: 此处泛指谷物粮食，并非特指小麦；“粮食”在上下文中自然且不会不必要地缩窄词义。
- source_word: כְּחוֹל הַיָּם
  choice: 如同海里的沙
  rationale: 保留希伯来文以海沙比喻数量浩大的形象；“海里的沙”也直接反映 הַיָּם 的表达。
- source_word: הַרְבֵּה מְאֹד
  choice: 极多
  rationale: 用简洁自然的现代汉语表达双重强化的数量意义，同时不削弱前后比喻的力度。
- source_word: עַד כִּי
  choice: 直到
  rationale: 表达积蓄达到某一结果或界限，与原文结构相符。
- source_word: חָדַל לִסְפֹּר
  choice: 他停止计数
  rationale: 单数动词最自然地承接约瑟；“停止计数”准确表达不再继续清点的意思。
- source_word: כִּי אֵין מִסְפָּר
  choice: 因为已经无法计数
  rationale: 这是对希伯来习语“因为没有数目”的自然汉语表达，说明停止计数的原因，同时保留数量超出可计范围的含义。
