  yaml_path: translation/ot/genesis/041/029.yaml
  text: Look[b][a], seven years of great abundance are coming throughout all the land of Egypt.
translation:
  language: zh_hans
  text: 看哪，七个大丰年将临到埃及全地。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“看哪，七个年头将要来到——埃及全地必大大丰收。”
    reason: 原文也可按并列或解释性结构理解，使“大丰收”成为对这七年期间埃及全地景况的说明，而非直接修饰“年”。
lexical_decisions:
- source_word: הִנֵּה
  choice: 看哪
  rationale: 这是引人注意的提示语；“看哪”既保留原文的指示与强调作用，也符合庄重而易懂的现代中文表达。
- source_word: שֶׁבַע שָׁנִים
  choice: 七个……年
  rationale: 直接保留原文的数目和时间单位，并与下文“丰”组合成自然的中文表达“大丰年”。
- source_word: בָּאוֹת
  choice: 将临到
  rationale: 原词是阴性复数分词，与“年”呼应，描绘这些年正在来临；“将临到”兼顾其未来指向和动态感。
- source_word: שָׂבָע גָּדוֹל
  choice: 大丰年
  rationale: שָׂבָע在本段语境中指粮食、出产丰足，גָּדוֹל加强其程度；“大丰年”在中文中简洁自然，准确表达出产极其丰盛的年份。
- source_word: בְּכָל אֶרֶץ מִצְרָיִם
  choice: 埃及全地
  rationale: 表达丰收所遍及的整个埃及地域；放在“临到”之后符合自然中文语序。
