base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/019.yaml
  text: And behold[a], seven other cows came up after them, poor and very ugly in appearance and thin in flesh[b]. I had not seen any like them in all the land of Egypt for ugliness.
translation:
  language: zh_hans
  text: “看哪，在那些母牛之后，又有七头别的母牛上来；它们瘦弱，样子极其丑陋，瘦得没有多少肉。我在埃及全地从未见过像它们这样丑陋的[a]母牛。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “丑陋”或译“糟糕”“凄惨”；希伯来语此处概括这些母牛的外貌和身体状况极其糟糕，令人未曾见过。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留希伯来语引人注意、使梦境叙述更鲜明的话语标记；现代读者可以理解，也符合庄重的叙事语体。
- source_word: שֶׁבַע פָּרוֹת אֲחֵרוֹת
  choice: 又有七头母牛
  rationale: פָּרוֹת明确指雌性牛；“又有”自然表达另一组七头牛的出现。
- source_word: עֹלוֹת אַחֲרֵיהֶן
  choice: 随后……上来
  rationale: 准确表达这些母牛跟在前一组之后上来的次序和动作，同时避免生硬直译分词。
- source_word: דַּלּוֹת
  choice: 孱弱
  rationale: 该词表示衰弱、可怜的状态；“孱弱”与后文身体无肉相呼应，但不把两个描述完全合并。
- source_word: וְרָעוֹת תֹּאַר מְאֹד
  choice: 样子极其丑陋
  rationale: רָעוֹת在תֹּאַר（形貌、外观）的限定下指外表难看，并非道德上的邪恶。
- source_word: וְרַקּוֹת בָּשָׂר
  choice: 身上也没有什么肉
  rationale: 自然表达“肉体单薄、缺少肉”的消瘦状态，不增添原文没有的“皮包骨头”等具体形象。
- source_word: לֹא רָאִיתִי כָהֵנָּה בְּכָל אֶרֶץ מִצְרַיִם
  choice: 我在埃及全地从未见过像它们这样
  rationale: 自然传达法老回顾梦境时所说的、在全埃及都未见其同类的强烈比较。
- source_word: לָרֹעַ
  choice: 不堪
  rationale: 原词对这些牛糟糕的外貌和凄惨的身体状况作总体评价；“不堪”比“邪恶”准确，也比只说“丑陋”更能保留其宽泛含义。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“看哪”保留经文鲜明的梦境报告语气；其余措辞尽量自然，避免重复使用“瘦”，同时保留原文依次描述孱弱、外貌丑陋和肉体单薄的层次。
