review_pass:
  verdict: revise
  source_fidelity: 原译基本忠实地保留了七头母牛、衰弱、外貌极丑、肉体消瘦，以及在埃及全地未见同类的夸张比较。可是“随后”虽可表达次序，未明确译出“在它们之后”；末尾“不堪”范围较宽，在此紧接外貌与肉体描述的语境中，以“丑陋”更明确、自然，也更贴近לָרֹעַ在本句的评价焦点。
  naturalness: 整体庄重通顺。“身上也没有什么肉”可理解，但稍偏口语且弱化了“瘦肉/肉体单薄”的描述；改为“身上也很瘦”虽自然但较泛。采用“瘦得没有多少肉”可保留原文的身体消瘦意象，且符合现代汉语。
  terminology: “母牛”“埃及全地”准确。“孱弱”可用，但“瘦弱”更常用，且能传达דַּלּוֹת所指的羸弱、憔悴状态；仍须与后面的“瘦得没有多少肉”有所区分。末尾的“丑陋”不涉及道德意义，符合语境。
  issues:
