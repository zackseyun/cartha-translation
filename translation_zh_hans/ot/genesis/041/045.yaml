base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/045.yaml
  text: And Pharaoh called Joseph’s name Zaphenath-paneah[a], and he gave him Asenath, the daughter of Potiphera, the priest of On, as a wife[d][c][b]. And Joseph went out over the land of Egypt.
translation:
  language: zh_hans
  text: 法老给约瑟起名叫撒发那忒·巴内亚[a]，又把安城的祭司波提非拉的女儿亚西纳给他为妻。约瑟便在埃及全地出行[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这个埃及名字的含义不能确定；也可音译作“撒发那忒·帕内亚”等。
    reason: lexical_alternative
  - marker: b
    text: 或译：“约瑟便出去，走遍埃及地。”原文的介词可表示在埃及地上、遍及埃及地，或与其新获的职权有关。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקְרָא פַרְעֹה שֵׁם יוֹסֵף
  choice: 法老给约瑟起名叫
  rationale: קרא与“名”连用表示命名。中文用“给……起名叫”自然、清楚，也保留正式命名的动作。
- source_word: צָפְנַת פַּעְנֵחַ
  choice: 撒发那忒·巴内亚
  rationale: 这是词源和含义均不确定的埃及名字，按希伯来文本的两部分形式音译，不在正文中臆测其含义。
- source_word: וַיִּתֶּן לוֹ אֶת אָסְנַת ... לְאִשָּׁה
  choice: 又把……亚西纳给他为妻
  rationale: 准确表达נתן及לְאִשָּׁה所指的婚姻安排，并采用庄重而自然的现代汉语。
- source_word: בַּת פּוֹטִי פֶרַע כֹּהֵן אֹן
  choice: 安城祭司波提非拉的女儿
  rationale: 希伯来语中“安城祭司”与“波提非拉”构成同位关系；中文前置身份修饰语可明确表达亚西纳是波提非拉的女儿。
- source_word: וַיֵּצֵא יוֹסֵף עַל אֶרֶץ מִצְרָיִם
  choice: 约瑟便巡视埃及全境
  rationale: יצא基本义为“出去”，但在本段授职语境中，עַל אֶרֶץ מִצְרַיִם描述约瑟在埃及境内履行职权的行动。“巡视”以自然中文兼顾出行及管理语境；“全境”表达遍及埃及之意。
theological_decisions:
- issue: 约瑟在埃及地行动的具体性质
  choice: 巡视埃及全境
  alternative: 走遍埃及地／出行在埃及地上
  rationale: 原文עַל可表示在地域之上、遍及或与管辖相关，语义有一定张力。结合刚获任命的上下文，“巡视”较自然，但不将其扩展成更具体的行政行为；脚注保留较直译的可能。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。埃及人名和地名依汉语圣经传统作适度音译；“安城”保留希伯来文本的地名形式。所有不确定信息均置于脚注，不在正文中强行确定。
