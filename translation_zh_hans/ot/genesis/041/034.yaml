  text: יַעֲשֶׂ֣ה פַרְעֹ֔ה וְ/יַפְקֵ֥ד פְּקִדִ֖ים עַל הָ/אָ֑רֶץ וְ/חִמֵּשׁ֙ אֶת אֶ֣רֶץ מִצְרַ֔יִם בְּ/שֶׁ֖בַע שְׁנֵ֥י הַ/שָּׂבָֽע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/034.yaml
  text: 'Let Pharaoh do this: let him appoint overseers over the land and take a fifth of the produce of the land of Egypt during the seven years of abundance[a].'
translation:
  language: zh_hans
  text: 法老应当这样做：委派官员管理全国，在七个丰年期间征收埃及地出产的五分之一。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“从埃及地收取五分之一。”希伯来语动词可理解为在丰年期间征收或收取五分之一。
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעֲשֶׂה
  choice: 法老应当这样做
  rationale: עָשָׂה含义宽泛；此处约瑟正在提出建议，用“应当这样做”自然表达劝告语气，并从上下文补出隐含的“这样”。
- source_word: וְיַפְקֵד
  choice: 委派
  rationale: פקד的使役式在这里指任命人员承担职责；“委派”既体现任命，也符合行政语境。
- source_word: פְּקִדִים
  choice: 官员
  rationale: 该名词指受任命执行公务的人。“官员”在现代汉语中清楚自然，也避免把其职责过度限定为单纯监督。
- source_word: עַל הָאָרֶץ
  choice: 管理全国
  rationale: עַל表示这些官员对全地负有行政职责；此处הָאָרֶץ指法老治下的埃及国土。“管理全国”比直译“在地之上”更自然。
- source_word: וְחִמֵּשׁ
  choice: 征收……五分之一
  rationale: חמשׁ的Piel式在此最可能指抽取或征收五分之一；“征收”切合国家储粮的行政背景。该词也可能较笼统地表示“收取五分之一”，故以脚注保留。
- source_word: אֶת אֶרֶץ מִצְרַיִם
  choice: 埃及地出产的
  rationale: 原文以“埃及地”为直接宾语，但结合丰年储粮的上下文，实际所取的是土地出产而非土地本身；补出“出产”使汉语明确而不改变所指。
- source_word: בְּשֶׁבַע שְׁנֵי הַשָּׂבָע
  choice: 在七个丰年期间
  rationale: שָׂבָע本义为饱足、丰足，在本叙事中指收成丰富的年份；“丰年”简洁、自然，并与后文荒年形成对照。
theological_decisions: []
