base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/016.yaml
  text: Joseph answered Pharaoh[a], saying, “It is not in me[b]; God will answer for Pharaoh’s well-being.”
translation:
  language: zh_hans
  text: 约瑟回答法老说：“这不在于我[a]；神必给法老一个关乎他福祉的答复[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不是我。”原文表达答案或解梦的能力并不出于约瑟本人。
    reason: lexical_alternative
  - marker: b
    text: “福祉”原文也可译为“平安”“安康”或“安好”，可指法老的福祉或有利的结果；整句也可译作：“神必给法老一个平安的答复。”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן
  choice: 回答
  rationale: 这是叙事中引出回应的常用动词；译作“回答”直接保留约瑟对法老话语作出回应的语境。
- source_word: יוֹסֵף
  choice: 约瑟
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: אֶת־פַּרְעֹה
  choice: 法老
  rationale: אֶת标示直接宾语；中文用“回答法老”即可自然表达。
- source_word: לֵאמֹר
  choice: 说
  rationale: 保留希伯来语常见的引语公式，同时符合中文叙事习惯。
- source_word: בִּלְעָדָי
  choice: 这不在于我
  rationale: 该词表达“在我以外、与我无关”的排除含义；此译法自然地表明答案或解梦能力不出于约瑟本人，又不额外补入原文未明说的宾语。
- source_word: אֱלֹהִים
  choice: 神
  rationale: 此处动词为单数，语境指约瑟所承认的神；“神”是现代中文庄重而通行的译法。
- source_word: יַעֲנֶה
  choice: 必给……答复
  rationale: 基本义为“回答”。因其与后面的שְׁלוֹם构成较难直译的搭配，中文略作展开为“给……答复”，既清楚自然，也保留回应的核心语义；“必”表达未完成式在此语境中的将来确信。
- source_word: שְׁלוֹם פַּרְעֹה
  choice: 给法老一个关乎安好的答复
  rationale: שָׁלוֹם可指平安、安康、福祉或有利的结果。译作“关乎安好”保留其较宽的语义范围，也避免断定答复本身必然吉利。
theological_decisions:
- issue: 解梦答案的来源
  choice: 约瑟否认答案在于自己，并明确把答复归于神。
  alternative: 可简译为“不是我”，强调约瑟本人并非作答者。
  rationale: בִּלְעָדָי与随后“神必……”形成鲜明对比。译文保留这一神学张力，但不补充关于启示或能力机制的教义解释。
- issue: 神所给答复与法老福祉的关系
  choice: 译为“关乎安好的答复”，不明确断定是保证法老获得有利结局。
  alternative: “给法老一个吉祥的答复”或“回答法老平安的话”。
  rationale: שָׁלוֹם既可能描述答复的有利性质，也可能指答复所关乎的法老福祉；正文与脚注保留这一语义弹性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“这不在于我”简洁保留约瑟的否认；“关乎安好的答复”虽略带书面色彩，但能承载原文שָׁלוֹם的多义性，避免把它过早收窄为单纯的“吉祥”或“好消息”。
