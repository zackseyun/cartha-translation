  text: וַ/יֹּ֥אמֶר פַּרְעֹ֖ה אֶל עֲבָדָ֑י/ו הֲ/נִמְצָ֣א כָ/זֶ֔ה אִ֕ישׁ אֲשֶׁ֛ר ר֥וּחַ אֱלֹהִ֖ים בּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/038.yaml
  text: Then Pharaoh said to his servants[a], “Can we find a man like this[b], in whom is the spirit of God?”
translation:
  language: zh_hans
  text: 法老对臣仆说：“我们还能找到像这样、里面有上帝的灵[a]的人吗？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “上帝的灵”也可理解为“神的灵”、“从上帝而来的灵”或“神圣的灵”。希伯来语短语 רוּחַ אֱלֹהִים 在这里可以有不止一种理解。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 未将叙事推进词 וַ 单独译为“于是”，因为中文上下文可自然承接；“说”准确表达主句动作。
- source_word: עֲבָדָיו
  choice: 臣仆
  rationale: 该词本义为“仆人”，在王宫语境中也指臣属、官员；“臣仆”兼顾字面意义与宫廷身份。
- source_word: הֲנִמְצָא
  choice: 我们还能找得到吗
  rationale: 疑问词与第一人称复数未完成式构成反问；“还能找得到吗”自然表达难以另觅其人的语气。
- source_word: כָזֶה אִישׁ
  choice: 像这样的人
  rationale: 保留 כָזֶה 的指示和比较意味，并以现代汉语自然表达所指的约瑟。
- source_word: אֲשֶׁר ... בּוֹ
  choice: 有……在他里面
  rationale: 保留 בּוֹ 的内在、居于其中的意象，同时避免生硬的“在他里面有……”。
- source_word: רוּחַ אֱלֹהִים
  choice: 上帝的灵
  rationale: 构词关系直接译作“上帝的灵”；中文不以冠词或大小写区分特指，因此不强行判定其在法老话语中是特指、泛指还是描述性的“神灵”。
theological_decisions:
- issue: רוּחַ אֱלֹהִים 是特指上帝的灵，还是泛指神所赐的灵或神灵
  choice: 上帝的灵
  alternative: 神灵；从上帝而来的灵；神圣的灵
  rationale: “上帝的灵”最直接对应希伯来语构词，也符合本叙事将约瑟的智慧归于上帝的背景；脚注说明该短语在法老口中仍可能有较宽泛的理解，以保存原文含混性。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“臣仆”贴合王宫场景；反问句保持法老赞叹约瑟独特禀赋的语气。脚注标记置于整句引语之后，所说明的是句中的“上帝的灵”。
