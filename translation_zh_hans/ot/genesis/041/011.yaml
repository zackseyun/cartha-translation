  yaml_path: translation/ot/genesis/041/011.yaml
  text: And we dreamed a dream in one night[a], I and he; each man dreamed according to the interpretation of his dream.
translation:
  language: zh_hans
  text: 同一夜里，我和他都做了梦[a]；我们各人所做的梦，都与各自梦的解释相符。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“在同一夜里，我和他做了一个梦；我们各人都是按自己梦的解释做了梦。”
    reason: 原文以“做梦”动词及同源名词重复表达，并在后半句以复数动词完成分配式结构；正文按现代汉语语序表达。
lexical_decisions:
- source_word: וַנַּחַלְמָה חֲלוֹם
  choice: 都做了梦
  rationale: 希伯来语以同源动词和名词表达“做梦”；现代汉语用“做了梦”自然传达其意义，“都”与随后明确列出的两个人相呼应。
- source_word: בְּלַיְלָה אֶחָד
  choice: 同一夜里
  rationale: 字面为“在一个夜里”，语境强调两人的梦发生于同一夜；“同一夜里”在现代汉语中清楚自然。
- source_word: אֲנִי וָהוּא
  choice: 我和他
  rationale: 保留原文参与者的次序与明确强调。
- source_word: אִישׁ
  choice: 各人
  rationale: אִישׁ在此作分配用法，表示两人各自的情形；“各人”准确且自然。
- source_word: כְּפִתְרוֹן חֲלֹמוֹ
  choice: 与各自梦的解释相符
  rationale: 介词כְּ表示对应或相符关系；第三人称单数后缀按分配意义指各人自己的梦。此译法保留梦与其解释之间的对应关系。
- source_word: חָלָמְנוּ
  choice: 所做的梦
  rationale: 原文末尾再次使用“做梦”动词以完成分配结构；汉语通过“各人所做的梦”自然重组句法，同时保留复数主体和各自对应的含义。
