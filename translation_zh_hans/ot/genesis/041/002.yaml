base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/002.yaml
  text: And behold[a], seven cows were coming up from the Nile, beautiful in appearance and fat in flesh[c][b], and they were grazing in the reed grass.
translation:
  language: zh_hans
  text: 看哪，有七头母牛从尼罗河[a]里上来，外形俊美，膘肥体壮，在沼泽的草丛[b]中吃草。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“河”；在埃及背景中，这个希伯来词通常特指尼罗河。
    reason: lexical_alternative
  - marker: b
    text: 或译“在芦苇丛中”或“在沼泽草地上”。原词指河边湿地的草木。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留梦境叙事中引人注意、使画面顿现眼前的标记；用语庄重且为现代读者所能理解。
- source_word: הַיְאֹר
  choice: 尼罗河
  rationale: יְאֹר本义可指河流或水道，但在本节的埃及背景中具体指尼罗河；正文明确所指，脚注保留较字面的译法。
- source_word: עֹלֹת
  choice: 上来
  rationale: 分词描绘母牛正从河中上来的动态画面；汉语“上来”自然地保留了动作方向和进行中的场景感。
- source_word: פָּרוֹת
  choice: 母牛
  rationale: 该名词是阴性复数，明确指母牛；比泛称“牛”更准确，也不额外限定其年龄。
- source_word: יְפוֹת מַרְאֶה
  choice: 外形俊美
  rationale: 直陈这些母牛在外观上美好悦目，既保留מַרְאֶה“外观、样貌”的成分，也符合现代汉语表达。
- source_word: וּבְרִיאֹת בָּשָׂר
  choice: 膘肥体壮
  rationale: 短语强调肉体丰满肥硕；“膘肥体壮”是描述牲畜的自然汉语，避免把意思弱化为笼统的“健康”。
- source_word: וַתִּרְעֶינָה
  choice: 吃草
  rationale: 该动词在此指牲畜放牧、啃食草木；“吃草”简明自然，并准确呈现画面。
- source_word: בָּאָחוּ
  choice: 在沼泽的草丛中
  rationale: אָחוּ指河边湿地或沼泽中的草木，而非普通草地；此译保留湿地环境，同时避免把植物种类过度限定为芦苇。
theological_decisions: []
