  yaml_path: translation/ot/genesis/041/047.yaml
  text: During the seven years of abundance[a], the land produced by handfuls.
translation:
  language: zh_hans
  text: 在七个丰年里，土地出产的粮食多得成把成把的[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文用“把”或“捧”这一数量词描写土地的出产丰盛；也可译为“土地出产极其丰盛”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעַשׂ
  choice: 出产
  rationale: עשה本义为“做、制造”；以“土地”为主语并处于农耕语境时，指土地有所出产。译作“出产”符合现代汉语表达。
- source_word: הָאָרֶץ
  choice: 土地
  rationale: 这里指埃及可耕种并产生收成的土地，不是整个世界；“土地”既准确又能保留原文以地为主语的表达。
- source_word: בְּשֶׁבַע שְׁנֵי הַשָּׂבָע
  choice: 在七个丰年里
  rationale: שׂבע表示饱足、丰盛；结合约瑟故事中先前预告的七年，译作“丰年”简洁自然。
- source_word: לִקְמָצִים
  choice: 成把成把地
  rationale: קְמָץ指一把或一捧之量，前置的ל使该词组具有状语作用。“成把成把地”保留原文具体而不寻常的丰产意象，避免直接改写成抽象的“极其丰盛”。
