review_pass:
  verdict: revise
  source_fidelity: 草稿准确传达了七头母牛从尼罗河上来、外貌难看且消瘦，并站在前一组母牛旁、位于河岸的画面。“跟在它们后面”在汉语中较强地表示空间上尾随；此处结合叙事次序，更宜明确为“随后”，以反映אַחֲרֵיהֶן的顺序意义，且不人为强化空间关系。
  naturalness: 整体庄重通顺。“随后又有七头别的母牛”比“又有七头母牛跟在它们后面”更自然清晰。“身形瘦削”较准确地表达“肉身消瘦”，避免“身体瘦弱”可能附带体力虚弱的含义。
  terminology: “母牛”“尼罗河”“河岸”均准确且符合现代普通话。“别的”清楚保留“另外/不同的”这一限定。无需脚注：尼罗河及外貌、消瘦的描述在正文中已得到充分表达。
