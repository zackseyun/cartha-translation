revisions:
- from: 看哪，又有七头母牛跟在它们后面从尼罗河里上来，样子丑陋，身体瘦弱；它们站在先前那些母牛旁边，就在尼罗河岸上。
  to: 看哪，随后又有七头别的母牛从尼罗河里上来，样子丑陋，身形瘦削；它们站在那些母牛旁边，在尼罗河岸上。
  rationale: 修订仅澄清第二组母牛是在前一组之后出现，并以更贴近原文形体描写的现代汉语替换可能含有额外意味的措辞。保留“看哪”的叙事提示、“母牛”的阴性指称，以及“尼罗河岸”的明确地点。
