  text: וְ/הִנֵּ֞ה שֶׁ֧בַע פָּר֣וֹת אֲחֵר֗וֹת עֹל֤וֹת אַחֲרֵי/הֶן֙ מִן הַ/יְאֹ֔ר רָע֥וֹת מַרְאֶ֖ה וְ/דַקּ֣וֹת בָּשָׂ֑ר וַֽ/תַּעֲמֹ֛דְנָה אֵ֥צֶל הַ/פָּר֖וֹת עַל שְׂפַ֥ת הַ/יְאֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/003.yaml
  text: And behold[a], seven other cows came up after them from the Nile, ugly in appearance and thin in flesh[b], and they stood beside the cows on the bank of the Nile.
translation:
  language: zh_hans
  text: 看哪，随后又有七头别的母牛从尼罗河里上来，样子丑陋，身形瘦削；它们站在那些母牛旁边，在尼罗河岸上。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留希伯来叙事中提示突然出现之景象的指示和强调作用；“看哪”庄重而易懂。
- source_word: פָּרוֹת
  choice: 母牛
  rationale: 原文为阴性复数，明确指母牛，而非泛指牛群。
- source_word: אֲחֵרוֹת
  choice: 又有……（另）
  rationale: 表达这是不同于先前七头母牛的第二组；汉语用“又有”能自然体现递进出现。
- source_word: עֹלוֹת אַחֲרֵיהֶן
  choice: 跟在它们后面……上来
  rationale: 兼顾分词所呈现的梦中动态画面以及 אַחֲרֵיהֶן 可含空间或次序上的“在后面”。
- source_word: הַיְאֹר
  choice: 尼罗河
  rationale: 在埃及语境中该词特指尼罗河，直接译出所指对象最为清楚。
- source_word: רָעוֹת מַרְאֶה
  choice: 样子丑陋
  rationale: 此处 רָעוֹת 描写外貌难看，并无道德上的“邪恶”之意；该译法自然准确。
- source_word: דַקּוֹת בָּשָׂר
  choice: 身体瘦弱
  rationale: 保留肉体消瘦的具体含义，同时避免生硬的“肉体单薄”。
- source_word: וַתַּעֲמֹדְנָה
  choice: 它们站在
  rationale: 按普通叙事动词直译，清楚简洁。
- source_word: אֵצֶל
  choice: 旁边
  rationale: 准确表达近旁的位置关系。
- source_word: שְׂפַת הַיְאֹר
  choice: 尼罗河岸上
  rationale: שָׂפָה 字面可指“边缘、唇”，用于河流时自然译为“河岸”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“先前那些母牛”明确原文定冠词所指的是上一节出现的七头母牛，并避免汉语中连续两个“它们”造成指代含混。未设置脚注，因为“尼罗河”“样子丑陋，身体瘦弱”已能在正文中充分传达原文，无需另列不会实质影响理解的直译形式。
