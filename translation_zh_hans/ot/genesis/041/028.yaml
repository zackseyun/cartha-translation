  yaml_path: translation/ot/genesis/041/028.yaml
  text: 'This is the matter that I spoke to Pharaoh: what God is doing he has shown to Pharaoh[a].'
translation:
  language: zh_hans
  text: 这就是我对法老所说的事：上帝将要做的事，他已经向法老显明了[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“上帝正在做的。”希伯来语分词可以表示正在进行或即将发生的行动；在这里的解梦语境中，“将要做”更能表达将临之事。
    reason: lexical_alternative
lexical_decisions:
- source_word: הוּא הַדָּבָר
  choice: 这就是……的事
  rationale: 将希伯来语的指认句自然译为现代汉语，同时保留“事、事情”这一语义。
- source_word: אֲשֶׁר דִּבַּרְתִּי אֶל־פַּרְעֹה
  choice: 我对法老所说的
  rationale: 按关系从句译出，并用“对法老说”表达自然的汉语搭配。
- source_word: הָאֱלֹהִים
  choice: 上帝
  rationale: 此处指独一的神；“上帝”是现代汉语圣经语体中自然、庄重且易懂的称呼。
- source_word: עֹשֶׂה
  choice: 将要做的
  rationale: 该分词本身可表示正在进行或临近发生的行动；在预示未来丰年和荒年的解梦语境中，“将要做”最贴合其时态意义。
- source_word: הֶרְאָה אֶת־פַּרְעֹה
  choice: 他已经指示法老了
  rationale: 使役词形意为“使看见、显示”；“指示”兼顾启示梦中未来之事的语境及现代汉语的自然表达。
theological_decisions:
- issue: 约瑟话语中 הָאֱלֹהִים 的译法
  choice: 上帝
  alternative: 神
  rationale: 两者均可指经文中的独一神；正文采用“上帝”，不额外引入宗派性解释。
- issue: עֹשֶׂה 所表达行动的时间
  choice: 将要做
  alternative: 正在做
  rationale: 保留分词在时间上的弹性，并依据上下文将正文译作未来临近的行动；脚注明示另一种可能，避免抹平原文的含混性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“这就是……”清楚承接上一节；保留原文后半句先说内容、再说上帝已经向法老显示的结构。
