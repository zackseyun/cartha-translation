  yaml_path: translation/ot/genesis/041/031.yaml
  text: And the abundance in the land will not be known because of that famine afterward[b][a], for it will be very severe.
translation:
  language: zh_hans
  text: 境内的丰收将不再为人所知[a]，因为随后的那场饥荒极其严重。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“从前的丰收将再也察觉不到。”希伯来语动词可表示被知道、被认出或被察觉。
    reason: lexical_alternative
lexical_decisions:
- source_word: יִוָּדַע
  choice: 不再为人所知
  rationale: 该词是ידע的未完成式Nifal，表达被知道、被察觉或被认出的意思。这里指先前的丰收会因随后的饥荒而仿佛无人记得；译文保留“被知道”的基本语义，并用“不再”自然表达语境中的未来结果。
- source_word: הַשָּׂבָע
  choice: 丰收
  rationale: 该名词本义为丰足、充裕；在本章农业收成的语境中，“丰收”比抽象的“丰足”更自然明确。
- source_word: בָּאָרֶץ
  choice: 境内
  rationale: 此处指受法老统治并遭遇饥荒的地域，即埃及境内，而非普世意义的“大地”；“境内”简洁保留其区域含义。
- source_word: מִפְּנֵי
  choice: 一来
  rationale: 该介词在这里表示原因。将它与“后来那场饥荒”合译为“一来”，自然表达“由于那场后来的饥荒”，同时保持因果关系。
- source_word: הָרָעָב הַהוּא אַחֲרֵי כֵן
  choice: 后来那场饥荒
  rationale: “后来”表达אַחֲרֵי כֵן的时间次序，“那场”保留הַהוּא的指示意味，符合现代汉语语序。
- source_word: כִּי כָבֵד הוּא מְאֹד
  choice: 因为这饥荒极其严重
  rationale: כָבֵד字面为“沉重”，形容饥荒时表示严重、严酷；“极其严重”准确传达מְאֹד所加强的程度。
