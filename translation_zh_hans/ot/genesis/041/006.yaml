  naturalness: “看哪，又有七个细弱、被东风吹焦的穗子，在它们后面长出来”在现代标准汉语中通顺自然，也保有叙事的庄重感。“看哪”虽略具书面色彩，却适合保留梦境叙述中וְהִנֵּה的突显作用。
