  text: וְ/הִנֵּה֙ שֶׁ֣בַע שִׁבֳּלִ֔ים דַּקּ֖וֹת וּ/שְׁדוּפֹ֣ת קָדִ֑ים צֹמְח֖וֹת אַחֲרֵי/הֶֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/006.yaml
  text: And behold[a], seven thin ears of grain, scorched by the east wind, were sprouting up after them.
translation:
  language: zh_hans
  text: 看哪，又有七个细弱、被东风吹焦[a]的穗子，在它们后面长出来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“被东风吹枯”。
    reason: שְׁדוּפֹת的具体效果可理解为被热风吹焦、吹枯或摧残；脚注保留这一词义幅度。
lexical_decisions:
- source_word: וְהִנֵּה
  choice: 看哪，又有
  rationale: 保留希伯来叙事中突然引出新梦象的提示语；“又有”自然衔接上文出现的七个穗子。
- source_word: שֶׁבַע שִׁבֳּלִים
  choice: 七个……穗子
  rationale: שִׁבֳּלִים泛指谷物的穗；译作“穗子”避免无根据地限定为小麦或其他特定谷物。
- source_word: דַּקּוֹת
  choice: 细弱
  rationale: 既表达穗子外形细瘦，也传达其长势不良；比单用“细”更符合此处与丰满穗子的对比。
- source_word: וּשְׁדוּפֹת קָדִים
  choice: 被东风吹焦
  rationale: שְׁדוּפֹת表示受到摧残、灼伤或吹枯，קָדִים指当地炎热而具破坏力的东风；“吹焦”简洁呈现其结果，同时以脚注保留另一自然译法。
- source_word: צֹמְחוֹת
  choice: 长出来
  rationale: 以动态表达分词所描绘的生长过程，符合现代汉语梦境叙述。
- source_word: אַחֲרֵיהֶן
  choice: 在它们后面
  rationale: 保留原文既可表示空间上的随后出现，也可暗含次序上的“在它们之后”；代词指上文的七个穗子。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重且易懂的叙事语言。“看哪”保留原文鲜明的梦境转场；“穗子”保持谷物种类未明的原文范围。
