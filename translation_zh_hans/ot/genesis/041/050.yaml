base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/050.yaml
  text: Before the year of famine came[a], two sons were born to Joseph, whom Asenath daughter of Potiphera, priest of On[b], bore to him.
translation:
  language: zh_hans
  text: 在饥荒之年来到[a]以前，安城[b]祭司波提非拉的女儿亚西纳为约瑟生了两个儿子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文这里的“年”是单数，指饥荒时期开始的那一年。
    reason: lexical_alternative
  - marker: b
    text: 安是埃及的一座城，后来希腊人称它为赫利奥波利斯。
    reason: cultural_note
lexical_decisions:
- source_word: וּלְיוֹסֵף יֻלַּד שְׁנֵי בָנִים
  choice: 约瑟有了两个儿子
  rationale: 希伯来文直译近于“给约瑟生了两个儿子”；现代汉语用“约瑟有了两个儿子”自然表达被动出生结构，同时保留父子关系。
- source_word: בְּטֶרֶם תָּבוֹא שְׁנַת הָרָעָב
  choice: 饥荒之年到来以前
  rationale: 保留原文单数“年”和“到来”的动态意象；此处指饥荒时期开始，脚注说明也可理解为“饥荒年”。
- source_word: אֲשֶׁר יָלְדָה לּוֹ
  choice: 是……为他生的
  rationale: 明确关系从句所指的是两个儿子，并保留 לּוֹ 所表达的“为他／给他”关系。
- source_word: אָסְנַת
  choice: 亚西纳
  rationale: 按现代中文圣经人名惯用形式音译该埃及人名。
- source_word: בַּת פּוֹטִי פֶרַע
  choice: 波提非拉的女儿
  rationale: 准确呈现希伯来文所属结构和亲属关系。
- source_word: כֹּהֵן אֹן
  choice: 安城祭司
  rationale: כֹּהֵן 译为“祭司”；“安”是埃及地名，并加“城”帮助普通读者识别其为城市，脚注补充其后来的希腊名称。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重而清晰的现代标准普通话。主句以“有了两个儿子”避免生硬的汉语被动式；保留“饥荒之年”的单数形式，并用脚注说明其语义范围。脚注标记均置于相关正文之后。
