translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“看哪”略带经文语体，用来保留梦境叙述的鲜明提示；其余措辞力求自然口语化而不失尊严。标点用分号区分母牛的外貌描写与随后吃草的动作。
