base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/018.yaml
  text: And behold[a], seven cows were coming up from the Nile, healthy in flesh and beautiful in form[c][b], and they grazed in the reeds.
translation:
  language: zh_hans
  text: 看哪，有七头母牛从尼罗河[a]里上来，膘肥体壮[b]，体态优美；它们在水草丛[c]中吃草。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“河”；在本段的埃及背景中，希伯来语 יְאֹר 最自然是指尼罗河。
    reason: lexical_alternative
  - marker: b
    text: 或译“肉身健壮”或“长得肥壮”；希伯来语直译为“肉体健全（丰满）”。
    reason: lexical_alternative
  - marker: c
    text: 或译“芦苇丛”或“沼泽草地”；希伯来语所指的是尼罗河边湿地的植物。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留希伯来语用来生动引出梦中景象的提示语，也传达突然映入眼帘的意味。
- source_word: מִן הַיְאֹר
  choice: 从尼罗河里
  rationale: יְאֹר字面可指“河”，但在本段埃及背景中自然特指尼罗河；“里”符合牛从水中上来的场景。
- source_word: עֹלֹת
  choice: 上来
  rationale: 该分词描绘正在发生的动作；现代汉语在“看哪，有……”结构中无需另加进行标记，也能自然呈现动态画面。
- source_word: שֶׁבַע פָּרוֹת
  choice: 七头母牛
  rationale: פָּרוֹת明确是阴性复数，译作“母牛”比泛称“牛”更准确。
- source_word: בְּרִיאוֹת בָּשָׂר
  choice: 膘肥体壮
  rationale: 原文描述这些牛肉身丰满、健壮；此汉语成语自然凝练，同时兼顾丰满与健康两层意思。
- source_word: וִיפֹת תֹּאַר
  choice: 外形俊美
  rationale: תֹּאַר指形态、外形，יָפֶה指美好；此译保留对形体外观的描写，又符合现代汉语表达。
- source_word: וַתִּרְעֶינָה
  choice: 吃草
  rationale: רעה在此指牲畜放牧进食；“吃草”比“牧食”或“放牧”更自然，也避免误以为牛在牧养别的动物。
- source_word: בָּאָחוּ
  choice: 在水草丛中
  rationale: אָחוּ指河岸湿地的草本植物或水草地；“水草丛”保留尼罗河边湿地植被的特点，不把词义过度限定为某一种植物。
