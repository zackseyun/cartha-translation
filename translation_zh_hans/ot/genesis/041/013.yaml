  text: וַ/יְהִ֛י כַּ/אֲשֶׁ֥ר פָּֽתַר לָ֖/נוּ כֵּ֣ן הָיָ֑ה אֹתִ֛/י הֵשִׁ֥יב עַל כַּנִּ֖/י וְ/אֹת֥/וֹ תָלָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/013.yaml
  text: 'And it happened just as he interpreted for us[a], so it was: me he restored to my office[b], but him he hanged.'
translation:
  language: zh_hans
  text: 后来，事情果然正如他为我们解梦时所说的那样：我官复原职[a]，那人却被悬挂起来[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“使我回到我的位置上”，指恢复原来的职务。
    reason: lexical_alternative
  - marker: b
    text: 或译“被挂起来”。这里的“悬挂”可能指处刑，也可能指处死后公开悬尸；本句本身没有说明具体过程。
    reason: source_ambiguity
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר ... כֵּן הָיָה
  choice: 后来，事情果然正如……那样
  rationale: 合并表达两个相互呼应的 היה 结构，保留预言与结果完全相符的强调，同时避免现代汉语中生硬重复“发生”。
- source_word: פָּתַר לָנוּ
  choice: 他为我们解梦时所说的
  rationale: פתר 在本段特指解释梦境；“解梦”比泛称“解释”更准确，也更符合现代汉语习惯。“所说的”自然承接解释的具体结果。
- source_word: אֹתִי הֵשִׁיב עַל כַּנִּי
  choice: 我官复原职
  rationale: “官复原职”简洁传达恢复到原有宫廷职务的意思，也借“我……那人……”保留原文宾语前置形成的鲜明对比，不另行补出动词的隐含主语。
- source_word: וְאֹתוֹ תָלָה
  choice: 那人却被悬挂起来
  rationale: “却”体现两种结局的对比；被动表达避免擅自补明原文未明说的施事者。“悬挂起来”保留 תלה 的基本意象，不武断判定悬挂本身是否为致死方式。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“官复原职”是普通读者熟悉的成语；全句保留原文两人结局的对照，并避免补入原文未明说的施事者。
