  yaml_path: translation/ot/genesis/041/017.yaml
  text: Then Pharaoh said to Joseph[a], “In my dream, behold, I was standing on the bank of the Nile.”
translation:
  language: zh_hans
  text: 法老对约瑟说：“在我的梦中，看哪，我正站在尼罗河[a]岸边。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文作“河”；在《创世记》的埃及语境中，这个词通常指尼罗河。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 说
  rationale: 该动词本义为“说话”，在引出直接引语的叙事语境中译作“说”最自然。
- source_word: פַּרְעֹה
  choice: 法老
  rationale: 现代汉语圣经及历史语境中对埃及君王称号的通行译法。
- source_word: אֶל יוֹסֵף
  choice: 对约瑟
  rationale: 介词标明说话的对象，译作“对约瑟”符合现代汉语表达。
- source_word: בַּחֲלֹמִי
  choice: 在我的梦中
  rationale: 保留介词和第一人称单数所属后缀的含义，并自然引出法老对梦境的叙述。
- source_word: הִנְנִי
  choice: 看哪，我正
  rationale: “看哪”保留原文提示眼前景象的鲜明语气；配合后面的分词，以“我正”呈现梦境中正在发生的画面。
- source_word: עֹמֵד
  choice: 站在
  rationale: 准确表达该分词所指的站立状态；与“正”连用，体现梦中持续呈现的场景。
- source_word: שְׂפַת
  choice: 岸边
  rationale: 该词字面义为“唇、边缘”，用于河流时指河岸；“岸边”清楚且符合现代汉语。
- source_word: הַיְאֹר
  choice: 尼罗河
  rationale: 该词可泛指“河”，但在《创世记》的埃及语境中通常特指尼罗河；正文明确所指，脚注保留字面词义。
