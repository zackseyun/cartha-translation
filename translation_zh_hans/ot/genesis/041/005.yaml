base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/005.yaml
  text: Then he slept and dreamed a second time[a], and behold, seven ears of grain were coming up on one stalk[b], plump and good.
translation:
  language: zh_hans
  text: 随后，他又睡着了，第二次做了梦。看哪，一根秆上正长出七个谷穗[a]，饱满又好[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文所用词指谷物结籽的穗，也可译作“穗头”。
    reason: lexical_alternative
  - marker: b
    text: “饱满”也可译作“健实”或“肥壮”；这里形容谷穗籽粒充实。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּישָׁן
  choice: 随后，他又睡着了
  rationale: 该叙事动词承接前文并推进事件；“随后”表达顺序，“又睡着了”也自然衔接第二个梦。
- source_word: וַיַּחֲלֹם שֵׁנִית
  choice: 第二次做梦
  rationale: שֵׁנִית明确表示“第二次”；保留这一说法，比单说“又做梦”更贴近原文。
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留הִנֵּה在梦境叙述中引人注意、鲜明呈现景象的语篇作用。
- source_word: שֶׁבַע שִׁבֳּלִים
  choice: 七个麦穗
  rationale: שִׁבֳּלִים指谷物结籽的穗部；“麦穗”是现代汉语中自然清楚的表达，但原词并未限定具体谷物品种，故加注说明。
- source_word: עֹלֹת
  choice: 正长出
  rationale: 分词形式生动呈现持续展现的动作；“正长出”保留这一进行意味。
- source_word: בְּקָנֶה אֶחָד
  choice: 一根麦秆上
  rationale: קָנֶה在此指承托谷穗的秆；介词בְּ结合汉语习惯译作“在……上”。
- source_word: בְּרִיאוֹת
  choice: 饱满
  rationale: 该词本义涉及肥壮、健实；用于谷穗时，“饱满”最自然地表达籽粒充实的状态。
- source_word: וְטֹבוֹת
  choice: 而良好
  rationale: טוֹב含义宽泛，可指好、优良；“良好”保留概括性的品质评价，不作过度具体化。
