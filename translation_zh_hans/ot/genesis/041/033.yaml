  yaml_path: translation/ot/genesis/041/033.yaml
  text: Now let Pharaoh look for a discerning and wise man[a], and appoint him over the land of Egypt.
translation:
  language: zh_hans
  text: 现在，法老当物色一个明辨而有智慧的人[a]，立他管理埃及地。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “物色”或译“察看”或“选定”。这里的希伯来语动词按语境可有察看、寻找或选定之意。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: 现在
  rationale: 承接约瑟对梦的解释，转入实际建议；现代汉语中“现在”自然清楚。
- source_word: יֵרֶא
  choice: 要物色
  rationale: 此处ראה的祈使性用法结合后文的任命，指察看、寻得或选定合适人选；“物色”兼顾寻找与甄选。
- source_word: פַרְעֹה
  choice: 法老
  rationale: 现代中文圣经及一般语境中通行的埃及君王称号。
- source_word: אִישׁ
  choice: 一个……的人
  rationale: 忠实表达阳性单数的אִישׁ，同时符合自然现代汉语。
- source_word: נָבוֹן
  choice: 明辨
  rationale: 表达洞察、理解和判断能力，切合行政管理语境，并与“有智慧”有所区别。
- source_word: וְחָכָם
  choice: 而有智慧
  rationale: חכם表示有智慧、判断得当且办事干练；“有智慧”自然、庄重。
- source_word: וִישִׁיתֵהוּ
  choice: 派他治理
  rationale: שׂים字面为安置、设立；结合“在埃及地之上”的权柄结构，“派他治理”清楚表达任命其管理全地。
- source_word: עַל אֶרֶץ מִצְרָיִם
  choice: 治理埃及地
  rationale: עַל在这里表示居于其上并拥有管理权；用“治理”自然体现行政权柄，“埃及地”保留原文的אֶרֶץ。
