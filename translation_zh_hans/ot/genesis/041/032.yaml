  text: וְ/עַ֨ל הִשָּׁנ֧וֹת הַ/חֲל֛וֹם אֶל פַּרְעֹ֖ה פַּעֲמָ֑יִם כִּֽי נָכ֤וֹן הַ/דָּבָר֙ מֵ/עִ֣ם הָ/אֱלֹהִ֔ים וּ/מְמַהֵ֥ר הָ/אֱלֹהִ֖ים לַ/עֲשֹׂתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/032.yaml
  text: And as for the dream being repeated to Pharaoh twice[a], it is because the matter is fixed by God[b], and God is hastening to do it.
translation:
  language: zh_hans
  text: 至于梦两次临到法老，是因为这事已由神确定，神也快要成就这事[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“神必快快成就这事”或“神正在赶快成就这事”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: 至于
  rationale: 引出对梦为何重复的解释，符合希伯来语在此处的话题转换和说明作用，也自然贴合现代汉语。
- source_word: הִשָּׁנוֹת הַחֲלוֹם
  choice: 梦重复了
  rationale: 不定式结构表达梦被重复；汉语用主动形式“梦重复了”自然清楚，又不改变语义。
- source_word: אֶל־פַּרְעֹה פַּעֲמָיִם
  choice: 法老的梦……两次
  rationale: 原文直译为“梦向法老重复两次”。汉语重组为“法老的梦重复了两次”，明确法老是领受梦的人，而不是梦的所有者这一神学断言。
- source_word: כִּי
  choice: 这是因为
  rationale: 明确引出梦重复两次的原因。
- source_word: נָכוֹן הַדָּבָר
  choice: 这事已经……确定
  rationale: נָכוֹן 表示稳固、确立或确定；“已经确定”传达事情已定而非尚属可能。
- source_word: מֵעִם הָאֱלֹהִים
  choice: 由神
  rationale: מֵעִם 可表示来源或出自某方；与“确定”搭配时，“由神确定”在汉语中自然，并表达神是此决定的来源。
- source_word: וּמְמַהֵר הָאֱלֹהִים
  choice: 神也正催促
  rationale: 分词 מְמַהֵר 表达正在加速、赶快施行；“正催促”保留其进行性和迫近感，同时避免把时态过度固定为单纯将来。
- source_word: לַעֲשֹׂתוֹ
  choice: 要成就这事
  rationale: 字面为“去做它”，所指是前述神所确定的事；“成就这事”比“做它”更符合现代汉语，又保留付诸实现的含义。
theological_decisions:
- issue: הָאֱלֹהִים 的单复数理解
  choice: 神
  alternative: 众神
  rationale: 虽然 אֱלֹהִים 形式上为复数形态，但本节的单数谓语及约瑟讲话的上下文清楚指向独一的神，因此译为单数“神”。
- issue: נָכוֹן מֵעִם הָאֱלֹהִים 所表达的神圣确定性
  choice: 这事已经由神确定
  alternative: 这事出于神，已经确定
  rationale: 两种译法都可反映事情的确定性及其神圣来源；正文采用更自然紧凑的被动表达，脚注保留较贴近介词来源义的译法，不进一步界定神如何使其确定。
- issue: מְמַהֵר 的时间与体貌
  choice: 神也正催促要成就这事
  alternative: 神很快就会成就这事／神即将成就这事
  rationale: 希伯来语分词可强调神正在使事情迅速实现，也可在语境中表达即将迅速施行。正文保留动态过程，脚注列出自然的将来和临近性理解。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“至于……这是因为……”清楚呈现解释结构；“确定”“成就”是普通读者易懂、同时适合经文语体的用词。正文保留原文关于事情已由神确立及其迅速实现的张力，脚注说明介词和分词的可选译法。
