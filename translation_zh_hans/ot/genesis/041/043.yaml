    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְכֵּב
  choice: 让……坐上
  rationale: רכב 的使役式表示使某人乘坐；“让……坐上”以自然的现代汉语保留使役意义。
- source_word: בְּמִרְכֶּבֶת הַמִּשְׁנֶה אֲשֶׁר־לוֹ
  choice: 坐上自己的副车
  rationale: מִשְׁנֶה 表示第二位或次一等次；“副车”传达这辆车在法老车驾中位居第二，而不只是按数量计算的第二辆车，并保留其属于法老之意。
- source_word: וַיִּקְרְאוּ לְפָנָיו
  choice: 人们在他前面高喊
  rationale: קרא 在此指行列中的公开呼喊；“在他前面高喊”兼顾空间关系与宣告场景。
- source_word: אַבְרֵךְ
  choice: 阿弗列
  rationale: 此词词源和确切含义不明，可能是埃及语借词，也可能与希伯来语表达有关；正文采用音译，避免把不确定的解释定为唯一含义。
- source_word: וְנָתוֹן אֹתוֹ
  choice: 就立他
  rationale: 该表达在上下文中表示正式置于权位；“立他”简洁地传达任命和确立权柄的意思。
- source_word: עַל כָּל אֶרֶץ מִצְרָיִם
  choice: 治理埃及全地
  rationale: עַל 在此表示管辖权；“治理……全地”自然表达约瑟被置于整个埃及地域之上掌权。
