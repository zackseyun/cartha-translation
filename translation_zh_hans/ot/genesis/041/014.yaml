base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/014.yaml
  text: Then Pharaoh sent and called for Joseph[a], and they quickly brought him out of the pit. He shaved, changed his clothes[c][b], and came to Pharaoh.
translation:
  language: zh_hans
  text: 法老就派人去召约瑟；他们急忙把他从坑[a]里带出来。约瑟剃刮一番，换了衣服，来到法老面前。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “坑”也可指用作囚禁处的坑穴，或蓄水池式的空间。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח ... וַיִּקְרָא אֶת־יוֹסֵף
  choice: 派人召约瑟
  rationale: 既反映“派遣”和“召唤”两个动作，又用现代汉语自然表达法老命人把约瑟召来。
- source_word: וַיְרִיצֻהוּ
  choice: 众人赶紧把他……带出来
  rationale: 该使役形式表达使约瑟迅速出来；补出原文隐含的执行者“众人”，并保留行动的急迫感。
- source_word: מִן־הַבּוֹר
  choice: 从牢坑里
  rationale: בּוֹר本义为“坑”，在本处指约瑟受囚之处；“牢坑”兼顾字面意象和监禁语境。
- source_word: וַיְגַלַּח
  choice: 他剃刮整齐
  rationale: 原文未说明剃的是头发还是胡须；此译保留对象未明，同时以自然汉语表达觐见前的整容修饰。
- source_word: וַיְחַלֵּף שִׂמְלֹתָיו
  choice: 换了衣服
  rationale: 准确、简洁地表达更换身上衣物，符合现代汉语习惯。
- source_word: וַיָּבֹא אֶל־פַּרְעֹה
  choice: 到法老面前
  rationale: בוא אל直指来到法老那里；“到法老面前”自然体现朝见场景，而不额外加入进殿等细节。
