base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/046.yaml
  text: Joseph was thirty years old when he stood before Pharaoh king of Egypt. And Joseph went out from before Pharaoh and traveled through all the land of Egypt.
translation:
  language: zh_hans
  text: 约瑟站在埃及王法老面前时，年三十岁。约瑟从法老面前出去，走遍了埃及全地。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן שְׁלֹשִׁים שָׁנָה
  choice: 年三十岁
  rationale: 按现代汉语年龄表达译出，既自然简洁，也保留叙事的庄重语气。
- source_word: בְּעָמְדוֹ
  choice: 站……时
  rationale: 介词加不定式结构表示时间；“站在……面前时”贴近原文，不把宫廷侍奉或正式就职等可能含义直接写入正文。
- source_word: לִפְנֵי
  choice: 在……面前
  rationale: 对应空间及朝廷语境中的“在某人面前”，并使本节两次出现的同一希伯来表达在中文中保持呼应。
- source_word: פַּרְעֹה מֶלֶךְ מִצְרָיִם
  choice: 埃及王法老
  rationale: 将同位结构自然译为汉语称谓“埃及王法老”，清楚表明法老的身份。
- source_word: וַיֵּצֵא
  choice: 出去
  rationale: 直接表达从法老面前离开的叙事动作，不额外说明目的。
- source_word: מִלִּפְנֵי פַרְעֹה
  choice: 从法老面前
  rationale: 保留原文与前句 לִפְנֵי 的词语重复及空间意象。
- source_word: וַיַּעְבֹר
  choice: 走遍了
  rationale: 结合 בְּכָל 所表达的全面范围，译为“走遍了”自然传达约瑟在全地行走；不把行政巡视或筹备等语境推断明说出来。
- source_word: בְּכָל אֶרֶץ מִצְרָיִם
  choice: 埃及全地
  rationale: 简洁、准确地表达整个埃及地域范围。
- source_word: וְ / וַ
  choice: 以句序承接，不另译连接词
  rationale: 希伯来叙事连接词主要推动叙事；现代汉语用连续句式即可自然体现承接关系，避免生硬重复“于是”或“然后”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。保留“站在……面前”及“从……面前”的原文呼应，不将约瑟的行动解释性地扩写为就职、巡察或筹备。
