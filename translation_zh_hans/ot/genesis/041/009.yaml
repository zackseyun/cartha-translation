base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/009.yaml
  text: Then the chief cupbearer spoke to Pharaoh[a], saying, “Today I remember my offenses.”
translation:
  language: zh_hans
  text: 于是司酒长对法老说：“今天我想起自己的过错[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“罪”或“失误”。希伯来语这个词可广义地指各种过犯，包括道德上的罪过或职务上的失误。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 于是……说
  rationale: 连续式叙事形式推动情节向前；“于是”符合现代汉语叙事习惯，而“说”自然引出下文。
- source_word: שַׂר הַמַּשְׁקִים
  choice: 司酒长
  rationale: 这是负责法老饮品事务的宫廷官职；“司酒长”简洁、庄重，也能体现其主管身份。
- source_word: אֶת־פַּרְעֹה
  choice: 对法老
  rationale: 希伯来语以宾语标记连接“法老”，现代汉语则自然表达为“对法老说”。
- source_word: לֵאמֹר
  choice: 说
  rationale: 这是常见的引语引介形式；汉语只需一个“说”即可自然传达其功能，避免重复。
- source_word: אֶת חֲטָאַי
  choice: 自己的过错
  rationale: חטא在此可指罪、过犯或职务上的失误。“过错”保留道德与宫廷责任两方面的可能性，又不过度限定为宗教意义上的“罪”；“自己的”符合汉语回指习惯。
- source_word: אֲנִי מַזְכִּיר
  choice: 我想起
  rationale: זכר的使役形可表示使人记起、提起或记在心上；本处说话者把自己从前的过错重新记起并将要陈述，“想起”最符合上下文和现代汉语表达。
- source_word: הַיּוֹם
  choice: 今天
  rationale: 准确保留原文的时间强调，并采用现代汉语常用说法。
