base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/024.yaml
  text: And the thin ears swallowed up the seven good ears[a]. Then I told the magicians[c][b], but there was no one who could explain it to me.
translation:
  language: zh_hans
  text: 那些细弱的穗子吞掉了七个好穗子[a]。我把这梦告诉了术士[b]，却没有人能向我说明[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “穗子”指谷物结籽的穗部；原文没有说明是哪一种谷物。
    reason: lexical_alternative
  - marker: b
    text: 这里的“术士”指埃及从事宗教仪式、占兆或解梦的专门人员。
    reason: cultural_note
  - marker: c
    text: 也可译作“却没有人能为我解释”。在这里，所要说明的是梦的含义。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּבְלַעְןָ
  choice: 吞下了
  rationale: 保留梦境中一组穗子吞吃另一组穗子的鲜明形象；“吞下”是现代汉语自然、具体的表达。
- source_word: שִׁבֳּלִים
  choice: 穗子
  rationale: 本词指谷物结籽的穗部；“穗子”简明自然，也不擅自指定谷物种类。
- source_word: הַדַּקֹּת
  choice: 细瘦的
  rationale: 原词表示细、薄；“细瘦”既贴合穗子的外观，也与饱满的穗子形成清楚对照。
- source_word: הַטֹּבוֹת
  choice: 饱满的
  rationale: 原义为“好的”，在谷穗的梦境语境中指长势良好、饱满的穗子；如此译为现代汉语较自然。
- source_word: וָאֹמַר אֶל
  choice: 我把这事告诉了
  rationale: 直译为“我对……说”；上下文表明法老把梦境告诉术士。“这事”是为汉语通顺而补出的语境信息。
- source_word: הַחַרְטֻמִּים
  choice: 术士
  rationale: 该词指埃及宫廷中从事仪式、占兆或解梦的专门人员；“术士”比现代汉语中的“魔术师”更能避免舞台表演者的误解。
- source_word: וְאֵין מַגִּיד לִי
  choice: 却没有人能给我解明
  rationale: מַגִּיד基本义为告知、说明；此处所缺的是对梦意的说明。“解明”保留说明与解释之间的语义空间，不把它收窄为单一技术术语。
theological_decisions:
- issue: 末句是否明确译作“解梦”
  choice: 没有人能给我解明
  alternative: 没有人能为我解梦
  rationale: 原文使用“告知、说明”一类较宽泛的词，而非专门表示“解释”的动词；结合语境表达解梦之意，同时保留原词的宽度。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。以“细瘦—饱满”呈现梦中两组穗子的视觉对照；“术士”避免“魔术师”的现代舞台表演含义；末句不把原文较宽的“告知、说明”过度限定为专门术语。
