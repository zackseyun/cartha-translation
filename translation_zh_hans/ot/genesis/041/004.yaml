base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/004.yaml
  text: Then the cows ugly in appearance and thin in flesh ate the seven cows beautiful in appearance and fat[a], and Pharaoh awoke.
translation:
  language: zh_hans
  text: 那些外貌丑陋、身形瘦削的母牛，吃了那七头外貌美丽、肥壮的母牛[a]；法老就醒了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “肥壮”也可译作“健康”。原文这个词可指健康、肥胖或壮实；这里与“身形瘦削”相对，故译作“肥壮”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאכַלְנָה
  choice: 吃掉了
  rationale: 该动词的基本义是“吃”；在梦中母牛彼此吞食的场景里，“吃掉”自然表达动作完成，又避免采用语气更强的“吞噬”。
- source_word: הַפָּרוֹת
  choice: 母牛
  rationale: פָּרוֹת是阴性复数，具体指母牛；译作“母牛”比泛称“牛”更准确。
- source_word: רָעוֹת הַמַּרְאֶה
  choice: 外貌丑陋
  rationale: רָעוֹת本义为“坏的”，与“外貌”连用时表示难看、丑陋；此译符合现代汉语，也与下文“外貌美丽”形成清楚对照。
- source_word: וְדַקֹּת הַבָּשָׂר
  choice: 身体瘦弱
  rationale: 原文直译近于“肉体瘦薄”。“身体瘦弱”保留其形体消瘦的画面，同时比“肉体单薄”更符合自然的现代汉语。
- source_word: אֵת שֶׁבַע הַפָּרוֹת
  choice: 那七头……母牛
  rationale: 准确表达定指的七头母牛，并使用适合牲畜的量词“头”。
- source_word: יְפֹת הַמַּרְאֶה
  choice: 外貌美丽
  rationale: 保留原文与“外貌丑陋”相对称的结构和意义。
- source_word: וְהַבְּרִיאֹת
  choice: 肥壮
  rationale: בָּרִיא可指健康、肥胖或壮实；在与“身体瘦弱”的对照中，“肥壮”最能传达具体形体，同时自然庄重。
- source_word: וַיִּיקַץ פַּרְעֹה
  choice: 法老就醒了
  rationale: “醒了”准确传达动词意义；“就”自然体现叙事推进及梦境结束后的紧接动作。
theological_decisions: []
