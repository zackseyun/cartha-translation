  yaml_path: translation/ot/genesis/041/040.yaml
  text: You shall be over my house[a], and all my people shall obey your command. Only with respect to the throne will I be greater than you.
translation:
  language: zh_hans
  text: 你要掌管我的宫廷；我的全体臣民都要听从你的号令。[a]唯独在王位这一点上，我的地位比你高。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译：“我的全体臣民都要亲吻你的口。”这里通常理解为听从约瑟的命令，或向他表示臣服。
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל בֵּיתִי
  choice: 掌管我的宫廷
  rationale: עַל与בַּיִת连用，在这里表示管辖权。语境是法老把行政权交给约瑟；“宫廷”既自然，也比单纯的“家”更能表达王室及其行政体系。
- source_word: וְעַל־פִּיךָ יִשַּׁק
  choice: 都要听从你的号令
  rationale: פֶּה直译为“口”，יִשַּׁק通常意为“亲吻”。此处整体表达臣民按约瑟口中所出的命令行事或向他表示臣服；正文采用清楚自然的功能性译法，并以脚注保留字面形式及其歧义。
- source_word: כָּל־עַמִּי
  choice: 我的全体臣民
  rationale: עַם是集体性的“人民”。在法老授权的语境中，“臣民”准确体现他们与君王及受权者的关系；“全体”传达כָּל。
- source_word: רַק
  choice: 只有
  rationale: רַק在这里标明唯一的限制或例外，“只有”简洁而自然。
- source_word: הַכִּסֵּא
  choice: 王位
  rationale: כִּסֵּא本义为“宝座”，此处转指法老保留的王权与君王身份。“在王位上”既保留原文意象，也自然表明职位层面的优越。
- source_word: אֶגְדַּל מִמֶּךָּ
  choice: 我才比你大
  rationale: גדל加מן表示比较上的高于或更大。该译法贴近原文，并由“在王位上”限定为地位或权柄方面，而非品德上的优越。
