  text: וְ/הָיָ֨ה הָ/אֹ֤כֶל לְ/פִקָּדוֹן֙ לָ/אָ֔רֶץ לְ/שֶׁ֨בַע֙ שְׁנֵ֣י הָ/רָעָ֔ב אֲשֶׁ֥ר תִּהְיֶ֖יןָ בְּ/אֶ֣רֶץ מִצְרָ֑יִם וְ/לֹֽא תִכָּרֵ֥ת הָ/אָ֖רֶץ בָּ/רָעָֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/036.yaml
  text: That food shall be a reserve for the land for the seven years of famine that will be in the land of Egypt[c][b][a], so that the land may not be cut off by the famine.
translation:
  language: zh_hans
  text: 这些粮食要为这地储备起来，以备埃及地将有的七个荒年[a]，免得这地因饥荒而灭亡[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“作为这地在七个荒年中的储备”；希伯来语中两个介词短语的关系可以有不同理解。
    reason: syntactic_ambiguity
  - marker: b
    text: “灭亡”原文直译为“被剪除”，这里指这地因饥荒而遭毁灭。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה הָאֹכֶל
  choice: 这些粮食要……
  rationale: הָאֹכֶל泛指食物，但本段具体指前文收集的农产粮食；中文用“这些粮食”既承接上文，也符合储粮语境。וְהָיָה在此表达政策实施后的预期结果，译作“要”。
- source_word: לְפִקָּדוֹן
  choice: 储备起来
  rationale: 该词指受保管、留作后用之物；“储备起来”自然表达为未来灾年保存粮食的行政措施。
- source_word: לָאָרֶץ לְשֶׁבַע שְׁנֵי הָרָעָב
  choice: 为这地储备起来，以备……七个荒年
  rationale: 两个לְ分别涉及受益对象和未来用途；中文以“为……以备……”清楚呈现关系，避免生硬重复。
- source_word: אֲשֶׁר תִּהְיֶיןָ בְּאֶרֶץ מִצְרָיִם
  choice: 埃及地将有的
  rationale: 关系从句修饰“七个荒年”，动词为阴性复数，与“年”一致；“将有的”保留未来指向。
- source_word: וְלֹא תִכָּרֵת הָאָרֶץ בָּרָעָב
  choice: 免得这地因饥荒而灭亡
  rationale: כרת的尼法勒式字面为“被剪除”，用于土地/国家时语境义是居民与国土因饥荒遭毁灭；“灭亡”在现代中文中自然，并保留严重后果。בָּרָעָב译作原因性的“因饥荒”。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“以备”明确粮食储备与未来荒年的用途关系；末句不用中文不自然的“这地被剪除”，正文传达语境意义，并以脚注保留希伯来语意象。
