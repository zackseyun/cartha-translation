  text: וַ/יִּיטַ֥ב הַ/דָּבָ֖ר בְּ/עֵינֵ֣י פַרְעֹ֑ה וּ/בְ/עֵינֵ֖י כָּל עֲבָדָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/037.yaml
  text: The matter seemed good in the eyes of Pharaoh and in the eyes of all his servants[a][b].
translation:
  language: zh_hans
  text: 这事在法老和他所有臣仆眼中都很好。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “这事”按上下文也可译作“这个建议”；全句也可译作“法老和他所有臣仆都认为这个建议很好”。
    reason: 说明דָּבָר的语境性译法，并给出“在……眼中”这一习语的自然汉语表达。
lexical_decisions:
- source_word: וַיִּיטַב
  choice: 很好
  rationale: יטב与“在……眼中”连用，表示某事被认为是好的、合宜的。“很好”保留原文以“这事”为主语的评价表达，没有改写成更强的“赞同”或“喜欢”。
- source_word: הַדָּבָר
  choice: 这事
  rationale: דָּבָר语义宽泛，可指事情、话语或所提之事。上下文所指是约瑟刚提出的安排；正文用“这事”保留其宽泛性，注脚说明可按语境理解为“这个建议”。
- source_word: בְּעֵינֵי
  choice: 在……眼中
  rationale: 直译并保留希伯来语的身体意象；这一表达在现代汉语中自然可懂，表示“在某人看来”。
- source_word: פַרְעֹה
  choice: 法老
  rationale: 采用现代中文圣经与一般历史语境中通行的埃及君王称号译法。
- source_word: כָּל עֲבָדָיו
  choice: 他所有臣仆
  rationale: עֲבָדִים可指奴仆、臣仆或宫廷官员。此处是法老宫廷中的人员，“臣仆”既体现他们对君王的隶属关系，也不把其身份过窄地限定为奴隶或官员；“所有”对应כָּל。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。正文保留“在……眼中”的原文意象与平行评价关系，同时避免较陈旧的“看为美”或过度解释性的“赞同这项计划”。
