base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/027.yaml
  text: And the seven thin and bad cows that came up after them are seven years[a], and the seven empty heads of grain, scorched by the east wind[b], will be seven years of famine.
translation:
  language: zh_hans
  text: 随后上来的那七头瘦瘪难看的母牛，是七年；那七个干瘪、被东风吹焦的穗子，将是饥荒的七年。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָרַקּוֹת וְהָרָעֹת
  choice: 瘦弱难看的
  rationale: 这里描写母牛消瘦且外观不佳，并非指道德上的“恶”。“瘦弱难看”符合梦境语境，也自然易懂。
- source_word: הָעֹלֹת אַחֲרֵיהֶן
  choice: 后来上来的
  rationale: 保留这些母牛继前七头之后从河中上来的先后次序，同时采用自然的现代汉语表达。
- source_word: שֶׁבַע שָׁנִים הֵנָּה
  choice: 就是七年
  rationale: 表达约瑟对梦中象征的直接解释；“就是”清楚呈现对应关系。
- source_word: הַשִׁבֳּלִים הָרֵקוֹת
  choice: 空瘪的穗子
  rationale: שִׁבֳּלִים 指谷物的穗，רֵקוֹת 强调里面空、没有饱满籽粒；“空瘪的穗子”准确而通俗。
- source_word: שְׁדֻפוֹת הַקָּדִים
  choice: 被东风吹焦的
  rationale: 保留致害者“东风”，并用“吹焦”传达谷穗因炎热干燥的东风而受损的意象。
- source_word: יִהְיוּ שֶׁבַע שְׁנֵי רָעָב
  choice: 将是七个荒年
  rationale: 未完成式在此带有指向未来的预告意味；“荒年”简洁自然地表达发生饥荒的年份。
theological_decisions: []
translation_notes:
  register: 采用庄重而清楚的现代标准普通话。句式保留原文两组象征与七年的平行对应；不增添原文没有的神学解释。英文咨询层的脚注 a 标记位置与内容不一致，且“穗子”在中文中无需另列“ears/heads”的词汇异译，因此不设脚注；“东风”也按原文直译，无需用脚注改写为另一近义表达。
