revisions:
- from: 后来上来的七头瘦弱难看的母牛，就是七年；那七个空瘪、被东风吹焦的穗子，将是七个荒年。
  to: 随后上来的那七头瘦瘪难看的母牛，是七年；那七个干瘪、被东风吹焦的穗子，将是饥荒的七年。
  rationale: 修订仅收紧原文的语义：以“随后”表达出现的先后，以“瘦瘪”和“干瘪”分别自然呈现母牛与谷穗的枯瘦、空虚状态，并以“饥荒的七年”准确翻译 שְׁנֵי רָעָב。原文及中文译文均无需设置脚注；英语审计文本中“a”脚注的锚点问题不应移植到中文。
