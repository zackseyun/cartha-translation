revisions:
- from: 他给次子取名叫以法莲[a]，因为他说：“上帝使我在受苦之地结出果实。”
  to: 他给次子取名叫以法莲[a]，因为：“上帝使我在我受苦之地多结果子。”
  rationale: 修订删除原文未明说的“他说”，并以引号保留命名解释中约瑟的第一人称。补出“我”以反映原文后缀；将“结出果实”改为“多结果子”，以较自然地表达上帝使人丰盛的比喻，同时维持名字的文字关联。
