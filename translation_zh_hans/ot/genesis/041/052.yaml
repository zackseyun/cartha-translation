  text: וְ/אֵ֛ת שֵׁ֥ם הַ/שֵּׁנִ֖י קָרָ֣א אֶפְרָ֑יִם כִּֽי הִפְרַ֥/נִי אֱלֹהִ֖ים בְּ/אֶ֥רֶץ עָנְיִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/052.yaml
  text: And he named the second Ephraim[a], for God has made me fruitful in the land of my affliction.
translation:
  language: zh_hans
  text: 他给次子取名叫以法莲[a]，因为：“上帝使我在我受苦之地多结果子。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “以法莲”这个名字，与希伯来语“使我多结果子”一语读音相近。
    reason: 说明原文中名字与取名缘由之间无法在中文正文完整重现的语音关联。
lexical_decisions:
- source_word: וְאֵת שֵׁם הַשֵּׁנִי קָרָא
  choice: 他给次子取名叫
  rationale: 按现代汉语命名句式自然表达希伯来语“他称第二个的名”；本节承接上文，句首“他”已足以体现叙事延续，无须生硬译出连接词。
- source_word: אֶפְרָיִם
  choice: 以法莲
  rationale: 采用现代中文圣经语境中通行的人名音译，并以脚注说明其与希伯来语动词的谐音关系。
- source_word: כִּי
  choice: 因为他说
  rationale: כִּי引出取名缘由；补出中文引语所需的“他说”，清楚表明随后是约瑟对名字的解释，不增添实质内容。
- source_word: הִפְרַנִי
  choice: 使我……结出果实
  rationale: 该词是פרה的使役形，意为“使我结果子／使我丰盛”。“结出果实”既保留生育、兴盛的形象，也尽量呈现与“以法莲”的文字呼应。
- source_word: אֱלֹהִים
  choice: 上帝
  rationale: 动词为单数，语境所指是以色列的上帝；采用现代标准普通话中庄重且通行的译称。
- source_word: בְּאֶרֶץ עָנְיִי
  choice: 在受苦之地
  rationale: 直译为“在我受苦之地／在我的苦难之地”。此处用自然、凝练的中文保留土地与苦难之间的修饰关系，同时不限定苦难仅指哪一段经历。
theological_decisions:
- issue: 约瑟取名解释中丰盛与苦难并存的张力
  choice: 同时保留上帝使约瑟结出果实，以及该地仍被称为“受苦之地”这两层陈述。
  alternative: 把“受苦”限定为约瑟到埃及以前或在埃及早期的遭遇。
  rationale: 原文没有界定עָנְיִי所涵盖的具体时期；译文不替经文消解约瑟蒙福与仍以苦难描述此地之间的张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“次子”比“第二个”更符合上下文；“结出果实”保留原文意象及文字游戏。脚注标记[a]已在正文对应出现。
