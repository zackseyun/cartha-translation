base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/048.yaml
  text: And he gathered all the food of the seven years that were in the land of Egypt[a], and he put the food in the cities. In each city he put the food from the fields around it.
translation:
  language: zh_hans
  text: 他把埃及地七个丰年所有的粮食都收聚起来，存放在各城里；每座城周围田地所出的粮食，他都放在那城中。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְבֹּץ
  choice: 收聚起来
  rationale: קבץ表示把分散之物聚集到一起；“收聚起来”既符合叙事语境，也保留集中征收的动作。
- source_word: כָּל אֹכֶל
  choice: 所有的粮食
  rationale: אֹכֶל本义较宽，可指食物；本节语境是从田地收取并储存农产，“粮食”在现代汉语中自然且不过度限定为某一种谷物。
- source_word: שֶׁבַע שָׁנִים אֲשֶׁר הָיוּ בְּאֶרֶץ מִצְרַיִם
  choice: 埃及地七个丰年
  rationale: 希伯来文直译为“在埃及地的七年”；结合前文明确所指为七个丰年，汉语用“埃及地七个丰年”简洁自然，并保持指称清楚。
- source_word: וַיִּתֶּן אֹכֶל בֶּעָרִים
  choice: 存放在各城里
  rationale: נתן通常为“放、置”，此处语境明确涉及积存粮食；“存放”自然表达放置以储备之意，“各城”也与后半句逐城分配的结构相合。
- source_word: אֹכֶל שְׂדֵה הָעִיר אֲשֶׁר סְבִיבֹתֶיהָ
  choice: 每座城周围田地所出的粮食
  rationale: 原文为“那城田地的粮食，就是在它周围的”；译文明确“周围”修饰田地，并以“所出”自然表达粮食与田地的来源关系。
- source_word: נָתַן בְּתוֹכָהּ
  choice: 他都放在那城中
  rationale: 直译为“他放在它里面”；用“那城”明确阴性代词所指，同时保留原文后置复说的强调结构。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。前半句用“存放”顺应储粮语境，后半句保留“粮食……放在那城中”的复说，以反映希伯来文的复指结构和逐城就近储存的重点。
