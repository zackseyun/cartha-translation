  yaml_path: translation/ot/genesis/041/022.yaml
  text: And I saw in my dream[a], and behold, seven ears of grain were coming up on one stalk, full and good.
translation:
  language: zh_hans
  text: 我在梦中看见，看哪，七个穗子[a]从一根秆上长出来，又饱满又好。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“谷穗”；希伯来语指谷物结籽的穗部。
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֵרֶא
  choice: 又看见
  rationale: 这是ראה的Qal连续式，承接法老对梦境的第一人称叙述；“又”自然体现叙事推进。
- source_word: בַּחֲלֹמִי
  choice: 在梦中
  rationale: 介词ב加“我的梦”，在此自然译为“在梦中”；第一人称归属已由“我”清楚表达。
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留הִנֵּה鲜明呈现、引人注意的语篇作用，而不弱化为单纯的“有”。
- source_word: שֶׁבַע שִׁבֳּלִים
  choice: 七个穗子
  rationale: שִׁבֹּלֶת在本处指谷物结籽的穗部；“穗子”简明自然，并保留原文未明确谷物种类的特点。
- source_word: עֹלֹת
  choice: 长出来
  rationale: 阴性复数分词描绘梦中正在显现的动作；“长出来”符合谷穗生长的自然汉语表达。
- source_word: בְּקָנֶה אֶחָד
  choice: 从一根秆上
  rationale: קָנֶה在谷物意象中指秆或茎；“从一根秆上”清楚表达七个穗子同出一秆的图景。
- source_word: מְלֵאֹת
  choice: 饱满
  rationale: 字面义为“满的”；用于谷穗时，“饱满”既准确又符合现代汉语搭配。
- source_word: וְטֹבוֹת
  choice: 又好
  rationale: טוֹב含义宽泛，基本义为“好”；保留这一宽度，不限定为“健壮”或其他更具体的解释。
theological_decisions: []
