  text: וַ/תְּחִלֶּ֜ינָה שֶׁ֣בַע שְׁנֵ֤י הָ/רָעָב֙ לָ/ב֔וֹא כַּ/אֲשֶׁ֖ר אָמַ֣ר יוֹסֵ֑ף וַ/יְהִ֤י רָעָב֙ בְּ/כָל הָ֣/אֲרָצ֔וֹת וּ/בְ/כָל אֶ֥רֶץ מִצְרַ֖יִם הָ֥יָה לָֽחֶם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/054.yaml
  text: And the seven years of famine began to come[a], just as Joseph had said. And there was famine in all the lands, but in all the land of Egypt there was bread.
translation:
  language: zh_hans
  text: 七个荒年开始来临，正如约瑟所说的。各地都有饥荒，埃及全境却有粮食[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文为“饼”，这里可泛指食物或口粮。
    reason: 说明希伯来词לֶחֶם的字面义及其在本节中较宽泛的用法。
lexical_decisions:
- source_word: וַתְּחִלֶּינָה ... לָבוֹא
  choice: 开始来临
  rationale: 保留动词的起始含义和不定式“来到”的意象，同时符合现代汉语叙事表达。
- source_word: שֶׁבַע שְׁנֵי הָרָעָב
  choice: 七个荒年
  rationale: 用简洁自然的汉语表达“七个饥荒之年”，并与创世记本段的年景语境相合。
- source_word: כַּאֲשֶׁר אָמַר יוֹסֵף
  choice: 正如约瑟所说的
  rationale: “正如”准确表达事件与约瑟先前预言相符；汉语不必另用时态标示先后。
- source_word: וַיְהִי רָעָב
  choice: 都有饥荒
  rationale: 在地点短语“各地”之后采用自然的存现表达，不增添原文没有的戏剧色彩。
- source_word: בְּכָל הָאֲרָצוֹת
  choice: 各地
  rationale: 保留复数地域的广泛范围，同时避免用现代政治意味较强的“各国”。
- source_word: וּבְכָל אֶרֶץ מִצְרַיִם
  choice: 埃及全境却
  rationale: וּ形式上是“和”，但上下文构成明显对比，汉语用“却”自然呈现这一关系；“全境”对应“埃及全地”。
- source_word: הָיָה לָחֶם
  choice: 有粮食
  rationale: לֶחֶם字面为“饼”，也常泛指食物；本段涉及埃及储备谷物，译作“粮食”既自然又贴合语境，并以脚注保留字面信息及较宽泛的可能含义。
