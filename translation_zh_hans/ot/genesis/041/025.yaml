base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/025.yaml
  text: Then Joseph said to Pharaoh[a], “Pharaoh’s dreams are one[b]; what God is doing he has declared to Pharaoh.”
translation:
  language: zh_hans
  text: 约瑟对法老说：“法老所做的梦其实是同一个[a]；神要做的事[b]，已经告诉法老了。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文用单数“梦”；结合上下文，这是把法老的两个梦看作一个统一的信息。也可译作“法老的两个梦是一回事”。
    reason: lexical_alternative
  - marker: b
    text: “要做”也可译作“正在做”或“将要做”。原文分词本身未明确限定时间；在这里也可能指神即将成就的事。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 叙事中的连续式推进情节；现代汉语通常无需另加“然后”，由语序即可自然表达承接关系。
- source_word: חֲלוֹם פַּרְעֹה אֶחָד הוּא
  choice: 法老的梦是一个
  rationale: 保留希伯来文单数“梦”和谓语“一个”，表达两个梦构成一个统一信息；脚注说明其语境含义，避免在正文中直接释义为“意思相同”。
- source_word: הָאֱלֹהִים
  choice: 神
  rationale: 此处是对独一、确定之神的指称；“神”符合现代中文圣经语体，也不额外加入冠词含义。
- source_word: עֹשֶׂה
  choice: 正在做
  rationale: 贴近希伯来文分词的进行性表达，同时保留它在上下文中也可指即将施行之事的时间张力。
- source_word: הִגִּיד
  choice: 已经……说明了
  rationale: 使役词形在此表示告知、使人知道；“说明”既自然，又符合神借梦向法老揭示事情的语境。
theological_decisions:
- issue: עֹשֶׂה所表达的行动时间
  choice: 正在做
  alternative: 将要做／正要做
  rationale: 希伯来文分词本身没有明确限定为将来；正文保留较直接的进行性措辞，并在脚注交代语境中的临近将来理解，以免把未明说的时态绝对化。
- issue: 两个梦与“一个”的关系
  choice: 保留“梦是一个”
  alternative: 两个梦是一回事／两个梦意思相同
  rationale: 原文刻意使用单数“梦”和“一个”，强调启示的统一性；直译可保存这种表达及其神学张力，语境解释放入脚注。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留原文“梦是一个”的简洁结构，并用脚注帮助读者理解；后半句保留神为主动者及“向法老说明”的启示语气。
