  text: וְ/כָל הָ/אָ֨רֶץ֙ בָּ֣אוּ מִצְרַ֔יְמָ/ה לִ/שְׁבֹּ֖ר אֶל יוֹסֵ֑ף כִּֽי חָזַ֥ק הָ/רָעָ֖ב בְּ/כָל הָ/אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/057.yaml
  text: And all the earth came to Egypt to Joseph to buy grain[a], because the famine was severe in all the earth.
translation:
  language: zh_hans
  text: 全地[a]的人都来到埃及，到约瑟那里买粮，因为全地的饥荒十分严重。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “全地”也可译作“各地”“全境”或“全世界”。希伯来语 אֶרֶץ 可指“大地”“土地”或“国家、地区”；这里很可能泛指受饥荒影响的广大地区。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל הָאָרֶץ
  choice: 全地的人
  rationale: 原文直译为“全地”，并以其作“来到”的主语，是以地域代指其中的人。中文补出“的人”，使表达自然，同时保留其广泛、概括性的叙事范围。
- source_word: בָּאוּ מִצְרַיְמָה
  choice: 来到埃及
  rationale: בוא 表示来、进入，מִצְרַיְמָה 的方向词尾表示朝向埃及；“来到埃及”自然体现这一方向。
- source_word: לִשְׁבֹּר
  choice: 买粮
  rationale: שׁבר 在饥荒语境中专指购买、取得粮食；译作“买粮”明确表达原文在本叙事中的惯用含义。
- source_word: אֶל יוֹסֵף
  choice: 到约瑟那里
  rationale: 保留介词 אֶל 的趋向意义，也自然表达众人前往负责粮食供应的约瑟那里，而不改译成解释性更强的“向约瑟买”。
- source_word: כִּי
  choice: 因为
  rationale: 此处引出众人来到埃及的原因，“因为”清楚表达因果关系。
- source_word: חָזַק הָרָעָב
  choice: 饥荒十分严重
  rationale: חזק 字面有“强盛、加剧”之意，以“严重”搭配“饥荒”符合现代汉语，同时保留其强烈程度。
- source_word: בְּכָל הָאָרֶץ
  choice: 全地
  rationale: 与句首的广泛表述相呼应，保留原文重复及强调；不擅自缩小为仅指埃及。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“全地的人”既避免中文中“全地来到”的生硬拟人表达，也保存希伯来原文以地域代指居民的广泛语气；句末再次使用“全地”，保留原文的重复强调。
