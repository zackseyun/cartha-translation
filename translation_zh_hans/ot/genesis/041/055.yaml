  - severity: low
    issue: “饥饿了”作为“全地”的谓语不如“挨饿了”自然。
    rationale: “全地都挨饿了”可指全境居民普遍受饥饿，符合汉语叙事习惯，并不把原文扩展为明确的“发生饥荒”。
