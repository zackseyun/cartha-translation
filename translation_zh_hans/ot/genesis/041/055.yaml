base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/055.yaml
  text: And all the land of Egypt became hungry[a], and the people cried out to Pharaoh for bread. Pharaoh said to all Egypt, “Go to Joseph. What he says to you, do.”
translation:
  language: zh_hans
  text: 埃及全地都挨饿了，百姓就向法老呼求，要粮食。法老对全埃及的人说：“你们到约瑟那里去；他对你们说什么，你们就做什么。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּרְעַב
  choice: 都饥饿了
  rationale: 保留רעב动词所表达的饥饿状态及叙事进展；不直接译成“遭遇饥荒”，以免把动词的含义解释得过满。
- source_word: כָּל אֶרֶץ מִצְרַיִם
  choice: 埃及全地
  rationale: 明确保留原文“地”的成分，同时符合现代汉语圣经叙事的自然表达。
- source_word: וַיִּצְעַק הָעָם
  choice: 百姓就向法老呼求
  rationale: “呼求”传达צעק在困苦中迫切求助的语气，比普通的“呼喊”更切合语境。
- source_word: לַלָּחֶם
  choice: 要粮食
  rationale: לֶחֶם字面可指“饼、食物”；在全国饥荒和储粮分配的语境中，“粮食”比“饼”自然，也保留其基本食物的所指。
- source_word: לְכָל מִצְרַיִם
  choice: 对全埃及的人
  rationale: 原文以地名集合性地指全国民众；汉语补出“的人”，避免“对全埃及说”的生硬，同时不把范围缩窄。
- source_word: לְכוּ אֶל יוֹסֵף
  choice: 你们到约瑟那里去
  rationale: 准确表达复数命令式和אֶל所指的趋向，使用通行中文人名“约瑟”。
- source_word: אֲשֶׁר יֹאמַר לָכֶם תַּעֲשׂוּ
  choice: 他吩咐你们什么，你们就做什么
  rationale: 用“什么……就做什么”体现原文关系结构及前置强调；“吩咐”符合约瑟受权管理粮食的语境，但不增添命令的具体内容。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。保留“埃及全地”的整体范围，并将地名的集合用法自然展开为“全埃及的人”。本节无需脚注；所给英文脚注内容实际对应末句语序，而其脚注标记却置于“became hungry”之后，二者不一致，因此未沿用。
