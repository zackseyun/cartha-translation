revisions:
- from: 埃及全地都饥饿了，百姓就向法老呼求，要粮食。法老对全埃及的人说：“你们到约瑟那里去；他吩咐你们什么，你们就做什么。”
  to: 埃及全地都挨饿了，百姓就向法老呼求，要粮食。法老对全埃及的人说：“你们到约瑟那里去；他对你们说什么，你们就做什么。”
  rationale: 作两处轻微修订：以“挨饿了”使“全地”作主语的现代汉语更自然，同时维持原文动词所表达的饥饿状态；以“他对你们说什么”贴近原文“说”，不预设为正式吩咐。英文审计轨迹中的脚注标记与其说明对象不一致，且中文修订文并无需要借此消除的歧义，因此不设脚注。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T04:21:56Z'
review_pass:
  verdict: revise
  source_fidelity: 原文“וַתִּרְעַב”是动词，表达埃及全地陷入饥饿；“埃及全地都饥饿了”基本忠实。百姓向法老为“粮”（לֶחֶם，字面为饼）呼求，以及法老命众人去见约瑟并照他所说的做，均已准确传达。末句的“吩咐”比原文泛指的“说”稍加强了命令色彩，宜改为“说”。
  naturalness: “埃及全地都饥饿了”略显生硬；“埃及全地都挨饿了”在现代汉语中更自然，也仍保留动词性和叙事进展。“要粮食”通顺，但“求粮食”更直接对应向法老呼求的内容。
  terminology: “法老”“约瑟”均为通行且恰当的中文圣经人名和称谓。“粮食”在本节饥荒及储粮语境中可自然表达 לֶחֶם 的实际所指，无须改作较狭义的“饼”。
