  text: שֶׁ֧בַע פָּרֹ֣ת הַ/טֹּבֹ֗ת שֶׁ֤בַע שָׁנִים֙ הֵ֔נָּה וְ/שֶׁ֤בַע הַֽ/שִּׁבֳּלִים֙ הַ/טֹּבֹ֔ת שֶׁ֥בַע שָׁנִ֖ים הֵ֑נָּה חֲל֖וֹם אֶחָ֥ד הֽוּא׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/026.yaml
  text: The seven good cows are seven years[a], and the seven good ears of grain are seven years; it is one dream.
translation:
  language: zh_hans
  text: 七头好母牛就是七年，七个好穗子[a]也是七年；这是同一个梦。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“谷穗”。原文所用的词指禾秆顶端结籽的部分。
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּרֹת
  choice: 母牛
  rationale: 该词在法老的梦中具体指雌性的牛；“母牛”准确而自然。
- source_word: הַטֹּבֹת
  choice: 好
  rationale: 保留原文宽泛的“好”，并与梦中意象直接对应，不限缩为“健壮”或“饱满”。
- source_word: שָׁנִים
  choice: 年
  rationale: 原文明说这些梦中象征所代表的是年份。
- source_word: שִׁבֳּלִים
  choice: 穗子
  rationale: 指禾秆顶端结籽的部分；“穗子”在现代汉语中简洁清楚，也避免武断指定某一种谷物。
- source_word: חֲלוֹם אֶחָד הוּא
  choice: 这是同一个梦
  rationale: 保留原文对“一”的强调，表明两组象征构成同一个梦的信息。
- source_word: הֵנָּה
  choice: 就是／也是
  rationale: 希伯来语阴性复数代词在此起系词作用；汉语用“就是”和承接性的“也是”自然表达。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。“七头”用于母牛，“七个”用于穗子，符合现代汉语量词习惯；分号体现两组象征解释完毕后对其统一性的总结。
