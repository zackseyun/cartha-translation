base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/010.yaml
  text: Pharaoh was angry with his servants[a], and he put me in custody in the house of the captain of the guard[b], me and the chief baker.
translation:
  language: zh_hans
  text: 法老向他的臣仆发怒，就把我和首席烘焙师拘禁[a]在护卫长[b]的府中。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “拘禁”原文指在看守之下、行动受限制，不一定表示被关在正式的监狱建筑里。
    reason: lexical_alternative
  - marker: b
    text: “护卫长”是宫廷职衔；原文较直译可作“屠宰者（或行刑者）之长”。
    reason: lexical_alternative
lexical_decisions:
- source_word: קָצַף
  choice: 发怒
  rationale: 该动词表示愤怒；“发怒”自然、庄重，又不额外强化为“暴怒”或“震怒”。
- source_word: עֲבָדָיו
  choice: 他的臣仆
  rationale: 这里所指的是在王宫任职的酒政和膳长；“臣仆”既保留他们从属于法老的关系，也体现宫廷职分，避免“奴隶”可能带来的过度限定。
- source_word: בְּמִשְׁמַר
  choice: 拘禁
  rationale: 该词表示受看守、被限制自由的状态；“拘禁”不把地点过度具体化为正式监狱。
- source_word: בֵּית שַׂר הַטַּבָּחִים
  choice: 护卫长的府中
  rationale: “护卫长”按约瑟叙事中的宫廷职衔表达；“府中”自然传达 בֵּית 在官员住所或官署这一语境中的含义。
- source_word: שַׂר הָאֹפִים
  choice: 御膳长
  rationale: 原文直指烘焙人员的首领；在法老宫廷语境中，“御膳长”是简洁自然的职衔表达，并表明其负责王室膳食。
- source_word: אֹתִי ... וְאֵת שַׂר הָאֹפִים
  choice: 我和御膳长
  rationale: 以现代汉语并列宾语自然表达两名被拘禁者，完整保留原文所指。
theological_decisions: []
