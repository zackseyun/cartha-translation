  text: וְ/הָ/רָעָ֣ב הָיָ֔ה עַ֖ל כָּל פְּנֵ֣י הָ/אָ֑רֶץ וַ/יִּפְתַּ֨ח יוֹסֵ֜ף אֶֽת כָּל אֲשֶׁ֤ר בָּ/הֶם֙ וַ/יִּשְׁבֹּ֣ר לְ/מִצְרַ֔יִם וַ/יֶּחֱזַ֥ק הָֽ/רָעָ֖ב בְּ/אֶ֥רֶץ מִצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/056.yaml
  text: And the famine was over all the face of the earth[a], and Joseph opened all that was in them and sold grain to Egypt[b], and the famine grew severe in the land of Egypt.
translation:
  language: zh_hans
  text: 饥荒遍及全地[a]。约瑟就打开所有的粮仓[b]，向埃及人售粮；埃及地的饥荒越来越严重。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “全地”也可译作“整个地区”；原文可指大地，也可指相关地域。
    reason: lexical_alternative
  - marker: b
    text: 原文的表达十分紧缩，字面上近似“打开所有在其中的”；“其中”所指的储粮处并未明说。根据上下文，可理解为打开所有的粮仓。
    reason: implicit_object
lexical_decisions:
- source_word: הָרָעָב
  choice: 饥荒
  rationale: רָעָב在本叙事中指区域性的严重粮食危机；“饥荒”比“饥饿”更切合上下文。
- source_word: עַל כָּל פְּנֵי הָאָרֶץ
  choice: 遍及全地
  rationale: “遍及”自然传达“在……整个表面上”的希伯来语表达；הָאָרֶץ既可指大地，也可指相关地域，因此用“全地”保留其范围上的含混。
- source_word: וַיִּפְתַּח יוֹסֵף אֶת כָּל אֲשֶׁר בָּהֶם
  choice: 约瑟就打开所有的粮仓
  rationale: 原文表达省略而紧缩，直译近似“约瑟打开所有其中所有的”，没有明说容器名称。结合储粮和售粮的语境，以“粮仓”补足隐含对象，令现代汉语清楚可懂，并用脚注保留原文形式。
- source_word: וַיִּשְׁבֹּר לְמִצְרַיִם
  choice: 向埃及人售粮
  rationale: שׁבר在此是“出售粮食、供应粮食”的习语；补出“粮”可避免汉语含混。לְמִצְרַיִם在语境中以国家名称统称其居民，故译作“向埃及人”。
- source_word: וַיֶּחֱזַק הָרָעָב
  choice: 饥荒越来越严重
  rationale: חזק本义为“强盛、变强”，以饥荒为主语时表示灾情加剧；“越来越严重”自然表达持续恶化。
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: 埃及地
  rationale: 保留“埃及之地”的叙事措辞，同时符合现代中文圣经语体。
theological_decisions: []
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“粮仓”是为补足希伯来语省略成分所作的语境化表达；脚注明确原文的紧缩措辞。“向埃及人”避免“向埃及售粮”在现代汉语中可能产生的生硬感。
