base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/001.yaml
  text: At the end of two full years[a], Pharaoh dreamed, and behold[b], he was standing by the Nile.
translation:
  language: zh_hans
  text: 整整两年过去后[a]，法老做了一个梦：看哪，他正站在尼罗河边[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“两年之日”，是指完整两年时光的希伯来语表达。
    reason: lexical_alternative
  - marker: b
    text: 或译“河”；在这里的埃及背景中，这条河指尼罗河。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי מִקֵּץ
  choice: ……过去后
  rationale: וַיְהִי承接叙事，מִקֵּץ指一段时期到达终点；合译为“……过去后”既自然，也准确交代新的时间节点。
- source_word: שְׁנָתַיִם יָמִים
  choice: 整整两年
  rationale: 原文直译为“两年之日”，是强调完整时段的希伯来语表达；“整整两年”传达其完整性。
- source_word: פַרְעֹה
  choice: 法老
  rationale: 采用现代汉语中对埃及君王称号的通行译法。
- source_word: חֹלֵם
  choice: 做了一个梦
  rationale: 该分词在叙事中引出梦境。汉语用“做了一个梦”比机械保留进行体更自然，并与随后呈现的梦中场景衔接。
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留原文引人注意、使梦境骤然呈现的鲜明话语标记及其庄重文学色彩。
- source_word: עֹמֵד
  choice: 正站在
  rationale: 分词描绘持续中的场景；“正站在”保留其进行状态。
- source_word: עַל
  choice: 在……边
  rationale: 在河流场景中，עַל表示位于河旁，而非立在水面上；“在……边”符合现代汉语习惯。
- source_word: הַיְאֹר
  choice: 尼罗河
  rationale: יְאֹר虽可泛指河流，但在本段埃及背景中具体指尼罗河；明译其所指更清楚。
