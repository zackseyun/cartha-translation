base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/044.yaml
  text: Then Pharaoh said to Joseph[a], “I am Pharaoh[b], and without you no man will lift up his hand or his foot in all the land of Egypt.”
translation:
  language: zh_hans
  text: 法老对约瑟说：“我是法老；在埃及全地，任何人没有你的许可[a]，都不得举手抬脚[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“离了你”或“除你以外”，意思是埃及没有人可以越过约瑟的权柄自行行动。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文作“举起他的手和他的脚”，是指采取任何行动或有所举动。
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 又……说
  rationale: 承接前文并推进叙事；“又”符合现代汉语叙事习惯，也保留希伯来语连续叙事形式的衔接作用。
- source_word: פַּרְעֹה
  choice: 法老
  rationale: 这是该埃及君王称号在现代汉语圣经语境中的标准译法。
- source_word: אֲנִי פַרְעֹה
  choice: 我是法老
  rationale: 直接保留无系词句的郑重自我宣告，体现法老以君王身份颁令的语气，而不额外加入“本人”或“确实”等解释。
- source_word: וּבִלְעָדֶיךָ
  choice: 未经你的许可
  rationale: 此处并非单指约瑟不在场，而是说埃及人不得越过约瑟所获授的权柄自行行动。正文采用自然明确的功能对等表达，脚注保留较贴近字面的译法。
- source_word: לֹא יָרִים
  choice: 不得举
  rationale: 使役词干在此意为“举起”；在君王命令的语境中，“不得”自然表达禁止和授权限制。
- source_word: אִישׁ
  choice: 任何人
  rationale: 希伯来语阳性单数在否定句中具有泛指意义；“任何人”准确表达全称范围，现代汉语也更自然。
- source_word: אֶת יָדוֹ וְאֶת רַגְלוֹ
  choice: 举手抬脚
  rationale: 尽量保留“手”和“脚”的具体意象，同时用汉语对称结构表达。该说法在此泛指采取行动或有所举动，脚注加以说明，以免误解为单纯的肢体动作。
- source_word: בְּכָל אֶרֶץ מִצְרָיִם
  choice: 在埃及全地
  rationale: 贴近原文的地域范围表达，简洁而庄重。
theological_decisions:
- issue: 约瑟权柄与法老最高王权之间的关系
  choice: 把 וּבִלְעָדֶיךָ 译为“未经你的许可”，同时保留“我是法老”的宣告
  alternative: 译为“除你以外”或“没有你”
  rationale: 上下文表明约瑟获得治理全埃及的实际授权，而法老仍以君王身份颁布这项授权。该译法既不把约瑟说成取代法老，也不削弱他所得权柄的广泛程度。
translation_notes:
  register: 采用现代、庄重且易懂的叙事语言。“未经你的许可”明示原语在上下文中的授权含义；“举手抬脚”保留希伯来语意象，并以脚注解释其习语功能。两个脚注标记均紧随其实际说明的词语，而非照搬咨询层中错置的标记位置。
