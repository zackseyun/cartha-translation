  text: וַ/יֹּ֥אמֶר פַּרְעֹ֖ה אֶל יוֹסֵ֑ף רְאֵה֙ נָתַ֣תִּי אֹֽתְ/ךָ֔ עַ֖ל כָּל אֶ֥רֶץ מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/041.yaml
  text: And Pharaoh said to Joseph, “See, I have set you over all the land of Egypt.”
translation:
  language: zh_hans
  text: 法老对约瑟说：“看，我已经立你管理埃及全地。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 叙事性未完成式承接上文并推进情节；现代汉语通常无需把连接词逐字译为“于是”或“然后”，由语序自然体现叙事推进。
- source_word: פַּרְעֹה
  choice: 法老
  rationale: 这是该埃及君王称号在现代汉语圣经语境中的通行译法。
- source_word: אֶל יוֹסֵף
  choice: 对约瑟
  rationale: 自然表达说话的对象，并采用该人名的通行汉语译名。
- source_word: רְאֵה
  choice: 看
  rationale: 保留命令式及其引人注意、郑重宣告的语用功能；“看”比省略不译更贴近原文，也比“看哪”略为现代自然。
- source_word: נָתַתִּי אֹתְךָ עַל
  choice: 我已经立你管理
  rationale: נָתַתִּי 字面为“我已给/置”，与 עַל 连用时表示把某人置于某领域之上、授予治理权。“立你管理”在现代汉语中清楚表达任命与权柄，同时避免生硬的“把你放在……之上”。
- source_word: כָּל אֶרֶץ מִצְרָיִם
  choice: 埃及全地
  rationale: 保留 כָּל 的完整范围及 אֶרֶץ 的地域含义；“埃及全地”简洁、庄重且为现代读者易懂。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。保留“看”这一郑重提示语，并以“立你管理”传达行政任命及统辖含义，不添加原文未明说的官职名称。
