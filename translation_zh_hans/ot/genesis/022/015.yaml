  text: וַ/יִּקְרָ֛א מַלְאַ֥ךְ יְהוָ֖ה אֶל אַבְרָהָ֑ם שֵׁנִ֖ית מִן הַ/שָּׁמָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/015.yaml
  text: And the angel of Yahweh called to Abraham a second time from heaven,[a]
translation:
  language: zh_hans
  text: 雅威的天使[a]第二次从天上呼唤亚伯拉罕。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“雅威的使者”。
    reason: 希伯来语מַלְאָךְ既可译为“天使”，也可译为“使者”。
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: 呼唤
  rationale: 该叙事性动词表示向特定对象发声召唤；“呼唤”自然准确，不额外加入高声喊叫或正式宣告的意味。
- source_word: מַלְאַךְ יְהוָה
  choice: 雅威的天使
  rationale: מַלְאָךְ既可指一般“使者”，也可指天上的“天使”；本处从天上发声，正文采用现代汉语中自然的“天使”，并以脚注保留“使者”这一词义可能。神名יְהוָה音译为“雅威”，不以称号替代。
- source_word: אֶל אַבְרָהָם
  choice: 呼唤亚伯拉罕
  rationale: 介词אֶל标示呼唤的对象；汉语无需另译“向”，直接说“呼唤亚伯拉罕”更自然。
- source_word: שֵׁנִית
  choice: 第二次
  rationale: 保留希伯来文明确的序数含义，比仅译作“再次”更精确。
- source_word: מִן הַשָּׁמַיִם
  choice: 从天上
  rationale: שָׁמַיִם虽为复数形式，在此惯用表达中指天上的领域；“从天上”符合现代汉语习惯，也保留叙事语境。
theological_decisions:
- issue: מַלְאַךְ יְהוָה的身份与译法
  choice: 正文译作“雅威的天使”，脚注保留“雅威的使者”
  alternative: 正文译作“雅威的使者”
  rationale: 译文不判定这位天使是受造的天上使者，还是神以特殊方式的显现；只按词语及本节“从天上”呼唤的语境翻译，并保留词汇上的另一可能。
- issue: 神名יְהוָה的处理
  choice: 雅威
  alternative: 耶和华；主
  rationale: 采用对四字神名的现代汉语音译，以保留其作为以色列之神专名的性质，而不以“主”这一称号替代。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。语序贴近汉语叙事习惯；不补入原文没有的“说”，因为后续引语动词属于下一节。
