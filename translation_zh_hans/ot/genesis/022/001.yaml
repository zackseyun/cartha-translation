id: GEN.22.1
reference: Genesis 22:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יְהִ֗י אַחַר֙ הַ/דְּבָרִ֣ים הָ/אֵ֔לֶּה וְ/הָ֣/אֱלֹהִ֔ים נִסָּ֖ה אֶת אַבְרָהָ֑ם וַ/יֹּ֣אמֶר אֵלָ֔י/ו אַבְרָהָ֖ם וַ/יֹּ֥אמֶר הִנֵּֽנִ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/001.yaml
  text: After these things[a], God tested Abraham and said to him, “Abraham!” And he said[b], “Here I am.”
translation:
  language: zh_hans
  text: 这些事以后，上帝考验[a]亚伯拉罕，对他说：“亚伯拉罕！”他回答：“我在这里。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“试验”。
    reason: 希伯来语נסה可表示检验、试验或考验；正文采用更适合以人为对象的现代汉语表达。
lexical_decisions:
- source_word: וַיְהִי
  choice: 不单独译出
  rationale: 这里的叙事形式用于承接并转入下一段；汉语以“这些事以后”开篇，已自然表达这一转折，无须另加“事情发生了”或“后来”。
- source_word: אַחַר הַדְּבָרִים הָאֵלֶּה
  choice: 这些事以后
  rationale: 保留דְּבָרִים的宽泛含义，并清楚衔接前文；“事”比“事件”少一层解释。
- source_word: הָאֱלֹהִים
  choice: 上帝
  rationale: 此处指独一的上帝，并非神名יהוה；现代汉语中译作“上帝”自然、庄重。
- source_word: נִסָּה
  choice: 考验
  rationale: 该动词的Piel形在此表示检验、考验；“考验”适用于人的忠诚与顺服，也不会误导为引诱人作恶。
- source_word: וַיֹּאמֶר אֵלָיו
  choice: 对他说
  rationale: 准确表达אמר加间接宾语的常见叙事用法；主语仍是前面的“上帝”。
- source_word: אַבְרָהָם
  choice: 亚伯拉罕！
  rationale: 这是直接呼唤，以感叹号表现呼语语气，不额外添加称谓。
- source_word: וַיֹּאמֶר
  choice: 他回答
  rationale: 在呼唤与回应的对话结构中，汉语用“回答”比再次使用“说”更自然，且不增加实质含义。
- source_word: הִנֵּנִי
  choice: 我在这里
  rationale: 这一惯用语表达说话者在场、留心并准备回应；“我在这里”既自然，也保留其开放而恭敬的语气。
theological_decisions:
- issue: 上帝作主语时נסה的含义
  choice: 上帝考验亚伯拉罕
  alternative: 上帝试验亚伯拉罕；上帝试探亚伯拉罕
  rationale: 本段语境中的动词指检验或考验，而非引诱作恶。“考验”保留叙事本身所带来的神学张力，却不以现代汉语“试探”常有的诱惑含义误导读者。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“这些事以后”简洁承接前文；对话保持短促，以呈现呼唤与立即回应的节奏。
