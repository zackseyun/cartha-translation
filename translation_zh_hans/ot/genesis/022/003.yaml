  text: וַ/יַּשְׁכֵּ֨ם אַבְרָהָ֜ם בַּ/בֹּ֗קֶר וַֽ/יַּחֲבֹשׁ֙ אֶת חֲמֹר֔/וֹ וַ/יִּקַּ֞ח אֶת שְׁנֵ֤י נְעָרָי/ו֙ אִתּ֔/וֹ וְ/אֵ֖ת יִצְחָ֣ק בְּנ֑/וֹ וַ/יְבַקַּע֙ עֲצֵ֣י עֹלָ֔ה וַ/יָּ֣קָם וַ/יֵּ֔לֶךְ אֶל הַ/מָּק֖וֹם אֲשֶׁר אָֽמַר ל֥/וֹ הָ/אֱלֹהִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/003.yaml
  text: Abraham rose early in the morning[a], saddled his donkey, took two of his young men with him and Isaac his son, split the wood for a burnt offering, and arose and went to the place that God had told him.
translation:
  language: zh_hans
  text: 亚伯拉罕清早起来，给自己的驴上了鞍，带上两个年轻人[a]和他的儿子以撒，又劈了燔祭用的柴，然后起身前往上帝告诉他的地方。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“两个仆人”或“两个随从”。希伯来语 נְעָרִים 可按语境指年轻男子，也可指男性仆人或随从。
    reason: 保留原词在年龄与身份之间的词义幅度，避免正文过度限定。
lexical_decisions:
- source_word: וַיַּשְׁכֵּם אַבְרָהָם בַּבֹּקֶר
  choice: 亚伯拉罕清早起来
  rationale: “清早起来”自然表达 השׁכים 所含的早起之意，也保留叙事对行动及时性的强调。
- source_word: וַיַּחֲבֹשׁ אֶת־חֲמֹרוֹ
  choice: 给驴备上鞍
  rationale: חבש 在旅行语境中指给牲口系上鞍具；此译符合现代汉语习惯，又不过度细化装备。
- source_word: שְׁנֵי נְעָרָיו אִתּוֹ
  choice: 带上两个年轻人[a]
  rationale: נְעָרִים 可指年轻男子，也可按其身份指仆人或随从。正文保留年龄层面的基本词义，脚注说明身份层面的可能译法；“带上”自然包含 אִתּוֹ 的同行含义。
- source_word: יִצְחָק בְּנוֹ
  choice: 他的儿子以撒
  rationale: 以自然汉语明确保留以撒与亚伯拉罕的父子关系。
- source_word: וַיְבַקַּע עֲצֵי עֹלָה
  choice: 劈了燔祭用的柴
  rationale: בקע 是“劈开”；עֹלָה 是特定祭物名称“燔祭”。“燔祭用的柴”准确表达木柴的用途。
- source_word: וַיָּקָם וַיֵּלֶךְ
  choice: 然后起身前往
  rationale: 保留“起身”和“去”两个连续动作，同时用现代汉语顺畅表达叙事推进。
- source_word: אֶל־הַמָּקוֹם אֲשֶׁר אָמַר־לוֹ הָאֱלֹהִים
  choice: 前往上帝告诉他的地方
  rationale: אמר לו 在此前指示的语境中可自然译为“告诉他”；不补入原文未明说的地点性质。
theological_decisions:
- issue: 祭祀术语 עֹלָה 的译法
  choice: 燔祭
  alternative: 全烧祭
  rationale: “燔祭”是简体中文圣经传统中成熟而准确的专门用语，指祭物在坛上焚烧献上的祭类；不额外引入神学解释。
- issue: נְעָרִים 所指人员的身份
  choice: 年轻人
  alternative: 仆人／随从
  rationale: 该词兼有年龄和侍从身份方面的用法；上下文显示他们同行协助，却未要求正文明确其法律或社会身份，因此保留较宽的“年轻人”，并用脚注呈现其他可能。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“给驴备上鞍”“劈了燔祭用的柴”符合自然汉语；保留两次“起来／起身”，以反映希伯来文连续动作的节奏。
