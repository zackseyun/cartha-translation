reference: Genesis 22:9
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יָּבֹ֗אוּ אֶֽל הַ/מָּקוֹם֮ אֲשֶׁ֣ר אָֽמַר ל֣/וֹ הָ/אֱלֹהִים֒ וַ/יִּ֨בֶן שָׁ֤ם אַבְרָהָם֙ אֶת הַ/מִּזְבֵּ֔חַ וַֽ/יַּעֲרֹ֖ךְ אֶת הָ/עֵצִ֑ים וַֽ/יַּעֲקֹד֙ אֶת יִצְחָ֣ק בְּנ֔/וֹ וַ/יָּ֤שֶׂם אֹת/וֹ֙ עַל הַ/מִּזְבֵּ֔חַ מִ/מַּ֖עַל לָ/עֵצִֽים־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/009.yaml
  text: Then they came to the place that God had told him[a], and Abraham built the altar there and arranged the wood. He bound Isaac his son and placed him on the altar[c][b], on top of the wood.
translation:
  language: zh_hans
  text: 他们来到上帝所告诉他的那个地方[a]。亚伯拉罕在那里筑了祭坛[b]，摆好木柴；他捆绑了儿子以撒，把他放在祭坛上摆好的木柴上[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“上帝对他说的地方”。希伯来文直译为“上帝对他说的地方”。
    reason: 保留אָמַר לְ在此处可贴近形式地译为“对他说”、也可按语境译为“告诉他”的可能。
  - marker: b
    text: 希伯来文“祭坛”一词带定冠词。现代汉语通常不以冠词表达这一细节。
    reason: 说明原文的定指形式，同时避免将其误作已有的祭坛或加入超出文本的推断。
  - marker: c
    text: 希伯来文直译“在木柴之上”，即在摆好的木柴上面。
    reason: 说明原文的空间表达：以撒是在祭坛上、并在已摆好的木柴之上。
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: 他们到了
  rationale: 叙事性连续形式推进情节；“到了”自然表达抵达，并保留复数主语。
- source_word: אֲשֶׁר אָמַר לוֹ הָאֱלֹהִים
  choice: 上帝对他说的那个地方
  rationale: 尽量保留אָמַר לְ的“对他说”结构及关系从句的限定作用，不把上帝如何说明该地点解释得过细。
- source_word: וַיִּבֶן שָׁם אַבְרָהָם אֶת הַמִּזְבֵּחַ
  choice: 亚伯拉罕在那里筑起祭坛
  rationale: “筑起祭坛”符合现代汉语习惯；希伯来文名词带定冠词的细节另以脚注说明，避免用生硬且可能误导为既有建筑的“那座祭坛”。
- source_word: וַיַּעֲרֹךְ אֶת הָעֵצִים
  choice: 摆好木柴
  rationale: ערך在献祭准备的语境中指按次序摆放；“摆好”简洁自然，也保留准备妥当的意味。
- source_word: וַיַּעֲקֹד
  choice: 捆绑起来
  rationale: עקד明确表示捆绑；此译法不淡化动作，也不增添捆绑方式等原文未说明的细节。
- source_word: יִצְחָק בְּנוֹ
  choice: 儿子以撒
  rationale: 符合自然汉语语序，同时保留亲子关系在这一严峻场景中的明示。
- source_word: וַיָּשֶׂם אֹתוֹ עַל הַמִּזְבֵּחַ
  choice: 放在祭坛上
  rationale: שׂים是一般性的放置动词；“放”不额外限定动作姿态。
- source_word: מִמַּעַל לָעֵצִים
  choice: 置于木柴上面
  rationale: 清楚表达以木柴为参照的上方位置；结合祭坛场景，这里指放在已经摆好的木柴之上。
theological_decisions:
- issue: 祭坛的特指性
  choice: 正文译“祭坛”，脚注说明希伯来文带定冠词
  alternative: 那座祭坛／一座祭坛
  rationale: 原文的定冠词使祭坛具有特指意味，但现代汉语通常不借助冠词表达这一点。“那座祭坛”容易使读者误以为祭坛原已存在，“一座祭坛”则会明确加入不定意味；正文采用无冠词的自然表达，并由脚注保存原文信息。
- issue: 捆绑行为的表述
  choice: 把儿子以撒捆绑起来
  alternative: 把儿子以撒绑起来
  rationale: “捆绑”直接反映עקד的词义和行动的严肃性，既不弱化，也不借传统术语加入正文之外的神学解释。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。句法顺应汉语叙事节奏，以连续动词呈现原文一连串动作；不用古奥表达，也不补充以撒的姿势、反应或捆绑方式。
