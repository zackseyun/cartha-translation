base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/020.yaml
  text: After these things, it was reported to Abraham, saying, “Look, Milcah also has borne sons to your brother Nahor:”
translation:
  language: zh_hans
  text: 这些事以后，有人告诉亚伯拉罕说：“看哪，密迦也为你的兄弟拿鹤生了儿子：”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי הַדְּבָרִים הָאֵלֶּה
  choice: 这些事以后
  rationale: 自然表达希伯来叙事中的时间推进；וַיְהִי在此主要承担叙事衔接功能，无须另译“现在”或“于是”。
- source_word: וַיֻּגַּד לְאַבְרָהָם לֵאמֹר
  choice: 有人告诉亚伯拉罕说
  rationale: 原文是无主语的被动式“亚伯拉罕被告知”，汉语用不定主语“有人告诉”更自然，同时保留לֵאמֹר所引出的直接引语。
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留提示听者注意新消息的语用力量，并采用庄重而为现代读者熟悉的圣经叙事措辞。
- source_word: יָלְדָה ... בָּנִים
  choice: 生了儿子
  rationale: בָּנִים为复数，汉语“儿子”本身可作无标记复数；下文将逐一列名。
- source_word: לְנָחוֹר אָחִיךָ
  choice: 给你兄弟拿鹤
  rationale: לְ标示孩子归属于父亲拿鹤；“你兄弟”忠实保留对亚伯拉罕的第二人称关系表达。
theological_decisions: []
translation_notes:
