base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/019.yaml
  text: So Abraham returned to his young men[a], and they arose and went together to Beersheba, and Abraham stayed in Beersheba.
translation:
  language: zh_hans
  text: 于是，亚伯拉罕回到随从那里[a]；他们起身，一同前往别是巴。亚伯拉罕就住在别是巴。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文只说亚伯拉罕回到随从那里；本节没有提到以撒，尽管此前的叙事中以撒与他同在。
    reason: 保留原文没有说明以撒此时行动的叙事张力。
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: 回到
  rationale: שׁוב在叙事中通常表示“返回”。“回到……那里”自然表达亚伯拉罕返回等候之人所在之处。
- source_word: נְעָרָיו
  choice: 随从
  rationale: נַעַר可指年轻人、仆人或随从；结合22:3、5中这些人陪同亚伯拉罕出行的语境，“随从”既自然，也不过分强调年龄或奴仆身份。
- source_word: וַיָּקֻמוּ
  choice: 起身
  rationale: קום在连续叙事中常表示开始下一步行动；“起身”简洁庄重，并保留动作顺序。
- source_word: וַיֵּלְכוּ יַחְדָּו
  choice: 一同前往
  rationale: הלך与יַחְדָּו合用，表示共同前行；“一同前往”不额外限定行进方式。
- source_word: בְּאֵר שָׁבַע
  choice: 别是巴
  rationale: 采用该地名在现代中文圣经传统中的通行译名。
- source_word: וַיֵּשֶׁב
  choice: 住在
  rationale: ישׁב在地理语境中可表示居住或停留；“住在”自然、清楚，同时不擅自加入“定居下来”的新含义。
theological_decisions:
- issue: 经文只明说亚伯拉罕从山上回到随从那里，没有在这一分句中提及以撒
  choice: 正文照原文只点名亚伯拉罕，不补入以撒
  alternative: 将以撒补作同行返回者，或明确说明他也一同回来
  rationale: 希伯来文明确以亚伯拉罕为返回的主语，却未说明以撒此时如何行动。译文应保留这一叙事张力，不以推断补足原文。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“于是”“起身”“一同前往”保持希伯来文连续动作的节奏；分号和句号使中文层次清楚。
