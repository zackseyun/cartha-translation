base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/002.yaml
  text: And he said[a], “Please take your son, your only one, whom you love—Isaac—and go to the land of Moriah, and offer him there as a burnt offering on one of the mountains that I will tell you.”
translation:
  language: zh_hans
  text: 他说：“请带上你的儿子，就是你独一的、你所爱的以撒，往摩利亚地去，在我将告诉你的一座山上，把他献为燔祭。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נָא
  choice: 请
  rationale: 此语气词在这里缓和命令语气，现代汉语用“请”最自然；不译作带有时间意味的“现在”。
- source_word: בִּנְךָ
  choice: 你的儿子
  rationale: 直接、自然地表达名词“儿子”及第二人称阳性单数所属后缀。
- source_word: יְחִידְךָ
  choice: 你独一的
  rationale: יָחִיד可指唯一或独特的一位。采用“独一的”并与后面的“以撒”构成同位关系，既凸显以撒在命令中的特殊地位，也不把以实玛利的存在解释掉。
- source_word: אֲשֶׁר אָהַבְתָּ
  choice: 你所爱的
  rationale: 完成式在此表达亚伯拉罕对以撒已为人所知且持续存在的爱；现代汉语用“你所爱的”自然传达这种状态。
- source_word: קַח ... וְלֶךְ לְךָ
  choice: 带上……往……去
  rationale: “带上”自然表达带着以撒同行的命令；הלך לך中的反身或切身语气不宜机械扩写，以免加入原文没有明确规定的强调。
- source_word: אֶרֶץ הַמֹּרִיָּה
  choice: 摩利亚地
  rationale: 保留专名“摩利亚”，אֶרֶץ在此译为“地”，简洁且符合圣经地理名称的汉语表达。
- source_word: וְהַעֲלֵהוּ ... לְעֹלָה
  choice: 把他献为燔祭
  rationale: עלה的使役形与עֹלָה连用时是献祭用语；“献为燔祭”既自然又保留祭物完全焚烧献上的含义。
- source_word: עַל אַחַד הֶהָרִים
  choice: 献在群山中的一座山上
  rationale: 表达从若干座山中选定一座的意思；“山”比“山丘”更符合הַר通常的词义。
- source_word: אֲשֶׁר אֹמַר אֵלֶיךָ
  choice: 我会告诉你是哪一座
  rationale: 原文动词אמר是“说、告诉”，不改译为另一动词“指示”。为使现代汉语顺畅，将关系从句拆开表达，同时保留尚未指定山峰的信息。
theological_decisions:
- issue: 以撒被称为יְחִידְךָ，而以实玛利仍然存在
  choice: 你独一的
  alternative: 你唯一的儿子；你独特的儿子
  rationale: 译文保留以撒在此命令中无可替代的特殊地位，却不武断断定这种“独一”专指生物学、应许之约或情感关系。脚注列出传统且可能的译法“你唯一的儿子”。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“带上”“往……去”“我会告诉你是哪一座”符合当代普通话习惯；保留“燔祭”这一稳定且必要的祭祀术语。
