id: GEN.22.11
reference: Genesis 22:11
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יִּקְרָ֨א אֵלָ֜י/ו מַלְאַ֤ךְ יְהוָה֙ מִן הַ/שָּׁמַ֔יִם וַ/יֹּ֖אמֶר אַבְרָהָ֣ם אַבְרָהָ֑ם וַ/יֹּ֖אמֶר הִנֵּֽנִ/י־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/011.yaml
  text: But the angel of Yahweh called to him from heaven and said[a], “Abraham, Abraham!” And he said[b], “Here I am.”
translation:
  language: zh_hans
  text: 但雅威的使者[a]从天上[b]呼唤他，说：“亚伯拉罕！亚伯拉罕！”他说：“我在这里。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“雅威的天使”。希伯来语מַלְאָךְ既可指“使者”，也可指“天使”；这里说话者来自天上，因此“天使”也很合适。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语原文采用“天”的复数形式；这里按现代汉语习惯译作“天上”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא אֵלָיו
  choice: 呼唤他
  rationale: קרא在此叙事语境中指向某人发声呼叫；“呼唤他”自然表达说话方向，又不额外强调音量。
- source_word: מַלְאַךְ יְהוָה
  choice: 雅威的使者
  rationale: מַלְאָךְ可指一般的“使者”，也可指属天的“天使”。正文用“使者”保留原词的词义幅度；“雅威”直接呈现专名יהוה，不将其改为称号。
- source_word: מִן הַשָּׁמַיִם
  choice: 从天上
  rationale: שָׁמַיִם在形式上为复数形态，但此处指属天领域；现代汉语以“从天上”表达最自然。
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: אמר是普通的言说动词，“说”是直接而自然的对应。
- source_word: אַבְרָהָם אַבְרָהָם
  choice: 亚伯拉罕！亚伯拉罕！
  rationale: 保留名字的重复，以传达呼唤的急切和亲切；感叹号符合现代汉语直接呼语的语气。
- source_word: הִנֵּנִי
  choice: 我在这里
  rationale: הִנֵּנִי是回应呼唤的惯用语，表示人在场并愿意听命；“我在这里”在现代汉语中清楚自然。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。采用“雅威”作为该专名的现代汉语音译，避免把专名改成“主”这一称号。
- issue: 是否把מַלְאַךְ יְהוָה解释为雅威本人的显现
  choice: 雅威的使者
  alternative: 雅威自己；雅威的天使
  rationale: 原文将说话者称为מַלְאַךְ，正文据此译为“使者”，不在本节中预先判定其本体身份，同时保留“天使”的词义可能。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。保留叙事中的转折、两次“说”以及亚伯拉罕名字的重复；不把“雅威的使者”进一步神学化解释。
