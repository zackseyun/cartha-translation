  yaml_path: translation/ot/genesis/022/023.yaml
  text: And Bethuel fathered Rebekah. These eight Milcah bore to Nahor[a], Abraham’s brother.
translation:
  language: zh_hans
  text: 彼土利生了利百加。这八人是密迦为亚伯拉罕的兄弟拿鹤所生的[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较贴近原文语序译作：“这八个是密迦给亚伯拉罕的兄弟拿鹤所生的。”
    reason: 保留 שְׁמֹנָה אֵלֶּה（“这八个”）在原文中的前置强调，并提供较形式对应的表达。
lexical_decisions:
- source_word: וּבְתוּאֵל
  choice: 彼土利
  rationale: 连接词 ו 在汉语连续家谱叙述中无需机械译出；人名采用现代中文圣经中通行且易辨认的译名“彼土利”。
- source_word: יָלַד
  choice: 生了
  rationale: 男性作主语时，希伯来语 יָלַד 表示生育、成为父亲；“生了”简洁自然，也避免“生出”“生养”等可能增加的含义。
- source_word: אֶת רִבְקָה
  choice: 利百加
  rationale: אֶת 是直接宾语标记，不另行翻译；רִבְקָה 采用通行中文译名“利百加”。
- source_word: שְׁמֹנָה אֵלֶּה
  choice: 这八个人
  rationale: 直译核心为“这八个”；补出量词和“人”，使现代汉语完整自然，而不额外限定其性别或身份。
- source_word: יָלְדָה
  choice: 所生的
  rationale: 女性“密迦”作主语，译为“所生的”准确表达生育关系，并保留家谱语体。
- source_word: מִלְכָּה
  choice: 密迦
  rationale: 采用现代中文圣经中通行的人名译法。
- source_word: לְנָחוֹר
  choice: 给……拿鹤
  rationale: 介词 לְ 在此家谱表达中表示密迦为拿鹤生下这些儿女；“给……生”是自然现代汉语，同时保留原文关系。
- source_word: אֲחִי אַבְרָהָם
  choice: 亚伯拉罕的兄弟
  rationale: 按原文附加说明拿鹤与亚伯拉罕的关系，表达清楚且不改变修饰对象。
