source:
  edition: WLC
  text: כִּֽי בָרֵ֣ךְ אֲבָרֶכְ/ךָ֗ וְ/הַרְבָּ֨ה אַרְבֶּ֤ה אֶֽת זַרְעֲ/ךָ֙ כְּ/כוֹכְבֵ֣י הַ/שָּׁמַ֔יִם וְ/כַ/ח֕וֹל אֲשֶׁ֖ר עַל שְׂפַ֣ת הַ/יָּ֑ם וְ/יִרַ֣שׁ זַרְעֲ/ךָ֔ אֵ֖ת שַׁ֥עַר אֹיְבָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/017.yaml
  text: that I will surely bless you[a], and I will surely multiply your offspring like the stars of the heavens and like the sand that is on the seashore[c][b]; and your offspring will possess the gate of his enemies.
translation:
  language: zh_hans
  text: 我必定赐福给你，也必使你的后裔[a]极其繁多，如天上的星，又如海边的沙；你的后裔必占领他的仇敌的城门[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “后裔”原文也可直译为“种子”；这里的名词是集合单数，既可指一个后代，也可统指众多后代。
    reason: lexical_alternative
  - marker: b
    text: 或译：“你的后裔必占领他们仇敌的城门。”原文的“后裔”在语法上是单数，后面的代词也作单数，直译为“他的仇敌”。
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: 我必定
  rationale: 本节承接前文的誓言，כִּי引出并加强宣告内容；中文不必机械译作“因为”或“就是”，其语气与后面的强调结构合并表达为“必定”。
- source_word: בָרֵךְ אֲבָרֶכְךָ
  choice: 我必定赐福给你
  rationale: 不定式绝对形与限定动词连用，表示强烈的肯定或强调；“必定赐福”自然地保留这一力度。
- source_word: וְהַרְבָּה אַרְבֶּה
  choice: 也必使……极其繁多
  rationale: 同样是不定式绝对形加强限定动词；“极其繁多”既体现增多的程度，也符合现代汉语表达。
- source_word: זַרְעֲךָ
  choice: 你的后裔
  rationale: זֶרַע是集合单数，可指一个后代，也可统称众多后代；“后裔”在中文中自然，并能保留一定的单数与群体含混性。
- source_word: כְּכוֹכְבֵי הַשָּׁמַיִם
  choice: 如天上的星
  rationale: 准确传达比较意象；“天上的星”是自然、庄重的现代汉语。
- source_word: וְכַחוֹל אֲשֶׁר עַל שְׂפַת הַיָּם
  choice: 又如海边的沙
  rationale: שְׂפַת הַיָּם字面为“海的边缘”，中文惯用“海边”；关系从句在中文中自然压缩为定语，不损失意义。
- source_word: וְיִרַשׁ
  choice: 必占领
  rationale: יָרַשׁ在此表示取得并控制敌人的城门，而非被动承受产业；“占领”切合军事与统治语境。
- source_word: שַׁעַר
  choice: 城门
  rationale: “门”在古代城市语境中指城门，并可转喻对城市的控制；译作“城门”使现代读者清楚，同时保留原有意象。
- source_word: אֹיְבָיו
  choice: 他的仇敌
  rationale: 原文使用阳性单数第三人称后缀，与集合单数“后裔”呼应；正文保留“他的”，不直接改成复数“他们的”。
theological_decisions:
- issue: זֶרַע的集合单数与אֹיְבָיו的单数代词
  choice: 译作“你的后裔……他的仇敌”
  alternative: “你的后代……他们的仇敌”
  rationale: 希伯来文既可让“后裔”统指群体，又以单数语法指称它。保留“他的”呈现这种张力，不预先限定为纯粹群体或某一位个体。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“必定……也必……”与“极其繁多”传达两个强调结构；末句刻意保留集合单数与单数代词之间的张力。
