  yaml_path: translation/ot/genesis/022/024.yaml
  text: And his concubine[a], whose name was Reumah, also bore Tebah, Gaham, Tahash[b], and Maacah.
translation:
  language: zh_hans
  text: 他的妾[a]名叫流玛；她也[b]生了提八、迦含、他施和玛迦。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“次妻”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文明确说“她也”，着重表明流玛也生了儿女。
    reason: source_emphasis
lexical_decisions:
- source_word: וּפִילַגְשׁוֹ
  choice: 他的妾
  rationale: פִּילֶגֶשׁ指地位有别于正妻的妾或次妻；“妾”简洁、自然，并保留其社会身份上的区别。句首连接词在本节承接上文的语境中不另译，以免中文生硬。
- source_word: וּשְׁמָהּ רְאוּמָה
  choice: 名叫流玛
  rationale: 希伯来文直译为“她的名字是流玛”；中文用“名叫流玛”自然地表达同一关系。רְאוּמָה按传统中文圣经人名译作“流玛”。
- source_word: וַתֵּלֶד
  choice: 生了
  rationale: ילד在家谱和生育语境中表示生育；“生了”符合现代汉语叙事习惯。
- source_word: גַּם הִוא
  choice: 她也
  rationale: 保留希伯来文独立代词הִוא及גַּם所带的强调，表明除前文的密迦之外，流玛也为拿鹤生了儿女。
- source_word: אֶת טֶבַח וְאֶת גַּחַם וְאֶת תַּחַשׁ וְאֶת מַעֲכָה
  choice: 提八、迦含、他施和玛迦
  rationale: 四个带直接宾语标记的人名按通行中文圣经音译处理，并用现代汉语列举格式表达。
