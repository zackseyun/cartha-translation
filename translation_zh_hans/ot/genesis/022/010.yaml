base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/010.yaml
  text: Then Abraham reached out his hand and took the knife to slaughter his son[a][b].
translation:
  language: zh_hans
  text: 亚伯拉罕就伸出手来[a]，拿起刀，要宰杀他的儿子[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“伸手”。
    reason: lexical_alternative
  - marker: b
    text: 原文“宰杀”比一般的“杀死”更具体，也可能带有献祭的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: 伸出
  rationale: 该动词本可表示“差遣、发出”，但与“手”连用时指把手伸出去；“伸出手来”既保留具体动作，也符合现代汉语叙事表达。
- source_word: יָדוֹ
  choice: 手
  rationale: 原文是单数名词并带第三人称男性单数后缀；汉语在主语明确时通常不必重复“他的”，因此译为“手”更自然，所属关系并无歧义。
- source_word: וַיִּקַּח
  choice: 拿起
  rationale: 这里表示取得并持住那把刀；“拿起”比单说“拿”更能自然呈现连续动作，又不额外强调抓握方式。
- source_word: הַמַּאֲכֶלֶת
  choice: 刀
  rationale: 该名词指用于切割、宰杀的器具；“刀”清楚简洁，避免在正文中加入原文未明说的器具形制。
- source_word: לִשְׁחֹט
  choice: 要宰杀
  rationale: שׁחט比一般的“杀”更具体，常指宰杀牲畜，也可用于献祭语境。“宰杀”保留其具体而沉重的意味；不定式在此表达目的，译作“要宰杀”符合汉语。
- source_word: בְּנוֹ
  choice: 他的儿子
  rationale: 直接传达名词及其第三人称男性单数所属后缀。
- source_word: וַ
  choice: 就
  rationale: 连续叙事形式推动事件发展；“就”自然表达紧接上文发生的动作。
theological_decisions:
- issue: 是否用带有献祭语感的词翻译 שׁחט
  choice: 宰杀
  alternative: 杀死
  rationale: 该动词通常不是泛指杀死，而是指宰杀，且常见于献祭语境。“宰杀”保留本段行为的仪式性可能和情感力度，却不把后来的神学结论直接写入正文。
translation_notes:
  register: 采用现代、庄重而清楚的叙事语言。“伸出手来，拿起刀”保留原文逐步推进的动作和紧张感；“宰杀”准确反映希伯来语动词的具体含义，同时借脚注说明其可能具有的献祭语感。
