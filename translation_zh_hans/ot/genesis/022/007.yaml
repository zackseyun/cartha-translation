base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/007.yaml
  text: And Isaac said to Abraham his father[a], “My father!” And he said, “Here I am, my son.” And he said, “Look, the fire and the wood—but where is the sheep for a burnt offering?”
translation:
  language: zh_hans
  text: 以撒对父亲亚伯拉罕说：“父亲！”亚伯拉罕说：“我在这里，我儿。”以撒又说：“你看，火和柴都有了，可是作燔祭用的牲畜[a]在哪里呢？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语“牲畜”指羊或山羊一类来自羊群或山羊群的小牲畜，并不专指绵羊或羊羔。
    reason: 说明原词 שֶׂה 的较广词义范围，避免正文被理解为专指绵羊、羊羔，或泛指任何牲畜。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 希伯来叙事中 אָמַר 的连续式通常表示发言，用现代汉语“说”自然准确。末句补出“又”，使连续对话的说话人转换清楚，并未增加实质内容。
- source_word: אָבִיו
  choice: 他父亲
  rationale: 保留第三人称所属关系和正式亲属称谓，符合本段庄重语气。
- source_word: אָבִי
  choice: 父亲！
  rationale: 原文含第一人称单数所属后缀，用作直接呼唤；现代汉语称呼父亲时通常不说“我的父亲”，故译为“父亲！”
- source_word: הִנֶּנִי
  choice: 我在这里
  rationale: 保留希伯来语自我呈现和回应的惯用表达，也延续本章的文学呼应。
- source_word: בְּנִי
  choice: 我儿
  rationale: 体现第一人称所属后缀及亲昵语气，同时保持庄重、简洁的文体。
- source_word: הִנֵּה
  choice: 你看
  rationale: 该指示语气词引人注意眼前事物；“你看”是自然的现代汉语表达。
- source_word: הָאֵשׁ וְהָעֵצִים
  choice: 火和柴都有了
  rationale: עֵצִים 在此指供献祭使用的木柴；汉语加入“都有了”，自然表达 הִנֵּה 所指的两样现成物品。
- source_word: הַשֶּׂה
  choice: 羊
  rationale: שֶׂה 泛指羊群中的一只小牲畜，可能是绵羊或山羊；正文用较宽泛的“羊”，避免无根据地限定为羊羔。
- source_word: לְעֹלָה
  choice: 作燔祭的
  rationale: עֹלָה 指全部焚烧献上的祭物；“作燔祭的”准确表达介词 לְ 所示用途，并符合汉语提问方式。
theological_decisions:
- issue: 献祭牲畜 הַשֶּׂה 的范围
  choice: 羊
  alternative: 羊羔；羊群中的小牲畜
  rationale: 原词并不明确限定年龄，也可包括山羊。正文采用自然但相对宽泛的“羊”，脚注说明其词义范围，以免把后续经文或神学联想预先带入本节。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“父亲！”和“我在这里，我儿”保留父子对话的亲密与沉重；“可是”自然呈现问题中隐含的缺项与张力。
