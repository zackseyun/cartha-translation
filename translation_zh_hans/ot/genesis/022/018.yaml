  text: וְ/הִתְבָּרֲכ֣וּ בְ/זַרְעֲ/ךָ֔ כֹּ֖ל גּוֹיֵ֣י הָ/אָ֑רֶץ עֵ֕קֶב אֲשֶׁ֥ר שָׁמַ֖עְתָּ בְּ/קֹלִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/018.yaml
  text: And in your offspring all the nations of the earth will be blessed[a], because you have obeyed my voice.
translation:
  language: zh_hans
  text: 地上的万国都必在你的后裔中得福[a]，因为你听从了我的话。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“都必以你的后裔为自己祝福。”希伯来语动词在这里也可作反身理解。
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִתְבָּרֲכוּ
  choice: 都必得福
  rationale: 这里的希特帕埃勒式可表达反身或带被动、结果意味的含义。在族长应许的语境中，“得福”自然地表达万国领受福分，同时不在正文中过度限定其实现方式；反身理解保留于脚注。
- source_word: בְזַרְעֲךָ
  choice: 因你的后裔
  rationale: זֶרַע是集合名词，可指“后裔”。介词ב可译作“在……里”或“借着、因”；现代汉语中“因你的后裔得福”通顺，并表达后裔与万国得福之间的媒介或关联，但不把“后裔”限定为单数或复数。
- source_word: כֹּל גּוֹיֵי הָאָרֶץ
  choice: 地上的万国
  rationale: גּוֹיִם通常指“列国、万国”；“地上的万国”保留原文的普世范围，也符合庄重而自然的现代汉语表达。
- source_word: עֵקֶב אֲשֶׁר
  choice: 因为
  rationale: 该短语引出应许重申的原因；“因为”简洁、自然，准确传达因果关系。
- source_word: שָׁמַעְתָּ בְּקֹלִי
  choice: 你听从了我的话
  rationale: שׁמע בקול是表示响应与顺服的习语，不只是听见声音。“听从了我的话”既体现顺服，也比直译“听我的声音”更符合现代汉语。
theological_decisions:
- issue: ברך的希特帕埃勒式在亚伯拉罕应许中的含义
  choice: 万国因亚伯拉罕的后裔领受福分，即“都必得福”。
  alternative: 万国将以亚伯拉罕的后裔为祝福用语，即“都必指着你的后裔为自己祝福”。
  rationale: 上下文的应许性质支持被动或结果性的理解，但该词形也容许反身理解。正文采用自然且符合应许语境的“得福”，脚注保留另一种真实可能，避免消除原文的语义张力，也不将后来的教义结论直接写入本节。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“后裔”保留原文集合名词的开放性；“听从了我的话”自然表达希伯来语习语中的顺服含义。
