base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/005.yaml
  text: And Abraham said to his young men[a], “Stay here with the donkey. I and the boy will go over there[b], and we will worship and return to you.”
translation:
  language: zh_hans
  text: 亚伯拉罕对随行的年轻人说：“你们和驴留在这里。我和孩子要到那边去；我们敬拜[a]，回到你们这里[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“俯伏下拜”；希伯来语动词可具体指人在敬拜中俯伏在地。
    reason: lexical_alternative
  - marker: b
    text: 亚伯拉罕原话使用复数，直译为“我们会回到你们这里”。经文没有说明这是有意隐瞒、心中的期待，还是对上帝供应的信心。
    reason: theological_ambiguity
lexical_decisions:
- source_word: נְעָרָיו
  choice: 随行的年轻人
  rationale: נַעַר可指年轻男子、仆人或随从。这里指陪同亚伯拉罕而留下的人；译作“随行的年轻人”既符合叙事处境，也不把他们的身份过度限定为正式仆役。
- source_word: שְׁבוּ לָכֶם פֹּה
  choice: 留在这里
  rationale: יָשַׁב本义可为坐、居住或停留；在此命令同行者不要继续前行，现代汉语用“留在这里”最自然。
- source_word: עִם הַחֲמוֹר
  choice: 和驴
  rationale: חֲמוֹר是普通的“驴”；“你们和驴留在这里”准确表达同行者与驴一同留下。
- source_word: וַאֲנִי וְהַנַּעַר
  choice: 我和孩子
  rationale: 此处נַעַר特指以撒，可涵盖少年或年轻人。“孩子”体现亚伯拉罕与以撒的父子关系，同时不武断限定其确切年龄。
- source_word: נֵלְכָה עַד כֹּה
  choice: 要到那边去
  rationale: 该短语表示前往眼前所指的另一处地方；“到那边去”是自然、清楚的现代汉语。
- source_word: וְנִשְׁתַּחֲוֶה
  choice: 我们敬拜
  rationale: שָׁחָה本义是俯伏、下拜，在献祭语境中指向敬拜；正文采用“敬拜”，脚注保留身体俯伏的字面含义。
- source_word: וְנָשׁוּבָה אֲלֵיכֶם
  choice: 然后回到你们这里
  rationale: שׁוּב意为返回，动词为第一人称复数。汉语以承前的“我们”为共同主语，并用“然后”自然表达连续动作，明确保留亚伯拉罕所说两人将返回的复数形式。
theological_decisions:
- issue: 亚伯拉罕说“我们……回到你们这里”时使用复数
  choice: 正文明确保留复数共同主语：“我们……回到你们这里”
  alternative: 将其解释为亚伯拉罕有意隐瞒，或明确解释为他相信以撒必会一同回来
  rationale: 希伯来文对敬拜和返回都使用第一人称复数形式。经文本身没有说明这句话是隐瞒、期待，还是对上帝供应的信心，因此译文不替原文消解这一神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“随行的年轻人”避免把נַעַר过度制度化为“仆人”；分号帮助读者辨明前往、敬拜和返回三个连续动作。所有脚注标记均置于正文对应词句之后。
