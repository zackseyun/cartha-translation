source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר אַל תִּשְׁלַ֤ח יָֽדְ/ךָ֙ אֶל הַ/נַּ֔עַר וְ/אַל תַּ֥עַשׂ ל֖/וֹ מְא֑וּמָּה כִּ֣י עַתָּ֣ה יָדַ֗עְתִּי כִּֽי יְרֵ֤א אֱלֹהִים֙ אַ֔תָּה וְ/לֹ֥א חָשַׂ֛כְתָּ אֶת בִּנְ/ךָ֥ אֶת יְחִידְ/ךָ֖ מִמֶּֽ/נִּי־־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/012.yaml
  text: And he said[a], “Do not lay your hand on the boy, and do not do anything to him, for now I know that you fear God, since you have not withheld your son, your only son[b], from me.”
translation:
  language: zh_hans
  text: 他说：“不可向这孩子伸手，也不可对他做任何事。如今我知道你敬畏上帝，因为你没有把你的儿子，就是你的独子[a]，留下不给我[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“你的儿子，你唯一的一个”。这里是在“你的儿子”之后的同位强调，指本段叙事中的以撒。
    reason: lexical_alternative
  - marker: b
    text: “留下不给我”也可译作“没有顾惜”。
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּשְׁלַח יָדְךָ אֶל
  choice: 向……伸手
  rationale: 保留希伯来语“伸手向着”的身体动作意象；在当前献祭场景中，现代汉语读者自然会理解为出手伤害，因而不必在正文中增添原文没有明说的“伤害”一词。
- source_word: הַנַּעַר
  choice: 这孩子
  rationale: נַעַר可指男孩、少年或青年；“这孩子”符合眼前叙事场景，也避免使用较古旧的“童子”。
- source_word: תַּעַשׂ לוֹ מְאוּמָּה
  choice: 对他做任何事
  rationale: מְאוּמָּה意为“任何事、丝毫”；与否定词连用构成全面禁止。此译法直接保留原文表达，不把范围缩窄为某一种伤害。
- source_word: עַתָּה יָדַעְתִּי
  choice: 如今我知道
  rationale: 直译原文的时间副词和完成式动词，保留“现在/如今我知道”所具有的叙事与神学张力。
- source_word: יְרֵא אֱלֹהִים
  choice: 你敬畏上帝
  rationale: “敬畏”兼有畏惧与尊崇之意，是现代汉语中对该希伯来表达直接而庄重的对应。
- source_word: חָשַׂכְתָּ ... מִמֶּנִּי
  choice: 没有把……留下不给我
  rationale: 保留חָשַׂךְ“留下、扣住不给”以及מִמֶּנִּי“不给我/不让我得着”的关系；“顾惜”是可能译法，列入脚注。
- source_word: יְחִידְךָ
  choice: 你的独子
  rationale: 原文在“你的儿子”之后以“你唯一的一个”作同位强调。“独子”在本段语境中简洁自然，但可能被误读为生物学意义上唯一的儿子，因此以脚注说明其措辞和语境。
theological_decisions:
- issue: “如今我知道”中的神之知识
  choice: 保留“如今我知道”的直接说法
  alternative: 如今我看出；如今已经显明
  rationale: 希伯来文本明确说“如今我知道”。译文不为消除其与神全知观念之间可能产生的张力而改写为客观显明或单纯观察。
- issue: 以撒被称为“独子”
  choice: 正文译作“你的独子”，并以脚注交代原文和约的叙事语境
  alternative: 你唯一的一个；你独一的儿子；你所爱的儿子
  rationale: יָחִיד强调唯一、独一，并未在词汇本身明确表达“所爱”。鉴于亚伯拉罕另有以实玛利，脚注避免让“独子”被理解为否认其他儿子的存在，同时保留本段对以撒的独特强调。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“这孩子”比“童子”自然；“不可向……伸手”保留原文意象。“如今我知道”及“独子”均不在正文中作神学化改写，而以必要脚注说明真实的词义与语境。
