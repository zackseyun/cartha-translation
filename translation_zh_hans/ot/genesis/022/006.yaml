  text: וַ/יִּקַּ֨ח אַבְרָהָ֜ם אֶת עֲצֵ֣י הָ/עֹלָ֗ה וַ/יָּ֨שֶׂם֙ עַל יִצְחָ֣ק בְּנ֔/וֹ וַ/יִּקַּ֣ח בְּ/יָד֔/וֹ אֶת הָ/אֵ֖שׁ וְ/אֶת הַֽ/מַּאֲכֶ֑לֶת וַ/יֵּלְכ֥וּ שְׁנֵי/הֶ֖ם יַחְדָּֽו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/006.yaml
  text: So Abraham took the wood for the burnt offering and laid it on Isaac his son[a], and he took in his hand the fire and the knife[b], and the two of them walked on together.
translation:
  language: zh_hans
  text: 亚伯拉罕把燔祭用的柴[a]拿来，放在他儿子以撒身上；自己手里拿着火和刀。两人就一同往前走。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“燔祭的柴”。
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲצֵי הָעֹלָה
  choice: 燔祭用的柴
  rationale: 该短语在形式上是“燔祭的柴”，语境表明这些柴用于献燔祭。“燔祭用的柴”符合现代汉语习惯，也保留了祭祀类别。
- source_word: וַיָּשֶׂם עַל
  choice: 放在……身上
  rationale: שׂים 与 עַל 连用表示把某物放到人或物之上；此译清楚呈现以撒背负柴的动作。
- source_word: יִצְחָק בְּנוֹ
  choice: 他儿子以撒
  rationale: 采用自然的现代汉语语序，完整保留亲子关系和以撒的名字。
- source_word: בְּיָדוֹ
  choice: 自己手里拿着
  rationale: 原文为单数“在他手中”；“自己手里拿着”自然地表达亚伯拉罕亲自携带这些物品。
- source_word: הָאֵשׁ
  choice: 火
  rationale: 原文只说“火”，没有明说容器、火把或火种，因此不将具体携带方式写入正文。
- source_word: הַמַּאֲכֶלֶת
  choice: 刀
  rationale: 该词指可用于宰杀的刀；上下文已经提供献祭场景，译作通顺而不过度解释的“刀”。
- source_word: שְׁנֵיהֶם יַחְדָּו
  choice: 两人就一同
  rationale: “两人”保留原文明确的双方，“一同”传达 יַחְדָּו 所强调的共同前行。
- source_word: וַיֵּלְכוּ
  choice: 往前走
  rationale: הלך 可表示走或前往；“往前走”自然体现叙事中旅程的继续。
theological_decisions:
- issue: עֹלָה 的祭祀术语
  choice: 燔祭
  alternative: 升献祭
  rationale: 这里的 עֹלָה 是整只祭牲在火中焚烧的既定祭祀类别。“燔祭”是现代中文圣经语境中清楚、通行且不额外引入神学解释的表达。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“自己”明确第二个分句的主语仍是亚伯拉罕；末句保留原文“两人”“一同”的简洁重复与叙事张力。
