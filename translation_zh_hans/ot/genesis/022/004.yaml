  yaml_path: translation/ot/genesis/022/004.yaml
  text: On the third day Abraham lifted up his eyes and saw the place from afar[a].
translation:
  language: zh_hans
  text: 第三天，亚伯拉罕举目，看见那地方在远处。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“从远处看见那地方。”
    reason: 词汇与句法表达的替代译法；מֵרָחֹק表示距离，可译为“在远处”或“从远处”。
lexical_decisions:
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: 第三天
  rationale: 这是带定冠词的序数时间短语；直译为“第三天”自然准确，不添加原文未明说的“旅程中”。
- source_word: וַיִּשָּׂא ... אֶת עֵינָיו
  choice: 举目远望
  rationale: “举目”保留希伯来语“举起眼睛”的叙事性习语；结合句末表示距离的短语，用“远望”构成自然的现代汉语表达，同时不改变动作次序。
- source_word: וַיַּרְא
  choice: 看见了
  rationale: ראה在此表示实际看见，而不仅是观看；“了”自然体现连续叙事中的既成动作。
- source_word: הַמָּקוֹם
  choice: 那个地方
  rationale: 原文为定指的“那地方／那个地方”，指上下文中上帝所指示的目的地；“那个地方”在现代汉语中比“这地方”更符合远处所见的情境。
- source_word: מֵרָחֹק
  choice: 远望
  rationale: 该短语表示从远处看见。汉语将距离信息自然融入“远望”；也可较形式地译作“从远处”。
- source_word: אַבְרָהָם
  choice: 亚伯拉罕
  rationale: 采用现代中文圣经传统中通行的人名音译。
