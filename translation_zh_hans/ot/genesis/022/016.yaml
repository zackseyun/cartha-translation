  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר בִּ֥/י נִשְׁבַּ֖עְתִּי נְאֻם יְהוָ֑ה כִּ֗י יַ֚עַן אֲשֶׁ֤ר עָשִׂ֨יתָ֙ אֶת הַ/דָּבָ֣ר הַ/זֶּ֔ה וְ/לֹ֥א חָשַׂ֖כְתָּ אֶת בִּנְ/ךָ֥ אֶת יְחִידֶֽ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/016.yaml
  text: and said[a], “By myself I have sworn, declares Yahweh, because you have done this thing and have not withheld your son[b], your only son,”
translation:
  language: zh_hans
  text: 又说：“雅威宣告：‘我指着自己起誓，因为你做了这件事，没有扣留[a]你的儿子，就是你独一的儿子[b]，’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “扣留”也可译作“保留”或“顾惜”。
    reason: 说明 חָשַׂךְ 在本句的词义范围。
  - marker: b
    text: “独一”也可译作“唯一”或“独特”。
    reason: 说明 יָחִיד 的词义范围，并保留其在本语境中的语义张力。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 又说
  rationale: 承接上一节的叙事动作；主语可由上下文确定，汉语省略主语更自然。
- source_word: בִּי נִשְׁבַּעְתִּי
  choice: 我指着自己起誓
  rationale: 准确表达希伯来语起誓公式，即雅威以自己为誓言的凭据；完成式在此表示已经郑重立誓并持续有效。
- source_word: נְאֻם יְהוָה
  choice: 雅威宣告
  rationale: 保留 נְאֻם 的庄严神谕语气，并将四字神名音译为“雅威”。
- source_word: כִּי יַעַן אֲשֶׁר
  choice: 因为
  rationale: 这一复合表达强调原因；现代汉语用“因为”即可自然传达其因果力度。
- source_word: עָשִׂיתָ אֶת הַדָּבָר הַזֶּה
  choice: 你做了这件事
  rationale: דָּבָר 在此指亚伯拉罕所做的事；“这件事”保留原文的具体指示。
- source_word: וְלֹא חָשַׂכְתָּ
  choice: 没有留下
  rationale: חָשַׂךְ 可指扣留、不留下或不顾惜；“没有留下”适合献祭语境，同时避免把“顾惜”的解释性意味直接写入正文。
- source_word: בִּנְךָ אֶת יְחִידֶךָ
  choice: 你的儿子，就是你独一的儿子
  rationale: 以同位结构重现原文的递进强调；“独一”表达 יָחִיד 的唯一、独特之意，而不增添“爱子”等原文未明说的含义。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；音译“雅威”保留其专名性质，不以称号替代。
- issue: יְחִידֶךָ 的含义
  choice: 你独一的儿子
  alternative: 你唯一的儿子；你所爱的儿子
  rationale: “独一”兼顾唯一性与特殊性，也保留以实玛利仍然存在所形成的语义张力；“所爱的”虽可由语境联想到，却不是此词在本节最直接的词义。
- issue: חָשַׂךְ 在献祭语境中的译法
  choice: 留下
  alternative: 顾惜；扣留
  rationale: 原词核心是没有保留或留下；正文采用较少解释性的译法，其他语义可能性由脚注说明。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。引号内的誓言在本节尚未结束，因此以逗号收束，承接下一节。
