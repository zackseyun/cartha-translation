base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/013.yaml
  text: Then Abraham lifted up his eyes and looked[a], and behold, behind him was a ram caught in the thicket by its horns[b]. And Abraham went and took the ram and offered it up as a burnt offering instead of his son.
translation:
  language: zh_hans
  text: 亚伯拉罕抬眼观看，只见他身后[a]有一只公羊，羊角缠在灌木丛中。亚伯拉罕就走过去，把那只公羊取来，献为燔祭，代替他的儿子[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“后面有一只公羊。”希伯来文此处没有明说“他”；许多译者把“后面”理解为表示地点的副词。
    reason: lexical_alternative
  - marker: b
    text: 或译：“在他儿子的位子上。”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא ... אֶת־עֵינָיו
  choice: 抬眼观看
  rationale: 这是希伯来语表示抬起目光的惯用语；译文保留动作画面，同时符合现代汉语表达。
- source_word: וַיַּרְא וְהִנֵּה
  choice: 只见
  rationale: 将“看”和引人注意的叙事标记“看哪”合并为自然的现代汉语，既表现人物观看，也突出随即映入眼帘的景象。
- source_word: אַיִל
  choice: 公羊
  rationale: 准确指成年雄羊，也符合献祭语境中的通行用语。
- source_word: אַחַר
  choice: 他身后
  rationale: 此处最自然地理解为表示地点的副词“在后面”；为使汉语场景清楚，正文补出“他”，并以脚注保留原文没有明说代词这一点。
- source_word: נֶאֱחַז
  choice: 卡在
  rationale: 表达公羊的角被灌木困住、无法脱身的结果状态，现代汉语简洁自然。
- source_word: בַּסְּבַךְ
  choice: 灌木丛中
  rationale: 表现枝条稠密纠结、足以困住羊角的植被环境。
- source_word: וַיִּקַּח אֶת־הָאַיִל
  choice: 把那只公羊取来
  rationale: 忠实表达“取了/拿了”公羊，又避免使用可能暗示徒手抓捕的措辞。
- source_word: וַיַּעֲלֵהוּ לְעֹלָה
  choice: 献作燔祭
  rationale: 在献祭语境中，עלה与עֹלָה共同表示把祭牲献为全烧的祭；“燔祭”是准确而通行的中文术语。
- source_word: תַּחַת בְּנוֹ
  choice: 代替自己的儿子
  rationale: תַּחַת在本句明确表示替代关系；“代替”是现代汉语中直接、自然的表达。
theological_decisions:
- issue: תַּחַת בְּנוֹ所表达的替代关系
  choice: 代替自己的儿子
  alternative: 取代他的儿子／在他儿子的位置上
  rationale: 上下文表明公羊成为本来要献上的儿子的替代；译文明确呈现本节的叙事意义，但不据此加入经文本身未明说的后续教义解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“抬眼观看”保留希伯来文的叙事质感；“只见”自然传达וְהִנֵּה引人注意的作用；保留中文圣经语境中通行的祭祀术语“燔祭”。
