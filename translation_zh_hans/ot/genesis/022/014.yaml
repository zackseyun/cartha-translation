  text: וַ/יִּקְרָ֧א אַבְרָהָ֛ם שֵֽׁם הַ/מָּק֥וֹם הַ/ה֖וּא יְהוָ֣ה יִרְאֶ֑ה אֲשֶׁר֙ יֵאָמֵ֣ר הַ/יּ֔וֹם בְּ/הַ֥ר יְהוָ֖ה יֵרָאֶֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/014.yaml
  text: And Abraham called the name of that place, “The LORD will provide,” as it is said to this day, “On the mountain of the LORD it will be provided.”
translation:
  language: zh_hans
  text: 亚伯拉罕把那地方命名为“耶和华必预备”。正如直到今日所说：“在耶和华的山上，必有预备。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “耶和华必预备”原文直译为“耶和华必看见”；“必有预备”也可译为“必被看见”或“必显现”。
    reason: 保留ראה（看见）在命名与流传说法中的文字关联，以及后半句语态和含义的真实歧义。
lexical_decisions:
- source_word: יְהוָה יִרְאֶה
  choice: 耶和华必预备
  rationale: 字面为“耶和华必看见”，但在本段语境中，“看见”带有察看需要并予以供应之意；“必预备”自然传达希伯来语习用含义，也与第8节呼应。
- source_word: בְּהַר יְהוָה יֵרָאֶה
  choice: 在耶和华的山上，必有预备
  rationale: יִרְאֶה 的辅音形式可按尼法勒式理解为“被看见／显现”；结合前半句及献祭得以代替的叙事语境，译作“必有预备”，同时用脚注保留字面与歧义。
- source_word: שֵׁם הַמָּקוֹם הַהוּא
  choice: 给那地方起名叫
  rationale: 按现代汉语地名命名的自然表达处理，准确体现“称那地方的名”。
- source_word: עַד־הַיּוֹם
  choice: 直到今天
  rationale: 保留叙述者所处时代仍流传此说法的时间表达。
theological_decisions:
- issue: “看见”与“预备”的关系
  choice: 正文采用“预备”
  alternative: 直译为“耶和华必看见……必被看见／显现”
  rationale: 希伯来语以“看见”表达上帝察看并供应，在创世记22章献祭替代物的上下文中，“预备”是合乎语境的等效表达；脚注明确原文意象，避免抹平其文字联系。
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威／上主
  rationale: “耶和华”是现代简体中文圣经传统中最通行、普通读者最易识别的专名译法；不以一般称号取代原文专名。
- issue: 后半句施事者未明说
  choice: 译为非人称的“必有预备”
  alternative: “耶和华必预备”或“他必被看见”
  rationale: 原文后半句为被动或中间意义形式，未明确说出施事者；采用“必有预备”避免在正文中补入原文没有明说的主语。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“给那地方起名叫”口吻清楚流畅；引语结构保留原文命名与流传说法之间的联系。
