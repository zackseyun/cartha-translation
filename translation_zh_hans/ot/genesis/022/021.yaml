  text: אֶת ע֥וּץ בְּכֹר֖/וֹ וְ/אֶת בּ֣וּז אָחִ֑י/ו וְ/אֶת קְמוּאֵ֖ל אֲבִ֥י אֲרָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/021.yaml
  text: Uz his firstborn[a], Buz his brother, and Kemuel the father of Aram.
translation:
  language: zh_hans
  text: 他的长子乌斯、乌斯的弟弟布斯，以及亚兰的父亲[a]基母利。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“亚兰的祖先”。在家谱中，“父亲”有时可指祖先或始祖，而不一定是直接的父亲。
    reason: 说明家谱用语אֲבִי可能具有较宽的亲缘或始祖含义。
lexical_decisions:
- source_word: ע֥וּץ
  choice: 乌斯
  rationale: 专名采用现代中文圣经中通行的音译。
- source_word: בְּכֹר֖וֹ
  choice: 他的长子
  rationale: בכור指按出生次序为首的儿子；“长子”自然保留其家谱含义。代词承接上文的拿鹤。
- source_word: בּ֣וּז
  choice: 布斯
  rationale: 专名采用现代中文圣经中通行的音译。
- source_word: אָחִ֑יו
  choice: 乌斯的弟弟
  rationale: 原文直译为“他的兄弟”；代词就近指乌斯。既然乌斯是长子，布斯只能是他的弟弟，中文如此表达可避免代词指向含混。
- source_word: קְמוּאֵ֖ל
  choice: 基母利
  rationale: 专名采用现代中文圣经中通行的音译。
- source_word: אֲבִ֥י
  choice: 父亲
  rationale: 保留原文家谱用语的直接含义；该词在家谱中也可能泛指祖先或族群始祖，因此加注说明。
- source_word: אֲרָֽם
  choice: 亚兰
  rationale: 按通行中文形式音译，不在正文中断定它指个人、族群还是地域。
theological_decisions:
- issue: אֲבִי אֲרָם在家谱中的关系范围
  choice: 亚兰的父亲
  alternative: 亚兰的祖先或始祖
  rationale: 希伯来文最直接的读法是“亚兰的父亲”，但家谱中的“父亲”有时可表示更早的祖先或族群始祖。正文保留直接表达，注释保存较宽泛的可能性，避免过度判定。
translation_notes:
  register: 采用简洁、庄重而自然的现代汉语家谱列举句式。以明确名词替代容易产生误解的代词，并将“父亲”的语义弹性保留在脚注中。
