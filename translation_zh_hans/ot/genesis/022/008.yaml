  naturalness: “神必为自己预备作燔祭的羊，我儿”在庄重的现代汉语圣经叙事中自然，并保留原文称呼置于句末所造成的语气。末句简化为“于是二人一同前行”，忠实而流畅。
  terminology: “神”“燔祭”“我儿”均合适。“羊”对应שֶׂה的较宽范围；脚注说明其可指绵羊或山羊等小牲畜，并说明“预备”所反映的惯用义及“为自己”的直译成分。
