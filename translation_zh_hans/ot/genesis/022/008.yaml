  to: 亚伯拉罕说：“神必为自己预备作燔祭的羊，我儿。”于是二人一同前行。
  rationale: 修订将“神自己”改为“神必为自己”，以准确反映לּוֹ而不将其解释为仅仅的主语强调；将“羊羔”改为“羊”，保留שֶׂה的语义宽度；删去“继续”，使末句更贴近原文，同时维持现代、庄重的叙事语体。脚注标记a应置于“羊”后：神必为自己预备作燔祭的羊[a]，我儿。
