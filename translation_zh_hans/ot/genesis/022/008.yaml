  text: וַ/יֹּ֨אמֶר֙ אַבְרָהָ֔ם אֱלֹהִ֞ים יִרְאֶה לּ֥/וֹ הַ/שֶּׂ֛ה לְ/עֹלָ֖ה בְּנִ֑/י וַ/יֵּלְכ֥וּ שְׁנֵי/הֶ֖ם יַחְדָּֽו־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/008.yaml
  text: And Abraham said[a], “God will provide for himself the lamb for a burnt offering, my son.” So the two of them went on together.
translation:
  language: zh_hans
  text: 亚伯拉罕说：“神必为自己预备作燔祭的羊，我儿。”于是二人一同前行。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 未另译连接词，以符合现代汉语叙事习惯；前后文已自然推进情节。
- source_word: אֱלֹהִים
  choice: 神
  rationale: 指亚伯拉罕所信的真神；“神”是自然、庄重的现代汉语对应词。
- source_word: יִרְאֶה לּוֹ
  choice: 自己会预备
  rationale: ראה本义为“看见”，此处结合לוֹ形成“亲自看顾、预备”的惯用含义；“自己会预备”既传达语境中的供应之意，也保留神亲自负责此事的语气。
- source_word: הַשֶּׂה
  choice: 羊羔
  rationale: שֶׂה泛指绵羊或山羊等小型牲畜，常指幼畜；献祭语境及上文问题中译作“羊羔”最自然，但脚注说明其词义范围。
- source_word: לְעֹלָה
  choice: 作燔祭
  rationale: עֹלָה是整只焚烧献上的祭物；“燔祭”是准确且通行的圣经祭祀术语。
- source_word: בְּנִי
  choice: 我儿
  rationale: 保留父亲对儿子的直接称呼及亲昵、凝重的情感色彩；置于句首更符合自然汉语称呼习惯。
- source_word: וַיֵּלְכוּ שְׁנֵיהֶם יַחְדָּו
  choice: 于是二人继续一同前行
  rationale: “二人”“一同”保留希伯来文对同行的强调；“继续前行”自然承接先前已经开始的行程，并维持叙事中的重复效果。
theological_decisions:
- issue: 亚伯拉罕所说神将采取的行动
  choice: 神自己会预备作燔祭的羊羔
  alternative: 神自己会看见作燔祭的羊；神会为自己看顾作燔祭的羊
  rationale: 语境支持“预备”的惯用含义，而“自己”表达לוֹ所带出的神亲自看顾此事之意。译文不判定亚伯拉罕是在含蓄回答、表达信心还是作出预言，从而保留叙事张力。
- issue: הַשֶּׂה所指动物的具体种类
  choice: 羊羔
  alternative: 羊；小牲畜
  rationale: 原词可指绵羊或山羊，并不严格限定种类；正文采用献祭语境中自然的“羊羔”，同时以脚注保存原文较宽的语义范围，避免把后来的神学联想直接写入原文。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“我儿”传达父子间的亲密与本节的情感张力；“一同前行”呼应本章重复出现的同行措辞。
