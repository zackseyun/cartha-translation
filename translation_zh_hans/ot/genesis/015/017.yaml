source:
  edition: WLC
  text: וַ/יְהִ֤י הַ/שֶּׁ֨מֶשׁ֙ בָּ֔אָה וַ/עֲלָטָ֖ה הָיָ֑ה וְ/הִנֵּ֨ה תַנּ֤וּר עָשָׁן֙ וְ/לַפִּ֣יד אֵ֔שׁ אֲשֶׁ֣ר עָבַ֔ר בֵּ֖ין הַ/גְּזָרִ֥ים הָ/אֵֽלֶּה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/017.yaml
  text: And when the sun had gone down and it was dark[a], behold[b], a smoking firepot and a flaming torch passed between these pieces.
translation:
  language: zh_hans
  text: 太阳已经落下，天也黑了。看哪，有冒烟的炉子[a]和燃烧的火把从这些肉块[b]中间经过。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “炉子”也可译作“烤炉”或“火炉”。希伯来语所指的是烤炉或盛火的炉具。
    reason: lexical_alternative
  - marker: b
    text: “这些肉块”指先前在立约仪式中被劈开的牲畜各部分（见创世记15:10）。
    reason: cross_reference
lexical_decisions:
- source_word: וַיְהִי
  choice: （以“太阳已经落下”起句）
  rationale: 该叙事形式承接前文，并由随后时间情境自然推进事件；现代汉语无需机械译出“事情发生了”。
- source_word: הַשֶּׁמֶשׁ בָּאָה
  choice: 太阳已经落下
  rationale: בוא与“太阳”连用表示日落；“已经落下”既自然，又保留具体意象及相对于后续事件的完成状态。
- source_word: וַעֲלָטָה הָיָה
  choice: 天也黑了
  rationale: עֲלָטָה表示黑暗或昏暗；此译符合现代汉语，不额外强化为原文未明说的“浓密黑暗”。
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留 הִנֵּה 引人注意、鲜明呈现场景的庄重文学功能。
- source_word: תַנּוּר עָשָׁן
  choice: 冒烟的炉子
  rationale: תַנּוּר指炉、烤炉或盛火的炉具；“炉子”在现代汉语中自然，也不把形制限定得过窄。
- source_word: לַפִּיד אֵשׁ
  choice: 燃烧的火把
  rationale: לַפִּיד是火把，אֵשׁ强调其火焰；“燃烧的火把”表达清楚自然。
- source_word: אֲשֶׁר עָבַר
  choice: 从……中间经过
  rationale: 关系从句描述前述两个火焰性物象的行动；汉语直接作谓语更流畅，同时不另行解释其身份。
- source_word: בֵּין הַגְּזָרִים הָאֵלֶּה
  choice: 从这些肉块中间
  rationale: גְּזָרִים在本段语境中指先前剖开的祭牲部分；“肉块”比单说“块”明确，同时由脚注交代上下文。
theological_decisions:
- issue: 立约仪式中两个带火物象的性质
  choice: 正文只描述冒烟的炉子和燃烧的火把，不直接认定它们就是上主自己。
  alternative: 明确译成上主临在的显现，从肉块中间经过。
  rationale: 上下文有力暗示这是神圣临在及立约行动，但本节希伯来文本只点明可见物象；描述性翻译保留经文本身的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“看哪”保留原文突显异象场景的文学力度；避免古奥的“有烟之炉”和过度解释性的神学措辞。
