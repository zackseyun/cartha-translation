    rationale: 原文以“内脏／身体”作男性后裔的习语性表述；中文“腹中”通常关联怀孕者的腹部，可能误导。改为“从你本身所生的”既自然，又不把未明说的后裔具体限定为“儿子”。
  revised_text: 看哪，耶和华的话临到他，说：“这人必不作你的继承人；只有从你本身所生的，才必作你的继承人。”
