base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/004.yaml
  text: And behold, the word of the LORD came to him, saying, “This man will not be your heir; rather, one who comes from your own body will be your heir.”
translation:
  language: zh_hans
  text: 看哪，耶和华的话临到他，说：“这人必不作你的继承人；只有从你本身所生的，才必作你的继承人。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留原文引人注意并标示突发启示的语用功能，措辞庄重且为现代读者所理解。
- source_word: דְבַר יְהוָה
  choice: 耶和华的话
  rationale: 按希伯来文本表达神的启示性话语，并以“耶和华”对应四字神名。
- source_word: לֹא יִירָשְׁךָ זֶה
  choice: 这人必不作你的继承人
  rationale: 指回上一节所说的人；“继承人”自然表达动词 ירש 在此处承受产业的含义。
- source_word: אֲשֶׁר יֵצֵא מִמֵּעֶיךָ
  choice: 那从你腹中出来的
  rationale: 较贴近原文“从你的内脏/腹中出来”的身体性表达，明确指亚伯兰亲生的后裔而不过度具体化。
- source_word: הוּא יִירָשֶׁךָ
  choice: 才必作你的继承人
  rationale: 以“才”体现独立代词 הוּא 的强调作用，并与前句否定构成鲜明对照。
theological_decisions:
- issue: 应许中继承者的身份范围
  choice: 保留为“那从你腹中出来的”，仅表明是亚伯兰亲生者
  alternative: 译作“你的儿子”或“你亲生的儿子”
  rationale: 原文本节尚未明说“儿子”，也未在此处指名以撒；避免提前消解叙事中逐步展开的应许。
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 上主／雅威
  rationale: “耶和华”是简体中文圣经语境中广为人知的专名形式，能与普通称谓“主”相区分，同时不添加宗派性解释。
translation_notes:
  register: 采用现代、庄重且易懂的叙事语言。“看哪”略带经文体色彩，用来保留原文提示新启示临到的强调；其余句式力求自然简洁。
