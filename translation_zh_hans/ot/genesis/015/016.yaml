id: GEN.15.16
reference: Genesis 15:16
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/ד֥וֹר רְבִיעִ֖י יָשׁ֣וּבוּ הֵ֑נָּה כִּ֧י לֹא שָׁלֵ֛ם עֲוֺ֥ן הָ/אֱמֹרִ֖י עַד הֵֽנָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/016.yaml
  text: And in the fourth generation they will return here[b][a], for the iniquity of the Amorites is not yet complete.
translation:
  language: zh_hans
  text: 到了第四代，他们必回到这里，因为亚摩利人[a]的罪孽还没有满盈[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文为单数“亚摩利人”，在这里可作为族群的集合称谓。
    reason: lexical_alternative
  - marker: b
    text: “还没有”所对应的原文短语直译为“直到这里”；这里表示亚摩利人的罪孽到所指的时点仍未达到满盈。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/ד֥וֹר רְבִיעִ֖י
  choice: 到了第四代
  rationale: דּוֹר意为“代”，רְבִיעִי为序数词“第四”。结合上下文，以“到了”自然表达这一代来到时所发生的事，同时保留原文的时间框架。
- source_word: יָשׁ֣וּבוּ
  choice: 他们必回到
  rationale: שׁוּב表示“返回、回转”。这里指亚伯兰的后裔返回此地；“必回到”既表达将来性，也符合应许语境。
- source_word: הֵ֑נָּה
  choice: 这里
  rationale: 该指示副词表示说话者所指的地点；“这里”简洁保留原文的现场指向。
- source_word: כִּ֧י
  choice: 因为
  rationale: 此处引出返回时间延后的理由；“因为”清楚表达因果关系。
- source_word: לֹא שָׁלֵ֛ם
  choice: 还没有满盈
  rationale: שָׁלֵם在此表示达到完整或足量。“满盈”保留罪孽尚未达到既定程度的意象，“还没有”传达未然状态。
- source_word: עֲוֺ֥ן
  choice: 罪孽
  rationale: עָוֹן可指罪恶、罪责或罪罚；本句着重亚摩利人的道德恶行尚未达到满盈，因此译作“罪孽”，同时不把词义收窄为主观罪疚。
- source_word: הָ/אֱמֹרִ֖י
  choice: 亚摩利人
  rationale: 原文形式为单数族名，但在此集体指整个族群。现代汉语用“亚摩利人”可自然表达集体含义。
- source_word: עַד הֵֽנָּה
  choice: 还没有
  rationale: 该短语字面为“直到这里”，在本句中具有时间界限的作用。正文以“还没有”自然传达尚未达到满盈，字面表达及其时间含义另见脚注。
theological_decisions:
- issue: 审判的延后与后裔返回的时间
  choice: 经文把后裔返回的时间与亚摩利人的罪孽尚未满盈相联系，但不进一步说明完整的神意或审判理论。
  alternative: 可将延后主要解释为上帝对亚摩利人的忍耐，或主要解释为以色列人在埃及受塑造的时期。
  rationale: 原文只明确给出亚摩利人的罪孽尚未满盈这一理由。译文保留这种关联，不加入经文本节未明说的教义性解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“必回到”符合应许语境；“罪孽满盈”保留原文关于罪恶达到完整程度的表达，又避免扩展为本节没有明说的神学体系。脚注标记均置于其所解释的词语之后。
