  text: וַ/יֹּ֣אמֶר אֵלָ֗י/ו קְחָ֥/ה לִ/י֙ עֶגְלָ֣ה מְשֻׁלֶּ֔שֶׁת וְ/עֵ֥ז מְשֻׁלֶּ֖שֶׁת וְ/אַ֣יִל מְשֻׁלָּ֑שׁ וְ/תֹ֖ר וְ/גוֹזָֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/009.yaml
  text: And he said to him[a], “Bring me a three-year-old heifer, a three-year-old female goat, a three-year-old ram, a turtledove[b], and a young pigeon.”
translation:
  language: zh_hans
  text: 他对他说：“给我取来[a]一头三岁的[b]母牛、一只三岁的母山羊、一只三岁的公绵羊、一只斑鸠和一只雏鸽。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语直译为“为我拿取”；这里指取来或备妥这些用于立约仪式的动物。
    reason: lexical_alternative
  - marker: b
    text: 这里反复使用的希伯来语词也可按字面理解为“三重的”或“分成三份的”；传统上认为本节是在说明这些牲畜都是三岁。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלָיו
  choice: 他对他说
  rationale: 按原文保留第三人称代词；上下文表明受话者是亚伯兰，但本节没有重复其名字。
- source_word: קְחָה לִי
  choice: 给我取来
  rationale: 字面为“为我拿取”；在要求备妥并带来立约仪式所需动物的语境中，“给我取来”自然且贴近原意。
- source_word: עֶגְלָה
  choice: 母牛
  rationale: 指雌性的牛；现代汉语用“母牛”清楚自然，不额外限定其是否尚未生育。
- source_word: מְשֻׁלֶּשֶׁת / מְשֻׁלָּשׁ
  choice: 三岁的
  rationale: 该词在这里传统上理解为说明三只牲畜的年龄；正文采用这一最符合礼仪清单语境的解释，同时以脚注保留词义上的不确定性。
- source_word: עֵז
  choice: 母山羊
  rationale: 此处名词为阴性，明确译出动物的性别。
- source_word: אַיִל
  choice: 公绵羊
  rationale: 指成年的雄性绵羊；“公绵羊”比单说“公羊”更明确。
- source_word: תֹר
  choice: 斑鸠
  rationale: 指鸠类中的斑鸠，而不是泛指鸽子。
- source_word: גוֹזָל
  choice: 雏鸽
  rationale: 该词本可泛指幼鸟，但与“斑鸠”并列出现在献祭用鸟的语境中，通常指幼鸽；“雏鸽”简洁自然。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。量词按动物类别分别使用“头”和“只”；保留原文简洁的叙事推进与动物清单结构，不在正文中补入“亚伯兰”或“献祭”等原文未明说的信息。
