  text: וַ/יּוֹצֵ֨א אֹת֜/וֹ הַ/ח֗וּצָ/ה וַ/יֹּ֨אמֶר֙ הַבֶּט נָ֣א הַ/שָּׁמַ֗יְמָ/ה וּ/סְפֹר֙ הַ/כּ֣וֹכָבִ֔ים אִם תּוּכַ֖ל לִ/סְפֹּ֣ר אֹתָ֑/ם וַ/יֹּ֣אמֶר ל֔/וֹ כֹּ֥ה יִהְיֶ֖ה זַרְעֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/005.yaml
  text: Then he brought him outside and said[a], “Please look toward the heavens and count the stars, if you are able to count them.” Then he said to him, “So shall your offspring be.”
translation:
  language: zh_hans
  text: 他领亚伯兰到外面，说：“请你仰望天空，数一数众星，看你能不能数得过来。”又对他说：“你的后裔[a]也必如此。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “后裔”原文也可直译为“种子”；这个希伯来语名词在形式上是单数，在这里可作集合意义，指后代。
    reason: 说明词语的字面意义及单数形式与集合用法之间的张力。
lexical_decisions:
- source_word: וַיּוֹצֵא אֹתוֹ הַחוּצָה
  choice: 他领亚伯兰到外面
  rationale: 希伯来语使役形式表达使人出去；“领……到外面”在现代汉语中自然，也保留了动作方向。上下文明确所指是亚伯兰，译出姓名可避免汉语连续代词造成歧义。
- source_word: הַבֶּט נָא הַשָּׁמַיְמָה
  choice: 请你仰望天空
  rationale: הבט是命令式“看”，נא带有请求或温和催促语气；“请你”体现这一语气。“仰望天空”自然表达朝天观看的方向。
- source_word: וּסְפֹר הַכּוֹכָבִים
  choice: 数一数众星
  rationale: ספר在此意为数点；“数一数”符合现代汉语命令表达，“众星”兼具清楚、凝练和庄重感。
- source_word: אִם תּוּכַל לִסְפֹּר אֹתָם
  choice: 看你能不能数得过来
  rationale: 该条件句强调是否有能力数清；“数得过来”自然传达星数极多、难以数尽的语境，同时仍保持条件表达。
- source_word: כֹּה יִהְיֶה
  choice: 也必如此
  rationale: כֹּה指向前面的星群作比较；“也必如此”简洁地保留比较关系，并以“必”表达未然应许。
- source_word: זַרְעֶךָ
  choice: 你的后裔
  rationale: זֶרַע形式为单数，但在此具有集合意义。“后裔”是现代汉语中自然且庄重的集合性称谓；脚注说明原文也可直译为“种子”，以保留其词形和潜在的单数—集合张力。
theological_decisions:
- issue: 应许经文中זַרְעֶךָ的单数形式与集合意义
  choice: 你的后裔，并加脚注说明原文直译
  alternative: 你的种子／你的子孙
  rationale: 正文采用自然的集合称谓“后裔”，不把所指限定为某一代或明确的复数个体；脚注保留希伯来词单数形式及其集合用法，避免消解后续经文可能涉及的神学张力。
translation_notes:
  register: 采用现代、清楚而庄重的叙事语言。“仰望天空”“众星”“也必如此”保持经文的诗性与应许语气；避免古奥表达。
