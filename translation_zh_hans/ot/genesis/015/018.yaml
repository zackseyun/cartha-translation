  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: בַּ/יּ֣וֹם הַ/ה֗וּא כָּרַ֧ת יְהוָ֛ה אֶת אַבְרָ֖ם בְּרִ֣ית לֵ/אמֹ֑ר לְ/זַרְעֲ/ךָ֗ נָתַ֨תִּי֙ אֶת הָ/אָ֣רֶץ הַ/זֹּ֔את מִ/נְּהַ֣ר מִצְרַ֔יִם עַד הַ/נָּהָ֥ר הַ/גָּדֹ֖ל נְהַר פְּרָֽת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/018.yaml
  text: On that day Yahweh made a covenant with Abram[a], saying, “To your offspring I have given this land, from the river of Egypt as far as the great river[b], the Euphrates.”
translation:
  language: zh_hans
  text: 那一天，雅威与亚伯兰立约[a]，说：“我已将这地赐给你的后裔，从埃及河[b]直到大河，就是幼发拉底河。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“切割一个约”，是“立约”的惯用说法，可能与上下文把祭牲切开的立约仪式有关。
    reason: lexical_alternative
  - marker: b
    text: 或译“埃及溪”或“埃及干河谷”。希伯来文作“埃及河”，但具体指哪一条水道仍有争议。
    reason: alternative_reading
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: 那一天
  rationale: 自然表达特定的时间点，同时贴近希伯来文。
- source_word: כָּרַת ... בְּרִית
  choice: 立约
  rationale: 这是现代汉语中清楚、庄重的惯用表达；希伯来文直译为“切约”，其仪式背景在脚注中保留。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按辅音神名的通行学术拟音音译，保留其作为上帝专名的性质，不以称号替代。
- source_word: אֶת אַבְרָם
  choice: 与亚伯兰
  rationale: 虽然希伯来文以直接宾语标记引出亚伯兰，汉语以“与……立约”最自然地表达立约关系。
- source_word: לֵאמֹר
  choice: 说
  rationale: 简洁自然地引出约中的宣告。
- source_word: לְזַרְעֲךָ
  choice: 给你的后裔
  rationale: זֶרַע是集合单数，可指亚伯兰的后代群体；“后裔”兼顾集合意义与庄重语体。
- source_word: נָתַתִּי
  choice: 我已……赐给
  rationale: 完成式在立约宣告中把赐地呈现为确定的授予；“已”保留其完成语气，又不额外断定历史占有已经全面实现。
- source_word: הָאָרֶץ הַזֹּאת
  choice: 这地
  rationale: 符合领土应许的语境，简洁且有圣经叙事的庄重感。
- source_word: מִנְּהַר מִצְרַיִם
  choice: 从埃及河
  rationale: נָהָר通常意为“河”；具体地理所指存在争议，故将“埃及溪/干河谷”的可能译法列入脚注。
- source_word: עַד הַנָּהָר הַגָּדֹל
  choice: 直到大河
  rationale: 准确表达边界终点，并保留原文对该河的描述。
- source_word: נְהַר פְּרָת
  choice: 就是幼发拉底河
  rationale: 原文以同位语指明“大河”即幼发拉底河；“就是”在汉语中清楚呈现这一关系。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文使用上帝的专名，而非称号；“雅威”较直接地音译学界通常重构的读音。
- issue: 立约动词 כָּרַת 的表达
  choice: 正文译“立约”，脚注保留“切约”
  alternative: 切立盟约
  rationale: “立约”确保普通读者能够自然理解，同时脚注保留原文措辞与本段切开祭牲之仪式的关联，不将该关联从文本中抹去。
- issue: נָתַתִּי 的时体与赐地应许
  choice: 我已将这地赐给
  alternative: 我把这地赐给；我将把这地赐给
  rationale: 希伯来文完成式将授予表述为确定之事；“已……赐给”保留这一力度，同时不把经文改写成单纯未来式。
- issue: זֶרַע 的集合意义
  choice: 后裔
  alternative: 种子；子孙
  rationale: “后裔”可自然指集合性的后代，不在本节中擅自限定为单一个体或仅强调复数群体。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“立约”“后裔”“赐给”保持圣经语体但不过度古雅；正文中的[a]、[b]均与脚注对应。
