base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/021.yaml
  text: and the Amorites, and the Canaanites, and the Girgashites, and the Jebusites.
translation:
  language: zh_hans
  text: 以及亚摩利人、迦南人、革迦撒人和耶布斯人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֶת
  choice: 以及／、／和
  rationale: וְ在这里延续前文的族群名单，אֶת则反复标示定指直接宾语。现代汉语无需逐项译出宾语标记；句首用“以及”承接前文，列举中用顿号，并在末项前用“和”，既自然又保留名单结构。
- source_word: הָאֱמֹרִי
  choice: 亚摩利人
  rationale: 希伯来语形式虽为单数族名，此处具有集合意义；汉语以“亚摩利人”自然指整个族群。
- source_word: הַכְּנַעֲנִי
  choice: 迦南人
  rationale: 按集合性族名处理，采用现代中文圣经语境中通行且易懂的译名“迦南人”。
- source_word: הַגִּרְגָּשִׁי
  choice: 革迦撒人
  rationale: 采用该古代族群在中文圣经传统中较通行的音译，并以“人”表达集合性族名。
- source_word: הַיְבוּסִי
  choice: 耶布斯人
  rationale: 采用通行音译“耶布斯人”，以“人”表达希伯来语集合性族名。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。经文是承接上一节的名单末段，因此以“以及”起句；中文标点避免机械重复多个“和”，同时清楚呈现四个族群。专名采用简体中文圣经读者较熟悉的传统译法。
