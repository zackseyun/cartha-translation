  text: And the birds of prey came down on the carcasses[a], and Abram drove them away.
translation:
  language: zh_hans
  text: 猛禽飞下来，落在那些牲畜的尸体上[a]；亚伯兰把它们赶走了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“一只猛禽飞下来，落在那些牲畜的尸体上。”希伯来语名词为单数，可指一只鸟，也可作集合名词；这里很可能泛指前来食腐的猛禽。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: 飞下来，落在
  rationale: 原词表示“下来、降下”；结合鸟类及介词“在……上”，译为“飞下来，落在”符合现代汉语，也清楚表达其趋向尸体的动作。
- source_word: הָעַיִט
  choice: 猛禽
  rationale: עַיִט可指捕食或食腐的猛禽，并可作集合名词。中文“猛禽”保留类别上的宽泛性，不把它过度限定为“秃鹫”。
- source_word: הַפְּגָרִים
  choice: 那些牲畜的尸体
  rationale: פֶּגֶר指尸体或兽尸；上下文是被宰杀的立约牲畜，因此明确译作“牲畜的尸体”，比“肉块”更准确。
- source_word: וַיַּשֵּׁב אֹתָם
  choice: 把它们赶走了
  rationale: שׁוב的使役形在此表示使其退回或离开；“赶走”自然地表达亚伯兰主动驱逐猛禽。
- source_word: אַבְרָם
  choice: 亚伯兰
  rationale: 采用现代中文圣经中通行的音译；此时人物尚未改名为亚伯拉罕。
