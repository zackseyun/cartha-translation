source:
  edition: WLC
  text: וְ/גַ֧ם אֶת הַ/גּ֛וֹי אֲשֶׁ֥ר יַעֲבֹ֖דוּ דָּ֣ן אָנֹ֑כִי וְ/אַחֲרֵי כֵ֥ן יֵצְא֖וּ בִּ/רְכֻ֥שׁ גָּדֽוֹל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/014.yaml
  text: But I will also judge the nation that they serve[b][a], and afterward they will come out with great possessions.
translation:
  language: zh_hans
  text: 但他们所服事[a]的那一国，我也必审判；此后，他们必带着许多财物[b]出来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“受其奴役”。希伯来语直译为“服事”，但在本语境中指在异国权势下被迫服役。
    reason: lexical_alternative
  - marker: b
    text: 或译“大量财产”或“丰厚财富”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: 但……也
  rationale: וְ与גַם兼有承接、转折语境中的对照和添加强调。“但……也”自然承接上文关于后裔受苦的预告，并保留“也”的添加意味。
- source_word: הַגּוֹי
  choice: 那一国
  rationale: גּוֹי可指“国”或“民族”；这里指辖制亚伯兰后裔的外邦国家权势。“那一国”既明确又符合现代汉语。
- source_word: אֲשֶׁר יַעֲבֹדוּ
  choice: 他们所服事的
  rationale: עבד在此为Qal形态，字面义是“服事、为……做工”。正文保留原词较宽的表达；上下文所含的强迫服役意味列入脚注，避免直接把解释替代原文。
- source_word: דָּן אָנֹכִי
  choice: 我也必审判
  rationale: 分词דָּן与独立代词אָנֹכִי连用，强调说话者亲自施行审判；在预告性的上下文中具有将来指向。“必审判”保留司法意味，也自然表达确定的未来行动。
- source_word: וְאַחֲרֵי כֵן
  choice: 此后
  rationale: 该短语标明事件次序。“此后”简洁、庄重，并准确表达“在这事以后”。
- source_word: יֵצְאוּ
  choice: 他们必……出来
  rationale: יצא意为“出去、出来、离开”。这里描述从受辖制之地出来；汉语用“出来”自然，也保留原文的空间动作。
- source_word: בִּרְכֻשׁ גָּדוֹל
  choice: 带着许多财物
  rationale: רְכוּשׁ指财产、物品或所有物，גָּדוֹל在此表示数量或规模巨大。“许多财物”保留具体所有物的含义；介词בְּ在此表达伴随，译作“带着”。
theological_decisions:
- issue: 上帝对辖制之国所采取行动的性质
  choice: 审判
  alternative: 惩罚
  rationale: דָּן属于司法性用语。“审判”保留法律与道德裁决的意味，也没有像“惩罚”那样预先限定审判的具体结果。
- issue: 亚伯兰后裔与那一国关系的表述
  choice: 服事
  alternative: 受其奴役
  rationale: 希伯来语动词本身是“服事、做工”，而上下文显示这种服事具有强迫和奴役性质。正文保留词汇本身的宽度，脚注说明语境含义，以保存原文措辞与叙事张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“但……也”保留上下文的对照与添加关系；“我也必审判”以宾语前置重现希伯来语的强调结构；两个脚注标记均紧随所说明的词语。
