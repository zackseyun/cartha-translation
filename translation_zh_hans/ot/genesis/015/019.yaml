  yaml_path: translation/ot/genesis/015/019.yaml
  text: the Kenites[a], the Kenizzites, and the Kadmonites—
translation:
  language: zh_hans
  text: 基尼人、基尼洗人和甲摩尼人[a]——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “甲摩尼”对应的希伯来语 קַדְמֹנִי（qadmoni）与“东方”或“东边的”有关；这里因其出现在族群名单中，译作族名“甲摩尼人”。
    reason: 说明词源所容许的另一种理解，同时保留本处作为族名的用法。
lexical_decisions:
- source_word: אֶת
  choice: 不单独译出
  rationale: 这是直接宾语标记，在汉语中没有独立对应词；本节各族群在上文句子中的宾语功能由语序体现。
- source_word: הַקֵּינִי
  choice: 基尼人
  rationale: 带定冠词的族名，在此集合性地指整个族群；现代汉语以“人”表达族群最自然。
- source_word: וְאֶת
  choice: 、
  rationale: 连词连接列举项，直接宾语标记不另译；汉语列举中用顿号自然表达。
- source_word: הַקְּנִזִּי
  choice: 基尼洗人
  rationale: 这是领土清单中的集合性族名，采用通行的汉语音译并加“人”表示族群。
- source_word: וְאֵת
  choice: 和
  rationale: 连词引出清单最后一项；直接宾语标记不另译。
- source_word: הַקַּדְמֹנִי
  choice: 甲摩尼人[a]
  rationale: 该词虽与“东方”有关，但在与其他族名并列的语境中作为族名使用；保留专名性质，并以脚注说明其词源含义。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的标准汉语。三个族名按希伯来文的集合性用法统一译为“……人”；以顿号和“和”构成自然的汉语列举。末尾破折号保留本节与后续清单相连的未完结构。脚注标记置于实际涉及的“甲摩尼人”之后。
