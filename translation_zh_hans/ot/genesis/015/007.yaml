  - severity: low
    issue: “迦勒底人的吾珥”略显拗口。
    rationale: מֵאוּר כַּשְׂדִּים是地名“迦勒底的吾珥”；“迦勒底的”在现代汉语中更自然，同时保留其限定关系。
