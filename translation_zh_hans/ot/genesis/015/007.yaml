revisions:
- from: 他又对亚伯兰说：“我是雅威[a]，曾把你从迦勒底人的吾珥领出来，为要把这片土地赐给你，让你拥有它[b]。”
  to: 他对亚伯兰说：“我是雅威[a]，曾把你从迦勒底的吾珥领出来，为要把这地赐给你，使你得着这地[b]。”
  rationale: 修订仅消除中文中可能超出原文的“又”，调整地名限定语，并使赐地与得地之间的目的关系更清晰、自然。神名音译及脚注锚点均予保留。
