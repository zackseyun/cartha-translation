base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/007.yaml
  text: And he said to him[a], “I am Yahweh[c][b], who brought you out from Ur of the Chaldeans to give you this land to possess.”
translation:
  language: zh_hans
  text: 他对亚伯兰说：“我是雅威[a]，曾把你从迦勒底的吾珥领出来，为要把这地赐给你，使你得着这地[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威”是希伯来文神名יהוה（YHWH）的音译。
    reason: 说明原文直接使用神的专名。
  - marker: b
    text: “得着这地”也可译作“承受这地为业”或“取得这地”。
    reason: 希伯来词ירש在此可表示取得、占有或承受产业。
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלָיו
  choice: 他又对亚伯兰说
  rationale: 未完成式连续体推进叙事，可自然译为“又……说”。原文代词意为“对他”，根据上文明确其所指为亚伯兰，以专名表达可避免中文指代含混。
- source_word: אֲנִי יְהוָה
  choice: 我是雅威
  rationale: 希伯来语无系词的名词句在中文中自然补出“是”；专名יהוה音译为“雅威”，保留经文直接使用的神圣名字。
- source_word: הוֹצֵאתִיךָ
  choice: 曾把你……领出来
  rationale: יצא的使役式表示使亚伯兰从原居地出来。“领出来”既自然，也保留了主动带领离开的意味；“曾”标明此事先于当前说话发生。
- source_word: מֵאוּר כַּשְׂדִּים
  choice: 从迦勒底人的吾珥
  rationale: 按地名加族群限定语处理；“吾珥”采用现代中文圣经中容易辨认的传统音译。
- source_word: לָתֶת לְךָ אֶת הָאָרֶץ הַזֹּאת
  choice: 为要把这片土地赐给你
  rationale: ל加不定词表达目的；“赐给”符合神作为施予者的语境，“这片土地”自然对应带指示词的הָאָרֶץ הַזֹּאת。
- source_word: לְרִשְׁתָּהּ
  choice: 让你拥有它
  rationale: ירש在此可涵盖取得、占有或承受产业。“拥有”是宽泛而自然的中文表达，不把语义过窄地限定为亲属继承。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。正文采用接近其通常学术重构读音的音译“雅威”，以表明这是专名；脚注说明其希伯来文形式，避免把它处理为普通称号。
- issue: ירש在土地应许语境中的含义
  choice: 拥有它
  alternative: 承受它为业；取得它
  rationale: 该词兼有取得、占有和承受产业等语义。正文以较宽泛的“拥有”保留核心含义，脚注列出具有产业色彩的可能译法，不预先限定其法律或神学机制。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“为要”保留目的关系并略带经文体庄重感；其余句式尽量符合现代普通话。
