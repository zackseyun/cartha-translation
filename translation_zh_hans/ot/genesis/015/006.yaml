reference: Genesis 15:6
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/הֶאֱמִ֖ן בַּֽ/יהוָ֑ה וַ/יַּחְשְׁבֶ֥/הָ לּ֖/וֹ צְדָקָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/006.yaml
  text: And he believed Yahweh[c][b][a], and he counted it to him as righteousness.
translation:
  language: zh_hans
  text: 亚伯兰信靠耶和华[a]，耶和华就把这算作他的义[b]。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “信靠”也可译作“相信”。
    reason: lexical_alternative
  - marker: b
    text: “算作他的义”也可译作“算他为义”或“给他算为义”。
    reason: lexical_alternative
  - marker: c
    text: 按通常理解，“算作”的主语是耶和华，即耶和华把亚伯兰的信靠算作他的义；另一种较不可能的理解，以亚伯兰为“算作”的主语。
    reason: alternative_reading
lexical_decisions:
- source_word: וְהֶאֱמִן
  choice: 信靠
  rationale: אמן 的使役形在此表示相信并倚靠某一对象。“信靠”在现代汉语中自然地兼顾“相信”与“信赖”，也与后面的介词 ב 所标明的对象相配。
- source_word: בַּיהוָה
  choice: 耶和华
  rationale: 介词 ב 标明信靠的对象；יהוה 采用现代中文圣经读者熟悉的传统译名“耶和华”。
- source_word: וַיַּחְשְׁבֶהָ
  choice: 就把这算作
  rationale: חשב 在此有计算、认定、归算之意。“算作”清楚保留认定或归算的语义，又避免在正文中使用较技术性的神学术语；“这”指前述信靠这一行动或回应。
- source_word: לּוֹ
  choice: 他的
  rationale: ל 加第三人称阳性单数后缀表示这项认定归于亚伯兰。“算作他的义”是自然的现代汉语表达，并保留归属关系。
- source_word: צְדָקָה
  choice: 义
  rationale: צדקה 在此指在上帝面前被视为正直、合宜的状态。“义”既简洁庄重，也保留本节与后续经文传统之间的关键词联系。
theological_decisions:
- issue: “算作”的主语
  choice: 在正文中明确重复“耶和华”，即耶和华把这算作亚伯兰的义。
  alternative: 把亚伯兰理解为主语，即亚伯兰将他／这视为义。
  rationale: 希伯来文连续叙事中主语虽未明说，但上下文和通常句法理解以耶和华为主语最自然。为避免现代汉语中的指代含混，正文补出“耶和华”；脚注说明较不可能的另一种句法理解。
- issue: 阴性代词后缀־הָ的所指
  choice: 以“这”指代亚伯兰前述信靠的行动或回应。
  alternative: 明确译为“他的信”或更宽泛地理解为他的信靠回应。
  rationale: 原文没有直接出现“信心”这一名词；用“这”可自然回指前一分句，同时避免把解释性名词加入正文。
- issue: צְדָקָה的表达
  choice: 译为“义”。
  alternative: 译为“正义”“正直”或“义的地位”。
  rationale: “义”最能涵盖此处关系性和认定性的含义，并保留经文中的神学张力，而不把它扩写为某一种系统神学解释。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。正文补出“亚伯兰”和第二个“耶和华”，使单节独立诵读时指代清楚；用“信靠”呈现相信与倚赖的合一语义，用“算作他的义”保留原文简洁、关系性及归算色彩。
