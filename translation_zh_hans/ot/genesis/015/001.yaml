id: GEN.15.1
reference: Genesis 15:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אַחַ֣ר הַ/דְּבָרִ֣ים הָ/אֵ֗לֶּה הָיָ֤ה דְבַר יְהוָה֙ אֶל אַבְרָ֔ם בַּֽ/מַּחֲזֶ֖ה לֵ/אמֹ֑ר אַל תִּירָ֣א אַבְרָ֗ם אָנֹכִי֙ מָגֵ֣ן לָ֔/ךְ שְׂכָרְ/ךָ֖ הַרְבֵּ֥ה מְאֹֽד׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/001.yaml
  text: After these things[a], the word of Yahweh came to Abram in a vision, saying, “Do not fear, Abram. I am a shield for you; your reward will be very great.”
translation:
  language: zh_hans
  text: 这些事以后，耶和华的话在异象中临到亚伯兰，说：“亚伯兰，不要害怕！我是你的盾牌；你的赏赐必极其丰厚。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我是你的盾牌，是你极大的赏赐。”
    reason: 原文末句省略系词，虽较自然地可理解为“你的赏赐必极其丰厚”，也可把“极大的赏赐”看作对神的进一步描述。
lexical_decisions:
- source_word: אַחַר הַדְּבָרִים הָאֵלֶּה
  choice: 这些事以后
  rationale: 这是常见的叙事时间衔接语。“事”保留 דְּבָרִים 在此既可泛指事情、又与前文叙事相关的宽泛含义，不限定为言语。
- source_word: דְבַר יְהוָה
  choice: 耶和华的话
  rationale: 保留希伯来语的领属结构及其作为启示用语的辨识度，同时符合现代汉语圣经语体。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代简体中文读者最熟悉的专名形式音译四字神名，而不以称号“主”代替。
- source_word: הָיָה ... אֶל אַבְרָם
  choice: 临到亚伯兰
  rationale: “话临到某人”是自然、庄重且辨识度高的汉语启示表达，准确传达话语来到受启示者的事件。
- source_word: בַּמַּחֲזֶה
  choice: 在异象中
  rationale: מַחֲזֶה 指视觉性的启示经验；“在异象中”既准确又自然。
- source_word: לֵאמֹר
  choice: 说
  rationale: 以汉语引出直接引语的通常方式表达该不定式，避免生硬直译。
- source_word: אַל תִּירָא
  choice: 不要害怕
  rationale: 准确表达否定命令，也比“不要惧怕”更贴近日常现代汉语而仍保持庄重。
- source_word: מָגֵן לָךְ
  choice: 我是你的盾牌
  rationale: 希伯来语字面为“我是给你的盾牌／护卫你的盾牌”；汉语用“你的盾牌”最自然，并保留保护者的比喻。
- source_word: שְׂכָרְךָ
  choice: 你的赏赐
  rationale: שָׂכָר 可指工价、报偿或赏赐；本段应许语境中“赏赐”最合适，又不把含义缩窄为雇佣工资。
- source_word: הַרְבֵּה מְאֹד
  choice: 必极其丰厚
  rationale: 原文是省略系词的名词句。“极其丰厚”自然修饰“赏赐”；“必”表达语境中的应许指向，但不声称原文有显式将来时标记。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用神的专名而非“主”这一称号。采用简体中文圣经传统中最广为人知的“耶和华”，同时不回避其专名性质。
- issue: שְׂכָרְךָ הַרְבֵּה מְאֹד 与前句的句法关系
  choice: 我是你的盾牌；你的赏赐必极其丰厚
  alternative: 我是你的盾牌，是你极大的赏赐
  rationale: 马所拉重音和最直接的句法支持两个断句后的陈述：神是亚伯兰的盾牌，亚伯兰的赏赐极其丰厚。不过，希伯来语省略系词，传统上也有人把“赏赐”理解为对神本身的进一步表述，因此在脚注中保留这一真实歧义。
- issue: 赏赐陈述的时间意味
  choice: 必极其丰厚
  alternative: 极其丰厚
  rationale: 希伯来语名词句本身没有显式时态；上下文是神向亚伯兰所作的应许，因此正文用“必”自然传达其前瞻力量，同时脚注说明另一句法理解，避免把补出的时间意味当作词形本身。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“临到”“异象”“盾牌”“赏赐”保留经文的启示性与比喻色彩；标点将两个主要陈述清楚分开。脚注标记置于实际存在句法歧义的末句之后。
