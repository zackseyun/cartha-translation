base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/015.yaml
  text: As for you[a], you will go to your fathers in peace; you will be buried at a good old age.
translation:
  language: zh_hans
  text: 至于你，你必平安地归到你列祖那里[a]；你必享高寿，随后被安葬。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“归到你的祖先那里”。希伯来文直译为“归到你的父亲们那里”，是指死亡、归入先前世代的惯用表达。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַתָּה
  choice: 至于你
  rationale: 连词加独立代词使话题从亚伯兰的后裔转回亚伯兰本人，并带有对比和强调；“至于你”自然体现这一话语转换。
- source_word: תָּב֥וֹא
  choice: 归到
  rationale: בוא本义为“来、到”，在“到列祖那里”的死亡惯用语中，汉语用“归到”既自然地表达死亡，又保留回归先辈的意象。
- source_word: אֶל אֲבֹתֶיךָ
  choice: 到你列祖那里
  rationale: אבות字面为“父辈”，在此指先前世代。“列祖”是庄重而可懂的汉语圣经用语，并保留希伯来文的家族性表达；脚注补明可译“祖先”。
- source_word: בְּשָׁלוֹם
  choice: 平安地
  rationale: שָׁלוֹם包含平安、安好与完整之意；“平安地”简洁自然，也不把含义缩限为仅仅没有战争。
- source_word: תִּקָּבֵר
  choice: 安葬
  rationale: קבר的尼法勒形为被动，意为“被埋葬”。现代汉语的“安葬”在此语境自然庄重，虽形式上未显出“被”，但语义明确。
- source_word: בְּשֵׂיבָה טוֹבָה
  choice: 享高寿而
  rationale: שֵׂיבָה指白发、年老，טוֹבָה赋予正面意味。“享高寿”自然表达在美好的老年离世，并与后面的安葬顺畅衔接。
theological_decisions:
- issue: “归到你列祖那里”的含义
  choice: 保留死亡并归入先前世代的惯用表达，不进一步界定死后状态
  alternative: 直指与祖先同葬，或明确主张死后有意识地与祖先相聚
  rationale: 亚伯兰后来并非与其直系父祖葬在同一处，因此该表达不只是墓地意义；但本节也没有充分展开中间状态的教义。保留原有意象可避免过度解释。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“列祖”略带经文语体，但在此能准确保留家族与世代意象；“享高寿而安葬”避免生硬直译“在美好的白发中被埋葬”。
