  text: וְ/אֶת הַ/חִתִּ֥י וְ/אֶת הַ/פְּרִזִּ֖י וְ/אֶת הָ/רְפָאִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/020.yaml
  text: and the Hittites[a], and the Perizzites, and the Rephaim,
translation:
  language: zh_hans
  text: 以及赫人、比利洗人和利乏音人[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“巨人”。希伯来语“利乏音”在某些语境中可作描述性理解，但这里更可能是指当地的一个族群。
    reason: 保留רְפָאִים的词义选择，同时不以解释性译法取代正文中的族名。
lexical_decisions:
- source_word: וְאֶת
  choice: 以及／和
  rationale: וְ加直接宾语标记אֵת，承接上一节并继续列举族群；汉语以“以及”起承接作用，并在末项前用“和”，不另译宾语标记。
- source_word: הַחִתִּי
  choice: 赫人
  rationale: 该词虽为单数形式，却带冠词并具有集合意义，指整个族群；“赫人”是现代中文圣经语境中清楚、通行的族名。
- source_word: הַפְּרִזִּי
  choice: 比利洗人
  rationale: 该单数族名在此作集合用法，指一个族群；采用中文圣经中通行的音译“比利洗人”。
- source_word: הָרְפָאִים
  choice: 利乏音人
  rationale: 本段列举应许之地的居民，故最自然地理解为族名；采用音译可保留专名性质，避免在正文中直接加入“巨人”这一解释。
theological_decisions:
- issue: רְפָאִים在此应译作族名还是描述为“巨人”
  choice: 正文译为族名“利乏音人”
  alternative: 巨人
  rationale: 创世记15:19—21连续列举当地族群，因此此处作为族名理解更合乎上下文；“巨人”是某些语境和传统中的可能理解，列入脚注以保留词义上的张力。
translation_notes:
  register: 采用现代、简洁而庄重的标准普通话。经文本身是承接上一节的名单片段，因此以“以及”开头；族名使用简体中文圣经读者较熟悉的传统音译。脚注标记紧随其实际说明的“利乏音人”，而非置于其他族名之后。
