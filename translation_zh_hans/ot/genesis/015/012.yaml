  rationale: 修订仅处理两处汉语表达与体貌：以“正在落山”准确且自然地表达日落中的时间背景；以“极大而黑暗的恐惧正笼罩着他”消除生硬名词堆叠，同时保留原文对恐惧、黑暗及其强度的压缩关联，不预断有争议的内部句法。脚注锚点及其替代译法均予保留。
