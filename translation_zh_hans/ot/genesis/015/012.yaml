  text: וַ/יְהִ֤י הַ/שֶּׁ֨מֶשׁ֙ לָ/ב֔וֹא וְ/תַרְדֵּמָ֖ה נָפְלָ֣ה עַל אַבְרָ֑ם וְ/הִנֵּ֥ה אֵימָ֛ה חֲשֵׁכָ֥ה גְדֹלָ֖ה נֹפֶ֥לֶת עָלָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/012.yaml
  text: As the sun was going down[a], a deep sleep fell upon Abram. And behold[b], a great dark dread fell upon him.
translation:
  language: zh_hans
  text: 太阳正在落山时，沉睡临到亚伯兰[a]。看哪，极大而黑暗的恐惧正笼罩着他[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“亚伯兰陷入恍惚状态。”这里的希伯来语可指异常深沉、也可能由神引发的睡眠。
    reason: lexical_alternative
  - marker: b
    text: 也可理解为“对黑暗的极大恐惧”或“极大的恐惧和黑暗”。希伯来语把“恐惧”和“黑暗”紧密地组合在一个鲜明的短语中。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי הַשֶּׁמֶשׁ לָבוֹא
  choice: 太阳快落山时
  rationale: 以自然的现代汉语表达日落将近这一时间背景；בוא用于太阳时表示太阳正在趋近落下。
- source_word: תַרְדֵּמָה
  choice: 沉睡
  rationale: 该词主要指异常深沉的睡眠，在启示性语境中也可能含有神所引发的意味；正文采用较少解释性的“沉睡”。
- source_word: נָפְלָה עַל אַבְרָם
  choice: 临到亚伯兰
  rationale: 汉语用“临到”自然表达某种状态落在一个人身上的希伯来语意象，同时保持庄重语体。
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留原文引人注意、加强现场感的叙事标记。
- source_word: אֵימָה חֲשֵׁכָה גְדֹלָה
  choice: 极大的黑暗恐惧
  rationale: 保留原文将“恐惧”与“黑暗”紧密压缩在一起的鲜明表达，不强行判定二者确切的句法关系。
- source_word: נֹפֶלֶת עָלָיו
  choice: 正临到他
  rationale: 用“正”体现分词的进行性和生动感，并与前面的完成式有所区别。
- source_word: אַבְרָם
  choice: 亚伯兰
  rationale: 采用现代中文圣经传统中通行的人名译法。
theological_decisions:
- issue: 启示语境中 תַרְדֵּמָה 的性质
  choice: 沉睡
  alternative: 恍惚状态
  rationale: 原词直接指深沉的睡眠；译作“恍惚状态”会更明确地解释其超自然性质，因此只在脚注中保留。
- issue: אֵימָה חֲשֵׁכָה גְדֹלָה 中恐惧与黑暗的关系
  choice: 极大的黑暗恐惧
  alternative: 对黑暗的极大恐惧；极大的恐惧和黑暗
  rationale: 希伯来语把恐惧、黑暗和强烈程度并置，句法关系较为紧凑且有歧义；正文保持这种张力，不把它限定为对黑暗的恐惧或两个完全并列的现象。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“沉睡临到”与“正临到”略带经文叙事色彩，但仍符合现代汉语；“看哪”保留原文突显眼前景象的文学力度。
