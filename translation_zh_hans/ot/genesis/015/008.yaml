  text: וַ/יֹּאמַ֑ר אֲדֹנָ֣/י יֱהוִ֔ה בַּ/מָּ֥ה אֵדַ֖ע כִּ֥י אִֽירָשֶֽׁ/נָּה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/008.yaml
  text: And he said[a], “Lord Yahweh, how will I know that I will possess it?”
translation:
  language: zh_hans
  text: 他就说：“主耶和华啊，我凭什么知道我必得这地为业[a]呢？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我必拥有这地”或“我必承受这地”。
    reason: ירשׁ 的语义可涵盖取得、占有和承受产业；原文容许这些相近译法。
lexical_decisions:
- source_word: וַיֹּאמַר
  choice: 他就说
  rationale: 未完成式连续体推进叙事；“就说”自然表达承接上文的叙事进展。
- source_word: אֲדֹנָי יֱהוִה
  choice: 主耶和华啊
  rationale: 保留 אֲדֹנָי 的“主”和四字神名；“耶和华”是现代中文圣经语境中通行且庄重的音译，呼格加“啊”符合自然汉语。
- source_word: בַּמָּה
  choice: 凭什么
  rationale: 字面为“借着什么”，询问可据以确认的凭据；“凭什么”比单纯“怎么”更贴近此处对确据或记号的询问。
- source_word: אֵדַע
  choice: 可以知道
  rationale: 第一人称单数未完成式置于疑问结构中，表达如何能够确定；译作“可以知道”保留其情态与未决语气。
- source_word: כִּי
  choice: （知道的内容从句，汉语不明译）
  rationale: 此处引出所要知道的内容。汉语在“知道”之后无需另译“that”，省略更自然，语义仍清楚。
- source_word: אִירָשֶׁנָּה
  choice: 我必得这地为业
  rationale: ירשׁ 可指承受、取得或占有。结合上一节的 הָאָרֶץ，补明“这地”；“得……为业”兼顾实际取得与应许产业的语境。
theological_decisions:
- issue: 复合称呼 אֲדֹנָי יֱהוִה 中神名的译法
  choice: 主耶和华
  alternative: 主上帝；主雅威
  rationale: 原文明确包含四字神名，不宜仅以普通称号取代。“主耶和华”既区分 אֲדֹנָי 与 יהוה，也符合庄重、易懂的现代中文圣经用语。
- issue: 亚伯兰的问题是否暗示不信
  choice: 不在译文中加入评价，只保留询问确据的语气
  alternative: 译成带有怀疑或质问色彩的表达
  rationale: 原文只问凭什么知道，并未明说其动机；译文不应替叙述者判定这是信心不足还是请求印证。
- issue: ירשׁ 的产业与占有含义
  choice: 得这地为业
  alternative: 拥有这地；承受这地
  rationale: 该动词在土地应许语境中兼有取得、占有和承受产业的意味；主译文保留产业色彩，脚注列出较直接的替代译法。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“主耶和华啊”保留呼告语气；“凭什么可以知道”表达寻求凭据而不擅自强化为不信；“这地”根据上一节明确补出代词所指。
