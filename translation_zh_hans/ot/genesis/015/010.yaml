base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/010.yaml
  text: So he brought all these to him[a], cut them in two, and placed each half opposite the other[c][b]; but he did not cut the birds in two.
translation:
  language: zh_hans
  text: 于是，亚伯兰把这一切带来给他[a]，把它们从中间劈成两半，把每一半与另一半相对摆放[b]；只是没有把鸟劈开。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“为自己取来这一切。”希伯来语“给他”在语法上也可表达“为自己”，但这里很可能承接上一节上帝“给我取来”的命令。
    reason: 指代与语法歧义
  - marker: b
    text: 直译：“把每一块（劈开的部分）对着其同伴摆放。”
    reason: 希伯来语习语的较直译表达
lexical_decisions:
- source_word: וַיִּקַּח לוֹ אֶת כָּל אֵלֶּה
  choice: 亚伯兰把这一切带到他那里
  rationale: 动词字面为“拿、取”，但承接上一节上帝“给我取来”的命令，לוֹ在语境中最自然地指“给他/到他那里”。补出“亚伯兰”以避免现代汉语中连续代词所造成的指代混乱。
- source_word: וַיְבַתֵּר אֹתָם בַּתָּוֶךְ
  choice: 从中间劈成两半
  rationale: בתר指把祭牲切分，בַּתָּוֶךְ意为“在中间”。“从中间劈成两半”既保留具体动作，也符合汉语表达。
- source_word: וַיִּתֵּן אִישׁ בִּתְרוֹ לִקְרַאת רֵעֵהוּ
  choice: 把每一半与另一半相对摆放
  rationale: אִישׁ ... רֵעֵהוּ在此是分配式表达，即每一块与对应的另一块相对；“相对摆放”清楚呈现空间排列，不额外引入配偶或同伴含义。
- source_word: וְאֶת הַצִפֹּר לֹא בָתָר
  choice: 只是没有把鸟劈开
  rationale: הַצִפֹּר是集合性单数，回指上一节的两只鸟；汉语“鸟”可自然作集合称谓。“劈开”与前文对应，同时不强加具体切成几块的解释。
theological_decisions:
- issue: 立约仪式的表达
  choice: 具体叙述把牲畜劈开并相对摆放
  alternative: 在正文中解释为立约仪式
  rationale: 希伯来文描写仪式动作，却未在本节明说其意义；译文保留立约语境中的具体意象，不把后来的解释加入正文。
- issue: לוֹ的指代
  choice: 指上帝，即“带到他那里”
  alternative: 指亚伯兰自己，即“为自己取来”
  rationale: 语法上לוֹ可有受益或与事关系，但上一节上帝命令“给我取来”（קָחָה לִי），使本节理解为亚伯兰把动物带给上帝更符合直接语境；脚注保留另一种可能。
translation_notes:
  register: 采用现代、庄重而清楚的叙事语体。“劈成两半”“相对摆放”保留仪式的具体画面；不在正文中加入立约仪式的神学解释。
