  text: וַ/יֹּ֣אמֶר אַבְרָ֔ם הֵ֣ן לִ֔/י לֹ֥א נָתַ֖תָּה זָ֑רַע וְ/הִנֵּ֥ה בֶן בֵּיתִ֖/י יוֹרֵ֥שׁ אֹתִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/003.yaml
  text: Then Abram said[a], “Behold, you have given me no offspring, and behold[b], a son of my household will inherit me.”
translation:
  language: zh_hans
  text: 亚伯兰又说：“看哪，你没有赐给我后裔；看哪，我家中的一个人将要承受我的产业。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “承受我的产业”原文直译为“承受我”；也可译作“作我的继承人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 又说
  rationale: 承接上一节亚伯兰的话；中文用“又说”自然表达叙事推进和继续发言。
- source_word: הֵן / וְהִנֵּה
  choice: 看哪……看哪
  rationale: 两处提示注意并加强语气的虚词形成修辞呼应；“看哪”庄重且普通读者能够理解。
- source_word: לִי לֹא נָתַתָּה זָרַע
  choice: 你没有赐给我后裔
  rationale: זֶרַע 字面为“种子”，此处指子嗣；“后裔”保留其集合意义及上下文中的延续家系之意。
- source_word: בֶן בֵּיתִי
  choice: 我家里的人
  rationale: 希伯来语字面为“我家中的儿子”，在此指属于亚伯兰家户的一人；不擅自明确其奴仆身份，也避免中文误解为亚伯兰的亲生儿子。
- source_word: יוֹרֵשׁ אֹתִי
  choice: 将要承受我的产业
  rationale: 希伯来语字面近于“承受我”，以亚伯兰本人转指他所留下的产业；中文若直译“承受我”会产生错误联想，因此在正文中明示其语境含义，并以脚注保留原文表达。
theological_decisions:
- issue: 亚伯兰家中继承者的社会身份
  choice: 仅译作“我家里的人”
  alternative: “我家生的奴仆”或“我的仆人”
  rationale: 本节只说“我家中的儿子”，并未出现“奴仆”一词；译文不从上下文或古代习俗补入更具体的身份。
- issue: יוֹרֵשׁ אֹתִי 的宾语所指
  choice: 正文译作“承受我的产业”，脚注说明字面结构
  alternative: “承受我”或“作我的继承人”
  rationale: 原文以“我”为宾语，可能以本人转指其产业或身后所有；正文采用自然中文表达实际语义，同时不把它改写为只强调身份的“作我的继承人”。
translation_notes:
  register: 采用现代、庄重而清楚的叙事语言。保留两次“看哪”的强调和平行结构；避免生硬直译“我家中的儿子”和“承受我”所造成的中文误解。
