  text: וַ/יֹּ֣אמֶר לְ/אַבְרָ֗ם יָדֹ֨עַ תֵּדַ֜ע כִּי גֵ֣ר יִהְיֶ֣ה זַרְעֲ/ךָ֗ בְּ/אֶ֨רֶץ֙ לֹ֣א לָ/הֶ֔ם וַ/עֲבָד֖וּ/ם וְ/עִנּ֣וּ אֹתָ֑/ם אַרְבַּ֥ע מֵא֖וֹת שָׁנָֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/013.yaml
  text: Then he said to Abram[a], “Know for certain that your offspring will be sojourners in a land not theirs[c][b], and they will enslave them and afflict them four hundred years.”
translation:
  language: zh_hans
  text: 他对亚伯兰说：“你务要确知：你的后裔必寄居在一片不属于他们的土地上[a]；那里的人必奴役他们，苦待他们四百年[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “寄居”指作为外来者住在不属于自己的土地上。
    reason: lexical_alternative
  - marker: b
    text: “奴役”也可译为“使他们服役”。原文把“四百年”置于句末，未明说这段时长是否同时涵盖前述的寄居。
    reason: source_ambiguity
lexical_decisions:
- source_word: יָדֹעַ תֵּדַע
  choice: 你务要确知
  rationale: 不定式绝对式与未完成式连用，强化“知道”的语气；“务要确知”既保留强调，也符合庄重而自然的现代汉语。
- source_word: גֵר
  choice: 寄居
  rationale: 该词指住在并非自己所有之地的外来居民；“寄居”保留非本地、无土地归属的含义，也符合本段语境。
- source_word: זַרְעֲךָ
  choice: 你的后裔
  rationale: 原文为集合单数，指亚伯兰世系中的众后代；汉语“后裔”自然表达这一集合意义。
- source_word: בְּאֶרֶץ לֹא לָהֶם
  choice: 在不属于他们的地方
  rationale: 直陈该地不归他们所有；“地方”可保留 אֶרֶץ 在此兼指土地、地域或国家的宽度，避免过早限定为某一国家。
- source_word: וַעֲבָדוּם
  choice: 那里的人必奴役他们
  rationale: 动词为第三人称阳性复数，带第三人称阳性复数宾语后缀。上下文最自然地把主语理解为异地居民，把亚伯兰的后裔理解为受事；补出“那里的人”可消除汉语代词歧义，“奴役”体现强制服役。
- source_word: וְעִנּוּ אֹתָם
  choice: 苦待他们
  rationale: ענה 的 Piel 词干表示使受苦、压迫或苦待；“苦待”范围较宽，既传达伤害和压迫，又不把方式限定得过窄。
- source_word: אַרְבַּע מֵאוֹת שָׁנָה
  choice: 共四百年
  rationale: 原文将时段置于句末而无显式介词；“共”自然标明持续时长，同时保留其与前述奴役、苦待整体相连的句法张力。
- source_word: וַיֹּאמֶר לְאַבְרָם
  choice: 他对亚伯兰说
  rationale: 承接上一节明确的说话者；汉语无需机械译出叙事连接词，也能自然推进叙事。
theological_decisions:
- issue: “必奴役他们，苦待他们”中复数主语的所指
  choice: 译作“那里的人”，指寄居之地的居民
  alternative: 保留不明确的“他们必奴役他们，苦待他们”，或改用被动式“他们必受奴役、受苦待”
  rationale: 原文明确使用复数主动动词和复数宾语。上下文最自然的解释是异地居民奴役、苦待亚伯兰的后裔；译出“那里的人”既保留主动结构，也避免现代汉语中两个“他们”造成反向理解，但不具体点名埃及人。
- issue: “四百年”修饰范围
  choice: 用“共四百年”连接奴役与苦待的整体处境
  alternative: 仅明确修饰“苦待”，或解释为寄居、奴役和苦待全部阶段的精确总时长
  rationale: 原文时长位于整个复合陈述之后，范围存在一定句法张力。译文不加入“整整”或更详尽的历史协调，避免超出本节明说的内容。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“务要确知”保留希伯来语强调式；主体经文用“那里的人”化解双重代词歧义，同时脚注提示原文主动结构及时间短语的范围张力。
