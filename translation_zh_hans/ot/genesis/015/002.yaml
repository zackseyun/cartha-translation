source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אַבְרָ֗ם אֲדֹנָ֤/י יֱהוִה֙ מַה תִּתֶּן לִ֔/י וְ/אָנֹכִ֖י הוֹלֵ֣ךְ עֲרִירִ֑י וּ/בֶן מֶ֣שֶׁק בֵּיתִ֔/י ה֖וּא דַּמֶּ֥שֶׂק אֱלִיעֶֽזֶר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/002.yaml
  text: But Abram said[a], “Lord Yahweh, what will you give me, since I am going childless, and the heir of my house is Eliezer of Damascus?”
translation:
  language: zh_hans
  text: 亚伯兰却说[a]：“主耶和华啊，你要赐给我什么呢？我仍要无儿无女地走下去，而承受我家业的人，是大马士革人以利以谢。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “承受我家业的人”：希伯来语原文为一种罕见的说法，字面近似“我家之某物的儿子”，其中该词含义不明；也可能指“管理我家业的人”，或“占有、承受我家业的人”。
    reason: 保留罕见短语בֶן מֶשֶׁק בֵּיתִי的词义不确定性及主要解释，同时避免把有争议的词义当作确定的字面意义。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 却说
  rationale: 该形式承接叙事；结合上下文，亚伯兰以自己的忧虑回应前面的应许，译作“却说”自然呈现语篇中的转折，同时不把反对意味说得过重。
- source_word: אֲדֹנָי יֱהוִה
  choice: 主耶和华啊
  rationale: אֲדֹנָי表示“主”，יֱהוִה是神名；二者均予保留，并用呼格助词“啊”构成自然、庄重的中文称呼。
- source_word: מַה תִּתֶּן לִי
  choice: 你要赐给我什么呢
  rationale: 未完成式在此具有将来指向；“赐给”适合神向人施予的语境，而“呢”自然表达疑问。
- source_word: וְאָנֹכִי הוֹלֵךְ עֲרִירִי
  choice: 我一直没有儿女
  rationale: הוֹלֵךְ字面为“走着、继续前行”，与עֲרִירִי连用，表示亚伯兰的人生一直在无儿无女的状态中延续。中文直译“走着无儿女”生硬；“一直没有儿女”清楚传达持续状态，但不擅自增译“将死”。
- source_word: בֶן מֶשֶׁק בֵּיתִי
  choice: 承受我家业的
  rationale: 原文是罕见而含义不确定的表达，字面近似“我家的管理/产业之子”。上下文关注无子与继承，因此正文采用通顺且符合语境的“承受我家业的”，同时在脚注保留字面形式和其他可能解释。
- source_word: דַּמֶּשֶׂק אֱלִיעֶזֶר
  choice: 大马士革人以利以谢
  rationale: 将地名理解为以利以谢的籍贯或关联地；“大马士革人以利以谢”符合现代中文的人名表达。
theological_decisions:
- issue: 复合称呼אֲדֹנָי יֱהוִה中的神名如何翻译
  choice: 主耶和华
  alternative: 主上帝；主雅威
  rationale: 原文同时包含“主”这一称号和四字神名。译作“主耶和华”保留两项成分，也符合现代中文圣经语域；不以普通称号完全替代专名。
- issue: בֶן מֶשֶׁק בֵּיתִי是否明确译为继承人
  choice: 承受我家业的
  alternative: 管理我家业的；我家产业之子
  rationale: 下一节明确谈到家中出生的人将成为继承人，因此继承含义在语境中很强；但原短语本身罕见，不宜掩盖其不确定性，故以脚注注明其他理解。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“主耶和华啊”保留复合神圣称呼；“我一直没有儿女”避免生硬复制希伯来语的行走隐喻；争议短语在正文按上下文清楚表达，在脚注中保存字面形态与真实歧义。
