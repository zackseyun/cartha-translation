  yaml_path: translation/ot/genesis/016/016.yaml
  text: Abram was eighty-six years old when Hagar bore Ishmael to Abram[a].
translation:
  language: zh_hans
  text: 夏甲给亚伯兰生以实玛利时，亚伯兰八十六岁。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“为亚伯兰生以实玛利”。这里的希伯来语介词在本语境中可以表达“给”或“为”的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַבְרָם
  choice: 亚伯兰
  rationale: 按现代中文圣经传统音译该专名；句首连接词在本节独立成句时无需机械译出。
- source_word: בֶּן
  choice: ……岁
  rationale: 在年龄公式中，בֶּן 表示“年岁为……”，现代汉语自然表达为“……岁”。
- source_word: שְׁמֹנִים שָׁנָה וְשֵׁשׁ שָׁנִים
  choice: 八十六岁
  rationale: 希伯来语“八十年又六年”是标准年龄表达，现代汉语合并为“八十六岁”。
- source_word: בְּ/לֶדֶת
  choice: ……生……时
  rationale: 介词 בְּ 加 ילד 的不定式构造引出时间关系，译为“……时”既准确又自然。
- source_word: הָגָר
  choice: 夏甲
  rationale: 采用现代中文圣经中通行的专名译法。
- source_word: אֶת יִשְׁמָעֵאל
  choice: 以实玛利
  rationale: אֶת 是直接宾语标记，不另译；专名采用现代中文圣经中通行的译法。
- source_word: לְ/אַבְרָם
  choice: 给亚伯兰
  rationale: 介词 לְ 表明生子与亚伯兰的关系；“给亚伯兰生”在现代汉语中自然，并保留“为他/给他生子”的语义。
