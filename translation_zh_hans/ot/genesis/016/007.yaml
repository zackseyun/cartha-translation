  text: וַֽ/יִּמְצָאָ֞/הּ מַלְאַ֧ךְ יְהוָ֛ה עַל עֵ֥ין הַ/מַּ֖יִם בַּ/מִּדְבָּ֑ר עַל הָ/עַ֖יִן בְּ/דֶ֥רֶךְ שֽׁוּר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/007.yaml
  text: And the angel of Yahweh found her by a spring of water in the wilderness[b][a], by the spring on the way to Shur.
translation:
  language: zh_hans
  text: 雅威[b]的使者[a]在旷野的一处水泉旁找到了她；那泉在通往书珥的路上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“天使”。希伯来语 מַלְאָךְ 既可指“使者”，也可指“天使”。
    reason: lexical_alternative
  - marker: b
    text: “雅威”所对应的希伯来文神名是 YHWH；也常音译为“耶和华”。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּמְצָאָהּ
  choice: 找到了她
  rationale: מצא在连续叙事中自然表示“找到”；宾语后缀为阴性单数，指夏甲。此译法不额外推断相遇的方式。
- source_word: מַלְאַךְ יְהוָה
  choice: 耶和华的使者
  rationale: מַלְאָךְ可指一般的“使者”，也可指来自神的“天使”。正文采用“使者”，既符合中文圣经叙事语体，也保留原词的语义张力，并在脚注中列出“天使”这一译法。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 这是神名YHWH，正文采用现代中文读者熟悉的专名形式“耶和华”，而非以“主”这一称号代替；脚注同时说明也可音译为“雅威”。
- source_word: עַל עֵין הַמַּיִם
  choice: 在一处水泉旁
  rationale: עַיִן在此因与“水”连用且位于旷野，明确指泉源；עַל在地点表达中自然译为“旁”。“一处”符合首次引入该泉的中文表达。
- source_word: בַּמִּדְבָּר
  choice: 在旷野
  rationale: מִדְבָּר通常指荒野、干旱牧地或人烟稀少之地，不必然是沙漠，因此译作“旷野”。
- source_word: עַל הָעַיִן
  choice: 那泉
  rationale: 第二次出现的עַיִן回指前述水泉。中文用“那泉”自然表达其回指及定位作用，避免机械重复。
- source_word: בְּדֶרֶךְ שׁוּר
  choice: 在通往书珥的路上
  rationale: דֶּרֶךְ在此指道路或路线；介词结构具有地理定位作用。“书珥”按专名音译。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威；或按传统以“主”代称
  rationale: 原文直接使用四字神名YHWH。正文保留为专名，不以称号“主”取代；“耶和华”兼顾中文传统的可识别性，脚注说明“雅威”这一音译。
- issue: מַלְאַךְ יְהוָה所指身份
  choice: 耶和华的使者
  alternative: 耶和华的天使
  rationale: 原词מַלְאָךְ本义为受差遣者，可指人间使者，也可指天上使者。此处不在译文中进一步界定其本体或神学身份，以保留叙事中的张力。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“找到了她”保持叙事推进；分号将水泉的位置补充与主要事件清楚衔接。所有代词及地理信息均按上下文表达，不增补使者身份或夏甲行动的解释。
