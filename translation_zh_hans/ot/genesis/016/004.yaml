  text: וַ/יָּבֹ֥א אֶל הָגָ֖ר וַ/תַּ֑הַר וַ/תֵּ֨רֶא֙ כִּ֣י הָרָ֔תָה וַ/תֵּקַ֥ל גְּבִרְתָּ֖/הּ בְּ/עֵינֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/004.yaml
  text: He went in to Hagar[a], and she conceived. When she saw that she had conceived, her mistress was despised in her eyes.
translation:
  language: zh_hans
  text: 他与夏甲同房，夏甲就怀了孕。她发现自己怀了孕，她的女主人在她眼中就显得轻贱了[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“她就轻看她的女主人”。希伯来文以“她的女主人”为语法主语，直译是女主人“在她眼中变得轻贱”。
    reason: 说明希伯来文末句的语法形式及可采用的主动式表达。
lexical_decisions:
- source_word: וַיָּבֹא אֶל הָגָר
  choice: 他与夏甲同房
  rationale: בוא אל 在此是指性结合的委婉语。“与……同房”是现代汉语中庄重而清楚的对应表达；保留原文的男性单数代词“他”，不擅自补出前文人物的名字。
- source_word: וַתַּהַר / הָרָתָה
  choice: 怀了孕 / 怀了孕
  rationale: הרה 可表示怀孕或受孕。两处均译作“怀了孕”，既符合叙事时序，也保留原文的词语重复。
- source_word: וַתֵּרֶא כִּי
  choice: 她见自己……
  rationale: ראה 与 כִּי 连用表示她察觉到自己的状况。“见自己”保留“看见”的表达，同时在现代汉语中自然地表示意识到。
- source_word: וַתֵּקַל
  choice: 变得轻贱了
  rationale: קלל 在这里表示分量降低、被看轻。希伯来文以“女主人”为语法主语，并由“在她眼中”限定为夏甲的评价；“变得轻贱了”保留这一句法和结果意味。
- source_word: גְּבִרְתָּהּ
  choice: 她的女主人
  rationale: גְּבִירָה 指具有权柄和较高社会地位的女性。“女主人”准确表达夏甲与撒莱之间的主仆关系。
- source_word: בְּעֵינֶיהָ
  choice: 在她眼中
  rationale: 直译希伯来语常用的评价性习语，意为“在她看来”，并清楚表明轻贱是夏甲的看法。
theological_decisions:
- issue: 末句是描述撒莱在夏甲心目中的地位，还是直接陈述夏甲轻视撒莱
  choice: 她的女主人在她眼中就变得轻贱了
  alternative: 她就轻看她的女主人
  rationale: 原文以“她的女主人”为语法主语，字面结构是女主人“在她眼中变得轻贱”。正文保留这一结构和其中的细微张力，脚注列出符合语境的主动式译法，不把经文扩大解释为具体的敌对行为。
translation_notes:
  register: 采用现代、庄重且易懂的叙事语言。“同房”保持原文委婉语的得体程度；“女主人”和“在她眼中”保留古代社会关系及希伯来语评价习语。
