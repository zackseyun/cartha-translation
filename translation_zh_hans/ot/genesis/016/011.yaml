  text: וַ/יֹּ֤אמֶר לָ/הּ֙ מַלְאַ֣ךְ יְהוָ֔ה הִנָּ֥/ךְ הָרָ֖ה וְ/יֹלַ֣דְתְּ בֵּ֑ן וְ/קָרָ֤את שְׁמ/וֹ֙ יִשְׁמָעֵ֔אל כִּֽי שָׁמַ֥ע יְהוָ֖ה אֶל עָנְיֵֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/011.yaml
  text: Then the angel of Yahweh said to her[a], “Behold, you are pregnant and will bear a son, and you shall call his name Ishmael, because Yahweh has heard your affliction.”
translation:
  language: zh_hans
  text: 耶和华的使者于是对她说[a]：“看哪，你如今怀了孕，将生一个儿子。你要给他起名叫以实玛利，因为耶和华听见了你所受的苦难。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“耶和华的天使”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: 耶和华的使者
  rationale: מַלְאַךְ 可指“使者”或天上的“天使”。此处用“使者”保留其基本词义及身份上的含蓄，不额外作神学认定；脚注列出传统译法“天使”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名“耶和华”音译四字神名，保留其作为上帝名字的性质，而不以头衔替代。
- source_word: הִנָּךְ הָרָה
  choice: 看哪，你已经怀孕
  rationale: “看哪”保留 הִנֵּה 提请注意和庄重宣告的语气；“已经怀孕”自然、明确地表达 הָרָה 所指的现状。
- source_word: וְיֹלַדְתְּ בֵּן
  choice: 必生一个儿子
  rationale: 该结构预告将来的生产；“必生”简洁地传达确定的未来，同时保持庄重语气。
- source_word: וְקָרָאת שְׁמוֹ
  choice: 你要给他起名叫
  rationale: 以自然现代汉语表达希伯来语“称他的名”这一命名公式，不改变其命名指令的力度。
- source_word: יִשְׁמָעֵאל
  choice: 以实玛利
  rationale: 采用现代中文圣经中通行的人名音译；名字与“上帝听见”之间的语义关联由下文说明。
- source_word: כִּי שָׁמַע יְהוָה
  choice: 因为耶和华听见了
  rationale: כִּי 在此说明命名缘由；完成式 שָׁמַע 表明耶和华已经垂听，译作“听见了”符合中文叙述。
- source_word: עָנְיֵךְ
  choice: 你的苦情
  rationale: עֳנִי 可涵盖困苦、受压和苦难处境。“苦情”在中文中既指所受痛苦，也适合与“听见”搭配，避免仅限于内在悲伤。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 正文保留神的专名，并采用中文读者广泛熟悉的“耶和华”；不以“上主”等称号取代专名。
- issue: מַלְאַךְ יְהוָה 的身份
  choice: 耶和华的使者
  alternative: 耶和华的天使
  rationale: “使者”贴近 מַלְאַךְ 的基本含义，并不在本节明确措辞之外，将其身份进一步界定为某种特定显现；传统的“天使”译法置于脚注。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“看哪”保留宣告语气；“必生”“你要”维持预告与命名指令的力度。
