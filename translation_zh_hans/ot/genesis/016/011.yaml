  to: 耶和华的使者于是对她说[a]：“看哪，你如今怀了孕，将生一个儿子。你要给他起名叫以实玛利，因为耶和华听见了你所受的苦难。”
  rationale: 修订仅处理叙事连词和“苦情”的现代语义歧义，保留原文的宣告语气、未来预告、命名命令、神名、人名及使者／天使的词汇开放性。
