  text: וַ/תֹּ֨אמֶר שָׂרַ֜י אֶל אַבְרָ֗ם הִנֵּה נָ֞א עֲצָרַ֤/נִי יְהוָה֙ מִ/לֶּ֔דֶת בֹּא נָא֙ אֶל שִׁפְחָתִ֔/י אוּלַ֥י אִבָּנֶ֖ה מִמֶּ֑/נָּה וַ/יִּשְׁמַ֥ע אַבְרָ֖ם לְ/ק֥וֹל שָׂרָֽי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/002.yaml
  text: Then Sarai said to Abram[a], “Look now, Yahweh has kept me from bearing children. Please go in to my female slave; perhaps I will be built up through her.” And Abram listened to the voice of Sarai.
translation:
  language: zh_hans
  text: 撒莱对亚伯兰说：“你看，耶和华使我不能生育。请你与我的女奴同房；或许我可借着她建立家室[a]。”亚伯兰听从了撒莱的话。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可意译为“或许我可以借她得子”或“或许我可以借着她得以建立”。希伯来文直译为“或许我可以从她／借着她被建立起来”；这里的“建立”带有建立家室的比喻。
    reason: 说明原文保留的“建立”比喻、被动形式，以及介词短语可表示来源或途径；同时给出语境中自然的“得子”理解。
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: 对……说
  rationale: 未机械翻出叙事连接词 וַ；汉语上下文用直接起句即可自然推进叙事。
- source_word: הִנֵּה נָא
  choice: 你看
  rationale: 保留引起对方注意的语用功能，又符合现代汉语口吻；נָא 在这里带有缓和语气，不必僵硬地另译“现在”或“请”。
- source_word: עֲצָרַנִי יְהוָה מִלֶּדֶת
  choice: 耶和华使我不能生育
  rationale: 准确保留撒莱将自己不能生育归于耶和华行动的表述；“不能生育”自然涵盖不能怀孕生子之意。
- source_word: בֹּא נָא אֶל
  choice: 请你与……同房
  rationale: 这是表示性关系的委婉语。现代汉语“同房”既清楚又保持委婉语体；“请”体现 נָא 的请求语气。
- source_word: שִׁפְחָתִי
  choice: 我的女奴
  rationale: 明确保留 שִׁפְחָה 所表示的受奴役身份，不以较柔化的“使女”或“婢女”遮蔽其社会地位。
- source_word: אוּלַי אִבָּנֶה מִמֶּנָּה
  choice: 或许我可以借着她建立起来
  rationale: 保留 בנה“建造、建立”的比喻及 אוּלַי 的不确定语气；“借着她”表达 מִמֶּנָּה 在此作为途径或媒介的含义。较明确的“借她得孩子”放入脚注，避免正文消除原文意象。
- source_word: וַיִּשְׁמַע אַבְרָם לְקוֹל שָׂרָי
  choice: 亚伯兰听从了撒莱的话
  rationale: “听从……的话”自然表达希伯来语“听某人的声音”在此所含的接受并照办之意；若直译“听了她的声音”，现代汉语容易只表示听觉行为。
theological_decisions:
- issue: 撒莱对自己不育原因的陈述
  choice: 耶和华使我不能生育
  alternative: 耶和华不让我生育
  rationale: 原文直接把阻止生育的行动归于耶和华。译文保留这一神学张力，不予弱化，也不增添解释来判断撒莱的认识是否完整。
- issue: 如何表达撒莱借女奴得子的计划
  choice: 或许我可以借着她建立起来
  alternative: 或许我可以借她得孩子
  rationale: 正文保留原文“被建造／建立”的家室比喻及其一定程度的含混，脚注说明语境中的可能含义，不将其缩减为单一解释。
- issue: 性关系委婉语的明确程度
  choice: 请你与我的女奴同房
  alternative: 请你到我的女奴那里去
  rationale: “同房”在现代汉语中仍是委婉表达，同时足以让普通读者明白所指；较字面的“到……那里去”可能造成不必要的含混。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“女奴”明确其受奴役身份；“同房”保持原文的委婉语体；“建立起来”刻意保存希伯来文的家室建造意象，并以脚注帮助普通读者理解。
