  naturalness: “称……为”处理命名行为基本自然；改为“给……起名，说”更清楚地表达此处的命名／称号宣告。末句须以可解析的汉语保留原文重复“看见”及“之后”的突兀关系。
  terminology: “雅威”与既定神名政策一致。“上帝”在本节庄重、现代的叙事语体中合宜。“看见我的上帝”对应אֵל רֳאִי，不应在正文擅自改为“鉴察”或“看见人”。
