  to: 于是她给那位对她说话的雅威起名，说：“你是看见我的上帝。”[a] 因为她说：“难道我在这里竟在那位看见我的一位之后看见了吗？”[b]
  rationale: 修订保留原文对雅威的命名宣告、אֵל רֳאִי中第一人称的关系，以及末句“看见／之后／看见”的难解结构。以“在那位看见我的一位之后看见”使汉语句法完整，但不补入“仍然活着”等解释性内容；该常见理解仅列于脚注。
