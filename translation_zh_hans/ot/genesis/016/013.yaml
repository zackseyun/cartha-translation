  text: וַ/תִּקְרָ֤א שֵׁם יְהוָה֙ הַ/דֹּבֵ֣ר אֵלֶ֔י/הָ אַתָּ֖ה אֵ֣ל רֳאִ֑י כִּ֣י אָֽמְרָ֗ה הֲ/גַ֥ם הֲלֹ֛ם רָאִ֖יתִי אַחֲרֵ֥י רֹאִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/013.yaml
  text: So she called the name of Yahweh who spoke to her[a], “You are a God who sees me,” for she said[c][b], “Have I really here seen after the One who sees me?”
translation:
  language: zh_hans
  text: 于是她给那位对她说话的雅威起名，说：“你是看见我的上帝。”[a] 因为她说：“难道我在这里竟在那位看见我的一位之后看见了吗？”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你是那位看见的上帝”，或“你是看见的上帝”。
    reason: lexical_alternative
  - marker: b
    text: 末句的希伯来语很难确定。也可理解为：“我在这里见了那看见我的一位以后，竟还活着吗？”另有理解将“之后”理解为“背后”。
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּקְרָא שֵׁם יְהוָה
  choice: 她称……雅威为
  rationale: 希伯来语直译为“她称雅威的名”。中文用“称……为”既表达赋予称号的动作，也避免误解为她只是呼喊雅威已有的名字。יהוה按其专名译作“雅威”。
- source_word: הַדֹּבֵר אֵלֶיהָ
  choice: 那位对她说话的
  rationale: 用关系结构自然表达分词的限定作用，明确雅威就是向夏甲说话的那一位。
- source_word: אַתָּה אֵל רֳאִי
  choice: 你是看见我的上帝
  rationale: רֳאִי的形式和含义较难确定，可指“看见我的一位”或“看见之上帝”。正文采用符合上下文且自然的译法，同时在脚注保留其他可能。
- source_word: כִּי אָֽמְרָה
  choice: 因为她说
  rationale: כִּי在此引出她如此称呼雅威的理由。
- source_word: הֲגַם הֲלֹם
  choice: 难道我在这里竟
  rationale: “难道……竟”共同传达疑问、惊讶和强调；“在这里”保留הֲלֹם的地点意义。
- source_word: רָאִיתִי אַחֲרֵי רֹאִי
  choice: 看见了那位看见我的之后
  rationale: 原文句法高度凝缩，אַחֲרֵי可涉及“在……之后”或“背后”，רֹאִי可理解为“那位看见我的”。此译法刻意保留原文的不寻常表达与歧义，不在正文中擅自补出“仍然活着”。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。音译“雅威”保留其作为专名的性质，不以称号替代。
- issue: אֵל רֳאִי的含义
  choice: 你是看见我的上帝
  alternative: 你是那位看见人的上帝；你是鉴察的上帝
  rationale: 上下文强调上帝看见处于苦境中的夏甲；正文表达这一关系，但不把希伯来语中可能的泛指或抽象含义绝对化。
- issue: 末句是否明确译成夏甲见神后仍然存活
  choice: 保留“看见……之后”的含混表达
  alternative: 我见了那看见我的一位以后，竟还活着吗？
  rationale: “仍然活着”是常见且有语境依据的解释，却不是这几个希伯来词明说的内容。正文保留文本的神学张力，脚注说明该解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“称……为”避免生硬照搬希伯来语“称……的名”；末句则适度保留原文刻意难解的结构，并由脚注帮助读者了解主要解释。
