base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/009.yaml
  text: Then the angel of Yahweh said to her[c][b][a], “Return to your mistress and humble yourself under her hand.”
translation:
  language: zh_hans
  text: 耶和华的使者[a]对她说：“你要回到你的女主人那里，顺服在她手下[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “使者”或译“天使”。
    reason: lexical_alternative
  - marker: b
    text: “在她手下”直译为“在她的手下”，指在她的权柄之下。此处“顺服”也可译为“自卑”；该动词在语境中也可能含有忍受苦待的意思。
    reason: lexical_and_cultural_note
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: 耶和华的使者
  rationale: מַלְאַךְ 可指“使者”，也可指“天使”。本处叙事语境表明这是来自上帝的使者；中文“使者”既贴近词义，也不额外断定其本体身份，歧义以脚注保留。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名“耶和华”译出四字神名，不以称号代替。
- source_word: שׁוּבִי אֶל גְּבִרְתֵּךְ
  choice: 你要回到你的女主人那里
  rationale: 准确传达阴性单数命令式“回去”和 גְּבִרְתֵּךְ 所指的女性主人；“女主人”在现代汉语中比单用“主人”更明确。
- source_word: וְהִתְעַנִּי
  choice: 服在
  rationale: 该 Hitpael 命令式在此表示甘愿处于卑下、受制的地位。“服在”结合下文“她手下”，自然表达顺服其权柄，同时避免将其窄化为内心谦卑。
- source_word: תַּחַת יָדֶיהָ
  choice: 她手下
  rationale: 保留希伯来语“在她手下”的身体意象；现代汉语“在某人手下”也自然表示处于其权柄之下。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用上帝的专名。译作“耶和华”保留专名性质，并采用普通现代中文读者较熟悉的形式；“雅威”是可能的音译替代。
- issue: מַלְאַךְ 的身份表达
  choice: 使者
  alternative: 天使
  rationale: 希伯来词本身兼有“使者”和“天使”之义。本节不必据此判定其本体身份，因此正文用较宽的“使者”，脚注列出传统且符合语境的“天使”。
- issue: וְהִתְעַנִּי 所表达的行动
  choice: 服在她手下
  alternative: 在她手下自卑；接受她权下的苦待
  rationale: 此动词可涉及自卑、受苦或受制；结合权柄习语“在她手下”，译文突出接受从属地位，但不把命令解释成认可苦待本身。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。正文保留“手下”的希伯来意象，因为该表达在中文中也能自然传达权柄关系；用脚注保留动词“自卑／受苦／受制”的语义张力。
