  text: וַ/תֹּ֨אמֶר שָׂרַ֣י אֶל אַבְרָם֮ חֲמָסִ֣/י עָלֶי/ךָ֒ אָנֹכִ֗י נָתַ֤תִּי שִׁפְחָתִ/י֙ בְּ/חֵיקֶ֔/ךָ וַ/תֵּ֨רֶא֙ כִּ֣י הָרָ֔תָה וָ/אֵקַ֖ל בְּ/עֵינֶ֑י/הָ יִשְׁפֹּ֥ט יְהוָ֖ה בֵּינִ֥/י וּ/בֵינֶֽיׄ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/005.yaml
  text: Then Sarai said to Abram[a], “The wrong done to me is on you. I gave my female slave into your embrace, and when she saw that she had conceived, I became contemptible in her eyes[b]. May Yahweh judge between me and you.”
translation:
  language: zh_hans
  text: 撒莱对亚伯兰说：“我所受的委屈，你要负责[a]。我把我的女奴交在你怀中[b]；她见自己怀了孕，我在她眼中就被轻看。愿雅威在你我之间判断。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译可作“我的委屈在你身上”或“我的冤屈归到你身上”；意思是撒莱认定亚伯兰应为她所受的不公负责。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“交在你胸怀中”，在这里是表示亲密结合的委婉说法。
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲמָסִי עָלֶיךָ
  choice: 我所受的委屈，你要负责
  rationale: חָמָס可指暴力、不公或侵害；第一人称所有格在此最自然地表示撒莱所遭受的委屈，而עָלֶיךָ把责任归到亚伯兰身上。译文保留指控语气，同时不把它误解为撒莱承认自己作恶。
- source_word: שִׁפְחָתִי
  choice: 我的女奴
  rationale: שִׁפְחָה指处于奴属身份的女性。“女奴”明确呈现其社会身份，避免较含混的“使女”淡化这种关系。
- source_word: בְּחֵיקֶךָ
  choice: 交在你怀中
  rationale: חֵיק本义为胸怀或怀抱，此处委婉表示亲密结合。“交在你怀中”保留原文意象，又符合现代汉语的庄重表达。
- source_word: הָרָתָה
  choice: 怀了孕
  rationale: 该完成式在“见”之后表示已经成孕的状态；“怀了孕”自然清楚。
- source_word: וָאֵקַל בְּעֵינֶיהָ
  choice: 我在她眼中就被轻看
  rationale: קלל在此表示被看轻、地位降低；“在她眼中”保留希伯来语评价性惯用语，并以“被轻看”呈现结果和受动意味。
- source_word: יִשְׁפֹּט יְהוָה
  choice: 愿雅威……判断
  rationale: 未完成式在此具有祈愿或呼求裁断的语气。“愿……判断”保留撒莱诉诸神圣裁决的力度；专名יְהוָה音译为“雅威”。
- source_word: בֵּינִי וּבֵינֶיךָ
  choice: 在你我之间
  rationale: 直指争执的双方，并保留请求第三方裁断的法庭性意味。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。译作“雅威”将其作为专名呈现，而不以称号替代。
- issue: 撒莱指控的责任归属
  choice: 译为“我所受的委屈，你要负责”
  alternative: “我的暴行归在你身上”或“愿我的错归到你身上”
  rationale: 上下文表明撒莱是在控诉自己受到轻看，并把责任归给亚伯兰，而不是明确承认自己的罪责；不过所有格חֲמָסִי本身较凝练，因此用脚注保留较直译的形式与歧义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。人名沿用通行译名“撒莱、亚伯兰”；以“女奴”明确奴属身份；保留“在她眼中”和“怀中”等希伯来语意象，但调整句法使其符合自然现代汉语。
