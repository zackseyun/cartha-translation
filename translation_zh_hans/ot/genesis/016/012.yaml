reference: Genesis 16:12
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/ה֤וּא יִהְיֶה֙ פֶּ֣רֶא אָדָ֔ם יָד֣/וֹ בַ/כֹּ֔ל וְ/יַ֥ד כֹּ֖ל בּ֑/וֹ וְ/עַל פְּנֵ֥י כָל אֶחָ֖י/ו יִשְׁכֹּֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/012.yaml
  text: And he will be a wild donkey of a man[a]; his hand will be against everyone, and everyone's hand against him[c][b], and he will dwell opposite all his brothers.
translation:
  language: zh_hans
  text: 他必成为一个像野驴般的人[a]；他的手要攻击众人，众人的手也要攻击他；他必住在他所有弟兄[c]的对面[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“野驴一样的人”。希伯来语直把他比作野驴，形象侧重不受驯束，并非只说他“野蛮”。
    reason: lexical_alternative
  - marker: b
    text: “对面”也可理解为“面前”或“相对而居”，并可能含有“与……对立”的意味。
    reason: lexical_alternative
  - marker: c
    text: “弟兄”也可泛指近亲、同族或有亲缘关系的族群。
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּרֶא אָדָם
  choice: 一个像野驴般的人
  rationale: פֶּרֶא明确指野驴，而非抽象的“野性”；这一并置表达把以实玛利描绘为像野驴一样不受驯束的人。译文保留动物比喻，同时用现代汉语自然表达。
- source_word: אָדָם
  choice: 人
  rationale: 此处指特定的男性个体以实玛利；汉语“人”在该结构中自然，并不把所指扩大为全人类。
- source_word: יָדוֹ בַכֹּל
  choice: 他的手要攻击众人
  rationale: “手”在语境中表示敌对行动。保留“手”的意象和下句的平行结构，并以“攻击”明示介词在此处的敌对含义。
- source_word: וְיַד כֹּל בּוֹ
  choice: 众人的手也要攻击他
  rationale: 与前句形成对称，呈现彼此敌对的关系；保留原文重复的“手”。
- source_word: וְעַל־פְּנֵי
  choice: 在……的对面
  rationale: 原短语可表示在面前、对面或相对而居；正文采用较能保留空间和关系双重意味的“对面”，不武断限定为方位或公然反抗。
- source_word: כָּל־אֶחָיו
  choice: 他所有弟兄
  rationale: אָח的基本义是“兄弟”，也可扩展指近亲或同族。正文保留基本义，脚注说明较宽泛的可能范围。
- source_word: יִשְׁכֹּן
  choice: 住
  rationale: שׁכן表示居住、定居；“住”是清楚、自然且不额外限定居住方式的现代汉语。
theological_decisions:
- issue: 如何表达פֶּרֶא אָדָם对以实玛利的刻画
  choice: 明确保留野驴比喻，译为“一个像野驴般的人”
  alternative: 译为“野人”或“性情野蛮的人”
  rationale: 原文使用具体的动物形象，可能着重不受驯束和自由生活，也与随后冲突性的描述相连。保留比喻可避免把它简化成单纯的道德贬义。
- issue: וְעַל־פְּנֵי所表达的关系
  choice: 正文译为“在……的对面”，并用脚注保留多义性
  alternative: 译为“在……面前”“与……对立”或“在……东边”
  rationale: 该短语在此既可能是空间描述，也可能带有相对、对峙意味；上下文本身不足以完全排除这些可能，不宜在正文中只选一种神学或历史解释。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。正文保留“野驴”和“手”的具体意象及句间平行；对含义范围较宽的“对面”和“弟兄”用脚注说明，不在正文中消除原文的歧义。
