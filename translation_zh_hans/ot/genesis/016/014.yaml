  yaml_path: translation/ot/genesis/016/014.yaml
  text: Therefore the well was called Beer-lahai-roi. Look, it is between Kadesh and Bered.
translation:
  language: zh_hans
  text: 因此，那口井名叫“庇耳·拉海·莱”[a]。看哪，它在加低斯和巴列之间。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “庇耳·拉海·莱”的意思通常理解为“看顾我的永活者之井”；其确切语法关系和释义仍有争议。
    reason: 该井名的构造存在语法与释义上的争议；脚注给出主要理解，同时不把它定为唯一解释。
lexical_decisions:
- source_word: עַל כֵּן
  choice: 因此
  rationale: 自然表达前文事件与命名之间的因果关系。
- source_word: קָרָא לַבְּאֵר
  choice: 人称那口井为
  rationale: 希伯来语动词为第三人称单数，但未明说主语；用泛指的“人称”保留主语不确定性，并符合中文命名表达。
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留原文引人注意、指明地点的语气，采用庄重而仍可理解的现代中文。
- source_word: קָדֵשׁ וּבֵין בָּרֶד
  choice: 加低斯和巴列之间
  rationale: 按常用圣经地名音译处理，并准确呈现 בֵּין...וּבֵין 的空间关系。
theological_decisions:
- issue: 井名 בְּאֵר לַחַי רֹאִי 的含义
  choice: 正文音译为“庇耳·拉海·莱”，脚注说明可能含义
  alternative: 在正文直译为“看顾我的永活者之井”等
  rationale: 该名称的语法和确切释义存在歧义；正文保留专名，脚注呈现可能含义，避免把一种解释定为唯一答案。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“看哪”保留原文提示读者注意的语用功能；专名使用常见中文圣经音译。
