  text: וַ/תִּקַּ֞ח שָׂרַ֣י אֵֽשֶׁת אַבְרָ֗ם אֶת הָגָ֤ר הַ/מִּצְרִית֙ שִׁפְחָתָ֔/הּ מִ/קֵּץ֙ עֶ֣שֶׂר שָׁנִ֔ים לְ/שֶׁ֥בֶת אַבְרָ֖ם בְּ/אֶ֣רֶץ כְּנָ֑עַן וַ/תִּתֵּ֥ן אֹתָ֛/הּ לְ/אַבְרָ֥ם אִישָׁ֖/הּ ל֥/וֹ לְ/אִשָּֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/003.yaml
  text: So Sarai[a], Abram’s wife, took Hagar the Egyptian, her female slave, after Abram had lived ten years in the land of Canaan[b], and gave her to Abram her husband as a wife.
translation:
  language: zh_hans
  text: 亚伯兰在迦南地住满十年以后[a]，亚伯兰的妻子撒莱就取了她的女奴、埃及人夏甲，交给她丈夫亚伯兰，给他作妻子[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“到了亚伯兰住在迦南地满十年的时候”。
    reason: 原文מִקֵּץ可强调十年期满之时，也可按上下文表达为十年以后。
  - marker: b
    text: 希伯来文直译“给他作妻子”；本节同时称夏甲为撒莱的女奴。
    reason: 说明原文对夏甲身份的双重陈述，避免将“妻子”擅自改释为“妾”。
lexical_decisions:
- source_word: וַתִּקַּח
  choice: 带来
  rationale: לקח在叙事中常指“拿、带、领”；这里宾语是夏甲，用“带来”比生硬的“拿”更符合现代汉语，同时不把动作解释成亚伯兰主动“娶”她。
- source_word: שָׂרַי אֵשֶׁת אַבְרָם
  choice: 亚伯兰的妻子撒莱
  rationale: 保留同位关系，明确撒莱与亚伯兰的婚姻身份，表达自然庄重。
- source_word: הָגָר הַמִּצְרִית
  choice: 埃及人夏甲
  rationale: 准确表达夏甲的族属或来源；人名采用现代中文圣经通行译名。
- source_word: שִׁפְחָתָהּ
  choice: 她的女奴
  rationale: שִׁפְחָה指女性奴仆；“女奴”清楚保留其受奴役的社会身份，避免用“使女”弱化原文。
- source_word: מִקֵּץ עֶשֶׂר שָׁנִים לְשֶׁבֶת אַבְרָם בְּאֶרֶץ כְּנָעַן
  choice: 在亚伯兰住在迦南地满了十年以后
  rationale: מִקֵּץ表示一段时期结束之际或之后；“满了十年以后”兼顾时间已届满的含义和现代汉语的流畅度。
- source_word: וַתִּתֵּן אֹתָהּ לְאַבְרָם אִישָׁהּ
  choice: 交给她丈夫亚伯兰
  rationale: “交给”自然表达נתן的给予动作；“她丈夫”保留אִישָׁהּ所明示的婚姻关系。
- source_word: לוֹ לְאִשָּׁה
  choice: 给他作妻子
  rationale: 保留אִשָּׁה的直接含义“妻子”，并体现לוֹ的关系指向；不改译为原文未使用的“妾”。
theological_decisions:
- issue: 夏甲与亚伯兰之间的身份
  choice: 译作“给他作妻子”，同时保留夏甲是撒莱“女奴”的陈述。
  alternative: 译作“给他作妾”或仅译作“成为他的女人”。
  rationale: 原文明用אִשָּׁה（女人／妻子），并同时称夏甲为撒莱的שִׁפְחָה（女奴）。译文并列保留这两重身份，不以“妾”等解释性法律称谓消解文本中的社会与神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。人名与地名使用简体中文圣经传统通行形式；句序适度调整以清楚呈现时间背景，同时保留撒莱连续实施“带来、交给”的叙事主体性。
