source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אַבְרָ֜ם אֶל שָׂרַ֗י הִנֵּ֤ה שִׁפְחָתֵ/ךְ֙ בְּ/יָדֵ֔/ךְ עֲשִׂי לָ֖/הּ הַ/טּ֣וֹב בְּ/עֵינָ֑יִ/ךְ וַ/תְּעַנֶּ֣/הָ שָׂרַ֔י וַ/תִּבְרַ֖ח מִ/פָּנֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/006.yaml
  text: Then Abram said to Sarai[a], “Look, your female slave is in your hand; do to her what is good in your eyes.” Then Sarai afflicted her, and she fled from her presence.
translation:
  language: zh_hans
  text: 亚伯兰对撒莱说：“看，你的女奴在你手中；你认为怎样好，就怎样待她吧。”于是撒莱苦待她[a]，她就从撒莱面前逃走了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“使她受苦”、“虐待她”或“严厉地对待她”。希伯来语动词可指使人受苦、受辱或遭受严厉对待。
    reason: 说明 וַתְּעַנֶּהָ 的词义范围，并保留原文未具体说明苦待方式的含混性。
lexical_decisions:
- source_word: הִנֵּה
  choice: 看
  rationale: 用现代汉语自然的提示语保留原文引起注意的功能，不采用较古雅的“看哪”。
- source_word: שִׁפְחָתֵךְ
  choice: 你的女奴
  rationale: 明确表达 שִׁפְחָה 所指的女性奴隶身份，不以泛指服役者的“使女”或“婢女”淡化其受支配的社会地位。
- source_word: בְּיָדֵךְ
  choice: 在你手中
  rationale: 保留希伯来语“在手中”的形象，也清楚传达处于撒莱权柄之下的含义。
- source_word: הַטּוֹב בְּעֵינָיִךְ
  choice: 你认为怎样好
  rationale: 以自然现代汉语传达“在你眼中为好”的判断含义，避免生硬直译，同时不替原文规定具体做法。
- source_word: וַתְּעַנֶּהָ
  choice: 苦待她
  rationale: 该词在此为 piel 词形，可表示使人受苦、压迫、羞辱或严厉对待；“苦待”既表达行为的严重性，也不擅自限定具体方式。
- source_word: וַתִּבְרַח
  choice: 逃走了
  rationale: 准确表达因受苦待而逃离的动作，符合现代汉语叙事语体。
- source_word: מִפָּנֶיהָ
  choice: 从撒莱面前
  rationale: 保留原文“从她面前”的表达，并用专名消除汉语连续女性代词可能造成的指代含混。
theological_decisions:
- issue: 夏甲的社会身份
  choice: 女奴
  alternative: 使女／婢女／女仆
  rationale: 本节的权力关系与叙事发展密切相关；“女奴”直接呈现其受奴役、受支配的身份，不将其弱化为一般家仆。
- issue: 撒莱对夏甲行为的严重程度
  choice: 苦待她
  alternative: 使她受苦／虐待她／严厉地对待她
  rationale: 原文表明真实的压迫或严酷对待，但没有说明具体形式。“苦待”保留其严重性，同时避免把未明说的虐待方式加入正文；脚注呈现词义范围。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“女奴”明确社会身份；“在你手中”保留原文意象；为避免多个“她”造成歧义，末句明确写作“从撒莱面前”。
