base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/001.yaml
  text: Sarai[a], Abram’s wife, had borne him no children, and she had an Egyptian slave woman whose name was Hagar.
translation:
  language: zh_hans
  text: 亚伯兰的妻子撒莱没有给他生孩子。她有一个埃及女奴[a]，名叫夏甲。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “女奴”也可译作“婢女”或“女仆”。希伯来语指家庭中处于奴仆身份的女性；这里译作“女奴”，是为保留她受奴役的社会地位。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׂרַי אֵשֶׁת אַבְרָם
  choice: 亚伯兰的妻子撒莱
  rationale: 将同位关系自然表达为“亚伯兰的妻子撒莱”；句首的 וְ 在这里承接并推进叙事，不必机械译作“和”或添加原文没有的时间副词。人名采用现代中文圣经中通行的译名。
- source_word: לֹא יָלְדָה לוֹ
  choice: 没有给他生孩子
  rationale: 原文直义为“没有为/给他生育”。现代汉语需要补出语境中隐含的受事“孩子”，并保留 לוֹ 所表达的“给他”。
- source_word: וְלָהּ
  choice: 她有
  rationale: 希伯来语以“对她有……”的结构表示领属，现代汉语自然译为“她有”。
- source_word: שִׁפְחָה מִצְרִית
  choice: 一个埃及女奴
  rationale: שִׁפְחָה 指处于从属、受役使地位的女性奴仆；译作“女奴”比“侍女”更明确地保留其受奴役的社会身份。מִצְרִית 作为修饰语译为“埃及”。
- source_word: וּשְׁמָהּ הָגָר
  choice: 名叫夏甲
  rationale: 简洁自然地表达“她的名字是夏甲”，没有省略姓名识别的功能。
