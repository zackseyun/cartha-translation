base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/015.yaml
  text: Hagar bore a son to Abram[a], and Abram called the name of his son, whom Hagar bore, Ishmael.
translation:
  language: zh_hans
  text: 夏甲给亚伯兰生了一个儿子；亚伯兰给夏甲所生的儿子起名叫以实玛利。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֵּלֶד
  choice: 生了
  rationale: ילד的主语为女性时，通常表示“生、生育”；“生了”符合现代汉语叙事表达。
- source_word: לְאַבְרָם
  choice: 给亚伯兰
  rationale: 介词ל在这里表示关系或归属，即夏甲所生的儿子归亚伯兰为子；“给亚伯兰生了”既贴近原文，也符合汉语习惯。
- source_word: בֵּן
  choice: 一个儿子
  rationale: 原文名词无定冠词；汉语用“一个儿子”自然表达其不定性。
- source_word: וַיִּקְרָא ... שֶׁם
  choice: 起名叫
  rationale: קרא שם是“称其名、给……起名”的固定表达；“起名叫”在现代汉语中自然，并保留命名动作与名字本身。
- source_word: בְּנוֹ
  choice: 儿子
  rationale: 原文为“他的儿子”，但汉语在“亚伯兰给……儿子起名”的结构中，所属关系已由主语和上下文清楚表达；省去“他的”可避免生硬或指代歧义。
- source_word: אֲשֶׁר יָלְדָה הָגָר
  choice: 夏甲所生的
  rationale: 保留原文关系从句及对夏甲的再次明说；“所生的”简洁、庄重，适合经文叙事。
- source_word: יִשְׁמָעֵאל
  choice: 以实玛利
  rationale: 采用该希伯来人名在现代中文圣经传统中的通行译名。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重的现代标准汉语。以分号连接原文两个连续动作，保留“夏甲”在后半句中的重复，以呈现希伯来文的强调和结构；不添加原文未明说的神学解释。
