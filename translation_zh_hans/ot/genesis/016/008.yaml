base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/008.yaml
  text: And he said[a], “Hagar, Sarai’s slave woman, where have you come from, and where are you going?” And she said[b], “I am fleeing from the presence of Sarai my mistress.”
translation:
  language: zh_hans
  text: 他说：“夏甲，撒莱的女奴[a]，你从哪里来？要往哪里去？”她说：“我正从我女主人撒莱面前[b]逃走。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“女仆”或“婢女”；希伯来文指隶属于撒莱、处于受役使地位的女性。
    reason: lexical_alternative
  - marker: b
    text: 直译“从我女主人撒莱面前”。在这里表示逃离或躲避她。
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁפְחַת
  choice: 女奴
  rationale: 该词指处于从属、受役使地位的女性；“女奴”明确保留其性别和奴役身份，避免用“女仆”等较柔化的说法掩盖社会地位。
- source_word: אֵי מִזֶּה
  choice: 你从哪里来
  rationale: 这是询问来处的惯用表达；此译法贴近原意，也符合现代汉语口语。
- source_word: וְאָנָה תֵלֵכִי
  choice: 要往哪里去
  rationale: אָנָה与“去”连用，询问目的地；“要往哪里去”自然地表达未完成式在此处的趋向意义。
- source_word: מִפְּנֵי
  choice: 从……面前
  rationale: 保留该介词短语“从……面前／眼前”的形象，同时在“逃走”的语境中自然表达逃离某人的意思。
- source_word: גְּבִרְתִּי
  choice: 我的女主人
  rationale: 阴性名词指女性上位者或主人；“女主人”准确呈现撒莱与夏甲之间的支配关系。
- source_word: בֹּרַחַת
  choice: 我正……逃走
  rationale: 分词表示正在持续的行动；“正……逃走”保留进行中的语气。
- source_word: וַיֹּאמַר
  choice: 他说
  rationale: 原文只用阳性单数动词承接上一节的说话者，并未在本节重述其身份，因此不在正文补出“耶和华的使者”。
- source_word: הָגָר
  choice: 夏甲
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: שָׂרַי
  choice: 撒莱
  rationale: 采用现代中文圣经传统中通行的人名译法。
theological_decisions:
- issue: 如何呈现夏甲的社会身份
  choice: 女奴
  alternative: 女仆／婢女
  rationale: 原文明确以受奴役的从属身份称呼夏甲；正文不以较柔化的传统用语淡化这一关系。
- issue: 是否在本节明说说话者是耶和华的使者
  choice: 他说
  alternative: 耶和华的使者说
  rationale: 上一节已交代说话者，但本节希伯来文没有重述其称号；译文保留本节自身的指代方式，不从上下文增补名号。
- issue: 如何处理“从……面前”
  choice: 在正文保留“从我的女主人撒莱面前逃走”
  alternative: 躲避我的女主人撒莱／逃离我的女主人撒莱
  rationale: 此译法既保留 מִפְּנֵי 的具体措辞，也不排除它在语境中表示逃离、躲避其管辖或压迫的含义。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。问句以“你从哪里来？要往哪里去？”保持直接对话的流畅感；以“女奴”明确社会身份，以“女主人”呈现双方的不对等关系。
