id: GEN.16.10
reference: Genesis 16:10
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר לָ/הּ֙ מַלְאַ֣ךְ יְהוָ֔ה הַרְבָּ֥ה אַרְבֶּ֖ה אֶת זַרְעֵ֑/ךְ וְ/לֹ֥א יִסָּפֵ֖ר מֵ/רֹֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/010.yaml
  text: Then the angel of Yahweh said to her[a], “I will greatly multiply your offspring, so that it cannot be counted because of its multitude.”
translation:
  language: zh_hans
  text: 耶和华的使者又对她说[a]：“我要使你的后裔极其增多，多得无法数算。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “耶和华的使者”也可译作“耶和华的天使”。
    reason: 说明 מַלְאַךְ 既可泛指“使者”，也可特指天上的使者。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 又……说
  rationale: 承接上一节同一位说话者继续发言；“又”自然体现叙事推进和重复言说，比机械译作“然后”更符合本段汉语语境。
- source_word: מַלְאַךְ יְהוָה
  choice: 耶和华的使者
  rationale: מַלְאַךְ 的基本义是受差遣的“使者”，也可指天使；正文采用不预先限定其性质的“使者”，保留词义及身份上的张力。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名形式音译四字神名，不用头衔“主”替代。
- source_word: הַרְבָּה אַרְבֶּה
  choice: 使……极其增多
  rationale: 不定式绝对式与同根限定动词连用，加强增多的程度；“极其增多”在现代汉语中自然表达这种程度强化，而不将其改释为誓言式的确定性。
- source_word: זַרְעֵךְ
  choice: 你的后裔
  rationale: זֶרַע 在此为集合名词，指夏甲将繁衍的后代；“后裔”能自然表达整体性的世代群体。
- source_word: וְלֹא יִסָּפֵר מֵרֹב
  choice: 多得无法数算
  rationale: 将结果和原因压缩为自然汉语，既表达因数量众多而不能被数点，也保持原文所强调的不可胜数。
theological_decisions:
- issue: מַלְאַךְ יְהוָה 的身份与性质
  choice: 正文译“耶和华的使者”，脚注列“耶和华的天使”
  alternative: 正文直接译“耶和华的天使”
  rationale: 原词可泛指使者，也可指天上使者；不在译文中进一步判定其本体身份，以保留叙事中的神学张力。
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 采用现代简体中文圣经传统中广为人知的神名音译，并避免以称号取代原文专名。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“多得无法数算”避免重复“增多／众多”，同时清楚呈现原文的结果关系。
