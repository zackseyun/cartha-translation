  yaml_path: translation/ot/genesis/044/017.yaml
  text: But he said[a], "Far be it from me to do this. The man in whose hand the cup was found—he shall be my slave[b], but you may go up in peace to your father."
translation:
  language: zh_hans
  text: 他却说：“我绝不可这样做！那杯在谁手中找到，那人就作我的奴隶[a]；至于你们，可以平平安安地上到你们父亲那里去。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “奴隶”也可译作“仆人”。希伯来语 עָבֶד 可指“奴隶”或“仆人”；这里采用“奴隶”，因为上下文所说的是作为惩罚而受强制役属。
    reason: lexical_alternative
lexical_decisions:
- source_word: חָלִילָה לִּי
  choice: 我绝不会
  rationale: 这是表达强烈拒绝或厌恶的希伯来语惯用语；译为“我绝不会”自然、明确，并保留其强烈语气。
- source_word: מֵעֲשׂוֹת זֹאת
  choice: 这样做
  rationale: 直接表达说话者坚决拒绝采取前文所提议的做法。
- source_word: הָאִישׁ אֲשֶׁר נִמְצָא הַגָּבִיעַ בְּיָדוֹ
  choice: 杯在谁手中找到，谁
  rationale: 保留原文“在他手中”的具体意象，同时用现代汉语的关联结构自然表达。
- source_word: הוּא יִהְיֶה לִּי עָבֶד
  choice: 谁就作我的奴隶
  rationale: עָבֶד 可指仆人或奴隶；此处是因杯被查出而施加的强制性役属，“奴隶”更能体现惩罚性束缚。
- source_word: וְאַתֶּם עֲלוּ
  choice: 至于你们，可以……上到
  rationale: 复数命令语在语境中带有准许其余兄弟离开的含义；“至于”凸显与被扣留者之间的对比，“可以”体现放行。
- source_word: לְשָׁלוֹם
  choice: 平平安安地
  rationale: 自然表达安全离去、免受追究的含义，也保留 שָׁלוֹם 的平安意涵。
- source_word: אֶל אֲבִיכֶם
  choice: 到你们父亲那里去
  rationale: 准确而自然地表达目的地；“你们”对应原文复数领属。
