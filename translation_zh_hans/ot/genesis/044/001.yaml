base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/001.yaml
  text: Then he commanded the one over his house[a], saying, “Fill the men's sacks with food, as much as they can carry, and put each man's silver in the mouth of his sack.”
translation:
  language: zh_hans
  text: 他吩咐管理他家的人说：“把这些人的袋子装满食物，按他们所能携带的量装；又把各人的银子放在各自袋子的口里[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“各自袋子的口里”，即袋子的开口处。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: 他吩咐
  rationale: 该叙事动词承接上文并推进事件；现代汉语无需另加“然后”也能自然表达顺承，同时保留命令语气。
- source_word: אֲשֶׁר עַל בֵּיתוֹ
  choice: 管理他家的人
  rationale: 原文直译为“在他家之上的人”，指负责管理其家务的人；此译法既清楚自然，又避免用“管家”过度限定其正式职衔。
- source_word: מַלֵּא אֶת אַמְתְּחֹת הָאֲנָשִׁים אֹכֶל
  choice: 把食物装满这些人的袋子
  rationale: 保留“装满”的命令和“食物”这一宽泛词义，不根据上下文收窄为“粮食”。
- source_word: כַּאֲשֶׁר יוּכְלוּן שְׂאֵת
  choice: 他们能带多少，就装多少
  rationale: 自然表达原文“按他们所能承载的”之意，并清楚说明所装数量以携带能力为限。
- source_word: כֶּסֶף אִישׁ
  choice: 各人的银子
  rationale: 保留כֶּסֶף的“银子”及אִישׁ的逐一分配含义，不在正文中进一步解释为货款。
- source_word: בְּפִי אַמְתַּחְתּוֹ
  choice: 放在各自的袋口
  rationale: 将希伯来语“袋子的口”按现代汉语习惯译为“袋口”，准确指袋子的开口处；脚注保留原文意象。
