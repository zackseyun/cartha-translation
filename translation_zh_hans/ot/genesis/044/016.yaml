  text: וַ/יֹּ֣אמֶר יְהוּדָ֗ה מַה נֹּאמַר֙ לַֽ/אדֹנִ֔/י מַה נְּדַבֵּ֖ר וּ/מַה נִּצְטַדָּ֑ק הָ/אֱלֹהִ֗ים מָצָא֙ אֶת עֲוֺ֣ן עֲבָדֶ֔י/ךָ הִנֶּ/נּ֤וּ עֲבָדִים֙ לַֽ/אדֹנִ֔/י גַּם אֲנַ֕חְנוּ גַּ֛ם אֲשֶׁר נִמְצָ֥א הַ/גָּבִ֖יעַ בְּ/יָדֽ/וֹ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/016.yaml
  text: And Judah said[a], “What shall we say to my lord? What shall we speak? Or how shall we justify ourselves? God has found out the guilt of your slaves. Here we are, my lord’s slaves[c][b], both we and the one in whose hand the cup was found.”
translation:
  language: zh_hans
  text: 犹大说：“我们还能对我主说什么呢？还能讲什么呢？又怎能证明自己无罪呢？[a]神已经查出了你仆人们的罪孽。[b]看哪，我们都是我主的奴隶：我们以及那杯子是在他手中被找到的人。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “证明自己无罪”或译“为自己辩白”。原文动词可指证明自己有理或无罪。
    reason: lexical_alternative
  - marker: b
    text: “查出了……的罪孽”或译“揭露了……的罪责”。犹大没有明说这里指偷杯之罪，还是兄弟们从前隐藏的罪。
    reason: lexical_and_contextual_ambiguity
lexical_decisions:
- source_word: לַאדֹנִי
  choice: 对我主／我主的
  rationale: 指处于权位的约瑟，而非神。“我主”保留古代宫廷语境中的恭敬称呼。
- source_word: מַה נֹּאמַר / מַה נְּדַבֵּר
  choice: 还能说什么／还能讲什么
  rationale: 保留两个近义动词形成的修辞递进；“还能”自然表达此处无言可辩的语气。
- source_word: וּמַה נִּצְטַדָּק
  choice: 又怎能表明自己无罪
  rationale: 该词反身词干表示证明自己有理或无罪；此译在现代汉语中自然，并保留司法辩白色彩。
- source_word: מָצָא אֶת־עֲוֹן
  choice: 查出了……的罪孽
  rationale: 既保留“找到”的发现含义，也传达隐藏罪责被神揭露的语境意义。
- source_word: עֲבָדֶיךָ / עֲבָדִים
  choice: 你仆人们／奴隶
  rationale: 前者是下属面对尊长的自谦称谓，后者则是兄弟们实际提出接受的受奴役身份，故作区别。
- source_word: הִנֶּנּוּ
  choice: 看哪，我们都是
  rationale: 保留呈示和交付自身的语气；“看哪”庄重且为普通读者所能理解。
- source_word: גַּם אֲנַחְנוּ גַּם אֲשֶׁר נִמְצָא הַגָּבִיעַ בְּיָדוֹ
  choice: 我们和那只杯子在他手中被找到的人，都是如此
  rationale: 保留双重 גַּם 对双方的并列包含，也尽量维持“在他手中被找到”的法律性发现措辞。
theological_decisions:
- issue: הָאֱלֹהִים 所指
  choice: 神
  alternative: 某位神明／诸神
  rationale: 在《创世记》的叙事和犹大的话语中，此处明确指独一的神；同时不扩写犹大所指罪孽究竟是哪一件，以保留经文的含混和张力。
- issue: עָוֹן 的意义范围
  choice: 罪孽
  alternative: 罪责／罪的刑罚
  rationale: 该词可指罪行、罪责或其后果；“罪孽”保留道德过犯与负罪状态之间的语义张力，不把它限定为偷杯之罪。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“我主”保留身份差异；“仆人们”与“奴隶”刻意区分礼貌自称和实际受奴役身份。脚注标记均置于正文相关句末。
