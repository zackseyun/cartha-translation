  text: וַ/יִּגַּ֨שׁ אֵלָ֜י/ו יְהוּדָ֗ה וַ/יֹּאמֶר֮ בִּ֣י אֲדֹנִ/י֒ יְדַבֶּר נָ֨א עַבְדְּ/ךָ֤ דָבָר֙ בְּ/אָזְנֵ֣י אֲדֹנִ֔/י וְ/אַל יִ֥חַר אַפְּ/ךָ֖ בְּ/עַבְדֶּ֑/ךָ כִּ֥י כָמ֖וֹ/ךָ כְּ/פַרְעֹֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/018.yaml
  text: Then Judah came near to him and said[a], “Please, my lord, let your servant speak a word in my lord’s hearing, and do not let your anger burn against your servant[c][b], for you are like Pharaoh.”
translation:
  language: zh_hans
  text: 于是，犹大走近约瑟，说：“我主啊，求你容仆人向我主说一句话，不要向仆人发怒，因为你如同法老。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּגַּשׁ אֵלָיו יְהוּדָה
  choice: 于是，犹大走近约瑟
  rationale: נגשׁ表示上前、靠近；明说“约瑟”可使现代中文指代清楚，同时保留犹大郑重上前的动作。
- source_word: בִּי אֲדֹנִי
  choice: 我主啊，求你
  rationale: בִּי在此是恭敬恳求的感叹语；译作“求你”自然传达请求语气，אֲדֹנִי保留为尊称“我主”。
- source_word: יְדַבֶּר נָא עַבְדְּךָ דָבָר
  choice: 容仆人……说一句话
  rationale: 保留犹大以“仆人”自称的谦卑宫廷用语；“说一句话”既对应单数דָבָר，也符合中文恳请陈言的表达。
- source_word: בְּאָזְנֵי אֲדֹנִי
  choice: 向我主说
  rationale: 原文直译为“在我主耳中”，是让对方听取陈言的希伯来习语；中文以“向我主说”自然传达其功能。
- source_word: וְאַל יִחַר אַפְּךָ בְּעַבְדֶּךָ
  choice: 不要向仆人发怒
  rationale: 原文以“怒气燃烧”表达发怒；现代中文“发怒”准确自然，并保留怒气指向“仆人”的关系。
- source_word: כִּי כָמוֹךָ כְּפַרְעֹה
  choice: 因为你如同法老
  rationale: 直译比较结构，不将其强化为与法老完全相等；语境侧重约瑟所具有的权势与地位。
theological_decisions:
- issue: “你如同法老”所表达的关系
  choice: 保留直接比较，不加解释
  alternative: 译作“你与法老无异”或“你的地位仅次于法老”
  rationale: 原文只说“如同法老”，可能强调权威、地位或令人畏惧的权势；正文不应替原文排除这些语义空间。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“我主”“仆人”保留宫廷语境中的恭敬与自谦，但避免过度文言化。原文的听觉习语和怒气隐喻在正文中作自然化处理，未设置必要脚注。
