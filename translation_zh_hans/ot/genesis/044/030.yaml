base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/030.yaml
  text: Now[a], when I come to your servant my father[b], and the boy is not with us—his life being bound up with the boy’s life—
translation:
  language: zh_hans
  text: 现在，我回到你仆人、我父亲那里时，这孩子不与我们同在——我父亲的性命与这孩子的性命相连[a]——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译可作“他的性命系于他的性命”；原文两次使用 נֶפֶשׁ（可指“性命、生命、自身”）。第一个“他”指父亲，第二个“他”按上下文指这孩子便雅悯。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: 现在
  rationale: 承接犹大的陈情并引出设想的下一步；现代汉语中“现在”已能自然体现话语推进。
- source_word: כְּבֹאִי
  choice: 我回到……那里
  rationale: כְּ加不定词及第一人称单数后缀表达将来的时间情境。上下文是犹大返回父亲身边，因此译作“回到……那里”比机械的“来到”更符合汉语视角。
- source_word: אֶל־עַבְדְּךָ אָבִי
  choice: 你仆人我父亲那里
  rationale: 保留犹大对约瑟的谦卑措辞，也清楚表达“你仆人”与“我父亲”同指雅各。
- source_word: הַנַּעַר
  choice: 这孩子
  rationale: נַעַר可指少年或年轻男子；此处是犹大从家庭关系及父亲的情感角度谈便雅悯，“这孩子”自然地保留这种语气，并不强行界定年龄。
- source_word: אֵינֶנּוּ אִתָּנוּ
  choice: 没有和我们在一起
  rationale: 直接、自然地表达存在否定及同行关系。
- source_word: וְנַפְשׁוֹ קְשׁוּרָה בְנַפְשׁוֹ
  choice: 我父亲的性命与这孩子的性命紧紧相连
  rationale: נֶפֶשׁ在这里指人的生命、性命；קְשׁוּרָה表达牢固联结。将两个代词的语境所指明说出来，可避免现代汉语中的指代混乱，同时脚注保留原文形式。
theological_decisions:
- issue: נֶפֶשׁ是否译作具有技术意味的“灵魂”
  choice: 性命
  alternative: 灵魂
  rationale: 本句强调父亲的生命和情感完全系于便雅悯，并非在建立灵魂论；“性命”更贴合此处语义，也避免导入源文没有的神学区分。
- issue: 末句与前句的逻辑关系
  choice: 用破折号保留附带说明的开放性
  alternative: 译为“因为我父亲的性命……”明确标示因果
  rationale: 希伯来语以וְ连接分词性情状句，可带解释意味，但没有明确的因果连词；破折号既呈现补充说明，也不把关系限定为纯粹因果。
translation_notes:
  register: 采用现代、庄重而口语可懂的陈情语体。“如果”使尚未发生的返家情境在汉语中清楚自然；句末破折号表示本节句法未完，内容延续至下一节。
