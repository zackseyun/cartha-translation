base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/015.yaml
  text: And Joseph said to them[a], “What is this deed that you have done? Did you not know that a man like me indeed practices divination?”
translation:
  language: zh_hans
  text: 约瑟对他们说：“你们做的这是什么事？难道你们不知道，像我这样的人必定会占卜吗？”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“必定占卜”“必能借占卜查明”，或“必能查出这种事”。希伯来文以“占卜”一词的同源不定式绝对式加强该动词。
    reason: 说明希伯来文加强结构及其在本语境中可能表达的不同侧重，同时保留“占卜”的直接词义。
lexical_decisions:
- source_word: מָה הַמַּעֲשֶׂה הַזֶּה
  choice: 你们做的这是什么事
  rationale: מַעֲשֶׂה指行为、所做之事；此译自然保留约瑟责问的语气和道德分量。
- source_word: עֲשִׂיתֶם
  choice: 你们做的
  rationale: 完成式指向他们已经做成、如今受到追究的行为；中文关系分句可自然表达其现实关联。
- source_word: הֲלוֹא יְדַעְתֶּם
  choice: 难道你们不知道
  rationale: 否定疑问句预期肯定回答；“难道”准确传达反问力度。
- source_word: נַחֵשׁ יְנַחֵשׁ
  choice: 必能占卜
  rationale: 同源不定式绝对式与限定动词连用，加强“占卜”这一动作；“必能”在现代汉语中兼顾强调和语境中的能力意味，但不替叙事判断约瑟是否实际行占卜。
- source_word: אִישׁ אֲשֶׁר כָּמֹנִי
  choice: 像我这样的人
  rationale: 直译其单数泛指结构，且符合自然现代汉语。
- source_word: יוֹסֵף
  choice: 约瑟
  rationale: 采用现代中文圣经人名的通行译法。
theological_decisions:
- issue: 约瑟关于占卜的话应按直接陈述翻译，还是弱化为仅仅识破事情
  choice: 直接保留“占卜”并译作“像我这样的人必能占卜”
  alternative: 像我这样的人必能查出这种事
  rationale: 希伯来文明确两次使用נחש词根。译文不应把占卜消解为一般侦查，也不应断定约瑟确实从事 occult 实践；直接保留其话语所造成的叙事和神学张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“你们做的这是什么事”保持直接责问；“难道”传达反问；正文保留占卜用语，不对约瑟是在陈述事实还是维持埃及官员身份作额外解释。
