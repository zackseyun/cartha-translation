base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/028.yaml
  text: One left me, and I said, ‘Surely he has been torn to pieces,’ and I have not seen him until now.
translation:
  language: zh_hans
  text: 有一个离开了我，我就说：‘他一定是被撕碎了。’直到如今，我再也没有见到他。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּצֵא הָאֶחָד מֵאִתִּי
  choice: 有一个离开了我
  rationale: 直译为“那一个从我这里出去”，但在上下文中指两个儿子中的一个离开雅各；“有一个离开了我”既保留原文叙述角度，也符合现代汉语。
- source_word: אַךְ טָרֹף טֹרָף
  choice: 他一定是被撕碎了
  rationale: אַךְ 表示强烈确信；同根不定式与限定动词连用加强语气。用“一定”体现强调，并保留遭野兽撕裂的被动意象。
- source_word: וְלֹא רְאִיתִיו עַד הֵנָּה
  choice: 直到如今，我再也没有见到他
  rationale: “直到如今”对应 עַד הֵנָּה；“再也没有见到他”自然表达自那次离去后一直未见的持续状态。
theological_decisions: []
