  yaml_path: translation/ot/genesis/044/021.yaml
  text: Then you said to your servants[a], ‘Bring him down to me, that I may set my eyes on him.’
translation:
  language: zh_hans
  text: 于是你对你的仆人们说：“把他带下来见我，好让我亲眼看看他[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“好让我留意他。”希伯来原文直译是“把我的眼放在他身上”，可表示看见、察看或特别留意。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: 于是你……说
  rationale: 承接叙事次序，并保留犹大对约瑟的直接称呼；“于是”符合现代汉语叙事习惯。
- source_word: עֲבָדֶיךָ
  choice: 仆人们
  rationale: 原文直译为“你的仆人”。此处犹大和兄弟们以臣仆身份对埃及高官说话，汉语省略“你的”更自然，身份关系仍由语境明确；不译作“奴隶”，以免过度强调受奴役的法律身份。
- source_word: הוֹרִדֻהוּ
  choice: 把他带下来
  rationale: 保留使役意义和前往埃及时“下去”的方向色彩。
- source_word: אֵלַי
  choice: 见我
  rationale: 原义是“到我这里”；与“带下来”连用时，“带下来见我”是自然汉语，并清楚表达移动的目的地和会面对象。
- source_word: וְאָשִׂימָה עֵינִי עָלָיו
  choice: 好让我亲眼看看他
  rationale: 这是字面为“把我的眼放在他身上”的希伯来习语，可指看见、察看或特别留意。正文以自然汉语表达基本含义，并用脚注保留其语义幅度，避免擅自具体化为“照顾他”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。引语自然流畅，同时保留“带下来”所体现的地理方向；习语在正文中作适度自然化处理，并借脚注保留原文意象及其歧义。
