source:
  edition: WLC
  text: וְ/עַתָּ֗ה יֵֽשֶׁב נָ֤א עַבְדְּ/ךָ֙ תַּ֣חַת הַ/נַּ֔עַר עֶ֖בֶד לַֽ/אדֹנִ֑/י וְ/הַ/נַּ֖עַר יַ֥עַל עִם אֶחָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/033.yaml
  text: So now[a], please let your servant remain instead of the boy as a slave to my lord[b], and let the boy go up with his brothers.
translation:
  language: zh_hans
  text: 现在，求你让仆人留下，代替这年轻人[a]作我主的奴隶，让这年轻人跟他哥哥们一起上去[b]吧。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “年轻人”所译的希伯来语也可指“孩子”或“少年”。
    reason: lexical_range
  - marker: b
    text: 希伯来语直译“上去”；从埃及前往迦南通常这样表达。
    reason: cultural_note
lexical_decisions:
- source_word: וְעַתָּה
  choice: 现在
  rationale: 既承接前文，也引出犹大恳求的高潮；现代汉语无需机械译出连接词。
- source_word: יֵשֶׁב נָא
  choice: 求你让……留下
  rationale: ישׁב在此指留下，נָא使祈使语气成为恳切而有礼的请求。
- source_word: עַבְדְּךָ
  choice: 仆人
  rationale: 这是犹大向约瑟自称时使用的谦敬称谓，并非在陈述自己已有的奴隶身份。
- source_word: תַּחַת הַנַּעַר
  choice: 代替这年轻人
  rationale: תחת在此具有替代意义，不是空间意义的“在……下面”。
- source_word: הַנַּעַר
  choice: 这年轻人
  rationale: נַעַר的年龄范围较宽；“年轻人”既避免把便雅悯说成幼童，也保留犹大保护性的称呼。
- source_word: עֶבֶד
  choice: 奴隶
  rationale: 与谦称“仆人”不同，此处是犹大提出实际受奴役、留在约瑟手下，因此明确译作“奴隶”。
- source_word: לַאדֹנִי
  choice: 作我主的
  rationale: אדני在此是对人所用的尊称，指约瑟；“我主”保留古代尊卑语域而不将其神圣化。
- source_word: וְהַנַּעַר יַעַל
  choice: 让这年轻人……上去吧
  rationale: 延续前面的祈愿语气；直译“上去”，保留从埃及前往迦南的地理表达。
- source_word: עִם אֶחָיו
  choice: 跟他哥哥们一起
  rationale: 这里的“弟兄”具体指便雅悯的哥哥们；按汉语亲属称谓明确译出。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而自然的恳求语气。以“仆人”表达犹大的谦敬自称，以“奴隶”表达他愿意承担的实际身份，从而保留原文同一词根在语境中的不同功能。
