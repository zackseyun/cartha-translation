    rationale: 以“那只杯子”指明量词，并将次序改为“从最年长的搜起，搜到最年幼的”，在不改变原义下更符合现代标准汉语。
  revised_text: 他从最年长的搜起，搜到最年幼的；那只杯子在便雅悯的袋子里被找到了。
