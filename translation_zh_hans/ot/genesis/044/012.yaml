base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/012.yaml
  text: And he searched[a], beginning with the oldest and finishing with the youngest, and the cup was found in Benjamin’s sack.
translation:
  language: zh_hans
  text: 他从最年长的搜起，搜到最年幼的；那只杯子在便雅悯的袋子里被找到了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחַפֵּשׂ
  choice: 他就搜查起来
  rationale: חפשׂ在此指对兄弟们所带的行李逐一搜查；“搜查”准确、自然，并保留叙事动作感。
- source_word: בַּגָּדוֹל הֵחֵל
  choice: 从最年长的开始
  rationale: גדול与后面的קטן相对，在兄弟排行的语境中指年龄最大者；这样表达清楚呈现搜查次序。
- source_word: וּבַקָּטֹן כִּלָּה
  choice: 到最年幼的为止
  rationale: קטן在家庭排行语境中指年龄最小者，כלה表示完成、结束；译文保留从最年长者到最年幼者的推进。
- source_word: וַיִּמָּצֵא
  choice: 被找到了
  rationale: 尼法勒形式为被动意义，译作“被找到了”而非主动的“他找到了”，贴近希伯来文句法。
- source_word: הַגָּבִיעַ
  choice: 那杯
  rationale: גביע可指杯或高脚杯；正文采用简洁自然的“杯”，并以脚注保留更具体的词义可能。
- source_word: בְּאַמְתַּחַת
  choice: 在……的口袋里
  rationale: אַמְתַּחַת指装粮食或物品的袋子；结合创世记本段既有语境，“口袋”是现代中文圣经叙事中清楚自然的表达。
- source_word: בִּנְיָמִן
  choice: 便雅悯
  rationale: 采用现代中文圣经中通行的人名译法。
