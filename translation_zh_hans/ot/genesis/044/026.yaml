base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/026.yaml
  text: But we said[a], ‘We cannot go down. If our youngest brother is with us, then we will go down[c][b], for we cannot see the man's face unless our youngest brother is with us.’
translation:
  language: zh_hans
  text: 但我们说：‘我们不能下去。要是我们最小的弟弟和我们在一起，我们就下去；因为要是我们最小的弟弟不和我们在一起，我们就不能见那人的面[a]。’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “见那人的面”希伯来文直译为“看那人的面”，是指来到他面前或出现在他面前的惯用说法。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנֹּאמֶר
  choice: 但我们说
  rationale: וַ־承接叙事；结合犹大复述他们对要求的回应，用“但”自然表达语境中的转折。
- source_word: לֹא נוּכַל לָרֶדֶת
  choice: 我们不能下去
  rationale: 保留יכל的能力含义和ירד“下去”的地理表达，指前往埃及。
- source_word: אָחִינוּ הַקָּטֹן
  choice: 我们的小弟
  rationale: הַקָּטֹן在兄弟排行的语境中指最年幼的弟弟；“小弟”自然、简洁，也符合本段家族称谓。
- source_word: אִם יֵשׁ ... אִתָּנוּ וְיָרַדְנוּ
  choice: 若和我们同去，我们就下去
  rationale: 希伯来文直译为“若……与我们同在，我们就下去”；中文以“同去”准确表达此处同行的具体含义，并清楚保留条件—结果结构。
- source_word: כִּי
  choice: 因为
  rationale: 此处引出不能下去的理由，现代汉语用“因为”明晰自然。
- source_word: לִרְאוֹת פְּנֵי הָאִישׁ
  choice: 去见那个人
  rationale: 字面为“看那人的面”，是来到某人面前、获准见他的惯用语；正文采用自然汉语，字面意象在脚注说明。
- source_word: וְאָחִינוּ הַקָּטֹן אֵינֶנּוּ אִתָּנוּ
  choice: 小弟若不和我们同去
  rationale: 希伯来文以וְ连接，语义上说明无法见那人的情形；中文转换为条件句可自然传达原意。
