base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/034.yaml
  text: For how can I go up to my father if the boy is not with me? Otherwise, I would have to see the disaster that would come upon my father.
translation:
  language: zh_hans
  text: 这孩子若不和我在一起，我怎能上到我父亲那里呢？免得我看见那临到我父亲的灾祸。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַנַּעַר
  choice: 这孩子
  rationale: 本节指便雅悯；“孩子”自然传达犹大在父亲面前所用的亲属语境，也保留原词可指少年或年轻人的宽泛性。
- source_word: אֶעֱלֶה
  choice: 上到
  rationale: 保留希伯来语表示前往迦南地、回到父亲那里所用的方向性动词，而不简化为“回去”。
- source_word: בָרָע אֲשֶׁר יִמְצָא אֶת אָבִי
  choice: 灾祸临到我父亲
  rationale: מָצָא在此表示遭遇、临到；“灾祸”准确表达רָע在上下文中的祸患之义，不具体限定为死亡。
theological_decisions:
- issue: פֶּן所引从句的语气
  choice: 恐怕我会亲眼看见
  alternative: 免得我看见／否则我就得看见
  rationale: פֶּן通常表达所惧怕或力求避免的结果；译作“恐怕”保留犹大不忍目睹父亲遭祸的情感，也不把该结果强化为逻辑上的必然。
translation_notes:
  register: 采用现代、庄重而口语自然的表达。以反问和感叹号呈现犹大恳求达到高潮时的强烈情感；“亲眼”明确汉语中“看见”的体验意味，但未增加灾祸的具体性质。
