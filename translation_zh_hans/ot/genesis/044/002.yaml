base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/002.yaml
  text: And put my cup[a], the silver cup, in the mouth of the youngest one's sack, along with the silver for his grain purchase." And he did according to Joseph's word[b], which he had spoken.
translation:
  language: zh_hans
  text: “又要把我的杯，就是那只银杯，放在最小的那一个的粮袋口里[a]，连同他买粮的银子一起放进去。”管家就照约瑟所说的话做了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“在粮袋的口里”；“口”在这里指袋子的开口。
    reason: cultural_note
lexical_decisions:
- source_word: גְּבִיעִי גְּבִיעַ הַכֶּסֶף
  choice: 我的杯，就是那只银杯
  rationale: גְּבִיעַ 指杯或高脚杯；“杯”自然通俗，并保留希伯来文同位语式的重复与强调。
- source_word: תָּשִׂים
  choice: 放
  rationale: שׂים 是常用的“放、安置”；此处用“放”最自然直接。
- source_word: בְּפִי אַמְתַּחַת
  choice: 在……粮袋口里
  rationale: פֶּה 字面为“口”，用于容器时指开口；中文“袋口”既保留原有意象，也自然易懂。אַמְתַּחַת 是装运粮食等物的大袋，依语境译作“粮袋”。
- source_word: הַקָּטֹן
  choice: 最小的那个人
  rationale: 字面为“小的／年幼的那一个”；语境指兄弟中最年幼者。译文不补出原文没有的“弟弟”，同时清楚表达所指。
- source_word: כֶּסֶף שִׁבְרוֹ
  choice: 他买粮的银子
  rationale: כֶּסֶף 可指银子或钱；שִׁבְרוֹ 在饥荒叙事中指他所买的粮食。此译兼顾银子的实物含义和购粮语境。
- source_word: וַיַּעַשׂ כִּדְבַר יוֹסֵף אֲשֶׁר דִּבֵּר
  choice: 管家就照约瑟所说的话做了
  rationale: 保留“照……的话做”对 כִּדְבַר 的表达；主语承接上文的管家，中文明确补出以避免歧义。末尾关系从句自然并入“约瑟所说的话”，避免生硬重复。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而通顺的叙事语体。“银杯”保留具体材质，“买粮的银子”贴合本段交易背景。引号承接上一节约瑟对管家的吩咐。
