  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּ֤י עַבְדְּ/ךָ֙ עָרַ֣ב אֶת הַ/נַּ֔עַר מֵ/עִ֥ם אָבִ֖/י לֵ/אמֹ֑ר אִם לֹ֤א אֲבִיאֶ֨/נּוּ֙ אֵלֶ֔י/ךָ וְ/חָטָ֥אתִי לְ/אָבִ֖/י כָּל הַ/יָּמִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/032.yaml
  text: For your servant became surety for the boy to my father[a], saying, ‘If I do not bring him to you[b], then I will bear the blame before my father all my days.’
translation:
  language: zh_hans
  text: 因为仆人曾向我父亲为这孩子作保[a]，说：‘如果我不把他带回你那里，我就终身得罪我父亲[b]。’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “作保”也可译作“担保这孩子”或“为这孩子承担责任”。原文动词指以担保人的身份承担责任。
    reason: lexical_alternative
  - marker: b
    text: 原文直译是“我就一生对我父亲犯了罪”；这里也可理解为“我就终身在我父亲面前担当罪责”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上下文，说明犹大请求代替便雅悯留下的理由。
- source_word: עַבְדְּךָ
  choice: 仆人
  rationale: 这是对尊长说话时谦卑的自称；既保留原文的身份用语，也符合本段宫廷陈情的语体。
- source_word: עָרַב
  choice: 作保
  rationale: 该动词表示以担保人的身份承担责任；“作保”简洁自然，并保留法律责任意味。
- source_word: הַנַּעַר
  choice: 这孩子
  rationale: 原词可指少年或年轻人；在父子家庭关系的语境中，“这孩子”自然，也不必暗示便雅悯是幼童。
- source_word: מֵעִם אָבִי
  choice: 向我父亲
  rationale: 与“作保”连用时，表示犹大对其父作出担保；现代汉语以“向……作保”表达最自然。
- source_word: לֵאמֹר
  choice: 说
  rationale: 作为引出担保内容的引语标记。
- source_word: אִם לֹא אֲבִיאֶנּוּ אֵלֶיךָ
  choice: 如果我不把他带回你那里
  rationale: 清楚保留否定条件句；“带回”根据此前便雅悯从父亲那里被带走、应再送回的语境补出方向意味。
- source_word: וְחָטָאתִי
  choice: 我就……得罪
  rationale: 保留 חטא 的“犯罪、得罪”措辞，不将其完全弱化为一般的“受责备”，同时以关系性的汉语表达呈现此处对父亲负罪的含义。
- source_word: לְאָבִי
  choice: 我父亲
  rationale: 与“得罪”搭配，译为“得罪我父亲”，自然表达原文中相对于父亲所承担的罪责。
- source_word: כָּל הַיָּמִים
  choice: 终身
  rationale: 准确而自然地表达“一生所有的日子”、即持续一生的责任。
theological_decisions:
- issue: וְחָטָאתִי 的罪责意味
  choice: 终身得罪我父亲
  alternative: 终身在我父亲面前担当罪责／终身受我父亲责怪
  rationale: 原文使用“犯罪、得罪”的动词，既可指实际得罪父亲，也可在担保语境中指长期承担罪责。正文保留较强的道德关系用语，脚注说明其责任与罪责层面的歧义，避免把它仅解释为主观责怪。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“仆人”保留犹大对约瑟的谦称；“作保”体现担保责任；正文用“终身得罪我父亲”保留原文 חטא 的罪责张力，并用脚注交代另一种关系性理解。
