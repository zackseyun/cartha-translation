  yaml_path: translation/ot/genesis/044/024.yaml
  text: And when we went up to your servant my father[a], we told him the words of my lord.
translation:
  language: zh_hans
  text: 我们上到我父亲、你的仆人那里，就把我主的话告诉了他。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כִּי
  choice: ……就……
  rationale: 希伯来语叙事公式在此承接前文并引出随后发生的事；汉语用“……就……”自然表达时间与顺承关系，不生硬直译“事情发生了”。
- source_word: עָלִינוּ
  choice: 我们上到
  rationale: עלה的基本义为“上去、上行”；这里指从埃及前往迦南，保留“上到”可体现原文的地理视角。
- source_word: אֶל עַבְדְּךָ אָבִי
  choice: 到你仆人我父亲那里
  rationale: 依照希伯来语次序，先称雅各为约瑟的“仆人”，再说明他是犹大的父亲，既保留恭敬语气，也保留原文略显叠置的表达。
- source_word: וַנַּגֶּד לוֹ
  choice: 告诉了他
  rationale: נגד的使役词干在此意为告知、述说；“告诉了他”是自然、准确的现代汉语。
- source_word: אֵת דִּבְרֵי אֲדֹנִי
  choice: 我主的话
  rationale: דִּבְרֵי直译为“话、言语”；אֲדֹנִי是对人的尊称，并非神名。“我主的话”保留犹大对约瑟的恭敬称呼。
