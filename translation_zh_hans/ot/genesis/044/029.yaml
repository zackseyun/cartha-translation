  source_fidelity: 条件—后果结构、‘从我身边’、灾祸临到、使役性的‘使……下到’以及‘阴间’均基本忠实于希伯来文。‘白发苍苍’恰当保留了שֵׂיבָתִי以白发指年老的形象；但原句将其直接置于‘使我’之后，句法关系略显滞涩。
