  text: וּ/לְקַחְתֶּ֧ם גַּם אֶת זֶ֛ה מֵ/עִ֥ם פָּנַ֖/י וְ/קָרָ֣/הוּ אָס֑וֹן וְ/הֽוֹרַדְתֶּ֧ם אֶת שֵׂיבָתִ֛/י בְּ/רָעָ֖ה שְׁאֹֽלָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/029.yaml
  text: If you also take this one from me[a], and harm happens to him, then you will bring my gray hair down to Sheol in misery.
translation:
  language: zh_hans
  text: 你们若也把这个从我身边带走，而他遭遇不测，你们就会使我这白发苍苍的老人悲惨地下到阴间[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“坟墓”或“死者之境”。
    reason: שְׁאוֹל可指坟墓或死者所在的领域；主文保留“阴间”以表达其较宽的希伯来语义范围。
lexical_decisions:
- source_word: וּלְקַחְתֶּם
  choice: 你们若……带走
  rationale: 此处的连接词加完成式承接上文的条件关系；汉语用“若”自然表达雅各所设想的条件，而不机械译作“并且”。
- source_word: גַּם
  choice: 也
  rationale: 表明雅各担心在先前失去儿子的基础上，又失去便雅悯。
- source_word: מֵעִם פָּנַי
  choice: 从我身边
  rationale: 原文直指从雅各面前、身边离开；“从我身边”既保留临在与分离的意味，也符合现代汉语习惯。
- source_word: וְקָרָהוּ אָסוֹן
  choice: 而他又遭遇不测
  rationale: קָרָה表示“临到、遭遇”，אָסוֹן指严重的祸患或伤害；“遭遇不测”自然凝练，并保留具体结果未明的含混性。
- source_word: וְהוֹרַדְתֶּם
  choice: 你们就会使……下到
  rationale: ירד的使役形表达“使之下去”；该译法保留儿子们将导致雅各悲惨死去的因果与下降意象。
- source_word: שֵׂיבָתִי
  choice: 我白发苍苍
  rationale: 原文直译为“我的白发”，以白发转指年老的雅各；汉语以“我白发苍苍”保留形象，又避免生硬地把“白发”当作独立行动者。
- source_word: בְּרָעָה
  choice: 悲惨地
  rationale: 此处指困苦、悲痛的处境，并非道德意义上的邪恶；“悲惨地”贴合雅各因丧子而死的语境。
- source_word: שְׁאֹלָה
  choice: 到阴间
  rationale: שְׁאוֹלָה带方向词尾，意为“到阴间去”；“阴间”保留希伯来圣经中死者所在之境的概念，而不把它缩减为坟墓，也不赋予后期教义中更具体的含义。
theological_decisions:
- issue: שְׁאוֹל的译法
  choice: 阴间
  alternative: 坟墓；死者之境
  rationale: “阴间”在中文圣经语境中能指向死者所在之境，同时不预断其确切性质；脚注列出“坟墓”和“死者之境”，以保存该词的语义范围。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“这个”承接上下文对便雅悯的指称；“遭遇不测”保留灾祸性质未具体说明的张力；句法维持条件—后果结构。
