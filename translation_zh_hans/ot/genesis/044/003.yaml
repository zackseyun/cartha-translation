base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/003.yaml
  text: As soon as the morning was light[a], the men were sent away, they and their donkeys.
translation:
  language: zh_hans
  text: 早晨一亮[a]，那些人和他们的驴就都被送走了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“黎明时”，或“早晨天亮的时候”。
    reason: 原文“早晨”和“亮”构成简短的时间表达，可按天色开始变亮或天已经亮来理解。
lexical_decisions:
- source_word: הַבֹּקֶר אוֹר
  choice: 早晨一亮
  rationale: אוֹר在此作动词，表示天色变亮；“早晨一亮”既保留其动词意味，又是自然、简洁的现代汉语时间表达。
- source_word: וְהָאֲנָשִׁים
  choice: 那些人
  rationale: 定冠词所指的是上文已经提到的那一群人；汉语用“那些人”自然体现其特指性。
- source_word: שֻׁלְּחוּ
  choice: 被送走了
  rationale: 保留שלח的Pual被动语态及完成体叙事意义；“送走”也符合约瑟准许他们离开的上下文。
- source_word: הֵמָּה וַחֲמֹרֵיהֶם
  choice: 他们和他们的驴
  rationale: 按希伯来文的并列结构呈现人和驴一同被送走，不改写为仅表示伴随的“带着他们的驴”。
- source_word: וְ
  choice: 就
  rationale: 在时间从句之后用“就”自然表达主句紧接天亮而发生，同时体现希伯来叙事连接。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“早晨一亮……就……”符合普通话习惯；保留被动结构和人、驴并列的原文形式。
