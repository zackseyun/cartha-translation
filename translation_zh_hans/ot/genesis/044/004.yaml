  text: הֵ֠ם יָֽצְא֣וּ אֶת הָ/עִיר֮ לֹ֣א הִרְחִיקוּ֒ וְ/יוֹסֵ֤ף אָמַר֙ לַֽ/אֲשֶׁ֣ר עַל בֵּית֔/וֹ ק֥וּם רְדֹ֖ף אַחֲרֵ֣י הָֽ/אֲנָשִׁ֑ים וְ/הִשַּׂגְתָּ/ם֙ וְ/אָמַרְתָּ֣ אֲלֵ/הֶ֔ם לָ֛/מָּה שִׁלַּמְתֶּ֥ם רָעָ֖ה תַּ֥חַת טוֹבָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/004.yaml
  text: They had gone out of the city; they had not gone far[a], when Joseph said to the one over his house, “Get up, pursue the men, and when you overtake them, say to them, ‘Why have you repaid evil for good?’”
translation:
  language: zh_hans
  text: 他们出了城，还没有走远，约瑟就对管家[a]说：“起来，去追那些人！追上他们以后，对他们说：‘你们为什么以恶报善呢？’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“管理他家的人。”即负责约瑟家中事务的人；也可译作“约瑟家里的总管”。
    reason: 说明“管家”所对应的希伯来语表达，并保留较贴近原文且自然的替代译法。
lexical_decisions:
- source_word: יָצְאוּ אֶת הָעִיר
  choice: 出了城
  rationale: יָצָא在此表示离开城市；“出了城”简洁自然，并与后面的“还没有走远”顺畅衔接。
- source_word: לֹא הִרְחִיקוּ
  choice: 还没有走远
  rationale: רחק的使役式在此表示拉开距离、走远；“还没有走远”准确表达他们离城不久。
- source_word: לַאֲשֶׁר עַל בֵּיתוֹ
  choice: 管家[a]
  rationale: 原文直译为“管理他家的人”，指负责约瑟家务与产业的管理者；正文用现代汉语常用的“管家”，脚注保留原文结构。
- source_word: קוּם
  choice: 起来
  rationale: קום的命令式既保留“起身”的字面意义，也在命令序列中传达立即行动的催促语气。
- source_word: רְדֹף אַחֲרֵי
  choice: 去追
  rationale: 该动词与介词组合表示追赶；“去追”符合现代汉语命令语气。
- source_word: הָאֲנָשִׁים
  choice: 那些人
  rationale: אַנָשִׁים指前文离开的成年男子；“那些人”在此比单说“人们”指向更明确。
- source_word: וְהִשַּׂגְתָּם
  choice: 追上他们以后
  rationale: נשׂג的使役式表示赶上、追上；按叙事次序译为“追上他们以后”，自然引出随后的吩咐。
- source_word: שִׁלַּמְתֶּם רָעָה תַּחַת טוֹבָה
  choice: 你们为什么以恶报善呢？
  rationale: שׁלם的加强式在此意为回报、偿还；“以恶报善”准确保留善恶对照，也符合现代汉语惯用表达。
