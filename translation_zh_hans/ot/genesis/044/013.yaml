  yaml_path: translation/ot/genesis/044/013.yaml
  text: Then they tore their clothes[a], and each man loaded his donkey, and they returned to the city.
translation:
  language: zh_hans
  text: 于是，他们撕裂衣服[a]；各人把东西装在自己的驴背上，就回城去了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“外衣”。原文用词可泛指衣物。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְעוּ
  choice: 撕裂
  rationale: קרע指撕破；在此与衣服连用，是遭遇震惊、悲痛或危难时的具体举动。“撕裂”既保留动作本身，也符合庄重的叙事语体。
- source_word: שִׂמְלֹתָם
  choice: 衣服
  rationale: שִׂמְלָה泛指衣物，常可包括外衣；“衣服”是现代汉语中自然、准确且不过度限定具体样式的译法。
- source_word: וַיַּעֲמֹס אִישׁ עַל חֲמֹרוֹ
  choice: 各人把货物重新驮在自己的驴上
  rationale: עמס表示把负载装上牲畜；אִישׁ在复数叙事中有逐一分配义，译作“各人”。结合上文他们曾卸下货物搜查的情境，汉语补出“货物”和“重新”，使隐含宾语及动作复原关系清楚，但未改变事件内容。
- source_word: חֲמֹרוֹ
  choice: 自己的驴
  rationale: חֲמוֹר是普通的“驴”；第三人称单数后缀在分配结构中指各人各自的驴，汉语用“自己的”表达自然。
- source_word: וַיָּשֻׁבוּ
  choice: 回……去了
  rationale: שׁוב表示返回；“回城去了”是自然的现代汉语叙事表达。
- source_word: הָעִירָה
  choice: 城
  rationale: 词尾方向形式表示朝城里去。上下文所指城市明确，汉语“回城”准确表达方向和返回之意。
theological_decisions: []
translation_notes:
  register: 采用现代、清楚而庄重的叙事语体。“撕裂衣服”保留古代哀痛与惊惧反应的具体形象；正文不解释其象征意义。为使汉语动作完整，根据近邻语境补出被重新驮上的“货物”。
