revisions:
- from: 那么，他一看见那孩子不在，就会死；你仆人们就会使你仆人、我们的父亲白发苍苍，在悲痛中下到阴间[a]。
  to: 那时，他看见那孩子不在，就会死去；我们这些仆人就会使你仆人、我们的父亲带着白发，在悲痛中下到示俄勒[a]。
  rationale: 修订消除了“白发苍苍”作为使役结果的歧义，保留“白发”所指的高龄及其下到示俄勒的具体意象；同时以“示俄勒”直接对应希伯来文，并借脚注保留必要的语义替代。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T04:25:41Z'
review_pass:
  verdict: revise
  source_fidelity: Draft correctly represents the temporal/result sequence, the father's death, the deferential references to Judah and his brothers as Joseph's servants, and the idiom of descent to Sheol. However, “使……白发苍苍，在悲痛中下到” can be read as causing the father to become gray-haired, rather than preserving the Hebrew idiom that his already-gray head/old age is brought down in grief. Rendering שְׁאוֹל as “示俄勒” in the text more directly retains the source term's deliberately broad range.
  naturalness: “你仆人们” and especially “使……白发苍苍” are somewhat stiff or ambiguous in modern Mandarin. “我们这些仆人” is natural in direct deferential speech, and “带着白发……下到” retains the image idiomatically.
  terminology: Use “示俄勒” for שְׁאוֹל, with a footnote giving “坟墓” and “死人之境” as contextual alternatives. This avoids importing the potentially more developed Chinese religious associations of “阴间.”
  issues:
  - severity: medium
    issue: “使你仆人、我们的父亲白发苍苍” changes the force of the gray-hair idiom.
    rationale: שֵׂיבַת denotes the father's gray hair/advanced age, which the servants will cause to go down to Sheol in grief. The Chinese wording can imply that they will cause him to turn gray-haired before he descends.
  - severity: low
    issue: 正文“阴间” is narrower and more interpretively colored than the Hebrew term.
    rationale: שְׁאוֹל has a disputed/broad semantic range. Transliteration in the main text best preserves that range; alternatives can remain in a footnote.
  revised_text: 那时，他看见那孩子不在，就会死去；我们这些仆人就会使你仆人、我们的父亲带着白发，在悲痛中下到示俄勒[a]。
  revised_footnotes:
  - marker: a
    text: 或译“坟墓”或“死人之境”。希伯来文为“示俄勒”。
    reason: 说明 שְׁאוֹל 的语义范围，并保留音译，避免正文将其含义限定为单指坟墓或特定的后世阴间观念。
