  text: וְ/הָיָ֗ה כִּ/רְאוֹת֛/וֹ כִּי אֵ֥ין הַ/נַּ֖עַר וָ/מֵ֑ת וְ/הוֹרִ֨ידוּ עֲבָדֶ֜י/ךָ אֶת שֵׂיבַ֨ת עַבְדְּ/ךָ֥ אָבִ֛י/נוּ בְּ/יָג֖וֹן שְׁאֹֽלָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/031.yaml
  text: then[a], when he sees that the boy is not there, he will die, and your servants will bring down the gray hair of your servant our father to Sheol in sorrow.
translation:
  language: zh_hans
  text: 那时，他看见那孩子不在，就会死去；我们这些仆人就会使你仆人、我们的父亲带着白发，在悲痛中下到示俄勒[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“坟墓”或“死人之境”。希伯来文为“示俄勒”。
    reason: 说明 שְׁאוֹל 的语义范围，并保留音译，避免正文将其含义限定为单指坟墓或特定的后世阴间观念。
lexical_decisions:
- source_word: וְהָיָה
  choice: 那么
  rationale: 此处引出前面条件所导致的结果；“那么”自然表达这一承接功能，避免生硬直译为“事情将是”。
- source_word: כִּרְאוֹתוֹ
  choice: 他一看见
  rationale: כְּ 加不定式构造表达时间情境；“一看见”既自然，也传达见到这一情形便产生后果的紧密关系。
- source_word: כִּי אֵין הַנַּעַר
  choice: 那孩子不在
  rationale: אֵין 在此表示不在场；“不在”不额外暗示孩子已经死亡。נַעַר 依父亲眼中的家庭身份译为“那孩子”，保留原文的情感视角。
- source_word: וָמֵת
  choice: 就会死
  rationale: 此处承接时间从句所引出的将来结果，指父亲看到便雅悯未归后将会死去。
- source_word: וְהוֹרִידוּ
  choice: 就会使……下到
  rationale: ירד 的使役形表达“使之下去”；保留原文下到阴间的空间意象和因果责任。
- source_word: עֲבָדֶיךָ
  choice: 你仆人们
  rationale: 这是犹大在统治者面前谦称自己和众兄弟的宫廷用语；“仆人”比“奴隶”更符合语境。
- source_word: שֵׂיבַת
  choice: 白发苍苍
  rationale: 该词本指白发，并可转指老年；此译保留白发的具体形象，同时符合现代汉语表达。
- source_word: עַבְדְּךָ אָבִינוּ
  choice: 你仆人、我们的父亲
  rationale: 保留犹大对雅各的双重称呼：对约瑟而言是“你仆人”，对众兄弟而言是“我们的父亲”。
- source_word: בְּיָגוֹן
  choice: 在悲痛中
  rationale: יָגוֹן 表示深切的忧伤、悲痛；“在悲痛中”贴合介词结构，并自然修饰下到阴间。
- source_word: שְׁאֹלָה
  choice: 下到阴间
  rationale: 方向词尾与动词共同表达“下到”。“阴间”在中文圣经语境中可指死者之境，不将其简单缩窄为坟墓；脚注注明希伯来词及其他可能译法。
theological_decisions:
- issue: שְׁאוֹל 的译法
  choice: 阴间
  alternative: 示俄勒；坟墓；死人之境
  rationale: 原词可指死者所在之境，语义不必局限于具体坟墓。“阴间”在正文中简洁易懂，脚注同时保留希伯来名称和其他译法，避免把古代概念过度限定为某种后世宇宙观。
translation_notes:
  register: 采用现代、庄重而口语可懂的叙事语言。“那么……一看见……就会……”清楚呈现条件与结果；后半句保留“白发苍苍”“下到阴间”的希伯来意象。
