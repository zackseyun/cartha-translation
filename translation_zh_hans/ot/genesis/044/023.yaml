  text: וַ/תֹּ֨אמֶר֙ אֶל עֲבָדֶ֔י/ךָ אִם לֹ֥א יֵרֵ֛ד אֲחִי/כֶ֥ם הַ/קָּטֹ֖ן אִתְּ/כֶ֑ם לֹ֥א תֹסִפ֖וּ/ן לִ/רְא֥וֹת פָּנָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/023.yaml
  text: And you said to your servants[a], ‘If your youngest brother does not come down with you, you shall not continue to see my face.’
translation:
  language: zh_hans
  text: 你对仆人们说：‘你们最小的弟弟若不和你们一同下来，你们就不得再见我的面[a]。’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不得再到我面前来。”
    reason: 原文直译为“不得再见我的面”；此语也可按惯用语理解为不得再次到某人面前、拜见某人。
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: 你……说
  rationale: 这是叙事序列中的未完成式转换形式；本句由犹大复述约瑟先前的话，现代汉语用“说”自然表达。篇章连接词不必机械译出。
- source_word: עֲבָדֶיךָ
  choice: 仆人们
  rationale: עבד可指奴隶或仆人；此处犹大在宫廷语境中以谦称指自己和众弟兄，译作“仆人们”既保留身份关系，也避免突出本句未强调的奴役含义。
- source_word: אִם לֹא
  choice: 若不
  rationale: 保留希伯来语明确的否定条件结构，简洁而庄重。
- source_word: יֵרֵד
  choice: 下来
  rationale: ירד本义为“下去／下来”；从身在埃及的约瑟之视角说“下来”符合方向关系，也符合中文叙事习惯。
- source_word: אֲחִיכֶם הַקָּטֹן
  choice: 你们的小弟
  rationale: הקטן在兄弟群体中指最小的弟弟；“小弟”在此清楚自然，并保留亲属称谓。
- source_word: אִתְּכֶם
  choice: 和你们一同
  rationale: 准确表达陪同关系；“一同”使中文句式流畅。
- source_word: לֹא תֹסִפוּן
  choice: 不得再
  rationale: יסף加不定式表示不再继续或不再重复某行动；“不得再”同时传达禁止和此后不再发生。
- source_word: לִרְאוֹת פָּנָי
  choice: 见我的面
  rationale: 贴近原文“看见我的脸／面”，在现代汉语中“见我的面”自然且仍保留原有形象；其宫廷语境中的惯用义另以脚注说明。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。引语保留约瑟命令的严厉语气；“仆人们”体现犹大的谦称，“见我的面”保留希伯来语的具体表达，并用脚注给出较惯用的译法。
