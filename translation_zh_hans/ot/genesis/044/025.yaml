base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/025.yaml
  text: Then our father said[a], ‘Go back; buy us a little food.’
translation:
  language: zh_hans
  text: 于是我们父亲说：“你们再去给我们买一点食物。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 于是……说
  rationale: 连续式叙事形式推进情节；“于是”在现代汉语中自然表达前后承接。
- source_word: אָבִינוּ
  choice: 我们父亲
  rationale: 此处明确指兄弟们的父亲雅各；直译为“我们父亲”准确且自然。
- source_word: שֻׁבוּ
  choice: 再去
  rationale: 该命令要求他们再次前往埃及；汉语“再去”自然表达返回那里、重走一趟的意思。
- source_word: שִׁבְרוּ
  choice: 买
  rationale: 该动词在约瑟叙事中指购买粮食或食物；因后面已有宾语“食物”，无需在动词中增添“粮”。
- source_word: לָנוּ
  choice: 给我们
  rationale: 介词表达受益者，现代汉语用“给我们买”最为自然。
- source_word: מְעַט
  choice: 一点
  rationale: 保留数量少的含义，并符合现代汉语惯用表达。
- source_word: אֹכֶל
  choice: 食物
  rationale: 希伯来词是泛指食物的一般用语；虽然上下文涉及粮食，此处不宜缩窄为“粮食”。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“再去”比生硬的“返回”更符合父亲吩咐儿子重新上路的语境；“食物”保留原文用词的宽泛范围。原文此处没有需要以脚注保留的实质歧义，因此不设置脚注。
