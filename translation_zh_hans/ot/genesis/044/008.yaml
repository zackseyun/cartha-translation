  text: הֵ֣ן כֶּ֗סֶף אֲשֶׁ֤ר מָצָ֨אנוּ֙ בְּ/פִ֣י אַמְתְּחֹתֵ֔י/נוּ הֱשִׁיבֹ֥נוּ אֵלֶ֖י/ךָ מֵ/אֶ֣רֶץ כְּנָ֑עַן וְ/אֵ֗יךְ נִגְנֹב֙ מִ/בֵּ֣ית אֲדֹנֶ֔י/ךָ כֶּ֖סֶף א֥וֹ זָהָֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/008.yaml
  text: Look[a], the silver that we found in the mouths of our sacks we brought back to you from the land of Canaan. So how could we steal silver or gold from your master's house?
translation:
  language: zh_hans
  text: 你看，我们在粮袋口发现的银子，尚且从迦南地带回来交给了你；我们又怎会从你主人的家中偷银子或金子呢？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֵן
  choice: 看哪
  rationale: 这是引人注意并加强申辩语气的话语标记。“看哪”简洁庄重，也保留原文的强调作用。
- source_word: כֶּסֶף
  choice: 银子
  rationale: 原词本义为“银”，在此也指作为钱财的银子；译作“银子”既符合叙事语境，又与后面的“金子”形成对应。
- source_word: בְּפִי אַמְתְּחֹתֵינוּ
  choice: 在粮袋口
  rationale: פִּי 字面是“口”，用于容器时指开口；אַמְתַּחַת 是装粮食或旅行物品的大袋。译作“粮袋口”自然清楚，并保留原文的具体意象。
- source_word: הֱשִׁיבֹנוּ אֵלֶיךָ
  choice: 带回来交给你
  rationale: 使役形表达使某物返回；“带回来交给你”在现代汉语中清楚表达他们将银子远道送还给管家的行动。
- source_word: מֵאֶרֶץ כְּנָעַן
  choice: 从迦南地
  rationale: 采用现代汉语中常见而庄重的地理表达。
- source_word: וְאֵיךְ נִגְנֹב
  choice: 又怎会……偷
  rationale: 这是基于前句事实提出的反问。“又怎会”自然表达希伯来文承接兼推论的语气，以及未完成式在此处的情态意味。
- source_word: מִבֵּית אֲדֹנֶיךָ
  choice: 从你主人的家里
  rationale: אָדוֹן 在此指管家的主人约瑟，并非神圣称号；“家里”保留 בַּיִת 的基本意象，也可涵盖其宅第。
- source_word: כֶּסֶף אוֹ זָהָב
  choice: 银子或金子
  rationale: 保留原文具体的贵金属组合，并使“银子”与前半句彼此照应。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而口语可懂的申辩语气。“尚且……又怎会……”呈现原文由已经归还银子的事实推导出不可能行窃的反问逻辑。原文“袋口”的容器隐喻在现代汉语中自然，无须脚注。
