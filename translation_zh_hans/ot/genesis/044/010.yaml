base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/010.yaml
  text: And he said[a], “Even now, let it be according to your words. The one with whom it is found will be my slave[b], and you will be innocent.”
translation:
  language: zh_hans
  text: 他说：“现在就照你们的话办吧。杯子在谁那里找到，谁就作我的奴隶[a]；你们则可免罪。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “奴隶”也可译作“仆人”。希伯来语 עָבֶד 可指仆人或奴隶；这里强调的是因惩罚而被迫受制于人的身份。
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם עַתָּה
  choice: 好吧
  rationale: 此处承接兄弟们的提议，表示当下回应与有限度的认可；现代汉语用“好吧”自然传达语用功能，又不把后文误解为完全接受上一节的严厉条件。
- source_word: כְדִבְרֵיכֶם כֶּן הוּא
  choice: 就照你们的话办
  rationale: 保留“按你们的话”的形式，同时以自然汉语表达管家的裁定。句后以转折另起，反映 הוּא 上的主要停顿，并显示后文实际缩减了他们所提的惩罚。
- source_word: אֲשֶׁר יִמָּצֵא אִתּוֹ
  choice: 杯子在谁那里找到
  rationale: 希伯来语直译为“它在谁那里被找到”；根据上下文补出“杯子”，使指代清楚，并保留以查获地点认定当事人的表达。
- source_word: יִהְיֶה לִּי עָבֶד
  choice: 谁就作我的奴隶
  rationale: עָבֶד 在此指作为惩罚而受制于人的强制身份，不是普通受雇的仆役，因此译为“奴隶”。“作我的奴隶”贴近 יִהְיֶה לִּי 的状态表达。
- source_word: וְאַתֶּם תִּהְיוּ נְקִיִּם
  choice: 你们其余的人都可免罪
  rationale: נְקִיִּם 表示不负罪责或责任；“免罪”在裁决语境中自然。“其余的人”明确“你们”不包括刚提到的持杯者，是由语境所要求的汉语表达。
