base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/027.yaml
  text: Then your servant[a], my father, said to us, ‘You know that my wife bore me two sons.’
translation:
  language: zh_hans
  text: 我父亲，就是你的仆人，对我们说：‘你们知道，我妻子给我生了两个儿子[a]。’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“给我生了两个”；“儿子”由上下文补明。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 未单独译出连接词，借上下文自然承接叙事；现代汉语无需机械加入“然后”。
- source_word: עַבְדְּךָ אָבִי
  choice: 我父亲，就是你的仆人
  rationale: 保留“你的仆人”的谦恭自称，并以同位结构清楚表明所指是犹大的父亲。
- source_word: אֵלֵינוּ
  choice: 对我们
  rationale: 直接对应介词及复数代词后缀，表达自然。
- source_word: אַתֶּם יְדַעְתֶּם
  choice: 你们知道
  rationale: 保留复数主语和显式代词所带的强调意味；这里所说的知识在引语当下仍然成立。
- source_word: כִּי
  choice: （不单独译出）
  rationale: 此处引出“知道”的内容，现代汉语可直接接宾语小句，比加入“就是”或“这件事”更自然。
- source_word: שְׁנַיִם
  choice: 两个儿子
  rationale: 希伯来文只说“两个”，但上下文明确指约瑟和便雅悯两个儿子；正文补明“儿子”，并以脚注交代原文形式。
- source_word: יָלְדָה לִּי
  choice: 给我生了
  rationale: 自然表达 ילד 加间接受词“给我”的含义，并保留完成事件的叙述。
- source_word: אִשְׁתִּי
  choice: 我妻子
  rationale: 此处 אִשָּׁה 带第一人称后缀，明确指“我的妻子”。
