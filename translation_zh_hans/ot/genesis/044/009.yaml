  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אֲשֶׁ֨ר יִמָּצֵ֥א אִתּ֛/וֹ מֵ/עֲבָדֶ֖י/ךָ וָ/מֵ֑ת וְ/גַם אֲנַ֕חְנוּ נִֽהְיֶ֥ה לַֽ/אדֹנִ֖/י לַ/עֲבָדִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/009.yaml
  text: Whichever of your servants it is found with[a], let him die[b], and we also will become slaves to my lord.
translation:
  language: zh_hans
  text: 在你仆人中，无论在谁那里找到它[a]，谁就该死[b]；我们也要作我主的奴隶。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “仆人”和本节后面的“奴隶”译自同一个希伯来语词根。前者是对上位者说话时的谦恭自称，后者则指实际受奴役的身份。
    reason: lexical_alternative
  - marker: b
    text: 或译：“让那人死。”
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: אֲשֶׁר יִמָּצֵא אִתּוֹ מֵעֲבָדֶיךָ
  choice: 在你仆人中，无论在谁那里找到它
  rationale: אֲשֶׁר引出不定关系从句；מִן具部分含义，指“你仆人中的任何一人”；יִמָּצֵא为被动，补出承接上文之杯的“它”，使现代汉语清楚自然。
- source_word: וָמֵת
  choice: 谁就该死
  rationale: 连接词加完成式在此表达提议中的后果，带有决然的处置意味；“就该死”比单纯陈述“就死”更符合语境，又不把它强化为正式法律判词。
- source_word: וְגַם אֲנַחְנוּ נִהְיֶה
  choice: 我们也要作
  rationale: 保留וְגַם的递进附加意味；נִהְיֶה指进入一种新的身份状态，译为“要作”简洁自然。
- source_word: לַאדֹנִי
  choice: 我主
  rationale: 这是对人的恭敬称呼，并带第一人称单数后缀；“我主”保留兄弟代表众人发言时的宫廷式敬称，不指神。
- source_word: עבד / לַעֲבָדִים
  choice: 仆人／奴隶
  rationale: 同一词根在前处是谦恭自称，译“仆人”；后处指作为惩罚而陷入受辖制的身份，译“奴隶”，以显明实际奴役之意。
theological_decisions:
- issue: עבד在同一节两处的不同译法
  choice: 前译“仆人”，后译“奴隶”
  alternative: 两处都译“仆人”或两处都译“奴隶”
  rationale: 前处是臣下式自称，后处则明确提出以受奴役为惩罚。按各自语境区分，既保留词义关联，也避免抹去后半句的强制从属含义。
- issue: וָמֵת所表达的语气
  choice: 谁就该死
  alternative: 让他死／他必死
  rationale: 原文形式在此可理解为所提条件的严厉后果。“该死”保留这种规范或决断色彩，同时不武断限定为命令式或单纯将来陈述。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“在谁那里找到它”体现物品由某人持有的含义；“我主”保留古代宫廷语境中的恭敬称呼。
