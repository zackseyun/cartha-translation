  yaml_path: translation/ot/genesis/044/011.yaml
  text: So each man hurried and lowered his sack to the ground[b][a], and each man opened his sack.
translation:
  language: zh_hans
  text: 于是，他们急忙各自把袋子放到地上[a]，又各自打开自己的袋子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文在“放下”和“打开”两个动作后都重复说“各人……自己的袋子”，强调每个人分别处理自己的袋子。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמַהֲרוּ
  choice: 他们赶紧
  rationale: מהר表示迅速采取行动；“赶紧”自然地传达叙事中的急迫和即时反应，同时避免文言色彩。
- source_word: וַיּוֹרִדוּ
  choice: 把……放到地上
  rationale: ירד的使役形表示“使之下去”。结合袋子原先驮在牲畜上的语境，“放到地上”比机械直译为“降下”更符合现代汉语。
- source_word: אִישׁ ... אַמְתַּחְתּוֹ
  choice: 各自……自己的袋子
  rationale: אִישׁ在这里作分配用法，且在两个动作前重复出现；“各自……自己的”既明确每个人都处理本人的袋子，也保留原文逐一强调的效果。
- source_word: אַמְתַּחַת
  choice: 袋子
  rationale: 该词指盛放粮食或物品的袋具；“袋子”在现代普通话中自然清楚，也适合本段运输粮食的语境。
- source_word: אָרְצָה
  choice: 到地上
  rationale: 带方向词尾的形式表示朝地面移动；“到地上”准确而自然。
- source_word: וַיִּפְתְּחוּ
  choice: 打开
  rationale: פתח在此为直接的“打开”，无需增添“解开”等原文未明确表达的细节。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“赶紧”体现动作迅速；以“各自……自己的”重现希伯来文重复使用分配性אִישׁ的强调。避免生硬的“使袋子降下”，按具体场景译为“放到地上”。
