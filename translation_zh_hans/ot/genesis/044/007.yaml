base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/007.yaml
  text: And they said to him[b][a], “Why does my lord speak words like these? Far be it from your servants to do such a thing.”
translation:
  language: zh_hans
  text: 他们对他说：“我主为什么说这样的话？你的仆人绝不至于做这样的事。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמְרוּ אֵלָיו
  choice: 他们对他说
  rationale: 按叙事顺序直译复数主语和介词短语；“他”在上下文中指约瑟的管家。
- source_word: לָמָּה יְדַבֵּר
  choice: 为什么说
  rationale: 保留直接疑问；希伯来语未完成式在此表示针对当前话语的质问，现代汉语无需另加时态标记。
- source_word: אֲדֹנִי
  choice: 我主
  rationale: 这是对人的恭敬称呼，不是神圣称号；“我主”保留第一人称单数后缀及郑重、谦恭的语气。
- source_word: כַּדְּבָרִים הָאֵלֶּה
  choice: 这样的话
  rationale: 既保留 דְּבָרִים 在此处的言语含义，也自然表达比较性前缀 כ־ 与指示语的合力。
- source_word: חָלִילָה לַעֲבָדֶיךָ
  choice: 你的仆人绝不至于
  rationale: חָלִילָה 表示强烈否认；结合 לַעֲבָדֶיךָ，以自然汉语表达“这种事断不会出于你的仆人”。“仆人”保留宫廷式自谦称谓。
- source_word: מֵעֲשׂוֹת כַּדָּבָר הַזֶּה
  choice: 做这样的事
  rationale: 自然表达介词不定式所指的行为，并将 כַּדָּבָר הַזֶּה 译作回指所受指控的“这样的事”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“我主”和“你的仆人”保留兄弟们对管家的恭敬、自谦语域；“绝不至于”传达 חָלִילָה 的强烈斥拒，又不引入“上天禁止”等原文没有的宗教措辞。
