base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/014.yaml
  text: Then Judah and his brothers came into Joseph’s house[a]. He was still there[b], and they fell to the ground before him.
translation:
  language: zh_hans
  text: 犹大和他的兄弟们来到约瑟的宅邸。约瑟还在那里，他们就在他面前伏倒在地。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  choice: 来到
  rationale: 该叙事性未完成式推动情节向前；“来到”自然表达人物到达当前场景，也不强行限定为单纯“进入”。
- source_word: יְהוּדָה וְאֶחָיו
  choice: 犹大和他的兄弟们
  rationale: 保留犹大被单独点名的带头地位，同时准确表达亲属关系。
- source_word: בֵּיתָה יוֹסֵף
  choice: 约瑟的宅邸
  rationale: בַּיִת在这里指约瑟的住所；方向词尾表明朝该处而来。“宅邸”既符合约瑟的身份和叙事情境，也比“家”更明确地指建筑住所。
- source_word: וְהוּא עוֹדֶנּוּ שָׁם
  choice: 约瑟还在那里
  rationale: עוֹדֶנּוּ表示状态持续，即“仍然、还”。中文明确说“约瑟”，避免代词在犹大和众兄弟之后可能造成的指代迟疑。
- source_word: וַיִּפְּלוּ לְפָנָיו אָרְצָה
  choice: 他们就在他面前伏倒在地
  rationale: נפל的基本动作是倒下，אָרְצָה表示朝向地面；结合“在他面前”，此举具有俯伏致敬或恳求的意味。“伏倒在地”保留身体动作，不额外规定其全部动机。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。将希伯来文连续连接的分句分为两句，使“约瑟还在那里”清楚成为随后动作的场景背景；未增添原文没有说明的神学或心理解释。
