translation_notes:
  register: 采用现代、庄重而易懂的陈词语体。“我主”与“仆人们”相互呼应，呈现犹大在权势者面前的谦恭；保留“问……说”的希伯来叙述结构，但用“曾”使汉语回述语境清楚。
