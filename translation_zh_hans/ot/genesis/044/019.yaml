  yaml_path: translation/ot/genesis/044/019.yaml
  text: My lord asked his servants, saying, ‘Do you have a father or a brother?’
translation:
  language: zh_hans
  text: 我主曾问您的仆人说：“你们有父亲或兄弟吗？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲדֹנִי
  choice: 我主
  rationale: 这是带第一人称单数后缀的敬称，犹大以臣下身份恭敬地称呼面前的埃及统治者；“我主”保留了宫廷陈词的庄重与尊卑关系。
- source_word: שָׁאַל
  choice: 问
  rationale: 该动词表示询问；此处后接直接问话，译作“问”自然准确。
- source_word: עֲבָדָיו
  choice: 仆人们
  rationale: עֶבֶד 可指奴隶或仆人；这里是兄弟们在统治者面前谦称自己，译作“仆人们”既保留敬卑语气，也不额外断定其法律身份。
- source_word: לֵאמֹר
  choice: 说
  rationale: 该不定式用于引出所说的具体内容；“说”保留了原文的引语结构。
- source_word: הֲיֵשׁ לָכֶם
  choice: 你们有……吗
  rationale: 疑问词素与存在词 יֵשׁ 加介词 ל־共同表达领有，现代汉语自然译为“你们有……吗”。
- source_word: אָב
  choice: 父亲
  rationale: 保持亲属称谓的单数意义；汉语在此不需添加不定冠词。
- source_word: אָח
  choice: 兄弟
  rationale: 原文为单数，所问的是是否有这样一位男性同胞；汉语“兄弟”在此可自然表达该亲属类别而不强加其排行。
