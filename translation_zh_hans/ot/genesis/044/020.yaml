- from: 我们对我主说：‘我们有一位年老的父亲，还有一个他年老时所生的小儿子。他的哥哥死了，他母亲所生的只剩下他一人[a]，他父亲疼爱他。’
  to: 我们对我主说：‘我们有一位年老的父亲，还有一个他年老时所生的年幼儿子。他的哥哥死了；他母亲所生的只剩下他一人[a]，他父亲爱他。’
  rationale: 将“小儿子”改为“年幼儿子”，保留 ילד 与 קָטָן 所表达的儿子及年幼含义，而不把其限定为排行最小。将“疼爱”改为“爱”，以贴近 אָהֵב 的未加限定表述。脚注保留并润色关系性 לְאִמּוֹ 的直译说明；标记位置与正文对应。
