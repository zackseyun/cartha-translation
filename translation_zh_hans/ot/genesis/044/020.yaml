  text: וַ/נֹּ֨אמֶר֙ אֶל אֲדֹנִ֔/י יֶשׁ לָ֨/נוּ֙ אָ֣ב זָקֵ֔ן וְ/יֶ֥לֶד זְקֻנִ֖ים קָטָ֑ן וְ/אָחִ֨י/ו מֵ֜ת וַ/יִּוָּתֵ֨ר ה֧וּא לְ/בַדּ֛/וֹ לְ/אִמּ֖/וֹ וְ/אָבִ֥י/ו אֲהֵבֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/020.yaml
  text: And we said to my lord[a], ‘We have an elderly father, and a young son born in his old age. His brother is dead, so he alone is left of his mother[c][b], and his father loves him.’
translation:
  language: zh_hans
  text: 我们对我主说：‘我们有一位年老的父亲，还有一个他年老时所生的年幼儿子。他的哥哥死了；他母亲所生的只剩下他一人[a]，他父亲爱他。’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“他独自为他母亲存留下来。”意思是，他是母亲唯一剩下的儿子。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנִי
  choice: 我主
  rationale: 这是对身份高于自己的官长所用的尊称；“我主”既保留叙事中反复出现的上下级关系，也符合庄重的圣经叙事语体。
- source_word: זָקֵן
  choice: 年老的
  rationale: 直接表达父亲年事已高，现代汉语自然清楚。
- source_word: יֶלֶד זְקֻנִים קָטָן
  choice: 他年老时所生的小儿子
  rationale: “年老时所生”传达“晚年之子”的希伯来语习语；“小儿子”兼顾 יֶלֶד 和 קָטָן 在家庭语境中所表达的年幼身份，而不将其误解为身材矮小。
- source_word: וְאָחִיו מֵת
  choice: 他的哥哥死了
  rationale: 上下文表明所指是便雅悯同母的哥哥约瑟；汉语用“哥哥”自然呈现其亲属关系和长幼次序。“死了”表达当前被认为已经死亡的状态。
- source_word: וַיִּוָּתֵר הוּא לְבַדּוֹ לְאִמּוֹ
  choice: 他母亲所生的只剩下他一人
  rationale: 将关系性的 לְאִמּוֹ 明确为母亲所生的儿子，避免“只给他母亲留下他”可能造成的照料关系误读，同时保留“唯独他存留”的强调。
- source_word: וְאָבִיו אֲהֵבוֹ
  choice: 他父亲疼爱他
  rationale: “疼爱”自然表达父亲对儿子的深厚而特别的亲情，比一般的“爱”更贴合此处家庭语境。
