    rationale: 小儿子在现代汉语通常可指排行最小的儿子；希伯来文 קָטָן 在此首先说明年幼，虽叙事背景中便雅悯确为幼子，正文不宜不必要地把排行语义固定化。
  - severity: low
    issue: “疼爱”较“爱”更具宠爱或怜爱意味。
    rationale: אָהֵבוֹ 直接陈述父亲爱他；“爱他”既自然，也不额外界定这种爱为溺爱或特别怜爱。
