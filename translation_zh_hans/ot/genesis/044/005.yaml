base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/005.yaml
  text: Is this not the one from which my master drinks and by which he indeed practices divination? You have done evil in doing this[a][b].
translation:
  language: zh_hans
  text: 这不就是我主人饮用的杯子吗？他确实用它占卜。你们在所做的这事上作恶了[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他必定会借此占卜。”希伯来文以不定式绝对形与限定动词连用，表达强调。
    reason: lexical_alternative
  - marker: b
    text: 直译：“你们在所做的事上作恶了。”
    reason: previous_rendering
lexical_decisions:
- source_word: הֲלֹא זֶה
  choice: 这不就是……吗？
  rationale: 保留预期肯定回答的反问语气；现代汉语中自然有力。
- source_word: אֲשֶר יִשְׁתֶּה אֲדֹנִי בּוֹ
  choice: 我主人喝酒用的杯
  rationale: בּוֹ与“喝”连用，表示从该器皿饮用；结合上下文明确补出“杯”，使汉语自然。“主人”符合管家对约瑟的社会称谓，避免不必要的神学色彩。
- source_word: וְהוּא נַחֵשׁ יְנַחֵשׁ
  choice: 他也确实……占卜
  rationale: 将独立代词及不定式绝对形与限定动词连用所表达的强调译为“确实”，并以“占卜”准确表达נחש的含义。
- source_word: בּוֹ
  choice: 用它
  rationale: 这里的介词短语可表占卜所借助的器物；“用它”清楚保留工具义。
- source_word: הֲרֵעֹתֶם אֲשֶׁר עֲשִׂיתֶם
  choice: 你们做这事，实在是作恶了
  rationale: 保留רעע的道德分量，同时用自然汉语表达“所做之事是恶的”，避免生硬重复。
theological_decisions:
- issue: 经文是否断言约瑟本人实际从事占卜
  choice: 按管家在叙事中的直接话语译为“他也确实用它占卜”
  alternative: 译作“他必能用它占卜”，或弱化为他人对约瑟的观感
  rationale: 希伯来文本中的人物话语明确使用占卜措辞并加以强调。译文应如实呈现这项话语内的宣称，不替叙事预先裁定约瑟是否实际占卜，也不作护教性弱化。
translation_notes:
  register: 采用现代、庄重而口语顺畅的叙事语言。“这不就是……吗”保留管家质问的力度；“喝酒用的杯”依上下文补明所指，并避免汉语中“从它喝”之类欧化表达。
