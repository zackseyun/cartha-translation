  rationale: 修订删除可能造成附加意义的“也”，不把原文对“占卜”的强调转移到末句，并使末句及其脚注更准确、自然地反映“作恶”与“所做之事”的关系。其余关键措辞维持原意、叙事语域和神学中立性。
