lexical_decisions:
- source_word: וַיַּשִּׂגֵם
  choice: 他追上他们
  rationale: נשׂג 的使役式连续叙事形带第三人称阳性复数宾语后缀，在本段道路追赶的语境中表示赶到并追上他们；“追上”自然、准确，也不额外强调拦截。
- source_word: וַיְדַבֵּר אֲלֵהֶם
  choice: 对他们说了
  rationale: דבר 配合 אֶל 表示朝向某人说话。汉语用“对他们说”最自然；加入完成体“了”承接连续叙事。
- source_word: אֶת הַדְּבָרִים הָאֵלֶּה
  choice: 这些话
  rationale: דברים 在引出下文直接引语时指所说的话；“这些话”既贴近原文，又符合现代汉语表达。整体采用“把”字句，使“这些话”作为宾语自然前置。
