id: GEN.44.22
reference: Genesis 44:22
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/נֹּ֨אמֶר֙ אֶל אֲדֹנִ֔/י לֹא יוּכַ֥ל הַ/נַּ֖עַר לַ/עֲזֹ֣ב אֶת אָבִ֑י/ו וְ/עָזַ֥ב אֶת אָבִ֖י/ו וָ/מֵֽת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/022.yaml
  text: And we said to my lord[a], ‘The boy cannot leave his father, for if he should leave his father, he would die.’
translation:
  language: zh_hans
  text: 我们对我主说：“这孩子不能离开他父亲；他若离开父亲，他父亲就会死。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“他离开他父亲，他就死了（或：就会死）”。“死”的主语没有明说；这里按上下文理解为父亲，也可理解为这孩子。
    reason: 说明原文省略主语所造成的真实歧义，并交代正文为何按上下文明确为父亲。
lexical_decisions:
- source_word: וַנֹּאמֶר
  choice: 我们……说
  rationale: 该动词为第一人称复数，承接前文叙事；汉语不必机械译出连接词“和”，按语序自然表达其连续性。
- source_word: אֶל־אֲדֹנִי
  choice: 对我主
  rationale: 这是犹大对约瑟的尊称。“我主”保留宫廷语境中的恭敬语气，也与本段反复出现的称呼一致。
- source_word: לֹא יוּכַל
  choice: 不能
  rationale: 准确表达 יכל 所指的能力或可能性，现代汉语简明自然。
- source_word: הַנַּעַר
  choice: 这孩子
  rationale: נַעַר 可指男孩或青年；这里从他与年老父亲相依的家庭关系着眼，“这孩子”既自然，也保留犹大话语中的怜惜语气。
- source_word: לַעֲזֹב
  choice: 离开
  rationale: עזב 在此指与父亲分离，并不必然带有道德意义上的“遗弃”，故译作“离开”。
- source_word: אָבִיו
  choice: 他父亲
  rationale: 保留原文两次提及父亲所形成的强调，并以现代汉语清楚表达所属关系。
- source_word: וְעָזַב
  choice: 他若离开
  rationale: 原文形式上是“而他离开”，在语境中表达假设后果；用“若”自然呈现条件关系，不增添额外含义。
- source_word: וָמֵת
  choice: 他父亲就会死
  rationale: 动词为第三人称阳性单数，主语未明说。结合本章29、31节，语境最自然地指父亲会死；正文明确所指以避免汉语代词歧义，同时用脚注保留原文形式及另一种可能理解。
theological_decisions:
- issue: וָמֵת 的隐含主语
  choice: 正文按上下文译为“他父亲就会死”
  alternative: “他就会死”，理解为孩子死去
  rationale: 希伯来语动词只标明第三人称阳性单数，没有明说主语；本章29、31节都把死亡后果归于父亲，因此正文采用该语境所支持的理解，但脚注说明原文的语法开放性，避免把另一可能性隐藏起来。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“我主”保留犹大面对埃及权臣时的恭敬称呼；“这孩子”体现家庭语境，不使用较陈旧的“童子”或“少年人”。
