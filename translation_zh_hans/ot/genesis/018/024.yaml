  text: אוּלַ֥י יֵ֛שׁ חֲמִשִּׁ֥ים צַדִּיקִ֖ם בְּ/ת֣וֹךְ הָ/עִ֑יר הַ/אַ֤ף תִּסְפֶּה֙ וְ/לֹא תִשָּׂ֣א לַ/מָּק֔וֹם לְמַ֛עַן חֲמִשִּׁ֥ים הַ/צַּדִּיקִ֖ם אֲשֶׁ֥ר בְּ/קִרְבָּֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/024.yaml
  text: Suppose there are fifty righteous people within the city[c][b][a]. Will you indeed sweep it away and not spare the place for the sake of the fifty righteous who are within it?
translation:
  language: zh_hans
  text: 假如城里有五十个义人，你果真要把那城一扫而尽，不因城里的五十个义人而放过那地方吗？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “放过那地方”也可译作“饶恕那地方”或“宽免那地方”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אוּלַי
  choice: 假如
  rationale: 在亚伯拉罕的恳求中引出假设，既保留试探性的语气，也符合现代汉语表达。
- source_word: חֲמִשִּׁים צַדִּיקִם
  choice: 五十个义人
  rationale: צַדִּיקִם指公义的人，并不限定为男性；“义人”是简洁、庄重且通行的圣经用语。
- source_word: בְּתוֹךְ הָעִיר
  choice: 城里
  rationale: 自然表达位于城的范围之内，避免生硬地直译为“城的中间”。
- source_word: הַאַף תִּסְפֶּה
  choice: 你还要把城彻底毁灭
  rationale: “还要……吗”传达疑问的强调语气；“彻底毁灭”表达ספה在审判语境中除灭、一扫而尽的力度。宾语“城”由上下文补明。
- source_word: וְלֹא תִשָּׂא לַמָּקוֹם
  choice: 不……饶恕那地方
  rationale: נשא在此可指赦免或宽免，使那地方免遭毁灭；“饶恕”保留原词可能具有的赦免意味，同时在语境中自然包含不施行毁灭。
- source_word: לְמַעַן
  choice: 因……而
  rationale: 表达为了其中义人的缘故而宽免该地的根据，现代汉语简洁自然。
- source_word: אֲשֶׁר בְּקִרְבָּהּ
  choice: 城里的
  rationale: 明确回指城中的五十个义人，保留原文重复所形成的恳求力度。
theological_decisions:
- issue: נשא在“不……那地方”中的含义
  choice: 正文译作“饶恕那地方”
  alternative: “放过那地方”或“使那地方免遭毁灭”
  rationale: 此处与彻底毁灭形成对照，核心是因义人而宽免全城。“饶恕”保留נשא可能具有的赦免语义；脚注同时给出更偏向免除毁灭的译法，避免把语义过度限定为个人罪得赦免。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“义人”保留关键的司法和伦理含义；句式呈现亚伯拉罕谨慎而强烈的反问。
