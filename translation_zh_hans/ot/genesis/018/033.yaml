id: GEN.18.33
reference: Genesis 18:33
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יֵּ֣לֶךְ יְהוָ֔ה כַּ/אֲשֶׁ֣ר כִּלָּ֔ה לְ/דַבֵּ֖ר אֶל אַבְרָהָ֑ם וְ/אַבְרָהָ֖ם שָׁ֥ב לִ/מְקֹמֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/033.yaml
  text: Then Yahweh went his way when he had finished speaking to Abraham[a], and Abraham returned to his place.
translation:
  language: zh_hans
  text: 雅威[a]对亚伯拉罕说完话，就离去了；亚伯拉罕也回到自己的地方。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文是“YHWH”（יהוה），即神的名字；也常译作“耶和华”。
    reason: 说明神名的原文形式及中文传统译法。
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: 就离去了
  rationale: הלך在本叙事语境中表示结束交谈后离开；“离去了”自然、简洁，也不额外说明去向。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以常见的中文音译呈现四字神名，而不以称号代替；脚注说明原文形式及另一传统译法。
- source_word: כַּאֲשֶׁר כִּלָּה לְדַבֵּר
  choice: 说完话，就
  rationale: כלה加不定式表达动作完成，כאשר在此引出离去发生的时间；汉语用“说完话，就……”自然地保留先后关系。
- source_word: אֶל אַבְרָהָם
  choice: 对亚伯拉罕
  rationale: אֶל具有朝向某人的意义，“对……说”比“与……说”更贴近原文结构。
- source_word: שָׁב
  choice: 回到
  rationale: שוב在这里表示返回先前所在之处。
- source_word: לִמְקֹמוֹ
  choice: 自己的地方
  rationale: מקום直译为“地方”；不具体化为原文未明说的“家”或“住处”。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名。正文采用贴近其可能读音的“雅威”，同时在脚注保留中文传统译名“耶和华”，不以“主”等称号取代专名。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“说完话，就离去了”符合现代汉语的时间推进方式；分号清楚呈现雅威离去与亚伯拉罕返回这两个并列动作。
