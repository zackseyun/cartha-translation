  text: וַ֠/יֹּאמֶר אַל נָ֞א יִ֤חַר לַֽ/אדֹנָ/י֙ וַ/אֲדַבְּרָ֣ה אַךְ הַ/פַּ֔עַם אוּלַ֛י יִמָּצְא֥וּ/ן שָׁ֖ם עֲשָׂרָ֑ה וַ/יֹּ֨אמֶר֙ לֹ֣א אַשְׁחִ֔ית בַּ/עֲב֖וּר הָ/עֲשָׂרָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/032.yaml
  text: Then he said[a], “Please, let not my lord be angry, and I will speak only this once more. Perhaps ten will be found there.” And he said[c][b], “I will not destroy it for the sake of the ten.”
translation:
  language: zh_hans
  text: 他又说：“求我主啊，不要发怒[a]；容我只再说这一次：也许在那里能找到十个人。”他说：“为了这十个人，我不毁灭那城[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文的称呼可译为“我主”或按现代汉语语序译为“我主啊”；其具体所指在此语境中有不同理解。
    reason: 保留 אֲדֹנָי 作为尊敬称呼及其所指的解释空间。
  - marker: b
    text: 原文直译为“为了这十个人，我不毁灭”，宾语由上下文领会。
    reason: 说明“那城”是为中文清楚而补出的宾语。
lexical_decisions:
- source_word: אַל נָא יִחַר לַאדֹנָי
  choice: 求我主不要发怒
  rationale: “求”体现 נָא 的恳求语气；חרה 是表示发怒的惯用表达；“我主”保留 אֲדֹנָי 作为恭敬称呼的形式，同时不把它等同于本节未出现的神名耶和华。
- source_word: וַאֲדַבְּרָה אַךְ הַפַּעַם
  choice: 容我只再说这一次
  rationale: 意愿式 וַאֲדַבְּרָה 在恳求语境中自然译为请求许可；אַךְ הַפַּעַם 限定这是最后一次发言。
- source_word: אוּלַי יִמָּצְאוּן שָׁם עֲשָׂרָה
  choice: 也许在那里能找到十个人
  rationale: “也许”保留 אוּלַי 的可能性；“能找到”自然表达 מצא 的尼פעל式“被找到”；中文补出量词“个”和由语境可知的“人”。
- source_word: לֹא אַשְׁחִית
  choice: 我不毁灭那城
  rationale: שׁחת 的使役式在此意为“毁灭”；原文宾语省略，中文依上下文补出“那城”以免表达残缺，并用脚注说明。
- source_word: בַּעֲבוּר הָעֲשָׂרָה
  choice: 为了这十个人
  rationale: “为了”传达 בַּעֲבוּר 所表达的顾念、因其缘故而采取行动；“这十个人”指刚提到的特定十人。
theological_decisions:
- issue: 亚伯拉罕称呼中的 אֲדֹנָי 所指及其译法
  choice: 我主
  alternative: 主啊／我的主人
  rationale: 叙事整体涉及神显现，但本节使用的是尊敬性的主称，而不是神名 יהוה。“我主”既保留直接称呼和谦卑语气，也不在译文中进一步断定这一称号的神学用法；脚注提示其也可按自然汉语直接呼语理解。
- issue: “毁灭”的宾语
  choice: 在正文补出“那城”
  alternative: 保持原文省略，仅译“我不毁灭”
  rationale: 希伯来文没有明说宾语，所指须由上下文确定。中文若完全省略显得不完整，因此补出上下文最直接的所指，同时以脚注明示原文形式，避免把补足内容误作明文。
translation_notes:
  register: 采用现代、庄重而可懂的叙事语言。“求……容我……”表现亚伯拉罕谨慎谦卑的恳求语气；避免文言式“息怒”和过度口语化表达。两个“他说”照原文保留，不擅自把第二个说话者的身份写入正文。
