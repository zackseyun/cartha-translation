base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/027.yaml
  text: Then Abraham answered and said[a], “Behold, please, I have dared to speak to my Lord, though I am dust and ashes.”
translation:
  language: zh_hans
  text: 亚伯拉罕回答说：“请看，我斗胆向我主[a]说话；我不过是尘土和灰烬。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“大人”。这个希伯来语形式可用作恭敬的称呼；此处译作“我主”，因为上下文将亚伯拉罕的受话者与耶和华相联系。
    reason: 保留אֲדֹנָי作为一般尊称的可能，同时说明本段语境为何采用“我主”。
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמַר
  choice: 回答说
  rationale: 保留希伯来叙事中“回答”与“说”的双重表达，同时符合现代汉语习惯。
- source_word: הִנֵּה נָא
  choice: 请看
  rationale: “看”传达引人注意的功能，“请”体现 נָא 所含的恳切、谦恭语气；在汉语中合并表达较为自然。
- source_word: הוֹאַלְתִּי
  choice: 竟敢
  rationale: 该词表示主动承担、冒昧或斗胆而为；结合亚伯拉罕自称“尘土和灰烬”的语境，“竟敢”兼顾他的谦卑与大胆。
- source_word: לְדַבֵּר
  choice: 说话
  rationale: 直接表达 דבר 不定式“说话、讲话”的一般含义。
- source_word: אֶל אֲדֹנָי
  choice: 对我主
  rationale: 保留原文带领属意味的尊称，不直接替换为上主的圣名；“主”的身份由上下文显明。
- source_word: וְאָנֹכִי עָפָר וָאֵפֶר
  choice: 我虽是尘土和灰烬
  rationale: 连接词在此具有让步、对比作用；“虽是”自然呈现亚伯拉罕将自己的卑微与斗胆发言相对照。
theological_decisions:
- issue: 亚伯拉罕称呼 אֲדֹנָי 的译法
  choice: 我主
  alternative: 大人
  rationale: 该形式既可作恭敬的人际称呼，也可指向神。正文用“我主”配合上下文对受话者的认定，同时用脚注保留语言形式本身的歧义，不以圣名取代原词。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“请看”避免过度古雅；“竟敢”与“尘土和灰烬”共同保留原文中谦卑与大胆并存的张力。
