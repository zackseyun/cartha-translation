base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/030.yaml
  text: Then he said[a], “Please, let not my Lord be angry, and I will speak. Perhaps thirty will be found there.” And he said, “I will not do it if I find thirty there.”
translation:
  language: zh_hans
  text: 亚伯拉罕又说：“求我主[a]不要动怒，让我说：也许在那里能找到三十人。”他说：“如果我在那里找到三十人，我就不这样做。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“我的主人”。希伯来文这个称号可作恭敬的称呼；按上下文，此处所称的是主。
    reason: alternative_reading
lexical_decisions:
- source_word: אַל נָא יִחַר לַאדֹנָי
  choice: 求我主不要动怒
  rationale: אַל与礼貌语气词נָא构成恳求式否定；חרה用于怒气发作。译文以现代汉语自然表达亚伯拉罕恭敬而谨慎的请求。
- source_word: וַאֲדַבֵּרָה
  choice: 容我再说
  rationale: 第一人称祈愿式在这里表达谦恭地请求继续发言；“再”承接此前的代求过程，属于语境明示。
- source_word: אוּלַי יִמָּצְאוּן שָׁם שְׁלֹשִׁים
  choice: 也许在那里能找到三十个义人
  rationale: אוּלַי保留假设和试探语气；Niphal形式译为“能找到”。“义人”由本段关于义人与恶人的明确上下文补足，使中文读者明白数字所指。
- source_word: לֹא אֶעֱשֶׂה
  choice: 我就不毁灭那城
  rationale: 希伯来文直译为“我不做”，所指行动由上下文确定为毁灭所多玛；中文补明宾语和行动，避免指代含混。
- source_word: אִם אֶמְצָא שָׁם שְׁלֹשִׁים
  choice: 如果我在那里找到三十个
  rationale: 按普通条件句处理，保留神回应的直接和简洁；“三十个”承接上句的义人。
theological_decisions:
- issue: 亚伯拉罕称呼中的 אֲדֹנָי
  choice: 我主
  alternative: 我的主人
  rationale: 上下文中受话者是向亚伯拉罕显现并宣告审判的神，因此“我主”合乎敬称语境；同时不用“耶和华”，因为原文此处是称号而非神名。简体中文不靠英文式大小写区分，语境自然表明所指。
- issue: לֹא אֶעֱשֶׂה 所指的行动
  choice: 不毁灭那城
  alternative: 不这样做
  rationale: 前文明确讨论是否毁灭城；补明所指可使现代汉语通顺，但不改变神应许的条件性。
- issue: 数字“三十”所指的人
  choice: 首句补作“三十个义人”，回应中简称“三十个”
  alternative: 两处均只译“三十个”
  rationale: 本段前文明确以城中的义人为代求对象；首处补明可避免孤立经节中产生误解，第二处则保持原文回应的简洁。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“求……容我……”体现亚伯拉罕的谦恭，“动怒”保留希伯来语怒气燃起的惯用意义。人称称呼不使用英文式大小写对应，也不添加脚注，因为正文“我主”已能在本段语境中自然表达敬称。
