  text: הֲ/יִפָּלֵ֥א מֵ/יְהוָ֖ה דָּבָ֑ר לַ/מּוֹעֵ֞ד אָשׁ֥וּב אֵלֶ֛י/ךָ כָּ/עֵ֥ת חַיָּ֖ה וּ/לְ/שָׂרָ֥ה בֵֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/014.yaml
  text: Is anything too difficult for Yahweh? At the appointed time I will return to you[a], about this time next year[b], and Sarah will have a son.
translation:
  language: zh_hans
  text: 难道有什么事对耶和华来说太难吗？到了所定的时候，我必回到你这里[a]；明年这个时候[b]，撒拉将有一个儿子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “你”是阳性单数，指亚伯拉罕。
    reason: referent_clarification
  - marker: b
    text: 希伯来语习语，字面表达近于“如同生命的时节”，含义有争议；按上下文，指来年同一时候或时节。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיִפָּלֵא
  choice: 太难
  rationale: פלא 的尼法勒形可指非凡、奇妙，或超出能力所及。此处反问强调没有任何事超出耶和华的能力；“太难”在现代汉语中自然，又不把语义强化为哲学意义上的“绝不可能”。
- source_word: מֵיְהוָה
  choice: 对耶和华来说
  rationale: 介词 מִן 在此与 פלא 连用，表示相对于某位而言超出能力或限度；译为“对……来说”符合现代汉语表达。יְהוָה 以常用中文专名“耶和华”译出。
- source_word: דָּבָר
  choice: 什么事
  rationale: דָּבָר 可指事、事情、话语或事项；在反问句中译为“什么事”自然并保留宽泛含义。
- source_word: לַמּוֹעֵד
  choice: 到了指定的日期
  rationale: מוֹעֵד 指预定、指定的时刻；这里带定冠词，回指先前所说的日期。译文保留其已定的意味。
- source_word: אָשׁוּב אֵלֶיךָ
  choice: 我必回到你这里
  rationale: שׁוּב 在此表示回来，אֵלֶיךָ 为阳性单数，所指是亚伯拉罕；正文不补出名字，以保留原文人称。
- source_word: כָּעֵת חַיָּה
  choice: 明年这个时候
  rationale: 这是含义有争议的希伯来语习语，按上下文指下一年相同的时节。正文采用清楚的现代汉语表达，并以脚注保留字面形式。
- source_word: וּלְשָׂרָה בֵן
  choice: 撒拉将有一个儿子
  rationale: 原文末句为无动词结构，字面近于“撒拉有一个儿子”；未来意义由应许的上下文确定，汉语补出“将有”。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。正文采用现代中文圣经读者最熟悉、且作为专名使用的“耶和华”，不以“主”替代神名。
- issue: 反问句 הֲיִפָּלֵא 的力度
  choice: 难道有什么事对耶和华来说太难吗？
  alternative: 难道有什么事对耶和华来说太奇妙吗？
  rationale: 原词兼有“奇妙、非凡”和“超出能力”的语义张力。上下文聚焦耶和华成就撒拉生子的应许，正文用“太难”清楚传达反问的能力含义；脚注保留“太奇妙”这一真实的词义可能。
- issue: 说话者“我必回到你这里”的指涉
  choice: 保留第一人称，不作身份性增补
  alternative: 补明为“耶和华必回到你这里”
  rationale: 原文由第一人称说话者作出应许，但本节不再次明说其身份。保留“我”可避免在正文中加入超出该句形式的信息。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“难道……太难吗”保留原文反问力度；分号呈现“指定的日期”与随后时间说明之间的紧密关系。正文所有脚注标记均已对应列出。
