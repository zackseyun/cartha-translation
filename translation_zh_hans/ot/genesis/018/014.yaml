  naturalness: 正文整体庄重、自然。“到了所定的时候”比“到了指定的日期”更符合现代汉语，也避免与“明年这个时候”产生时间单位不协调。
  terminology: “耶和华”“撒拉”“儿子”均为中文圣经中通行且准确的用语。“太难”没有把原文加强为“绝不可能”。脚注应更谨慎地说明 כָּעֵת חַיָּה 是意义有争议的习语，避免把某一字面重构当作确定直译。
