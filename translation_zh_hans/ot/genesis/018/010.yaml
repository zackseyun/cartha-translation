base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/010.yaml
  text: And he said[a], “I will surely return to you about this time next year, and behold[c][b], Sarah your wife will have a son.” And Sarah was listening at the entrance of the tent behind him.
translation:
  language: zh_hans
  text: 他说：“明年大约这个时候[a]，我一定会回到你这里。看哪，你的妻子撒拉必有一个儿子。”撒拉正在他身后的帐篷门口听着[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“约在生命之时”，在这里是指明年这个时节。
    reason: lexical_alternative
  - marker: b
    text: 原文末句也可较直译为：“撒拉在帐篷门口听着，它在他身后。”其中代词的所指较为简略。
    reason: textual_ambiguity
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 他说
  rationale: 未明说主语身份，按希伯来文保留第三人称单数，不补作“耶和华”或“其中一人”
- source_word: שׁוֹב אָשׁוּב
  choice: 我一定会回到
  rationale: 以“一定”表达不定式绝对式与未完成式同根连用的强调语气
- source_word: כָּעֵת חַיָּה
  choice: 明年大约这个时候
  rationale: 按上下文采用自然汉语表达这一时间习语，同时用脚注保留其字面形式
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留希伯来文提示注意、郑重宣告的作用
- source_word: בֵן לְשָׂרָה אִשְׁתֶּךָ
  choice: 你的妻子撒拉必有一个儿子
  rationale: 将表示归属或所得的介词结构转换成自然汉语，同时保留应许的确定语气
- source_word: שָׂרָה שֹׁמַעַת
  choice: 撒拉正在……听着
  rationale: 以“正在……听着”体现分词所描写的持续动作
- source_word: פֶּתַח הָאֹהֶל וְהוּא אַחֲרָיו
  choice: 他身后的帐篷门口
  rationale: 按较自然的空间关系理解为帐篷门口在说话者身后，但以脚注说明原文代词的简略与歧义
theological_decisions:
- issue: 说话者的身份
  choice: 只译作“他”
  alternative: “耶和华说”或“其中一人说”
  rationale: 本节希伯来文仅用未明示主语的第三人称单数动词；不从上下文补入特定身份，以保留原文在本节的表达。
- issue: 末句代词的所指
  choice: 理解为帐篷门口在说话者身后
  alternative: 较直译为“它在他身后”或“他在他身后”
  rationale: 原文 וְהוּא אַחֲרָיו 的阳性代词可回指阳性名词“门口”，但形式简略；正文采用符合场景的自然汉语，脚注保留歧义。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话；保留“看哪”的经文宣告色彩。脚注标记均置于正文对应位置。
