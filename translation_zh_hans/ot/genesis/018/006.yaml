  terminology: “细亚”作为古代干量单位的音译合适，“上等面粉”能表达细面/优质面粉。“饼”适合 עֻגוֹת，且不误导为现代甜点。词汇替代注的“三份”过于泛泛，宜明确为“三量（面粉）”。
