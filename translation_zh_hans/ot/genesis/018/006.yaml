lexical_decisions:
- source_word: וַיְמַהֵר
  choice: 赶紧
  rationale: 表达迅速行动的叙事紧迫感，也符合现代汉语的自然用法。
- source_word: הָאֹהֱלָה אֶל שָׂרָה
  choice: 进帐篷去见撒拉
  rationale: 词尾的方向形式表示朝帐篷而去；结合随后对撒拉说话的语境，以“进帐篷去见撒拉”清楚自然地表达其行动。
- source_word: מַהֲרִי
  choice: 快！
  rationale: 这是对撒拉所用的阴性单数命令式；简短的“快”保留直接而急切的语气。
- source_word: שְׁלֹשׁ סְאִים
  choice: 三细亚
  rationale: 保留古代具体容量单位，并以脚注说明大致容量及可能的泛化译法。
- source_word: קֶמַח סֹלֶת
  choice: 上等面粉
  rationale: 该组合指品质优良、磨得精细的面粉；“上等面粉”在现代汉语中自然，并保留其质量含义。
- source_word: לוּשִׁי
  choice: 揉成面团
  rationale: 该动词特指揉面，而非一般的搅拌；补出结果“面团”使汉语表达完整自然。
- source_word: וַעֲשִׂי עֻגוֹת
  choice: 做成饼
  rationale: עֻגוֹת 指饼状的面食；“饼”既简洁又避免过度指定烤制方式。
