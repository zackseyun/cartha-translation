base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/002.yaml
  text: He lifted up his eyes and looked[a], and behold, three men were standing near him. When he saw them[b], he ran from the entrance of the tent to meet them and bowed down to the ground.
translation:
  language: zh_hans
  text: 他举目观看，看哪，三个人站在他近旁[a]。他一看见他们，就从帐篷门口跑去迎接他们，俯伏在地[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“站在他身旁”。希伯来语介词可表示距离很近。
    reason: lexical_alternative
  - marker: b
    text: 或译：“全身俯伏在地”。这里的动词描述深表敬意的俯伏动作，本身不必然表示“敬拜”。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשָּׂא עֵינָיו וַיַּרְא
  choice: 他举目观看
  rationale: 保留希伯来语“举目”的生动表达，同时用现代汉语中自然、庄重的“观看”表达随后的视觉动作。
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留这一叙事提示语所带出的现场感和突然呈现的效果，而不把它淡化为单纯的“有”。
- source_word: שְׁלֹשָׁה אֲנָשִׁים
  choice: 三个人
  rationale: אֲנָשִׁים在此指男性人物；现代汉语“三个人”自然明白，且上下文会进一步交代其身份。
- source_word: נִצָּבִים עָלָיו
  choice: 站在他近旁
  rationale: עַל在此可表示贴近、在旁的位置关系；“近旁”保留距离很近的含义，也避免“站在他上面”造成不合语境的空间联想。
- source_word: וַיַּרְא
  choice: 他一看见
  rationale: 第二次出现的动词引出亚伯拉罕随即采取的行动；“一……就……”自然呈现动作紧接发生的关系。
- source_word: וַיָּרָץ לִקְרָאתָם
  choice: 跑去迎接他们
  rationale: 明确保留“跑”的具体动作，体现其迅速而热切的反应。
- source_word: מִפֶּתַח הָאֹהֶל
  choice: 从帐篷门口
  rationale: “门口”是现代汉语对帐篷开口或入口自然、准确的表达。
- source_word: וַיִּשְׁתַּחוּ אָרְצָה
  choice: 俯伏在地
  rationale: 该表达描写向地俯身的敬重姿态；“俯伏在地”准确传达身体动作，却不预先断定这是宗教意义上的敬拜。
theological_decisions:
- issue: 亚伯拉罕的动作是否应直接译为对神圣对象的“敬拜”
  choice: 译作“俯伏在地”
  alternative: 译作“敬拜”
  rationale: 希伯来语动词既可用于人在上帝面前的敬拜，也可用于人在他人面前表示深切敬意。本节当下称来者为“三个人”，因此不宜用“敬拜”提前解决来者身份及动作性质的诠释问题。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“举目观看”和“看哪”略具文学色彩，用以保留原文的生动叙事风格；“跑去迎接”“帐篷门口”则保持自然口吻。脚注标记放在各自所说明的词组之后。
