  text: וַ/יֹּאמְר֣וּ אֵׄלָׄ֔יׄ/וׄ אַיֵּ֖ה שָׂרָ֣ה אִשְׁתֶּ֑/ךָ וַ/יֹּ֖אמֶר הִנֵּ֥ה בָ/אֹֽהֶל׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/009.yaml
  text: Then they said to him[a], “Where is Sarah your wife?” And he said, “There, in the tent.”
translation:
  language: zh_hans
  text: 他们问他[a]：“你妻子撒拉在哪里？”他说：“就在帐篷里。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来抄本在“他”这个词的字母上方标有特殊点号；正文仍按现存辅音文本译作“他”。
    reason: 原文 אֵלָיו 带有马所拉传统的特殊点号（puncta extraordinaria），宜让读者知晓这一抄写现象，同时不据此擅自改动正文。
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: 他们问
  rationale: 该动词字面为“他们说”，但后接直接问句；现代汉语用“问”更自然，也准确表达此处言语行为。叙事连续关系由语序自然体现，无须机械加入“然后”。
- source_word: אֵלָיו
  choice: 他
  rationale: 介词 אֶל 加第三人称阳性单数后缀，指向上文的亚伯拉罕；正文保留原文代词，不擅自以专名替换。
- source_word: אַיֵּה
  choice: 在哪里
  rationale: 这是询问所在位置的疑问副词；“在哪里”是现代汉语中自然、明确的对应表达。
- source_word: שָׂרָה
  choice: 撒拉
  rationale: 采用该人物在现代中文圣经语境中通行且稳定的译名。
- source_word: אִשְׁתֶּךָ
  choice: 你妻子
  rationale: אִשָּׁה 的构造形式加第二人称阳性单数后缀，明确表示“你的妻子”；中文依自然定语顺序译作“你妻子”。
- source_word: וַיֹּאמֶר
  choice: 他说
  rationale: 单数阳性动词指亚伯拉罕回答；简洁译出主语与言说动作，并保持叙事衔接。
- source_word: הִנֵּה
  choice: 就
  rationale: הִנֵּה 在此为指示、提示性的语气词，用于直接回答位置问题；“就”与后面的地点短语结合，既自然又保留其强调、指示意味。
- source_word: בָאֹהֶל
  choice: 在帐篷里
  rationale: 介词 בְּ 加带冠词的 אֹהֶל，表示“在那帐篷里”；中文按语境自然译作“在帐篷里”。
theological_decisions: []
translation_notes:
  register: 采用现代、简洁而庄重的叙事语言。“他们问他”避免生硬直译“他们对他说”；回答译作“就在帐篷里”，保留希伯来语的简短形式和 הִנֵּה 的指示强调，不补入原文省略的“她”。
