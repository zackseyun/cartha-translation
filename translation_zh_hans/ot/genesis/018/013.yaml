source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר יְהוָ֖ה אֶל אַבְרָהָ֑ם לָ֣/מָּה זֶּה֩ צָחֲקָ֨ה שָׂרָ֜ה לֵ/אמֹ֗ר הַ/אַ֥ף אֻמְנָ֛ם אֵלֵ֖ד וַ/אֲנִ֥י זָקַֽנְתִּי־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/013.yaml
  text: And the LORD said to Abraham, “Why did Sarah laugh, saying, ‘Will I really bear a child, now that I am old?’”
translation:
  language: zh_hans
  text: 耶和华对亚伯拉罕说：“撒拉为什么笑，说：‘我已经老了，真的还能生孩子吗？’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名形式表达四字神名，既保留其专名性质，也符合庄重、通行的译法。
- source_word: לָמָּה זֶּה
  choice: 为什么
  rationale: 该问句在此自然表示对撒拉发笑的追问；中文无需机械译出指示成分“这”。
- source_word: הַאַף אֻמְנָם
  choice: 真的还能……吗
  rationale: אַף与אֻמְנָם叠加强调惊疑之意；结合上下文，用“真的还能”自然传达“难道果真”的语气。
- source_word: אֵלֵד
  choice: 生孩子
  rationale: 该动词意为“生产、生育”；中文补出泛指宾语“孩子”，使独立问句自然清楚，不额外限定孩子性别。
- source_word: וַאֲנִי זָקַנְתִּי
  choice: 我已经老了
  rationale: 完成式在此描述现已进入年老状态；“已经老了”准确而符合现代汉语。
theological_decisions:
- issue: 神名יהוה的表达
  choice: 耶和华
  alternative: 上主／雅威
  rationale: 原文使用神的专名而非普通称号；采用中文广为人知的专名形式，避免将其降格为一般称谓，同时不借此引入教派解释。
- issue: 撒拉问句的语气
  choice: 保留惊疑而不判定其道德性质
  alternative: 译成明确的不信或讥笑语气
  rationale: 原文强调她对年老仍能生育的惊讶和疑问，但本节自身没有用解释性词语明确界定其内在动机，因此不在译文中额外裁定。
translation_notes:
  register: 采用现代、庄重而口语自然的叙事表达。直接引语层级清楚；“真的还能生孩子吗”保留原文的强调与反问色彩。“我已经老了”前置，更符合现代汉语在此类条件性疑问中的自然语序。
