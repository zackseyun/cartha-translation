base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/031.yaml
  text: Then he said[a], “See now, I have undertaken to speak to my Lord. Perhaps twenty will be found there.” And he said[b], “I will not destroy it for the sake of the twenty.”
translation:
  language: zh_hans
  text: 他又说：“看，我冒昧[a]向我主说话：或许那里能找到二十个。”他说：“为了这二十个，我不毁灭那城。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “冒昧”也可译作“斗胆”或“擅敢”。
    reason: 希伯来语 הוֹאַלְתִּי 在这里表达亚伯拉罕谦卑而斗胆开口的意思。
lexical_decisions:
- source_word: הִנֵּה נָא
  choice: 看
  rationale: 这是带有恳请语气的引语开场语；现代汉语用“看”自然地引起注意，谦恭语气则由后面的“敢”及整句表达。
- source_word: הוֹאַלְתִּי
  choice: 我既然敢
  rationale: 此处表示冒昧、鼓起勇气或擅敢开口；“既然敢”既承接亚伯拉罕已经开口的事实，也保留他面对主时谨慎谦卑的语气。
- source_word: לְדַבֵּר אֶל אֲדֹנָי
  choice: 对我主说话
  rationale: 直译其动作和对象；“我主”保留敬称性质，不把本节未出现的神名引入译文。
- source_word: אוּלַי
  choice: 或许
  rationale: 保留亚伯拉罕试探性、恭敬的措辞。
- source_word: יִמָּצְאוּן שָׁם עֶשְׂרִים
  choice: 那里能找到二十个
  rationale: 以自然汉语表达希伯来语被动态；“个”所指的人可由前文义人之语境补足，不在正文重复添加“义人”。
- source_word: לֹא אַשְׁחִית
  choice: 我也不毁灭那城
  rationale: 动词表示毁坏、毁灭；原文宾语省略，汉语为清楚起见依上下文补出“那城”，“也”体现数字逐次递减的对话承接。
- source_word: בַּעֲבוּר הָעֶשְׂרִים
  choice: 为了这二十个
  rationale: “为了”准确表达因这特定的二十人而宽免全城的代求逻辑；“这”自然体现定冠词所指的特定数目。
theological_decisions:
- issue: 亚伯拉罕称呼中的 אֲדֹנָי
  choice: 我主
  alternative: 我的主／我主啊
  rationale: 上下文表明受话者是神圣来客；“我主”作为敬称能够保留这一指向，又不把本节没有使用的耶和华之名加入正文。
- issue: 二十人的身份
  choice: 正文仅译“二十个”
  alternative: 二十个义人
  rationale: 本节原文只说“二十”，其为义人可由18:23—30明确得知；不在本节补出“义人”，可保持原文的省略。
translation_notes:
  register: 采用现代、庄重而口语顺畅的叙事语言。“看”避免古雅的“看哪”；“那城”是为汉语清晰度补出的上下文宾语。正文唯一脚注标记[a]已置于相应位置。
