base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/021.yaml
  text: I will go down now and see whether they have done altogether according to its outcry that has come to me[a]; and if not[b], I will know.
translation:
  language: zh_hans
  text: 我要下去察看，他们所做的是否完全符合那传到我这里的呼声[a]；若不然，我就会知道。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他们所做的是否完全符合那传到我这里的呼声”：希伯来原文直译近于“他们是否照着那传到我这里的呼声，做到了完全”。这是一个较难的结构，可能指他们所做的是否完全与那呼声所反映、所报道的情况相符。
    reason: 说明希伯来语疑难结构 עָשׂוּ כָּלָה 及其可能含义，同时避免将“呼声”预先限定为某一种具体指控。
lexical_decisions:
- source_word: אֵרֲדָה נָּא
  choice: 我要下去
  rationale: אֵרֲדָה是第一人称单数祈愿式，在此表达说话者的决意；נָא在这种结构中加强当下的意愿或语气。译作“我要下去”自然地保留这一意向，无须机械加上“现在”。
- source_word: וְאֶרְאֶה
  choice: 看看
  rationale: ראה在此指亲自察看、查明。“看看”既保留希伯来文的日常叙事表达，也符合现代汉语习惯。
- source_word: הַכְּצַעֲקָתָהּ הַבָּאָה אֵלַי
  choice: 如那传到我这里的呼声所说的
  rationale: צְעָקָה常指因严重罪恶或不公而发出的呼号、控诉。第三人称阴性单数后缀可指前文所谈的城；译文保留“呼声”而不直接限定为“控告”，并用“所说的”使比较关系在汉语中清楚自然。
- source_word: עָשׂוּ כָּלָה
  choice: 他们所做的是否完全如……
  rationale: 这是一个较难的希伯来语结构；עָשׂוּ为第三人称复数，כָּלָה表达完全、到底。译文理解为居民所行之事是否完全符合传来的呼声，同时以脚注说明原文结构。
- source_word: וְאִם לֹא אֵדָעָה
  choice: 若不是，我就会知道
  rationale: 保留原文简短的条件对照和ידע“知道”的基本意义，不扩译为审判或惩罚。
theological_decisions:
- issue: 以拟人方式描写上帝亲自调查
  choice: 保留“下去看看……我就会知道”
  alternative: 解释性地改写为“我要鉴察并施行审判”
  rationale: 原文用人的行动与认知过程来叙述上帝。译文保留这种叙事张力，不以系统神学解释消除其拟人表达。
- issue: “呼声”的指向
  choice: 译作“那传到我这里的呼声”
  alternative: 明确译作“控告那城的呼声”
  rationale: 后缀在语法上是“它／她的呼声”，语境可使人理解为针对所多玛的控诉，但“针对”并非后缀本身明说，因此正文不把这一关系定死。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“下去看看”保留叙事的直接性；分号呈现原文“若不是”的简短转折。正文避免古奥措辞，也不把“呼声”过度解释为已经裁定的罪状。
