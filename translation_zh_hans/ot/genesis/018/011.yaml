  yaml_path: translation/ot/genesis/018/011.yaml
  text: Abraham and Sarah were old[a], advanced in days; the way of women had ceased to be with Sarah.
translation:
  language: zh_hans
  text: 亚伯拉罕和撒拉年纪老迈，岁数已高；撒拉的月经已经停了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זְקֵנִים
  choice: 年纪老迈
  rationale: 表示二人年老；“年纪老迈”自然、庄重，并可与下句年龄习语并列。
- source_word: בָּאִים בַּיָּמִים
  choice: 岁数已高
  rationale: 希伯来语直译为“进入日子”，指年事已高；采用现代汉语习语传达其意义，同时保留与前句的强调性重复。
- source_word: חָדַל לִהְיוֹת
  choice: 已经停了
  rationale: חָדַל表示停止、不再发生；“已经停了”准确表达完成状态，符合现代汉语。
- source_word: אֹרַח כַּנָּשִׁים
  choice: 月经
  rationale: 字面为“妇人的常例/道路”，在此是指女性月经的委婉语。现代汉语直接说“月经”清楚自然，也避免“妇人的常例”可能造成的误解。
- source_word: לְשָׂרָה
  choice: 撒拉的
  rationale: 此处介词表示就撒拉而言；汉语用领属结构“撒拉的月经”最为自然。
