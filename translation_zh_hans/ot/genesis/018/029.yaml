base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/029.yaml
  text: He spoke to him again and said[a], “Perhaps forty will be found there.” And he said[b], “I will not do it for the sake of the forty.”
translation:
  language: zh_hans
  text: 亚伯拉罕又对耶和华说：“也许在那里能找到四十人。”耶和华说：“为了这四十人，我不这样做[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译“我不做”，所指的行动由上下文补足；也可译作“我不毁灭那城”。
    reason: 说明希伯来文省略宾语，保留正文未明确说明之处，同时给出符合上下文的译法。
lexical_decisions:
- source_word: וַיֹּסֶף עוֹד לְדַבֵּר
  choice: 又……说
  rationale: יסף与עוד及不定式连用，表达继续或再次进行某事；译作“又……说”既保留重复之意，也符合现代汉语表达。
- source_word: אוּלַי
  choice: 也许
  rationale: 表示试探性、未确定的可能，符合亚伯拉罕谨慎代求的语气。
- source_word: יִמָּצְאוּן שָׁם אַרְבָּעִים
  choice: 在那里能找到四十人
  rationale: מצא的尼法勒形式表示“被找到”；原文只说“四十”，按上下文补出量词中心语“人”，使汉语完整自然，而不额外限定为“四十个义人”。
- source_word: לֹא אֶעֱשֶׂה
  choice: 我也不这样做
  rationale: 原文只说“我不做”，宾语由上下文暗示；“这样做”保留其省略性质，避免在正文中明确添加“毁灭那城”。
- source_word: בַּעֲבוּר הָאַרְבָּעִים
  choice: 为了这四十人
  rationale: בַּעֲבוּר表示“因为、为了……的缘故”；此译简洁地传达这四十人成为不采取行动的缘由。
theological_decisions:
- issue: לֹא אֶעֱשֶׂה所省略的神圣行动
  choice: 正文译作“我也不这样做”，不明确补出具体行动
  alternative: 我就不毁灭那城
  rationale: 希伯来文让所指行动由前文语境补足。保留一定含蓄性，既使现代汉语可懂，也避免把上下文解释直接写入正文。
- issue: 叙事中两处第三人称代词的指代
  choice: 按上下文明确为“亚伯拉罕”和“耶和华”
  alternative: 他又对他说……他说
  rationale: 原文代词的指代在连续叙事中清楚，但孤立的现代汉语经文若连续使用“他”会造成说话者混淆；明确人名不改变参与者或神学含义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“又……说”避免机械复现两个言说动词造成的累赘；“四十人”符合汉语数量表达，但没有擅自加入原文此处未出现的“义人”。
