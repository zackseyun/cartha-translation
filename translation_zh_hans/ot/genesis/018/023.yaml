base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/023.yaml
  text: Then Abraham came near and said[a], “Will you indeed sweep away the righteous with the wicked?”
translation:
  language: zh_hans
  text: 亚伯拉罕上前说：“你真的要把义人和恶人一并除灭吗？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּגַּשׁ
  choice: 上前
  rationale: נגשׁ表示走近、上前；“上前”既保留亚伯拉罕靠近的动作，也自然体现他开始代求的叙事场景。
- source_word: הַאַף
  choice: 真的……吗
  rationale: 疑问词ה与אַף共同加强反问语气；“真的……吗”自然传达亚伯拉罕惊讶而恳切的追问。
- source_word: תִּסְפֶּה
  choice: 除灭
  rationale: ספה在此指在审判中一并清除或毁灭。“除灭”保留审判性的力度，又不额外限定具体毁灭方式。
- source_word: צַדִּיק
  choice: 义人
  rationale: 单数形式在此作类别性用法；“义人”是现代中文圣经语体中清楚、简洁的道德类别称谓。
- source_word: עִם
  choice: 和……一并
  rationale: עִם基本义为“与、和”；结合动词译作“和……一并”，清楚表达义人与恶人遭受同一命运的疑问。
- source_word: רָשָׁע
  choice: 恶人
  rationale: 与“义人”相对，单数形式同样具有泛指类别的作用；“恶人”准确保留其道德与司法含义。
theological_decisions:
- issue: 单数形式的道德类别
  choice: 将צַדִּיק和רָשָׁע译为泛指类别的“义人”和“恶人”
  alternative: 译为“一个义人”和“一个恶人”，或明确复数化为“义人们”和“恶人们”
  rationale: 希伯来文虽用单数，却是在提出关于神公义审判的一般原则；中文“义人”和“恶人”无需标明数，既能保留原文形式上的含混，也自然具有类别性。
- issue: 亚伯拉罕疑问的反问力度
  choice: 译作“你真的要……吗？”
  alternative: 译作较弱的“你要……吗？”或较强的“难道你竟要……吗？”
  rationale: “真的”体现הַאַף的加强作用，同时避免用“竟然”等词过度替亚伯拉罕判定神将采取何种行动。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“上前说”简洁自然；“一并除灭”保留审判语境和义恶同受一命运的核心张力。原文无需脚注即可充分表达，故未设置脚注标记。
