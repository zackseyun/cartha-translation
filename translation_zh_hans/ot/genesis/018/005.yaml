  text: וְ/אֶקְחָ֨ה פַת לֶ֜חֶם וְ/סַעֲד֤וּ לִבְּ/כֶם֙ אַחַ֣ר תַּעֲבֹ֔רוּ כִּֽי עַל כֵּ֥ן עֲבַרְתֶּ֖ם עַֽל עַבְדְּ/כֶ֑ם וַ/יֹּ֣אמְר֔וּ כֵּ֥ן תַּעֲשֶׂ֖ה כַּ/אֲשֶׁ֥ר דִּבַּֽרְתָּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/005.yaml
  text: And let me bring a morsel of bread[a], so that you may refresh your hearts; after that you may pass on, since this is why you have passed by your servant. And they said, “Yes[b], do as you have said.”
translation:
  language: zh_hans
  text: 请让我拿一点饼来[a]，好让你们恢复体力[b]；然后你们再继续赶路，既然你们路过仆人这里。”他们说：“就照你说的做吧。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“一块饼”。这个希伯来语短语在待客场景中是谦逊的说法。
    reason: lexical_alternative
  - marker: b
    text: 字面意思是“扶持你们的心”，指吃些食物后恢复精神和力量。
    reason: idiom_explanation
lexical_decisions:
- source_word: וְאֶקְחָה
  choice: 请让我拿……来
  rationale: 该词是 לקח 的第一人称单数祈愿式，表达亚伯拉罕礼貌而主动的提议；“请让我……来”自然传达这种意愿语气。
- source_word: פַת לֶחֶם
  choice: 一点饼
  rationale: 该短语指少量或一小块饼；在待客语境中也是谦逊的说法。“一点饼”既自然，又保留主人淡化款待规模的语气。
- source_word: וְסַעֲדוּ לִבְּכֶם
  choice: 好让你们恢复体力
  rationale: 字面意象是“扶持/增强你们的心”，在这里指吃些食物恢复精神和力量。“恢复体力”符合现代汉语，同时由脚注保留希伯来语意象。
- source_word: אַחַר תַּעֲבֹרוּ
  choice: 然后你们再继续赶路
  rationale: עבר 在此表示客人随后继续行程；“继续赶路”清楚呈现旅行语境。
- source_word: כִּי עַל כֵּן
  choice: 因为……正是为此
  rationale: 这一组合说明亚伯拉罕款待客人的理由；译文保留原句略显强烈的因果/目的表达，不另行解释其含义。
- source_word: עֲבַרְתֶּם עַל עַבְדְּכֶם
  choice: 你们从仆人这里经过
  rationale: 既保留 עבר“经过”的空间含义，也保留亚伯拉罕以“仆人”自称的谦恭待客口吻。
- source_word: כֵּן תַּעֲשֶׂה כַּאֲשֶׁר דִּבַּרְתָּ
  choice: 就照你说的做吧
  rationale: 客人的回答是简洁的同意；“就……吧”在现代汉语中自然表达肯定和许可。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而自然的叙事语言。亚伯拉罕的话保持谦恭好客的语气；“仆人”作为自谦称呼保留。引号前半句承接上一节的直接引语，因此本节开头不另加前引号。
