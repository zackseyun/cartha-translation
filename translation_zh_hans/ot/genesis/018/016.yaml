  text: וַ/יָּקֻ֤מוּ מִ/שָּׁם֙ הָֽ/אֲנָשִׁ֔ים וַ/יַּשְׁקִ֖פוּ עַל פְּנֵ֣י סְדֹ֑ם וְ/אַ֨בְרָהָ֔ם הֹלֵ֥ךְ עִמָּ֖/ם לְ/שַׁלְּחָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/016.yaml
  text: Then the men rose up from there and looked down toward Sodom[b][a], and Abraham was walking with them to send them on their way.
translation:
  language: zh_hans
  text: 那些人从那里起身，俯望所多玛[a]；亚伯拉罕与他们同行，要送他们一程[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“望向所多玛”。原文动词通常含有从高处向外或向下观看的意思。
    reason: lexical_alternative
  - marker: b
    text: 或译：“为他们送行”。原文所表达的是陪伴将要离开的客人，并送他们上路。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֻמוּ
  choice: 起身
  rationale: 准确表达קום的起立、起来之意，也自然承接前面的会面场景，而不把动作过度解释为已经出发。
- source_word: מִשָּׁם
  choice: 从那里
  rationale: 直接、自然地保留原文的地点转换。
- source_word: הָאֲנָשִׁים
  choice: 那些人
  rationale: 原文使用普通名词“人、男人”，本节没有明说他们是天使；如此翻译可保留叙事中的身份张力，避免提前作出解释。
- source_word: וַיַּשְׁקִפוּ
  choice: 俯望
  rationale: שׁקף常指从较高处向外或向下观看；“俯望”简洁地传达视点较高及朝所多玛观看的含义。
- source_word: עַל־פְּנֵי סְדֹם
  choice: 所多玛
  rationale: 该短语在这里表示面向所多玛、朝所多玛方向；方向含义已由“俯望所多玛”这一现代汉语搭配自然表达。
- source_word: הֹלֵךְ עִמָּם
  choice: 与他们同行
  rationale: 分词הֹלֵךְ表达持续、伴随的行动；“同行”既保留与他们一起走的意思，又符合现代汉语叙事表达。
- source_word: לְשַׁלְּחָם
  choice: 要送他们一程
  rationale: 此处שׁלח涉及陪伴即将离开的客人并送其上路；“送他们一程”自然体现古代待客送行的情境，同时不只强调告别动作。
theological_decisions:
- issue: 本节中הָאֲנָשִׁים的身份
  choice: 正文译作“那些人”
  alternative: “那些访客”或“那些天使”
  rationale: 希伯来文在本节使用普通名词“人”，并未在此直接称他们为天使。正文保留这一称呼，可避免凭后文或神学判断提前消除叙事张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“起身”“俯望”“同行”“送他们一程”均为自然的现代汉语表达；保留“那些人”，不在本节提前解释其身份。脚注标记按所解释的词语分别置于“所多玛”和“送他们一程”之后。
