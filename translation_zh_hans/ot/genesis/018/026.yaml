source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוָ֔ה אִם אֶמְצָ֥א בִ/סְדֹ֛ם חֲמִשִּׁ֥ים צַדִּיקִ֖ם בְּ/ת֣וֹךְ הָ/עִ֑יר וְ/נָשָׂ֥אתִי לְ/כָל הַ/מָּק֖וֹם בַּ/עֲבוּרָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/026.yaml
  text: And Yahweh said[a], “If I find fifty righteous people within the city of Sodom, then I will spare the whole place for their sake.”
translation:
  language: zh_hans
  text: 雅威说：“如果我在所多玛城里找到五十个义人，我就因他们的缘故饶过整个地方[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“赦免整个地方”。这里的希伯来语动词可表示担当或除去罪责，也可指不施行审判；正文依上下文译作“饶过”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来语四字神名的通行中文音译处理，保留其作为上帝专名的性质，而不以称号代替。
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 未完成式连续体在此推进叙事；现代汉语仅用“说”即可自然承接上文，无须机械补出“并且”。
- source_word: אִם אֶמְצָא
  choice: 如果我……找到
  rationale: 直接保留条件句结构，表达雅威对亚伯拉罕请求的回应。
- source_word: בִסְדֹם ... בְּתוֹךְ הָעִיר
  choice: 在所多玛城里
  rationale: 将“在所多玛”与后面的“在城中”合并为自然的中文地点表达，同时保留所指为城内。
- source_word: חֲמִשִּׁים צַדִּיקִם
  choice: 五十个义人
  rationale: צַדִּיקִם指公义的人；“义人”是简洁、庄重且不额外限定性别的中文表达。
- source_word: וְנָשָׂאתִי
  choice: 我就……饶过
  rationale: נָשָׂא本义有承担、带走等义，在此语境指不向整个地方施行毁灭性审判；“饶过”清楚表达其语境功能，同时以脚注保留“赦免”的词义可能。
- source_word: לְכָל הַמָּקוֹם
  choice: 整个地方
  rationale: 保留כָּל所表达的整体范围；מָקוֹם在此指面临审判的全地。
- source_word: בַּעֲבוּרָם
  choice: 因他们的缘故
  rationale: 准确表达这些义人构成饶过全地的考量缘由。
theological_decisions:
- issue: 四字神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用上帝的专名；采用较贴近YHWH常见学术重构的中文音译“雅威”，避免以“主”等称号替代。
- issue: וְנָשָׂאתִי在审判语境中的含义
  choice: 饶过
  alternative: 赦免
  rationale: 上下文聚焦所多玛是否免遭毁灭，因此正文用“饶过”最清楚；但该动词也能涉及承担或除去罪责、赦免，故以脚注保留另一译法，不把词义张力完全消除。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。条件句次序贴近原文；“所多玛城里”自然整合原文两处地点说明。脚注标记紧随存在词义选择的“整个地方”之后，覆盖“饶过整个地方”这一译法。
