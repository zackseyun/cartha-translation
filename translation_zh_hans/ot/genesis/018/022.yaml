  text: וַ/יִּפְנ֤וּ מִ/שָּׁם֙ הָֽ/אֲנָשִׁ֔ים וַ/יֵּלְכ֖וּ סְדֹ֑מָ/ה וְ/אַ֨בְרָהָ֔ם עוֹדֶ֥/נּוּ עֹמֵ֖ד לִ/פְנֵ֥י יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/022.yaml
  text: Then the men turned from there and went toward Sodom[a], but Abraham still stood before Yahweh.
translation:
  language: zh_hans
  text: 于是，那些人转身离开那里，往所多玛去了[a]；亚伯拉罕却仍站在耶和华面前。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 一些古代文本见证作：“耶和华仍站在亚伯拉罕面前。”希伯来文马所拉文本作：“亚伯拉罕仍站在耶和华面前。”
    reason: textual_variant
lexical_decisions:
- source_word: וַיִּפְנוּ מִשָּׁם
  choice: 转身离开那里
  rationale: פנה在此叙事语境中表示改变方向并离开当前地点；译作“转身离开那里”自然地表达动作和出发点。
- source_word: הָאֲנָשִׁים
  choice: 那些人
  rationale: 希伯来文表层用词是“人”，虽然上下文暗示他们身份特殊，正文仍不提前作解释；“那些人”也承接前文已出现的人物。
- source_word: וַיֵּלְכוּ סְדֹמָה
  choice: 往所多玛去了
  rationale: הלך表示“去、行走”，地名后的方向词尾表明朝向目的地；“往……去了”在现代汉语中兼顾方向和叙事推进。
- source_word: עוֹדֶנּוּ עֹמֵד
  choice: 仍站着
  rationale: 副词与分词共同表达持续状态；汉语“仍站着”清楚保留这一持续意味。
- source_word: לִפְנֵי
  choice: 在……面前
  rationale: 该介词兼具空间上的“在前面”和处于某者面前的关系意味；此译法保留两者。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文圣经语境中对四字神名最通行、最易辨识的专名译法，而不将其仅译为称号“主”。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 两者都试图在中文中表达四字神名；“耶和华”是普通中文读者最熟悉的专名形式，并与“主”这一称号明确区分。
- issue: 末句的文本形式
  choice: 亚伯拉罕仍站在耶和华面前
  alternative: 耶和华仍站在亚伯拉罕面前
  rationale: 正文依照所给WLC马所拉文本，将亚伯拉罕作为“站着”的主语；古代见证所反映的相反主语次序具有释经和抄传意义，故在脚注中保留，不在正文中消解。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“于是”承接叙事，“却”突出两组人物动作的对照；保留“那些人”的表层称呼以及末句文本异读所形成的神学张力。
