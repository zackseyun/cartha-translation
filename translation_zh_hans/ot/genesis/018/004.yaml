  yaml_path: translation/ot/genesis/018/004.yaml
  text: Please let a little water be brought[a], and wash your feet[b], and rest yourselves under the tree.
translation:
  language: zh_hans
  text: 请让人取一点水来，你们洗洗脚，在树下歇息[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文也可译为“倚靠”或“斜倚”；此处指在树荫下休息。
    reason: lexical_alternative
lexical_decisions:
- source_word: יֻקַּח נָא
  choice: 请让人取……来
  rationale: יֻקַּח是לקח的被动祈使语气形式，נָא表达恳请。译文用“请让人取……来”自然地保留礼貌请求及被动含义。
- source_word: מְעַט מַיִם
  choice: 一点水
  rationale: 直译为少量的水；“一点水”既自然，也保留亚伯拉罕谦逊、克制的款待措辞。
- source_word: וְרַחֲצוּ רַגְלֵיכֶם
  choice: 你们洗洗脚
  rationale: 动词是对多位来客所说的复数命令式；“洗洗脚”在现代汉语中语气温和，符合款待场景。
- source_word: וְהִשָּׁעֲנוּ
  choice: 靠着休息
  rationale: שען的尼法勒命令式基本意象是倚靠、斜倚；结合款待语境，“靠着休息”兼顾词义形象和自然表达。
- source_word: תַּחַת הָעֵץ
  choice: 在树下
  rationale: 定冠词指向现场的一棵特定树；汉语依语境自然译作“在树下”。
