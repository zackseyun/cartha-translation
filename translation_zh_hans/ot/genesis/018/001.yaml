  text: וַ/יֵּרָ֤א אֵלָי/ו֙ יְהוָ֔ה בְּ/אֵלֹנֵ֖י מַמְרֵ֑א וְ/ה֛וּא יֹשֵׁ֥ב פֶּֽתַח הָ/אֹ֖הֶל כְּ/חֹ֥ם הַ/יּֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/001.yaml
  text: And Yahweh appeared to him by the oaks of Mamre[a], while he was sitting at the entrance of the tent in the heat of the day.
translation:
  language: zh_hans
  text: 耶和华在幔利的橡树旁[a]向他显现。那时，他正坐在帐篷门口，正当日头炎热的时候。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“在幔利的笃耨香树旁”。这里的希伯来词可指橡树、笃耨香树一类的大树。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרָא
  choice: 显现
  rationale: 该词是 ראה 的尼法勒式，在此表示可见的显现；“显现”贴近希伯来文，也不额外解释显现的方式。
- source_word: אֵלָיו
  choice: 向他
  rationale: 直接表达介词及第三人称阳性单数后缀；“他”按上文指亚伯拉罕。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代汉语圣经读者熟悉的专名形式表达四字神名，而不以“主”这一称号替代。
- source_word: בְּאֵלֹנֵי
  choice: 在……的橡树那里
  rationale: אֵלוֹן 可指橡树或笃耨香树等大型树木；正文采用自然且传统的“橡树”，并用脚注保留树种上的不确定性。
- source_word: מַמְרֵא
  choice: 幔利
  rationale: 按现代中文圣经惯用形式音译此专名。
- source_word: וְהוּא יֹשֵׁב
  choice: 那时，他正坐着
  rationale: 分词结构交代显现发生时的背景状态；“正”自然传达持续情形。
- source_word: פֶּתַח הָאֹהֶל
  choice: 帐篷门口
  rationale: פֶּתַח 指开口或入口；“帐篷门口”具体、自然，符合现代汉语表达。
- source_word: כְּחֹם הַיּוֹם
  choice: 正值一天炎热的时候
  rationale: 忠实表达白日炎热之时，不把原文进一步限定为正午或一天中最热的具体时段。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用神的专名。正文保留专名而不替换为“主”；“耶和华”是现代中文普通读者最易识别且已固定使用的形式，“雅威”则更接近学界常见的拟音。
- issue: “向他显现”与随后三人出现之间的关系
  choice: 直译为“向他显现”
  alternative: 解释为“亲自向他显现”或预先说明显现方式
  rationale: 本节只宣告耶和华显现，并未在此明确解释这与下一节三人的关系；译文保留叙事张力，不预先作神学判定。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。将希伯来文的长并列句适度分为两句，以清楚呈现场景，同时保留“向他显现”和“正值一天炎热的时候”的具体叙述。
