base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/025.yaml
  text: Far be it from you to do such a thing—to put the righteous to death with the wicked[a], so that the righteous would be like the wicked. Far be it from you! Shall not the Judge of all the earth do justice?
translation:
  language: zh_hans
  text: 你断不可做这样的事，把义人和恶人一同处死，使义人和恶人一样。你断不可如此！全地的审判者，岂不秉行公义吗？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חָלִילָה לְּךָ
  choice: 你绝不至于
  rationale: 这是表达强烈否定与憎恶的惯用语；此译法在现代汉语中自然有力，也保留亚伯拉罕直接而敬畏的劝诉语气。
- source_word: מֵעֲשֹׂת כַּדָּבָר הַזֶּה
  choice: 做这样的事
  rationale: 自然表达介词加不定式在 חָלִילָה 之后的含义，并保留“这样的事”的指称。
- source_word: לְהָמִית
  choice: 处死
  rationale: 该词是 מות 的使役形，意为使人死亡；“处死”既体现使役含义，也符合本节审判语境。
- source_word: צַדִּיק עִם־רָשָׁע
  choice: 义人和恶人一同
  rationale: 保留义人与恶人的道德及司法对比；希伯来语单数在此具有类别性的概括意义。
- source_word: וְהָיָה כַצַּדִּיק כָּרָשָׁע
  choice: 使义人和恶人一样
  rationale: 保留原文比较结构及其简洁性，不额外限定“一样”具体是指命运、待遇还是结局。
- source_word: הֲשֹׁפֵט כָּל־הָאָרֶץ
  choice: 审判全地的那一位
  rationale: 将分词的名词性用法自然译出，同时避免添加原文没有的称号；“全地”保留 כָּל־הָאָרֶץ 的广泛范围。
- source_word: מִשְׁפָּט
  choice: 公义
  rationale: 在“施行/秉行 משפט”的搭配和本节司法伦理语境中，所指不仅是作出判决，更是按正义行事。
theological_decisions:
- issue: 亚伯拉罕对上帝公正品格的反问
  choice: 审判全地的那一位，岂会不秉行公义呢？
  alternative: 审判全地的那一位，岂不施行审判吗？
  rationale: 原文反问预期肯定回答，并以审判者的身份诉诸上帝的公正品格。“秉行公义”兼顾司法与伦理含义，也不削弱亚伯拉罕言辞的大胆力度。
- issue: 义人与恶人“成为一样”的具体含义
  choice: 使义人和恶人一样
  alternative: 使义人和恶人同受待遇
  rationale: 原文只作比较，并未明说是身份、待遇还是结局相同；采用较开放的表达，以保留原文的含蓄和张力。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。“你绝不至于”两次重复，重现原文的强烈抗议；末句使用自然的反问句式，保留其预期肯定回答的修辞力量。
