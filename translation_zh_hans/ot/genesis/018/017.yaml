  text: וַֽ/יהֹוָ֖ה אָמָ֑ר הַֽ/מְכַסֶּ֤ה אֲנִי֙ מֵֽ/אַבְרָהָ֔ם אֲשֶׁ֖ר אֲנִ֥י עֹשֶֽׂה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/017.yaml
  text: And Yahweh said[a], “Shall I hide from Abraham what I am doing?”
translation:
  language: zh_hans
  text: 雅威说：“我要做的事，岂可瞒着亚伯拉罕呢？”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较直译：“我正在做的事，难道要瞒着亚伯拉罕吗？”
    reason: 保留疑问分词结构及עֹשֶׂה的进行意义这一可能译法。
lexical_decisions:
- source_word: וַֽ/יהֹוָה
  choice: 雅威
  rationale: 以常见的中文音译呈现四字神名，保留原文直接使用上帝圣名的特点。
- source_word: אָמָר
  choice: 说
  rationale: wayyiqtol形式推进叙事，现代汉语用简单的“说”即可，无须译成过去完成意义。
- source_word: הַֽ/מְכַסֶּה אֲנִי
  choice: 岂可瞒着……呢
  rationale: 疑问词与分词构成自问式、商议式的反问；“岂可……呢”自然传达其修辞力量，同时不把问题改成直陈句。
- source_word: מֵֽ/אַבְרָהָם
  choice: 瞒着亚伯拉罕
  rationale: 介词מִן与“隐藏”连用，汉语自然表达为“瞒着某人”，即不让亚伯拉罕知道。
- source_word: אֲשֶׁר אֲנִי עֹשֶׂה
  choice: 我要做的事
  rationale: 分词עֹשֶׂה字面可指“正在做”，但在本段语境中所指行动尚待施行；“要做”自然表达临近或意向中的行动，并以脚注保留更贴近形式的译法。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接出现四字神名；音译“雅威”保留其专名性质，避免以称号替代，也不把后期汉语传统读音当作唯一形式。
- issue: 神是否已在施行所说之事
  choice: 我要做的事
  alternative: 我正在做的事
  rationale: 上下文支持将分词理解为即将施行的行动，但希伯来语形式本身也可按进行意义理解；正文采用自然的前瞻表达，脚注保留形式上更直译的可能。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“岂可……呢”适合神自问式的修辞语气；句式简洁，普通读者易懂。
