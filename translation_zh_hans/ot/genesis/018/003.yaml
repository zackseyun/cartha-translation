source:
  edition: WLC
  text: וַ/יֹּאמַ֑ר אֲדֹנָ֗/י אִם נָ֨א מָצָ֤אתִי חֵן֙ בְּ/עֵינֶ֔י/ךָ אַל נָ֥א תַעֲבֹ֖ר מֵ/עַ֥ל עַבְדֶּֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/003.yaml
  text: And he said[a], “My lord, if I have found favor in your eyes, please do not pass by your servant.”
translation:
  language: zh_hans
  text: 他说：“我主[a]，我若在你眼前蒙恩，求你不要从你仆人身边走过去。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“主”或“上主”，即把亚伯拉罕这句话理解为直接对上主说的，而不是对来客的尊称。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמַר
  choice: 他说
  rationale: 以现代汉语常用的叙事承接方式引出亚伯拉罕的话；不额外强化先后关系。
- source_word: אֲדֹנָי
  choice: 我主
  rationale: 保留对尊贵者的恭敬称呼，也保留此处可能是直接称呼上主的歧义；比“先生”庄重，又不像“主”那样在正文中先行判定其神圣称号。
- source_word: אִם נָא
  choice: 我若
  rationale: אִם引出礼貌请求的条件句；נָא所含的恳求语气在后面的“求你”中自然表达，避免汉语重复。
- source_word: מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: 在你眼前蒙恩
  rationale: 保留希伯来语“在……眼前”的意象，并以现代中文圣经语体中仍清楚自然的“蒙恩”表达受到恩待或悦纳，不将其限定为特定教义含义。
- source_word: אַל נָא
  choice: 求你不要
  rationale: 同时表达否定请求和נָא的恳切、谦恭语气。
- source_word: תַעֲבֹר מֵעַל
  choice: 从……这里经过
  rationale: 表达继续走过、不停留之意；与“你仆人这里”组合后符合汉语表达。
- source_word: עַבְדֶּךָ
  choice: 你仆人
  rationale: 这是面对尊贵来客时谦恭的自称；“仆人”比“奴隶”更符合本节所突出的礼貌语境。
theological_decisions:
- issue: אֲדֹנָי是对来客的尊称，还是对上主的称呼
  choice: 正文译作“我主”
  alternative: “主”或“上主”
  rationale: 创世记18章整体明确涉及上主向亚伯拉罕显现，但本节话语直接面向来客中的单数对象，既可理解为尊称，也可理解为对上主的称呼。正文采用“我主”并以脚注列出神圣称号的理解，以保留原文的诠释张力。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“我主”“在你眼前蒙恩”“你仆人”保留原文的恭敬和古代待客语境，但句法按现代汉语整理。脚注标记[a]已置于正文对应词后。
