base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/015.yaml
  text: But Sarah denied it[a], saying, “I did not laugh,” because she was afraid. But he said, “No[b], but you did laugh.”
translation:
  language: zh_hans
  text: 撒拉却因害怕，便否认说：“我没有笑。”他[b]却说：“不，你的确笑了。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 本分句没有明确写出说话者的名字；根据上下文，这位说话者是耶和华。
    reason: alternative_reading
lexical_decisions:
- source_word: וַתְּכַחֵשׁ
  choice: 却否认
  rationale: כחשׁ 的这个词形可表示否认，也可含虚假之意；此处直接指撒拉否认自己笑过。正文用“否认”自然且不过度强化道德判断，脚注保留“说谎”的可能含义。
- source_word: לֵאמֹר
  choice: 说
  rationale: 这是引出直接引语的常用引语形式；现代汉语叙事中译作“说”简洁自然。
- source_word: לֹא צָחַקְתִּי
  choice: 我没有笑
  rationale: 直接对应否定词与第一人称单数完成式，准确表达撒拉否认已经发生的笑。
- source_word: כִּי יָרֵאָה
  choice: 因为她害怕
  rationale: כִּי 在此说明撒拉否认的原因，译为“因为”清楚保留因果关系。
- source_word: וַיֹּאמֶר
  choice: 他却说
  rationale: 动词推进叙事；“却”自然表现对撒拉否认的反驳，同时不在正文中补出原句未重述的说话者身份。
- source_word: לֹא כִּי צָחָקְתְּ
  choice: 不，你的确笑了
  rationale: 开头的 לֹא 驳回撒拉的话，כִּי 在此带反驳和强调意味；“的确”传达希伯来语中肯定其已经笑过的语气。
theological_decisions:
- issue: וַיֹּאמֶר 的说话者身份
  choice: 正文译作“他却说”，不直接补作“耶和华说”
  alternative: “耶和华却说”或“其中一人却说”
  rationale: 本分句只有未明说主语的阳性单数动词。上下文把说话者与耶和华联系起来，但本节此处没有再次点名；保留代词可避免加入原句没有明说的具体身份，同时让上下文作出辨识。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“却”突出否认与纠正之间的转折；“的确”表达反驳中的强调。脚注标记均置于正文相关位置。
