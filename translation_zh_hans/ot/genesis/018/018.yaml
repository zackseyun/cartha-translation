revisions:
- from: 亚伯拉罕必定会成为一个强盛的大国；地上万国都必在他里面蒙福。[a]
  to: 亚伯拉罕必定会成为一个伟大而强盛的国；地上的万国都必因他蒙福。[a]
  rationale: 修订使“伟大”和“强盛”分别得到表达，改善介词短语在现代汉语中的自然度，并校正脚注对反身性备选读法的说明。正文仍采用被动理解，脚注保留原文尼法勒形式可能具有的反身性含义，未将争议消解为单一神学解释。
