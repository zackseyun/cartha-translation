  text: וְ/אַ֨בְרָהָ֔ם הָי֧וֹ יִֽהְיֶ֛ה לְ/ג֥וֹי גָּד֖וֹל וְ/עָצ֑וּם וְ/נִ֨בְרְכוּ ב֔/וֹ כֹּ֖ל גּוֹיֵ֥י הָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/018.yaml
  text: Abraham will surely become a great and mighty nation[a], and all the nations of the earth will be blessed in him.
translation:
  language: zh_hans
  text: 亚伯拉罕必定会成为一个伟大而强盛的国；地上的万国都必因他蒙福。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“地上的万国都必以他为自己祝福。”希伯来文形式也可这样理解；正文则按被动意义译为“因他蒙福”。
    reason: alternative_reading
lexical_decisions:
- source_word: הָיוֹ יִהְיֶה
  choice: 必定会成为
  rationale: 不定式绝对式与未完成式连用，加强语气；“必定会”兼顾将来与强调，“成为”也自然衔接 לְגוֹי 的表语结构。
- source_word: לְגוֹי גָּדוֹל וְעָצוּם
  choice: 成为一个强盛的大国
  rationale: גוי 译作“国”，符合创世记应许语境；גדול 与 עצום 合起来既涉及规模，也涉及力量。“强盛的大国”是自然、庄重的现代汉语，并保留两词的综合力度。
- source_word: וְנִבְרְכוּ
  choice: 都必……蒙福
  rationale: 尼法勒形式可理解为被动，表示万国领受福分；“蒙福”简洁而符合现代中文圣经语体。该形式也可能有反身意义，另在脚注保留。
- source_word: בּוֹ
  choice: 在他里面
  rationale: 直译介词 ב，保留“在亚伯拉罕里面／与他相关联”的表达，不扩展为解释性更强的“借着他”。
- source_word: כֹּל גּוֹיֵי הָאָרֶץ
  choice: 地上万国
  rationale: 这是创世记中表示普世范围的惯用表达；“地上万国”自然凝练，并与前面的 גוי 保持“国”的词汇对应。
theological_decisions:
- issue: 亚伯拉罕应许中祝福公式的解释
  choice: 万国在亚伯拉罕里面领受祝福（“蒙福”）
  alternative: 万国以亚伯拉罕为祝福的范例而“彼此祝福／为自己求福”
  rationale: ברך 的尼法勒形式在族长应许经文中可作被动，也可能作反身理解。正文采用语境上可信且清楚的被动译法，同时以脚注保留反身读法，避免消除原文的真实歧义。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“必定会”表达希伯来文的强调结构；“强盛的大国”避免生硬并兼顾规模与力量；脚注保留祝福动词可能的反身含义。
