base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/008.yaml
  text: Then he took curds and milk and the calf that he had prepared[a], and set it before them[b]. He stood by them under the tree while they ate.
translation:
  language: zh_hans
  text: 亚伯拉罕拿了凝乳[a]和奶，又拿了那只他预备好的牛犊，摆在他们面前。他在树下侍立在他们旁边[b]，他们就吃了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“奶油”或“黄油”；希伯来语所指的是一种浓稠乳制品，按语境可指凝乳、奶油或黄油。
    reason: lexical_alternative
  - marker: b
    text: 原文直译“站在他们上方”；这里很可能是指他以主人身份站在旁边侍候他们。
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶמְאָה
  choice: 凝乳
  rationale: 该词泛指较浓稠的乳制品，在游牧生活背景下可能是凝乳、奶油或黄油；“凝乳”既贴近语境，也避免使人联想到现代餐桌黄油。
- source_word: חָלָב
  choice: 奶
  rationale: 这是常用的“奶、乳”一词；此处译作自然简洁的“奶”。
- source_word: וּבֶן הַבָּקָר
  choice: 那只牛犊
  rationale: 字面为“牛群之子”，即幼牛；定冠词指向上一节已经选出并预备的那只牛犊。
- source_word: אֲשֶׁר עָשָׂה
  choice: 已经预备好的
  rationale: עָשָׂה本义宽泛，可指“做、制作”；用于食物时，“预备好”准确表达烹调完成之意。
- source_word: וַיִּתֵּן לִפְנֵיהֶם
  choice: 摆在他们面前
  rationale: 字面为“放／给在他们面前”，在设食款待的语境中译作“摆在他们面前”自然且准确。
- source_word: וְהוּא עֹמֵד עֲלֵיהֶם
  choice: 他……站在他们旁边伺候
  rationale: עַל字面可表示“在……上方”，但此处描写主人站在客人身旁照料用餐；加入“伺候”明确其款待功能，同时以脚注保留原文空间表达。
- source_word: תַּחַת הָעֵץ
  choice: 在树下
  rationale: 直接、自然地对应原文介词短语。
- source_word: וַיֹּאכֵלוּ
  choice: 他们就吃了
  rationale: 保留叙事推进的并列结构；“就”自然承接摆上食物及亚伯拉罕侍立的情景，不必改写为时间从句。
theological_decisions:
- issue: 是否借本节访客的身份暗示后来的基督论或三一论解释
  choice: 按普通叙事语言翻译亚伯拉罕款待访客的场景，不额外标示访客的神圣身份。
  alternative: 采用带有尊崇意味的措辞，借此突出访客的神圣身份。
  rationale: 本节明说的是亚伯拉罕摆上食物、在旁伺候以及访客进食；译文不应把本节未明说的后续神学判断加入正文。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“凝乳”保留古代游牧饮食特色；“摆在他们面前”和“站在他们旁边伺候”符合现代汉语表达。所有脚注标记均已置于正文相应位置。
