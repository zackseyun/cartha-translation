  text: א֠וּלַי יַחְסְר֞וּ/ן חֲמִשִּׁ֤ים הַ/צַּדִּיקִם֙ חֲמִשָּׁ֔ה הֲ/תַשְׁחִ֥ית בַּ/חֲמִשָּׁ֖ה אֶת כָּל הָ/עִ֑יר וַ/יֹּ֨אמֶר֙ לֹ֣א אַשְׁחִ֔ית אִם אֶמְצָ֣א שָׁ֔ם אַרְבָּעִ֖ים וַ/חֲמִשָּֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/028.yaml
  text: Suppose five of the fifty righteous are lacking—will you destroy the whole city for five? And he said[c][b][a], “I will not destroy it if I find forty-five there.”
translation:
  language: zh_hans
  text: 假如五十个义人少了五个，你会因为少了这五个，就毁灭整座城吗？他说：“如果我在那里找到四十五个，我就不毁灭那城。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אוּלַי
  choice: 假如
  rationale: 引出亚伯拉罕试探性的假设问句；“假如”在现代汉语对话中自然，也保留其不确定和条件意味。
- source_word: יַחְסְרוּן חֲמִשִּׁים הַצַּדִּיקִם חֲמִשָּׁה
  choice: 五十个义人少了五个
  rationale: 按希伯来语的数量亏缺结构，表达原定五十之数短少五个；避免误解为五个特定的人从一个固定群体中失踪。
- source_word: הַצַּדִּיקִם
  choice: 义人
  rationale: 保留צדיק在本段中的道德和司法含义，也是现代中文圣经语体中清楚而凝练的对应词。
- source_word: הֲתַשְׁחִית
  choice: 你会……毁灭
  rationale: שחת的使役形在此表示毁灭；与下文神的回答使用同一词根相呼应。
- source_word: בַּחֲמִשָּׁה
  choice: 因为少了这五个
  rationale: 介词ב在这里表示原因或缘故；补出“少了”使中文明确指向人数的亏缺，而不是因五个义人的存在而毁城。
- source_word: אֶת כָּל הָעִיר
  choice: 整座城
  rationale: 自然表达城市整体，保留כָּל所强调的全部范围。
- source_word: לֹא אַשְׁחִית
  choice: 我就不毁灭那城
  rationale: 重复“毁灭”以保留原文问答间的词语呼应；“那城”补明希伯来语中省略而由语境确定的宾语。
- source_word: אִם אֶמְצָא שָׁם אַרְבָּעִים וַחֲמִשָּׁה
  choice: 如果我在那里找到四十五个
  rationale: 保留条件结构和地点副词“在那里”；“四十五个”按汉语习惯表达人数，所指义人由上文可明。
theological_decisions:
- issue: צַדִּיקִים的译法
  choice: 义人
  alternative: 正直的人；公义的人
  rationale: “义人”既保留该词的道德与司法分量，也不把其意义限定为单一教义范畴；在本段关于义人与恶人命运的论辩中前后一致。
- issue: 毁城原因的表达
  choice: 因为少了这五个
  alternative: 为了五个；因这五个
  rationale: 原文בַּחֲמִשָּׁה可简译为“因五个”，但中文容易误解为因五名义人本身而毁城；补出“少了”明确其所指是未满五十的差额，不改变论证。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。保留亚伯拉罕的假设性追问及问答中“毁灭”的词根重复；不另加称谓或解释，以维持原文简洁而紧张的交涉语气。
