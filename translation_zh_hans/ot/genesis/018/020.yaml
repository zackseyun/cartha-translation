  text: וַ/יֹּ֣אמֶר יְהוָ֔ה זַעֲקַ֛ת סְדֹ֥ם וַ/עֲמֹרָ֖ה כִּי רָ֑בָּה וְ/חַ֨טָּאתָ֔/ם כִּ֥י כָבְדָ֖ה מְאֹֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/020.yaml
  text: Then Yahweh said[a], “The outcry against Sodom and Gomorrah is great[b], and their sin is very severe.”
translation:
  language: zh_hans
  text: 于是，雅威说：“针对所多玛和蛾摩拉的呼声实在很大[a]，他们的罪极其严重[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“所多玛和蛾摩拉的呼声实在很大。”希伯来文可较直译为这样；正文依据上下文明确表达这呼声是针对两城而发的。
    reason: lexical_alternative
  - marker: b
    text: 或译：“他们的罪非常沉重。”希伯来文直译为“非常沉重”，这是表示罪情极其严重的说法。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 于是……说
  rationale: 连续式叙事动词推动情节向前；“于是”在现代汉语中自然地表达承接关系。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文直接音译上帝的专名，不以称号替代。
- source_word: זַעֲקַת סְדֹם וַעֲמֹרָה
  choice: 针对所多玛和蛾摩拉的呼声
  rationale: זְעָקָה 指因严重恶行或压迫而发出的呼喊；结合语境，“针对”表明呼声关乎并指控这两座城，同时以脚注保留希伯来文属格结构的歧义。
- source_word: כִּי רָבָּה
  choice: 实在很大
  rationale: רבה 描写呼声的重大或强烈；此处 כי 可自然理解为强调或引出所宣告的事实，“实在”符合汉语表达。
- source_word: וְחַטָּאתָם
  choice: 他们的罪
  rationale: חַטָּאת 在此指罪恶；单数形式配复数后缀，可集合性地概括居民的恶行。
- source_word: כִּי כָבְדָה מְאֹד
  choice: 实在极其严重
  rationale: כבד 字面为“沉重”，在道德和审判语境中表示情节重大；“极其严重”清楚传达其惯用意义，并由脚注说明字面意象。
theological_decisions:
- issue: 如何译写神名 יְהוָה
  choice: 雅威
  alternative: 耶和华
  rationale: 原文使用四字神名；“雅威”较直接地音译通常重构的读音，并保留其作为专名的性质，而不以“主”等称号替代。
- issue: 呼声与所多玛、蛾摩拉之间的关系
  choice: 针对所多玛和蛾摩拉的呼声
  alternative: 所多玛和蛾摩拉的呼声
  rationale: 上下文倾向于指因两城罪恶而发、在上帝面前控告它们的呼声；但希伯来文属格本身可较直译为“两城的呼声”，故在脚注保留这一真实歧义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“呼声”保留 זְעָקָה 的呼喊意象；“针对”阐明上下文关系但不写成更具司法色彩的“控诉”。“极其严重”传达 כבד 的惯用意义，脚注则保留“沉重”的原文比喻。
