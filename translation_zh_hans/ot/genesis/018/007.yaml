  text: And Abraham ran to the herd and took a tender and good calf and gave it to the young man[a], and he hurried to prepare it.
translation:
  language: zh_hans
  text: 亚伯拉罕跑到牛群那里，取了一头又嫩又好的牛犊，交给那年轻人[a]；那年轻人赶快把它预备好。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “年轻人”也可译作“仆人”或“少年”；希伯来语 הַנַּעַר 可按语境指年轻男子、少年或仆人。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבָּקָר
  choice: 牛群
  rationale: 此处指作为一个整体的牛群；“牛群”自然准确，也符合亚伯拉罕从中挑选一头牛犊的场景。
- source_word: רָץ
  choice: 跑
  rationale: 该动词直接表示奔跑；“跑”保留叙事的生动感和殷勤款待的急切。
- source_word: בֶּן־בָּקָר
  choice: 一头牛犊
  rationale: 该短语字面为“牛之子”，惯指幼牛；“牛犊”是现代汉语中清楚自然的表达。
- source_word: רַךְ וָטוֹב
  choice: 又嫩又好
  rationale: 分别保留“嫩”和“好”的基本意义，以自然汉语表达这头牛犊肉嫩、品质上佳。
- source_word: הַנַּעַר
  choice: 那年轻人
  rationale: נַעַר 可指少年、年轻人，也可按身份指仆人；正文采用较少解释性的“年轻人”，保留词义弹性。
- source_word: וַיְמַהֵר
  choice: 他就赶快
  rationale: 该动词表示迅速行动；“赶快”自然呈现叙事对殷勤和速度的强调。
- source_word: לַעֲשׂוֹת אֹתוֹ
  choice: 把牛犊预备好
  rationale: עשה 在备餐语境中意为处理、预备食物；补明宾语为牛犊，可避免汉语代词所指不清。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“挑了”体现从牛群中选取之意；分号区分亚伯拉罕交付牛犊与年轻人迅速预备牛犊这两个连续动作，并按希伯来语最自然的主语转换理解末句。
