  to: 因为我已经认识他[a]，为要使他吩咐自己的儿子和在他之后的家人遵行耶和华的道，施行公义和公平[b]，好叫耶和华把他论到亚伯拉罕所说的事成就在亚伯拉罕身上。[c]
