  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּ֣י יְדַעְתִּ֗י/ו לְמַעַן֩ אֲשֶׁ֨ר יְצַוֶּ֜ה אֶת בָּנָ֤י/ו וְ/אֶת בֵּית/וֹ֙ אַחֲרָ֔י/ו וְ/שָֽׁמְרוּ֙ דֶּ֣רֶךְ יְהוָ֔ה לַ/עֲשׂ֥וֹת צְדָקָ֖ה וּ/מִשְׁפָּ֑ט לְמַ֗עַן הָבִ֤יא יְהוָה֙ עַל אַבְרָהָ֔ם אֵ֥ת אֲשֶׁר דִּבֶּ֖ר עָלָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/019.yaml
  text: For I have known him[a], so that he may command his children and his household after him, and they may keep the way of Yahweh by doing righteousness and justice[d][c][b], so that Yahweh may bring upon Abraham what he has spoken concerning him.
translation:
  language: zh_hans
  text: 因为我已经认识他[a]，为要使他吩咐自己的儿子和在他之后的家人遵行耶和华的道，施行公义和公平[b]，好叫耶和华把他论到亚伯拉罕所说的事成就在亚伯拉罕身上。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为我已经拣选他。”希伯来语动词通常意为“认识”，在这里也可含有特别眷顾或拣选的意思。
    reason: alternative_reading
  - marker: b
    text: “公义和公平”指按耶和华所要求的方式生活，为人正直，秉公行事。
    reason: cultural_note
  - marker: c
    text: 原文直译：“好叫耶和华使他论到亚伯拉罕所说的临到亚伯拉罕。”也可理解为：“好叫耶和华向亚伯拉罕成就他所应许的。”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文并说明理由，保留原文的解释性语气。
- source_word: יְדַעְתִּיו
  choice: 我已经认识他
  rationale: ידע的基本义是“认识、知道”；这里可能含有特别眷顾或拣选的意味，但正文保留其词面表达，不消解其神学张力。
- source_word: לְמַעַן אֲשֶׁר
  choice: 为要使
  rationale: 表达目的，并自然引出亚伯拉罕将要吩咐家人的行动。
- source_word: יְצַוֶּה
  choice: 吩咐
  rationale: 保留צוה的权威性，同时符合现代汉语叙事语体。
- source_word: בָּנָיו
  choice: 自己的儿子
  rationale: 原文为阳性复数“他的儿子们”；此处按形式准确译出，不以中性化表达取代。
- source_word: בֵּיתוֹ אַחֲרָיו
  choice: 后代的家人
  rationale: בית指家庭或家中成员；אַחֲרָיו在此与传承有关，意为在他之后。合译使现代读者清楚这是后世家族，而非房屋。
- source_word: וְשָׁמְרוּ
  choice: 遵行
  rationale: שמר与“道”搭配时表示谨守并依从；“遵行”比字面的“守住”更自然。
- source_word: דֶּרֶךְ יְהוָה
  choice: 耶和华的道
  rationale: “道”保留生活道路和行为方式的隐喻；神名采用现代中文通行的音译“耶和华”。
- source_word: לַעֲשׂוֹת צְדָקָה וּמִשְׁפָּט
  choice: 施行公义和公平
  rationale: 不定式说明如何遵行耶和华的道；分别保留צדקה的正直、公义与משפט的公平、公正含义。
- source_word: הָבִיא יְהוָה עַל אַבְרָהָם
  choice: 耶和华把……成就在他身上
  rationale: 原文直译为“使……临到亚伯拉罕”；中文以“成就在他身上”自然表达所说之事实现于他。
- source_word: אֲשֶׁר דִּבֶּר עָלָיו
  choice: 他论到亚伯拉罕所说的
  rationale: 保留דבר的“说”以及עליו的“论到他”，不直接改译为“应许”，以免把语义进一步限定。
theological_decisions:
- issue: ידע是否应直接译为带拣选意味的词
  choice: 我已经认识他
  alternative: 我已经拣选他
  rationale: 上下文中的确包含神特别看顾并赋予使命的意味，但动词本身是“认识”。正文保留原词，脚注列出合乎语境的解释性译法。
- issue: “耶和华的道”的伦理内涵
  choice: 保留“道”的隐喻，并由后面的“施行公义和公平”具体说明
  alternative: 耶和华所要求的生活方式
  rationale: 原文以“道路”表达合乎神旨意的生活，正文保留这一重要圣经隐喻，不将其完全释义化。
- issue: אֲשֶׁר דִּבֶּר עָלָיו是“所说的”还是“所应许的”
  choice: 他论到亚伯拉罕所说的
  alternative: 他向亚伯拉罕所应许的
  rationale: “应许”符合上下文，却比原文的“说”更具解释性；正文保留较宽泛的原文措辞。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“认识”保留原文可能兼具关系与拣选意味的张力；“自己的儿子和后代的家人”明确בניו的阳性形式及家族延续范围；整体避免古奥虚词，同时保留“耶和华的道”“公义和公平”等核心圣经表达。
