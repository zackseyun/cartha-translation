base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/012.yaml
  text: So Sarah laughed to herself[a], saying, “After I am worn out, shall I have pleasure, while my lord is old?”
translation:
  language: zh_hans
  text: 撒拉心里笑了，说：“我已经衰老，我主也老了，我还能有欢愉吗？”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “欢愉”也可理解为夫妻生活的欢愉，或身体重新焕发青春活力。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּצְחַק
  choice: 暗笑
  rationale: צחק在此指“笑”；结合בקרבה“在她里面”，译作“心里暗笑”自然地表达没有说出口的内在反应，并不额外解释为讥笑。
- source_word: בְּקִרְבָּהּ
  choice: 心里
  rationale: 字面为“在她里面”。现代汉语用“心里”简洁保留其内在、未出声的含义。
- source_word: לֵאמֹר
  choice: 说
  rationale: 该不定式引出直接引语；内在言说已由“心里暗笑”体现，无须重复译为“对自己说”。
- source_word: אַחֲרֵי בְלֹתִי
  choice: 我已经衰老
  rationale: בלה有磨损、衰残之意。这里指撒拉身体已经衰老；“衰老”比单纯“老了”更能体现原词的耗损感，又符合庄重自然的现代汉语。
- source_word: הָיְתָה לִּי עֶדְנָה
  choice: 我还能有欢愉吗
  rationale: 原句是字面近于“我会有欢愉吗”。加入“还”承接衰老语境；“欢愉”保留עֶדְנָה的宽泛意义，不把它限定为性快感或恢复青春活力。
- source_word: עֶדְנָה
  choice: 欢愉
  rationale: 该罕见名词可指愉悦，并可能带有夫妻生活、身体复苏或生育能力恢复的意味。“欢愉”保持这种语义开放性。
- source_word: וַאדֹנִי
  choice: 我主
  rationale: 此处是撒拉对亚伯拉罕的敬称，不是神的称号。“我主”保留称谓的尊敬语气；不写作“主”之外的神圣专名形式。
- source_word: זָקֵן
  choice: 老了
  rationale: 直接表达谓语“年老”。与前面的“衰老”略作区分，也符合原文分别描述撒拉身体衰残和亚伯拉罕年老的措辞。
theological_decisions:
- issue: עֶדְנָה在撒拉话中的具体含义
  choice: 正文采用宽泛的“欢愉”
  alternative: “闺房之乐”“性快感”或“恢复青春活力”
  rationale: 上下文使该词很可能含有身体、夫妻生活和生育方面的意味，但希伯来文本没有将其限定为其中某一种。正文保留含混性，脚注提示可能的具体内涵。
- issue: וַאדֹנִי所指的身份
  choice: 译为指向亚伯拉罕的敬称“我主”
  alternative: “我丈夫”或容易被理解为神称号的“我的主”
  rationale: 第一人称后缀和上下文表明撒拉是在尊称亚伯拉罕。译文保留原有社会称谓，不将其神学化，也不以关系称谓取代原词。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“心里暗笑”传达内在反应；问句依照汉语习惯调整分句次序，将撒拉与亚伯拉罕的年老共同置于反问背景中。脚注标记[a]已在正文相应位置出现。
