revisions:
- from: 因为我确实是从希伯来人之地被掳来的[a]；即使在这里，我也没有做过什么，竟使他们把我关进牢坑[b]。
  to: 因为我确实是从希伯来人之地被掳来的[a]；而且在这里，我也没有做过任何会使人把我关进这坑里的事[b]。
  rationale: 修订“即使”为“而且”，以对应原文的附加语气；重述末句，使其自然、明确地表达约瑟没有作任何足以导致自己被囚之事；并以“这坑里”保留原文的具体意象和定指。脚注锚点仍分别紧随“被掳来的”和“这坑里”。
