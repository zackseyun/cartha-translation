base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/015.yaml
  text: For I was indeed kidnapped from the land of the Hebrews[b][a], and even here I have done nothing that they should put me in the pit.
translation:
  language: zh_hans
  text: 因为我确实是从希伯来人之地被掳来的[a]；而且在这里，我也没有做过任何会使人把我关进这坑里的事[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我确实是从希伯来人之地被偷走的。”希伯来文以不定式绝对形与限定动词连用，加强语气。
    reason: lexical_alternative
  - marker: b
    text: “坑”原文可指坑或蓄水池；在这里按语境指囚禁人的地牢或牢房。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接约瑟请求酒政记念他的理由，表达解释兼因果关系。
- source_word: גֻנֹּב גֻּנַּבְתִּי
  choice: 我确实是……被掳来的
  rationale: 以“确实”体现不定式绝对形与限定动词连用的强调；“被掳来”自然表达一个人被强行带走，同时在脚注保留“被偷走”的字面形象。
- source_word: מֵאֶרֶץ הָעִבְרִים
  choice: 从希伯来人之地
  rationale: 保留民族称谓及原文领属结构，不把此处过度明确为具有固定疆界的政治实体。
- source_word: וְגַם פֹּה
  choice: 即使在这里……也
  rationale: 用现代汉语关联结构表达附加和强调：约瑟不仅被掳，在埃及也没有犯罪。
- source_word: לֹא עָשִׂיתִי מְאוּמָה
  choice: 我也没有做过什么
  rationale: 自然表达原文对任何不当行为的全面否认。
- source_word: כִּי שָׂמוּ אֹתִי
  choice: 竟使他们把我关进
  rationale: 表达前句“没有做过什么”与遭囚禁之间缺乏正当缘由；“竟”凸显无辜受囚的不相称，但不补入具体罪名。
- source_word: בַּבּוֹר
  choice: 牢坑
  rationale: 兼顾 בּוֹר 的“坑”这一具体意象和本段监禁处所的语境含义，并与普通“监牢”有所区分。
