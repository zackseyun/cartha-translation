base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/010.yaml
  text: and on the vine were three branches[a]. As it was budding, its blossoms came up[b], and its clusters ripened into grapes.
translation:
  language: zh_hans
  text: 葡萄树上有三根枝条[a]。它正在发芽时，花就开了[b]，一串串葡萄也成熟了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “枝条”也可译作“嫩枝”或“蔓梢”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译为“它正在萌发，它的花上来了”；这句话描写葡萄树从发芽到开花的迅速过程。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַגֶּפֶן
  choice: 葡萄树上
  rationale: 介词 בְּ 与定冠词连用；按枝条长在葡萄树上的自然汉语表达译为“葡萄树上”，句首连接词可由上下文承接，无须机械译出。
- source_word: שְׁלֹשָׁה שָׂרִיגִם
  choice: 三根枝条
  rationale: שָׂרִיגִים 指葡萄树的枝条或新梢；“枝条”通俗准确，并保留“嫩枝、蔓梢”等词义可能，列于脚注。
- source_word: כְפֹרַחַת
  choice: 正在发芽时
  rationale: כְּ 加分词描写生长阶段及过程，可理解为“当它萌发时”；译文用“正在……时”保留进行和时间意味。
- source_word: עָלְתָה נִצָּהּ
  choice: 花就开了
  rationale: 字面为“它的花上来了”，表示花朵出现、开放；“花就开了”符合现代汉语，并以“就”呈现梦中迅速推进的生长过程。
- source_word: הִבְשִׁילוּ אַשְׁכְּלֹתֶיהָ עֲנָבִים
  choice: 一串串葡萄也成熟了
  rationale: 希伯来文描写树上的果串成熟为葡萄；现代汉语以“一串串葡萄成熟了”自然传达 אַשְׁכְּלוֹת（果串）及 עֲנָבִים（葡萄），同时避免生硬直译。
