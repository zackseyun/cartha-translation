  to: 于是，司酒长把他的梦讲给约瑟听，对他说：“在我的梦中，看哪，我面前有一棵葡萄树。”
  rationale: 修订在不改变原意和自然汉语表达的前提下，于正文保留 וְהִנֵּה 的显著提示功能，并以“在我的梦中”较直接反映 בַּחֲלוֹמִי。脚注改为提供省略提示词后的平实汉语替代表达，并说明原文的修辞作用。
