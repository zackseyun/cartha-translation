  yaml_path: translation/ot/genesis/040/009.yaml
  text: So the chief cupbearer told his dream to Joseph and said to him[a], “In my dream, behold, a vine was before me.”
translation:
  language: zh_hans
  text: 于是，司酒长把他的梦讲给约瑟听，对他说：“在我的梦中，看哪，我面前有一棵葡萄树。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְסַפֵּר
  choice: 讲给……听
  rationale: ספר的 piel 词干在此表示讲述、叙说；这一表达自然地体现了向约瑟讲梦的间接宾语结构。
- source_word: שַׂר הַמַּשְׁקִים
  choice: 司酒长
  rationale: 该组合词指负责君王饮品的高级官员；“司酒长”既简洁，又能体现其官职及主管身份。
- source_word: אֶת חֲלֹמוֹ
  choice: 他的梦
  rationale: 宾格标记后接带第三人称阳性单数后缀的“梦”，直译为“他的梦”。
- source_word: לְיוֹסֵף
  choice: 给约瑟听
  rationale: 介词ל在此标明讲述的对象；与“讲”搭配译为“给约瑟听”符合现代汉语习惯。
- source_word: וַיֹּאמֶר לוֹ
  choice: 对他说
  rationale: 保留原文明确出现的“对他”，其中“他”指约瑟。
- source_word: בַּחֲלוֹמִי
  choice: 我梦见
  rationale: 原义为“在我的梦中”；结合后面的梦中景象，译作“我梦见”是自然、准确的现代汉语表达。
- source_word: וְהִנֵּה
  choice: 就
  rationale: הִנֵּה用于引人注意并生动呈现突然出现的梦境画面；“就”在此保留现场感，同时避免使用现代汉语中较生硬的“看哪”。
- source_word: גֶפֶן
  choice: 一棵葡萄树
  rationale: גֶפֶן指葡萄藤；在普通现代汉语中，“一棵葡萄树”比单说“一棵藤”更明确自然。
- source_word: לְפָנַי
  choice: 在我面前
  rationale: 该介词短语直指说话者前方的位置；汉语无需另加“站着”或“存在”等原文没有的具体姿态。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“于是”承接叙事，“司酒长”为清楚简练的宫廷官职称呼；正文以“就”传达梦境画面突现的语气，并在脚注中保留更形式对应的“看哪”。
