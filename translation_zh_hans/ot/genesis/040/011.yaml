base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/011.yaml
  text: Pharaoh’s cup was in my hand[a], and I took the grapes and squeezed them into Pharaoh’s cup[c][b], and I placed the cup into Pharaoh’s hand.
translation:
  language: zh_hans
  text: 法老的杯在我手里。我拿起葡萄，把葡萄汁挤进法老的杯里，又把杯放在法老手中[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译“放在法老的手掌上”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כּוֹס
  choice: 杯
  rationale: 指饮用器皿；“杯”是现代汉语中自然、准确且不过度修饰的对应词。
- source_word: בְּיָדִי
  choice: 在我手里
  rationale: 保留梦境叙述的具体形象，在现代汉语中也自然。
- source_word: וָאֶקַּח אֶת הָעֲנָבִים
  choice: 我拿起葡萄
  rationale: לקח在连续叙事中表示拿取；“拿起”清楚呈现动作，而不添加原文没有的信息。
- source_word: וָאֶשְׂחַט אֹתָם אֶל כּוֹס פַּרְעֹה
  choice: 把汁挤进法老的杯里
  rationale: שׂחט在此指挤压葡萄使液体流出。“把汁挤进”符合汉语习惯，也避免让人误以为整颗葡萄被塞进杯中；“汁”由该动词在本语境中的含义自然蕴含。
- source_word: וָאֶתֵּן אֶת הַכּוֹס
  choice: 又把杯放在
  rationale: נתן常译为“给”，但后接位置短语时，这里描写的是把杯置于法老手中的具体动作；“放在”自然传达此意。“又”承接希伯来语连续叙事。
- source_word: עַל כַּף פַּרְעֹה
  choice: 法老手中
  rationale: כַּף具体指手掌，介词עַל本义为“在……上”；汉语“放在法老手中”自然表达把杯交到其手上的动作，同时以脚注保留字面形象。
