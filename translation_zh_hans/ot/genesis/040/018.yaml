base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/018.yaml
  text: 'Joseph answered and said, “This is its interpretation: the three baskets are three days.”'
translation:
  language: zh_hans
  text: 约瑟回答说：“它的解释是这样：三个筐就是三天。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן
  choice: 回答
  rationale: ענה在叙事对话中常用于引出回应；“回答”准确、简洁，也符合现代汉语表达。
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 与前面的“回答”合译为“回答说”，既保留希伯来文 ויען...ויאמר 的双重对话格式，又不显生硬。
- source_word: פִּתְרֹנוֹ
  choice: 它的解释
  rationale: פִּתְרוֹן在梦境语境中指对梦的解释；代词后缀译为“它的”，指前述之梦。
- source_word: שְׁלֹשֶׁת הַסַּלִּים
  choice: 三个筐
  rationale: סַל意为盛物的筐或篮；本段语境使用“筐”自然，并与前文器具保持清楚对应。希伯来文定冠词在汉语中无需机械译出。
- source_word: שְׁלֹשֶׁת יָמִים הֵם
  choice: 就是三天
  rationale: 原文是无系词的等同判断，直陈“三个筐”与“三天”的象征对应；“就是”在现代汉语中自然地保留这种等同关系，而不改写为解释性更强的“代表”。
theological_decisions: []
