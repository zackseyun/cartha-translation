revisions:
- from: 到了第三天，也就是法老的生日，法老为所有臣仆设宴，并在众臣仆中抬起了司酒长和司膳长的头[a]。
  to: 到了第三天，就是法老的生日，法老为所有臣仆设宴，并在众臣仆中抬起了司酒长和司饼长的头[a]。
  rationale: 将“司膳长”改为“司饼长”，以准确保留原文对烘焙职务的限定；同时调整脚注的解释性替代译法，避免提前限定该惯用语在本节中的具体结果。其余译文忠实、自然，无须改动。
