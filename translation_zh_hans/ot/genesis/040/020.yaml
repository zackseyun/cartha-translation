base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/020.yaml
  text: And on the third day[a], Pharaoh’s birthday, he made a feast for all his servants, and he lifted up the head of the chief cupbearer and the head of the chief baker among his servants.
translation:
  language: zh_hans
  text: 到了第三天，就是法老的生日，法老为所有臣仆设宴，并在众臣仆中抬起了司酒长和司饼长的头[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可按意思译作“特别召见司酒长和司饼长”或“注意到（加以审察）司酒长和司饼长”。希伯来语直译为“抬起……的头”；这里保留这一说法，因为上下文借同一表达呈现两位官员截然不同的结局。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַּיּוֹם הַשְּׁלִישִׁי
  choice: 到了第三天
  rationale: 以自然的现代汉语承接叙事，同时保留“第三天”这一明确的时间标记。
- source_word: יוֹם הֻלֶּדֶת אֶת־פַּרְעֹה
  choice: 也就是法老的生日
  rationale: 希伯来语指法老出生之日；“法老的生日”是现代汉语中准确自然的表达。
- source_word: וַיַּעַשׂ מִשְׁתֶּה
  choice: 设宴
  rationale: 简洁表达举办筵席或宴会的意思，也符合王宫场景的庄重语体。
- source_word: לְכָל עֲבָדָיו
  choice: 为所有臣仆
  rationale: עֶבֶד 在王宫语境中可指臣属、侍从或仆役；“臣仆”兼顾其服事和隶属君王的身份，而不武断强调奴隶身份。
- source_word: וַיִּשָּׂא אֶת־רֹאשׁ
  choice: 抬起了……的头
  rationale: 保留原文的形象性惯用语，使其与前文对两位官员不同结局的双关相连；较解释性的译法会削弱这一文学效果。
- source_word: שַׂר הַמַּשְׁקִים
  choice: 司酒长
  rationale: 指掌管王宫酒水供应的首长；“司酒长”简洁、清楚，并保留宫廷职衔色彩。
- source_word: שַׂר הָאֹפִים
  choice: 司膳长
  rationale: 指主管烘焙或膳食制作人员的官长；“司膳长”与“司酒长”平行，也适合中文宫廷语境。
- source_word: בְּתוֹךְ עֲבָדָיו
  choice: 在众臣仆中
  rationale: 保留行动发生在法老臣仆当中的公开场景；比“在……中间”更自然凝练。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“臣仆”“司酒长”“司膳长”体现王宫场景；正文刻意保留“抬起……的头”这一不寻常表达，并以脚注说明其惯用意义及上下文中的双关。
