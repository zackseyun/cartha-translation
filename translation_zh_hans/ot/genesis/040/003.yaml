  yaml_path: translation/ot/genesis/040/003.yaml
  text: And he put them in custody in the house of the captain of the guard[a], in the prison house[c][b], the place where Joseph was confined.
translation:
  language: zh_hans
  text: 他把他们拘押在护卫长[a]府的监牢[b]里；那里正是约瑟被囚禁的地方。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “护卫长”所译的希伯来语官衔，直译可作“行刑者之长”或“宰杀者之长”。
    reason: lexical_alternative
  - marker: b
    text: 原文也可按其连续的地点和趋向介词译作：“他把他们拘押在护卫长府中，押入监牢。”
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: וַיִּתֵּן אֹתָם בְּמִשְׁמַר
  choice: 把他们拘押
  rationale: נתן在拘禁语境中意为“安置、交付”，מִשְׁמָר表示看守、拘押；合译为“把他们拘押”，既自然又准确表达司法拘禁。
- source_word: בֵּית שַׂר הַטַּבָּחִים
  choice: 护卫长府
  rationale: שַׂר הַטַּבָּחִים是宫廷官衔，字面与宰杀或行刑有关；“护卫长”符合本段宫廷及监牢语境，“府”简洁表达官长的住所或辖所。
- source_word: אֶל בֵּית הַסֹּהַר
  choice: 关进监牢
  rationale: בֵּית הַסֹּהַר指监牢；介词אֶל带有趋向意义，因此用“关进”自然表达被送入监牢，同时避免生硬直译“进入监牢之屋”。
- source_word: מְקוֹם אֲשֶׁר יוֹסֵף אָסוּר שָׁם
  choice: 也就是约瑟被囚禁的地方
  rationale: אָסוּר可指被捆绑或被囚禁；此处明确是监牢环境，译作“被囚禁”准确自然。שָׁם的地点意义已由“地方”承载。
