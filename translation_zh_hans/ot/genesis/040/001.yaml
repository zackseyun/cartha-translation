  text: וַ/יְהִ֗י אַחַר֙ הַ/דְּבָרִ֣ים הָ/אֵ֔לֶּה חָֽטְא֛וּ מַשְׁקֵ֥ה מֶֽלֶךְ מִצְרַ֖יִם וְ/הָ/אֹפֶ֑ה לַ/אֲדֹנֵי/הֶ֖ם לְ/מֶ֥לֶךְ מִצְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/001.yaml
  text: After these things[a], the cupbearer of the king of Egypt and the baker sinned against their master, the king of Egypt.
translation:
  language: zh_hans
  text: 这些事以后[a]，埃及王的司酒和烘焙师得罪了他们的主上，就是埃及王。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这些事情发生以后。”希伯来文也可较形式化地译为：“这些事以后，事情发生了。”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחַר הַדְּבָרִים הָאֵלֶּה
  choice: 这些事以后
  rationale: 这是常见的希伯来叙事过渡语。“这些事以后”既保留原文的承接关系，又符合现代汉语表达；完整译作“这些事以后，事情发生了”会显得生硬。
- source_word: חָטְאוּ
  choice: 得罪了
  rationale: חטא 在此以后接 ל 标明被冒犯者，表示对某人犯罪、犯错或冒犯。“得罪了”自然地保留其道德与关系层面的含义，又不把宫廷语境中的行为过度神学化。
- source_word: מַשְׁקֵה
  choice: 司酒
  rationale: 此词指为王掌管、侍奉酒水的宫廷官员。“司酒”简洁而有尊严，也没有加入本节未明说的“长”或“总管”等等级。
- source_word: הָאֹפֶה
  choice: 司膳
  rationale: 字面为“烤饼者、烘焙者”。在王宫职务语境中，“司膳”比现代职业称谓“面包师”更自然，并能与“司酒”形成协调；不额外加入领班等级。
- source_word: לַאֲדֹנֵיהֶם
  choice: 他们的主上
  rationale: אָדוֹן 在这里指两名臣仆共同服侍的人间君主。“主上”符合古代宫廷关系，并避免让“主”被误解为神的称号。
- source_word: לְמֶלֶךְ מִצְרָיִם
  choice: 就是埃及王
  rationale: 该同位语明确说明“他们的主上”是谁。译出“就是”使现代汉语关系清楚，同时保留原文对“埃及王”的重复强调。
theological_decisions:
- issue: חָטְאוּ 是否应直译为带强烈宗教色彩的“犯罪”
  choice: 得罪了
  alternative: 犯了罪，得罪了
  rationale: 原文动词确有“犯罪、犯错”的道德分量，但本句结构着重指出他们冒犯的对象是王。“得罪了”能保留对主上的过犯关系，而不擅自断定过犯的具体性质；上下文也未说明他们所做何事。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“司酒”“司膳”“主上”体现古代王宫职务与上下关系，又避免过度古雅。
