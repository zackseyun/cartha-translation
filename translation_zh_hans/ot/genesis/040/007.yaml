base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/007.yaml
  text: So he asked Pharaoh’s officials who were with him in custody in his master’s house[a], saying[b], “Why are your faces downcast today?”
translation:
  language: zh_hans
  text: 于是，他问那些和他一同被拘禁在他主人家里的法老官员[a]，说：“你们今天为什么面带愁容？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“法老的宦官”；希伯来语这个词既可指宦官，也可泛指王室官员。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁאַל
  choice: 于是，他问
  rationale: 承接上文并推进叙事；“于是”自然表达 wayyiqtol 的连续叙事功能，同时保留原文的代词主语。
- source_word: סְרִיסֵי פַרְעֹה
  choice: 法老官员
  rationale: סָרִיס 既可指宦官，也可泛指王室高级官员；本处重点在其宫廷职分，因此正文采用较稳妥的“官员”，并在脚注保留“宦官”的可能。
- source_word: אֲשֶׁר אִתּוֹ
  choice: 那些和他一同
  rationale: 保留原文代词表达，不在正文中额外补出“约瑟”；上下文足以确定所指。
- source_word: בְמִשְׁמַר בֵּית אֲדֹנָיו
  choice: 被拘禁在他主人家里
  rationale: מִשְׁמָר 在此表示受看守、被拘禁的状态或处所；“在他主人家里”贴近希伯来语结构，也表明拘禁地点属于主人宅院。
- source_word: לֵאמֹר
  choice: 说
  rationale: 保留希伯来语引出直接引语的常用结构，在现代汉语叙事中自然通顺。
- source_word: מַדּוּעַ פְּנֵיכֶם רָעִים
  choice: 你们为什么面带愁容
  rationale: 原文直译为“你们的脸为何不好”，是形容神色忧愁的习语；“面带愁容”自然传达其可见的面部表情，而不误解为健康或品行不好。
- source_word: הַיּוֹם
  choice: 今天
  rationale: 现代汉语中对该时间副词最直接自然的对应。
