    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵת
  choice: 却把
  rationale: וְ连接本节与前节，并在司酒长复职与司膳长被处死之间形成鲜明对比；宾语标记 אֵת 在汉语中通过“把”字结构自然体现。
- source_word: שַׂר הָאֹפִים
  choice: 司膳长
  rationale: שַׂר 指主管官员，הָאֹפִים 指负责烘焙食品的人；“司膳长”符合宫廷语境，简洁而庄重。
- source_word: תָּלָה
  choice: 吊死
  rationale: 该动词基本义为“悬挂”；本处是执行死刑的语境，“吊死”自然表达这一点，但不排除悬尸或其他悬挂处刑方式，故加注说明。
- source_word: כַּאֲשֶׁר
  choice: 正如
  rationale: 表示事情的发生与约瑟先前的解释完全相符。
- source_word: פָּתַר
  choice: 解梦
  rationale: פתר 在本段特指解释梦的含义；现代汉语用“解梦”最简明自然。
- source_word: לָהֶם
  choice: 给他们
  rationale: 复数代词指司酒长和司膳长二人，保留原文复数所指。
- source_word: יוֹסֵף
  choice: 约瑟
  rationale: 采用现代中文圣经传统中通行的人名译法。
