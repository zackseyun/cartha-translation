  yaml_path: translation/ot/genesis/040/012.yaml
  text: 'Then Joseph said to him[a], “This is its interpretation: the three branches are three days.”'
translation:
  language: zh_hans
  text: 约瑟对他说：“这梦的解释是：三根枝子就是三天。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 约瑟对他说
  rationale: 承接叙事次序；现代汉语无需机械译出连接词，也能自然表达随后发生的言语。
- source_word: לוֹ
  choice: 对他说
  rationale: 保留希伯来文明确的第三人称代词，不在正文中补明为酒政。
- source_word: פִּתְרֹנוֹ
  choice: 这梦的解释
  rationale: 阳性单数后缀所指是前述梦境；汉语补出“梦”可明确指代，“解释”准确表达解梦语境。
- source_word: שְׁלֹשֶׁת
  choice: 三根／三天
  rationale: 保留原文重复的数词，以维持象征与解释之间的对应结构。
- source_word: הַשָּׂרִגִים
  choice: 枝子
  rationale: 该词在葡萄树梦境中可指枝条、蔓枝或卷须；“枝子”自然易懂且不过度限定具体植物部位。
- source_word: יָמִים
  choice: 天
  rationale: 直接表达时间单位，并保留梦中三个枝子与三天的对应。
- source_word: הֵם
  choice: 就是
  rationale: 独立代词加强判断和对应关系；“就是”在现代汉语中自然传达这一等同解释。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而通俗的叙事语言。“这梦的解释是”使汉语指代清楚；“三根枝子就是三天”保留原文简洁鲜明的解释结构。未设置脚注，因为“枝子”足以涵盖此处词义，其他植物学译法不会显著改变经文理解。
