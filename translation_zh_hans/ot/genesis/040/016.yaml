  text: וַ/יַּ֥רְא שַׂר הָ/אֹפִ֖ים כִּ֣י ט֣וֹב פָּתָ֑ר וַ/יֹּ֨אמֶר֙ אֶל יוֹסֵ֔ף אַף אֲנִי֙ בַּ/חֲלוֹמִ֔/י וְ/הִנֵּ֗ה שְׁלֹשָׁ֛ה סַלֵּ֥י חֹרִ֖י עַל רֹאשִֽׁ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/016.yaml
  text: When the chief baker saw that he had interpreted well[a], he said to Yoseph, “I also had a dream, and behold, three baskets of white bread were on my head.”
translation:
  language: zh_hans
  text: 司膳长见约瑟解得好，就对他说：“我也做了一个梦。看哪，有三筐白饼[a]在我头上。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “白饼”所译的希伯来词含义不确定；也可理解为“三筐烘焙食品”，或指“三只有孔的（或编织的）筐子”。
    reason: 保留 חֹרִי 的词义不确定性，避免把描述内容物还是筐子的歧义悄然消除。
lexical_decisions:
- source_word: שַׂר הָאֹפִים
  choice: 司膳长
  rationale: 该词组指掌管烤饼者的宫廷官员。“司膳长”简洁、庄重，也能表达其主管身份；未采用过于现代商业化的“烘焙主管”。
- source_word: כִּי טוֹב פָּתָר
  choice: 见约瑟解得好
  rationale: 保留“好”在原文中可能兼指解释得当、令人满意或结果有利的张力，不窄化为“吉利地解释”。
- source_word: אַף אֲנִי בַּחֲלוֹמִי
  choice: 我也做了一个梦
  rationale: 原文是省略式梦境引语，直译在汉语中不完整；此译自然表达“我也”的追加意味，不增添梦的具体内容。
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留引出鲜明梦境画面的提示语及叙事感染力。
- source_word: שְׁלֹשָׁה סַלֵּי חֹרִי
  choice: 三筐白饼[a]
  rationale: חֹרִי 词义不确定，传统上可理解为白饼，也可能形容筐子是编织或有孔的。正文采用符合烤饼者身份和后文内容的“白饼”，并以脚注保存另一种可能。
- source_word: עַל רֹאשִׁי
  choice: 在我头上
  rationale: 直接、自然地表达筐子置于头上的位置。
- source_word: יוֹסֵף
  choice: 约瑟
  rationale: 采用现代简体中文读者熟悉且规范的圣经人名译法。
theological_decisions: []
