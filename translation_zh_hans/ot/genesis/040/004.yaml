base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/004.yaml
  text: So the captain of the guard assigned Joseph to them[a], and he attended them[b]; and they were in custody for some time.
translation:
  language: zh_hans
  text: 于是，护卫长派约瑟去照料他们[a]；约瑟侍候他们。他们被拘押了一段时间[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“委派约瑟负责他们”或“派约瑟管理他们”。这里的希伯来语动词可指委任某人承担职责；约瑟与这些囚犯的关系可理解为照料，也可能包含监管。
    reason: lexical_alternative
  - marker: b
    text: 原文近乎字面为“他们在拘押中有日子”。这是表示他们在拘押中停留了一段时间的希伯来语表达。
    reason: idiom
lexical_decisions:
- source_word: וַיִּפְקֹד
  choice: 派
  rationale: 此处 פקד 表示委派某人承担职责。“派”符合现代汉语，也与下文约瑟侍候两名囚犯相衔接；其可能包含的监管意味在脚注中保留。
- source_word: שַׂר הַטַּבָּחִים
  choice: 护卫长
  rationale: 该称号字面涉及宰杀或行刑人员，但在《创世记》的埃及宫廷语境中指负责王室安全及监牢事务的高级官员。“护卫长”简洁自然，并符合上下文。
- source_word: אֶת־יוֹסֵף אִתָּם
  choice: 把约瑟派到他们那里
  rationale: אִתָּם 字面为“与他们一起”，这里表示约瑟被指派与两名囚犯发生职责关系。“到他们那里”自然表达受派照料之意，同时不在正文中断定约瑟是否主管他们。
- source_word: וַיְשָׁרֶת אֹתָם
  choice: 侍候他们
  rationale: שרת 表示在旁服事、照应。“侍候”直接体现约瑟为他们提供服务，又避免“服侍”在现代中文中可能带有的宗教色彩。
- source_word: וַיִּהְיוּ יָמִים
  choice: 一段日子
  rationale: 原文近乎字面为“他们有些日子在拘押中”，属于表示经过一段时间的希伯来语表达。“一段日子”既保留“日子”的意象，又符合现代汉语。
- source_word: בְּמִשְׁמָר
  choice: 被拘押
  rationale: מִשְׁמָר 强调在看守、羁押之下，不仅指监狱地点。“被拘押”准确呈现其状态。
theological_decisions:
- issue: 约瑟与两名囚犯之间是侍候关系还是监管关系
  choice: 正文译为“把约瑟派到他们那里”，并以“侍候他们”说明其实际行动
  alternative: “委派约瑟管理他们”或“派约瑟负责他们”
  rationale: פקד 可表示委任职责，而 אִתָּם 本身是“与他们一起”，并未明确使用“在他们之上”的介词。下句 שרת 明说约瑟侍候他们，因此正文不强化为主管关系，并在脚注中保留另一可能。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“护卫长”“被拘押”符合宫廷监牢语境；“侍候”保留服务职责而避免宗教化措辞。句法以简洁并列推进，呼应希伯来叙事风格。
