base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/008.yaml
  text: They said to him[a], “We have dreamed a dream, and there is no one to interpret it.” Joseph said to them[b], “Do not interpretations belong to God? Please tell them to me.”
translation:
  language: zh_hans
  text: 他们对他说：“我们做了一个梦，却没有人能解。”约瑟对他们说：“解梦的事岂不是属于上帝的吗？请讲给我听吧。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֲלוֹם חָלַמְנוּ
  choice: 我们做了一个梦
  rationale: 希伯来文直译为“一个梦，我们梦了”，采用同源宾语以强调做梦这件事；现代汉语用“做了一个梦”自然表达，并保留单数形式。
- source_word: וּפֹתֵר אֵין אֹתוֹ
  choice: 却没有人能解
  rationale: פֹתֵר 是主动分词，指解梦者或进行解释的人；“没有人能解”在汉语中简洁自然，其中“解”由语境明确指解梦，不额外断言绝对能力不足。
- source_word: הֲלוֹא לֵאלֹהִים פִּתְרֹנִים
  choice: 解梦不是出于上帝吗？
  rationale: הֲלוֹא 引出期待肯定回答的反问；לֵאלֹהִים 可表达归属或来源。“出于上帝”既自然，也传达梦的解释由上帝而来的意思，同时保留反问语气。
- source_word: פִּתְרֹנִים
  choice: 解梦
  rationale: 原文为复数“解释”，在本语境中特指对梦的解释。汉语“解梦”可作不标数的类别表达，无须生硬译成“各种解释”。
- source_word: סַפְּרוּ נָא לִי
  choice: 请把梦讲给我听
  rationale: סַפְּרוּ 为复数命令式，向两人发出邀请；נָא 表示请求语气。原文未明说宾语，但由上下文补出“梦”，可避免中文代词在单复数上的歧义，并自然涵盖两人各自的梦。
- source_word: יוֹסֵף
  choice: 约瑟
  rationale: 采用现代中文圣经传统中通行的人名译法。
theological_decisions:
- issue: אֱלֹהִים 的所指
  choice: 上帝
  alternative: 神明／众神
  rationale: 在约瑟叙事中，这是约瑟承认解梦源于他所敬奉的上帝；上下文不支持泛指某位神明或众神。
- issue: לֵאלֹהִים 所表达的关系
  choice: 解梦出于上帝
  alternative: 解释属于上帝
  rationale: 介词 לְ 可表达归属、所有或来源。这里的重点是人不能自行掌握解梦，正确解释由上帝赐下；“出于”符合上下文，但未扩展为具体启示机制。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“做了一个梦”“解梦”“讲给我听”均为普通读者熟悉的表达；保留约瑟话语中的反问力度，不添加教派性解释。
