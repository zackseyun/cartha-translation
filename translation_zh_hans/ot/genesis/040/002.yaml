  text: וַ/יִּקְצֹ֣ף פַּרְעֹ֔ה עַ֖ל שְׁנֵ֣י סָרִיסָ֑י/ו עַ֚ל שַׂ֣ר הַ/מַּשְׁקִ֔ים וְ/עַ֖ל שַׂ֥ר הָ/אוֹפִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/002.yaml
  text: And Pharaoh was angry with his two officials[b][a], with the chief cupbearer and with the chief baker.
translation:
  language: zh_hans
  text: 法老向他的两名官员发怒，就是向御酒总管和宫廷烘焙总管发怒。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “官员”或译“宫廷官员”；这个希伯来词在某些语境中也可指“太监”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְצֹף
  choice: 发怒
  rationale: קצף表示生气、震怒；“发怒”既符合叙事中动作推进的形式，也不夸大原文未明确限定的强度。
- source_word: פַּרְעֹה
  choice: 法老
  rationale: 这是现代汉语中对埃及君王称号的标准译法。
- source_word: שְׁנֵי סָרִיסָיו
  choice: 他的两个官员
  rationale: סָרִיס可指宫廷官员，在某些语境也可指太监；本节随后以御酒总管和御膳总管说明其职务，因此正文采用不武断断定生理身份的“官员”。
- source_word: שַׂר הַמַּשְׁקִים
  choice: 御酒总管
  rationale: 该词组指负责供酒者的首领；“御酒总管”自然、简洁，并清楚表达其王室职务。
- source_word: שַׂר הָאֹפִים
  choice: 御膳总管
  rationale: 该词组直指烘焙者的首领；结合王宫语境，“御膳总管”比现代汉语中容易使人联想到普通面包师的“膳长”或“烤饼总管”更自然，同时保留其主管身份。
- source_word: עַל ... עַל ... וְעַל
  choice: 向……发怒，就是向……和……发怒
  rationale: עַל在发怒动词之后标示怒气所针对的对象。用“就是”明确后两项是前述两个官员的同位说明，并再次使用“向……发怒”体现原文介词的重复。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“御酒总管”和“御膳总管”保持王宫职衔色彩；“就是”清楚呈现后两个职衔与“两个官员”的同位关系。
