base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/019.yaml
  text: In three more days Pharaoh will lift up your head from upon you and hang you on a tree[b][a], and the birds will eat your flesh from upon you.
translation:
  language: zh_hans
  text: 再过三天，法老必从你身上抬起你的头[a]，把你挂在树上[b]；飞鸟要吃你身上的肉。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“从你身上抬起你的头”。这很可能是对第13节同一说法的阴森双关；那里含义正面，这里却暗示头要从身体上被移走。
    reason: lexical_alternative
  - marker: b
    text: 或译“挂在木头上”或“刺在木柱上”；希伯来文直译为“在树上”。
    reason: alternative_reading
lexical_decisions:
- source_word: בְּעוֹד שְׁלֹשֶׁת יָמִים
  choice: 再过三天
  rationale: 准确表达尚有三天才发生的时间间隔，符合现代汉语习惯。
- source_word: יִשָּׂא פַרְעֹה אֶת רֹאשְׁךָ מֵעָלֶיךָ
  choice: 法老必从你身上抬起你的头
  rationale: 保留“抬起你的头”与第13节相同措辞所形成的阴森双关，同时用“从你身上”显明此处指头被移离身体，而不直接释为“砍头”。
- source_word: וְתָלָה אוֹתְךָ עַל עֵץ
  choice: 把你挂在树上
  rationale: תלה 的基本义是“挂”，עֵץ 可指“树”或“木头、木柱”；正文采用透明的字面表达，并以脚注保留刑具形态上的不确定性。
- source_word: וְאָכַל הָעוֹף
  choice: 飞鸟要……吃
  rationale: עוֹף 是集合单数，汉语用“飞鸟”自然表达集合意义；“吃”直接对应 אכל，避免不必要地强化语气。
- source_word: אֶת בְּשָׂרְךָ מֵעָלֶיךָ
  choice: 从你身上吃你的肉
  rationale: 保留“肉”的具体、惨烈意象，也尽量呈现 מֵעָלֶיךָ 在本节中的重复，而不弱化为笼统的“尸体”。
theological_decisions:
- issue: 如何翻译处决意象，同时保留与酒政之梦解释相呼应的文学双关
  choice: 保留“从你身上抬起你的头”，并译作“挂在树上”
  alternative: 意译为“砍下你的头，把你的尸体挂在木柱上”
  rationale: 意译虽能立即说明处决方式，却会消除与第13节“抬起你的头”之间的刻意呼应，并把“树／木头／木柱”的词义范围收窄。正文因此保留原文的张力和残酷意象，脚注再说明含义与可能译法。
translation_notes:
  register: 采用现代、庄重而清楚的叙事语言。“从你身上抬起你的头”刻意保留原文略显突兀的表达，以维持双关；其余措辞力求自然，不淡化处决场面的严酷。
