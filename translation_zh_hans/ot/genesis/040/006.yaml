  text: Joseph came to them in the morning and saw them[a], and behold, they were troubled.
translation:
  language: zh_hans
  text: 约瑟早晨来到他们那里，看见他们，只见他们神情愁闷[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“神情沮丧”、“脸色阴沉”或“心里烦闷”。原文所指的是一种从外表可以看出的不安、愁苦状态。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא אֲלֵיהֶם
  choice: 来到他们那里
  rationale: בוא与方向短语אֲלֵיהֶם表示朝他们而来；“来到他们那里”自然保留了移动方向，又不额外限定具体地点。
- source_word: בַּבֹּקֶר
  choice: 早晨
  rationale: 准确、简洁地表达带定冠词的时间短语，符合现代汉语叙事习惯。
- source_word: וַיַּרְא אֹתָם
  choice: 看见他们
  rationale: ראה带直接宾语，首先表示直接的视觉感知；“看见”不额外引入“端详”或“观察”的含义。
- source_word: וְהִנָּם
  choice: 只见他们
  rationale: הִנֵּה的附代词形式具有呈现和引人注意的作用；“只见”在现代汉语叙事中自然传达约瑟眼前所见，同时避免生硬的“看哪”。
- source_word: זֹעֲפִים
  choice: 神情愁闷
  rationale: 该词描述一种从外表可察觉的负面情绪状态，语义可涵盖忧愁、沮丧、阴沉甚至恼怒；结合下文约瑟询问他们为何面带愁容，“神情愁闷”既贴合语境，也保留可见于脸色的意味。
