  yaml_path: translation/ot/genesis/040/023.yaml
  text: But the chief cupbearer did not remember Joseph[a], but forgot him.
translation:
  language: zh_hans
  text: 可是，司酒长没有记起约瑟，反而忘了他。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/לֹא
  choice: 可是……没有
  rationale: 连词承接上一节，同时引出与约瑟请求及事情应验形成的转折；“可是”在现代汉语中自然表达这一篇章关系。
- source_word: זָכַר
  choice: 记起
  rationale: 保留“记得、想起”的基本词义，不把其未替约瑟采取行动的含义直接增译出来。
- source_word: שַׂר הַמַּשְׁקִים
  choice: 司酒长
  rationale: 这是法老宫廷中主管酒水侍奉的高级官职；“司酒长”简洁庄重，并符合本段叙事语境。
- source_word: אֶת יוֹסֵף
  choice: 约瑟
  rationale: אֶת是直接宾语标记，汉语无需另译；人名采用通行译名“约瑟”。
- source_word: וַיִּשְׁכָּחֵהוּ
  choice: 竟把他忘了
  rationale: 动词意为“忘记”，宾语后缀指约瑟。“竟”自然凸显后一句对前一句的加强和令人失望的结果，但不额外说明动机。
theological_decisions: []
translation_notes:
  register: 采用现代、自然而庄重的叙事语言。“没有记起……竟把他忘了”保留希伯来文近义复述所形成的强调，避免改写为“没有替他说话”等解释性表达。
