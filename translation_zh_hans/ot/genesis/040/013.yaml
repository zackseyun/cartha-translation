  choice: 再过三天
  rationale: 准确表达尚有三天才发生的前瞻时间含义，符合现代汉语习惯。
- source_word: יִשָּׂא ... אֶת רֹאשֶׁךָ
  choice: 抬起你的头
  rationale: 保留希伯来语的具体说法及其与第19节形成的文学呼应；下句说明此处指有利的复职。
- source_word: וַהֲשִׁיבְךָ עַל כַּנֶּךָ
  choice: 使你复原职
  rationale: כֵּן在宫廷语境中指原有的职位或职分；“复原职”简洁而庄重。
- source_word: וְנָתַתָּ כוֹס פַּרְעֹה בְּיָדוֹ
  choice: 把法老的杯递到他手中
  rationale: 体现司酒把杯交到君王手中的具体动作，也符合自然汉语表达。
- source_word: כַּמִּשְׁפָּט הָרִאשׁוֹן
  choice: 照从前的规矩
  rationale: מִשְׁפָּט此处指先前既定的惯例或办事方式，而非司法判决。
- source_word: אֲשֶׁר הָיִיתָ מַשְׁקֵהוּ
  choice: 像你做司酒时一样
  rationale: מַשְׁקֶה指宫廷中的司酒职务；此译法自然，并与复职语境相合。
