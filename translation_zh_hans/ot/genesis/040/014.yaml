base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/014.yaml
  text: But if you remember me when it goes well for you[a], please show kindness to me, and mention me to Pharaoh[b], and bring me out of this house.
translation:
  language: zh_hans
  text: 不过，等你境况好转时，请记得我[a]，恩待我，在法老面前提起我，使我离开这房子[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文在“记得我”后另有“与你”一词；其在此的确切习语作用有不同理解。
    reason: 保留אִתְּךָ这一原文成分及其解释上的不确定性，避免把它误释为“同你一起记得我”。
  - marker: b
    text: “房子”在这里指约瑟被拘禁的地方。
    reason: 说明בַּיִת在本节语境中的所指，而不在正文中把它解释性地译成“监牢”。
lexical_decisions:
- source_word: כִּי אִם
  choice: 不过
  rationale: 在前文的解梦之后转入约瑟恳切的请求；“不过”自然表达转折和限定语气，而条件、时间关系由下句“等……时”清楚呈现。
- source_word: זְכַרְתַּנִי אִתְּךָ
  choice: 请记得我
  rationale: זכר意为“记得”；אִתְּךָ直译“与你一起”，在此是希伯来语习惯表达，强调酒政日后亲自把约瑟放在心上。正文采用自然汉语，并以脚注保留其字面特点。
- source_word: כַּאֲשֶׁר יִיטַב לָךְ
  choice: 等你境况好转时
  rationale: 指酒政恢复职位、处境转好。“境况好转”比笼统的“顺利”更贴合叙事情境，同时保留时间含义。
- source_word: וְעָשִׂיתָ נָּא עִמָּדִי חָסֶד
  choice: 恩待我
  rationale: חֶסֶד在此指实际施予的仁慈或善意，并非明确诉诸正式盟约；“恩待”简洁庄重。请求语气词נָא通过“请”统摄这一连串请求。
- source_word: וְהִזְכַּרְתַּנִי אֶל פַּרְעֹה
  choice: 在法老面前提起我
  rationale: 使役形态在语境中表示使法老注意到约瑟。“在法老面前提起我”既贴近原文介词表达，也符合现代汉语。
- source_word: וְהוֹצֵאתַנִי
  choice: 把我……带出去
  rationale: יצא的使役形态表示使约瑟出去。“带出去”保留使役意义，又不额外加入原文未明说的“营救”。
- source_word: מִן הַבַּיִת הַזֶּה
  choice: 从这房子里
  rationale: 原文使用בַּיִת“房子、处所”，语境所指是拘禁约瑟的地方。正文保留“房子”，脚注说明其语境含义，避免直接改写成更明确的“监牢”。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重而易懂的现代标准普通话。“境况好转”呼应酒政即将复职的具体处境；连续使用“记得、恩待、提起、带出去”，保留原文层层推进的恳求结构。
