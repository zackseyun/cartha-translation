base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/005.yaml
  text: And the two of them dreamed a dream[a], each man his own dream, in one night, each according to the interpretation of his dream—the cupbearer and the baker who belonged to the king of Egypt[d][c][b], who were confined in the prison house.
translation:
  language: zh_hans
  text: 他们两人在同一个夜晚各自做了一个梦；每个人的梦都有与之相应的解释[a]。他们是埃及王手下的司酒官和面包师[b]，被关在监牢里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文也可较直译为“各人照着自己梦的解释”；意思是每个梦都有与之相应的、各不相同的解释。
    reason: 保留希伯来语浓缩结构及其可能的句法表达。
  - marker: b
    text: “埃及王手下的”也可译作“服侍埃及王的”。
    reason: 说明介词短语既可表示隶属关系，也可表示在王室任职。
lexical_decisions:
- source_word: וַיַּחַלְמוּ חֲלוֹם שְׁנֵיהֶם
  choice: 他们两人各做了一个梦
  rationale: 希伯来语采用同根动词和名词连用，直译近似“梦了一个梦”。现代汉语以“做了一个梦”自然表达，并以“他们两人各”保留两人分别做梦的意思。
- source_word: בְּלַיְלָה אֶחָד
  choice: 一夜之间
  rationale: 既保留“一夜”的字面要素，也在现代汉语中自然表明两个梦发生在同一个夜间。
- source_word: אִישׁ כְּפִתְרוֹן חֲלֹמוֹ
  choice: 各人的梦都有与之相应的解释
  rationale: כְּ 表达对应关系；译文保留每个梦各有相应解释的分配性含义，不预先说明解释的具体内容。
- source_word: הַמַּשְׁקֶה וְהָאֹפֶה
  choice: 司酒官和烤饼官
  rationale: 两词指王室中负责饮品和烤制食物的人。“官”结合下文与埃及王的关系，清楚表达其宫廷职分；本节没有明说“长”或“总管”，因此不增译。
- source_word: אֲשֶׁר לְמֶלֶךְ מִצְרַיִם
  choice: 埃及王手下的
  rationale: 介词 לְ 表示归属或职务关系；“手下的”在现代汉语中自然表达他们隶属并服侍埃及王，同时避免所有权色彩过强。
- source_word: אֲסוּרִים בְּבֵית הַסֹּהַר
  choice: 当时被关在监牢里
  rationale: אָסוּרִים 可指被捆绑或被囚禁；结合“监牢”，译作“被关”最符合语境，并以“当时”清楚连接其受拘禁状态。
theological_decisions:
- issue: 梦与解释之间的关系
  choice: 各人的梦都有与之相应的解释
  alternative: 各人照着自己梦的解释做梦
  rationale: 希伯来语短语较为浓缩，重点是两个梦各自具有相应而不同的解释；所选译法不暗示做梦者预先知道解释，也不把解释与梦割裂。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“司酒官和烤饼官”兼顾宫廷职分与本节未出现“首领”称号这一事实；句序略作汉语化处理，以避免逐词直译造成歧义。
