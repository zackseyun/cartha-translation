base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/021.yaml
  text: He restored the chief cupbearer to his office[b][a], and he put the cup into Pharaoh’s hand.
translation:
  language: zh_hans
  text: 法老使司酒长恢复原职[a]；司酒长把杯递到法老手中[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文较直译为“使司酒长回到他的司酒职分”。
    reason: lexical_alternative
  - marker: b
    text: 原文作“他把杯递到法老手中”；这里依上下文将“他”明确译为司酒长。
    reason: source_ambiguity
lexical_decisions:
- source_word: וַיָּשֶׁב
  choice: 让……官复原职
  rationale: 这是שׁוב的使役形，表示使人回到先前的职位或身份；“官复原职”在现代汉语中自然、准确地表达复职。
- source_word: שַׂר הַמַּשְׁקִים
  choice: 司酒长
  rationale: שַׂר指主管官员，מַשְׁקִים指宫廷中负责奉酒的人；“司酒长”简洁地传达其宫廷职务及主管身份。
- source_word: עַל מַשְׁקֵהוּ
  choice: 原职
  rationale: 原文较直译为“回到他的司酒职分”；结合上下文，所指是恢复原先的司酒职务。“原职”自然凝练，具体含义以脚注保留。
- source_word: וַיִּתֵּן
  choice: 递到
  rationale: נתן基本义为“给、放”；在司酒长向法老奉杯的场景中，“递到……手中”符合现代汉语表达，并保留交付动作。
- source_word: הַכּוֹס
  choice: 杯
  rationale: 直接对应具体名词“杯”。
- source_word: עַל כַּף פַּרְעֹה
  choice: 到法老手中
  rationale: כַּף本指手掌，此处表示将杯交到法老手里；汉语以“到……手中”最自然。
theological_decisions:
- issue: 第二分句וַיִּתֵּן的主语
  choice: 正文明确为“司酒长”
  alternative: 按形式译作“他”，保留代词指向的含混
  rationale: 希伯来文只用第三人称单数动词，形式上未明说主语；但叙事情境表明执行奉杯动作的是刚复职的司酒长。正文明确主语可避免误读为法老把杯放到自己手中，同时用脚注说明原文形式。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“官复原职”准确表达复职，“递到……手中”符合宫廷奉杯场景。分号使复职与随即履职的动作关系清楚。
