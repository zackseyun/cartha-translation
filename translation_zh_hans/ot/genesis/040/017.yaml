  yaml_path: translation/ot/genesis/040/017.yaml
  text: and in the top basket were all kinds of food for Pharaoh[a], the work of a baker, and the birds were eating them from the basket above my head.
translation:
  language: zh_hans
  text: 最上面的筐里装着各样给法老吃的烤制食品[a]，鸟从我头顶上方的筐里啄食它们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“烘焙师所做的（食物）”；或译“烘焙师的手艺”，指为法老预备的烤制食品。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַסַּל הָעֶלְיוֹן
  choice: 最上面的筐里
  rationale: הָעֶלְיוֹן 表示处于上方或最上层；结合多个筐叠放在头上的梦境，以“最上面的筐”自然、准确。
- source_word: מִכֹּל מַאֲכַל פַּרְעֹה מַעֲשֵׂה אֹפֶה
  choice: 各样给法老吃的烤制食品
  rationale: מִכֹּל 表达种类繁多，מַאֲכַל פַּרְעֹה 指给法老食用的食品，מַעֲשֵׂה אֹפֶה 字面为“烘焙者所做之物”；正文用“烤制食品”清楚表达其所指，同时脚注保留较直译的结构。
- source_word: וְהָעוֹף
  choice: 鸟
  rationale: עוֹף 是集合名词，可统指飞鸟；汉语“鸟”无需强制标明单复数，保留原文形式上的含混。
- source_word: אֹכֵל
  choice: 啄食
  rationale: 分词表示梦境中正在持续的动作；“啄食”符合鸟吃筐中食物的自然表达。
- source_word: אֹתָם
  choice: 它们
  rationale: 阳性复数后缀回指筐里的多样食品，用“它们”保留复数指称。
- source_word: מִן הַסַּל מֵעַל רֹאשִׁי
  choice: 从我头顶上方的筐里
  rationale: מִן 表示来源，מֵעַל רֹאשִׁי 表示筐位于说话者头顶上方；此译不额外断定筐是否直接接触头部。
