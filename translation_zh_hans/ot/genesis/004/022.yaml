revisions:
- from: 洗拉也生了土八·该隐[a]；他是打造各样青铜[b]和铁制利器的人。土八·该隐的妹妹是拿玛。
  to: 洗拉也生了土八·该隐[a]；他是打造各样青铜[b]和铁制利器的人。土八·该隐的姐妹是拿玛。
  rationale: 仅作两项安全修订：以“姐妹”忠实保留 אֲחוֹת 未指明的长幼关系；重写脚注a，使其以自然汉语准确保留疑难职业短语的主要解释空间。正文继续遵循英语审计轨迹所采用的“金属利器制造者”理解，且不把该技术描述扩展为额外历史或神学主张。
