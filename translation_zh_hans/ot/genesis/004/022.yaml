  text: וְ/צִלָּ֣ה גַם הִ֗וא יָֽלְדָה֙ אֶת תּ֣וּבַל קַ֔יִן לֹטֵ֕שׁ כָּל חֹרֵ֥שׁ נְחֹ֖שֶׁת וּ/בַרְזֶ֑ל וַֽ/אֲח֥וֹת תּֽוּבַל קַ֖יִן נַֽעֲמָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/022.yaml
  text: Zillah also bore Tubal-cain[a], a forger of every cutting tool of bronze and iron[b]. And the sister of Tubal-cain was Naamah.
translation:
  language: zh_hans
  text: 洗拉也生了土八·该隐[a]；他是打造各样青铜[b]和铁制利器的人。土八·该隐的姐妹是拿玛。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他是打造各样青铜和铁制利器的人”所对应的原文措辞含义不确定；也可理解为“磨利或锤打各样铜器和铁器的人”，或较概括地指“从事铜和铁加工的工匠”。
    reason: alternative_reading
  - marker: b
    text: “青铜”也可译作“铜”。
    reason: lexical_alternative
lexical_decisions:
- source_word: גַם הִוא
  choice: 也
  rationale: 表达洗拉同样生子的附加意味；现代汉语无需另行直译代词“她”。
- source_word: יָלְדָה
  choice: 生了
  rationale: 符合创世记家谱叙事的简洁表达，也自然传达生育之意。
- source_word: תּוּבַל קַיִן
  choice: 土八·该隐
  rationale: 采用现代中文圣经读者熟悉的人名音译，并以间隔号标示复合名称。
- source_word: לֹטֵשׁ כָּל חֹרֵשׁ
  choice: 打造各样……利器的人
  rationale: 希伯来语结构疑难；正文采用制造或锻打金属器具的理解，以自然汉语呈现，同时用脚注保留“磨利者”或“金属工匠”的可能解释。
- source_word: נְחֹשֶׁת
  choice: 青铜
  rationale: 在古代金属语境中通常可译为“青铜”，但原词也可指铜，故加注说明。
- source_word: בַרְזֶל
  choice: 铁
  rationale: 该金属名称的标准对应词。
- source_word: אֲחוֹת
  choice: 妹妹
  rationale: 中文叙事通常需明确手足性别与相对年龄；她在列举土八·该隐之后被称为其姊妹，传统中文译法作“妹妹”。
- source_word: נַעֲמָה
  choice: 拿玛
  rationale: 采用现代中文圣经传统中通行的人名音译。
theological_decisions:
- issue: 土八·该隐的职业或技术角色
  choice: 正文理解为打造青铜和铁制利器的人
  alternative: 磨利各金属工匠器具的人，或从事青铜和铁加工的工匠
  rationale: 原文 לֹטֵשׁ כָּל חֹרֵשׁ 的句法和词义均有困难，不能据此建立超出经文的技术史或神学结论；正文选择上下文中较连贯的器具制造含义，脚注保留其他主要解释。
translation_notes:
  register: 采用自然、庄重而简洁的现代标准汉语。“打造”比技术性较强的“锻造”更易懂；“利器”承接原文可能涉及磨利或金属器具的语义，但不进一步限定为武器。所有疑难和词义分歧均以脚注明示。
