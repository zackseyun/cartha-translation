base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/012.yaml
  text: When you work the ground[a], it will no longer yield its strength to you[d][c][b]. You will be a wanderer and a fugitive on the earth.
translation:
  language: zh_hans
  text: 你耕种土地时[a]，土地不再把它的力量供给你[b]。你必在地上[d]漂泊流离[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为你耕种土地”，或“如果你耕种土地”。希伯来语连接词可按此句被理解为原因、时间或条件而有不同译法。
    reason: lexical_alternative
  - marker: b
    text: 直译：“它必不再继续把它的力量给你。”这里的“力量”指土地的生产力或肥力。
    reason: lexical_alternative
  - marker: c
    text: 或译：“飘荡不定的人。”原文两个词意思相近，连用以加强该隐居无定所的处境。
    reason: lexical_alternative
  - marker: d
    text: 或译：“在那片土地上。”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ……的时候
  rationale: 此处可引出将来反复发生的情形，也可理解为原因或条件。正文采用时间表达，既自然，也符合该审判在该隐耕种时显出的语境；其他可能性列入脚注。
- source_word: תַעֲבֹד
  choice: 耕种
  rationale: עבד与土地搭配时指劳作、耕作；“耕种”在现代汉语中明确表达农业活动。
- source_word: הָאֲדָמָה
  choice: 土地
  rationale: אֲדָמָה在此指供人耕作的地土。“土地”自然易懂，也保留本段中该隐与地土之间的关联。
- source_word: לֹא תֹסֵף תֵּת
  choice: 不再……给
  rationale: יסף加不定式表示不继续做某事；“不再……给”既贴近原文结构，也清楚表达停止供给。
- source_word: כֹּחָהּ
  choice: 它的力量
  rationale: 原文直指土地的“力量”，语境中即其生产力或肥力。正文保留这一拟人化隐喻，而不直接改写为“出产”。
- source_word: נָע וָנָד
  choice: 漂泊流离
  rationale: 两个近义词叠加强调居无定所、不断迁移的状态。“漂泊流离”在现代汉语中自然，并保留双重表达的加强作用，又避免把后一个词过度限定为躲避追捕的“逃亡者”。
- source_word: בָאָרֶץ
  choice: 在地上
  rationale: אֶרֶץ既可指“大地”，也可指特定“地方、土地”。在创世记的原初叙事语境中，“地上”较为宽广，同时保留“在某地”这一可能性的脚注说明。
theological_decisions:
- issue: 该隐所受审判的范围
  choice: 同时表达耕作受挫和居无定所，不引入经文未明说的后期教义范畴。
  alternative: 把审判只理解为心理上的不安，或只理解为局限于某一区域的放逐。
  rationale: 经文既说土地不再给他力量，又说他必漂泊流离；译文保留物质生活与安居状态这两个层面，不把其中一个化约为另一个。
- issue: נָע וָנָד的具体含义
  choice: 译为“漂泊流离”，突出不安定和居无定所。
  alternative: 译为“流浪者和逃亡者”，使后一个词明确带有逃避追捕的含义。
  rationale: 两个希伯来词语义相近并彼此加强；上下文确定的是该隐的不安定处境，却未必要求法律意义上的“逃犯”概念，因此不作过度限定。
translation_notes:
  register: 采用现代、庄重而清楚的叙事语言。“耕种土地”比“侍奉土地”自然；“把它的力量给你”有意保留原文关于土地的拟人化表达；“漂泊流离”以常用四字结构传达两个近义希伯来词的叠加强调。所有脚注标记均置于正文相应位置。
