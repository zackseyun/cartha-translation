base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/008.yaml
  text: And Cain said to Abel his brother. Then[a], while they were in the field, Cain rose up against Abel his brother and killed him.
translation:
  language: zh_hans
  text: 该隐对他的兄弟亚伯说。后来[a]，他们在田野里时，该隐起来攻击他的兄弟亚伯，把他杀了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 马所拉文本这里只作“该隐对他的兄弟亚伯说”，没有记下他说了什么。七十士译本、撒玛利亚五经和武加大译本等古代见证在此有“我们到田野去吧”一类的话。
    reason: textual_variant
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: אמר通常意为“说”。马所拉文本在此没有保留所说的内容，因此按现存希伯来文本直译为未完结的“对……说”，不擅自补足宾语内容。
- source_word: אֶל
  choice: 对
  rationale: 介词表示言语指向的对象；现代汉语以“对……说”最自然，也准确反映希伯来语结构。
- source_word: אָחִיו
  choice: 他弟弟
  rationale: 原词本义是“他的兄弟”；结合前文已明确亚伯是该隐的弟弟，译作“他弟弟”符合现代汉语，并保留本节两次强调手足关系的叙事作用。
- source_word: וַיְהִי בִּהְיוֹתָם
  choice: 后来，他们……的时候
  rationale: 这是叙事中的时间框架。译文用“后来……的时候”表达事件推进及同时发生的背景，避免生硬照译“事情发生了”。
- source_word: בַּשָּׂדֶה
  choice: 在田野里
  rationale: שָׂדֶה可指田地或野外；“田野”既保留开放地域的含义，也符合本段传统叙事语境。
- source_word: וַיָּקָם ... אֶל
  choice: 起来攻击
  rationale: 该结构字面为“起来对抗”，在杀害语境中表示敌对袭击。“起来攻击”兼顾希伯来语动作意象与现代汉语可懂度。
- source_word: וַיַּהַרְגֵהוּ
  choice: 把他杀了
  rationale: הרג意为“杀死”。译作“杀了”直接而自然；不译作“谋杀”，以免加入该动词本身未明说的法律分类。
theological_decisions:
- issue: 是否在正文补入马所拉文本所无的该隐话语
  choice: 正文依照所提供的WLC马所拉文本，不补入引语；用脚注说明古代见证中的较长读法
  alternative: 在正文加入“我们到田野去吧”，并在脚注注明马所拉文本缺失该句
  rationale: 所提供的希伯来语正文只保留“该隐对他弟弟亚伯说”，没有话语内容。七十士译本、撒玛利亚五经和武加大译本支持较长读法，但现有证据不能完全排除较短读法；因此正文优先忠实呈现WLC的真实突兀，同时在脚注中公开重要异文，不替读者消除文本张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“他弟弟”依据上下文具体化“他的兄弟”，并在两处重复，以保留原文对手足相残的强调。脚注标记置于承接后续事件的“后来”之后，说明前一句在马所拉文本中的突兀及其重要异文。
