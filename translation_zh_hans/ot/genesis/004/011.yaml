source:
  edition: WLC
  text: וְ/עַתָּ֖ה אָר֣וּר אָ֑תָּה מִן הָֽ/אֲדָמָה֙ אֲשֶׁ֣ר פָּצְתָ֣ה אֶת פִּ֔י/הָ לָ/קַ֛חַת אֶת דְּמֵ֥י אָחִ֖י/ךָ מִ/יָּדֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/011.yaml
  text: And now you are cursed from the ground[c][b][a], which has opened its mouth to receive your brother’s blood from your hand.
translation:
  language: zh_hans
  text: 如今，你必从这地受咒诅[a]；因为这地已经张开了口，好从你手中收下你兄弟的血[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“受这地咒诅。”也可理解为“受咒诅而离开这地”。希伯来语介词可表示咒诅的来源，也可表示分离。
    reason: alternative_reading
  - marker: b
    text: 原文直译为“你兄弟的众血”；“血”的复数形式在希伯来语中可表示所流的血或流血之罪。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: 如今
  rationale: 既承接上文，也引出该隐行为所带来的即时后果；现代中文自然而庄重。
- source_word: אָרוּר אָתָּה
  choice: 你要……受咒诅
  rationale: 表达该隐处于被咒诅的状态；“要”在此表示宣告的结果，而非单纯将来时。
- source_word: מִן הָאֲדָמָה
  choice: 从这土地
  rationale: 保留介词 מִן 的基本“从”义，以及它可能表达来源或分离的张力；因中文正文难以同时清楚呈现两义，另加脚注说明。
- source_word: אֲשֶׁר פָּצְתָה אֶת פִּיהָ
  choice: 这土地张开了口
  rationale: 保留土地被拟人化、张口吞受鲜血的鲜明意象。
- source_word: לָקַחַת
  choice: 接纳
  rationale: 原义为“取、拿”，在土地吸纳所流之血的语境中译作“接纳”自然，并保留土地主动张口的形象。
- source_word: דְּמֵי אָחִיךָ
  choice: 你兄弟的血
  rationale: 原文“血”为复数形式，在此是表示流血或血债的希伯来语用法；中文用单数“血”最自然。
- source_word: מִיָּדֶךָ
  choice: 从你手里
  rationale: 直译并保留“手”的意象，突出该隐对兄弟之死负有直接责任。
theological_decisions:
- issue: 咒诅与土地之间的关系
  choice: 正文译为“从这土地受咒诅”，不把 מִן 明确限定为施事来源或空间分离。
  alternative: “被这土地咒诅”或“受咒诅而离开这土地”
  rationale: 希伯来语 מִן 可带有来源或分离的意味；正文保留原句张力，脚注列出分离义，避免把经文只解释为土地施咒或只解释为被逐离土地。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“土地”延续 אֲדָמָה 的具体含义，并保留本段中人与土地关系的主题；句式略带宣告色彩，但避免生硬的古汉语表达。
