  yaml_path: translation/ot/genesis/004/002.yaml
  text: And she gave birth again[a], to his brother Abel. Abel became a shepherd of flocks[c][b], but Cain was a worker of the ground.
translation:
  language: zh_hans
  text: 她又生了该隐的兄弟亚伯[a]。亚伯牧放羊群[b]，该隐却耕种土地[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “又生了”也可译作“继续生育”。希伯来语原文直译为“增添去生”，是表示再次或继续做某事的惯用说法。
    reason: lexical_alternative
  - marker: b
    text: “羊群”指小型家畜，尤其包括绵羊和山羊。
    reason: cultural_note
  - marker: c
    text: “耕种土地”也可译作“耕地的人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּסֶף לָלֶדֶת
  choice: 她又生了
  rationale: יסף加不定式表示再次或继续做某事；在接续的生育叙事中，“又生了”自然、准确，并保留重复发生的意思。
- source_word: אֶת אָחִיו אֶת הָבֶל
  choice: 该隐的弟弟亚伯
  rationale: 原文直称“他的兄弟亚伯”，其中代词回指该隐；现代汉语按出生次序自然表达为“该隐的弟弟亚伯”，同时保留亲属关系和同位说明。
- source_word: הֶבֶל
  choice: 亚伯
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: רֹעֵה צֹאן
  choice: 牧养羊群
  rationale: רעה指放牧、照料牲畜，צאן是集合名词，主要指绵羊和山羊等小型牲畜；正文用简洁自然的“牧养羊群”，脚注说明范围并不限于绵羊。
- source_word: קַיִן
  choice: 该隐
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: הָיָה עֹבֵד אֲדָמָה
  choice: 耕种土地
  rationale: עבד与אדמה连用指劳作、耕作土地；“耕种土地”比“农夫”更贴近原文动作，也保留אדמה在《创世记》上下文中的主题词。
- source_word: וְ
  choice: 却
  rationale: 连接词本义可作“和”，此处并列对照兄弟二人的不同职业；“却”使汉语关系清楚，但不暗示职业有道德高下。
theological_decisions:
- issue: 两兄弟职业的叙事评价
  choice: 仅陈述两种不同职业，不赋予任何道德高下
  alternative: 通过措辞暗示牧养或耕种更受肯定
  rationale: 本节希伯来文只描述亚伯和该隐各自的职业，并未在此处对任何一种职业作神学或道德评价。
translation_notes:
  register: 采用现代、庄重而口语可懂的叙事文体。“牧养羊群”与“耕种土地”结构简明；“却”只表达职业对照，不作价值判断。所有脚注标记均置于相应正文之后。
