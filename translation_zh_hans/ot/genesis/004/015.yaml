id: GEN.4.15
reference: Genesis 4:15
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יֹּ֧אמֶר ל֣/וֹ יְהוָ֗ה לָ/כֵן֙ כָּל הֹרֵ֣ג קַ֔יִן שִׁבְעָתַ֖יִם יֻקָּ֑ם וַ/יָּ֨שֶׂם יְהוָ֤ה לְ/קַ֨יִן֙ א֔וֹת לְ/בִלְתִּ֥י הַכּוֹת אֹת֖/וֹ כָּל מֹצְאֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/015.yaml
  text: Then Yahweh said to him[a], “Therefore whoever kills Cain, vengeance will be taken on him sevenfold.” And Yahweh put a mark on Cain[b], lest anyone finding him should strike him.
translation:
  language: zh_hans
  text: 耶和华对他说：“因此，谁若杀该隐，谁就必遭七倍的报应。”耶和华又给该隐一个记号[a]，免得遇见他的人击打他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “记号”也可译作“标记”。原文没有说明这个记号是什么形态。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神名译法，明确对应四字神名，而不以“主”代替。
- source_word: לָכֵן
  choice: 因此
  rationale: 保留上帝回应该隐时的推论和承接关系，现代而庄重。
- source_word: כָּל הֹרֵג קַיִן
  choice: 谁若杀该隐
  rationale: 用自然的中文条件结构表达希伯来文泛指、无定的普遍范围。
- source_word: שִׁבְעָתַיִם
  choice: 七倍
  rationale: 简洁表达报应的七重程度，不擅自说明其具体实施方式。
- source_word: יֻקָּם
  choice: 必遭……的报应
  rationale: 希伯来文是紧凑的被动形式，施行者未明说；中文以“遭报应”保留受动含义，并借上下文明确承受报应的是杀该隐的人。
- source_word: אוֹת
  choice: 记号
  rationale: 该词可泛指标志或征兆；“记号”既自然，也不把它限定为某种身体印记。
- source_word: לְבִלְתִּי הַכּוֹת אֹתוֹ
  choice: 免得……击打他
  rationale: 保留否定目的含义；“击打”比“杀死”更直接对应 נכה，也不把经文所说的伤害限缩为致死行为。
- source_word: כָּל מֹצְאוֹ
  choice: 遇见他的人
  rationale: 结合“免得”自然表达希伯来文“任何找到／遇见他的人”的泛指含义。
theological_decisions:
- issue: 该隐所得记号的性质
  choice: 译作“记号”，不说明其形态
  alternative: 印记、标记
  rationale: 原文没有交代该记号是身体标记、外在征兆还是其他形式，因此不引入后世推测。
- issue: 七倍报应由谁承受
  choice: 明确为杀该隐的人必遭报应
  alternative: 较直译但中文指向含混的“他必受七倍报复／他必被报七倍的仇”
  rationale: 上下文是在警告人不可杀该隐。译文澄清被动句的承受者，却仍不明说原文省略的施行者。
- issue: 报应的施行者
  choice: 不在译文中补出“上帝”
  alternative: 上帝必向他施行七倍报应
  rationale: 虽然语境暗示神圣报应，希伯来文被动式本身没有明说施行者；保留这一语法上的含蓄。
translation_notes:
  register: 采用现代标准普通话，语气庄重而易懂。“谁若……谁就……”清楚呈现警告的普遍条件；“免得遇见他的人击打他”保留原文的否定目的结构。
