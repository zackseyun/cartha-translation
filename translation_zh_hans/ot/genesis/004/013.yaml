  text: וַ/יֹּ֥אמֶר קַ֖יִן אֶל יְהוָ֑ה גָּד֥וֹל עֲוֺנִ֖/י מִ/נְּשֹֽׂא־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/013.yaml
  text: And Cain said to Yahweh[a], “My iniquity is too great to bear.”
translation:
  language: zh_hans
  text: 该隐对耶和华说：“我的罪孽太重，我担当不起。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我的罪责太重，我担当不起”；也可译：“我的惩罚太重，我承受不了。”另可理解为：“我的罪孽太大，无法赦免。”希伯来语中的“罪孽”也可指罪责或惩罚，而“担当”在某些语境中也可指赦免。
    reason: 保留 עָוֹן 与 נָשָׂא 在本句中的词义歧义和相应的神学张力。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 未另译连接词 וַ，以符合现代汉语叙事衔接习惯；动词用“说”自然引出直接引语。
- source_word: קַיִן
  choice: 该隐
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: אֶל־יְהוָה
  choice: 对耶和华
  rationale: אֶל 表示言语所指向的对象，译作“对”；יהוה 采用中文通行的专名形式“耶和华”，不以称号替代。
- source_word: גָּדוֹל
  choice: 太重
  rationale: 本义为“大”；与后面的 מִן 比较结构结合，表达超过承受限度。中文以“太重……担当不起”自然传达这一程度与比限关系。
- source_word: עֲוֺנִי
  choice: 我的罪孽
  rationale: עָוֹן 可指罪孽、罪责，也可转指罪所招致的惩罚。正文采用较直接的“罪孽”，同时在脚注保留“罪责／惩罚”的可能。
- source_word: מִנְּשֹׂא
  choice: 我担当不起
  rationale: נָשָׂא 的基本意义包括承载、担当；介词 מִן 在此表示超过能力范围。补出汉语所需的主语和可能意义，以“我担当不起”自然呈现。
theological_decisions:
- issue: עֲוֺנִי מִנְּשֹׂא 的语义歧义
  choice: “我的罪孽太重，我担当不起了”
  alternative: “我的罪责太重，我担当不起了”；“我的惩罚太重，我承受不了”；或“我的罪孽太重，不能蒙赦免”
  rationale: עָוֹן 可表示罪孽、罪责或惩罚，נָשָׂא 可表示担当，也可在罪的语境中表示赦免。正文保留较直接的“罪孽／担当”组合，不把该隐的话限定为认罪、抱怨刑罚或绝望于赦免中的任何一种；其他可能由脚注说明。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“担当不起”比单说“不能担当”更符合口语和书面语共同习惯，又保留承受重担的意象；句末“了”表达该隐面对已宣告判决时的反应。脚注标记置于相关引语句末。
