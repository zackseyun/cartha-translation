source:
  edition: WLC
  text: וַ/יֹּ֖אמֶר מֶ֣ה עָשִׂ֑יתָ ק֚וֹל דְּמֵ֣י אָחִ֔י/ךָ צֹעֲקִ֥ים אֵלַ֖/י מִן הָֽ/אֲדָמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/010.yaml
  text: And he said[a], “What have you done? The voice of your brother’s blood is crying out to me from the ground.”
translation:
  language: zh_hans
  text: 他就说：“你做了什么？你兄弟的血的声音[a]正从地里向我呼喊。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “血”在希伯来文中是复数形式，常用于流血事件的语境；中文通常仍译作“血”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 他就说
  rationale: 以“就”承接希伯来叙事中的连续动作；动词所含的第三人称主语按上下文译为“他”，不在本节中额外补出神名。
- source_word: מֶה עָשִׂיתָ
  choice: 你做了什么？
  rationale: 保留直接质问的简洁和力度；现代汉语无需用时态形式另行表达行为已经发生及其当前后果。
- source_word: קוֹל דְּמֵי אָחִיךָ
  choice: 你兄弟的血……呼喊
  rationale: קוֹל与צֹעֲקִים共同构成血发声呼喊的拟人意象。汉语若直译为“你兄弟之血的声音正在呼喊”显得生硬，因此以动词“呼喊”自然承载“声音”的语义，同时完整保留血亲自发声的形象。
- source_word: דְּמֵי
  choice: 血
  rationale: 原文为复数形式，常见于流血、血债等语境；现代汉语通常用不可数的“血”，复数形态信息收入脚注。
- source_word: אָחִיךָ
  choice: 你兄弟的
  rationale: 自然表达原文的构属关系，也延续上下文反复出现的亲属称谓。
- source_word: צֹעֲקִים
  choice: 正……呼喊
  rationale: 分词表达持续中的呼求；“正”呈现其进行意味。原文动词为复数，与复数形式的“血”一致，但汉语无需标示数的一致。
- source_word: אֵלַי
  choice: 向我
  rationale: 准确表达呼喊所指向的对象是说话者神自己。
- source_word: מִן הָאֲדָמָה
  choice: 从地里
  rationale: אֲדָמָה在该叙事中指土地、地面或土壤；“从地里”既自然，又保留血进入土地后从那里发出呼声的空间意象。
theological_decisions:
- issue: 亚伯所流之血的拟人化
  choice: 保留“血……向我呼喊”的具体拟人意象。
  alternative: 抽象译成“流血的罪向我申诉”或“血债要求伸冤”。
  rationale: 原文让血本身向神发声，含有控诉与求公义的意味，却没有把这一意象化约为单一的神学解释；正文应保留这种张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“他就说”保持上下文推进；“你做了什么”直接有力；“正从地里向我呼喊”保留原文鲜明的拟人画面，避免生硬照搬“血的声音”。
