base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/017.yaml
  text: Cain knew his wife[a], and she conceived and bore Enoch. He was building a city[d][c][b], and he named the city after his son Enoch.
translation:
  language: zh_hans
  text: 该隐与妻子同房[a]；她就怀孕，生了以诺。该隐当时正在建造一座城[b]，就给那城起名，照着他儿子以诺的名字。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语直译为“认识他的妻子”，这是指夫妻发生性关系的常用委婉说法。
    reason: cultural_note
  - marker: b
    text: 希伯来语的句式可表示持续进行的行动，因此也可译作“他在建造一座城”；有些译本则译作“他建造了一座城”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּדַע
  choice: 与妻子同房
  rationale: 希伯来语字面为“认识”，在此是指性关系的常用委婉语。现代汉语若直译“认识了他的妻子”容易误解，因此正文采用自然、庄重且准确的“同房”，并以脚注保留原文习语。
- source_word: אִשְׁתּוֹ
  choice: 妻子
  rationale: אִשָּׁה 可指“女人”或“妻子”；带所属后缀且处于婚姻语境中，译作“妻子”最自然。
- source_word: וַתַּהַר וַתֵּלֶד
  choice: 怀孕，生了
  rationale: 分别表达受孕和生产，保持原文叙事次序；现代汉语简洁自然。
- source_word: חֲנוֹךְ
  choice: 以诺
  rationale: 采用现代中文圣经传统中通行的人名音译。
- source_word: וַיְהִי בֹּנֶה עִיר
  choice: 当时正在建造一座城
  rationale: היה 与分词 בֹּנֶה 的组合可表达持续、进行中的行动；“正在建造”比简单的“建了一座城”更能体现这一语法特征。“当时”用于自然呈现背景性叙述，不额外断定事件之间的时间间隔。
- source_word: וַיִּקְרָא שֵׁם הָעִיר כְּשֵׁם בְּנוֹ
  choice: 照他儿子以诺的名字给那城取名
  rationale: 原文较直译为“照他儿子的名叫那城的名”。中文采用惯用的“照……的名字给……取名”，既传达命名上的对应关系，也避免生硬重复。
theological_decisions: []
