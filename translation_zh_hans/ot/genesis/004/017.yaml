revisions:
- from: 该隐与妻子同房[a]；她就怀孕，生了以诺。该隐当时正在建造一座城[b]，就照他儿子以诺的名字给那城取名。
  to: 该隐与妻子同房[a]；她就怀孕，生了以诺。该隐当时正在建造一座城[b]，就给那城起名，照着他儿子以诺的名字。
  rationale: 修订仅更正脚注b中不忠实的替代译法，并微调末句语序以提升现代汉语自然度。正文继续保留“正在建造”所反映的原文进行性可能，未将有争议的语法细微差别绝对化。
