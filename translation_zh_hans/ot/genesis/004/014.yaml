  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: הֵן֩ גֵּרַ֨שְׁתָּ אֹתִ֜/י הַ/יּ֗וֹם מֵ/עַל֙ פְּנֵ֣י הָֽ/אֲדָמָ֔ה וּ/מִ/פָּנֶ֖י/ךָ אֶסָּתֵ֑ר וְ/הָיִ֜יתִי נָ֤ע וָ/נָד֙ בָּ/אָ֔רֶץ וְ/הָיָ֥ה כָל מֹצְאִ֖/י יַֽהַרְגֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/014.yaml
  text: Look[a], today you have driven me away from the face of the ground, and I will be hidden from your face. I will be a wanderer and a fugitive on the earth[b], and whoever finds me will kill me.
translation:
  language: zh_hans
  text: “看哪，今天你把我从地面上赶走；我也必从你面前藏起来[a]。我必在地上[b]漂泊流离；凡遇见我的，都要杀我。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我也必从你面前被隐藏。”原文直译为“从你的面前”；此动词可理解为反身或被动。按意思也可译为“我也必躲避你的同在”或“我也必被隐藏，不在你的同在中”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“在这片土地上”。希伯来语אֶרֶץ可指“大地”，也可指某片“土地”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: 看哪
  rationale: 这是用于强调并引起注意的语气词。“看哪”在现代中文中庄重而清楚，也保留了该词突出的语用功能。
- source_word: גֵּרַשְׁתָּ אֹתִי
  choice: 你把我……赶走
  rationale: גרשׁ表示驱逐、赶出；“赶走”自然地传达了被迫离开的含义。
- source_word: מֵעַל פְּנֵי הָאֲדָמָה
  choice: 从地面上
  rationale: 原文直译为“从土地的面上”。“地面上”保留其空间意象，并与上下文中该隐和土地（אֲדָמָה）的关系相呼应。
- source_word: וּמִפָּנֶיךָ אֶסָּתֵר
  choice: 我也必从你面前隐藏起来
  rationale: אֶסָּתֵר是尼法勒形态，可有被动或反身意味；“隐藏起来”在中文中自然，并保留“从你面前”这一具体的希伯来语意象，而不直接替换为抽象的“同在”。
- source_word: נָע וָנָד
  choice: 漂泊流离
  rationale: 这对近义词共同描写居无定所、不断迁徙的状态。“漂泊流离”保留双重表达，同时符合庄重的现代中文。
- source_word: בָּאָרֶץ
  choice: 在地上
  rationale: אֶרֶץ既可指“大地”，也可指某片“土地”。此处“在地上”适合原初叙事的广阔背景，同时在脚注中保留地域性的可能。
- source_word: כָל מֹצְאִי
  choice: 凡遇见我的
  rationale: כָל加分词构成开放性的全称表达；“凡遇见我的”简洁地传达“任何遇见我的人”。
- source_word: יַהַרְגֵנִי
  choice: 都要杀我
  rationale: הרג是普通的“杀死”；“杀我”是清楚、直接的现代中文表达。
theological_decisions:
- issue: וּמִפָּנֶיךָ אֶסָּתֵר中神之“面”的临在意象及动词语态
  choice: 我也必从你面前隐藏起来
  alternative: 我也必不能见你的面／我也必躲避你的同在
  rationale: 正文保留原文“从你的面前”这一关系性意象，并用可兼具反身色彩的“隐藏起来”表达尼法勒形态，而不把它限定为该隐主动躲避，或上帝使他无法亲近。脚注说明被动与反身两种理解。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“看哪”保留原文的强调语气；“漂泊流离”兼顾两个并列词的节奏与含义。正文中的[a]、[b]均与脚注对应。
