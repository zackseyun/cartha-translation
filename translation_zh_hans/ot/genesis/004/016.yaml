reference: Genesis 4:16
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יֵּ֥צֵא קַ֖יִן מִ/לִּ/פְנֵ֣י יְהוָ֑ה וַ/יֵּ֥שֶׁב בְּ/אֶֽרֶץ נ֖וֹד קִדְמַת עֵֽדֶן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/016.yaml
  text: Then Cain went out from before Yahweh and settled in the land of Nod[a], east of Eden.
translation:
  language: zh_hans
  text: 于是，该隐从耶和华面前出去，住在伊甸东边的挪得地[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “挪得”这个名字的读音与希伯来语中表示“漂泊”的词相近，呼应本章前文对该隐的判决。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: 出去
  rationale: 保留 יצא 表示向外移动的具体含义；“出去”自然简洁，不额外说明离去的方式或心理状态。
- source_word: מִלִּפְנֵי
  choice: 从……面前
  rationale: 贴近希伯来语“从……面前”的空间—关系性表达，也保留该隐与上帝疏离的叙事张力，不直接解释为无法处于上帝的临在中。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名形式呈现四字神名，而不是用“主”这一称号替代。
- source_word: וַיֵּשֶׁב
  choice: 住在
  rationale: ישב 在此表示居住、定居；“住在”符合现代汉语叙事，也不强行判定是永久定居。
- source_word: בְּאֶרֶץ נוֹד
  choice: 在……挪得地
  rationale: נוֹד 在句中用作地名，采用音译“挪得”；它与“漂泊”一词的语音关联另以脚注说明。
- source_word: קִדְמַת עֵדֶן
  choice: 伊甸东边
  rationale: 准确传达相对于伊甸的东方方位，表达简洁自然。
- source_word: עֵדֶן
  choice: 伊甸
  rationale: 采用该地名在现代中文圣经传统中通行的音译。
theological_decisions:
- issue: 如何表达该隐相对于耶和华的离去
  choice: 该隐从耶和华面前出去
  alternative: 该隐离开耶和华的临在
  rationale: “从……面前出去”更直接对应原文，并保留空间表达与关系疏离之间的张力；“离开……的临在”较具解释性，可能使读者误以为人能完全脱离上帝的临在。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准普通话。“于是”承接叙事；保留“从耶和华面前出去”的原文意象及神学张力。脚注标记已在正文相应地名后列出。
