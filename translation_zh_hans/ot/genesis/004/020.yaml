base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/020.yaml
  text: Adah bore Jabal[a]; he was the father of those who dwell in tents and have livestock.
translation:
  language: zh_hans
  text: 亚大生了雅八；雅八是住帐篷、牧养牲畜之人的始祖[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“父亲”，在这里可指某一群体的祖先、某种生活方式的开创者或典型先驱。也可译作：“他是住帐篷、牧养牲畜之人的祖先。”
    reason: 说明希伯来语 אָב（父亲）在文化谱系语境中的宽泛含义，并保留可行的译法。
lexical_decisions:
- source_word: וַתֵּלֶד
  choice: 生了
  rationale: 该动词在家谱叙述中表示女子生育孩子；“生了”简洁自然，符合现代汉语的家谱表达。
- source_word: עָדָה
  choice: 亚大
  rationale: 采用现代中文圣经中通行且易辨识的人名音译。
- source_word: יָבָל
  choice: 雅八
  rationale: 采用现代中文圣经中通行且易辨识的人名音译。
- source_word: הוּא הָיָה
  choice: 雅八是
  rationale: 希伯来文直译为“他是”；中文重复人名可清楚指明主语，避免代词指向含混。
- source_word: אֲבִי
  choice: 始祖
  rationale: 这里的“父亲”并非只指直接生父，而可表示某一生活方式或群体的祖先、开创者；“始祖”在正文中自然表达这种文化谱系意义，脚注保留原文隐喻及其语义范围。
- source_word: יֹשֵׁב אֹהֶל
  choice: 住帐篷……之人
  rationale: 单数分词具有集合意义，指以住帐篷为生活特征的一类人；译成“……之人”符合汉语习惯。
- source_word: וּמִקְנֶה
  choice: 牧养牲畜
  rationale: מִקְנֶה指牲畜、畜群；原文以名词并列，语境指与帐篷生活相连的畜牧方式。补出“牧养”使现代汉语关系明确，同时不把牲畜限缩为牛。
theological_decisions:
- issue: “父亲”在文化谱系中的含义
  choice: 正文译作“始祖”，并以脚注说明原文直译及语义范围
  alternative: 直译为“父亲”或译为“祖先／开创者”
  rationale: 此处不是在断言雅八是所有相关人士的直接生父，而是把他描述为这一群体或生活方式的源头人物。“始祖”兼顾谱系和开创意义，但原文可能涵盖祖先、创始者或典型先驱，因此在脚注中保留张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“帐篷”比旧式“帐棚”更符合当代常用词形；句中重复“雅八”以提升独立经节的清晰度。
