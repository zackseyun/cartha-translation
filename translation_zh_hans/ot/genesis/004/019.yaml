  text: וַ/יִּֽקַּֽח ל֥/וֹ לֶ֖מֶךְ שְׁתֵּ֣י נָשִׁ֑ים שֵׁ֤ם הָֽ/אַחַת֙ עָדָ֔ה וְ/שֵׁ֥ם הַ/שֵּׁנִ֖ית צִלָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/019.yaml
  text: Lamech took for himself two wives[a]. The name of the one was Adah[b], and the name of the other was Zillah.
translation:
  language: zh_hans
  text: 拉麦娶了两个妻子：一个名叫亚大，另一个名叫洗拉。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקַּח לוֹ
  choice: 娶了
  rationale: לקח在婚姻语境中与“妻子”连用，惯用义是“娶”；现代汉语若直译为“为自己取了”会显得生硬。“娶了”自然、明确，也没有增添原文以外的评价。
- source_word: שְׁתֵּי נָשִׁים
  choice: 两个妻子
  rationale: נָשִׁים既可指“女人”，也可指“妻子”；与婚姻语境中的לקח连用时，明确指妻子。
- source_word: שֵׁם הָאַחַת
  choice: 一个名叫
  rationale: 以自然现代汉语表达希伯来文“一个的名字是”这一命名句式，同时保留二者对举的结构。
- source_word: עָדָה
  choice: 亚大
  rationale: 采用现代中文圣经传统中通行的人名音译。
- source_word: וְשֵׁם הַשֵּׁנִית
  choice: 另一个名叫
  rationale: הַשֵּׁנִית字面为“第二个”，但在仅有两人的语境中，汉语“另一个”更自然，并准确表达两者中的后一位。
- source_word: צִלָּה
  choice: 洗拉
  rationale: 采用现代中文圣经传统中通行的人名音译。
theological_decisions:
- issue: 是否明确这是一个男子同时有两个妻子的婚姻安排
  choice: 译作“娶了两个妻子”，不附加道德评价
  alternative: 译作“娶了两个女人”，或加入褒贬说明
  rationale: 本节清楚叙述拉麦有两个妻子，却没有在本句中直接评价此事；译文应如实陈述，而不把额外的伦理或教义判断加入正文。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“娶了”比字面对译“为自己取了”更符合汉语婚姻表达；用冒号引出两位妻子的名字，使句式清楚流畅。
