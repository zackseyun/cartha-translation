base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/023.yaml
  text: 'And Lamech said to his wives[a], “Adah and Zillah, hear my voice; wives of Lamech, listen to my word: for I have killed a man for wounding me[b], even a young man for striking me.”'
translation:
  language: zh_hans
  text: 拉麦对他的妻子们说：“亚大、洗拉，听我的声音！拉麦的妻子们，侧耳听我的话！我杀了一个人[b]，因为他伤了我；杀了一个青年，因为他打了我[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我因我的伤口杀了一个人，因我的伤痕杀了一个青年。”希伯来语较直译的表达使用“伤口”和“伤痕”这两个名词。
    reason: lexical_alternative
  - marker: b
    text: 有些人把拉麦的话理解为威胁或一般性的夸口，例如：“我会因一个人伤我而杀他，因一个青年打我而杀他”，而不是报告一次实际发生的杀人事件。
    reason: alternative_reading
lexical_decisions:
- source_word: לְנָשָׁיו
  choice: 对他的妻子们
  rationale: 上下文明确指拉麦的两位妻子；“妻子们”准确保留复数，且符合现代汉语。
- source_word: שְׁמַעַן קוֹלִי
  choice: 听我的声音
  rationale: 保留“声音”这一具体意象，并与下句的命令形成诗歌平行。
- source_word: הַאְזֵנָּה אִמְרָתִי
  choice: 侧耳听我的话
  rationale: “侧耳听”体现使役词形所表达的留心倾听；“我的话”自然传达单数名词“言语、话语”。
- source_word: הָרַגְתִּי
  choice: 我杀了
  rationale: 完成式最直接地表述已经发生的杀人行为；不在正文中擅自改成假设或威胁语气。
- source_word: אִישׁ
  choice: 一个男人
  rationale: 保留其通常含义，也维持它与下句“年轻人”的年龄或身份对照。
- source_word: לְפִצְעִי
  choice: 因他使我受伤
  rationale: 将介词短语自然理解为报复的缘由，同时用脚注保留较直译的名词表达。
- source_word: יֶלֶד
  choice: 一个年轻人
  rationale: 此词可指孩子、少年或青年；在与“男人”平行的暴力语境中，“年轻人”既体现较年轻，也不武断限定为幼童。
- source_word: לְחַבֻּרָתִי
  choice: 因他击打我
  rationale: 自然表达造成伤痕或瘀伤的行为，并与前句“使我受伤”稍作区别；较直译形式列于脚注。
theological_decisions:
- issue: 拉麦的话是已发生之事的陈述，还是威胁或一般性的夸口
  choice: 正文按完成式的通常意义译为“我杀了”，作为实际行为的陈述
  alternative: 也有人理解为“谁伤我，我就会杀谁”一类的威胁或概括性夸口
  rationale: 希伯来语完成式最自然地指向已经发生的行为，但语境容许修辞性或情态性的理解，因此将另一解释收入脚注，不在正文中消除张力。
- issue: 杀人行为是报复还是自卫
  choice: 译作“因他使我受伤……因他击打我”，只交代行为缘由
  alternative: 可进一步理解为因自卫而杀人
  rationale: 原文没有明确说明自卫，也没有为拉麦作道德辩护；译文避免加入这一判断。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语，并保留原文诗歌中的称呼、命令式平行和两行递进结构。“侧耳听”略带文学色彩，但仍属现代读者容易理解的表达。
