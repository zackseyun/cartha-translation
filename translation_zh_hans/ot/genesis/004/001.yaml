  text: וְ/הָ֣/אָדָ֔ם יָדַ֖ע אֶת חַוָּ֣ה אִשְׁתּ֑/וֹ וַ/תַּ֨הַר֙ וַ/תֵּ֣לֶד אֶת קַ֔יִן וַ/תֹּ֕אמֶר קָנִ֥יתִי אִ֖ישׁ אֶת יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/001.yaml
  text: The man knew Eve his wife[a], and she conceived and bore Cain, and said[b], “I have acquired a man with Yahweh.”
translation:
  language: zh_hans
  text: 那人和妻子夏娃同房[a]，夏娃怀孕，生下该隐[b]。她说：“我与雅威一同得了一个男子[c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “同房”直译为“认识”；这里是夫妻发生性关系的委婉说法。
    reason: source_idiom
  - marker: b
    text: “该隐”（Qayin）在希伯来语中与下文译作“得了”的词（qaniti）读音相近。
    reason: wordplay
  - marker: c
    text: 希伯来语直译近于“我得了一个男子，与雅威”。这句话也可理解为“我从雅威得了一个男子”；较不可能的解释是“我得了一个男子——雅威”。正文按与雅威一同、承认他帮助的理解翻译。
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָאָדָם
  choice: 那人
  rationale: 此处特指前文已经出现的男性，而不是泛指人类；句首连接词按现代汉语叙事习惯不必机械译出。
- source_word: יָדַע
  choice: 同房
  rationale: 原义是“认识”，在这里是表示夫妻性关系的委婉语。正文采用现代汉语清楚而庄重的对应表达，并在脚注保留希伯来语原有意象。
- source_word: אֶת חַוָּה אִשְׁתּוֹ
  choice: 同妻子夏娃
  rationale: 自然表达夏娃与那人的婚姻关系，同时保留专名。
- source_word: וַתַּהַר וַתֵּלֶד
  choice: 就怀孕，生下
  rationale: 准确而简洁地呈现连续发生的受孕和生产。
- source_word: קַיִן
  choice: 该隐
  rationale: 采用现代中文圣经传统中通行的人名译法；希伯来语中的语音双关另以脚注说明。
- source_word: קָנִיתִי
  choice: 得了
  rationale: קנה在这里表示取得、获得；“得了”自然简洁，也适合生育语境，但希伯来语中它与“该隐”的语音联系只能在脚注中说明。
- source_word: אִישׁ
  choice: 一个男子
  rationale: 原文使用通常表示“男人、男子”的אִישׁ，而没有使用“儿子”或“男婴”；保留这一略显出人意料的措辞。
- source_word: אֶת יְהוָה
  choice: 靠着雅威
  rationale: 此处אֶת的句法含义存在争议。正文按伴随或协助理解，表达夏娃承认雅威参与并帮助她得子；其他可能理解在脚注中保留。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来语神名YHWH的常见学术读音音译为“雅威”，不以称号“主”代替神名。
theological_decisions:
- issue: 夏娃所说אֶת יְהוָה的理解
  choice: 我靠着雅威得了一个男子
  alternative: “我同雅威得了一个男子”或“我从雅威得了一个男子”；较不可能的是“我得了一个男子——雅威”
  rationale: 希伯来语结构高度凝练，אֶת既可能表达伴随或关联，也曾被理解为来源，甚至被视为直接宾语标记。正文采用符合生育语境的神助理解，却以脚注明示真正的歧义，不把孩子认同为雅威，也不宣称原文只能有一种解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“同房”清楚传达希伯来语委婉语的实际含义；“一个男子”有意保留原文אִישׁ，而不顺译成“儿子”或“男婴”。神名采用“雅威”。
