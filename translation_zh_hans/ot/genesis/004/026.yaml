base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/026.yaml
  text: And to Seth also a son was born[a], and he called his name Enosh[b]. At that time people began to call on the name of Yahweh.
translation:
  language: zh_hans
  text: 塞特也得了一个儿子，他给儿子起名叫以挪士。那时，人们开始求告雅威的名。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译近于：“那时，求告雅威的名这件事开始了。”
    reason: 保留 הוּחַל 的非人称被动结构及原文未明说施事者的特点。
  - marker: b
    text: 少数人把这里的动词理解为“被亵渎”，因而译作：“那时，人们开始亵渎雅威的名。”
    reason: 保留 הוּחַל 的另一种词根分析及由此产生的少数解释。
lexical_decisions:
- source_word: וּלְשֵׁת גַּם הוּא יֻלַּד בֵּן
  choice: 塞特也得了一个儿子
  rationale: 希伯来文直译近于“塞特也有一个儿子为他而生”。中文用“得了一个儿子”自然表达其含义，同时避免“塞特生了”可能造成由父亲分娩的误解。
- source_word: וַיִּקְרָא אֶת־שְׁמוֹ אֱנוֹשׁ
  choice: 他给儿子起名叫以挪士
  rationale: “叫他的名为”是希伯来语命名惯用式；译作“给儿子起名叫”符合现代汉语，也明确代词所指。
- source_word: אֱנוֹשׁ
  choice: 以挪士
  rationale: 采用现代中文圣经读者较熟悉的专名音译；此处是人名，虽与表示“人、必死的人”的普通名词相关，但正文不把词义直接译出。
- source_word: אָז
  choice: 那时
  rationale: 简洁保留时间推进的作用。
- source_word: הוּחַל
  choice: 人们开始
  rationale: 该被动形态直译为“开始了”，在无明确主语的语境中，现代汉语以泛指主语“人们”表达最自然；原文的非人称被动形式在脚注中保留。
- source_word: לִקְרֹא בְּשֵׁם
  choice: 求告……的名
  rationale: 这一希伯来语惯用语在本语境中通常指带有敬拜意味的呼求或祈求；“求告……的名”既准确又符合庄重的现代中文表达。
- source_word: יְהוָה
  choice: 雅威
  rationale: 原文直接使用四字神名；译作专名“雅威”，而不以“主”这一称号替代。
theological_decisions:
- issue: הוּחַל לִקְרֹא בְּשֵׁם יְהוָה 的解释
  choice: 人们开始求告雅威的名
  alternative: “开始有人求告雅威的名”；少数解释作“人们开始亵渎雅威的名”
  rationale: 主流理解把 הוּחַל 视为表示动作开始，并把 קרא בשם 理解为呼求神名。由于原文采用非人称被动，且 הוּחַל 也曾被联系到“亵渎”义，脚注保留这些真实存在的解释空间。
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 正文保留其专名性质，以音译“雅威”呈现，不用称号替代；其他中文传统译法不改变此处所指。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“得了一个儿子”避免生硬直译和性别角色误读；“求告……的名”保留经文惯用语的宗教语感。两个脚注标记均置于相关末句之后。
