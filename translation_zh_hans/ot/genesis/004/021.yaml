base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/021.yaml
  text: And the name of his brother was Jubal[c][b][a]; he was the father of all who play the lyre and the pipe.
translation:
  language: zh_hans
  text: 他兄弟的名字叫犹八；他是一切弹奏[a]里拉琴和管笛[b]之人的始祖[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“拿着”或“操持”。希伯来语动词的字面意思是“抓住、拿住”，但这里指演奏乐器。
    reason: lexical_alternative
  - marker: b
    text: “管笛”也可译作“笛”或“芦管”；希伯来语 עוּגָב 所指古代乐器的确切形制不能确定。
    reason: lexical_alternative
  - marker: c
    text: “始祖”直译为“父亲”；这里可能指这类乐师的祖先、先驱或创始者，并不一定是所有这类人的直接生父。
    reason: cultural_note
lexical_decisions:
- source_word: וְשֵׁם אָחִיו
  choice: 他兄弟名叫
  rationale: 按希伯来语的亲属关系表达，所指为上一节的雅八；中文用“他兄弟名叫”自然承接家谱叙述。
- source_word: יוּבָל
  choice: 犹八
  rationale: 采用现代中文圣经中通行的人名音译。
- source_word: הוּא הָיָה
  choice: 他是
  rationale: 直接表达希伯来语的强调性判断，不额外译成“成为”。
- source_word: אֲבִי
  choice: 始祖
  rationale: 此处处于文化起源的叙述中，表示某一类人的先驱、创始者或祖先；“始祖”既保留起源含义，也避免让读者误解为每位乐师的直接生父。
- source_word: כָּל תֹּפֵשׂ
  choice: 所有演奏……之人
  rationale: תֹּפֵשׂ字面为“抓住、拿住”，以乐器为宾语时按语境译作“演奏”；“所有……之人”保留כָּל所概括的群体。
- source_word: כִּנּוֹר
  choice: 里拉琴
  rationale: 该词所指通常更接近里拉琴，而不是现代竖琴；此译名较为准确。
- source_word: עוּגָב
  choice: 管笛
  rationale: 古代乐器的确切形制无法确定，但一般理解为管状吹奏乐器；“管笛”避免过度限定为某一种现代笛类。
