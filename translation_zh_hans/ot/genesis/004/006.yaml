  text: וַ/יֹּ֥אמֶר יְהוָ֖ה אֶל קָ֑יִן לָ֚/מָּה חָ֣רָה לָ֔/ךְ וְ/לָ֖/מָּה נָפְל֥וּ פָנֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/006.yaml
  text: Then Yahweh said to Cain[a], “Why are you angry, and why has your face fallen?”
translation:
  language: zh_hans
  text: 于是雅威对该隐说：“你为什么发怒？你的脸为什么沉下来[a]？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“为什么你的脸落下了？”也可译作“为什么面带愁容？”
    reason: 保留希伯来语“脸落下”的身体意象，并列出自然的解释性译法；正文不将其情绪含义限于单一状态。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 未另译连接词；希伯来语叙事中的连续式在此推进情节，现代汉语可借语序自然表达，无须机械加上“然后”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来语四字神名的通行拟音译作“雅威”，保留其专名性质，不以称号代替。
- source_word: קָיִן
  choice: 该隐
  rationale: 采用现代中文《圣经》中通行的人名译法。
- source_word: לָמָּה
  choice: 为什么
  rationale: 直接、自然地表达询问原因的疑问词；原文两次出现，译文也保留两次。
- source_word: חָרָה לָךְ
  choice: 你为什么发怒
  rationale: 该习语字面涉及“烧起来”，在本句中表示怒气；“发怒”既准确又符合现代汉语表达。
- source_word: נָפְלוּ פָנֶיךָ
  choice: 沉下脸来
  rationale: 原文直译为“你的脸为什么落下”；“沉下脸来”保留脸部向下的形象，也自然表达神情阴沉、沮丧或不悦，避免把情绪限定得过窄。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。译作“雅威”保留专名，并较贴近学界通常重构的读音；不以“上主”等称号替代。
- issue: “脸落下”所表达的情绪
  choice: 沉下脸来
  alternative: 面带愁容；垂头丧气；脸色阴沉
  rationale: 上下文明确涉及该隐发怒，但“脸落下”本身可涵盖沮丧、不悦或阴沉。正文保留较宽的形象性表达，不把它专断地解释为单一情绪。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。问句简洁直接；“沉下脸来”是普通读者易懂的现代表达，同时借脚注保留原文的字面意象与语义空间。
