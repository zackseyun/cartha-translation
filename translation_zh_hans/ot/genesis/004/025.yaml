source:
  edition: WLC
  text: וַ/יֵּ֨דַע אָדָ֥ם עוֹד֙ אֶת אִשְׁתּ֔/וֹ וַ/תֵּ֣לֶד בֵּ֔ן וַ/תִּקְרָ֥א אֶת שְׁמ֖/וֹ שֵׁ֑ת כִּ֣י שָֽׁת לִ֤/י אֱלֹהִים֙ זֶ֣רַע אַחֵ֔ר תַּ֣חַת הֶ֔בֶל כִּ֥י הֲרָג֖/וֹ קָֽיִן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/025.yaml
  text: And Adam knew his wife again[a], and she bore a son and called his name Seth, for she said, “God has appointed for me another offspring in place of Abel, because Cain killed him.”
translation:
  language: zh_hans
  text: 亚当又与妻子同房。她生了一个儿子，给他起名叫塞特，说：“上帝为我立了[a]另一个后裔，代替亚伯，因为该隐杀了他。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “立了”所译的希伯来语动词有“设立、安置”的意思；在希伯来语中，它与“塞特”一名读音相近，构成双关。
    reason: 说明原文中无法在中文正文完整重现的词义和命名双关。
lexical_decisions:
- source_word: וַיֵּדַע
  choice: 与妻子同房
  rationale: יָדַע（“知道、认识”）与妻子连用，是希伯来语对性关系的惯用委婉说法。直译为“认识妻子”在现代汉语中无法传达此义；“同房”既明确又保持委婉、庄重的叙事语体。
- source_word: אָדָם
  choice: 亚当
  rationale: 此处指人物专名，而非泛指“人”；采用现代中文通行译名。
- source_word: עוֹד
  choice: 又
  rationale: 表示动作再次发生；“又”在现代汉语叙事中自然简洁。
- source_word: וַתֵּלֶד בֵּן
  choice: 她生了一个儿子
  rationale: 准确表达“生”与“儿子”，符合自然现代汉语。
- source_word: וַתִּקְרָא אֶת־שְׁמוֹ
  choice: 给他起名叫
  rationale: 希伯来语字面为“叫他的名字”；采用汉语常用的命名表达，同时保留命名叙事的功能。
- source_word: שֵׁת
  choice: 塞特
  rationale: 采用该人名的现代中文通行音译。
- source_word: שָׁת
  choice: 另立了
  rationale: שִׁית意为“放置、设立”。“立了”贴近其基本意义，也尽可能显出它与“塞特”之间的希伯来语语音双关；“另”与后面的אַחֵר共同自然表达替代性的赐予。
- source_word: זֶרַע
  choice: 后裔
  rationale: זֶרַע字面为“种子”，用于人时可指子嗣或后代。“后裔”保留其生育和延续后代的意味，不把它过度收窄为一般的“孩子”。
- source_word: תַּחַת
  choice: 代替
  rationale: 此处表达替代关系，而非空间上的“在……下面”；“代替亚伯”简明准确。
- source_word: הֲרָגוֹ
  choice: 杀了他
  rationale: הרג是“杀死”的常用动词；不译作更具法律或道德定性的“谋杀”，以免超出本句的词汇表达。
theological_decisions:
- issue: 如何表达夏娃对塞特之名的解释
  choice: 上帝为我另立了一个后裔
  alternative: 上帝赐给我另一个孩子／上帝为我安置了另一个后代
  rationale: 译文保留上帝作为赐予者的陈述，也以“立了”贴近שָׁת的本义，并借脚注说明它与שֵׁת（塞特）的语音双关。未将“后裔”仅解释成远期的某位后代，也未引入经文没有明说的救赎角色。
- issue: 是否直译“认识妻子”这一性关系委婉语
  choice: 与妻子同房
  alternative: 认识他的妻子／再次亲近妻子
  rationale: 现代汉语中的“认识”不具备原文这一固定委婉义，容易造成误解；“同房”以汉语自身的委婉表达传达相同语用功能，而不作粗俗或过度具体的描述。
- issue: זֶרַע在本句中的单数与集合含义
  choice: 一个后裔
  alternative: 另一个孩子／另一份后代
  rationale: 本句直接指刚出生的塞特，但זֶרַע也带有子嗣延续的语义。“一个后裔”让眼前的个人指称保持清楚，同时不过早排除其后代延续的含义。
translation_notes:
  register: 采用自然、庄重、易懂的现代标准汉语。“同房”保留原文的委婉语气；“给他起名叫”符合现代叙事习惯；引语简洁保留原文关于上帝赐予、亚伯被替代及该隐杀人的因果结构。脚注标记置于产生双关的“立了”之后。
