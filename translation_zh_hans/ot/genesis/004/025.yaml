- from: 亚当又与妻子同房。她生了一个儿子，给他起名叫塞特，说：“上帝为我另立了[a]一个后裔，代替亚伯，因为该隐杀了他。”
  to: 亚当又与妻子同房。她生了一个儿子，给他起名叫塞特，说：“上帝为我立了[a]另一个后裔，代替亚伯，因为该隐杀了他。”
  rationale: 将“另立了一个后裔”改为“立了另一个后裔”，消除汉语中重复表达的‘另一’意义，并更清晰对应原文动词与形容词的句法角色。脚注仅作措辞澄清，保留其原有功能和锚点。
