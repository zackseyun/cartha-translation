base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/018.yaml
  text: To Hanok was born Irad[a], and Irad fathered Mehujael, and Mehujael fathered Methushael, and Methushael fathered Lamech.
translation:
  language: zh_hans
  text: 哈诺生了伊拉德；伊拉德生了米户雅埃勒[a]，米户雅埃勒生了玛土沙埃勒，玛土沙埃勒生了拉麦。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节希伯来文对这个名字用了两种拼写：米户雅埃勒和米希雅埃勒。
    reason: textual_variant
lexical_decisions:
- source_word: וַיִּוָּלֵד לַחֲנוֹךְ
  choice: 哈诺得了
  rationale: 原文以 ילד 的尼斐勒式表达“有一个孩子为哈诺所生”。“哈诺得了”在现代汉语中自然地保留被动出生结构的意味，也避免把首句完全处理成后文主动的“生了”。
- source_word: עִירָד
  choice: 伊拉德
  rationale: 按希伯来语人名音译。
- source_word: יָלַד
  choice: 生了
  rationale: 在父系家谱中，主动式 ילד 表示生育、成为某人的父亲；“生了”简洁自然，并符合现代汉语家谱表达。
- source_word: מְחוּיָאֵל / מְחִיּיָאֵל
  choice: 米户雅埃勒
  rationale: 本节同一人名出现两种希伯来文拼写；正文统一采用一个音译以便阅读，拼写差异在脚注说明。
- source_word: מְתוּשָׁאֵל
  choice: 玛土沙埃勒
  rationale: 按希伯来语形式音译，并以“埃勒”反映词尾 אֵל。
- source_word: לָמֶךְ
  choice: 拉麦
  rationale: 采用现代中文圣经读者熟悉、且与希伯来语相近的音译。
