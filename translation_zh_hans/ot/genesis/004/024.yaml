base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/024.yaml
  text: For Cain is avenged sevenfold[b][a], and Lamech seventy-sevenfold.
translation:
  language: zh_hans
  text: '因为，为该隐报仇，必报七倍[a]；

    为拉麦报仇，必报七十七倍[b]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“为该隐报仇，报七倍。”希伯来语动词为被动未完成式，可理解为格言性的确定陈述，也可表示必然实现的将来。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语直译为“七十和七”，即“七十七倍”；也可表达为“七十七次”。
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上一节，为拉麦的夸口提出理由；“因为”自然保留了原文的因果连接。
- source_word: שִׁבְעָתַיִם
  choice: 七倍
  rationale: 此形式在这里表示报仇的七倍程度；“七倍”既简洁，也与下半句形成诗体对仗。
- source_word: יֻקַּם
  choice: 仇要报
  rationale: נקם的使役被动式表示某人的仇得到报复。未完成式在诗句中可表达一般性的确定事实，也可带有必然实现的将来意味；“要报”保留这种确定而尚可指向将来的语气。
- source_word: קָיִן
  choice: 该隐
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: וְלֶמֶךְ
  choice: 拉麦的仇却
  rationale: “拉麦”采用通行人名译法；连接词在递进对比中译为“却”，显明拉麦所声称的报复程度远超该隐。
- source_word: שִׁבְעִים וְשִׁבְעָה
  choice: 七十七倍
  rationale: 原文直译为“七十和七”，最自然的数值是七十七；加“倍”与上半句平行，并表达报复程度。
theological_decisions:
- issue: 拉麦报仇公式中的数值
  choice: 七十七倍
  alternative: 七十个七倍（即四百九十倍）
  rationale: 希伯来语שִׁבְעִים וְשִׁבְעָה最自然地表示“七十七”，不是“七十乘七”。这样也保留了本节自身的诗体平行，不以马太福音18:22的后期措辞反向解释本节。
- issue: 报仇动词的时态意味
  choice: 要报
  alternative: 得报
  rationale: 希伯来语未完成式既可陈述格言式的确定事实，也可表达确定将发生的报复。“要报”不把它限制为纯粹现在时，同时避免额外说明报仇的具体执行者。
translation_notes:
  register: 采用简洁、庄重而易懂的现代书面汉语，并以两行呈现原文的诗体平行。“仇要报”比生硬的被动式更符合中文习惯，同时保留原文未明说报仇执行者的特点。
