source:
  edition: WLC
  text: וַֽ/יְהִ֖י מִ/קֵּ֣ץ יָמִ֑ים וַ/יָּבֵ֨א קַ֜יִן מִ/פְּרִ֧י הָֽ/אֲדָמָ֛ה מִנְחָ֖ה לַֽ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/003.yaml
  text: And in the course of time[c][b][a], Cain brought to Yahweh an offering from the fruit of the ground.
translation:
  language: zh_hans
  text: 过了一段时间[a]，该隐拿地里的出产[b]作供物，献给雅威[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“一段日子结束之后”，意思是过了一段时间。
    reason: lexical_alternative
  - marker: b
    text: 或译：“地里的果实”。
    reason: lexical_alternative
  - marker: c
    text: “雅威”音译自希伯来文神名 יהוה（YHWH）；有些译本译作“耶和华”或“主”。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: （以叙事承接自然表达，不另译）
  rationale: 这里的叙事性连接形式承接下一个事件；现代汉语无需使用生硬的“事情发生了”，由后面的时间短语自然开启句子即可。
- source_word: מִקֵּץ יָמִים
  choice: 过了一段时间
  rationale: 该短语字面近于“一段日子结束之后”，在本语境中表示若干时间过去，并非末世意义的“末日”。
- source_word: וַיָּבֵא
  choice: 拿……献给
  rationale: בוא 的使役形式在此表示把某物带来或呈献；结合供物语境译为“拿……献给”，符合现代汉语表达。
- source_word: קַיִן
  choice: 该隐
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: מִפְּרִי הָאֲדָמָה
  choice: 地里的出产
  rationale: פְּרִי 可指果实或出产，אֲדָמָה 指土地、土壤；“地里的出产”自然涵盖农作物，同时保留与该隐耕地身份的联系。
- source_word: מִנְחָה
  choice: 供物
  rationale: מִנְחָה 可指礼物、贡物或献给神的供物；此处用“供物”既符合敬拜语境，也不把祭物类型规定得过细。
- source_word: לַיהוָה
  choice: 献给雅威
  rationale: 介词 לְ 表示供物呈献的对象；神名 יהוה 采用“雅威”音译，以区别于作为称号的“主”。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。译作“雅威”以音译方式保留专名性质，不以称号“主”取代，也避免把传统形式“耶和华”误当作原有读音。
- issue: מִקֵּץ יָמִים 的时间含义
  choice: 过了一段时间
  alternative: 在日子终结时；到了一些日子的末了
  rationale: 上下文只说明一段时间过去后该隐献上供物，没有末世论含义；采用普通叙事性的时间表达，同时以脚注保留字面形式。
- issue: 该隐供物的性质
  choice: 供物
  alternative: 祭物；素祭
  rationale: מִנְחָה 在此是广义的献礼或供物。译文不预先把它界定为后来律法中的特定祭类，也不暗示其本身合宜或不合宜。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“拿……作供物，献给……”清楚呈现动作与用途；脚注分别保留时间短语的字面意味、פְּרִי 的词义范围，以及神名的不同译法。
