  text: וְ/הֶ֨בֶל הֵבִ֥יא גַם ה֛וּא מִ/בְּכֹר֥וֹת צֹאנ֖/וֹ וּ/מֵֽ/חֶלְבֵ/הֶ֑ן וַ/יִּ֣שַׁע יְהוָ֔ה אֶל הֶ֖בֶל וְ/אֶל מִנְחָתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/004.yaml
  text: And Abel also brought some of the firstborn of his flock[a], and of their fat portions. And Yahweh regarded Abel and his offering[b],
translation:
  language: zh_hans
  text: 亚伯也献上羊群中头生的一些牲畜和它们的脂肪部分[a]。雅威眷顾亚伯和他的供物[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “脂肪部分”可能指所献牲畜中肥美、上好的脂肪部位。
    reason: cultural_note
  - marker: b
    text: “眷顾”也可译作“以恩惠看待”或“悦纳了”。原文没有说明雅威怎样显明这种态度。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/הֶבֶל
  choice: 亚伯也
  rationale: 叙事连接词 וְ 承接上文；将 גַם הוּא 的强调合并译为“也”，自然表达亚伯同样带来供物。
- source_word: הֵבִיא
  choice: 带来献上
  rationale: 该词基本义为“带来”；结合供物语境补出“献上”，使现代汉语表达完整，但不增加献祭方式等细节。
- source_word: מִבְּכֹרוֹת צֹאנוֹ
  choice: 羊群中头生的几只
  rationale: 介词 מִן 表示从整体中取出一部分；“几只”明确这里不是把全部头生牲畜都献上，同时保留“头生”的概念。
- source_word: וּמֵחֶלְבֵהֶן
  choice: 以及它们的脂油部分
  rationale: חֵלֶב 在献祭语境中可指牲畜的脂油或特定脂油部分；正文保留具体的“脂油”，不直接释为较抽象的“最好的部分”。
- source_word: וַיִּשַׁע
  choice: 垂顾了
  rationale: 该动词表示转眼关注，并在本语境中含有恩待、认可的正面意味；“垂顾”既保留观看、关注的语义，也不把回应机制明确化。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来语四字神名作音译，保留其作为名字的性质，而不以称号替代。
- source_word: אֶל הֶבֶל וְאֶל מִנְחָתוֹ
  choice: 亚伯和他的供物
  rationale: 重复的 אֶל 分别指向亚伯及其供物；汉语在“垂顾”后自然使用宾语结构，无须重复介词。
- source_word: מִנְחָתוֹ
  choice: 他的供物
  rationale: מִנְחָה 可指礼物、贡物或献给神的供物；此处用“供物”符合敬拜语境，又不把它限定为后来制度中的某一种祭。
theological_decisions:
- issue: וַיִּשַׁע 所表达的神圣回应
  choice: 译为“垂顾了”，表达雅威对亚伯及其供物的正面关注，但不说明这种关注如何显明。
  alternative: “悦纳了”或“恩待了”
  rationale: 原动词在此含有有利关注之意，却没有交代神借何种迹象表示认可；“垂顾”保留这一含义和叙事留白，脚注列出更明确的意译。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“头生”保留经文关键词；“脂油部分”保留古代献祭语境中的具体意象；“垂顾”略具庄重色彩，但在现代汉语中仍清楚自然。脚注标记已分别置于相关正文之后。
