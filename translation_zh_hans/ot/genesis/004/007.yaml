source:
  edition: WLC
  text: הֲ/ל֤וֹא אִם תֵּיטִיב֙ שְׂאֵ֔ת וְ/אִם֙ לֹ֣א תֵיטִ֔יב לַ/פֶּ֖תַח חַטָּ֣את רֹבֵ֑ץ וְ/אֵלֶ֨י/ךָ֙ תְּשׁ֣וּקָת֔/וֹ וְ/אַתָּ֖ה תִּמְשָׁל בּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/007.yaml
  text: If you do well[a], will there not be acceptance? But if you do not do well, sin is crouching at the door; its desire is for you[d][c][b], but you must rule over it.
translation:
  language: zh_hans
  text: 你若行得好，岂不可以抬起头来吗？[a]你若行得不好，罪伏在门口；[b]它渴求着你，[c]但你必须制伏它。[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “抬起头来”原文直译为“抬起”。也可能指蒙接纳，即“岂不蒙悦纳吗？”
    reason: lexical_alternative
  - marker: b
    text: “罪”也可译作“赎罪祭”；不过这里“伏着”的描写更自然地把罪比作伺伏的猛兽。
    reason: alternative_reading
  - marker: c
    text: “渴求”也可译作“欲望”或“恋慕”。参创世记3:16中的相似说法。
    reason: cross_reference
  - marker: d
    text: “你必须制伏它”也可译作“你将制伏它”或“你能够制伏它”。希伯来语在这里可表达劝诫、预告或可能性。
    reason: alternative_reading
lexical_decisions:
- source_word: תֵּיטִיב
  choice: 做得对
  rationale: 使役词形在这里指行为正确、行善，并非身体或心情“好”。“做得对”自然地表达其道德含义，也保留原文简洁的条件句式。
- source_word: שְׂאֵת
  choice: 抬起头来
  rationale: 此词本义与“抬起”有关；结合上一节该隐“沉下脸来”的语境，主文理解为重新抬起头。原文也可能表达蒙接纳，因此在脚注保留这一解释。
- source_word: לַפֶּתַח
  choice: 在门口
  rationale: 直接表达临界位置，也保留罪如猛兽在门口伺伏的鲜明意象。
- source_word: חַטָּאת
  choice: 罪
  rationale: 虽然此词也可指“赎罪祭”，但与“伏着”及后文“渴求着你”的拟兽化描写相连时，“罪”更符合当前语境。
- source_word: רֹבֵץ
  choice: 伏
  rationale: 分词描绘动物伏卧或伺机扑出的持续状态；“伏”简洁而保留潜伏威胁的形象。
- source_word: תְּשׁוּקָתוֹ
  choice: 它渴求着你
  rationale: 该名词表示欲望、渴望或趋向。“渴求着你”保留对象关系和拟人化张力，不在主文中额外加入“控制”等原文未明说的含义。
- source_word: תִּמְשָׁל בּוֹ
  choice: 你必须制伏它
  rationale: 动词表示统治、支配；在警告和劝诫的语境中，“必须制伏”自然表达命令性的力度。未完成式也可理解为预告或可能性，相关歧义在脚注保留。
theological_decisions:
- issue: 结尾是在命令该隐制伏罪、预告他将制伏罪，还是说明他能够制伏罪
  choice: 主文采用劝诫性的“你必须制伏它”
  alternative: 也可译作“你将制伏它”或“你能够制伏它”
  rationale: 希伯来语未完成式容许命令性、预告性或可能性的理解。上下文是上帝对该隐的警告，劝诫性的译法较能传达道德要求，同时脚注保留其他理解，避免把经文处理成必然应验的预言或关于人能力的完整教义陈述。
- issue: חַטָּאת在此是拟人化的“罪”还是“赎罪祭”
  choice: 主文采用拟人化的“罪”
  alternative: “赎罪祭伏在门口”
  rationale: “伏着”和“渴求着你”共同形成猛兽伺伏的意象，因此“罪”在语境中更自然；但该词确有“赎罪祭”的词义，故在脚注注明。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“做得对”比“行得好”更明确地传达道德判断；“抬起头来”承接上文该隐沉下脸来的叙事线索；“伏”“渴求”“制伏”共同保留罪如猛兽般逼近的意象。所有实质性的词义与语气歧义均通过脚注保留。
