  text: וְ/אֶל קַ֥יִן וְ/אֶל מִנְחָת֖/וֹ לֹ֣א שָׁעָ֑ה וַ/יִּ֤חַר לְ/קַ֨יִן֙ מְאֹ֔ד וַֽ/יִּפְּל֖וּ פָּנָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/005.yaml
  text: But for Cain and for his offering he had no regard[a]. So Cain became very angry[b], and his face fell.
translation:
  language: zh_hans
  text: 但耶和华却不垂顾该隐和他的供物[a]。该隐就非常恼怒，脸沉了下来[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不以恩惠看待该隐和他的供物。”
    reason: lexical_alternative
  - marker: b
    text: 原文直译：“他的脸垂下了”，形容人神色阴沉或沮丧。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶל
  choice: 对……（体现在“不垂顾……和……”中）
  rationale: 该介词在 שָׁעָה 之后标示受到注视或重视的对象，并在“该隐”和“他的供物”之前重复出现；汉语用并列宾语自然表达，无须逐一译出介词。
- source_word: מִנְחָתוֹ
  choice: 他的供物
  rationale: מִנְחָה 可指礼物、贡物或献给神的供物；本段语境是向耶和华献上物品，因此“供物”准确、简洁，也不额外限定祭物种类。
- source_word: לֹא שָׁעָה
  choice: 不垂顾
  rationale: שָׁעָה 表示注视、留意或予以重视；在此语境中含有未予悦纳性关注的意味。“不垂顾”保留“看顾、关注”的意象，又不把经文本身未说明的拒绝原因加入译文。
- source_word: וַיִּחַר ... מְאֹד
  choice: 非常恼怒
  rationale: וַיִּחַר 字面带有“发热、燃烧”的意象，惯用于怒气发作；“非常恼怒”以自然现代汉语表达这一状态和 מְאֹד 的强烈程度。
- source_word: וַיִּפְּלוּ פָּנָיו
  choice: 脸沉了下来
  rationale: 原文直译为“他的脸落下”，指外貌显出阴沉、沮丧或愠怒。“脸沉了下来”既保留面部下沉的形象，也符合现代汉语习惯，而不把情绪仅限定为悲伤。
theological_decisions:
- issue: 神对该隐及其供物的回应性质
  choice: 译作“不垂顾”，表明耶和华没有给予悦纳性的关注，但不说明原因。
  alternative: 译作“不悦纳”或“不以恩惠看待”。
  rationale: 希伯来文使用“看、留意、重视”一类动词，并未在本节解释耶和华为何如此。译文应传达拒绝性的回应，同时避免加入有关献祭方式、献祭者品格或信心状况的特定神学解释。
- issue: “脸沉下来”所表达的情绪
  choice: 保留可涵盖阴沉、沮丧和愠怒的身体意象。
  alternative: 明确译作“垂头丧气”或“神色沮丧”。
  rationale: 上下文既有强烈愤怒，也有面容下沉；原文没有把后者严格限定为单一情绪，故不宜只解释成悲伤或失望。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“垂顾”略带经文语体色彩，但普通读者仍易理解；“脸沉了下来”则以常用表达保留希伯来文的形象。主语“耶和华”承接上一节，在独立呈现本节时明确补出，以免汉语句子主语不清。
