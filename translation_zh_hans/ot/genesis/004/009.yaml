  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל קַ֔יִן אֵ֖י הֶ֣בֶל אָחִ֑י/ךָ וַ/יֹּ֨אמֶר֙ לֹ֣א יָדַ֔עְתִּי הֲ/שֹׁמֵ֥ר אָחִ֖/י אָנֹֽכִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/009.yaml
  text: Then Yahweh said to Cain[a], “Where is Abel your brother?” And he said, “I do not know. Am I my brother’s keeper?”
translation:
  language: zh_hans
  text: 雅威对该隐说：“你弟弟亚伯在哪里？”该隐回答：“我不知道[a]。难道我是我弟弟的看守人吗？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我先前不知道。”希伯来语完成式可以表示对过去情况的否认；但按这里的对话语境，这句话自然是在声称自己现在不知情。
    reason: 说明希伯来语动词时体形式容许的另一种译法。
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语中通行的音译保留四字神名，而不以“主”这一称号代替。
- source_word: וַיֹּאמֶר
  choice: 对……说／回答
  rationale: אמר的基本义是“说”。首句保留叙事性的“对……说”；第二处因直接回应提问，译作自然的“回答”，不改变原意。
- source_word: אֵי הֶבֶל אָחִיךָ
  choice: 你弟弟亚伯在哪里
  rationale: אֵי询问地点；该隐是兄长，因此现代汉语用“弟弟”准确表达上下文已明确的兄弟关系，并避免“你的兄弟”可能产生的泛称歧义。
- source_word: לֹא יָדַעְתִּי
  choice: 我不知道
  rationale: 希伯来语完成式形式上可指过去，但在当前对话中自然表达该隐声称自己现在不知情；汉语“我不知道”简洁而贴合语境。
- source_word: הֲשֹׁמֵר אָחִי אָנֹכִי
  choice: 难道我是我弟弟的看守人吗
  rationale: 疑问词הֲ在这里引出带反诘意味的问题；“看守人”保留שׁמר所含的看守、守护之义，也保留该隐对责任的推拒，而不替经文作进一步解释。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华／主
  rationale: 原文直接使用四字神名。译作“雅威”可保留专名性质，避免用称号“主”取代；“耶和华”是传统音译，但“雅威”较贴近学界通常采用的发音重构。
- issue: 该隐反问中“看守人”的责任意味
  choice: 保留具体名词“看守人”
  alternative: 译为“我有责任照顾我弟弟吗”
  rationale: 直译保留שׁמר的词义以及反问本身的神学张力，不把其中隐含的责任观直接明说。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。对话简洁直接；以“难道……吗”传达反诘语气。亲属称谓按上下文译作“弟弟”，符合现代汉语必须区分长幼的习惯。
