base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/011.yaml
  text: And it happened after Abraham’s death that God blessed Isaac his son[a], and Isaac lived by Beer-lahai-roi.
translation:
  language: zh_hans
  text: 亚伯拉罕死后，上帝赐福给他的儿子以撒；以撒住在庇耳拉海莱附近。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “庇耳拉海莱”是一口井的名字；这一希伯来语名称此前已见于创世记16:14。
    reason: cross_reference
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי מוֹת אַבְרָהָם
  choice: 亚伯拉罕死后
  rationale: וַיְהִי承接叙事，整句在现代汉语中以简洁的时间状语自然表达；无需机械译出“事情发生了”。
- source_word: וַיְבָרֶךְ אֱלֹהִים
  choice: 上帝赐福
  rationale: ברך在此直接表示赐福；אֱלֹהִים在本叙事中指独一的上帝。
- source_word: אֶת יִצְחָק בְּנוֹ
  choice: 他的儿子以撒
  rationale: 所属代词承接亚伯拉罕；按现代汉语习惯将身份说明置于人名前，同时明确以撒的父子关系。
- source_word: וַיֵּשֶׁב
  choice: 住
  rationale: ישב在此表示居住；“住”简明自然，符合叙事概述语境。
- source_word: עִם
  choice: 附近
  rationale: עִם通常意为“与”，但用于此地名之前表达空间邻近；译为“附近”可避免误解为与某人同住。
- source_word: בְּאֵר לַחַי רֹאִי
  choice: 庇耳·拉海·莱
  rationale: 作为创世记16:14已出现的井名，采用音译并以间隔号标示复合名称。
theological_decisions:
- issue: 叙事中אֱלֹהִים的译法
  choice: 上帝
  alternative: 神
  rationale: 此处无多神或泛指神明的语境；“上帝”清楚、自然地指以撒所蒙赐福的那一位，不额外引入宗派性解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。分号保留两个连续事件的紧密关系；专名使用简体中文常见的音译形式。
