base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/026.yaml
  text: Afterward his brother came out[a], and his hand was grasping Esau’s heel, so his name was called Jacob. And Isaac was sixty years old when they were born.
translation:
  language: zh_hans
  text: 随后，他的兄弟出来了，手正抓着以扫的脚跟；人就给他起名叫雅各[a]。他们出生时，以撒六十岁。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅各”这一名字在希伯来语中与“脚跟”一词形成语音联想；在后文也与“取代”之意形成双关。这里呼应他抓着以扫脚跟出生的情景。
    reason: 说明中文译名无法直接保留的人名、脚跟及后文双关之间的关联，同时不把有争议的词源解释写入正文。
lexical_decisions:
- source_word: וְאַחֲרֵי כֵן
  choice: 随后
  rationale: 表示紧接前一胎出生之后的时间顺序；“随后”简洁自然。
- source_word: יָצָא אָחִיו
  choice: 他的兄弟也出来了
  rationale: 保留原文“出来”的生动表达，也不把原文仅有的“兄弟”扩充为“孪生弟弟”。
- source_word: וְיָדוֹ אֹחֶזֶת בַּעֲקֵב עֵשָׂו
  choice: 手抓着以扫的脚跟
  rationale: 分词结构描写他出来时持续抓住脚跟的状态；“抓着”符合现代汉语叙事。
- source_word: וַיִּקְרָא שְׁמוֹ
  choice: 于是就给他起名叫
  rationale: 希伯来文动词为第三人称单数，但未明说施事者；汉语省略主语可自然保留这一点。“于是”也显出抓脚跟与命名之间的叙事联系。
- source_word: יַעֲקֹב
  choice: 雅各
  rationale: 采用中文圣经传统中通行的人名译法；脚注说明其希伯来语语音联想。
- source_word: וְיִצְחָק בֶּן שִׁשִּׁים שָׁנָה
  choice: 以撒六十岁
  rationale: 按现代汉语年龄表达自然转换希伯来语“六十岁之子”的惯用结构。
- source_word: בְּלֶדֶת אֹתָם
  choice: 他们出生时
  rationale: 表达不定式结构的时间意义，并避免补入原文未明说的分娩者。
