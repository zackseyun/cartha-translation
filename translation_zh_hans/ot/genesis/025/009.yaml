base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/009.yaml
  text: His sons Isaac and Ishmael buried him in the cave of Machpelah[a], in the field of Ephron son of Zohar the Hittite, which is opposite Mamre.
translation:
  language: zh_hans
  text: 他的儿子以撒和以实玛利把他安葬在麦比拉洞里；这洞在赫人琐辖的儿子以弗仑的田地中，那田地与幔利相对[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“在幔利前面”，或“面对幔利”。希伯来语这一说法可指位于某地标前面或与之相对。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: 把他安葬
  rationale: 该动词形式承接叙事，表示随后发生的事；现代汉语无需机械译出句首连接词。宾语代词“他”承接上一节的亚伯拉罕。
- source_word: יִצְחָק וְיִשְׁמָעֵאל בָּנָיו
  choice: 他的儿子以撒和以实玛利
  rationale: 保留两个名字与“他的儿子”之间的同位关系，并以自然汉语语序表达；“他”指亚伯拉罕。
- source_word: אֶל מְעָרַת הַמַּכְפֵּלָה
  choice: 在麦比拉洞里
  rationale: אֶל 本可表示“到、进入”，但在安葬语境中，汉语自然表达是“安葬在……里”；“麦比拉”按专名音译。
- source_word: אֶל שְׂדֵה עֶפְרֹן
  choice: 这洞在……以弗仑的田中
  rationale: 第二个 אֶל 进一步说明洞的所在。用“这洞在……田中”明确修饰关系，避免汉语误读为人被分别安葬在两个地点。
- source_word: בֶּן צֹחַר הַחִתִּי
  choice: 赫人琐辖的儿子
  rationale: 按希伯来文最自然的句法，“赫人”修饰琐辖；“……的儿子”自然表达 בֶּן 的父子关系。
- source_word: אֲשֶׁר עַל פְּנֵי מַמְרֵא
  choice: 与幔利相对
  rationale: 地理描述中的 עַל־פְּנֵי 可表示“在……前面、面对、相对”；正文采用简明的“相对”，但不加入原文未明确表达的方位。
