  source_fidelity: 原译准确表达了以撒和以实玛利安葬亚伯拉罕于麦比拉洞、该洞位于以弗仑田地中的主要信息。惟末尾关系从句 אֲשֶׁר עַל־פְּנֵי מַמְרֵא 按最近且合乎语法的先行词应指“田地”，而非“洞”；现有中文的“这洞……与幔利相对”改变了修饰对象。
