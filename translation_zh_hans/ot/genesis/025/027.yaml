  text: וַֽ/יִּגְדְּלוּ֙ הַ/נְּעָרִ֔ים וַ/יְהִ֣י עֵשָׂ֗ו אִ֛ישׁ יֹדֵ֥עַ צַ֖יִד אִ֣ישׁ שָׂדֶ֑ה וְ/יַעֲקֹב֙ אִ֣ישׁ תָּ֔ם יֹשֵׁ֖ב אֹהָלִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/027.yaml
  text: When the boys grew up[a], Esau became a skillful hunter, a man of the field, but Jacob was a quiet man[b], dwelling in tents.
translation:
  language: zh_hans
  text: 孩子们长大后，以扫成了善于打猎的人，是个常在野外的人[a]；雅各却为人纯朴[b]，住在帐篷里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “常在野外的人”直译为“田野之人”，指以野外为主要活动天地的人。
    reason: 说明希伯来语意象及生活方式上的对照。
  - marker: b
    text: “纯朴”所译的希伯来语也可指“正直”、“无可指责”、“单纯”或“完整”。
    reason: 保留תָּם在此处可能兼具品格与气质含义的词义张力。
lexical_decisions:
- source_word: וַיִּגְדְּלוּ הַנְּעָרִים
  choice: 孩子们长大后
  rationale: 在双胞胎从幼年进入成年生活的叙事语境中，动词指身体和年龄上的成长；“孩子们长大后”自然清楚。
- source_word: אִישׁ יֹדֵעַ צַיִד
  choice: 善于打猎的人
  rationale: “认识／懂得打猎的人”表达熟练掌握狩猎技能；译为“善于打猎的人”符合现代汉语习惯。
- source_word: אִישׁ שָׂדֶה
  choice: 常在野外的人
  rationale: 字面为“田野之人”，这里描述以扫以野外为活动天地的生活方式，并与雅各住在帐篷里的生活形成对照。
- source_word: אִישׁ תָּם
  choice: 为人纯朴
  rationale: תָּם可表示完整、正直、无可指责或单纯。此处“纯朴”保留其品格与生活方式上的含义，同时避免把较强的道德判断直接写入正文。
- source_word: יֹשֵׁב אֹהָלִים
  choice: 住在帐篷里
  rationale: 分词结构表示惯常的居住或生活状态；现代汉语“住在帐篷里”自然，并保留与以扫野外生活的对比。
theological_decisions:
- issue: תָּם对雅各的评价究竟偏向品格还是生活气质
  choice: 译作“纯朴”，保留正直、单纯和完整等语义空间
  alternative: 安静；正直；无可指责；单纯
  rationale: 上下文强调兄弟二人不同的生活方式，但תָּם本身也可能带有品格意味。“纯朴”既不把它缩减为安静内向，也不把它强化为明确的无罪或完美评价；脚注说明其真实歧义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“善于打猎”和“常在野外”便于普通读者理解；分号突出以扫与雅各生活方式的对照。“帐篷”沿用现代中文圣经语体中通行且易懂的写法。
