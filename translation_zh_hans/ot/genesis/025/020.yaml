base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/020.yaml
  text: Isaac was forty years old when he took Rebekah[a], the daughter of Bethuel the Aramean from Paddan-aram, the sister of Laban the Aramean[b], to be his wife.
translation:
  language: zh_hans
  text: 以撒四十岁时，娶了利百加[a]为妻。利百加是出自巴旦亚兰的亚兰人彼土利的女儿，也是亚兰人拉班的姐妹[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“取了利百加归自己为妻”；这里按现代汉语习惯译作“娶了利百加为妻”。
    reason: lexical_alternative
  - marker: b
    text: “亚兰人”准确对应原文的族名称呼，不宜理解为现代国籍意义上的“叙利亚人”。
    reason: lexical_clarification
lexical_decisions:
- source_word: וַיְהִי יִצְחָק בֶּן אַרְבָּעִים שָׁנָה
  choice: 以撒四十岁时
  rationale: 希伯来语以“是四十岁之子”的惯用结构说明年龄，并由叙事句式引出结婚时的年龄；译为“以撒四十岁时”自然、准确。
- source_word: בְּקַחְתּוֹ ... לוֹ לְאִשָּׁה
  choice: 娶了……为妻
  rationale: לקח本义为“取、带走”，在此与“归他为妻”的结构共同构成婚姻表达。现代汉语用“娶……为妻”既清楚表达语境，又保留原文公式的基本轮廓。
- source_word: רִבְקָה
  choice: 利百加
  rationale: 采用现代中文圣经读者熟悉的希伯来人名传统译名。
- source_word: בַּת בְּתוּאֵל
  choice: 彼土利的女儿
  rationale: 直接保留原文的亲属谱系说明。
- source_word: הָאֲרַמִּי
  choice: 亚兰人
  rationale: אֲרַמִּי指亚兰人；这一译法比将其等同于后世或现代意义上的“叙利亚人”更精确。
- source_word: מִפַּדַּן אֲרָם
  choice: 来自巴旦亚兰
  rationale: 将地名按通行中文形式音译，并以“来自”清楚表达介词מִן所表示的来源。
- source_word: אֲחוֹת לָבָן
  choice: 拉班的妹妹
  rationale: אחות本身可泛指姐妹；依人物关系译作现代汉语自然的“妹妹”，同时保留其谱系功能。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“娶……为妻”保持婚姻公式的明确性；第二句适度重组多个同位语，使彼土利的来源、族属以及利百加与拉班的关系清楚易读。
