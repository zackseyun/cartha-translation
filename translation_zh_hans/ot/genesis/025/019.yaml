base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/019.yaml
  text: 'These are the generations of Isaac[a], son of Abraham: Abraham fathered Isaac.'
translation:
  language: zh_hans
  text: 以下是亚伯拉罕的儿子以撒的世系[a]：亚伯拉罕生了以撒。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “世系”或译“记述”或“家系”；希伯来语 toledot 是《创世记》中反复出现的标题用语。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: 以下是
  rationale: וְ加指示词在这里引出新的叙事段落；“以下是”自然地发挥篇章标记作用，又不加入时间意义上的“现在”。
- source_word: תּוֹלְדֹת
  choice: 世系
  rationale: 这是《创世记》中反复出现的结构性标题词，可涵盖某人所出的家族谱系及相关记述；“世系”既保留公式性，也不像“后代”那样把含义限于人物名单。
- source_word: יִצְחָק
  choice: 以撒
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: בֶּן אַבְרָהָם
  choice: 亚伯拉罕的儿子
  rationale: 直接表达原文的父子关系，并以自然的现代汉语修饰“以撒”。
- source_word: הוֹלִיד
  choice: 生了
  rationale: 该使役形在家谱语境中指生育、成为父亲；男性主语已明确其父系含义。“生了”简洁自然，并保留希伯来家谱表达的重复。
- source_word: אֶת יִצְחָק
  choice: 以撒
  rationale: 宾语标记אֶת在中文中不另译，宾语人名译为“以撒”。
theological_decisions:
- issue: 《创世记》תּוֹלְדֹת标题公式的译法
  choice: 译为“世系”，保留其作为全书结构性标题的宽泛含义
  alternative: 记事；家系；后代
  rationale: 原词既可涉及家族延续，也可引出相关叙事。译作“世系”避免断定下文仅是传记或仅是后代名单，同时保持反复标题的一致性。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“亚伯拉罕……以撒”的重复保留原文家谱式强调；冒号显示前半句为段落标题，后半句开始说明谱系。
