  text: וַ/יֶּאֱהַ֥ב יִצְחָ֛ק אֶת עֵשָׂ֖ו כִּי צַ֣יִד בְּ/פִ֑י/ו וְ/רִבְקָ֖ה אֹהֶ֥בֶת אֶֽת יַעֲקֹֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/028.yaml
  text: Isaac loved Esau because game was in his mouth[a], but Rebekah loved Jacob.
translation:
  language: zh_hans
  text: 以撒爱以扫，因为他口中有野味[a]；利百加却爱雅各。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“因为野味在他口中。”这句话很可能是说，以撒喜爱以扫，是因为他喜欢以扫打来的野味。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּאֱהַב
  choice: 爱
  rationale: אָהַב在此直接表示爱；叙事中的完成式动作以现代汉语“爱”自然表达，不另加原文没有的时间副词。
- source_word: אֶת עֵשָׂו
  choice: 以扫
  rationale: 不译直接宾语标记אֶת；人名采用通行的中文圣经译名。
- source_word: כִּי
  choice: 因为
  rationale: כִּי在这里引出以撒爱以扫的原因，“因为”准确而自然。
- source_word: צַיִד
  choice: 野味
  rationale: צַיִד指猎获的动物或由狩猎所得的食物；“野味”比“鹿肉”宽泛，也比“猎物”更符合入口食用的语境。
- source_word: בְּפִיו
  choice: 他口中有
  rationale: 该短语直译为“在他口中”。正文保留原文具体而略显特殊的表达，不直接改写成“他爱吃”或“合他的口味”；脚注说明其可能含义。
- source_word: וְרִבְקָה
  choice: 利百加却
  rationale: וְ本义常为“和／而”，此处两位父母各爱一个儿子，构成明显对照；“却”自然体现这一语篇关系。
- source_word: אֹהֶבֶת
  choice: 爱
  rationale: 分词可表达持续或惯常状态；现代汉语“爱”无需额外时态标记，也与前半句形成平行。
- source_word: אֶת יַעֲקֹב
  choice: 雅各
  rationale: 不译直接宾语标记אֶת；人名采用通行的中文圣经译名。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而简明的叙事语言。“他口中有野味”刻意保留希伯来语的具体意象与一定程度的含混；以脚注帮助普通读者理解其最可能的语境含义。分号呈现两句之间的平行与对照。
