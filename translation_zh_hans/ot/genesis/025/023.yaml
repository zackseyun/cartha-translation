base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/023.yaml
  text: And Yahweh said to her[a], “Two nations are in your womb, and two peoples will be separated from within you; and one people will be stronger than the other[b], and the older will serve the younger.”
translation:
  language: zh_hans
  text: 雅威对她说：“你腹中有两个民族，两个族群将从你腹中彼此分开；一族必强过另一族，年长的必服侍年幼的。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“较大的必服侍较小的。”
    reason: 希伯来语רַב和צָעִיר既可按双生子的语境理解为“年长的、年幼的”，也可较字面地理解为“较大的、较小的”。
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语中常见的音译保留上帝的专名，不用称号替代。
- source_word: שְׁנֵי גיים
  choice: 两个国家
  rationale: גוי在这里指将由双生子发展而成的民族—政治共同体；“国家”也与下句“族群”形成同义而不重复的平行。
- source_word: בְּבִטְנֵךְ
  choice: 你腹中
  rationale: 在怀孕语境中，“腹中”自然、准确，也符合庄重的现代汉语表达。
- source_word: שְׁנֵי לְאֻמִּים
  choice: 两个族群
  rationale: לְאֻמִּים指两个人民共同体；用“族群”与前面的“国家”相区别，同时保留诗体平行。
- source_word: מִמֵּעַיִךְ יִפָּרֵדוּ
  choice: 要从你腹中分开
  rationale: 既保留“从你体内”的起点含义，也表达נפעל词形所含的分离结果；汉语采用主动形式更自然，并不指定是谁使其分开。
- source_word: וּלְאֹם מִלְאֹם יֶאֱמָץ
  choice: 一族必强过另一族
  rationale: 该结构表达两个族群之间的强弱对比；“强过”简洁地传达比较关系，并保留是力量更强还是最终占优势的语义宽度。
- source_word: וְרַב יַעֲבֹד צָעִיר
  choice: 年长的必服侍年幼的
  rationale: 在双生子语境中，רַב与צָעִיר自然指年长者与年幼者；“服侍”保留עבד可涵盖服役、臣服等关系的宽度。
theological_decisions:
- issue: וְרַב יַעֲבֹד צָעִיר中形容词所指的是年龄还是地位
  choice: 年长的必服侍年幼的
  alternative: 较大的必服侍较小的
  rationale: 上下文是腹中的双生子，因此年龄对比最符合语境；但两个形容词本身也可表示大小或尊卑，故以脚注保留较字面的译法，不把预言的含义完全限定为出生次序。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。保留原文的诗体平行：两个国家／两个族群，一族／另一族，年长的／年幼的。脚注标记置于其所说明的整句之后。
