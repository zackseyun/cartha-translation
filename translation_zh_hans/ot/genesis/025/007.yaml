  text: 'These are the days of the years of Abraham’s life that he lived: one hundred seventy-five years[a].'
translation:
  language: zh_hans
  text: 亚伯拉罕一生所活的年日是一百七十五岁。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: 就是
  rationale: 此处引出对亚伯拉罕寿数的总结；结合中文句法用“就是”承接前面的主题，避免生硬直译句首连接词。
- source_word: יְמֵי שְׁנֵי חַיֵּי אַבְרָהָם
  choice: 亚伯拉罕一生的年日
  rationale: 保留希伯来语“日子—年数—生命”的叠合表达，以中文圣经语体中自然且庄重的“一生的年日”传达其寿命之意。
- source_word: אֲשֶׁר חָי
  choice: 他所活的年数
  rationale: 保留原文重述并强调实际活过的寿数；补出“年数”使现代中文衔接清楚。
- source_word: מְאַת שָׁנָה וְשִׁבְעִים שָׁנָה וְחָמֵשׁ שָׁנִים
  choice: 共一百七十五岁
  rationale: 原文以一百、七十、五相加陈述总数；现代中文按惯常方式合并为“一百七十五岁”，“共”明确这是寿数总计。
