base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/025.yaml
  text: The first came out reddish[a], all of him like a hairy cloak[c][b], and they called his name Esau.
translation:
  language: zh_hans
  text: 先出来的那个浑身发红[a]，浑身都像一件毛茸茸的外袍[b]；他们就给他取名叫以扫[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“红润”或“红色”。希伯来语形容词指外观呈红色。
    reason: lexical_alternative
  - marker: b
    text: 或译“像一件毛发制成的外袍”或“像一件多毛的斗篷”。希伯来语以“外袍”和“毛发”构成明喻。
    reason: lexical_alternative
  - marker: c
    text: 希伯来语直译“他们称他的名为以扫”，是常见的命名句式。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: 出生
  rationale: 原义为“出来”，此处叙述分娩；现代汉语以“出生”表达最自然，同时不增添原文没有的信息。
- source_word: הָרִאשׁוֹן
  choice: 先出生的
  rationale: 指双胞胎中首先出来的一个；结合“出生”译出，可清楚表达出生次序。
- source_word: אַדְמוֹנִי
  choice: 发红
  rationale: 该形容词表示外观呈红色或红润；“发红”保留色泽上的一定幅度，也避免把它限定为肤色。
- source_word: כֻּלּוֹ
  choice: 浑身
  rationale: 强调这种外观遍及全身；“浑身”是自然、简洁的现代汉语。
- source_word: כְּאַדֶּרֶת שֵׂעָר
  choice: 像一件毛皮外袍
  rationale: 保留“像”的明喻和אַדֶּרֶת的外袍意象；שֵׂעָר既可理解为毛发，也可构成“毛皮外袍”的表达，正文采用可读而具象的译法，并用脚注保留另一种理解。
- source_word: וַיִּקְרְאוּ שְׁמוֹ
  choice: 他们就给他取名叫
  rationale: 这是希伯来语常见的命名句式；现代汉语如此表达自然，并保留复数主语“他们”。
- source_word: עֵשָׂו
  choice: 以扫
  rationale: 采用现代中文圣经传统中通行的人名译法。
