- from: 先出生的浑身发红[a]，像一件毛皮外袍[b]；他们就给他取名叫以扫[c]。
  to: 先出来的那个浑身发红[a]，浑身都像一件毛茸茸的外袍[b]；他们就给他取名叫以扫[c]。
  rationale: 将“毛皮外袍”改为“毛茸茸的外袍”，避免无根据地指定为兽皮材质，并保留希伯来原文以衣袍比喻全身毛发浓密的形象。“先出来的那个”直接对应“第一个出来的”，在分娩叙事中自然；重复“浑身”是为明示 כֻּלּוֹ 的全身性，同时维持原文比喻的指向。
