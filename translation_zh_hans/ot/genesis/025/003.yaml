  yaml_path: translation/ot/genesis/025/003.yaml
  text: Jokshan fathered Sheba and Dedan. The sons of Dedan were Asshurim[a], Letushim, and Leummim.
translation:
  language: zh_hans
  text: 约珊生了示巴和底但。底但的儿子是亚书利、利都是和利乌米[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这些名称也可能是氏族名；亦可音译为“亚书琳、利都欣、利乌明”。
    reason: 保留三个希伯来语复数专名可能指氏族的歧义，并提示可行的替代音译。
lexical_decisions:
- source_word: יָקְשָׁן
  choice: 约珊
  rationale: 按现代中文圣经常用形式音译人名，与上下文家谱体例一致。
- source_word: יָלַד
  choice: 生了
  rationale: 家谱语境中自然、简洁地表达男性先祖与后代的关系，同时不把关系限定得比原文更具体。
- source_word: שְׁבָא
  choice: 示巴
  rationale: 采用现代中文圣经中通行的专名译法。
- source_word: דְּדָן
  choice: 底但
  rationale: 采用现代中文圣经中通行的专名译法。
- source_word: בְנֵי
  choice: 儿子
  rationale: 直接对应希伯来语阳性复数“众子”；此处也可能指后裔或由其而出的族群，相关歧义由族名表达及脚注保留。
- source_word: הָיוּ
  choice: 是
  rationale: 作为系词引出名单，符合原文简单陈述。
- source_word: אַשּׁוּרִם
  choice: 亚书利族
  rationale: 该复数形式很可能是族名；以音译加“族”自然呈现其群体性质，并避免误作个人名。
- source_word: לְטוּשִׁים
  choice: 利都是族
  rationale: 按希伯来语音译这一可能的族名，并加“族”标明群体性质；不根据不确定的词源意译。
- source_word: לְאֻמִּים
  choice: 利乌米族
  rationale: 在此作为专有族名音译，并加“族”；虽与表示“民族”的普通词词根相近，但不据此作普通名词解释。
