base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/033.yaml
  text: And Jacob said[b][a], “Swear to me today.” So he swore to him and sold his birthright to Jacob.
translation:
  language: zh_hans
  text: 雅各说：“你今天[a]要向我起誓。”以扫就向他起了誓，把自己的长子名分卖给雅各[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “今天”也可译作“就在今日”或“在今日这一天”。
    reason: lexical_alternative
  - marker: b
    text: “长子名分”指长子所享有的身份和权利。
    reason: cultural_note
lexical_decisions:
- source_word: הִשָּׁבְעָה לִּי
  choice: 向我起誓
  rationale: 祈使式要求对方向说话者起誓；“向我起誓”既准确又符合现代汉语习惯。
- source_word: כַּיּוֹם
  choice: 今天
  rationale: 此时间表达可指“今天、就在今日、从今日起”；正文采用自然简洁的“今天”，并以脚注保留其他可能语气。
- source_word: וַיִּשָּׁבַע לוֹ
  choice: 就向他起了誓
  rationale: 保留与雅各命令中“起誓”的词语呼应，也清楚表达叙事的先后关系。
- source_word: וַיִּמְכֹּר
  choice: 卖给
  rationale: מכר明确表示出售；“卖给”保留这项行为的交易性质。
- source_word: בְּכֹרָתוֹ
  choice: 自己的长子名分
  rationale: בכרה指头生儿子的身份及其相应权利；“长子名分”是简明、通行且适合本语境的中文表达。
- source_word: לְיַעֲקֹב
  choice: 给雅各
  rationale: 介词标明出售行为的受让者；与“卖”结合译作“卖给雅各”最自然。
theological_decisions:
- issue: 以扫转让בכרה的性质
  choice: 把自己的长子名分卖给雅各
  alternative: 把自己作为长子的权利卖给雅各
  rationale: 经文描述的是一项实际交易，涉及长子的身份和权利；“长子名分”保留法律与家族层面的含义，不额外加入后来的神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“起誓”保留原文命令与回应的重复；明确补出“以扫”以避免连续代词在中文中造成指代含混。脚注标记均置于正文相关内容之后。
