base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/034.yaml
  text: And Jacob gave Esau bread and lentil stew[a], and he ate and drank and rose and went away[b]. Thus Esau despised the birthright.
translation:
  language: zh_hans
  text: 雅各给了以扫饼和扁豆羹[a]。以扫吃了，喝了，起身走了。以扫就这样轻视了长子的名分。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“用扁豆煮的浓汤”。
    reason: 说明 נְזִיד עֲדָשִׁים 所指菜肴的另一种自然表达。
lexical_decisions:
- source_word: נָתַן
  choice: 给了
  rationale: 采用该动词最常见、最直接的含义，不额外说明交换或递交的方式。
- source_word: לֶחֶם
  choice: 饼
  rationale: 此处与扁豆羹并列，宜取具体的主食含义；“饼”能自然指当时的烤制面食，也避免把它泛化为“食物”。
- source_word: נְזִיד עֲדָשִׁים
  choice: 扁豆羹
  rationale: 该组合指用扁豆煮成的浓稠菜肴；“扁豆羹”简洁自然，并比“扁豆汤”更能保留 נְזִיד 所指炖煮食物的特点。
- source_word: וַיֹּאכַל וַיֵּשְׁתְּ וַיָּקָם וַיֵּלַךְ
  choice: 吃了，喝了，起身走了
  rationale: 用连续而简短的动词保留希伯来文快速推进、近乎顿挫的叙事节奏；汉语中不必反复添加“又”，仍能清楚呈现动作次序。
- source_word: וַיִּבֶז
  choice: 轻视
  rationale: 该词表达看为卑贱、缺乏应有重视。“轻视”是现代汉语中清楚而有力度的对应词，不把含义扩展成具体行为。
- source_word: הַבְּכֹרָה
  choice: 长子的名分
  rationale: 指家族中长子所具有的地位和相应权利；“长子的名分”在现代汉语中简明可懂，也保留其身份与权利兼具的含义。
theological_decisions:
- issue: 末句对以扫如何看待长子名分的叙事评断
  choice: 以扫就这样轻视了长子的名分
  alternative: 以扫藐视了长子的名分
  rationale: 末句既承接前述行动，也给出明确的价值判断。“就这样”自然表达上下文所显示的总结意味；“轻视”保留原文的负面评价，而不进一步解释以扫的内心动机。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。用三个短句和连续动词保留原文简洁迅速的节奏；“饼”“扁豆羹”“长子的名分”兼顾历史语境、准确性与普通读者的可理解度。
