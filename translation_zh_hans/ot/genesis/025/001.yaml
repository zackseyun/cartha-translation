translation:
  language: zh_hans
  text: 亚伯拉罕又娶了一个妻子[a]，名叫基土拉。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“亚伯拉罕再次娶妻。”希伯来文在“娶”前用了一个有“增添”或“再次”意思的词。
    reason: 保留 וַיֹּסֶף 的附加或重复语义，并以自然汉语说明其表达方式。
lexical_decisions:
- source_word: וַיֹּסֶף
  choice: 又……一个
  rationale: 该动词本义为“增添、再次”，与后面的“娶妻”连用时表达增添或重复。译作“又娶了一个”既自然，也保留其附加意味。
- source_word: וַיִּקַּח
  choice: 娶了
  rationale: לקח 与 אִשָּׁה 连用是“娶妻”的常用表达；现代汉语用“娶”比直译“取”更准确自然。
- source_word: אִשָּׁה
  choice: 妻子
  rationale: 虽然该词也可指“女人”，但在“娶”这一结构中明确指妻子。
- source_word: וּשְׁמָהּ
  choice: 名叫
  rationale: 简洁自然地表达希伯来文“她的名字是”的命名句式。
- source_word: קְטוּרָה
  choice: 基土拉
  rationale: 采用现代中文圣经中通行的人名音译。
theological_decisions:
- issue: וַיֹּסֶף 在亚伯拉罕娶妻一事上的附加或重复含义
  choice: 又娶了一个妻子
  alternative: 再次娶妻；又娶了妻子
  rationale: 原文确有“增添、再次”的意味，但并未进一步说明事件的时间关系或基土拉的身份性质。正文以自然汉语表达附加意味，脚注保留另一种理解方式，避免超出原文作神学推断。
translation_notes:
  register: 采用现代、庄重而通俗的叙事语言。“又娶了一个妻子”在简体中文中清楚表达原文的附加意味；人名使用通行译名“基土拉”。
