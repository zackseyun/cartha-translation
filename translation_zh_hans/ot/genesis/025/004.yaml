base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/004.yaml
  text: And the sons of Midian were Ephah[a], Epher, Hanoch, Abida, and Eldaah. All these were the sons of Keturah.
translation:
  language: zh_hans
  text: 米甸的儿子是以法、以弗、哈诺、亚比大和以勒大。这些都是基土拉的子孙。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי מִדְיָן
  choice: 米甸的儿子是
  rationale: בְּנֵי 是 בֵּן 的复数构造式；在家谱语境中直译为“儿子”最准确。句首连接词 וּ־ 承接上文，中文无需机械译出“和”。
- source_word: עֵיפָה
  choice: 以法
  rationale: 按现代中文圣经人名的通行形式音译，并与普通名词“伊法”作适度区分。
- source_word: וָעֵפֶר
  choice: 以弗
  rationale: 去除连接词后，专名 עֵפֶר 采用通行中文音译“以弗”。
- source_word: וַחֲנֹךְ
  choice: 哈诺
  rationale: 此名直接依希伯来语 חֲנֹךְ 音译为“哈诺”，以免与另一个通常译作“以诺”的同形希伯来名字混淆。
- source_word: וַאֲבִידָע
  choice: 亚比大
  rationale: 专名 אֲבִידָע 依其希伯来语读音采用通行中文音译。
- source_word: וְאֶלְדָּעָה
  choice: 以勒大
  rationale: 专名 אֶלְדָּעָה 依其希伯来语形式采用通行中文音译。
- source_word: כָּל אֵלֶּה בְּנֵי קְטוּרָה
  choice: 这些都是基土拉的子孙
  rationale: כָּל אֵלֶּה 概括前列众人；末句的 בְּנֵי 表明他们属于基土拉的后裔。因所列是基土拉之孙而非她的亲生儿子，中文译作“子孙”既保留谱系关系，也避免产生直接母子关系的误解。
