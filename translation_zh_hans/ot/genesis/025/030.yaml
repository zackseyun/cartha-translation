base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/030.yaml
  text: Esau said to Jacob[a], “Please let me gulp down some of that red stuff, that red stuff there[c][b], because I am exhausted.” Therefore his name was called Edom.
translation:
  language: zh_hans
  text: 以扫对雅各说：“求你让我吞点那红的、红的东西，因为我累坏了。”因此，他名叫以东[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文重复“红的，红的”，没有明确说是什么食物；这种说法可能表现以扫急切而随意的口吻。有些译本补作“红汤”。“以东”在希伯来语中就是“红”的意思，本节借此形成双关。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַלְעִיטֵנִי
  choice: 让我吞点
  rationale: 该使役命令式带第一人称单数受词后缀，描写急切地吞咽；“让我吞点”比中性的“喂我”更能表现以扫迫不及待的口吻，又不额外加入原文没有的食物名称。
- source_word: נָא
  choice: 求你
  rationale: 这是缓和请求语气的语气词；“求你”在现代中文中简洁而庄重，也保留了请求意味。
- source_word: מִן הָאָדֹם הָאָדֹם הַזֶּה
  choice: 这个红的，就是这个红的
  rationale: 原文两次重复“红的”，却没有明说所指的食物。“这个红的，就是这个红的”保留省略、重复和指示意味，呈现以扫疲惫而急切的说话方式。
- source_word: כִּי עָיֵף אָנֹכִי
  choice: 因为我累坏了
  rationale: עָיֵף表示疲乏、筋疲力尽；“累坏了”是自然的现代口语，并符合当下的急迫语境，但不将其强化为濒临昏厥。
- source_word: עַל כֵּן
  choice: 因此
  rationale: 准确表达由前述事件引出的命名缘由。
- source_word: קָרָא שְׁמוֹ אֱדוֹם
  choice: 他被称为以东
  rationale: 希伯来语采用含“他的名”的命名公式，施事者并未明说；中文被动式自然地保留这种不明确性。
- source_word: אֱדוֹם
  choice: 以东
  rationale: 作为专名采用通行译名；它与“红的”在希伯来语中的谐音关系由脚注说明。
