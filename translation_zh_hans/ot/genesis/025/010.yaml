  text: the field that Abraham bought from the sons of Heth—there Abraham and Sarah his wife were buried[a][b][c].
translation:
  language: zh_hans
  text: 亚伯拉罕从赫的子孙那里买的那块田地——亚伯拉罕和他的妻子撒拉都葬在那里[a][b][c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “赫的子孙”也可译作“赫人”。希伯来文直译为亲族式或族群式的称呼，可能指赫人这一族群。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文“被葬”是单数形式，置于“亚伯拉罕和他的妻子撒拉”这一并列主语之前；这是希伯来语常见句法，所指包括二人都葬在那里。
    reason: source_syntax
  - marker: c
    text: 开头的“那块田地”是前置话题。也可译作：“至于亚伯拉罕从赫的子孙那里买的那块田地，亚伯拉罕和他的妻子撒拉都葬在那里。”
    reason: discourse_structure
lexical_decisions:
- source_word: הַשָּׂדֶה
  choice: 那块田地
  rationale: 定冠词所指的是前文已提到的安葬产业；“那块田地”既明确回指，也符合现代汉语表达。
- source_word: קָנָה
  choice: 买
  rationale: 在土地交易语境中，该词表示以交易方式购得；“买”具体、自然。
- source_word: מֵאֵת
  choice: 从……那里
  rationale: 介词组合标明购买的来源；汉语用“从……那里买”最自然，无须直译为“从……手中”。
- source_word: בְּנֵי חֵת
  choice: 赫的子孙
  rationale: 保留希伯来文亲族式、族群式称呼及其与人名“赫”的联系；“赫人”作为更顺畅的族群名称列入脚注。
- source_word: שָׁמָּה
  choice: 就葬在那里
  rationale: “那里”回指上述田地；加“就”使前置话题与主句在现代汉语中衔接自然。
- source_word: קֻבַּר
  choice: 葬
  rationale: 该词是“埋葬”的被动式。汉语“葬在那里”本身自然表达安葬结果，无须机械加入被动标记。
- source_word: וְשָׂרָה אִשְׁתּוֹ
  choice: 和他的妻子撒拉
  rationale: 自然表达撒拉与亚伯拉罕的夫妻关系，并与“亚伯拉罕”共同构成安葬动作的主语。
