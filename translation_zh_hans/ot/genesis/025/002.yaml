  text: And she bore him Zimran, Jokshan, Medan, Midian, Ishbak, and Shuah.
translation:
  language: zh_hans
  text: 她给他生了心兰、约珊、米但、米甸、伊施巴和书亚。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֵּלֶד
  choice: 她……生了
  rationale: 该词是 ילד 的 Qal 叙事过去式第三人称阴性单数；译文明确保留阴性主语，并以自然的现代汉语叙述已发生的生育事件。
- source_word: לוֹ
  choice: 给他
  rationale: 介词 ל 加第三人称阳性单数后缀，在生育谱系中表示孩子的父亲；“给他生了”符合现代汉语表达，并保留原文关系。
- source_word: אֶת
  choice: 不单独译出
  rationale: אֶת 在各名字前标示直接宾语，现代汉语无需另用对应词，由正常的宾语语序体现。
- source_word: זִמְרָן
  choice: 心兰
  rationale: 人名按现代中文圣经中通行且易识别的译名音译。
- source_word: יָקְשָׁן
  choice: 约珊
  rationale: 人名采用中文圣经通行译名。
- source_word: מְדָן
  choice: 米但
  rationale: 人名采用中文圣经通行译名，并与下一名“米甸”清楚区分。
- source_word: מִדְיָן
  choice: 米甸
  rationale: 采用中文圣经中已广泛使用的专名形式，兼顾可读性及后文一致性。
- source_word: יִשְׁבָּק
  choice: 伊施巴
  rationale: 人名采用中文圣经通行译名，保持专名识别度。
- source_word: שׁוּחַ
  choice: 书亚
  rationale: 人名采用中文圣经通行译名，不对名字可能含义作解释性翻译。
