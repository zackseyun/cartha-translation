  yaml_path: translation/ot/genesis/025/012.yaml
  text: These are the generations of Ishmael[a], Abraham’s son, whom Hagar the Egyptian, Sarah’s slave woman[b], bore to Abraham.
translation:
  language: zh_hans
  text: 以下是亚伯拉罕的儿子以实玛利的后代[a]：以实玛利是埃及人夏甲——撒拉的婢女[b]——给亚伯拉罕生的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “后代”所译的希伯来语是《创世记》中反复用作段落标题的词，也可译作“世代”“家族谱系”或“记载”。句首的连接词也可译作“而”或“并且”。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“撒拉的女奴”。希伯来语所指的是受主人支配的女性奴仆；“婢女”是较传统的表达。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: 以下是
  rationale: 用于自然引出新的家谱段落；希伯来语连接词的承接作用由上下文体现，不另加带时间意味的“现在”。
- source_word: תֹּלְדֹת
  choice: 后代
  rationale: 本段随后列举以实玛利的众子和族系，因此“后代”在此比直译“世代”更清楚自然；脚注保留其作为《创世记》反复出现之标题用语的较宽含义。
- source_word: יִשְׁמָעֵאל בֶּן אַבְרָהָם
  choice: 亚伯拉罕的儿子以实玛利
  rationale: 按现代汉语习惯表达父子关系，并采用通行圣经人名译法。
- source_word: אֲשֶׁר יָלְדָה
  choice: 是……给……生的
  rationale: 明确保留夏甲为生育动作的主体以及以实玛利为关系从句所指对象。
- source_word: הָגָר הַמִּצְרִית
  choice: 埃及人夏甲
  rationale: 简洁保留夏甲的族属身份，符合现代汉语表达。
- source_word: שִׁפְחַת שָׂרָה
  choice: 撒拉的婢女
  rationale: “婢女”既自然简洁，也传达女性仆役及受支配的身份；脚注说明也可更明确译作“女奴”。
- source_word: לְאַבְרָהָם
  choice: 给亚伯拉罕
  rationale: 在“生”的结构中自然表达亚伯拉罕为孩子的父亲。
