base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/006.yaml
  text: But to the sons of his concubines[a], Abraham gave gifts, and while he was still alive he sent them away from his son Isaac[b], eastward to the land of the east.
translation:
  language: zh_hans
  text: 至于亚伯拉罕众妾所生的儿子，亚伯拉罕给了他们礼物；亚伯拉罕还活着的时候，就把他们从他儿子以撒身边打发走，往东到东方之地[a]去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “东方之地”也可意译为“东方地区”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִבְנֵי הַפִּילַגְשִׁים אֲשֶׁר לְאַבְרָהָם
  choice: 至于亚伯拉罕众妾所生的儿子
  rationale: 上下文将这些儿子与承受产业的以撒对照，因此用“至于”自然引出转折性话题；“妾”简洁表达受承认但地位低于正妻的伴侣身份。“所生的”明确儿子与众妾的关系，符合现代汉语。
- source_word: נָתַן אַבְרָהָם מַתָּנֹת
  choice: 亚伯拉罕给了他们一些礼物
  rationale: 直译动词与宾语，同时补出汉语中自然的间接宾语；“一些”表达原文不定数量，不将这些礼物解释为正式产业。
- source_word: וַיְשַׁלְּחֵם
  choice: 他就打发他们
  rationale: 此处不仅表示差遣，也含有让他们离开的意思；“打发”结合下文“离开”能自然保留这种分离意味。
- source_word: מֵעַל יִצְחָק בְּנוֹ
  choice: 离开自己的儿子以撒
  rationale: מֵעַל 在此表示与以撒分开；“自己的儿子以撒”准确保留关系，并避免代词所指含混。
- source_word: בְּעוֹדֶנּוּ חַי
  choice: 趁自己还活着
  rationale: 清楚表明亚伯拉罕是在去世以前亲自作出安排；“趁”也传达行动发生于这段尚存的时限内。
- source_word: קֵדְמָה אֶל אֶרֶץ קֶדֶם
  choice: 往东去，到东方之地
  rationale: 前一词保留移动方向，后一短语保留原文近似重复的地域表达，不武断确定具体地名或疆界。
theological_decisions:
- issue: 给众妾之子的礼物与以撒所得产业的关系
  choice: 仅译作“礼物”，不称为“产业”或“遗产”
  alternative: 将礼物解释为较少的一份遗产
  rationale: 原文使用 מַתָּנֹת（礼物），与上一节给以撒的“一切”形成对照，但没有明确把这些礼物定义为继承份额；译文保留这种差别而不作额外制度化解释。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“众妾”保留复数；句中重复“亚伯拉罕”以贴近原文并明确主语。保留“往东去，到东方之地”的方向与地域双重表达，避免把后者误定为专名。
