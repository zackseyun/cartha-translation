base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/008.yaml
  text: And Abraham breathed his last and died in a good old age[a], old and full[b], and he was gathered to his people.
translation:
  language: zh_hans
  text: 亚伯拉罕断了气，死了[a]；死时正值美好的晚年，年老而满足，并归到他本族那里[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文依次说“断了气，死了”；前一个动词描写生命气息终止，后一个则直接说明死亡。
    reason: lexical_note
  - marker: b
    text: “归到他本族那里”是希伯来语传统的死亡说法，可能令人联想到与已故亲族相聚，但这句话本身并未说明具体方式。
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּגְוַע
  choice: 断了气
  rationale: 该动词在死亡叙事中表示气息终止、咽气；“断了气”是自然、庄重且与随后“死了”有所区别的现代汉语表达。
- source_word: וַיָּמָת
  choice: 死了
  rationale: מות是表示死亡的普通动词；直译为“死了”，不采用委婉语。
- source_word: בְּשֵׂיבָה טוֹבָה
  choice: 安享高寿
  rationale: 该短语描写人在美好、圆满的老年境况中去世；“安享高寿”自然传达正面的高龄之意，同时不把“好”仅解释为寿数很大。
- source_word: זָקֵן
  choice: 年老
  rationale: 保留希伯来文另行叠加的“老”这一描述，不将它完全并入“高寿”。
- source_word: וְשָׂבֵעַ
  choice: 而满足
  rationale: שָׂבֵעַ本义为“饱足、满足”。原文未明说“日子”，故正文采用“满足”，保留其可能指人生圆满或心满意足的开放性。
- source_word: וַיֵּאָסֶף אֶל־עַמָּיו
  choice: 归到他本族那里
  rationale: 这是传统的死亡套语。“归到”保留被收聚、归属的意象；“本族”表达עַמָּיו的群体及亲族色彩，而不明确限定为埋葬或某种死后状态。
- source_word: עַמָּיו
  choice: 他本族
  rationale: עם带复数所有格后缀，字面为“他的众民/族人”。“本族”在汉语中兼具所属群体和亲族意味，避免直接窄化为“祖先”。
theological_decisions:
- issue: “归到他本族那里”的确切含义
  choice: 保留传统死亡套语及其开放性，不说明它究竟指安葬、与已故亲族相聚，还是死后的有意识存在。
  alternative: 译作“与祖先团聚”或解释为“葬在家族坟墓里”。
  rationale: 希伯来文具有死亡、归属和亲族相聚的共鸣，但本节没有界定其具体方式；译文不应替原文作神学裁决。
- issue: שָׂבֵעַ所表达的“满足”
  choice: 译为“满足”，不补出原文没有的“日子”。
  alternative: 译为“享尽天年”或“寿数满足”。
  rationale: “满足”既贴近词义，也保留它可能涉及寿命圆满、人生饱足或心境满足的语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。为使汉语行文自然，将死亡的主干动作置于年龄描述之后；仍保留“断了气，死了”两个连续动词以及“年老而满足”的累加结构。所有脚注标记均已置于正文。
