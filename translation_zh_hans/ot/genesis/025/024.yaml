  text: 她分娩的日子满了；看哪，她腹中有一对双胞胎。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּמְלְאוּ יָמֶיהָ לָלֶדֶת
  choice: 她生产的日子满了
  rationale: 保留希伯来语“日子满了”的惯用表达，同时用“生产”自然表达 ילד 不定式在此处“生孩子、分娩”的含义。
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留引人注意的叙事标记，凸显随后揭示的情形；“看哪”庄重而且为现代读者所能理解。
- source_word: תוֹמִם
  choice: 双胞胎
  rationale: 该复数名词指一对孪生子；“双胞胎”是现代汉语中简洁自然的对应表达。
- source_word: בְּבִטְנָהּ
  choice: 她腹中
  rationale: בטן 可指腹部或母腹；在分娩语境中，“腹中”准确自然，也避免过度具体化为解剖学用语。
