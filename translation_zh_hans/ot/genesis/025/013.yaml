  text: 'And these are the names of the sons of Ishmael[a], by their names according to their generations: the firstborn of Ishmael was Nebaioth, and Kedar, and Adbeel, and Mibsam.'
translation:
  language: zh_hans
  text: 以下是以实玛利众子的名字，按他们的名字，照着他们的世系：以实玛利的长子是尼拜约，接着是基达、亚德别和米比衫。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: 这些是
  rationale: 承接上文并引出名单；现代汉语中省略句首“和”更自然，篇章承接关系仍由语境体现。
- source_word: שְׁמוֹת בְּנֵי יִשְׁמָעֵאל
  choice: 以实玛利众子的名字
  rationale: 直接保留“名字”及父子关系；“众子”符合庄重的家谱语体。
- source_word: בִּשְׁמֹתָם לְתוֹלְדֹתָם
  choice: 按着他们的名字和世系列出
  rationale: 将两个介词短语自然整合；“世系”表达 תוֹלְדוֹת 在家谱语境中的后裔谱系含义，“列出”为汉语句法所需的补足成分。
- source_word: בְּכֹר יִשְׁמָעֵאל
  choice: 以实玛利的长子
  rationale: 准确表达首生子的身份，也符合现代汉语常用表达。
- source_word: נְבָיֹת
  choice: 尼拜约
  rationale: 采用现代中文圣经人名的通行译写。
- source_word: קֵדָר
  choice: 基达
  rationale: 采用现代中文圣经人名的通行译写。
- source_word: אַדְבְּאֵל
  choice: 亚德别
  rationale: 采用现代中文圣经人名的通行译写。
- source_word: מִבְשָׂם
  choice: 米比衫
  rationale: 采用现代中文圣经人名的通行译写。
