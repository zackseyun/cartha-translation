- source_word: חֲדַד
  choice: 哈达
  rationale: 族谱中的专名，按希伯来语辅音形式音译；不采用其他传统中出现的异形“哈达珥”。
- source_word: תֵימָא
  choice: 提玛
  rationale: 族名或与地名相关的专名，采用现代中文圣经语境中清楚、自然的音译。词尾 א 不需要在中文中另加音节。
- source_word: יְטוּר
  choice: 伊突
  rationale: 专名按希伯来语读音及通行中文形式音译。
- source_word: נָפִישׁ
  choice: 拿非施
  rationale: 专名音译，并以“施”体现词尾 ש 音。
- source_word: קֵדְמָה
  choice: 基底玛
  rationale: 专名按希伯来语形式音译，保留末尾音节。
- source_word: וְ / וָ
  choice: 和
  rationale: 希伯来语连接词串联名单；现代汉语用顿号列举，并在最后一项前用“和”。
