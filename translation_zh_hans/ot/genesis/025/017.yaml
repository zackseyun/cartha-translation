  text: וְ/אֵ֗לֶּה שְׁנֵי֙ חַיֵּ֣י יִשְׁמָעֵ֔אל מְאַ֥ת שָׁנָ֛ה וּ/שְׁלֹשִׁ֥ים שָׁנָ֖ה וְ/שֶׁ֣בַע שָׁנִ֑ים וַ/יִּגְוַ֣ע וַ/יָּ֔מָת וַ/יֵּאָ֖סֶף אֶל עַמָּֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/017.yaml
  text: 'These were the years of Ishmael’s life: one hundred and thirty-seven years[a]. And he breathed his last and died[b], and was gathered to his people.'
translation:
  language: zh_hans
  text: 以实玛利一生的年岁是一百三十七岁。他断了气[a]，死了，归到他本族的人那里[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“气绝了”。原文这个动词与后面的“死了”并非同一个词，因此正文分别译出。
    reason: lexical_alternative
  - marker: b
    text: “归到他本族的人那里”是希伯来语的死亡用语，可能指与亲族同葬、死后与先人相聚，或兼指二者。
    reason: cultural_note
lexical_decisions:
- source_word: וְאֵלֶּה שְׁנֵי חַיֵּי יִשְׁמָעֵאל
  choice: 以实玛利一生的年岁
  rationale: 按现代汉语自然表达希伯来语计算一生年岁的惯用结构；不机械保留“这些是”的句式。
- source_word: מְאַת שָׁנָה וּשְׁלֹשִׁים שָׁנָה וְשֶׁבַע שָׁנִים
  choice: 共一百三十七岁
  rationale: 将希伯来语分项列出的数字合为现代汉语通行的总数表达，并准确保留数值。
- source_word: וַיִּגְוַע
  choice: 他气绝了
  rationale: גוע指生命终止、断气；译为“气绝了”既自然庄重，也与随后明确表示“死”的מות保持词义区别。
- source_word: וַיָּמָת
  choice: 死了
  rationale: 单独译出第二个死亡动词，不将两个相邻动词合并或省略。
- source_word: וַיֵּאָסֶף אֶל־עַמָּיו
  choice: 又被收归到他的族人那里
  rationale: 保留原文被动的“收归”意象及עַמָּיו“他的族人／本族之人”的开放含义，不擅自具体化为埋葬或死后与祖先相聚。
theological_decisions:
- issue: “被收归到他的族人那里”这一死亡用语的含义
  choice: 保留希伯来语惯用语，不判定它只指与亲族同葬、死后与先人相聚，还是兼指二者。
  alternative: 明确译为“葬在祖坟里”或“与列祖团聚”。
  rationale: 原文本身没有排除这些理解，却也没有在此明确限定其中一种；保留用语的含蓄性可避免把特定的死后观或安葬方式写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“气绝了，死了”有意保留原文两个连续的死亡动词；“被收归到他的族人那里”则保留原有意象与解释空间。
