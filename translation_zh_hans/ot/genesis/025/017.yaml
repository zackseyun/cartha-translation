  terminology: “气绝”庄重但在当代汉语中不如“断了气”自然；采用“断了气，死了”可清楚维持原文两个不同死亡动词的并列。“本族的人”能对应עַמָּיו，且不预设其具体指祖先、亲族坟墓或死后状态。
