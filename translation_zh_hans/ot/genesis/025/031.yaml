  yaml_path: translation/ot/genesis/025/031.yaml
  text: Jacob said[a], “Sell me your birthright today.”
translation:
  language: zh_hans
  text: 雅各说：“你今天把长子的名分卖给我。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “今天”也可理解为“从今天起”或“就在今日”，强调这是一项立即生效、具有约束力的交易。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 连续式叙事动词推进情节；现代汉语用“说”自然表达，无须机械译出连接词。
- source_word: יַעֲקֹב
  choice: 雅各
  rationale: 采用现代中文圣经传统中通行的人名音译。
- source_word: מִכְרָה
  choice: 卖给
  rationale: 这是动词 מכר 的祈使形式；结合句末 לִי，译为“卖给我”符合现代汉语表达。词尾附加的 ה 在此不必另译。
- source_word: כַיּוֹם
  choice: 今天
  rationale: 该表达可指“今天”，也可含“从今天起／就在今日生效”的意味；正文采用简洁自然的“今天”，并在脚注保留即时、具约束力的交易语气。
- source_word: אֶת
  choice: 不单独译出
  rationale: 这是确定直接宾语标记，汉语中通常没有对应词。
- source_word: בְּכֹרָתְךָ
  choice: 你的长子名分
  rationale: בְּכֹרָה 指长子身份所附带的地位、权利和特权；“长子的名分”既准确又符合庄重、易懂的现代汉语。
- source_word: לִי
  choice: 给我
  rationale: 表示交易的接受方；与“卖”组合为“卖给我”，是自然的现代汉语句式。
