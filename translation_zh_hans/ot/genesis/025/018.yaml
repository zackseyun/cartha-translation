revisions:
- from: 他们居住的范围，从哈腓拉直到书珥；书珥在埃及对面，就是往亚述[a]去的方向。他在所有弟兄的对面定居[b]。
  to: 他们住在从哈腓拉到书珥一带；书珥在埃及对面，位于通往亚述[a]的路上。他住在众弟兄的对面[b]。
  rationale: 修订仅改善现代汉语句法与地理叙述的连贯性：以“住在从……到……一带”准确表达居住范围；以“位于通往亚述的路上”自然对应“往亚述去时”；末句保留单数“他”和较少解释性的“对面”，并以脚注保存敌对义这一真实的解释可能。脚注a改为中性的词汇替代说明。
