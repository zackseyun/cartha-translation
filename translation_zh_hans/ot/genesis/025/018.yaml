base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/018.yaml
  text: They settled from Havilah to Shur[a], which is opposite Egypt as you go toward Asshur[b]. He settled opposite all his brothers.
translation:
  language: zh_hans
  text: 他们住在从哈腓拉到书珥一带；书珥在埃及对面，位于通往亚述[a]的路上。他住在众弟兄的对面[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “亚述”也可译为“亚述地”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“他与众弟兄为敌而居。”原文短语是习语，可能描述地理位置，也可能含有对立、敌对的意味。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁכְּנוּ
  choice: 他们居住
  rationale: 这是שׁכן的复数形式，表示以实玛利的后代在某地居住；结合后面的地域范围，用“居住”自然且不增加永久占有的含义。
- source_word: מֵחֲוִילָה עַד שׁוּר
  choice: 从哈腓拉直到书珥
  rationale: 保留原文表示地域跨度的“从……直到……”结构，并采用通行的地名译法。
- source_word: אֲשֶׁר עַל־פְּנֵי מִצְרַיִם
  choice: 书珥在埃及对面
  rationale: עַל־פְּנֵי在地理语境中可表示“在……对面”；不具体译成“东面”，以免加入原文未明说的方位。
- source_word: בֹּאֲכָה אַשּׁוּרָה
  choice: 就是往亚述去的方向
  rationale: 该结构含有朝向某地而去的意思；“往……去的方向”符合现代汉语地理说明的表达。
- source_word: עַל־פְּנֵי כָּל־אֶחָיו נָפָל
  choice: 他在所有弟兄的对面定居
  rationale: 原文短语含义有争议。正文采用较少解释性的空间义“在……对面”，并按上下文将נפל表达为“定居”；可能含有敌对意味的理解收入脚注。
theological_decisions:
- issue: עַל־פְּנֵי כָּל־אֶחָיו נָפָל所表达的是地理位置还是敌对关系
  choice: 他在所有弟兄的对面定居
  alternative: 他与所有弟兄为敌而居
  rationale: “在……面前／对面”本身可以是空间描述，也可能结合创世记16:12暗示对立。正文保留较为字面的空间表达，脚注说明敌对义的可能性，不替读者消除原文的张力。
- issue: 末句单数主语的所指
  choice: 用单数“他”承接以实玛利
  alternative: 用复数“他们”指以实玛利的后代
  rationale: 希伯来文נָפָל为阳性单数，可能以以实玛利代表其后裔；译文保留单数形式。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“居住的范围”使复数主语与后面的地理跨度自然衔接；地名采用简体中文圣经语境中通行的“哈腓拉、书珥、亚述”。末句保留原文由复数转为单数的变化，并以脚注保存习语的真实歧义。
