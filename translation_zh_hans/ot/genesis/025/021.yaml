base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/021.yaml
  text: And Isaac prayed to Yahweh for his wife[a], because she was barren. And Yahweh answered him[b], and Rebekah his wife conceived.
translation:
  language: zh_hans
  text: 以撒为妻子[a]向耶和华祈求，因为她不能生育。耶和华应允了他的祈求[b]，他的妻子利百加就怀了孕。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “为妻子”也可按字面译作“在妻子对面”；在这里可理解为以她为祈求所关乎的对象，或为她代求。
    reason: lexical_alternative
  - marker: b
    text: “祈求”和“应允了他的祈求”在希伯来文中使用同一个词根，形成有意的呼应；后半句的动词为同根的被动形式，可直译为“耶和华应允了他（的祈求）”。
    reason: lexical_wordplay
lexical_decisions:
- source_word: וַיֶּעְתַּר / וַיֵּעָתֶר（עתר）
  choice: 祈求 / 应允了他的祈求
  rationale: 两个动词出自同一词根，前者指以撒祈求，后者指耶和华接受、回应他的祈求。中文采用自然但彼此呼应的表达，并用脚注说明原文的词根复现。
- source_word: לַיהוָה / יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的形式音译四字神名，同时明确其为专名。
- source_word: לְנֹכַח אִשְׁתּוֹ
  choice: 为妻子
  rationale: 在祷告语境中可理解为以妻子为祈求的对象或为她代求；“为妻子”自然清楚，同时以脚注保留“在妻子对面”的字面可能。
- source_word: עֲקָרָה
  choice: 不能生育
  rationale: 准确表达当时无法怀孕的状态，现代、清楚，也比带有较强贬抑色彩的旧式说法更适合普通读者。
- source_word: וַתַּהַר
  choice: 怀了孕
  rationale: 自然直接地表达受孕结果，符合现代叙事中文。
- source_word: רִבְקָה
  choice: 利百加
  rationale: 采用简体中文圣经传统中通行的人名译法。
theological_decisions:
- issue: 如何表达 עתר 词根的重复，而不把神的回应写成机械结果
  choice: “以撒……祈求；耶和华应允了他的祈求”
  alternative: “以撒恳求耶和华；耶和华被他求动”
  rationale: 所选译文保留祈求与回应的对应关系，但避免暗示人的祷告迫使神采取行动；脚注交代原文两处使用同一词根。
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 采用现代中文圣经传统中最广为人知的专名形式，不以“主”替代原文中的专名，也不借此加入宗派性解释。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“祈求—应允了他的祈求”保持叙事流畅；“不能生育”准确表达原意而避免不必要的污名化。脚注保留介词短语的空间义歧义及原文词根复现。
