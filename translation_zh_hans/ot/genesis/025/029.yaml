  yaml_path: translation/ot/genesis/025/029.yaml
  text: Jacob was cooking a stew[a], and Esau came in from the field[c][b], and he was exhausted.
translation:
  language: zh_hans
  text: 雅各正在煮炖菜[a]；以扫从田野而来，疲惫不堪[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “煮炖菜”也可译作“煮一道炖煮的食物”。这里的希伯来语动词特指用煮沸的方式烹调。
    reason: lexical_alternative
  - marker: b
    text: “疲惫不堪”也可译作“疲惫”或“困乏”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּזֶד
  choice: 正在煮
  rationale: זיד在此指以煮沸方式烹调；“正在煮”既自然，也表现叙事背景中持续进行的动作。
- source_word: נָזִיד
  choice: 浓汤
  rationale: נָזִיד指煮成的汤羹或炖煮食物；“浓汤”是现代汉语中清楚自然的表达，并能与下一节的可倾倒食物相符。
- source_word: וַיָּבֹא
  choice: 回来
  rationale: בוא意为“来、进入”；结合“从田野”及家庭场景，译作“回来”最符合自然汉语，同时不额外指定他进入了哪座建筑。
- source_word: מִן הַשָּׂדֶה
  choice: 从田野
  rationale: שָׂדֶה可指田地、野外或乡野；“田野”保留其具体场景，也避免把地点过窄地限定为耕地。
- source_word: וְהוּא עָיֵף
  choice: 已经筋疲力尽
  rationale: עָיֵף表示疲惫、困乏；“筋疲力尽”传达这里较强的疲劳程度。“已经”自然连接他从田野回来时所处的状态。
