  yaml_path: translation/ot/genesis/025/032.yaml
  text: Esau said[a], “Look, I am about to die; so what use is this birthright to me?”
translation:
  language: zh_hans
  text: 以扫说：“看哪，我快要死了，这长子的名分对我有什么用呢？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 叙事中的标准 wayyiqtol 形式；现代汉语通常不必机械译出连接词“于是/并且”。
- source_word: עֵשָׂו
  choice: 以扫
  rationale: 采用现代中文圣经传统中通行且易识别的人名译法。
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留引人注意并强调下述话语的语用功能；“看哪”庄重而仍为普通读者所理解。
- source_word: אָנֹכִי הוֹלֵךְ לָמוּת
  choice: 我都快要死了
  rationale: הלך加不定式在此表达趋近某一结果，即死亡迫近，而非实际行走；“都快要死了”自然传达以扫话语中的强调语气，同时不判定其说法是事实还是夸张。
- source_word: וְלָמָּה זֶּה לִי
  choice: 这……对我还有什么用呢
  rationale: 这是由前句引出的反问，表达“既然如此，它对我有何益处”；“还有”自然体现语境中的推论，但不增加实质信息。
- source_word: בְּכֹרָה
  choice: 长子的名分
  rationale: 指长子所享有的身份、权利和相关利益；相较于单说“长子权”，“长子的名分”在现代中文中较自然，也保留其身份与权利兼具的含义。
theological_decisions:
- issue: 以扫所说“快要死了”的解释力度
  choice: 按以扫本人的话译为死亡迫近，但不说明他是否真的濒死
  alternative: 明确译成实际濒临死亡，或明确译成因饥饿而夸张抱怨
  rationale: 希伯来文只记载以扫声称自己正趋向死亡；译文应保留这句话可能是实情或夸张的张力，不替叙事作道德或事实判断。
translation_notes:
  register: 采用自然、庄重的现代标准普通话。“看哪”保留原文 הִנֵּה 的强调功能；全句以口语化反问呈现人物话语，但避免过度随意。
