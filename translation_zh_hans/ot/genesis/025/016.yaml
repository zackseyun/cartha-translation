  text: 'These are the sons of Ishmael[a], and these are their names[c][b], by their settlements and by their encampments: twelve princes according to their peoples.'
translation:
  language: zh_hans
  text: 这些是以实玛利的儿子；这是他们的名字，按他们的村落和营寨而列：他们是十二位首领，各按自己的族群。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה הֵם בְּנֵי יִשְׁמָעֵאל
  choice: 这些就是以实玛利的儿子
  rationale: 保留“儿子”的具体亲属含义；本节总结前文所列以实玛利的亲生儿子。“就是”自然体现指示词加代词的确认语气。
- source_word: וְאֵלֶּה שְׁמֹתָם
  choice: 以下是他们的名字
  rationale: 直译其义，并以现代汉语自然地承接前文名单。
- source_word: בְּחַצְרֵיהֶם וּבְטִירֹתָם
  choice: 按他们的村落和营寨排列
  rationale: חָצֵר可指村落或定居点，טִירָה可指营寨或设防营地。介词בְּ在此可能表示按地点归类，也可能是处所义；正文采用适合名单语境的“按……排列”，脚注保留处所读法。
- source_word: שְׁנֵים עָשָׂר נְשִׂיאִם
  choice: 十二位首领
  rationale: נָשִׂיא指被抬举的领袖、族长或首领；“首领”在现代汉语中自然，也避免“王子”所暗示的王室血统。
- source_word: לְאֻמֹּתָם
  choice: 各按自己的族群
  rationale: אֻמָּה表示民族、部族或人群共同体。“族群”保留其群体性，又不把规模限定为现代国家或狭义宗族。
