review_pass:
  verdict: revise
  source_fidelity: 译文准确传达了以实玛利的儿子、其名字、村落与营寨、十二位首领及其族群等要素。介词短语可理解为按居住地点列举，脚注也适当地保留了处所义的可能。惟“以下是”会使读者误以为名单将在本节之后展开，和本节作为前列名字的总结性说明不合。
  naturalness: “以下是他们的名字”在此上下文不自然；改为“这是他们的名字”并以“按……而列”连接，可保留希伯来文简练的列举关系，也更符合现代汉语。将末句明确为对前述儿子的总结，避免“名字”直接与“十二位首领”冒号连接所造成的轻微逻辑跳跃。
  terminology: “以实玛利”“村落”“营寨”“首领”“族群”均合适。“首领”忠实反映נְשִׂיאִם，避免将其限定为王室“王子”或特定宗教制度中的“族长”。“族群”可保留אֻמָּה在此处的规模弹性。
  issues:
  - severity: medium
    issue: “以下是他们的名字”具有前瞻性列单含义。
    rationale: 本节在希伯来文叙事中总结25:13—15已经列出的名字；“以下是”通常预告后文名单，容易误导读者。
  - severity: low
    issue: 冒号前的“名字”与冒号后的“十二位首领”衔接略显生硬。
    rationale: “十二位首领”是对已列诸子的身份和数目的总结，而不是名字本身；补出汉语所需的指代和判断关系，可使结构清晰而不改变意义。
  revised_text: 这些是以实玛利的儿子；这是他们的名字，按他们的村落和营寨而列：他们是十二位首领，各按自己的族群。
  revised_footnotes:
  - marker: a
    text: “按他们的村落和营寨而列”也可译作“在他们的村落和营寨中”。
    reason: 希伯来介词בְּ既可表示归类依据，也可表达所在之处；本句结构容许两种理解。
  - marker: b
    text: “首领”也可译作“族长”或“领袖”。
    reason: נְשִׂיאִם表示群体中地位受尊崇的领导者，并不必然指王室人物。
  - marker: c
    text: “族群”也可译作“部族”或“民族”。
    reason: אֻמָּה的范围可因语境而异，在这里指由以实玛利各子所形成的群体。
  revision_rationale: 修订仅处理汉语篇章指向和句法衔接：“以下”改为回指性的“这是”，并将“十二位首领”明确为对这些儿子的总结。保留“按……而列”及其处所义脚注，以免将有争议的介词关系定为单一解释。
