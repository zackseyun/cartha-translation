revisions:
- from: 这些就是以实玛利的儿子；以下是他们的名字，按他们的村落和营寨排列[a]：十二位首领[b]，各按自己的族群[c]。
  to: 这些是以实玛利的儿子；这是他们的名字，按他们的村落和营寨而列：他们是十二位首领，各按自己的族群。
  rationale: 修订仅处理汉语篇章指向和句法衔接：“以下”改为回指性的“这是”，并将“十二位首领”明确为对这些儿子的总结。保留“按……而列”及其处所义脚注，以免将有争议的介词关系定为单一解释。
