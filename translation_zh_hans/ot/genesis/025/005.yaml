lexical_decisions:
- source_word: וַיִּתֵּן
  choice: 给了
  rationale: נתן 的基本义是“给”；叙事中的 wayyiqtol 在此自然译为完成的过去行动“给了”。
- source_word: אַבְרָהָם
  choice: 亚伯拉罕
  rationale: 采用现代简体中文圣经传统中通行的人名译法。
- source_word: אֶת
  choice: 不单独译出
  rationale: 这是直接宾语标记，汉语中无须另译，其语法作用由句法体现。
- source_word: כָּל אֲשֶׁר לוֹ
  choice: 自己所有的一切
  rationale: 原文直指“凡属于他的”；此译既保留“所有”的全面范围，也以自然现代汉语表达其财物归属。
- source_word: לְיִצְחָק
  choice: 给了以撒
  rationale: 介词 לְ 在此标示接受者；汉语用“给了以撒”清楚自然。
