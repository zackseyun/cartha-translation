  text: וַ/יִּתְרֹֽצֲצ֤וּ הַ/בָּנִים֙ בְּ/קִרְבָּ֔/הּ וַ/תֹּ֣אמֶר אִם כֵּ֔ן לָ֥/מָּה זֶּ֖ה אָנֹ֑כִי וַ/תֵּ֖לֶךְ לִ/דְרֹ֥שׁ אֶת יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/022.yaml
  text: And the children struggled together within her[a], and she said, “If it is so, why am I like this?” So she went to inquire of Yahweh.
translation:
  language: zh_hans
  text: 孩子们在她腹中彼此冲撞。她就说：“既然这样，我为什么会这样呢？[a]”于是她去求问雅威。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文的说法很简略，也可较直译为“我为什么是这样？”甚至理解为“我为什么存在？”
    reason: 保留希伯来语省略表达在境况哀叹与生存哀叹之间的歧义。
lexical_decisions:
- source_word: וַיִּתְרֹצֲצוּ
  choice: 彼此冲撞
  rationale: 该词为相互、加强意义的形态，描写腹中孩子之间激烈的动作。“彼此冲撞”既表达相互争动，也避免加入原文没有明说的伤害程度。
- source_word: הַבָּנִים
  choice: 孩子们
  rationale: 原词可指“儿子们”，但此时尚未出生；“孩子们”在现代汉语中自然，也不否定下一节所揭示的男性身份。
- source_word: בְּקִרְבָּהּ
  choice: 在她腹中
  rationale: 原意为“在她里面／内部”。上下文明确涉及怀孕，“腹中”自然地传达身体内部的含义，又不像“子宫里”那样采用更专门的解剖用语。
- source_word: אִם כֵּן
  choice: 既然这样
  rationale: 此处不是冷静提出假设，而是利百加面对已经发生的痛苦状况所作的反应；“既然这样”符合上下文和现代汉语语气。
- source_word: לָמָּה זֶּה אָנֹכִי
  choice: 我为什么会这样呢？
  rationale: 希伯来语表达简略，可能针对她目前的境况，也可能带有更深的生存哀叹。“我为什么会这样呢”保留指向不完全明确的特点，未将其限定为单纯询问病因或明确求死。
- source_word: לִדְרֹשׁ אֶת יְהוָה
  choice: 去求问雅威
  rationale: דרש以神为宾语时，在此指向神寻求解释或指示。“求问”比宽泛的“寻求”更准确地契合叙事情境。
- source_word: יְהוָה
  choice: 雅威
  rationale: 采用对四字神名较接近其学界通行复原读音的现代汉语音译，以名字而非“主”这一称号来呈现原文。
theological_decisions:
- issue: 利百加哀叹的含义
  choice: 正文译为“我为什么会这样呢？”，脚注保留更直译、也可能偏向生存哀叹的理解
  alternative: “我为什么还活着？”或“我为什么存在？”
  rationale: 原文 לָמָּה זֶּה אָנֹכִי 是省略式表达，语法没有明确补出谓语。上下文支持她为痛苦妊娠而哀叹，但不足以排除更强烈的生存意味，因此正文保持自然和开放，脚注说明歧义。
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文使用神的专名。译作“雅威”力求直接呈现该专名，并避免以称号替代；“耶和华”虽为汉语传统译名，但反映的是较晚形成的混合读法。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“彼此冲撞”表现动作的激烈和相互性；直接引语保持利百加痛苦、困惑的语气。神名译作“雅威”。
