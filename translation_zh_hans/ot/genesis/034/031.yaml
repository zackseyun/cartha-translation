lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: 他们却说
  rationale: 叙事中的连词在这里承接并反驳雅各上一节的责备；“却”自然表达语境中的转折和抗辩语气。
- source_word: הַכְזוֹנָה
  choice: 难道……当妓女……吗
  rationale: 疑问词 ה、比较介词 כ 与名词 זונה 构成反问式比较，意为“像/当作妓女”；“妓女”是现代、清楚且不过分古雅的对应词。
- source_word: יַעֲשֶׂה
  choice: 可以……对待
  rationale: עשה 本义宽泛，可指“做、使”；这里以人为宾语，结合受辱语境，用“对待”最自然，但仍以脚注保留“使……成为/像”的字面可能。未完成体在此构成带抗议意味的反问。
- source_word: אֶת אֲחוֹתֵנוּ
  choice: 我们的妹妹
  rationale: אֶת 是直接宾语标记，不单独译出；אֲחוֹתֵנוּ 为“我们的姐妹”。中文结合底拿是说话者妹妹的叙事关系，译作“我们的妹妹”更自然。
