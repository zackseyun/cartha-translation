  text: וַ/תֵּצֵ֤א דִינָה֙ בַּת לֵאָ֔ה אֲשֶׁ֥ר יָלְדָ֖ה לְ/יַעֲקֹ֑ב לִ/רְא֖וֹת בִּ/בְנ֥וֹת הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/001.yaml
  text: Dinah[a], the daughter of Leah, whom she had borne to Jacob, went out to see the daughters of the land.
translation:
  language: zh_hans
  text: 利亚给雅各所生的女儿底拿出去看当地女子。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“去探访当地女子。”希伯来文直译：“看那地的女儿们。”
    reason: 保留 לִרְאוֹת 在上下文中可能有“探访”之意，并说明 בְּנוֹת הָאָרֶץ 的字面表达。
lexical_decisions:
- source_word: וַתֵּצֵא
  choice: 出去
  rationale: 这是 יצא 的 Qal 叙事体，表示“出去”。中文无需添加原文没有的“那时”或具体出发地点。
- source_word: דִינָה
  choice: 底拿
  rationale: 按现代中文圣经人名的通行译法音译。
- source_word: בַּת לֵאָה אֲשֶׁר יָלְדָה לְיַעֲקֹב
  choice: 利亚给雅各所生的女儿
  rationale: 将关系从句自然地前置为中文定语，同时保留利亚是母亲、雅各是父亲的信息。
- source_word: לִרְאוֹת
  choice: 要看看
  rationale: 保留 ראה“看、见”的基本意义；“要”表达不定式的目的功能，“看看”在中文叙事中自然，也不把含义限定为正式探访。
- source_word: בִּבְנוֹת הָאָרֶץ
  choice: 当地的女子
  rationale: 字面为“那地的女儿们”，是指当地女性的表达。正文采用现代汉语易懂的对应语，字面形式收入脚注。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。将较长的身份说明置于人名前作定语，符合中文语序；“当地的女子”避免生硬直译，但以脚注保存原文意象与词义可能性。
