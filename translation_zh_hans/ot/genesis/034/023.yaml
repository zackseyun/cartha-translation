base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/023.yaml
  text: Will not their livestock[a], their property, and all their animals be ours? Only let us agree with them[b], and they will dwell with us.
translation:
  language: zh_hans
  text: 他们的牲畜、财物和所有的家畜，不都要归我们吗？只要我们答应他们，他们就会与我们同住。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִקְנֵהֶם
  choice: 他们的牲畜
  rationale: מִקְנֶה通常指作为财产的牲畜或畜群；“牲畜”在现代汉语中自然、宽泛，也符合本节的经济语境。
- source_word: קִנְיָנָם
  choice: 财产
  rationale: קִנְיָן指所得之物、产业或财物；“财产”保留其物质和经济含义，又不局限于动产。
- source_word: וְכָל בְּהֶמְתָּם
  choice: 和一切牲口
  rationale: בְּהֵמָה泛指兽类，常指家畜；“牲口”既符合语境，又与前面的“牲畜”形成自然但不完全相同的表达，并保留כָל的总括意味。
- source_word: הֲלוֹא לָנוּ הֵם
  choice: 不都要归我们吗？
  rationale: הֲלוֹא引出期待肯定回答的反问；“不都要归我们吗”自然传达说话者企图占有对方财物的劝诱语气。
- source_word: אַךְ
  choice: 只要
  rationale: אַךְ在此表示限定条件；结合后面的意愿式动词，译作“只要”能自然引出条件及其预期结果。
- source_word: נֵאֹותָה לָהֶם
  choice: 我们答应他们
  rationale: 该词形表示同意、愿意或应允；“答应他们”符合双方谈判的上下文，也保留对其要求表示同意的含义。
- source_word: וְיֵשְׁבוּ אִתָּנוּ
  choice: 他们就会和我们住在一起
  rationale: יָשַׁב可指居住、定居；“住在一起”通顺易懂，并保留共同居住的社会含义。
theological_decisions: []
translation_notes:
  register: 采用现代、清楚而庄重的叙事语言。保留原文反问的劝诱力度；“牲畜／牲口”反映מִקְנֶה与בְּהֵמָה的词汇差异，同时避免生硬重复。原文中的词义变化不影响核心意思，因此本节不设脚注。
