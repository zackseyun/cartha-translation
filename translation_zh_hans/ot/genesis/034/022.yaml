base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/022.yaml
  text: 'Only on this condition will the men agree with us[a], to dwell with us and to become one people: that every male among us be circumcised, just as they are circumcised.'
translation:
  language: zh_hans
  text: 只有在这个条件下，那些男子才肯与我们同住，成为同一群体：我们中所有的男性都要受割礼，如同他们已经受了割礼一样。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַךְ בְּזֹאת
  choice: 只有在这个条件下
  rationale: אַךְ在此具有限定作用，בְּזֹאת引出所要求的条件；合译既准确又符合现代汉语表达。
- source_word: יֵאֹתוּ לָנוּ
  choice: 才会同意我们
  rationale: אוה的尼法勒式表达愿意、赞同或同意；“同意我们”保留原文搭配略显开放的语义，并用脚注提示其他可能理解。
- source_word: הָאֲנָשִׁים
  choice: 那些人
  rationale: 上下文明确指雅各众子一方的男子；汉语“那些人”自然承接前文，也没有把所指扩大为全体百姓。
- source_word: לָשֶׁבֶת אִתָּנוּ
  choice: 与我们同住
  rationale: 保留ישב所表达的共同居住、定居之意，同时使用自然庄重的现代汉语。
- source_word: לִהְיוֹת לְעַם אֶחָד
  choice: 成为一个民族
  rationale: 表达进入统一群体身份的结果义；此处עַם指具有共同身份的社会群体，“民族”比“国家”更贴切。
- source_word: בְּהִמּוֹל לָנוּ כָּל זָכָר
  choice: 就是我们中所有的男丁都要受割礼
  rationale: בְּ加不定式在此提出条件；כָּל זָכָר涵盖群体中所有男性，“男丁”在家族与割礼语境中简洁明确。
- source_word: כַּאֲשֶׁר הֵם נִמֹּלִים
  choice: 像他们一样
  rationale: 前句已经明说“受割礼”，比较句用自然汉语避免机械重复，同时完整表达“如同他们受割礼”的意思。
