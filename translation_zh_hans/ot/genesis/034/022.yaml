- from: 只有在这个条件下，那些人才会同意我们[a]，与我们同住，成为一个民族：就是我们中所有的男丁都要受割礼，像他们一样。
  to: 只有在这个条件下，那些男子才肯与我们同住，成为同一群体：我们中所有的男性都要受割礼，如同他们已经受了割礼一样。
  rationale: 将“同意我们”改为“才肯与我们同住”，使“同意／愿意”的动词自然支配后面的居住与结盟内容；补明“那些男子”及“已经受了割礼”。脚注保留该动词的词义幅度，但用更自然的汉语搭配说明其替代译法。
