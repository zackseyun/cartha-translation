base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/024.yaml
  text: And all who went out of the gate of his city listened to Hamor and to Shechem his son[a], and every male, all who went out of the gate of his city[c][b], was circumcised.
translation:
  language: zh_hans
  text: 城中所有从城门出去的人都听从了哈抹和他儿子示剑的话；城中所有从城门出去的男子都受了割礼。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “从城门出去的人”直译如此，是指在城门这一公共场所参与城中事务的人；原文在本节中两次使用这一说法。
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁמְעוּ אֶל
  choice: 听从了……的话
  rationale: 该结构不只是听见，也表示接受并响应对方的提议；“听从了……的话”在现代汉语中自然，又不像“服从”那样过度强调权威关系。
- source_word: כָּל יֹצְאֵי שַׁעַר עִירוֹ
  choice: 城里所有从城门出入的人
  rationale: 原文直译为“所有从他城门出去的人”，是指参与城中公共事务的男性居民。译文保留城门这一具体意象及全节中的重复，同时以“出入”表达汉语中较自然的惯用说法。
- source_word: בְּנוֹ
  choice: 他儿子
  rationale: 直接表达示剑与哈抹的父子关系，符合现代汉语语序。
- source_word: וַיִּמֹּלוּ
  choice: 都受了割礼
  rationale: Nifal 形式在这里可作被动或反身理解；“受了割礼”自然保留被动意味，不额外指定施行者。
- source_word: כָּל זָכָר
  choice: 所有男丁
  rationale: זָכָר 指男性；结合城门公共生活的语境，“男丁”比“每个男性”更自然庄重，也与后面的群体说明相配。
- source_word: שַׁעַר עִירוֹ
  choice: 城门
  rationale: 保留古代城门作为出入及公共议事场所的具体文化图景；所属关系在“城里”中已自然体现。
