    rationale: יֹצְאֵי 的字面意义是“出去的人”。在此处虽为城门公共生活的习语，仍宜保留“出去”的方向及两次重复。
  - severity: low
    issue: 第二处“所有男丁，就是城里所有从城门出入的人”的同位表达稍显含混。
    rationale: 原文在“所有男子”后重复城门短语，以指明受割礼的群体。改为“所有从城门出去的男子”可在汉语中清楚表达该范围，而不添加额外含义。
