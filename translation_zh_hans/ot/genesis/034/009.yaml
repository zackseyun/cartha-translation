  yaml_path: translation/ot/genesis/034/009.yaml
  text: 'Intermarry with us: give your daughters to us[b][a], and take our daughters for yourselves.'
translation:
  language: zh_hans
  text: 你们要同我们通婚：把你们的女儿嫁给我们，也娶我们的女儿为妻。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִתְחַתְּנוּ אֹתָנוּ
  choice: 你们要同我们通婚
  rationale: התחתן 的 Hitpael 形式在此表示双方建立婚姻关系。“同我们通婚”自然地传达了相互联姻的含义。
- source_word: בְּנֹתֵיכֶם תִּתְּנוּ לָנוּ
  choice: 把你们的女儿嫁给我们
  rationale: 原文直译为“把你们的女儿给我们”，但在明确的婚姻语境中，现代汉语用“嫁给”可准确表达 נתן 在此所指的嫁娶行为，并避免被误解为一般性的交付。
- source_word: וְאֶת בְּנֹתֵינוּ תִּקְחוּ לָכֶם
  choice: 也娶我们的女儿为妻
  rationale: לקח 在此婚姻语境中意为娶妻。“娶……为妻”保留了主动取得婚配对象的表达，同时使现代汉语清楚自然。
