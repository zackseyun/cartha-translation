base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/021.yaml
  text: These men are at peace with us[a]. Let them dwell in the land and trade in it, for, you see, the land is broad enough for them. We will take their daughters for wives for ourselves[d][c][b], and we will give our daughters to them.
translation:
  language: zh_hans
  text: 这些人与我们和睦相处[a]。让他们住在这地，在这里经商[c]；看哪，这地宽阔，足以容纳他们[b]。我们就娶他们的女儿为妻，也把我们的女儿嫁给他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “和睦相处”也可译作“友好”或“相安无事”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译近似“这地——看哪——在他们面前宽阔”；其中的希伯来语习语表示这地宽敞，有充足的空间可供他们居住。
    reason: cultural_note
  - marker: c
    text: “在这里经商”也可译作“经过这里贸易”；原文既可指在这地境内从事商业活动，也可能包括取道此地贸易。
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁלֵמִים
  choice: 和睦相处
  rationale: 该词在“与我们”这一关系结构中表示彼此和平、关系良好；“和睦相处”自然地传达这种关系状态，而不额外强调亲密友谊。
- source_word: וְיֵשְׁבוּ
  choice: 让他们住
  rationale: 虽为未完成式，但在劝说城中众人的语境里带有提议、准许的意味；“让他们住”符合其劝告功能。
- source_word: וְיִסְחֲרוּ אֹתָהּ
  choice: 在这里经商
  rationale: סחר指商业活动，阴性代词回指“这地”；译文将土地表达为经商的范围，同时在脚注保留“经过这里贸易”的可能性。
- source_word: רַחֲבַת יָדַיִם לִפְנֵיהֶם
  choice: 这地宽阔，足以容纳他们
  rationale: “双手宽阔”是表示空间宽广、余地充足的习语；此译法清楚传达土地对他们开放且空间充裕的语境含义。
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留原文吸引听者注意、引出理由的语篇功能；“看哪”庄重而仍为现代读者所理解。
- source_word: נִקַּח לָנוּ לְנָשִׁים
  choice: 我们可以娶他们的女儿为妻
  rationale: 未完成式在此表达提议或可实行的安排；“娶……为妻”保留希伯来文的婚姻表达，לָנוּ由主语和“娶”自然体现。
- source_word: נִתֵּן לָהֶם
  choice: 也可以把我们的女儿嫁给他们
  rationale: 与前句平行，表达互相通婚的提议；中文用“嫁给”自然传达原文直译“给他们”的婚姻语境。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“看哪”保留原文 הִנֵּה 的提示作用；其余句式避免生硬直译。“娶”与“嫁给”顺应现代汉语婚姻表达，同时保留原文互相通婚的对称结构。
