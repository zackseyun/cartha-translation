  to: 这些人与我们和睦相处[a]。让他们住在这地，在这里经商[c]；看哪，这地宽阔，足以容纳他们[b]。我们就娶他们的女儿为妻，也把我们的女儿嫁给他们。
  rationale: 修订脚注b，以准确解释希伯来习语，避免将其误作“人的双手宽阔”。同时将“可以……也可以”调整为“就……也……”，更贴合本句劝说众人接受互惠婚姻安排的语气；其余译文及脚注均可保留。
