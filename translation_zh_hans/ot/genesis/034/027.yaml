  yaml_path: translation/ot/genesis/034/027.yaml
  text: The sons of Jacob came upon the slain and plundered the city[c][b][a], because they had defiled their sister.
translation:
  language: zh_hans
  text: 雅各的儿子们来到那些被杀的人那里[a]，劫掠了那城，因为他们的妹妹曾在那里受了玷污。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “来到那些被杀的人那里”也可理解为“临到被杀的人那里”或“向着被杀的人而来”。希伯来语此处的介词可表示临到某对象，也可能带有向着、针对的意味。
    reason: lexical_alternative
  - marker: b
    text: 原文的关系从句形式上近于：“那城，他们玷污了他们的妹妹。”句法十分压缩，复数施事在句内未明说；按上下文，指城中一方。正文按其因果含义译出，并用被动语态避免把“他们”误解为雅各的儿子们。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יַעֲקֹב
  choice: 雅各的儿子们
  rationale: 保留希伯来语的显式亲属称谓和群体性强调；比“雅各众子”更符合现代普通话。
- source_word: בָּאוּ עַל
  choice: 来到……那里
  rationale: בוא 与 עַל 连用可表示来到、临到或向着某对象；正文采用不额外强化攻击意味的自然表达，并以脚注保留“来到……之上/向……而来”的语义可能。
- source_word: הַחֲלָלִים
  choice: 被杀的人
  rationale: חָלָל 在暴力冲突语境中指遭杀戮者；“被杀的人”比泛称“死人”更准确，也比“死者”更显明其暴死性质。
- source_word: וַיָּבֹזּוּ
  choice: 劫掠了
  rationale: בזז 指夺取战利品或财物；“劫掠”庄重、清楚，并能表达暴力之后掠夺财物的行为。
- source_word: הָעִיר
  choice: 那城
  rationale: עִיר 通常指城或城邑；叙事中该城已明确出现，故用现代汉语自然的“那城”。
- source_word: אֲשֶׁר
  choice: 因为
  rationale: אֲשֶׁר 形式上是关系词，但此处压缩的关系从句在叙事中具有解释劫掠缘由的作用；译作“因为”表达最可能的因果关系，同时以脚注说明原文句法。
- source_word: טִמְּאוּ
  choice: 受了玷污
  rationale: טמא 的 Piel 形式在此指使人受到污辱、玷污，兼有道德与社会层面的含义。采用被动表达可避免现代汉语把未明说的复数施事误解为雅各的儿子们。
- source_word: אֲחוֹתָם
  choice: 他们的妹妹
  rationale: 原义为“他们的姊妹”。结合底拿与众兄长的家庭关系，现代汉语用“妹妹”自然明确；“他们的”保留原文亲属动机。
theological_decisions:
- issue: 玷污行为的施事与代词指向
  choice: 用“他们的妹妹曾在那里受了玷污”的被动结构，不明说施事
  alternative: “因为他们玷污了他们的妹妹”或“因为城里的人玷污了他们的妹妹”
  rationale: 希伯来语以复数主动动词“他们玷污了”表达，但句内没有明示其先行词；叙事语境指向示剑城一方，而汉语直译“他们”极易误指刚出现的雅各众子。被动式既保留施事未明说的特点，也避免反转叙事含义；“在那里”使压缩的关系从句与“那城”建立自然联系。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“劫掠”“玷污”保留经文的严肃色彩；避免生硬的“众子”“被杀者”。正文在不误指施事的前提下保留原文压缩句法所留下的张力。
