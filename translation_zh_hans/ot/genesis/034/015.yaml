  text: 'Only on this condition will we agree with you: if you become like us[b][a], by circumcising every male among you.'
translation:
  language: zh_hans
  text: 只有在这个条件下，我们才会答应你们：若你们变得像我们一样，你们中所有男子都受割礼。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַךְ בְּזֹאת
  choice: 只有在这个条件下
  rationale: אַךְ在此表示限制，בְּזֹאת引出同意的具体条件；合译既准确又符合现代汉语谈判语境。
- source_word: נֵאוֹת לָכֶם
  choice: 我们才会答应你们
  rationale: אוה的尼法勒式表达愿意、同意；“答应你们”自然保留לָכֶם的对象关系，也与条件句搭配顺畅。
- source_word: אִם תִּהְיוּ כָמֹנוּ
  choice: 你们要像我们一样
  rationale: 条件句中的היה表示达到或具备相同状态；汉语“要像我们一样”清楚表达所要求的改变，而不过度增译。
- source_word: לְהִמֹּל לָכֶם כָּל זָכָר
  choice: 让你们所有的男子都受割礼
  rationale: 尼法勒不定式具有被动意义，说明成为“像我们一样”的具体方式；“所有的男子都”传达כָּל זָכָר的逐一涵盖，并以“你们的”体现לָכֶם。
