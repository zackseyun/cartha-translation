  naturalness: 正文基本自然。改为“带走我们的女儿，离去”更简洁，也避免补出“这里”。
  terminology: “受割礼”是现代汉语圣经中准确、通行的术语。“听从”能恰当表达 שׁמע אֶל 的“听从／留意”含义，且不必强化为“服从”。
