  yaml_path: translation/ot/genesis/034/017.yaml
  text: But if you will not listen to us[a], to be circumcised[b], then we will take our daughter and go.
translation:
  language: zh_hans
  text: 但如果你们不听从我们，不接受割礼，我们就带走我们的女儿，离去。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אִם לֹא
  choice: 但如果……不
  rationale: וְ连接上文并在条件句中带出对比；现代汉语用“但如果……不”自然表达这一转折条件。
- source_word: תִשְׁמְעוּ אֵלֵינוּ
  choice: 你们不听从我们
  rationale: שׁמע与אֶל连用可指“听”或“听从”；这里涉及是否照他们的要求行，译作“听从”既自然，又不强化为绝对的“服从”。
- source_word: לְ/הִמּוֹל
  choice: 不肯受割礼
  rationale: 该不定式说明“听从”的具体内容，动词形态表达接受割礼。汉语用“不肯受割礼”清楚显示拒绝按要求行动，同时脚注保留更贴近形式的译法。
- source_word: וְ/לָקַחְנוּ אֶת בִּתֵּנוּ
  choice: 我们就带走我们的女儿
  rationale: 条件句后半部在语境中表示将来的结果；“就”传达后果关系，“带走”比单说“带”更符合随后离去的语境。
- source_word: וְ/הָלָכְנוּ
  choice: 离开这里
  rationale: הלך在此表示离去；“离开这里”是自然的现代汉语表达，地点“这里”由语境隐含，并未改变行动方向。
theological_decisions: []
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“我们的女儿”保留原文群体性的第一人称复数表达，不直接改为人名“底拿”。“离开这里”使汉语完整自然。
