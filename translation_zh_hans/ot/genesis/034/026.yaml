base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/026.yaml
  text: They also killed Hamor and his son Shechem with the sword[a], and they took Dinah from Shechem’s house and went out.
translation:
  language: zh_hans
  text: 他们又用刀[a]杀了哈抹和他儿子示剑，把底拿从示剑家里带走，就出去了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “用刀”原文直译为“用刀剑之口”，是指用刀剑杀死的惯用说法。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת חֲמוֹר וְאֶת שְׁכֶם בְּנוֹ
  choice: 他们又……杀了哈抹和他儿子示剑
  rationale: 两个带连接词的宾语承接上一节，表示哈抹和示剑也是被杀者；“又”自然表达这种附加关系。“他儿子示剑”保留原文明确的父子关系。
- source_word: הָרְגוּ
  choice: 杀了
  rationale: 这是 הרג 在叙事中的直接、常用译法，现代汉语清楚自然，不额外强化动作方式。
- source_word: לְפִי חָרֶב
  choice: 用刀
  rationale: 原文字面为“按着刀剑之口”，是指用刀剑杀死的希伯来语惯用语；正文采用自然汉语，字面形象在脚注说明。
- source_word: וַיִּקְחוּ אֶת דִּינָה
  choice: 把底拿……带走
  rationale: לקח 的基本义为“拿、带”；在从屋中把人带离的语境里，“带走”比“拿走”自然，同时避免用“抢走”等词增添原文未明说的语气。
- source_word: מִבֵּית שְׁכֶם
  choice: 从示剑家里
  rationale: בֵּית 在当前场景中最自然地指示剑的房屋或住处；“家里”是现代汉语对具体居所的自然表达，不将其扩大解释为“家族”。
- source_word: וַיֵּצֵאוּ
  choice: 就出去了
  rationale: 保留 יצא 的“出去”空间含义；“就”顺畅连接连续叙事动作，不补出原文未说明的目的地。
- source_word: חֲמוֹר / שְׁכֶם / דִּינָה
  choice: 哈抹／示剑／底拿
  rationale: 采用现代中文圣经语境中通行的人名音译，保持人物辨识度。
