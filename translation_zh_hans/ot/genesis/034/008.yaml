base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/008.yaml
  text: And Hamor spoke with them[a], saying, “My son Shechem longs for your daughter. Please give her to him as a wife.”
translation:
  language: zh_hans
  text: 哈抹对他们说：“我儿子示剑一心恋慕你们的女儿[a]。请把她给他为妻。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他的心深深依恋你们的女儿”，或“他渴望得到你们的女儿”。
    reason: 原文חָשְׁקָה נַפְשׁוֹ既可强调深切依恋，也可强调强烈渴望；正文用“一心恋慕”保留两方面的意味。
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 说
  rationale: דבר在此表示开口讲话；与后面的לֵאמֹר共同构成叙事引语公式，现代汉语用“对他们说”自然清楚。
- source_word: אִתָּם
  choice: 对他们
  rationale: 该介词在此可表示与他们交谈；汉语叙事中“对他们说”比直译“和他们说”更自然，且不改变交谈对象。
- source_word: שְׁכֶם בְּנִי
  choice: 我儿子示剑
  rationale: 保留“示剑”与“我儿子”的同位关系，并采用自然的现代汉语语序。
- source_word: חָשְׁקָה נַפְשׁוֹ
  choice: 一心恋慕
  rationale: 原文直陈“他的נפש恋慕／依恋”，表达强烈的情感与欲求。“一心恋慕”保留内在情感的力度，同时避免生硬直译“他的魂依附”。
- source_word: בְּבִתְּכֶם
  choice: 你们的女儿
  rationale: “女儿”为单数，指底拿；第二人称后缀为复数，因哈抹面对雅各家众人说话，故译作“你们的女儿”。
- source_word: תְּנוּ נָא
  choice: 请把她给
  rationale: 复数命令式加נָא带有请求、恳请语气；“请”准确而自然地表达这一礼貌缓和成分。
- source_word: לְאִשָּׁה
  choice: 为妻
  rationale: 该结构指将女子交给男子成婚；“给他为妻”简洁、庄重，也符合汉语圣经叙事语体。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“对他们说”符合现代汉语引语习惯；“一心恋慕”传达希伯来语习语的情感强度。脚注标在相关短语之后，以准确对应词义说明。
