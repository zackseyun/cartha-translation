base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/025.yaml
  text: On the third day[a], while they were in pain, two of Jacob’s sons, Simeon and Levi, Dinah’s brothers, each took his sword, came against the city while it felt secure[b], and killed every male.
translation:
  language: zh_hans
  text: 第三天，他们还在疼痛的时候，雅各的两个儿子，就是底拿的兄弟西缅和利未，各自拿起刀来，趁城里的人毫无戒备[a]，向那城进攻，杀死了所有男性。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “趁城里的人毫无戒备”或译“安然无惧地”。希伯来语“安稳”（בֶּטַח）既可描述城中人毫无防备的状态，也可描述西缅和利未行动时从容或无所畏惧。正文按上下文采用前一种理解。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַיּוֹם הַשְּׁלִישִׁי
  choice: 第三天
  rationale: 以自然的现代汉语交代叙事时间；וַיְהִי在此主要推进叙事，无须机械译作“事情发生了”。
- source_word: בִּהְיוֹתָם כֹּאֲבִים
  choice: 他们还在疼痛的时候
  rationale: 保留同时发生的情状，不在正文中明说疼痛由割礼造成，因为原文此处未重述原因。
- source_word: שְׁנֵי בְנֵי יַעֲקֹב
  choice: 雅各的两个儿子
  rationale: 准确表达雅各众子中的两人，符合现代汉语表达。
- source_word: שִׁמְעוֹן וְלֵוִי אֲחֵי דִינָה
  choice: 就是底拿的哥哥西缅和利未
  rationale: 以同位结构说明二人与底拿的关系；按叙事情境采用自然的亲属称谓“哥哥”。
- source_word: אִישׁ חַרְבּוֹ
  choice: 各自拿起刀来
  rationale: אִישׁ在这里具有逐一分配意义；“各自”保留二人分别拿自己武器的意思。חֶרֶב译作宽泛而自然的“刀”。
- source_word: וַיָּבֹאוּ עַל הָעִיר
  choice: 攻入城中
  rationale: בוא על在语境中表示带敌意地临到、进攻；“攻入城中”比逐字的“来到城上”自然，并与随后杀戮相衔接。
- source_word: בֶּטַח
  choice: 趁城里的人毫无戒备
  rationale: 按上下文将其理解为城中人处于安稳、未防备的状态；脚注保留该词也可能修饰进攻者行动方式的歧义。
- source_word: וַיַּהַרְגוּ כָּל זָכָר
  choice: 杀了所有男丁
  rationale: הרג直译为“杀”；זָכָר指男性，不仅限于成年男人，“所有男丁”在此既简洁又保留范围。
