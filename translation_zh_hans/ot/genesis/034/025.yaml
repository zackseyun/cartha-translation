  terminology: 人名“雅各、底拿、西缅、利未”均合宜；“刀”可用于חרב，且保留广义的刃兵器表达。保留“安稳”及其可修饰城中人的状态或进攻者行动方式的脚注，未将争议性句法歧义排除。
