base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/020.yaml
  text: So Hamor and Shechem his son came to the gate of their city and spoke to the men of their city[a], saying[b],
translation:
  language: zh_hans
  text: 于是，哈抹和他儿子示剑来到他们那座城的城门口，对城里的男子说[a]：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “城里的男子”很可能指聚集在城门口商议公共事务的男性城民。
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֹא
  choice: 来到
  rationale: בוא的叙事性未完成式在此表示到达某处；“来到”自然衔接目的地“城门口”，又不额外引入“进入”的含义。
- source_word: חֲמוֹר
  choice: 哈抹
  rationale: 按希伯来语专名音译，并采用现代中文圣经读者较熟悉的形式。
- source_word: וּשְׁכֶם בְּנוֹ
  choice: 和他儿子示剑
  rationale: 明确保留“示剑”是哈抹之子的关系，同时采用自然的现代汉语语序。
- source_word: אֶל שַׁעַר עִירָם
  choice: 本城的城门口
  rationale: שַׁעַר直译为“门”；这里是古代城中处理公共事务的城门场所。“本城”自然表达第三人称复数后缀所指的他们所属之城。
- source_word: וַיְדַבְּרוּ אֶל
  choice: 对……说
  rationale: דבר与אֶל连用表示向某人说话；结合后面的לֵאמֹר，中文以“对……说”最自然，避免生硬重复“讲话说”。
- source_word: אַנְשֵׁי עִירָם
  choice: 本城的男子
  rationale: אַנְשֵׁי字面指“男人们”；在城门议事的语境中，很可能是参与公共决策的男性城民，因此保留性别信息，不泛化为“居民”。
- source_word: לֵאמֹר
  choice: 说：
  rationale: 这是引出直接引语的常用希伯来语形式；中文以冒号自然承接下文，无须机械译作“说道”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“城门口”既保留原文的具体地点，也符合中文习惯；用“男子”保留原文的性别指向。
