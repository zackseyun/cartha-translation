base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/002.yaml
  text: When Shechem son of Hamor the Hivite[a], the prince of the land, saw her[b], he took her and lay with her and humiliated her.
translation:
  language: zh_hans
  text: 希未人哈抹的儿子示剑——当地的首领——看见了她，就把她带走，与她同寝，凌辱了她。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “凌辱”所译的希伯来语动词可指使人受苦、受辱或遭侵犯；在这里指性侵犯。也可更明确地译作“强暴了她”。
    reason: 说明原词的语义范围及其在本节语境中的强制性含义。
lexical_decisions:
- source_word: וַיַּרְא אֹתָהּ
  choice: 看见了她
  rationale: 按叙事中的基本义翻译 ראה；不额外加入凝视、觊觎等原文未明说的意味。
- source_word: שְׁכֶם בֶּן־חֲמוֹר הַחִוִּי
  choice: 希未人哈抹的儿子示剑
  rationale: 依现代汉语自然语序表达父子关系，并采用通行的圣经专名译法。
- source_word: נְשִׂיא הָאָרֶץ
  choice: 当地首领
  rationale: נָשִׂיא 可指首领、领袖或统治者，并不必然表示王室身份；“当地首领”自然表达其地域性的政治社会地位。按希伯来语相邻关系，将此称谓理解为修饰哈抹。
- source_word: וַיִּקַּח אֹתָהּ
  choice: 就把她带走
  rationale: לקח 的基本义是“取、带走”。此处置于性暴力的叙事序列中；“带走”保留其较宽的词义，不把该动词本身过早强化为“强掳”或“强奸”。
- source_word: וַיִּשְׁכַּב אֹתָהּ
  choice: 与她同寝
  rationale: 这是表示发生性关系的希伯来语惯用表达；“同寝”在现代汉语中庄重、清楚，又保留原文的委婉形式。
- source_word: וַיְעַנֶּהָ
  choice: 凌辱了她
  rationale: ענה 的 Piel 形式可表示使人受苦、使人受辱或侵犯人。在本节的性语境中，“凌辱”既传达强制与羞辱的严重性，也保留该词本身较宽的语义范围；脚注说明其在此指性侵犯。
theological_decisions:
- issue: 如何忠实而不淡化地表达本节的性暴力，同时避免超出希伯来语动词本身的词义范围
  choice: 正文译作“把她带走，与她同寝，凌辱了她”，并在脚注中明确说明这是性侵犯。
  alternative: 译作“抓住她，强奸了她”或“把她带走，与她同寝，使她受辱”。
  rationale: 三个连续动词呈现逐步推进的强制性行为。正文分别保留 לקח、שכב、ענה 的功能和力度，不把它们合并成一个解释性较强的词；同时通过“凌辱”及脚注明确指出事件的暴力性质，避免将其误读为双方自愿的性关系。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“当地首领”避免把 נָשִׂיא 过度具体化为王室的“王子”；“同寝”保持原文惯用表达的庄重语气；不用较古旧且可能带有受害者不洁联想的“玷污”。
