  yaml_path: translation/ot/genesis/034/016.yaml
  text: then we will give our daughters to you[a], and we will take your daughters for ourselves, and we will live with you and become one people.
translation:
  language: zh_hans
  text: 那么，我们就把我们的女儿嫁给你们，也娶你们的女儿为妻；我们要与你们一同居住，成为一个民族。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“成为同一个族群。”希伯来语直译为“成为一个民”，这里的“民”指一个共同体或族群，并非现代政治意义的国家。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַנּוּ אֶת־בְּנֹתֵינוּ לָכֶם
  choice: 我们就把我们的女儿嫁给你们
  rationale: 在前述条件之后，完成式配合连接词表达随之而来的结果或承诺，故译作“就”；“给女儿”在此指安排婚嫁，现代汉语自然表达为“把女儿嫁给”。
- source_word: וְאֶת־בְּנֹתֵיכֶם נִקַּח־לָנוּ
  choice: 也娶你们的女儿为妻
  rationale: לקח字面为“取、带走”，此处与双方女儿互相婚配的语境结合，明确指娶妻；译出“为妻”可避免现代汉语中“带走女儿”的误解。
- source_word: וְיָשַׁבְנוּ אִתְּכֶם
  choice: 我们要与你们一同居住
  rationale: ישב在此指共同定居、生活；“一同居住”既保留共居含义，也符合庄重的现代汉语。
- source_word: וְהָיִינוּ לְעַם אֶחָד
  choice: 成为一个民族
  rationale: היה在所述通婚与共居之后可自然理解为进入一种结果状态，译作“成为”；עם指共同体或族群，并非现代政治意义的国家，因此译作“民族”。
