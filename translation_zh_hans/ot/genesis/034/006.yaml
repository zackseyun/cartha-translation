  language: zh_hans
  text: 示剑的父亲哈抹出去见雅各，要和他谈话。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: 出去
  rationale: יצא在叙事性未完成式中表示接续发生的过去动作；“出去”保留了原文的方向意味，也符合现代汉语叙事表达。
- source_word: חֲמוֹר
  choice: 哈抹
  rationale: 按现代中文圣经人名的通行音译处理该专名。
- source_word: אֲבִי שְׁכֶם
  choice: 就是示剑的父亲
  rationale: 原文为同位说明，直陈哈抹与示剑的父子关系；加入“就是”使中文结构清楚自然，不改变语义。
- source_word: אֶל יַעֲקֹב
  choice: 见雅各
  rationale: אֶל表示朝向某人；结合“出去”及随后的谈话目的，“出去见雅各”是自然中文，并保留趋向和会面之意。
- source_word: לְדַבֵּר אִתּוֹ
  choice: 要和他谈话
  rationale: לְ加不定式表达目的；דבר与אֵת连用表示同某人交谈。“和他谈话”保留互动意味，代词自然指向紧邻的雅各。
- source_word: וַ
  choice: 以句序承接，不另译连接词
  rationale: 前缀וַ推进叙事；中文可借动作顺序自然表达接续关系，无须机械译成“然后”或“于是”。
theological_decisions: []
