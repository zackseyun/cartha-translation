base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/011.yaml
  text: Then Shechem said to her father and to her brothers[a], “Let me find favor in your eyes, and whatever you say to me[b], I will give.”
translation:
  language: zh_hans
  text: 示剑对她父亲和她的兄弟们说：“愿我在你们眼前蒙恩；你们无论对我说什么[a]，我都会给。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你们无论向我索要什么，我都会给。”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 未单独译出叙事推进的连接词，以符合现代汉语自然叙事；上下文已能表达事件承接。
- source_word: שְׁכֶם
  choice: 示剑
  rationale: 采用现代中文圣经中通行的人名译法。
- source_word: אֶל אָבִיהָ וְאֶל אַחֶיהָ
  choice: 对她父亲和她的兄弟们
  rationale: 准确保留关系对象；“兄弟们”反映阳性复数 אַחֶיהָ。
- source_word: אֶמְצָא חֵן בְּעֵינֵיכֶם
  choice: 愿我在你们眼前蒙恩
  rationale: 保留希伯来语“在……眼前蒙恩”的惯用比喻，同时用庄重而可懂的现代汉语表达请求接纳、施予好意之意。
- source_word: וַאֲשֶׁר תֹּאמְרוּ אֵלַי
  choice: 你们无论对我说什么
  rationale: 按字面保留 אָמַר אֶל 的“对……说”，不依据婚姻协商语境收窄为“向我索要”。
- source_word: אֶתֵּן
  choice: 我都愿意给
  rationale: נָתַן 的基本义是“给”；不译作“支付”，避免将含义限定为聘金。加入“愿意”使其作为承诺在现代汉语中更自然。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“蒙恩”保留原文惯用表达和关系语气；“在你们眼前”保留希伯来语意象。脚注呈现语境上可能但解释性更强的译法。
