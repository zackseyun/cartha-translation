  terminology: “财物”恰当对应חֵילָם在本语境中的财富、资源或财产；“妻子”符合נְשֵׁיהֶם在家庭成员列表中的通常关系义；“掳走”与“抢掠”分别充分表达שָׁבָה和בזז的暴力夺取语义。脚注a、b均有明确锚点，内容与所标词语及原文的语义范围相符。
