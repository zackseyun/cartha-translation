  text: וְ/אֶת כָּל חֵילָ֤/ם וְ/אֶת כָּל טַפָּ/ם֙ וְ/אֶת נְשֵׁי/הֶ֔ם שָׁב֖וּ וַ/יָּבֹ֑זּוּ וְ/אֵ֖ת כָּל אֲשֶׁ֥ר בַּ/בָּֽיִת־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/029.yaml
  text: They took captive all their wealth and all their little ones and their wives[c][b][a], and plundered everything that was in the house.
translation:
  language: zh_hans
  text: 他们把他们所有的财物、幼小的孩子[a]和妻子都掳走了，又抢掠了屋里[b]的一切。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “幼小的孩子”或译“家中年幼的人”；希伯来语 טַף 常指年幼的孩子，有时也包括家中受扶养的人。
    reason: lexical_alternative
  - marker: b
    text: “屋里”也可理解为“家中”；希伯来语“房屋、家”有时可指整个家庭及其财物。
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵילָם
  choice: 他们所有的财物
  rationale: חַיִל在此指财富、资源或财产；“财物”自然涵盖被夺取的各类物品，又不局限于牲畜或军事力量。
- source_word: טַפָּם
  choice: 幼小的孩子
  rationale: טַף常指年幼的孩子，也可泛指家中受扶养的人；正文采用现代汉语中清楚自然的“幼小的孩子”，并以脚注保留较宽的可能含义。
- source_word: נְשֵׁיהֶם
  choice: 妻子
  rationale: אִשָּׁה既可指女人，也可指妻子；在家庭成员的列举中，关系性的“妻子”最自然。
- source_word: שָׁבוּ
  choice: 掳走了
  rationale: שָׁבָה通常表示掳为俘虏。由于希伯来文把财物、孩子和妻子一并前置作宾语，“掳走”既保留强行带走人的含义，也能自然地统摄并列的财物，避免把“俘虏”生硬地用于财物。
- source_word: וַיָּבֹזּוּ
  choice: 又抢掠了
  rationale: בזז表示劫掠、夺取战利品；“抢掠”保留了这一行动的暴力和掠夺性质。
- source_word: כָּל אֲשֶׁר בַּבָּיִת
  choice: 屋里的一切
  rationale: 直译保留单数בַּבָּיִת“屋里”的表达；在语境中也可能泛指家中或家业范围内的一切，脚注说明此义。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“掳走”保留强制掳掠的语气，并顺应希伯来文中财物与人口共同前置的句法；“又”清楚连接随后进一步抢掠屋内一切的动作。
