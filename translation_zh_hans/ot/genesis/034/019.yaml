base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/019.yaml
  text: And the young man did not delay to do the thing[a], because he delighted in Jacob’s daughter[d][c][b], and he was honored above all his father’s house.
translation:
  language: zh_hans
  text: 那年轻人毫不迟延，就做这件事[a]，因为他喜爱雅各的女儿[b]，又是他父亲全家中最受尊重的[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“毫不犹豫，就做这件事。”
    reason: 词义既可按时间理解为“不迟延”，在语境中也可表达“不犹豫”。
  - marker: b
    text: “喜爱”也可译作“爱慕”或“渴望得到”。
    reason: חָפֵץ 同时可包含喜悦、爱慕和欲求等意味。
  - marker: c
    text: 也可译作：“他比父亲家中所有人都更受尊重。”
    reason: מִכֹּל 可按汉语习惯译为最高级，也可明确译为比较结构。
lexical_decisions:
- source_word: אֵחַר
  choice: 毫不迟延
  rationale: 该动词表示耽延、迟迟不做；这里强调示剑立刻行动，而不主要强调他内心是否犹豫。
- source_word: הַנַּעַר
  choice: 那年轻人
  rationale: 所指是示剑；“年轻人”符合叙事语境，也比“少年”更不易让现代读者误以为他尚未成年。
- source_word: לַעֲשׂוֹת הַדָּבָר
  choice: 就去办这件事
  rationale: 保留希伯来语“做这事”的回指功能，同时用现代汉语自然的“办这件事”指向上文所提出的要求。
- source_word: חָפֵץ בְּבַת יַעֲקֹב
  choice: 喜爱雅各的女儿
  rationale: חָפֵץ 可表达喜悦、爱慕或渴望；“喜爱”保留其情感与欲求的宽度，不把含义限定为单纯性欲。
- source_word: נִכְבָּד מִכֹּל בֵּית אָבִיו
  choice: 在父亲全家中最受尊重
  rationale: נִכְבָּד 表示受尊重、被看重；形容词加 מִכֹּל 可自然表达群体中的最高程度，汉语用最高级最通顺。
theological_decisions: []
