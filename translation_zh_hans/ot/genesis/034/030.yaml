base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/030.yaml
  text: Then Jacob said to Simeon and Levi[a], “You have brought trouble on me, making me stink among the inhabitants of the land, among the Canaanites and the Perizzites. Since I am few in number, they will gather against me and strike me down[b], and I will be destroyed—I and my household.”
translation:
  language: zh_hans
  text: 雅各对西缅和利未说：“你们给我惹了祸，使我在这地的居民，就是迦南人和比利洗人中，成了可憎的人[a]。我人丁稀少；他们会聚集起来攻击我，把我击垮，我和我的全家都要被消灭。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“使我在这地的居民中发臭”，意思是使我遭人厌恶。
    reason: 保留希伯来原文鲜明的字面意象，并说明其比喻意义。
lexical_decisions:
- source_word: עֲכַרְתֶּם אֹתִי
  choice: 你们给我惹了祸
  rationale: עכר表示给某人带来祸患或灾难；此译自然地保留了雅各直接责备的语气，又没有把灾祸程度解释得过重。
- source_word: לְהַבְאִישֵׁנִי
  choice: 使我……成了可憎的人
  rationale: 该词使役形字面为“使我发臭”，在这里比喻使人在当地居民眼中变得可恶、遭人厌弃。正文采用自然的现代汉语表达，字面意象保留在脚注中。
- source_word: בְּיֹשֵׁב הָאָרֶץ
  choice: 在这地的居民……中
  rationale: 集合意义的分词指居住在当地的人群；“这地的居民”准确、通顺。
- source_word: בַּכְּנַעֲנִי וּבַפְּרִזִּי
  choice: 就是迦南人和比利洗人
  rationale: 这两个族群说明前面的“这地的居民”所指的对象；用“就是”明确同位关系，避免汉语中重复“在……中”的生硬表达。
- source_word: מְתֵי מִסְפָּר
  choice: 我人丁稀少
  rationale: 这是表示人数不多的习语；“人丁稀少”既体现雅各一方是一个家族群体，也符合庄重而自然的叙事语体。
- source_word: וְנֶאֶסְפוּ עָלַי
  choice: 他们会聚集起来攻击我
  rationale: אסף的Niphal形式在此表示众人联合、聚集起来敌对雅各；此译保留聚集的动作及敌对方向。
- source_word: וְהִכּוּנִי
  choice: 把我击垮
  rationale: נכה可指击打、攻打或击败；在可能导致全家灭亡的群体冲突中，“击垮”比单纯“攻击”更有力度，同时不必断定该动词本身就等于杀死。
- source_word: וְנִשְׁמַדְתִּי
  choice: 都要被消灭
  rationale: שמד表示毁灭、除灭；“被消灭”保留了原文所表达的彻底毁灭威胁。
- source_word: בֵּיתִי
  choice: 我的全家
  rationale: בַּיִת在这里指雅各的整个家庭或家族单位，而不是房屋；“全家”在现代汉语中清楚自然。
theological_decisions: []
