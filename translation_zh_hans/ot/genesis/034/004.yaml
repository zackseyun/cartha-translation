  yaml_path: translation/ot/genesis/034/004.yaml
  text: And Shechem said to Hamor his father, “Get me this girl as a wife.”
translation:
  language: zh_hans
  text: 示剑对他父亲哈抹说：“把这个少女给我娶来作妻子。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קַח לִי
  choice: 给我娶来
  rationale: 该短语字面为“为我取来”，在婚姻语境中自然表达为“给我娶来”，同时保留示剑要求父亲出面促成婚事的意味。
- source_word: הַיַּלְדָּה הַזֹּאת
  choice: 这个少女
  rationale: יַלְדָּה在此指年轻女子；“少女”比“女孩”更符合婚娶语境，又不额外断定其确切年龄。
- source_word: לְאִשָּׁה
  choice: 作妻子
  rationale: 直接保留目的性婚姻表达，即取得她作为妻子。
theological_decisions:
- issue: 是否在译文中加入对示剑行为的道德评语
  choice: 不增添评语，保留叙事原貌
  alternative: 译入“强要”等带明确谴责色彩的措辞
  rationale: 原文本节直接记录示剑的要求；其道德性质由上下文呈现，不应在本句中另行解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“给我娶来”符合汉语父子商议婚事的表达，也贴近原文简短而命令式的口吻。
