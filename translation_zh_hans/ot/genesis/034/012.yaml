  text: הַרְבּ֨וּ עָלַ֤/י מְאֹד֙ מֹ֣הַר וּ/מַתָּ֔ן וְ/אֶ֨תְּנָ֔ה כַּ/אֲשֶׁ֥ר תֹּאמְר֖וּ אֵלָ֑/י וּ/תְנוּ לִ֥/י אֶת הַֽ/נַּעֲרָ֖ לְ/אִשָּֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/012.yaml
  text: Demand from me a very large bride-price and gift[a], and I will give whatever you say to me; only give me the young woman as a wife.
translation:
  language: zh_hans
  text: 你们尽管向我索要极多的聘礼和礼物[a]，无论你们向我提出什么，我都愿意给；只要把这年轻女子给我作妻子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“婚聘金”。希伯来语 מֹהַר 特指新郎或男方家庭付给女方家庭的财物，并非女方带入婚姻的嫁妆。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַרְבּוּ עָלַי מְאֹד
  choice: 尽管向我索要极多的
  rationale: 该复数命令式与介词结构表示让索取的数额大大加在说话者身上；“尽管……索要极多的”自然传达其不限数额、任由对方开价的语气。
- source_word: מֹהַר
  choice: 聘礼
  rationale: 此词特指新郎或男方家庭向女方家庭支付的婚姻款项；现代汉语“聘礼”比“嫁妆”准确。
- source_word: וּמַתָּן
  choice: 和礼物
  rationale: 指聘礼之外所赠的礼物或财物；保留单数集合意义，并与“聘礼”并列。
- source_word: וְאֶתְּנָה
  choice: 我都愿意给
  rationale: 该祈愿式在此表达说话者明确的意愿和承诺；“愿意给”比单纯将来时更能体现其主动允诺。
- source_word: כַּאֲשֶׁר תֹּאמְרוּ אֵלָי
  choice: 无论你们向我提出什么
  rationale: 表示对方无论提出何种数额或条件，说话者都答应照办，保留原文开放而不限定的范围。
- source_word: וּתְנוּ לִי
  choice: 只要把……给我
  rationale: 连接词在语境中引出整段话的核心请求；“只要”自然体现前面无限承诺所换取的唯一要求。
- source_word: הַנַּעֲרָ
  choice: 这年轻女子
  rationale: 指适婚年龄的年轻女性；“年轻女子”准确、现代，也避免“女孩”可能带来的年龄误解。
- source_word: לְאִשָּׁה
  choice: 作妻子
  rationale: 这是希伯来语常见的婚姻表达，意为娶她为妻；“作妻子”简洁而庄重。
theological_decisions: []
