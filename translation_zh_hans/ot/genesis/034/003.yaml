  text: וַ/תִּדְבַּ֣ק נַפְשׁ֔/וֹ בְּ/דִינָ֖ה בַּֽת יַעֲקֹ֑ב וַ/יֶּֽאֱהַב֙ אֶת הַֽ/נַּעֲרָ֔ וַ/יְדַבֵּ֖ר עַל לֵ֥ב הַֽ/נַּעֲרָֽ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/003.yaml
  text: His soul clung to Dinah[a], the daughter of Jacob[b], and he loved the young woman and spoke to the heart of the young woman.
translation:
  language: zh_hans
  text: 他的心依恋雅各的女儿底拿[a]。他爱这少女，并温言对她说话[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“他的魂紧紧依附底拿”；这里的“魂”可指人的内在自我或生命。
    reason: 说明希伯来文 נַפְשׁוֹ 与 דבק 的字面意象和语义范围。
  - marker: b
    text: 直译“对着少女的心说话”，是指温和地对她说话，也可含安慰、劝慰或使她安心之意。
    reason: 解释希伯来习语 דבר על־לב，并保留其语气上的一定开放性。
lexical_decisions:
- source_word: וַתִּדְבַּק נַפְשׁוֹ בְּדִינָה
  choice: 他的心依恋……底拿
  rationale: דבק 表示紧贴、依附或依恋；נפש 在这里指人的内在生命或情感主体。译作“他的心依恋”既传达强烈的情感依附，又比直译“他的魂紧贴”更符合现代汉语。
- source_word: בַּת יַעֲקֹב
  choice: 雅各的女儿
  rationale: 保留底拿与雅各的亲属关系，同时采用自然简洁的汉语领属结构。
- source_word: וַיֶּאֱהַב
  choice: 他爱
  rationale: אהב 的基本义是“爱”。不改译为“贪恋”或“迷恋”，以免把上下文中的道德判断直接加入本节措辞。
- source_word: הַנַּעֲרָ
  choice: 这少女
  rationale: נַעֲרָה 指年轻女子；“少女”简洁庄重，并用“这”自然承接前文所指的底拿。
- source_word: וַיְדַבֵּר עַל לֵב הַנַּעֲרָ
  choice: 说话宽慰她
  rationale: 字面为“对着少女的心说话”，是表示安慰、劝慰或温言相劝的希伯来习语。“说话宽慰她”在现代汉语中自然，也避免把语气过度浪漫化。
theological_decisions:
- issue: 强暴事件之后对示剑情感的叙述
  choice: 按原文保留“依恋”和“爱”等情感用语，不在本节中另加谴责性措辞
  alternative: 改用“迷恋”“占有欲”等带有明显负面评价的词，或用更浪漫化的表达
  rationale: 本节直接叙述示剑的依附、爱和宽慰之言；忠实翻译这些词并不等于认可或淡化上文的暴行。译文既不应为他开脱，也不应把原文未明说的道德评语嵌入本节。
- issue: “对着心说话”这一习语的语气
  choice: 正文译出其宽慰含义，脚注保留字面形式及可能语义
  alternative: 正文直译为“对少女的心说话”，或明确译为“向她甜言蜜语”
  rationale: 直译在现代汉语中生硬且含义不明；“甜言蜜语”则带入欺骗或诱惑的判断。用“宽慰”可自然表达该习语的主要功能，同时由脚注呈现形式和语义幅度。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“他的心依恋”保留原文的情感强度而不显生硬；“说话宽慰她”表达习语功能，但不加入“甜言蜜语”等带有额外道德或动机判断的措辞。
