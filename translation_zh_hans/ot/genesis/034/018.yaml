  text: Their words seemed good to Hamor and to Shechem son of Hamor[a].
translation:
  language: zh_hans
  text: 他们的话，哈抹和哈抹的儿子示剑都认为很好[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们的话使哈抹和哈抹的儿子示剑都很满意。”
    reason: 词义替代：וַיִּיטְבוּ与בְּעֵינֵי的组合表示“在某人看来为好”，也可自然表达为“满意、喜欢”。
lexical_decisions:
- source_word: וַיִּיטְבוּ
  choice: 很好
  rationale: 该动词以复数形式呼应主语“他们的话”，与“在……眼中”构成评价性表达；“很好”自然传达这些话被认为合宜、可接受。
- source_word: דִבְרֵיהֶם
  choice: 他们的话
  rationale: 保留דָּבָר复数及第三人称阳性复数后缀的基本词义，不将其缩窄为较具解释性的“提议”。
- source_word: בְּעֵינֵי
  choice: 在……眼中
  rationale: 保留希伯来语惯用表达的意象，表示在某人看来或得到某人的认可；现代汉语仍自然易懂。
- source_word: חֲמוֹר
  choice: 哈抹
  rationale: 按现代中文圣经人名的通行译法音译。
- source_word: שְׁכֶם
  choice: 示剑
  rationale: 按现代中文圣经人名的通行译法音译。
- source_word: בֶּן חֲמוֹר
  choice: 哈抹的儿子
  rationale: 自然表达父子关系，同时保留叙事中的身份说明。
