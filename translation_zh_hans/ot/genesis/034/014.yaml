base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/014.yaml
  text: And they said to them[a], “We cannot do this thing, to give our sister to a man who has a foreskin, for that is a disgrace to us.”
translation:
  language: zh_hans
  text: 他们对那些人说：“我们不能做这件事：把我们的姊妹给一个有包皮的男人[a]，因为这对我们是耻辱。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“未受割礼的男人。”原文直译为“有包皮的男人”。
    reason: 保留希伯来文具体措辞，同时说明现代汉语中更惯常的表达。
lexical_decisions:
- source_word: וַיֹּאמְרוּ אֲלֵיהֶם
  choice: 他们对那些人说
  rationale: 直译叙事中的说话事件，并保留复数间接宾语；用“那些人”避免连续两个“他们”造成指代含混。
- source_word: לֹא נוּכַל
  choice: 我们不能
  rationale: יכל在此表示能力或可能性；“不能”自然简洁，也保留说话者所声称的不可行。
- source_word: לַעֲשׂוֹת הַדָּבָר הַזֶּה
  choice: 做这事
  rationale: 符合现代汉语习惯，并保留דבר所指的“事”。
- source_word: לָתֵת אֶת אֲחֹתֵנוּ
  choice: 把我们的姊妹给
  rationale: 保留נתן“给”的直白表达，不在正文中补出“嫁”；“姊妹”不擅自指定年长或年幼。
- source_word: לְאִישׁ
  choice: 给一个……的人
  rationale: איש在此是普通的“男人／人”；婚姻语境已明确，无须解释成“丈夫”。
- source_word: אֲשֶׁר לוֹ עָרְלָה
  choice: 有包皮的人
  rationale: 紧贴原文“有包皮”的具体表达；较惯常的“未受割礼的人”列入脚注。
- source_word: כִּי חֶרְפָּה הִוא לָנוּ
  choice: 因为这对我们是耻辱
  rationale: חרפה表示羞耻、耻辱或受人鄙视的事；“耻辱”清楚传达其社会荣辱意味。
