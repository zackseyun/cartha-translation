base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/013.yaml
  text: Jacob’s sons answered Shechem and Hamor his father deceitfully and spoke[b][a], because he had defiled Dinah their sister.
translation:
  language: zh_hans
  text: 雅各的儿子们诡诈地[a]回答示剑和他的父亲哈抹；他们之所以这样回答，是因为示剑玷污了[b]他们的妹妹底拿。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“用诡诈的手段”。希伯来文用名词“诡诈”构成介词短语，在这里表示回应的方式。
    reason: lexical_alternative
  - marker: b
    text: 或译：“侵犯了”。希伯来文直译为“使……污秽”，在这里指示剑对底拿所做的事。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲנוּ
  choice: 回答
  rationale: ענה在此承接示剑和哈抹先前的提议，表示作出回应；“回答”自然且准确。
- source_word: בְנֵי יַעֲקֹב
  choice: 雅各的儿子们
  rationale: 忠实表达属格结构，也符合现代汉语的亲属表述。
- source_word: בְּמִרְמָה
  choice: 诡诈地
  rationale: מִרְמָה指欺骗、诡诈；介词短语在句中作方式状语，译作“诡诈地”较自然。
- source_word: וַיְדַבֵּרוּ
  choice: 他们这样说
  rationale: 保留דבר“说、讲话”的动作，并用“这样”自然衔接后续直接引语；不把它完全并入“回答”，从而保留原文两个动词。
- source_word: אֲשֶׁר
  choice: 是因为
  rationale: 此处引出雅各众子采取诡诈回应的原因，按上下文取因果义。
- source_word: טִמֵּא
  choice: 玷污了
  rationale: טמא的强意词干在此表示使之污秽、玷污；“玷污”保留原词的道德与洁净语义，同时脚注说明按事件语境可译作“侵犯”。
- source_word: אֲחֹתָם
  choice: 他们的妹妹
  rationale: 直译为“他们的姐妹”；底拿相对于这些哥哥，在现代汉语中自然称作“妹妹”。
- source_word: אֶת שְׁכֶם וְאֶת חֲמוֹר אָבִיו
  choice: 示剑和他父亲哈抹
  rationale: 准确标出两个受词，并清楚表达哈抹是示剑的父亲。
theological_decisions:
- issue: “玷污”是否应按性暴力语境直接译为“侵犯”
  choice: 正文保留“玷污了”
  alternative: “侵犯了”
  rationale: “玷污”贴近טמא的词汇范围，保留原文的道德和洁净语言；“侵犯”更直接说明事件性质，列入脚注而不取代原文意象。
- issue: טִמֵּא隐含主语的指向
  choice: 译作“他”，不在正文补明姓名
  alternative: “示剑”
  rationale: 希伯来文动词只以阳性单数形式标示主语，语境指向示剑，但正文使用“他”可保留原文表达方式，不额外强化解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“他们这样说”既避免汉语中“回答……并说”的生硬重复，也保留原文וַיַּעֲנוּ与וַיְדַבֵּרוּ两个动作。分号使原因说明与前面的回应动作层次清楚。
