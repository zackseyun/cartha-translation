base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/007.yaml
  text: And Jacob’s sons came in from the field when they heard it, and the men were grieved and very angry, because he had done an outrageous thing in Israel by lying with Jacob’s daughter, for such a thing must not be done.
translation:
  language: zh_hans
  text: 雅各的儿子们从田野回来，听见这事，就都很悲痛，也极其愤怒，因为他与雅各的女儿同寝，在以色列中做了可耻的事；这样的事绝不可做。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתְעַצְּבוּ
  choice: 很悲痛
  rationale: 该词在此表达受伤、痛苦或悲愤；“悲痛”自然传达他们听闻底拿遭遇后的强烈痛苦，同时不与后面的愤怒重复。
- source_word: נְבָלָה
  choice: 丑恶的事
  rationale: 该词指严重违背道德和群体规范的可耻暴行；“丑恶的事”语气强烈而庄重，也避免把含义缩窄为单纯的愚蠢。
- source_word: לִשְׁכַּב אֶת־בַּת יַעֲקֹב
  choice: 与雅各的女儿同寝
  rationale: 保留希伯来语的性关系委婉表达，不在本节中额外加入原文未明说的方式或法律定性；上下文仍明确显示这是严重恶行。
- source_word: וְכֵן לֹא יֵעָשֶׂה
  choice: 这样的事绝不该做
  rationale: 用强烈的规范性汉语表达原句“这样的事不可做／不当发生”的谴责；“绝不该”保留其道德禁令力度。
theological_decisions:
- issue: “在以色列中”用于以色列民族形成之前的叙事语境
  choice: 保留“在以色列中”
  alternative: 在雅各家中
  rationale: בְיִשְׂרָאֵל 原文明确如此，可能指雅各所代表的家族共同体，也带有叙述者从后来以色列群体规范回看此事的意味；不应在正文中消解这种时序张力。
- issue: 是否把“同寝”明确译成“强奸”
  choice: 正文保留“同寝”
  alternative: 强奸了雅各的女儿
  rationale: 本节的希伯来表达本身是“与……同寝”，虽上下文将事件描写为严重侵犯，译文仍保留本节措辞，不把上下文判断直接代入该短语。
- issue: 末句禁令的强度
  choice: 这样的事绝不该做
  alternative: 这样的事是不应当做的
  rationale: 原文是概括性的强烈谴责；“绝不该”比一般劝诫更准确地传达禁绝语气，但不额外指定成文律法或特定刑罚。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“众人”承接“雅各的儿子们”，避免连续重复；明确补出“示剑”作为上一文已经确立的施事者，使中文因果关系清楚。保留“以色列”这一原文称谓及其叙事张力。
