base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/010.yaml
  text: You may dwell with us[a], and the land will be before you. Settle in it, trade in it[b], and acquire property in it.
translation:
  language: zh_hans
  text: 你们可以和我们同住；这地就在你们面前[a]。你们可以在这里居住、经商，并置办产业[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“这地必在你们面前”。也可理解为“这地可供你们使用”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“在其中取得产业”或“在其中拥有地产”。希伯来语很可能指取得土地产业或相应的持有权。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִתָּנוּ תֵּשֵׁבוּ
  choice: 你们可以和我们住在一起
  rationale: יָשַׁב可指居住、定居；在邀请的语境中，用“可以”自然表达许可和邀请，而不把未完成式误解为单纯的未来预告。
- source_word: וְהָאָרֶץ תִּהְיֶה לִפְנֵיכֶם
  choice: 这地都摆在你们面前
  rationale: 较贴近希伯来语“这地必在你们面前”的意象，同时在现代汉语中可自然传达这地任其使用、可供选择的含义；“都”表达整片土地向他们开放，并非另加地域范围。
- source_word: שְׁבוּ
  choice: 你们可以在这里居住
  rationale: 这是יָשַׁב的命令式；结合整句邀请语气，以“可以”表达准许，比生硬的命令口吻更符合语境。“这里”承接前面的“这地”。
- source_word: וּסְחָרוּהָ
  choice: 经商
  rationale: סחר在此指从事贸易或商业活动。“经商”简洁、自然，也保留商业含义。
- source_word: וְהֵאָחֲזוּ בָּהּ
  choice: 并置办产业
  rationale: אָחַז的使役反身形在此很可能指取得土地上的产业或持有权。“置办产业”既体现取得财产，也符合古代以土地和家业为核心的社会语境。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事用语。“住在一起—在这里居住”保留原文同一词根的重复；分号与后一句的并列结构呈现邀请及其具体内容。脚注标记放在其实际说明的短语之后。
