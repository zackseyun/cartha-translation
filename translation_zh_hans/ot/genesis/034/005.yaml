base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/005.yaml
  text: Jacob heard that he had defiled his daughter Dinah. But his sons were with his livestock in the field[a], so Jacob kept silent until they came.
translation:
  language: zh_hans
  text: 雅各听说，示剑玷污了他的女儿底拿[a]。可是，他的儿子们在田野里，和他的牲畜在一起；雅各便没有作声，直到他们到来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“侵犯了他的女儿底拿”。希伯来文动词直译为“玷污”或“使不洁”；在这里指在性方面凌辱底拿。
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַע
  choice: 听说
  rationale: 这里指雅各听到并得知所发生的事；“听说”符合现代汉语叙事习惯，也保留了“听见消息”的语义。
- source_word: כִּי
  choice: （引出听说的内容）
  rationale: 此处引出雅各所听到的消息；汉语以逗号直接连接更自然，无须另译“因为”。
- source_word: טִמֵּא
  choice: 玷污了
  rationale: 该词的皮勒尔词形意为“使不洁、玷污”。在本语境中涉及对底拿的性凌辱；“玷污”保留原词的洁净、名誉和社会层面的语义力度，又不把词义本身过度限定为某一特定法律术语。
- source_word: בִתּוֹ
  choice: 他的女儿
  rationale: 按希伯来文第三人称阳性单数后缀直译；在句中指雅各的女儿。
- source_word: וּבָנָיו
  choice: 可是，他的儿子们
  rationale: 连接词在此引出与雅各得知消息形成叙事张力的背景情况；“可是”自然地说明儿子们当时不在场。
- source_word: הָיוּ אֶת מִקְנֵהוּ בַּשָּׂדֶה
  choice: 正和他的牲畜在田野里
  rationale: 原文只陈述儿子们与牲畜同在田野，并未明确使用“放牧”一类动作动词，因此保留较贴近原文的地点描述。
- source_word: מִקְנֵהוּ
  choice: 他的牲畜
  rationale: מִקְנֶה在这里泛指所饲养的牲畜或畜群；“牲畜”比“牛”宽泛，也比“财产”具体。
- source_word: וְהֶחֱרִשׁ
  choice: 便没有作声
  rationale: 该使役词形在此表示克制自己、不说话或不作回应；“没有作声”自然表达雅各暂时保持沉默。
- source_word: עַד בֹּאָם
  choice: 直到他们到来
  rationale: 原文为“直到他们来”。“直到他们到来”在现代汉语中通顺，并避免用“回来”增添原文未明说的返回含义。
theological_decisions:
- issue: 玷污底拿者的身份在本节仅以隐含主语表达
  choice: 正文补出“示剑”
  alternative: 使用“他”或“那人”
  rationale: 希伯来文动词的主语承接上文，明确指示剑。现代汉语若只用“他”，紧接“雅各”容易误读为雅各是施事者；补出上文已有的姓名是为消除目标语中人为产生的歧义，并未改变叙事所指。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“玷污”保留原文用词所带的洁净与名誉意涵，脚注说明其在本语境中的性含义；“没有作声”比书面化较强的“保持缄默”更贴近日常可读的标准普通话。
