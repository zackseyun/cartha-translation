  yaml_path: translation/ot/genesis/034/028.yaml
  text: They took their flocks[a], their herds, their donkeys, and whatever was in the city and whatever was in the field.
translation:
  language: zh_hans
  text: 他们把他们的羊群、牛群和驴，以及城里和田野[a]里的一切，都夺走了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “田野”也可译作“郊野”。
    reason: שָׂדֶה既可指田地，也可泛指城外的开阔地或乡野；上下文未限定为耕地。
lexical_decisions:
- source_word: צֹאנָם
  choice: 他们的羊群
  rationale: צֹאן是集合名词，主要指绵羊和山羊等小型牲畜；“羊群”自然简洁，并保留集合意义。
- source_word: בְּקָרָם
  choice: 他们的牛群
  rationale: בָּקָר通常指牛类牲畜；“牛群”与“羊群”并列自然，也体现原文的集合意义。
- source_word: חֲמֹרֵיהֶם
  choice: 他们的驴
  rationale: חֲמוֹר明确指驴；汉语用“驴”即可自然表达复数类属，不必机械添加量词。
- source_word: אֲשֶׁר בָּעִיר וְאֶת אֲשֶׁר בַּשָּׂדֶה
  choice: 城里和田野里的一切
  rationale: 两个关系结构共同概括掠取的对象；“一切”传达其广泛而未逐项说明的范围，同时保留城内与城外土地的对应。
- source_word: לָקָחוּ
  choice: 都夺走了
  rationale: לָקַח本义为“拿、取”；在本段劫掠语境中，“夺走”比中性的“拿走”更自然准确，又未增添“掳掠”等更强的解释性措辞。
