  text: אֶֽעֱבֹ֨ר בְּ/כָל צֹֽאנְ/ךָ֜ הַ/יּ֗וֹם הָסֵ֨ר מִ/שָּׁ֜ם כָּל שֶׂ֣ה נָקֹ֣ד וְ/טָל֗וּא וְ/כָל שֶׂה חוּם֙ בַּ/כְּשָׂבִ֔ים וְ/טָל֥וּא וְ/נָקֹ֖ד בָּ/עִזִּ֑ים וְ/הָיָ֖ה שְׂכָרִֽ/י־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/032.yaml
  text: Let me pass through all your flock today[a], removing from there every speckled and spotted sheep, every dark-colored lamb among the sheep, and every spotted and speckled one among the goats[b]; and that will be my wages.
translation:
  language: zh_hans
  text: 今天让我走遍你所有的羊群；你要从中挑出所有有斑点和花斑的羊、绵羊中所有深色的羊[a]，以及山羊中所有花斑和有斑点的羊[b]。这些就作为我的工钱。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “深色”也可译作“棕褐色”。希伯来语חוּם指绵羊身上的深色或棕色毛色。
    reason: lexical_alternative
  - marker: b
    text: “有斑点”（נָקֹד）和“花斑”（טָלוּא）都指带斑纹的毛色，两者的确切区别可能有所重叠；也可分别译作“点斑”和“块斑”等。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶעֱבֹר
  choice: 让我走遍
  rationale: 该词是עבר的Qal未完成式第一人称单数；在雅各向拉班提出条件的语境中，可带请求或意愿语气。“让我走遍”自然表达这种协商语气。
- source_word: בְּכָל צֹאנְךָ
  choice: 你所有的羊群
  rationale: צֹאן是小型牲畜的集合名词，通常包括绵羊和山羊；“羊群”在现代汉语中自然，并由下文具体区分两类。
- source_word: הָסֵר מִשָּׁם
  choice: 你要从中挑出
  rationale: 按马所拉元音，הָסֵר是Hiphil祈使式第二人称阳性单数，直指拉班执行分离；“挑出”准确体现从羊群中分开的实际动作。
- source_word: נָקֹד
  choice: 有斑点
  rationale: 指带有较小斑点或点状花纹的牲畜；“有斑点”清楚易懂。
- source_word: טָלוּא
  choice: 花斑
  rationale: 表示有块状、杂色斑纹；“花斑”既自然，又可与נָקֹד的点状斑纹作相对区分。
- source_word: חוּם
  choice: 深色
  rationale: 该词指深色或棕褐色。正文采用涵盖面较广的“深色”，避免把具体色调说得过于确定。
- source_word: בַּכְּשָׂבִים
  choice: 绵羊中
  rationale: כְּשָׂבִים在此与山羊相对，指绵羊类；译作“绵羊中”使物种对比明确。
- source_word: בָּעִזִּים
  choice: 山羊中
  rationale: עִזִּים在此泛指山羊；不必限定为母山羊。
- source_word: וְהָיָה שְׂכָרִי
  choice: 这些就作为我的工钱
  rationale: שָׂכָר指雇佣关系中的报酬。“工钱”符合雅各为拉班牧放羊群的语境；“这些”明确指被挑出的牲畜。
theological_decisions:
- issue: 由谁挑出这些牲畜
  choice: 译为拉班执行：“你要从中挑出”
  alternative: 译为雅各一边查看羊群一边亲自挑出：“让我……从中挑出”
  rationale: 马所拉文本הָסֵר按元音是第二人称阳性单数祈使式，最直接的受命者是拉班；后文创世记30:35也叙述拉班当天把这些牲畜分开。此处按语法保留该人物分工，不依英语咨询层的分词结构处理。
translation_notes:
  register: 采用现代、庄重而口语可懂的叙事语言。“走遍”“挑出”“工钱”符合人物协商用语。用“绵羊／山羊”明确原文的类别对照，并保留两种斑纹术语之间并非完全确定的差异。
