base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/014.yaml
  text: In the days of the wheat harvest[a], Reuben went and found mandrakes in the field, and he brought them to Leah his mother. Then Rachel said to Leah, “Please give me some of your son’s mandrakes.”
translation:
  language: zh_hans
  text: 在收割小麦的时节，流便出去，在田野里找到了曼德拉草[a]，就把它们带给他母亲利亚。拉结对利亚说：“请给我一些你儿子的曼德拉草。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “曼德拉草”的确切植物身份有争议；这是一种传统识别，也可能称为“爱情果”。在本段前后叙事所反映的古代观念中，这种植物与生育有关。
    reason: 说明希伯来词דּוּדָאִים的植物识别并非完全确定，并保留英语审校记录所列的可能别称及其在周边叙事中的生育关联；不主张其具有实际功效。
lexical_decisions:
- source_word: בִּימֵי קְצִיר חִטִּים
  choice: 收割小麦的时候
  rationale: 该结构指小麦收割的时节；此译自然清楚，同时保留叙事的农业背景。
- source_word: וַיֵּלֶךְ
  choice: 到田野去
  rationale: הלך在连续叙事中表示“去”；结合紧接的地点短语译成“到田野去”，符合现代汉语表达，且不额外强调“出去”。
- source_word: דּוּדָאִים
  choice: 曼德拉草
  rationale: 这是该植物的传统识别，且与复数形式相合；其确切植物身份及相关别称存在讨论，因此另加脚注说明。
- source_word: בַּשָּׂדֶה
  choice: 在田野（整合为“到田野去”）
  rationale: שׂדה可指田地或野外；“田野”既适合采集野生植物的语境，也保持原文地点含义。
- source_word: וַיָּבֵא אֹתָם אֶל לֵאָה אִמּוֹ
  choice: 就拿来给他母亲利亚
  rationale: Hiphil形式表示“带来、拿来”，宾语为复数的曼德拉草；按自然汉语将“母亲”置于人名之前。
- source_word: תְּנִי נָא לִי
  choice: 请……分一些给我
  rationale: נָא表达请求语气；“请”保留礼貌或恳求色彩。
- source_word: מִדּוּדָאֵי בְּנֵךְ
  choice: 把你儿子的曼德拉草分一些给我
  rationale: מִן在此为部分用法，“分一些”自然表达拉结只索要其中一部分，并保留“你儿子的”所属关系。
theological_decisions:
- issue: 曼德拉草与生育能力的关系
  choice: 正文只译植物名称，不断言其具有促孕功效
  alternative: 在正文中称其为助孕植物或催情果
  rationale: 本节只叙述发现和索取这种植物；其与生育的文化联想可在脚注交代，但原文没有直接宣称其实际功效。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“收割小麦的时候”比直译“在小麦收割的日子”更符合现代汉语；“分一些给我”准确表达部分用法。脚注标记紧随“曼德拉草”，避免误附于“小麦收割”。
