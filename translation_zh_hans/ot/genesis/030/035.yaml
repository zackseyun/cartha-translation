  text: וַ/יָּ֣סַר בַּ/יּוֹם֩ הַ/ה֨וּא אֶת הַ/תְּיָשִׁ֜ים הָֽ/עֲקֻדִּ֣ים וְ/הַ/טְּלֻאִ֗ים וְ/אֵ֤ת כָּל הָֽ/עִזִּים֙ הַ/נְּקֻדּ֣וֹת וְ/הַ/טְּלֻאֹ֔ת כֹּ֤ל אֲשֶׁר לָבָן֙ בּ֔/וֹ וְ/כָל ח֖וּם בַּ/כְּשָׂבִ֑ים וַ/יִּתֵּ֖ן בְּ/יַד בָּנָֽי/ו־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/035.yaml
  text: That day he removed the male goats that were streaked and spotted[a], and all the female goats that were speckled and spotted—every one that had white on it—and every dark-colored one among the lambs[c][b], and he put them into the care of his sons.
translation:
  language: zh_hans
  text: 当天，他把有条纹、有斑块的公山羊[a]，以及所有身上凡有白色、有斑点、有斑块的母山羊，又把羔羊中所有棕褐色的[b]，都挑了出来，交由他的儿子们看管[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “有条纹”也可译作“有环状条纹”或“有带状花纹”；原文指带状的花纹。
    reason: lexical_alternative
  - marker: b
    text: “棕褐色”也可译作“深色”；“羔羊”也可译作“羊”。
    reason: lexical_alternative
  - marker: c
    text: 原文直译为“交在他儿子们手中”，意思是交由他们掌管或照料。
    reason: idiom
lexical_decisions:
- source_word: וַיָּסַר
  choice: 挑了出来
  rationale: 使役形在本段语境中表示把符合条件的牲畜从群中移出、分开；“挑了出来”自然表达按特征拣出并隔离的动作。
- source_word: הַתְּיָשִׁים
  choice: 公山羊
  rationale: תיש特指雄性山羊；译作“公山羊”准确且符合现代汉语习惯。
- source_word: הָעֲקֻדִּים
  choice: 有条纹
  rationale: 该词指带状或条纹状花纹；“有条纹”保留其基本视觉特征，又不作过度细化。
- source_word: הַטְּלֻאִים / הַטְּלֻאֹת
  choice: 有斑块
  rationale: 该词所指花色较接近块状、杂色斑纹；译作“有斑块”可与表示细小斑点的 נקד 区分。
- source_word: הָעִזִּים
  choice: 母山羊
  rationale: עִזִּים本可泛指山羊，但这里紧接特指雄性的公山羊，且相关形容词为阴性复数，因此译出“母”更清楚地呈现原文对比。
- source_word: הַנְּקֻדּוֹת
  choice: 有斑点
  rationale: נקד表示点状、细斑状花纹；“有斑点”既准确，又与“有斑块”区分。
- source_word: כֹּל אֲשֶׁר לָבָן בּוֹ
  choice: 身上凡有白色的
  rationale: 直译结构表示任何身上带白色部分的个体；此译保留“凡……的”的周遍意义。
- source_word: וְכָל חוּם בַּכְּשָׂבִים
  choice: 绵羊中所有深褐色的
  rationale: חוּם指棕褐或深色；“深褐色”较具体地表达其色调。כְּשָׂבִים可指羊或羔羊，此处用“绵羊”与山羊形成清楚对照，同时在脚注保留“羔羊”的可能。
- source_word: וַיִּתֵּן בְּיַד בָּנָיו
  choice: 交给他的儿子们看管
  rationale: “交在……手中”是表示置于某人掌管之下的希伯来语习语；“交给……看管”自然传达其托付与控制之意。
theological_decisions: []
