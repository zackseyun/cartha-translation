base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/002.yaml
  text: Then Jacob became angry with Rachel and said[a], “Am I in the place of God[b], who has withheld the fruit of the womb from you?”
translation:
  language: zh_hans
  text: 雅各向拉结发怒[a]，说：“难道我能代替那位不让你生儿育女的上帝吗？[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 较直译作“雅各的怒气向拉结燃烧”。
    reason: lexical_alternative
  - marker: b
    text: 直译“从你扣留腹中的果实”；“腹中的果实”是希伯来语习语，指儿女或后代。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: 发怒
  rationale: 希伯来语习语字面为“怒气燃烧”，现代汉语用“发怒”自然准确地表达其强烈情绪；脚注保留较形式对应的说法。
- source_word: בְּרָחֵל
  choice: 向拉结
  rationale: 介词在表示发怒的动词后标明怒气所针对的对象；“向拉结发怒”符合现代汉语表达。
- source_word: הֲתַחַת אֱלֹהִים אָנֹכִי
  choice: 难道我能代替上帝吗
  rationale: תַחַת在此表示替代、处于某人的位置或角色，而不是空间上的“在……下面”；反问句否认雅各拥有上帝的地位和权能。加入“能”使汉语反问自然，同时不改变其角色与能力层面的含义。
- source_word: אֱלֹהִים
  choice: 上帝
  rationale: 上下文及随后单数关系从句表明这里指独一的上帝。
- source_word: אֲשֶׁר מָנַע
  choice: 是他使……不能结出
  rationale: 原文关系从句明确以上帝为阻止生育的一方；这一表达在现代汉语中自然，并保留神圣行动者的明确性。
- source_word: מִמֵּךְ
  choice: 使你不能
  rationale: מִן表示从拉结那里扣留或使她得不到；结合谓语意译为“使你不能”，清楚传达剥夺或阻止的结果。
- source_word: פְּרִי בָטֶן
  choice: 腹中的果实
  rationale: 保留原文“腹中之果”的生育隐喻，同时以现代汉语可理解的形式表达子女或后代。
theological_decisions:
- issue: 拉结不育中的行动主体
  choice: 保留雅各明确把拉结不能生育归于上帝的说法。
  alternative: 将其弱化为纯粹的修辞反问，或模糊上帝的行动主体地位。
  rationale: 关系从句אֲשֶׁר מָנַע直接以上帝为阻止拉结获得“腹中果实”的主体；译文不应淡化这一陈述。
- issue: 雅各与上帝的关系
  choice: 将反问译为雅各否认自己能代替上帝。
  alternative: 译为“我是在上帝之下吗”或仅译作“我是上帝吗”。
  rationale: תַחַת在本句表示替代或占据他者的位置；“代替上帝”既保留角色含义，也避免误解为空间位置。
translation_notes:
  register: 采用现代、庄重而通俗的简体中文。“向……发怒”自然表达怒气对象；反问保留原文语气；“腹中的果实”保留具体隐喻，并用脚注说明其习语意义。
