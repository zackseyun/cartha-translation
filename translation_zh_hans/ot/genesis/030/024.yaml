  yaml_path: translation/ot/genesis/030/024.yaml
  text: And she called his name Joseph[a], saying, “May Yahweh add to me another son.”
translation:
  language: zh_hans
  text: 她给他起名叫约瑟[a]，说：“愿雅威再给我添一个儿子。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “约瑟”在希伯来语中与“愿他增添”或“他增添”一词同音。
    reason: 说明原文中人名“约瑟”与后文“添”之间无法在中文正文中完全保留的文字游戏。
lexical_decisions:
- source_word: וַתִּקְרָא אֶת־שְׁמוֹ
  choice: 她给他起名叫
  rationale: 这是希伯来语常见的命名句式，直译为“她称他的名”。译作“给他起名叫”既准确表达命名行为，也符合现代汉语习惯。
- source_word: יוֹסֵף
  choice: 约瑟
  rationale: 采用现代中文圣经传统中通行的人名译法，并以脚注说明此名与后文动词的语音和词义关联。
- source_word: לֵאמֹר
  choice: 说
  rationale: 作为引出直接引语的引用式不定词，简洁译为“说”。
- source_word: יֹסֵף
  choice: 愿……再给我添
  rationale: 该词是יסף的使役未完成式，意为“增加、增添”。在命名解释和祈愿语境中，以“愿”表达祈愿语气；“添”同时尽量显出它与“约瑟”之名的文字游戏。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来语四字神名的常见学术拟音译出其专名，不以称号替代。
- source_word: לִי בֵּן אַחֵר
  choice: 再给我添一个儿子
  rationale: בֵּן明确指“儿子”，אַחֵר指“另一个”。结合中文表达，用“再……一个儿子”自然传达拉结盼望另得一子的意思。
theological_decisions:
- issue: יֹסֵף在此是祈愿还是陈述
  choice: 愿雅威再给我添一个儿子
  alternative: 雅威必再给我添一个儿子
  rationale: 希伯来语未完成式本身容许不同情态理解；结合拉结为孩子命名并表达愿望的语境，祈愿读法更合适，但不把它强化为确定的预言。
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华／上主
  rationale: 原文直接使用神的专名，故以“雅威”音译，保留专名性质，不改换为称号。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“给他起名叫”符合现代叙事用语；“愿雅威再给我添一个儿子”保留祈愿语气，并以“添”呼应原文命名文字游戏。
