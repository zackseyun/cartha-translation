- source_word: רֹעֶה
  choice: 继续牧养
  rationale: 希伯来语分词表达当时持续进行的动作；“继续”使汉语中的延续状态清楚自然。
- source_word: צֹאן לָבָן הַנּוֹתָרֹת
  choice: 拉班其余的羊群
  rationale: צֹאן泛指小型家畜群，语境中以“羊群”表达最自然；הַנּוֹתָרֹת指分出之后留下的部分。
