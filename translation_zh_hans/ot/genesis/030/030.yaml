base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/030.yaml
  text: For the little that you had before me has increased into abundance[a], and Yahweh has blessed you at my coming. And now[b], when shall I also provide for my own household?
translation:
  language: zh_hans
  text: 我来以前，你原有的产业很少；如今却大大增多，极其丰盛[a]。耶和华因我的到来赐福给你[c]。如今，我何时才能也为自己的家谋划呢？[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “大大增多，极其丰盛”也可译作“迅速扩展，数量众多”。
    reason: lexical_alternative
  - marker: b
    text: “为自己的家谋划”直译为“也为自己的家做”。
    reason: lexical_alternative
  - marker: c
    text: 直译“在我的脚边（或脚下）”；此习语也可理解为“随着我的到来”或“因我的缘故”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מְעַט אֲשֶׁר הָיָה לְךָ לְפָנַי
  choice: 我来以前，你所有的很少
  rationale: לְפָנַי形式上是“在我以前/面前”，语境明确对比雅各到来前后拉班的产业，译成“我来以前”自然且准确。
- source_word: וַיִּפְרֹץ לָרֹב
  choice: 后来却增多，变得极其丰盛
  rationale: 兼顾פרץ所表达的迅速扩展和לָרֹב所表达的丰盛结果。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经语域中广为人知的专名形式，明确指向以色列上帝的神名。
- source_word: לְרַגְלִי
  choice: 因我的到来
  rationale: 字面为“在我的脚后/脚边”，在此是伴随到来或因某人而蒙福的习语；“因我的到来”保留语境中的因果意味。
- source_word: מָתַי אֶעֱשֶׂה גַם אָנֹכִי לְבֵיתִי
  choice: 我什么时候才能也为自己的家作些打算呢
  rationale: עשה לְבֵיתִי字面为“为我的家做”，在经济与家庭责任语境中指为自家谋划、置备；“作些打算”既自然又不过度限定具体行动。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 中文普通读者最熟悉“耶和华”；此处作为专名处理，不以“主”替代，从而保留原文神名的存在。
- issue: 祝福与雅各到来的关系
  choice: 因我的到来赐福给你
  alternative: 随着我的到来赐福给你
  rationale: לְרַגְלִי可有时间伴随或原因含义；正文采用符合雅各论证语境的因果表达，脚注保留其他可能。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“所有的”承接产业语境；“作些打算”表达为自家谋求生计与产业，但不把原文宽泛的“做”过度具体化。
