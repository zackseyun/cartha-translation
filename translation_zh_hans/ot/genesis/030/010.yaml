  text: 利亚的婢女[a]悉帕给雅各生了一个儿子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“女仆”。希伯来语 שִׁפְחָה 指地位从属的女性家庭仆役。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּלֶד
  choice: 生了
  rationale: 该叙事性连续式动词承接前文，表达下一件发生的事；“生了”自然准确地表示生育。
- source_word: זִלְפָּה
  choice: 悉帕
  rationale: 按现代中文圣经人名的通行音译处理。
- source_word: שִׁפְחַת
  choice: 婢女
  rationale: 该词指地位从属的女性仆役；“婢女”简洁、合乎庄重叙事语体，也保留其家庭中的从属身份。
- source_word: לֵאָה
  choice: 利亚的
  rationale: 希伯来语构属关系在中文中自然译为“利亚的”。
- source_word: לְיַעֲקֹב
  choice: 给雅各
  rationale: 介词 ל 在此结构中表明孩子归于雅各、雅各是父亲；“给雅各生了”符合中文表达，并保留原文关系。
- source_word: בֵּן
  choice: 一个儿子
  rationale: 原文为单数普通名词；中文用数量短语“一个儿子”表达自然。
