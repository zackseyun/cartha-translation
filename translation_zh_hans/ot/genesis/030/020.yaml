base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/020.yaml
  text: And Leah said[a], “God has endowed me with a good endowment. This time my husband will honor me, because I have borne him six sons.” So she called his name Zebulun.
translation:
  language: zh_hans
  text: 利亚说：“上帝赐给我一件美好的礼物。这一次，我丈夫会看重我[a]，因为我给他生了六个儿子。”于是，她便给他起名叫西布伦。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“会与我同住。”这个希伯来动词很少见，并与“西布伦”这个名字形成文字呼应；其含义可能兼有“看重”和“同住、留在利亚身边”之意。
    reason: 保留罕见动词 יִזְבְּלֵנִי 的词义不确定性及其与人名“西布伦”的文字游戏。
lexical_decisions:
- source_word: זְבָדַנִי אֱלֹהִים אֹתִי זֵבֶד טוֹב
  choice: 上帝赐给我一份美好的厚礼
  rationale: 用“赐给”和“厚礼”传达 זבד 与 זֵבֶד 的同源呼应，同时避免生硬重复，保持现代汉语自然庄重。
- source_word: הַפַּעַם
  choice: 这一次
  rationale: 准确表达利亚把这次生育与此前经历相对照的语气。
- source_word: יִזְבְּלֵנִי
  choice: 会看重我
  rationale: 该罕见动词在语境中表达利亚盼望丈夫因她生了六个儿子而提高对她的重视；另有“与我同住”的可能，保留在脚注中。
- source_word: אִישִׁי
  choice: 我丈夫
  rationale: 婚姻语境中自然明确的现代汉语表达。
- source_word: יָלַדְתִּי לוֹ שִׁשָּׁה בָנִים
  choice: 我给他生了六个儿子
  rationale: 自然地保留生育动作、间接宾语“给他”以及“六个儿子”的信息。
- source_word: וַתִּקְרָא אֶת שְׁמוֹ זְבֻלוּן
  choice: 于是，她给儿子起名叫西布伦
  rationale: 以自然现代汉语表达希伯来文的命名公式，并采用中文圣经传统中通行的人名译法。
