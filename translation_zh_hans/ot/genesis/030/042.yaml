base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/042.yaml
  text: But when the flock were feeble[a], he would not put them in; so the feeble ones became Laban’s[c][b], and the strong ones Jacob’s.
translation:
  language: zh_hans
  text: 但羊群较弱的时候[a]，他就不把枝条放在羊群面前[b]；这样，较弱的归拉班，健壮的[c]归雅各。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“羊群衰弱的时候”。这个希伯来词可指较弱的牲畜；也有人认为，在这里更具体地指较晚配种或品质较差的牲畜。
    reason: lexical_alternative
  - marker: b
    text: 即他不像前几节所说的那样，把枝条放在羊群面前。
    reason: cross_reference
  - marker: c
    text: “健壮的”也可译作“强壮的”或“有活力的”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְהַעֲטִיף הַצֹּאן
  choice: 但羊群较弱的时候
  rationale: 介词 בְּ 与不定式连用构成时间情境；עטף 在本节与 קְשֻׁרִים 对举，指牲畜较弱，但其是否特指较晚配种或较差的牲畜并不确定，因此译作宽泛自然的“较弱”。
- source_word: הַצֹּאן
  choice: 羊群
  rationale: צֹאן 是绵羊、山羊等小型牲畜的集合称呼；在本段牧养语境中，“羊群”简洁自然。
- source_word: לֹא יָשִׂים
  choice: 他就不把枝条放进去
  rationale: שׂים 意为“放、安置”；原文省略宾语，语境承接前文雅各在牲畜面前放置枝条的做法。中文补出“枝条”以明确所指，并用脚注说明。
- source_word: וְהָיָה
  choice: 这样……归……
  rationale: 此处表达前述做法造成的结果；“这样”自然呈现结果关系，而“归”准确表达后续 לְ 所标示的归属。
- source_word: הָעֲטֻפִים
  choice: 较弱的
  rationale: 该词与本节前半的 עטף 保持词根联系，指相对弱的牲畜；“较弱的”既保留对照，也避免过度限定生理或配种含义。
- source_word: וְהַקְּשֻׁרִים
  choice: 健壮的
  rationale: 此形式较罕见，但在与 הָעֲטֻפִים 的鲜明对举中指强健、有活力的牲畜；“健壮的”符合现代汉语牧畜语境。
- source_word: לְלָבָן / לְיַעֲקֹב
  choice: 归拉班 / 归雅各
  rationale: 两个 לְ 在平行结构中表示归属或分配；“归……”简洁地传达这种关系。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“较弱的／健壮的”形成清楚对照，并保留希伯来词义在具体生理状况或配种时机上的不确定性。分号呈现行为与结果之间的紧密关系。
