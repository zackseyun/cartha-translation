base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/003.yaml
  text: Then she said[a], “Here is my female servant Bilhah. Go in to her, so that she may bear on my knees[c][b], and I too may be built up through her.”
translation:
  language: zh_hans
  text: 她说：“看哪，我的婢女辟拉在这里。你与她同房吧，让她在我膝上生子[a]，我也可以借着她建立家室[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“她将在我的膝上生”。这可能指一种象征性接纳孩子的习俗：婢女所生的孩子被视为女主人的孩子。
    reason: cultural_note
  - marker: b
    text: “建立家室”原文直译为“被建立起来”；这里用建造的比喻表示借着后代建立家庭或家系。也可译作“我也可以借着她得孩子”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲמָתִי
  choice: 我的婢女
  rationale: אמה指处于从属地位的女性仆役，也可能具有奴仆身份。“婢女”简洁明确，并符合本段古代社会语境。
- source_word: בֹּא אֵלֶיהָ
  choice: 你与她同房吧
  rationale: 该希伯来语惯用语字面为“到她那里去”，在此委婉指发生性关系。中文用“与她同房”既自然庄重，也清楚传达实际含义。
- source_word: וְתֵלֵד עַל בִּרְכַּי
  choice: 好让她在我膝上生子
  rationale: 保留“在我膝上”这一具有文化标记的原文意象，同时补出中文语境中自然的“子”，表达生育后代之意；具体习俗留由脚注说明。
- source_word: וְאִבָּנֶה
  choice: 使我也可以……建立家室
  rationale: 原词是בנה“建造”的被动式，在这里以“被建立”的比喻表达借后代使家庭或家系得以建立。“建立家室”在现代中文中较自然，并保留建造类比喻。
- source_word: מִמֶּנָּה
  choice: 借着她
  rationale: 介词在这里表明辟拉是拉结获得后代、建立家室的途径；“借着她”自然表达这种媒介关系。
- source_word: גַם אָנֹכִי
  choice: 我也
  rationale: 保留原文强调拉结本人也要因辟拉所生的孩子而得以建立家室的语气。
theological_decisions:
- issue: “在我膝上生子”的文化含义
  choice: 正文保留原文意象，不直接改写为收养或代孕
  alternative: 使她替我生孩子
  rationale: 原文只陈述“在我膝上生”，可能涉及妻子象征性接纳婢女所生孩子的习俗，但具体仪式和法律意义并未完全明说，因此正文不把某一种解释定为唯一含义。
- issue: “被建立”的后代比喻
  choice: 译为“建立家室”，并以脚注保留字面信息
  alternative: 借着她得孩子
  rationale: “得孩子”能说明语境，却会抹去בנה的建造比喻；“建立家室”兼顾可懂性及原文意象，又不把重点限缩为单纯生育。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“看哪”保留הִנֵּה的提示和强调作用；“同房”清楚而不粗俗；对“膝上生子”和“建立家室”这两个文化及词义上有张力的表达，在正文保留其原文特色，并用脚注解释而不武断消除歧义。
