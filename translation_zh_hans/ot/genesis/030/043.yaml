  text: וַ/יִּפְרֹ֥ץ הָ/אִ֖ישׁ מְאֹ֣ד מְאֹ֑ד וַֽ/יְהִי ל/וֹ֙ צֹ֣אן רַבּ֔וֹת וּ/שְׁפָחוֹת֙ וַ/עֲבָדִ֔ים וּ/גְמַלִּ֖ים וַ/חֲמֹרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/043.yaml
  text: And the man became exceedingly prosperous[b][a], and he came to have many flocks and female slaves and male slaves and camels and donkeys.
translation:
  language: zh_hans
  text: 这人极其昌盛，有了许多羊群、女奴和男奴[a]、骆驼和驴。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “女奴和男奴”也可译作“婢女和仆人”。这里的希伯来语词可泛指家中的男女仆役，但在本节中，他们被列在这人所拥有的财产之中。
    reason: 说明原词的语义范围，并交代正文采用奴隶身份用语的依据。
lexical_decisions:
- source_word: וַיִּפְרֹץ ... מְאֹד מְאֹד
  choice: 极其昌盛
  rationale: פרץ本有“冲破、扩展”之意，在此语境中指财富迅速增长、兴旺；“极其”传达מְאֹד的重复所形成的强烈程度。
- source_word: הָאִישׁ
  choice: 这人
  rationale: 原文用普通名词“那人”，在上下文中指雅各；译作“这人”既自然，也不把专名直接加入正文。
- source_word: וַיְהִי לוֹ
  choice: 有了
  rationale: 这一结构表示经过前述发展而取得、拥有；“有了”比静态的“有”更能体现结果和叙事进展。
- source_word: צֹאן רַבּוֹת
  choice: 许多羊群
  rationale: צֹאן是绵羊和山羊等小型牲畜的集合称谓；“许多羊群”自然地表达其数量众多。
- source_word: שְׁפָחוֹת וַעֲבָדִים
  choice: 女奴和男奴
  rationale: 两个词在此成对列出，分别指隶属于家庭的女性和男性奴仆；他们与牲畜等财产并列，故正文保留其受奴役的社会身份。
- source_word: גְמַלִּים וַחֲמֹרִים
  choice: 骆驼和驴
  rationale: 采用这两个动物名称的现代标准译法。
theological_decisions:
- issue: 家庭劳役者的身份应译作“奴”还是较宽泛的“仆人”
  choice: 女奴和男奴
  alternative: 婢女和仆人／女仆和男仆
  rationale: 原词有奴隶和仆役的语义范围，但本节把这些人与所拥有的羊群、骆驼和驴并列，受支配和被占有的身份较为突出。译作“奴”避免淡化原文所反映的社会现实，同时脚注保留较传统的译法。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“极其昌盛”保留原文的强烈语气；清单使用现代汉语顿号，使累积结构清楚流畅。
