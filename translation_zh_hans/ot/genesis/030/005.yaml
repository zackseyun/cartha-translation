  text: Bilhah conceived and bore Jacob a son[a].
translation:
  language: zh_hans
  text: 辟拉怀孕，给雅各生了一个儿子。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתַּהַר
  choice: 怀孕
  rationale: 希伯来语 הרה 表示受孕、怀孕；现代汉语叙事中“怀孕”自然明确，并与后面的“生了”形成顺畅的事件次序。
- source_word: בִּלְהָה
  choice: 辟拉
  rationale: 采用现代中文圣经中较通行的人名音译。
- source_word: וַתֵּלֶד
  choice: 生了
  rationale: 希伯来语 ילד 在此指生育、产下；“生了”符合现代汉语叙事表达。
- source_word: לְיַעֲקֹב
  choice: 给雅各
  rationale: 保留介词 ל 所表达的关系，可自然理解为她为雅各生子，而不把这一关系弱化为单纯的父子说明。
- source_word: בֵּן
  choice: 一个儿子
  rationale: בֵּן 意为“儿子”；加入量词“一个”符合现代汉语习惯。
