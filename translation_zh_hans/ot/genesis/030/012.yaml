lexical_decisions:
- source_word: וַתֵּלֶד
  choice: 又……生了
  rationale: 叙事性连续式承接上一事件；“生了”是现代汉语出生叙事中的自然表达，“又”体现事件推进及再次生育的语境。
- source_word: זִלְפָּה
  choice: 悉帕
  rationale: 按现代中文圣经人名的通行音译处理。
- source_word: שִׁפְחַת לֵאָה
  choice: 利亚的婢女
  rationale: 该构造短语表明悉帕从属于利亚的女性仆役身份。“婢女”简洁保留性别及较低社会身份；脚注说明也可译作更明确的“女奴”，以免淡化原词所包含的奴属意味。
- source_word: בֵּן שֵׁנִי
  choice: 第二个儿子
  rationale: 直译为“第二个儿子”，在上下文中指悉帕为雅各所生的第二个儿子。
- source_word: לְיַעֲקֹב
  choice: 给雅各
  rationale: 介词 לְ 在生育公式中标示父亲或受益者；“给雅各生了”符合自然汉语，同时保留关系含义。
