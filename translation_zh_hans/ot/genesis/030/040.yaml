base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/040.yaml
  text: And Jacob separated the lambs[a], and he set the faces of the flock toward the striped and all the dark-colored among Laban's flock. Then he set apart flocks for himself[c][b], and did not put them with Laban’s flock.
translation:
  language: zh_hans
  text: 雅各把羊羔[a]分开，使羊群面向有条纹的羊和拉班羊群中所有褐色的羊[b]。他又把自己的羊群另行分开，不让它们混在拉班的羊群里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “羊羔”也可译作“幼羊”。
    reason: lexical_alternative
  - marker: b
    text: “拉班羊群中”也可理解为“出自拉班的羊群”。“褐色的羊”也可译作“深色的羊”。
    reason: source_ambiguity; lexical_alternative
lexical_decisions:
- source_word: הַכְּשָׂבִים
  choice: 羊羔
  rationale: 该词通常指羊羔或幼羊；译作“羊羔”比泛称“羊”更具体，同时以脚注保留“幼羊”的可能。
- source_word: הִפְרִיד
  choice: 分开
  rationale: 使役词形在这里表示将一群动物分离出来；“分开”直接、自然。
- source_word: פְּנֵי הַצֹּאן
  choice: 让羊群面向
  rationale: 原文直译为“把羊群的脸朝向”，所表达的是使羊群朝着某个方向；中文用“让羊群面向”既保留具体动作，也避免生硬。
- source_word: עָקֹד
  choice: 有条纹的羊
  rationale: 该词指身上有带状或条纹斑记的动物；“有条纹的羊”清楚而符合现代汉语。
- source_word: כָל חוּם
  choice: 所有褐色的羊
  rationale: חוּם表示褐色或较深的颜色；正文采用较具体的“褐色”，脚注保留“深色”的较宽译法。
- source_word: בְּצֹאן לָבָן
  choice: 拉班羊群中
  rationale: 介词ב最直接的理解是处所性的“在……中”；由于上下文也可能支持来源义，脚注保留“从拉班羊群所生的”这一理解。
- source_word: וַיָּשֶׁת לוֹ עֲדָרִים לְבַדּוֹ
  choice: 他为自己另立羊群
  rationale: שׁית表示安置或设立，לְבַדּוֹ强调分开；“为自己另立羊群”自然表达雅各建立属于自己的独立羊群。
- source_word: וְלֹא שָׁתָם עַל צֹאן לָבָן
  choice: 不把它们放在拉班的羊群中
  rationale: 宾语后缀指前述另立的羊群；עַל在这里表达与拉班羊群放在一起或相连的关系。中文如此译出两群没有混放。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“让羊群面向”保留希伯来文“羊群的脸”这一具体意象的核心动作；对介词ב的处所义与可能的来源义不作武断消解，而以正文和脚注共同呈现。
