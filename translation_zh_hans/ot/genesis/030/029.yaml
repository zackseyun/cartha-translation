  yaml_path: translation/ot/genesis/030/029.yaml
  text: He said to him[a], “You know how I have served you, and how your livestock has been with me.”
translation:
  language: zh_hans
  text: 他对他说：“你知道我怎样服事你，也知道你的牲畜在我这里的情形如何[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较直译作：“你的牲畜与我同在时怎样。”这句希伯来语在语境中可能指牲畜在雅各手中时的情形，包括是否兴旺，并不只是说它们所在的位置。
    reason: 保留 הָיָה … אִתִּי 的字面表达及其在牧养语境中可能指向牲畜状况的含义。
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלָיו
  choice: 他对他说
  rationale: 保留叙事中的说话动作及间接宾语；希伯来语句首连接词在现代汉语连续叙事中无需机械译出。
- source_word: אַתָּה יָדַעְתָּ
  choice: 你知道
  rationale: 完成式在此表达当前已知的事实。独立代词使“你”略带强调，汉语通过将“你知道”单独成分句自然体现，无需加“你自己”。
- source_word: אֵת אֲשֶׁר עֲבַדְתִּיךָ
  choice: 我怎样服事你
  rationale: עבד 在此指为人劳作、效力；“服事”兼顾雇佣劳动和从属效劳的语气，“怎样”则自然表达 אֲשֶׁר 在此引出的方式内容。
- source_word: מִקְנְךָ
  choice: 你的牲畜
  rationale: מִקְנֶה 是牛羊等家养群畜的集合称谓；“牲畜”范围适当，也符合现代汉语。
- source_word: הָיָה מִקְנְךָ אִתִּי
  choice: 你的牲畜在我照管之下情况如何
  rationale: 直译是“你的牲畜与我在一起时怎样”。结合牧养语境，这一表达询问牲畜在雅各手中所处的状况；正文以自然汉语传达照管关系，同时用脚注保留较为字面的表达。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。以分号呈现两个并列的“你知道”内容，并在第二分句补出汉语所需的“你也知道”，不增加新的命题内容。
