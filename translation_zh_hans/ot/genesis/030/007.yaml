  text: Bilhah[a], Rachel’s female slave, conceived again and bore Jacob a second son.
translation:
  language: zh_hans
  text: 拉结的女奴[a]辟拉又怀孕，给雅各生了第二个儿子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “女奴”也可译作“婢女”或“女仆”。希伯来语指社会地位较低、受人支配的女性奴仆。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּהַר עוֹד
  choice: 又怀孕
  rationale: הרה表示怀孕或受孕；עוֹד在此表示事件再次发生。现代汉语叙事中“又怀孕”自然、清楚。
- source_word: וַתֵּלֶד
  choice: 生了
  rationale: ילד的Qal形式在此指生育；“生了”符合现代汉语的出生叙事，也保留动作的直接性。
- source_word: שִׁפְחַת רָחֵל
  choice: 拉结的婢女
  rationale: שִׁפְחָה指社会地位较低、受主人支配的女性奴仆。“婢女”简洁庄重，并由脚注说明其受奴役身份，避免正文用语过于生硬。
- source_word: בֵּן שֵׁנִי
  choice: 第二个儿子
  rationale: 直译为“第二个儿子”，明确这是辟拉给雅各所生的第二子。
- source_word: לְיַעֲקֹב
  choice: 给雅各
  rationale: 介词לְ在此表达关系或归属；“给雅各生了”是自然汉语，并保留原文所呈现的父系关系。
- source_word: בִּלְהָה ... שִׁפְחַת רָחֵל
  choice: 拉结的婢女辟拉
  rationale: 原文以“辟拉”为主语，随后用同位语说明她是拉结的婢女；汉语将身份说明置于姓名之前更自然，信息未变。
