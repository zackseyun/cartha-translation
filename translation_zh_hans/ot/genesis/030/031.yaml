base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/031.yaml
  text: And he said[a], “What shall I give you?” And Jacob said, “You shall not give me anything. If you will do this thing for me, I will again pasture your flock and keep it.”
translation:
  language: zh_hans
  text: 拉班说：“我该给你什么呢？”雅各说：“你什么也不用给我。只要你为我做这件事，我就再[a]替你牧放、看守羊群。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我就回来，牧放并看守你的羊群。”希伯来语动词既可指回来，也可指重新开始或继续这项工作。
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה אֶתֶּן לָךְ
  choice: 我该给你什么呢
  rationale: 疑问词 מָה 与第一人称动词“给”构成询问报酬的提议；“该……什么”自然表达拉班请雅各开价的语气。
- source_word: לֹא תִתֶּן לִי מְאוּמָה
  choice: 你什么也不用给我
  rationale: 否定词 לֹא 与 מְאוּמָה 表示“什么也不”；此处不是预言将来，而是雅各直接拒绝拉班给付报酬，因此译为自然的现代汉语“不用给”。
- source_word: אִם תַּעֲשֶׂה לִּי הַדָּבָר הַזֶּה
  choice: 只要你为我做这件事
  rationale: אִם 引出雅各提出的条件；“只要”符合上下文中的交换条件，同时保留“为我做这件事”的指示表达。
- source_word: אָשׁוּבָה
  choice: 我就再
  rationale: שׁוב 可表示“回来”，也可在此语境表示重新或继续从事牧养工作；正文用“再”简洁保留重复、恢复行动的意味，并以脚注说明另一译法。
- source_word: אֶרְעֶה צֹאנְךָ
  choice: 替你牧放羊群
  rationale: רעה 指牧养、放牧牲畜；צֹאן 是以绵羊和山羊为主的小型牲畜群体，结合上下文译作“羊群”最自然。
- source_word: אֶשְׁמֹר
  choice: 看守
  rationale: שׁמר 在牧群语境中指照看和保护；“看守”既与“牧放”相配，也保留防护之意。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。根据上下文将首个第三人称主语明确为“拉班”，避免汉语中连续使用“他说”造成指代不清；“牧放、看守”保留原文两个并列动作。
