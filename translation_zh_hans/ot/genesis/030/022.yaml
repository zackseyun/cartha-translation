base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/022.yaml
  text: Then God remembered Rachel[b][a], and God listened to her and opened her womb.
translation:
  language: zh_hans
  text: 神顾念拉结[a]，垂听她[b]，打开了她的子宫[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“记念拉结”。原文的“记念”表示神顾念她并采取行动，并不是说神先前忘记了她。
    reason: lexical_alternative
  - marker: b
    text: 或译“听见了她”。
    reason: lexical_alternative
  - marker: c
    text: 原文直译“打开了她的子宫”，是指使她能够受孕。
    reason: idiom
lexical_decisions:
- source_word: וַיִּזְכֹּר
  choice: 顾念
  rationale: זכר在这里不只是头脑中的回想，而是带来行动的眷顾。“顾念”是现代中文常见且庄重的表达，也避免使读者误以为神先前忘记了拉结。
- source_word: אֱלֹהִים
  choice: 神
  rationale: 本节各动词均为单数，所指是独一的神；译作“神”自然准确。
- source_word: אֶת רָחֵל
  choice: 拉结
  rationale: אֶת标明“拉结”为直接宾语；人名按中文圣经传统音译。
- source_word: וַיִּשְׁמַע אֵלֶיהָ
  choice: 垂听了她
  rationale: שׁמע与אֶל连用可指留心听取并予以回应。“垂听”符合向神祈求的语境，但不直接增译为“应允”。
- source_word: וַיִּפְתַּח אֶת רַחְמָהּ
  choice: 使她能够怀孕
  rationale: 字面为“打开她的子宫”。现代汉语若直译为“打开她的子宫”容易产生生硬的解剖意象；此处习语表示神解除不孕，使她可以受孕。正文采用功能对等表达，并以脚注保留原文意象。
- source_word: וַ
  choice: 后来
  rationale: 句首叙事性连接词推进故事；结合前文长期不孕的背景，“后来”在现代汉语中自然地表达后续发展。
theological_decisions:
- issue: 神“记念”拉结的拟人表达
  choice: 正文译作“顾念”，表达神以恩惠关注她并采取行动。
  alternative: “记念拉结”
  rationale: 原文并非暗示神曾忘记拉结。“顾念”保留主动眷顾的含义；脚注同时列出较形式对应的译法，以呈现原文的圣经惯用语。
- issue: 神打开拉结的子宫
  choice: 正文译作“使她能够怀孕”。
  alternative: “打开她的子宫”或传统表达“使她生育”
  rationale: 原文以具体身体意象表明受孕能力来自神。现代正文采用清楚自然的表达，不将其扩大为有关怀孕机制或最终生产结果的额外论断，并用脚注保存字面意象。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“顾念”和“垂听”保留经文语体；“使她能够怀孕”避免生硬直译，同时通过脚注呈现希伯来语的具体意象。
