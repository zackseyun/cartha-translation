revisions:
- from: 后来，神顾念拉结[a]，垂听了她[b]，使她能够怀孕[c]。
  to: 神顾念拉结[a]，垂听她[b]，打开了她的子宫[c]。
  rationale: 修订保留“顾念”和“垂听”的自然、庄重表达，同时恢复原文及英文审校轨迹所保留的“打开她的子宫”这一身体性圣经惯用语。脚注解释该习语的受孕含义，而不在正文以解释替换原文意象；并移除会造成“服从”含义的脚注替代译法。
