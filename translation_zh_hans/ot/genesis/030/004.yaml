  yaml_path: translation/ot/genesis/030/004.yaml
  text: So she gave him Bilhah her servant as a wife[a], and Jacob went in to her.
translation:
  language: zh_hans
  text: 于是，她把自己的婢女[a]辟拉给他为妻，雅各就与辟拉同房。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “婢女”指处于从属地位的女性仆役，也可译作“女仆”。
    reason: 说明 שִׁפְחָה 所表达的性别和从属社会身份，并提供较现代的词汇选择。
lexical_decisions:
- source_word: וַתִּתֶּן
  choice: 于是，她把……给
  rationale: 连续式叙事动词推进情节；“于是”自然表达承接和结果关系，同时保留“给”的基本语义。
- source_word: לּוֹ
  choice: 给他
  rationale: 直接保留希伯来语的间接受词代词；下半句点明“雅各”，因此此处沿用“他”既忠实又自然。
- source_word: בִּלְהָה
  choice: 辟拉
  rationale: 采用现代中文圣经人名的通行译法。
- source_word: שִׁפְחָתָהּ
  choice: 自己的婢女
  rationale: שִׁפְחָה指社会地位从属的女性仆役。“婢女”简洁表达其性别与从属身份；“自己的”清楚呈现第三人称阴性所有格。
- source_word: לְאִשָּׁה
  choice: 为妻
  rationale: 该结构表示将女子交给男子形成婚姻或类似婚姻的结合。“为妻”保留原文的关系称谓，不自行把它解释为“妾”。
- source_word: וַיָּבֹא אֵלֶיהָ
  choice: 就与辟拉同房
  rationale: 这是希伯来语表示性结合的含蓄惯用语。现代中文“同房”同样含蓄且清楚；重复人名可避免“她”究竟指拉结还是辟拉的歧义。
- source_word: יַעֲקֹב
  choice: 雅各
  rationale: 采用现代中文圣经人名的通行译法。
theological_decisions:
- issue: 辟拉与雅各结合的身份性质
  choice: 为妻
  alternative: 作妾
  rationale: 原文明确使用 אִשָּׁה（女人／妻子），而不是专指妾的词；译作“为妻”保留原文措辞及其与婢女身份并存的张力，不以较具体的社会法律类别取代原文。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“于是……就……”体现叙事推进；“同房”保留原文含蓄表达。人名使用简体中文圣经传统通行形式。
