base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/018.yaml
  text: And Leah said[a], “God has given me my reward, because I gave my female servant to my husband.” So she named him Issachar.
translation:
  language: zh_hans
  text: 利亚说：“上帝给了我报酬，因为我把我的婢女给了我丈夫。”于是她给他起名叫以萨迦[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “以萨迦”这个名字在希伯来语中与“报酬”或“工价”一词读音相近，呼应了利亚的解释。
    reason: 说明原文中人名与שָׂכָר之间无法直接带入中文的语音双关。
lexical_decisions:
- source_word: נָתַן אֱלֹהִים
  choice: 上帝给了我
  rationale: 忠实表达完成的给予行动及其当前结果；现代汉语用“给了”自然清楚，无须额外加入时态成分。
- source_word: שְׂכָרִי
  choice: 我的报酬
  rationale: שָׂכָר可指工价、酬劳或奖赏。“报酬”既保留利亚话语中的回报意味，也能与“以萨迦”的希伯来语谐音关系相呼应；“工价”在此略显生硬，“奖赏”则较易淡化交易色彩。
- source_word: אֲשֶׁר
  choice: 因为
  rationale: 此处关系词在语境中引出利亚所认定的原因，译为“因为”最符合现代汉语表达。
- source_word: נָתַתִּי
  choice: 我把……给了
  rationale: 表达先前已经发生的行动，并与原文重复使用“给”相对应。
- source_word: שִׁפְחָתִי
  choice: 我自己的婢女
  rationale: שִׁפְחָה指处于从属身份的女性仆役。“婢女”简洁地保留其性别和社会身份；加入“自己的”自然体现第一人称所属关系。
- source_word: לְאִישִׁי
  choice: 给了我丈夫
  rationale: אִישׁ在此婚姻语境中明确指“丈夫”，而非泛指“男人”。
- source_word: וַתִּקְרָא שְׁמוֹ
  choice: 于是她给孩子起名叫
  rationale: 以自然现代汉语表达命名惯用语，并用“于是”承接叙事结果；“孩子”补明汉语所需的指称，但不增加新的身份信息。
- source_word: יִשָּׂשכָר
  choice: 以萨迦
  rationale: 采用中文圣经传统中通行的人名音译，并以脚注说明其与שָׂכָר的语音和意义联系。
theological_decisions:
- issue: 利亚将孩子出生解释为上帝所给的报酬
  choice: 直接保留利亚的因果解释和“报酬”措辞，不在正文中评价
  alternative: 译为较抽象的“奖赏”，或通过改写弱化因果和交易意味
  rationale: 原文是在记录利亚本人对事件的解释。译文既不替叙述者明确赞同，也不加入批评，从而保留文本中的神学张力。
translation_notes:
  register: 采用现代、庄重且口语可懂的叙事表达。“婢女”保留古代从属身份，不使用较含混的“女佣”；“报酬”兼顾自然度、原文交易色彩和命名双关。
