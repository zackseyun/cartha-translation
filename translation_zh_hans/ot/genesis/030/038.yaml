base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/038.yaml
  text: He set the rods that he had peeled in the troughs[a], in the watering channels where the flock came to drink, in front of the flock[c][b]; and they mated when they came to drink.
translation:
  language: zh_hans
  text: 他把剥了皮的枝条放在水槽、饮水沟中[a]，就是羊群来喝水的地方，正对着羊群；羊群来喝水时便发情[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “水槽”和“饮水沟”是两个意义相近的地点用语，可能是在更完整地描述同一处饮水设施，并不一定指两个彼此分开的地方。
    reason: lexical_alternative
  - marker: b
    text: 或译：“羊群来喝水时便交配。”希伯来语动词较直译为牲畜“发热、发情”，上下文则暗示交配行为。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּצֵּג
  choice: 放在
  rationale: 该动词表示把某物安放在特定位置；“放在”自然、具体，符合此处叙事动作。
- source_word: הַמַּקְלוֹת
  choice: 枝条
  rationale: 结合上一节，这是雅各从树上取来并剥皮的枝条；“枝条”比“棍子”更准确地承接上下文。
- source_word: אֲשֶׁר פִּצֵּל
  choice: 剥了皮的
  rationale: 此处指剥去部分树皮、露出白色木质；上一节已经说明剥成白色条纹，本节用简洁表达承接即可。
- source_word: בָּרֳהָטִים
  choice: 水槽里
  rationale: 该词指牲畜饮水处的槽或沟渠；“水槽”符合牧养场景，也便于现代读者理解。
- source_word: בְּשִׁקֲתוֹת הַמָּיִם
  choice: 饮水沟中
  rationale: 该短语与前面的“水槽”语义相近，进一步描述羊群饮水的设施；译文保留原文的双重地点表达。
- source_word: הַצֹּאן
  choice: 羊群
  rationale: 该集合名词可包括绵羊和山羊；汉语“羊群”自然，并可涵盖两者。
- source_word: לְנֹכַח הַצֹּאן
  choice: 正对着羊群
  rationale: 该介词短语表示处在羊群面前或与羊群相对的位置；“正对着”保留明确的空间关系。
- source_word: וַיֵּחַמְנָה
  choice: 就发情了
  rationale: 该动词字面涉及变热，并常指牲畜发情；这里采用较贴近词义的表达，不把上下文所暗示的交配直接写入正文。
- source_word: בְּבֹאָן לִשְׁתּוֹת
  choice: 来喝水时
  rationale: 介词加不定式结构表达时间情境；此译简明自然。
