  text: וַ/יִּשְׁמַ֥ע אֱלֹהִ֖ים אֶל לֵאָ֑ה וַ/תַּ֛הַר וַ/תֵּ֥לֶד לְ/יַעֲקֹ֖ב בֵּ֥ן חֲמִישִֽׁי־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/017.yaml
  text: And God listened to Leah[a], and she conceived and bore Jacob a fifth son.
translation:
  language: zh_hans
  text: 神垂听了利亚[a]，她就怀孕，给雅各生了第五个儿子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“神听见了利亚。”
    reason: 保留וַיִּשְׁמַע在较形式对应译法中的词义选择；“听见”较少明示有利回应。
lexical_decisions:
- source_word: וַיִּשְׁמַע אֱלֹהִים אֶל לֵאָה
  choice: 神垂听了利亚
  rationale: שׁמע与אֶל连用，在此不只是听见声音，也含有留意并作出回应的意味。“垂听”在现代中文圣经叙事中自然、庄重，并能简洁表达这种有回应的聆听。
- source_word: וַתַּהַר
  choice: 她就怀孕
  rationale: הרה表示怀孕。“怀孕”是现代普通读者最自然清楚的说法；“就”体现连续叙事中此事承接神垂听而发生，但不额外说明因果机制。
- source_word: וַתֵּלֶד לְיַעֲקֹב
  choice: 给雅各生了
  rationale: ילד加לְ在这里表示为雅各生育；“给雅各生了”符合现代汉语习惯，也保留原文的间接对象关系。
- source_word: בֵּן חֲמִישִׁי
  choice: 第五个儿子
  rationale: 直译序数与名词的关系，表达这是给雅各所生的第五个儿子。
- source_word: אֱלֹהִים
  choice: 神
  rationale: 此处在叙事中指独一的神；“神”是简体中文圣经语体中自然且明确的译法。
- source_word: לֵאָה / יַעֲקֹב
  choice: 利亚 / 雅各
  rationale: 采用现代中文读者熟悉并通行的圣经人名译法。
theological_decisions:
- issue: שׁמע אֶל所表达的神圣回应
  choice: 译作“神垂听了利亚”，表达神带着回应而听。
  alternative: “神听见了利亚”
  rationale: 原文可以较形式化地译为“听见”，但שׁמע与אֶל的搭配在上下文中通常含有关注、应允的意味。“垂听”保留这一关系性语气，却不具体补出利亚说了什么，也不把回应的方式解释得超过原文。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“垂听”略带圣经语域，但普通读者容易理解；句式简洁，保留希伯来文连续动作的推进。
