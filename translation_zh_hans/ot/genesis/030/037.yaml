base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/037.yaml
  text: Then Jacob took for himself fresh rods of poplar[a], almond, and plane tree, and peeled white stripes in them[c][b], exposing the white that was on the rods.
translation:
  language: zh_hans
  text: 雅各为自己取了新鲜的白杨[a]、杏树[b]和悬铃木[c]枝条；他在这些枝条上剥出一道道白纹，使枝条上白色的木质露出来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“安息香树”；לִבְנֶה所指的确切树种不能确定，通常译作“白杨”。
    reason: lexical_alternative
  - marker: b
    text: 有些旧译作“榛树”，但原词更可能指“杏树”。
    reason: lexical_alternative
  - marker: c
    text: 有些旧译作“栗树”，但原词更可能指“悬铃木”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מַקַּל
  choice: 枝条
  rationale: 这里指从树上取下、用于后续畜群繁育安排的木条；“枝条”比“杖”更符合新鲜树木材料的语境，也比“棍子”庄重自然。
- source_word: לִבְנֶה לַח
  choice: 白杨的新鲜枝条
  rationale: לַח表示新鲜、尚青湿；לִבְנֶה常译作白杨，但树种鉴定并不确定，因此正文采用常见译法并加注说明。
- source_word: לוּז
  choice: 杏树
  rationale: 该词更可能指杏树，而非旧译传统中的榛树；依原文词汇证据采用“杏树”。
- source_word: עֶרְמוֹן
  choice: 悬铃木
  rationale: 该树名通常被理解为悬铃木（plane tree）；旧译“栗树”可能性较低。
- source_word: וַיְפַצֵּל
  choice: 把树皮剥成
  rationale: 语境表明雅各剥去部分树皮，使浅色木质显露；这一表达清楚呈现动作。
- source_word: פְּצָלוֹת לְבָנוֹת
  choice: 一道道白纹
  rationale: 指间隔剥皮后形成的可见白色纹路；“一道道白纹”在现代汉语中具体自然。
- source_word: מַחְשֹׂף הַלָּבָן
  choice: 露出……白木
  rationale: 原文表达使白色部分裸露；“白木”明确指出树皮下显露的浅色木质。
- source_word: אֲשֶׁר עַל הַמַּקְלוֹת
  choice: 枝条上的
  rationale: 紧贴介词עַל的表层表达，同时在汉语中自然地说明显露的是枝条上的白色木质。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“给自己取来”保留ל֣וֹ所表达的为自己取用；“新鲜枝条”自然传达尚青湿的新砍木料。所有树种上的真实不确定性均由脚注保留，正文不依旧译传统强行定案。
