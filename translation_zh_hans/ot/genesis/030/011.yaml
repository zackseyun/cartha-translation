  yaml_path: translation/ot/genesis/030/011.yaml
  text: And Leah said[a], “Good fortune!” So she called his name Gad.
translation:
  language: zh_hans
  text: 利亚说[a]：“好运！”于是给他起名叫迦得。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语 בגד 的含义难以确定。它可理解为表示“好运”的感叹；传统上也有人译作“一队人！”“迦得”这个名字与这里的希伯来语文字游戏有关。
    reason: alternative_reading
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: 说
  rationale: 该叙事性动词承接前文，引出利亚的话；现代汉语不必机械译出连接词，也能保持自然的叙事推进。
- source_word: לֵאָה
  choice: 利亚
  rationale: 采用现代中文圣经中通行的人名译法。
- source_word: בגד
  choice: 真幸运！
  rationale: 此处希伯来语读法和含义有争议，但很可能是与“幸运、福气”有关的感叹，并与孩子的名字“迦得”形成谐音文字游戏；“真幸运！”符合利亚说话时的感叹语气。
- source_word: וַתִּקְרָא אֶת שְׁמוֹ
  choice: 于是给他起名叫
  rationale: 按汉语习惯自然表达希伯来语“称他的名为”的命名公式，并以“于是”体现感叹与命名之间的承接关系。
- source_word: גָּד
  choice: 迦得
  rationale: 采用现代中文圣经中通行的人名译法；脚注说明该名字与利亚的感叹在希伯来语中的声音联系。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“真幸运”保留口语感叹的力度；“于是给他起名叫”则以现代汉语清楚表达命名公式。由于中文无法直接再现希伯来语的谐音，相关文字游戏及传统异译置于脚注说明。
