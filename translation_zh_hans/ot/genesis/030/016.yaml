base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/016.yaml
  text: When Jacob came in from the field in the evening[a], Leah went out to meet him and said, “You must come in to me, for I have hired you with my son’s mandrakes.” So he lay with her that night.
translation:
  language: zh_hans
  text: 傍晚，雅各从田里回来。利亚出去迎接他，说：“你要到我这里来，因为我确实用我儿子的风茄雇了你。[a]”那一夜，雅各就与她同房。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为我以我儿子的风茄为代价雇了你。”希伯来文把利亚的主张与风茄相连，表明风茄是这项安排的代价或手段。
    reason: 词义与句法上的另一种译法
lexical_decisions:
- source_word: וַיָּבֹא יַעֲקֹב מִן הַשָּׂדֶה בָּעֶרֶב
  choice: 傍晚，雅各从田里回来
  rationale: 按汉语自然语序先交代时间；“回来”准确表达雅各从田间返回住处这一语境中的 בוא。
- source_word: וַתֵּצֵא לֵאָה לִקְרָאתוֹ
  choice: 利亚出去迎接他
  rationale: “出去迎接”自然对应 יצא 与 לקראת 的动作组合。
- source_word: אֵלַי תָּבוֹא
  choice: 你要到我这里来
  rationale: 保留希伯来语含蓄而坚定的召唤；结合上下文可指同房，但不在译文中把原文的委婉表达改得过于直白。
- source_word: שָׂכֹר שְׂכַרְתִּיךָ
  choice: 我实在……把你雇来了
  rationale: “实在”体现同词根不定式绝对形与限定动词连用所带的强调，同时以现代汉语可懂的方式保留“雇”的交易性措辞。
- source_word: בְּדוּדָאֵי בְּנִי
  choice: 用我儿子的风茄
  rationale: 介词 בְּ 在此可表示达成安排的手段或代价；“用”既自然，也不排除“以……为代价”的含义。דוּדָאִים 依传统且通行的植物名称译作“风茄”。
- source_word: וַיִּשְׁכַּב עִמָּהּ
  choice: 雅各就与她同寝
  rationale: “同寝”保留原文关于性关系的庄重委婉语气，不采用过于口语化或露骨的表达。
- source_word: בַּלַּיְלָה הוּא
  choice: 那一夜
  rationale: 自然表达该指示性时间短语，并保留“那一夜”的强调。
