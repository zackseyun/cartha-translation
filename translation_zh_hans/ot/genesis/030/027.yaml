  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֵלָי/ו֙ לָבָ֔ן אִם נָ֛א מָצָ֥אתִי חֵ֖ן בְּ/עֵינֶ֑י/ךָ נִחַ֕שְׁתִּי וַ/יְבָרֲכֵ֥/נִי יְהוָ֖ה בִּ/גְלָלֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/027.yaml
  text: Then Laban said to him[a], “If I have found favor in your eyes, please stay[b]. I have learned by divination that Yahweh has blessed me because of you.”
translation:
  language: zh_hans
  text: 拉班对他说：“我若在你眼中蒙恩，请你留下[a]。我通过占卜得知[b]，雅威因你的缘故赐福给我。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “请你留下”是按上下文补出的；希伯来原文在“我若在你眼中蒙恩”之后省略了请求的具体内容。
    reason: 原文省略
  - marker: b
    text: “通过占卜得知”也可译作“占卜看出”；有人理解为“凭经验得知”。这里的希伯来动词通常指占卜或观察征兆。
    reason: 词义选择
lexical_decisions:
- source_word: אִם נָא מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: 我若在你眼中蒙恩，请你留下
  rationale: “在某人眼中蒙恩”保留希伯来语习语的意象，也符合庄重自然的现代汉语。נָא 表示恳求语气，译为“请”。原文在条件句后省略了所求之事；根据上下文补出“你留下”，并以脚注说明。
- source_word: נִחַשְׁתִּי
  choice: 我通过占卜得知
  rationale: 该动词在此处较强的词义是借占卜或观察征兆来判断。“通过占卜得知”同时表达行为方式及拉班由此所得的结论，又不把该行为表述为上帝认可的启示。
- source_word: יְהוָה
  choice: 雅威
  rationale: 原文直接使用四字神名，故以现代汉语常见音译“雅威”保留其专名性质，不以称号替代。
- source_word: וַיְבָרֲכֵנִי
  choice: 赐福给我
  rationale: ברך 意为“赐福”。汉语语境已表明这福分已经临到拉班，无须机械标示完成体。
- source_word: בִּגְלָלֶךָ
  choice: 因你的缘故
  rationale: 准确表达原因或缘由，也保留原句强调福分与雅各有关的含义。
- source_word: לָבָן
  choice: 拉班
  rationale: 采用该人名在现代中文圣经传统中的通行译名。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；以“耶和华/上主”等称号式传统译法处理
  rationale: 此处希伯来文本使用神的专名，音译“雅威”可清楚区分专名与“主”等称号。
- issue: 拉班得知赐福之原因的方式
  choice: 通过占卜得知
  alternative: 凭经验得知
  rationale: נחשׁ 的强势词义涉及占卜或观兆。译文照实呈现拉班所声称的方法，但不据此判断其占卜真实有效，也不暗示雅威认可这种做法。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“在你眼中蒙恩”有意保留原文意象；“请你留下”使原文省略句在汉语中完整，并用脚注交代。
