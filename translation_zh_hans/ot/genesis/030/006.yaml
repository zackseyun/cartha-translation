  text: וַ/תֹּ֤אמֶר רָחֵל֙ דָּנַ֣/נִּי אֱלֹהִ֔ים וְ/גַם֙ שָׁמַ֣ע בְּ/קֹלִ֔/י וַ/יִּתֶּן לִ֖/י בֵּ֑ן עַל כֵּ֛ן קָרְאָ֥ה שְׁמ֖/וֹ דָּֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/006.yaml
  text: Then Rachel said[a], “God has judged me, and has also heard my voice and given me a son.” Therefore she called his name Dan.
translation:
  language: zh_hans
  text: 拉结说：“上帝已为我作出裁断，也听了我的声音，赐给我一个儿子。”因此，她给他起名叫但[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “但”这个名字与希伯来语中表示“裁断”或“审判”的动词发音相近。
    reason: 说明原文中人名“但”与 דָּנַנִּי 之间的文字关联；这一关联无法直接在中文中重现。
lexical_decisions:
- source_word: דָּנַנִּי
  choice: 为我作了裁断
  rationale: 该词源于 דין，带有司法裁断的意味，并以第一人称单数后缀指向拉结。结合赐子和命名的语境，“为我作了裁断”保留法律意象及对拉结有利的语境，同时避免用“为我申冤”把含义强化为原文未明说的完全平反。
- source_word: אֱלֹהִים
  choice: 上帝
  rationale: 虽在形态上为复数形式，但所搭配的动词为单数，叙事中指独一的上帝。
- source_word: שָׁמַע בְּקֹלִי
  choice: 听了我的声音
  rationale: 保留原文含“我的声音”的表达，既忠实又能自然传达拉结的个人呼求。
- source_word: וַיִּתֶּן לִי בֵּן
  choice: 赐给我一个儿子
  rationale: 准确表达“给我”以及明确的“儿子”；“赐给”符合上帝施予的叙事语境。
- source_word: עַל כֵּן
  choice: 因此
  rationale: 简洁表达该短语引出命名缘由的推论关系。
- source_word: קָרְאָה שְׁמוֹ דָּן
  choice: 她给他起名叫但
  rationale: 用自然的现代汉语表达希伯来语“称他的名为”，同时保留名字“但”，并由脚注说明双关。
- source_word: דָּן
  choice: 但
  rationale: 采用该人名通行的中文译名，并通过脚注交代它与 דין（裁断、审判）的语源联系。
theological_decisions:
- issue: 拉结如何描述上帝的司法性行动
  choice: 上帝为我作了裁断
  alternative: 上帝审判了我；上帝为我申了冤
  rationale: 原文的司法用语与“但”的命名双关密切相关。“为我作了裁断”保留司法意象和语境中的有利结果，却不把它明确化为定罪，也不强化成原文未完全明说的申冤或称义。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“作了裁断”略带司法语体，以保留命名叙事的关键词联系；其余句式简洁自然。脚注标记置于名字“但”之后，使双关所指清楚。
