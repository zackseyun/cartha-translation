base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/041.yaml
  text: And whenever the stronger of the flock were breeding[a], Jacob would place the rods before the eyes of the flock in the watering troughs[b], so that they might breed among the rods.
translation:
  language: zh_hans
  text: 每逢羊群中强壮的牲畜发情时[a]，雅各就把枝条摆在饮水槽中、羊群眼前，好让它们在枝条旁交配。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “强壮的”或译“壮健的”“健壮的”；原文所指的牲畜与下一节的“瘦弱”者相对。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה בְּכָל יַחֵם
  choice: 每逢……发情时
  rationale: 这一结构描述反复发生的惯常情形；יחם在牲畜繁殖语境中指发情、交配，译作“发情”准确而自然。
- source_word: הַצֹּאן
  choice: 羊群
  rationale: צאן统指成群的小型牲畜，可能包括绵羊和山羊；现代汉语“羊群”既自然，也不限定具体羊种。
- source_word: הַמְקֻשָּׁרוֹת
  choice: 壮健的
  rationale: 该词在本节与下一节的“瘦弱”相对，语境指体格较强健的牲畜；“壮健”保留这种对比。
- source_word: וְשָׂם
  choice: 雅各就把……放在
  rationale: שׂים意为放置、安放；“就”配合“每逢”，清楚表达反复进行的动作。
- source_word: הַמַּקְלוֹת
  choice: 枝条
  rationale: מַקֵּל可指杖、棍或枝条；本段上文说明这些是雅各剥皮后使用的树枝，因此“枝条”最合语境。
- source_word: לְעֵינֵי הַצֹּאן
  choice: 摆在羊群眼前
  rationale: 保留原文“在……眼前”的视觉重点，同时以自然汉语表达。
- source_word: בָּרֳהָטִים
  choice: 在水槽里
  rationale: רֳהָטִים指牲畜饮水处的槽或水道；“水槽”简明地交代牧养场景。
- source_word: לְיַחְמֶנָּה
  choice: 使它们……交配
  rationale: לְ表示雅各安放枝条的目的；译文表达意图，不据此断定枝条确实造成了交配或繁殖结果。
- source_word: בַּמַּקְלוֹת
  choice: 对着枝条
  rationale: 介词בְּ在此可表达处境或伴随关系；结合枝条被摆在羊群眼前的描述，“对着枝条”比“在枝条中”更符合实际场景，并保留关系上的一定开放性。
theological_decisions: []
