revisions:
- from: 每逢羊群中壮健的发情时[a]，雅各就把枝条放在水槽里[b]，摆在羊群眼前，使它们对着枝条交配。
  to: 每逢羊群中强壮的牲畜发情时[a]，雅各就把枝条摆在饮水槽中、羊群眼前，好让它们在枝条旁交配。
  rationale: 修正了“壮健的”缺少所修饰名词的结构问题，并将目的从较强的“使”调整为“好让”。译文仍保留原文的反复性、羊群的集合概念、枝条在饮水处并置于羊群眼前的画面，以及最后介词短语的处境性。补回 b 脚注锚点，以对应“饮水槽”这一原文词语及既有脚注集。
