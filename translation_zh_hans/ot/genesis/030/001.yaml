base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/001.yaml
  text: When Rachel saw that she had borne no children to Jacob[a], she became jealous of her sister, and she said to Jacob, “Give me children[b], or I will die!”
translation:
  language: zh_hans
  text: 拉结见自己没有给雅各生儿女[a]，就嫉妒自己的姊妹，对雅各说：“给我儿女，否则我就会死[b]！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “儿女”原文直译为“儿子们”，在这里可泛指所生的孩子。
    reason: lexical_alternative
  - marker: b
    text: 或译：“我快要死了！”
    reason: source_ambiguity
lexical_decisions:
- source_word: וַתֵּרֶא רָחֵל כִּי לֹא יָלְדָה לְיַעֲקֹב
  choice: 拉结见自己没有给雅各生儿女
  rationale: 以“见……就……”自然表达叙事中的因果与时间联系；“给雅各生儿女”在现代汉语中清楚表达 לְיַעֲקֹב 的关系。
- source_word: וַתְּקַנֵּא רָחֵל בַּאֲחֹתָהּ
  choice: 就嫉妒姐姐
  rationale: קנא 在此指拉结因姐姐能生育而产生的嫉妒；中文省去第二次出现的“拉结”，行文更自然，指代仍然明确。
- source_word: הָבָה לִּי בָנִים
  choice: 给我儿女
  rationale: בָנִים 字面为“儿子们”，但在生育语境中可泛指后代；“儿女”既自然，也避免把拉结的要求不必要地限定为男孩。
- source_word: וְאִם אַיִן
  choice: 不然
  rationale: 简洁表达“如果没有／若不如此”所引出的强烈后果，符合拉结急切的语气。
- source_word: מֵתָה אָנֹכִי
  choice: 我就死了
  rationale: 保留原文直接而强烈的说法，不把它解释成单纯的心理感受；中文以“就”承接前面的条件。
theological_decisions:
- issue: 拉结关于死亡的话是将来结果、临近状态，还是夸张表达
  choice: 正文译作“我就死了”
  alternative: “我快要死了”或“我活不下去了”
  rationale: 原文 מֵתָה אָנֹכִי 形式上可呈现“我在死亡／我要死”的强烈状态。正文保留直白措辞，不判定这是字面预告还是情绪化夸张，并以脚注提示另一种时态理解。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“嫉妒姐姐”比“嫉妒她的姐姐”更符合自然汉语；“不然我就死了”保留拉结话语的急迫和强烈。
