  to: 拉结见自己没有给雅各生儿女[a]，就嫉妒自己的姊妹，对雅各说：“给我儿女，否则我就会死[b]！”
  rationale: 修订仅避免将“姊妹”具体化为“姐姐”，并使末句的条件性后果在现代汉语中更清楚自然。脚注a保留对בנים的词汇说明；脚注b保留原文末句可表达临近、强烈状态的译法可能性。
