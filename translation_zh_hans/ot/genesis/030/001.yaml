review_pass:
  verdict: revise
  source_fidelity: “姐姐”明确了年长关系；虽然创世记29:16已交代利亚是姐姐，但本节希伯来文仅用“她的姊妹”这一关系称谓。宜避免在本节正文中额外明示年龄关系。其余内容忠实反映拉结未为雅各生育、嫉妒姊妹及其强烈要求。
  naturalness: 原译整体庄重清楚。“不然我就死了”在条件句中可理解为将来结果，但“否则我就会死”在现代标准汉语中更自然，也更明确表达原文的后果性陈述。
  terminology: “儿女”可在此生育语境中表达后代，且脚注恰当地说明בנים字面为“儿子们”。以“自己的姊妹”对应אחותה，既保留关系称谓，也不在正文中指定“姐姐”。
  issues:
  - severity: low
    issue: “姐姐”将אחותה所未明说的年龄关系写入正文。
    rationale: 希伯来文在本节只称“她的姊妹”；尽管上下文可知利亚为姐姐，译文宜保留本节的关系称谓而不额外具体化。
  - severity: low
    issue: “我就死了”可作条件句中的将来结果，但现代汉语略易被读作已然完成。
    rationale: “否则我就会死”自然表达原文“若不然，我将死”的强烈后果，且不判定其为字面死亡或夸张。
  revised_text: 拉结见自己没有给雅各生儿女[a]，就嫉妒自己的姊妹，对雅各说：“给我儿女，否则我就会死[b]！”
