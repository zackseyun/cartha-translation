  text: וַ/תֵּ֣רֶא לֵאָ֔ה כִּ֥י עָמְדָ֖ה מִ/לֶּ֑דֶת וַ/תִּקַּח֙ אֶת זִלְפָּ֣ה שִׁפְחָתָ֔/הּ וַ/תִּתֵּ֥ן אֹתָ֛/הּ לְ/יַעֲקֹ֖ב לְ/אִשָּֽׁה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/009.yaml
  text: When Leah saw that she had stopped bearing children[b][a], she took Zilpah her female servant and gave her to Jacob as a wife.
translation:
  language: zh_hans
  text: 利亚见自己不再生育[a]，就把她的婢女[b]悉帕给了雅各为妻。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“停止生育了”；希伯来文直译为“从生育中停下”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“女仆”；原词也可指“女奴”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּרֶא
  choice: 利亚见……就……
  rationale: 未完成式连续体推进叙事；用“见……就……”自然表达她察觉情形后采取行动的时间与逻辑衔接。
- source_word: כִּי
  choice: （见）自己……了
  rationale: 此处引出利亚所察觉的内容，而非原因从句；汉语无需另译“that”。
- source_word: עָמְדָה מִלֶּדֶת
  choice: 停止生育了
  rationale: עמד与מן加不定式构成“停止做某事”的表达；“生育”准确传达ילד在此处的生孩子语境，同时保留已经停止的状态。
- source_word: שִׁפְחָתָהּ
  choice: 她的婢女
  rationale: שִׁפְחָה指隶属于女主人的女性仆役，也可能带有奴隶身份；“婢女”简洁保留其性别与从属地位，脚注提供现代替代说法。
- source_word: זִלְפָּה
  choice: 悉帕
  rationale: 采用现代中文圣经人名的通行音译。
- source_word: לְיַעֲקֹב
  choice: 给雅各
  rationale: 按נתן的给予结构自然译出间接宾语。
- source_word: לְאִשָּׁה
  choice: 为妻
  rationale: 这是给予某女子作妻子的婚姻表达；“为妻”简洁、庄重，并保留原文明确的妻子身份措辞。
theological_decisions:
- issue: 悉帕在家中的从属身份与婚姻身份
  choice: 同时译作“她的婢女”和“给雅各为妻”
  alternative: 将שִׁפְחָה译为“女仆”或“女奴”，或将לְאִשָּׁה解释性地译为“作妾”
  rationale: 原文既明确称悉帕为利亚的שִׁפְחָה，又明确说她被给雅各לְאִשָּׁה。译文应并存这两方面，不淡化从属地位，也不以本节没有使用的后设身份“妾”取代“妻”的婚姻措辞。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“停止生育了”较直译自然；“婢女”保留古代家内从属关系，但以脚注补充“女仆／女奴”的语义范围。所有脚注标记均置于相应正文词语之后。
