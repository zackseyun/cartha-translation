  yaml_path: translation/ot/genesis/030/013.yaml
  text: Then Leah said[b][a], “Happy am I! For women will call me happy.” So she called his name Asher.
translation:
  language: zh_hans
  text: 利亚说：“我真有福[a]！女子[b]都要称我有福。”于是她给他起名叫亚设。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “亚设”这个名字的读音与本句中译为“有福”和“称……有福”的希伯来语词语相近。
    reason: lexical_alternative
  - marker: b
    text: “女子”原文直译为“女儿们”，这里可泛指女子或妇女。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאָשְׁרִי
  choice: 我真有福
  rationale: אָשֶׁר表示幸福、福分或好运；这里是利亚带有感叹意味的话。“我真有福”自然保留第一人称含义，并与下文“称我有福”和名字“亚设”形成呼应。
- source_word: אִשְּׁרוּנִי
  choice: 都要称我有福
  rationale: 该词为אשר的Piel形式，意为宣称或称某人有福、幸福。“称我有福”既符合现代汉语，也保留与前句及名字的词根联系。
- source_word: בָּנוֹת
  choice: 女子们
  rationale: 字面为“女儿们”，但复数在这里可泛指女子或妇女；译作“女子们”较自然，同时用脚注保留字面信息。
- source_word: וַתִּקְרָא אֶת־שְׁמוֹ אָשֵׁר
  choice: 于是她给他起名叫亚设
  rationale: 这是希伯来语常见的命名句式。现代汉语用“给他起名叫”清楚自然，并保留叙事衔接。
- source_word: אָשֵׁר
  choice: 亚设
  rationale: 采用中文圣经传统通行的人名音译；名字所含“有福、幸福”的意味由正文中的双关及脚注说明。
