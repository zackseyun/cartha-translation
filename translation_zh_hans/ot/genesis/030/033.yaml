source:
  edition: WLC
  text: וְ/עָֽנְתָה בִּ֤/י צִדְקָתִ/י֙ בְּ/י֣וֹם מָחָ֔ר כִּֽי תָב֥וֹא עַל שְׂכָרִ֖/י לְ/פָנֶ֑י/ךָ כֹּ֣ל אֲשֶׁר אֵינֶ/נּוּ֩ נָקֹ֨ד וְ/טָל֜וּא בָּֽ/עִזִּ֗ים וְ/חוּם֙ בַּ/כְּשָׂבִ֔ים גָּנ֥וּב ה֖וּא אִתִּֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/033.yaml
  text: 'So my honesty will answer for me later[a], when you come to inspect my wages: every goat that is not speckled and spotted, and every lamb that is not dark-colored[e][d][c][b], will be considered stolen if it is found with me.'
translation:
  language: zh_hans
  text: 我的正直[a]日后[b]会为我作证：当你来查验我的工价[c]时，凡在我这里的山羊，若没有斑点和杂色斑纹；或绵羊若不是深色的[d]，都算是偷来的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“我的公义”或“我的诚信”。这里指雅各在工价安排上可由事实验证的正直。
    reason: lexical_alternative
  - marker: b
    text: 直译“在明日之日”；可指“明天”，也可泛指后来拉班查验羊群的时候。
    reason: lexical_alternative
  - marker: c
    text: 原文此处的结构也可较直译为“当你来察看我的工价、在你面前的时候”。“在你面前”的具体句法归属可有不同理解；语境表明拉班要来查看雅各所得的工价。
    reason: translation_clarity
  - marker: d
    text: 或译“棕色的”。原词指深色的羊，确切色调不能确定。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָנְתָה בִּי
  choice: 会为我作证
  rationale: ענה在这里表示作出回应或见证；与בִּי连用，语境指雅各的品行为他作证。“为我作证”符合现代汉语，也保留了拟人化表达。
- source_word: צִדְקָתִי
  choice: 我的正直
  rationale: 该词基本义涉及公正、正义；在工价安排的语境中，指雅各可受检验的正直诚信。“正直”既保留道德分量，又不把它限定为某种教义术语。
- source_word: בְּיוֹם מָחָר
  choice: 日后
  rationale: 字面为“在明日之日”，既可指明天，也可泛指将来接受查验的时候；“日后”保留这种时间范围。
- source_word: כִּי תָבוֹא עַל שְׂכָרִי לְפָנֶיךָ
  choice: 当你来查验我的工价时
  rationale: 此处描述拉班以后查看雅各所得牲畜的情形。“查验”表达 תבוא על 在本语境中的实际作用；中文主语“你”已表明查验是在拉班面前进行，故不生硬重复“在你面前”。
- source_word: נָקֹד
  choice: 有斑点的
  rationale: 指带有细小斑点的牲畜，用“有斑点的”可与下一种花纹区分。
- source_word: טָלוּא
  choice: 有花纹的
  rationale: 指身上带斑块或杂色花纹的牲畜；“有花纹的”在中文中自然，并与“有斑点的”形成区别。
- source_word: חוּם
  choice: 深色的
  rationale: 该词指深色或棕色的羊，具体色调并不完全确定；“深色的”避免过度精确。
- source_word: בָּעִזִּים
  choice: 山羊
  rationale: 按牲畜类别译为“山羊”，与后面的绵羊相对。
- source_word: בַּכְּשָׂבִים
  choice: 绵羊
  rationale: כשבים可指羊或小羊；这里是在划分畜群类别，因此“绵羊”比限定年龄的“羊羔”更稳妥。
- source_word: גָּנוּב הוּא אִתִּי
  choice: 凡在我这里的……就算是偷来的
  rationale: 希伯来文简洁地规定，不符合约定颜色而在雅各手中的牲畜，即按偷来的处理。“算是”准确传达这种判定含义。
theological_decisions:
- issue: צִדְקָתִי是否译成教义色彩较强的“公义”
  choice: 正直
  alternative: 公义／诚信
  rationale: 这里首先涉及工资协议中可由事实验证的操守。译作“正直”保留道德和司法意味，同时不把经文提前限定为系统神学术语；脚注列出其他可能译法。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“为我作证”“查验我的工价”“就算是偷来的”便于普通读者理解，同时保留原文的见证、查验和判定意象。用分号区分山羊与绵羊两类条件，避免把颜色条件误读为同时适用于两类牲畜。
