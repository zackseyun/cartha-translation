  yaml_path: translation/ot/genesis/030/039.yaml
  text: So the flock mated by the rods[a], and the flock bore striped, speckled[b], and spotted young.
translation:
  language: zh_hans
  text: 于是，羊群在枝条前发情并交配，生下有条纹[a]、有斑点[b]和有斑块的幼崽。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “有条纹”也可译作“有环纹”或“有条带纹”。
    reason: lexical_alternative
  - marker: b
    text: 原文中“有斑点”和“有斑块”所指花纹的区别并不十分确定；后者也可译作“花斑的”或“驳杂的”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּחֱמוּ
  choice: 发情交配
  rationale: יחם本义与“发热”有关，在牲畜繁殖语境中指发情并交配；“发情交配”既保留原词意象，又自然明确。
- source_word: הַצֹּאן
  choice: 羊群
  rationale: צאן是集合名词，泛指绵羊、山羊等小型牲畜；本段语境中译作“羊群”简洁自然。第二分句依照现代汉语习惯省略重复主语，所指仍明确。
- source_word: אֶל הַמַּקְלוֹת
  choice: 在枝条前
  rationale: אֶל通常表示“向、朝”，结合前文把枝条摆在羊群面前的情景，“在枝条前”自然表达其空间关系，又不把枝条解释成繁殖的原因。
- source_word: וַתֵּלַדְןָ
  choice: 生下了……幼畜
  rationale: ילד意为生产、生育；原文随后直接用形容词描述所生者，汉语补出“幼畜”可使句意完整，并避免误指成年羊。
- source_word: עֲקֻדִּים
  choice: 有条纹
  rationale: 该词表示带状或条纹状花纹；“有条纹”是清楚、现代的表达，并在脚注保留“有环纹”的可能译法。
- source_word: נְקֻדִּים
  choice: 有斑点
  rationale: 该词指点状的小斑纹；“有斑点”可与下一个表示较大斑块的词作近似区分。
- source_word: וּטְלֻאִים
  choice: 有斑块
  rationale: 该词所指花色可能是块状、杂色或驳杂的；“有斑块”能与נְקֻדִּים的细小斑点形成较自然的区别，同时不把近似的词义界线说得过于确定。
