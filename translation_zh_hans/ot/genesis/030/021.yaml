lexical_decisions:
- source_word: וְאַחַר
  choice: 后来
  rationale: 表示在前述几次生育之后的时间顺序；“后来”简洁自然，并保留叙事推进。
- source_word: יָלְדָה
  choice: 她生了
  rationale: ילד 的 Qal 完成式第三人称阴性单数；在生育语境中译为“生了”符合现代汉语习惯。
- source_word: בַּת
  choice: 一个女儿
  rationale: 作“生了”的宾语；加入量词“一个”使现代汉语表达自然。
- source_word: וַתִּקְרָא אֶת־שְׁמָהּ
  choice: 给她取名叫
  rationale: 希伯来语直译为“叫她的名字”；现代汉语用“给她取名叫”自然地表达同一命名行为，同时保留女儿为受事者。
- source_word: דִּינָה
  choice: 底拿
  rationale: 按中文圣经传统所采用的标准音译处理人名 Dinah。
