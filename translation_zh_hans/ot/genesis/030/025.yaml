  yaml_path: translation/ot/genesis/030/025.yaml
  text: And it happened, when Rachel had borne Joseph, that Jacob said to Laban, “Send me away, that I may go to my own place and to my own land.”
translation:
  language: zh_hans
  text: 拉结生了约瑟以后，雅各对拉班说：“请让我走吧，好回到我自己的地方、自己的土地去。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שַׁלְּחֵנִי
  choice: 请让我走吧
  rationale: 该词字面为“打发我／放我走”，在主仆关系和直接请求的语境中译作“请让我走吧”自然、清楚，并保留雅各请求拉班准许离开的意味。
- source_word: מְקוֹמִי
  choice: 自己的家乡
  rationale: מָקוֹם通常意为“地方”；这里与“我的地”并列，指雅各所属、归返之处。译作“自己的家乡”传达归乡语境，同时不把它窄化为具体住所。
- source_word: אַרְצִי
  choice: 故土
  rationale: אֶרֶץ可指土地、地区或国家；第一人称所有格在此指雅各原来的土地。中文“故土”与“家乡”搭配自然，并保留归属感。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“以后”自然承接事件次序；直接引语保留请求语气。原文“我的地方和我的地”的近义并列以“自己的家乡和故土”呈现，避免生硬直译。
