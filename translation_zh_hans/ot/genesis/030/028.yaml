  text: Then he said[a], “Name your wages, and I will give it.”
translation:
  language: zh_hans
  text: 他就说[a]：“请定下我该给你的工钱，我就给你。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“请向我说明你的报酬，我必给你。”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמַר
  choice: 他又说
  rationale: 承接拉班上一句发言；“又说”自然表达叙事推进和同一说话者继续开口，不把连接词机械译成“然后”。
- source_word: נָקְבָה
  choice: 请定下
  rationale: נקב在这里指明确指定、说定；用于工钱语境，“定下”比直译“说出名称”更自然，也保留由雅各明确提出条件的意思。
- source_word: שְׂכָרְךָ
  choice: 我该给你的工钱
  rationale: שָׂכָר在雇佣语境中指劳动报酬。“工钱”符合现代汉语；结合עָלַי表达这笔报酬由说话者承担。
- source_word: עָלַי
  choice: 我该给你的
  rationale: 字面为“在我身上／由我承担”。这里并非单纯表示“对我说”，而是表明工钱由拉班承担；融入名词短语可避免生硬，又不遗漏原文。
- source_word: וְאֶתֵּנָה
  choice: 我就给你
  rationale: נתן意为“给”；语境已明确所给的是工钱，汉语可自然省略重复宾语。“就”体现提出条件后承诺照付的关系。
