base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/008.yaml
  text: Then Rachel said[a], “With wrestlings of God I have wrestled with my sister, and I have also prevailed.” So she called his name Naphtali.
translation:
  language: zh_hans
  text: 拉结说：“我与姐姐大大较力[a]，也得胜了。”于是她给他起名叫拿弗他利。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语直译近似“我与姐姐进行了上帝的较力”。这短语也可理解为“神圣的较力”，或作为加强语气，意为“极其激烈的较力”。“较力”与“拿弗他利”在希伯来语中彼此呼应。
    reason: 保留罕见短语的字面形式及其可能的强化义，并避免将原文不确定的结构译成工具性的“以上帝的较力”。
lexical_decisions:
- source_word: נַפְתּוּלֵי אֱלֹהִים
  choice: 大大较力
  rationale: 原文是罕见而含义不完全确定的组合，直译近似“上帝的较力”。其中“上帝”可能直接指上帝，也可能用作加强语气，表示极其激烈或强有力。正文采用自然的汉语加强表达，脚注保留原文形式及其歧义。
- source_word: נִפְתַּלְתִּי
  choice: 较力
  rationale: 采用具体的角力意象，并尽量保留该动词与“拿弗他利”之间的希伯来语词根呼应；“争斗”虽自然，却会削弱命名双关。
- source_word: עִם אֲחֹתִי
  choice: 与姐姐
  rationale: עִם通常意为“与”；在竞争语境中也可含“同……对抗”的意味。“较力”已清楚传达对抗性。根据叙事关系，拉结所指的是姐姐利亚。
- source_word: גַּם יָכֹלְתִּי
  choice: 也得胜了
  rationale: יכל在此表示在竞争中胜过或占了上风；“得胜”比字面的“能够”更符合上下文。
- source_word: וַתִּקְרָא שְׁמוֹ נַפְתָּלִי
  choice: 于是她给他起名叫拿弗他利
  rationale: 用现代汉语自然表达希伯来语常见的命名句式，并维持话语解释与名字之间的紧密联系。
- source_word: נַפְתָּלִי
  choice: 拿弗他利
  rationale: 采用现代中文圣经中通行的人名音译；其希伯来语形式与本节“较力”的词语同源。
theological_decisions:
- issue: אֱלֹהִים在短语נַפְתּוּלֵי אֱלֹהִים中是否直接指上帝
  choice: 正文不明定为上帝亲自参与，而以“大大”表达可能的加强语气，并在脚注保留歧义
  alternative: 译作“我以上帝的较力与姐姐较力”或“我在上帝面前与姐姐较力”
  rationale: 原文结构可以理解为直接涉及上帝，也可能是用神名构成最高级或强意表达。单一定译会过早消除原文的神学张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“大大较力”略带叙事性的传统色彩，既便于普通读者理解，也尽可能保留原文重复词根所形成的命名效果。
