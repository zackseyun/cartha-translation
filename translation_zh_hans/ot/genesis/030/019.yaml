lexical_decisions:
- source_word: וַתַּהַר
  choice: 怀孕
  rationale: 希伯来语动词 הרה 在此叙事形式中表示怀孕；现代汉语用“怀孕”自然、准确。
- source_word: עוֹד
  choice: 又
  rationale: 此处表示动作再次发生；“又”简洁地承接连续的生育叙事。
- source_word: וַתֵּלֶד
  choice: 生了
  rationale: ילד 在此表示生育；“生了”符合现代汉语叙事习惯，也保留原文直白的表达。
- source_word: בֵּן
  choice: 儿子
  rationale: 该名词在此明确指儿子。
- source_word: שִׁשִּׁי
  choice: 第六个
  rationale: 序数词修饰“儿子”，表明这是利亚给雅各所生的第六个儿子。
- source_word: לְיַעֲקֹב
  choice: 给雅各
  rationale: 介词 לְ 在“为/给某人生儿子”的惯用结构中表示关系对象；“给雅各生了”是自然且贴近原文的汉语表达。
