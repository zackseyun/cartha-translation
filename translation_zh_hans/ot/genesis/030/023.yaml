  text: וַ/תַּ֖הַר וַ/תֵּ֣לֶד בֵּ֑ן וַ/תֹּ֕אמֶר אָסַ֥ף אֱלֹהִ֖ים אֶת חֶרְפָּתִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/023.yaml
  text: She conceived and bore a son[a], and said, “God has taken away my reproach.”
translation:
  language: zh_hans
  text: 她怀孕生了一个儿子，说：“神除去了我的耻辱。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתַּהַר
  choice: 她怀孕
  rationale: הרה表示怀孕、受孕；“她怀孕”符合现代汉语叙事习惯，也保留事件进展。
- source_word: וַתֵּלֶד בֵּן
  choice: 生了一个儿子
  rationale: ילד与בֵּן连用，明确指生下一个儿子；此译自然、准确。
- source_word: וַתֹּאמֶר
  choice: 说
  rationale: 这是连续叙事中的“她说”；汉语承接同一主语时省略重复代词更自然。
- source_word: אָסַף
  choice: 除去了
  rationale: אָסַף在此语境中表示移除、除掉；“除去了”保留动作已成及其现今结果。
- source_word: אֱלֹהִים
  choice: 神
  rationale: 该词虽为复数形态，但在本句与单数动词搭配，指独一的神。
- source_word: חֶרְפָּתִי
  choice: 我的耻辱
  rationale: חֶרְפָּה涵盖受人羞辱、蒙羞和社会性耻辱；“我的耻辱”在现代汉语中简洁庄重，并切合不育所带来的社会羞耻。
theological_decisions:
- issue: אֱלֹהִים的单数所指
  choice: 神
  alternative: 众神
  rationale: 单数动词אָסַף及上下文都要求单数所指，无需作超出语法的神学扩展。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“怀孕生了一个儿子”简洁保留希伯来文连续动作；“耻辱”兼顾个人蒙羞与社会责难的含义。英文所附[a]实际解释的是“reproach”，而其标记似误置在“son”之后；中文正文直接采用清楚且涵盖面合适的“耻辱”，故不沿用该误置脚注。
