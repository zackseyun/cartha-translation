base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/026.yaml
  text: Give me my wives and my children[a], for whom I have served you, so that I may go[b]; for you know the service with which I have served you.
translation:
  language: zh_hans
  text: “把我的妻子和儿女交给我吧；我为了她们[a]而服侍了你。让我走吧，因为我怎样服侍你[b]，你是知道的。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “她们”原文为阴性复数，最自然地指前面的“妻子”，即“我为了得到她们而服侍了你”；也可较宽泛地理解为涉及刚提到的一家人：“我为了他们服侍了你。”
    reason: 语法指代与译法选择
  - marker: b
    text: 原文直译为“我服侍你所作的服侍／劳作”。“服侍”也可译作“劳作”或“工作”；原文的名词与动词出自同一词根。
    reason: 词义选择与原文修辞
lexical_decisions:
- source_word: תְּנָה
  choice: 交给我吧
  rationale: 这是נתן的命令式；“交给我”自然表达雅各要求拉班把他的家人交还给他，“吧”使请求语气符合现代汉语。
- source_word: נָשַׁי וְאֶת יְלָדַי
  choice: 我的妻子和儿女
  rationale: נָשַׁי在此明确指雅各的妻子；יְלָדַי是一般家庭称谓，“儿女”在现代汉语中自然涵盖他的孩子。
- source_word: אֲשֶׁר עָבַדְתִּי אֹתְךָ בָּהֵן
  choice: 我为她们服侍了你
  rationale: בָּהֵן是阴性复数，最直接回指妻子，说明雅各为得到她们而服侍拉班；脚注保留关系从句也可能较宽泛地涉及刚提到的一家人的理解。
- source_word: וְאֵלֵכָה
  choice: 让我走吧
  rationale: הלך的鼓励式表达雅各离去的意愿和请求；“让我走吧”简洁保留这一意愿语气。
- source_word: כִּי אַתָּה יָדַעְתָּ
  choice: 因为……你是知道的
  rationale: כִּי引出请求的理由；带强调意味的“你是知道的”传达独立代词אַתָּה与完成式的当前关联。
- source_word: אֶת עֲבֹדָתִי אֲשֶׁר עֲבַדְתִּיךָ
  choice: 我为你做过怎样的工
  rationale: 将同根的名词与动词转化为自然汉语，表达拉班亲知雅各所付出的劳作；脚注说明原文的同根重复及可译范围。
