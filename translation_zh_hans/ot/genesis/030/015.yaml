base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/015.yaml
  text: But she said to her, “Was it a small thing that you took my husband, and would you also take my son’s mandrakes?” Rachel said, “Then he may lie with you tonight in exchange for your son’s mandrakes.”
translation:
  language: zh_hans
  text: 她对拉结说：“你拿走了我丈夫，这还算小事吗？现在连我儿子的曼德拉草也要拿走吗？”拉结说：“那么，今夜他可以与你同寝，以你儿子的曼德拉草为交换。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַמְעַט
  choice: 还算小事吗
  rationale: 保留希伯来语反问的责难语气，并采用自然的现代汉语表达。
- source_word: קַחְתֵּךְ אֶת אִישִׁי
  choice: 你夺了我的丈夫
  rationale: לקח基本义为“拿、取”；在利亚的指控中译作“夺”更能表达被抢走的语用色彩，同时不额外解释婚姻关系。
- source_word: דּוּדָאֵי
  choice: 曼德拉草
  rationale: 指mandrake（Mandragora），采用较常见的音意兼顾名称，避免用“风茄”等可能不为普通读者熟悉的名称。
- source_word: יִשְׁכַּב עִמָּךְ
  choice: 他可以与你同寝
  rationale: 保留“与……躺卧”在本语境中的委婉性关系含义，措辞庄重而清楚。
- source_word: תַּחַת
  choice: 作为交换……的条件
  rationale: 此处表示交换或代价关系；这样译能自然呈现拉结提出的交易。
theological_decisions:
- issue: 姐妹之间对雅各与曼德拉草的交易
  choice: 按叙事直接呈现双方指控与交换，不加道德评判
  alternative: 增添对人物行为或婚姻伦理的解释
  rationale: 原文仅记录对话；译文不应代替叙事者作神学或伦理裁断。
- issue: 曼德拉草的功能
  choice: 只译植物名称，不暗示其必然具有助孕功效
  alternative: 译作或注释为“催孕草”
  rationale: 本节原文没有说明其功效；避免把古代观念或后世解释写入正文。
translation_notes:
  register: 采用现代、庄重且口语可懂的叙事对话。“她”依紧接上文指利亚，但本节希伯来原文只用代词，正文保留这一衔接。两个“夺”对应利亚连续的反问，维持原文的尖锐语气；拉结的回答则保持简洁、交易式的语调。
