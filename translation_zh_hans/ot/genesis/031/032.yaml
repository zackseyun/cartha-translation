source:
  edition: WLC
  text: עִ֠ם אֲשֶׁ֨ר תִּמְצָ֣א אֶת אֱלֹהֶי/ךָ֮ לֹ֣א יִֽחְיֶה֒ נֶ֣גֶד אַחֵ֧י/נוּ הַֽכֶּר לְ/ךָ֛ מָ֥ה עִמָּדִ֖/י וְ/קַֽח לָ֑/ךְ וְ/לֹֽא יָדַ֣ע יַעֲקֹ֔ב כִּ֥י רָחֵ֖ל גְּנָבָֽתַ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/032.yaml
  text: Whoever is found with your gods shall not live[a]. In the presence of our brothers, identify what of yours is with me[c][b], and take it for yourself.” Jacob did not know that Rachel had stolen them.
translation:
  language: zh_hans
  text: “你在谁那里找到你的神明，谁就不得活[a]。当着我们弟兄[b]的面，你自己辨认我这里有什么是你的，拿去吧。”雅各并不知道拉结偷了那些神明[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“你在谁那里找到你的神明，那人就不得活。”这句话可理解为严厉的死亡宣告或咒诅。
    reason: lexical_alternative
  - marker: b
    text: “弟兄”在这里可泛指在场的男性亲属或族人，不一定只指同父母的兄弟。
    reason: cultural_note
  - marker: c
    text: 这里所说的是拉班的家神；拉结先前把它们偷走了。
    reason: cross_reference
lexical_decisions:
- source_word: עִם אֲשֶׁר תִּמְצָא
  choice: 你在谁那里找到
  rationale: 按希伯来文保留拉班为“找到”的主语，同时用现代汉语自然的不定关系句表达“无论在谁那里”。
- source_word: אֱלֹהֶיךָ
  choice: 你的神明
  rationale: 原文直称“你的神”，语境表明所指是可被偷走、搜寻的家神；“神明”既保留原词措辞，也避免直接把解释写成“偶像”。
- source_word: לֹא יִחְיֶה
  choice: 谁就不得活
  rationale: 保留原文死亡宣告或咒诅式措辞的强烈语气，不武断判定它究竟是法律判决、意愿还是预言。
- source_word: נֶגֶד אַחֵינוּ
  choice: 当着我们众弟兄的面
  rationale: “当着……的面”自然表达 נֶגֶד 的公开见证含义；“弟兄”保留亲属称谓，其范围可能包括在场的男性亲族。
- source_word: הַכֶּר לְךָ
  choice: 认一认
  rationale: 此处命令拉班察看并辨认自己的物品；“认一认”符合当面对质的自然汉语语气。
- source_word: מָה עִמָּדִי
  choice: 我这里有什么是你的
  rationale: 原文略含“什么在我这里”，所属关系由上下文和随后“拿回去”显明；译文适度补出而不改变意思。
- source_word: וְקַח לָךְ
  choice: 拿回去吧
  rationale: 表达拿取归己的含义；“回去”在汉语中自然体现物归原主，句末“吧”符合命令兼挑战的语气。
- source_word: וְלֹא יָדַע יַעֲקֹב
  choice: 雅各并不知道
  rationale: 保留叙述者插入说明及 וְלֹא 所带的转折性。
- source_word: גְּנָבָתַם
  choice: 偷了那些神明
  rationale: 复数后缀回指前述神明；汉语重复名词比用“它们”更清楚，也保留该行为已发生的叙事背景。
theological_decisions:
- issue: “神明”是实际神祇还是家神物件
  choice: 正文沿用原文的“神明”，注释说明语境所指
  alternative: 正文译作“家神”或“神像”
  rationale: 避免在正文中把叙事人物的称呼直接改写为带有评价色彩或更具体的解释，同时让读者从注释获知这些是拉班的家神。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。对话保持雅各公开对质时的果断语气；“神明”保留原文措辞，“家神”的具体语境信息放入脚注。
