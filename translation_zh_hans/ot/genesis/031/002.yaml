  yaml_path: translation/ot/genesis/031/002.yaml
  text: And Jacob saw Laban’s face[a], and behold[b], it was not toward him as before.
translation:
  language: zh_hans
  text: 雅各看见拉班的脸色，见他待自己不像从前。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “从前”直译为“昨天和前天”，是表示“先前、以往”的惯用说法。整句话表明拉班对雅各的态度已经改变。
    reason: idiom_explanation
lexical_decisions:
- source_word: וַיַּרְא
  choice: 看
  rationale: 这是ראה的叙事性常用形式，表示雅各观察到眼前的情形；“看”简洁自然，不额外加入推断色彩。
- source_word: פְּנֵי לָבָן
  choice: 拉班的脸色
  rationale: פָּנִים字面指“脸”，在此显出人的神情和态度。汉语“脸色”既保留具体形象，也自然传达外露的态度。
- source_word: וְהִנֵּה
  choice: 只见
  rationale: הִנֵּה用于把注意力引向随后的发现；“只见”符合现代汉语叙事习惯，并保留现场感。
- source_word: אֵינֶנּוּ עִמּוֹ
  choice: 拉班待他不像
  rationale: 字面是“他不与他同在／不跟他一条心”，语境指拉班对雅各的态度已经改变。明确重复“拉班”可避免汉语代词歧义。
- source_word: כִּתְמוֹל שִׁלְשׁוֹם
  choice: 从前
  rationale: 该固定说法字面为“昨天和前天”，惯用来表示先前、以往；“从前”准确而自然。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“脸色”保留希伯来文“脸”的具体意象，也让普通读者自然领会其态度含义；“只见”传达וְהִנֵּה的提示和现场感。
