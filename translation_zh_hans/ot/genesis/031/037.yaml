  text: כִּֽי מִשַּׁ֣שְׁתָּ אֶת כָּל כֵּלַ֗/י מַה מָּצָ֨אתָ֙ מִ/כֹּ֣ל כְּלֵי בֵיתֶ֔/ךָ שִׂ֣ים כֹּ֔ה נֶ֥גֶד אַחַ֖/י וְ/אַחֶ֑י/ךָ וְ/יוֹכִ֖יחוּ בֵּ֥ין שְׁנֵֽי/נוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/037.yaml
  text: Since you have searched through all my goods[a], what have you found of all the goods of your house? Set it here before my brothers and your brothers[b], and let them judge between the two of us.
translation:
  language: zh_hans
  text: 你既然搜遍了我所有的物品，你所找到的，有什么是属于你家所有物品的？把它放在这里，当着我的弟兄和你的弟兄的面，让他们在我们两人之间评断。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִשַּׁשְׁתָּ
  choice: 搜遍了
  rationale: 该动词本指用手触摸、摸索；在搜查失物的语境中表示彻底搜查。“搜遍了”自然地表达搜查及其全面性。
- source_word: כָּל כֵּלַי
  choice: 我所有的物品
  rationale: כְּלִי 在此泛指可移动的财物、器具或物件；“物品”范围适当，也适合家庭财产的语境。
- source_word: מַה מָּצָאתָ מִכֹּל כְּלֵי בֵיתֶךָ
  choice: 究竟找到了什么属于你家的物品
  rationale: מִן 在这里具有部分意义，问题是拉班家的物品中究竟有哪一件被搜出；此译法在现代汉语中清楚表达归属关系，避免误解为搜查地点。
- source_word: שִׂים כֹּה
  choice: 把它放在这里
  rationale: 这是要求将任何被指为失物的东西公开摆出的命令；“放在这里”直接自然。
- source_word: נֶגֶד אַחַי וְאַחֶיךָ
  choice: 当着我和你双方弟兄的面
  rationale: נֶגֶד 表示在见证人面前公开呈示；“双方弟兄”保留 אַחַי 与 אַחֶיךָ 的对称结构，同时避免汉语中“我的弟兄和你的弟兄”的生硬重复。
- source_word: וְיוֹכִיחוּ
  choice: 让他们……评断
  rationale: יכח 的使役式在此具有裁断争议的司法或仲裁意味。“评断”既保留裁判色彩，也不暗示正式法庭程序。
- source_word: בֵּין שְׁנֵינוּ
  choice: 在我们两人之间
  rationale: 明确保留原文“我们两个”的数目强调，突出这是雅各与拉班双方的争执。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“搜遍”“当着……的面”“评断”兼顾叙事现场感与争议裁断的正式语气；不添加原文没有的神学解释。
