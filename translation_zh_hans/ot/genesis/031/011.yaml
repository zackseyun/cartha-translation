base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/011.yaml
  text: Then the angel of God said to me in the dream[a], ‘Jacob,’ and I said, ‘Here I am.’
translation:
  language: zh_hans
  text: 于是，上帝的使者在梦中[a]对我说：“雅各！”我说：“我在这里。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在一个梦中。”希伯来文作“在那个梦中”。
    reason: 说明希伯来文带定冠词；中文正文采用自然的“在梦中”，不强加汉语中未建立的指代对象。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 于是……对我说
  rationale: 未完成式连续体推进叙事；“于是”自然表达事件的先后，“对我说”也准确体现 אֵלַי。
- source_word: מַלְאַךְ הָאֱלֹהִים
  choice: 上帝的使者
  rationale: מַלְאָךְ 可指“使者”或“天使”。此处是来自上帝的超自然使者；“上帝的使者”既符合希伯来文的称谓，也不预先断定其更具体的身份。
- source_word: בַּחֲלוֹם
  choice: 在那个梦中
  rationale: 希伯来文带定冠词，直指“那个梦”；中文用“那个梦中”保留其特指性。
- source_word: יַעֲקֹב
  choice: 雅各
  rationale: 采用现代中文圣经中通行的人名译法。
- source_word: וָאֹמַר
  choice: 我说
  rationale: 直接呈现第一人称叙事中的回应，不额外加入原文未明说的语气。
- source_word: הִנֵּנִי
  choice: 我在这里
  rationale: 这是希伯来语表示听候吩咐、自我呈现的固定回应；“我在这里”自然且保留其响应意味。
theological_decisions:
- issue: מַלְאַךְ הָאֱלֹהִים 的身份可能引发其与上帝关系的神学讨论
  choice: 上帝的使者
  alternative: 上帝的天使
  rationale: 本节只称该说话者为“上帝的使者”，没有进一步界定其身份；译文保留这一称谓及其神学张力，不作超出经文的认定。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“那个梦中”略带书面色彩，但能清楚保留原文的特指；对话简洁，符合叙事语境。
