  text: וְ/עַתָּה֙ הָלֹ֣ךְ הָלַ֔כְתָּ כִּֽי נִכְסֹ֥ף נִכְסַ֖פְתָּה לְ/בֵ֣ית אָבִ֑י/ךָ לָ֥/מָּה גָנַ֖בְתָּ אֶת אֱלֹהָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/030.yaml
  text: And now[a], you have indeed gone away, because you longed greatly for your father's house. Why did you steal my gods?
translation:
  language: zh_hans
  text: 现在，你已经离开了，因为你十分想念父家；你为什么偷了我的神[a]呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译“我的神”。按上下文，也可理解为“我的家神”，指拉班家中的偶像。
    reason: 保留原文的字面称谓，同时说明上下文所支持的所指。
lexical_decisions:
- source_word: וְעַתָּה
  choice: 现在
  rationale: 作为话语承接语，引出拉班接下来的质问；现代汉语用“现在”即可自然表达其推进作用。
- source_word: הָלֹךְ הָלַכְתָּ
  choice: 你执意要走
  rationale: 不定式绝对式与限定动词连用，加强“走”的语气；“执意要走”在此能自然传达拉班承认雅各确实决意离开的意味。
- source_word: כִּי
  choice: 是因为
  rationale: 引出拉班所承认的离去原因，译为“是因为”使汉语因果关系清楚。
- source_word: נִכְסֹף נִכְסַפְתָּה
  choice: 你十分想念
  rationale: 不定式绝对式与限定动词连用，表达强烈的思念；“十分想念”既保留强调，也符合现代汉语表达。
- source_word: לְבֵית אָבִיךָ
  choice: 父家
  rationale: 该结构直指“你父亲的家”，并可包含家庭与家宅的意义；“父家”简洁、庄重，也不缩减为单纯地点。
- source_word: לָמָּה
  choice: 为什么
  rationale: 直接引出拉班的责问。
- source_word: גָנַבְתָּ
  choice: 偷了
  rationale: 以完成体自然表达已经发生、如今受到追问的行为。
- source_word: אֶת אֱלֹהָי
  choice: 我的神像
  rationale: 字面为“我的神”；结合上下文，所指是拉班家中可被拿走的偶像。“神像”在中文正文中能避免把可偷取之物误解为神本身，同时脚注保留更贴近形式的译法。
theological_decisions:
- issue: 如何翻译拉班所说的 אֱלֹהָי
  choice: 我的神像
  alternative: 我的神；我的家神
  rationale: 原文形式直译是“我的神”，上下文则表明所指为拉班家中的偶像。中文“神像”清楚表达实体所指；脚注说明原文字面及“家神”这一语境性译法，不据此认可其神性，也不加入宗派解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事对话体。“执意要走”和“十分想念”分别传达两处不定式绝对式的强调。“可是”呈现拉班先让步、后转入责问的语气。
