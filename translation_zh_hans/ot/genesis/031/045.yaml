  text: 于是，雅各取了一块石头，把它立作石柱[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“立石”或“纪念石”。希伯来语 מַצֵּבָה 指竖立起来作为标志的石头或石柱。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: 取来
  rationale: 该词是לקח的Qal叙事形式，基本义为“拿、取”。“取来”符合现代汉语叙事表达，又不额外限定他是拾起还是拿住。
- source_word: יַעֲקֹב
  choice: 雅各
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: אָבֶן
  choice: 一块石头
  rationale: 单数名词指一块石头；量词“块”使现代汉语表达自然。
- source_word: וַיְרִימֶהָ
  choice: 把它立作
  rationale: 动词表示举起、竖立，阴性单数宾语后缀回指אָבֶן。“立作”既表达竖立的动作，也自然衔接后面的表语מַצֵּבָה。
- source_word: מַצֵּבָה
  choice: 石柱
  rationale: 该词指竖立起来的石制标志物或柱石。“石柱”简洁地保留其物质与形态，而不预先断定其纪念性或礼仪用途。
theological_decisions:
- issue: מַצֵּבָה在可能带有纪念或礼仪含义的语境中如何翻译
  choice: 石柱
  alternative: 立石；纪念石
  rationale: 本节只明说雅各把石头竖立起来，并未在此直接界定其具体宗教或纪念功能。“石柱”保留词义及语境中的开放性，避免加入原文未明说的解释。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“于是”承接希伯来叙事链；“把它立作石柱”清楚表达宾语回指与表语关系。
