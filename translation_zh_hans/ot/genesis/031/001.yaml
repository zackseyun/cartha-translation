base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/001.yaml
  text: He heard the words of Laban’s sons[a], saying, “Jacob has taken all that belonged to our father, and from what belonged to our father he has gained all this wealth.”
translation:
  language: zh_hans
  text: 雅各听见拉班的儿子们说：“雅各把我们父亲所有的一切都拿走了，又从我们父亲的财物中得了这一切财富[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“这一切荣耀”。希伯来语这个词可指尊荣、光彩或物质财富；这里指雅各显而易见的富足。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: 雅各听见
  rationale: 该动词推进叙事，主语由上下文确定为雅各。汉语明说姓名，可使本节独立诵读时清楚自然，并不增添新的所指。
- source_word: דִּבְרֵי בְנֵי לָבָן לֵאמֹר
  choice: 拉班的儿子们说
  rationale: 将“听见……的话，说”按现代汉语自然表达整合为“听见……说”，同时保留直接引语的功能。
- source_word: לָקַח
  choice: 拿走了
  rationale: 基本义是“拿、取”。在拉班众子的指控中，“拿走了”自然传达他们认为雅各取走父亲财物的语气，但不强化成原文未必包含的“抢夺”。
- source_word: כָּל אֲשֶׁר לְאָבִינוּ
  choice: 我们父亲所有的一切
  rationale: לְ 表示归属；此译保留“所有的一切”的全面性及原话中的指控力度。
- source_word: וּמֵאֲשֶׁר לְאָבִינוּ
  choice: 又从我们父亲的财物中
  rationale: מִן 表示来源。根据财产语境补出“财物”，使现代汉语通顺，同时保留财富被说成源自其父所有之物的意思。
- source_word: עָשָׂה
  choice: 得了
  rationale: 字面可作“做成、造出”，与“这一切财富”连用时指获得或积聚。译作“得了”简明自然，也不额外限定取得方式。
- source_word: כָּל הַכָּבֹד הַזֶּה
  choice: 这一切财富
  rationale: כָּבוֹד 常指荣耀、尊荣，也可指使人显赫的财富或丰盛产业。本节谈及雅各的财产，正文译“财富”最合语境；“荣耀”作为真实的词汇可能性保留在脚注。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。直接引语保留拉班众子带有敌意的归因与重复，不替叙述者判断其指控是否属实。脚注标记置于其实际说明的“财富”之后。
