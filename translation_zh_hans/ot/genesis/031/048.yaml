  yaml_path: translation/ot/genesis/031/048.yaml
  text: And Laban said[a], “This heap is a witness between me and you today.” Therefore he called its name Galeed.
translation:
  language: zh_hans
  text: 拉班说：“今天，这石堆在你我之间作见证。”于是他给这石堆起名叫“迦累得”[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “迦累得”在希伯来语中的意思是“见证之堆”。
    reason: 说明该专名的希伯来语构词含义，并准确反映原文的命名缘由。
lexical_decisions:
- source_word: וַיֹּאמֶר לָבָן
  choice: 拉班说
  rationale: 未单独译出叙事连接词 וַ，以符合现代汉语叙事习惯；动词和人名均准确保留。
- source_word: הַגַּל הַזֶּה
  choice: 这石堆
  rationale: גַּל 在本段语境中指堆积起来的石头；“石堆”比单说“堆”更明确自然。
- source_word: עֵד
  choice: 作见证
  rationale: 这里的石堆充当双方约定的见证标志；汉语用“作见证”既自然，也保留其法律和盟约意味。
- source_word: בֵּינִי וּבֵינְךָ
  choice: 在你我之间
  rationale: 保留希伯来文分别提及双方的表达，同时采用自然凝练的现代汉语语序。
- source_word: הַיּוֹם
  choice: 今天
  rationale: 直接对应时间副词，并前置以使整句汉语自然清楚。
- source_word: עַל כֵּן
  choice: 因此
  rationale: 准确表达命名缘由与前句之间的因果关系。
- source_word: קָרָא שְׁמוֹ
  choice: 他给这石堆起名叫
  rationale: 将希伯来语常见的命名公式译成自然汉语；“这石堆”明确指出名称所指。
- source_word: גַּלְעֵד
  choice: 迦累得
  rationale: 按专名音译，并在脚注中说明该名称与“石堆”和“见证”的希伯来语双关。
